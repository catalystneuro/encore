    signs and p-values hold.
- id: fig8ce-choice-signal-onset
  statement: The choice signal emerges progressively earlier in the trial as mice become experts,
    so the onset of above-chance decoding correlates negatively with performance (r = -0.60, -0.34,
    -0.38 in mouse 2 and -0.60, -0.27, -0.28 in mouse 3 for all, excitatory and inhibitory).
  source: Results, Selectivity increases in parallel in inhibitory and excitatory populations during
    learning, paragraph 1; Figure 8C and 8E
  quote: This resulted in a negative correlation between mouse performance and the onset of
    super-threshold decoding accuracy ( Figure 8C , left; Figure 8E , black)
  statistics:
  - about: onset against performance, mice 2 and 3, each population
    test: Pearson correlation
    p: 0.05
    p_relation: "<"
  expected:
  - quantity: r, all neurons, mouse 2
    value: -0.60
    tolerance: 0.06
  - quantity: r, excitatory, mouse 2
    value: -0.34
    tolerance: 0.034
  - quantity: r, inhibitory, mouse 2
    value: -0.38
    tolerance: 0.038
  - quantity: r, all neurons, mouse 3
    value: -0.60
    tolerance: 0.06
  - quantity: r, excitatory, mouse 3
    value: -0.27
    tolerance: 0.027
  - quantity: r, inhibitory, mouse 3
    value: -0.28
    tolerance: 0.028
  depends_on:
  - fig8ab-learning-accuracy
  criterion: Decoders and mice as fig8ab-learning-accuracy, at every bin of choice-aligned traces.
    Per session and bin, accuracy against the shuffle by a t-test across the 50 repetitions; the
    onset is the start of the first run of significant bins lasting at least 500 ms (5 bins, code
    th1), in ms from the choice; sessions without such a run are left out (Methods). The Methods
    give p < 0.05; the code (svm_excInh_trainDecoder_eachFrame_plots.py) uses 0.001, shown as a
    variant. The code tests excitatory data against the inhibitory shuffle at one line (line 600);
    the excitatory shuffle is used, as the Methods describe. Reproduced when the correlation is
    negative with p < 0.05 for all three populations in each learning mouse and the six values are
    within tolerance under one reading of the mouse names; partially reproduced when only the signs
    and p-values hold.
- id: fig8de-learning-parallel
  statement: The choice signal emerges at the same time in excitatory and inhibitory populations,
    and its magnitude and timing are matched for the two cell types throughout learning.
  source: Results, Selectivity increases in parallel in inhibitory and excitatory populations during
    learning, paragraph 1; Figure 8A to 8E
  quote: Importantly, the choice signal emerged at the same time in both populations, and its
    magnitude and timing was matched for the two cell types throughout learning ( Figure 8A - C ,
    middle, right; Figure 8D - E , blue, red)
  depends_on:
  - fig8ab-learning-accuracy
  - fig8ce-choice-signal-onset
  criterion: Early and late days as the Methods give, by behavioural performance below the 20th or
    above the 80th percentile of all days; readings are (a) every day beyond the percentile (code,
    perc_thb = [20, 80]) and (b) only the run of days at the start (early) or end (late) of training
    beyond it (the Methods' "initial" and "last" days). Accuracy (bin 0-97 ms before choice) and
    onset of inhibitory and subsampled excitatory decoders in early and in late days. A claim of
    absence, judged on the paper's unpaired two-tailed t-test across days per mouse at p < 0.05.
    Reproduced when, in every learning mouse, neither accuracy nor onset differs between the cell
    types in early or late days, and late accuracy exceeds early accuracy for both types (Figure 8D).
- id: figs13c-equal-trials
  statement: The learning-related increase in decoding accuracy remains when the number of
    trials is equal in every session.
  source: Results, Selectivity increases in parallel in inhibitory and excitatory populations during
    learning, paragraph 1; Figure S13C
  quote: 'This was not due to the presence of more correct trials in later sessions: an improvement
    in classification accuracy was clear even when the number of correct trials was matched for
    each session ( Figure S13C )'
  depends_on:
  - fig8de-learning-parallel
  criterion: Decoders trained on correct trials only (legend), with the same number of trials in
    every session of a mouse, the minimum over its sessions (code, same_HRLR_acrossDays). Late
    accuracy above early accuracy for all neurons by the unpaired two-tailed t-test across days at p
    < 0.05 in every learning mouse; early and late days as fig8de-learning-parallel.
- id: figs12-licking-running
  statement: Licking and running do not explain the learning-related changes; centre-spout licks
    before left and right choices are similar early and late in training, and decoding remains
    accurate in sessions where running did not differ between choices.
  source: Results, Selectivity increases in parallel in inhibitory and excitatory populations during
    learning, paragraph 2; Figure S12
  quote: Nonetheless, when we restricted our analysis to days in which running distance was
    indistinguishable for the two choices (0-97 ms before the choice, t-test, P>0.05), classifiers
    could still accurately predict the choice ( Figure S12D )
  criterion: Licks to the centre spout in the 250 ms before the choice, as a lick-rate trace per
    choice (the bin width is not given; 10 ms is a standard choice that cannot change the sign of
    a correlation much, shown with 1 ms as a variant); per session the Pearson r of the left-choice
    and right-choice traces; early against late days (as fig8de-learning-parallel) by the unpaired
    two-tailed t-test, a claim of absence. Running distance from the wheel encoder in the bin 0-97 ms
    before choice, left against right by a t-test per session; on sessions with P > 0.05, all-neuron
    accuracy above the shuffle. Reproduced when lick correlations do not differ between early and
    late days in any learning mouse and accuracy is above the shuffle in the selected sessions of
    every mouse.
- id: fig8f-correlations-decrease
  statement: Pairwise noise correlations are higher early in training than late, for all
    combinations of neuron types.
  source: Results, Selectivity increases in parallel in inhibitory and excitatory populations during
    learning, paragraph 3; Figure 8F
  quote: Pairwise correlations in neural activity were higher early in training, when mice were
    novices, compared to late in training, when mice approached expert behavior ( Figure 8F ,
    unsaturated colors above saturated colors). This was observed for all combinations of neural
    pairs ( Figure 8F )
  criterion: Noise correlations as fig6bc-inhibitory-correlations-higher (EE, II, EI), early and
    late days as fig8de-learning-parallel. The paper gives no test; the Methods' two-tailed t-test
    (unpaired, across days per mouse) at p < 0.05 is used. Reproduced when early exceeds late for
    all three pair types in every learning mouse, significantly in at least two of the three mice
    for each type.
- id: figs13ab-pseudo-learning
  statement: Decoding accuracy of pseudo populations, which lack noise correlations, also increases
    significantly with training, so reduced noise correlations do not alone explain the improved
    accuracy.
  source: Results, Selectivity increases in parallel in inhibitory and excitatory populations during
    learning, paragraph 3; Figure S13A and S13B
  quote: Interestingly, a significant increase in the classification accuracy of pseudo populations
    was present ( Figure S13A , B )
  criterion: Pseudo populations as fig7-noise-correlations-limit-decoding, for all, subsampled
    excitatory and inhibitory decoders, bin 0-97 ms before choice, trials as fig8ab; early and late
    days as fig8de-learning-parallel. Reproduced when late exceeds early by the unpaired two-tailed
    t-test across days at p < 0.05 in every learning mouse for the all-neuron decoder, and in the
