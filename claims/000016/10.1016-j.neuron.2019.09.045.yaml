- id: figs3e-correct-error-correlation
  statement: Choice selectivity on correct and on error trials is positively correlated across
    neurons, so most neurons reflect the choice more than the stimulus, and within each mouse this
    correlation is very similar for excitatory and inhibitory neurons; it is weaker in mouse 4.
  source: Results, Individual excitatory and inhibitory neurons are similarly choice-selective,
    paragraph 2; Figure S3E
  quote: Importantly, however, within each subject, this correlation was very similar for
    excitatory vs. inhibitory neurons ( Figure S3E ), suggesting that the tendency for neurons to
    be modulated by the choice vs. the stimulus was similar in excitatory and inhibitory neurons
  statistics:
  - about: example session, excitatory neurons
    test: Pearson correlation
    statistic: r = 0.58
    p: 0.001
    p_relation: "<"
  - about: example session, inhibitory neurons
    test: Pearson correlation
    statistic: r = 0.55
    p: 0.007
  criterion: Per session and neuron, AUC on correct trials and AUC on error trials (same left
    against right labels, bin 0-97 ms before choice); Pearson r across neurons per cell type; per
    mouse the mean r across sessions. Sessions need at least 10 error trials of each choice (the
    code's ROC threshold, applied to error trials; a reading). Reproduced when the mean r is
    positive for both types in every mouse, the excitatory and inhibitory means do not differ in any
    mouse by the paper's unpaired two-tailed t-test across sessions at p < 0.05, and mouse 4 has the
    lowest mean r for at least one type.
- id: fig3bc-decoding-similar
  statement: Choice can be decoded from population activity well above chance, and inhibitory
    populations decode it as accurately as excitatory populations of the same size, in every
    mouse.
  source: Results, Choice is decoded with equal accuracy from both excitatory and inhibitory
    populations, paragraph 2; Figure 3B and 3C
  quote: Classification accuracy of inhibitory neurons was well above chance and was very similar to
    that of excitatory neurons ( Figure 3B , red and blue traces overlap; Figure S4 ... Similar
    classification accuracy for excitatory and inhibitory populations was observed in all subjects
    ( Figure 3C )
  criterion: Decoders as in the opening comment, correct trials, bin 0-97 ms before the choice, per
    session the accuracy averaged over the 50 repetitions (and over the 50 excitatory subsamples).
    Per mouse, accuracy is above chance when it exceeds the shuffled control by an unpaired
    two-tailed t-test across sessions at p < 0.05. Equality is a claim of absence, judged on the
    paper's unpaired two-tailed t-test across sessions per mouse (code,
    svm_excInh_trainDecoder_eachFrame_plots_sumAllMice.py, ttest_ind) at p < 0.05. Reproduced when
    in every mouse both cell types are above chance and do not differ; partially reproduced when
    they differ in one mouse. Mean accuracies are reported.
- id: fig3b-decoding-time-course
  statement: Accuracy of the all-neuron choice decoder grows after stimulus onset and peaks at the
    time of the choice.
  source: Results, Choice is decoded with equal accuracy from both excitatory and inhibitory
    populations, paragraph 1; Figure 3B
  quote: Classification accuracy gradually grew after stimulus onset and peaked at the time of the
    choice ( Figure 3B , black)
  criterion: All-neuron decoder trained and tested on each 97 ms bin of choice-aligned traces,
    correct trials; per mouse the mean over sessions. Figure 3B is one session; tested on the mouse
    means. "At the time of the choice" is read as (a) the peak in one of the two bins around the
    choice (97 ms before to 97 ms after) and (b) the peak within 300 ms of the choice. Reproduced
    when in every mouse the earliest choice-aligned bin is lower than the bin before the choice and
    the peak lies in the window.
- id: fig3df-weights-similar
  statement: In the decoder trained on all neurons, excitatory and inhibitory neurons receive
    weights of matched magnitude throughout the trial and with very similar distributions.
  source: Results, Choice is decoded with equal accuracy from both excitatory and inhibitory
    populations, paragraph 3; Figure 3D, E and F
  quote: The weight magnitudes of excitatory and inhibitory neurons were matched for the entire
    trial ( Figure 3D ), and the distributions of weights was very similar ( Figures 3E , F )
  statistics:
  - about: excitatory against inhibitory absolute weight, per mouse (Figure 3F)
    test: t-test
    p: 0.05
    p_relation: "<"
  expected:
  - quantity: excitatory neurons pooled over all sessions (Figure 3E)
    value: 42019
    tolerance: 4202
  - quantity: inhibitory neurons pooled over all sessions (Figure 3E)
    value: 5172
    tolerance: 517
  criterion: All-neuron decoder at the best C, weights averaged over the 50 repetitions, each
    session's weight vector normalised to unit length (Methods); mean |w| per cell type per session
    at 0-97 ms before choice and per bin. Figure 3F marks a significant difference (star) in some
    mice that the text does not name. Judged on the paper's unpaired two-tailed t-test across
    sessions per mouse at p < 0.05. Reproduced when no mouse differs, partially reproduced when one
    or two mice do, not reproduced otherwise; the pooled counts are compared with the expected
    values, and the mean |w| per mouse is reported.
- id: fig3hi-mixed-no-advantage
  statement: A population of half excitatory and half inhibitory neurons decodes choice no more
    accurately than an excitatory population of the same size.
  source: Results, Choice is decoded with equal accuracy from both excitatory and inhibitory
    populations, paragraph 4; Figure 3H and 3I
  quote: Classification accuracy was similar for both decoders ( Figure 3H , I ), arguing that a
    mixed population offers no major advantage to decoding
  criterion: As the code (svm_excInh_trainDecoder_eachFrame.py, excInhHalf and allExc2inhSize) the
    mixed population is all n inhibitory neurons plus a random subsample of n excitatory neurons,
    and the control is 2n excitatory neurons, both over 50 subsamples; correct trials, bin 0-97 ms
    before choice. A claim of absence, judged on the paper's unpaired two-tailed t-test across
    sessions per mouse at p < 0.05. Reproduced when no mouse shows the mixed population
    significantly more accurate; the difference per mouse is reported.
- id: figs5-fluorescence-decoding
  statement: Excitatory and inhibitory populations are equally choice selective when decoders are
    trained on fluorescence traces.
  source: Results, Choice is decoded with equal accuracy from both excitatory and inhibitory
    populations, paragraph 2; Figure S5
  quote: Excitatory and inhibitory populations were equally choice selective even when the analysis
    was performed on raw calcium traces ( Figure S5 )
  criterion: As fig3bc-decoding-similar, with the CNMF denoised fluorescence traces (Figure S5A
    uses those of Figure 1D middle; code option do_Ctrace) in place of inferred spikes. The legend
    calls them fluorescence traces and the text raw calcium traces; readings are (a) the denoised
    traces and (b) Delta F/F traces. Same test and outcome rule.
- id: figs6ab-previous-choice-stimulus
  statement: Population activity is weakly informative about the previous trial's choice and about
    the stimulus category, and excitatory and inhibitory populations are similarly selective for
    both.
  source: Results, Choice is decoded with equal accuracy from both excitatory and inhibitory
    populations, paragraph 5; Figure S6A and S6B
  quote: Excitatory and inhibitory populations were similarly selective for previous choice (
    Figure S6A ). The population activity was also somewhat informative about whether the stimulus
    was above or below the category boundary ( Figure S6B ). Again, excitatory and inhibitory
    populations were similarly selective
  criterion: Decoders as in the opening comment. Stimulus category uses stimulus-aligned trials
    with equal numbers of left and right choices in each category (Methods). For previous choice the
    paper gives no alignment or window; readings are (a) choice-aligned traces, bin 0-97 ms before
