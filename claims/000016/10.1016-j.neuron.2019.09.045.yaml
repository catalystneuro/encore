    Reproduced when, for both decoders, the all-neuron decoder is above chance in most mice and no
    mouse other than mouse 4 (excepted for stimulus category by the legend) shows an excitatory to
    inhibitory difference. The bin for stimulus category is (a) 0-97 ms before stimulus offset and
    (b) the bin of peak all-neuron accuracy; the paper fixes neither.
- id: figs6c-outcome-decoding
  statement: Population activity is strongly selective for trial outcome, reaching about 80%
    accuracy (median across mice) about 400 ms after the confirmation lick, with inhibitory neurons
    slightly more accurate than excitatory neurons after reward.
  source: Results, Choice is decoded with equal accuracy from both excitatory and inhibitory
    populations, paragraph 5; Figure S6C
  quote: Classification accuracy gradually increases and reaches 80% (median across mice)
    approximately 400ms after the animal confirms his choice (Figure S1A). Inhibitory neurons
    showed slightly higher selectivity for the outcome
  expected:
    quantity: outcome decoding accuracy about 400 ms after the confirmation lick, median across mice
    value: 80
    tolerance: 8
    unit: percent
  criterion: Outcome-aligned trials (aligned to the confirmation lick, the reward time), with equal
    numbers of left and right choice trials for each outcome (Methods); decoders otherwise as in the
    opening comment. The all-neuron accuracy at the bin containing 400 ms after the confirmation
    lick, mean over sessions per mouse, median over mice, within tolerance. Inhibitory above
    subsampled excitatory in every mouse, in the mean over bins from 0 to 500 ms after the
    confirmation lick (the paper's "after reward delivery"; the end of the window is a reading),
    with a significant difference by the unpaired two-tailed t-test across sessions in at least two
    mice. Reproduced when both hold.
- id: figs6de-incorrect-trials
  statement: Decoders trained on correct trials predict the choice on incorrect trials with high
    accuracy, slightly lower than on correct trials, and the reduction is similar for excitatory and
    inhibitory populations in every mouse.
  source: Figure S6D and S6E
  quote: Importantly, for all mice, the change in classification accuracy was quite similar for
    excitatory and inhibitory neurons (right), indicating that both populations reflect choice vs.
    stimulus to a comparable degree
  criterion: Decoders trained on correct trials at each bin and tested on held-out correct trials
    and on incorrect trials (code, testIncorr); bin 0-97 ms before choice. Accuracy on incorrect
    trials is high when above the shuffle by the unpaired two-tailed t-test across sessions per
    mouse. The reduction (correct minus incorrect) of inhibitory and subsampled excitatory decoders
    is compared by the same test; a claim of absence. Reproduced when incorrect-trial accuracy is
    above the shuffle in every mouse and the reductions do not differ significantly in any mouse;
    mouse 4 should have the largest reduction for the all-neuron decoder.
- id: fig4bd-stability-similar
  statement: Choice decoders lose accuracy at a similar rate away from their training time for
    excitatory and inhibitory populations, and their stability duration is indistinguishable.
  source: Results, Choice is decoded with equal accuracy from both excitatory and inhibitory
    populations, paragraph 6; Figure 4B, C and D; Figure S7A
  quote: This drop in accuracy occurred at a similar rate for excitatory and inhibitory populations
    ( Figure 4B ). To quantify this, we determined the time window over which classifier accuracy
    remained within 2 standard deviations of the accuracy at the training time ( Figure 4C ). This
    was indistinguishable for excitatory and inhibitory neurons ( Figure 4D ; Figure S7A )
  criterion: Decoders trained at each bin and tested at every bin on held-out trials (Methods),
    correct trials. For the decoder trained at 0-97 ms before choice, a test bin counts as stable
    when its accuracy is at least the accuracy at the training bin minus 2 standard deviations
    across the 50 repetitions (Methods and Figure 4C legend). The code
    (svm_excInh_trainDecoder_eachFrame_stabTestTimes_setVars_post.py) uses 2 standard errors
    (SD over the square root of the number of repetitions); since the Methods say standard
    deviations, the code's choice is shown as a variant. Stability duration is the number of stable
    bins times 97 ms (code, bins not required to be contiguous; contiguous bins around the training
    bin shown as a variant). Excitatory durations are averaged over the 50 subsamples. Sessions
    where the training-bin accuracy does not exceed the shuffle are left out (code, one-tailed
    t-test across repetitions; the code's alpha 0.001 and the Methods' general 0.05 are both
    readings). A claim of absence, judged on the code's test, an unpaired two-tailed t-test of the
    four mouse means (svm_excInh_trainDecoder_eachFrame_stabTestTimes_plots.py, ttest_ind across
    mice); the per-mouse test across sessions is shown as a variant. Reproduced when that test finds
    no difference.
- id: figs7c-angle-stability
  statement: The angle between decoders trained at different times shows a similar time course of
    stability for excitatory and inhibitory populations.
  source: Results, Choice is decoded with equal accuracy from both excitatory and inhibitory
    populations, paragraph 6; Figure S7C
  quote: An alternate method for assessing stability, computing the angle between the weights of
    pairs of classifiers trained at different time windows, likewise suggested that excitatory and
    inhibitory populations are similarly stable
  criterion: Angle in degrees between the weight vectors (averaged over repetitions) of decoders
    trained at each pair of bins, per session and cell type (excitatory over the 50 subsamples). The
    paper gives no summary or test; readings are (a) the mean angle over all pairs of bins and (b)
    the mean angle between the decoder at 0-97 ms before choice and each other bin. A claim of
    absence, judged on the paper's unpaired two-tailed t-test across sessions per mouse at p < 0.05.
    Reproduced when no mouse shows a significant difference.
- id: fig5a-nonselective-model
  statement: In a model with non-selective inhibition, inhibitory neurons decode the choice less
    accurately than excitatory neurons for every ratio of excitatory-to-inhibitory to
    inhibitory-to-excitatory connection strength.
  source: Results, Modeling rules out decision circuits with non-selective inhibition, paragraph 2;
    Figure 5A; Figure S8
  quote: For this value (and indeed for all other values), inhibitory neurons had lower
    classification accuracy than excitatory neurons ( Figure 5A , bottom; Figure S8 , left),
    inconsistent with our experimental results
  criterion: A simulation, not a test on recorded data. The linearised rate model of the STAR
    Methods with the printed parameters (sigma 1.25, delta 0.75, wEE 0.25, wII -2, wIE(0) 0.87,
    wEI(0) -0.87, c 0.1, NE 4000, NI 1000, n 50, h0 0.1), decoding accuracy Phi(sqrt(S/N)/2) from
    the input-averaged S/N, one network per point, the product wIE*wEI held at the reference while
    the ratio varies. The range of the ratio is not given; the range is read from Figure 5 if the
    PDF is supplied, otherwise 0.1 to 10 on a log scale (a standard choice). Reproduced when
    inhibitory accuracy is below excitatory at every value.
- id: fig5bc-selective-models-match
  statement: In signal-selective and SNR-selective models, inhibitory and excitatory neurons have
    matched decoding accuracy near the biologically plausible regime of equal excitatory-to-inhibitory
    and inhibitory-to-excitatory strengths.
  source: Results, Modeling rules out decision circuits with non-selective inhibition, paragraphs 3
    and 4; Figure 5B and 5C
  quote: In this circuit architecture, inhibitory and excitatory neurons had matched classification
    accuracy when the connection strength from excitatory to inhibitory neurons was about the same
    as the strength from inhibitory to excitatory
  criterion: A simulation, not a test on recorded data. As fig5a-nonselective-model; signal-selective
    with rho 0.75 and the input split by population, averaged over 25 networks and 100 random picks
    of 50 neurons; SNR-selective with W_IE scaled by (r_j/NE)^4 and rescaled to the same mean.
    Reproduced when, for each model, the excitatory and inhibitory accuracy curves cross within a
    factor of 2 of a ratio of 1 (a reading of "about the same" and "near"), and when inhibitory
    accuracy rises faster than excitatory with the ratio in all three models.
- id: figs9-signal-selective-best
  statement: The signal-selective model has the highest decoding accuracy of the three models at
    every connection-strength ratio and level of differential correlations, in both cell types.
  source: Results, Modeling rules out decision circuits with non-selective inhibition, paragraph 6;
    Figure S9
  quote: For all values of this parameter and in both cell types, signal-selective model has the
    highest classification accuracy for decoding the animal's choice
  criterion: A simulation, not a test on recorded data. As fig5bc-selective-models-match, with
    differential correlations added as Sigma to Sigma + epsilon Delta h Delta h^T for epsilon 0,
    0.25 and 0.5 (Figure S8 legend; which Sigma is garbled in the text, read as both Sigma_EE and
    Sigma_II, and as Sigma_EE only, two readings). The paper says "significantly" without a test; the
    claim is judged on the ordering. Reproduced when the signal-selective accuracy is highest at
    every ratio, epsilon and cell type.
- id: fig6a-same-selectivity-correlations
  statement: Noise correlations are stronger between neurons with the same choice selectivity than
    between neurons with opposite selectivity, for excitatory-inhibitory, excitatory-excitatory and
    inhibitory-inhibitory pairs, significant in every mouse except mouse 3 for EE and II pairs; the
    same holds in the spontaneous pre-trial period.
  source: Results, Correlations are stronger between similarly tuned neurons, paragraph 1; Figure
    6A; Figure S10A
  quote: Indeed, neurons with the same choice selectivity had stronger correlations ( Figure 6A )
  statistics:
  - about: same against opposite selectivity, each pair type and mouse
    test: t-test
    p: 0.05
    p_relation: "<"
  criterion: As the Methods and code (imaging/corr_excInh_plots.m and corr_excInh_setVars.m)
    neurons are "ipsi" or "contra" preferring by the sign of AUC - 0.5 at 0-97 ms before choice (AUC
    from correct trials; significance not required); noise correlations from the same bin on trials
    with a choice, after subtracting each choice's mean response from its trials; Pearson r per
    pair; each neuron's r averaged over its partners of the given type and preference. Spontaneous
    correlations use the bin 0-97 ms before the initiation tone, without subtraction. The code tests
    same against opposite with an unpaired t-test on neurons pooled over sessions (ttest2); the
    across-session test (the legend's mean +/- SEM across days) is shown as a variant. Reproduced
    when same exceeds opposite significantly (p < 0.05) for EI pairs in all four mice and for EE and
    II pairs in mice 1, 2 and 4; partially reproduced when this holds for at least two of the three
    pair types.
- id: fig6bc-inhibitory-correlations-higher
  statement: Inhibitory pairs have significantly higher noise correlations than excitatory pairs,
    with intermediate values for excitatory-inhibitory pairs, also for spontaneous correlations and
    for neurons matched in spiking activity.
  source: Results, Correlations are stronger between similarly tuned neurons, paragraph 2; Figure
    6B and 6C; Figure S10B to S10E
  quote: Inhibitory pairs had significantly higher noise correlations compared to excitatory pairs
    ... This was true even when we restricted the analysis to inhibitory and excitatory neurons with
    the same inferred spiking activity ( Figure S10D , E ). Finally, similar to previous reports ...
    we found intermediate correlations for pairs consisting of one inhibitory neuron and one
    excitatory neuron ( Figure S10B , C )
  expected:
  - quantity: excitatory neurons in the example mouse distribution (Figure 6B)
    value: 11867
    tolerance: 1187
  - quantity: inhibitory neurons in the example mouse distribution (Figure 6B)
    value: 1583
    tolerance: 158
  criterion: Per-neuron noise correlation as in fig6a-same-selectivity-correlations, averaged over
    partners of the same type (EE, II) or the other type (EI), bin 0-97 ms before choice; spontaneous
    as there; matched activity by the 50-bin "max bin" rule of the Methods. Readings for the test,
    an unpaired two-tailed t-test (Methods), are (a) across sessions per mouse on session means
    (Figure 6C, mean +/- SEM across days) and (b) on neurons pooled over sessions (code,
    utils/plotHist.m). Reproduced when II exceeds EE significantly in every mouse for noise,
    spontaneous and matched-activity correlations, with EI between them in the mean; the expected
    counts are matched by one mouse (the example mouse is not named).
- id: fig7-noise-correlations-limit-decoding
  statement: Removing noise correlations by building pseudo populations increases choice decoding
    accuracy of the full population in every mouse.
  source: Results, Noise correlations limit decoding accuracy, paragraph 2; Figure 7A and 7B
  quote: In all mice, removing noise correlations resulted in a consistent increase in
    classification accuracy ( Figure 7B ; filled vs. open circles), establishing that noise
    correlations limit population accuracy in PPC
  criterion: All neurons, bin 0-97 ms before choice; neurons ranked by |AUC - 0.5| and added one at
    a time from the most selective (Methods); the AUC used for ranking is from all trials with a
    choice in the code (svm_excInh_trainDecoder_eachFrame.py), and from correct trials as a variant.
    Pseudo populations shuffle trial order independently for each neuron within left-choice and
    within right-choice trials (Methods). The change is pseudo minus real accuracy at the largest
    ensemble (Methods; code changeCA_shflTrsEachN). Trials are correct trials (as the other Figure 3
    decoders); all trials with a choice is a second reading. Reproduced when the mean change across
    sessions is positive in every mouse and significant by the two-tailed t-test across sessions at p
    < 0.05, read as (a) a one-sample test of the per-session changes and (b) an unpaired test of
    pseudo against real accuracy, in every mouse.
- id: fig8ab-learning-accuracy
  statement: During learning, choice decoding accuracy increases and correlates with behavioural
    performance across sessions, for all, excitatory and inhibitory populations (r = 0.55, 0.35,
    0.32 in mouse 2 and 0.57, 0.63, 0.32 in mouse 3).
  source: Results, Selectivity increases in parallel in inhibitory and excitatory populations during
    learning, paragraph 1; Figure 8A, 8B and 8D
  quote: Classification accuracy of the choice decoder increased consistently as animals became
    experts in decision-making ( Figure 8A , left; Figure 8D , black), leading to a strong
    correlation between classifier accuracy and mouse performance over training ( Figure 8B , left)
  statistics:
  - about: accuracy against performance, example mouse, each population
    test: Pearson correlation
    p: 0.001
    p_relation: "<"
  - about: accuracy against performance, mice 2 and 3, each population
    test: Pearson correlation
    p: 0.05
    p_relation: "<"
  expected:
  - quantity: r, all neurons, mouse 2
    value: 0.55
    tolerance: 0.055
  - quantity: r, excitatory, mouse 2
    value: 0.35
    tolerance: 0.035
  - quantity: r, inhibitory, mouse 2
    value: 0.32
    tolerance: 0.032
  - quantity: r, all neurons, mouse 3
    value: 0.57
    tolerance: 0.057
  - quantity: r, excitatory, mouse 3
    value: 0.63
    tolerance: 0.063
  - quantity: r, inhibitory, mouse 3
    value: 0.32
    tolerance: 0.032
  criterion: The 3 mice imaged through learning (by Figure S1C, mice 1, 2 and 4; the code's
    fni16, fni17, fni19). A decoder per session, bin 0-97 ms before choice. Trials are all outcomes
    in the code's learning script (svm_excInh_trainDecoder_eachFrame_beh_sumAllMice_plots.py,
    corrTrained = 0); readings are (a) all trials with a choice, balanced only by choice, and (b)
    equal numbers of correct and incorrect trials within each choice (the code's
    decodeChoiceEqCorrIncorr option). Performance is the fraction correct on easy trials (Figure 8B
    legend); easy as the code (stabAngles_setVars_behCA.py, thQStimStrength = 3), the outermost of
    four equal bins of |rate - 16 Hz| on each side. The legend's "mouse 2" and "mouse 3" can be read
    as (a) the second and third of the three learning mice in the paper's numbering (mice 2 and 4)
    and (b) the paper's mice 2 and 3; the example mouse is the remaining one. Reproduced when in each
    learning mouse r is positive with p < 0.05 for all three populations and the six reported values
