# Claims for Najafi, Elsayed, Cao, Pnevmatikakis, Latham, Cunningham & Churchland (2020), Neuron
# 105, 165-179, on dandiset 000016.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21, protocol
# pilot-10 as stated in docs/protocol.md.
#
# Text read: the accepted author manuscript in PubMed Central (PMC6952547, NIHMS1545193), full text
# with Results, figure legends and STAR Methods, and its supplement (NIHMS1545193-supplement-1.pdf,
# legends of Figures S1 to S15), as extracted under paper/. The version of record PDF was not read;
# the main figures were not seen, only their legends. The bioRxiv preprint (10.1101/354340) is an
# earlier version and was not used.
#
# Code read: github.com/farznaj/imaging_decisionMaking_exc_inh, commit
# b7352acd22197facd0c54475c4deb26a65086c46 (2023-09-07), the paper's analysis code. It holds MATLAB
# preprocessing (CNMF, inhibitory identification, trial alignment, ROC in imaging/), behaviour
# (behavior/, logistic regression of trial history) and Python decoding (utils/lassoClassifier/, SVM
# per time bin, stability, weights, noise-correlation shuffles, learning). The batch scripts that
# set the parameters of the published runs are not in it, and its scripts do not agree on every
# setting; where a criterion follows the code, the file and setting are named.
#
# Data the paper used (STAR Methods, Quantification and statistical analysis). Gad2-IRES-Cre x Ai14
# mice (tdTomato in all GABAergic neurons), GCaMP6f injected in layer 2/3 of left PPC, two-photon
# imaging at about 30 Hz (512 x 512 pixels). 135 sessions from 4 mice (45, 48, 7 and 35 sessions per
# mouse; the paper calls them mouse 1 to 4 and gives no other name), median 213, 253, 264 and 222
# trials per session. On average 480 neurons per session, about 40 inhibitory, 330 excitatory and
# 100 unsure (neither class). In 3 mice (mice 1, 2 and 4 by Figure S1C; the code's learning script
# uses fni16, fni17 and fni19) the same field of view was imaged through learning, 35 to 48 days.
# Behaviour of 10 mice is in Figure 1B and S1B; only the 4 imaged mice are in the dandiset by its
# description. Task: a 1 s train of simultaneous clicks and flashes at 5 to 27 Hz; the mouse licks
# left or right for high or low rate against a 16 Hz boundary (rewarded randomly at 16 Hz); trial
# events are the initiation tone, centre lick, stimulus, go tone, first side lick (the choice) and
# confirmation lick (reward). Measured variables: CNMF ROIs with their class (excitatory,
# inhibitory, unsure), Delta F/F traces and inferred spiking activity (FOOPSI deconvolution), lick
# and wheel (running) signals, trial outcomes and stimulus rates. The dandiset's description says
# each NWB file is one session, with ROI type and quality, a trial table and trial-segmented
# responses aligned to trial events.
#
# Methods common to all claims on recorded data, from the STAR Methods unless the code is named.
# - Analyses use inferred spiking activity, normalised so each neuron's maximum is 1, averaged in
#   non-overlapping bins of 3 frames (97 ms), aligned to the choice (first side lick after the go
#   tone). The "0-97 ms before choice" bin is the 3 frames before the choice frame
#   (svm_excInh_trainDecoder_eachFrame.py, "time bin -1 always includes average of 3 frames
#   before eventI"); the choice frame is the frame nearest the first side lick (findFrame0.m).
# - Trials (code, behavior/setTrs2rmv.m and set_outcomes_allResp.m) exclude the first trials of a
#   session, helped trials, and trials without a correct or incorrect choice; change-of-mind trials
#   are left out of choice-aligned traces.
# - Single-neuron ROC: AUC between left-choice ("ipsi", the code's name) and right-choice trials,
#   correct trials only, excluding 16 Hz trials (code, choicePref_ROC_exc_inh.m, outcome2ana
#   'corr'). Selectivity 2*|AUC-0.5|. Significance against 50 label shuffles; the code fits a normal
#   distribution to the shuffled AUCs and calls a neuron selective when
#   normpdf(AUC)/normpdf(mean) <= 0.05 (choicePref_ROC_exc_inh_plots_setVars.m lines 469-470,
#   equivalent to |z| >= 2.45); this follows the code where the Methods' "probability of the actual
#   AUC being drawn from the shuffled AUC distribution" is open. Sessions need at least 10 trials of
#   each choice (code, thMinTrs = 10).
# - Decoders: linear SVM (sklearn LinearSVC, L2, squared hinge) per 97 ms bin; each neuron z-scored
#   per bin over the session's trials (code, with 5e-4 added to the SD); left and right trials
#   matched by random subsampling; 50 repetitions of a random 90/10 train/test split; C chosen from
#   10^(-6 to 6 in steps of 0.2) divided by the number of trials, the one with minimum mean test
#   error (code, smallestC = 0, as the Methods' "smallest error"), separately per bin; accuracy is
#   the mean over the 50 repetitions; shuffled control scores the same predictions against permuted
#   test labels. All-neuron decoders include unsure neurons; excitatory decoders use 50 random
#   subsamples of as many excitatory neurons as the session has inhibitory neurons. At least 10
#   correct trials per choice. Figures 3, 4 and 7 use correct trials (code, corrTrained = 1 in
#   svm_excInh_trainDecoder_eachFrame_plots_sumAllMice.py and the stability scripts).
# - Statistics: two-tailed t-test (STAR Methods); the code uses unpaired tests (ttest2, ttest_ind)
#   throughout. Correlations are Pearson's.
# - Where a criterion names readings, the notebook runs each; the outcome is the one they all
#   give, and when they give different outcomes the claim is blocked as methods_underspecified,
#   with every result shown.
