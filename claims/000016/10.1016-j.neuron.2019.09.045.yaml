    tolerance: 21.3
  - quantity: median trials per session, mouse 2
    value: 253
    tolerance: 25.3
  - quantity: median trials per session, mouse 3
    value: 264
    tolerance: 26.4
  - quantity: median trials per session, mouse 4
    value: 222
    tolerance: 22.2
  - quantity: neurons per session, mean
    value: 480
    tolerance: 48
  - quantity: inhibitory neurons per session, mean
    value: 40
    tolerance: 4
  - quantity: excitatory neurons per session, mean
    value: 330
    tolerance: 33
  - quantity: inhibitory fraction of neurons
    value: 0.11
    tolerance: 0.011
  criterion: Mice are matched to the paper's mouse 1 to 4 by their session counts (45, 48, 7, 35).
    Neurons are the ROIs kept as good quality; counts per session from the ROI type labels. The
    session counts per mouse are compared as well; trials per session are counted (a) as all trials
    in the trial table and (b) as trials with a correct or incorrect choice, the paper not saying
    which. The inhibitory fraction is read (a) as inhibitory over all neurons and (b) as inhibitory
    over excitatory plus inhibitory. Reproduced when every value is within tolerance under one
    reading of each.
- id: fig1b-psychometric
  statement: Choices depend strongly on stimulus rate, at chance at the 16 Hz boundary and more
    accurate for rates further from it.
  source: Results, paragraph 1; Figure 1B
  quote: 'Decisions depended strongly on stimulus rate: performance was at chance when the stimulus
    rate was at the category boundary, and was better at rates further from the category boundary'
  criterion: Figure 1B uses 10 mice; only the 4 imaged mice can be tested here, which is recorded
    as a deviation. Per mouse, trials of all sessions with a left or right choice; the fraction of
    "high" choices per stimulus rate, and a logistic regression of the high choice on rate (as the
    legend's glmfit). The paper gives no test; the fit's slope is the measure, as a positive slope
    is choice accuracy rising with distance from the boundary. Chance at 16 Hz holds by design (the
    Methods reward 16 Hz randomly) and the fraction of high choices at 16 Hz is reported. Reproduced
    when, in every mouse, the slope is positive at p < 0.05.
- id: figs1b-trial-history
  statement: Choice depends on current stimulus strength, on the previous trial's outcome and on
    the time since the previous trial; the effect of a previous success is stronger after a short
    ITI, and ITI has no significant effect after a failure.
  source: Figure S1B; Results, paragraph 1
  quote: 'Top left: strength of the sensory evidence affects the animal''s choices: the stronger the
    evidence, the higher the impact. Top middle: Success of a previous trial also affects animal''s
    decision; the effect is stronger when the previous success occurs after a short ITI (<7sec).
    Top Right: Same but for previous incorrect trials; the effect of ITI after a failure was not
    significant'
  criterion: The model of STAR Methods eq. 1 per session (glmfit, binomial, logit), predicting a
    left choice. Stimulus strength as six bins of |rate - 16 Hz| of width 2 Hz (0-2, 2-4, ..., 10-12
    Hz; code, behavior/trialHist_logisRegress_setVar.m with vec_ratesdiff = 0:2:12), signed by the
    side the rate favours; previous success and previous failure each split at an ITI of 7 s (code,
    vec_iti); trials with ITI over 30 s set aside (code). The ITI is the time from the previous
    choice to the current stimulus onset (Methods). The figure plots coefficients averaged over
    animals (10 mice; here 4) with SEM. The paper names no test; the two-tailed t-test of the
    Methods is used across mice, and across sessions per mouse as a second reading. Reproduced when
    the stimulus coefficients grow with strength (the largest bin above the smallest), the short-ITI
    success coefficient exceeds the long-ITI one significantly, and the two failure coefficients do
    not differ significantly (absence judged on that t-test).
- id: fig1gi-inferred-spiking-differs
  statement: Inferred spiking activity differs significantly between inhibitory and excitatory
    neurons throughout the trial, and in the bin just before the choice in every mouse.
  source: Results, paragraph 4; Figure 1G, H and I
  quote: The magnitude of inferred spiking activity was significantly different for inhibitory vs.
    excitatory neurons throughout the trial ( Figure 1G ; t-test, p<0.001). Just before the choice
    (97 ms, average of 3 frames), this difference was clear ( Figure 1H ) and significant for all
    mice ( Figure 1I , t-test; p<0.001)
  statistics:
  - about: inhibitory against excitatory, through the trial, example mouse
    test: t-test
    p: 0.001
    p_relation: "<"
    n: 46 days, example mouse
  - about: inhibitory against excitatory, 0-97 ms before choice, each mouse
    test: t-test
    p: 0.001
    p_relation: "<"
  expected:
  - quantity: excitatory neurons pooled over all sessions (Figure 1H)
    value: 41723
    tolerance: 4172
  - quantity: inhibitory neurons pooled over all sessions (Figure 1H)
    value: 5142
    tolerance: 514
  criterion: Correct trials (code, excInh_FRs.py). The bin 0-97 ms before the choice; activity
    averaged over trials per neuron. The paper does not say over what unit its t-test runs; the code
    (excInh_FRs.py) tests both, so the readings are (a) an unpaired two-tailed t-test across days of
    the day means (legend of 1I, mean +/- SEM across days) and (b) the same test on neurons pooled
    over days. The text does not say which cell type is higher; the direction is reported.
    Reproduced when p < 0.001 in every mouse, and for the example-mouse time course in every
    choice-aligned bin of at least one mouse under reading (a).
- id: fig2a-example-session
  statement: In an example session (285 excitatory and 29 inhibitory neurons), 24 excitatory (8%)
    and 5 inhibitory (17%) neurons were significantly choice selective just before the choice.
  source: Figure 2A legend
  quote: Data correspond to the 97 ms window preceding choice (285 excitatory and 29 inhibitory
    neurons) ... 5 inhibitory and 24 excitatory neurons (17% and 8%, respectively) were significantly
    choice selective
  expected:
  - quantity: significantly selective excitatory neurons, example session
    value: 24
    tolerance: 2.4
  - quantity: significantly selective inhibitory neurons, example session
    value: 5
    tolerance: 0.5
  criterion: The session is not named; it is the session with 285 excitatory and 29 inhibitory
    neurons, if exactly one has these counts. ROC as in the opening comment. The shuffle makes
    counts vary from run to run, like a random seed; as a standard choice the 50-shuffle procedure
    is repeated 20 times, and the claim is reproduced when the median count is within tolerance. Not testable if no session has
    these counts.
- id: fig2bc-fraction-selective-similar
  statement: Excitatory and inhibitory neurons have a similar fraction of significantly
    choice-selective neurons just before the choice (median across mice 13% and 16%, about 43
    excitatory and 6 inhibitory neurons per session).
  source: Results, Individual excitatory and inhibitory neurons are similarly choice-selective,
    paragraph 1; Figure 2C
  quote: Importantly, excitatory and inhibitory neurons were similar in terms of the fraction of
    choice-selective neurons ( Figure 2B , C ; Figure S3B , C )
  statistics:
  - about: excitatory against inhibitory fraction, per mouse (a star in mouse 4 only, by the Figure
      S3D legend)
    test: t-test
    p: 0.05
    p_relation: "<"
    n: 45, 48, 7 and 35 sessions per mouse
  expected:
  - quantity: fraction of selective excitatory neurons, median across mice
    value: 0.13
    tolerance: 0.013
  - quantity: fraction of selective inhibitory neurons, median across mice
    value: 0.16
    tolerance: 0.016
  - quantity: selective excitatory neurons per session
    value: 43
    tolerance: 4.3
  - quantity: selective inhibitory neurons per session
    value: 6
    tolerance: 0.6
  criterion: ROC as in the opening comment, bin 0-97 ms before the choice (Methods). Per session
    the fraction of each cell type that is selective; per mouse the mean over sessions, then the
    median over the 4 mice. A claim of absence, judged on the paper's test, an unpaired two-tailed
    t-test across sessions per mouse at p < 0.05 (Methods and code, ttest2). The paper reports a
    significant difference in mouse 4 only. Reproduced when the two medians are within tolerance and
    no significant difference is found in mice 1, 2 and 3; partially reproduced when only the
    t-tests hold. The per-session counts are read as the median across mice of the mean count per
    session. The normal-fit criterion is the code's; an empirical p from the 50 shuffles (two-sided,
    fraction of shuffles at least as far from 0.5) is shown as a variant.
- id: fig2bd-selectivity-time-course
  statement: The fraction of choice-selective neurons and the magnitude of choice selectivity
    increase gradually over the trial and peak just after the choice.
  source: Results, Individual excitatory and inhibitory neurons are similarly choice-selective,
    paragraph 1; Figure 2B and 2D
  quote: The fraction of choice-selective neurons ( Figure 2B ) and the magnitude of choice
    selectivity ( Figure 2D ) gradually increased over the trial, peaking just after the animal
    reported its choice
  criterion: ROC per 97 ms bin of the choice-aligned traces, as in the opening comment; per mouse
    the mean over sessions for each bin and cell type (the figure shows an example mouse, mean over
    45 days). "Just after" is not fixed; readings are (a) the peak falls in the first bin after the
    choice (0-97 ms) and (b) it falls within 300 ms after the choice, the window the Methods give
    for the confirmation lick. Reproduced when, in at least the example mouse (the one with 45
    sessions) and for both measures and both cell types, the earliest choice-aligned bin is below
    the bin before the choice and the peak lies in the window.
- id: fig2de-selectivity-magnitude-similar
  statement: The magnitude and time course of choice selectivity are similar for excitatory and
    inhibitory neurons.
  source: Results, Individual excitatory and inhibitory neurons are similarly choice-selective,
    paragraph 1; Figure 2D and 2E
  quote: as well as the magnitude and time course ( Figure 2D , E ) of choice selectivity
  criterion: Selectivity 2*|AUC-0.5| from correct trials (code), averaged over the neurons of each
    cell type per session, bin 0-97 ms before choice. A claim of absence, judged on the paper's
    test, an unpaired two-tailed t-test across sessions per mouse at p < 0.05 (Methods; code
    choicePref_ROC_exc_inh_plotsAllMice.m, ttest2). Reproduced when no mouse shows a significant
    difference; partially reproduced when one mouse does; the mean difference per mouse is
    reported either way. For the time course the same test is shown per bin.
- id: figs3d-same-spiking-selectivity
  statement: Restricted to excitatory and inhibitory neurons with the same spiking activity,
    choice selectivity is still similar, and the difference in mouse 4 of Figure 2C disappears.
  source: Results, Individual excitatory and inhibitory neurons are similarly choice-selective,
    paragraph 1; Figure S3D
  quote: D, ROC analysis restricted to those excitatory and inhibitory neurons that had the same
    spiking activity. Choice selectivity is still similar between the two cell types. Note that the
    significant difference observed for mouse 4 in Figure 2C is absent after controlling for the
    difference in spiking activity of inhibitory and excitatory neurons
  depends_on:
  - fig2bc-fraction-selective-similar
  criterion: Matching as the Methods give for Figure S10D, E and as the code does
    (choicePref_ROC_exc_inh_plotsAllMice_sameFR.m) per session, the median activity over trials in
    the bin 0-97 ms before choice for each neuron, the range of medians cut into 50 bins, and only
    the neurons of both types in the bin that holds the most inhibitory neurons kept. A claim of
    absence, judged on the unpaired two-tailed t-test across sessions per mouse at p < 0.05 (code,
    ttest2) on the session-mean selectivity and the session fraction selective. Reproduced when no
    mouse, mouse 4 included, shows a significant difference.
- id: figs3c-wider-window
  statement: ROC on the window from 200 ms before to 300 ms after the choice gives a larger
    fraction of selective neurons, 21% of excitatory and 27% of inhibitory (median across mice),
    about 69 excitatory and 11 inhibitory neurons per session.
  source: Figure S3C
  quote: 'Fraction selective neurons at this time window (median across mice): excitatory: 21%;
    inhibitory: 27%, resulting in approximately 11 inhibitory and 69 excitatory neurons with
    significant choice selectivity per session'
  expected:
  - quantity: fraction of selective excitatory neurons, median across mice
    value: 0.21
    tolerance: 0.021
  - quantity: fraction of selective inhibitory neurons, median across mice
    value: 0.27
    tolerance: 0.027
  - quantity: selective excitatory neurons per session
    value: 69
    tolerance: 6.9
  - quantity: selective inhibitory neurons per session
    value: 11
    tolerance: 1.1
  criterion: As fig2bc-fraction-selective-similar, with activity averaged over the window before
    the ROC. The code (choicePref_ROC_exc_inh.m, aveAllTimes = -1) averages the bins from 2 before
    to 3 after the choice bin, 194 ms before to 291 ms after; readings are (a) that and (b) the
