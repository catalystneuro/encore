  source: STAR Methods, Quantification and statistical analysis; Results, paragraph 3
  quote: Our simultaneous imaging and decision-making dataset includes 135 sessions from 4 mice (45,
    48, 7, and 35 sessions per mouse). Median number of trials per session is 213, 253, 264, and
    222, for each mouse. On average, 480 neurons were imaged per session, out of which ~40 neurons
    were inhibitory and ~330 were excitatory
  expected:
