claims:
- id: fig2d-hplc-yield
  statement: In size-exclusion HPLC the assembled nanosensors elute first (main peak near 7.5 mL),
    followed by a second peak at 9.1 to 9.2 mL of unreacted material, and the nanosensors are
    about 77% of the reaction mixture by area under all peaks of the pHAb channel.
  source: Results, Fabrication and in vitro characterization, paragraphs 2 and 3; Figure 2D
  quote: ACh nanosensors represent ∼77% of the reaction mixture based on the integration of areas
    under all detectable peaks from the pHAb channel chromatogram
  datasets:
  - sparc-108
  expected:
  - quantity: nanosensor share of pHAb-channel peak area
    value: 77
    tolerance: 7.7
    unit: "%"
  - quantity: main peak retention volume
    value: 7.5
    tolerance: 0.75
    unit: mL
  criterion: On the pHAb fluorescence chromatogram of the reaction mixture (Figure 2D, top), the
    area of the first peak over the summed area of all detectable peaks. The baseline and the
    peak limits are not given; readings are (a) limits at the minima between peaks with a flat
    baseline at the pre-injection level, (b) the same with a linear baseline under each peak.
    Reproduced when the share and the main peak volume are within tolerance under one reading
    and the second peak falls between 8.28 and 10.12 mL (9.1 to 9.2 mL widened by 10% of each
    bound).
- id: fig2g-conjugation-ratios
  statement: By Beer-Lambert estimates at 260, 280 and 652 nm, the nanosensor carries 2.86 AChE,
    1.70 BTX and 3.85 pHAb per DNA scaffold, conjugation efficiencies of 71%, 85% and 96%.
  source: Results, Fabrication and in vitro characterization, paragraph 4; Equations 1 and 2;
    Figure 2F and 2G
  quote: the conju-gation ratios of AChE, BTX, and pHAb to DNA scaffold were determined to be 2.86,
    1.70, and 3.85 (Fig. 2G). The conjugation efficiency of BTX and pHAb reached 85 and 96%,
    respectively.
  datasets:
  - sparc-108
  expected:
  - quantity: AChE per scaffold
    value: 2.86
    tolerance: 0.286
  - quantity: BTX per scaffold
    value: 1.70
    tolerance: 0.17
  - quantity: pHAb per scaffold
    value: 3.85
    tolerance: 0.385
  criterion: "[BTX] from the absorbance at 652 nm; [DNA] and [AChE] by solving Equations 1 and 2
    with extinction coefficients at 260 and 280 nm measured on pure DNA scaffold, AChE and BTX
    (Results, paragraph 4). The extinction coefficients of AF647 at 652 nm and of pHAb are not
    given in the paper; the dye makers' published values are the only reading, and are an
    assumption. Efficiencies are the ratios over the designed 4 AChE, 2 BTX and 4 pHAb
    (Methods, Design and fabrication). Reproduced when all three ratios are within tolerance.
    Not testable if the pure-component spectra are not deposited."
- id: fig2e-page-bands
  statement: In native PAGE the purified nanosensor runs as several bands of lower mobility than
    the DNA scaffold (likely 1 to 4 AChE per scaffold), and these bands carry both pHAb and AF647
    fluorescence.
  source: Results, Fabrication and in vitro characterization, paragraph 3; Figure 2E; Figure S2C
  quote: several bands with lower mo-bility were identified likely due to variable numbers of AChE
    (from 1 to 4) conjugated to the DNA scaffold (Fig. 2E). Bands that presumptively contain ACh
    nanosensors displayed overlapping fluorescence of pHAb and AF647
  datasets:
  - sparc-108
  criterion: On the gel images (ethidium bromide, pHAb and AF647 channels), lane 3 (main peak)
    shows at least two bands above the scaffold band of lane 1, and those bands have signal above
    the lane background in both the pHAb and the AF647 images. Judged by eye with lane profiles,
    as the paper gives no quantification.
- id: figs3-size
  statement: The nanosensor is 10 to 20 nm across, by structural simulation and atomic force
    microscopy, against about 130 nm for the earlier version.
  source: Results, Fabrication and in vitro characterization, paragraph 4; Figure S3
  quote: the current ACh nanosensor had an overall size of 10 to 20 nm confirmed by both
    structural simulations and atomic force microscopy (SI Appendix, Fig. S3)
  datasets:
  - sparc-108
  expected:
    quantity: nanosensor size in AFM
    value: 15.5
    tolerance: 6.5
    unit: nm
  criterion: The range 10 to 20 nm widened by 10% of each bound is 9 to 22 nm. Reproduced when the median largest dimension of isolated particles
    in the AFM images (Figure S3B, scale bars 50 and 10 nm) lies in 9 to 22 nm. How particles are
    segmented is not given; a height threshold above the mica background with particles touching
    the image border excluded is a standard choice.
- id: figs5-btx-staining
  statement: Ex vivo staining of freshly isolated SMG with BTX-AF647 shows a punctate pattern
    across the ganglion, confirming nicotinic ACh receptors on SMG neurons.
  source: Results, ACh nanosensors in SMG, paragraph 1; Figure S5
  quote: Ex vivo staining of freshly isolated SMG with BTX-AF647 showed the expected punctate
    staining pattern across the ganglion, confirming expres-sion of nicotinic ACh receptors in SMG
    neurons
  datasets:
  - sparc-75
  criterion: In the confocal z-stacks of a ChAT(BAC)-eGFP SMG (Figure S5), the AF647 channel shows
    discrete puncta distributed over the ganglion and lying on or next to GFP-positive cell
    bodies. Judged by eye on maximum projections and single slices; the paper gives no
    quantification.
- id: fig3d-sensor-on-soma
  statement: Confocal imaging of a nanosensor-stained SMG shows punctate AF647 and pHAb staining
    that overlaps and lies mainly on the neuronal cell soma, consistent with the BTX staining.
  source: Results, ACh nanosensors in SMG, paragraph 2; Figure 3D
  quote: Confocal microscopy further confirmed that the punctate staining pattern of AF647 and pHAb
    were primarily localized on the neuronal cell soma (Fig. 3D).
  datasets:
  - sparc-75
  - sparc-108
  criterion: In the confocal stacks of a nanosensor-injected, fixed ChAT(BAC)-eGFP SMG, puncta
    above background in the AF647 and pHAb channels coincide (yellow in the merge, Figure 3D) and
    most of them lie on GFP-positive somata. The paper gives no colocalization measure or
    threshold. Readings are (a) judged by eye, as the paper does, and (b) as a check, more than
    half of the AF647 puncta (by a threshold at mean plus 3 SD of the background) overlap pHAb
    puncta and lie within the GFP soma mask. Reproduced when (a) holds; (b) is shown.
- id: fig3bc-retention
  statement: After rinsing, a substantial amount of nanosensor stays in the SMG, while DNA
    structures lacking AChE and BTX are barely visible in the tissue.
  source: Results, ACh nanosensors in SMG, paragraph 2; Figure 3B and 3C
  quote: In contrast, DNA structures that did not have the AChE and tar-geting ligands (i.e., BTX)
    were barely visible inside the tissue (Fig. 3C).
  datasets:
  - sparc-108
  criterion: After washing, the mean pHAb (and AF647, where present) intensity inside the SMG,
    above the background outside it, is clearly higher with the nanosensor (Figure 3B) than with
    the bare DNA structures (Figure 3C). The paper gives no number; reproduced when the
    nanosensor's background-subtracted signal is at least twice that of the bare structure.
    The factor two is this file's choice, as the paper says only "barely visible".
- id: figs4-stability
  statement: Nanosensors in the harvested SMG keep their structure and AChE activity for 5 h;
    after 5 h, adding 100 uM ACh raises the pHAb fluorescence of three ROIs by 20 to 45%.
  source: Results, ACh nanosensors in SMG, paragraph 2; Figure S4D to F
  quote: The fluorescence intensity of three ROIs increased by 20-45% after the addition of ACh,
    indicating that the AChE was still functional and remained conjugated on the DNA scaffold.
  datasets:
  - sparc-108
  criterion: The ROIs are not given. Reproduced when ROIs on stained cells of the 5 h image give
    pHAb increases after ACh addition within 18 to 49.5% (20 to 45% widened by 10% of each bound)
    for at least two of three ROIs, and AF647 and pHAb still overlap in the 5 h image.
