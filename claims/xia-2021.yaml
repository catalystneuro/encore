- id: fig5e-reversibility
  statement: Three repeated stimulations (10 V, 10 Hz, 10 ms, 10 pulses) in the same ROI give
    repeatable initial rates of 0.436, 0.417 and 0.431 %/s (0.428 ± 0.010 %/s).
  source: Results, In vivo imaging of ACh release, paragraph 1; Figure 5E
  quote: showing repeatable rates of 0.436%/s, 0.417%/s, and 0.431%/s in sequence (0.428 ±
    0.010%/s, Fig. 5E)
  datasets:
  - sparc-108
  expected:
  - quantity: rate, stimulation 1
    value: 0.436
    tolerance: 0.0436
    unit: "%/s"
  - quantity: rate, stimulation 2
    value: 0.417
    tolerance: 0.0417
    unit: "%/s"
  - quantity: rate, stimulation 3
    value: 0.431
    tolerance: 0.0431
    unit: "%/s"
  - quantity: mean rate
    value: 0.428
    tolerance: 0.010
    unit: "%/s"
  criterion: Initial rate per stimulation as in fig5c-voltage-dose. Reproduced when the three rates
    are within tolerance under one reading of the rate window, or, failing the values, partially
    reproduced when the three rates differ from their mean by less than 10%.
- id: figs7b-in-vitro-reversibility
  statement: In vitro, in a dialysis fiber, the nanosensor responds repeatedly to five
    injections of 100 uM ACh, recovering after each washout.
  source: Results, In vivo imaging of ACh release, paragraph 1; Figure S7B; Methods,
    Characterization of ACh nanosensors
  quote: Reversibility of the sensor was demonstrated by three repeated stimulations ... which was
    confirmed with in vitro experiments (SI Appendix, Fig. S7B).
  datasets:
  - sparc-108
  criterion: In the confocal pHAb trace of the fiber, each of the five ACh injections gives a
    rise, and the signal returns after each wash. The paper gives no measure; reproduced when all
    five peaks are within 10% of their mean and the signal before each injection is within 10%
    of the first baseline's rise above zero (the 10% is this file's choice).
- id: fig6-vesamicol
  statement: Vesamicol cuts the nanosensor response to 3 V stimulation; in the example the
    response with the drug is 17% of that after washout, and over four experiments the reduction
    averages 76.59 ± 11.34%, significant in each by a paired t test (P < 0.01).
  source: Results, In vivo imaging of ACh release, paragraph 3; Figure 6A to C
  quote: Four independent inhibitor treatments affirmed that vesamicol can considerably suppress
    ACh nanosensors' readout by an average of 76.59 ± 11.34% (Fig. 6C)
  datasets:
  - sparc-108
  statistics:
  - test: paired t test, vesamicol treated against untreated
    p: 0.01
    p_relation: "<"
    n: four independent inhibitor experiments
  expected:
  - quantity: mean reduction of peak response by vesamicol
    value: 76.59
    tolerance: 11.34
    unit: "%"
  - quantity: response with drug over response after washout, Figure 6B example
    value: 17
    tolerance: 1.7
    unit: "%"
  criterion: "Peak pHAb dF/F with vesamicol and after washout, same ROI and stimulation (3 V, 10
    Hz, 10 ms, 100 pulses), normalised to the maximum (Figure 6 legend); reduction is 1 minus
    the ratio, averaged over four experiments. The legend's test is open: \"a significant
    difference (**P < 0.01) was found between the vesamicol treated and untreated groups for all
    four trials\". Readings are (a) one paired t test over the four experiments' peak values
    (n = 4 pairs), (b) a paired t test within each experiment over the matched time points of
    the two traces (frames from stimulation onset to the end of the response). Reproduced when
    the mean reduction is within tolerance and the test gives P < 0.01 under one reading (for
    (b), in all four experiments)."
- id: figs9-aqua-vs-roi
  statement: dF/F traces from AQuA events and from conventional ROI analysis of the same regions
    show similar dynamics.
  source: Results, ACh nanosensor response reflects physiological ACh propagation, paragraph 1;
    Figure S9
  quote: we compared the fluorescence dynamics derived from AQuA software to the ROI-based analysis
    at the same regions that were automatically defined by AQuA software and found that they
    reported similar dynamics (SI Appendix, Fig. S9)
  datasets:
  - sparc-108
  criterion: For the two events R1 and R2 of Figure S9 (8 V), the AQuA dF/F curve and the ROI dF/F
    over the event's footprint. The paper gives no similarity measure; reproduced when their
    Pearson correlation over the recording is at least 0.9 and their peak times differ by at most
    two frames (1.1 s), thresholds chosen here. AQuA parameters are open (opening comment).
- id: figs10-control-8v
  statement: Control nanosensors change by less than 4% under 8 V stimulation (three mice), so
    physiological pH changes are small.
  source: Results, ACh nanosensor response reflects physiological ACh propagation, paragraph 1;
    Figure S10
  quote: It is worth noting that control nanosensors change less than 4% under 8 V stimulation
  datasets:
  - sparc-108
  expected:
    quantity: peak dF/F of control nanosensor at 8 V
    value: 4
    tolerance: 0.4
    unit: "%"
  criterion: Peak of the mean pHAb dF/F over three mice (whole SMG or ROI, as Figure S10 does not
    say; both are read) after 8 V, 10 Hz, 10 ms, 100 pulses. Reproduced when the peak is below
    4.4% under one reading.
- id: fig7-rostral-caudal
  statement: At 8 V, AQuA shows the nanosensor signal spreading from rostral to caudal across
    the SMG. The rostral-most region rises at 13.20 s (2.75 s after stimulation onset) and peaks
    at 22.0 s; the signal reaches caudal regions by 13.75 and 15.40 s and lateral at 15.95 s; the
    most caudal region peaks at 44.55 s.
  source: Results, ACh nanosensor response reflects physiological ACh propagation, paragraph 1;
    Figure 7A and 7B; Figure S11
  quote: The spatiotemporal AQuA analysis of nanosensor response following 8 V stimulation across
    the SMG validated our prediction (Fig. 7A and Movie S3). The rostral-most region started to
    increase fluorescence at 13.20 and 2.75 s after the start of 10 s stimulation and peaked at
    t = 22.0 s
  datasets:
  - sparc-108
  expected:
  - quantity: onset of region 1 (rostral-most)
    value: 13.20
    tolerance: 0.55
    unit: s
  - quantity: onset of region 2
    value: 13.75
    tolerance: 0.55
    unit: s
  - quantity: onset of region 3
    value: 15.40
    tolerance: 0.55
    unit: s
  - quantity: onset of region 4 (lateral)
    value: 15.95
    tolerance: 0.55
    unit: s
  - quantity: peak of rostral-most region
    value: 22.0
    tolerance: 0.55
    unit: s
  - quantity: peak of most caudal region
    value: 44.55
    tolerance: 4.455
    unit: s
  criterion: "AQuA on the 8 V recording of Figure 7 (stimulation 10.45 to 20.35 s), area bounded
    by a line around the whole SMG (Methods, AQuA analysis); AQuA parameters are open (opening
    comment). The onset tolerances are one frame (0.55 s), the sampling interval, as 10% (1.3 s)
    would not separate the reported order; the late caudal peak keeps the 10% default. The text
    says the caudal decay \"begins at t = 44.55\" and Figure 7B calls 44.55 the time of maximum;
    both name the peak. The anatomical axis is read from Figure 7B (rostral, caudal, lateral as
    marked). Reproduced when the event onsets are ordered rostral before caudal before lateral
    and the times are within tolerance; partially reproduced when the order holds but times do
    not."
- id: fig7-peak-timing
  statement: All evoked nanosensor responses in Figure 7A climb to their peak around 10 to 15 s
    after stimulation onset, as in Figure 5B to E.
  source: Results, ACh nanosensor response reflects physiological ACh propagation, paragraph 1;
    Figure 7A
  quote: All evoked nanosensor responses in Fig. 7A climbed to the peak around ∼10 to 15 s, an
    observation consistent with Fig. 5 B–E.
  datasets:
  - sparc-108
  depends_on:
  - fig7-rostral-caudal
  criterion: For the AQuA events of Figure 7A, the time from stimulation onset (10.45 s) to each
    event's peak. Whether "10 to 15 s" counts from stimulation onset or from event onset is not
    said; both are read. Reproduced when, under one reading, most events peak within 9 to 16.5 s
    (10 to 15 s widened by 10% of each bound). The most caudal peak at 44.55 s (34 s after onset)
    stated in the same paragraph is reported against this.
- id: figs12-3v-propagation
  statement: At 3 V, in three independent experiments, AQuA shows the same rostral-to-caudal
    direction of propagation, with lower amplitude than at 8 V.
  source: Results, ACh nanosensor response reflects physiological ACh propagation, paragraph 1;
    Figure S12; Methods, AQuA analysis
  quote: We also conducted the same analysis with a lower stimulation voltage of 3 V for three
    independent experiments and observed similar rostral-to-caudal propagation directionality
  datasets:
  - sparc-108
  depends_on:
  - fig7-rostral-caudal
  criterion: AQuA as in fig7-rostral-caudal on the 3 V recordings of three mice (one also used at
    8 V, two at 3 V only; Methods). Reproduced when in each the earliest event lies rostral of
    the later ones, and in the mouse stimulated at both voltages the peak dF/F at 3 V is below
    that at 8 V. Partially reproduced when two of three show the order. Rostral is read from the
    electrode side (Methods, Electrical stimulation, electrode closer to the lingual nerve)
    where the images do not mark it.
- id: figs16-af647-stable
  statement: The AF647 channel recorded with the pHAb signal of Figure 7 shows no visible
    fluorescence increase during stimulation, so the internal standard does not respond.
  source: Methods, Animal preparation and imaging; Figure S16
  quote: SI Appendix, Fig. S16 exhibited a panel of time-lapse images from AF647 channel which were
    simultaneously recorded with the pHAb fluorescence in Fig. 7 and confirmed that there was no
    visible fluorescent increase during recording in AF647 channel.
  datasets:
  - sparc-108
  criterion: Whole-SMG mean AF647 intensity, photobleaching corrected, over the 8 V recording.
    Reproduced when its largest rise after stimulation onset is below the largest rise of the
    pHAb channel by at least a factor of five and within the pre-stimulus noise (mean plus 3 SD),
    thresholds chosen here as the paper says only "no visible increase".
- id: figs13-two-photon
  statement: pHAb fluorophores can be excited by two-photon microscopy, and a whole SMG injected
    with control nanosensors can be imaged under two-photon excitation at 837 nm.
  source: Discussion, paragraph 1; Figure S13
  quote: pHAb fluorophores are also compatible with two-photon imaging (SI Appendix, Fig. S13)
  datasets:
  - sparc-108
  criterion: In the two-photon images of pHAb oligos (Figure S13A, B), the mean intensity of the
    boxed area is above background at one or more excitation wavelengths, and the 837 nm SMG
    image (S13C) shows stained cells. Judged from the images; the paper gives no number.
