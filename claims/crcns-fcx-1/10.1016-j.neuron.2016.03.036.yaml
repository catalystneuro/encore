  statement: UP states late in nonREM packets have more sigma power than UP states early in packets.
  source: Results, Firing rate and LFP changes within nonREM episodes and packets; Figure 4E; Figure
    S4B and S4D
  quote: Spectral comparison of UP states in first third versus last third of packets showed
    increased sigma power ( Figure 4E ; p < 10 −10 ; Wilcoxon rank-sum test and per-pixel
    significance; Figure S4B )
  statistics:
  - test: Wilcoxon rank-sum test
    p: 1.0e-10
    p_relation: "<"
  - test: t-test
    p: 1.0e-5
    p_relation: "<"
