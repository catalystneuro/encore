  source: Results, Firing rate and LFP changes within nonREM episodes and packets, last paragraph;
    Figure S5A and S5B
  quote: We found that entry into WAKE corresponded with an increase in firing rate of the highest
    sextile two groups and a drop in firing rate of the lowest two sextile groups ( Figure S5A ),
