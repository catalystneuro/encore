# Claims for Watson, Levenstein, Greene, Gelinas & Buzsaki (2016), Neuron 90, 839-852, "Network
# homeostasis and state dynamics of neocortical sleep", doi:10.1016/j.neuron.2016.03.036, on CRCNS
# data set fcx-1 (doi:10.6080/K02N506Q).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-07,
# protocol as stated in docs/protocol.md (Reader), version pilot-13.
#
# Text read: the accepted author manuscript in PubMed Central (PMC4873379, NIHMS776601), as supplied
# under paper/: Introduction, Results, Discussion, Experimental Procedures, and the legends of
# Figures 1 to 6; with its supplement 1 (Table S1, legends of Figures S1 to S5, Supplemental
# Experimental Procedures, and the figure pages as extracted text) and supplement 2 (the Figure 1
# artwork as extracted text). The version of record was not read. No PDF of the main paper was
# supplied and the supplement PDF could not be rendered in this run, so values printed only inside
# Figures 2 to 5 (the per-sextile R and p of Fig. 3B and 4A-B iv, the n of each triplet class and
# the asterisks of Fig. 5B) were not read; claims on those figures rest on the Results and legends.
# The per-sextile R and p of Figure S5A and S5B and the R and p of Figure S3C and S5C to S5G come
# from the extracted text of the supplement figure pages; the S5C to S5G values carry their panel
# titles; the assignment of the two S5A/S5B lists to WAKE and REM is read from the extraction order
# and agrees with the Results for REM only.
#
# Code. The paper links no analysis code. Its methods name MATLAB, KlustaKwik, Klusters, the
# process_multi_start shell script and a modification of FindRipples.m from FMAToolbox
# (http://fmatoolbox.sourceforge.net/) for spindle detection; none of the paper's own analysis code
# is published with it. Every method below is from the paper's text.
#
# Data the paper used. Eleven male Long Evans rats, 3 to 7 months old, one or two 64-site silicon
# probes in deep layers of frontal cortex (medial prefrontal, orbitofrontal, anterior cingulate and
# secondary motor cortex; Table S1 gives the area per rat), recorded in the home cage in the light
# cycle; 27 sessions (294 +- 137 min). LFP at 1250 Hz; spikes sorted with KlustaKwik and Klusters;
# 1360 clustered units, 1121 stable, 995 putative pyramidal (pE) and 126 putative interneurons (pI).
# States scored per second (Table S1, Supplemental Experimental Procedures): WAKE, nonREM packets,
# nonREM episodes, REM, microarousals (MA, < 40 s between nonREM packets), SLEEP (20+ min of nonREM,
# REM and MA with no interruption > 2 min), WAKE (7+ min), WAKE-SLEEP cycles (54). Detected events
# UP and DOWN states (43230 and 86839) and spindles (5203). Measured variables per cell and state
# firing rate, burst index, autocorrelogram; LFP band power (delta 0.5 to 4 Hz, sigma 9 to 25 Hz,
# gamma 40 to 100 Hz); theta ratio; intracranial EMG; motion. By its description the CRCNS data set
# holds, for the 27 sessions, the LFP, the stable spike trains with pE/pI labels, the scored state
# intervals (WAKE, SLEEP, WAKE-SLEEP, nonREM episodes and packets, REM, MA), the UP/DOWN and
# spindle detections, EMG correlation and motion.
#
# Shared method details, used by the criteria below.
# M1. Cells and sessions. Statistics are per cell on pE cells unless stated (Results, Assessment of
#   firing patterns). Analyses are confined to WAKE-SLEEP cycles (Supplemental Experimental
#   Procedures, Brain state scoring). A cell's rate in a state is its spike count over the summed
#   duration of that state's intervals. The paper does not say whether a cell recorded across two
#   WAKE-SLEEP cycles enters a per-episode comparison once per episode or once with its episodes
#   averaged; readings (a) one entry per cell and episode, (b) one per cell, averaged over episodes.
# M2. Sextiles. pE cells from the whole data set are split into six equal groups by WAKE firing
#   rate (Results, Firing pattern and LFP changes across the course of sleep; Fig. 2A legend;
#   Experimental Procedures), kept for all later analyses. "General WAKE firing rate" is read as the
#   rate over all WAKE intervals of the cell's session; reading (b) is the rate over the WAKE of
#   each cycle. The Fig. 2F groups are "based on mean rate", read as the same WAKE sextiles; reading
#   (b) is sextiles of the nonREM rate.
# M3. Time-normalized correlations. SLEEP, nonREM episodes and packets are time-normalized to 0 to 1
#   and, for SLEEP, only nonREM time is used (Results, Firing pattern and LFP changes across the
#   course of sleep; Fig. 3B legend). Correlations are Pearson (Fig. 3B legend). The unit of a sample
#   in these correlations is not stated. Readings, (a) one point per nonREM packet (its mean value at
#   its normalized mid-time); (b) one point per 10 s bin of nonREM (the bin the Supplemental
#   Experimental Procedures use for the CV and burst ratio); rates normalized by the recording's mean
#   value before pooling, as the Supplemental Experimental Procedures do for CV and burst ratio.
# M4. Judging correlations and tests. Where the paper reports an R and a p bound, the claim is
#   reproduced when R has the reported sign and p is below the reported bound under one reading,
#   partially reproduced when the sign holds and p < 0.05 but not below the bound, and not
#   reproduced otherwise; the R obtained is reported beside the paper's. Reported R values are kept
#   as test statistics and are not targets with a tolerance.
# M5. Rate-rate slopes (Fig. 2B, 3D, S2D, S3A). The figures plot log rates and the S2D legend speaks
#   of log firing rates, so the slope is an ordinary least-squares fit of log10 later (or nonREM)
#   rate on log10 earlier (or WAKE) rate, with a 95% interval; cells with a zero rate in either
#   state are left out (a standard choice the paper does not state). Reading (b) fits linear rates.
#   The expected slope is the midpoint of the paper's interval, with half its width as tolerance.
# M6. Triplets (Results, Sleep sub-states induce differential lasting firing rate changes;
#   Supplemental Experimental Procedures). State A n, state B, state A n+1, with the change from A n
#   to A n+1 attributed to B; nonREM-REM-nonREM triplets are kept unless a WAKE (> 120 s) follows the
#   REM before the second packet. The change is per cell rate(A n+1) minus rate(A n) (Fig. 5B legend);
#   the S5 correlations use log(rate n+1) minus log(rate n). The per-sextile test for Fig. 5B is not
#   named; readings (a) Wilcoxon signed-rank against zero, the test the paper uses for paired rate
#   comparisons elsewhere; (b) one-sample t-test against zero.
# M7. Tolerances. 10% of the reported value unless a claim gives another.
