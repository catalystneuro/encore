- id: sleep-homogenizes-rates
  statement: The net effect of sleep is to homogenize the firing rate distribution, fast cells
    decreasing and slow cells increasing, so the population rate dispersion falls.
  source: Discussion, paragraph 1; Figure 6
  quote: During nonREM, activity of high firing rate neurons decreased, whereas activity of slow
    firing neurons increased. REM sleep reduced firing rates relatively uniformly of all firing rate
    groups, whereas microarousals, interspersed between nonREM epochs, increased the discharge rates
    of slow firing neurons. Accordingly, the net result of sleep is that the firing rate variation
    of the population is decreased
  depends_on:
  - fig3d-first-last-packet-slope
  - fig3e-wake-before-after-sextiles
  - cv-decreases-over-sleep
  - fig5b-rem-between-packets
  - fig5b-ma-between-packets
  criterion: A summary of the claims it depends on. Reproduced when fig3d-first-last-packet-slope,
    fig3e-wake-before-after-sextiles and cv-decreases-over-sleep are reproduced, and partially
    reproduced when one or two of them are; the sub-state claims are reported beside it.
