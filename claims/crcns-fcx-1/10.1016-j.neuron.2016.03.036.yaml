    last on first rate is below 1 (95% interval 0.827 to 0.880); fast cells decrease and slow cells
    increase their rates over sleep.
  source: Results, Firing pattern and LFP changes across the course of sleep; Figure 3D
  quote: we assessed spike rates of the same neurons in the first versus the last nonREM packets of
    SLEEP and found the slope of this correlation significantly departed from unity (slope 95%
    confidence interval 0.827-0.880)
  statistics:
  - ci:
      level: 0.95
      low: 0.827
      high: 0.88
  expected:
    quantity: slope of last-packet on first-packet rate
    value: 0.8535
    tolerance: 0.0265
  criterion: M5 on pE cells, one point per cell and SLEEP (M1 reading a) or per cell (reading b).
    Reproduced when under one reading the slope is within tolerance; partially reproduced when its
    95% interval lies below 1 but the slope is outside tolerance.
- id: fig3b-sextile-changes
  statement: Over SLEEP (nonREM only), the mean rate of the highest-rate sextiles decreases while
    the lowest sextile shows a marginal increase.
  source: Results, Firing pattern and LFP changes across the course of sleep; Figure 3B, bottom
  quote: The mean spike discharge rate of highest-firing rate sextile groups significantly decreased
    over sleep whereas the activity of the lowest-firing rate sextile showed a marginal increase (
    Figure 3B ; Pearson correlations versus normalized time)
  depends_on:
  - table1-dataset-counts
  criterion: Sextiles by M2; per sextile, mean rate against normalized SLEEP time by M3, Pearson.
    The per-sextile R and p are printed only in the figure and were not read. Reproduced when the
    top sextile has a negative R with p < 0.05 and the bottom sextile a positive R (any p, as
    "marginal"); partially reproduced when only the top-sextile decrease holds.
- id: cv-decreases-over-sleep
  statement: The coefficient of variation of firing rates decreases over SLEEP.
  source: Results, Firing pattern and LFP changes across the course of sleep
  quote: the coefficient of firing rate variation also showed a significantly decreasing slope over
    the course of SLEEP (R = - 0.05; p < 0.01)
  statistics:
  - test: Pearson correlation versus normalized time
    statistic: R = -0.05
    p: 0.01
    p_relation: "<"
  criterion: CV across simultaneously recorded pE cells of their rates in 10 s bins, normalized by
    the recording's mean CV (Supplemental Experimental Procedures, Spiking metrics), against
    normalized SLEEP time, nonREM bins only (M3 reading b). Judged by M4.
- id: fig3c-spindles-over-sleep
  statement: Over SLEEP spindle incidence (1.94/min) decreases while spindle duration (0.52 s),
    frequency (13.93 Hz) and amplitude (203.3 uV) do not change.
  source: Results, Firing pattern and LFP changes across the course of sleep; Figure 3C, bottom
  quote: Incidence of spindles (1.94±0.39/min) decreased (R = - 0. 093; p < 10 −5 ), while spindle
    duration (0.52±0.32 sec), frequency (13.93±0.93 Hz) and amplitude (203.3±87.71 µV) did not change
    over SLEEP
  statistics:
  - about: spindle incidence against normalized SLEEP time
    test: correlation
    statistic: R = -0.093
    p: 1.0e-5
    p_relation: "<"
  expected:
  - quantity: spindle incidence
    value: 1.94
    tolerance: 0.194
    unit: per minute
  - quantity: spindle duration
    value: 0.52
    tolerance: 0.052
    unit: s
  - quantity: spindle frequency
    value: 13.93
    tolerance: 1.393
    unit: Hz
  - quantity: spindle amplitude
    value: 203.3
    tolerance: 20.33
    unit: uV
  criterion: Spindles detected as in the Supplemental Experimental Procedures (10 to 20 Hz band,
    half-cycles above 2 SD, 200 to 3000 ms, merged within 300 ms, high-voltage spindles removed);
    readings (a) the deposited detections, (b) a new detection. Table S1 gives the incidence as
    0.049 +- 0.008 Hz (2.94 per minute), which disagrees with 1.94 per minute in the Results; both
    are compared and the discrepancy is recorded. Incidence change by M3 and M4. For duration,
    frequency and amplitude, a claim of absence on the same correlation, reproduced when p >= 0.05
    for each.
- id: fig3c-updown-over-sleep
  statement: Over SLEEP the incidence of UP and DOWN states decreases, DOWN state duration
    increases, UP state duration does not change, and the fraction of time in neither UP nor DOWN
    increases.
  source: Results, Firing pattern and LFP changes across the course of sleep; Figure 3C
  quote: Incidence of both UP states (R = - 0.10; p <10 −6 ) and DOWN states (R = - 0.08; p < 10 −4 )
    decreased significantly, while the duration of DOWN states increased (R slope = 0.09; p < 10 −4 ;
    Figure 3B ) and duration of UP states did not change. In addition, the fraction of time that
    could be identified as neither UP nor DOWN state ('other') increased significantly over the
    course of sleep (R = 0.08; p < 10 −2 )
  statistics:
  - about: UP incidence
    statistic: R = -0.10
    p: 1.0e-6
    p_relation: "<"
  - about: DOWN incidence
    statistic: R = -0.08
    p: 1.0e-4
    p_relation: "<"
  - about: DOWN duration
    statistic: R = 0.09
    p: 1.0e-4
    p_relation: "<"
  - about: fraction neither UP nor DOWN
    statistic: R = 0.08
    p: 0.01
    p_relation: "<"
  depends_on:
  - updown-durations
  criterion: UP/DOWN detections as in updown-durations, nonREM time of SLEEP only, M3 and M4 for
    each of the four changes; UP duration a claim of absence, reproduced when p >= 0.05. Reproduced
    when all five hold under one reading; partially reproduced when at least three do.
- id: fig3f-within-up-changes
  statement: Within UP states, pE rates decrease over SLEEP, and from first to last packet the
    fastest sextile and interneurons decrease while the slowest sextile increases.
  source: Results, Firing pattern and LFP changes across the course of sleep; Figure 3F; Figure S3C
  quote: Comparison of firing rates within UP states showed a general decrease across the whole
    population ( Figure S3C ) and subtraction of UP state firing activity in early sleep from that
    in late sleep revealed that the firing rates of the fastest sextile group and putative
    interneurons decreased later in sleep, whereas firing of the slowest sextile increased
  statistics:
  - about: within-UP pE rate against normalized SLEEP time (Figure S3C)
    statistic: R = -0.19849
    p: 3.3168e-09
  depends_on:
  - updown-durations
  criterion: Rates counted only within UP states. The S3C correlation by M3 and M4 on the mean pE
    within-UP rate. The sextile part, per cell, within-UP rate in the last packet minus the first
    packet of SLEEP (Fig. 3F legend), mean per group; no test is named, so a Wilcoxon signed-rank
    test against zero per group at p < 0.05 is used (a standard choice). Reproduced when the S3C
    correlation holds and the fastest sextile and pI change is negative and the slowest positive,
    each significant; partially reproduced when the correlation holds and two of the three signs
    are right.
- id: figs3a-first-last-rem-ma-slopes
  statement: Rates change differentially across the spectrum also from the first to last REM and
    first to last MA of SLEEP and from WAKE before to WAKE after sleep, with slopes below 1 (REM
    0.76 to 0.83, MA 0.58 to 0.68, WAKE 0.80 to 0.86).
  source: Results, Firing pattern and LFP changes across the course of sleep, last paragraph, and
    Sleep sub-states induce differential lasting firing rate changes; Figure S3A
  quote: first versus last REM episode, also note significant deviation of slope from 1
    (confidence interval ... 0.76-0.83). Right first versus last MA episode per sleep session,
    confidence interval of slope does not include 1 (0.58- 0.68)
  statistics:
  - about: first against last REM
    ci:
      level: 0.95
      low: 0.76
      high: 0.83
  - about: first against last MA
    ci:
      level: 0.95
      low: 0.58
      high: 0.68
  - about: WAKE before against WAKE after SLEEP
    ci:
      level: 0.95
      low: 0.8
      high: 0.86
  expected:
  - quantity: slope, last REM on first REM
    value: 0.795
    tolerance: 0.035
  - quantity: slope, last MA on first MA
    value: 0.63
    tolerance: 0.05
  - quantity: slope, WAKE after on WAKE before
    value: 0.83
    tolerance: 0.03
  criterion: M5 for each pair. The Results print the WAKE interval as "0.801 - 0.0856" and the
    S3A legend as 0.80 to 0.86; the legend is used. The WAKE windows are the last 5 min before and
    the first 5 min after SLEEP (S3A legend). The S3A legend's confidence level is not stated; 95%
    is used, as in the Results. Reproduced when under one reading all three slopes are within
    tolerance; partially reproduced when all three intervals lie below 1.
- id: fig3e-wake-before-after-sextiles
  statement: From 5 min of WAKE before to 5 min of WAKE after SLEEP, the top three sextiles
    decrease their rates and the lowest sextile increases.
  source: Results, Sleep sub-states induce differential lasting firing rate changes; Figure 3E
  quote: Comparison of firing rates during 5 minutes of WAKE immediately before SLEEP versus 5
    minutes of WAKE immediately after SLEEP showed a significant decrease firing in the top three
    sextile groups and an increase in the lowest sextile group (all ps < 0.05; stars in Figure 3E )
  statistics:
  - test: one-tailed Wilcoxon
    p: 0.05
    p_relation: "<"
  depends_on:
  - post-sleep-wake-lower
  criterion: Sextiles by M2; windows as in post-sleep-wake-lower; one-tailed Wilcoxon signed-rank
    per sextile, paired by cell (Fig. 3E legend), in the reported direction. Reproduced when the top
