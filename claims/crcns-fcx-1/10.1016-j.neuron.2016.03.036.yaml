  - about: CV within packets
    statistic: R = -0.12
    p: 1.0e-10
    p_relation: "<"
  - about: burst index within episodes
    statistic: R = 0.09
    p: 1.0e-10
    p_relation: "<"
  - about: burst index within packets
    statistic: R = 0.08
    p: 1.0e-10
    p_relation: "<"
