    negative and the bottom sextile a positive R, each p < 0.05, in both episodes and packets, and
    the four CV and burst correlations hold by M4; partially reproduced when the CV and burst
    correlations hold but a sextile trend does not.
- id: fig4cd-packet-rate-lfp-correlations
  statement: Across packets, the top sextile's rate correlates negatively with delta power, DOWN
    duration and DOWN incidence and positively with UP duration and gamma power, and the bottom
    sextile's rate correlates positively with sigma power in the last 20 s of the packet; other
    combinations are not significant.
  source: Results, Firing rate and LFP changes within nonREM episodes and packets; Figure 4C and 4D
  quote: Per-packet firing rate of the top sextile group was negatively correlated with per-packet
    LFP metrics, including whole-packet delta power (Z-scored per session; Figure 4C ; R= - 0.28; p
    < 10 −10 ), DOWN state duration (R = - 0.16, p < 10 −4 ), and DOWN state incidence rate (Z-scored
    per session; R = - 0.29, p<10 −10 ). A positive correlation was observed between firing rate of
    the top sextile group and UP state duration (R = 0.14, p < 10 −3 ) and gamma power ( Figure 4D ;
    R = 0.44; p < 10 −10 ). Finally, a positive correlation was found between normalized firing rates
    per packet in the bottom sextile group and sigma power in the last 20 sec of the packet (R =
    0.25; p < 10 −10 ). Other tested relationship combinations were not significant
  statistics:
  - about: top sextile rate against delta power
    statistic: R = -0.28
    p: 1.0e-10
    p_relation: "<"
  - about: top sextile rate against DOWN duration
    statistic: R = -0.16
    p: 0.0001
    p_relation: "<"
  - about: top sextile rate against DOWN incidence
    statistic: R = -0.29
    p: 1.0e-10
    p_relation: "<"
  - about: top sextile rate against UP duration
    statistic: R = 0.14
    p: 0.001
    p_relation: "<"
  - about: top sextile rate against gamma power
    statistic: R = 0.44
    p: 1.0e-10
    p_relation: "<"
  - about: bottom sextile rate against sigma power in the last 20 s
    statistic: R = 0.25
    p: 1.0e-10
    p_relation: "<"
  depends_on:
  - updown-durations
  criterion: One point per packet; per packet the mean rate of the sextile's cells normalized per
    sleep session (by the session's mean packet rate, a standard reading of "normalized per sleep
    session") and the packet's LFP metrics z-scored per session, Pearson. M4 for each of the six.
    The set of "other tested" combinations is not listed; the bottom sextile against delta power,
    DOWN duration, DOWN incidence, UP duration and gamma, and the top sextile against late sigma,
    are tested at p < 0.05 and reported. Reproduced when the six hold; partially reproduced when at
    least four do.
