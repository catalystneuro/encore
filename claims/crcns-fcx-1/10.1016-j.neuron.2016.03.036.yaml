    least three of the four do.
- id: fig4-lfp-within-nrem
  statement: Within nonREM episodes and packets delta and sigma power increase, and gamma power
    decreases over episodes but not over packets; packet mean delta power is positively correlated
    with packet length.
  source: Results, Firing rate and LFP changes within nonREM episodes and packets; Figure 4A-B i
  quote: Over nonREM episodes and packets, delta and sigma band power steadily increased ( Trachsel et
    al., 1988 ), whereas gamma power decreased over episodes but not packets ( Figure 4 A-B i ). ...
    Mean delta power within whole packets (normalized by nonREM delta power) was positively
    correlated with packet length (R = 0.31; p < 0.05)
  statistics:
  - about: packet delta power against packet length
    statistic: R = 0.31
    p: 0.05
    p_relation: "<"
  criterion: Band power (delta 0.5 to 4 Hz, sigma 9 to 25 Hz, gamma 40 to 100 Hz) from the
    session's spectrogram (10 s window every 1 s, Supplemental Experimental Procedures, Brain state
    scoring), z-scored per session (a standard choice; the paper normalizes delta by mean nonREM
    delta for the packet-length correlation), on the default LFP channel. M3 and M4 for each band,
    within episodes and packets; the gamma change over packets is a claim of absence, reproduced
    when p >= 0.05. Reproduced when all five trends and the packet-length correlation hold;
    partially reproduced when the delta and sigma increases hold.
