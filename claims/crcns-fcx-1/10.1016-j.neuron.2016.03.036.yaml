    slowest-firing sextile groups increased within both nonREM episodes and packets ( Figure 4A, B iv
    ; R and p values in figure), resulting in a decreasing coefficient of variation of binned
    population firing rates ( Figure 4 A-B v ; R episode = −0.13, p < 10 −10 ; R packet = - 0.12, p <
    10 −10 ). An additional metric, the 15ms spike burst index of pyramidal neurons, also showed a
    positive slope within both nonREM episodes and packets
  statistics:
  - about: CV within episodes
