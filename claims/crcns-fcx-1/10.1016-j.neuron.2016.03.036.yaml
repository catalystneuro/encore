  source: Results, Firing rate and LFP changes within nonREM episodes and packets; Figure 4A-B ii
  quote: The incidence of both UP states (R = 0.05, p < 10 −3 ) and DOWN states (R = 0.08; p < 10 −10
    ) increased significantly within packets, whereas the duration of UP states decreased (R = -
    0.02; p < 0.01) and DOWN states increased (R = 0.07; p < 10 −10 ), changing the UP-DOWN balance
    (UP/DOWN ratio negative correlation versus time p < 0.05)
  statistics:
  - about: UP incidence
    statistic: R = 0.05
    p: 0.001
    p_relation: "<"
  - about: DOWN incidence
    statistic: R = 0.08
    p: 1.0e-10
    p_relation: "<"
  - about: UP duration
    statistic: R = -0.02
    p: 0.01
    p_relation: "<"
  - about: DOWN duration
    statistic: R = 0.07
    p: 1.0e-10
    p_relation: "<"
  - about: UP/DOWN ratio
    p: 0.05
    p_relation: "<"
  depends_on:
  - updown-durations
  criterion: As fig3c-updown-over-sleep, over time-normalized packets. Reproduced when all five
