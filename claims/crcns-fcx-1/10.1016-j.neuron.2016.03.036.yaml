- id: fig5b-wake-between-packets
  statement: WAKE between nonREM packets increases the rate of the fastest sextile, more so with
    more movement; its decrease of slow cells is not significant (24 triplets).
  source: Results, Sleep sub-states induce differential lasting firing rate changes; Figure 5B,
    black; Figure 5C, upper left; Figure S5E
  quote: WAKE episodes increased the activity of the fastest-firing sextile group of pyramidal cells
    from nonREM packet n to packet n+1 ( Figure 5B , black). Furthermore, WAKE periods with more
    movement had a proportionally larger effect ( Figure 5C ; R = 0.43; p < 0.05). WAKE also appeared
    to exert a rate-decreasing effect on slow firing neurons, although this effect was not
    significant
  statistics:
  - about: movement during WAKE against fastest sextile change
    statistic: R = 0.43
    p: 0.05
    p_relation: "<"
    n: 24 nonREM-WAKE-nonREM triplets
  - about: log rate change against WAKE rate (Figure S5E)
    statistic: R = 0.043591
    p: 0.2963
  expected:
    quantity: nonREM-WAKE-nonREM triplets
    value: 24
    tolerance: 2.4
  criterion: Triplets packet, WAKE, packet by M6. "WAKE" between packets is not defined further;
    readings (a) a scored WAKE interval (7+ min), (b) any arousal over 40 s (including the 40 to
    120 s WAKE interruptions within SLEEP). Movement is the mean of the session's motion signal over
    the WAKE period. Reproduced when under one reading the fastest sextile increases (M6 test, p <
    0.05) and the movement correlation is positive at p < 0.05; partially reproduced when one holds.
    The absence of a significant slow-cell change is judged at p < 0.05 on the same test, and the
    S5E correlation at p < 0.05, both reported.
- id: fig5b-ma-between-packets
  statement: MAs between packets do not change fast-firing cells but increase the rate of
    slow-firing cells, with an inverse relation between rate and change across cells.
  source: Results, Sleep sub-states induce differential lasting firing rate changes; Figure 5B,
    yellow; Figure S5G
  quote: In contrast to WAKE, MA epochs between packets did not affect fast-firing neurons but
    significantly increased the rate of slow-firing neurons from packet n to packet n+1 ( Figure 5B ,
    yellow). Again, the differential effect across sextiles was confirmed by a correlation analysis
  statistics:
  - about: log rate change against WAKE rate (Figure S5G)
    statistic: R = -0.20668
    p: 7.7388e-11
  criterion: Triplets packet, MA, packet by M6. "Slow-firing" read as (a) the lowest sextile, (b)
    the lowest two. Reproduced when under one reading the slow group increases (M6 test, p < 0.05),
    the top sextile does not change at p < 0.05, and the S5G correlation is negative at p < 1e-10;
    partially reproduced when the slow-group increase holds.
- id: fig5b-rem-between-packets
  statement: REM between packets decreases the rates of all sextiles, by about the same proportion,
    with longer REM giving larger decreases; REM theta power correlates with the decrease of the
    slowest sextile only.
  source: Results, Sleep sub-states induce differential lasting firing rate changes; Figure 5B, red;
    Figure 5C, upper right; Figure S5F
  quote: Finally, REM episodes decreased the spike rates from packet n to packet n+1 in all sextile
    groups ( Figure 5B , red). Longer REM episodes exerted a proportionally larger effect on rate
    changes from packet n to packet n+1 for all sextile groups ( Figure 5C ; R = - 0.22; p < 10 −2 ;
    t-test) and REM theta power was significantly correlated with the packet n to packet n+1 rate
    decrease of the slowest sextile group only (R = - 0.15; p < 0.05). Correlational analysis did not
    reveal differential effects of REM on neurons across the rate spectrum
  statistics:
  - about: REM duration against rate change
    test: t-test
    statistic: R = -0.22
    p: 0.01
    p_relation: "<"
  - about: REM theta power against slowest sextile change
    statistic: R = -0.15
    p: 0.05
    p_relation: "<"
  - about: log rate change against WAKE rate (Figure S5F)
    statistic: R = -0.038346
    p: 0.2372
  criterion: Triplets packet, REM, packet by M6. All six sextiles show a decrease, each by the M6
    test at p < 0.05. Duration correlation, one point per triplet, mean change over all cells
    against REM duration (Fig. 5C legend, "across all cells"), M4. Theta power is the 5-10/2-16 Hz
    ratio averaged over the REM episode. The absence of a rate-dependent effect is judged by the
    S5F correlation at p < 0.05. Reproduced when all of these hold under one reading; partially
    reproduced when at least four of the six sextiles decrease and the duration correlation holds.
- id: fig5c-delta-change-slow-cells
  statement: Regardless of the intervening state, the increase of the slowest sextile from packet n
    to n+1 correlates positively with the change in delta power between the packets; the same is not
    found for the fastest sextile.
  source: Results, Sleep sub-states induce differential lasting firing rate changes; Figure 5C,
    lower left
  quote: The increase of spike rate from packet n to packet n+1 in the slowest sextile group was
    positively correlated with the delta power change from packet n to packet n+1 ( Figure 5C )
  criterion: All consecutive packet pairs in SLEEP; delta power normalized within session (Fig. 5C
    legend); one point per pair, Pearson. Reproduced when the slowest sextile shows R > 0 at p <
    0.05 and the fastest sextile does not at p < 0.05. No R or p is given in the text.
- id: figs2d-interneurons-unchanged
  statement: Unlike pyramidal cells, interneuron rates in the first and last packets of SLEEP lie
    on a line of slope 1 (95% interval 0.996 to 1.005).
  source: Figure S2D legend
  quote: Comparison of log firing rates of individual putative interneurons during the first and
    last packets of SLEEP. Unlike for pE cells (Figure 2B) the regression line is not different from
    unity (slope 95% confidence interval ... 0.996-1.005)
  statistics:
