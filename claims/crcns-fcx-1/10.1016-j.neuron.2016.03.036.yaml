  - about: spindle incidence within packets
    statistic: R = 0.7
    p: 1.0e-10
    p_relation: "<"
  - about: spindle duration within episodes
    statistic: R = 0.08
    p: 0.001
    p_relation: "<"
  - about: spindle duration within packets
    statistic: R = 0.07
    p: 0.0001
    p_relation: "<"
