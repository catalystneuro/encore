# Claims for Thompson & Gold (2026), "Limitations of pupil diameter as a proxy for modes of
# locus coeruleus activity", on dandiset 002034.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the eLife Reviewed Preprint, version 1 (2 October 2026, not revised), full text as
# served by the publisher's HTML: main text, figure legends, Materials and Methods, and the
# legends of Supplemental Figures 1 and 2 (the only supplement; it holds figures, no tables). No
# PDF was supplied and no figure image was read.
#
# Code read: https://github.com/lwthompson2/Thompson2026_LCPupilAnalysis, commit cf3c0b7
# (2026-10-19), linked under Data availability. MATLAB. It rebuilds the trial tables from the
# NWB files of this dandiset (Code/helpers/build_tables_from_nwb.m), restricts them to the
# manuscript's sessions and units (Code/include_lists/*.csv, apply_manuscript_filter.m),
# computes drift residuals and per-unit statistics (prepare_figure_analysis_tables.m), draws
# Figure 2 and the supplements (PaperFigures/), and prints the statistics
# (compute_manuscript_stats.m). Its README names dandiset 002034 version 0.261019.2146. The
# repository also holds Code/Results/manuscript_stats_nwb.txt, the printed output of that code
# on the dandiset. Some of its values differ from the paper's (for example Figure 2 row 1, Oz
# p = 0.000521 against the paper's 8.6e-4; row 6, Ci p = 0.0105 against 0.008; 50 Ci sessions
# for the pupil-only row against the paper's 51; 61 Ci units in the LLR counts against 63).
# The claims take the paper's numbers. The code also holds analyses the paper does not report
# (leave-one-out prediction, Figures S3 to S5), which are not claims here.
#
# Dataset: "Locus coeruleus and pupil data supporting Thompson et al., 202[6]", described as
# cleaned, trial-delimited data for figure and statistics regeneration. The paper is a
# reanalysis of the data of Joshi et al. 2016 (Neuron 89:221-34).
#
# Data the paper used. Two rhesus monkeys, Oz and Ci (Cicero in the code). 42 LC single units
# from 32 sessions (Oz) and 63 units from 51 sessions (Ci). Passive fixation task, fixation of
# 1 to 5 s; on about 25% of trials, at random, a loud tone (1 kHz, 0.5 s) 1 to 1.5 s into
# fixation ("beep trials"); the other trials are fixation-only. Measured per trial: pupil
# diameter (Eyelink 1000, monocular, 1000 Hz) and spike times of the sorted LC unit; trial
# times within the session.
#
# Method fixed here for every claim, from the Methods and the code (cited per item).
# - Units and sessions: those in the code's include lists (manuscript_session_include.csv,
#   manuscript_unit_include.csv), 32 sessions and 42 units for Oz, 51 sessions and 63 units for
#   Ci, matching the Results.
# - Trials (code, build_tables_from_nwb.m): correct trials only. Beep trials have a beep time.
#   Fixation-only trials have no beep and no stimulation marker. The Methods require at least
#   100 ms of baseline before the beep; the code requires the beep more than 400 ms after the
#   trial start and at least 800 ms before the end of the pupil record. The Methods' rule is the
#   main one, the code's a variant. Beep trials whose raw (not baseline-subtracted) evoked firing
#   rate, z-scored per unit over
#   all of the unit's baseline, evoked and fixation-only rates, has absolute value 8 or more are
#   dropped (code; the Methods are silent).
# - Pupil preprocessing (Methods, Pupillometry): z-scored per session, the mean trace aligned to
#   fixation onset subtracted from each trial, smoothed with a 151 ms boxcar. The code applies
#   none of these to the stored trace (acquisition "pupil_value_channel4") and uses it as is;
#   whether the stored trace already carries them is for the author to establish.
# - Baseline pupil (Methods): mean pupil over fixation, up to the beep on beep trials, the whole
#   fixation on fixation-only trials. The code takes the mean from the first sample of the
#   trial record to the beep sample, or to the end of the trial.
# - Evoked pupil. The Methods: the maximum change relative to baseline of means in 50 ms windows
#   slid in 10 ms steps, from beep onset to 20 ms before the end of fixation. "Maximum change"
#   allows two readings, named E1 (the largest value of window mean minus baseline) and E2 (the
#   window mean minus baseline of largest absolute value, sign kept, which is how the code
#   reads it). The code's own window (0 to 800 ms after the beep, 50 ms moving mean in 1 ms
#   steps, signed largest absolute value) is a variant.
# - Baseline firing rate (Methods, Neuronal Recordings): spikes from fixation onset to the beep
#   divided by that time on beep trials; from fixation onset to 20 ms before the end of
#   fixation on fixation-only trials. The code counts to the end of the trial on fixation-only
#   trials (variant).
# - Evoked firing rate (Methods, and code): rate 0 to 200 ms after the beep minus the trial's
#   baseline rate.
# - Drift residuals (Results paragraph 2, Figure 1B legend, and code): per unit, a linear
#   regression of the baseline values (pupil, and firing rate, separately) on trial time over
#   beep and fixation-only trials together; the residuals are the baseline measures.
# - Per-unit and per-session coefficients (code, compute_manuscript_stats.m and
#   PaperFigures/plot_02_examples_new.m). The paper's Figure 2 rows map to the code's
#   build_unit_summary rows as paper row 1 = code 3, 2 = 4, 3 = session summary, 4 = 2, 5 = 6,
#   6 = 5. Row 1, per unit, a partial Spearman correlation of baseline firing rate with
#   baseline pupil, controlling for trial time, over beep and fixation-only trials. Rows 2, 4,
#   5 and 6, per unit, a Spearman correlation over beep trials. Row 3, per session, a Spearman
#   correlation over beep trials, each trial once.
# - Population test, per monkey. The paper names a "Wilcoxon rank-sum test for H0: median
#   (partial) Spearman correlation coefficient across sessions = 0". That hypothesis is one
#   sample; the code runs the Wilcoxon signed-rank test against zero (signrank) and holds no
#   rank-sum test anywhere, and its printed signed-rank p-values equal the paper's for Figure 2
#   rows 2, 3, 4 and 6 in Oz (0.0135, 1.16e-6, 5.88e-7, 0.915). The test, T1, is therefore the
#   signed-rank test against zero, the stated hypothesis as the code settles it. A rank-sum of
#   the coefficients against an equal number of zeros (T2) is not described anywhere in the
#   paper or the code; it may be shown as a variant and decides no outcome.
# - Code's legacy removal (prepare_figure_analysis_tables.m, build_stats) drops rows 43 and 65 of
#   the per-unit stats table, leaving 61 Ci units; the session list for the per-session
#   analyses (Figure 2 row 3 and its LLR) is taken from that table, leaving 50 Ci sessions. The
#   paper's counts (63 units, 51 sessions) are the main reading; the code's removal is a
#   variant, or a reading where a claim says so.
# - Significance level 0.05 throughout (Figure 2 legend).
schema_version: 2
dataset:
  archive: dandi
  id: "002034"
paper: doi:10.7554/elife.112525
claims:
- id: data-units-sessions
  statement: The analysis used 42 LC single units from 32 sessions in monkey Oz and 63 units from
    51 sessions in monkey Ci, recorded with pupil diameter during passive fixation with
    occasional startling beeps.
  source: Results, paragraph 1
  quote: N = 42 single units from 32 sessions in monkey Oz and 63 units from 51 sessions in monkey
    Ci
  expected:
  - quantity: Oz units
    value: 42
    tolerance: 0
  - quantity: Oz sessions
    value: 32
    tolerance: 0
  - quantity: Ci units
    value: 63
    tolerance: 0
  - quantity: Ci sessions
    value: 51
    tolerance: 0
  criterion: Counts of units and sessions in the code's include lists that hold beep trials with
    LC spikes and pupil. Tolerance zero, as these are counts of recorded units and sessions, not
    estimates.
- id: fig2-row1-baseline-lc-pupil
  statement: Trial-by-trial baseline LC firing rate is positively correlated with baseline pupil
    diameter within sessions, after correcting both for linear drift, in both monkeys.
  source: Results, paragraph 2; Figure 2, row 1
  quote: trial-by-trial measurements of baseline LC activity were positively correlated with
    simultaneously recorded measurements of baseline pupil diameter over the course of a session
  statistics:
  - about: monkey Oz
    test: Wilcoxon rank-sum test for H0, median partial Spearman correlation coefficient = 0
    p: 8.6e-4
    n: 42 units
  - about: monkey Ci
    test: Wilcoxon rank-sum test for H0, median partial Spearman correlation coefficient = 0
    p: 9.85e-6
    n: 63 units
  criterion: Per unit, the partial Spearman correlation of row 1 (opening comment). Reproduced
    when, in each monkey, the median coefficient is above zero and the population test gives
    p < 0.05 under T1; partially reproduced when this holds in one monkey only. The p-values
    are reported beside the paper's.
- id: fig2-row2-evoked-lc-pupil
  statement: Baseline-subtracted evoked LC responses are positively correlated with
    baseline-subtracted evoked pupil responses within units, in both monkeys.
  source: Results, paragraph 2; Figure 2, row 2
  quote: Likewise, baseline-subtracted evoked LC responses were positively correlated with
    baseline-subtracted evoked pupil responses (p = 0.0135 for monkey Oz, p = 0.0018 for monkey
    Ci)
  statistics:
  - about: monkey Oz
    test: Wilcoxon rank-sum test for H0, median Spearman correlation coefficient = 0
    p: 0.0135
    n: 42 units
  - about: monkey Ci
    test: Wilcoxon rank-sum test for H0, median Spearman correlation coefficient = 0
    p: 0.0018
    n: 63 units
  criterion: Per unit, the Spearman correlation over beep trials of evoked firing rate with
    evoked pupil, under E1 and under E2. Reproduced when, in each monkey, the median coefficient
    is above zero and the population test (T1) gives p < 0.05, under E1 and under E2; partially
    reproduced when this holds in one monkey only. When E1 and E2 give different outcomes the
    claim is blocked as methods_underspecified.
- id: fig2-row3-pupil-evoked-vs-baseline
  statement: Baseline-subtracted evoked pupil responses are negatively correlated with baseline
    pupil diameter (drift residuals) within sessions, in both monkeys.
  source: Results, paragraph 3; Figure 2, row 3
  quote: baseline-subtracted evoked pupil responses were negatively correlated with baseline pupil
    diameter (using residuals; p = 1.16×10-6 for monkey Oz, p = 5.02×10-9 for monkey Ci; Figure 2,
    row 3)
  statistics:
  - about: monkey Oz
    test: Wilcoxon test for H0, median Spearman correlation coefficient = 0
    p: 1.16e-6
    n: 32 sessions
  - about: monkey Ci
    test: Wilcoxon test for H0, median Spearman correlation coefficient = 0
    p: 5.02e-9
    n: 51 sessions
  criterion: Per session, the Spearman correlation over beep trials (each trial once) of evoked
    pupil with the baseline pupil residual, under E1 and under E2. Reproduced when, in each
    monkey, the median coefficient is below zero and the population test (T1) gives p < 0.05,
    under E1 and under E2; partially reproduced when this holds in one monkey only. When E1 and
    E2 give different outcomes the claim is blocked as methods_underspecified. Sessions are the
    paper's 51 for Ci; the code's 50 (legacy removal, opening comment) is shown as a variant.
- id: fig2-row4-lc-evoked-vs-baseline
  statement: Baseline-subtracted evoked LC responses are negatively correlated with baseline LC
    activity (drift residuals) within units, in both monkeys.
  source: Results, paragraph 3; Figure 2, row 4
  quote: Similarly, baseline-subtracted evoked LC responses were negatively correlated with
    baseline LC activity (using residuals; p = 5.88×10-7 for monkey Oz, p = 1.04×10-11 for monkey
    Ci; Figure 2, row 4)
  statistics:
  - about: monkey Oz
    test: Wilcoxon test for H0, median Spearman correlation coefficient = 0
    p: 5.88e-7
    n: 42 units
  - about: monkey Ci
    test: Wilcoxon test for H0, median Spearman correlation coefficient = 0
    p: 1.04e-11
    n: 63 units
  criterion: Per unit, the Spearman correlation over beep trials of evoked firing rate with the
    baseline firing-rate residual. Reproduced when, in each monkey, the median coefficient is
    below zero and the population test gives p < 0.05 under T1; partially reproduced when this
    holds in one monkey only.
- id: fig2-row5-baseline-lc-vs-evoked-pupil
  statement: Evoked pupil responses are not reliably related to baseline LC activity; the median
    per-unit correlation does not differ from zero in either monkey.
  source: Results, paragraph 4; Figure 2, row 5
  quote: evoked pupil responses were rarely positively or negatively related to baseline LC
    activity in a reliable manner (Wilcoxon rank-sum test for H0... p = 0.894 for monkey Oz, p =
    0.904 for monkey Ci)
  statistics:
  - about: monkey Oz
    test: Wilcoxon rank-sum test for H0, median Spearman correlation coefficient = 0
    p: 0.894
    n: 42 units
  - about: monkey Ci
    test: Wilcoxon rank-sum test for H0, median Spearman correlation coefficient = 0
    p: 0.904
    n: 63 units
  criterion: A claim of absence. Per unit, the Spearman correlation over beep trials of evoked
    pupil with the baseline firing-rate residual. The paper's test is the population test at
    0.05 per monkey, T1 (opening comment). The evoked pupil has two readings (E1, E2), both
    run. Reproduced when the test gives p >= 0.05 in both monkeys; not reproduced when it gives
    p < 0.05 in either. When E1 and E2 give different outcomes the claim is blocked as
    methods_underspecified. The median coefficient per monkey is reported either way, and T2
    and the code's evoked pupil are shown as variants.
- id: fig2-row6-baseline-pupil-vs-evoked-lc
  statement: Baseline pupil diameter is not reliably related to evoked LC responses across
    monkeys; the median per-unit correlation does not differ from zero in Oz (p = 0.915) and
    does in Ci (p = 0.008).
  source: Results, paragraph 4; Figure 2, row 6
  quote: Likewise, baseline pupil diameter was rarely positively or negatively related to evoked LC
    responses reliably across monkeys (Figure 2, bottom row) (p = 0.915 for monkey Oz, p = 0.008
    for monkey Ci)
  statistics:
  - about: monkey Oz
    test: Wilcoxon rank-sum test for H0, median Spearman correlation coefficient = 0
    p: 0.915
    n: 42 units
  - about: monkey Ci
    test: Wilcoxon rank-sum test for H0, median Spearman correlation coefficient = 0
    p: 0.008
    n: 63 units
  criterion: Per unit, the Spearman correlation over beep trials of evoked firing rate with the
    baseline pupil residual. Population test per monkey at 0.05, T1 as main, T2 as variant (as
    in fig2-row5-baseline-lc-vs-evoked-pupil). The claim is that the relationship is not
    reliable across monkeys. Reproduced when Oz gives p >= 0.05 and Ci gives p < 0.05, the
    paper's pattern; partially reproduced when neither monkey reaches p < 0.05 (still no
    relationship across monkeys, but Ci's is not found); not reproduced when both monkeys give
    p < 0.05 with medians of the same sign; partially reproduced in the other cases (Oz
    p < 0.05 with Ci p >= 0.05, or both p < 0.05 with medians of opposite sign), where no
    relationship holds across monkeys but the paper's pattern is not found. Medians and
    p-values are reported.
- id: cross-epoch-no-reliable-relation
  statement: Despite consistent within-epoch relationships between LC activity and pupil size,
    there are no reliable relationships between the two across epochs (baseline of one against
    evoked of the other).
  source: Results, paragraph 4, last sentence; Discussion, paragraph 3
  quote: Thus, despite consistent relationships between LC activity and pupil size within each
    epoch, there were no reliable relationships between the two when comparing across epochs
  depends_on:
  - fig2-row1-baseline-lc-pupil
  - fig2-row2-evoked-lc-pupil
  - fig2-row5-baseline-lc-vs-evoked-pupil
  - fig2-row6-baseline-pupil-vs-evoked-lc
  criterion: Reproduced when rows 1 and 2 are reproduced (within-epoch relations in both
    monkeys) and neither cross-epoch row (rows 5 and 6) shows p < 0.05 with medians of the same
    sign in both monkeys. Not reproduced when either cross-epoch row does; partially reproduced
    when the cross-epoch rows hold but a within-epoch row holds in one monkey only.
- id: range-baseline-pupil-evoked-lc
  statement: The correlation between baseline pupil and evoked LC responses does not depend on
    the range of evoked LC responses in either monkey.
  source: Results, paragraph 5 (first additional analysis)
  quote: We found that the relationship between baseline pupil diameter and evoked LC responses was
    not systematically impacted by the range of evoked LC responses for either monkey (Spearman’s
    rho = 0.02, p = 0.89 for monkey Oz; rho = 0.07, p = 0.589 for monkey Ci)
  statistics:
  - about: monkey Oz
    test: Spearman correlation
    statistic: rho = 0.02
    p: 0.89
    n: 42 units
  - about: monkey Ci
    test: Spearman correlation
    statistic: rho = 0.07
    p: 0.589
    n: 63 units
  depends_on:
  - fig2-row6-baseline-pupil-vs-evoked-lc
  criterion: A claim of absence. Across units, per monkey, the Spearman correlation between each
    unit's row 6 coefficient and the range (maximum minus minimum) of its evoked firing rates
    over beep trials, as in compute_manuscript_stats.m (build_evoked_range_by_unit). The paper
    says the range is per session; the code takes it per unit, which is followed. Reproduced
    when p >= 0.05 in both monkeys; not reproduced when p < 0.05 in either. Rho is reported.
- id: range-baseline-lc-evoked-pupil
  statement: The correlation between baseline LC activity and evoked pupil responses does not
    depend on the range of evoked pupil responses in Ci (rho = 0.18, p = 0.16), but in Oz it
    becomes more negative as that range grows (rho = -0.33, p = 0.03).
  source: Results, paragraph 5 (first additional analysis)
  quote: the relationship between baseline LC activity and evoked pupil responses was not
    systematically impacted by the range of evoked pupil responses for monkey Ci (rho = 0.18, p =
    0.16). However, we did observe a modest impact for monkey Oz (rho = -0.33, p = 0.03)
  statistics:
  - about: monkey Ci
    test: Spearman correlation
    statistic: rho = 0.18
    p: 0.16
    n: 63 units
  - about: monkey Oz
    test: Spearman correlation
    statistic: rho = -0.33
    p: 0.03
    n: 42 units
  expected:
  - quantity: Oz Spearman rho, row 5 coefficient against evoked pupil range
    value: -0.33
    tolerance: 0.033
  depends_on:
  - fig2-row5-baseline-lc-vs-evoked-pupil
  criterion: Across units, per monkey, the Spearman correlation between each unit's row 5
    coefficient and the range (maximum minus minimum) of its evoked pupil responses over beep
    trials, as in compute_manuscript_stats.m, under E1 and E2. Reproduced when, under both, Ci
    gives p >= 0.05 and Oz gives p < 0.05 with rho within tolerance of -0.33; partially
    reproduced when Ci gives p >= 0.05 and Oz gives p < 0.05 with a negative rho outside the
    tolerance; not reproduced otherwise. When E1 and E2 give different outcomes the claim is
    blocked as methods_underspecified.
- id: figs1-raw-baselines-similar
  statement: Using raw baseline measures in place of drift residuals gives results similar to
    those of Figure 2.
  source: Results, paragraph 6 (second additional analysis); Supplemental Figure 1
  quote: we obtained similar results when using raw baseline measurements as opposed to residuals
    (see Supplemental Figure 1)
  depends_on:
  - fig2-row1-baseline-lc-pupil
  - fig2-row2-evoked-lc-pupil
  - fig2-row3-pupil-evoked-vs-baseline
  - fig2-row4-lc-evoked-vs-baseline
  - fig2-row5-baseline-lc-vs-evoked-pupil
  - fig2-row6-baseline-pupil-vs-evoked-lc
  criterion: The six Figure 2 coefficients recomputed with raw baseline pupil and raw baseline
    firing rate in place of their residuals, as the code's "baseline" mode does
    (PaperFigures/plot_S1_summary.m; row 1 stays the partial Spearman controlling for trial
    time), and the population test per monkey. "Similar" is judged on the paper's own Figure 2
    pattern, the sign of the median and whether p < 0.05, for 12 row and monkey cells.
    Reproduced when all 12 match the pattern the paper reports with residuals (rows 1 to 4
    significant in the reported direction in both monkeys, row 5 not significant in either,
    row 6 not significant in Oz and significant in Ci); partially reproduced when 10 or 11
    match; not reproduced below 10. The population test is T1 (T2 shown as a variant). Run
