- id: figs2-llr-pupil-baseline-evoked
  statement: The relationship between baseline and evoked pupil responses is better described by
    a quadratic than a linear fit in only a minority of sessions (7 of 32 for Oz, 6 of 51 for
    Ci).
  source: Results, paragraph 7 (third additional analysis); Supplemental Figure 2, first panel
  quote: The relationship between baseline and evoked pupil responses was better described by a
    non-linear fit for a minority of sessions (LLR > critical value of 3.841... 7/32 sessions for
    monkey Oz, 6/51 sessions for monkey Ci)
  expected:
  - quantity: Oz sessions with LLR above 3.841
    value: 7
    tolerance: 1
  - quantity: Ci sessions with LLR above 3.841
    value: 6
    tolerance: 1
  criterion: Per session, beep trials each once, evoked pupil regressed on the baseline pupil
    residual with a linear and a quadratic model fit by maximum likelihood (the code's fitlme
    with formulas y ~ x and y ~ x*x, compute_manuscript_stats.m); LLR = 2 times the difference in
    log-likelihood, counted above 3.841. Sessions with fewer than 4 valid trials or 3 distinct
    predictor values are left out, as in the code. Run under E1 and E2, and with all sessions
    (the paper's 51 for Ci) or the code's 50 Ci sessions (legacy removal, opening comment;
    compute_manuscript_stats.m prints 6/50). Tolerance of one session, as 10% of these counts
    is under one session and would demand an exact count. Reproduced when both counts are
    within tolerance and below half the sessions under one reading; partially reproduced when
    the counts are outside tolerance but below half the sessions.
- id: figs2-llr-lc-baseline-evoked
  statement: LC evoked responses are rarely better described by a quadratic than a linear
