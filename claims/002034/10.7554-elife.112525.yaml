- id: fig3-pooled-within-epoch
  statement: With data z-scored per session or unit and pooled across trials, sessions and units
    for each monkey, the within-epoch relationships of Figure 2 hold (baseline LC with baseline
    pupil and evoked LC with evoked pupil positive; evoked against baseline negative for pupil
    and for LC).
  source: Results, paragraph 8 (fourth additional analysis); Figure 3, columns 1 to 4
  quote: we applied our single-unit analyses (Figure 2) to data pooled across all trials,
