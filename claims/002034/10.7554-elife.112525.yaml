    tolerance: 1
  - quantity: Oz units with LLR above 3.841, evoked LC on baseline pupil
    value: 2
    tolerance: 1
  - quantity: Ci units with LLR above 3.841, evoked LC on baseline pupil
    value: 5
    tolerance: 1
  criterion: Per unit, beep trials, evoked pupil regressed on the baseline firing-rate residual,
