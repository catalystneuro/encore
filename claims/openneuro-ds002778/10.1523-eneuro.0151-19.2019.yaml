# Claims for Jackson, Cole, Voytek & Swann (2019), eNeuro 6(3) ENEURO.0151-19.2019, on OpenNeuro ds002778.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-10-27,
# protocol as stated in docs/protocol.md.
#
# Text read: the version of record, full text from Europe PMC PMC6553574 (main text, Methods, figure
# legends, Tables 1 to 3). The only supplement is Extended Data 1, the analysis code, which is the
# GitHub repository read below. Figures were not opened; no claim needs a value read off a figure.
#
# Code read: https://github.com/SwannLab/Jackson_2019 at commit a7c89f50106aa4ccec76ace18bbfa45a5440545e
# (2020-05-19). It holds utils.py (loading the preprocessed traces, shape and PAC per recording),
# shape.py (zero crossings, peaks and troughs, sharpness, steepness), pac.py (normalized modulation
# index, Ozkurt and Schnitzler 2011) and notebooks Figure_1, Figures_2,3 and Figure_4. The notebooks
# print the Wilcoxon, rank sum, Spearman and Cohen's d values of Tables 1 and 2 (beta) and Figure 3.
# The code starts from preprocessed MATLAB files (AVG_motor.mat, rejectscombined.mat) that are not in
# the repository: the MATLAB preprocessing, the manual artifact marks, the mu/alpha analysis, the
# bipolar and CSD analyses, the F7/F8 and T7/T8 tests, the power spectra, the topographies and the Q4
# effect sizes (Table 3) are not in the code.
#
# Data the paper used (Methods, Participants and Data collection): resting scalp EEG from a dataset
# first published by George et al. (2013) and reanalysed by Swann et al. (2015). 15 PD patients (8
# female, mean age 63.2 +/- 8.2 years), each recorded on and off dopaminergic medication on different
# days in counterbalanced order (off means medication stopped at least 12 h before), and 16 age-matched
# controls (9 female, 63.5 +/- 9.6 years) recorded once. 32-channel BioSemi ActiveTwo, 512 Hz, at least
# 3 min of rest fixating a cross, with extra electrodes beside and below the left eye. Measured
# variables used here: EEG at C3 and C4 (sensorimotor), F7, F8, T7 and T8 (near the temporalis
# muscles), CP1 and CP2 (bipolar montage), all electrodes for topographies and the CSD montage, and
# UPDRS scores on and off medication. The archive's title, "UC San Diego Resting State EEG Data from
# Patients with Parkinson's Disease", and its README, which asks users to cite this paper, say it holds
# these recordings.
#
# Method, from the Methods unless a step says otherwise.
# Preprocessing: remove each electrode's mean, common average reference, exclude excessively noisy
# electrodes, high-pass at 0.5 Hz with a two-way FIR filter (EEGLAB eegfilt), then exclude the
# manually marked artifact samples after filtering. Every measure is computed per electrode and per
# recording on the whole resting recording; the composite value of a participant is the mean of its C3
# and C4 values (Methods, Data preprocessing, paragraph 2; the code's pooldata averages the two halves
# of the 30 patient and 32 control recordings). The same is done for F7 and F8.
# Peaks and troughs (Methods, Sharpness ratio; code shape.findpt): band-pass 13 to 30 Hz with
# scipy.signal.firwin, floor(3 * 512 / 13) = 118 taps (the paper's "order = 231 ms"), applied with
# filtfilt to the whole trace; rising and falling zero crossings of the filtered signal; the maximum
# (peak) and minimum (trough) of the unfiltered signal between them; extrema within 100 samples of
# either end of the trace are dropped (code, boundaryS=100); extrema whose sample index is a rejected
# sample are dropped (code, measure_shape).
# Sharpness (code shape.ex_sharp): the absolute value of the mean of the voltage at the extremum minus
# the voltage 3 samples before and 3 samples after. Sharpness ratio is log10 of the larger of mean peak
# sharpness / mean trough sharpness and its inverse (code uses log10; the paper says "log").
# Steepness (code shape.rd_steep): rise steepness is the largest first difference from a trough to the
# next peak, decay steepness the largest negative first difference (as a positive number) from a peak
# to the next trough. Steepness ratio is log10 of the larger of mean rise / mean decay and its inverse.
# In the code rise steepness values are deleted at the positions of rejected peaks and decay values at
# the positions of rejected troughs; the Methods do not say how rejection applies to steepness.
# Peak-to-trough ratio is log10(mean peak sharpness / mean trough sharpness) and rise-to-fall ratio is
# log10(mean rise steepness / mean decay steepness), signed (Methods; code Figure_4 takes log10).
# PAC (Methods, PAC; code pac.ozkurt): beta 13 to 30 Hz and gamma 50 to 150 Hz, firwin band-pass with
# filtfilt, Hilbert phase of beta and amplitude of gamma, rejected samples removed after the Hilbert
# transform, then |sum(a exp(i phi))| / (sqrt(N) sqrt(sum(a^2))). The Methods give filter orders of
# 231 ms (beta) and 240 ms (gamma), that is 118 and 123 samples at 512 Hz; the code uses 231 and 240
# taps. The Methods are the main reading and the code's taps a variant.
# Statistics (Methods, Statistical tests; code Figures_2,3): Wilcoxon signed rank for off against on
# (scipy.stats.wilcoxon defaults; the printed p-values match its normal approximation, for example
# W = 12, n = 15 gives p = 0.0064), Wilcoxon rank sum for off against controls (scipy.stats.ranksums,
# z statistic, positive when off is larger), Spearman correlation, Benjamini-Hochberg FDR. In Tables 1
# and 2 the FDR family is the six tests of a table (three measures by two bands). Cohen's d (code
# effectsize) is (mean1 - mean2) / sqrt((sd1^2 + sd2^2) / 2) with sample standard deviations, computed
# as for unpaired groups also for the paired off and on comparison.
#
# Details left open, with the readings each criterion uses.
# - Artifact rejection. The marks were made by hand and are not published with the paper or its code.
#   Readings: (a) the dataset's own artifact annotations or bad-segment marks, if it holds any; (b) no
#   rejection beyond the 100-sample edge rule. A criterion whose outcome differs between them rests on
#   the choice.
# - Noisy electrodes. Which electrodes were excluded, and by what rule, is not given. Readings: (a) the
#   dataset's own bad-channel marks, if any; (b) all 32 scalp electrodes kept. The eye electrodes are
#   not scalp electrodes and are left out of the common average in both.
# - The 0.5 Hz high-pass order is eegfilt's default (3 * fix(512 / 0.5) samples), a standard choice
#   that the paper fixes only by naming the function.
# - Wilcoxon p-value. Main reading the normal approximation without continuity correction (as the
#   code's printed p-values show); the exact distribution is a variant.
# - PAC filter length, 118 and 123 samples (Methods) against 231 and 240 taps (code), as above.
# - Filters for the mu/alpha band (8 to 12 Hz), which the code does not cover. Shape filter by the
#   code's rule, 3 cycles of the low cutoff (floor(3 * 512 / 8) = 192 taps). PAC phase filter readings:
#   (a) 3 cycles of 8 Hz, 192 taps (pacpy's default rule); (b) 231 taps as in the code for beta; (c)
#   118 samples as the Methods give for beta. Gamma 50 to 150 Hz as for beta. For the shape filter the
#   Methods' 231 ms (118 samples) for beta is a second reading.
# - Which half of the code's 30 patient recordings is C3 is not stated; the Q4 counts per electrode
#   (9 at C3, 8 at C4) are judged without regard to which electrode has which count where noted.
# - Cohen's d for PAC. The Methods say PAC was log-scaled for effect sizes; the code's d on raw PAC is
#   0.83, the value in Table 1, and Table 3 gives 0.75 for all patients. Readings: raw PAC and log10 PAC.
