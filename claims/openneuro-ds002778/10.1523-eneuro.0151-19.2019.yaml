    value: 9
    tolerance: 1
  - quantity: patients with off and on in Q4 at C4
    value: 8
    tolerance: 1
  - quantity: patients with off and on in Q4 at both C3 and C4
    value: 8
    tolerance: 1
  - quantity: patients with at least one electrode in Q4 both off and on
