- id: fig4a-sensorimotor-q4
  statement: Over sensorimotor electrodes, patients' beta waveforms mostly have sharper peaks than
    troughs and steeper decays than rises (quadrant 4 of peak-to-trough against rise-to-fall ratio).
  source: Results, Waveform shape, paragraph 1; Figure 4A, C
  quote: In general, sensorimotor electrode oscillations had a sharper peak with a steeper decay,
    falling in quadrant 4 (Q4) in Figure 4
  criterion: One point per patient, electrode (C3, C4) and medication state, 60 points, of log10
    peak-to-trough ratio against log10 rise-to-fall ratio (code Figure_4). Q4 is positive
    peak-to-trough and negative rise-to-fall (the shaded quadrant in Figure_4). Reproduced when more
    than half the points are in Q4 and Q4 holds more points than any other quadrant; partially
    reproduced when Q4 is the most common quadrant without a majority.
- id: q4-patient-counts
  statement: Nine of 15 patients have both off and on data in Q4 at C3, eight at C4; eight have both
    electrodes in Q4, giving nine patients with at least one electrode in Q4 on and off.
  source: Results, Waveform shape, paragraph 2
  quote: Out of 15 patients, nine patients met this criterion for C3 and eight met the criterion for C4
    ... Using this approach there were nine total Q4 observations for each waveform metric
  expected:
