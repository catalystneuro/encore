- id: fig5f-rsc-pmr-onset
  statement: In retrosplenial cortex, as in PoSub, units with a larger firing-rate overshoot at
    UP state onset (peak-to-mean ratio, PMR) enter the UP state earlier; UP onset delay and PMR
    are negatively correlated (Kendall tau = -0.28, n = 570 units from 14 sessions in 3 mice,
    p = 6.76e-21).
  source: Figure 5F legend; Results, Post-DOWN rebound suggests a widespread role for Ih in
    neuronal activation at UP onset, paragraph 4
  quote: We found a similar relationship in the frontal cortex ... and RSC (data available at
    DANDI:000987) (Figure 5F).
  statistics:
  - test: Kendall tau rank correlation, UP onset delay against PMR
    statistic: tau = -0.28
    p: 6.76e-21
    n: 570 units from 14 sessions (3 mice)
  expected:
  - quantity: Kendall tau between UP onset delay and PMR, RSC units pooled over sessions
    value: -0.28
    tolerance: 0.028
  - quantity: units in the test
    value: 570
    tolerance: 57
  criterion: >-
    Method from Figure5F.py and detectDOWNs_RSC.py (commit 4ee34f3), which agree with the STAR
    Methods (UP and DOWN state detection; Peri-Event Time Histograms; Sequential Activation at UP
    onset) and the Results definition of PMR. NREM epochs are those of the sleep scoring
    (SleepScoreMaster). DOWN states are the ones the dandiset carries as the study's, if it
    carries them; they are also re-detected as the code does it, and the re-detection is shown
    as a check. Re-detection, per session, from the spikes of all units in NREM, counted in
    10 ms bins, smoothed with a Gaussian of 20 ms s.d. (pandas rolling window of 100 bins, std
    2 bins) and summed; DOWN states are the intervals below the 20th percentile of that rate;
    intervals shorter than 10 ms are dropped, those closer than 20 ms merged, and then those
    shorter than 30 ms or longer than 500 ms dropped; UP states are the intervals between
    consecutive DOWN states, and the DOWN states are then restricted to NREM. Per unit, the
    PETH of its spikes around each UP state start (the DU transition) is pynapple's
    compute_eventcorrelogram with 5 ms bins, a 0.255 s window, ep = the UP states and norm =
    True (spikes and events restricted to UP states, the PETH divided by the unit's mean rate
    in UP states), smoothed with a Gaussian of 2 bins s.d. (10 ms, rolling window of 8 bins)
    and cut to 0 to 0.155 s after DU. UP onset delay is the first time in that interval at
    which the normalized PETH exceeds 0.5; PMR is the maximum of the normalized PETH in that
    interval; a unit that never exceeds 0.5 is left out. Units of all sessions are pooled and
    scipy's kendalltau is computed between UP onset delay and PMR. Which units enter is open.
    The text allows two readings. (a) All sorted units, as Figure5F.py does (no cell-type
    selection) and as the legend's n of 570 units, the total recorded per the Methods,
    implies. (b) Putative EX units only, per the Methods sentence "only EX units were used for
    analyses", classified by trough-to-peak duration above 0.35 ms and mean rate below 10 Hz
    in open-field exploration (Spike sorting and unit classification). Both are run. Reproduced
    when tau is negative with p < 0.05 under both readings and within tolerance of -0.28 under
    at least one; partially reproduced when tau is negative with p < 0.05 under both but outside
    tolerance under both; not reproduced when tau is not negative with p < 0.05 under either;
    blocked as methods_underspecified when the readings disagree on sign or significance. The
    number of units entering the test is reported under each reading. The pynapple version is
    not pinned by the code; any version whose compute_eventcorrelogram takes these arguments is
    a standard choice and is reported. The Figure 5F legend reads "Same as (D)", an Isomap
    plot, but Figure5F.py draws the 2D histogram of UP onset delay against PMR with its fit
    line, as Figure5C.py does; only the correlation is tested.
