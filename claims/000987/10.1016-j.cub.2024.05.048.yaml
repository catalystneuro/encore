# Claims for Mehrotra, Levenstein et al. (2024), Current Biology 34, 3043-3054, on dandiset 000987.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-22, under
# docs/protocol.md, version pilot-10, Reader.
#
# Text read: the version of record (PDF supplied by a person, extracted to text), with its STAR
# Methods (pages e1 to e8) and the Supplemental Information (legends of Figures S1 to S5). The
# figures were not read; the PDF could not be rendered here, and no claim needed a figure the
# text garbles. The extraction renders Greek letters and some symbols wrongly (Kendall tau as
# "t", "x 10^" as "3 10", minus signs as a replacement glyph, micro as "m"); quotes avoid them.
#
# Code read: github.com/PeyracheLab/MehrotraLevenstein_2023 at commit 4ee34f3 (2025-04-06), the
# repository the Key Resources Table names. It holds Python scripts per figure panel under
# Analysis/ (Figure1C-H, Figure5B-F, FigureS1H, S2A, S2F, S2G, S3A, S5AandB), the DOWN-state
# detectors (detectDOWNs_PoSub.py, detectDOWNs_ADn.py, detectDOWNs_RSC.py), the Isomap ring
# script makeRing.py, the DOWN/UP event files the PoSub and ADN scripts read (Analysis/OutputFiles),
# and the MATLAB model code under Model/ (Figure3.m, FigureS3b-d.m, FigureS3f.m). It has no code
# for Figures 1I to 1K, 2, 4 or S4, and does not pin the versions of pynapple or nwbmatic.
#
# Data the paper used. Three in vivo datasets and one ex vivo dataset.
# - PoSub (Figures 1, 2, 5B-D, S1, S2, S5): 1,657 single units, 1,097 putative excitatory (EX),
#   one session per mouse, 16 sessions from 16 mice, a 64-site single-shank silicon probe along
#   the dorsoventral (DV) axis of postsubiculum; sleep in the home cage and open-field
#   exploration; HD tracked at 100 Hz. Deposited at DANDI:000939 (Duszkiewicz et al. 2024), not
#   in this dandiset.
# - ADN (Figure S2F, S2G): 9 sessions from a previously published dataset (ref. 14, Peyrache et
#   al. 2015); the paper names no archive for it.
# - Frontal cortex (Figure 5E): 950 EX units from 25 sessions in 11 rats, Watson et al., CRCNS
#   fcx-1.
# - RSC (Figure 5F), the data of this dandiset: adult mice, one C57BL/6J and two C57BL/6J x
#   FVB/NJ crosses (3 mice), probes in left RSC (one animal with an 8-shank Buzsaki64 probe and
#   CA1 wires), 14 sessions, 570 units in total; each session has home-cage sleep and
#   exploration of a square and a circular arena; position and head direction tracked at
#   120 Hz; LFP at 1.25 kHz. Measured variables used by the paper: spike times of units, NREM
#   epochs (SleepScoreMaster), and UP and DOWN states detected from the population rate. The
#   archive's description of the dandiset says it holds 14 recordings from 3 mice with 570
#   isolated units, sleep scoring and the detected UP and DOWN states as used in the study, and
#   that it was used for Figure 5F.
# - Ex vivo (Figures 4, S4): whole-cell recordings of layer III PoSub cells, 59 cells from 11
#   mice in control and 19 cells from 8 mice with ZD-7288; not deposited.
# - Model (Figures 3, S3): simulations of an adapting Wilson-Cowan array, code in Model/.
#
# Only the RSC claims (rsc-dataset, fig5f-rsc-pmr-onset) use this dandiset. The other claims
# cover the paper's main findings and use data elsewhere or not deposited. Claims
# figs1i-du-more-stable, figs1kl-not-firing-rate and figs2d-lfp-spike-agree were added by the
# check of 2026-10-22.
