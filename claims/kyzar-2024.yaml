- id: probe-cells-mfc
  statement: In the MFC, 122 units (26.93%) qualified as probe cells.
  source: Technical Validation, Proportion of selective cells, paragraph 3
  quote: In the MFC, 144 (31.79%) cells qualified as maintenance cells and 122 (26.93%) as probe
