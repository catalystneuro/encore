# Claims for Kyzar, Kaminski, Brzezicka, Reed, Chung, Mamelak & Rutishauser (2024), Sci Data 11, 89,
# on dandiset 000469.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23, protocol
# as stated in docs/protocol.md.
#
# Text read: the version of record, as served by Europe PMC (PMC10796636), full text with Methods,
# Technical Validation, figure legends and Tables 1 to 3. The paper is a data descriptor and has
# no supplement. Its Methods are said to be abbreviated from refs 15 and 20 (Kaminski et al. 2017,
# Nat Neurosci; Kaminski et al. 2020, Neuron); those papers were not used here, as the protocol
# takes methods from this paper and the code it links.
#
# Code read: github.com/rutishauserlab/workingmem-release-NWB, branch main at commit f8594e0
# (2024-01-22). Its code is identical to tag v1.0.0 (commit 4a98f46, 2023-07-18); only README.md
# and CITATION.cff differ. A commit of 2024-01-12 (7d7b00f) that rewrote the selectivity code
# for another dataset was reverted the same day (3098793) and is not used. The repository holds
# MATLAB scripts. NWB_SB_import_main.m runs the analysis; NWB_calcSelective_SB.m and
# NWB_calcSelective_SC.m classify concept, maintenance and probe cells; NWB_QA_graphs.m computes
# the behaviour and the spike sorting metrics of Figs 1c,d and 3; NWB_SB_plotCell_Sternberg.m and
# NWB_SB_plotCell_Screening.m list the example units of Figs 4 and 5.
# Where the code and the Methods disagree, the Methods give the main criterion and the code's
# choice is a variant. They disagree on the tests. The Methods name permutation tests (a
# permuted one-way ANOVA, permutation t-tests, a permutation test); the code runs parametric
# tests (anovan, paired one-sided ttest) and keeps permutation versions (2000 permutations) only
# in comments. The code also has three defects that matter. (1) In NWB_calcSelective_SB.m the
# preferred and non-preferred trial masks are logical(id_Trial_maxOnly) and ~id_Trial_maxOnly,
# where id_Trial_maxOnly holds the image ID (1 to 5) or -1, so the first selects every trial and
# the second none; as written, hzNonPref is empty and the extra maintenance test for concept
# cells cannot run. (2) hzPref and hzNonPref are taken from the Encoding 1 window (200 to 1000
# ms), not the maintenance period the paper names. (3) The probe test's encoding rate counts
# the Encoding 2 window a second time in place of Encoding 3. The released code therefore
# cannot have produced the paper's persistent activity numbers as written; the intended masks
# (trials whose Encoding 1 image is or is not the preferred image) are used where the code is
# followed.
#
# Data the paper used (as the paper reports it): 21 patients with drug-resistant epilepsy and
# hybrid macro-micro depth electrodes, 41 sessions (20 screening and 21 Sternberg; patient
# P47HMH, subject 19, has no screening session). Two NWB files per subject, sub-<ID>-ses-1
# (screening) and sub-<ID>-ses-2 (Sternberg). Screening, 54 to 64 images shown six times each
# for 1 s; 907 units. Sternberg, 108 or 135 trials per session, loads 1 to 3 drawn from 5
# images chosen from screening; fixation cross (900 to 1000 ms), encoding images of 1 s each,
# maintenance 2.5 to 2.8 s, probe until response; 902 units (hippocampus 190, amygdala 259,
# dACC 171, pre-SMA 250, vmPFC 32). Measured variables per trial: loads, image IDs per encoding
# and probe, probe_in_out, response_accuracy, timestamps of fixation, encodings, maintenance,
# probe and response; per unit: spike times, waveforms, electrode with brain area and MNI
# coordinates, and the stored quality metrics (waveforms_isolation_distance,
# waveforms_mean_proj_dist, waveforms_mean_snr, waveforms_peak_snr). MTL is amygdala and
# hippocampus; MFC is dACC, pre-SMA and vmPFC (the code's grouping, which the reported
# denominators match).
