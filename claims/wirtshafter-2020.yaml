# Claims for Wirtshafter & Wilson (2020), eLife 9:e55252, "Differences in reward biased spatial
# representations in the lateral septum and hippocampus", doi:10.7554/elife.55252, on CRCNS data set
# hc-29 (doi:10.6080/K0NG4NV8).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-11,
# protocol as stated in docs/protocol.md (Reader), version pilot-14.
#
# Text read: the version of record (PMC7274787, open access), as JATS XML flattened to text under
# paper/: main text, Materials and methods, the legends of Figures 1 to 7 and of all their figure
# supplements (Figure 2 S1, Figure 3 S1 and S2, Figure 5 S1 to S5, Figure 6 S1 and S2, Figure 7 S1
# to S3). The paper has no other supplementary file. No PDF was supplied; no claim rests on a
# number shown only in a figure. The extraction garbles the bits/spike formula (its letters are
# spaced out) and the FRAI formula ("FRAI = F1 F2 / (F1+F2)", the minus sign lost); the code settles
# the second. The data set's description (paper/hc-29.data-description.txt) was read only to know
# what it holds: sorted spike times of LS and HPC units, one file per region, labelled by session
# date, tetrode and cluster, and "time files for all sessions". It does not name position data.
#
# Code read: https://github.com/elifesciences-publications/data_analysis, commit 5c6320a9
# (2020-06-04), the eLife archived copy linked from Data and code availability (MATLAB; the live
# repository github.com/hsw28/data_analysis is at d0ea9e54, 2024-02-06, and was not used). In
# hannah-in-use/matlab: decode_pos/bitsperspike.m, bitspersec.m and MASSmutualinfo.m (with
# mutualinfo.m) the information measures; bulk/MASSplacefieldnum.m the place fields, their sizes,
# centres and location classes; bulk/MASSplacefieldnumDIRECTIONAL.m the fields split by direction
# of travel, skew, FRAI and the shuffled skew; bulk/MASSplacefieldnumDIRECTIONALtrials.m the lap by
# lap analysis; bulk/CCpairs.m the HPC-LS pairing and cross-correlations; spiketrain.m the binned
# trains. No script in the archive generates the Poisson units of Figure 2B or runs the speed and
# acceleration regression of Figure 3 S1 under a name that says so; makeSpikes.m exists and was not
# confirmed to be the one used.
#
# Method, from the Methods unless the code is named. Position at about 30 Hz (often about 15 Hz
# from occlusion). Speed is the distance between the positions just before and just after a time
# point, smoothed with a Gaussian of 1 s SD, in cm/s (Methods; the code smooths with
# smoothdata(..., 'gaussian', 30), a 30-sample window, a variant). Only occupancy and spikes at
# speed of 12 cm/s or more are used (the code uses > 12). Rate maps are occupancy-normalised, in
# 1 cm bins for bits/spike and bits/s and 2 cm bins for place fields, smoothed with a Gaussian of
# 10 cm SD (code: bins of 3.5 * dim pixels, so 3.5 pixels per cm; empty bins interpolated by
# chartinterp before ndnanfilter smoothing). Bits/spike = sum_i P_i (R_i/R) log2(R_i/R) and
# bits/s = sum_i P_i R_i log2(R_i/R), P_i the occupancy probability, R_i the bin rate, R the mean
# rate (in the code, the mean of the rate map). Cells with mean rate below 0.05 Hz above the speed
# threshold are dropped. Mutual information as in Ego-Stengel and Wilson 2007; in the code, the
# mutual information between x and y of the smoothed rate map normalised to a joint distribution.
# Place field (Results paragraph 4, Methods, MASSplacefieldnum.m): bins of the smoothed 2 cm map
# with rate at or above mean + 1 SD of the map's bins (the Methods print "equal to or less than",
# which the Results and the code contradict), connected on the four sides, with a peak above mean
# + 2 SD and a length of at least 15 cm (code: the larger of the field's row and column extents
# times the bin size, the two arms summed near the corners). The centre is the bin of highest rate.
# Location classes (code, pixel boxes): forced sides (left and right forced arms and their ends),
# forced point, centre stem, choice point, choice sides (choice arms and their ends); the forced
# and choice points are left out of the location counts. Direction (MASSplacefieldnumDIRECTIONAL.m):
# spikes are split by the sign of the velocity along each arm or the stem, toward reward meaning
# toward the choice ends; each direction's map uses the direction's spikes over all fast
# occupancy. A cell with fields in both directions whose centres are less than 20 cm apart is
# bidirectional. Skew (Methods; code) is the third moment of the field's rate profile along the
# track, the width averaged, over the cube of its SD. Cross-correlation (Methods; CCpairs.m): each
# HPC field is matched to the LS field of the same session and direction whose centre is within
# 20 cm, the one with the closest mean in-field rate if several; spike trains in 10 ms bins over the
# whole session, MATLAB crosscorr over +-10 lags (+-100 ms); a cross-correlation with a randomly
# permuted LS train is subtracted; a pair's location is that of the HPC field centre. HPC leads at
# positive lags (CCpairs.m comment).
#
# Places where the code and the Methods differ, each named again where it matters: (1) speed
# smoothing (above); (2) the Methods drop cells with a maximum rate below 0.05 Hz, the code drops
# fields of cells with a maximum map rate below 0.5 Hz; (3) the track coverage rule: the Results
# exclude sessions where the animal did not cover the whole track at 12 cm/s or more; the code
# keeps a session when its 5 cm occupancy chart has at least 1950 bins, counted as written over all
# bins, visited or not; (4) in CCpairs.m the per-pair average stored is the mean of the raw
# cross-correlation, the shuffle-subtracted traces being kept apart, while the Methods subtract the
# shuffle. The Methods are the main reading; the code's choice is a variant.
#
# Data the paper used. Six male Long-Evans rats, each with two 16-tetrode arrays, one in dorsal CA1
# and one in caudodorsal lateral septum, recorded simultaneously; 452 LS and 178 CA1 units; one
# 30 min session a day on a double-sided (end to end) T maze with a forced phase (one side of one T
# blocked) and a free choice phase (the same side of the opposite T rewarded with sucrose and
# chocolate milk). Measured variables: spike times of sorted units, overhead-camera position at
# about 30 Hz, and from them speed, direction of travel and arm. The analyses use position for
# every claim; the data set's description names spikes and time files only, so whether position is
# held is for the author to find.
schema_version: 2
paper: doi:10.7554/elife.55252
claims:
- id: units-recorded
  statement: 452 caudodorsal LS units and 178 CA1 units were recorded in six rats, of which 165 CA1
    and 378 LS cells met the spike rate and track coverage criteria.
  source: Results, opening paragraph; Results, Place fields are less abundant, paragraph 5
  quote: we recorded the activity of 452 caudodorsal LS units and 178 CA1 hippocampus units in six
    male Long Evans rats
  expected:
  - quantity: LS units recorded
    value: 452
    tolerance: 45
  - quantity: CA1 units recorded
    value: 178
    tolerance: 18
  - quantity: CA1 cells meeting rate and coverage criteria
    value: 165
    tolerance: 17
  - quantity: LS cells meeting rate and coverage criteria
    value: 378
    tolerance: 38
  criterion: Units are counted from the data set's sorted clusters by region. The criteria are a
    mean rate of at least 0.05 Hz above 12 cm/s and full track coverage (Results paragraph 1 of the
    first section; Methods, Bits/spike). What full coverage means is open; the readings are
    (a) the code's rule (a session's 5 cm occupancy chart has at least 1950 bins, as written in
    bitsperspike.m) and (b) every arm, the stem and both T junctions visited at 12 cm/s or more in
    the session. Reproduced when the four counts are within tolerance under one reading.
