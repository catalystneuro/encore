- id: fig2b-poisson-control
  statement: Artificial LS units firing as Poisson processes at the recorded LS units' mean rates
    carry less spatial information than the recorded units (mean 0.43 against 0.73 bits/spike;
    7.96% above 0.8), and their bits/spike distribution differs from the recorded one.
  source: Results, Place fields are less abundant in the LS, paragraph 1; Figure 2B inset and legend
  quote: The distribution of the bits/spike for the artificial units was highly significantly
    different than the distribution of bits/spike for actual units (KS test, p<10 −15 ), and only
    7.96% of artificial units had bits/spike measurements of greater than 0.8. The average
    bits/spike for the artificial units was 0.43
  statistics:
  - about: artificial against recorded LS bits/spike distributions
    test: KS test
    p: 1.0e-15
    p_relation: <
  - about: artificial against recorded LS mean bits/spike
    test: two-tailed two sample t-test
    statistic: t(818)=6.72
    p: 1.0e-10
    p_relation: <
    n: 454 artificial units and the recorded LS units
  depends_on:
  - fig2c-bits-per-spike
  expected:
  - quantity: fraction of artificial units above 0.8 bits/spike
    value: 7.96
    tolerance: 0.8
    unit: '%'
  - quantity: mean bits/spike of artificial units
    value: 0.43
    tolerance: 0.043
  criterion: The paper says only that 454 artificial units were made "using Poisson firing and the
    mean firing rates of the recorded LS units"; no script for it was found in the code. Open, and
    could change the outcome. Readings (a) a homogeneous Poisson train at each LS unit's mean rate
    over the whole session, bits/spike then computed exactly as for recorded units; (b) the same at
    the unit's mean rate above 12 cm/s, laid over the fast periods only. Which recorded units the
    454 are built from is also open (454 is near the 452 LS units recorded, not the 378 included);
    the readings are (i) one artificial unit per recorded LS unit, 452 in all, and (ii) the 378
    included LS cells, cycled to 454. The t-test's df (818) matches neither 454 + 378 - 2 = 830 nor
    454 + 452 - 2 = 904; it is noted, not used. Reproduced when, under one reading, both
    values are within tolerance, the KS test gives p < 1e-15 and the t-test p < 1e-10 with recorded
    units higher.
