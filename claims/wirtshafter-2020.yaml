    shuffle-subtracted mean for the middle and last thirds; the Methods' shuffle-subtracted
    measure in all three is the main reading, the code's mix a variant. The absence part is judged on the paper's paired double sided
    t-tests between thirds within each location group, reproduced when all give p > 0.05. The
    second part holds when the choice-side mean exceeds the forced and middle means in each third;
    the legend marks some of these with stars (unpaired two tailed t-tests), reported.
