    bits/spike.
  source: Results, Place fields are less abundant in the LS, paragraph 1; Figure 2A-B
  quote: We found that 75.2% (124/165) of CA1 cells ( Figure 2A ) and 33.6% (127/378) of LS cells (
    Figure 2B ) met or exceeded the 0.8bits/spike threshold
  depends_on:
  - units-recorded
  expected:
  - quantity: fraction of CA1 cells at or above 0.8 bits/spike
    value: 75.2
    tolerance: 7.5
    unit: '%'
  - quantity: fraction of LS cells at or above 0.8 bits/spike
    value: 33.6
    tolerance: 3.4
    unit: '%'
  criterion: Bits/spike as in the Methods on 1 cm maps above 12 cm/s, smoothed with a 10 cm SD
    Gaussian, for the cells of units-recorded. The next paragraph of the Results speaks of "164 HPC
    units with bits/spike greater than or equal to 0.8"; 124 of 165 agrees with 75.2%, so 124 is
    taken as the count and 164 as a misprint, a reading recorded here before the analysis.
- id: fig2c-bits-per-spike
  statement: CA1 cells carry more spatial information per spike than LS cells (mean 1.54 against
    0.73 bits/spike).
  source: Results, Place fields are less abundant in the LS, paragraph 1; Figure 2C
  quote: with the average bits/spike of a CA1 cell significantly higher than the average
    bits/spike of an LS cell (HPC mean 1.54+−1.2 bits/spike, LS mean 0.73+−0.7 bits/spike,
    two-tailed two sample t-test t(541)=9.42, p<0.001)
  statistics:
  - test: two-tailed two sample t-test
    statistic: t(541)=9.42
    p: 0.001
    p_relation: <
    n: 165 CA1 and 378 LS cells
  depends_on:
  - units-recorded
  expected:
  - quantity: mean CA1 bits/spike
    value: 1.54
    tolerance: 0.15
  - quantity: mean LS bits/spike
    value: 0.73
    tolerance: 0.07
  criterion: Tolerances are 10% of the means; the printed +- values (1.2, 0.7) are the SD across
