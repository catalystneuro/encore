  statement: The horizontal-vertical ratio is significantly correlated with the simulated
    pattern index (r = 0.46).
  source: Results, The horizontal-vertical ratio is correlated with simulated pattern
    selectivity, paragraph 3; Figure 7C
  quote: The correlation between the two indices is significant
  statistics:
  - test: t test for correlation coefficients
    statistic: r = 0.46
    p: 0.01
    p_relation: "<"
    n: 52 neurons
  expected:
  - quantity: Pearson correlation between horizontal-vertical ratio and pattern index
    value: 0.46
    tolerance: 0.046
  criterion: Pearson correlation across neurons between the ratio of fig7a-partial-ring and the
    index of fig7b-pattern-index, tested by the t test for a correlation coefficient.
    Reproduced when, under one combination of the readings of those claims, r is within
    tolerance and p < 0.01; partially reproduced when r is positive and p < 0.01 but outside
    tolerance.
  depends_on:
  - fig7a-partial-ring
  - fig7b-pattern-index
- id: fig7c-no-corr-prediction-pattern
  statement: Prediction performance is not significantly correlated with the pattern index.
  source: Results, The horizontal-vertical ratio is correlated with simulated pattern
    selectivity, paragraph 3
  quote: There was no significant correlation between prediction performance and the pattern
    index
  statistics:
  - p: 0.1
    p_relation: ">"
    n: 52 neurons
  criterion: A claim of absence, judged as in fig7a-no-corr-prediction-hv (t test for a Pearson
