# Claims for Nishimoto & Gallant (2011), J Neurosci 31(41):14551-14564, tested on CRCNS mt-2.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-10,
# protocol pilot-14 as stated in docs/protocol.md.
#
# Text read: the version of record (paper/10.1523-jneurosci.6801-10.2011.txt, PyMuPDF extraction
# of the publisher PDF), main text, Materials and Methods and figure legends. The paper has no
# supplement other than Movie 1 (stimulus spectra, not a result). Figure 2B, Figure 3, Figure 6
# and Figure 7 were read from the PDF where the text extraction garbled symbols; the
# inequality signs of every p-value were read there (p < 0.01, p > 0.10 and so on). The paper
# links no code, so no repository was read. The dataset's own documentation
# (paper/mt-2.data-description.txt) was read only to know what the dataset is meant to hold.
#
# Data the paper used (Materials and Methods, Physiology; Visual stimuli; Results, opening
# paragraph). 52 single MT neurons from two adult male macaques (Macaca mulatta) performing a
# fixation task. Each neuron saw 20,000 to 40,000 frames (mean 27,120) of motion-enhanced
# natural movies at 83 Hz as training data (the Results say 22,000 to 42,000 frames), and a
# separate 2000-frame motion-enhanced movie repeated 5 to 20 times as validation data. A subset
# of 15 neurons also saw a 2000-frame natural movie without motion enhancement, repeated 5 to
# 20 times, as a second validation set. Measured variable is the spike train, analysed at the
# 83 Hz frame rate. The CRCNS description says mt-2 holds 45 neurons (not 52), each with the
# movie frames around its receptive field (about two receptive field widths, 128 x 128
# pixels), spike counts averaged and binned at 83 Hz (psths), and the frame indices of the
# training (ranges.crange) and validation (ranges.vrange) stimuli. Whether the 15 natural-movie
# validation sets, single repeats or trial boundaries are present is for the author to find.
#
# The model all the claims rest on (Materials and Methods, The V1 filter bank; Regression by
# boosting; Tests for nonlinearities). The stimulus (a patch two classical receptive field
# widths across) is filtered by a bank of 5956 spatiotemporal Gabor filters (Eq. 1) spanning
# 12 directions, five spatial frequencies log spaced from 0 to 6 cycles per classical
# receptive field (cRF), six velocities and temporal frequencies log spaced from 0 to 30 Hz;
# filters tiled on a grid with 2.2 sigma between neighbours, one cycle of the carrier per two
# sigma of the envelope; simple cell outputs (half-wave rectified, phases 0, 90, 180 and 270
# degrees) limited to 2 cycles per cRF, and complex cell outputs (quadrature energy, Eq. 4).
# Optional stages are luminance and contrast normalization of the movie (Eq. 10 to 12), a
# static nonlinearity of half-wave rectification raised to the power alpha (1.0 linear, 0.5
# compressive, 2.0 expansive; Eq. 13), and divisive normalization by the summed outputs of
# all filters, each prenormalized to unit SD, plus a semisaturation constant sigma (Eq. 14).
# The response is a linear sum of filter outputs over delays up to 10 frames (Eq. 5), fit by
# coordinate gradient boosting (Eq. 6 to 9) with early stopping, five times with a different
# 20% of the training data held out, the five weight sets averaged. Validation data are never
# used in fitting. The validation response is the mean over repeats smoothed with a 12 ms
# temporal Gaussian; prediction accuracy is the correlation between predicted and observed
# validation responses. The first 220 ms of each trial's movie overlapped the previous trial
# and the associated responses were removed before analysis (Visual stimuli, paragraph 3).
#
# Details the paper leaves open, for every claim that fits the model (each is a deviation,
# with the readings named; the notebook runs each that could change an outcome).
# - Temporal width of the Gabor envelopes, the exact six velocities and the filter count per
#   scale are not given beyond the totals above; a bank matching the stated ranges and a
#   total near 5956 is a standard choice.
# - The cRF size, which sets the filter spatial frequencies. Readings are (a) half the stored
#   stimulus patch, since the analysis window is two cRF widths and the dataset stores about
#   two receptive field widths; (b) the full stored patch as the analysis window with no
#   other rescaling. These are the same if the patch is exactly two cRF widths.
# - The delays. "up to 10 frames or 130 ms" disagree at 83 Hz (10 frames are 120 ms). Readings
#   are (a) delays 0 to 10 frames (11 delays, 132 ms); (b) delays 1 to 10 frames.
# - The 12 ms Gaussian may be (a) its SD or (b) its full width at half maximum. At 12 ms
#   frames the two differ little.
# - The boosting step size epsilon and the semisaturation constant sigma are not given.
#   Readings for sigma are (a) chosen on the held-out 20% of the training data, as the early
#   stopping is; (b) a fixed small constant (1% of the mean pooled response). Step size is a
#   standard small value (for example 1% of the SD of the response), which changes the
#   number of iterations more than the result.
# - How the 20% held-out parts are formed. Readings are (a) five contiguous blocks of the
#   training frames; (b) five random partitions of frames.
# - Whether the compressive power applies to complex cell outputs as well as simple cell
#   outputs. Eq. 13 says "the output of the linearized Gabor filters", which reads as all V1
#   filter outputs X; that reading is taken, with the power on simple cells only as a variant.
# - The order of divisive normalization and the static nonlinearity is as in Figure 2A (static
#   nonlinearity first, then divisive normalization).
# - Where the validation responses of the natural-movie set exist, the paper averages the two
#   predictions per neuron (Results, Control to identify any bias, paragraph 2). Where the
#   dataset holds only one validation set, the prediction is that set's correlation, and this
#   is recorded as a deviation.
schema_version: 2
paper: doi:10.1523/jneurosci.6801-10.2011
claims:
- id: fig3b-mean-prediction
  statement: The compressive and divisive V1 filter model predicts the validation responses of
    the 52 MT neurons with an average correlation of r = 0.52.
  source: Results, Linear and nonlinear mechanisms that predict natural visual responses in area
    MT, paragraph 3; Figure 3B
  quote: Figure 3B summarizes prediction performance of the compressive/divisive V1 filter model
    across the entire sample of 52 MT neurons
  expected:
  - quantity: mean correlation between predicted and observed validation responses
    value: 0.52
    tolerance: 0.052
  criterion: The model of the opening comment with the compressive nonlinearity (alpha 0.5) and
    divisive normalization, no luminance and contrast normalization, fit per neuron on the
    training frames and tested on the validation frames (Materials and Methods, Regression by
    boosting). Prediction accuracy per neuron is the Pearson correlation of predicted and
    observed validation responses; the claim is judged on the mean over all neurons in the
    dataset (45, not the paper's 52). Reproduced when the mean is within tolerance under one
    of the readings named in the opening comment; the per-neuron distribution is shown against
    Figure 3B (all neurons between 0.2 and 0.8).
- id: fig3b-explainable-variance
  statement: The compressive and divisive model accounts for 35% of the explainable response
    variance of MT neurons.
  source: Results, Linear and nonlinear mechanisms that predict natural visual responses in area
    MT, paragraph 3; Figure 3 legend
  quote: and the model accounts for 35% of the explainable response variance (David and Gallant,
    2005)
  depends_on:
  - fig3b-mean-prediction
  expected:
  - quantity: proportion of explainable variance explained, population
    value: 35
    tolerance: 3.5
    unit: percent
  criterion: The paper names the measure (explainable variance, after David and Gallant, 2005)
    and gives no formula. Readings are (a) the mean over neurons of r squared divided by the
    squared noise ceiling correlation estimated from the validation repeats as in David and
    Gallant (2005); (b) the mean r squared over neurons divided by the mean squared ceiling.
    Reproduced when either is within tolerance. Needs the single validation repeats; if the
    dataset holds only their average, the claim cannot be tested and is blocked as data
    missing.
- id: fig3a-example-neuron
  statement: For one example neuron the correlation between model predictions and observed
    responses is r = 0.72.
  source: Results, Linear and nonlinear mechanisms that predict natural visual responses in area
    MT, paragraph 3; Figure 3A
  quote: The correlation between model predictions and observed responses for this neuron is
    quite good
  depends_on:
  - fig3b-mean-prediction
  expected:
  - quantity: prediction correlation of the example neuron
    value: 0.72
    tolerance: 0.072
  criterion: The paper does not name the neuron, only that its validation movie was repeated 10
    times. Reproduced when at least one neuron of the dataset has a prediction correlation
    within tolerance; the neurons that do, and those among them with 10 validation repeats if
    that can be seen, are listed.
- id: fig2b-contrast-normalization-no-effect
  statement: Luminance and contrast normalization of the stimulus does not significantly change
    prediction accuracy compared with the simplest model (linear half-wave rectification, no
    normalization stages).
  source: Results, Linear and nonlinear mechanisms that predict natural visual responses in area
    MT, paragraph 2; Figure 2B
  quote: Contrast normalization does not have a significant effect on predictions compared with
    the simplest model
  statistics:
  - test: Wilcoxon signed-rank test with Bonferroni correction
    p: 0.1
    p_relation: ">"
    corrected: Bonferroni
    n: 52 neurons
  criterion: A claim of absence, judged on the paper's test. Per neuron, the prediction accuracy
    of the model with luminance and contrast normalization (Eq. 10 to 12), linear static
    nonlinearity and no divisive normalization, against the simplest model, by a Wilcoxon
    signed-rank test across neurons with Bonferroni correction. The number of comparisons is
    not stated; the Figure 2B legend marks the significance of each of the 11 other models
    against the simplest, so the correction is over 11 comparisons. As a claim of absence it
    is judged on that test alone; a correction over 5 (the comparisons the Results text
    reports) is shown as a variant. Reproduced when the corrected p is not below 0.05 (the
    lowest level marked in Figure 2B); the size of the change is given either way. The
    measure compared ("predictive power") is the correlation of the first claim; the
    readings of the percent change are those of fig2b-compressive-improves.
  depends_on:
  - fig3b-mean-prediction
- id: fig2b-compressive-improves
  statement: A compressive static output nonlinearity consistently increases predictions over
    the simplest model, by about 16% without and about 19% with divisive normalization.
  source: Results, Linear and nonlinear mechanisms that predict natural visual responses in area
    MT, paragraph 2; Figure 2B
  quote: The compressive static output nonlinearity consistently increases predictions
  statistics:
  - test: Wilcoxon signed-rank test with Bonferroni correction
    p: 0.01
    p_relation: "<"
    corrected: Bonferroni
    n: 52 neurons
  expected:
  - quantity: increase of predictive power, compressive, no divisive normalization, no luminance
      normalization, read from Figure 2B
    value: 16
    tolerance: 4
    unit: percent
  - quantity: increase of predictive power, compressive, with divisive normalization, no
      luminance normalization, read from Figure 2B
    value: 19
    tolerance: 4
    unit: percent
  criterion: The values are read from the bars of Figure 2B (no number is printed), so the
    tolerance is 4 percentage points, the reading precision (about 1 point) plus about twice
    the bootstrap SE shown (about 2 points). The paper does not define "increase of
    predictive power". Readings are (a) the percent change of the mean correlation over
    neurons relative to the simplest model; (b) the same with mean squared correlation;
    (c) the mean over neurons of each neuron's percent change in correlation. Significance by
    a Wilcoxon signed-rank test across neurons against the simplest model, Bonferroni
    corrected as in fig2b-contrast-normalization-no-effect. Reproduced when, under one reading,
    both values are within tolerance and both comparisons give corrected p < 0.01; partially
    reproduced when both are significant increases but a value falls outside tolerance.
  depends_on:
  - fig3b-mean-prediction
