- id: natural-movie-control
  statement: Models fit on motion-enhanced movies predict responses to natural movies without
    motion enhancement as well as responses to new motion-enhanced movies (mean r = 0.533
    against 0.537, 15 neurons).
  source: Results, Control to identify any bias arising from the use of motion-enhanced natural
    movies, paragraph 2
  quote: Receptive field models of area MT neurons estimated using motion-enhanced natural movies
    predicted responses to novel simple natural movies just as well as they predicted responses
    to novel motion-enhanced natural movies
  statistics:
  - test: Wilcoxon signed-rank test
    p: 0.1
    p_relation: ">"
    n: 15 neurons
  expected:
  - quantity: mean prediction correlation, natural movies
    value: 0.533
    tolerance: 0.053
  - quantity: mean prediction correlation, motion-enhanced movies
    value: 0.537
    tolerance: 0.054
  criterion: A claim of absence, judged on the paper's test. For the neurons with both
    validation sets, the compressive and divisive model fit on the motion-enhanced training
    data predicts each set; per-neuron correlations compared by a Wilcoxon signed-rank test.
    Reproduced when p is not below 0.05 and both means are within tolerance; partially
    reproduced when the test finds no difference but a mean is outside tolerance. Needs the
    natural-movie validation responses of the 15 neurons; if the dataset lacks them, the
    claim is blocked as data missing.
  depends_on:
  - fig3b-mean-prediction
- id: fig8-recovery-simulated
  statement: The estimation procedure correctly recovers the spectral receptive fields of three
    simulated MT neurons, one narrowband, one non-planar with four directions at one frequency,
    and one with random directions and frequencies that does not avoid low temporal
    frequencies.
  source: Results, Control to ensure that the model estimation procedure can recover spectral
    receptive fields of any shape, paragraph 2; Figure 8
  quote: These results demonstrate that the receptive field estimation procedure used in this
    study can characterize arbitrary spectral receptive fields, regardless of their
    organization within the three-dimensional frequency domain
  criterion: Three simulated neurons built from the compressive and divisive filter outputs
    with excitatory weights only (Figure 8 legend), as (A) filters in a narrow band of spatial
    and temporal frequency, (B) four directions at one spatial and temporal frequency, (C) many
    filters at random direction and frequency. Their responses to the experiment's movies are
    refit by the same procedure and spectral receptive fields compared. The paper judges this
    by eye and gives no noise level, filter counts or measure. Readings for noise are (a)
    Poisson noise as in the null model of fig6a-null-on-plane, (b) none. Reproduced when, for
    each simulated neuron, its recovered spectral receptive field correlates better with its
    own true spectral receptive field than with those of the other two (a measure this file
    fixes, as the paper names none); the correlations are reported.
  depends_on:
  - fig3b-mean-prediction
