- id: fig6a-null-on-plane
  statement: For 150 model MT neurons with random weights, the average excitatory on-plane ratio
    is 0.36.
  source: Results, Excitatory spectral receptive fields lie on a plane, paragraph 2; Figure 6A
    (dashed line); Materials and Methods, Null hypotheses test for on-plane ratio
  quote: The average on-plane ratio for this null model is 0.36
  expected:
  - quantity: mean excitatory on-plane ratio, null model neurons
    value: 0.36
    tolerance: 0.036
  criterion: As the Methods say, 150 model neurons with weights drawn from a normal
    distribution (mean 0, SD 1) on the compressive and divisive filter outputs, used to filter
    the experiment's movies, Poisson noise added, receptive fields refit by the same procedure,
    and the on-plane ratio computed as in fig6a-excitatory-on-plane. Open details, with
    readings. Which movies, (a) each model neuron assigned the training and validation movies
    of one recorded neuron in turn, (b) all model neurons on one neuron's movies. How rates
    are made non-negative and scaled for the Poisson noise, (a) rectified and scaled to the
    mean spike count of the recorded neuron whose movie is used, (b) offset to non-negative
    and scaled to the same mean. Whether random weights span all delays, (a) all 5956 filters
    at every delay, (b) a single delay. Reproduced when the mean is within tolerance under
    one combination of readings; every combination run is shown.
  depends_on:
  - fig6a-excitatory-on-plane
- id: fig6a-excitatory-on-plane
  statement: Excitatory spectral receptive fields of MT neurons tend to lie on a single plane in
    the three-dimensional frequency domain; their average on-plane ratio is 0.59, significantly
    above the null model's 0.36.
  source: Results, Excitatory spectral receptive fields lie on a plane, paragraphs 1 and 2;
    Figure 6A
  quote: Figure 6A summarizes the onplane ratio for the excitatory receptive fields of all 52 area
    MT neurons in our sample. The average ratio is 0.59
  statistics:
  - test: Wilcoxon rank-sum test
    p: 0.01
    p_relation: "<"
    n: 52 neurons against 150 null model neurons
  expected:
  - quantity: mean excitatory on-plane ratio
    value: 0.59
    tolerance: 0.059
  criterion: From the compressive and divisive model fit of each neuron. The optimal velocity
    plane passes through the origin and is set by azimuth (direction) and elevation (speed);
    it maximizes the summed positive V1 filter weights whose temporal frequency lies within
    1 octave or 5 Hz of the plane, whichever is larger (maximum coverage), together with the
    symmetry constraint, the negative of the difference of the weights summed on the two sides
    of the plane's azimuth (Materials and Methods, Optimal velocity plane). The on-plane ratio
    is the positive weights near the plane over the total positive weights (Figure 6 legend).
    Open details, with readings. The balance of the two constraints was set by hand; readings
    are (a) coverage only, with symmetry breaking ties; (b) coverage and symmetry each scaled
    by the total positive weight and summed with equal weight. The symmetry term is read as
    the negative of the absolute difference of the two sides (a signed difference would
    favour one side of every plane); the paper says only "subtracting these quantities and
    taking the negative". What is summed, (a) the fitted
    weights, as the Methods and Figure 6 legend say; (b) the weights times each filter's
    spectral amplitude, as "proportion of the spectral receptive field" in the Results
    suggests. Sign split, (a) per weight at each delay; (b) after summing each filter's
    weights over delays. Reproduced when, under one combination, the mean is within tolerance
    and a Wilcoxon rank-sum test against the null model ratios gives p < 0.01 with the real
    ratios higher.
  depends_on:
  - fig3b-mean-prediction
- id: fig6b-suppressive-off-plane
  statement: Suppressive spectral receptive fields tend to avoid the optimal excitatory plane;
    their average on-plane ratio is 0.18, significantly below the null model.
  source: Results, Suppressive spectral receptive fields lie off the optimal excitatory plane;
    Figure 6B
  quote: The average ratio is 0.18, which is significantly smaller than the value for the null
    model described above
  statistics:
  - test: Wilcoxon rank-sum test
    p: 0.01
    p_relation: "<"
    n: 52 neurons against 150 null model neurons
  expected:
  - quantity: mean suppressive on-plane ratio
    value: 0.18
    tolerance: 0.018
  criterion: The on-plane ratio of fig6a-excitatory-on-plane computed on the negative weights,
    with the plane found from the excitatory weights (Figure 6 legend), under the same
    readings. The null comparison is the null model of fig6a-null-on-plane. The text does
    not say whether the null values here are the excitatory or the suppressive ratios of the
    model neurons, but the dashed line of Figure 6B (the null, by analogy with Figure 6A) lies
    at about 0.27, not at the excitatory null mean of 0.36, so the comparison is with the
    suppressive ratios of the null model neurons (with the plane from their excitatory
    weights). The test against the null excitatory ratios is shown as a variant. Reproduced
    when the mean is within tolerance and the rank-sum test against the null suppressive
    ratios gives p < 0.01 with the real ratios lower.
  depends_on:
  - fig6a-excitatory-on-plane
  - fig6a-null-on-plane
- id: fig7a-partial-ring
  statement: The horizontal-vertical ratio is distributed continuously; few neurons form a full
    ring (ratio near 1) or a single spatiotemporal frequency peak (ratio near 0), and most form
    a partial ring in the optimal plane that avoids low temporal frequencies.
  source: Results, Excitatory spectral receptive fields of most MT neurons form a partial ring
    in the plane, paragraphs 1 and 2; Figure 7A; Figures 4 and 5
  quote: However, the receptive fields of the large majority of MT neurons lie between these
    extremes, forming a partial ring in the optimal velocity plane and avoiding the region near
    zero temporal frequency
  criterion: The optimal plane of fig6a-excitatory-on-plane is divided into four quadrants, two
    centred on the vertical axis (along the optimal direction) and two on the horizontal axis
    (in the zero temporal frequency plane); the excitatory spectral amplitudes are integrated
    in the horizontal and in the vertical quadrants and the ratio horizontal over vertical is
    taken (Results, same section, paragraph 1). Open details, with readings. Quadrant borders
    at 45 degrees from each axis (the only symmetric choice, taken as standard). Amplitudes
    on the plane are those within the near-plane band of fig6a-excitatory-on-plane (a), or
    all excitatory amplitude projected onto the plane (b). "Extremes" are not bounded. The ring end
    has no upper bound, as ratios in Figure 7A run to about 1.7, and the ring neuron of Figure 4A
    sits at about 1.35. Readings are (a) ratios below 0.2 and at or above 0.8, or (b) below
    0.1 and at or above 0.9. Reproduced when, under one combination, more than half of the
    neurons fall between the extremes and fewer than a quarter fall in each extreme (this
    file's reading of "only a small fraction", Figure 7 legend).
  depends_on:
  - fig6a-excitatory-on-plane
- id: fig7a-no-corr-prediction-hv
  statement: Prediction performance is not significantly correlated with the
    horizontal-vertical ratio.
  source: Results, Excitatory spectral receptive fields of most MT neurons form a partial ring
    in the plane, paragraph 2
  quote: Note that there was no significant correlation between prediction performance and the
    horizontal–vertical ratio
  statistics:
  - p: 0.1
    p_relation: ">"
    n: 52 neurons
  criterion: A claim of absence. The paper names no test here; the test it names for the
    correlation of Figure 7C, the t test for a Pearson correlation coefficient, is used,
    between each neuron's prediction correlation (fig3b-mean-prediction) and its
    horizontal-vertical ratio (fig7a-partial-ring). Reproduced when p > 0.10, the bound the
    paper reports; not reproduced when p < 0.05; between the two is reported as partially
    reproduced. The coefficient is given either way.
  depends_on:
  - fig3b-mean-prediction
  - fig7a-partial-ring
- id: fig7b-pattern-index
  statement: Simulated plaid responses give pattern indices that form a continuum, mostly from
    -6 to 2, with highly pattern-selective neurons rare (the Discussion says none were extremely
    pattern selective).
  source: Results, The horizontal-vertical ratio is correlated with simulated pattern
    selectivity, paragraphs 2 and 3; Figure 7B; Discussion, paragraph 4
  quote: The pattern index for most neurons ranges from ... 6 to 2, and highly pattern-selective
    neurons are relatively rare
  criterion: Each neuron's fitted compressive and divisive model is driven with drifting
    gratings and plaids, and the pattern index of Smith et al. (2005) is computed (the
    Fisher-transformed partial correlation with the pattern prediction minus that with the
    component prediction). The paper gives no stimulus parameters. Open details, with readings.
    Grating and plaid spatial and temporal frequency, (a) at each neuron's peak excitatory
    spectral response, (b) one frequency pair for all neurons near the population peak.
    Plaid component separation, (a) 120 degrees as in Smith et al. (2005) and Rust et al.
    (2006), (b) 90 degrees. Directions in 12 steps of 30 degrees, matching the filter bank, as
    a standard choice. Reproduced when, under one combination, more than half of the neurons
    have indices from -6.6 to 2.2 (the range widened by 10%) and fewer than 10% exceed 2.2
    (rare is not quantified; 10% is this file's reading, and the count above 1.28, the
    pattern-cell bound of Smith et al., 2005, is reported as well).
  depends_on:
  - fig3b-mean-prediction
