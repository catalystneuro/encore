    model simple cells have only a small effect on prediction performance.
  source: Materials and Methods, The V1 filter bank, paragraph 3 (data not shown)
  quote: most of the response variance is captured by the model complex cells, and the model
    simple cells have only small effect on prediction performance (data not shown)
  criterion: The paper shows no data and names no test. Within the compressive and divisive
    model, fit (a) the complex cell channels only and (b) the simple cell channels only, with
    the same procedure. Reproduced when the complex-only model reaches at least half of the
    full model's mean squared prediction correlation and drops the mean correlation less than
