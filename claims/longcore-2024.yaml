# Claims for Longcore, Villanueva, Nguyen-Ngo, Ghiani, Harrison & Colwell (2024), J. Exp. Biol.
# 227, jeb247235, on Dryad dataset doi:10.5061/dryad.t1g1jwtb0.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-25,
# protocol pilot-19 as stated in docs/protocol.md.
#
# Text read: the version of record as served by Europe PMC (PMC11418196, open access JATS,
# flattened to paper/10.1242-jeb.247235.txt): main text, Materials and Methods, Results, figure
# legends and Discussion. The paper cites no supplement. No PDF was available. The extracted text
# holds the title of Table 1 ("Mean percent suppression mouse activity under light of different
# illuminance and spectrum") but none of its cells, so the per-condition mean suppressions are
# missing here; the abstract gives four of them, and claims are not written from the abstract.
# The claims that rest on Table 1 therefore carry no expected values; a reader with the table
# should add them.
#
# Code: the paper links no analysis code. The statistics were run in JMP Pro 17 (activity) and
# Prism 9.5.0 (cFos), per the Methods.
#
# Data the paper used.
# Activity experiment: 16 C57BL/6J mice (8 male, 8 female), from 3 to 6 months of age, single
# housed with running wheels, entrained to 12 h light (350 lx, 3000 K) and 12 h dark. Each mouse
# received a 1-h light pulse at ZT14 (ZT12 lights off) once per week, at least 6 days apart, for
# all 12 combinations of illuminance (0.01, 0.5, 5, 50 lx) and correlated color temperature (CCT;
# 1750, 1950, 3000 K), in the order 5, 0.5, 0.01, 50 lx and, within each, 3000, 1950, 1750 K.
# Wheel rotations were recorded by VitalView in 3-min bins. The measured variable is activity
# during ZT14 to ZT15 on the exposure day against ZT14 to ZT15 on the prior day, as a percent
# change ("suppression"; positive is less activity, negative is an increase).
# cFos experiment: a separate cohort of 12 mice (3 to 4 months, 3 per sex per light), 1 h of
# 50 lx light at 1950 K or 3000 K from ZT14, perfused at ZT15; cFos-positive cells in the left
# and right mid-SCN counted in 3 to 5 sections by three masked observers, averaged to one value
# per animal. The Dryad description covers both experiments; whether the cFos counts are
# deposited is for the author to find.
#
# Method shared by the activity claims (Methods, Photic suppression of nocturnal activity,
# paragraphs 2 and 3). Per mouse and treatment, percent change = 100 x (prior-day ZT14-15 wheel
# rotations minus exposure-day ZT14-15 rotations) / prior-day rotations, reported as suppression.
# The Methods say only "The percent change in activity was then calculated"; the sign convention
# follows the Results ("increased activity" for negative suppression). Group values are means over
# mice (Fig. 2A legend, "Black lines connect means"). Open: how a mouse with no prior-day
# activity in ZT14-15 is handled; the paper does not say. Standard choice, such a value is left
# out, and the count is reported.
# GLM (Methods paragraph 3): normal distribution, log link, suppression as the response, CCT
# categorical, illuminance continuous, and CCT x illuminance. Open: (i) whether illuminance enters
# in lux or as log10 lux (the paper says only "continuous"); both readings are run. (ii) Effect
# tests: JMP's Generalized Linear Model reports likelihood-ratio chi-square tests by default;
# Wald tests are the other reading. (iii) A normal response with a log link needs positive fitted
# means; the paper's suppressions include negative values and it does not say how the fit
# handled them. The Results also report model predictions that are negative (male activity
# increased by 9.3% at 0.01 lx and 1750 K, "From the model including sex") with 95% CIs symmetric
# about the estimate (3.8 to 14.7 around 9.3; 88.3 to 108.3 around 98.3), which a log link on
# suppression cannot give and an identity link does. Readings: (a) normal distribution, log link,
# as the Methods state, fitted as JMP does (the link applies to the mean only), any failure to
# converge reported; (b) normal distribution, identity link. Both are run with each reading of
# (i) and (ii).
