  criterion: The spread of mean suppression across the three CCTs (largest minus smallest of the
    per-treatment means over mice) at each illuminance. The paper does not say how the influence
    of CCT at one illuminance is measured; this spread is a standard choice, and the CCT effect
    at each illuminance predicted by the GLM is reported as a variant. Reproduced when the spread at 0.01 lx is
    the smallest of the four illuminances and the spread at 50 lx is larger than at 0.01 lx, and
    the interaction term of the GLM is significant (claim glm-illuminance-cct-interaction);
    the four spreads are reported.
