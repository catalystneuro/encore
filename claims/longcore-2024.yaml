claims:
- id: table1-suppression-0p5-and-above
  statement: Light of 0.5 lx and brighter reduced mouse activity during the 1-h exposure at every
    CCT, except 0.5 lx at 1750 K.
  source: Results, paragraph 1; Table 1
  quote: Light at 0.5 lx and brighter, except for the 0.5 lx/1750 K treatment, reduced activity of
    mice ( Table 1 )
  criterion: Per treatment, the mean over the 16 mice of percent suppression (method in the
    opening comment). Reproduced when the mean is above zero for all eight treatments at 0.5, 5
    and 50 lx other than 0.5 lx/1750 K; partially reproduced when it is above zero for at least
    six of them. The Table 1 values are not in the text read, so the twelve means are reported
    for comparison once the table is supplied.
- id: table1-increase-0p01
  statement: All three 0.01 lx treatments, and the 0.5 lx/1750 K treatment, increased mouse
    activity during the exposure.
  source: Results, paragraph 1; Table 1
  quote: All 0.01 lx treatments, and the 0.5 lx/1750 K treatment, increased activity during the
    treatment
  criterion: Per treatment, the mean over the 16 mice of percent suppression. Reproduced when it
    is below zero for all four treatments named; partially reproduced for three of four.
- id: tukey-illuminance-within-cct
  statement: In Tukey-Kramer comparisons within color temperatures, the effect of illuminance on
    activity was significantly greater only for 50 lx at 1750 K.
  source: Results, paragraph 1; Methods, Photic suppression of nocturnal activity, paragraph 3
  quote: Within color temperatures, the effect of illuminance on mouse activity was only
    significantly greater for 50 lx at 1750 K
  criterion: Tukey-Kramer HSD on per-mouse percent suppression, alpha 0.05 (the paper gives no
    alpha for the activity tests; 0.05 is a standard choice and the alpha of its power analysis)
    (Methods, "testing
    for significant differences for each while holding the other constant (Tukey-Kramer HSD for
    multiple comparisons)"). The sentence can be read two ways. (a) Within each CCT, the four
    illuminances are compared; at 1750 K the 50 lx treatment differs significantly from the
    lower illuminances, and at 1950 K and 3000 K no illuminance pair differs. (b) Within each
    illuminance, the three CCTs are compared; only at 50 lx do CCTs differ, with 1750 K
    differing from the others. Reproduced when the significant pairs match the sentence under
    one reading; every significant pair is reported under both. Treatments are compared as
    independent groups, as Tukey-Kramer implies; the repeated measures of each mouse are not
    modelled in this test.
- id: cct-0p01-not-significant
  statement: At 0.01 lx, CCT had no significant effect on activity, although 1750 K light
    increased activity more than 3000 K light.
  source: Results, paragraph 1
  quote: at 0.01 lx, CCT was not statistically significant, although 1750 K CCT increased
    activity more than 3000 K CCT
  criterion: A claim of absence, judged on the paper's test, Tukey-Kramer HSD over the three
    CCTs at 0.01 lx on per-mouse percent suppression, alpha 0.05 (a standard choice; the paper
    gives no alpha for the activity tests). Reproduced when no CCT pair
    differs significantly and the mean increase in activity at 1750 K is larger than at 3000 K;
    not reproduced when a pair differs. The mean differences are reported either way.
- id: glm-illuminance-cct-interaction
  statement: In a generalized linear model of suppression, illuminance, CCT and their
    interaction each contributed significantly, and the whole model was significant.
  source: Results, paragraph 2; Methods, Photic suppression of nocturnal activity, paragraph 3
  quote: Mouse activity was associated with light conditions in a generalized linear model ( P
    <0.001), with significant contributions of illuminance ( P <0.0001), spectrum ( P <0.0001)
    and the interaction term ( P <0.002)
  statistics:
  - about: whole model
    test: generalized linear model, normal distribution, log link
    p: 0.001
    p_relation: "<"
  - about: illuminance
    test: generalized linear model effect test
    p: 0.0001
    p_relation: "<"
  - about: CCT (spectrum)
    test: generalized linear model effect test
    p: 0.0001
    p_relation: "<"
  - about: CCT x illuminance
    test: generalized linear model effect test
    p: 0.002
    p_relation: "<"
  criterion: The GLM of the opening comment on all mouse-by-treatment suppressions. Reproduced
    when the whole model has p < 0.001 and the illuminance, CCT and interaction terms each have
    p below their reported bounds (0.0001, 0.0001, 0.002) under one reading of the open choices
    (illuminance in lux or log10 lux; likelihood-ratio or Wald tests; log or identity link);
