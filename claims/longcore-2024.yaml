- id: effect-size-illuminance-over-cct
  statement: Over the tested ranges, the effect of illuminance (0.01 to 50 lx) on activity was
    several times greater than that of CCT (1750 to 3000 K).
  source: Results, paragraph 2; Methods, Photic suppression of nocturnal activity, paragraph 3
  quote: The influence of illuminance on mouse activity across the 0.01-50 lx range was several
    times greater than the effect of CCT across the 1750-3000 K range
  depends_on:
  - glm-illuminance-cct-interaction
  criterion: Effect sizes from the GLM with each factor centered at its mean and scaled by half its
    range (Methods; JMP's scaled estimates). The paper does not say how the categorical CCT
    term is put on that scale. Readings are (a) the largest absolute CCT parameter under JMP's
    effect coding, against the absolute scaled illuminance estimate; (b) a refit with CCT as a
    continuous term in kelvin, centered and scaled by half of 1250 K. Illuminance in lux or
    log10 lux as in the opening comment. "Several times" is read as a ratio of at least 2.
    Reproduced when the ratio of the illuminance effect to the CCT effect is at least 2 under one
    reading; every ratio is reported.
- id: cct-effect-grows-with-intensity
  statement: The influence of CCT on activity was smallest at the lowest illuminance and grew as
    illuminance increased, as shown by the significant CCT x illuminance interaction.
  source: Results, paragraph 2; Discussion, paragraph 5
  quote: with the influence of CCT decreasing at the lowest light strength
  depends_on:
