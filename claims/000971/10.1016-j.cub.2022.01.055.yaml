# Claims for Seiler, Cosme, Sherathiya, Schaid, Bianco, Bridgemohan & Lerner (2022) on dandiset 000971.
# Source: the accepted author manuscript in PubMed Central (PMC8930615), full text: Results, figure
# legends and STAR Methods. The supplementary figures (NIHMS1775870-supplement-3.pdf) could not be
# downloaded (the server returned a browser check), so claims on Figures S1 to S7 rest on the main
# text only.
#
# When these criteria were written, the author had seen the data check only: the file list and
# session descriptions of every file, the event series each file holds, the punishment group label
# stored in each fiber photometry subject's notes, the number of shocks in each shock probe file
# (and so the early and late probe values of each mouse), which sessions carry photometry, and, for
# one photometry session, the rewarded nosepoke response in each of the four photometry columns
# (to check which column is the calcium signal). No claim's statistics had been run. The authors'
# MATLAB code (GitHub jillianseiler/Seiler-et-al.-2022-MATLAB-code at commit 56f1529) and the
# conversion code and notes (GitHub catalystneuro/lerner-lab-to-nwb at commit d301f7e) had been read.
#
# Method choices fixed here, from the Methods, then the authors' code, where the Methods are silent:
# - Shock probe value: the number of entries in a probe file's footshock_times. When a mouse has more
#   than one probe file on one day, the last file of the day that holds footshock_times is used; the
#   sum over the day's files is shown as a variant. The early probe is the mouse's first probe day
#   when fewer than 8 RI60 (or RR20) sessions precede it; the late probe is the later probe day,
#   after at least 8 such sessions, whose count of preceding sessions is closest to 13.5 (the Results
#   give 1 to 2 and 13 to 14 days). Mice with one probe day have only an early or only a late probe.
# - Phenotype rule (Methods): DPR when the late probe count exceeds the early one by more than 85%;
#   otherwise PR when the early count exceeds 13; otherwise PS. Fiber photometry mice keep the label
#   stored in the dandiset; optogenetic mice are classified with this rule.
# - Omission completion time: time of the 50th reward, or 60 min when fewer than 50 were earned.
# - RI60 training sessions: sessions described as RI60 (or RR20) training, from the first one up to
#   the day of the late probe. Session length is 60 min, or the time of the 50th reward when 50 were
#   earned. Active nosepokes are those on the side the session description names.
# - Photometry (authors' code): 100-sample moving average applied forward and backward to both
#   channels; least-squares fit of the 405 nm channel to the 465 nm channel; dF/F = (465 - fit) / fit;
#   z-score over the session; first second of the session dropped. Unrewarded nosepokes are active
#   nosepokes that are not rewarded, less those within 2 s of the previous unrewarded nosepoke. Score
#   = maximum of the mean rewarded nosepoke PSTH in 0 to 1.5 s minus the minimum of the mean
#   unrewarded nosepoke PSTH in 0 to 1.5 s (Methods). Early RI60 sessions are photometry sessions held
#   before the mouse's first shock probe (or within its first 3 RI60 days when it has no early probe);
#   late sessions are those after it.
# - Where the paper states a mixed-effects analysis, a linear mixed model with a random intercept per
#   mouse is used, and effects are tested by likelihood ratio. Tukey tests use statsmodels.
schema_version: 1
dandiset: "000971"
paper: doi:10.1016/j.cub.2022.01.055
claims:
- id: fig1d-ri60-vs-rr20-shocks
  statement: Mice trained on RI60 accept more shocks in the shock probes than mice trained on RR20
    (main effect of schedule, F1,43 = 6.37, p < 0.05; schedule by time interaction, F1,43 = 4.54,
    p < 0.05), and RI60 mice accept more shocks on the late probe than on the early one (p < 0.01).
  source: Results, first section; Figure 1D
  criterion: Mice of the fiber photometry experiment with both probes. A two-way mixed ANOVA
    (schedule between mice, probe within) on shock counts. Reproduced when the schedule main effect
    and the interaction both have p < 0.05 with RI60 higher, and a paired t-test of late against early
    in RI60 mice has Bonferroni-corrected (x2) p < 0.01. Partially reproduced when the RI60 increase
    holds but the schedule effect or the interaction does not. Not reproduced otherwise.
- id: fig1e-omission-ri60-longer
  statement: RI60-trained mice take longer to complete the omission probe than RR20-trained mice
    (unpaired t-test, p < 0.05; n = 20 and 7).
  source: Results, first section; Figure 1E
  criterion: Omission completion time per mouse (the 50th reward, or 60 min). Reproduced when the
    RI60 mean exceeds the RR20 mean with an unpaired t-test p < 0.05; partially when the direction
    holds with p >= 0.05; not reproduced when RR20 is longer.
- id: fig1f-omission-shock-no-correlation
  statement: Among RI60 mice, shocks received on the late probe and omission completion time are not
    significantly correlated (r = 0.42, ns).
  source: Results, first section; Figure 1F
  criterion: Absence claim. Pearson correlation over RI60 mice with both measures. Reproduced when
    p >= 0.05, not reproduced when p < 0.05; r is reported either way.
- id: fig2a-phenotype-rule
  statement: RI60 mice are split by their shock probe counts into 9 punishment resistant (PR), 9
    delayed punishment resistant (DPR) and 18 punishment sensitive (PS) mice, by the rule in the
    Methods (DPR when the count rises by more than 85%; otherwise PR when the early count exceeds 13).
  source: Figure 2A; STAR Methods, Behavioral Analysis
  expected:
  - quantity: PR mice
    value: 9
    tolerance: 0
  - quantity: DPR mice
    value: 9
    tolerance: 0
  - quantity: PS mice
    value: 18
    tolerance: 0
  criterion: The counts are those of the labels stored in the dandiset's RI60 fiber photometry mice.
    Reproduced when the counts match and the rule, applied to the dandiset's probe counts, gives the
    stored label for every mouse with both probes. Partially reproduced when the counts match and the
    rule agrees for at least 80% of those mice. Not reproduced otherwise.
- id: fig2b-only-dpr-increase
  statement: There is an interaction of phenotype and probe on shocks received (p < 0.0001), and only
    DPR mice receive significantly more shocks on the late probe than the early one.
  source: Results, second section; Figure 2B
  criterion: RI60 mice with both probes, stored labels. Two-way mixed ANOVA (phenotype between, probe
    within). Reproduced when the interaction has p < 0.05, the DPR paired t-test late against early
    has Bonferroni-corrected (x3) p < 0.05, and neither PR nor PS does. Partially reproduced when the
    interaction holds and DPR increases significantly but another group also changes significantly.
- id: fig2c-nosepoke-rate
  statement: During RI60 training PR and DPR mice nosepoke at higher rates than PS mice (main effect
    of phenotype, p < 0.0001).
  source: Results, second section; Figure 2C
  criterion: Per mouse, the mean over RI60 training sessions of active nosepokes per minute. A
    one-way ANOVA across phenotypes with Tukey's test. Reproduced when the ANOVA has p < 0.05 and both
    PR > PS and DPR > PS have Tukey p < 0.05. Partially reproduced when only one of the two pairs
    does. A mixed model over sessions is shown as a variant.
- id: fig2d-omission-pr-vs-ps
  statement: PR mice take longer than PS mice to complete the omission probe (PR 51.50 +- 17, PS
    27.92 +- 13.65; one-way ANOVA F2,18 = 4.36, p < 0.05; Tukey PR vs PS p < 0.05).
  source: Results, second section; Figure 2D
  expected:
  - quantity: PR mean omission completion time
    value: 51.5
    tolerance: 17
    unit: min
  - quantity: PS mean omission completion time
    value: 27.92
    tolerance: 13.65
    unit: min
  criterion: The text gives the unit as seconds but the Methods' median split is at 29 minutes and a
    session lasts at most 60 minutes, so the values are read as minutes. Tolerances are the stated
    SDs. Reproduced when both means are within tolerance and Tukey PR vs PS has p < 0.05. Partially
    reproduced when PR > PS but one of these fails. Not reproduced when PR <= PS.
- id: fig2k-ps-wait-longer
  statement: After a reward PS mice wait longer before nosepoking again (38 +- 15 s) than PR (21 +- 5
    s) and DPR (22 +- 4 s) mice (one-way ANOVA p < 0.01; Tukey p < 0.01 for each).
  source: Results, second section; Figure 2K
  expected:
  - quantity: PS mean time from rewarded port entry to next nosepoke
    value: 38
    tolerance: 15
    unit: s
  - quantity: PR mean time from rewarded port entry to next nosepoke
    value: 21
    tolerance: 5
    unit: s
  - quantity: DPR mean time from rewarded port entry to next nosepoke
    value: 22
    tolerance: 4
    unit: s
  criterion: Per reward, the rewarded port entry is the first port entry after the reward, and the
    wait is the time from it to the next active nosepoke; per mouse the mean over all RI60 training
    rewards. Tolerances are the stated SDs. Reproduced when all three means are within tolerance and
    Tukey PS > PR and PS > DPR have p < 0.05. Partially reproduced when PS has the longest wait but a
    mean or a test fails. Not reproduced otherwise.
- id: fig2l-extra-nosepokes
  statement: PS mice make fewer extra nosepokes between a rewarded nosepoke and the rewarded port
    entry than PR mice (PS 1.28 +- 0.85, PR 3.23 +- 1.65, DPR 2.1 +- 2.63; Tukey PS vs PR p < 0.05).
  source: Results, second section; Figure 2L
  expected:
  - quantity: PS mean extra nosepokes per reward
    value: 1.28
    tolerance: 0.85
  - quantity: PR mean extra nosepokes per reward
    value: 3.23
    tolerance: 1.65
  - quantity: DPR mean extra nosepokes per reward
    value: 2.1
    tolerance: 2.63
  criterion: Extra nosepokes are active nosepokes after a rewarded nosepoke and before the rewarded
    port entry; per mouse the mean over RI60 training rewards. Tolerances are the stated SDs.
    Reproduced when all three means are within tolerance and Tukey PS < PR has p < 0.05. Partially
    reproduced when PS < PR but a mean or the test fails.
- id: fig2m-inter-reward-interval
  statement: PS mice have longer inter-reward intervals (79.77 +- 26.54 s) than PR (71.2 +- 32.3 s)
    and DPR (69.58 +- 35.18 s) mice (Kolmogorov-Smirnov, p < 0.0001 for each).
  source: Results, second section; Figure 2M
  expected:
  - quantity: PS mean inter-reward interval
    value: 79.77
    tolerance: 26.54
    unit: s
  - quantity: PR mean inter-reward interval
    value: 71.2
    tolerance: 32.3
    unit: s
  - quantity: DPR mean inter-reward interval
    value: 69.58
    tolerance: 35.18
    unit: s
  criterion: Intervals between consecutive rewards within each RI60 training session, pooled per
    phenotype. Tolerances are the stated SDs. Reproduced when the means are within tolerance, PS has
    the longest mean, and two-sample KS tests PS vs PR and PS vs DPR both have p < 0.0001. Partially
    reproduced when PS is longest but a KS test has p >= 0.0001 or a mean is outside tolerance.
- id: fig2n-rewards-per-session
  statement: Averaged over RI60 training, PS mice earn fewer rewards per session (39.91 +- 7.39) than
    DPR mice (46.56 +- 4.49; PR 45.33 +- 4.33); one-way ANOVA p < 0.05, Tukey PS vs DPR p < 0.05.
  source: Results, second section; Figure 2N
  expected:
  - quantity: PS mean rewards per RI60 session
    value: 39.91
    tolerance: 7.39
  - quantity: DPR mean rewards per RI60 session
    value: 46.56
    tolerance: 4.49
  - quantity: PR mean rewards per RI60 session
    value: 45.33
    tolerance: 4.33
  criterion: Per mouse the mean number of rewards over RI60 training sessions. Tolerances are the
    stated SDs. Reproduced when the three means are within tolerance and the ANOVA and Tukey PS vs
    DPR both have p < 0.05. Partially reproduced when PS is lowest but a test or a mean fails.
- id: fig2o-escalation-timing
  statement: PR mice escalate their nosepoking as soon as they enter RI30, while DPR mice escalate
    later, during RI60.
  source: Results, second section; Figure 2O
  criterion: Per mouse, the mean active nosepokes per minute over its RI30 sessions, and the slope
    of active nosepokes per minute against RI60 day (training sessions up to the late probe). (i) PR
    exceed both DPR and PS in RI30 rate (Mann-Whitney, p < 0.05 for each); (ii) the median RI60 slope
    of DPR mice is above that of PR mice. Reproduced when both hold, partially when one holds.
- id: figs1i-ri60-more-rewards
  statement: RI60-trained mice earn more rewards per training session than RR20-trained mice
    (unpaired t-test, p < 0.0001).
  source: Results, first section; Figure S1I (legend not available)
  criterion: Per mouse the mean rewards per training session (RI60 or RR20, up to the late probe).
    Reproduced when RI60 is higher with an unpaired t-test p < 0.05; notes say whether p < 0.0001.
- id: figs2b-males-more-shocks
  statement: Male mice accept more shocks than female mice in the shock probes (main effect of sex,
    F1,35 = 26.19, p < 0.0001).
  source: Results, second section; Figure S2B (legend not available)
  criterion: RI60 fiber photometry mice with both probes. Two-way mixed ANOVA (sex between, probe
    within). Reproduced when the sex main effect has p < 0.05 with males higher; notes say whether
    p < 0.0001.
- id: fig3e-ri30-dms-peaks
  statement: Peaks in DMS dopamine axon activity at rewarded nosepokes emerge during RI30 in PR mice,
    and more slowly across RI60 in DPR mice.
  source: Results, third section; Figure 3E
  criterion: Needs photometry recorded during RI30.
- id: fig3f-dms-score-phenotype
  statement: The DMS rewarded-unrewarded peak score differs by phenotype (F2,33 = 8.16, p < 0.01) and
    changes across training (p < 0.001).
  source: Results, third section; Figure 3F
  criterion: Early and late RI60 sessions only (no RI30 photometry is in the dandiset). Linear mixed
    model score ~ phenotype * stage with a random intercept per mouse. Reproduced when the phenotype
    main effect (likelihood ratio, model without phenotype terms) has p < 0.05 and the PR and DPR
    means exceed the PS mean. Partially reproduced when this holds in one stage only (one-way ANOVA
    per stage). The stage effect is reported in the notes.
- id: fig3g-dms-score-shock-correlation
  statement: The DMS rewarded-unrewarded peak score correlates with the shocks a mouse receives in
    the shock probes (r = 0.53, p < 0.0001).
  source: Results, third section; Figure 3G
  expected:
    quantity: Pearson r between DMS peak score and shocks received
    value: 0.53
    tolerance: 0.053
  criterion: Readings, before the analysis. (a) Pooled pairs of the early RI60 score with the early
    probe count and the late RI60 score with the late probe count; (b) late pairs only; (c) early
    pairs only. Reproduced when under one reading r is within tolerance and p < 0.05. Partially
    reproduced when r > 0 with p < 0.05 but no reading is within tolerance. Not reproduced otherwise.
- id: fig3h-dms-score-omission-no-correlation
  statement: The DMS rewarded-unrewarded peak score does not correlate with omission completion time
    (r = 0.1, ns).
  source: Results, third section; Figure 3H
  criterion: Absence claim. Pearson correlation of each mouse's late RI60 score with its omission
    completion time. Reproduced when p >= 0.05, not reproduced when p < 0.05. Pooled early and late
    scores are a variant.
- id: fig4f-dls-score-no-phenotype
  statement: The DLS rewarded-unrewarded peak score has no significant effect of phenotype.
  source: Results, fourth section; Figure 4F
  criterion: Absence claim. The model of fig3f-dms-score-phenotype on DLS scores. Reproduced when the
    phenotype effect has p >= 0.05, not reproduced when p < 0.05.
- id: fig4g-dls-score-shock-no-correlation
  statement: The DLS rewarded-unrewarded peak score does not correlate with shocks received (r =
    -0.01, ns).
  source: Results, fourth section; Figure 4G
  criterion: Absence claim. Pearson correlation on the pooled pairs of reading (a) of
    fig3g-dms-score-shock-correlation. Reproduced when p >= 0.05.
- id: fig4h-dls-score-omission-no-correlation
  statement: The DLS rewarded-unrewarded peak score does not correlate with omission completion time
    (r = -0.21, ns).
  source: Results, fourth section; Figure 4H
  criterion: Absence claim, as fig3h-dms-score-omission-no-correlation on DLS scores. Reproduced when
    p >= 0.05.
- id: fig5f-dms-chr2-escalation
  statement: Mice receiving DMS dopamine terminal stimulation on rewarded nosepokes (ChR2) escalate
    their nosepoking faster than EYFP and ChR2 Scrambled controls during FR1 and RI30.
  source: Results, fifth section; Figure 5F
  criterion: Per stage (FR1, RI30), an ordinary least squares fit of active nosepokes per minute on
    the session's index within the stage, with a group by index interaction, over the sessions of all
    mice of the three DMS excitatory groups. Reproduced when the ChR2 slope exceeds both control slopes
    with interaction p < 0.05 in both stages. Partially reproduced when this holds in one stage or for
    one control. Not reproduced otherwise.
- id: fig5g-dms-chr2-more-shocks-early
  statement: On the first shock probe ChR2 mice accept more shocks than EYFP mice (interaction of
    time and manipulation, F2,35 = 3.65, p < 0.05; Tukey p < 0.05); the difference fades by the
    second probe.
  source: Results, fifth section; Figure 5G
  criterion: DMS excitatory mice with both probes. Two-way mixed ANOVA (group between, probe within).
    Reproduced when the interaction has p < 0.05 and Tukey ChR2 vs EYFP on the first probe has p <
    0.05 with ChR2 higher. Partially reproduced when only one of the two holds.
- id: fig5h-dms-chr2-mostly-pr
  statement: ChR2 mice are very likely to be classified PR, while EYFP and ChR2 Scrambled mice are
    distributed across phenotypes as expected.
  source: Results, fifth section; Figure 5H
  criterion: Phenotypes by the Methods rule. Reproduced when more than half of ChR2 mice are PR, the
    PR fraction is higher in ChR2 than in EYFP and in Scrambled, and a Fisher exact test of PR against
    not PR, ChR2 against both controls pooled, has p < 0.05. Partially reproduced when the fractions
    are ordered so but the test has p >= 0.05.
- id: figs5f-chr2-pr-by-sex
  statement: Under DMS ChR2 stimulation 100% of male mice and about 71% of female mice are PR.
  source: Results, fifth section; Figure S5F (legend not available)
  expected:
  - quantity: Percent of male ChR2 mice classified PR
    value: 100
    tolerance: 10
    unit: percent
  - quantity: Percent of female ChR2 mice classified PR
    value: 71
    tolerance: 7.1
    unit: percent
  criterion: Phenotypes by the Methods rule. Reproduced when both are within tolerance; partially
    reproduced when one is.
- id: fig5i-dms-stim-no-omission-effect
  statement: DMS dopamine terminal stimulation does not change omission probe performance.
  source: Results, fifth section; Figure 5I
  criterion: Absence claim. One-way ANOVA of omission completion time across the three DMS excitatory
    groups. Reproduced when p >= 0.05.
- id: fig6-nphr-learning-dropout
  statement: DMS dopamine terminal inhibition impairs initial learning; 25% of NpHR and 22% of NpHR
    Scrambled mice in group 1 failed FR1, and 29% of NpHR mice in group 2 failed RI30, and were dropped.
  source: Results, sixth section; Figure 6F
  criterion: The dandiset marks mice that did not learn in its notes. Reproduced when the marked mice
    (or mice without any RI60 session) number 4 NpHR (2 of 8 and 2 of 7), 2 NpHR Scrambled and 0
    EYFP. Partially reproduced when the marked mice are only NpHR or Scrambled but the counts differ.
    Blocked when the dandiset does not say which mice were dropped. Group 1 and group 2 cannot be told
    apart unless the files say which group a mouse is in.
- id: fig6g-nphr-fewer-shocks-late
  statement: DMS dopamine terminal inhibition on rewarded nosepokes delays punishment resistance; NpHR
    mice accept fewer shocks than EYFP mice on the second probe (Tukey p < 0.01).
  source: Results, sixth section; Figure 6G
  criterion: DMS inhibitory mice with both probes. Tukey's test on second probe counts across the three
    groups. Reproduced when NpHR < EYFP with p < 0.05 (notes say whether p < 0.01). Partially
    reproduced when NpHR < EYFP with p >= 0.05. A two-way mixed ANOVA is shown as a variant.
- id: fig6h-nphr-more-ps
  statement: The NpHR group has more PS mice, and the NpHR Scrambled group more PR mice, than the
    EYFP group.
  source: Results, sixth section; Figure 6H
  criterion: Phenotypes by the Methods rule. Reproduced when the PS fraction of NpHR exceeds that of
    EYFP and the PR fraction of Scrambled exceeds that of EYFP. Partially reproduced when one holds.
    A Fisher exact test of each is reported.
- id: fig6i-nphr-no-omission-effect
  statement: DMS dopamine terminal inhibition does not change omission completion time.
  source: Results, sixth section; Figure 6I
  criterion: Absence claim. One-way ANOVA across the three DMS inhibitory groups. Reproduced when
    p >= 0.05.
- id: fig7f-dls-escalation-similar
  statement: Mice receiving DLS dopamine terminal stimulation (ChR2, EYFP, ChR2 Scrambled) escalate
    their nosepoking at the same rates.
  source: Results, seventh section; Figure 7F
  criterion: Absence claim. The fit of fig5f-dms-chr2-escalation on DLS excitatory mice. Reproduced
    when no group by index interaction has p < 0.05 in FR1 or RI30. No test is given in the paper.
- id: fig7g-dls-stim-no-shock-effect
  statement: DLS dopamine terminal stimulation does not change the number of shocks received.
  source: Results, seventh section; Figure 7G
  criterion: Absence claim. Two-way mixed ANOVA (group between, probe within) on DLS excitatory mice
    with both probes. Reproduced when neither the group main effect nor the interaction has p < 0.05.
- id: fig7h-dls-similar-phenotypes
  statement: DLS ChR2, EYFP and ChR2 Scrambled mice have similar distributions of PR, DPR and PS.
  source: Results, seventh section; Figure 7H
  criterion: Absence claim; the paper gives no test. Chi-square test of the 3 x 3 table of group by
    phenotype (Methods rule). Reproduced when p >= 0.05.
- id: fig7i-dls-no-omission-effect
  statement: DLS dopamine terminal stimulation does not change omission completion time.
  source: Results, seventh section; Figure 7I
  criterion: Absence claim. One-way ANOVA across the three DLS groups. Reproduced when p >= 0.05.
- id: figs3ab-dat-protein-not-reduced
  statement: Heterozygous DAT-IRES-cre mice do not have reduced DAT protein in DMS or DLS compared with
    wild-type mice.
  source: Results, third section; Figure S3A-B (legend not available)
  data: elsewhere
  where: Zenodo doi:10.5281/zenodo.11266654 (Densitometry.xlsx)
  criterion: Absence claim. The paper's test is in the unavailable legend; an unpaired t-test of
