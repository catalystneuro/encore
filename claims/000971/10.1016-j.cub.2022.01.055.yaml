  source: Results, A random interval schedule of reinforcement promotes punishment-resistant
    reward-seeking, paragraph 3; Figure 1E
  quote: RI60-trained mice took longer to complete the omission probe than RR20-trained mice
  statistics:
  - test: unpaired t-test
