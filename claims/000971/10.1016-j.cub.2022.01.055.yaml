- id: figs3cd-open-field
  statement: Heterozygous DAT-IRES-cre mice are not hyperactive in a novel open field.
  source: Results, third section; Figure S3C-D
  criterion: Needs the open field tracking.
- id: fig3c-gcamp-in-dopamine-neurons
  statement: GCaMP7b is expressed in TH-positive dopamine neurons of medial SNc (n = 572 cells) and
    of medial and lateral SNc (89.56% of GCaMP neurons TH-positive).
  source: Figures 3C and 4C
  criterion: Needs the histology images or cell counts.
