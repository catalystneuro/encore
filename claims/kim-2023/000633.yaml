# Claims for Kim, Semenov, Kiester, Keppler, Ibey, Bixler, Colunga Biancatelli & Pakhomov (2023),
# Int. J. Mol. Sci. 24, 10921, on dandiset 000633.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record (open access, CC BY) as served by Europe PMC (PMC10341945),
# full text with Results, Discussion, Materials and Methods and figure legends. The paper has no
# supplement. No PDF was available, so the numbers printed only inside the figures (the
# p-values of Figure 3, the field maps of Figure 7) were not read. The paper links no code; its
# Data Availability Statement says the data are available on request from the corresponding
# author. Methods 4.4 refers to Kim et al. 2023 (Bioelectrochemistry 149, 108319) for the staining
# and analysis protocols; that paper was not read, and details it may fix are named as open below.
#
# Data the paper used, as it reports them:
# - Figure 2 (Section 2.1). Bovine pulmonary artery endothelial (BPAE) cell monolayers in 35 mm
#   glass-bottom dishes, a triangular array of three hollow stainless-steel needles (1.5 mm
#   outside diameter). Trains of five single 600 ns pulses (control, one base electrode
#   energized) or five paired 600 + 600 ns pulses (base electrodes energized in alternation), at
#   1 Hz or 833 kHz, 5 to 10 kV/cm. YO-PRO-1 (YP) uptake in 32 ROIs of 200 x 200 um along the
#   bisecting line; each ROI's angle of field-vector change comes from the Sim4Life simulation
#   (Methods 4.3, Figure 7B,C), which is not deposited. Paired-pulse uptake is expressed as % of
#   the single-pulse uptake in the same ROI. Mean and s.e., n = 3.
# - Figure 3 (Section 2.2). BPAE monolayers, a square array of four 1.5 mm hollow needles. Trains
#   of four paired 600 + 600 ns pulses (50 ns interval), 10 kV/cm at the array center, at 1 Hz or
#   770 kHz, co-directional or cross-directional (90 degrees). YP in one 200 x 200 um ROI at the
#   center. Mean and s.e., n = 6, two-tailed Student's t-test.
# - Figure 4 (Section 2.3). BPAE monolayers, triangular array (base electrodes E1 and E2, apex
#   ground). (A) five single 600 ns pulses to E1, 833 kHz, 4 kV; (B, C) five paired 600 + 600 ns
#   pulses to E1 and E2 in alternation, 833 kHz, 4 kV. Whole-sample images stitched from 216
#   tiles (10x, 0.38 NA), DAPI channel (MemBrite Fix 405/430, all cells) and FITC channel (YP);
#   propidium iodide marked cells dead before treatment. Shown as images only, with no
#   quantification. The dandiset (title "The difference in electroporation patterns produced by
#   a train of single pulses and a train of paired pulses", 2 files, 2 subjects, Bos taurus)
#   is meant to hold this experiment.
# - Figure 5 (Section 2.4). CHO-K1 cells loaded with FluoVolt, triangular array of 0.5 mm
#   tungsten rods, 12 pulses of 300 ns to each base electrode in alternation (1.67 MHz), 50 V,
#   about 0.15 kV/cm at the cells. Strobe imaging, 220 photos at 50 ns steps over 11 us,
#   emission at opposite cell poles normalized to whole-cell emission, averaged over 5 cells.
#
# Method details the paper fixes for the image analysis (Methods 4.4): ROIs of 200 x 200 um;
# "spontaneous" YP uptake measured within the hollow electrodes' footprints, where cells were
# shielded from the field. The 1.5 mm outside diameter of the needles fixes the image scale if
# the files do not.
