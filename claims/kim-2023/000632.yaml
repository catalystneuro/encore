# Claims for Kim, Semenov, Kiester, Keppler, Ibey, Bixler, Colunga Biancatelli & Pakhomov (2023),
# Int J Mol Sci 24, 10921, on dandiset 000632.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record as served by Europe PMC (PMC10341945), full text with Results,
# Discussion, Materials and Methods and figure legends. The paper has no supplement (PMC lists
# none) and no PDF was supplied, so values shown only in figures (the bar heights and p-values of
# Figure 3, the curves of Figure 2) could not be read. The paper links no code; its Data
# Availability Statement says the data are available on request. Methods 4.4 says the staining
# and analysis protocols are "the same as described in detail recently" in its reference 17
# (Kim et al. 2023, Bioelectrochemistry 149, 108319, doi:10.1016/j.bioelechem.2022.108319), which
# was not read; details left open below may be fixed there.
#
# Data the paper used. All electroporation experiments are in monolayers of bovine pulmonary
# artery endothelial (BPAE) cells in 35 mm glass-bottom dishes, stained with YO-PRO-1 (YP, 1 uM,
# added 1 to 2 min before pulses and incubated 10 min after), propidium iodide (dead cells,
# before) and MemBrite Fix 405/430 (all cells). The whole dish was imaged as 216 stitched images
# (10x, 0.38 NA) in DAPI (MemBrite) and FITC (YP) channels. Electroporation is measured as YP
# fluorescence in 200 x 200 um ROIs; "spontaneous" uptake was measured inside the hollow
# electrodes' footprints, where cells were shielded from the field.
# - Figure 3 (Results 2.2), the experiment the dandiset's title names: a square array of four
#   1.5 mm hollow needles; trains of 4 paired pulses (600 + 600 ns, 50 ns apart) at 1 Hz or
#   770 kHz, 10 kV/cm at the array center, either along one diagonal (co-directional) or
#   alternating between the two diagonals (cross-directional, 90 degrees). YP measured in one
#   200 x 200 um ROI at the array center. Four groups (co and cross, 1 Hz and 770 kHz), mean and
#   s.e., n = 6, two-tailed Student's t-test.
# - Figure 2 (Results 2.1): a triangular array of three hollow needles; 5 single 600 ns pulses
#   (control, one base electrode) or 5 paired pulses (600 + 600 ns, base electrodes in
#   alternation), at 1 Hz or 833 kHz, 5 to 10 kV/cm; 32 ROIs along the bisecting line, each with
#   an angle of field direction change from 180 (base) to near 0 degrees (apex) taken from the
#   Sim4Life field simulation (Figure 7). Paired-pulse YP as % of the single-pulse train in the
#   same ROI; mean and s.e., n = 3.
# - Figure 4 (Results 2.3): YP images of a triangular array, 5 single pulses on one base
#   electrode against 5 paired pulses on both, 833 kHz, 4 kV.
# - Figure 5 (Results 2.4): FluoVolt strobe imaging of CHO-K1 cells near the apex or between
#   the base electrodes of a tungsten-rod triangular array; 12 pulses of 300 ns to each base
#   electrode in alternation, 300 ns apart, 50 V (about 0.15 kV/cm); 220 photos at 50 ns steps,
#   averaged over 5 cells.
# The dandiset's title says it holds the Figure 3 experiment; whether it holds any of the others
# is the author's to find. All claims use the paper's own recordings (data: dataset).
#
# Details the paper leaves open, used in the criteria below:
# - Background. Readings: (a) the raw mean YP intensity in the ROI; (b) that intensity minus the
#   mean YP intensity in the electrode footprints of the same dish (Methods 4.4 says footprints
#   were measured "to account for" spontaneous uptake but not how).
# - Normalization by the MemBrite channel is not stated for any figure; the readings are (a) none
#   and (b) YP divided by MemBrite intensity in the same ROI. Reading (b) is a variant only.
# - The significance level of the Figure 3 t-tests is not stated in the text; the figure prints
#   the p-values, which this text does not hold. The conventional level, p < 0.05, is used.
# - Whether the Figure 3 t-test is paired is not stated; "Student's t-test" with independent
#   dishes per group reads as unpaired, equal variance. Welch's test is shown as a variant.
# - Figure 2 normalization. The control (single-pulse) trains were given to separate samples
#   (Results 2.1, "values measured in control samples"); the text does not say whether the %
#   of control was formed per experiment and then averaged, or from the group means. Readings:
#   (i) per-experiment ratio, then mean of the n = 3; (ii) ratio of the means. These are readings
#   of the reported numbers, so a Figure 2 value holds when it matches under either.
# - Figure 2 angles. Each ROI's angle comes from the Sim4Life simulation (Methods 4.3, Figure 7B,C),
#   whose values the text does not give, and the text gives no electrode spacing for the
#   triangular array. If the dataset does not hold the ROI angles or the electrode positions,
#   the angle of each ROI is not determined by the paper, and the claims on angles (fig2-*) are
#   blocked for it.
schema_version: 2
dataset:
  archive: dandi
  id: "000632"
paper: doi:10.3390/ijms241310921
claims:
- id: fig3-1hz-co-equals-cross
  statement: At 1 Hz, co-directional and cross-directional (90 degree) paired pulses in the square
    array have the same electroporation efficiency, measured as YP uptake at the array center.
  source: Results, 2.2, paragraph 1; Figure 3
  quote: Consistently with the measurements in Figure 2 , co- and cross-directional pulses at 1 Hz
    had the same electroporation efficiency ( Figure 3 )
  criterion: A claim of absence. Measure, per dish, the mean YP (FITC) intensity in the single
    200 x 200 um ROI at the center of the square array, 10 min after 4 paired pulses at 10 kV/cm
    (Methods 4.2 and 4.4; Figure 3 legend), under background readings (a) and (b) of the opening
    comment. Test, from the Figure 3 legend, a two-tailed Student's t-test (unpaired, equal
    variance) of the co-directional against the cross-directional dishes at 1 Hz, n = 6 each.
    Reproduced when p >= 0.05 under the paper's test, not reproduced when p < 0.05; the ratio
    of the group means and the p-value are reported either way. Background reading (b) is the
    one used for the outcome when the footprints can be located, as the Methods name it as the
    correction for spontaneous uptake; reading (a) and Welch's test are variants.
- id: fig3-770khz-co-enhanced
  statement: Raising the pulse frequency from 1 Hz to 770 kHz enhances electroporation by
    co-directional paired pulses, attributed to temporal summation of the induced membrane
    potential.
  source: Results, 2.2, paragraph 1; Figure 3
  quote: Increasing the pulse frequency to 770 kHz enhanced electroporation by the co-directional
    pulses because of the temporal summation of the induced membrane potential
  criterion: Measure as in fig3-1hz-co-equals-cross. A two-tailed Student's t-test (unpaired,
    equal variance) of co-directional dishes at 770 kHz against co-directional dishes at 1 Hz
    (Figure 3 legend). Reproduced when p < 0.05 and the 770 kHz mean is higher, under each
    background reading that can be computed; blocked as methods_underspecified when the two
    readings disagree. The temporal summation explanation is not tested.
- id: fig3-770khz-cross-same-as-1hz
  statement: Cross-directional paired pulses at 770 kHz are just as effective as at 1 Hz;
    charging two different regions of the membrane does not cause summation.
  source: Results, 2.2, paragraph 1; Figure 3
  quote: Interestingly, charging two different regions of the cell membrane did not cause
    summation, making cross-directional pulses at 770 kHz just as effective as at 1 Hz
  criterion: A claim of absence. Measure as in fig3-1hz-co-equals-cross. A two-tailed Student's
    t-test (unpaired, equal variance) of cross-directional dishes at 770 kHz against
    cross-directional dishes at 1 Hz (Figure 3 legend). Reproduced when p >= 0.05, not
    reproduced when p < 0.05; the ratio of means and the p-value are reported either way.
    Background reading (b) decides as in fig3-1hz-co-equals-cross; reading (a) and Welch's test
    are variants.
- id: fig3-770khz-co-above-cross
  statement: At 770 kHz, co-directional paired pulses electroporate more than cross-directional
    ones.
  source: Results, 2.2, paragraph 1; Figure 3
  inferred: No sentence states this comparison. It is read from the two sentences of Results 2.2
    that co-directional pulses gain from 770 kHz while cross-directional pulses do not, with the
    two equal at 1 Hz. The text does not say which pairs of groups the p-values printed in
    Figure 3 compare, so whether the paper tested this pair is unknown.
  criterion: Measure as in fig3-1hz-co-equals-cross. A two-tailed Student's t-test (unpaired,
    equal variance) of co-directional against cross-directional dishes at 770 kHz. Reproduced
    when p < 0.05 and the co-directional mean is higher, under each background reading that can
    be computed; blocked as methods_underspecified when they disagree.
- id: fig3-no-area-dependence
  statement: Unlike with long pulses, YP uptake after nsEP does not depend on whether the same or
    a larger area of the membrane is electroporated.
  source: Results, 2.2, paragraph 1 (last sentence); Discussion, paragraph 1
  quote: Contrary to data with “long” pulses [ 10 , 11 ], electroporative dye uptake after nsEP did
    not depend on whether we electroporated the same or a larger area of the cell membrane
  depends_on:
  - fig3-1hz-co-equals-cross
  criterion: The Results sentence closes the Figure 3 paragraph, and its evidence is the 1 Hz
    comparison of Figure 3, where co- and cross-directional pulses differ only in the membrane
    area charged. Judged by the outcome of fig3-1hz-co-equals-cross. The Discussion, paragraph 1,
    also cites Figure 2 (pulses at 90 degrees and smaller angles "just as efficient as
    co-directional pulses"); the outcome of fig2-facilitation-plateau is reported alongside and
    does not decide.
- id: fig2-180-cancellation
  statement: At a 180 degree change of field direction, paired-pulse trains give less YP uptake
    than single-pulse trains, 2-fold less at 1 Hz and 20-fold less at 833 kHz.
  source: Results, 2.1, paragraph 3; Figure 2
  quote: Maximum cancellation was expectedly observed at the 180° vector change, reducing YP uptake
    compared to single-pulse trains 2-fold at 1 Hz and as much as 20-fold at 833 kHz
  expected:
  - quantity: single-pulse over paired-pulse YP uptake at 180 degrees, 1 Hz
    value: 2
    tolerance: 0.2
    unit: fold
  - quantity: single-pulse over paired-pulse YP uptake at 180 degrees, 833 kHz
    value: 20
    tolerance: 2
    unit: fold
  criterion: From the Figure 2 legend and Methods 4.4, per ROI along the bisecting line of the
    triangular array, paired-pulse YP intensity as % of the single-pulse train in the same ROI,
    averaged over the n = 3 experiments; the angle of each ROI from the field simulation
    (Figure 7). "At the 180 degree vector change" is read as (1) the ROI nearest the base
    (largest angle) or (2) the ROI of lowest mean uptake ("maximum cancellation"); with the
    normalization readings (i) and (ii) of the opening comment these are readings of the
    reported numbers, and a value holds when it matches under any of them. The background
    readings (a) and (b) are method details and are both run, and the claim is reproduced when, under
    each, both values hold and the 833 kHz cancellation is stronger than at 1 Hz; when (a) and
    (b) give different outcomes it is blocked as methods_underspecified.
- id: fig2-crossover-angle
  statement: Cancellation weakens as the angle is reduced, and paired and single pulses become
    equally effective at about 160 degrees at 1 Hz and about 130 degrees at 833 kHz.
  source: Results, 2.1, paragraph 3; Figure 2
  quote: Cancellation weakened as the angle was reduced, and at about 160° (1 Hz) or 130° (833
    kHz), the effects of paired-pulse trains became the same as those of single-pulse ones
  expected:
  - quantity: angle where paired equals single, 1 Hz
    value: 160
    tolerance: 16
    unit: degrees
  - quantity: angle where paired equals single, 833 kHz
    value: 130
    tolerance: 13
    unit: degrees
  criterion: Measure as in fig2-180-cancellation. The crossover is the angle at which the mean
    paired-pulse uptake crosses 100%, by linear interpolation between neighboring ROIs (the paper
    does not say how it was located; interpolation is a standard choice that cannot move the
    value by more than one ROI spacing). Reproduced when both angles fall within tolerance under
    one normalization reading at least, for each background reading; blocked as
    methods_underspecified when background readings (a) and (b) disagree.
- id: fig2-facilitation-plateau
  statement: Below the crossover, paired pulses enhance electroporation up to about three-fold over
    single pulses at 90 to 100 degrees for both frequencies, followed by a plateau down to 0
    degrees.
  source: Results, 2.1, paragraph 3; Figure 2
  quote: Further reduction of the angle enhanced electroporation, up to about three-fold at 90–100°
    for both nsEP frequencies, followed by a plateau all the way to 0°
  expected:
  - quantity: paired over single YP uptake at the plateau, 1 Hz
    value: 3
    tolerance: 0.3
    unit: fold
  - quantity: paired over single YP uptake at the plateau, 833 kHz
    value: 3
    tolerance: 0.3
    unit: fold
  - quantity: angle at which the plateau is reached (range 90 to 100, widened by 10% of each bound)
    value: 95.5
    tolerance: 14.5
    unit: degrees
  criterion: Measure as in fig2-180-cancellation. "Up to about three-fold at 90-100 degrees,
    followed by a plateau" allows two readings of the level, (1) the mean of the ROIs between 90
    and 100 degrees and (2) the mean of the ROIs from 100 degrees to the apex; the level holds
    when it matches under either, and under either normalization reading. The paper defines
    neither the plateau nor where it is reached and gives no test. As standard choices, named as
    such, the plateau holds when a linear fit of uptake against angle over 0 to 90 degrees has a
    slope whose 95% confidence interval includes zero, and the angle where it is reached is the
    largest angle at which the mean uptake first comes within 10% of the level (the claim's
    tolerance). Reproduced when, under each background reading, the levels are within tolerance
    for both frequencies, that angle lies within 81 to 110 degrees, and the plateau holds;
    blocked as methods_underspecified when background readings (a) and (b) disagree.
- id: fig2-60-fold-co-counter
  statement: At 833 kHz the electroporation efficiency of co-directional and counter-directional
    pulse pairs differs about 60-fold.
  source: Results, 2.3, paragraph 1; Figure 2
  quote: The profound, 60-fold difference in electroporation efficiency of co- and
    counter-directional nsEPs at 833 kHz ( Figure 2 )
  expected:
    quantity: paired-pulse uptake near 0 degrees over that at 180 degrees, 833 kHz
    value: 60
    tolerance: 6
    unit: fold
  depends_on:
  - fig2-180-cancellation
  - fig2-facilitation-plateau
  criterion: Measure as in fig2-180-cancellation, at 833 kHz. The paper does not say which values
    form the ratio; the readings are (a) the ROI nearest the apex over the ROI nearest the base,
    and (b) the plateau level of fig2-facilitation-plateau over the value of
    fig2-180-cancellation (3-fold over 1/20 gives the paper's 60, so (b) is the paper's
    arithmetic). Reproduced when one of these readings, under one normalization reading, is
    within tolerance, for each background reading; blocked as methods_underspecified when
    background readings (a) and (b) disagree.
- id: fig4-unipolar-pattern
  statement: With single-pulse trains on one base electrode, YP uptake follows the electric field
    map; with paired pulses on both base electrodes at 833 kHz, uptake is strong near the
    (grounded, never energized) apex electrode and weak or absent near the base electrodes
    despite the strong field there, forming a comet-shaped region pointing from the apex toward
    the base.
  source: Results, 2.3, paragraph 1; Figure 4A to 4C; Discussion, paragraph 3
  quote: In control cell monolayers exposed to a train of five single pulses applied to one of the
    base electrodes (833 kHz, 4 kV), the distribution of YP fluorescence ( Figure 4 A) simply
    followed the electric field strength map ... produced a strong effect near the apex electrode
    (ground) but weak or no effect near the base electrodes, despite the strong electric field
    there
  criterion: The paper reports no test. From Results 2.3, measure the mean YP intensity in 200 x
    200 um ROIs (the ROI size of Methods 4.4) adjacent to the apex electrode and to each base
    electrode, with background reading (b) where footprints can be found. Reproduced when, in
    the paired-pulse sample, uptake next to the apex exceeds uptake next to each base electrode,
    and in the single-pulse sample uptake next to the energized base electrode exceeds uptake
    next to the apex. "Near" is not defined in the paper; as standard choices, the readings are
    ROIs touching the edge of the electrode footprint (1.5 mm outer diameter, Methods 4.2), and
    ROIs one ROI width (200 um) farther out; the outcome is the one both give. The match to the
    field map is reported as the Spearman correlation of ROI uptake with field strength, with no
    threshold, as the paper gives none; the simulated field map (Figure 7B) is not given as
    numbers, so this is reported only where the field can be computed from the electrode
    positions.
- id: fig5-base-sawtooth
  statement: Cells between the base electrodes show sawtooth-like membrane potential changes in
    synchrony with the alternating pulses, about a 10% FluoVolt emission increase at the
    cathode-facing pole and a 10% decrease at the anode-facing pole.
  source: Results, 2.4, paragraph 2; Figure 5
  quote: Cells placed between the base electrodes displayed sawtooth-like changes in membrane
    potential in synchrony with the applied pulses ( Figure 5 ). Depolarization at the
    cathode-facing pole of the cell manifested as a ~10% emission increase, and hyperpolarization
    at the anode-facing pole caused a ~10% emission decrease
  expected:
  - quantity: peak FluoVolt emission increase at the cathode-facing pole, base location
    value: 10
    tolerance: 1
    unit: percent
  - quantity: peak FluoVolt emission decrease at the anode-facing pole, base location
    value: 10
    tolerance: 1
    unit: percent
  criterion: From Methods 4.5 and the Figure 5 legend, emission changes at the two poles in the
    direction of the maximum field gradient, normalized to whole-cell emission, averaged over 5
    cells and over the time-increment and decrement series. Reproduced when the peak changes are
    within tolerance and the pole signals reverse sign with each change of pulse direction.
- id: fig5-apex-larger-polarization
  statement: Cells near the apex reach a much larger polarization, about 25% FluoVolt emission
    change, which follows the envelope of the pulse train and not the individual pulses, more
    than twice that near the base electrodes.
  source: Results, 2.4, paragraph 2; Figure 5
  quote: In stark contrast, the cells near the apex reached a much higher polarization (~25% change
    in FluoVolt emission), which followed the envelope of the pulse train but not the individual
    pulses of it
  expected:
    quantity: peak FluoVolt emission change at the apex location
    value: 25
    tolerance: 2.5
    unit: percent
  depends_on:
  - fig5-base-sawtooth
  criterion: Measure as in fig5-base-sawtooth, for the apex location. Reproduced when the peak
    change is within tolerance, more than twice the base-location change, and holds through the
    train without reversing sign at each pulse.
