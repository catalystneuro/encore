paper: doi:10.3390/ijms241310921
claims:
- id: fig2-180-cancellation
  statement: At a 180 degree change of field direction (near the base electrodes), paired-pulse
    trains give less YP uptake than single-pulse trains, 2-fold less at 1 Hz and 20-fold less at
    833 kHz.
  source: Results, 2.1, paragraph 3; Figure 2
  quote: Maximum cancellation was expectedly observed at the 180° vector change, reducing YP uptake
    compared to single-pulse trains 2-fold at 1 Hz and as much as 20-fold at 833 kHz
  expected:
  - quantity: single-pulse over paired-pulse YP uptake at 180 degrees, 1 Hz
    value: 2
    tolerance: 0.2
    unit: fold
  - quantity: single-pulse over paired-pulse YP uptake at 180 degrees, 833 kHz
    value: 20
    tolerance: 2
    unit: fold
  criterion: From the Figure 2 legend and Results 2.1, per ROI along the bisecting line, the
    paired-pulse YP value as % of the single-pulse value in the same ROI, at each frequency,
    under normalization readings (i) and (ii), with each ROI's angle under the angle readings of
    the opening comment. The fold value is 100 divided by that %. "At the 180 degree vector
    change" is read as (1) the ROI of largest angle (nearest the base) or (2) the ROI of lowest
    mean value ("maximum cancellation"); these are readings of the reported numbers and a value
    holds when it matches under any of them with either normalization. Reproduced when both
    values hold, under background reading (b) (opening comment); reading (a) is a variant only.
- id: fig2-crossover-angle
  statement: Cancellation weakens as the angle is reduced, and paired and single pulses become
    equally effective at about 160 degrees at 1 Hz and about 130 degrees at 833 kHz.
  source: Results, 2.1, paragraph 3; Figure 2
  quote: Cancellation weakened as the angle was reduced, and at about 160° (1 Hz) or 130° (833
    kHz), the effects of paired-pulse trains became the same as those of single-pulse ones
  expected:
  - quantity: angle where paired equals single, 1 Hz
    value: 160
    tolerance: 16
    unit: degrees
  - quantity: angle where paired equals single, 833 kHz
    value: 130
    tolerance: 13
    unit: degrees
  depends_on:
  - fig2-180-cancellation
  criterion: Measure as in fig2-180-cancellation. The crossover is the largest angle at which the
    mean paired-pulse value reaches 100%, found by linear interpolation between neighboring ROIs.
    The paper does not say how it was located; interpolation is a standard choice that cannot
    move the angle by more than one ROI spacing. The weakening of cancellation is shown by the
    value rising from below 100% at 180 degrees to 100% at the crossover and is not tested
    apart. Reproduced when both angles are within tolerance under one normalization reading at
    least, under background reading (b); reading (a) is a variant only.
- id: fig2-facilitation-plateau
  statement: Below the crossover, paired pulses enhance electroporation up to about three-fold over
    single pulses at 90 to 100 degrees for both frequencies, followed by a plateau down to 0
    degrees, so pulses at 90 degrees and at smaller angles are as efficient as co-directional
    pulses.
  source: Results, 2.1, paragraphs 3 and 4; Figure 2; Discussion, paragraph 1
  quote: Further reduction of the angle enhanced electroporation, up to about three-fold at 90–100°
    for both nsEP frequencies, followed by a plateau all the way to 0°
  expected:
  - quantity: paired over single YP uptake at the plateau, 1 Hz
    value: 3
    tolerance: 0.3
    unit: fold
  - quantity: paired over single YP uptake at the plateau, 833 kHz
    value: 3
    tolerance: 0.3
    unit: fold
  - quantity: angle at which the plateau is reached (range 90 to 100, widened by 10% of each bound)
    value: 95.5
    tolerance: 14.5
    unit: degrees
  depends_on:
  - fig2-crossover-angle
  criterion: Measure as in fig2-180-cancellation. The level "about three-fold at 90-100 degrees,
    followed by a plateau" has two readings of the reported number, (1) the mean of the ROI
    values between 90 and 100 degrees and (2) the mean of the ROI values from 100 degrees to the
    smallest angle; it holds when it matches under either, with either normalization. The paper
    defines neither the plateau nor where it is reached and gives no test. Readings of the
    plateau, both run (a choice that could change the outcome) over the ROI means from 0 to 90
    degrees, (P1) a linear fit of value against angle whose slope has a 95% confidence interval
    that includes zero, and (P2) the mean of the ROIs below 10 degrees within 10% (the claim's
    tolerance) of the mean of the ROIs between 90 and 100 degrees. The angle where the plateau is
    reached is the largest angle at which the mean value first comes within 10% of the level, a
    standard choice tied to the tolerance. Reproduced when, under background reading (b), the
    levels hold for both frequencies, that angle lies within 81 to 110 degrees, and the plateau
    holds at both frequencies; blocked as methods_underspecified when the plateau readings give
    different outcomes. Background reading (a) is a variant only.
- id: fig2-frequency-dependence
  statement: Pairing pulses enhances electroporation at small angles and inhibits it at large
    angles in a frequency-dependent manner, with stronger cancellation at 833 kHz than at 1 Hz.
  source: Figure 2 legend; Results, 2.1, paragraph 3
  quote: Note that applying pulses in pairs enhanced electroporation at small angles but inhibited
    them at large angles in a frequency-dependent manner
  depends_on:
  - fig2-180-cancellation
  - fig2-crossover-angle
  criterion: The paper reports no test, and Results 2.1 reads the frequency dependence from the
    180 degree values ("Stronger cancellation at sub-MHz frequencies") and the crossover angles.
    Measure as in fig2-180-cancellation and fig2-crossover-angle. Reproduced when, under
    background reading (b), the mean paired-pulse value at the 180 degree reading is lower at 833 kHz
    than at 1 Hz and the 833 kHz crossover angle is smaller than the 1 Hz one, with values above
    100% at the smallest angles and below 100% at the largest at both frequencies, under one
    normalization reading at least. Background reading (a) is a variant only.
- id: fig2-60-fold-co-counter
  statement: At 833 kHz, co-directional and counter-directional pulse pairs differ about 60-fold in
    electroporation efficiency.
  source: Results, 2.3, paragraph 1; Figure 2
  quote: The profound, 60-fold difference in electroporation efficiency of co- and
    counter-directional nsEPs at 833 kHz ( Figure 2 )
  expected:
    quantity: paired-pulse uptake at the co-directional end over the counter-directional end, 833 kHz
    value: 60
    tolerance: 6
    unit: fold
  depends_on:
  - fig2-180-cancellation
  - fig2-facilitation-plateau
  criterion: Measure as in fig2-180-cancellation, at 833 kHz. The paper does not say which values
    form the ratio. Readings of the reported number, (a) the ROI of smallest angle over the ROI
    of largest angle, and (b) the plateau level of fig2-facilitation-plateau over the 180 degree
    value of fig2-180-cancellation (3-fold over 1/20 gives the paper's 60, so (b) is the paper's
    arithmetic). Reproduced when one of these, under one normalization reading, is within
    tolerance, under background reading (b); reading (a) is a variant only.
- id: fig3-1hz-co-equals-cross
  statement: In the square array at 1 Hz, co-directional and cross-directional (90 degree) paired
    pulses have the same electroporation efficiency at the array center.
  source: Results, 2.2, paragraph 1; Figure 3
  quote: Consistently with the measurements in Figure 2 , co- and cross-directional pulses at 1 Hz
    had the same electroporation efficiency ( Figure 3 )
  criterion: A claim of absence. Per dish, the mean YP intensity in the single 200 x 200 um ROI at
    the array center (Methods 4.4), after 4 paired pulses at 10 kV/cm (Figure 3 legend), under
    background readings (a) and (b). The paper's test, from the Figure 3 legend, a two-tailed
    Student's t-test (unpaired, equal variance) of co- against cross-directional dishes at 1 Hz,
    n = 6 each, at p < 0.05. Reproduced when p >= 0.05, not reproduced when p < 0.05; the ratio of
    means and p are reported either way. The outcome is taken under background reading (b), the
    correction Methods 4.4 names; reading (a) and Welch's test are variants.
- id: fig3-770khz-co-enhanced
  statement: Raising the pulse frequency from 1 Hz to 770 kHz enhances electroporation by
    co-directional paired pulses, attributed to temporal summation of the induced membrane
    potential.
  source: Results, 2.2, paragraph 1; Figure 3
  quote: Increasing the pulse frequency to 770 kHz enhanced electroporation by the co-directional
    pulses because of the temporal summation of the induced membrane potential
  criterion: Measure as in fig3-1hz-co-equals-cross. A two-tailed Student's t-test (unpaired, equal
    variance; Figure 3 legend) of co-directional dishes at 770 kHz against 1 Hz. Reproduced when
    p < 0.05 with the 770 kHz mean higher, under background reading (b); reading (a) and Welch's
    test are variants. The explanation by temporal summation is
    not tested.
- id: fig3-770khz-cross-same-as-1hz
  statement: Cross-directional paired pulses at 770 kHz are just as effective as at 1 Hz; charging
    two different membrane regions does not cause summation.
  source: Results, 2.2, paragraph 1; Figure 3
  quote: Interestingly, charging two different regions of the cell membrane did not cause
    summation, making cross-directional pulses at 770 kHz just as effective as at 1 Hz
  criterion: A claim of absence. Measure as in fig3-1hz-co-equals-cross. A two-tailed Student's
    t-test (unpaired, equal variance; Figure 3 legend) of cross-directional dishes at 770 kHz
    against 1 Hz, at p < 0.05. Reproduced when p >= 0.05, not reproduced when p < 0.05; the ratio
    of means and p are reported either way. Background reading (b) decides; reading (a) and
    Welch's test are variants.
- id: fig3-no-area-dependence
  statement: Unlike with long pulses, YP uptake after nsEP does not depend on whether the same or a
    larger area of the cell membrane is electroporated.
  source: Results, 2.2, paragraph 1 (last sentence)
  quote: Contrary to data with “long” pulses [ 10 , 11 ], electroporative dye uptake after nsEP did
    not depend on whether we electroporated the same or a larger area of the cell membrane
  depends_on:
  - fig3-1hz-co-equals-cross
  criterion: The sentence closes the Figure 3 paragraph, whose evidence is the 1 Hz comparison,
    where co- and cross-directional pulses differ only in the membrane area charged. Judged by
    the outcome of fig3-1hz-co-equals-cross. The Discussion, paragraph 1, draws the same
    conclusion from Figure 2; the outcome of fig2-facilitation-plateau is reported alongside and
    does not decide.
- id: fig4-unipolar-pattern
  statement: With single-pulse trains on one base electrode, YP uptake follows the electric field
    map; with paired pulses on both base electrodes at 833 kHz, uptake is strong near the grounded
    apex electrode and weak or absent near the base electrodes despite the strong field there.
  source: Results, 2.3, paragraph 1; Figure 4A to 4C
  quote: In control cell monolayers exposed to a train of five single pulses applied to one of the
    base electrodes (833 kHz, 4 kV), the distribution of YP fluorescence ( Figure 4 A) simply
    followed the electric field strength map ... produced a strong effect near the apex electrode
    (ground) but weak or no effect near the base electrodes, despite the strong electric field
    there
  criterion: The paper reports no test. From Results 2.3 and Methods 4.4, the mean YP intensity in
    200 x 200 um ROIs adjacent to the apex electrode and to each base electrode, under background
    reading (b); reading (a) is a variant only. Reproduced when, in the paired-pulse sample, uptake next to the apex
    exceeds uptake next to each base electrode, and in the single-pulse sample uptake next to the
    energized base electrode exceeds uptake next to the apex. "Near" is not defined; the readings
    are ROIs touching the edge of the electrode footprint (1.5 mm outer diameter, Methods 4.2)
    and ROIs 200 um farther out, both run, and the outcome is the one all readings give, else
    blocked as methods_underspecified. The match to the field map is reported as the Spearman
    correlation of ROI uptake with field strength (field from the angle-reading models of the
    opening comment), with no threshold, as the paper gives none.
- id: fig5-base-sawtooth
  statement: Cells between the base electrodes show sawtooth-like membrane potential changes in
    synchrony with the alternating pulses, about a 10% FluoVolt emission increase at the
    cathode-facing pole and a 10% decrease at the anode-facing pole.
  source: Results, 2.4, paragraph 2; Figure 5
  quote: Cells placed between the base electrodes displayed sawtooth-like changes in membrane
    potential in synchrony with the applied pulses ( Figure 5 ). Depolarization at the
    cathode-facing pole of the cell manifested as a ~10% emission increase, and hyperpolarization
    at the anode-facing pole caused a ~10% emission decrease
  expected:
  - quantity: peak FluoVolt emission increase at the cathode-facing pole, base location
    value: 10
    tolerance: 1
    unit: percent
  - quantity: peak FluoVolt emission decrease at the anode-facing pole, base location
    value: 10
    tolerance: 1
    unit: percent
  criterion: From Methods 4.5 and the Figure 5 legend, emission changes at the two poles in the
