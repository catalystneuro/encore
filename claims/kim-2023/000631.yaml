# Claims for Kim, Semenov, Kiester, Keppler, Ibey, Bixler, Colunga Biancatelli & Pakhomov (2023),
# "Control of the Electroporation Efficiency of Nanosecond Pulses by Swinging the Electric Field
# Vector Direction", Int J Mol Sci 24, 10921, on dandiset 000631.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record as served by Europe PMC (PMC10341945), full text with
# Introduction, Results, Discussion, Materials and Methods and figure legends. The paper has no
# supplement (PMC lists none). No PDF was supplied, so values shown only in figures could not be
# read: the curves of Figure 2 and the bar heights and printed p-values of Figure 3. The paper
# links no code; its Data Availability Statement says the data are available on request. No code
# was read. Methods 4.4 and 4.5 say the staining, analysis and strobe protocols are those of its
# reference 17 (Kim et al. 2023, Bioelectrochemistry 149, 108319,
# doi:10.1016/j.bioelechem.2022.108319), which was not read; details left open below may be
# fixed there.
#
# The dandiset's title and description on DANDI name the Figure 2 experiment (paired-pulse
# against single-pulse trains, 5 pulses, 600 + 600 ns or 600 ns, 1 Hz or 833 kHz, BPAE
# monolayers, YP emission as % of the single-pulse train in the same ROI, against the angle of
# field direction change) and say it holds the images. Claims on Figures 3 to 5 are kept to
# cover the paper's findings; whether this dandiset holds those data is the author's to find.
#
# Data the paper used. Electroporation experiments are in monolayers of bovine pulmonary artery
# endothelial (BPAE) cells in 35 mm glass-bottom dishes, stained with propidium iodide (dead
# cells, 10 min before), MemBrite Fix 405/430 (all cells) and YO-PRO-1 (YP, 1 uM, added 1 to 2
# min before the pulses and incubated 10 min after). The whole dish was imaged as 216 stitched
# images (10x, 0.38 NA) in the DAPI (MemBrite) and FITC (YP) channels; fluorescence measured in
# MetaMorph. "Spontaneous" YP uptake was measured inside the hollow electrodes' footprints, where
# cells were shielded from the field (Methods 4.4).
# - Figure 2 (Results 2.1, the experiment of this dandiset): a triangular array of three blunt
#   hollow stainless-steel needles (1.5 mm outer, 0.5 mm inner diameter) touching the dish
#   bottom. Paired pulses: the two base electrodes energized in alternation (the idle one
#   grounded, the apex always ground), 5 pairs of 600 + 600 ns. Control: 5 single 600 ns pulses
#   on one base electrode. Each given at 1 Hz or at "the maximum frequency of 833 kHz (no delay
#   between the pairs)" (Results 2.1); Methods 4.2 says the second pulse of a pair came with no
#   delay or a 50 ns delay, without saying which for Figure 2. 5 to 10 kV/cm along the bisecting
#   line. YP measured in 32 ROIs of 200 x 200 um along the bisecting line (dashed line of
#   Figure 7B) from the base to the apex; each ROI has an angle of field direction change, from
#   180 degrees at the base to near 0 at the apex (Figure 1). The paper does not say how each
#   ROI's angle was obtained; Figure 7B,C give only the simulated field strength map and profile
#   (Methods 4.3). Paired-pulse YP is given as % of the control
#   (single-pulse) value in the same ROI, measured in separate control samples, per frequency.
#   Mean and s.e., n = 3. Four conditions: paired and single, at 1 Hz and 833 kHz.
# - Figure 3 (Results 2.2): a square array of four 1.5 mm hollow needles; trains of 4 paired
#   pulses (600 + 600 ns, 50 ns apart) at 1 Hz or 770 kHz, 10 kV/cm at the center, along one
#   diagonal (co-directional) or alternating between the diagonals (cross-directional, 90
#   degrees); YP in one 200 x 200 um ROI at the center. Mean and s.e., n = 6, two-tailed
#   Student's t-test.
# - Figure 4 (Results 2.3): YP images of the triangular array, 5 single 600 ns pulses on one
#   base electrode against 5 paired pulses on both, 833 kHz, 4 kV.
# - Figure 5 (Results 2.4): FluoVolt strobe imaging of CHO-K1 cells near the apex or between the
#   base electrodes of a triangular array of 0.5 mm tungsten rods, 50 um above the bottom; 12
#   pulses of 300 ns to each base electrode in alternation, 300 ns apart (1.67 MHz), 50 V (about
#   0.15 kV/cm); 220 photos at 50 ns steps over 11 us, averaged over 5 cells, emission at the
#   poles normalized to whole-cell emission.
# All claims use the paper's own recordings (data: dataset). The paper uses no outside data; the
# ROI angles come from its own simulation, whose values it does not give (see below).
#
# Details the paper leaves open, used in the criteria below:
# - Background. Methods 4.4 says the footprints were measured "to account for" spontaneous
#   uptake, so the paper's values are corrected for it; it does not say how. The criteria use
#   (b), the mean YP intensity in the ROI minus the mean YP intensity in the electrode
#   footprints of the same dish, the standard correction for a measured background. (a), the
#   ROI intensity with no correction, is not a reading the paper allows; it is reported as a
#   variant only and decides no outcome.
# - MemBrite normalization is not stated for any figure. YP divided by MemBrite in the same ROI
#   is shown as a variant only; the paper reports YP emission.
# - Figure 2 normalization. The controls were separate samples ("values measured in control
#   samples", Results 2.1). Readings of the reported numbers: (i) per-experiment ratio of paired
#   to control in each ROI, then the mean over the n = 3; (ii) ratio of the mean paired to the
#   mean control value in each ROI. A Figure 2 number holds when it matches under either.
# - Figure 2 control electrode. The text does not say which base electrode was energized in the
#   controls; along the bisecting line the two are mirror images (Figure 1), so this cannot
#   change the outcome. If both occur, their values are averaged, a standard choice.
# - Figure 2 angles (could change outcomes). The text does not say how the angle of each ROI was
#   obtained (a field simulation, Methods 4.3, is the likely source) nor give the values, and it gives no
#   electrode spacing or ROI spacing. Readings: (A) the angles, or ROI positions with angles,
#   held in the dataset; (B) when the dataset lacks them, the angle at each ROI center computed
#   from electrode positions measured in the dataset's images, as the angle between the field
#   vectors of the two configurations (one base electrode at 1 V, the other two at 0), from a
#   2D conduction model of the Methods 4.3 geometry (equipotential cylinders 1.5 mm in diameter
#   through the full solution depth, uniform conductivity, insulating dish wall of 35 mm
#   diameter), which the Methods' parallel cylinders spanning the solution reduce to; (C) as (B)
#   with each electrode taken as a line source at its center. (B) and (C) are both run; if they
#   give different outcomes, the claim is blocked as methods_underspecified. If neither
#   electrode positions nor angles can be had from the dataset, the fig2 claims are blocked.
# - ROI layout. Methods 4.4 gives 32 ROIs of 200 x 200 um along the dashed line, but not their
#   spacing or end points. The ROIs or their positions held in the dataset are used; otherwise
#   32 contiguous ROIs centred on the bisecting line from the base midpoint toward the apex,
#   outside the electrode footprints, are a standard choice and are recorded as a deviation.
# - Figure 3 test. The significance level is not printed in the text and the p-values are only
#   in the figure; p < 0.05 is used as the conventional level. Whether the t-test is paired is
#   not stated; with separate dishes per group it reads as unpaired, equal variance. Welch's test
#   is a variant.
