  expected:
    quantity: peak FluoVolt emission change at the apex location
    value: 25
    tolerance: 2.5
    unit: percent
  depends_on:
  - fig5-base-sawtooth
  criterion: Measure as in fig5-base-sawtooth, at the apex location. Reproduced when the peak
