# Claims for Porniece, Baker, Ausfahl, Zhang & Andermann (2025), Sci Rep 15, 35837, on dandiset
# 001474. Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions),
# 2026-10-21, protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record (open access) as served by Europe PMC (PMC12521569): main
# text, figure legends and Methods, with Supplementary Material 1 (41598_2025_19800_MOESM1_ESM.pdf,
# the legends of Supplementary Figures 1 to 3), all in paper/10.1038-s41598-025-19800-2.txt. The
# supplementary PDF could not be rendered here, so significance marks shown only inside figures
# were not read. The main figures were not available as images. Supplementary Materials 2 to 8
# (presumably the source data) were not in the text.
#
# Code read: https://github.com/xzhang03/Photometry_analysis, commit b88d3943 (the repository the
# Methods cite for the analysis). It is the lab's general MATLAB photometry toolbox. It holds
# preprocessing: per-pulse median extraction (tcpPreprocess.m), a zero-phase FIR low-pass filter
# (passband 8 Hz, stopband 10 Hz at 50 Hz sampling), trial cutting (tcpTrigger.m), and tcpZ.m, which
# computes one standard deviation per mouse from all of that mouse's recordings concatenated, each
# recording's filtered fluorescence mean-subtracted from sample 50 on. It holds none of this paper's
# Python analysis (response windows, early and late phases, LME models, t-tests, correlations).
# The Nanosec task software (github.com/xzhang03/NidaqGUI) was not read for analysis choices.
#
# Data the paper used. Male and female MC4R-Cre tg/wt mice, GCaMP6s in PVH MC4R neurons, one
# optic fiber over the PVH, head-fixed on a circular treadmill (running speed by IR beam), lick
# spout. Normal chow (NCD) or 60% fat diet (HFD) from 5 weeks of age, then calorie-matched food
# restriction (~9.5 kcal/day). Sessions have a 5-min baseline, then one trial per 60 s; a 2 kHz
# tone, and ~50 uL Ensure if the mouse licks within 1 s of tone onset ("triggered" trial). Signals
# at 50 Hz after demodulation, 10 Hz low-pass; trials cut 10 s before to 50 s after the tone.
# Measured variables are the 465 nm photometry signal (405 nm control), licks, running speed,
# body weight, home-cage food and Ensure intake.
#   Cohort 1 (Fig. 1, Supp. Fig. 1): 60-trial sessions; NCD 39 recordings/6 mice, HFD 33
#     recordings/5 mice (recordings with at least 30 triggered trials).
#   Cohort 2 (Fig. 2, Supp. Fig. 2), "a new cohort": 90-trial sessions; NCD 59 recordings/7 mice,
#     HFD 54 recordings/7 mice. Supp. Fig. 2l splits these into food-restricted only (NCD 31, HFD
#     31) and food-restricted plus 16 h fast (NCD 28, HFD 23) sessions. The meal-size groups of
#     Fig. 2f-s sum to 57 NCD and 53 HFD recordings, not 59 and 54. Supp. Fig. 2k by sex: M-NCD 26/3,
#     M-HFD 31/4, F-NCD 33/4, F-HFD 23/3.
#   Diet switch (Fig. 3, Supp. Fig. 3): 90-trial sessions, first diet then second diet from ~21
#     weeks after 6 weeks ad libitum. Legend counts (first/second diet): NCD->NCD 44/43 recordings,
#     6 mice; NCD->HFD6w 47/36, 6 mice; HFD->NCD 52/42, 7 mice; HFD->HFD 35/23, 4 mice. The Results
#     give other numbers (HFD->NCD 30 then 42 recordings, NCD 52 then 43, HFD 25 then 23); the
#     legend counts are used here. The paper does not say whether these mice are those of Fig. 2.
#   The dandiset (title as the paper; 24 subjects, NWB) is described as holding the fiber
#   photometry and linked behavioural data of the paper.
#
# Shared method definitions, from the Methods unless said otherwise, referred to below.
#   Triggered trials only; recordings with at least 30 triggered trials unless a claim says
#   otherwise (Methods). Early meal is the first 15 triggered trials, late meal the last 15;
#   mid-meal is the 15th to 29th triggered trial (Fig. 2p-s legends).
#   F0 is the mean of the 10 s before the tone in each trial; dF/F0 = (F - F0)/F0.
#   Response window (W). The paper gives three: 1-10 s post tone (Methods), 1-9 s post cue
#   (Fig. 2, Fig. 3 and Supp. Fig. 2-3 legends), 0-10 s post tone (Results, Fig. 1 section). For
#   Fig. 1 all three are readings; for Fig. 2 and 3 claims the readings are 1-9 s and 1-10 s.
#   Z-scoring (Z). The Methods say one Z-score per animal from that animal's recordings
#   concatenated. The paper's code fixes how the per-mouse SD is computed (tcpZ.m), not how it is
#   applied to trials. Readings: Z1, per trial (F - F0)/sigma, with sigma the tcpZ SD of the
#   mouse's concatenated, per-recording mean-subtracted filtered fluorescence; Z2, per trial
#   dF/F0 divided by the SD of the mouse's dF/F0 over all its trial samples concatenated.
#   A trial's response is the mean Z-scored signal in the window; an early or late value is the
#   mean over the trials of that phase; a mouse value is the mean of its recordings' values.
#   Delta Z-score (D). The Methods define it as the mean response of the last 5 triggered trials
#   minus the first 5 (Figs. 2c, d, 3j); legends describe late minus early meal, and the early
#   and late meal elsewhere are 15 trials. Readings: D5 (5 trials) and D15 (15 trials).
#   Statistics in Python with scipy.stats and statsmodels mixedlm (Methods). Alpha 0.05.
# Tolerances: for a mean with its s.e.m., the s.e.m.; otherwise 10% of the value.
schema_version: 2
dataset:
  archive: dandi
  id: "001474"
paper: doi:10.1038/s41598-025-19800-2
claims:
- id: fig1k-early-late-recordings
  statement: Per recording, PVH MC4R consumption responses in NCD mice are small early in the
    meal (Z 0.12 +- 0.11) and larger late (0.86 +- 0.09); in HFD mice they are already high early
    (0.72 +- 0.09) and do not increase late (0.79 +- 0.09).
  source: Results, Feeding-related responses ... elevated early in a meal in HFD-fed animals,
    paragraph on response magnitude; Figure 1k
  quote: On average, neural responses were minimal in NCD-fed animals in early trials (Z-score (NCD
    early) = 0.12 ± 0.11), but exhibited a robust increase in late trials ... (Z-score (NCD late) =
    0.86 ± 0.09) ... (Z-score (HFD early) = 0.72 ± 0.09), with no further increase observed
    throughout the meal (Z-score (HFD late) = 0.79 ± 0.09)
  expected:
  - quantity: NCD early-meal response, mean over recordings
    value: 0.12
    tolerance: 0.11
    unit: Z-score
  - quantity: NCD late-meal response, mean over recordings
    value: 0.86
    tolerance: 0.09
    unit: Z-score
  - quantity: HFD early-meal response, mean over recordings
    value: 0.72
    tolerance: 0.09
    unit: Z-score
  - quantity: HFD late-meal response, mean over recordings
    value: 0.79
    tolerance: 0.09
    unit: Z-score
  criterion: Cohort 1, 60-trial sessions with at least 30 triggered trials (39 NCD, 33 HFD).
    Early and late values per recording as in the opening comment, under each window W (0-10,
    1-10, 1-9 s) and each Z reading (Z1, Z2). Reproduced when, under one combination, all four
    means are within tolerance; partially reproduced when no combination puts all four in
    tolerance but under one NCD late is above NCD early and HFD early is above NCD early. All
    combinations are shown.
- id: fig1k-lme
  statement: In a linear mixed-effects model of recording-level responses with mouse as a random
    intercept, HFD early-meal responses exceed NCD early-meal responses and the diet by meal-phase
    interaction is significant.
  source: Figure 1k legend; Methods, Statistical analysis
  quote: Linear mixed-effects model (LME), p(NCD early vs. HFD early) < 0.001, p(Diet x Meal phase)
    < 0.001
  statistics:
  - about: HFD against NCD, early meal (diet coefficient, NCD and early meal as reference)
    test: linear mixed-effects model
    p: 0.001
    p_relation: "<"
    n: 39 NCD and 33 HFD recordings, 6 and 5 mice
  - about: diet x meal phase interaction
    test: linear mixed-effects model
    p: 0.001
    p_relation: "<"
    n: 39 NCD and 33 HFD recordings, 6 and 5 mice
  depends_on:
  - fig1k-early-late-recordings
  criterion: The Methods model, Value ~ Diet * Meal phase + (1 | Mouse), statsmodels mixedlm with
    its defaults (REML), on two rows per recording (early, late), Diet reference NCD. The
    Methods say this model was used for "Fig. 1 i"; the legend places it on Fig. 1k, the
    recording-level panel, which is followed. Early meal as the reference level is read from the
    legend's "p(NCD early vs. HFD early)". Reproduced when, under one W and Z combination of
    fig1k-early-late-recordings, the HFD coefficient is positive with p < 0.001 and the
    interaction is negative with p < 0.001; partially reproduced when both hold at p < 0.05 only.
    All combinations are shown.
- id: fig1l-early-late-mice
  statement: Per mouse, every NCD mouse increases its response from early to late in the meal
    (Z 0.19 +- 0.24 to 0.91 +- 0.13), while HFD mice do not change (0.73 +- 0.19 to 0.80 +- 0.20).
  source: Results, Feeding-related responses ... elevated early in a meal in HFD-fed animals,
    paragraph on response magnitude; Figure 1l
  quote: all individual NCD-fed animals exhibited an overall increase in consumption-related neural
    responses in the late meal phase (Z-score (NCD early) = 0.19 ± 0.24, Z-score (NCD late) = 0.91
    ± 0.13)) ... This pattern was consistent across all subjects (Z-score (HFD early) = 0.73 ± 0.19,
    Z-score (HFD late) = 0.80 ± 0.20)
  expected:
  - quantity: NCD early-meal response, mean over mice
    value: 0.19
    tolerance: 0.24
    unit: Z-score
  - quantity: NCD late-meal response, mean over mice
    value: 0.91
    tolerance: 0.13
    unit: Z-score
  - quantity: HFD early-meal response, mean over mice
    value: 0.73
    tolerance: 0.19
    unit: Z-score
  - quantity: HFD late-meal response, mean over mice
    value: 0.80
    tolerance: 0.20
    unit: Z-score
  depends_on:
  - fig1k-early-late-recordings
  criterion: Mouse values are the mean of each mouse's recording values (Methods, heatmaps and
    legend "by combining the sessions for each mouse"), under each W and Z reading. The legend's
    test is a paired, two-tailed t-test between early and late per diet; the p-values are shown
    only in the figure, not read here. Reproduced when, under one combination, the four means are
    within tolerance, all 6 NCD mice have late above early, the NCD paired t-test has p < 0.05,
    and the HFD paired t-test has p >= 0.05; partially reproduced when the tests come out so but
    a mean is out of tolerance.
- id: supp1i-hfd-no-change-1-20s
  statement: With a longer response window of 1 to 20 s after the cue, HFD mice still show no
    change in response from early to late in the meal.
  source: Results, Feeding-related responses ... elevated early in a meal in HFD-fed animals,
    paragraph on response magnitude; Supplementary Figure 1i
  quote: HFD-fed animals did not show a change in response from early to late in the meal when
    considering a longer window of 0–20 s post tone
  depends_on:
  - fig1k-early-late-recordings
  criterion: A claim of absence. The Results say 0-20 s and the legend 1-20 s post-cue; both
    windows are run. Mouse values (6 NCD, 5 HFD mice) under each Z reading; the legend's test, a
    two-way ANOVA (diet x meal phase) with Tukey HSD across the four diet and phase groups.
    Reproduced when the Tukey comparison of HFD early against HFD late has p >= 0.05; not
    reproduced when p < 0.05. The difference is reported either way, as is the NCD early-late
    comparison.
- id: supp1h-dff-early-late
  statement: Expressed as dF/F, HFD mice have stronger consumption responses than NCD mice at the
    start of the meal, and these persist to the end of the feeding bout.
  source: Results, Feeding-related responses ... elevated early in a meal in HFD-fed animals,
    paragraph 4; Supplementary Figure 1h
  quote: at the start of the meal, HFD-fed animals exhibited stronger feeding-evoked neural
    responses than NCD-fed animals, and these acute responses persisted until the end of the
    feeding bout
  criterion: No test is reported. Per-recording mean dF/F0 in the response window (each W
    reading), early and late meal, cohort 1. Reproduced when, under one window, the HFD
    early-meal mean exceeds the NCD early-meal mean and the HFD late-meal mean is at least as
    high as the HFD early-meal mean minus its s.e.m. over recordings.
- id: fig1gh-hfd-less-ensure
  statement: Despite calorie matching, HFD mice consume less Ensure than NCD mice, per recording
    session and per mouse.
  source: Results, Feeding-related responses ... elevated early in a meal in HFD-fed animals,
    paragraph 2; Figure 1g, h
  quote: Despite calorie matching to ensure comparable acute hunger states (Fig. 1 d), the HFD
    animals consumed less Ensure volume during the experimental recordings (Fig. 1 g, h)
  criterion: Cohort 1. Unpaired, two-tailed Student's t-test (equal variances, scipy default), as
    the legend states, on per-session totals (g) and per-mouse means (h). The volume is the
    recorded total Ensure consumed (Methods, "The total consumed Ensure throughout the experiment
    was noted"); where it is not available, the number of triggered trials times ~50 uL (Methods)
    is the reading used, and said. The paper does not say whether sessions with fewer than 30
    triggered trials are in panel g; both sets are run. Reproduced when the HFD mean is lower with
    p < 0.05 in both g and h under one session set; partially reproduced when in one of them.
- id: fig1c-hfd-heavier
  statement: During food restriction, HFD mice are about 30% heavier than NCD mice.
  source: Results, Feeding-related responses ... elevated early in a meal in HFD-fed animals,
    paragraph 2; Figure 1c
  quote: HFD-fed mice were ~ 30% heavier than the NCD-fed mice
  expected:
    quantity: HFD over NCD mean body weight during food restriction, minus 1
    value: 0.30
    tolerance: 0.03
  criterion: Cohort 1 body weights during the recording period. The paper does not say which days
    or how they are averaged; readings are (a) the mean over recording days per mouse, then over
    mice; (b) the mean over all recording-day weights pooled. Reproduced when one reading is
    within tolerance; partially reproduced when HFD is heavier by 20% to 40%.
- id: supp1cd-licking-declines
  statement: Both NCD and HFD mice reduce their licking from the early to the late phase of the
    session.
  source: Results, Feeding-related responses ... elevated early in a meal in HFD-fed animals,
    paragraph 2; Supplementary Figure 1c, d
  quote: Both NCD- and HFD-fed animals steadily reduced their licking rates from early to late
    phases of the session
  criterion: Supp. Fig. 1d measure, per mouse, the area under the post-cue lick-rate curve
    normalized to the pre-tone baseline lick rate, early against late meal. Open details, each run
    as a reading. Normalization is (a) subtraction of or (b) division by the mean lick rate of the
    10 s before the tone; the AUC window is (i) 1-10 s post tone (the Methods' reward-window lick
    rate) or (ii) 0-50 s (the whole post-cue trace); the test is (x) unpaired two-tailed t-test
    (Supp. Fig. 1d legend) or (y) paired two-tailed t-test (Methods list Supp. Fig. 1d under
    paired tests). Reproduced when all readings give late below early with p < 0.05 in both diets;
    partially reproduced when that holds in one diet under all readings; blocked as
    methods_underspecified when readings disagree.
- id: supp1e-hfd-less-locomotion
  statement: Food-seeking locomotion is negligible in HFD mice compared with NCD mice, and falls
    further near the end of the meal.
  source: Results, Feeding-related responses ... elevated early in a meal in HFD-fed animals,
    paragraph 2; Supplementary Figure 1e
  quote: Compared to NCD-fed animals, food-seeking-related locomotion was negligible in HFD-fed
    animals ... and it was further reduced to a minimum level late near the end of the meal
  criterion: No test is reported. Per mouse mean running speed over triggered trials, early and
    late meal, cohort 1. The window is not given in the Supp. Fig. 1e legend or the Methods;
    readings are (a) the whole trial, 10 s before to 50 s after the tone, and (b) the 10 s before
    the tone (the pre-cue period of Supp. Fig. 2g). Reproduced when, under every reading, the HFD
    mean over mice is below the NCD mean in both phases and the HFD late mean is below the HFD
    early mean; blocked as methods_underspecified when the readings disagree. Per-mouse values are
    shown.
- id: fig2b-meal-size
  statement: In 90-trial sessions NCD mice consume Ensure in 70.1 +- 2.1 trials and HFD mice in
    52.9 +- 1.98 trials.
  source: Results, HFD alters neural and behavioral responses ..., paragraph 1; Figure 2b
  quote: NCD-fed mice consumed Ensure during 70.1 ± 2.1 out of 90 possible trials, whereas HFD-fed
