  expected:
  - quantity: NCD triggered trials per session
    value: 70.1
    tolerance: 2.1
  - quantity: HFD triggered trials per session
    value: 52.9
    tolerance: 1.98
  criterion: Cohort 2, 90-trial sessions, mean over recordings. The legend names an unpaired,
