- id: fig2c-delta-z-recordings
  statement: Per recording, the change in response from early to late in the meal is 0.52 +- 0.09
    in NCD mice and only 0.12 +- 0.08 in HFD mice.
  source: Results, HFD alters neural and behavioral responses ..., paragraph 1; Figure 2c
  quote: in NCD-fed animals, excitatory responses increased over the meal, with a positive mean
