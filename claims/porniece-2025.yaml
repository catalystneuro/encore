  statement: In HFD mice, meal length (triggered trials) correlates negatively with absolute body
    weight.
  source: Results, HFD alters neural and behavioral responses ..., paragraph 7; Figure 2s
  quote: meal length (i.e. the number of triggered trials) correlated negatively with absolute body
    weight in HFD-fed animals (Fig. 2 s)
  criterion: Pearson correlation (legend) over HFD recordings, with at least 15 and, as a reading,
    at least 30 triggered trials. Reproduced when, under one reading, r < 0 with p < 0.05;
    partially reproduced when r < 0 and p >= 0.05.
- id: supp2a-volume-trials
  statement: Ensure volume consumed correlates robustly with the number of triggered trials in both
    diet groups, so meal size is defined as triggered trials.
  source: Results, HFD alters neural and behavioral responses ..., paragraph 1; Supplementary
    Figure 2a
  quote: there was a robust correlation between volume of Ensure consumed and number of triggered
    trials for both NCD- and HFD-fed animals
  criterion: No test is named; Pearson correlation, the paper's test for its other meal-size
    correlations (Fig. 2p-s), per diet over cohort 2 recordings with a recorded Ensure volume.
    Reproduced when r > 0 with p < 0.05 in both diets.
- id: supp2h-delta-z-meal-size
  statement: Across sessions, the within-meal change in response correlates with meal size with r =
    -0.34 (p = 0.012) in NCD mice and r = 0.26 (p = 0.048) in HFD mice. The sentence calls the NCD
    correlation positive and the HFD one negative, opposite to the printed signs.
  source: Results, HFD alters neural and behavioral responses ..., paragraph 9; Supplementary
    Figure 2h
  quote: >-
    This analysis revealed a positive correlation in the NCD-fed group and a negative correlation
    in the HFD-fed group (NCD: r = − 0.34, p = 0.012, HFD: r = 0.26, p = 0.048)
  statistics:
  - about: NCD
    test: Pearson correlation
    statistic: r = -0.34
    p: 0.012
  - about: HFD
    test: Pearson correlation
    statistic: r = 0.26
    p: 0.048
  expected:
  - quantity: Pearson r, NCD delta Z-score against triggered trials
    value: -0.34
    tolerance: 0.034
  - quantity: Pearson r, HFD delta Z-score against triggered trials
    value: 0.26
    tolerance: 0.026
  criterion: Per diet over cohort 2 recordings, Pearson correlation of triggered trials with the
    delta Z-score, read as the legend's late-meal minus early-meal mean (D15) and as the Methods'
    D5, each W and Z reading. Reproduced when, under one combination, both r are within tolerance
    with p < 0.05. If instead the signs come out as the sentence's words (NCD positive, HFD
    negative, both p < 0.05), partially reproduced, noting that the words and numbers disagree.
- id: supp2fg-locomotion-not-meal-size
  statement: HFD mice show reduced locomotion, but locomotion does not correlate with meal size.
  source: Results, HFD alters neural and behavioral responses ..., paragraph 8; Supplementary
    Figure 2f, g
  quote: Although HFD-fed animals exhibited reduced locomotion, this did not correlate with meal
    size (Supplementary Fig. 2f, g)
  criterion: The paper names no test for either part. Locomotion is the mean running speed in the
    pre-cue period (Supp. Fig. 2g legend) over triggered trials, per recording. Reduced
    locomotion holds when the HFD mean over recordings is below the NCD mean. The absence of a
    correlation is judged with Pearson correlation of triggered trials against locomotion per
    diet (the paper's test for its other meal-size correlations, a choice recorded as a
    deviation); reproduced when p >= 0.05 in both diets and HFD locomotion is lower; not
    reproduced when either correlation has p < 0.05. Locomotion after reward (1-10 s) is shown as
    a variant.
- id: supp2j-variability-weight
  statement: Pre-Ensure spontaneous signal variability correlates weakly with absolute body weight
    in HFD mice.
  source: Results, HFD alters neural and behavioral responses ..., paragraph 10; Supplementary
    Figure 2i, j
  quote: Our analysis revealed a weak correlation when assessing absolute body weight for HFD-fed
    animals (Supplementary Fig. 2 j)
  criterion: Variability is a rolling standard deviation of dF/F0 in the period before the first
    Ensure delivery, averaged per recording; the rolling window length and the F0 for this
    continuous trace are not given anywhere. Readings for the window are 1 s, 10 s and 60 s, and
    F0 is the mean of the pre-Ensure period. Pearson correlation over HFD recordings with
    recording-day body weight. Reproduced when all readings give p < 0.05 with |r| below 0.5 (the
    paper's "weak"); blocked as methods_underspecified when readings disagree.
- id: supp2k-sex-early-response
  statement: NCD females show slightly larger early-meal responses than males, a difference more
    pronounced in HFD mice.
  source: Results, HFD alters neural and behavioral responses ..., paragraph 11; Supplementary
    Figure 2k
  quote: NCD-fed females exhibited slightly larger neural responses than males early in the meal ... a
    trend that was even more pronounced in HFD-fed animals
  criterion: No test is reported. Mean over recordings of the early-meal response (first 15
    triggered trials) for M-NCD, F-NCD, M-HFD, F-HFD (26, 33, 31, 23 recordings), each W and Z
    reading. Reproduced when, under one combination, F exceeds M in both diets and the F minus M
    difference is larger in HFD than in NCD.
- id: supp2lp-fasting-no-effect
  statement: An additional overnight fast does not significantly alter licking or PVH MC4R
    response dynamics in either diet group.
  source: Results, HFD alters neural and behavioral responses ..., paragraph 12; Supplementary
    Figure 2l-p
  quote: However, additional fasting did not significantly alter licking or PVH MC4R response
    dynamics for either group (Supplementary Fig. 2l–p)
  criterion: A claim of absence for which the paper names no test. Fasted against nonfasted
    recordings within each diet (NCD 28 and 31, HFD 23 and 31), on the mean cue lick rate over
    triggered trials, the early-meal response and the delta Z-score (D15), each W and Z reading.
    Readings for the test are (a) an unpaired two-tailed Student's t-test on recordings, the
    paper's test for recording comparisons in Fig. 2b-c, and (b) a linear mixed-effects model,
    measure ~ fasting + (1 | Mouse), the paper's model for repeated sessions. Reproduced when every
    reading gives p >= 0.05 for every measure in both diets; not reproduced when every reading
    finds some effect at p < 0.05; blocked as methods_underspecified when they disagree. Effect
    sizes are reported.
- id: supp2q-hfd-more-training
  statement: HFD mice needed more training sessions than NCD mice to reach stable task performance.
  source: Methods, Behavioral training on wheels; Supplementary Figure 2q
  quote: Although HFD mice required more sessions to reach stable task performance (Supplementary
    Fig. 2q)
  criterion: Unpaired two-tailed Student's t-test (Methods, statistical analysis, item 3) on the
    number of training sessions per mouse. Reproduced when HFD is higher with p < 0.05. Testable
    only if training sessions are in the dataset.
- id: fig3h-early-response-diet-switch
  statement: After switching from HFD to NCD, early-meal PVH MC4R responses fall from their level on
    HFD toward NCD levels, while HFD->HFD mice keep high early-meal responses.
  source: Results, Effects of diet switching ..., paragraphs 2 and 5; Figure 3h
  quote: PVH MC4R neuron responses remained attenuated relative to prior responses while on HFD for
    most of the experiment (Fig. 3 f, h)
  criterion: Early-meal response per recording (first 15 triggered trials, W 1-9 and 1-10 s, each
    Z reading), recordings with at least 30 triggered trials, six groups (NCD->NCD, HFD->NCD,
    HFD->HFD, each before and after the switch). The legend's test, a two-way ANOVA (condition x
    phase) with Tukey HSD across the six groups. Reproduced when, under one combination, HFD->NCD
    after is below HFD->NCD before with Tukey p < 0.05 and HFD->HFD after is not below HFD->HFD
    before at p < 0.05; partially reproduced when HFD->NCD after is lower but not significantly.
    The before-switch HFD groups against NCD->NCD are reported.
- id: fig3i-ncd-increase-only
  statement: After the diet switch, NCD->NCD mice show a significant increase in response from
    early to late in the meal, while HFD->NCD mice show only a slight, nonsignificant increase.
  source: Results, Effects of diet switching ..., paragraph 4; Figure 3i; Supplementary Figure 3i
  quote: The HFD → NCD group displayed an intermediate pattern between the HFD → HFD and NCD → NCD
    groups, with a slight but nonsignificant increase in PVH MC4R responses across the meal
  statistics:
  - about: NCD->NCD early against late, after the switch
    test: linear mixed-effects model; paired, two-tailed t-test
    p: 0.05
    p_relation: "<"
  criterion: Second-diet recordings. Two tests the paper names, both run. (1) The Fig. 3i LME,
    Value ~ C(Condition, Treatment('NCD|NCD')) * Meal phase + (1 | Mouse) on two rows per
    recording; within-group early-late effects are the meal-phase coefficient with each group in
    turn as reference. (2) The Supp. Fig. 3i paired two-tailed t-test on mouse means. The NCD->NCD
    increase is reproduced when both give late above early with p < 0.05 under one W and Z
    combination. The HFD->NCD part is a claim of absence, judged on these two tests; reproduced when
    neither finds p < 0.05 and the late mean is above the early mean, not reproduced when both do,
    and blocked as methods_underspecified when they disagree. HFD->HFD is reported.
- id: fig3j-delta-z-diet-switch
  statement: After the switch, the per-mouse early-to-late change in response is 0.37 +- 0.03 in
    NCD->NCD, 0.14 +- 0.05 in HFD->NCD and -0.05 +- 0.07 in HFD->HFD mice; it is significantly smaller
    in HFD->HFD.
  source: Results, Effects of diet switching ..., paragraph 4; Figure 3j
  quote: >-
    we observed a significantly smaller increase in neural responses across trials in the HFD → HFD
    group ... six weeks of NCD exposure in formerly HFD-fed animals failed to fully restore this
    effect to NCD levels (ΔZ-score: NCD → NCD = 0.37 ± 0.03, HFD → NCD = 0.14 ± 0.05, HFD → HFD =
    − 0.05 ± 0.07)
  statistics:
  - about: HFD->HFD against NCD->NCD
    test: one-way ANOVA with Tukey HSD post hoc test
    p: 0.05
    p_relation: "<"
    n: 6, 7 and 4 mice
  expected:
  - quantity: NCD->NCD delta Z-score, mean over mice
    value: 0.37
    tolerance: 0.03
  - quantity: HFD->NCD delta Z-score, mean over mice
    value: 0.14
    tolerance: 0.05
  - quantity: HFD->HFD delta Z-score, mean over mice
    value: -0.05
    tolerance: 0.07
  criterion: Second-diet recordings with at least 30 triggered trials; mouse values are means of
    recording delta Z-scores, D5 (the Methods name Fig. 3j) and D15, each W and Z reading.
    One-way ANOVA with Tukey HSD (legend). Reproduced when, under one combination, the three means
    are within tolerance and HFD->HFD is below NCD->NCD with Tukey p < 0.05; partially reproduced
    when the order NCD->NCD > HFD->NCD > HFD->HFD holds and the Tukey test does, with means out of
    tolerance.
- id: fig3k-ensure-after-switch
  statement: After the switch, HFD->NCD mice consume as much Ensure per session as NCD->NCD mice
    and significantly more than HFD->HFD mice.
  source: Results, Effects of diet switching ..., paragraph 4; Figure 3k
  quote: the HFD → NCD group consumed a volume of Ensure comparable to the NCD → NCD group and
    significantly higher than the HFD → HFD group during individual recording sessions (Fig. 3 k)
  statistics:
  - about: HFD->NCD against HFD->HFD, after the switch
    test: two-way ANOVA with Tukey HSD post hoc test
    p: 0.05
    p_relation: "<"
  criterion: Ensure volume per recording (recorded total; triggered trials times ~50 uL as a
    reading where the total is absent), six groups (three conditions before and after), two-way
    ANOVA (condition x phase) with Tukey HSD (legend). Whether recordings with fewer than 30
    triggered trials are included is open; both sets are run. Reproduced when, under one set,
    HFD->NCD after exceeds HFD->HFD after with p < 0.05 and the Tukey test of HFD->NCD after
    against NCD->NCD after gives p >= 0.05; partially reproduced when only the first holds.
- id: fig3-hfd-hfd-short-meals
  statement: In the second diet phase, HFD->HFD mice stop consuming Ensure early, never exceeding
    60 triggered trials.
  source: Results, Effects of diet switching ..., paragraph 2; Figure 3d, g
  quote: The HFD → HFD group maintained high early-meal PVH MC4R responses (Fig. 3 d, g, h) and
    ceased to engage in Ensure consumption even earlier in the session, never exceeding 60
    triggered trials
  expected:
    quantity: maximum triggered trials in a second-phase HFD->HFD session
    value: 60
    tolerance: 0
  criterion: Over all second-phase HFD->HFD 90-trial recordings. Reproduced when no session has more
    than 60 triggered trials; partially reproduced when no more than one of the 23 sessions does.
- id: fig3c-hfd-ncd-licking-recovers
  statement: After at least six weeks on NCD, formerly HFD mice lick with more vigor during the cue,
    a reinstated motivation to consume food.
  source: Results, Effects of diet switching ..., paragraph 2; Figure 3c; Supplementary Figure 3f
  quote: After at least six subsequent weeks on NCD, these same animals displayed an increase in licking vigor
    during cue presentation (Fig. 3 c (bottom right panel), Supplementary Fig. 3f)
  criterion: No test is reported. Cue lick rate (0-1 s) over triggered trials per trial index,
    averaged across HFD->NCD recordings with at least 30 triggered trials (Supp. Fig. 3f legend),
    before against after the switch. Reproduced when the after curve's mean over trials 1-90 (each
    trial index weighted equally, indices with data in both phases) is above the before curve's
    and the mean over recordings of each recording's mean cue lick rate is higher after as well.
- id: supp3c-ncd-hfd6w-dynamics-retained
  statement: NCD mice switched to HFD for 6 weeks keep their response dynamics, with a significant
    early-to-late increase in response after the switch, comparable to the change before it, and
    stable licking vigor.
  source: Results, Effects of diet switching ..., paragraphs 3 and 4; Supplementary Figure 3a-d, h
  quote: the NCD → HFD 6w group retained their response properties, exhibiting comparable changes in
    response magnitude before (NCD) and after the diet switch (HFD 6w ) between early and late meal
    stages, despite a significant weight gain after the diet switch
  statistics:
  - about: NCD->HFD6w early against late, second diet phase
    test: paired, two-tailed t-test
    p: 0.05
    p_relation: "<"
    n: 6 mice
  criterion: Supp. Fig. 3c (1-9 s) and 3d (1-19 s) windows, each Z reading; mouse means of early
    and late meal responses, paired two-tailed t-test (legend), in the NCD phase and the HFD6w
    phase. The text calls only the second-phase increase significant; "comparable" before the
    switch is read as the same paired test also giving late above early with p < 0.05 in the NCD
    phase. Reproduced when late exceeds early with p < 0.05 in both phases under one Z reading in
    the 1-9 s window; partially reproduced when in the HFD6w phase only. Licking stability is
    reported as the mean cue lick rate per phase, not judged.
- id: supp3j-body-weight-switch
  statement: NCD->HFD6w mice gain significant body weight over the 6-week HFD phase, while HFD->NCD
    mice do not lose weight (a slight, nonsignificant gain).
  source: Results, Effects of diet switching ..., paragraphs 3, 4 and 7; Supplementary Figure 3j
  quote: these animals showed a significant increase in body weight during the 6-week HFD phase
    (Supplementary Fig. 3j)
  statistics:
  - about: NCD->HFD6w, before against after
    test: linear mixed-effects model
    p: 0.05
    p_relation: "<"
  criterion: The Methods model, per condition, body weight ~ phase + (1 | Mouse) on recording-day
    weights, statsmodels mixedlm. Reproduced when the NCD->HFD6w phase effect is positive with p <
    0.05 and the HFD->NCD phase effect has p >= 0.05 and is not negative with p < 0.05 (absence,
    judged on this model); partially reproduced when only the first holds.
- id: supp3m-weight-gain-response
  statement: In the second diet phase, mid-meal responses correlate positively with weight gain in
    NCD->HFD6w mice (r = 0.53, p = 0.001) and also in NCD->NCD mice (r = 0.46, p = 0.003).
  source: Results, Effects of diet switching ..., paragraph 6; Supplementary Figure 3m (text) or 3n
    (legend)
  quote: we observed a strong positive correlation (r = 0.53, p = 0.001) between mid-meal neural
    responses and the diet-induced weight gain in the NCD → HFD 6w group during the second diet
    phase ... we also observed a positive correlation in the NCD → NCD group (r = 0.46, p = 0.003)
  statistics:
  - about: NCD->HFD6w
    test: Pearson correlation
    statistic: r = 0.53
    p: 0.001
  - about: NCD->NCD
    test: Pearson correlation
    statistic: r = 0.46
    p: 0.003
  expected:
  - quantity: Pearson r, NCD->HFD6w
    value: 0.53
    tolerance: 0.053
  - quantity: Pearson r, NCD->NCD
    value: 0.46
    tolerance: 0.046
  criterion: Per second-phase recording, mid-meal response (15th-29th triggered trial, each W and Z
    reading) against weight on the recording day (C) relative to weight at the start of ad
    libitum feeding (A), as the Supp. Fig. 3n legend defines it (the text cites panel m, whose
    legend is meal size). "Relative to" is read as C - A and as C / A. Reproduced when, under one
    combination, both r are within tolerance with p < 0.05; partially reproduced when both are
    positive with p < 0.05.
- id: supp3l-weight-not-meal-length
  statement: In the second diet phase, absolute body weight does not predict meal length in
    NCD->NCD or NCD->HFD6w mice.
  source: Results, Effects of diet switching ..., paragraph 6; Supplementary Figure 3l
  quote: absolute body weight does not predict meal length in animals exposed to NCD or HFD 6w
    during the second meal phase (Supplementary Fig. 3l)
  criterion: A claim of absence; the test is Pearson correlation, read from the linear fits of the
    legend and the paper's correlations in this section. Per group, second-phase recordings,
    triggered trials against recording-day body weight. Reproduced when p >= 0.05 in both groups;
    not reproduced when either has p < 0.05.
- id: supp3q-hfd-ncd-weight-loss-meal-length
  statement: In HFD->NCD mice, meal length correlates negatively with weight change, so mice that
    lost more weight before the session tended to eat larger meals; neural responses do not
    correlate with weight change.
  source: Results, Effects of diet switching ..., paragraph 7; Supplementary Figure 3p, q
  quote: In the HFD → NCD group, we observed no correlation with neural responses (Supplementary
    Fig. 3j, p), but a significant negative correlation between meal length and weight change,
    indicating that animals that lost more weight before the session tended to have larger meals
  statistics:
  - about: meal length against weight change, HFD->NCD
    test: Pearson correlation
    p: 0.05
    p_relation: "<"
  criterion: Second-phase HFD->NCD recordings. Weight change is open; the text gives body weight
    relative to (a) the maximum ad libitum weight or (b) the weight before HFD exposure, and the
    legend relative to the start of ad libitum feeding (A); each as a difference and as a ratio.
    Pearson correlation of triggered trials with weight change. The "no correlation with neural
    responses" is cited to Supp. Fig. 3p, whose legend correlates mid-meal response with meal
    size, while the text pairs it with weight change; both are run, mid-meal response (15th-29th
    triggered trial, each W and Z reading) against (i) weight change and (ii) triggered trials.
    Reproduced when, under one weight-change reading, the first has r < 0 with p < 0.05 and the
    neural correlations have p >= 0.05 under both (i) and (ii); partially reproduced when the
    first holds and only one of (i) and (ii) has p >= 0.05.
checks:
- date: 2026-10-21
  kind: agent
  model: claude-opus-5-5
  ready: true
  changes:
  - fig2b-meal-size. Removed the statistics entry (p < 0.05). It recorded the paper's alpha, not a result; the text does not call the difference significant and its p is only in the figure. The criterion now says so.
  - supp1e-hfd-less-locomotion. The criterion fixed the running window as the whole 60-s trial, a choice the paper does not make. Named it open, with readings for the whole trial and for the 10 s pre-cue period (Supp. Fig. 2g), and a methods_underspecified outcome when they disagree.
  - supp3c-ncd-hfd6w-dynamics-retained. The statement said the increase was significant both before and after the switch; the text calls only the second-phase increase significant and calls the two changes comparable. Reworded the statement, and the criterion now says the before-switch test is a reading of "comparable".
  - supp3q-hfd-ncd-weight-loss-meal-length. The text pairs "no correlation with neural responses" with weight change, but cites Supp. Fig. 3p, whose legend correlates mid-meal response with meal size. Both correlations are now run.
  - Open. The supplementary PDF could not be rendered here (no pdftoppm), and the main figures are not available, so significance marks shown only in figures (Fig. 1l, Fig. 2b-d, Fig. 3h, Supp. Fig. 1d, 1i) were not read. The criteria that require p < 0.05 for these tests (fig1l, fig2c, fig2d, fig3h) rest on the legends naming the test, not on a stated result.
  - Open. Some method details have no source in the paper or the code read, namely the rolling SD window for supp2j and the onset-of-decline rule in fig2e (both given as readings in their criteria), and the bound |r| < 0.5 that supp2j uses for "weak", which is a fixed reading of that word.
