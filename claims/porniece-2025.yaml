- id: fig2e-lick-vigor
  statement: Throughout the 90-trial meal NCD mice lick at a higher rate during the cue than HFD
    mice; NCD licking begins to decline after about 50 trials and HFD licking after about 20.
  source: Results, HFD alters neural and behavioral responses ..., paragraph 2; Figure 2e
  quote: Throughout the meal, NCD-fed animals exhibited higher licking vigor than HFD-fed animals
