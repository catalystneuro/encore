    p: 0.1
    p_relation: ">"
    n: 196 pairs
  - about: spatial correlation, excited pairs
    statistic: r = -0.02
    p: 0.7
    p_relation: ">"
    n: 219 pairs
  - about: spatial correlation, inhibited pairs
    statistic: r = 0.05
    p: 0.5
    p_relation: ">"
    n: 196 pairs
  criterion: A claim of absence, judged on the paper's regression test at p < 0.05 for each of the
