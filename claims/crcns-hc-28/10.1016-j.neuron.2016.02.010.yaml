- id: wtrack-learning
  statement: On the W-track all animals performed above chance by the third day of training and
    above 80% correct by the eighth and final day.
  source: Results, Excitation and Inhibition of PFC Neurons during Awake Hippocampal SWRs,
    paragraph 1
  quote: All animals performed above chance by the third day of training, and performed >80% by
    the eighth and final day of training
  expected:
  - quantity: proportion of correct trials on day 8, each W-track animal
    value: 0.8
    unit: fraction
  criterion: The paper gives no scoring procedure beyond the task rule (SEP, Behavioral Tasks)
    and the cited Jadhav et al. (2012). Trials are well-to-well visits read from position; an
    inbound trial (to the center after a side well) is correct when the animal returns to the
    center; an outbound trial (from the center) is correct when it goes to the side opposite the
    previous side visit. Chance is not defined in the paper; readings are (a) 50% correct over
    all trials of the day, (b) a binomial test of the day's correct count against 0.5 at p <
    0.05. Reproduced when every animal is above chance under one reading on day 3 and above 0.8
    on day 8. A well visit is a stop within the reward-well zone; its radius is not given, and
    the author states the one used.
