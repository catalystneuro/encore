    inhibited do not differ at p < 0.01; means by the pooled-value rule. Readings for the
    cells entered are (a) theta-locked cells only (the text says "for theta-modulated cells"),
    (b) all cells with >= 50 theta spikes.
  depends_on:
  - fig4-swr-modulated-more-theta-locked
- id: fig4c-theta-locked-more-swr-modulated
  statement: Theta-modulated PFC neurons (n = 189) are more strongly SWR modulated than neurons
    that are not theta modulated (n = 123), SWR modulation index 5.2 +- 0.8 against 2.5 +- 0.4.
  source: Results, SWR Modulation Is Related to Theta Phase Locking of PFC Neurons, paragraph 3;
    Figure 4C
  quote: PFC neurons that were significantly theta modulated (n = 189) were also significantly
    more strongly SWR modulated than neurons that were not theta modulated (n = 123) (Figure 4C,
    SWR modulation index, 5.2 ± 0.8 and 2.5 ± 0.4 respectively; p < 0.01, rank-sum test)
  statistics:
  - test: rank-sum test
    p: 0.01
    p_relation: "<"
    n: 189 theta-modulated and 123 theta-unmodulated PFC cells
  expected:
  - quantity: SWR modulation index, theta modulated
    value: 5.2
    tolerance: 0.8
  - quantity: SWR modulation index, theta unmodulated
    value: 2.5
    tolerance: 0.4
  criterion: The "SWR modulation index" is not defined beyond the modulation measure (squared
    difference between real and mean shuffled PSTH, 0-200 ms; SEP). Readings are (a) that measure
    divided by the mean of the shuffled measures, (b) the measure as a z-score against the
    shuffled measures, (c) the raw measure. Reproduced when theta-modulated cells exceed
    unmodulated at p < 0.01 (rank-sum) under the reading used, and the values are judged by the
    pooled-value rule under one reading.
  depends_on:
  - fig4-theta-locked-fraction
- id: fig4-preferred-phase-concentration
  statement: Preferred theta phases of SWR-excited neurons are more concentrated than those of
    SWR-unmodulated neurons (p = 0.005), while SWR-inhibited and unmodulated neurons do not
    differ, nor do excited and inhibited (p > 0.1).
  source: Results, SWR Modulation Is Related to Theta Phase Locking of PFC Neurons, paragraph 4
  quote: SWR-excited versus SWR-unmodulated, n = 57 versus 203 neurons, p = 0.005). In contrast,
    SWR-inhibited and SWR-unmodulated neurons did not differ in their concentration of preferred
    phases (n = 52 versus 203 neurons, p > 0.1, kuiper test)
  statistics:
  - about: excited against unmodulated
    test: Kuiper test
    p: 0.005
    n: 57 and 203 neurons
  - about: excited against inhibited
    test: Kuiper test
    p: 0.1
    p_relation: ">"
    n: 57 and 52 neurons
  - about: inhibited against unmodulated
    test: Kuiper test
    p: 0.1
    p_relation: ">"
    n: 52 and 203 neurons
  criterion: Two-sample Kuiper tests on the preferred phases. The n (57, 52, 203) are all cells of
    each group, so the paper's reading enters every cell of the group; the theta-locked cells only
    are shown as a variant. The text calls the excited distribution narrower than both other
    groups, but reports p > 0.1 against inhibited; the statement follows the tests. Reproduced
    when excited against unmodulated is significant at p < 0.01 and the two other comparisons are
    not.
  depends_on:
  - fig4-swr-modulated-more-theta-locked
- id: theta-lag-past
  statement: PFC cells phase lock best to hippocampal theta about 15 ms in the past.
  source: Results, SWR Modulation Is Related to Theta Phase Locking of PFC Neurons, paragraph 5
  quote: we also found that all PFC cells phase locked optimally to hippocampal theta of the past
  expected:
    quantity: delay of maximal phase locking
    value: -15
    tolerance: 10
    unit: ms
  criterion: The paper shows no data ("data not shown") and gives no method beyond shifting the
    time of theta. Spike times are shifted relative to the theta phase in steps of 5 ms over -100
    to +100 ms (a standard choice), and locking strength is measured as kappa. Readings are (a)
    the shift maximizing the mean kappa over theta-locked PFC cells, (b) the median over cells of
    each cell's best shift. Reproduced when, under one reading, the best shift is negative (theta
    in the past) and within 10 ms of -15 ms. The tolerance is widened to 10 ms because the
    paper prints "delay ~15 ms" without spread and the shift step is 5 ms.
  depends_on:
  - fig4-theta-locked-fraction
- id: fig5b-mean-rates
  statement: SWR-excited and SWR-inhibited PFC cells fire at higher mean rates during movement than
    SWR-unmodulated cells (4.2 +- 0.5, 3.2 +- 0.4 and 2.1 +- 0.2 Hz), and excited and inhibited do
    not differ.
  source: Results, SWR-Excited and Inhibited PFC Neurons Comprise Distinct Functional
    Populations, paragraph 2; Figure 5B
  quote: both SWR-excited and SWR-inhibited cells had significantly higher mean rates than
    SWR-unmodulated cells
  statistics:
  - about: excited against unmodulated
    test: rank-sum test
    p: 0.01
    p_relation: "<"
  - about: inhibited against unmodulated
    test: rank-sum test
    p: 0.0001
    p_relation: "<"
  - about: excited against inhibited
    test: rank-sum test
    p: 0.1
    p_relation: ">"
    n: 57 excited, 52 inhibited and 203 unmodulated cells
  expected:
  - quantity: mean rate, SWR-excited
    value: 4.2
    tolerance: 0.5
    unit: Hz
  - quantity: mean rate, SWR-inhibited
    value: 3.2
    tolerance: 0.4
    unit: Hz
  - quantity: mean rate, SWR-unmodulated
    value: 2.1
    tolerance: 0.2
    unit: Hz
  criterion: Mean firing rate during movement. "Movement" is not defined for this measure; readings
    are (a) time at speed > 5 cm/s with no SWR, the paper's theta and behavior periods (SEP), (b)
    time at speed > 4 cm/s, the complement of the SWR speed criterion, (c) the mean rate over the
    whole run epoch. Rank-sum tests at p < 0.01. Reproduced when, under one reading, both
    modulated groups exceed unmodulated at p < 0.01 and excited and inhibited do not differ;
    means by the pooled-value rule.
  depends_on:
  - fig3-pfc-swr-modulation-fractions
- id: fig5c-spatial-coverage
  statement: SWR-excited PFC neurons cover more of the environment (0.70 +- 0.05) than SWR-inhibited
    (0.54 +- 0.05) and SWR-unmodulated neurons (0.50 +- 0.02), which do not differ, and CA1 cells
    cover less than all PFC groups.
  source: Results, SWR-Excited and Inhibited PFC Neurons Comprise Distinct Functional
    Populations, paragraph 2; Figure 5C
  quote: SWR-excited neurons had significantly higher levels of coverage than both the
    SWR-inhibited and the SWR-unmodulated neurons ... excited, 0.70 ± 0.05; inhibited, 0.54 ±
    0.05; unmodulated, 0.50 ± 0.02
  statistics:
  - about: excited against inhibited
    test: rank-sum test
    p: 0.01
    p_relation: "<"
  - about: excited against unmodulated
    test: rank-sum test
    p: 0.0001
    p_relation: "<"
  - about: inhibited against unmodulated
    test: rank-sum test
    p: 0.1
    p_relation: ">"
  - about: CA1 against each PFC group
    test: rank-sum test
    p: 0.01
    p_relation: "<"
  expected:
  - quantity: coverage, SWR-excited
    value: 0.70
    tolerance: 0.05
  - quantity: coverage, SWR-inhibited
    value: 0.54
    tolerance: 0.05
  - quantity: coverage, SWR-unmodulated
    value: 0.50
    tolerance: 0.02
  criterion: Coverage as in the opening comment (cells with peak > 3 Hz). Rank-sum tests at p <
    0.01. Reproduced when excited exceeds both other PFC groups at p < 0.01, inhibited and
    unmodulated do not differ, and CA1 is below every PFC group at p < 0.01; means by the
    pooled-value rule. The coverage of the W-track is the only kind the data set holds, so the
    linearization is the paper's own 4 trajectories.
  depends_on:
  - fig3-pfc-swr-modulation-fractions
- id: figs3-arm-and-direction-selectivity
  statement: CA1 cells are more selective than all PFC groups for arm and for inbound or outbound
    direction, and SWR-excited PFC cells are less direction selective than SWR-unmodulated cells.
  source: Figure S3B and S3D legends
  quote: The CA1 population has significantly higher selectivity for specific inbound or outbound
    trajectories than all the PFC populations ... SWR-excited neurons have significantly lower
    direction selectivity than SWR-unmodulated neurons (*p< 0.01, rank-sum test)
  statistics:
  - about: CA1 against PFC, arm and direction selectivity
    test: rank-sum test
    p: 0.0001
    p_relation: "<"
  - about: SWR-excited against SWR-unmodulated, direction selectivity
    test: rank-sum test
    p: 0.01
    p_relation: "<"
  criterion: Arm index is |left - right| / (left + right) of arm firing rates; direction index is
    |outward - inward| / (outward + inward) (SEP, Spatial and Behavioral Coding Properties).
    Which rate enters (mean or peak over the arm's linearized bins) is not stated; readings are
    mean and peak. Reproduced when, under one reading, CA1 exceeds each PFC group in both indices
    at p < 0.01 and excited is below unmodulated in direction index at p < 0.01.
  depends_on:
  - fig5c-spatial-coverage
- id: fig5e-speed-correlation
  statement: SWR-excited cells have higher firing rate-speed correlations than SWR-inhibited cells,
    whose median correlation is below zero, while unmodulated cells do not differ from either.
  source: Results, SWR-Excited and Inhibited PFC Neurons Comprise Distinct Functional
    Populations, paragraph 3; Figure 5D and 5E
  quote: SWR-excited cells showing a significantly higher firing rate-speed correlation than
    SWR-inhibited cells (Figures 5D and 5E; p < 0.01 for excited versus inhibited, rank-sum
    test). Further, the median of SWR-inhibited cells' speed correlations was significantly less
    than zero
  statistics:
  - about: excited against inhibited
    test: rank-sum test
    p: 0.01
    p_relation: "<"
  - about: median of inhibited cells below zero
    test: shuffle test, 1000 shuffles
    p: 0.01
    p_relation: "<"
  - about: unmodulated against excited or inhibited
    test: rank-sum test
    p: 0.05
    p_relation: ">"
  criterion: The rate-speed correlation is not specified. Readings are (a) Pearson correlation
    across time bins of the run epochs between spike count and mean speed, with 200 ms bins (the
    bin of the paper's behavior GLM, SEP) and 1 s bins; (b) correlation between speed-bin centers
    and the rate in each speed bin. The shuffle for the median is not described; readings are (a)
    circularly shifting each cell's spike train relative to speed, (b) shuffling speed bins.
    Reproduced when, under one reading, excited exceeds inhibited at p < 0.01, the inhibited median
    is below zero at p < 0.01, and unmodulated does not differ from either at p < 0.05.
  depends_on:
  - fig3-pfc-swr-modulation-fractions
- id: fig5f-pre-swr-vs-movement
  statement: SWR-inhibited cells fire more just before SWRs than during high-speed movement, while
    SWR-excited cells show the opposite preference.
  source: Results, SWR-Excited and Inhibited PFC Neurons Comprise Distinct Functional
    Populations, paragraph 3; Figure 5F
  quote: we found that firing rates of SWR-inhibited cells just prior to SWRs were higher than
    those during high-speed movement. In contrast, SWR-excited cells showed the opposite pattern,
    with a preference for movement times
  statistics:
  - test: rank-sum test
    p: 0.001
    p_relation: "<"
    n: 57 excited and 52 inhibited cells
  criterion: Index (pre-SWR - high speed) / (pre-SWR + high speed), pre-SWR rate in -500 to -100 ms
    before SWR onset, high speed > 10 cm/s (SEP, Spatial and Behavioral Coding Properties).
    Reproduced when the inhibited index exceeds the excited index by rank-sum at p < 0.01 (the
    legend prints p < 0.01, the text p < 0.001) and the group means have opposite signs, inhibited
    positive.
  depends_on:
  - fig3-pfc-swr-modulation-fractions
- id: figs3e-reward-modulation
  statement: SWR-inhibited PFC cells increase their firing after reward more than SWR-excited cells.
  source: Figure S3E and S3F legends; Results, SWR-Excited and Inhibited PFC Neurons Comprise
    Distinct Functional Populations, paragraph 3
  quote: PFC SWR-inhibited cells also showed a greater tendency to increase firing rates following
    reward than SWR-excited cells
  statistics:
  - test: rank-sum test
    p: 0.007
    n: 56 SWR-excited, 51 SWR-inhibited and 194 SWR-unmodulated cells
  criterion: Reward modulation index (post - pre) / (post + pre), post 0 to 2 s after reward, pre
    -3 to -1 s before, reward times extracted for each trajectory from position and speed (SEP).
    The reward time rule is not given; readings are (a) arrival in the well zone at the end of a
    rewarded trajectory, (b) the first time speed drops below 4 cm/s there. Reproduced when the
    inhibited index exceeds the excited index by rank-sum at p < 0.01 under one reading.
  depends_on:
  - figs2-swr-at-reward-wells
  - fig3-pfc-swr-modulation-fractions
- id: fig5g-ensemble-cofiring
  statement: During movement, like-modulated PFC pairs fire together while excited-inhibited pairs
    do not; the theta cross-covariance peak of excited-inhibited pairs is lower than that of every
    other pair category.
  source: Results, SWR-Excited and Inhibited PFC Neurons Comprise Distinct Functional
    Populations, paragraph 4; Figure 5G
  quote: SWR-excited cells tended to fire in close temporal proximity to other SWR-excited cells
    and SWR-inhibited cells tended to fire in proximity to other SWR-inhibited cells, but
    SWR-excited and SWR-inhibited cells tended not to fire together
  statistics:
  - test: rank-sum test
    p: 0.001
    p_relation: "<"
    n: 42 excited-excited, 36 inhibited-inhibited, 73 excited-inhibited and 369
      unmodulated-unmodulated pairs
  expected:
  - quantity: excited-excited pairs
    value: 42
    tolerance: 4.2
  - quantity: inhibited-inhibited pairs
    value: 36
    tolerance: 3.6
  - quantity: excited-inhibited pairs
    value: 73
    tolerance: 7.3
  - quantity: unmodulated-unmodulated pairs
    value: 369
    tolerance: 36.9
  criterion: Simultaneously recorded PFC pairs, standardized theta cross-covariance as in the
    opening comment. "Maximum zero lag cross-covariance" can be read as (a) the peak of the
    smoothed cross-covariance within -200 to +200 ms (SEP), (b) its value at zero lag. Whether
    pairs on the same tetrode enter is not stated; both are shown. Reproduced when, under one
    reading, excited-inhibited pairs are lower than each other category at p < 0.001 by rank-sum;
    pair counts by the pooled-value rule.
  depends_on:
  - fig3-pfc-swr-modulation-fractions
- id: fig6-swr-correlated-pairs
  statement: 16% of CA1-PFC pairs (116 of 713) are significantly correlated across SWRs, more than
    the about 5% found after shuffling, with similar proportions for SWR-excited (72 of 393, 18%)
    and SWR-inhibited (44 of 320, 14%) PFC cells.
  source: Results, Structured Reactivation of CA1-PFC Pairs during SWRs, paragraph 3; Figure S4A;
    SEP, SWR Correlations and Theta Cross-covariance
  quote: We found that 16% of CA1-PFC neuron pairs were significantly SWR correlated (n = 116/713
    CA1-PFC pairs, p < 0.05 criterion for individual pairs
  statistics:
  - about: fraction of significant pairs against shuffled
    test: Z test for proportions
    statistic: z = 6.5
    p: 1.0e-8
    p_relation: "<"
    n: 713 CA1-PFC pairs
  expected:
  - quantity: fraction of pairs SWR correlated, all
    value: 0.16
    tolerance: 0.016
  - quantity: fraction of pairs SWR correlated, SWR-excited PFC
    value: 0.18
    tolerance: 0.018
  - quantity: fraction of pairs SWR correlated, SWR-inhibited PFC
    value: 0.14
    tolerance: 0.014
  criterion: Pairs of simultaneously recorded CA1 cells and SWR-modulated PFC cells with at least 5
    SWRs in which both spike; SWR correlation and its readings as in the opening comment; pair
    significant at p < 0.05. Shuffle by permuting the PFC rates across SWRs (the paper's "shuffling
    the rates across SWRs"). Reproduced when the fraction exceeds the shuffled fraction by a z test
    for proportions at p < 0.05 under one reading, with fractions by the pooled-value rule.
  depends_on:
  - fig3-pfc-swr-modulation-fractions
  - ca1-swr-modulated
- id: fig6ab-both-signs
  statement: Significant CA1-PFC SWR correlations include both positive and negative correlations,
    for both SWR-excited and SWR-inhibited PFC cells.
  source: Results, Structured Reactivation of CA1-PFC Pairs during SWRs, paragraph 3; Figure 6A,
    6B and S4A
  quote: these included both positive and negative correlations with both SWR-excited and
    SWR-inhibited PFC populations
  criterion: Reproduced when, among significant pairs, at least one positive and one negative
    correlation occur in each PFC group, under the reading of fig6-swr-correlated-pairs that is
    used there. The counts of each sign are reported.
  depends_on:
  - fig6-swr-correlated-pairs
- id: fig6c-theta-predicts-swr-correlation
  statement: Theta-period cross-covariance of CA1-PFC pairs predicts their SWR correlation (r =
    0.39 for all 713 pairs, and 0.39 for each of the excited and inhibited groups), equally in the
    two groups.
  source: Results, Structured Reactivation of CA1-PFC Pairs during SWRs, paragraph 5; Figure 6C
  quote: This analysis revealed a significant relationship between theta cross-covariance and SWR
    correlations (r = 0.39, n = 713 pairs ... SWR-excited neurons, r = 0.39, n = 393 pairs ...
    SWR-inhibited neurons, r = 0.39, n = 320 pairs
  statistics:
  - about: all pairs, and each group
    test: regression test
    statistic: r = 0.39
    p: 0.0001
    p_relation: "<"
    n: 713 pairs (393 excited, 320 inhibited)
  - about: excited against inhibited strength
    test: shuffle test, 1000 shuffles
    p: 0.1
    p_relation: ">"
  expected:
  - quantity: r, all pairs
    value: 0.39
    tolerance: 0.039
  - quantity: r, SWR-excited pairs
    value: 0.39
    tolerance: 0.039
  - quantity: r, SWR-inhibited pairs
    value: 0.39
    tolerance: 0.039
  criterion: Pearson r between the peak theta cross-covariance and the SWR correlation, with the
    test of the regression slope. The group comparison by the shuffle of the SEP (pairs pooled
    and split at random into groups of the same sizes, 1000 times). Reproduced when r > 0 at p <
    0.05 in all pairs and in each group, and the groups do not differ at p < 0.05; r by the
    pooled-value rule.
  depends_on:
  - fig6-swr-correlated-pairs
- id: figs4b-ca1-leads-in-theta
  statement: For CA1-PFC pairs with significant positive SWR correlations, the theta cross-covariance
    peaks after zero lag, so CA1 leads PFC during behavior as during SWRs.
  source: Figure S4B legend; Results, Structured Reactivation of CA1-PFC Pairs during SWRs,
    paragraph 5
  quote: Only pairs with significant and positive SWR correlations are included ... illustrating
    that the peaks after 0 ms for both populations, indicating that CA1 leads PFC on average
  expected:
  - quantity: positive significant pairs, SWR-excited
    value: 46
    tolerance: 4.6
  - quantity: positive significant pairs, SWR-inhibited
    value: 26
    tolerance: 2.6
  criterion: The population mean standardized theta cross-covariance of these pairs. Reproduced
    when its peak lies after 0 ms (PFC after CA1) in both groups; counts by the pooled-value rule.
  depends_on:
  - fig6-swr-correlated-pairs
- id: fig6e-glm-swr-prediction
  statement: A GLM of CA1 ensemble SWR spiking predicts SWR spiking of SWR-modulated PFC cells
    above chance, better with larger CA1 ensembles and better than for unmodulated cells, with no
    difference between excited and inhibited cells.
  source: Results, Structured Reactivation of CA1-PFC Pairs during SWRs, paragraph 7; Figure 6E
  quote: we found that that prediction performance was better than chance for SWR-modulated PFC
    cells (n = 77) and increased with the size of the CA1 ensemble
  statistics:
  - about: ensemble size groups, modulated cells
    test: one-way ANOVA, main effect of cell count group
    p: 0.0001
    p_relation: "<"
    n: 30, 20 and 27 PFC cells
  - about: modulated against unmodulated
    test: two-way ANOVA
    p: 0.0001
    p_relation: "<"
    n: 77 modulated and 102 unmodulated cells
  - about: excited against inhibited
    test: two-way ANOVA
    p: 0.29
    n: 40 excited and 37 inhibited cells
  criterion: Poisson GLM, log link, PFC 0-200 ms SWR spike count on the CA1 cells' counts; 90/10
    split repeated 5000 times; error is the mean absolute difference of predicted and actual
    counts; shuffled error from predictions shuffled across SWRs; performance is the fractional
    improvement over shuffled error (SEP, GLM; Figure S7D legend). Cells whose GLM does not
    converge are dropped. Open, with readings - chance test as (a) a signed-rank test of the
    cells' performance against 0, (b) per cell, real error below shuffled in more than 95% of
    splits; ensemble size groups are shown only in the figure, so (a) tertiles of CA1 ensemble
    size, (b) three groups of equal size width. Reproduced when performance is above chance,
    rises with ensemble size (ANOVA p < 0.05), modulated exceeds unmodulated (two-way ANOVA p <
    0.05) and excited and inhibited do not differ at p < 0.05, under one reading.
  depends_on:
  - fig3-pfc-swr-modulation-fractions
- id: fig6e-theta-trained-glm
  statement: GLMs trained on movement activity also predict PFC SWR spiking, better for modulated
    than unmodulated cells and better with larger ensembles, and predict SWRs better than
    SWR-trained models predict movement activity.
  source: Results, Structured Reactivation of CA1-PFC Pairs during SWRs, paragraph 8; Figure 6E
    (white bars)
  quote: We found that theta-derived models could in many cases predict PFC SWR firing and that
    the accuracy of this prediction also increased with the size of the CA1 ensemble
  statistics:
  - about: modulated against unmodulated
    test: two-way ANOVA
    p: 0.02
  - about: ensemble size groups
    test: two-way ANOVA, cell count group
    p: 1.0e-7
    p_relation: "<"
  - about: model type by cell count interaction (theta-trained to SWR against SWR-trained to theta)
    test: two-way ANOVA
    p: 0.01
    p_relation: "<"
  criterion: Behavior data are run-epoch time at speed > 5 cm/s with no SWR, in 200 ms bins (SEP,
    GLM), used to train the model; it is then applied to the SWR counts; and SWR-trained models to
    the behavior bins. Performance and readings as in fig6e-glm-swr-prediction. Reproduced when
    theta-trained performance is above chance, modulated exceeds unmodulated at p < 0.05, and
    theta-to-SWR exceeds SWR-to-theta performance.
  depends_on:
  - fig6e-glm-swr-prediction
- id: figs4c-pfc-predicts-ca1
  statement: Reversing the model, SWR-modulated PFC ensembles predict CA1 SWR spiking, better than
    unmodulated PFC ensembles and better with larger ensembles, with excited and inhibited PFC
    cells predicting similarly.
  source: Figure S4C legend
  quote: As expected, predictions using PFC SWR-modulated cells (n = 102) were significantly better
    than those using PFC SWR-unmodulated (n = 203) cells ... 2-way ANOVA, p = 0.02
  statistics:
  - about: modulated against unmodulated PFC
    test: two-way ANOVA
    p: 0.02
  - about: ensemble size, SWR-trained and movement-trained
    test: one-way ANOVA
    p: 1.0e-10
    p_relation: "<"
  - about: excited against inhibited PFC
    test: two-way ANOVA
    p: 0.7
    p_relation: ">"
  criterion: As in fig6e-glm-swr-prediction with CA1 cells as targets and PFC ensembles of each
    category as predictors. Reproduced when modulated ensembles predict better than unmodulated at
    p < 0.05, performance rises with ensemble size, and excited and inhibited do not differ.
  depends_on:
  - fig6e-glm-swr-prediction
- id: fig7c-spatial-correlation
  statement: The spatial correlation of CA1-PFC pairs is related to their SWR correlation (r = 0.2
    for excited, 0.36 for inhibited PFC cells), more strongly for SWR-inhibited cells; SWR-correlated
    pairs have higher, and anticorrelated pairs lower and negative, spatial correlation than
