- id: fig8d-glm-epoch-specific
  statement: GLMs trained on task SWRs fail to predict PFC spiking in pre-rest SWRs, and cross-epoch
    predictions are worse than within-task and within-pre-rest predictions.
  source: Results, Task-Related CA1-PFC Correlations Are Not Present in Preceding Rest Periods,
    paragraph 2; Figure 8D
  quote: GLMs trained on SWR activity in the awake state (CA1 ensemble activity predicting PFC
    spiking) were unable to predict PFC spiking in SWRs during pre-rest periods (shuffle test, n =
    1,000, p > 0.5) and performed significantly worse than prediction of PFC spiking in SWRs during
    behavior
  statistics:
  - about: task to pre-rest against chance
    test: shuffle test, 1000 shuffles
    p: 0.5
    p_relation: ">"
  - about: task to pre-rest against task to task, SWR-trained
    test: rank-sum test
    p: 1.0e-6
    p_relation: "<"
    n: 38 and 24 cells
  - about: pre-rest to task against task to task, SWR-trained
    test: rank-sum test
    p: 1.0e-6
    p_relation: "<"
    n: 38 and 22 cells
  - about: pre-rest to pre-rest against each cross-epoch prediction, SWR-trained
    test: rank-sum test
    p: 0.01
    p_relation: "<"
    n: 39 against 24 and 22 cells
  expected:
  - quantity: cells, task to task
    value: 38
    tolerance: 3.8
  - quantity: cells, task to pre-rest
    value: 24
    tolerance: 2.4
  - quantity: cells, pre-rest to task
    value: 22
    tolerance: 2.2
  - quantity: cells, pre-rest to pre-rest
    value: 39
    tolerance: 3.9
  criterion: W-track only. GLMs as in fig6e-glm-swr-prediction; cross-epoch prediction only when
    all CA1 cells of the model are present in both epochs (Figure S7D legend). The task-to-pre-rest
    chance test is a 1000-shuffle test of predictions across SWRs. Reproduced when task-to-pre-rest
    is not above chance at p < 0.05, both cross-epoch predictions are below task-to-task at p <
    0.05 by rank-sum, and pre-rest-to-pre-rest exceeds both cross-epoch predictions at p < 0.05.
    Cell counts are reported against expected.
  depends_on:
