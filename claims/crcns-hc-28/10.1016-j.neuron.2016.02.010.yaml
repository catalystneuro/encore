  source: Results, Task-Related CA1-PFC Correlations Are Not Present in Preceding Rest Periods,
    paragraph 2; Figure 8B and 8C
  quote: Similarly, we saw no relationship between pre-rest SWR correlations and either
    movement-related correlations (Figure 8B) or spatial correlations
