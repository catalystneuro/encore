    paragraphs 1 and 2; Figure 7C
  quote: We found that the similarity between the spatial response profiles of the CA1 and PFC
    neurons, quantified as a spatial correlation, was related to their SWR correlation for both ...
    SWR-inhibited and SWR-excited neurons
  statistics:
  - about: SWR-excited pairs
    test: regression test
    statistic: r = 0.2
    p: 0.001
    p_relation: "<"
    n: 393 pairs
  - about: SWR-inhibited pairs
    test: regression test
    statistic: r = 0.36
    p: 0.0001
    p_relation: "<"
    n: 320 pairs
  - about: correlated and anticorrelated against uncorrelated pairs
    test: rank-sum test
    p: 0.0001
    p_relation: "<"
  - about: inhibited stronger than excited
    test: shuffle test, 1000 shuffles
    p: 0.01
    p_relation: "<"
  expected:
  - quantity: r, SWR-excited pairs
    value: 0.2
    tolerance: 0.02
  - quantity: r, SWR-inhibited pairs
    value: 0.36
    tolerance: 0.036
  criterion: Spatial correlation is the Pearson correlation of the two cells' linearized rate maps
    concatenated over the 4 trajectories (SEP; concatenation is the standard reading, the mean of
    per-trajectory correlations a variant). Group difference by the SEP shuffle (mixed
    populations of the same sizes, 1000 times). Reproduced when both r > 0 at p < 0.05, the
    inhibited r exceeds the excited r at p < 0.05 by the shuffle, and the correlated and
    anticorrelated groups differ from uncorrelated as stated at p < 0.05; r by the pooled-value
    rule.
  depends_on:
  - fig6-swr-correlated-pairs
  - fig5c-spatial-coverage
- id: figs5-matched-selectivity
  statement: With PFC cells matched for spatial coverage, excited and inhibited groups show similar
    spatial-SWR correlation relations (r = 0.32 and 0.39, not different).
  source: Figure S5 legend
  quote: Both CA1-PFC excited pairs (n = 203, r = 0.32, p < 10-4) and CA1-PFC inhibited pairs (n =
    203, r = 0.39, p < 10-4) showed significant correlations and these correlations were not
    significantly different from one another
  statistics:
  - about: matched excited pairs
    test: regression test
    statistic: r = 0.32
    p: 0.0001
    p_relation: "<"
    n: 203 pairs
  - about: matched inhibited pairs
    test: regression test
    statistic: r = 0.39
    p: 0.0001
    p_relation: "<"
    n: 203 pairs
  - about: excited against inhibited
    test: shuffle test, 1000 shuffles
    p: 0.18
    p_relation: ">"
  criterion: Only PFC cells whose coverage lies within the interquartile range of SWR-inhibited
    coverage, in both groups (SEP, Figure S5). The legend's n of 203 for both groups suggests a
    subsample of equal size; readings are (a) all pairs within the range, (b) random subsamples
    of the larger group to the size of the smaller. Reproduced when both r > 0 at p < 0.05 and
    the shuffle finds no difference at p < 0.05.
  depends_on:
  - fig7c-spatial-correlation
- id: figs6-replay-content
  statement: The SWR spiking of SWR-modulated PFC neurons is more related to the spatial content of
    CA1 replay than that of unmodulated neurons.
  source: Figure S6B legend; Results, Reactivation in the CA1-PFC Network Reflects Spatially
    Related Ensembles, paragraph 2
  quote: Correlation between the SWR-associated spiking of the PFC neuron and the content of the
    decoded CA1 locations was significantly higher for SWR-modulated neurons
  statistics:
  - test: rank-sum test
    p: 0.01
    p_relation: "<"
    n: 17 SWR-modulated and 21 SWR-unmodulated neurons
  criterion: Bayesian decoding of CA1 spikes in 15 ms bins during SWRs with at least 4 active CA1
    cells, Poisson model, significance by 500 time-bin shuffles at p < 0.05; PFC cells with at
    least 10 significant events; R per cell from the correlation of decoded spatial probability
    and the PFC rate profile on the replayed trajectory (SEP, Replay analysis). How R is formed
    across events (spike count against overlap, as Figure S6A orders the raster) is open;
    readings are (a) Pearson of per-event PFC spike count with per-event overlap, (b) Spearman.
    The replay score is not given; the line-fit score of the cited Karlsson and Frank (2009) is
    the standard choice. Reproduced when modulated exceeds unmodulated at p < 0.05 by rank-sum
    under one reading. The paper notes the small sample; few cells may qualify in the W-track data
    alone.
  depends_on:
  - fig3-pfc-swr-modulation-fractions
- id: fig8a-no-prerest-swr-correlation-relation
  statement: On the W-track, SWR correlations of CA1-PFC pairs in the pre-task rest show no
    relation to their SWR correlations during the task (excited pairs r = 0.08, p = 0.2; inhibited
    r = 0.1, p > 0.1).
  source: Results, Task-Related CA1-PFC Correlations Are Not Present in Preceding Rest Periods,
    paragraph 2; Figure 8A
  quote: Comparing the SWR response correlations between CA1-PFC pairs revealed that there was no
    detectable relationship between awake SWR correlations and SWR correlations in pre-rest
    periods (Figure 8A)
  statistics:
  - about: SWR-excited pairs
    statistic: r = 0.08
    p: 0.2
    n: 219 pairs
  - about: SWR-inhibited pairs
    statistic: r = 0.1
    p: 0.1
    p_relation: ">"
    n: 196 pairs
  expected:
  - quantity: excited pairs recorded in both epochs
    value: 219
    tolerance: 21.9
  - quantity: inhibited pairs recorded in both epochs
    value: 196
    tolerance: 19.6
  criterion: A claim of absence. W-track only, as the paper; cells recorded in both the pre-rest
    and the run epochs of a day, PFC categories from behavior, SWRs in pre-rest detected as in
    behavior (SEP, Task and rest period comparisons). Test is the paper's, the regression (Pearson
    r) test, at p < 0.05. Reproduced when neither group shows a significant relation; r is reported
    either way. Pair counts within tolerance are reported, not required.
  depends_on:
  - fig6-swr-correlated-pairs
- id: fig8bc-no-prerest-theta-spatial-relation
  statement: Pre-rest SWR correlations bear no relation to task theta cross-covariance (r = 0.02 and
