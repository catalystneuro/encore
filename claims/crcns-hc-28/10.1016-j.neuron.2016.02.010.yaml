# Claims for Jadhav, Rothschild, Roumis & Frank (2016), Neuron 90:113-127, on CRCNS data set
# hc-28 (doi:10.6080/K02N50G9).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-08,
# protocol as stated in docs/protocol.md (version pilot-13, Reader).
#
# Text read: the version of record with its Supplemental Information, as supplied under paper/
# (PyMuPDF text of the journal PDF, 43 pages): Results, Discussion, Experimental Procedures, the
# legends of Figures 1 to 8 and S1 to S7, Tables S1 to S3 and the Supplemental Experimental
# Procedures. The extracted text prints minus signs and some symbols as a replacement character,
# so "p < 10-11" appears as "p < 10?11"; such values were read in context. The PDF could not be
# rendered in this run, so no value was read from a figure; values shown only in figures (the
# ensemble-size groups of Figure 6E, the bars of Figures 5F, 6E and 8D) are not recorded.
#
# Code read: none. The paper links no code; it says only that analyses used custom Matlab
# routines. Methods details therefore come from the Experimental Procedures and the
# Supplemental Experimental Procedures, and the details they leave open are named in each
# criterion with the readings the text allows.
#
# Data the paper used. Six male Long Evans rats, three on a W-track spatial alternation task and
# three on a Y-track auditory cue-guided task, 8 to 12 days of training, 2 to 4 run sessions of
# 20 min per day with interleaved 20 to 30 min rest sessions in a rest box; data pooled across
# all sessions within a day. W-track animals ran 2 sessions per day for 8 days (24 days in all,
# Figure S2). Tetrodes (21 per drive) in dorsal CA1 and prelimbic/infralimbic PFC, and in
# intermediate CA1 in two W-track animals; W-track recordings in the right hemisphere. LFP
# 0.5-400 Hz at 1.5 kHz, spikes at 30 kHz, position from overhead camera at 30 fps. Cells
# (Table S1, before the spike criterion) per W-track animal, CA1 / iCA1 subset / PFC: HPa
# 195/54/40, HPb 165/15/80, HPc 86/0/51. After exclusions 536 CA1 and 312 PFC putative excitatory
# cells across all six animals (165 PFC on the W-track, Table S2). The measured variables are
# spike times of clustered units, LFP per tetrode, position and speed, and the task epochs (run
# and rest).
#
# What the data set holds. By its description, CRCNS hc-28 holds the three W-track animals HPa,
# HPb and HPc (spikes, LFP, position, task, tetrode and cell information by day and epoch). The
# Y-track animals are not in it. The data set also serves Tang et al. (2017), whose final 3 days
# alternate novel and familiar environments; this paper uses the 8 days of W-track learning
# (Supplemental Experimental Procedures, Behavioral Tasks), and the author is to keep those days.
# Most of the paper's results pool both tasks. The paper says the two tasks taken separately
# gave consistent results ("analyses applied to the two tasks separately, and with the exclusion
# of intermediate CA1 cells, yielded consistent results (data not shown)", Results, first
# section, paragraph 4). So, for every claim whose numbers pool both tasks, the claim is judged
# on the W-track animals, and the rule is this: the claim is reproduced when its direction and
# its test (as the criterion states) hold in the W-track data and the W-track values fall within
# the tolerances under `expected`; partially reproduced when the direction and test hold but a
# value falls outside its tolerance (the pooled value includes animals the data set lacks);
# not reproduced when the direction or the test fails. Where the paper gives W-track numbers
# (Table S1, Table S2, Figure S2, Figure 8), those are the expected values. Claims of absence
# are judged on the paper's test alone (protocol, Reader step 3).
#
# Methods fixed by the paper and used throughout (Experimental Procedures and Supplemental
# Experimental Procedures; cited as SEP):
# - SWRs. Detected on the ripple band (150-250 Hz) of multiple CA1 tetrodes with a 3 SD power
#   criterion, at speeds below 4 cm/s; SWRs within 1 s of a previously detected SWR are
#   discarded (SEP, SWR Detection). The paper defers the rest to Karlsson and Frank (2009),
#   which is not under paper/. Open, with readings: (a) a crossing on any one CA1 tetrode;
#   (b) on the power averaged or summed over CA1 tetrodes. Minimum duration, envelope smoothing
#   and the definition of onset (first threshold crossing, or the earlier return to the mean)
#   are not given; the author follows Karlsson and Frank (2009) if read, and states the choice.
# - Units. Putative excitatory cells; fast-spiking cells excluded (PFC width < 0.3 ms and rate >
#   17 Hz; CA1 width < 0.3 ms and rate > 7 Hz); cells with fewer than 50 spikes in SWR-aligned
#   rasters on a day excluded (SEP, SWR Modulation). Open, with readings: the unit of analysis is
#   (a) a cell on one day, sessions pooled within the day (the paper's counts are per day:
#   "Data were pooled across all sessions within a day", and the spike criterion is per day);
#   (b) a unique unit across days. Reading (a) is the paper's best-supported reading. The span
#   of the SWR-aligned raster is not given; readings -500 to +500 ms (the background window
#   starts at -500 ms) and -1 to +1 s (SWRs are 1 s apart).
# - Awake SWRs are those in run epochs of the W-track task; pre-rest is the rest-box epoch
#   before the day's first run (SEP, Task and rest period comparisons).
# - SWR modulation. Per cell, the SWR-PSTH; 5000 shuffles, each circularly jittering the spikes
#   around each SWR by one random amount; modulation measure = squared difference between real
#   PSTH and mean shuffled PSTH in 0-200 ms; modulated when it exceeds 95% of the shuffled
#   measures; excited or inhibited by the rate in 0-200 ms against -500 to -100 ms (SEP, SWR
#   Modulation). Open, with readings: PSTH bin 10 ms (a standard choice); jitter range uniform
#   over the raster span.
# - Theta. 6-12 Hz in LFP downsampled to 150 Hz, phase from a CA1 tetrode in corpus callosum;
#   theta periods at speed > 5 cm/s with no SWR on any CA1 tetrode (3 SD); cells with >= 50
#   spikes; Rayleigh test p < 0.05; kappa from a von Mises fit (SEP, Theta Phase Locking). The
#   filter and the phase estimator are not given; a zero-phase band-pass and the Hilbert phase
#   are standard choices.
# - Theta cross-covariance. Theta periods >= 1 s; 10 ms bins; expected coincidences subtracted
#   from the mean rates; standardized by the mean rates, bin size and total theta time; smoothed
#   with a Gaussian of 50 ms length and SD 16.7 ms; peak taken within -200 to +200 ms (SEP, SWR
#   Correlations and Theta Cross-covariance). The exact normalization cites Siapas et al. (2005).
#   Readings: (a) (CCG - r1 r2 B T) / sqrt(r1 r2 B T), a Poisson z-score, which the words
#   "standardized (or Z-scored)" suggest; (b) (CCG - r1 r2 B T) / (r1 r2 B T).
# - SWR correlation of a CA1-PFC pair. Correlation coefficient across SWRs of the spike counts in
#   0-200 ms after onset; only pairs with at least 5 SWRs in which both cells spiked (n = 713
#   pairs) (SEP). Open, with readings: (a) Pearson over all SWRs of the day; (b) Pearson over the
#   SWRs in which both cells spiked; Spearman shown as a variant. Pair significance p < 0.05.
# - Spatial maps. Occupancy-normalized linearized rates on the 4 W-track trajectories; coverage
#   is the fraction of the area above 25% of the peak rate over all 4 trajectories, for cells
#   with peak > 3 Hz (SEP, Spatial and Behavioral Coding Properties). Bin size, smoothing and any
#   speed filter are not given; 2 cm bins, no smoothing beyond the paper's, and speed > 5 cm/s
#   (the paper's movement criterion) are standard choices, shown with no speed filter as a
#   variant.
# - Tests. Nonparametric throughout unless noted ("rank-sum" is Wilcoxon rank-sum); values are
#   mean +- SEM; for comparisons among SWR-excited, SWR-inhibited and SWR-unmodulated cells the
#   threshold is p < 0.01 (SEP, Data Analysis).
