- id: dataset-size
  statement: The unlabeled set has 282 videos and about 6 million frames; the dataset holds over
    1 million annotated frames, over 70 hours of tracked poses and over 10 hours of frame-by-frame
    annotation.
  source: Abstract; Section 3; Figure 4A; Section 5 (Discussion), paragraphs 1 and 3
  quote: The dataset consists of 6 million frames of unlabeled tracked poses of interacting mice, as
    well as over 1 million frames with tracked poses ... The released data include over 70 hours of
    tracked poses from pairs of mice, and over 10 hours of manual, frame-by-frame annotation ...
    unlabeled trajectory data from 282 videos
  data: elsewhere
  where: CaltechDATA doi:10.22002/D1.1991 (record s0vdx-0k302, version 1.0)
  expected:
  - {quantity: unlabeled sequences, value: 282, tolerance: 0}
  - {quantity: unlabeled frames, value: 6000000, tolerance: 600000}
  criterion: Unlabeled frames are counted from the scores of each sequence. The statements "over"
    a value are read (a) over Task 1 only (training and test), (b) over all labelled sets of the
    three tasks, and (c) as (b) with sequences deposited more than once counted once; tracked
    poses add the unlabeled set to each reading. Hours are frames / 30 / 3600. Reproduced when the
    two expected values hold and each of the three "over" statements holds under at least one
    reading; partially reproduced when only some of these hold; not reproduced when none does.
- id: table10-task3-difficulty
  statement: On Task 3, classifier performance depends on the percentage of frames in which a
    behavior is observed and on its average bout duration, with shorter bouts giving lower
    performance.
  source: Section 4.4, paragraph 2; Tables 7 and 10
  quote: We found classifier performance to depend both on the percentage of frames during which a
    behavior was observed, and on the average duration of a behavior bout, with shorter bouts having
    lower classifier performance.
  data: elsewhere
  where: CaltechDATA doi:10.22002/D1.1991 (record s0vdx-0k302, version 1.0)
  criterion: Across the seven behaviors, Spearman correlations of the baseline model's F1 score
    in Table 10 with (i) the percentage of frames labelled with the behavior and (ii) its mean
    bout length (runs of consecutive labelled frames), computed from the data on (a) the training
    split or (b) the test split. Reproduced when, under one reading, both correlations are
    positive with a one-sided exact permutation p below 0.05; partially reproduced when both are
    positive under one reading but not both significant; not reproduced otherwise. The F1 of the
    baseline with task programming features is shown as a variant.
