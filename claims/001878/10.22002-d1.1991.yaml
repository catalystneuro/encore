# Claims for the CalMS21 dataset (Sun et al. 2021) on dandiset 001878.
#
# The target's DOI, 10.22002/D1.1991, is the CaltechDATA record of the dataset, not a paper. The
# paper that describes the dataset and is cited by that record is Sun, Karigo, Chakraborty,
# Mohanty, Wild, Sun, Chen, Anderson, Perona, Yue and Kennedy (2021), "The Multi-Agent Behavior
# Dataset: Mouse Dyadic Social Interactions", NeurIPS 2021 Datasets and Benchmarks track,
# arXiv:2104.02710v4. Its full text is open access and was used, including the appendix with the
# datasheet (Appendix B), the data format (C), the dataset preparation (D) and the results tables.
#
# Dandiset 001878 is a collection of conversions from three source datasets. It holds one CalMS21
# sequence, the Task 1 test sequence mouse071 (pose, annotations as bouts, and the video). The rest
# of CalMS21 is public on CaltechDATA (record s0vdx-0k302, version 1.0), so the claims about the
# dataset as a whole are `data: elsewhere` and are tested on those files.
#
# When these criteria were written, the author had seen: the dandiset's file list and metadata;
# every object of the CalMS21 NWB file and the values of its data check (14 keypoint series at 30
# Hz, positions within the image, every confidence value NaN, bouts that tile the session with the
# labels investigation, other and mount and no attack, the derived speed and distance series);
# the frame count, rate and size of its video; the list of members of the CaltechDATA zips, and the
# sequence keys of the Task 1 files (70 train and 19 test sequences, mouse071 the first test
# sequence) with the frame counts and metadata of three test sequences. No claim's analysis had
# been run otherwise: no comparison of the dandiset's sequence with CaltechDATA, no counts or label
# fractions of any set, no analysis of pose errors, contact or coat colour.
#
# The code the paper links for its baselines (gitlab.aicrowd.com/aicrowd/research/mab-e/
# mab-e-baselines) did not answer from here, and no copy of it was found in Software Heritage or on
# GitHub; the web archive holds its landing page only. The task programming code (GitHub
# neuroethology/TREBA) is public. The code of the challenge's top entries is not linked.
# Quotes added 2026-10-19 from the full text (arXiv:2104.02710v4, ar5iv HTML rendering; figure and
# table numbers as in the v4 PDF). The paper reports no statistical tests or confidence intervals
# for these claims.
schema_version: 1
dandiset: "001878"
paper: doi:10.22002/d1.1991
claims:
- id: format-keypoints
  statement: Each frame holds seven MARS keypoints (nose, left ear, right ear, neck, left hip,
    right hip, tail base) for each of two mice, the resident (mouse 0) and the intruder (mouse 1),
    in pixel coordinates of a 1024 x 570 image, at 30 Hz, with a confidence score from 0 to 1 for
    each keypoint.
  source: Section 3 and Figure 3; Appendix C (data format), paragraph 4; Appendix D.1
  quote: mouse 0 is the resident and mouse 1 is the intruder), image (x,y) coordinates in pixels,
    and keypoint ID. For keypoint ID, there are seven tracked body parts, ordered (nose, left ear,
    right ear, neck, left hip, right hip, tail base).
  criterion: Judged on the dandiset's CalMS21 file. Reproduced when it holds 14 keypoint series
    named for these seven parts on the resident and the intruder, in pixels, sampled at 30 Hz,
    with every coordinate within 0 to 1024 (x) and 0 to 570 (y), and a confidence value for each
    keypoint and frame within 0 to 1. Partially reproduced when the positions meet all of this but
    the confidence values are missing or out of range. Not reproduced otherwise.
- id: resident-is-black
  statement: Mouse 0, the resident, is the black C57Bl/6J mouse, and mouse 1, the intruder, is
    the white BALB/c mouse.
  source: Appendix C; Appendix B (Collection Process); Appendix D.1
  quote: In this assay, a black (C57Bl/6J) male "resident" mouse is filmed in its home cage, and a
    white (BALB/c) male or female "intruder" mouse is manually introduced to the cage ... mouse 0 is
    the resident and mouse 1 is the intruder
  criterion: On the dandiset's video and pose. Every 30th frame, the mean grey level of the video
    in a patch of 12 x 12 pixels centred on each mouse's body centre (the mean of its neck and two
    hip keypoints), using frames where the two body centres are at least 60 pixels apart.
    Reproduced when the resident's patch is darker than the intruder's in at least 90% of these
    frames; partially reproduced for 50% to 90%; not reproduced below 50%.
- id: task1-vocab
  statement: Task 1 frames are annotated by one annotator (annotator id 0) with exactly one label
    per frame from the vocabulary attack 0, investigation 1, mount 2 and other 3.
  source: Section 3; Appendix C (metadata and vocab)
  quote: "In Tasks 1 and 2, each frame is assigned one label ... In Task 1, GROUPNAME is
    annotator_id-0 ... and there is only one GROUP in the file. ... For example, in Task 1 vocab is
    attack: 0, investigation: 1, mount: 2, other: 3."
  criterion: On the dandiset's CalMS21 file. Reproduced when its catalogue of behaviors holds
    these four names with these integer codes, the annotator is given as 0, and the bouts give
    exactly one label to every frame of the session (no frame uncovered, none covered twice).
    Partially reproduced when the names and codes hold but the annotator or the one-label rule
    does not. Not reproduced when the names or codes differ.
- id: task1-video
  statement: The source videos of Task 1 are released, recorded at 30 Hz and 1024 x 570 pixels.
  source: Section 3.1, paragraph 3; Appendix D.1
  quote: In addition to pose data, we also release all source videos for Task 1 ... Videos are
    acquired at 30 fps and 1024x570 pixel resolution
  criterion: On the dandiset's video of mouse071. Reproduced when it is 1024 x 570 pixels at 30
    frames per second and has as many frames as the pose. Partially reproduced when it is
    present but one of the three differs; not reproduced when it is absent or unreadable.
- id: contact-during-social-behaviors
  statement: Close investigation, attack and mount are behaviors in which the resident is in
    close contact with the intruder; other frames include the animals apart.
  source: Appendix D.2 (behavior definitions)
  quote: "Close investigation: resident (black) mouse is in close contact with the intruder (white)
    and is actively sniffing the intruder anywhere on its body or tail. ... animals may be apart
    from each other exploring other parts of the arena"
  criterion: On the dandiset's pose and bouts. Per frame, the distance from the resident's nose
    to the nearest intruder keypoint. Reproduced when, for each social label present in the
    session, the median distance in its frames is below the median in "other" frames, with a 95%
    moving-block bootstrap interval (blocks of 300 frames, 2000 resamples) of the difference that
    excludes 0. Partially reproduced when this holds for some labels only. A label with no frames
    in the session is reported as untested.
- id: pose-errors-close-fast
  statement: Errors in pose estimation are most common on frames when the two animals are in
    close contact or moving very quickly.
  source: Appendix B (Composition, errors and noise)
  quote: some errors in pose estimation and noise in keypoint placement still occur. These are most
    common on frames when the two animals are in close contact or moving very quickly.
  criterion: On the dandiset's pose alone, as it holds no usable confidence values. A frame is
    counted as a pose error when any of four body lengths of either mouse (nose to neck, neck to
    tail base, left to right ear, left to right hip) lies outside the session's quartiles widened
    by 3 times the interquartile range. Close frames are the lowest 10% of the distance between
    the two mice's centroids; fast frames are the highest 10% of the faster mouse's centroid speed
    after a 15-frame running median. Reproduced when the error fraction is higher in close frames
    than in the others and higher in fast frames than in the others, each with a 95% moving-block
    bootstrap interval (blocks of 300 frames, 2000 resamples) of the difference that excludes 0.
    Partially reproduced when this holds for one of the two. Thresholds of 5% and 20%, and a
    factor of 1.5, are shown as variants.
- id: link-mouse071
  statement: The dandiset's CalMS21 sequence is the CalMS21 Task 1 test sequence mouse071, with
    the same keypoints, confidence scores and frame annotations.
  source: Appendix C; CaltechDATA record 10.22002/D1.1991, file task1_classic_classification.zip
  data: with_inputs
  criterion: Records are matched by name (session mouse071_task1 against the key
    task1/test/mouse071_task1_annotator1). Reproduced when the frame counts are equal, every
    keypoint coordinate agrees within 0.001 pixel with mice, parts and axes in the stated order,
    and the frame labels from the bouts agree with the CaltechDATA annotations (through the
    catalogue's codes) on every frame. Partially reproduced when at least 99% of coordinates and
    of frames agree. Not reproduced otherwise. The confidence scores are compared and reported;
    the dandiset's are known to be empty (data check), which is recorded under format-keypoints
    and as a finding, and does not decide the link.
- id: pose-errors-close-fast-confidence
  statement: Errors in pose estimation are most common on frames when the two animals are in
    close contact or moving very quickly, as shown by the MARS confidence scores.
  source: Appendix B (Composition, errors and noise)
  quote: some errors in pose estimation and noise in keypoint placement still occur. These are most
    common on frames when the two animals are in close contact or moving very quickly.
  data: with_inputs
  depends_on:
  - link-mouse071
  criterion: The confidence scores come from CaltechDATA's copy of mouse071, matched frame by
    frame; positions, distances and speeds come from the dandiset. Per frame, the mean confidence
    over the 14 keypoints. Close and fast frames as in pose-errors-close-fast. Reproduced when the
    median confidence is lower in close frames than in the others and lower in fast frames than in
    the others, each with a 95% moving-block bootstrap interval (blocks of 300 frames, 2000
    resamples) that excludes 0; partially reproduced when this holds for one of the two.
