# Claims for The MICrONS Consortium (2025), "Functional connectomics spanning multiple areas of mouse
# visual cortex", Nature 640, 435-447, doi:10.1038/s41586-025-08790-w, on dandiset 000402 ("MICrONS
# Two Photon Functional Imaging").
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23, protocol
# pilot-10 as stated in docs/protocol.md (Reader, steps 1 to 4).
#
# Text read: the version of record, open access (CC BY), as served by Europe PMC (PMC11981939),
# in paper/10.1038-s41586-025-08790-w.txt: main text, figure legends, Methods, the legends of
# Extended Data Figs 1 to 5 and the captions of Extended Data Tables 1 to 3. The supplementary
# information is a Reporting Summary and a Peer Review File; no result rests on them. The text holds
# only the captions of the Extended Data Tables, not their cells, and no PDF is under paper/, so the
# per-scan parameters of Extended Data Table 1 (planes, depths, frame rate and field sizes of each
# scan) were not read. The Methods give these parameters by group of scans, and the claims use
# those.
#
# Code read: https://github.com/AllenInstitute/MicronsFunctionalConnectomics at commit
# be24e51bd7090e9fb32a9099b4e0c6025342629b (2025-02-23), the repository of the Code availability
# statement. It holds notebooks for Fig. 3f (oracle rasters; get_data.ipynb, make_plot.ipynb), Fig.
# 3g (Monet2 direction rasters), Fig. 6k (oracle responses of the example cell and its
# co-registered targets), Fig. 7a to 7c (connectivity by soma depth, with the edge list it plotted,
# Fig 7/Fig7abc/edgelist.csv) and Fig. 7d (L3a order 1 and order 2 heat maps, from two csv files).
# The notebooks read the functional data from the DataJoint schema microns_phase3_nda and the EM
# tables from CAVE (minnie65_phase3_v1 or minnie65_public, materialization version 1181). The
# oracle score and the direction tuning fits are read from precomputed DataJoint tables
# (nda.Oracle, field pearson; pipeline_radtune.VonFit), whose code is not in this repository. The
# imaging pipeline the Methods cite (https://github.com/cajal/pipeline) was not read; no commit is
# given for it. No code is given for the counts of the Results (masks, scans, matches, synapses,
# proofreading).
#
# Data the paper used, as it reports them. One male mouse (Slc17a7-Cre x Ai162, GCaMP6s in
# excitatory neurons), 65 days old at the start of the experiments. 2P calcium imaging with a
# random access mesoscope (2P-RAM): 14 scans of 19 completed, over 6 days, P75 to P81 by the main
# text (the Methods timeline gives imaging from 4 March 2018, P75, to 9 March 2018, P80). The
# volume is about 1,200 x 1,100 x 500 um (anteroposterior x mediolateral x depth), layers 2 to 5,
# at the junction of VISp, VISlm, VISrl and VISal. 11 scans at 6.3 Hz with 4 depths, 2 scans at
# 8.6 Hz with 3 depths, 1 scan at 9.6 Hz with 2 depths. Somas segmented by constrained NMF in
# CaImAn, traces deconvolved; a classifier keeps somatic masks. Each scan has about 84 min of
# stimulus (natural videos in three categories, cinematic, Sports-1M and rendered; and the
# parametric Monet2 and Trippy), shown to the left eye, plus periods of monitor on and monitor off
# for spontaneous activity. Treadmill velocity (rotary encoder, about 57 to 100 Hz), and video of
# the left eye (about 20 Hz) giving pupil position and diameter. A structural 2P stack (green and
# red, 1,412 x 1,322 x 670 um at 0.5 pixels per um) taken after Texas Red injection is used to
# register the scan fields; visual area labels come from a retinotopic sign map transformed into
# the stack. The dandiset's description says it holds the 2P functional imaging, treadmill, eye
# and pupil data, with the EM identifiers of matched cells as plane segmentation columns taken from
# CAVE.
#
# The EM half of the paper (sectioning, alignment, segmentation, synapses, nuclei, proofreading,
# cell classes, connectivity) uses data the dandiset does not hold. The paper deposits them at
# MICrONS Explorer (https://www.microns-explorer.org/cortical-mm3) and BossDB
# (https://bossdb.org/project/microns-minnie), with annotation tables served by CAVE. The paper
# names no materialization version for its counts; its code uses version 1181, and the Results
# date the proofreading edits to 16 September 2024. Those claims are data elsewhere. Claims that
# use the co-registration tables (CAVE coregistration_manual_v4 and the automatch tables) with the
# functional data are with_inputs; whether the dandiset's own plane segmentation columns carry the
# same matches is the author's to find.
#
# Inconsistencies in the text, recorded here and not resolved. The fiducials are 2,934 in total
# but 1,994 somata plus 942 vessels make 2,936. The Methods timeline puts the structural stack (21
# March 2018, labelled P83) after the perfusion (16 March 2018, P87). Against the birth date of 19
# December 2017 the perfusion date and age agree, but 21 March 2018 is P92 and P83 is 12 March 2018;
# the main text puts the stack on the last day of imaging (9 March 2018, P80). Imaging ends at P80
# in the timeline and P81 in the main text.
schema_version: 2
dataset:
  archive: dandi
  id: "000402"
paper: doi:10.1038/s41586-025-08790-w
claims:
- id: scans-14-p75-p81
  statement: The calcium imaging data comprise 14 scans of one mouse, collected between P75 and P81,
    spanning a volume of about 1,200 x 1,100 x 500 um.
  source: Results, 2P calcium imaging, paragraph 1; Methods, 2P functional imaging
  quote: The dataset contains 14 individual scans, collected between postnatal day 75 (P75) and P81,
    spanning a volume of approximately 1,200 × 1,100 × 500 µm 3
  expected:
  - quantity: number of scans
    value: 14
    tolerance: 0
    unit: scans
  criterion: Count the distinct scans (session and scan index) and the distinct days on which they
    were recorded. The scan count is exact, as it is a count of files the paper lists. The ages are
    judged from the recording dates against the birth date of 19 December 2017 (Methods,
    Timeline); P75 to P81 (main text) and P75 to P80 (Methods timeline) are both readings the paper
    allows, and the claim holds when the dates fall within P75 to P81. The 6 days are the days of
    imaging of the 19 completed scans (Methods, 2P functional imaging); the 14 kept scans may span
    fewer, so a count of 6 or fewer days is consistent with the paper.
- id: scan-configurations
  statement: Eleven scans were imaged at 6.3 Hz with four depths (eight fields), two at 8.6 Hz with
    three depths (six fields) and one at 9.6 Hz with two depths (four fields); in the 11 scans the
    four planes span roughly 300 to 400 um.
  source: Methods, 2P functional imaging, paragraph 1; Results, 2P calcium imaging, paragraph 2
  quote: For 11 scans, imaging was performed at 6.3 Hz, collecting eight 620 × 1,100 μm fields per
    frame ... For 2 scans, imaging was performed at 8.6 Hz, collecting six 620 × 1,100 μm fields per
    frame ... For 1 scan, imaging was performed at 9.6 Hz, collecting four 620 × 1,000 μm fields per
    frame
  expected:
  - quantity: scans at 6.3 Hz with 4 depths
    value: 11
    tolerance: 0
    unit: scans
  - quantity: scans at 8.6 Hz with 3 depths
    value: 2
    tolerance: 0
    unit: scans
  - quantity: scans at 9.6 Hz with 2 depths
    value: 1
    tolerance: 0
    unit: scans
  - quantity: depth span of the four planes in the 11 four-depth scans
    value: 355
    tolerance: 85
    unit: um
  criterion: Per scan, the imaging rate, the number of fields and of distinct depths, from the
    dataset's imaging metadata. A scan matches a group when its rate is within 0.1 Hz of the
    group's (a standard choice, as the rates are printed to one decimal) and its number of depths is
    the group's; a field is one 620 um wide strip, and two fields per depth tile the field of view
    (Methods). The counts are exact. The depth span is the range from 300 to 400 um widened by 10%
    of each bound (270 to 440 um), as the protocol sets for a range. The paper does not say whether
    the range bounds every scan or describes the typical scan; the readings are (a) the span of each
    of the 11 scans lies in 270 to 440 um; (b) the median span of the 11 scans does.
- id: masks-125413-somatic-115372
  statement: In total 125,413 masks were segmented across the 14 scans, of which 115,372 were
    classified as somatic by a trained classifier (8.1% excluded).
  source: Results, 2P calcium imaging, paragraph 2; Methods, 2P functional imaging, paragraph 3
  quote: In total, 125,413 masks were generated across 14 scans, of which 115,372 were automatically
    classified as somatic masks by a trained classifier
  expected:
  - quantity: masks across 14 scans
    value: 125413
    tolerance: 12541
    unit: masks
  - quantity: somatic masks
    value: 115372
    tolerance: 11537
    unit: masks
  - quantity: fraction of masks excluded by the classifier
    value: 8.1
    tolerance: 0.81
    unit: percent
  criterion: Count all segmented masks (units) over the 14 scans, and those the dataset marks as
    somatic. The paper does not say whether the dataset holds the non-somatic masks. The readings
    are (a) the dataset holds all masks with a somatic label, and both counts are tested; (b) it
    holds only the somatic masks, and only the 115,372 is tested, the total being untestable. The
    Methods' 8.1% does not equal 1 - 115,372/125,413 (8.0%); both are within the tolerance.
- id: unique-neurons-75909
  statement: Consolidating masks imaged in more than one scan by their 3D position in the structural
    stack gives an estimated 75,909 unique functionally imaged neurons.
  source: Results, 2P calcium imaging, paragraph 4; Methods, 2P structural stack, paragraph 2
  quote: we estimate the functional imaging volume contains 75,909 unique functionally imaged neurons
    consolidated from 115,372 segmented somatic masks, with many neurons imaged in 2 or more scans
  expected:
    quantity: unique functionally imaged neurons
    value: 75909
    tolerance: 7591
    unit: neurons
  depends_on:
  - masks-125413-somatic-115372
  criterion: The method is from the Methods (2P structural stack). Each scan field is registered into
    the structural stack and each somatic mask gets a 3D centroid; the closest 2 cells from
    different scans are grouped, iteratively, until all pairs are at least 10 um apart or a further
    join produces a mask taller than 20 um in z. The paper does not say how the height of a group
    is measured. The readings are (a) the range in z of the centroids in the group; (b) that range
    plus the z extent of one field's mask. It also does not say whether distances to a group are
    taken from its mean centroid or from its nearest member; the readings are (i) mean centroid,
    (ii) nearest member. The count is judged under each combination. If the dataset holds no stack
    coordinates for the masks, the claim cannot be tested from it.
- id: area-split-half-visp
  statement: The imaging volume is roughly 50% VISp and 50% higher visual areas (VISlm, VISrl and
    VISal), with each functional unit assigned an area from its position in the stack.
  source: Methods, Imaging site selection, paragraph 1; Methods, 2P structural stack, paragraph 3;
    Fig. 3a,d
  quote: This resulted in an imaging volume that was roughly 50% VISp and 50% higher visual area (HVA)
  expected:
    quantity: share of unique neurons in VISp
    value: 50
    tolerance: 15
    unit: percent
  criterion: The share of units labelled VISp among units with an area label. The paper's "roughly"
    gives no bound; 15 percentage points is set here, as 10% of 50 would read "roughly" more
    narrowly than the word allows. The paper does not say whether the share is of volume or of
    neurons, or which units count. The readings are (a) all somatic masks over the 14 scans; (b) one
    per unique neuron, when the dataset identifies them; (c) the area of the field of view. The
    claim holds when one reading is within the tolerance.
- id: z-drift-under-10um
  statement: All scans drifted less than 10 um in z over the recording, and most less than 5 um.
  source: Methods, 2P structural stack, paragraph 2
  quote: All scans had less than 10-μm drift over the 1.5-h recording, and for most of them drift was
    limited to <5 μm
  expected:
  - quantity: scans with z drift below 10 um
    value: 14
    tolerance: 0
    unit: scans
  criterion: The Methods say drift was found by sequential registration of sections of each scan into
    the structural stack; the length of a section and the registration of each are not given. The
    readings are (a) consecutive blocks of about 10 min (the stimulus blocks); (b) the two halves of
    the scan (the stimulus repeats one in each half). Drift is the range of the registered z of a
    field over the sections. Reproduced when every scan's drift is below 10 um and more than half
    of the scans are below 5 um, under one reading. If the dataset holds neither the stack nor the
    raw frames, the claim cannot be tested from it.
- id: structural-stack
  statement: A two-channel structural stack (green GCaMP and red vasculature) of 1,412 x 1,322 x 670
    um at 0.5 pixels per um was collected after Texas Red injection.
  source: Results, 2P calcium imaging, paragraph 3; Methods, 2P structural stack, paragraph 1
  quote: a 2-channel (green, red) 1,412 × 1,322 × 670 μm 3 (anteroposterior × mediolateral × radial
    depth) structural stack was collected at 0.5 pixels per μm
  expected:
  - quantity: stack extent, anteroposterior
    value: 1412
    tolerance: 141
    unit: um
  - quantity: stack extent, mediolateral
    value: 1322
    tolerance: 132
    unit: um
  - quantity: stack extent, depth
    value: 670
    tolerance: 67
    unit: um
  - quantity: resolution
    value: 0.5
    tolerance: 0.05
    unit: pixels per um
  criterion: Reproduced when the dataset holds the stack with two channels and its extent and
    resolution are within tolerance; the extent is the number of voxels divided by the resolution.
- id: stimulus-composition
  statement: Each scan's stimulus lasted about 84 min and was made of 6 oracle clips of 10 s repeated
    10 times (10 min), 144 unique natural clips of 10 s (24 min), 90 natural clips of 10 s shown
    twice (30 min), and 20 Trippy and 20 Monet2 seeds of 15 s each shown twice (10 min each).
  source: Methods, Stimulus composition; Results, Behavioural tracking and visual stimulation,
    paragraph 1
  quote: Each scan stimulus was approximately 84 min in duration and comprised
  expected:
  - quantity: total stimulus duration per scan
    value: 84
    tolerance: 8.4
    unit: min
  - quantity: oracle clips
    value: 6
    tolerance: 0
    unit: clips
  - quantity: repeats of each oracle clip
    value: 10
    tolerance: 0
    unit: repeats
  - quantity: unique natural clips per scan
    value: 144
    tolerance: 0
    unit: clips
  - quantity: natural clips shown twice
    value: 90
    tolerance: 0
    unit: clips
  - quantity: Trippy seeds per scan
    value: 20
    tolerance: 0
    unit: seeds
  - quantity: Monet2 seeds per scan
    value: 20
    tolerance: 0
    unit: seeds
  criterion: Per scan, from the stimulus table, count the clips of each class and their repeats and
    sum the durations of the stimulus presentations. Counts are exact; the duration is the
    sum of trial durations (readings (a) trial start to trial end, as the stimulus table gives;
    (b) the nominal 10 s or 15 s per trial). Reproduced when all 14 scans match. The share of
    clips in each natural category (2 oracle, 48 unique and 30 repeated clips per category) is
    tested when the dataset names the category.
- id: stimulus-conserved-across-scans
  statement: The oracle clips, the 90 twice-repeated clips and 10 of the 20 seeds of each parametric
    stimulus were the same in every scan; the 144 unique clips and the other 10 seeds differed
    between scans.
  source: Methods, Stimulus composition; Results, Behavioural tracking and visual stimulation,
    paragraph 2
  quote: The stimulus composition included a mixture of unique stimuli for each scan, some that were
    repeated across every scan, and some that were repeated within each scan
  depends_on:
  - stimulus-composition
  criterion: Clips and seeds are identified by the stimulus identifiers the dataset gives (a condition
    hash, clip name or seed). Reproduced when the 6 oracle clips and 90 repeated clips occur in all
    14 scans, 10 Monet2 and 10 Trippy seeds occur in all 14 scans, and the remaining clips and seeds
    each occur in one scan only. If the dataset gives no identifier for clips, the claim cannot be
    tested from it.
- id: oracle-same-order
  statement: The six oracle clips were repeated in the same order ten times per scan.
  source: Results, Behavioural tracking and visual stimulation, paragraph 2
  quote: 6 natural film stimuli clips totalling 1 min (oracle natural videos) were repeated in the same
    order 10 times per scan
  depends_on:
  - stimulus-composition
  criterion: Per scan, find the 6 clips shown 10 times. The paper's code (Fig 3/panel_f/get_data.ipynb)
    takes each repeat as the 6 trials that follow the first oracle clip's onset in trial order.
    Reproduced when, in every scan, each of the 10 repeats shows the same 6 clips consecutively and
    in the same order.
- id: spontaneous-periods
  statement: Each scan was preceded by 0.15 to 5.5 min with the monitor on and followed by 8.3 to 21.2
    min with the monitor off, to record spontaneous activity.
  source: Methods, Stimulus composition, last paragraph
  quote: Each scan was also preceded by 0.15–5.5 min with the monitor on, and followed by 8.3–21.2 min
    with the monitor off, in order to collect spontaneous neural activity
  expected:
  - quantity: monitor-on period before the stimulus, lower bound of the range over scans
    value: 0.15
    tolerance: 0.015
    unit: min
  - quantity: monitor-on period before the stimulus, upper bound of the range over scans
    value: 5.5
    tolerance: 0.55
    unit: min
  - quantity: monitor-off period after the stimulus, lower bound of the range over scans
    value: 8.3
    tolerance: 0.83
    unit: min
  - quantity: monitor-off period after the stimulus, upper bound of the range over scans
    value: 21.2
    tolerance: 2.12
    unit: min
  criterion: Per scan, the time from the first imaging frame to the first stimulus onset, and from the
    last stimulus offset to the last imaging frame. Reproduced when every scan's values fall in
    the reported ranges widened by 10% of each bound (0.135 to 6.05 min and 7.47 to 23.32 min).
- id: monet2-directions
  statement: Each 15 s Monet2 block holds 16 equal periods of motion, one for each of 16 directions
    between 0 and 360 degrees, at 42.8 degrees per second.
  source: Methods, Global directional parametric stimulus; Fig. 3g legend
  quote: Each 15-s block consisted of 16 equal periods of motion along one of 16 unique directions of
    motion between 0–360° with a velocity of 42.8° s −1 at the nearest point on the monitor
  expected:
  - quantity: directions per Monet2 block
    value: 16
    tolerance: 0
    unit: directions
  - quantity: duration of one direction period
    value: 937.5
    tolerance: 93.75
    unit: ms
  criterion: From the Monet2 trial table (directions and onsets per trial, as the code reads them in
    Fig 3/panel_g/get_data.ipynb). Reproduced when every Monet2 trial has 16 distinct directions
    in 0 to 360 degrees and periods within tolerance of 15 s / 16; the Fig. 3g legend gives 937 ms.
    The paper says the directions are unique, not that they are evenly spaced, so the spacing is
    reported and is not part of the outcome.
    The speed is checked only if the dataset gives it.
- id: fig3f-oracle-reliability
  statement: Neurons differ in how reliably they respond to the repeated oracle clips; units with high
    oracle scores give repeat-to-repeat responses that are consistent, and units with low scores do
    not.
  source: Fig. 3f; Results, Behavioural tracking and visual stimulation, paragraph 2; Methods, Oracle
    score
  quote: Raster of deconvolved calcium activity for three neurons to repeated stimulus trials (oracle
    trials; ten repeats of six sequential clips, with each repeat normalized independently). Rasters
    for high (top), medium (middle) and low (bottom) oracle scores
  depends_on:
  - oracle-same-order
  criterion: The oracle score is, per unit, the jackknife mean of correlations between each oracle
    trial and the mean of the remaining trials (Methods, Oracle score), on the deconvolved trace
    interpolated at the scan's frame rate onto the oracle frames, with the unit's ms delay added to
    its frame times (code, Fig 3/panel_f/get_data.ipynb). The paper's code reads the score from a
    precomputed table, so the unit of a trial is open. The readings are (a) one trial is one
    repeat of the 6 clips, concatenated (10 trials); (b) each clip is scored apart over its 10
    repeats, and the 6 scores are averaged. Units at the 99th, 79th and 34th percentiles of the
    score (the code's choices for the figure) are selected and their rasters shown. The paper's
    measure of repeat-to-repeat consistency is the oracle score itself (Results, paragraph 2;
    Methods, Oracle score), and it gives no other measure or test. Reproduced when, under both
    readings, the score can be computed for the units of the 14 scans and the scores of the three
    selected units are increasing from the 34th to the 99th percentile with the 99th percentile
    unit's score above 0, so that consistent and inconsistent units both occur. The mean pairwise
    Pearson correlation between single repeats of the 100 units nearest each percentile is shown as
    a variant; that measure is set here and is not the basis of the outcome.
- id: fig3g-direction-tuning
  statement: Monet2 drives direction-tuned responses; neurons can be found preferring each of the 16
    directions, and their trial-averaged responses peak at their preferred direction.
  source: Fig. 3g; Results, Behavioural tracking and visual stimulation, paragraph 2
  quote: Trial-averaged raster (central 500 ms of trial-average raster for each direction, out of 937
    ms) of deconvolved calcium activity for 80 neurons in 40 Monet2 trials (16 randomly ordered
    directions) grouped by preferred direction (5 neurons per direction
  depends_on:
  - monet2-directions
  criterion: From the code (Fig 3/panel_g/get_data.ipynb). Per unit, the deconvolved trace is
    interpolated, with its ms delay, at 6.3 Hz over each direction period less (15/16 - 0.5)/2 s at
    each end (the central 500 ms), and averaged over the 40 Monet2 trials. The code takes the
    preferred direction from a von Mises fit (pipeline_radtune.VonFit, method 3, direction) and the
    5 units per direction bin with the highest von_pred_adv, among units in nda.ScanInclude; the fit
    is not described in the paper and its code is not in the repository. The readings are (a) the
    preferred direction is the direction with the highest mean response over the central window;
    (b) the peak of a von Mises function fitted to the 16 mean responses. Reproduced when, under
    both readings, every one of the 16 directions is preferred by at least 5 units (the figure's 5
    per direction). The paper gives no measure or test of tuning strength. Two choices set here, not
    from the paper, that do not decide the outcome, are the following. The 5 units shown per direction are those with
    the highest ratio of the response at the preferred direction to the mean over all directions;
    and a split-half check (preferred direction from the first 20 trials, response from the last
    20) of whether their response at the preferred direction exceeds the mean at the other 15 is
    shown as a variant.
- id: behaviour-recorded
  statement: Treadmill velocity, and the pupil position and diameter from video of the left eye, were
    recorded throughout each scan.
  source: Results, Behavioural tracking and visual stimulation, paragraph 1; Methods, Eye and face
    camera; Methods, Treadmill
  quote: Treadmill rotation (single axis) and video of the left eye were captured throughout the scan,
    yielding locomotion velocity, eye movements and pupil diameter data
  expected:
  - quantity: treadmill sampling rate, lower bound of the range over scans
    value: 57
    tolerance: 5.7
    unit: Hz
  - quantity: treadmill sampling rate, upper bound of the range over scans
    value: 100
    tolerance: 10
    unit: Hz
  - quantity: eye camera frame rate
    value: 20
    tolerance: 2
    unit: Hz
  criterion: Reproduced when all 14 scans hold treadmill velocity and pupil position and diameter
    covering the imaging period (from the first to the last imaging frame, gaps within it allowed as
    the Methods say untracked frames are stored as NaN), with every scan's treadmill rate in 51.3 to
    110 Hz (the range widened by 10% of each bound) and the eye camera rate within tolerance. The share of
    eye frames with a pupil fit is reported per scan; the paper gives no value for it.
- id: photodiode-89pct
  statement: The binary flip code of the photodiode signal, used to align stimulus and behaviour
    clocks, was recovered for 89% of trials.
  source: Methods, Stimulus alignment
  quote: The encoded binary signal was reconstructed for 89% of trials
  expected:
    quantity: trials with the encoded signal reconstructed
    value: 89
    tolerance: 8.9
    unit: percent
  criterion: Needs the raw photodiode signal at 10 MHz, or a per-trial flag of whether the code was
    read. The decoding is given only in outline (a sine convolution and local peak detection on a
    three-level signal), so if the dataset holds the raw signal the claim is tested with each of
    (a) a flag stored by the pipeline, if present, and (b) a decode of the three-level signal by
    peak detection, and holds when one reading is within tolerance. If the dataset holds only the
    aligned stimulus times, the claim cannot be tested from it.
- id: manual-coreg-19181
  statement: Experts manually matched 19,181 functional ROIs from 14 scans to 15,439 individual EM
    neurons.
  source: Results, Functional–structural co-registration, paragraph 2
  quote: we used the results of the transform to guide a group of experts to manually match 19,181
    functional ROIs from 14 scans to 15,439 individual EM neurons
  data: with_inputs
  expected:
  - quantity: functional ROIs manually matched
    value: 19181
    tolerance: 1918
    unit: ROIs
  - quantity: EM neurons manually matched
    value: 15439
    tolerance: 1544
    unit: neurons
  criterion: The match table is CAVE table coregistration_manual_v4 (Methods, Assigning manual
    matches), matched to the dataset's units by session, scan index and unit id, as the Fig. 6k code
    does. The paper gives no materialization version for the counts; the readings are (a) the
    version its code uses, 1181; (b) the latest public version. Reproduced when, under one reading,
    the counts are within tolerance. The share of the table's ROIs found in the dataset is reported;
    the paper gives no value for it, so it is not part of the outcome. Counting the EM identifiers the dataset itself holds in its plane segmentation columns is shown
    as a variant.
- id: ed4-matched-higher-signal-correlation
  statement: Units independently matched to the same EM neuron in two scans have higher signal
    correlation than each matched unit with the nearest unmatched unit in the other scan, more
    clearly for units with oracle score above 0.2.
  source: Results, Functional–structural co-registration, paragraph 2; Methods, Evaluating manual
    matches; Extended Data Fig. 4f–h
  quote: ROIs with at least moderate visual responses that are independently matched to the same
    neuron across multiple scans have higher signal correlations than adjacent neurons
  data: with_inputs
  depends_on:
  - manual-coreg-19181
  - oracle-same-order
  criterion: From the Methods (Evaluating manual matches). For every EM neuron matched to at least two
    scans, the signal correlation is the Pearson correlation between trial-averaged responses to
    the oracle stimuli of the matched unit in scan A and the matched unit in scan B; the two
    controls are the matched unit in scan A with the nearest unit in scan B not matched to the
    neuron, and the converse. The paper does not define nearest (in which space) or how a neuron
    matched in more than two scans contributes. The readings for nearest are (a) nearest by 3D
    centroid in the structural stack; (b) nearest in the same field in 2D. Pairs are all pairs of
    scans for the neuron, a choice set here, as the paper's scan A and scan B fix no rule. The
    paper reports no test; reproduced when, under both readings, the
    matched correlation exceeds both control correlations for more than half of the pairs, and the
    median difference is larger when both matched units have oracle score above 0.2 than over all
    pairs. A two-sided Wilcoxon signed-rank test of matched against control is reported.
- id: fiducial-automatch
