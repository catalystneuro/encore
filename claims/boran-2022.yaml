    tolerance: 1
  criterion: >-
    Correct trials, permutation t-test with a higher test-period mean at p < .05. The Methods and
    Results define the comparison differently; readings (a) test against maintenance only
    (Methods 2.3), (b) test against encoding and test against maintenance, both significant
    (Results 3.2), and (c) test against encoding and maintenance joined. The test period is the 2
    s of the test array (Methods 2.2); paired and unpaired as in the opening comment.
    Significance of each region's count as in fig2c-maintenance-neurons. The Methods come first,
    so reading (a) is the main one; reproduced when, under (a), or under (b) or (c) if (a) fails,
    the four counts are within tolerance and each region has p < .05. Which readings match is
    reported.
- id: fig4a-dpca-separates-set-sizes
  statement: >-
    Demixed PCA of the population separated set sizes 1, 2, 4 and 6; dPCs 2, 3 and 4 explained
    36% of the variance (significant against scrambled labels), the separation appeared early in
    the trial, and the first 15 dPCs explained 81.4% of the variance.
  source: Results, 3.3 Neuronal population analysis, paragraph 1; Figure 4a
  quote: >-
    dPCA clearly distinguished between set sizes 1, 2, 4, and 6. For better visualization we
    formed a three-dimensional space from three demixed principal components (dPCs 2, 3 and 4,
    explaining 36% of the variance, permutation test against scrambled labels, p = .002, Fig. 4
    a). ... we included the first 15 dPCs that explain 81.4% of the signal variance
  statistics:
  - test: permutation test against scrambled labels
    p: 0.002
    n: 809 neurons
  expected:
  - quantity: variance explained by dPCs 2, 3 and 4
    value: 36
    tolerance: 3.6
    unit: "%"
  - quantity: variance explained by the first 15 dPCs
    value: 81.4
    tolerance: 8.14
    unit: "%"
  criterion: >-
    Method from Methods 2.4. All 809 neurons pooled across sessions, correct trials, trial-averaged
    rates per set size from 1 ms bins smoothed with a Gaussian kernel over a 1000 ms window,
    minus each neuron's mean fixation rate; dPCA (Kobak et al. 2016) with time and set-size
    marginalizations, components ordered by explained variance. Open and named readings. Kernel
    width; (a) a 1000-sample MATLAB gausswin window (SD 200 ms) and (b) a window of plus or minus
    3 SD (SD 167 ms). Regularization; (c) none and (d) the toolbox's cross-validated lambda. Time
    span; fixation onset to test array offset. The p = .002 test is read as set-size labels
    shuffled across trials, dPCA refit, 499 repetitions, comparing the variance of dPCs 2 to 4.
    Reproduced when, under one combination of readings, both variance values are within
    tolerance, the set-size variance exceeds the shuffled null at p < .05, and the four set-size
    trajectories are distinct during maintenance. The early separation and the 90 degree angles
    in the dPC3-dPC4 plane are shown and not judged (the paper gives no measure for either).
- id: fig4b-speed-lowest-in-maintenance
  statement: >-
    Multidimensional speed in the 15-dPC space was highest during encoding and lowest during
    maintenance, lower than in encoding and test.
  source: Results, 3.3 Neuronal population analysis, paragraph 1; Figure 4b
  quote: >-
    Multidimensional speed was highest during encoding, when maintenance neurons ramped up their
    firing. Speed was lowest during maintenance (permutation t-test against encoding and test
    periods, p = .0005).
  statistics:
  - test: permutation t-test against encoding and test periods
    p: 0.0005
    n: 500 dPCA runs on 20% subsamples
  depends_on:
  - fig4a-dpca-separates-set-sizes
  criterion: >-
    dPCA as in fig4a-dpca-separates-set-sizes, run 500 times, each on a 20% subsample with
    replacement of the neural firing rate trajectories (Methods 2.4). Open, what is subsampled;
    readings (a) neurons and (b) trials. Speed is the Euclidean norm of the time derivative of the
    trajectory in the first 15 dPCs, averaged over set sizes and over time in each period, one
    value per period per run (the paper does not define speed beyond "rate of change over time";
    this combination over set sizes and time is a reading, not the paper's). Maintenance against encoding and against test by permutation t-test
    (Methods 2.6) on the 500 values per period. Reproduced when, under one reading, maintenance
    speed is below encoding and test with p < .05 for both, and encoding is the highest of the
    four periods. The figure shows fixation speed near maintenance speed; that comparison is not
    claimed.
- id: fig4c-distance-largest-in-maintenance
  statement: >-
    The pairwise distance between set-size trajectories was larger during maintenance than during
    encoding, and the largest of all periods, consistent with attractors during maintenance.
  source: Results, 3.3 Neuronal population analysis, paragraph 1; Figure 4c
  quote: >-
    Analysing the pairwise distance between trajecto- ries that corresponded to different set
    sizes, we found that the distances during maintenance were larger than during encoding
    (permutation t- test, p = .0005, Fig. 4 c).
  statistics:
  - test: permutation t-test
    p: 0.0005
    n: 500 dPCA runs on 20% subsamples
  depends_on:
  - fig4b-speed-lowest-in-maintenance
  criterion: >-
    The runs of fig4b-speed-lowest-in-maintenance. Distance is the Euclidean distance in the first
    15 dPCs between the trajectories of each of the six pairs of set sizes, averaged over pairs
    and over time in each period (the averaging is a reading; the paper and the Figure 4c legend
    say only "pairwise distance between all possible pairs"). Reproduced when, under one reading, maintenance distance exceeds
    encoding distance with p < .05 by permutation t-test and is the largest of the four periods;
    partially reproduced when only the first holds. The comparison with test (starred in Figure
    4c) is shown.
- id: fig4d-decode-workload-all
  statement: >-
    During maintenance, workload (set sizes 1 and 2 against 4 and 6) was decoded from all neurons
    pooled with median accuracy 87.5%, above chance; leaving out any one participant gave
    accuracies with IQR 85.7 to 87.6%.
  source: Results, 3.4 Decoding of information during the trial, paragraph 1; Figure 4d
  quote: >-
    For the maintenance periods, we found that the workload (set size 1, 2 vs. set sizes 4, 6) of
    each trial could be decoded with median decoding accuracy of 87.5% when all neurons were
    pooled ( Fig. 4 d, permuta- tion test against scrambled labels, p = .001). In a leave-one-out
    anal- ysis, the exclusion of any participant resulted in decoding accuracy in the IQR
    [85.7–87.6%]
  statistics:
  - test: permutation test against scrambled labels
    p: 0.001
    corrected: Bonferroni over 4 regions
    n: 809 neurons
  expected:
  - quantity: median decoding accuracy, all neurons
    value: 87.5
    tolerance: 8.75
    unit: "%"
  - quantity: lower quartile of leave-one-participant-out accuracies, bound of 85.7 to 87.6
    value: 85.7
    tolerance: 8.57
    unit: "%"
  - quantity: upper quartile of leave-one-participant-out accuracies, bound of 85.7 to 87.6
    value: 87.6
    tolerance: 8.76
    unit: "%"
  criterion: >-
    From Methods 2.5. Correct trials, labels low (1, 2) and high (4, 6) workload; per neuron, spike
    counts in a 1000 ms window (1 ms bins); pseudo-population of all neurons; SVM as in the NDT
    toolbox, trained and tested separately for each window, windows centred every 100 ms; 20
    cross-validation splits, 500 resampling runs; accuracy is the median over runs; null from
    1000 runs with shuffled labels; p Bonferroni-corrected for 4 groups (threshold .0125). Open
    and named readings. Which window is "maintenance"; (a) the window centred on the middle of
    the maintenance period (1.25 s after memory array onset, nearest 100 ms centres 1.2 and 1.3
    s) and (b) the median over windows centred inside the maintenance period. Trials per label in
    the pseudo-population; the paper gives 145 to 169 training trials (95%), read as (c) the
    largest equal number per label available in every session and (d) the session's own trial
    count, with each session's neurons resampled to it. Features; (e) z-scored per neuron as in
    common NDT use and (f) raw counts. SVM kernel; linear (the NDT libsvm default; the paper says
    nothing). Leave-one-out repeats the analysis without each participant's neurons, 13 values.
    Reproduced when, under one combination of readings, the accuracy is within tolerance with p <
    .0125 and the leave-one-out quartiles are within tolerance.
- id: fig4d-decode-workload-regions
  statement: >-
    Workload was decoded during maintenance from hippocampal neurons (75%) and entorhinal neurons
    (80%) but not from amygdala neurons.
  source: Results, 3.4 Decoding of information during the trial, paragraph 1; Figure 4d
  quote: >-
    When pooling neurons from the three anatomical re- gions separately, decoding accuracy was
    significant for the hippocam- pus (75%, Fig. 4 d column 3) and for the entorhinal cortex
    neurons (80%, Fig. 4 d column 5), but not for neurons in the amygdala.
  statistics:
  - about: hippocampus
    test: permutation test against scrambled labels
    p: 0.006
    corrected: Bonferroni over 4 regions
    n: 454 neurons
  - about: entorhinal cortex
    test: permutation test against scrambled labels
    p: 0.001
    corrected: Bonferroni over 4 regions
    n: 209 neurons
  expected:
  - quantity: median decoding accuracy, hippocampus
    value: 75
    tolerance: 7.5
    unit: "%"
  - quantity: median decoding accuracy, entorhinal cortex
    value: 80
    tolerance: 8
    unit: "%"
  depends_on:
  - fig4d-decode-workload-all
  criterion: >-
    The decoder and readings of fig4d-decode-workload-all, on each region's neurons. Reproduced
    when, under one combination of readings, hippocampus and entorhinal accuracies are within
    tolerance with p < .0125 and amygdala has p of .0125 or more (the paper's corrected
    threshold; the amygdala accuracy, near 62% in Figure 4d, is reported); partially reproduced
    when two of the three regions match.
- id: decode-performance-not-significant
  statement: >-
    Trial-wise performance (correct against incorrect) could not be decoded from MTL firing in
    any group (all 55%, hippocampus 55%, entorhinal 55%, amygdala 50%; p from .40 to .56).
  source: Results, 3.4 Decoding of information during the trial, paragraph 2
  quote: >-
    Decoding accuracy for the prediction of trial-wise performance (cor- rect vs. incorrect
    trials) was not significant (All MTL: 55%, p = .45, Hipp: 55%, p = .40, Ent: 55%, p = .44,
    Amg: 50%, p = .56). We could not decode performance with neural firing in the MTL.
  statistics:
  - about: all MTL
    test: permutation test against scrambled labels
    p: 0.45
  - about: hippocampus
    test: permutation test against scrambled labels
    p: 0.40
  - about: entorhinal cortex
    test: permutation test against scrambled labels
    p: 0.44
  - about: amygdala
    test: permutation test against scrambled labels
    p: 0.56
  expected:
  - quantity: decoding accuracy, all MTL
    value: 55
    tolerance: 5.5
    unit: "%"
  - quantity: decoding accuracy, hippocampus
    value: 55
    tolerance: 5.5
    unit: "%"
  - quantity: decoding accuracy, entorhinal cortex
    value: 55
    tolerance: 5.5
    unit: "%"
  - quantity: decoding accuracy, amygdala
    value: 50
    tolerance: 5
    unit: "%"
  depends_on:
  - fig4d-decode-workload-all
  criterion: >-
    A claim of absence, judged on the paper's test. The decoder of fig4d-decode-workload-all
    with labels correct and incorrect, all set sizes, maintenance window, null from 1000 shuffled
    runs, Bonferroni over 4 groups. Open, how the few incorrect trials are balanced; the reading
    is equal trials per label set to the smallest number of incorrect trials in any session, all
    neurons kept. Reproduced when no group reaches p < .0125; not reproduced when any does.
    Accuracies are reported either way.
