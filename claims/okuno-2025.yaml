- id: discussion-twenty-rois
  statement: With optimal nuisance removal and smoothing the FC-SC correlation reaches 0.87 at
    20 ROIs, and 0.928 with Spearman correlation.
  source: Discussion, paragraph 3
  quote: Through optimal nuisance factor removal and smoothing, we achieved r=0.87 at 20 ROIs.
