# Claims for Okuno, Woodward, Okano & Hata (2025), eLife reviewed preprint 107990 v1,
# "Functional connectivity, structural connectivity, and inter-individual variability in
# Drosophila melanogaster", on dandiset 000727 (reused; the data are those of Brezovec et al.).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-11-10, protocol pilot-14 as stated in docs/protocol.md.
#
# Text read. The eLife Reviewed Preprint version 1 (October 9, 2025, "Not revised"), the version
# the DOI 10.7554/elife.107990.1 names, from the publisher's HTML, in
# paper/10.7554-elife.107990.1.txt: abstract, Introduction, Results, figure legends (Figures 1
# to 5), Discussion, Materials and methods, Data availability, and the legends of the Extended
# Data figures (1-1, 1-2, 2-1, 3-1, 3-2, 4-1 to 4-4, 5-1), which are the paper's only
# supplement. No PDF was supplied, so no figure could be read; values shown only in figures are
# not known here. The text lost the displayed equations of the Methods (the FC-SC detection and
# correlation score, cPPSSI, PPSSI and the two ranking scores); they are taken from the code
# (M4, M7).
#
# Code read. github.com/takuto-okuno-riken/flywalk (MATLAB), linked under Code Availability, at
# commit 4b92add (2025-08-11), the last commit before v1 was posted. Later commits
# (2025-11 to 2026-06) answer the reviewers and change the DBSCAN distance to a morphological
# one; they are not this version's method. The repository holds the ROI time-series
# extraction with smoothing and nuisance regression (extractROItimeseries.m, lib/getNuisance*),
# FC and FC-SC analysis (analyzeFuncConnectivity.m), the plotting and tests of Figures 2 to 4
# (plotFuncConnectivity.m, plotStructConnectivity.m, plotNeuralFC.m), SC construction and the
# random synapse subsampling (makeStructConnectivity.m, makeSCcountMatrix*.m), PPSSI
# (makeNeuralSC.m), the walking regressor (checkBehavior.m) and the GLM (glmFlyMB1st.m,
# glmFlyMB2nd.m, lib/calcGlmTukey.m), with the resized FDA template, the fibre mask, the brain
# mask and the hemibrain neuropil atlas (atlas/hemiroi, 114 ROIs) already transformed to the
# template. It does not hold the NWB-to-NIfTI extraction or the SPM12 and ANTs registration
# steps. Its README points to Zenodo 10.5281/zenodo.15532271 for the preprocessed connection
# lists and ROI atlases (SCKm, DistKm) the scripts load.
#
# Data the paper used. From dandiset 000727, version 0.240106.0043 (Methods), the whole-brain
# two-photon calcium imaging of Brezovec et al. in 9 head-fixed flies walking on a ball:
# 256 x 128 x 49 voxels, 3384 volumes per fly; the code uses a volume rate of 1.879714 Hz, the
# GCaMP (green) channel, and the movement speed sampled at 50 Hz with the imaging starting
# 104.654892 ms after it (checkBehavior.m). Eight flies are used for every ROI-based analysis
# ("because of missing time-series in some ROIs in one fly"); the code's subject list is
# [1 2 3 4 5 6 8 9] of the registered files in name order, so the seventh fly is left out.
# All nine are used in the GLM. The dandiset's title, "Mapping the Neural Dynamics of
# Locomotion across the Drosophila Brain", names these data.
#
# Outside data. Every finding on structural connectivity (SC) uses EM connectomes the paper
# downloaded: FlyEM hemibrain v1.2 synapses from Janelia's DVID (dvid.io/blog/release-v1.2/),
# and FlyWire from codex.flywire.ai and Zenodo 10676866, with neurotransmitter predictions;
# synapses moved to the resized FDA template through JRC2018F with navis-flybrains and ANTs.
# Claims that compare the dandiset's FC with these SC matrices are data with_inputs; claims on
# the connectomes alone are data elsewhere. The neuropil atlas and the template come from the
# code repository (pinned above), the SCKm and DistKm ROI atlases from Zenodo 15532271 (or are
# rebuilt with makeVoxelROIatlas.m, by k-means, so not identically).
#
# Methods shared by the criteria (M) and details the paper leaves open (O).
# M1 Preprocessing (Methods, Preprocessing). SPM12 motion and slice-timing correction (code
#    prefix "ar"), the mean image registered by ANTs to the resized FDA template
#    (template/thresholded_FDACal.nii.gz, 2.45 x 2.28 x 3.72 um voxels) and the 4D data
#    transformed with it.
# M2 Smoothing. A Gaussian kernel whose width the paper gives in voxels ("FWHM from 1 voxel
#    (2.28 um) to 30 voxels"; Results and the GLM Methods call it "kernel radius"). The code
#    sets FWHM = n voxels along y (2.28 um) and the same physical width along x and z, sigma =
#    FWHM / sqrt(8 ln 2), filter size 2*ceil(2*sigma)+1, applied to each volume
#    (extractROItimeseries.m; code names s10 to s300 for 1 to 30 voxels).
# M3 Nuisance removal and FC (Methods, Generation of ROIs; code). Poly-tCompCor is 7 polynomial
#    regressors (two linear ramps, four quadratic terms and a constant,
#    lib/getNuisancePolynomial.m) plus 6 principal components of the 1000 voxels with the
#    highest temporal SD after polynomial detrending (lib/getNuisancetCompCor.m). Each voxel of
#    an ROI is mean-centred and regressed on these by OLS; the ROI time series is the mean of
#    the residuals; FC is the Pearson correlation between ROI time series per fly,
#    Fisher-z-transformed (atanh) and averaged over the 8 flies; infinite values (the diagonal)
#    are set to the largest finite value.
# M4 FC-SC correlation and detection (Methods, FC-SC detection and correlation;
#    analyzeFuncConnectivity.m). SC (neuron) is the count of neurons with post-synapses in one ROI
#    and pre-synapses in the other, SC (synapse) the count of their synapses (FlyEM confidence
#    0.8, FlyWire cleft score 140 unless stated). Both are the code's second SC layer
#    (ncountMat(:,:,2), sycountMat(:,:,2), "Traced"), which every plotting function uses (rows 7
#    and 9 of R and A): for FlyEM only neurons of Traced status (makeSCcountMatrix.m), for
#    FlyWire synapses whose pre and post neurons both have ids (makeSCcountMatrixFw.m); the
#    first layer, which adds FlyEM orphan bodies, is not what the figures show.
#    FC-SC correlation is the Pearson r between
#    log10(SC), with log of zero set to 0, and the code's |mean z-FC|, over every element of the
#    n x n matrices including the diagonal. FC-SC detection is the mean over 100 thresholds (the
#    0th to 99th percentiles of the nonzero SC values) of the ROC AUC of |mean z-FC| against SC
#    at or above the threshold. The score is |r| + 2|AUC - 0.5| (the code's B, range 0 to 2).
# M5 ROI types. Hemibrain primary neuropils (63 ROIs, Figures 3 and 4), the 52 of Figure 1, and
#    SCKm and DistKm, k-means parcellations of the 146,604 hemibrain voxels into 20 to 1000 (and
#    up to 10,000 or 20,000 in the code) ROIs.
# M6 Permutation test (Methods, Statistical Analysis; plotFuncConnectivity.m
#    checkRandSubsampleRankTestByHemiroi). On the 63 hemibrain primary ROIs, no smoothing,
#    Poly-tCompCor, FlyWire sc140: the SC matrix of the selected synapses against 99 null SC
#    matrices of randomly sampled synapses whose number is drawn from a normal distribution
#    around the selected total (makeStructConnectivity.m). The code draws each null's synapse
#    count from N(mean, SD) with mean and SD fixed in the code, paired with each target in
#    plotFuncConnectivity.m: FlyWire unsegregated N(1.85e6, 0.2e6) (rd185-20), segregated
#    N(15.6e6, 0.8e6) (rd1560-80), reciprocal N(1.4e6, 0.15e6) (rd140-15); FlyEM rd140-15,
#    rd705-40 and rd67-12 in the same order. Synapses are drawn at random from all valid
#    synapses above the score threshold (randSubsampleFw, rtype 4). A normal distribution is fitted to
#    the 99 null values and the two-tailed p is 2*Phi(-|x - mu| / sigma); significance at
#    0.05/6 (Bonferroni, as the code sets it).
# M7 PPSSI (Methods, PPSSI; makeNeuralSC.m). DBSCAN on each neuron's synapse positions with
#    radius 3 um and minimum 1 point; for each cluster cPPSSI = ((pre - post) / (pre + post))^2;
#    PPSSI = sum over clusters of cPPSSI times the cluster's share of the neuron's synapses.
#    Unsegregated ranking score (1 - PPSSI) * log10(W), segregated ranking score PPSSI *
#    log10(W), W the neuron's synapse count. makeNeuralSC.m's default radius is 1000 nm; the
#    Methods' 3 um is followed, as in makeStructConnectivity.m and plotNeuralFC.m (3000 nm, the
#    db3000 targets). The SC of selected synapses (makeSCcountMatrixFw.m) keeps a synapse when
#    the cPPSSI of its pre side (in the pre neuron) and of its post side (in the post neuron)
#    both meet the bound, and for reciprocal synapses when both sides' shortest reciprocal
#    distance is below the bound.
# M8 GLM (Methods, GLM Analysis; checkBehavior.m, glmFlyMB1st.m, glmFlyMB2nd.m). The speed is
#    averaged per imaging volume; the code clips it at th, the mean over flies of each fly's SD
#    of speed, subtracts b, the mean over flies of each fly's 10th percentile, sets negatives
#    to 0 and scales to [0 1]; it is convolved with a gamma CRF (shape 1.7, scale 0.25 s, 5 s
#    kernel, at 25 times the volume rate). First level per fly, on brain-mask voxels smoothed with
#    FWHM 8 voxels (M2), mean-centred, with the regressor, the 7 polynomial terms and 6
#    tCompCor components scaled by their SD; pre-whitening by Tukey taper of size 8
#    (lib/calcGlmTukey.m). Second level is the code's mixed-effects OLS with Tukey taper on the
#    nine flies' betas of the regressor and the tCompCor terms (glmFlyMB2nd.m); height threshold
#    p < 0.001, cluster extent as plotGlmContrastImage.m computes it.
# O1 The Methods say "Walking was defined as 1σ (34%) or more of the movement velocity and
#    divided into walking and other. Less than 10% of movement velocity was zero cut." The code
#    builds the graded regressor of M8, saturating at 1 SD; this is followed. A binary
#    regressor (1 for volumes at or above b + th, else 0) is the reading the words "divided into
#    walking and other" allow, and is run as a variant.
# O2 The SPM12 and ANTs settings of M1 are not given in the paper or the code. The author uses
#    SPM12 defaults (realign to the mean, slice timing to the middle slice) and ANTs SyN with
#    default parameters, as a standard choice; a rigid plus affine registration is a variant.
#    Registration can change ROI time series, so outcomes resting on it are marked so.
# O3 The paper's FC matrix is signed; the code correlates SC with |mean z-FC| (M4). The code is
#    followed; signed FC is shown as a variant.
# O4 Which neuropil atlas names the GLM regions. Readings (a) the hemibrain atlas of the
#    Methods (atlas/hemiroi, names in data/hemiroi.mat), (b) the JFRC2010 whole-brain atlas
#    the repository also holds (atlas/jrc2018f_2010roiCal_invFDACal.nii.gz with
#    jfrc2010-roi-itksnap.txt).
schema_version: 2
dataset:
  archive: dandi
  id: "000727"
paper: doi:10.7554/elife.107990.1
claims:
- id: fig1-poltcomp-optimal
  statement: Among the nuisance removal methods tested, polynomial detrending combined with
    tCompCor gives the best FC-SC correlation and detection for the three ROI types.
  source: Results, Investigation of the optimal nuisance factor removal method, paragraph 1;
    Figure 1d to 1f
  quote: After the comparison of the raw (leftmost) and removal methods for various ROI types, the
    combination of polynomial detrending [41] & tCompCor [42] was found to yield the optimal
    results.
  data: with_inputs
  criterion: For hemibrain 52, SCKm 50 and DistKm 50 ROIs (M5), FlyEM SC, no smoothing (Figure 1
    names none, and the code's hemibrain runs use none), the score of M4 for every method in the
    code's list of 37 combinations (extractROItimeseries.m; global mean, global signal, white
    matter, 6 and 24 head motion, aCompCor, tCompCor, polynomial). Readings for "optimal"; (a)
    Poly-tCompCor has the highest score with SC (neuron) in each ROI type; (b) it has the
    highest score averaged over the three ROI types and both SC kinds. Reproduced when (a) or
    (b) holds; partially reproduced when Poly-tCompCor is within the top three under (b) but
    neither holds. Rests on O2 and O3.
- id: fig2b-distkm-smoothing-optimum
  statement: For DistKm ROIs spatial smoothing raises FC-SC agreement strongly, and the best
    kernel is about 23 voxels (52.44 um) across ROI counts.
  source: Results, Comparison of the FC-SC correlation between humans and flies, paragraph 1;
    Figure 2b
  quote: In DistKm, smoothing was highly effective, and the optimal kernel radius of the Gaussian
    filter was around 23 voxels (52.44 μm) for various ROI counts (Fig. 2b).
  data: with_inputs
  expected:
  - quantity: optimal smoothing size for DistKm
    value: 23
    tolerance: 2.3
    unit: voxels
  criterion: DistKm at 20, 30, 50, 100, 200, 500 and 1000 ROIs, the seven counts the code's
    Figure 2 block (checkLargeSmoothingPoltcompByRoinum, its column offsets and commit 999a2f2)
    is laid out for; the active list at 4b92add, 20, 50, 100, 200, 500 and 1000 (README demo
    2), is shown as a variant. Poly-tCompCor, FlyEM SC, smoothing 0 to 30 voxels by 1 (M2). For
    each count, the size that maximizes the score of M4 with SC (neuron), as the code's max of B
    per ROI count does. Reproduced when the median of the optimal sizes is within tolerance and
    the score at the optimum exceeds the unsmoothed score at every count; partially reproduced
    when smoothing raises the score at every count but the median optimum falls outside
    tolerance. The optima with SC (synapse) are shown. Rests on O2 and O3.
- id: figs2-1b-sckm-smoothing
  statement: For SCKm ROIs, smoothing does not help below 100 ROIs, while kernels above 16
    voxels (36.48 um) help above 100 ROIs.
  source: Results, Comparison of the FC-SC correlation between humans and flies, paragraph 1;
    Extended Data Figure 2-1b
  quote: In SCKm, smoothing was ineffective for ROI count below 100, while the kernel radius above
    16 voxels (36.48 μm) was effective for ROI count above 100 (Ext.Data.Fig.2-1b).
  data: with_inputs
  criterion: As fig2b-distkm-smoothing-optimum, on SCKm. Reproduced when, for 20, 30 and 50 ROIs,
    no smoothing size raises the score of M4 (SC neuron) by more than 0.05 over no smoothing,
    and for 200 to 1000 ROIs every size from 17 to 30 voxels gives a higher score than no
    smoothing. The 0.05 margin for "ineffective" is not from the paper; the curves are shown so
    that a reader can judge them. Partially reproduced when one of the two halves holds. Rests
    on O2 and O3.
- id: fig2c-smoothing-plus-poltcomp
  statement: Smoothing combined with Poly-tCompCor gives significantly higher FC-SC scores than
    smoothing alone, for SCKm and DistKm.
  source: Results, Comparison of the FC-SC correlation between humans and flies, paragraph 1;
    Figure 2c
  quote: We found that this combination was significantly more effective than smoothing alone for
    SCKm and DistKm (Fig. 2c, Mann–Whitney U test p<1.67e-4 Bonferroni corrected).
  statistics:
  - test: Mann-Whitney U test
    p: 0.000167
    p_relation: "<"
    corrected: Bonferroni
    n: 31 scores per group (smoothing 0 to 30 voxels), six tests (SCKm and DistKm at 20, 100
      and 1000 ROIs)
  data: with_inputs
  criterion: The code's ranksum block (plotFuncConnectivity.m checkLargeSmoothingPoltcompByRoinum,
    commented at 4b92add, laid out for counts 20, 30, 50, 100, 200, 500 and 1000) runs six
    tests, on the score of M4 with SC (neuron), the 31 smoothing sizes 0 to 30 with no nuisance
    removal against the same with Poly-tCompCor, at the first, fourth and seventh counts (20,
    100 and 1000 ROIs) of SCKm and of DistKm; six tests give the 0.001/6 = 1.67e-4 of the
    legend. Its fifth test compares DistKm raw at 100 with raw at 1000, a slip in the indices;
    raw against Poly-tCompCor at 100 ROIs is run in its place. Two-sided Mann-Whitney U test.
    Reproduced when Poly-tCompCor is higher with p < 1.67e-4 in all six; partially reproduced
    in four or five. The legend's "at each ROI count" allows the test at every count of the
    seven as a variant, shown with SC (synapse). Rests on O2 and O3.
- id: figs2-1d-highpass-degrades
  statement: Adding a temporal high-pass filter to nuisance removal degrades FC-SC agreement.
  source: Results, Comparison of the FC-SC correlation between humans and flies, paragraph 1;
    Extended Data Figure 2-1d
  quote: the combination of a high-pass filter and nuisance factor removal overlapped for the
    purpose of noise removal, and the effect was degraded (Ext.Data.Fig.2-1d)
  data: with_inputs
  criterion: As the code's checkHighpassFilterPoltcompByRoinum (plotFuncConnectivity.m) sets it,
    DistKm ROIs (legend) at 20, 50, 100, 200, 500 and 1000, Poly-tCompCor, smoothing 23 voxels
    (s230), FlyEM SC, with high-pass cut-offs 0.1, 0.05, 0.025, 0.02, 0.01, 0.005 and 0.001 Hz
    (Methods "from 0.1 Hz to 0.001 Hz"; extractROItimeseries.m's commented list adds 0.009 and
    0.008, shown as a variant), applied after the regression, as extractROItimeseries.m does
    (MATLAB highpass). Reproduced when, with SC (neuron), the score of M4 with every cut-off is
    below the score without the filter at four or more of the six counts. Rests on O2 and O3.
- id: fig2d-log-decline
  statement: The best FC-SC correlation falls linearly with the logarithm of the ROI count.
  source: Results, Comparison of the FC-SC correlation between humans and flies, paragraph 2;
    Figure 2d
  quote: Results showed that the correlation decreased proportionally to the logarithm of the ROI
    count (Fig. 2d).
  data: with_inputs
  criterion: As the code's Figure 2d block ("this is for figure.2 SC-FC corr & detection from 20
    to 10000 ROIs", plotFuncConnectivity.m checkSmoothingPoltcompByLargeRoinum), for SCKm and
    DistKm at 20, 50, 100, 500, 1000, 5000, 10,000 and 20,000 ROIs, the largest FC-SC
    correlation (SC neuron, FlyEM, row 7) over the 12 settings of smoothing 0, 3, 8, 15, 23 and
    30 voxels with no nuisance removal or Poly-tCompCor. Reproduced when, for each ROI type, the
    slope of r on log10(ROI count) is negative and the Pearson correlation of r with log10(count)
    is -0.9 or lower (a standard bar for "linear", not the paper's). Partially reproduced when
    it holds for one type. Rests on O2 and O3.
- id: fig2d-fly-values
  statement: The fly FC-SC correlation is 0.71 to 0.81 at about 50 ROIs and 0.6 to 0.67 at about
    1000 ROIs (SCKm and DistKm), against 0.66 and 0.54 in humans.
  source: Results, Comparison of the FC-SC correlation between humans and flies, paragraph 2;
    Figure 2d
  quote: At approximately 50 ROIs, the difference was nearly 1.08-fold to 1.22-fold (r=0.66 for
    humans and r=0.71-0.81 for flies [SCKm, DistKm]); by contrast, at approximately 1,000 ROIs,
    the difference was roughly 1.12-fold to 1.24-fold (r=0.54 for humans and r=0.6-0.67 for flies)
  data: with_inputs
  expected:
  - quantity: lowest fly FC-SC correlation at 50 ROIs (range 0.71 to 0.81)
    value: 0.71
    tolerance: 0.071
  - quantity: highest fly FC-SC correlation at 50 ROIs
    value: 0.81
    tolerance: 0.081
  - quantity: lowest fly FC-SC correlation at 1000 ROIs (range 0.6 to 0.67)
    value: 0.6
    tolerance: 0.06
  - quantity: highest fly FC-SC correlation at 1000 ROIs
    value: 0.67
    tolerance: 0.067
  criterion: FC-SC correlation as in fig2d-log-decline at 50 and at 1000 ROIs, SCKm and DistKm
    with SC (neuron), as Figure 2d plots (legend "FC-SC correlation (neuron)"; code row 7
    only). The human values are from the literature and are not tested. A reported range holds
    inside the range widened by 10% of each bound (0.639 to 0.891 at 50 ROIs, 0.54 to 0.737 at
    1000). Reproduced when both values at 50 ROIs and both at 1000 ROIs lie in their widened
    ranges. Rests on O2 and O3.
- id: fig2d-ten-thousand-rois
  statement: At about 10,000 ROIs the fly FC-SC correlation is 0.46 to 0.57.
  source: Results, Comparison of the FC-SC correlation between humans and flies, paragraph 2;
    Discussion, paragraph 3
  quote: The difference was slightly larger (1.21 to 1.5-fold ... r=0.378 for marmosets and
    r=0.46-0.57 for flies) than the marmoset results at around 10,000 ROIs
  data: with_inputs
  expected:
  - quantity: lowest fly FC-SC correlation at 10,000 ROIs (range 0.46 to 0.57)
    value: 0.46
    tolerance: 0.046
  - quantity: highest fly FC-SC correlation at 10,000 ROIs
    value: 0.57
    tolerance: 0.057
  criterion: As fig2d-fly-values, at 10,000 ROIs (code atlases hemiCmkm10000 and
