# Claims for Ramachandran, Gao, Yttri, Yu & He (2025) on dandiset 000945.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-22,
# protocol as stated in docs/protocol.md.
# Source: the version of record (J Neural Eng 22(2) 026022, PMC11920894), full text as served by
# Europe PMC: Abstract, Introduction, Methods, Results, figure legends and Discussion. No PDF was
# supplied. The supplementary materials (headpiece design, surgery, training, hydrophone scanning,
# supplementary figures 2 and 4, supplementary table 1 of ISPTA values) were not supplied. No
# claim rests on them: the analysis methods and the ISPTA of each PRF condition are given in the
# main text (Methods 2.3 to 2.6). The paper links no analysis code (it names "custom code" in
# MATLAB R2019a with FieldTrip), so no code was read.
#
# Data the paper used, as it reports them. Adult male Wistar rats, awake and head-fixed, with a
# chronic 32-channel micro-electrode array in S1; tFUS from a 128-element array (f0 1.5 MHz,
# 114 kPa peak-to-peak in situ at 15 V), ultrasound duration 67 ms, one trial every 2.5 s with
# 10% jitter, 505 trials per parameter set, the first 5 cut (500 used). TDT recordings at 24 kHz,
# bandpass 300 Hz to 5 kHz, units sorted in Offline Sorter. Batch 1 (10 rats): awake PRF series
# at 30, 300, 1500, 3000 and 4500 Hz with 200 us tone-burst duration (TBD), at about 7 months;
# the same PRF series under isoflurane at 9 months; awake DC series at 1500 Hz with TBD 40, 200
# and 400 us (DC 6, 30 and 60%) at 10 months. Batch 2 (5 rats, 7 months): awake and anesthetized
# recordings at a low PRF and 1500 Hz with 200 us TBD, and a sham at 1500 Hz aimed off target at
# the front of the skull. The low PRF of batch 2 is given as 30 Hz in Methods 2.3 and as 300 Hz
# in the next sentences and in Results 3.2; the author takes the PRF the dataset records. ISPTA
# of the PRF series is 0.6, 6.03, 30.13, 60.26 and 90.39 mW/cm2. Measured variables are sorted
# units' spike times and waveforms and the ultrasound trigger times. The dandiset is titled
# "Neural Spiking Data in the Awake Rat Somatosensory Cortex Responding to Trials of
# Transcranial Focused Ultrasound Stimulation" (reference 50 of the paper).
#
# Methods shared by the claims, from Methods 2.4 to 2.6 and the figure legends. Where the paper
# leaves a detail open, the readings it allows are named with a label; a criterion that says
# "under every reading" means every combination. A reading that could change an outcome is run
# in all its forms; the outcome is the one they all give, and when they differ the claim is
# blocked as methods_underspecified with every result shown.
#  - Units. Every sorted unit of a session is one observation of that session's condition; the n
#    of a test is the number of neurons in each group across all animals (Methods 2.6). Units are
#    not selected for responsiveness (Methods 2.4). Methods 2.4 excludes "PSTHs with visibly
#    fluctuating baseline periods" and manually ignores movement episodes; neither is defined.
#    E1, no exclusion; E2, if the dataset marks excluded units or invalid intervals, they are
#    left out. A unit with no spike in the baseline window cannot be normalized and is left out
#    (a standard choice, reported with its count).
#  - Cell type (Methods 2.5; Figure 3B, 3C). Features are the initial phase (onset to first
#    baseline crossing) and after-hyperpolarization phase (first crossing to recrossing) of the
#    unit's action potential; k-means with two clusters; the cluster of shorter durations is FSU,
#    the other RSU. The paper sorts ambiguous units by spike rate by hand, with no rule. K0, if
#    the dataset carries the paper's RSU/FSU labels, those are used and K1/K2 are variants. K1,
#    k-means per animal over its units (Figure 3B clusters "one animal's recordings"); K2,
#    k-means over all units pooled. Features from the unit's mean waveform.
#  - Trials. T1, trials 6 to 505 (Methods 2.4, "500 after 5 are cut from the beginning");
#    T2, all 505 trials (legends of Figures 4 to 7, "over 505 trials").
#  - Normalized rate (Methods 2.4). Time 0 is the ultrasound trigger. The PSTH runs from -0.5 to
#    1.5 s, bin 35.7 ms (Figure 4 legend), with a bin edge at 0, divided by the number of trials.
#    Baseline is the mean rate in [-0.5, 0) s. The response is the mean rate in a window as a
#    percent of baseline. Windows (Figure 5 to 7 legends): time-locked 0 to 67 ms; delayed 0.5 to
#    1 s in awake recordings and 0.2 to 0.7 s in anesthetized ones. Whether "percent of baseline"
#    is the ratio or the percent change does not change any rank test; group means are reported
#    as the ratio in percent. Open, how a window is measured, since 67 ms and 0.2 and 0.7 s do
#    not fall on bin edges of the 35.7 ms PSTH: W1, the spikes in the exact window; W2, the PSTH
#    bins that overlap the window (time-locked 0 to 71.4 ms). The 0.5 to 1 s window falls on bin
#    edges and is the same under both.
#  - Group tests (Methods 2.6; Figure 5 to 7 legends). Kruskal-Wallis across the conditions of a
#    panel, then two-sided Wilcoxon rank-sum tests between conditions (the groups hold different
#    sessions, so a paired test does not apply), Bonferroni-corrected. Open, the groups: G1, the
#    parameter levels of the panel; G2, the levels plus the sham sessions of the same state and
#    window (the Results compare levels with sham). Bonferroni family: all pairs among the
#    groups of the Kruskal-Wallis (the paper does not give the number of comparisons). Methods
#    2.3 does not say whether the batch 2 sham was recorded in both states; if the dataset holds
#    no anesthetized sham, the parts of a criterion that compare with an anesthetized sham are
#    reported as untestable and the claim is judged on its other parts. The significance level is not stated; 0.05 after correction
#    is used, the level the paper calls significant in Results 3.2 paragraph 3; whether each
#    corrected p is also below the bound the paper prints is reported.
#  - Two-way ANOVA (Results 3.2). Factors anesthesia (awake, anesthetized) and PRF (five levels)
#    on the batch 1 PRF series, unit normalized rates, each state's own window. The model is not
#    given. A1, both main effects and their interaction, type II sums of squares; A2, main
#    effects only.
#  - Delayed-response latency (Methods 2.4; Figure 4H, 4I). A unit has a significant delayed
#    response when at least three consecutive PSTH bins are at or above baseline plus one SEM;
#    its latency is the time of the first of them. Open, the SEM: S1, the SEM over the 14
#    baseline bins of the trial-averaged PSTH; S2, the SEM over trials of the per-trial baseline
#    rate, in spikes per bin. Open, the first bin allowed ("any response after the ultrasound
#    duration"): D1, bins starting at or after 67 ms; D2, bins ending after 67 ms. Open, the time
#    of a bin: L1, its start; L2, its centre. Sessions: FSU at 1500 Hz PRF, 200 us TBD (Figure 4H).
#    Q1, the batch 1 PRF series sessions of each state; Q2, every on-target 1500 Hz, 200 us
#    session of each state (adding the awake 30% DC sessions and batch 2).
