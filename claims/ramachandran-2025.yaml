  source: Figure 3B and 3C; Methods 2.5
  quote: K -means clustering of detected neurons from one animal's recordings, showing 28 fast
    spiking units (FSU) and 32 regular spiking units (RSU), for 60 total.
  expected:
  - quantity: FSU in the example animal
    value: 28
    tolerance: 2.8
  - quantity: RSU in the example animal
    value: 32
    tolerance: 3.2
  - quantity: units in the example animal
    value: 60
    tolerance: 6
  criterion: The header's cell type method. The paper does not name the animal, nor whether its
    "recordings" are one session or all of its sessions; the readings are R1, the units of one
    session, and R2, the units of all of one animal's sessions in one series. Reproduced when,
