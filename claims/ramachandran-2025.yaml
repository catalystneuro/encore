- id: fig4-rsu-time-locked-both-states
  statement: RSUs show time-locked responses to tFUS, an increase in firing rate during the 67 ms
    of stimulation, in both awake and anesthetized recordings.
  source: Results 3.1, paragraph 1; Figure 4C and 4E
  quote: We observed time-locked responses from RSU in both awake and anesthetized recordings, with
    an observable increase in firing rate during tFUS stimulation
  depends_on:
  - fig3-cell-type-sorting
  criterion: Figure 4 shows single examples at 1500 Hz PRF, 30% DC and reports no group test. The
