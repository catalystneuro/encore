    200 us sessions against the sham sessions of the same state, two-sided Wilcoxon rank-sum, p
    < 0.05, with the 1500 Hz mean above the sham mean and above 100%. Reproduced when this holds
    in both states under every reading; partially reproduced when in one state only. The units
    whose PSTH rises in 0 to 67 ms are counted per state.
