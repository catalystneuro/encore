# Claims for Luo, Jiang, Desai et al. (2024), J. Comp. Neurol. 532, e70001, on dandiset 001261.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-22,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record (open access, PMC11583843), as served by Europe PMC, in
# paper/10.1002-cne.70001.txt: Introduction, Materials and Methods, Results, Discussion, Table 1,
# the figure legends, and the supplement (CNE-532-e70001-s001.docx), whose legends are in the
# text file. There is no PDF, so the main figures (Figs. 2D, 4D, 7D and 9D, which show which
# features differ) could not be read. Four supplementary figures were read from the images in
# paper/10.1002-cne.70001.supp.docx, to see which features they mark as different: S2-2 (AP
# amplitude ***, CV-ISI **, sag **; AP width, upstroke and downstroke not marked), S4-1B (ten
# morphological features, none marked), S7-1 (AP amplitude **, CV-ISI ****, sag *, AP width **,
# upstroke ****, downstroke not marked) and S9-1B (seven morphological features, none marked).
#
# Code read: the analysis code the Methods link, doi:10.5281/zenodo.10975327, which is
# github.com/nsdesai/patch_clamp_analysis tag v1.0.1, commit 17a3265d280392e73916faee31ee9cea30500c7c
# (last modified 04/15/24). It holds 14 MATLAB functions that extract the electrophysiological
# features from one recording's current steps (analysis_of_neurophysiology_data.m calls
# sagpotential.m, inputresistance.m, rheobasecurrent.m, spikeproperties.m,
# afterhyperpolarization.m, ficurve.m, spikefrequencyadaptation.m), getindices.m (groups
# neurons by ChAT and BLA labels) and plotting helpers. It holds no code for the resting
# potential, the statistics, PCA, UMAP, LDA or the morphology. The UMAP is Meehan's MATLAB
# implementation (File Exchange 71902) and LDA is MATLAB fitcdiscr, both named by the Methods.
#
# Data the paper used. Mouse: 27 ChAT-tau-GFP mice (18 male, 9 female, 5 to 14 weeks), red
# microbeads injected into both BLA; whole-cell current clamp in NBM/SI slices (56 slices) of 48
# BLA-projecting cholinergic neurons (beads and GFP) and 46 BLA-projecting noncholinergic
# neurons (beads, no GFP). Macaque: 9 rhesus macaques (7 male, 2 female, 6.9 to 16.9 years) with
# microbeads in the BLA; 52 relocalized BLA-projecting neurons confirmed cholinergic by ChAT
# immunostaining, of which 46 (from 38 slices) passed quality control, and 11 BLA-projecting
# noncholinergic neurons. Protocol in both species: 500 ms current steps from -60 to +200 pA in
# 10 pA increments (Fig. S2-1 legend), at least 10 s apart, from a baseline held at -65 mV by
# a small bias current, sampled at 10 kHz, filtered at 4 kHz; junction potential (-14 mV) not
# corrected. Quality control (Methods 2.4): access resistance < 25 MOhm and stable within 20%,
# offset current within 10% of its initial value, resting potential <= -40 mV. Morphology:
# neurobiotin fills reconstructed in Imaris from confocal stacks, 13 features and Sholl
# intersections every 10 um; 31 mouse cholinergic, 44 mouse noncholinergic, 52 macaque
# cholinergic neurons. The combined analysis (Fig. 10) uses the 46 macaque and 27 mouse
# cholinergic neurons with both. The dandiset's description says it holds "the physiology data
# for the paper"; whether it holds the morphology and the per-neuron labels (species, ChAT,
# beads, quality control) is for the author to find. All claims use the paper's own recordings
# (data: dataset).
#
# Feature definitions (F1 to F18), from Methods 2.5, the Fig. S2-1 legend and the code. Common
# to all, from the code: the first 500 ms of each step is analysed; a spike is a peak found by
# MATLAB findpeaks with height >= 0 mV, prominence >= 30 mV, width <= 5 ms and >= 5 ms from the
# previous peak; firing rate is spikes / 0.5 s.
#   F1 resting membrane potential. Methods, "measured in the absence of a current injection".
#      The code does not compute it (its baselineVm is the potential before the step, at the
#      held -65 mV). Open; readings (a) a value stored with each recording (potential with no
#      bias current), (b) the potential of a recorded sweep with no bias and no step current.
#      If the dataset holds neither, F1 cannot be computed.
#   F2 sag, -60 pA step (Methods). Code, which settles how: trace median-filtered over 20 ms;
#      sag = maximum over the second half of the step minus minimum over the first half,
#      floored at 0; if the -60 pA response saturates, the next step up.
#   F3 input resistance. Methods, from the response to the -20 pA step: steady-state deflection
#      (mean of the last 100 ms of the step minus the mean of the 45 ms starting 50 ms before
#      the step, the code's windows) divided by -20 pA. Variant, the code's choice: slope of the
#      steady-state deflection against current over the steps from -50 to 0 pA, leaving out
#      steps that reach -20 mV or deflect more than 50 mV.
#   F4 membrane time constant. Methods, relaxation to the -20 pA step, fitted as in the code,
#      a*exp(-t/tau) + c from 2 ms after step onset to the end of the step. Variant, the code's
#      choice: the same fit on the most negative unsaturated step between -50 and 0 pA.
#   F5 rheobase, the lowest positive step with at least one spike (code).
#   F6 spike threshold, first spike of the rheobase step: the trace linearly interpolated to 10
#      times the sampling rate, dV/dt by central differences, the first sample from 3 ms before
#      the first peak at which dV/dt exceeds 10 mV/ms (Methods value, code procedure).
#   F7 spike amplitude, first peak minus threshold.
#   F8 spike width, full width at the level halfway between threshold and peak (code, the first
#      two crossings).
#   F9 spike latency. Methods, step onset to the threshold crossing of the first spike. Variant,
#      the code's choice: step onset to the first peak.
#   F10 upstroke, maximum dV/dt from 5 ms before the first peak (code) to the peak.
#   F11 downstroke, minimum dV/dt "on the downstroke of the first action potential" (Methods).
#      The code's window runs from 5 ms before the first peak to the end of the step (it takes
#      max(peak - 20 ms, length), which is the step end), so it can include later spikes.
#      Readings (a) from the first peak to 20 ms after it, (b) the code as written.
#   F12 AHP amplitude. Methods, rheobase step (the Fig. S2-1 legend says all spike parameters
#      are assayed at rheobase): threshold minus the minimum potential in the 100 ms after the
#      threshold crossing of the first spike. Variant, the code's choice: on the first step at or
#      above rheobase with two or more spikes, threshold of its first spike (no interpolation)
#      minus the minimum between 0.75 ms before the first peak and 0.75 ms before the second.
#   F13 AHP latency, time from the threshold crossing to the AHP minimum of F12 (Methods).
#      Variant, the code's: from 0.75 ms before the first peak.
#   F14 AHP width, time the potential stays below threshold minus half the AHP amplitude (the
#      code's level), between its first two crossings; if it does not recross, to the end of
#      the step (code). Window as in F12 (Methods), the code's as a variant.
#   F15 f-I slope, least-squares line of firing rate against current, from the last step without
#      spikes below rheobase to the step with the most spikes (code; Methods "the initial
#      linear section").
#   F16 maximum firing rate, the largest firing rate over the steps from 0 to 200 pA (Methods,
#      code). Variant, the Fig. S2-1 legend: the rate on the 200 pA step.
#   F17 adaptation index, spikes in the second half of the step over spikes in the first half
#      (Methods, code; NaN with no spike in the first half). Which step is open: Methods "the
#      maximal current step"; the code uses the step with the most spikes (the first if tied).
#      Readings (a) the 200 pA step, (b) the step with the most spikes.
#   F18 CV of interspike intervals, SD (n - 1) over mean of the intervals on the step of F17
#      (both readings); 0 with fewer than 3 spikes (code). The released code stores the intervals
#      in a square matrix (zeros(n-1)), which makes its CV not a scalar for 3 or more spikes, so
#      the Methods' definition is used.
#   Morphological features M1 to M13 and the Sholl counts are the Imaris and TREES measures of
#   Methods 2.7, as stored with the data; none is recomputed here.
#
# Groups. Cholinergic (C): bead-labelled and GFP-positive (mouse) or ChAT-immunopositive
# (macaque); noncholinergic (NC): bead-labelled and GFP-negative (mouse). The code's
# getindices.m counts bead-labelled neurons of unknown ChAT status as noncholinergic; this is a
# reading of NC where the dataset holds such neurons. Only neurons passing quality control.
#
# Statistics (S), Methods 2.8: each feature compared between two groups by a Wilcoxon rank-sum
# test (MATLAB ranksum, two-sided by default), significant at p < 0.05, with no correction for
# multiple comparisons. Averages are mean +- SD.
#
# UMAP procedure (U), Methods 2.8: features z-scored over all neurons in the comparison; PCA;
# components explaining more than 1% of the variance kept; mapped to two UMAP dimensions with
# Meehan's run_umap. Its parameters are not given; the package defaults are a standard choice.
# UMAP is random: 10 seeds (a standard choice), the median result reported with the range.
# Missing feature values are not addressed (open); readings (a) neurons with any missing value
# dropped (MATLAB pca's default, 'Rows','complete'), (b) a missing value set to the feature
# mean (0 after z-scoring). Separation in a UMAP plot is not measured in the paper; the Results
# speak of neurons "on the wrong side of the boundary" (Fig. 2C). The measure is the number of
# neurons misclassified by a linear boundary fitted in the two UMAP dimensions (fitcdiscr,
# resubstitution), and its comparison with the same measure after permuting the group labels
# (1000 permutations, a standard choice).
#
# LDA procedure (L): MATLAB fitcdiscr with its defaults (linear, pooled covariance) on all the
# features of the comparison, missing values as in U. Whether the features are z-scored first
# is not stated; readings z-scored (as in U) and raw. Separation is the resubstitution accuracy
# (the paper plots the fitted neurons). The shuffled control is "when feature values were
# randomly shuffled" (Results 3.2); readings (i) group labels permuted, (ii) each feature's
# values permuted independently across neurons; 1000 shuffles. The "absolute values of the
# weighted differences" (Figs. 5B, 5D, 10C) are open; readings (a) the absolute LDA coefficient
# of each z-scored feature, (b) the absolute product of that coefficient and the difference of
# the group means of the z-scored feature.
#
# Tolerances. Reported means and SDs are given as mean +- SD over neurons. The SD is the spread
# of the neurons, not the uncertainty of the mean, and the dataset should hold the same neurons,
# so the tolerance of a mean or SD is 10% of its absolute value (the protocol's default), not the
# SD. Counts of features use 10% of the count.
#
# Not claimed: the injection sites (Figs. S1-1, S6-2), the bregma positions of the neurons (89%
# between -0.46 and -0.94 mm in mouse), the reconstructions (Figs. 3, 8, S3-1, S9-2, S9-3), the
# average phase plots (Figs. 2B, 7B), and the comparison with published firing rates in the
# Discussion.
