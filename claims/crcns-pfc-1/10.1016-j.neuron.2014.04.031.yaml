- id: fig6e-decoding
  statement: Sound identity is decoded more accurately from A1 ensembles (21 ensembles, 49 neurons)
    than from mPFC ensembles (17 ensembles, 31 neurons), but for neither sound nor region is
    decoding better in one block than the other.
  source: Results, Changes in Baseline Activity Correlate with Changes in Evoked Activity, paragraph
    3; Figure 6E legend
  quote: It could be decoded significantly more accurately (p < 0.001 for the main effect of brain
    region) using A1 responses (n = 21 ensembles of 49 neurons total) than using mPFC responses (n =
    17 ensembles of 31 neurons total). However, for both sounds and both brain regions, the decoding
    was not significantly more accurate during either pitch discrimination (red) or localization
    (blue) trials (p > 0.05 for each pair of bars using a paired t test)
  statistics:
  - about: main effect of brain region
    test: three-way ANOVA on brain region, target sound and block
    p: 0.001
    p_relation: "<"
    n: 21 A1 and 17 mPFC ensembles
  - about: localization against pitch discrimination, each region and sound
    test: paired t test
    p: 0.05
    p_relation: ">"
  expected:
  - quantity: A1 ensembles
    value: 21
    tolerance: 2.1
  - quantity: mPFC ensembles
    value: 17
    tolerance: 1.7
  criterion: As 6-1-evoked/main1.py, main2.py, main4.py and the Supplement (Decoder analysis). An
    ensemble is the responsive units (M4) of one region in one session. Per ensemble, block and sound
    (noise burst side, warble pitch), a logistic regression (scikit-learn, class weights balanced)
