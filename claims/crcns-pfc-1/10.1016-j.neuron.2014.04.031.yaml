  source: Results, Error Trial Analysis, paragraph 2; Figure 3D legend
  quote: in mPFC, the encoding of selection rule was significantly weakened on interference trials,
    as compared with correct trials ... The population response on interference trials is
    significantly increased during the nonpreferred block and decreased during the preferred block (n
    = 57 neurons, paired Mann-Whitney test)
  statistics:
  - test: paired Mann-Whitney test
    p: 0.05
    p_relation: "<"
    n: 57 neurons
  expected:
  - quantity: mPFC neurons in the analysis
    value: 57
    tolerance: 5.7
