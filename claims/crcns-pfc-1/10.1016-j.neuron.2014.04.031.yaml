    (baseline is 0); the preferred block; go and nogo pairs kept apart. The paper reports no test
    or window for this panel. Readings, (a) the mean over units of the mean z-scored rate from 0 to
    3 s after exit, tested against 0 with a one-sample t-test over units (the test of Figure 5C);
    (b) per-bin one-sample t-tests with Benjamini-Hochberg over bins, as for Figure 5C, the claim
