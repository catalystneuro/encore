    mPFC (17 neurons), p < 0.001 in each.
  source: Results, Changes in Baseline Activity Correlate with Changes in Evoked Activity, paragraph
    2; Figure 6C and 6D legends
  quote: For A1 neurons (n = 43), increased anticipatory firing during one block significantly
    correlated (p < 0.001) with increased evoked responses during the same block ... The slope of
    the trend line is close to 1 ... but for auditory-responsive mPFC neurons (n = 17). Again, the
    change in anticipatory activity across neurons correlated closely with the change in evoked
    response (p < 0.001)
  statistics:
  - about: A1
    test: linear regression
    p: 0.001
    p_relation: "<"
    n: 43 neurons
  - about: mPFC
    test: linear regression
    p: 0.001
    p_relation: "<"
    n: 17 neurons
  expected:
  - quantity: A1 neurons
    value: 43
    tolerance: 4.3
  - quantity: mPFC neurons
    value: 17
    tolerance: 1.7
  criterion: As 6-1-evoked/main0.py and 6-3-evokgain/main0.py, main2.py. Evoked counts in the response
    window (M4) on hits of the eight non-cue stimulus pairs, nonrandom 0. Units are dropped when a
    one-sample t-test of all their evoked rates against their hold rate (block-weighted) gives
    p > 0.05. Evoked change is the stimulus-equalized difference, pitch discrimination minus
    localization, of mean evoked rates (mean within each stimulus pair, then over pairs); baseline
