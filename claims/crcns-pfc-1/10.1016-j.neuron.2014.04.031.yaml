    rule-encoding neurons stays above baseline for several seconds on nogo trials and falls below
    baseline on go trials, in both mPFC and A1.
  source: Results, Encoding of Behavioral Choice, paragraph 1; Figure 5D legend
  quote: On nogo trials (gray), the firing rate remained elevated above baseline for at least several
    seconds ... On go trials, the firing rate was suppressed below baseline as the rat moved to the
