    before stimulus onset) than the A1 population (first significantly activated 0.88 s before
    stimulus onset)
  statistics:
  - test: one-sample t test
    p: 0.05
    p_relation: "<"
    n: 76 mPFC and 36 A1 neurons
  expected:
  - quantity: first significant time, mPFC
    value: 2.7
    tolerance: 0.27
    unit: s before stimulus onset
  - quantity: first significant time, A1
    value: 0.88
    tolerance: 0.088
    unit: s before stimulus onset
  criterion: As 5-1-timecourse/main1.py and main2b.py and the Supplement (Timecourse analysis). Hits
    on the eight non-cue stimulus pairs, nonrandom 0, locked to stimulus onset; 50 ms bins from -2.9
    to 2.9 s, 50 ms Gaussian smoothing; each unit's rates z-scored over all bins and stimulus pairs,
    averaged within go and nogo pairs of each block and then over go and nogo; the preferred block
