# Claims for Rodgers & DeWeese (2014), Neuron 82, 1157-1170, "Neural correlates of task switching in
# prefrontal cortex and primary auditory cortex in a novel stimulus selection task for rodents",
# doi:10.1016/j.neuron.2014.04.031, on CRCNS data set pfc-1 (doi:10.6080/K0W66HPJ).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-06,
# protocol as stated in docs/protocol.md (Reader), version pilot-13.
#
# Text read: the version of record with its Supplemental Information, as supplied under paper/ (text
# extracted from the PDF with PyMuPDF): Summary, Introduction, Results, Discussion, Experimental
# Procedures, the legends of Figures 1 to 8, the legends of Figures S1 to S7 and the Supplemental
# Experimental Procedures. The PDF pages were not opened; every number used here is printed in the
# text or a legend. The data descriptor (paper/pfc-1.data-description.txt) was read only to know what
# the data set holds.
#
# Code read: github.com/cxrodgers/Rodgers2014 at commit 390b6089c429877dfea9c56de153bbea0380c20f
# (2016-07-09), linked from the Experimental Procedures. It holds one folder of Python 2 scripts per
# figure (2-1-behavres, 3-1-hold, 3-2-errhold, 3-3-vs_spont, 3-4-RT_vs_hold, 3-5-vidtrack,
# 5-1-timecourse, 5-2-timecourse_exemplars, 6-1-evoked, 6-2-evokmisc, 6-3-evokgain, 7-1-zap, 8-1-model),
# the helper modules (my, kkpandas, ns5_process, vidtrack) and a metadata folder:
# metadata/unit_db.csv (one row per sorted cluster, with an include flag, the region, the auditory
# response class audresp and the response window audresp_t1 to audresp_t2), metadata/sessions_df.csv
# (55 sessions) and metadata/figures_generated_by_each_script.csv (which script makes which panel).
# The code's README says the data set's spike files hold good units and bad clusters alike, and that
# only units listed in unit_db.csv with include True were analyzed. The scripts that set the include
# flag (sort quality, waveform and firing-rate drift checks) and the audresp class and window are not
# in the repository; the table holds their results. Claims on single units therefore take the unit
# set, and where needed the audresp class and window, from that table (data with_labels); where the
# Supplement describes how to recompute them, a recomputation is named as a second reading.
#
# Data the paper used. Male Long-Evans rats trained on an auditory stimulus selection task in a
# three-port box. Each trial, after a center-poke hold (0 to 100 ms in Rats 1 to 3, 250 to 350 ms in
# Rats 4 to 6), a 250 ms stimulus pair is played: a broadband noise burst from the LEFT or RIGHT
# speaker plus a LOW (6 kHz) or HIGH (16 kHz) warble from both. Localization blocks (go left for LEFT,
# nogo for RIGHT) alternate with pitch discrimination blocks (go right for LOW, nogo for HIGH); each
# block is 80 trials, the first 20 cue trials without distractor. Recordings: tetrodes in A1 and/or
# prelimbic mPFC of six rats; the code names them Rat 1 CR12B, Rat 2 CR17B, Rat 3 YT6A, Rat 4 CR20B,
# Rat 5 CR21A, Rat 6 CR24A; 121 mPFC and 99 A1 single units (unit_db.csv include True; CR12B and CR17B
# A1 only). Measured variables: spike times; per trial the stimulus, block, outcome (hit, error,
# wrong_port), cpoke_start, stim_onset, cpoke_stop, choice_made, nonrandom and is_munged flags. Other
# experiments: electrical disruption of mPFC in three further rats (Z1, Z2, Z3; the code names them
# CR25A, CR28A, CR28B; 6, 8 and 8 sessions; 10 Hz pulse trains on 20% of trials); a catch-trial task in
# two rats (CR20B, CR21A; novel distractor on 15% of trials); video scoring of ear positions in three
# sessions (CR24A_121022, CR20B_120602, CR17B_110803); and the results of the network simulation of
# Figure 8. By its description the CRCNS data set holds the spike times and trial files of every
# session, and, under miscellaneous/, the catch-trial, disruption (zap), video (vidtrack) and model
# simulation data.
#
# Shared method details, used by the criteria below.
# M1. Units. The 220 units with include True in metadata/unit_db.csv; region from its region column
#   (which matches the data descriptor's rule on unit numbers). Paper: Supplemental Experimental
#   Procedures, Analysis of waveform variation and firing rate drift; Power analysis (at least 20
#   hold-period spikes).
# M2. Trials. Correct (hit) trials of the non-cue blocks (block 2 localization, block 4 pitch
#   discrimination), nonrandom 0, munged trials dropped, as the code's trial picker "random hits by
#   block" does (modules/my/dataload.py; kkpandas.io.load_trials_info drops munged trials). Trials with
#   a hold under 50 ms are dropped (Supplemental Experimental Procedures, Trial timings).
# M3. Hold-period count and rule encoding (Figure 3C legend; Supplemental Experimental Procedures,
#   Trial timings; 3-1-hold/main0.py, main1.py). Spikes counted in the window ending at stimulus
#   onset, 50 ms long for Rats 1 to 3 and 250 ms for Rats 4 to 6; rate is count over window. A unit
#   encodes the selection rule when an unpaired two-sided Mann-Whitney U-test of its counts in the
#   two blocks gives a Benjamini-Hochberg adjusted p below 0.05. The code runs R's wilcox.test with
#   exact=FALSE and adjusts the p-values of all 220 units of both regions together; the paper does
#   not say whether the adjustment is per region. Readings, (a) pooled over both regions, as the
#   code; (b) per region. The preferred block is the one with the higher mean count.
# M4. Auditory-responsive units (Supplemental Experimental Procedures, Calculation of evoked
#   responses; Figure S5A legend). Readings, (a) audresp in good, weak or sustained in unit_db.csv,
#   with the window audresp_t1 to audresp_t2, as every evoked script of the code uses; (b) recomputed
#   as the Supplement says (spike trains smoothed with a 1 ms Gaussian, every 0.5 ms bin after onset
#   compared by unpaired Mann-Whitney test with all 0.5 ms bins of the 50 ms before onset, the first
#   contiguous run of significant bins is the window, windows under 1 ms discarded). For (b) the
#   paper leaves open the trials used (Figure S5A says all stimuli and trials), the per-bin threshold
#   and any correction (p < 0.05 uncorrected is used here as the standard choice), and how the four
#   of 108 atypical units were judged; (b) is a variant, (a) the main reading.
# M5. Tests. "Paired Mann-Whitney" in the paper is R's wilcox.test with paired=TRUE in the code
#   (my.stats.r_utest), that is the Wilcoxon signed-rank test. Binomial tests are two-sided
#   (scipy.stats.binom_test). Tolerances are 10% of the reported value unless a claim says otherwise.
schema_version: 2
dataset:
  archive: crcns
  id: pfc-1
  doi: 10.6080/K0W66HPJ
paper: doi:10.1016/j.neuron.2014.04.031
claims:
- id: fig2a-above-chance
  statement: Trained rats perform significantly above 50% correct in both localization and pitch
    discrimination blocks in the recording sessions, with a median of 698 trials per session; the
    best rats reach about 85% in both blocks. Sessions not above 50% in either block (4 of 55) were
    discarded.
  source: Results, A Novel Behavioral Task for Rodents, paragraph 2; Figure 2A; Supplemental
    Experimental Procedures, Chance performance on the task
  quote: Trained rats performed many trials per session (median, 698). We verified that the rats
    were performing significantly above 50% in both blocks ... Our best rats' typical performance
    during recording sessions was approximately 85% in both blocks ... although some sessions failed
    the first criterion and were discarded (p > 0.05 for 4/55 sessions)
  expected:
  - quantity: median trials per session
    value: 698
    tolerance: 69.8
  - quantity: best rat's typical performance in each block
    value: 85
    tolerance: 8.5
    unit: percent
  criterion: Performance per session and block as 2-1-behavres/perf.py computes it, hits over hits
    plus errors plus wrong-port trials, non-cue blocks 2 and 4, nonrandom 0; sessions as in
    2-1-behavres/main00.py (sessions_df.csv include True, less the catch-trial session
    CR20B_120613_001_behaving). Each session and block is tested against 0.5 with a binomial test
    (Supplement). Reproduced when at most 4 of the sessions fail in either block, the median trial
    count is within tolerance and, for at least one rat, the median over its sessions is within
    tolerance of 85% in both blocks. Open, and named as readings. The trials counted per session,
    (a) all trials performed (outcome not future_trial), (b) after dropping munged and nonrandom
    trials. Which 55 sessions the paper's count refers to, (a) the 55 of sessions_df.csv, all marked
    include, so the four failing sessions may be among them; (b) a set before the cut, so that none
    of the data set's sessions should fail. Under (b) the claim is reproduced only when no analysed
    session fails.
  depends_on:
  - unit-table-link
- id: figs1a-go-better-than-nogo
  statement: Performance is typically better on go trials than on nogo trials.
  source: Results, A Novel Behavioral Task for Rodents, paragraph 2; Figure S1A
  quote: Performance was typically better on go trials than on nogo trials
  criterion: As 2-1-behavres/main02.py, per rat the mean over sessions of the performance on go and
    on nogo trials in each block (perf.py, nonrandom 0). Reproduced when go exceeds nogo in at least
    7 of the 12 rat and block pairs (a majority, reading "typically"); the pairs are reported.
  depends_on:
  - fig2a-above-chance
- id: fig2d-block-switch
  statement: After each block change rats switch rapidly to the new target; performance dips briefly
    during the cue trials at the start of a block and recovers within a few trials.
  source: Results, A Novel Behavioral Task for Rodents, paragraph 2; Figure 2D legend
  quote: After each block change, rats rapidly and correctly switched to selecting the new target
    sound ... Performance briefly dips during cue trials at the beginning of a block but recovers
    within a few trials
  criterion: As 2-1-behavres/main04.py (Figure 2D). Sessions as fig2a-above-chance, nonrandom 0, the
    first block of each session dropped; trials folded on their position in the 160-trial cycle of a
    localization and a pitch discrimination block; the fraction of hits at each position, averaged
    over sessions weighted by trial counts. The paper gives no number for the dip or for "a few
    trials"; read here, as a choice, as the hit fraction on the first trial of each block lying below
    the mean over that block's non-cue trials (21 to 80) and reaching that mean within the first 10
    trials of the block (within 5 shown as a variant). Reproduced when this holds for both blocks.
  depends_on:
  - fig2a-above-chance
- id: iti-median
  statement: The median intertrial interval is 4.0 s (interquartile range 2.7 to 5.3 s).
  source: Results, Within-Trial Timescale of the Encoding of the Selection Rule, paragraph 1
  quote: Across the data set, the median intertrial interval was 4.0 s (interquartile range, 2.7-5.3
    s)
  expected:
  - quantity: median intertrial interval
    value: 4.0
    tolerance: 0.4
    unit: s
  - quantity: first quartile
    value: 2.7
    tolerance: 0.27
    unit: s
  - quantity: third quartile
    value: 5.3
    tolerance: 0.53
    unit: s
  criterion: Neither the paper nor the code defines the interval. Readings, (a) time between
    consecutive stimulus onsets; (b) time between consecutive center-poke starts; each over all
    trials of the sessions with included units, pooled. Reproduced when under one reading the
    median and both quartiles are within tolerance.
  depends_on:
  - unit-table-link
- id: fig3c-pfc-rule-encoding
