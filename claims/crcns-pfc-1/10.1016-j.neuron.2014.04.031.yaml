    unpaired Mann-Whitney test between blocks in each bin, p-values adjusted by Benjamini-Hochberg
    over all bins and units together (main2.py, main3.py); the interval is the contiguous run of
    significant bins, with the preferred direction, that contains the bin just before stimulus
    onset, and its first bin is the onset; median over units per region (main4.py). The tolerance is
    one 50 ms bin, the resolution of the measure. The window differs, the Results say up to 3 s
    before and after onset, the code uses 5 s; the Results' 3 s is the main reading and 5 s a
    variant. Reproduced when both medians are within tolerance and both exceed 0.35 s, the longest
