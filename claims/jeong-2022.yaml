- id: fig4jl-extinction-cue-response-positive
  statement: The dopamine cue response remains significantly positive well after animals stop
    licking to the cue in extinction (Test 6).
  source: Figure 4J to 4L; Results, Tests 3-7, paragraph 3
  quote: As predicted by ANCCR but not RPE, dopamine cue response remained significantly positive
    well after animals cease to behaviorally respond to the cues (Fig 4J-L)
  data: with_labels
  depends_on:
  - session-day-link
  - fig4kl-extinction-abrupt-behavior
  criterion: Dopamine measure as in fig4ef-dopamine-leads-behavior, extinction sessions of the
    code's day lists. The paper reports no test for "significantly positive". Readings are (a) a
    two-tailed one-sample t-test over the 7 animals of the mean CS+ response in the last
    extinction session against 0; (b) the same over all CS+ trials after the lick change trial of
    fig4kl-extinction-abrupt-behavior; (c) per animal, a one-sample t-test over the trials of the
    last extinction session, positive at p < 0.05 in all 7. Reproduced when every reading gives a
    positive response at p < 0.05.
- id: fig4p-background-faster-decay
  statement: When unpredicted rewards are added during the ITI, the dopamine cue response stays
    positive but decreases faster over trials than during extinction (Test 7).
  source: Figure 4M to 4P; Results, Tests 3-7, paragraph 4
  quote: The dopamine cue response remained significantly positive but decayed across trials faster
    than during extinction (Fig 4M-P).
  statistics:
  - about: background rewards against extinction
    test: paired t-test
    statistic: t(6) = -3.51
    p: 0.0126
    n: 7 animals
  data: with_labels
  depends_on:
  - session-day-link
  criterion: analysis/fig4/cumsum_bgdrw_vs_extinction.m. Per animal and condition (Experiment 5,
    background rewards; Experiment 4, extinction), the 2 sessions before startday and those to
    endday; CS+ response as in fig4ef-dopamine-leads-behavior; 140 trials starting 50 trials
    before the condition starts; cumulative sum divided by the sum of the first 50. What the
    paired t-test compares is not in the Methods, legend or code; readings are (a) the normalized
    cumulative sum at trial 140, (b) its mean over the 90 trials after the change, (c) the mean
    post-change response divided by the mean of the 50 pre-change trials. Reproduced when, under
    every reading, background is below extinction at p < 0.05 (two-tailed paired t-test) and the
    mean background cue response over the 90 post-change trials is above 0 by a two-tailed
    one-sample t-test over animals at p < 0.05 (the paper gives no test for "remained
    significantly positive"; this one is set here).
- id: fig5d-intermediate-cue-positive
  statement: In the trial-less task, the dopamine response to an intermediate cue (one arriving
    before the previous cue's reward) is positive but weaker than the response to the previous cue
    (Test 8).
  source: Figure 5C and 5D; Results, Test 8, paragraph 3
  quote: We did not observe any negative dopamine response to the intermediate cue regardless of
    how baseline was measured, and instead observed a positive but weaker response
  statistics:
  - about: ratio of intermediate to previous cue response against zero
    test: one sample t-test
    statistic: t(6) = 6.64
    p: 5.6e-4
    n: 7 animals
  data: with_labels
  depends_on:
  - session-day-link
  criterion: Methods, Data analysis, Experiment 6, and analysis/fig5/intermediate_rsp_trialless.m.
    Per animal, the Experiment 6 sessions from learnedday to endday (sessions after the animals
    lick in anticipation, Methods). An intermediate cue follows the previous cue by less than the
    mean cue-reward delay. Excluded (code), any cue of a run of three where both intervals are
    short; pairs 0.5 s apart or less; and intermediate cues 2.5 to 3 s after the previous cue
    (within 0.5 s of its reward, Methods). Cue response is the AUC from 0 to 0.5 s after the cue
    minus the AUC 0.5 s before the previous cue, for both cues of a pair (unsmoothed). Per session
    the mean over pairs, then the mean over sessions; the ratio intermediate over previous per
    animal; two-tailed one-sample t-test against 0. Reproduced when t > 0 at p < 0.05 and the mean
    ratio is below 1; partially reproduced when the ratio is positive but not below 1.
- id: fig5d-intermediate-reward-larger
  statement: The dopamine response to the reward paired with an intermediate cue is larger than the
    response to the reward of the previous cue (the ratio is above 1).
  source: Figure 5D, right
  quote: and reward response (One sample t test against a null of one; t(6) = 2.95; two-tailed p
    value = 0.0256; n=7 animals)
  statistics:
  - about: ratio of intermediate to previous reward response against one
    test: one sample t-test
    statistic: t(6) = 2.95
    p: 0.0256
    n: 7 animals
  data: with_labels
  depends_on:
  - session-day-link
  criterion: Pairs and baseline as in fig5d-intermediate-cue-positive. Reward response is the AUC
    from 0 to 0.5 s after the first lick after the reward (smoothed trace, code) minus the same
    baseline; rewards whose first lick follows the next reward are dropped (Methods; code). Per
    animal the ratio of session-averaged responses, intermediate over previous; two-tailed
    one-sample t-test against 1. Reproduced when the mean ratio exceeds 1 at p < 0.05.
- id: figs11de-intermediate-cue-local-baseline
  statement: With the baseline taken immediately before the intermediate cue and the response
    measured as a peak, the intermediate cue response is still positive.
  source: Figure S11D and S11E; Methods, Experiment 6, paragraph 2
  quote: Here, we measure baseline as the dopamine fluorescence immediately prior to the
    intermediate cue delivery, as opposed to the baseline prior to the first cue in Fig 5C, D. Cue
    response was defined as baseline subtracted peak response. The intermediate cue response was
    still positive.
  statistics:
  - test: one sample t-test of the cue response ratio
    statistic: t = 10.42
    p: 4.6e-5
    n: 7 animals
  data: with_labels
  depends_on:
  - session-day-link
  criterion: Sessions and pairs as in fig5d-intermediate-cue-positive. Response, the peak dF/F
    after each cue minus the dF/F immediately before it (Methods); the code holds no script for
    this panel. The peak window and the baseline are not fixed; readings are peak over (a) 0 to
    0.5 s or (b) 0 to 1 s after the cue, each with baseline (i) the last sample before the cue or
    (ii) the mean over the 0.5 s before it. Ratio intermediate over previous per animal,
    two-tailed one-sample t-test against 0. Reproduced when every reading gives t > 0 at p <
    0.05.
- id: fig6b-no-backpropagation
  statement: During initial cue-reward learning, dopamine activity does not shift backward from
    just before reward to the cue; the late (pre-reward) response does not differ from the early
    (cue) response in the first 100 trials (Test 9).
  source: Figure 6A and 6B; Results, Tests 9-11, paragraph 2; Supplementary Note 9
  quote: Our observations were not consistent with a backpropagating bump of activity and were
    instead consistent with an increase in cue response over trials of learning (Fig 6B)
  statistics:
  - about: late minus early normalized response, first 100 trials
    test: paired t-test
    statistic: t = -0.16
    p: 0.8771
    n: 7 animals
  data: with_labels
  depends_on:
  - session-day-link
  criterion: Methods, Experiments 2-5, paragraph 5, and analysis/fig6/backpropagation_pavlovian.m.
    Per animal, Experiment 2 sessions startday to endday, CS+ trials in order, the first 400.
    Early is the AUC from 0 to 1 s after cue onset and late from 2 to 3 s (the 1 s before
    reward). The Methods subtract a baseline (the 1 s before CS+ onset, the Experiments 2-5
    baseline); the code does not, run as a variant. Both are divided by the mean early response
    over trials 351 to 400 (code, where the Methods say "last 50 trials"). The animal's value is
    the mean of late minus early over the first 100 trials over that normalizer. A claim of
    absence, judged on the paper's test, a two-tailed paired t-test (one-sample on the
    differences) over 7 animals. Reproduced when p >= 0.05; not reproduced when late minus early
    differs significantly. The mean and t are reported.
- id: fig6d-cues-increase-together
  statement: In sequential conditioning without inhibition, the dopamine responses to CS2 and CS1
    increase together early in learning (no difference in the first 50 trials) (Test 10).
  source: Figure 6C and 6D; Results, Tests 9-11, paragraph 2
  quote: Consistent with ANCCR, we experimentally found that cue2 and cue1 responses increased
    together early in learning prior to separating later in learning (Fig 6D).
  statistics:
  - about: CS2 minus CS1 normalized response, early in learning
    test: paired t-test
    statistic: t = -0.03
    p: 0.9752
    n: 7 animals
  criterion: Methods, Experiment 7 analysis, and analysis/fig6/backpropagation_sequential.py.
    The 7 control animals; their sequential conditioning sessions in Day order; CS1 and CS2 the
    odd and even code-15 events; AUC from 0 to 1 s after each cue. The Methods subtract a baseline
    the code does not apply (variant); its window is not given, readings (i) the 1 s or (ii) the
    1.5 s before CS1 (the Fig 6I baseline). The normalizer is the mean CS1 response over trials
    151 to 200 (code; Methods "last 50 trials" of the first 200). Value per animal, the mean of
    CS2 minus CS1 over the first 50 trials over the normalizer (code). A claim of absence, judged on
    the paper's test, a two-tailed paired t-test over 7 animals. Reproduced when p >= 0.05; not
    reproduced otherwise. The mean and t are reported.
- id: fig6d-cs2-below-cs1-late
  statement: Later in sequential conditioning, the CS2 response falls below the CS1 response (the
    two separate).
  source: Figure 6D, right; Results, Tests 9-11, paragraph 2
  quote: cue2 and cue1 responses increased together early in learning prior to separating later in
    learning
  depends_on:
  - fig6d-cues-increase-together
  criterion: Responses as in fig6d-cues-increase-together; per animal the mean CS2 response over
    trials 151 to 200 divided by the mean CS1 response over the same trials (code, Fig 6D right).
    The paper gives no test. Set here, reproduced when the mean ratio over the 7 animals is below 1
    with a two-tailed one-sample t-test against 1 at p < 0.05; partially reproduced when the mean
    is below 1 without significance.
- id: fig6g-inhibition-magnitude
  statement: Optogenetic inhibition of VTA dopamine neurons strongly suppresses NAcc dopamine
    during the CS2-to-reward delay in DAT-Cre mice (to about -0.6 times the reward response on day
    1) and reduces their reward response, compared with controls.
  source: Figure 6F and 6G; Results, Tests 9-11, paragraph 2; Supplementary Note 10
  quote: we first verified robust inhibition of mesolimbic dopamine release during the cue2→reward
    delay in the experimental group (~0.6 times the reward response on day 1 of conditioning)
  statistics:
  - about: dopamine in the last 0.5 s before reward, DAT-Cre against controls
    test: two sample t-test
    statistic: t = -5.74
    p: 1.3e-4
    n: 13 animals
  - about: reward response on day 1, DAT-Cre against controls
    test: two sample t-test
    statistic: t = -3.99
    p: 0.0021
    n: 13 animals
  expected:
    quantity: DAT-Cre mean dopamine in the last 0.5 s before reward, over the day 1 reward response
    value: -0.6
    tolerance: 0.06
  criterion: Methods, Experiment 7 analysis, and analysis/fig6/measure_inhibition_sequential.py.
    6 DAT-Cre (M2 to M7) and 7 controls; the random reward session and the first conditioning
    session (the first two in Day order). Baseline, the mean AUC over the 0.5 s before CS1 (before
    the reward in the random reward session, code). Inhibition, the mean AUC from 1 to 1.5 s after
    CS2 onset minus baseline (the last 0.5 s before reward; the code's bins run from -0.5 to 1.5
    s, the Methods' to 2 s; this bin is in both), divided by the reward response of the same
    session. Reward response, the mean AUC over 1 s after the first lick after reward minus
    baseline (Methods; the code's 0.5 s is a variant). Day 1 reward response over the random reward
    session's. Two-tailed two-sample t-tests. The ratio of a 0.5 s AUC to a 1 s AUC depends on the
    window lengths, and Supplementary Note 10 gives the -0.6 as the dopamine level at 1.5 s after
    inhibition onset relative to the reward response magnitude. The readings for the expected value
    are (a) the AUC ratio with the Methods' 1 s reward window, (b) the AUC ratio with the code's
    0.5 s reward window (equal windows, as in measure_inhibition_sequential.py), (c) the ratio of
    mean dF/F levels (each AUC over its window length) with the 1 s reward window; the value holds
    if it matches under any of them. Reproduced when both tests give DAT-Cre lower at p < 0.05 and
    the DAT-Cre mean inhibition is within tolerance (10% of 0.6) under one reading; partially
    reproduced when the tests hold and the mean is outside tolerance under all.
