    anticipatory licking and acquires a positive dopamine response to CS1, both increasing over
    sessions as in controls (Test 11).
  source: Figure 6I; Results, Tests 9-11, paragraph 2; Table S1
  quote: Consistent with ANCCR, we observed that every experimental animal learned the task and
    that mesolimbic dopamine acquired positive responses to cue1 in all experimental animals (Fig
    6I).
  statistics:
  - about: CS1 response across sessions, wild type
    test: linear regression
    statistic: t = 5.49
    p: 4.35e-6
    n: 35 sessions from 7 WT animals
  - about: CS1 response across sessions, DAT-Cre
    test: linear regression
    statistic: t = 2.55
    p: 0.0166
    n: 30 sessions from 6 DAT-Cre animals
  - about: anticipatory licks across sessions, wild type
    test: linear regression
    statistic: t = 3.61
    p: 9.9e-4
    n: 35 sessions from 7 WT animals
  - about: anticipatory licks across sessions, DAT-Cre
    test: linear regression
    statistic: t = 4.92
    p: 3.40e-5
    n: 30 sessions from 6 DAT-Cre animals
  criterion: Methods, Experiment 7 analysis, and analysis/fig6/learnign_curve_sequential.py. Per
    animal, conditioning sessions in Day order, the first three and the last two. CS1 response,
    AUC from 0 to 1.5 s after CS1 minus AUC from -1.5 to 0 s, session mean, divided by the mean
    reward response of the first conditioning session (AUC 0 to 1.5 s after the first lick within
    5 s of reward minus the same baseline). Licks, count from 0 to 3 s after CS1 minus count from
    -3 to 0 s, session mean. Per group, linear regression of the values on session position 0 to
