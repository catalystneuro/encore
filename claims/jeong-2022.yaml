    delay), and TDRL does not.
  source: Figure S5C and S5D; Results, A retrospective causal learning algorithm, paragraph 2
  quote: C. Simulations demonstrating that TDRL cannot explain the timescale invariance, but that
    retrospective causal learning explains these results (Methods).
