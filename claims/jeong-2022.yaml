# Claims for Jeong, Taylor, Floeder et al. (2022), Science 378, eabq6740, on dandiset 000351.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23, under
# docs/protocol.md, version pilot-10.
#
# Text read: the accepted author manuscript in PubMed Central (PMC9910357, NIHMS1867344), main
# text and figure legends, and its supplement (NIHMS1867344-supplement-Supplementary_information.docx,
# as text): legends of Figs S1 to S15, Supplementary Notes 1 to 10, Materials and Methods, and
# Table S1 (statistical results). No PDF was available, so no figure was seen. The equations of
# the Methods (the Weibull and constant models, the AIC, the model equations) are lost from the
# text; where a criterion needs one, it is taken from the code. The text read may predate a later
# correction of Fig S13 (see figs13-ramping).
#
# Code read: github.com/namboodirilab/ANCCR at commit cff44144e60a4313a30ffbb4bb8a1f3dd398b525
# (2025-08-28). The analysis scripts (analysis/, Matlab for Experiments 1 to 6, Python for
# Experiment 7) were last changed on 2022-11-07, before publication. The simulations
# (simulation/, Matlab) use functions/calculateANCCR.m (last changed 2022-11-07); a second model
# version (calculateANCCR_v2.m, 2023-02-13) and corrected Fig S13 ramping scripts (2023-05-10)
# were added after publication. The paper also cites a Zenodo record of the code (record
# 7302777, Version 1, 2022). The scripts run the tests of Figs 3E, 3G, 5D, 6B, 6G, 6I and S10B;
# the other tests below are known only from Table S1 and the legends.
#
# Data the paper used (Methods, Subjects and Behavioral task). Head-fixed, water-restricted
# mice; dopamine release in the nucleus accumbens core measured with dLight1.3b by fiber
# photometry (405 nm isosbestic and 470 nm signals, Doric system demodulated to 120 Hz or
# pyPhotometry at 130 Hz; dF/F = (470 - fitted 405) / fitted 405); licks recorded.
# - Experiment 1, random rewards: 8 wild type mice (six males; one male only in Experiment 1),
#   experimentally naive, 3 ul of 15% sucrose at exponential inter-reward intervals (IRI, mean
#   12 s), about 100 rewards per session, 4 to 11 sessions. Code subjects HJ_FP_M2, M3, M4, F1, F2,
#   M6, M7, M8; only sessions before the first session named "30s" are used (12 s IRI).
# - Experiments 2 to 5, the same animals but M8 (n = 7): Pavlovian conditioning with a 2 s CS+
#   (reward after a 1 s trace) and a CS- (12 kHz continuous or 3 kHz pulsed tone), ITI truncated
#   exponential (mean 30 s, max 90 s), 100 trials per session (Experiment 2); then the cue
#   lengthened to 8 s (Experiment 3), background rewards every 6 s on average during the ITI with
#   40 trials per session (Experiment 5), back to Experiment 3, then extinction (Experiment 4).
# - Experiment 6, the same 7 animals: "trial-less" conditioning, a 250 ms cue at exponential
#   inter-cue intervals (mean 33 s, 0.25 to 99 s), reward 3 s after each cue.
# - Experiment 7, a different set: 7 DAT-Cre mice with stGtACR2 in VTA and 7 wild type controls,
#   one random reward session, then sequential conditioning (CS1 1 s, 0.5 s gap, CS2 1 s, 0.5 s
#   trace, reward; ITI mean 60 s), 473 nm light to VTA from CS2 onset to reward in both groups,
#   about 50 trials per session. One DAT-Cre mouse is excluded (Fig S12D). Code subjects
#   HJ-FP-datHT-stGtACR-M2 to M8 (M8 the excluded one), HJ-FP-datWT-stGtACR-F1 and
#   HJ-FP-WT-stGtACR-F1, F2, F3, M1, M2, M3 (the 7 controls).
# - Fig S8L: 6 further wild type mice (four males), random rewards at IRI 6, 12 and 30 s, two
#   sessions each (code subjects F1, F2, M1, M2, M3, M4 of a folder "DB_longITI_C1_").
#
# Outside material. The dandiset's description points to a spreadsheet, "Subject and session
# information" (docs.google.com/spreadsheets/d/1pmpQ5JFhg4Q7h18DQYifjNrW17HtaoPHBt2vJF4mxiU), that
# names the animals and sessions used for each figure; it was not read here. The Matlab scripts
# select each animal's sessions by "Day" numbers written into the code (startday, endday,
# learnedday), and the Python loader (functions/load.py, load_dandi_url) reads those Day numbers
# from the dandiset's file paths. Claims that need these lists use data with_labels and depend on
# session-day-link.
#
# Fixed for all claims, from the code where the Methods are silent:
# - Signals and events: dF/F is processing/photometry/dff and events are acquisition/eventlog of
#   each NWB file (load.py, the Experiment 7 scripts). Event codes (eventfrompavlovian.m and the
#   scripts): 5 lick, 7 random or background reward, 10 cue-associated reward (with a no-solenoid
#   flag marking omitted rewards), 15 and 16 the two cues, 14 trial end, 0 session end. In
#   Experiment 7 code 15 marks both cues; odd occurrences are CS1 and even ones CS2. The CS+ is
#   the cue whose reward is delivered, taken from the first session of the condition.
# - AUC is the sum of the dF/F samples in the window times the mean sample interval
#   (aucsignal.m, plot.py calculate_auc); aucsignal2event.m (Experiment 1) leaves out the
#   interval, a constant scale per session. A baseline-subtracted response is the window AUC minus
#   the baseline AUC, each over windows of equal length (in the Matlab scripts the 2 s cue AUC is
#   halved before subtracting a 1 s baseline). The Experiment 2 to 5 cue traces and the
#   Experiment 6 reward traces are smoothed before the AUC with a Gaussian kernel of sigma 10
#   samples, 50 samples wide (alignsignal2event.m, resolution 10), a step the Methods do not name;
#   other traces are not smoothed.
# - The first lick after a reward is the first lick before the next reward (Experiment 1), before
#   the trial end or 1 s before the next cue (Experiments 2 to 5), without a limit (Experiment 6),
#   or within 5 s (Experiment 7, 3 s in measure_inhibition_sequential.py).
#
# Open for all claims: the paper names no significance level. The tests below are two-tailed as
# Table S1 prints them, at p < 0.05, a standard choice; the paper treats p = 0.0531 (Fig 4L) as
# no claim of a difference. Where Methods and code disagree, the Methods give the main reading and
# the code's choice is run as a variant. Where a criterion names readings of a method detail that
# neither fixes, every reading is run; the outcome is the one they all give, and the claim is
# blocked as methods_underspecified when they differ. Where readings are named for what a reported
# number means, the claim holds if it matches under any of them.
schema_version: 2
dataset:
  archive: dandi
  id: "000351"
paper: doi:10.1126/science.abq6740
claims:
- id: session-day-link
  kind: link
  statement: The subjects and "Day" numbers that the paper's analysis code names for each
    experiment are sessions of the dandiset, so that the code's selection of sessions can be
    applied to it.
  source: Data and materials availability; README.md and functions/load.py of
    github.com/namboodirilab/ANCCR at commit cff4414; dandiset description (related resource
    "Subject and session information")
  data: with_labels
  criterion: Subject names are matched with "_" read as "-" (HJ_FP_M2 as HJ-FP-M2), and sessions
    by the number after "Day" in the file path, as load_dandi_url does. The link holds
    (reproduced) when every subject of the Matlab scripts' lists exists in the dandiset and every
    Day number from startday to endday (and each learnedday) of analysis/fig4/cumsum_pavlovian.m,
    analysis/fig4/cumsum_bgdrw_vs_extinction.m, analysis/fig5/intermediate_rsp_trialless.m,
    analysis/fig6/backpropagation_pavlovian.m, analysis/figS10/cue_acquisition.m and
    analysis/figS10/omission.m is a session of that subject of the task the script names
    (Pavlovian or Poisson), with the cue durations and reward schedule of the condition (2 s cue
    for Experiment 2, 8 s cue for Experiment 3, background rewards for Experiment 5, omitted
    rewards for Experiment 4, a 250 ms cue for Experiment 6). Partially reproduced when the
    subjects match and at least 90% of the listed days do; not reproduced otherwise. The
    spreadsheet named in the dandiset's description is compared with these lists where the
    author can pin a copy of it.
- id: methods-session-counts
  statement: Animals were trained for 7 +/- 2.1 sessions of random rewards, 13.3 +/- 2.7 sessions
    of initial conditioning, 4.3 +/- 0.8 sessions with the 8 s cue, 8.1 +/- 2.5 sessions with
    background rewards and 2.6 +/- 0.8 sessions of extinction; in sequential conditioning, 5.6 +/-
    2.4 (wild type) and 7.1 +/- 0.7 (DAT-Cre) sessions (mean +/- SD).
  source: Methods, Behavioral task, paragraphs 1 to 5
  quote: Animals were trained on Experiment 1 for 4-11 sessions (7 ± 2.1 sessions, mean ± std) ...
    (13.3 ± 2.7 sessions in total) ... (4.3 ± 0.8 sessions) ... (8.1 ± 2.5 sessions) ... (2.6 ± 0.8
    sessions) ... (5.6 ± 2.4 and 7.1 ± 0.7 sessions for WT and DAT-Cre, respectively)
  data: with_labels
  depends_on:
  - session-day-link
  expected:
  - quantity: Experiment 1 sessions per animal, mean over 8 animals
    value: 7
    tolerance: 2.1
  - quantity: Experiment 2 sessions per animal, mean over 7
    value: 13.3
    tolerance: 2.7
  - quantity: Experiment 3 sessions (first round, 8 s cue) per animal, mean over 7
    value: 4.3
    tolerance: 0.8
  - quantity: Experiment 5 sessions per animal, mean over 7
    value: 8.1
    tolerance: 2.5
  - quantity: Experiment 4 sessions per animal, mean over 7
    value: 2.6
    tolerance: 0.8
  - quantity: Experiment 7 sequential conditioning sessions, wild type, mean over 7
    value: 5.6
    tolerance: 2.4
  - quantity: Experiment 7 sequential conditioning sessions, DAT-Cre, mean over 7
    value: 7.1
    tolerance: 0.7
  criterion: Tolerances are the stated SDs. Sessions are counted per animal from the dandiset's
    session labels; for Experiments 2 to 5 the conditions are those of the code's Day ranges
    (startday to endday, which give these means and SDs; the 3 pre-condition sessions of
    Experiment 3 and the 1 before extinction are not counted). Experiment 1 counts the 12 s IRI
    random reward sessions of the 8 animals; Experiment 7 counts all sequential conditioning
    sessions after the random reward session. Reproduced when all seven means are within
    tolerance; partially reproduced for five or six.
- id: exp1-excluded-rewards
  statement: In Experiment 1, 22.6 +/- 2.4% of rewards came less than 3 s after the previous
    reward and 5.7 +/- 0.1% had no lick before the next reward; both were excluded.
  source: Methods, Data analysis, Experiment 1, paragraph 2
  quote: we excluded rewards with less than 3 s IRI from the previous reward (22.6±2.4%) for the
    above analyses. Rewards without lick until the next reward (5.7±0.1%) were also excluded from
    analyses.
  expected:
  - quantity: Rewards with IRI under 3 s, percent
    value: 22.6
    tolerance: 2.4
    unit: "%"
  - quantity: Rewards with no lick before the next reward, percent
    value: 5.7
    tolerance: 0.1
    unit: "%"
  criterion: Tolerances are the stated spreads. Per session, the fraction of rewards (the first of
    the session not counted as short) with IRI under 3 s, and the fraction with no lick before the
    next reward or the session end, as in analysis/fig3/corr_randomrewards.m (out_bgd,
    out_nolick), over the 12 s IRI sessions of the 8 animals. The paper does not say how the
    percentages are averaged; readings are (a) the mean over animals of each animal's mean over
    sessions, (b) the mean over all sessions pooled. Reproduced when both values fall within
    tolerance under one reading; partially reproduced when one does.
- id: fig3e-reward-response-increases
  statement: In experimentally naive mice given unpredicted sucrose, the dopamine response to
    reward increases with the number of rewards experienced, in every animal (Test 1).
  source: Figure 3D and 3E; Results, Tests 1 and 2, paragraph 3
  quote: Every animal showed an increasing sucrose response that reached a high positive asymptote.
  statistics:
  - test: one sample t-test against zero, of per-animal correlations
    statistic: t(7) = 4.40
    p: 0.0031
    n: 8 animals
  criterion: Methods, Data analysis, Experiment 1, and analysis/fig3/corr_randomrewards.m. Per
    animal, the 12 s IRI random reward sessions in order; rewards excluded when the IRI from the
    previous reward is under 3 s or no lick follows before the next reward (the first reward of a
    session is kept). Reward response is the AUC of dF/F from -0.5 to 1 s around the first lick
    after the reward minus the AUC from -2 to -0.5 s. Reward number is the reward's position among
    all of the animal's rewards, excluded ones counted (code). Pearson r between response and
    reward number over all the animal's sessions pooled; two-tailed one-sample t-test of the 8
    values against 0. Reproduced when t > 0 with p < 0.05 and r > 0 in all 8 animals; partially
    reproduced when the t-test holds and r > 0 in fewer than 8.
- id: fig3g-response-iri-positive
  statement: The dopamine response to an unpredicted reward is positively correlated with the
    interval since the previous reward (Test 2).
  source: Figure 3G; Results, Tests 1 and 2, paragraph 5
  quote: The experimentally observed correlation between dopamine response to sucrose and the
    previous IRI was positive, thereby being consistent with ANCCR but not RPE.
  statistics:
  - test: one sample t-test against zero, of per-animal correlations
    statistic: t(7) = 5.95
    p: 5.7e-4
    n: 8 animals
  criterion: Rewards, exclusions and response as in fig3e-reward-response-increases. Per session,
    Pearson r between response and the previous IRI (the first reward of a session has none);
    per animal, the mean of r over its sessions; two-tailed one-sample t-test of the 8 means
    against 0 (analysis/fig3/corr_randomrewards.m). Reproduced when t > 0 and p < 0.05.
- id: figs8k-iri-correlation-stable
  statement: The positive correlation between reward response and previous IRI holds across
    sessions and does not change over the first 7 sessions.
  source: Figure S8K; Results, Tests 1 and 2, paragraph 5; Table S1
  quote: The correlation between dopamine response to a reward and the previous IRI remains
    positive across sessions.
  statistics:
  - about: change of the per-session correlation over the first 7 sessions
    test: linear regression
    statistic: t = -0.04
    p: 0.9707
    n: 50 sessions from 8 animals
  depends_on:
  - fig3g-response-iri-positive
  criterion: The per-session r of fig3g-response-iri-positive, for sessions 1 to 7 of each animal.
    A claim of absence, judged on the paper's test, a linear regression of r on session number
    over the pooled sessions (the paper's n is 50). Reproduced when the slope has p >= 0.05 and the
    mean r over animals is above 0 in each of sessions 1 to 7 (legend; Results "consistently
    positive"); not reproduced when the slope is significant. Slope, its t and the per-session
    means are reported.
- id: figs8b-lick-rates-constant
  statement: Total, consummatory and non-consummatory lick rates do not change across the first 7
    random reward sessions.
  source: Figure S8B; Supplementary Note 3, point 1; Table S1
  quote: The lick rates generally remained constant across repeated sessions.
  statistics:
  - about: total lick rate across sessions
    test: linear regression
    statistic: t = -0.79
    p: 0.4389
    n: 50 sessions from 8 animals
  - about: consummatory lick rate across sessions
    test: linear regression
    statistic: t = -0.20
    p: 0.8397
    n: 50 sessions from 8 animals
  - about: non-consummatory lick rate across sessions
    test: linear regression
    statistic: t = -0.58
    p: 0.5618
    n: 50 sessions from 8 animals
  criterion: Methods, Data analysis, Experiment 1, paragraph 2, and
    analysis/figS8/lick_rsp_randomrewards.m with functions/classifylicks.m. A lick bout is a run of
    licks less than 1 s apart; consummatory licks are those of the first bout after each reward
    (to its end, the next reward or the session end, as classifylicks.m). Per session, total rate
    = all licks over session duration; consummatory rate = consummatory licks over the summed
    consummatory bout durations; non-consummatory rate = the other licks over the rest of the
    session. A claim of absence, judged on the paper's test, a linear regression of each rate on
    session number (1 to 7) over the pooled sessions. Reproduced when all three slopes have p >=
    0.05; not reproduced when any is significant. Slopes and t are reported.
- id: figs8d-consummatory-lick-uncorrelated
  statement: The consummatory lick rate after a reward is not correlated with the dopamine response
    to that reward.
  source: Figure S8C and S8D; Table S1
  quote: The consummatory lick rate is not correlated with dopamine reward response.
  statistics:
  - test: one sample t-test of per-animal correlations
    statistic: t = 0.23
    p: 0.8245
    n: 8 animals
  criterion: analysis/figS8/lick_rsp_randomrewards.m. Per reward, consummatory licks after it
    divided by its consummatory bout length; reward response as in
    fig3e-reward-response-increases; rewards excluded when the IRI is under 3 s or the lick bout
    runs on from the previous reward (the code's separatebout test). Per animal, Pearson r over all
    its sessions pooled. A claim of absence, judged on the paper's test, a two-tailed one-sample
    t-test of the 8 r against 0. Reproduced when p >= 0.05; not reproduced otherwise. Mean r is
    reported.
- id: figs8e-lick-bout-responses
  statement: Dopamine rises at the onset of consummatory lick bouts but falls slightly at the onset
    of non-consummatory (dry) lick bouts, so the rising reward response is not a general response
    to licking.
  source: Figure S8E; Table S1
  quote: The average lick bout onset response was positive for consummatory lick bouts (during
    sucrose consumption) but was slightly negative for dry lick bout onsets away from reward
    consumption.
  statistics:
  - about: consummatory against non-consummatory bout onset response
    test: paired t-test
    statistic: t = 3.28
    p: 0.0134
    n: 8 animals
  - about: consummatory bout onset response against zero
    test: one sample t-test
    statistic: t = 3.03
    p: 0.0191
    n: 8 animals
  - about: non-consummatory bout onset response against zero
    test: one sample t-test
    statistic: t = -2.55
    p: 0.0379
    n: 8 animals
  criterion: Legend of Figure S8E and analysis/figS8/lick_rsp_randomrewards.m. Consummatory onsets
    are the first licks after rewards; non-consummatory onsets are bout-onset licks (1 s rule) that
    are not consummatory. Per session, dF/F aligned to each onset from -3 to 6 s, z-scored with
    the mean and SD over onsets of each onset's mean dF/F from -1.5 to -0.5 s, averaged over
    onsets; per animal, the mean over sessions. The window in which the response is measured for
    the tests is given by neither the Methods, the legend nor the code; readings are the mean z
    over (a) 0 to 1 s, (b) -0.5 to 1 s (the Experiment 1 reward window), (c) 0 to 0.5 s from
    onset. Reproduced when, under every reading, the consummatory response is above 0, the
    non-consummatory response below 0 and their paired difference positive, each two-tailed at p
    < 0.05.
- id: figs8g-baseline-unchanged
  statement: Spontaneous baseline dopamine events, away from rewards and licks, do not change in
    size across random reward sessions.
  source: Figure S8F and S8G; Methods, Data analysis, Experiment 1, paragraph 3; Table S1
  quote: There was no change in the baseline dopamine activity across sessions.
  statistics:
  - test: one sample t-test of per-animal correlations
    statistic: t = 0.11
    p: 0.9190
    n: 8 animals
  criterion: Methods, Experiment 1, paragraph 3, and analysis/figS8/baseline_activity_randomrewards.m.
    Peaks of dF/F found with a minimum distance of 50 samples, a minimum height of 20% of the mean
    of the top 5% of peaks of the animal's first session, and a minimum prominence of half that
    height (code). Peaks are kept when more than 0.5 s from any lick and more than 2 s from reward
    (Methods); the code instead drops peaks from 0 to 2 s after each first lick after reward, run
    as a variant. Per session, the mean peak size; per animal, Pearson r between session number
    and that mean. A claim of absence, judged on the paper's test, a two-tailed one-sample t-test
    of the 8 r against 0. Reproduced when p >= 0.05; not reproduced otherwise. Mean r is reported.
- id: figs8h-baseline-uncorrelated-with-reward-change
  statement: Across animals, the change of baseline dopamine activity over sessions is not
    correlated with the change of the reward response over sessions.
  source: Figure S8H; Supplementary Note 3, point 4
  quote: Dopamine baseline activity change across sessions is uncorrelated with dopamine reward
    response change across sessions.
  depends_on:
  - figs8g-baseline-unchanged
  criterion: analysis/figS8/baseline_activity_randomrewards.m. Per animal, Pearson r between
    session number and the session mean reward response (rewards with IRI of 3 s or more, response
    as in fig3e-reward-response-increases), and the r of figs8g-baseline-unchanged. Table S1 gives
    no test; the code computes the Pearson correlation of the two over the 8 animals and its p. A
    claim of absence. Reproduced when that p >= 0.05; not reproduced otherwise. r and p are
    reported.
- id: figs8l-lick-rate-tracks-iri
  statement: In a separate group of 6 mice, the non-consummatory lick rate depends on the session's
    mean IRI (6, 12 or 30 s) while the consummatory lick rate does not, so animals learn the
    average reward rate within at most two sessions.
  source: Figure S8L; Table S1
  quote: The non-consummatory exploratory licks made by the animals depended on the average IRI for
    a given session. Thus, animals learn the average reward rate of an environment within at most
    two sessions.
  statistics:
  - about: non-consummatory lick rate against IRI condition
    test: linear regression
    statistic: t = -2.73
    p: 0.0147
    n: 18 sessions from 6 animals
  - about: consummatory lick rate against IRI condition
    test: linear regression
    statistic: t = 1.00
    p: 0.3338
    n: 18 sessions from 6 animals
  criterion: analysis/figS8/lick_across_iri_randomrewards.m. Per session, consummatory and
    non-consummatory rates as in figs8b-lick-rates-constant; per animal and IRI, the mean of its
    two sessions (18 values). Linear regression of each rate on the IRI condition. The regressor is
    not given; readings are (a) the IRI in seconds, (b) the condition rank 1 to 3; both give the
    same sign. Reproduced when, under both, the non-consummatory slope is negative with p < 0.05
    and the consummatory slope has p >= 0.05; partially reproduced when the non-consummatory part
    holds alone.
- id: fig4ef-dopamine-leads-behavior
  statement: During initial cue-reward learning, the dopamine response to CS+ develops before
    anticipatory licking, and behavioral learning is much more abrupt than dopaminergic learning
    (Test 3).
  source: Figure 4C to 4F; Results, Tests 3-7, paragraph 1
  quote: Dopamine cue response considerably leads behavior across animals. ... Behavioral learning
    is much more abrupt than dopaminergic learning (paired t test for abruptness of change; t(6) =
    9.06; two-tailed p = 1.0×10-4; paired t test for change trial; t(6) = -2.93; two-tailed p =
    0.0263; n=7 animals)
  statistics:
  - about: abruptness of change, lick against dopamine
    test: paired t-test
    statistic: t(6) = 9.06
    p: 1.0e-4
    n: 7 animals
  - about: change trial, lick against dopamine
    test: paired t-test
    statistic: t(6) = -2.93
    p: 0.0263
    n: 7 animals
  data: with_labels
  depends_on:
  - session-day-link
  criterion: Methods, Data analysis, Experiments 2-5, paragraph 1, and
    analysis/fig4/cumsum_pavlovian.m (condition 1). Per animal, Experiment 2 sessions from
    startday to endday, CS+ trials in order. Lick measure, Methods, the lick rate in the 2 s from
    CS+ onset minus that in the 1 s before; the code counts licks from cue onset to the end of the
    trace (3 s), as a rate, minus the 1 s baseline rate, run as a variant. Dopamine, AUC from 0 to
    2 s after CS+ onset halved minus the AUC from -1 to 0 s (smoothed traces, code). Trials used,
    the first round(1.5 x n) where n is the number of trials before the animal's learnedday
    (code). Cumulative sums of each, smoothed with a Gaussian kernel (sigma 2 trials, 10 wide,
    valid convolution) and divided by their last value; the distance of each point from trial 5
    to the end minus 5 to the line from its first point to (end - 5, 1) (point2line.m). Abruptness
    is the largest distance and the change trial its position. Two-tailed paired t-tests over 7
    animals. Reproduced when lick abruptness exceeds dopamine abruptness and the dopamine change
    trial is earlier than the lick change trial, each at p < 0.05. The paper's sign for the change
    trial (t = -2.93) and for abruptness (t = 9.06) cannot both be lick minus dopamine if dopamine
    leads; the direction is judged from the Results ("dopamine response to CS+ was evident long
    before animals showed anticipatory licking") and the sign of t is reported.
- id: figs10c-cue-response-at-acquisition
  statement: By the session at which behavior was acquired, the dopamine cue response had reached
    93% of its value on the final session (about 100% relative to the mean of the last two
    sessions).
  source: Figure S10C; Supplementary Note 5, paragraph 2
  quote: Dopamine cue response reaches 93% of its response on the final session (~100% if
    normalized relative to average cue response on session n and n-1).
  data: with_labels
  depends_on:
  - session-day-link
  expected:
  - quantity: cue response at acquisition session over that of the final session
    value: 0.93
    tolerance: 0.093
  - quantity: cue response at acquisition session over the mean of the last two sessions
    value: 1.0
    tolerance: 0.1
  criterion: analysis/figS10/cue_acquisition.m (the Methods give no measure for this panel). Per
    animal, Experiment 2 sessions from startday to endday; per session the mean over CS+ trials of
    the AUC of unsmoothed dF/F from 0 to 1 s after cue onset, without baseline subtraction (code);
    session x is the animal's learnedday, n the last session. The averaging is not stated;
    readings are (a) the mean over the 7 animals of each animal's ratio (code), (b) the ratio of
    the means over animals. Reproduced when both values are within tolerance under one reading;
    partially reproduced when one is. The Fig 4 baseline-subtracted 0 to 2 s measure is shown as a
    variant.
- id: fig4hi-delay-change-behavior-changes
  statement: When the cue is lengthened from 2 s to 8 s (cue-reward delay 3 s to 9 s), animals
    change the timing of anticipatory licking abruptly, and this change is better fit by a
    changing model than by a constant one.
  source: Figure 4G to 4I; Results, Tests 3-7, paragraph 2
  quote: Behavior is learned abruptly by all animals, but the dopaminergic cue response shows little
    to no change. ... Paired t test for abruptness of change; t(6) = 22.92; two-tailed p =
    4.52×10-7; one-sample t test for ΔAIC against a null of zero; t(6) = 7.49 for lick
  statistics:
  - about: abruptness of change, lick against dopamine
    test: paired t-test
    statistic: t(6) = 22.92
    p: 4.52e-7
    n: 7 animals
  - about: delta AIC for licking against zero
    test: one sample t-test
    statistic: t(6) = 7.49
    p: 2.9e-4
    n: 7 animals
  data: with_labels
  depends_on:
  - session-day-link
  criterion: Methods, Experiments 2-5, paragraphs 1 to 3, and analysis/fig4/cumsum_pavlovian.m
    (condition 2). Per animal, the 3 sessions before startday and those up to endday; CS+ trials
    with at least one lick in cue and trace (others dropped); behavior is the median time from cue
    onset of the licks in cue and trace; dopamine as in fig4ef-dopamine-leads-behavior; trials
    used, the first round(1.9 x n), n the trials before startday. Abruptness from the cumulative
    sums as in fig4ef-dopamine-leads-behavior (for behavior, the cumulative sum of median lick
    time). Model comparison, from the code since the Methods' equations are lost from the text,
    changing model A(1 - 2^(-(x/L)^S)) + b, x the trial number, fitted by least squares to the
    per-trial values (not to the cumulative sums; code) with bounds A 0 to 9000, L n-10
    to the number of trials, S 0 to 100, b 0 to 4000 for licks; constant model b; AIC = 2k + N
    ln(RSS) with N trials. The Methods name A, L and b as the free parameters, three, where the
    code fits four; k = 4 (code) is the main reading and k = 3 a variant. Delta AIC = AIC(constant)
    - AIC(changing), two-tailed one-sample t-test over 7 animals. Reproduced when lick abruptness
    exceeds dopamine abruptness at p < 0.05 and lick delta AIC is above 0 at p < 0.05.
- id: fig4hi-delay-change-dopamine-unchanged
  statement: After the cue-reward delay is lengthened, the dopamine cue response shows no
    significant change (Test 4).
  source: Figure 4G to 4I; Results, Tests 3-7, paragraph 2
  quote: Experimentally, we observed that while the animals learned the new delay rapidly,
    dopaminergic cue response showed no significant change (Fig 4 G-I).
  statistics:
  - about: delta AIC for dopamine against zero
    test: one sample t-test
    statistic: t(6) = -0.86
    p: 0.4244
    n: 7 animals
  data: with_labels
  depends_on:
  - session-day-link
  criterion: Trials and dopamine measure as in fig4hi-delay-change-behavior-changes; changing model
    bounds for dopamine A -2 to 50, L n-10 to the number of trials, S 0 to 10, b -10 to 10
    (code). A claim of absence, judged on the paper's test, a two-tailed one-sample t-test of
    delta AIC = AIC(constant) - AIC(changing) for dopamine against 0, fitted to the per-trial
    values as for licks. Reproduced when p >= 0.05 or the mean delta AIC is below 0 (the constant
    model fits better, no change found); not reproduced when delta AIC is significantly above 0. Mean delta AIC is reported, with k = 3
    as a variant.
- id: figs10b-no-omission-response
  statement: After the delay change, there is no suppression of dopamine at the old reward time (3
    s) in any animal, whereas omission of the reward in extinction does suppress dopamine at the
    reward time (Test 5).
  source: Figure 4J and S10B; Results, Tests 3-7, paragraph 2; Methods, Experiments 2-5,
    paragraph 4
  quote: Omission response is not negative with respect to pre-cue baseline for any animal after cue
    duration change but was negative during extinction.
  statistics:
  - about: cumulative omission-window response, delay change against extinction
    test: paired t-test
    statistic: t = 3.37
    p: 0.0150
    n: 7 animals
  data: with_labels
  depends_on:
  - session-day-link
  criterion: Methods, Experiments 2-5, paragraph 4, and analysis/figS10/omission.m. Per animal, the
    first session of Experiment 3 and the first extinction session (code day lists); CS+ trials;
    response is the AUC from 3 to 4 s after cue onset (Experiment 3) or 9 to 10 s (extinction, 1 s
    after the trace, the original reward time) minus the AUC from -1 to 0 s (Methods; the code
    divides the window AUC by 1000 and not the baseline, run as a variant); smoothed traces
    (code); cumulative sum over trials, its last value per session. Reproduced when the paired
    two-tailed t-test gives Experiment 3 above extinction at p < 0.05 and the Experiment 3 value is
    at or above 0 in all 7 animals and the extinction value below 0 (for extinction, the legend
    allows (a) in every animal or (b) on average; either suffices).
- id: fig4kl-extinction-abrupt-behavior
  statement: Behavioral learning of extinction is abrupt, much more so than the change of the
    dopamine cue response.
  source: Figure 4J to 4L
  quote: Across all animals, the dopaminergic cue response remains significantly positive despite
    abrupt behavioral learning of extinction (paired t test for abruptness of change; t(6) = 5.67;
    two-tailed p = 0.0013; paired t test for change trial; t(6) = -2.40; two-tailed p = 0.0531;
    n=7 animals).
  statistics:
  - about: abruptness of change, lick against dopamine
    test: paired t-test
    statistic: t(6) = 5.67
    p: 0.0013
    n: 7 animals
  - about: change trial, lick against dopamine
    test: paired t-test
    statistic: t(6) = -2.40
    p: 0.0531
    n: 7 animals
  data: with_labels
  depends_on:
  - session-day-link
  criterion: As fig4ef-dopamine-leads-behavior with analysis/fig4/cumsum_pavlovian.m condition 3,
    the session before extinction and those to endday, trials the first round(2.5 x n) with n the
    trials before extinction. Reproduced when lick abruptness exceeds dopamine abruptness at p <
