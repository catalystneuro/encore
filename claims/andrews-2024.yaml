# Claims for Andrews, Geng, Voitiuk et al. (2024), Nature Neuroscience 27, 2487-2499,
# doi:10.1038/s41593-024-01782-5, tested on DANDI:001132.
#
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-11-10, following docs/protocol.md (Reader). No data of the dandiset were seen; only its
# title and description on the archive ("HD-MEA recordings of human hippocampal brain slices
# obtained from epilepsy patients, including optogenetic stimulus and several
# hyperactivity-provoking conditions of culture medium").
#
# Text read: the NIH author manuscript in PubMed Central (PMC11881784, NIHMS2047739), full text
# with Methods, figure legends, Tables 1 and 2 and Extended Data legends, and its two supplement
# files from PMC: the Inventory of Supplemental Information (Extended Data and video legends)
# and Supplemental_Information.pdf (Supplemental Figs. S1 to S3, Supplemental Tables ST1 to
# ST6). The version of record was not read. The text cross-references its supplementary tables
# inconsistently (Extended Data legends point to ST4, ST5 and ST6 for the firing-rate p-values;
# the p-values are in ST2, ST3 and ST4; the Fig. 6 legend cites ST3 for a z-score that is in
# ST6; the Methods cite "Supplementary Table 2" for the ST5 odds ratios). The claims cite the
# tables by their content.
#
# Code read: https://github.com/braingeneers/AndrewsGengVoitiukEtAl_SourceCode at commit
# 6865bf68cc3c8ea36a9b4f853b9248288fa1e52b (2025-11-30). It holds the optogenetic control and
# closed-loop software (Optogenetic_Control, experiment_implementer, with LED calibration CSVs),
# the spike-sorting curation script (Spike_Sorting_Curation/si_curation.py), figure notebooks
# for the light-ON firing-rate comparisons (Code_for_Figures/figure4_stats_new_data.ipynb,
# figure4_stats_bicucu.ipynb), per-unit, per-trial firing rates and amplitudes exported for
# the R t-tests (data/statistics/*.csv), the waveform clustering (Waveform_Cluster:
# umap_for_all_mod.ipynb with its saved waveforms, recording index of 66 recordings and
# cluster labels new_umap_df.csv, 3405 waveforms in 12 clusters), the opto-response clustering
# (Waveform_Cluster/peristimulus.py and its output cluster_assignment_final.csv, 1968 units from
# 41 recordings), the burst propagation notebook (Seizure_Propagation), the theta video code
# (Theta_Wave_Videos) and the NEST simulation (Simulation). The R code for the t-tests, the
# logistic regression and the chi-square test is not in the repository.
#
# Data the paper used (Table 1). Twelve hippocampal slices from seven adult patients with
# drug-refractory temporal lobe epilepsy (patients A to G), cultured 4 to 8 days, recorded on
# MaxWell HD-MEAs (26,400 electrodes, up to 1,024 recorded channels, 20 kHz). Slices 1A and 6C
# had no opsin; 2B and 4C were transduced with AAV9-CAMK2A-ChR2-eYFP (4C illuminated at 470 nm);
# 3C, 5C, 7D, 8D, 9E, 10F, 11G and 12G with AAV9-CAMK2A-HcKCR1-eYFP (illuminated at 530 nm).
# Conditions: physiologic media (3C), bicuculline 2 uM (5C, 7D, 8D), magnesium-free media
# (0-mg; 9E, 10F, 11G, 12G) and then 0-mg plus kainic acid 100 nM (0-mg+KA; same four slices).
# Light protocol: trials of 10 s continuous illumination; 5 trials in 3C (Fig. 3a), 10 trials
# in 10F (Extended Data Figs. 5d, 6d); closed-loop illumination of 10 s after bicuculline in 3
# slices from 2 patients. The light ON and OFF times are in the recording's GPIO bit and in a
# stimulation log CSV (Methods, Design of optogenetic system). Measured variables: spike-sorted
# single units (Kilosort2, then manual and automatic curation), spike amplitudes, electrode
# positions, LFP (theta band), activity scans; histology (NeuN, eYFP) and patch clamp are
# separate measurements. Units per slice (Table 1) and per analysed recording (Extended Data
# Fig. legends) are given in the claims below.
#
# Methods shared by several claims, fixed here from the paper and its code.
# Light-ON comparison (Methods, Firing rate and amplitude; Supplemental Tables ST2 to ST4
# legends; Code_for_Figures/figure4_stats_*.ipynb). For each trial, pre is the 10 s before light
# onset, light-ON the 10 s from onset, OFF the 10 s after light-ON (code, onset+10 s to
# onset+20 s). A unit's rate in a window is its spike count over 10 s; its amplitude is the mean
# of its per-spike amplitudes (the code takes Phy/Kilosort "amplitudes"). Each unit's values are
# averaged across the trials of the recording, and pre against light-ON, light-ON against OFF
# and pre against OFF are compared by two-tailed paired t-tests over units, Holm-corrected over
# the three comparisons; significant when the adjusted p < 0.05.
# Units (Methods, Spike Sorting; si_curation.py): Kilosort2 on data bandpassed 300 to 6000 Hz,
# then curation keeping units with firing rate >= 0.1 Hz, ISI violation ratio (1.5 ms) below 10%
# (manual) or 20% (automatic, Hill method), SNR >= 5 and coherent waveforms on neighbouring
# channels. Where the dandiset holds sorted units, they are used as deposited; the manual part
# of the curation cannot be repeated, so a re-sort is a variant.
# Open, for all claims: which deposited recording and which trials make each condition. The
# paper names slices, not files. Readings, in order: (a) the recording whose curated unit count
# matches the N in the Extended Data Fig. 4 to 6 and 8 legends; (b) the recording the code names
# for it (figure4_stats_bicucu.ipynb uses 2023_04_04_hc328_hckcr1-2_3 with five trials, taking
# GPIO events from the third onward in groups of four, for bicuculline slice 5C; the
# data/statistics CSV names map patient-dated sessions hc328 to patient C, hc52 to D, Hc110723
# to E, Hc112823/Hc112723 to F, Hc120523 to G; the slice-level mapping is the author's to
# confirm from the dandiset's metadata); (c) every light trial in the recording of that slice
# and condition. The notebook shows each reading used.
schema_version: 2
paper: doi:10.1038/s41593-024-01782-5
