- id: zero-mg-isolated-bursts
  statement: In 0-mg media, 2 of 4 slices showed clear spontaneous bursts of activity lasting
    under 1 s and several minutes apart, like interictal spikes. 10F is one; the second is 9E in
    Extended Data Fig. 9 and 11G in the Extended Data Fig. 5 legend.
  source: Results, Optogenetic suppression in provoked hyperexcitability, paragraph 1; Extended
    Data Fig. 9; Extended Data Fig. 5d,g
  quote: Clear, spontaneous bursts of activity were observed 2/4 slices bathed with 0-mg media
  expected:
  - quantity: 0-mg slices with isolated bursts
    value: 2
    tolerance: 0
  criterion: A count of slices, exact. The paper gives no burst detector. The detector is taken
    from the Methods' propagation section, population rate of all units in 100 ms bins smoothed
    with a Gaussian kernel (sigma 5 bins) and peaks found with scipy find_peaks; the peak
    threshold is open. Readings, (a) peaks above the mean + 3 SD of the smoothed population rate
    (the 3 SD of the same section); (b) peaks above 5 times its median. A slice has isolated
    bursts when it shows at least two peaks under either reading, each with the rate above half
    the peak for under 1 s, at least 1 minute apart. Neither peak threshold nor the 1 minute
    spacing is given by the paper, so the outcome rests on an assumption. The second slice is
    open, readings 9E (Extended Data Fig. 9b) and 11G (Extended Data Fig. 5g, "showing isolated
    bursts of activity in trials T1 and T2"). Reproduced when, under one reading, exactly 2 of
    9E, 10F, 11G, 12G qualify and they are 10F with 9E or 10F with 11G; partially reproduced
    when 2 qualify but not one of those pairs.
- id: ka-rhythmic-bursts
  statement: Adding kainic acid to 0-mg media raised firing rates acutely, and 2 of 4 slices
    (10F and 11G) developed rhythmic bursts of activity.
  source: Results, Optogenetic suppression in provoked hyperexcitability, paragraph 2; Fig. 3d,e;
    Extended Data Fig. 6d,g
  quote: The addition of KA resulted in acute elevations in firing rate, and in 2/4 slices
    recorded with KA, rhythmic bursts of activity occurred
  expected:
  - quantity: 0-mg+KA slices with rhythmic bursts
    value: 2
    tolerance: 0
  criterion: Two parts. (1) Elevation, per slice the mean unit rate in the pre windows of the
    0-mg+KA recording against those of the 0-mg recording; the paper gives no test, so the
    direction is judged in each slice and a paired t-test over units matched across the two
    recordings is shown where units can be matched. (2) Rhythmic bursts, with the detector and
    readings of zero-mg-isolated-bursts, a slice qualifying when it shows repeated bursts at
    intervals under 60 s (the paper says only "rhythmic"; the 60 s bound is an assumption).
    Reproduced when the KA rate exceeds the 0-mg rate in at least 3 of 4
    slices and exactly 10F and 11G qualify for (2) under one reading; partially reproduced when
    one part holds.
