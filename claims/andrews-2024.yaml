- id: patch-hckcr1-hyperpolarizing
  statement: Light (540 nm) activates hyperpolarizing currents in HcKCR1-transduced human
    hippocampal neurons in voltage clamp (3 cells from 2 slices).
  source: Results, Optogenetic control of human hippocampal network, paragraph 1; Extended Data
