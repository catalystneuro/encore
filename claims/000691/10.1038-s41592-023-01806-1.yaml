- id: ed7-motion-small
  statement: Lateral shifts of the image due to the mouse's movement are small, with a
    root-mean-square displacement of 0.13 pixels (0.7 um).
  source: Main text, page 548, paragraph 2; Extended Data Fig. 7
  quote: Lateral shifts of the image due to mouse motion were small (root-mean-square displacement
    of 0.13 pixels or 0.7 μm (Extended Data Fig. 7).
  expected:
  - quantity: root-mean-square displacement
    value: 0.13
    tolerance: 0.013
    unit: pixels
  - quantity: root-mean-square displacement
    value: 0.7
    tolerance: 0.07
    unit: um
  criterion: Displacements are those NoRMCorre estimates on the raw imaging video of the session
