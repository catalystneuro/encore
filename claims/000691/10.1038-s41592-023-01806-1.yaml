- id: abstract-kiloscope-fov
  statement: The Kiloscope's field of view is 4.8 x 3.6 mm (about 4 mm in the abstract).
  source: Abstract; main text, page 546, paragraph 3
  quote: The second design, the Kiloscope, provides cellular resolution imaging across a 4.8 × 3.6
