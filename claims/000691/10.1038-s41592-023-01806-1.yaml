    value: 4.8
    tolerance: 0.48
    unit: mm
  - quantity: field of view, shorter side
    value: 3.6
    tolerance: 0.36
    unit: mm
  criterion: The field of view is the imaging frame's width and height in pixels times the
    object-plane pixel size. The paper does not state the pixel size. The code uses 5.94 um per
    pixel for the Kiloscope (sf3/widefield/analysis.m, on 808 x 608 pixel frames) and 5.35 um per
    pixel for the Kiloscope bead images (f2+sf4/wf_analysis_secondorder.m); the main text's
    0.13 pixels = 0.7 um implies about 5.4 um. A pixel size stored with the data is used when
    there is one; otherwise both code values are readings, and the claim is reproduced when both
    sides are within tolerance under a reading.
