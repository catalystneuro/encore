  source: Main text, page 546, paragraph 3; Methods, Data analysis, paragraph 1
  quote: The second design, the Kiloscope, provides cellular resolution imaging across a 4.8 × 3.6
    mm FOV in a device weighing only 1.4 g, allowing us to simultaneously record from thousands of
    neurons in a freely behaving mouse ... For the mouse with the best calcium indicator
    expression, this extraction yielded 2,948 footprints
  expected:
  - quantity: EXTRACT footprints in one session of the mouse with the most footprints
    value: 2948
    tolerance: 295
    unit: footprints
  criterion: The count is the number of footprints EXTRACT returned for the one session, as the
    Methods report it (NoRMCorre, then EXTRACT with a minimum cell-finding SNR of 2). Reproduced
    when the count is within tolerance and the footprints were recorded together in a session of
    free exploration of the maze.
