- id: fig2-quadrant-direction-decoding
  statement: Linear SVM decoders trained on half of the data decode the mouse's combined quadrant
    and movement direction on the other half at an accuracy at least three times chance, above
    that of decoders trained on shuffled data.
  source: Main text, page 549, paragraph 1; Fig. 2i and 2j; Methods, Data analysis, paragraphs 4
    and 5
  quote: We trained a support vector machine (SVM) model on half of the data and used the other
    half to decode the mouse's combined position and movement direction, with the resulting
    accuracy at least three times chance level (Fig. 2j, P < 0.001, Monte Carlo sampling of n =
    1,000 shuffled datasets).
  statistics:
  - test: Monte Carlo sampling of shuffled datasets
    p: 0.001
    p_relation: "<"
    n: 1,000 shuffled datasets
  criterion: Eight classes, the four quadrants by two directions (Fig. 2i), and the common method
    above with lambda 3.2e-7. The decoding matrix is the average of 200 fits
    (quadrant_direction_decoding.m). The null is 1,000 decoders trained on their own shuffles
    (Methods, paragraph 5), each giving a median accuracy; p is the fraction of null values at or
    above the real median accuracy. The code holds no null for this panel, so how many fits make
    one null decoder is open. The readings are (n1) one fit per shuffle, (n2) the average matrix of
    200 fits per shuffle, as for the real matrix (subset_sweep.m averages its shuffled decoders
    over the same number of fits as its real ones). The p-value is judged under both; when they
    disagree on p < 0.001, the claim is methods_underspecified. Chance is 1/8 (the code sets white
    at 1/Nclass). Which accuracy must reach three times chance is open. The readings are (a) the
    median of the diagonal at least 0.375, (b) every diagonal element at least 0.375. Reproduced
    when p < 0.001 and the accuracy holds under a reading; partially reproduced when p < 0.001
    and the median of the diagonal exceeds 1/8 but neither reading holds.
- id: fig2k-decoder-size
  statement: Decoding accuracy depends on the number of footprints used, with P at or below 2.7 x
    10^-4 (Mann-Whitney U) for every decoder size from 2 to 2,048 footprints.
  source: Main text, page 549, paragraph 1; Fig. 2k; Methods, Data analysis, paragraph 5
  quote: The accuracy of the decoder depended on the number of footprints used (Fig. 2k, P ≤ 2.7 ×
    10−4 for all decoder sizes, Mann–Whitney U).
  statistics:
  - about: printed as P ≤ 2.7 × 10−4 for all decoder sizes; the schema has no "at or below"
    test: Mann-Whitney U
    p: 2.7e-4
    p_relation: "<"
    n: 64 decoders per size, sizes 2, 4, ..., 2,048 footprints
  depends_on:
  - fig2-quadrant-direction-decoding
  criterion: As subset_sweep.m does it, with the common method above (quadrant and direction
    labels, lambda 6.75e-8 as in the code). For each size 2^1 to 2^11, 64 random subsets of
    footprints; for each subset, the average decoding matrix of 100 fits and its median accuracy,
    then the same subset after the shuffle, again 100 fits. What the Mann-Whitney U compares is
    open. The readings are (a) original against shuffled at each size, (b) original at each size
    against original at the next size. Reproduced when, under a reading, every two-sided test has
    p at or below 2.7e-4 and the median of the original accuracies at 2,048 footprints exceeds that
    at 2; partially reproduced when every test has p < 0.05 and the medians rise.
- id: fig2l-local-decoding-map
  statement: Decoders built from the 32 footprints closest to a point decode quadrant and
    direction with accuracies that differ substantially across the field of view.
  source: Main text, page 549, paragraph 1; Fig. 2l; Methods, Data analysis, paragraph 5
  quote: Notably, footprints in different regions of the FOV yielded substantially different
    decoding accuracies (Fig. 2l).
  depends_on:
  - fig2-quadrant-direction-decoding
  criterion: Map points every 5 image pixels over rows 1 to 608 and columns 140 to 700 (the code's
    grid, subregion_map_quaddir.m); a point is used when at least 32 footprints lie within 270 um
    (Methods). A footprint's position is not given in the Methods; the code takes the first pixel
    (in column order) at which the footprint's spatial weight equals 1, its peak, and that is
    used, with the centroid shown as a variant. At each point, the 32 footprints nearest to it;
    its value is the median accuracy of the average matrix of 10 fits (code), with quadrant and
    direction labels and lambda 6.75e-8 (code). The null is 1,000 decoders trained on shuffled
    data from 32 randomly chosen footprints (Methods). Points are significant at
    Benjamini-Hochberg 5% over all used points. Open details and their readings. Pixel size for
    the 270 um radius, 5.94 um (45 pixels) or 5.35 um (50 pixels, the code's radius); random
    footprints drawn anew for each null decoder, or one draw for all; each null decoder one fit,
    or the average matrix of 10 fits as at the points; p as the fraction of null values at or
    above the point's value, or that count plus one over 1,001. "Substantially different" is read
    as (i) significant and non-significant used points both present, and (ii) the values of the
    used points spanning at least 0.108 (the 0.18 to 0.30 range of the Fig. 2l colour bar, less
    10%). Reproduced when at least one point is significant and (i) and (ii) hold under every
    combination of readings; not reproduced when they fail under every combination; otherwise
    methods_underspecified, with every result shown. The code's choice of 64 footprints within 50
    pixels is shown as a variant.
- id: ed8-coactive-distributed
  statement: The correlated activity in each NMF component is driven by footprints spread across
    the field of view.
  source: Main text, page 549, paragraph 1; Extended Data Fig. 8; Methods, Data analysis,
    paragraph 1
  quote: Note that the correlated activity visible in each component is driven by footprints from
    across the FOV (Extended Data Fig. 8).
  criterion: The traces of the curated footprints (Fig. 2h; extract_curated.mat in the code) are
    factored by NMF into eight components (Methods), with multiplicative updates, 4 replicates and
    tolerances 1e-7 (ridgeline_nmf_grouping.m); each footprint goes to the component in which its
    weight ranks highest among footprints (same script). Footprints of a component are active in
    its event when their maximum within 25 s of the event time exceeds half their maximum over the
    recording (single_component_raster.m). The event times are open. The code lists eight times
    (820, 770, 990, 700, 400, 420, 1000 and 410 s) for components whose numbering a new NMF run
    does not reproduce. The readings are (a) the time of each component's largest temporal weight,
    (b) the code's eight times, each assigned one to one to the component with the largest
    temporal weights at those times. "From across the FOV" has no measure in the paper, and none
    is in the code. The plain reading used is that each event's active footprints lie in all four
    quarters of the field of view (split at the midlines of the extent of all footprint
    positions, taken as for fig2l-local-decoding-map). Reproduced when every component's event
    meets it under both event readings; not reproduced when some event fails it under both;
    otherwise methods_underspecified. The maps of active footprints (the code's Extended Data
    Fig. 8b, footprints thresholded at 10% of their maximum) and their counts are shown.
- id: ed9b-octant-decoding
  statement: Position within the maze can be decoded with octant resolution from the activity,
    above decoders trained on shuffled data.
  source: Main text, page 549, paragraph 1; Extended Data Fig. 9a and 9b
  quote: We used the same approach to decode even more fine-grained position information (Extended
    Data Fig. 9, P < 0.001, Monte Carlo sampling as in Fig. 2j).
  statistics:
  - test: Monte Carlo sampling of shuffled datasets
    p: 0.001
    p_relation: "<"
    n: 1,000 shuffled datasets (as in Fig. 2j)
  depends_on:
  - fig2-quadrant-direction-decoding
  criterion: Eight classes, the eight octants (each side of the loop halved, direction not coded;
    Extended Data Fig. 9a), with the common method above and lambda 6.75e-8. The decoding matrix is
    the average of 200 fits (octant_decoding.m). The null is as in fig2-quadrant-direction-decoding,
    1,000 decoders on their own shuffles, with the same two readings (n1) and (n2). Reproduced when
    the real median accuracy exceeds every null value (p < 0.001) and exceeds chance (1/8) under
    both; not reproduced when it fails under both; otherwise methods_underspecified.
- id: ed9c-local-decoding-map
  statement: Decoders built from the 32 footprints closest to a point decode octant position
    significantly in parts of the field of view, with accuracy that varies across it.
  source: Extended Data Fig. 9c; Methods, Data analysis, paragraph 5
  inferred: The Extended Data Fig. 9c legend and the Methods give the method only. The main text
    states that accuracy differs across the field of view for the quadrant and direction map
    (Fig. 2l) and that octant position was decoded with the same approach, but states no result
    for the octant map. That it is significant in parts of the field of view and varies across it
    is read from the legend (non-significant pixels plotted in black) and the main text.
  depends_on:
  - ed9b-octant-decoding
  criterion: As fig2l-local-decoding-map, with octant labels, the average matrix of 40 fits per
    point (subregion_map_octant.m; a null decoder is one fit or the average of 40) and the same
    open details and readings, except (ii). The paper gives no colour bar for this map in its
    text and no measure of how much the accuracy varies, so no span threshold is set; the claim is
    judged on (i) and the span of the used points' values is reported. Reproduced when at least
    one point is significant and (i) holds under every combination of readings; not reproduced
    when it fails under every combination; otherwise methods_underspecified.
- id: ed10-localized-activity
  statement: Some footprints have activity localized to subregions of the maze.
  source: Main text, page 549, paragraph 1; Extended Data Fig. 10
  quote: An examination of individual neural firing rate maps yielded footprints whose activity was
    localized to subregions of the maze (Extended Data Fig. 10).
  criterion: The paper selected footprints by eye "for large-scale structure in their receptive
    fields" (Extended Data Fig. 10 legend), a rule that cannot be redone. The maps are as in
    place_cells.m. Frames with speed above its 80th percentile; a footprint is active in a frame
    when its trace exceeds 1% of its maximum; the plotted value is the fraction of time active at
    each location, smoothed with a Gaussian of 10 video pixels. The code also computes, per
    footprint, the entropy of its mean activity over 100 bins of linear position between the 1st
    and 99th percentiles, and sorts footprints by the peak of the smoothed map. Neither the paper
    nor the code sets a threshold or a test for "localized", and the paper's selection by eye
    cannot be redone, so the claim cannot be judged by a method the paper fixes
    (methods_underspecified). The maps and the entropy and peak of every footprint are reported,
    with the code's 12 selected footprints (ifig in place_cells.m, indices into the curated set)
    when the data's footprint order can be matched to the curated set.
