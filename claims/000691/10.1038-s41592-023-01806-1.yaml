# Claims for Scherrer, Lynch, Zhang & Fee (2023) on dandiset 000691.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-20,
# protocol as stated in docs/protocol.md (version pilot-10).
#
# Text read: the version of record (Nature Methods 20, 546-549), from a PDF supplied by a person,
# as extracted text in paper/10.1038-s41592-023-01806-1.txt. It holds the main text, the figure
# legends, the Methods, the Extended Data legends (Extended Data Figs. 1 to 10) and the reporting
# summary. The supplementary information is two videos (Supplementary Videos 1 and 2), which no
# result rests on. The PDF was not opened; the numbers needed were in the text. In the extracted
# text, the sentence on the Featherscope's resolution (page 547) is split by figure labels, its
# second half placed before its first; the quote of fig1e-featherscope-psf is that second half, and
# its first half reads "The Featherscope has a resolution of approximately 4 μm at the".
#
# Rewritten 2026-10-20 from the full text. The earlier file was written from the abstract and the
# public figure legends, and its criteria were written after its author had seen the data check
# and a prototype decoder. This file is written from the paper and its code alone, by a reader
# who has not seen the dandiset's data. What changed, and why:
# - ed9c-local-decoding-map: the null is now the paper's (Methods, Data analysis, paragraph 5),
#   a thousand decoders trained on shuffled data from 32 randomly chosen footprints, where each
#   footprint's trace is circularly shifted by its own random offset. The earlier null shifted the
#   labels against the local footprints and used a z-score. The same correction applies to
#   ed9b-octant-decoding, whose null shifted the labels by 10% to 90% of the frames.
# - abstract-kiloscope-fov: the expected value was 4.0 mm for the longer side; the paper states
#   4.8 x 3.6 mm (main text, paragraph 3). The "~4 mm" of the abstract is a rounding.
# - fig2-quadrant-direction-decoding, dropped as not stated, is restored: the main text states it
#   (main text, page 549, paragraph 1), with its test.
# - Added from the full text: fig1e-featherscope-psf, fig1f-kiloscope-psf, ed1cf-field-curvature,
#   ed7-motion-small, fig2k-decoder-size, fig2l-local-decoding-map, birds-singing-rate and
#   fig2d-lman-sparse-bursting.
# - Criteria that rested on thresholds of the earlier author's choosing (duplicate merging in
#   abstract-thousands-of-neurons, the 0.8 level in ed2b and ed2c, the spread ratio in ed8) are
#   replaced by the paper's numbers, or by readings named as such where the paper fixes none.
# Ids are kept where the finding is the same.
#
# Data the paper used. Four mice (C57/B6, 8 to 12 weeks old) with jGCaMP7f injected at about 20
# sites across a 4 mm craniotomy over V1 and regions anterior and lateral to it, imaged with the
# Kiloscope while freely exploring a circular (square loop) maze for several minutes. EXTRACT gave
# 2,948, 401, 1,029 and 112 footprints; the mouse with 2,948 has a 4 mm window and 2,382 footprints
# after manual curation, and all analyses of neural activity (Fig. 2e to 2l, Extended Data Figs. 7
# to 10) use this one session. Imaging is at 30 frames/s (the code converts seconds to frames by
# 30). Position comes from an overhead behaviour video with its own timestamps. Three juvenile
# male zebra finches (50 to 70 days post hatch), GCaMP6f in LMAN, imaged with the Featherscope
# during song (46, 177 and 225 curated footprints). Optical tests use a USAF 1951 target, 1 um
# beads (155 for the Featherscope, 118 for the Kiloscope), a thin layer of fluorescent dye, and
# test tones on the onboard ADC. The paper deposited its imaging data at Academic Torrents
# (aa2a3d2f5ff0b3974871db47db57bc3dabf3c192). The dandiset's description names the mouse
# experiment (4 mm window, circular maze), although it calls the microscope the one "optimized
# for weight"; the paper made that experiment with the Kiloscope.
#
# Code read: GitHub FeeLab/Feescope-Paper-Code at commit
# d596646b16a505907203828d8026feb7736ca69c (MATLAB). It holds position tracking
# (f3+sf8/mouse_position_tracking.m), the decoders (quadrant_direction_decoding.m,
# octant_decoding.m, subset_sweep.m, subregion_map_quaddir.m, subregion_map_octant.m), the NMF
# grouping and ridgeline plot (ridgeline_nmf_grouping.m, ridgeline_plot.m), the coactive footprint
# maps (sf10/single_component_raster.m), the receptive fields (sf9/place_cells.m), the bead PSF fits
# with their images and ROI lists (f2+sf4), the illumination profiles with their images (sf3), and
# Zemax files (sf1). It does not hold the shuffle tests of Fig. 2j and Extended Data Fig. 9, the
# pixel-wise significance and Benjamini-Hochberg step of the maps, the Mann-Whitney test of
# Fig. 2k, the motion correction, the USAF images or the ADC recordings. Its folder names follow
# the preprint's figure numbers (f3 is Fig. 2 of the version of record, sf8 is Extended Data
# Fig. 9, sf9 is Extended Data Fig. 10, sf10 is Extended Data Fig. 8).
#
# Common method of the mouse decoding claims (Methods, Data analysis, paragraphs 4 and 5, and the
# code where the Methods are silent, as cited):
# - Position (mouse_position_tracking.m). The behaviour video is read from 64 s on, each frame is
#   rotated by 86.79 degrees and cropped to rows 229 to 560 and columns 101 to 378; the mouse is
#   the largest connected region of pixels whose squared RGB distance from (0, 3, 4) is below 1600.
#   Its centroid is interpolated to the imaging timestamps. The quadrant is the nearest of the four
#   sides of the track rectangle (x 44 to 228, y 34 to 270 in the cropped frame); linear position
#   runs around the loop (0.508 m per 290 pixels) and is unwrapped. The octant halves each
#   quadrant at the rectangle's midline.
# - Running and direction (all decoding scripts). Speed is the absolute change of unwrapped
#   position per frame, moving mean over 30 frames; frames with speed above its median are used.
#   Direction is the sign of the change of unwrapped position, moving mean over 30 frames. The
#   eight quadrant and direction classes are quadrant q and direction d coded as 2q-1 (d < 0)
#   or 2q (d > 0).
# - Activity. The moving maximum over 30 frames of each footprint's trace (code). The footprints
#   are those of Fig. 2h, the 2,382 curated ones (Fig. 2 legend, panels f, h and j). The code
#   loads extract_curated.mat and then position_tracking.mat, whose activity matrix, if present,
#   holds all 2,948 footprints; using all 2,948 is a variant.
# - Decoder (Methods; code). One-versus-all linear SVMs (fitcecoc, templateLinear, ridge penalty;
#   lambda 3.2e-7 in quadrant_direction_decoding.m, 6.75e-8 in octant_decoding.m, subset_sweep.m
#   and both map scripts). Each fit circularly shifts frames and labels together by a random
#   offset, trains on the first half less 1% of the frames at its end, and tests on the second
#   half less 1% at its end. The decoding matrix of a fit is the confusion matrix normalized by
#   the count of each actual class; matrices are averaged over fits (per class, over fits where
#   the class occurs). The median accuracy is the median of the diagonal (Methods, paragraph 5).
# - Shuffle (Methods, paragraph 5; the commented block in each decoding script and the shuffle in
#   subset_sweep.m). Each footprint's activity is circularly shifted by its own offset, drawn
#   uniformly over all offsets; labels are not shifted.
schema_version: 2
dataset:
  archive: dandi
  id: "000691"
paper: doi:10.1038/s41592-023-01806-1
claims:
