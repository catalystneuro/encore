# Claims for Pakhomov, Gudvangen, Mangalanathan, Kondratiev, Redondo & Semenov (2023), "Next
# generation CANCAN focusing for remote stimulation by nanosecond electric pulses",
# Bioelectrochemistry 152, 108437, tested on dandisets 000686, 000875, 001025, 001027 and 001028.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-10,
# protocol pilot-14 as stated in docs/protocol.md. It replaces the four files written 2026-10-22
# and 2026-10-23 under pilot-10, one per dataset (claims/pakhomov-2023/); ids are kept where the
# finding is the same, taken from the file of the dataset that holds the figure.
#
# Text read. The accepted author manuscript in PubMed Central (PMC10247516, NIHMS1891360), as
# served by ncbi_pmc, in paper/10.1016-j.bioelechem.2023.108437.txt: Introduction, Materials and
# methods (2.1 to 2.4), Results (3.1 to 3.5), Discussion and the legends of Figs. 1 to 9. It is
# not the version of record. The paper has no supplement (PMC marks "has-supplement no", and the
# text cites none). No PDF was supplied, so no figure was read, and values printed only in a
# figure (the voltages of Fig. 7 other than 2.4 and 5.6 kV, every axis value) are not used. The
# paper links no code and no data deposit (images were measured in MetaMorph 7.8.13 and Fiji,
# graphs drawn in Grapher 16), so no repository was read. Every method below is from the Methods
# or the figure legends.
#
# The datasets, from their titles on DANDI.
# - 000686, "Focusing electroporation to the center of a quadrupole electrode array by
#   interference of unipolar pulses", the title of Fig. 5. Claims on Fig. 5 rest on it.
# - 000875, "Influence of unipolar pulse packet quantity on centering the electroporation effect
#   within a quadrupole electrode array", the experiment of Fig. 6.
# - 001025, "The impact of voltage on CANCAN focusing of electroporation using four-electrode
#   arrays of varying sizes", the experiment of Fig. 7.
# - 001027, "CANCAN focusing of electroporation in a quadrupole array by different pulsing
#   protocols", the experiment of Fig. 8 (three packets, 1Px4, 4 kV).
# - 001028, "CANCAN focusing of electroporation in 3D", the title of Fig. 9.
# - No title names the single-cell experiment of Fig. 4 or the field simulations of Fig. 3, and
#   the paper gives no other data location. Those claims list all five datasets: the author checks
#   each, and blocks the claim as data_missing when none holds the data. They are kept because
#   Fig. 4 is the basis of the paper's design and of its last finding.
#
# Data the paper used, as it reports them. All experiments are in CHO-K1 cells. Electroporation is
# measured as uptake of YO-PRO-1 dye (YP), as fluorescence intensity.
# - Individual cells (Fig. 4; Methods 2.2, Results 3.1). Cells on 10-mm glass coverslips, 1 uM YP,
#   confocal images (40x, 0.95 NA) every 10 s for 600 s, pulses at 57 s. Two tungsten electrodes
#   (100 um diameter, 140 um gap, 50 um above the coverslip) driven from two EPULSUS-FPM4-7
#   channels. Five groups, 21 to 30 cells each (25 for the unipolar pulse): sham; one 600-ns
#   unipolar pulse at 15 kV/cm; and three bipolar signals that start with the same pulse and lose
#   1/8 of the first amplitude per phase (4 phases; 8 phases; 8 phases with 5-us delays). Per
#   cell, a manual ROI; F is its mean intensity, F0 the mean of the six images before the pulses,
#   and F-F0 is the measure. Groups were run in random order.
# - Cell monolayers (Figs. 5 to 9; Methods 2.3 and 2.4). 35-mm glass-bottom dishes, one dish per
#   experiment (Methods 2.1). A quadrupole array of four 1.5-mm needles (e1 to e4), small or large
#   (about 2-fold apart; the large has an 8.4-mm diagonal), touching the glass or, in Fig. 9, 1 to
#   3 mm above it. Packets 1, 2 and 3 of 600-ns unipolar pulses (Fig. 2B to D), delivered at 1 Hz.
#   "nPx4" is n packets from each electrode in turn; "1Px40" is one packet rotated 40 times; the
#   control "trains" energize one electrode with the same pulses. YP 1 uM for 10 min, rinsed, then
#   stitched 10x images. Intensity in 92 or 224 ROIs along one or both diagonals, over +/- 1.65 mm
#   (small array) or +/- 3.65 mm (large array) from the geometric center, leaving out areas next to
#   the electrodes (<5% of the diagonal length). Values in a.u. or in % of the most peripheral ROI
#   (closest to the electrode). Mean +/- s.e. over 3 to 5 independent experiments, LOESS fits.
#   Per figure: Fig. 5, Packet 2 at 6.4 kV, 40 packets against 40 trains, from e1 only (A, e1 to e3
#   diagonal) or rotated (B, C, both diagonals averaged), large array (Results 3.2 refers to Fig.
#   3C), n = 4 to 5. Fig. 6, Packet 2, 1Px4, 5Px4 and 10Px4, n = 3 to 4. Fig. 7, Packet 2 at
#   several first-pulse voltages, 1Px4 in the small array (A, B; 2.4 to 5.6 kV) and 10Px4 in the
#   large array (C, D), n = 3. Fig. 8, Packets 1, 2 and 3, 4 kV, 1Px4, n = 3 to 4. Fig. 9, large
#   array, Packet 2, 10Px4, 6.4 kV, 0, 1, 2 or 3 mm above the monolayer, n = 3 to 4.
# - Electric field simulations (Fig. 3; Methods 2.3) in Sim4Life, as in the paper's reference 15
#   (doi:10.1016/j.bioelechem.2021.107876). Model outputs, not recordings.
#
# Statistics (Methods 2.4). "Two-sided Student's t-test", p < 0.05, the only test the paper
# names; Student's names the equal-variance form, and Welch's form is a variant only. Between
# treatments the groups are different dishes, so the test is unpaired. In the figures,
# significance is read from the gap between error bars (a gap longer than the bars means
# p < 0.05); this rule is shown as a variant where a claim rests on a figure. Methods 2.2 names no
# test for the single cells; the Methods 2.4 test is used for them, and this is a reading.
#
# Details the paper leaves open, with the readings it allows. A criterion that uses one says so.
# For an expected value, the claim holds when it matches under any combination of readings. For a
# test, the outcome is the one all readings give; when they differ, the author adopts the reading
# the paper best supports, as an assumption, or blocks the claim as methods_underspecified, with
# every result shown.
# (O1) ROI layout. 92 (small) or 224 (large) ROIs "along one or both diagonals" over the stated
#      range. Readings (a) the count is for one diagonal, spacing about 36 um (small) or 33 um
#      (large); (b) the count is split over two diagonals, about 72 um or 65 um. The count and
#      range fix the ROI length along the diagonal under each reading; the extent across the
#      diagonal is not given. Readings (w1) square ROIs, side equal to the spacing (a standard
#      choice); (w2) three spacings wide, as a check on sensitivity. Neither comes from the paper.
# (O2) Diagonals. Fig. 5A uses the e1 to e3 diagonal and Fig. 5B averages both (legends). For
#      Figs. 6 to 9 the paper does not say. Readings (a) both diagonals averaged by distance;
#      (b) one diagonal.
# (O3) Center. Readings (a) the ROI nearest the geometric center; (b) the mean of the two ROIs on
#      either side of it when none is centered.
# (O4) Most peripheral ROI. Each measured diagonal has two ends. Readings (a) the mean of the end
#      ROIs; (b) each half-diagonal taken to its own end ROI, then averaged. For Fig. 5A the e1
#      end is named by the text.
# (O5) Normalization order. Readings (a) each dish normalized to its own most peripheral ROI,
#      then averaged; (b) the mean profile divided by its own most peripheral value. Tests on
#      normalized values use (a), which gives per-dish values.
# (O6) Background. Methods 2.4 says nothing about background for the monolayer images
#      (Methods 2.2 subtracts F0 for single cells). Readings (a) raw ROI intensity; (b) intensity
#      minus a background the images allow (a cell-free or dark area, or the needle footprints).
# (O7) Raw values or LOESS. Values in the text may have been read from ROI means or from the LOESS
#      fits, whose span is not given. Readings (a) dish means of ROI values; (b) the LOESS fit of
#      the mean profile, spans 0.25 and 0.75 as standard choices.
# (O8) Paired or unpaired. For comparisons inside the same dishes (center against trough, center
#      against periphery) the paper does not say. Readings (a) paired; (b) unpaired.
# (O9) Trough. "The least affected area ... between the center and the electrodes" (Results
#      3.3). The ROI with the lowest mean between the center and the most peripheral ROI.
#      Readings (a) the mean of the two sides; (b) each side.
# (O10) "End of recording" (Fig. 4). Readings (a) the last image (600 s); (b) the mean of the last
#      six images, matching the six-image baseline.
# (O11) Arrays and voltages. The paper does not state the array of Figs. 6 and 8, nor the
#      first-pulse voltage of Fig. 6, nor the voltages of Fig. 7C, D. The author takes them from
#      the dataset and reports them; they do not change a criterion.
schema_version: 2
paper: doi:10.1016/j.bioelechem.2023.108437
claims:
- id: fig3-field-simulation
  statement: In the simulations, 1 kV applied to one electrode gives about 1.8 kV/cm in the center
    of the small array and 0.8 kV/cm in the center of the large array, and about 4-fold more near
    the energized electrode (7 and 3.5 kV/cm per kV). Energizing one diagonal gives no field in the
    center.
  source: Methods 2.3, paragraph 4; Figure 3
  quote: For example, applying 1 kV to one electrode produced the electric field of approximately
    1.8 kV/cm and 0.8 kV/cm in center of the small and large arrays ... The electric field strength
    was about 4-fold higher near the energized electrode (7 kV/cm and 3.5 kV/cm per 1 kV applied, for
    the small and large arrays, respectively) Note that energizing either electrode diagonal produced
    no electric field in the center of the array
  datasets:
  - "000686"
  - "000875"
  - "001025"
  - "001027"
  - "001028"
  expected:
  - quantity: center field, small array, per kV on one electrode
    value: 1.8
    tolerance: 0.18
    unit: kV/cm
  - quantity: center field, large array, per kV on one electrode
    value: 0.8
    tolerance: 0.08
    unit: kV/cm
  - quantity: field near the energized electrode, small array, per kV
    value: 7
    tolerance: 0.7
    unit: kV/cm
  - quantity: field near the energized electrode, large array, per kV
    value: 3.5
    tolerance: 0.35
    unit: kV/cm
  criterion: The values are outputs of the paper's Sim4Life model (Methods 2.3, built as in its
    reference 15), which the paper does not deposit. The claim is tested only if a dataset holds
    the simulated field maps; a field model built by the author is not the paper's and is not a
    test. With the maps, reproduced when the four values are within tolerance and the center field
    with a diagonal energized is below 1% of the single-electrode center field. How far from the
    electrode "near" is measured is not given; the highest value outside the needle is used. Without
    the maps, blocked as data_missing.
- id: fig4-sham-no-uptake
  statement: Sham-exposed cells gain no YP fluorescence over the 10 min of imaging, while cells
    given pulses show a gradual rise in YP signal from the first image after exposure.
  source: Results 3.1, paragraph 2; Figure 4
  quote: Sham-exposed cells showed no gain in YP fluorescence during the 10 min of observation. In
    contrast, cells treated by electric pulses displayed gradual increase in YP signal, starting from
    the image frame taken immediately after nsEP exposure.
  datasets:
  - "000686"
  - "000875"
  - "001025"
  - "001027"
  - "001028"
  criterion: Per cell F-F0 (Methods 2.2). A claim of absence for sham, for which the paper reports
    no test; it is judged with the test Methods 2.4 names, a two-sided Student's t-test at p < 0.05,
    here one-sample against zero at the end of recording (O10, both readings). Reproduced when sham
    F-F0 does not differ from zero, and, for every pulsed group, the mean at the first image after
    57 s exceeds zero by the same test and the end value exceeds the first post-pulse value. Not
    reproduced when sham differs from zero. The sham effect size is given either way.
- id: fig4-unipolar-strongest
  statement: A single 600-ns pulse at 15 kV/cm causes by far the strongest YP uptake, 126 +/- 14
    a.u. (n = 25 cells) by the end of recording.
  source: Results 3.1, paragraph 2; Figure 4
  quote: A single 600-ns pulse at 15 kV/cm caused by far the strongest YP uptake, reaching 126±14
    a.u. (n=25) by the end of recording.
  datasets:
  - "000686"
  - "000875"
  - "001025"
  - "001027"
  - "001028"
  expected:
  - quantity: unipolar pulse, F-F0 at end of recording, mean over cells
    value: 126
    tolerance: 14
    unit: a.u.
  criterion: Tolerance is the paper's s.e. Per cell F-F0 (Methods 2.2), mean over cells, at the end
    of recording (O10). Reproduced when, under one reading, the mean is within tolerance and exceeds
    every other group's mean. The group size is reported against n = 25.
- id: fig4-bipolar-weaker
  statement: Bipolar signals that start with the same pulse cause significantly weaker uptake
    (p < 0.001). By the end of recording the 4-phasic signal reaches 20.8 +/- 2.0 a.u., the 8-phasic
    6.9 +/- 1.6 a.u., and the 8-phasic with 5-us delays 25.4 +/- 2.8 a.u.
  source: Results 3.1, paragraph 2; Figure 4
  quote: Bipolar signals started with exactly the same pulse (600 ns, 15 kV/cm) but caused
    significantly weaker effects (p<0.001). By the end of recording, YP signal reached only 20.8±2.0
    a.u. for the 4-phasic signal; 6.9±1.6 a.u. for the 8-phasic signal; and 25.4±2.8 a.u. for the
    8-phasic signal with 5-μs delays between phases.
  datasets:
  - "000686"
  - "000875"
  - "001025"
  - "001027"
  - "001028"
  statistics:
  - about: each bipolar signal against the single unipolar pulse, end of recording
    test: not named for single cells (Methods 2.2 names none; Methods 2.4 names a two-sided
      Student's t-test)
    p: 0.001
    p_relation: "<"
    n: 21 to 30 cells per group
  expected:
  - quantity: 4-phasic, F-F0 at end of recording
    value: 20.8
    tolerance: 2.0
    unit: a.u.
  - quantity: 8-phasic, F-F0 at end of recording
    value: 6.9
    tolerance: 1.6
    unit: a.u.
  - quantity: 8-phasic with 5-us delays, F-F0 at end of recording
    value: 25.4
    tolerance: 2.8
    unit: a.u.
  criterion: Tolerances are the paper's s.e. Per cell F-F0 at the end of recording (O10). Each
    bipolar group is compared with the unipolar group by an unpaired two-sided Student's t-test
    (Methods 2.4, applied to single cells as a reading; Welch's form is a variant). Reproduced when,
    under one reading of O10, all three means are within tolerance and all three tests give
    p < 0.001. Partially reproduced when the tests hold but a mean is outside tolerance.
- id: fig4-twenty-fold-cancellation
  statement: The 8-phasic signal with no delays causes about 20-fold weaker electroporation than a
    single unipolar pulse and is the most efficient at cancellation; the 4-phasic signal and the
    delayed 8-phasic signal cancel 4 to 5-fold.
  source: Figure 4 legend; Results 3.1, paragraph 2; Results 3.4, paragraph 1
  quote: Note that applying the 8-phasic bipolar signal with no inter-phase delays caused about
    20-fold weaker electroporation than a single unipolar pulse
  datasets:
  - "000686"
  - "000875"
  - "001025"
  - "001027"
  - "001028"
  depends_on:
  - fig4-unipolar-strongest
  - fig4-bipolar-weaker
  expected:
  - quantity: unipolar over 8-phasic, F-F0 at end of recording
    value: 20
    tolerance: 2
  - quantity: unipolar over 4-phasic, and over delayed 8-phasic (range 4 to 5, widened by 10% of
      each bound)
    value: 4.55
    tolerance: 0.95
  criterion: Ratios of group means at the end of recording (O10). Results 3.4 gives the other two
    signals as "4-5-fold, Fig. 4"; the paper's own means give 18.3 for the 8-phasic signal, 6.1 for
    the 4-phasic and 5.0 for the delayed 8-phasic, so its 4-phasic value is outside its own range.
    Reproduced when, under one reading, the 8-phasic ratio is within 18 to 22, is the largest of the
    three, and the other two ratios are within 3.6 to 5.5. Partially reproduced when the 8-phasic
    ratio is within tolerance and the largest but another ratio is outside 3.6 to 5.5; the paper's
    6.1 is reported beside the result.
- id: fig5a-trains-stronger
  statement: Without rotation, 40 unipolar trains from e1 cause much stronger electroporation
    throughout the array than 40 Packet 2 packets started from e1, and the uptake after trains
    follows the field strength distribution.
  source: Results 3.2, paragraph 1; Figure 5A
  quote: The lack of cancellation caused a much stronger electroporation throughout the array, and
    the distribution of YP uptake expectedly followed the electric field strength distribution in
    Fig. 3C .
  datasets:
  - "000686"
  criterion: Along the e1 to e3 diagonal (Fig. 5A legend), Packet 2 at 6.4 kV, n = 4 to 5 dishes,
    under O1, O3, O6 and O7. "Throughout" is read at the e1 end, the center and the e3 end. Reproduced
    when the train mean exceeds the packet mean at all three places by unpaired two-sided Student's
    t-tests at p < 0.05 (Methods 2.4), and the train profile falls from the e1 end to the center, as
    the field of Fig. 3C does with distance from the energized electrode, by the same test (O8). The
    paper gives no test of the profile's shape; the full train profile is shown.
- id: fig5a-packet-center-enhanced
  statement: Without rotation, Packet 2 enhances electroporation in the center of the array despite
    the weakening of the field with distance from e1, but uptake near e1 stays stronger than in the
    center.
  source: Results 3.2, paragraph 1; Figure 5A
  quote: In contrast, Packet 2 enhanced electroporation in the center of the array, despite gradual
    weakening of the electric field with distance from e1. However, the bipolar cancellation only
    partially offset the electric field weakening, and electroporation near e1 remained stronger than
    in the center.
  datasets:
  - "000686"
  depends_on:
  - fig5a-trains-stronger
  criterion: The 40-packet profile along the e1 to e3 diagonal (Fig. 5A), under O1, O3, O6, O7 and O8.
    "Enhanced in the center" has two readings the sentence allows, (a) a central peak, the center
    above the trough between the center and the e1 end (O9) by a two-sided Student's t-test at
    p < 0.05; (b) relative to the trains, the center over e1-end ratio higher for packets than for
    trains by an unpaired t-test on per-dish ratios at p < 0.05. Reproduced when (a) or (b) holds,
    under the rule for readings of the opening comment, and the e1-end value exceeds the center
    value of the packet profile by the same test. Partially reproduced when only one of the two
    parts holds.
- id: fig5b-rotation-center-peak
  statement: With rotation (1P x 40), Packet 2 smears the effect at the perimeter and brings out a
    remote effect in the center, while the same rotation of unipolar trains (1T x 40) leaves a void
    of electroporation in the center.
  source: Results 3.2, paragraph 2; Figure 5B
  quote: Rotation with Packet 2 “smeared” the electroporation effect at the perimeter and emphasized
    the remote effect in the center. This remote effect contrasted with a void of electroporation in
    the center when the pulse train was applied in the same manner instead of the packet.
  datasets:
  - "000686"
  criterion: Profiles averaged across both diagonals (Fig. 5B legend), n = 4 to 5, under O1, O3, O4,
    O6, O7 and O8. Reproduced when the 1P x 40 center exceeds its trough (O9) by a two-sided
    Student's t-test at p < 0.05, and the 1T x 40 profile shows a void in the center. The paper does
    not define a void; readings (a) the 1T x 40 center below its most peripheral value by the same
    test; (b) the center ROI is the lowest point of the 1T x 40 mean profile.
