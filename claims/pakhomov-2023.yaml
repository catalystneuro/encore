    three ratios are within tolerance. Partially reproduced when one or two are.
- id: fig7b-targeting-independent-of-amplitude
  statement: Normalized to the most peripheral ROI, the profiles for different amplitudes fully
    overlap; amplitude changes the degree of electroporation but not its spatial distribution.
  source: Results 3.3, paragraph 2; Figure 7B
  quote: In contrast, changing nsEP amplitude affected the degree of electroporation but not its
    spatial distribution ( Fig. 7 ). ... When the YP emission was normalized to the most peripheral
    ROI, the data for different nsEP amplitudes fully overlapped ( Fig. 7B ).
  datasets:
  - "001025"
  criterion: A claim of absence, for which the paper reports no test; it is judged on the test
    Methods 2.4 names, an unpaired two-sided Student's t-test at p < 0.05, with no correction, as
    the paper applies none. Small array, 1Px4, every voltage of Fig. 7A and B (n = 3 each; the
    voltages between 2.4 and 5.6 kV are printed only in the figure and are taken from the dataset).
    Per-dish normalized values (O5 a) at the center and at the half-way ROI of
    fig7a-amplitude-scales-uptake are compared between every pair of voltages, under O1 to O4, O6
    and O7. Reproduced when no pair differs; not reproduced when any does. The differences in
    percentage points and their p-values are given either way; a test over all ROIs and the
    error-bar rule of Methods 2.4 are shown as variants.
- id: fig7cd-holds-for-large-array
  statement: The independence of the normalized distribution from amplitude also holds when
    rotating multiple packets (10Px4) in the larger array.
  source: Results 3.3, paragraph 2; Figures 7C and 7D
  quote: The findings held true for rotating multiple packets and when using the larger array ( Fig.
    7C and D ). Overall, our results show that NG-CANCAN targeting of electroporation does not
    depend on nsEP amplitude, at least within the studied amplitude range.
  datasets:
  - "001025"
  criterion: As fig7b-targeting-independent-of-amplitude, on the large array with 10Px4 (Fig. 7C
    and D, n = 3), with the same test, places and rule. The voltages are not given in the text and
    are taken from the dataset (O11). The rise of a.u. values with voltage at the three places is
    reported as well.
- id: discussion-independent-of-array-size
  statement: Remote targeting, within the studied limits, depends neither on pulse amplitude nor on
    array size, so findings from small arrays can be extrapolated to larger inter-electrode
    distances.
  source: Discussion, paragraph 5; Figure 7
  quote: the remote targeting, at least within studied limits, did not depend on either the electric
    pulse amplitude or array size ( Fig. 7 ). We infer that findings from small electrode arrays
    can be extrapolated to larger inter-electrode distances.
  datasets:
  - "001025"
  depends_on:
  - fig7b-targeting-independent-of-amplitude
  - fig7cd-holds-for-large-array
  criterion: The paper's evidence is Fig. 7, where the small array received 1Px4 and the large
    array 10Px4, and Fig. 6B reports that packet number alone changes the normalized center; no
    comparison in the paper isolates array size, and it names no test for it. The claim is judged
    as the Discussion rests it, on amplitude independence in both arrays. Reproduced when
    fig7b-targeting-independent-of-amplitude and fig7cd-holds-for-large-array are both
    reproduced. The normalized profiles of the two arrays, on distance as a fraction of the
    measured half-diagonal, are shown side by side, with the packet confound stated.
- id: fig8a-equal-center-uptake
  statement: Packets 1, 2 and 3 at 4 kV, rotated one cycle (1Px4), give the same YP uptake in the
    center of the array, 215 to 235 a.u.
  source: Results 3.4, paragraph 2; Figure 8A
  quote: All packets produced the same YP uptake in the center (215–235 a.u.)
  datasets:
  - "001027"
  expected:
    quantity: center YP intensity, each of Packets 1, 2 and 3 (range 215 to 235, widened by 10% of
      each bound)
    value: 226
    tolerance: 32.5
    unit: a.u.
  criterion: Center (O3) in a.u., n = 3 to 4, under O1, O2, O6, O7 and O11. The equality is a claim
    of absence, judged on the test Methods 2.4 names, an unpaired two-sided Student's t-test at
    p < 0.05 between each pair of packets. Reproduced when, under one reading, the three means are
    inside 193.5 to 258.5 a.u. and no pair differs. Not reproduced when a pair differs; partially
    reproduced when no pair differs but a mean is outside the range. Effect sizes are given either
    way.
- id: fig8a-more-uptake-near-electrodes
  statement: Packets 1 and 3 cause much more YP uptake near the electrodes (250 to 350 a.u.) than
    Packet 2 (about 120 a.u.), p < 0.01.
  source: Results 3.4, paragraph 2; Figure 8A
  quote: but Packets 1 and 3 caused drastically more YP uptake near the electrodes (250–350 a.u. vs
    ~120 a.u. for packet 1, p<0.01, Fig. 8A )
  datasets:
  - "001027"
  statistics:
  - about: Packets 1 and 3 against Packet 2, near the electrodes
    test: two-sided Student's t-test (Methods 2.4)
    p: 0.01
    p_relation: "<"
    n: 3 to 4 experiments per packet
  expected:
  - quantity: most peripheral ROI, Packets 1 and 3 (range 250 to 350, widened by 10% of each bound)
    value: 305
    tolerance: 80
    unit: a.u.
  - quantity: most peripheral ROI, Packet 2
    value: 120
    tolerance: 12
    unit: a.u.
  criterion: The text prints "~120 a.u. for packet 1", which its own clause contradicts (Packets 1
    and 3 are the 250 to 350 group); it is read as Packet 2, which also fits Fig. 8B (about 226
    over 120 is near 183%). "Near the electrodes" is the most peripheral ROI (O4), under O1, O2, O6
    and O7. Reproduced when, under one reading, Packets 1 and 3 are inside 225 to 385 a.u., Packet 2
    within tolerance, and each of Packets 1 and 3 exceeds Packet 2 by an unpaired two-sided
    Student's t-test at p < 0.01. Partially reproduced when the tests hold but values are outside.
- id: fig8b-packet2-best-targeting
  statement: Normalized to the most peripheral ROI, YP emission in the center is 183% for Packet 2
    and drops to 83% for Packet 3 and 74% for Packet 1.
  source: Results 3.4, paragraph 2; Figure 8B
  quote: The superiority of Packet 2 for CANCAN targeting is highlighted by the drop of normalized
    YP emission in the center from 183% for Packet 2 to 83% and 74% for Packets 3 and 1, respectively
    ( Fig. 8B ).
  datasets:
  - "001027"
  expected:
  - quantity: normalized center, Packet 2
    value: 183
    tolerance: 18.3
    unit: "%"
  - quantity: normalized center, Packet 3
    value: 83
    tolerance: 8.3
    unit: "%"
  - quantity: normalized center, Packet 1
    value: 74
    tolerance: 7.4
    unit: "%"
  criterion: Center (O3) in % of the most peripheral ROI (O4, O5), under O1, O2, O6 and O7. Reproduced
    when, under one combination of readings, all three values are within tolerance. Partially
    reproduced when Packet 2 is above 100% and Packets 1 and 3 below it but a value is outside
    tolerance.
- id: fig8-cancellation-predicts-targeting
  statement: The bipolar signal with the strongest cancellation between two electrodes (8-phasic,
    Fig. 4) gives the most efficient remote targeting in the quadrupole (Packet 2, Fig. 8).
  source: Discussion, paragraph 3; Results 3.4, paragraphs 1 and 2; Figures 4 and 8
  quote: Three packets for CANCAN targeting were designed to produce three types of bipolar signals
    near electrodes and we showed that, indeed, the strongest bipolar cancellation has led to the
    most efficient remote targeting ( Figs. 4 and 8 ).
  datasets:
  - "001027"
  depends_on:
  - fig4-twenty-fold-cancellation
  - fig8b-packet2-best-targeting
  criterion: Results 3.4 matches the signals to the packets (4-phasic to Packet 1, 8-phasic to
    Packet 2, delayed 8-phasic to Packet 3). Reproduced when the signal with the largest
    unipolar-over-bipolar ratio in Fig. 4 corresponds to the packet with the highest normalized
    center in Fig. 8. The paper claims only the top match; the order of the other two is reported
    (the paper's own numbers give Packet 1 more cancellation, 6.1 against 5.0, but less targeting,
    74% against 83%). Blocked as data_missing when the Fig. 4 data are in no dataset.
- id: fig9a-gap-reduces-periphery-more
  statement: With the large array lifted 1, 2 and 3 mm above the monolayer, YP emission near the
    electrodes falls 2.4, 6.4 and 9 times against electrodes touching the cells, while in the center
    it falls only 1.02, 1.4 and 3.8 times.
  source: Results 3.5, paragraph 1; Figure 9A
  quote: Specifically, YP emission near the electrodes decreased 2.4, 6.4, and 9 times with 1-, 2-
    and 3-mm gaps (as compared to electrodes being in the same plane with cells); in the center, it
    decreased just 1.02, 1.4, and 3.8 times, respectively.
  datasets:
  - "001028"
  expected:
  - quantity: 0 mm over 1 mm, near electrodes
    value: 2.4
    tolerance: 0.24
  - quantity: 0 mm over 2 mm, near electrodes
    value: 6.4
    tolerance: 0.64
  - quantity: 0 mm over 3 mm, near electrodes
    value: 9
    tolerance: 0.9
  - quantity: 0 mm over 1 mm, center
    value: 1.02
    tolerance: 0.102
  - quantity: 0 mm over 2 mm, center
    value: 1.4
    tolerance: 0.14
  - quantity: 0 mm over 3 mm, center
    value: 3.8
    tolerance: 0.38
  criterion: Ratios of the mean intensities over dishes (n = 3 to 4), 0 mm over each gap. "Near the
    electrodes" is the most peripheral ROI (Fig. 9B legend, "measurements most distant from the
    center"; O4); center as O3; under O1, O2, O6 and O7. Reproduced when, under one combination of
    readings, all six ratios are within tolerance. Partially reproduced when at every gap the
    near-electrode ratio exceeds the center ratio but some values are outside tolerance.
- id: fig9b-gap-boosts-targeting
  statement: The faster fading near the electrodes raises targeting efficiency (center over
    periphery) to as much as 600% with a 2-mm gap.
  source: Results 3.5, paragraph 1; Figure 9B
  quote: Such disproportionally faster fading of the effect near electrodes boosted the CANCAN
    targeting efficiency (measured as a ratio of the effect in the center and at the periphery) to as
    much as 600% for the 2-mm gap ( Fig. 9B ).
  datasets:
  - "001028"
  depends_on:
  - fig9a-gap-reduces-periphery-more
  expected:
    quantity: normalized center, 2-mm gap
    value: 600
    tolerance: 60
    unit: "%"
  criterion: Center (O3) in % of the most peripheral ROI (O4, O5), under O1, O2, O6 and O7.
    Reproduced when, under one combination of readings, the 2-mm value is within 540 to 660% and
    is the largest of the four distances ("as much as"). Partially reproduced when it is within
    tolerance but another distance is higher. The 0, 1 and 3 mm values are reported.
- id: fig9c-restricted-to-center
  statement: With the electrodes placed above the monolayer, electroporation is restricted almost
    exclusively to the center of the array.
  source: Results 3.5, paragraph 1; Figure 9C
  quote: Consistent with these measurements, YP fluorescence images in Fig. 9C show that
    electroporation is restricted almost exclusively to the remote target (center) when electrodes
    are placed above the cell monolayer.
  datasets:
  - "001028"
  criterion: The paper shows sample images and gives no measure. Read on the profiles, under O1 to
    O9. Reproduced when, at each of 1, 2 and 3 mm, the center exceeds the most peripheral ROI by a
    two-sided Student's t-test at p < 0.05 (O8), and the center is the highest point of the mean
    profile. The normalized profiles are shown.
