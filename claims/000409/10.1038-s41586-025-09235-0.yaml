- id: behav-performance
  statement: After training, mice made correct choices on 81.4 +/- 0.4% (mean +/- s.d.) of trials.
  source: Results, Behavioural task, paragraph 2
  quote: After training, they made correct choices on 81.4 ± 0.4% (mean ± s.d.) of the trials
  expected:
