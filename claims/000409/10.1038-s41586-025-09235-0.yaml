  expected:
    quantity: mean delta R2 of the correct feedback kernel
    value: 0.0086
    tolerance: 0.00086
- id: video-correlates
  statement: More than half of the neurons in most brain regions were significantly correlated with
    at least one behavioural variable from video (nose, paw, pupil, tongue).
  source: Results, Representation of wheel movement, paragraph 5; Extended Data Fig. 15
  quote: More than half of the neurons in most brain regions were significantly correlated with at
    least one behavioural variable (Extended Data Fig. 15b).
- id: granger-interactions
  statement: High Granger interaction scores were found for region pairs from all major brain
    regions, weakly correlated with anatomical distance and mostly bidirectional.
  source: Results, Neural analyses, paragraph 8; Extended Data Fig. 4
  quote: High Granger interaction scores were obtained for region pairs from all major brain
    regions, which were weakly correlated with anatomical distance and mostly bidirectional.
