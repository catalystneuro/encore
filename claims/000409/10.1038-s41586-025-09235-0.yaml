    to 2 s and complete events); (c) mean over sessions of all trials; (d) all trials pooled.
    Reproduced when one reading is within tolerance. The spread is reported as s.d. and s.e.m.
- id: behav-zero-contrast
  statement: On 0% contrast trials mice were rewarded on 58.7 +/- 0.4% (mean +/- s.e.m. across mice)
    of trials, better than chance (t138 = 20.18, P = 5.2e-43).
  source: Results, Behavioural task, paragraph 2; Fig. 1d legend
  quote: On 0% contrast trials, in which no visual information was provided, mice gained rewards on
    58.7 ± 0.4% (mean ± s.e.m) of trials, significantly better than chance
  statistics:
  - test: t-test
    statistic: t138 = 20.18
    p: 5.2e-43
    n: 139 mice
  expected:
  - quantity: percent correct at 0% contrast, mean over mice
    value: 58.7
    tolerance: 0.4
    unit: '%'
  - quantity: t statistic against 50%
    value: 20.18
    tolerance: 2.02
  criterion: One value per mouse, pooled over its sessions; one-sample t-test against 50% with 138
    degrees of freedom. Readings (a) all 0% contrast trials, (b) analysed 0% contrast trials.
    Reproduced when both values are within tolerance under one reading.
- id: behav-early-movements
  statement: 22.8% of first wheel-movement times occurred under 80 ms after stimulus onset.
  source: Fig. 1c legend
  quote: A total of 22.8% first wheel-movement times occurred under 80 ms (not shown).
  expected:
    quantity: percent of first movement times below 80 ms
    value: 22.8
    tolerance: 2.28
    unit: '%'
  criterion: First movement time is the first movement minus stimulus onset. Readings, (a) over all
    trials of the 459 sessions, a trial without a first movement counting as not early; (b) over
    trials with both times; (c) mean over sessions of (b).
- id: fig1d-contrast
  statement: Mice performed better and faster on trials with high visual contrast.
  source: Fig. 1d; Results, Behavioural task, paragraph 2
  quote: they made correct choices on 81.4 ± 0.4% (mean ± s.d.) of the trials, performing better and
    faster on trials with high visual stimulus contrast (Fig. 1d).
  criterion: Per mouse, pooled over sessions, the percent correct and the median first movement
    time at each of the five contrasts, over trials with a response. Reproduced when, across mice,
    percent correct at 100% is higher than at 0% and median first movement time at 100% is shorter
    than at 0% (Wilcoxon signed-rank p < 0.05 each), and the median over mice of percent correct
    rises with contrast at every step; partially reproduced when only one of the two measures holds.
- id: fig1ef-end-of-session
  statement: Towards the end of the sessions, performance decreased and first wheel-movement times
    increased.
  source: Fig. 1e,f; Results, Behavioural task, paragraph 2
  quote: Towards the end of the sessions, performance decreased and first wheel-movement times
    increased (Fig. 1e,f).
  criterion: Per mouse, pooled over sessions, the percent correct on non-zero contrast trials and
    the median first movement time over the last 50 trials of each session against trials 51 to 300
    before the end. Reproduced when the end has lower percent correct and longer first movement
    times (Wilcoxon signed-rank across mice p < 0.05 each); partially reproduced when one holds.
- id: fig1g-block-switch
  statement: After a block switch, mice took around 5 to 10 trials to adjust their behaviour, as shown
    by the fraction of correct choices on 0% contrast trials after the switch.
  source: Fig. 1g; Results, Behavioural task, paragraph 2
  quote: After a block switch, mice took around 5–10 trials to adjust their behaviour to the new
    block, as revealed by the fraction of correct choices made on 0% contrast trials after the
    switch (Fig. 1g).
  criterion: Switches between biased blocks; on 0% contrast trials at positions 1 to 40 after the
    switch, the fraction of choices matching the stimulus side (which follows the new block), per
    position pooled over each mouse's sessions and averaged over mice. Fit p(n) = a - b exp(-(n - 1) /
    tau). Readings (a) tau, (b) the trials to cover 90% of the change, 1 + tau ln 10. Reproduced when
    one reading lies within 4.5 to 11 trials (5 to 10 widened by 10%).
- id: fig1h-block-bias
  statement: For all contrast values mice chose the side of the block's likely stimulus more often,
    responding right more often in right blocks than in left blocks.
  source: Fig. 1h; Results, Behavioural task, paragraph 2
  quote: That is, for all contrast values, mice tended to answer left more often on left blocks than
    right blocks (Fig. 1h).
  criterion: Per mouse, the fraction of right choices at each of the nine signed contrasts in right
    blocks (p_left 0.2) and left blocks (p_left 0.8), over trials with a response. Reproduced when
    the right-block fraction is higher at all nine contrasts (median difference above 0 and Wilcoxon
    signed-rank p < 0.05 across mice); partially reproduced at 6 to 8 contrasts.
- id: dec-stim-restricted
  statement: The visual stimulus side, decoded from the first 100 ms after stimulus onset, was
    represented in a narrower set of regions than choice or feedback, with strong signatures in
    visual cortex such as VISp.
  source: Fig. 4a,i; Results, Representation of visual stimulus, paragraph 2; Discussion, paragraph
    4
  quote: the activity of neurons in the primary visual cortex (VISp) could be used to predict the
    stimulus side (Fig. 4i) ... The visual stimulus (Fig. 4) was represented (before movement) in a
    more restricted manner.
  criterion: Decoding of stimulus side on non-zero contrast analysed trials, null from
    pseudo-sessions, over the tested regions (see the opening comment). Reproduced when VISp is
    significant and fewer tested regions are significant for stimulus than for choice and than for
    feedback; partially reproduced when only one of the two holds. The agreement of each region's
    significance with the paper's table region_info.csv is reported, and does not decide.
- id: dec-choice-widespread
  statement: Choice, decoded from the 100 ms before the first wheel movement, was represented in a
    larger number of regions than the visual stimulus, with strong effects in hindbrain regions such
    as GRN.
  source: Fig. 5a,i; Results, Representation of choice, paragraph 2
  quote: The decoding analysis suggested a representation of choice (left versus right upcoming
    action) in a larger number of brain regions than the representation of the visual stimulus ...
    The strongest effect sizes were observed in the hindbrain (GRN, VII, PRNr and MARN)
  criterion: Decoding of choice on analysed trials, null from synthetic sessions of an action-kernel
    model fitted per session, over the tested regions. Reproduced when GRN is significant and more
    tested regions are significant for choice than for stimulus; partially reproduced when only one
    holds.
- id: dec-feedback-nearly-all
  statement: Whether the trial was correct could be decoded from the 200 ms after feedback onset in
    nearly all recorded regions, almost perfectly in many.
  source: Fig. 6a,i; Results, Representation of feedback, paragraph 2
  quote: Using the neural responses in the 200 ms after feedback onset, we were able to decode
    whether the trial was correct from nearly all recorded brain regions (Fig. 6a,f). In many
    regions, decoding was almost perfect.
  criterion: Decoding of feedback on analysed trials, null from synthetic sessions, over the 10
    tested regions. Reproduced when at least 9 tested regions, including IRN, are significant;
    partially reproduced for 6 to 8; not reproduced below 6. The number of region-sessions with a
    balanced accuracy above 0.9 is reported.
- id: sc-stim-fraction
  statement: Single-cell tests controlling for choice and block found few stimulus-selective neurons
    (0.5% of all neurons); even in the regions with the largest fractions, such as visual cortex,
    the fraction did not exceed about 10%.
  source: Fig. 4b; Results, Representation of visual stimulus, paragraph 4
  quote: with 0.5% of all neurons correlated with a stimulus side (Fig. 4b) ... However, even in the
    regions that contained the largest fractions of responsive neurons (such as the visual cortex),
    this fraction did not exceed about 10%.
  criterion: Over the neurons of the tested and latency regions (14 regions). Reproduced when no
    region exceeds 11% and at least 10 of the 14 regional fractions are within 0.02 of the paper's
    region_info.csv value. The 0.5% of all neurons cannot be tested on a set of regions chosen this
    way, and the pooled fraction is reported. The paper's false-positive rate for the selection,
    0.001 x 0.05 = 5e-5, is checked with a null run (pseudo-session stimulus sides and blocks); if
    the 95% interval of the null fraction excludes 1/3 to 3 times 5e-5, the claim is blocked as
    methods_underspecified.
- id: sc-choice-fraction
  statement: More neurons responded to choice than to the visual stimulus (4% of all neurons),
    with the largest fractions in hindbrain, midbrain and thalamic regions.
  source: Fig. 5b; Results, Representation of choice, paragraph 3
  quote: More single neurons significantly responded to choice than to the visual stimulus (Fig.
    5b,f). That is, firing rates of 4% of all neurons ... The largest fractions of neurons that
    significantly responded to choice were in the hindbrain, cerebellar, midbrain and thalamic
    regions
  criterion: Over the same 14 regions. Reproduced when the pooled choice fraction is higher than the
    pooled stimulus fraction (binomial test on the neurons selective for exactly one, p < 0.05) and
    the regional choice fractions correlate with region_info.csv (Spearman, p < 0.05). The same
    false-positive check applies, with synthetic choices.
- id: traj-latency-visual
  statement: The latency of the stimulus trajectory separation ordered the visual regions as LGd <
    VISp, which is about equal to LP, < VISpm < VISam, at about 34, 42, 42, 57 and 78 ms.
  source: Fig. 4d,l,m; Results, Representation of visual stimulus, paragraph 7
  quote: A spatiotemporally finely resolved view of latency differences was obtained, such that LGd
    < VISp ≈ LP < VISpm < VISam (latencies of around 34, 42, 42, 57 and 78 ms, respectively
  expected:
  - quantity: LGd latency
    value: 34
    tolerance: 3.4
    unit: ms
  - quantity: VISp latency
    value: 42
    tolerance: 4.2
    unit: ms
  - quantity: LP latency
    value: 42
    tolerance: 4.2
    unit: ms
  - quantity: VISpm latency
    value: 57
    tolerance: 5.7
    unit: ms
  - quantity: VISam latency
    value: 78
    tolerance: 7.8
    unit: ms
  criterion: Trajectories over all canonical sessions of each region, 0 to 150 ms after stimulus
    onset. Latency as the Methods define it, the first time the distance reaches 70% of its range;
    the code's added condition that this time be significant point-wise is a variant. Reproduced
    when the order holds (LGd below both VISp and LP, both below VISpm, VISpm below VISam, and VISp
    and LP within 10 ms of each other) and all five values are within tolerance; partially
    reproduced when only one of the two holds.
- id: traj-latency-late
  statement: The early visual wave was followed by later stimulus encoding in the MRN, SCm, PRNr, IRN
    and GRN, with latencies of about 100 to 120 ms.
  source: Fig. 4d,l,m; Results, Representation of visual stimulus, paragraph 7
  quote: This early wave of activity was followed substantially later by significant visual encoding
    in other areas, including the MRN, SCm, PRNr, IRN and GRN (latencies of about 100−120 ms
  expected:
  - quantity: IRN latency
    value: 111
    tolerance: 21
    unit: ms
  - quantity: GRN latency
    value: 111
    tolerance: 21
    unit: ms
  criterion: Only IRN and GRN are loaded (MRN, SCm and PRNr would add many sessions). The reported
    range 100 to 120 ms widened by 10% of each bound is 90 to 132 ms, written as 111 +/- 21.
    Reproduced when both latencies (Methods' definition) are in 90 to 132 ms and both
    regions' distances are significant; partially reproduced for one region.
- id: traj-stim-regions
  statement: The stimulus trajectory distance was significant in 104 regions.
  source: Results, Representation of visual stimulus, paragraph 6; Fig. 4c
  quote: Altogether, this analysis indicated that distance was a significant result in 104 regions
    (Fig. 4c,f).
  expected:
    quantity: regions with significant stimulus trajectory distance
    value: 104
    tolerance: 10.4
  criterion: Trajectories as in traj-latency-visual (0 to 150 ms after stimulus onset, analysed
    trials, 1000 permutations of stimulus side within block and choice, P = (n + 1) / (M + 1) on
    the amplitude) for every canonical region, pooling its canonical units over its sessions with
    valid blocks; a region with fewer than 20 such units is not tested and counts as not
    significant. Readings (a) Benjamini-Hochberg at q = 0.01 over the regions (Methods, multiple
    comparisons), (b) P < 0.01 without correction (Methods, trajectory analysis). Reproduced when the
    count is within 104 +/- 10.4 under one reading. The code's Benjamini-Yekutieli correction and
    the variant with the 64 sessions of invalid blocks are shown and do not decide; agreement of each
    region with the stim_euc_sig column of region_info.csv is reported and does not decide.
- id: fback-oscillation-licking
  statement: During reward delivery, activity showed coherent oscillations of about 10 Hz that were
    missing after negative feedback and were closely related to licking.
  source: Results, Representation of feedback, paragraph 4; Fig. 6j-l; Extended Data Fig. 12
  quote: multiple brain areas exhibited coherent approximately 10 Hz oscillatory dynamics during
    reward delivery that was phase-locked across brain areas ... These oscillatory dynamics were
    missing during negative feedback and were closely related to licking behaviour
  criterion: In IRN, the paper's example region, the session mean PSTH over units (5 ms bins, 0 to 1
    s after feedback) on correct and on incorrect trials, and the lick PSTH of the same sessions.
    Reproduced when (i) the median over sessions of the peak frequency (4 to 20 Hz) of the correct
    PSTH is within 9 to 11 Hz, (ii) power within 1 Hz of each session's correct peak is higher on
    correct than incorrect trials (Wilcoxon signed-rank p < 0.05), and (iii) the median lick PSTH
    peak is within 1 Hz of the neural one. Partially reproduced when (ii) and (iii) hold and (i)
    does not.
- id: wheel-speed-decoding
  statement: Wheel speed was decodable from 163 of the 201 regions.
  source: Results, Representation of wheel movement, paragraph 2; Fig. 7a
  quote: Wheel speed was decodable from 81% of the reportable areas (163 out of 201)
  expected:
    quantity: regions with significant wheel-speed decoding
    value: 163
    tolerance: 16.3
