# Claims for International Brain Laboratory et al. (2025), A brain-wide map of neural activity
# during complex behaviour, Nature 645, 177-191, on dandiset 000409.
# Source: the full text of the version of record (open access, CC BY 4.0), read from the Results,
# figure legends and Methods. Supplementary information and Extended Data figures were not read
# beyond their legends.
#
# When these criteria were written the author had seen the data check only: the file list, the
# metadata, and a scan of every processed file (subjects, labs, probe models, trial counts per
# session, units and their quality scores and regions, the inclusion counts of the canonical set,
# the processing modules and passive protocols). In checking the trials table the author also saw
# that 22.75% of first movement times are below 80 ms (claim behav-early-movements), and the mapping
# of choice to reward. The author had read the paper's per-region table region_info.csv in the
# paper's repository (commit 118fc36), including its single-cell fractions for the regions the
# neural claims test, and its results tables meta/Results/*.pkl. No neural analysis had been run on
# the data, beyond timing one session to plan the run.
#
# The data check found that in 64 sessions (all with the protocol name _iblrig_tasks_ephysChoiceWorld
# without a version) probability_left alternates between 0.2 and 0.8 on every trial after the first
# 90 and does not follow the stimuli. The claims that use the block (fig1g-block-switch,
# fig1h-block-bias, the single-cell tests and the trajectory permutations) leave these sessions out.
#
# Tolerances. Counts of released records (sessions, mice, labs, probes, units, regions) have a
# tolerance of 0: the paper states them for the released data, so any difference is a difference in
# what was released. Other numbers use the paper's stated spread where it gives one, otherwise 10%.
#
# The neural analyses cannot run over all 454 sessions and 201 regions within the time limit, so
# they test a set of regions fixed here: the paper's three example regions VISp (Fig. 4i), GRN
# (Fig. 5i) and IRN (Fig. 6i), and seven regions drawn at random (numpy default_rng(409)) from the
# canonical regions recorded in at most 12 sessions, leaving out the visual regions used for
# latencies. Each tested region uses all its canonical sessions. Method choices fixed here: one run
# of the nested cross-validation (paper 10), 100 null sessions per region-session (paper 200), each
# null decoded with the C chosen for the real labels in each outer fold; per-session p-values are
# (1 + number of null scores at least the real score) / (1 + number of nulls), combined over sessions
# with Fisher's method, and the Benjamini-Hochberg correction at q = 0.01 is applied over the tested
# regions of each variable.
#
# The criterion of traj-stim-regions was added after the first verification round, which found
# that the claim fits the time limit. When it was written the author had seen the latencies and
# permutation p-values of the seven trajectory regions (all p = 0.001) and the paper's stim_euc_sig
# column of region_info.csv (104 of the canonical regions), but no trajectory of any other region.
# Quotes and statistics added 2026-10-19 from the full text (Europe PMC PMC12408349).
