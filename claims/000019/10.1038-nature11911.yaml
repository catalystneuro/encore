    100 times, with the microphone recorded with the ECoG at 3052 Hz.
  source: Methods, Subjects and Experimental Task, and Data acquisition and Signal Processing;
    Supplementary Table 1
  quote: Three native English speaking human subjects underwent chronic implantation of a
    high-density, subdural electrocortigraphic (ECoG) array over the left hemisphere (two
    subjects) or right hemisphere (one subject) ... composed of 18–19 consonants (19 consonants
    for two subjects, 18 consonants for one subject), followed by one of three vowels. Each CV
    was produced between 15 and 100 times
  expected:
  - quantity: subjects
    value: 3
    tolerance: 0
  - quantity: distinct CV syllables over all subjects
    value: 168
    tolerance: 0
  - quantity: ECoG sampling rate
    value: 3052
    tolerance: 1
    unit: Hz
  criterion: Reproduced when the dataset holds three subjects with ECoG and audio, CV labels
    with 19, 19 and 18 consonants by three vowels (168 distinct CVs, Fig. 3c legend), at least
    15 renditions of every CV and at most 100, and two left and one right hemisphere grids.
