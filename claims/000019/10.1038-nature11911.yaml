# Claims for Bouchard, Mesgarani, Johnson & Chang (2013), "Functional organization of human
# sensorimotor cortex for speech articulation", Nature 495, 327-332, on dandiset 000019
# ("Human ECoG speaking consonant-vowel syllables").
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read. The NIH author manuscript as served by PubMed Central (PMC3606666, NIHMS436351),
# not the version of record: main text, figure legends and Methods, with the supplement
# (NIHMS436351-supplement-1.pdf, Supplementary Figures 1 to 13 with their legends,
# Supplementary Table 1 and Supplementary Methods), as extracted to text. No PDF of the main
# text was supplied, so the main figures were read from their legends and from the Results
# sentences that cite them. Supplement pages 2 and 8 were opened in the supplement PDF, to
# see Supplementary Figure 1d and to confirm a printed p-value on page 8.
#
# Code. The paper links no code, and none is named in the Methods or the supplement. Every
# method below is from the Methods, the legends or the Supplementary Methods.
#
# Data the paper describes. Three native English speakers (Supplementary Table 1 names them
# EC2, EC33 and EC31) with a high-density subdural ECoG array over peri-Sylvian cortex, left
# hemisphere in two (EC2, EC31) and right in one (EC33), implanted for epilepsy monitoring.
# Each read aloud consonant-vowel syllables (CVs), 19 consonants (/b d f g h k l m n p r s sh t
# th v w j z/) for two subjects and 18 for one, each followed by /a/, /i/ or /u/; each CV was
# produced 15 to 100 times. 168 syllables in all (57 + 57 + 54). The microphone signal was
# recorded with the ECoG at 3052 Hz (TDT system) and transcribed with WaveSurfer; every
# analysis is aligned to the acoustic onset of the consonant-to-vowel transition (t = 0).
# Measured variables. ECoG voltage per channel; electrode positions on each subject's MRI
# reconstruction, expressed as dorsal-ventral distance from the Sylvian fissure and
# anterior-posterior distance from the central sulcus (mm), and whether each electrode lies on
# ventral sensorimotor cortex (vSMC, pre- and post-central gyri and the guenon); the audio; and
# the CV label and the C-V transition time of each utterance. The dataset's title is enough to
# know it is meant to hold these recordings; its files were not looked at.
#
# Definitions used by several criteria, from the Methods unless marked.
# - High gamma (Hg). Channels with artifacts or excessive noise are excluded (by inspection;
#   if the dataset marks bad channels, those marks are used). Common average reference over
#   the remaining channels. Analytic amplitude from eight Gaussian band-pass filters with
#   logarithmically spaced centres from 85 to 175 Hz and semi-logarithmically increasing
#   bandwidths, by the Hilbert transform; averaged over the eight bands; down-sampled to
#   200 Hz (5 ms steps); z-scored per channel against "baseline data". The exact centres and
#   bandwidths are not given; the bank of Mesgarani and Chang (2012, ref. 17/48), the paper's
#   cited source, is the standard choice, and it cannot change an outcome beyond what the
#   baseline does. OPEN, the baseline. The Methods do not say which data are baseline.
#   Readings (a) a silent window before each utterance (the 500 ms before the start of the
#   plotted epochs, -1000 to -500 ms from the C-V transition, is used for this reading);
#   (b) the mean and SD of the whole recording of the channel. Both are run.
# - Per-syllable responses. The analyses use cross-syllable variability in the average Hg
#   (Methods, Acoustic Analysis), so each CV's response at each electrode is the mean over
#   its renditions, aligned at the C-V transition. Epoch -500 to +750 ms (the range of the
#   Fig. 5a symbols); the analysis windows below lie within it.
# - vSMC electrodes. Electrodes on the pre- and post-central gyri and the guenon (Methods,
#   Fig. 1a, b). If the dataset gives anatomical labels, those are used; if it gives
#   neither labels nor positions relative to the central sulcus and Sylvian fissure, the
#   spatial claims are blocked (metadata_insufficient) and the others are run on all
#   electrodes that pass the activity rule, as a variant only.
# - Articulator state matrix. Supplementary Figure 1d: per CV, four binary consonant
#   articulators (Lips, Tongue, Larynx, Jaw) and two vowel features (Back Tongue, High
#   Tongue). It is given only as a figure; the author reads it from supplement page 2.
# - Phonetic feature matrix. Supplementary Figure 12: nine constriction location features,
#   six constriction degree/shape features and four vowel configuration features, white = 1.
#   Given only as a figure (supplement page 15). The Methods point to Supplemental Figure 9
#   for it; the legend of Supplementary Figure 12 is the matrix.
# - Major oral articulator labels for consonants, labial, coronal and dorsal (Fig. 4a, c;
#   Supplementary Figure 10, 11). Which consonant is which is read from the constriction
#   location features of the phonetic feature matrix (Fig. 4c is a main figure and no PDF of
#   it was available). No text sentence places /h/ (glottal), /r/, /w/ (labial-velar) or /j/
#   (palatal). OPEN; readings (a) /h/, /r/, /w/ and /j/ left out of the labelled sets, (b) /r/
#   coronal, /w/ labial, /j/ dorsal, /h/ left out (it has no oral articulator).
# - Cortical state-space. Per subject, PCA on the matrix of vSMC electrodes by
#   concatenated (CV x time) Hg, each electrode's time series z-scored across syllables; the
#   first nine PCs; a CV's state at time t is the projection of its electrode vector on them.
#   Consonant time t = -25 ms; vowel time t = +250 ms (Fig. 4a, b legend).
# - Time windows. Early window -375 to 120 ms and late window 125 to 620 ms (Results, Phonetic
#   Organization, paragraph 3), in 5 ms steps.
# - Tolerances. 10% of a reported value when the paper gives no spread; the paper's s.e. when
#   it gives one; reasons for any other are given in the claim. Counts of subjects are exact.
# - Outside data. The paper relies on none and deposited nothing elsewhere; every claim
#   uses the dataset alone (data: dataset, the default).
# - Readings. Where a claim lists readings of a reported number, it matches if it matches
#   under any of them. Where a claim lists readings of a method detail, its outcome is the one
#   all readings give, and it is methods_underspecified when they differ.
