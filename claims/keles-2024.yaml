# Claims for Keles et al. (2024), Sci Data 11, 214, "Multimodal single-neuron, intracranial EEG,
# and fMRI brain responses during movie watching in human patients", on dandiset 000623.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23,
# protocol pilot-10 as stated in docs/protocol.md (Reader).
#
# Text read. The version of record (open access, CC BY 4.0) as served by Europe PMC
# (paper/10.1038-s41597-024-03029-1.txt): Background and Summary, Methods, Data Records,
# Technical Validation, Usage Notes, Code availability, Table 1 and the legends of Figures 1 to 7.
# The paper is a Data Descriptor and has no supplement. No PDF was available and no figure was
# opened; numbers shown only in figures (the per-area neuron counts of Fig. 2h) are read from the
# text as noted under `inferred`.
#
# Code read. github.com/rutishauserlab/bmovie-release-NWB-BIDS at commit 8c35290 (2024-02-27),
# linked under Code availability. It holds: gen_table1_subj_info.py (Table 1, with the ages and
# sexes of the four fMRI-only participants entered by hand); ephys_qc/gen_figure2ah_singleunitQC.py
# (spike-sorting metrics, Fig. 2a-h); gen_figure3_eyetracking.py (gaze heatmap correlations and
# missing gaze, Fig. 3a); gen_figure3_recogtask_roc.py (ROC, AUC and the confidence-accuracy
# t-test, Fig. 3b,c); ephys_utills.py (AUC, d', confidence split, inclusion rule, gaze binning and
# heatmaps); singleneuron/examine_neurons_recognitiontask.py and examine_neurons_scenecuts.py
# (memory- and event-selective cells, permutation tests, Fig. 6a,b and 7a,b); ieeg/prep_filterLFP.py
# (HFB preprocessing) and ieeg/examine_channels_recognitiontask.py and examine_channels_scenecuts.py
# (selective LFP and iEEG channels, Fig. 6c,d and 7c,d); fmri_qc/ (framewise displacement, tSNR,
# ISC, adapted from github.com/mvdoc/budapest-fmri-data); and assets/annotations/ (scenecut_info.csv,
# the 93 annotated cuts with scene_id and shot_start_fr; short_faceannots.pkl, face annotations;
# scanner_questionnaire.csv, the in-scanner question answers). The code prints the per-area counts
# and permutation p-values but not the means and s.d. of the quality metrics, nor the run 1 against
# run 2 AUC test, which is not in the code. The environment file pins no versions (python 3.11,
# mne-base, numpy, scipy, pynwb).
#
# Data the paper used. 20 patients with intractable epilepsy (Table 1; 11 female; age 37.75 +-
# 13.86, mean (SD)). 16 were recorded in the epilepsy monitoring unit (EMU) with hybrid
# Behnke-Fried depth electrodes, 29 sessions ("runs") in all (two runs for 13 participants, one for
# P44CS, P58CS and P60CS); 15 were scanned with fMRI (two runs each, 30 runs); 11 did both. Each
# EMU run is an 8-min edited excerpt of "Bang! You're Dead" (25 Hz, 11971 frames), then a
# recognition test of 40 frames (20 novel, 20 familiar), rated on a 1 to 6 confidence scale (1 to 3
# novel, 4 to 6 familiar). Recorded variables: spike-sorted single units (OSort, 1450 units) from
# microwires in amygdala, hippocampus, ACC, preSMA and vmPFC, with per-unit quality metrics; LFP
# from the microwires and iEEG from the macro contacts, both at 1000 Hz (band 0.1 to 500 Hz), from
# 10 s before movie start; monocular gaze (EyeLink 1000, 500 Hz) with fixations, saccades, blinks
# and pupil size; frame times of the movie (NWBFile.stimulus["movieframe_time"]); the trials table
# (one encoding row for the movie, then one row per recognition trial with stimulus_file,
# actual_response and response_correct); electrode locations in native and MNI152 space. Spike
# times are referenced to movie start.
#
# Where the data are. The dandiset ("Data for: Multimodal single-neuron, intracranial EEG, and
# fMRI brain responses during movie watching in human patients", 29 NWB assets) holds the EMU
# data only. The fMRI data (BIDS) are on OpenNeuro, ds004798; the movie annotations and the
# in-scanner answers are on Figshare (doi:10.6084/m9.figshare.25037045.v4) and in the code
# repository's assets/annotations at commit 8c35290. Claims on fMRI are `elsewhere`; claims on
# scene cuts use the annotation file as labels (`with_labels`, through claim scenecut-labels).
#
# Shared methods, from the code (cited by name in the criteria).
#  - Movie window: the trials-table row with stim_phase "encoding", start_time to stop_time.
#  - Unit set U: every unit with at least one spike in the movie window (gen_figure2ah,
#    examine_neurons_*: "no spike during encoding" units are skipped). Brain area is the
#    electrode's location with "Left " or "Right " removed.
#  - Recognition trials: rows with stim_phase "recognition"; truth "new" or "old" from the first
#    three characters of stimulus_file; response "new" when actual_response <= 3. Correct trials
#    are true positives (old, old) and true negatives (new, new).
#  - Session rule R (memory analyses): a session is skipped when it has fewer than 10 correct
#    new or fewer than 10 correct old trials (examine_*_recognitiontask.py).
#  - Bootstrap selection B: per cell or channel, 10,000 resamples with replacement (numpy
#    default_rng seed 13) of the two groups' trial responses, the difference of group means per
#    resample, and the two-sided bootstrap p = 2 x min(p1, p2) with +1 correction (get_bootstrappval);
#    selective when p < 0.05. Recognition, novel minus familiar, both groups resampled to the
#    smaller group's size; responses in 0.2 to 1.7 s after trial start_time. Scene cuts, scene
#    change minus continuity cut, each group resampled to its own size; responses in 0 to 1.0 s
#    after cut onset; counted only when the difference is positive (see Open details 6).
#  - Permutation test P: 2,000 shuffles; in each, per cell or channel, n_new + n_old (or n_change
#    + n_cont) responses drawn without replacement from all of its events (for recognition, all
#    40 trials including incorrect ones), split into two pseudo-groups, tested by B with 5,000
#    resamples (unseeded); the null count of selective units per area; area p = (1 + the number
#    of null counts at or above the observed count) / 2001 (get_NulltestPvals_cols). For scene cuts a null unit counts
#    only when its pseudo-difference is positive, as for the observed count.
#  - HFB pipeline H (prep_filterLFP.py): per session and per electrode type (LFP_micro, LFP_macro
#    in processing["ecephys"]), channels whose origchannel_name characters 2 to 4 are AMY, HIP, ACC,
#    SMA (preSMA) or OFC (vmPFC); time shifted by the 10 s LFP pad so that the movie starts at 0;
#    the movie window and the recognition block (first trial start to last trial stop), each
#    padded by 10 s, processed separately; MNE notch filter at 60 Hz and harmonics (zero-double
#    phase), high-pass 0.1 Hz, common average reference over the kept channels, Morlet power with
#    5 cycles at 70, 80, ..., 170 Hz, z-scored across time per frequency, averaged across
#    frequencies, resampled to 500 Hz. Channel area is the channel name without its first and
#    last character (examine_channels_*).
#  - Scene cuts S: the 93 rows of scenecut_info.csv; a cut is a scene change when its scene_id
#    differs from the previous row's, and the first cut is a scene change; onset is the
#    movieframe_time timestamp of frame shot_start_fr (1-based) in each session.
#
# Tolerances. Counts of deposited records (sessions, participants, units, cuts) have tolerance 0:
# the dataset fixes them. Other values use 10% of the reported value. Where the paper gives mean
# +- s.d. over units, sessions or pairs, the s.d. describes the spread of the population, not the
# uncertainty of the mean of a fixed deposited set; the means and the s.d. are each held to 10%.
#
# Open details (none of paper, legends or code fixes them; each is named again in its claim).
#  1. The mean ISI percentage: over all units of U, or over the units with less than 3% plotted
#     in Fig. 2c (the code plots only these).
#  2. The degrees of freedom of every s.d. the paper gives (not computed in the code except for
#     the gaze s.d. and Table 1, both numpy ddof 0). Standard choice ddof 0, ddof 1 shown; it
#     cannot change an outcome at these n.
#  3. The missing-gaze mean (7% +- 8%): over the 27 sessions left after P53CS is excluded, or
#     over all 29.
#  4. The mean AUC (0.79 +- 0.19): over the 29 sessions (Fig. 3b legend, "all sessions"), or over
#     the 16 participants after averaging their runs ("across participants").
#  5. Sessions in the memory analyses: rule R (the code), the five runs the text lists as
#     excluded (P44CS run 1, P51CS run 2, P56CS run 2, P57CS runs 1 and 2), or the text's two
#     criteria (AUC by cal_auc on all 40 trials at or below 0.6, or rule R). The text's first
#     criterion, "behavioral AUC > 0.6", is read as the condition for inclusion (excluding
#     sessions above 0.6 would leave almost none); the code applies no AUC rule here, so the
#     text and the code disagree and both are run.
#  6. Scene-cut selectivity: the text says the response "differed significantly"; the code counts
#     only cells and channels with scene change > continuity cut (and builds its null the same
#     way). The text does not say either direction, and the code settles it, so the code's
#     reading is followed; the count in either direction is shown as a variant.
#  7. Run 1 against run 2 AUC: not in the code. AUC by cal_auc per run; paired t-test across the
#     13 participants with two runs, two-sided (scipy ttest_rel default).
#  8. The permutation test is unseeded; its Monte Carlo standard error (about 0.005 at p = 0.05
#     with 2,000 shuffles) is reported with each area p. Seed 0 is used as a standard choice.
