    centre), lower for LS phase; (b) the mean off-diagonal correlation more than 20 bins from the
    diagonal, lower for LS phase. Reproduced when, under one reading, the LS phase value is lower
    than both hippocampal rate and hippocampal phase values; partially reproduced when it is
    lower than one of them.
- id: fig4d-depth-gradient
  statement: The strength of phase coding relative to rate coding increases with recording depth
    within the LS, within sessions and across animals.
  source: Results, paragraph 6; Figures 4A to 4D
  quote: Within single recording sessions in individual rats (Figures 4A and 4B) and across all
    animals (Figures 4C and 4D) the strength of phase coding, relative to rate coding, reliably
    increased as a function of recording depth within LS.
  depends_on:
  - fig2e-ls-phase-lower-mse
  criterion: As makeFig4.m. Per session, the mean over included LS conditions of phase minus rate
    MSE; the session's LS depth is the session depth (sessionInfo.depth) plus 10 um per site of
    the first unit's largest-waveform channel along its shank; per animal, the Pearson
    correlation of depth with the session value (makeFig4.m drops the last session of its fifth
    animal, without a reason; shown with and without). Within a session (Figure 4B), each unit's
    phase minus rate MSE against the site of its largest waveform. The paper reports no test.
    Readings, (a) per animal r < 0 (deeper is more negative, stronger phase coding) in every
    animal with at least four LS sessions, (b) with depth and value centred within animal, the
    pooled Pearson correlation negative at p < 0.05. Both readings, the four-session and
    five-site minimums and the majority rule are choices the paper does not make. Reproduced
    when (a) or (b) holds and the within-session correlation is negative in the majority of
    sessions with units on at least five sites; partially reproduced when only one of the
    across-animal and within-session parts holds.
- id: fig4e-onset-depth
  statement: The theta phase at the onset of LS phase fields varies with recording depth (DT5 r =
    0.38, DT9 r = 0.25, DT2 r = 0.27; circular-linear correlation, p < 0.001).
  source: Results, paragraph 6; Figure 4E legend
  quote: the phase onset for precession varied systematically and significantly with recording depth
    (DT5 r = 0.38, DT9 r = 0.25, DT2 r = 0.27; circular/linear correlation; p < 0.001).
  statistics:
  - about: DT5, DT9 and DT2, each
    test: circular/linear correlation
    statistic: DT5 r = 0.38, DT9 r = 0.25, DT2 r = 0.27
    p: 0.001
    p_relation: "<"
  depends_on:
  - fig2-ls-phase-vs-shuffle
  expected:
  - quantity: Circular-linear r, DT5
    value: 0.38
    tolerance: 0.038
  - quantity: Circular-linear r, DT9
    value: 0.25
    tolerance: 0.025
  - quantity: Circular-linear r, DT2
    value: 0.27
    tolerance: 0.027
  criterion: Figure 4E legend, for every phase-precessing LS neuron (fig2-ls-phase-vs-shuffle)
    the mean phase angle, relative to CA1 theta, over the first 15 bins of its phase field. No
    code for this panel is in the linked repositories. Open, (1) which condition gives a
    neuron's value; readings, (a) each significant condition as its own point, (b) the
    significant condition with the lowest phase MSE; (2) where the phase field starts; the paper
    says LS phase fields cover virtually the whole track (Discussion, paragraph 1), so the first
    15 bins of the linearized track in the direction of travel; (3) the mean phase; readings,
    (a) the circular mean of the spikes in those bins, (b) the circular mean of the smoothed
    phase map over them; (4) depth; readings, (a) the session depth, (b) the depth of the unit's
    largest-waveform site as in fig4d-depth-gradient. Circular-linear correlation as CircStat circ_corrcl, per animal.
    Reproduced when, under one reading, all three animals give p < 0.001 and r within
    tolerance; partially reproduced when all three give p < 0.001 but an r is outside tolerance,
    or one or two animals reach p < 0.001.
- id: fig4e-onset-mediolateral
  statement: The starting phase of LS phase fields varies systematically along the medial-lateral
    axis across animals.
  source: Results, paragraph 6; Figure 4E
  quote: Furthermore, the starting phase for these “phase fields” varied systematically along the
    medial-lateral axis across animals
  depends_on:
  - fig4e-onset-depth
  criterion: With each neuron's onset phase from fig4e-onset-depth, the circular mean per animal,
    against the animal's medial-lateral LS coordinate (Figure S1A). The paper reports no test
    and has five animals; the tests and the 0.8 bound below are choices the paper does not
    make. Figure S1A, as extracted, gives more than one coordinate for some animals (DT2 has
    0.6 and 1.5 ML; DT5, DT7 and DT8 share 0.5 ML); open, readings, (a) the LS coordinate of the
    probe as listed first, (b) the mean of an animal's listed LS coordinates. Reproduced when the circular-linear correlation of animal mean onset
    with medial-lateral coordinate (circ_corrcl) has |r| at least 0.8, and a Kruskal-Wallis or
    Watson-Williams test finds onsets differ between animals at p < 0.05; partially reproduced
    when only the difference between animals holds.
- id: speed-independent
  statement: Only 2.8% (125 of 4,393) of LS conditions showed a significant correlation between
    running speed and the rate of phase precession, and 10.7% of LS rate maps were modulated by
    running speed, so LS phase coding seems independent of running speed.
  source: Results, paragraph 5
  quote: Only 125 of 4,393 LS conditions (2.8%) had significant correlations between running speed
    and the rate of phase precession ... only 10.7% of firing rate maps in LS were significantly
    modulated by running speed
  expected:
  - quantity: Fraction of LS conditions with speed-precession correlation
    value: 0.028
    tolerance: 0.0028
  - quantity: Fraction of LS rate maps modulated by speed
    value: 0.107
    tolerance: 0.0107
  depends_on:
  - ls-active-neurons
  criterion: The Methods do not describe either analysis; the text gives a two-sample t test at
    p < 0.01 against a trial-shuffled control for the first. Readings for the first, per included
    LS condition and trial, the trial's mean running speed and its rate of precession, (a) the
    slope of a circular-linear regression of spike phase on position, (b) the circular-linear
    correlation of phase and position; their Pearson correlation over trials, compared by a
    two-sample t test with the same correlation over 100 trial-order shuffles of speed, at p <
    0.01. For the second, per included LS condition, (a) the Pearson correlation of each
    spike's instantaneous rate with the running speed at that time, against 100 circular shifts
    of speed, at p < 0.01; (b) the same on 100 ms bins of count and speed. Reproduced when both
    fractions are within tolerance under one reading each; partially reproduced when both are
    below 20%.
- id: fig5-assemblies
  statement: Spike trains of hippocampal neurons predicted LS firing in 18.5% (2,087 of 11,264) of
    hippocampal-LS pairs, with a median optimal timescale of 25 ms.
  source: Results, paragraph 7; Figure 5D to 5F
  quote: Across 18.5% (2,087/11,264) of hippocampal-LS cell pairs examined, spike trains of
    hippocampal neurons reliably predicted the firing of action potentials in LS neurons ... the
    median optimal timescale for peer prediction was 25 ms (Figure 5F)
  expected:
  - quantity: Fraction of hippocampal-LS pairs forming an assembly
    value: 0.185
    tolerance: 0.0185
  - quantity: Median optimal timescale of assemblies
    value: 25
    tolerance: 2.5
    unit: ms
  - quantity: Hippocampal-LS pairs examined
    value: 11264
    tolerance: 1126.4
  criterion: STAR Methods, peer prediction, with buzcode bz_peerPrediction. A pair is a
    simultaneously recorded hippocampal (predictor) and LS (response) unit, evaluated on all
    spikes of one block of trials (one condition; Methods); spike trains in 1 ms bins per trial.
    The predictor is box-smoothed over windows of 1 to 150 ms (bz_peerPrediction averages over
    plus and minus w ms); a GLM (buzcode glmfit with a normal distribution; Poisson is a variant)
    predicts the LS train from the smoothed predictor and, as extra predictors, CA1 theta phase
    (sine, cosine and angle), position and velocity (Methods; Figure S5A); deviance summed over
    trials per window. The control shuffles trial order between predictor and response, 10
    times. Assembly strength is the reduction of deviance at the best window divided by the best
    reduction in the shuffles (Methods); makeFig5.m computes it as (minimum deviance minus mean
    deviance over windows) over (minimum of the mean control deviance minus its mean). An
    assembly has strength of at least 4 (Methods). Readings, (a) the Methods rule alone; (b) with
    the extra rules of makeFig5.m and bz_peerPrediction (best window index above 7 and below
    150, zero-lag strength below 1.1, mean deviance above 40, more than 10 trials, more than 100
    spikes in the pair). The timescale is open; readings, (a) w, the half-width, (b) the full box
    width 2w+1 ms. The denominator is pairs by condition. Reproduced when, under one reading, the
    fraction and the median timescale are within tolerance; partially reproduced when one of the
    two is. The number of pairs examined is reported against 11,264.
- id: fig5g-assembly-neurons-stronger-phase
  statement: LS neurons that take part in at least one predictive assembly carry a stronger spatial
    phase code than those that do not (p < 1e-20).
  source: Results, paragraph 7; Figure 5G legend
  quote: LS neurons that participated in at least one predictive cell assembly were found to carry a
    more robust spatial phase code compared to neurons that were not part of a predictive assembly
    (Figure 5G; two sample t test
  statistics:
  - about: as the Results name the test
    test: two sample t test
    p: 1.0e-20
    p_relation: "<"
  - about: as the Figure 5G legend names the test
    test: two-way KS test
    p: 1.0e-20
    p_relation: "<"
  depends_on:
  - fig5-assemblies
  - fig2e-ls-phase-lower-mse
  criterion: As makeFig5.m. Per condition, the phase minus rate MSE (single-cell decoder at 20
    bins; phase MSE the lower of cosine and raw phase) of LS neurons in at least one assembly
    with a hippocampal unit (strength at least 4) against LS neurons in none. makeFig5.m enters
    one value per assembly pair, so a neuron counts once per assembly; readings, (a) per pair as
    the code, (b) per neuron and condition. Reproduced when, under one reading, assembly neurons
    have the more negative values and the t test or the KS test gives p < 1e-20; partially
    reproduced when they are more negative at p < 0.05.
- id: figs5-assembly-independent-of-locking
  statement: Theta phase locking of hippocampal neurons does not significantly correlate with the
    strength or timescale of hippocampal-LS assemblies.
  source: Results, paragraph 7; Figure S5B to S5E legends
  quote: Notably, theta phase locking magnitudes did not significantly correlate with either the
    strength or timescale of cell assemblies
  depends_on:
  - fig5-assemblies
  criterion: A claim of absence. Per assembly pair, the hippocampal unit's theta phase locking
    (von Mises kappa and resultant vector length of its spike phases, Figure S5B to S5E) against
    assembly strength and against optimal timescale. The paper names no test; the S5 legends call
    two of the four relations weak correlations. The test used is Pearson correlation at p <
    0.05, a standard choice that the paper does not make. Reproduced when none of the four
    correlations is significant; not reproduced when any is. The r values are reported either
    way, and Spearman correlation is shown as a variant.
- id: fig6-session-counts
  statement: LS neurons were recorded with CA1 neurons in 63 sessions and with CA3 neurons in 19
    sessions, and 14 sessions had LFP from CA1, CA3 and LS together.
  source: Results, paragraph 9; Figure 6A and 6B
  quote: simultaneously with either CA1 neurons (N = 63 sessions; black) or CA3 neurons (N = 19
    sessions; red; Figure 6A ) ... (N = 14 sessions
  expected:
  - quantity: Sessions with LS and CA1 units
    value: 63
    tolerance: 6.3
  - quantity: Sessions with LS and CA3 units
    value: 19
    tolerance: 1.9
  - quantity: Sessions with CA1, CA3 and LS LFP
    value: 14
    tolerance: 1.4
  criterion: Sessions counted by the regions of their units and LFP channels. Reproduced when all
    three counts are within tolerance.
- id: fig6c-ca3-coherence-increases
  statement: Theta phase coherence between LS and the CA3 pyramidal layer increases from the
    beginning to the end of the run, while coherence between LS and CA1 stays relatively flat.
  source: Results, paragraph 9; Figure 6C
  quote: LFP theta phase coherence between LS and CA1 pyramidal layer sites was relatively flat
    during the entire span of the tracks. In contrast, theta phase coherence between LS and CA3
    pyramidal layer increased significantly from the beginning to the end of run (Figure 6C).
  depends_on:
  - fig6-session-counts
  criterion: STAR Methods, LFP theta phase coherence, and makeFig6.m. Per trial longer than 0.8 s
    (1,000 samples at 1,250 Hz), the CA1 or CA3 pyramidal-layer channel and the LS channel are
    band-passed 4 to 12 Hz (3rd-order Butterworth), the Hilbert angle taken, and their multitaper
    coherence computed in 150 ms windows moved by 50 ms (bz_MTCoherogram, 4 to 12 Hz, averaged
    over frequency); each trial's curve resampled to 1,000 points and z-scored (makeFig6.m).
    CA1-LS uses every session with a CA1 site, CA3-LS every session with a CA3 site. The paper
    names no test for "increased significantly". Readings, (a) per trial, the slope of z-scored
    coherence on normalized position, CA3 slopes above zero by a one-sample t test and above CA1
    slopes by a two-sample t test, both at p < 0.05; (b) the same on session means of trials.
    Reproduced when, under one reading, the CA3 slope is significantly positive and greater than
    the CA1 slope, and the CA1 mean curve's end minus start (last against first tenth) is
    smaller than the CA3 one; partially reproduced when the CA3 increase holds but CA1 is not
    flatter.
- id: fig6d-cfc-stronger-ca3
  statement: Coupling between hippocampal theta phase and LS gamma amplitude increases along the
    run for both CA1 and CA3, and is stronger for CA3-LS than for CA1-LS.
  source: Results, paragraph 9; Figure 6D
  quote: A similar relationship was observed when cross-frequency coupling strength ... between CA1
    or CA3 theta phase and LS gamma oscillation amplitudes were examined. Although the strength of
    coupling increased in both cases, it was significantly stronger for CA3-LS than for CA1-LS
    comparisons (Figure 6D).
  depends_on:
  - fig6-session-counts
  criterion: STAR Methods, LFP cross-frequency coupling, and makeFig6.m. Theta phase is the
    Hilbert angle of the 4 to 12 Hz band-passed (3rd-order Butterworth) CA1 or CA3 channel; LS
    gamma power the root-mean-square in 50 ms windows of the band-passed LS channel (Methods 40
    to 200 Hz; makeFig6.m uses 50 to 500 Hz and a 60-sample window, shown as a variant);
    coupling the circular-linear correlation (circ_corrcl) of phase and power in windows of
    plus and minus 250 samples moved sample by sample (makeFig6.m); per trial resampled to 1,000
    points and z-scored. The paper names no test. Readings as in fig6c-ca3-coherence-increases,
    (a) per trial, (b) session means. Reproduced when, under one reading, the slope on position
    is above zero for CA1 and for CA3 (one-sample t test, p < 0.05) and the CA3 coupling is
    higher than the CA1 coupling (two-sample t test on the raw, not z-scored, mean coupling per
    trial or session, p < 0.05); partially reproduced when only the CA3 against CA1 difference
    holds.
- id: fig6e-assembly-position
  statement: CA3 place fields form progressively stronger gamma assemblies with LS along the track
    (r = 0.34, p = 0.006) while CA1 coupling decreases somewhat (r = -0.11, p = 0.079), and the
    two are anti-correlated over position (r = -0.88).
  source: Results, paragraph 9; Figure 6E; STAR Methods, peer prediction analysis
  quote: The functional coupling between CA1 place cells and LS neurons decreased somewhat (r =
    −0.11; p = 0.079; N = 260 pairs), while coupling between CA3 place cells and LS neurons
    significantly increased (r = 0.34; p = 0.006; N = 72 pairs) ... The functional coupling of
    CA1-LS pairs was significantly anti-correlated with CA3-LS pairs (r = − 0.88; p = 2.6e-64; N =
    200 spatial bins).
  statistics:
  - about: CA1-LS coupling against position
    statistic: r = −0.11
    p: 0.079
    n: 260 pairs
  - about: CA3-LS coupling against position
    statistic: r = 0.34
    p: 0.006
    n: 72 pairs
  - about: CA1-LS against CA3-LS coupling over position
    statistic: r = − 0.88
    p: 2.6e-64
    n: 200 spatial bins
  depends_on:
  - fig5-assemblies
  - ls-few-place-fields
  expected:
  - quantity: r, CA1-LS assembly strength against place field position
    value: -0.11
    tolerance: 0.011
  - quantity: r, CA3-LS assembly strength against place field position
    value: 0.34
    tolerance: 0.034
  - quantity: r, CA1-LS against CA3-LS strength over 200 bins
    value: -0.88
    tolerance: 0.088
  criterion: STAR Methods, peer prediction. Pairs of fig5-assemblies whose hippocampal unit has a
    place field in the pair's condition; the field's centre of mass is the pair's position;
    hippocampal units in an assembly without a place field are left out. Pearson r of assembly
    strength on position, per region (CA1, CA3; both region readings of the shared methods).
    Open, which pairs enter; readings, (a) assembly pairs only (strength at least 4), as "HPC
    cells that participated in an assembly" suggests, (b) all pairs with a field. The 200-bin
    correlation is between the CA1 and the CA3 mean strength curves over the 200 position bins;
    the smoothing of the curves is not given (Figure 6E plots mean and SEM); readings, a 20-bin
    box filter as the decoders use, and none. Reproduced when, under one reading, the CA3 r is
    positive with p < 0.05, the CA1 r is negative and not significant at p < 0.05, the curves are
    negatively correlated, and all three r are within tolerance; partially reproduced when the
    signs hold but an r is outside tolerance.
- id: figs7-ensemble-ls-phase-best
  statement: The firing phases of ensembles of simultaneously recorded LS neurons read out position
    better than the firing phases or rates of an equal number of hippocampal neurons (p < 0.001 at
    15 to 25 neurons).
  source: Results, paragraph 4; Figure S7; STAR Methods, ensemble position prediction analysis
  quote: "the firing phases of ensembles of simultaneously recorded LS neurons (range: 1–53)
    provided a better readout of spatial position than either the firing phases or rates of an
    equivalent number of HPC neurons (Figure S7; two-sample t test; p < 0.001 at ensemble sizes of
    15–25 neurons)"
  statistics:
  - test: two-sample t test
    p: 0.001
    p_relation: "<"
    n: ensemble sizes of 15–25 neurons
  depends_on:
  - ls-active-neurons
  criterion: STAR Methods, ensemble position prediction. Ensembles of simultaneously recorded
    included units of one region (hippocampal 1 to 83, LS 1 to 53) in one condition; rates and
    phases box-smoothed over 20 bins, discretized into 20 levels; a naive Bayes decoder with
    Poisson likelihoods whose means are the training mean level per unit and position; 10
    random 60/40 splits, MSE averaged. Figure S7 has 12,078 HPC and 11,026 LS ensembles; open,
    how ensembles of each size are drawn; readings, (a) 10 random draws per size and condition,
    (b) all units of the condition and random subsets of every smaller size. Per size, a
    two-sample t test over ensembles of LS phase MSE against hippocampal phase MSE and against
    hippocampal rate MSE. Reproduced when, under one reading, LS phase MSE is lower than both
    at p < 0.001 at every size from 15 to 25 with ensembles in both regions; partially
    reproduced when it is lower at p < 0.05, or for one of the two comparisons.
- id: figs2-rate-phase-independent
  statement: Instantaneous firing rate and firing phase are independent at the single-trial level;
    fewer than 2% of hippocampal conditions had a rate-phase correlation higher than a
    circular-shift null.
  source: Figure S2C and S2D legends; STAR Methods, instantaneous firing rate and firing phase
    independence
  quote: "Red: Neurons with significantly (P<.05) higher actual correlations, when compared to the
    null distribution. They account for less than 2% of all conditions."
  expected:
    quantity: Fraction of hippocampal conditions with rate-phase correlation above the null
    value: 0.02
    tolerance: 0.002
  criterion: STAR Methods and Figure S2. For each spike, the instantaneous rate (one over the mean
    of the preceding and following inter-spike intervals; bz_phaseMap1D counts the trial's start
    and stop as the outer bounds) and its CA1 theta phase; per trial, the circular-linear
    correlation of the two; the null circularly shifts one series by random offsets, 100 times.
    Open, how a condition is called significant; readings, (a) a two-sample t test over trials
    of actual against mean shuffled correlations at p < 0.05, (b) the mean actual correlation
    above the 95th percentile of the condition's shuffled means. Hippocampal conditions are
    included conditions of hippocampal units. Reproduced when, under one reading, the fraction
    is below 0.022 (2% plus 10%); the LS fraction (Figure S2E and S2F) is reported.
- id: figs3-ls-major-target
  statement: Hippocampal efferents converge on the LS 20 to 800 times more densely than on any of
    the cortical targets examined, in Allen Institute mouse connectivity data.
  source: Introduction, paragraph 2; Figure S3A and S3B; STAR Methods, analysis of Allen Brain
    Institute connectivity data
  quote: Convergence of hippocampal efferents onto LS neurons is orders of magnitude more dense
    (20–800 times; Figure S3 ) than any of its cortical targets.
  data: elsewhere
  where: Allen Mouse Brain Connectivity Atlas (connectivity.brain-map.org); 55 CA1 or CA3 AAV-EGFP
    injection experiments, which the paper does not list by id
  expected:
    quantity: Ratio of LS to cortical target normalized fluorescence
    value: 20
    tolerance: 2
  criterion: STAR Methods. Injections into CA1 and/or CA3 without leakage into cortex or
    subiculum (55 experiments); for each, the normalized intensity of 9 targets (LS, subiculum,
    entorhinal, retrosplenial, orbitofrontal, prelimbic, infralimbic, posterior parietal,
    primary visual) as summed fluorescence over injection volume times voxel count. Figure S3B
    reports per-target medians. Open whether the range is over targets or over injections;
    readings, (a) the ratio of the LS median to each cortical target's median, (b) per
    injection, the LS value over the largest cortical value. Reproduced when, under one
    reading, the smallest ratio is at least 18 (20 less 10%) and the largest at most 880 (800
    plus 10%); partially reproduced when LS is the largest target for at least 90% of injections
    but a bound is not met.
- id: figs6-reference-frame
  statement: After maze rotation many LS neurons kept their phase precession related to distal room
    cues, so the phase shift is a spatial code; others were anchored to local cues.
  source: Discussion, Transmission and Utilization of the Hippocampal Spatial Map by LS Neurons,
    paragraph 2; Figure S6; STAR Methods, reference frame analysis
  quote: theta phase precession of many LS neurons retained their relation to distant room cues
    after the rotation of the maze, suggesting that the spike-phase shift is a spatial “code”
    (Figure S6)
  statistics:
  - about: reference frame variables predicting LS firing phase (Figure S6D)
    test: two-sample T-test
    p: 1.0e-10
    p_relation: "<"
  depends_on:
  - fig2-ls-phase-vs-shuffle
  criterion: STAR Methods, reference frame analysis, in sessions with maze rotations. The maximum
    correlation decoder, trained on 60% and tested on 40% of the data, predicts each LS neuron's
    firing phase from each group of variables, allocentric (x, y, z, pitch, yaw, roll), route
    (maze orientation, direction of motion), goal (distance to the current reward) and egocentric
    (first and second derivatives of the position variables); the null circularly shifts each
    variable by a random amount. Figure S6D compares groups with a two-sample t test at p <
    1e-10, without saying which pairs. Readings for "many", (a) the allocentric group predicts
    phase better than its shuffle (two-sample t test over neurons, p < 1e-10), (b) among
    phase-precessing neurons in rotation sessions, at least a quarter have lower MSE with
    allocentric than with route and goal variables; the quarter is a choice the paper does not
    make. Reading (a) alone does not test that some neurons follow distal and others local
    cues, so both parts are required. Reproduced when (a) and (b) hold; partially reproduced
    when one does. Figure S6C (circular SD of phase aligned to goal or room) is shown
    for the same neurons.
- id: figs1f-trial-counts
  statement: The behaviour comprises 2,889 circle-alternation, 6,608 central-alternation and 625
    linear-track trials; ballistic trials made up about 90 to 95% of trials in each recording.
  source: Figure S1F legend; STAR Methods, Recording/Data processing
  quote: These trials made up ~90%–95% of all trials attempted for any given recording. ... (F)
    Average velocity plots for the circle alternation (N=2,889 trials), central alternation
    (N=6,608 trials), and linear (N=625 trials) tracks.
  expected:
  - quantity: Circle alternation trials
    value: 2889
    tolerance: 288.9
  - quantity: Central alternation trials
    value: 6608
    tolerance: 660.8
  - quantity: Linear track trials
    value: 625
    tolerance: 62.5
  - quantity: Fraction of attempted trials that are ballistic, per recording
    value: 0.925
    tolerance: 0.115
  criterion: Trials by maze type. The ballistic fraction holds when every recording's fraction is
    within 0.81 to 1.0 (the 90 to 95% range widened by 10% of each bound); it can be tested only
    if the non-ballistic trials are available. Reproduced when the three trial counts are
    within tolerance and, where testable, the ballistic fraction is.
- id: fig7-dynamic-weighting-model
  statement: In a spiking model, CA1 and CA3 inputs weighted dynamically as the measured assemblies
    give a reliable, rate-independent phase code in the LS neuron, which static or random weights,
    or the removal of theta sequences, do not.
  source: Results, paragraphs 11 and 12; Figure 7E to 7H; STAR Methods, spiking model
  quote: Using a static weighting regime, where all synaptic connections have equal strength, we
    observed no or highly variable spatial information in the downstream neuron ... we observed
    weak predictions of spatial position that rarely exceeded chance for both firing rates and
    firing phases ... the downstream LS neuron carried a highly reliable phase code, in a manner
    that is independent of firing rate information ... the reliability of the phase-position
    relationship in the model LS neuron was severely degraded
  data: elsewhere
  where: GitHub DavidTingley/papers at commit 9f4cd48, LS_phasecoding/modeling (pyNN/NEURON
    notebooks and assemblyWeights.mat)
  criterion: Run the repository's notebooks staticWeightingModel, randomWeightingModel,
    dynamicWeightingModel and dynamicWeightingModel_wo_thetaSeqs (50 CA1 and 50 CA3 cells, 8 Hz
    theta, CA3 offset 180 degrees, net excitation equalized; STAR Methods), 40 trials each
    (Figure 7 legend), and decode with modeling/decodeModelData.m (maximum correlation decoder,
    21-bin smoothing, 10 random 50/50 splits of the trial-by-bin samples, chance by permuted test
    features). The paper gives no statistics; tests here are two-sample t tests over the 10
    splits at p < 0.01. Reproduced when the dynamic model's phase MSE is below its rate MSE and
    below chance, the static and random models' phase MSE are not below chance or not below their
    rate MSE, and the phase MSE without theta sequences is above the dynamic model's; partially
    reproduced when the dynamic model holds but one comparison fails.
