- id: fig3-ls-phase-reliable
  statement: Without preselection of place fields, the LS phase code for position is more
    reliable across the population than either the rate or the phase code of the hippocampus.
  source: Results, paragraph 4; Figure 3A and 3C
  quote: Notably, when there is no preselection for subpopulations of neurons (i.e., place fields),
    the lateral septal phase encoding of position is more reliable than either the rate or phase
    codes of the HPC
  depends_on:
  - ls-active-neurons
  criterion: As Figure 3 legend and makeFig3.m. For every included condition, the trial-mean
    rate map (box, 20 bins) and the circular mean over trials of the phase map smoothed per
    trial (20 bins); across all hippocampal conditions (Figure 3A) and all LS conditions (3C),
    the position-by-position correlation matrix, Pearson for rate and circular (circ_corrcc)
    for phase; the anti-diagonal of each matrix (diag(flipud), as the bottom row plots it). The
    paper does not say what measure of the matrices makes a code "more reliable". Readings, (a)
