# Claims for Tingley & Buzsaki (2018), "Transformation of a Spatial Map across the
# Hippocampal-Lateral Septal Circuit", Neuron 98, 1229-1242.e5.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-16,
# under docs/protocol.md version pilot-15 (Reader, steps 1 to 4). The reader did not see the
# dataset's data; it read only the title and description of DANDI:000213 on the archive (the
# paper's title and abstract).
#
# Text read. The NIH author manuscript in PubMed Central (PMC6605060), not the version of record:
# main text, figure legends, STAR Methods, and the supplement (Document S1, the legends of Figures
# S1 to S7, extracted from the PDF). Figure panels were not opened; no claim needed a value that
# the text garbles.
#
# Code read. The paper links two repositories. DavidTingley/papers at 9f4cd48 (LS_phasecoding:
# makeFig1.m to makeFig6.m, which compile the figures from saved per-session results, and the
# pyNN model notebooks with modeling/decodeModelData.m). buzsakilab/buzcode at e615663
# (bz_firingMap1D, bz_phaseMap1D, bz_getPlaceFields1D, bz_olypherInfo, bz_peerPrediction,
# circ_smoothTS). The script that produced the saved per-cell decoding tables
# (positionDecodingMaxCorr_binned_box_mean) and the cross-region assembly files is in neither
# repository; buzcode's bz_positionDecodingMaxCorr is a population, millisecond-resolution
# version, not the binned single-cell decoder the figures read.
#
# Data the paper used. Five adult Long-Evans rats (3 male, 2 female; Figure S1A names DT2, DT5,
# DT7, DT8, DT9), each with a silicon probe in the lateral septum (LS) and one in dorsal CA1, some
# sessions also with CA3 sites; Intan recording at 20 kHz; spikes sorted with
# SpikeDetekt/KlustaKwik/Klustaviewa. Units by region: 1,647 LS, 2,297 CA1, 654 CA3; 62 sessions
# with LS units, 45 hippocampal sessions in Figure 2G; 63 sessions with CA1 units, 19 with CA3
# units, 14 with CA1 and CA3 LFP (Figure 6). LFP from CA1 and CA3 pyramidal layers and from LS.
# Head position tracked by OptiTrack at 120 Hz in three dimensions with head orientation (four
# rats) or by two LEDs and a 30 Hz camera (one rat). Three mazes: linear track (625 trials),
# central-stem alternation (6,608) and circular-maze alternation (2,889) (Figure S1F); only
# ballistic trials are analysed. A condition is a block of trials of the same type (maze, route,
# direction); some sessions include maze rotations (Figure S6). Per unit the paper also uses the
# electrode site of the largest waveform, and per session a recording depth in LS.
#
# Shared methods, used by the decoding claims unless a criterion says otherwise:
# - Trials and conditions. Ballistic trials only (STAR Methods, Recording/Data processing). A
#   condition is analysed when it has at least 10 trials (STAR Methods, place field definition,
#   item 5; makeFig1.m and makeFig2.m keep conditions with >= 10 trials), and a unit in it when
#   it fires at least 1.5 spikes per trial on average (STAR Methods, position prediction; the
#   figure scripts take the summed count map over the condition's trials >= 1.5 times the trial
#   count). Such a unit and condition is an "included condition" below.
# - Position. Each trial is mapped to a linearized position vector (STAR Methods, position
#   prediction); bins are about 1.5 cm (Results, paragraph 2). The bin count is the length of the
#   condition's linearized map in the code (bz_firingMap1D); the figure scripts plot 200 bins.
#   Open: the number of bins, which sets the MSE scale (MSE is in bins squared). Readings, (a)
#   200 bins per condition, (b) bins of 1.5 cm of path.
# - Spike phase. The phase of CA1 pyramidal-layer theta at each spike (Results, paragraph 4;
#   STAR Methods, instantaneous firing rate). The Methods give no filter for spike phase; buzcode
#   bz_phaseMap1D uses a 3rd-order Butterworth 6 to 9 Hz band-pass and the Hilbert angle, and is
#   followed. The 4 to 12 Hz band of the LFP Methods is a variant.
# - Rate and phase maps. Per trial and bin, the firing rate (count over occupancy) and the
#   circular mean phase of the bin's spikes; both smoothed with a 20-bin box filter (STAR
#   Methods, position prediction), the phase with the circular mean (STAR Methods, spatial
#   information; circ_smoothTS with empty bins excluded).
# - Single-cell decoder. A maximum correlation coefficient classifier, which for one feature
#   picks the position bin whose training template (mean over training samples) is closest to
#   the test value (STAR Methods, position prediction). 10 random 60/40 train/test splits; the
#   score of a split is the MSE of the predicted against the true bin. Chance permutes the
#   vector of rates or phases against positions. A test between two MSE sets is a two-sample t
#   test over the 10 splits (all from STAR Methods). The phase feature in every figure summary
#   (makeFig1.m, makeFig2.m, makeFig4.m) is the cosine of the smoothed phase (mse_phase_cos at
#   tau = 20); the raw circular phase is a variant, and makeFig5.m takes the lower of the two.
#   Open: what a split divides. The Methods say "60% of the data (entire block of trials in the
#   same condition) was randomly selected". Readings, (a) whole trials of the condition, (b) the
#   pooled trial-by-bin samples of the condition (as modeling/decodeModelData.m does for the
#   model, with 50/50 splits).
# - Place fields. STAR Methods, place field definition: peak rate at least 2 Hz, width 8 to 120
#   cm, 1.5 spikes per trial, at least 10 trials; start and stop where the rate falls below 20%
#   of the peak (the code's file name, placeFields.20_pctThresh). buzcode bz_getPlaceFields1D
#   implements the rule on the trial-averaged map (findpeaks on a 5-bin RMS of the mean map,
#   peaks dropped where the mean rate is below the SD over trials, merged peaks dropped). Open:
#   which rate map is passed. Readings, (a) bz_firingMap1D rateMaps (Gaussian Smooth), whose
#   peak makeFig2.m reads for field stability, (b) rateMaps_box (box filter); and widths in
#   bins converted at 1.5 cm per bin. A "place field" in the per-condition claims is a
#   hippocampal included condition with at least one field, its first field as makeFig1.m and
#   makeFig2.m take it.
# - Regions. The figure scripts treat units labelled hpc, ca1 or ca3 as hippocampal and ls as
#   LS. For CA1 against CA3, makeFig1.m and makeFig2.m label hippocampal units by session (CA3
#   when the session has a CA3 site); a unit's own label is a second reading.
#
# This file replaces the earlier version, which was written by an author after seeing the
# dataset's file list and counts. Its criteria are now written from the paper and its code
# alone; the dataset-specific choices it held (unit label names, pixel sessions, the depth in a
# session name, sampling of pairs for time) are removed. Ids are kept where the finding is the
# same.
