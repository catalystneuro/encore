# Claims for Garud & Morris (2026), "Continuous Temporal Difference Learning as a Unifying
# Theory of Dopamine Function", bioRxiv doi:10.64898/2026.04.07.716149, on DANDI:001552.
#
# Provenance: written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub
# Actions"), 2026-11-25, protocol pilot-18 as stated in docs/protocol.md (Reader, steps 1 to 4).
#
# Text read: the bioRxiv preprint, version posted April 8, 2026
# (paper/10.64898-2026.04.07.716149.txt, extracted from the PDF): main text, figure legends,
# Table 1 legend and Methods. No PDF was supplied and no figure was read. The supplementary
# information is not in the text read. The paper cites it for the derivation (Supplementary
# S1), the phasic conditioning walkthrough (Supplementary Figure S1), the analysis of the
# Brown et al. (2026) dataset (Supplementary Figure S2), and "Further detailed methods". The
# claims on DANDI:001552 (Figure 4) rest on the main Methods, which describe that analysis in
# full enough to test; any detail the supplement may add to it was not seen. The claim on
# Supplementary Figure S2 rests on the supplement and has only the main-text sentence.
#
# Code read: none. Code Availability links https://osf.io/g3e2d/. On 2026-11-25 its OSF API
# (api.osf.io/v2/nodes/g3e2d/) answered 401, authentication required, so the project is not
# public and no file could be listed or read. No method detail below is settled by code. The
# Methods say all analyses were run in Julia v1.12, integration with DifferentialEquations.jl
# (Tsit5), figures with CairoMakie.jl, and a significance threshold of p < 0.05 for all tests.
#
# Data the paper used (Methods, Datasets). The paper reuses two published datasets and a third
# in the supplement; it records none of its own.
# - Floeder et al. (2025), DANDI:001552, version 0.250828.1728 as cited in Data Availability
#   (Figure 4). NAc dLight fiber photometry in head-fixed mice in Pavlovian conditioning;
#   n = 18 mice, 16 to 24 sessions each, alternating short-ITI and long-ITI sessions across
#   days. Each trial, an auditory cue, then liquid reward after a fixed delay. Signals used:
#   continuous 470 nm and 405 nm (isosbestic) photometry, and timestamped cue onsets, reward
#   deliveries and licks. The text gives the ITIs two ways, "short (~8s) or long (~55s)" in
#   the Results and "~15 s median" and "~45 s" in the Methods; sessions are classed by median
#   inter-cue interval, below 25 s short and 25 s or more long.
# - Krausz et al. (2023), Mendeley Data doi:10.17632/m59zdjpm9h.1 (Figures 2, 3 and 5), not in
#   the dandiset. NAc dLight photometry in 10 freely moving rats on a hexagonal maze of 49
#   positions with three reward ports whose magnitudes varied across blocks; 5 to 12 sessions
#   per rat, 82 rat-sessions. The paper used the hex-level table hexLevelDf (298,918
#   observations) with z-scored DA, instantaneous velocity, distance to chosen port and reward
#   magnitude.
# - Brown et al. (2026), Nature, doi:10.1038/s41586-025-10083-1 (Supplementary Figure S2), mice
#   running with no spatial goal. Where its data are held is not given in the text read.
#
# Not made into claims: Figure 1 and Figure 5A (model simulations, no data), Table 1 (the
# model's predictions by regime) and Supplementary Figure S1 (a model walkthrough).
#
# Details the paper leaves open for the DANDI:001552 claims, with the readings named in the
# criteria: how the isosbestic regression and ΔF/F are formed; whether "baseline" is ΔF/F of
# zero; whether ITI duration and its midpoint run from reward or from the previous cue; what
# an "observation" is in the rule dropping bins with fewer than 20; whether session number
# counts all of a mouse's sessions or its long-ITI sessions only; how the r values reported
# next to the mixed-effects models were computed; and which sessions the lick-rate trend uses.
schema_version: 2
paper: doi:10.64898/2026.04.07.716149
claims:
- id: floeder-subjects-sessions
  statement: The Floeder dataset holds 18 mice, each with 16 to 24 sessions, alternating between
    short-ITI and long-ITI conditions across days.
  source: Methods, Datasets, paragraph 2; Methods, Floeder (2025) dataset, paragraph 1
  quote: Mice (n = 18) completed 16–24 sessions each, alternating between short-ITI (~15 s median
    inter-trial interval) and long-ITI (~45 s) conditions across days
  expected:
  - quantity: mice
    value: 18
    tolerance: 0
    unit: mice
  - quantity: fewest sessions in a mouse
    value: 16
    tolerance: 1.6
    unit: sessions
  - quantity: most sessions in a mouse
    value: 24
    tolerance: 2.4
    unit: sessions
  criterion: Mice with photometry and event data are counted, so the tolerance on the count is
    zero; the per-mouse session counts must fall within 16 to 24 widened by 10% of each bound
    (14.4 to 26.4). Sessions are classed as the Methods say, by the median inter-cue interval
    of the session, below 25 s short and 25 s or more long. Reproduced when the count is 18,
    every mouse's session count is in range, and both classes occur in every mouse. The
    session median inter-cue intervals of each class are reported against the two sets of
    values the text gives (about 8 and 55 s in the Results, about 15 and 45 s in the Methods).
- id: fig4a-lick-short-above-long
  statement: Mice show higher anticipatory lick rates in short-ITI sessions than in long-ITI
    sessions.
  source: Results, paragraph on tonic dopamine (Fig. 4A); Figure 4A legend
  quote: Mice in short-ITI sessions showed higher anticipatory lick rates (Fig. 4A)
  depends_on:
  - floeder-subjects-sessions
  criterion: Methods, Floeder (2025) dataset, paragraph 2. Anticipatory lick rate per trial is
    the number of lick onsets 5 to 8 s after cue onset divided by 3 s; sessions are short or
    long by median inter-cue interval (25 s). Short against long rates are compared with a
    paired t-test across subjects, at p < 0.05 (Methods, Analysis). Open, the paper does not
    say how a subject's rate in each condition is formed; the readings are (a) the mean over
    that subject's sessions of the session mean over trials, (b) the mean over all its trials
    of that condition pooled. It does not say whether the test is one- or two-tailed; the
    two-tailed test is used, as the paper names one-tailed where it uses it (Figure 2G-H).
    Lick onsets are read as the lick event timestamps the NWB files hold. Reproduced when,
    under a reading, short is higher with p < 0.05.
- id: fig4b-long-iti-dip-below-baseline
  statement: During the late inter-trial interval of long-ITI sessions, dopamine settles below
    baseline, while in short-ITI sessions a slowly decaying reward response does not resolve
    before the next trial.
  source: Results, paragraph on tonic dopamine (Fig. 4B); Figure 4B legend; Discussion,
    paragraph 6
  quote: long-ITI dopamine settled reliably below baseline ... while the short-ITI trace showed a
    slowly decaying reward response that did not resolve before the next trial (Fig. 4B)
  depends_on:
  - floeder-subjects-sessions
  criterion: Methods, Floeder (2025) dataset. The 470 nm signal is corrected by regressing out
    the 405 nm signal and computing ΔF/F; it is binned in 1 s windows locked to reward
    delivery, each trial's trace cut 1 s before the next cue onset, and bins with fewer than
    20 observations dropped. The tonic measure is the mean ΔF/F from the midpoint of the ITI
    to 1 s before the next cue, in long-ITI trials with ITI of 30 s or more, per subject and
    session. Open, and named as readings, (1) the correction, (a) a least-squares fit of the
    405 nm signal to the 470 nm signal per session, ΔF/F = (470 - fit) / fit, or (b) ΔF/F of
    each channel against its own session mean, then the fitted 405 ΔF/F subtracted; no
    filtering is named, so none is applied. (2) ITI duration and midpoint, (a) from reward
    delivery to the next cue (the trace is reward locked), or (b) from cue to next cue. (3) An
    observation in the 20-observation rule, (a) a trial contributing to the bin, or (b) a
    sample. Baseline is read as ΔF/F of zero; the paper names no pre-cue baseline window. The
    paper reports no test for this panel; the test used is the one it uses for the matching
    stationary dip (Methods, Krausz dataset), a one-sample t-test across subjects of each
    subject's mean tonic measure against zero, one-tailed as there. Reproduced when the long-ITI
    measure is below zero at p < 0.05 under every reading, and, for the short-ITI part, the
    across-subject mean ΔF/F of the last kept bin before the next cue in short-ITI trials is
    above the long-ITI tonic measure; partially reproduced when only the long-ITI part holds.
    If the readings differ, the one the paper best supports is adopted as an assumption.
