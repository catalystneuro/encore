    r=-0.29, p<1e-3)
  statistics:
  - test: linear mixed-effects model with random intercepts and slopes per subject
    statistic: r = -0.29
    p: 0.001
    p_relation: "<"
  expected:
  - quantity: r between per-session tonic DA and session number
    value: -0.29
    tolerance: 0.029
  depends_on:
  - fig4b-long-iti-dip-below-baseline
  criterion: The per-session tonic measure of fig4b-long-iti-dip-below-baseline (with its
    readings) is regressed on session number in a linear mixed-effects model with random
    intercepts and slopes per subject (Methods, Floeder (2025) dataset, paragraph 2).
    Open, (1) session number, (a) the session's place among all of the mouse's sessions in
    date order, or (b) its place among the mouse's long-ITI sessions; (2) the r the paper
