    unit: '%'
  criterion: The model of Eq. 2 per session, as the Methods (Model neurons) give it. The
    stimulus s(t) is the AM signal in dB, thresholded at s_TH before filtering; h(tau) from the
    cross-correlation of the spike train with s*(t); t_ref the session's minimal ISI; spikes by
    an inhomogeneous Poisson process with rate r_s(t), zero for t_ref after each spike, at 0.1
