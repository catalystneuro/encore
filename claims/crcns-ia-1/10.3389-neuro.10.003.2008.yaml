  - quantity: mean fraction of information carried by n > 1 bursts
    value: 47
    tolerance: 4.7
    unit: '%'
  criterion: I'_n = I_n / T, with I_n = rbar_n times I_n(1) (Eq. 10) and T = 0.8 s (200 to 1000
    ms), under the readings of fig7ab-information-per-burst-increases. The fraction is the sum
    of I'_n over n > 1 over I'. Reproduced when both values are within tolerance under one
    reading. The text's sentence on the example cell is garbled ("provide no <69% of the total
    information"); it is read as at least 69% and not judged, as the example cell is not
    identified.
- id: direct-method-comparison
  statement: Information rates from the burst code are highly correlated with those of the
    direct method (R = 0.95), averaging 191 against 222 bits/s, the direct method being higher
    in all sessions but one by 31 bits/s on average, so the burst code keeps about 85% of the
    information.
  source: Results, Quantitative description of the information transmitted by bursts,
    paragraph 10; Discussion, Comparison with other neural codes, paragraph 3
  quote: The information measures obtained by our method and by the direct method were highly
    correlated ( R = 0.95, using all sessions). The population average obtained with the direct
    method is 222 ± 69 bits/s. With our method, instead, this average was 191 ± 72 bits/s. In
    all cases but one, the information obtained with the direct method was higher than the one
    obtained with our method, the average difference being 31 ± 16 bits/s.
  depends_on:
  - fig7gh-information-rate
  expected:
  - quantity: correlation between the two information rates over sessions
    value: 0.95
    tolerance: 0.05
  - quantity: mean information rate, direct method
    value: 222
    tolerance: 69
    unit: bits/s
  - quantity: mean information rate, burst code
    value: 191
    tolerance: 72
    unit: bits/s
  - quantity: mean difference, direct minus burst code
    value: 31
    tolerance: 16
    unit: bits/s
  - quantity: fraction of the direct-method information lost by the burst code
    value: 14
    tolerance: 1.4
    unit: '%'
  criterion: The direct method (Strong et al., 1998) on binary words of 0.4 ms bins up to 3.2 ms
    (8 bins), the entropies bias-corrected with NSB, over 200 to 1000 ms. The paper does not
    say whether the rate is taken at 3.2 ms or extrapolated to long words; readings (a) the
    rate at the 3.2 ms word length, (b) a linear extrapolation in the inverse word length over
    the lengths up to 3.2 ms. The burst-code rate is I' of fig7gh-information-rate, with the
    non-bursting sessions treated as all 1-bursts. "All sessions" is read as (a) the 86 kept
    sessions, (b) the bursting sessions. The tolerance of R is 0.05 since 10% would allow
    values above 1. Reproduced when, under one reading, R, the two means and the difference are
    within tolerance and the direct method is higher in all sessions but at most a few (90%).
- id: fig8-nbta-differ
  statement: In every bursting cell the burst-triggered averages for n = 1 to 4 differ
    significantly, their central peaks growing higher and wider with n; 50 of the 58 bursting
    sessions show significantly different central peaks in the time domain, the other eight
    having too few bursts.
  source: Results, Qualitative description of the information transmitted by bursts,
    paragraphs 3 and 6; Figure 8D
  quote: All recorded and simulated bursting cells exhibited significantly different n -BTAs,
    for n ranging between 1 and 4 ... out of the 58 sessions where bursting cells were found,
    50 exhibit n BTAs whose central peaks were significantly different from one another
  statistics:
  - about: nBTAs for n = 1 to 4, per session, frequency domain
    test: two-way ANOVA (frequency band and burst order) on real and imaginary parts
    p: 0.01
    p_relation: "<"
    corrected: Bonferroni
  - about: nBTA against each other nBTA at each time point
    test: Student's t-test
    p: 0.01
    p_relation: "<"
  depends_on:
  - table1-bursting-sessions
  expected:
  - quantity: bursting sessions with significantly different central peaks
    value: 50
    tolerance: 5
  - quantity: bursting sessions
    value: 58
    tolerance: 5.8
  criterion: As the Methods (Estimation of burst-triggered averages, paragraph 2) give it. Each
    stimulus segment from -25 to +15 ms around a burst onset is Fourier transformed; two-way
    ANOVAs on the real and on the imaginary parts, factors frequency bin and n (1 to 4), each at
    0.01 / 2; a session differs when either shows a main effect of n or an interaction. The
    frequency bins used are not stated; readings (a) all bins of the transform, (b) bins up to
    the stimulus cutoff. Then, at each time point, independent t-tests of each nBTA against the
    three others at p < 0.01, a point marked when all three are significant. What "central
    peaks significantly different" requires is not stated; readings (a) at least one marked
    point within the central peak for every n, (b) most points of each central peak marked (as
    "Most of the central peak in each n BTA is significantly different", paragraph 3). The
    stimulus is the AM signal in dB. Reproduced when every bursting session with bursts of
    n = 1 to 4 passes the ANOVA and the time-domain count is within tolerance under one
    reading.
- id: fig8-latency-decreases
  statement: The latency between the stimulus upstroke and burst onset decreases with n, so
    that high or wide deflections produce prompt responses with high-n bursts.
  source: Results, Qualitative description of the information transmitted by bursts, paragraph
    3; Figure 8D; Discussion, Implications for the neural code, paragraph 4
  quote: Moreover, the mean delay between stimulus upstroke and burst generation decreases
    systematically with n . This implies that stimulus deflections that are either high or wide
    tend to produce prompt responses, with high- n bursts.
  depends_on:
  - fig8-nbta-differ
  criterion: tau_n is the time between the maximum of the nBTA and burst onset (Methods, Eq. 13).
    The paper shows it for one cell and gives no population test. Readings for "systematically"
    are (a) tau_n decreasing from n = 1 to n = 4 in the majority of bursting sessions with
    bursts up to n = 4; (b) the mean over those sessions of tau_n decreasing from n = 1 to 4.
    Reproduced when both readings hold; partially reproduced when one does.
- id: fig8e-sigma-minimum
  statement: The standard deviation of the stimuli preceding an n-burst has a minimum about 7 ms
    before burst onset, at a position nearly the same for all n; over the bursting cells the SD
    of the minimum's position across n = 1 to 4 averages 0.4 ms (SD 0.7 ms).
  source: Results, Qualitative description of the information transmitted by bursts, paragraph
    4; Figure 8E
  quote: The constancy of the location of the minima also holds at the population level ... Its
    average among all bursting cells is 0.4 msec (SD 0.7 msec) considering 1 ≤ n ≤ 4.
  depends_on:
  - fig8-nbta-differ
  expected:
    quantity: mean over bursting sessions of the SD across n of the position of the minimum of
      sigma_n
    value: 0.4
    tolerance: 0.7
    unit: ms
  criterion: sigma_n(tau) by Eq. 14, its minimum searched over -25 to 0 ms (the window of the
    nBTA analysis before onset). Sessions with bursts of all four n. Reproduced when the value
    is within tolerance.
- id: sigma-n-below-sta-sigma
  statement: In 98% of bursting cells, for all n, the SD of the stimuli preceding an n-burst is
    smaller than the SD of the stimuli preceding all spikes, by a ratio of minima of 1.62 on
    average (SD 0.56).
  source: Results, Qualitative description of the information transmitted by bursts, paragraph 5
  quote: For 98% of the bursting cells and for all n -values, σ n (τ) was smaller than the
    standard deviation σ(τ) of the stimuli preceding all spikes (prior to any classification).
    The population average of the ratio of the minimum value of σ(τ) to the n -average of the
    minimum values of σ(τ) was 1.62 (SD 0.56).
  depends_on:
  - fig8e-sigma-minimum
  expected:
  - quantity: bursting sessions with sigma_n below sigma for all n
    value: 98
    tolerance: 9.8
    unit: '%'
  - quantity: mean ratio of min sigma to the mean over n of min sigma_n
    value: 1.62
    tolerance: 0.56
  criterion: The second sigma of the quoted ratio is garbled in the text; it is read as sigma_n,
    as the sentence compares the two. "Smaller" is read as (a) the minimum of sigma_n below the
    minimum of sigma, (b) sigma_n below sigma at every tau in -25 to +15 ms. n from 1 to 4.
    Reproduced when both values are within tolerance under one reading.
- id: fig9-nbta-not-concatenated-1bta
  statement: The nBTA differs from n 1BTAs shifted by the burst's own ISIs and summed; for a
    large fraction of cells, real and simulated, the difference is significant, the fraction
    diminishing as n grows; results are similar with shifted STAs.
  source: Results, Qualitative description of the information transmitted by bursts, paragraphs
    7 and 8; Figure 9A and 9B
  quote: A large fraction of the cells show a significant difference, for both real and
    simulated data. Hence, also at the population level, the n BTAs differ significantly from
    the convolved 1BTAs. As n increases, the number of sessions with significant differences
    diminishes.
  statistics:
  - about: nBTA against the convolved 1BTA, per session and n
    test: two-way ANOVA on real and imaginary Fourier parts
    p: 0.01
    p_relation: "<"
    corrected: Bonferroni
  depends_on:
  - fig8-nbta-differ
  criterion: As the Methods (Estimation of burst-triggered averages, paragraph 3) give it. For
    each n-burst, f_n(t) is the sum of the 1BTA shifted to each spike of the burst (Eq. 15),
    averaged over bursts; nBTA against f_n over the interval between the two minima flanking
    the nBTA's central maximum, by two-way ANOVAs on the real and imaginary Fourier parts at
    0.01 / 2; then point-by-point t-tests (p < 0.01 per point, as for Figure 8D), counting
    sessions with significant points over more than 70% of the interval. How each ANOVA's
    observations are formed is open; readings (a) each burst's stimulus segment against its own
    f_n, (b) the two collections of segments and convolved functions as two groups. Figure 9B
    gives the fractions only in a figure the text does not hold; "a large fraction" is read
    as more than half of the bursting sessions for n = 2. Reproduced when, under one reading,
    more than half differ for n = 2 by the ANOVA, the fraction does not grow from n = 2 to n =
    4, and the same holds with the STA in place of the 1BTA. The model sessions are shown
    where model-matches-classification could be run.
- id: fig9c-population-nbta
  statement: In the seven cells driven at 100 Hz cutoff and 6 dB, the population-average nBTAs
    show that bursts with more spikes follow higher or wider stimulus deflections, with large
    spread across cells.
  source: Results, Qualitative description of the information transmitted by bursts, paragraph
    9; Figure 9C
  quote: Figure 9 C demonstrates that also at the population level, high- n bursts are
    associated with either higher or wider stimulus deflections (or both).
  depends_on:
  - fig8-nbta-differ
  criterion: As paragraph 9 gives it, each session's 1BTA, 2BTA and 3BTA with the session's mean
    stimulus subtracted, shifted by tau_n before averaging and back after, averaged over the
    bursting sessions of protocol 5 (6 dB, 100 Hz). Reproduced when the central peak of the
    average is higher or wider (width at half height) for 2 than for 1 and for 3 than for 2.
- id: fig10-burst-n-vs-height
  statement: The probability of a burst with n spikes after a stimulus maximum depends on its
    height, low excursions giving no response or an isolated spike and high ones doublets,
    triplets or 4-bursts; all bursting cells show this.
  source: Results, Qualitative description of the information transmitted by bursts, paragraph
    10; Figure 10
  quote: Whereas fairly low excursions produce either no response (dotted line) or an isolated
    spike (black, solid line), large deflections are associated with doublets (dark grey),
    triplets (grey), or bursts with four spikes (light grey line). All cells showing a bursting
    behavior exhibited this phenomenon.
  depends_on:
  - fig8-latency-decreases
  criterion: P(n | h) as the Methods (Relating burst probabilities to the height of stimulus
    excursions) give it. Each n-burst shifted back by tau_n; each local maximum of the AM signal
    at t0 matched to the n-burst whose first spike is closest to t0 within [t0 - T, t0 + T], a
    burst matched to more than one maximum kept by the nearest; P(n | h) in windows of
    half-width 5% of the span of h. T is the width of the most prominent STA peak, not further
    defined; readings (a) between the minima flanking the peak, (b) full width at half maximum.
    The paper gives no measure of segregation; readings (a) the h at which P(n | h) peaks
    increases with n for n = 0 to the largest n with bursts (up to 4), (b) the mean of h
    weighted by P(n | h) increases with n. Reproduced when, under one reading, this holds in
    every bursting session; partially reproduced when it holds in most.
- id: firing-rate-no-effect-on-limit
  statement: The firing rate has practically no effect on the limiting ISI; a 50 Hz increase in
    rate shifts it by less than 0.4 ms and raises the average n by less than 25%.
  source: Results, Stimulus characteristics modulate burst probability, paragraph 9
  quote: More specifically, a 50 Hz increase in firing rate shifts the limiting ISI by <0.4
    msec, which is comparable to its estimated error bar. The average intra-burst spike count n
    , in turn, shows an increase of <25%.
  expected:
  - quantity: shift of the limiting ISI for a 50 Hz rate increase
    value: 0.4
    tolerance: 0.04
    unit: ms
  - quantity: increase of the average n for a 50 Hz rate increase
    value: 25
    tolerance: 2.5
    unit: '%'
  criterion: The paper does not say which recordings or which comparison gave these numbers; the
    kept sessions all have rates near 100 Hz (SD 16 Hz). Readings (a) the same cell and stimulus
    recorded at two target rates 50 Hz apart, where the data set holds such pairs; (b) a linear
    regression over the kept sessions of the limiting ISI and of the average n on the session's
    rate, scaled to 50 Hz. Reproduced when, under one reading, the shift is below 0.44 ms and the
    increase below 27.5%. If neither reading can be formed, not testable.
- id: model-reproduces-coding-trends
  statement: The threshold-linear model with refractoriness reproduces the coding trends of the
    data, at single-cell and population level, though it is less precise in time than the real
    cells.
  source: Results, Quantitative description of the information transmitted by bursts, paragraph
    8; Figure 7, right half; Figures 8C and 9D
  quote: A comparison between the left and right panels of Figure 7 reveals that the model
    reproduces the general trends observed in the experimental data, both at the single-cell
    and population level.
  depends_on:
  - model-matches-classification
  - fig7ab-information-per-burst-increases
  - fig7cd-occurrence-decreases
  - fig7gh-information-rate
  criterion: The model sessions of model-matches-classification, under its readings, analysed as
    in the Figure 7 claims. The "general trends" are read as the signs of the population mean
    slopes of Figure 7 (information per burst rising with n, occurrence and information rate
    falling with n). Reproduced when all three signs match the data's; partially reproduced for
    two.
