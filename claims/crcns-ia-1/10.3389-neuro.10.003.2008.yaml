# Claims for Eyherabide, Rokem, Herz & Samengo (2008), "Burst firing is a neural code in an
# insect auditory system", Frontiers in Computational Neuroscience, on CRCNS data set ia-1
# (doi:10.6080/K0BG2KWB).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-11-04, protocol as stated in docs/protocol.md (Reader), version pilot-13.
#
# Text read: the version of record in PubMed Central (PMC2525941, open access), from Europe PMC
# full-text XML, as supplied under paper/, with its Materials and Methods, Results, Discussion,
# the legends of Figures 1 to 10 and Table 1. No PDF was supplied, so values shown only in
# figures (Figure 5, Figure 9B and the population histograms of Figure 7) could not be read.
# The paper has no supplement. It links no analysis code, so none was read. Some passages are
# garbled in the text and are named in the claims that use them (Results, Quantitative
# description, paragraph 7, "no <69%"; Qualitative description, paragraph 5, a ratio of
# sigma to itself).
#
# Data the paper used. Adult Locusta migratoria, intracellular recordings from auditory
# receptor axons in the tympanal nerve; 37 receptor cells from 23 animals. Each cell was tested
# with two or more stimuli, 132 sessions in all (a session is one cell in one stimulus
# condition), of which 86 passed the selection (mean rate near 100 Hz, trial-to-trial SD of the
# firing rate below 35 Hz). Stimuli were amplitude-modulated sine carriers at the cell's best
# frequency (3 to 20 kHz), with a Gaussian AM signal, white up to a cutoff frequency. Every cell
# had the reference stimulus (SD 6 dB, cutoff 200 Hz) and one of six others (SD 6 dB with cutoff
# 25, 100, 400 or 800 Hz; cutoff 200 Hz with SD 3 or 12 dB); Table 1 lists the seven protocols.
# Each stimulus lasted 1 s, repeated N = 98 to 503 times (average 172), with 700 ms pauses; the
# first 200 ms of each trial are discarded in all results. Measured variables: spike times per
# trial, the stimulus AM signal (in dB), the cell's threshold s_TH and best frequency. The
# paper's 1 s trials and 0.1 ms time bins are the basis of every analysis.
#
# The CRCNS description says the data set holds two sets of spike-time recordings from the
# same lab, Data1 (2003), which it names as analysed in this paper, and Data2 (2004), which it
# says is unpublished and used other stimuli. The paper's experiments are those of Data1, with
# the stimulus files. Which sessions pass the paper's selection, and whether the thresholds
# s_TH are held, is for the author to find.
#
# Method choices common to all claims, from the Methods. Spikes binned at 0.1 ms; the first
# 200 ms of each trial discarded. Bursts are identified per session from the spike-train
# correlation function (Eq. 1): a session is bursting when C_s has a first peak below
# tau = 5 ms bounded on its right by a minimum below 1.25 times the inverse cutoff frequency
# that differs from the maximum by more than the sum of their error bars (Delta = sigma /
# sqrt(N)); consecutive spikes with ISI within the peak's domain (0 to the minimum) form one
# n-burst, dated by its first spike; in a non-bursting session every spike is a 1-burst.
# Details the Methods leave open, named in the claims that depend on them:
# (1) the first peak, which must exclude the zero-lag self term; readings (a) the first local
# maximum of C_s for tau > 0, (b) the largest value of C_s for 0 < tau < 5 ms;
# (2) the bounding minimum; readings (a) the first local minimum after the peak that differs
# significantly from the maximum, (b) the lowest value of C_s between the peak and
# 1.25 / cutoff;
# (3) sigma and N in Delta; readings (a) sigma the SD of the product terms of Eq. 1 at each tau
# over trials and times, N their number, (b) the same with N the number of trials;
# (4) the set of bursting sessions. Table 1 counts 63 sessions with n > 1 (40, 7, 6, 7 and 3),
# the Results speak of 59 bursting cells (Figure 7B) and of 58 bursting sessions (Figures 8
# and 9), with no stated reason for the difference. The readings are (a) all sessions the
# method classifies as bursting, (b) those of them that also have bursts with n > 1 in
# enough number for the analysis at hand. Population values are reported under both.
