  criterion: FRandR rates of patient 1 per night (mean over the night's intervals) and per
    interval; the HFO area per night and per interval by the 95th percentile rule; test-retest
    as in the opening comment, readings (a) and (b) of the permutation null. Reproduced when
    the area is PHR1-2 in every night, every per-interval area lies inside the RA (Table S1
    red), and the fraction is within tolerance under one reading. With intervals that have no
    FRandR on any channel the area is empty, which counts as inside the RA.
- id: test-retest-group
  statement: Across 18 patients the share of significant scalar products had median 97.5%
    (lower quartile 67%) over pairs of 5-minute intervals and median 100% (lower quartile 100%)
    over pairs of nights.
  source: Results, Test-retest reliability of the spatial distribution of HFO rates, paragraph
    2; Table 1, columns Test - retest intervals and nights
  quote: Across the group of 18 patients (Table 1 ), the percentage of significant scalar
    products had median of 97.5% (lower quartile 67%) when taking pairs of all 5 minutes
    intervals, and a median of 100% (lower quartile 100%) when taking pairs of entire nights.
  expected:
  - quantity: median share of significant interval pairs
    value: 97.5
    tolerance: 9.75
    unit: "%"
  - quantity: lower quartile, interval pairs
    value: 67
    tolerance: 6.7
    unit: "%"
  - quantity: median share of significant night pairs
    value: 100
    tolerance: 10
    unit: "%"
  - quantity: lower quartile, night pairs
    value: 100
    tolerance: 10
    unit: "%"
  criterion: Test-retest as in the opening comment, on the 18 patients with more than one
    interval (all but 7 and 17; night pairs exist only for the 16 with more than one night).
    Quartiles with Matlab prctile (the Methods name it for percentiles). HFO type readings (a)
    FRandR, (b) ripples, (c) FR, and permutation null readings (a) and (b) of the opening
    comment. Reproduced when, under one reading, the four values are within tolerance. The
    per-patient values are compared with Table 1 and the count within 0.1 of it is reported.
- id: test-retest-by-group
  statement: Over intervals, the median share of significant scalar products was above 98% in
    TLE patients irrespective of outcome, 97% in ETE patients with good outcome and only 36% in
    ETE patients with poor outcome.
  source: Results, Test-retest reliability of the spatial distribution of HFO rates, paragraph
    2; Table 1 legend; Discussion, Automated detection predicts seizure outcome, paragraph 2
  quote: Over the intervals of TLE patients, the median was >98% irrespective of outcome. Over
    the intervals of ETE patients, the median was 97% for patients with good outcome and only
    36% for patients with poor outcome.
  depends_on:
  - test-retest-group
  expected:
  - quantity: median, TLE patients
    value: 98
    tolerance: 9.8
    unit: "%"
  - quantity: median, ETE patients with good outcome (10-16)
    value: 97
    tolerance: 9.7
    unit: "%"
  - quantity: median, ETE patients with poor outcome (18-20)
    value: 36
    tolerance: 3.6
    unit: "%"
  criterion: Per-patient interval values from test-retest-group, under the reading that
    reproduced it. The paper reports no test. "Irrespective of outcome" is read two ways; (a)
    the median over all 8 TLE patients with more than one interval exceeds 98% (Table 1 gives
    0.985); (b) the median exceeds 98% within each outcome group (Table 1 gives 0.985 for ILAE
    1 and 0.835 for patients 8 and 9, so the paper's own table does not support (b)). The TLE
    part is judged on (a), median at least 98% minus 10% of 98. Reproduced when the three
    values are within tolerance and the ETE poor-outcome median is the lowest.
- id: spectral-classes
  statement: Of 6182 FRandR events on the highest-rate FRandR channel in each patient's HFO
    area, 45% had two spectral peaks (second peak median 240 Hz), 28% one peak in the HFO range
    (median 184 Hz) and 27% no prominent peak above 100 Hz.
  source: Results, Spectral analysis of ripples co-occurring with FR, paragraph 1; Figure 4
  quote: Out of 6182 detected events, 45% exhibited two distinct peaks in ripple and FR band with
    the second peak at median frequency 240 Hz (Fig. 4A ), 28% had only one peak in the HFO
    range (median frequency 184 Hz, Fig. 4B ), and 27% did not show a prominent peak >100 Hz in
    the HFO range.
  depends_on:
  - table-s1-rates
  expected:
  - quantity: FRandR events analysed
    value: 6182
    tolerance: 618
  - quantity: bimodal events
    value: 45
    tolerance: 4.5
    unit: "%"
  - quantity: median frequency of the second peak, bimodal
    value: 240
    tolerance: 24
    unit: Hz
  - quantity: unimodal events
    value: 28
    tolerance: 2.8
    unit: "%"
  - quantity: median peak frequency, unimodal
    value: 184
    tolerance: 18.4
    unit: Hz
  - quantity: events without a peak
    value: 27
    tolerance: 2.7
    unit: "%"
  criterion: From the Methods, Spectral analysis. Per patient, the bipolar channel of the FRandR
    area with the highest FRandR rate; every FRandR event on it; Stockwell transform of 0.6 s of
    signal centred on the event (st.m of the linked repository); the instantaneous power
    spectrum averaged over the duration of the FR part of the event (the deposit's FR marking
    overlapping the FRandR); a fit of four gaussians to the spectrum over 80-500 Hz by least
    squares (lsqcurvefit); peaks and troughs found on the fitted curve. Bimodal, a trough
    between 150 and 250 Hz and at least one peak above 200 Hz; unimodal, a single peak above
    100 Hz detectable in the ripple band; otherwise no peak. Open, with readings; the centre of
    the 0.6 s window, (a) the FRandR midpoint, (b) the FR midpoint; the signal transformed, (a)
    the unfiltered bipolar signal, (b) the signal high-passed at 80 Hz; the gaussian starting
    values and bounds, not given, (a) four gaussians at 100, 200, 300 and 400 Hz with widths
    of 50 Hz, (b) starting peaks at the four largest local maxima of the spectrum; a peak, (a)
    a local maximum of the fitted curve, (b) a fitted gaussian centre with positive amplitude
    inside the band; the "second peak" of bimodal events, (a) the higher-frequency peak (the
    Results say it is the second peak "in ripple and FR band"), (b) the more prominent peak
    (the Discussion calls 240 Hz the median of a prominent peak "around 200 Hz"). Patients
    whose FRandR area is empty contribute no events. The event count
    tolerance is 10%. Reproduced when the three shares are within tolerance under one reading
    and the two median frequencies are; partially reproduced when the shares are in the same
    order (bimodal largest) under one reading.
- id: spectral-tle-ete-no-difference
  statement: The spectral classes of FRandR events did not differ significantly between TLE
    and ETE channels.
  source: Results, Spectral analysis of ripples co-occurring with FR, paragraph 1
  quote: No significant difference was observed between TLE and ETE channels.
  depends_on:
  - spectral-classes
  criterion: A claim of absence; the paper names no test, only significance at p < 0.05
    (Methods, Clinical validation). Main reading, a chi2 test of the 3 x 2 table of spectral
    class (bimodal, unimodal, none) by epilepsy type over events, at p < 0.05. Variant, a
    Wilcoxon rank sum test of the per-patient bimodal fraction between the 9 TLE and 11 ETE
    channels. Reproduced when the main test gives p >= 0.05; the class shares per group and
    the variant are reported.
- id: tp-patients-hfo-area-location
  statement: In the patients whose HFO area was not fully resected, the area lay outside the
    resection; in patient 18 over occipital contacts ipsilateral to a resection that included
    parietal cortex, in patient 19 over the parietal and not the resected temporal cavernoma,
    and in patient 20 at the anterior margin while the resection was at the posterior margin
    of the occipito-temporal gyrus.
  source: Discussion, FRandR in patients with recurrent seizures, paragraph 2
  quote: In patient 18, our analysis identified the HFO area over occipital contacts ipsilateral
    to the resection, which included parietal cortex. ... The HFO area included the parietal
    cavernoma but not the temporal cavernoma. The surgical choice was to resect only the
    temporal cavernoma. In patient 20, the resection included the seizure onset area in the
    posterior margin of the left occipito-temporal gyrus but the HFO area was in the anterior
    margin.
  depends_on:
  - frandr-area-resection-per-patient
  criterion: FRandR area channels of patients 18, 19 and 20 as in frandr-area-resection-per-
    patient. Channel locations from the deposit's electrode schemes and channel labels. For
    each patient, reproduced when at least one area channel lies outside the RA in the region
    the Discussion names (patient 18, an occipital contact; patient 19, a contact of the
    parietal grid; patient 20, an anterior contact of the grid). Judged per patient; reproduced
    when all three hold, partially when one or two do. Where a contact's region cannot be read
    from the schemes, that patient is not judged and the notes say why.
