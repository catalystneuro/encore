# Claims for Fedele, Burnos, Boran, Krayenbuehl, Hilfiker, Grunwald & Sarnthein (2017),
# Scientific Reports 7, 13836, on CRCNS ieeg-1.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-11-09, protocol pilot-14 as stated in docs/protocol.md.
#
# Text read: the version of record (PMC5653833, Europe PMC JATS XML flattened), main text,
# Tables 1 and 2, figure legends and Methods, and the supplement (41598_2017_13064_MOESM1_ESM.pdf,
# from the publisher), which holds only Table S1. The text of Table S1 keeps the channel names
# and rates but loses its colours; the PDF page was rendered to read them: channels excluded
# from the analysis are filled gray, resected channels (RA) red, and the HFO area of each HFO
# type green, cell by cell in the Ripples, FR and FRandR rows. The colours are vector fills in
# the PDF and can be read programmatically. The CRCNS data description (paper/ieeg-1.data-
# description.txt) was read for the layout of the deposit only; no claim is taken from it.
#
# Code: the Methods link https://github.com/HFO-detect/HFO-detect-matlab, read at commit
# f39736734031c9e37e0b101536be8d8be35906db (2017-07-14). It holds the HFO detectors only: the
# morphology detector of Burnos et al. 2016 (hfo-detect-toolbox/Morphology Detector, with
# Filter_AsBurnos2016.mat, the Stockwell transform st.m, and the detector parameters in
# func_prepareMorphologyDetector.m: minimum duration 0.02 s for ripples and 0.01 s for FR, as
# the Methods say; filtering with filtfilt), plus line-length and RMS detectors. The function
# it calls, RUN_MorphologyDetector, is not in the repository. It holds no code for the FRandR
# overlap, the HFO rates, the HFO area, the test-retest analysis, the outcome statistics or the
# spectral analysis. Those methods come from the paper alone. The deposit holds the detected
# events (R, FR and FRandR start and end samples per bipolar channel), so the detector need not
# be rerun for any claim except as a check.
#
# Data the paper used (Results paragraph 1, Table 1, Methods). 20 consecutive patients with
# drug-resistant focal epilepsy operated after invasive monitoring, March 2012 to April 2016:
# 9 with mesial temporal lobe epilepsy (TLE, patients 1 to 9, bilateral depth electrodes in
# amygdala, hippocampus, entorhinal and perirhinal cortex) and 11 with extratemporal epilepsy
# (ETE, patients 10 to 20, grids, strips and depth electrodes). Outcome by ILAE class (Table 1):
# ILAE 1 in patients 1 to 6 and 10 to 16 (13 seizure free); ILAE 3 in 7 and 8; ILAE 5 in 9, 17,
# 18 and 20; ILAE 6 in 19. Follow-up months per patient in Table 1. Recordings: iEEG at 4 kHz,
# down-sampled to 2 kHz, common intracranial reference, transformed to bipolar channels. From
# each night up to six 5-minute intervals of interictal slow-wave sleep, at least 3 h from
# seizures; nights and intervals per patient in Table 1 (1 to 6 nights, 1 to 39 intervals).
# Channels where stimulation evoked motor or language responses were excluded; in TLE only the
# 3 most mesial bipolar channels of each electrode were kept (gray cells of Table S1 mark the
# exclusions). Measured variables: detected ripples (80-250 Hz), fast ripples (FR, 250-500 Hz)
# and FR co-occurring with ripples (FRandR), their rates per channel in events/min (Table S1),
# the resected channels (Table S1, red), and outcome (Table 1).
#
# Methods fixed by the paper and used by several claims:
# - HFO rate of a channel: events per minute (Table S1, Fig. 3A).
# - HFO area (Methods, Definition of the HFO area by rate thresholding): the channels whose rate
#   exceeds the 95th percentile of the patient's distribution of channel rates, computed with
#   Matlab prctile.m (its default method: sorted values placed at percentiles 100(i-0.5)/n,
#   linear interpolation, the extreme values beyond the end points). One area per HFO type.
# - Outcome classes (Methods, Clinical validation): TP, HFO area not fully inside the RA (at
#   least one area channel not resected) and recurrent seizures (ILAE 2-6); FP, not fully inside
#   and ILAE 1; FN, fully inside and recurrent seizures; TN, fully inside and ILAE 1. PPV, NPV,
#   sensitivity, specificity and accuracy as defined there. 95% CI by the binomial method for
#   n < 10 and the asymptotic method for n > 10; significance at p < 0.05.
# - Test-retest (Methods, Test-retest reliability): for each pair of 5-min intervals the
#   normalized scalar product of the channel rate vectors; null from 5000 random permutations of
#   the channel order of each interval; a pair is significant when its scalar product exceeds
#   the 97.5th percentile of the null. Nights: the mean rate of each night, pairs of nights.
#
# Open details, each with the readings the text allows (the author runs them all):
# - How a channel's rate is pooled over intervals: (a) all events over the total recorded time
#   of the patient; (b) the mean over intervals of per-interval rates; (c) the mean over nights
#   of per-night mean rates (Methods, Test-retest, "we took the mean HFO rate for each night").
#   Fig. 3 legend says the HFO area "averaged over all intervals"; (d) a channel is in the area
#   when it is in the per-interval area in at least half of the intervals. Table S1's rates
#   (claim table-s1-rates) decide among (a) to (c); the reading that matches them is used for
#   the area in every other claim, and (d) is shown as a variant.
# - Which channels enter the percentile: (a) the channels not grayed in Table S1; (b) all bipolar
#   channels of the deposit. "Exceeds" is read as strictly greater (Methods, "exceeded"); greater
#   or equal is a variant.
# - The resected channels come from Table S1 (red), unless the deposit marks them; the paper
#   names no other source.
# - The HFO type of the test-retest values of Table 1: Fig. 3 shows FRandR; Table 1 does not
#   say. Readings: (a) FRandR; (b) ripples; (c) FR.
# - The permutation null: (a) one null per interval pair (each interval's channel order
#   permuted 5000 times); (b) one null pooled over all pairs of the patient, as Fig. 3B plots a
#   single random distribution.
# - "Normalized scalar product": the dot product divided by the product of the vector norms
#   (cosine), the standard meaning; the paper says it is about 1 for overlapping distributions,
#   which this reading gives for non-negative rates.
# - The test of the follow-up comparison and the chi2 tests are named but not their variants;
#   see the claims.
#
# Inconsistencies in the paper: the specificity CI is 78-100% in the Results and 75-100% in the
# Discussion; the Clopper-Pearson interval for 13/13 is 75.3-100%. The Table 1 legend gives
# test-retest medians for TLE patients "irrespective of outcome" as >98%; Table 1 gives 0.67 for
# patient 8 (ILAE 3) and 1.00 for patient 9 (ILAE 5), whose median is 0.835. The Fig. 1 legend
# labels PR "posterior hippocampus left". Patient 19 has a 4 x 8 grid in the Discussion and an
# 8 x 4 grid in Table 1. The Methods select "up to six intervals" per night, but Table 1 lists more
# intervals than six times the nights for several patients (patient 3, 5 nights and 39 intervals;
# patients 5 and 6, 5 nights and 35; patient 1, 4 nights and 28; patient 2, 2 nights and 13;
# patients 15 and 20, 4 nights and 28 and 29).
