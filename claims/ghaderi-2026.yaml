# Claims for Ghaderi, Crochet & Petersen (2026), "Contextual gating of whisker-evoked responses by
# frontal cortex supports flexible decision making", Nature Communications 17, 5982, on dandiset
# 001530.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21, protocol
# pilot-10 as stated in docs/protocol.md (Reader).
#
# Text read: the version of record as served by Europe PMC (PMC13346651), corrected publication
# (a correction, doi:10.1038/s41467-026-75986-7, is noted in the text; its content was not
# supplied): main text, figure legends, Methods, Data and Code availability
# (paper/10.1038-s41467-026-73622-y.txt). No PDF was supplied. The Supplementary Information
# (Supplementary Figures 1 to 19), the Reporting Summary, the peer review file and the Source Data
# file were not in the text and were not read. Every claim below rests on a sentence of the main
# text or a main figure legend; where the main text cites a supplementary figure for a finding
# (Supplementary Figs. 3, 17, 18), the claim is written from the main-text sentence and its
# method from the code that draws that supplementary figure.
#
# Code read: the paper's Zenodo record doi:10.5281/zenodo.17973874 (one archive,
# 2026_Ghaderi_NCOMMS_Zenodo_data_code.zip, 21212076245 bytes, holding the data, the processed
# data and the code). Only its code files were read (README.txt, processed_data_code/,
# Main_figures_codes/, Supplementary_figures_codes/, functions/*.m), by range requests; no data
# file was opened. The same code is on GitHub at LSENS-BMI-EPFL/Ghaderi_et_al_NCOMMS_2026, commit
# 20cf10c7b95069c12f762b7dd89817beedcc382f (2026-06-05); its processed_data_code and
# Main_figures_codes files are byte-identical to the Zenodo copies. The code is MATLAB (libsvm,
# matnwb, subspaceID of Hasnain et al., manopt) and two Python notebooks (clustering, layer
# analysis). It reads the 35 ephys NWB files (data_electrophysiology/*-processed-behavior.nwb),
# the 91 optogenetics NWB files (data_optogenetics/*-opto-behavior.nwb) and three helper files
# (data_helpers/Area_list.mat, the Allen CCF acronyms that make up each of the five areas;
# Area_Top_Coordinates.mat; Lick_times.mat, spontaneous lick times, a lick mask and the continuous
# jaw trace per session). Criteria cite it as "code, <file>".
#
# Conventions the code fixes for every claim unless the claim says otherwise (code,
# psth_10ms.m, psth_5ms.m, nwb_findQuietTrial.m, trial_typeMaker.m):
#   - Time zero is the trial start (auditory cue onset, or its expected time on No-tone trials);
#     the whisker stimulus is at 1.0 s. Spike counts are binned from -1 to 2 s in 10 ms (or 5 ms)
#     bins; a bin labelled t holds spikes in (t - bin, t].
#   - Trial types 1 to 5 are Go-tone Whisker, Go-tone No-Whisker, Nogo-tone Whisker, Nogo-tone
#     No-Whisker, No-tone Whisker. Correct trials are Hit (type 1 with lick) and correct
#     rejections (types 2 to 5 without lick); Miss is type 1 without lick; False Alarm is a lick
#     in types 2 to 5. Early-lick (aborted) trials are always excluded.
#   - Quiet trials (Methods, Quantification of orofacial movements): per session and signal, the
#     mean of the signal over 0.8 to 1.0 s is at or below the median plus one MAD of the per-trial
#     means over -1 to 0 s, taken over all trials of the session; whisker speed (absolute
#     frame-to-frame change of C2 whisker angle) and jaw displacement (distance from the modal jaw
#     position) must both pass. The code calls MATLAB mad() with its default, the mean absolute
#     deviation, where the Methods say median absolute deviation. Every claim that uses quiet
#     trials follows the Methods (median absolute deviation) for its outcome and shows the code's
#     mean absolute deviation as a variant.
#   - A neuron belongs to an area when it was recorded on a probe targeted to that area and its
#     own CCF label is one of the area's CCF acronyms (code, Area_list.mat); sessions with fewer
#     than 5 such neurons are skipped in population analyses. "Sessions" in the paper's n are
#     area-by-session recordings.
#
# Where the Methods and the code disagree (Methods followed, code as variant, unless the claim
# says why not):
#   - Optogenetics bootstrap: Methods and Fig. 2 legend say 1,000 iterations; the code uses
#     10,000 (Ghaderi2025_Figure2_d_Plick_Sessions.m). With 1,000 the smallest attainable p is
#     0.002 before FDR, so the reported 0.0003 and 0.0004 fit the code's 10,000.
#   - Clustering: the Methods describe 10 ms PSTHs (1500 bins) and a Gaussian similarity
#     exp(-d^2/2 sigma^2); the code clusters 100 ms PSTHs (Neuronal_data_100ms.m, 150 bins), uses
#     exp(-d/sigma) and labels sigma = 0.07975 as its 100 ms value. The Methods are followed for
#     the outcome and the code is shown as a variant (protocol, Reader step 2), though the code
#     is likely what produced the 29 clusters.
#   - Context coding direction: Methods say it is computed from 20% of trials; the code
#     (Coding_direction_10ms.m, Coding_direction_5ms.m) trains on 30% (cvpartition HoldOut 0.7,
#     the held-out 70% projected).
#   - Decoding: Methods name a grid search of SVM parameters with nested cross-validation and a
#     baseline of -1 to 0 s; the code trains libsvm nu-SVC ("-s 1 -t 0", default nu 0.5) with no
#     search, z-scores the balanced trial matrix before the 5 folds, and takes the baseline over
#     -0.8 to 0 s.
#   - Fig. 6a legend says the PCs are computed on correct Go-tone Whisker and Nogo-tone Whisker
#     trials and other trials projected; the Methods and the code compute them on all four
#     conditions (Hit, Nogo CR, Go-tone No-Whisker CR, Miss) concatenated.
#
# A paper inconsistency: the Results and Fig. 1c give 35 recording sessions in 14 mice and the
# Zenodo record holds 35 ephys files; the Methods say "Across 34 sessions in 14 mice" and list
# 12 + 3 + 1 + 16 + 2 = 34 sessions.
#
# The data the paper used, as it reports them:
#   - Mice: VGAT-ChR2 (Slc32a1-COP4*H134R/EYFP) for optogenetics, some reused for recordings, and
#     C57BL/6 for recordings only; male and female, at least 6 weeks old. Go-tone 4 or 8 kHz
#     (100 ms) per mouse, delay 1 s, right C2 whisker deflection (5 ms), 1 s response window,
#     five equiprobable trial types.
#   - Optogenetics: 470 nm light (100 Hz, 50% duty, 12 to 15 mW) on one area per session (A1 9
#     mice, wS1 10, wS2 10, wM2 9, ALM 8, fpS1 8), 30% of trials, in one of three windows
#     (Auditory -0.05 to 0.3 s; Delay 0.4 to 0.85 s; Whisker 0.95 to 1.2 s; each plus a 100 ms
#     ramp). 91 sessions on Zenodo.
#   - Electrophysiology: Neuropixels Phase 3A, 2 to 5 probes per session, 35 sessions in 14 mice,
#     10,294 units after Kilosort 2.0, Bombcell and CCF registration (A1 780, wS1 1938, wS2 2064,
#     wM2 2749, ALM 2763); RS (> 0.46 ms), FS (< 0.36 ms) and unclassified by spike width; layer
#     and depth from the Allen CCF.
#   - Behaviour: piezo lick sensor (2 kHz), 200 Hz video (100 Hz in mouse PG019) with
#     DeepLabCut tracking of C2 whisker angle, jaw, tongue and snout.
#
# The dandiset's own description (title and description on the archive only; its files were not
# opened): "Data related to the publication Ghaderi et al., Nature Communications, 2026", 196
# assets from 21 subjects, about 2.6 TB, pointing to the same Zenodo record and GitHub repository
# for processed data and code. Which recordings and variables it holds is the author's to find.
#
# Outside data. Claims about named clusters (cluster 1, 4, 11, 25, 29) need the paper's cluster
# labels, which a new clustering would not number the same way; those labels are on Zenodo
# (doi:10.5281/zenodo.17973874, processed_data/Data_Clustering.mat, Cluster_Counter_Ordered and
# Id_Ordered, keyed to the code's global unit index built from the order of probes in
# psth_10ms.m), so those claims are data with_inputs. The lick coding direction (Fig. 8b,
# Supplementary Fig. 18) uses spontaneous lick times and the continuous jaw trace from
# data_helpers/Lick_times.mat on the same record; whether the dandiset holds them is the
# author's to find.
#
# Tolerances. Where the paper gives a spread (plus or minus SEM), the tolerance is that spread;
# otherwise 10% of the value.
