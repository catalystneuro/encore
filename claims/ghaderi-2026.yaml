  quote: 'Cluster #1 had a large and fast response to the auditory cue and mostly consisted of neurons in A1, whereas Cluster #29 responded strongly and rapidly to whisker deflection and mostly consisted of neurons in wS1 and wS2. A few clusters showed strong context-dependent firing selectivity comparing Go-tone and Nogo-tone trials, most notably Clusters #11 and #25, which showed prominent delay period firing only in Go-tone trials and mainly consisted of neurons in wM2 and ALM ( Fig. 4b ). Interestingly, another cluster, Cluster #4, showed a prominent decrease in firing rate during the delay period selectively for Go-tone trials and neurons in this cluster were widely distributed across the five recorded cortical areas'
