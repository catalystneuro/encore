  criterion: As Methods and code, Coding_direction_SpontLick.m and
    Ghaderi2025_Figure8_b_SpontLick_CD_LickvsNolick.m. Spontaneous licks are licks outside 0 to 6
    s of any trial start, in bouts (lick mask, from Lick_times.mat) longer than 0.5 s, whose mean
