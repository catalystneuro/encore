    in the Auditory (0 to 0.03 s) and Delay (0.8 to 1.0 s) windows relative to the
    pre-auditory baseline, and in the Whisker (1.0 to 1.03 s) and Lick (1.3 to 1.5 s) windows
    relative to the pre-whisker baseline; per area, the mean over its probes. The baseline
