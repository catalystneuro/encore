    return to baseline and Miss trials fail to reach the Go-tone state. PC1 explains 11% (A1, wS1,
    wS2), 17% (wM2) and 14% (ALM) of variance, PC2 6% (A1, wS1, wS2) and 8% (wM2, ALM).
  source: Results, Context-dependent neuronal dynamics during the delay period, paragraph 1;
    Figure 6a
  quote: 'Neuronal activity in each cortical area exhibited a rapid response after tone onset in PC1 (explained variance: A1, 11%; wS1, 11%; wS2, 11%; wM2, 17%; and ALM 14%) and PC2 (explained variance: A1, 6%; wS1, 6%; wS2, 6%; wM2, 8%; and ALM 8%). Activity in A1, wS1 and wS2 followed an apparently cyclic trajectory, returning near to the start point by the end of the delay period. However, in correct Go-tone trials, neuronal activity in wM2 and ALM settled rapidly (within ~200 ms) into an apparent fixed point far from the origin ... Interestingly, in error trials where the mouse did not lick in response to the whisker stimulus preceded by a Go-tone (i.e., Miss trials), the neural activity in wM2 and ALM failed to reach the apparent attractor state of correct Go-tone trials.'
