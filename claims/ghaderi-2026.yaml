  quote: 'there were two obvious differences comparing Go-tone and Nogo-tone trials: i) there was a prominent elevation in firing rate in wM2 and ALM during the delay period of Go-tone trials compared to Nogo-tone trials; and ii) after the whisker stimulus there was a clear increase of activity in correct Go-tone Whisker trials compared to all other trial types in wS1, wS2, wM2 and ALM'
