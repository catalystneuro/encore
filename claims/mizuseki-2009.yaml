# Claims for Mizuseki, Sirota, Pastalkova & Buzsaki (2009), Neuron 64, 267-280, "Theta Oscillations
# Provide Temporal Windows for Local Circuit Computation in the Entorhinal-Hippocampal Loop",
# doi:10.1016/j.neuron.2009.08.037, on CRCNS data set hc-2.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-09,
# protocol as stated in docs/protocol.md (Reader).
#
# Text read: the version of record with its supplement (Supplemental Data, 678d1873-mmc1_1.pdf),
# as supplied under paper/ (PyMuPDF text): main text, figure legends, the short Experimental
# Procedures, the Supplemental Experimental Procedures, Table S1 and the legends of Figures S1 to
# S19. The text prints degree signs, minus signs and "approximately" as a replacement character;
# those values were read from the PDF. Table S1 is an image in the supplement and was read from
# the rendered page. Figure 3D and 3H (significance marks), Figure 4 (arrows) and Figure 7 (the
# percentages and n above each panel) were read from the rendered pages. The CRCNS data
# description (paper/hc-2.data-description.txt) was read for the layout of the deposit only; no
# claim comes from it.
#
# Code: the paper links no code. Its analyses were "carried out by custom-written MATLAB-based
# software" (Supplemental Experimental Procedures), not published with it. Every method below
# comes from the paper and its supplement alone.
#
# Data the paper used (Results paragraph 1, Supplemental Experimental Procedures, Table S1).
# Five male Long-Evans rats (ec12, ec13, ec14, ec16, i01), a 4-shank silicon probe in the right
# dorsocaudal medial entorhinal cortex (EC), moved between sessions over 4 to 12 weeks, and in
# four rats a second probe (4 or 8 shanks) in the right dorsal hippocampus, in the CA1 or CA3
# pyramidal layer or the dentate gyrus (DG) granule cell layer; rat ec12 had no hippocampal probe,
# and in rat i01 the EC layers could not be verified by histology (i01 theta reference is CA1).
# Tasks: linear track (250 cm), open field ("square", 180 x 180 or 120 x 120 cm, chasing water or
# Froot Loops), T-maze alternation with wheel-running delay, rewarded wheel running. Wideband
# signal at 20 kHz, LFP at 1250 Hz, position from two head LEDs at 30 Hz. Units sorted with
# KlustaKwik and Klusters; sessions on different days clustered separately, so a neuron may be
# counted more than once; neurons tested in several sessions were analysed session by session
# (Table S1 legend). Cells per Table S1: EC 2744 (EC2 569, EC3 820, EC5 723, layer unknown 632,
# excluded), CA1 3864 (3270 principal, 464 interneurons), CA3 876, DG 175. EC layers EC1 to EC5
# (EC5 covers EC5 and EC6) from sharp-wave and theta reversals and histology (Figure 1, S1).
# Measured variables: spike times and waveforms per unit, LFP per site, position, task.
#
# The CRCNS data set hc-2, by its title and description, is meant to hold recordings of this
# study. Whether it holds the EC recordings, the hippocampal recordings of every rat, the tasks
# other than the open field, the cell-type and layer labels, and the theta epochs, is for the
# author to find. Many claims below need EC or CA3/DG neurons, or tasks, that it may not hold.
#
# Methods fixed by the paper and used by several claims (Supplemental Experimental Procedures,
# unless another place is cited):
# - Theta epochs: ratio of power in the 5-11 Hz band to the 1-4 and 12-14 Hz bands of EC3 LFP,
#   with manual adjustment; walking/running epochs only.
# - Theta phase: LFP filtered 5-11 Hz (Figure S9 legend); peaks found as positive-to-negative
#   zero crossings of dy/dt, phase linearly interpolated between peaks, peak = 0 and 360 degrees,
#   trough = 180 (the "maxima method", used in all figures but S9). Reference LFP is EC3 unless
#   stated (Results, Physiological identification of EC layers; Figure S10 uses CA1 pyramidal).
# - Single-cell theta modulation: units with at least 50 spikes and rate > 0.1 Hz in theta epochs;
#   Rayleigh test, p < 0.01; preferred phase = circular mean, modulation depth = mean resultant
#   length R.
# - Cell types: hippocampal principal cells and interneurons from autocorrelograms, waveforms and
#   rates; EC types from monosynaptic interactions (jitter test, [-5, 5] ms, 1000 surrogates, 99%
#   global bands over [-20, 20] ms, significant bins at [1, 5] ms) and a hyperplane on
#   trough-to-peak latency and waveform asymmetry (Figure 2C).
# - Instantaneous rate of a spike: the number of the neuron's spikes in a 250 ms window centred
#   on it, in categories 1 to >= 10 spikes (4 to >= 40 Hz). Burst spikes: an ISI before or after
#   < 6 ms; single spikes: both ISIs > 20 ms.
# - Pair cross-correlograms over [-200, 200] ms, normalised by (1 - |t|/T) for segment length T.
#   Group CCGs: summed counts, Gaussian smoothing SD 5 ms, jitter +/-125 ms, 99.9% global band
#   over [-150, 150] ms, significant bins at p < 0.001. Pair offsets: CCG smoothed SD 10 ms,
#   1000 jitter surrogates (+/-125 ms), 95% global band over [-150, 150] ms; a pair is
#   significant when its peak is outside the band and the smoothed CCG has more than 100 events
#   in [-150, 150] ms; the offset is the peak time in [-150, 150] ms; offset histogram in 5 ms
#   bins smoothed with [0.25, 0.5, 0.25], 95% global band against a uniform distribution.
# - Linear track place fields: 5 cm bins per direction, no smoothing; a field is a run of at
#   least 3 bins above 10% of the track peak, extended until the rate rises again or falls below
#   1% of peak; fields with fewer than 50 spikes or including a turn are dropped; spatial
#   coherence is the correlation of each bin's rate with its neighbours' rates (Hafting et al.,
#   2008); phase precession only in fields with coherence > 0.7, by rotating phase in 1 degree
#   steps and taking the phase-position correlation at the rotation with the largest R2.
#
# Open details shared by several claims, with the readings the paper allows:
# - (O1) "Neighbouring bins" in spatial coherence: (a) the two adjacent bins, (b) the mean of
#   the two adjacent bins correlated with each bin. Hafting et al. (2008), which the paper
#   cites, is the source; the author follows it if it settles the point.
# - (O2) How a session's units that recur in several sessions are counted: (a) session by
#   session, as the Table S1 legend says the paper did; (b) once per unit. Reading (a) is the
#   paper's and decides; (b) is a variant.
# - (O3) Filter used for 5-11 Hz theta: not named; a zero-phase band-pass filter is the
#   standard choice and cannot move peak times by more than a few degrees.
# - (O4) For the open-field and task splits, what counts as a session of a task is the
#   session's task label.
