  criterion: Sessions with both a CA1 pyramidal layer and an EC3 site. The range 0 to 80 degrees
    widened by 10% of each bound is 0 to 88 (stated above as 44 +/- 44). Session
    shift is the circular mean difference of the peak-referenced phases. Reproduced when every
    session's shift lies in that range and the group mean preferred phases under the two
    references differ by about the session shift (each group's difference within 45 degrees of
    the mean session shift; the threshold is not in the paper). Not testable without EC3 LFP.
- id: fig4a-ec-hippocampus-offsets
  statement: Large time offsets of 50 to 85 ms separate EC2 principal cells from CA3 and DG
    principal cells, and EC3 from CA1 principal cells; EC2-DG and EC2-CA3 group cross-correlograms
    are the most theta modulated and EC3-CA1 modestly.
  source: Results, Temporal relationship between entorhinal and hippocampal neurons, paragraph 1;
    Figure 4A
  quote: large time offsets (50 to 85 ms) were present between EC2 and CA3/dentate principal cells
    and between EC3 and CA1 pyramidal neurons (black arrows in Figure 4A)
  expected:
    quantity: time from the EC reference spike to the peak of the target group's activity
    value: 69.25
    tolerance: 24.25
    unit: ms
  criterion: Group cross-correlograms with the EC principal cell as reference (Figure 4A, time zero
    the reference spike; arrows point to positive lags), computed as in the shared methods. The
    range 50 to 85 ms widened by 10% of each bound is 45 to 93.5 ms. The peak taken is open;
    readings (a) the first significant peak (bins above the 99.9% band) of the smoothed group
    CCG at positive lag, (b) the mode of the smoothed distribution of pair offsets at positive
    lag. Reproduced when, under one reading, EC2-DG, EC2-CA3 and EC3-CA1 all peak at 45 to 93.5
    ms. Theta modulation of the group CCG is compared by the CCG's peak-to-trough ratio over
    [-150, 150] ms (a measure the paper does not name) and reported. Not testable without EC
    neurons.
- id: fig4a-pair-offset-ranges
  statement: Most EC2-DG, EC2-CA3 and EC3-CA1 principal pairs have temporal offsets in [-60, 0] ms
    or [60, 120] ms, and only a minority peak at [0, 30] ms.
  source: Results, Temporal relationship between entorhinal and hippocampal neurons, paragraph 1;
    Figure 4A, black histograms
  quote: Most of EC2-DG, EC2-CA3, and EC3-CA1 principalprincipal neuron pairs had temporal offsets
    at
  criterion: Significantly correlated pairs and their offsets as in the shared methods (Supplemental
    Experimental Procedures, temporal offsets). The quote is cut where the PDF text garbles the
    minus sign; the passage continues "[-60 to 0] ms or [60 to 120] ms, and only a minority of
    pairs had peaks at [0 to 30] ms". Reproduced when, for each of the three categories, more
    than half of the significant pairs fall in [-60, 0] or [60, 120] ms and fewer than half in
    [0, 30] ms; partially reproduced for one or two categories.
- id: fig4a-ec5-ca1-flat
  statement: The group cross-correlogram and the distribution of temporal offsets between CA1 and
    EC5 principal cells are essentially flat, while those of EC2-EC5 and EC3-EC5 pairs are more
    strongly theta modulated.
  source: Results, Temporal relationship between entorhinal and hippocampal neurons, paragraph 1;
    Figure 4A
  quote: The group cross-correlogram and the distribution of temporal offsets between CA1 and EC5
    principal cell pairs was essentially flat, whereas those of EC2-EC5 pairs and EC3-EC5 pairs
    were more strongly theta modulated
  criterion: A claim of absence for CA1-EC5, judged on the paper's tests (Figure 4 legend,
    Supplemental Experimental Procedures). The offset distribution is tested against the 95%
    global band for a uniform distribution; flat when the smoothed distribution stays inside the
    band. The group CCG's significant bins (99.9% jitter band) are reported. Reproduced when the
    CA1-EC5 offset distribution stays inside the band and the EC2-EC5 and EC3-EC5 distributions
    leave it; the peak-to-trough ratio of the smoothed group CCGs is given for all three. Not
    testable without EC5 and CA1 neurons recorded together.
- id: fig4-ec2-ec3-opposite-lags
  statement: EC2 and EC3 principal cells fire with time lags corresponding to opposite theta phases;
    EC2 principal-EC2/3 interneuron pairs have small offsets and EC3 principal-EC2/3 interneuron
    pairs large ones; EC2 principal-DG/CA3 interneuron and EC3 principal-CA1 interneuron pairs
    also have large offsets.
  source: Results, Temporal relationship between entorhinal and hippocampal neurons, paragraph 1;
    Figure 4A and 4B
  quote: Principal cells of EC2 and EC3 fired with time lags corresponding to preferences of opposite
    phases of the theta cycle (Figure 4A). EC2 principal cell-EC2/3 interneuron pairs had small,
    whereas EC3 principal cell-EC2/3 interneuron pairs had large temporal offsets
  criterion: Peak of the smoothed group CCG within [-150, 150] ms, as in the shared methods. The
    paper assumes 1 theta cycle = 125 ms (Figure S11 legend), so opposite phases are a lag near
    62.5 ms. "Small" and "large" have no threshold; readings (a) small is within 20 ms of zero
    and large beyond 40 ms; (b) small is below a quarter cycle (31 ms) and large above it.
    Reproduced when, under one reading, the EC2-EC3 lag is large and every pairing falls in the
    class the statement gives. Not testable without EC neurons.
- id: figs11-phase-time-agreement
  statement: The time offsets of individual neuron pairs correlate closely with the differences
    between their preferred theta phases.
  source: Figure S11 legend
  quote: Note close correlation between results obtained from phase offset and time offset
    calculations
  criterion: Pairs whose members are both significantly theta modulated and whose CCG has more
    than 100 events in [-150, 150] ms (Figure S11 legend). For each pair, the preferred phase
    difference converted to time with 1 cycle = 125 ms, against the peak time of the smoothed
    (SD 10 ms) CCG. The paper gives no statistic; "close correlation" is read as a circular-linear
    or, after unwrapping to [-62.5, 62.5] ms, Pearson correlation above 0.5 with p < 0.05 (the
    threshold is not in the paper). Tested on any pair category the dataset holds, CA1-CA1 pairs
    included.
- id: fig5-rate-phase-shift
  statement: As instantaneous firing rate rises, EC2 and CA1 principal cells shift to progressively
    earlier theta phases (by more than 150 degrees), EC2 cells also losing phase locking, while
    DG and CA3 cells shift less than 90 degrees without a change in modulation depth, and EC3
    cells as a population change little.
  source: Results, Rate versus phase relationship, paragraph 1; Figure 5A; Figure S12A
  quote: Firing rate changes were moderately correlated with the preferred phases of DG and CA3
    principal neurons ... In contrast, as firing rate increased, EC2 and CA1 principal neurons
    advanced to progressively earlier phases
  expected:
  - quantity: phase advance of EC2 and of CA1 principal cells from 4 Hz to >= 40 Hz, lower bound
    value: 150
    tolerance: 15
    unit: degrees
  - quantity: phase shift of DG and of CA3 principal cells, upper bound
    value: 90
    tolerance: 9
    unit: degrees
  criterion: Spikes binned by instantaneous rate (1 to >= 10 spikes per 250 ms); per category, cells
    with at least 50 spikes in it and Rayleigh p < 0.01 (Figure 5A legend); group mean preferred
    phase and mean R per category. The shift is the circular difference of group means between
    the 4 Hz and >= 40 Hz categories, a phase advance being a move to earlier phase. Reproduced
    when EC2 and CA1 advance by more than 135 degrees and DG and CA3 shift by less than 99
    degrees. The single-cell shifts of Figure S12A (cells modulated in both categories) are
    reported as a variant. EC2's decreasing R is judged by the sign of the Spearman correlation
    of group R with rate category. Groups the dataset lacks are not testable; CA1 alone is tested
    on its own.
- id: fig5b-burst-double-peak
  statement: Burst spikes (ISI < 6 ms) tend to occupy the same theta phase as fast spikes (>= 40 Hz),
    but in EC2 and CA1 principal cells the burst probability has two small peaks.
  source: Results, Rate versus phase relationship, paragraph 2; Figure 5B; Figure S12B
  quote: bursts tended to occupy similar theta phase as sustained fastfrequency spikes
  criterion: Phase histograms (10 degree bins, all neurons; Figure 5B) of burst spikes (an ISI before
    or after < 6 ms) and of >= 40 Hz spikes. Similar phase is read as circular means within 90
    degrees (the paper's in-phase bound; no threshold given). The double peak has no test in the
    paper; readings (a) two local maxima of the histogram smoothed over 3 bins, separated by at
    least 60 degrees, each above the histogram mean; (b) a two-component von Mises mixture
    preferred over one component by BIC. Reproduced when bursts and fast spikes are within 90
    degrees in every group the dataset holds and CA1 (and EC2, when present) shows two peaks
    under one reading.
- id: figs13-interneuron-rate
  statement: Firing rate and bursting shift interneurons' theta phase only marginally (less than 30
    degrees).
  source: Results, Rate versus phase relationship, paragraph 2; Figure S13
  quote: Firing rate and bursting, in the frequency range similar to principal cells, marginally
    affected the interneuron's spiking phase
  expected:
    quantity: largest group-mean phase shift of interneurons between 4 Hz, >= 40 Hz and burst
      spikes
    value: 30
    tolerance: 3
    unit: degrees
  criterion: As fig5-rate-phase-shift, for interneurons. Reproduced when, in every interneuron group
    the dataset holds, the group mean preferred phases at 4 Hz, >= 40 Hz and for burst spikes
    differ pairwise by less than 33 degrees.
- id: fig6-hippocampal-precession
  statement: Hippocampal principal neurons in all subregions show robust phase precession on the
    linear track, even at peak rates as low as 5 Hz, whereas EC fields with high spatial
    coherence are often but not always associated with precession.
  source: Results, Phase precession in the hippocampus and EC, paragraph 1; Figure 6
  quote: Hippocampal principal neurons in all subregions showed a robust phase precession slope
    (Figures 6H–6J), even at peak firing rates as low as 5 Hz
  criterion: Linear track place fields as in the shared methods. "Robust" has no threshold in
    the paper; it is read as reproduced when, in every
    hippocampal region the dataset holds, more than half of fields with coherence > 0.7 have a
    negative phase-position correlation, and fields with low peak rates do as well. The paper
    names no rate bound beyond "as low as 5 Hz"; readings for low-rate fields (a) peak rate 10 Hz
    or below, (b) peak rate 5 to 7 Hz. The EC part (high-coherence EC fields often but not
    always precess) is reported as the fraction of EC fields with coherence > 0.7 and a negative
    correlation, reproduced when it lies strictly between 0 and 100%. Not testable without
    linear track sessions.
- id: fig7a-precession-strength
  statement: On the linear track, a smaller share of EC place fields than hippocampal place fields
    has spatial coherence above 0.7 (CA1 37.8% of 1169, CA3 32.1% of 106, DG 28.3% of 60, EC2 10%
    of 210, EC3 10.9% of 175, EC5 6.8% of 148); among EC cells EC2 has the highest proportion of
    negatively correlated fields, and all hippocampal regions a higher proportion than EC2.
  source: Results, Phase precession in the hippocampus and EC, paragraph 2; Figure 7A
  quote: Among EC cells, EC2 cells had the highest proportion of ... negatively correlated place
    fields, but neurons in all hippocampal regions had higher proportion of negatively correlated fields
    than EC2 (Figure 7A)
  expected:
  - quantity: CA1 fields with coherence above 0.7
    value: 37.8
    tolerance: 3.8
    unit: percent of 1169 fields
  - quantity: CA1 place fields on the linear track
    value: 1169
    tolerance: 117
  - quantity: CA3 fields with coherence above 0.7
    value: 32.1
    tolerance: 3.2
    unit: percent of 106 fields
  - quantity: DG fields with coherence above 0.7
    value: 28.3
    tolerance: 2.8
    unit: percent of 60 fields
  - quantity: EC2 fields with coherence above 0.7
    value: 10
    tolerance: 1
    unit: percent of 210 fields
  - quantity: EC3 fields with coherence above 0.7
    value: 10.9
    tolerance: 1.1
    unit: percent of 175 fields
  - quantity: EC5 fields with coherence above 0.7
    value: 6.8
    tolerance: 0.7
    unit: percent of 148 fields
  criterion: Fields, coherence and phase-position correlation as in the shared methods, with
    readings O1 for coherence. "Negatively correlated" is not defined further; readings (a) a
    correlation below zero, (b) a correlation below zero with p < 0.05. Reproduced when the
    percentages of the groups the dataset holds are within tolerance and the ordering of
    negatively correlated proportions (each hippocampal region above EC2, EC2 above EC3 and EC5)
    holds under one reading. The percentages and the n above each panel were read from Figure 7A.
- id: figs15-ec3-no-precession
  statement: EC3 principal cells, as a group, show no phase change with position within firing
    fields, while the mean phase shifts in other layers and regions are comparable.
  source: Results, Phase precession in the hippocampus and EC, paragraph 2; Figure S15
  quote: Principal neurons in EC3, as a group, did not show phase changes with position within
    firing fields
  criterion: A claim of absence, judged as Figure S15 shows it. Fields with coherence >= 0.7; mean
    circular phase per 10% segment of each field, then the mean of field means with a 95%
    confidence interval per segment. Reproduced when, for EC3, the confidence intervals of the
    first and last segments overlap, and for the other groups they do not; the size of each
    group's first-to-last shift is given. Not testable without EC3 linear track fields.
- id: fig7b-frequency-shift
  statement: On the linear track the great majority of hippocampal principal cells and a smaller
    fraction of EC principal cells oscillate faster than EC3 theta (positive unit-LFP frequency
    shift); significant theta power was found in 76.2% of 1448 CA1, 72.0% of 239 CA3, 76.8% of 69
    DG, 62.5% of 413 EC2, 28.7% of 397 EC3 and 16.9% of 604 EC5 principal cells.
  source: Results, Phase precession in the hippocampus and EC, paragraph 3; Figure 7B
  quote: the great majority of hippocampal principal cells and a smaller fraction of EC principal
    neurons oscillated faster (frequency shift >0) than the simultaneously recorded EC3 LFP theta
    on the linear track
  expected:
  - quantity: CA1 principal cells with significant theta power, linear track
    value: 76.2
    tolerance: 7.6
    unit: percent of 1448
  - quantity: CA3 principal cells with significant theta power, linear track
    value: 72.0
    tolerance: 7.2
    unit: percent of 239
  - quantity: DG principal cells with significant theta power, linear track
    value: 76.8
    tolerance: 7.7
    unit: percent of 69
  - quantity: EC2 principal cells with significant theta power, linear track
    value: 62.5
    tolerance: 6.3
    unit: percent of 413
  - quantity: EC3 principal cells with significant theta power, linear track
    value: 28.7
    tolerance: 2.9
    unit: percent of 397
  - quantity: EC5 principal cells with significant theta power, linear track
    value: 16.9
    tolerance: 1.7
    unit: percent of 604
  criterion: All spikes of a principal cell in theta epochs of a task; multitaper spectra of spike
    trains and LFP (Jarvis and Mitra, 2001); the shift is the lag of the peak of the
    cross-correlation of the two power spectra over 5-12 Hz (Supplemental Experimental
    Procedures). Significant theta power when the mean integrated power at peak +/- 0.5 Hz is 30%
    above that of both the 4-6 Hz and 12-14 Hz bands (Figure S16 legend). Taper parameters and
    the spectral resolution are not given; readings (a) time-bandwidth 3 with 5 tapers, (b)
    time-bandwidth 5 with 9 tapers, spectra at 0.1 Hz resolution (standard choices). Reproduced
    when the percentages are within tolerance for the groups the dataset holds and more than
    half of the cells with significant theta power in each hippocampal region have a positive
    shift, with smaller fractions in each EC layer. EC3 theta as reference; local theta is a
    variant the paper reports as identical.
- id: figs16-open-field-smallest-shift
  statement: The unit-LFP frequency shift results hold in each task separately, with the smallest
    shift in the open field for every neuron type.
  source: Results, Phase precession in the hippocampus and EC, paragraph 3; Figure S16
  quote: the overall results were the same when data obtained from recordings in the linear track,
    open field, T maze, and rewarded wheel-running task were analyzed separately, with the
    smallest magnitude of the unit-LFP frequency shift present in the open field for all neuron
    types
  criterion: As fig7b-frequency-shift, per task. The magnitude compared is not named; readings (a)
    the median shift of cells with significant theta power, (b) the mean. Reproduced when, under
    one reading, the open field gives the smallest value of the tasks the dataset holds for every
    group. With the open field alone, only the presence of a positive median shift in the open
    field is reported, and the comparison is not testable.
- id: figs18-spike-phase-spectrum
  statement: The spike phase spectrum confirms the unit-LFP frequency comparison, with peaks above 1
    (faster than theta) for phase precessing cells.
  source: Results, Phase precession in the hippocampus and EC, paragraph 3; Figure S17 and S18
  quote: The spike phase spectrum method (Figures 6A, 6F–6J, and S18) confirmed the phase precession
    results obtained by the unit ... versus LFP oscillation frequency comparison
  criterion: EC3 theta phase by the maxima method, unwrapped (jumps of pi or more replaced by their
    2 pi complement), assigned to spikes by linear interpolation; multitaper spectrum of the
    spike train in unwrapped phase; significant when mean power at peak +/- 0.025 is 50% above
    both the 0.5-0.85 and 1.3-1.8 bands (Figure S18 legend). Taper settings open as in
    fig7b-frequency-shift. Reproduced when the fraction of cells with a peak above 1 orders the
    groups as the fraction with a positive shift in fig7b-frequency-shift does, and the cell-wise
    signs agree for most cells significant under both methods.
  depends_on:
  - fig7b-frequency-shift
- id: fig7-ca1-highest-precession
  statement: Only a minority of EC principal cells show high spatial coherence and phase
    precession, while most keep a constant theta phase preference; precession is most prevalent and
    strongest in CA1, and exceptional in EC3.
  source: Results, Phase precession in the hippocampus and EC, paragraph 4; Figure 7
  quote: These findings demonstrate that only a minority of principal cells in the EC show high
    spatial coherence and phase precession, while the majority of neurons keep a constant theta
    phase preference. The highest prevalence and strongest phase precession was observed in the
    CA1 region
  criterion: From the measures of fig7a-precession-strength, fig7b-frequency-shift and
    figs15-ec3-no-precession. "Prevalence" is read as the fraction of principal cells with
    significant theta power and a positive frequency shift (Figure 7B); "strongest" has no
    measure in the paper, readings (a) the most negative median phase-position correlation
    (Figure 7A), (b) the largest median positive frequency shift (Figure 7B). Reproduced when CA1
    is highest in prevalence and, under one reading, in strength among the groups the dataset
    holds; fewer than half of EC fields have coherence > 0.7 and fewer than half of EC principal
    cells have a positive shift (the minority); and EC3 shows no group precession as judged in
    figs15-ec3-no-precession (the paper gives "exceptional" no number and does not compare EC3
    with EC5). With CA1 alone, not testable as a comparison.
  depends_on:
  - fig7a-precession-strength
  - fig7b-frequency-shift
  - figs15-ec3-no-precession
- id: fig8-ec-population-predicts-sinks
  statement: The peak firing of EC3 and EC2 principal populations precedes the theta sinks in CA1
    stratum lacunosum-moleculare and the dentate molecular layer by the delay expected from axon
    conduction (about 30 degrees, about 10 ms), while firing of the target populations is delayed
    by about half a theta cycle.
  source: Figure 8; Discussion, EC contribution to theta LFP, paragraph 1
  quote: Note that while the population peak of an upstream layer correctly predicts the timing of
    the dendritic sink in its target layer, spiking activity in the downstream target population is
    substantially delayed
  data: with_inputs
  criterion: The sink phases come from Montgomery et al. (2009), whose CSD theta traces Figure 8
    shows; the paper names no archive for them. The author pins them if they are public, else
    the claim is blocked. Both must be on the same theta reference; Figure 8 uses EC3 theta for
    units, and how the CSD phases of Montgomery et al. were referred to it is not said (open).
    Population peaks are the maxima of the 10 degree pooled phase histograms of EC2 and EC3
    principal cells (Figure 3A). The expected delay is "within an ~30 degree theta phase delay"
    (Discussion, EC contribution to theta LFP), widened by 10% to 0 to 33 degrees. "Offset by a
    half theta cycle" (Discussion, paragraph 1) has readings (a) the target population peak
    (DG/CA3 for the molecular layer sink, CA1 for the lacunosum-moleculare sink) follows the
    sink by more than 90 degrees, (b) by 180 +/- 45 degrees. Reproduced when both EC peaks
    precede their sinks by 0 to 33 degrees and the targets follow under reading (a); (b) is
    reported.
- id: figs2-ripple-sequence
  statement: During sharp wave ripples, onset and peak delays of principal cells and interneurons
    increase by 15 to 25 ms along the CA1-EC5-EC3-EC2 axis; CA1 pyramidal cells increase firing
    about 6-fold and CA1 interneurons about 3-fold, while EC principal cells are recruited more
    weakly than EC interneurons in every layer.
  source: Figure S2 legend
  quote: Note increasing onset and peak delays of both principal cells and interneurons (15-25 msec)
    in the CA1-EC5-EC3-EC2 axis. Note also a ~6-fold firing increase of CA1 pyramidal cells and
    ~3-fold increase of CA1 interneurons during ripples
  expected:
  - quantity: CA1 pyramidal cell firing increase during ripples
    value: 6
    tolerance: 0.6
    unit: fold
  - quantity: CA1 interneuron firing increase during ripples
    value: 3
    tolerance: 0.3
    unit: fold
  - quantity: delay between successive stages of CA1-EC5-EC3-EC2
    value: 20.5
    tolerance: 7
    unit: ms
  criterion: Ripples in the CA1 pyramidal layer during non-theta periods (140-230 Hz, RMS in 17 ms
    windows, 7 SD threshold), spikes aligned to the ripple power peak, mean rate per group
    (Figure S2 legend). Fold increase is the peak rate over the baseline rate; the baseline
    window is not given, readings (a) -500 to -250 ms, (b) the mean rate outside ripples. The
    delay range 15 to 25 ms widened by 10% of each bound is 13.5 to 27.5 ms. The legend does not
    say whether 15-25 ms is the delay between successive stages or across the whole
    CA1-EC5-EC3-EC2 axis; readings (i) each successive stage peaks 13.5 to 27.5 ms after the one
    before, (ii) EC2 peaks 13.5 to 27.5 ms after CA1 with EC5 and EC3 in order between. Reproduced
    when the CA1 fold increases are within tolerance under one baseline reading and, where EC
    groups are present, the delays hold under (i) or (ii), for peaks and for onsets (onset as the
    first bin above baseline + 2 SD, a standard choice the paper does not state). The weaker
    recruitment of EC principal cells than EC interneurons is judged by fold increase, layer by
    layer, and reported.
- id: figs19-fast-firing-minority
  statement: In each region and layer most principal neurons are silent or fire at low rates, with
    only a minority discharging at high frequency at a given time; in the EC, spikes at high
    firing rates are a minority.
  source: Figure 8 legend; Figure S19 legend
  quote: In each region and layer, most principal neurons are silent or fire at low rates, with only
    a minority of neurons discharging at high frequency at a given time
  criterion: Instantaneous rate per spike as in the shared methods (Figure S19 legend); per
    region, the fraction of principal-cell spikes in theta epochs in each rate category. The
    paper gives "low" and "high" rates no bounds; readings (a) high is the >= 40 Hz category and
    low 4 to 12 Hz, (b) high is >= 20 Hz and low below 20 Hz. Reproduced when, under one reading,
    in every group the dataset holds more spikes fall at low than at high rates, and for EC
    groups the high-rate fraction is below one half (Figure S19 legend, "a minority in the EC").
    The neuron-level part (Figure 8, the proportion of principal neurons significantly modulated
    in each category) is reported.
- id: figs6-identified-cells
  statement: The theta phase distributions of the groups are confirmed when only principal cells and
    interneurons physiologically identified by their monosynaptic interactions are considered.
  source: Results, Theta-phase relationship of entorhinal and hippocampal neurons, paragraph 2;
    Figure S6
  quote: The validity of the phase distribution described above was confirmed when only
    physiologically identified principal cells and interneurons were considered (Figure S6)
  criterion: Cells identified as excitatory or inhibitory by the jitter test of
    fig2c-ec-cell-classes (Figure S6 legend; Table S1 "exciting" and "inhibiting"), or the
    dataset's labels for them. Group phases as in fig3-dg-ca3-precede-ca1, readings (a) and (b),
    computed for identified cells and for all cells of each group. The paper gives no test or
    threshold; "confirmed" is read as each group's circular mean preferred phase in identified
    cells within 45 degrees (reading i) or 90 degrees (reading ii, the paper's in-phase bound) of
    that in all cells, and the same group order of phases. Reproduced when (ii) holds for every
    group the dataset can test; (i) is reported. Not testable without identified cells.
  depends_on:
  - fig2c-ec-cell-classes
- id: figs7-individual-rats
  statement: The theta phase preferences of the neuron groups are consistent across individual rats.
  source: Results, Theta-phase relationship of entorhinal and hippocampal neurons, paragraph 2;
    Figure S7
  quote: and when neuron groups from individual rats were examined separately (Figure S7)
  criterion: Significantly modulated cells (at least 50 spikes, rate > 0.1 Hz, Rayleigh p < 0.01;
    Figure S7 legend) per group and rat, rats ec12 and i01 pooled as the legend shows them, EC3
    theta as reference except CA1 pyramidal layer theta in i01 (Figure S7 legend). The paper gives
    no threshold; readings as in figs8-task-invariance, (a) circular mean preferred phases within
    45 degrees between rats, (b) within 90 degrees. Reproduced when (b) holds for every group
    recorded in at least two rats; (a) is reported. Not testable with one rat per group.
- id: figs12b-burst-single-phase
  statement: Burst spikes (ISI < 6 ms) and single spikes (ISI > 20 ms) have different theta phase
    preferences in a significant number of CA1 and EC2 principal neurons.
  source: Figure S12B legend; Results, Rate versus phase relationship, paragraph 2
  quote: Note that bursting spikes (ISI < 6 msec) and single spikes (ISI > 20 msec) have different
    phase preferences in a significant number of neurons in CA1 and EC2
  criterion: Principal cells significantly modulated in both spike groups (at least 50 spikes in
    each, Rayleigh p < 0.01; Figure S12 legend); burst spikes have an ISI before or after under 6
    ms, single spikes both ISIs over 20 ms (Supplemental Experimental Procedures). The paper
    gives no test or count. Per cell, the burst and single-spike phases differ when (a) their
    circular difference exceeds 90 degrees (the paper's in-phase bound), (b) a Watson-Williams
    test of the two spike groups gives p < 0.05. "A significant number" is read as a binomial test
    of the count of differing cells against 5% at p < 0.05. Reproduced when it holds in CA1, and
    in EC2 when present, under one reading.
- id: discussion-ec-interneurons-with-ec2
  statement: Most EC2 interneurons and a large proportion of EC3 interneurons fire in phase with EC2
    principal (stellate) cells.
  source: Discussion, EC contribution to theta LFP, paragraph 2; Figure 3B, 3C, 3F and 3G
  quote: Most EC2 interneurons and a large proportion of EC3 interneurons fired in phase with EC2
    stellate cells
  criterion: Significantly modulated cells as in the shared methods, EC3 theta reference. "In
    phase" is read with the paper's bound, a preferred phase within 90 degrees of the circular
    mean preferred phase of significantly modulated EC2 principal cells (Results, "in phase
    (<90° shift"). Reproduced when more than half of EC2 interneurons are in phase and the EC3
    fraction is "large", read as (a) at least a third, (b) at least a quarter (no number in the
    paper). Not testable without EC2 principal cells and EC interneurons.
