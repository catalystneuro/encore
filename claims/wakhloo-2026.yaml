- id: late-trends-match-optimal
  statement: Once behavioural and readout errors plateau at session four, the dimensionality
    measures and SSF increase while the neural-latent correlation decreases, as predicted for
    optimal representations late in learning.
  source: Results, Geometry of spatial representations in prefrontal cortex and CA1 during
    learning, paragraph 3; Discussion, paragraph 5
  quote: Once the readout and behavioral errors begin to plateau at session four, we find that
    the ensuing trends are consistent with our predictions for optimal representations ... the
    dimensionality measures and SSF increase over learning, whereas the neural–latent
    correlation decreases
  depends_on:
  - fig7d-behavioral-error-learning
  - fig7h-task-dimension-increases
  criterion: Total dimension, task-relevant dimension, SSF and correlation per rat and session
    from the shared pipeline, mean over rats, from session 4 to session 8, with the two
    readings of fig7-late-reversal (session 8 against session 4; the sign of a linear
    mixed-effects slope over sessions 4 to 8). Reproduced in an area when, under a reading,
    both dimension measures and SSF rise and the correlation falls; reproduced when it holds
    in both areas, partially in one.
- id: glm-cross-validated-d2
  statement: The Poisson GLMs reach an average cross-validated population D2 of 0.29 in PFC and
    0.25 in CA1, with a standard deviation across rats of the session-averaged D2 of 0.022 in
    PFC and 0.1 in CA1.
  source: Methods, Generalized linear model analysis, paragraph 2
  quote: The average cross-validated population D 2 across all sessions and rats was 0.29 in PFC
    and 0.25 in CA1, and the standard deviation of the session-averaged population D 2 across
    rats was 0.022 in PFC and 0.1 in CA1
  expected:
  - quantity: mean cross-validated population D2, PFC
    value: 0.29
    tolerance: 0.029
  - quantity: mean cross-validated population D2, CA1
    value: 0.25
    tolerance: 0.025
  - quantity: standard deviation across rats of session-averaged D2, PFC
    value: 0.022
    tolerance: 0.0022
  - quantity: standard deviation across rats of session-averaged D2, CA1
    value: 0.1
    tolerance: 0.01
  criterion: GLMs as in the shared pipeline with the code's chosen basis. A session's
    population D2 is the mean over its units of each unit's best mean 10-fold
    cross-validated D2 (rat_utils.format_glm_results, test_scores); the mean is over the 64
    rat and session values. The code does not compute the standard deviation; the readings are
    the population (ddof 0) and the sample (ddof 1) standard deviation over the 8 rats of each
    rat's mean over sessions. Whether units later replaced by the null model are counted with
    their own negative D2 (as test_scores does) or with 0 is a further pair of readings.
    Reproduced when all four values are within tolerance under one combination of readings.
    The cross-validation folds are random and the GLM fit may differ slightly from the
    paper's; the seed is a standard choice.
