- id: mixed-linear-ssf-task-dim
  statement: Linear mixed-effects models show significant monotonic effects of learning on SSF
    (P < 10^-3) and on the task-relevant dimension (P < 10^-5) in both PFC and CA1.
  source: Results, Geometry of spatial representations in prefrontal cortex and CA1 during
    learning, paragraph 2; Supplementary Table 2 (not read)
  quote: which demonstrated significant, monotonic effects of learning on the SSF and
    task-relevant dimension across both regions ( P < 10 −3 SSF and P < 10 −5 task dimension;
    Supplementary Table 2 )
  statistics:
