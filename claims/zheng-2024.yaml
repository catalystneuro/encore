    tolerance: 0.017
  - quantity: fraction of familiar sessions with significant co-switching OFF
    value: 0.2
    tolerance: 0.02
  - quantity: fraction of novel sessions with significant co-switching ON
    value: 0.57
    tolerance: 0.057
  - quantity: fraction of novel sessions with significant co-switching OFF
    value: 0.29
