# Claims for Zheng, Huszar, Hainmueller, Bartos, Williams and Buzsaki (2024), Perpetual step-like
# restructuring of hippocampal circuit dynamics, Cell Reports 43, 114702, tested on dandiset 000552.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-20,
# protocol pilot-18 as stated in docs/protocol.md. The writer did not look at the dandiset's data or
# files; the paper names it as the deposit of its electrophysiological data ("High density CA1
# recordings on a figure-8 maze", Huszar et al. 2022, doi:10.48324/dandi.000552/0.230630.2304).
#
# Text read: the author manuscript in PubMed Central (PMC11485410, NIHMS2025365), full text with
# STAR Methods and the main figure legends (Figure 6's legend is printed after the Methods), and the
# supplemental information of the version of record (mmc2.pdf, pages 23 to 44, Figures S1 to S15
# with legends), both in paper/10.1016-j.celrep.2024.114702.txt. Values printed only inside figure
# panels were not read.
#
# Code read: the paper's Zenodo deposit doi:10.5281/zenodo.13247193, which is
# github.com/samdeoxys1/within-session-representationl-drift tag v0.0 (archive folder
# samdeoxys1-within-session-representationl-drift-93d6e33). It holds the per-session scripts
# (place_variability/code: rate maps fr_map_one_session.py, place fields pf_one_session.py and
# pf_recombine_central.py, switch detection switch_detection_one_session.py and test_change_point.py,
# step against gradual step_vs_gradual_analysis.py, PV correlation pv_corr_analysis.py, the GLM
# behavior_and_switching.py, co-switching test_co_switch.py), shared modules (util_code:
# data_prep_pyn.py, place_field_analysis.py, place_cell_analysis.py, process_central_arm.py;
# nmf_analysis: change_point_analysis.py), the imaging scripts (place_variability/code/thomas_18_data)
# and the figure notebooks with stored outputs (place_variability/jupyter). Not in it: the session
# database (database.csv) and the intermediate pickles. Below, "code" means this repository.
#
# Data the paper used. Electrophysiology (the dandiset): chronic silicon probe recordings in dorsal
# CA1 of 11 mice (C57BL/6J, in utero electroporated with ChR2 in a sparse subset of pyramidal cells,
# Huszar et al. 2022) running a spontaneous alternation task on a 79 x 79 cm figure-8 maze, with a 5
# s delay in the start area; LED position tracked at 30 Hz; homecage sleep before and after. A subset
# of 3 mice also ran, on the same day, in a novel environment (two distinct linear mazes and a
# different figure-8 maze). Sessions were kept with at least 20 trials, 7 trials per turn and 50
# putative pyramidal cells: 46 familiar sessions and 8 novel sessions (one novel session left out
# of the co-switching analysis for too few trials). Measured variables used: spike times of
# putative pyramidal cells and interneurons (cell type labels), linearised position, trial
# boundaries, turn (visited arm) and correct/incorrect choice per trial, light-responsive
# (opto-tagged) cells, NREM firing rates, spike waveforms in pre- and post-task sleep. The code's
# stored outputs (fig1 notebook, [figure] gradual vs sudden change and others) list the 46 familiar
# sessions: e13_16f1 (210302, 0312, 0314, 0317, 0319, 0322, 0328, 0331), e13_26m1 (210913, 211019,
# 211116, 211119, 211124), e14_2m2 (201017, 1019), e14_2m3 (201118, 1121, 1125, 1129, 1206, 1208),
# e15_10m1 (200727, 0803, 0809, 0812), e15_13f1 (220117, 0118, 0119, 0120), e15_9f1 (200715, 0720,
# 0723, 0729, 0802), e16_1f1 (200918, 0919, 0920, 0923, 1004), e16_2m1 (201121), e16_3m1 (210119,
# 0201, 0203), e16_3m2 (211210, 1212, 1213); the 8 novel sessions are the second maze task of
# e13_26m1_211019, 211116, 211119, e15_13f1_220118, 220119, 220120, e16_3m2_211212, 211213 (5 of
# them a linear maze). In the code "novel" is the session's second maze task (task_index 1).
# Two-photon calcium imaging (Figure 7, Figure S15): 14 experiments in 11 PV-Cre x Ai9 mice
# (Hainmueller and Bartos 2018) on a virtual linear track over two days; not deposited, available
# from M. Bartos on request (Data and code availability). Those claims cannot be tested here.
#
# Method details fixed from the Methods and the code, used by several criteria:
# - Trials and turns. A trial is one traversal of the maze; on the figure-8 maze trials are split by
#   turn (the visited arm), on the linear maze by running direction (Methods, Place field
#   detection, paragraph 2; code util_code/data_prep_pyn.py, group_into_trialtype, which takes
#   behavior.trials.visitedArm for alternation and behavior.masks.direction for linearMaze).
# - Rate maps. Forward locomotion only (Methods, Behavior segmentation: immobility is speed < 1
#   cm/s, head scans excluded; code: directed_locomotion, smoothed directed speed > 1 cm/s and on
#   the track); 2.2 cm bins of linearised position; spike counts and occupancy each smoothed with
#   a Gaussian of standard deviation 2.5 bins, then divided (Methods, Ratemap calculation).
# - Place fields. Spike trains circularly shifted against position 1000 times; a field is a
#   contiguous run of bins where the trial-averaged rate map exceeds the 95th percentile of the
#   shuffles, 4 to 30 bins wide, with peak rate above 1 Hz (Methods, Place field detection). The
#   code measures width as end minus start, so 5 to 31 bins inclusive (util_code/
#   place_field_analysis.py, detect_significant_segments). Fields on the central arm whose peaks
#   for the two turns are less than 5 bins apart and whose per-trial peak rates do not differ by an
#   independent t-test are merged into one field over all trials; others are splitter or
#   turn-specific fields (Methods; code util_code/process_central_arm.py, combine_pf_res). A place
#   cell is a pyramidal cell with at least one field (code, compare amplitude change and location
#   drift notebook). The per-trial value of a field is the peak of that trial's rate map within
#   the field.
# - Switch detection (Methods, Detection of discrete switching). Optimal partitioning (ruptures
#   Dynp, l2 cost, minimum segment length 2) on the per-trial peak rate of each field; the trial
#   order permuted 1000 times; K from 1 to min(5, floor(trials/4)); p for each K is the fraction
#   of shuffles with lower cost than the data; Bonferroni over the K values at 0.05; the best K is
#   the one with the lowest percentile. Change points whose step is under 40% of "the max firing
#   rate across trials" are dropped. The code normalises the fitted step function by its own
#   maximum and calls a rise of more than 0.4 between consecutive trials a switch ON, a fall a
#   switch OFF (nmf_analysis/change_point_analysis.py, detect_switch_pwc); dividing by the maximum
#   of the raw per-trial peak rates is the other reading of the Methods, shown as a variant.
#   Shuffle seed fixed at 123 in the code (a standard choice that cannot change the outcome).
schema_version: 2
paper: doi:10.1016/j.celrep.2024.114702
claims:
- id: fig1d-pv-decorrelation
  statement: The correlation between population vectors of place cells decreases with the lag
    between trials, in both familiar and novel environments (within-session drift).
  source: Results, Within-session representational drift, paragraph 1; Figure 1C and 1D
  quote: The correlation decreased as a function of the lag between trials, suggesting drift within
    both the familiar and the novel environment
  criterion: Per session and turn (figure-8) or direction (linear maze), the population vector of
    a trial is the concatenation of the place cells' trial rate maps (Figure 1C legend; code
    compare amplitude change and location drift notebook, raw rates, place cells only); Pearson
    correlation between every pair of trials. The slope of correlation on lag is fitted by linear
    regression over all trial pairs with lags 1 to 10 (code pv_corr_analysis.py,
    get_decay_slope_linregress). The paper reports no test of the decrease itself; its default
    one-sample test is the two-sided Wilcoxon signed-rank test (STAR Methods, Quantification and
    statistical analysis). Reproduced when the slopes are below zero by that test at p < 0.05 in
    familiar and in novel units separately; partially reproduced when this holds in one
    environment only.
- id: fig1e-novel-drift-faster
  statement: Over trial lags 1 to 10, population vectors decorrelate faster (a more negative slope)
    in novel than in familiar environments.
  source: Results, Within-session representational drift, paragraph 1; Figure 1E
  quote: Linear regression revealed that drift was significantly faster in novel environments
    (larger negative slope) within the first 1-10 trial lags
  statistics:
  - test: Wilcoxon rank-sum test
    p: 0.02
    statistic: Cohen's d = 0.58
    n: 106 session and turn units
  expected:
  - quantity: number of session and turn units, lags 1 to 10
    value: 106
    tolerance: 10.6
  - quantity: Cohen's d, familiar against novel slopes, lags 1 to 10
    value: 0.58
    tolerance: 0.058
  depends_on:
  - fig1d-pv-decorrelation
  criterion: Slopes as in fig1d-pv-decorrelation, one per session and turn or direction, from
    lags 1 to 10 (the code requires at least 5 lags in the window). Familiar against novel slopes
    by a two-sided Wilcoxon rank-sum test (Figure 1E legend). Reproduced when p < 0.05 with the
    novel slopes more negative; Cohen's d is reported against the expected value, signed so
    that a more negative novel slope gives a positive d (the legend does not give the order of
    the groups; this is the order that matches the text).
- id: fig1e-later-lags-no-difference
  statement: Over trial lags 11 to 20 and 21 to 30 no significant difference in decorrelation slope
    between novel and familiar environments was detected.
  source: Results, Within-session representational drift, paragraph 1; Figure 1E
  quote: we failed to detect a significant difference between novel and familiar environments over a
    range of 11-20 or 21-30 trial lags
  statistics:
  - about: lags 11 to 20
    test: Wilcoxon rank-sum test
    p: 0.3
    statistic: Cohen's d = 0.54
    n: 26 session and turn units
  - about: lags 21 to 30
    test: Wilcoxon rank-sum test
    p: 0.68
    statistic: Cohen's d = -0.35
    n: 8 session and turn units
  depends_on:
  - fig1d-pv-decorrelation
  criterion: A claim of absence. Slopes as in fig1e-novel-drift-faster over lags 11 to 20 and 21
    to 30 (units with at least 5 lags in the window, as in the code), familiar against novel by a
    two-sided Wilcoxon rank-sum test. Reproduced when p >= 0.05 for both windows; not reproduced
    when either is significant. The numbers of units and Cohen's d are reported.
- id: fig1h-rate-decorrelates-location-stable
  statement: The vector of within-field peak firing rates of all place fields decorrelates with
    trial lag, whereas the vector of field peak locations stays correlated.
  source: Results, Within-session representational drift, paragraph 2; Figure 1G and 1H
  quote: We found the vector of the peak firing rate of all place fields decorrelated as a function of
    trial lag, whereas the vector of the field locations remained stable
  criterion: Per session and environment, the vector over place fields of each trial's peak rate,
    and of each trial's peak location, correlated (Pearson) between trial pairs and averaged per
    lag (Figure 1G legend; code compare amplitude change and location drift notebook,
    get_plot_pf_param_population_corr_vs_lag, which concatenates the two turns aligned by
    within-turn trial index). The paper reports no test; the slope of correlation on lag per
    session is fitted by linear regression, as for Figure 1E, and slopes are tested against zero
    by the two-sided Wilcoxon signed-rank test (STAR Methods default). Reproduced when the
    peak-rate slopes are negative at p < 0.05 and the median peak-rate slope is at least twice
    as steep as the median location slope; the threshold of two is chosen here, as the paper
    states the contrast in words only, and both medians are reported.
- id: fig1i-location-mse-increases
  statement: The mean squared distance between field-location vectors still increases
    significantly with trial lag, so field locations do change.
  source: Results, Within-session representational drift, paragraph 2; Figure 1I
  quote: In fact, the average squared Euclidean distance as a function of trial lag increased
    significantly
  depends_on:
  - fig1h-rate-decorrelates-location-stable
  criterion: Squared Euclidean distance between the field-location vectors of two trials divided
    by the number of fields (Figure 1I legend; code nan_euclidean_distances squared over n_fields),
    averaged per lag. The paper names no test and the code has none. Readings; (a) per session,
    the slope of the distance on lag (lags 1 to 10) by linear regression, tested against zero by
    the two-sided Wilcoxon signed-rank test (STAR Methods default); (b) an ordinary least squares
    regression of the median over sessions on lag, as in the code's tentative statistics cell.
    Reproduced when the increase is significant at p < 0.05 under a reading.
