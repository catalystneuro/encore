- id: fig6-co-switching
  statement: Place fields co-switch on the same trial more than expected by chance in a subset of
    sessions, 17% (ON) and 20% (OFF) of familiar and 57% (ON) and 29% (OFF) of novel sessions.
  source: Results, Switching, neuron or circuit property, paragraph 3; Figure 6D and 6E
  quote: found that 17% (20%) of the familiar sessions and 57% (29%) of the novel sessions showed at
    least one trial with significant co-switching ON (OFF)
  expected:
  - quantity: fraction of familiar sessions with significant co-switching ON
