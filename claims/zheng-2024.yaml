    switch time (Figure S1 legend); post minus pre amplitude pooled over neighbours, two-sided
    Wilcoxon signed-rank test against zero, for ON and OFF. The switch time is the time of the
    switch trial; the paper does not say which moment of the trial (readings; its start, or the
    animal's entry into the field). Reproduced when neither test gives p < 0.05; the median
