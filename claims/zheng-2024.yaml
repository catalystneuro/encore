    gen_circular_shuffle, which leaves out the first two trials and the last). The statistic is
    the number of field pairs that co-switch ON (OFF). Readings of "at least one trial with
    significant co-switching"; (a) per session, the number of co-switching pairs over all trials
    exceeds the shuffle at p < 0.05 (fraction of shuffles at or above the data; code
