- id: figs1-not-electrode-drift
  statement: Spike amplitudes of neighbouring neurons recorded on the same shank as a switching
    neuron do not change across its switch, arguing against electrode drift.
  source: Results, Within-session representational drift, paragraph 4; Figure S1H
  quote: Finally, neurons recorded on the same site with a switching neuron had unchanged waveforms
