- id: ed10b-layers
  statement: Compared with deep layers (5 and 6), superficial layers (2/3 and 4) have an earlier
    time to first spike, smaller receptive fields, a higher modulation index and a faster response
    decay timescale.
  source: Extended Data Fig. 10b legend; Results, A functional hierarchy of visual areas,
    paragraph 5
  quote: On average, in comparison to deep layers (5 and 6), superficial layers (2/3 and 4) had an
    earlier time to first spike (2.59 ms difference, P = 2.7 × 10 −19 , two-sided Wilcoxon
    rank-sum test), smaller receptive fields (109° difference, P = 1.1 × 10 −33 ), higher
    modulation index (0.09 MI difference, P = 5.0 × 10 −23 ), and faster response decay timescale
    (6.6 ms difference, P = 3.8 × 10 −33 )
  statistics:
  - about: time to first spike, superficial against deep
    test: two-sided Wilcoxon rank-sum test
    p: 2.7e-19
  - about: receptive field area, superficial against deep
    test: two-sided Wilcoxon rank-sum test
    p: 1.1e-33
  - about: modulation index, superficial against deep
    test: two-sided Wilcoxon rank-sum test
    p: 5.0e-23
  - about: response decay timescale, superficial against deep
    test: two-sided Wilcoxon rank-sum test
    p: 3.8e-33
  data: elsewhere
  where: DANDI:000021 and DANDI:000022 (the paper's Data availability)
  depends_on:
  - fig3c-latency-hierarchy
  - fig3f-rf-size-hierarchy
  - fig3i-modulation-index-hierarchy
  - fig3l-response-decay-timescale-hierarchy
  expected:
  - quantity: time to first spike, deep minus superficial
    value: 2.59
    tolerance: 0.259
    unit: ms
  - quantity: receptive field area, deep minus superficial
    value: 109
    tolerance: 10.9
    unit: deg2
  - quantity: modulation index, superficial minus deep
    value: 0.09
    tolerance: 0.009
  - quantity: response decay timescale, deep minus superficial
    value: 6.6
    tolerance: 0.66
    unit: ms
  criterion: As the significance block of ExtDataFigure10/ExtDataFigure10.py computes it. Units
    with p_value_rf < 0.01, cortical_depth > 0, area_rf < 2500, snr > 1 and firing_rate_dg > 0.1,
    with the cumulative cuts of the four Figure 3 metrics (flash time to first spike < 100 ms
    for all four; the timescale limits of fig3l-response-decay-timescale-hierarchy for the
    last), layers from the CCF labels (data/layer_info.csv). In that block the per-area line is
    commented out, so all cortical units with a depth are pooled, not only the six areas; the
