  where: GitHub AllenInstitute/neuropixels_platform_paper, commit 4f8bcc26fa6fbec1ae687c650bacc9ea67a7036d, data/change_modulation_data.csv
  criterion: As Figure4/Figure4.py computes it from the paper's metrics table, the mean of 'Time
