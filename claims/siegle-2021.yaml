    test: Pearson correlation
    statistic: r = 0.57
    p: 0.14
    n: 8 areas
  - about: spontaneous time to first spike against baseline firing rate
    test: Pearson correlation
    statistic: r = -0.98
    p: 0.00001
    n: 8 areas
  data: elsewhere
  where: DANDI:000021 and DANDI:000022 (the paper's Data availability)
  depends_on:
