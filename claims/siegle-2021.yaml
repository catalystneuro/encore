# Claims for Siegle, Jia et al. (2021), "Survey of spiking in the mouse visual system reveals
# functional hierarchy", Nature 592, 86-92, on dandiset 000253.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the NIH author manuscript in PubMed Central (PMC10399640, NIHMS1920814), as served
# by NCBI PMC (paper/10.1038-s41586-020-03171-x.txt). It holds the main text, the Methods, the
# legends of Figures 1 to 4 and of Extended Data Figures 1 to 10, and the data and code
# availability statements. The version of record was not read. No PDF was available, so no
# figure was seen: numbers shown only in figures (the p-value matrices of Extended Data Fig. 9,
# the matrices of Extended Data Fig. 7c and 10d, the bars of Fig. 1g) could not be read. The
# Supplementary Information of the version of record is not in the text; the results rest on the
# main text, Methods and Extended Data, which are present.
#
# Code read: github.com/AllenInstitute/neuropixels_platform_paper at commit
# 4f8bcc26fa6fbec1ae687c650bacc9ea67a7036d (the figure code the paper links). It holds one folder
# per figure (Figure1 to Figure4, ExtDataFigure1, 4 and 10), common/create_units_table.py (the
# unit table built from AllenSDK metrics plus data/time_to_first_spike.csv, data/layer_info.csv
# and data/timescale_metrics.csv), functions for time to first spike, modulation index and
# exponential fits, the precomputed CCG matrices of Fig. 2 (data/processed_data/*.npy), and the
# per-unit and per-session metrics of the behaviour experiments (data/change_modulation_data.csv,
# data/decoding_data.csv, data/decoder_accuracy_vs_number_of_cells.csv). Figure2/compute_ccg.ipynb
# calls get_ccgjitter from github.com/jiaxx/ccg_jitter (read at commit
# 6559a4dfbc13f8e2ac8441a881bc8768bd6363a1). Unit metrics (p_value_rf, area_rf, mod_idx_dg,
# firing_rate_dg, snr) come from the AllenSDK, which the paper names as the code for stimulus
# metrics. Choices the code settles are said in each criterion.
#
# The anatomical hierarchy scores are an outside input, recomputed in the paper from the
# connectivity data of ref. 3 (Harris et al. 2019, doi:10.1038/s41586-019-1716-z). The text
# gives only their order; the values are fixed in Figure3/Figure3.py and Figure4/Figure4.py:
# LGN -0.515, V1 -0.357, LM -0.093, RL -0.059, LP 0.105, AL 0.152, PM 0.327, AM 0.441. Every
# correlation with hierarchy below uses these eight values.
#
# Data the paper used. 58 passive viewing experiments (one session per mouse) passed quality
# control out of 87 mice entering recording: C57BL/6J wild type (n = 30), Pvalb-IRES-Cre x Ai32
# (8), Sst-IRES-Cre x Ai32 (12) and Vip-IRES-Cre x Ai32 (8). Up to six Neuropixels probes per
# mouse targeted V1, LM, AL, RL, PM and AM and reached LGN (LGd) and LP; units were sorted with
# Kilosort2 and mapped to CCFv3 structures. Each session began with receptive field mapping
# (Gabor patches of drifting gratings at 81 locations, 250 ms each) and full-field dark or light
# flashes (250 ms, 2 s interval), followed by one of two stimulus sets, "Brain Observatory 1.1"
# (drifting gratings at 8 directions and 5 temporal frequencies, static gratings, natural
# scenes, natural movies) or "Functional Connectivity" (drifting gratings at 4 directions, 2 Hz,
# 75 repeats; contrast tuning; natural movie; dot motion; a 30 min grey screen of spontaneous
# activity). The CCG analyses use 25 mice. Measured variables are spike times per unit, unit
# quality metrics, stimulus tables, running speed and eye tracking. Separately, 12 mice in 21
# sessions performed a go/no-go visual change detection task with natural images (n = 4,057
# units), followed by passive replay of the same image sequence.
#
# Where the data are. The paper deposits the 58 passive viewing experiments (Figs. 1 to 3) on
# DANDI as dandisets 000021 and 000022 and via the AllenSDK; the metrics table of the behaviour
# experiments (Fig. 4e to h) is in the paper's GitHub repository; the raw behaviour sessions
# are not said to be deposited anywhere. Dandiset 000253 is, by its archive title and
# description, the "Allen Institute Openscope - Global/Local Oddball project", an OpenScope
# predictive coding experiment (14 subjects, Neuropixels with optogenetics) recorded on the same
# platform; it cites this paper as IsSupplementTo. Its title and description do not describe the
# experiments of this paper. So every claim's data are recorded below as the paper gives them
# (`elsewhere` with the archive, or `dataset` where the paper names no deposit), and whether
# 000253 holds the same kind of recordings (the same receptive field mapping and flash stimuli,
# the same areas) is for the author to find (author, step 4).
schema_version: 2
