  source: Supplemental Results 1.1, paragraph 1
  quote: by age (p = .67), but were faster for faces than for houses (944 vs 1028 ms
  statistics:
  - about: category
    test: mixed-effects model, Wald chi-square
    statistic: χ2(1) = 78.3
    p: 0.001
    p_relation: "<"
  - about: age
    test: mixed-effects model, Wald chi-square
    p: 0.67
  - about: age by category interaction
    test: mixed-effects model, Wald chi-square
    p: 0.98
  expected:
  - quantity: median RT, faces
    value: 944
    tolerance: 94.4
    unit: ms
  - quantity: median RT, houses
    value: 1028
    tolerance: 102.8
    unit: ms
  criterion: Per participant, median RT of correct trials in each cell of current category by
