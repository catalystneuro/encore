    44, -14].
  source: Results, paragraph 10; Figure 3E; Table S1
  quote: a voxel-wise conjunction analysis on the information maps of hidden state components
    confirmed that, across participants, only medial OFC activity carried complete information
    about all three hidden state components
  statistics:
  - test: voxel-wise conjunction, uncorrected
    statistic: Zpeak = 3.14
    p: 0.01
    p_relation: "<"
    n: 27 participants
  expected:
    quantity: conjunction peak Z
    value: 3.14
    tolerance: 0.314
  criterion: Needs whole-brain data in MNI space (16-way searchlight, component maps, group
    t-tests, conjunction at p < 0.01 uncorrected per component, minimum cluster 5 voxels),
    which the data set's description does not list; it holds OFC voxels in native space only.
    The searchlight radius is not given (open).
- id: other-rois-incomplete
  statement: Hippocampus, DLPFC and FFA/PPA code current and previous category but not previous
    age, and show neither complete nor task-specific encoding; decoding there is not related to
    error rates or behavior as it is in OFC, except a weaker relation in PPA/FFA.
  source: Results, paragraphs 10, 11 and 15; Figure S2D to S2F
  quote: None of these areas showed either complete encoding of all hidden state components nor
    specific encoding of only task-relevant variables
  statistics:
  - about: correlation of decoding with error rate, PPA/FFA
    test: Pearson correlation
    statistic: r = -0.40, t25 = -2.2
    p: 0.03
  - about: correlation of decoding with error rate, hippocampus and DLPFC
    test: Pearson correlation
    p: 0.14
    p_relation: ">"
  - about: similarity and error rate, hippocampus, DLPFC, FFA/PPA
    p: 0.17
    p_relation: ">"
  criterion: Needs the hippocampus, DLPFC and PPA/FFA ROIs (AAL labels, Methods), which the data
    set's description does not list.
- id: fig4a-decoding-error-correlation
  statement: Across participants, mean classification accuracy of the three hidden components in
    OFC correlates negatively with error rate.
  source: Results, paragraph 11; Figure 4A; Figure S4
  quote: participants’ average error rates were significantlycorrelated with themean
    classificationaccuracyofallthree hidden state components
  statistics:
  - test: Pearson correlation
    statistic: r = -0.58, t25 = -3.6
    p: 0.002
    ci:
      level: 0.95
      low: -0.8432
      high: -0.0169
    n: 27 participants
  depends_on:
  - fig2b-hidden-components
  expected:
    quantity: Pearson r, error rate against mean hidden-component accuracy
    value: -0.58
    tolerance: 0.2632
  criterion: Per participant, the mean of the three hidden-component accuracies of
    fig2b-hidden-components and the scanner error rate of behavior-error-rate; Pearson
    correlation, and a bootstrap 95% CI over participants with the boot package defaults. The
    number of bootstrap iterations is given as 10,000 (Methods) and 1000 (Supplemental Results
    1.4, Figure S4); both are run. The tolerance is the distance from r to the nearer bound of
    the paper's CI. Reproduced when r is negative with p < 0.05 and within tolerance;
    partially reproduced when r lies inside the paper's CI but outside the tolerance. The data
    set holds 24 of the 27 participants.
- id: fig4b-error-trial-drop
  statement: Trial-wise 16-way decoding is lower on error trials (4.2%) than in the five trials
    preceding an error (11%).
  source: Results, paragraph 12; Figure 4B
  quote: incorrect responses were accompanied by worse classification—the average 16-way
    classification in the five trials preceding an error was 11% whereas accuracy was only 4.2%
    on error trials (t23 = 2.2, p = 0.04
  statistics:
  - test: t-test
    statistic: t23 = 2.2
    p: 0.04
    n: 24 participants
  depends_on:
  - fig2a-16way-decoding
  expected:
  - quantity: 16-way accuracy, five trials before an error
    value: 11
    tolerance: 1.1
    unit: percent
  - quantity: 16-way accuracy, error trials
    value: 4.2
    tolerance: 0.42
    unit: percent
  criterion: Trial-wise test data as the Methods fix it (raw time series smoothed at FWHM 3 mm,
    z-scored per run, the volume 2 TRs after stimulus onset, 4.8 to 7.2 s), classified by the
    classifier trained on the other runs in fig2a-16way-decoding. The true state of an error
    trial is the state the task rules assign to it; how it is reconstructed is not stated, and
    the reading is from the trial sequence. Errors whose five preceding trials do not lie in
    the run are left out (Methods, Participants). Per participant, mean accuracy over the five
    preceding trials and over error trials; paired t-test, two-sided. Reproduced when both
    values are within tolerance and the difference has p < 0.05; partially reproduced when the
    difference holds but a value is outside tolerance. Which volume is "2 TRs after onset" is
    open; readings are the first volume acquired at or after onset plus 4.8 s, and the volume
    nearest onset plus 4.8 s.
- id: fig4b-decline-before-errors
  statement: Decoding accuracy declines linearly over the trials leading up to and including an
    error, and no such decline is seen in matched time courses without errors.
  source: Results, paragraph 12; Figure 4B
  quote: there was a negative linear effect of trial on decoding in the trials leading up to and
    including an error ... No such decrease was detected in matched decoding time-courses that
    did not include errors
  statistics:
  - about: linear effect of trial, error time courses
    test: mixed-effects model, Wald chi-square
    statistic: χ2(1) = 4.7
    p: 0.03
  - about: condition by trial interaction
    test: mixed-effects model, Wald chi-square
    statistic: χ2(1) = 4.3
    p: 0.04
  - about: linear effect of trial, non-error time courses
    test: mixed-effects model, Wald chi-square
    p: 0.33
  depends_on:
  - fig4b-error-trial-drop
  criterion: Trial-wise accuracy as in fig4b-error-trial-drop for trials -5 to 0 around each
    error; a mixed-effects model of classifier accuracy on trial number relative to the
    error, participants as random effect on intercept and slope, Wald chi-square. Matched
    courses are seven consecutive trials without errors (Figure 4B legend); how they are
    chosen is open, with readings (a) every non-overlapping run of seven correct trials, (b)
    one such run per error from the same run. The interaction is condition by trial in a joint
    model. Whether accuracy enters as 0 or 1 per trial or as a mean per participant and
    position is open; both are run. Reproduced when under one reading the error slope is
    negative with p < 0.05, the interaction has p < 0.05, and the non-error slope has p >
    0.05.
- id: fig4b-error-vs-matched
  statement: Decoding on the error trial is lower than on matched correct trials, and marginally
    lower on the trial before the error.
  source: Results, paragraph 13; Figure 4B
  quote: decoding in the error trial was significantly lower than decoding in the matched correct
    trials (trial ‘‘0’’ in the figure; t24 = 2.3, p = 0.01) and marginally lower in the trial
    prior to the error
  statistics:
  - about: trial 0
    test: t-test
    statistic: t24 = 2.3
    p: 0.01
  - about: trial -1
    test: t-test
    statistic: t23 = 1.5
    p: 0.07
  depends_on:
  - fig4b-decline-before-errors
  criterion: Per participant, accuracy at position 0 (and -1) in the error and in the matched
    non-error courses of fig4b-decline-before-errors; paired t-test. The side is not stated;
    t24 = 2.3 with p = 0.01 fits a one-sided test, so the reading is one-sided, with two-sided
    shown. Reproduced when trial 0 is lower at p < 0.05.
- id: fig5-similarity-predicts-errors
  statement: Across the eight Exit to Enter transitions, transitions between states whose OFC
    patterns are more correlated have lower error rates.
  source: Results, paragraph 14; Figure 5B and 5C
  quote: Results showed that transitions to ‘‘nearer’’ states (i.e., transitions between pairs of
    states whose neural representations were more highly correlated) were associated with lower
    error rates
  statistics:
  - about: linear effect of correlation on error rate, eight transition types
    test: linear regression
    statistic: t6 = -3.23
    p: 0.02
  - about: within-subject mixed-effects analysis
    test: mixed-effects model, Wald chi-square
    statistic: χ2(1) = 3.0
    p: 0.08
  - about: Figure 5B, group average by ordinal position
    p: 0.04
  - about: Figure 5C, within-subject correlations against zero
    p: 0.01
    p_relation: "<"
  depends_on:
  - fig2c-enter-cluster
  criterion: Between-run correlations of OFC beta maps as in fig2c-enter-cluster, negative
    values NaN. For each of the eight transitions from an Exit state to the following Enter
    state, the correlation of the two states' patterns and the error rate on the Enter trial
    (Results, paragraph 14). The regression with t6 is open between (a) the eight transition
    types, group-mean correlation against group error rate, and (b) the eight ordinal
    positions of Figure 5B (transitions ranked by correlation within participant, averaged
    over participants); the paper gives p = 0.02 in the text and p = 0.04 in the Figure 5B
    legend, which may be these two. The mixed model has error rate on correlation with
    participants as random effect. Figure 5C is each participant's Pearson correlation of error
    rate with pattern correlation over the eight transitions, tested against 0 (test not
    named; reading a one-sample t-test). Reproduced when under one reading the regression is
    negative with p < 0.05 and the Figure 5C mean is below 0 at p < 0.05; partially reproduced
    when one of the two holds. The mixed model is reported against p = 0.08.
- id: figs5-euclidean-distance
  statement: The relation between pattern similarity and error rate holds with between-run
    Euclidean distances in place of correlations.
  source: Results, paragraph 14; Supplemental Results 1.5; Figure S5
  quote: we repeated this same analysis using Euclidean distances instead of correlations and
    obtained the same results (see Figure S5)
  statistics:
  - about: Figure S5B, group average by ordinal position
    p: 0.03
  - about: Figure S5C, within-subject correlations against zero
    p: 0.01
    p_relation: "<"
  depends_on:
  - fig5-similarity-predicts-errors
  criterion: The analysis of fig5-similarity-predicts-errors with Euclidean distance between
    beta maps of different runs in place of correlation (Methods, State Space Similarities),
    under the same readings. Reproduced when under one reading the regression of error rate
    on distance is positive with p < 0.05 and the Figure S5C mean is above 0 at p < 0.05.
- id: fig5-synthetic-control
  statement: The similarity and error-rate analysis on synthetic data with univariate
    stimulus-driven OFC activation finds no correlation with performance.
  source: Results, paragraph 14
  quote: These control analyses found no significant correlations with performance (p > 0.18 for all)
  statistics:
  - p: 0.18
    p_relation: ">"
  depends_on:
  - synthetic-data-control
  - fig5-similarity-predicts-errors
  criterion: A claim of absence. The synthetic data of synthetic-data-control, analysed as in
    fig5-similarity-predicts-errors with the real error rates. Reproduced when none of its
    tests reaches p < 0.05, over the seeds run.
- id: supp-motor-action-not-in-ofc
  statement: The current motor response, decoded as part of an alternative state space, is
    found in left motor and visual cortex, and not in an ROI analysis of the whole OFC.
  source: Supplemental Results 1.3, paragraphs 1 and 2; Figure S3A
  quote: the effect was detected only at a ... lenient threshold and was not confirmed in an ROI analysis of the whole OFC (p = .40)
  statistics:
  - about: OFC ROI decoding of states with motor response
    p: 0.4
  criterion: A claim of absence for the OFC part. States defined by previous category, previous
    age, current category and the correct response side, with GLM onsets at the response; the
    analysis of fig2a-16way-decoding in OFC, t-test against chance at p < 0.05. Needs the
    response side of each trial; whether the data set has it is the author's to find. The
    whole-brain part needs data the description does not list.
