- id: supp-rt-stable-over-blocks
  statement: Reaction times did not change between blocks of the main experiment.
  source: Supplemental Results 1.1, paragraph 1
  quote: nor ... between blocks within the main experiment (χ2(1) = 1.7, p = .18)
  statistics:
  - test: mixed-effects model, Wald chi-square
    statistic: χ2(1) = 1.7
    p: 0.18
    n: 27 participants
  criterion: A claim of absence. Per participant and block, the median RT of correct trials
    (Methods, Behavioral Analyses, RTs are medians within each factor cell); a linear mixed
    model of RT on block as a linear term with participants as random effect on intercept and
    slope, Wald chi-square at p < 0.05. Reproduced when the block effect is not significant.
    Whether error trials enter the RT medians is open; readings are correct trials only (the
    paper leaves error trials out of all but error-rate analyses) and all responded trials.
- id: supp-rt-faces-faster
  statement: Reaction times were faster for faces than for houses (944 against 1028 ms), with no
