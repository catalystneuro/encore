- id: synthetic-data-control
  statement: Decoding on synthetic fMRI data with univariate stimulus-driven OFC activation and
    each participant's event timing is not above chance (6.8%).
  source: Results, paragraph 7; Experimental Procedures, Synthetic fMRI Data and Noise Simulations
  quote: This analysis also showed no above-chance decoding (mean accuracy across simulated
    ‘‘participants’’ 6.8%, p = 0.43 when compared to the chance baseline of 6.25%)
  statistics:
  - test: comparison with chance baseline
    p: 0.43
  expected:
    quantity: mean 16-way accuracy on synthetic data
    value: 6.8
    tolerance: 0.68
    unit: percent
  criterion: A claim of absence. Synthetic data made with neuRosim as the Methods give (one
    spherical OFC peak of mean size 5 voxels, SD 1, fading 0.01, at each participant's peak of
