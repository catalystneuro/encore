# Claims for Schuck, Cai, Wilson & Niv (2016), Neuron 91:1402-1412, on CRCNS data set ofc-4
# (doi:10.6080/K0FN14CH).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-04,
# protocol as stated in docs/protocol.md (Reader).
#
# Text read: the version of record with its Supplemental Information, as supplied under paper/
# (PyMuPDF text of the journal PDF): Summary, Results, Discussion, Experimental Procedures, the
# legends of Figures 1 to 5, and the supplement (legends of Figures S1 to S5, Table S1, and the
# Supplemental Results 1.1 to 1.5). The supplement's text carries line numbers between its
# lines; quotes from it are cut with "..." at those breaks. The paper links no analysis code
# (it names SPM8, the PhysIO toolbox, LIBSVM, the Princeton MVPA toolbox, R with lmer and boot,
# neuRosim and AFNI), so no code was read. The data descriptor names BrainIAK for building
# design matrices; that is not the paper's code.
#
# Data the paper used. 30 adults scanned, 3 excluded, 27 analysed (13 female, mean age 22.18,
# range 18 to 31), most with five runs (mean 4.9). Face-house age-judgment task with
# mini-blocks; 16 states from previous category, previous age, current category and current
# age, labelled (Ho)Fy and so on; trial classes Enter (8 states, category switch), Internal
# (4 states) and Exit (4 states). Five scanner runs, 485 trials in all, after three training
# blocks of 97 trials outside the scanner. 3 T Siemens Skyra, EPI with TR 2.4 s, 46 slices.
# Measured variables: per-trial state, correctness and reaction time; fMRI. Analyses on 27
# participants, except the trial-wise decoding around errors (24 participants; two lost error
# time stamps, one had errors only at the start of scans).
#
# The CRCNS data set, by its description, holds the 24 participants of the trial-wise analysis
# (the first with four runs, the others five): slice-timing corrected and realigned fMRI time
# series within each participant's OFC mask (the Kahnt et al. 2012 mask, in native space),
# design matrices built with AFNI from boxcars from stimulus onset to response, with 16 state
# columns plus 'first' and 'err', nuisance time courses (four Legendre drift terms and six
# motion parameters), and per-state event files with onsets, reaction times and stimulus
# durations. It holds no whole-brain data, no other ROI, no cardiac or respiratory regressors,
# and no training-session data. Claims on whole-brain maps, other ROIs and training are kept
# because they are main findings; their data are not in the description.
#
# Method details fixed by the paper (Experimental Procedures, fMRI Data Analysis, State Space
# Similarities, Behavioral Analyses, and the Supplemental Results). The first trial of each
# run, error trials and trials following errors are left out of all analyses but error rates.
# GLM on realigned, non-normalized, unsmoothed data with one regressor per state (boxcar of
# the trial's reaction time, convolved with the canonical HRF), nuisance regressors and the
# run mean, giving one beta map per state and run. Beta maps z-scored and spatially smoothed
# within each run. Linear SVM (LIBSVM, cost 1), leave-one-run-out, trained and tested on the
# 16 states; the test set is the held-out run's beta maps. Component accuracies come from
# comparing predicted and true state on each of the four components, with no new classifier.
# Trial-wise decoding uses the same classifier, tested on raw data smoothed at FWHM 3 mm and
# z-scored run-wise, taking the volume 2 TRs after stimulus onset (4.8 to 7.2 s). Similarity
# is the Pearson correlation of OFC beta maps between runs (each run's maps against all maps
# of the other runs, averaged, then averaged over runs), with negative correlations set to
# NaN. Reaction times are medians within each factor cell. Mixed-effects models (lmer) have
# participants as a random effect on the intercept and on the linear effect of trial or
# errors, tested by Wald chi-square. Chance is 6.25% for 16-way, 12.5% for 8-way and 50% for
# a component.
#
# Details the paper leaves open, used by several claims (each claim's criterion names those it
# needs). (O1) The smoothing kernel for the beta maps is not given; readings are 3 mm FWHM, the
# kernel given for the trial-wise test data, and no smoothing. Smoothing needs voxel positions;
# if the data set has none, only the unsmoothed reading can be run. (O2) Which way the beta
# maps are z-scored is not given; readings are (a) each voxel across the state maps of a run,
# (b) each map across voxels. (O3) How trials following errors are left out of the GLM is not
# given; readings are (a) as a separate nuisance regressor, (b) merged with the 'err'
# regressor. (O4) Where a t-test against chance is not said to be one-sided, the side is open;
# readings are one-sided (as the paper states for Figure 2B and Figure S2) and two-sided.
# (O5) The paper's GLM had 26 cardiac regressors and SPM8; the data set's design matrix was
# built with AFNI and has drift and motion terms only. The paper's nuisance set cannot be
# rebuilt from the data set as described, which the author records as a deviation.
schema_version: 2
dataset:
  archive: crcns
  id: ofc-4
  doi: 10.6080/K0FN14CH
paper: doi:10.1016/j.neuron.2016.08.019
claims:
- id: behavior-error-rate
  statement: Participants performed the task nearly without errors, with a mean error rate of
    2.3% in the scanner.
  source: Results, paragraph 4 (after Figure 1); Supplemental Results 1.1
  quote: "Participants performed the task with near optimal performance (mean error rate: 2.3%; Figure S1)"
  expected:
    quantity: mean error rate in the scanner
    value: 2.3
    tolerance: 0.23
    unit: percent
  criterion: Error rate as error and time-out responses (both led to feedback, Methods, Task)
    over all responded trials of the five runs, per participant, then the mean over
    participants. The denominator is open; readings are (a) all trials including the
    repetitions that follow errors, (b) all trials but the first of each run. Reproduced when
    under one reading the mean is within tolerance. The data set holds 24 of the 27
    participants, so the value is compared as given and the subset is noted.
- id: supp-errors-by-trial-class
  statement: Error rates differed by trial class (Enter 3.4%, Exit 2.3%, Internal 1.4%).
  source: Supplemental Results 1.1, paragraph 1
  quote: "but were affected by the class ... of the trial (Enter: 3.4%, Exit: 2.3%, Internal: 1.4%"
  statistics:
  - test: mixed-effects model, Wald chi-square
    statistic: χ2(2) = 20.8
    p: 0.001
    p_relation: "<"
    n: 27 participants
  expected:
  - quantity: error rate, Enter trials
    value: 3.4
    tolerance: 0.34
    unit: percent
  - quantity: error rate, Exit trials
    value: 2.3
    tolerance: 0.23
    unit: percent
  - quantity: error rate, Internal trials
    value: 1.4
    tolerance: 0.14
    unit: percent
  criterion: Trial class of each trial from its state (Enter when previous and current category
    differ, Internal when category and age repeat, Exit when the age changes; Figure S1). A
    mixed-effects model of errors on trial class with participants as random intercept, tested
    by Wald chi-square (Methods, Behavioral Analyses). The model family is open; readings are
    (a) a linear mixed model on each participant's error rate per class, (b) a logistic mixed
    model on trial-wise errors. Reproduced when under one reading the class effect has p <
    0.001, the three rates are within tolerance and their order is Enter, Exit, Internal.
- id: supp-errors-stable-over-blocks
  statement: Error rates did not change over the blocks of the main experiment.
  source: Supplemental Results 1.1, paragraph 1
  quote: Behavioral error rates were 2.3% during the main experiment, with no evidence for error
    rates ... changing over time (main effect Block
  statistics:
  - test: mixed-effects model, main effect of block, Wald chi-square
    statistic: χ2(1) = 0.08
    p: 0.77
    n: 27 participants
  criterion: A claim of absence. A mixed-effects model of errors on block (scanner run) as a
    linear term, participants as random effect on intercept and on the block slope (Methods,
    Behavioral Analyses), Wald chi-square at p < 0.05. Reproduced when the block effect is not
    significant; the slope is reported either way. The model family is open as in
    supp-errors-by-trial-class; both readings are shown and the absence is judged on (a).
- id: supp-errors-not-by-age-category
  statement: Error rates were not affected by the age or the category judged, nor by their
    interaction.
  source: Supplemental Results 1.1, paragraph 1
  quote: Error rates were not affected ... by factors Age, Category or their interaction (all p’s > .13)
  statistics:
  - test: mixed-effects model, Wald chi-square
    p: 0.13
    p_relation: ">"
    n: 27 participants
  criterion: A claim of absence. A mixed-effects model of errors on current age, current
    category and their interaction, participants as random intercept, Wald chi-square at p <
    0.05. Reproduced when none of the three terms is significant. Model family as in
    supp-errors-by-trial-class, judged on reading (a), with (b) shown.
- id: supp-training-errors-higher
  statement: Errors were higher during training than in the main experiment in the scanner.
  source: Supplemental Results 1.1, paragraph 1
  quote: errors were significantly higher during ... training than during the main experiment, t(26) = 5.6, p < .001
  statistics:
  - test: t-test
    statistic: t(26) = 5.6
    p: 0.001
    p_relation: "<"
    n: 27 participants
  criterion: Paired t-test across participants of training against scanner error rates.
