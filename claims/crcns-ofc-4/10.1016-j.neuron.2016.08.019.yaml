    distribution of mean 25, SD 5; double-gamma HRF; default noise mixture, baseline 10, SNR
    2.87; smoothed to the real data's smoothness), then the analysis of fig2a-16way-decoding.
    The participant's peak is read as the peak of the conjunction searchlight within OFC
