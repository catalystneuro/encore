  source: Supplemental Results 1.1, paragraph 1
  quote: not change between training and main experiment (991 vs 985 ms, t(26) = 0.27, p = .79)
  statistics:
  - test: t-test
    statistic: t(26) = 0.27
    p: 0.79
    n: 27 participants
  criterion: A claim of absence, judged by a paired t-test at p < 0.05 on per-participant
