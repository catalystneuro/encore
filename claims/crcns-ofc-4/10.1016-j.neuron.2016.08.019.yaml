- id: fig2a-16way-decoding
  statement: The 16 task states can be decoded from multivoxel patterns in anatomically defined
    OFC above chance (mean 12.2% against 6.25%).
  source: Results, paragraph 5; Figure 2A
  quote: we could decode significantly above chance in which of the 16 possible task-states
    participants were during the task (mean classification accuracy 12.2%, i.e., almost twice the 6.25% chance baseline
  statistics:
  - test: t-test against chance
    statistic: t26 = 9.04
    p: 0.001
    p_relation: "<"
    n: 27 participants
  expected:
    quantity: mean 16-way classification accuracy in OFC
    value: 12.2
    tolerance: 1.22
    unit: percent
  criterion: As the Methods (fMRI Data Analysis) fix it. One beta map per state and run from a
    GLM of the OFC time series with the 16 state regressors, the 'first' and 'err' regressors,
    nuisance regressors and the run mean; the beta maps z-scored and smoothed within run
    (open, O1 and O2); linear SVM, cost 1, leave-one-run-out, tested on the held-out run's 16
    beta maps; accuracy per participant over all test maps. One-sample t-test of the
    participants' accuracies against 6.25%, side open (O4). Post-error trials as O3.
    Reproduced when under one reading the mean is within tolerance and p < 0.001; partially
    reproduced when the accuracy is above chance at p < 0.05 but outside tolerance.
- id: fig2-two-back-state-space
  statement: A classifier for an alternative 16-state space built from the task-irrelevant
    category and age of two trials back decodes worse than the hypothesized state space (8.1%
    against 12.2%).
  source: Results, paragraph 5
  quote: Training and testing a classifier on this state space resulted in lower 16-way
    classification compared to the hypothesized state space (8.1% versus 12.2%, t26 = 2.8, p = 0.01)
  statistics:
  - test: t-test
    statistic: t26 = 2.8
    p: 0.01
    n: 27 participants
  depends_on:
  - fig2a-16way-decoding
  expected:
    quantity: mean 16-way accuracy, two-back state space
    value: 8.1
    tolerance: 0.81
    unit: percent
  criterion: States relabelled by current category and age with the category and age of two
    trials back in place of one trial back (Results, paragraph 5), each trial's label taken
    from the trial sequence; a new GLM with these 16 regressors, then the analysis of
    fig2a-16way-decoding unchanged. Paired t-test across participants against the
    hypothesized space, two-sided (the paper does not say one-sided here). Reproduced when the
    two-back accuracy is within tolerance and below the hypothesized accuracy with p < 0.05.
