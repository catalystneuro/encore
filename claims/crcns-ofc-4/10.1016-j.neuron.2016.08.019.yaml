- id: supp-rt-by-trial-class
  statement: Reaction times differed by trial class, slightly faster on repeat (Internal) trials
    than on the other classes.
  source: Supplemental Results 1.1, paragraph 1
  quote: RTs were also affected by trial ... class with slightly faster trials in Repeat than in the other trial classes
  statistics:
  - test: mixed-effects model, Wald chi-square
    statistic: χ2(2) = 153.7
    p: 0.001
    p_relation: "<"
  criterion: Per participant, median RT of correct trials per trial class; a linear mixed model
    on trial class with participants as random intercept, Wald chi-square. "Repeat" is read as
    the Internal class, the trials in which category and age repeat (Figure 1 legend).
