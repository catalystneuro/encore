# Claims for Elliott, Andrews et al. (2026), J. Neurophysiol. 135, "Microscale maps of bursting
# dynamics across human hippocampal slices from patients with epilepsy", doi:10.1152/jn.00217.2025,
# tested on dandiset 001132 (relation reuses).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-21,
# protocol pilot-18 as stated in docs/protocol.md. The writer did not look at the dandiset's data
# or files; only its title and description on the archive were read.
#
# Text read: the accepted author manuscript in PubMed Central (PMC12931417, NIHMS2139309; the file
# header calls it the version of record), with main text, Methods, figure legends, Code and Data
# Availability, and its one supplement, Extended_Data.pdf (Extended Data Figs. 1 to 13, Extended
# Data Tables 1 to 4, legends of Videos 1 to 4). Extended Data Tables 1 to 4 and the connection
# counts of Extended Data Fig. 10 are images that the text garbles; they were read from the PDF
# pages. The videos (YouTube) were not watched.
#
# Code read: github.com/braingeneers/human_hippocampus at commit 0f83f70 (2025-10-07), the
# repository named under Code Availability. It holds the package src/human_hip (spike data
# readers, latencies, STTC, eigendecomposition, filters, spectrogram, plotting), per-recording
# notebooks under experiments/ and the figure notebooks under figures/ (figure_2, figure_3,
# supplement), and the simulation (figures/supplement/simulation). Details the code settles,
# where the Methods are silent:
# - Circuit pairs (figures/figure_3/latencies/t_test_try30_try3/hc112823_acid.ipynb). STTC with a
#   20 ms window above 0.01; for each unordered pair, the latency from each spike of the first
#   unit to the nearest spike of the second, kept when its absolute value is at most 30 ms; at
#   least 25 latencies and absolute mean latency above 1 ms; if the mean is negative the pair is
#   reversed and recomputed; one-sample two-sided t-test of the latencies against 0 at p < 0.05.
#   The notebook's saved output for S1 is 784 pairs.
# - Geometry test (figures/figure_3/haussler/hc112823_acid.ipynb). A degree-2 polynomial y(x)
#   fitted to all unit positions, sampled at 100 evenly spaced x between the smallest and largest
#   unit x; each unit's position is the index (0 to 99) of the nearest sample point; a pair's
#   position is that of its sending unit; its angle is arctan2 of the receiving minus sending
#   position; Student's two-sample t-test (scipy ttest_ind, equal variances) of positions for
#   angle >= 0 against angle < 0. The saved output for S1 is p = 9.66e-20 (Table 3 prints 9.7e-20).
#   The Methods' 0 to 1 normalisation is this index over 100 and does not change the test.
# - Phase locking (figures/figure_3/TJ_phase_locking_basics.ipynb, figures/supplement/
#   phase_locking/sig_counts.ipynb). LFP at 1 kHz from the electrode nearest each unit;
#   Butterworth 4 to 8 Hz (human_hip butter_filter, order 5, sosfiltfilt); Hilbert phase and
#   envelope; spikes are kept within each theta cycle (trough to trough) whose peak exceeds the RMS
#   of the envelope; the Rayleigh test is astropy rayleightest; mean angle astropy circmean. The
#   KA recordings are analysed in hand-chosen seizure windows and non-seizure windows, listed in
#   seconds in the notebook: S1 seizure [9,28] [38,52] [69,83] [100,113] [138,151] [176,187]
#   [211,220] [246,254], non-seizure [28,38] [54,66] [85,97] [115,127] [155,167] [193,205]
#   [228,240] [260,272]; S2 seizure [0,11] [25,39] [139,148] [168,174] [258,263] [320,328]
#   [481,487], non-seizure [50,60] [100,113] [200,212] [270,275] [392,400] [400,406] [450,455].
#   The saved counts are S1 seizure 70 of 212, non-seizure 11 of 212; S2 seizure 101 of 180,
#   non-seizure 8 of 180. The Methods select spikes "while this upper envelope was above the RMS",
#   the code selects spikes in cycles whose peak exceeds it; the Methods are the main reading and
#   the code's selection a variant.
# - Phase clusters (figures/figure_3/Phase_lock_heatmap.ipynb). Significant units with duplicate
#   positions removed, split into two groups by hand-set position thresholds (33 and 28 units for
#   S1). The repository holds no code for the Kuiper test.
# - STTC clustering (figures/figure_3/sttc.ipynb). STTC with a 20 ms window (the braingeneers
#   default); entries of 0.3 or more (the diagonal included) set to 0; Euclidean distances between
#   rows; complete linkage; optimal leaf ordering. The two groups are read from the reordered
#   matrix by eye.
# - Sub-bursts of the S1 initiation stage (figures/figure_2/burst_peak_comparison.ipynb) are set
#   by hand at 14.4, 14.57, 14.75 and 14.91 s of the S1 KA recording. No code detects bursts,
#   superbursts, stages or rolling waves.
# - The LFP filters (human_hip/raw_data/filter.py) are order-5 Butterworth, zero phase; the
#   Methods give order 5 for the LFP bands and "fourth order" for the theta plots.
#
# Data the paper used. Recordings of Andrews et al. 2024 (Nat. Neurosci., ref 8), which the
# dandiset accompanies: organotypic human hippocampal slices (300 um, 4 to 8 days in culture,
# transduced with AAV9-CAMK2A-HcKCR1-eYFP) from patients with refractory mesial temporal lobe
# epilepsy, recorded on a MaxOne HD-MEA (26,400 electrodes, about 1,000 selected, 20 kHz). Of 12
# slices of the original study, 6 with at least 50 sorted units were analysed (S1 to S6, each from
# a different patient; Extended Data Tables 1 and 4), in 8 recordings:
#   1 S1, dentate gyrus, kainic acid (KA), seizure-like, 6 min, 212 units (patient A, 52 F, ILAE type 1)
#   2 S1, baseline (no drug), 5 min, 249 units
#   3 S2, dentate gyrus, KA, seizure-like, 8.5 min, 180 units (patient B, 35 M, no HS)
#   4 S2, baseline, 5 min, 51 units
#   5 S3, dentate gyrus, no drug, 7 min, 87 units (patient C, 20 M, type 3)
#   6 S4, dentate gyrus, KA, no seizure-like activity, 2.2 min, 109 units (patient D, 46 F, type 2)
#   7 S5, CA1, no drug, 6.4 min, 136 units (patient E, 40 F, type 3)
#   8 S6, CA1, no drug, 1.8 min, 100 units (patient F, 46 F, no HS)
# KA (100 nM) was dripped onto slices in zero-magnesium media during a continuous recording.
# Measured variables are raw broadband voltage (from which LFP bands are filtered) and single units
# from Kilosort2 with manual curation in Phy, with unit positions from Kilosort.
# The code's folder names suggest S1 = Hc112823 (2023-12-03, KA file ..._120323_3), S2 = Hc120523
# chip21769 (2023-12-11, KA file ..._121123_2), S3 = hc111 (2022-11-02, chip16753), S4 = hc110723
# (2023-11-13), and S5, S6 = hc328 (2023-04-02) and hc52 (2023-05-10) in an order the code does not
# state; the unit counts above fix the match.
#
# Outside data. The dandiset holds the raw recordings. The curated spike sortings the paper
# analysed are in the GitHub repository above (Data Availability: "The repository includes neural
# spiking data"), under data/ephys/<recording>/derived/kilosort2/ (for S2 the notebooks also read
# data/ephys/2023-12-11-e-Hc120523_aav9hckcr1_chip21769/elliott/elliott_chip21769_2.zip). Claims on
# units use them and are marked with_inputs; re-sorting the raw data with Kilosort2 cannot repeat
# the manual curation, and the author may show it as a variant. The simulation is code only.
schema_version: 2
paper: doi:10.1152/jn.00217.2025
