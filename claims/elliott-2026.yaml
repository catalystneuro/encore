    partially reproduced when at least six of the eight recordings match on both.
- id: fig1g-ka-synchronized-bursting
  statement: After kainic acid, slice S1 shows synchronized rhythmic bursting, with about 6 to 8
    bursts grouped within larger burst epochs (superbursts).
  source: Results, paragraph 1; Figure 1g and 1h
  quote: After administering kainic acid to slice S1, synchronized rhythmic bursting activity was
    observed ... approximately 6–8 bursts grouped within larger burst epochs
  data: with_inputs
  expected:
  - quantity: bursts per burst epoch, S1
    value: 7
    tolerance: 1.8
  criterion: The population rate as the Methods define it (spikes of all units in 1 ms bins,
    Gaussian smoothing with a standard deviation of 10 to 20 ms, divided by the number of units and
    multiplied by 1000). Neither the paper nor its code defines a burst or a burst epoch; the
    Figure 1g legend uses the first 150 s of seizure-like activity. Readings named here, not by
    the paper; a burst is a peak of the population rate (sigma 10 ms, and 20 ms) exceeding (a)
    twice its mean over the pre-KA part of the recording, or (b) its mean plus 3 standard
    deviations over the whole recording, with peaks less than 50 ms apart merged; epochs are runs
    of bursts separated by gaps under 5 s. The expected value is the range 6 to 8 widened by 10%
    of each bound (5.4 to 8.8). Reproduced when, under one reading, the median number of bursts
    per epoch in the first 150 s lies in that range and the bursts are synchronous across units
    (a burst raises the rate of most units).
- id: methods-burst-counts
  statement: Slice S1 had 67 bursts grouped into 11 superbursts over about 350 s; S2 had 47
    bursts, highly synchronized for the first 50 s and sporadic for the next 300 s.
  source: Methods, Classification of Epileptiform-like Events, paragraph 1; Extended Data Fig. 13
  quote: Slice S1 contained 67 bursts during its seizure-like event. The bursts were highly
    synchronized and grouped into 11 sets of super bursts over 350 seconds. Slice S2 contained 47
    bursts. The bursts for S2 were highly synchronized for the first 50 seconds, but then were
    sporadic for the next 300 seconds.
  data: with_inputs
  depends_on:
  - fig1g-ka-synchronized-bursting
  expected:
  - quantity: bursts, S1 KA recording
    value: 67
    tolerance: 6.7
  - quantity: superbursts, S1 KA recording
    value: 11
    tolerance: 1.1
  - quantity: duration of bursting, S1
    value: 350
    tolerance: 35
    unit: s
  - quantity: bursts, S2 KA recording
    value: 47
    tolerance: 4.7
  - quantity: duration of synchronized bursting, S2
    value: 50
    tolerance: 5
    unit: s
  criterion: Bursts and superbursts as in fig1g-ka-synchronized-bursting, under the same readings,
    which are not fixed by the paper or its code. Note that the code's seizure windows for S1 list
    8 superbursts in the first 254 s (opening comment), which bears on reading the count of 11.
    Reproduced when, under one reading, all five values are within tolerance; partially
    reproduced when the S1 counts or the S2 values match but not both.
- id: methods-rate-increase-after-ka
  statement: Neural activity increased after kainic acid; the population firing rate rose by 0.5
    spikes per second per unit in S1 and 0.9 in S2.
  source: Methods, Classification of Epileptiform-like Events, paragraph 1
  quote: The population firing rate increased by 0.5 spikes per second per unit for S1 and 0.9
    spikes per second per unit for slice S2.
  data: with_inputs
  expected:
  - quantity: increase in mean rate per unit, S1
    value: 0.5
    tolerance: 0.05
    unit: spikes/s
  - quantity: increase in mean rate per unit, S2
    value: 0.9
    tolerance: 0.09
    unit: spikes/s
  criterion: Mean rate per unit as the Methods define it (spike count over duration, Methods,
    Neuronal Firing Activity Heatmaps). The paper does not say what the rate after KA is compared
    with. Readings; (a) the KA recording after KA onset against the same recording before it (the
    recording was continuous during administration, Methods, Tissue preparation), (b) the whole KA
    recording against the separate baseline recording of the same slice (Extended Data Table 1),
    (c) the bursting period (about 350 s) against the baseline recording. Reproduced when both
    values are within tolerance under one reading; partially reproduced when the rate rises in
    both slices but the values miss.
- id: methods-onset-latency
  statement: Epileptiform-like activity began in S1 and S2 shortly after kainic acid was applied,
    within 15 s by one passage of the Methods and within 30 s by another.
  source: Methods, Tissue preparation, paragraph 1; Methods, Classification of Epileptiform-like
    Events, paragraph 1
  quote: Slices S1 and S2 from the dentate gyrus exhibited epileptiform-like activity within
    fifteen seconds after the administration of kainic acid.
  data: with_inputs
  depends_on:
