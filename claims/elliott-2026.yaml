  statement: During seizure-like activity theta waves in S1 reach three electrodes along the
    propagation direction in turn, with a 40 ms delay from the first to the second and from the
    second to the third.
  source: Extended Data Fig. 4a and 4b legend
  quote: There is a 40ms delay between theta waves as they propagate from e1 to e2, and from e2 to
