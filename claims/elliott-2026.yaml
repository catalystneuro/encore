- id: ext3-onset-spectral-signature
  statement: At the onset of seizure-like activity in S1 the LFP shows a large upwelling of delta
    power and an increase in theta amplitude, with theta activity aligned with bursts, and this
    holds at different electrodes.
  source: Results, paragraph 1; Figure 1i; Extended Data Fig. 3
  quote: These include a defined increase in the amplitude of theta-band oscillations, coherence
    between theta-band activity and bursting behavior, and a large upwelling in the delta-band
    frequency at epileptiform-like onset ... These characteristics remained present across
    different electrode sites
  data: with_inputs
  criterion: Spectrogram as in the Methods (Spectrogram, and Local field potential signal
    processing); raw signal low-passed 0.1 to 100 Hz and downsampled to 1 kHz, complex Morlet
    wavelet cmor1-1, power as the squared magnitude, Gaussian smoothing sigma 2. Onset is the first
    burst of the first superburst (bursts as in fig1g-ka-synchronized-bursting). The electrodes
    are not named; Extended Data Fig. 3 shows three in the granule cell layer. Readings; three
    electrodes nearest the units with the highest firing rate, and three electrodes spread along
    the granule cell layer. The baseline window is not fixed; the 5 s before the first burst is
    used. Reproduced when, at each of the three electrodes, delta (0.5 to 4 Hz) power in the 2 s
    after onset is above the baseline mean and the theta (4 to 8 Hz) amplitude exceeds twice the
    baseline (the Methods' ">2x baseline LFP" criterion); partially reproduced when this holds at
    one or two electrodes. The alignment of theta with bursts is tested in
    table2-phase-locking-counts.
- id: fig1j-theta-propagation-stages
  statement: In S1 theta-band activity shows no pattern at baseline, a standing wave oscillating
    across the length of the granule cell layer at initiation, and at the seizure stage a rolling
    wave orthogonal to the initiation direction, moving from the hilar to the outer aspect; S2
    shows the same stages.
  source: Results, paragraphs 3 and 4; Figure 1j; Extended Data Fig. 4c to 4e and Fig. 5c to 5d
  quote: During the initiation stage, theta propagations form a standing wave that oscillates
    across the length of the granule cell layer ... Following initiation and during all subsequent
    bursts, the theta oscillations form a rolling wave orthogonal to the direction observed during
    the initiation stage, moving along the granule cell layer from the hilar to outer aspect
  criterion: The paper shows this in plots and videos and judges it by eye. Theta per electrode
    by a Butterworth 4 to 8 Hz filter of the raw signal (Methods, Theta wave activity plots; order
    4 in that passage, 5 in the code; both are run). Stages from the Results; baseline is before
    the first burst, initiation is the first burst, seizure is subsequent bursts; their exact
    windows are not given. The direction of propagation is not measured in the paper. Readings
    named here; per stage, the direction of the spatial gradient of the pairwise lag (from the
    lag matrix of ext4-electrode-lag-clusters) fitted as a plane over electrode positions.
    Reproduced when, in S1 and S2, the initiation and seizure directions differ by 60 to 120
    degrees, the seizure direction runs across the layer (from its hilar side) and the baseline
    plane fit explains less of the lag variance than either other stage.
