    fig1g-ka-synchronized-bursting). The time of application must come from the dandiset's
    metadata or annotations; if it is not there the claim is blocked as metadata_insufficient.
    Reproduced when the latency is at most 15 s in both slices; partially reproduced when it is at
    most 30 s (the other passage) in both.
- id: s4-ka-no-epileptiform
  statement: Slice S4 received kainic acid but showed no epileptiform-like behaviour, and none of
    S3 to S6 showed seizure-like activity.
  source: Results, last paragraph before Discussion; Extended Data Table 1
  quote: Notably, slice S4 was administered kainic acid, but did not exhibit any epileptiform-like
    behavior or the circuit dynamics of S1 and S2.
  data: with_inputs
  depends_on:
  - fig1g-ka-synchronized-bursting
