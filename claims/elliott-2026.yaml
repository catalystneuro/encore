    unit: percent
  - quantity: percent phase locked outside seizure, S1 KA recording
    value: 5
    tolerance: 0.5
    unit: percent
  - quantity: percent phase locked outside seizure, S2 KA recording
    value: 4
    tolerance: 0.4
    unit: percent
  criterion: As table2-phase-locking-counts, with the code's non-seizure windows for the last two
    values (its saved results are 11 of 212 and 8 of 180). The mean is over recordings (the table
    legend says "on average ... per recording"). Reproduced when all four values are within
    tolerance; partially reproduced when the seizure mean is within tolerance and every other
    value is below 10%.
- id: fig2b-phase-cluster-kuiper
  statement: In S1 the significantly phase-locked units form two spatial groups along the granule
    cell layer whose preferred theta phases differ significantly (Kuiper test).
  source: Results, paragraph 6; Figure 2b; Extended Data Fig. 8a
  quote: Clustering based on the two modes of significant units yielded two groups with
    significantly different phase angles
  statistics:
  - about: phase angles of the two clusters of phase-locked units, S1
    test: Kuiper's test
    p: 0.01
    n: 70 significant units of S1 (33 and 28 after removing duplicate positions, per the code)
  data: with_inputs
  depends_on:
  - table2-phase-locking-counts
  criterion: The Results print p = 0.01 and the Figure 2b legend p < 0.01; both are accepted. Units
    are those significant in the seizure windows (table2-phase-locking-counts). Groups per the
    Methods (Methodology for heatmap of phase locked angles); the polar mode of the significant
    units' mean angles, each unit's absolute angular difference from it, and a split into two
    groups. The Methods do not say how the split is made and the code sets position thresholds by
    hand (figures/figure_3/Phase_lock_heatmap.ipynb). Readings; (a) the code's thresholds on unit
    position (group 1 is x < 940, or x = 945 with y < 1120, or x > 900 with y < 900, in um),
    (b) a split of the angular difference at its median, (c) k-means with 2 clusters on unit
    position. The Kuiper test is not in the code; astropy kuiper_two is used. Reproduced when
    under one reading the test gives p <= 0.01; partially reproduced when p < 0.05.
- id: fig2c-sttc-two-clusters
  statement: Hierarchical clustering of the STTC matrix of S1 gives two groups of units that
    divide the granule cell layer into the same two spatial modes, and S2 gives a similar result.
  source: Results, paragraph 7; Figure 2c; Extended Data Fig. 5h
  quote: Two groupings of neuronal populations were created by performing hierarchical clustering
    on the spike time tiling coefficient (STTC) matrix ... A spatial map of the neuronal clusters
    divides the granule cell layer into the same two modes seen in previous plots. Similar results
    were observed in the second epileptiform-like slice (S2)
  data: with_inputs
  criterion: Method from the Methods (Methodology for STTC hierarchical clustering) and
    figures/figure_3/sttc.ipynb; STTC over the whole KA recording with a 20 ms window, entries of
    0.3 or more set to 0 (the code; the Methods say "thresholded to 0.3", read also as clipping at
    0.3, run as a variant), Euclidean distances between rows, complete linkage, optimal leaf
    ordering. The paper reads two clusters by eye; here the tree is cut into 2 clusters
    (scipy fcluster, maxclust 2), and, as a variant, into the two largest clusters of a cut at
    half the maximum distance as the code prints. Reproduced, for each slice, when the two
    clusters each hold at least 10% of units and are spatially separated along the layer's long
    axis (unit positions projected on the degree-2 fit of table3-geometry-test; two-sided
    Mann-Whitney test of positions between clusters at p < 0.05) and the split is on the same side
    as the phase-cluster split of fig2b-phase-cluster-kuiper, reading (a), for S1.
- id: ext9-sttc-eigenvector-gradient
  statement: The first eigenvector of the STTC matrix, mapped onto the units, forms a gradient
    across the granule cell layer in both S1 and S2, reproducing the hierarchical clusters.
  source: Results, paragraph 7; Extended Data Fig. 9f to 9h; Methods, Eigendecomposition for
    neural spatial clustering
  quote: A second clustering method based on the eigendecomposition of the STTC matrix reproduced
    these results
  data: with_inputs
  depends_on:
  - fig2c-sttc-two-clusters
  criterion: STTC matrix as in figures/figure_3/sttc.ipynb (20 ms window, no threshold), its first
    eigenvector by human_hip eigenvalues_eigenvectors (numpy eigh, descending order). The paper
    judges the gradient by eye. Reproduced, for each slice, when the Spearman correlation between
    the eigenvector values and unit position along the layer (projection as in
    table3-geometry-test) has p < 0.05, and the eigenvector values differ between the two clusters
    of fig2c-sttc-two-clusters (two-sided Mann-Whitney, p < 0.05).
- id: ext9-sttc-beats-correlation
  statement: For S1, the STTC matrix has larger eigenvalues and a lower reconstruction error than
    the correlation matrix of the spike trains.
  source: Methods, Eigendecomposition for neural spatial clustering; Extended Data Fig. 9c and 9d
  quote: For our data, the STTC matrix had higher eigenvalues and a lower reconstruction error when
    compared to correlation.
  data: with_inputs
  criterion: STTC with a 20 ms window and the correlation matrix of the 1 ms raster smoothed with a
    Gaussian of sigma 5 ms (human_hip correlation_matrix, the default the code uses). The
    reconstruction error is not defined in the paper; reading named here, the Frobenius norm of the
    matrix minus its rank-k eigen-reconstruction, divided by the norm of the matrix, for k = 1 to
    20. Reproduced when each of the first 20 eigenvalues is larger for STTC and the STTC error is
    lower for every k from 1 to 20; partially reproduced when both hold for most k.
- id: fig3a-significant-pairs
  statement: Of about 45,000 neuron pairs in S1, 784 have a significant directed latency and form
    the circuit diagram; the other recordings give 1940 (S2 KA), 304 (S1 baseline), 37 (S2
    baseline), 79 (S3), 37 (S4), 172 (S5) and 92 (S6) significant pairs.
  source: Methods, Definition of circuit diagram propagation vector; Figure 3a; Extended Data
    Fig. 10 and 11a
  quote: Of the 45,000 neuronal pairs of neurons in slice S1, 784 pairs were classified as
    significant.
  data: with_inputs
  expected:
  - quantity: significant pairs, S1 KA
    value: 784
    tolerance: 78.4
  - quantity: significant pairs, S2 KA
    value: 1940
    tolerance: 194
  - quantity: significant pairs, S1 baseline
    value: 304
    tolerance: 30.4
  - quantity: significant pairs, S2 baseline
    value: 37
    tolerance: 3.7
  - quantity: significant pairs, S3
    value: 79
    tolerance: 7.9
  - quantity: significant pairs, S4
    value: 37
    tolerance: 3.7
  - quantity: significant pairs, S5
    value: 172
    tolerance: 17.2
  - quantity: significant pairs, S6
    value: 92
    tolerance: 9.2
  criterion: Pair selection as the Methods state it (STTC above 0.01, latencies to the nearest
    spike within -30 to 30 ms, at least 25 latencies, absolute mean latency at least 1 ms,
    two-tailed one-sample t-test against 0 at p < 0.05), with the code's details (opening
    comment; STTC window 20 ms, unordered pairs oriented by the sign of the mean latency). The
    counts other than S1 are read from Extended Data Fig. 10. "45,000" is read as the 212 squared
    candidate pairs the code prints. Reproduced when every count is within tolerance; partially
    reproduced when S1 and S2 KA match and at least four of the other six.
- id: fig3a-bipolar-angle-histograms
  statement: The latency-weighted propagation angle histograms are bipolar (two modes 180 degrees
    apart, aligned with the initiation theta propagation) for the epileptiform slices S1 and S2,
    unimodal for the other dentate gyrus slices S3 and S4, and bimodal but not bipolar (two
    orthogonal directions) for the CA1 slices S5 and S6.
  source: Results, paragraphs 9 and 10; Figure 3a and 3c; Extended Data Fig. 10
  quote: For slice S1, the angle histogram was bipolar, which we define as angular pairwise
    correlations that are 180° out of phase ... None of the non-epileptiform-like slices displayed
    the bimodal circuit diagram observed from the epileptiform-like slices. Both of the
    non-epileptiform-like dentate gyrus slices (S3 and S4) had a unimodal circuit diagram ... The
    slices from CA1 (S5 and S6) had evenly distributed circuit diagrams and a bimodal, but not
    bipolar, angle histogram
  data: with_inputs
  depends_on:
  - fig3a-significant-pairs
  criterion: Angles of all significant pairs from sending to receiving unit position, each
    weighted by its number of latency events (Methods, Propagation angle histogram). The paper
    judges the shapes by eye. Measures named here, not from the paper; the weighted first-order
    resultant length R1 and the axial (angles doubled) resultant length R2, and the angle between
    the two largest peaks of a 16-bin weighted histogram. Bipolar is two peaks 150 to 210 degrees
    apart with R2 > R1; unimodal is R1 > R2 with one dominant peak; bimodal not bipolar is two
    peaks 60 to 120 degrees apart. Reproduced when all six slices (KA recordings for S1, S2 and
    S4) fall in their stated class; partially reproduced when S1 and S2 are bipolar and no other
    slice is.
- id: ext10-baseline-same-circuit
  statement: In S1 and S2 the baseline recordings before kainic acid show the same bipolar circuit
    as the recordings during epileptiform activity, suggesting a structural property of the
    slices.
  source: Results, paragraph 10; Extended Data Fig. 10a to 10d
  quote: For both S1 and S2, the non-epileptiform-like recordings prior to administering kainic
    acid had the same circuit diagram as during epileptiform-like activity
  data: with_inputs
  depends_on:
  - fig3a-bipolar-angle-histograms
  criterion: As fig3a-bipolar-angle-histograms on recordings 2 and 4. Reproduced when both baseline
    recordings are bipolar and each mode lies within 45 degrees of a mode of the KA recording of
    the same slice; partially reproduced when this holds for one slice.
- id: table3-geometry-test
  statement: The circuit geometry test gives p-values orders of magnitude smaller for the slices
    with recurrent circuits (S1 KA 9.7e-20, S1 baseline 8.6e-13, S2 KA 1.6e-68, S2 baseline
    1.0e-6) than for the others (S3 0.12, S4 0.37, S5 0.00042, S6 0.0011), so the bipolar circuits
    are not an artefact of where the neurons lie.
  source: Results, last paragraph; Figure 3b; Extended Data Table 3; Methods, Statistical test of
    circuit geometry
  quote: If the bipolar plots from epileptiform-like slices were produced by bias in neuronal
    geometry, the test's p -values would be similar for all slices, however, we found the
    epileptiform-like slices to be orders of magnitude more significant
  statistics:
  - about: positions of positive against negative angle connections, S1 KA (Figure 3b)
    test: two-tailed t-test
    p: 1.0e-19
    p_relation: "<"
  data: with_inputs
  depends_on:
  - fig3a-significant-pairs
  expected:
  - quantity: -log10 p, recording 1 (S1, KA)
    value: 19.01
    tolerance: 1.9
  - quantity: -log10 p, recording 2 (S1, baseline)
    value: 12.07
    tolerance: 1.21
  - quantity: -log10 p, recording 3 (S2, KA)
    value: 67.8
    tolerance: 6.78
  - quantity: -log10 p, recording 4 (S2, baseline)
    value: 6.0
    tolerance: 0.6
  - quantity: -log10 p, recording 5 (S3)
    value: 0.92
    tolerance: 0.09
  - quantity: -log10 p, recording 6 (S4)
    value: 0.43
    tolerance: 0.04
  - quantity: -log10 p, recording 7 (S5)
    value: 3.38
    tolerance: 0.34
  - quantity: -log10 p, recording 8 (S6)
    value: 2.96
    tolerance: 0.3
  criterion: Test as in the Methods with the code's details (opening comment); all significant
    pairs of fig3a-significant-pairs, unweighted, degree-2 polynomial fit to unit positions, the
    sending unit's position along it, Student's t-test of positions for angle >= 0 against angle
    < 0. The values are compared on -log10 p because p-values span many orders of magnitude; the
    tolerance is 10% of that value. The direction of the y axis (image rows or microns upward)
    flips the sign of every angle and so the groups; both are run. Reproduced when all eight
    values are within tolerance; partially reproduced when every recording of S1 and S2 has a p
    value at least 100 times smaller than every recording of S3 to S6.
- id: ext12-simulation-recurrence
  statement: In a simplified dentate gyrus network model, increasing recurrent connectivity between
    granule cells produces seizure-like bursting.
  source: Results, paragraph 8; Discussion, paragraph 1; Extended Data Fig. 12; Methods, Simulation
    of epileptiform behavior
  quote: We constructed an in silico model to simulate functional connectivity within the dentate
    gyrus ( Extended Data Fig. 12 ) 48 and found that increasing pairwise interactions between
    granule cells produced seizure-like bursting events.
  data: elsewhere
  where: GitHub braingeneers/human_hippocampus at commit 0f83f70, figures/supplement/simulation
  criterion: Run figures/supplement/simulation/simulation.py at its four connectivity levels with
    1000 granule cells (Extended Data Fig. 12). Bursting measured by the population rate as in
    fig1g-ka-synchronized-bursting. Reproduced when the number of synchronized bursts increases
    with connectivity across the four levels and is near zero at the lowest.
