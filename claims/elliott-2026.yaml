    value: 212
    tolerance: 21.2
  - quantity: units, recording 2 (S1, baseline)
    value: 249
    tolerance: 24.9
  - quantity: units, recording 3 (S2, KA)
    value: 180
    tolerance: 18
  - quantity: units, recording 4 (S2, baseline)
    value: 51
    tolerance: 5.1
  - quantity: units, recording 5 (S3)
    value: 87
    tolerance: 8.7
  - quantity: units, recording 6 (S4, KA)
    value: 109
    tolerance: 10.9
  - quantity: units, recording 7 (S5)
    value: 136
    tolerance: 13.6
  - quantity: units, recording 8 (S6)
