- id: ext4-electrode-lag-clusters
  statement: In the two epileptiform slices, k-means clustering of electrodes by their pairwise
    theta lags gives spatial clusters that replicate the theta propagation of each stage, while
    the slices without epileptiform activity (S3 to S6) show no spatial pattern.
  source: Results, paragraph 4; Extended Data Fig. 4f to 4g, Fig. 5e and Fig. 6
  quote: For each stage of the recording, electrodes were clustered based on their average time
    delay between theta propagations ... Spatial maps of the electrode clusterings replicated the
    behavior seen in theta wave propagations ... The slices with no epileptiform-like activity
    (S3-S6) did not contain spatially coherent theta-band wave propagation patterns
  criterion: Method from the Methods (Electrode spatial clustering algorithm); theta per
    electrode, scipy correlate for all electrode pairs, the lag maximising the absolute
    correlation within -40 to 40 ms, the square lag matrix, k-means with 2 clusters on its rows.
    For S3 to S6 the Extended Data Fig. 6 legend says segments "that contained higher than
    average burst-like activity" were used; the segment length is not given. The paper judges
    spatial coherence by eye. Measure named here, not from the paper; the fraction of electrodes
    whose cluster label equals the majority label of their 8 nearest electrodes, against the same
