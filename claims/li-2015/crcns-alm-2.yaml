# Claims for Li, Chen, Guo, Gerfen & Svoboda (2015), "A motor cortex circuit for motor planning
# and movement", Nature 519, 51-56, doi:10.1038/nature14178, on CRCNS alm-2 (doi:10.6080/K04M92GX).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-07,
# protocol as stated in docs/protocol.md (version pilot-13), Reader steps 1 to 4.
#
# Text read: the version of record (PDF supplied by a person, extracted to text), main text, figure
# legends, Methods and the legends of Extended Data Figures 1 to 7. The paper has no other
# supplement. The PDF pages could not be rendered here (no renderer installed), so no figure was
# read as an image; values printed only inside panels (the stars of Fig. 1d and 5b, the curves of
# Fig. 3f) are not claimed as numbers. The extraction garbles some symbols ("5" for "=", "," for
# "<", "." for ">", "2" for a minus sign, "m" for micro); quotes copy the text as extracted.
#
# Code read: none. The paper links no code. The data descriptor says the dataset holds a folder
# "analyses_scripts" (Demo_figure_summary.m, said to reproduce Fig. 4g,h; Demo_figure_example_ROIs.m,
# Fig. 4e). That folder is one of the dataset's files, which a reader does not open, so every
# method below is taken from the paper alone; the author may read those scripts and cite them for
# a detail this file names as open. The data descriptor (alm-2, version 0.6) was read only to know
# what the dataset holds; no claim comes from it.
#
# The data the paper used, as it reports them. Head-fixed mice in a whisker-based object location
# discrimination task (Results, ALM is required for movement planning; Methods, Behaviour). A pole
# at a posterior (lick right) or anterior (lick left) position; sample epoch 1.3 s, from pole
# movement onset to 0.1 s after pole retraction onset; delay epoch 1.3 s; auditory go cue (0.1 s)
# starts the response epoch; licks to a two-spout lickport. Recordings are in left ALM, so lick
# right trials are contra trials and lick left trials ipsi trials. Lick-early trials are punished
# and excluded from performance.
#   Two-photon calcium imaging (Fig. 4; Methods, Two-photon calcium imaging and Calcium imaging
#   data analyses), the experiment this dataset is meant to hold. Four C57Bl/6Crl mice. GCaMP6s
#   (AAV2/1-syn) in left ALM; intratelencephalic (IT) neurons labelled by CTB-Alexa 647 injected in
#   right ALM, pyramidal tract (PT) neurons by red RetroBeads injected in the left basal pontine
#   nucleus. 59 randomly selected fields of view, 400 or 600 um square, 512 x 512 pixels, 15 Hz.
#   ROIs selected semi-automatically; F_cell = F_measured - 0.7 x F_neuropil, neuropil from a ~20 um
#   region around the cell centre; only cells at least 5% brighter than their neuropil kept;
#   dF/F0 with F0 the mean over the 0.5 s before each trial start. 4,706 cells in all; layer 5
#   analysed at imaging depths 450 to 700 um, with 534 labelled PT and 542 labelled IT neurons.
#   Silicon probe electrophysiology (Figs 2, 3; Extended Data Figs 1, 2, 5). 1,408 single units in
#   99 sessions from 19 mice (Sim1_KJ18-Cre for PT, Tlx_PL56-Cre for IT, Rbp4-Cre), with
#   ChR2 tagging by axonal photostimulation in the reticular formation (PT) or contralateral ALM
#   (IT) and a collision test. Not in this dataset.
#   Photoinhibition (Fig. 1; 5 VGAT-ChR2-EYFP and 3 PV-ires-Cre x ReaChR mice) and subthreshold
#   photostimulation of PT or IT neurons (Fig. 5, Extended Data Figs 3, 6, 7; Sim1_KJ18-Cre x Ai32
#   and Tlx_PL56-Cre x Ai32 mice). Behaviour only, not in this dataset.
#   Anatomy (Extended Data Figs 3, 4). Not in this dataset.
# The paper's data statement names one CRCNS deposit, doi:10.6080/K0RF5RZT, without saying which
# of its experiments it holds; the data descriptor gives this dataset (the imaging) as
# doi:10.6080/K04M92GX. Claims on the other experiments are marked `elsewhere` at the deposit the
# paper names.
#
# Method details for the imaging claims, from the Methods unless said otherwise, and what the
# paper leaves open (each named in the claims that use it):
#   - Trial epochs: sample from pole movement onset (1.3 s), delay (1.3 s), response from the go
#     cue. The length of the response epoch used in the imaging analyses is not given. Readings
#     (i) 1.3 s, as long as the other epochs; (ii) 1.5 s, the lick window after the go cue
#     (Methods, Behaviour).
#   - Trials: the electrophysiology analyses use correct trials only ("Only trials in which mice
#     correctly reported pole locations were included"); the imaging analyses do not say. Readings
#     (i) correct trials only; (ii) all trials with a response, grouped by the instructed trial
#     type (pole position).
#   - Contra-preferring or ipsi-preferring: "based on their average calcium signal during the
#     trial epochs". Readings (i) the sign of the difference of mean dF/F, contra minus ipsi trials,
#     over the sample, delay and response epochs taken together (as the spike counts "across all
#     three trial epochs" of the electrophysiology); (ii) the sign of that difference in the epoch
#     where its magnitude is largest.
