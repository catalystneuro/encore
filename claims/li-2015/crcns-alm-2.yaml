  statement: Of the 4,706 imaged cells, 58% (2,740) were task-related, with fluorescence that
    differed across 0.33 s time bins of the task (Kruskal-Wallis test, P < 0.01, in contra or in
    ipsi trials).
  source: Methods, Calcium imaging data analyses, paragraph 2
  quote: This criterion identified 58% (2,740/4,706) cells as task related.
  expected:
