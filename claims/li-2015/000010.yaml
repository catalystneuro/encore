    which time a 200 ms window stands for, which moves the onset by up to 200 ms; readings are
    the window's (p) start, (q) centre and (r) end. Reproduced when, under one reading, the PT test gives P < 0.05 with positive
    selectivity, the IT test P >= 0.05, and the three expected values are within tolerance;
