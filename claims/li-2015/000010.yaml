    912 selective neurons (the neurons Fig. 2c shows) or (b) all 1,245 putative pyramidal
    neurons, both run; each neuron's response (correct trials, 200 ms bins) mean-
    subtracted and normalized to its variance over the trial; Pearson correlation of the
    population vector at each time with that at go cue onset (t = 0). Population selectivity is
    the spike rate difference between preferred and non-preferred trial types, the preference
    set from 10 trials and the selectivity computed on the remaining trials. Whether the
    population vector concatenates both trial types or uses their difference is open; both
    are run. The paper gives no number, and the curve of Fig. 2c was not read, so the claim is
    judged on shape, a reading of "dynamic" made here. Reproduced when, under each reading, the
    mean correlation over the sample epoch is lower than over the delay epoch, which is lower
    than 1, while the population selectivity stays above 0 through the delay epoch. Three
    details the paper leaves open, each with its readings. (1) Normalization, "normalized to the
    variance of its response" (Methods); (v) dividing by the variance, the text as written, and
    (s) dividing by the standard deviation (z-score). (2) The preference set "using spike counts
    from a subset of the trials (10 trials)" (Methods; Extended Data Fig. 1b, "from 10
    trials"); (n10) 10 trials in all and (n20) 10 trials of each type. (3) The vector "at the
    onset of the go cue" (Methods; Fig. 2c legend, "t 5 0", "Averaging window, 200ms"); the
    200 ms bin that (gs) starts at, (gc) is centred on, or (ge) ends at the go cue. These join
    the readings of the rule above, all combinations run.
