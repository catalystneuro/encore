- id: fig2c-population-dynamics
  statement: Individual neuron responses are dynamic although selectivity is stable at the
    level of the population (Fig. 2c, bottom, population selectivity and the correlation of the
    population response with that at the go cue).
  source: Results, ALM contains neurons with bilateral selectivity, paragraph 1; Figure 2c,
