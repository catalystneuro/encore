- id: behaviour-performance
  statement: Mice in the object location discrimination task performed at 78.4% correct on
    average, and fewer than 13% of responses came before the go cue.
  source: Results, ALM is required for movement planning, paragraph 1
  quote: (mean per cent correct, 78.4%; responses before the go cue, ,13%)
  expected:
  - quantity: mean per cent correct
    value: 78.4
    tolerance: 7.84
    unit: "%"
  criterion: Performance is the fraction of correct reports excluding lick early trials
    (Methods, Behavioural data analyses), on trials without photostimulation. The paper does not
    say how the mean is formed. Readings are (a) all control trials pooled; (b) the mean over
    sessions; (c) the mean over mice of per-mouse performance. Reproduced when, under one
    reading, the per cent correct is within tolerance and the fraction of lick early trials
    among control trials (same three readings) is below 13% widened by 10% (14.3%). Trials
    without a lick in the 1.5 s window after the go cue ("did not lick", Methods, Behaviour) are
    not named among the exclusions; the Methods exclude only lick early trials. Readings are
    (x) no-lick trials kept in the denominator as not correct, the literal reading of the
    Methods, and (y) no-lick trials left out, reading "fraction of correct reports" as among
    trials with a report. Both are run; either may decide.
