  source: Results, ALM is required for movement planning, paragraph 2; Figure 1d
  quote: Inhibiting left ALM caused a tendency to lick the left port, resulting in increased
    performance in 'lick left' trials and decreased performance in 'lick right' trials (Fig. 1d).
    The reversed pattern of bias was observed when inhibiting right ALM
  statistics:
  - test: one-tailed test, bootstrap
    p: 0.05
    p_relation: "<"
    n: 8 mice
  criterion: Trials of the 8 photoinhibition mice. For left and right ALM separately, the change
    in performance (photoinhibition minus control) on lick right and lick left trials, with
    the delay-epoch photoinhibition trials. Significance by the Methods' bootstrap, resampling
    with replacement animals, then sessions within each animal, then trials within each
    session, 10^4 times; P is the fraction of resamples with a change of the opposite sign
    (one-tailed). Reproduced when, for both hemispheres, contralateral-trial performance falls
    with P < 0.05 and ipsilateral-trial performance rises (its P reported); partially
