    averaging window of Fig. 2c). The text reads "-19%" as "219%". Open, with readings - the
    neurons, (a) all tagged neurons of the type (Fig. 3f legend) or (b) the selective ones
    (Methods); the test window, (i) from 570 ms before the go cue to the go cue or (ii) the whole
