  depends_on:
  - fig4b-coactivity
  criterion: Distance between the peaks of the cells' occupancy-normalized maps (Methods, 2 cm bins).
    Panel B, pairs in 0.25 m bins from 0 to 1 m, two-sided Wilcoxon rank-sum of MAP-MAP against
    MAP-IAP per bin; panel C, pairs < 0.5 m apart, Kruskal-Wallis over the three groups followed by
    pairwise rank-sum tests. Reproduced when MAP-MAP is higher with p < 0.05 in all four bins and,
    in panel C, MAP-IAP is lower than both other groups at p < 0.05; partially reproduced when
    panel B or panel C holds alone.
- id: fig4s3-overlapping-pairs
  statement: MAP-IAP pairs whose spikes overlap during the transition at well entry or exit still
    have lower SWR coactivity than MAP-MAP and IAP-IAP pairs.
  source: Figure 4, supplement 3; Results, Separate reactivation, paragraph 4
  quote: We also replicated this result by using a more stringent condition, where we included only
    cell pairs with overlapping spikes during the transition period between movement and immobility
    at reward location entry or exit
  statistics:
  - test: Wilcoxon rank-sum test
    p: 0.05
    p_relation: "<"
    n: entry 333 MAP-MAP, 207 MAP-IAP, 24 IAP-IAP pairs; exit 512, 217 and 24
  data: with_inputs
  depends_on:
  - fig2c-continuous-transition
  criterion: Pairs with > 100 coincident events within +-1.5 s of entry, and separately of exit, as
    for Figure 2C. Two-sided Wilcoxon rank-sum of MAP-IAP against MAP-MAP and against IAP-IAP
    coactivity, for entry and exit. Reproduced when all four comparisons give p < 0.05 with
    MAP-IAP lower; partially reproduced when two or three do.
- id: fig4c-iap-swr-shorter
  statement: IAP-SWRs are shorter than MAP-SWRs, and MAP & IAP-SWRs are the longest; the duration
    distributions differ between all pairs of groups.
  source: Figure 4C; Results, Distinct properties for SWRs involving movement and immobility
    representations, paragraphs 1 and 2
  quote: found that IAP-SWRs were significantly shorter in duration and lower in amplitude than SWRs
    containing MAPs
  statistics:
  - test: Kolmogorov-Smirnov test, all pairwise comparisons
    p: 0.0001
    p_relation: "<"
  data: with_inputs
  depends_on:
  - fig4a-swr-counts
  criterion: Duration from start to end as in SWR detection (O5). Two-sided two-sample
    Kolmogorov-Smirnov test for each of the three pairs of groups. Reproduced when all three give p
    < 0.05 and the medians order IAP-SWR < MAP-SWR < MAP & IAP-SWR, in the pooled data and in the
    foraging task alone (Figure 4, supplement 4A shows the same in each task).
- id: fig4d-iap-swr-lower-power
  statement: IAP-SWRs have lower 150 to 250 Hz power than MAP-SWRs, and MAP & IAP-SWRs the highest;
    all groups show the increase in slow gamma (about 30 Hz) power of SWRs.
  source: Figure 4D; Results, Distinct properties for SWRs, paragraphs 1 and 2
  quote: The mean of spectral power between 150–250 Hz is significantly different between groups
  statistics:
  - test: Wilcoxon rank-sum test, all pairwise comparisons
    p: 0.0001
    p_relation: "<"
  data: with_inputs
  depends_on:
  - fig4a-swr-counts
  criterion: As in the Methods (Spectrograms). Broadband CA1 LFP, multitaper spectrogram (Chronux) in
    100 ms windows stepped by 10 ms, z-scored per frequency over the session; per SWR the mean over
    the first 100 ms after onset and over 150 to 250 Hz. Taper parameters and which tetrode (or the
    mean over CA1 tetrodes) are not given; a standard choice (time-bandwidth 3, 5 tapers; the mean
    over CA1 tetrodes) is used. Reproduced when the three pairwise two-sided rank-sum tests give p
    < 0.05 with IAP-SWR < MAP-SWR < MAP & IAP-SWR, and each group's mean normalized power at 25 to
    35 Hz in that window is above 0.
- id: fig4s5-cells-spikes-per-swr
  statement: IAP-SWRs contain fewer active cells (mean 1.03 against 1.31) and fewer spikes (mean
