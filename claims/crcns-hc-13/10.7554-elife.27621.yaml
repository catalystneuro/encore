    value: 1.03
    tolerance: 0.103
  - quantity: mean active cells per MAP-SWR
    value: 1.31
    tolerance: 0.131
  - quantity: mean spikes per IAP-SWR
    value: 2.04
    tolerance: 0.204
  - quantity: mean spikes per MAP-SWR
    value: 2.49
    tolerance: 0.249
  criterion: Place cells (IAPs in IAP-SWRs, MAPs in MAP-SWRs) firing in each SWR, and their spikes.
