    test: Binomial test
    p: 0.05
    p_relation: "<"
    n: 70 modulated PFC units
  - about: excited only during IAP-SWRs (observed 14, expected 18), reported n.s.
    test: Binomial test
    p: 0.05
    p_relation: ">"
  - about: excited only during MAP-SWRs (observed 20, expected 18), reported n.s.
    test: Binomial test
    p: 0.05
    p_relation: ">"
  - about: inhibited during either or both (observed 33, expected 26), reported n.s.
    test: Binomial test
    p: 0.05
    p_relation: ">"
