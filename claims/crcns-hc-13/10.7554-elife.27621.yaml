  source: Figure 5, supplement 1D legend; Results, Prefrontal cortical activity changes during SWRs,
    paragraph 4
  quote: The difference between MAP-SWR and IAP-SWR modulation indices was significantly decreased
    when the identities of SWRs are shuffled (blue) but remained similar to the original data after
