- id: fig4s67-matched-subsamples
  statement: IAP-SWRs remain shorter and lower in power than MAP-SWRs after matching the
    distributions of active cells, or of spikes, per SWR.
  source: Figure 4, supplements 6 and 7; Results, Distinct properties for SWRs, paragraph 1
  quote: SWR duration and power remain significantly different after matching for cells active per
    SWR ... MAP-SWRs remain longer in duration and higher in power after matching for spikes per SWR
  data: with_inputs
  depends_on:
  - fig4s5-cells-spikes-per-swr
  - fig4c-iap-swr-shorter
  - fig4d-iap-swr-lower-power
  criterion: Per subsample, 500 SWRs drawn with replacement from each of MAP-SWRs and IAP-SWRs so
    that the distribution of active cells (or of spikes) per SWR matches; 1000 subsamples; per
    subsample a Wilcoxon rank-sum test of duration and of power (legends). How the matching is done
    is not given; readings are (a) draws weighted so that each group follows the IAP-SWR
    distribution, (b) draws weighted to the overlap (minimum) of the two distributions. Reproduced
    when, for both matchings and both measures, the median subsample p-value is below 0.05 and the
    MAP-SWR median exceeds the IAP-SWR median in at least 95% of subsamples, under one reading.
- id: fig4s8-interspersed
  statement: There is no strong relation in timing between IAP-SWRs and MAP-SWRs; they are
    temporally interspersed.
  source: Figure 4, supplement 8; Results, Distinct properties for SWRs, paragraph 2
  quote: We did not observe any strong relationships in the relative timing between IAP-SWRs and
    MAP-SWRs, indicating these events were temporally interspersed
  data: with_inputs
  depends_on:
  - fig4a-swr-counts
  criterion: Cross-correlation of IAP-SWR and MAP-SWR start times in 10 ms bins, each bin z-scored
    against 1000 controls with MAP-SWR times shifted at random by 0 to 1 s either way (legend). The
    lag range is not given; +-2 s is used. Reproduced when, outside the dip near 0 lag that SWR
    duration causes (here |lag| < 0.2 s), no more than 5% of bins exceed +-2 z (the legend's red
    lines), the fraction expected by chance.
- id: fig4e-iap-spike-earlier
  statement: In SWRs with both MAPs and IAPs, IAPs spike earlier than MAPs, also after matching the
    SWR durations from which their spikes come.
  source: Figure 4E; Figure 4, supplement 9; Results, Distinct properties for SWRs, paragraph 2
  quote: We found IAPs tended to spike earlier in the SWR than MAPs ( Figure 4E ), even after
    accounting for differences in SWR duration from which IAP and MAP spikes were selected from
  statistics:
  - test: Wilcoxon rank-sum test
    p: 0.0001
    p_relation: "<"
  data: with_inputs
  depends_on:
  - fig4a-swr-counts
  criterion: Spike times relative to SWR start in MAP & IAP-SWRs. The unit is not said; readings
    are (a) all spikes pooled, (b) each cell's first spike in each SWR. Two-sided rank-sum of IAP
    against MAP times; and after resampling the SWRs so that the durations from which IAP and MAP
    spikes come follow the same distribution (supplement 9A). Reproduced when both the raw and the
    matched tests give p < 0.05 with IAP times earlier, under one reading.
- id: pfc-unit-selection
  statement: Of 712 PFC units, 112 were active in the task (mean rate > 1 Hz during movement or
    immobility) and recorded in sessions with both MAP- and IAP-SWRs.
  source: Results, Prefrontal cortical activity changes during SWRs, paragraph 2; Methods, Cell
    selection
  quote: From an initial set of 712 PFC units, we selected units that were actively engaged in the
    task (mean firing rate >1 Hz during either periods of immobility or movement or both) and were
    recorded during behavioral sessions where we could identify both MAP- and IAP-SWRs
  depends_on:
  - fig4a-swr-counts
  expected:
  - quantity: PFC units recorded
    value: 712
    tolerance: 71.2
    unit: units
  - quantity: PFC units selected
    value: 112
    tolerance: 11.2
    unit: units
  criterion: Foraging rats only. Units on PFC tetrodes (tetrode area), counted per day (O4). Mean
    rate over all movement (> 4 cm/s) or all immobility (< 4 cm/s) time in the day's task sessions.
    The paper does not say how many SWRs of each type a session needs; read as at least one of
    each. Reproduced when both counts are within tolerance under one reading.
- id: fig5-pfc-modulated-fraction
  statement: About 63% of the selected PFC units (70 of 112) are significantly modulated during one
    or both types of SWRs, almost twice the fraction found without separating SWR types.
  source: Results, Prefrontal cortical activity changes during SWRs, paragraph 3
  quote: We found ~63% of these PFC units (70/112) showed significant modulation during one or both
    types of SWRs
  depends_on:
