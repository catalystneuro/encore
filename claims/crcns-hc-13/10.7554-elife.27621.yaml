# Claims for Yu, Kay, Liu, Grossrubatscher, Loback, Sosa, Chung, Karlsson, Larkin & Frank (2017),
# eLife 6:e27621, "Distinct hippocampal-cortical memory representations for experiences associated
# with movement versus immobility", on CRCNS data set hc-13 (doi:10.6080/K0H41PK8).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-08,
# protocol as stated in docs/protocol.md (Reader), version pilot-13.
#
# Text read: the version of record (PMC5576488, Europe PMC full-text XML flattened, under paper/):
# main text, figure legends, the legends of all figure supplements (Figure 1, supplements 1 to 4;
# Figure 2, 1 and 2; Figure 3, 1 to 3; Figure 4, 1 to 9; Figure 5, 1 and 2; Figure 6, 1 and 2) and
# Materials and methods. An eLife paper has no other supplement. No PDF of the paper is under
# paper/, so figure panels could not be read; where a legend gives several significance marks
# without saying which comparison carries which, the claim says so. The data set's description
# (paper/hc-13.data-description.txt) was read only to know what the data set holds; no claim
# comes from it. p-values printed as powers of ten ("p<10 −4") are recorded as 0.0001 and the like;
# the quote checker may not find them in that form.
#
# Code: the paper links no analysis code. The Methods name the tools used (MatClust for spike
# sorting, Chronux for spectra) but give no repository.
#
# Data the paper used. Eleven male Long Evans rats (500 to 700 g, 4 to 9 months). Five performed a
# foraging task on a maze with four reward wells at its corners, two of them rewarded in alternation
# under contingencies that changed across and within days and sessions, with a barrier on one
# segment in some sessions on the last 3 to 4 days; 4, 9, 9, 11 and 12 days were analysed for the
# five rats, 2 to 3 task sessions of 15 to 45 min a day, interleaved with rest sessions of 20 to 60
# min in a sleep box. These rats had tetrodes in right dorsal CA1 (7) and right dorsal PFC (14 to
# 21, anterior cingulate and dorsal prelimbic). Six other rats performed a W-shaped alternation task
# with tetrodes in the hippocampus; their data come from earlier papers (Karlsson and Frank 2009;
# Kay et al. 2016), and the paper names the CRCNS data set hc-6 (Karlsson, Carr & Frank,
# doi:10.6080/K0NK3BZJ) as the previously published data used. Measured variables: spike times of
# manually clustered units with spike width, LFP at 1.5 kHz (0.5 to 400 Hz), head position from a
# two-part LED array tracked at 30 Hz, and reward well entry times from an infrared beam break.
# The data set hc-13 holds, by its title and description, the five foraging rats (T1, S2, Q1, R1,
# N2) with CA1 and PFC spikes, LFP, position, task and tetrode information. The W-track rats are not
# in it. Claims whose test the paper runs on both tasks pooled are marked `with_inputs` (the hc-6
# deposit); their test on the foraging rats alone is a variant, and counts the paper gives for the
# pooled data do not apply to it. The PFC claims use the foraging rats only.
#
# Methods fixed by the paper, used by many claims (Materials and methods).
# - Movement is speed > 4 cm/s, immobility speed < 4 cm/s; position is the centroid of the front
#   and back diodes.
# - CA1 putative pyramidal cells have spike width < 0.4 ms and mean rate < 10 Hz, and > 200 spikes
#   across all sessions of a day. IAPs have a mean rate >= 3 Hz during immobility at one or more
#   reward wells, spikes during SWRs excluded; MAPs are the remaining pyramidal cells.
# - SWRs. CA1 LFP referenced to corpus callosum, filtered 150 to 250 Hz, Hilbert envelope smoothed
#   with a Gaussian (sigma 4 ms), consensus envelope the median over tetrodes; only days with at
#   least three tetrodes in or near the CA1 cell layer. The envelope is normalized to immobility
#   times (speed < 4 cm/s); the noise distribution is the histogram below its mode mirrored about
#   the mode; the threshold is the 99.99th percentile of that noise distribution, set per day; an
#   event exceeds it for at least 20 ms; start and end are where the envelope returns to the mean;
#   only events at speed < 4 cm/s are kept. A cell takes part in a SWR when it fires during it
#   (spike count binarized). MAP-SWRs hold MAP spikes only, IAP-SWRs IAP spikes only, MAP & IAP-SWRs
#   both.
# - SWR coactivity (Cheng and Frank 2008) is the observed fraction of SWRs in which both cells fire,
#   as a z-score against 5000 permutations of each cell's participation across SWRs.
# - CA1 cross- and auto-correlograms in 10 ms bins, pairs with > 100 coincident spiking events in
#   the window, each normalized by the sum of its bins; the population median per bin.
#
# Details the paper leaves open, with the readings each claim that needs them must run.
# - O1, "at a reward well". The paper gives neither the well positions nor a radius. Readings:
#   (a) between beam-break entry and exit at a well, when the data set holds those times; (b) each
#   immobility period (speed < 4 cm/s) assigned to the nearest of the wells, the wells located as
#   the centres of the clusters of immobile positions (the Methods say almost all immobility is at
#   wells). Well entry and exit times (Figure 2, Figure 6) are the beam-break times under (a) and
#   the starts and ends of those immobility periods under (b).
# - O2, "excluding spikes during SWRs". Methods exclude the spikes; the Results say "excluding
#   activity during SWRs". Readings: (a) SWR spikes removed and SWR time kept in the denominator;
#   (b) both removed. The rate at a well is taken over all task sessions of the day, as the cell
#   selection is per day; the maximum over sessions is a variant.
# - O3, speed. The paper does not say how speed is computed from position. A standard choice is
#   used (untracked frames interpolated, speed from frame differences smoothed over about 0.25 s);
#   the IAP and MAP counts under unsmoothed speed are shown as a variant.
# - O4, unit counts. Cells are selected per day; a unit recorded on several days is counted once
#   per day (main reading), and the count of unique units is a variant.
# - O5, SWR threshold. Readings for "envelope power": (a) the envelope amplitude, (b) its square.
#   The histogram bin width is a standard choice (0.05 z). "Normalized to times during immobility"
#   is read as a z-score with the mean and standard deviation of the envelope during immobility in
#   the day's task sessions; the rest sessions are left out, as the paper analyses awake SWRs in
#   the tasks.
# - O6, the SWRs over which coactivity is permuted. Readings: (a) all SWRs of the day's task
#   sessions in which both cells were recorded; (b) per session, with the z-scores averaged over
#   sessions.
# - O7, the cross-correlation peak offset used to select pairs (Figure 4B, Figure 4, supplements 1
#   and 2). Computed from all spikes outside SWRs, 10 ms bins smoothed with a Gaussian (sigma 150 ms)
#   as in Figure 2, supplement 1G-H. The window is not given; as supplement 1 of Figure 4 plots
#   offsets up to 5 s, the window is read as at least +-5 s. Readings: (a) +-5 s, (b) +-10 s (the 20
#   s window used for PFC-CA1 pairs).
schema_version: 2
dataset:
  archive: crcns
  id: hc-13
  doi: 10.6080/K0H41PK8
paper: doi:10.7554/elife.27621
claims:
- id: fig1-iap-map-counts
  statement: Across both tasks, 83 CA1 units are classified as immobility-associated place cells
    (IAPs) and 659 as movement-associated place cells (MAPs).
  source: Results, Identification of CA1 place cells participating in spatial representations,
    paragraphs 3 and 4
  quote: we therefore refer to them as Immobility-Associated Place cells (IAPs) (n = 83) ... We refer
    to the remaining CA1 pyramidal units as Movement-Associated Place cells (MAPs) (n = 659)
  data: with_inputs
  expected:
  - quantity: IAPs, both tasks
    value: 83
    tolerance: 8.3
    unit: cells
  - quantity: MAPs, both tasks
    value: 659
    tolerance: 65.9
    unit: cells
  criterion: Cells selected as in the opening comment (Methods, Cell selection), under readings O1,
    O2 and O4. Reproduced when, under one reading, both counts on the pooled data are within
    tolerance. The paper's per-task counts (Figure 1, supplement 4B) add to 83 IAPs but to 679
    MAPs (244 + 435), not 659; the MAP count is therefore also judged against 679 with the same
    tolerance, and the claim holds when either matches.
- id: fig1s4b-foraging-counts
  statement: In the foraging task, 33 CA1 units are IAPs and 244 are MAPs.
  source: Figure 1, supplement 4B legend
  quote: Cells from the foraging task are shown on left (MAP = 244, IAP = 33)
  expected:
  - quantity: IAPs, foraging task
    value: 33
    tolerance: 3.3
    unit: cells
  - quantity: MAPs, foraging task
    value: 244
    tolerance: 24.4
    unit: cells
  criterion: Cells selected as in the opening comment (Methods, Cell selection) on the five
    foraging rats, under readings O1, O2 and O4. Reproduced when, under one reading, both counts
    are within tolerance; partially reproduced when one is.
- id: fig1d-well-specificity
  statement: IAP firing is specific to a single reward well, with well specificity indices close to
    1 in both tasks.
  source: Figure 1D; Figure 1, supplement 4F legend
  quote: IAPs in both tasks have well specificity values close to 1, which indicates firing that is
    specific to one well location
  data: with_inputs
  depends_on:
  - fig1-iap-map-counts
  criterion: Index as in the Methods (Well specificity). Each well's mean rate (O1, O2) divided by
    the maximum over wells, used as the length of a vector at that well's angle (wells equally
    spaced on the circle, 90 degrees apart for the four foraging wells, 120 degrees for the three W
    wells), the magnitude of their sum. The paper gives no number for "close to 1"; reproduced
    when the median index of IAPs is at least 0.8 in each task (0.9 shown as a stricter reading).
    On the data set alone, judged on the foraging IAPs.
- id: fig1e-iap-lower-speed
  statement: IAPs spike at lower movement speeds than MAPs; the median speed at the times of spikes
    is lower for IAPs.
  source: Figure 1E; Results, Identification of CA1 place cells, paragraph 3
  quote: These units also spiked at times associated with lower movement speeds during the tasks (
    Figure 1E )
  statistics:
  - test: Wilcoxon rank-sum test
    p: 0.0001
    p_relation: "<"
    n: 83 IAPs and 659 MAPs, both tasks
  data: with_inputs
  depends_on:
  - fig1-iap-map-counts
  criterion: Per cell, the median speed (O3) at its spike times over the day's task sessions. A
    two-sided Wilcoxon rank-sum test of IAPs against MAPs; reproduced when p < 0.05 with the IAP
    median lower. The foraging cells alone are shown as a variant (claim fig1s4d-foraging-speed).
- id: fig1s4d-foraging-speed
  statement: In the foraging task alone, IAP spikes occur at much lower speeds than MAP spikes.
  source: Figure 1, supplement 4D legend
  quote: Spikes of IAPs occur at much lower speeds compared with spikes of MAPs
  statistics:
  - test: Wilcoxon rank-sum test
    p: 0.00001
    p_relation: "<"
    n: 33 IAPs and 244 MAPs, foraging task
  depends_on:
  - fig1s4b-foraging-counts
  criterion: As fig1e-iap-lower-speed, on the foraging cells. Reproduced when p < 0.05 with the IAP
    median lower.
- id: fig1f-iap-smaller-coverage
  statement: IAPs are active over smaller regions of the environment (smaller spatial coverage) than
    MAPs.
  source: Figure 1F; Figure 1, supplement 4E legend
  quote: IAPs have smaller place fields on path segments than MAPs. Place field size is calculated
    by adding all linearized spatial bins (2 cm) with a firing rate greater than 2 Hz
  statistics:
  - about: both tasks pooled (Figure 1F)
    test: Wilcoxon rank-sum test
    p: 0.0001
    p_relation: "<"
  - about: per task (Figure 1, supplement 4E); the legend does not say which task has which bound
    test: Wilcoxon rank-sum test
    p: 0.005
    p_relation: "<"
  data: with_inputs
  depends_on:
  - fig1-iap-map-counts
  criterion: Coverage per cell is the number of 2 cm bins with rate > 2 Hz (Figure 1, supplement
    4E). The paper does not say how the foraging maze is linearized. The readings are (a) the 2 cm square
    bins of the occupancy-normalized map (Methods, Occupancy normalized firing maps, Gaussian sigma
    2 cm) times 2 cm; (b) the positions projected onto the maze's path segments (the lines joining
    the wells) and binned at 2 cm along them. Two-sided Wilcoxon rank-sum, IAPs against MAPs,
    pooled and per task. Reproduced when p < 0.05 with the IAP median smaller, under one reading;
    the foraging task alone is the test on the data set.
- id: fig1s1d-transition-interval
  statement: The animals switch between movement and immobility every 6 to 7 s; the autocorrelation
    of well entry and exit times peaks at 6.4 to 6.6 s in the foraging task.
  source: Figure 1, supplement 1D legend; Results, Identification of CA1 place cells, paragraph 1
  quote: shows periods of movement and periods of immobility are separated by 6.4–6.6 s for the
    foraging task, 7.4–7.6 s for the W-alternation task and 6.6–6.8 s for combined data from both
    tasks
  expected:
  - quantity: autocorrelation peak of well entry and exit times, foraging task
    value: 6.5
    tolerance: 0.76
    unit: s
  criterion: The autocorrelation of the pooled times of well entries and exits (O1) per session,
    summed over sessions, histogrammed and smoothed; the peak away from zero lag. The bin width and
    smoothing are not given; a standard choice (0.2 s bins, Gaussian sigma 0.5 s) is used. The
    tolerance is the reported range 6.4 to 6.6 s widened by 10% of each bound (5.76 to 7.26 s).
- id: fig2c-continuous-transition
  statement: MAP and IAP spiking overlap in time as the animal enters and leaves a reward well, so
    the MAP-relative-to-IAP cross-correlogram has a tail extending beyond 0 s lag, a smooth and not
    an abrupt transition.
  source: Figure 2C; Results, Smooth transition between CA1 movement and immobility spatial
    representations, paragraph 2
  quote: MAP spiking overlapped in time with IAP activity as the animal slowed down during entry
    into the well location and similarly overlapped as the animal exited the well location
  data: with_inputs
  depends_on:
  - fig1-iap-map-counts
  criterion: Spikes within +-1.5 s of each well entry and exit (O1), cross-correlogram of MAP spikes
    relative to IAP spikes (lag = MAP time minus IAP time), 10 ms bins, pairs with > 100 coincident
    events, each normalized by its sum, the population median per bin with notch +-1.58 IQR over
    the square root of n (Figure 2C legend, Methods). The paper gives no measure of how far the
    tail must reach; reproduced when the lower notch is above zero in at least half of the bins
    from 0 to +0.5 s at entry and from -0.5 to 0 s at exit. The 0.5 s extent is a choice. Pair
    counts (207 entry, 217 exit, both tasks) are reported for comparison.
- id: fig2s1cd-theta-autocorrelation
  statement: During movement (speed > 4 cm/s) around well entry and exit, both MAP and IAP spike
    autocorrelations show peaks at theta intervals (0.125 s), which are less prominent during
    immobility (speed < 1 cm/s).
  source: Figure 2, supplement 1C-D legend; Results, Smooth transition, paragraph 3
  quote: Both MAP and IAP autocorrelations show peaks at intervals corresponding to theta modulation
    of spiking activity (0.125 s) when the animal is moving
  data: with_inputs
  depends_on:
  - fig1-iap-map-counts
  criterion: Spikes within +-1.5 s of entry or exit, split by speed > 4 cm/s and < 1 cm/s,
    autocorrelation over 1 s in 10 ms bins, cells with > 100 coincident events, mean over cells
    (legend). Reproduced when, for both IAPs and MAPs at speed > 4 cm/s, the mean autocorrelation
    has a local maximum between 0.1 and 0.16 s lag (6 to 10 Hz, a choice around the paper's 0.125
    s) whose height above the minimum between 0 and that lag is larger than at speed < 1 cm/s.
- id: fig2s1ij-theta-behavior-correlation
  statement: Cross-correlation peak offsets of cell pairs on the theta time scale are significantly
    correlated with their peak offsets on the behavioral time scale of seconds.
  source: Figure 2, supplement 1I-J legend
  quote: Cross-correlation peaks on a theta time scale are significantly correlated with
    cross-correlation peaks on a behavioral time scale over seconds
  data: with_inputs
  depends_on:
