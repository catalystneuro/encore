- id: fig6c-similarity-index
  statement: PFC IAP-SWR+ units fire around well entry in patterns more like CA1 IAPs and PFC
    MAP-SWR+ units in patterns more like CA1 MAPs; IAP-SWR+ units are most active at the onset of
    immobility, MAP-SWR+ units during movement before entry, and inhibited units rise gradually
    after entry.
  source: Figure 6A-C; Results, PFC SWR modulation pattern correlates with task activity, paragraph 2
  quote: Specifically, PFC IAP-SWR + units were most active at the onset of immobility and show
    spiking patterns most similar to CA1 IAPs. PFC MAP-SWR + cells were most active during movement
    before reward well entry and show spiking patterns most similar to CA1 MAPs
  statistics:
  - test: Wilcoxon rank-sum test
    p: 0.0001
    p_relation: "<"
    n: pairwise comparisons, IAP-SWR+ 1082067, MAP-SWR+ 1921500, IAP/MAP-SWR- 3606768
  depends_on:
  - fig5dg-pfc-groups
  criterion: Per unit, mean instantaneous rate over a 10 s window centred on well entry (O1) over
    all entries, divided by its maximum (Methods). The rate's bin and smoothing are not given; 100
    ms bins with Gaussian sigma 200 ms is a standard choice. Pearson correlation for every PFC-CA1
    pair; the index is every difference of a PFC-IAP correlation and a PFC-MAP correlation within a
    PFC group (as the n of pairwise comparisons implies). The rank-sum comparison is read as
    between groups. Reproduced when the IAP-SWR+ median index is > 0, the MAP-SWR+ median is < 0,
    and the two groups differ by a two-sided rank-sum at p < 0.05; partially reproduced when the
    sign holds for one group.
- id: fig6e-coincidence-index
  statement: Outside SWRs, PFC IAP-SWR+ units are more coactive with CA1 IAPs than MAPs and PFC
    MAP-SWR+ units more coactive with CA1 MAPs than IAPs; inhibited units are the least coactive.
  source: Figure 6D-E; Results, PFC SWR modulation pattern correlates with task activity, paragraph
    3
  quote: found that PFC IAP-SWR + cells were more coactive with CA1 IAPs than CA1 MAPs. Conversely,
    PFC MAP-SWR + cells were more coactive with CA1 MAPs than CA1 IAPs
  statistics:
  - test: Wilcoxon rank-sum test
    p: 0.0001
    p_relation: "<"
    n: pairwise comparisons, IAP-SWR+ 845, MAP-SWR+ 2560, IAP/MAP-SWR- 7503
  depends_on:
  - fig5dg-pfc-groups
  criterion: PFC-CA1 cross-correlations of all spikes outside SWRs, 100 ms bins over a 20 s window,
    z-scored over its bins (Methods); the coincidence index is the difference between a PFC-IAP and
    a PFC-MAP value in the bin centred on 0 lag, over pairs of pairs sharing the PFC unit (the
    paper's n are smaller than all combinations, so pairing within a PFC unit is read as the main
    reading, all combinations within the group as a variant). Reproduced when the IAP-SWR+ median
    is > 0, the MAP-SWR+ median < 0, and the two differ by a two-sided rank-sum at p < 0.05.
- id: fig6s2-no-proximity-difference
  statement: PFC cell pairs within a modulation group do not differ from pairs across groups in
    spatial proximity (inter-spike distance) or temporal proximity (cross-correlation peak offset).
  source: Figure 6, supplement 2; Results, PFC SWR modulation pattern correlates with task activity,
    paragraph 3
  quote: These effects could not be explained by differences in spatial or temporal proximity of
    spiking between different PFC cell pairs
  statistics:
  - test: Wilcoxon rank-sum test
    p: 0.05
    p_relation: ">"
    n: 39 within-group and 169 across-group PFC pairs
  depends_on:
  - fig5dg-pfc-groups
  criterion: A claim of absence, judged on the paper's test, a two-sided Wilcoxon rank-sum at 0.05
    of within-group against across-group simultaneously recorded PFC pairs, for (A) the mean
    distance between the positions at the spikes of one cell and those of the other (read as the
    mean over all spike pairs; the paper does not define it) and (B) the absolute offset of the
    cross-correlation peak in a 20 s window. Reproduced when neither test gives p < 0.05; the
    medians are reported either way.
