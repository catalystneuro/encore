  expected:
  - quantity: fraction of selected PFC units modulated
    value: 0.63
    tolerance: 0.063
  - quantity: PFC units modulated
    value: 70
    tolerance: 7
    unit: units
  criterion: Significance per unit and SWR type as in the Methods (PFC SWR modulation index),
    following Jadhav et al. 2016. A PETH aligned to SWR starts; 1000 controls with each SWR's
    surrounding spikes circularly shifted by an amount drawn per SWR; the squared deviation of
    the observed PETH from the control mean over the mean SWR duration of that type, against the
    controls' deviations; significant at p < 0.05 (Figure 5, supplement 2). Not given here, and
    taken as the readings to run, the PETH window and bin (+-0.5 s around SWR start, 10 ms bins) and
    the shift range (the whole +-0.5 s window). Reproduced when the fraction is within tolerance.
