  expected:
  - quantity: IAP-SWR+ units
    value: 14
    tolerance: 1.4
    unit: units
  - quantity: MAP-SWR+ units
    value: 20
    tolerance: 2
    unit: units
  - quantity: IAP/MAP-SWR- units
    value: 33
    tolerance: 3.3
    unit: units
  - quantity: IAP- and MAP-SWR+ units
    value: 3
    tolerance: 1
    unit: units
  criterion: Excitation or inhibition by the sign of the modulation index (rate during the mean SWR
