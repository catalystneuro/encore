  source: Figure 5D-G; Results, Prefrontal cortical activity changes during SWRs, paragraph 3
  quote: Only 3 units showed significant excitation during both IAP- and MAP-SWRs (PFC IAP- and
    MAP-SWR + ) ( Figure 5G ), which was fewer than expected by chance (expected = 9, Binomial test,
