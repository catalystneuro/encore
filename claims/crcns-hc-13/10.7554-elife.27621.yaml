  statistics:
  - test: Wilcoxon rank-sum test, 250 ms before against 250 ms after SWR start
    p: 0.0001
    p_relation: "<"
    n: 589 MAPs and 77 IAPs
  data: with_inputs
  depends_on:
  - fig1-iap-map-counts
  criterion: Per cell, the spike count (or rate) in the 250 ms before and the 250 ms after each SWR
