  statement: Partial correlations of eSTRFs between AFTER and MIDDLE (controlling for BEFORE)
    exceed those between BEFORE and MIDDLE (controlling for AFTER), a mean improvement of 0.18
    (P = 0.001, n = 41), so tuning in degraded speech shifts towards that of intelligible speech.
  source: Results, Filtered speech eSTRF shifts overlap with MIDDLE eSTRFs; Figure 10a,b
  quote: Partial correlations between AFTER/MIDDLE were higher than ... between BEFORE/MIDDLE
