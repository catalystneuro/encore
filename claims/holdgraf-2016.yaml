# Claims for Holdgraf, de Heer, Pasley, Rieger, Crone, Lin, Knight & Theunissen (2016), "Rapid
# tuning shifts in human auditory cortex enhance speech intelligibility", Nat Commun 7:13654, on
# CRCNS data set ac-4.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-09,
# protocol as stated in docs/protocol.md (Reader).
#
# Text read: the version of record, as supplied under paper/ (PyMuPDF text of the journal PDF:
# Results, Discussion, Methods and the legends of Figures 1 to 10), with its Supplementary
# Information (Supplementary Figures 1 to 7 with legends, and Supplementary Methods). The
# Supplementary Audio and Movies were not supplied; no claim rests on them. Figure 4 was read from
# the PDF page, as the text loses which P-value belongs to which panel (panel a, raw coherence,
# P = 0.924, 0.000 and 0.001 for -1 to 0 s, 0 to 1 s and 1 to 3 s; panel b, after subtracting the
# mean response, P = 0.920, 0.241 and 0.006). The extracted text prints "=" as "1⁄4" and the
# minus sign as a replacement character; the behavioural t-test reads "P 1⁄4 1e �5", that is
# P = 1e-5, which the quote checker cannot find and was confirmed by reading. The data descriptor (paper/ac-4.data-description.txt)
# was read only to know what the data set holds.
#
# Code read: the paper links github.com/choldgraf/ecogtools ("Code for model fitting, feature
# extraction, statistics, and visualization"). Read at commit 7d1030e (2016-11-03), the last
# before publication; the modules strf.py, audio.py, connectivity.py and mpspack.py were removed
# on 2016-12-23 (commit 4e22be4). It is a library, with no script that runs the paper's
# analyses. It holds a ridge EncodingModel (time-lagged design matrix, scikit-learn Ridge, a
# score per CV split, coefficients averaged over splits), partial_corr (least squares on the
# other variables, Pearson correlation of residuals, no intercept, no scaling by default),
# coh_to_bits (-log2(1 - coh)), extract_amplitude (band-pass, Hilbert envelope, averaged over
# bands, FIR filter of 7 cycles), spectrogram_nsl (a version of the NSL wav2aud, 8 ms leaky
# integrator, default 32 ERB-spaced bands from 170 to 7000 Hz), zscore_by_non_events, and the
# Ozkurt PAC measure. The permutation cluster tests are MNE-python's (Data availability).
#
# Data the paper used. Seven epilepsy patients (age 22 to 51; 4 F, 3 M) with subdural ECoG grids
# (5 to 10 mm spacing; grids of 48 and 64 channels at JH, 68, 68 and 62 at UCI, 110 and 104 at
# CU), recorded at 1 kHz (JH, CU) or 5 kHz (UCI), all down-sampled to 1 kHz; 468 electrodes
# kept after removing epileptic and noisy channels; common average reference. Passive listening
# task of 50 to 60 trials per subject; each trial is filtered speech (BEFORE), the unfiltered
# sentence (MIDDLE) and the same filtered sentence again (AFTER), each 2 to 5 s, with 0.5 to
# 1.5 s between sounds; no sentence repeats within a subject. Filters are a low-pass of spectral
# modulations at 0.5 cycles/kHz or of temporal modulations at 3 Hz. In three subjects half of
# the trials had energy-matched pink noise as the MIDDLE sound. The measured variable is the
# high-frequency broadband (HFB) amplitude. Separate behavioural control groups of undergraduate
# students (group 1, n = 5; group 2, n = 9; group 3, n = 15) typed the words they understood.
#
# The CRCNS data set, by its title and description, holds the raw ECoG of the patients during
# this task (BIDS, BrainVision format), event timing, 2-D electrode positions on a picture of
# each brain, and a stimuli/ folder of audio; its summary says roughly 40 to 50 sentences per
# subject. It does not describe the behavioural control data, so the behavioural claims are
# listed with data "dataset" (data the paper describes recording) and their testability is for
# the author to find.
#
# Method details fixed by the paper, used by several claims. HFB: the raw signal band-passed at
# 21 centre frequencies from 70 to 140 Hz (zero-phase IIR, windows widening semi-logarithmically,
# following Bouchard and Chang 2014), Hilbert modulus, averaged over the 21 bands, down-sampled
# to 50 Hz (Methods, Neural and auditory feature extraction). Preprocessing: down-sample to
# 1 kHz, band-pass 0.5 to 200 Hz, notch 60, 120 and 180 Hz, zero-phase IIR (MNE), common average
# reference (Methods, Participants). Baseline: -800 to -100 ms before sound onset; HFB as z-score
# over baseline (Methods, Evoked HFB; Figure 3 legend). Auditory spectrogram: 128 ERB-spaced
# gammatone bands, 180 to 7000 Hz, half-wave rectification, compression, spectral sharpening,
# 8 ms leaky integrator, reduced to 32 bands, down-sampled to 50 Hz. eSTRF: ridge regression
# with time lags of 0 to 400 ms, inputs and outputs z-scored, leave-one-trial-out
# cross-validation, R2 on the held-out trial, the ridge parameter set to the mode of the best
# values over active electrodes and all models re-fit with it, coefficients averaged over
# splits, and the z-score of each coefficient over splits (mean over s.d.) used where the
# paper says so (Methods, eSTRF model formulation, eSTRF linear overlap). Between-condition
# permutation test: per electrode the difference AFTER minus BEFORE, signs flipped at random
# 10,000 times, the mean as the statistic, two-sided P as the quantile of the true mean
# (Methods, Between-condition permutation test statistics). Three eSTRFs per electrode, one
# each from the BEFORE, MIDDLE and AFTER trials (Methods, eSTRF model formulation); the main
# eSTRF analyses use speech-context trials (Figure 3 heading "MIDDLE (context) unfiltered speech
# only"); Figure 8 alone fits temporal-filtered and spectral-filtered trials apart.
#
# Details the paper leaves open (each claim names those it rests on):
# (1) Which trials define Speech-R. The Methods use the MIDDLE (unfiltered) trials; the Results
#     say "every speech trial". Readings (a) MIDDLE trials, (b) BEFORE, MIDDLE and AFTER trials
#     pooled. The Methods come first, so (a) is the main reading.
# (2) The post-stimulus window of the mean evoked HFB. Readings (a) sound onset to the end of
#     each sound, (b) 0 to 2.5 s, the post-stimulus range of Figure 4.
# (3) How the z-score over baseline is formed. Readings (a) each trial by the mean and s.d. of
#     its own -800 to -100 ms baseline, (b) by the mean and s.d. of all baseline samples of the
#     electrode, (c) the whole series z-scored by its non-event times, as zscore_by_non_events
#     in the code does.
# (4) The exact HFB band edges ("semi-logarithmically", after ref. 53); the Results and
#     Introduction say 70 to 150 Hz, the Methods 70 to 140 Hz. A standard choice is used: 21
#     log-spaced centres from 70 to 140 Hz with bandwidths proportional to centre frequency;
#     the Methods' IIR filter is used over the code's FIR.
# (5) The number of bootstrap samples for the Speech-R interval; 10,000, a standard choice.
# (6) Which electrodes lie on the temporal lobe or perisylvian cortex. The paper gives no list;
#     it shows them on each subject's brain (Figures 3, 5, 6 and 10). The author labels them
#     from the data set's electrode positions and images; per-subject counts are compared with
#     Figure 6b.
# (7) The samples of each trial used to fit and score an eSTRF. Readings (a) sound onset to
#     sound offset, (b) sound onset to 400 ms after offset. The ridge grid is not given; a
#     log-spaced grid whose mode is not at an edge is a standard choice.
# (8) The STRF-R lower bound. The Results give a 99% confidence interval on held-out R2; the
#     Methods take "the 99th percentile of model score across cross-validation splits" and its
#     lower bound. Readings (a) the 0.5th percentile of a bootstrap of the mean R2 over splits,
#     (b) the 1st percentile of the per-split R2 values, (c) their 0.5th percentile.
# (9) What the plus/minus after the eSTRF effects means. Readings (a) s.e. over electrodes,
#     (b) s.d. over electrodes. Figure 2 and Figure 4 state mean plus/minus s.e.
# (10) The coherence: multitaper bandwidth and the frequency range integrated are not given.
#      Standard choice: the 50 Hz HFB envelope, MNE multitaper defaults, integrated from the
#      lowest resolved frequency to 25 Hz. The electrode set (n = 78) is not defined; readings
#      (a) Speech-R electrodes on temporal or perisylvian cortex, (b) all electrodes on
#      temporal or perisylvian cortex, with the test on the active ones as Figure 4 marks them.
# (11) The cluster-based permutation tests: the cluster-forming threshold and the number of
#      permutations. Standard choice: MNE permutation_cluster_1samp_test with its default
#      threshold (two-sided p = 0.05 on t), 10,000 permutations, -0.5 to 3 s (Figure 3b axis).
schema_version: 2
