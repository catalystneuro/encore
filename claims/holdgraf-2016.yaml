  doi: 10.6080/K08S4N4J
paper: doi:10.1038/ncomms13654
claims:
- id: behav-no-context-baseline
  statement: Without any unfiltered speech context, control subjects recognized 3.5 plus/minus
    0.4% of the words of filtered speech sentences.
  source: Results, Behavioural control study, paragraph 1; Methods, Behavioural controls for
    filtered speech (group 1, n = 5)
  quote: Without any unfiltered speech context, subjects recognized 3.5±0.4% of filtered speech
    words
  expected:
    quantity: per cent of words recognized, no context (group 1)
    value: 3.5
    tolerance: 0.4
    unit: '%'
  criterion: As the Methods state, the per cent correct of sentence words for each sentence,
    averaged per subject, then the mean over the five group 1 subjects. Reproduced when the mean
    is within 0.4 of 3.5. The plus/minus is read as (a) s.e. over subjects (Figure 2 legend
    "Mean±s.e."), (b) s.e. over sentences; the claim holds under either.
- id: behav-context-enhancement
  statement: In the task structure of the patients, controls understood 4.53% of words with no
    context, 10.5% after a different unfiltered sentence and 77.7% after the same unfiltered
    sentence, an increase of about 67.2% over the different-sentence context (two-sample t-test,
    P = 1e-5, df = 16).
  source: Results, Behavioural control study, paragraph 1 and following page; Figure 2b
  quote: Without any context, subjects understood 4.53 ±0.82% words. ... subjects understood
    10.5±1.3% words ... subjects understood 77.7±1.5% of words. As such, there was a roughly
    67.2% increase in comprehension relative to hearing a different contextual sentence
  statistics:
  - about: same-sentence against different-sentence context
    test: two-sample t-test
    statistic: df = 16
    p: 0.00001
    n: group 2 control subjects (n = 9)
  expected:
  - quantity: per cent words understood, no context
    value: 4.53
    tolerance: 0.82
    unit: '%'
  - quantity: per cent words understood, different-sentence context
    value: 10.5
    tolerance: 1.3
    unit: '%'
  - quantity: per cent words understood, same-sentence context
    value: 77.7
    tolerance: 1.5
    unit: '%'
  - quantity: increase, same minus different sentence
    value: 67.2
    tolerance: 6.72
    unit: percentage points
  criterion: Per-subject mean per cent correct per context, as in the Methods ("calculated for
    each subject, and then compared across groups with an unpaired t-test"). Reproduced when the
    three means are within their stated s.e. and an unpaired t-test of same-sentence against
    different-sentence subject means gives P < 0.001. The paper does not say which subjects form
    the two samples (df = 16 fits two samples of 9, but group 2 is one group of 9); readings (a)
