  statement: The increase in eSTRF similarity correlates with the electrode's evoked HFB amplitude
    or model score (Pearson r = 0.42, P = 0.007).
  source: Results, Filtered speech eSTRF shifts overlap with MIDDLE eSTRFs; Figure 10b
  quote: Moreover, the increase in eSTRF similarity was itself correlated with the evoked HFB
    amplitude (Pearson's r, P
  statistics:
