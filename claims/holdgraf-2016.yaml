    same sentence, different speaker context was higher (t = 9.65, df = 22) and the different
    sentence, same speaker context slightly higher (t = 2.39, df = 22).
  source: Supplementary Figure 1A legend
  quote: "Percentage reported correct are ... as follows. No Context: 4.5 +/- 0.8%. Diff Sentence,
