    subjects who heard each context. The paper's P = 1e-5 has no stated precision, so the bound
    P < 0.001 is used, a standard choice that a result of the paper's size meets. Which responses
    give the no-context 4.53% is not stated (group 1 gives 3.5% in the paragraph before); readings
    (a) group 2 responses after the BEFORE presentation (Figure 2b legend, "after the first
    filtered speech presentation (BEFORE and here labelled no context)"), (b) group 1.
