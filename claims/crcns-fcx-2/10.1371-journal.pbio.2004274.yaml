# Claims for Johnson, Adams, Solbakk, Endestad, Larsson, Ivanovic, Meling, Lin & Knight (2018),
# PLoS Biology 16, e2004274, "Dynamic frontotemporal systems process space and time in working
# memory", doi:10.1371/journal.pbio.2004274, on CRCNS data set fcx-2 (doi:10.6080/K0VX0DQD).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-08,
# protocol as stated in docs/protocol.md (Reader), version pilot-13.
#
# Text read: the version of record, open access, PMC5895055, as supplied under paper/ (Europe PMC
# full-text XML, flattened): Introduction, Results, Discussion, Materials and methods, the legends
# of Figures 1 to 8 and the captions of the supporting information. No PDF was supplied. The
# supporting information is S1 and S2 Fig (legends read) and S1 to S4 Table (DOCX files: group
# mixed-effects model outputs with degrees of freedom). Only the captions of the four tables were
# supplied; their contents were not read. Every claim below rests on a p-value the main text
# prints, so no claim needs the tables, but the full model outputs (degrees of freedom, F values
# of the PAC models) they hold were not available. Values shown only in figures (the percentages
# of Fig 4B, the grand means of Fig 8A, the per-subject PSI of Fig 3B) were not read.
#
# Code. The Data Availability statement says the "custom-built MATLAB codes" are deposited with
# the data on CRCNS (doi:10.6080/K0VX0DQD). The data descriptor says they are in the data set's
# analysis_scripts directory (one <metric>_compute script per analysis, with subfunctions, using
# FieldTrip). Being among the data set's files, they were not read in this run. Where a criterion
# below names a detail as open, the author may find it settled by those scripts; the protocol's
# order applies (Methods first, then the paper's analysis code).
#
# Data the paper used (Subjects; Data acquisition and preprocessing; Behavioral task). Ten adults
# with intracranial electrodes for epilepsy monitoring (37 +- 13 years, 22 to 69; 7 male), from
# UC Irvine (7 subjects, resampled to 1 kHz), Oslo (2 subjects, 512 Hz; 165 Hz low-pass, 50 Hz
# line noise) and Stanford (1 subject, resampled to 1 kHz). Bipolar virtual electrodes, 254 in
# all: 36 MTL, 116 lateral PFC, 102 OFC; MTL and PFC in the same hemisphere in 9 subjects, MTL
# and OFC in 7. Task: 120 trials, 40 per condition (identity, spatial relation, temporal
# relation). Trial: 1 s pretrial fixation, 800 ms start screen ("identity" or "relation"),
# 100 ms fixation, two shapes of 200 ms each (top/bottom, first/second), a 900 or 1150 ms
# precue delay, an 800 ms test cue, a postcue delay of the same length as the precue delay, and a
# two-alternative response. Analysed: correct trials only, about 100 per subject. Segments: a
# 200 ms baseline from 250 to 50 ms before the start screen; a 1500 ms encoding and precue
# segment from first stimulus onset; a 900 ms postcue segment from test cue offset. Measured
# variables: accuracy and correct-trial response time; ERPs; task-induced power; PLV; theta PSI;
# cross-spectral PSI (theta phase to amplitude); time-frequency PAC by condition. By its
# description the CRCNS data set holds, per subject, the filtered continuous data
# (data_primary), the preprocessed bipolar data by segment ("pre", "encmain", "proc") with trial
# information (accuracy, condition, delay jitter, response time), electrode MNI coordinates, a
# per-trial table, a per-subject behaviour table, the list of channels analysed per region, and
# the analysis scripts.
#
# Shared method details, used by the criteria below. Each is from the Materials and methods
# unless stated.
# M1. Trials and segments. Correct trials only (Behavioral task, last sentence). Delay segments
#   are 900 ms. The postcue segment starts at test cue offset. The precue delay segment is not
#   placed exactly by the paper: the encoding and precue segment is 1500 ms from first stimulus
#   onset, and no gap between the two stimuli is given. Readings, (a) the last 900 ms of that
#   segment, 600 to 1500 ms after first stimulus onset; (b) the 900 ms from the offset of the
#   second stimulus, taken as 400 to 1300 ms if the stimuli are contiguous.
# M2. Spectral decomposition. 24 logarithmically spaced bandpass FIR filters between 1 and 192 Hz
#   (162 Hz for Oslo data), Hilbert amplitude squared, segments zero padded to 7500 ms (Spectral
#   decomposition). The filters' band edges and order are not given; frequencies the paper names
#   (9.5, 13.5, 16, 22.5, 64, 90.5, 128, 152.5 Hz) are to be matched by the chosen centres. This
#   could move a peak by one bin; a standard log spacing is used and the centres stated.
# M3. Task-induced power z. Baseline power pooled per channel and frequency, r points (r = trials
#   in the subject's data set) drawn and averaged, 1000 times; encoding and delay power z-scored
#   on that distribution, then down-sampled to 50 ms (Spectral decomposition). The paper does not
#   say whether the z is taken on single-trial power or on the trial mean; since r is the number
#   of trials, reading (a), the trial-mean power, is the one the procedure implies; (b) single-
#   trial power, then averaged, is shown as a variant.
# M4. Cluster-based permutation (ERPs, power). Within subject, per electrode; independent-samples
#   t test (identity against relation, encoding and precue) or F test (identity, spatial,
#   temporal, postcue), cluster-forming threshold 0.05 two-tailed, cluster statistic the sum of t
#   or F, clustering over time (ERPs) or time and frequency (power), 1000 label shuffles, cluster
#   p < 0.05 (ERPs section). The null is read as FieldTrip's maximum cluster sum per shuffle; the
#   paper cites FieldTrip [48] for the testing.
# M5. PSI (theta band). Delay segments demeaned by the trial-wise mean (the mean over trials is
#   subtracted from each trial), zero padded to 4 s, 3-cycle sliding windows (dt = 3/f), 3 to
#   7 Hz in 1 Hz steps, 2 Hz bandwidth, Hanning taper, cross-spectral density, PSI (PSI
#   section). Null, 1000 shuffles of the frequencies in one signal; z = (raw - null mean) / null
#   SD. MTL lead z > 1.96; frontal lead z < -1.96. Sign, positive when the MTL leads. Not fixed by
#   the paper: how the time-resolved spectra of the sliding window are combined into one PSI per
#   segment (read as averaging the cross-spectrum over the window positions inside the 900 ms
#   segment, then over trials).
# M6. Cross-spectral PSI. Theta input as in M5 from the phase electrode; amplitude envelopes by
#   the Hilbert procedure of M2 at 9.5 to 152.5 Hz (128 Hz for Oslo data), each passed through the
#   M5 decomposition; PSI between theta and each amplitude envelope; 1000-shuffle z as in M5; z
#   averaged over amplitude frequencies; theta phase directing when the mean z > 1.96 (Cross-
#   spectral directionality section). Within a region, phase and amplitude come from the same
#   electrode; for a pair "MTL -> PFC", theta from the MTL electrode and amplitude from the PFC
#   electrode, and the reverse for "PFC -> MTL" (read from the Results' use of the arrows).
# M7. Group mixed-effects models for PSI and cross-spectral PSI, pre against postcue: per system,
#   a linear mixed-effects model with task interval (2 levels) as fixed effect and subject and
#   electrode or electrode pair as random effects, on all electrodes or pairs (PSI section, last
#   paragraph; Cross-spectral directionality, last paragraph). Not fixed: whether the response
#   is the raw or the z-scored PSI (readings (a) z-scored, (b) raw); random intercepts are used,
#   with pair nested in subject, as the standard choice the text implies.
# M8. Individual theta band. From task-induced power over the encoding and precue interval, the 6
#   filters between 1.5 and 10 Hz averaged over trials, electrodes and time; the maximum gives a
#   3 Hz wide band: 2 to 5, 3 to 6, 4 to 7 or 5 to 8 Hz (PAC section, paragraph 1). The paper
#   also visually confirmed the peaks; the visual step is not reproducible and is left out.
# M9. PAC. Postcue segment, theta-phase directing electrodes and pairs only (M6), trial-wise mean
#   removed per condition, theta phase in the M8 band and amplitudes at 9.5 to 152.5 Hz (128 Hz
#   Oslo) by Hilbert, circular-linear Pearson correlation across the trials of a condition at
#   each time and amplitude frequency (PAC section, paragraph 2). Null, 100 shuffles; z as in M5.
#   The shuffle "randomly shuffled the amplitude frequencies across trials" is not fixed.
#   Readings, (a) amplitude values shuffled across trials relative to the phase (trial labels
#   permuted), (b) the amplitude frequency labels shuffled within each trial. Down-sampled to
#   50 ms.
# M10. PAC group models. Per region and directional system, z-scored PAC in two models (spatial
#   against identity, temporal against identity), fixed effects condition (2 levels), amplitude
#   frequency (16 levels, 9.5 to 128 Hz) and time (19 levels), all interactions, random effects
#   subject and electrode or pair. Direction models add direction (2 levels) as a fourth fixed
#   effect, on the MTL -> frontal and frontal -> MTL data together. Significance at Bonferroni
#   0.05/m, m the number of main and interaction effects (7 in three-factor models, 15 in the
#   four-factor direction models) (PAC section, last paragraph). Not fixed: whether frequency and
#   time enter as categorical factors (read as categorical, from "16 amplitude frequency" and "19
#   time-fixed effects") and the random-effects structure (random intercepts, pairs nested in
#   subject). The direction of a condition effect is read from the sign of the condition
#   coefficient or the condition means (spatial or temporal minus identity).
