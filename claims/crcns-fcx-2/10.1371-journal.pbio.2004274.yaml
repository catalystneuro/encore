- id: power-theta-sustained
  statement: Task-induced power showed sustained theta band (3 to 7 Hz) activity in MTL, PFC and
    OFC over encoding and delay, with transient activity above 16 Hz, and alpha (8 to 13 Hz)
    desynchronized in the MTL.
  source: Results, Theta activity is sustained during encoding and delay, paragraph 2; Figure 2
  quote: Single-subject analyses revealed sustained theta band (centered at 3–7 Hz) and variable
    transient activities at higher frequencies (>16 Hz) in all regions (z > 1.96, p < 0.05; Fig
    2 ). Activity in the alpha band (centered at 8–13 Hz) was desynchronized in the MTL (z <
    −1.96, p < 0.05)
  criterion: Power z as in M2 and M3 over the encoding and precue and the postcue segments. The
    paper shows representative electrodes and gives no count of subjects or electrodes for
    "sustained", so a measure is fixed here from its z threshold. For each subject and region,
    the theta z (filters centred in 3 to 7 Hz, averaged) averaged over the region's electrodes;
    theta is sustained when this z exceeds 1.96 over at least half of the encoding and delay time
    points. Readings for the unit, (a) the region average per subject, (b) per electrode, the
    fraction of electrodes meeting the rule. Reproduced when, under one reading, theta is
    sustained in each of MTL, PFC and OFC in the majority of the subjects with that region, and
    the MTL alpha z (filters centred in 8 to 13 Hz) is below -1.96 over at least half of the
    time points in the majority of subjects with MTL electrodes. The half and the majority are
    choices made here, as the paper gives none.
