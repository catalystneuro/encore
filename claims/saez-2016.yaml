    against the 26 bicuculline ECS changes and the SCS changes. The ECS group is bicuculline
    (the Results compare with ECS, n = 26). Open, with readings. Sampling with replacement (a)
    or without replacement within an SCR (b). The random seed can change a run of 26, so
    (i) one run with a standard seed, and (ii) 1000 runs of 26, judged by the share of runs
    with p < 0.001. The tolerance of the input count is the standard error of the paper's mean
    (6.19 over the square root of 26). Reproduced when, under one reading, both F-tests give
    p < 0.001 with the SCR variance smaller (in (ii), in more than half of runs) and the input
    count is within tolerance; partially reproduced when both give p < 0.05.
- id: fig3b-segregation-near-complete
  statement: Adding a segregation parameter S that biases each SCR's connections toward the
    plasticity class of the first, the SCR distribution broadens with S, and only for S of 0.9
    or more does its variance not differ from that of ECS in bicuculline; segregation of inputs
    by plasticity state would have to be almost complete.
  source: Results, Mixing of unitary L4-L4 inputs, paragraph 1; Figure 3B and 3D; Methods, Input
    mixing simulation
  quote: We found that for most S values, the variance of the SCRs is lower (p≤0.05, Fisher’s
    F-test); only for values of S≥0.9 was there no significant difference in variance between
    the SCR and ECS Δ N Strength distributions (p>0.05, Fisher’s F-test).
  statistics:
  - about: SCR against ECS in bicuculline variances, S below 0.9 (printed as p≤0.05)
    test: Fisher's F-test
    p: 0.05
    p_relation: "<"
    n: 26 SCRs and 26 ECS cells per S value
  - about: SCR against ECS in bicuculline variances, S of 0.9 and 1
    test: Fisher's F-test
    p: 0.05
    p_relation: ">"
    n: 26 SCRs and 26 ECS cells per S value
  data: with_inputs
  depends_on:
  - fig3c-random-mixing-narrower
  criterion: The simulation of claim fig3c-random-mixing-narrower for S from 0 to 1 in steps of
    0.1. At S = 0 the class probabilities are the SCS proportions (7/43 LTP, 18/43 NC, 18/43
    LTD, Results); at S = 1 every connection after the first is drawn from the first's class.
    The Methods say only that between these the probability of a same-class connection rises
    linearly; read here as P(same) = p + S(1 - p), p being the SCS proportion of the first's
    class. How the other two classes share 1 - P(same) is open, with readings (c) in their SCS
    proportions and (d) equally; they differ only when the first is NC or LTD. The readings of claim
    fig3c-random-mixing-narrower (replacement; one run or 1000 runs) apply. Reproduced when the
    F-test against the bicuculline ECS changes gives p of 0.05 or less for every S up to 0.8
    (in (ii), the median p over runs) and above 0.05 for S of 0.9 and 1; partially reproduced
    when the smallest S without a difference is 0.7 or more and the SCR SD increases with S.
