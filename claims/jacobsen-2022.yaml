  source: Figure 2B, left, and legend; Results, A virus-based method for targeting a single cell
    and identifying its inputs, paragraph 4
  quote: the total number of rabies-positive cells observed in the ipsilateral dorsal hippocampus
    increases as a function of days after the rabies injection (R = 0.58, p = 0.0014, Spearman's
    rho, n = 27 animals not including control animals)
  statistics:
  - test: Spearman's rho
    statistic: R = 0.58
    p: 0.0014
    n: 27 animals, single-cell animals without the four with zero starter cells, no controls
  expected:
  - quantity: Spearman R, rabies-positive cells in dorsal hippocampus against days with rabies
    value: 0.58
    tolerance: 0.058
  criterion: Over the animals of Table S1 with rabies-positive cells (the legend leaves out
    animals with zero starter cells and the control animals), Spearman's rank correlation of
