    of 31 animals (48%), and each of these had four or fewer starter cells.
  source: Results, A virus-based method for targeting a single cell and identifying its inputs,
    paragraph 4; Figure 2A
  quote: With this approach, we could unambiguously target four or fewer starter cells in 48% of
    animals (15 of 31) (Figure 2A)
  expected:
  - quantity: fraction of animals with conclusive starter cells
    value: 48.4
    tolerance: 4.8
    unit: percent
  - quantity: animals with conclusive starter cells
    value: 15
    tolerance: 1.5
    unit: animals
  criterion: Counted from histology, with the classification of the STAR Methods
    (Conclusive/inconclusive classification) over the 31 animals of Table S1, after the
    exclusions the Methods name (two missed injections, one lost section). Reproduced when the
    count and fraction are within tolerance and no conclusive animal has more than four starter
    cells.
