# Claims for Jacobsen, Nair, Obenhaus, Donato, Slettmoen, Moser & Moser (2022), "All-viral
# tracing of monosynaptic inputs to single birthdate-defined neurons in the intact brain",
# Cell Reports Methods 2, 100221, tested on DANDI:000230.
#
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-11-15, protocol pilot-14 as stated in docs/protocol.md.
#
# Text read: the version of record (PDF supplied by a person, paper and supplement), as
# paper/10.1016-j.crmeth.2022.100221.txt: main text, figure legends, STAR Methods, and the
# supplement's Tables S1 and S2. The supplement's Figures S1 to S4 and their legends are images
# in the PDF and do not appear in the text; they were read from PDF pages 23 to 26. Values read
# from figures (pie charts of Figures 3 and 4, latency, fidelity and firing rates printed in
# Figures 5C, S3 and S4) were read from the PDF and are marked as such. The quote checker cannot
# find the p-values 0.0036 and 0.0317 (Figure S2A legend) because that legend is not in the
# text; both were confirmed by reading PDF page 24.
#
# Code: the paper reports no original code ("This paper does not report original code"). The
# STAR Methods say the electrophysiology was analysed "with custom Python code ... as reported
# in Rowland et al. (2018)" (eLife 7, doi:10.7554/eLife.36664), and that head direction score and
# mean vector length were calculated as described there. No repository is linked, so none was
# read. Where a criterion needs a cell classification or score, it is taken from Rowland et al.
# (2018), as the Methods direct; the reader has not read that paper, and the author takes the
# definitions and thresholds from it.
#
# Data the paper used.
# - Single-cell tracing (Figures 2 to 4, S2; Table S1): 31 wild-type C57BL/6JBomTac mice
#   injected in utero at E13 with diluted AAV-CKII-Cre, then as adults with AAV-hS-FLEX-TVA-HA-
#   N2cG into the right dorsal hippocampus and, at least 2 weeks later, RABV-tdTomato (or
#   RABV-ChR2-YFP for animal 59457); perfused 16 to 30 days after the rabies injection. Measured
#   by histology (40 um sagittal sections, antibody staining for HA or 2A helper tags, confocal
#   checks of colocalization): starter cells, rabies-positive cells in the dorsal hippocampus and
#   entorhinal cortex, their spread along the longitudinal axis, and input cell types. Four
#   control mice (Table S2, 99864, 99584, 99877, 99878) had no Cre and 28 days of rabies.
# - Optogenetic tagging (Figures 5, S3, S4; Table S2): two mice. Mouse 58313 (F, E12 undiluted
#   Cre in utero, 404.8 nl helper virus, RABV-ChR2-YFP, perfused 30 days after rabies; Figures 5
#   and S4) and mouse 70375 (M, Cre and helper virus mixed and injected as an adult, RABV-ChR2-
#   YFP, 20 days; Figure S3). Each carried an optrode (four tetrodes, 16 channels, optic fibre)
#   in the right MEC. Sessions 14 to 19 days after the rabies injection, up to two per day: about
#   30 min of open-field foraging (1 x 1 m box, white cue card), then laser trials in a holding
#   box (473 nm, 1 ms pulses at 10 Hz, 7.5 to 15.14 mW at the patch cable). Spikes stored at
#   48 kHz, position and head direction from two LEDs at 50 Hz, laser TTL on a digital input.
#   Spikes of both parts were sorted together with KlustaKwik and manual refinement. Cells are
#   labelled in the figures by tetrode (T) and cell ID (C).
# - Two-photon imaging (Figures 6, 7): mouse 58253 (E14, RABV-GCaMP6f, prism, benchtop
#   microscope, about 30 Hz) and mouse 60388 (E13 single-cell protocol, AAV-Syn-GCaMP6m in MEC,
#   RABV-tdTomato, GRIN lens and prism, two-photon miniscope at about 7.52 Hz). Traces are dF/F
#   from Suite2p ROIs.
#
# The Data and code availability section says the electrophysiology data were deposited on
# DANDI (000230, version 0.220506.1516). The archive's title and description name the paper and
# the photostimulation power set points (20 and 40 mW set, 7.5 and 15.1 mW actual). The
# histology counts and the imaging data are not said to be deposited anywhere; the claims on
# them are listed with data from the paper's own recordings, and the author will find whether
# the dandiset holds them. The counts of Table S1 are printed in the supplement.
#
# Shared definitions, from the STAR Methods ("Analysis of electrophysiology data").
# - Latency: the mean, over laser pulses followed by a spike within 10 ms, of the time from the
#   pulse to the first spike; pulses with no spike within 10 ms are left out.
# - Fidelity: the percentage of laser pulses followed by a spike within 10 ms.
# - Open: the time of a pulse. Readings (a) the TTL onset, (b) the TTL offset 1 ms later. (a) is
#   the plain reading of "the average time between a laser pulse ... and the first spike".
# - Open: what makes a cell "responsive". The Results say cells "responded robustly to laser
#   stimulation with a 2- to 4-ms latency" and the Figure 5C legend says "robust and reliable
#   responses"; no threshold is given. Readings (R-a) latency between 2 and 4 ms and fidelity at
#   least 11.64%, the lowest fidelity among the cells Figure 5C shows as responsive; (R-b)
#   latency between 2 and 4 ms and more pulses followed by a spike within 10 ms than pulses
#   preceded by one in the 10 ms before (one-sided paired test, p < 0.05).
# - Open-field firing rate: the values above the path plots are "the average firing rate for
#   the open field session", read as spikes over session duration.
