- id: responsive-cells-at-19-days
  statement: Laser-responsive cells with clear spatial firing patterns could be identified for at
    least 19 days after the rabies injection.
  source: Results, The functional properties of input cells to birthdate-defined cell populations
    can be determined with optogenetics in vivo, paragraph 3; Figure 5C
  quote: responsive cells with clear spatial firing patterns could be identified for at least 19
    days after the rabies injection (Figure 5C)
  depends_on:
  - fig5c-responsive-grid-cell
  criterion: Reproduced when a session 19 or more days after the rabies injection holds a unit
    that is responsive (either reading) and classed as a grid, head direction or border cell
    under Rowland et al. (2018). "Clear spatial firing patterns" is read as one of these
    classes; the paper's example is the grid cell T1 C89.
- id: mec-inputs-from-two-weeks
  statement: In the optogenetic experiments, input cells could be detected in the MEC from about
    2 weeks after the rabies injection.
  source: Results, The functional properties of input cells to birthdate-defined cell populations
    can be determined with optogenetics in vivo, paragraph 3
  quote: In these experiments, input cells could be detected in the MEC from approximately 2 weeks
    after the rabies injection.
  criterion: The sentence does not say whether detection was by recording or by histology. Read
    as detection by recording, the test available in the dandiset; reproduced when the earliest
    session holding a responsive unit (either reading) is about 14 days after the rabies
    injection, within 10% of 14 days (12.6 to 15.4 days). Figure S3 shows such a unit at day
    14.
- id: fig6b-imaged-input-cells
  statement: Two-photon imaging through a prism in a head-fixed mouse identified several MEC cells
    expressing RABV-GCaMP6f, that is, cells projecting to an E14 birthdate-matched hippocampal
    population; five such cells were imaged 19 days after the rabies injection, with different
    activity onsets.
  source: Results, In vivo two-photon calcium imaging enables functional detection of distant input
    cells to birthdate-defined cell populations, paragraph 1; Figure 6B
  quote: This enabled us to perform ... imaging in awake, head-fixed mice and identify
    several cells projecting to a population of birthdate-matched cells in the hippocampus
    (Figure 6B)
  expected:
  - quantity: imaged input cells in the field of view
    value: 5
  criterion: Mouse 58253, benchtop recording 19 days after the rabies injection, about 2 min long
    (legend), Suite2p ROIs and dF/F as in the STAR Methods (neuropil coefficient 0.7; baseline
    the median of the lowest 20% of frames after Hanning smoothing; the window length is not
    given and is a standard choice). Reproduced when five cells are found in the field and
    at least two show calcium transients with different onset times.
- id: fig7b-dual-labelled-input-cell
  statement: With GCaMP6m expressed in the MEC by AAV and RABV-tdTomato injected into the
    hippocampus, a two-photon miniscope identified in vivo an MEC cell expressing both, an input
    to the targeted hippocampal starter cells, next to a GCaMP6m-only cell, 29 days after the
    rabies injection.
  source: Results, In vivo two-photon calcium imaging enables functional detection of distant input
    cells to birthdate-defined cell populations, paragraph 2; Figure 7B
  quote: When the RABV reached the MEC, we were able to identify a cell expressing both the calcium
    indicator and tdTomato in vivo with a two-photon miniscope (Figure 7B
  criterion: Mouse 60388, miniscope recording 29 days after the rabies injection, dual channel.
    Reproduced when a GCaMP6m ROI with calcium transients coincides with a tdTomato-positive cell
    in the mean red-channel image.
