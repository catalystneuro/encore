- id: fig2b-conclusive-more-than-control
  statement: Conclusive animals (days 26 to 30) have more rabies-positive cells in the dorsal
    hippocampus than the no-Cre control animals, which were all inconclusive.
  source: Figure 2B, right, and legend
  quote: the number of rabies-positive cells is larger in conclusive animals compared with control
