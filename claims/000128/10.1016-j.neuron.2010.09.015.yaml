  statement: In the speed task one example neuron keeps its preparatory preference (reaches up and
    left) into the peri-movement epoch, with a preparatory to peri-movement tuning correlation of
    0.72.
  source: Results, Neural responses during preparation and movement, paragraph 2; Figure 2B
  quote: This preference is shared between preparatory and peri-movement epochs. This agreement is
