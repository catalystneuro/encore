# Claims for Churchland, Cunningham, Kaufman, Ryu & Shenoy (2010), Neuron 68, 387-400, on dandiset
# 000128.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-22, protocol
# pilot-10 as stated in docs/protocol.md.
#
# Text read: the accepted author manuscript in PubMed Central (PMC2991102, NIHMS240235), full text
# with Results, Methods and figure legends, and its supplement (NIHMS240235-supplement-01.pdf,
# Supplemental Figures 1 to 5 with legends, Supplemental Text and Supplemental Experimental
# Procedures), as extracted under paper/. The version of record and the main figures were not seen,
# only their legends; no PDF of the main text was supplied.
#
# Code: the paper links no code and names no repository (it says only that regressions were done in
# Matlab). No code was read. Every method below is from the Methods, the legends or the supplement.
#
# Data the paper used (Results, Behavior and recordings; Methods; Supplemental Experimental
# Procedures). Three adult male rhesus monkeys (A, B, J, about 10 kg) made delayed reaches on a
# fronto-parallel screen; hand tracked optically at 60 Hz (0.35 mm), eye at 240 Hz. A trial is a
# touch-spot hold of at least 400 ms, target onset (the target jitters, 2 mm SD), a delay of about 0
# to 1000 ms, then the go cue (jitter stops, touch spot disappears) and the reach. Four datasets.
# - Monkeys A and B, speed task, single electrodes; 7 directions x 2 distances x 2 instructed speeds
#   (red fast, green slow) = 28 conditions; 64 and 74 single units; mean 311 and 492 trials per neuron.
# - Monkey J, maze task, single electrodes; 4 sets of 27 mazes (108 conditions), each neuron recorded
#   on one or more sets; 172 single units; mean 388 trials per neuron.
# - Monkey J-array, maze task, two 96-electrode arrays, one in caudal PMd and one in surface M1
#   (Supplemental Figure 3); all 108 conditions interleaved; 146 single- and multi-unit isolations
#   recorded simultaneously; mean 2166 trials per neuron (Results) or 2155 (Methods). No EMG.
# Maze conditions are one third straight reaches without barriers, one third curved around virtual
# barriers, and one third the same barrier mazes with unreachable distractor targets. Fixation was
# enforced during the delay for monkey J only. Allowed reaction times 120 to 900 ms (maze); reward
# after a 700 ms target hold (maze). EMG (A, B, J only) from deltoid, biceps, triceps, trapezius,
# latissimus dorsi and pectoralis. Recordings from caudal PMd and surface and sulcal M1.
# The dandiset's title on the archive ("MC_Maze, macaque primary motor and dorsal premotor cortex
# spiking activity during delayed reaching") points to the maze task recorded with arrays, the
# J-array dataset. Whether it holds the speed task, the single-electrode units or EMG is the
# author's to find; the claims on those are written as the paper reports them.
#
# Methods common to the claims on recorded data (M1 to M9). Each is from the source named; where the
# paper leaves a detail open, the readings are named and every one is run.
# M1 Trials. Successful trials with delay > 400 ms only (Methods, Task design). For the maze task,
#    only trials whose horizontal and vertical velocity profiles correlate with a reference
#    "proto-trial" at r > 0.9 (Supplemental Experimental Procedures). Open; the paper does not
#    define the proto-trial, the window or how the two components combine. Readings (T1) the
#    proto-trial is the condition's mean velocity over its trials, each component must correlate
#    at r > 0.9, window movement onset -150 to +800 ms (the maze peri-movement window, M5);
#    (T2) as T1 with the two components concatenated into one profile. If the dataset marks the
#    paper's own trial selection, that is shown as a variant. Answered 2026-10-22: T1 is set aside
#    and T2 alone is run. The paper does not say how the components combine, but it fixes two
#    properties of its selection. It kept "typically ~90% of all trials" (Supplemental Experimental
#    Procedures, Task design and behavioral control), and it left every condition with trials, since
#    all 108 maze conditions enter the analyses (Results, Behavior and recordings; Methods, Using a
#    PD, c conditions). A third of the maze conditions are straight reaches without barriers
#    (Supplemental Experimental Procedures), and for a straight horizontal or vertical reach one
#    velocity component is flat, so a per-component r > 0.9 cannot keep those conditions. The
#    attempt reports that T1 empties two conditions and keeps 73.8% of trials, so T1 is not the
#    paper's selection; T2 keeps 90.8% and every condition.
# M2 Firing rates. Spikes convolved with a 20 ms Gaussian and averaged over the trials of each
#    condition, separately locked to the go cue and to movement onset (Supplemental Experimental
#    Procedures; Supplemental Figure 4 legend). "Width 20 ms" is taken as SD 20 ms, a standard
#    choice that cannot change epoch averages. Rates are sampled every 10 ms, a standard choice.
# M3 Movement onset. The paper does not say how it was detected. The movement onset marked in the
#    dataset is used; if the dataset marks none, this step is open and the claims that need it are
#    blocked as methods_underspecified unless the author asks a reader.
# M4 Epochs. Preparatory rate, mean from 200 ms before the go cue to 100 ms after. Peri-movement
#    rate for the tuning correlation, mean from 100 ms before to 350 ms after movement onset
#    (Methods, Correlations between preparatory and peri-movement tuning). The preparatory epoch of
#    the PD analyses is the same window (the Methods define one preparatory epoch).
# M5 Peri-movement T-matrix. Condition-mean rates from 150 ms before movement onset to 800 ms after
#    (maze) or 400 ms after (speed task), all neurons concatenated in each row (one row per
#    condition), without normalisation, leaving out the neuron whose preparatory tuning is being
#    fit; PCA over conditions (columns mean-centred), the first k scores form the c x k matrix S
#    (Results, Testing preparatory tuning in PCA-based spaces; Methods, PCA-based spaces;
#    Supplemental Figure 2).
# M6 Neuron selection. Neurons with more than 5 spikes/s of preparatory tuning for J-array, at
#    least 10 spikes/s for the single-electrode datasets (Methods, Neural recordings and datasets). For the
#    tuning correlation, also peri-movement tuning at least 1.5 times the preparatory tuning
#    (Methods, Correlations). The measure of "tuning" is open. Readings (S1) the range, maximum
#    minus minimum over conditions of the condition-mean rate in the epoch; (S2) the standard
#    deviation over conditions. Answered 2026-10-22: S2 is set aside and S1 alone is run. The
#    paper does not define "tuning", but with its thresholds the measure must leave J-array neurons
#    tuned in both epochs, since Figure 4D plots their distribution of correlations with a mean of
#    0.13 and p = 0.03 (Results, Correlations between preparatory and peri-movement tuning), and
#    Figure 3E,F shows tuned array isolations (Methods, Neural recordings and datasets). The attempt reports that S2 leaves no such neuron, so S2
#    is not the paper's measure at these thresholds. One measure serves every analysis (the
#    Methods use "preparatory tuning" for both thresholds), so S2 is dropped throughout.
# M7 PD fit and performance. x_n = b0 + S b by least squares with an intercept; leave-one-condition-
#    out; performance = 1 - (mean over left-out conditions of the squared error) / (variance of x_n
#    over conditions) (Methods, Using a PD; PD performance). Variance with denominator c, a
#    standard choice. Performance is averaged over the selected neurons (Results, Figure 6E).
# M8 Dimensionalities. PCA-based spaces are tested over k = 1 to the largest k. Open; the Results
#    give "k in the range of 3-14" and Figure 6E allows up to 12. Readings (K1) k up to 14;
#    (K2) k up to 12. The best k is the one with the highest mean performance.
# M9 Task spaces (Methods, Task spaces), from condition-mean hand trajectories, movement onset to
#    the end of the reach (end of reach as marked in the dataset, else when speed first falls below
#    5% of its peak after the peak, a standard choice). For the maze task: endpoints + maximum speed
#    (3-D); initial velocity (2-D, mean horizontal and vertical velocity over the first 150 ms after
#    movement onset); endpoints + orthogonal excursion (3-D, signed maximum perpendicular distance
#    from the straight start-to-end line, positive counterclockwise); endpoints + viapoint (4-D,
#    coordinates of that maximum departure); endpoints + maximum velocity (4-D); endpoints +
#    halfpoint (4-D, the point halfway along the path); segment directions (6-D, displacements of
#    three segments); kitchen sink (11-D for the maze, segment directions, maximum counterclockwise
#    excursion and its coordinates, barriers present 0 or 1, distractors present 0 or 1). Open
#    details, each with readings run: peak horizontal and vertical velocity as (V1) each
#    component's maximum absolute value or (V2) the components at the time of peak speed; the
#    three segments as (G1) equal path length or (G2) equal time.
