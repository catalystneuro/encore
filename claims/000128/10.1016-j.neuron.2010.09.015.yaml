- id: fig4-no-separate-populations
  statement: The distributions of tuning correlations give little evidence (except perhaps weakly
    for monkey B) of one population with concordant tuning (r near 1) and another with opposing
    tuning (r near -1); most neurons have weakly correlated tuning, with a broad range of
    correlations centred near zero.
  source: Results, Correlations between preparatory and peri-movement tuning, paragraphs 3 and 4;
    Figure 4A-D
  quote: Even more disconcertingly, different neurons show markedly different relationships between
    preparatory and peri-movement activity, with a broad range of correlations centered near zero.
    ... Yet there is little evidence in Figure 4 (except perhaps weakly in panel B ) for one
    population of concordant tuning ( r ≈ 1) and another of opposing tuning ( r ≈ -1). Instead,
    most neurons have weakly correlated tuning.
  depends_on:
  - fig4d-mean-correlation-jarray
  criterion: Per-neuron correlations from fig4d (and fig4abc for datasets the archive holds). A
    claim of absence judged by eye in the paper, which names no test and no threshold. Readings
    (U1) Hartigan's dip test of unimodality gives p >= 0.05; (U2) more neurons have |r| < 0.5 than
    have |r| >= 0.5. Reproduced when both hold, not reproduced when neither holds, and
    methods_underspecified when they disagree; the dip statistic and the share of |r| >= 0.8 are
