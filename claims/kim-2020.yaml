# Claims for Kim, Atencio & Schreiner (2020), Nature Communications 11, 1102,
# doi:10.1038/s41467-020-14835-7, tested on CRCNS data set ac-5.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-09,
# protocol as stated in docs/protocol.md (Reader), version pilot-14.
#
# Text read: the version of record (PMC7046699, open access, Europe PMC JATS XML flattened), with
# its Results, figure legends, Tables 1 and 2, Methods, and the Supplementary Information
# (41467_2020_14835_MOESM1_ESM.pdf, Supplementary Figures 1 to 3 and their legends), as supplied
# under paper/. The PDF was not opened; the tables read cleanly in the text.
#
# Code. The paper links no code repository; its Data availability statement points only to the
# CRCNS data set (doi 10.6080/K07H1GSS). The data set's description says it holds a "codes" folder
# with the Matlab analysis scripts and stimulus files. Those are files of the data set, so the
# reader did not open them, and no method below is taken from them. Several details named open
# below (marked D1 to D17) may be settled by that code.
#
# Data the paper used. Female C57BL/6 mice (Charles River), 4 to 11 weeks old, anesthetized with
# ketamine and xylazine. In vivo blind whole-cell recordings from the right primary auditory cortex
# (A1), about 300 to 500 um deep (about layer 4), low-pass filtered at 5 kHz and sampled at 10 kHz;
# no current injection, no junction potential correction; recordings with rest above -50 mV
# excluded. Stimuli to the left ear by a free-field speaker. (1) Pure tones: 45 log-spaced
# frequencies from 4 to 40 kHz by 8 levels from 0 to 70 dB SPL in 10 dB steps (360 tones), 50 ms
# each with 250 ms deadtime, one presentation in random order. (2) Dynamic moving ripple (DMR):
# 0.5 to 40 kHz, 10 min, 316 carriers, temporal modulation up to 40 cyc/s, spectral modulation up
# to 4 cyc/oct, 40 dB modulation depth, mean level 54 dB SPL (38 and 69 dB SPL as well for
# Supplementary Fig. 3). Current clamp, 66 neurons from 41 mice with tones; 40 of them also with
# the DMR. Voltage clamp (cesium, QX-314), 31 neurons from 24 mice with the DMR, excitatory
# currents at about -80 mV (n = 27, the Fig. 7a legend says -70 mV for its example) and inhibitory
# currents at about 0 mV (n = 12), both in 8. Supplementary Fig. 2 uses repeated DMR recordings of
# 2 neurons (13 STRF pairs); Supplementary Fig. 3 uses 5 neurons at three DMR levels. Measured
# variables: membrane potential (current clamp) and membrane current (voltage clamp), with the
# stimulus trigger. The data set's description says it holds these current-clamp (tones and DMR)
# and voltage-clamp (excitation and inhibition DMR) recordings, raw and processed, with only a
# representative example for Supplementary Figs. 2 and 3.
#
# Methods fixed by the paper (Methods, Data analysis, unless stated). Tone responses (PSPs) are
# those with onset latency 5 to 50 ms and amplitude above 4 x the s.d. of baseline segments; TRFs
# come from a single presentation of the tone set. The normalized-driven ratio (NDR) is the number
# of spikes over the number of PSPs within the TRF region, one spike counted per tone when spikes
# burst. The characteristic frequency (CF) is the frequency with a response at the lowest level.
# Bandwidth30 is the TRF bandwidth 30 dB above the minimum threshold level (threshold 0 dB SPL in
# 63 neurons, 10 dB SPL in 3, Methods, Stimuli). DMR events are detected with Nathanael Yoder's
# peakfinder (local maxima from first and second derivatives, amplitude difference to nearby
# minima about 3 mV in current clamp, about 20 to 40 pA in voltage clamp). In current clamp,
# spikes are the high-amplitude peaks; the remaining PSP peaks above 4 x s.d. of unresponsive
# baseline segments are split into large and small PSPs at the trough of a bimodal amplitude
# histogram, or at about 50% of the non-spiking PSPs (the median) when it is unimodal (Results,
# Spectrotemporal receptive fields, paragraphs 2 and 3). Voltage-clamp events are peaks above
# 3 x s.d. of baseline, all in one STRF per current (Results, DMR-evoked currents). "All events"
# STRFs pool every event of a recording (Fig. 3 legend). STRFs are event-triggered averages of the
# DMR envelope; significant pixels are those at p < 0.05 against the pixels of STRFs from event
# trains circularly shifted at regular intervals of N/niter bins. The best frequency (BF) is the
# frequency of the strongest STRF response; for double-peaked STRFs the peak closest to the TRF CF
# is used in Fig. 5 (Results, Frequency selectivity, paragraph 1). The RTF is the 2-D Fourier
# transform of the STRF; the temporal and spectral modulation transfer functions are the RTF summed
# over spectral and temporal modulation; bTMF and bSMF are their peaks for bandpass functions and
# the mean of zero and the 3 dB cutoff for lowpass ones (ref. 19). Nonlinearity: projections z of
# the stimulus segment preceding each event onto the STRF give P(z|event); projections of many
# random segments give P(z), with mean mu and s.d. sigma; x = (z - mu)/sigma; P(event|x) =
# P(event) P(x|event)/P(x); it is fitted by an expansive power-law function with a threshold
# (theta) and a transition (sigma), in s.d. units (Results, STRF nonlinearities). Feature
# selectivity index (FSI) = (Arand - A)/Arand, from the areas under the cumulative distributions of
# the similarity index between the STRF and the stimulus preceding each event (A) and preceding
# random times (Arand) (ref. 19). STRF reliability is the correlation coefficient between two
# STRFs. Harmonic ratio = higher over lower peak frequency; percent error = |mean ratio -
# theoretical ratio|/theoretical ratio x 100%. Q = best frequency / bandwidth. Table 1 tests are
# two-tailed paired t-tests over neurons, Table 2 tests two-tailed unpaired t-tests.
#
# Details the paper leaves open (each claim names those it rests on). Where a detail cannot change
# an outcome, a standard choice is named; where it can, the readings are listed, and the claim's
# outcome is the one they all give.
# D1 How spikes are told from PSPs among the detected peaks in current clamp. The paper says only
#    that spikes form the high-amplitude group of the peak-amplitude histogram (Fig. 2a, b, top
#    right). Readings (a) a per-neuron cut at the gap between the PSP and spike groups of that
#    histogram; (b) an action potential criterion on the trace (rate of rise or overshoot).
# D2 The reference of PSP amplitudes ("all the events used the same absolute baseline").
#    Readings (a) peak membrane potential minus the neuron's resting potential; (b) peakfinder's
#    amplitude above the neighbouring minimum.
# D3 The "unresponsive baseline segments" whose s.d. sets the 4 x s.d. (current clamp) and 3 x
#    s.d. (voltage clamp) cut. Readings (a) stretches of the recording without stimulus; (b)
#    stretches during the DMR without detected events. For tones, the baseline is read as the
#    trace before each tone onset, a standard choice.
# D4 How a PSP amplitude histogram is judged bimodal. No test is named. Readings (a) the histogram
#    has two maxima separated by a trough (the Results' wording); (b) Hartigan's dip test, p < 0.05.
# D5 STRF delay window and binning are not stated; a standard window (0 to 200 ms before the
#    event) at the DMR envelope's own resolution is used, a standard choice.
# D6 The number of circular shifts (niter) is not stated; at least 100 is used, a standard choice.
# D7 Which recordings "showed significant STRF subfields". Readings (a) at least one significant
#    positive pixel (p < 0.05); (b) a contiguous significant positive region of more than one pixel.
# D8 STRF bandwidth is not defined. Readings (a) the spectral extent, in octaves, of the
#    significant positive subfield, a total bandwidth spanning both peaks and the gap between them
#    (as the Fig. 3a example, peaks 0.70 octaves apart at 12.3 and 20.0 kHz with a 0.98-octave
#    bandwidth, implies); (b) the width of the frequency profile of the significant STRF (positive
#    values summed over delay) above half its maximum. Single bands (Table 1) are each peak's own
#    extent; how 31 single bands arise from 30 neurons is not said, readings (a) every peak that
#    can be matched across the three event types, (b) one peak per neuron, the one closest to CF.
# D9 Double-peaked STRFs are not defined. Readings (a) two separate significant positive subfields
#    along frequency; (b) two maxima of the frequency profile separated by a dip below half of the
#    smaller maximum.
# D10 STRF latency and duration are not defined. Latency readings (a) the delay of the STRF
#    maximum (the "peak latency" of Supplementary Fig. 3b, Results); (b) the shortest delay of a
#    significant positive pixel. Duration readings (a) the delay extent of the significant positive
#    subfield at BF; (b) the width of the delay profile above half its maximum.
# D11 RTF details. Readings for the STRF transformed (a) the significant STRF; (b) the full STRF.
#    Bandpass readings (a) the transfer function's maximum is away from zero modulation; (b) its
#    value at zero is more than 3 dB below the maximum. Positive and negative temporal modulations
#    are folded together, a standard choice (ref. 19).
# D12 Nonlinearity details. The fitted function is named, not printed; its form is in refs. 19, 28
#    and 29, which were not supplied. Readings for the STRF used in projections (a) the significant
#    STRF; (b) the full STRF. The number of random segments and the x bins are standard choices.
# D13 FSI details beyond ref. 19 (the similarity index as the correlation coefficient between the
#    STRF and the stimulus segment; the number of random segments) are standard choices; the STRF
#    used follows the readings of D12.
# D14 Resting membrane potential is not defined. Readings (a) the median membrane potential over
#    the tone recording; (b) the mean over the pre-tone baselines.
# D15 TRF details. TRF region readings (a) the set of responsive tones; (b) the tones inside the
#    V-shaped outline above the threshold curve. Bandwidth30 readings (a) log2 of the highest over
#    the lowest responsive frequency at the threshold level + 30 dB; (b) the contiguous responsive
#    range around CF at that level. Spike bandwidth30 uses tones that evoked a spike. Q30 and Q
#    readings (a) bandwidth in kHz, the usual Q; (b) bandwidth in octaves.
# D16 The PSP amplitude and kinetics of Fig. 1 ("maximum PSP amplitude", rise and decay).
#    Readings (a) the largest tone-evoked PSP of each neuron; (b) the mean over its responsive
#    tones. Kinetics are measured on PSPs without spikes, a standard choice.
# D17 How the "power fit" Pearson r of Fig. 6f, g is computed. Readings (a) Pearson r on the raw
#    values; (b) Pearson r on log values, the linear form of a power law.
#
# Tolerances. Where the paper gives mean +- s.d., the tolerance is the s.d., the paper's stated
# spread (protocol, Reader, step 3); otherwise 10% of the value. Counts of recorded neurons are
# given tolerance 0, as the data set holds them or does not; counts that come out of an analysis
# (how many neurons pass a test) get 10%.
