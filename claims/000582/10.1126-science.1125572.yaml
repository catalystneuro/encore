# Claims for Sargolini et al. (2006) on dandiset 000582.
# Source: the paper's abstract. The paper is not open access, so no
# figure-level claims are listed.
# Quotes from the abstract added 2026-10-19 where it states the finding; the rest are marked
# inferred (no open full text).
# Quotes and statistics added 2026-10-20 from the full text (PDF of the version of record, and its
# supplement).
schema_version: 1
dandiset: "000582"
paper: doi:10.1126/science.1125572
claims:
- id: layer2-grid
  statement: Layer II of the medial entorhinal cortex was predominated by grid cells.
  source: Main text, paragraph 2; Fig. 1D; table S1A
  quote: The proportion of cells with a sinusoidal modulation was layer-dependent (Fig. 1D and table
    S1). Whereas most well-separated layer II cells had strongly periodic firing fields, only a
    smaller proportion of the deeper neurons had such characteristics
- id: deep-hd-conjunctive
  statement: In the deeper layers, grid cells colocalized with head-direction cells and with
    conjunctive grid x head-direction cells.
  source: Main text, paragraphs 4 and 5; Fig. 2E; Fig. 3E; table S1B
  quote: Beneath layer II, grid cells were colocalized with head-direction cells ... The proportion
    of grid cells with conjunctive properties was layer-dependent (table S1) ... No conjunctive cells
    were observed in layer II.
  statistics:
  - test: chi-square test
    statistic: χ(3) = 28.4
    p: 0.001
    p_relation: "<"
- id: speed
  statement: All cell types were modulated by running speed.
  source: Main text, paragraph 6; Fig. 4B
  quote: Yet, regression analyses showed a consistent positive speed-rate relation in nearly all grid
    cells ... suggesting that a substantial proportion of the network expressed information about
    how fast the animal was moving (Fig. 4B).
