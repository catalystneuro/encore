    head-direction criteria) by the SOM, readings O1 to O4. The paper does not give the table its
    chi-square was run on, and the counts of table S1B do not yield 28.4 and 6.2 under the
    obvious tables. Readings are (a) conjunctive against non-conjunctive grid cells per layer,
    the proportion the text describes; (b) conjunctive cells against all other cells per layer.
    Reproduced when, under a reading, both chi-square tests are significant (p < 0.001 for four
    layers, p < 0.05 for layers III to VI) and the four fractions are within tolerance; partially
    reproduced when no layer II cell is conjunctive and the four-layer test is significant but a
    fraction or the three-layer test fails. Layer V holds 10 grid cells in the paper, so its
    fraction is coarse.
- id: gridness-hd-continuous
  statement: Grid cells and head-direction cells formed overlapping populations; the joint
    distribution of gridness and directional tuning was continuous, with some grid cells
    directionally tuned and some head-direction cells having grid structure.
  source: Main text, paragraph 5; Fig. 3, A to E; fig. S7
  quote: Grid cells and head-direction cells formed overlapping populations. The 2D distribution of
    gridness and directional tuning was continuous, such that some grid cells were directionally
    tuned and some head-direction cells had grid correlates (Fig. 3, A to D, and fig. S7).
  depends_on:
  - deep-hd-conjunctive
  criterion: Two-LED rats, all cells, gridness against Watson U2 (log scale) as in Fig. 3E. The
    paper gives no test of continuity. Reproduced when conjunctive cells exist (cells passing both
    criteria) and, under readings O1 to O4, the cells passing either criterion form no separate
    clusters; the last part is read as the absence of a gap, along each axis, wider than a
    quarter of that axis's range among them, a standard choice and not the paper's.
- id: conj-tuning-similar
  statement: Directional tuning of conjunctive cells did not differ from that of pure head-direction
    cells (mean U2 18.0 against 19.4, P > 0.05).
  source: Main text, paragraph 5; Fig. 3, D and E
  quote: The degree of directional tuning in cells that met selection criteria for both gridness and
    directionality was not significantly different from that of pure headdirection cells (mean U2
    values, 18.0 and 19.4, respectively; P 9 0.05) (Fig. 3, D and E).
  statistics:
  - test: not named
    p: 0.05
    p_relation: ">"
    n: 53 conjunctive and 220 head-direction cells (table S1B)
  expected:
  - quantity: mean Watson U2, conjunctive cells
    value: 18.0
    tolerance: 1.8
  - quantity: mean Watson U2, pure head-direction cells
    value: 19.4
    tolerance: 1.94
  depends_on:
  - deep-hd-conjunctive
  criterion: A claim of absence; the paper names the level but not the test. Readings are (a) a
    two-sided t-test, (b) a two-sided Mann-Whitney test, of U2 in conjunctive against pure
    head-direction cells, at p < 0.05. Reproduced when no reading finds a difference; not
    reproduced when all do; methods_underspecified when they disagree. A reproduced absence with
    means outside tolerance is partially reproduced.
- id: cue-rotation-coherent
  statement: Cells with different degrees of gridness and directionality always responded as a
    coherent ensemble to rotation of a polarizing cue card; in the example (layer VI, Fig. 3F and
    fig. S8), a grid cell and four head-direction cells were recorded together, the head-direction
    cells all rotated 90 degrees with the card, and the grid cell's map is shown following it.
  source: Main text, paragraph 5; Fig. 3F; fig. S8
  quote: Cells with different degrees of gridness and directionality always responded as a coherent
    ensemble during environmental manipulations such as the rotation of a polarizing cue card (Fig.
    3F and fig. S8) (22).
  criterion: The cue-rotation sessions of the five rats tested (small circular box, card rotated 90
    degrees and back). The paper gives no measure of rotation. For each cell, the rotation from
    the standard trial to the rotated trial is the angle that maximizes (a) for grid structure,
    the correlation between the rotated standard rate map and the rotated-trial map, in 6-degree
    steps; (b) for head-direction tuning, the correlation of the 60-bin tuning curves under
    circular shift. Coherent means all cells of a session rotate by the same angle; readings of
    "the same" are within (a) 18 degrees (three tuning bins) and (b) 30 degrees of each other.
    Reproduced when every session with two or more cells is coherent under both readings;
    methods_underspecified when they disagree. The rotation of each session relative to the 90
    degrees of the card is reported.
- id: speed
  statement: Regression showed a consistent positive speed-rate relation in nearly all grid cells
    (141 of 150), head-direction cells (153 of 220) and conjunctive cells (45 of 53).
  source: Main text, paragraph 6; Fig. 4, A and B
  quote: Yet, regression analyses showed a consistent positive speed-rate relation in nearly all grid
    cells (141/150 cells, P G 0.001), headdirection cells (153/220 cells, P G 0.001) and grid ...
    head-direction cells (45/53 cells, P G 0.001), suggesting that a substantial proportion of the
    network expressed information about how fast the animal was moving (Fig. 4B).
  expected:
  - quantity: fraction of grid cells with a significant positive speed-rate relation (141 of 150)
    value: 0.94
    tolerance: 0.094
  - quantity: fraction of head-direction cells (153 of 220)
    value: 0.695
    tolerance: 0.070
  - quantity: fraction of conjunctive cells (45 of 53)
    value: 0.849
    tolerance: 0.085
  depends_on:
  - layer2-grid
  - deep-hd-conjunctive
  criterion: Per cell, speed and firing rate in 1-s bins over the trial, unsmoothed, all bins kept
    including those outside firing fields, and a linear regression of rate on speed (SOM, Velocity
    tuning). Which cells count is open, with readings (a) a cell counts when the slope is positive with
    P < 0.001, the per-cell reading of the main text's "141/150 cells, P < 0.001"; (b) a cell
    counts when the slope is positive, as the Fig. 4B legend says ("Nearly all ... had positive
    slope values"), the P < 0.001 then being a test of the count across cells that the paper does
    not name; under (b) the count is also tested against half the cells by a one-sided binomial
    sign test at p < 0.001, a standard choice. Grid cells are
    the 150 grid cells that are not conjunctive (203 - 53), which include the grid cells of the
    single-LED rats; head-direction and conjunctive cells from the two-LED rats. Open details,
    each with readings. Speed in a 1-s bin is (a) the path length of the tracked positions over
    the bin, (b) the distance between the positions at the start and end of the bin; positions
    are (a) the 15-point mean-filtered positions of the place-field Methods, (b) the raw tracked
    positions. Trials as O1. The significance of the relation is that of (a) the regression slope,
    (b) Pearson's r, (c) Spearman's rank correlation, which the SOM reports gave nearly identical
    values. Reproduced when, under a combination of readings, all three fractions are within
    tolerance; partially reproduced when the grid and conjunctive fractions exceed the
    head-direction fraction and all exceed one half but a fraction is outside tolerance.
    methods_underspecified when readings disagree between these outcomes.
- id: speed-slope-steeper
  statement: The slope of the speed-rate regression was steeper for conjunctive cells and grid
    cells than for head-direction cells, and did not differ between conjunctive and grid cells.
  source: Main text, paragraph 6; Fig. 4B
  quote: The slope of the regression line was steeper for conjunctive cells and grid cells than for
    headdirection cells EF(2,422) 0 5.5, P G 0.005; conjunctive versus head-direction, P 0 0.009;
    grid versus head-direction, P 0 0.01; conjunctive versus grid, P 0 0.60; Tukey HSD test).
  statistics:
  - about: slope across the three cell classes
    test: ANOVA
    statistic: F(2,422) = 5.5
    p: 0.005
    p_relation: "<"
    n: 423 cells (150 grid, 220 head-direction, 53 conjunctive)
  - about: conjunctive against head-direction
    test: Tukey HSD test
    p: 0.009
  - about: grid against head-direction
    test: Tukey HSD test
    p: 0.01
  - about: conjunctive against grid
    test: Tukey HSD test
    p: 0.60
  depends_on:
  - speed
  criterion: Slopes from the regressions of the speed claim, all 423 cells, with its readings.
    One-way ANOVA of slope on cell class and Tukey HSD (main text). Reproduced when the ANOVA has
    p < 0.005, Tukey gives conjunctive and grid each steeper than head-direction at p < 0.05 and
    conjunctive against grid p > 0.05. Partially reproduced when the ANOVA is significant at
    p < 0.05 and one of the two comparisons with head-direction is significant. The printed
    F(2,422) has one more error degree of freedom than 423 cells in three groups allow (420); the
    degrees of freedom are reported.
- id: speed-intercept
  statement: The intercept of the speed-rate regression was positive in all cells but one (422 of
    423), and mean rates at the lowest speeds (0 to 3 cm/s) were about 2.3 to 2.5 Hz in each cell
    class, so firing persisted during brief stops.
  source: Main text, paragraph 6; Fig. 4C
  quote: The yintercept of the regression line was positive in 422 out of 423 cells (Fig. 4C).
    Average rates at the lowest velocity (0 to 3 cm/s) were 2.26 T 0.03 Hz (grid cells), 2.50 T
    0.02 Hz (headdirection cells) and 2.39 T 0.05 Hz (grid ... head-direction cells).
  expected:
  - quantity: fraction of cells with a positive intercept (422 of 423)
    value: 0.998
    tolerance: 0.0998
  - quantity: mean rate at 0 to 3 cm/s, grid cells
    value: 2.26
    tolerance: 0.03
    unit: Hz
  - quantity: mean rate at 0 to 3 cm/s, head-direction cells
    value: 2.50
    tolerance: 0.02
    unit: Hz
  - quantity: mean rate at 0 to 3 cm/s, conjunctive cells
    value: 2.39
    tolerance: 0.05
    unit: Hz
  depends_on:
  - speed
  criterion: Regressions and readings as in the speed claim. The tolerances on the rates are the
    paper's printed spread, whose kind (SEM or SD) is not stated. The paper does not say how the
    average was taken; readings are (a) the mean over cells of each cell's mean rate in the 1-s
    bins with speed from 0 to 3 cm/s; (b) the mean over all such bins of all cells of a class
    pooled. Reproduced when, under a reading, the fraction is within tolerance and the three
    rates are within their tolerances; partially reproduced when the fraction holds and the rates
    are within 10% of the printed values.
