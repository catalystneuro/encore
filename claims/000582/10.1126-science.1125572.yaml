# Claims for Sargolini, Fyhn, Hafting, McNaughton, Witter, Moser & Moser (2006) on dandiset 000582.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-20,
# protocol as stated in docs/protocol.md (pilot-10).
#
# Text read: the version of record (Science 312, 758-762, PDF supplied by a person, text extracted
# with PyMuPDF), with its Supporting Online Material (sargolini_som.pdf: Materials and Methods, figs.
# S1 to S9, table S1). The extracted text garbles symbols: "P G" is P <, "P 9" is P >, "r 0" is
# r =, "c(3)" is chi-square with 3 degrees of freedom, "T" is plus or minus. The numbers of table S1
# were read from the extracted text and agree with every total and percentage the paper prints.
# The paper links no code; no code was read.
#
# What changed. This file replaces an attempt written from the abstract only. The three claims of
# that attempt keep their ids (layer2-grid, deep-hd-conjunctive, speed) and their findings; each
# now has the paper's numbers and a criterion. layer2-grid now classifies grid cells by the paper's
# own criterion, gridness above 0 (SOM, Autocorrelation of rate maps), and no stricter cut.
# deep-hd-conjunctive now holds the per-layer proportions of conjunctive cells and the chi-square.
# speed no longer lists P < 0.001 as a statistic, as it is the threshold used to count cells.
# New claims cover the findings the old file left out: grid cells in every layer, the gridness
# range, grid stability, grid spacing and field size along the dorsoventral axis, grid phase and
# orientation, head-direction cells by layer, their tuning breadth, range of directions,
# stability and colocalization with grid cells, the continuum of gridness and directionality,
# tuning of conjunctive cells, the coherent response to cue rotation, the slope comparison and the
# intercepts of the speed regression.
#
# Data the paper used (SOM, Subjects; Recording procedures; Spike sorting; Histology). Seventeen
# male Long Evans rats, 3 to 5 months old, implanted with 4 tetrodes in dorsocaudal MEC (five rats
# with a second drive in the other hemisphere). Each rat foraged for chocolate crumbs in two
# successive 10-min trials in the same familiar enclosure, 10 min apart: a circular box of 90 or
# 180 cm diameter, or a square box of 100 or 150 cm. In five rats a cue card was rotated 90 degrees
# and back on separate trials in the small circular box. Position from an overhead camera at
# 50 Hz; nine rats had two LEDs (red and green, 7 cm apart), giving head direction, and only their
# cells (449 of 627) were used for directional analyses; eight rats had a red LED only. 627 cells
# were sorted, assigned to layers II, III, V and VI by histology, with each recording site's
# distance from the postrhinal border measured in sagittal sections. Table S1A gives cells and
# grid cells per layer for all 17 rats; table S1B gives grid, head-direction, conjunctive and other
# cells per layer for the nine two-LED rats. The Histology section speaks of 16 rats, the rest of
# the paper of 17. The dandiset's description says it holds spike times of grid cells and LED
# positions, a sample of the paper's data; whether it holds the cells, layers, distances and
# trials a claim needs is the author's to find.
#
# Methods common to the criteria, all from the SOM Materials and Methods unless said otherwise.
# Positions from the red LED, smoothed with a 15-point mean filter. Rate maps in 3 x 3 cm bins,
# each bin's rate the Gaussian-kernel-smoothed spike count over the kernel-smoothed occupancy
# (h = 3), bins more than 3 cm from the path unvisited. Spatial autocorrelogram by Pearson
# correlation over lags, not estimated where fewer than 20 bins overlap. Gridness: the
# autocorrelogram rotated in 6-degree steps and correlated with the original, within a circle
# around the outermost of the six peaks closest to the centre (peaks are 100 or more contiguous
# pixels of 1.5 x 1.5 cm above a threshold, in most cases r = 0.10; with fewer than six peaks, the
# outermost found), the central peak left out; gridness is the lower of the correlations at 60
# and 120 degrees minus the highest at 30, 90 and 150 degrees; a grid cell has gridness above 0.
# Grid spacing is the median distance from the centre to the six inner peaks; orientation the
# angle from a camera-fixed reference to the nearest inner peak counterclockwise. Head direction
# from the two LEDs; tuning curve in 60 bins of 6 degrees, unsmoothed; breadth the angular
# standard deviation of the mean vector. A head-direction cell has a significant Watson U2 test
# of head directions at spikes against all tracked head directions, and a significant Pearson
# correlation of its 60-bin rate distribution between alternating 1-min blocks (odd against even
# minutes). A conjunctive cell meets both the grid and the head-direction criteria. Speed in 1-s
# bins, unsmoothed, regressed linearly against firing rate per cell.
#
# Details the paper leaves open, used by several criteria, each with the readings the text
# allows; every reading is run.
# (O1) Trials. Rate maps, gridness and tuning are computed (a) on the two trials pooled, as the
#   figures show both trials together, or (b) on each trial, a cell passing when it passes in
#   the first trial.
# (O2) Autocorrelogram pixels. The rate map has 3 cm bins but peaks are counted in 1.5 cm pixels:
#   (a) the autocorrelogram of the 3 cm map, peaks of 25 or more contiguous bins (the same area);
#   (b) a rate map in 1.5 cm bins with the same smoothing, peaks of 100 pixels.
# (O3) The gridness circle. Its radius is (a) the distance from the centre to the outermost peak's
#   centre plus that peak's radius (the circle encloses the peak), or (b) the distance to the
#   outermost peak's centre. The central peak is removed (a) as its contiguous pixels above the
#   threshold, or (b) as a disc of the radius of that peak. The threshold is r = 0.10; the paper's
#   "in most cases" leaves the others unknown.
# (O4) Significance level for the head-direction criteria (Watson U2 and the block correlation).
#   Not stated: (a) 0.05, the level the paper reports for its tests elsewhere; (b) 0.01.
#   Watson U2 is the two-sample test on the head direction at each spike against the head
#   direction at each tracker sample.
# A claim reproduced under one combination of readings and not under another is blocked as
# methods_underspecified, with every result shown, unless its criterion says otherwise.
