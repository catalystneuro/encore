schema_version: 1
dandiset: "000582"
paper: doi:10.1126/science.1125572
claims:
- id: layer2-grid
  statement: Layer II of the medial entorhinal cortex was predominated by grid cells.
  source: Abstract
  quote: Whereas layer II was predominated by grid cells
- id: deep-hd-conjunctive
  statement: In the deeper layers, grid cells colocalized with head-direction cells and with
    conjunctive grid x head-direction cells.
  source: Abstract
  quote: grid cells colocalized with head-direction cells and conjunctive grid x head-direction
    cells in the deeper layers.
- id: speed
  statement: All cell types were modulated by running speed.
  source: Abstract
  quote: All cell types were modulated by running speed.
