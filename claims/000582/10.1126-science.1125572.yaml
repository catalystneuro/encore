- id: grid-phase-orientation
  statement: In all layers the spatial phase of nearby grid cells was distributed (their vertices
    were offset), while grid orientation was consistent across simultaneously recorded cells.
  source: Main text, paragraph 3, last sentence; fig. S2 legend
  quote: In all layers, the phase of the grid was distributed, i.e., the vertices of most nearby grid
    cells were offset relative to each other, but the orientation of the grids was consistent
    across all simultaneously recorded cells.
  criterion: Pairs of grid cells recorded simultaneously (same rat and trial), orientation as in the
    SOM, compared modulo 60 degrees. The paper gives no measure of phase offset and no threshold
    for either part. Orientation is consistent when the within-session pairwise differences are
    smaller than the differences between sessions of different rats (the fig. S2 legend ascribes
    the broad range of orientations to differences between rats), by a one-sided Mann-Whitney
    test at p < 0.05; this test is a standard choice, not the paper's. Phase is distributed when,
    for most pairs (more than half), the peak of the rate-map crosscorrelogram nearest the centre
    is displaced from the centre; readings for displaced, standard choices since the paper gives
    none, are (a) by more than one fifth of the grid spacing, (b) by more than the 3 cm bin. Reproduced when both parts hold under every
    reading, in each layer with at least one simultaneous pair.
