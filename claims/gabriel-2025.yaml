# Claims for Gabriel, Gupta, Sanchez-Fuentes, Zeidler, Wilke & DeNardo (2025), "Transformations in
# prefrontal ensemble activity underlying rapid threat avoidance learning", Current Biology 35,
# 1128-1136, on dandiset 001887.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the NIH author manuscript in PubMed Central (PMC11916606, NIHMS2055978), as served
# by PMC (paper/10.1016-j.cub.2025.01.010.txt). It holds the Results and Discussion, the legends
# of Figures 1 to 4, the STAR Methods and the key resources table. No PDF was supplied and no
# figure was seen. The supplement is not in the text: the legends of Figures S1 to S4 and
# Tables S1 and S2 (which the paper says hold the further statistics of Figures 1 to 4) were not
# read. The main findings rest on Figures 1 to 4, which are in the text. Claims about findings
# shown only in Figures S1 to S4 are written from the Results sentence that states them, and
# test statistics that the paper keeps in Table S1 (F values, post hoc p-values, Pearson r and
# p for Figure 4) are not recorded; where a claim needs them it says so. The version of record
# was not read.
#
# Code read: Zenodo doi:10.5281/zenodo.13351302 (record 13351302, published 2024-08-27, no
# version number), named in the key resources table as the analysis code. 63 files, MATLAB and
# one Python script. It holds the behaviour post-analysis (batch_PMA_postanalysis_script_BDv15.m,
# compileBehaviorGroups.m, calcAvgPerGroup.m), the compilation of ROC calls into tone, platform
# and freezing categories and mixed cells (genFeatCellResponses.m, genCellResponses.m,
# batch_compare_cell_IDs.m, analyze_BL_LL_cells_CellIDs.m, run_probability_analysis.m), the
# event-triggered mean activity and its per-cell AUC (compile_pooled_avg_heatmaps.m,
# trialAvg.m), the per-animal auROC lists for Figure 2 (allAUCs.m, gen_allAUCs.m,
# compileAUCvalues_by_animal.m), the SVM decoding (a_SVM_permousev3ASF.m, b_plot_svm_v2ASF.m,
# c_plot_svm_Shock_NonshockASF.m, calculatePerformance.m), the CILDS runs and distances
# (run_cilds_batch_script.m, quantCILDS_trials_script.m, quantCILDS_lrn_events_script.m) and the
# Rescorla-Wagner fit ("RW_q-weighted model_Feb 2024.py"). It does not hold the ROC
# computation itself (it calls run_caAnalyze, from the lab's caAnalyze repository, which the
# paper does not link and which was not read), nor the helper functions average_bin,
# normalizeSZ, Zscore_Sz and get_pca_permouse, nor the cumulative-histogram and modulation-score
# step (done in Prism). The Python RW script, as deposited, reads a spreadsheet named for
# another experiment (DAPL_modeling_data_forTG_GRABDA.xlsx); its model is taken as the paper's.
#
# Data the paper used, as it reports them. Female and male C57BL/6J mice, 10 to 16 weeks old,
# AAV1-syn-jGCaMP7f in left prelimbic cortex (PL), 1 mm GRIN lens, V4 miniscope at 30 Hz,
# downsampled by 2 in space and time (15 frames/s, as the code uses). Shocked group (Shk):
# 11 mice in the Animals section (6 female), 11 in the Figure 1 behaviour on day 1 and 8 on day
# 2; 1394 neurons from 9 mice. Non-shocked control group (NS): 7 mice in the Animals section
# (5 female) and in the neuron count (847 neurons from 7 mice), but N = 9 on day 1 and 8 on day
# 2 in the Figure 1 behaviour legend. Day 2 cells, 1031 (Shk) and 967 (NS). Cells registered
# across days with CellReg, 463 from 6 Shk mice and 322 from 7 NS mice. Platform-mediated
# avoidance (PMA), two sessions of about 30 min. Day 1, three baseline 30 s 4 kHz tones without
# shock, then nine tones co-terminating with a 2 s 0.14 mA footshock; day 2, twelve tones with
# shock. NS mice had the same procedure without shocks. Behaviour video at 30 frames/s,
# DeepLabCut keypoints, BehaviorDEPOT 1.51 classifiers for freezing (below a velocity threshold
# for at least 0.9 s), rearing (at least 0.2 s), jumping, and a platform ROI; escape defined by
# hand as being off the platform in the last 2 s of the tone. Measured variables: per-cell
# DeltaF/F0 traces from Minian (the code's "ta_dff"; the CILDS runs use "ta_sigfn"), cell
# footprints, the tone and shock times, and the per-frame platform, freezing, rearing, jumping
# and escape labels; per-trial success (avoided the shock). The paper also deposited "Analyzed
# datasets" on Zenodo (doi:10.5281/zenodo.13381210, Day 1.zip and Day 2.zip, 14 GB); the paper
# does not describe their contents. The dandiset is described as the data collected for and
# analysed in this paper.
#
# Methods fixed here for every claim, with their sources.
# - Trial measures (code, batch_PMA_postanalysis_script_BDv15.m). Time on platform, the fraction
#   of tone frames on the platform. Freezing, the fraction of tone frames freezing (on and off
#   the platform summed, compile_behavior_for_Prism.m). Latency, from tone onset to the first
#   platform entry during the tone, 0 s when the mouse is on the platform at tone onset and 30 s
#   when it never enters. Success, on the platform for at least 0.75 s of the first second of
#   the 2 s shock window (the last 2 s of the tone); the code uses a hand-scored outcome file
#   instead when one exists. For NS mice, the same rule over the window where the shock would
#   have been. The paper defines success only as trials "where mice completely avoided a
#   footshock"; the code's rule is the one used.
# - Blocks (code, calcAvgPerGroup.m). Each day's 12 tones form four blocks of three, each
#   mouse's block value the mean over its three trials. Day 1 block 1 is the baseline.
# - Periods for single-cell encoding. BL, day 1 tones 1 to 3 (Results, Figure 1 legend,
#   Methods). D1 and D2, the end of day 1 and of day 2. The Results and the Figure 1 legend say
#   tones 9 to 12; the Methods (Tracking cell encoding across days) say the last 3 tones, that
#   is tones 10 to 12. Both are readings (P1 tones 9 to 12, P2 tones 10 to 12). The paper does
#   not say which frames of the session belong to a period; the readings are F1, from the
#   onset of the period's first tone to the onset of the tone after its last (the end of the
#   recording after tone 12), and F2, from the end of the tone before the period (the start of
#   the recording for BL) to the end of the period's last tone. Where period and frame
#   readings give different outcomes, the claim is methods_underspecified.
# - ROC calls (Methods, ROC analysis). Per cell and feature, the auROC of the cell's DeltaF/F
#   as a score for the binary per-frame event vector; the null is 1000 circular shuffles of the
#   event timing; excited when the auROC is above 97.5% of the null, suppressed when below
#   2.5%. Event windows: tone onset and offset, the first and last 5 s of the tone; platform
#   entries and exits, from 1 s before to 4 s after; freezing (and jumping, rearing, escape),
#   the bouts. The code's feature vectors (genFeatCellResponses.m) are, for the tone, the whole
#   tone, tone onset and tone offset; for the platform, platform occupancy, entries and exits;
#   and freezing. The routine that computes the auROC is not in the code record.
# - Categories and mixed cells (code, genFeatCellResponses.m and genCellResponses.m). A cell
#   responds to a category (tone, platform, freezing) when the sum of its calls (+1 excited, -1
#   suppressed) over that category's vectors is not zero; a cell with calls of opposite sign
#   that cancel is non-responsive to the category (the code's rule; counting any call is a
#   variant). Tone-only, platform-only and freezing-only cells respond to one category, mixed
#   cells to two or three, non-modulated cells to none.
# - Statistics (Methods, Quantification and Statistical Analysis). Behaviour (Figure 1) and
#   decoding (Figure 3), two-way repeated measures ANOVA with Geisser-Greenhouse correction and
#   Sidak's post hoc test. Cumulative frequency histograms (Figure 2), ordinary two-way ANOVA
#   and Fisher's LSD. RW squared residuals (Figure 4), repeated measures one-way ANOVA with
#   Geisser-Greenhouse correction. Pie charts of Figure 1, chi-square (two-sided, with Yates'
#   correction, Figure 1 legend). All other comparisons, t-test with Welch's correction.
#   Significance at p < 0.05 (figure legends, "*P<0.05").
# - Decoding (Methods, Decoding analysis, and code a_SVM_permousev3ASF.m). Per mouse, day 1
#   trials 4 to 12 (the three baseline trials excluded), each labelled success or failure. The
#   features are each neuron's DeltaF/F averaged in 200 ms bins (3 frames at 15 frames/s), in
#   bins from 20 s before to 50 s after tone onset, one decoder per bin, an RBF SVM (LIBSVM).
#   C and gamma by grid search over 2^-10 to 2^10 in steps of one power of 2, scored by 5-fold
#   cross-validated accuracy on all nine trials (code); then leave-one-trial-out testing with
#   the chosen C and gamma (code; the Methods call it stratified, which a leave-one-out split
#   cannot be). F1 per bin; a bin whose F1 is undefined counts as 0 (code). The positive class
#   for F1 is open: the Methods code success as 1 (reading C1, success positive), while the code
#   counts the failed trial as the positive class (C2). Normalization is open: the Methods say
#   min-max normalized F1 (N1, per mouse, (F1 - min)/(max - min) over the mouse's -20 to 50 s
#   trace); the code calls Zscore_Sz, which is not in the record (N2, per mouse, z-scored over
#   the same trace, with undefined values set to 0). Epoch value per mouse, the mean over the
#   epoch's bins. Epochs (Methods), cue onset 0 to 5 s, pre-shock 23 to 28 s, shock 28 to 33 s,
#   post-shock 34 to 38 s after tone onset; the code's pre-shock epoch is 22 to 27 s (variant)
#   and it adds a pre-cue epoch, -5 to 0 s. Cells for Figure 3B and 3C. The Figure 3 legend says
#   "cells identified by ROC as behaviorally-modulated (platform, tone, or freezing)" and "cells
#   identified by ROC as non-responsive to behavioral features". The code reads four cell sets
#   per mouse from a ROC_IDs file that no deposited script builds (BLplat, LLplat, BLmod, LLmod);
#   its non-modulated cells are those in none of the four, and its modulated decoder uses the
#   LLmod set alone (labels_mod). Readings for modulated cells: K1, any tone, platform or
#   freezing call in the BL or the D1 period; K2, any such call in the D1 period (the code's
#   LLmod, taken as calls in the last tones of day 1). Non-modulated cells, no call in either
#   period (legend and code agree).
# - Rescorla-Wagner model (Methods, and code "RW_q-weighted model_Feb 2024.py"). Per shocked
#   mouse, the per-trial proportion of tone time on the platform, days 1 and 2 concatenated.
#   v starts at the mouse's baseline; after a successful trial t, v(t+1) = v(t) + a*q*(R(t+1) -
#   v(t)); after a failure, v(t+1) = v(t) + a*(1-q)*(R(t+1) - v(t)), R the observed proportion.
#   Fitted by minimizing the mean squared error over trials (code), with a and q bounded in
#   [0, 1] and started at [1, 1] (scipy minimize). The Methods say maximum likelihood; under
#   Gaussian errors of fixed variance this gives the same fit. The code reports alpha_success =
#   q and alpha_failure = 1 - q, as the Methods' "alpha success = 1 - alpha failure" does. The
#   "avoid" learning rate is therefore L1, q (code and Methods); the step actually applied after
#   a success, a*q, is reading L2. Open details: which trials enter (T1, day 1 trials 4 to 12
#   and day 2 trials 1 to 12; T2, all 24 trials), and the baseline seed ("the proportion amount
#   of baseline time animals spent on the platform prior to shock"; S1, the mean proportion of
#   tone time on the platform over day 1 tones 1 to 3; S2, the proportion of time on the
#   platform before the first tone). The shock-only and avoid-only models are not in the code;
#   the reading is the same model with q fixed at 0 (learning after failures only) or at 1
#   (learning after successes only), a free.
# - CILDS (Methods, Dimensionality reduction, and code). Per mouse and day, 3 latent variables,
#   up to 100 EM iterations (code), fitted separately for each epoch on that epoch's window in
#   every trial (Methods; the code's per-window result folders agree). Day 1 uses trials 4 to 12
#   (code, "nBL"); day 2 uses all 12 trials (reading D-a, Methods "for each trial of a session")
#   or trials 4 to 12 (D-b, the code's run script applies the same trial range to both days).
#   Signal, the code's "ta_sigfn" (the Minian output the code passes to CILDS); DeltaF/F is a
#   variant. Epochs: tone onset, 0 to 5 s after tone onset in the Results, 1 to 5 s in the
#   Methods, and -1 to 4 s in the code's folder names (readings W1, W2, W3); pre-shock, 23 to 28 s
#   (Results and Methods; the code's folder says 23 to 28 too); mid-tone 14 to 19 s; mid-ITI
#   -25 to -20 s; pretone -6 to -1 s; post-onset 5 to 10 s. Mice with no successful or no
#   unsuccessful trial in the set are left out (code).
# - Mean Euclidean distance (Methods). Per mouse, the latent trajectory averaged over successful
#   trials and over unsuccessful trials; the Euclidean distance between them at each frame of
#   the epoch, averaged over frames.
# - Trajectory distance (Methods). The Euclidean distance between the start and end points of
#   a trial's latent trajectory in the epoch, on the trial of interest. The code computes a
#   different measure, the mean framewise distance between the trajectory of the trial of
#   interest and that of the trial before (and of the trial after), which is shown as a
#   variant. Trials of interest (Results, and code quantCILDS_lrn_events_script.m): the first
#   shock trial and the first avoidance trial of the day; the code also takes the last shock
#   trial and the last avoidance trial, and on day 1 takes the first avoidance trial after the
#   first shock trial, excluding the first and last trial of the set.
# - Correlations (Figure 4 legend), Pearson's correlation over the shocked mice, N = 8.
#
# Inconsistencies noted in the paper: NS mice number 7 (Animals; neuron counts) but 9 in the
#   Figure 1 day 1 behaviour legend; the end-of-day periods (tones 9 to 12 or last 3 tones); the
#   tone onset epoch (0 to 5 s or 1 to 5 s); "Distance was assessed using 3 measures" names two;
#   the Discussion says aspects of population activity correlated with learning rates in
#   "Figure 4E – H" while the Results say the pre-shock correlations (4F, 4H) were not
#   significant, and the Discussion calls Figure 4J trend-level while the Results report it as
#   a correlation.
#
# Check of 2026-10-21 added claims disc-tone-cells-baseline and fig3a-decoding-peak-preshock,
# from findings stated in the Discussion.
schema_version: 2
dataset:
  archive: dandi
  id: "001887"
paper: doi:10.1016/j.cub.2025.01.010
claims:
- id: data-neurons
  statement: The paper analysed 1394 PL neurons from 9 shocked mice and 847 neurons from 7
    non-shocked mice on day 1, and 1031 (shocked) and 967 (non-shocked) cells on day 2.
  source: STAR Methods, Miniscope data processing; Figure 1K and 1L legends
  quote: We identified 1394 neurons across 9 mice in Shock animals and 847 neurons across 7 mice
    in Non-shock animals.
  expected:
  - quantity: day 1 neurons, shocked
    value: 1394
    tolerance: 0
  - quantity: shocked mice with neurons
    value: 9
    tolerance: 0
  - quantity: day 1 neurons, non-shocked
    value: 847
    tolerance: 0
  - quantity: non-shocked mice with neurons
    value: 7
    tolerance: 0
  - quantity: day 2 cells, shocked
    value: 1031
    tolerance: 0
  - quantity: day 2 cells, non-shocked
    value: 967
    tolerance: 0
  criterion: Counts of accepted cells per session and of mice with imaging, by group and day.
    Tolerance zero, as these are counts of the recorded cells. The day 2 counts are from the
    Figure 1K and 1L legends ("Cells analyzed... Day 2 1031" and "Day 2 967").
- id: data-registered-cells
  statement: Cell registration across days tracked about 40% of neurons, 463 cells from 6
    shocked mice and 322 cells from 7 non-shocked mice.
  source: Results, Learning-induced increase in PL neurons with mixed-selective encoding,
    paragraph 2; Figure 1N legend
  quote: we used cell registration to track ~40% of neurons across sessions (shocked mice ...
    463 cells from 6 mice, NS controls ... 322 cells from 7 mice
  expected:
  - quantity: registered cells, shocked
    value: 463
    tolerance: 0
  - quantity: registered shocked mice
    value: 6
    tolerance: 0
  - quantity: registered cells, non-shocked
    value: 322
    tolerance: 0
  - quantity: registered non-shocked mice
    value: 7
    tolerance: 0
  criterion: Counts of cells matched between day 1 and day 2 (CellReg on the Minian footprints,
    Methods), by group. Tolerance zero for counts. If the dataset holds no registration, the
    claim cannot be tested without redoing it, which the author reports.
- id: fig1e-platform-time
  statement: During learning, shocked mice spent a progressively larger fraction of the tone on
    the safety platform, and this differed from non-shocked controls.
  source: Results, Tracking changes in PL activity during PMA; Figure 1E
  quote: During learning, shocked mice exhibited progressive increases in time spent on the
    platform ... These behaviors were significantly different than NS controls
  criterion: Per mouse, the fraction of tone time on the platform in blocks of three tones on
    each day (opening comment). Two-way repeated measures ANOVA (group by block) with
    Geisser-Greenhouse correction and Sidak's post hoc tests, per day (Methods; Figure 1
    legend, day 1 Shk N=11, NS N=9; day 2 Shk N=8, NS N=8). Reproduced when in shocked mice the
    day 1 block means rise from block 1 to block 4 with at least one Sidak-corrected block
    difference at p < 0.05, and at least one Sidak comparison of shocked against NS mice at a
    block is p < 0.05 on day 1 or day 2. The Sidak family is not stated; readings are all
    pairwise block comparisons within the shocked group, and each block against block 1; both
    are run.
- id: fig1f-successful-trials
  statement: Shocked mice showed a progressive increase in the proportion of successful trials,
    in which the footshock was completely avoided, which differed from non-shocked controls.
  source: Results, Tracking changes in PL activity during PMA; Figure 1F
  quote: in the proportion of successful trials (where mice completely avoided a footshock)
  criterion: As fig1e-platform-time, with the per-mouse proportion of successful trials per
    block (success rule in the opening comment).
- id: fig1g-freezing
  statement: Shocked mice showed a progressive increase in freezing during the tone, which
    differed from non-shocked controls.
  source: Results, Tracking changes in PL activity during PMA; Figure 1G
  quote: and in freezing levels
  criterion: As fig1e-platform-time, with the per-mouse fraction of tone time freezing per
    block (BehaviorDEPOT freezing labels).
- id: fig1h-latency
  statement: Shocked mice showed a progressive decrease in the latency to enter the platform
    after tone onset, which differed from non-shocked controls.
  source: Results, Tracking changes in PL activity during PMA; Figure 1H
  quote: and a progressive decrease in latency to enter the platform during the tone
  criterion: As fig1e-platform-time, with the per-mouse latency per block (opening comment), and
    with the day 1 block means falling from block 1 to block 4 in shocked mice.
- id: fig1kl-overall-encoding-similar
  statement: In each period (BL, D1, D2), the overall proportion of PL neurons encoding PMA
    features was similar between shocked and non-shocked mice, and it increased modestly
    across learning.
  source: Results, Learning-induced increase in PL neurons with mixed-selective encoding,
    paragraph 1; Figure 1K and 1L (black and gray pie charts)
  quote: In each period (BL, D1, D2), the overall proportion of PL neurons encoding PMA features
    was similar between groups and modestly increased across learning
  criterion: Per period and group, the fraction of all recorded cells (Figure 1K and 1L
    denominators) responsive to at least one of tone, platform or freezing (opening comment).
    The paper compares pie charts with chi-square (Methods; two-sided with Yates' correction,
    Figure 1 legend) and reports no test for this. Similar is judged by that test, a 2x2
    chi-square with Yates' correction of responsive against non-responsive cells, shocked
    against NS, in each period; it holds when p >= 0.05 in all three periods. The increase holds
    when in each group the D2 fraction exceeds the BL fraction. Run under each period and frame
    reading (opening comment).
- id: fig1kl-day1-categories-similar
  statement: On day 1, shocked and non-shocked mice had similar proportions of PL neurons
    encoding the tone, the safety platform, freezing, or their combinations.
  source: Results, Learning-induced increase in PL neurons with mixed-selective encoding,
    paragraph 1; Figure 1K and 1L (colored wheel plots); Figure S1F, G
  quote: On day 1, shocked and NS control mice had similar proportions of PL neurons that
    encoded the tone, safety platform, freezing behavior, or their combinations
  criterion: For BL and D1, among the responsive cells, the counts of tone-only, platform-only,
    freezing-only and mixed cells, shocked against NS. The paper's test for these pie charts is
    the two-sided chi-square with Yates' correction (Methods; Figure 1 legend), applied as for
    the day 2 mixed cells, a 2x2 table of the category against the other responsive cells.
    Reproduced when no category gives p < 0.05 in either period; the differences in percentage
    points are given either way. Run under each period and frame reading. Figure S1F and S1G
    were not read.
- id: disc-tone-cells-baseline
  statement: In both shocked and non-shocked mice, the proportion of tone-encoding PL neurons was
    greatest in the baseline period, and the activity of tone-encoding neurons at tone onset was
    similar between groups.
  source: Discussion, paragraph 3; Figure 1K, 1L, 1P1 and 1Q1
  quote: We also revealed that in both shocked and NS control mice, the proportion of
    tone-encoding neurons was greatest during the baseline period, when tones are novel, and
    their activity during tone onset was similar across groups.
  criterion: Proportion, per group and period (BL, D1, D2), the fraction of all cells (Figure 1K
    and 1L denominators) that encode the tone. Which cells count as tone-encoding is open,
    reading G1, any cell responsive to the tone category (opening comment), and G2, tone-only
    cells (the colored wheel plots). The paper gives no test; greatest holds when in each group
    the BL fraction exceeds the D1 and the D2 fractions. Activity, as
    fig1p-platform-exit-excited-day2 for the cells excited and the cells suppressed at tone
    onset (the code's toneonVector and 5 s window; 61 and 52 shocked, 24 and 25 NS on day 1, 34
    and 37 shocked, 34 and 22 NS on day 2, STAR Methods, Cells Analyzed for Figure 1), Welch's
    t-test of shocked against NS on each day; similar holds when none gives p < 0.05, with the
    differences reported. Reproduced when both parts hold. Run under each period and frame
    reading and under G1 and G2; where they give different outcomes the claim is
    methods_underspecified.
- id: fig1k-mixed-day2
  statement: By day 2, shocked mice had a significantly larger proportion of mixed-selective PL
    neurons (encoding more than one PMA feature) than non-shocked mice, 51% against 25%.
  source: Results, Learning-induced increase in PL neurons with mixed-selective encoding,
    paragraph 1; Figure 1K-M
  quote: By day 2, shocked mice had a significantly greater proportion of PL neurons exhibiting
    mixed selectivity (i.e., encoding multiple features of PMA; shocked ... 51%, non-shocked ...
    25%
  statistics:
  - test: two-sided chi-square with Yates' correction
    statistic: chi-square = 43.13, df = 1, z = 6.567
    p: 0.0001
    p_relation: <
    n: day 2 cells of shocked and non-shocked mice
  expected:
  - quantity: mixed cells on day 2, shocked
    value: 51
    tolerance: 5.1
    unit: percent
  - quantity: mixed cells on day 2, non-shocked
    value: 25
    tolerance: 2.5
    unit: percent
  criterion: Mixed cells on day 2 (period D2, opening comment), shocked against NS, 2x2
    chi-square with Yates' correction (Figure 1K legend). The denominator is open. Reading R1,
    the responsive cells (the multi-colored pie charts show "profiles of" encoding cells,
    Figure 1K legend); reading R2, all day 2 cells (1031 and 967). A chi-square near 43 with
    51% against 25% needs about 300 cells per group, which fits R1 and not R2, but both are
    shown. Reproduced when under a reading the percentages fall within tolerance and the test
    gives p < 0.05 with shocked higher. Run under each period and frame reading.
- id: fig1o-tone-to-mixed
  statement: Among registered cells, neurons that selectively encoded the tone at the end of day
    1 were more likely to be mixed-selective on day 2 in shocked mice than in non-shocked mice.
  source: Results, Learning-induced increase in PL neurons with mixed-selective encoding,
    paragraph 2; Figure 1O
  quote: In shocked mice, neurons that selectively encoded the tone at the end of day 1 were
    more likely to exhibit mixed selectivity on day 2 compared to NS controls
  statistics:
  - test: two-sided chi-square with Yates' correction
    statistic: chi-square = 4.097, df = 1, z = 2.024
    p: 0.043
    n: registered cells, 463 from 6 shocked and 322 from 7 non-shocked mice
  depends_on:
  - data-registered-cells
  criterion: Registered cells only (Methods, Tracking cell encoding across days). Among the cells
    that were tone-only at D1, the fraction that are mixed at D2, shocked against NS, 2x2
    chi-square with Yates' correction (Figure 1O legend). Reproduced when the shocked fraction
    is higher and p < 0.05. Run under each period and frame reading.
- id: fig1o-nonmod-to-mixed
  statement: Among registered cells, neurons not modulated at the end of day 1 were more likely
    to become mixed-selective on day 2 in shocked mice than in non-shocked mice.
  source: Results, Learning-induced increase in PL neurons with mixed-selective encoding,
    paragraph 2; Figure 1O
  quote: Non-modulated neurons were also more likely to develop mixed selectivity on day 2 in
    shocked mice
  statistics:
  - test: two-sided chi-square with Yates' correction
    statistic: chi-square = 10.66, df = 1, z = 3.265
    p: 0.001
    n: registered cells, 463 from 6 shocked and 322 from 7 non-shocked mice
  depends_on:
  - data-registered-cells
  criterion: As fig1o-tone-to-mixed, for the cells non-modulated (no tone, platform or freezing
    response) at D1.
- id: fig1p-platform-exit-excited-day2
  statement: On day 2, platform-excited neurons of shocked mice showed a large increase in
    activity after platform exits compared with non-shocked mice.
  source: Results, Learning-induced increase in PL neurons with mixed-selective encoding,
    paragraph 3; Figure 1P3
  quote: Shocked mice had a large increase in the activity of platform-excited neurons following
    platform exits on day 2
  expected:
  - quantity: day 2 platform-exit excited cells, shocked
    value: 104
    tolerance: 10.4
  - quantity: day 2 platform-exit excited cells, non-shocked
    value: 100
    tolerance: 10
  criterion: Method from compile_pooled_avg_heatmaps.m and trialAvg.m, where the Methods are
    silent. Cells are those called excited for platform exits on day 2, by an ROC over the whole
    session (the code uses the session-wide vectors; cell counts in the STAR Methods, Cells
    Analyzed for Figure 1). For each cell, DeltaF/F averaged over all exits of the session in a
    window from 4 s before to 4 s after the exit (exits whose window leaves the recording are
    dropped), z-scored by the mean and SD of its pre-exit half, and the area (trapezoid sum over
    frames at 15 frames/s) of the post-exit half. Welch's t-test of these per-cell areas, cells
    pooled across mice, shocked against NS (Figure 1P legend). Reproduced when the shocked mean
    is higher and p < 0.05.
- id: fig1q-platform-exit-inhibited-day2
  statement: On day 2, the activity of platform-inhibited neurons after platform exits did not
    differ between shocked and non-shocked mice.
  source: Results, Learning-induced increase in PL neurons with mixed-selective encoding,
    paragraph 3; Figure 1Q3
  quote: but no differences in the activity of platform-inhibited neurons
  criterion: As fig1p-platform-exit-excited-day2, for cells called suppressed for platform exits
    on day 2 (74 shocked, 82 NS in the STAR Methods). The paper's test is Welch's t-test at
    p < 0.05; reproduced when it gives p >= 0.05, with the difference of means reported.
- id: fig1pq-freezing-day2
  statement: On day 2 there were subtle differences between shocked and non-shocked mice in the
    activity of freezing-modulated neurons after freezing onset and offset.
  source: Results, Learning-induced increase in PL neurons with mixed-selective encoding,
    paragraph 3; Figure 1P2 and 1Q2
  quote: On day 2, there were subtle changes in activity following freezing onset and offset
  criterion: As fig1p-platform-exit-excited-day2, for freezing-excited and freezing-suppressed
    cells on day 2 (171 and 283 shocked, 150 and 198 NS), aligned to freezing onset and to
    freezing offset with a 3 s window on each side (code). The paper does not say which
    comparison differed or in which direction. Reproduced when at least one of the four Welch's
    t-tests (excited or suppressed, onset or offset) gives p < 0.05; the four results are
    reported.
- id: fig1r-mixed-exit-day1
  statement: Excited mixed-selective neurons showed a significant increase in activity during
    platform exits in shocked mice on day 1 only, not on day 2.
  source: Results, Learning-induced increase in PL neurons with mixed-selective encoding,
    paragraph 3; Figure 1R3
  quote: Excited mixed selective neurons exhibited a significant increase in activity during
    platform exits only on day 1
  criterion: As fig1p-platform-exit-excited-day2, for mixed cells (opening comment) that are
    excited, aligned to platform exits, on day 1 and on day 2. Which mixed cells enter is open,
    readings M1, mixed cells with an excited platform-exit call, and M2, mixed cells whose calls
    include any excited call (the code's split into excited and suppressed mixed cells counts
    a cell as excited when any call is excited). Reproduced when Welch's t-test gives shocked
    higher with p < 0.05 on day 1 and p >= 0.05 on day 2.
- id: figs1h-exit-not-shock
  statement: The larger platform-exit response of platform-excited neurons in shocked mice on
    day 2 was not due to premature exits followed by footshocks.
  source: Results, Learning-induced increase in PL neurons with mixed-selective encoding,
    paragraph 3; Figure S1H
  quote: This was not due to premature platform exits resulting in footshocks
  depends_on:
  - fig1p-platform-exit-excited-day2
  criterion: The Methods (ROC analysis) split exit bouts by whether the 2 s after the exit hold
    a shock. As fig1p-platform-exit-excited-day2 with exits followed by a shock within 2 s
    removed. Reproduced when shocked mice remain higher with Welch's p < 0.05. Figure S1H was not
    read.
- id: figs2-innate-behaviors
  statement: Escape, jumping and rearing were rare; shocked mice jumped more on day 1; few PL
    neurons encoded these behaviors and their activity was similar between groups, except
    escape-excited neurons, which were more active in shocked mice on both days.
  source: Results, Learning-induced increase in PL neurons with mixed-selective encoding,
    paragraph 4; Figure S2
  quote: While these behaviors were relatively rare ( Figure S2C - E ), shocked mice jumped more
    on day 1 ... Shocked mice had significantly higher levels of activity in escape-excited
    neurons on both days
  criterion: Figure S2 was not read, and its tests are not in the main text; the Methods give
    Welch's t-test for comparisons not otherwise named. Jumping, per mouse, the number of
    jumping bouts on day 1, shocked against NS, Welch's t-test p < 0.05 with shocked higher.
    Activity, as fig1p-platform-exit-excited-day2, for escape-excited cells aligned to escape
    onset, on each day, Welch's t-test p < 0.05 with shocked higher on both days. Similar
    activity, as fig1p-platform-exit-excited-day2 for the other cells excited or suppressed for
    escape, jumping or rearing, on each day, Welch's t-test; it holds when none gives p < 0.05
    (the paper's test, with the differences reported). That these behaviors were rare and that
    few neurons encoded them is reported as counts and not judged, as Figure S2 was not read.
    The averaging window for escape, jumping and rearing is not given; the code uses 5 s for
    the tone, 4 s for the platform and 3 s for freezing on each side of the event, so the
    readings are 3, 4 and 5 s; where they give different outcomes the claim is
    methods_underspecified. Reproduced when the jumping, escape-excited and similar-activity
    parts all hold.
- id: fig2-day1-tone-stronger
  statement: On day 1, neurons encoding platform entries or exits were more strongly modulated
    when the entry or exit occurred during the tone than during the inter-tone interval, in both
    shocked and non-shocked mice.
  source: Results, Enhanced encoding of avoidance actions during threatening cues, paragraph 1;
    Figure 2C1 and 2D1
  quote: On day 1, neurons encoding platform entries or exits were more strongly modulated
    during the tone for both shocked and NS control mice
  criterion: Per cell called excited or suppressed for platform entries (or exits) during the
    tone, and separately during the ITI (code vector names such as itiPlatentVector), the auROC,
    with suppressed values folded as 1 - auROC (Methods, Frequency distributions of auROC
    values). Ordinary two-way ANOVA (group by tone/ITI) with Fisher's LSD (Methods). What enters
    the ANOVA is open, reading H1, the folded auROC of each cell pooled across mice, and H2, the
    per-mouse modulation scores of fig2e-modulation-entries. Reproduced when, for entries and
    for exits, the tone values exceed the ITI values with Fisher's LSD p < 0.05 in each group.
- id: fig2-day2-tone-further
  statement: On day 2, shocked mice showed a further increase in the strength of platform entry
    and exit encoding during the tone.
  source: Results, Enhanced encoding of avoidance actions during threatening cues, paragraph 1;
    Figure 2C2 and 2D2
  quote: On day 2, shocked mice had a further increase in encoding strength during the tone
  criterion: As fig2-day1-tone-stronger, on day 2. Reproduced when, for entries and for exits,
    the shocked tone values exceed the NS tone values with Fisher's LSD p < 0.05, and exceed the
    shocked day 1 tone values.
- id: fig2e-modulation-entries
  statement: Per animal, shocked mice had significantly higher modulation scores than
    non-shocked mice for platform entries occurring during the tones on day 2.
  source: Results, Enhanced encoding of avoidance actions during threatening cues, paragraph 1;
    Figure 2E
  quote: Again, shocked mice had significantly higher modulation scores for both platform
    entries and exits occurring during the tones on day 2
  criterion: Per mouse, the folded auROC values of its cells called for platform entries during
    the tone (or during the ITI); mice with fewer than 3 such cells are left out (Methods). The
    modulation score is 1 minus the area under the mouse's cumulative frequency histogram
    (Methods). For an exact cumulative distribution over the auROC axis from 0.5 to 1, this is
    the mean folded auROC; over an axis rescaled to 0 to 1 it is 2 times that mean minus 1;
    the two give the same ANOVA. The histogram bins are not given (Prism); the exact
    cumulative distribution is used, a standard choice that changes the score only by binning.
    Two-way ANOVA (group by tone/ITI) with Fisher's LSD (Methods; Figure 2E legend, day 2 Shk
    N=7, NS N=7). Reproduced when on day 2 the shocked tone score exceeds the NS tone score with
    p < 0.05.
- id: fig2f-modulation-exits
  statement: Per animal, shocked mice had significantly higher modulation scores than
    non-shocked mice for platform exits occurring during the tones on day 2.
  source: Results, Enhanced encoding of avoidance actions during threatening cues, paragraph 1;
    Figure 2F
  quote: shocked mice had significantly higher modulation scores for both platform entries and
    exits occurring during the tones on day 2 ( Figure 2E , F )
  criterion: As fig2e-modulation-entries, for platform exits (Figure 2F legend, day 2 Shk N=6,
    NS N=7).
- id: fig3a-decoding-shock-gt-ns
  statement: Decoding of trial outcome from all recorded PL neurons on day 1 was significantly
    better in shocked than in non-shocked mice in the pre-shock and shock epochs.
  source: Results, Population dynamics prospectively represent trial outcomes early in
    learning; Figure 3A
  quote: Decoder performance using all recorded neurons was significantly greater for shocked
    mice than NS controls in the pre-shock and shock epochs
  criterion: Decoding as in the opening comment, all cells, day 1, per mouse (Figure 3 legend,
    Shk N=7, NS N=7). Two-way repeated measures ANOVA (group by epoch) with Geisser-Greenhouse
    correction and Sidak's test of shocked against NS at each epoch (Methods). Reproduced when
    shocked mice are higher with Sidak p < 0.05 in the pre-shock and in the shock epoch. Run
    under C1 and C2, N1 and N2; the code's pre-shock epoch (22 to 27 s) is shown as a variant.
- id: fig3a-decoding-before-tone
  statement: Decoding performance in shocked mice was already better than in non-shocked mice
    before tone onset.
  source: Results, Population dynamics prospectively represent trial outcomes early in
    learning, paragraph 1; Figure 3A
  quote: Notably, decoding performance was already better even before the onset of the tone.
  depends_on:
  - fig3a-decoding-shock-gt-ns
  criterion: As fig3a-decoding-shock-gt-ns. The Methods define no epoch before the tone; the
    code's pre-cue epoch, -5 to 0 s, is the one used. The paper reports no test for it.
    Reproduced when the shocked mean over that epoch exceeds the NS mean; the Sidak comparison
    is reported beside it and decides nothing.
- id: fig3a-decoding-peak-preshock
  statement: In shocked mice on day 1, decoding of trial outcome peaked immediately before the
    shock.
  source: Discussion, paragraph 5; Figure 3A
  quote: we found that decoder performance peaked immediately before the shock, and further
    showed that decoding trial outcomes was possible before animals established a stable
    avoidance strategy
  depends_on:
  - fig3a-decoding-shock-gt-ns
  criterion: Decoding as in fig3a-decoding-shock-gt-ns, all cells, shocked mice, day 1. The paper
    gives no test. What "peaked" is measured on is open, reading P1, of the four Methods epochs
    the pre-shock epoch (23 to 28 s) has the highest mean normalized F1 across mice; P2, the
    highest bin of the across-mouse mean trace from 0 to 38 s after tone onset lies in the
    pre-shock epoch. Run under C1 and C2, N1 and N2; where the readings give different
    outcomes the claim is methods_underspecified.
- id: fig3b-feature-cells-enhance
  statement: Decoding from only ROC-defined feature-encoding neurons enhanced decoder
    performance in shocked mice.
  source: Results, Population dynamics prospectively represent trial outcomes early in
    learning, paragraph 2; Figure 3B
  quote: Using only feature-encoding neurons enhanced decoder performance in shocked mice
  depends_on:
  - fig3a-decoding-shock-gt-ns
  criterion: Decoding as in fig3a-decoding-shock-gt-ns with modulated cells only (opening
    comment). What "enhanced" is compared with is open. Reading E1, against the all-cell decoder
    of the same shocked mice, the mean normalized F1 in the pre-shock and shock epochs is higher
    with modulated cells. Reading E2, against NS mice decoded the same way, the two-way repeated
    measures ANOVA with Sidak's test gives shocked higher with p < 0.05 in at least as many
    epochs as with all cells. Both are run, each under the cell readings K1 and K2; when they
    disagree the claim is methods_underspecified.
- id: fig3c-nonmod-cells-worsen
  statement: Decoding from only non-modulated PL neurons worsened decoder performance.
  source: Results, Population dynamics prospectively represent trial outcomes early in
    learning, paragraph 2; Figure 3C
  quote: whereas using only the non-modulated PL neurons worsened performance
  depends_on:
  - fig3a-decoding-shock-gt-ns
  criterion: As fig3b-feature-cells-enhance with non-modulated cells only, and with lower in
    place of higher (E1) and fewer significant epochs in place of at least as many (E2).
- id: fig4b-hybrid-model-best
  statement: The fraction of tone time on the platform was best fitted by the hybrid
    Rescorla-Wagner model, which learns from both shock and avoid trials.
  source: Results, PL population activity states relate to individual learning rates,
    paragraph 1; Figure 4A-C
  quote: The fraction of time on the platform was best modeled by the hybrid approach
  criterion: The three models of the opening comment fitted per shocked mouse (N=9, Figure 4B
    legend). Per mouse and model, the mean over blocks of three trials of the squared residual
    between the predicted and observed fraction (Figure 4A and 4B legends). Repeated measures
    one-way ANOVA with Geisser-Greenhouse correction (Methods). Reproduced when the hybrid
    model has the lowest mean squared residual and the ANOVA gives p < 0.05. Run under T1 and
    T2, S1 and S2.
- id: fig4e-day1-onset-distance
  statement: On day 1, the mean Euclidean distance between latent trajectories of successful
    and unsuccessful trials in the tone-onset epoch was positively correlated with the avoid
    learning rate.
  source: Results, PL population activity states relate to individual learning rates,
    paragraph 2; Figure 4E
  quote: On days 1 and 2, the mean Euclidean distance during the tone-onset epoch, but not
    during the pre-shock epoch, was significantly correlated with learning rate
  depends_on:
  - fig4b-hybrid-model-best
  criterion: Mean Euclidean distance (opening comment) in the tone-onset epoch on day 1, per
    shocked mouse, against the hybrid model's avoid learning rate; Pearson's correlation, N=8
    (Figure 4E legend). Reproduced when r > 0 (positive per the Discussion, "positively
    correlated with learning rates ( Figure 4E , G , J )") and p < 0.05. The paper's r and p are
    in Table S1, not read. Run under W1, W2 and W3, L1 and L2, T1 and T2, S1 and S2.
- id: fig4f-day1-preshock-distance-none
  statement: On day 1, the mean Euclidean distance in the pre-shock epoch was not significantly
    correlated with the learning rate.
  source: Results, PL population activity states relate to individual learning rates,
    paragraph 2; Figure 4F
  quote: but not during the pre-shock epoch
  depends_on:
  - fig4b-hybrid-model-best
  criterion: As fig4e-day1-onset-distance in the pre-shock epoch (23 to 28 s). The paper's test
    is Pearson's correlation at p < 0.05; reproduced when p >= 0.05, with r reported.
- id: fig4g-day2-onset-distance
  statement: On day 2, the mean Euclidean distance between successful and unsuccessful
    trajectories in the tone-onset epoch was positively correlated with the avoid learning rate.
  source: Results, PL population activity states relate to individual learning rates,
    paragraph 2; Figure 4G
  quote: On days 1 and 2, the mean Euclidean distance during the tone-onset epoch ... was
    significantly correlated with learning rate
  depends_on:
  - fig4b-hybrid-model-best
  criterion: As fig4e-day1-onset-distance on day 2, under D-a and D-b as well.
- id: fig4h-day2-preshock-distance-none
  statement: On day 2, the mean Euclidean distance in the pre-shock epoch was not significantly
    correlated with the learning rate.
  source: Results, PL population activity states relate to individual learning rates,
    paragraph 2; Figure 4H
  quote: but not during the pre-shock epoch, was significantly correlated with learning rate
  depends_on:
  - fig4b-hybrid-model-best
  criterion: As fig4f-day1-preshock-distance-none on day 2, under D-a and D-b as well.
- id: fig4i-day1-onset-trajectory-none
  statement: On day 1, trajectory distance in the tone-onset epoch on the trials of interest was
    not significantly correlated with learning rate.
  source: Results, PL population activity states relate to individual learning rates,
    paragraph 3; Figure 4I
  quote: On day 1, there were no significant correlations between trajectory distance and
    learning rate during the tone onset epoch
  depends_on:
  - fig4b-hybrid-model-best
  criterion: Trajectory distance (opening comment, Methods measure) in the tone-onset epoch on
    the first shock trial and on the first avoidance trial of day 1, per shocked mouse, against
    the avoid learning rate; Pearson's correlation, N=8 (Figure 4I legend). The paper's test is
    Pearson's at p < 0.05; reproduced when every trial of interest gives p >= 0.05, with r
    reported. The code's distance and its extra trials (last shock, last avoid) are shown as
    variants. Run under W1, W2 and W3, L1 and L2.
- id: fig4j-day1-preshock-first-avoid
  statement: On day 1, trajectory distance in the pre-shock epoch on the first avoidance trial
    was positively correlated with learning rate.
  source: Results, PL population activity states relate to individual learning rates,
    paragraph 3; Figure 4J
  quote: but there was a positive correlation during the pre-shock epoch on the first avoidance
    trial
  depends_on:
  - fig4b-hybrid-model-best
  criterion: As fig4i-day1-onset-trajectory-none in the pre-shock epoch, first avoidance trial.
    Reproduced when r > 0 with p < 0.05. The Discussion calls this correlation trend-level
    ("some trend-level correlations (e.g. Figure 4I , J )"); the Results are followed, and the
    r and p are reported whatever the outcome.
- id: fig4k-day2-onset-first-shock
  statement: On day 2, trajectory distance in the tone-onset epoch on the first shock trial was
    negatively correlated with learning rate.
  source: Results, PL population activity states relate to individual learning rates,
    paragraph 3; Figure 4K
  quote: On day 2, during the tone onset period, we observed a significant negative correlation
    between the trajectory distance and learning rate on the first shock trial
  depends_on:
  - fig4b-hybrid-model-best
  criterion: As fig4i-day1-onset-trajectory-none on day 2, first shock trial. Reproduced when
    r < 0 with p < 0.05. Run under D-a and D-b as well.
- id: fig4l-day2-preshock-trajectory-none
  statement: On day 2, trajectory distance in the pre-shock epoch on the trials of interest was
    not significantly correlated with learning rate.
  source: Results, PL population activity states relate to individual learning rates,
    paragraph 3; Figure 4L
  quote: and no significant correlations during the pre-shock period
  depends_on:
  - fig4b-hybrid-model-best
  criterion: As fig4i-day1-onset-trajectory-none on day 2 in the pre-shock epoch. Reproduced when
    every trial of interest gives p >= 0.05.
- id: figs3ab-day1-post-onset-distance
  statement: On day 1, the mean Euclidean distance 5 to 10 s after tone onset was positively
    correlated with learning rate, while the distance just before tone onset was not.
  source: Results, PL population activity states relate to individual learning rates,
    paragraph 2; Figure S3A, B
  quote: On day 1, we also observed a significant positive correlation between Euclidean
    distance and learning rate during the 5–10s period after (but not in the moments before)
    the tone onset
  depends_on:
  - fig4b-hybrid-model-best
  criterion: As fig4e-day1-onset-distance in the post-onset window (5 to 10 s) and the pretone
    window (-6 to -1 s) (Methods). Reproduced when the post-onset correlation has r > 0 and
    p < 0.05 and the pretone correlation has p >= 0.05. Figure S3 was not read.
- id: figs3cd-day1-distance-groups-similar
  statement: On day 1, the Euclidean distances between successful and unsuccessful population
    trajectories were comparable in shocked and non-shocked mice.
  source: Results, PL population activity states relate to individual learning rates,
    paragraph 4; Figure S3C, D
  quote: On day 1, Euclidean distances between population vectors for successful and
    unsuccessful trials were comparable for shocked and NS mice
  criterion: Mean Euclidean distance (opening comment) on day 1 in the tone-onset and pre-shock
    epochs, per mouse, shocked against NS. Figure S3 was not read; the test is Welch's t-test
    (Methods, "All other comparisons"). Reproduced when both epochs give p >= 0.05, with the
    differences reported. Run under W1, W2 and W3.
- id: figs3ef-first-success-trajectory
  statement: Following the first successful trial, trajectory distance was significantly higher
    in shocked than in non-shocked mice in the tone-onset epoch and significantly lower in the
    pre-shock epoch.
  source: Results, PL population activity states relate to individual learning rates,
    paragraph 4; Figure S3E, F
  quote: Following the first successful trial, trajectory distance was significantly higher in
    shocked mice during tone onset, but significantly lower than NS controls during the
    pre-shock epoch
  criterion: Trajectory distance (opening comment) on day 1, per mouse, shocked against NS,
    Welch's t-test (Methods). Which trial "following the first successful trial" means is open,
    reading A1, the trial after the first avoidance trial, and A2, the first avoidance trial
    itself (the code's event-aligned distances run from it to the trial after). Reproduced when
    shocked mice are higher at tone onset and lower at pre-shock, each with p < 0.05. Figure S3
    was not read.
- id: figs3gh-behavior-similar
  statement: Behaviour of shocked and non-shocked mice was similar during the tone-onset and
    pre-shock epochs.
  source: Results, PL population activity states relate to individual learning rates,
    paragraph 4; Figure S3G, H
  quote: Behaviors of shocked and NS mice were similar during both epochs
  criterion: Figure S3G and S3H were not read. The same paragraph names avoidance and freezing as
    the behaviours compared, so the measures are the fraction of time on the platform and the
    fraction of time freezing in the tone-onset and pre-shock epochs, per mouse. Which trials
    enter is open, reading B1, day 1 trials 4 to 12, and B2, the trial of interest of
    figs3ef-first-success-trajectory (the sentence follows that result). Welch's t-test
    (Methods), shocked against NS. Reproduced when no comparison gives p < 0.05, each reading
    shown.
- id: figs4ab-iti-midtone-none
  statement: In the ITI and mid-tone epochs, trajectory distance was not significantly related
    to learning rate.
  source: Results, PL population activity states relate to individual learning rates,
    paragraph 4; Figure S4A, B
  quote: We also examined epochs during the ITI and in the middle of the tone, finding no
    significant relationships between trajectory distance and learning rate in either
  depends_on:
  - fig4b-hybrid-model-best
  criterion: As fig4i-day1-onset-trajectory-none in the mid-ITI (-25 to -20 s) and mid-tone (14
    to 19 s) windows (Methods), on days 1 and 2. Reproduced when no correlation gives p < 0.05.
    Figure S4 was not read.
- id: figs4cd-iti-before-first-avoid
  statement: The only differences in trajectory distance between shocked and non-shocked mice in
    the control epochs occurred during the ITI before the first avoidance trial.
  source: Results, PL population activity states relate to individual learning rates,
    paragraph 4; Figure S4C, D
  quote: The only differences in trajectory distance between shocked and NS mice occurred
    during the ITI before the first avoidance trial
  criterion: As figs3ef-first-success-trajectory in the mid-ITI and mid-tone windows, on each
    trial of interest. Reproduced when the mid-ITI window on the first avoidance trial gives
    p < 0.05 and no other comparison does. Figure S4 was not read.
checks:
- date: 2026-10-21
  kind: agent
  model: claude-opus-5-5
  ready: true
  changes:
  - Opening comment, Decoding. The file said the Figure 3B modulated cells are those with any call in the BL or the D1 period. In a_SVM_permousev3ASF.m (Zenodo 13351302) the modulated decoder uses the LLmod set alone, while non-modulated cells are those in none of BLplat, LLplat, BLmod and LLmod. Named the modulated set as open, with readings K1 (BL or D1, the legend's wording) and K2 (D1 only, the code).
  - fig3b-feature-cells-enhance. Runs under K1 and K2, as the opening comment now gives them; fig3c-nonmod-cells-worsen is unchanged, since legend and code agree on its cells.
  - figs2-innate-behaviors. The averaging window for escape, jumping and rearing was fixed at 3 s by choice; the paper and code give none for these events and the code uses 3, 4 and 5 s for other events. Named 3, 4 and 5 s as readings. Added a test for the part of the statement on similar activity in the other escape, jumping and rearing cells (Welch's t-test, the Methods' default), which the criterion did not judge, and said that the rarity and the few encoding neurons are reported, not judged.
  - figs3gh-behavior-similar. The behaviours were said to be unnamed; the same Results paragraph names avoidance and freezing, which supports the two measures. Which trials enter was fixed by choice (day 1 trials 4 to 12); named it open, with the trial of interest of figs3ef-first-success-trajectory as the second reading.
  - Added claim disc-tone-cells-baseline. The Discussion states that the proportion of tone-encoding neurons was greatest at baseline in both groups and that tone-onset activity was similar across groups (Figure 1K, 1L, 1P, 1Q); no claim covered it.
  - Added claim fig3a-decoding-peak-preshock. The Discussion states that decoder performance peaked immediately before the shock (Figure 3); no claim covered it. The paper gives no test, so the criterion names two readings of the peak.
  - Opening comment. Noted the two added claims.
  - Verified against the code and left unchanged. The F1 positive class (calculatePerformance.m counts label 1, failure, as positive, as reading C2 says), the success rule (at least 0.75 s on the platform in the first second of the shock), the RW update and fit, the category rule in genFeatCellResponses.m, the mean-activity windows and pre-event z-score in compile_pooled_avg_heatmaps.m, and the CILDS trial ranges and trials of interest.
  - Open, not settled. The supplement (Figures S1 to S4, Tables S1 and S2) is not in the text supplied; the F values, post hoc p-values and Pearson r and p are not recorded, and claims on Figures S1 to S4 rest on the Results sentences alone.
  - Open, not settled. The ROC computation (run_caAnalyze) and the ROC_IDs file used for decoding are not in the code record, so the frames that make up the BL, D1 and D2 periods and the exact contents of the LLmod set remain readings.
  - Open, not settled. fig1kl-day1-categories-similar tests each category among responsive cells; the paper does not give the denominator of these chi-square tests (fig1k-mixed-day2 names R1 and R2). As an absence claim it is judged on the one table the criterion names.
