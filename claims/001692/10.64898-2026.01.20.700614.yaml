- id: fig2a-directionality
  statement: For coincident transients of opposite polarity (ACh trough with DA peak, ACh peak with
    DA trough) the DA transient leads; for same-polarity pairs (peak with peak, trough with trough)
    the ACh transient leads.
  source: Figure 2a; Results, second section
  criterion: Transients per the Methods (at least 3 consecutive samples above the 97.5th or below
    the 2.5th percentile of a null of the mean of 3 randomly drawn samples, 10000 draws per site
    and session), on all sessions of UG27 to UG31, leaving out transients that start within 6 s after
    a reward delivery or first lick, as the code does. A pair is a transient whose onset and
    peak both fall within 1 s (18 samples) after those of a transient of the other signal in the
    same session, matched as in the code. Directionality index (A - B)/(A + B), A the ACh-first
    pairs. Reproduced when the median index over sites is negative for both opposite-polarity
    types and positive for both same-polarity types, each with a one-sample Wilcoxon p < 0.05;
    partially reproduced for three of the four; not reproduced otherwise.
- id: fig2-magnitude-correlations
  statement: Magnitudes of paired transients are negatively correlated at many sites for
    opposite-sign pairs (121 of 174 for ACh troughs with DA peaks, 81 of 174 for ACh peaks with DA
    troughs) and positively for same-sign pairs (97 of 174 peak-peak, 78 of 174 trough-trough), with
    no site significant in the other direction.
  source: Results, second section; Figure 2d
  depends_on:
  - fig2a-directionality
  expected:
  - quantity: sites with significant negative correlation, ACh trough with DA peak
    value: 121
    tolerance: 12.1
  - quantity: sites with significant negative correlation, ACh peak with DA trough
    value: 81
    tolerance: 8.1
  - quantity: sites with significant positive correlation, peak with peak
    value: 97
    tolerance: 9.7
  - quantity: sites with significant positive correlation, trough with trough
    value: 78
    tolerance: 7.8
  criterion: As the Methods describe, per site and pair type, Pearson r of the signed magnitudes of
    100 randomly drawn pairs (pairs in either order), repeated 1000 times (the paper 10000); the
    site's value is the mean r, and it is significant when 0 lies outside the 2.5th to 97.5th
    percentiles; sites with fewer than 100 pairs count as not significant. Reproduced when the four
    counts are within tolerance and no site is significant in the opposite direction; partially
    reproduced when for each type significant sites of the stated sign outnumber those of the
    other sign but a count is outside tolerance; not reproduced otherwise. The code's computation
