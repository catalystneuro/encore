# Claims for Bouabid, Vu et al. (2026), "An anatomical hotspot for striatal dopamine-acetylcholine
# interactions during reward and movement", bioRxiv doi:10.64898/2026.01.20.700614, on dandiset
# 001692. Source: the full text of the preprint (CC-BY), Results, figure legends and Methods.
#
# When these criteria were written, the author had seen the data check only: the file list of
# version 0.260303.1724, the subjects and their indicators (UG27-UG31 and AD1-AD3 and ADS* express
# ACh3.0 and rDA3m, AD4-AD6 express ACh4.3mut and tdTomato), the number of included fibers per
# mouse (174 for UG27-UG31, 75 for AD1-AD3, 180 for the six ADS mice, 125 for AD4-AD6), the
# processed series present in each file, the stated rate (9 Hz) against the behavior timestamps
# (18 Hz), the event types and counts per session, and the fraction of light cues followed by a
# reward in each Pavlovian session (1.0, 0.2 or 0.8). No claim's analysis had been run. The author
# had read the paper's analysis code (github.com/HoweLab/BouabidVu2026 at commit 833fa3d).
#
# Choices fixed here, from the code where the Methods are silent: fibers are those marked
# `included`; spontaneous and reward-session analyses use the high-pass filtered, artifact-removed
# series (DfOverFexpHpArt, the code's Fc_exp_hp_art), Pavlovian and control analyses the
# high-pass filtered series (DfOverFexpHp, Fc_exp_hp), and the stimulation cohort the unfiltered
# series (DfOverFexp, Fc_exp); DA and ACh samples are paired by index, as in the code; lags are
# ACh relative to DA, so a positive lag means DA leads; the sampling rate is 18 Hz.
# Triggered-average significance follows the Methods (three consecutive samples beyond the 2.5th
# or 97.5th percentile of a bootstrap null of the mean of n randomly timed events), with 1000
# bootstrap samples (the paper 10000); the code's 0.5th and 99.5th percentiles are a variant.
#
# Hotspot procedure, fixed here (the paper's MATLAB pipeline, simplified to fit the time limit).
# Site values are placed at the fiber tip coordinates in the files (AP, ML, DV in mm from bregma),
# interpolated linearly onto a 100 um grid spanning the sites, padded outward by 5 voxels with the
# mean of valid neighbors as the code pads before smoothing, smoothed with a Gaussian of sigma 1
# voxel (the code uses 2 voxels of 50 um), and masked to the convex hull of the sites (the paper
# masks with the Allen striatum, not used here). Local Moran's I is computed as in
# local_morans_I.m with an 11 x 11 x 11 voxel neighborhood (500 um either side). The null is 200
# shuffles of the values across sites (the paper 10000), each interpolated and smoothed in the same
# way. Voxels whose I exceeds the null 95th percentile are significant; connected components
# (26-connected) of at least 125 voxels (0.125 mm3, the paper's 1000 voxels of 50 um) are
# candidates, and the hotspot is the candidate whose mean smoothed value has the largest
# magnitude. A site is inside a hotspot when its grid voxel is; sites of another cohort are placed
# in the same grid by their coordinates. The overlap test follows hotspot_comparison.m, with 200
# random connected volumes of each hotspot's size grown inside the mask (the paper 10000). An
# "anterior dorsolateral" location means the hotspot's centroid lies anterior, lateral and dorsal
# of the median site coordinates of the cohort.
schema_version: 1
dandiset: "001692"
paper: doi:10.64898/2026.01.20.700614
claims:
- id: fig1e-dominant-polarity
  statement: Across 174 sites in 5 mice, the dominant DA-ACh cross-correlation (the largest
    magnitude Pearson r within 1 s lags) during spontaneous behavior is negative at 132 sites, 127
    of them with DA leading, and positive at 42 sites, 31 of them with ACh leading.
  source: Results, first section; Figure 1e
  expected:
  - quantity: sites with dominant negative correlation
    value: 132
    tolerance: 13.2
  - quantity: dominant negative sites with DA leading
    value: 127
    tolerance: 12.7
  - quantity: sites with dominant positive correlation
    value: 42
    tolerance: 4.2
  - quantity: dominant positive sites with ACh leading
    value: 31
    tolerance: 3.1
  criterion: Spontaneous sessions of UG27 to UG31 (those without reward events). Per session and
    site, Pearson r of DA at t with ACh at t plus k samples for k from -18 to 18, NaN samples
    dropped; r averaged over sessions per site, as the code does; the dominant r is the extreme
    with the larger magnitude. DA leads when k > 0 and ACh when k < 0. Reproduced when all four
    counts are within tolerance; partially reproduced when negative sites outnumber positive ones,
    most negative sites have DA leading and most positive ones ACh leading, but a count is outside
    tolerance; not reproduced otherwise. Correlation over concatenated sessions is a variant.
- id: fig1f-adls-hotspot
  statement: The dominant correlations form a significant hotspot, identified by local Moran's I,
    in the anterior dorsolateral striatum (aDLS), where the strongest correlations are negative.
  source: Results, first section; Figure 1f
  depends_on:
  - fig1e-dominant-polarity
  criterion: The hotspot procedure of the opening comment on the 174 dominant r values.
    Reproduced when a hotspot is found, its mean smoothed value is negative, and its centroid is
    anterior dorsolateral as defined above; partially reproduced when a negative hotspot is found
    elsewhere; not reproduced when no hotspot is found or its mean is positive.
- id: fig1h-in-vs-out
  statement: Sites inside the aDLS hotspot have more negative dominant correlations than sites
    outside (Wilcoxon rank-sum p = 1.67e-16).
  source: Figure 1h
  depends_on:
  - fig1f-adls-hotspot
  criterion: Two-sided Wilcoxon rank-sum test of the dominant r of sites inside against outside the
    hotspot of fig1f-adls-hotspot. Reproduced when p < 0.05 with the median inside lower; not
    reproduced otherwise. The p value is reported against the paper's; the test is partly circular,
    as the hotspot is drawn from the same values.
- id: fig1f-positive-posterior
  statement: Dominant positive correlations lie in the posterior striatum.
  source: Results, first section; Figure 1f
  depends_on:
  - fig1e-dominant-polarity
  criterion: One-sided Wilcoxon rank-sum test that the AP coordinate of sites with a positive
    dominant r is lower (more posterior) than that of sites with a negative dominant r. Reproduced
    when p < 0.05; not reproduced otherwise.
- id: ed2-hotspot-per-mouse
  statement: The hotspot is consistent across mice; in each mouse, sites inside the group hotspot
    have more negative dominant correlations than sites outside.
  source: Extended Data Figure 2d; Results, first section
  depends_on:
  - fig1f-adls-hotspot
  criterion: Per mouse, two-sided Wilcoxon rank-sum test of dominant r inside against outside the
    group hotspot, for mice with at least two sites on each side. Reproduced when at least 4 of 5
    mice have the median inside lower with p < 0.05; partially reproduced when at least 4 have the
    median inside lower but fewer than 4 reach p < 0.05; not reproduced otherwise. The per-mouse
    hotspots of Extended Data Figure 2b and 2c are not computed.
- id: ed1-controls-no-organization
  statement: Mice expressing non-functional sensors (a mutant ACh sensor and tdTomato, n = 3) show
    only sparse, weak positive red-green correlations with no anatomical organization; no hotspot is
    found.
  source: Extended Data Figure 1i-k; Results, first section
  criterion: AD4 to AD6, identified by their indicators in the files. Their 15 sessions with
    rewards and no cues, with the 6 s after each reward delivery and first lick left out, as the
    paper uses ITI data only; DfOverFexpHp series; dominant r as in fig1e-dominant-polarity. A claim
