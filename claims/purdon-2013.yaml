# Claims for Purdon et al. (2013), PNAS 110(12):E1142-E1151, on dandiset 001285.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-22,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record as served by PubMed Central (PMC3607036), main text with
# Results, figure legends and Materials and Methods, and the Supporting Information PDF
# (SI Materials and Methods, Figs. S1 to S3), all in paper/10.1073-pnas.1221180110.txt. The
# main PDF was not supplied, so the main figures could not be looked at; every claim rests on
# a sentence of the text. Two equations were lost in extraction (the modal projection, and the
# random-walk state variance of the traveling-peak smoother); both are read from the words
# around them, as said in the criteria.
#
# Code: the paper links no analysis code, and none was read. Methods it cites without stating
# (the state-space model, refs. 31 and 74; the modal projection, ref. 33; the phase-amplitude
# filters and permutation test, ref. 36) are outside the text; where they matter the details
# are named as open below.
#
# Data the paper used: 10 healthy volunteers, 18 to 36 years. Propofol by computer-controlled
# infusion to target effect-site concentrations of 0, 1, 2, 3, 4 and 5 ug/mL (induction), then
# CLOR - 0.5, CLOR - 1.0, CLOR - 1.5 and 0 ug/mL (emergence), each held 14 min, with CLOR the
# concentration at which the subject stopped responding. 64-channel EEG (BrainVision MRI Plus)
# at 5,000 Hz, down-sampled to 500 or 250 Hz; eyes closed throughout. An auditory task every
# 4 s in the sequence click-click-verbal-click-click (210 stimuli per level); verbal stimuli
# are the subject's name or one of seven words; button presses (one button for the name, the
# other for any other stimulus) give the behavioral time series. Electrode positions were
# digitized and coregistered with each subject's structural MRI for the Laplacian reference.
# The archive's description adds a 20-min baseline before the infusion and a 20-min recording
# after it stopped.
#
# Common method, from the paper (cited per criterion as "common method"):
# - Behavior: per subject, Pverbal and Pclicks are estimated from the time series of correct
#   and incorrect responses with a Bayesian state-space model fit by Monte Carlo (refs. 31,
#   74), with 95% credibility intervals, and Pverbal - Pclicks by the same method (Results,
#   Continuous Transitions, paragraph 1; Methods, Behavioral Analysis).
# - Time markers (Results, Continuous Transitions, paragraph 1): EON, first time in induction
#   Pclicks < 0.95 and stays so for at least 5 min; LOC, first time in induction Pverbal < 0.05
#   for at least 5 min; ROC, first time in emergence Pverbal > 0.95 for at least 5 min; EOFF,
#   first time in emergence Pclicks > 0.95 for at least 5 min, and the end of the recording
#   when EOFF is not reached (paragraph 3). Pre-LOC is the midpoint of EON and LOC, Unconscious
#   the midpoint of LOC and ROC, Post-LOC (labelled Post-ROC in Fig. S2) the midpoint of ROC and
#   EOFF (Results, Dynamics of the EEG Spectrum, paragraph 3; Fig. 3B legend).
# - Group behavior: responses aligned at LOC (induction) or ROC (emergence), pooled in 20-s bins
#   across subjects, and fit with the same model (Methods, Behavioral Analysis).
# - EEG: anti-alias filter and down-sampling to 500 or 250 Hz; noisy channels excluded; a
#   nearest-neighbor Laplacian, each channel minus a distance-weighted average of its nearest
#   neighbors, distances along the scalp (Methods, EEG Preprocessing).
# - Spectrograms: multitaper, 2-s windows with 1.9-s overlap, TW = 2, K = 3 tapers (Methods,
#   Spectral Analysis). Each subject's spectrogram is normalized by its baseline spectrum; the
#   group spectrogram is the median across subjects aligned at LOC or ROC; significance above
#   baseline by a sign test at each time-frequency point, each subject one sample. The figures'
#   channel is a frontal one, approximately Fz. Bands: low frequency 0.1 to 1 Hz, alpha 8 to
#   12 Hz, beta 13 to 24 Hz and gamma 25 to 40 Hz in the Results; gamma 25 to 35 Hz in the
#   Fig. 2B legend and Fig. S2, beta 12 to 25 Hz in Fig. S2.
#
# Details the paper leaves open, with the readings each criterion runs:
# - Open A, response coding for the state-space model. Readings: (a) a response is correct when
#   the button matches the stimulus (name button for the name; other button for words and
#   clicks); (b) any button press counts as a response ("probability of response").
# - Open B, the point estimate of a response-probability curve used for the markers, and the
#   model's priors and sampler settings (in refs. 31 and 74, not in the paper). Readings: (a)
#   posterior median; (b) posterior mean. Priors and sampler settings are standard choices of
#   the cited method and are recorded as deviations.
# - Open C, the baseline period. Readings: (a) the recording before the infusion starts (the
#   archive describes 20 min); (b) the first 14-min level at 0 ug/mL target concentration.
# - Open D, the baseline spectrum. Readings: (a) mean, (b) median over the baseline windows,
#   per frequency, the spectrogram divided by it.
# - Open E, the Laplacian. Digitized positions with scalp distances from the MRI are used when
#   the dataset holds them; otherwise standard positions of the cap's channel labels with
#   Euclidean distances, as a deviation. Neighbors and weights are not given. The Methods use
#   "distances along the scalp surface to weigh neighboring electrode contributions", so the
#   outcome rests on (a) the 4 nearest channels, inverse-distance weights; (b) the 4 nearest
#   channels with equal weights (the Results' "the average of the nearest neighbors") is shown
#   as a variant only, as the Methods come first. The number of neighbors (4) is not from the
#   paper and is a standard choice, recorded as a deviation.
# - Open F, excluded channels (visual inspection by an investigator). Channels marked bad in the
#   dataset are excluded if any are marked; otherwise none, as a deviation. "Approximately Fz"
#   is Fz, or the nearest kept channel when Fz is excluded.
# - Open G, the sign test's sides. For 10 subjects at p < 0.05 a one-sided and a two-sided test
#   both need at least 9 of 10 subjects above baseline, so it cannot change the outcome; a
#   two-sided test is used. No correction over time-frequency points is named; none is applied.
