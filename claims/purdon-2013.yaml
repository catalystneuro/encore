dataset:
  archive: dandi
  id: "001285"
paper: doi:10.1073/pnas.1221180110
claims:
- id: fig1c-clicks-lost-before-verbal
  statement: In all 10 subjects, during induction, the probability of response to clicks was
    below that to verbal stimuli in the transition between EON and LOC.
  source: Results, Continuous Transitions Between Consciousness and Unconsciousness, paragraph 2;
    Figure 1C
  quote: During induction, in 10 of 10 subjects, we observed that Pclicks < Pverbal during the
    transition between EON and LOC
  expected:
  - quantity: subjects with Pclicks < Pverbal between EON and LOC
    value: 10
    tolerance: 1
    unit: subjects
  criterion: Common method, with Open A and B. Per subject, Pclicks < Pverbal holds where the
    posterior Pr{Pclicks < Pverbal} exceeds 0.95, which is where the 95% credibility interval of
    Pverbal - Pclicks excludes 0 (Results, paragraph 2). The text does not say over how much of
    the EON to LOC interval this must hold. Readings, (i) at some time in the interval; (ii)
    over more than half of it. The subject count is compared with the expected value.
- id: eon-loc-duration
  statement: The transition from EON to LOC took a median of 23.9 min across subjects (range 6.7
    to 32.8 min, quartiles 16.4 and 28.6 min).
  source: Results, Continuous Transitions Between Consciousness and Unconsciousness, paragraph 2
  quote: The transition between EON and LOC required a median of 23.9 min (minimum, 6.7 min;
    25th percentile, 16.4 min; 75th percentile, 28.6 min; maximum 32.8 min)
  expected:
  - quantity: median EON to LOC time
    value: 23.9
    tolerance: 2.39
    unit: min
  - quantity: minimum EON to LOC time
    value: 6.7
    tolerance: 0.67
    unit: min
  - quantity: 25th percentile EON to LOC time
    value: 16.4
    tolerance: 1.64
    unit: min
  - quantity: 75th percentile EON to LOC time
    value: 28.6
    tolerance: 2.86
    unit: min
  - quantity: maximum EON to LOC time
    value: 32.8
    tolerance: 3.28
    unit: min
  criterion: EON and LOC per subject by the common method, with Open A and B. Reproduced when the
    median is within tolerance under a reading; partially reproduced when the median is and
    fewer than three of the other four values are. If the dataset holds the paper's LOC and EON
    times, they are used as well and reported as a variant.
- id: fig1e-group-induction
  statement: At the group level, aligned at LOC, Pclicks was below Pverbal during the transition
    to LOC, and the difference grew as subjects approached LOC.
  source: Results, Continuous Transitions Between Consciousness and Unconsciousness, paragraph 2;
    Figure 1 D and E
  quote: The group-level analysis corroborated the individual subject analyses, showing that
    Pclicks < Pverbal during the transition to LOC (Pr{Pclicks < Pverbal} > 0.95; Fig. 1E).
    Moreover, the group-level curves showed a gradual increase in the difference between these
    response probabilities as subjects approached LOC
  criterion: Group behavior by the common method, with Open A and B. Reproduced when Pr{Pclicks
    < Pverbal} > 0.95 at the group level before LOC, within the window from the median EON
    (about 24 min before LOC) to LOC, and the posterior estimate of Pverbal - Pclicks is higher
    in the last third of that window than in its first third. The window and the thirds are a
    reading of "during the transition" and "gradual increase", named here before the analysis.
    Partially reproduced when only the first part holds.
- id: fig1e-group-emergence
  statement: During emergence, at the group level aligned at ROC, Pclicks was below Pverbal,
    while individual curves were more variable.
  source: Results, Continuous Transitions Between Consciousness and Unconsciousness, paragraph 3;
    Figure 1E
  quote: During emergence, individual response-probability curves were more variable, but again
    we found that Pclicks < Pverbal at the group level
  criterion: Group behavior by the common method, aligned at ROC, with Open A and B. Reproduced
    when Pr{Pclicks < Pverbal} > 0.95 at some time after ROC, within the window from ROC to the
