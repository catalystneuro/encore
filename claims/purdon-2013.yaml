  source: Results, Changes in Spatially Coherent Alpha Activity Mark Unconsciousness, paragraph 2
  quote: In contrast, low frequencies did not show a prominent principal mode
  criterion: A claim of absence. The test is the paper's permutation test of the modal projection
    (fig4cd-frontal-alpha-mode, both readings of the segment), on the unconscious mode at 0.1 to
    1 Hz. Reproduced when the group mean modal projection is not significant in more than half
    the windows from LOC to ROC; not reproduced when it is. The modal projection values at 0.1
    to 1 Hz and at 8 to 12 Hz are reported either way. The 2-s windows resolve 0.5 Hz steps, so
    the low band holds the 0.5 and 1 Hz bins only; this is the paper's method and is said so.
- id: fig5-trough-max-induction
  statement: From about 20 min before LOC to about 10 min after it, alpha/beta (8 to 14 Hz)
    amplitude was largest at the troughs of the low-frequency (0.1 to 1 Hz) oscillation
    (trough-max), significant in 9 of 10 subjects within 10 min of LOC.
  source: Results, Different Patterns of Phase-Amplitude Modulation, paragraph 2; Figure 5 B and C
  quote: During induction, beginning ∼20 min before LOC and extending ∼10 min after LOC, the
    alpha/beta amplitudes were largest at the troughs of low-frequency oscillations (Fig. 5 B
    and C; P < 0.05 in 9 of 10 subjects within 10 min of LOC by permutation test
  expected:
    quantity: subjects with significant trough-max modulation within 10 min of LOC
    value: 9
    tolerance: 1
    unit: subjects
  criterion: Methods, Phase-Amplitude Modulation Analysis, and SI. Frontal channel near Fz,
    Laplacian, data at 250 Hz; bandpass 0.1 to 1 Hz and 8 to 14 Hz; Hilbert phase and
    amplitude; 18 equal phase bins; per 2-min epoch, mean amplitude per bin over the epoch's
    mean. Phase 0 is the low-frequency peak (SI, "psi(t) = 0"), so trough-max is a modulogram
    whose largest bin has |phase| > pi/2. Open, filter design (ref. 36), readings (a) zero-phase
    FIR, (b) zero-phase Butterworth. Open, the permutation test (ref. 36 only), readings (a)
    amplitude series circularly shifted by a random offset within the epoch, statistic the
    modulation index of ref. 35 (Tort et al.), (b) the same shuffle, statistic the
    modulogram's largest bin; 200 shuffles, p < 0.05. Open, "within 10 min of LOC", readings
    (i) any 2-min epoch from LOC - 10 to LOC + 10 min significant and trough-max, (ii) the
    pooled 20 min. The tolerance is one subject (10% of 9 is less than one subject). Reproduced
    when the count is within tolerance under a reading, and the group modulogram (mean across
    subjects) is trough-max in more than half the epochs from LOC - 20 to LOC + 10 min.
    Partially reproduced when one of the two holds. Open C, E and F apply.
- id: fig5-peak-max
  statement: During profound unconsciousness, 10 to 40 min after LOC, the modulation shifted by
    180 degrees, alpha/beta amplitude being largest at low-frequency peaks (peak-max),
    significant in 8 of 10 subjects.
  source: Results, Different Patterns of Phase-Amplitude Modulation, paragraph 2; Figure 5 B and D
  quote: During profound unconsciousness, i.e., from 10–40 min after LOC, the phase–amplitude
    modulation shifted by 180°, such that the alpha/beta amplitudes were largest at the peaks of
    low-frequency oscillations (Fig. 5 B and D; P < 0.05 in 8 of 10 subjects by permutation test
  expected:
    quantity: subjects with significant peak-max modulation, 10 to 40 min after LOC
    value: 8
    tolerance: 1
    unit: subjects
  criterion: As fig5-trough-max-induction, with peak-max a modulogram whose largest bin has
