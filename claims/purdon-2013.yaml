    from 23.1 to 12.0 Hz and its bandwidth (interquartile range) from 17.4 to 9.1 Hz.
  source: Results, Dynamics of the EEG Spectrum Covary with Changes in Probability of Response
    and LOC/ROC, paragraph 3; Figure 3A
  quote: During induction, in the transition period before LOC, the median frequency decreased
    from 23.1 to 12.0 Hz, and the bandwidth decreased from 17.4 to 9.1 Hz
  expected:
  - quantity: median frequency at the start of the pre-LOC transition
    value: 23.1
    tolerance: 2.31
    unit: Hz
  - quantity: median frequency at LOC
    value: 12.0
    tolerance: 1.2
    unit: Hz
  - quantity: bandwidth at the start of the pre-LOC transition
    value: 17.4
    tolerance: 1.74
    unit: Hz
  - quantity: bandwidth at LOC
    value: 9.1
    tolerance: 0.91
    unit: Hz
  criterion: Methods, Spectral Analysis, paragraph 2. Group-level spectrogram of the frontal
