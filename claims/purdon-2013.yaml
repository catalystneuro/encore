- id: figs3-broadband-modulation
  statement: The low-frequency phase modulates a broad range of higher frequencies, from theta
    through gamma, in both the trough-max and the peak-max regimes.
  source: Figure S3; SI Materials and Methods; Results, Different Patterns of Phase-Amplitude
    Modulation, paragraph 2
  quote: These results show that the low-frequency oscillation modulates a broad range of higher
    frequencies spanning theta through gamma bands in both the trough-max and peak-max regimes
  criterion: SI Materials and Methods. Peaks of the low-frequency oscillation where its phase is
    0; spectrograms in windows of +-2 s around each peak (T = 4 s, TW = 1, K = 1, no overlap,
