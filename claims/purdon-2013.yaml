    30 min. Reproduced when the count is within tolerance under a reading and the group
    modulogram is peak-max in more than half the epochs of that window; partially reproduced
    when one of the two holds.
- id: fig5-trough-max-emergence
  statement: During emergence, the modulation reverted to trough-max about 15 min before ROC,
    significant in 9 of 10 subjects.
  source: Results, Different Patterns of Phase-Amplitude Modulation, paragraph 2; Figure 5B
  quote: During emergence, the phase–amplitude modulation reverted to the trough-max pattern at
