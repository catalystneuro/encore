- id: fig2bc-gamma-beta-before-loc
  statement: Gamma and beta power rose significantly above baseline in the 30 min before LOC and
    stayed elevated during unconsciousness.
  source: Results, Dynamics of the EEG Spectrum Covary with Changes in Probability of Response
    and LOC/ROC, paragraph 1; Figure 2 B and C
  quote: gamma (25–40 Hz) and beta (13–24Hz) power increased significantly above baseline levels
    during the 30 min before LOC ... and remained elevated during the unconscious period
  statistics:
  - test: sign test at each time-frequency location
    p: 0.05
    p_relation: "<"
    n: 10 subjects
  criterion: Common method, frontal channel near Fz, Laplacian, with Open C to G. For each band,
    a time bin counts as significant when the sign test of the subjects' baseline-normalized
    power has p < 0.05, with power (i) averaged over the band's frequencies (Fig. 2C) or (ii)
    taken per frequency as in Fig. 2B, the bin counting when more than half of the band's
    frequencies are significant. The paper does not say what share of the window must be
    significant; readings (a) more than half the time bins of LOC - 30 min to LOC, and (b) every
    bin of the last 10 min before LOC. Both band definitions (Results; Fig. 2 legend) are run.
    Reproduced when, under a reading, gamma and beta both pass in the 30 min before LOC and are
    significant in more than half the bins of LOC to LOC + 30 min (the unconscious period, as
    the 10 to 40 min after LOC of claim fig5-peak-max lies within it); partially reproduced when
    one band does.
- id: fig2bc-alpha-slow-at-loc
  statement: At LOC, alpha (8 to 12 Hz) and low-frequency (0.1 to 1 Hz) power both increased
    significantly.
  source: Results, Dynamics of the EEG Spectrum Covary with Changes in Probability of Response
    and LOC/ROC, paragraph 1; Figure 2 B and C
  quote: At LOC, both alpha (8–12 Hz) and low-frequency (0.1–1 Hz) power increased significantly
  statistics:
  - test: sign test at each time-frequency location
    p: 0.05
    p_relation: "<"
    n: 10 subjects
  criterion: As in fig2bc-gamma-beta-before-loc, readings (i) and (ii) of the measure. "At LOC"
    is not given a window. Readings, (a) the band is significant in more than half the bins
    from LOC to LOC + 5 min (5 min being the paper's equilibration interval for the markers)
    and not in more than half the bins from LOC - 10 min to LOC - 5 min; (b) the band is
    significant in more than half the bins from LOC to LOC + 5 min. Reproduced when both bands
    pass under a reading; partially reproduced when one does.
- id: fig2d-spatial-loc15
  statement: Fifteen minutes after LOC, the alpha power increase was concentrated in frontal
    channels and the low-frequency increase was spread broadly over temporal and parietal
    channels.
  source: Results, Dynamics of the EEG Spectrum Covary with Changes in Probability of Response
    and LOC/ROC, paragraph 1; Figure 2D
  quote: Fifteen minutes after LOC, the increases in alpha power were concentrated in frontal
    channels, whereas those for low-frequency power were distributed broadly across temporal
    and parietal channels
  criterion: Common method, all kept channels, Laplacian, Open C to F. At LOC + 15 min, per
    subject and channel, baseline-normalized band power; the group map is the median across
    subjects (Methods, Spectral Analysis, group scalp maps). The paper gives no channel groups;
    they are read from the 10-20 labels, frontal Fp, AF, F (not FT, FC), temporal T, TP, FT,
    parietal P, CP (not PO), occipital O, PO. Reproduced when the frontal group has the highest
    median alpha increase of the groups, and the low-frequency increase is above 1 in more than
    half of the temporal and parietal channels and its frontal median is not more than twice the
    temporal and parietal median. The second part is a reading of "distributed broadly"; it is
    named so here, before the analysis.
- id: fig2-emergence-reverse
  statement: During emergence the changes reversed with a similar time course, frontal alpha and
    low-frequency power decreasing at ROC while gamma and beta power stayed elevated after ROC.
  source: Results, Dynamics of the EEG Spectrum Covary with Changes in Probability of Response
    and LOC/ROC, paragraph 1; Figure 2 B and C
  quote: "During emergence, these changes in power occurred in reverse, following a similar time
    course: Frontal alpha and low-frequency power decreased at ROC, whereas gamma/beta power
    remained elevated throughout the post-ROC period when Pclicks < Pverbal"
  statistics:
  - test: sign test at each time-frequency location
    p: 0.05
    p_relation: "<"
    n: 10 subjects
  criterion: As in fig2bc-alpha-slow-at-loc mirrored at ROC. Alpha and low-frequency power are
    significant in more than half the bins from ROC - 5 min to ROC and in fewer than half from
    ROC to ROC + 5 min; gamma and beta significant in more than half the bins from ROC to ROC +
