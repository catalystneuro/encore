- id: figs2-band-spatial-shift
  statement: Gamma and beta power were frontal from Pre-LOC through LOC; during unconsciousness
    the frontal power moved into the beta and alpha bands; during emergence it shifted back
    toward beta and gamma, and frontal gamma power persisted through EOFF.
  source: Results, Dynamics of the EEG Spectrum Covary with Changes in Probability of Response
    and LOC/ROC, paragraph 4; Figure S2
  quote: Gamma and beta power showed a frontal distribution from Pre-LOC through LOC; during
    unconsciousness the frontal power distribution moved to the beta and alpha bands ... In
    addition, frontal gamma power appeared to persist through EOFF
  criterion: Group maps of band power (in dB, as Fig. S2 shows) at the seven time points as in
    fig3b-frontal-median-frequency-power, bands of Fig. S2 (alpha 8 to 12, beta 12 to 25,
    gamma 25 to 35 Hz). Each band's frontal excess is the frontal group median minus the
    occipital group median, in dB, minus the same at baseline. Reproduced when the gamma and
    beta frontal excesses are positive at Pre-LOC and LOC; at Unconscious the alpha excess is
    above the gamma excess; at Post-ROC the gamma excess is above that at Unconscious (the
    shift back toward beta and gamma); and the gamma excess is positive at EOFF. Partially
    reproduced when two or three of the four hold. The thresholds are a reading of "frontal
    distribution", "moved" and "shifted", named here before the analysis.
- id: fig4ab-occipital-alpha-mode
  statement: At baseline the principal mode of the alpha band is spatially coherent over
    occipital channels; its modal projection dissipates at LOC and returns at ROC, remaining
    prominent after ROC.
  source: Results, Changes in Spatially Coherent Alpha Activity Mark Unconsciousness, paragraph
    2; Figure 4 A and B
  quote: Occipital prominence of the principal mode was present while the subjects were awake,
    ended at LOC, and returned, and remained prominent after ROC
  statistics:
  - test: permutation test (circular time shifts, 200 permutations resampled 500 times)
    p: 0.05
    p_relation: "<"
    n: 10 subjects
  criterion: Methods, Eigenvalue and Modal Projection Analyses. Per subject, multitaper
    cross-spectral matrices (parameters as for spectrograms) in nonoverlapping 2-s windows over
    the full baseline (Open C); the median over windows of the real and imaginary parts of each
    entry; the first eigenvector u1(f) is the principal mode. Modal projection in nonoverlapping
    20-s windows, the power within u1 over total power (equation lost; read as u1^H S u1 over
    trace S, with S the window's cross-spectral matrix). Significance per Methods, a random
    circular shift per channel, 200 times, resampled 500 times with replacement, the 95% limit
    averaged across subjects and compared with the mean modal projection. Occipital means the
    channel group of fig2d-spatial-loc15 with the largest median |u1| at 10 Hz. Reproduced when
