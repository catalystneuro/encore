    projection of the baseline mode at 8 to 12 Hz is significant in more than half of the
    windows in the 10 min before LOC and after ROC + 10 min, and in fewer than half from LOC +
    10 min to ROC - 10 min. The 10-min windows are a reading of "ended at LOC" and "returned"
    (the paper gives no window), named here before the analysis. Partially reproduced when the
    mode is occipital but the timing fails. Open E and F apply.
