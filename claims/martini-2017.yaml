# Claims for Martini, Molano-Mazon & Maravall (2017), Cerebral Cortex 27:3782-3789, "Interspersed
# Distribution of Selectivity to Kinematic Stimulus Features in Supragranular Layers of Mouse Barrel
# Cortex", doi:10.1093/cercor/bhx019, on CRCNS data set ssc-6 (doi:10.6080/K02F7KCP).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-09,
# protocol as stated in docs/protocol.md (Reader), version pilot-14.
#
# Text read: the version of record (open access, CC BY), extracted from the PDF to
# paper/10.1093-cercor-bhx019.txt: main text, Materials and Methods, legends of Figures 1 to 4, and
# the supplement (text_suppmat.docx), which holds only the legends of Supplementary Figures 1 to 3.
# These repeat the data of Figures 2C, 2F and 4B split into red, green and blue channels; no result
# rests on the supplement alone. The PDF was not opened: no claim needed a value shown only in a
# figure. The data set's description (paper/ssc-6.data-description.txt) was read only to know what
# it holds; no claim comes from it.
#
# Code: the paper links none. It names the software used: a modified StackReg ImageJ plugin
# (registration), Caltracer 2.5 (Yuste lab, ROI detection and traces), and the Matlab function
# fdr_bh by David Groppe (false discovery rate); stimuli were made in Matlab. "All data supporting
# this study are available at http://crcns.org." No analysis script was available to read, so every
# detail the Methods leave open is named below as open.
#
# Data the paper used. Female CD1 mice at about postnatal day 30, under ketamine-xylazine
# anesthesia (n = 10 mice). Layer 2/3 of barrel cortex bulk-loaded with OGB1-AM, imaged with a
# 2-photon microscope at 100 to 350 um depth, 512 x 128 pixel frames at 1.48 pixel/um and 8.8 Hz.
# 10 to 15 contralateral whiskers in a capillary on a piezoelectric bender moved rostro-caudally.
# Nine stimuli, idealized position, velocity and acceleration filters, each at three amplitudes in
# the ratio 1:3:5, randomly interleaved, 1 s apart; each stimulus 10 times per recording and 4
# recordings per field of view (40 presentations per stimulus and field). 49 fields of view and
# 1054 neurons after discarding experiments with excessive motion. In 3 mice, tangential
# cytochrome-oxidase sections placed the imaged neurons on the barrel map (167, 102 and 117 neurons).
# Measured variables: per-neuron calcium response amplitude to each presentation (mean dF/F0 of the
# 5 frames after the stimulus minus the mean of the 3 frames before), regression tuning
# coefficients for position, velocity and acceleration, pairwise Spearman correlations of the whole
# fluorescence time series, pairwise distances, a tuning similarity index (SI), and distance to the
# nearest barrel border. The data set's description says it holds, for each of ten mice, the raw
# movies of every field (four repetitions each), the stimulus command and frame-trigger signals for
# each movie, and, for experiments 8 to 10, histology reconstructions (PDF). It holds no ROIs,
# traces or tuning labels: the author must segment the movies again, so neuron counts and
# identities will not match the paper's one to one. All claims use the data set (data: dataset).
#
# Method fixed by the Methods (2-Photon Image Analysis; Measurements of Response Properties), used
# by every claim: rigid registration of each movie to its first frame; ROIs outlined on the mean
# image of all frames; mean raw fluorescence per ROI with background from unstained blood vessels
# subtracted; a perisomatic halo scaled by 0.7 and subtracted; dF/F0 with F0 the 8th percentile of
# corrected fluorescence in a symmetric 6 s sliding window; response amplitude as above; tuning by
# linear regression of all single-presentation response amplitudes on the amplitude of the
# corresponding waveform, one regression per waveform type, scored with the Benjamini-Hochberg-
# Yekutieli false discovery rate procedure at P < 0.05 (fdr_bh) over the neurons of a field;
# non-significant coefficients set to zero; mixed selectivity when significant for several features.
#
# Details the paper leaves open, named again in the claims they touch:
# (1) the halo width, the blood-vessel background ROI, and how ROIs are carried across the four
#     movies of a field (one ROI set on the mean of all four registered movies is the reading used;
#     a standard choice). The motion threshold for discarding fields is not given.
# (2) which frames count as "after" and "before" a stimulus: the first frame starting at or after
#     the command onset is the first frame after (standard choice).
# (3) amplitude units in the regression: normalized 1, 3, 5 (Figure 2B legend, "normalized to the
#     smallest value") or the peak command voltage. Significance does not depend on the units when
#     each waveform type is regressed separately; coefficient magnitudes do. dF/F0 as a fraction or
#     as percent scales coefficients by 100.
# (4) the test of each regression: the t test of the slope, two-sided, is the standard reading;
#     whether a significant negative slope counts as tuning is not stated (readings: either sign;
#     positive only).
# (5) the false discovery rate family and variant: fdr_bh with 'pdep' (Benjamini-Hochberg) or
#     'dep' (Benjamini-Yekutieli), the text names both authors; family of all 3 x N p-values of a
#     field, or N p-values per feature.
# (6) what "responded to whisker stimulation" means (50.2%): not defined.
# (7) the correlation signal: neuropil-corrected fluorescence before dF/F0 (the Methods' "corrected
#     fluorescence") or dF/F0; the shuffle unit (one stimulus presentation, from its onset to the
#     next onset) and the number of shuffles for correlations (not given; 100, as for SI, is used).
# (8) distance between neurons: between ROI centroids in the imaging plane (standard choice);
#     whether pairs beyond 300 um are fitted.
# (9) which 26 of the 49 fields enter the SI analysis, and the SI scale (raw dot product as the
#     Methods write it, or of unit-length tuning vectors).
# (10) for Figure 4D, the group of a neuron tuned to several features, and whether the distance to
#     the border is signed.
# (11) the example neuron (Figure 2A-C) and the example field (Figure 3A, B, D, F) are not
#     identified by mouse or field. The paper also gives the example field two sizes: n = 31
#     neurons (Figure 3B) and n = 29 neurons with n = 465 pairs (Figure 3F, "the field of view in
#     A"); 465 is the number of pairs of 31 neurons.
schema_version: 2
paper: doi:10.1093/cercor/bhx019
claims:
- id: dataset-size
  statement: Layer 2/3 neurons were imaged in 10 anesthetized mice, 49 fields of view and 1054
    neurons in all; each stimulus was presented 10 times per recording, in 4 recordings per field.
  source: Materials and Methods, Whisker Stimulation, paragraph 3; Results, paragraphs 1 and 3
  quote: In a recording, each stimulus was presented 10 times; 4 recordings were done for each field
    of view, for a total of 40 repetitions per field ... anesthetized mice (n = 10) ... n = 10 mice,
    49 fields of view, 1054 neurons
  expected:
  - quantity: mice
    value: 10
    tolerance: 0
  - quantity: fields of view
    value: 49
    tolerance: 0
  - quantity: recordings per field of view
    value: 4
    tolerance: 0
  - quantity: presentations of each stimulus per recording
    value: 10
    tolerance: 0
  - quantity: neurons over all fields
    value: 1054
    tolerance: 105
  criterion: Mice, fields and recordings are counted from the deposited movies and stimulus files,
    presentations from the command signal of each stimulus file, with zero tolerance. The paper
    discarded fields with excessive motion by a threshold it does not give (open detail 1); if the
    data set holds more than 49 fields, the excluded ones cannot be identified from the paper, and
    the count is reported as it is. Neurons must be segmented again from the raw movies (Caltracer
    or an equivalent, ROIs on the mean image, as the Methods), so the count takes the 10% tolerance.
- id: stimulus-set
  statement: The stimulus set holds idealized position, velocity and acceleration waveforms, each at
    three amplitudes in the ratio 1:3:5, randomly interleaved and separated by 1 s.
  source: Materials and Methods, Stimulus Design and Whisker Stimulation, paragraph 3; Results,
    paragraph 1
  quote: The set included idealized "position," "velocity," and "acceleration" filters ... Each
    waveform type was presented with 3 possible amplitudes, in the ratio 1:3:5 ... Consecutive
    deflections were separated by 1 s ... Different deflection waveforms and amplitudes were
    randomly interleaved in time
  expected:
  - quantity: distinct waveform shapes
    value: 3
    tolerance: 0
  - quantity: amplitudes per shape
    value: 3
    tolerance: 0
  - quantity: ratio of largest to smallest amplitude within a shape
    value: 5
    tolerance: 0.5
  - quantity: ratio of middle to smallest amplitude within a shape
    value: 3
    tolerance: 0.3
  - quantity: interval between consecutive deflection onsets
    value: 1
    tolerance: 0.1
    unit: s
  criterion: Read from the command signal (column 2) of the stimulus files. Each deflection is
    classed by its shape (the three filter shapes of Figure 1B) and its peak amplitude. Reproduced
    when the nine classes fall into three shapes with three amplitudes each in the ratios above, onsets
    are 1 s apart, and the order of the nine classes differs between recordings (randomly
    interleaved).
- id: fig2ab-example-neuron
  statement: In an example neuron, calcium responses grew most with the amplitude of the velocity
    waveform; its regression coefficients were 0.0069 for position, 0.0169 for velocity and 0.0106
    for acceleration.
  source: Results, paragraph 2; Figure 2A and 2B
  quote: the value of the regression coefficient between stimulus amplitude and neuronal response
    was greatest for velocity [rp = 0.0069 for position (5–95% CI 0.0032–0.011); rv = 0.0169 for
    velocity (CI 0.0132–0.021); ra = 0.0106 for acceleration (CI 0.0073–0.0151); Fig. 2B]
  statistics:
  - about: position coefficient
    ci:
      level: 0.9
      low: 0.0032
      high: 0.011
  - about: velocity coefficient
    ci:
      level: 0.9
      low: 0.0132
      high: 0.021
  - about: acceleration coefficient
    ci:
      level: 0.9
      low: 0.0073
      high: 0.0151
  expected:
  - quantity: position regression coefficient (tolerance to the paper's 5-95% interval, 0.0032 to
      0.011)
    value: 0.0069
    tolerance: 0.0041
  - quantity: velocity regression coefficient (interval 0.0132 to 0.021)
    value: 0.0169
    tolerance: 0.0041
  - quantity: acceleration regression coefficient (interval 0.0073 to 0.0151)
    value: 0.0106
    tolerance: 0.0045
  criterion: The paper does not say which mouse, field or ROI holds this neuron (open detail 11). The
    author identifies it by matching the field and ROI mask of Figure 2C (black arrow) to the mean
    images of the fields; if no field matches, the claim cannot be tested. Coefficients are the
    slopes of three separate regressions of all single-presentation responses (Methods, Measurements
    of Response Properties) on amplitude. Amplitude in normalized units 1, 3, 5 and dF/F0 as a
    fraction is the main reading (Figure 2B legend; open detail 3), the command voltage as a variant.
    Reproduced when the velocity coefficient is the largest of the three and each coefficient lies
    in its interval (the tolerances span the paper's interval, taking the wider side); partially
    reproduced when only the order holds. The tolerance on each coefficient is the larger
    distance from the value to a bound of the paper's interval.
- id: responsive-fraction
  statement: About half (50.2%) of all neurons in the data set responded to whisker stimulation.
  source: Results, paragraph 3; Discussion, paragraph 3
  quote: Overall, 50.2% of neurons in the data set responded to whisker stimulation
  expected:
    quantity: percentage of neurons responding to whisker stimulation
    value: 50.2
    tolerance: 5.0
    unit: percent
  criterion: The paper does not define a responsive neuron (open detail 6). Readings the text
    allows, each run on all segmented neurons, pooled across fields, are (a) the mean response amplitude
    over all 360 presentations is greater than zero, one-sided signed-rank test p < 0.05; (b) at
    least one of the nine stimuli evokes a response greater than zero (signed-rank test over its 40
    presentations, p < 0.05), with the Benjamini-Hochberg-Yekutieli correction over the neurons and
    stimuli of a field as the paper uses for tuning. Reproduced when a reading gives 50.2% within the
    tolerance; the outcome rests on that reading as an assumption.
- id: fig2de-tuned-fraction
  statement: Most neurons were not tuned to any kinematic feature; 71.8% of all neurons were
    non-tuned, so about 30% were tuned.
  source: Results, paragraph 3; Figure 2D and 2E; Discussion, paragraph 3
  quote: The analysis evidenced both tuned and non-tuned neurons, with an overall majority of
    non-tuned cells (71.8% of all neurons were non-tuned; n = 10 mice, 49 fields of view, 1054
    neurons; Fig. 2D,E)
  expected:
    quantity: percentage of neurons with no significant tuning
    value: 71.8
    tolerance: 7.2
    unit: percent
  depends_on:
  - dataset-size
  criterion: Tuning as the Methods (Measurements of Response Properties) give it, a neuron being
    tuned when at least one of its three regression coefficients is significant after the false
    discovery rate correction at P < 0.05. Readings run (open details 4 and 5) are BH ('pdep') and BY
    ('dep'), with the family of all 3 x N p-values of a field or of the N p-values per feature, and
    slopes of either sign or positive only. The percentage is computed pooled over neurons and, as
    Figure 2E plots, as the mean over fields. Reproduced when a reading gives 71.8% within the
    tolerance and non-tuned neurons are the majority.
- id: fig2e-all-categories
  statement: Among tuned neurons all categories of selectivity are represented, neurons tuned to
    position only, velocity only, acceleration only, and neurons with mixed selectivity.
  source: Results, paragraph 3; Figure 2E
  quote: Within tuned neurons, all categories of selectivity were represented (Fig. 2E)
  depends_on:
  - fig2de-tuned-fraction
  criterion: With the tuning of fig2de-tuned-fraction, neurons are classed as tuned to position
    only, velocity only, acceleration only, or mixed (significant for two or more features; Methods).
    Reproduced when each of the four classes holds at least one neuron over the data set, under the
    reading that reproduces fig2de-tuned-fraction (each reading shown).
- id: tuning-consistency
  statement: Tuning was consistent across halves of the data; 95% of neurons had identical tuning to
    at least one feature in the first and last pairs of recordings, and 81% to all three features.
  source: Materials and Methods, Measurements of Response Properties, paragraph 2
  quote: data were split into 2 subsets consisting of the first and last pairs of recordings. 95% of
    neurons displayed identical tuning to at least one feature over the 2 subsets, and 81% displayed
    identical tuning to all 3 features
  expected:
  - quantity: percentage of neurons with identical tuning to at least one feature in both halves
    value: 95
    tolerance: 9.5
    unit: percent
  - quantity: percentage of neurons with identical tuning to all three features in both halves
    value: 81
    tolerance: 8.1
    unit: percent
  depends_on:
  - fig2de-tuned-fraction
  criterion: The tuning procedure is run separately on recordings 1 and 2 and on recordings 3 and 4
    of each field, with the reading of fig2de-tuned-fraction. Identical tuning to a feature means
    the coefficient is significant in both halves or in neither. The denominator is not stated;
    readings are all neurons, neurons tuned in the full data, and neurons tuned in at least one half.
    Reproduced when both percentages fall within their tolerances under one reading.
- id: shuffle-significance
  statement: Scoring tuning by shuffling responses against stimulus amplitude (1000 repeats) in
    place of the regression test gives no qualitative change in the results.
  source: Materials and Methods, Measurements of Response Properties, paragraph 2
  quote: We also assessed tuning significance via direct shuffling of responses with respect to
    stimulus magnitude for each neuron (1000 repeats), with no qualitative change in results
  depends_on:
  - fig2de-tuned-fraction
  - fig2e-all-categories
  - fig3g-si-no-spatial-organization
  criterion: For each neuron and feature the responses are shuffled across the amplitudes of that
    waveform type 1000 times and the p-value is the fraction of shuffled slopes at least as extreme
    as the observed one. Whether the false discovery rate correction is then applied is not stated;
    both readings are run. Reproduced when, with this tuning, non-tuned neurons remain the majority,
    all four tuned classes are represented, and the SI test of fig3g-si-no-spatial-organization still
    finds no difference from shuffled data (P >= 0.05).
