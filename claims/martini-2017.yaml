  source: Results, paragraph 4; Figure 3A and 3B
  quote: mean correlation coefficient was 0.14 ± 0.0062 compared with 0.0022 ± 0.0013 obtained by
    shuffling responses of different neurons across stimulus presentations (n = 31 neurons
  expected:
  - quantity: mean pairwise correlation, example field (tolerance the paper's stated spread)
    value: 0.14
    tolerance: 0.0062
  - quantity: mean pairwise correlation, shuffled, example field (tolerance the stated spread)
