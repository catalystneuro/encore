  depends_on:
  - fig2de-tuned-fraction
  criterion: As the Methods (Measurements of Response Properties, paragraph 3) - each neuron's
    tuning vector is its three coefficients with non-significant ones set to zero; SI of a pair is
    the dot product of the two vectors; the slope of the least-squares line of SI on centroid
    distance in mm is compared with shuffled data, made by reassigning tuning vectors at random
    across the neurons of the field, 100 times, the field's shuffled value being the mean slope. A
    claim of absence, judged on the Wilcoxon signed-rank test over fields of true against shuffled
    slopes - reproduced when P >= 0.05, not reproduced when P < 0.05, with the median difference
    given either way. The paper does not say which 26 fields enter (open detail 9); the main
    reading takes all pairs of all neurons (465 pairs of 31 neurons in the example) in fields with
    at least two tuned neurons, since SI is zero for every pair otherwise. SI of unit-length tuning
    vectors is shown as a variant, as the paper's slope magnitudes may imply a normalized scale.
    The paper's SEM for the true median (0.000675) is about 0.1% of the value and is not used as
    the tolerance; 10% is used.
- id: fig4c-barrel-septum-tuned
  statement: In 3 mice with reconstructed barrel maps, tuned neurons were evenly distributed between
    barrel- and septum-related areas (38.8% and 35.8% tuned, P = 0.58).
  source: Results, paragraph 7; Figure 4B and 4C
  quote: n = 3 mice; respectively, n = 167, 102, and 117 imaged neurons, of which n = 59, 39, and 47
    were tuned ... Tuned neurons were evenly distributed between barrel- and septum-related areas
    (38.8% and 35.8%, respectively were tuned; P = 0.58; Fisher exact test; Fig. 4C)
  statistics:
  - test: Fisher exact test
    p: 0.58
    n: 386 neurons from 3 mice
  expected:
  - quantity: imaged neurons, mouse 1 of the reconstructed three
    value: 167
    tolerance: 17
  - quantity: imaged neurons, mouse 2
    value: 102
    tolerance: 10
  - quantity: imaged neurons, mouse 3
    value: 117
    tolerance: 12
  - quantity: tuned neurons, mouse 1
    value: 59
    tolerance: 6
  - quantity: tuned neurons, mouse 2
    value: 39
    tolerance: 4
  - quantity: tuned neurons, mouse 3
    value: 47
    tolerance: 5
  - quantity: percentage of barrel-related neurons tuned
    value: 38.8
    tolerance: 3.9
    unit: percent
  - quantity: percentage of septum-related neurons tuned
    value: 35.8
    tolerance: 3.6
    unit: percent
  depends_on:
  - fig2de-tuned-fraction
  criterion: The three mice are those with histology (experiments 8 to 10 in the data set's
    description). Each neuron is placed on the barrel map by aligning the imaged field to the
    reconstruction (Methods, Histology and Barrel Field Reconstruction) and assigned to barrel or
    septum by its soma centre. A claim of absence, judged on the Fisher exact test of tuned against
    non-tuned by barrel against septum over the pooled neurons - reproduced when P >= 0.05, not
    reproduced when P < 0.05, with the two percentages given either way. If the histology PDFs do not
    allow the registration, the claim cannot be tested.
- id: fig4d-border-distance-by-feature
  statement: Neurons tuned to position, velocity and acceleration did not differ in their distance
    to the nearest barrel border (P = 0.77, 0.70 and 0.68), so feature tuning is not organized
    relative to the barrel map.
  source: Results, paragraph 7; Figure 4D
  quote: Neurons tuned to different features were not located differently relative to barrel
    borders, that is, relative to the columnar structure of barrel cortex ... Kolmogorov–Smirnov
    2-sample test; Fig. 4D)
  statistics:
  - about: position against velocity
    test: Kolmogorov-Smirnov 2-sample test
    p: 0.77
  - about: position against acceleration
    test: Kolmogorov-Smirnov 2-sample test
    p: 0.7
  - about: velocity against acceleration
    test: Kolmogorov-Smirnov 2-sample test
    p: 0.68
  depends_on:
  - fig4c-barrel-septum-tuned
  criterion: For each significantly tuned neuron of the three mice, the horizontal distance from
    its soma to the nearest barrel border on the registered map. A claim of absence, judged on the
    three Kolmogorov-Smirnov 2-sample tests - reproduced when all give P >= 0.05, not reproduced when
    any gives P < 0.05, with the medians given. The paper does not say where a neuron tuned to several
    features goes or whether the distance is signed (open detail 10); the main reading puts a neuron
    in every group it is significantly tuned to (the Methods allow mixed selectivity) and uses the
    unsigned distance, as the text says "distance ... to the nearest barrel border". Single-feature
    neurons only, and the signed distance (inside barrels positive), are shown as variants.
