    data (n = 49 fields of view including n = 1054 neurons; P = 1.11 × 10−9; Wilcoxon signed-rank
    test; Fig. 3C)
  statistics:
  - test: Wilcoxon signed-rank test
    p: 1.11e-9
    n: 49 fields of view, 1054 neurons
  expected:
  - quantity: mean over fields of the mean pairwise correlation (tolerance the paper's SEM)
    value: 0.1004
    tolerance: 0.008
  - quantity: mean over fields of the mean pairwise correlation, shuffled (tolerance the SEM)
    value: 0.011
    tolerance: 0.0024
  depends_on:
  - dataset-size
  criterion: As the Methods (Measurements of Response Properties, paragraph 3) - for every pair of
    neurons in a field, the Spearman correlation of their whole corrected fluorescence time series
    over the four concatenated recordings; the field's value is the mean over pairs. Shuffled data
    permute, for each neuron independently, the temporal order of its responses to the stimulus
    presentations. Open (detail 7) - the signal is neuropil-corrected fluorescence before dF/F0 (main
    reading, the Methods' "corrected fluorescence") or dF/F0; a presentation's segment runs from its
    onset to the next onset, permuted over the whole concatenated series or within each recording;
    the shuffled value is the mean over 100 permutations (a standard choice, the count the paper uses
    for SI), one permutation shown as a variant. Reproduced when the Wilcoxon signed-rank test over
    fields of true against shuffled means gives P < 0.05 with true above shuffled, and both means
    fall within their tolerances; partially reproduced when the test holds and a mean falls outside.
