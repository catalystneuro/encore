# Claims for Payne, Wiedmann, Eiber, Wong, Senn, Osborne, Keast & Fallon (2020), "Recording of
# Electrically Evoked Neural Activity and Bladder Pressure Responses in Awake Rats Chronically
# Implanted With a Pelvic Nerve Array", Front. Neurosci. 14, 619275, on SPARC:206.
#
# Provenance: written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub
# Actions"), 2026-11-17, protocol pilot-16 as stated in docs/protocol.md (Reader, steps 1 to 4).
#
# Text read: the version of record, from Europe PMC (PMC7773906, JATS XML flattened;
# paper/10.3389-fnins.2020.619275.txt), the main text, Materials and Methods, Table 1, figure
# legends and Discussion. The paper has no supplement. No figure was read from a PDF page (no
# PDF was supplied); Figure 2C, 3C and 5C/D are known here only from their legends and the
# Results.
#
# Code read: none. The paper links no code; its Data Availability Statement says the raw data
# "will be made available by the authors". Cystometry was analysed with customized MATLAB
# software (R2019b) and c-Fos counts in R 3.5.2 and RStudio (Methods), neither of which is
# linked. So no method detail below is settled by code. The SPARC dataset's title and
# description (electrical neuromodulation of the rat pelvic nerve by chronically implanted
# planar four-electrode arrays, and bladder pressure responses by cystometry in awake rats)
# were read; no file of the dataset was opened.
#
# Data the paper used (Methods; Results).
# - Animals. 24 male Sprague-Dawley rats, 8 to 9 weeks old. Pelvic nerve array (four platinum
#   electrodes E1 to E4, E1 closest to the bladder; E1-E2 and E3-E4 are 0.75 mm apart centre to
#   centre, the two pairs 2.85 mm apart centre to centre) sutured over the right pelvic nerve
#   near the major pelvic ganglion (MPG); bladder catheter in the dome.
# - Anaesthetised ECAPs (Figure 2A to C). 5 urethane-anaesthetised rats, end of life.
#   Stimulation on E1-E2 (bipolar, 100 us pulse, 50 us interphase gap, 10 Hz), recording on
#   E3-E4. Two sets of ECAPs, each the average of 50 responses, at 0 to 2 mA in 0.1 mA steps;
#   sampled at 100 kHz, filtered 300 to 5000 Hz, gain 10^2. Three positive peaks P1, P2, P3.
#   Threshold, the lowest current giving a response of at least 0.05 uV in both recordings.
# - Awake ECAPs. Chronically implanted awake rats at week 0 and week 1 after implantation
#   (Methods say three rats, Results say n = 4).
# - Impedance. Common ground impedance (biphasic 25 us per phase, 931 uA; Z from the voltage
#   at the end of the first phase): 38 electrodes in 10 arrays before implantation, day 1 and
#   2 weeks; 8 electrodes in 2 arrays at 8 weeks.
# - Colonic pressure. 3 urethane-anaesthetised rats, colonic balloon at 30 to 35 mmHg, pelvic
#   nerve stimulation at 10 Hz, 100 us, 1 mA; 13 replicate responses in the one responder.
# - Awake cystometry (Figure 3, Table 1). 12 rats in initial studies and 12 habituated rats
#   (3 days, 30 min a day). Sessions of 2 h between day 7 and 18 after surgery, and in 2 rats
#   at 8 weeks. Saline infused at 100 ul/min; bladder pressure sampled at 1 kHz (LabChart).
#   Pelvic nerve stimulation trains of 10 s, biphasic, 100 us, 10 to 25 Hz, 0.5 to 1.5 mA, at
#   chosen stages of the cycle (mostly at an estimated 50 to 80% fill). Unstimulated voiding
#   parameters from the three cycles before any stimulation, in 9 rats (Table 1). Stimulated
#   responses in 8 rats, classified as evoked voids (visible urine) or evoked non-voiding
#   contractions (eNVC).
# - Ganglion histology (Figure 4). L6 and S1 DRG and MPG, ipsi- and contralateral, from 2 rats
#   at 50 days; ATF-3, CGRP and synaptophysin; archived axotomy ganglia (Payne et al., 2015) as
#   positive control. Assessed qualitatively.
# - Spinal c-Fos (Figure 5). 3 rats at day 10 after a session of cystometry and stimulation;
#   segments L5 to S2, five 40 um sections per segment; c-Fos+ neurons counted per region
#   (laminae I to VIII and X, SDCom, SPN) on each side.
#
# Inconsistencies in the paper, noted for the author. The awake ECAP cohort is three rats in
# the Methods and n = 4 in the Results. The anaesthetised thresholds are called "mean" in the
# Results, but the Statistics section says thresholds are given as median and IQR. The awake
# thresholds are given as value plus or minus a spread that is not named (SD or SEM). The
# impedance spreads are also unnamed. The c-Fos session is 60 min in the Results and a 2-h
# testing period in the Methods. The Results sentence "in one rat the threshold of P2 was higher
# than P1" states the reverse of the Figure 2B legend and the Discussion (P1 higher than P2 in
# one rat). The anaesthetised P2 velocity range (0.35 to 1.13 m/s) does not follow from the P2
# latency range (2.51 to 4.16 ms) by the distance that gives every other printed velocity. The
# array is on the right pelvic nerve in the Methods and Figure 1C, on the left in the Figure 5B
# and 5C legends. The Discussion counts voids within 30 s of stimulation in eight rats; the
# Results say seven of eight rats.
#
# Details the paper leaves open, named in the criteria with the readings it allows: the
# electrode distance used for conduction velocity; the stimulus level at which peak latencies
# are taken; how threshold amplitude is measured; mean or median across rats; which groups
# the awake Friedman test compares; the definitions of threshold pressure, peak pressure,
# contraction duration and HFPO frequency (the paper cites Andersson et al., 2011 and Fraser
# et al., 2020 for them); the window that makes a void "immediately" follow stimulation; the
# family of comparisons for the c-Fos Welch tests.
