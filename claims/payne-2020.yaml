- id: table1-hfpo-frequency
  statement: High-frequency pressure oscillations during voiding contractions had a centre
    frequency of 10.7 Hz (95% CI 8.3 to 13.0), n = 9 rats.
  source: Table 1, row HFPO frequency; Methods, Bladder Pressure Responses, paragraph 3
  inferred: The number is only in Table 1; the Methods say only that HFPOs were analysed to
    estimate the centre frequency of oscillation.
  statistics:
  - test: mean and 95% CI
    ci:
      low: 8.3
      high: 13.0
      level: 0.95
      unit: Hz
    n: 9 rats
  expected:
  - quantity: mean HFPO centre frequency
    value: 10.7
    tolerance: 2.4
    unit: Hz
  criterion: >-
    Tolerance is the half-width of the printed 95% CI (the larger side). Same cycles and rat
    means as table1-minimum-pressure. The paper does not say how the centre frequency is
    estimated. Readings (a) the frequency of the largest peak of the power spectrum of the
    pressure during the oscillation period, between 3 and 30 Hz, (b) the number of oscillation
    peaks per second over that period. The oscillation period is the stretch of elevated
    pressure in the voiding contraction (Figure 3B2 legend). Reproduced when the mean lies within
    the printed CI under one reading; both are shown.
- id: table1-comparable-to-published
  statement: Voiding parameters after array implantation were comparable to published values
    in naive rats, including Wiedmann et al. (2020) for threshold pressure, peak pressure,
    contraction duration and inter-void interval.
  source: Results, Urodynamic Effects of Pelvic Nerve Array Implantation and Stimulation in
    Awake Rats, paragraph 2; Table 1; Figure 3C legend
  quote: These urodynamic parameters were comparable to published values ( Zhao et al., 2010 ;
    Andersson et al., 2011 ; Fraser et al., 2020 ; Wiedmann et al., 2020 )
  data: with_inputs
  depends_on:
  - table1-threshold-pressure
  - table1-peak-pressure
  - table1-contraction-duration
  - table1-intervoid-interval
  criterion: >-
    The paper reports no test; Table 1 sets each mean and 95% CI beside those of Wiedmann et
    al. (2020, n = 6 rats; threshold 4.5, 1.8 to 7.3 mmHg; peak 44.6, 15.3 to 74 mmHg; duration
    37.2, 25.1 to 49.3 s; interval 8, 5.3 to 10.6 min), so the comparison is judged as the table
    makes it. Reproduced when, for each of the four parameters, the 95% CI computed here
    overlaps the Wiedmann CI printed in Table 1; partially reproduced for two or three.
- id: stim-evoked-voiding
  statement: Stimulation delivered at a partial fill was immediately followed by voiding in
    seven of eight rats, repeated in 3 to 6 cycles in six of these.
  source: Results, Urodynamic Effects of Pelvic Nerve Array Implantation and Stimulation in
    Awake Rats, paragraph 2; Figure 3A, 3B and 3D
  quote: When delivered during this partly filled state, electrical stimulation of the pelvic
    nerve was immediately followed by post-stimulation voiding (urine release) in seven of eight
    rats and was repeated in 3–6 cycles in six of these rats
  expected:
  - quantity: rats with stimulus-evoked voiding
    value: 7
    tolerance: 0
    unit: rats of 8
  - quantity: rats with evoked voiding in 3 to 6 cycles
    value: 6
    tolerance: 0
    unit: rats
  criterion: >-
    Counts of rats are exact. A response is a void when urine is visibly excreted (Methods,
    Bladder Pressure Responses), so the classification needs the experimenters' annotation of
    each stimulation; when the data hold none, the claim cannot be tested from pressure alone
    and is blocked. "Immediately followed" is read as a void within 30 s of stimulation, the
    window the Discussion uses (paragraph 5); the end of the 10-s train or its onset as the
    start of the window are both shown. The eight rats are those with stimulation after
    habituation.
- id: stim-void-trials
  statement: In 27 trials across eight rats a void was observed within 30 s of stimulation.
  source: Discussion, paragraph 5
  quote: we consider it unlikely that in the 27 trials in eight rats where we observed a void
    within 30 s of our stimulation this was always the case
  depends_on:
  - stim-evoked-voiding
  expected:
  - quantity: stimulation trials followed by a void within 30 s
    value: 27
    tolerance: 2.7
    unit: trials
  criterion: >-
    Tolerance 10%. Voids as annotated in the data (see stim-evoked-voiding); window starts at
    (a) train onset or (b) train end. The Discussion says eight rats, the Results seven of eight
    with evoked voiding; the count is over the eight stimulated rats either way, and the number
    of rats contributing is shown. Reproduced when the count is within tolerance under one
    reading.
- id: stim-early-void
  statement: In two rats the stimulus-evoked void occurred very early in the normal void cycle.
  source: Results, Urodynamic Effects of Pelvic Nerve Array Implantation and Stimulation in
    Awake Rats, paragraph 2; Figure 3A and 3B1
  quote: in two rats stimulus evoked voiding was even more clearly demonstrated by the pelvic
    nerve induced void occurring very early in the normal void cycle
  depends_on:
  - stim-evoked-voiding
  - table1-intervoid-interval
  criterion: >-
    The paper gives no cut-off for "very early". Readings (a) an evoked void less than half the
    rat's mean unstimulated inter-void interval after the previous void (below the 50 to 80%
    fill the experimenters targeted), (b) less than a quarter of it. Reproduced when at least
    two rats have such a void under one reading.
- id: stim-nonvoiding
  statement: Stimulation also produced non-voiding bladder pressure responses, without urine
    release, in six of eight rats.
  source: Results, Urodynamic Effects of Pelvic Nerve Array Implantation and Stimulation in
    Awake Rats, paragraph 3; Figure 3D
  quote: Electrical stimulation of the pelvic nerve also produced non-voiding bladder pressure
    responses (not accompanied by release of urine) in six of eight rats
  expected:
  - quantity: rats with evoked non-voiding contractions
    value: 6
    tolerance: 0
    unit: rats of 8
  criterion: >-
    Classification as in stim-evoked-voiding, from the experimenters' annotation of urine
    release. Where a response must be judged from pressure, the paper gives no amplitude
    criterion; readings (a) a rise in bladder pressure after the train above the pre-train
    baseline by more than the relative threshold pressure of that rat, (b) any annotated eNVC.
    Reproduced when exactly six of eight rats show a non-voiding response.
- id: stim-voiding-to-nonvoiding
  statement: Within sessions with both responses, evoked voids were common early and became
    less frequent as the session went on, while non-voiding pressure changes became more common.
  source: Results, Urodynamic Effects of Pelvic Nerve Array Implantation and Stimulation in
    Awake Rats, paragraph 3
  quote: it was common to observe stimulus evoked voiding contractions early in the experimental
    session, but as the session progressed, voiding responses became less frequent and
    non-voiding pressure changes become more common
  depends_on:
  - stim-evoked-voiding
  - stim-nonvoiding
  criterion: >-
    The paper reports no measure or test. Fixed here from the sentence: in each rat with both
    evoked voids and eNVCs, the mean stimulation time of the voids is earlier than that of the
    eNVCs. Reproduced when this holds in more than half of those rats; the per-rat order is
    shown.
- id: fig3e-eight-week-responses
  statement: In both rats implanted for 8 weeks, stimulation produced both voiding and
    non-voiding responses, and the parameters of filling-evoked and stimulation-evoked voids
    were similar to those of rats implanted for a shorter time.
  source: Results, Urodynamic Effects of Pelvic Nerve Array Implantation and Stimulation in
    Awake Rats, paragraph 4; Figure 3E
  quote: In both cases, stimulation produced both voiding (indicated in as “eV” in Figure 3E )
    and non-voiding responses (indicated in as “eNVC” in Figure 3E ) during cystometry ...
    The urodynamic parameters of filling evoked voids and stimulation evoked voids where similar
    to those in rats implanted for the shorter duration
  depends_on:
  - table1-minimum-pressure
  criterion: >-
    Classification as in stim-evoked-voiding. The paper gives no test for "similar"; fixed here
    from Table 1 as the comparison it offers. Reproduced when both 8-week rats show at least one
    evoked void and one eNVC, and their mean parameters (Table 1 definitions and readings) lie
    within the range of the per-rat means of the short-term rats widened by 10% of each bound,
    for at least four of the six parameters.
- id: fig4-atf3-rare
  statement: ATF3-positive neuronal nuclei were absent or rare in L6 and S1 DRG and in the MPG
    ipsi- and contralateral to the array 50 days after implantation, while numerous in archived
    axotomised positive controls.
  source: Results, Immunohistochemical Analysis of Neural Injury Markers in Ganglia, paragraphs 1
    and 2; Figure 4A to 4D
  quote: ATF3-positive neuronal nuclei were absent or rare in sections taken from ganglia either
    ipsi- or contralateral to the implant ... very few or no ATF3-positive neuronal nuclei (
    Figure 4C ) were seen in sections from MPG ipsi- or contralateral to the array
  criterion: >-
    Sections were assessed qualitatively (Methods). Reproduced when the images or annotations in
    the data show no more than a few ATF3-positive nuclei per section in implanted-animal DRG
    and MPG, and many in the control ganglia. The paper fixes no count; "a few" is read as at
    most 5 per section, a choice made here.
- id: fig4ef-axons-intact
  statement: CGRP-positive sensory axons traversed ipsi- and contralateral MPG, and
    synaptophysin-positive boutons surrounded the entire population of MPG neurons on both sides
    after 50 days of implantation.
  source: Results, Immunohistochemical Analysis of Neural Injury Markers in Ganglia, paragraph
    3; Figure 4E and 4F
  quote: many axons were observed to traverse both ipsi- and contralateral MPG ( Figure 4E ) ...
    We found that following 50 days implantation of the device, synaptic boutons innervated the
    entire population of MPG neurons, ipsilateral and contralateral to the surgery
  criterion: >-
    Qualitative assessment (Methods). Reproduced when the data's images or annotations show
    CGRP-positive axons in the MPG on both sides and synaptophysin boutons around MPG neurons on
    both sides.
- id: fig5-cfos-distribution
  statement: After cystometry and stimulation, c-Fos-positive neurons in L5 to S1 were most
    dense in the dorsal horn, the sacral dorsal commissural nucleus and the sacral preganglionic
    nucleus of L6 and S1.
  source: Results, Immunohistochemical Analysis of Noxious Neuronal Activity in Spinal Cord,
    paragraph 1; Figure 5A to 5C
  quote: In spinal segments L5-S1, neurons with c-Fos + nuclei were most densely distributed in
    dorsal horn, the sacral dorsal commissural nucleus (SDCom) and the SPN of segments L6 and S1
  criterion: >-
    From the per-section counts of c-Fos+ neurons by region, segment and side (Methods), in
    segments L5 to S1 as the sentence says. The paper does not normalise by region area;
    readings (a) raw counts per region, (b) counts per unit area where areas are given. The
    paper does not say which laminae it calls dorsal horn; readings (a) laminae I to IV (1Sp to
    4Sp), (b) laminae I to VI (1Sp to 6Sp). Regions are compared one by one, as Figure 5C and
    5D list them. Reproduced when, summed over the three rats and both sides, SDCom, SPN (L6 and
    S1) and the highest dorsal horn lamina each rank above every region outside the dorsal horn,
    SDCom and SPN, under one combination of readings; all are shown.
- id: fig5-cfos-no-side-difference
  statement: c-Fos-positive neuron counts did not differ between the implanted and stimulated
    side and the contralateral side of the lumbosacral cord.
  source: Results, Immunohistochemical Analysis of Noxious Neuronal Activity in Spinal Cord,
    paragraph 1; Figure 5C and 5D legends
  quote: No difference was detected in the pattern of c-Fos between the two sides of the spinal
    cord ( Figure 5D )
  criterion: >-
    A claim of absence, judged on the paper's test (Statistics section). Exact Welch two-sample
    t-tests of counts per rat, implanted side against contralateral side (n = 3 rats), with the
    Hommel correction across the comparisons. The family is not stated; readings (a) one test
    per region, counts summed over segments L5 to S2; (b) one test per region and segment.
    Reproduced when no Hommel-adjusted P is below 0.05 under the reading run; both readings are
    shown with the mean differences and CIs, and a paired t-test is shown as a variant.
- id: fig5-no-lamina1
  statement: No activation of lamina I neurons was detected on either the stimulated side or the
    contralateral side.
  source: Results, Immunohistochemical Analysis of Noxious Neuronal Activity in Spinal Cord,
    paragraph 1; Figure 5C; Discussion, paragraph 4
  quote: No activation of lamina I neurons was detected in either the stimulated side (array
    implanted on the pelvic nerve) or the contralateral side
  criterion: >-
    From the c-Fos counts in lamina I (1Sp). The paper gives no threshold for activation.
    Readings (a) zero c-Fos+ lamina I neurons in every section, (b) lamina I counts per section
    no higher than the lowest of the other dorsal horn laminae (2Sp to 4Sp). Reproduced under
    either reading; the counts are shown.
- id: macroscopic-no-pathology
  statement: At euthanasia no infection, irritation or inflammation was seen around the
    connector, cable or array in any implanted rat; in the two rats implanted for 8 weeks,
    examined in more detail, a thin fibrous capsule formed around the array without spreading,
    and the prostate, pelvic nerve and vessels were undamaged.
  source: Results, Post-mortem Analysis of Pathology After Chronic Implantation of Pelvic Nerve
    Array, paragraph 1; Results, Urodynamic Effects, paragraph 1
  quote: A thin fibrous tissue encapsulation had formed around the array further stabilizing the
    device ... Suturing of the electrode array to the soft tissue overlying the prostate had not
    caused any macroscopic damage to the prostate, pelvic nerve or blood vessels
  criterion: >-
    Visual post-mortem examination. Reproduced when the data hold post-mortem notes for the
    implanted rats and none records infection, inflammation or damage.
