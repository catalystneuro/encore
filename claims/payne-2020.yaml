- id: table1-minimum-pressure
  statement: In 9 awake implanted rats, the minimum bladder pressure of unstimulated voiding
    cycles was 10.3 mmHg (95% CI 7.4 to 13.2).
  source: Table 1, row Minimum pressure
  inferred: The number is only in Table 1; the Results sentence before it says the parameters
    were comparable to published values.
  statistics:
  - test: mean and 95% CI
    ci:
      low: 7.4
      high: 13.2
      level: 0.95
      unit: mmHg
    n: 9 rats
  expected:
  - quantity: mean minimum pressure
    value: 10.3
    tolerance: 2.9
    unit: mmHg
  criterion: &urodynamics >-
    Tolerance is the half-width of the printed 95% CI. From the three voiding cycles before any
    stimulation in each rat (Methods, Bladder Pressure Responses). The minimum pressure is the
    lowest pressure after a voiding contraction; relative pressures subtract it (Methods). The
    paper takes the other definitions from Andersson et al. (2011) and Fraser et al. (2020)
    without stating them, so they are open, with readings. Threshold pressure is (a) the pressure
    at the onset of the voiding contraction, where pressure begins its rapid rise, or (b) the
    pressure at the moment of urine release. Peak (closing) pressure is the maximum pressure
    during the contraction. Contraction duration is (a) from the onset of the rapid rise to the
    return to minimum pressure, or (b) the time pressure stays above threshold pressure.
    Inter-void interval is the time between successive voids. The mean over 9 rats is (a) the
    mean of each rat's mean over three cycles, with a t-based 95% CI, or (b) the mean over all
    cycles pooled. Reproduced when the mean lies within the printed 95% CI under one reading;
    all readings are shown.
