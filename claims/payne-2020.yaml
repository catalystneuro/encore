- id: anes-ecap-recorded
  statement: In all five urethane-anaesthetised rats, ECAPs with complex waveforms were recorded
    on the non-stimulating electrode pair during graded stimulation and could be separated from
    the stimulation artefact.
  source: Results, Electrically Evoked Compound Action Potentials, paragraph 1; Figure 2A and 2B
  quote: In all cases, ECAPs with complex waveforms could be recorded from the non-stimulating
    electrode pair during graded electrical stimulation; these ECAPS could be separated from the
    stimulation artifact
  criterion: >-
    Per rat, the averaged E3-E4 response to E1-E2 stimulation at each current (Methods, ECAP and
    Impedance Testing). Reproduced when, in each of the five rats, at least one positive peak
    after the end of the stimulus artefact reaches the paper's threshold of 0.05 uV in both
    recordings at some current, and is absent at 0 mA. The paper does not say where the artefact
    ends; the readings are (a) after 1 ms from pulse onset, (b) after the first return of the
    trace to baseline; both are shown.
