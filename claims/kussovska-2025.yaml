# Claims for Kussovska, Kim & Rungratsameetaweemana (2025), "Neural heterogeneity shapes the
# temporal structure of human working memory", bioRxiv, doi:10.1101/2025.10.31.684900, tested on
# DANDI:000469 (reused; the paper analyses the dataset of Kyzar et al. 2024, ref. 59).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-11-10, protocol pilot-14 as stated in docs/protocol.md.
#
# Text read. paper/10.1101-2025.10.31.684900.txt, the bioRxiv full-text page of the preprint
# posted 1 November 2025 (its header says "version of record"; the page says "New Results" and
# offers a "current version", so a later version may exist; it was not read). It holds the
# abstract, Introduction, Results, legends of Figures 1 to 6, Discussion, Methods, Data and Code
# availability and references. No PDF was supplied. The Extended Data figures (Extended Data
# Figs 1 to 5, behind "Supplementary Material") and their legends are not in the text read; the
# Source Data are not either. The main findings are all stated in the main text and legends, so
# claims were written; claims on Extended Data panels rest on the main-text sentences that cite
# them, and their sources say "(not in the text read)". Several equations of the Methods (the GLM
# link, the local-peak and prominence formulas of Burst detection) were lost in extraction.
#
# Code read. github.com/dariakussovska/heterogeneitywm at commit 5144fe8 (2025-10-26), the last
# commit before the preprint was posted. Later commits (REVISIONS/ and R2_REVISIONS/, 2026) are
# for a revised version and were not used. The repository holds Python scripts named by figure
# panel (01_task, 02_psth_decoding, 03_dpca, 04_bursting, 05_cell_analysis, 06_cell_specific),
# pipeline scripts 01 to 08 (extraction from the NWB files, standardisation, concept cells,
# spectral clustering, dPCA matrices), MATLAB functions for the autocorrelograms and the
# CellExplorer fit (data/cell_analysis/calc_ACG_metrics.m, fit_ACG.m, Mean_ACG.m,
# normalize_acg_to_unit.m), and shipped intermediate tables. Facts about the code that bear on
# every claim:
# - The code reads only the Sternberg file of each subject (sub-<n>/sub-<n>_ses-2_ecephys+image.nwb,
#   01_data_extraction.py:417), and its README downloads dandiset version 0.240123.1806, while
#   the paper cites version 0.231213.2047 (Methods, Participants; Data availability).
# - The matched trial sets of the Methods (96 trials per participant matched on load; 75 per
#   participant matched on stimulus identity) come only from the shipped tables
#   data/new_trial_info.xlsx (new_trial_id) and data/new_trial_final.xlsx (trial_id_final),
#   merged at 03_standardization.py:97-121 and 232-261. No script builds them, and the paper
#   does not say how the trials were chosen. Pseudo-population analyses align every
#   participant's neurons on these ids and take the trial labels of one participant (subject 1
#   for the GLM, main_1e,f.py:9; subject 14 for decoding and dPCA, main_2d,supp_1d,e.py:11-12,
#   08_dpca_matrices.py:15-26).
# - The ACG features (R2, tau_rise, tau_decay, mean normalised ACG, burst index) are computed in
#   MATLAB with CellExplorer; the spike input data/cell_analysis/spikes_struct.mat is an empty
#   2-byte placeholder, and the Python scripts read the outputs from the shipped
#   data/cell_analysis/Cell_metrics.xlsx. They can be recomputed from the dataset's spike times
#   with the MATLAB functions (or a port of them); the shipped table is outside data.
# - The concept-cell bootstrap (04_concept_cells.py:76-90) has no random seed.
#
# Data the paper used (as the paper reports it). 21 patients with intractable epilepsy, 41
# recording sessions (age 17 to 71), microwires in hybrid depth electrodes; 902 single units
# sorted with OSort, in amygdala (259), hippocampus (190), dACC (171), preSMA (250) and vmPFC
# (32). Task: a modified Sternberg task. Each trial is fixation (900 to 1000 ms), encoding of 1
# to 3 images (load 1 to 3) from a participant-specific set of five images, maintenance of 2.5
# to 2.8 s ("hold"), and a probe with a yes/no (old/new) button response; reaction time is from
# probe onset to button press. Sixteen participants completed 135 trials and five completed
# 108. Measured variables used: spike times per unit and the unit's brain area; per trial the
# load, the image identity of each encoding period and of the probe, whether the probe was in
# memory, response accuracy, and the timestamps of fixation, encodings, maintenance, probe and
# response. MTL is amygdala and hippocampus combined (Results, paragraph on Fig. 2e). Unless a
# claim says otherwise, main-figure analyses use load 1 trials (Methods, Statistical analyses).
# The rodent validation of the cell-type classifier uses the CellExplorer ground-truth dataset
# (ref. 72), which is not in DANDI:000469.
schema_version: 2
paper: doi:10.1101/2025.10.31.684900
claims:
- id: units-by-region
  statement: Recordings from the 21 patients yielded 902 well-isolated units, 259 in the amygdala,
    171 in the dACC, 190 in the hippocampus, 250 in the preSMA and 32 in the vmPFC.
  source: Results, Behavior and single-neuron recordings in a working memory task, paragraph 1;
    Figure 1i; Methods, Electrophysiology, paragraph 2
  quote: Recordings from the 21 patients yielded 902 well-isolated units (Fig. 1b,i), distributed
    across the amygdala (AMY; 259 neurons), dorsal anterior cingulate cortex (dACC; 171 neurons),
    hippocampus (HPC; 190 neurons), presupplementary motor area (preSMA; 250 neurons), and
    ventromedial prefrontal cortex (vmPFC; 32 neurons).
  expected:
  - quantity: units
    value: 902
    tolerance: 0
  - quantity: amygdala units
    value: 259
    tolerance: 0
  - quantity: dACC units
    value: 171
    tolerance: 0
  - quantity: hippocampus units
    value: 190
    tolerance: 0
  - quantity: preSMA units
    value: 250
    tolerance: 0
  - quantity: vmPFC units
    value: 32
    tolerance: 0
  - quantity: patients
    value: 21
    tolerance: 0
  criterion: Counted over the units of the 21 Sternberg sessions, left and right hemispheres of
    each region merged (as main_1e,f.py:87-104 merges the location labels). Counts are exact,
    so the tolerance is zero.
- id: behavior-accuracy
  statement: Task accuracy was 88.73% ± 1.25%.
  source: Results, Behavior and single-neuron recordings in a working memory task, paragraph 2;
    Extended Data Fig. 1a (not in the text read)
  quote: Task accuracy was 88.73% ± 1.25%
  expected:
    quantity: task accuracy
    value: 88.73
    tolerance: 1.25
    unit: percent
  criterion: Accuracy is the fraction of correct responses over all trials of a participant,
    averaged over the 21 participants, as 01_task/supp_1a.py:9-17 computes it (mean and s.e.m.
    across subjects). The tolerance is the paper's stated spread. The spread is printed as ±;
    Methods, Statistical analyses say descriptive values are mean ± s.d., while the code computes
    s.e.m.; the spread is reported both ways and does not decide the claim. A second reading,
    correct trials over all trials pooled across participants, is shown as a variant.
- id: fig1c-accuracy-load1-vs-load3
  statement: Accuracy was higher for load 1 than for load 3 trials across patients.
  source: Results, Behavior and single-neuron recordings in a working memory task, paragraph 2;
    Figure 1c
  quote: Task accuracy was 88.73% ± 1.25% and was higher for load 1 than for load 3 (Wilcoxon
    rank-sum, P = 0.027; Fig. 1c).
  statistics:
  - test: Wilcoxon rank-sum
    p: 0.027
    n: 21 patients
  criterion: Per patient, the accuracy at each load; load 1 against load 3 with a two-sided
    Wilcoxon rank-sum (Mann-Whitney) test, as in 01_task/main_1c.py:16-36. The code runs a
    Kruskal-Wallis test over the three loads and then pairwise rank-sum tests with a Bonferroni
    factor of 3 and prints both raw and corrected p; the paper does not say which it reports.
    Readings are (a) the raw p and (b) the Bonferroni-corrected p. Reproduced when load 1
    accuracy is higher and p < 0.05 under one reading; the value of p under both is reported.
    A paired signed-rank test across patients is shown as a variant.
- id: behavior-rt
  statement: Reaction time for correct trials was 1.06 ± 0.28 s.
  source: Results, Behavior and single-neuron recordings in a working memory task, paragraph 2;
    Figure 1d
  quote: Reaction time for correct trials was 1.06 ± 0.28 s.
  expected:
    quantity: reaction time, correct trials
    value: 1.06
    tolerance: 0.28
    unit: s
  criterion: Reaction time is probe onset to button press (Methods, Psychophysical task), the
    probe interval of the trials table as in 01_data_extraction.py:304-309 and main_1d.py:6-8.
    No code computes the reported value, and Methods, Statistical analyses say RTs are reported
    as median with IQR while the Results print a ±. Readings are (a) the mean across
    participants of each participant's median RT on correct trials (main_1d.py takes the median
    per subject); (b) the mean across participants of each participant's mean RT; (c) the median
    over all correct trials pooled. The tolerance is the paper's stated spread. Reproduced when
    one reading falls within it; the spread under each reading (s.d., and half the IQR) is
    reported.
- id: rt-in-vs-out-memory
  statement: Reaction time was faster for probes held in memory than for probes not in memory.
  source: Results, Behavior and single-neuron recordings in a working memory task, paragraph 2
  quote: Reaction time was faster for probes held in memory than for probes not in memory
    (permutation test, P = 0.001)
  statistics:
  - test: permutation test
    p: 0.001
  criterion: No code in the repository computes this test, and the paper names only a
    permutation test (1,000 shuffles unless stated, Methods, Statistical analyses; two-sided by
    default). Which trials enter (correct trials, as for the RT above, or all trials) and what
    is permuted are open. Readings are (a) a paired permutation (sign flips, 1,000) of the
    per-participant difference in median RT between in-memory and not-in-memory probes; (b) a
    permutation of the in/out labels over all trials pooled, on the difference in mean RT;
    each on correct trials and on all trials. Reproduced when in-memory probes are faster and
    p < 0.05 under one reading.
- id: rt-correct-vs-incorrect
  statement: Correct decisions were faster than incorrect ones.
  source: Results, Behavior and single-neuron recordings in a working memory task, paragraph 2
  quote: correct decisions were faster than incorrect ones (permutation test, P = 0.002)
  statistics:
  - test: permutation test
    p: 0.002
  criterion: No code computes this test. Readings are (a) a paired permutation (sign flips,
    1,000) of the per-participant difference in median RT between correct and incorrect trials,
    over participants with incorrect trials; (b) a permutation of the correct/incorrect labels
    over all trials pooled, on the difference in mean RT. Reproduced when correct trials are
    faster and p < 0.05 under one reading.
- id: fig1e-load-modulated-neurons
  statement: During maintenance a significant proportion of neurons in the preSMA (19.6%), vmPFC
    (18.75%) and dACC (10.53%) was modulated by memory load.
  source: Results, Behavior and single-neuron recordings in a working memory task, paragraph 3;
    Figure 1e
  quote: >-
    During the maintenance epoch, the preSMA, vmPFC, and dACC showed a significant proportion of
    neurons modulated by memory load (preSMA: 19.6%, vmPFC: 18.75%, dACC: 10.53%; permutation
    test, PpreSMA = 0.001, PvmPFC = 0.009, and PdACC = 0.026; Fig. 1e)
  statistics:
  - about: preSMA
    test: permutation test on the count of significant neurons
    p: 0.001
    n: 250 neurons
  - about: vmPFC
    test: permutation test on the count of significant neurons
    p: 0.009
    n: 32 neurons
  - about: dACC
    test: permutation test on the count of significant neurons
    p: 0.026
    n: 171 neurons
  expected:
  - quantity: preSMA load-modulated neurons
    value: 19.6
    tolerance: 1.96
    unit: percent
  - quantity: vmPFC load-modulated neurons
    value: 18.75
    tolerance: 1.875
    unit: percent
  - quantity: dACC load-modulated neurons
    value: 10.53
    tolerance: 1.053
    unit: percent
  criterion: From the Methods (GLM encoding analysis) and 01_task/main_1e,f.py. For each neuron
    the spike count in the first 2.5 s of maintenance (main_1e,f.py:67-75) on each trial is the
    response of a Poisson GLM with log link on z-scored load (sklearn PoissonRegressor, alpha 0,
    main_1e,f.py:147). A neuron is significant when |beta1| is at or above the 95th percentile
    of its null from 1,000 permutations of the predictor (seed 17 in the code); a region's p is
    the fraction of null counts of significant neurons at or above the observed count. Open
    details, with the readings run. For the trials, the Methods say "96 trials per participant matched
    on load" and also "load 1 encoding and maintenance epochs", which cannot hold for a load
    predictor; readings are (a) the code's 96 load-matched trials of data/new_trial_info.xlsx
    (an input from the code repository), (b) all trials of each participant. The permutation is
    within participant (Methods) or over the shared trial vector (the code, whose blocks are
    None, main_1e,f.py:124-135); both are run. For correction, the code applies none across
    regions; the paper's P values are taken as uncorrected. Reproduced when, under one
    reading, each of the three regions is within tolerance and has p < 0.05.
- id: fig1f-rt-modulation-not-significant
  statement: No region had a significant proportion of neurons whose maintenance firing
    covaried with reaction time after correction, although the amygdala (5.79%), preSMA (8.00%)
    and vmPFC (6.25%) showed elevated percentages.
  source: Results, Behavior and single-neuron recordings in a working memory task, paragraph 3;
    Figure 1f
  quote: Although elevated percentages of RT-modulated neurons were observed in the amygdala
    (5.79%), preSMA (8.00%), and vmPFC (6.25%), none were significant after correction for
    multiple comparisons (permutation tests, P > 0.05; Fig. 1f).
  statistics:
  - test: permutation test on the count of significant neurons
    p: 0.05
    p_relation: ">"
    corrected: correction for multiple comparisons (FDR, Methods, Statistical analyses)
  expected:
  - quantity: amygdala RT-modulated neurons
    value: 5.79
    tolerance: 0.579
    unit: percent
  - quantity: preSMA RT-modulated neurons
    value: 8.0
    tolerance: 0.8
    unit: percent
  - quantity: vmPFC RT-modulated neurons
    value: 6.25
    tolerance: 0.625
    unit: percent
  criterion: A claim of absence, on the paper's test, the GLM and count permutation of
    fig1e-load-modulated-neurons with RT as the predictor, and Benjamini-Hochberg FDR over the
    five regions at 0.05 (Methods, Statistical analyses name BH-FDR for multiple comparisons).
    Reproduced when no region has corrected p < 0.05; not reproduced when one does. RT is each
    trial's own reaction time in its participant (the code uses subject 1's RT vector for every
    neuron, main_1e,f.py:113; shown as a variant). The trial readings of
    fig1e-load-modulated-neurons apply to the expected percentages; uncorrected p values are
    reported.
- id: concept-cells-count
  statement: Of 902 neurons, 58 (6.4%) were concept cells, 4 ± 4 across participants, 70.69% of
    them in the amygdala, 18.96% in the hippocampus, 1.72% in the dACC, 3.45% in the preSMA and
    5.15% in the vmPFC.
  source: Results, Concept cell definition and criteria, paragraphs 1 and 2; Figure 1j; Methods,
    Identification of concept cells
  quote: Of 902 neurons (Fig. 1i), 58 were identified as concept cells (6.4%; 4 ± 4 across
    participants). Of these 58 concept cells, 70.69% were in the AMY, 18.96% in the HPC, 1.72% in
    the dACC, 3.45% in the preSMA, and 5.15% in the vmPFC (Fig. 1j).
  expected:
  - quantity: concept cells
    value: 58
    tolerance: 5.8
  - quantity: concept cells in the amygdala
    value: 70.69
    tolerance: 7.069
    unit: percent
  - quantity: concept cells in the hippocampus
    value: 18.96
    tolerance: 1.896
    unit: percent
  criterion: From the Methods (Identification of concept cells) and 04_concept_cells.py. For each
    neuron, spike counts 200 to 1000 ms after the onset of the first encoding image, on all
    trials of all loads; the two images with the highest mean rate; a bootstrap of the
    difference in mean rate between them (1,000 resamples with replacement), two-tailed p as
    twice the smaller tail; concept cell when p < 0.05 and both images have more than one
    trial. The code differs from the Methods in two ways, run as readings, (a) the Methods,
    each image's trials resampled to their own number; (b) the code, both resampled to the
    smaller number and p as the minimum of the four terms at 04_concept_cells.py:86-90. The
    code sets no seed, so each reading is run with ten seeds and the range of counts reported.
    Reproduced when, under one reading, the count is within tolerance and the amygdala is the
    region with most concept cells, with the two largest shares within tolerance. The small
    shares (one to three cells) and the per-participant 4 ± 4 are reported without deciding.
- id: fig2ab-single-cells-not-persistent
  statement: Examined neuron by neuron, most concept cells did not maintain elevated firing for
    their preferred image throughout the maintenance epoch.
  source: Results, Persistent activity during maintenance emerges with population pooling and
    coarse temporal binning, paragraph 2; Figure 2a,b
  quote: Neuron-by-neuron examination showed that most concept cells did not maintain elevated
    firing throughout the maintenance epoch (Fig. 2a–b).
  depends_on:
  - concept-cells-count
  criterion: The paper shows one example cell and gives no rule for "throughout". From the
    Fig. 2a legend and Methods, Electrophysiology, per concept cell, load 1 trials, firing in 50
    ms bins of maintenance z-scored to fixation and smoothed (Gaussian, sigma one bin), preferred
    (first encoding image is the preferred image) against nonpreferred trials, with a
    permutation test per bin at P < 0.05. The rule for "elevated throughout" is open; readings
    are (a) significantly higher on preferred trials in at least half of the bins of the first
    2.5 s of maintenance; (b) significantly higher spike count on preferred trials in each of
    the three 1 s windows from maintenance onset (M1 to M3 as in Burst detection; M3 truncated
    at the end of maintenance), permutation test of counts, P < 0.05. Reproduced when, under one
    reading, more than half of the concept cells are not persistent; the counts under both are
    reported.
- id: fig2c-population-persistence
  statement: Averaged across the 58 concept cells, firing on preferred trials stayed higher than
    on nonpreferred trials across the maintenance epoch of load 1 trials, a pattern of persistent
    activity.
  source: Results, Persistent activity during maintenance emerges with population pooling and
    coarse temporal binning, paragraph 2; Figure 2c and legend
  quote: By contrast, averaging across the concept cell population revealed a clear pattern of
    persistent activity (n = 58; Fig. 2c).
  statistics:
  - test: bootstrap test per time bin
    p: 0.05
    p_relation: "<"
    n: 58 concept cells
  depends_on:
  - concept-cells-count
  criterion: From the Fig. 2c legend and 02_psth_decoding/main_2c,5k,l,supp_1b,c.py. Load 1
    trials; per concept cell the trial-mean rate in 50 ms bins of maintenance (aligned to its
    onset), z-scored with the cell's fixation mean and s.d. and smoothed (Gaussian, sigma one
    bin); preferred trials are those whose first encoding image is the cell's preferred image,
    nonpreferred all others (06_add_category.py:24-25). Per bin, a bootstrap over cells (1,000,
    paired resampling of cells, seed 42) of the preferred minus nonpreferred mean, two-sided,
    with BH-FDR over all bins of all panels as in the code (lines 196-286); per-panel FDR is
    shown as a variant. What counts as persistent is open; readings are (a) significant bins
    cover at least half of the first 2.5 s of maintenance; (b) every 500 ms segment of the first
    2.5 s holds a significant bin. Reproduced when the mean preferred trace is above the
    nonpreferred one and the rule holds under one reading.
- id: ext1bc-persistence-by-load
  statement: The population-level persistence of concept cells was robust at loads 1 and 2 and
    attenuated at load 3.
  source: Results, Persistent activity during maintenance emerges with population pooling and
    coarse temporal binning, paragraph 2; Extended Data Fig. 1b,c (not in the text read)
  quote: This effect was robust at loads 1 and 2, and attenuated at load 3 (Extended Data Fig.
    1b–c).
  depends_on:
  - fig2c-population-persistence
  criterion: The analysis of fig2c-population-persistence for load 2 and load 3 trials, with a
    trial preferred when any encoded image is the preferred image (06_add_category.py:96-125).
    The Extended Data legends are not in the text read, so the measure is open; it is the
    fraction of maintenance bins (first 2.5 s) with a significant preferred-over-nonpreferred
    difference. Reproduced when loads 1 and 2 meet a reading of fig2c-population-persistence
    and load 3 has a smaller fraction of significant bins than either.
- id: fig2d-cross-temporal-localized
  statement: In load 1 trials, decoders trained at specific times of encoding or early
    maintenance classified the image above chance at other times, but cross-time generalization
    clusters were sparse and temporally localized, so the information was not stably held across
    maintenance.
  source: Results, Persistent activity during maintenance emerges with population pooling and
    coarse temporal binning, paragraph 3; Figure 2d and legend; Methods, Population decoding
    analysis, paragraph 2
  quote: However, cross-time generalization clusters were sparse and temporally localized,
    indicating that the stimulus-specific information was not stably maintained across the
    maintenance epoch but re-emerged at specific moments (Fig. 2d).
  statistics:
  - test: binomial test per train-test bin pair, FDR, cluster-duration permutation null
    p: 0.05
    p_relation: "<"
  depends_on:
  - concept-cells-count
  criterion: From the Methods and 02_psth_decoding/main_2d,supp_1d,e.py. A pseudo-population of
    all concept cells, trials aligned across participants on the 75 identity-matched trials
    (data/new_trial_final.xlsx of the code; how they were chosen is not stated), load 1 trials,
    labels the first encoding image (five classes). Spike counts in 250 ms windows stepped by
    100 ms from first-encoding onset through encoding, maintenance and probe, z-scored with
    fixation; a linear SVM (sklearn SVC, linear kernel, C = 1; the Methods name the Neural
    Decoding Toolbox with LIBSVM) trained at each bin and tested at every bin with LOOCV. Per
    pair a binomial test against 20% with BH-FDR over the grid. Open, the sidedness of the
    binomial test (two-sided in Methods, Population decoding; one-sided in Methods, Statistical
    analyses and in the code) and the cluster rule (a 95th-percentile cluster-duration null from
    1,000 label shuffles in the Methods; contours longer than 13 points in the code, lines
    175-178). Both sidedness readings and both cluster rules are run. Reproduced when, under one
    reading, above-chance clusters exist for training bins in encoding or early maintenance, and
    no training bin in maintenance generalizes above chance to more than half of the maintenance
    test bins.
- id: ext1de-cross-temporal-load23
  statement: In load 2 and load 3 trials cross-time generalization was minimal.
  source: Results, Persistent activity during maintenance emerges with population pooling and
    coarse temporal binning, paragraph 3; Extended Data Fig. 1d,e (not in the text read)
  quote: In load 2 and load 3 trials, cross-time generalization was minimal, suggesting that
    higher memory load further fragments or destabilizes these representations (Extended Data
    Fig. 1d–e).
  depends_on:
  - fig2d-cross-temporal-localized
  criterion: The analysis of fig2d-cross-temporal-localized on load 2 and load 3 trials. The label
    is the first encoding image (Methods) or the last (the code, main_2d,supp_1d,e.py:147-152);
    both are run. "Minimal" is open; it is read as fewer off-diagonal train-test pairs in
    surviving clusters than at load 1, under the same cluster rule. Reproduced when both loads
    have fewer than load 1 under one label reading.
- id: fig2e-maintenance-decoding-amy-mtl
  statement: Concept cells in the amygdala and in the MTL carried significant stimulus
    information during load 1 maintenance (35.56% and 32.13% decoding accuracy, chance 20%).
  source: Results, Persistent activity during maintenance emerges with population pooling and
    coarse temporal binning, paragraph 4; Figure 2e
  quote: >-
    concept cells in AMY and in the medial temporal lobe (MTL; AMY and HPC combined) carried
    significant stimulus-relevant information during load 1 maintenance (AMY: 35.56% decoding
    accuracy, P = 0.001; MTL: 32.13% decoding accuracy, P = 0.001; permutation test; Fig. 2e)
  statistics:
  - about: amygdala
    test: permutation test
    p: 0.001
  - about: MTL
    test: permutation test
    p: 0.001
  expected:
  - quantity: amygdala decoding accuracy, load 1
    value: 35.56
    tolerance: 3.556
    unit: percent
  - quantity: MTL decoding accuracy, load 1
    value: 32.13
    tolerance: 3.213
    unit: percent
  depends_on:
  - concept-cells-count
  criterion: From the Results, Methods (Population decoding, paragraph 3) and
    02_psth_decoding/main_2e,supp_1f.py. Within each participant, the participant's concept
    cells in the region, all of its load 1 trials, labels the last (for load 1 the only) image;
    features are spike counts in 1 s windows stepped by 250 ms over the first 2.5 s of
    maintenance, all windows and cells concatenated (lines 24-27, 115-122); linear SVM, LOOCV;
    accuracy is the mean over participants. p from 1,000 label shuffles, (count of null means at
