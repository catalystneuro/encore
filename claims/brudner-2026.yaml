# Claims for Brudner, Zhou, Jayaram, Madeira Santana, Crimaldi, Clark & Emonet, "Fly navigational
# responses exploit plume-specific odor motion and gradient cues", PNAS 123(29) e2608896123 (2026),
# doi:10.1073/pnas.2608896123, on dandiset 001871.
#
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-12,
# under docs/protocol.md version pilot-14 (Reader, steps 1 to 4). Nobody had analysed the dataset's
# data when these criteria were written; the reader saw only the dandiset's title and description.
#
# Text read: the version of record (PDF supplied by a person, published 14 July 2026), as extracted
# to paper/10.1073-pnas.2608896123.txt, with the SI Appendix (pnas.2608896123.sapp.pdf, appended to
# the same text file): Supplementary Methods, the legends of Figures S1 to S5 and of Movies S1 and S2.
# The main Methods section is a short summary that refers to the SI Appendix for every detail. PDF
# pages were opened to read the bar heights of Figures 2, 4 and 5 and the panels of Figure S5, and
# the upwind-turn formula of the SI agent simulations, which the text garbles. It reads
# P_upwind = 1 / (1 + exp(-(-0.49 + 1.5 R sin^2 theta))).
#
# Code read. The paper links github.com/emonetlab/GradientMotionMultiplePlumes; read at commit
# effc7b0317f6d3b62136c2a07bcba3e80e778575 (2026-07-14). It holds
#   - the Fig. 5E, 5F and S5D-E analysis (src/gradient_motion_panels/summary_tables.py,
#     scripts/generate_published_summary_tables.py, metadata/published_panel_params.json), written
#     to run on the behavior NWB files of dandiset 001871 version 0.260630.1657, and the published
#     panel tables it produced (data/published_panel_tables/fig5e_*.csv and fig5f_s5_*.csv);
#   - the Fig. 1 cue maps (plume_fields.py, generate_figure1_summary.py), the Fig. 2 logistic models
#     (centerline_models.py, generate_figure2_summary.py) with the plotted values hard-coded from the
#     preprint notebook (data/published_panel_tables/fig2_glm_summary.csv), and a re-implementation of
#     the Fig. 3 network training and probes (figure3_training.py, figure3_models.py), with
#     REPRODUCE_FIGURES_1_3.md, which says the legacy training arrays, threshold masks and
#     checkpoints of Figs. 2 and 3 were not deposited and names where the code and the SI disagree;
#   - nothing for the agent simulations (Fig. 4, Fig. S4, Fig. S5F-H) or for Fig. S1.
# Where the SI leaves a choice open and the code settles it, the criteria follow the code and say
# so; where they disagree, the SI Methods give the main reading and the code a named variant.
#
# The data the paper used.
#   Behavior (Fig. 5, Fig. S5A-E). Adult female Drosophila, Orco-GAL4 > 20XUAS-CsChrimson, all
#   blinded by GMR-hid, starved 3 days and fed all-trans-retinal, run in cohorts of 10 to 30 flies
#   from one vial in a 270 x 170 x 10 mm arena with 100 mm/s laminar air, filmed at 60 fps under IR.
#   A projector delivered to-scale movies of the smooth or the complex plume (2 min trials, 1 min
#   rest, 8 trials per cohort, projection flipped across the centerline between trials); each cohort
#   saw one plume type only. Tracked with SLEAP; per fly trajectory, position, heading, velocity and
#   the gradient, motion and intensity signals at the antennae; saccade-like turn events. The paper
#   reports no count of cohorts, flies, trajectories or turns. The code selects the behavior files
#   by path, smooth files containing "nagel-smoke" and complex files containing "smoke-2a".
#   Plume movies (Figs. 1 to 4, Fig. S1). The complex plume is a 60 Hz smoke movie (smoke_1a_orig),
#   frames 300 to 1799 used, 1088 x 1728 pixels of 0.153 mm, centerline at row 590; the dandiset
#   holds that 1500-frame window. The smooth plume is from Alvarez-Salvado et al. 2018 (Connor et al.
#   2018 measurements), Dryad doi:10.5061/dryad.g27mq71, file 10302017_10cms_bounded_2.h5, dataset
#   /dataset2, 15 Hz, which the paper rescaled to the complex plume's time and space resolution
#   (1088 x 1696, centerline at row 544); it is not in the dandiset. Three freestream plumes (Connor
#   et al. 2018; 5, 10 and 20 cm/s per the dandiset's description) are in the dandiset as 1500-frame
#   windows, with a compact asset of the Fig. S1 freestream panel inputs.
#   The paper also deposited plume recordings, behavioral tracking data and processed datasets in
#   the Yale Dataverse, doi:10.60600/YU/590UBV (ref. 83).
#
# Missing from the paper and its code, as needed by claims below. The agent simulation code
# (Fig. 4, Fig. S4, Fig. S5F-H) and the trained networks; the training and test arrays of Figs. 2
# and 3 and the threshold that defined the valid sampling regions; the code of Fig. S1; the numbers
# of flies, trajectories and turns behind Fig. 5. The log-likelihood levels plotted in Fig. S5D and
# S5E (about -0.596 and -0.685 for the full models) differ from the code's published table
# (-0.576 and -0.676), while the cue dominance of Fig. 5F matches the table.
schema_version: 2
paper: doi:10.1073/pnas.2608896123
claims:
- id: fig1eh-snapshot-organization
  statement: In single snapshots, the crosswind gradient feature has opposite signs on the two sides
    of the centerline in the smooth plume but not in the complex plume, while the motion feature is
    organized antisymmetrically in the complex plume but not in the smooth plume.
  source: Results, Directional Odor Features Have Plume-Specific, Antisymmetric Organization Around
    the Centerline, paragraph 2; Figure 1E to 1H
  quote: In the smooth plume, the gradient feature had opposite signs on opposite sides of the
    centerline while in the complex plume, it did not exhibit this antisymmetric organization across
    the centerline ... In summary, the gradient and motion features exhibited complementary
    distributions, with each organized antisymmetrically around the centerline in one plume type but
    not the other
  data: with_inputs
  where: smooth plume from Dryad doi:10.5061/dryad.g27mq71 (10302017_10cms_bounded_2.h5); complex
    plume in the dandiset
  criterion: Shown on one snapshot per plume and judged by eye in the paper; no measure is given.
    The features are the crosswind centered difference dI/dy and -(dI/dy)(dI/dt) with centered
    one-frame differences (Results, paragraph 2, and the code's plume_fields.py). The code's
    snapshot frames are 601 (smooth) and 2900 (complex), cue maps centered one frame later, with
    Gaussian smoothing of sigma 1.5 pixels for the cue panels; complex frame 2900 lies outside the
    deposited window (code, REPRODUCE_FIGURES_1_3.md), so the complex snapshot cannot be the
    published one. The claim is reported as a description of frames of the analysed window, and its
    outcome is that of fig1il-zscore-reliability and figs1-antisymmetry-index, which test the same
    organization on time averages.
  depends_on:
  - fig1il-zscore-reliability
  - figs1-antisymmetry-index
- id: fig1il-zscore-reliability
  statement: Averaged over time and divided by its SD at each location, the gradient feature has
    higher z-scores in the smooth plume than in the complex plume, and the motion feature has higher
    z-scores in the complex plume than in the smooth plume.
  source: Results, Directional Odor Features Have Plume-Specific, Antisymmetric Organization Around
    the Centerline, paragraph 3; Figure 1I to 1L
  quote: However, the odor gradients have higher z-scores in the smooth plume than in the complex
    one, while the odor motion has higher z-scores in the complex plume than in the smooth one
  data: with_inputs
  where: smooth plume from Dryad doi:10.5061/dryad.g27mq71 (10302017_10cms_bounded_2.h5, /dataset2);
    complex plume in the dandiset
  criterion: Per pixel, the temporal mean of each feature divided by its temporal SD (Results,
    paragraph 3; the code's safe_standardized_mean, which divides by 1 where the SD is 0). Gradient is
    the crosswind centered difference dI/dy over all 1500 frames, motion -(dI/dy)(dI/dt) with
    centered one-frame differences over the 1498 frames with both neighbours, no spatial smoothing
    (code, metadata/figures_1_3.json). Complex frames 300 to 1799, the dandiset's window, used as
    stored (the code says they are already on a 0 to 255 scale; the z-score does not depend on the
    intensity scale). Smooth plume resampled from 15 Hz to 60 Hz and to the 0.153 mm grid (SI, Plume
    movies); the code keeps two timing profiles, notebook_legacy and corrected, and both are run.
    The SI gives the 1500-frame window for the complex plume only. For the smooth plume, readings
    (a) frames 300 to 1799 after resampling (attributed to the code), (b) the first 1500 frames. How the maps are compared is not stated (the paper shows them). Readings,
    (a) mean absolute z-score over the pixels of the Otsu plume mask of the SI (Plume movies);
    (b) mean absolute z-score over the whole analysed frame; (c) the 95th percentile of the absolute
    z-score over the mask. Reproduced when the smooth gradient value exceeds the complex one and the
    complex motion value exceeds the smooth one; the outcome is the one all readings give.
- id: figs1-antisymmetry-index
  statement: The cue antisymmetry index (log ratio of motion to gradient antisymmetric organization)
    increases monotonically with wind speed across the freestream plumes; the smooth plume lies near
    the low end of that range and the complex plume has the highest index.
  source: Figure S1, column v, legend; Results, Directional Odor Features Have Plume-Specific,
    Antisymmetric Organization Around the Centerline, paragraph 1
  quote: Across the freestream plumes the index increases monotonically with wind speed. The smooth
    plume index falls near the low end of this range and the complex plume index is the highest
    measured
  data: with_inputs
  where: smooth plume from Dryad doi:10.5061/dryad.g27mq71; freestream and complex plumes in the
    dandiset
  criterion: As the SI (Plume movies) defines it. For each plume and cue, the time-averaged map M
    (Fig. S1 columns iii and iv, the plain temporal mean of the features of
    fig1il-zscore-reliability, not divided by the SD; the panels are titled <dI/dy>_t and
    <-dI/dy dI/dt>_t with colour bars in raw units), its antisymmetric component A(x, y) = M(x, y) - M(x, -y) about the centerline, the score s as the mean of |A| over
    the Otsu mask, and the index log2(s_motion / s_gradient) (the legend's log2 scale bar). The
    Otsu mask is Otsu's method on the mean intensity map with a morphology radius of 9 pixels and a
    bias of 55 (48 for the complex plume). Open, with readings named. What the bias does is not
    stated, (a) subtracted from the Otsu threshold in 0 to 255 intensity units, (b) a percentage of
    the Otsu threshold; the morphology operation is taken as a binary opening then closing with a
    disk of radius 9 (a standard choice). Intensity rescaling to the 1st and 99th percentiles is
    stated for the freestream plumes; the index is not invariant to intensity scale, so readings
    (i) all five movies rescaled to 0 to 1 between their 1st and 99th percentiles, (ii) only the
    three freestream movies so rescaled, smooth and complex as used elsewhere. Freestream movies are
    interpolated to 60 Hz as the smooth one (SI). The centerline row of the three freestream plumes
    is not stated; read as the row of the source, the row of maximum mean intensity at the upwind
    edge. Reproduced when the index rises from 5 to 10 to 20 cm/s, the smooth index lies below the
    10 cm/s value (Fig. S1v places it between the 5 and 10 cm/s points), and the complex index is
    the highest of the five; the outcome is the one all readings give. s_gradient and s_motion are
    reported per plume for the Results sentence that gradient antisymmetry stays roughly invariant
    while motion antisymmetry grows with wind speed.
- id: figs1-temporal-statistics
  statement: The smooth plume has odor encounter frequency and intermittency like the slow
    freestream plumes; the fast freestream plume has lower intermittency and higher frequency; the
    complex plume has the highest encounter frequencies.
  source: Figure S1, column ii, legend
  quote: The distribution of frequency and intermittency values at slow freestream speeds was similar
    to the distribution of values in the smooth plume. In the fast freestream plume, intermittency
    was relatively lower and frequency relatively higher. In the complex plume we observed the
    highest arrival frequencies
  data: with_inputs
  where: smooth plume from Dryad doi:10.5061/dryad.g27mq71; freestream and complex plumes in the
    dandiset
  criterion: Per pixel, intensities binarized at 40% of that pixel's maximum; frequency is the rate
    of onsets in the binary series and intermittency the fraction of time above threshold, within
    the Otsu mask of figs1-antisymmetry-index (SI, Plume movies). The distributions are compared by
    eye in the paper, which gives no measure of similarity; here by their medians over masked
    pixels, and the 10% widening below is this file's reading of similar. Reproduced when the complex plume
    has the highest median frequency of the five, the 20 cm/s freestream plume has a higher median
    frequency and lower median intermittency than the 5 cm/s plume, and the smooth plume's medians
    lie within the span of the 5 and 10 cm/s plumes widened by 10% of each bound.
- id: figs1fg-resolution-robustness
  statement: The spatial organization of the gradient and motion cues in the complex plume stays
    consistent when sensor spacing is increased from 3 to 12 pixels or the motion delay is lengthened
    to about 150 ms, changing only when sampled more coarsely than the smooth plume.
  source: Results, Directional Odor Features Have Plume-Specific, Antisymmetric Organization Around
    the Centerline, paragraph 3; Discussion, paragraph 2; Figure S1F and S1G
  quote: Relatedly, the complex plume's cue organization was robust to reduced sampling resolution,
    only changing when sampled more coarsely than the smooth plume
  criterion: Pearson correlation between time-averaged crosswind cue maps of the complex plume
    (Fig. S1F, G legend), gradient over sensor spacings of 3 to 12 pixels, motion over the same
    spacings (3, 6, 9 and 12 pixels, the four points of Fig. S1F) and delays of 1, 2, 4, 8 and 15
    frames. The reference map is the 3-pixel map for the gradient and the 3-pixel, 1-frame map for
    motion (Fig. S1F axis "Pearson r vs baseline"; the outlined baseline cell of Fig. S1G). The
    legend and the figure label the delays 33 to 500 ms, which is 30 Hz, while the movie is 60 Hz
    (17 to 250 ms); delays are run in frames. In Fig. S1G the motion r is near 1 for 1, 2 and 4
    frames at every spacing and drops to about 0.65 at 8 and about 0.35 at 15 frames; Fig. S1F gives
    a gradient r of about 0.89 at 12 pixels. The Discussion's "about 150 ms" matches the 133 ms
    label of 4 frames, and the smooth plume's 15 Hz sampling is 4 frames at 60 Hz. No threshold for
    consistent is given; read as r >= 0.8, below every robust value the figure shows. Reproduced when
    the gradient r is at least 0.8 at every spacing, the motion r is at least 0.8 at every spacing
    for delays of 1, 2 and 4 frames, and the motion r at 8 and 15 frames is below its 4-frame value
    at every spacing; every correlation is reported.
