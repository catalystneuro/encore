- id: fig3e-mnm-motion-response
  statement: Minimal networks trained in either plume respond strongly to synthetic motion signals,
    and the smooth-trained model's motion response disappears when its filters are made exactly
    symmetric.
  source: Results, Optimized Bilateral Computation for Centerline-Finding Recovers Plume-Specific Odor
    Features, paragraph 4; Figure 3E; SI Figure S3H
  quote: Interestingly, the models trained in the complex and smooth plumes both responded strongly
    to the motion signals with various delays ... Responses to the motion signals disappear if
    exactly symmetrical filters are used
  data: with_inputs
  where: as fig3bc-mnm-filters
  depends_on:
  - fig3bc-mnm-filters
  criterion: Motion probes are random binary left signals and a right signal shifted by -6 to 6
    frames (SI, Testing trained models); response is the output probability averaged over 100,000
    samples per shift (code iter_motion_probes). Symmetrized filters are not defined; read as
    f1 and f2 replaced by their mean over the two antennae with opposite signs kept (so that the
    model is a pure difference detector), a reading, with the average of the time-reversed pair
    shown as a variant. No threshold for strongly is given. Fig. 3E shows the responses largest at
    shifts of +1 and -1 frame (about 0.545 and 0.455 smooth, 0.565 and 0.44 complex) and back near
    0.5 by +/-6 frames, so a test at every shift would fail on the paper's own curves. Reproduced
    when, for both models, the responses at shifts +1 and -1 lie on opposite sides of 0.5, and the
    smooth model with symmetrized filters stays within 0.01 of 0.5 at every shift (Fig. S3H is flat
    at 0.50); the +1 minus -1 difference is reported for each model against the figure's values.
- id: fig3ij-dnm-specialization
  statement: Dense networks are more specialized than minimal ones; the smooth-trained dense network
    is more sensitive to gradient signals and the complex-trained one responds more strongly to
    motion signals; dense networks perform modestly better than the minimal ones (test AUC 0.735
    smooth, 0.543 complex).
  source: Results, Optimized Bilateral Computation for Centerline-Finding Recovers Plume-Specific Odor
    Features, paragraphs 5 and 6; Figure 3I and 3J; SI Figure S3K
  quote: When tested on the gradient signals, the model trained in the smooth plume was more
    sensitive to gradient signals compared to the model trained in the complex plume ... the DNM
    trained in the complex plumes responded more strongly to the motion signals than the one trained
    in the smooth plumes
  data: with_inputs
  where: as fig3bc-mnm-filters
  expected:
  - quantity: DNM test AUC, smooth plume
    value: 0.735
    tolerance: 0.074
  - quantity: DNM test AUC, complex plume
    value: 0.543
    tolerance: 0.054
  criterion: Dense network of two hidden layers of 20 units on the 60 concatenated inputs, opponent
    structure (output minus output on the swapped inputs, code), trained as fig3bc-mnm-filters (SI
    values main; the code's archived dense profile, 500 epochs, batch 500, learning rate 1e-5 smooth
    and 1e-4 complex, a variant). Probes and the two readings of response strength as
    fig3d-mnm-gradient-response, and for motion (a) the mean over shifts of |response - 0.5|,
    (b) the difference between the mean responses at shifts +1 and -1. Reproduced when the smooth
    DNM's gradient sensitivity exceeds the complex DNM's, the complex DNM's motion response exceeds
    the smooth DNM's under both readings, and the AUCs are within tolerance; partially reproduced
    when the sensitivities hold and an AUC does not. Whether each DNM's AUC exceeds the MNM's of
    fig3bc-mnm-filters (modestly better) is reported.
- id: fig4ef-agent-success
  statement: Navigating agents that add a centerline-predicting dense network to a wind-only strategy
    find the source more often than wind-only agents when the network was trained in the plume they
    navigate, and less often when it was trained in the other plume; the wind-only agents perform
    similarly in the two plumes.
  source: Results, Sensitivity to Plume-Appropriate Directional Features Enhances Agent Navigation,
    paragraphs 2 to 4; Figure 4E and 4F
  quote: In the smooth-plume, agents using the augmented strategy with the smooth plume-trained dense
    network significantly outperformed agents using the wind-only strategy ... However, agents using
    the augmented strategy with plume-inappropriate computations ... performed worse than agents
    using the wind-only strategy
  statistics:
  - about: every pairwise comparison of success rate within each plume
    test: z-test of proportions
    p: 0.001
    p_relation: "<"
    n: 10,000 trajectories per condition
  data: with_inputs
  where: smooth plume from Dryad doi:10.5061/dryad.g27mq71; complex plume in the dandiset; the
    simulation code and trained networks are not in the paper's repository
  depends_on:
  - fig3ij-dnm-specialization
  expected:
  - quantity: success rate, smooth plume, wind only
    value: 0.176
    tolerance: 0.018
  - quantity: success rate, smooth plume, smooth-trained network
    value: 0.195
    tolerance: 0.020
  - quantity: success rate, smooth plume, complex-trained network
    value: 0.153
    tolerance: 0.015
  - quantity: success rate, complex plume, wind only
    value: 0.187
    tolerance: 0.019
  - quantity: success rate, complex plume, smooth-trained network
    value: 0.117
    tolerance: 0.012
  - quantity: success rate, complex plume, complex-trained network
    value: 0.22
    tolerance: 0.022
  criterion: Values read from the bar heights of Fig. 4E and 4F (no sentence states them), default
    tolerance. Agents per SI (Agent simulations). Start uniformly in a box 200 to 250 mm downwind of
    the source with random heading; 10 mm/s forward at each movie step; turns by a Poisson process at
    4/3 Hz, magnitude normal with mean 30 and SD 8 degrees; antennae 306 um apart; reflecting walls
    at x = 270, y = 160 and y = 0 mm, x = 0 terminates; success on entering a 10 mm circle at
    (0, 85) smooth or (0, 90) complex within 90 s; passing upwind of the goal fails. Wind-only
    agents average the two antennae, binarize at 5 AU, set R to 1 above threshold and let it decay
    with a 0.97 s time scale below, and turn upwind with P = 1/(1 + exp(-(-0.49 + 1.5 R sin^2
    theta))). Network agents feed 500 ms histories to the dense network and turn right when its
    P(left) < 0.4, left when > 0.6, else as wind-only. Open, with readings named. The box width,
    (a) 112 mm (Fig. 4 legend), (b) +/- 83 mm about the centerline (SI). Whether the 1500-frame
    complex movie is looped over the 90 s, (a) looped, as in the fly experiments, (b) the run ends
    with the movie. Reproduced when, in each plume, the plume-matched network beats wind only and
    wind only beats the mismatched network by two-sided z-tests at p < 0.001 under one reading;
    the rates are reported against the expected values, and the wind-only rates of the two plumes
    differing by less than 0.02 is reported for the similarity.
- id: discussion-ten-percent-gain
  statement: Adding bilateral detection to the wind-only agent improves success by about 10% of the
    baseline level.
  source: Discussion, paragraph 4
  quote: improved performance by ~10% of baseline levels
  data: with_inputs
  where: as fig4ef-agent-success
  depends_on:
  - fig4ef-agent-success
  expected:
  - quantity: relative gain in success rate of the plume-matched network agent over wind only
    value: 0.10
    tolerance: 0.05
  criterion: The gain is (matched - wind only) / wind only from fig4ef-agent-success, per plume.
    The paper gives one figure for both plumes; its own Fig. 4 bars give about 11% (smooth) and 18%
    (complex), so a per-plume test would fail the complex plume on the paper's own numbers. The
    tested value is the mean of the two plumes' gains (about 14% on the paper's bars). Tolerance 5
    percentage points, wider than the default, as the paper writes "~10%". Reproduced when the mean
    gain is within tolerance and both gains are positive; partially reproduced when both are positive
    and the mean is outside tolerance. Each plume's gain is reported.
- id: figs4-threshold-robustness
  statement: Across a range of thresholds on the strength of bilateral evidence, agents using
    plume-consistent features (networks or feature-based GLMs trained in the same plume) outperform
    agents using inconsistent ones.
  source: SI Figure S4E and S4F, legend
  quote: Although these thresholds affect absolute performance levels, across thresholds agents using
    consistent features ... outperformed agents using inconsistent features
  data: with_inputs
  where: as fig4ef-agent-success
  depends_on:
  - fig4ef-agent-success
  - fig2d-smooth-weights
  - fig2e-complex-weights
  criterion: Agents as fig4ef-agent-success, with the symmetric thresholds on P(left) varied. The
    thresholds are not listed in the text; Fig. S4E and S4F plot 11, at 0.05, 0.1 and 0.2 to 0.9 in
    steps of 0.1, on an axis "Bilateral Evidence Threshold", with the Fig. 4 models (P(left)
    outside 0.4 to 0.6) marked at 0.2. The threshold is therefore read as t on |2 P(left) - 1|, the
    baseline strategy used when |2 P(left) - 1| <= t. The feature GLM agents use the Fig. 2 combined
    models. The paper's own Fig. S4F does not bear out "across thresholds" for the GLM agents, as the
    smooth-plume consistent GLM is below the inconsistent one at 0.05, 0.1 and 0.2 and the
    complex-plume consistent GLM is at or below the inconsistent one at 0.7 to 0.9; Fig. S4E shows
    the network agents consistent above inconsistent at every threshold in both plumes. Reproduced
    when the consistent network agent beats the inconsistent one at every threshold in both plumes,
    and the consistent GLM agent beats the inconsistent one at a majority of thresholds in each plume;
    partially reproduced when the network part holds at a majority of thresholds only. The GLM
    thresholds where the order reverses are reported against those of Fig. S4F.
- id: fig5e-cue-betas
  statement: For upwind-facing flies in the bulk of the plume, the gradient cue 50 ms before a turn
    significantly predicts turn direction in the smooth plume while motion does not, and the motion
    cue does in the complex plume while the gradient does not.
  source: Results, Different Directional Odor Cues Predict Fly Crosswind Turning in Different Plume
    Types, paragraph 3; Figure 5E
  quote: In the smooth plume, the gradient cue but not the motion cue was a significant predictor ...
    conversely, in the complex plume the motion cue was a significant predictor, but the gradient
    cue was not
  statistics:
  - about: gradient coefficient, smooth plume
    test: logistic regression with cluster-robust (trajectory-level) SE
    p: 0.005
    p_relation: "<"
  - about: motion coefficient, complex plume
    test: logistic regression with cluster-robust (trajectory-level) SE
    p: 0.01
    p_relation: "<"
  expected:
  - quantity: fitted gradient coefficient, smooth plume
    value: -0.1181
    tolerance: 0.0331
  - quantity: fitted motion coefficient, smooth plume
    value: -0.0074
    tolerance: 0.0114
  - quantity: fitted motion coefficient, complex plume
    value: 0.0441
    tolerance: 0.0159
  - quantity: fitted gradient coefficient, complex plume
    value: 0.0185
    tolerance: 0.0161
  criterion: Coefficients as fitted, from the code's fig5e_cue_beta tables (the figure plots the
    gradient coefficient times -1, metadata/published_panel_params.json); tolerance 1 cluster-robust
    SE, the paper's error bars. Turns are the dataset's saccade-like turn events (SI, Behavioral
    Analysis). Kept turns (SI, Behavioral Analysis, and code filter_published_turns), heading at the
    turn 160 to 200 degrees; walking upwind, the trajectory's vx low-passed by a fourth-order
    Butterworth filter at 0.2 Hz run forward and backward (code) pointing upwind (the code tests
    vx < 0; the SI's positive horizontal velocity is the same in the upwind frame); turn position
    30 <= x <= 220 mm and 67 <= y <= 97 mm (code values of the SI's 3 cm < x < 22 cm and 3 cm band
    about the centerline). Predictors are the dataset's per-frame gradient, motion and intensity
    signals, each smoothed by a causal exponential filter with a 200 ms time constant (SI and code),
    taken at the last frame at or before 50 ms before turn onset, within one frame (code). Onset is
    the time turn speed crosses 20% of the peak height on the rising edge (SI, Behavioral Analysis);
    if the dataset's turn event start is defined otherwise, onset is computed from the rotational
    velocity by that rule. The 200 ms gray boxes of the Fig. 5D legend are read as the 200 ms time
    constant of the cue smoothing (the panel is labelled tau = 200 ms), not a window average. One logistic regression per plume of turn direction (code maps a positive
    direction to 1) on the three predictors and an intercept, cluster-robust SE grouped by
    trajectory (statsmodels Logit). Open, with readings named. Heading window in the complex
    plume, (a) 160 to 200 degrees (SI, main), (b) 150 to 210 degrees (code, which produced the
    figure). The code also drops turns within 15 mm of the arena bounds (1st and 99th percentiles of
    the plume's positions), which the SI does not list, (a) not applied (main), (b) applied (code).
    Z-scoring, which the SI states and the code does not perform, (a) the signals as stored (code),
    (b) z-scored over all frames of the plume's trajectories, (c) z-scored per trajectory; (b) only
    rescales the coefficients. Not significant is not defined, (a) p >= 0.05, (b) p >= 0.01, the
    lowest level the legend marks. Reproduced when the smooth gradient coefficient has p < 0.005,
    the complex motion coefficient p < 0.01, and the smooth motion and complex gradient
    coefficients are not significant; the outcome is the one all readings give, and the values are
    compared with the expected ones under the code's readings.
- id: fig5f-cue-dominance
  statement: Cue dominance, the gradient-minus-motion log-likelihood difference relative to the total
    bilateral contribution, is near 1 in the smooth plume (gradient dominates) and negative in the
    complex plume (motion dominates).
  source: Results, Different Directional Odor Cues Predict Fly Crosswind Turning in Different Plume
    Types, paragraph 4; Figure 5F; SI Figure S5D and S5E
  quote: This measure indicates that the gradient cue dominated in the smooth plume, while the motion
    cue dominated in the complex plume
  depends_on:
  - fig5e-cue-betas
  expected:
  - quantity: cue dominance, smooth plume
    value: 0.946
    tolerance: 0.095
  - quantity: cue dominance, complex plume
    value: -0.662
    tolerance: 0.066
  criterion: Values computed from the mean log-likelihoods of the code's fig5f_s5 tables, matching
    the bar heights of Fig. 5F (about 0.95 and -0.65); default tolerance. On the turns of
    fig5e-cue-betas, four logistic models per plume with cluster-robust SE (SI, Behavioral Analysis;
    code VARIANT_FORMULAS), full (gradient, motion, intensity), gradient (gradient, intensity),
    motion (motion, intensity) and base (intensity only); dominance is (LL_gradient - LL_motion) /
    (LL_full - LL_base), with LL the log-likelihood per turn (code). Readings as fig5e-cue-betas.
    Reproduced when the smooth value is positive and the complex value negative, with both within
    tolerance under one reading; partially reproduced when the signs hold only.
- id: methods-intensity-right-bias
  statement: Upwind-facing flies show a bias for rightward turns, toward the projector mount, that
    grows with the overall projected light intensity.
  source: SI, Supplementary Methods, Behavioral Analysis, paragraph 3
  quote: Intensity was included to account for an observed bias exhibited by upwind-facing animals
    for rightward turns, towards the projector mount location, with increased overall projected
    light intensity
  depends_on:
  - fig5e-cue-betas
  criterion: The paper gives no test or number. In the full models of fig5e-cue-betas, the
    intensity coefficient is read in the direction of right turns (the dataset's coding of turn
    direction decides which sign is right). Reproduced when it favours right turns with p < 0.05
    (cluster-robust Wald test) in at least one plume and does not significantly favour left turns in
    the other; its value and p are reported for both plumes.
- id: figs5c-turn-angles
  statement: The detected saccade-like turns reorient flies by about 30 degrees, with median angular
    displacements of -34.2 and +33.8 degrees for the two turn directions.
  source: SI Figure S5C, legend; Results, Different Directional Odor Cues Predict Fly Crosswind
    Turning in Different Plume Types, paragraph 2
  quote: Median values (dashed lines; -34.2°, +33.8°) are similar to turn displacements reported in
    flies navigating plumes of smoke
  expected:
  - quantity: median angular displacement, negative-velocity turns
    value: -34.2
    tolerance: 3.42
    unit: degrees
  - quantity: median angular displacement, positive-velocity turns
    value: 33.8
    tolerance: 3.38
    unit: degrees
  criterion: Turns are the dataset's detected turn events, split by the sign of the rotational
    velocity at the peak (Fig. S5C legend). Open, with readings named. Which turns, (a) all detected
    turns of both plumes pooled, (b) only the turns kept in fig5e-cue-betas. The displacement,
    (a) the heading change from the event's start to its end, (b) the integral of rotational
    velocity over the event. Reproduced when both medians are within tolerance under one reading.
- id: figs5fh-smoothing-agent
  statement: Agents using one fixed rule on time-smoothed gradient and motion cues produce turns for
    which a logistic regression on the local cues weights the gradient more in the smooth than in the
    complex plume and motion more in the complex than in the smooth plume, and, within each plume,
    weights the gradient above motion in the smooth plume and motion above the gradient in the
    complex plume, so time integration could account for the flies' pattern.
  source: Results, Different Directional Odor Cues Predict Fly Crosswind Turning in Different Plume
    Types, paragraph 5; SI Figure S5F to S5H, legend
  quote: We found that gradient cues were weighted more strongly in the smooth than in the complex
    plume; conversely, motion cues were weighted more strongly in the complex than in the smooth
    plume
  statistics:
  - about: within-plume difference of gradient and motion weights, each plume
    test: logistic regression weights compared
    p: 0.005
    p_relation: "<"
  data: with_inputs
  where: as fig4ef-agent-success
  criterion: Agents as fig4ef-agent-success with P(left) the logistic of 2.65 times the smoothed
    gradient plus 0.07 times the smoothed motion, each raw cue smoothed by a causal exponential filter
    with a 0.85 s half-life (SI, Agent simulations); turns of upwind-facing agents regressed on the
    local gradient and motion at decision time. Open, with readings named. How the raw cues are
    computed for agents, (a) the Fig. 2 features over the antenna histories, the main reading, as
    the SI says "as described above" and the fixed weights 2.65 and 0.07 are close to the smooth
    combined-model weights of Fig. 2D, (b) the gradient and motion of the fly analysis (slice slope
    and cross-correlation offset); the upwind window, 160 to 200 degrees as for the flies; predictors
    z-scored per plume as in the fly analysis; the test of the weight difference is not named, read
    as a Wald test of the difference of the two coefficients. Fig. S5G gives about 0.22 and 0.04
    (gradient, motion) in the smooth plume and 0.13 and 0.22 in the complex plume. Reproduced when
    the gradient weight is larger in the smooth than in the complex plume and the motion weight larger
    in the complex than in the smooth plume (Results, Fig. S5G), and the gradient weight exceeds the
    motion weight in the smooth plume and the motion weight exceeds the gradient weight in the
    complex plume, each within-plume difference with p < 0.005 (Fig. S5H), under one reading;
    partially reproduced when only one of the two comparisons holds.
