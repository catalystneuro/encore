# Claims for van der Molen, Spaeth, Chini et al. (2025), "Preconfigured neuronal firing sequences in
# human brain organoids", Nature Neuroscience, doi:10.1038/s41593-025-02111-0, on dandiset 001603.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21, protocol
# version pilot-10 as stated in docs/protocol.md.
#
# Text read. The NIH author manuscript in PubMed Central (PMC12912721.1, NIHMS2139360), as served by
# NCBI PMC on 2026-10-20: main text, Methods, figure legends and Extended Data legends (Figs. 1 to 8),
# with the publisher's Supplementary Information PDF (41593_2025_2111_MOESM1_ESM.pdf; Supplementary
# Figures 1 to 27 and Supplementary Methods). Not the typeset version of record. Figures were not
# opened; every number below is from the text.
#
# Code read. https://github.com/braingeneers/Protosequences at commit e9a79c4 (2025-05-19), the
# repository named under Code Availability. It holds MATLAB scripts for the spike matrices, bursts,
# backbone units, firing rates, burst-to-burst and pairwise correlations, burst similarity and PCA
# (Main_analyses_matlab, process_data_backbone.m above all), the Python spike shuffling
# (shuffle_spike_mats.py), the HMM analysis in Python with SSM (HMM_analysis_python, with lmem.R for
# the HMM statistics), the burst clustering in Python (burst_clustering_analysis_python), the d2
# results and plotting (Criticality_analysis; the d2 code itself is downloaded from figshare article
# 25927081, Sooter et al.), plotting notebooks, and processed per-figure tables (Processed_data). The
# R scripts for the linear mixed-effects models of Figs. 2, 3, 6 and 7 are not in it.
#
# Data the paper used (its Methods, legends and code). Spontaneous activity on CMOS high-density
# microelectrode arrays (MaxWell; 1,020 recording electrodes, 20 kHz), band-passed 300 to 6000 Hz,
# sorted with Kilosort2 and curated (ISI violation at most 0.3, mean rate at least 0.05 Hz, SNR at
# least 5). Units are spike-sorted single units; the measured variable is their spike times.
#   - HO1 to HO4. Human brain organoid slices (500 um) from Sharf et al. 2022, MaxOne; the "four
#     organoids" of Figs. 1D, 1E, 2E, 2G and 3E (code names L1, L2_7M, L3_7M, L5). Also longitudinal
#     recordings of human organoids at 6, 7 and 8 months (Supplementary Fig. 2; ages from
#     plot_develomental_analysis.m) and two recordings 4 h apart of HO2 and HO3 (Supplementary Fig. 8).
#   - HO5 to HO8. Whole human organoids (NIBSC8 iPSC line) from Alam El Din et al. 2025, MaxTwo
#     6-well arrays (code names well1, well4, well5, well6). HO1 to HO8 are the "8 organoids" of
#     Extended Data Fig. 1, Figs. 4E and 5 and Fig. 7.
#   - MO1 to MO9. Murine ESC-derived dorsal forebrain organoids (lines C57BL/6, E14TG2a, KH2), plated
#     whole at about 30 days (Fig. 7, Extended Data Fig. 8). MO10 to MO14. Murine organoids recorded
#     at baseline, after 10 uM gabazine, then after 10 uM NBQX with 20 uM R-CPP (Extended Data Fig.
#     4). Longitudinal murine organoid recordings with ages in weeks (Supplementary Fig. 2).
#   - MS. Six acute coronal slices of somatosensory cortex from P12 to P14 C57BL/6JRj pups, both
#     sexes, MaxOne (code names M1S1, M1S2, M2S1, M2S2, M3S1, M3S2, so three animals with two slices
#     each; the Fig. 6 legend says n = 6 mice, the Results n = 6 slices).
#   - Pr1 to Pr8. Dissociated two-dimensional primary cortical cultures, Pr1 to Pr4 from Yuan et al.
#     2020 (E18 Wistar rat cortex, 20 days in vitro), Pr5 to Pr8 from Bartram et al. 2024. The paper
#     calls them murine primary cultures.
# The dandiset's description says it holds all these (raw and sorted for MO and MS, sorted only for
# the sourced HO and Pr recordings).
#
# Methods common to the claims, from the Methods and process_data_backbone.m unless named otherwise.
#   - Spike matrix at 1 ms resolution (preprocess_ks.m). Recording length, open. The Methods take
#     "the first x minutes" of each recording so that it holds about 40 bursts; the code keeps 180 s
#     for HO1 to HO4, MS and Pr and 600 s for HO5 to HO8 and MO (hmmsupport.py KEEP_DURATION; the
#     shuffles use 180 s). Readings (a) the code's lengths, (b) the shortest initial segment holding 38
#     to 40 bursts. Both are run where the outcome could depend on it.
#   - Population rate. Spikes summed over units per 1 ms frame, a 20 ms moving mean, then a Gaussian
#     window of 100 ms (MATLAB smoothdata 'gaussian' with window 100). Burst peaks with findpeaks at
#     4 x RMS of that rate, minimum peak distance 700 ms (Methods; up to 2000 ms for long bursts; the
#     code uses 800 ms, a variant). Burst start and end, the nearest frames where that rate falls
#     below 10% of the peak. Burst peak time, the maximum between start and end of a finer rate (5 ms
#     moving mean, 5 ms Gaussian). Bursts within 450 ms of the start or 1000 ms of the end are dropped
#     (code). For primary cultures, 20 ms moving mean, 50 ms Gaussian, 3 x RMS and a 20% edge.
#   - Backbone units. Units with at least two spikes between burst start and end in every burst
#     (human organoids and primary cultures); in at least 80% of bursts for murine organoids. For
#     slices the Methods and Supplementary Fig. 1 say 90% and the Fig. 6B legend says 70%; both are
#     readings wherever slices enter. All other units are non-rigid.
#   - Unit firing rate. The inverse inter-spike interval held between spikes, smoothed with a 50 ms
#     Gaussian (code compute_rate_isi), for units with at least 30 spikes (Methods; the code applies
#     the 30-spike rule in the group comparisons). "Burst-only" rates use spikes inside burst windows.
#   - Randomized recordings. The Okun et al. swap, which keeps each unit's spike count and each frame's
#     population count, with 5 swaps per spike (shuffle_spike_mats.py); 100 shuffled matrices per
#     recording. The random seed is a standard choice and cannot change an outcome beyond noise.
#   - Normalization to shuffles, (A - B)/(A + B) with A the measured value and B the mean over the 100
#     shuffles.
#   - Statistics. Linear mixed-effects models (lme4 lmer, lmerTest, type III) with "organoid" (the
#     recording) or "unit ID" as random effect; right-skewed data log-transformed; post hoc with
#     emmeans. Where a claim gives no other rule, it is reproduced when the effect has the paper's
#     direction with p < 0.05 by the paper's test, and the p found is reported beside the paper's.
#     Where the random-effect structure is not given, the reading is a random intercept per recording;
#     for slices a random intercept per animal is a second reading.
#   - Where the readings of a method detail give different outcomes, the claim is
#     methods_underspecified with every result shown. Where only the meaning of a reported number is
#     in doubt, the claim holds if it matches under any reading.
schema_version: 2
dataset:
  archive: dandi
  id: "001603"
paper: doi:10.1038/s41593-025-02111-0
claims:
- id: methods-burst-count
  statement: The analysed segment of each recording holds about 40 population bursts (38 ± 4,
    mean ± SE).
  source: Methods, Comparing data from different sources
  quote: The recording durations per data source were selected so that each recording contained
    around 40 bursts (38 ± 4 bursts, mean ± SE)
  expected:
  - quantity: mean number of bursts per recording, over the 31 recordings of Fig. 7
    value: 38
    tolerance: 4
  criterion: Bursts detected as in the opening comment over HO1 to HO8, MO1 to MO9, MS and Pr1 to
    Pr8, under the code's recording lengths (reading a). Reproduced when the mean count is within
    tolerance. Reading (b) fixes the count by construction and is not a test of it.
- id: fig1c-example-burst-count
  statement: In the example human organoid of Figs. 1 and 2, 46 bursts occur in a three-minute
    interval.
  source: Figure 1C legend; Figure 2C legend
  quote: The population firing rate (gray lines) is plotted relative to the burst peak for 46 burst
    events measured across a three-minute interval for the same organoid
  expected:
  - quantity: number of bursts in 180 s of the example organoid
    value: 46
    tolerance: 4.6
  criterion: The example organoid is not named in the paper (the HMM code uses HO1 as its example).
    Bursts detected as in the opening comment on the first 180 s of each of HO1 to HO4, with a
    minimum peak distance of 700 ms (Methods) and 800 ms (code variant). Reproduced when one of the
    four recordings gives a count within tolerance; that recording is the example organoid for
    claims fig4d-burst-similarity and fig4f-pca-variance.
- id: ed1c-lognormal-rates
  statement: In each of the 8 human organoids the distribution of unit mean firing rates is well fit
    by a lognormal distribution (R² 0.97 ± 0.04, mean ± STD), while the rates of backbone units
    alone are not (R² 0.45 ± 0.30).
  source: Results, Temporal dynamics of neuronal firing sequences, paragraph 1; Extended Data Fig. 1A
    to C
  quote: we observed that the distribution of firing rates follows a heavy-tailed, right-skewed
    lognormal distribution ( n = 8, R 2 = 0.97 ± 0.04, Extended Data Fig. 1A – C ) ... Backbone
    neurons alone are not well described by a lognormal distribution. R 2 values are 0.45±0.30 across
    the 8 human brain organoids
  expected:
  - quantity: mean R² over HO1 to HO8, all units
    value: 0.97
    tolerance: 0.04
  - quantity: mean R² over HO1 to HO8, backbone units only
    value: 0.45
    tolerance: 0.30
  criterion: Mean rate per unit is its spike count over the recording length. The fit is open
    between the Methods and code and the Extended Data Fig. 1C legend. Readings (a) a lognormal
    density fitted by nonlinear least squares to the probability histogram of rates in 20 bins from
    0 to 10 Hz, ordinary R² (Methods, and plot_multi_rec_figs_backbone.m, whose density divides by
    (2 sigma)^2 where the standard form has 2 sigma^2, shown as a variant); (b) a normal density
    fitted to the probability histogram of log rates in ceil(n^0.4) bins (legend). Units either all
    sorted units (code) or those with at least 30 spikes (Methods). Reproduced when, under one
    reading, both means are within tolerance; partially reproduced when only the all-unit mean is.
- id: fig1d-burst-duration
  statement: Burst durations in the human organoids are on the order of 10² ms.
  source: Results, Temporal dynamics of neuronal firing sequences, paragraph 1; Figure 1D;
    Supplementary Fig. 1C
  quote: Bursts exhibited consistent rate profiles within organoids ( Fig. 1C ), with durations
    spanning timescales on the order of ≈ 10 2 milliseconds ( Fig. 1D , Supplementary Fig. 1 C )
  criterion: Burst duration is end minus start as in the opening comment (10% of peak on the coarse
    population rate). "On the order of 10² ms" is read as the decade from 100 to 1000 ms, a standard
    reading. Reproduced when the median burst duration of each of HO1 to HO4 (Fig. 1D) lies in that
    decade; partially reproduced when three of the four do. The medians of all 31 recordings
    (Supplementary Fig. 1C) are reported.
- id: fig1e-peaks-near-burst-peak
  statement: Most units reach their peak firing rate close to the peak of the population burst.
  source: Results, Temporal dynamics of neuronal firing sequences, paragraph 1; Figure 1E
  quote: A majority of units firing rates peaked in close proximity to the population burst maxima (
    Fig. 1E )
  criterion: Peak time per unit and burst, the time of its maximum rate between burst start and end
    relative to the burst peak, in bursts where it fires at least two spikes (Methods). HO1 to HO4.
    "Close proximity" is not fixed by the paper. Readings for the quantity, (i) each unit's median
    peak time, (ii) all unit-burst peak times pooled; for the bound, (a) within 50 ms and (b) within
    100 ms of the burst peak (the Results speak of lags near 10 ms and sequences of about 10² ms).
    Reproduced when more than half of the values fall within the bound in each organoid, under every
    reading.
- id: fig2-backbone-fraction
  statement: Backbone units, which fire at least twice in every burst, are 28% ± 14% (mean ± STD) of
    the units in the 8 human organoids.
  source: Results, Temporal dynamics of neuronal firing sequences, paragraph 3; Supplementary Fig. 1A
  quote: Backbone units, comprising 28% ± 14% (mean ± STD) of total neurons ( n = 8 organoids,
    Supplementary Fig. 1 )
  expected:
  - quantity: mean backbone fraction over HO1 to HO8
    value: 0.28
    tolerance: 0.14
  - quantity: standard deviation of the backbone fraction over HO1 to HO8
    value: 0.14
    tolerance: 0.014
  criterion: Backbone units as in the opening comment. The denominator can be read as (a) all sorted
    units in the recording or (b) units with at least 30 spikes. Reproduced when the mean and the
    standard deviation are both within tolerance under one reading; partially reproduced when only
    the mean is. The tolerance on the mean is the paper's stated spread.
- id: fig2e-b2b-correlation
  statement: Backbone units have higher burst-to-burst correlations of their firing rate than
    non-rigid units.
  source: Figure 2E legend; Results, Temporal dynamics of neuronal firing sequences, paragraph 3
  quote: Backbone neurons consistently exhibited higher burst-to-burst correlation coefficients
    compared to non-rigid units ( P < 10 −16 , two-sided linear mixed-effects model, n = 4 organoids
    and 507 single-units)
  statistics:
  - test: two-sided linear mixed-effects model
    p: 1.0e-16
    p_relation: "<"
    n: 4 organoids and 507 single units
  expected:
  - quantity: number of units in the test, HO1 to HO4
    value: 507
    tolerance: 51
  criterion: Burst-to-burst correlation per unit as in the Methods. Burst-only rates; for each pair
    of bursts, the rate from 250 ms before to 500 ms after each burst peak, MATLAB xcorr with maxlag
    10 ms and 'coeff' normalization, maximum over lags; mean over all pairs of bursts in which the
    unit has at least 2 spikes in that window. Units kept when they have at least 2 spikes in at
    least 30% of bursts (Methods; the code keeps units with at least 2 spikes in at least 70% of
    bursts, a variant) and at least 30 spikes (code). HO1 to HO4 (code, Fig 2E comment). Test,
    correlation on unit type with a random intercept per organoid. Reproduced when backbone units are
    higher with p < 0.05; the unit count is reported against 507.
- id: fig2g-variance-latency
  statement: Among backbone units, the variance of firing-rate peak times across bursts grows with
    the unit's position in the sequence, so later-firing units are more variable.
  source: Results, Temporal dynamics of neuronal firing sequences, paragraph 3; Figure 2F and 2G
  quote: Finally, the variability of firing peak times increased with their average latency ( Fig.
    2F ), a relationship consistently observed across organoids ( Fig. 2G , P < 10 −5 , linear
    mixed-effects model)
  statistics:
  - about: Results
    test: linear mixed-effects model
    p: 1.0e-5
    p_relation: "<"
  - about: Figure 2G legend, relation between relative firing rate peak and peak time variance
    test: two-sided linear mixed-effects model
    p: 1.0e-6
    n: four organoids
  criterion: Per backbone unit of HO1 to HO4, the median and the variance of its peak time over the
    bursts in which it fires at least two spikes (Methods). The "relative position of the peak (from
    0 to 1)" of the Methods is read as (a) the unit's rank by median peak time scaled to 0 to 1, or
    (b) its median peak time rescaled over the backbone period to 0 to 1. Model, variance on
    relative position with a random intercept per organoid. Reproduced when the slope is positive
    with p < 0.05 under both readings.
- id: ed3f-burst-cluster-variability
  statement: When bursts are clustered by their pairwise unit correlation matrices, the firing rates
    of non-rigid units vary more between clusters than those of backbone units.
  source: Results, Temporal dynamics of neuronal firing sequences, paragraph 2; Extended Data Fig. 3F
  quote: Clustering bursts by their pairwise correlation matrix confirmed that backbone patterns were
    preserved across clusters, whereas non-rigid units varied substantially ( P < 10 −20 , linear
    mixed-effects model; Extended Data Fig. 3 )
  statistics:
  - test: two-sided linear mixed-effect model
    p: 1.0e-20
    p_relation: "<"
  criterion: As in the Supplementary Methods, Burst clustering, and ExtractBurst_ElbowSeeds.py. Per
    burst, the burst-only rates from 250 ms before to 500 ms after the peak, the correlation matrix
    of all unit pairs (numpy corrcoef), its lower triangle as a vector; k-means++ on these vectors
    for k from 2 upward, the best of several seeds per k. The elbow is picked by eye in the paper;
    readings (a) the knee of the SSE curve by the kneedle rule, (b) the k with the largest
    silhouette coefficient (the code computes both). Per unit, the CV (STD over mean) of its mean
    rate across clusters. Recordings, HO1 to HO8; the paper shows HO5 (Or5) as its example and does
    not name the set, so HO1 to HO4 alone is a second reading. Test, CV on unit type with a random
    intercept per organoid. Reproduced when non-rigid CV is higher with p < 0.05 under every reading.
- id: ed4b-gabazine-more-bursts
  statement: In murine organoids, blocking GABA-A receptors with gabazine increases the number of
    population bursts.
  source: Results, Temporal dynamics of neuronal firing sequences, paragraph 2; Extended Data Fig. 4B
  quote: Meanwhile, the number of bursts increase after gabazine treatment ( P < 0.05, two-sided
    linear mixed-effect model)
  statistics:
  - test: two-sided linear mixed-effect model
    p: 0.05
    p_relation: "<"
    n: 5 murine organoids (MO10 to MO14)
  criterion: Bursts detected as in the opening comment in the baseline and gabazine recordings of
    MO10 to MO14. Burst count (or rate, if the recordings differ in length) on condition with a
    random intercept per organoid. Reproduced when gabazine is higher with p < 0.05.
- id: ed4b-nbqx-cpp-abolish-bursts
  statement: Blocking AMPA and NMDA receptors with NBQX and R-CPP abolishes population bursts in
    murine organoids.
  source: Results, Temporal dynamics of neuronal firing sequences, paragraph 2; Extended Data Fig. 4B
  quote: Note that bursting disappears after NBQX and R-CPP treatment reflected as a significant
    decrease in bursting compared to baseline conditions ( P < 0.001, two-sided linear mixed-effect
    model)
  statistics:
  - test: two-sided linear mixed-effect model
    p: 0.001
    p_relation: "<"
    n: 5 murine organoids (MO10 to MO14)
  criterion: As in ed4b-gabazine-more-bursts, baseline against NBQX with R-CPP. Reproduced when the
    count falls with p < 0.05 and the treated recordings hold no burst or nearly none (at most one
    per recording, given that the paper says bursting disappears).
- id: ed4c-gabazine-participation
  statement: Gabazine increases the fraction of bursts in which units fire at least two spikes.
  source: Extended Data Fig. 4C
  quote: The fraction of bursts in which units are active increases significantly after gabazine
    treatment ( P < 10 −7 , two-sided linear mixed-effect model)
  statistics:
  - test: two-sided linear mixed-effect model
    p: 1.0e-7
    p_relation: "<"
    n: 5 murine organoids (MO10 to MO14)
  criterion: Per unit and recording, the fraction of bursts with at least two spikes between burst
    start and end. Units are matched between conditions only if the dataset identifies them across
    recordings (the paper records "the same electrode configuration"); otherwise units are pooled per
    condition. Model, fraction on condition with a random intercept per organoid (and per unit when
    matched). Reproduced when gabazine is higher with p < 0.05.
- id: ed4d-gabazine-rank-order
  statement: Gabazine makes the order of backbone sequences more consistent across bursts.
  source: Extended Data Fig. 4D
  quote: There is a significant increase in backbone sequence order similarity after treatment with
    gabazine ( P < 10 −20 , two-sided linear mixed-effect model)
  statistics:
  - test: two-sided linear mixed-effect model
    p: 1.0e-20
    p_relation: "<"
    n: 5 murine organoids (MO10 to MO14)
  criterion: As in the Supplementary Methods, Firing rate peak rank order correlations. Per burst,
    the backbone units ranked by their peak rate time; Spearman correlation for every pair of bursts;
    each normalized to the mean over 100 shuffles. The legend says z-scored and the Supplementary
    Methods say (A - B)/(A + B); both are readings. Backbone units defined per recording with the
    80% murine organoid threshold. Model, normalized correlation of burst pairs on condition with a
    random intercept per organoid. Reproduced when gabazine is higher with p < 0.05 under both
    readings.
- id: supp2a-backbone-fraction-declines
  statement: The fraction of backbone units declines as human and murine organoids mature.
  source: Results, Temporal dynamics of neuronal firing sequences, paragraph 2; Supplementary Fig. 2A
  quote: Longitudinal recordings showed that the relative fraction of backbone units declined over
    development ( Supplementary Fig. 2 )
  criterion: No test is reported. Backbone fraction per organoid and age (human organoids at 6, 7
    and 8 months per plot_develomental_analysis.m; murine organoids at their recorded weeks).
    Readings for "declined", (a) the mean fraction over organoids is lower at the oldest age than at
    the youngest, (b) it is lower at the oldest age in every organoid. Reproduced when this holds
    for both human and murine organoids under both readings; partially reproduced when it holds for
    one of them.
- id: supp2c-b2b-increases-with-age
  statement: The burst-to-burst correlation of units increases over development in human and murine
    organoids, and backbone units are higher than non-rigid units at every age.
  source: Results, Temporal dynamics of neuronal firing sequences, paragraph 3; Supplementary Fig. 2C
  quote: Their firing patterns remained stable across hours ( Supplementary Fig. 8 ) and persisted
    over months, with correlations increasing during development in both human and murine organoids
    ( Supplementary Fig. 2C , P < 10 −5 , two-way ANOVA)
  statistics:
  - about: human organoids, effect of age
    test: two-way ANOVA
    p: 4.14e-6
  - about: murine organoids, effect of age
    test: two-way ANOVA
    p: 9.45e-9
  criterion: Burst-to-burst correlation per unit as in fig2e-b2b-correlation, for each organoid and
    age. Two-way ANOVA of unit correlations on age and unit type (the second factor is not named;
    unit type is the reading the panel's layout implies, organoid is a second reading). Reproduced
    when the age effect has p < 0.05 with correlations higher at older ages in both groups, and
    backbone means exceed non-rigid means at every age.
- id: supp8-backbone-stable-4h
  statement: Units classed as backbone in one recording are mostly classed as backbone again 4 h
    later, units classed as non-rigid are mostly classed as non-rigid again, and backbone units keep
    more consistent firing patterns across the two recordings than non-rigid units.
  source: Supplementary Fig. 8A and 8E
  quote: the majority of units that was detected as a backbone unit at time point 0-hour was also
    detected as backbone unit at time point 4-hour (top left) for both organoids. Meanwhile, the
    majority of units that were detected as non-rigid units at time point 0-hour were also detected
    as non-rigid units at time point 4-hour (bottom right) for both organoids
  criterion: HO2 and HO3, recordings at 0 h and 4 h. Units must be identified across the two
    recordings; the paper does not say how, so this is tested only if the dataset links them (for
    example by joint sorting). Reproduced when more than half of the 0 h backbone units are backbone
    at 4 h and more than half of the 0 h non-rigid units are non-rigid at 4 h in both organoids, and
    the mean 0-to-4 h burst-to-burst correlation (bursts paired across
    recordings, Methods) is higher for backbone than for non-rigid units in both.
- id: ed5-shuffle-reduces-b2b
  statement: Randomizing spike times while keeping unit and population rates reduces burst-to-burst
    correlations.
  source: Results, Temporal dynamics of neuronal firing sequences, paragraph 3; Extended Data Fig.
    5D; Supplementary Fig. 9A
  quote: Randomized spike trains that preserved mean and single-unit firing rates abolished sequences
    and significantly reduced burst-to-bust correlations ( Extended Data Fig. 5 , Supplementary Figs.
    9 - 10 )
  criterion: Burst-to-burst correlation per unit as in fig2e-b2b-correlation on the real and on the
    100 shuffled matrices, HO1 to HO8. No test is named. Readings (a) a linear mixed-effects model of
    correlation on data type (real or shuffled mean) with random intercepts for unit and organoid,
    (b) the normalized value (A - B)/(A + B) tested above 0 with a random intercept per organoid,
    one-sided as in Extended Data Fig. 2F. Reproduced when real exceeds shuffled with p < 0.05 for
    backbone units under both readings.
- id: fig3e-pairwise-correlation
  statement: Pairwise cross-correlations of firing rates are higher between backbone units than
    between backbone and non-rigid units or between non-rigid units.
  source: Figure 3E legend; Results, Backbone units are a highly correlated ensemble
  quote: Correlations between backbone units (blue) are significantly higher ( P < 10 −20 , 2-sided
    linear mixed effects model, n = 4 organoids and 34,056 single unit pairs) than the
    cross-correlations between pairs of backbone and non-rigid units (gray) and pairs of non-rigid
    units (yellow)
  statistics:
  - test: two-sided linear mixed effects model
    p: 1.0e-20
    p_relation: "<"
    n: 4 organoids and 34,056 single unit pairs
  expected:
  - quantity: number of unit pairs, HO1 to HO4
    value: 34056
    tolerance: 3406
  criterion: As in the Methods, Pairwise firing rate correlations. Burst-only rates over the whole
    recording, MATLAB xcorr with maxlag 350 ms and 'coeff', maximum over lags; units with at least
    30 spikes (legend, code). HO1 to HO4 (code comment for Fig. 3E). Model, correlation on pair type
    with a random intercept per organoid, emmeans contrasts. Reproduced when backbone pairs exceed
    both other pair types with p < 0.05.
- id: fig3f-backbone-pairs-in-tail
  statement: The distribution of pairwise correlations is skewed and roughly lognormal, and
    backbone-backbone pairs lie in its upper tail in every organoid.
  source: Figure 3F legend; Results, Backbone units are a highly correlated ensemble
  quote: The histogram of all pairwise cross-correlations follows a skewed, lognormal distribution (
    x -axis is log scale). The pairwise connections between pairs of backbone units populate the tail
    of this distribution for all organoids
  depends_on:
  - fig3e-pairwise-correlation
  criterion: Pairwise correlations as in fig3e-pairwise-correlation, HO1 to HO4. The paper marks the
    mean of the backbone-backbone correlations on each histogram and fixes no bound for the tail.
    Readings, that mean lies above (a) the 75th or (b) the 90th percentile of all pairs. Reproduced
    when this holds in all four organoids under both readings. The skew of all pairs and the R² of a
    normal fit to their logarithm (Supplementary Fig. 12C) are reported, not judged.
- id: fig4c-similarity-variance
  statement: The spread of burst similarity across pairs of bursts is high outside bursts, drops at
    burst onset and stays low until the bursts end.
  source: Results, Population firing rate timing across burst epochs, paragraph 1; Figure 4C
  quote: "Variance in similarity showed the opposite trend: it was high during non-bursting periods,
    rapidly declining at burst onset, and remaining low until bursts ended ( Fig. 4C )"
  depends_on:
  - fig1c-example-burst-count
  criterion: Burst similarity over all units as in fig4d-burst-similarity, for every pair of bursts at
    each frame from the earliest burst start to the latest burst end relative to the peak (Methods,
    Burst similarity score); at each frame, the standard deviation over burst pairs (Fig. 4C legend).
    Example organoid from fig1c-example-burst-count. No test is reported, and the paper does not say
    which frames count as inside a burst; readings, inside is (a) from the median burst start to the
    median burst end relative to the peak, (b) the backbone window. Reproduced when the mean standard
    deviation over frames inside is lower than over the frames outside, under both readings. HO1 to
    HO8 are reported.
- id: fig4d-burst-similarity
  statement: Across pairs of bursts, the population firing vectors of backbone units are more similar
    (cosine similarity) throughout the backbone window than those of non-rigid units or of shuffled
    data.
  source: Figure 4D legend; Results, Population firing rate timing across burst epochs, paragraph 1
  quote: Backbone units consistently display significantly higher similarity throughout the backbone
    window compared with non-rigid or shuffled controls ( P < 10 −20 , paired two-sided t-test)
  statistics:
  - test: paired two-sided t-test
    p: 1.0e-20
    p_relation: "<"
  depends_on:
  - fig1c-example-burst-count
  criterion: As in the Methods, Burst similarity score, and comp_burst_sim in the code. At each 1 ms
    frame relative to the burst peak, the cosine similarity of the unit rate vectors of every pair of
    bursts. The code z-scores each unit's rate over the recording first (the Methods are silent, the
    code is followed) and uses full rates for real data and burst-only rates for the shuffles.
    Backbone window, from the earliest to the latest median peak time of backbone units. At each
    frame of the window, a paired two-sided t-test over burst pairs (lower triangle) of backbone
    against non-rigid and backbone against shuffled, at Bonferroni alpha 0.05 over frames (code).
    Example organoid from fig1c-example-burst-count. Reproduced when backbone is higher and
    significant at every frame of the window for both comparisons; partially reproduced when that
    holds for at least 90% of frames. HO1 to HO8 are reported.
- id: fig4e-similarity-rises-at-backbone-onset
  statement: In every human organoid the burst similarity rises from the onset of the backbone period
    and stays high during it.
  source: Results, Population firing rate timing across burst epochs, paragraph 1; Figure 4E;
    Supplementary Fig. 13D
  quote: Across organoids, burst similarity increased at backbone onset and plateaued during their
    activation ( Fig. 4E , Supplementary Fig. 13D , n = 8 organoids)
  criterion: Burst similarity over all units as in fig4d-burst-similarity, for HO1 to HO8, within each
    backbone period. No test is reported. Reproduced when, in all 8 organoids, the mean similarity
    over the backbone period exceeds its value at the first frame of the period; partially
    reproduced when that holds in 6 or 7.
- id: supp13-top-correlated-units-similarity
  statement: The 20% of units with the highest average pairwise correlation give a higher burst
    similarity than all units together, and the 20% with the lowest give a lower one.
  source: Results, Population firing rate timing across burst epochs, paragraph 1; Supplementary Fig.
    13A to C
  quote: Notably, the top 20th percentile of highly correlated units (from Fig. 3C ) generated
    significantly higher burst similarity than the full population, with the effect diminishing as
    larger percentiles were included ( Supplementary Fig. 13A , C ). Conversely, the lowest 20th
    percentile reduced similarity
  depends_on:
  - fig1c-example-burst-count
  - fig3e-pairwise-correlation
  criterion: Units ranked by their mean pairwise correlation (Fig. 3C matrix); burst similarity of the
    top 20% and of the bottom 20% against all units at every frame of the backbone window by a
    paired two-sided t-test over burst pairs (Methods), in the example organoid. Reproduced when the
    top 20% are higher and the bottom 20% lower, each significant at p < 0.05 Bonferroni-corrected
    over frames, at a majority of frames of the backbone window. The difference in summed
    similarity for top against bottom percentiles from 20 to 95 is reported.
- id: fig4f-pca-variance
  statement: In the example organoid, the first two principal components of backbone unit rates
    explain 73% of their variance against 25% for non-rigid units, and across organoids backbone
    units need fewer components than all units while non-rigid units need more.
  source: Results, Population firing rate timing across burst epochs, paragraph 2; Figure 4F and 4G;
    Supplementary Fig. 14
  quote: When populations were divided, backbone units captured far more variance (73%) in the first
    two PCs compared to non-rigid units (25%) ( Fig. 4F middle/right, Fig. 4G , Supplementary Figs.
    14 - 15 )
  expected:
  - quantity: variance explained by the first two PCs, backbone units, example organoid
    value: 73
    tolerance: 7.3
    unit: percent
  - quantity: variance explained by the first two PCs, non-rigid units, example organoid
    value: 25
    tolerance: 2.5
    unit: percent
  depends_on:
  - fig1c-example-burst-count
  criterion: PCA as in compute_manifolds of the code, on burst-only rates, each unit mean-centred and
    scaled to unit standard deviation (the Methods' z-score), by SVD, for all, backbone and non-rigid
    units. The example organoid is the one of fig1c-example-burst-count; if none matches there, any of
    HO1 to HO8 that matches counts, as the number's subject is not named. Reproduced when both
    percentages are within tolerance and, in every organoid of HO1 to HO8, the cumulative variance of
    the first two PCs is higher for backbone than for all units and lower for non-rigid than for all
    units; partially reproduced when only the across-organoid pattern holds.
- id: supp18-hmm-likelihood-real-above-shuffled
  statement: Hidden Markov models fitted to the organoid spike trains give a higher held-out log
    likelihood on real data than on randomized data with the same unit and population rates.
  source: Results, Revealing temporal structure with a hidden Markov model, paragraph 1;
    Supplementary Fig. 18
  quote: Log likelihood is always greater for real than for randomized data, with no overlap between
    the distributions for real and shuffled data
  criterion: Poisson-observation HMMs (SSM), 30 ms bins, K from 10 to 30, fitted by EM (code
    tolerance 1e-3, at most 5000 iterations), for HO1 to HO8 (Supplementary Methods). Validation by
    5-fold cross-validation. The Supplementary Methods fit each fold on a random 80% of the data and
    score the other 20%; the code (cv_scores) holds out a random 10% of the time bin by unit entries
    instead, shown as a variant. Score, held-out log likelihood per entry on real data against the
    randomized (Okun) surrogate in the held-out region. Reproduced when real exceeds surrogate in
    every fold, K and organoid.
- id: fig5c-states-converge-at-peak
  statement: The diversity of HMM states is high before and after bursts and reaches a minimum near
    the burst peak, where states follow a stereotyped path.
  source: Results, Revealing temporal structure with a hidden Markov model, paragraph 2; Figure 5C;
    Supplementary Fig. 19B
  quote: Notably, entropy consistently approaches a local minimum near burst peaks, indicating a
    convergence toward specific states with higher transition probabilities during the initiation of
    sequential activation patterns
  criterion: HMMs as in supp18-hmm-likelihood-real-above-shuffled fitted to the full data; most likely
    state per bin (the code uses SSM most_likely_states); per bin from 500 ms before to 500 ms after
    each burst peak, the Shannon entropy of the state distribution across bursts (Supplementary Fig.
    19B), per model, then averaged over K. "Near burst peaks" is not fixed; readings, the minimum lies
    (a) within 90 ms (three bins) of the peak, (b) within the backbone window. Reproduced when, in at
    least 6 of the 8 organoids, the minimum is near the peak and lower than the entropy at both ends
    of the window, under both readings.
- id: fig5d-backbone-more-states
  statement: Backbone units are active across a larger pool of HMM states than non-rigid units.
  source: Results, Revealing temporal structure with a hidden Markov model, paragraph 3; Figure 5D;
    Supplementary Fig. 21
  quote: Backbone ensembles spanned a larger pool of HMM states than non-rigid units ( Fig. 5D ,
    Supplementary Fig. 21 )
  depends_on:
  - fig5c-states-converge-at-peak
  criterion: Consistency of a unit in a state, the fraction of the state's realizations (bins where
    it is most probable) in which the unit fires at least once (Supplementary Methods). The size of
    the "pool" is not defined; readings (a) the number of states with consistency above 0.5, (b) the
    mean consistency over states. HO1 to HO8, K from 10 to 30. No test is reported; a linear
    mixed-effects model on unit type with random intercepts for organoid and K. Reproduced when
    backbone is higher with p < 0.05 under both readings.
- id: fig5f-svm-states-beat-rate
  statement: A linear classifier on HMM state consistency separates backbone from non-rigid units
    with 83.9% ± 12.0% accuracy, above the 63.2% ± 10.4% reached with firing rate alone.
  source: Results, Revealing temporal structure with a hidden Markov model, paragraph 3; Figure 5F
  quote: Linear support vector machine classifiers trained on hidden state features distinguished
    backbone from non-rigid units with 83.9% ± 12.0% accuracy, significantly exceeding the 63.2% ±
    10.4% achieved when using firing rate alone ( Fig. 5F )
  statistics:
  - test: two-sided Student's t-test
    p: 0.00021
    n: 8 organoids
  expected:
  - quantity: accuracy on state features, mean over all models of HO1 to HO8
    value: 83.9
    tolerance: 12.0
    unit: percent
  - quantity: accuracy on firing rate, mean over HO1 to HO8
    value: 63.2
    tolerance: 10.4
    unit: percent
  depends_on:
  - fig5d-backbone-more-states
  criterion: Features per unit, its K consistencies; classifier, standardization then a linear SVM
    (the code uses sklearn SGDClassifier with its default hinge loss), leave-one-out accuracy over
    units; baseline, the same classifier on the unit's mean rate (Fig5.py). K from 10 to 30, so 21
    models per organoid; means and SDs pooled over models (states) and over organoids (rate), as
    Fig5.py prints them. The tolerances are the paper's stated spreads. The test is open; readings
    (a) a paired two-sided t-test over the 8 organoids of mean state accuracy against rate accuracy
    (legend, n = 8), (b) per organoid a one-sample t-test of the 21 state accuracies against the rate
    accuracy (Fig5.py), required in all 8 ("in all cases"). Classifier seeds are a standard choice.
    Reproduced when both means are within tolerance and states beat rate with p < 0.05 under both
    readings.
