- id: fig3c-triplets-by-contingency
  statement: Under 100% reward rats mostly alternate between two arms, while under 50% they
    explore all three arms through the optimal 1-2-3 or 1-3-2 triplets, especially WT rats.
  source: Figure 3B and 3C; Results, Development of structured spatial and temporal coordination
    strategies supports cooperative behavior
  quote: Parsing each session's transitions into nonoverlapping triplets revealed that rats in the
    100% condition predominantly alternated between two adjacent arms, while those in the 50%
    condition engaged in comprehensive exploration of all three arms through either the 1-2-3 or
    1-3-2 sequences, especially for WT pairs
  criterion: The paper shows example rats and gives no test. Per rat and session, the choice
    sequence (opening comment) cut into consecutive nonoverlapping triplets from its first visit
    (Methods, Choice triplet counts); the fraction of optimal triplets. The Methods list eight
    possible triplets, though twelve without a repeated well exist (2-1-3, 2-3-1, 3-1-2 and
    3-2-1 are missing), and name 1-2-3 and 1-3-2 as optimal because they visit all three
    wells. Readings are (o1) every triplet that visits all three wells is optimal, as the
    rationale says; (o2) only the literal 1-2-3 and 1-3-2. Per rat, over all its triplets of
    the first 21 (100%) or first 35 (50%) sessions, the fraction of alternation triplets (x-y-x,
    the same under both readings) and the fraction of optimal triplets. The paper gives no
    number for "predominantly"; it is read as more than half. Reproduced when, under every
    reading, the median WT and median Fmr1 alternation fractions at 100% exceed 0.5, the median
    WT optimal fraction at 50% exceeds the WT median at 100%, and the WT median optimal fraction
    at 50% exceeds the Fmr1 median at 50%; blocked as methods_underspecified when the readings
    disagree. The fractions per rat are reported.
