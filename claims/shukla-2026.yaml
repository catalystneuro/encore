# Claims for Shukla, Rivera, Bladon & Jadhav (2026), "A Novel Cooperative Behavior Assay in Rats
# Reveals Distinct Social Coordination Strategies of Increasing Complexity and Social Reciprocity
# Deficits in a Model of Fragile X Syndrome", J Neurosci 46(24) e0143262026, on dandiset 001845.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record (open access, CC BY 4.0), PMC13277500, as served by Europe PMC
# (paper/10.1523-jneurosci.0143-26.2026.txt). It holds the main text, the Materials and Methods
# and the legends of Figures 1 to 8. No PDF was supplied and no figure was seen; numbers shown
# only in figure panels are not available here. The supplement is not in the text: Figures S1 to
# S3 (mixed pairs, Jaccard similarity, leadership history) and Tables S1 and S2 (the gaze GLMMs)
# were not read. The main findings rest on Figures 1 to 8, whose legends and statistics are in
# the text. Claims on Figures S1 to S3 are written from the Results sentence that states them,
# and their tests are not known.
#
# Code read: the paper links https://github.com/JadhavLab/Social_CoOp_Behavior. At commit
# e2d560d1eadd92c2f54b98e98545ba521ac2cd3d (2026-05-19, the latest) it holds only a README, which
# names the paper and the dandiset (version 0.260519.1308). No analysis code is there, so no
# detail below is settled by code; every method is from the Methods and the legends, and the
# details they leave open are named in each criterion.
#
# Dataset, from its archive description: "Cooperative Behavior in WT and Fmr1 Rat Dyads",
# behavioral event timestamps, reward well visit intervals and position tracking for both
# animals of each dyad across sessions, N = 5 pairs per genotype group. Whether it holds the
# sensory-deprived sessions, the mixed pairs, the visual-cue task, the virtual-agent task or
# the DeepLabCut keypoints is the author's to find.
#
# Data the paper used, as it reports them.
# - Subjects. Male LE-Fmr1 em2Mcwi rats (Fmr1 -/y) and WT littermates, 23 WT and 24 Fmr1 in
#   total, 3 to 5 months old at the start of training, single housed, food restricted to about
#   85 to 90% of free-feeding weight. Pairs of littermates, WT-WT, Fmr1-Fmr1 and WT-Fmr1 (mixed),
#   5 pairs each (so 10 WT rats in WT pairs and 10 Fmr1 rats in Fmr1 pairs).
# - Apparatus. Two elevated W-mazes (80 x 80 cm, three arms, a reward well with an IR beam-break
#   at each arm end, milk reward), in parallel, facing each other, separated by a transparent
#   perforated acrylic divider. Overhead colour CCD camera at 30 fps. SpikeGadgets control.
# - Cooperative task. A match is a simultaneous nose-poke by both rats at spatially
#   corresponding wells of the two mazes; matches are rewarded every time (100% contingency),
#   then with probability 0.5 (50% contingency); in the 50% condition, after a rewarded match
#   only one of the two other arms is chosen at random as the next reward arm. Sessions of 20 to
#   30 min, at least two per day, rats switching mazes after each session. Unless noted,
#   analyses use the first 21 sessions at 100% and the first 35 at 50%.
# - Sensory-deprived (SD) sessions. Opaque barrier and about 65 dB white noise, interspersed
#   among 50% sessions; 3 WT, 3 Fmr1 and 5 mixed pairs (Figure 2).
# - Visual-cue association task. Single rats, one W-maze, an LED on the far side of the partition
#   cues the rewarded well, 100% then 50% reward, 1 to 2 sessions a day, 30 sessions; 4 WT and 4
#   Fmr1 rats (Figure 2).
# - Virtual-agent task. Single rats; a program picks one rewarding arm at random on each trial,
#   never the arm just rewarded; 4 WT and 5 Fmr1 rats, 8 sessions (Figure 3).
# - Measured variables. Nose-poke (well visit) times and wells per rat; head position per frame;
#   DeepLabCut 2.3.9 keypoints (neck, head centre, body centre) for the gaze analysis, keypoints
#   with likelihood < 0.6 set to NaN, interpolated and smoothed with a Gaussian kernel of sigma
#   150 ms.
#
# Methods that hold for several claims, with their sources and the readings left open.
# - Choice sequence. The sequence of reward wells a rat visits, one entry per visit. The eight
#   triplets the Methods list (1-2-1, 1-2-3, ..., 3-2-3) contain no repeated well, so repeated
#   pokes at the same well are one visit and a transition is a visit to a well other than the
#   last one.
# - Performance (Methods, Eq. 1). The ratio of matches to the pair's total arm transitions (both
#   rats), as a percentage scaled so that the maximum, one match per two transitions, is 100%,
#   that is 200 x matches / transitions. The equation is garbled in the text ("[ ( Total matches
#   / Total transitions ) x 100 ] 1 / 2"); the scale factor does not change any test below.
# - Rates (Figure 1E, 1F, 1G). "Match rate" and "transition rate" are not defined. Readings
#   (r1) per minute of session, (r2) count per session.
# - ANOVA readings. The legends name "Two-way RM ANOVA" with genotype and session, but every
#   reported denominator df is that of an ordinary two-way ANOVA with session as a factor and
#   one value per unit and session: F(1,168) and F(1,280) for 5 + 5 pairs over 21 and 35
#   sessions, F(1,378) and F(1,630) for 10 + 10 rats, F(1,264) and F(1,594) for 33 sessions at
#   50%. Readings (A) the ordinary two-way ANOVA genotype x session on unit-by-session values,
#   as the df show; (B) a mixed-design repeated-measures ANOVA, genotype between, session within,
#   unit as subject, as the name says. Both are run; where they disagree the claim is blocked as
#   methods_underspecified.
# - Sessions at 50%. Where the df show 33 sessions (Figures 3E, 4C, 5E) the readings are the
#   first 33 and the first 35 sessions.
