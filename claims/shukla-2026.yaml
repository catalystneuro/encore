- id: fig1h-above-chance-late
  statement: Both WT and Fmr1 pairs coordinate no better than chance early in training, and above
    chance late in training, by a permutation test that circularly shifts one rat's sequence of
    well visits.
  source: Figure 1H and legend; Results, A spatial cooperation task for social coordination in
    rat pairs
  quote: Both WT and Fmr1 rat pairs exhibited performance indistinguishable from chance during
    early training on both reward contingency tasks; however, by late training, their performance
    improved significantly, exceeding chance levels ( Fig. 1 H , I )
  statistics:
  - about: representative WT pair, late 50% session against null
    test: circular time-shift permutation test, 1,000 permutations
    p: 0.01
    p_relation: "<"
  - about: representative Fmr1 pair, late 50% session against null
    test: circular time-shift permutation test, 1,000 permutations
    p: 0.05
    p_relation: "<"
  criterion: Per pair and session, performance (Eq. 1) against a null from 1,000 circular time
    shifts of one rat's whole sequence of reward well visits within the session, p being the
    fraction of shifts whose performance equals or exceeds the observed one (Methods,
    Permutation testing of coordination performance). Open, not fixed by the paper are which
    rat is shifted (the readings, the first rat as the dataset orders them, and the second; the
    result is reported for both) and the range of shifts (a uniform random shift over the
    session length is the standard choice). The paper shows one pair per genotype. "Early" and
    "late" can be read as (a) the first session at 100% and the last analysed session at 50%, as
    the legend's examples; (b) the first and last analysed session of each contingency, as the
    Results say. The Results state it for "Both WT and Fmr1 rat pairs", that is every pair.
    The early and late readings name which sessions the paper means, and one of them suffices;
    the shifted-rat readings are a method detail, and the outcome must hold under both of them,
    else the claim is blocked as methods_underspecified. Reproduced when every pair of both genotypes has p >= 0.05 in the early
    session(s) and p < 0.05 in the late session(s); partially reproduced when that holds in at
    least 3 of 5 pairs per genotype, or when the late sessions are above chance in every pair but
    the early ones are too.
