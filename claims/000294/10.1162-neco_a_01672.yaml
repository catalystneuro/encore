claims:
- id: recordings-two-cells-runs
  statement: The experimental data are simultaneous patch-clamp and HD-MEA recordings of two cultured
    neurons, each stimulated with the eCode protocols repeated in four to six runs of about 200 s.
  source: Results 3.3, paragraph 1; Methods 5.2, last paragraph, and 5.6.5
  quote: We acquired paired patch-clamp and extracellular signals from two cells of cortical cultures
    in embryonic rats ... The eCode protocols were repeated during four to six runs (each run lasted
    approximately 200 s)
  expected:
  - quantity: recorded neurons
    value: 2
    tolerance: 0
  - quantity: duration of one run
    value: 200
    tolerance: 20
    unit: s
  criterion: Count the neurons (NWB files) and, per neuron, the runs (the run label in the series
    names). Reproduced when there are two neurons, each with between 4 and 6 runs (widened by 10% of
    each bound, 3.6 to 6.6, so 4 to 6 runs), and the median run duration (first to last timestamp
    of a run's patch series) is within tolerance. The runs the paper's fits used are runs 1 to 5
    of cell 1 and 3 to 6 of cell 2 (code, 0-export-to-nwb.ipynb); a dataset holding other runs is
    reported, not judged.
- id: ecode-protocol-structure
  statement: Each run applies the eCode protocols with the sweep numbers, step durations and
    amplitudes (in percent of the estimated rheobase) that the Methods list.
  source: Methods 5.2
  quote: 'IDthresh: The purpose of this protocol was to finely screen the current levels to correctly
    reestimate Irheo before processing. It consisted of 21 sweeps with a 270 ms square pulse of
    increasing amplitudes from 50% to 130% with step increments of 4%'
  criterion: Per run, from the stimulus current series, count the sweeps of each protocol and
    measure step durations and amplitudes (current minus the pre-step holding level). The Methods
    give IDthres 21 sweeps of 270 ms, 50 to 130% by 4%; firepattern 2 sweeps of 3.6 s at 120 and
    200%; IV 3 s steps; IDrest 11 sweeps of 1.35 s, 50 to 300% by 25%; APWaveform 50 ms pulses, 200
    to 350% by 30%; HyperDepol 4 sweeps of 450 ms at -40 to -160% then 270 ms at 100%; sAHP 4
    sweeps of 250 ms at 40%, 225 ms at 150 to 300% by 50%, 450 ms at 40%; PosCheops three ramps to
    300% with up and down phases of 4, 2 and 1.33 s. The code's timings (ecodes_cell_timings in the
    feature notebooks) agree on every duration. For IV the Methods say 11 steps "from -140 to 20%"
    by 20%, which is 9 steps; the code's feature files list IV -140 to 60% (11 steps). Readings
    for IV (a) 11 steps, -140 to 60%; (b) 9 steps, -140 to 20%. The 100% scale is the IDthres scale
    (sweep k at 50 + 4k %), the rough rheobase from which the protocols were generated (Methods
    5.6.5). Reproduced when, in every run of both cells, all eight protocols are present with these
    sweep counts and durations (within 10%) and every step amplitude is within 10% of its stated
    percentage of that scale (IV under either reading). Partially reproduced when counts and
    durations hold and amplitudes do not.
- id: holding-potential
  statement: The holding current was set so that the read-out membrane potential was about -70 mV,
    which is about -84 mV after liquid junction potential correction.
  source: Methods 5.6.5, paragraph 1; Methods 5.2
  quote: the holding current was manually adjusted to obtain a resting membrane potential of around
    -70 mV (note that with LJP correction, this corresponds to -84 mV)
  expected:
  - quantity: read-out membrane potential at holding
    value: -70
    tolerance: 7
    unit: mV
  criterion: Median membrane potential before the stimulus onset of each sweep (the code's ton, e.g.
    400 ms for IDrest), median over sweeps per cell. The paper does not say whether the stored
    voltages are corrected for the junction potential. Readings (a) uncorrected, compared with -70
    mV; (b) corrected, compared with -84 mV (tolerance 8.4 mV). Reproduced for a cell when its value
    matches under either reading; reproduced when it holds for both cells.
- id: extracellular-spikes-above-50uv
  statement: Only cells whose extracellular spikes were at least 50 uV were kept, so both recorded
    cells show extracellular spikes of 50 uV or more.
  source: Methods 5.6.5, paragraph 1
  quote: We discarded cells with extracellular spikes lower than 50 μV
  expected:
  - quantity: minimum extracellular spike amplitude of a kept cell
    value: 50
    unit: uV
  criterion: Template of each cell by the template method. The paper does not say how the spike
    amplitude was measured. Readings (a) the absolute negative peak on the largest channel; (b) the
    peak-to-peak amplitude on the largest channel. Reproduced when, for both cells, the amplitude
    is at least 50 uV under either reading.
- id: mea-electrodes-and-rates
  statement: The HD-MEA recorded more than 500 electrodes near the pipette simultaneously, out of at
    most 1024, at 20 kHz, and the patch signal was digitized at 20 kHz.
  source: Results 3.1, paragraph 2; Methods 5.6.2 and 5.6.5
  quote: The patch-clamp and the HD-MEA systems were synchronized so that we could simultaneously
    acquire the patch-clamp readout and the extracellular signals from more 500 electrodes in
    proximity of the patch pipette
  expected:
  - quantity: MEA sampling rate
    value: 20000
    tolerance: 0
    unit: Hz
  - quantity: patch sampling rate
    value: 20000
    tolerance: 0
    unit: Hz
  criterion: From the NWB electrodes table and series rates. Methods 5.2 says APWaveform was meant
    to be recorded "at high sampling rates (typically 200 kHz)", so the APWaveform patch series may
    be at 20 or 200 kHz. Reproduced when, for each cell, the number of recorded electrodes is above
    500 and at most 1024, the MEA rate is 20 kHz, and the patch rate is 20 kHz for every protocol
