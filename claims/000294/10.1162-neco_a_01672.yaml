# Claims for Buccino, Damart, Bartram, ... Hierlemann & Van Geit (2024) on dandiset 000294.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record (Neural Computation 36, 1286-1331, 2024, CC BY 4.0), from the
# PDF supplied to paper/ and its text extraction: main text, Methods (section 5), Tables 1 to 5
# and the appendix (Figures 9 and 10). The paper has no separate supplement.
#
# Code read: github.com/alejoe91/multimodalfitting at commit 24e8e6168b2d5be45c551bcc08b62fde187d01c7
# (2025-04-12), the repository the Data and Code Availability section names. It holds the package
# (ecode protocols, feature extraction, the patch and HD-MEA sync and patch-triggered average in
# mea_patch/mea_patch.py, model and evaluator construction), the optimization script
# (scripts/run_optimizations.py, 20 offspring and 600 generations by default), the notebooks that
# make the figures (notebooks/ground-truth and notebooks/experimental/cell1, cell2, notebook
# outputs stripped), and cell_models/ with the ground-truth model (hay_ais) and the two
# experimental models: morphology_corrected.swc, mechanisms, parameters, and fitting/efeatures with
# the extracted feature and protocol files, the thresholded probe and the template_BPO.npy
# template of each cell. No optimization results (checkpoints, runs.pkl) are in the repository.
# The BluePyOpt extensions are in BluePyOpt pull request 385, release 1.13.88 (not read).
# In the code, cell 1 is "cell1_211006_3148" and cell 2 is "cell1_211011_3436" (the cell1 and
# cell2 notebook folders; the cell2 feature notebook still shows the cell 1 name in its first
# cell, the other cell2 notebooks use 211011_3436).
#
# Data the paper describes. Two neurons of rat cortical cultures (Wistar, embryonic day 18,
# dissociated, plated on the HD-MEA), recorded at DIV 18 to 24 (Methods 5.6.3; the Results say
# DIV 18 to 21 in one place and 18 to 24 in another). Simultaneous whole-cell current-clamp patch
# recording (MultiClamp 700B, low-pass 10 kHz, digitized 20 kHz, WinWCP) and HD-MEA recording
# (26,400 electrodes, 17.5 um pitch, up to 1024 recorded at once at 20 kHz, more than 500 near the
# pipette), synchronized by TTL pulses sent at the start of each sweep. Holding current set for a
# read-out membrane potential of about -70 mV (about -84 mV after the 14 mV liquid junction
# potential correction). The eCode protocols (IDthres, firepattern, IV, IDrest, APWaveform,
# HyperDepol, sAHP, PosCheops), with amplitudes in percent of a roughly estimated rheobase, were
# run four to six times per cell (runs of about 200 s). The dandiset's description (two NWB files,
# one per neuron, several runs of 8 eCode protocols, with intracellular voltage, stimulus current
# and extracellular voltage) matches this. The code (0-export-to-nwb.ipynb) exported runs 1 to 5
# of cell 1 and runs 3 to 6 of cell 2 (renamed run1 to run4), with response and stimulus series
# named response_<protocol>_<run>_<sweep> and stimulus_<protocol>_<run>_<sweep>, and a confocal
# maximum z-projection in a processing module. Measured variables are the somatic membrane
# potential (V), the injected current (A) and the extracellular voltages per electrode.
#
# Outside data. The ground-truth results (section 3.2, Figures 3 to 5, Table 1) are simulations
# of a model held in the code repository (cell_models/hay_ais), not recordings; those claims are
# data elsewhere. The experimental model fits (Figures 7, 8, 10) use the dataset's recordings
# with the reconstructed morphologies (repository cell_models/<cell>/morphology_corrected.swc,
# also NeuroMorpho.org Buccino_Hierlemann_Cell1 and Buccino_Hierlemann_Cell2) and the model
# definitions of the repository; those claims are with_inputs. The repository's
# fitting/efeatures files (features.json, template_BPO.npy) are derived from the recordings and
# can serve to link the dataset to the files the fits used.
#
# Shared method, cited below as "the template method" (Methods 5.7.1 and 3.1, with the code where
# they are silent). Per run, sync patch and MEA by the TTL pulses; drop saturated channels; filter
# the MEA signals with a third-order Butterworth band-pass, 300 to 6000 Hz; detect intracellular
# action potentials with the eFEL peak_time feature (threshold -20 mV, mea_patch.get_peak_times),
# leaving out PosCheops; cut 2 ms before and 5 ms after each peak; center each waveform on its
# extracellular negative peak on the largest channel (searched within +/- 2 ms of the patch peak,
# process_mea_patch default center_ms); discard waveforms whose largest-channel amplitude is more
# than 2 SD from the median; template is the sample-wise median of the rest; the run whose
# template keeps the most channels after denoising is used; channels with peak-to-peak below 5 uV
# are excluded. The Methods say median; the code (process_mea_patch, clean_sta) takes the mean of
# the kept waveforms, a variant.
#
# Shared method, cited below as "the fitting method" (sections 3.1, 3.2, 5.4, 5.5 and the code).
# Training protocols IDrest 150, 250, 300%, APWaveform 290%, IV -100 and -20%; e-features as listed
# in Methods 5.4 (BluePyEfe, eFEL); extracellular features (11, Methods 5.1.2) from IDrest 300%
# for simulations; strategies soma, all (cosine distance per feature over all channels, weighted
# 2.5), sections, single (7 channels, SD 5% of the mean); hybrid CMA (population 20, hypervolume
# weight 0.4), 10 seeds, 600 generations. Per seed the solution is the member of the final
# population with the lowest summed fitness (3-compute-all-responses notebooks). A seed's
# intracellular score is the sum of its intracellular feature scores, and its extracellular score
# the sum of the all-strategy extracellular feature scores, both from the all-strategy evaluator
# on the training protocols (3-compute-all-responses notebooks). The experimental models are the
# ones without an explicit axon-bearing dendrite (abd False in the code), as the paper treats the
# ABD as a normal dendrite.
