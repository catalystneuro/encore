- id: figs5c-latency-order
  statement: Spatial attention is encoded significantly earlier than stimulus identity, attended
    value and accept/reject, and left/right value (in ACC and DLPFC) significantly later than the
    other variables.
  source: Supplementary Figure 5C legend; Results, Triply dissociable PFC population codes at first
    saccade, paragraph 6
  quote: The distributions of t75 for spatial attention do not overlap with those of attended value,
    accept/reject, or stimulus identity, demonstrating that spatial attention is encoded
    significantly earlier than other variables. Similarly, left/right value (in ACC and DLPFC) is
    encoded significantly later than other variables.
  depends_on:
  - fig4-t75-latencies
  criterion: As the Methods give it, 100 noise simulations per region, each adding permuted
    residuals of the original template regression to the fitted values at each time point and
    recomputing t75. Which residuals are permuted (within each time point's fit, independently
    across time, or the same permutation at all time points) is not stated; readings (a) an
    independent permutation per time point; (b) one permutation shared over time points. In each
    region, the range of the spatial attention t75 is compared with those of stimulus identity,
    attended value and accept/reject among the variables S5B keeps for that region (those with CPD
    of note; a variable whose template is not significant at 100-500 ms is left out). Reproduced
    when the spatial attention range lies below all of them and, in ACC and DLPFC, the left/right
    value range lies above all others, under one reading.
- id: fig5a-ofc-value-cpd
  statement: Value encoding by OFC neurons peaked about 300 ms after each cue was revealed and stayed
    above baseline as further cues were attended.
  source: Results, Attention-guided value comparison in OFC, paragraph 1; Figure 5a
  quote: This shows that value encoding by OFC neurons peaked approximately 300ms after each cue was
    revealed but was then sustained above baseline as further cues were attended.
  expected:
  - quantity: time of peak CPD for the attended cue's value after its onset, OFC
    value: 300
    tolerance: 30
    unit: ms
  criterion: The shared GLM, OFC neurons, mean CPD across neurons (Methods, RSA template-based
    regression, for the CPD definition) for the value EVs of cues 1, 2 and 3, locked to each of
    cues 1, 2 and 3. How option and attribute EVs are combined is not stated. Readings (a) the mean
    of the CPDs of the option and attribute EVs of a cue (cue 1, EVs 1 and 5; cue 2, EVs 2 and 6;
    cue 3, EVs 3, 7 and 9); (b) each trial type separately. The paper does not define the
    baseline. Readings (i) the cue 1 value CPD at -100 ms from cue 1 (the first bin); (ii) the mean
    CPD of the same EVs over -100 to 0 ms before cue 1. Reproduced when, under one reading, the peak
    of each cue's value CPD after its own onset is within tolerance of 300 ms and the cue 1 and cue
    2 value CPDs stay above the baseline at every time in the later cue epochs; "sustained above
    baseline" has no stated test, so the mean CPD over each later cue epoch above baseline is
    reported too.
- id: fig5b-stable-attended-value-subspace
  statement: In OFC, T-statistics for cue 1 value at cue 1 correlate positively across neurons with
    those for cue 2 value at cue 2, a stable subspace for the currently attended value.
  source: Results, Attention-guided value comparison in OFC, paragraph 3; Figure 5b
  quote: we found that single neuron T-statistics for the regression of cue 1 value when cue 1 was
    attended (ordinate in Fig. 5b ) correlated positively with T-statistics for cue 2 value when
    cue 2 was attended (abscissa in Fig. 5b )
  criterion: The shared GLM and subspace correlation, OFC, the 250 ms bins after cue 1 and after
    cue 2. Option and attribute trials are collapsed (Methods, Peri-stimulus correlation). Readings
    (a) the mean of the two trial types' T-statistics (cue 1, EVs 1 and 5; cue 2, EVs 2 and 6); (b)
    the T-statistic of the summed coefficients (EV1 + EV5, as Methods, Projection, write for cue 1).
    Which test the paper used for a single correlation is in the missing legend; Pearson's test is
    taken. Reproduced when r > 0 with p < 0.05 under one reading.
- id: fig5c-attribute-cue2-vs-cue1
  statement: In OFC, at cue 2 of attribute trials, the attended cue 2 value subspace correlates
    negatively with the stored cue 1 value subspace (the other option).
  source: Results, Attention-guided value comparison in OFC, paragraph 4; Figure 5c
  quote: when cue 2 was attended on ‘attribute’ trials, the currently attended cue 2 value subspace
    correlated negatively with the stored cue 1 value subspace, representing the other option
  criterion: The shared GLM and subspace correlation, OFC, cue 2 locked, 250 ms; T-statistics of EV
    6 against EV 5. Pearson's test. Reproduced when r < 0 with p < 0.05.
- id: fig5de-option-cue3-vs-stored
  statement: In OFC, at cue 3 of option trials, the attended cue 3 value subspace correlates
    negatively with both the stored cue 1 and the stored cue 2 value subspaces.
  source: Results, Attention-guided value comparison in OFC, paragraph 4; Figure 5d and 5e
  quote: when cue 3 was attended on ‘option’ trials, the stored cue 1 and stored cue 2 values both
    represented the other option and were both negatively correlated with currently attended cue 3
    value subspace
  criterion: The shared GLM and subspace correlation, OFC, cue 3 locked, 250 ms; T-statistics of EV
    3 against EV 1 and of EV 3 against EV 2. Pearson's test. Reproduced when both r < 0 with p <
    0.05; partially reproduced when one is.
- id: fig5f-option-stored-combined
  statement: In OFC, at cue 3 of option trials, the stored cue 1 and stored cue 2 value subspaces
    correlate positively, so the two previously attended cues are combined.
  source: Results, Attention-guided value comparison in OFC, paragraph 4; Figure 5f
  quote: However, these two stored subspaces were themselves positively correlated at cue 3 on
    ‘option’ trials ( Fig. 5f ).
  criterion: The shared GLM and subspace correlation, OFC, cue 3 locked, 250 ms; T-statistics of EV
    1 against EV 2. Pearson's test. Reproduced when r > 0 with p < 0.05. The Discussion adds that
    this did not occur at cue 2 (Figure 5f/h); the same correlation at cue 2, 250 ms, is reported.
- id: fig5gj-cross-correlation-dynamics
  statement: Cross-correlating the OFC value subspaces across time shows the same population
    subspace shifting its value encoding from positive to negative as the subject saccades around
    the screen.
  source: Results, Attention-guided value comparison in OFC, paragraph 5; Figure 5g-j
  quote: This reveals how the same OFC population subspace would dynamically shift its encoding of
    values from positive to negative as the subject saccaded around the screen.
  depends_on:
  - fig5c-attribute-cue2-vs-cue1
  - fig5de-option-cue3-vs-stored
  - fig5f-option-stored-combined
  criterion: The shared GLM; for a pair of EVs, the Pearson correlation across OFC neurons of their
    T-statistics at every pair of time points over the cue 1, 2 and 3 epochs (Methods,
    Peri-stimulus correlation); clusters of |r| > 0.2, significance against the 99.9th percentile of
    the largest cluster in 1000 permutations across neurons of one EV's T-statistics (Methods,
    Statistical inference on cross-correlation). Which pairs the four panels show is in the missing
    legend; the text ties 5g to 5c, 5h to 5f and 5i/5j to 5d/5e (Results, paragraph 5, and
    Discussion, paragraph 4). Reading taken, the cross-correlation of the attended value EV of a
    trial type with the stored value EVs (attribute trials, EV 6 against EV 5; option trials, EV 3
    against EV 1, EV 3 against EV 2, EV 1 against EV 2). Reproduced when each of the four maps has a
    significant cluster, of the sign of its Figure 5c-f correlation, covering the 250 ms point of
    the relevant cue, and the attended value EV of the first map shows a significant positive
    cluster with its own stored counterpart at the earlier cue.
- id: fig5k-ofc-comparison-unique
  statement: The value comparison correlations of Figure 5c-e are stronger in OFC than in DLPFC
    (p = 0.040, 0.067, 0.011) and than in ACC (p = 0.003, 0.0003, 0.00013), by Fisher r-to-Z tests.
  source: Results, Attention-guided value comparison in OFC, paragraph 6; Figure 5k
  quote: 'revealed significantly stronger population encoding in OFC than in DLPFC (attribute trials:
    VCue2 vs. VCue1, p = 0.040; option trials: VCue3 vs. VCue1, p = 0.067; VCue3 vs. VCue2, p =
    0.011; Z-test after Fisher r-to-Z transformation) and in OFC than in ACC (attribute trials:
    VCue2 vs. VCue1, p = 0.003; option trials: VCue3 vs. VCue1, p = 0.0003; VCue3 vs. VCue2, p =
    0.00013)'
  statistics:
  - about: OFC against DLPFC, attribute trials, cue 2 value against cue 1 value
    test: Z-test after Fisher r-to-Z transformation
    p: 0.04
    n: 183 OFC and 135 DLPFC neurons
  - about: OFC against DLPFC, option trials, cue 3 value against cue 1 value
    test: Z-test after Fisher r-to-Z transformation
    p: 0.067
    n: 183 OFC and 135 DLPFC neurons
  - about: OFC against DLPFC, option trials, cue 3 value against cue 2 value
    test: Z-test after Fisher r-to-Z transformation
    p: 0.011
    n: 183 OFC and 135 DLPFC neurons
  - about: OFC against ACC, attribute trials, cue 2 value against cue 1 value
    test: Z-test after Fisher r-to-Z transformation
    p: 0.003
    n: 183 OFC and 189 ACC neurons
  - about: OFC against ACC, option trials, cue 3 value against cue 1 value
    test: Z-test after Fisher r-to-Z transformation
    p: 0.0003
    n: 183 OFC and 189 ACC neurons
  - about: OFC against ACC, option trials, cue 3 value against cue 2 value
    test: Z-test after Fisher r-to-Z transformation
    p: 0.00013
    n: 183 OFC and 189 ACC neurons
  depends_on:
  - fig5c-attribute-cue2-vs-cue1
  - fig5de-option-cue3-vs-stored
  criterion: The three correlations of fig5c-attribute-cue2-vs-cue1 and fig5de-option-cue3-vs-stored
    computed in each region, compared OFC against DLPFC and OFC against ACC by the Fisher r-to-Z
    test of independent correlations (open detail O1). Reproduced when the OFC correlation is more
    negative than the other region's in all six comparisons and at least five have p < 0.05 under
    one reading, matching the paper's five of six; partially reproduced when all six go the
    paper's way and three or four have p < 0.05.
- id: figs67-no-comparison-acc-dlpfc
  statement: ACC and DLPFC carry the currently attended value subspace (and stored subspaces) but
    show no negative correlation between attended and stored value subspaces.
  source: Results, Attention-guided value comparison in OFC, paragraph 6; Supplementary Figures 6
    and 7
  quote: Whilst the currently attended value subspace was present in DLPFC and ACC, value comparison
    with stored cues was absent in these regions ( Fig 5k ; Figs. S6-7 ).
  depends_on:
  - fig5b-stable-attended-value-subspace
  criterion: The analyses of fig5b, fig5c, fig5de and fig5f, run on ACC and on DLPFC. The paper's test for a
    single correlation is in the missing legends (Supplementary Figures 6 and 7 show lines of best
    fit +/- 95% CI); Pearson's test at p < 0.05 two-sided is taken. Presence holds when the fig5b
    correlation (attended, panel B) and the fig5f correlation (stored, panel F; EV 1 with EV 2 at
    cue 3) are positive at p < 0.05 in each region (Supplementary Figures 6 and 7 legends). Absence is judged on that test alone; it
    holds when none of the three attended-against-stored correlations (EV 6 with EV 5 at cue 2; EV 3
    with EV 1 and with EV 2 at cue 3) is negative with p < 0.05. Reproduced when presence and
    absence hold in both regions; the six r values are reported either way.
- id: fig6a-acc-belief-subspace
  statement: In ACC the T-statistics of the four belief confirmation regressors (cues 2 and 3,
    option and attribute trials) correlate positively with each other and with cue 1 value, a stable
    belief confirmation code not present in OFC or DLPFC.
  source: Results, Parallel ACC signals, paragraph 2; Figure 6a; Supplementary Figure 10
  quote: We found that ACC population subspaces for each of these regressors were significantly
    correlated with each other and also to cue 1 belief confirmation ( Fig. 6a / Fig. S10 ). As all
    five regressors are defined at different parts of the trial, this reveals a stable population
    code in ACC for accepting/rejecting the current belief, which was not present in OFC or DLPFC
  criterion: The shared GLM; T-statistics of EV 13 and EV 14 at 300 ms after cue 2, EV 15 and EV 16
    at 300 ms after cue 3, and cue 1 value (EV 1 + EV 5, 300 ms after cue 1; readings of the sum as
    in fig5b) (Methods, Projection of ACC activity, paragraph 1); Pearson correlations across neurons
    for the 10 pairs (Supplementary Figure 10 legend), in each region, at p < 0.05. What is
    correlated is open; the Methods for Figure 6A and the Supplementary Figure 10 legend say
    "parameter estimates", the Methods for Figure 5 correlate T-statistics. Readings (a)
    T-statistics; (b) the OLS coefficients. The paper gives no test for the absence in OFC and
    DLPFC in the text read (the Figure 6a legend is missing); the rule below for it, fewer than
    half of the 10 positive with p < 0.05, is this file's choice and not the paper's, and the 10 r
    values of each region are reported. Reproduced when all 10 ACC correlations are positive with p
    < 0.05 and fewer than half of the 10 are positive with p < 0.05 in OFC and in DLPFC; partially reproduced when all 10 ACC correlations are positive and at least 6 are
    significant, with the OFC and DLPFC condition holding.
- id: fig6b-acc-belief-stronger
  statement: Virtually all belief confirmation correlations are stronger in ACC than in OFC and
    DLPFC, and most of the individual comparisons are significant by Fisher r-to-Z.
  source: Results, Parallel ACC signals, paragraph 2; Figure 6b
  quote: Virtually all of these correlations were stronger in ACC than OFC/DLPFC ( Fig. 6b , right
    panels), and the majority of individual comparisons were significant ( Fig 6b , left panels).
  depends_on:
  - fig6a-acc-belief-subspace
  criterion: The 10 correlations of fig6a-acc-belief-subspace, ACC against OFC and ACC against
    DLPFC, Fisher r-to-Z test of independent correlations (open detail O1), 20 comparisons.
    "Virtually all" and "the majority" are read as at least 18 of 20 with the ACC correlation the
    larger, and more than 10 of 20 at p < 0.05. Reproduced when both hold under one reading;
    partially reproduced when only the first holds.
- id: fig6c-belief-subspace-rt
  statement: ACC activity in the belief confirmation subspace separates short from long reaction
    time trials early in the trial, even at cue 1 presentation.
  source: Results, Parallel ACC signals, paragraphs 3 and 4; Figure 6c (Methods call the
    stimulus-locked panel 6B)
  quote: First, activity in this subspace separated short from long RT trials relatively early
    during the course of making a choice – even at the time of cue 1 presentation.
  depends_on:
  - fig6a-acc-belief-subspace
  criterion: ACC neurons; the belief confirmation weight vector (open detail O7) from the GLM fit on
    one half of trials, projected onto the cue 1 locked firing rates of the other half, averaged in
    five reaction-time bins (open details O4, O5, O6), baseline corrected at cue 1 onset +/- 50 ms
    (Methods, Projection of ACC activity). The paper gives no test and no window for "at the time of
    cue 1 presentation"; readings of the window (a) 100-500 ms after cue 1, the cue 1 window of the
    RSA; (b) 0-500 ms after cue 1. The direction is read from Results, paragraph 4 (confirmatory
    evidence, faster responses), the shortest-RT bin above the longest. Reproduced when, under one
    reading, the mean projection in the window, averaged over splits as the paper does, is higher
    for the shortest than for the longest RT bin; with O4 reading (b) the number of the 100 splits
    in which it holds is reported. Partially reproduced when the separation appears only after cue
    2.
- id: fig6d-belief-ramp-to-choice
  statement: Irrespective of reaction time, ACC activity in the belief confirmation subspace ramps up
    shortly before the joystick movement.
  source: Results, Parallel ACC signals, paragraph 4; Figure 6d (Methods call the response-locked
    panel 6C)
  quote: Second, irrespective of reaction time, ACC activity ramped shortly prior to joystick
    movement ( Fig. 6d ). Activity within the belief confirmation subspace therefore became prominent
    immediately prior to commitment to action, on all trials.
  depends_on:
  - fig6a-acc-belief-subspace
  criterion: As fig6c-belief-subspace-rt, response locked, -500 to 100 ms around the response (the
    GLM's response-locked range). The paper gives no test; "ramped shortly prior" is read as the mean
    projection over -200 to 0 ms exceeding that over -500 to -300 ms. Reproduced when that holds in
    each of the five RT bins under one reading of O4 to O7; partially reproduced for three or four
    bins.
- id: fig6e-action-subspace-ramp
  statement: ACC activity in the left/right action selection subspace ramps up as evidence is
    revealed and peaks immediately before the response.
  source: Results, Parallel ACC signals, paragraph 5; Figure 6e (Methods call it 6D)
  quote: Activity in the ACC action selection subspace also gradually ramped as evidence was
    revealed about which option to choose, and peaked immediately prior to action selection ( Fig.
    6e ).
  criterion: ACC neurons; the action weight vector (EVs 17 and 18, 200 ms before response; open
    detail O7) from one half of trials projected onto the other half, by RT bin, baseline corrected
    at cue 1 onset (O4, O5, O6). The sign of the projection must follow the choice, which the
    Methods do not spell out. Readings (a) left-choice minus right-choice trials averaged separately
    per RT bin and differenced; (b) rates of right-choice trials multiplied by -1 before averaging.
    No test is given. Reproduced when, under one reading, in each RT bin the response-locked
    projection rises over -500 to 0 ms (mean over -200 to 0 ms above that over -500 to -300 ms) and
    its maximum over -500 to 100 ms falls between -200 and 100 ms.
- id: fig7a-ofc-value-difference-neurons
  statement: At all three time points (cue 2 against cue 1, cue 3 against cue 1, cue 3 against cue
    2), a greater proportion of single neurons encoded value difference between attended and
    unattended cues in OFC than in ACC and DLPFC.
  source: Results, Single neuron analyses recapitulate core findings at population level, paragraph
    2; Figure 7a
  quote: At all three relevant timepoints, we found that a greater proportion of single neurons
    passed these criteria in OFC than in ACC/DLPFC ( Fig. 7a ).
  criterion: The shared GLM. A neuron passes when the contrast (attended value) - (unattended value)
    is significant and both coefficients are significant with opposite signs (Results, paragraph 2);
    open details O2 and O3. The trial type of the cue 3 tests is open; the text says "at cue 3 of
    attribute trials" but cites Figure 5d/e, which are option trials. Readings (a) as Figure 5 (cue 2
    of attribute trials, EV 6 against EV 5; cue 3 of option trials, EV 3 against EV 1 and EV 3
    against EV 2); (b) as written, cue 3 of attribute trials with the attended value EV 7 or EV 9 by
    third saccade, tested against EV 5 and EV 6 separately for each saccade direction, a neuron
    passing in either. The paper's test between regions is in the missing legend; the direction is
    judged, and pairwise chi-square tests are reported. Reproduced when the OFC proportion exceeds
    both the ACC and the DLPFC proportion at all three time points, under one reading of O3 and the
    trial type, at both readings of O2.
- id: fig7b-ofc-value-difference-any
  statement: Collapsed across the three tests, the fraction of neurons passing the value difference
    criteria at any of the three cues is greater in OFC than in ACC and DLPFC.
  source: Results, Single neuron analyses recapitulate core findings at population level, paragraph
    2; Figure 7b
  quote: We collapsed across these three tests to show the fraction of single neurons passing these
    criteria at any of the three cues individually ( Fig. 7b ).
  depends_on:
  - fig7a-ofc-value-difference-neurons
  criterion: As fig7a-ofc-value-difference-neurons, a neuron counted when it passes at any of the
    three time points. Reproduced when the OFC fraction exceeds the ACC and the DLPFC fractions under
    the reading that fig7a uses.
- id: fig7c-acc-belief-neurons
  statement: At all four time points, a greater proportion of single neurons significantly encoded
    belief confirmation in ACC than in OFC or DLPFC.
  source: Results, Single neuron analyses recapitulate core findings at population level, paragraph
    3; Figure 7c
  quote: At all four timepoints, there was a greater proportion of single neurons significantly
    encoding belief confirmation in ACC than in OFC or DLPFC ( Fig. 7c ).
  criterion: The shared GLM; per neuron, whether the coefficient of each of EVs 13, 14 (after cue 2)
    and 15, 16 (after cue 3) is significant; open details O2 and O3 (the 300 ms reading matches the
    times the Methods give for these EVs in Figure 6A). The paper's test between regions is in the
    missing legend; the direction is judged, and pairwise chi-square tests are reported. Reproduced
    when the ACC proportion exceeds both others for all four EVs under one reading of O3, at both
    readings of O2; partially reproduced for three of four.
- id: fig8-cue1-value-all-regions
  statement: At cue 1, a significant fraction of neurons in all three regions encoded the cue's
    value irrespective of its attribute, action or spatial position.
  source: Results, Single neuron analyses recapitulate core findings at population level, paragraph
    4; Figure 8
  quote: Across all three regions, a significant fraction of neurons encoded Cue 1’s value,
    irrespective of the cue’s attribute, action or spatial position ( Fig. 8 ; binomial test, all
    p<1*10 7 ).
  statistics:
  - test: binomial test
    p: 1.0e-07
    p_relation: <
    n: 189 ACC, 135 DLPFC and 183 OFC neurons, each region tested
  criterion: The cue 1 regression is not described in the Online Methods; the Results say the cue's
    value, action value, attribute value and spatial value were entered in one model. Its regressors
    are open. Readings (a) value (rank -2 to 2), value x side (left 1, right -1), value x attribute
    (probability 1, magnitude -1), value x row (top 1, bottom -1), with the main effects of side,
    attribute and row and a constant; (b) the four value regressors and a constant only. The window
    for the fractions of Figure 8a is open; readings (i) 100-500 ms after cue 1, the RSA window; (ii)
    the 200 ms bin at 250 ms; (iii) the bin at 300 ms. Trials, open detail O9; significance level,
    O2; the binomial test against a chance rate equal to that level. Reproduced when, under one
    reading, the fraction significant for value is above chance with p < 1e-7 in each region.
- id: fig8-action-value-acc-dlpfc
  statement: About 18% of ACC and DLPFC neurons encoded left/right action value at cue 1, above
    chance and more than OFC, which encoded action value at chance level.
  source: Results, Single neuron analyses recapitulate core findings at population level, paragraph
    5; Figure 8
  quote: 'First, a significant subset of ACC and DLPFC neurons (~18%) preferentially responded to the
    values of either left or right options (binomial test, both p<1*10 -5 ). Both of these
    populations were significantly greater than OFC, which encoded action value at chance level
    (pairwise Chi 2 test, ACC vs. OFC: p=0.002, DLPFC vs. OFC: p=0.003).'
  statistics:
  - about: ACC and DLPFC action value fractions against chance
    test: binomial test
    p: 1.0e-05
    p_relation: <
  - about: ACC against OFC
    test: pairwise Chi2 test
    p: 0.002
  - about: DLPFC against OFC
    test: pairwise Chi2 test
    p: 0.003
  expected:
  - quantity: fraction of ACC neurons with action value
    value: 18
    tolerance: 1.8
    unit: '%'
  - quantity: fraction of DLPFC neurons with action value
    value: 18
    tolerance: 1.8
    unit: '%'
  depends_on:
  - fig8-cue1-value-all-regions
  criterion: The regression and readings of fig8-cue1-value-all-regions, the value x side
    regressor. Reproduced when, under one reading, both fractions are within tolerance, each is above
    chance by binomial test at p < 1e-5, each exceeds OFC by chi-square at p < 0.05, and the OFC
    fraction is not above chance by binomial test at p < 0.05 (the absence is judged on that test).
    Partially reproduced when all tests hold but a fraction is outside tolerance.
- id: fig8-spatial-value-dlpfc
  statement: In DLPFC, top/bottom spatial value neurons are as prevalent as left/right action value
    neurons, while in ACC they are significantly fewer, so DLPFC encodes value by spatial position
    and ACC by action.
  source: Results, Single neuron analyses recapitulate core findings at population level, paragraph
    6; Figure 8
  quote: 'In DLPFC, such a relationship held: an equally prevalent population of top-bottom ‘spatial
    value’ neurons was observed as left-right ‘action value’ neurons (binomial test, p<1*10 -6 ). In
    ACC, this population was significantly smaller than the left-right value population (pairwise
    Chi 2 test p=0.03).'
  statistics:
  - about: DLPFC spatial value fraction against chance
    test: binomial test
    p: 1.0e-06
    p_relation: <
  - about: ACC spatial value against action value fractions
    test: pairwise Chi2 test
    p: 0.03
  depends_on:
  - fig8-action-value-acc-dlpfc
  criterion: The regression and readings of fig8-cue1-value-all-regions, the value x row regressor
    against the value x side regressor. Reproduced when, under one reading, the DLPFC spatial value
    fraction is above chance by binomial test at p < 1e-6 and does not differ from the DLPFC action
    value fraction by the pairwise chi-square test at p < 0.05 (the absence judged on that test),
    and the ACC spatial value fraction is smaller than the ACC action value fraction by that test at
    p < 0.05.
- id: fig8-attribute-value-ofc
  statement: About 24% of OFC neurons encoded attribute value at cue 1 (preferring probability or
    magnitude cues), above chance and more than in ACC or DLPFC.
  source: Results, Single neuron analyses recapitulate core findings at population level, paragraph
    7; Figure 8
  quote: 'we found a significant proportion of neurons in OFC (~24%) reflected attribute value
    (binomial test, p<1*10 7 ) ... This proportion was significantly greater than the representation
    of attribute value coding in either ACC or DLPFC (pairwise Chi 2 tests, OFC vs. ACC: p=0.001,
    OFC vs. DLPFC: p=0.014).'
  statistics:
  - about: OFC attribute value fraction against chance
    test: binomial test
    p: 1.0e-07
    p_relation: <
  - about: OFC against ACC
    test: pairwise Chi2 test
    p: 0.001
  - about: OFC against DLPFC
    test: pairwise Chi2 test
    p: 0.014
  expected:
  - quantity: fraction of OFC neurons with attribute value
    value: 24
    tolerance: 2.4
    unit: '%'
  depends_on:
  - fig8-cue1-value-all-regions
  criterion: The regression and readings of fig8-cue1-value-all-regions, the value x attribute
    regressor. Reproduced when, under one reading, the OFC fraction is within tolerance, above chance
    by binomial test at p < 1e-7, and greater than the ACC and DLPFC fractions by chi-square at p <
    0.05. Partially reproduced when the tests hold but the fraction is outside tolerance.
- id: figs9-ev16-correlation
  statement: The GLM's regressors of interest are decorrelated by design except EV 16, whose mean r2
    with EVs 7 and 9 is 0.167 and 0.194.
  source: Online Methods, General linear model, EV 16 paragraph; Supplementary Figure 9
  quote: there existed some positive correlation between EV16 and EVs 7 and 9 (mean r 2 of 0.167 and
    0.194 respectively, see Figure S9 )
  expected:
  - quantity: mean r2 of EV 16 with EV 7
    value: 0.167
    tolerance: 0.0167
  - quantity: mean r2 of EV 16 with EV 9
    value: 0.194
    tolerance: 0.0194
  criterion: The GLM design (EVs 1-18 on trials with 3 or more cues viewed). Over what the mean is
    taken is not stated. Readings (a) over sessions; (b) over neurons, each with its own session's
    trials. The legend's "most EVs of interest (1-6, 13-18) are decorrelated ... with the exception
    of EV16" is judged as every other pair among EVs 1-6 and 13-18 having mean r2 below 0.167.
    Reproduced when both values are within tolerance and that holds, under one reading.
- id: figs11-alternative-value-template
  statement: Replacing the attended value and left/right value templates by a uniform-diagonal form
    (negative absolute value difference) gives qualitatively the same functional dissociation across
