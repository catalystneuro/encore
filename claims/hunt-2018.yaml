    value: 24
    tolerance: 10
    unit: ms
  - quantity: t75 spatial attention, DLPFC
    value: 72
    tolerance: 10
    unit: ms
  - quantity: t75 spatial attention, OFC
    value: 67
    tolerance: 10
    unit: ms
  - quantity: t75 stimulus identity, OFC
    value: 269
    tolerance: 26.9
    unit: ms
  - quantity: t75 attended value, OFC
    value: 241
    tolerance: 24.1
    unit: ms
  - quantity: t75 accept/reject, ACC
    value: 238
    tolerance: 23.8
    unit: ms
  - quantity: t75 accept/reject, OFC
    value: 224
    tolerance: 22.4
    unit: ms
  - quantity: t75 left/right value, ACC
    value: 457
    tolerance: 45.7
    unit: ms
  - quantity: t75 left/right value, DLPFC
    value: 369
    tolerance: 36.9
    unit: ms
  criterion: The template regression on RSA matrices from +/- 100 ms sliding windows (Methods, RSA
    template-based regression), cue 1 locked; t75 the first time the CPD reaches 75% of its maximum
    over time (Methods, last paragraph of that section). The step of the sliding window and the
    time range are not stated. Readings of the step (a) 10 ms, as the GLM; (b) 1 ms. The range is
    open too; reading taken, -100 to 500 ms after cue 1, the GLM's stimulus-locked range, and the
