# Claims for Hunt, Malalasekera, de Berker, Miranda, Farmer, Behrens & Kennerley (2018), Nature
# Neuroscience 21, 1471-1481, "Triple dissociation of attention and decision computations across
# prefrontal cortex", doi:10.1038/s41593-018-0239-5, on CRCNS data set pfc-7 (doi:10.6080/K0PZ5712).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-10,
# protocol as stated in docs/protocol.md (Reader), version pilot-14.
#
# Text read: the version of record (PMC6331040, open access, JATS XML flattened to text, under
# paper/), main text, Discussion and Online Methods, and the supplement
# (41593_2018_239_MOESM1_ESM.pdf, extracted to text in the same file; legends of Supplementary
# Figures 1 to 12, Supplementary Table 1 and the Supplementary Note). The flattened main text has
# no main figure legends, and no PDF of the main article was supplied, so the legends of Figures 1
# to 8 (their sample sizes, tests and significance marks) were not read. Every claim on a main
# figure rests on the Results and Methods sentences that cite it. The extraction drops the minus
# sign in some exponents ("p<1*10 7" stands for p < 1e-7); quotes keep the extracted characters.
# The CRCNS data descriptor (paper/pfc-7.data-description.txt) was read only to know what the
# data set holds; no claim or method comes from it.
#
# Code. The Code Availability statement says the custom MATLAB analysis scripts are deposited with
# the raw data on CRCNS (dataset pfc-7). By the data descriptor they are among the data set's own
# files (Fig1_2_S1_behaviour, Fig4_RSA, Fig5_OFC_crosscorrelation, Fig6_ACC_multiplesignals,
# Fig7_single_neurons_cue2and3, Fig8_single_neuron_coding, InfoGathering_Neurons_* and
# InfoGathering_Preprocess_Neurons). Being among the data set's files, they were not read in this
# run, and no commit is recorded. Every method below is from the paper's text. Where those scripts
# settle a detail named as open below, the author may follow them (protocol, Reader step 2) and
# should say so; the Methods come first where they disagree.
#
# Data the paper used (Online Methods, Subjects, Behavioral Protocol, Task, Neuronal Recordings).
# Two adult male rhesus monkeys, M and F (7-10 kg, about 4 years old); 32 sessions for M and 25
# for F (Results, paragraph 2). The data descriptor names the behavioural files "Miles" and
# "Frank"; which is M and which F is the author's to confirm. Each session used a set of 10
# pre-learned picture cues, 5 for reward probability (10, 30, 50, 70, 90%) and 5 for magnitude
# (0.15 to 0.95 AU); M learnt 13 sets, F 11. Trial: 500 ms central fixation; two options (left and
# right), each two covered cues (probability and magnitude, one per row, the row counterbalanced);
# an instructed saccade to cue 1 (300 ms fixation), then an instructed saccade to cue 2 on the same
# option ("option" trial) or to the same attribute on the other option ("attribute" trial), 300 ms;
# then free choice by left/right joystick or further saccades to cue 3 (300 ms) and cue 4; after the
# choice all cues shown (500 ms F, 1000 ms M) and juice given with the chosen probability and
# magnitude. Option and attribute trials interleaved in blocks of 50; blocks of 25 "simultaneous"
# trials (all cues shown) between them are not analysed. Eye position at 240 Hz (recorded at 1000
# Hz by MonkeyLogic), joystick, single units from tungsten electrodes (8-24 per session, Plexon
# Omniplex at 40 kHz, manual sorting). Areas: ACC (dorsal bank of the cingulate sulcus, AP 27-37
# mm), DLPFC (banks of the principal sulcus), OFC (between medial and lateral orbital sulci); VMPFC
# units were recorded too but are not analysed here. Units with mean firing rate below 1 Hz are
# excluded (9 ACC, 21 DLPFC, 12 OFC), leaving 189 ACC, 135 DLPFC and 183 OFC. Measured variables
# per trial: trial type, cue identities and values, cue locations and order, saccade times and
# targets, number of cues viewed, choice (left/right), reaction time, reward; spike times aligned
# to cue 1, 2, 3 onsets (cue onset is locked to the saccade) and joystick response.
#
# Methods shared by the claims below, fixed for every criterion that cites them:
# - RSA (Methods, Representational similarity analysis): per neuron, mean firing rate 100-500 ms
#   after cue 1 onset for 20 conditions (5 probability and 5 magnitude cues, by rank, on left and on
#   right), z-scored across the 20; a neurons x 20 matrix per region (pseudopopulation over
#   sessions); Pearson correlation between conditions gives the 20 x 20 matrix. Sliding windows of
#   +/- 100 ms for time courses.
# - RSA template regression (Methods, RSA template-based regression): OLS of the 400 elements on an
#   intercept and six templates, each divided by its maximum absolute value: identity; spatial
#   attention (1 same side, -1 opposite); stimulus identity (1 where |i-j| = 10); attended value
#   (rank(i) x rank(j), ranks -2 to 2); left/right value (attended value on the same side, 0 across
#   sides); accept/reject (sign of attended value). CPD as defined in the Methods. T-statistic per
#   coefficient and between-region F-statistic, each against a null of 10,000 permutations of the
#   20 cue identities (Methods, Statistical inference on RSA template-based regression model).
# - GLM (Methods, General linear model): per neuron, OLS of firing rate in 200 ms bins stepped by
#   10 ms, -100 to 500 ms around cue 1, 2 and 3 onsets and -500 to 100 ms around the response, on
#   EVs 1-18 exactly as the Methods define them (EVs 11 and 12 the trial-type indicators, which sum
#   to the constant); trials with fewer than 3 cues viewed excluded. Weights are the T-statistics
#   of the coefficients. "250 ms" is the bin 150-350 ms after the cue (Results, Attention-guided
#   value comparison in OFC, paragraph 3).
# - Subspace correlations: Pearson correlation across all neurons of a region between the
#   T-statistics of two EVs (Methods, Peri-stimulus correlation; Supplementary Figures 2 and 10
#   name Pearson's correlation). Region differences by Fisher r-to-Z of independent correlations,
#   n = the neurons of each region.
#
# Details the paper leaves open, shared by several criteria (each criterion names those it needs):
# - O1, sidedness of the Fisher r-to-Z test between regions. Readings (a) two-sided; (b) one-sided
#   in the predicted direction.
# - O2, the significance level for counting single neurons (Figures 7 and 8). Not stated in the
#   text read (the legends are missing). Readings (a) p < 0.05; (b) p < 0.01, each two-sided on the
#   OLS coefficient or contrast.
# - O3, the time bin for single-neuron tests at cues 2 and 3 (Figure 7). Readings (a) 250 ms after
#   the cue, as Figure 5B-F/K; (b) 300 ms after the cue, as Figure 6A.
# - O4, how trials are split for the projections of Figure 6. The Methods say odd against even
#   trials, each half used once for weights and once for projection, then averaged; the Results say
#   "100 random splits" into halves, averaged. Readings (a) odd/even; (b) 100 random half splits.
# - O5, the five reaction-time bins ("five separate bins depending upon response time from Cue 1
#   onset"). Readings (a) quintiles of reaction time within each session; (b) quintiles of the
#   reaction times of all sessions of the monkey.
# - O6, the firing rates projected in Figure 6. Readings (a) firing rate in Hz in 200 ms bins as in
#   the GLM; (b) the same z-scored per neuron. The projection is the OLS regression, at each time
#   point, of the neurons' rates on the neurons x 2 weight matrix, baseline corrected to cue 1
#   onset +/- 50 ms (Methods, Projection of ACC activity).
# - O7, the "T-statistics of contrasts" used as weights for belief confirmation (EVs 13 and 14 at
#   300 ms after cue 2, EVs 15 and 16 at 300 ms after cue 3) and action (EVs 17 and 18 at 200 ms
#   before response). These come from separate fits. Readings (a) the mean of the T-statistics;
#   (b) the T-statistic of the mean coefficient, its variance the mean of the variances over the
#   number of terms.
# - O8, sidedness of the RSA permutation test of a template. Readings (a) one-sided, positive
#   coefficient; (b) two-sided on |T|.
# - O9, the trials used for RSA and the cue 1 regression of Figure 8. The exclusion of trials with
#   fewer than 3 cues is stated for the GLM only. Readings (a) all completed option and attribute
#   trials; (b) only those with 3 or more cues viewed.
schema_version: 2
paper: doi:10.1038/s41593-018-0239-5
claims:
- id: sessions-and-trials
  statement: Behaviour comes from 25 sessions of monkey F and 32 of monkey M, 9,863 trials for F
    and 14,251 for M.
  source: Results, Experimental paradigm and subject behaviour, paragraph 2; Supplementary Figure 1
    legend
  quote: Regression models were fit to all trials, collapsed across sessions (n=14,251 trials
    (subject M), n=9,863 trials (subject F))
  expected:
  - quantity: sessions, monkey F
    value: 25
    tolerance: 0
  - quantity: sessions, monkey M
    value: 32
    tolerance: 0
  - quantity: trials, monkey M
    value: 14251
    tolerance: 0
  - quantity: trials, monkey F
    value: 9863
    tolerance: 0
  criterion: Counts are exact, so the tolerance is zero. Which trials "all trials" counts is not
    stated. Readings (a) all completed option and attribute trials (simultaneous trials left out,
    Methods, Task, last paragraph); (b) the same, also counting aborted trials; (c) the same as (a)
    with trials of equal expected value left out. Reproduced when the session counts match and one
    reading gives both trial counts; partially reproduced when the trial counts are within 1%
    under one reading.
- id: neuron-counts
  statement: After excluding units with mean firing rate below 1 Hz (9 ACC, 21 DLPFC, 12 OFC), the
    analyses use 189 ACC, 135 DLPFC and 183 OFC neurons.
  source: Results, Triply dissociable PFC population codes at first saccade, paragraph 1; Online
    Methods, Neuronal Recordings, paragraph 2
  quote: We excluded neurons with an average firing rate of <1Hz from further analysis (9 units in
    ACC, 21 in DLPFC, 12 in OFC; n reported in main text are after these units have been removed)
  expected:
  - quantity: ACC neurons
    value: 189
    tolerance: 0
  - quantity: DLPFC neurons
    value: 135
    tolerance: 0
  - quantity: OFC neurons
    value: 183
    tolerance: 0
  - quantity: excluded ACC units
    value: 9
    tolerance: 0
  - quantity: excluded DLPFC units
    value: 21
    tolerance: 0
  - quantity: excluded OFC units
    value: 12
    tolerance: 0
  criterion: Units are counted by region, and the mean firing rate of each is computed. Counts are
    exact, so the tolerance is zero. The paper does not say over what the mean rate is taken.
    Readings (a) the whole session; (b) all analysed trials, from trial start to response. The
    per-session counts of Supplementary Table 1 are compared too. Its caption says units above 1 Hz,
    but its columns sum to 198 ACC, 195 OFC and 156 DLPFC (189 + 9, 183 + 12, 135 + 21), and it
    lists 29 sessions for M and 24 for F. Reproduced when the region totals match under one
    reading; the table's agreement with the data is reported either way.
- id: choice-accuracy-ev
  statement: Monkeys F and M chose the option with the higher expected value on 76.6% and 79.8% of
    trials.
  source: Results, Experimental paradigm and subject behaviour, paragraph 2; Figure 1b
  quote: They chose the option with higher expected value on 76.6% and 79.8% of trials (monkeys F
    (n=25 sessions) and M (n=32 sessions) respectively)
  expected:
  - quantity: choices of the higher expected value, monkey F
    value: 76.6
    tolerance: 7.66
    unit: '%'
  - quantity: choices of the higher expected value, monkey M
    value: 79.8
    tolerance: 7.98
    unit: '%'
  criterion: Expected value is probability times magnitude of the option (Methods, Task). Trials
    are the completed option and attribute trials. The paper does not say how trials of equal
    expected value count. Readings (a) left out; (b) counted as not choosing the higher. Reproduced
    when both values are within tolerance under one reading.
- id: chose-on-partial-information
  statement: Monkeys F and M chose before seeing all four cues on 85.5% and 71.4% of trials.
  source: Results, Experimental paradigm and subject behaviour, paragraph 2
  quote: 'subjects chose before all four cues had been evaluated on 85.5%/71.4% of trials (subjects
    F/M respectively)'
  expected:
  - quantity: trials with fewer than four cues viewed, monkey F
    value: 85.5
    tolerance: 8.55
    unit: '%'
  - quantity: trials with fewer than four cues viewed, monkey M
    value: 71.4
    tolerance: 7.14
    unit: '%'
- id: choice-accuracy-observed
  statement: Judged by the pictures observed, choice accuracy was 86.3% for monkey F and 87.4% for
    monkey M.
  source: Results, Experimental paradigm and subject behaviour, paragraph 2
  quote: Choice accuracy based upon the pictures observed ... was substantially higher (86.3% and 87.4% for monkey F and M respectively)
  expected:
  - quantity: accuracy on observed pictures, monkey F
    value: 86.3
    tolerance: 8.63
    unit: '%'
  - quantity: accuracy on observed pictures, monkey M
    value: 87.4
    tolerance: 8.74
    unit: '%'
  criterion: The paper does not define the expected value from the pictures observed. Readings (a)
    each unseen cue set to the middle level of its attribute (50% probability, 0.55 AU magnitude),
    expected value as probability times magnitude, trials where the observed values tie left out;
    (b) the same, ties counted as incorrect; (c) the choice judged by the sum of the observed cues'
    ranks (-2 to 2) per option, ties left out. Reproduced when both values are within tolerance
    under one reading.
- id: figs1ab-cue-weights
  statement: In logistic regressions of choice, both monkeys weighted reward probability and
    magnitude about equally and used all four viewed cues, with a slight upweighting of the
    antepenultimate (n-2) cue, and both showed a small bias towards choosing the second side on
    option trials.
  source: Results, Experimental paradigm and subject behaviour, paragraph 2; Supplementary Figure 1A
    and 1B
  quote: Both subjects use all four cues to guide their choices, with a slight upweighting of the
    antepenultimate cue ... both subjects show a small but significant bias towards choosing the
    second side on option trials
  criterion: Per monkey, all trials pooled across sessions (Supplementary Figure 1 legend). Model B
    regresses choice (left = 1) on left minus right probability and left minus right magnitude,
    separately for option and attribute trials, with a left bias and a first-side bias. The units of
    probability and magnitude are not stated; ranks and raw values both step by 0.2, so the ratio of
    the two weights is the same either way. Model A regresses choice on the final, n-1, n-2 and (on
    four-cue trials) n-3 viewed pictures. The sign and scale of a picture's regressor are open.
    Readings (a) its rank (-2 to 2) signed + for the left option, - for the right; (b) its raw
    value, signed the same way. "Approximately equal weight" has two readings, (a) the 95%
    confidence intervals of the two weights overlap, (b) a Wald test of their difference has p >
    0.05. Reproduced when, in both monkeys, every picture weight in A is positive with p < 0.05,
    probability and magnitude weights are positive and approximately equal on both trial types,
    and the first-side bias on option trials is negative (towards the second side) with p < 0.05.
    The legend gives no test for the upweighting of the n-2 cue; it is reported (the n-2 weight
    against the final and n-1 weights), not judged.
- id: figs1cd-fewer-cues-more-accurate
  statement: Choices were more often optimal on trials where 2 pictures were viewed than on trials
    with 3 or 4, because trials ended early when the first two cues gave a larger value difference.
  source: Results, Experimental paradigm and subject behaviour, paragraph 2; Supplementary Figure 1C
    and 1D
  quote: Surprisingly, choice accuracy was also higher on trials where subjects sampled fewer pieces
    of information ( Fig. S1c ). This was because such trials were associated with a higher value
    difference, and so subjects terminated these trials more quickly ( Fig. S1d ).
  criterion: Per monkey, the fraction of choices of the higher expected value (as in
    choice-accuracy-ev, reading (a)) on trials with 2, 3 and 4 cues viewed, and the mean value
    difference by the number of cues viewed. The value difference is not defined in the text read.
    Readings (a) the absolute difference of the two options' true expected values; (b) the absolute
    difference implied by cues 1 and 2 alone, unseen cues at the middle level. Reproduced when in
    both monkeys accuracy on 2-cue trials exceeds that on 3-cue and on 4-cue trials, and the mean
    value difference is largest on 2-cue trials under one reading.
- id: fig2a-sample-the-favourite
  statement: On attribute trials, the free third saccade went preferentially to the option with the
    higher value between cue 1 and cue 2.
  source: Results, Experimental paradigm and subject behaviour, paragraph 3; Figure 2a
  quote: On ‘attribute’ trials, this saccade was preferentially directed towards the option with the
    higher relative expected value between cue 1 and cue 2
  criterion: Attribute trials with a third cue viewed; the third saccade is diagonal (back to the
    first option) or vertical (to the second option) (Methods, GLM, EVs 7-10). Cue 1 and cue 2 are
    the same attribute, so their ranks are compared. The paper's test is in the missing legend.
    Readings (a) a logistic regression of returning to the first option on the rank of cue 1 minus
    the rank of cue 2, per monkey, slope positive at p < 0.05; (b) the proportion returning to the
    first option when cue 1 > cue 2 against when cue 1 < cue 2, chi-square at p < 0.05. Reproduced
    when both monkeys show the effect under one reading; partially reproduced for one monkey.
- id: fig2b-positive-evidence
  statement: On option trials, subjects sampled the fewest cues when cues 1 and 2 were highest in
    value and the most when they were lowest.
  source: Results, Experimental paradigm and subject behaviour, paragraph 3; Figure 2b
  quote: On ‘option’ trials, subjects sampled fewest pieces of information when cues 1 and 2 were
    highest in value, but most information when cues 1 and 2 were lowest in value
  criterion: Option trials; the number of cues viewed (2, 3 or 4) as a function of the ranks of
    cues 1 and 2 (a 5 x 5 table, Figure 2b). Readings of "highest" and "lowest" (a) the corners,
    both ranks 2 against both ranks -2; (b) the sum of the two ranks, the mean number of cues
    decreasing with it (Spearman correlation negative at p < 0.05). Whether the monkeys are pooled
    is not stated; readings (i) each monkey, (ii) pooled. Reproduced when the mean number of cues
    is lower for the highest than for the lowest values under reading (a), or the correlation is
    negative under (b), in both monkeys or pooled.
- id: fig4d-spatial-attention
  statement: At cue 1, DLPFC representational similarity reflects whether the subject is attending
    left or right; spatial attention is also represented in OFC and ACC.
  source: Results, Triply dissociable PFC population codes at first saccade, paragraphs 4 and 5;
    Figure 4a-d
  quote: DLPFC RSA reflected whether the subject was attending left or right ( Fig. 4d ) ... for
    example, spatial attention is represented in both OFC and ACC ( Fig. 4d )
  criterion: The shared RSA and template regression on the 100-500 ms matrix, all neurons of each
    region; open details O8 and O9. Reproduced when the spatial attention template is significant
    (permutation p < 0.05) in DLPFC, its CPD is larger in DLPFC than in ACC and OFC, and it is
    significant (permutation p < 0.05) in OFC and in ACC. The between-region F permutation test is reported.
- id: fig4e-ofc-stimulus-identity
  statement: At cue 1, OFC representational similarity reflects the attended stimulus identity
    irrespective of its spatial position.
  source: Results, Triply dissociable PFC population codes at first saccade, paragraph 4; Figure 4e
  quote: OFC representational similarity reflected the currently attended stimulus identity,
    irrespective of spatial position ( Fig. 4e )
  criterion: As fig4d-spatial-attention, for the stimulus identity template. Reproduced when it is
    significant (permutation p < 0.05) in OFC and its CPD is larger in OFC than in ACC and DLPFC.
- id: fig4f-ofc-attended-value
  statement: At cue 1, OFC representational similarity is high for cues of similar attended value,
    consistent with a linear value code.
  source: Results, Triply dissociable PFC population codes at first saccade, paragraphs 4 and 7;
    Figure 4a and 4f
  quote: OFC representational similarity reflected the currently attended stimulus identity,
    irrespective of spatial position ( Fig. 4e ), and was also high for cues of similar attended
    value ( Fig. 4f )
  criterion: As fig4d-spatial-attention, for the attended value template. Reproduced when it is
    significant (permutation p < 0.05) in OFC and its CPD is larger in OFC than in ACC and DLPFC.
- id: fig4g-left-right-value
  statement: At cue 1, ACC and DLPFC representational similarity shows a value code modulated by
    whether the subject attends the left or right option.
  source: Results, Triply dissociable PFC population codes at first saccade, paragraph 4; Figure 4g
  quote: ACC and DLPFC RSA showed a value code modulated by whether the subject was currently
    attending to the left or right option ( Fig. 4g )
  criterion: As fig4d-spatial-attention, for the left/right value template. Reproduced when it is
    significant (permutation p < 0.05) in ACC and in DLPFC, and its CPD in each exceeds that in OFC.
- id: fig4h-acc-accept-reject
  statement: At cue 1, ACC representational similarity divides high-valued from low-valued cues,
    best explained as a categorical (accept/reject) function of value.
  source: Results, Triply dissociable PFC population codes at first saccade, paragraphs 4 and 8;
    Figure 4c and 4h
  quote: ACC RSA also divided high-valued and low-valued items such that variance in ACC was best
    explained as a non-linear, categorical function of value ( Fig. 4h
  criterion: As fig4d-spatial-attention, for the accept/reject template (sign of attended value),
    which enters the model with the attended value template. "Best explained" by the categorical
    template is open, since the Supplementary Figure 5 legend warns that CPDs of different
    variables are not directly comparable. Readings (a) the accept/reject CPD in ACC exceeds the
    attended value CPD in ACC; (b) the accept/reject template is significant in ACC and the
    attended value template is not. Reproduced when the accept/reject template is significant
    (permutation p < 0.05) in ACC, its CPD in ACC exceeds that of the accept/reject template in
    DLPFC, and (a) or (b) holds. Its value in OFC is reported (the
    latencies give an OFC t75 for it).
- id: figs2-consistent-across-subjects
  statement: The triple dissociation of RSA matrices at cue 1 is consistent across the two monkeys.
  source: Results, Triply dissociable PFC population codes at first saccade, paragraph 4;
    Supplementary Figure 2
  quote: This was consistent across subjects ( Fig. S2 )
  depends_on:
  - fig4d-spatial-attention
  - fig4e-ofc-stimulus-identity
  - fig4f-ofc-attended-value
  - fig4g-left-right-value
  - fig4h-acc-accept-reject
  criterion: The shared RSA computed on each monkey's neurons separately (Supplementary Figure 2
    legend). The paper reports no test of consistency. Reproduced when, in each monkey, the template
    regression coefficients are positive for DLPFC spatial attention, OFC stimulus identity, OFC
    attended value, ACC and DLPFC left/right value and ACC accept/reject; partially reproduced when
    four of these six hold in both monkeys.
- id: figs4-dlpfc-top-bottom
  statement: Split by top and bottom cue position (40 conditions), the RSA results replicate, and
    DLPFC similarity is also modulated by top/bottom position, so DLPFC represents spatial position
    more than left/right action.
  source: Supplementary Figure 4 legend
  quote: in DLPFC, representational similarity is modulated by top/bottom stimulus location ... This
    indicates that DLPFC activity primarily represents spatial position
  criterion: The shared RSA on 40 conditions (20 conditions by top and bottom position of cue 1),
    100-500 ms. No test is given. Measure, from the legend's comparison, the mean similarity of
    pairs of conditions in the same quadrant (top left with top left) against pairs on the same side
    but different rows (top left with bottom left), excluding the diagonal. Reproduced when this
    difference is positive in DLPFC and larger there than in ACC and OFC. The legend's "primarily
    replicate" is not judged, as the paper defines no templates for 40 conditions; the 40 x 40
    matrices are shown.
- id: fig4-t75-latencies
  statement: Spatial attention reached 75% of its peak CPD at about the saccade (24, 72 and 67 ms in
    ACC, DLPFC, OFC); stimulus identity and attended value in OFC (269, 241 ms) and accept/reject
    (238 ms ACC, 224 ms OFC) followed; left/right value came later (457 ms ACC, 369 ms DLPFC).
  source: Results, Triply dissociable PFC population codes at first saccade, paragraph 6;
    Supplementary Figure 5B
  quote: Spatial attention affected representational similarity around the time of the saccadic
    eye-movement (t 75 =24ms in ACC, 72ms in DLPFC, 67ms in OFC) ... coding of stimulus identity and
    attended value (t 75 =269ms/241ms respectively in OFC) was comparable in latency to accept/reject
    coding (t 75 =238ms in ACC, 224ms in OFC). By contrast, action value coding emerged significantly
    later (t 75 =457ms in ACC, 369ms in DLPFC)
  depends_on:
  - fig4d-spatial-attention
  expected:
