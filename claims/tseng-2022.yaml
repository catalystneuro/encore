    dynamic choice and movement, and for cue and movement only pairs involving A differ; every
    r is reported, and near zero is judged as |r| < 0.2, a bound this file sets, as the paper
    gives none.
- id: fig7g-area-decoding-strength-vs-correlation
  statement: A neuron's area is decoded well from encoding strengths, poorly from encoding
    correlations, and barely better from both than from strengths alone.
  source: Results, Conjunctive structure of encoding, paragraph 3; Figure 7G, 7H
  quote: Although decoding based on encoding correlations allowed above-chance performance, it
    was poor relative to decoding from encoding strengths alone. Further, decoding with both
    encoding correlations and encoding strengths was barely improved from decoding with encoding
    strengths alone
  statistics:
  - about: strengths only against correlations only, all areas except AM
    test: Wilcoxon signed-rank test
    p: 0.05
    p_relation: "<"
  - about: strengths only against strengths plus correlations, all areas
    test: Wilcoxon signed-rank test
    p: 0.03
    p_relation: ">"
    corrected: not significant after multiple comparison correction
  depends_on:
  - fig7def-encoding-correlations
  criterion: STAR Methods, Decoding of area. Spatial-mean-subtracted, z-scored encoding
    strengths of 11 variables for active neurons in the stem; interaction terms are their
    pairwise products; one-against-others scikit-learn LogisticRegression, leave-one-mouse-out,
    auROC on held-out mice; Wilcoxon signed-rank test. The paired samples of the test are not
    named; the reading is the 8 held-out mice (the legend gives mean ± SEM over the
    leave-one-mouse-out procedure). No parameters are
    given for LogisticRegression; its defaults (L2, C = 1) are the reading. Reproduced when
    strengths beat correlations in at least five of six areas (p < 0.05) and strengths plus
    correlations is not better than strengths after Benjamini-Hochberg in any area.
- id: fig8cd-position-specific-decoders
  statement: Cue and choice decoders trained at one maze position lose accuracy when tested at
