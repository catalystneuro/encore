  statement: The number of principal components needed for 70% of variance is 8, 6 and 3 for
    GLM coefficients, encoding strengths and decoded locations, and 35, 23 and 16 for 95%.
  source: STAR Methods, Analysis of dimensionality of encoding across neurons versus encoding
    across cortical space
  quote: The number of principal components needed to explain 70% of the variance in the three
    matrices was 8, 6, and 3, respectively, and further, 35, 23, and 16 principal components were
    needed to explain 95% of the variance
  expected:
  - quantity: PCs for 70%, GLM coefficients
    value: 8
    tolerance: 0.8
  - quantity: PCs for 70%, encoding strengths
    value: 6
    tolerance: 0.6
  - quantity: PCs for 70%, decoded locations
    value: 3
    tolerance: 0.3
  - quantity: PCs for 95%, GLM coefficients
    value: 35
    tolerance: 3.5
  - quantity: PCs for 95%, encoding strengths
    value: 23
    tolerance: 2.3
  - quantity: PCs for 95%, decoded locations
    value: 16
    tolerance: 1.6
  depends_on:
  - fig6b-location-from-profiles
  criterion: PCA of the three matrices of the Methods over the well-fit neurons. Whether
    columns are standardized first is not said; centred only and z-scored are both run. The
