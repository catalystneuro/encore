    a reading.
- id: figs5i-dynamic-choice-over-roll
  statement: In all areas except V1 and A, dynamic choice is encoded more than roll velocity
    during stem traversal.
  source: Figure S5I
  quote: >-
    For all areas except V1 and area A, the mean fraction explained deviance for dynamic choice
    was greater than roll velocity, which controls left-right movements in the maze (AM: p =
    0.006; PM, MM and RSC: p < 10-3)
  statistics:
  - about: AM
    test: hierarchical bootstrap
    p: 0.006
  - about: PM, MM and RSC
    test: hierarchical bootstrap
    p: 0.001
    p_relation: "<"
  depends_on:
  - well-fit-neurons
  criterion: Encoding strength in the stem epoch of dynamic choice and of roll velocity (its
    linear term; reading two adds its pairwise interactions with the other velocities), paired
    per neuron, area means by hierarchical bootstrap. Reproduced when dynamic choice exceeds roll
    velocity in PM, AM, MM and RSC at two-tailed p < 0.05. V1 and A are reported.
- id: figs5m-movement-history-control
  statement: With past and upcoming movement added to the GLM, dynamic choice encoding drops
    but stays above zero in all areas and higher in RSC than in V1, PM and A.
  source: Results, Encoding of dynamic choice was enriched in RSC, paragraph 3; Figure S5M
  quote: Encoding of dynamic choice in models with movement history was significantly greater
    than zero in all 6 areas (p < 10-3), and was higher in RSC compared to V1, PM and area A (p <
    10-3)
  statistics:
  - about: with against without movement history, each area
    test: hierarchical bootstrap
    p: 0.001
    p_relation: "<"
  - about: each area against zero
    test: hierarchical bootstrap
    p: 0.001
    p_relation: "<"
  - about: RSC against V1, PM and A
    test: hierarchical bootstrap
    p: 0.001
    p_relation: "<"
  depends_on:
  - well-fit-neurons
  criterion: The alternative GLM of the Methods (Design matrix) with velocities and
    accelerations on 5-df b-splines shifted every 1/3 s over 2 s past and future, no pairwise
    movement interactions. Reproduced when dynamic choice encoding in the stem is lower than in
    the main model in all areas, above zero in all areas, and higher in RSC than V1, PM and A,
    each two-tailed p < 0.05 by hierarchical bootstrap.
- id: fig4g-position-rsc
  statement: Maze position is encoded in all areas, most strongly in RSC (above V1, PM and A,
    not different from AM and MM).
  source: Results, Encoding of dynamic choice was enriched in RSC, paragraph 4; Figure 4F, 4G
  quote: Encoding of maze position was present in all areas, but strongest in RSC, with a similar
    medial-to-lateral gradient as choice encoding
  statistics:
  - about: RSC against V1, PM or A
    test: hierarchical bootstrap
    p: 0.001
    p_relation: "<"
  - about: RSC against AM or MM
    test: hierarchical bootstrap
    p: 0.05
    p_relation: ">"
  depends_on:
  - well-fit-neurons
  criterion: Encoding strength of trial phase (maze position) in the stem epoch, area means by
    hierarchical bootstrap. Reproduced when every area is above zero and RSC exceeds V1, PM and
