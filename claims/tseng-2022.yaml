    hierarchical bootstrap two-tailed p < 0.05) for both variables in every area.
- id: fig8g-shattering-dimensionality
  statement: Shattering dimensionality for conjunctions of cue, choice, position, movement and
    rule belief is well above chance and similar across areas, and nearly identical to that of
    populations drawn from all areas.
  source: Results, Flexible, high-dimensional representations, paragraph 2; Figure 8F, 8G;
    Figure S8A to S8C
  quote: Shattering dimensionality for all conjunctions in all areas was well above chance, and
    interestingly, shattering dimensionality for each conjunction was similar across posterior
    cortex ... Almost all differences between areas were not statistically significant and fell
    within a range of < 10% classification accuracy for each conjunction
  statistics:
  - about: all pairs among all-area and the 6 areas, Figure 8G
    test: hierarchical bootstrap
    p: 0.01
    p_relation: ">"
    corrected: not significant after multiple comparison correction
  - about: cue, dynamic choice and position, RSC against A (Figure S8B)
    test: hierarchical bootstrap
    p: 0.001
    p_relation: "<"
  criterion: STAR Methods, Quantification of shattering dimensionality. Pseudo-populations of
    1,000 neurons per area by hierarchical bootstrap (1,000 samples), all layer 2/3 neurons,
    stem frames, trial samples split 50-50 (test capped at 30), standardized on training data,
    linear SVC on every marginally balanced dichotomy, 10 splits, with the bins and C values of
    the Methods (C = 1.0 for cue and position, 0.1 otherwise). Conjunctions as listed in the
    Methods (cue or choice by 10 position bins, cue by 3 rule-belief bins by 6 position bins,
    cue by choice by 4 position bins, 6 quantile bins per velocity axis); the exact set in
    Figure 8G is shown only in the figure. Whether "choice" is dynamic choice (binned in 2) or
    reported choice is not fixed except for Figure S8A (dynamic); both are run. Reproduced when
    every conjunction in every area is above 0.5, the spread of area means per conjunction is
    under 0.10, and no area pair differs after Benjamini-Hochberg except RSC against A for cue
    by dynamic choice by position (a claim of absence on the paper's test).
- id: figs8d-l2-vs-group-lasso
  statement: GLMs fit with L2 regularization perform slightly worse on test data than with
    group lasso (difference -0.0175 ± 0.0052), and the main encoding results hold with L2.
  source: STAR Methods, Quantification of fraction explained deviance (without re-fitting);
    Figure S8D to S8J
  quote: The performance of the models on test data was worse on average than those with group
    lasso (difference in fraction of explained deviance
  statistics:
  - test: hierarchical bootstrap
    p: 0.001
    p_relation: "<"
    n: 93,881 neurons
  expected:
  - quantity: L2 minus group lasso test fraction deviance explained
    value: -0.0175
    tolerance: 0.0052
  depends_on:
  - fig3i-glm-fit
  criterion: The GLM refit with an L2 penalty in place of group lasso (the code's elastic_net
    with l1_ratio 0), lambda chosen as in the main fit. The Methods print -0.0175 and the
    legend 0.018 for the same difference; the Methods' signed value is used. Tolerance is the
    reported SEM. Reproduced when the difference is within tolerance and below zero at p <
    0.05, and the gradients of fig3m-movement-task-gradient and fig3o-cue-gradient keep their
    ordering with L2.
- id: figs8k-robust-to-threshold
  statement: With a looser fit threshold (fraction deviance explained above 0.1, 68,532
    neurons), the area differences in movement, task, cue, choice, position and strategy encoding
    are the same.
  source: Results, Calcium imaging of neural activity, paragraph 2; Figure S8K to S8O
  quote: for subsequent analyses, we focused on well fit neurons although results were robust to
    this criterion
  depends_on:
  - fig3m-movement-task-gradient
  - fig3o-cue-gradient
  - fig4b-dynamic-choice-stem
  - fig4g-position-rsc
  - figs4l-strategy-distributed
  criterion: The tests of the claims it depends on, repeated on neurons above 0.1. Reproduced
    when each of them gives the same outcome as on the 42,998 neurons; the legend of Figure
    S8N reports RSC above V1, PM and A at p < 0.05 for position, and S8O strategy pairs at p >
    0.04, not significant after correction.
- id: figs5l-dynamic-choice-over-cue-biased-running
  statement: At maze positions where cue and reported choice are equally decodable from running,
    single neurons encode dynamic choice more than cue-biased running in all areas except V1 and
    PM, and population decoders decode dynamic choice better than cue-biased running in all
    areas.
  source: Figure S5L; Results, Encoding of dynamic choice was enriched in RSC, paragraph 3
  quote: For single neuron encoding magnitudes, dynamic choice was greater than cue-biased running
    (p < 10-3) for all areas except V1 and PM. For population decoding performance, dynamic choice
    was greater than cue-biased running (p < 10-3) for all areas
  statistics:
  - about: single-neuron encoding, PM excluded with V1, the other four areas
    test: hierarchical bootstrap
    p: 0.001
    p_relation: "<"
  - about: population decoding, all six areas
    test: hierarchical bootstrap
    p: 0.001
    p_relation: "<"
    n: 998 decoders
  depends_on:
  - well-fit-neurons
  - fig3q-cue-decoding
  criterion: STAR Methods, Analysis of dynamic choice and cue-biased running at matched
    positions. Per session, trial-averaged LSTM log likelihood of reported choice and of cue
    over maze position; thresholds spaced by 0.1 over the session's range; at each threshold the
    positions where each reaches it. Single neurons, fraction explained deviance of dynamic choice
    and of cue-biased running at the matched positions; decoders, logistic decoders as in
    fig3q-cue-decoding on the three closest timepoints around the matched positions, scored as
    Spearman correlation; both averaged over threshold levels, then per area by hierarchical
    bootstrap. Which crossing counts when a curve reaches a threshold more than once is not
    said; the readings are the first crossing and the last. Reproduced when, under every
    reading, dynamic choice exceeds cue-biased running at two-tailed p < 0.05 in AM, MM, RSC and A
    for single neurons and in all six areas for decoders. V1 and PM single-neuron results are
    reported.
- id: fig6h-embedding-overlap
  statement: In the two-dimensional encoding embedding, area distributions overlap; their
    centroids are offset, but many neurons lie closer to the centroid of another area than to
    that of their own area.
  source: Results, Single-neuron encoding profiles confirm functional gradients, paragraph 3;
    Figure 6H; Figure S6L
  quote: Although the centroids of the distributions (i.e. most typical encoding profiles) were
    offset from one another, many neurons were functionally closer to the centroid of a different
    area than to the centroid of the area where they resided
  depends_on:
  - fig6b-location-from-profiles
  criterion: STAR Methods, Linear embedding of single neuron encoding properties. PCA of the
    coefficients of the 241 location decoders; each well-fit neuron's encoding profile projected
    on the first two components; area centroids as the mean of the area's neurons. For each area,
    the fraction of its neurons whose Euclidean distance in the embedding is smaller to some other
    area's centroid than to their own. The paper gives no number for "many"; reproduced when this
    fraction exceeds 0.25 in every area, a bound this file sets. The fractions are reported, and
    the same measure in the full encoding space (where the dendrogram's centroids are taken) is
    shown as a variant.
