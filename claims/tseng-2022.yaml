- id: fig4h-activity-by-epoch
  statement: RSC is most active in the maze stem and least active in the feedback period/ITI,
    when area A is more active.
  source: Results, Encoding of dynamic choice was enriched in RSC, paragraph 4; Figure 4H
  quote: RSC was also most active in the maze stem and least active during feedback and ITI
    periods, when area A was more active
  criterion: Deconvolved activity z-scored per neuron, averaged per neuron in each epoch (Figure
    4H). Over what the z-score is taken is not said; the session is the standard reading. Which
    neurons enter is not said; the readings are all 93,881 and the well-fit 42,998. The sentence
    allows two comparisons, both run. (a) Between areas, RSC's mean in the stem exceeds every
    other area's and in the feedback period/ITI is below A's. (b) Within RSC, its mean in the
    stem exceeds its means in the arms and in the feedback period/ITI, its feedback period/ITI
    mean is the lowest of the three, and in the feedback period/ITI A's mean exceeds RSC's.
    Each comparison by hierarchical bootstrap, two-tailed p < 0.05 (the Methods' default test;
    the legend gives none). Reproduced when the comparisons hold under every reading.
- id: fig5e-cue-movement-distributed
  statement: Cue and movement have the highest mutual information between encoding strength
    and area, yet their equivalent random fractions are above 0.75 and equivalent jitters near
    0.6, closer to fully distributed than fully modular.
  source: Results, Encoding of most variables is highly distributed, paragraph 2; Figure 5E,
    5F; Figure S6A
  quote: Cue and movement were the two variables with the highest mutual information between
    encoding strength and posterior cortical area. However, their equivalent random fractions were
    greater than 0.75 ... Similarly, their equivalent jitters were near 0.6
  expected:
  - quantity: equivalent jitter, cue and movement
    value: 0.6
    tolerance: 0.06
  depends_on:
  - well-fit-neurons
  criterion: STAR Methods, Quantification of distributedness. Active neurons per epoch
    (epoch-averaged null deviance above trial-averaged null deviance), 1,000 sampled per area,
    encoding strength ranked, mutual information with area label (scikit-learn
    mutual_info_classif) normalized by the fully modular model, repeated 1,000 times; the
    equivalent random fraction and jitter are the nearest neighbours on the model curves (100
    values from 0.01 to 1; 491 values from 0.1 to 5; 100 simulations each). Epochs are stem
    for cue, whole trial for movement. For a whole-trial variable the active-neuron rule
    (epoch-averaged above trial-averaged null deviance) cannot select anyone as written; the
    readings are all well-fit neurons and all neurons. Reproduced when cue and movement have the two highest
    normalized MI of the variables tested, both random fractions exceed 0.75 and both jitters
    are within 10% of 0.6. Whether the active-neuron pool is the well-fit neurons or all neurons
    is not said; the counts (20,202 stem, 12,719 feedback) match the well-fit pool, which is
    used, with all neurons as a variant.
- id: fig5e-position-choice-strategy-distributed
  statement: Maze position and choice are even more distributed (equivalent random fraction near
    0.9), and decision-making strategy is the most distributed (near 1).
  source: Results, Encoding of most variables is highly distributed, paragraph 2; Figure 5E
  quote: The encoding of maze position and choice were even more distributed than cue and
    movement, with equivalent random fractions near 0.9. All other variables were also highly
    distributed, with decision-making strategy being the most distributed (random fraction near
    one)
  expected:
  - quantity: equivalent random fraction, maze position and choice
    value: 0.9
    tolerance: 0.09
  - quantity: equivalent random fraction, strategy
    value: 1
    tolerance: 0.1
  - quantity: active neurons, stem
    value: 20202
    tolerance: 2020
  - quantity: active neurons, feedback period/ITI
    value: 12719
    tolerance: 1272
  depends_on:
  - fig5e-cue-movement-distributed
  criterion: As fig5e-cue-movement-distributed; maze position and dynamic choice in the stem,
    reported choice and outcome in the feedback period/ITI, strategy over the whole trial (the
    Methods name stem for position and dynamic choice, feedback for reported choice and
    outcome; the strategy epoch is not named, so stem and whole trial are both run). Which
    "choice" the sentence means is not fixed; dynamic choice (stem) and reported choice
    (feedback) are both reported, and the claim holds when either is within tolerance and
    above cue and movement. Reproduced when the values are within tolerance and strategy has the
    highest random fraction.
- id: fig6b-location-from-profiles
  statement: Neurons in V1, A and RSC are typically decoded to their own areas from their
    encoding profiles, while neurons in AM and MM are decoded across all of posterior cortex.
  source: Results, Single-neuron encoding profiles confirm functional gradients, paragraph 1;
    Figure 6A, 6B
  quote: Neurons in V1, A, and RSC were typically predicted to reside in their actual areas of
    origin, indicating that these neurons had distinctive encoding profiles, in contrast to neurons
    from AM and MM that were predicted to reside in all sites across posterior cortex
  depends_on:
  - well-fit-neurons
  criterion: STAR Methods, Decoding anatomical locations. Encoding profile is the mean fraction
    explained deviance of the 11 variable groups over 6 epochs; 241 logistic decoders on a 0.15
    mm grid, Gaussian targets (sigma 0.15 mm), Tensorflow, Adam (0.01), L2, leave-one-mouse-out;
    outputs divided by sampling density and normalized per neuron. The L2 strength is not given;
    the readings are the values of the GLM's lambda grid chosen by leave-one-mouse-out loss, and
    the grid's middle value 1e-3. For each area, the average decoded distribution over its
    neurons; the measure is the fraction of its mass inside the area's own territory divided
    by the fraction of decoder sites inside it. The paper shows Figure 6B as maps only and gives
    no measure; this ratio is a choice of this file. Reproduced when, under every reading, V1, A and
    RSC each have a higher ratio than both AM and MM.
- id: fig6d-three-gradients
  statement: Non-negative factorization of the decoded locations is dominated by three factors
    (reconstruction error 33.8% ± 3.1% with three, 55% with one), forming spatial gradients
    peaking in V1, RSC and A.
  source: Results, Single-neuron encoding profiles confirm functional gradients, paragraph 2;
    Figure 6D; Figure S6I; STAR Methods, Non-negative matrix factorization
  quote: Strikingly, these factors formed three distinct spatial gradients that dominated the
    anatomical organization of encoding with peaks in V1, RSC and A, respectively
  expected:
  - quantity: normalized reconstruction error, three factors
    value: 0.338
    tolerance: 0.031
  - quantity: normalized reconstruction error, one factor
    value: 0.55
    tolerance: 0.055
  depends_on:
  - fig6b-location-from-profiles
  criterion: scikit-learn NMF of the 42,998 by 241 prediction matrix for k = 1 to 10;
    reconstruction error is the Frobenius norm of the residual over that of the data. The
    tolerance for three factors is the reported bootstrap SEM. Reproduced when the errors are
    within tolerance, the improvement flattens from four factors (the gain from 3 to 4 is
    smaller than from 2 to 3), and the three factors' decoder scores peak inside V1, RSC and A,
    one each. NMF initialization is a standard choice (scikit-learn default).
- id: figs6g-factor-profiles
  statement: Cue weighs most in factor 1, maze position and choice in factor 2, and movement in
    factor 3.
  source: Results, Single-neuron encoding profiles confirm functional gradients, paragraph 2;
    Figure S6G
  quote: cue was greatest in factor 1, maze position and choice were greatest in factor 2, and
    movement was greatest in factor 3
  depends_on:
  - fig6d-three-gradients
  criterion: Each factor's profile is the score-weighted mean of the location decoders'
    coefficients (STAR Methods, Non-negative matrix factorization). Factors are numbered by
    their peak (V1, RSC, A). Reproduced when, across the three factors, cue's weight is highest
    in the V1 factor, position's and dynamic choice's in the RSC factor, and movement's in the
    A factor, in the stem epoch.
