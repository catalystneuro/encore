- id: fig7def-encoding-correlations
  statement: Correlations in single-neuron encoding strength between cue, dynamic choice and
    movement are similar across areas and close to zero; only A differs for cue against
    movement.
  source: Results, Conjunctive structure of encoding, paragraph 2; Figure 7D to 7F
  quote: Strikingly, the correlations in encoding between pairs of cue, choice, and movement
    variables were similar across areas, despite major differences in the encoding strengths of
    these variables between areas ... In addition, the correlation coefficients were close to zero
  statistics:
  - about: cue and dynamic choice, all area pairs
    test: bootstrap
    p: 0.05
    p_relation: ">"
  - about: cue and movement, A against each other area
    test: bootstrap
    p: 0.013
    p_relation: "<"
  - about: cue and movement, pairs among the other 5 areas
    test: bootstrap
    p: 0.05
    p_relation: ">"
  - about: dynamic choice and movement, all area pairs
    test: bootstrap
    p: 0.05
    p_relation: ">"
  depends_on:
  - well-fit-neurons
  criterion: STAR Methods, Correlation between encoding of pairs of variables. Fraction null
    deviance (re-fitting) in the stem, local spatial mean subtracted (smoothed map, SD 150 um),
