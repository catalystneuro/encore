# Claims for Tseng, Chettih, Arlt, Barroso-Luque & Harvey (2022), Neuron 110, 2484-2502, on
# dandiset 000579 ("Two-photon calcium imaging of mouse posterior cortical areas during dynamic
# navigation decisions (Tseng et al., 2022, Neuron)").
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the accepted author manuscript in PubMed Central (PMC9357051, NIHMS1810369), full
# text with Results, figure legends and STAR Methods, and its one supplement file (Figures S1 to
# S8 with legends), as stored in paper/10.1016-j.neuron.2022.05.012.txt. The version of record
# was not read. No main-text PDF was available, so Figures 1 to 8 were read from their legends
# and the Results only.
#
# Code read: github.com/sytseng/GLM_Tensorflow at commit 75a1314 (the repository behind the
# paper's Zenodo badge 491659726). It holds glm_core_functions.py only, the Tensorflow 1 GLM
# fitting functions (Poisson loss with group lasso or elastic net, cross-validated fits over a
# lambda series, deviance and model selection). It does not hold make_prior_matrix (the
# predictor grouping it calls), the design matrix, the analyses or the figures; the paper says
# the other code is shared on request. Where it is used below it is cited.
#
# Data the paper used, as it reports them.
# - Imaging and behavior. Eight male C57BL/6J mice, two-photon imaging of GCaMP6s through a
#   cranial window over left posterior cortex while running a virtual Y-maze with rule switches
#   (rule A black-left/white-right, rule B the reverse, blocks of 100 to 175 trials, 350 to 450
#   trials and 2 to 3 switches per session). Volumes at 30 Hz in four planes, 6 Hz per plane.
#   278,155 sources from 300 sessions; the neural analyses use 93,881 layer 2/3 neurons from
#   141 sessions with task performance above 65% correct. All behavioral sessions are used for
#   behavior; task performance figures use sessions above 0.5 correct (253 sessions) and the
#   later behavioral analyses sessions above 0.65 (216 sessions in the S1 and S2 legends).
#   Visually guided trials (0 to 20%) are excluded from all analyses. Measured variables are
#   treadmill pitch, roll and yaw velocity, maze position, cue, choice, outcome, trial epochs
#   (stem, arms, delay, feedback, reward/ITI), deconvolved activity of each neuron, and each
#   neuron's location in the Allen CCF and area label (V1, PM, AM, MM, RSC, A).
# - Photoinhibition. Seven male VGAT-ChR2-YFP mice, 164 sessions, bilateral light on PPC, RSC
#   (3 spots), S1 or a control site, in blocks of 50 trials, on a smaller maze with bar cues.
#   The dandiset's title names imaging only; whether it holds these sessions is for the author.
#
# Shared method, from the STAR Methods unless said otherwise; criteria below refer to it.
# - Strategy variables (rule belief, choice bias, probability of actual choice, rule- and
#   bias-following) come from a per-mouse LSTM (16 units, inputs current cue and previous
#   cue, choice, outcome and the visually guided arm), leave-one-session-out, Adam, batch 1,
#   learning rate 0.1, L2 0.0123. Dynamic choice (P left) and cue-biased running (P black) come
#   from a per-session LSTM (10 units) on the three velocities and forward position, 6-fold
#   cross-validation repeated 6 times and averaged, Adam, batch 100, learning rate 0.1, L2 0.1,
#   extended 5 s into the feedback period/ITI. Random seeds are a standard choice.
# - GLM. Poisson GLM on deconvolved activity, with the predictors of the Methods (27 task
#   variables on 20 position and 16 temporal raised-cosine bases, 336 movement predictors from
#   rank-transformed velocities and accelerations on 7-df b-splines, and drift terms), z-scored.
#   Fit with Adam (learning rate 0.001), Poisson loss and group lasso (the code's fit_glm_cv),
#   trials split 80% train and 20% test, 5-fold cross-validation on the training trials over 21
#   log-spaced lambda values from 1e-5 to 1e-1 (the code's default series, 30 values from 1e-1
#   to 1e-8, differs; the Methods are followed). Neurons with more than 10% of null deviance
#   explained by the drift terms are excluded. Well-fit neurons have test fraction deviance
#   explained above 0.2 (42,998 neurons).
# - Open in the GLM, named here once for every claim that uses it. (1) How lambda is chosen.
#   The Methods say the mean CV deviance is "compared across all lambda values to select the
#   optimal one", read as (a) the lambda of minimum mean CV deviance; the code's
#   select_model_cv takes (b) the largest lambda whose mean CV deviance is within se_fraction
#   standard errors of the minimum, with se_fraction not given, read as 1. Reading (a) is the
#   main one; (b) is run as a variant. (2) The grouping of predictors for the penalty is not in
#   the code; the Methods' rule (all basis functions of one variable form one group) is
#   followed. (3) Whether the drift exclusion is applied before or after the 93,881 count is
#   not said; both are shown where a count depends on it.
# - Encoding strength is the fraction explained deviance without re-fitting (Figure S3G),
#   computed on the CV held-out data in 36 trial-phase bins and normalized by the full model's
#   explained deviance. How an epoch's value is formed from the bins is not said; the readings
#   are the plain mean over the epoch's bins and the mean weighted by the frames in each bin. The stem
#   epoch is maze traversal before the Y-intersection (200 of 250 cm); whether the bins that
#   straddle the intersection count is not said, so the readings are bins wholly in the stem
#   and bins with their centre in the stem. Encoding correlations (Figure 7) use the fraction
#   null deviance with re-fitting (Figure S3H), as the Methods say.
# - Statistics. Hierarchical bootstrap, mice then neurons (or decoders, sessions, switches,
#   trials), 1,000 samples for neural and 10,000 for behavioral quantities; two-tailed p as
#   twice the smaller tail; Benjamini-Hochberg at FDR 0.05 where several tests are run at once.
#   "p < 10-3" from 1,000 samples means no bootstrap sample crossed zero.
