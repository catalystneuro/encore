- id: fig1d-switch-performance
  statement: Performance is high before a rule switch, typically falls below chance after it,
    and recovers gradually to high accuracy by the end of the block.
  source: Results, Mice learned flexible cue-choice associations, paragraph 2; Figure 1D;
    Figure S1B
  quote: Their behavioral performance was high before rule switches and typically dropped below
    chance after switches before gradually recovering to high accuracy by the end of a block,
    without signs of anticipating rule switches
  criterion: From the STAR Methods, Task performance analysis, on sessions with overall
    fraction correct above 0.5 and visually guided trials excluded. Each block's outcomes are
    fit with the sigmoid of the Methods (reward rate as L over one plus exp of minus (t - t0)
    over k, plus b) by minimizing cross-entropy; initial and end performance are the fitted
    values at the first and last trial. The parameter constraints are not given; a standard
    choice (L and b keeping the rate within 0 to 1, k positive) is used, which should not change
    the outcome. Reproduced when, over switches (hierarchical bootstrap, mice then switches),
    the mean fitted initial performance after a switch is below 0.5 and the mean fitted end
    performance is above 0.7 (the Methods' bound for a recovered switch) and above the initial
    performance (two-tailed p < 0.05).
    Partially reproduced when the fall and recovery hold but the initial value is not below
    0.5.
- id: lstm-choice-accuracy
  statement: The strategy LSTM predicts the mouse's choices in held-out sessions with 80.2% ±
    5.1% accuracy (mean ± SD).
  source: Results, Decision-making strategy varied, paragraph 1; STAR Methods, LSTM model
  quote: The LSTM accurately predicted a mouse's choices in held-out sessions (80.2% ± 5.1%, mean
    ± SD)
  expected:
  - quantity: held-out choice prediction accuracy, mean
    value: 0.802
    tolerance: 0.051
  criterion: The LSTM of the STAR Methods (16 units, leave-one-session-out per mouse), with its
    stated hyperparameters. How accuracy is scored is not said; the standard reading is used, a
    choice predicted correct when the model's probability for the actual cue gives more than 0.5
    to the actual choice. The tolerance is the reported SD, the
    paper's stated spread. Open, with readings run in turn. (a) The SD is over sessions or (b)
    over mice; (c) sessions are all behavioral sessions or (d) those above 0.65 correct, which
    the Methods use for the later analyses. Reproduced when the mean is within tolerance under
    any reading.
- id: figs1h-lstm-beats-rl
  statement: The LSTM predicts choices better (higher log likelihood) than the best
    reinforcement learning model (model 4, separate learning rates for rewarded and unrewarded
    trials).
  source: Figure S1H
  quote: Log likelihood of the LSTM was greater than the RL model (p = 5.95 × 10-22, Wilcoxon
    signed rank test)
  statistics:
  - test: Wilcoxon signed rank test
    p: 5.95e-22
    n: 216 sessions
  criterion: Session-averaged held-out log likelihood (log base 2) of the LSTM and of RL model
    4 of the STAR Methods (Q learning with decay, separate learning rates for rewarded and
    unrewarded trials, choice perseverance, bias and lapse), both leave-one-session-out per
    mouse, on the 216 sessions. Reproduced when the LSTM is higher with a Wilcoxon signed-rank p
    < 0.05. The form of the lapse term is garbled in the text; the standard mixture (one minus
    lambda times the softmax plus lambda over two) is used.
- id: fig1i-strategy-after-switch
  statement: Before a switch mice show little choice bias and follow the rule; after a switch
    the probability of the actual choice falls near chance, bias-following rises moderately, and
    rule-following then recovers gradually.
  source: Results, Decision-making strategy varied, paragraph 2; Figure 1I
  quote: On average, prior to a rule switch, mice performed with little choice bias and followed
    the correct rule ... After a rule switch, the randomness of choices increased rapidly, as seen
    by near chance levels of the model's probability of the actual choice, and bias-following
    increased moderately. Then, rule-following recovered gradually for the new rule belief
  criterion: Strategy variables from the LSTM (shared method), aligned to switches, on the 265
    switches of Figure 1I (switches with end performance above 70%, sessions above 0.65
    correct). The windows are not given; the readings are the 10 and the 20 trials before and
    after the switch (20 is the window the Methods use for trajectory correlation). Reproduced
    when, under every reading, (1) rule-following before the switch is above zero, (2)
    probability of actual choice in the first window after the switch is lower than before and
    within 0.1 of 0.5 at its minimum, (3) bias-following after is higher than before, and (4)
    rule-following after the first window rises toward its pre-switch level by the end of the
    block; each comparison by hierarchical bootstrap (mice then switches), two-tailed p < 0.05.
    The 0.1 margin for near chance is a choice of this file, as the paper gives none; the
    value is reported.
- id: visually-guided-rule-update
  statement: Visually guided trials do not update rule belief more than normal trials in the
    30 trials after a switch (0.013 ± 0.0055 against 0.0080 ± 0.0023; p = 0.34).
  source: STAR Methods, Decision-making strategy variables, last paragraph
  quote: The rule update per trial was 0.013 ± 0.0055 for visually guided trials and 0.0080 ±
    0.0023 for normal trials (difference = 0.0052 ± 0.0057, p = 0.34, hierarchical bootstrap mean
    ± SEM, n = 265 switches)
  statistics:
  - about: visually guided against normal trials, all trials
    test: hierarchical bootstrap
    p: 0.34
    n: 265 switches
  - about: visually guided against normal trials, correct trials only
    test: hierarchical bootstrap
    p: 0.89
    n: 265 switches
  expected:
  - quantity: rule update per trial, visually guided
    value: 0.013
    tolerance: 0.0055
  - quantity: rule update per trial, normal
    value: 0.008
    tolerance: 0.0023
  criterion: Delta rule belief per trial toward the current rule (signed so that positive is
    toward the new rule), averaged over the 30 trials after each switch, compared by
    hierarchical bootstrap (mice then switches), two-tailed. A claim of absence. Reproduced when
    p >= 0.05, as the paper's test found; not reproduced when p < 0.05. The difference is
    reported either way. Tolerances are the reported SEMs.
- id: fig1l-photoinhibition-performance
  statement: Inhibiting RSC or PPC lowers task performance compared with control trials and
    with S1 inhibition; the RSC against PPC difference is not significant (p = 0.058).
  source: Results, Photoinhibition of posterior cortical areas, paragraph 1; Figure 1L
  quote: Inhibiting either RSC or PPC led to markedly lower task performance compared to control
    trials or trials in which part of primary somatosensory cortex (S1) was inhibited
  statistics:
  - about: control against RSC or PPC
    test: hierarchical bootstrap
    p: 0.0001
    p_relation: "<"
    n: 164 sessions from 7 mice
  - about: control against S1
    test: hierarchical bootstrap
    p: 0.0002
    n: 164 sessions from 7 mice
  - about: S1 against RSC or PPC
    test: hierarchical bootstrap
    p: 0.0001
    p_relation: "<"
    n: 164 sessions from 7 mice
  - about: RSC against PPC
    test: hierarchical bootstrap
    p: 0.058
    n: 164 sessions from 7 mice
  criterion: STAR Methods, Analysis of photoinhibition experiments. Fraction correct on target
    trials against control trials within session, by the modified hierarchical bootstrap
    (10,000 samples of session means, mice then sessions, averaged within mouse then across
    mice). Reproduced when RSC and PPC are each below control and below S1 with two-tailed p <
    0.05. The RSC against PPC difference is reported.
- id: fig1m-rule-following-decrease
  statement: Inhibition of PPC and RSC decreases rule-following compared with control trials
    and with S1 inhibition; bias-following increases, strongly in a subset of mice.
  source: Results, Photoinhibition of posterior cortical areas, paragraph 2; Figure 1M; Figure
    S1K
  quote: PPC and RSC inhibition decreased rule-following compared to control trials and S1
    inhibition
  statistics:
  - about: rule-following, each target against control
    test: hierarchical bootstrap
    p: 0.0001
    p_relation: "<"
    n: 164 sessions from 7 mice
  - about: rule-following, RSC and PPC against S1
    test: hierarchical bootstrap
    p: 0.0001
    p_relation: "<"
    n: 164 sessions from 7 mice
  - about: bias-following, S1 against control
    test: hierarchical bootstrap
    p: 0.025
    n: 164 sessions from 7 mice
  - about: bias-following, RSC against control
    test: hierarchical bootstrap
    p: 0.018
    n: 164 sessions from 7 mice
  - about: bias-following, PPC against control
    test: hierarchical bootstrap
    p: 0.0001
    p_relation: "<"
    n: 164 sessions from 7 mice
  criterion: The strategy LSTM with one input per inhibition target (STAR Methods, LSTM model),
    target trials against control trials within session by the modified hierarchical bootstrap
    of the photoinhibition Methods. Reproduced when rule-following is lower than control for
    RSC and PPC and lower than for S1, each with two-tailed p < 0.05. Bias-following changes
    are reported, with the number of mice whose increase exceeds 0.2 (the paper finds 3 for RSC
    and 1 for PPC).
- id: figs1m-rule-bias-uncorrelated
  statement: Across sessions, the change in rule-following under RSC or PPC inhibition is not
    correlated with the change in bias-following.
  source: Figure S1M
  quote: Pearson correlation 0.18 (p = 0.10 vs. zero) for RSC and -0.03 (p = 0.74) for PPC
  statistics:
  - about: RSC
    test: Pearson correlation against zero
    statistic: r = 0.18
    p: 0.1
    n: 164 sessions from 7 mice
  - about: PPC
    test: Pearson correlation against zero
    statistic: r = -0.03
    p: 0.74
    n: 164 sessions from 7 mice
  depends_on:
  - fig1m-rule-following-decrease
  criterion: Per session, target minus control for rule-following and for bias-following; the
    Pearson correlation across sessions tested against zero. A claim of absence. Reproduced
    when p >= 0.05 for both RSC and PPC; not reproduced when either is p < 0.05. The r values
    are reported.
- id: fig2c-running-variability-after-switch
  statement: Running trajectories of choice-matched trials become less correlated with one
    another after a rule switch.
  source: Results, Running trajectories reflected the within-trial dynamics, paragraph 1;
    Figure 2C
  quote: This variability in running trajectories increased following a rule switch
  criterion: STAR Methods, Running trajectory correlation analysis. Velocities binned on a grid
    of maze positions, Pearson correlation of each pair of choice-matched trials averaged over
    the three velocities, each trial's mean against the session's mean over all choice-matched
    pairs, aligned to switches; mean over the 20 trials before against the 20 trials after.
    The position grid is not given; the readings are 20 and 11 equal bins of the maze (the
    counts the paper uses for its position bases and decoders). Reproduced when, under both,
    Delta trajectory correlation is lower after than before with a hierarchical bootstrap
    (mice then switches, 10,000 samples) two-tailed p < 0.05; the paper reports no test, and
    this is its default.
- id: fig2f-latency-strategy
  statement: Dynamic choice crosses threshold sooner on trials with higher rule-following or
    bias-following.
  source: Results, Running trajectories reflected the within-trial dynamics, paragraph 3;
    Figure 2F
  quote: As expected, the latency to dynamic choice crossing a threshold was shorter on trials
    with higher rule- or bias-following
  expected:
  - quantity: session-averaged trial duration, mean
    value: 8.95
    tolerance: 2.04
    unit: s
  criterion: Latency is the time from trial onset at which dynamic choice reaches 0.9 on left
    trials or 0.1 on right trials, divided by the session's mean trial duration (STAR Methods,
    Modeling of dynamic choice); n = 85,463 trials in the paper. The strategy bins of the
    figure are not given in the text; the readings are 5 and 10 quantile bins of each strategy
    variable, and the Spearman correlation over trials. Reproduced when latency falls with
    rule-following and with bias-following under every reading (Spearman rho below zero, and
    the highest bin shorter than the lowest by hierarchical bootstrap, mice then trials,
    two-tailed p < 0.05). The duration tolerance is the reported SD.
- id: fig2g-choice-commitment
  statement: With high rule-following, choice commitment starts near chance and rises during
    the maze; with low rule-following it stays low until late; with high bias-following it is
    high from trial onset.
  source: Results, Running trajectories reflected the within-trial dynamics, paragraph 3;
    Figure 2G; Figure S2L
  quote: On trials with high rule-following, choice commitment started near chance but increased
    rapidly during maze traversal ... when rule-following was low, choice commitment was low until
    late in the trial ... when mice followed a bias, choice commitment was high at trial onset
  criterion: Choice commitment is the log likelihood (base 2) of the reported choice under
    dynamic choice at each position (STAR Methods, Modeling of dynamic choice). Tested as in
    Figure S2L (its Methods are in the legend). Per session, choice commitment at each maze
    position bin is regressed on rule-following, bias-following and local reward rate (fraction
    correct over the adjacent 9 trials); coefficients are averaged by hierarchical bootstrap
    over 216 sessions. Reproduced when the bias-following coefficient is above zero in the
    first position bin and the rule-following coefficient is near zero there (two-tailed p >=
    0.05 against zero, or smaller than a tenth of the bias coefficient; the paper says only
    "near zero", and the tenth is a bound this file sets), and the rule-following coefficient in the
    last stem bin is above zero and above its first-bin value (p < 0.05). The number of position
    bins is not given; 11 equal bins (the paper's decoder bins) and 20 are both run.
- id: cue-biased-running-uncorrelated
  statement: Cue-biased running varies across mice and sessions and is not correlated with task
    performance or with the time course of dynamic choice.
  source: Results, Running trajectories reflected the within-trial dynamics, paragraph 2;
    Figure S2H, S2I, S2K
  quote: this behavior was variable across mice and sessions and was uncorrelated with task
    performance and the time course of dynamic choice
  criterion: Strength of cue-biased running is the session-averaged log likelihood of the cue
    under cue-biased running (STAR Methods, Modeling of dynamic choice). The paper reports no
    test; Figure S2I shows per-mouse regression lines. A claim of absence, with the readings
    (a) Pearson correlation of session cue decoding against session fraction correct, pooled
    over sessions, and (b) the per-mouse regression slopes tested against zero across mice.
    Reproduced when neither finds a correlation at p < 0.05; mixed results are reported as such.
    The sign of the roll-velocity coefficient of the logistic cue decoder (first 25% of the
    stem, 10-fold) is reported per session to show the variation of Figure S2K. The part on
    the time course of dynamic choice is shown only in Figure S2G (choice decoding over the maze
    in 7 quantile bins of cue decoding strength, 216 sessions), with no test or measure; those
    curves are reported and that part is not judged.
