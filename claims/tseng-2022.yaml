    area), strong in AM and PM, weaker in RSC and weakest in A (lower than every other area).
  source: Results, Distinct encoding gradients, paragraph 2; Figure 3O; Figure S4K
  quote: Encoding of the visual cue identity was strongest in V1 and neighboring areas AM and PM,
    weaker in RSC, and weakest in area A
  statistics:
  - about: V1 higher than every other area
    test: hierarchical bootstrap
    p: 0.001
    p_relation: "<"
  - about: A lower than every other area
    test: hierarchical bootstrap
    p: 0.001
    p_relation: "<"
  depends_on:
  - well-fit-neurons
  criterion: Encoding strength of cue in the stem epoch per well-fit neuron, area means by
    hierarchical bootstrap. Reproduced when V1 is above and A below every other area (two-tailed
    p < 0.05, Benjamini-Hochberg over pairs), and the means of AM and PM exceed that of RSC.
- id: fig3q-cue-decoding
  statement: Cue decoded from populations of about 100 nearby neurons follows the same
    gradient as single-neuron cue encoding.
  source: Results, Distinct encoding gradients, paragraph 2; Figure 3Q
  quote: which was corroborated with decoding of these variables from the activity of ~100
    simultaneously recorded neurons
  criterion: STAR Methods, Trial phase-specific logistic decoders. Simultaneously imaged
    neurons split into spatially adjacent, non-overlapping groups of about 100 (all layer 2/3
    neurons, no fit selection), PCA to 90% variance, logistic regression with elastic net (10%
    L1) in 11 position bins with 5-fold CV, performance as log likelihood (base 2); 974 decoders
    in the paper. How the elastic net strength is chosen is not said; the readings are the
    lambda of minimum CV deviance and the one-SE lambda (the two that MATLAB lassoglm returns).
    How groups of about 100 are formed is not said; the readings are k-means on neuron
    positions with k equal to the session's neurons over 100, and a grid of equal-count
    tiles. Which of the 11 position bins enter a decoder's value in Figure 3Q is not said; the
    readings are the bins in the stem and all 11 bins. Reproduced when, under every reading, the
    decoder means per area (by centroid) rank
    V1 highest and A lowest, with V1 above A at two-tailed p < 0.05 (hierarchical bootstrap,
    mice then decoders).
- id: figs4l-strategy-distributed
  statement: Encoding of decision-making strategy variables, with their interactions, is
    moderate and does not differ between areas, except AM against A.
  source: Results, Distinct encoding gradients, paragraph 3; Figure 3R; Figure S4L
  quote: Variables related to the decision-making strategy, including their interactions with
    other task variables, collectively exhibited a moderate encoding strength distributed evenly
    across posterior cortex
  statistics:
  - about: all area pairs except AM against A
    test: hierarchical bootstrap
    p: 0.03
    p_relation: ">"
    corrected: Benjamini-Hochberg (not significant after correction)
  - about: AM against A
    test: hierarchical bootstrap
    p: 0.001
    p_relation: "<"
  depends_on:
  - well-fit-neurons
  criterion: Encoding strength of the group of all strategy variables and their interactions
    over the full trial, area means by hierarchical bootstrap, two-tailed tests for the 15 area
    pairs with Benjamini-Hochberg at FDR 0.05, as the legend states. A claim of absence for 14
    pairs. Reproduced when no pair other than AM against A is significant after correction;
    not reproduced when any other pair is. The AM against A result and all differences are
    reported.
- id: figs4p-previous-outcome
  statement: The previous trial's outcome is encoded much more strongly than its cue or choice,
    and evenly over space.
  source: Results, Distinct encoding gradients, paragraph 3; Figure S4P to S4S
  quote: The previous trial's outcome was much more strongly encoded than the previous trial's
    cue or choice
  depends_on:
  - well-fit-neurons
  criterion: Encoding strength of previous outcome, previous cue and previous choice in the
    stem epoch per well-fit neuron. The paper reports no test. Reproduced when the mean over all
    well-fit neurons of previous outcome exceeds both others with hierarchical bootstrap
    two-tailed p < 0.05 (the Methods' default test); the paper's sentence is about posterior
    cortex as a whole, so the same comparison per area is reported, not judged. Evenness is reported as the area means;
    it is not judged, as the paper gives no test for it.
- id: fig4b-dynamic-choice-stem
  statement: During stem traversal, dynamic choice is encoded more than reported choice in all
    areas, most in RSC (above V1, PM and A, not different from AM and MM), while reported choice
    encoding is not above zero.
  source: Results, Encoding of dynamic choice was enriched in RSC, paragraph 1; Figure 4A, 4B
  quote: during traversal of the maze stem, encoding of dynamic choice was distributed across all
    areas but enriched in RSC and adjacent medial areas, accounting for a substantial amount of
    neural activity compared to near-zero encoding of reported choice
  statistics:
  - about: dynamic against reported choice, each area
    test: hierarchical bootstrap
    p: 0.001
    p_relation: "<"
  - about: dynamic choice, RSC against V1, PM or A
    test: hierarchical bootstrap
    p: 0.001
    p_relation: "<"
  - about: dynamic choice, RSC against AM or MM
    test: hierarchical bootstrap
    p: 0.05
    p_relation: ">"
  - about: reported choice, each area against zero
    test: hierarchical bootstrap
    p: 0.05
    p_relation: ">"
  depends_on:
  - well-fit-neurons
  criterion: Encoding strength of dynamic choice and of reported choice in the stem epoch, area
    means by hierarchical bootstrap. Reproduced when (1) dynamic exceeds reported in all six
    areas, (2) RSC exceeds V1, PM and A, each two-tailed p < 0.05 after Benjamini-Hochberg, and
    (3) reported choice is not above zero in any area at p < 0.05 (a claim of absence, on the
    paper's bootstrap test). RSC against AM and MM is reported.
- id: fig4c-reported-choice-feedback
  statement: In the feedback period/ITI, reported choice is encoded more than dynamic choice in
    all areas, and RSC encodes reported choice more than every other area.
  source: Results, Encoding of dynamic choice was enriched in RSC, paragraph 1; Figure 4C
  quote: In contrast, during the feedback and ITI periods, we observed greater encoding of
    reported choice than dynamic choice
  statistics:
  - about: reported against dynamic choice, each area
    test: hierarchical bootstrap
    p: 0.001
    p_relation: "<"
  - about: reported choice, RSC against each other area
    test: hierarchical bootstrap
    p: 0.05
    p_relation: "<"
  depends_on:
  - well-fit-neurons
  criterion: Encoding strength in the feedback period/ITI epoch (the 16 temporal bins after the
    maze end), area means by hierarchical bootstrap. Reproduced when reported exceeds dynamic in
    all six areas and RSC exceeds each other area for reported choice, two-tailed p < 0.05 after
    Benjamini-Hochberg.
- id: fig4d-partial-correlation
  statement: Population decoders trained on reported choice are more related to dynamic choice
    (partial correlation 0.35 ± 0.02) than to reported choice (0.14 ± 0.02), a difference of
    0.21 ± 0.02.
  source: Results, Encoding of dynamic choice was enriched in RSC, paragraph 2; Figure 4D
  quote: Partial correlations were greater for dynamic choice than reported choice, revealing
    that even decoders trained to predict reported choice were more closely related to dynamic
    choice
  statistics:
  - about: difference of the two partial correlations against zero
    test: bootstrap
    p: 0.001
    p_relation: "<"
    n: 974 decoders
  expected:
  - quantity: partial Spearman correlation of decoded reported choice with dynamic choice, given
      reported choice
    value: 0.35
    tolerance: 0.02
  - quantity: partial Spearman correlation of decoded reported choice with reported choice, given
      dynamic choice
    value: 0.14
    tolerance: 0.02
  - quantity: difference
    value: 0.21
    tolerance: 0.02
  depends_on:
  - fig3q-cue-decoding
  criterion: Reported-choice decoders as in fig3q-cue-decoding (same decoder readings), stem
    traversal frames, held-out predictions; partial Spearman correlations per decoder;
    bootstrap over decoders (hierarchical, mice then decoders). Tolerances are the reported
    SEMs. Reproduced when the difference is above zero with p < 0.05 and the three values are
    within tolerance under a reading; partially reproduced when only the sign and test hold.
- id: figs5f-dynamic-choice-decoding
  statement: From populations of about 100 neurons, dynamic choice is decoded better (Spearman
    0.59 ± 0.02) than reported choice (0.26 ± 0.02), both above chance.
  source: Figure S5F
  quote: Decoding of both dynamic and reported choice was above chance (p < 10-3, bootstrap), but
    decoding of reported choice was less accurate than dynamic choice
  statistics:
  - about: each decoder type against chance
    test: bootstrap
    p: 0.001
    p_relation: "<"
    n: 974 decoders
  - about: dynamic minus reported choice decoding
    test: bootstrap
    p: 0.001
    p_relation: "<"
    n: 974 decoders
  expected:
  - quantity: dynamic choice decoding, Spearman correlation
    value: 0.59
    tolerance: 0.02
  - quantity: reported choice decoding, Spearman correlation
    value: 0.26
    tolerance: 0.02
  - quantity: difference
    value: 0.33
    tolerance: 0.13
