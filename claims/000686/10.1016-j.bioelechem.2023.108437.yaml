    three. Partially reproduced when the ordering holds but the ratio is outside tolerance. Both of
    the other ratios are reported against 3.6 to 5.5.
- id: fig5a-trains-stronger
  statement: Without rotation, the control of 40 unipolar trains from e1 causes much stronger
    electroporation throughout the array than 40 Packet 2 packets started from e1. The uptake
    after trains follows the field strength distribution and falls with distance from e1.
  source: Results 3.2, paragraph 1; Figure 5A
  quote: The lack of cancellation caused a much stronger electroporation throughout the array, and
    the distribution of YP uptake expectedly followed the electric field strength distribution in
    Fig. 3C .
  criterion: YP intensity along the e1 to e3 diagonal (Fig. 5A legend), Packet 2 at 6.4 kV, 40
    packets against 40 trains, n = 4 to 5 dishes. Measured at three places the text names, the e1
    end (outermost ROI), the center (O1) and the e3 end, each under O4 (a) and (b). Reproduced when
    the train mean exceeds the packet mean at all three places with unpaired two-sided t-tests at
    p < 0.05 (Methods 2.4), and the train profile falls with distance from e1 as the field does
    (Results 3.2), read as the e1-end value above the center value by the same test. The paper
    gives no test of the profile's shape, so the full train profile is shown. The outcome is the one all readings give; otherwise methods_underspecified.
- id: fig5a-packet-center-enhanced
  statement: Without rotation, Packet 2 enhances electroporation in the center of the array despite
    the weakening of the field with distance from e1. Uptake near e1 still stays stronger than in
    the center.
  source: Results 3.2, paragraph 1; Figure 5A
  quote: In contrast, Packet 2 enhanced electroporation in the center of the array, despite gradual
    weakening of the electric field with distance from e1. However, the bipolar cancellation only
    partially offset the electric field weakening, and electroporation near e1 remained stronger than
    in the center.
  criterion: The 40-packet profile along the e1 to e3 diagonal (Fig. 5A). "Enhanced in the center"
    is read as a central peak, the center value (O1) above the lowest value between the center and
    the e1 end. Reproduced when, under all readings of O1 and O4, the center exceeds that trough and
    the e1-end value exceeds the center, each by a two-sided t-test at p < 0.05 over dishes (Methods
    2.4; paired and unpaired, O6). When readings differ, methods_underspecified.
- id: fig5b-rotation-center-peak
  statement: With rotation (1P x 40), Packet 2 smears the effect at the perimeter and brings out a
    remote effect in the center. The same rotation of unipolar trains (1T x 40) leaves a void of
    electroporation in the center.
  source: Results 3.2, paragraph 2; Figure 5B
  quote: Rotation with Packet 2 “smeared” the electroporation effect at the perimeter and emphasized
    the remote effect in the center. This remote effect contrasted with a void of electroporation in
    the center when the pulse train was applied in the same manner instead of the packet.
  criterion: Profiles averaged across both diagonals (Fig. 5B legend), n = 4 to 5. Reproduced when,
    under all readings of O1, O2 and O4, the 1P x 40 center value exceeds its lowest value between
    center and periphery, and the 1T x 40 center value is below its most peripheral value. The
    paper gives no measure of a "void", so whether the 1T x 40 center is the lowest point of its
    profile is reported but not required. Each comparison uses a two-sided
    t-test at p < 0.05 (Methods 2.4, O6).
