    of the small array and 0.8 kV/cm in the center of the large array. The field near the energized
    electrode is about 4-fold higher (7 and 3.5 kV/cm per kV). Energizing one diagonal gives no
    field in the center.
  source: Methods 2.3, paragraph 4; Figure 3
  quote: For example, applying 1 kV to one electrode produced the electric field of approximately
    1.8 kV/cm and 0.8 kV/cm in center of the small and large arrays ... The electric field strength
    was about 4-fold higher near the energized electrode (7 kV/cm and 3.5 kV/cm per 1 kV applied, for
    the small and large arrays, respectively) Note that energizing either electrode diagonal produced
    no electric field in the center of the array
  expected:
  - quantity: center field, small array, 1 kV on one electrode
    value: 1.8
    tolerance: 0.18
    unit: kV/cm
  - quantity: center field, large array, 1 kV on one electrode
    value: 0.8
    tolerance: 0.08
    unit: kV/cm
  - quantity: field near the energized electrode, small array, per kV
    value: 7
    tolerance: 0.7
    unit: kV/cm
  - quantity: field near the energized electrode, large array, per kV
    value: 3.5
    tolerance: 0.35
    unit: kV/cm
  criterion: The values are outputs of the paper's Sim4Life finite-element model (Methods 2.3, built
    as in the paper's reference 15). The paper names no public deposit of the model or its field
    maps. The claim is tested only if the dataset holds the simulated field maps. Then reproduced
    when the four values are within tolerance and the center field for diagonal energizing is zero.
    A field model built by the author is not the paper's and is not a test. Without the maps the
    claim is blocked as data_missing.
- id: fig4-sham-no-uptake
  statement: Sham-exposed cells gain no YP fluorescence over the 10 min of imaging. Cells given
    pulses show a gradual rise in YP signal from the first frame after exposure.
  source: Results 3.1, paragraph 2; Figure 4
  quote: Sham-exposed cells showed no gain in YP fluorescence during the 10 min of observation. In
    contrast, cells treated by electric pulses displayed gradual increase in YP signal, starting from
    the image frame taken immediately after nsEP exposure.
  criterion: Per cell F minus F0, where F0 is the mean of the six frames before the pulse at 57 s
    (Methods 2.2). A claim of absence for sham, judged with the paper's test (Methods 2.4, a
    two-sided Student's t-test at p < 0.05), here one-sample against zero at the end of recording
    (O7, both readings). Reproduced when sham F minus F0 does not differ from zero, and every pulsed
    group's mean exceeds sham at the first frame after 57 s and keeps rising (end value above the
    first-frame value). The sham effect size is given either way.
- id: fig4-unipolar-uptake
  statement: A single 600-ns pulse at 15 kV/cm gives the strongest YP uptake, 126 +/- 14 a.u.
    (n = 25 cells) by the end of recording.
  source: Results 3.1, paragraph 2; Figure 4
  quote: A single 600-ns pulse at 15 kV/cm caused by far the strongest YP uptake, reaching 126±14
    a.u. (n=25) by the end of recording.
  expected:
  - quantity: unipolar pulse, F minus F0 at end of recording, mean over cells
    value: 126
    tolerance: 14
    unit: a.u.
  criterion: Tolerance is the paper's s.e. F minus F0 per cell (Methods 2.2), mean over cells, at
    the end of recording under either reading of O7. Reproduced when the mean is within tolerance
    under one reading, the group has 25 cells (n is checked as reported), and the mean exceeds each
    other group's.
- id: fig4-bipolar-weaker
  statement: Bipolar signals that start with the same pulse cause much weaker uptake (p < 0.001).
    By the end of recording the 4-phasic signal reaches 20.8 +/- 2.0 a.u., the 8-phasic 6.9 +/- 1.6
    a.u., and the 8-phasic with 5-us delays 25.4 +/- 2.8 a.u.
  source: Results 3.1, paragraph 2; Figure 4
  quote: Bipolar signals started with exactly the same pulse (600 ns, 15 kV/cm) but caused
    significantly weaker effects (p<0.001). By the end of recording, YP signal reached only 20.8±2.0
    a.u. for the 4-phasic signal; 6.9±1.6 a.u. for the 8-phasic signal; and 25.4±2.8 a.u. for the
    8-phasic signal with 5-μs delays between phases.
  statistics:
  - about: each bipolar signal against the single unipolar pulse
    test: two-sided Student's t-test (the test named in Methods 2.4)
    p: 0.001
    p_relation: "<"
    n: 21 to 30 cells per group
  expected:
  - quantity: 4-phasic, F minus F0 at end of recording
    value: 20.8
    tolerance: 2.0
    unit: a.u.
  - quantity: 8-phasic, F minus F0 at end of recording
    value: 6.9
    tolerance: 1.6
    unit: a.u.
  - quantity: 8-phasic with 5-us delays, F minus F0 at end of recording
    value: 25.4
    tolerance: 2.8
    unit: a.u.
  criterion: Tolerances are the paper's s.e. Per cell F minus F0 at the end of recording (O7, both
    readings). Each bipolar group is compared with the unipolar group by an unpaired two-sided
    Student's t-test (Methods 2.4), in its equal-variance form, which is what Student's t-test
    names. The Welch form is shown as a variant only. Reproduced when, under one reading, all three
    means are within tolerance and all three tests give p < 0.001.
- id: fig4-8phase-cancellation
  statement: The 8-phasic signal with no delays causes about 20-fold weaker electroporation than a
    single unipolar pulse. The 4-phasic signal and the delayed 8-phasic signal cancel 4 to 5-fold.
  source: Figure 4 legend; Results 3.1, paragraph 2; Results 3.4, paragraph 1
  quote: Note that applying the 8-phasic bipolar signal with no inter-phase delays caused about
    20-fold weaker electroporation than a single unipolar pulse
  depends_on:
  - fig4-unipolar-uptake
  - fig4-bipolar-weaker
  expected:
  - quantity: unipolar over 8-phasic F minus F0 at end of recording
    value: 20
    tolerance: 2
  - quantity: unipolar over 4-phasic, and over delayed 8-phasic, F minus F0 at end of recording
    value: 4.55
    tolerance: 0.95
  criterion: Ratio of group means at the end of recording (O7, both readings). For the "4-5-fold" of
    Results 3.4 the range widened by 10% of each bound is 3.6 to 5.5. The paper's own means give
    18.3 for the 8-phasic signal, 6.1 for the 4-phasic and 5.0 for the delayed 8-phasic. So the
    4-phasic ratio printed in Results 3.1 already falls outside the 4 to 5 range. The main test is
    therefore the 8-phasic ratio, plus the ordering of cancellation (8-phasic strongest, the other
