# Claims for Pakhomov, Gudvangen, Mangalanathan, Kondratiev, Redondo & Semenov (2023),
# "Next generation CANCAN focusing for remote stimulation by nanosecond electric pulses",
# Bioelectrochemistry 152, 108437, on dandiset 000686.
#
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the accepted author manuscript in PubMed Central (PMC10247516, NIHMS1891360), as
# served by ncbi_pmc, full text with Methods (sections 2.1 to 2.4), Results, Discussion and
# figure legends. The version of record was not read. PMC lists no supplement and the text cites
# none. The paper links no code, so no repository was read. Every method detail below comes from
# the Methods or the figure legends.
#
# Data the paper used (as the paper reports it). All experiments are in CHO-K1 cells (Chinese
# hamster ovary). The archive's metadata names the species as Bos taurus, which does not match
# the paper. Electroporation is measured by YO-PRO-1 (YP) dye uptake.
# - Individual cells (Fig. 4, Sections 2.2 and 3.1). Cells on glass coverslips, YP 1 uM, confocal
#   images (40x) every 10 s for 600 s, pulses at 57 s. Two tungsten electrodes (140 um gap, 50 um
#   above the coverslip) driven from two EPULSUS-FPM4-7 channels. Five groups, 21 to 30 cells
#   each. Sham; a single 600-ns unipolar pulse at 15 kV/cm; and three bipolar signals that start
#   with the same pulse and lose 1/8 of the first amplitude per phase (4 phases; 8 phases; 8
#   phases with 5-us delays). Measure, per cell, mean ROI intensity F minus F0, where F0 is the
#   mean of the six images before the pulses.
# - Cell monolayers (Figs. 5 to 9, Sections 2.3, 2.4 and 3.2 to 3.5). 35-mm glass-bottom dishes,
#   one dish per experiment. A quadrupole array of four 1.5-mm needles (e1 to e4), small or large
#   (about 2-fold apart; the large has an 8.4-mm diagonal), touching the glass, or 1 to 3 mm above
#   it (Fig. 9). Packets 1, 2 and 3 of 600-ns unipolar pulses (Fig. 2B to D). Packets are given at
#   1 Hz, with or without rotation of the first-energized electrode. "nPx4" means n packets from
#   each electrode in turn; "1Px40" means one packet rotated 40 times. The control "trains" energize
#   e1 alone with the same pulses. YP 1 uM for 10 min, then a 10x stitched image of the region
#   between the electrodes. Fluorescence is measured in 92 or 224 ROIs along one or both diagonals,
#   over +/- 1.65 mm (small array) or +/- 3.65 mm (large array) from the array center. Areas within
#   5% of the diagonal length of an electrode are left out. Values are in a.u. or in % of the most
#   peripheral ROI (the one closest to an electrode). Mean +/- s.e. over 3 to 5 independent
#   experiments (dishes), with LOESS fits.
#   Conditions per figure. Fig. 5 is Packet 2 at 6.4 kV, 40 packets against 40 trains, without
#   rotation (A) or with it (B, C), large array (the text compares it with Fig. 3C), n = 4 to 5.
#   Fig. 6 is Packet 2 as 1Px4, 5Px4 and 10Px4, n = 3 to 4. Fig. 7 is Packet 2 at several
#   first-pulse voltages from 2.4 to 5.6 kV, 1Px4 in the small array (A, B) and 10Px4 in the large
#   array (C, D), n = 3. Fig. 8 is Packets 1, 2 and 3 at 4 kV, 1Px4, n = 3 to 4. Fig. 9 is
#   Packet 2, 10Px4, 6.4 kV, large array at 0, 1, 2 and 3 mm above the monolayer, n = 3 to 4.
# - Electric field simulations (Fig. 3) in Sim4Life. These are model outputs, not recordings.
#
# The dandiset's title matches the legend of Fig. 5 ("Focusing electroporation to the center of a
# quadrupole electrode array by interference of unipolar pulses"). Which of the other experiments
# it holds is for the author to find.
#
# Statistics. Methods 2.4 names one test, a two-sided Student's t-test with p < 0.05 as
# significant. The n is independent experiments for monolayers and cells for Fig. 4. The paper
# also reads significance from figures, where a gap between error bars longer than the bars counts
# as p < 0.05.
#
# Details the paper leaves open, used in the criteria below. The readings are named where a
# detail could change an outcome.
# (O1) "Center" value. The paper gives no ROI size or window. Readings are (a) the ROI at, or
#      nearest to, distance 0; (b) the value of the LOESS fit at distance 0.
# (O2) "Most peripheral" value. With both diagonals measured there are four peripheral ROIs.
#      Readings are (a) the mean of the outermost ROI at each end measured; (b) the outermost ROI
#      at the energized-first (e1) end alone. For profiles "averaged across both diagonals"
#      (Fig. 5B) the profile is averaged by distance first.
# (O3) Normalization (values in %). Readings are (a) each experiment normalized to its own most
#      peripheral ROI, then averaged; (b) the mean profile divided by its own most peripheral value.
# (O4) Background in monolayer images. The paper says nothing about background subtraction.
#      Readings are (a) raw ROI intensity; (b) intensity minus a cell-free or unexposed background,
#      where the data allow.
# (O5) LOESS span. Not given. It affects only the plotted fits, except under reading (b) of O1.
#      There the span is varied (0.1, 0.2 and 0.3 of the range) and all are shown.
# (O6) Paired or unpaired t-test. Comparisons between groups of dishes are unpaired. For
#      comparisons inside the same dishes (center against periphery) both are run.
# (O7) Fig. 4, "by the end of recording". Readings are (a) the last frame (600 s); (b) the mean of
#      the last six frames, matching the six-frame baseline.
