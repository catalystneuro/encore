- id: monkey-j-linear-command
  statement: For Monkey J, a time-invariant linear map of neural activity accounts for 99.6, 99.6,
    99.5 and 99.8% of the variance of the point process filter's command in the four sessions.
  source: Methods, Command definition, Monkey J
  quote: "for all four analyzed sessions, neural activity mapped through could account for 99.6,
    99.6, 99.5, and 99.8 percent of the variance of the command respectively"
  expected:
  - quantity: variance of the command accounted for, lowest of the four sessions
    value: 99.5
    tolerance: 0.5
    unit: percent
  criterion: Per session, the least-squares matrix (no intercept) from 5 ms spike counts to the
    PPF's velocity update over all rewarded trials of both tasks, and its in-sample variance
    accounted for, 1 minus the summed squared residual of x and y over the summed squares of the
    demeaned update (generate_models.py 3044-3103). The tolerance is the distance to 99%, the
    threshold the code asserts (generate_models_utils.py 512-513), as 10% of the value would admit
    any fit. Reproduced when every session accounts for at least 99% and the four values are
    within 0.5 percentage points of those reported. Needs the PPF update or its parameters; blocked
    when the dataset has neither.
