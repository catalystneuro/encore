    epoch with session as group (legend; util_fcns.run_LME). Reproduced when the late-minus-early
    effect is negative with p < 0.05 in each monkey. The code's grouping mixes Monkey J trials into
    the Monkey G model (plot_pred_fr_diffs.py 3013); the per-monkey test is the main one.
