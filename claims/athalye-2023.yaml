- id: figs5b-dynamics-beyond-behavior
  statement: Adding previous neural activity (invariant dynamics) to a model that encodes the
    command, cursor state, target and task significantly improves the held-out prediction of
    neural activity.
  source: Figure S5B legend; Results, Invariant dynamics predict the different neural activity
    patterns used to issue the same command, paragraph beginning "On the level of single time
    points"
  quote: "Incorporating invariant neural dynamics (cyan) significantly improves upon predictions
    from the model with all task-relevant variables"
  statistics:
  - about: Monkey G
    test: paired Student's t-test
    statistic: T = -7.182
    p: 9.41e-05
    n: N = 18
  - about: Monkey J
    test: paired Student's t-test
    statistic: T = -5.141
    p: 0.0143
    n: N = 8
  criterion: Behavior-encoding model, activity at t given the command, cursor position and
    velocity at t-1, target position and a categorical target and task variable (Methods,
    Estimation of behavior-encoding models), predictors z-scored, ridge with cross-validated
    parameter, 5 folds; the same model plus x_{t-1}. Held-out R2 pooled over neurons. One pair per session, as the
    Methods say ("session was paired") and the code does (plot_pred_fr_diffs.py 192); the paper's N
    (18 and 8) counts the two R2 values of each of the 9 and 4 sessions, as its p-values are those
    of a paired t-test with 8 and 3 degrees of freedom (T = -7.182 gives p = 9.4e-05 with 8; T =
    -5.141 gives p = 0.0143 with 3). Reproduced when a paired t-test gives p < 0.05 in each monkey
    with the model with dynamics higher.
- id: figs5f-nonlinear-no-better
  statement: A recurrent switching linear dynamical system (rsLDS) does not predict neural activity
    better than the linear ridge dynamics model.
  source: Results, Invariant dynamics predict the different neural activity patterns used to issue
    the same command, paragraph beginning "We found that the dynamics were low-dimensional"; Figure
    S5F legend
  quote: "Notably, a non-linear dynamics model (a recurrent switching linear dynamical system52)
    did not out-perform these simple linear dynamics"
  criterion: The paper reports no test. rsLDS from the ssm package (github.com/lindermanlab/ssm),
    "recurrent_only" transitions, Gaussian dynamics and emissions, latent dimension set to the
    number of neurons (legend; the code uses neurons minus 1, single_subspace=True, after dropping
    neurons below 0.5 Hz and mean-subtracting), fit by Laplace EM, structured mean field, 10
    iterations; number of discrete states K from 1 to 5; 5 folds by trial; one-step prediction of
    the next bin's activity (rebuttal_train_rslds_plot_model_R2.ipynb cells 7 to 9;
    generate_models.py 1849-2193). Reproduced when, for every K, the mean over sessions of the
    rsLDS held-out R2 is not above the ridge model's in each monkey; the R2 values are reported.
    The code leaves out Monkey G sessions 2 and 4; all sessions and the code's subset are shown.
- id: figs3f-residual-early-late
  statement: The residual of the dynamics model is larger early in the trial than late, consistent
    with large input at movement start.
  source: Figure S3F legend
  quote: "The residual is larger in the early trial period than the late trial period."
  statistics:
  - about: Monkey G
    test: linear mixed effect model, session as random effect, early vs late as fixed effect
    statistic: slope = -0.242, t(4746) = -24.926
    p: 3.87e-137
  - about: Monkey J
    test: linear mixed effect model, session as random effect, early vs late as fixed effect
    statistic: slope = -0.0625, t(1161) = -5.354
    p: 8.58e-8
  criterion: Residual of the held-out prediction x_t - (A x_{t-1} + b), its L2 norm divided by the
    square root of the number of neurons per bin. Trial length set to the session's median trial
    time; early and late are the first and last thirds of it; per trial the mean residual norm in
