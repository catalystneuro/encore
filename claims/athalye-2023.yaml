  - about: Full Dynamics Model, each session
    test: Mann-Whitney U test
    p: 0.05
    p_relation: "<"
    n: 9 of 9 sessions of Monkey G and 4 of 4 of Monkey J (none for the other models)
  criterion: On the simulations of fig6c and fig6d, commands discretized and tuples of 15 or more
    occurrences as for the recorded data; per tuple the decoder-null population distance (as in
    fig3d) and the mean of its null. The Methods compare each model with its own behavior-preserving
    shuffle (Methods, Simulated activity issuing a given command) and do not give the number of
    shuffles for the simulations; the code draws condition-sized subsamples of the matched pool
    (LQR/analyze_lqr.py 177-326). Readings, (a) behavior-preserving shuffle of the simulated
    activity, 1000 shuffles as for the recorded data; (b) the code's subsampling. Per session, Mann-Whitney U of observed distances against the tuples' null means; per
    monkey, LME of distance on source (simulation or shuffle) with session as group. Reproduced
    when the full model's distances exceed the null in each monkey (LME p < 0.05; Mann-Whitney p <
    0.05 in at least 8 of 9 G and 3 of 4 J sessions) and, as claims of absence on the same tests,
    the No Dynamics models (of both comparisons) and the Decoder-null model give LME p >= 0.05 in
    each monkey, and Mann-Whitney p >= 0.05 in every session (Figure 6G and 6H legends). Partially
    reproduced when the full model's effect holds and an absence does not.
