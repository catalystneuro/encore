# Claims for Athalye, Khanna, Gowda, Orsborn, Costa & Carmena (2023), "Invariant neural dynamics
# drive commands to control different movements", Current Biology 33, 2962-2976, on dandiset 000404
# ("Monkey 2D cursor BMI").
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23, protocol
# pilot-10 as stated in docs/protocol.md (Reader, steps 1 to 4).
#
# Text read: the accepted author manuscript in PubMed Central (PMC10527529, NIHMS1910377), full text
# (paper/10.1016-j.cub.2023.06.027.txt): Summary, Results, Discussion, STAR Methods, all figure
# legends, and the supplement (NIHMS1910377-supplement-2.pdf, extracted into the same file):
# legends of Figures S1 to S6, Table S1 (comparisons with shuffled data, Figures 3 to 5) and Table
# S2 (simulation statistics, Figure 6). The columns of Tables S1 and S2 were read from the
# supplement PDF (pages 15 and 16), as the text extraction splits them into cells. The version of
# record is not open access. The bioRxiv preprint (10.1101/2021.08.27.457931, the paper the
# dandiset names) is also under paper/ and was not used; the version of record replaces it.
#
# Code read: https://github.com/pkhanna104/bmi_dynamics_code at commit 416187366f84f2b7367ac54205aa321480e1acd1
# (2023-06-04; archived as Zenodo 10.5281/zenodo.8006653). It holds the preprocessing of the HDF and
# decoder files (prelim_analysis.py, resim_ppf/ppf_pa.py), the model fitting
# (online_analysis/generate_models*.py), the analyses behind each figure (online_analysis/
# plot_fr_diffs.py, plot_pred_fr_diffs.py, generalization_plots.py, pred_fwd.py, util_fcns.py),
# the OFC simulations (LQR/behavior_co_obs.py, LQR/analyze_lqr.py and the notebooks
# exploration_notebooks/main_*lqr_neural_error_dynamics*), a figure guide (notebooks/"Guide to
# Current Biology Figures.ipynb", Figures 1 to 5 and S1 to S6) and the writer of the NWB files
# (online_analysis/nwb_utils.py). Its README says some raw files (HDF and decoder files) could not be
# deposited in full on DANDI. In the code that wrote the NWB files, the decoder matrices (A, W, C,
# Q, F, KG) are commented out; the paper's Data availability says decoder parameters were
# deposited. Whether the dataset holds them is the author's to find; most claims need the decoder.
#
# Data the paper used, as it reports them. Two adult male rhesus macaques, Monkey G (7 years) and
# Monkey J (10 years), chronic bilateral 16 x 8 microwire arrays in M1 and PMd. 9 sessions of
# Monkey G and 4 of Monkey J; on each session the monkey performed a center-out task (8 targets)
# and an obstacle-avoidance task with the same fixed decoder; only successful (rewarded) trials are
# analysed. Population activity of 20 to 151 units (Monkey G decoder 35 to 151 units, median 48;
# Monkey J 20 or 21, median 20). Monkey G used a velocity Kalman filter on spike counts in 100 ms
# bins; Monkey J a velocity point process filter on 5 ms bins, whose spikes and commands the paper
# sums into 100 ms bins. Workspace 50 x 28 cm (G), 24 x 24 cm (J); targets 10 cm (G) and 6.5 cm (J)
# from the center. A condition is the task (co, cw or ccw around the obstacle) and target (0 to 7),
# up to 24 per session. Measured variables used: binned spike counts, cursor position and velocity,
# target and obstacle positions, trial outcome, and the decoder (Kalman gain or its linear
# equivalent) that turns activity into the command. The dandiset (DOI 10.48324/dandi.000404/
# 0.230605.2024 in the paper's Data availability) is named for these recordings. Figure 6 uses
# simulations built from the dynamics fitted to these data and the sessions' decoders.
#
# Shared method, from the STAR Methods and, where they are silent, the code (cited), used by the
# claims below unless a claim says otherwise.
# - Bins and trials. 100 ms bins of spike counts. The code takes each rewarded trial from the go cue
#   (peripheral target onset) to reward, so the target hold is in and the center hold out
#   (prelim_analysis.py 299-306 and 510-552 for G; ppf_pa.py 120-127 and 241-266 for J; the NWB
#   trials table written by nwb_utils.py has start_time at go and stop_time at reward). Monkey J's
#   obstacle trials are those with partial or full obstruction (Methods); the code drops Monkey J
#   obstacle targets with index below 2 (analysis_config.py 97-99). Firing rates are in Hz (counts
#   per bin x 10) in the code (plot_fr_diffs.py 1509).
# - Command. c_t = K x_t, the velocity rows of the steady-state Kalman gain applied to the binned
#   counts (Monkey G); for Monkey J, the time-invariant matrix that approximates the PPF update, fit
#   by least squares without intercept (generate_models.py 3044-3103), with commands summed over
#   20 bins of 5 ms.
# - Condition. Task and target; obstacle trials are labelled cw or ccw. The code centres each
#   trajectory on its start, rotates the target onto +x and calls the trial cw when dot(dx, y) > 0
#   and ccw otherwise (util_fcns.CW_CCW_obs 245-291), with fixed labels for some Monkey J targets
#   (analysis_config.py 103-110).
# - Command bins. Per session, over all commands of rewarded trials of both tasks: 8 angle bins of
#   45 degrees centred on 0, 45, ... 315 degrees (edges 22.5, 67.5, ... 337.5) and 4 magnitude bins
#   with edges at the 23.75th, 47.5th, 71.25th and 95th percentiles of command magnitude; commands
#   above the 95th percentile are not analysed as commands (Methods; util_fcns.commands2bins). The
#   code still keeps them in model training and in the shuffle.
# - (command, condition) tuples. A tuple is analysed when the command occurs at least 15 times in
#   the condition, pooling trials (Methods).
# - Matching the condition-pooled distribution, as the Methods give it; in the code each round drops
#   floor(5%) of the pool with the largest z-scored deviation, keeps the condition's own points, stops
#   when two t-tests (x and y of the command) both give p > 0.05, and drops the tuple when the pool
#   is no larger than the condition's sample (plot_fr_diffs.py 55-198, 1616).
# - Population distances are taken in the decoder-null space (orthonormal basis from
#   scipy.linalg.null_space of the decoder), L2 norm divided by the square root of the number of
#   neurons (Methods; the code omits the square root, which cancels where distances are divided by
#   the shuffle mean).
# - Behavior-preserving shuffle. Within a session, the activity of all bins that share a
#   discretized command bin is permuted; 1000 shuffled datasets (Methods). A per-item p-value is
#   the fraction of shuffles at least as extreme as the data (code). A session test averages the
#   quantity over the relevant items (tuples, commands, neurons) and compares it with the same
#   average in each shuffle; the pooled test averages the session values over sessions and compares
#   with the per-shuffle average over sessions (Methods, Statistics Summary). With 1000 shuffles,
#   p < 0.001 means no shuffle reaches the data.
# - Dynamics model. x_t = A x_{t-1} + b fit by ridge regression (sklearn Ridge, with intercept) on
#   pairs of consecutive bins within rewarded trials. The ridge parameter is chosen per session by
#   5-fold cross-validation over a grid from 2.5e-5 to 1e6 (Methods; the code's 49 values are
#   {0.25, 0.5, 0.75, 1} x 10^i for i = -4 to 6 except 4, plus 2000 to 10000 in steps of 1000,
#   generate_models.py 56-65). Predictions are collated from 5 folds; the code forms folds at random
#   over bins, stratified by task, after np.random.seed(0). R2 is the variance-weighted pooled R2,
#   1 minus the summed squared error over the summed squares about each neuron's mean
#   (generalization_plots.r2, 428-431). The code's x_t runs over bins 1 to nt-2 of each trial.
# - Activity given the command (Figure 4). x_t predicted from x_{t-1} and c_t by Gaussian
#   conditioning, with the noise covariance estimated from the training residuals (Methods;
#   generate_models.py 2294-2298).
# - Shuffle dynamics. Fit on each shuffled dataset, tested on the real held-out data (Methods).
#
# Details the paper leaves open that bear on several claims, with the readings it allows. Each
# claim whose outcome could depend on one says so in its criterion; the notebook runs each reading.
# - Commands counted. The Results analyse a command when it reaches 15 occurrences "for more than
#   one condition"; the Figure 3 and 4 code needs only one such condition (plot_fr_diffs.py 1555),
#   the Figure S1 code two (plot_fr_diffs.py 2525, 2849). Readings, (a) commands with at least two
#   qualifying conditions; (b) commands with at least one.
# - Number of shuffles. The Methods say 1000; the figure guide runs some panels with 10 or 20
#   (Figures 4D, 4E, 5E, 5F, 5H). The Methods' 1000 are the main reading; with 10 or 20, p < 0.001
#   cannot be reached, so the code's counts are shown as a variant only.
# - Ridge parameter of the shuffle models. The Methods select it on shuffled data; the code reuses
#   one value per session, chosen on unshuffled data (generate_models.py 1101, 1353). Readings, (a)
#   selected on each shuffled dataset (or on one, applied to all); (b) the real data's value.
# - Null for Figure 3. The Methods' step list recomputes the distances on each behavior-preserving
#   shuffle; the Statistics Summary and the code (plot_fr_diffs.py 1630-1636) draw, 1000 times,
#   as many observations as the condition has from the matched condition-pooled set. Readings, (a)
#   behavior-preserving shuffle; (b) subsampling the matched pool.
# Tolerances follow the protocol, 10% of the reported value unless a claim gives a reason.
schema_version: 2
dataset:
  archive: dandi
  id: "000404"
  doi: 10.48324/dandi.000404/0.230605.2024
paper: doi:10.1016/j.cub.2023.06.027
claims:
- id: conditions-per-session
  statement: The two tasks elicited up to 24 movement conditions, with an average of 16 to 17
    conditions per session.
  source: Results, BMI to study neural population control of movement, paragraph beginning "To
    study control of diverse movements"; Methods, Neuroprosthetic tasks
  quote: "Our tasks elicited up to 24 conditions of movement (with an average of 16–17 conditions
    per session)"
  expected:
    quantity: conditions per session, mean
    value: 16.5
    tolerance: 2.2
  criterion: A condition is a task (co, cw, ccw) and target pair, with cw and ccw labelled as in
    the shared method. The range 16 to 17 widened by 10% of each bound (14.4 to 18.7) decides. The
    paper does not say what makes a condition count; readings, (a) conditions with at least one
    rewarded trial; (b) conditions with at least one (command, condition) tuple of 15 or more
    occurrences. The mean is over all 13 sessions; per-monkey means are reported. Reproduced when
    the mean lies in 14.4 to 18.7 under one reading.
- id: figs1b-conditions-per-command
  statement: Each analysed command was used regularly (15 or more times) in several conditions,
    about 7 on average, typically 5 to 10.
  source: Results, BMI to study neural population control of movement, paragraph beginning
    "Importantly, the BMI enabled us"; Figure S1B; Methods, Conditions that used a command regularly
  quote: "Each individual command was used with regularity during multiple conditions (on average
    ~7 conditions, Figure S1B)"
  expected:
    quantity: conditions in which a command is used regularly, mean
    value: 7
    tolerance: 0.7
  criterion: Per session, for each of the 32 commands (magnitude bins 0 to 3), the number of
    conditions with 15 or more occurrences, counting commands with at least two such conditions, as
    the Results say and the Figure S1B code does (plot_fr_diffs.py 2797-2870). The code plots one
    box per session and computes no average; readings of the average, (a) the mean over all
    commands of all sessions pooled; (b) the mean of the session means. Reproduced when one reading
    is within 6.3 to 7.7 and the median over commands lies within 5 to 10 widened by 10% (4.5 to
    11) (Methods, "Typically, an individual command is used regularly in 5–10 conditions").
- id: figs1d-command-subtrajectories-differ
  statement: The same command is used within command subtrajectories that differ between
    conditions more than expected from subsampling the condition-pooled subtrajectories
    (normalized distance 1.920 for Monkey G and 2.342 for Monkey J).
  source: Figure S1D legend
  quote: "Condition-specific command subtrajectories are overall significantly different from the
    condition-pooled command subtrajectory: Monkey G [J]: p-value < 0.001 for 9/9 [4/4] sessions,
    p-value < 0.001 pooled over sessions (mean of command subtrajectory distances = 1.920 [2.342]"
  statistics:
  - about: each session
    test: comparison with a bootstrapped distribution from the condition-pooled subtrajectories
    p: 0.001
    p_relation: "<"
    n: 9 sessions of Monkey G and 4 of Monkey J, all significant
  - about: pooled over sessions, each monkey
    test: comparison with a bootstrapped distribution from the condition-pooled subtrajectories
    p: 0.001
    p_relation: "<"
  expected:
  - quantity: mean normalized command subtrajectory distance, Monkey G
    value: 1.920
    tolerance: 0.192
  - quantity: mean normalized command subtrajectory distance, Monkey J
    value: 2.342
    tolerance: 0.234
  criterion: As in Methods, Comparing command subtrajectories, and the code
    (plot_fr_diffs.py 2425-2717). For each tuple with 15 or more occurrences, of a command used in
    at least two conditions, the condition's average command subtrajectory (x and y command, bins
    -5 to +5 around each occurrence, occurrences within 5 bins of a trial's start or end left out)
    and the average over the matched condition-pooled set; distance is the L2 norm of the 2 x 11
    difference. 1000 bootstrap subsamples of the condition's size from the matched pool give the
    null; distances are divided by the bootstrap mean. The Statistics Summary names the
    behavior-preserving shuffle for Figures S1D and S1E, but that shuffle permutes activity and
    leaves commands unchanged, so it gives no null for command distances; the subsampling of the
    Methods section and the legend is the test. Session and pooled tests as in the shared method. Reproduced when both means are within tolerance and the session tests give p < 0.001
    in at least 8 of 9 G and 3 of 4 J sessions and pooled p < 0.001 in each monkey; partially
    reproduced when the tests hold and a mean is outside tolerance.
- id: figs1e-next-commands-differ
  statement: The same command is followed by next commands that differ between conditions more
