  - about: dynamics-predicted distances, Monkey J, pooled
    test: linear mixed effect model, command identity and session as random effects
    statistic: N = 1629, z = 22.5
    p: 5.93e-112
  criterion: For commands used in more than five conditions, each pair of conditions with 15 or
    more occurrences; neural distance is the decoder-null population distance between the two
