- id: fig4g-majority-predicted
  statement: The dynamics model predicts the condition-specific activity better than shuffle
    dynamics for the vast majority of (command, condition) tuples, commands and neurons.
  source: Results, Invariant dynamics predict the different neural activity patterns used to issue
    the same command, paragraph beginning "The invariant dynamics model also predicted"; Figure 4G
  quote: "The model predicted neural activity for the vast majority of commands, conditions, and
    neurons (Figure 4G), revealing that dynamics were indeed invariant."
  criterion: Per session, the fraction of tuples whose population prediction error is below the
    5th percentile of the shuffle models' errors; of commands, by the error averaged over the
    command's conditions; of neurons, by the error averaged over tuples (Methods, Predicting
    condition-specific activity; denominators all tuples with 15 or more observations,
    plot_pred_fr_diffs.py 980-988). The paper gives no number; "majority" is read at its least, a
    fraction above 0.5. Reproduced when the mean of session fractions is above 0.5 for all three
    in both monkeys; partially reproduced when it holds for some of the six; the values are
    reported.
- id: figs3-low-dimensional-decaying-dynamics
  statement: The fitted dynamics are low-dimensional, with 2 to 4 eigenvalues per session whose
    decay time exceeds the 0.1 s bin (2 to 5 for decoder-null dynamics), and decay to a fixed point
    with little rotation (mean frequency about 0.1 Hz for Monkey G and 0 Hz for Monkey J).
  source: Results, Invariant dynamics predict the different neural activity patterns used to issue
    the same command, paragraph beginning "We found that the dynamics were low-dimensional"; Figure
    S3B and S3C legends
  quote: "The dimensionality of the full dynamics matrix (decoder-null dynamics matrix) ranged from
    2-4 (2-5) when considering the eigenvalues that had timescales greater than the BMI update’s
    timescale of 0.1 seconds."
  expected:
  - quantity: mean frequency of long-timescale eigenvalues, full dynamics, Monkey G
    value: 0.1
    tolerance: 0.01
    unit: Hz
  - quantity: mean frequency of long-timescale eigenvalues, decoder-null dynamics, Monkey G
    value: 0.06
    tolerance: 0.006
    unit: Hz
  criterion: Per session, A fit on all pairs with the session's ridge parameter (the code refits
    in-sample, plot_pred_fr_diffs.py 1791-1921); for each eigenvalue, decay time -0.1 s / ln|lambda|
    and frequency |angle(lambda)| / (2 pi 0.1 s) (Methods, Dimensionality and eigenvalues).
    Dimensionality is the number of eigenvalues with decay time above 0.1 s, conjugate pairs
    counted as two. The code first keeps the eigenvalues that make up 99% of the summed |lambda|;
    the count without that step is a variant. Decoder-null dynamics fit on activity projected into
    the decoder-null space. Reproduced when every session's dimensionality is 2 to 4 (decoder-null
    2 to 5), the Monkey G mean frequencies are within tolerance (S3C gives them as "~0.1 (~0.06)
    Hz") and every Monkey J long-timescale eigenvalue is real (0 Hz). Partially reproduced when the
    counts hold and the frequencies do not.
