- id: fig6c-dynamics-reduce-input
  statement: In an optimal feedback control model that drives the recorded decoders, a neural
    population with the fitted invariant dynamics needs significantly less input to perform the
    tasks than one with no dynamics.
  source: Figure 6C legend; Results, An OFC model reveals that invariant dynamics reduce the input,
    paragraph 4; Table S2
  quote: "These simulations revealed that the population required significantly less input in the
    Full Dynamics Model than in the No Dynamics Model (Figure 6C)."
  statistics:
  - about: Monkey G, pooled over sessions
    test: linear mixed effect model, session as random effect
    statistic: z = 10.49, N = 432
    p: 9.67e-26
  - about: Monkey J, pooled over sessions
    test: linear mixed effect model, session as random effect
    statistic: z = 5.20, N = 192
    p: 1.92e-7
  - about: each session
    test: Wilcoxon signed-rank test with conditions paired
    p: 0.05
    p_relation: "<"
    n: 9 of 9 sessions of Monkey G and 4 of 4 of Monkey J
  criterion: Simulation as in Methods, Optimal feedback control model and simulation. Per session,
    A and b of the full dynamics model; finite-horizon LQR with terminal cost on cursor position
    and velocity only and input cost the identity (the code's Q_f = 100, R = I, LQR/
    behavior_co_obs.py 2194-2220), horizon 40 bins (center-out) or 20 + 20 through a waypoint 6 cm
    from the obstacle (obstacle); 20 trials for each of 24 conditions; initial state the fixed
    point; isotropic neural noise with variance equal to the mean per-neuron variance of the
    noiseless No Dynamics simulation; No Dynamics Model A = 0 with b kept. Input magnitude per
    trial is the L2 (Frobenius) norm of the N x T input matrix, averaged over a condition's 20
    trials. Wilcoxon signed-rank paired over the 24 conditions per session; LME (statsmodels
    mixedlm) of magnitude on model with session as group. Reproduced when, in each monkey, the
    full model's input is lower with LME p < 0.05 and the Wilcoxon gives p < 0.05 in at least 8 of
    9 G and 3 of 4 J sessions. Noise is random; the seed is a standard choice.
- id: fig6d-decoder-null-dynamics-no-saving
  statement: When the model's invariant dynamics are restricted to the decoder-null space, the
    input needed is not different from a population with no dynamics.
  source: Figure 6D legend; Table S2
  quote: "There was no significant difference in input magnitude between Decoder-null Dynamics
