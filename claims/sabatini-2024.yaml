# Claims for Sabatini & Kaufman (2024), Nat. Commun. 15:7007, "Reach-dependent reorientation of
# rotational dynamics in motor cortex", tested on dandiset 000070 (relation reuses).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-20,
# protocol pilot-18 as stated in docs/protocol.md. The writer did not look at the dandiset's data
# or files.
#
# Text read: the version of record (open access, CC BY-NC-ND), full text from PubMed Central
# (PMC11325044) with Methods, figure legends and Data and Code availability, and its one
# supplement, 41467_2024_51308_MOESM1_ESM.pdf (Supplementary Figures 1 to 8 with legends and the
# derivation of the basis function representation of a linear dynamical system). The Peer Review
# File and Reporting Summary were not read; no result rests on them. The supplement PDF was not
# opened beyond its extracted text.
#
# Code read: github.com/kaufmanlab/LDR-public at commit b65f28d (2024-08-02), the MATLAB code the
# Code availability statement links. It holds the analysis functions (TBF, single-condition LDS,
# alignment index, subspace excursion angles, rotation and location prediction, LDR encoding and
# decoding, jPCA reconciliation). It loads preprocessed .mat files that are not in the repository
# (ShenoyMonkeyData, ShenoyMonkeyDataSingleTrial, basisFxnNum, TBFResults and others; the paper
# says "Code-compatible data are available upon request"), and lacks kinFuncEval (the kinematic
# basis functions), the jPCA codepack, GPFA, and code for the location-from-kinematics regression
# (Figure 6e) and the eigenvalue Poisson null. Where the Methods are silent and the code settles a
# detail, the claim says so; where they differ, the Methods decide and the code's choice is a
# variant.
#
# Data the paper used. Reanalysed data of earlier studies (refs 19, 27, 40; Churchland et al. 2010
# and 2012, Kaufman et al. 2016): two adult male rhesus macaques, J and N, performing the "maze"
# delayed center-out reach task with a 0 to 1000 ms delay; 72 conditions (36 straight, 36 curved
# around virtual barriers); two 96-electrode Utah arrays per monkey, one in PMd and one in M1;
# single units and stable multi-units, 79 to 118 units per array; 1469 trials for J and 2014 for N
# (Figure 7 legend). Four datasets, each analysed separately: M1-J, PMd-J, M1-N, PMd-N. Hand
# position over time is the kinematic variable; Supplementary Figure 8 and the code also use
# muscle activity (EMG). The Data availability statement names the dandiset files
# sub-Jenkins_ses-20090918_behavior+ecephys.nwb and sub-Nitschke_ses-20100923_behavior+ecephys.nwb.
#
# Method shared by the claims, from the Methods unless marked.
# - Spikes binned at 1 ms, smoothed with a Gaussian of 20 ms s.d., trial-averaged per condition,
#   down-sampled to 10 ms, aligned to movement onset (Methods, Subjects, behavior and data
#   pre-processing; code preprocessTrials.m, kernel width 111 samples, symmetric padding).
# - Time base. The code's condition data are on a -350 to +850 ms grid every 10 ms (121 bins;
#   kinFuncEval(-350:10:850), generateTrials.m). Dynamics are fitted from bin 20 on, which the
#   Methods give as 150 ms before movement onset to 850 ms after (Fitting dynamics to single
#   conditions; De-mixing temporal basis functions). Kinematic summaries use the whole -350 to
#   +850 ms window (code).
# - The 72 conditions. The source data hold 108 maze conditions; the code drops every third one
#   (pruneRepeats.m, data(3:3:end) = [], "conditions that involve a visual distractor ... but are
#   essentially repeats of curved conditions"). In the code's order, odd conditions are straight
#   and even ones curved (getRotationalProjCompare.m). The order of the code's .mat files is not
#   public. Readings for selecting the 72: (a) drop the conditions whose maze condition number is
#   a multiple of 3; (b) drop the conditions identified from the maze geometry as repeating a
#   curved condition's target and barrier with a distractor added. The author reports how many of
#   36 straight and 36 curved each gives.
# - Trials. The paper gives no trial selection beyond the task; readings are (a) all successful
#   trials of the 72 conditions, (b) successful trials with a delay above 400 ms as in the original
#   studies. The counts are compared with 1469 and 2014.
# - Temporal basis factorization (TBF). SVD of the (neurons x conditions)-by-time matrix of
#   condition-averaged rates; top k temporal singular vectors are the basis functions, k by
#   cross-validation over two halves of the trials, 100 folds, maximising held-out variance
#   explained (code crossValidateDimensionalityBasisFxns.m tests k = 1 to 20 and raises an even k
#   by one); de-mixed by fitting an LDS to the basis functions and projecting onto its
#   eigenvectors (code eigTransform.m, which then replaces the basis by damped sinusoids of the
#   fitted frequencies and half-lives). getBasisFxns.m computes max-normalised rates but runs the
#   SVD on the unnormalised ones; the unnormalised SVD is the code's choice.
# - Population variance explained, per condition, is 1 minus the summed variance over neurons of
#   the residual over the summed variance of the data, negative values set to 0 (code
#   getVarExplained.m). Reported means and s.d. are across conditions.
# - Alignment index of condition 1's rotation onto condition 2's plane is the fraction of the
#   variance of condition 1's rotation (its loading columns times the basis functions) captured by
#   projection onto the span of condition 2's loading columns (code getAlignmentIndex.m and
#   quantifyProjectedVarianceSingleFrequency.m).
# - ROC-AUC between an observed and a null distribution is folded to at least 0.5 (code
#   compareTrialSimilarity.m, 0.5 + |AUC - 0.5|).
# Rule for ranges. A value reported as a range over the four datasets ("0.64-0.73") is reproduced
# when each dataset's value lies inside the range widened by 10% of each bound, and partially
# reproduced when two or three of the four do. Where the paper's text, Methods and code name
# different tests for the same comparison (Wilcoxon rank-sum against signed-rank), the Methods'
# or Results' test decides and the other is shown as a variant.
schema_version: 2
paper: doi:10.1038/s41467-024-51308-7
claims:
- id: data-composition
  statement: Two monkeys (J and N) performed the maze task with 72 conditions (36 straight, 36
    curved); a PMd and an M1 array in each monkey gave 79 to 118 units per array; 1469 trials for
    monkey J and 2014 for monkey N.
  source: Results, paragraph 1; Methods, Subjects, behavior and data pre-processing; Figure 7 legend
  quote: We refer to the 72 unique combinations of target and virtual barrier positions as
    "conditions". Simultaneous single- and multi-unit electrophysiological recordings were made
    with a pair of 96-electrode Utah arrays in each monkey, implanted in PMd and in M1, yielding
    79–118 units per array.
  expected:
  - quantity: conditions per monkey
    value: 72
    tolerance: 0
  - quantity: trials, monkey J
    value: 1469
    tolerance: 146.9
  - quantity: trials, monkey N
    value: 2014
    tolerance: 201.4
  criterion: Conditions and trials under the readings of the shared method. Reproduced when, under
    one reading, each monkey has 72 conditions (36 straight, 36 curved), each trial count is
    within tolerance, and each of the four arrays has 71 to 130 units (79 to 118 widened by 10%),
    counting single units and multi-units the dataset marks as such.
- id: jpca-fit-r2
  statement: Rotational dynamics found by jPCA fit activity within the jPCA planes with R2 of 0.64
    to 0.73, higher on straight reaches (0.73 to 0.88) than on curved reaches (0.56 to 0.70).
  source: Results, Rotational dynamics incompletely describe motor cortex activity, paragraph 1;
    Supplementary Figure 1b
  quote: Rotational dynamics fit neural activity within the identified plane reasonably well ( R 2
    = 0.64–0.73). ... rotational dynamics fit neural activity on straight reaches more strongly ( R
    2 = 0.73–0.88), but fit curved reaches less closely ( R 2 = 0.56–0.70; Supplementary Fig. 1 )
  statistics:
  - about: straight against curved jPCA fit
    test: Wilcoxon signed-rank
    p: 0.001
    p_relation: "<"
  criterion: jPCA as in Methods, Explaining variability in jPCA-identified rotations (mean
    subtraction, soft normalisation constant 5, applied to activity reconstructed from the
    temporal basis functions); fitted on bins 20 to 40 of the -350 to +850 ms grid, about -160 to
    +40 ms, and with the codepack's default of 6 PCs (code getRotations.m; jPCA() called with
    default parameters). The straight and curved fits refit jPCA on the 36 straight and the 36
    curved conditions alone (code getRotationalProjCompare.m). The R2 is open between (a) the fit
    of the skew-symmetric matrix in the top plane (summary.R2_Mskew_2D, the first the code
    stores) and (b) the unconstrained fit in that plane (R2_Mbest_2D). Ranges judged by the rule
    for ranges (0.576 to 0.803 all, 0.657 to 0.968 straight, 0.504 to 0.77 curved) under one
    reading. The signed-rank test of Supplementary Figure 1b is not described; its pairing is
    open, reading per-condition R2 of each condition's projected trajectory, straight against
    curved conditions paired by target. It is reported, not decisive.
- id: jpca-variance-explained
  statement: Activity within the jPCA rotational planes explained only 7 to 12% of the population
    variance in peri-movement firing rates.
  source: Results, Rotational dynamics incompletely describe motor cortex activity, paragraph 1;
    Figure 2c
  quote: activity within the jPCA-identified rotational planes explained only 7–12% (s.d. <13%
    across conditions; Supplementary Fig. 1 ) of the total variance in peri-movement firing rates
  criterion: Per condition, the population variance of the activity reconstructed from the
    retained jPCA planes (two planes for M1, one for PMd, Methods), as the fraction of total
    variance (code getRotations.m, which reconstructs soft-normalised, mean-subtracted activity in
    the planes, un-normalises it and compares it with the activity not mean-subtracted). Mean over
    conditions judged by the rule for ranges (6.3 to 13.2%); the s.d. across conditions is
    reported.
  depends_on:
  - jpca-fit-r2
- id: single-lds-variance
  statement: A single linear dynamical system fitted to all conditions captured on average 46 to
    66% of the population variance.
  source: Results, Rotational dynamics incompletely describe motor cortex activity, paragraph 2
  quote: A single LDS on these data only captured an average of 46–66% of the population variance
    (s.d. <16%)
  criterion: Following the code fitSingleLDS.m, as the Methods do not describe this fit. One
    full-rank matrix M fitted by least squares from each bin to the next over all conditions, from
    bin 20 (about -150 ms) to the end; each condition simulated forward from its state at bin 20;
    population variance explained per condition. The comparison window is open between (a)
    -150 to +850 ms (bins 20 to 121), (b) the whole -350 to +850 ms matrix as the code computes
    it with the bins before 20 copied from the data. Mean over conditions judged by the rule for
    ranges (41.4 to 72.6%) under one reading.
- id: fig2c-condition-lds-variance
  statement: Activity on each single condition was low-dimensional and approximated by an LDS of
    5 to 9 dimensions, which explained 71 to 93% of the population variance.
  source: Results, Rotational dynamics incompletely describe motor cortex activity, paragraph 3;
    Figure 2c
  quote: 'Motor cortex activity for each single condition was low-dimensional and could be
    approximated as an LDS: 5–9 dimensional LDSs explained 71–93% (Fig. 2c ; s.d. <10% across
    conditions) of the population variance.'
  criterion: Methods, Fitting dynamics to single conditions. Per condition a discrete-time LDS by
    reduced-rank regression from -150 to +850 ms, eigenvalue half-lives above 10 s cut to 10 s,
    simulated forward from the state at -150 ms; dimensionality by cross-validation over two
    trial partitions, 100 repeats, one k for all conditions of a dataset. The code
    (crossValidateDimensionalityConditions.m) tests odd k from 1 to 21 and splits trials 3/4 to
    1/4; the Methods' even split is the main reading and the code's is a variant. Reproduced when
    every dataset's chosen dimensionality is 5 to 9 and its mean variance explained lies in 63.9
    to 100% (rule for ranges).
- id: fig3a-eigenvalue-clusters
  statement: Eigenvalues of the single-condition LDSs formed distinct clusters, corresponding to
    rotations at about 0.5, 1.5, 2.5 and 4 Hz on every condition, along with an offset.
  source: Results, Rotation frequencies are conserved across reaches in motor cortex activity,
    paragraph 2; Figure 3a
  quote: These clusters corresponded to the presence of rotations on every condition with
    frequencies of approximately 0.5, 1.5, 2.5, and 4 Hz, along with an offset in the firing rates.
  depends_on:
  - fig2c-condition-lds-variance
  criterion: Frequencies of the eigenvalues of each condition's LDS (angle of the eigenvalue over
    2 pi times the 100 Hz sampling rate, as in the code's extractParams.m). An LDS of k dimensions
    holds at most (k - 1)/2 complex pairs, so a dataset fitted with 5 or 7 dimensions (allowed by
    fig2c) cannot show all four frequencies. Reproduced when, in each dataset, the median
    frequencies of the complex eigenvalue pairs, sorted by frequency, lie within 10% of 0.5, 1.5,
    2.5 and 4 Hz in that order for as many pairs as the dimensionality allows, and at least one
    real eigenvalue is present on most conditions.
- id: fig3c-eigenvalue-distance-auc
  statement: Eigenvalues differed between conditions only slightly more than expected from
    estimation noise, with ROC-AUC 0.51 to 0.58 between the between-condition distances and the
    noise distribution.
  source: Results, Rotation frequencies are conserved across reaches in motor cortex activity,
    paragraph 2; Figure 3b, c
  quote: 'The rotational frequencies (specified by the eigenvalues) were nearly identical between
    conditions: the variation in eigenvalues between conditions was only slightly larger than the
    floor due to estimation noise (ROC-AUC = 0.51–0.58; Fig. 3b, c ).'
  depends_on:
  - fig2c-condition-lds-variance
  criterion: Distance between two conditions is the mean over corresponding (frequency-sorted)
    eigenvalues of their distance in the complex plane (Figure 3b legend, "averaging over the
    distances between corresponding eigenvalues"; Methods, "mean distance between the
    eigenvalues"). The code's eigValDistance.m, the norm of the difference of the sorted
    eigenvalue vectors, is shown as a variant. The null is open between the two the Methods give, (a) two sets of 20 Poisson
    trials simulated from each condition's rates, smoothed, averaged and fitted, 500 repeats per
    condition (Methods, main control); (b) random halves of the real trials, 500 repeats (the
    Methods' additional control and the code's compareTrialSimilarity.m). AUC folded to at least
    0.5. Reproduced when, under one reading, every dataset's AUC lies in 0.459 to 0.638.
- id: suppfig2-eigenvalues-from-kinematics
  statement: Kinematic parameters predicted the eigenvalues poorly (mean R2 = 0.1, leave-one-out
    cross-validation), so the small variation in eigenvalues carried little information about the
    reach.
  source: Results, Rotation frequencies are conserved across reaches in motor cortex activity,
    paragraph 2; Supplementary Figure 2e
  quote: 'kinematic parameters performed poorly as predictors of eigenvalues (mean R 2 = 0.1,
    leave-one-out cross-validation; Supplementary Fig. 2 )'
  expected:
    quantity: mean R2 of eigenvalue components predicted from reach parameters
    value: 0.1
    tolerance: 0.05
  depends_on:
  - fig2c-condition-lds-variance
  - fig6e-kinematics-predict-location
  criterion: Following the code getCorrelationsWithFrequency.m, as the Methods do not describe it.
    Predictors are the four reach parameters (see fig6e) plus reach duration and a constant;
    targets are the real and imaginary parts of each eigenvalue; ordinary least squares with
    leave-one-condition-out; R2 per component as 1 minus residual over total variance, negatives
    set to 0; mean over components pooled across the four datasets (Supplementary Figure 2e
    pools them). Reach duration as in fig3i. The tolerance is 0.05, as a mean of 0.1 printed to
    one figure covers 0.05 to 0.15.
- id: fig3g-basis-frequencies
  statement: The cross-validated temporal basis functions contained 3 to 4 rotations at 0.5, 1.5,
    2.5 and 4 Hz, along with an offset.
  source: Results, Identifying rotations with varying planes, paragraph 4; Figure 3g;
    Supplementary Figure 4
  quote: In agreement with our fits to single conditions, the optimal temporal basis functions
    contained 3–4 rotations at 0.5, 1.5, 2.5, and 4 Hz, along with an offset (Fig. 3g ; optimal
    number determined by cross-validation).
  criterion: TBF as in the shared method, k by cross-validation, the last basis function dropped
    when unpaired (Methods, Cross-validating the number of temporal basis functions; the visual
    screen is replaced by checking for a conjugate partner). Frequencies from the de-mixing LDS.
    Reproduced when every dataset has 3 or 4 rotation pairs plus one real (offset) mode, and each
    rotation's frequency lies within 10% of one of 0.5, 1.5, 2.5 and 4 Hz, the lowest three always
    present.
- id: tbf-variance-explained
  statement: The shared rotations of the temporal basis factorization explained 90 to 96% of the
    population variance.
  source: Results, Identifying rotations with varying planes, paragraph 4
  quote: These rotations explained 90–96% of the population variance (s.d. <2% across conditions).
  depends_on:
  - fig3g-basis-frequencies
  criterion: Per condition, population variance explained by the condition's loading matrix times
    the shared basis functions (Methods, Factorizing neural activity using temporal basis
    functions), mean over conditions, judged by the rule for ranges (81 to 100%). The window is
    open between (a) -150 to +850 ms, the window of the de-mixed basis, and (b) the whole -350 to
    +850 ms with the raw SVD basis, as the code's quantifyTBFStats.m computes it.
- id: tbf-shuffle-control
  statement: Shuffling time bins within each trial before smoothing lowered the variance explained
    by the factorization to 35 to 46%, significantly below the real data.
  source: Results, Identifying rotations with varying planes, paragraph 4; Methods, Control for
    data smoothing
  quote: This shuffle significantly lowered the variance explained by this method (35–46%; Wilcoxon
    rank sum test, p < 0.001).
  statistics:
  - test: Wilcoxon rank sum test
    p: 0.001
    p_relation: "<"
  depends_on:
  - tbf-variance-explained
  criterion: Per trial, 1 ms bins permuted in time before smoothing and averaging (code
    scrambleTrials.m), then TBF with k matched to the real data and variance explained per
    condition. The Results name a rank-sum test (and the code uses ranksum); the Methods name a
    signed-rank test, shown as a variant. Reproduced when every dataset's shuffled mean lies in
    31.5 to 50.6% and the rank-sum test against the real per-condition values gives p < 0.001
    with real higher; partially by the rule for ranges.
- id: fig3h-recoverability
  statement: Projections of each condition's activity recovered the temporal basis functions
    almost perfectly (91 to 95% variance explained, chance 63 to 80%), so the factorization found
    rotations and not a frequency decomposition.
  source: Results, Identifying rotations with varying planes, paragraph 5; Figure 3h; Methods,
    Quantifying the recoverability of temporal basis functions
  quote: The projections from each condition's motor cortex activity recovered the temporal basis
    functions almost perfectly (91–95% variance explained; s.d. <2.5% across conditions; chance,
    63–80%; Wilcoxon rank sum test, p < 0.001)
  statistics:
  - test: Wilcoxon rank sum test
    p: 0.001
    p_relation: "<"
  depends_on:
  - tbf-shuffle-control
  criterion: Recoverability per condition is the variance of the basis functions explained by the
    pseudo-inverse of the condition's loading matrix times its activity (Methods, Eq. 6; code
    getRecoverability.m). Chance is the recoverability on the time-shuffled data of
    tbf-shuffle-control (code quantifyTBFStats.m). Reproduced when every dataset's mean lies in
    81.9 to 100%, its chance mean in 56.7 to 88%, and the rank-sum test gives p < 0.001 with real
    higher; partially by the rule for ranges.
- id: fig3i-duration-warping
  statement: Before warping, rotation fits were unrelated or weakly related to reach duration
    (M1-N rho = -0.26, p = 0.023; others -0.18 to 0.21, p > 0.067); warping reaches to equal
    duration induced a negative correlation (rho -0.63 to -0.52, p < 0.001).
  source: Results, Identifying rotations with varying planes, paragraph 6; Figure 3i; Methods,
    Control for stereotyped time course of behavior
  quote: 'Prior to warping, the frequencies of the rotations were unrelated or weakly related to
    reach duration (M1-N, Pearson''s Rho = −0.26, p = 0.023; other datasets, Pearson''s Rho =
    −0.18–0.21, p > 0.067). Warping to equalize reach duration induced a negative correlation'
  statistics:
  - about: M1-N, unwarped
    test: Pearson correlation
    statistic: rho = -0.26
    p: 0.023
  - about: other datasets, unwarped
    test: Pearson correlation
    p: 0.067
    p_relation: ">"
  - about: warped data
    test: Pearson correlation
    p: 0.001
    p_relation: "<"
  expected:
    quantity: M1-N unwarped correlation
    value: -0.26
    tolerance: 0.026
  criterion: Methods and code quantifyTBFStats.m. Per condition, the Pearson correlation of the
    absolute difference of its mean reach duration from the mean over conditions with its
    recoverability. Reach duration per trial is the time from movement onset to the last bin
    where hand speed is at least a tenth of its peak (code warpTrials.m); warping is linear to 600
    ms with post-reach activity truncated at 850 ms after onset (the variant shown in Figure 3i;
    the 250 ms post-reach warp is shown as a variant), TBF with the original k. Reproduced when the
    M1-N unwarped rho is within tolerance with p < 0.05, the other three unwarped rho lie in -0.198
    to 0.231, and all four warped rho lie in -0.693 to -0.468 with p < 0.001; partially when the
    warped correlations hold and an unwarped value does not.
- id: suppfig3-model-comparison
  statement: The model with shared eigenvalues and condition-specific planes (LDR) explained more
    cross-validated variance than jPCA or condition-specific LDSs.
  source: Results, Identifying rotations with varying planes, paragraph 4; Supplementary Figure 3
  quote: Our method also explained greater variance than jPCA or even single-condition LDSs (due
    to lower overfitting and differences in objective function; Supplementary Fig. 3 ).
  depends_on:
  - jpca-variance-explained
  - fig2c-condition-lds-variance
  - tbf-variance-explained
  criterion: The per-condition variance explained of the three models as computed for
    jpca-variance-explained, fig2c-condition-lds-variance and tbf-variance-explained (code
    modelComp.m gathers these three). The legend says cross-validated; the cross-validated TBF
    value is the held-out variance at the chosen k (crossValidateDimensionalityBasisFxns.m) and
    the in-sample values are a variant. The paper reports no test; reproduced when, in every
    dataset, the TBF mean exceeds both others.
- id: fig4b-plane-alignment
  statement: Same-frequency rotational planes on pairs of conditions were far less aligned than
    expected from estimation noise (ROC-AUC 0.85 to 0.96).
  source: Results, Rotational planes differed across reaches, paragraph 1; Figure 4b;
    Supplementary Figure 4a
  quote: We found that rotational planes were far less aligned than expected due to estimation
    noise (ROC-AUC = 0.85–0.96; Wilcoxon signed-rank test, p < 0.001; Fig. 4b and Supplementary
    Fig. 4a ).
  statistics:
  - test: Wilcoxon signed-rank test
    p: 0.001
    p_relation: "<"
  depends_on:
  - fig3g-basis-frequencies
  criterion: Alignment index as in the shared method for each ordered pair of different conditions
    and each rotation. Noise is the alignment index between loading matrices fitted by regression
    on the fixed basis to two random halves of a condition's trials (Methods, Measuring the
    across-condition alignment of rotations), 36 repeats (Methods); the code's 200 repeats
    (singleFrequencyOverlapControl.m) are a variant. The paper's AUC is per rotation; the range
    covers rotations and datasets. The Results name a Wilcoxon signed-rank test and do not say
    what is paired; readings are (a) per condition, its mean alignment with the other conditions
    against its mean noise alignment, signed-rank test over conditions; (b) the code's rank-sum
    test of the two unpaired distributions. Reproduced when every rotation in every dataset has
    AUC in 0.765 to 1 with observed alignment lower, and the test gives p < 0.001 under one
    reading; partially when at least half of the rotations do.
- id: fig4c-subspace-excursion-angles
  statement: Across conditions, each rotation's planes spanned 6 to 20 distinct dimensions with
    angles above 45 degrees to each other, and more that varied above chance.
  source: Results, Rotational planes differed across reaches, paragraph 2; Figure 4c;
    Supplementary Figure 4b
  quote: Across conditions for each rotational frequency, SEA identified 6–20 distinct dimensions
    with angles >45° to each other in motor cortex activity, and far more that varied above chance
  depends_on:
  - fig4b-plane-alignment
  criterion: Subspace excursion angles as in the Methods, computed to 25 dimensions (code
    subspaceExcursionAngles.m called with 25, angles from subspacea.m), the seed and sequence
    optimised as the code does. Per rotation and dataset, the count of excursion angles above 45
    degrees. Reproduced when every count lies in 5.4 to 22 (the rule for ranges, over rotations and
    datasets), and in each dataset the angles exceed the half-split noise angles (code
    singleFrequencyOverlapControl.m, fraction of noise SEA above the data) for more dimensions than
    the count above 45 degrees.
- id: rotation-orientation-dimensionality
  statement: Rotation orientations required 23 to 40 principal components to capture 80% of their
    variance, had 7 to 33 dimensions with SNR above 1, and participation ratios of 16.7 to 36.8.
  source: Results, Rotational planes differed across reaches, paragraph 2; Methods, Estimating the
    dimensionality of each rotation's orientations
  quote: Rotation orientations required 23–40 principal components to capture 80% of their total
    variance, had 7–33 dimensions with an SNR > 1 45 , and had participation ratios 46 of
    16.7–36.8.
  depends_on:
  - fig3g-basis-frequencies
  criterion: Per rotation, PCA across conditions of the rotation's loading columns (the PCA input
    is open between (a) the two columns of each condition stacked as observations, (b) the
    rotation's activity, loading columns times basis functions). PCs to 80% and participation
    ratio from that PCA; SNR dimensionality by the half-split procedure of the Methods (100 folds,
    the dimensionality maximising the alignment index between partitions; code
    crossValidateDimensionalityRotations.m). Each range judged by the rule for ranges, over
    rotations and datasets (20.7 to 44; 6.3 to 36.3; 15.03 to 40.48), under one reading.
- id: fig4d-jpca-variance-correlation
  statement: Variance in the jPCA planes was only moderately correlated with the total rotational
    variance of a condition (rho 0.39 to 0.46; 66% of jPCA planes correlated at p < 0.05).
  source: Results, Rotational planes differed across reaches, paragraph 3; Figure 4d
  quote: 'variance in the jPCA planes was only moderately correlated with the variance in the
    rotations we identified (Fig. 4d ; Pearson''s Rho = 0.39–0.46, 66% of jPCA planes correlated at
    p < 0.05)'
  expected:
    quantity: share of retained jPCA planes correlated at p < 0.05
    value: 66
    tolerance: 6.6
    unit: percent
  depends_on:
  - jpca-fit-r2
  - tbf-variance-explained
  criterion: Methods, Explaining variability in jPCA-identified rotations. Per condition, the
    variance due to the rotational basis functions after the same soft normalisation and mean
    subtraction as jPCA, against the variance in each retained jPCA plane (six planes in all, two
    per M1 dataset and one per PMd dataset); Pearson correlation per plane. Over 72 conditions any
    rho above about 0.23 has p < 0.05, so the rho range and the 66% cannot both describe every
    plane. Readings for the range are (a) per dataset, the mean rho over its retained planes; (b)
    the rho of the planes correlated at p < 0.05. Reproduced when, under one reading, the values
    lie in 0.351 to 0.506 and the share of planes with p < 0.05 is within tolerance (4 of 6
    planes is 67%); partially when one of the two holds.
- id: fig4f-plane-alignment-explains-jpca
  statement: Conditions without clear rotations in the jPCA planes had rotations misaligned with
    those planes; the alignment index with the jPCA plane correlated strongly with the variance
    jPCA captured (rho 0.82 to 0.97).
  source: Results, Rotational planes differed across reaches, paragraph 3; Figure 4e, f
  quote: Instead, for conditions that did not exhibit clear rotations in the jPCA planes, the
    rotations our model discovered were misaligned with the jPCA planes (Fig. 4e, f ; Pearson's Rho
    = 0.82–0.97 between plane alignment and variance explained by jPCA, p < 0.001).
  statistics:
  - test: Pearson correlation
    p: 0.001
    p_relation: "<"
  depends_on:
  - jpca-fit-r2
  criterion: Per condition, the alignment index of the condition's total rotational activity onto
    each retained jPCA plane, correlated across conditions with the variance in that plane
    (Methods; code corrOverlapWithjPCA.m). Reproduced when every plane's rho lies in 0.738 to 1
    with p < 0.001; partially when at least half do.
- id: fig5a-frequencies-segregated
  statement: Different-frequency rotational planes on pairs of conditions were nearly orthogonal,
    and same-frequency planes were better aligned.
  source: Results, Different-frequency rotations occupied distinct yet coordinated subspaces,
    paragraph 1; Figure 5a; Supplementary Figure 5
  quote: the different-frequency pairs were consistently nearly-orthogonal, and the corresponding
    rotations were better aligned (Fig. 5a ; Wilcoxon signed-rank test, p < 0.001; Supplementary
    Fig. 5 )
  statistics:
  - test: Wilcoxon signed-rank test
    p: 0.001
    p_relation: "<"
  depends_on:
  - fig4b-plane-alignment
  criterion: Alignment indices of each rotation on one condition onto the same rotation and onto
    each other rotation on a different condition (Methods; code
    quantifyProjectedVarianceDifferentFrequencies.m). The pairing of the signed-rank test is open,
    reading (a) the same ordered condition pairs, same against different frequency; the code's
    rank-sum test of the two distributions is reading (b). Reproduced when, under one reading, for
    every rotation and every other rotation in every dataset, same-frequency alignment is higher
    with p < 0.001; partially when at least 80% of the comparisons do.
- id: fig5c-rotations-predict-rotations
  statement: Each rotation's parameters on a condition predicted 43 to 94% of the variance of a
    different-frequency rotation, with one model for all conditions, above chance.
  source: Results, Different-frequency rotations occupied distinct yet coordinated subspaces,
    paragraph 2; Figure 5c
  quote: Each rotation predicted an average of 43–94% of the variance in other rotations (s.d.
    <25%, 6-fold cross-validation), significantly greater than expected by chance (Fig. 5c ;
    Wilcoxon signed-rank test, p < 0.001).
  statistics:
  - test: Wilcoxon signed-rank test
    p: 0.001
    p_relation: "<"
  depends_on:
  - fig3g-basis-frequencies
  criterion: Methods, Predicting rotations from other rotations or the state space location, with
    code predictOneComponentFromAnother.m and oneComponentToAnother.m. Six folds over conditions;
    TBF, loadings and a ridge map (lambda 0.1, with intercept) fitted on 5/6; the predictor's
    vectorised columns reduced to the singular vectors holding 80% of the summed singular values
    (code); test loadings by projecting the held-out condition on the training basis; variance of
    the true rotation explained per condition. Null as in the code, each rotation taken from a
    random condition. Mean per predictor and predicted pair (off the diagonal), judged by the rule
    for ranges over pairs and datasets (38.7 to 100%), and every pair above its null at p < 0.001
    by a signed-rank test (the code's rank-sum test a variant).
- id: suppfig6a-location-alignment
  statement: The state space location occupied different dimensions across conditions, less
    aligned than expected from estimation noise (ROC-AUC 0.88 to 0.95).
  source: Results, Motor cortex rotations were location-dependent, paragraph 1; Supplementary
    Figure 6a
  quote: 'The state space location subspace was multi-dimensional: the dimensions occupied across
    conditions were less aligned than expected due to estimation noise (ROC-AUC = 0.88–0.95;
    Wilcoxon signed-rank test, p < 0.001; Supplementary Fig. 6a ).'
  statistics:
  - test: Wilcoxon signed-rank test
    p: 0.001
    p_relation: "<"
  depends_on:
  - fig4b-plane-alignment
  criterion: As fig4b-plane-alignment, with the single offset column in place of a plane (Methods).
    Reproduced when every dataset's AUC lies in 0.792 to 1 with observed alignment lower and p <
    0.001.
- id: suppfig6b-location-dimensionality
  statement: SEA found 4 to 5 state space location dimensions with angles above 15 degrees; the
    locations needed 21 to 30 PCs for 80% of their variance, had 5 to 12 dimensions with SNR above
    1, and participation ratios of 15.1 to 26.4.
  source: Results, Motor cortex rotations were location-dependent, paragraph 1; Supplementary
    Figure 6b
  quote: SEA identified 4–5 state space location dimensions with angles >15° (Supplementary Fig. 6b
    ). ... The state space location required 21–30 principal components to capture 80% of the total
    variance, had 5–12 dimensions with an SNR > 1, and had participation ratios of 15.1–26.4.
  depends_on:
  - rotation-orientation-dimensionality
  criterion: As fig4c-subspace-excursion-angles and rotation-orientation-dimensionality, on the
    offset column. Rule for ranges (3.6 to 5.5 SEA dimensions above 15 degrees; 18.9 to 33 PCs; 4.5
    to 13.2 SNR dimensions; participation ratio 13.59 to 29.04), each judged separately;
    reproduced when all four hold.
- id: suppfig6c-location-distinct-from-rotations
  statement: State space location dimensions were distinct from those of the rotations.
  source: Results, Motor cortex rotations were location-dependent, paragraph 1; Supplementary
    Figure 6c
  quote: Moreover, the state space location dimensions were distinct from those of rotations (same
    analysis as Fig. 5a ; Wilcoxon signed-rank test, p < 0.001; Supplementary Fig. 6c ).
  statistics:
  - test: Wilcoxon signed-rank test
    p: 0.001
    p_relation: "<"
  depends_on:
  - fig5a-frequencies-segregated
  criterion: As fig5a-frequencies-segregated, location against location compared with location
    against each rotation. Reproduced when location-to-location alignment is higher with p < 0.001
    in every dataset.
- id: fig6b-location-predicts-rotations
  statement: The state space location linearly predicted the rotations' parameters, explaining on
    average 67 to 80% of the population variance, above chance.
  source: Results, Motor cortex rotations were location-dependent, paragraph 2; Figure 6b
  quote: The state space locations predicted an average of 67–80% of the total population variance
    (Fig. 6b ; s.d. <15%, 6-fold cross-validation), significantly greater than expected by chance
    (Wilcoxon signed-rank test, p < 0.001).
  statistics:
  - test: Wilcoxon signed-rank test
    p: 0.001
    p_relation: "<"
  depends_on:
  - fig3g-basis-frequencies
  criterion: Methods, Predicting rotations from other rotations or the state space location. The
    offset column predicts the vectorised remaining columns by ridge regression (lambda 0.1), 6
    folds over conditions; the observed offset column joined to the prediction, times the basis
    functions, gives the predicted activity; population variance explained per condition. Null,
    offsets and rotations shuffled between conditions, signed-rank test. The code
    (offsetToRotations.m) uses 2 folds, lambda 0.01 and an SVD reduction of the predictor to 90% of
    the summed singular values with an intercept; it is shown as a variant. Reproduced when every
    dataset's mean lies in 60.3 to 88% and p < 0.001 against the null.
- id: fig6c-location-tracks-direction
  statement: In a PCA of the state space locations across conditions, location related to the
    overall reach direction, from starting point to target, in a continuous manner.
  source: Results, Reach kinematics correlate with state space location, paragraph 1; Figure 6c
  quote: Qualitatively, state space location related to the overall direction from starting point
    to target in a continuous manner (Fig. 6c ).
  depends_on:
  - fig3g-basis-frequencies
  criterion: The paper reports this qualitatively and gives no measure. PCA of the offset columns
    across the 72 conditions; conditions plotted on PCs 1 and 2 coloured by target angle, as in
    Figure 6c. The measure is open; the reading named here is the circular correlation between
    target angle and the angle of each condition in the PC 1 to 2 plane, with neighbours in target
    angle neighbours in the plane. Reproduced when that correlation is positive with p < 0.05 in
    every dataset (or all four after a sign flip of a PC); the plots are shown.
- id: fig6e-kinematics-predict-location
  statement: Four reach parameters linearly predicted 37 to 71% of the variance in state space
    location, and kernel regression 69 to 81%, both above chance.
  source: Results, Reach kinematics correlate with state space location, paragraph 1; Figure 6d, e
  quote: Reach parameters linearly predicted 37–71% of the variance in state space location (6-fold
    cross-validation), greater than expected by chance (shuffle, p < 0.001). Allowing nonlinearities
    via kernel regression raised the variance explained to 69–81% of the variance in state space
    (6-fold cross-validation; shuffle, p < 0.001).
  statistics:
  - about: linear regression against shuffle
    test: shuffle
    p: 0.001
    p_relation: "<"
  - about: kernel regression against shuffle
    test: shuffle
    p: 0.001
    p_relation: "<"
  depends_on:
  - fig3g-basis-frequencies
  criterion: Reach parameters per condition are the least-squares coefficients of hand x and y
    position over -350 to +850 ms on two kinematic basis functions (Methods, Extracting kinematic
    basis functions; code predictDataUsingTBFandKinCondStructure.m). The basis functions
    (kinFuncEval) are not in the code; readings are (a) the top two velocity singular vectors of
    an SVD over all conditions of the datasets, integrated to position; (b) their skew-normal and
    skew-normal-derivative fits (the Methods say the results were essentially identical). The
    code for this regression is not published; following LDR encoding, ridge regression (lambda
    0.1) with intercept from the four parameters to the offset column, 6 folds over conditions,
    variance explained in the offset column over held-out conditions. The kernel is open between
    (a) the Ornstein-Uhlenbeck kernel, length scale 10^3, of the LDR encoder and (b) the Gaussian
    kernel, length scale 400, lambda 0.1, of the rotation predictions (Methods). Shuffle, reach
    parameters permuted across conditions; the paper gives no count, and 1000 permutations is a
    standard choice, the fewest that can give p < 0.001. Reproduced when, under one reading,
    every dataset's linear value lies in 33.3 to 78.1% and kernel value in 62.1 to 89.1%, both
    above all permutations.
- id: fig7c-ldr-encoding
  statement: Predicting each condition's loading matrix from four reach parameters and multiplying
    by the shared basis functions explained 60 to 78% of the population variance with a linear
    model and 71 to 87% with kernel regression, above chance.
  source: Results, Reach kinematics correlate with the dynamics of motor cortex activity, paragraphs
    3 and 4; Figure 7b, c
  quote: 'This linear LDR-encoding model explained most of the population variance: 60–78% (s.d.
    <22%, 6-fold cross-validation), greater than expected by chance (Wilcoxon signed-rank test, p <
    0.001). ... This nonlinear LDR encoding model explained 71–87% of the population variance (s.d.
    <17%, 6-fold cross-validation)'
  statistics:
  - about: linear LDR encoding against shuffle
    test: Wilcoxon signed-rank test
    p: 0.001
    p_relation: "<"
  - about: nonlinear LDR encoding against shuffle and memorization
    test: Wilcoxon signed-rank test
    p: 0.01
    p_relation: "<"
  depends_on:
  - fig6e-kinematics-predict-location
  criterion: Methods, LDR encoding, and code kinToTBF.m. Reach parameters as in fig6e (both
    readings); ridge regression (lambda 0.1) with intercept to the vectorised loading matrix; 6
    folds over conditions with TBF and loadings refitted on 5/6; kernel regression with the
    Ornstein-Uhlenbeck kernel, length scale 10^3, no penalty (code); population variance explained
    per held-out condition. Null, neural activity permuted across conditions, signed-rank test.
    Reproduced when, under one kinematic reading, every dataset's linear mean lies in 54 to 85.8%
    and nonlinear mean in 63.9 to 95.7%, with p < 0.001 and p < 0.01 against the nulls.
- id: suppfig7a-not-memorization
  statement: With targets held out by sextant, kernel-regression LDR encoding outperformed
    nearest-neighbour regression, so it was not memorization of the training set.
  source: Supplementary Figure 7a; Methods, Controlling for nonlinear LDR encoding
  quote: The higher performance of kernel regression indicates that nonlinear LDR encoding was not
    merely memorization of the training set.
  depends_on:
  - fig7c-ldr-encoding
  criterion: Conditions divided into six sextants of target angle; nonlinear LDR encoding and the
    same model with nearest-neighbour regression trained on five sextants and tested on the sixth;
    per-condition variance explained compared by a Wilcoxon signed-rank test (Methods; code
    predictDataUsingTBFandKinNN.m). Reproduced when kernel regression is higher with p < 0.01 in
    every dataset.
- id: fig7c-standard-encoding-worse
  statement: Standard instantaneous encoding models (linear multi-parameter, kernel regression on
    position, kernel regression on velocity) were substantially outperformed by both linear and
    nonlinear LDR encoding.
  source: Results, Reach kinematics correlate with the dynamics of motor cortex activity, paragraph
    5; Figure 7b, c; Methods, Comparing the LDR encoding with standard instantaneous encoding models
  quote: We quantified the performance of various linear and nonlinear standard encoding models and
    found they were substantially outperformed by both linear and nonlinear LDR encoding models (Fig.
    7b, c ; Wilcoxon signed-rank test, p < 0.001).
  statistics:
  - test: Wilcoxon signed-rank test
    p: 0.001
    p_relation: "<"
  depends_on:
  - fig7c-ldr-encoding
  criterion: The three standard models of the Methods with a 100 ms causal lag, ridge lambda 0.1
    for the linear model, Ornstein-Uhlenbeck kernels with length scales 10^12 (position) and 10^11
    (velocity); per-condition variance explained, cross-validated over the same 6 folds of
    conditions (the code's linearControls.m and nonlinearControls.m decide where the Methods are
    silent). Reproduced when both LDR models exceed each standard model with p < 0.001 in every
    dataset; partially when they do in at least half of the 24 comparisons.
- id: fig7f-ldr-decoding
  statement: A linear LDR-based decoder applied to single-trial spiking explained on average 84 to
    92% of the variance in hand position over time.
  source: Results, LDR allows linear decoding of single-trial kinematics, paragraph 2; Figure 7d-f;
    Methods, LDR-based decoding
  quote: Despite using only linear operations on spiking activity, this LDR-based decoder on average
    explained 84–92% of the variance in the hand's position over time (s.d. <15% across trials;
    2-fold cross-validation across conditions).
  depends_on:
  - fig6e-kinematics-predict-location
  criterion: Two folds over conditions (Results and code kinFromTBFSingleTrial.m; the Methods say
    6-fold but describe halves). On the training half, TBF on trial averages (raw SVD basis, code
    predictKinUsingTBFandDataCondStructureSingletrial.m) and a ridge map with intercept from
    vectorised loadings to the four reach parameters; the penalty is not in the Methods and is 10
    in the code. Single-trial loadings of the held-out half are 1 ms spike counts summed in 10 ms
    bins, scaled to spikes/s, times the pseudo-inverse of the basis; predicted parameters times the
    kinematic basis functions give hand position; variance explained per trial (code
    getVarExplainedKinematics.m, negatives set to 0). Kinematic readings as in fig6e. Reproduced
    when, under one reading, every dataset's mean over trials lies in 75.6 to 100%. The Methods'
    condition-shuffled null with a signed-rank test is run and reported; the paper reports no
    result for it, so it does not decide.
- id: fig7f-decoder-beats-standard
  statement: The LDR-based decoder outperformed every other offline decoder tested, including GPFA
    denoising followed by nonlinear decoders.
  source: Results, LDR allows linear decoding of single-trial kinematics, paragraph 2; Figure 7f
    legend; Methods, Comparing LDR-based decoding to instantaneous decoding methods
  quote: This decoder outperformed every other standard offline decoder we tested, including
    combining acausal de-noising methods such as Gaussian Process Factor Analysis 45 with nonlinear
    decoders (Fig. 7d–f ; Wilcoxon signed-rank test, p < 0.001 vs. every other tested decoder for
    all datasets).
  statistics:
  - test: two-sided Wilcoxon signed-rank test
    p: 0.001
    p_relation: "<"
    n: 1469 trials for monkey J, 2014 trials for monkey N
  depends_on:
  - fig7f-ldr-decoding
  criterion: The comparison decoders of the Methods, 100 ms lag; linear (ridge lambda 1) and
    Ornstein-Uhlenbeck kernel regression (length scale 10^2, L2 0.1) on spikes smoothed with 20 or
    100 ms Gaussians, trained on single trials or on trial averages, and on GPFA trajectories. GPFA
    latent dimensionality and bin size are not given and not in the code; readings are 8 and 15
    latents, 20 ms bins. Per-trial variance explained of position compared by two-sided signed-rank
    tests on the same trials. Reproduced when LDR decoding is higher with p < 0.001 against every
    decoder in every dataset; partially when it is against all but the GPFA decoders.
- id: suppfig8-no-output-potent-dependence
  statement: Removing dimensions that encoded hand position, hand velocity and muscle activity
    produced no substantial degradation in LDR decoding.
  source: Results, LDR allows linear decoding of single-trial kinematics, paragraph 3;
    Supplementary Figure 8
  quote: Identifying and removing dimensions that encoded hand position, hand velocity, and muscle
    activity produced no substantial degradation in decoding quality (Supplementary Fig. 8 ;
    Wilcoxon signed-rank test, p = 0.04–0.96).
  statistics:
  - about: lowest of the reported range
    test: Wilcoxon signed-rank test
    p: 0.04
  - about: highest of the reported range
    test: Wilcoxon signed-rank test
    p: 0.96
  depends_on:
  - fig7f-ldr-decoding
  criterion: A claim of absence. Output-potent dimensions as in the code removePotent.m (the
    Methods do not describe them), the row space of least-squares maps from activity to hand
    position and velocity and to EMG, projected out of each condition's activity before decoding
    (code kinFromTBFNoPotent.m, ridge 1, 2 folds). Variance explained per condition with and without
    the potent dimensions, two-sided signed-rank test. The paper reports p from 0.04 to 0.96 and
    calls none a substantial degradation, so no fixed threshold applies; reproduced when every
    dataset's p is at least 0.036 (the lowest reported, less 10%), not reproduced otherwise. The
    mean drop is reported either way. If the dataset holds no EMG, the kinematic dimensions alone
    are removed and the outcome rests on that.
- id: trial-curvature-decoding
  statement: The LDR decoder followed trial-by-trial variation in reach curvature within a
    condition (rho 0.16 to 0.41).
  source: Results, LDR allows linear decoding of single-trial kinematics, paragraph 4; Methods,
    Quantifying the trial-to-trial fidelity of decoding within condition
  quote: Using an LDR-based decoder, however, we were able to decode trial-by-trial variations in
    reach curvature (Pearson's rho, 0.16–0.41; p < 0.001), indicating that our model decoded fine
    variations in movement.
  statistics:
  - test: Pearson correlation
    p: 0.001
    p_relation: "<"
  depends_on:
  - fig7f-ldr-decoding
  criterion: The third and fourth reach parameters (x and y curvature) of each decoded trial and of
    the trial's own hand path, each minus its condition mean (code studyAroundMeanParams.m);
    Pearson correlation over all held-out trials of a dataset, per parameter. Reproduced when the
    eight correlations (two parameters, four datasets) lie in 0.144 to 0.451 with p < 0.001 (rule
    for ranges over the eight).
checks:
- date: 2026-11-20
  kind: agent
  model: claude-opus-5-5
  ready: true
  changes:
  - fig3a-eigenvalue-clusters. The criterion required at least three complex pairs, but an LDS of 5 dimensions (within the 5 to 9 of fig2c) holds only two. The pairs are now judged as far as each dataset's dimensionality allows, in frequency order.
  - fig3c-eigenvalue-distance-auc. The code's vector norm was the main distance and the legend's average a variant. The Figure 3b legend and the Methods both give a mean over corresponding eigenvalues, so that is now the main measure and the code's norm the variant.
  - fig4b-plane-alignment (and suppfig6a-location-alignment, which follows it). The criterion set aside the Results' signed-rank test for the code's rank-sum test. The paper's test can be run with per-condition pairing, so that is now reading (a) and the rank-sum test reading (b). The Methods' 36 repeats now decide, with the code's 200 as a variant, as the file's own rule says.
  - fig4d-jpca-variance-correlation. The criterion required every plane's rho in 0.351 to 0.506 and also 4 of 6 planes at p < 0.05. Over 72 conditions every rho above about 0.23 is significant, so the two cannot both hold. Named two readings for the rho range (mean per dataset; significant planes only).
  - fig6e-kinematics-predict-location. The 1000 permutations are not in the paper; now marked as a standard choice.
  - fig7f-ldr-decoding. Removed the requirement to beat a condition-shuffled null at p < 0.001. The statement does not claim it and the paper reports no result for that null. It is now reported and does not decide.
  - suppfig8-no-output-potent-dependence. The statistics recorded p > 0.04, which the paper does not say; it reports p = 0.04 to 0.96. Now recorded as the two exact ends of the range.
  - Open. suppfig3-model-comparison compares a cross-validated TBF value with in-sample jPCA and LDS values. The Supplementary Figure 3 legend says the comparison is cross-validated, and the Methods give no held-out variance for jPCA or the single-condition LDS. The mix stays as the main reading, with all in-sample as the variant.
  - Open. suppfig8-no-output-potent-dependence uses p of at least 0.036 as its threshold for absence. The paper calls p = 0.04 not a substantial degradation and gives no threshold, so this is the file's own reading.
  - Open. fig6c-location-tracks-direction is qualitative in the paper; the circular correlation and its p < 0.05 are the file's reading.
  - Open. Many criteria rest on the code at commit b65f28d (windows, folds, penalties, SVD reductions, reach-duration definition). This check read only the paper and supplement and did not re-read the code, so those details are taken as the writer reported them.
