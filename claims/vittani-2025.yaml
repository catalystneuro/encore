  source: Results, Astrocytic cAMP Increase Leads to Arteriole Dilation in Anesthetized Mice,
    paragraph 4; Figure 2B; Figure S2A to C
  quote: A dose-dependent biphasic change in arteriole diameter change was observed, starting with
    an initial dilation followed by a constriction and eventual return to baseline
  criterion: Relative arteriole diameter as in SI Image Data Analysis, cohort 1 (3 arterioles from
