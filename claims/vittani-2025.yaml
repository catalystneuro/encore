- id: fig1f-camp-reproducible
  statement: The 1 s stimulation gave similar cAMP kinetic profiles at the first and the last
    recording, showing the stimulation is reproducible.
  source: Results, Astrocytic cAMP Increase Leads to Arteriole Dilation in Anesthetized Mice,
    paragraph 2; Figure 1F; Figure S1F
  quote: Of note, 1-s-long stimulation showed similar kinetic profiles at the first and last
    recordings, demonstrating a strong reproducibility of the stimulation paradigm
  criterion: A claim of absence, judged on the paper's test, two-sample paired t tests with
    Benjamini-Hochberg correction (alpha 0.05), recording 1 against recording 4, for peak, rise
    time, decay time and response duration (Figure 1G to J legend), on the 3 mice with both
    recordings. Reproduced when none of the four differs; not reproduced when any does. The
    correction family is open; (a) the six pairs of recordings within a parameter, (b) all pairs
    of all parameters. Differences of means are reported either way.
