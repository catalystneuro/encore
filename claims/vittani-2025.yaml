    first rises above baseline, then falls below it, then returns toward it before the recording
    ends, and the peak dilation increases from 0.2 s to 3 s. No threshold for "below baseline"
    is given; a minimum below zero is taken, a standard choice. Control arterioles (S2A to C)
    are shown for comparison.
