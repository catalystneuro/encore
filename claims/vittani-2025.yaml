# Claims for Vittani, Herlo, Wang et al. (2025), "Cerebral blood flow is modulated by astrocytic
# cAMP elevation independently of IP3R2-mediated Ca2+ signaling in mice", PNAS 122, e2422069122,
# on DANDI:001414.
#
# Provenance: written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub
# Actions"), 2026-11-10, protocol as stated in docs/protocol.md (Reader, steps 1 to 4).
#
# Text read: the version of record as served by Europe PMC (PMC12260423,
# paper/10.1073-pnas.2422069122.txt), main text, figure legends, Materials and Methods, and the
# SI Appendix (Supplementary Materials and Methods, legends of Figures S1 to S6, Tables S1 to
# S4), extracted from the supplement PDF. No figure was read from a PDF page; the main-text PDF
# is not under paper/. The dataset was known only from its title and description on the
# archive ("Dataset accompanying the paper ... by Vittani et al., 2024"; 121 subjects, 500 NWB
# files, one-photon microscopy, OnePhotonSeries and PlaneSegmentation). Its data were not seen.
#
# Code read: none. The paper links no code. Methods say images were preprocessed in ImageJ,
# analysed with "custom MatLab scripts", and all statistics done in GraphPad Prism 10. No
# method detail below is settled by code.
#
# Data the paper used (Results; Methods; SI Materials and Methods; figure legends).
# - Mice. C57BL/6J, 6 to 7 weeks, both sexes (Figures 1 to 3, 5, 6). IP3R2-/- and IP3R2+/+
#   littermates, 10 to 18 weeks, both sexes (Figure 4, Figure 5H to J, Figure S4R to Z).
#   Mlc1-PinkFlamindo transgenic mice for two-photon imaging (Figure S1I to K).
# - Viral vectors (retro-orbital). bPAC, PHP.eB/mGFAP(ABC1D)-2pabPAC(F198Y); cAMP sensor,
#   PHP.eB/mGFAP(ABC1D)-Lck-PinkFlamindo; Ca2+ sensor, PHP.eB/hGFAP(ABC1D)-RCaMP3 (one-photon)
#   or PHP.eB/hGFAP-GCaMP6f (two-photon); blood plasma, AAV8/P3-Alb-mScarlet. Controls lack
#   bPAC (sensor or Alb-mScarlet only).
# - One-photon macroscope imaging through a thinned skull over the right somatosensory cortex,
#   about 3 weeks after injection, anesthetized (ketamine 70 mg/kg, xylazine 10 mg/kg) or awake
#   and habituated. Per mouse, four time-lapse recordings of about 5 min at 5 Hz (1500 frames),
#   each 65 s baseline, LED stimulation (470 nm, continuous pulse), 4 min after. LED frames
#   removed in analysis. cAMP and Ca2+ imaging at zoom 2.5X (5.3 x 5.3 mm, 512 x 512 pixels);
#   vessel imaging at zoom 16X (834 x 834 um, 512 x 512 pixels).
# - Stimulation protocols. Figures 1, 2 and 5B to D (anesthetized), 5 mW LED in the four
#   recordings of 1 s, 0.2 s, 3 s and 1 s. Figures 3, 4, 5E to J (awake), 1 s at 5 mW in all
#   four. Figure 6 (anesthetized), 25 ms at 1 mW in all recordings. Sensory stimuli (Figure
#   S1L to Q, S4Z), tail shock (1.5 to 2 mA, 100 ms, after 30 s baseline) and air puff to the
#   left whiskers (100 ms pulses, 5 Hz, 20 psi, 0.5, 1 or 2 min, after 65 s baseline, about
#   10 min after).
# - Groups and sizes, as the legends give them.
#   Figure 1, cAMP, anesthetized WT, 4 bPAC mice (3 for recording 4); 5 control mice (S1B to E).
#   Figure 2, arterioles, anesthetized WT cohort 1, 3 arterioles from 2 bPAC mice and 3 from 2
#   control mice (S2A to C); cohort 2 with 1 s only, 27 arterioles from 5 bPAC mice and 24 from
#   5 control mice (S2E to K).
#   Figure S1M and N, startle cAMP, 3 anesthetized and 12 awake mice; S1O and P, whisker cAMP,
#   3 to 4 mice; S1Q, whisker arteriole, 18 arterioles from 5 mice.
#   Figure S1I to K, two-photon cAMP in a Mlc1-PinkFlamindo mouse (cranial window).
#   Figure 3, awake WT, cAMP 5 bPAC and 5 control mice; arterioles 33 from 5 bPAC mice and 31
#   from 5 control mice.
#   Figure 4, awake IP3R2, cAMP 6 IP3R2-/- and 6 IP3R2+/+ mice; arterioles 41 from 6 IP3R2-/-
#   and 34 from 5 IP3R2+/+ mice (the t tests report df = 34).
#   Figure 5, RCaMP3, anesthetized WT 5 bPAC and 5 control mice; awake WT 5 and 5; awake
#   IP3R2 4 IP3R2-/- and 3 IP3R2+/+ mice; S4Z startle Ca2+ in 4 IP3R2-/- and 3 IP3R2+/+ mice.
#   Figure S5E to I, two-photon GCaMP6f and Pink Flamindo, awake, 22 astrocytes from 3 mice.
#   Figure 6, mild stimulation, cAMP 4 mice; Ca2+ 4 mice (S6E to H says 5 bPAC and 5 control);
#   arterioles 13 from 6 bPAC and 14 from 4 control mice (I, J), 12 from 5 and 10 from 4 (K, L).
# - Measured variables. Pink Flamindo fluorescence (cAMP), RCaMP3 or GCaMP6f fluorescence
#   (Ca2+), Alb-mScarlet fluorescence of plasma, from which arteriole diameter is measured on
#   kymographs.
#
# Analysis methods the paper gives (SI Materials and Methods, Image Data Analysis), used in the
# criteria below and cited there as "SI Image Data Analysis".
# - cAMP, one-photon. TurboReg motion correction when needed; LED frames removed; one ROI over
#   the thinned skull area with good signal; mean ROI intensity per frame. Background, the mean
#   of a small ROI over the darkest vessel in the first frame (Blood Offset), subtracted from the
#   mean of the first 10 frames (Adjusted Offset). Photobleaching, a two-term exponential (exp2)
#   fitted to the baseline and the last 2 min, subtracted, accounting for the Adjusted Offset;
#   then dF/F0. Across recordings, an exponential decay fitted to recordings 1 and 4 and
#   subtracted (Corrected dF/F0). Parameters, peak, rise time, 80% decay time, response
#   duration (rise time plus decay time). Differentials after a median filter (n = 20,
#   anesthetized; n = 50 on traces and 20 on differentials, awake).
# - Ca2+, one-photon. As cAMP, without photobleaching correction.
# - Arterioles. TurboReg; LED frames removed; recording divided by a Gaussian-blurred (3D, SD 50
#   pixels) copy; rotated to align the arteriole; 3 to 5 rectangular ROIs along the arteriole
#   give kymographs; borders by full width at half maximum; diameter as their distance;
#   relative change normalized to baseline (dF/F0), mean filter (n = 20 at 5 mW, 5 at 1 mW),
#   averaged across kymographs; median filter (n = 100) then differential. Within the first
#   38.6 s (5 mW) or 14 s (1 mW) after the LED, area under the curve of the relative diameter
#   change, dilation duration of the first dilation event, and maximum dilation rate (peak of
#   the differential). For Figures 4 and 6, data with large vasomotion within 30 s before the
#   LED were excluded.
# - Timing. Mean cAMP (or RCaMP3) and arteriole traces normalized to their maximum as 1;
#   arteriole time-to-peak read on the traces, delay on the normalized differentials.
# - Statistics (Methods). Mean +/- SEM; t tests for two groups; paired t tests with
#   Benjamini-Hochberg FDR (alpha 0.05); one-way ANOVA with Tukey; two-way ANOVA; mixed-effects
#   (REML). The fractional degrees of freedom of the repeated-measures tests imply a
#   Geisser-Greenhouse correction, as Prism applies by default.
#
# Details the paper leaves open, named once here and in each criterion that uses them.
# - Time origin of rise time and time-to-peak. (a) the first frame after the LED (LED frames
#   removed); (b) LED onset. Table S1 gives a 0.45 s rise time for the 3 s LED, which fits (a).
# - "80% decay time". (a) time from the peak until the signal falls to 80% of the peak value;
#   (b) time until it falls by 80%, to 20% of the peak.
# - Baseline F0. (a) mean of the whole 65 s pre-LED baseline; (b) mean of the 30 s before the
#   LED (the window the vasomotion exclusion uses).
# - Whether peaks are read on the median-filtered or the unfiltered trace. Both are read.
# - Units of area under the curve and of maximum dilation rate ("a.u."). Readings, (a) sum
#   over frames (5 Hz) of the percent change, rate in percent per frame; (b) integral in
#   percent times seconds, rate in percent per second; (c) as (a) or (b) on the fractional
#   change. The reported magnitudes decide among them; each is shown.
# - The arteriole unit. (a) each arteriole averaged over the recordings it is in; (b) each
#   arteriole in each recording counted once.
# - Large vasomotion before the LED (Figures 4 and 6). No threshold is given. Readings, (a) no
#   exclusion; (b) exclusion of arterioles whose relative diameter in the 30 s before the LED
#   exceeds the post-LED peak of the group mean, a standard choice named as such.
# - Delay between cAMP and arteriole. (a) between the peaks of the two normalized
#   differentials; (b) between their onsets (first rise above zero after the LED); (c) from the
#   peak of the cAMP differential to the onset of the arteriole differential.
#
# Tolerances. A value printed with its SEM takes that SEM. A value without spread takes 10%.
# A time takes at least 0.2 s, one frame at 5 Hz, since no time is measured finer than a
# frame. A reported range is widened by 10% of each bound.
#
# Every claim's data are the paper's own one-photon or two-photon recordings or histology
# (data: dataset, the default). Whether DANDI:001414 holds the two-photon recordings, the
# sensory-stimulation recordings and the histology is for the author to find.
schema_version: 2
paper: doi:10.1073/pnas.2422069122
claims:
- id: fig1k-astrocyte-expression
  statement: After systemic injection, bPAC and Pink Flamindo are expressed selectively in
    astrocytes throughout the brain, including the cerebral cortex.
  source: Results, Astrocytic cAMP Increase Leads to Arteriole Dilation in Anesthetized Mice,
    paragraph 1; Figure 1K; Figure S1A
  quote: Three weeks postinjection, in vivo imaging ( SI Appendix , Fig. S1 A ) and histology (
    Fig. 1 K ) confirmed selective expression of bPAC and Pink Flamindo in astrocytes throughout
    the brain
  criterion: Judged on the histology images of cortical slices, if the dataset holds them. The
    paper gives no counts or test. Reproduced when both bPAC and Pink Flamindo fluorescence are
    seen in cells with astrocyte morphology in the cortex. Morphology is judged by eye, as the
    paper does; this is the only reading the paper allows.
- id: fig1b-camp-dose-dependent
  statement: In anesthetized mice, blue LED stimulation of bPAC raises astrocytic Pink Flamindo
    fluorescence (cAMP) in a dose-dependent way across 0.2, 1 and 3 s stimulation.
  source: Results, Astrocytic cAMP Increase Leads to Arteriole Dilation in Anesthetized Mice,
    paragraph 2; Figure 1B and C; Figure S1B to E
  quote: We observed a dose-dependent increase in fluorescence, reflecting cAMP elevation, in
    response to bPAC stimulation
  criterion: Pink Flamindo traces processed as in SI Image Data Analysis (Corrected dF/F0), per
    mouse, n = 4 bPAC mice. Reproduced when the mean peak after the LED is above zero for every
    stimulation length and increases from 0.2 s to 1 s (mean of recordings 1 and 4, as Table S1
    does) to 3 s, and the bPAC mean peak for 1 s exceeds the control mice's (Figure S1B, 5
    control mice). Baseline F0 readings (a) and (b) of the header are both run.
