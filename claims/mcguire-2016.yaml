- id: fig2ab-fms-smf-not-discriminated
  statement: All eight rats discriminated FFF from SSS but treated FMS and SMF as equivalent and
    intermediate; seven of eight showed no difference between FMS and SMF, and one rat (62SC) made
    more right choices to FMS than to SMF.
  source: Results, Behavioral Discrimination of FFF, FMS, SMF, and SSS Sequences, paragraph 3;
    Figure 2A and 2B
  quote: Seven out of eight rats failed to differentiate at all between FMS from SMF stimuli
    (proportion test, Bonferroni-adjusted p -value >0.00625). One rat (62SC) showed modest but
    significant discrimination, with more right-side choices to FMS than SMF stimuli ( p = 0.0039).
  statistics:
  - about: FMS against SMF right-choice fraction, each of seven rats
    test: proportion test
    p: 0.00625
    p_relation: ">"
    corrected: Bonferroni
    n: seven rats
  - about: FMS against SMF right-choice fraction, rat 62SC
    test: proportion test
    p: 0.0039
    n: one rat
  criterion: Per rat, over all its FFF-FMS-SMF-SSS sessions pooled, the fraction of right-port
    choices for each stimulus (Figure 2B, "all behavior sessions"). FMS against SMF is compared by
    a two-proportion test at the Bonferroni level 0.05/8 = 0.00625 (Results). The paper does not
    say which proportion test; the readings are (a) the chi-square test of two proportions with
    continuity correction, (b) the same without it (a two-proportion z test). Which trials count
    is also open; the readings are (i) all completed trials, (ii) completed trials excluding
    premature withdrawals and trials with no choice. Reproduced when, for every rat the data hold,
    FFF has a higher right-choice fraction than SSS, FMS and SMF both lie between them, and FMS
    against SMF is not significant at 0.00625 for every rat but 62SC, and for 62SC (if the data
    hold it) is significant with more right choices to FMS, under one reading. The paper
    tests eight rats; if the data hold fewer, the result is stated for those held and is at most
    partially reproduced.
