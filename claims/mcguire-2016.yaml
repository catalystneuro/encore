# Claims for McGuire, Telian, Laboy-Juarez, Miyashita, Lee, Smith & Feldman (2016), PLoS Biology
# 14(8) e1002549, on CRCNS ssc-4.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-10,
# protocol pilot-14 as stated in docs/protocol.md. The writer did not look at the dataset's data or
# files; only its title and the summary of its data descriptor were read, to know which experiments
# it holds.
#
# Text read: the version of record (open access), full text as served by Europe PMC (PMC5004814,
# JATS XML flattened), with the Methods and the legends of the supporting information (S1 to S7
# Figs, S1 Table, S1 and S2 Data). The contents of S1 Table (baseline firing rates by layer and unit
# type, DOCX) and of S1 and S2 Data (XLSX) are not in the text; no claim rests on numbers found only
# there. No PDF was supplied, so no figure could be read. Table 1 is garbled in the text: its
# sequence rows read "FFF 34 120 65.7 Right", "FMS 34 132 54.4 Right", "SMF 34 132 54.7 Left", "SSS
# 34 148 44.6 Left" under headers that do not fit. They are read here as interpulse interval (ms),
# duration (ms, matching the 120 to 148 ms of the Results), mean speed (mm/s, ordered as the
# Results say) and rewarded port.
#
# Code read: none. The paper links no code. The Methods say the regression was run in Matlab and
# the decoders in Python with scikit-learn; neither script is published.
#
# Data the paper used. Female Long-Evans rats (>3 months). Task: the rat enters a nose poke with
# its right C, D and E row whiskers on a panel; 75 to 100 ms later the panel delivers one of four
# three-impulse sequences, FFF, FMS, SMF or SSS (F, M, S impulses of 16, 22, 28 ms; 34 ms gap
# between impulses; impulse onsets 50 to 62 ms apart); the rat holds 250 ms, then chooses the right
# port (rewarded for FFF and FMS) or the left (SMF and SSS). Eight rats were trained on this task
# (behaviour, Figure 2, S2 Fig); six also ran a fixed-panel control. Two other rats (58B, 60W) ran
# an FSFS against SFFS task without recordings (Figure 3). Recordings: four tetrodes in S1 (C1-4,
# D2-4, E3 columns), advanced about 140 um every one or two sessions from L2/3 to L6, 80 sessions
# in five rats (18FB, 18Ri, 18Ro, 62BS, 107St), 306 single units and 167 multi-unit clusters (473
# units). Each unit has a depth (layer boundaries L2/3 200-650 um, L4 650-975, L5a 975-1285, L5b
# 1285-1575, L6 1575-2200 um), a single or multi-unit label, and an RS or FS label (FS when
# trough-to-peak width < 0.375 ms). Per trial: stimulus, nose poke entry, stimulus onset, drink
# port choice and nose poke withdrawal time. The panel speed profile of each sequence is in S1 Fig
# and S2 Data. High-speed video of 43 trials (4 rats) is summarised in S6 Fig, with data in S2
# Data. The dataset's descriptor says it holds the spike and trial data of the five recorded rats
# over 80 sessions, the basis of Figures 4 to 9.
#
# Method details used across claims, from the Methods. Temporally modulated units: permutation
# test on 10-ms bins, 10,000 permutations, p < 0.05 (Methods, Temporal response modulation). PSTHs
# in 1 ms bins aligned to first impulse onset. Mean impulse-evoked rate in 5-35 ms after impulse
# onset; impulse baseline 0-10 ms before impulse onset; impulse-responsive units by t test of the
# two (Methods, Stimulus-evoked responses). Unit classes from the regression of firing rate (5-ms
# bins, 0-180 ms after stimulus onset, all trials of each sequence) on panel speed integrated over
# 5 to 180 ms windows (Methods, Stimulus regression). Decoders per Methods, Neural Decoders.
