    accuracy.
  source: Results, Neural Decoding of Stimulus Identity and Behavioral Choice, paragraph 2; Figure
    9B
  quote: 'This model predicted sequence identity, using one single-trial spike train per model unit,
    with 83% overall accuracy (range: 74% for FMS to 88% for FFF spike trains). ... Remarkably, this
    model identified SMF and FMS sequences with 78% accuracy, even though rats could not.'
