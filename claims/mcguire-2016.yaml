  expected:
  - quantity: overall accuracy
    value: 83
    tolerance: 8.3
    unit: percent
  - quantity: accuracy for FMS
    value: 74
    tolerance: 7.4
    unit: percent
  - quantity: accuracy for FFF
    value: 88
    tolerance: 8.8
    unit: percent
  - quantity: accuracy for FMS and SMF
    value: 78
    tolerance: 7.8
    unit: percent
  criterion: Per the Methods (Neural Decoders) each unit has four logistic functions (one per
    stimulus, one against all) on spike counts in 10-ms bins 0 to 150 ms after onset; 70% of each
    unit's trials fit, the rest test; each unit's outputs normalised to equal weight; population
    prediction the stimulus of highest summed probability, the test trial for each unit drawn at
    random from its test trials of that stimulus (units recorded in different sessions combined
    as independent); 300 repeats, mean performance. Open, with readings. The logistic regression
    penalty and the use of "k-fold cross-validation" allow (a) scikit-learn LogisticRegression defaults
