    Signed-rank test of each group's correlations against zero (Figure S13C legend). Reproduced
    when the outside-field correlations of plastic cells are below zero (p < 0.05) and those of
    rigid cells are not, neither group's overall-rate correlations differ from zero at p < 0.05,
    and neither group's within-field correlations are above zero at p < 0.05.
