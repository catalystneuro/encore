- id: figs5b-abs-r-above-null
  statement: Absolute weighted correlations of ripple events exceed those of the shuffled null
    in PRE, MAZE and POST, and the POST minus PRE increase is larger in the observed than in the
    null data.
  source: Figure S5B
  quote: Note that in all three epochs, a greater degree of sequence content is observed than
    expected by chance
  datasets:
  - "000044"
  - crcns-hc-11
  criterion: Events and shuffles as in fig1c-above-chance. Per the Figure S5B legend, observed
