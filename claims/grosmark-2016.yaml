  - "000044"
  - crcns-hc-11
  criterion: Windows as in fig4c-pre-fast-coactivation, on the POST - PRE change of mean
    coactivity. Reproduced when the change falls with the window's rate rank (Spearman over
    windows, p < 0.05, a standard choice) and, per Figure S16C, the low-rate half's mean change
    exceeds the high-rate half's (rank-sum over pairs, p < 0.05; Figure S16C marks it ***), under
    both readings of the ranking.
  depends_on:
  - place-cell-count
  - rate-split-medians
