- id: fig3b-plastic-improve
  statement: Plastic but not rigid cells steadily increased their spatial specificity during maze
    running.
  source: Figure 3B; Results, paragraph 3; Figure S13C; Figure S19F
  quote: plastic but not rigid neurons increased their spatial specificity steadily during
    learning
  datasets:
  - "000044"
  - crcns-hc-11
  criterion: The Figure 3B panel is not available here, and its legend's measure, "infield
    versus outside field firing ratios", is not defined further. Readings (a) the percentage of
    spikes inside the place field(s) per lap (Figure S19F, which its legend says to compare to
    Figure 3B; that figure excludes the 26 PRE-only cells, here all rigid and plastic cells are
    used); (b) the within-field rate over the overall lap rate (Figure S13C, cited with Figure
    3B in the main text); (c) the within-field rate over the outside-field rate per lap, the
    legend's words. Only laps with at least 5 spikes from the cell, running above 5 cm/s (Figure
    S13 legend); per cell, the Pearson correlation of the measure with lap number. Tests per the
    Figure S13C legend, a signed-rank test of each group's correlations against zero and a
    rank-sum test between groups. Reproduced when plastic cells' correlations are above zero (p
    < 0.05), rigid cells' are not, and plastic exceeds rigid (p < 0.05), under readings a, b and
    c.
  depends_on:
  - rigid-plastic-counts
