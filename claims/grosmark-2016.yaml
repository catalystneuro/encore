  quote: Moreover, it was the slow-firing cells that showed the greatest replay (partial
    correlation across coactivation values between RUN and POST, accounting for PRE)
  datasets:
  - "000044"
  - crcns-hc-11
  criterion: Windows as in fig4c-pre-fast-coactivation; in each window, the partial correlation
