- id: fig4c-pre-fast-coactivation
  statement: In PRE sleep, pair-wise coactivation was dominated by fast-firing neurons, and
    their correlations stayed unchanged into POST sleep.
  source: Figure 4B and 4C legends; Results, paragraph 4
  quote: In PRE sleep, coactivity was dominated by fast-firing neurons, and these correlations
    remained unchanged into POST sleep
  datasets:
  - "000044"
  - crcns-hc-11
  criterion: Per the Figure 4B and 4C legends, place cells sorted by session firing rate and
    grouped in overlapping windows of 20% of cells stepped by 1%; in each window, the mean
    coactivity of its pairs (different shanks) in PRE and in POST. Whether ranks are taken
    within session or pooled is open (readings (a) percentile of rate within session, curves
    averaged over sessions; (b) pooled); "session firing rate" as in fig4a-rigid-faster. The
    legends name no test; the Spearman and signed-rank tests here are standard choices, not
    the paper's. Reproduced when PRE coactivity rises with the window's rate rank (Spearman over
    windows, p < 0.05; the windows overlap, so the p-value is indicative) and the POST - PRE
    change in the fastest window is not significant (signed-rank over its pairs, p >= 0.05),
    under both readings; partially reproduced when the PRE dominance holds and the stability
    does not. Figure S16B marks a small but significant (*) PRE to POST increase in coactivity
    for the high-rate half of the cells, so "unchanged" is read from the Figure 4C curves, and
    the size of the fastest window's change is reported against the slowest window's.
  depends_on:
  - place-cell-count
