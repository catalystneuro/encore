  - fig1c-post-gt-pre
- id: figs2-track-distribution
  statement: Rigid and plastic cells' place fields are similarly distributed along the track,
    both enriched near the start and goal ends.
  source: Results, paragraph 2; Figure S2 legend
  quote: Rigid and plastic neurons were similarly distributed along the track
  datasets:
  - "000044"
  - crcns-hc-11
  criterion: The paper shows this only as rate maps and gives no test, so the test is open.
    Measure, each cell's peak place-field position (per running direction) as a fraction of
    track length from the start of the run. Readings (a) a two-sample Kolmogorov-Smirnov test of
    rigid against plastic positions; (b) a rank-sum test of the distance of each peak from the
    nearer track end. Reproduced when neither reading finds a difference at p < 0.05; the
    fractions of fields in the outer fifths of the track are reported for each group.
  depends_on:
