    mazes, which is 54% of pyramidal cells by running direction.
  source: Results, paragraph 2; Materials and Methods, Animals, Surgery and Data Collection;
    Figure S2 legend; Figure S19 legend
  quote: constructed from the firing-rate vectors of place cells ( n = 491 cells) during track
    running (eight novel exploration sessions) ... In total, 562 well isolated pyramidal cells
    were included in this study ... Note that 54% of all putative pyramidal cells were
    considered to have place fields by running direction
  datasets:
  - "000044"
  - crcns-hc-11
  expected:
  - quantity: place cells, per running direction
    value: 491
    tolerance: 49.1
  - quantity: pyramidal cells
    value: 562
    tolerance: 56.2
  - quantity: percentage of pyramidal cells with place fields, by running direction
    value: 54
    tolerance: 5.4
    unit: '%'
  criterion: Pyramidal cells as the dataset's putative cell types label them. Place fields by
    the place-field method of the opening comment (Methods, Place Field Analysis), per running
    direction on the linear mazes and once on the circular maze. The denominator of 54% is open;
