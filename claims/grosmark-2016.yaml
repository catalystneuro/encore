- id: fig1c-above-chance
  statement: Ripple-event sequence scores (rZ) are above chance in each of PRE, MAZE and POST.
  source: Figure 1C legend; Figure S6 (per animal)
  quote: Cumulative distribution of rZ for PRE, MAZE, and POSTevents, and 95% confidence
    intervals ... Sign-rank tests were used for within-condition significance testing
  datasets:
  - "000044"
  - crcns-hc-11
  criterion: Events, decoding and rZ by the ripple-event and Bayesian replay methods of the
    opening comment. Tests from the Figure 1C legend ("Sign-rank tests were used for
    within-condition significance testing"), a signed-rank test of rZ against zero in each
    epoch. Reproduced when rZ is above zero in all three epochs at p < 0.05 under all readings of
    Y, L, S and D. The time-bin-shuffle rZ of Figure S22B is shown as a variant.
  depends_on:
  - place-cell-count
- id: fig1c-post-gt-pre
  statement: Sequence scores (rZ) of ripple events are higher in POST sleep than in PRE sleep
    (replay).
  source: Figure 1C; Figure S5 title; Figure S6 (per animal); Results, paragraph 2
  quote: Cumulative distribution of rZ for PRE, MAZE, and POSTevents ... Inset, mean ± SE of
    sequence scores in each condition. *P < 0.05; **P < 0.005; ***P < 0.0005 (Kruskal-Wallis
    test, followed by post hoc Tukey-Kramer tests)
  datasets:
  - "000044"
  - crcns-hc-11
  criterion: Events and rZ as in fig1c-above-chance. Test from the Figure 1C legend, a
    Kruskal-Wallis test on rZ across PRE, MAZE and POST followed by Tukey-Kramer comparisons.
    Reproduced when mean POST rZ exceeds mean PRE rZ with Tukey-Kramer p < 0.05 under all
    readings of Y, L, S and D. The Figure 1C panel values are not available here, so no level is
    fixed. Figure S6 (read from the panels) shows POST above PRE in three of the four animals and
    not in animal B; the per-animal results are reported and compared with it. The bootstrap
    test of the POST - PRE change of |r| against the null change (Figure S5B, right) is shown.
  depends_on:
