- id: sessions-and-tracks
  statement: Recordings were made in four rats, in eight novel exploration sessions, each a PRE
    rest and sleep epoch in the home cage, a MAZE epoch on one of two linear tracks or a circular
    track in a novel room, and a POST rest and sleep epoch in the home cage.
  source: Results, paragraph 2; Materials and Methods, Behavioral Procedures and Behavioral State
    Scoring, paragraph 2; Figure S1
  quote: Simultaneous recordings of well-isolated CA1 pyramidal single units were performed in four
    rats ... exploration of one of two linear or a circular track (MAZE) ... preexperience sleep
    (PRE) and postexperience sleep (POST) ... (eight novel exploration sessions)
  datasets:
  - "000044"
  - crcns-hc-11
  expected:
  - quantity: rats
    value: 4
    tolerance: 0
  - quantity: novelty sessions
    value: 8
    tolerance: 0
  criterion: Counts as the Methods give them (4 rats; 4, 1 and 3 sessions on the three mazes).
    Reproduced when the data hold 4 subjects and 8 sessions, each with PRE, MAZE and POST epochs
    in this order, and the MAZE positions come from linear tracks in 5 sessions and a circular
    track in 3; the track lengths are reported.
- id: place-cell-count
