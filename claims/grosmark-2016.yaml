- id: fig3a-plastic-specificity
  statement: On the novel maze plastic cells have higher place specificity than rigid cells and
    fewer place fields.
  source: Figure 3A; Results, paragraph 3; Figure S19E
  quote: Plastic neurons had higher place-specific indices and fewer place fields compared with
    rigid cells
  datasets:
  - "000044"
  - crcns-hc-11
  criterion: The Figure 3A panels are not available here; Figure S19E, which its legend says to
    compare to Figure 3A, repeats the analysis with the 26 PRE-only cells excluded (Figure S19D
    and E) and shows six measures, within/outside place-field rate ratio, information
    per spike, information per second, spatial coherence, place-field stability and number of
    place fields, and marks every one as significant, plastic higher on the first five and
    lower on the number of fields. Measures as in reference 32 (Mizuseki et al. 2012) per the
    Methods (Place Field Analysis); the stability split is not given here (readings (a) first
    against second half of the maze epoch; (b) odd against even laps). Rank-sum test, rigid
    against plastic (Figure 3A legend). Judged on all rigid and plastic cells of
    rigid-plastic-counts, the Figure 3A population; the Figure S19E subset without PRE-only
    cells is shown as a variant. Reproduced when plastic cells are higher on all five
    specificity measures and have fewer place fields, each at p < 0.05, under one stability
    reading; partially reproduced when the direction holds for all six but fewer reach p < 0.05.
  depends_on:
