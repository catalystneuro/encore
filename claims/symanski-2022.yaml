claims:
- id: fig1b-performance
  statement: During recordings the rats performed the odor-place task at a high level, 77.0% correct
    (mean and s.e.m. over the 8 rats, 1.3%).
  source: Results, Odor-place associative memory and decision-making task, paragraph 2; Figure 1b
  quote: animals maintained a high level of performance on the task, indicating accurate decision
    making based on cued recall of odor-place associations ( Figure 1b , n=8 rats, 77.0% ± 1.3%, mean
    ± s.e.m.)
  expected:
  - quantity: mean over rats of the per-rat mean session performance
    value: 77.0
    tolerance: 1.3
    unit: percent correct
  criterion: Performance is the proportion of correct trials (Methods, Odor-place association task
    training), per session (run epochs of a recording day), odor-cued sessions only. The code
    computes it per epoch and averages (F16/Behavior/cs_performanceScatter.m); the Methods do not
    say whether trials with sampling under 0.5 s count, and the code keeps them in the performance
    vector (cs_getNosepokeWindow.m lines 186 to 223). Readings (a) mean over rats of each rat's mean
    session performance, (b) mean over all sessions, each with and without the short-sampling trials.
    Reproduced when one reading falls within 77.0 +/- 1.3%.
- id: fig1c-sampling-duration
  statement: Odor sampling lasted 0.82 s on average (s.e.m. across sessions 0.02 s; s.d. across
    trials 0.25 s) and did not differ between correct and incorrect trials.
  source: Results, Odor-place associative memory and decision-making task, paragraph 3; Figure 1c;
    Figure 1-figure supplement 1a
  quote: The average odor-sampling duration before odor port disengagement and odor offset was
    0.82±0.02 s (mean ± s.e.m. across sessions), and this duration was similar between correct and
    incorrect trials ( Figure 1c ; within-session signed-rank test, p=0.71
  statistics:
  - test: Wilcoxon signed-rank, within session
    p: 0.71
    n: 38 sessions
  expected:
  - quantity: mean sampling duration across sessions
    value: 0.82
    tolerance: 0.02
    unit: s
  - quantity: s.d. of sampling duration across trials
    value: 0.25
    tolerance: 0.025
    unit: s
  criterion: Duration is odor port beam-break offset minus onset (Methods). Per session the mean
    duration on correct and on incorrect trials; a Wilcoxon signed-rank test across the 38 sessions,
    as the Results and legend name it. Absence claim, reproduced when that test gives p >= 0.05. The
    code tests the same per-session means with a rank-sum test (F16/Behavior/cs_nosepokeDuration_2.m
    line 65), shown as a variant. The effect size (median paired difference) is reported.
- id: fig1d-turn-direction
  statement: On most trials the rat turned away from the odor port toward the side of the reward arm
    it then chose, on correct and incorrect trials alike, so the choice is made during odor sampling.
  source: Results, Odor-place associative memory and decision-making task, paragraph 3; Figure 1d
  quote: Notably, we observed that on a majority of trials (95.4% ± 0.12%), the animals' turn direction
    away from the odor port matched the direction of the T-maze reward arm that they would ultimately
    choose on that trial
  statistics:
  - about: correct trials, same against opposite direction
    test: binomial test
    p: 0
    n: 1,624 same and 32 opposite direction trials
  - about: incorrect trials, same against opposite direction
    test: binomial test
    p: 1.4e-108
    n: 499 same and 21 opposite direction trials
  expected:
  - quantity: trials with turn matching the chosen arm
    value: 95.4
    tolerance: 0.12
    unit: percent
  - quantity: correct trials, same direction
    value: 1624
    tolerance: 162
  - quantity: correct trials, opposite direction
    value: 32
    tolerance: 3
  - quantity: incorrect trials, same direction
    value: 499
    tolerance: 50
  - quantity: incorrect trials, opposite direction
    value: 21
    tolerance: 2
  criterion: Sessions on the truncated mazes are excluded (legend). Turn direction as in
    F16/Behavior/cs_turnFromNPDirection.m, which the Methods do not describe - the 41 position samples
    from odor port exit, the sample furthest in x from the odor port position, its sign giving left or
    right, trials within 40 samples of the epoch end dropped. A binomial test of same against opposite
    with null probability 0.5 (the code's binopdf(...,0.5)), per outcome. The 95.4% (with a spread of
    0.12% as printed) is read as (a) the mean over sessions or (b) the pooled fraction of all trials;
    the counts give 97.6% pooled. Reproduced when both binomial tests give p < 0.05 with more same than
    opposite turns and the counts fall within tolerance; the fraction is reported under both readings.
- id: fig1s1e-sniff-rate
  statement: Sniff rate measured by the nasal thermocouple rose slightly during odor sampling (7.1 Hz)
    compared with time-matched pre-odor periods (6.2 Hz).
  source: Results, Odor-place associative memory and decision-making task, paragraph 3; Figure
    1-figure supplement 1e
  quote: There was a small but significant increase in sniff rate during the odor sampling period
    (within-session increase 7.1±0.39 Hz, mean ± s.e.m.) compared to time matched pre-odor periods
    (6.2±0.29 Hz, mean ± s.e.m.)
  statistics:
  - test: signed-rank test
    p: 9.8e-4
    n: 11 sessions across 2 animals
  expected:
  - quantity: sniff rate during odor sampling
    value: 7.1
    tolerance: 0.39
    unit: Hz
  - quantity: sniff rate in pre-odor periods
    value: 6.2
    tolerance: 0.29
    unit: Hz
  criterion: Thermocouple signal of the two implanted animals. The Methods do not describe sniff
    detection; the code (F16/Behavior/cs_sniffRate.m) takes a pre-odor window of the same length as
    each trial's sampling ending at odor onset, smooths and downsamples by 25, counts peaks
    (Chronux findpeaks, whose threshold is not in the repository) and divides by window length,
    averaged per day, with a signed-rank test across days. Peaks are counted here as local maxima of
    the smoothed signal; a peak rule with a prominence threshold is shown as a variant. Reproduced
    when the signed-rank test gives p < 0.05 with odor above pre-odor and both rates within tolerance.
