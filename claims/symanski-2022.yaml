# Claims for Symanski, Bladon, Kullberg, Miller & Jadhav (2022), eLife 11, e79545, on dandiset 001539.
#
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21, protocol
# pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record (eLife, PMC9799972.1, as served by Europe PMC), full text with
# Results, all figure and figure-supplement legends, Methods, Code and Data availability. The only
# supplementary file, Supplementary file 1 (average CA1 and PFC cell counts per session), is a table
# that is not in the text; no claim rests on it. No PDF was supplied, so the figures were not seen;
# where a direction is only visible in a figure, the criterion says so.
#
# The data the paper used. Eight male Long-Evans rats (animals 1 to 5 ran the full T-maze with an
# 81 cm stem and 43 cm reward arms; animals 6 to 8 ran truncated mazes, two with reward wells beside
# the odor port and one with a 40 cm stem). A trial is one odor sampling period, from the infrared
# beam break at the odor port to its end; odor 1 (heptanol) cues reward location 1, odor 2 (ethyl
# butyrate) reward location 2; trials with sampling under 0.5 s are excluded from all analyses
# (Methods, Odor-place association task training). About 100 to 150 trials per day, in run epochs
# interleaved with sleep epochs. The paper counts 38 "sessions" (39 for some LFP panels); the code
# averages per recording day (F16/Behavior/cs_nosepokeDuration_2.m, cs_sniffRate.m), so a session is
# read here as a recording day. Four animals ran one un-cued air session each (air at the odor port,
# reward at a random well); Figure 1-figure supplement 1f gives three animals and four sessions.
# Two animals carried a nasal thermocouple (12 sessions in Figure 2b, 11 sessions in Figure
# 1-figure supplement 1e). Tetrodes in dorsal CA1 (spikes and LFP), PFC, mainly prelimbic (spikes and
# LFP), and olfactory bulb (LFP only); LFP at 1.5 kHz referenced to a cerebellar ground screw;
# position from an overhead camera at 30 frames/s. Units: 1,309 CA1 and 717 PFC. Spatial analyses use
# only full-maze sessions (Results gives 26 sessions from 6 rats; Methods says the five full-maze
# animals).
#
# Outside data. The paper deposited processed data (MATLAB structures) on figshare,
# doi:10.6084/m9.figshare.19620783.v1. No claim needs them; they hold the same recordings and could
# serve to check the dandiset against the paper's own selections.
#
# Code read: https://github.com/JadhavLab/Jadhav-Lab-Codes-JHB at commit
# 88d5f8d2bb39796b8656dc42bd42969a7bbe8697 (the commit the paper cites, archived at Software
# Heritage), folder BetaOdorProject. F16 below is BetaOdorProject/figures1-6Functions and F7 is
# BetaOdorProject/figure7Functions; the OLD folders were not used. The code holds two pipelines that
# often disagree. Path A is the first author's (F16, entry cs_Pipeline.m), using Chronux
# spectrograms and time-matched pre-odor windows. Path B is the revision code (F7, entry
# A_Figure7Wrapper.m, on a SuperRat structure), using fixed 500 ms windows and one tetrode per region.
# Nothing says which produced each published panel, so where they differ both are named as
# readings. Several helpers are missing from the repository (event_spikes, nFoldBayesPoisson,
# sj_extractripples, the filter .mat files, SelectivityIndex). The code disagrees with the Methods
# in places (cell-type thresholds, Pearson in place of Spearman, shuffle counts, a t-test in place
# of the rank-sum for the GLM); the Methods are followed and the code's choice is named as a variant.
#
# Definitions shared by the criteria below (each cites its source).
# - Trials. Completed trials with odor sampling of at least 0.5 s (Methods). Correct when the chosen
#   reward well matches the odor (F16/Behavior/cs_getNosepokeWindow.m). Sessions are recording days.
# - Bands. Beta 20 to 30 Hz and RR 7 to 8 Hz (Methods, Local field potential); Path A's filters and
#   some of its statistics use 15 to 30 Hz or 18 to 30 Hz (F16/Utilities/createbetafilter.m,
#   F16/LFPAnalysis/cs_LFPpower_prepost.m), a variant.
# - Cell types (Methods, Single unit analysis). Interneuron when the average firing rate exceeds 7 Hz
#   and the average spike width is under 0.3 ms; all other units putative pyramidal. The Methods do
#   not say over which epochs the rate is taken nor how width is measured. Readings: rate over run
#   epochs or over all epochs (Path A averages per-epoch rates over all epochs,
#   F16/Utilities/cs_cellTypeTag.m); width as trough-to-peak or as width at half the trough (the
#   code's cs_getSpikeWidth.m, method 2; lhcs_getSpikeWidth.m uses peak-to-trough). The code's own
#   thresholds (8.5 Hz with a width check between 8 and 9 Hz in Path A; 9.5 Hz without width in
#   F7/ParsePyrIN.m) are variants.
# - Active units. At least 100 spikes during the run epochs (Results; Methods says fewer than 100
#   spikes across all task epochs are excluded). Path A counts more than 100 spikes in any epoch
#   (F16/Spiking/cs_listNPCells_v2.m), Path B more than 100 across all run epochs
#   (F7/Object_selectivity.m); both are readings.
# - Odor period active. Spikes during the odor sampling periods at least equal to the number of
#   trials (Methods), over all trials of the day's run epochs (cs_listNPCells_v2.m line 123).
# - Task responsive (Methods, Task responsiveness). Per odor, a Wilcoxon signed-rank test of the
#   per-trial firing in the sampling period against a pre-odor window of the same length ending at
#   odor onset; responsive when p < 0.05 for at least one odor. The Methods take trials that reached a
#   reward port; both code paths use correct trials only, and Path A adds a third test on both odors
#   pooled (cs_listNPCells_v2.m lines 119 to 125). Readings: (a) all completed trials, (b) correct
#   trials only.
# - Choice selectivity (Methods, Choice selectivity; Results). SI = (r1 - r2)/(r1 + r2), r the mean
#   over correct trials of each trial's spike count divided by its sampling duration, for odor 1 and
#   odor 2. Selective when SI lies 1.5 s.d. or more from the mean of a null made by shuffling odor
#   labels across trials; 1000 shuffles, two-sided, as in F16/OdorSelectivitySingleCell/
#   cs_cellSelectivityTag.m (the Methods give no shuffle count). Tested in task-responsive cells.
# - Phase (Methods, Local field potential and Phase locking). Raw LFP (ground referenced) band-passed
#   with a zero-phase IIR filter, Hilbert phase with zero at the peak; the tetrode with the most cells
#   in each region on each day; spikes pooled over odor sampling periods. The Methods do not say which
#   trials; both code paths use correct trials (F16/PhaseLocking/cs_phaseLocking.m,
#   F7/ClaireBetaAnalysis.m), so correct trials are used. Locked when the Rayleigh test gives
#   p < 0.05. Minimum spike count is not in the Methods; readings more than 10 spikes (Path A,
#   cs_calcPhaseLocking.m) and more than 5 (Path B).
# - LFP pipelines, for the power and coherence claims (Methods, Local field potential; Results).
#   Chronux multitaper spectra and coherence, z-scored to the epoch mean, within-session differences
#   averaged per session, Wilcoxon signed-rank across sessions. The Methods leave open the tetrodes,
#   the windows and the taper settings. Reading A (Path A, F16/LFPAnalysis/sjcs_baselinespecgram.m,
#   cs_FullEpochCoherence.m, cs_LFPcoh_prepost.m): moving 1 s windows stepped by 20 ms (tapers [1 1]
#   for power, [2 3] for coherence), all tetrodes of a region with cells (all OB tetrodes) averaged,
#   all cross-region tetrode pairs averaged, each z-scored per frequency to its epoch mean and s.d.;
#   odor window the whole sampling period, pre-odor window of the same duration ending at odor onset.
#   Reading B (Path B, F7/ClaireCrossCoherence.m): coherencyc with tapers [3 5] on the last 500 ms of
#   sampling and the 500 ms before odor onset, trials with sampling of 0.5 to 2 s, one tetrode per
#   region (the one with most units, F7/gatherEEG.m), raw LFP z-scored over the recording.

