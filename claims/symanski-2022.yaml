    labels them, cs_predictChoice_GLM.m line 122) as response; binomial GLM, with the Methods' log link
    or the code's logit (line 142); five-fold cross-validation, accuracy the fraction of test trials
    correct; null from shuffled choice labels; rank-sum test of real against shuffled accuracy over
    sessions per window. Tolerance is one 0.1 s window step. The alignment is open, as the Methods
    use cumulative windows from odor onset (0-0.1 to 0-1.0 s; the plotted code,
    cs_trialPredictionGLM.m) and the Results speak of time before exit. Readings (a) windows from
