    or five of the six hold. The outcome is the one both readings give; when they differ the claim is
    blocked as methods_underspecified with both shown.
- id: fig2f-swr-odor-vs-reward
  statement: Sharp-wave ripples were rare during odor sampling and frequent at the reward wells.
  source: Results, Beta and RR coherence is elevated during odor sampling and decision making,
    paragraph 6; Figure 2f
  quote: However, a distinct lack of SWR events at the odor port ( Figure 2f ; signed-rank test,
    p=1.1e-7) suggests that SWR replay is unlikely to play a direct role in decision making
  statistics:
  - test: signed-rank test
    p: 1.1e-7
    n: 38 sessions
  criterion: Detection from the Methods (Sharp-wave ripple detection) - locally referenced CA1 LFP,
    150 to 250 Hz, Hilbert envelope above 3 s.d. of its mean for at least 15 ms on at least one CA1
    tetrode; tetrodes are the CA1 tetrodes with cells (F16/Ripples/cs_riptettag_anycells.m). The code
    keeps events at speed under 4 cm/s (cs_rippletimes.m), followed here. Number of SWRs per trial on
    correct trials (legend). Windows, which the Methods do not fix - (a) the odor sampling period and
    the reward-well period (reward-well beam break onset to exit); (b) the code's speed-defined stops
    around the odor port and around reward onset, the latter extended to at least 1 s
    (cs_rippleRate_NPvsReward.m). Per session the mean count per trial in each window; signed-rank
    across sessions (legend; the code's rank-sum over trials is a variant). Reproduced when p < 0.05
    with fewer SWRs at the odor port under a reading, and the readings agree.
- id: fig2s1f-rr-beta-coupling
  statement: Beta amplitude was coupled to RR phase in CA1, PFC and OB during odor sampling.
  source: Results, Beta and RR coherence is elevated during odor sampling and decision making,
    paragraph 2; Figure 2-figure supplement 1f
  quote: During the decision-making period, we also found phase-amplitude coupling between beta and RR
    rhythms in all three regions
  statistics:
  - test: modulation index against trial-shuffled null, 500 shuffles
    p: 0.001
    p_relation: "<"
  criterion: Tort modulation index as in the Methods (Cross-frequency coupling) - RR phase in 18 bins
    of 20 degrees, mean beta amplitude per bin normalized to sum 1, MI from the KL distance to the
    uniform; null from 500 shuffles of the trial assignment of RR phase series (Methods and legend).
    Per region, the local tetrode with most cells (as for phase locking; the Methods do not name the
    tetrode for this analysis), odor sampling periods. The Methods do not say which trials; readings
    all completed trials and correct trials only. The code restricts samples to high OB beta periods
    and shuffles amplitudes across samples (F16/LFPAnalysis/cs_cfc.m), a variant. The legend shows
    one real MI per region against a trial-shuffled null, so MI is pooled over the trials of all
    sessions; per-session MIs are reported as a variant. Reproduced when the pooled MI exceeds all 500
    shuffles in each region; partially when that holds in one or two regions. The outcome is the one
    both trial readings give; when they differ the claim is blocked as methods_underspecified.
- id: fig2s2d-phase-offsets
  statement: During odor sampling CA1 beta led PFC beta, and CA1 RR led PFC and OB RR, though offsets
    varied widely across sessions.
  source: Figure 2-figure supplement 2d; Results, Beta and RR coherence is elevated during odor
    sampling and decision making, paragraph 7
  quote: During the full odor sampling window, CA1 beta lead PFC (p = 2e-4) and there was no
    consistent phase difference between OB and PFC or CA1 beta (all p>0.05). Similarly, CA1 RR lead
    PFC RR (p < 1e-5), as well as OB (p < 1e-5)
  statistics:
  - about: beta, CA1 leads PFC
    p: 2.0e-4
  - about: RR, CA1 leads PFC
    p: 1.0e-5
    p_relation: "<"
  - about: RR, CA1 leads OB
    p: 1.0e-5
    p_relation: "<"
  - about: beta, OB against PFC and CA1
    p: 0.05
    p_relation: ">"
  criterion: The paper names no test. From F7/ClairePhaseOffset.m - per trial the circular mean of the
    instantaneous phase difference over the last 500 ms of sampling (trials of 0.5 to 2 s), the
    circular mean over trials per session, one tetrode per region (most units), and a test of the
    session offsets against zero by a sign-flip null of 100,000 draws taking the smaller tail; the
    code's circ_mtest is a variant. The legend's "full odor sampling window" against the code's last
    500 ms gives readings (a) whole sampling period, (b) last 500 ms. The legend also says no
    consistent offset between OB and CA1 RR, which contradicts CA1 RR leading OB; only the stated
    leads are tested for RR. Reproduced when the CA1 beta lead over PFC and the two RR leads are
    significant (p < 0.05) in the stated direction and the beta OB pairs are not. The outcome is the
    one both window readings give; when they differ the claim is blocked as methods_underspecified.
- id: fig2s1e-run-theta-shift
  statement: After odor port exit, as the rat ran, the dominant LFP frequency in CA1 and PFC shifted
    slightly from RR up into the theta band.
  source: Results, Beta and RR coherence is elevated during odor sampling and decision making,
    paragraph 1; Figure 2-figure supplement 1e
  quote: Following odor port disengagement and the initiation of running down the track, we observed
    a small shift in the dominant LFP frequency from RR to the theta band in CA1 and PFC
  criterion: Full-maze animals only (legend). The paper gives no test; the code
    (F16/LFPAnalysis/cs_peakFreqOdorVRun.m with cs_PSD.m) takes power spectra (fpass 0 to 20 Hz,
    1 s windows) from 0 to 3 s after odor onset, splits them at 0.8 s into odor and run parts, finds
    the peak frequency per day and compares odor and run by a signed-rank test. The search range in
    the code is set by array indices; it is read as the theta band the paper defines, 6 to 12 Hz.
    Readings for the windows (a) the code's 0 to 0.8 s and 0.8 to 3 s after odor onset, (b) the odor
    sampling period and run after exit at speed over 3 cm/s. Reproduced when the run peak is higher
    than the odor peak with signed-rank p < 0.05 in CA1 and in PFC; partially for one region. The
    outcome is the one both window readings give; when they differ the claim is blocked as
    methods_underspecified.
