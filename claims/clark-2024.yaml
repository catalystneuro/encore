  statistics:
  - about: TAG against TIG
    test: pairwise comparison of estimated marginal means
    statistic: T = 0.562, DF = 4.12
    p: 0.8
  criterion: A claim of absence, judged on the paper's test as in CompareGroups.Rmd, lmer(log(mean
