  source: Figure 3-figure supplement 6B; Results, Grid cells switch between task-anchored and
    task-independent firing, paragraph 3
  quote: among all grid cells periods of task-anchored or task-independent firing extended in blocks across
    multiple trials, with the distribution of block lengths substantially different to that generated
    by shuffled data
  statistics:
  - test: Kolmogorov-Smirnov test
    statistic: KS = 0.066
    p: 0.0003
    n: 1765 blocks (data), 2359 blocks (shuffled)
  expected:
  - quantity: blocks in the data
    value: 1765
    tolerance: 176.5
  - quantity: blocks in the trial-shuffled data
    value: 2359
    tolerance: 235.9
  criterion: As vr_grid_cells.add_rolling_stats_shuffled_test and get_block_lengths_any_code do, per
    grid cell, runs of identical rolling window classes, excluding aperiodic runs, with lengths
    divided by the number of windows in the session; shuffled data reorder the trials of the rate
    map once per cell, recompute the periodograms and classify with the same adjusted threshold.
    KS test of pooled data against pooled shuffled block lengths (plot_rolling_lomb_block_lengths_vs_shuffled).
    Reproduced when p < 0.05 and the data have fewer blocks than the shuffled data (longer
    blocks). The shuffle is random; the result of the run made is reported.
  depends_on:
  - fig3f-switching-within-session
- id: fig3s7-trial-type-ratio
  statement: The percentage of beaconed trials in a session did not affect how often grid cells
    showed task-anchored coding.
  source: Figure 3-figure supplement 7B
  quote: The percentage of beaconed trials did not have a significant effect on the occurrence of task-anchored
    coding
  statistics:
  - test: ANOVA comparison of binomial GLMMs with and without % beaconed trials
    statistic: Χ2 = 0.032, DF = 1
    p: 0.95
  criterion: A claim of absence, judged on the paper's test as the legend gives it, binomial GLMMs
    (logit) with and without percentage of beaconed trials as a fixed effect, random effects of
    mouse, session and neuron, compared by likelihood ratio. No code for it is in the repository.
    The response is not stated. The readings are (a) per trial, TA (1) against any other class (0),
    and (b) per trial, TA against TI with aperiodic trials dropped. Reproduced when p >= 0.05 under
    the reading run; if the readings give different outcomes the claim is methods_underspecified.
    The fitted slope is reported.
  depends_on:
  - fig3f-switching-within-session
- id: fig4e-grid-agreement-higher
  statement: Simultaneously recorded grid cells agreed strongly in their trial-by-trial firing
    mode, with agreement greater between grid cell pairs than between pairs involving non-grid
    cells, whose agreement was more variable and lower on average.
  source: Figure 4D-E; Results, Grid cells switch between task-anchored and task-independent firing,
    paragraph 4
  quote: Agreement was greater between grid cell pairs than between pairs involving non-grid cells
  statistics:
  - about: G-G against NG-NG
    test: pairwise comparison of estimated marginal means
    statistic: T = –10.455, DF = 10,720
    p: 1.0e-4
    p_relation: "<"
  - about: G-G against G-NG
    test: pairwise comparison of estimated marginal means
    statistic: T = –8.415, DF = 10,710
    p: 1.0e-4
    p_relation: "<"
  - about: NG-NG against G-NG
    test: pairwise comparison of estimated marginal means
    statistic: T = –6.853, DF = 10,352
    p: 1.0e-4
    p_relation: "<"
  criterion: Agreement of a cell pair is the fraction of trials with the same trial-level class,
    over each unordered pair of cells in a session, aperiodic trials included (Methods;
    generate_agreement_dataframe). The pairwise contrasts have the denominator degrees of freedom of
    the agreement_analysis.Rmd model on differences, lmerTest lmer(diff ~ comp + (1 |
    mouse/session)) with emmeans, where diff is a pair's agreement minus the mean of its 10 shuffled
    agreements. The shuffle splits the trial classes of one cell into runs and reorders them at
    random. That model is the main reading, and the notebook's lmer on raw agreement is a variant.
    The printed T values are all negative although G-G is reported higher, so the sign is taken
    from the text. Reproduced when the G-G estimate exceeds both NG-NG and G-NG with p < 0.05 for
    both contrasts.
  depends_on:
  - grid-cell-count
- id: fig4e-agreement-above-shuffle
  statement: For grid-grid, non-grid-non-grid and grid-non-grid pairs, agreement in firing mode
    differed from that of shuffled trial classifications.
  source: Figure 4E legend
  quote: Agreement in the firing mode between each combination of grid (G) and non-grid (NG) cells and corresponding
    scores for the shuffled data (lower), and the difference between the shuffled and actual scores
  statistics:
  - about: G-G, data against shuffled
    test: generalised linear mixed model (beta), ANOVA
    statistic: Χ2 = 58.89, DF = 1
    p: 1.0e-13
    p_relation: "<"
  - about: NG-NG, data against shuffled
    test: generalised linear mixed model (beta), ANOVA
    statistic: Χ2 = 20.42, DF = 1
    p: 1.0e-5
    p_relation: "<"
  - about: G-NG, data against shuffled
    test: generalised linear mixed model (beta), ANOVA
    statistic: Χ2 = 30.37, DF = 1
    p: 1.0e-7
    p_relation: "<"
  criterion: As agreement_analysis.Rmd (mod_fit) does, per pair type, glmmTMB beta models of agreement
    with and without a shuffled (0/1) fixed effect, pairs with agreement exactly 0 or 1 dropped,
    compared by anova. The notebook fits two random-effect structures, which are the two readings.
    They are (a) session nested in mouse and (b) cell j nested in cell i nested in session nested in
    mouse; the Methods do not say which was reported. Reproduced when all three pair types have
    p < 0.05 under both readings; if the readings differ the claim is methods_underspecified. The
    direction of each difference (data against shuffled) is reported.
  depends_on:
  - fig4e-grid-agreement-higher
- id: fig4f-nongrid-spatial-information
  statement: The drop in spatial information when the grid population was task-independent, relative
    to when it was task-anchored, was greater for grid cells than for non-grid cells, which kept
    similar spatial information.
  source: Figure 4F; Results, Grid cells switch between task-anchored and task-independent firing,
    paragraph 4
  quote: Non-grid cells also differed from the grid cell population in that their activity maintained similar
    spatial information between trials when grid cells were task-anchored versus when they were task-independent
  statistics:
  - about: grid against non-grid difference
    test: linear mixed model, ANOVA against null model
    statistic: Χ2 = 21.1, DF = 1
    p: 1.0e-5
    p_relation: "<"
  - about: grid cells against zero
    test: estimated marginal mean against zero
    statistic: T = 2.723, DF = 11.87
    p: 0.018
  - about: non-grid cells against zero
    test: estimated marginal mean against zero
    statistic: T = –1.278, DF = 2.58
    p: 0.3
  criterion: In each session with grid cells, the grid consensus class per trial is the mode of
    the grid cells' trial classes. With two disagreeing cells, the Methods pick one at random; the
    code (add_spatial_imformation_during_dominant_modes) takes scipy's mode, which resolves ties
    to task-anchored; the Methods are the main reading and the code a variant. Equal numbers of
    consensus TA and TI trials are drawn at random, and spatial information is computed for every
    cell on each set. The measure is diff = (SI_TA - SI_TI) / SI_TA. As GridvsNonGrid.Rmd does,
    lmer(diff ~ grid_cell + (1 | mouse/session)) against the null model, and emmeans of each group
    tested against zero. Reproduced when the group effect has p < 0.05, the grid mean is above zero
    with p < 0.05, and the non-grid mean has p >= 0.05 against zero.
  depends_on:
  - fig3f-switching-within-session
- id: fig6b-stable-beaconed-similar
  statement: In sessions with stable grid codes, the proportion of hit trials on cued (beaconed)
    trials was similar whether grid firing was task-anchored or task-independent.
  source: Figure 6B; Results, Task-anchored coding by grid cells is selectively associated with
    successful path integration-dependent reward localisation, paragraph 2
  quote: On cued trials the spatial organisation of stopping behaviour ( Figures 5C vs D and 6A ) and the proportion
    of hit trials ( Figure 6B ) was similar for both groups
  statistics:
  - test: binomial GLMM, ANOVA against null model
    statistic: Χ2 = 2.70, DF = 1
    p: 0.1
  criterion: A claim of absence, judged on the paper's test. Stable sessions are those with a grid
    cell having one mode, TA or TI, on > 85% of its trials (Figure 6 legend); the code's >= 0.85
    of rolling windows (generate_long_form_for_R_by_session) is a variant and is shown.
    One cell represents a session (drop_duplicate_sessions keeps the first in table order, which
    sets the class of a session holding both a stable TA and a stable TI cell; both assignments are
    shown if such a session exists). Trials are those not rejected; hit = 1, try and run = 0. As
    behaviour_analysis_grid_cells_stable_sessions.Rmd does, glmer(hit ~ class + (1 | mouse/session) +
    (0 + class | mouse/session), binomial logit, bobyqa) against the null model on beaconed trials.
    Reproduced when p >= 0.05; not reproduced when p < 0.05. Hit percentages per class are reported
    (per session, then averaged over mice, as Figure 6B plots).
  depends_on:
  - fig3f-switching-within-session
- id: fig6b-stable-uncued-reduced
  statement: In sessions with stable grid codes, the proportion of hit trials on non-beaconed and
    probe trials was substantially reduced when grid firing was task-independent.
  source: Figure 6B; Results, Task-anchored coding by grid cells is selectively associated with
    successful path integration-dependent reward localisation, paragraph 2
  quote: while the proportion of hit trials was substantially reduced ( Figure 6B )
  statistics:
  - about: non-beaconed trials
    test: binomial GLMM, ANOVA against null model
    statistic: Χ2 = 5.24, DF = 1
    p: 0.022
  - about: probe trials
    test: binomial GLMM, ANOVA against null model
    statistic: Χ2 = 4.55, DF = 1
    p: 0.033
  criterion: Sessions, trials and model as in fig6b-stable-beaconed-similar, fitted to non-beaconed
    and probe trials separately. Reproduced when both have p < 0.05 with the TI hit proportion
    lower; partially reproduced when one does.
  depends_on:
  - fig6b-stable-beaconed-similar
- id: fig6a-stable-stop-density
  statement: In sessions with stable grid codes, stopping on non-beaconed and probe trials was
    spatially organised around the reward zone when grid activity was task-anchored, but largely not
    when it was task-independent; on cued trials it was similar in both.
  source: Figure 6A; Figure 5C-D; Results, Task-anchored coding by grid cells is selectively
    associated with successful path integration-dependent reward localisation, paragraph 2
  quote: on non-beaconed and probe trials stopping behaviour was clearly spatial when grid activity was task-anchored,
    but spatial organisation was largely absent when grid activity was task-independent
  criterion: Stable sessions as in fig6b-stable-beaconed-similar (trial reading main, window reading
    a variant), one cell per session within each class as
    plot_stop_histogram_for_stable_cells_averaged_over_cells selects them, stop density relative to the uniform shuffled
    baseline per session (Methods; SD 1 cm smoothing, the code's 2 bins as a variant), averaged over
    sessions with SEM. The paper gives no measure of "spatial". The readings are (a) the mean
    baseline-subtracted density in the reward zone (90 to 110 cm) is above zero by more than its SEM
    across sessions, (b) the maximum of the averaged profile between 30 and 170 cm lies in the
    reward zone. Reproduced when, under both readings, non-beaconed and probe trials are spatial for
    TA and not for TI, and beaconed trials are spatial for both. If the readings differ the claim is
    methods_underspecified.
  depends_on:
  - fig6b-stable-beaconed-similar
- id: fig6d-epochs-beaconed-similar
  statement: Over all sessions, at the trial level, the proportion of hits on beaconed trials was
    similar whether grid cells were task-anchored or task-independent.
  source: Figure 6D; Results, Task-anchored coding by grid cells is selectively associated with
    successful path integration-dependent reward localisation, paragraph 3
  quote: On cued trials the spatial organisation of stopping behaviour ( Figures 5E–F – 6C ), and the proportion
    of hit trials ( Figure 6D ), was similar irrespective of whether grid cell fields were task-anchored
    or task-independent
  statistics:
  - test: binomial GLMM, ANOVA against null model
    statistic: Χ2 = 2.84, DF = 1
    p: 0.09
  criterion: A claim of absence, judged on the paper's test. One row per grid cell and trial; rejected
    trials and trials classed aperiodic or unclassified dropped; hit = 1, try and run = 0. As
    behaviour_analysis_grid_cells.Rmd does, glmer(hit ~ class + (1 | mouse/session/cell) + (0 + class
    | mouse/session/cell), binomial logit, bobyqa) against the null model, beaconed trials.
    Reproduced when p >= 0.05; not reproduced when p < 0.05. Hit percentages per class are reported,
    per cell then averaged over sessions and mice as plot_percentage_hits_for_remapped_encoding_cells_averaged_over_cells does.
  depends_on:
  - fig3f-switching-within-session
- id: fig6d-epochs-nonbeaconed-reduced
  statement: Over all sessions, at the trial level, the proportion of hits on non-beaconed trials
    was reduced when grid firing was task-independent.
  source: Figure 6D; Results, Task-anchored coding by grid cells is selectively associated with
    successful path integration-dependent reward localisation, paragraph 3
  quote: and the proportion of successful trials was reduced compared with when grid firing was task-anchored
    ( Figure 6D )
  statistics:
  - test: binomial GLMM, ANOVA against null model
    statistic: Χ2 = 10.14, DF = 1
    p: 0.001
  criterion: Model as in fig6d-epochs-beaconed-similar, non-beaconed trials. Reproduced when p < 0.05
    with the TA coefficient positive (more hits when task-anchored).
  depends_on:
  - fig6d-epochs-beaconed-similar
- id: fig6d-epochs-probe
  statement: On probe trials the proportion of hits was lower when grid firing was task-independent,
    though the paper's test for probe trials was not significant.
  source: Figure 6D; Results, Task-anchored coding by grid cells is selectively associated with
    successful path integration-dependent reward localisation, paragraph 3
  quote: On average, spatial stopping behaviour was reduced on non-beaconed and probe trials during which grid
    firing was task-independent ( Figure 6C ), and the proportion of successful trials was reduced
  statistics:
  - test: binomial GLMM, ANOVA against null model
    statistic: Χ2 = 1.70, DF = 1
    p: 0.19
  criterion: Model as in fig6d-epochs-beaconed-similar, probe trials. The text states a reduction and
    the legend's test is not significant, so the claim is judged on direction. Reproduced when the
    mean hit percentage for TI is below that for TA (per cell, then session, then mouse, as the
    figure code averages) and the GLMM coefficient for TA is positive. The p-value is reported.
  depends_on:
  - fig6d-epochs-beaconed-similar
- id: fig6c-epoch-stop-density
  statement: Over all sessions, spatial stopping on non-beaconed and probe trials was reduced on
    trials when grid firing was task-independent, while on cued trials it was similar.
  source: Figure 6C; Results, Task-anchored coding by grid cells is selectively associated with
    successful path integration-dependent reward localisation, paragraph 3
  quote: On average, spatial stopping behaviour was reduced on non-beaconed and probe trials during which grid
    firing was task-independent ( Figure 6C )
  criterion: Per grid cell, baseline-subtracted stop density over its TA trials and over its TI
    trials (rejected trials dropped), averaged across cells with weights equal to the cell's
    fraction of trials in that mode times 1 / (grid cells in its session) (Methods, Analysis of
    behaviour; get_session_weights). The readings for "spatial" are those of
    fig6a-stable-stop-density, and "reduced" means the TA reward zone mean exceeds the TI mean.
    Reproduced when, under both readings, non-beaconed and probe trials show TI below TA and
    beaconed trials are spatial for both. If the readings differ the claim is
    methods_underspecified.
  depends_on:
  - fig3f-switching-within-session
- id: fig6e-hit-try-run
  statement: Task-anchored firing occurred on a greater proportion of non-beaconed and probe hit
    trials than task-independent firing, but on a smaller proportion of run trials.
  source: Figure 6E; Results, Task-anchored coding by grid cells is selectively associated with
    successful path integration-dependent reward localisation, paragraph 4
  quote: task-anchored firing occurred on a greater proportion of non-beaconed and probe trials that were hits
    compared with task-independent firing, but on a smaller proportion of run trials
  statistics:
  - about: beaconed trials
    test: binomial GLMM, ANOVA against null model
    statistic: Χ2 = 4.49, DF = 2
    p: 0.11
  - about: non-beaconed trials
    test: binomial GLMM, ANOVA against null model
    statistic: Χ2 = 7.75, DF = 2
    p: 0.02
  - about: probe trials
    test: binomial GLMM, ANOVA against null model
    statistic: Χ2 = 5.40, DF = 2
    p: 0.07
  criterion: Per grid cell and outcome (hit, try, run), the percentage of that outcome's trials that
    are TA among TA and TI trials, averaged with weights (fraction of the trial type's trials with
    that outcome) x 1 / (grid cells in the session), over cells having all three outcomes
    (get_percentage_from_rolling_classifier_column). As behaviour_analysis_hit_try_run.Rmd does,
    glmer(TA ~ outcome + (1 | mouse/session/cell) + (0 + outcome | mouse/session/cell), binomial)
    against the null model per trial type. Reproduced when, for non-beaconed and probe trials, the
    weighted TA percentage is above 50% for hits and below 50% for runs, and the non-beaconed model
    has p < 0.05. Hit, try and run follow the Methods (95th percentile of hit trials' reward zone
    speeds); the code's 95% normal interval (add_hit_miss_try) is a variant and is shown.
  depends_on:
  - fig6d-epochs-beaconed-similar
- id: fig6f-odds-ratio
  statement: The odds ratio for reward on task-anchored relative to task-independent trials was close
    to 1 when cues were available but much larger without cues.
  source: Figure 6F; Results, Task-anchored coding by grid cells is selectively associated with
    successful path integration-dependent reward localisation, paragraph 4
  quote: the odds ratio for receipt of reward on task-anchored versus task-independent trials was close to
    1 when cues were available, but was much larger in the absence of cues
  statistics:
  - about: beaconed trials
    test: odds ratio from binomial GLMM
    p: 0.23
  - about: non-beaconed trials
    test: odds ratio from binomial GLMM
    p: 0.001
  - about: probe trials
    test: odds ratio from binomial GLMM
    p: 0.27
  criterion: Odds ratios and their p-values from the full models of fig6d (exponentiated fixed
    effect of task-anchored against task-independent, as sjPlot tab_model reports, Wald p) per
    trial type (Methods, Statistical analyses). The odds ratio values appear only in the figure,
    which was not available. Reproduced when the non-beaconed odds ratio is above 1 with p < 0.05
    and is larger than the beaconed odds ratio, and the beaconed p >= 0.05.
  depends_on:
  - fig6d-epochs-beaconed-similar
- id: fig6s1-speed-profiles
  statement: The differences in outcome between task-anchored and task-independent trials were not
    associated with differences in running speed profiles.
  source: Figure 6-figure supplement 1B; Results, Task-anchored coding by grid cells is selectively
    associated with successful path integration-dependent reward localisation, paragraph 3
  quote: The differences in outcomes between task-anchored versus task-independent trials were not associated
    with differences in running speed profiles
  criterion: Speed in 1 cm bins per trial, Gaussian SD 2 cm (Methods), per trial type and outcome,
    split by the grid cell's trial class, with trials used once per simultaneously recorded grid
    cell (legend; plot_speed_profiles_between_p_and_d_groups). The paper reports no test. It plots
    the mean with SD across trials, and that is the reading here. Reproduced when, for every trial
    type and outcome with both classes present, the TA mean profile lies within the TI mean +- 1 SD
    over the track and the TI mean lies within the TA mean +- 1 SD.
  depends_on:
  - fig6d-epochs-beaconed-similar
- id: fig6s2-template-method
  statement: Classifying trials by correlation with a template of task-anchored firing also gave
    similar performance on cued trials but impaired performance on uncued trials when grid cells were
    not task-anchored.
  source: Figure 6-figure supplement 2F-H; Results, Task-anchored coding by grid cells is
    selectively associated with successful path integration-dependent reward localisation,
    paragraph 4
  quote: also indicated a similar behavioural performance on cued trials, but impaired performance on uncued
    trials when grid cells were in a task-independent mode
  statistics:
  - about: hits, beaconed trials
    test: binomial GLMM, ANOVA against null model
    statistic: Χ2 = 0.62, DF = 1
    p: 0.43
  - about: hits, non-beaconed trials
    test: binomial GLMM, ANOVA against null model
    statistic: Χ2 = 6.43, DF = 1
    p: 0.01
  - about: hits, probe trials
    test: binomial GLMM, ANOVA against null model
    statistic: Χ2 = 3.52, DF = 1
    p: 0.06
  - about: odds ratio, beaconed trials
    test: odds ratio from binomial GLMM
    p: 0.4
  - about: odds ratio, non-beaconed trials
    test: odds ratio from binomial GLMM
    p: 0.002
  - about: odds ratio, probe trials
    test: odds ratio from binomial GLMM
    p: 0.04
  criterion: Template is the mean smoothed rate map over the cell's Lomb-Scargle TA trials; each
    trial's Pearson correlation with it at >= 0.5 is TA+, otherwise TA- (Methods;
    add_rolling_stats_by_trial_number_using_alternative_classification, add_alternative_classification).
    The Methods discard units with < 15% TA trials; the code instead labels all their trials TA- and
