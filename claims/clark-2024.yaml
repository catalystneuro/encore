# Claims for Clark & Nolan (2024), eLife 12 RP89356, on dandiset 000943.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23,
# protocol pilot-10 as stated in docs/protocol.md (Reader, steps 1 to 4).
#
# Text read: the version of record (eLife reviewed preprint, version 3, 28 March 2024), full text
# from Europe PMC (PMC10977970) with Results, figure legends, figure supplement legends and
# Materials and methods, the eLife assessment, reviews and author response; Supplementary file 1
# (summary table of recorded cells per mouse, supp1.docx) and the MDAR checklist (supp2.docx).
# No PDF was supplied, so values shown only in figures (Figure 2E percentages, Figure 6 hit
# percentages, Figure 6F odds ratios, N per group in Figure 6) could not be read.
#
# Data the paper used (as reported). Nine male C57BL/6J mice (M1, M3, M6, M7, M10, M11, M12, M13,
# M14; M3, M6, M7 also in Tennant et al. 2022) implanted with four tetrodes in the right MEC.
# Each recording day had an open arena session (30 min, square box, cue card) and a virtual
# linear track session, usually in that order, spike sorted together with MountainSort. 1881
# units, 215 sessions, 103 grid cells in 61 sessions (233 +- 135 trials per session). Track 200 cm
# long; 60 cm track zone, 20 cm reward zone, 60 cm track zone, 60 cm black box (the code places
# black boxes at 0 to 30 and 170 to 200 cm and the reward zone at 90 to 110 cm). Trial types
# (code in trial_type) are beaconed (0, reward zone cue visible, reward), non-beaconed (1, no cue,
# reward) and probe (2, no cue, no reward), delivered in repeating blocks (e.g. BBN, BBBNBBBP).
# Measured variables needed are spike times, open arena position, track position (60 Hz,
# from Blender), trial number, trial type, stops and rewards. Data were deposited at Edinburgh
# DataShare (doi:10.7488/ds/7684); whether dandiset 000943 (title "Clark and Nolan (2024)
# Task-anchored grid cell firing is selectively associated with successful path
# integration-dependent behaviour", NWB, electrophysiology) holds the open arena sessions,
# the sorted units and the behaviour is for the author to find.
#
# Code read. The analysis code the paper links, github.com/MattNolanLab/eLife_Grid_anchoring_2024
# at commit 670c45a43c46c337ec59f66bfa328ad885a0df70 (tag v1.0.0.0 is 152ef46, which differs only in
# README and LICENSE; Zenodo doi:10.5281/zenodo.10698051). It holds vr_grid_cells.py (per session
# periodograms, rolling classification, hit/try/run, spatial information, agreement with the
# grid consensus), vr_grid_population_level_plots.py (cell exclusions, data frames for R and the
# population figures), FieldShuffleAnalysis (field shuffle false alarm thresholds),
# ToyGridCells (simulations), analysis_settings.py and R notebooks for the statistics of Figures
# 2F, 3G, 4E, 4F, 6B, 6D, 6E, Figure 3-figure supplement 4 and Figure 6-figure supplement 2F-G.
# No code was found for Figure 3-figure supplements 5 and 7 statistics. Its README sends
# preprocessing (open arena rate maps, grid scores, grid cell classification) to
# github.com/MattNolanLab/in_vivo_ephys_openephys, read at the default branch head f913080f253b
# (15 March 2023); the paper pins no commit of it, so it ranks as other software.
#
# Methods common to the claims (cited; each criterion refers to these by name).
# - Units (Methods, Spike sorting) are those with firing rate > 0.2 Hz, isolation > 0.9, noise
#   overlap < 0.05 and peak SNR > 1. The code (vr_grid_population_level_plots.py, main) further
#   keeps units with waveform peak to trough < 500 uV, open arena mean rate > 0.2 Hz, track length
#   200 cm, at least 10 trials and some firing on the track (Lomb classifier not "Unclassified"),
#   and drops mice M2, M4 and M15, which had no grid cells.
# - Grid cells (Methods, Analysis of neural activity in the open arena) have a grid score and a
#   first-half against second-half rate map correlation both above the 99th percentile of 1000
#   shuffles, each shuffle adding one value drawn uniformly from 20 to 580 s to all spike times,
#   wrapped. Rate maps use 2.5 cm bins; the Methods give no smoothing width; the preprocessing repo
#   uses a 5 cm Gaussian kernel. Variant (preprocessing repo, PostSorting/OpenFieldShuffleAnalysis)
#   is grid score and spatial information above the shuffle mean + 2.326 SD, shifts from 20 s to
#   recording length - 20 s. Non-grid cells (NG) are all other kept units.
# - Track rate maps (Methods) have 1 cm bins, spikes over occupancy time, Gaussian SD 2 cm.
#   Spatial information is the Skaggs formula in bits per second (Methods; code
#   vr_grid_cells.spatial_info).
# - Periodogram (Methods; analysis_settings.py; vr_grid_cells.calculate_moving_lomb_scargle_periodogram)
#   is astropy LombScargle on the flattened smoothed rate map against elapsed distance divided by
#   200 cm, in 600 cm windows advanced 10 cm, frequencies 0.1 to 5 in steps of 0.02 cycles per
#   trial; the session periodogram is the mean over windows and its peak is the maximum.
# - False alarm threshold (Methods; FieldShuffleAnalysis) is the 99th percentile of the session
#   periodogram peak power over 1000 field shuffles (fields from scipy find_peaks on the map
#   smoothed with SD 4 cm, minimum peak distance 20 cm, field bins moved to random positions,
#   other bins fill the gaps, then smoothed with SD 2 cm). The adjusted threshold for rolling
#   windows is the 99th percentile over 1000 shuffles of the peak of the mean of the first 200
#   periodograms.
# - Session-level class (Methods) is aperiodic when peak power is not above the threshold,
#   task-anchored (TA) when the peak frequency is within 0.05 of the nearest positive integer,
#   task-independent (TI) otherwise. The Methods say <= 0.05 and the code < 0.05; on the 0.02 grid
#   they agree.
# - Trial-level class (Methods; vr_grid_cells.get_rolling_lomb_classifier_for_centre_trial and
#   add_coding_by_trial_number) averages 200 consecutive periodograms centred on each window
#   (windows truncated at the session ends in the code), classifies with the adjusted threshold,
#   assigns each window to the trial nearest its midpoint, and gives each trial the most common
#   class of its windows.
# - Proportion of a session in a mode. The code (add_rolling_stats) counts it over the rolling
#   windows, not over trial labels. A cell is "stable" when one mode holds >= 0.85 of windows
#   in the Python code and > 0.85 in CompareGroups_StableCats.Rmd; the paper says ">85% of
#   trials". Where a claim uses it, both readings (windows as the code, trials as the text) are
#   named; the text's trial reading is the main one and the code's a variant, except for the counts
#   of fig3f-switching-within-session, where any reading may match.
# - Behaviour (Methods, Analysis of behaviour; vr_grid_cells.add_hit_miss_try). A hit is a trial
#   with a stop (speed < 4.7 cm/s, registered by Blender) in the reward zone. Trials with mean speed
#   outside the reward zone < 10 cm/s are rejected (unclassified). Misses are split by their mean
#   reward zone speed. The Methods use the 95th percentile of hit trials' reward zone speeds
#   (try below, run above). The code uses the normal 95% interval (mean +- 1.96 SD) of hit trials'
#   reward zone speeds, try inside, run ("miss" in the code) outside. The Methods are the main
#   reading and the code a variant.
# - Stop density (Methods) counts stops in 1 cm bins divided by trials, smoothed with a Gaussian of
#   SD 1 cm (the code, get_stop_histogram, uses SD 2 bins; a variant), minus the mean of profiles
#   with stop locations drawn uniformly over the track (10 draws in the code).
# - Statistics (Methods, Statistical analyses; R notebooks) are mixed models with random effects
#   of session nested in mouse (and neuron where stated), compared with the null model by
#   likelihood ratio (anova), with emmeans pairwise contrasts. Trials classified aperiodic are
#   dropped from the Figure 6 analyses.
schema_version: 2
dataset:
  archive: dandi
  id: "000943"
paper: doi:10.7554/elife.89356
claims:
- id: grid-cell-count
  statement: Of 1881 MEC neurons recorded in nine mice, 103 were classified as grid cells from
    their open arena firing, 11.4 +- 17.4 grid cells per mouse, 0.4 to 9.5% of each mouse's
    neurons.
  source: Results, paragraph 1; Supplementary file 1
  quote: we identified 103/1881 neurons as grid cells (11.4±17.4 grid cells/mouse, range 0.4–9.5%, Supplementary
    file 1 )
  expected:
  - quantity: grid cells
    value: 103
    tolerance: 10.3
  - quantity: neurons recorded
    value: 1881
    tolerance: 188.1
  - quantity: lowest percentage of grid cells in a mouse
    value: 0.4
    tolerance: 0.04
    unit: "%"
  - quantity: highest percentage of grid cells in a mouse
    value: 9.5
    tolerance: 0.95
    unit: "%"
  criterion: Units and grid cells as in the opening comment (Methods, Spike sorting and Analysis
    of neural activity in the open arena; exclusions from vr_grid_population_level_plots.py). The
    counts are matched within tolerance; the per-mouse range holds inside 0.36 to 10.45%. The
    preprocessing repo's classification (grid score and spatial information above mean + 2.326 SD
    of the shuffles) is shown as a variant. Whether grid cells are counted once per session or once
    per recording day is not said; the paper counts units per session (Supplementary file 1 gives
    1881 cells over 215 sessions), and that is the reading used.
- id: supp1-recording-summary
  statement: Per mouse, the numbers of cells, sessions, trials per session and grid cells are as
    in Supplementary file 1, in total 1881 cells and 215 sessions, with most grid cells from M11
    (53) and M14 (26).
  source: Supplementary file 1
  inferred: Numbers from the table in Supplementary file 1; no sentence of the text states the
    per-mouse values.
  expected:
  - quantity: sessions in total
    value: 215
    tolerance: 21.5
  - quantity: grid cells, M11
    value: 53
    tolerance: 5.3
  - quantity: grid cells, M14
    value: 26
    tolerance: 2.6
  - quantity: cells, M11
    value: 557
    tolerance: 55.7
  - quantity: mean over the nine mice of each mouse's mean trials per session
    value: 179.1
    tolerance: 17.9
  criterion: Cells, sessions and grid cells per mouse counted as in grid-cell-count. Reproduced
    when the listed totals are within tolerance and, for each of the nine mice, the number of
    sessions is within 10% of the table (M1 11, M3 26, M6 21, M7 23, M10 16, M11 35, M12 21, M13 25,
    M14 37).
  depends_on:
  - grid-cell-count
- id: grid-field-size-spacing
  statement: Grid cells had field sizes of 7.5 +- 3.3 cm and grid spacing of 72.5 +- 13.7 cm.
  source: Results, paragraph 1
  quote: These grid cells had field sizes of 7.5±3.3 cm and grid spacing of 72.5±13.7 cm
  expected:
  - quantity: mean field size
    value: 7.5
    tolerance: 0.75
    unit: cm
  - quantity: mean grid spacing
    value: 72.5
    tolerance: 7.25
    unit: cm
  criterion: The Methods do not define field size or grid spacing. The preprocessing repo
    (PostSorting/open_field_grid_cells.py) fixes them; grid spacing is the median distance from
    the autocorrelogram centre to the six ring fields times the bin size, and field size is
    sqrt(area of the central autocorrelogram field in bins x bin size) / pi. That is used. Means
    over the 103 grid cells (grid-cell-count), matched within tolerance; the SDs are reported.
  depends_on:
  - grid-cell-count
- id: fig2-session-level-classes
  statement: At the session level, 68 of 103 grid cells had periodogram peaks within 0.05 of an
    integer spatial frequency (task-anchored), 32 had peaks elsewhere (task-independent) and 3
    had no peak above the false alarm threshold (aperiodic), over 61 sessions with 233 +- 135
    trials per session.
  source: Results, Grid cells exhibit either task-anchored or task-independent firing, paragraph 2;
    Figure 2D-E
  quote: We found that 68 of 103 grid cells had peaks in their periodograms within 5% of an integer multiple
    of the spatial frequency of the track repetition ... By contrast, 32 of 103 grid cells had periodograms
    with peaks at frequencies outside 5% ... were rare (3/103)
  expected:
  - quantity: task-anchored grid cells
    value: 68
    tolerance: 6.8
  - quantity: task-independent grid cells
    value: 32
    tolerance: 3.2
  - quantity: aperiodic grid cells
    value: 3
    tolerance: 0.3
  - quantity: sessions with grid cells
    value: 61
    tolerance: 6.1
  - quantity: mean trials per session with grid cells
    value: 233
    tolerance: 23.3
  criterion: Session-level class as in the opening comment (Methods; vr_grid_cells.get_lomb_classifier
    with the field shuffle threshold). The counts are matched within tolerance (the 10% rule makes
    the aperiodic count exact; it is reproduced at 3 and the count is reported otherwise). The
    false alarm threshold uses random shuffles; the counts are shown for the run made.
  depends_on:
  - grid-cell-count
- id: fig2e-nongrid-classes
  statement: Among non-grid cells, the proportion with session-level task-anchored firing was
    similar to that of grid cells, task-independent periodic firing was rarer and aperiodic firing
    was more common.
  source: Results, Grid cells exhibit either task-anchored or task-independent firing, paragraph 2;
    Figure 2E
  quote: When we carried out similar analyses for non-grid cells, we found that the proportion of neurons
    with task-anchored firing was similar, but task-independent periodic firing was rarer, while aperiodic
    firing neurons were more common
  criterion: Session-level classes for grid (G) and non-grid (NG) cells as in fig2-session-level-classes.
    The paper reports no test. "Rarer" and "more common" are judged by direction, NG TI percentage
    below G and NG aperiodic percentage above G. The paper does not fix how "similar" is judged; the
    readings are (a) the G against NG difference in TA percentage is smaller in absolute value than
    both the TI and the aperiodic differences, (b) a two-sided Fisher exact test of TA against other
    classes between G and NG is not significant at 0.05. Reproduced when both directions hold and
    "similar" holds under both readings; if the readings disagree the claim is
    methods_underspecified. Percentages are reported.
  depends_on:
  - fig2-session-level-classes
- id: fig2f-spatial-information
  statement: Session-level task-anchored grid cells had higher spatial information scores on the
    track than task-independent grid cells.
  source: Figure 2F; Results, Grid cells exhibit either task-anchored or task-independent firing,
    paragraph 3
  quote: These differences manifest as substantially higher spatial information scores, but similar average
    firing rates, for grid cells with session-level task-anchored firing compared with task-independent
    firing
  statistics:
  - about: effect of session-level class (TAG, TIG, AG)
    test: linear mixed model on log spatial information, ANOVA against null model
    statistic: Χ2 = 9.54, DF = 2
    p: 0.008
    n: 103 grid cells
  - about: TAG against TIG
    test: pairwise comparison of estimated marginal means
    statistic: T = 2.815, DF = 73.6
    p: 0.02
  criterion: Per grid cell, spatial information (bits/s) of the whole-session track rate map.
    As CompareGroups.Rmd does, lmer(log(SI) ~ class + (1 | mouse/session)) compared with the null
    model by anova, then emmeans pairs (default Tukey adjustment). Reproduced when the class effect
    has p < 0.05 and the TAG against TIG contrast is significant at 0.05 with TAG higher.
  depends_on:
  - fig2-session-level-classes
- id: fig2f-firing-rate-similar
