claims:
- id: fig3-s1-repeated-120
  statement: For subject S1, the image seen was identified correctly for 92% (110 of 120) of the
    repeated-trial voxel activity patterns from 120 novel natural images, against chance of 0.8%.
  source: Main text, paragraph 6 ("Identification performance for one subject is illustrated in
    Fig. 3"); Figure 3 and its legend; Figure 4a
  quote: For this subject, 92% (110/120) of the images were identified correctly (subject S1),
    whereas chance performance is just 0.8% (1/120)
  expected:
  - quantity: S1 repeated-trial identification performance, set size 120
    value: 92
    tolerance: 9.2
    unit: percent correct
  criterion: The pipeline of the opening comment (P1 to P5) on S1's 1,750 model estimation and 120
    identification repeated-trial responses. The value must hold under one of the readings of O1
    and O5; every combination is shown.
- id: fig4a-s2-repeated-120
  statement: For subject S2, 72% (86 of 120) of the images were identified correctly from
    repeated-trial patterns.
  source: Main text, paragraph 6; Figure 4a
  quote: For a second subject, 72% (86/120) of the images were identified correctly (subject S2)
  expected:
  - quantity: S2 repeated-trial identification performance, set size 120
    value: 72
    tolerance: 7.2
    unit: percent correct
  criterion: As fig3-s1-repeated-120, for S2.
