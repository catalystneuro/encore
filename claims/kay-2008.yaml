    and 32% (516 of 1,620) for S2, against chance of 0.8%.
  source: Main text, paragraph 7; Figure 4a
  quote: Single-trial performance was 51% (834/1620) and 32% (516/1620) for subjects S1 and S2,
    respectively (Fig. 4a); once again, chance performance is just 0.8% (13.5/1620)
  expected:
  - quantity: S1 single-trial identification performance, set size 120
    value: 51
    tolerance: 5.1
    unit: percent correct
  - quantity: S2 single-trial identification performance, set size 120
    value: 32
    tolerance: 3.2
    unit: percent correct
  criterion: Single-trial responses are BRS amplitudes per trial with the HRF from the
    repeated-trial analysis, all trials of the identification runs used, standardized per session
