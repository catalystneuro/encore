    value: 25
    tolerance: 2.5
    unit: percent of voxels
  - quantity: S2 V2 fraction
    value: 21
    tolerance: 2.1
    unit: percent of voxels
  - quantity: S2 V3 fraction
    value: 13
    tolerance: 1.3
    unit: percent of voxels
  criterion: Predictive power of the best initial model (P3, P4), significant at p < 0.01 by the
    bootstrap (O2), as a percentage of each area's voxels. Reproduced when the order V1 > V2 > V3
    holds in both subjects and at least four of the six values are within tolerance; partially when
    the order holds in both subjects only.
- id: supptable1-snr
  statement: SNR differs greatly between subjects but is similar across V1, V2 and V3 within a
    subject; the fraction of voxels with SNR above 1.5 is 32%, 30% and 22% in S1 and 18%, 19% and 13%
    in S2.
  source: Supplementary Table 1 and legend, column High SNR
  quote: Although SNR varied greatly across subjects, SNR was fairly consistent for areas V1, V2, and
    V3 within each subject
  expected:
  - quantity: S1 V1 fraction with SNR above 1.5
    value: 32
    tolerance: 3.2
    unit: percent of voxels
  - quantity: S1 V2 fraction
    value: 30
    tolerance: 3
    unit: percent of voxels
  - quantity: S1 V3 fraction
    value: 22
    tolerance: 2.2
    unit: percent of voxels
  - quantity: S2 V1 fraction
    value: 18
    tolerance: 1.8
    unit: percent of voxels
  - quantity: S2 V2 fraction
    value: 19
    tolerance: 1.9
    unit: percent of voxels
  - quantity: S2 V3 fraction
    value: 13
    tolerance: 1.3
    unit: percent of voxels
  criterion: A voxel's SNR is the median, over its model estimation responses aggregated across
    sessions, of the absolute response divided by its standard error, from the BRS fits
    (Supplementary Methods 3). The paper does not say how the standard error of an amplitude is
    obtained; readings are (a) the ordinary least-squares standard error from the final iteration
    of the BRS fit after the autoregressive transform, (b) a bootstrap over runs. Reproduced when,
    under one reading, at least four of the six values are within tolerance and S1's fraction is
    higher than S2's in every area.
- id: methods-v4-poor
  statement: The GWP model characterizes the responses of voxels in V1, V2 and V3 but does poorly for
    higher areas such as V4.
  source: Methods, Model estimation, paragraph 1
  quote: The model was able to characterize responses of voxels in visual areas V1, V2 and V3
    (Supplementary Table 1), but it did a poor job of characterizing responses in higher visual
    areas such as V4
  criterion: The paper shows no V4 result, and its V4 voxels were discarded (Supplementary Methods
    10), so V4 voxels can only come from the data set's own ROI labels. Measure from Supplementary Table 1, the percentage of
    voxels whose best initial model has significant predictive power (p < 0.01, P3, P4, O2), for V4
    voxels as labelled in the data set and for V1 to V3. Reproduced when, in both subjects, the V4
    percentage is below the V3 percentage (the comparison with V3 is fixed here, not by the paper); the median predictive power per area is reported too.
  depends_on:
  - supptable1-predictive-power-by-area
- id: fig2-representative-voxel
  statement: A representative V1 voxel of S1 (voxel 42205) has its receptive field in the left
    hemifield just below the horizontal meridian, broadband orientation tuning and high-pass spatial
    frequency tuning.
  source: Figure 2a and 2b and legend
  quote: This receptive field is located in the left hemifield, just below the horizontal meridian
    ... This receptive field has broadband orientation tuning and high-pass spatial frequency tuning
  criterion: Final GWP model of that voxel (P1 to P3, O5), spatial envelope and grating tuning curves
    as Supplementary Methods 6 (Calculation of tuning curves) gives them. How the paper numbers
    voxels is not stated; whether 42205 is an index the data set keeps is the author's to find, and
    if it is not, the claim cannot be tested. Reproduced when the envelope peak lies left of the
    vertical meridian and below the horizontal meridian within the central half of the stimulus
    height (the bound for "just below" is fixed here), the spatial frequency tuning is highest at the highest frequency (2.9 cycles per degree
    on the figure's axis), and the orientation tuning's maximum is less than twice its minimum
    (the ratio for "broadband" is fixed here).
- id: suppfig7-roi-tuning
  statement: The V1-averaged orientation tuning curve is nearly flat and the V1-averaged spatial
    frequency tuning curve is band-pass; voxels have only a slight orientation bias.
  source: Supplementary Figure 7a and 7b and legend; main text, paragraph 10
  quote: The orientation tuning curve is nearly flat ... The spatial frequency tuning curve is
    band-pass
  criterion: The ROI-averaged tuning curves of Supplementary Methods 9, the mean over V1 voxels of
    the grating tuning curves, with bootstrap SE across voxels. Which models give the curves is not
    stated; readings are (a) the final GWP models (Supplementary Methods 6, Calculation of tuning
    curves), (b) the grating-transformed weights of model I of suppfig8-constrained-models
    (Supplementary Methods 9). Which V1 voxels are averaged is not stated; readings are (a) all V1
    voxels with a final model, (b) the fixed voxel set of suppfig8-constrained-models. The figure is
    an example and does not name a subject; each subject is shown. Reproduced when, under one reading, the
    orientation curve's range is under 10% of its mean (the bound for "nearly flat" is fixed here)
    and the spatial frequency curve peaks at an intermediate frequency, above both its lowest and
    highest frequency values by more than 2 SE (both bounds fixed here).
  depends_on:
  - fig3-s1-repeated-120
- id: suppfig10-retinotopy-validation
  statement: Receptive-field angle and eccentricity estimated from the GWP model match those from
    independent multifocal retinotopic mapping, with discrepancies in eccentricity at the lowest and
    highest eccentricities.
  source: Supplementary Figure 10a to 10c and legend
  quote: Notice that the MF and GWP angle estimates are well matched ... The MF and GWP eccentricity
    estimates are generally well matched, but there appear to be systematic discrepancies at the
    lowest and highest eccentricities
  criterion: GWP angle and eccentricity from the RF location of P3, voxels with predictive power
    significant at p < 0.01 (as the legend says); multifocal estimates by the vector sum and centre
    of mass of Supplementary Methods 11, from the separate mapping sessions, pooled across subjects.
    The paper gives no statistic; the measures fixed here are the circular correlation of angles and
    the Spearman correlation of eccentricities. Reproduced when both are positive with p < 0.05.
    Needs the retinotopic mapping data, which the data set's description says are not included.
- id: suppfig11-rf-size-eccentricity
  statement: Receptive-field size increases with eccentricity, and from V1 to V2 to V3.
  source: Supplementary Figure 11 and legend
  quote: RF size increases with eccentricity and across visual areas, consistent with previous fMRI
    studies
  criterion: RF size is the extent of +/-2 SD of the Gaussian fitted to the best initial model's
    envelope (P3); voxels kept when predictive power is significant at p < 0.01 and the RF lies
    wholly inside the stimulus; pooled across subjects, binned by eccentricity, median per bin with
    at least 10 voxels (the legend). The bin edges are not given; standard choice, 1 degree bins
    from 0 to 10 degrees, with 0.5 degree bins as a variant. Reproduced when, for each area, the
    Spearman correlation of RF size with eccentricity over voxels is positive at p < 0.05, and in
    most bins shared by the three areas the medians order V1 < V2 < V3 (tests fixed here).
- id: suppdisc1-classification-extension
  statement: Extending classification to novel images (matching the measured pattern to the most
    similar of the 1,750 training patterns, then picking the identification image most similar to
    that training image) works poorly, 1.7% and 0.8% correct with pixel luminance similarity (not
    above chance) and 5% and 5.8% with local contrast (above chance), for S1 and S2.
  source: Supplementary Discussion 1, An extension of classification-based decoding methods yields
    poor identification performance, paragraphs 2 and 3
  quote: Identification performance using the pixel luminance metric was 1.7% (2/120) and 0.8% (1/120)
    for subjects S1 and S2, respectively (repeated trial). These values were not significantly above
    chance (p ≥ 0.05, one-tailed binomial test). Identification performance using the local contrast
    metric was 5% (6/120) and 5.8% (7/120) for subjects S1 and S2, respectively (repeated trial).
    These values were above chance (p < 0.0001, one-tailed binomial test)
  statistics:
  - about: pixel luminance metric, each subject against chance 1/120
    test: one-tailed binomial test
    p: 0.05
    p_relation: ">"
    n: 120 repeated-trial patterns per subject
  - about: local contrast metric, each subject against chance 1/120
    test: one-tailed binomial test
    p: 0.0001
    p_relation: "<"
    n: 120 repeated-trial patterns per subject
  expected:
  - quantity: S1, pixel luminance metric
    value: 1.7
    tolerance: 0.17
    unit: percent correct
  - quantity: S2, pixel luminance metric
    value: 0.8
    tolerance: 0.08
    unit: percent correct
  - quantity: S1, local contrast metric
    value: 5
    tolerance: 0.5
    unit: percent correct
  - quantity: S2, local contrast metric
    value: 5.8
    tolerance: 0.58
    unit: percent correct
  criterion: As Supplementary Discussion 1 gives it. Pattern similarity by Pearson r; image
    similarity by correlation of pixel luminance, or of local RMS contrast in 0.6 degree blocks
    (n = 0.6, the best of the values the paper tried). Open are the voxels and the contrast measure.
    Voxels, readings (a) the 500 voxels of P5, (b) all V1 to V3 voxels of O1. RMS contrast,
    readings (a) the SD of luminance in the block, (b) that SD over the block mean. With 120 images
    a tolerance of 10% is less than one image, so the counts are judged instead. Reproduced when,
    under one reading, each count is within one image of the paper's (2, 1, 6, 7), the luminance
    results are not above chance (one-tailed binomial p at or above 0.05) and the contrast results
    are (p < 0.0001); partially when the significance pattern holds but a count is further off.
    The paper wrote p ≥ 0.05, recorded here as p > 0.05.
- id: suppm7-selected-voxels-v1
  statement: Most of the 500 voxels used for identification were located in V1, where predictive
    power was highest.
  source: Supplementary Methods 7, Voxel selection, paragraph 2
  quote: Most of these voxels were located in area V1 where predictive power was highest
    (Supplementary Table 1)
  criterion: The 500 voxels of P5 for repeated-trial identification, for each subject, assigned to
    V1, V2 and V3 as in the data set's ROI labels. Since P5 selects voxels per measured pattern,
    readings are (a) the voxels selected in more than half of the 120 selections, (b) the 500
    voxels ranked by predictive power over all 120 images. "Most" is read as more than half (fixed
    here). Reproduced when, under one reading, more than half of the voxels are in V1 in both
    subjects.
  depends_on:
  - fig3-s1-repeated-120
  - fig4a-s2-repeated-120
