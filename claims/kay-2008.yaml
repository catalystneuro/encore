    the 120 images by P5. The models and voxel selection follow O6, readings (a) and (b); the
    value must hold under one reading, with O1 and O5 as in fig3-s1-repeated-120.
- id: fig4a-noise-ceiling
  statement: The estimated noise ceilings suggest that the lower performance of S2 is due to
    intrinsically noisier data; the ceilings are near 99% for both subjects with repeated trials,
    and about 80% (S1) and 64% (S2) with single trials.
  source: Figure 4a and its legend; Supplementary Methods 7, Estimation of the noise ceiling
  quote: The noise ceiling estimates suggest that the difference in performance across subjects is
    due to intrinsic differences in the level of noise
  expected:
  - quantity: S1 repeated-trial noise ceiling, read from the Figure 4a marker
    value: 99
    tolerance: 9.9
    unit: percent correct
  - quantity: S2 repeated-trial noise ceiling, read from the Figure 4a marker
    value: 99
    tolerance: 9.9
    unit: percent correct
  - quantity: S1 single-trial noise ceiling, read from the Figure 4a marker
    value: 80
    tolerance: 8
    unit: percent correct
  - quantity: S2 single-trial noise ceiling, read from the Figure 4a marker
    value: 64
    tolerance: 6.4
    unit: percent correct
  criterion: Noise ceiling as Supplementary Methods 7 gives it. For each of the 120 images, 25
    simulations; in each, the measured pattern is the mean of a random sample of the correct
    image's single-trial patterns, each candidate's predicted pattern the mean of a random sample
    of its own single-trial patterns, and the most correlated candidate is chosen; the ceiling is
    the percentage of successes. The values are read from the figure, no sentence gives them.
