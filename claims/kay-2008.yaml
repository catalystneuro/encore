- id: suppfig8-constrained-models
  statement: In constrained versions of the GWP model, both orientation and spatial frequency tuning
    add to identification (C > A, G > A), spatial frequency more (G > C), and voxel-to-voxel variation
    in both adds too (F > E, H > E); at 1,000 images the nine models give A 17%, B 22%, C 28%, D 30%,
    E 51%, F 60%, G 64%, H 62% and I 63%.
  source: Supplementary Figure 8a and 8b; main text, paragraph 10; Supplementary Methods 9
  quote: Both orientation and spatial frequency tuning contribute to identification performance
    (C > A and G > A), but spatial frequency tuning is relatively more important (G > C).
    Voxel-to-voxel variation in orientation and spatial frequency tuning also contributes to
    identification performance (F > E and H > E)
