# Claims for Kay, Naselaris, Prenger & Gallant (2008), Nature 452:352-355, "Identifying natural
# images from human brain activity", doi:10.1038/nature06713, on CRCNS data set vim-1.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-10,
# protocol as stated in docs/protocol.md (Reader), version pilot-14.
#
# Text read: the version of record with its supplement, as PyMuPDF text under paper/
# (10.1038-nature06713.txt): the Letter, its Methods, and the Supplementary Information
# (Supplementary Figures 1 to 11, Supplementary Table 1, Supplementary Discussion 1 to 3,
# Supplementary Methods 1 to 11). PDF pages were rendered only for Figure 4 and Supplementary
# Figures 4, 5 and 8, whose numbers the text garbles. The data set's description
# (paper/vim-1.data-description.txt) was read only to know what it holds; no claim comes from it.
#
# Code: the paper links no analysis code, so none was read. It names outside code for two steps:
# m-sequence generation by T. Liu (stimulus design only) and Gaussian kernel density estimation by
# A. Ihler (http://ttic.uchicago.edu/~ihler/code/), used for the set-size extrapolation.
#
# Data the paper used. Two subjects, S1 (author T.N., 33) and S2 (author K.N.K., 25). 4 T Varian
# INOVA scanner, 18 coronal slices over occipital cortex, 64 x 64 matrix, TR 1 s, nominal 2 x 2 x
# 2.5 mm. Stimuli are 20 x 20 degree greyscale natural photographs (500 x 500 px, circular mask),
# each trial 4 s, an image flashed ON-OFF-ON-OFF-ON (200 ms each) for 1 s then 3 s grey. Five scan
# sessions per subject; each has five model estimation runs (70 distinct images shown twice, 168
# trials) and two image identification runs (12 distinct images shown 13 times, an m-sequence of
# 168 trials with 12 null trials, the first 6 trials repeated at the end). In all, 1,750 model
# estimation images and 120 identification images per subject. Responses are estimated per voxel
# by the basis-restricted separable (BRS) model (Supplementary Methods 3 and 4): one amplitude per
# distinct image (repeated-trial analysis; the first 6 trials of each identification run are left
# out) or per trial (single-trial analysis; all trials, 1,620 identification trials per subject,
# that is 10 runs x 162 image trials), standardized per session with the model estimation
# responses' mean and SD. Voxels are assigned to V1, V2 and V3 from multifocal retinotopic mapping,
# one separate scan session per subject (Supplementary Methods 10 and 11); voxels outside V1 to V3
# were discarded (Supplementary Methods 10); about 5,000 voxels lie in the stimulated
# parts of V1 to V3 (Supplementary Table 1 gives 1331, 2208 and 1973 for S1, 1513, 1982 and 1780
# for S2). S1 had three further sessions of identification runs only: two about two months later
# (five runs each, 120 new images) and one about 14 months later (one run, 12 new images). The
# set-size analyses use a library of 999 further images, randomly selected and distinct from the
# 1,870 above, that the paper does not deposit or name a source for. The data set, by its
# description, holds the two subjects' five main sessions as time series and as estimated
# responses to the 1,750 and 120 images, ROI labels (V1, V2, V3, V3A, V3B, V4, lateral occipital),
# the stimuli and anatomy; it says the localizer scans behind the ROIs are not included, and it does
# not mention the later S1 sessions or the 999-image library. Whether it holds what each claim needs is the author's to find.
#
# The identification method, used by most claims below ("the pipeline"), from the paper:
# (P1) Receptive-field model, Gabor wavelet pyramid (GWP), Supplementary Methods 5 and 6 and
# Supplementary Figures 2 and 3. Stimuli downsampled to min(500, round(2^(9 - x/8))) px for x = 0
# to 24 (the extracted text garbles the formula; this reading gives the two printed examples,
# 500 px at x = 0 and 215 px at x = 10), converted to luminance and mean-subtracted. Wavelets at
# 1, 2, 4, 8, 16 (and 32 at 128 px) cycles per field of view, on an f x f grid, 8 orientations
# (0 to 157.5 degrees), 2 quadrature phases, isotropic Gaussian masks with 1-octave spatial
# frequency and 41-degree orientation bandwidth, masks zeroed below 0.01 of peak, each wavelet
# zero-mean and unit-length, plus one luminance-only wavelet over the image (its projection
# squared, times 2, square-rooted). Projection zeroed for a wavelet whose mask lies more than half
# beyond 90% of the stimulus radius. Input channels are quadrature contrast energies (square root
# of summed squared projections); prediction is a weighted sum plus a DC offset.
# (P2) Fitting (Supplementary Methods 6). Gradient descent with early stopping: 20% of responses
# drawn at random as a stopping set, responses mean-subtracted, channels z-scored, kernel from
# zero, step 0.001, normalized gradient with momentum 0.9, stop when stopping-set (or training)
# squared error no longer decreases. 100 bootstrap samples with the iteration count fixed to that
# of the fit on the original data; final parameters are the bootstrap mean.
# (P3) Three steps (Supplementary Methods 5). Initial models at 128 px over the central 20, 10.1
# and 5.2 degrees, orientation invariant (channels summed over orientation; 1,367 parameters);
# an isotropic 2-D Gaussian fit to each spatial envelope, RF location = the region within +/-2 SD
# (valid for the 10.1 and 5.2 degree models only if wholly inside their field of view); the valid
# initial model with least stopping-set error is the best initial model; only voxels whose best
# initial model has significant predictive power go on; a final 64 px model, not orientation
# invariant (2,730 parameters), fitted over the estimated RF location.
# (P4) Predictive power is Pearson r between measured and predicted responses to the 120
# identification images; its significance is one-tailed (r > 0) by a bootstrap (Supplementary
# Methods 6), p < 0.01 where a threshold is used (Supplementary Table 1).
# (P5) Identification (main text and Supplementary Methods 7). For each measured pattern, the 500
# voxels with highest predictive power, computed without the image to be identified (so over the
# other 119 images); the image whose predicted pattern has the highest Pearson r with the
# measured pattern is chosen. Set size 120; chance 1/120.
# (P6) Larger sets (Supplementary Methods 7). With a 999-image library, f(m,s) = product over
# i = 1 to s - 1 of (1000 - g(m) - i) / (1000 - i), g(m) the number of library images whose
# predicted pattern correlates more with m than the correct image's does (the garbled formula
# read as drawing s - 1 images without replacement); beyond 1,000, the 999 correlations are
# smoothed by a Gaussian kernel with width by pseudo-likelihood cross-validation and
# f(m,s) = (1 - h(m))^(s - 1), h(m) the fraction of the smoothed distribution above the correct
# image's correlation; f is averaged over all measured patterns.
#
# Details the paper leaves open, named again where a claim rests on them:
# (O1) the candidate voxels. The paper uses V1, V2 and V3 only, and only voxels whose best initial
# model has significant predictive power (P3). The threshold for that step is not stated in
# Supplementary Methods 5; Supplementary Table 1 uses p < 0.01. Readings are (a) V1 to V3 voxels
# passing p < 0.01, (b) all V1 to V3 voxels, ranked by predictive power alone.
# (O2) the bootstrap for the significance of predictive power: what is resampled and how often is
# not stated. Standard choice, resampling the 120 image pairs with replacement, 1,000 times; it
# changes only which voxels pass a threshold near p = 0.01.
# (O3) wavelet grid placement and the exact mask SD in pixels are fixed by the bandwidths only up
# to convention; standard choice, centres at the cell centres of the f x f grid.
# (O4) the goggles' luminance response is not given (only 0.8, 11.1 and 6.3 cd/m2 minimum,
# maximum and mean); reading, the stimulus values taken as linear in luminance.
# (O5) the final model's field of view, "specifically tailored to the estimated RF location".
# Readings are (a) the square bounded by +/-2 SD of the fitted Gaussian, at 64 px, (b) the best
# initial model's field of view, at 64 px.
# (O6) single-trial identification. The paper does not say whether models and voxel selection for
# single trials use the repeated-trial model estimation responses. Readings are (a) models and
# predictive power from the repeated-trial responses, with single-trial patterns as the measured
# patterns, (b) models fitted to single-trial model estimation responses.
# (O7) random seeds (stopping sets, bootstraps, library draws) are standard choices.
