  - quantity: model C (individual orientation, flat spatial frequency)
    value: 28
    tolerance: 2.8
    unit: percent correct
  - quantity: model E (ROI-averaged both)
    value: 51
    tolerance: 5.1
    unit: percent correct
  - quantity: model F (individual orientation, ROI-averaged spatial frequency)
