# Claims for Komori, Mizusaki, Tomita, Yoneda, Matoba & Morita (2026), "Mesoscopic cortical
# activities associated with pupil-linked perceptions inferred via explainable machine learning",
# tested on DANDI:001425.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-25,
# following docs/protocol.md (pilot-18), Reader, steps 1 to 4.
#
# Text read: the bioRxiv preprint (doi:10.64898/2026.05.27.726399, the version posted June 1,
# 2026), as stored in paper/10.64898-2026.05.27.726399.txt. It holds the main text, the Methods,
# the legends of Figures 1 to 4 and of Supplementary Figures 1 to 12, and the Data and Code
# Availability statements. Supplementary Figures 3, 4, 5 and 6 were read from the images beside
# the text (supp-fig-S3 to S6.jpg); the numbers taken from them are marked as read from a figure.
# No other figure was seen. No separate supplementary text exists ("Supplementary Fig. 1 to 12").
#
# Code read: https://github.com/moritalabC201/WF_deep-learning at commit 405a720 (2026-01-22),
# the repository the Code Availability names. It holds template notebooks with placeholder paths
# for atlas registration, hemodynamic correction, SVD (400 components, fitted on every fifth
# session, ca_list[i][::5]) and JADE ICA (top 200 SVD components, ICs kept by hand), pupil
# diameter from DeepLabCut, data set construction, GRU training (32 units, sigmoid output,
# Adam, binary cross-entropy with label smoothing 0.001, batch 256), ROC and Youden threshold,
# Deep SHAP, VIF (statsmodels), permutation importance (3 repeats) and the paired t-tests of
# SHAP against null models. Low-pass filters are 4th-order Butterworth, applied forward and
# backward (filtfilt). The notebooks are written for the stimulus experiments (stimulus frame,
# 10 cycles per experiment); no code loads DANDI:001425 or builds the resting-state labels or
# epochs, so those details come from the Methods alone. Where the code differs from the Methods
# (the Deep SHAP background and samples, below), the Methods come first and the code is a
# variant.
#
# Data the paper used.
#  - Its own recordings (Figures 1 to 4 A-C, E-H, Supplementary Figures 1 to 4, 6 A-E, 7 to 11
#    A-C): Emx1-Cre/Rosa-GCaMP6f mice, N = 3, head-fixed, wide-field Ca imaging alternating 405
#    and 480 nm (20 fps per channel, 256 x 270 pixels) with 60 Hz pupil video (down-sampled to 20
#    Hz) of the right eye. Three conditions in 40 s sessions: hindpaw electrical stimulation
#    (119 sessions), visual pattern change of a drifting grating (740 or 741 sessions), and a
#    visual oddball task (1107 sessions). The Data Availability says these data are "available
#    from the corresponding author upon reasonable request"; they are deposited nowhere, and
#    DANDI:001425 does not hold them. Their claims are kept, as data the paper recorded (data:
#    dataset), and cannot be tested here.
#  - Resting state (Figure 4 D, E row 4, I; Supplementary Figures 5, 6 F-G, 9D, 11D): the paper
#    reuses Kondo et al. (2025), DANDI:001425 ("BraiDyn-BC: mouse cued-lever-pull task
#    dataset"), described as 25 vGluT1-Cre x Ai162 (GCaMP6s) mice with 2 to 3 experiments per
#    animal, wide-field imaging alternating 405 and 470 nm, acquired at 60 Hz, 588 x 588 pixels,
#    36,000 frames per 600 s session, with pupillometry. The authors down-sampled images to 288
#    x 288 pixels and masked non-cortical pixels to 256 x 270. These are the claims the attempt
#    is about. The Methods give a 46-frame feature window for resting data against 31 frames
#    (1.5 s at 20 Hz) for the others, which implies 1.5 s at 30 Hz per excitation channel.
#
# Open details for the resting-state analysis, each with the readings the paper allows (the
# criteria refer to them by these names):
#  R1 Which mice and recordings. The Resting state Methods describe all 25 mice ("2-3
#     experiments per animal"); the Cross-validation Methods say "Experiments from three mice
#     were used". Readings: (a) three mice, 2 or 3 resting sessions each; (b) all 25 mice.
#     DANDI:001425 holds more resting sessions per mouse than 3 (Kondo et al. describe days 0, 1,
#     7 and 15); which 2 or 3 the paper used is not said. Reading: the first 2 or 3 resting
#     sessions of each mouse in recording order, with all available sessions as a variant.
#  R2 Imaging preprocessing. The paper's own pipeline (Methods, Hemodynamic correction: dF/F to
#     the mean of 5 to 15 s after onset, 34-component SVD, 0.1 Hz high-pass, OLS of F480 on
#     F405, subtraction) is described for its own data; the Resting state Methods say only that
#     images were down-sampled and masked, which suggests, without stating, that the paper
#     applied its pipeline to the raw frames.
#     Reading (a) the paper's pipeline on the deposited frames; (b) the dataset's own corrected
#     signals where the frames cannot be processed, as a variant.
#  R3 Pupil signal. The paper does not say which pupil measure of DANDI:001425 it used (it ran
#     its own DeepLabCut model on its own videos). Readings: (a) the deposited pupil diameter
#     (fitted ellipse) at the imaging frame rate; (b) the horizontal distance between the left
#     and right pupil keypoints, as the paper's own Methods define the diameter, where the
#     dataset holds keypoints.
#  R4 Epochs and labels (Methods, Pupil labels, last sentence). The pupil is low-pass filtered at
#     0.2 Hz; 40 s epochs span 50 to 570 s (13 per recording); within each epoch the window from
#     3 s before to 0.5 s after the dilation peak is Z-scored and min-max normalized with the
#     whole recording's statistics and binarized at 0.6. The peak is read as the maximum of the
#     normalized pupil within the epoch. Whether the samples are only that window (reading a,
#     as the stimulus code extracts peak minus the window minus the 1.5 s look-back to peak
#     plus 0.5 s) or the whole epoch with labels set only inside the window (reading b) is not
#     fixed.
#  R5 Epoch selection. For the stimulus data the paper drops sessions with a positive label in a
#     pre-peak window or without reaching threshold (code, cell 23 of 01_preprocess_dl: more than
#     10 positive frames and none in the early part); for resting data it states no rule.
#     Readings: (a) no selection; (b) the same rule with the resting window (no positive label
#     before 1.5 s ahead of the peak, more than 10 positive frames).
#  R6 Features. ICA as in the Methods (z-scored pixels, SVD 400 components on every fifth
#     session, JADE ICA on the top 200, whitened IC time courses), 10 ICs (Supplementary Figures
#     5A, 6F), chosen by the paper "by visual inspection" and then by removing ICs until the
#     maximum VIF is below 10. The inspection cannot be repeated; reading: keep the ICs whose
#     spatial maps are compact and cortical and drop the rest until max VIF < 10 with 10 ICs,
#     and report which were kept. Features are low-pass filtered at 0.1 Hz (Results, Feature
#     importance, paragraph 2; Supplementary Figure 5E; the Methods' 2 Hz applies to the
#     stimulus data), Z-scored and min-max normalized; window 46 frames, label at the last frame.
#  R7 Folds. Per mouse, the units are split at random into five equal parts and pooled across
#     mice (Methods, Cross-validation; code splits sessions). For resting data the unit is
#     either (a) the 40 s epoch or (b) the recording.
#  R8 Null models. Labels shuffled within each session (Methods, Null models); the code's
#     shuffle (commented out in cell 39) acts on training labels only, per experiment. Readings:
#     (a) training labels only, within each epoch, as the code; (b) training and validation
#     labels.
#  R9 Training. GRU (32 units), dense sigmoid output, Adam, binary cross-entropy, batch 256, 10
#     epochs for resting data, the epoch of lowest validation loss kept (Methods); label
#     smoothing 0.001 and Keras defaults from the code. Random seeds are a standard choice.
#  R10 Deep SHAP. Methods: SHAP of the first validation sample per experiment with a positive
#     prediction, against the mean model output as background, averaged across models. Code
#     (03_calc_loss_shap, 05_make_figures): DeepExplainer with every 20th validation sample as
#     background, SHAP for all validation samples, then the mean over the first samples per
#     experiment whose prediction passes the Youden threshold. The Methods' reading is primary;
#     the code's is a variant. SHAP is compared with null models per time window by paired
#     t-test over the 5 models, uncorrected (Supplementary Figure 9 legend).
schema_version: 2
paper: doi:10.64898/2026.05.27.726399
claims:
- id: rest-decoding-above-null
  statement: A GRU decoder of independent components of resting cortical activity, low-pass
    filtered at 0.1 Hz, predicts spontaneous pupil dilation with a validation ROC-AUC
    significantly higher than that of null models trained on within-session shuffled labels.
  source: Results, Feature importance analysis, paragraph 2; Supplementary Figure 5D (and 5E)
  quote: In parallel, we constructed a predictive model of spontaneous pupil dilation during rest;
    applying a 0.1 Hz low-pass filter to features produced ROC-AUC values significantly above the
    null model
  statistics:
  - about: validation AUC, model against null
    test: paired t-test
    p: 0.05
    p_relation: "<"
    n: 5 models (five-fold cross-validation)
  expected:
  - quantity: mean validation AUC of the five models, read from the Supplementary Figure 5D bar
    value: 0.82
    tolerance: 0.082
  - quantity: mean validation AUC of the null models, read from the Supplementary Figure 5D bar
    value: 0.61
    tolerance: 0.061
  criterion: The resting-state pipeline of the opening comment (R1 to R9). Five models by five-fold
    cross-validation and five null models; validation AUC of each at its epoch of lowest
    validation loss. Reproduced when, under some combination of the readings, the paired t-test
    of model against null AUC over the 5 folds gives p < 0.05 with the model higher, and the mean
    model AUC is within tolerance. Partially reproduced when the model is significantly above
    null but its mean AUC is outside tolerance. The bar heights are read from the figure image
    (the representative model of 5D prints training 0.928 and validation 0.821), so the
    tolerances are 10% of the read values. Every reading combination run is reported.
- id: rest-loss-accuracy-vs-null
  statement: The resting-state decoder has lower validation loss and higher validation accuracy
    than the null models.
  source: Supplementary Figure 5B and 5C
  inferred: Read from Supplementary Figure 5B-C and its legend (paired t-test, *p < 0.05); no
    sentence of the text states the loss and accuracy comparison for resting data.
  statistics:
  - about: validation loss, model against null
    test: paired t-test
    p: 0.05
    p_relation: "<"
    n: 5 models
  - about: validation accuracy, model against null
    test: paired t-test
    p: 0.05
    p_relation: "<"
    n: 5 models
  expected:
  - quantity: mean validation loss (binary cross-entropy), model, read from the figure
    value: 0.54
    tolerance: 0.054
  - quantity: mean validation loss, null, read from the figure
    value: 0.68
    tolerance: 0.068
  - quantity: mean validation accuracy, model, read from the figure
    value: 0.75
    tolerance: 0.075
  - quantity: mean validation accuracy, null, read from the figure
    value: 0.58
    tolerance: 0.058
  depends_on:
  - rest-decoding-above-null
  criterion: Same models as rest-decoding-above-null. Accuracy is at a fixed threshold of 0.5
    (Methods, Classification accuracy), at the epoch of lowest validation loss. Reproduced when
    both paired t-tests over the 5 folds give p < 0.05 in the stated direction; the means are
    compared with the values read from the figure (10% tolerance) and reported.
- id: rest-needs-0-1-hz
  statement: Spontaneous pupil dilation could not be predicted above chance from cortical activity
    low-pass filtered at 2 Hz (the setting that works for sensory-evoked dilation); a 0.1 Hz
    low-pass filter was required for significant decoding. The 0.1 Hz AUC did not differ
    significantly from that at any other cutoff tested (0.05, 0.2, 0.5, 1 and 2 Hz).
  source: Discussion, Spontaneous Pupil Dilation, paragraph 1; Supplementary Figure 5E
  quote: Unlike sensory-evoked dilation, spontaneous pupil dilation could not be predicted above
    chance from neural activity filtered below 2 Hz; a 0.1 Hz low-pass filter was required to
    achieve significant decoding
  statistics:
  - about: validation AUC across feature low-pass cutoffs (0.05 to 2 Hz), 0.1 Hz against each
    test: Wilcoxon rank-sum test
    p: 0.05
    p_relation: ">"
    corrected: Holm
    n: 5 models per cutoff
  expected:
  - quantity: mean validation AUC at 0.1 Hz, read from the Supplementary Figure 5E bar
    value: 0.86
    tolerance: 0.086
  - quantity: mean validation AUC at 2 Hz, read from the Supplementary Figure 5E bar
    value: 0.51
    tolerance: 0.051
  depends_on:
  - rest-decoding-above-null
  criterion: The pipeline of rest-decoding-above-null, run with features low-pass filtered at 0.1
    Hz and at 2 Hz, each with its null models. A claim of absence for 2 Hz, judged on the test the
    paper uses for "above chance", the paired t-test of validation AUC against null over the 5
    folds at p < 0.05 (Supplementary Figure 5D legend). Reproduced when the 2 Hz model is not
    significantly above its null and the 0.1 Hz model is; not reproduced when the 2 Hz model is
    significantly above null or the 0.1 Hz model is not. The AUCs and effect sizes are given
    either way, with the 0.05, 0.2, 0.5 and 1 Hz cutoffs of Figure 5E, and the paper's Wilcoxon
    rank-sum test with Holm correction of 0.1 Hz against each other cutoff, which the paper
    reports as not significant. The paper sets these filters in the reading combination that
    reproduces rest-decoding-above-null, if one does; otherwise in all of them.
- id: rest-ic-count-and-window
  statement: For resting data, decoding with 10 ICs and a 1.5 s feature window gave the highest
    median AUC among the IC counts (7, 10, 13) and window lengths (0.5 to 10 s) tested, though no
    comparison was significant.
  source: Supplementary Figure 5F and 5G
  inferred: Read from Supplementary Figure 5F-G and its legend (Wilcoxon rank-sum test with Holm
    correction, n.s.); the text states only that 10 ICs and 46-frame windows were used.
  statistics:
  - about: validation AUC, 10 ICs against 7 and 13 ICs, and 1.5 s against other windows
    test: Wilcoxon rank-sum test
    p: 0.05
    p_relation: ">"
    corrected: Holm
    n: 5 models per condition
  depends_on:
  - rest-decoding-above-null
  criterion: The pipeline of rest-decoding-above-null with 7, 10 and 13 ICs (ICs added or removed
    in the order of the R6 reading). The Supplementary Figure 5 legend calls these the "initial
    number of ICs", which leaves open whether the count is the number kept as features (reading
    a) or the number before ICs are removed for VIF (reading b); both are run. Also with feature windows of 0.5, 1.0, 1.5, 2.0, 3.0, 5.0 and
    10.0 s before the label frame. Reproduced when 10 ICs and 1.5 s have the highest median
    validation AUC among their sets; partially reproduced when one of the two does. The paper's
    Holm-corrected Wilcoxon rank-sum tests are reported; the paper finds none significant.
- id: rest-vif-below-10
  statement: With 10 ICs the resting-state features have a maximum variance inflation factor of
    9.0 across features and time frames, below the VIF < 10 bound; 7 ICs gave a significantly
    lower maximum VIF, 13 and 15 ICs did not differ from 10.
  source: Conclusions; Supplementary Figure 6F and 6G; Methods, ICA-based cortical features
  quote: Residual multicollinearity of up to VIF = 9.0 remained among features within individual
    time frames
  statistics:
  - about: maximum VIF, 7 against 10 ICs
    test: Mann-Whitney U test
    p: 0.05
    p_relation: "<"
    corrected: Holm
    n: 5 models
  - about: maximum VIF, 10 against 13 and 15 ICs
    test: Mann-Whitney U test
    p: 0.05
    p_relation: ">"
    corrected: Holm
    n: 5 models
  expected:
  - quantity: maximum VIF with 10 resting-state ICs (Supplementary Figure 6F title)
    value: 9.0
    tolerance: 0.9
  depends_on:
  - rest-decoding-above-null
  criterion: VIF = 1/(1 - R2) of each feature regressed on the others, within each time frame of
    the validation samples (Methods, Permutation importance; code 07_vif_calc, statsmodels
    variance_inflation_factor), maximum over features and frames, per model. The 7, 13 and 15 IC
    feature sets are formed as in rest-ic-count-and-window; the comparisons use the paper's test,
    Mann-Whitney U with Holm correction over the three pairs against 10 ICs, 5 models each
    (Supplementary Figure 6G legend). Reproduced when the maximum over models with 10 ICs is below
    10 and within tolerance of 9.0, 7 ICs give a significantly lower maximum VIF than 10, and 13
    and 15 ICs do not differ from 10. Partially reproduced when the 10-IC maximum holds and the
    comparisons do not, which may follow from the IC selection that cannot be repeated exactly
    (R6). The Mann-Whitney U test is the same as the Wilcoxon rank-sum.
- id: rest-shap-medial-anterior-first
  statement: In the resting-state model, SHAP values of an IC in the medial anterior cortex (IC7)
    rise before those of the medial posterior region (IC6) and the secondary motor cortex (IC4).
  source: Discussion, Summary of Results and Spontaneous Pupil Dilation; Figure 4D, 4E (4th row),
    4I; Supplementary Figures 9D and 11D
  quote: The finding that SHAP value increases for IC7, distributed in the medial anterior cortex,
    preceded those in the medial posterior region (IC6) and MOs (IC4) has not previously been
    reported
  depends_on:
  - rest-decoding-above-null
  criterion: Deep SHAP as in R10 (Methods reading first, code reading as variant), on the models
    of rest-decoding-above-null and their null models. IC numbers are arbitrary, so the three ICs
    are matched by their spatial maps to the paper's description and to Supplementary Figure 5A
    (IC7 a midline anterior band, IC6 medial posterior cortex around RSP, IC4 MOs); the maps of
    the matched ICs are shown. The onset of a SHAP increase has no definition in the paper;
    readings (a) the first of the paper's windows (as in Supplementary Figure 9, and the
    -0.5 to -0.3, -0.3 to -0.1 and -0.1 to 0.0 s windows of the Results, with earlier windows
    from -1.5 s) in which the IC's mean SHAP exceeds null by paired t-test, uncorrected, p <
    0.05; (b) the time of the peak of the IC's mean SHAP over models within the 1.5 s window.
    Reproduced when under one reading the medial anterior IC's onset precedes both others;
    partially reproduced when it precedes one; not reproduced otherwise, or when no IC matches
    the medial anterior description. The mapped SHAP maps per window (Figure 4E, 4th row) are
    shown, though the paper states no finding from them for resting data.
