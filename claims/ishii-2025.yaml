# Claims for Ishii et al. (2025), "Post-ejaculatory inhibition of female sexual drive via
# heterogeneous neuronal ensembles in the medial preoptic area", eLife 12, RP91765, on dandiset
# 001249.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-22,
# protocol as stated in docs/protocol.md.
#
# Text read: the version of record (eLife RP91765, published 5 March 2025) as served by Europe
# PMC: main text, all figure legends and figure supplement legends, Materials and methods, and
# the authors' response to the reviewed preprint. Supplementary files 1 to 3 (tables of every
# statistical result; files 2 and 3 hold the per-region ANOVA and Tukey values of Figure 2) are
# not in the text, so the region-level statistics of Figure 2 are not recorded here.
# Code read: github.com/stuberlab/Ishii-MPOA-Ejaculation-2023, commit 4e98c43 (2025-02-24). Its
# notebooks are named by the preprint's figure numbers; "Figure 2.ipynb" is the whole-brain
# analysis of the published Figure 2. It starts from a table of densities (tdTomato_summary.csv,
# on Figshare) and holds the per-region one-way ANOVA (scipy f_oneway over the three groups),
# the Benjamini-Hochberg correction (statsmodels fdrcorrection, alpha 0.1 at both atlas levels),
# and Tukey's HSD (scipy tukey_hsd) for every region. The image processing (ClearMap
# registration, ilastik cell classifier) is not in the repository.
#
# The dandiset ("FosTRAP dataset used in Ishii et al 2023", 14 assets) holds the whole-brain
# activity mapping of Figure 2 only (Data availability). As the paper reports it: TRAP2::Ai14
# (Fos-2A-iCreERT2 x Rosa26-LSL-tdTomato) females, ovariectomized and primed with estradiol,
# given 4-OHT (50 mg/kg i.p.) immediately after the male was removed in one of three phases:
# appetitive (sniffing only, n=4), consummatory (mount or intromission, no ejaculation, n=5),
# post-ejaculatory (just after male ejaculation, n=5). Two weeks later brains were cleared
# (SHIELD) and imaged on a SmartSPIM light-sheet microscope (3.6x objective, 4 um z step;
# 594 nm signal channel, 488 or 647 nm background channel used for registration), downsampled
# to 3.6 x 3.6 x 4 um, registered to the Unified Anatomical Atlas of the Kim lab (Chon et al.
# 2019; 20 x 20 x 50 um) with ClearMap, and tdTomato+ cells segmented with an ilastik
# classifier. The measured variable is the tdTomato+ cell density (cells per mm3) per atlas
# region per brain, at hierarchy level 4 (Figure 2C) and level 6 (Figure 2H, Figure 2-figure
# supplement 2).
# All other experiments (self-paced and home cage mating behavior, HCR in situ, calcium imaging
# of Vgat-Cre and Vglut2-Cre MPOA neurons, chemogenetics) are on Figshare,
# doi:10.6084/m9.figshare.27642768.v1, and their claims are marked data elsewhere.
#
# Method choices for Figure 2 taken from the code where the Methods are silent: level-4 regions
# are the ten of the code's level_4_order (CTXpl, CTXsp, STR, PAL, TH, HY, MBsen, MBmot, MBsta,
# P); the level-6 family is the level-6 regions whose level-4 ancestor is one of these ten; the
# group mean is np.nanmean over brains; Tukey's HSD is scipy's tukey_hsd on the three groups.
# Where the Methods and the code disagree the Methods are followed and the code is a variant.
