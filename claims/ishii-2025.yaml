    Figshare) that its Figure 2 code reads.
  source: Data availability; Figure 2.ipynb at GitHub commit 4e98c43, cell 4
  quote: Whole brain FosTRAP activity mapping data is available on DANDI
  data: with_inputs
  criterion: Densities computed here as in fig2c-brain-wide-increase (ClearMap registration to the
    Unified Anatomical Atlas, ilastik segmentation, count per region over region volume). The
    trained classifier is not deposited, so it is retrained as the Methods describe (10 random
    chunks of 1.8 x 1.8 mm x 100 um from four subjects). The link holds (reproduced) when the 14
    brains fall into groups of 4, 5 and 5 matching the table's Stim labels and, for each brain,
    the median over level-6 regions of the absolute relative difference from the table's density
    of the matched subject is within 10% (the protocol's default tolerance). Partially reproduced
    when the groups match but fewer than 10 of the 14 brains meet the 10% bound. The per-brain
    correlation over regions is reported. The table is outside data (Figshare
    doi:10.6084/m9.figshare.27642768.v1).
- id: fig2c-brain-wide-increase
  statement: TRAP-labeled (tdTomato+) cell density increases brain-wide when 4-OHT is given after
    male ejaculation, compared with the appetitive phase.
  source: Results, Brain-wide mapping of neural response to male ejaculation, paragraph 1; Figure
    2C and 2D
  quote: As a result, we found the level of tdTomato expression increased in a brain-wide manner
    during the post-ejaculatory period when compared to the appetitive phase
  data: with_inputs
  criterion: Method from the Methods (Brain-wide analysis) and the Figure 2 legend, with the code
    where they are silent. Per brain, tdTomato+ cells per atlas region (Unified Anatomical Atlas,
    Kim lab, outside data; Figure 2.ipynb reads its label table
    atlas_info_KimRef_FPbasedLabel_v2.9) divided by region volume (cells per mm3), at hierarchy
    level 4. Per region a one-way ANOVA over the three groups (appetitive n=4, consummatory n=5,
    post-ejaculatory n=5), Benjamini-Hochberg correction at FDR 0.05 (Methods and legend; the
    code uses 0.1, shown as a variant), then Tukey's HSD (FWER 0.05) post-ejaculatory against
    appetitive for regions significant in the ANOVA. Open, and named here because it could change
    the outcome; (1) the level-4 family is the ten regions of the code or the twelve of the Figure
    2C legend (adding VERM and HEM); (2) region volume is the atlas volume or the region's volume
    in each brain's own space; the paper gives neither. Supplementary file 2, which lists which
    regions were significant, is not in the text read, so "brain-wide" is read as follows,
    stated before analysis. Reproduced when the post-ejaculatory mean exceeds the appetitive mean
    in at least 80% of the level-4 regions of the family and at least half of the family is
    significant (ANOVA q < 0.05 and Tukey p < 0.05, post-ejaculatory higher). Partially
    reproduced when the direction holds in at least 80% but fewer than half are significant. Not
    reproduced otherwise. Every reading is run; when they give different outcomes the claim is
    blocked as methods_underspecified.
