  statistics:
  - test: two-way RM-ANOVA, time by housing interaction
    statistic: F(49, 19404) = 1.538
    p: 0.009
    n: 199 co-registered neurons from 6 male mice
  criterion: >-
    M3 z traces of the 199 co-registered neurons around interaction-bout onsets (UMAP social
    clusters, Methods, SLEAP) on no-stimulation sessions, before and after isolation. 50 time
