    statistic: F(25, 2550) = 1.58
    p: 0.03
    n: 50 group-housed and 54 isolated neurons from 11 and 12 male mice
  criterion: >-
    M6, unlabeled neighbouring neurons of males. Reproduced when the interaction has p < 0.05
    with isolated neurons firing more, under both spike readings. The paper gives no measure of
    "minimal"; the F and the size of the difference are reported beside those of
    fig2c-male-blampfc-excitability-up, not tested.
- id: ed2bcd-nonspecific-bla-no-rank
  statement: >-
    Nonspecific BLA neurons of males show no rank differences in excitability, group-housed or
    isolated, and isolation does not change their firing at 300 pA within any rank.
  source: Extended Data Fig. 2b–d legend; Results, Social isolation increases BLA–mPFC neuronal excitability in males and decreases it in females, paragraph 3
  quote: >-
    No detectable social rank-dependent differences were observed in non-specific BLA neurons
