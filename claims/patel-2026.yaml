  source: Figure 1c legend; Results, Social isolation increases alcohol drinking in males and decreases it in females, paragraph 2
  quote: >-
    Social isolation produced opposite effects on alcohol licking in males and females ( N =
    14 male and 11 female mice, two-way ANOVA, interaction: F (1, 23) = 21.04, *** P = 0.0001;
    Sidak’s multiple comparisons test), increasing alcohol licking in males while decreasing
    it in females.
  statistics:
  - test: two-way ANOVA, sex by housing interaction
    statistic: F(1, 23) = 21.04
    p: 0.0001
    n: 14 male and 11 female mice
  criterion: >-
    Per mouse, alcohol licks averaged over the last 3 baseline days and over the 11 isolation
    days (Methods, 2BC drinking). A two-way ANOVA of sex (between) by housing (within, repeated
    measures), as the error df of 23 with 25 mice implies; Sidak post hoc tests of housing
    within each sex. Reproduced when the interaction has p < 0.05, males rise and females fall,
    and the Sidak test is significant in males. Partially reproduced when the interaction holds
    but one sex's change is in the wrong direction.
