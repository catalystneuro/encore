  statistics:
  - about: during isolation
    test: two-way ANOVA, time by stimulation interaction
    statistic: F(49, 7350) = 1.631
    p: 0.003
    n: 199 neurons from 6 male mice
  criterion: >-
    As ed9e-isolation-decreases-social-response, stimulation against no-stimulation session
    in each housing condition. Reproduced when the isolation interaction has p < 0.05 with
