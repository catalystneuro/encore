- id: ed9fg-stim-social-response
  statement: >-
    BLA-mPFC stimulation does not change mPFC responses to social interaction before isolation
    but increases them during isolation.
  source: Extended Data Fig. 9f,g legend
  quote: >-
    BLA-mPFC stimulation did not affect mPFC responses before isolation ( n = 199
    co-registered neurons from N = 6 male mice). g . BLA-mPFC stimulation increases mPFC
    responses during isolation ( n = 199 neurons/ N = 6 male mice, two-way ANOVA, interaction:
