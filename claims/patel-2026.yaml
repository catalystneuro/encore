    within 3 s of cue onset and falls back toward 0 by the end of the 3-s cue.
- id: fig3f-blampfc-distinct-clusters
  statement: >-
    Hierarchical clustering of alcohol responses gives several functional clusters, and
    BLA-mPFC neurons distribute across them differently from nonspecific BLA neurons.
  source: Figure 3d–f legends; Results, BLA–mPFC activity robustly encodes and predicts alcohol drinking in males, paragraph 3
  quote: >-
    The distribution of BLA–mPFC neurons across functional clusters suggests that
    projection-defined BLA–mPFC neurons may represent a distinct functional subpopulation with
    specific response properties to alcohol, distinct from nonspecific BLA neurons (Fig. 3f ).
  criterion: >-
    One clustering of the 736 neurons of both populations pooled ("Hierarchical clustering of
    responses to alcohol for all recorded BLA neurons", Results, paragraph 3). Ward linkage,
    Euclidean distance on each neuron's mean alcohol z trace (M3), the cut set to
    the highest linkage giving at least one nonresponsive cluster (Methods, Agglomerative
    hierarchical clustering); "nonresponsive" read as a cluster whose mean trace stays within
    +-1.98 after onset (M4). The trace span is not given; readings -3 to +5 s and 0 to +3 s
    around onset. Percentage enrichment per cluster as in Methods, Enrichment analysis. The
    paper gives no test; the Statistics section names chi-square for distributions, so a
    chi-square test of population by cluster at p < 0.05. Reproduced when the test has p <
    0.05 under both trace readings.
