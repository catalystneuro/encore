    accompanied by reduced input resistance and a higher firing threshold (Supplementary Table
    1 )
  criterion: >-
    Input resistance as in supt1-male-input-resistance-up; threshold is the smallest current
    step eliciting an action potential (Methods), under both M6 spike readings. Unpaired
    t-tests, p < 0.05. Reproduced when both differ in the stated directions; partially when one
    does. No number is checked (table values not in the text read).
