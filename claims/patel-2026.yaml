    statistic: F(9, 140) = 4.94
    p: 0.0001
    p_relation: "<"
    n: 8 male mice per group
  - about: isolation
    test: two-way ANOVA, interaction, Sidak post hoc
    statistic: F(9, 140) = 4.99
    p: 0.0001
    p_relation: "<"
    n: 8 male mice per group
  criterion: >-
    Frames of the 3-min stimulation epoch (Methods, Optogenetic stimulation during
    resident-juvenile intruder task). The df imply 10 levels crossed with group, with 16 mice
