    group-housed ( e ; two-way ANOVA, interaction: F(9,140) = 4.94, **** p < 0.0001; Sidak’s
    post hoc, *** p < 0.001) and social isolation ( f ; interaction: F(9,140) = 4.99, **** p <
    0.0001; Sidak’s post hoc, *** p < 0.001) conditions ( N = 8 male mice/group).
  statistics:
  - about: group-housed
