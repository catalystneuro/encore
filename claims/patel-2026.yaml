  source: Extended Data Fig. 5d legend
  quote: >-
    Both populations exhibited modest, transient increases in activity (<0.5 z-score)
    following cue onset
  criterion: >-
    Cue-onset z-scores per M3 with cue onset in place of bout onset. The Methods give baselines
    only for bouts ("3- or 5-s"); readings 3 s and 5 s before cue onset (the intertrial interval
