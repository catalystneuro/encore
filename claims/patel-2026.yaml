# Claims for Patel, Kim et al. (2026), Nature Neuroscience, doi:10.1038/s41593-026-02413-x, on
# dandiset 001454.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record, open access (PMC13633117, as served by Europe PMC): main
# text, figure legends, Extended Data Fig. 1 to 10 legends, Methods, and the one supplement file
# fetched (the Nature Portfolio reporting summary). Supplementary Tables 1 and 2 (membrane
# properties by housing and by rank) are not in the text; only their legends are. The claims
# that rest on them (input resistance, firing threshold) carry no numbers. The bioRxiv
# preprint (doi:10.1101/2023.11.09.566421, version 1) was read only to compare Methods; it is
# cited once below where it settles a detail. No figure image was available (no PDF of the
# article), so no claim is read from a figure.
#
# Code: the paper links no code ("All custom code used in this study is available upon
# request"). No repository was read. Every method below comes from the Methods, the legends
# or the reporting summary.
#
# Data the paper used, as it reports them. Adult C57BL/6J mice, males and females, group
# housed 3 to 4 per cage, then socially isolated for 11 to 16 days.
# - Social rank. Tube dominance test, round-robin within each cage; rank is the proportion of
#   wins (ranks 1 to 4; 1 dominant).
# - Home-cage-like 2BC. Daily 1-h two-bottle choice (15% alcohol against water) in Med
#   Associates chambers with lickometers; 5 to 6 baseline days, then 11 to 14 isolation days.
#   Alcohol licks are averaged over the last 3 baseline days and over 11 isolation days
#   (Fig. 1, 14 males and 11 females; Extended Data Fig. 1, 26 males and 9 to 14 females).
#   Blood alcohol from trunk blood after a session (19 males).
# - Ex vivo whole-cell current clamp of retrogradely labeled BLA-mPFC neurons and unlabeled
#   neighbours, after 14 to 16 days of isolation or group housing, 500-ms steps from -120 to
#   +500 pA in 20-pA steps (Fig. 2, Extended Data Figs. 2 and 3).
# - Calcium imaging (Inscopix, 10 Hz, CNMF-E) in the cued-2BC task: 30 trials per session (20
#   choice, 5 forced water, 5 forced alcohol or sucrose), 3-s cue, 58-s access. Nonspecific BLA
#   (540 neurons, 10 males) and BLA-mPFC projectors (196 neurons, 11 males) (Fig. 3, Extended
#   Data Figs. 5 and 6). mPFC neurons with ChrimsonR stimulation of BLA terminals on 50% of
#   choice trials, before and after 14 days of isolation, for alcohol (240 and 281 neurons, 6
#   and 5 mice) and sucrose (284 and 343 neurons, 7 mice) (Figs. 5 and 6, Extended Data Fig. 8).
#   mPFC imaging during the resident-juvenile intruder task with and without stimulation,
#   before and after isolation, 199 co-registered neurons from 6 mice (Extended Data Fig. 9).
#   Stability imaging at two time points 2 to 3 weeks apart (Extended Data Fig. 7).
# - Optogenetics with behaviour only. Lick-triggered ChR2 stimulation in 2BC (6 ChR2, 6 eYFP;
#   Fig. 4). NpHR inhibition on 50% of cued-2BC choice trials during isolation (8 per group;
#   Fig. 6o-q). ChrimsonR or NpHR in the resident-juvenile intruder task with SLEAP pose
#   tracking (Extended Data Fig. 4).
# Dandiset 001454's description says it holds the calcium imaging in two behavioural
# paradigms, behavioural videos with pose tracking, histology and the raw current clamp
# recordings. Whether it holds the 2BC licks, ranks and blood alcohol is the author's to find.
#
# Shared methods, cited, used by the criteria below (M1 to M7).
# M1 Lick bout. Two or more consecutive licks within 1 s; onset at the first lick (Methods,
#    Lick microstructure analysis). Licks per bout and bouts per session follow. Bout duration
#    (Fig. 4h) is not defined; first to last lick of the bout is used, a standard choice.
# M2 Bouts for calcium analyses. Only bouts separated by 3 s or more (Methods, Lick
#    microstructure analysis). The preprint (Methods, Lick microstructure analysis) gives the
#    reason, "the period used for baseline calculation", so the gap is read as from the last
#    lick of the previous bout to the onset. The reading onset to onset is shown as a variant.
#    Mice with fewer than 50 alcohol licks are excluded from calcium analyses (Methods, 2BC
#    drinking; reporting summary, Data exclusions).
# M3 Neuron response. For each bout, z = (F(t) - F_m)/s.d. with F_m and s.d. from the pre-bout
#    baseline; z traces averaged over a matched number of bouts per condition per neuron
#    (Methods, Population-level mean response calculation). The baseline is "3- or 5-s"; for
#    drinking it is 3 s (it matches the 3-s bout gap of M2, per the preprint). For social
#    interaction bouts the Methods do not say which; readings 3 s and 5 s. How bouts are
#    matched is not said; readings (a) all conditions cut to the smallest bout count, the
#    bouts taken at random, (b) the same, taking the first bouts. A neuron's scalar response
#    is its mean z from bout onset to 3 s, the window the Methods give for responsiveness.
#    The trace F is the CNMF-E trace the dataset holds (the Methods name dF/F0).
# M4 Responsive neurons. Excited when the M3 response is at least +1.98, inhibited when at
#    most -1.98 (Methods; Fig. 6d,e,l,m legends; Extended Data Fig. 8m,n). The Methods also
#    allow a Wilcoxon signed-rank test; it is shown as a variant where a legend gives no
#    threshold.
# M5 Decoding (Methods, Pseudo-simultaneous population generation and decoding). Bouts longer
#    than 1 s and separated from other bouts by at least 2 s, labeled alcohol (or sucrose)
#    against water. Five-fold cross-validation within each animal (80% and 20% of each
#    animal's bouts; each fold holds at least one bout per class; Results, BLA-mPFC activity
#    paragraph 4). Training and test pseudo-populations of T = 10,000 samples, each a vector
#    with one time point per animal drawn from a bout of the sampled label; majority class
#    subsampled in training; linear SVM. Open: which time points of a bout are sampled
#    (readings: every frame from onset to bout end; frames from onset to 3 s), the signal
#    (readings: the raw CNMF-E trace; the M3 z-score), the SVM regularization (the library
#    default, C = 1, a standard choice), how chance is formed (readings: training labels
#    shuffled; bout labels shuffled before sampling), and the number of repetitions beyond
#    the five folds (not given; five folds, one repetition, is used and stated).
# M6 Excitability. Number of action potentials per 500-ms step (Methods, Ex vivo whole-cell
#    patch-clamp electrophysiology). The F(25, df) statistics of Fig. 2 imply 26 current
#    levels, read as 0 to +500 pA in 20-pA steps, and an error term of 25 times (neurons minus
#    groups), so a two-way ANOVA of current by group with repeated measures on current and
#    neurons as units. Spike detection is not given (Clampfit); readings (a) upward crossings
#    of 0 mV, (b) upward crossings of -20 mV; the outcome must agree under both.
# M7 Bonferroni families are not stated where legends say "Bonferroni adjusted"; criteria name
#    the plausible families.
# M8 Rank in correlations. The Methods define relative rank as the proportion of wins (Methods,
#    Tube dominance test); the legends correlate "Rank" and Extended Data Fig. 1a plots percent
#    wins per rank. Readings (a) the integer rank within the cage (1 dominant), (b) the
#    proportion of wins (sign reversed, so that larger means more subordinate).
