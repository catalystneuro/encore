- id: ed9hi-stim-inverts-social-response
  statement: >-
    In group-housed mice, mPFC social responses with and without stimulation are negatively
    correlated across neurons (stimulation inverts their sign); during isolation they are
    uncorrelated.
  source: Extended Data Fig. 9h,i legend; Results, BLA–mPFC stimulation mimics social-isolation-induced mPFC responses to alcohol and sucrose in males, paragraph 4
  quote: >-
    Stimulation and no-stimulation mPFC responses are negatively correlated in group-housed
    mice ( h ; n = 199 neurons/ N = 6 male mice, Pearson correlation, r 2 = 0.02, Bonferroni
    adjusted * p = 0.04) but uncorrelated during isolation ( i ; r 2 = 0.0, p = 1).
  statistics:
  - about: group-housed
    test: Pearson correlation
    statistic: r2 = 0.02
    p: 0.04
    corrected: Bonferroni
    n: 199 neurons from 6 male mice
  - about: isolation
    test: Pearson correlation
    statistic: r2 = 0.0
    p: 1
    corrected: Bonferroni
    n: 199 neurons from 6 male mice
  criterion: >-
    Per neuron, scalar M3 social response (0 to 3 s) with and without stimulation. The
    Bonferroni family is not stated. A two-test family cannot give the printed p = 0.04: with
    r2 = 0.02 and 199 neurons the uncorrected p is about 0.046, and r2 below 0.025 keeps the
    doubled p above 0.05. Readings (a) uncorrected, (b) two tests, reported both; the outcome
    is judged on (a), the only reading consistent with the printed numbers. Reproduced when the
    group-housed r is negative with p < 0.05 and the isolation correlation has p >= 0.05, under
    both baseline readings.
- id: ed9k-o-social-decoding
  statement: >-
    In group-housed mice mPFC activity decodes social interaction above chance with and
    without stimulation; isolation abolishes decoding without stimulation and lowers accuracy,
    and BLA-mPFC stimulation raises accuracy in both housing conditions, rescuing it after
    isolation.
  source: Extended Data Fig. 9k–o legends
  quote: >-
    mPFC decodes interaction above chance under both conditions (two-way ANOVA, main effect of
    group: F(1,36) = 54.29, **** p < 0.0001; ... m . Isolation decreases mPFC decoding accuracy
    (unpaired t-test, * p = 0.02). n,o . BLA-mPFC stimulation increases decoding accuracy in
    group-housed ( n , unpaired t-test, * p = 0.01) and isolation ( o , unpaired t-test, * p =
    0.005) conditions.
  statistics:
  - about: above chance (k), main effect of group
    test: two-way ANOVA
    statistic: F(1, 36) = 54.29
    p: 0.0001
    p_relation: "<"
  - about: isolation, stimulation rescue (l), interaction
    test: two-way ANOVA
    statistic: F(1, 36) = 5.95
    p: 0.05
    p_relation: "<"
  - about: isolation lowers accuracy (m)
    test: unpaired t-test
    p: 0.02
  - about: stimulation raises accuracy, group-housed (n)
    test: unpaired t-test
    p: 0.01
  - about: stimulation raises accuracy, isolation (o)
    test: unpaired t-test
    p: 0.005
  criterion: >-
    M5 with interaction against noninteraction bouts (noninteraction bouts over 20 s split,
    bouts 2 s apart; Methods) for each of the four sessions. The df 36 imply 10 accuracy values
    per cell, so k = 10 folds here (readings: 10 folds; 5 folds repeated twice). Panels k and l
    are read as one two-way ANOVA per housing condition, data (real, shuffled) by stimulation,
    over fold accuracies (2 by 2 by 10 values, error df 36). Reproduced when, under every
    reading, the group-housed ANOVA has a real against shuffled main effect at p < 0.05 with
    real above shuffled in both stimulation conditions (Sidak); the isolation ANOVA has a data
    by stimulation interaction at p < 0.05, with isolation no-stimulation accuracy not above
    shuffled and stimulation accuracy above shuffled (Sidak); isolation no-stimulation
    accuracy is below group-housed no-stimulation (unpaired p < 0.05); and stimulation exceeds
    no-stimulation in both housing conditions (unpaired p < 0.05). Partially reproduced when
    some but not all of these hold.
- id: ed9q-stim-recruits-isolation-ensemble
  statement: >-
    BLA-mPFC stimulation recruits an mPFC ensemble resembling the isolation pattern, with
    greater overlap of excited neurons than in the group-housed comparison.
  source: Extended Data Fig. 9p–r legends; Results, BLA–mPFC stimulation mimics social-isolation-induced mPFC responses to alcohol and sucrose in males, paragraph 4
  quote: >-
    BLA-mPFC stimulation recruits a mPFC ensemble resembling isolation-induced patterns, with
    greater overlap of excited neurons vs. group-housed ( n = 199 neurons/ N = 6 male mice ,
    Chi 2 = 6.94, * p = 0.03).
  statistics:
  - test: chi-square
    statistic: Chi2 = 6.94
    p: 0.03
    n: 199 neurons from 6 male mice
  criterion: >-
    Excited neurons by M4 in each session. The contingency table is not given; readings (a)
    among neurons excited by stimulation in the group-housed session, those also excited in
    the isolation no-stimulation session, against those also excited in the group-housed
    no-stimulation session; (b) clusters from the concatenated clustering (Extended Data Fig.
    9p) cross-tabulated by session. Reproduced when, under every reading, overlap with the
    isolation pattern is greater with chi-square p < 0.05; methods_underspecified when
    readings disagree.
checks:
- date: 2026-10-21
  kind: agent
  model: claude-opus-5-5
  ready: true
  changes:
  - Header, added M8. The Methods define rank as the proportion of wins, the legends correlate "Rank"; both are now named readings, used in ed1c, ed1d, ed1e and ed1l.
  - fig1-threeway-sex-liquid-housing, the reproduced threshold was p < 0.001 with a partial grade below 0.05; the statement says only that the interaction is significant, so reproduced is now p < 0.05.
  - ed1c-rank-alcohol-males, rank readings added (M8); noted that the printed p = 0.01 matches the uncorrected p, which supports the no-correction reading.
  - ed1e-rank-alcohol-isolation, the four-test Bonferroni reading was dropped; with r2 = 0.41 and 14 mice it gives p of about 0.054, which the printed p < 0.05 excludes.
  - ed1l-rank-alcohol-females, the two-test Bonferroni family is now said to be a reading, checked against the printed p.
  - ed2e-nonspecific-bla-excitability, removed the requirement that its F be smaller than that of Fig. 2c; no part of the paper sets that test, and F values with different df are not comparable. Both spike readings now required.
  - ed4gm-locomotion-unchanged, the tracking source and the epoch are not given; readings added (EthoVision body centre or SLEAP points; 3-min stimulation epoch or the 6-min interaction).
  - ed5d-cue-response-modest, the 3-s pre-cue baseline was a choice; the Methods allow 3 or 5 s, now both readings.
  - fig3f-blampfc-distinct-clusters, added that the clustering is one clustering of both populations pooled, as the Results state.
  - fig4e-chr2-increases-alcohol, the legend does not name the effect of F(2, 20); the interaction was assumed. Session main effect and interaction are now both readings, as are the two baseline definitions (the mean of 3 days had been a variant only).
  - fig4hi-chr2-longer-bouts, OFF was fixed as the baseline session without a source; every lick triggers stimulation in the test session, so baseline and recovery sessions are now both readings.
  - fig5b, fig5c, fig5d, which trials of the stimulation sessions give the housing comparison is not said; nonstimulated only and all trials are now both readings.
  - fig6f-stim-decreases-mpfc-alcohol-si, removed "reversing its group-housed effect" from the statement; the paper does not say it.
  - fig6gj-stim-no-water-effect, source extended to Extended Data Fig. 8q,r, which shows the isolation water proportions the statement covers.
  - ed9hi-stim-inverts-social-response, a two-test Bonferroni cannot give the printed p = 0.04 with r2 = 0.02 and 199 neurons; the outcome is now judged uncorrected, the two-test result reported.
  - ed9k-o-social-decoding, the criterion required above-chance decoding in all four sessions, but the legend of panel l says isolation abolishes decoding without stimulation. Statement and criterion rewritten to the legends of k to o.
  - Added ed8op-stim-no-alcohol-proportions-si (Extended Data Fig. 8o,p), a finding with no claim.
  - Open, Supplementary Tables 1 and 2 are not in the text read; supt1 claims carry no numbers.
  - Open, ed9fg error df 7350 and fig6q error df 13 do not match the stated n; recorded in the claims, not resolved.
  - Open, Extended Data Fig. 1o-q (licking by sex within each rank) and Extended Data Fig. 9r have no claim; they are secondary panels.
  - Open, the grouping of Extended Data Fig. 4 readings (UMAP clusters or time bins) and the Fig. 1d time blocks are readings, not given by the paper; the criteria block on disagreement.
