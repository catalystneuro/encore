- id: fig8c-relative-effects
  statement: Changes in amplitude and frequency of the conditioning stimuli produced context
    effects as large and long-lasting as natural sound contexts, while AM, FM and higher-order
    changes produced substantially smaller and shorter effects; A1 is more sensitive to
    lower-order than to higher-order properties.
  source: Figure 8C; Results, Relation to stimulus properties, paragraphs 2 to 4
  quote: The effects were as large and long-lasting as those induced when natural sounds were
    used as conditioning stimuli (Fig. 8, B and C) ... but the effects were substantially smaller
    and shorter than the effects induced by the changes in natural sound contexts (Fig. 8C)
  depends_on:
  - fig8b-decay-by-property
  - fig3b-fractional-power-decay
  criterion: Per the Methods (Eq. 21 and the paragraph after it), the area under Q(t) from 0 to 4
    s for each property, divided by the area for natural sounds (Figure 3B), with 95% confidence
    intervals from 200 resamplings of 1000 samples. The paper does not say what a sample is;
    readings are probes drawn with replacement, and trials drawn with replacement within each
    probe and context. Reproduced when, under one reading, the intervals for amplitude and
    frequency include 1 (or lie above it) and those for AM, FM and higher-order lie below 1 and
    below the lower bounds of amplitude and frequency; partially reproduced when the point
    estimates fall in that pattern but some intervals do not.

- id: fig8-natural-synthetic-probes-alike
  statement: Natural and synthetic probes gave no difference in the context effects of the
    synthetic conditioning stimuli, so they were combined.
  source: Results, Relation to stimulus properties, paragraph 1
  quote: We used both natural and synthetic sounds as probe stimuli in these experiments, but
    found no difference between them and so combined the results in the population analysis
  depends_on:
  - fig8a-proportion-by-property
  criterion: A claim of absence for which the paper names no test or threshold. The test fixed
    here, before analysis, compares per property the proportion of significant probes between
    natural and synthetic probes by Fisher's exact test at 0.05, Bonferroni over the properties
    tested with both probe types. Reproduced when no property shows a difference; the
    proportions and odds ratios are given either way. As the test is not the paper's, the outcome
    rests on that assumption.

- id: fig9-mgb-fast-decay
  statement: In the auditory thalamus (MGB), context dependence of spike responses decayed
    within a short time (time constant about 80 ms; 93 probes in 14 cells), so the long-lasting
    component in A1 arises mainly in cortex.
  source: Results, Subcortical contribution to context dependence, paragraphs 2 and 3; Figure 9D
    legend
  quote: We found that the neuronal responses in MGB depended only on a short timescale
  expected:
  - quantity: decay size alpha1 of the mean SD of PSTHs
    value: 15.0
    tolerance: 1.5
    unit: spike/s
  - quantity: decay constant tau1
    value: 0.080
    tolerance: 0.008
    unit: s
  - quantity: constant kappa
    value: 2.0
    tolerance: 0.2
    unit: spike/s
  depends_on:
  - methods-recording-counts
  criterion: Per the Methods (Context dependence at suprathreshold level), PSTHs in 100-ms bins
    for k = 0 to 60 after probe onset for each context, SD over contexts with the n - 1
    denominator (Eq. 42), averaged over the 93 probes in 14 cells; one exponential with a free
    constant (Figure 9D legend). The time assigned to a bin is open; readings are its start (so
    the first bin is at 0) and its center. A single exponential fitted to 100-ms bins cannot
    resolve 80 ms finely, so tau1 is also judged against the paper's 0.1-s bin. Spike detection
    is open as in a1-mgb-firing-rates. Reproduced when, under one reading, tau1 is within
    tolerance or below 0.1 s, and the mean SD after 0.5 s is within 25% of kappa (a plateau);
    not reproduced when tau1 exceeds 0.3 s. The sizes are reported against their values.

- id: fig9-example-first-bin
  statement: In an example MGB unit, the response to a probe differed between contexts only in
    the first 100-ms bin of the PSTH.
  source: Figure 9B legend; Results, Subcortical contribution to context dependence, paragraph 2
  quote: However, in this example the effect of the conditioning stimulus was limited to the first
    bin (100 ms) of the poststimulus time histograms
  criterion: The unit is not identified; Figure 9A uses the same sound sequence as Figure 2, over
    10 repeats with three contexts (silence and two fragments). Among MGB probes with that
    design, reproduced when at least one has its SD of PSTHs over contexts (Eq. 42) larger in the
    first bin than in every later bin by at least a factor of two; the fraction of the 93 probes
    for which this holds is reported. The factor of two is this file's reading of "substantially
    different responses were observed only in the first bin" (Figure 9B legend); the paper gives
    no threshold.

- id: fig7-example-frequency-context
  statement: In an example A1 neuron, a natural sound probe preceded by three DMR contexts that
    differed only in frequency band gave significant context dependence for about 4 s.
  source: Figure 7A and 7B legend
  quote: in which a natural sound stimulus probe was preceded by 3 different synthetic conditioning
    stimuli with different bandwidths
  statistics:
  - test: Kruskal-Wallis test at each time point, P < 0.01 for at least 5 ms
    p: 0.01
    p_relation: "<"
    n: one cell, one probe in three contexts
  criterion: The cell is not identified; the author looks for a DMR frequency-variant cell with
    contexts in 0.625-2.5, 2.5-10 and 10-40 kHz and a natural sound probe. Reproduced when the
    significance measure finds a significant period ending at least 3.6 s after probe onset (4 s
    less 10%) for the matched probe; not testable when no cell matches.

- id: figs1-silence-probe
  statement: A subset of cells showed significant context dependence soon after the onset of the
    intersequence silences, but the response power attributable to the preceding stimulus alone
    faded within about 1 s after the stimulus ended.
  source: Methods, Stimulus design, paragraph 2 (Supplemental Figure S1A and S1B, not read)
  quote: even though a subset of cells showed significant contextdependence effects soon after the
    onset of intersequence intervals (Supplemental Fig. S1A)
  criterion: The supplement was not supplied, so its figure and any numbers are not known. From
    the Methods alone, the significance measure applied with the intersequence silence as the
    probe and the preceding fragment as the context, over the natural sound current-clamp cells.
    The second part concerns power, not significance. During a silence all stimulus-related
    power (Eq. 17, population average over silence probes) is attributable to the preceding
    stimulus, which is the main reading; the context-dependent power (Eq. 19) is a variant.
    Reproduced when at least one cell has a significant period starting within 0.5 s of the
    silence onset (this file's reading of "soon after"), and the power falls below 10% of its
    value at silence onset by 1.1 s (1 s plus 10%). The Methods give "within ~1 s" for the power
    (garbled sign read as about).
