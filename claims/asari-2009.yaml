- id: timescale-longer-than-membrane
  statement: The trial-to-trial noise autocorrelation and the autocorrelation of spontaneous
    activity decay within about 100 ms, much faster than the second-long timescale of context
    dependence in A1.
  source: Methods, Analysis, Timescale of intrinsic membrane properties; Results, Context
    dependence, paragraph 7
  quote: we found that ... had a sharp peak with a rapid decay (within ... 100 ms; data not shown),
    much faster than the slow timescale identified in neural responses in area A1
  criterion: Noise is the residual of each trial from its context mean (Eq. 14), its
    autocorrelation normalized by the noise variance (Eq. 45), averaged over trials and probes of
    the natural sound current-clamp data. The paper does not say which period gives the
    spontaneous activity; the only silences in the design are the intersequence intervals
    (about 6 s), which are used, whole as the main reading and without their first 1 s as a
    variant, since the Methods (Stimulus design, paragraph 2) say context effects persist soon
    after the onset of these intervals and fade within about 1 s. "Decay" is not defined; the reading
    used is the lag at which the mean autocorrelation first falls below 1/e, with the lag where it
    falls below 0.1 shown as a variant. Reproduced when both lags are under 150 ms for both noise
    and spontaneous activity under the 1/e reading, and the 1/e lag is below a third of 1.04 s.

