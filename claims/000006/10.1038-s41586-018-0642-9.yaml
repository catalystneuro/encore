    two-sample F test (simplePlots.m, plotFiringRates). Readings, (a) Bartlett's test, the two-sample
    variance test with a chi-squared statistic, (b) the code's F test; both are run and the outcome is
    the one they give. Reproduced when, for both baseline and peak, the PTlower variance is larger and
    the test has p < 0.05; partially reproduced when that holds for one.
- id: pt-lower-bursting
  statement: A substantial proportion of PTlower neurons fire bursts (18.8%), which are rare among PTupper
    cells (3.3%).
  source: Results, Cell-type-specific recordings, paragraph 3; Extended Data Fig. 5c
  quote: A substantial proportion of PTlower neurons displayed spike bursts (18.8%), which were rare among
    PTupper cells (3.3%; P = 0.006, Fisher’s exact test; Extended Data Fig. 5c).
  statistics:
  - test: Fisher's exact test
    p: 0.006
    n: 61 PTupper and 69 PTlower neurons
  depends_on:
  - pt-tagged-units
  expected:
  - quantity: bursting PTlower neurons
    value: 18.8
    tolerance: 1.88
    unit: percent
  - quantity: bursting PTupper neurons
    value: 3.3
    tolerance: 0.33
    unit: percent
  criterion: A bursting cell has more than 10% of its inter-spike intervals shorter than 5 ms (Extended
    Data Fig. 5c legend). From the code (simplePlots.m, showISIHists) intervals are taken within trials
    only, an interval across a trial boundary being dropped from the count of short intervals but kept
    in the denominator, over all of the unit's spikes. Reproduced when both percentages are within
    tolerance and the two-sided Fisher exact test on the 2 x 2 counts has p < 0.05; partially
    reproduced when the test holds and a percentage is out of tolerance.
- id: pt-selective-any-epoch
  statement: Most recorded PT neurons (122 of 130, 94%) have significant trial-type selectivity in at
    least one task epoch.
  source: Results, Cell-type-specific recordings, paragraph 4
  quote: Most recorded PT neurons had significant selectivity, defined as the difference in spike rate
    between trial types (‘lick left’ versus ‘lick right’), during at least one task epoch (P < 0.01, two-sided
    Mann–Whitney U-test; 122 out of 130; 94%).
  depends_on:
  - pt-tagged-units
  expected:
  - quantity: selective PT neurons
    value: 122
    tolerance: 12.2
  criterion: Per unit and epoch, the mean rate of each correct trial in the epoch, lick right against
    lick left, two-sided Mann-Whitney test at p < 0.01. The code (simplePlots.m, sigCellsByType) counts a
    unit when any of the sample (-2.5 to -2.1 s), delay (-1.3 to 0 s) and response (0 to 0.4 s) epochs
    is significant. "Task epoch" in the text can also be read as the full sample epoch (-2.5 to -1.5 s)
    in place of its first 400 ms; both readings are run, and the count holds if it is within tolerance
    under one.
- id: pt-variance-explained
  statement: Trial-averaged activity patterns are nearly as diverse within each PT population as across
    all neurons recorded in ALM; cell type explains relatively little of the variance.
  source: Results, Cell-type-specific recordings, paragraph 4; Extended Data Fig. 6; Discussion,
    paragraph 3
  quote: Trial-averaged activity patterns were nearly as diverse within each PT population as across all
    neurons recorded within ALM (Extended Data Fig. 6).
  depends_on:
  - pt-tagged-units
  criterion: From the Methods (variance explained paragraph) and the code (VarianceExplained.m).
    Trial-averaged lick right and lick left rates of each neuron, concatenated and z-scored (Methods);
    PCA per PT population; fraction of variance explained by 1 to 6 components (the code's Ncomp);
    compared with 1,000 size-matched samples drawn without replacement from the unidentified units of
    the same cohort (the code's groups 3 and 4). The paper gives no threshold for "nearly as diverse";
    Extended Data Fig. 6b, d plot the ratio of PT to unidentified variance explained on an axis from 1
    to 1.3 (the code's ylim). Reproduced when, for both populations, the median ratio is at most 1.3 at
    every number of components. Variants that do not change the outcome are the code's own choices,
    which differ from the Methods text (a 100 ms smoothing, sm = 39; baseline subtraction and division
    by s.d. in place of z-scoring; the first 1,000 time bins; per iteration, 50 trials of each type
    resampled with replacement for every neuron, PT and unidentified alike; the variance explained
    taken per neuron and averaged). The asterisks of the figure (ratio
    above 1, z > 1.645 of the bootstrap) are reported.
- id: pt-preparatory-activity
  statement: Along the late delay coding direction (CDlate) selectivity is substantial in both PT types,
    with 40 of 61 PTupper and 44 of 69 PTlower neurons selective.
  source: Results, Preparatory activity, paragraph 2; Extended Data Fig. 7a, b
  quote: "along a different direction in activity space, which maximized selectivity at the end of the
    delay epoch, CDlate, selectivity was substantial in both cell types18 (Extended Data Fig. 7a, b;
    PTupper: 40 out of 61 neurons selective; PTlower: 44 out of 69)"
  depends_on:
  - pt-tagged-units
  expected:
  - quantity: selective PTupper neurons in the late delay epoch
    value: 40
    tolerance: 4
  - quantity: selective PTlower neurons in the late delay epoch
    value: 44
    tolerance: 4.4
  criterion: Two parts. (a) Counts from the code (simplePlots.m, sigCellsByType) - a unit is selective
    when the mean rates of its correct trials in the late delay epoch (-0.4 to 0 s) differ between
    lick right and lick left by a two-sided Mann-Whitney test at p < 0.01; both counts within
    tolerance. (b) Selectivity along each population's CDlate, with the shared bootstrap, is
    significant (5th percentile above zero) over the late delay epoch in both populations, read as
    (i) at every time bin from -0.4 to 0 s, or (ii) for the mean over that window. Reproduced when
    both parts hold, partially reproduced when one does.
- id: pt-upper-early-preparatory
  statement: Along the early coding direction (CDearly, first 400 ms of the sample epoch), selectivity is
    larger and more consistent across trials in the PTupper population than in the PTlower population.
  source: Results, Preparatory activity, paragraph 2; Fig. 5a, b
  quote: In this projection, selectivity was larger and more consistent across trials in the PTupper population
    compared to the PTlower population (Fig. 5b).
  depends_on:
  - pt-tagged-units
  criterion: CDearly and selectivity with the shared bootstrap. The paper reports no test or window for
    "larger". Readings for the window over which bootstrap selectivity is averaged, (a) -2.5 to -2.1
    s, the CDearly window, (b) the sample epoch -2.5 to -1.5 s. The paper gives no rule for
    "larger"; readings fixed here, (i) the bootstrap median of the PTupper mean exceeds that of
    PTlower, (ii) in addition the PTupper 5th percentile exceeds the PTlower median. "More consistent
    across trials" is read as a smaller spread of the bootstrap (which resamples trials) relative to
    its median, the s.d. over median; the paper names no measure. Reproduced when both hold,
    partially reproduced when larger holds alone, not reproduced when larger does not hold.
- id: pt-upper-persistent
  statement: In the PTupper population, selectivity along CDearly remains constant through the sample
    and delay epochs until the go cue.
  source: Results, Preparatory activity, paragraph 2; Fig. 5b
  quote: Furthermore, selectivity in the PTupper population remained constant throughout the sample and
    delay epochs until the go cue, implying retention of decision-related information.
  depends_on:
  - pt-upper-early-preparatory
  criterion: PTupper selectivity along its CDearly, shared bootstrap. Readings of "remained constant"
    (the paper names no measure), (a) the 5th percentile is above zero at every time bin from -2.1 s
    to the go cue; (b) the mean over the last 400 ms before the go cue (-0.4 to 0 s) is significant by
    the bootstrap (fewer than 5% of iterations at or below zero), the window and test the paper uses
    for PTlower (pt-lower-cdearly-decay). Reproduced when the readings agree that it holds; the ratio
    of the mean in -0.4 to 0 s to the mean in -2.5 to -2.1 s is reported.
- id: pt-lower-cdearly-decay
  statement: In the PTlower population, selectivity along CDearly decays rapidly, with no significant
    selectivity in the 400 ms before the go cue (P = 0.34, bootstrap).
  source: Results, Preparatory activity, paragraph 2; Fig. 5b
  quote: By contrast, selectivity in the PTlower population decayed rapidly along CDearly (no significant
    selectivity in 400 ms preceding go cue; P = 0.34, bootstrap).
  statistics:
  - test: bootstrap
    p: 0.34
    n: 69 PTlower neurons, 4 mice
  depends_on:
  - pt-tagged-units
  criterion: A claim of absence, judged on the paper's test. PTlower selectivity along its CDearly with
    the shared bootstrap; the p-value is the fraction of iterations in which the mean selectivity over
    -0.4 to 0 s is at or below zero (one-sided, as the paper's bootstrap tests are). Reproduced when p
    >= 0.05; not reproduced when p < 0.05. The p-value is compared with the reported 0.34, and the
    selectivity in that window is given either way.
- id: pt-cd-stability
  statement: The coding direction stays more similar across the sample and delay epochs in the PTupper
    population than in the PTlower population, whose delay-epoch coding directions are largely
    orthogonal to those of the sample epoch.
  source: Results, Preparatory activity, paragraph 2; Extended Data Fig. 7c, d
  quote: For the PTupper population, the CD remained more similar across the sample and delay epochs compared
    to the PTlower population (Extended Data Fig. 7c, d).
  depends_on:
  - pt-tagged-units
  criterion: The paper reports no number or test. Two measures from the paper. (a) Extended Data Fig. 7d
    legend and the code (Projections.m, plotEarlyLateCorr) - Pearson's r across the units of a
    population between the CDearly and CDlate weights. (b) Methods and the code (CDCorrelation.m,
    compareEpochs) - the inner product of the unit-normalised CDs of the sample (-2.5 to -2.1 s) and
    late delay (-0.4 to 0 s) windows, mean over the bootstrap (the code uses 100 iterations, all
    trials per type up to 500). Reproduced when PTupper's value exceeds PTlower's under both
    measures. The code's interval (mean +/- 1.96 s.e. over iterations), the r p-values, and the
    PTlower values (for "largely orthogonal", which the paper does not quantify) are reported.
- id: pt-single-neuron-early-selectivity
  statement: Individual PTupper neurons have higher early selectivity than PTlower neurons (0.41 +/- 0.04
    against 0.25 +/- 0.02, mean +/- s.e.m., P < 0.01).
  source: Results, Preparatory activity, paragraph 2
  quote: "exhibited higher early selectivity (PTupper: 0.41 ± 0.04; mean ± s.e.m.; PTlower: 0.25 ± 0.02;
    P < 0.01)"
  statistics:
  - test: not named
    p: 0.01
    p_relation: "<"
    n: 61 PTupper and 69 PTlower neurons
  depends_on:
  - pt-tagged-units
  expected:
  - quantity: PTupper mean early selectivity
    value: 0.41
    tolerance: 0.04
  - quantity: PTlower mean early selectivity
    value: 0.25
    tolerance: 0.02
  criterion: Tolerances are the reported s.e.m. The paper does not define "early selectivity" or name
    the test. Readings of the measure, each from the first 400 ms of the sample epoch (-2.5 to -2.1 s),
    over correct trials, (a) the absolute value of the unit's CD weight before normalisation, the
    difference of mean rates over the root of the summed variances (Methods, equation 1); (b) the d'
    at the accuracy-maximising threshold that decodingAccuracy.m computes (acc.dprime, from doROC.m),
    as an absolute value. Readings of the test, (i) two-sided Student's t-test (Methods - all
    two-sample t-tests were Student's), (ii) two-sided Mann-Whitney test (used for the same window in
    Extended Data Fig. 9; decodingAccuracy.m computes both). The measure is a reading of the reported
    numbers, so a match under either reading counts; the test is an open method detail, so both
    tests are run on that measure and the outcome is the one they give (methods_underspecified when
    they differ). Reproduced when, under one reading of the measure, both means are within tolerance
    and PTupper is higher with p < 0.01 under both tests; partially reproduced when PTupper is higher
    with p < 0.01 under both tests but a mean is out of tolerance under every reading.
- id: pt-upper-decoding
  statement: Single PTupper neurons decode trial type better than PTlower neurons in the first 400 ms of
    the sample epoch; 24.6% (15 of 61) of PTupper and 4.4% (3 of 69) of PTlower neurons reach 70%
    accuracy, mean accuracy is 64.4 +/- 1.0% against 58.9 +/- 0.6%, and the ten most discriminative
    neurons are all PTupper.
  source: Extended Data Fig. 9a, b legend; Results, Preparatory activity, paragraph 2
  quote: "24.6% (15 out of 61) of PTupper neurons predicted trial type with at least 70% accuracy, whereas only
    4.4% (3 out of 69) of PTlower neurons did so. Mean accuracy was also significantly higher in PTupper neurons
    (PTupper: 64.4 ± 1.0%; PTlower: 58.9 ± 0.6%, mean ± s.e.m.; P = 1 × 10−4, two-sided Mann–Whitney test).
    The ten most discriminative neurons all belonged to the PTupper population."
  statistics:
  - test: two-sided Mann–Whitney test
    p: 1.0e-04
    n: 61 PTupper and 69 PTlower neurons
  depends_on:
  - pt-tagged-units
  expected:
  - quantity: PTupper neurons with at least 70% accuracy
    value: 15
    tolerance: 1.5
  - quantity: PTlower neurons with at least 70% accuracy
    value: 3
    tolerance: 0.3
  - quantity: PTupper mean accuracy
    value: 64.4
    tolerance: 1.0
    unit: percent
  - quantity: PTlower mean accuracy
    value: 58.9
    tolerance: 0.6
    unit: percent
  criterion: Methods (single-cell decoding) and the code (decodingAccuracy.m, doROC.m). Per unit, the
    mean rate of each correct trial in -2.5 to -2.1 s; every observed rate is a threshold, with the
    polarity set by the side of the ROC area; accuracy is the maximum over thresholds of the fraction
    of trials classified correctly. "At least 70% accuracy" has two readings, (a) accuracy >= 0.70,
    (b) the code's cut (decodingAccuracy.m, calcTail), accuracy above the mean + 1 s.d. of the
    accuracies of all PT units of both types, which the text reports as 70%; the counts hold if they
    match under one. Mean tolerances are the reported s.e.m. Reproduced when all four
    numbers are within tolerance, the two-sided Mann-Whitney test has p < 0.05 with PTupper higher,
    and the ten most accurate units are all PTupper; partially reproduced when the test holds and some
    of the rest do not.
- id: pt-upper-decoding-rectified
  statement: Decoding from spike rates rectified at baseline, no PTlower neuron reaches 70% accuracy while
    the same 24.6% of PTupper neurons do, PTupper neurons make up 20 of the 21 most predictive, and mean
    accuracy is 62.7 +/- 1.1% against 56.7 +/- 0.4%.
  source: Extended Data Fig. 9c, d legend
  quote: "Disregarding spike rate changes below baseline, no PTlower neurons predicted trial type with at least
    70% accuracy, whereas the same 24.6% of PTupper neurons continued to do so and accounted for 20 out of
    21 of the most predictive neurons (PTupper: 62.7 ± 1.1%; PTlower: 56.7 ± 0.4%, mean ± s.e.m.; P = 9 × 10−7,
    two-sided Mann–Whitney test)."
  statistics:
  - test: two-sided Mann–Whitney test
    p: 9.0e-07
    n: 61 PTupper and 69 PTlower neurons
  depends_on:
  - pt-upper-decoding
  expected:
  - quantity: PTlower neurons with at least 70% accuracy
    value: 0
    tolerance: 0
  - quantity: PTupper neurons with at least 70% accuracy
    value: 15
    tolerance: 1.5
  - quantity: PTupper among the 21 most predictive neurons
    value: 20
    tolerance: 2
  - quantity: PTupper mean accuracy
    value: 62.7
    tolerance: 1.1
    unit: percent
  - quantity: PTlower mean accuracy
    value: 56.7
    tolerance: 0.4
    unit: percent
  criterion: As pt-upper-decoding, after subtracting from each trial's rate the unit's baseline (the
    mean over the two trial types of their mean rate in -3.1 to -2.7 s) and setting negative values to
    zero (decodingAccuracy.m, signConstraint 1). Under reading (b) of the 70% cut, the code recomputes
    the mean + 1 s.d. from the rectified accuracies. Reproduced when all numbers are within tolerance and
    the Mann-Whitney test has p < 0.05 with PTupper higher; partially reproduced when the test holds
    and a number is out of tolerance.
- id: pt-lower-late-and-motor
  statement: PTlower neurons carry late preparatory activity (selectivity along CDlate) and a movement
    command; along the go cue coding direction (CDgo) selectivity is larger, emerges faster and persists
    longer in PTlower than in PTupper.
  source: Results, Movement commands, paragraph 2; Fig. 6b, c; Extended Data Fig. 7b; Discussion,
    paragraphs 1 and 3
  quote: Along CDgo, selectivity was larger, emerged faster, and persisted longer in the PTlower than in the
    PTupper population (Fig. 6b, c).
  depends_on:
  - pt-preparatory-activity
  - pt-cdgo-onset
  criterion: CDgo (0 to 0.4 s, orthogonalised to CDlate) and selectivity with the shared bootstrap,
    go-cue aligned. Late preparatory activity is part (b) of pt-preparatory-activity for PTlower. For
    CDgo, the paper gives no measure; readings fixed here from its words. Larger, (a) the bootstrap
    median of the mean selectivity over 0 to 0.4 s, (b) the peak of the median selectivity after the
    go cue; PTlower above PTupper. Emerged faster, from pt-cdgo-onset. Persisted longer, the last time
    after the go cue of the first run of bins with the 5th percentile above zero is later for PTlower.
    Reproduced when PTlower CDlate selectivity holds and larger, faster and longer all hold; partially
    reproduced when some do.
- id: pt-cdgo-onset
  statement: Along CDgo, significant selectivity emerges 24 ms after the go cue in PTlower neurons,
    faster than in PTupper neurons (48 ms), consistent with a role in movement initiation.
  source: Results, Movement commands, paragraph 2; Fig. 6c legend
  quote: In the PTlower population, significant selectivity emerged 24 ms after the go cue, faster than in
    the PTupper population (48 ms) (Fig. 6c).
  depends_on:
  - pt-tagged-units
  expected:
  - quantity: PTlower CDgo selectivity onset after the go cue
    value: 24
    tolerance: 5
    unit: ms
  - quantity: PTupper CDgo selectivity onset after the go cue
    value: 48
    tolerance: 5
    unit: ms
  criterion: Onset is the first time after the go cue at which the 5th percentile of the bootstrap
    selectivity along CDgo is above zero (Fig. 6c legend, significance as in the Methods). The
    tolerance is one 5 ms bin, the resolution of the rates (10% of the values is below a bin). Open,
    with readings - the bin time stamp, (a) bin centre, (b) bin end, (c) bin start; whether onset must
    be sustained, (i) the first significant bin, (ii) the first of three consecutive significant bins.
    Reproduced when, under one reading, both onsets are within tolerance and PTlower is earlier;
    partially reproduced when PTlower is earlier but an onset is out of tolerance.
- id: reaction-time
  statement: The first detectable movement occurs about 50 ms after the go cue (99% confidence interval 38
    to 56 ms).
  source: Results, Movement commands, paragraph 2; Fig. 6c legend; Methods, Videography
  quote: "The onset of the first detectable movement occurred approximately 50 ms after the go cue onset (99%
    confidence interval: 38–56 ms)."
  statistics:
  - test: bootstrap of session means across mice and sessions
    ci:
      level: 0.99
      low: 38
      high: 56
      unit: ms
    n: 3 mice, 14 sessions
  expected:
  - quantity: reaction time
    value: 50
    tolerance: 6
    unit: ms
  criterion: Methods, Videography - reaction time from the luminance change in a region of interest just
    below the jaw in 400 Hz side-view video, averaged over all trials of a session; confidence interval
    by bootstrapping session means across mice (3) and sessions (14). The Methods say 95% and the
    Results 99%; both are computed. The region is placed by hand and the onset rule for the luminance
    trace is not given, so the test needs the video. The tolerance is the paper's own uncertainty, the
    99% interval of 38 to 56 ms; the expected entry carries its upper side (6 ms), and the claim is
    judged on the whole interval. Reproduced when the bootstrap mean lies within 38 to 56 ms and the
    computed interval overlaps it. Not testable if the dandiset holds no video.
- id: pt-cd-change-at-go-cue
  statement: The coding direction changes rapidly at the go cue in the PTlower population, and more slowly,
    over several hundred milliseconds, in the PTupper population.
  source: Results, Movement commands, paragraph 2; Extended Data Fig. 7c, e
  quote: The coding direction changed rapidly at the go cue in the PTlower population, and more slowly, over
    several hundred milliseconds, in the PTupper population (Extended Data Fig. 7c, e).
  depends_on:
  - pt-tagged-units
  criterion: Extended Data Fig. 7e legend - the correlation (inner product of unit-normalised CDs, Methods)
    between the CD at each time bin and CDlate, normalised to its mean in the 400 ms before the go cue;
    1,000 bootstrap iterations. The code (CDCorrelation.m) averages the inner product over the CDs of
    every bin of the delay epoch (-1.3 to 0 s) and normalises to the delay epoch mean, with 100
    iterations; this is a variant. The paper does not say how the speed of change is measured. The
    reading fixed here is the time after the go cue at which the bootstrap median of the normalised
    correlation first falls below a level, with levels (a) 0.5 and (b) 0.75. Reproduced when PTlower's
    time is shorter than PTupper's and PTupper's is at least 0.2 s ("several hundred milliseconds");
    partially reproduced when PTlower's is shorter only.
- id: pt-lower-movement-termination
  statement: In PTlower neurons, selectivity along both CDlate and CDgo ceases with the offset of movement
    (the last lick), together with an abrupt change in the coding direction; this transition is not seen
    in the PTupper population.
  source: Results, Movement commands, paragraph 3; Extended Data Fig. 10a-c
  quote: Selectivity along both CDlate and CDgo ceased with the offset of movement (Extended Data Fig. 10a, b),
    simultaneous with an abrupt change in the coding direction (Extended Data Fig. 10c). This transition was
    not observed in the dynamics of the PTupper population.
  depends_on:
  - pt-lower-late-and-motor
  criterion: Rates aligned to the last lick-port contact after the go cue (either side) on correct trials,
    within each unit's trial range (loadAndProcessData.m, getLickInfo and ObjToLickPSTH), projected on
    the go-cue CDlate and CDgo of the population, without baseline subtraction (Projections.m), with the
    shared bootstrap. The paper gives no window. Readings fixed here - (a) the 5th percentile is above
    zero for most bins of the 200 ms before the last lick and for none of the bins from 0.2 to 0.4 s
    after it; (b) the same with 400 ms windows before and from 0.1 to 0.5 s after. Reproduced when this
    holds for PTlower along both CDs; partially reproduced for one CD. The PTupper result along both
    CDs and the CD correlation matrix after the go cue (Extended Data Fig. 10c, from CDCorrelation.m with
    lick-aligned rates) are reported, as the paper gives no measure for the abrupt change.
- id: pt-cohort-control
  statement: Differences in coding between PTupper and PTlower neurons are not explained by the animal
    cohorts; unidentified neurons recorded in the two cohorts give similar coding direction projections,
    nearly indistinguishable once depth-matched.
  source: Results, Preparatory activity, paragraph 2; Extended Data Fig. 8 legend; Methods,
    Electrophysiology
  quote: Differences in coding between PTupper and PTlower neurons could not be explained by variation across
    animal cohorts (Extended Data Fig. 8).
  depends_on:
  - pt-upper-early-preparatory
  - pt-cdgo-onset
  expected:
  - quantity: unidentified units, PTupper cohort
    value: 495
    tolerance: 49.5
  - quantity: unidentified units, PTlower cohort
    value: 511
    tolerance: 51.1
  - quantity: depth-matched unidentified units, PTlower cohort
    value: 276
    tolerance: 27.6
  criterion: Unidentified single units of each cohort, with the inclusion rule of the opening comment
    (the code applies it to untagged units, groups 3 and 4; whether the reported counts are before or
    after it is open, and both are given); depth matching by keeping the PTlower cohort's left ALM
    recordings only (Methods; the Extended Data Fig. 8 legend says the removed units were from the
    "contralateral hemisphere" and recorded at a lower depth, which fits the Methods' right ALM only
    if contralateral is taken relative to the PTupper recordings, so the Methods are followed).
    Selectivity along CDearly and CDgo computed for each unidentified
    population as for the PT populations. The paper gives no test for "similar". Reproduced when, for
    the depth-matched populations, the difference that separates the PT types is absent - the
    PTlower-cohort population's mean CDearly selectivity over -2.5 to -2.1 s lies inside the
    PTupper-cohort population's 5-95% bootstrap interval, and the two CDgo onsets (pt-cdgo-onset rule)
    differ by no more than the difference between the PT types; partially reproduced when one holds.
    The z-scored variant of the legend's bottom row is shown.
- id: pt-types-differ-in-timing
  statement: The two PT types have different roles in time; PTupper populations carry early preparatory
    activity that persists until movement, while PTlower populations mainly carry late preparatory
    activity and movement commands.
  source: Abstract; Discussion, paragraphs 1 and 3
  quote: Preparatory activity appeared early and remained persistent in PTupper neurons, whereas movement
    commands were observed in PTlower neurons.
  depends_on:
  - pt-upper-early-preparatory
  - pt-upper-persistent
  - pt-lower-cdearly-decay
  - pt-single-neuron-early-selectivity
  - pt-lower-late-and-motor
  - pt-cdgo-onset
  criterion: The summary of the claims it depends on, with no measure of its own. Reproduced when all six
    are reproduced; partially reproduced when at least one claim on each side (PTupper early and
    persistent; PTlower late and motor) is reproduced; not reproduced otherwise.
checks:
- date: "2026-10-20"
  kind: agent
  model: claude-opus-5-5
  ready: true
  changes:
  - Opening comment. Added two code details read in Ephys.zip Code/ (Figshare doi:10.25378/janelia.7007846 v1),
    the zero weight of a neuron with rank-sum p of 1 in DirectionVector, and the epoch means taking time > start
    and <= end, unlike the CD windows.
  - pt-types-transcriptomic. Statement said the data divide PT neurons into two types; the paper says they suggest
    it.
  - pt-projection-cluster-mapping. Source was paragraphs 4 and 5; both counts are in paragraph 4.
  - pt-types-account-for-all-pt. Statement made the paper's "suggest" a conclusion; reworded to "suggesting".
  - pt-depth. The code plots each unit's depth field (meta.depth), not the session manipulator depth it also stores;
    both are named as readings.
  - pt-lower-heterogeneous-rates. Bartlett's test was made the main reading from the words "χ2 test", which do not
    name a two-sample test, and the code's F test only a variant; both are now readings, and the outcome is the one
    they give.
  - pt-upper-early-preparatory. The rule for "larger" (PTupper 5th percentile above the PTlower median) is not in the
    paper; it is now named as one of two readings fixed here, with the plain comparison of medians.
  - pt-single-neuron-early-selectivity. The criterion accepted p < 0.01 under either test; the test is an open method
    detail, so both are run and the outcome is the one they give (protocol, Reader, step 3).
  - pt-upper-decoding and pt-upper-decoding-rectified. The code does not cut at a fixed 70%; calcTail counts units
    above the mean + 1 s.d. of all PT accuracies, recomputed for the rectified rates. Added as a reading of the
    counts. Removed the statistic field, which held group means and s.e.m., not a test statistic; the means are in
    expected.
  - pt-variance-explained. Added to the code's variants the trial resampling of every neuron per iteration and the
    variance explained per neuron, averaged.
  - pt-cdgo-onset. Statement added "before the first detectable movement", which the paper does not say of these
    onsets; replaced with the legend's "consistent with a role in movement initiation".
  - reaction-time. Tolerance was 10% of 50 ms although the paper gives its own uncertainty, the 99% interval 38 to
    56 ms; the claim is now judged on that interval and the tolerance is its upper side, 6 ms.
  - pt-cohort-control. Noted that the Extended Data Fig. 8 legend calls the removed units "contralateral", which fits
    the Methods' right ALM only relative to the PTupper recordings; the Methods are followed.
  - pt-lower-late-and-motor and pt-types-differ-in-timing. Source cited Discussion paragraph 2; the sentences are in
    paragraphs 1 and 3.
  - Open, not settled. Several judging rules are fixed by the reader because the paper gives none, and are named as
    readings. They are the ratio bound of 1.3 in pt-variance-explained (the figure's axis range), the levels 0.5 and
    0.75 and the 0.2 s bound in pt-cd-change-at-go-cue, the windows in pt-lower-movement-termination, the "similar"
    rule in pt-cohort-control, and "more consistent across trials" in pt-upper-early-preparatory. An attempt can
    judge them only as stated.
  - Open, not settled. Paragraph numbers in the Cell-type-specific recordings section could not be checked against the
    PDF layout (no renderer here); the quotes locate each finding.
