# Claims for Economo, Viswanathan, Tasic et al. (2018) on dandiset 000006.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-20, protocol
# as stated in docs/protocol.md (pilot-10), Reader steps 1 to 4.
#
# Why this file was rewritten. The earlier file was written from the abstract only and is
# deprecated. Read against the full text on 2026-10-20, its claims pt-lower-late-and-motor and
# pt-types-differ-in-timing were tested with fractions of selective units and a label-shuffle null,
# measures the paper does not use (it uses coding directions, a hierarchical bootstrap and single
# neuron early selectivity), and eleven of the paper's findings on these data had no claim. This
# file is written again from the full text. Ids are kept where the finding is the same:
# pt-types-transcriptomic, pt-types-shared-targets, pt-upper-thalamus-projection,
# pt-lower-medulla-projection, pt-preparatory-activity, pt-upper-early-preparatory,
# pt-upper-persistent, pt-lower-late-and-motor and pt-types-differ-in-timing. All their criteria
# are new; the old shuffle null, McNemar and Fisher tests are gone, as the paper uses none of them.
# pt-lower-late-and-motor now tests selectivity along CDlate and CDgo (Fig. 6b, c; Extended Data
# Fig. 7b); pt-types-differ-in-timing is now the summary of the coding direction claims it
# depends on. The other claims are new.
#
# Text read: the version of record (Nature 563, 79-84, 2018), as the PDF supplied by a person and
# its text extraction (paper/10.1038-s41586-018-0642-9.txt): main text, Methods, Extended Data
# Figs 1 to 10 legends and the Reporting Summary. The Supplementary Information (Supplementary
# Tables 1 to 4: reconstructed neurons, mice, viruses and coordinates) is not in the text. No
# claim on these data rests on it; the reconstruction counts of pt-types-account-for-all-pt are
# quoted from the main text, which cites Supplementary Table 1.
#
# Code read: the paper links "https://github.com/SvobodaJanelia" (an organisation, no repository
# named) and deposits its electrophysiology at Figshare doi:10.25378/janelia.7007846 version 1,
# file Ephys.zip (Figshare file id 13292708), whose folder Code/ holds the MATLAB analysis code
# (defineDataset.m, loadAndProcessData.m, Projections.m for Fig. 5a, b, Fig. 6a-c, Extended Data
# Figs 7a, b and 10a, b; CDCorrelation.m for Extended Data Figs 7c, e and 10c; decodingAccuracy.m
# for Extended Data Fig. 9; simplePlots.m for Fig. 4e, f, 5c, 6d and Extended Data Figs 5, 10d;
# VarianceExplained.m for Extended Data Fig. 6; MySmooth.m, doROC.m). Only the .m files were
# read, not the data files. Below, "the code" is this folder.
#
# The data the paper used for the claims on this dandiset (Methods, Electrophysiology). Mice
# performed a tactile delayed-response task: sample epoch 1.0 s (pole in reach and still), delay
# 1.3 s, auditory go cue (3.4 kHz, 0.1 s), then directional licking, lick right for the caudal
# (posterior) pole and lick left for the rostral one. Times below are relative to the go cue;
# the code's epochs are baseline -3.1 to -2.7 s, sample -2.5 to -2.1 s (the first 400 ms of the
# sample epoch), delay -1.3 to 0 s, late delay -0.4 to 0 s and response 0 to 0.4 s; pole
# movement starts at -2.7 s and the full sample epoch is -2.5 to -1.5 s. Units were recorded in
# ALM with two-shank 64-channel silicon probes and identified by antidromic photostimulation and
# a collision test: PTupper (thalamus-projecting) neurons tagged from the thalamus, 61 cells in 8
# mice, 37 sessions, left hemisphere; PTlower (medulla-projecting) neurons tagged from the
# medulla, 69 cells in 4 mice, 23 sessions, both hemispheres. 143 tagged units were sorted, 130
# kept. The code calls the PTlower cohort "MP" (mice WR29, WR30, WR31, WR43, with right
# hemisphere recordings of WR29 and WR30 under separate animal numbers 29.5 and 30.5) and the
# PTupper cohort "TP" (WR33, WR34, WR36, WR38, WR39, WR40, WR41, WR42). Also 495 unidentified
# single units from 15 sessions of the PTupper cohort and 511 from 14 sessions of the PTlower
# cohort. Measured variables: spike times, unit depth (manipulator reading), trial type (lick
# left or right), outcome, early licks, photostimulation, lick times; videography at 400 Hz from 3
# mice, 14 sessions, for reaction times. The dandiset's description says it holds the
# extracellular recordings of the two PT populations in ALM; the anatomy and sequencing data are
# elsewhere (see the claims with data elsewhere).
#
# Methods shared by the electrophysiology claims, with their source.
# - Trials (code, defineDataset.m): correct trials of each type without early licks and without
#   photostimulation ("hit&L&~lickearly&~stim" and the same for R). Methods, Mouse behaviour:
#   trials with premature licks were excluded from all analyses.
# - Trial range per unit: the code keeps, for the last-lick-aligned rates, trials from 10 after
#   the unit's first trial with a spike to 10 before the earlier of its last trial with a spike
#   and the session's last correct trial (loadAndProcessData.m, ObjToLickPSTH). The go-cue-aligned
#   rates come precomputed in the data files, so their range is open: readings (a) the same range,
#   (b) all trials of the session.
# - Unit inclusion. Methods: units from sessions where performance was not greater than 65% for
#   both trial types, or with less than 50 correct trials of each type, were excluded (13 of 143
#   rejected, 130 kept). The code (loadAndProcessData.m) counts per unit over the trials in its
#   range: more than 50 correct trials of each type (strictly more; the Methods keep 50), more
#   than 3.2 spikes per trial (spikes over the range of trials with spikes; the Methods do not
#   name this rule, the code settles it), more than 65% correct for each type, and unit quality
#   Excellent, Good or single. Readings: (a) the code's per-unit rule, (b) the Methods' session
#   rule with at least 50 trials. The selection is checked by pt-tagged-units (61 and 69).
# - Rates: 5 ms bins, causal 50 ms boxcar (Methods; the code's MySmooth with 19 gives 10 bins,
#   the current and the nine before).
# - Coding direction (Methods, equations 1 and 2; code, Projections.m DirectionVector): per
#   neuron, mean rate on lick right minus lick left trials in a 400 ms window, over the root of
#   the summed across-trial variances; NaN set to 0; the vector over the population normalised
#   by its L1 norm. Windows CDearly -2.5 to -2.1 s, CDlate -0.4 to 0 s, CDgo 0 to 0.4 s (the code
#   takes time >= start and < end); CDgo orthogonalised to CDlate by Gram-Schmidt. Separate CDs
#   per population. The code also sets to 0 the weight of a neuron whose rank-sum p between the
#   two trial types in the window is 1 (DirectionVector, cv.*(pval<1)).
# - Epoch means (code, loadAndProcessData.m, getData and trialAverage): the per-trial epoch means
#   used for the Mann-Whitney counts, the decoding and the baseline take time > start and <= end,
#   unlike the CD windows; the difference is one 5 ms bin at each edge.
# - Projection and selectivity (Methods, equations 3 to 5; code, projectOntoVector): the
#   trial-averaged rates of each trial type times the CD; selectivity is the right projection
#   minus the left. For go-cue-aligned rates the code subtracts the selectivity's mean in the
#   baseline epoch (plotProjectionSelectivity); the Methods are silent, the code settles it.
# - Hierarchical bootstrap (Methods): 1,000 iterations; draw M mice with replacement from the
#   cohort (M the cohort size), then n neurons with replacement (n the population size), and for
#   each neuron 50 correct trials of each type with replacement. Selectivity is significant where
#   the 5th percentile of the bootstrap is above zero (5-95% interval, one-sided P < 0.05). The
#   code settles how: neurons are drawn from the pooled neurons of the drawn mice (a mouse drawn
#   twice is pooled once), each drawn neuron's weight in the CD is multiplied by the number of
#   times it was drawn, the resampled trials enter the CD only and the projection uses the
#   trial-averaged rates of all trials. Open, with readings: what a mouse is, (a) the 4 and 8
#   mice of the Methods, (b) the code's animal numbers (6 for PTlower, with 29.5 and 30.5); and
#   whether resampled trials also enter the projected rates, (a) no, as the code, (b) yes.
#   Projections.m runs 100 iterations and draws a band of mean +/- 1.545 s.d.; that is a variant.
# - Readings. For a reported number that can be read in more than one way, the claim holds if
#   it matches under any reading. For an open method detail, the notebook runs every reading;
#   the outcome is the one they all give, and the claim is methods_underspecified when they give
#   different outcomes.
