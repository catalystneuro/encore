- id: fig3supp-saline-iti-slower
  statement: In saline sessions, mice move more slowly in the ITI than in odor trials and in
    omission trials.
  source: Results, DOI impacts speed and timing, paragraph 4
  quote: In comparison, in saline sessions the ITI speed was slower compared to odor (p = 0.002)
    and odor omission trials (p = 0.017)
  statistics:
  - about: saline ITI against saline odor
    test: not named
    p: 0.002
  - about: saline ITI against saline omission
    test: not named
    p: 0.017
  criterion: Per-mouse saline session mean speeds over ITI, odor-trial and omission-trial frames
    (as fig3c); two-sided paired signed-rank tests, uncorrected, as in fig3_cleaned.Rmd and the
    Methods; the rank-sum test is shown as a variant. Reproduced when the ITI is slower than both
    at p < 0.05; partially reproduced when it is slower than one.
- id: fig3supp-saline-odor-omission-no-difference
  statement: In saline sessions, speed does not differ between odor and omission trials.
  source: Results, DOI impacts speed and timing, paragraph 4
  quote: Speed within the odor and odor omission trials were not different in the saline condition
    (Wilcoxon rank sum, p = 0.54)
  statistics:
  - test: Wilcoxon rank sum
    p: 0.54
  criterion: A claim of absence. Per-mouse saline session mean speeds over odor-trial and
    omission-trial frames (as fig3c); two-sided paired signed-rank test, the Methods' and code's;
    the rank-sum test is shown as a variant. Reproduced when p >= 0.05, not reproduced when p <
    0.05; the median difference is reported.
- id: fig4abc-sniff-frequency-higher
  statement: Pooling all sessions with a usable sniff signal, sniff frequency is higher in DOI
    sessions than in saline sessions.
  source: Results, DOI increases sniff frequency, paragraph 1; Figure 4A to 4C
  quote: When all sessions with sniff measurement were combined, sniff frequency was higher in DOI
    sessions ( Figure 4A – C ; Fisher-Pitman Permutation test, Z = 24.9, p < 0.001)
  statistics:
  - test: Fisher-Pitman Permutation test
    statistic: Z = 24.9
    p: 0.001
    p_relation: "<"
    n: 14 DOI and 13 saline sessions
  expected:
  - quantity: DOI sessions with usable sniff signal
    value: 14
    tolerance: 0
  - quantity: saline sessions with usable sniff signal
    value: 13
    tolerance: 0
  criterion: Sniff frequency is 1000 over the interval in ms between consecutive inhalation times
    (Methods, Figure 4; fig4_cleaned.Rmd), sniffs with a missing exhalation dropped. Further
    exclusions from the Methods, applied when the dataset gives raw inhalation times; sniff
    durations below the 5th or above the 95th percentile, computed where the Methods do not say
    (the MATLAB code that applied it is not in the repository), so run under readings (a) per
    session and (b) over all sessions of a condition, and durations outside 10 to 1000, read as ms (the Methods print "s",
    which cannot hold for a sniff). Where the dataset holds only the thermistor signal, the
    Methods give a 25 ms moving-window smoothing and peak and trough detection, and the detection
    settings are open; the inhalation times are then a deviation. Sessions are those with a
    usable signal; the code drops DOI sessions 2195 17 and 2198 17 and saline sessions 2198 19 and
    2213 18 as faulty, and the counts are compared with 14 and 13. Every sniff is a sample; a
    two-sample Fisher-Pitman permutation test (coin oneway_test, 10000 resamples) of DOI against
    saline. Reproduced when the DOI mean frequency is higher with p < 0.05.
- id: fig4supp-ks-every-mouse
  statement: Every mouse with matched DOI and saline sniff sessions has a sniff-frequency
    distribution shifted higher in the DOI condition.
  source: Results, DOI increases sniff frequency, paragraph 1; Figure 4 supplemental
  quote: All mice with a matched DOI and saline session had a higher-shifted distribution sniff
    rates in the DOI condition ( Figure 4 supplemental ; Kolmogorov-Smirnov test, p < 0.001 for 13
    of 13 mice)
  statistics:
  - test: Kolmogorov-Smirnov test
    p: 0.001
    p_relation: "<"
    n: 13 mice
  expected:
  - quantity: mice with matched sessions and a significant DOI shift
    value: 13
    tolerance: 0
  depends_on:
  - fig4abc-sniff-frequency-higher
  criterion: The sniff frequencies of fig4abc; for each mouse with usable DOI and saline sessions,
    a one-sided two-sample Kolmogorov-Smirnov test that DOI frequencies are stochastically larger
    (R ks.test(doi, saline, alternative = "less"), as in fig4_cleaned.Rmd). Reproduced when every
    matched mouse has p < 0.001 and their number is within the tolerance; partially reproduced
    when at least two thirds of them do.
- id: fig4d-sniff-frequency-by-period
  statement: Mice sniff faster in the DOI condition in odor trials, in omission trials and during
    the ITI.
  source: Results, DOI increases sniff frequency, paragraph 1; Figure 4D
  quote: 'mice sniffed faster in the DOI condition for each trial type and during the ITI ( Figure
    4D ; Fisher-Pitman Permutation test for all trial types; Odor trials: Z = 3.38, p < 0.001;
    Omission trials: Z = 2.71, p= 0.007; ITI: Z = 18.4, p < 0.001)'
  statistics:
  - about: odor trials
    test: Fisher-Pitman Permutation test
    statistic: Z = 3.38
    p: 0.001
    p_relation: "<"
  - about: omission trials
    test: Fisher-Pitman Permutation test
    statistic: Z = 2.71
    p: 0.007
  - about: ITI
    test: Fisher-Pitman Permutation test
    statistic: Z = 18.4
    p: 0.001
    p_relation: "<"
  depends_on:
  - fig4abc-sniff-frequency-higher
  criterion: The sniffs of fig4abc, each placed by its inhalation time in an odor trial, an
    omission trial (between a trial's start and end) or the ITI (otherwise), as in
    fig4_cleaned.Rmd; a Fisher-Pitman permutation test (10000 resamples) of DOI against saline in
    each period. Reproduced when DOI is higher with p < 0.05 in all three; partially reproduced in
    two.
- id: fig4e-median-sniff-no-difference
  statement: Per-mouse median sniff frequency does not differ between DOI and saline.
  source: Results, DOI increases sniff frequency, paragraph 1; Figure 4E
  quote: We did not observe a difference in median sniff frequencies between conditions ( Figure 4E
    ; Wilcoxon signed rank test; p = 0.11)
  statistics:
  - test: Wilcoxon signed rank test
    p: 0.11
  depends_on:
  - fig4abc-sniff-frequency-higher
  criterion: A claim of absence. Per mouse and condition the median of the sniff frequencies of
    fig4abc; two-sided paired Wilcoxon signed-rank test over mice with both, as in
    fig4_cleaned.Rmd. Reproduced when p >= 0.05, not reproduced when p < 0.05; the median
    difference is reported.
- id: fig5ab-occupancy-similar
  statement: Mice occupy the arena similarly in the DOI and saline conditions; DOI does not make
    them spend more time in task-irrelevant areas such as the corners or spread more evenly.
  source: Results, Mice occupy allocentric space similarly but head twitch preferentially in
    proximity to odor ports, paragraph 1; Figure 5A and 5B
  quote: Contrary to this prediction, mice showed similar occupancy across DOI and saline conditions
    ( Figure 5A, B )
  criterion: The paper reports no test. Occupancy is the fraction of a session's tracked frames in
    each 1 cm bin (48 pixels in fig5_cleaned.Rmd), from the nose keypoint, frames above 160 cm/s
    dropped, x flipped for the first cohort; the maps are the mean over the 22 mice (Figure 5A
    legend, Methods Figure 5, code). The measures come from the prediction the paper tested ("more
    time in areas irrelevant to the task such as corners of the arena, with a more even
    distribution"); per mouse and condition (a) the Shannon entropy of the occupancy map and (b)
    the fraction of frames in the four arena corners, with the corner size open, read as squares
    of 5 cm and of 10 cm side (choices, as the paper fixes none). Each is compared DOI against
    saline with a two-sided paired Wilcoxon signed-rank test, the Methods' paired test.
    Reproduced when no measure differs at p < 0.05; not reproduced when every one does, in either
    direction, as the claim is one of similar occupancy; otherwise blocked as methods_underspecified with all results shown. The Pearson
    correlation between the two grand-mean maps is reported as a description.
- id: fig5supp-htr-within-trial-x-not-y
  statement: During trials, HTR rate (normalized to occupancy) varies with the X coordinate of the
    arena but not with the Y coordinate.
  source: Results, Mice occupy allocentric space similarly but head twitch preferentially in
    proximity to odor ports, paragraph 2; Figure 5 supplemental A
  quote: During a trial, HTR rate occurred throughout the arena without spatial predictability on
    the Y-coordinate ( Figure 5 supplemental ; Permutation test, p = 0.92), but with preference for
    the X-coordinate ( Figure 5 supplemental ; Permutation test, p = 0.002)
  statistics:
  - about: Y coordinate
    test: Permutation test
    p: 0.92
  - about: X coordinate
    test: Permutation test
    p: 0.002
  criterion: DOI sessions with HTR times. As in the Methods (Figure 5) and fig5_cleaned.Rmd; nose
    position at each frame (x flipped for the first cohort, frames above 160 cm/s dropped); each
    HTR assigned to the frame nearest its time; the arena in bins of 100 pixels (about 2.5 cm),
    the last bin column and row (x bin 1200, y bin 700) dropped; per mouse and bin, HTRs within
    trials over within-trial occupancy, in HTR per min, bins the mouse visited in the session
    filled with zero where it had no within-trial time. Statistic the Pearson correlation of the
    per-mouse, per-bin rates with bin x and with bin y; null from 10000 permutations of the bin
    coordinates; two-sided p as the fraction of permuted absolute correlations at or above the
    observed one (seed 123 in the code, a choice that cannot change the outcome). Reproduced when
    p < 0.05 for x and p >= 0.05 for y; partially reproduced when only one holds. The sign of the
    x correlation is reported, positive meaning toward the odor and reward ports.
- id: fig5e-htr-combined-x
  statement: With trial and ITI periods combined, mice head-twitch more often closer to the odor
    end of the arena, as the X coordinate increases.
  source: Results, Mice occupy allocentric space similarly but head twitch preferentially in
    proximity to odor ports, paragraph 2; Figure 5E
  quote: and when conditions were combined ( Figure 5E ; Permutation test, p < 0.001 for
    X-coordinates)
  statistics:
  - test: Permutation test
    p: 0.001
    p_relation: "<"
  expected:
  - quantity: mice in the HTR rate map
    value: 22
    tolerance: 0
  depends_on:
  - fig5supp-htr-within-trial-x-not-y
  criterion: As fig5supp-htr-within-trial-x-not-y with all frames of the DOI session (trial and
    ITI combined), rows for the bins each mouse occupied, as fig5_cleaned.Rmd does. Reproduced
    when the x correlation is positive (rate rising toward the odor and reward ports) with p <
    0.001; partially reproduced when it is positive with p < 0.05.
- id: fig5supp-htr-iti-x
  statement: During the ITI, mice head-twitch more often toward the end of the arena past the
    decision line (as X increases), but not specifically next to the reward ports on the Y
    coordinate.
  source: Results, Mice occupy allocentric space similarly but head twitch preferentially in
    proximity to odor ports, paragraph 2; Figure 5 supplemental B
  quote: Similarly, during the ITI, we found that mice HTR more frequently closer to the end of the
    arena after crossing the decision line (as X-coordinate increases), but not immediately next to
    the reward ports (on the Y-coordinate)
  criterion: The paper gives no test for the ITI alone and the code runs none; the test of
    fig5supp-htr-within-trial-x-not-y is applied to ITI frames and ITI HTRs (per-mouse rates over
    ITI occupancy, the code's htr_normalized_permouse_iti, edge bins dropped), the reading the
    paper's "Similarly" implies. Reproduced when the x correlation is positive with p < 0.05 and
    the y test has p >= 0.05; partially reproduced when only the x part holds.
- id: fig5f-htr-rate-trial-vs-iti
  statement: HTR rate does not differ between time within trials and time in the ITI.
  source: Results, Mice occupy allocentric space similarly but head twitch preferentially in
    proximity to odor ports, paragraph 2; Figure 5F
  quote: We normalized HTR rate based on within trial and ITI duration and found no difference in
    HTR rate based on whether the mouse was in a trial or ITI ( Figure 5F ; Wilcoxon signed rank,
    p = 1)
  statistics:
  - test: Wilcoxon signed rank
    p: 1
  criterion: A claim of absence. As in fig5_cleaned.Rmd; per DOI session, HTRs whose time lies
    within a trial divided by the summed trial durations, and the other HTRs divided by 2400 s
    minus the summed trial durations, in HTR per min; two-sided paired Wilcoxon signed-rank test.
    Reproduced when p >= 0.05, not reproduced when p < 0.05; the median difference is reported.
- id: fig5supp-htr-no-sex-difference
  statement: HTR rate over the 40 min DOI session does not differ between male and female mice.
  source: Results, Mice occupy allocentric space similarly but head twitch preferentially in
    proximity to odor ports, paragraph 2; Figure 5 supplemental C
  quote: Additionally, we did not see a sex difference in HTR rate over the 40 m session ( Figure 5
    supplemental ; Wilcoxon rank sum, p = 0.31)
  statistics:
  - test: Wilcoxon rank sum
    p: 0.31
  criterion: A claim of absence. Per DOI session the number of HTRs divided by 40 min; a two-sided
    Wilcoxon rank-sum test (normal approximation, exact = FALSE in fig5_cleaned.Rmd), female
    against male. Reproduced when p >= 0.05, not reproduced when p < 0.05; the group medians are
    reported.
checks:
- date: 2026-10-21
  kind: agent
  model: claude-opus-5-5
  ready: true
  changes:
  - Read the code at the cited commit (Smear-Lab/Olfactory-search-on-psychedelics aa80af0a) and confirmed the code details the criteria cite (40-trial filter, odor-only trial count for Figure 1D, 5 min bin labels, paired signed-rank tests for every speed comparison, one-sided KS test, the four faulty sniff sessions, the permutation test with seed 123 and edge bins dropped, 48 px occupancy bins, 2400 s session time).
  - fig2a-correct-port-duration-doi-odor and fig2c-incorrect-port-duration, statistics test set to the name the Results give (Wilcoxon rank sum test); the Bonferroni adjustment, from the Methods, stays under corrected.
  - fig4abc-sniff-frequency-higher, the criterion read the 5th to 95th percentile exclusion as per session from the code, but the MATLAB code that applied it is not in the repository; it is now open, with readings per session and over all sessions of a condition.
  - fig5ab-occupancy-similar, not reproduced required every measure to differ with DOI higher; a significant difference in either direction contradicts similar occupancy, so the direction condition was dropped.
  - iti-false-report-no-difference, the Results describe the event as a reward-port entry while the Methods define crossing the decision line; the Results' reading is added as a variant, the Methods' deciding.
  - Open, fig1c-accuracy-time-bins, the statement's wording covers the 25 to 30 min bin, but the text gives no p-value for it (the code's bin labels make "10 to 25 min" the bins 10-15, 15-20 and 20-25); it is reported and not judged.
  - Open, the speed claims of Figure 3 and its supplement, the Results name the rank-sum test while the Methods and code use the paired signed-rank test; the criteria follow the Methods and code and show the rank-sum test as a variant.
  - Open, fig5ab-occupancy-similar, the paper reports no test; its entropy and corner measures and corner sizes are readings of the paper's stated prediction, not the paper's method.
