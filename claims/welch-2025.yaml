# Claims for Welch, Gonzales-Hess, Tarvin, Connor & Smear (2025), "The impact of a psychedelic
# drug on olfactory search behavior by mice", bioRxiv doi:10.1101/2025.07.09.663970, on dandiset
# 001863.
#
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21, under
# docs/protocol.md version pilot-10 (Reader, steps 1 to 4). Nobody had analysed the dataset's data
# when these criteria were written; the reader saw only the dandiset's title and description.
#
# Text read: the bioRxiv preprint, version 1, full text flattened from its JATS XML
# (paper/10.1101-2025.07.09.663970.txt): Results, figure legends, Discussion and Materials and
# methods. The preprint has no separate supplement file; the legends of its supplemental figures
# (Figure 2A, 2B, 2C, 2D, 3, 4 and 5 supplemental) are in the text and were read. No PDF was
# supplied, and none was needed.
#
# Code read: github.com/Smear-Lab/Olfactory-search-on-psychedelics at commit
# aa80af0a153c6bf099e5668d27c9d88e2bfc033f (2026-08-06). The paper itself links only the rig
# documentation (nghess.github.io/fmon-docs); this repository is the authors' code, named in the
# dandiset's description and naming the paper in its README. It holds analysis/fig1_cleaned.Rmd to
# fig5_cleaned.Rmd (the R code of each figure's statistics), a MATLAB plotting script for the
# occupancy maps, the Bpod/Bonsai task software (fmon-bpod) and the NWB conversion script. The
# reward-port durations (files drinking_data_iti_2.txt and drinking_data_incorrect_trials_iti_2.txt),
# the sniff inhalation times (MATLAB "Task sniff params" files) and the DLC tracks are read
# pre-computed by the Rmd files; the code that made them is not in the repository.
#
# The data the paper used. 22 C57Bl6/J mice (12 female, 10 male), each with one DOI session (3
# mg/kg IP, 5 min before the task) and one saline session, crossed over at least a week apart, in
# a two-alternative olfactory search task (odor, 2-phenylethanol, from the left or right end of the
# arena; 10% odor omission trials; variable ITI of 1 to 15 s; fixed 40 min sessions). Measured
# variables: per trial, trial type (odor or omission), odor side, success, start and end time; for
# the 17 mice after the first cohort of 5, initiation-port pokes in the ITI and reward-port entries
# and exits; video tracked by DeepLabCut (nose and other keypoints, 80 frames/s in the code);
# nasal thermistor sniff signals (usable in 14 DOI and 13 saline sessions); manually scored
# head-twitch response (HTR) onset times in the DOI sessions.
#
# The code's mouse and session list (mouse: DOI session, saline session), used in every figure:
# 2174 57 56; 2181 42 41; 2182 32 31; 2183 34 33; 2185 41 40; 2191 25 21; 2195 17 20; 2196 18 16;
# 2197 17 19; 2198 17 19; 2200 14 19; 2201 16 21; 2202 19 14; 2203 13 18; 2204 17 22; 2205 12 16;
# 2208 18 14; 2209 14 18; 2210 17 13; 2211 13 17; 2212 16 13; 2213 14 18. Females are 2174, 2181,
# 2191, 2200 to 2204 and 2210 to 2213. The first cohort (2174, 2181, 2182, 2183, 2185) lacks
# reward-port and repoke records (Methods, Figure 1 and Figure 2) and, in the code, has its x
# coordinate flipped (1200 minus x) to match the later camera setup. In the trial tables,
# odor_setting 0 is an odor trial and 3 an omission trial.
#
# Method details fixed here from the code where the Methods are silent (each criterion cites
# them): sessions with fewer than 40 trials are dropped (fig1, fig3); ITI duration is the next
# trial's start minus this trial's end; accuracy is the mean of success over a session's odor
# trials; speed is the frame-to-frame nose displacement times 80 frames/s times 0.0237 cm per
# pixel, after DLC points with likelihood below 0.95 or a jump above 8 pixels are interpolated,
# frames above 160 cm/s dropped, and a frame's time taken as its index over 80 s; a frame or a
# sniff is within a trial when its time lies between a trial's start and end, and in the ITI
# otherwise.
#
# The paper is not consistent with itself on three points, recorded in the criteria: the Results
# name the Wilcoxon rank-sum test for the speed comparisons of Figure 3C, 3D and its supplement,
# while the Methods and the code use the paired signed-rank test; the Methods give the sniff
# duration limits as "10 s" and "1000 s"; the Methods say HTRs were marked manually, while the
# code reads HTR times from a folder it calls automated detection and from a manually scored one.
schema_version: 2
dataset:
  archive: dandi
  id: "001863"
paper: doi:10.1101/2025.07.09.663970
claims:
- id: fig1b-accuracy-lower-doi
  statement: Mice are less accurate in the olfactory search task in the DOI session than in the
    saline session, going more often to the incorrect side.
  source: Results, DOI alters olfactory search behavior, paragraph 2; Figure 1B
  quote: Indeed, mice more often navigated to the incorrect side of the arena in the DOI condition
    ( Figure 1B ; Wilcoxon signed rank test, p = 0.024, n = 22)
  statistics:
  - test: Wilcoxon signed rank test
    p: 0.024
    n: 22 mice
  expected:
  - quantity: mice with paired DOI and saline sessions
    value: 22
    tolerance: 0
  criterion: As the Methods (Figure 1) and fig1_cleaned.Rmd define it, accuracy is the percent of
    a session's odor trials (odor_setting 0) that were correct, sessions with fewer than 40 trials
    dropped. A two-sided paired Wilcoxon signed-rank test of DOI against saline accuracy over the
    mice. Reproduced when the median DOI minus saline difference is negative and p < 0.05;
    partially reproduced when it is negative with 0.05 <= p < 0.1. Omission-trial accuracy, which
    the code also tests, is reported as a variant.
- id: fig1c-accuracy-time-bins
  statement: Over the session, odor-trial accuracy in 5 min bins is higher in the saline condition
    than the DOI condition after the first 10 min, except in the 30 to 35 min bin, so the effect is
    spread across the session.
  source: Results, DOI alters olfactory search behavior, paragraph 2; Figure 1C
  quote: In odor trials, accuracy was higher in the saline condition after the first 10 min, except
    for the 30 – 35 min bin ( Figure 1C ; Wilcoxon rank-sum test, p < 0.01 for time points within
    10 – 25 min, p = 0.039 for 35 – 40 min)
  statistics:
  - about: bins 10 to 15, 15 to 20 and 20 to 25 min
    test: Wilcoxon rank-sum test
    p: 0.01
    p_relation: "<"
  - about: bin 35 to 40 min
    test: Wilcoxon rank-sum test
    p: 0.039
  criterion: As in the Methods (Figure 1) and fig1_cleaned.Rmd. Odor trials only; for each trial
    the rolling accuracy, the percent correct of the session's odor trials up to and including
    that one; trials binned by start time into 5 min bins from 0 to 40 min; per mouse and bin, the
    mean rolling accuracy; per bin, a two-sided unpaired Wilcoxon rank-sum test of DOI against
    saline mouse values, uncorrected (the Methods give the rank-sum test because some mice have no
    trials in some bins). Reproduced when saline is higher at p < 0.05 in the bins 10 to 15, 15 to
    20, 20 to 25 and 35 to 40 min, with p < 0.01 in the first three, and the 30 to 35 min bin is
    not significant; partially reproduced when saline is higher at p < 0.05 in at least two of
    those four bins. The 0 to 10 min and 25 to 30 min bins, which the text does not state
    separately, are reported. The per-bin fraction correct (not rolling) is shown as a variant.
- id: fig1d-fewer-trials
  statement: Mice complete fewer trials in the 40 min DOI session than in the saline session.
  source: Results, DOI alters olfactory search behavior, paragraph 3; Figure 1D
  quote: Mice completed fewer trials in the DOI condition ( Figure 1D ; Wilcoxon signed rank test, p
    = 0.011, n = 22)
  statistics:
  - test: Wilcoxon signed rank test
    p: 0.011
    n: 22 mice
  criterion: Trials completed is the number of trials in the session (the Methods, Figure 1, "the
    sum of all trials in a session"). fig1_cleaned.Rmd counts only the odor trials (odor_setting
    0) for this test, while the Methods' wording counts all trials; both are run, readings (a)
    odor trials, the code, and (b) all trials, the Methods. A two-sided paired Wilcoxon
    signed-rank test over the 22 mice. Reproduced when, under a reading, DOI is lower with p <
    0.05.
- id: fig1d-fewer-trials-females-only
  statement: The drop in trials completed under DOI is driven by females; female mice perform fewer
    trials on DOI than saline, while male mice show no significant difference.
  source: Results, DOI alters olfactory search behavior, paragraph 3; Figure 1D
  quote: This effect was driven by female mice; female mice performed fewer trials on DOI compared
    to saline ( Figure 1D ; Wilcoxon signed rank test, p = 0.011, n = 12), whereas male mice did not
    show a significant difference ( Figure 1D ; Wilcoxon signed rank test, p = 0.39, n = 10)
  statistics:
  - about: females, DOI against saline
    test: Wilcoxon signed rank test
    p: 0.011
    n: 12 female mice
  - about: males, DOI against saline
    test: Wilcoxon signed rank test
    p: 0.39
    n: 10 male mice
  depends_on:
  - fig1d-fewer-trials
  criterion: The trial counts of fig1d-fewer-trials under both of its readings, split by sex
    (females as listed in the opening comment, from the code). Two-sided paired Wilcoxon
    signed-rank tests within each sex, as in fig1_cleaned.Rmd. Reproduced when, under a reading,
    females are lower on DOI at p < 0.05 and males do not differ at p < 0.05; partially
    reproduced when only one of the two holds.
- id: fig1e-repoke-no-difference
  statement: Mice poke into the initiation port during the ITI at the same rate in the DOI and
    saline conditions, showing an equivalent motivation to do the task.
  source: Results, DOI alters olfactory search behavior, paragraph 3; Figure 1E
  quote: We found that mice poked into the initiation port, but there was not a significant
    difference between conditions ( Figure 1E ; Wilcoxon signed rank test, p = 0.27, n = 17)
  statistics:
  - test: Wilcoxon signed rank test
    p: 0.27
    n: 17 mice
  criterion: A claim of absence. As in the Figure 1E legend and fig1_cleaned.Rmd, the repoke rate
    is the session's number of initiation-port pokes during ITIs divided by the number of ITIs
    (trials minus one), for the 17 mice after the first cohort. Two-sided paired Wilcoxon
    signed-rank test, DOI against saline. Reproduced when p >= 0.05, not reproduced when p <
    0.05; the median difference is reported either way.
- id: iti-false-report-no-difference
  statement: Mice rarely enter a reward port during the ITI after a trial-initiation attempt, and
    DOI does not make them do so more than saline.
  source: Results, DOI alters olfactory search behavior, paragraph 4
  quote: Mice rarely entered the reward port during the ITI after trial initiation attempt
    (Wilcoxon rank sum test, p = 1)
  statistics:
  - test: Wilcoxon rank sum test
    p: 1
    n: 17 mice
  criterion: A claim of absence. The Methods (Figure 1) define a false odor report as an
    initiation-port beam break followed by crossing the decision line during the ITI, for the 17
    mice after the first cohort; the code in the repository does not compute it (the trial table
    of the later cohort has a false_alarm column, which is used if the dataset holds it). The
    per-mouse measure is not fixed; readings (a) the count of false reports per session and (b)
    that count divided by the number of ITIs. The paper's test, a two-sided unpaired Wilcoxon
    rank-sum test of DOI against saline sessions. Reproduced when p >= 0.05 under the readings,
    not reproduced when p < 0.05; the counts per session are reported to show whether they are
    rare. The Results describe the event as entering the reward port during the ITI after an
    initiation attempt; that count is shown as a variant, the Methods' definition deciding. "Rarely" has no threshold in the paper and is not judged.
- id: fig2a-correct-port-duration-doi-odor
  statement: After correct trials, mice stay longer in the reward port on DOI odor trials than on
    saline odor trials and saline omission trials.
  source: Results, DOI impacts speed and timing, paragraph 1; Figure 2A
  quote: Reward port duration was increased in the DOI odor trial condition compared to both saline
    odor and saline odor omission trials ( Figure 2A ; Wilcoxon rank sum test, p < 0.001, n = 17)
  statistics:
  - test: Wilcoxon rank sum test
    p: 0.001
    p_relation: "<"
    corrected: Bonferroni
    n: 17 mice
  criterion: Reward-port duration after a correct trial is the time from entering the reward port
    to exiting it, re-entries not added (Methods, Figure 2), for the 17 mice after the first
    cohort. Every event is a sample, pooled over mice, in four groups (DOI odor, DOI omission,
    saline odor, saline omission). As the Methods and fig2_cleaned.Rmd do, a Kruskal-Wallis test
    over the four groups, then pairwise two-sided Wilcoxon rank-sum tests with Bonferroni
    adjustment over the six pairs (R pairwise.wilcox.test). Reproduced when DOI odor durations are
    higher than both saline groups at adjusted p < 0.001; partially reproduced when both hold at
    adjusted p < 0.05, or only one at p < 0.001. Which port entry counts is not fixed by the paper
    (the files the code reads are pre-computed); readings (a) the first reward-port entry after the
    trial's response, (b) the first entry within the 5 s window the Methods give for collecting a
    reward. The per-mouse medians of fig2b are reported alongside.
- id: fig2a-supp-no-sex-effect
  statement: Reward-port duration after correct trials does not depend on sex in either condition.
  source: Results, DOI impacts speed and timing, paragraph 1; Figure 2A supplemental
  quote: We did not find a sex effect of condition ( Figure 2A supplemental , p = 1)
  statistics:
  - test: not named
    p: 1
  depends_on:
  - fig2a-correct-port-duration-doi-odor
  criterion: A claim of absence. The events of fig2a, grouped by condition and sex (DOI female,
    DOI male, saline female, saline male). The paper does not name the test. Readings (a) a
    Kruskal-Wallis test over the four groups, as fig2_cleaned.Rmd runs it; (b) pairwise two-sided
    Wilcoxon rank-sum tests with Bonferroni adjustment over the six pairs, as the Methods give for
    the duration groups and as the Results name for the matching test of Figure 2C, judged on
    female against male within each condition. Reproduced when no reading finds a sex difference
    at p < 0.05, not reproduced when every reading does; when they disagree, blocked as
    methods_underspecified with both results shown. The p-values are reported.
- id: fig2b-median-port-duration-correct
  statement: Per mouse, the median reward-port duration after correct trials is longer in the DOI
    session than in the saline session.
  source: Results, DOI impacts speed and timing, paragraph 1; Figure 2B
  quote: When comparing the median duration between conditions, mice in the DOI condition spent
    longer in the reward port compared to saline ( Figure 2B ; Wilcoxon signed rank test, p = 0.002)
  statistics:
  - test: Wilcoxon signed rank test
    p: 0.002
    n: 17 mice
  depends_on:
  - fig2a-correct-port-duration-doi-odor
  criterion: The correct-trial events of fig2a, odor and omission trials together; per mouse and
    condition the median duration; a two-sided paired Wilcoxon signed-rank test, DOI against
    saline, as in fig2_cleaned.Rmd. Reproduced when DOI is higher with p < 0.05.
- id: fig2b-supp-odor-trials-longer
  statement: The longer median reward-port duration under DOI is driven by odor trials.
  source: Results, DOI impacts speed and timing, paragraph 1; Figure 2B supplemental
  quote: This effect was driven by the odor trial ( Figure 2B supplemental ; Wilcoxon signed rank
    test, p = 0.001)
  statistics:
  - test: Wilcoxon signed rank test
    p: 0.001
  depends_on:
  - fig2a-correct-port-duration-doi-odor
  criterion: As fig2b, with odor trials only, as in fig2_cleaned.Rmd. Reproduced when DOI is
    higher with p < 0.05.
- id: fig2b-supp-omission-no-difference
  statement: After correct omission trials, the median reward-port duration does not differ between
    DOI and saline.
  source: Results, DOI impacts speed and timing, paragraph 1
  quote: as we did not see a difference between median duration after an omission trial (Wilcoxon
    signed rank test, p = 0.60)
  statistics:
  - test: Wilcoxon signed rank test
    p: 0.6
  depends_on:
  - fig2a-correct-port-duration-doi-odor
  criterion: A claim of absence. As fig2b, with omission trials only, mice without events in both
    conditions dropped, as in fig2_cleaned.Rmd; two-sided paired Wilcoxon signed-rank test.
    Reproduced when p >= 0.05, not reproduced when p < 0.05; the median difference is reported.
- id: fig2c-incorrect-port-duration
  statement: After incorrect (unrewarded) trials, mice stay longest in the reward port on DOI odor
    trials, longer than on DOI omission, saline odor and saline omission trials, and longer on
    saline odor than saline omission trials.
  source: Results, DOI impacts speed and timing, paragraph 2; Figure 2C
  quote: We found an increased duration in DOI odor trials compared to DOI odor omission trials (
    Figure 2C ; Wilcoxon rank sum test for all comparisons, p < 0.001), saline odor trials (p =
    0.030), and saline odor omission trials (p < 0.001). Additionally, there was an increased
    reward port duration for the saline odor trial compared to the saline odor omission trial (p <
    0.001)
  statistics:
  - about: DOI odor against DOI omission
    test: Wilcoxon rank sum test
    p: 0.001
    p_relation: "<"
    corrected: Bonferroni
  - about: DOI odor against saline odor
    test: Wilcoxon rank sum test
    p: 0.03
    corrected: Bonferroni
  - about: DOI odor against saline omission
    test: Wilcoxon rank sum test
    p: 0.001
    p_relation: "<"
    corrected: Bonferroni
  - about: saline odor against saline omission
    test: Wilcoxon rank sum test
    p: 0.001
    p_relation: "<"
    corrected: Bonferroni
  criterion: As fig2a (same duration definition, same port-entry readings, same Kruskal-Wallis and
    Bonferroni-adjusted pairwise rank-sum tests over the four groups, as in the Methods and
    fig2_cleaned.Rmd), with the events after incorrect trials. Reproduced when all four stated
    comparisons go in the stated direction at adjusted p < 0.05; partially reproduced when three
    of the four do.
- id: fig2c-supp-no-sex-difference
  statement: After incorrect trials, reward-port duration does not differ between the sexes within
    either condition.
  source: Results, DOI impacts speed and timing, paragraph 2; Figure 2C supplemental
  quote: Sex differences within each condition were not significant ( Figure 2C supplemental ,
    Wilcoxon rank sum, p = 1)
  statistics:
  - test: Wilcoxon rank sum
    p: 1
  depends_on:
  - fig2c-incorrect-port-duration
  criterion: A claim of absence, judged on the paper's named test. The incorrect-trial events
    grouped by condition and sex; pairwise two-sided Wilcoxon rank-sum tests with Bonferroni
    adjustment over the six pairs of the four groups (the Methods' post hoc test); female against
    male within DOI and within saline. Reproduced when neither is significant at adjusted p <
    0.05, not reproduced when either is. The Kruskal-Wallis test over the four groups, which
    fig2_cleaned.Rmd runs, is shown as a variant.
- id: fig2d-median-incorrect-no-difference
  statement: Per mouse, the median reward-port duration after incorrect trials does not differ
    between DOI and saline.
  source: Results, DOI impacts speed and timing, paragraph 2; Figure 2D
  quote: When comparing the median duration between conditions, there was no difference between DOI
    and saline ( Figure 2D ; Wilcoxon signed rank test, p = 0.21)
  statistics:
  - test: Wilcoxon signed rank test
    p: 0.21
  depends_on:
  - fig2c-incorrect-port-duration
  criterion: A claim of absence. Per mouse and condition the median duration over incorrect-trial
    events, odor and omission together; two-sided paired Wilcoxon signed-rank test, mice without
    both values dropped, as in fig2_cleaned.Rmd. Reproduced when p >= 0.05, not reproduced when p
    < 0.05; the median difference is reported.
- id: fig2d-supp-omission-longer
  statement: After incorrect omission trials, mice stay longer in the reward port in the DOI
    condition than in the saline condition.
  source: Results, DOI impacts speed and timing, paragraph 2; Figure 2D supplemental
  quote: However, after an odor omission trial, mice spent longer in the reward port in the DOI
    condition ( Figure 2D supplemental , Wilcoxon signed rank test, p = 0.049)
  statistics:
  - test: Wilcoxon signed rank test
    p: 0.049
  depends_on:
  - fig2c-incorrect-port-duration
  criterion: As fig2d, with incorrect omission trials only, mice without both values dropped, as
    in fig2_cleaned.Rmd. Reproduced when DOI is higher with p < 0.05; partially reproduced when it
    is higher with 0.05 <= p < 0.1.
- id: fig3a-odor-trial-duration-longer
  statement: Mice take longer to complete odor trials in the DOI condition than in the saline
    condition.
  source: Results, DOI impacts speed and timing, paragraph 3; Figure 3A
  quote: In odor trials, mice took longer to complete a trial in the DOI condition compared to the
    saline condition ( Figure 3A ; Wilcoxon signed rank test, p < 0.001, n = 22)
  statistics:
  - test: Wilcoxon signed rank test
    p: 0.001
    p_relation: "<"
    n: 22 mice
  criterion: Trial duration is trial end minus trial start; per mouse and condition the mean over
    odor trials (Methods, Figure 3; fig3_cleaned.Rmd); two-sided paired Wilcoxon signed-rank test.
    Reproduced when DOI is longer with p < 0.05.
- id: fig3a-omission-duration-no-difference
  statement: The duration of omission trials does not differ between DOI and saline.
  source: Results, DOI impacts speed and timing, paragraph 3
  quote: In contrast, there was no difference in trial duration in omission trials between DOI and
    saline (Wilcoxon signed rank test, p = 0.26, n = 22)
  statistics:
  - test: Wilcoxon signed rank test
    p: 0.26
    n: 22 mice
  criterion: A claim of absence. As fig3a with omission trials. Reproduced when p >= 0.05, not
    reproduced when p < 0.05; the median difference is reported.
- id: fig3b-iti-duration-no-difference
  statement: ITI duration does not differ between DOI and saline.
  source: Results, DOI impacts speed and timing, paragraph 3; Figure 3B
  quote: However, there was no difference in ITI duration between conditions ( Figure 3B ; Wilcoxon
    signed rank test, p = 0.19, n = 22)
  statistics:
  - test: Wilcoxon signed rank test
    p: 0.19
    n: 22 mice
  criterion: A claim of absence. ITI duration is the next trial's start minus this trial's end
    (Methods, Figure 3); per mouse and condition the mean over all trials of the session, as in
    fig3_cleaned.Rmd; two-sided paired Wilcoxon signed-rank test. Reproduced when p >= 0.05, not
    reproduced when p < 0.05; the median difference is reported.
- id: fig3c-speed-within-trial-lower
  statement: DOI lowers movement speed within trials, odor and omission trials pooled, compared with
    saline.
  source: Results, DOI impacts speed and timing, paragraph 4; Figure 3C
  quote: We found that DOI decreased movement speed both within trial ( Figure 3C ; Wilcoxon rank
    sum test, p = 0.011, pooled trial type)
  statistics:
  - test: Wilcoxon rank sum test
    p: 0.011
  criterion: Nose-keypoint speed as in the Methods (Figure 3) and fig3_cleaned.Rmd (see the opening
    comment), per mouse and condition the mean over the frames within any trial. The Results name
    the rank-sum test; the Methods ("For trial durations, ITI duration, and overall task speed,
    Wilcoxon signed rank tests were used") and the code use the two-sided paired signed-rank test,
    which decides here, the Methods coming first; the unpaired rank-sum test is shown as a
    variant. Reproduced when DOI is lower with p < 0.05.
- id: fig3d-speed-iti-lower
  statement: DOI lowers movement speed during the ITI compared with saline.
  source: Results, DOI impacts speed and timing, paragraph 4; Figure 3D
  quote: and during the ITI ( Figure 3D ; Wilcoxon rank sum test, p = 0.036) compared to saline
  statistics:
  - test: Wilcoxon rank sum test
    p: 0.036
  criterion: As fig3c, with the frames outside every trial. Reproduced when DOI is lower with p <
    0.05 under the paired signed-rank test; the rank-sum test is shown as a variant.
- id: fig3supp-odor-trial-speed-no-difference
  statement: Within odor trials alone, speed does not differ between DOI and saline sessions.
  source: Results, DOI impacts speed and timing, paragraph 4; Figure 3 supplemental
  quote: In odor trials specifically, the speed between DOI and saline sessions were not different (
    Figure 3 supplemental ; Wilcoxon rank sum test, p = 0.059)
  statistics:
  - test: Wilcoxon rank sum test
    p: 0.059
  criterion: A claim of absence. As fig3c with the frames of odor trials only. The Results name
    the rank-sum test; the Methods and fig3_cleaned.Rmd (which runs every pair of the six
    condition and period means as paired signed-rank tests, uncorrected) use the two-sided paired
    signed-rank test, which decides, the Methods coming first. Reproduced when p >= 0.05, not
    reproduced when p < 0.05. The rank-sum result and the median difference are reported.
- id: fig3supp-doi-iti-slower-than-odor
  statement: Within the DOI condition, mice move more slowly in the ITI than in odor trials.
  source: Results, DOI impacts speed and timing, paragraph 4; Figure 3 supplemental
  quote: Within the DOI condition, speed was decreased in the ITI compared to an odor trial ( Figure
    3 supplemental ; Wilcoxon signed rank test, p < 0.001)
  statistics:
  - test: Wilcoxon signed rank test
    p: 0.001
    p_relation: "<"
  criterion: Per mouse, DOI session mean speeds over ITI frames and over odor-trial frames (as
    fig3c); two-sided paired signed-rank test, as in fig3_cleaned.Rmd. Reproduced when ITI is
    slower with p < 0.05.
- id: fig3supp-doi-omission-no-difference
  statement: Within the DOI condition, speed does not differ between odor and omission trials, nor
    between the ITI and omission trials.
  source: Results, DOI impacts speed and timing, paragraph 4
  quote: However, there was no difference in speed between the odor and odor omission trials in the
    DOI condition (Wilcoxon rank sum test, p = 0.21), nor the ITI and odor omission trials
    (Wilcoxon rank sum, p = 0.068)
  statistics:
  - about: DOI odor against DOI omission
    test: Wilcoxon rank sum test
    p: 0.21
  - about: DOI ITI against DOI omission
    test: Wilcoxon rank sum
    p: 0.068
  criterion: A claim of absence, for two comparisons. Per-mouse DOI session mean speeds over
    odor-trial, omission-trial and ITI frames (as fig3c); two-sided paired signed-rank tests, the
    Methods' test and the code's, uncorrected; the rank-sum tests the Results name are shown as
