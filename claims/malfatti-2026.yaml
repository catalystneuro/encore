    in 3 control mice (162, 363, 399 and 146 in sessions 1, 2, 5 and 6) and 403 in 3 Cre+ mice
    (106, 126, 53 and 118).
  source: Results, Increased Ma2 cell excitation affected calcium signal amplitudes, paragraph 2;
    Methods, Neural activity around prehensions, paragraph 2; Figure 1J legend
  quote: On average, 61.4 ± 11.49 PCs (n = 6 mice; 3 Control, total of 1070 cells for 4 sessions,
    average of 105.2, 102.8 and 59.5 for each animal; 3 Chrna2-Cre+, total of 403 cells for 4
    sessions, average of 45, 53.8 and 16) were included in the analysis
  expected:
  - quantity: control PCs over the four sessions
    value: 1070
    tolerance: 107
  - quantity: Cre+ PCs over the four sessions
    value: 403
    tolerance: 40.3
  - quantity: mean PCs per mouse and session
    value: 61.4
    tolerance: 11.49
  - quantity: percentage of recorded PCs excluded as not task-modulated
    value: 15.97
    tolerance: 1.6
    unit: '%'
  criterion: Prehensions, slices and the task-modulation test as in the opening comment. The
    tolerance on the mean per mouse and session is its reported spread. Per-session counts are
    reported against the Figure 1J legend. The paper's own numbers disagree for Cre+ (the
    per-animal averages 45, 53.8 and 16 over 4 sessions give 459, not 403), so the totals are
    judged and the per-animal averages are shown only. Whether a neuron counts once per session
    (the Methods' per-session selection) or once per animal across sessions is open; both counts
    are shown, the per-session count is the main one. Reproduced when the totals and the
    excluded percentage are within tolerance.
