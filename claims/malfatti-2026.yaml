  source: Results, Increased Ma2 cell excitation affected calcium signal amplitudes, paragraph 4;
    Methods, Trial adjacency interference, paragraph 1
  quote: we performed FDR-corrected trial-by-trial comparisons of adjacent trials, finding significant
    effect of the previous trial in the current trial in only 17.7% of pairs
