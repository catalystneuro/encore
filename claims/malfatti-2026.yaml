  statement: In session 6, assemblies of Cre+ mice covered a smaller area than those of control
    mice, their PCs lying closer together.
  source: Results, Increased Ma2 cell excitation resulted in PC assembly salience rigidity,
    paragraph 3; Figure 3H-K; Supplemental Table 5D-E
