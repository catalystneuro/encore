# Claims for Malfatti, Velica et al. (2026), "Increased layer 5 Martinotti cell excitation reduces
# pyramidal cell population plasticity and improves learned motor execution", eLife 14:RP109286,
# on DANDI:002056.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-27,
# protocol pilot-18 (docs/protocol.md, Reader).
#
# Text read: the eLife reviewed preprint v3 (2026-11-02, revised by the authors), from a PDF
# supplied by a person (paper/10.7554-elife.109286.txt): main text, Materials and methods,
# figure legends and the authors' responses, with its supplement (supp-file02: Supplemental
# Figures 1 to 7 and Supplemental Tables 1 to 6 of expanded statistics). Missing from the
# supplement: Supplemental Table 1M to 1P, which the Results cite for the pasta handling test and
# the prehension task after ablation (claims fig5d-pasta-drops and fig5i-ablation-prehension
# carry no statistics for that reason). Equation 1 (assembly resilience) is lost in the text
# extraction and the PDF could not be rendered; equation 2 (salience) survives only as its
# terms. Both are taken from the code.
#
# Code read: https://gitlab.com/malfatti/M1MartinottiOnMovement, commit 86efdf1 (2024-04-26), the
# only branch. It holds the prehension detection and classification from DeepLabCut output
# (MS_PRT_Reaches.py, LFP_PRT_Reaches.py, BehavOnly.py, Core.ReachClassify), the calcium imaging
# analysis (MS_PRT_CalciumImaging.py: event-triggered slices, the per-neuron before/after test,
# peak latency and peak width), the assembly detection and analysis (MS_PRT_AssembliesDetection.py,
# MS_PRT_AssembliesAnalysis.py: ICA through GoodhillLab/neural-assembly-detection, salience,
# resilience, polygon area), the LFP amplitude analysis (LFP_PRT_EPhys.py) and the pasta handling
# and hanging wire statistics. Statistics run through sciscripts Stats.Full with 'auto' test
# choice. The commit predates the reviewed preprint: it has no spectrogram or band-power code
# for the LFP bands of Figure 4 and Supplemental Figure 7 (LFP_PRT_EPhys.py computes only the
# 1-100 Hz filtered amplitude), and no code for the trial adjacency, the baseline epochs or the
# during/before ratio analyses. Those methods rest on the Methods text alone.
#
# Data the paper used, as it reports them. All mice received 0.01 mg/kg clozapine (CLZ) i.p.
# where stated; Chrna2-Cre+ mice (Cre+) express hM3Dq in Chrna2 Martinotti (Ma2) cells, controls
# are Cre-negative littermates with the same treatment.
#  - Miniscope group (Figures 1D-J, 2, 3, Supplemental Figures 2 to 6): male mice, GCaMP6f in layer 5
#    pyramidal cells (PCs) of right M1 through a prism lens, UCLA miniscope at about 20 frames/s,
#    10 min sessions; 8 implanted, 2 Cre+ excluded, 6 analysed (3 control, 3 Cre+). Imaging on
#    sessions 1, 2, 5 (pellet on the spoon) and 6 (pellet on the plate, same day directly after
#    session 5); behaviour video (50 frames/s, front view) on sessions 1 to 6; CLZ 45-60 min
#    before every session. Assemblies use sessions 1, 2 and 6 of 4 mice (2 per genotype).
#  - Behaviour-only learning group (Figure 1F-H, Supplemental Table 1A-F): 20 mice injected, 13
#    analysed (6 Cre+, 7 control), CLZ before every session, about 11 sessions (Table 1D has
#    F(10,110)); sessions 1-5 on the spoon, then the plate.
#  - LFP group (Figure 4, Supplemental Figure 7, Tables 1G-L and 6): female mice, 2x5 tungsten
#    wire array in right M1, 16-channel Intan headstage, Open-ephys; trained for sessions 1-7
#    before hM3Dq injection, then sessions 8-10 with saline and 11-13 with CLZ; 6 control and
#    5 Cre+ (the Methods also give 13 and 11 mice for this group; the Results and Figure 4 legend
#    give 11).
#  - Caspase ablation group (Figure 5): Chrna2-Cre/tdTomato mice, AAV5-FLEX-taCasp3 in forelimb M1;
#    prehension sessions 7 (before) and 8-12 (after), pasta handling and hanging wire (scored by
#    visual inspection), 3 Cre+ and 6 controls (Figure 5I legend gives 8 controls and 6 Cre+).
#  - Histology (Supplemental Figure 1, Figure 5B): c-Fos and mCherry immunolabelling, tdTomato counts.
# Measured variables: DeepLabCut positions and likelihoods of nose, both paws, three fingers of
# each paw and the pellet; CNMF-E traces of PCs, detrended by a running 8th percentile over 250
# frames (dF detr.), matched across sessions; LFP filtered 1-100 Hz and in bands. The dataset
# (title "Calcium imaging of pyramidal cells and LFP recordings in layer 5 of mouse primary motor
# cortex") is described as holding miniscope imaging, LFP and DeepLabCut tracking from mice on
# the prehension task, 31 subjects. Histology, pasta handling and hanging wire are not described.
#
# Method details fixed here for all imaging claims, from the Methods and the code.
#  - Prehensions: blocks where the DeepLabCut likelihood of the left paw and its three fingers
#    exceeds 0.7 (Methods, Pellet prehension task analysis). The code tests only LPaw and LFinger1
#    (columns 5 and 6 of the network's body parts, Core.LHCutOff 0.7), fills single-frame gaps,
#    drops single-frame blocks, takes block onsets and keeps the first onset in each second
#    (MS_PRT_Reaches.py); the code's two body parts are a variant. Onset is time 0.
#  - Accuracy: successful when the mouse reached, grasped and brought the pellet to its mouth,
#    failed otherwise (Methods). The Methods do not say how this was scored; the code classifies
#    automatically from the tracking (Core.ReachClassify) and pools all non-success classes as
#    failed. Follow the code.
#  - Event slices: dF detr. traces cut 1 s before to 1 s after onset, averaged over the
#    prehensions of each accuracy, per neuron and session (Methods; Core.ETAWindow = (-1, 1)).
#  - Task-modulated PCs: per neuron, the averaged trace before (t < 0) against after onset,
#    ANOVA or Kruskal-Wallis by Shapiro's test, p < 0.05, kept when significant for at least one
#    accuracy in that session (Methods). The code tests the time samples of the averaged trace and
#    keeps a neuron when it is significant in any session of that animal; a variant.
#  - Statistics: as the Statistical analysis section and the legends say; mixed ANOVA, or for
#    non-normal data (Shapiro) ANOVA-type statistics or Scheirer-Ray-Hare, Kruskal-Wallis with F
#    ratio, post hoc t-test, Mann-Whitney U or Wilcoxon, Holm-corrected, alpha 0.05. Neurons (or
#    assemblies, or animals for behaviour and LFP) are the observations, as the n of each legend
#    and the code's IDs show.
schema_version: 2
