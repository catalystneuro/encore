    second session, as well as an expected decrease in the fifth (harder spoon session) and sixth
    sessions (pellet on the plate) due to increased difficulty and stable performance after session 7
  statistics:
  - about: total prehensions
    test: ANOVA, session effect
    statistic: F(10,110) = 9.525
    p: 2.9e-11
    n: 13 mice
  - about: successful prehensions
    test: ANOVA, session effect
    statistic: F(10,110) = 7.571
    p: 4.3e-09
    n: 13 mice
  - about: success ratio
    test: ANOVA, session effect
