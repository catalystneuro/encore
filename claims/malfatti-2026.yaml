- id: assemblies-counts
  statement: For the assembly analysis 84.8 +/- 14.2 PCs per mouse were matched over sessions 1, 2
    and 6 (133 and 68 in 2 control mice, 77 and 61 in 2 Cre+ mice); 70 control and 49 Cre+
    assemblies were found over the three sessions, 23 and 19 in session 1, with 5.6 +/- 0.4 cells
    per assembly and similar sizes in sessions 2 and 6.
  source: Results, Increased Ma2 cell excitation resulted in PC assembly salience rigidity,
    paragraph 1; Methods, Assembly analysis; Figure 3B-E
  quote: On average, 84.8 ± 14.2 PCs were kept for the analysis (n = 4 mice; 2 Control, total of 70
    assemblies for 3 sessions, average of 14 and 9.3 for each animal; 2 Chrna2-Cre+, total of 49
    assemblies for 3 sessions, average of 11.7 and 4.7) ... In the first session, we identified a
    total of 23 assemblies in controls and 19 assemblies in Chrna2-Cre+ mice, with an average number
    of 5.6 ± 0.4 cells in each assembly for each session
  expected:
  - quantity: matched PCs per mouse, mean
    value: 84.8
    tolerance: 14.2
  - quantity: control assemblies over sessions 1, 2 and 6
    value: 70
    tolerance: 7
  - quantity: Cre+ assemblies over sessions 1, 2 and 6
    value: 49
    tolerance: 4.9
  - quantity: control assemblies, session 1
    value: 23
    tolerance: 2.3
  - quantity: Cre+ assemblies, session 1
    value: 19
    tolerance: 1.9
  - quantity: cells per assembly, mean
    value: 5.6
    tolerance: 0.4
  depends_on:
  - pc-selection-counts
  criterion: PCs matched across sessions 1, 2 and 6 (intersection over union and the Hungarian
    algorithm, Methods). Assemblies detected on the whole 10 min recording of each session by
    ICA with circular shifts (ICA-CS, ref. 39) as implemented in GoodhillLab
    neural-assembly-detection (MS_PRT_AssembliesDetection.py, ICA_ASSEMBLY_DETECTION); then
    non-task-modulated neurons removed and assemblies of 4 or more neurons kept (Methods; code
    len > 3). Tolerances are the reported spreads where given, else 10%. Which four mice is not
    said beyond 2 per genotype; the mice with PCs matched on all three sessions are used.
    Reproduced when at least five of the six values are within tolerance.
- id: fig3g-salience
  statement: Assembly salience (activity within the prehension window relative to outside it,
    from -2.04 to 24.62) changed with session; in controls it was lower on successful prehensions
    in session 6 than in sessions 1 and 2, with no other differences, none in Cre+ mice.
  source: Results, Increased Ma2 cell excitation resulted in PC assembly salience rigidity,
    paragraph 2; Figure 3G; Supplemental Table 5A-C
  quote: The salience data for single assemblies varied from −2.04 to 24.62 and we found an overall
    effect of the training session on assembly salience ... Assembly activity during successful
    prehensions in control mice was less salient in session 6 compared to sessions 1 and 2 ... We
    found no other differences in salience for failed prehensions or between training sessions in
    Chrna2-Cre+ mice
  statistics:
  - about: session effect
    test: ANOVA-type, F2-LD-F1 model
    statistic: F(2,inf) = 5.50
    p: 0.0047
  - about: controls, successful, session 6 against session 1 or 2
    test: Mann-Whitney U
    statistic: eff. size = 0.55
    p: 0.0036
    corrected: Holm
  - about: controls, successful, session 6 against the other of sessions 1 and 2
    test: Mann-Whitney U
    statistic: eff. size = 0.42
    p: 0.045
    corrected: Holm
  expected:
  - quantity: lowest assembly salience
    value: -2.04
    tolerance: 0.2
  - quantity: highest assembly salience
    value: 24.62
    tolerance: 2.46
  depends_on:
  - assemblies-counts
  criterion: Assembly activity peaks are time samples where the summed activity of the assembly's
    neurons exceeds 95% of 1000 time shuffles of each neuron (Methods; the code's GetSigPeaks has
    ShuffleRounds 1000, Alpha 0.05, and also STDThr 2, a variant). Salience = 100 x (peaks inside
    the -1 to 1 s windows / samples inside - peaks outside / samples outside), per assembly,
    session and accuracy (equation 2 terms in the Methods; the x 100 from the code and the stated
    -100 to 100 range). Assemblies of each session with factors accuracy, genotype and session,
    ANOVA-type statistics, post hoc Mann-Whitney U, Holm (Figure 3G legend). Reproduced when the
    session effect has p < 0.05, control successful salience in session 6 is below both sessions
    1 and 2 at corrected p < 0.05, and no Cre+ session pair differs; partially reproduced when the
    session effect and one control comparison hold. The salience range is reported against the
    expected values.
