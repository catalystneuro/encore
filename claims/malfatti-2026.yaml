    genotype had no effect on the total number of prehensions, the number of successful
    prehensions or the success ratio.
  source: Results, Increased Ma2 cell excitation affected calcium signal amplitudes, paragraph 2;
    Figure 1F-H; Supplemental Table 1A-C
  quote: Our analysis revealed no effect of genotype on prehension performance in a separate group of
    mice treated with CLZ before each session (n = 13 mice; 6 Chrna2-Cre+ and 7 controls
  statistics:
  - about: total prehensions
    test: ANOVA, genotype effect
    statistic: F(1,11) = 4.8e-02
    p: 0.83
    n: 13 mice
  - about: successful prehensions
    test: ANOVA, genotype effect
    statistic: F(1,11) = 3.4e-02
    p: 0.856
    n: 13 mice
  - about: success ratio
    test: ANOVA, genotype effect
    statistic: F(1,11) = 0.336
    p: 0.574
    n: 13 mice
  criterion: A claim of absence, judged on the paper's test, a mixed ANOVA with genotype between
    mice and session within mice (ANOVA-type statistics if Shapiro's test rejects normality), on
    per-mouse, per-session values, as Supplemental Table 1A-C and the Statistical analysis
    section give. Prehensions and accuracy as in the opening comment; success ratio is successful
