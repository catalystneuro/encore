  statistics:
  - about: session effect
    test: ANOVA
    statistic: F(6,54) = 4.27
    p: 0.001
    n: 11 mice
  - about: genotype by session interaction
    test: ANOVA
    statistic: F(6,54) = 2.203
    p: 0.057
  - about: session effect, Cre+
    test: ANOVA
    statistic: F(6,24) = 5.612
    p: 0.0019
  - about: session effect, controls
    test: ANOVA
    statistic: F(6,30) = 1.083
    p: 0.395
  - about: treatment effect, Cre+
    test: ANOVA
    statistic: F(1,15) = 10.974
    p: 0.01
  - about: treatment effect, controls
    test: ANOVA
    statistic: F(1,19) = 0.878
    p: 0.361
  criterion: LFP group, 5 Cre+ and 6 controls (Results; Figure 4 legend), sessions 7 to 13 (seven
    sessions, as Table 1G's 6 degrees of freedom and LFP_PRT_Reaches.py SessionCutOff 7 give),
