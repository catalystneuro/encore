    in the opening comment. Mixed ANOVA on genotype and session, then per genotype ANOVA on
    session and on treatment (saline 8-10 against CLZ 11-13), followed by t-test (Figure 4B
    legend). The treatment tests' degrees of freedom, F(1,15) for 5 Cre+ and F(1,19) for 6
    control mice (Supplemental Table 1K-L), do not fit a within-mouse test over mice (F(1,4) and
    F(1,5)); they suggest mouse-session values taken as independent, 17 and 21 of them, fewer
    than the 30 and 36 of sessions 8 to 13, so some sessions are missing. Both readings are
    run, (a) treatment within mouse on per-mouse saline and CLZ means; (b) a one-way ANOVA over
    the available mouse-session success ratios of sessions 8 to 13. Reproduced when the Cre+ treatment effect has p < 0.05 with CLZ higher and the
    control treatment effect has p > 0.05; partially reproduced when the Cre+ effect holds and the
    control effect is also significant.
- id: fig4d-theta-genotype
  statement: Around prehensions, LFP power in the full theta band (4-12 Hz) and the low theta band
    (4-7 Hz) was higher in Cre+ mice than in controls, and theta power differed with accuracy.
  source: Results, Increased Ma2 cell excitation resulted in improved execution of a learned motor
    task, paragraph 3; Figure 4D; Supplemental Table 6A-C
  quote: LFP analysis provided a detailed view of Mα2 cell involvement, showing increased power in
    the full theta band and the low theta band in Chrna2-Cre+ mice compared to controls
  statistics:
  - about: genotype effect, theta power
    test: ANOVA
    statistic: F(1,8) = 6.783
    p: 0.031
  - about: accuracy effect, theta power
    test: ANOVA
    statistic: F(1,8) = 6.332
    p: 0.036
  - about: genotype effect, low theta power
    test: ANOVA
    statistic: F(1,8) = 6.489
    p: 0.034
  depends_on:
  - fig4b-clz-improves-success
  criterion: Method from the Methods (LFP electrophysiology analysis) and Results, as the code has
    no spectrogram. Per channel, a second-order Butterworth band-pass of the band, then a
    spectrogram, each power value divided by the cumulative mean, averaged over the frequency bins
    inside the band; mean power in the 1 s before and 1 s after onset, per accuracy, averaged over
    prehensions per mouse and session. Mixed ANOVA (ANOVA-type if not normal) on genotype,
    accuracy, phase and session, mice as observations. Sessions 11-13, the CLZ sessions the
    Results name; the session terms of Supplemental Table 6 have 2 degrees of freedom (6I
    F(2,16), 6K F(2,18), 6L F(2,8)), so three sessions, and "full dataset" in the Figure 4
    legend means all three sessions. The genotype terms around prehensions have F(1,8), so 10
    mice, while Table 6K and 6P (outside prehensions) fit 11; which mouse is missing is not
    said, and mice with prehensions of both accuracies in all three sessions are used. Open, with
    readings run (b) channels, the mean over all accepted channels, or one
    channel per mouse (the code's SingleCh, from a channel list not in the repository; the
    channel with the highest median theta power over the session is the stand-in); (c) the
    normalisation, each frequency bin divided by its mean over the whole recording, or each
    value divided by the mean over all time and frequency bins; (d) spectrogram window,
    not given, 1 s Hann windows with 50% overlap, and 0.5 s windows as a variant. Reproduced when
    the genotype effects on theta and low theta have p < 0.05 with Cre+ higher under the
    readings the outcome rests on; the outcome is the one all readings give, or marked as
    resting on a reading.
