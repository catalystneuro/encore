    statistic: H(1) = 10.539
    p: 0.0012
  - about: Cre+ against control, session 6
    test: Mann-Whitney U
    statistic: eff. size = 0.495
    p: 0.012
    corrected: Holm
  depends_on:
  - assemblies-counts
  criterion: Area of each assembly as the polygon formed by its neurons' centres of mass sorted by
    angle around their mean position (Methods; code Analysis.PolygonArea on the matched centres
    of mass). All assemblies of sessions 1, 2 and 6, Scheirer-Ray-Hare on genotype and session,
    then Mann-Whitney U per session, Holm (code, Assemblies distance area stats; Figure 3K legend).
    Reproduced when the genotype effect has p < 0.05 and session 6 Cre+ areas are smaller at
    corrected p < 0.05.
- id: fig3l-resilience
  statement: Genotype and session affected assembly resilience; assemblies of session 6 traced back
    to session 2 had higher resilience in Cre+ mice than in controls (20 control and 14 Cre+
    assemblies).
  source: Results, Increased Ma2 cell excitation resulted in PC assembly salience rigidity,
    paragraph 3; Figure 3L; Supplemental Table 5F-G
  quote: We found that genotype and training session affected assembly resilience ... where
    assemblies in Chrna2-Cre+ mice displayed increased resilience compared to assemblies in control
    mice in session 2 (n = 20 assemblies control and 14 assemblies Chrna2-Cre+ traced back from
    session 6
  statistics:
  - about: genotype by session interaction
    test: ANOVA
    statistic: F(2,94) = 4.18
    p: 0.018
  - about: Cre+ against control, session 2
    test: t-test
    statistic: eff. size = 0.937
    p: 0.012
    corrected: Holm
    n: 20 control and 14 Cre+ assemblies
  expected:
  - quantity: control assemblies of session 6 traced back
    value: 20
    tolerance: 2
  - quantity: Cre+ assemblies of session 6 traced back
    value: 14
    tolerance: 1.4
  depends_on:
  - assemblies-counts
  criterion: For each assembly of session 6, the assembly of session 1 and of session 2 with the
    highest resilience to it (Methods). Equation 1 is lost from the extracted text, so the code's
    AssemblyResilience is used, I/|ref| + (I/|res|)(|res|/|ref| - 1), I the shared neurons, ref the
    session 6 assembly; only assemblies of 4 or more neurons. That formula equals
    2I/|ref| - I/|res|, which can fall below 0 or exceed 1, while the Methods put resilience
    within 0 and 1 and the Results call it the percentage of neuron match. The code's formula is
    the main reading; the intersection over the union of the two assemblies, which meets the
    Methods' range and endpoints, is run as a variant. ANOVA on genotype and session, then
    t-test per session, Holm (Figure 3L legend). The ANOVA's 94 degrees of freedom suggest the
    code's loop over every session as reference; that reading is run as a variant. Reproduced
    when the interaction has p < 0.05 and Cre+ resilience in session 2 is higher at corrected
    p < 0.05.
