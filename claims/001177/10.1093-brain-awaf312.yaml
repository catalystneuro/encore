# Claims for Zhuang, Lemak, Sridhar & Nelson (2025), Brain 149:238-251, on dandiset 001177.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-10-28,
# protocol pilot-12 as stated in docs/protocol.md. The writer did not look at the dandiset's data or
# files; only its title and description on the archive were read. Claim fig1fg-delay-discounting
# was added by the check of 2026-10-28.
#
# Text read: the version of record (open access, CC BY), full text as served by Europe PMC
# (PMC12597312), with its one supplement, awaf312_supplementary_data.pdf (Figures S1 to S8 and
# legends, Supplementary Materials and methods, and Table 1, "Experimental analysis and
# statistics"). Figure panels of the main paper were not available as images; values in the main
# figure legends were read from the text. The pie-chart percentages of Figures S5D and S8A-B were
# read from the supplement PDF (pages 7 and 10), as the text holds only the legends.
#
# Code read. The paper links (1) UCSF-Nelson-Lab/ICD-Cognitive-Analysis, tag ICD, commit 5528e22
# (Zenodo doi:10.5281/zenodo.10703139, record 10703140): Python scripts that count task events per
# block of the delay discounting task (delay_discounting_task.py, phase2.py, phase3.py) and
# Summary_Cognitive.m, which averages each mouse's sessions within a condition, fits
# V = A/(1 + K*D) to the four delays with lsqcurvefit (start A = 1, K = 0.5, no bounds) and takes
# the AUC as the trapezoidal integral of the fitted values at D = 0, 3, 6, 9 s; (2)
# UCSF-Nelson-Lab/ICD-Cognitive-Arduino, tag ICD, commit f7cff8b (Zenodo doi:10.5281/zenodo.10703131),
# the operant box control code. No code is linked for the electrophysiology: the Methods say firing
# was analysed in NeuroExplorer 4.133 and statistics run in GraphPad Prism 10.
#
# Data the paper used. Mice (C57BL/6 background, male and female, 3 to 7 months) received
# bilateral dorsolateral striatum injections of 6-OHDA (parkinsonian, Park) or saline (control,
# Ctrl). Drugs: pramipexole (PPX, 0.5 mg/kg i.p., tested about 4 h after injection), A77636
# (1 mg/kg i.p., tested 30 min after), CNO (3 mg/kg for hM4Di, 1 mg/kg for hM3Dq).
# - In vivo electrophysiology (Figure 4, Figure 6F-K, Figures S5 and S8): D1-Cre and A2a-Cre mice
#   with ChR2-eYFP in the left dorsomedial striatum (DMS) and DMS optrode arrays; Blackrock
#   CerePlex Direct, 30 kHz, 154-8800 Hz; manual sorting in Plexon Offline Sorter; units classed as
#   putative MSNs by waveform (peak to valley, peak width) and ISI distribution; optically
#   identified dMSNs (D1-Cre) and iMSNs (A2a-Cre) from responses to blue light at the end of each
#   session. Sessions of 330 min, PPX (or saline) injected after a 30 min baseline; recordings in
#   the open field. Ctrl N = 7 and Park N = 11 mice for putative MSNs (117 and 214 units);
#   labelled dMSNs Ctrl 3 mice / 12 cells, Park 5 / 24; iMSNs Ctrl 4 / 10, Park 4 / 16; saline
#   sessions 4 mice / 40 units; four PPX sessions per mouse for Figure 6. The dandiset holds these
#   recordings: the paper says "Raw in vivo electrophysiology datasets have been deposited in
#   DANDI", and the archive's description (18 subjects, Units, ElectricalSeries, LFP) matches.
#   Its description also mentions light pulses of 100 ms at 1 Hz, 4000 pulses, 0.5 to 4 mW.
# - Behaviour, histology, rotarod, locomotion and slice physiology: deposited by the paper at
#   Zenodo doi:10.5281/zenodo.15258978 (files Data_ICD_Fig1&2&5&6_CognitiveAssay.zip,
#   Data_ICD_Fig1_Rotarod_PPX.xlsx, Data_ICD_Fig3_HistologyQuantification_striatum_raw.xlsx,
#   Data_ICD_FigS1_SNcTH_CellCounting_RawImages.xlsx, Data_ICD_A77636OpenField_Raw.zip,
#   Data_ICD_Fig5_DREADDLocomotion_Raw.zip, Data_ICD_FigS6_SliceValidation.xlsx and raw images).
#   Claims on them have data elsewhere. Delay discounting cohorts: PPX Ctrl 16 and Park 31 mice;
#   A77636 Ctrl 10 and Park 16; DREADD mCherry 15, hM4Di 12, hM3Dq 12. Each session has four blocks
#   (delays 0, 3, 6, 9 s) of 5 forced delayed/large, 5 forced immediate/small and 20 free choice
#   trials; the measure is the percentage of free choice trials, omissions excluded, on which the
#   delayed/large reward was chosen.
#
# Method shared by the electrophysiology claims, from the Supplementary Materials and methods
# ("In vivo electrophysiology" and "Experimental design & statistical analysis, In vivo
# electrophysiology"): firing rates in 1 min bins; baseline -30 to 0 min; the post-drug epoch
# 240 to 300 min, split into 241-270 and 271-300 min; a unit is 'increase' type when a Wilcoxon
# signed-rank test (p < 0.01) finds a significant increase against baseline in both 30 min post
# epochs, 'decrease' when a significant decrease in both, 'no change' when neither; optical
# identification by a PSTH around laser onset, the rate
# exceeding the 99% confidence interval of baseline within 15 ms of onset and staying above it for
# at least 15 ms, with light-evoked waveforms not distinguishable from spontaneous ones.
# Details these sources leave open, with the readings allowed, used by several claims:
# - Putative MSN classification: the thresholds are not given; readings are (a) a classification
#   deposited with the units by the authors, (b) the criteria of the cited papers (Berke et al.
#   2004, Neuron 43:883; Gage et al. 2010, Neuron 67:466) applied to peak to valley and peak width.
# - Optical identification: the PSTH bin width, the baseline window for the 99% interval and the
#   waveform test are not given; readings are (a) a label deposited by the authors, (b) 1 ms bins,
#   the pre-pulse interval of each pulse as baseline, and waveform correlation as the comparison.
# - The pairing in the signed-rank test for response type: readings are (a) the 30 baseline 1 min
#   bins paired in time order with the 30 bins of each post epoch, (b) the same two sets of 30
#   bins compared by an unpaired rank-sum test.
# - A unit significant in one 30 min epoch only, or in opposite directions, is not defined by the
#   paper; readings are (a) counted as no change, (b) left out of the denominator. The count of
#   such units is reported.
# - Which PPX session Figure 4 and Figure S5 use: readings are (a) the first PPX session of each
#   mouse, (b) every PPX session pooled, each unit-session counted once. Neither is known to give
#   the Figure S5 pool: by the Figures 6 and S8 legends the first parkinsonian session has 105 units
#   (19 increase, 34 decrease) and the four sessions together 113 increase and 116 decrease units,
#   against 214 units (54, 78) in Figure S5; control 117 units against 80 in the first session.
#   The author reports which selection, if any, gives these totals.
