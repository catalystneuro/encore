- id: vr-reward-location-learning
  statement: Both control and Cre mice learned the context-dependent reward locations, licking
    more and running slower only in the bins just before the reward zones, and anticipatory
    licking on familiar trials changed over days.
  source: Results, Stx3-dependent postsynaptic membrane fusion in CA1 is critical for novel
    environment preference and reward anticipation, paragraph 4; Figures 1F and S2B-E
  quote: Both Cre and control mice rapidly learned the context-dependent reward locations,
    evidenced by increased licking and decreased running speed only in the spatial bins
    immediately preceding the reward zones
  statistics:
  - about: day main effect, familiar trials anticipatory lick rate
    test: mixed effects ANOVA
    statistic: F(5,75)=7.55
    p: 8.61e-6
    n: 9 control and 8 Cre mice, 6 days
  criterion: The paper gives no test of the spatial pattern; the comparison its sentence makes
    is between the bins preceding the reward zone and the rest of the track. On day 6, for each
    group and each arm (left, right), from the across-animal mean of position-binned normalized
    lick rate and normalized running speed (each mouse's binned value over its overall mean,
    Methods, VR behavioral analyses; Fig S2C and S2E), the pattern holds when the mean
    normalized lick rate in the 30 cm before the reward zone exceeds that of every bin outside
    the reward zone and those 30 cm, and the normalized speed in those 30 cm is below 1. The
    day effect holds when the day main effect of the fig1f ANOVA has p < 0.05 with the day 6
    mean above the day 1 mean. Reproduced when both hold, partially when one does. Readings of
    the Cre mice as in fig1f.
  depends_on:
  - fig1f-anticipatory-licking-familiar
