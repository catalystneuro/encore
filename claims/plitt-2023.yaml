- id: fig1c-novelty-preference
  statement: In the freely moving novel-arm T-maze test trial, control mice preferred the
    previously unseen arm while Cre mice explored the arms at chance, and the novel minus
    familiar difference score differed between groups.
  source: Figure 1C; Results, Stx3-dependent postsynaptic membrane fusion in CA1 is critical
    for novel environment preference and reward anticipation, paragraph 1
  quote: During the test trial, control mice preferred to explore the previously unseen arm,
    while Cre-injected mice explored the different arms at chance levels
  statistics:
  - test: unpaired t-test
    statistic: t=2.83
    p: 0.007
    n: 19 control and 24 Cre mice
  criterion: Difference score per mouse is time in the novel arm minus time in the familiar arm
    in the 2 min test trial, which begins when all four paws leave the start arm (Methods,
    Freely-Moving Novelty T-Maze). Unpaired t-test of control against Cre (Fig 1C legend), run
    as Student's (the Prism default for an unpaired t-test) and as Welch's. Reproduced when
    p < 0.05 with the control mean higher under both. The paper gives no test of the Cre score
    against zero; its mean and a one-sample t-test are reported in the notes only.
