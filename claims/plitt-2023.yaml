# Claims for Plitt, Kaganovsky, Sudhof & Giocomo, "Hippocampal place code plasticity in CA1
# requires postsynaptic membrane fusion", bioRxiv doi:10.1101/2023.11.20.567978, on dandiset
# 001710 (named on the archive "Plitt & Kaganovsky et al (2026). Hippocampal place code
# plasticity in CA1 requires postsynaptic membrane fusion.").
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21,
# protocol as stated in docs/protocol.md (version pilot-10).
#
# Text read: the bioRxiv preprint, version 1 (posted November 21, 2023), full text as served by
# bioRxiv, stored under paper/: Summary, main text, Figure 1 to 7 legends, Supplementary
# Figure S1 to S9 legends (inline in the text), Discussion and Methods. No PDF was available, so
# values printed only inside figures could not be read. The supplement is the figures S1 to S9,
# whose legends were read; Movie S1 was not, and no claim rests on it. The text extraction
# dropped the Methods' equations: the spatial information formula (cited to Skaggs et al. 1993,
# ref 137), the naive Bayes posterior and its quasi-Poisson likelihood, the input tuning
# function and the full weight-update equation of the K-Winners-Take-All model. Where a
# criterion needs one of them, it says so. The dataset's archive name gives 2026, which may
# mean a later published version; it was not read.
#
# Code: the paper links no code and gives no code or data availability statement. Software it
# names is used as the criteria say: pingouin (mixed effects ANOVAs and posthoc t-tests, Holm
# step-down correction) and statsmodels (generalized linear mixed effects models) for the VR
# and imaging data; Prism 9 for the freely moving behavior; Suite2P for segmentation.
#
# Data the paper used.
#  - Freely moving behavior (Fig 1B-C, S1A-F). Stx3 fl/fl male mice injected bilaterally in
#    dorsal CA1 with AAV-Synapsin-EGFP-Cre ("Cre", N=24) or EGFP-dCre ("control", N=19) for the
#    novelty T-maze (five 2 min training trials with the novel arm blocked, 1 min ITI, then a
#    2 min test with all arms open); separate cohorts of 11 control and 12 Cre mice for open
#    field (30 min) and elevated plus maze (5 min). Video tracking (Viewer III).
#  - Head-fixed VR with two-photon imaging (Fig 1D-G and Fig 2 to 7, S2 to S9). Stx3 fl/fl male
#    mice with jGCaMP7f plus AAV-hSyn-mCherry (control, Ctrl-1 to Ctrl-9) or
#    AAV-CaMKIIa-mCherry-IRES-Cre (Cre-1 to Cre-7) in bilateral dorsal CA1, imaging window over
#    left dorsal CA1. Cre-8 received Cre in CA1 and GCaMP in CA3 and was imaged in CA2/3 (Fig
#    S5A-B); Cre-7 was also imaged in dentate gyrus in one extra session (Fig S5C-D). Imaging at
#    15.46 Hz, 512 x 796 pixels; Suite2P ROIs curated by hand, only GCaMP+/mCherry+ cells kept;
#    cells tracked across sessions with custom code. Measured variables are dF/F deconvolved to
#    "activity rates", VR position (a spline parameter along a 300 cm track, analysed in 30 bins
#    of 10 cm), running speed (rotary encoder), licks (capacitive sensor), reward times, trial
#    type (familiar or novel arm, left or right), block and day.
#  - Task. Days 1 to 5, six blocks per day; blocks 1 to 5 familiar arm only (at most 20 trials or
#    5 min), block 6 familiar and novel trials randomly interleaved (at most 40 trials or 10
#    min), 1 min between blocks. Day 6, both arms interleaved in every block. Familiar arm (left
#    or right) assigned at random per mouse. Hidden 25 cm reward zones at the beginning of the
#    left arm and the end of the right arm; reward omitted on 10% of trials; automatic reward in
#    block 1 of day 1. Days 7 and 8, reward reversal: day 7 blocks 1 and 2 as day 6, reward
#    zones swapped from block 3 on (automatic reward in block 3 only); day 8 in the reversed
#    locations. A subset of mice later ran the morph task of Plitt & Giocomo 2021 (Fig S4).
#
# Methods common to many criteria (Methods sections named; all from the paper).
#  - Mice. Imaging analyses use Ctrl-1 to Ctrl-9 and Cre-1 to Cre-7 (Methods, In vivo imaging
#    virus injections; the F(1,14) degrees of freedom of the imaging ANOVAs). Some VR behavior
#    legends give 8 Cre mice (Fig 1F) or 7 Cre mice with F(1,15) (Fig 1G, S2I), which fits 17
#    mice; the behavior criteria name both readings (Cre-1 to Cre-7; Cre-1 to Cre-8).
#  - Mixed effects ANOVA: pingouin mixed_anova, virus as the between factor, day (or trial type)
#    as the within factor, mouse as subject, on one value per mouse per day (Methods,
#    Statistics). "5 days (day 6 excluded)" means days 1 to 5. Posthoc t-tests are pingouin
#    t-tests with Holm correction. Unpaired t-tests are run both as Student's and as Welch's
#    (the paper says "unpaired t-test"; pingouin's default correction='auto' applies Welch's
#    correction when group sizes differ, as 9 and 7 do); a claim holds when both agree.
#  - Spatial bins: 30 bins of 10 cm along the spline parameter (Methods, VR novel arm Y-maze).
#  - Place cells: Skaggs spatial information of the position-binned activity rate, significant
#    when above 95% of 1,000 shuffles that circularly shift the cell's time series against
#    position within each trial; identified separately for familiar and novel trials on each
#    day (Methods, Place cell identification). The Methods state no speed threshold and none is
#    applied. The log base of SI does not change significance (standard choice, log2).
#  - Single place fields: contiguous bins of the trial-averaged rate map above 95% of 1,000
#    within-trial circular shuffles, at least 20 cm wide; the formation lap is the first trial
#    with activity above 20% of the cell's in-field maximum followed by such activity on at
#    least 66% of the remaining trials (at least 4 remaining); fields without a formation lap
#    are dropped from single-field analyses (Methods, Single place field analyses).
#  - HSEs: post-reward periods with running speed below 2 cm/s for at least 750 ms; a cell's
#    significant transient is activity above 20% of its session maximum, beginning after the
#    stop and the reward; cells are coactive when their transients begin within 500 ms; the HSE
#    threshold is the 95th percentile of the coactive count over 1,000 shuffles that circularly
#    shift each cell within each eligible stopping period, per session (Methods, HSEs). A cell
#    "participates" (is "reactivated") when its transient is among those of an HSE.
#  - Population vector shift: for each pair of trials, spatial cross-correlation of population
#    vectors at lags up to 300 cm in 10 cm bins, the shift taken as the centre of mass (COM) of
#    the cross-correlation; the initial shift is the mean of the upper triangle of the matrix of
#    the first five novel arm trials (Methods, Population vector cross-correlation). Negative
#    shifts are backward.
#
# Inconsistencies noticed in the text (for the author's notes, not corrected here): Fig 1F
# prints F(1,15)=10.66 with p=5.22e-4, where that F gives p near 0.005; Fig S3A prints
# F(1,14)=.016 with p=.795 (the same F in Fig S3B gives p=.902); Fig 2C-D give N=8 Cre mice
# with F(1,14); Fig S6E names 4 conditions and 5 days with F(2,.) and F(5,.); the Discussion
# says Cre mice have more reward coding neurons than chance while Fig 5D gives p=.080; Fig 7H
# prints t=5.44 with p=6.12e-5 for 9 mice; Fig 6D prints chi2=6.37 with p=.016.
