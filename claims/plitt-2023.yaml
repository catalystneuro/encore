    n: 9 control and 7 Cre mice, days 1 to 5
  - about: control against Cre on day 1
    test: posthoc unpaired t-test
    statistic: t=4.43
    p: 0.007
    corrected: Holm
  criterion: Normalized speed is log10 of the mean running speed on the block 6 trials divided
