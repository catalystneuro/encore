- id: fig5h-extinction-group-difference
  statement: After the reward locations were switched, control mice kept licking at the old
    reward zone longer than Cre mice; a binomial mixed model of licking fits better than with
    shuffled group labels.
  source: Figures 5E-I; Results, CA1 Stx3 is necessary for place cell reward representations and
    memory, paragraph 2
  quote: The true model fit exceeded those from a shuffled distribution in which animal
    identities were scrambled, indicating that the Cre and control animals displayed
    significantly different licking behavior (Fig. 5H-I)
  statistics:
  - about: model log loss against label shuffles
    test: shuffle test
    p: 0.002
    n: 9 control and 6 Cre mice
  criterion: Left arm trials after the reversal (day 7 from block 3, and day 8). Outcome per
    trial is whether the mouse licked more than once in the previous reward anticipatory zone.
    The paper names that zone two ways, "the previous reward anticipatory zone" (Fig 5H-I
    legends) and "the old reward zone" (Results). Readings, zone (A) the 30 cm preceding the old
    left reward zone (the anticipatory window of Methods, VR behavioral analyses), (B) the old
    25 cm left reward zone itself. Binomial
    generalized linear mixed model in statsmodels (BinomialBayesMixedGLM, statsmodels' binomial
    mixed model) with trial number, virus and their interaction as fixed effects (the paper
    compares intercepts and slopes between groups) and a random intercept per mouse. Model fit
    is the mean log loss of the fitted probabilities; the null refits with virus labels
    permuted across mice (1,000 permutations, a standard choice); p is the fraction of
    shuffles with log loss at or below the true one. Open and run as readings, trial number
    (a) counted on from day 7 into day 8, (b) day 7 only; random effects (i) intercept, (ii)
    intercept and slope. Reproduced when p < 0.05 with control predicted to lick more.
