- id: fig5-vla-decrease-after-gpi-bursts
  statement: At rest, GPi burst onsets, burst offsets and pause onsets are each followed by a small,
    slow decrease of the population VLa firing rate.
  source: Results, VLa activity decreases with bursts and pauses in GPi activity, paragraphs 1 and
    2; Fig 5A-C; Table 2
  quote: Small but significant transient decreases in VLa population spike rate were evident
    following both the onsets and offsets of bursts. ... a deceleration in VLa activity was also
    associated with pauses in GPi activity (Fig 5C).
  statistics:
  - about: decreases against increases among pairs with a significant change, burst onsets
    test: chi-squared
    p: 0.04
    n: 19 pairs
  - about: decreases against increases among pairs with a significant change, burst offsets
    test: chi-squared
    p: 0.05
    n: 13 pairs
  - about: decreases against increases among pairs with a significant change, pause onsets
    test: chi-squared
    p: 0.16
    n: 13 pairs
  criterion: Bursts and pauses detected outside the task by the Poisson surprise method (Methods);
    VLa SDF (10 ms kernel) averaged around each event per pair, pairs with noisy baselines left
