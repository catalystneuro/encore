- id: fig4-ccf-rare
  statement: Short-time-scale spike-to-spike correlations between simultaneously recorded GPi and
    VLa units are rare (3.5% of 427 pairs over whole recordings, 2.2% of 183 at rest, 5.2% of 172
    during movement) and their peaks are not larger than those of jittered controls (p = 0.975,
    0.675 and 0.998).
  source: Results, Correlated activity in GPi-VLa cell pairs is rare and unbiased, paragraph 1; Fig
    4A-F; Table 2
  quote: only 3.5% of the CCFs showed any statistically significant modulation (15 of 427 cell
    pairs; ... the overall distribution of the peak absolute correlation values was not greater than
    the distribution of control peak absolute correlations
  statistics:
  - about: peak absolute correlations against jittered controls, whole recordings
    test: one-sided permutation test
    p: 0.975
    n: 427 pairs
  - about: peak absolute correlations against jittered controls, rest
    test: one-sided permutation test
    p: 0.675
    n: 183 pairs
  - about: peak absolute correlations against jittered controls, movement
    test: one-sided permutation test
    p: 0.998
    n: 172 pairs
  criterion: A claim of absence judged on the paper's test, the one-sided permutation test of the
    KS statistic of peak absolute CCFs (0 to 10 ms) against jittered controls (Fig4_S10to13.m).
    Reproduced when p >= 0.05 in all three periods; not reproduced when p < 0.05 in any. Pairs are
    GPi and VLa units of the dandiset rule in the same file, with at least 100 spikes each in the
    period. The fraction of significant pairs, its binomial test against 5%, and the signs of the
    significant peaks are reported.
- id: fig4-noise-corr-rare
  statement: Trial-to-trial noise correlations between GPi and VLa are rare (5.4% of 332 pairs at
    rest, 7.2% of 372 during movement), not different from shuffled controls (p = 0.07 and 0.388),
    and equally often positive and negative.
  source: Results, Correlated activity in GPi-VLa cell pairs is rare and unbiased, paragraph 5; Fig
    4G-H; Table 2
  quote: We found that the overall distribution of noise correlations was not significantly
    different from the control distribution (Fig 4G and 4H; p = 0.07 during rest, p = 0.388 during
    movement; permutation test).
  statistics:
  - about: distribution of noise correlations against controls, rest
    test: permutation test
    p: 0.07
    n: 332 pairs
  - about: distribution of noise correlations against controls, movement
    test: permutation test
    p: 0.388
    n: 372 pairs
  - about: positive against negative significant correlations, rest
    test: chi-squared
    p: 0.64
    n: 18 pairs
  - about: positive against negative significant correlations, movement
    test: chi-squared
    p: 0.34
    n: 27 pairs
  criterion: A claim of absence judged on the paper's test, the one-sided permutation test of the
