# Claims for Schwab, Kase, Zimnik, Rosenbaum, Codianni, Rubin & Turner (2020) on dandiset 000947.
# Source: the full text (open access, PLOS Biology), read from its Results, tables, figure legends,
# Methods and supporting figure legends.
# Quotes added 2026-10-19 from the full text (PLOS JATS XML); each source names the section and
# paragraph, figure panel or table the quote comes from.
# Statistics added 2026-10-19 from the full text (Results, tables, figure legends and Methods).
#
# When these criteria were written, the author had seen the data check only: the file list and
# metadata of every file, the location labels, channels, sort letters and spike counts of the
# curated units, the trial tables, and the link of the paper's unit list (the Dryad deposit
# doi:10.5061/dryad.0cfxpnvxm, files Gaia_Analy.mat and Isis_Analy.mat) to the dandiset's units,
# with the agreement of this attempt's spike density functions and detected onsets with the ones
# stored in those files (median correlation 0.999; increase detection agreeing for 91% and decrease
# detection for 81% of unit-directions; trial counts equal for 63%). No claim's statistic had been
# computed.
#
# The dandiset holds 378 files; 254 are pre-MPTP recordings, the condition of the paper. Its
# curated `units` tables carry a location label per unit; some labels differ only in case (GPI,
# VLA), some Gaia VLa units are labelled "Thalamus", and some Isis units have no label.
#
# Unit selection, fixed here for every claim on single units (the "dandiset rule"): curated units
# in pre-MPTP files whose location label is GPi or VLa ignoring case; valid trials as the Methods
# define them (no error, reaction time and movement duration not more than 6 median absolute
# differences from the file's mean); a unit-direction is analysed when it has at least 10 valid
# trials; a unit is kept when its mean rate (spikes over the span of its spike train) is at least
# 30 spikes/s in GPi or 1 spike/s in VLa. The dandiset has no identifier that follows a neuron
# across files, so each file's unit is counted as one unit. The paper's own unit list, linked
# through unit-link, is shown as a variant for every claim and does not decide outcomes.
#
# Method choices fixed here from the Methods and the paper's code (PeriEventChange_SDF_pctchng.m,
# Fig2_3_S8_S9.m, Fig4_S10to13.m): activity aligned to movement onset from -1500 to +1000 ms;
# SDF and ISI functions with a 25 ms Gaussian kernel; control period the 700 ms before the median
# cue onset, test period the following 701 ms; the control period's linear trend removed; a change
# needs 70 consecutive ms above norminv(1 - 0.001/10) control SDs; increases from the SDF,
# decreases from the ISI function; a response's latency is its onset; the rest rate is the mean
# SDF from -1500 to -301 ms; the integrated change is the summed SDF minus that rate from -300 to
# +399 ms, in spikes. Statistics are over unit-directions where the paper's code uses them so (rest
# rate, integrated change, latencies), and over units otherwise.
schema_version: 1
dandiset: "000947"
paper: doi:10.1371/journal.pbio.3000829
claims:
- id: unit-link
  kind: link
  statement: The units the paper analysed can be found in the dandiset, and the dandiset's spike
    times and trials reproduce the per-unit peri-movement activity the paper's code stored.
  source: Data Availability; Dryad doi:10.5061/dryad.0cfxpnvxm, Gaia_Analy.mat and Isis_Analy.mat
  quote: Data and code can be found at https://doi.org/10.5061/dryad.0cfxpnvxm.
  data: with_inputs
  criterion: Records are matched by file name (session_id), channel id and sort letter of the
    curated units. For the 394 records the paper's code keeps (not VLp, no missing SDF), the link
    holds (reproduced) when at least 90% are found in every file they span and, for matched
    unit-directions with at least 10 valid trials, the SDF computed from the dandiset correlates
    with the stored SDF at r > 0.9 for at least 90%. Partially reproduced when 50 to 90% of the
    records are found or match; not reproduced below 50%. Trial counts and the location labels of
    the matched units are reported.
- id: table1-unit-counts
  statement: 209 single units met the criteria to be included as GPi neurons (105 in NHP G, 104 in
    NHP I) and 185 as VLa neurons (66 and 119).
  source: Results, Basic approach, database, and activity at rest, paragraph 5; Table 1
  quote: a total of 209 single units met the criteria to be included as GPi neurons and 218 as VLa
    neurons (Table 1).
  expected:
  - quantity: GPi units
    value: 209
    tolerance: 20.9
  - quantity: VLa units
    value: 185
    tolerance: 18.5
  criterion: Units under the dandiset rule, counted by area. Reproduced when both counts are within
    tolerance. The Results text gives 218 VLa units where Table 1 gives 185; both readings are
    checked for VLa. Counts per animal are reported, and, as variants, the count of distinct
    channel and sort letter combinations per day (treating them as one neuron, an assumption) and
    the count of the paper's list found in the dandiset.
- id: table1-rest-rate
  statement: The resting firing rate of GPi neurons (mean 70.1 spikes/s) is significantly higher
    than that of VLa neurons (13.5 spikes/s), and the rates are consistent between the two animals.
  source: Results, Basic approach, database, and activity at rest, paragraph 5; Table 1
  quote: the resting firing rate of GPi neurons was significantly higher than that of VLa neurons
    ... and those rates and the differences between neural populations were highly consistent for
    the two animals
  statistics:
  - about: GPi against VLa resting rates
    test: rank sum
    p: 1.0e-81
  - about: rates and differences between the two animals
    test: rank sum
    p: 1
  expected:
  - quantity: GPi mean rest rate
    value: 70.1
    tolerance: 7.01
    unit: spikes/s
  - quantity: VLa mean rest rate
    value: 13.5
    tolerance: 1.35
    unit: spikes/s
  criterion: Rest rate per unit-direction as the mean SDF from -1500 to -301 ms around movement
    onset (Fig2_3_S8_S9.m), averaged over unit-directions. Reproduced when both means are within
    tolerance and a rank sum test finds GPi higher (p < 0.05). Per animal values are reported.
- id: table1-ap-width
  statement: Action potentials of GPi neurons are shorter than those of VLa neurons (trough to
    peak 0.24 against 0.50 ms; rank sum p = 1e-33).
  source: Results, Basic approach, database, and activity at rest, paragraph 5; Table 1
  quote: Also, as expected, the action potentials of GPi neurons were short in duration as compared
    with those of VLa neurons
  statistics:
  - test: rank sum
    p: 1.0e-33
  expected:
  - quantity: GPi mean action potential width
    value: 0.24
    tolerance: 0.024
    unit: ms
  - quantity: VLa mean action potential width
    value: 0.50
    tolerance: 0.05
    unit: ms
  criterion: Width as the time from the trough to the following peak of the mean waveform on the
    unit's channel in the dandiset's 200 Hz high-pass filtered trace, from the spikes in one
    stored chunk (about 3.2 s) per unit. Reproduced when both means are within tolerance and GPi
    widths are smaller (rank sum p < 0.05); partially reproduced when only the difference holds.
- id: hold-period-ramps
  statement: The firing rate of most units ramps during the start-position hold period (97% of
    GPi and 98% of VLa units with a significant linear trend); slopes are distributed symmetrically
    around zero, without a difference between GPi and VLa (rank sum p = 0.29).
  source: Results, Basic approach, database, and activity at rest, paragraph 6; Fig 2A
  quote: The mean firing rate of most single units showed small but significant ramps during the
    start-position hold period ... 97% and 98% of GPi and VLa cells, respectively). ... For both GPi
    and VLa unit populations, the observed slopes were distributed symmetrically around zero
  statistics:
  - test: rank sum
    p: 0.29
  expected:
  - quantity: GPi units with a significant hold-period slope
    value: 97
    tolerance: 9.7
    unit: percent
  - quantity: VLa units with a significant hold-period slope
    value: 98
    tolerance: 9.8
    unit: percent
  criterion: A unit has a significant slope when the 95% CI of the OLS slope of its mean SDF over
    the control period excludes zero in at least one direction (Fig2_3_S8_S9.m). Reproduced when
    both fractions are within tolerance and the slopes of GPi and VLa do not differ by a rank sum
    test (p >= 0.05). The mean slopes (paper -0.05 and -0.14 spikes/s2) are reported.
- id: mvt-responsive-fraction
  statement: Nearly all units change their discharge around movement for at least one direction
    (GPi 99%, 206 of 209; VLa 88.1%, 163 of 185 in Table 1, 94% in the text).
  source: Results, Movement-related increases in firing are common in both GPi and VLa, paragraph 1;
    Table 1
  quote: Nearly all single units showed a significant peri-movement change in discharge for at least
    one direction of movement, with slightly fewer VLa units responding (99% of GPi neurons and 94%
    of VLa neurons; p = 0.02, chi-squared test).
  statistics:
  - test: chi-squared
    p: 0.02
  expected:
  - quantity: GPi movement-responsive units
    value: 99
    tolerance: 9.9
    unit: percent
  - quantity: VLa movement-responsive units
    value: 88.1
    tolerance: 8.81
    unit: percent
  criterion: A unit is responsive when an increase or a decrease is detected for at least one
    direction. Reproduced when both fractions are within tolerance; VLa is read as 88.1% (Table
    1) or 94% (text, tolerance 9.4), and either reading counts.
- id: increases-most-common
  statement: Monophasic increases are the most common form of response in both GPi and VLa (48.7%
    and 65.3% of responses), and increases make up most detected changes (61.5% and 68.8%,
    biphasic responses counted twice), more than decreases (chi-squared p = 1.2e-17).
  source: Results, Movement-related increases in firing are common in both GPi and VLa, paragraph 3;
    Table 1; Fig 2B
  quote: Monophasic increases were the most common form of response both in GPi and in VLa (48.7%
    and 65.3% of responses detected, respectively; Table 1). ... increases in firing were also more
    common than decreases both in GPi and in VLa (61.5% and 68.8% of changes, respectively
  statistics:
  - test: chi-squared
    p: 1.2e-17
  expected:
  - quantity: GPi monophasic increases, percent of responses
    value: 48.7
    tolerance: 4.87
  - quantity: VLa monophasic increases, percent of responses
    value: 65.3
    tolerance: 6.53
  - quantity: GPi increases, percent of changes
    value: 61.5
    tolerance: 6.15
  - quantity: VLa increases, percent of changes
    value: 68.8
    tolerance: 6.88
  criterion: Over unit-directions with a response. Reproduced when monophasic increase is the most
    common of the four forms in both areas, increases exceed 50% of changes in both areas, and all
