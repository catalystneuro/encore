- id: integrated-change-positive
  statement: The mean integrated change in firing over the peri-movement epoch is positive in both
    GPi and VLa (3.89 and 1.75 spikes), significantly different from zero.
  source: Results, Movement-related increases in firing are common in both GPi and VLa, paragraph 4;
    Table 1
  quote: This inclination toward increases was confirmed quantitatively by integrating changes in
    firing rate from baseline across the peri-movement epoch individually for each neuron. The mean
    of this integrated change was positive both for GPi and VLa
  statistics:
  - about: GPi
    test: rank sum
    statistic: z = 7.37
    p: 1.7e-13
  - about: VLa
    test: rank sum
    statistic: z = 6.59
    p: 4.7e-11
  expected:
  - quantity: GPi mean integrated change
    value: 3.89
    tolerance: 0.389
    unit: spikes
  - quantity: VLa mean integrated change
    value: 1.75
    tolerance: 0.175
    unit: spikes
  criterion: Over unit-directions (Fig2_3_S8_S9.m). Reproduced when both means are positive with a
