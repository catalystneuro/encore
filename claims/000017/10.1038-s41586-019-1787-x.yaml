# Claims for Steinmetz, Zatka-Haas, Carandini & Harris (2019), Nature 576, 266-273, "Distributed
# coding of choice, action and engagement across the mouse brain", on dandiset 000017.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21, protocol
# pilot-10 as stated in docs/protocol.md.
#
# Text read: the accepted author manuscript as served by Europe PMC (PMC6913580, UKPMC Funders
# Author Manuscripts), with the main text, Methods, Extended Data figure legends, Extended Data
# Table 1 and the figure legends. Both supplement files from the PMC Open Access data were read:
# supplement 1 (Supplementary Information guide, Supplementary Tables 1 and 2, legends of
# Supplementary Figs. 1 to 4) and supplement 2 (Supplementary Discussion and the same tables and
# legends). The "±" of the Supplementary Fig. 2 legend is lost in the text ("d'=0.350.04"); the
# Word file holds a Symbol-font "±" there (0.35 ± 0.04 and 0.10 ± 0.02). Supplementary Table 3 is
# only an image and was not read. No PDF was opened. In Extended Data Table 1 the text prints VISl
# and VISrl as "VISI" and "VISrI".
#
# Code read: github.com/nsteinme/steinmetz-et-al-2019 at commit 9a0bea8 (2021-08-09, head of
# master). It holds the reduced-rank kernel regression (reducedRankRegression/: kernelFitBasic.m,
# regFullPipeline.m, determineResidualsWithout.m, predictResidualsWith.m, CanonCor2all.m,
# KernelModel.m, KernelEventSeries.m), the trial movement classification (behavior/findMoveTimes.m),
# jPECC (jPECC/jPECC.m), the ccCP shuffle (ccCP/choiceProbShuf.m, mannWhitneyUshuf.m), data browsers
# and plotting, and per-session arrays of included trials (behavior/inclusionData/trials,
# hasLeft/hasRight/hasNone, 39 sessions, 1,971 + 1,729 + 2,869 of 10,050 trials) and included units
# (behavior/inclusionData/neurons, 18,248 of 48,661 units). The paper does not say which selection
# these arrays hold; an author may compare its selections with them, through a link claim. The code
# holds nothing for the passive-context, engagement index, nested ANOVA, GLM, Focality index,
# Fisher tests or population decoding. regFullPipeline.m opens with a note by its author that the
# evaluation window should be fixed and the script re-run; it is the only pipeline given. The wheel
# movement detector is cortex-lab/wheelAnalysis +wheel/findWheelMoves3.m (Methods link), not read.
# The data were also deposited on figshare, doi:10.6084/m9.figshare.9598406 (Data availability).
#
# The data the paper used. 10 mice (6 female, 4 male; Supplementary Table 1 names Cori, Forssmann,
# Hench, Lederberg, Moniz, Muller, Radnitz, Richards, Tatum, Theiler), 11 to 46 weeks old, 39
# sessions (Supplementary Table 2 gives date, age and areas of each), 92 Neuropixels insertions,
# all in the left hemisphere, 2 or 3 probes at a time. 29,134 neurons, 22,458 of them in 42 brain
# regions (Extended Data Table 1). Task (Methods, Two-alternative unforced choice task) with left and
# right Gabor stimuli of zero or one of three contrasts (low, medium, high); wheel turns left or
# right, or no turn (NoGo); a go cue tone 0.5 to 1.2 s after stimulus onset; water reward or white
# noise feedback. After each session a passive replay of the task stimuli (visual stimuli, beeps,
# noise bursts, valve clicks) and sparse noise receptive field mapping. Measured variables. Spike
# times and clusters with curation labels, channel brain locations, wheel position (rotary encoder),
# lick piezo, eye video (pupil area by DeepLabCut), face/body video (motion energy), trial events
# (stimulus onset, contrasts, go cue, response, feedback), passive stimulus events. Histology of the
# DiI tracks.
#
# Definitions used by several criteria, each from the paper or its code as cited.
# - Contralateral. All recordings are in the left hemisphere (Methods, Neuronal recordings), so the
#   contralateral stimulus is the right one and a contralateral choice is a Right choice (the turn
#   that brings the right stimulus to the centre).
# - Trials T. Left and Right choice trials have the onset of a turn reaching 90 d.v.a. between 125
#   and 400 ms after stimulus onset; NoGo trials have no movement from -50 to 400 ms; trials with
#   other movements are dropped (Methods, Training protocol). Movement onsets by the findWheelMoves3
#   algorithm (Methods). Disengaged trials are dropped (a Miss preceded by two or more Misses, and
#   the run of NoGo trials at the end of the session). Sessions need at least 12 trials of each of
#   Left, Right and NoGo. The code (kernelFitBasic.m, findMoveTimes.m) takes the first movement after
#   stimulus onset minus 0.1 s and before feedback, and counts a trial as NoGo only when such a
#   movement exists outside -0.05 to 0.4 s; a trial with no movement at all before feedback is then
#   dropped. This differs from the Methods; the Methods rule is used, the code rule is a variant.
#   For NoGo trials a movement time is drawn at random from the Left and Right trials' movement
#   times when one is needed (Methods, Population decoding; findMoveTimes.m).
# - Neurons N. Units curated as single units (not multi-unit; code sp.cgs > 1), trial firing rate
#   (stimulus onset to 0.4 s) at least 0.1 Hz, at least 13 such neurons in the same region in the
#   same session, regions recorded in at least two subjects (Methods, Data analysis). The set for
#   Figs. 3 to 5 also needs p < 0.05 on any of tests 1 to 4 of the six responsiveness tests (Methods,
#   which define the tests and windows). "Active during the task" is any of the six tests below
#   0.05/6. The code keeps a neuron when a test returns NaN (comment "this is a BUG", kernelFitBasic.m,
#   about 1000 neurons); that is a variant.
# - Kernel test K (Methods, Kernel regression and Determining individual neuron selectivity; code as
#   named). Spikes in 5 ms bins, smoothed with a causal half-Gaussian of s.d. 25 ms; each neuron's
#   mean rate from -0.2 to 0 s before stimulus onset is subtracted (code). Six Vision kernels (left
#   and right, low, medium, high contrast), -0.05 to 0.4 s from stimulus onset (90 bins); an Action
#   kernel and a Choice kernel (event value +1 Left, -1 Right, code) at every Left or Right
#   movement onset, -0.25 to 0.025 s (55 bins); Toeplitz predictors and an intercept. Samples from
#   0.05 s before stimulus onset to the earlier of 0.4 s after it and 0.025 s after movement onset
#   (code). Reduced-rank regression basis from all neurons of all sessions together
#   (CanonCor2all.m), first 200 columns kept. Full model per neuron: elastic net, alpha 0.5, lambda
#   0.5 fixed (Methods; code calls glmnet with its default options, useCVG false), 5-fold
#   cross-validation over trials, 1 to 50 components, the best cross-validated variance explained
#   (VE) kept, VE taken over samples from stimulus onset to the earlier of movement onset and 0.4 s
#   (code). Neurons with full-model VE < 2% are dropped. Nested test for kernel K: a new basis from
#   the model without K over the kept neurons, each neuron fit with 75 components on all its data,
#   residuals taken; a new basis for K alone on the residuals; 10-fold cross-validation over trials,
#   1 to 18 components, best VE, over samples 0.05 to 0.4 s after stimulus onset (ending at movement
#   onset) and -0.2 to 0 s from movement onset (code evalWins). The neuron requires K when VE > 2%.
#   Contralateral Vision is the three right-stimulus kernels.
# - Matched contrast M (Methods, Training protocol). Trials with contralateral contrast > 0, split
#   by contralateral contrast; at each level the smallest of the counts of Go (Left or Right), NoGo
#   and passive trials is drawn at random from each; sessions with fewer than 10 such trials are
#   dropped (34 of 39 kept). The Methods do not say whether "fewer than 10" counts the trials of one
#   group or all three.
# - Responsive in a condition R (Methods, Data analysis, paragraph on Fig. 2d-h and Fig. 5b). The
#   mean rate 0 to 0.25 s after stimulus onset over the condition's trials, z-scored against the
#   trial-by-trial baseline (-0.1 to 0 s); significant when z > 4 or z < -4, "equivalent to a
#   two-sided t-test at p<10-4". Open is the z denominator. Readings Z1, the standard error of the
#   baseline mean (s.d. over trials divided by the square root of the trial count), which matches the
#   t-test the Methods name; Z2, the s.d. of the trial baselines.
# - Region groups (code utils/brainRegionGroups.m and Methods). Frontal for choice timing and jPECC
#   MOs, MOp, PL; midbrain MRN, SCm, SNr, ZI; striatum CP; VIS VISp, VISpm, VISl, VISrl, VISa, VISam.
#   Neocortex is the Allen isocortex areas recorded (ACA, ILA, MOp, MOs, ORB, PL, RSP, SSp and the VIS
#   areas). Visual thalamus is LGd, LP, LD (Extended Data Fig. 6b legend).
# - Random draws (folds, matched-contrast subsets, shuffles) take a fixed seed, a standard choice.
# Where the readings of a claim give different outcomes, the claim is blocked as
# methods_underspecified with every result shown.
