- id: ed7b-detect-probability-widespread
  statement: Neurons with significant detect probability (Go against NoGo for the same stimulus)
    around movement onset are found widely across regions, replicating the global action signal.
  source: Extended Data Fig. 7b legend; Methods, ccCP and Detect Probability analysis
  quote: Percentage of neurons in each area with significant Detect Probability measured around
    movement onset, replicating the finding from Fig 2d,e and Fig 3e that non-selective action
    signals are distributed widely
  criterion: ccCP algorithm of the Methods and choiceProbShuf.m, Go (Left or Right) against NoGo
    trials (T) within each of the 16 stimulus conditions, 2,000 within-condition label shuffles; a
    neuron is significant when its rank among shuffles puts it below 0.025 or above 0.975 (chance
    5%, the dashed line of the legend). Sessions with fewer than 10 includable trials left out. NoGo
    trials take a movement time drawn from the Go trials (definition T). The window "around
    movement onset" is open; readings (a) -0.1 to 0.05 s (the pre-movement window of test 3);
    (b) -0.05 to 0 s (the choice decoding window). Regions are marked when the 95% binomial
    interval of the fraction (Clopper-Pearson, a standard choice) excludes 5%. Reproduced when at
    least three quarters of regions are marked above chance under one reading.
- id: ed7c-choice-probability-restricted
  statement: Neurons with significant choice probability around movement onset are restricted to
    frontal cortex, basal ganglia, midbrain and certain thalamic nuclei; six sessions were
