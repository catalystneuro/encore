- id: fig4b-choice-regions
  statement: Choice-selective neurons were rare and found in frontal cortex (MOs, PL, MOp), basal
    ganglia (CP, SNr), higher-order thalamus, SCm, MRN and ZI, but not in VISp; 54 were in the
    midbrain (MRN, SCm, SNr, ZI) and 48 in the forebrain (MOs, PL, MOp, CP).
  source: Results, Forebrain and midbrain choice coding, paragraphs 1 and 3; Fig. 4b
  quote: These neurons were rare, and were found in frontal cortex (MOs, PL, and MOp), basal ganglia
    (CP, SNr), higher-order thalamus, motor-related superior colliculus (SCm), as well as two
    subcortical nuclei which unexpectedly contained neurons selective for choice (MRN and ZI ...
    but choice-selective neurons were not found in VISp
  expected:
  - quantity: choice-selective neurons in midbrain (MRN, SCm, SNr, ZI)
    value: 54
    tolerance: 5.4
  - quantity: choice-selective neurons in forebrain (MOs, PL, MOp, CP)
    value: 48
    tolerance: 4.8
  criterion: Kernel test K for the Choice kernel, as in fig3d-vision-localized. Higher-order
    thalamus is the thalamic regions other than LGd, VPL, VPM and MG. Reproduced when both counts are
