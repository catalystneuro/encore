  source: Results, Forebrain and midbrain choice coding, paragraph 3; Fig. 4e-g
  quote: In midbrain (MRN, SCm, SNr, and ZI) nearly all choice-selective neurons (53/54, 98%)
    preferred contralateral choices ... with a sizeable proportion preferring ipsilateral choices
    (19/48, 40%, significantly more than in the midbrain
  statistics:
  - test: Fisher's exact test
    p: 1.0e-5
    p_relation: "<"
    n: 54 midbrain and 48 forebrain choice-selective neurons
  expected:
  - quantity: midbrain choice-selective neurons preferring contralateral choices
    value: 98
    tolerance: 9.8
    unit: percent
  - quantity: forebrain choice-selective neurons preferring ipsilateral choices
