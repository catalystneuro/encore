- id: fig4fg-opposed-activity
  statement: Many midbrain choice-selective neurons (29/54, 54%) increased before one choice and
    were suppressed below baseline before the other, against 10/48 (21%) in the forebrain.
  source: Results, Forebrain and midbrain choice coding, paragraph 3; Fig. 4f,g
  quote: Many midbrain choice-selective neurons, moreover, exhibited directionally-opposed activity
    ... (10/48, 21% suppressed for non-preferred choice, significantly less than in the midbrain
  statistics:
  - test: Fisher's exact test
