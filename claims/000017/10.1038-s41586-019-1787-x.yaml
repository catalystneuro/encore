- id: ed5h-choice-shuffle-fpr
  statement: With Left and Right choice labels shuffled, 14 neurons (0.33%) passed the Choice kernel
    test, the false-positive rate of the test.
  source: Extended Data Fig. 5h legend; Methods, Estimation of false positive rate
