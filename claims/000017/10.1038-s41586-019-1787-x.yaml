  criterion: Per recording, the Pearson correlation over neurons between the engagement vector
    (task minus passive pre-stimulus rate) and the Go minus Miss vector, and between the engagement
    vector and each other variable's vector. Open; each variable's vector, readings (a) the
    difference of pre-stimulus rates between trials above and below the variable's median (for
    previous reward, rewarded minus not); (b) each neuron's regression slope on the variable; the
    test across recordings, readings (a) paired t-test, (b) Wilcoxon signed-rank. Variables are
    pupil area, motion energy, inter-trial interval and previous reward. Reproduced when, under one
    reading, the Go-Miss correlation is larger on average for all four and the difference has p <
    0.05 for pupil, motion energy and inter-trial interval.
  depends_on:
  - fig5f-engagement-index
