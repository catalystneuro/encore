    a count does not. The VISp count is reported with the count the 0.33% false-positive rate
    predicts.
- id: fig4c-choice-timing
  statement: The time course of choice decoding did not differ between frontal cortex, striatum and
    midbrain (two-way ANOVA on area and time, no effect of area and no interaction).
  source: Results, Forebrain and midbrain choice coding, paragraph 2; Fig. 4c; Methods, Population
    decoding
  quote: the time course of choice decoding could not be statistically distinguished between
    choice-selective regions in frontal cortex, striatum, and midbrain (two-way ANOVA on brain
    region and time, interaction p > 0.05
  statistics:
  - about: time
    test: two-way ANOVA
    statistic: F = 10.43, 50 d.f.
    p: 1.0e-71
    p_relation: "<"
  - about: area; the Methods print "p<0.05" while calling the effect not significant, the Fig. 4c
      legend gives p>0.05
    test: two-way ANOVA
    statistic: F = 0.28, 2 d.f.
    p: 0.05
    p_relation: "<"
  - about: interaction of time and area
    test: two-way ANOVA
    statistic: F = 0.12, 100 d.f.
    p: 0.05
    p_relation: ">"
    n: 29 frontal (MOs, PL, MOp), 29 midbrain (SCm, MRN, SNr, ZI) and 5 striatum (CP) populations
  expected:
  - quantity: frontal populations
    value: 29
    tolerance: 2.9
  - quantity: midbrain populations
    value: 29
    tolerance: 2.9
  - quantity: striatum populations
    value: 5
    tolerance: 0.5
  criterion: Residual rates from the model without the Choice kernel (kernel test K, code
    determineResidualsWithout "moveLR"), Left against Right choice trials; an L1-regularized
    logistic regression on the residuals -0.05 to 0 s from movement onset of training trials; test
    trials' residuals at each time projected on its weights; the score is the mean projection on
    Left minus Right test trials (Methods). One population per area per recording; each score is
    divided by its area's mean across recordings at choice time (movement onset). A claim of
    absence, judged on the paper's test, a two-way ANOVA with factors time and area group (frontal,
    midbrain, striatum), at alpha 0.05. Time has 51 levels (50 d.f.). Open details, each a reading
    the notebook runs; (a) times -0.25 to 0 s from movement onset in 5 ms steps (the Choice kernel
    support and bin) or (b) -0.2 to 0.05 s; folds (a) 5-fold or (b) 10-fold over trials; L1
    strength (a) chosen by inner cross-validation or (b) the library default. Reproduced when the
    interaction and area effects both have p > 0.05; not reproduced when either has p < 0.05. The
    F values and the effect sizes are reported.
  depends_on:
  - fig4b-choice-regions
- id: fig4d-jpecc-vis-leads
  statement: In jPECC, visual cortex activity leads frontal cortex activity by about 40 ms in the
    period about 200 ms before movement, and visual cortex leads frontal cortex and midbrain at about
    100 ms after stimulus onset.
  source: Fig. 4d legend; Extended Data Fig. 8d legend; Methods, jPECC analysis
  quote: population activity in visual cortex predicts that in frontal cortex following a ~40 ms
    lag, but only in the period ~200ms prior to movement
  criterion: jPECC as in the Methods and jPECC.m. Recordings with neurons of both groups (VIS,
    Frontal, Midbrain); spike counts in 10 ms bins, causal half-Gaussian of s.d. 25 ms, divided by
    baseline + 1 sp/s; per group and time bin PCA to 10 dimensions (fewer if the group has fewer
    neurons); 10-fold over trials; CCA on training PCs with L2 regularization lambda 0.5 (rows
    lambda times identity appended, as jPECC.m); Pearson r of test projections on the first
    canonical pair, for each pair of time bins. Asymmetry index at t, the mean r along the slice
    from (t, t) to 50 ms of lead of the first group minus the mean along 50 ms of lead of the
    second; across recordings a t-test against 0 at each t, alpha 0.05 (the paper names no
    correction). Open; the baseline window, readings (a) -0.2 to 0 s and (b) -0.1 to 0 s before
    stimulus onset; the trials, readings (a) all trials T for stimulus alignment and Left and Right
    choice trials for movement alignment, (b) Left and Right choice trials for both. Reproduced
    when, under one reading, VIS leads Frontal at time points between -0.2 and -0.05 s from
    movement onset and VIS leads Frontal and Midbrain near 0.1 s after stimulus onset.
- id: fig4d-jpecc-no-lag-frontal-midbrain
  statement: Population activity in midbrain and frontal cortex shows no consistent lead or lag.
  source: Results, Forebrain and midbrain choice coding, paragraph 2; Fig. 4d; Extended Data Fig. 8
  quote: it revealed no lag for activity correlations between frontal and midbrain areas
  criterion: A claim of absence, judged on the paper's test, the t-test across recordings of the
    Frontal-Midbrain asymmetry index against 0 at each time point (as fig4d-jpecc-vis-leads, same
    readings of the open details), alpha 0.05 uncorrected as the paper gives it. Reproduced when no
    time point from -0.25 to 0 s from movement onset is significant; not reproduced when any is.
    The mean index and the count of significant points are reported, with a Bonferroni variant.
- id: fig4f-contralateral-preference
