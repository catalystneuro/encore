  statement: Reaction times were longer in the harder conditions (low-contrast single stimuli and
    competing stimuli of similar contrast) than for high-contrast single stimuli.
  source: Results, Brain-wide recording in visual behavior, paragraph 1; Fig. 1d
  quote: As expected, in these more challenging cases reaction times were longer ... multi-way ANOVA
