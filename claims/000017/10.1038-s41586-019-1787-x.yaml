  source: Results, Brain-wide recording in visual behavior, paragraph 1; Fig. 1c,d
  quote: Their choices were most accurate for high-contrast single stimuli (i.e. when the other
    stimulus was absent; 1.7 ± 2.5% incorrect choices, i.e. turns in the wrong direction; 10.1 ±
    8.3% Misses, i.e. failures to turn; mean ± s.d., n = 39 sessions, 10 mice)
  expected:
  - quantity: incorrect choices, high-contrast single stimulus, mean over sessions
    value: 1.7
    tolerance: 2.5
    unit: percent of trials
  - quantity: Misses, high-contrast single stimulus, mean over sessions
    value: 10.1
    tolerance: 8.3
    unit: percent of trials
  criterion: Trials with the high contrast on one side and zero on the other. Per session, the
