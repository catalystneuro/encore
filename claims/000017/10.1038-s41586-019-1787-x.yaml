    condition, session and neuron nested in session (Methods); (b) condition, session and subject
    (legend). Task trials are trials T; passive trials are open, readings (a) all passive replay
    events; (b) passive visual stimulus presentations. A region differs when the condition p <
    0.0012 (0.05 over 42 regions). Reproduced when, under one reading, every differing neocortical
    region is lower in the task, every differing non-neocortical region other than visual thalamus
    (LGd, LP, LD) is higher, VISp differs and is lower, and CP differs and is higher.
