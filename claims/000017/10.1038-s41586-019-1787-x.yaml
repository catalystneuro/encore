- id: ed1q-wheel-choice-decoding
  statement: Choice decoded from instantaneous wheel velocity is at chance (47.7%) 50 ms before
    detected movement onset and near perfect (94.6%) 50 ms after it.
  source: Methods, Training protocol, paragraph 3; Extended Data Fig. 1q
  quote: The decoder performed essentially at chance 50 ms prior to movement onset (47.7%) compared
    to near perfect performance 50 ms after movement onset (94.6%)
  expected:
  - quantity: decoding accuracy 50 ms before movement onset
    value: 47.7
    tolerance: 4.77
    unit: percent
  - quantity: decoding accuracy 50 ms after movement onset
    value: 94.6
    tolerance: 9.46
    unit: percent
  criterion: Velocity is the wheel position at t minus that at t - 10 ms (Methods), at times
    relative to the detected onset of Left and Right choice movements. The paper does not name the
    decoder. Readings (a) the sign of the velocity, a zero velocity counting as a guess (50%);
