    p: 0.05
    p_relation: "<"
  expected:
  - quantity: Focality index, Choice
    value: 0.079
    tolerance: 0.0079
  - quantity: Focality index, Contralateral Vision
    value: 0.069
    tolerance: 0.0069
  - quantity: Focality index, Action
    value: 0.040
