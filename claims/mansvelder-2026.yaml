- id: fig2d-sst-similar
  statement: SST interneurons show similar fractions of resonant cells in human and mouse.
  source: Results, Human interneurons show widespread and stronger resonance, paragraph 3; Fig. 2d
  quote: In contrast, SST (p = 0.544) interneurons exhibited similar fractions of resonant cells
