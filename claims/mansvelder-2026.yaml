# Claims for Shamugia, Weiler, ... Goriounova & Mansvelder (2026), "Ion Channels and Morphology
# Drive Widespread Resonance in Human Cortical Interneurons", Research Square preprint
# doi:10.21203/rs.3.rs-11136357/v1, tested on dandiset 000630.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-11-22, protocol pilot-18 as stated in docs/protocol.md (Reader).
#
# Text read. The preprint, version 1 (posted 2026-10-12), as text
# (paper/10.21203-rs.3.rs-11136357-v1.txt): main text, Methods, Quantification and Statistical
# Analysis, and the legends of Figures 1 to 8. The supplement
# (paper/10.21203-rs.3.rs-11136357-v1.supp-Supplementary_Information.pdf, 56 pages) is in the
# text file only up to Supplementary Table 2b; the text file is cut there. The rest of the PDF
# (Supplementary Table 3, statistical tests, pages 38 to 52; Table 4, the donors of the blocker
# experiments, page 53; Table 5, model parameters, pages 54 to 55; the end of the Fig. S6
# legend, page 56) was read from the PDF's own text layer (extracted with pypdf 7.1.1), since no
# page could be rendered. Statistics and medians taken from Table S3 cite it; they cannot be
# quoted, as the checker reads the text file only, and tools/claims_check.py flags their
# p-values as not found; each was confirmed against the PDF's text layer. No figure was opened (the main-text PDF is
# not under paper/, and the supplement PDF could not be rendered), so the Fig. 3b schematic of
# sag ratio and input resistance was not seen.
#
# Code read. The paper's code is given as github.com/nsham2/Shamugia_et_al_2026 (key resources
# table; "Original code will be made available at" the same address under Open Access data and
# code Availability). On 2026-11-22 that address returned HTTP 404 and the user nsham2 had no
# public repository of that name, so no analysis code was read. The software the Methods name
# for feature extraction, IPFX (key resources table, v2.0.0), was read at tag v2.0.0 (commit
# 1ddc0e5): subthresh_features.sag ((v_peak - v_steady) / (v_peak - v_baseline), peak averaged
# over 5 ms, baseline and steady state over 30 ms), the long-square analysis that reports the
# sag of the hyperpolarizing sweep whose peak deflection is closest to -100 mV
# (stimulus_protocol_analysis.py, SAG_TARGET), subthresh_features.input_resistance (least-squares
# slope of peak deflection against current over the hyperpolarizing sweeps), and
# chirp.chirp_amp_phase (chirp sweeps averaged, downsampled to 2 kHz, FFT over 0.6 to 20.6 s,
# |Z| = |FFT(V)/FFT(I)| kept from 0.2 to 40 Hz, no smoothing). IPFX is cited, not the paper's
# own code, so it is used only for details the Methods leave open, as a named reading.
#
# Data the paper used (Results, first section; Methods; Tables S1 to S4). Patch-seq
# recordings of human and mouse cortical GABAergic interneurons: 1085 human interneurons from
# 259 subjects (542 acute from 170 donors, 543 in organotypic slice culture from 89 donors) and
# 619 acute mouse interneurons from 293 mice (the Methods say 224 donors and 292 mice). Most
# human data are from Lee, Dalley et al. 2023 (ref. 2) and Chartrand et al. 2023 (ref. 27,
# cited by the DOI of this dandiset); 21 new patients (12 at the Allen Institute, 9 at VU
# Amsterdam). Table S1 lists every human donor with its dataset ("Chartrand", "AcuteLDPublished",
# "PublishedLD_Cultured" and others), area, disease, sex, age and hemisphere; Table S2 lists the
# mice and their cell specimen IDs and Cre lines. Human tissue from temporal, frontal, parietal
# and occipital cortex resected for epilepsy or tumour. Subclasses LAMP5 (LAMP5/PAX6/Other), VIP,
# PV and SST, from the MTG taxonomy with Patch-seq updates (SST FRZB counted as PV); mouse
# subclasses from transcriptomic alignment or Cre line. Measures per cell: the response to a
# chirp (constant amplitude, logarithmic sweep 0.4 to 40 Hz over 20 s, about +/- 5 mV, cell
# biased to -65 mV), giving the impedance profile, peak resonance frequency fres, 3 dB cutoff
# f3dB and resonance strength Q = Zmax/Z0; sag ratio and input resistance from hyperpolarizing
# steps; baseline membrane potential Vm; pia-soma distance; total dendritic length for
# reconstructed cells; Patch-seq gene expression (CPM). A resonant cell has fres > 1 Hz and
# Q > 1.05. Chirp samples: 297 human acute (LAMP5 144, VIP 60, PV 78, SST 15) and 248 mouse
# (LAMP5 120, VIP 49, PV 36, SST 43; the Fig. 2b legend says 268), 268 human cultured (LAMP5 21,
# VIP 28, PV 125, SST 94, Fig. 5f). Also: ZD7288 (10 uM) wash-in on seven human interneurons
# (Table S4 lists 8 cells exposed to ZD7288 from 5 donors) and 13 mouse cells from 9 mice; Allen
# Brain Map single-nucleus SMART-seq (human MTG 2018, 4164 nuclei from 8 donors; mouse VISp and
# ALM 2018, 10534 cells from 210 mice); and NEURON models of a fast-spiking PV interneuron
# adapted from Wilbers et al. 2023 (DataverseNL doi:10.34894/TONOHA), parameters in Table S5.
#
# Where the data are. This dandiset ("Human L1 patch-seq electrophysiology", version
# 0.230915.2257, 53 subjects, human only) holds the NWB electrophysiology of Chartrand et al.
# 2023, which is a part of this paper's human acute sample (layer 1 interneurons, mostly of the
# LAMP5 subclass). It holds no mouse, cultured or blocker recordings, no transcriptomes and no
# morphologies. This paper's per-cell subclass assignment, Vm, pia-soma distance and gene
# expression are not given with the paper; claims that need subclass labels only are
# `with_labels`, claims that test the dandiset's recordings together with other per-cell data
# or other recordings are `with_inputs`. Claims that use none of the dandiset's recordings
# (mouse only, ZD7288, transcriptomes or morphologies alone) keep the default `dataset`: the
# paper names no public source for those data (ref. 2 is a human study, and ref. 27 is cited by
# this dandiset's DOI), so they are blocked as data_missing unless the author finds them
# public; Table S2 gives the mouse cell specimen IDs.
# The paper says "Most of the data used in this paper is already open source" (refs 2 and 27)
# and "The remaining data will be made available upon request"; it names no archive for the
# mouse recordings, the cultured recordings, the Lee et al. 2023 recordings or the Patch-seq
# transcriptomes. The new human recordings (including the ZD7288 experiments) are not public.
# The Allen Brain Map reference data and the base model are public (`elsewhere`).
#
# Open details, and the readings named for each (criteria refer to these).
#  - O1, chirp analysis. The Methods give the FFT ratio, LOWESS smoothing, fres at Zmax, f3dB
#    where Z falls to Zmax/sqrt(2), and Q = Zmax/Z0, "Z0" being "the impedance at the lowest
#    frequency" (Results, first section). They do not give the LOWESS fraction for recordings,
#    the FFT window, the frequency range searched, or which side of the peak f3dB is taken on.
#    Readings: (a) IPFX v2.0.0 chirp_amp_phase (sweeps averaged, as Fig. 1a says "From an
#    averaged CHIRP sweep"), then LOWESS with frac 0.04 (the value the Methods give for the
#    model chirp), Z0 at the lowest frequency kept, Zmax searched over the kept range, f3dB the
#    frequency above the peak where the smoothed Z first falls below Zmax/sqrt(2); (b) as (a)
#    with the profile restricted to the stimulus band 0.4 to 40 Hz. The paper's per-cell values
#    are not public, so neither reading can be checked against them.
#  - O2, sag ratio. Not defined in the text; Fig. 3b shows a schematic that was not seen. The
#    representative traces use -100 pA (Fig. 5a), -110 pA (Fig. 5f) and -150 pA (Fig. S3i).
#    Readings: (a) IPFX v2.0.0 sag on the hyperpolarizing long square whose peak deflection is
#    closest to -100 mV; (b) the same formula on the -100 pA step, or the nearest step to it.
#  - O3, input resistance. Not defined in the text (Fig. 3b schematic not seen). Readings: (a)
#    IPFX v2.0.0 input_resistance over the hyperpolarizing long squares; (b) steady-state
#    deflection over current for the step used in O2(b).
#  - O4, Vm covariate. "baseline membrane potential differences (Vm)" (Quantification and
#    Statistical Analysis). Readings: (a) the mean pre-stimulus membrane potential of the chirp
#    sweeps; (b) the resting potential IPFX reports for the cell. A model without Vm is shown as
#    a variant.
#  - O5, mixed models. Type III Wald F-tests with Satterthwaite degrees of freedom, random
#    intercept for donor, run in SPSS or Python (which for which is not said). Readings: (a)
#    REML linear mixed model with Satterthwaite F-tests (SPSS MIXED, or lmerTest); (b)
#    statsmodels MixedLM with Wald tests on the same terms. The paper confirmed its models with
#    generalized estimating equations (exchangeable correlation within donor is not stated; use
#    it, a standard choice), shown as a variant. Post-hoc species or preparation contrasts are
#    two-sided Mann-Whitney U tests per subclass, uncorrected (no correction is stated).
#  - O6, chi-square tests of proportions. The Methods say expected counts for human acute cells
#    came from the mouse counts, and for cultured cells from the acute counts (goodness of fit).
#    Table S3's per-subclass values (Fig. 2d) are reproduced by that goodness-of-fit test, but
#    its overall values (Fig. 2c, 43.05 with 297 human and 248 mouse cells; Fig. 5i, 44.98 with
#    268 cultured and 297 acute cells) are reproduced by a 2x2 Pearson test without continuity
#    correction (checked by hand from the counts). Readings: (a) goodness of fit against the
#    reference group's proportion; (b) 2x2 Pearson test without correction. The per-subclass
#    values of Fig. 5i are also reproduced by reading (a), with cultured counts LAMP5 13 of 21,
#    PV 104 of 125, SST 39 of 94 and VIP 7 of 28 (163 of 268, 60.8%); VIP then gives chi-square
#    0 and p = 1 (checked by the second reader).
#  - O7, ZD7288 sample. The text says seven human interneurons; Table S4 lists 8 exposed to
#    ZD7288. With n = 7 an exact two-sided Wilcoxon signed-rank test cannot give p = 0.004 (its
#    floor is 0.016), nor can n = 8 (floor 0.008), while 9 cells can; p = 0.031 is the floor for
#    6 cells, or 7 cells with one discordant pair of rank 1. So the cells per measure are not
#    all seven and are not stated. Readings: (a) all cells with both a baseline
#    and a ZD7288 value for the measure; (b) the cells with all four measures.
#  - O8, gene-resonance correlations. Pearson correlations on cells with CPM > 1, over "a
#    subset of prevalent genes", BH-FDR per preparation. Table S3 lists the acute family: 10
#    genes (KCNJ16, HCN1, CACNA1A, KCNQ3, SCN8A, KCNQ5, KCNH7, SCN1A, KCNQ2, CACNA1G) by 2
#    measures (Q, fres). The scale of expression is not stated. Readings: (a) CPM; (b)
#    log(CPM + 1).
#  - O9, Fig. 4b regression. The legend says "Fixed: pia-soma distance", Table S3 says "Fixed:
#    TDL" with an intercept of 1632.017. Readings: (a) TDL on pia-soma distance; (b) pia-soma
#    distance on TDL. Judged on the sign and p of the slope.
#  - O10, text and Table S3 disagree in places; the criteria name both values where it matters.
#    Fig. 2c chi-square 42.76 (text) against 43.05 (table); mouse chirp n 268 (Fig. 2b legend)
#    against 248 (table and Fig. 2e counts); Fig. 2d SST p = 0.544 (text) against 0.499
#    (table); Fig. 2g VIP p < 0.001 (text) against 0.002 (table); Fig. 3e sag by subclass p =
#    0.035 (text) against "0.35" (table, F(3, 254.894) = 2.912, which gives about 0.035); Fig.
#    6c p-values (text) against FDR-corrected values (table, 0.001, 0.038, 0.044, 0.044); Fig. 5l
#    "did not differ" (text) against VIP p = .046 and PV p = .031 (table); the acute medians of
#    Fig. 5j (table) are those of Fig. 2e assigned to other subclasses.
schema_version: 2
paper: doi:10.21203/rs.3.rs-11136357/v1
claims:
- id: sample-size
  statement: The dataset comprises 1085 human interneurons from 259 subjects (542 acute from 170
    donors, 543 cultured from 89 donors) and 619 acutely recorded mouse interneurons from 293
    mice.
  source: Results, Human interneurons show widespread and stronger resonance, paragraph 2; Fig. 1b
  quote: In total, our dataset comprised 1085 human interneurons from 259 subjects (542 acute from
    170 donors; 543 cultured from 89 donors; Table S1, Fig. S1a-b) and 619 acutely recorded mouse
    interneurons from 293 mice
  data: with_labels
  expected:
  - quantity: human acute interneurons
    value: 542
    tolerance: 54.2
  - quantity: human acute donors
    value: 170
    tolerance: 17
  criterion: Counts of human acute interneurons and of their donors in the data the attempt
    assembles, against the paper's. The dandiset holds only part of the human acute sample (the
    Table S1 donors whose dataset is "Chartrand"), so on the dandiset alone this is not
    reproduced; the counts of dandiset subjects found among the Table S1 donors and of dandiset
    cells with a chirp sweep are reported. The cultured and mouse totals are recorded as the
    paper's.
- id: fig2b-human-higher-fres-q
  statement: Human cortical interneurons have higher peak resonance frequencies and resonance
    strengths than mouse interneurons (Kolmogorov-Smirnov tests, p < 0.001 each).
  source: Results, Human interneurons show widespread and stronger resonance, paragraph 3; Fig. 2b
  quote: Human cortical interneurons had higher peak resonance frequencies ... resonance strengths
  statistics:
  - about: fres, human against mouse
    test: two-sample Kolmogorov-Smirnov
    statistic: D = 0.276
    p: 1.32e-09
    n: 297 human and 248 mouse interneurons (Table S3; the Fig. 2b legend says 268 mouse)
  - about: Q, human against mouse
    test: two-sample Kolmogorov-Smirnov
    statistic: D = 0.274
    p: 2.0843e-09
    n: 297 human and 248 mouse interneurons
  data: with_inputs
  criterion: fres and Q per cell from the chirp (O1, each reading). Two-sample two-sided
    Kolmogorov-Smirnov tests, human acute against mouse (Quantification and Statistical
    Analysis). Reproduced when both tests give p < 0.001 and the human median exceeds the
    mouse median for both measures. The dandiset holds only human layer 1 cells; mouse chirp
    data are an outside input the paper does not locate.
- id: fig2ab-peak-range
  statement: Both human and mouse interneurons show resonance peaks roughly in the 2 to 5 Hz
    range.
  source: Results, Human interneurons show widespread and stronger resonance, paragraph 3; Fig.
    2a-b
  quote: We found that both human and mouse interneurons exhibited resonance peaks roughly in the
    2-5 Hz range
  data: with_inputs
  expected:
  - quantity: peak resonance frequency of resonant cells, human and mouse (see criterion)
    value: 3.65
    tolerance: 1.85
    unit: Hz
  criterion: fres under O1, over resonant cells (fres > 1 Hz and Q > 1.05) of each species. The
    paper does not say which summary of the fres distribution the range describes. Readings (a)
    the median fres of resonant cells, per species, lies within 1.8 to 5.5 Hz (the range 2 to 5
    widened by 10% of each bound, written as 3.65 +/- 1.85); (b) the interquartile range of fres of resonant cells, per species,
    lies within 1.8 to 5.5 Hz. The Discussion gives "a clear peak detected between 1 and 6 Hz"
    for human cells; it is reported. The mouse side needs mouse chirp data, which the paper does
    not locate.
- id: fig2c-resonant-proportion
  statement: A larger proportion of human than mouse interneurons are resonant (fres > 1 Hz and
    Q > 1.05), 32.7% against 9.3%.
  source: Results, Human interneurons show widespread and stronger resonance, paragraph 3; Fig. 2c
  quote: proportions of resonant cells (fres> 1Hz and ... Q > 1.05) compared to mouse cortical
    interneurons (32.7% in human vs 9.3% in ... mouse
  statistics:
  - test: chi-square test
    statistic: χ² (1) = 42.76 (text); χ² (1) = 43.05 (Table S3)
    p: 0.001
    p_relation: "<"
    n: 297 human and 248 mouse interneurons (Table S3)
  data: with_inputs
  expected:
  - quantity: resonant fraction, human acute interneurons
    value: 32.7
    tolerance: 3.27
    unit: "%"
  - quantity: resonant fraction, mouse interneurons
    value: 9.3
    tolerance: 0.93
    unit: "%"
  criterion: A cell is resonant when fres > 1 Hz and Q > 1.05 (Results; Quantification and
    Statistical Analysis), with fres and Q under each reading of O1. Proportions over the cells
    with a chirp; the chi-square test under both readings of O6. Reproduced when both fractions
    are within tolerance and the test gives p < 0.001. Table S3's counts (97 of 297 human
    resonant) are the check of the human fraction.
