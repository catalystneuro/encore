- id: fig5d-f-true-above-shuffle-null
  statement: For every protocol pair, the balanced true distance-matrix correlations lie above
    the driver-label shuffle null distribution, which centres near zero.
  source: Results, Protocol-specific response geometries preserve shared cell-group structure,
    paragraph 4; Figure 5C to 5F
  quote: In each case, the true balanced alignments were shifted above driver-label shuffle null
    distributions, showing that the preserved geometry could not be explained by unequal
    sampling or random driver-line assignment.
  criterion: The null permutes driver labels within each balanced sample, keeping the PC scores
    and sample sizes, and recomputes centroids, distances and correlations; empirical p-values
    compare the balanced true correlations with the null (Methods 6). How the p-value is formed
    is not given (open); readings, the fraction of null correlations at or above the median true
    correlation, and that fraction with one added to numerator and denominator. Whether the
    labels are shuffled in one geometry or both is open; both readings are run. Figure 5C marks
    each pair with one or two stars without saying what they mean. Reproduced when, for all six
    pairs, the empirical p is below 0.05 under a reading and the null median is within 0.15 of
    zero (Figures 5D to 5F show null modes near 0).
  depends_on:
  - fig5c-balanced-correlations-positive
