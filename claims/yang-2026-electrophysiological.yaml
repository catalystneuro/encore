# Claims for Yang & Xiao (2026), "Electrophysiological response geometries reveal shared and
# protocol-specific cell-type organization", on dandiset 000020.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-11-27, protocol pilot-18 as stated in docs/protocol.md (Reader).
#
# Text read. The bioRxiv preprint, version 2 (posted 2026-08-20), as text
# (paper/10.64898-2026.01.08.698522.txt): Abstract, Introduction, Results, Discussion, Methods
# (sections 1 to 7), the legends of Figures 1 to 5 and the Data and Code Availability
# statement. The supplement (one PDF, paper/10.64898-2026.01.08.698522.supp.pdf) holds only
# Supplementary Table 1, the list of derived features per protocol; its table body is an image
# and was read from the PDF. Table 1 (feature classes) was read from the main PDF. The text
# reports no number: every value below (cell counts, variance explained, correlations, n) was
# read from the figures in the PDF, and the statistics come from the text printed inside
# Figure 5A, 5B and 4E. Values read off bars or box plots are approximate, and the claims say
# so.
#
# Code read. None. The paper links no code: "The analysis code used in this study will be made
# publicly available upon publication" (Data and Code Availability). No detail below is settled
# by code.
#
# Data the paper used. Intracellular current-clamp recordings from genetically targeted
# (Cre-line labelled) neurons of mouse visual cortex in the Allen Institute Patch-seq resource,
# DANDI 000020, version 0.210913.1639 (Data and Code Availability; Methods 1). Raw NWB files were
# converted to HDF5 holding per sweep the voltage response, the current command, the time
# vector and cell metadata including the Cre line. Cre-line labels are the groups throughout
# ("driver lines", abbreviated in the figures by marker gene). Sweeps were assigned to three
# stimulus families from the stimulus description, the command waveform and the recording
# mode: long pulse (sustained current steps), ramp, and brief pulse; for the brief pulse the
# protocol X5SP_Search_DA_0 was used (Methods 1). Sweeps passed common and protocol-specific
# quality control (Methods 2), and were aggregated to one feature vector per cell and protocol
# (Methods 3; features in Supplementary Table 1). Cells in the PCA geometries (Figure 1C, read
# off the bars): about 2270 long pulse, about 3220 ramp, 2154 brief pulse (the n printed in
# Figure 4E). Driver lines: 9 in the long-pulse and ramp geometries (Sncg, Oxtr, Ndnf, Htr3a,
# Gad2, Slc32a1, Pvalb, Sst, Vip; Figures 2 and 3) and 11 in the brief-pulse geometry (Gad2,
# Htr3a, Ndnf, Oxtr, Pvalb, Sst, Vip, Sncg, Cck, Calb2, Crh; Figure 4). Measured variables: the
# derived features of Supplementary Table 1 (firing rates, spike counts, response fractions,
# first-spiking command, recruitment current, first-spike latency, peak and mean response
# amplitudes, fast-response amplitudes, gain in mV/pA, baseline potential and noise).
#
# Method details the paper fixes. Features standardized and PCA run separately per protocol
# and feature set with scikit-learn (Methods 4, 7); driver-line centroid is the mean PC score
# vector of the line's cells; pairwise Euclidean distances between centroids; the upper
# triangle of each distance matrix over shared driver lines correlated across geometries with
# Pearson and Spearman (Methods 5); balanced resampling draws the same number of cells from
# each retained line within each geometry and recomputes centroids, distances and correlations
# from the PC scores; the null permutes driver labels within each balanced sample; empirical
# p-values compare balanced true correlations against the shuffled-label null (Methods 6).
# PC signs are arbitrary and interpretation is by feature composition (Methods 4).
#
# Method details the paper leaves open (no code to settle them). Each is named in the claims
# that need it, with the readings the text allows:
# - Quality-control thresholds (baseline stability and noise, trace length, ramp linearity,
#   pulse detection); none are given (Methods 2).
# - Spike detection (threshold or dV/dt criterion) and so every spike-based feature,
#   recruitment current and first-spike latency.
# - Which stimulus descriptions define long-pulse and ramp sweeps (only X5SP_Search_DA_0 is
#   named), and the command-amplitude bins of the long-pulse command-binned features.
# - The definitions of fast response, response windows and gain (gain is in mV/pA, Figure 4F).
# - The missingness threshold for dropping features and the imputation statistic (mean or
#   median).
# - The exact membership of each feature set: the sustained-response long-pulse set, the
#   recruitment-focused ramp set, the brief-pulse response-focused, gain-focused and base sets.
# - How many PCs form the space where centroids and distances are computed (all PCs, the five
#   shown in the figures, or PC1 and PC2).
# - Minimum cells for a driver line to be included; how Cre lines sharing a marker gene are
#   pooled; Figure 1D gives 7 lines shared by all three protocols where the figures' labels give
#   8 (the nine long-pulse and ramp lines less Slc32a1).
# - Balanced resampling: cells per line per draw, number of iterations, the exclusion rule for
#   "insufficient representation", and how the empirical p-value is formed; the meaning of the
#   stars in Figure 5C is not given.
