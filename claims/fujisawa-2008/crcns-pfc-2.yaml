  criterion: A claim of absence with no test in the paper. Reading, a chi-square test of shank
    against class (left, right, both, none) in each Figure 3 session, and, as a variant, all
    sessions. Reproduced when no session shows an association at p < 0.05; the effect size
    (Cramer's V) is reported.
- id: position-dependent-transmission
  statement: Of 343 pairs with significant excitatory monosynaptic connections, 67 show
    identifiable position dependence of excess short-latency coincidences.
  source: Results, Behavioral modulation of monosynaptic interactions, paragraph 1; Figure 4b;
    Supplementary Figure 12
  quote: Across all sessions, out of 343 pairs with significant excitatory monosynaptic connections
    in all sessions, 67 pairs showed identifiable position dependence in monosynaptic
    interactions by this measure
  depends_on:
  - connection-counts
  expected:
  - quantity: pairs with significant excitatory monosynaptic connections
    value: 343
    tolerance: 34.3
    unit: pairs
  - quantity: pairs with position-dependent excess coincidences
    value: 67
    tolerance: 6.7
    unit: pairs
  criterion: Position of excess coincidences as in the shared method, at global P < 0.01. Open
    details and readings. Trials are (a) left and right analysed separately, a pair counting when
    either shows dependence, (b) all trials together. Position dependence is (i) a globally
    significant region anywhere, or (ii) a globally significant region together with a part of
    the maze where the pointwise band is not broken. The jitter surrogates jitter every spike of
    both cells (Methods), with jittering the presynaptic cell only (Supplementary Figure 12B) as a
    variant. Reproduced when both counts, or the fraction 67/343 (19.5%, tolerance 2.0 points),
    are within tolerance under one combination.
- id: fig5a-session-selective-connections
  statement: In the layer 2/3 session of Figure 3d, 15 of 36 excitatory connections are active
    selectively in maze segments of left or right trajectories.
  source: Figure 5a legend
  quote: Putative monosynaptic connections that were active selectively in maze segments during
    left or right turn trajectories (15 of 36 excitatory connections; same set of neurons, and
    session, as in Fig. 3d)
  depends_on:
  - position-dependent-transmission
  expected:
  - quantity: excitatory connections in the session
    value: 36
    tolerance: 3.6
  - quantity: connections with position or trajectory selective excess coincidences
    value: 15
    tolerance: 1.5
  criterion: The method and readings of position-dependent-transmission, on the Figure 3d session
    (EE.188 by the data set's description). Reproduced when both counts are within tolerance under
    one combination. Figure 3b reports 48 connections with a pyramidal reference cell in the same
    session; the paper does not say how the 36 relate to them, and the readings that give each are
    reported.
- id: fig4-pair-156-136
  statement: Pair 156-136, on different shanks, keeps steady firing rates between positions 0.2 and
    0.5 on left trials, yet excess short-latency coincidences occur only between 0.4 and 0.6.
  source: Figure 4; Results, Behavioral modulation of monosynaptic interactions, paragraph 2
  quote: cell pair 156-136, recorded from different electrode shanks, maintained steady firing
    rates between maze segments 0.2 and 0.5, yet short-latency coincident spikes significantly in
    excess of firing rate–controlled coincidences (the ‘expected coincidence rate’) occurred only
    between maze locations 0.4 and 0.6
  expected:
  - quantity: start of the significant region
    value: 0.4
    tolerance: 0.04
    unit: normalised position
  - quantity: end of the significant region
    value: 0.6
    tolerance: 0.06
    unit: normalised position
  criterion: Cells 156 (presynaptic) and 136 in the session of Figure 3d, left trials (Figure 4a
    legend), position of excess coincidences as in the shared method at global P < 0.01, extent
    by the pointwise band. Reproduced when the only significant region starts and ends within
    tolerance, and each cell's PSTH between 0.2 and 0.5 varies by less than 50% of its maximum (a
    standard choice for "steady"). Cell numbers are the paper's; whether the data set uses the
    same numbering is the author's to find.
- id: fig5b-example-pairs
  statement: In pair 197-201 transmission is significant only between 0.4 and 0.5 of left trials
    although the expected coincidence rate is as high from 0 to 0.5; pair 49-52 transmits only on
    left trials; pair 186-201 only toward the end of the right arm although expected
    coincidences are higher earlier.
  source: Figure 5b; Results, Behavioral modulation of monosynaptic interactions, paragraph 2
  quote: in pair 197-201, the expected coincidence rate was equally high between maze locations 0
    and 0.5 of the left trials, yet significant spike transmission was detected only between maze
    locations 0.4 and 0.5 (Fig. 5b). In pair 49-52, the expected coincidence rate in the first two
    segments was equally high on left and on right trajectory trials, yet significant spike
    transmission was detected only on left trajectory trials. In pair 186-201, significant
    effects were observed only toward the end of the right arm
  expected:
  - quantity: pair 197-201, start of the significant region, left trials
    value: 0.4
    tolerance: 0.04
    unit: normalised position
  - quantity: pair 197-201, end of the significant region, left trials
    value: 0.5
    tolerance: 0.05
    unit: normalised position
  criterion: As fig4-pair-156-136, in the same session. Reproduced when 197-201 meets its
    expected values on left trials, 49-52 has a significant region on left and none on right
    trials, and 186-201 has its only significant region on right trials beyond position 0.75 (a
    standard reading of "toward the end of the right arm"). Partially reproduced when two of the
    three pairs hold.
- id: thinning-preserves-dependence
  statement: In several pairs, position-dependent transmission remains after spikes are thinned so
    that both cells fire at a flat rate over the region examined.
  source: Results, Behavioral modulation of monosynaptic interactions, paragraph 1; Methods,
    Controlling for power; Supplementary Figure 13
  quote: Applying this approach, we indeed found that in several cases, the conclusion of
    position-dependent synaptic efficacy remained unaltered after thinning
  depends_on:
  - position-dependent-transmission
  criterion: Per the Methods, for a pair and a region with enough firing and differential
    coincidences, spikes are removed one at a time, chosen at random within [-s, +s] around the
    PSTH maximum (s = 0.05, the kernel bandwidth), until the PSTH minimum is within 10% of the
    maximum, for both cells; then the position test of the shared method. The region is open
    (the paper chose it per example); readings (a) positions 0.2 to 0.5 as in Supplementary
    Figure 13A, (b) for each position-dependent pair, the smallest span holding its significant
    region and an equal length of non-significant maze next to it. Thinning is random; ten
    repetitions with fixed seeds. Reproduced when at least two pairs (a standard reading of
    "several", the paper gives no number) keep, in the majority of repetitions, a globally
    significant region and a non-significant part of the region under one reading.
- id: fig6-depression-facilitation
  statement: Comparing first spikes of trains with later spikes, about equal shares of pairs show
    depressing (12.7%) and facilitating (10.7%) spike transmission; 32.2% of the significant pairs
    are on different shanks.
  source: Figure 6c; Results, page 8, paragraph 1
  quote: Among the significant pairs, 32.2% were recorded by different shanks ... we found that
    approximately equal percentages of neuron pairs showed firing pattern–dependent depressing
    (12.7%) and facilitating (10.7%) effects (Fig. 6c)
  depends_on:
  - connection-counts
  expected:
  - quantity: pairs with significant depression
    value: 12.7
    tolerance: 1.27
    unit: percent
  - quantity: pairs with significant facilitation
    value: 10.7
    tolerance: 1.07
    unit: percent
  - quantity: significant pairs on different shanks
    value: 32.2
    tolerance: 3.22
    unit: percent
  criterion: Presynaptic spikes labelled first (preceded by at least 200 ms without spikes) or
    second-and-later (within 40 ms of the previous spike) (Results; Figure 6b legend). For each
    label, the standardized peak height (h minus the jitter mean, over the jitter s.d.;
    Supplementary Figure 9B). Difference of the two heights; labels shuffled for a two-sided
    permutation test at P < 0.10 (Figure 6c legend, Supplementary Figure 16); depression is
    first above later. Open details and readings. Pairs are (a) the 343 excitatory connections,
    (b) all 495 connections. The peak height h is (i) the largest bin in [1, 4] ms, (ii) the sum
    over [1, 4] ms. Whether a later spike must belong to a train begun after 200 ms of silence is
    open; readings (x) yes, (y) any spike within 40 ms of the previous. Number of permutations a
    standard 1,000. Reproduced when all three values are within tolerance under one combination.
- id: fig6b-convergent-examples
  statement: Two putative pyramidal cells converging on one layer 2/3 interneuron behave
    oppositely; cell 197 depresses with spike repetition while the first spikes of cell 186 are
    ineffective and its later spikes drive the interneuron.
  source: Figure 6b; Results, pages 7 and 8; Supplementary Figure 14
  quote: Figure 6b shows a putative layer 2/3 interneuron innervated by two pyramidal cells, with
    ... pyramidal cell 197 showing a depressing effect with spike repetition. In contrast, the
    first spike of spike trains of cell 186 was ineffective
  depends_on:
  - fig6-depression-facilitation
  criterion: Cells 197 and 186 onto 201 (Supplementary Figure 14) in the Figure 3d session, the
    measure of fig6-depression-facilitation. Reproduced when 197-201 has a first-spike height
    above its later-spike height and 186-201 the reverse, each significant at P < 0.10 under one
    of its readings.
- id: fig7-supralinear-coincidence
  statement: Coincident spikes of two or more presynaptic cells within 5 ms discharge their
    common target interneuron supralinearly, more than the sum of their separate effects, while
    coincidences in windows over 10 ms add only linearly.
  source: Figure 7a and 7b; Results, page 8, paragraph 2; Discussion, paragraph 4
  quote: Coincident discharge of two presynaptic neurons within 5 ms was more effective than the sum
    of the effects of nonsynchronous spikes (Fig. 7a), and coincidence of three or four spikes
    resulted in a supralinear effect in various independently tested cell assemblies (Fig. 7b)
    ... showed only a linear additive effect on the cooperative ability of presynaptic neurons to
    discharge a postsynaptic partner
  depends_on:
  - cell-type-fractions
  expected:
    quantity: satellites (putative pyramidal cells converging on one interneuron)
    value: 14
    tolerance: 1.4
  criterion: A satellite is an interneuron with its convergent excitatory presynaptic cells
    (Figure 7a). For each event, the number of distinct presynaptic cells spiking within the
    window (2, 5, 10 and 20 ms, Figure 7a), and the spike transmission probability, the fraction
    of events followed by a target spike. Open details and readings. The target spike window is
    1 to 4 ms after the last presynaptic spike (the coincidence lag of the Methods). The minimum
    number of presynaptic cells in a satellite is not given; reading two or more. Supralinear is
    (a) above k times the one-spike probability, (b) above 1 - (1 - p1)^k, the probability of
    independent effects. The paper reports no test. Reproduced when, under one reading, the mean
    over satellites with 5 ms windows (Figure 7b) is above the linear prediction for 2 and for 3
    coincident spikes in most satellites, and with 20 ms windows it is not above the prediction
    by more than its s.d. over satellites, and the number of satellites is within the tolerance
    of 14 (Figure 7b, n = 14).
- id: speed-not-correlated
  statement: Firing rates show no net positive relationship with running speed; the distribution
    of rate-speed correlations is symmetric around zero.
  source: Supplementary Figure 3C
  quote: The symmetry of these histograms around 0 suggests that, unlike in the hippocampus, this
    population of neurons does not exhibit a net positive relationship between firing rate and
    speed.
  criterion: Per Supplementary Figure 3C, trials divided into 0.5 s bins, mean rate and speed per
    bin, the correlation coefficient per neuron over bins. A claim of absence with no test named;
    reading, a two-sided Wilcoxon signed-rank test of the correlations against 0 over all neurons,
    and within putative pyramidal cells and interneurons. Reproduced when the median correlation
    over all neurons is not significantly above 0 at p < 0.05; the median and the test are
    reported for every group. Speed from the LED midpoint, smoothed over the 0.5 s bin.
- id: population-vector-width
  statement: Population vector correlations fall off over similar distances throughout the maze,
    0.18 +/- 0.087 of normalised length in layer 2/3 and 0.27 +/- 0.13 in layer 5.
  source: Supplementary Figure 2A
  quote: Neuronal populations were relatively evenly correlated throughout the maze segments with
    0.18(41cm) ± 0.087(29cm) (L2/3) and 0.27(62cm) ± 0.13(30cm) (L5) in normalized length
  expected:
  - quantity: layer 2/3 correlation width
    value: 0.18
    tolerance: 0.087
    unit: normalised length
  - quantity: layer 5 correlation width
    value: 0.27
    tolerance: 0.13
    unit: normalised length
  criterion: Population vectors of PSTHs (shared method) at each position, the correlation matrix
    between positions, as Supplementary Figure 2A. The width is not defined in the paper; reading,
    for each position, the length around the diagonal over which the correlation stays above half
    its diagonal value, mean +/- s.d. over positions. Which trials are open; readings (a) left
    and right PSTHs concatenated in each vector, (b) all trials. Supplementary Figure 2A does not
    name the sessions; the Figure 2a sessions, with all sessions of each layer as a variant.
    Tolerances are the stated s.d. Reproduced when both values are within tolerance under one
    reading.
