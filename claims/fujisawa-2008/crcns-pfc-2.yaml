- id: odor-selective-fraction
  statement: About a quarter of neurons (26% in one layer 2/3 session) fire at significantly
    different rates during nose-poking for the two odors.
  source: Results, Medial prefrontal cortical units predict behavioral choice, paragraph 4;
    Supplementary Figure 6B
  quote: Approximately one-quarter of the neurons showed significantly different ... firing rates
