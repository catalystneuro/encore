claims:
- id: unit-count
  statement: A total of 633 well-isolated units were recorded from anterior cingulate and dorsal
    prelimbic cortex in four rats.
  source: Results, paragraph 1
  quote: We recorded a total of 633 well-isolated units from the anterior cingulate area (area 24)
    and dorsal prelimbic area (area 32) of the medial prefrontal cortex (mPFC)
  expected:
    quantity: well-isolated mPFC units, all rats and sessions
    value: 633
    tolerance: 63.3
    unit: units
  criterion: The number of distinct sorted PFC units over all working memory task recordings.
    The paper does not say whether a unit recorded on several days counts once per day; units are
    counted per recording day, as each day is sorted separately.
- id: task-performance
  statement: The rats performed the task with a mean of 91.9% correct choices during the recording
    sessions.
  source: Methods, Behavioral task
  quote: In the recording sessions, the mean correct performance was 91.9%.
  expected:
    quantity: mean percentage of correct trials over recording sessions
    value: 91.9
    tolerance: 9.19
    unit: percent
  criterion: Correct trials over all trials, per session, averaged over the working memory
    sessions. Not testable if the data hold correct trials only.
- id: fig2c-synchrony-by-layer
  statement: About 10% of layer 2/3 neurons and 20% of layer 5 neurons fire at least one spike in a
    given 100 ms window, and this fraction is roughly constant across the maze.
  source: Results, Medial prefrontal cortical units predict behavioral choice, paragraph 3; Figure
    2c; Discussion, paragraph 2
  quote: the fraction of simultaneously active neurons (10% and 20% in 100-ms windows, layers 2/3
    and 5, respectively; Fig. 2c) were relatively constant in all segments of the maze
  expected:
  - quantity: mean percentage of layer 2/3 neurons active in a 100 ms window
    value: 10
    tolerance: 1
    unit: percent
  - quantity: mean percentage of layer 5 neurons active in a 100 ms window
    value: 20
    tolerance: 2
    unit: percent
  criterion: Per Figure 2c legend, the percentage of the session's neurons firing at least one
    spike in consecutive 100 ms windows, averaged over the windows that fall within trials
    (Figure 2c is plotted against normalised position). Which sessions is open. Readings (a) the
    two sessions of Figure 2a (layer 2/3, 117 neurons; layer 5, 142 neurons); (b) all sessions of
    each layer pooled. Reproduced when both values are within tolerance under one reading, and
    the mean over windows in each tenth of the maze stays within 50% of the overall mean (a
    standard choice for "relatively constant", the paper gives no test).
- id: fig2-population-uniform
  statement: Individual neurons fire transiently at specific locations, but the population as a
    whole fires relatively uniformly over the whole maze.
  source: Results, Medial prefrontal cortical units predict behavioral choice, paragraph 3; Figure
    2a and 2b
  quote: viewed as a population, the firing properties of mPFC neurons were quite homogeneous
    ... individual neurons fired transiently, but, as a whole, the population of neurons fired
    relatively uniformly over the entire apparatus
  criterion: The paper gives no measure or test. Per neuron, the left and right PSTHs as in the
    shared method; the positions of the neurons' peak rates (as Figure 2a orders them). Reproduced
    when, in each Figure 2a session, the peak positions cover the maze with no tenth of the maze
    holding more than twice or less than half its expected share (a chi-square test against
    uniform at p < 0.05 is reported as a variant), and the population mean rate per tenth stays
    within 50% of its overall mean. These thresholds are standard choices, not the paper's.
- id: lifetime-width
  statement: Most neurons are active over a similar stretch of the maze, 0.27 (62 cm) +/- 0.17 (39
