  source: Results, Medial prefrontal cortical units predict behavioral choice, paragraph 3;
    Supplementary Figure 2B
  quote: most neurons were generically active for similar standardized distances of 0.27 (62 cm)
    ± 0.17 (39 cm) (mean ± s.d.) in the maze (as determined by the 50% firing boundaries of the
