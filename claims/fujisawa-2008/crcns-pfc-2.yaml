- id: odor-unrelated-to-stem
  statement: Neurons' odor preference during nose-poking is unrelated to their left-right
    differences in the stem and side arms, so odor traces do not explain the stem selectivity.
  source: Results, Medial prefrontal cortical units predict behavioral choice, paragraph 4 (end,
    page 4); Supplementary Figure 6B
  quote: we ruled out this possibility after examining, and finding no reliable relationship
    among, the differential firing patterns in the stem area and during nose poking
  depends_on:
  - odor-selective-fraction
  - central-arm-selectivity
  criterion: A claim of absence for which the paper names no test. Readings (a) a Fisher exact
    test of odor-selective against stem-selective classification over the session's neurons;
    (b) the correlation across neurons between the nose-poke rate difference and the mean left
    minus right PSTH in 0 to 0.3, tested at p < 0.05. Both readings are run for the stem (0 to
    0.3) and for the side arms (0.5 to 1), as Supplementary Figure 6B states independence from
    both. Reproduced when neither reading finds an association at p < 0.05 with the same sign of
    preference in either region; the size of each is reported.
