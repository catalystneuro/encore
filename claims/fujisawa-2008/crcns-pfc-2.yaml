  expected:
  - quantity: mean width of firing at 50% of peak, normalised length
    value: 0.27
    tolerance: 0.17
  - quantity: s.d. of width across neurons, normalised length
    value: 0.17
    tolerance: 0.017
  criterion: Width of the PSTH (shared method) between the 50% boundaries of its peak
    (Supplementary Figure 2B). The tolerance on the mean is the stated s.d.; the s.d. has 10%.
    Open details and readings. Which PSTH is (a) each neuron's PSTH over all trials; (b) the left
    and right PSTHs as two entries; (c) the PSTH of the condition with the higher peak. The width
    is (i) the contiguous run around the peak above 50% or (ii) the total length above 50%.
    Which neurons is not said (the Results cite Figure 2, which shows two sessions); readings (x)
    the two Figure 2a sessions, (y) all units in the task sessions. Reproduced when both values
    are within tolerance under one combination.
- id: trajectory-divergence
  statement: Left and right running paths overlap in the stem and diverge significantly from
