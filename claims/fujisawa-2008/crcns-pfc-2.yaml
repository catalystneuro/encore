# Claims for Fujisawa, Amarasingham, Harrison & Buzsaki (2008), Nature Neuroscience 11:823-833,
# on CRCNS data set pfc-2 (doi:10.6080/K01V5BWK).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-07,
# protocol as stated in docs/protocol.md (Reader).
#
# Text read: the version of record (PDF supplied by a person, text by PyMuPDF), main text, figure
# legends and Methods, with its supplement (Supplementary Note, legends of Supplementary Figures
# 1 to 16, references). The PDF pages could not be rendered in this run, so numbers and
# significance marks printed only inside figure panels (Figure 2b, 2d, 2e, 3e, 3f, 7b, the
# supplementary panels) are not recorded; the claims rest on the text and legends. Figure 2d
# (mean firing rates, t-test marks) and Figure 2e (fraction of maze length discriminated) have
# no claim for that reason: what the marks compare is shown only in the panels. The paper links
# no analysis code; the only link is to the KlustaKwik spike sorter. None was read.
#
# Data the paper used. Four adult male rats (3 to 5 months old) trained on an odor-based delayed
# matching-to-sample task on a figure-eight T-maze: a nose-poke in the start box gives a cheese or
# chocolate odor, which signals the reward in the right or left goal arm (the pairing varied
# across rats). Mean correct performance in recording sessions 91.9%. One 8-shank, 64-site silicon
# probe per rat (200 um shank separation, 8 staggered sites per shank) in anterior cingulate (area
# 24) and dorsal prelimbic (area 32) cortex; three rats in layer 2/3, one in layer 5. Wideband
# signals at 20 kHz, spikes sorted with KlustaKwik and manual adjustment; two head LEDs tracked at
# 40 Hz. 633 well isolated units in total. Each trial's path is linearised to a normalised
# position from 0 (the odor sampling location) to 1 (the reward area), total length 230 cm, and
# labelled LEFT or RIGHT by the goal arm. Figure 2a and Figure 3 use one layer 2/3 session (117
# neurons, 1172 pairs) and one layer 5 session (142 neurons). The CRCNS description of pfc-2 lists
# PFC (64 channels) and CA1 recordings from three rats (EE, FF, GG) during the working memory
# task, with sleep and a spontaneous alternation task on some days, and states that session
# EE.188 is the session of Figures 2A and 3D. The paper's counts are over four rats; the author
# decides how a data set of three rats bears on them.
#
# Shared method, from the Methods unless stated.
# - Firing-rate differences (LEFT against RIGHT, or any two trial labels). Spikes are placed at
#   the normalised position at which they occur; the PSTH per condition is the sum of Gaussian
#   kernels (bandwidth 0.05 normalised length) over the condition's spikes, divided by the number
#   of trials of that condition. Statistic D0(x) = left PSTH minus right PSTH. Labels are permuted
#   M times; pointwise two-sided bands, and global bands found by the stepping procedure (the
#   smallest pointwise band whose global acceptance level is alpha). A segment is significant
#   when the global band is broken; its extent is where the pointwise band is broken (Figure 1c
#   legend, Supplementary Figure 4E). Level alpha = 0.05 (Figure 1c legend, P < 0.05). M is not
#   given: a standard choice (1,000, the number the paper uses for jitter) is used, as the number
#   of permutations should not change the outcome. Whether error trials enter is not said; the
#   paper reports performance separately and does not mention them in any analysis (open:
#   readings T-a correct trials only, T-b all trials).
# - Monosynaptic connections. Every spike of each neuron is jittered uniformly on [-5, +5] ms,
#   1,000 surrogates. The cross-correlogram over latencies [-5, +5] ms; pointwise and global bands
#   at the 99% level, the global band from the maximum and minimum of each surrogate. A
#   connection is excitatory (peak) or inhibitory (trough) when the counts break the global band
#   anywhere in [1, 4] ms. Pairs are counted in both directions. The Results add onset below 5 ms
#   and a narrow peak (2 ms or less). The CCG bin width is not given (open: readings B-a 1 ms,
#   B-b 0.5 ms). Supplementary Figure 9 says spikes of one of the two neurons were jittered; the
#   Methods jitter each spike of each neuron, which is used, and jittering one neuron is a
#   variant. How the 2 ms width is measured is not given (open: readings W-a, the [1, 4] ms global
#   band test alone as the Methods state it; W-b, also requiring the run of bins above the
#   pointwise 99% band to span 2 ms or less). Figure 3b includes spikes from intertrial
#   intervals, so a pair's CCG uses the whole task session.
# - Cell types. A reference cell with a significant short-latency peak is a putative pyramidal
#   cell, one with a significant trough a putative interneuron (Results; Figure 3a legend). A unit
#   with both is not covered by the paper (open; readings C-a unclassified, C-b excluded from the
#   denominators).
# - Position of excess coincidences. Coincident events are spike pairs with 1 <= tdiff <= 4 ms,
#   placed at the position where they occur, smoothed with the same 0.05 kernel and divided by
#   the number of trials; surrogates by jittering on [-5, +5] ms (1,000, as for the CCG, since this
#   section gives no number); pointwise and global one-sided bands for excess; global level
#   P < 0.01 (Figure 4 and 5 panels, text "P < 0.01").
