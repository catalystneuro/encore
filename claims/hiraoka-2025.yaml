# Claims for Hiraoka & Jo (2025), "Hierarchical organization of bursty trains in event
# sequences", doi:10.1063/5.0296506, on dandiset 000044.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-21,
# protocol as stated in docs/protocol.md (Reader).
#
# Text read: paper/10.1063-5.0296506.txt. Its header says "version of record", but only its
# first part (abstract and a 54-item reference list) is from the version of record. The body
# that follows is the arXiv preprint (stamp arXiv:2508.18281v1, dated September 22, 2025, 50
# references), and its abstract is worded differently. Every claim and quote below comes from
# that preprint body: Sections I to V, Algorithms 1 and 2, and the legends of Figures 1 to 4.
# The paper has no supplement. No PDF was supplied, so the figure panels were read only from
# the labels the text extraction keeps (the delta values in the legends, n, tau_min, tau_max).
# The paper links no analysis code. Its fits use the maximum likelihood estimator and the
# likelihood ratio test of Clauset et al. (ref. 36), citing the Python package powerlaw
# (Alstott et al., ref. 37). No version of that package is given. No code was read.
#
# Data the paper used. Three kinds of event sequence. (1) Neuronal spikes (refs. 38 and 39,
# Grosmark & Buzsaki 2016, DANDI 000044 version 0.210812.1516). These are electrophysiological
# recordings of pyramidal cells in rat hippocampus. Each session is two four-hour rest and sleep
# periods with a 45-minute exploration of a novel maze between them. The spike train of each
# neuron is one event sequence. The representative sequence is "unit 9 in the
# Achilles-10252013 session", with n = 228 356 spikes, tau_min = 1.05 ms and tau_max = 1.82 x
# 10^4 ms (Figure 2, top). The times are in ms. (2) Wikipedia edits by frequent editors, from
# preprocessed data derived from the English Wikipedia dump of October 2, 2015, which a third
# party provided. The representative is the most frequent editor (n = 1 154 494). (3)
# Earthquakes of the Southern California Seismic Network catalog from 1993 to 2020. The events
# are clustered on longitude and latitude by DBSCAN (eps = 0.07 degrees, minimum 35 points). The
# representative is the south cluster (n = 330 215). Only (1) is in the dandiset. The synthetic
# sequences of Figure 4 come from the paper's Algorithm 2 and were not deposited.
#
# Shared method, from Section II (Methods) unless stated.
# - Interevent times tau_i = t_(i+1) - t_i. At timescale delta, a burst is a maximal run of
#   events whose consecutive IETs are all <= delta. The burst size b is its number of events.
#   The merging number k (pair delta' < delta) is the number of bursts at delta' that make up
#   one burst at delta.
# - Relevant timescales run from the smallest delta at which the largest burst has 100 or more
#   events to the largest delta at which there are 100 or more bursts.
# - Power-law exponents of the burst-size and merging-number distributions come from the
#   maximum likelihood estimator. A power law is compared with an exponential by the
#   likelihood ratio test. In Figures 2 and 4 a filled circle means that the test supports the
#   power law over the exponential with p < 0.05.
# - Merging-number pairs. In Figure 2 (neurons), delta = 3.3, 5.9 and 11 times delta', with
#   delta' = 55, 100, 180, 330 and 590 ms in the distribution panel. Burst-size distributions
#   are shown at delta = 55, 140, 370, 940, 2400 and 6300 ms.
#
# Details the paper leaves open, used by several criteria.
# - O1, which unit is "unit 9". The readings are (a) the units table id 9, (b) row 9 counted
#   from 0, (c) the ninth unit counted from 1, (d) a cluster number 9 kept in the unit
#   metadata. The reading whose spike count, tau_min and tau_max match Figure 2 is used. If
#   none matches, every reading is shown.
# - O2, which part of the recording is used. The paper describes the whole session (both rest
#   periods and the maze), so the reading taken is all spikes of the session. The epochs taken
#   separately are a variant.
# - O3, the fit. The paper fixes neither the lower cutoff xmin nor whether the data are treated
#   as discrete. The readings are (a) the powerlaw package's default, with xmin chosen by
#   minimizing the Kolmogorov-Smirnov distance (Clauset et al.), (b) xmin = 1, each with
#   discrete = True and with the package's default continuous fit. A claim on an exponent is
#   reproduced if it holds under one of these readings, and all of them are shown. The
#   likelihood ratio test is powerlaw's distribution_compare('power_law', 'exponential'). A
#   power law is supported when R > 0 and p < 0.05.
# - O4, the grid of delta. The paper does not give it. The legends suggest a geometric grid
#   starting at the lower end of the relevant range, with a ratio of about 1.8 for the neurons.
#   A geometric grid of ratio 1.8 is used. This is a standard choice that cannot change a
#   claim's outcome, as long as the pairs keep the ratios 3.3, 5.9 and 11 of Figure 2.
