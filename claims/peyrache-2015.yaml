    "Stronger" means a larger excess at 0 and a deeper deficit at 60 degrees, so the test is run on
    the values as signed. Reproduced when both tests give p < 0.05 with ADn-ADn pairs the most
    extreme in each group, under one reading; partially reproduced when one does. Pair counts are
    reported against the expected values and do not decide the outcome.
- id: fig4d-ole-near-bayesian
  statement: Optimal linear estimates of HD are better when based on spike train covariances than on
    tuning curve covariances, and the covariance-based estimate almost reaches the performance of a
    Bayesian decoder.
  source: Results, paragraph 5; Figure 4d
  quote: Optimal linear estimates (OLE, see Methods ) of the head-direction were enhanced when using
    spike train covariances (i.e., including noise correlation) instead of the tuning curve
    covariances (i.e., signal correlation only). Estimate of HD based solely on the actual
    covariance of the spike trains almost reached the performance of a non-linear Bayesian decoder
  depends_on:
  - hd-cell-fraction
  criterion: The Results refer to the Methods for the OLE, but the Methods have no OLE section, so
    the estimator is not defined by the paper. Taken here as the standard OLE of Salinas and Abbott
    (1994), the population vector weights D = Q^-1 L, with Q the cell by cell correlation matrix of
    smoothed counts and L the correlation of counts with the HD basis (cos, sin), decoded HD the
    angle of the estimate. Readings for Q, the paper's own two, (signal) from the tuning curves read
    at the head direction and (cov) from the actual spike trains. Cross-validated waking median
    absolute error (10 segments, as in the information measures), counts in 10 ms bins smoothed by
    Gaussian windows from 10 to 1000 ms (the Fig. 4d axis is not readable here). Sessions with 6 or
    more HD cells in a structure (checklist, 20 ADn and 8 PoS). Reproduced when, in each structure,
    the minimum error over windows of the covariance OLE is below that of the signal OLE (two-sided
    Wilcoxon signed-rank test over ensembles, p < 0.05) and within 25% of the Bayesian decoder's
    minimum ("almost reached", a margin fixed here); partially reproduced when the first holds. The
    claim rests on an estimator the paper does not define.
- id: fig4e-ole-covariance
  statement: In the ADn the covariance-based OLE is about 50% better than the signal-based OLE, and
    the gain is significantly larger than in the PoS.
  source: Results, paragraph 5; Figure 4d,e
  quote: In the ADn, where noise correlations were highest for overlapping HD cells, the
    covariance-based OLE was approximately 50% better than the signal-based OLE ( Fig. 4d,e ), and
    significantly stronger than in the PoS ( Fig. 4e ; p < 0.05; Mann-Whitney’s U-test; n = 20 ADn
    and 8 PoS cell ensembles, respectively)
  statistics:
  - about: text
    test: Mann-Whitney's U-test
    p: 0.05
    p_relation: "<"
    n: 20 ADn and 8 PoS cell ensembles
  - about: Figure 4e legend
    test: Mann-Whitney's U-test
    p: 0.009
    n: 20 ADn and 8 PoS cell ensembles
  - about: reporting checklist
    test: Mann-Whitney U test
    p: 0.0088
    n: 20 ADn and 8 PoS sessions with 6 or more HD cells
  depends_on:
  - fig4d-ole-near-bayesian
  expected:
  - quantity: ADn ensembles
    value: 20
    tolerance: 2
  - quantity: PoS ensembles
    value: 8
    tolerance: 0.8
  criterion: The ratio of the minimum (over windows) median absolute error of the covariance OLE to
    that of the signal OLE (Fig. 4e legend), per ensemble, with the OLE of fig4d-ole-near-bayesian.
    "50% better" is open; readings (a) a median ratio of 0.5 (error halved), (b) a median ratio of
    0.67 (signal error 1.5 times the covariance error), each with a tolerance of 10% of the ratio.
    Reproduced when the ADn median ratio is within tolerance under one reading and a two-sided
    Mann-Whitney U-test gives ADn ratios lower than PoS with p < 0.05; partially reproduced when one
    of the two holds. The claim rests on an estimator the paper does not define.
- id: decoding-tracks-hd
  statement: The HD signal decoded with a Bayesian decoder from HD cells faithfully tracks the head
    direction of the waking mouse.
  source: Methods, Bayesian reconstruction of Head-Direction; Figure 1c
  quote: These estimates faithfully tracked the head position in the waking mouse.
  depends_on:
