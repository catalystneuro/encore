- id: fig3b-packet-coherence
  statement: The activity packets in the ADn and the PoS are coherent with the packet expected from
    the Bayesian decoded HD, in waking, REM and SWS.
  source: Results, paragraph 4; Figure 3b; Methods, Ensemble coherence
  quote: The actual activity packets, both in the ADn and the PoS, and across brain states, were
    highly similar to the predictions given by the signal decoded from a Bayesian estimator ( Fig.
    3b ) in waking, REM and SWS
  depends_on:
  - hd-cell-fraction
  criterion: Method of the Methods (Ensemble coherence, after Johnson et al. 2005, ref 34). The
    actual packet at each time is the sum of normalized tuning curves weighted by instantaneous
    rates; the expected packet is the one at the decoded angle; for each degree, 5000 waking
    population vectors at that angle form the reference distribution; coherence is the probability
    that the two packets are similar, as against that distribution, significant above 0.05. Open,
    and named; (c-a) the distance between packets, not given, readings the Euclidean distance or
    one minus the correlation; (c-b) how the 5000 vectors at a degree are chosen (bins whose decoded
    or actual HD is at that degree), readings both; (c-c) the smoothing windows, which Fig. 3b
    varies without listing; 50 to 1000 ms run here. Reproduced when, in both structures and all
    three states, the median coherence over time bins exceeds 0.05 at the decoder's own windows
    (300 ms in waking and REM, 50 ms in SWS) under one reading; partially reproduced when it does
    in some structures or states.
- id: fig4b-noise-correlations
  statement: During waking, the observed correlations of HD cell pairs exceed those expected from
    independent rate-coded neurons for pairs with overlapping fields (0 plus or minus 15 degrees),
    fall below them for pairs at 60 plus or minus 15 degrees, and match them only at larger
    offsets.
  source: Results, paragraph 5; Figure 4a,b; Methods, Cross-correlation under the hypothesis of
    independent firing rate coding scheme
  quote: However, correlations expected from independent rate-coded neurons could not fully account
    for the observed pairwise correlations of HD cells ( Fig. 4a ). ... were observed for neuron
    pairs with overlapping fields (0±15°), with a marked negative signal correlation at 60±15°
    offset ( Fig. 4b,c ) and the expected correlations became similar to the observed ones only for
    pairs with larger angular differences.
  depends_on:
  - hd-cell-fraction
  criterion: Waking, following the Methods. For each cell the intensity function f(t) = h(theta(t)),
    its waking tuning curve read at the head direction, in 10 ms bins; for each pair the
    cross-correlation of the two intensity functions and of the two binned spike trains, both as
    1/N times the sum of products at each lag; the noise correlation is their difference (spike
    trains minus intensities). Open, and named; (n-a) the lag, the Methods average from -50 to +50
    ms and the Fig. 4b legend says "at 0-timelag" (both run); (n-b) the scale, the formula as
    written or divided by the product of the two mean rates so that 1 is chance (Supplementary Fig.
    4 says all correlations are so normalized), both run; (n-c) whether the tuning curve is
    cross-validated, not said, so the tuning curve from the whole waking epoch is used, as the
    Methods describe it. The paper gives no test of the sign at 0 and 60 degrees; a two-sided
    Wilcoxon signed-rank test against 0 (the Methods' one-sample test) at p < 0.05 is used. Pairs
    within each structure and across, rate threshold (rate-a) or (rate-b). Reproduced when, under
    one reading, the noise correlation is above 0 for pairs at 0 plus or minus 15 degrees and below
    0 for pairs at 60 plus or minus 15 degrees, in ADn-ADn pairs and in pooled pairs; partially
    reproduced when one of the two holds. The mean noise correlation beyond 90 degrees is reported.
