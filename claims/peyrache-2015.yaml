- id: fig5d-adn-predicts-pos-reliably
  statement: ADn assemblies predict PoS spike trains reliably in all brain states.
  source: Results, paragraph 6; Figure 5d,e
  quote: ADn assemblies predicted PoS spike trains reliably in all brain states ( Fig. 5d,e ; p < 10
    –10 in all brain states, Wilcoxon’s signed rank test, n = 86)
  statistics:
  - test: Wilcoxon's signed rank test
    p: 1.0e-10
    p_relation: "<"
    n: 86 PoS cells
  depends_on:
  - hd-cell-fraction
  expected:
    quantity: PoS cells predicted from ADn assemblies
    value: 86
    tolerance: 8.6
  criterion: Method of the Methods (Information measures). For each target cell, a rate r(t) as a
    weighted sum of the activity of the cells of the other structure's assembly in 10 ms bins
    convolved with Gaussian readout windows, intensity g(r) with g a modified exponential, linear
    for positive arguments; weights fit by a derivative-free search maximizing the likelihood on
    9 of 10 segments of the state's epoch, tested on the tenth; predictability in bits per spike.
    Targets kept when positively predicted for at least one readout window. Open, and named; (g-a)
    g, given only in words; read as exp(x) for x below 0 and 1 + x above, the form of ref 36, which
    the Methods cite for it; (g-b) the assembly, readings all simultaneously recorded cells of the
    other structure, or its HD cells (Fig. 5d says "PoS HD cell assembly" and Fig. 5e "ADn HD cell
    assemblies"); (g-c) the targets, all cells of the structure or its HD cells (5b counts HD
    cells, 5d does not say); (g-d) the readout windows, not listed; 10 to 1000 ms on a log scale
    used here. Reproduced when the information at the best window is above 0 by a two-sided
    Wilcoxon signed-rank test with p < 1e-10 in each state, under one reading; partially reproduced
    when p < 0.05 in each state and not below 1e-10.
