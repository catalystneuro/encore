    tuning curves are cross-validated for this (they are for Fig. 4d, "cross-validated median
    absolute error"); readings (a) tuning curves from the whole waking epoch, (b) 10-segment
    cross-validation. A median absolute error of 30 degrees or less (a third of the 90 degrees
    expected by chance) is the threshold, fixed here. Reproduced when the median over ensembles of
    the median absolute error is 30 degrees or less in each structure under one reading; partially
    reproduced when it is in one structure.
