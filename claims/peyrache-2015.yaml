    an outlier above the 99.9th percentile of the Poisson distribution at the baseline rate; a
    putative excitatory connection when at least two consecutive bins at lags of 1 to 10 ms pass,
    positive lags ADn to PoS and negative lags PoS to ADn. PoS pyramidal cells by the waveform
    rule of the opening comment. Open, and named; (m-a) the pairs in 6960, readings all ADn cells
    by all PoS cells, or ADn HD cells by all PoS cells (the checklist's 3394 are pairs of ADn HD
    cells with PoS pyramidal cells), in sessions with both structures; (m-b) whether the bins
    tested at lag 0 enter the convolution (a hollowed baseline, as in ref 58, or not), both run;
    (m-c) the binomial test, readings 14 of 20 connections against one half, or the ADn to PoS count
    against the PoS to ADn proportion over 3394 pairs (neither is stated, and the first gives a
    two-sided p near 0.12, not 0.014). Reproduced when the four fractions are within tolerance and
    the ADn to PoS fraction exceeds the PoS to ADn fraction in pyramidal pairs with a binomial p
    < 0.05 under one reading; partially reproduced when the overall fractions are within tolerance
    and the pyramidal ones are not. Each fraction rests on few connections (about 14 and 6), so the
    counts are reported.
- id: fig7c-adn-triggered-pos-lfp
  statement: ADn HD cell spikes are associated with high-frequency oscillations of the PoS LFP.
  source: Results, paragraph 7; Figure 7c
  quote: ADn cell spiking was associated with high frequency LFP oscillations in the PoS ( Fig. 7c )
  depends_on:
  - hd-cell-fraction
  criterion: Method of the Fig. 7c legend. The PoS wideband LFP (0 to 1250 Hz) averaged around the
    spikes of each ADn HD cell (all spikes of ADn HD cells in each session), its average spectrum in
    dB, and the average band-passed (80 to 250 Hz) trace. The paper gives no test; one is fixed
    here. Open, and named; (l-a) the control, readings the same average at spike times jittered by
    plus or minus 10 ms (the jitter of Fig. 7a), or at random times in the same state; (l-b) the
    channel, the PoS channel with largest 80 to 250 Hz power, a standard choice; (l-c) the window,
    plus or minus 20 ms around the spike. Reproduced when, under one reading, the power of the
    80 to 250 Hz triggered average within plus or minus 5 ms of the spike exceeds the control in
    most sessions with both structures and a two-sided Wilcoxon signed-rank test over ADn HD cells
    gives p < 0.05; partially reproduced when the test holds and fewer than half the sessions
    agree.
