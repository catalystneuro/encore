    those closer than 60 degrees as in the text's test (both run); (s-b) the state, each state
    separately or the three pooled (both run); (s-c) the rate, the geometric mean of the two peak
    rates (left panels) or the mean of the two mean rates (right panel, "firing rate mean"), both
    run. The rate effect is a claim of absence judged on the paper's test, the two-way ANOVA at
    0.05. Reproduced when the region effect has p < 1e-7 and the rate group effect has p > 0.05;
