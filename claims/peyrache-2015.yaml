# Claims for Peyrache, Lacroix, Petersen & Buzsaki (2015), Nature Neuroscience 18, 569-575,
# "Internally organized mechanisms of the head direction sense" (doi:10.1038/nn.3968), on dandiset
# 000056.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-15,
# protocol as stated in docs/protocol.md (Reader), version pilot-15.
#
# Text read. The NIH author manuscript (PMC4376557) as served by Europe PMC, under paper/: Results,
# Discussion, Methods and figure legends, with its three supplements from the PMC Open Access
# files: Supplementary Figures 1 to 8 (legends), Supplementary Table 1 (recordings by animal), and
# the Nature Neuroscience reporting checklist, which gives exact p-values and sample sizes per
# test. The checklist numbers figures as in an earlier draft (its "1e", "1f" are Supplementary
# Fig. 2b,c, its "4b" is Fig. 5b, its "4f" is Fig. 5d,e); the Methods also cite Fig. 4f,g and
# "readout windows in Fig. 4" for what the published legends show in Fig. 5d,e. The main figures
# themselves are not under paper/ (no PDF of the article), so values printed only inside figures
# (the r values of the Fig. 2a,b insets, the Fig. 4d errors) could not be read.
#
# Code. The paper links no analysis code, and its checklist answers N/A for custom software. No
# code was read. Every method below is from the Methods, the Results, the figure legends or the
# supplement, and details none of them fixes are named as open.
#
# This file replaces one written after its author had seen the dataset's data check, whose
# methods (finding the open field from the position traces, pooling the two regions, handling of
# missing LED frames) came from the data. It was rewritten from the paper alone. Ids are kept
# where the finding is the same (21 ids kept, criteria rewritten, regions kept apart as in the
# paper). Two old claims are split. fig5e-adn-predicts-pos now holds the asymmetry alone, with the
# readout windows in fig5e-readout-windows. fig7d-same-preferred-direction now holds the preferred
# directions alone, with the HD information of driven PoS cells in
# fig7e-driven-pos-hd-information. New claims for findings without one before are
# recording-sample, supptable1-per-animal, hd-fraction-hd-shanks, supfig2a-unimodality,
# supfig5-rate-independent, fig2e-decoded-speed, fig4d-ole-near-bayesian,
# fig5b-sleep-tuning-similar, fig5d-adn-predicts-pos-reliably, fig6a-fast-oscillation and
# fig7e-interneurons-no-difference.
#
# Data the paper used. Seven adult mice (five male, two female, 27 to 50 g; aged 3 to 12 months,
# reporting checklist), animals m12, m17, m20, m24, m25, m28 and m32 (Supplementary Table 1).
# Silicon probes (4, 6 or 8 shanks, 200 um apart, 8 or 10 sites per shank) in the left anterior
# thalamus of all seven, aimed at the antero-dorsal nucleus (ADn), and in the post-subiculum (PoS)
# of three (m24, m25, m28); CA1 wires for sleep scoring in the four thalamus-only mice (m12, m17,
# m20, m32). Signals at 20 kHz, LFP downsampled to 1.25 kHz; spike sorting with KlustaKwik and
# Klusters. Two LEDs (5 cm apart, blue and red) on the headstage, filmed at 30 frames/s and
# resampled at 39 Hz (the first frame misaligned by 0 to 60 ms). Each session is an open-field
# exploration ("wake", foraging for food for 30 to 45 min in a 53 x 46 cm arena with two visual
# cues), in 41 of 42 sessions preceded and followed by about 2 h of sleep in the home cage; in one
# session a radial maze after the second sleep counts as wake and no sleep followed. 42 sessions,
# 21 of them with ADn and PoS recorded together in 3 mice. Sleep is scored as SWS or REM from CA1 or
# PoS LFP spectrograms and movement, by an automatic Bayesian clustering checked by hand. Sessions
# separated by less than three days without moving the thalamic probe were discarded. Three mice
# expressed channelrhodopsin, which is not part of the study. Measured variables are spike times
# and waveforms of sorted units with their probe (ADn or PoS) and shank, LFP, LED positions, and
# sleep states. Supplementary Table 1 lists sessions as 5, 9, 5, (2, 4), (3, 10), (3, 7) and 2 per
# animal, which sum to 50, not 42; the table is read as given and the difference is named in
# recording-sample. The dandiset, by its title and description, holds recordings of the ADn and
# PoS of mice across wake and sleep from this lab, the data of this paper.
#
# Shared methods, from the Methods ("Head direction cells", "Bayesian reconstruction", "Information
# measures", "Classification of PoS neurons") unless said otherwise.
# - Waking is the open-field ("wake") phase of each session; SWS and REM are the scored sleep
#   stages. Head direction is the orientation of the blue and red LEDs; times when either LED is
#   not detected are excluded.
# - Tuning curve (HD field) in 1 degree bins, spike counts over time spent, smoothed with a 6
#   degree s.d. Gaussian, in waking. Preferred direction is the circular mean of the von Mises fit.
#   HD cell when the von Mises concentration exceeds 1, the peak rate exceeds 1 Hz and the Rayleigh
#   test of uniformity has p < 0.001. Open (hd), how the fit is made, which the Methods give only as
#   fitting "the distributions of angular values making the HD fields"; readings (hd-a) the maximum
#   likelihood von Mises fit to the tuning curve taken as a distribution of angles, with the
#   Rayleigh test on the same distribution weighted by spike count, or (hd-b) a least-squares fit
#   of a von Mises function (with peak rate as amplitude) to the tuning curve, with the Rayleigh
#   test on the head directions at spike times. Whether the peak rate is the fitted amplitude or the
#   tuning curve maximum goes with the reading.
# - Rate threshold (Methods, Head direction cells, paragraph 2). "In all cross-correlation
#   analyses, only cells firing at least at 0.5 Hz in any of the three brain states were included."
#   Open (rate), readings (rate-a) at least 0.5 Hz in each of waking, SWS and REM, or (rate-b) in
#   at least one of them.
# - Pair correlations (Figure 3a legend) are Pearson correlations of binned spike counts, 300 ms
#   bins in waking and REM and 50 ms bins in SWS, for pairs recorded in the same session. Whether
#   pairs on the same shank are kept is not stated for these analyses; kept here, a standard
#   choice, with same-shank pairs left out shown as a variant.
# - Bayesian decoding (following Zhang et al. 1998, ref 56). 10 ms bins, counts smoothed with a
#   Gaussian of 300 ms s.d. in waking and REM and 50 ms in SWS, Poisson likelihood from waking
#   tuning curves, decoded HD as the maximum of the posterior; used only when at least 6 HD cells
#   are recorded in the structure. The prior is not given; a flat prior is used, the standard
#   choice of ref 56's basic method.
# - Information (bits per spike). Cross-validated log-likelihood ratio of the spike train under
#   an intensity function against a homogeneous rate at the training mean, normalised by the
#   firing rate; 10 segments, each tested against the 9 others. HD information uses the training
#   tuning curve read at the test head direction.
# - PoS cell types from the waveform (Supplementary Fig. 6). Putative interneuron for duration
#   below 0.9 ms and trough-to-peak below 0.42 ms; putative pyramidal for duration above 0.95 ms
#   and trough-to-peak above 0.42 ms; duration is the inverse of the frequency of maximum power of
#   the waveform's wavelet spectrum. Other cells are undetermined.
# - Statistics. All tests two-tailed, non-parametric (Mann-Whitney U, Wilcoxon signed-rank,
#   Kruskal-Wallis), correlations by Pearson's coefficient, no correction for multiple
#   comparisons (Methods, Statistical Analysis; reporting checklist).
