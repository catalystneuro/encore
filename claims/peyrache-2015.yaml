  - about: 0 plus or minus 15 degrees (reporting checklist)
    test: Kruskal-Wallis one-way analysis of variance
    p: 1.0e-10
    p_relation: "<"
    n: 96 ADn-ADn, 77 ADn-PoS and 29 PoS-PoS pairs
  - about: 60 plus or minus 15 degrees (reporting checklist)
    test: Kruskal-Wallis one-way analysis of variance
    p: 1.9e-6
    n: 200 ADn-ADn, 157 ADn-PoS and 57 PoS-PoS pairs
  depends_on:
