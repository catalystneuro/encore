  expected:
  - quantity: ADn-ADn pairs at 0 plus or minus 15 degrees
    value: 96
    tolerance: 9.6
  - quantity: ADn-ADn pairs at 60 plus or minus 15 degrees
    value: 200
    tolerance: 20
  - quantity: ADn-PoS pairs at 0 plus or minus 15 degrees
    value: 77
    tolerance: 7.7
  - quantity: ADn-PoS pairs at 60 plus or minus 15 degrees
    value: 157
    tolerance: 15.7
  - quantity: PoS-PoS pairs at 0 plus or minus 15 degrees
    value: 29
    tolerance: 2.9
  - quantity: PoS-PoS pairs at 60 plus or minus 15 degrees
