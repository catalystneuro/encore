  source: Results, paragraph 7; Figure 6a,c; Supplementary Figure 7a; Discussion, paragraph 4
  quote: Spectral analysis of cross-correlation functions between pairs of HD cells in the ADn
    revealed strong oscillatory spiking dynamics activity in windows of approximately 1–5 ms
