# Claims for Farrell, Skidmore, Rajasekharan & Brownell (2020), J Gen Physiol 152(7), "A novel
# theoretical framework reveals more than one voltage-sensing pathway in the lateral membrane of
# outer hair cells", doi:10.1085/jgp.201912447, on CRCNS data set ear-1 (doi:10.6080/K0571975).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-06,
# protocol as stated in docs/protocol.md (Reader), version pilot-13.
#
# Text read: the version of record (PMC7335013, open access), as supplied under paper/ (Europe PMC
# JATS XML flattened to text): Introduction, Theoretical model, the section on expressions for the
# experimental parameters, Materials and methods, Results, Discussion, the legends of Figures 1 to 5
# and S1 to S7, and Tables 1 to 3. No PDF was supplied.
# Missing from the text. (1) Every displayed equation (Eqs. 1 to 9) is lost in the flattening; only
# the prose around them is there. The forms used below were rebuilt from that prose and checked
# against the paper's own numbers, and each is marked as a reconstruction where a criterion uses it.
#   Eq. 2c, the charge density, dVmin_exp = QTm / CLW (prose; Fig. S1 legend gives QTm 3.02 pC and
#     CLW 18.56 pF, 0.163 V).
#   Eq. 3a, V0.5 = Vd - dVmin_exp / 2 (prose; slope -1/2, intercept Vd, "Vd was the only free
#     parameter"); with Eq. 3b, Vh = V0.5 - dVmin_exp / 2 and Vd = V0.5 + dVmin_exp / 2.
#   Eq. 5, z = n delta = alphaB kB T / e0 (Table 1, alphaB 37.3 and z 0.96 at 24 C).
#   Eq. 8d, alphaB = 4 alpha(V0.5) (Results, 9.32 and 8.08 V-1 against Table 1, 37.3 and 32.3 V-1).
#   Eq. 6a, lambda = q^2 / (2 C_Leq), and Eq. 6b, QTm^2 = (2 lambda / C_Leq) CLW^2 (gives 3.95 and
#     2.16 kB T for q = 0.859 e0 and C_Leq 0.584 and 1.07 aF, as in Table 3 and Fig. 1).
#   Eq. 7, dG = (lambda -/+ q V0.5 / kB T)^2 / (4 lambda), the activation with -, the deactivation
#     with + (Theoretical model, the sentence after Eq. 7; with q = 0.859 e0 and V0.5 < 0 this
#     gives 2.68 and 0.125 kB T for pathway 1, 1.19 and 0.145 for pathway 2, Table 3).
#   Eqs. 8b and 8c (the non-lateral-wall capacitance) are not rebuilt beyond the prose; see
#   nlw-capacitance.
# (2) The contents of Tables S1 to S4 are not in the text (only their captions). Claims that rest
# on them say so. The supplementary figures S1 to S7 are present as legends only.
# Neither gap touches the main findings (Figs. 1 to 4, Tables 1 to 3), so claims were written.
#
# Code. The paper links no code. Its Methods say analyses were done in Matlab v8.2 to v9.0 and JMP
# v7.02. The data set's own description names MATLAB analysis scripts inside the data set and a
# repository, https://github.com/gaviganet/OHC_curation; these belong to the data set, which a
# reader may not open, so no code was read. Every method below is from the paper's text.
#
# Data the paper used. 89 outer hair cells (OHCs) isolated from guinea pigs of two colonies,
# pigmented (Baylor; Elm Hill) and albino (Charles River), classed by sex and sexual maturity (39
# from adult males, 21 from prepubertal males, 28 from prepubertal females, 1 from an adult female),
# separated by cochlear turn 1 (basal) to 4 (apical), one cell of unknown turn. Whole-cell voltage
# clamp at room temperature (24 C), pipette pressure 0 kPa; capacitance from admittance with a
# two-sine stimulus during a DC voltage ramp, reported at the lower frequency; DC conductance from
# voltage steps between -0.1 and 0.1 V in some cells. 86 cells had 144 mM pipette chloride, 3 had
# 10 mM chloride with glutamate. Some cells (pigmented colony) were recorded with 30 to 60 uM XE991
# in the bath. Cell size from a bright-field image. Measured variables per cell: capacitance against
# voltage, linear capacitance at positive (CL) and negative (CLn) voltages, Rm, Rs, conductance,
# cell length and radius, time after sacrifice. The CRCNS data set, by its description, holds these
# 89 cells (82 fields per cell, MATLAB and HDF5). The sequencing (Fig. S3), the protein model
# (Fig. 4b, Fig. S6, Table S4) and the rat and mouse values taken from other papers (Fig. 3a and c,
# Fig. 4c to f, Fig. S7) are not recordings of this data set.
#
# Shared method, from Expressions used to determine the experimental parameters (paragraphs 2 to 4)
# and Whole-cell patch-clamp voltage clamp assay (paragraph 2). C = CL + CNL. CL is taken at
# voltages positive to the capacitance peak where dC/dV over three to five consecutive points is
# close to zero (the threshold for "close to zero" is not given; open). CNL = C - CL. QTm is the sum
# of CNL dV over -0.18 < V < 0.18 V (dV about 0.003 V). V0.5 and Cpeak are read "from a plot of C
# as a function of membrane potential" (open whether the voltage of the largest measured C or of a
# fitted peak; readings (p-a) the measured maximum, (p-b) a smooth fit, e.g. a two-state Boltzmann
# derivative). alpha(V0.5) is the maximum of d(QNL/QTm)/dV; alphaB = 4 alpha(V0.5) (Eq. 8d as
# rebuilt). V0.5 is corrected for the pipette drop as V0.5 x Rm / (Rs + Rm), with either the DC
# conductance at V0.5 or the admittance conductance at positive voltage (the paper allows both; which
# was used per cell is not given; where the data set stores corrected values, use them, otherwise
# show both). CLW = CL - CNLW (Eq. 8a), with CNLW determined per cell (Eq. 8c as rebuilt, CNLW =
# CSB + root, where CSB is the stereocilia bundle capacitance "calculated" for each cell and the
# root is that of nlw-capacitance). The paper does not apply one fixed CNLW to every cell: its
# Fig. S1 cell has CL 24.45 pF and CLW 18.56 pF, so CNLW 5.89 pF for that cell, against the ~4.82
# pF of Results paragraph 1. The rule for CSB is taken from Corbitt et al. (2012) and not given;
# open. Readings (L-a) CLW, CNLW or CSB as stored per cell in the data set, if stored; (L-b) CNLW =
# root + CSB per cell, with the root fitted as in nlw-capacitance and a CSB rule the author states
# as an assumption, admissible only if it gives the Fig. S1 cell a CLW within 1.856 pF of 18.56 pF;
# (L-c) CNLW = 4.82 pF for every cell, an approximation the Fig. S1 legend contradicts for that
# cell, reported for comparison. Claims that use CLW, dVmin_exp or C_Leq are judged under (L-a)
# where it exists, otherwise (L-b); results under (L-c) are shown but do not decide an outcome, and
# every outcome is marked as resting on the CSB reading used. dVmin_exp = QTm / CLW.
# z = alphaB kB T / e0 at T = 297.15 K. "Basal" and "apical" are not defined in the text; readings (r-a) basal = turns 1
# and 2, apical = turns 3 and 4; (r-b) basal = turn 1, apical = turn 4 with 2 and 3 left out.
# Reading (r-a) is the one the cell counts favour: Table 1 places 15 + 28 + 41 = 84 cells in its two
# regions, and Fig. 1 shows 86 cells with 144 mM chloride, of which at most 85 have a known turn, so
# nearly every cell of known turn is in a region, which (r-b) would not give.
# Where a claim gives no test, none is reported in the paper.
