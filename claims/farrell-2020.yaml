- id: nlw-capacitance
  statement: The capacitance of the non-lateral-wall region is about 4.82 pF, close to the 4.86 pF
    reported before for adult males, and it does not differ between phenotypes or between adult and
    juvenile animals.
  source: Results, Experimental magnitude of CLW, QTm, alphaB and V0.5, paragraph 1
  quote: The capacitance of the nonlateral wall region was found to be ∼4.82 pF and is similar to
    that previously reported (4.86 pF) when only cells isolated from adult male guinea pigs were
    considered ( Corbitt et al., 2012 ). We found no differences when cells were isolated from
    animals of either phenotype or when cells were isolated from adult or juvenile animals with this
    dataset
  expected:
    quantity: CNLW
    value: 4.82
    tolerance: 0.482
    unit: pF
  criterion: Method from Expressions used to determine the experimental parameters, paragraph 2
    (Eqs. 8b and 8c, whose rendering is missing). QTm of each cell is plotted against CL - CSB and
    the root exp(-gamma/beta) of the fitted relation is found, with beta and gamma fitted constants;
    the prose and Results paragraph 1 ("QTM increases with the logarithm of lateral wall
    capacitance") fix the relation as QTm = gamma + beta ln(CL - CSB), so the root is the value of
    CL - CSB where QTm is zero. CNLW is then CSB plus that root. CSB, the stereocilia bundle
    capacitance, is "calculated" by a method the paper takes from Corbitt et al. (2012) and does not
    give; open. Readings (n-a) CSB as stored per cell in the data set, if it is; (n-b) CNLW and CLW
    as stored per cell; (n-c) CSB = 0, so CNLW is the root alone. The form of Eq. 8c (CNLW = CSB +
    root) is rebuilt from the prose. Since CNLW so computed varies by cell (the Fig. S1 legend gives
    5.89 pF for that cell), the value compared with 4.82 pF is read as (n-i) the mean per-cell CNLW
    or (n-ii) the root alone; both are shown. Which cells enter the fit is not given; readings all 89 cells,
    or the 86 with 144 mM chloride (the population of Fig. 1). Reproduced
    when under one reading CNLW is within tolerance and separate fits for pigmented against albino,
    and adult against juvenile, give roots whose 95% confidence intervals overlap (the paper names no
    test for "no differences"; overlap of intervals is the reading used here, and the size of each
    difference is shown).
