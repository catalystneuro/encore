claims:
- id: fig1-tables1-expression
  statement: hM4D expression is highly co-localized with PV and SST and extends throughout DG and
    CA3, with no expression in CA1 or CA2.
  source: Results, Recording in vivo hippocampal LFP, paragraph 1; Figure 1D, Figure S1A-C, Table S1
  quote: HM4D expression was highly co-localized with PV and SST expression (Figure S1A–C and Table
    S1) and extended throughout DG and CA3 from dorsal to ventral hippocampus, with no expression in
    CA1 or CA2
  criterion: Histological cell counts (Table S1) are not among the deposited data the paper lists
    (Data and Code Availability). Where per-animal counts are available, reproduced when the
    proportions in Table S1 are matched within 10% for each animal.
- id: figs1ef-exvivo-cno
  statement: In ex vivo slices CNO hyperpolarizes hM4D-expressing PV+ and SST+ interneurons by 8.6
    +/- 1.3 mV and changes their input resistance by 31.3 +/- 9.9 MOhm.
  source: Results, Recording in vivo hippocampal LFP, paragraph 1; Figure S1E-F
  quote: hyperpolarized resting membrane potentials by 8.6 ± 1.3mV (Figure S1E), and decreased input
    resistance by 31.3 ± 9.9 MΩ (Figure S1F)
  statistics:
  - about: membrane potential change
    test: 1-sample t test
    statistic: t(9)=6.57
    p: 0.0001
    n: 4 PV-Cre, 4 SST-Cre and 2 PV-Cre/SST-Cre slices
  - about: input resistance change
    test: 1-sample Wilcoxon test
    statistic: W = -55
    p: 0.002
    n: 4 PV-Cre, 4 SST-Cre and 2 PV-Cre/SST-Cre slices
  expected:
  - quantity: hyperpolarization of resting membrane potential with CNO
    value: 8.6
    tolerance: 1.3
    unit: mV
  - quantity: magnitude of input resistance change with CNO
    value: 31.3
    tolerance: 9.9
    unit: MOhm
  criterion: Whole-cell patch-clamp recordings in slices, not among the deposited data. The sign of
    the resistance change is open in the paper, where the Results say it decreased and the Figure
    S1F legend says CNO "increases input resistance"; either sign matches. Tolerances are the
    stated spread (mean +/- SEM).
