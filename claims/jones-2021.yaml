# Claims for Aery Jones, Rao, Zilberter, ..., Huang & Frank (2021), Cell Reports 37, 110159,
# tested on dandiset 000165.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-10,
# protocol pilot-14 as stated in docs/protocol.md.
#
# Text read: the accepted author manuscript in PubMed Central (PMC9069800, NIHMS1795940), full
# text with STAR Methods and figure legends, and its main supplement PDF
# (NIHMS1795940-supplement-Main_supplement.pdf: Figures S1 to S7 and Tables S1 to S6), as
# stored under paper/. The version of record was not read. Supplementary Table S7 (an xlsx file,
# effects stratified by sex) is not under paper/ and was not read; only the claim
# sex-stratified-effects needs it.
#
# Code read: github.com/emilyasterjones/interneurons_modulate_drive, tag v1.0.0, commit 63b1acb
# (archived as Zenodo doi:10.5281/zenodo.5618979), MATLAB. It holds preprocessing (ripple,
# dentate spike and MUA extraction, position and velocity), rest analyses (ripple rates and
# descriptors, SWR-triggered MUA, spectrograms, coherence, CSD, SW amplitude, instantaneous
# frequency, dentate spikes), run analyses (continuous spectrograms, coherence, comodulation,
# instantaneous frequency, MUA, velocity) and the statistics (calcLMM.m, calcjointLMM.m,
# calcInteraction.m, calcunpairedLMM.m, HBcorrect.m, runcalcLMM_figs.m). It reads FilterFramework
# data structures, not the NWB files.
#
# Data the paper used (STAR Methods, Method details; Figure legends). PV-Cre, SST-Cre and
# PV-Cre/SST-Cre mice injected in the DG hilus with AAV5-hSyn-DIO-hM4D(Gi)-mCherry, or with an
# empty mCherry vector, implanted in right dorsal hippocampus with a 32-site probe. Each mouse
# had 6 daily sessions alternating vehicle and CNO (2 mg/kg i.p., 1 hour before recording).
# Cohort 1 (5 PV-Cre, 4 SST-Cre; single-shank 32-site probe with 50 um spacing): home cage, used
# only for CSD (Figure 2). Cohort 2 (9 PV-Cre, 10 SST-Cre, 6 PV-Cre/SST-Cre; 4-shank probe):
# home cage (Figure 3). Cohort 3 (8 PV-Cre, 7 SST-Cre, 7 PV-Cre/SST-Cre, 8 empty vector): 30 min
# linear track sessions (Figures 5, 6), then home cage sessions (Figure 3); 1 PV-Cre and 1
# SST-Cre died before the home cage sessions. Rest analyses thus use 16 PV-Cre, 16 SST-Cre, 13
# PV-Cre/SST-Cre and 8 empty vector mice; run analyses 8, 7, 7 and 8. The Methods (Surgery)
# give the single-shank probe to cohort 3, while the Results and Figure 2A give it to the first,
# CSD, cohort; the author identifies the probe from the data. Home cage sessions 60 min at 30
# kHz; linear track sessions 30 min at 20 kHz; video at 30 frames/s. The deposit holds 0-300 Hz
# LFP, MUA spike times, position, and electrode, mouse and session metadata (Data and Code
# Availability). Measured variables are LFP and MUA per site in CA1 (pyr, sr, slm), CA3 (pyr,
# sr) and DG (hilus, granule cell layer), and the mouse's velocity.
#
# Method M, shared by the LMM claims (every claim that says "Method M"). Each part is cited.
#  - Periods. Rest is extended immobility, after the Gaussian-smoothed velocity has been below
#    1 cm/s for 30 s or more (Methods, Analysis of neural data, paragraph 2; code
#    runcalcriprates.m, get2dstate immobilecutoff 1 and immobilitytime > 30). Run is velocity
#    above 1 cm/s (Methods, paragraph 7; code runcomod.m, $vel > 1).
#  - Sites. SWRs detected on the CA1 site closest to the centre of the pyramidal layer; MUA on
#    the site of the layer with the highest MUA (Methods, paragraphs 2 and 5). Rest SG power in
#    CA1-sr, CA3 (pyr and sr) and DG (hilus and granule cell layer) (paragraph 3). Run features
#    in CA1-pyr for the figures (Results, SG during movement, paragraph 1), CA3 (pyr and sr) and
#    DG (hilus and granule cell layer) (Methods, paragraph 7); a region's value per time bin is
#    the mean over its sites (code run_continuous_specgram.m, avgSGpwr).
#  - Events and features as the Methods define them (Analysis of neural data, paragraphs 2 to
#    7): ripple band 125-200 Hz, Hilbert envelope smoothed with a 4 ms Gaussian, above 3 SD for
#    at least 15 ms; theta 5-11 Hz, SG 20-50 Hz, FG 50-110 Hz during run; multitaper
#    spectrograms with a 1 s window during run (code continuous_specgram.m, tapers [3 5]);
#    instantaneous frequency from interpeak times. The code also drops events within 0.4 s of
#    the epoch edges and events also crossing 5 SD on 16 or more channels (getvalidrips.m),
#    followed here as the Methods are silent. The code counts SWRs for rate, length and chains
#    at 5 SD (runcalcriprates.m binrange [5 50]; runripdescript.m minstd 5) and for MUA at 3 SD
#    (runRTMUA.m); the Methods say 3 SD, which is the main reading, and the code's 5 SD for
#    rate, length and chains is a variant.
#  - Data points of the model are events for SWR features, time bins for continuous measures
#    (1 min for SWR rate, 100 ms for MUA, 1 s for all others) and peaks for continuous
#    frequency (Quantification and statistical analysis, paragraph 2).
#  - Treatment effect, per genotype. A linear mixed model fitted by maximum likelihood,
#    feature ~ treatment + (treatment|animal), with an F test of the treatment fixed effect
#    against the intercept-only model (paragraph 2; code calcLMM.m, fitlme and coefTest). The
#    direction is the sign of the treatment coefficient (CNO minus vehicle).
#  - Genotype difference ("PV vs SST"). Data of the two genotypes pooled; a likelihood ratio
#    (chi-square) test of feature ~ treatment + (treatment|animal) against the model with
#    genotype and treatment (paragraph 2; code calcjointLMM.m fits
#    Measure~Genotype*Treatment+((Genotype*Treatment)|Animal), calcInteraction.m compare()).
#  - Log transform, open. The Methods log-transform a feature when its errors are not Gaussian
#    (they were right skewed); the code's figure script sets logtransform = 1 for every
#    feature, shifting the data to a minimum of 0.001 when they reach 0 or below
#    (runcalcLMM_figs.m, calcLMM.m). Readings (a) log for features whose residuals are right
#    skewed, the rest untransformed (Methods, main); (b) log for all features (code). Both are
#    run.
#  - Significance. Holm-Bonferroni at alpha 0.05 across an experiment, defined as the 24 rest
#    comparisons (Figures 2-4, S2-S3) or the 36 run comparisons (Figures 5, 6, S4-S5), within one
#    genotype or within the between-genotype tests (Quantification, paragraph 3; code
#    HBcorrect.m). When the full family is not computed, p < 0.05/24 (rest) or 0.05/36 (run)
#    suffices for significance and p >= 0.05 for its absence, as both hold under Holm whatever
#    the other p-values are. For Figures S6 and S7 the family is the same set of comparisons for
#    the double-suppression and empty vector groups (code runcalcLMM_figs.m, Figures 6, S5
#    section).
#  - A claimed effect is reproduced when its direction matches and it is significant; a claimed
#    absence ("no change", "not CA1") is reproduced when the same test is not significant,
#    with its p-value and coefficient reported either way.
schema_version: 2
