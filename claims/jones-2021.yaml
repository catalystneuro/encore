- id: sex-stratified-effects
  statement: Interneuron suppression has effects of the same direction and magnitude in both sexes
    on most features; the exceptions are SW amplitude with SST+ suppression (down in females, up in
    males), FG power with SST+ suppression (larger rise in females), and DG and CA3 MUA during
    movement (larger rise in females with suppression of either or both classes).
  source: Results, consistency, paragraph 1; Table S7
  quote: The effect of suppressing interneurons was in the same direction and magnitude in both sexes
    on most features (Table S7) with a few exceptions. Suppressing SST+ interneurons decreased SW
    amplitude in females but had the opposite effect in males, leading to no effect overall, and
    enhanced FG power to a greater degree in females than in males. Interestingly, suppressing
    either or both interneuron classes led to a greater increase in DG and CA3 MUA during movement
    in females
  criterion: Table S7 (xlsx) was not available to the reader; its p-values and the features it
    covers are not recorded here. Per genotype, the likelihood ratio test of feature ~ treatment +
    (treatment|animal) against feature ~ treatment:sex + (treatment:sex|animal) (Quantification,
    paragraph 2; code runcalcLMM_figs.m Table S6 section, calcInteraction.m on males and
    females), Holm-Bonferroni per genotype over the features. Reproduced when the named exceptions
    have a significant sex interaction with the stated signs (females larger, or opposite signs
    for SST-Cre SW amplitude) and at most a few other features do; the count of other significant
    interactions is reported. "FG power" is read as CA1 FG power, the paper's main FG power
    feature; CA3 and DG are shown as variants.
