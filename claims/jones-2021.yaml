- id: figs6-empty-vector-control
  statement: In mice injected with an empty vector, CNO and vehicle epochs do not differ.
  source: Figures S6 and S7, Table S5; Results, consistency, paragraph 2
  quote: we treated mice injected with an empty vector as a control and observed no differences
