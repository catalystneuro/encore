# Claims for Wirth, Baraduc, Plante, Pinede & Duhamel (2017), PLoS Biology 15(2), e2001045,
# tested on CRCNS hc-12 and hc-21.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-10,
# protocol pilot-14 as stated in docs/protocol.md.
#
# Text read: the version of record (PMC5328243, open access), full text from Europe PMC JATS
# XML as stored under paper/: Results, Discussion, Materials and Methods, the figure legends of
# Figs 1 to 7 and the legends of S1 to S7 Figs. The supplementary text files S1 Appendix
# (sections A1 to A5: point-of-gaze density maps, gaze before joystick actions, recording
# methods and cell selection, population averages, the control for space dimensionality) and
# S2 Appendix (description of the CRCNS files and scripts) are DOCX files that are not under
# paper/ and were not read. The claims that rest on them say so (gaze-anticipates-action,
# gaze-anticipates-landmarks, dimensionality-control, fields-per-cell). No PDF was read; the
# reference list is absent from the stored text, so reference 60 (the learning curve method)
# is not named.
#
# Code: the paper links no repository. It says some Matlab scripts are hosted with the data on
# CRCNS (Supporting data; S2 Appendix); the hc-12 descriptor lists them (a scripts folder that
# plots position, direction and state-space maps, rasters and learning curves). These are files
# of the dataset and were not read. No criterion below takes a method from code; the author may
# read them for the map binning left open in Method W, citing the file.
#
# Data the paper used (Results; Materials and Methods). Two rhesus macaques, monkey S and
# monkey K, navigating with a joystick a virtual 3-D star maze of five arms (radius 16 m,
# speed 5 m/s) with five landmarks placed between the arms at twice the arm length, projected
# in stereo on a 152 x 114 cm screen at 101 cm, 70 degree horizontal field of view. The reward
# is at the end of one arm (by convention north, between the two landmarks neighboring it).
# Each day a new landmark layout; sessions of 80 (plus or minus 5) trials. A trial starts at an
# arm end, the animal moves to the center, rotates (72 degrees facing a path, 36 degrees facing
# a landmark), enters an arm, is rewarded at its end if correct, and is relocated passively to
# a random new start along a path outside the arms ("return paths"). Probe sessions (9 for S,
# 15 for K) started from one or two eastern entries, with the western entries introduced later.
# Binocular eye tracking (ASL) gives the point of gaze. 270 cells recorded in the right
# hippocampus (128 S, 142 K), sites in CA3 (99), CA1 (101) and dentate gyrus (8); 189 cells
# with more than 100 spikes per session are analysed, on successful trials only. Measured
# variables are spike times, virtual position and head (camera) direction, eye position, task
# events, and the state-space coordinates.
#
# Datasets. The paper names one deposit, "the spike and behavior data files hosted on CRCNS
# (http://dx.doi.org/10.6080/K0R49NQV)" (Supporting data; the figure legends give the same doi).
# The descriptors under paper/ (read for this alone) give that doi to hc-12: 189 cells from the
# two monkeys (files "sn" and "ke"), one session per file of about 40 minutes, in a field
# "newallo" (the daily new maze), with eye positions, camera data, state-space coordinates,
# transition tags and learning curves. hc-21 has its own doi (10.6080/K0GX48R9, 2018): 101
# cells, each file with a familiar maze ("famallo") and a daily new maze ("newallo"), and it
# names a second paper (Baraduc, Duhamel and Wirth, schema cells). The paper describes only
# daily new layouts and no familiar maze, so its findings rest on hc-12, and every claim lists
# crcns-hc-12 alone. Whether some hc-21 "newallo" sessions are the paper's sessions is not
# settled by the paper; the author may test claims on them as a variant.
#
# Method shared by the claims (every claim that says "Method W"). Each part is cited.
#  - Trials. Only successful trials (Results, What is encoded, paragraph 1). Whether the
#    passive return following a correct trial belongs to it is open; the paper analyses return
#    paths (Results, Direction selectivity) and the state space includes them (Fig 1F legend).
#    Readings (a) from trial start to the end of the following return; (b) from trial start to
#    reward, return paths taken from the returns that follow correct trials. A deviation.
#  - Cells. The 189 cells with more than 100 spikes per session; responsive cells are those
#    with significant IC (p < 0.01) in at least one of the four spaces (Results, Sensitivity
#    of the cells, paragraph 2).
#  - Spaces. Position (virtual X, Y), direction (virtual head direction), point of gaze
#    (Methods, Mapping the animal's point of gaze), and state space (Fig 1F; Results, What is
#    encoded, paragraph 2). Point of gaze combines horizontal and vertical eye position with
#    virtual position and camera orientation; points beyond the landmark wall, or above the
#    horizon, are put on a vertical cylinder through the landmark centroids, flattened into an
#    annulus (Methods; Fig 1G legend). Open: which eye (left, right, or the mean of both), the
#    eye units and calibration, the virtual eye height and the vertical field of view. A
#    deviation; the readings are the three eye choices.
#  - Maps. Rate per bin is spikes over time in the bin, unsmoothed for comparisons; bins kept
#    with at least four successful trials (Methods, Activity maps) and, for IC, more than
#    400 ms of time in successful trials (Methods, Information Content). The resolution of each
#    map is adjusted so that the number of valid bins is as close to 200 as possible (Methods,
#    Information Content). How the resolution is stepped in each space is open; a standard
#    choice (square grid for position and gaze, equal angular bins for direction, equal
#    lengths along graph edges for the state space), stated as a deviation.
#  - IC is Skaggs information in bits per spike, sparsity is (M - (sum rate)^2 / sum rate^2) /
#    (M - 1) over M bins (Methods, Information Content; Sparsity index). Normalized indexes
#    subtract the mean of the 999 surrogate values (Methods; Results, Hippocampal cells encode,
#    paragraph 1).
#  - Surrogates. 999 surrogate spike sets from 5 s chunks of recording time randomly shifted;
#    p is the rank of the actual value among the 1,000, bilateral (Methods, Permutation
#    statistics). How chunks are shifted is open; readings (a) the order of the chunks is
#    permuted (Results, "randomly shuffling periods of spiking activity in time"); (b) each
#    chunk is displaced by an independent random time shift. The bilateral p is taken as twice
#    the smaller tail rank fraction, a standard choice.
#  - Binomial tests of a count of significant cells against chance. The chance rate is not
#    stated. Readings (a) 0.05; (b) 0.025, one tail of a bilateral 0.05 test. From the paper's
#    own numbers, 12 and 4 of 111 (state-space selectivity, p = 0.01 and p = 0.81) match (a);
#    3 of 56 (direction correlation, p = 0.16) matches (b); 1 of 42 (path invariance,
#    p = 0.37) matches the lower tail P(X <= 1) under (a). Each claim names the reading its
#    numbers fit.
schema_version: 2
paper: doi:10.1371/journal.pbio.2001045
claims:
- id: gaze-anticipates-action
  statement: During the 500 ms before each joystick action, gaze anticipated the direction of the
    subsequent movement.
  source: Results, Animals use direction and compute trajectory, paragraph 2; S1 Fig and S2 Fig
    (S2A and S2B legend)
  quote: During the 500 ms before each action on the joystick ( Fig 1D , S1 Fig , S2 Fig , and S1
    Appendix A2), gaze anticipated the direction of the subsequent movement (Wilcoxon test, p <
    0.001
  statistics:
  - test: Wilcoxon test
    p: 0.001
    p_relation: "<"
  datasets:
  - crcns-hc-12
  criterion: The analysis is described in S1 Appendix A2, which was not read. The paper's text
    and the S2 Fig legend disagree on the window, 500 ms (Results) or 300 ms (S2A legend). Per
    monkey, the mean horizontal eye position in the window before each left or right joystick
    move (event codes for rotation), with Method W's trials. Readings (a) 500 ms; (b) 300 ms;
    the Wilcoxon test is read as a rank-sum test of eye positions before right against before
    left turns (the distributions of S2A). The Results give one p while S2 Fig shows each
    monkey; readings (i) each monkey separately, (ii) both monkeys pooled. Reproduced when,
    under one reading, eye position before right turns lies to the right of that before left
    turns, with p < 0.001 (in each monkey under (i)).
- id: gaze-anticipates-landmarks
  statement: When relocated to a new entry, the monkeys gazed proactively at the location where
    the landmarks would appear.
  source: Results, Animals use direction and compute trajectory, paragraph 2; S2C Fig
  quote: Similarly, when being relocated to a new entry, monkeys proactively gazed at the location
    at which the landmarks would appear (see S2 Fig and S1 Appendix A2) (Wilcoxon test, p < 0.001)
  statistics:
  - test: Wilcoxon test
    p: 0.001
    p_relation: "<"
  datasets:
  - crcns-hc-12
  criterion: The analysis is in S1 Appendix A2, which was not read; the S2C legend shows the mean
    horizontal eye position during passive returns toward the right against toward the left.
    Per monkey, mean horizontal eye position during returns turning right against left, by a
    Wilcoxon rank-sum test. Per monkey or pooled, as in gaze-anticipates-action. Reproduced when,
    under one of these readings, eye position lies toward the side of the turn with p < 0.001
    (in each monkey when taken separately). The test the paper ran is not fully specified, a
    deviation.
- id: learning-trials
  statement: Both monkeys learned the rewarded arm in about a dozen trials; monkey S performed
    above chance after 12.3 plus or minus 2 trials (SEM) and monkey K after 14.8 plus or minus 2.4.
  source: Results, Animals use direction and compute trajectory, paragraph 3; S3A and S3B Fig
  quote: monkey S performed above chance after 12.3 ± 2 trials (SEM), and monkey K did so after 14.8
    ± 2.4 trials
  expected:
  - quantity: monkey S, mean trials to above-chance performance
    value: 12.3
    tolerance: 2
  - quantity: monkey K, mean trials to above-chance performance
    value: 14.8
    tolerance: 2.4
  datasets:
  - crcns-hc-12
  criterion: Per session, the first trial at which the lower confidence bound of the probability
    of a correct response exceeds 1/4 (S3B legend; the reward is never at the end of the entry
    arm). The bounds come from the method of the paper's reference 60, which the stored text
    does not name; the descriptor says each file holds learning curves with bounds, which may be
    used, the curves recomputed otherwise being a variant. Which sessions enter is open;
    readings (a) all sessions of the monkey; (b) the sessions that are not probe sessions.
    Tolerances are the paper's SEM. Reproduced when both means fall within tolerance under one
    reading.
- id: learning-to-90
  statement: From above-chance performance to the upper confidence bound of success reaching 90%,
    fewer than 10 trials were usually needed (89% of sessions).
  source: Results, Animals use direction and compute trajectory, paragraph 3
  quote: From then to when the upper confidence bound of success reached 90%, less than 10 trials
    were usually necessary (89% of sessions).
  expected:
  - quantity: fraction of sessions with fewer than 10 trials from above chance to upper bound 90%
    value: 0.89
    tolerance: 0.089
  datasets:
  - crcns-hc-12
  criterion: With the learning curves of learning-trials, per session the number of trials from
    the first trial with lower bound above 1/4 to the first with upper bound at or above 0.9;
    the fraction of sessions where it is below 10, both monkeys pooled. Sessions as in the
    readings of learning-trials.
  depends_on:
  - learning-trials
- id: probe-transfer
  statement: In probe sessions, performance after the new western entries were introduced was
    higher than at the start of the session (monkey K 73% against 44%, monkey S 80% against 55%).
  source: Results, Animals use direction and compute trajectory, paragraph 4; S3C Fig and legend
  quote: Monkey K was 73% correct after introducing the new entries versus 44% correct at beginning
    of the sessions; monkey S was 80% versus 55% correct ( S3C Fig , Wilcoxon, p = 0.01).
  statistics:
  - test: Wilcoxon
    p: 0.01
    n: 9 probe sessions for monkey S and 15 for monkey K
  expected:
  - quantity: monkey K, percent correct after new entries
    value: 73
    tolerance: 7.3
    unit: percent
  - quantity: monkey K, percent correct at beginning of session
    value: 44
    tolerance: 4.4
    unit: percent
  - quantity: monkey S, percent correct after new entries
    value: 80
    tolerance: 8
    unit: percent
  - quantity: monkey S, percent correct at beginning of session
    value: 55
    tolerance: 5.5
    unit: percent
  datasets:
  - crcns-hc-12
  criterion: Probe sessions are those that start from one or two entries (northeastern and
    southeastern) and later add the others (Results; S3C legend). Per session, percent correct
    over the 5 trials after the new entries are introduced and over the first 5 trials of the
    session (S3C legend). The test is a Wilcoxon signed-rank on paired session values; whether
    the two monkeys are pooled is open (the legend says "for both monkeys"); readings (a) the 24
    sessions pooled; (b) each monkey separately. Reproduced when the four means are within
    tolerance and, under one reading, the test gives p < 0.05 with performance higher after
    the new entries.
- id: probe-faster-criterion
  statement: In probe sessions, performance above the learning criterion was reached faster
    after the new entries (within 4 trials for monkey K and 2.7 for monkey S, against 14.8 and
    12.3).
  source: Results, Animals use direction and compute trajectory, paragraph 4
  quote: Further, performances above the learning criterion were reached significantly faster
    (within 4 trials for monkey K and within 2.7 trials for monkey S, compared to 14.8 and 12.3
    trials; Wilcoxon, p = 0.002).
  statistics:
  - test: Wilcoxon
    p: 0.002
  expected:
  - quantity: monkey K, trials to criterion after new entries
    value: 4
    tolerance: 0.4
  - quantity: monkey S, trials to criterion after new entries
    value: 2.7
    tolerance: 0.27
  depends_on:
  - learning-trials
  - probe-transfer
  datasets:
  - crcns-hc-12
  criterion: How trials to criterion after the new entries are counted is not stated. The
    learning criterion is the lower confidence bound exceeding 1/4 (S3B legend); on the
    session's running learning curve it is usually already met when the new entries come in
    (S3C legend, trials 37 and 60), so the curve is taken from the introduction on. Readings
    (a) a learning curve on all trials from the introduction of the new entries; (b) a learning
    curve on the trials from the new entries only; in each, the number of trials until the
    lower bound exceeds 1/4. Compared with the session's trials to criterion of
    learning-trials by a Wilcoxon test (signed-rank for paired sessions; rank-sum against all
    sessions as a variant). Reproduced when, under one reading, both means are within
    tolerance and the test gives p < 0.05 with fewer trials after the new entries.
- id: cells-recorded
  statement: Of 270 cells recorded in the right hippocampus (128 in monkey S, 142 in monkey K), 189
    fired more than 100 spikes per session and were analysed.
  source: Results, What is encoded in hippocampal cell activity, paragraph 1; Methods,
    Electrophysiological recordings
  quote: Of the 270 cells recorded in the full extent of the right hippocampus (128 cells in monkey
    S, 142 in monkey K; S4 Fig ), we focused on 189 cells that fired more than 100 spikes per
    session
  expected:
  - quantity: cells recorded
    value: 270
    tolerance: 27
  - quantity: cells with more than 100 spikes per session
    value: 189
    tolerance: 18.9
  datasets:
  - crcns-hc-12
  criterion: Counts of cells, per monkey and in total, and of cells with more than 100 spikes in
    the session (the new maze session, as the paper describes only new layouts). The site
    counts of the Methods (CA3 99, CA1 101, dentate gyrus 8) sum to 208, which matches neither
    count, and are reported from the recording locations for comparison only. The full cell
    selection is in S1 Appendix A3, not read.
- id: responsive-cells
  statement: 111 of the 189 cells (59%) had significant information content in at least one of
    the four coding spaces.
  source: Results, Sensitivity of the cells to a combination of variables, paragraph 2; Fig 3A
  quote: Significant IC ( p < 0.01) was present in at least one of the spaces for 111 out of the
    189 cells (59%, responsive cells).
  expected:
  - quantity: responsive cells
    value: 111
    tolerance: 11.1
  - quantity: fraction of analysed cells responsive
    value: 0.59
    tolerance: 0.059
  datasets:
  - crcns-hc-12
  criterion: Method W. For each cell and each space, normalized IC and its surrogate p-value; a
    cell is responsive when p < 0.01 in at least one space. Every reading of Method W is run.
    Reproduced when the count and fraction are within tolerance under one reading.
  depends_on:
  - cells-recorded
- id: state-space-most-responsive
  statement: The proportions of cells responsive to each space were unequal; the state space
    accounted for the most cells (84), and more cells were responsive to state space than to
    point of gaze.
  source: Results, Sensitivity of the cells to a combination of variables, paragraph 2; Fig 3A
  quote: The proportion of cells responsive to each space was significantly unequal (chi-squared
    test, p = 0.014). The state space accounted for the largest number (84 cells, Fig 3A ), and
    pitting state space against the other three, there were more cells responsive to state space
    than to point of gaze (chi-squared test, p = 0.012, Bonferroni corrected
  statistics:
  - about: proportions across the four spaces
    test: chi-squared test
    p: 0.014
  - about: state space against point of gaze
    test: chi-squared test
    p: 0.012
    corrected: Bonferroni
  expected:
  - quantity: cells with significant IC in state space
    value: 84
    tolerance: 8.4
  depends_on:
  - responsive-cells
  datasets:
  - crcns-hc-12
  criterion: Method W. Per space, the number of the 189 cells with IC p < 0.01. The chi-squared
    test's layout is not stated; readings (a) a 4 x 2 contingency test of responsive and not
    responsive counts across the four spaces, over the 189 cells; (b) the same over the 111
    responsive cells; (c) a goodness-of-fit test of the four counts against equal counts ("the
    proportion of cells responsive to each space was significantly unequal"). The pairwise tests
    are, under (a) and (b), the 2 x 2 tables of state space against each other space and, under
    (c), the goodness of fit of the two counts against equal counts, Bonferroni over three. Reproduced when the state-space count is within tolerance and
    the largest, and under one reading the overall test gives p < 0.05 and state space against
    point of gaze gives a corrected p < 0.05 with more state-space cells. The other pairwise
    comparisons were not significant in the paper; their p-values are reported.
- id: multi-space-coding
  statement: Sensitivity to the four variables was not mutually exclusive; most responsive cells
    carried significant activity in more than one coding space.
  source: Results, Sensitivity of the cells to a combination of variables, paragraph 2; Fig 3B
    legend
  quote: Most responsive cells carry significant activity in more than one coding space.
  depends_on:
  - responsive-cells
  datasets:
  - crcns-hc-12
  criterion: Method W. Among responsive cells, the number with significant IC (p < 0.01) in two or
    more spaces. Reproduced when it exceeds half of the responsive cells.
- id: direction-center-vs-periphery
  statement: For direction-selective cells, both information per spike and sparsity of
    directional firing were higher in the maze center than on the peripheral return paths.
  source: Results, Direction selectivity, paragraph 1; Fig 3C
  quote: Both IC and sparsity measures were significantly higher in the center, which is the choice
    point, when compared to return tracks (both p < 0.001).
  statistics:
  - about: IC, center against return paths
    p: 0.001
    p_relation: "<"
  - about: sparsity, center against return paths
    p: 0.001
    p_relation: "<"
  datasets:
  - crcns-hc-12
  criterion: Method W. Directional maps of each cell from time in the maze center and from time on
    return paths. Which cells enter is open; readings (a) cells with significant direction IC;
    (b) all responsive cells (Fig 3C legend, "the responsive cells"). The test is not named;
    it is taken as a Wilcoxon signed-rank test across cells of the paired normalized values, the
    test the Results use for the comparisons of Fig 3D to 3F, a deviation. Reproduced when, under one
    reading, IC and sparsity are both higher in the center with p < 0.001; partially reproduced
    when both are higher at p < 0.05 or one at p < 0.001.
- id: direction-tuning-not-maintained
  statement: Direction tuning was not maintained across positions; the correlation between
    directional tuning in the center and on return paths was significantly low in 20 of 56 cells
    (36%), more than chance, and significantly high in only 3, consistent with chance.
  source: Results, Direction selectivity, paragraph 1; Fig 3C inset
  quote: "the correlation between direction selectivity in the center and in the return paths was
    significantly lower in 20 out of 56 cells (inset in Fig 3C , blue bars). This represents 36% of
    the population and is higher than what is expected by chance ( p < 0.001, binomial test; note
    that correlation was only significantly higher in 3 cells, consistent with chance: p = 0.16,
    binomial test)"
  statistics:
  - about: cells with significantly low correlation
    test: binomial test
    p: 0.001
    p_relation: "<"
    n: 20 of 56 cells
  - about: cells with significantly high correlation
    test: binomial test
    p: 0.16
    n: 3 of 56 cells
  expected:
  - quantity: cells with significantly low center-periphery correlation
    value: 20
    tolerance: 2
  - quantity: cells tested
    value: 56
    tolerance: 5.6
  - quantity: cells with significantly high correlation
    value: 3
    tolerance: 0.3
  datasets:
  - crcns-hc-12
  criterion: Method W. Per cell, the uncentered correlation of center and return-path directional
