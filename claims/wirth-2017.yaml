  statement: Response latencies to the best landmark are left skewed when aligned on gaze and
    right skewed when aligned on landmark onset, and some cells respond before the landmark
    enters the field of view.
  source: Results, Visual exploration and hippocampal activity dynamics, paragraph 1; Fig 7F
  quote: The distribution of the latencies of the responses to the best landmark are left skewed
    when aligned on gaze and right skewed when aligned on landmark onset ( Fig 7F , see Materials
