- id: gaze-aligned-dynamics
  statement: Aligned on first foveation of the best-driving landmark, mean activity rose until
    the saccade to the landmark and peaked shortly after.
  source: Results, Visual exploration and hippocampal activity dynamics, paragraph 1; Fig 7E
  quote: Gaze-aligned activity significantly rose until the saccade to the landmark and peaked
    shortly after.
  datasets:
  - crcns-hc-12
  criterion: Per cell, the best-driving landmark (maximal activity; Methods, Latencies); foveation
    is gaze within plus or minus 10 degrees of the landmark in azimuth and elevation for more
    than 100 ms (Methods, Landmark foveation). Population mean rate aligned on the first
    foveation after the landmark appears. Which cells enter is open; readings (a) the responsive
    cells; (b) the 42 landmark-responsive cells of path-selectivity. No test or window is named
    for the rise; it is judged by a Wilcoxon signed-rank test across cells of the rate in the
    100 ms before foveation against the rate at -500 to -150 ms (the baseline of Methods,
    Latencies), and the peak of the mean must fall after 0 and within the 500 ms post-foveation
