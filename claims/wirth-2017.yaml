    p: 0.37
    n: 1 of 42 cells
  - about: viewpoint-dependent cells
    test: binomial test
    p: 0.001
    p_relation: "<"
    n: 12 of 42 cells
  - about: actual against surrogate index distributions
    test: Kolmogorov-Smirnov test
