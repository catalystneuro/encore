- id: figs1f-angle-awake-vs-anesthetized
  statement: >-
    Wall-induced change in whisker midpoint angle does not differ significantly between awake and
    anesthetized mice for the C1, C2 and Greek whiskers (paired t-tests across 4 mice, Bonferroni
    alpha 0.017); the mean awake minus anesthetized difference is 2.28 degrees.
  source: Results, A wall-passing paradigm, paragraph 2; Figure S1F legend
  quote: >-
    Awake mice showed similar bending angle (mean difference: 2.28°) and curvature (mean
    difference: 1.66 × 10 −5 mm −1 ) changes, with no significant differences from the
    anesthetized condition across whiskers
  statistics:
  - about: C1 whisker, awake against anesthetized
    test: two-tailed paired t-test across mice
    p: 0.03
    corrected: Bonferroni, alpha 0.017
    n: 4 mice
  - about: C2 whisker
    test: two-tailed paired t-test across mice
    p: 0.04
    corrected: Bonferroni, alpha 0.017
    n: 4 mice
  - about: Greek whisker
    test: two-tailed paired t-test across mice
    p: 0.0199
    corrected: Bonferroni, alpha 0.017
    n: 4 mice
  expected:
  - quantity: mean awake minus anesthetized change in midpoint angle
    value: 2.28
    tolerance: 0.228
    unit: degrees
  criterion: >-
    A claim of absence, judged on the paper's test (Methods, Data Analysis: Wall-Induced Whisker
    Retraction; FigS1_Stats.m). Per pass, the midpoint angle (Savitzky-Golay 21 frames, order 3,
    mean of the upper and lower envelopes) is averaged over 3 to 11 s minus its mean over -4.5 to
    0 s; per mouse, whisker and condition, averaged over distances and passes; for each whisker a
    two-tailed paired t-test across the 4 mice, significant at 0.05/3. Reproduced when no whisker
    reaches p < 0.0167; not reproduced when any does. The mean difference is reported for each
    whisker; the paper does not say whether 2.28 degrees is pooled over whiskers or for one, so
    the readings are the mean over the three whiskers and each whisker alone. The code
    (FigS1_Code.m) takes the midpoint as a 101-frame Savitzky-Golay smoothing of the twice
    21-frame-smoothed angle, with the envelope method commented out; this is the variant, shown,
    and the Methods' envelope midpoint is the main.
