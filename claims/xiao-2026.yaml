    each half. The paper gives no measure of stability. Readings: (a) the fraction of units whose
    preferred distance is the same in both halves; (b) the Spearman correlation of preferred
    distance across halves. Reproduced when, under both readings, the activated population is
    more stable than the suppressed population, and, within the suppressed population, units
