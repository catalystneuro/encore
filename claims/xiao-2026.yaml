- id: figs1d-bending-larger-closer
  statement: >-
    Under anesthesia the passing wall bends whiskers in the retraction direction, with larger
    angle changes and larger curvature changes at closer wall distances, so wall-induced bending
    grows roughly monotonically as the wall approaches.
  source: Results, A wall-passing paradigm, paragraph 2; Figure S1D, H
  quote: >-
    Under anesthesia, the moving wall pushed whiskers in the retraction direction, producing
    larger absolute bending angles ( Supplemental Figure S1D , right) and greater change in
    whisker curvature ( Supplemental Figure S1H , right) at closer wall distances
  criterion: >-
    The paper reports no test. Per distance, the across-mouse mean of the absolute change in
    midpoint angle and of the absolute change in curvature in the anesthetized condition
    (measures as in figs1f-angle-awake-vs-anesthetized). Reproduced when, for each of the two
    measures and each of the three whiskers, the value at 7 mm exceeds the value at 23 mm and the
    Spearman correlation between distance and value over the nine distances is negative. These
    two summaries are the readings of "larger ... at closer wall distances"; the outcome is the
    one both give. The cited panels (S1D and S1H, right) show one example C1 whisker in one
    mouse; the across-mouse curves per whisker are in S1F and S1J, which this criterion uses.
