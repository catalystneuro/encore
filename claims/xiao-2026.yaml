    wall passes, whereas the suppressed population is only partly reproducible, with only
    proximity-preferring responses stable.
  source: Results, PrV contains both proximity and map codes, paragraph 6; Figure S4E-F
  quote: >-
    The resulting distance-tuning heatmaps of the activated population revealed little changes in
    the preferred distance between cross-validated partitions ( Supplemental Figure S4E ). In
