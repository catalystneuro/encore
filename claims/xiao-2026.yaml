# Claims for Xiao, Severson et al. (2026), "Peri-head distance coding in the mouse brainstem",
# Neuron, doi:10.1016/j.neuron.2026.05.027, on dandiset 001687.
#
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the accepted author manuscript in PubMed Central (NIHMS2191201, PMC13336321), as
# fetched 2026-10-20 into paper/10.1016-j.neuron.2026.05.027.txt: main text, STAR Methods, the
# legends of Figures 1 to 6, and the supplement file NIHMS2191201-supplement-1.pdf (legends of
# Figures S1 to S6 and Tables S2 to S5). The version of record was not read. Tables S1 (mouse
# sex, age and figure assignments) and S6 (test statistics, degrees of freedom and p-values of
# all analyses) are named in the text but are not in the supplement file read; every number
# used below is in the main text, the legends or Tables S2 to S5. Figures were not opened.
#
# Code read: github.com/wanglab-neuro/2026_Xiao-Severson_Peri-head-distance at commit b1a9f3c
# (2026-08-21; archived as doi:10.5281/zenodo.20330279). It holds the original MATLAB scripts
# for Figures 1E, 2, 3, 4B-C, 5C-E, 6D, 6G-I, S1, S4I and S5A ("Manuscript figures/Original
# Matlab code"), Python helpers that read the deposited NWB files, the Python circuit model
# (PrV_simulation/simulate_prv.py), and a submodule (Processing, the spike-sorting pipeline;
# not read). The helper generate_deposition_tables.py reads, per NWB unit, the columns
# unit_label, wall_responsive, wall_tuned, activated, suppressed, tuning_type, pref_dist_index,
# pref_dist_mm, low_firing and trial_include, and a wall_tuning processing module with a
# distance_axis; so the deposit is meant to carry the paper's own unit labels. The repository's
# unit_tuning_summary.csv is derived from the deposit and was not read for these claims.
#
# Data the paper used (Methods, Results, Table and figure legends):
# - Wall-passing paradigm. Awake head-fixed mice on a linear treadmill, in the dark; a wall
#   moves anterior to posterior past the face at 10 mm/s; each pass about 14 s, onset at t = 0,
#   whisker contact typically 3 to 11 s. Wall distance is measured from the C2 follicle. Silicon
#   probe sessions: 7 to 23 mm in 2-mm steps (nine distances), 15 to 20 passes per distance,
#   randomly ordered. Analysis windows: baseline -4.5 to 0 s, wall pass 3 to 11 s; onset 2.5 to
#   4.5 s, sustained 4.5 to 9.5 s, offset 9.5 to 11.5 s. Distances are binned into nine 2-mm bins
#   centred on 7, 9, ..., 23 mm; sessions with fewer than nine distances are left out of
#   population analyses.
# - Wild-type silicon probe recordings (C57BL/6J): 1,358 units from 36 mice, 1,141 passing the
#   unit criteria (SNR of at least 5, ISI false-alarm rate at most 2% at 0.8 ms, firing above 1
#   Hz). This set includes the full-array part of the whisker-cutting sessions (the code merges
#   "naive" and pre-cut tables).
# - Whisker-cutting sessions (subset of the above): 195 units from 18 mice recorded with the full
#   array and then after cutting all but one whisker, in one continuous recording.
# - SpVi-TeLC (vGat-Cre, AAV-FLEX-TeLC in caudal SpVi, recorded 10 to 15 days later): 665 units
#   from 11 mice, 587 passing the criteria.
# - PrV GtACR optogenetics (vGat-Cre, N = 2): 112 units; distances 7 to 23 mm in 4-mm steps,
#   laser on and off passes interleaved, light during the whole pass.
# - Tungsten single-electrode recordings: 46 units from 14 mice, C-row whiskers only, distances
#   4 to 20 mm in 1-mm steps, 10 to 20 passes per distance.
# - High-speed video (500 Hz): 4 mice with a single whisker row, awake then anesthetized (20
#   passes per distance, 7 to 23 mm); and whisker-array midpoint angle in 15 wild-type sessions
#   (6 mice) and 15 SpVi-TeLC sessions (6 mice).
# - Measured variables: spike times of sorted units, wall pass start and end times (from the
#   stepper-motor signal), wall distance per pass, laser condition, cutting condition, whisker
#   angle and curvature from video.
# The dandiset's description names baseline recordings and the multi-whisker, local-inhibition
# and long-range-inhibition perturbations, processed and raw NWB files; whether the tungsten and
# video data are there is for the author to find.
#
# Method choices fixed here (each claim cites them), from the Methods and, where the Methods
# are silent, from Fig2DEF_Pop_Heatmap_Hist_Pie.m (same procedure in Fig5CE_TeLC_heatmap_stacked_bar.m):
# - Per pass, the wall firing rate is the mean rate from 3 to 11 s and the baseline rate the
#   mean rate from -4.5 to 0 s after wall-movement onset (Methods, Wall Distance Tuning Curve
#   Calculation).
# - Unit inclusion: SNR and false-alarm criteria (Methods); the code drops a unit as low-firing
#   when both its largest per-distance mean wall rate and its mean baseline rate are below 1 Hz.
# - Wall-activated or wall-suppressed: at each distance, one-tailed Wilcoxon signed-rank test of
#   the pass's wall rate against its own baseline rate, p < 0.05 (Methods, no correction named,
#   while the same paragraph names BH-FDR for the tuning test). The code corrects the nine
#   p-values of each direction with Benjamini-Hochberg (BH-FDR) and uses q < 0.05. Methods and
#   code disagree, so the Methods' uncorrected p < 0.05 is the main reading, on which claims are
#   judged, and the code's BH-FDR is the variant, shown. Wall-responsive means activated or
#   suppressed.
# - Distance-tuned: two-tailed Wilcoxon signed-rank tests between all 36 pairs of distances,
#   BH-FDR corrected, any q < 0.05 (Methods). The code pairs the k-th pass at one distance with
#   the k-th pass at the other.
# - Preferred distance: the distance of the maximum of the unit's mean tuning curve (code: the
#   z-scored curve, which has the same maximum).
# - Proximity unit: activated, tuned, preferred distance 7 mm. Map unit: activated, tuned,
#   preferred distance at least 9 mm, and at least one of the eight one-tailed signed-rank tests
#   (distance d above 7 mm) significant after BH-FDR across the eight (Methods; Figure S4H
#   legend; code). Ambiguous: activated, tuned, preferred at least 9 mm, no significant test.
#   Suppressed-only: tuned, suppressed, never activated. Untuned: wall-responsive and not
#   distance-tuned (Methods; code).
# - Population decoding (Methods; Fig3ABC_Decoder_Accuracy_Time_Confusion_Avg.m): maximum
#   correlation coefficient classifier of the Neural Decoding Toolbox on a pseudo-population;
#   spike counts in 150-ms windows stepped by 50 ms from 0 to 14 s; 15 passes per distance,
#   resampled 5 times; z-score feature normalisation (code; Methods silent); subpopulations of
#   118 units drawn 10 times without replacement (the combined group 36 map and 82 proximity
#   units); a shuffled group from map and proximity units with the passes' distance labels
#   scrambled; accuracy per distance is the true-positive rate, averaged over the time bins
#   starting within 3 to 11 s; overall accuracy is the mean over the nine distances (Table S2,
#   "Average"). Cross-validation is 10-fold in the Methods and 15 splits (one pass per distance
#   held out) in the code: the Methods' 10-fold is the main reading, the code's the variant.
#   Group comparisons per distance are Wilcoxon rank-sum tests on the 10 subsample values,
#   BH-FDR across the nine distances (Methods; Figure 3C legend; code).
#
# Inconsistencies in the paper, noted where they bear on a claim: 472 activated + 213 suppressed
# - 29 both = 656 tuned implies 184 suppressed-only and 112 untuned, but Figure 2F gives 119 and
# 177 (fig2f-tuning-categories); the Figure 4B legend gives 11.58 +/- 2.986 sp/s where the text
# gives +/- 1.338; the Figure S6J legend prints p = 3.98 x 10^-3 for the TeLC untuned baseline
# where the text prints 3.98 x 10^-5; the Methods describe the +/- of firing-rate comparisons as a
# bootstrap 95% CI half-width while the Figure S4 legends call it SEM; Figure 3C plots mean +/-
# SEM while Tables S2 and S3 give mean +/- 95% CI; the Methods correct per-unit whisker-cutting
# tests with Bonferroni in one place and BH-FDR in another, and the Results print p < 0.05.
