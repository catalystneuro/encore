# Claims for DeWeese & Zador (2004), J Neurophysiol 92:1840-1855, on CRCNS data set ac-2.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-04,
# protocol as stated in docs/protocol.md (Reader).
#
# Text read: the version of record, as supplied under paper/ (PyMuPDF text of the journal PDF),
# with its Methods, Results, Discussion and the legends of Figures 1 to 8. The paper has no
# supplement. It links no analysis code, so none was read. The PDF could not be rendered here,
# and the extracted text prints the signs =, <, >, the minus sign and plus/minus as a
# replacement character. The check of 2026-11-04 read these signs from the PDF's font
# encodings (Universal-GreekwithMathPi and MathematicalPi-One glyph names in the PDF's
# Differences arrays): values printed as "a ? b" are mean plus/minus SE; the correlation
# coefficients are negative ("= -0.14", "= -0.22"); the variability index ranges "from < 1 to
# > 10 mV"; the Figure 3B bins are "1 mV < q < 2 mV" and "4 mV < q < 12 mV"; the large
# responses are those with mean responses of at least 15 mV ("of >= 15 mV"); the LFP CV test
# gives "P = 0.5"; the access resistance groups are "R-series > median = 4.2" (17 cells) and
# "R-series < median = 4.9" (16 cells); the small total variability in the Figure 7A text is
# "already small (approx. 1 mV)".
#
# Data the paper used. Sprague-Dawley rats, 17 to 24 days old, anesthetized with
# pentobarbital (13 neurons), pentobarbital and diazepam (3) or urethane after
# ketamine/medetomidine surgery (17). In vivo whole-cell current-clamp recordings in the left
# auditory cortex at depths of 180 to 834 um, with QX-314 (5 mM) in the pipette, sampled at
# 4 kHz; a simultaneous LFP from a second patch electrode about 0.5 mm away, at about 0.55 mm
# depth. Stimuli: 25-ms pure tones of 32 frequencies, log spaced from 2 kHz to 46,731 Hz,
# 5-ms cosine-squared ramps, 65 dB, in a fixed pseudorandom order at 2 tones/s. 33 neurons from
# 21 animals passed inclusion (stable for at least 10 repetitions of each tone, rest potential
# at or below -55 mV after a 12 mV junction potential correction, at least one tone with a mean
# response above 3 mV), with 10 to 63 repetitions per tone; 29 of them had a stable LFP and
# enter the LFP-based analyses. Separately, 6 neurons recorded after topical TTX (1.0 mM; no
# QX-314) gave miniature EPSPs. The measured variables are the tone-evoked PSP height, the LFP
# height and shape, and spontaneous events before the stimulus.
#
# The CRCNS data set, by its title and description, holds 33 anesthetized whole-cell
# recordings with LFP for many of them (the variability data of this paper), the six TTX
# recordings (this paper's mEPSPs) and one awake recording that belongs to a later paper
# (DeWeese and Zador 2006) and is used by no claim here.
#
# Method details, all from the Methods unless stated. Variability index q = variance / mean of
# the PSP heights for one neuron and tone. PSP height = the peak value of the trace in the 10-ms
# window centred on the peak of the trial-averaged PSP minus the mean of the trace in the 15 ms
# before stimulus onset; LFP heights are taken against the same 15-ms baseline. Trials with a
# spike are excluded. Tones enter only with at least 10 trials and a mean PSP height above
# 3 mV. <q>tones is the mean over a neuron's included tones; <q>neurons is the mean over
# neurons, given with the SE across neurons. Culling: for each trial the tone's mean trace
# (LFP for LFP-based culling, whole-cell trace for PSP-based culling) is scaled by
# f = (x, y)/(x, x) over a 100-ms window starting 15 ms before onset; trials whose rms error
# to the scaled mean exceeds 0.35 times the peak-to-trough height of the tone's mean response
# are removed, and so are trials with a negative LFP scale factor. Estimation: a linear
# regression of PSP height on the LFP scale factor over the trials left after LFP-based
# culling, the variance in q replaced by the sum of squared residuals over N - 1. Overfitting
# correction: the estimation is repeated with the PSPs shuffled against the LFPs, and the
# reduction this gives is added back. The best estimate of private variability is PSP-based
# culling, then LFP-based culling, then estimation (Figure 6 legend).
#
# Details the paper leaves open, used by several claims (each claim names those it rests on):
# (1) the window searched for the peak of the trial-averaged PSP (the Figure 2 neuron peaks
# 27 to 42 ms after onset); readings (a) the whole trace after onset, (b) the 100-ms window
# used for culling. (2) The span over which the peak-to-trough height of the mean response is
# taken; readings (a) the 100-ms culling window, (b) the whole trace. (3) Whether the variance
# in q is over N - 1 (as the estimation step states) or N; N - 1 is used, N shown as a variant.
# (4) Whether the negative scale factor rule applies to PSP-based culling too ("The same
# procedure was used for PSP-based culling"); readings (a) yes, (b) LFP-based culling only.
# (5) Whether the 3 mV and 15 mV tone criteria use the mean height before or after culling;
# readings (a) before, (b) after. (6) How spikes are detected; a standard threshold on the
# whole-cell trace (a fast rise to above -20 mV), which can change only the few trials with
# spikes. (7) How many shuffles the overfitting correction uses and whether it is applied per
# tone or per neuron; the paper's example corrects per neuron (0.02 mV), so per neuron with
# the mean over 20 shuffles, a standard choice, and per tone shown as a variant.
