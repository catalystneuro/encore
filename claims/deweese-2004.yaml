  criterion: CV = SD / mean of PSP heights per tone, averaged as q is. For the private CV the
    paper does not say how the estimation step enters the CV; read as the square root of the
    residual variance (over N - 1) divided by the mean height. The test of "significantly
    lower" is not named; readings (a) Student's t-test between the 16 and 28 neuron values, as
    the paper uses elsewhere, (b) a paired t-test over the 16 neurons in both sets. The p
    bound of 0.05 is assumed from the word "significantly". Reproduced when the four values
    hold and the private difference is significant under one reading; partially reproduced
    when the values hold and the test does not.
- id: lfp-cv-not-different
  statement: The LFP recorded with the more variable neurons is not more variable than that
    recorded with the less variable neurons (CV 0.66 against 0.74, P = 0.5), so differences in
    total variability are not explained by gross state differences seen in the LFP.
  source: Results, Partitioning variability based on the LFP, paragraph 8
  quote: We therefore compared the CV of a simultaneously recorded LFP of the more variable
    neurons (CV �0.66 �0.06; n �14 neurons; mean �SE) and the less variable neurons (CV �0.74
    �0.09; n �15 neurons). We found no significant difference (P �0.5; Student's t-test)
  statistics:
  - test: Student's t-test
    p: 0.5
    n: 14 more variable and 15 less variable neurons
  expected:
  - quantity: LFP CV, more variable neurons
    value: 0.66
    tolerance: 0.06
  - quantity: LFP CV, less variable neurons
    value: 0.74
    tolerance: 0.09
  criterion: A claim of absence, judged on Student's t-test (two-sided, equal variance) at
    p < 0.05; reproduced when it does not find a difference. The split is not defined; read
    as the 29 neurons with LFP ranked by total <q>tones, the 14 highest as more variable and
    the 15 lowest as less variable, as the counts suggest. The LFP CV is read as SD / mean of
    the LFP height (against the 15-ms baseline, at the LFP peak in the culling window) over
    trials, per tone, averaged over the neuron's included tones; the LFP gain correction of
    the data set cancels in a CV. The CV of the LFP scale factor is shown as a variant. The
    group means and the size of the difference are reported either way.
- id: anesthesia-comparison
  statement: Total variability does not differ significantly between the three anesthesia
    protocols (pentobarbital 3.7, pentobarbital with diazepam 6.1, urethane 5.0 mV), and
    private variability differs slightly but significantly between pentobarbital alone (1.1
    mV) and urethane (2.2 mV).
  source: Methods, Surgery, paragraph 1
  quote: We found no significant difference between the neuronal variability observed during
    these 3 protocols (pentobarbital alone ... and only a small, although statistically
    significant, difference in the private component of the variability for pentobarbital
    alone and urethane
  expected:
  - quantity: q total, pentobarbital alone
    value: 3.7
    tolerance: 0.7
    unit: mV
  - quantity: q total, pentobarbital and diazepam
    value: 6.1
    tolerance: 2.8
    unit: mV
  - quantity: q total, urethane
    value: 5.0
    tolerance: 0.6
    unit: mV
  - quantity: q private best estimate, pentobarbital alone
    value: 1.1
    tolerance: 0.1
    unit: mV
  - quantity: q private best estimate, pentobarbital and diazepam
    value: 1.5
    tolerance: 0.6
    unit: mV
  - quantity: q private best estimate, urethane
    value: 2.2
    tolerance: 0.3
    unit: mV
  depends_on:
  - total-variability-population
  - fig7b-private-best-estimate
  criterion: Groups by the anesthetic recorded for each neuron, with group sizes 13, 3 and 17
    (the Methods' "17" pentobarbital recordings including 3 with diazepam does not add up with
    these n; the n given with the values are followed). Tolerances are the paper's SE. No test
    is named for either comparison. The absence is judged with readings (a) a one-way ANOVA
    over the three groups, (b) Kruskal-Wallis over the three groups, at p < 0.05; the private
    difference with (a) Student's t-test, (b) Mann-Whitney, pentobarbital alone against
    urethane, at p < 0.05. Reproduced when the group values hold, no reading finds a total
    difference, and one reading finds the private difference; partially reproduced when the
    values hold and one of the tests does not.
- id: fig8-spontaneous-veto
  statement: The size of spontaneous activity before the stimulus is anticorrelated with the
    evoked PSP, in the LFP (mean correlation -0.14, 29 neurons) and in the whole-cell record
    (-0.22, 33 neurons), the whole-cell correlation being negative in 30 of 33 neurons.
  source: Results, Spontaneous events veto evoked responses, paragraph 1; Figure 8C and 8D
  quote: there was a systematic negative correlation (correlation coefficient ��0.14 �0.02; n
    �29 neurons). Furthermore, we found that the magnitude of spontaneous subthreshold membrane
    potential events preceding the stimulus was anticorrelated with the strength of tone-evoked
    responses in 91% (30/33) of the neurons in our sample (correlation coefficient ��0.22 �0.03;
    n �33 neurons; Fig. 8, c and d).
  expected:
  - quantity: mean correlation, prestimulus LFP magnitude against PSP height
    value: -0.14
    tolerance: 0.02
  - quantity: mean correlation, prestimulus whole-cell event against PSP height
    value: -0.22
    tolerance: 0.03
  - quantity: neurons with a negative whole-cell correlation
    value: 30
    tolerance: 3
    unit: neurons of 33
  criterion: The spontaneous event is "the maximum spontaneous event during the 100 ms preceding
    each stimulus presentation" (Figure 8C legend), measured on the continuous sweeps, as
    each stored tone trace begins only 15 ms before onset. Its size is open; readings (a) the
    maximum of the trace in the 100 ms minus its minimum, (b) the maximum depolarization
    (whole cell) or largest absolute deflection (LFP) relative to the mean of that 100 ms.
    How a neuron's correlation is formed is open; readings (a) Pearson correlation per tone,
    averaged over the neuron's included tones, (b) one Pearson correlation over all included
    trials of the neuron with PSP heights normalized by the tone's mean. Evoked strength is
    the PSP height of the Methods; trials are not culled. Tolerances are the paper's SE.
    Reproduced when, under one combination of readings, both means and the count hold;
    partially reproduced when both means are negative and one value is out of tolerance.
- id: overfitting-correction-example
  statement: For the Figure 5 neuron, the shuffle control attributes 0.02 mV to overfitting of
    the linear estimator, and the corrected value after both cullings and estimation is 0.57
    mV.
  source: Methods, LFP-based estimation procedure, paragraph 2
  quote: the shuffling estimation control reduced the variability index for the neuron shown in
    Fig. 5 from �qLFP-culled,PSP-culled�tones �0.76 mV to
    �qLFP-culled,PSP-culled,shuffled,estimation�tones �0.74 mV, so about 0.02 mV was attributed
    to overfitting.
  expected:
  - quantity: <q LFP-culled,PSP-culled>tones, Figure 5 neuron
    value: 0.76
    tolerance: 0.076
    unit: mV
  - quantity: <q LFP-culled,PSP-culled,shuffled,estimation>tones
    value: 0.74
    tolerance: 0.074
    unit: mV
  - quantity: <q LFP-culled,PSP-culled,estimation>tones, uncorrected
    value: 0.55
    tolerance: 0.055
    unit: mV
  - quantity: <q LFP-culled,PSP-culled,estimation>tones, corrected
    value: 0.57
    tolerance: 0.057
    unit: mV
  depends_on:
  - fig5b-residual-lfp-psp-correlation
  criterion: The Figure 5 neuron as identified in fig5b-residual-lfp-psp-correlation (63
    trials of a tone). Open detail 7 applies. Reproduced when the four values hold; partially
    reproduced when the corrected value holds and another does not.
- id: private-shared-ranges
  statement: The private component of the variability is small, about 1 to 3 mV, and relatively
    homogeneous across neurons, while the shared component is often much larger and more
    heterogeneous, ranging from about 0 to 10 mV.
  source: Discussion, paragraph 1; Figure 7C
  quote: We found that the private component was surprisingly small, about 1–3 mV, and
    relatively homogeneous across the population. The shared component was often much larger,
    and showed more heterogeneity across the population, ranging from about 0 to 10 mV.
  depends_on:
  - fig7b-private-best-estimate
  - total-variability-population
  criterion: Per neuron, private = the best estimate of fig7b; shared = total <q>tones minus
    private (Eq. 1). Whether total is taken over all included tones or over the tones kept
    for the private estimate is open; both are shown. "About 1-3 mV" holds when at least 80%
    of the 28 neurons have a private value between 0.9 and 3.3 mV (the range widened by 10%
    of each bound); "about 0 to 10 mV" holds when the shared values lie within -1 to 11 mV,
    allowing 1 mV about each end as the paper says "about". "More heterogeneous" holds when
    the SD of shared values across neurons exceeds that of private values. Reproduced when all
    three hold; partially reproduced when two do.
- id: quantal-comparison
  statement: In 14 of 33 neurons at least one tone elicits responses whose variability index is
    within a factor of 2 of the 0.38 mV expected from stochastic release alone.
  source: Results, Comparison to the contribution from stochastic synaptic release, paragraph 4
  quote: For 42% (14/33) of the neurons, at least one tone elicited responses whose variability
    index q was within a factor of 2 of the 0.38 mV expected from stochastic release alone.
  expected:
    quantity: neurons with a tone whose q is within a factor of 2 of 0.38 mV
    value: 14
    tolerance: 1.4
    unit: neurons of 33
  depends_on:
  - mepsp-size
  criterion: Total q per included tone, without culling. Readings, as the paper does not say
    (a) whether "within a factor of 2" means q at most 0.76 mV or between 0.19 and 0.76 mV,
    (b) whether the reference is 0.38 mV, as here, or the 0.39 mV of the mEPSP mean reported
    above it. Reproduced when the count holds under one reading.
- id: mepsp-size
  statement: Miniature EPSPs recorded in vivo after TTX have a mean size of 0.39 mV with a CV of
    0.36 across 6 neurons, consistent with in vitro estimates.
  source: Results, Comparison to the contribution from stochastic synaptic release, paragraph 2
  quote: Our estimate of the distribution of mEPSPs in vivo (Qmini �0.39 �0.08 mV; n �6
    neurons) is consistent with some previous estimates (0.35 mV) ... The width of the
    distribution of mEPSPs sizes (CV �0.36 �0.03; n �6 neurons)
  expected:
  - quantity: mean mEPSP size Qmini, mean over 6 neurons
    value: 0.39
    tolerance: 0.08
    unit: mV
  - quantity: CV of mEPSP sizes, mean over 6 neurons
    value: 0.36
    tolerance: 0.03
  criterion: The paper gives no detection method for mEPSPs; detector, threshold, and the
    measure of size (peak against a local baseline) are open, and the author states the
    standard choices used, which could change the outcome since a detection threshold
    truncates the distribution (the Discussion notes truncation of the miniature
    distribution). Readings to run, at minimum (a) a template-matching detector, (b) a
    threshold on the derivative of the filtered trace, each with a threshold set at a stated
    multiple of the noise SD. Per neuron, the mean and CV of event sizes; then the mean over
    the 6 neurons. One TTX recording in the data set has a stated gain correction to apply.
    Tolerances are the paper's SE. The outcome rests on the assumed detector.
- id: recording-properties
  statement: Each tone was presented 18 times on average (10 to 63) per neuron; rest potential
    ranged from -58 to -92 mV (median -70) after junction potential correction, and input
    resistance from 19 to 141 MOhm (median 64).
  source: Methods, LFP and whole cell patch-clamp recording, paragraph 3
  quote: We presented 18 �2 repetitions (mean �SE, n �33 neurons; range �10 to 63 repetitions)
    of each tone to every neuron that was used in our variability analysis.
  expected:
  - quantity: repetitions per tone, mean over neurons
    value: 18
    tolerance: 2
    unit: repetitions
  - quantity: fewest repetitions per tone
    value: 10
    unit: repetitions
  - quantity: most repetitions per tone
    value: 63
    unit: repetitions
  - quantity: rest potential, median over neurons
    value: -70
    tolerance: 7
    unit: mV
  - quantity: input resistance, median over neurons
    value: 64
    tolerance: 6.4
    unit: MOhm
  criterion: Repetitions per neuron read as the number of complete presentations of each tone,
    and as the mean over tones of trials per tone, as a variant. The ranges hold within each
    bound widened by 10% (repetitions 9 to 69.3; rest potential -52.2 to -101.2 mV; input
    resistance 17.1 to 155.1 MOhm). Rest potential corrected by the paper's 12 mV junction
    potential (the data set's notes give 10 mV, shown as a variant); how it is measured
    (mean of the sweep outside the prepulse, or of the 15-ms baselines) is open and both are
    shown. Input resistance from the prepulse steps (step size and timing per neuron from the
    data set's notes); the steady-state window is open and the last 20% of the step is a
    standard choice. Reproduced when the repetition values and both ranges hold.
- id: access-resistance-depth-no-effect
  statement: Response variability is not correlated with access resistance (4.2 against 4.9 mV
    on either side of the 60 MOhm median) and does not vary systematically with recording
    depth.
  source: Methods, LFP and whole cell patch-clamp recording, paragraphs 2 and 3; Results,
    Trial-to-trial response variability, paragraph 2
  quote: We found no correlation between response variability and access resistance
    (qR-series�median �4.2 �0.7 mV, n �17 cells; qR-series�median �4.9 �0.7 mV, n �16 cells;
    median access resistance �60 M�). ... Variability showed no systematic dependency on
    recording depth.
  expected:
  - quantity: <q>neurons, access resistance above the median (17 cells)
    value: 4.2
    tolerance: 0.7
    unit: mV
  - quantity: <q>neurons, access resistance below the median (16 cells)
    value: 4.9
    tolerance: 0.7
    unit: mV
  - quantity: median access resistance
    value: 60
    tolerance: 6
    unit: MOhm
  criterion: A claim of absence. The paper names no test; access resistance is the value the
    data set records at the start of each recording, and depth is the recorded manipulator
    travel divided by the square root of 2, as the data set's notes give it. The PDF's signs
    put the 17 cells with access resistance above the median at 4.2 mV and the 16 below it at
    4.9 mV; with 33 cells the median cell's side is not stated, so both placements of it are
    shown. Readings for the test, at p < 0.05,
    (a) Pearson correlation of total <q>tones with access resistance, and with depth, over 33
    neurons, (b) Spearman correlation. Reproduced when neither reading finds a correlation for
    either variable and the group values hold; the correlations are reported either way.
