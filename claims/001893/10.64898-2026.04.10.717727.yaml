    in sub-coeruleus.
  source: Results, LC-NE projections are spatially organized, paragraph 1; Figure 1a, 1b, Figure S1
  quote: We defined LC in the CCF as a small dorsal region (0.13 mm 3 in volume) containing
    approximately two-thirds of all pontine NE neurons (67th density percentile, 1507 ± 55, mean ±
