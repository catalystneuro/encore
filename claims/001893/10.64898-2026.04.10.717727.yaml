# Claims for "Topographic structure and function of locus coeruleus norepinephrine neurons"
# (Allen Institute; bioRxiv doi:10.64898/2026.04.10.717727, preprint version 1) on dandiset 001893.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21, under
# docs/protocol.md as it stands (version pilot-10).
#
# Text read: the preprint, version 1, full text from the bioRxiv JATS XML (paper/
# 10.64898-2026.04.10.717727.txt): Results, Discussion, Methods, the legends of Figures 1 to 6 and
# of Supplementary Figures S1 to S18. There is no separate supplement file; the supplementary
# figures exist in this text as legends only, and no PDF was supplied, so no panel was seen. The
# extraction lost the display equations of the Methods and the contents of Table 1.
#
# The dandiset ("Patch-seq profiling of mouse locus coeruleus norepinephrine neurons", NWB and
# BIDS, intracellular electrophysiology) is meant to hold the Patch-seq experiment only: Results,
# Spatial variation of LC-NE activity during action-outcome learning, paragraph 5, and Figure
# S14j and S14k. The claims on that experiment carry criteria. The paper's other findings (anatomy,
# transcriptomics, in vivo physiology) are listed for coverage without criteria, as this dandiset
# is not described as holding those data; the in vivo data are dandiset 001950, whose claims file
# carries their criteria.
#
# Code read (Data and code availability names the index repository):
# - github.com/AllenNeuralDynamics/locus_coeruleus_norepinephrine_neurons, commit 43f7083: an index
#   of 16 Code Ocean capsules. Capsule 13, LCNE-patchseq-figures, is the Patch-seq code.
# - github.com/AllenNeuralDynamics/LCNE-patchseq-figures, commit 79fa20a (2026-10-07): makes
#   Figure S14j and S14k from DANDI:001893 version 0.260817.1647 (96 NWB files under
#   sourcedata/raw/*/*_icephys.nwb, one per ephys_roi_id; donor and projection target from the
#   dandiset's participants.tsv columns donor_local_id and injection_target_region, with targets
#   named "Cortex", "Cerebellum" and "Spinal cord"). Its tests expect 54 spinal cord, 27 cortex and
#   15 cerebellum cells. It computes the action potential waveform measure as PC1 of averaged
#   spike waveforms (code/spikes.py), reads the membrane time constant from a frozen table of
#   per-cell IPFX values (code/data/LCNE_patchseq_S14_cell_table.csv, ipfx_tau converted to ms;
#   missing for 14 of the 96 cells), and tests four contrasts with two-sided Welch t-tests at the
#   cell level (code/generate_S14jk.py, write_projection_statistics). The table's values were not
#   read for this file, only its columns.
# - github.com/AllenNeuralDynamics/LCNE-patchseq-analysis, commit 1190697: the wider analysis
#   package. Its ipfx_tau comes from the Allen Institute's internal LIMS database and spreadsheet,
#   so the IPFX settings used for the time constant are not in public code.
#
# Data the paper used for the Patch-seq claims (Methods, Patch-seq; Results paragraph 5):
# heterozygous Dbh-Cre mice crossed with homozygous Ai65 mice, injected at P28 to P30 with
# AAVrg pEF1a-DIO-FLPo into frontal cortex or cerebellar cortex (right hemisphere) or spinal cord
# (C4 to C5, bilateral), so that retrogradely labelled LC-NE neurons express tdTomato; about 21
# days later, acute 350 um coronal or sagittal slices from male and female mice aged P50 to P74.
# Whole-cell current clamp at 34 C with kynurenic acid and picrotoxin in the bath, Bessel filter 10
# kHz, sampled at 50 kHz, voltages not corrected for the -14 mV liquid junction potential, a bias
# current holding the initial resting potential. Cell inclusion (Methods): seal > 1 GOhm before
# break-in, initial access resistance < 20 MOhm and < 15% of input resistance. Sweep inclusion
# (Methods): bridge balance < 20 MOhm and < 15% of input resistance; bias current within +-100 pA;
# RMS noise < 0.07 mV in a 1.5 ms window and < 0.5 mV in a 500 ms window. Features by the IPFX
# Python package. The nucleus was then extracted and sequenced (SMART-seq v4, counts per million).
# 96 cells from 28 mice: frontal cortex 27 cells (8 mice), cerebellar cortex 15 (7), spinal cord
# 54 (13). Stimulus sweeps, as the code names them: long-square rheobase (X3LP_Rheo_DA_0,
# X5LP_Rheo_DA_0), subthreshold (X1PS_SubThresh_DA_0) and suprathreshold (X4PS_SupraThresh_DA_0).
#
# Discrepancies and open details, named in the criteria: the legend of Figure S14k calls the tests
# "paired t-tests", which cannot pair cells from different groups of unequal size; the code runs
# two-sided Welch t-tests, followed here, with Student's t-test as a variant. The code does not
# apply the Methods' sweep inclusion criteria; the Methods are the main reading, the code a
# variant. The IPFX version and settings for the time constant are not given.
schema_version: 2
dataset:
  archive: dandi
  id: "001893"
paper: doi:10.64898/2026.04.10.717727
claims:
- id: patchseq-cohort
  statement: The whole-cell recordings comprise 96 LC-NE neurons from 28 mice, retrogradely
    labelled from frontal cortex (27 cells, 8 mice), cerebellar cortex (15 cells, 7 mice) or spinal
    cord (54 cells, 13 mice).
  source: Results, Spatial variation of LC-NE activity during action-outcome learning, paragraph 5
  quote: we made whole-cell patch clamp recordings from LC-NE neurons in brain slices (96 cells, 28
    mice). We retrogradely labeled neurons from frontal cortex (27 cells, 8 mice), cerebellar cortex
    (15 cells, 7 mice), or spinal cord (54 cells, 13 mice)
  expected:
  - quantity: cells
    value: 96
    tolerance: 9.6
  - quantity: mice
    value: 28
    tolerance: 2.8
  - quantity: cells projecting to frontal cortex
    value: 27
    tolerance: 2.7
  - quantity: mice, frontal cortex
    value: 8
    tolerance: 0.8
  - quantity: cells projecting to cerebellar cortex
    value: 15
    tolerance: 1.5
  - quantity: mice, cerebellar cortex
    value: 7
    tolerance: 0.7
  - quantity: cells projecting to spinal cord
    value: 54
    tolerance: 5.4
  - quantity: mice, spinal cord
    value: 13
    tolerance: 1.3
  criterion: Cells are the dandiset's recorded neurons (one NWB file per ephys_roi_id in the
    code); mice are distinct donors and the target is the injection target, both from the
    dandiset's subject metadata (the code reads donor_local_id and injection_target_region in
    participants.tsv). Reproduced when every count is within tolerance; partially reproduced when
    the total cells and the three cell counts are, but a mouse count is not.
- id: figs14k-waveform-spinal-vs-cortex
  statement: In slices, the action potential waveforms of LC-NE neurons projecting to spinal cord
    differ significantly from those of neurons projecting to isocortex (p < 0.01).
  source: Results, Spatial variation of LC-NE activity during action-outcome learning, paragraph 5;
    Figure S14k, left, legend
  quote: Neurons projecting to spinal cord had significantly different action potential waveforms
    than those projecting to isocortex or cerebellum
  statistics:
  - about: action potential waveform, spinal cord against cortex
    test: paired t-test
    p: 0.01
    p_relation: "<"
    n: 54 spinal cord and 27 cortex cells
  depends_on:
  - patchseq-cohort
  criterion: The measure is fixed by the code (LCNE-patchseq-figures, code/spikes.py), as the paper
    says only "action potential waveforms". Per cell, among long-square rheobase sweeps
    (X3LP_Rheo_DA_0 and X5LP_Rheo_DA_0) whose main stimulus pulse lasts at least 0.8 s, the sweep
    with the smallest absolute amplitude that has a spike peak during the pulse; peaks found as
    the code does (voltage interpolated at the sampling interval, pairs of strict upward and
    downward crossings of -10 mV, the maximum between them); the raw voltage from -5 to 10 ms
    around every peak of that sweep, averaged. Each average is min-max normalised over -2 to 4
    ms; PCA (mean-centred, by SVD) over -3 to 6 ms across all cells; PC1 per cell. The legend's
    "paired" t-test cannot apply to two groups of different cells of unequal size; the code's
    two-sided Welch t-test of PC1, spinal cord against cortex cells, is the test, and Student's
    two-sample t-test is shown as a variant. Cells and sweeps follow the Methods' inclusion
    criteria (sweep criteria applied before choosing the rheobase sweep, where the dataset holds
    the values they need); the code's choice, all 96 cells and no sweep criteria, is a variant.
    Reproduced when the Welch test gives p < 0.01; partially reproduced when 0.01 <= p < 0.05;
    not reproduced otherwise. The group means and SDs of PC1 are reported.
- id: figs14k-waveform-spinal-vs-cerebellum
  statement: In slices, the action potential waveforms of LC-NE neurons projecting to spinal cord
    differ significantly from those of neurons projecting to cerebellum (p < 0.05).
  source: Results, Spatial variation of LC-NE activity during action-outcome learning, paragraph 5;
    Figure S14k, left, legend
  quote: Neurons projecting to spinal cord had significantly different action potential waveforms
    than those projecting to isocortex or cerebellum
  statistics:
  - about: action potential waveform, spinal cord against cerebellum
    test: paired t-test
    p: 0.05
    p_relation: "<"
    n: 54 spinal cord and 15 cerebellum cells
  depends_on:
  - patchseq-cohort
  - figs14k-waveform-spinal-vs-cortex
  criterion: PC1 as in figs14k-waveform-spinal-vs-cortex (the same PCA over all included cells),
    with the same readings and variants. Two-sided Welch t-test of PC1, spinal cord against
    cerebellum cells. Reproduced when p < 0.05; not reproduced otherwise. The group means and SDs
    are reported.
- id: figs14k-tau-cortex-vs-spinal
  statement: In slices, LC-NE neurons projecting to isocortex have significantly longer membrane
    time constants than those projecting to spinal cord (p < 0.001).
  source: Results, Spatial variation of LC-NE activity during action-outcome learning, paragraph 5;
    Figure S14k, right, legend
  quote: Neurons projecting to isocortex had significantly longer membrane time constants than those
    projecting to cerebellum or spinal cord
  statistics:
  - about: membrane time constant, spinal cord against cortex
    test: paired t-test
    p: 0.001
    p_relation: "<"
  depends_on:
  - patchseq-cohort
  criterion: The membrane time constant per cell as the IPFX package computes it (Methods, Patch-seq
    recordings), from the dataset's hyperpolarising long-square subthreshold sweeps, with IPFX's
    long-square analysis at its default settings. The paper gives neither the IPFX version nor its
    settings, and the code reads frozen values from the Allen Institute's internal database; the
    defaults are a standard choice and are recorded as a deviation. The code's frozen per-cell
    values (code/data/LCNE_patchseq_S14_cell_table.csv at commit 79fa20a, missing for 14 cells)
    are shown as a variant and compared with the recomputed values cell by cell. Cells without a
    time constant are left out. Sweep inclusion as in the Methods, the code's choice (none) a
    variant. Two-sided Welch t-test (the code's; the legend's "paired" t-test cannot apply to
    independent groups), Student's t-test a variant. The IPFX settings are the reader's standard
    choice, not the paper's, so they cannot decide the outcome alone. The test is also run on the
    code's frozen values (the paper's own IPFX output); if that gives a different outcome from
    the recomputed values, the claim is blocked as methods_underspecified with both shown.
    Reproduced when the cortex mean exceeds the
    spinal cord mean and p < 0.001; partially reproduced when the cortex mean is higher with 0.001
    <= p < 0.05; not reproduced otherwise. The group means and SDs and the number of cells with a
    value are reported.
- id: figs14k-tau-cortex-vs-cerebellum
  statement: In slices, LC-NE neurons projecting to isocortex have significantly longer membrane
    time constants than those projecting to cerebellum (p < 0.001).
  source: Results, Spatial variation of LC-NE activity during action-outcome learning, paragraph 5;
    Figure S14k, right, legend
  quote: Neurons projecting to isocortex had significantly longer membrane time constants than those
    projecting to cerebellum or spinal cord
  statistics:
  - about: membrane time constant, cerebellum against cortex
    test: paired t-test
    p: 0.001
    p_relation: "<"
  depends_on:
  - patchseq-cohort
  criterion: Time constants, cells, variants, test and the rule on the frozen values as in
    figs14k-tau-cortex-vs-spinal, cortex against cerebellum cells. Reproduced when the cortex mean exceeds the cerebellum mean and p <
    0.001; partially reproduced when the cortex mean is higher with 0.001 <= p < 0.05; not
    reproduced otherwise.
- id: patchseq-ne-identity
  statement: Each recorded cell's identity as an NE neuron was confirmed by RNA sequencing of its
    extracted nucleus.
  source: Results, Spatial variation of LC-NE activity during action-outcome learning, paragraph 5;
    Methods, cDNA and sequencing
  quote: At the end of the recording, we extracted the nucleus for RNA sequencing ( Lee et al. 2021 )
    and confirmed each cell’s identity as an NE neuron
  data: elsewhere
  where: NeMO Archive collection col-p9d5w39 (assets.nemoarchive.org/col-p9d5w39), named in the
    README of LCNE-patchseq-figures at commit 79fa20a, not in the paper; pinned by collection
    identifier only
  criterion: The paper does not say how identity was confirmed. The markers it uses to define LC-NE
    neurons (Figure S8c legend) are Dbh, Th, Slc6a2 and Slc18a2; expression is in counts per
    million (Methods). Readings, (a) Dbh detected (CPM > 0) in each cell; (b) all four markers
    detected in each cell. Reproduced when every recorded cell with a transcriptome passes under
    one reading. If the dandiset itself holds the transcriptomes, they are used instead.
- id: fig1-lc-definition
  statement: LC, defined in CCF space as the dorsal pontine region holding the densest two-thirds of
