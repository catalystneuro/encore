    SM-TH at high intensity, the population PSTH is computed (1 ms bins). Readings of the silence
    (open) (a) per mouse, from the end of the initial excitation to the first rebound spike, the
    median over units of the first spike latency in 75 to 250 ms minus 10 ms, averaged over mice;
    (b) per mouse, the time the population rate stays below its baseline mean minus 2 SD after the
    initial peak. Reproduced when both areas show a peak within 10 ms, rate below baseline over most
    of 10 to 140 ms and a peak in 140 to 250 ms, and under a reading the silence is within 127.8 +-
    4.1 ms (tolerance the paper's spread); partially reproduced when the pattern holds and the
    duration does not match.
- id: fig2b-thalamus-leads
  statement: The late rebound of SM-TH units precedes that of MOs RS units and the late CSD, LFP and
