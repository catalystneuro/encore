    rebound excitation at 140 to 250 ms.
  source: Results, Multiscale late EP responses ..., paragraph 4; Results, Optogenetic dissection
    ..., paragraph 1; Figure 2A
  quote: accompanied by a stereotyped triphasic spiking pattern characterized by an initial
    excitation (within 10 ms), followed by an off period (i.e., neuronal silence; 10–140 ms) and a
