# Claims for Russo, Claar, Furregoni et al. (2025), Nat Commun 16:3627, "Thalamic feedback shapes
# brain responses evoked by cortical stimulation in mice and humans", tested on dandiset 000458
# (reused; the paper's Data availability names version 0.230317.0039).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-21,
# protocol pilot-18 as stated in docs/protocol.md. The writer did not look at the dandiset's data or
# files; only its title, as the paper cites it, was used to know what it holds.
#
# Text read: the version of record (open access, CC BY-NC-ND), full text from PubMed Central
# (main text, Methods, figure legends, Data and Code availability), with the supplement
# 41467_2025_58717_MOESM1_ESM.pdf (Figures S1 to S14 with legends, Table S1) as text, and the Source
# Data file 41467_2025_58717_MOESM4_ESM.xlsx (sheets for Figures 1A to 1E, 2B, 2G, 3A, 3E, 4E, 4F
# and most supplementary panels). No PDF page was opened; no figure was read as an image, so
# claims shown only in a figure rest on its legend and the Results sentence citing it.
#
# Code read. (1) Mouse analysis, figshare doi:10.6084/m9.figshare.28047749 version 1
# (DataAnalysesMouse_v1.zip): a copy of AllenInstitute/tbd_eeg at commit ef9aa65 with the paper's
# notebooks under tbd_eeg/My_scripts. Its Notes.txt says MainScript.ipynb runs the mouse analyses of
# Figures 1 and 2 and the supplement and MainScript_Opto.ipynb the optogenetic analyses (it names
# them Figure 3 and Figure S8, an older numbering; in the paper the optogenetic results are Figure 2
# and Figure S8). Cited below as "MainScript", by its markdown section names. Cells read: "EEG
# Rest-Run Analysis", "CSD/LFP Rest-Run Analysis", "Units Rest-Run Analysis", "Rebound ISI Thalamus
# and Cortex _ Fs VS Rs" (latency, ISI, ROV, baseline rate and the HF and LF split), the k-means and
# dip-test cells, the two-way ANOVA of latencies, the helper functions (IdentifyResponsiveUnits,
# DFLoad_UnitsFirstSpike, DFLoad_NSpikesWindow, FindResponsePeaks), and
# CreateExportedData/CreateWheelVelocityPerTrial.ipynb. The notebooks read precomputed files from a
# lab drive and a lab spreadsheet (TableAllData.xlsx, with per-session good or bad flags and bad
# channels and trials) that are not in the deposit; the selections those files encode are open
# where noted. (2) Human analysis, figshare doi:10.6084/m9.figshare.25595829 v1
# (RestMov_ExtractFeatures.m, signrank tests on per-subject ROI values) and
# doi:10.6084/m9.figshare.25595871 v1 (StatRestMov_SPES.R: contacts 5 to 30 mm from the stimulated
# site with response above 6 SD, log amplitude and log PLF, lmer Value ~ Condition + (1 | Subj)).
# (3) Not read: the model (github.com/bazhlab-ucsd/sleep-stage-transition, branch stim) and the
# simulated-data analysis (doi:10.6084/m9.figshare.25773501.v1); the simulation claims are data
# elsewhere and name them.
#
# Where the Methods and the code disagree, the Methods are followed and the code's choice is named
# as a variant: (a) the mouse EEG rectified amplitude (Methods, absolute value of the averaged EP;
# the code's EEG cell averages the absolute single-trial signal after z-scoring each trial to its
# baseline); (b) the rest against active unit tests (Methods, Wilcoxon signed rank; the code uses
# rank-sum tests); (c) the window of the evoked ISI and response frequency (Methods, 150 to 250 ms;
# the code takes the first spike and its ISI in 75 to 250 ms).
#
# Data the paper used.
# - Mice (dandiset 000458; the paper's own Methods summarise Claar et al. 2023): C57BL/6J wild-type
#   mice (n = 21, male and female, 9 to 28 weeks), awake, head-fixed on a running wheel in darkness;
#   30-electrode skull EEG array, up to three Neuropixels 1.0 probes (MOs, SS, VIS and thalamus;
#   one always in sensorimotor thalamus, SM-TH, the nuclei AV, CL, MD, PO, VAL, VPL, VPM and VM),
#   and a bipolar stimulating electrode in deep MOs (layer 5/6). Up to 120 biphasic,
#   cathodic-first pulses (200 us per phase, 3.5 to 4.5 s jittered interval) at each of three
#   intensities, high 66.15 +- 12.11 uA, intermediate 47.35 +- 13.30 uA and low 30.59 +- 15.80 uA.
#   Control sessions stimulated posterior areas (visual and retrosplenial cortex, hippocampus;
#   12 sessions from 6 mice). Trials are rest when mean wheel speed from -0.5 to +0.5 s around the
#   pulse is below 0.1 cm/s and active when above. Measured variables: EEG, MOs LFP and CSD, sorted
#   units (Kilosort 2.0) classed by spike duration (cortex RS > 400 us, FS <= 400 us; thalamus relay
#   > 450 us, TRN < 350 us), wheel speed.
# - Optogenetics: VGAT-ChR2-YFP/wt mice (n = 4), fiber over TRN (or over MOs, Figure S8), 50 ms of
#   5 mW blue light at 75 or 125 ms after the pulse. The paper deposited the processed data in
#   figshare ("Data Mouse Opto", article 28440311 version 1); those claims are data elsewhere.
# - Humans: TMS-EEG in 12 healthy volunteers (left premotor TMS at rest, active squeezing and
#   passive movement of the right hand; controls with cycling, posterior TMS and median nerve
#   stimulation), and single-pulse electrical stimulation with intracerebral EEG in 5 epilepsy
#   patients. The raw human data are not public; the Source Data file gives per-subject processed
#   values for Figures 1A, 1B, S2G, S3A and S3B only, and box-plot summaries (minimum, quartiles,
#   median, maximum) for Figures S1A, S2A, S2C, S2D and S2E, so those claims are data elsewhere with
#   the Source Data file as their place.
# - Simulation: a thalamo-cortical Hodgkin-Huxley network (500 PY, 100 IN, 100 TC, 100 TRN), 15 rest
#   and 15 active trials; data elsewhere (the model and its analysis code).
