# Claims for Valero, Zutshi, Yoon & Buzsaki (2022), Science 375, 570-574, on dandiset 000568.
# Source: the NIH author manuscript in PubMed Central (PMC9632609), full text of the main report
# and its figure legends. The Materials and Methods and figures S1 to S15 are in the supplement,
# which could not be obtained (the PMC file is behind a captcha and Science's copy is not open),
# so method details below come from the legends, from buzcode (the code the paper names) and
# from the first author's later lab code, as stated per claim.
#
# When these criteria were written the author had seen the data check only: the file list,
# every group and table of the files, unit counts and baseline-epoch firing rates per session,
# the epoch names, the number of laps and ripples per session, the stored values of the pulse
# series, and the first few pulse timestamps of one session (which showed 20 ms pulses and
# gaps of 1 to 2 s between the first pulses of a uLED). No claim's analysis had been run.
#
# What the data check showed and the criteria take as given: 28 sessions from 4 mice, each
# deposited twice (a full file and a no-raw-data file with the same units); the pulse times of
# the uLEDs are in 2 sessions only (fCamk1 sess9 and sess12), and only these 2 sessions have
# laps. Every claim that needs light pulses or place fields is tested on these 2 sessions. The
# files carry no cell type; pyramidal cells are taken as units whose rate in the first
# (baseline) epoch is below 5 Hz.
#
# Method choices fixed here for all claims that use them (see valero.py):
# - responsive: the three-way test of getuLEDResponse.m (HippoCookBook, commit 0cbded3) over
#   the pulses of the home-cage PreStim epoch, per uLED, for uLEDs with at least 1000 pulses
#   there; a cell is light-responsive when it passes for at least one uLED. Its light windows
#   are the 0 to 20 ms after the onsets of the uLEDs it responds to.
# - control windows: the 20 ms before each pulse onset of any uLED, kept when no uLED is on.
# - rate maps and place fields: buzcode defaults (50 bins over 110 cm, 2-bin Gaussian
#   smoothing; fields at 0.2 of the peak, 5% to 60% of the track, peak at least 2 Hz), per
#   running direction, over the laps of the Maze epoch. Control maps use the time when no uLED
#   is on; light maps use the cell's light windows. A place cell has a control field in at least
#   one direction; a non-place cell has none.
# Quotes and statistics added 2026-10-19 from the full text (PMC9632609 author manuscript, JATS
# XML from NCBI E-utilities); the report has no section headings, so sources count the
# paragraphs of the main text.
schema_version: 1
dandiset: "000568"
paper: doi:10.1126/science.abm1891
claims:
- id: cohort-counts
  statement: CA1 pyramidal neurons were recorded and probed in four CaMKIIa-Cre::Ai32 mice, 822
    pyramidal neurons in all, 43.3 plus or minus 8.37 per session.
  source: Main text, paragraph 2
  quote: we recorded and probed large numbers of CA1 pyramidal neurons simultaneously in freely
    moving ... n = 822 pyramidal neurons in four mice; 43.3 ± 8.37 pyramidal neurons per session
  expected:
  - quantity: mice
    value: 4
    tolerance: 0
    unit: mice
  - quantity: pyramidal neurons
    value: 822
    tolerance: 82
    unit: neurons
  - quantity: mean pyramidal neurons per session
    value: 43.3
    tolerance: 8.37
    unit: neurons
  criterion: Putative pyramidal cells (baseline-epoch rate below 5 Hz), each session counted
    once. The paper does not say which sessions it used; the readings are (a) all sessions,
    (b) the sessions whose epochs name the uLED stimulation protocol. Reproduced when, under
    one reading, all three values are within tolerance (the per-session tolerance is the
    paper's standard deviation); partially reproduced when the mice and the per-session mean
    match but the total does not.
- id: fig1c-pulse-protocol
  statement: uLEDs were driven with 20 ms pulses at random sites with randomly variable 20 to 40
    ms offsets, so that the stimulation of each site recurred at about 0.3 to 0.6 s intervals.
  source: Main text, paragraph 2; Figure 1C
  quote: μLEDs were activated (0.02 to 0.1 μW, 20 ms duration) with randomly variable (20 to 40 ms)
    offsets so that stimulation of each site reccurred at ~0.3- to 0.6-s intervals
  expected:
  - quantity: pulse duration
    value: 20
    tolerance: 2
    unit: ms
  criterion: Over the stimulation epochs of the two sessions with pulse times. Reproduced when
    the median pulse duration is within tolerance, the median offset between the end of one
    pulse and the start of the next (any uLED) lies within 18 to 44 ms (the range widened by
    10% of each bound), and the median interval between successive pulses of each uLED with at
    least 1000 pulses lies within 0.27 to 0.66 s. Partially reproduced when the duration
    holds but one of the other two does not.
- id: fig1e-responsive-fraction
  statement: Of 822 pyramidal neurons, 611 responded to light from the uLEDs.
  source: Main text, paragraph 2; Figure 1E
  quote: Of 822 neurons, 611 responded unequally to the three neighboring μLEDs
  expected:
  - quantity: fraction of pyramidal neurons responsive to light
    value: 74.3
    tolerance: 7.4
    unit: percent
  criterion: Fraction of putative pyramidal cells in the two sessions with pulse times that
    pass the three-way test for at least one uLED. Readings of which pulses are tested are (a)
    the home-cage PreStim epoch, (b) all stimulation epochs (PreStim, Maze and PostStim).
    Reproduced when the fraction is within tolerance under one reading.
- id: fig1i-swr-decrease
  statement: Light-induced spike responses of individual pyramidal cells decreased during
    sharp-wave ripples (n = 485 neurons, P < 1e-55, Wilcoxon paired signed-rank test).
  source: Main text, paragraph 3; Figure 1, F to I
  quote: light-induced spike responses in individual pyramidal cells decreased during SPW-Rs
    (ΔRate; Fig. 1, F to I).
  statistics:
  - test: Wilcoxon paired signed-rank test
    p: 1.0e-55
    p_relation: "<"
    n: 485 neurons
  criterion: Light-responsive putative pyramidal cells of the two sessions, over the home-cage
    stimulation epochs (PreStim and PostStim). For each cell, the light rate in its light
    windows and the control rate in control windows, each split by whether the window overlaps
    a deposited ripple interval. Readings of the response are (a) the rate difference, light
    minus control (Hz), (b) the ratio light over control. Reproduced when, under one reading,
    the response inside ripples is lower than outside them by a two-sided Wilcoxon
    signed-rank test at p < 0.05 with a negative median difference. The paper's p-value cannot
    be reached with the few cells of two sessions and is not part of the criterion; cells
    with no control spikes inside ripples are left out of reading (b).
- id: figs10-swr-gain-vs-baseline-rate
  statement: The firing-rate change of pyramidal neurons during SPW-Rs is negatively correlated
    with their baseline firing rate (rho = -0.19, P < 1e-7).
  source: Main text, paragraph 3 (figure S10)
  quote: the negative correlation between firing-rate change during SPW-R and baseline firing
    rates of neurons
  statistics:
  - statistic: ρ = −0.19
    p: 1.0e-7
    p_relation: "<"
  expected:
  - quantity: Spearman correlation of SPW-R rate change with baseline rate
    value: -0.19
    tolerance: 0.068
    unit: rho
  criterion: Every putative pyramidal cell of every session with at least 50 deposited ripples
    in its first epoch. Baseline rate is the rate in the first epoch; the SPW-R change is
    measured in the same epoch, inside the deposited ripple intervals against outside them.
    Readings of the change are (a) log2 of the ratio of the rate inside to the rate outside
    (cells with no spikes inside ripples left out), (b) the difference inside minus outside
    (Hz). Reproduced when, under one reading, rho is within tolerance and p < 1e-7. Partially
    reproduced when rho is negative with p < 0.05 under one reading but no reading meets the
    full criterion. The tolerance is the half-width of the 95% interval of a Spearman rho at
    the paper's n of 822, since the paper gives no interval and 10% of 0.19 is below the
    sampling error.
- id: fig2b-theta-trough-gain
  statement: During track running, the light-induced rate gain is largest at the trough of the
    theta cycle (P < 1e-6, Wilcoxon test).
  source: Main text, paragraph 4; Figure 2, A and B
  quote: We observed a gain at the trough of the theta cycle, the phase corresponding to the
    strongest synchrony of pyramidal neurons (Fig. 2A)
  statistics:
  - test: Wilcoxon test
    p: 1.0e-6
    p_relation: "<"
  criterion: Light-responsive putative pyramidal cells of the two sessions, Maze epoch, during
    laps. Theta phase from the LFP channel with the largest ripple power (6 to 10 Hz, Hilbert),
    taken at the middle of each light or control window. Gain is light rate minus control rate
    in the trough half of the cycle (phase beyond +-90 degrees from the peak) and in the peak
    half. Reproduced when the gain in the trough half is higher by a two-sided Wilcoxon
    signed-rank test at p < 0.05. The gain in six 60-degree bins is shown as a variant.
- id: figs11-place-cell-fraction
  statement: More than half of the pyramidal neurons were place cells, 73% of light-responsive
    and 71% of non-responsive neurons, with no difference between them (P = 0.90, chi-squared
    test).
  source: Main text, paragraph 4 (figure S11)
  quote: more than half of the pyramidal neurons were classified as place cells [73% and 71% of
    light-responsive and nonresponsive neurons, respectively; P = 0.90, χ2 test
  statistics:
  - test: χ2 test
    p: 0.90
  depends_on:
  - fig1e-responsive-fraction
  expected:
  - quantity: place cells among light-responsive pyramidal neurons
    value: 73
    tolerance: 7.3
    unit: percent
  - quantity: place cells among non-responsive pyramidal neurons
    value: 71
    tolerance: 7.1
    unit: percent
  criterion: Putative pyramidal cells of the two sessions, place cells by the control maps of
    the Maze epoch. The absence of a difference is judged on the paper's test, a chi-squared
    test of the 2 x 2 table (with Yates' correction, scipy's default) at p >= 0.05. Reproduced
    when that test finds no difference and both fractions are within tolerance; partially
    reproduced when the test finds no difference but a fraction is outside tolerance; not
    reproduced when the test finds a difference.
- id: fig2e-infield-gain
  statement: The light-induced rate increase is higher within than outside the place field (n =
    553 place fields, P < 1e-115, Wilcoxon test).
  source: Main text, paragraph 4; Figure 2, C to E
  quote: The induced rate increase was higher within than outside the place field (Fig. 2E and
    fig. S12).
  statistics:
  - test: Wilcoxon test
    p: 1.0e-115
    p_relation: "<"
    n: 553 place fields
  depends_on:
  - figs11-place-cell-fraction
  criterion: Every control place field of a light-responsive putative pyramidal cell in the two
    sessions. Gain is light rate minus control rate, each from unsmoothed counts over time
    while the animal is inside the field's bins, and outside them in the same running
    direction. Reproduced when in-field gain exceeds out-of-field gain by a two-sided Wilcoxon
    signed-rank test at p < 0.05 with a positive median difference.
- id: figs12-gain-rate-correlations
  statement: The in-field gain is positively correlated with the out-of-field firing rate (rho =
    0.17, P < 1e-5) and with the home-cage firing rate of the neuron (rho = 0.25, P < 1e-7).
  source: Main text, paragraph 4 (figure S12)
  quote: This in-field gain was positively correlated with both the out-of-field firing rate and
    the home-cage firing rate of the neuron
  statistics:
  - about: in-field gain against out-of-field firing rate
    statistic: ρ = 0.17
    p: 1.0e-5
    p_relation: "<"
  - about: in-field gain against home-cage firing rate
    statistic: ρ = 0.25
    p: 1.0e-7
    p_relation: "<"
  depends_on:
  - fig2e-infield-gain
  expected:
  - quantity: Spearman rho, in-field gain against out-of-field rate
    value: 0.17
    tolerance: 0.084
    unit: rho
  - quantity: Spearman rho, in-field gain against home-cage rate
    value: 0.25
    tolerance: 0.084
    unit: rho
  criterion: Over the place fields of fig2e-infield-gain. Out-of-field rate is the control rate
