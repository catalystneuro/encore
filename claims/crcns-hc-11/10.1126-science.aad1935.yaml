    to POST (2.81 against 1.13 percentage points).
  source: Figure S14, within-ripple burstiness row (values read from the panel titles)
  inferred: The main text states that ripple-related bursting was higher in plastic cells (Figure
    4A); the numbers are only in the Figure S14 panel titles.
  statistics:
  - about: POST within-ripple burstiness
    test: rank-sum test
    p: 0.00183
    p_relation: "<"
  - about: POST - PRE change
    test: rank-sum test
    p: 0.01
    p_relation: "<"
  expected:
  - quantity: POST median within-ripple burstiness, plastic
    value: 27.3
    tolerance: 2.73
    unit: '%'
  - quantity: POST median within-ripple burstiness, rigid
    value: 23.3
    tolerance: 2.33
    unit: '%'
  - quantity: median change, plastic
    value: 2.81
    tolerance: 0.281
    unit: percentage points
  - quantity: median change, rigid
    value: 1.13
    tolerance: 0.113
    unit: percentage points
  criterion: Within-ripple burstiness as the percentage of within-ripple ISIs under 6 ms. Whether
    ISIs spanning two ripple events count is open; the reading kept is ISIs between spikes of
    one event (standard), with all ISIs inside concatenated ripple time as a variant. Rank-sum
    tests. Reproduced when both tests hold with plastic higher and the medians are within
    tolerance; partially reproduced when the tests hold and a median does not.
  depends_on:
  - rigid-plastic-counts
- id: figs16ab-plastic-synchrony-increase
  statement: The PRE to POST increase in ripple-triggered firing is present in plastic but not
    rigid cells, and the PRE to POST increase in pair-wise coactivity is larger among plastic
    cells.
  source: Figure S16A and S16B
  quote: The PRE to POST increases in ripple-event triggered firing rates seen when all place
    cells are taken into account (A, left panel) are uniquely present in plastic (A,
    third-panel) but not rigid (A, second panel) cells ... the PRE to POST increase in pair-wise
    co-activity observed across all place cells (B, left panel) is more robustly observed in the
    plastic cell population
  criterion: Ripple-triggered rate from -50 to 100 ms around event onset (the panel's axis), per
    cell, PRE and POST. The legend gives no test for panel A; readings (a) a signed-rank test of
    each cell's POST - PRE mean rate in 0 to 100 ms; (b) the same at the peak bin. Coactivity
    as in the opening comment, pairs within each group. Reproduced when plastic cells' rate
    increase is significant (p < 0.05) and rigid cells' is not under one reading of A, and
    plastic pairs' mean coactivity increase exceeds rigid pairs' (rank-sum, p < 0.05).
  depends_on:
  - rigid-plastic-counts
- id: low-high-rate-split
  statement: Splitting place cells into equal halves by offline firing rate gives low-rate cells
    with median 0.39 Hz and high-rate cells with median 1.12 Hz.
  source: Results, paragraph 5
  quote: Low-rate neurons (median, 0.39 Hz) contributed more spatial information per spike on the
    maze and displayed increased within-ripple firing-rate gains from PRE to POST sleep than
    high-rate cells (median, 1.12 Hz)
  expected:
  - quantity: median rate, low-rate cells
    value: 0.39
    tolerance: 0.039
    unit: Hz
  - quantity: median rate, high-rate cells
    value: 1.12
    tolerance: 0.112
    unit: Hz
  criterion: The Figure S16 legend points to the Methods for the split, which the Methods do not
    give. From the text, place cells are split into equal groups by "off-line" sleep firing
    rate, and the Methods state that cells removed from an analysis are chosen within each
    session. Readings (a) median split within each session and running direction; (b) median
    split within each session; (c) a pooled median split; and for the rate, (i) offline PRE
    and POST together; (ii) offline PRE only. Reproduced when both medians are within
    tolerance under one reading. The reading(s) that match fix the split for the claims that
    depend on this one.
- id: figs16c-low-rate-coding
  statement: Low-rate cells carry more spatial information per spike (0.91 against 0.56
    bits/spike), have a higher in/out place-field rate ratio (6.38 against 3.86), fewer place
    fields (log-mean 1.29 against 1.59), and a larger PRE to POST increase in within-ripple gain
    (0.71 against 0.06) than high-rate cells.
  source: Figure S16C legend; Results, paragraph 5
  quote: low-rate cells also contributed more information per spike (Low Rate median ... 0.91
    bits/spike, High Rate med ... 0.56 bits/spike, p < 2.5x10-9, Rank-Sum test), had a greater
    within/outside of place field(s) firing ratio (Low Rate med ... 6.38, High Rate med ... 3.86,
    p < 7.9x10-14), and had fewer place fields on the maze (Low Rate log-mean ... 1.29, High Rate
    log-mean ... 1.59, p < 3.94 x10-06). In addition, low rate cells tended to show a more
    pronounced increase in their within-ripple firing rate gain (Low Rate Δripple-gain med ...
    0.71, High Rate med ... 0.06, p < 7.585x10-4
  statistics:
  - about: information per spike
    test: Rank-Sum test
    p: 2.5e-09
    p_relation: "<"
  - about: within/outside field rate ratio
    test: Rank-Sum test
    p: 7.9e-14
    p_relation: "<"
  - about: number of place fields
    test: Rank-Sum test
    p: 3.94e-06
    p_relation: "<"
  - about: change in within-ripple gain
    test: Rank-Sum test
    p: 0.0007585
    p_relation: "<"
  expected:
  - quantity: median information per spike, low-rate
    value: 0.91
    tolerance: 0.091
    unit: bits/spike
  - quantity: median information per spike, high-rate
    value: 0.56
    tolerance: 0.056
    unit: bits/spike
  - quantity: median in/out field ratio, low-rate
    value: 6.38
    tolerance: 0.638
  - quantity: median in/out field ratio, high-rate
    value: 3.86
    tolerance: 0.386
  - quantity: log-mean number of place fields, low-rate
    value: 1.29
    tolerance: 0.129
  - quantity: log-mean number of place fields, high-rate
    value: 1.59
    tolerance: 0.159
  - quantity: median change in within-ripple gain, low-rate
    value: 0.71
    tolerance: 0.071
  - quantity: median change in within-ripple gain, high-rate
    value: 0.06
    tolerance: 0.07
  criterion: Groups from low-high-rate-split under the reading that matched there. Measures as in
    fig3a-plastic-more-specific and figs14-plastic-ripple-gain. "Log-mean" is read as the
    geometric mean. The high-rate gain change is near zero, so its tolerance is 0.07, about 10%
    of the gap between the groups. Reproduced when all four rank-sum tests give p < 0.05 in the
    stated direction and the medians are within tolerance; partially reproduced when the tests
    hold and a median does not.
  depends_on:
  - low-high-rate-split
- id: fig4c-coactivation-by-rate
  statement: In PRE sleep coactivity is dominated by fast-firing cells, whose correlations stay
    unchanged into POST, while slow-firing cells show the largest PRE to POST increase in
    coactivation and the greatest replay of maze coactivity.
  source: Figure 4B and 4C; Results, paragraph 4; Figure S16C
  quote: In PRE sleep, coactivity was dominated by fast-firing neurons, and these correlations
    remained unchanged into POST sleep. In contrast, slow-firing neurons showed the strongest
    increases in coactivation from PRE to POST sleep
  criterion: Per the Figure 4B and 4C legends, place cells sorted by session firing rate and
    grouped in overlapping windows of 20% of cells stepped by 1%; in each window, the mean
    coactivity of its pairs (different shanks) in PRE and POST, the POST - PRE change, and the
    partial correlation of RUN and POST coactivity given PRE. Whether ranks are taken within
    session or pooled is open (readings (a) percentile of rate within session; (b) pooled);
    "session firing rate" as in fig4a-rigid-fire-faster. Reproduced when PRE coactivity rises
    with the window's rate rank, the POST - PRE change and the partial correlation fall with
    it (Spearman over windows, both p < 0.05), the change in the top window is not
    significant (signed-rank over pairs, p > 0.05), and, per Figure S16C, the low-rate half's
    mean change exceeds the high-rate half's (rank-sum, p < 0.05). Partially reproduced when
    the slow-firing increase holds and the PRE dominance or the top-window stability does not.
  depends_on:
  - low-high-rate-split
- id: fig4d-slow-cells-replay
  statement: Slow-firing, but not fast-firing, place cells increased their contribution to
    sequences from PRE to POST sleep.
  source: Figure 4D; Results, paragraph 5; Figures S20D, S21B and S22E
  quote: Slow-firing, but not fast-firing, neurons increased their contribution to neuronal
    sequences from PRE to POST sleep
  criterion: The Bayesian replay analysis rerun with templates of only the low-rate or only the
    high-rate place cells (low-high-rate-split), the event criteria applied to the kept cells.
    The test of the change is open; readings (a) a rank-sum test of POST against PRE rZ within
    each group (as in Figure 1D); (b) a bootstrapped 95% interval of mean POST - PRE rZ (as in
    Figure 2D). Reproduced when the low-rate group's POST - PRE rZ is above zero (p < 0.05) and
    the high-rate group's is not, under each reading; partially reproduced when the low-rate
    increase holds and the high-rate group also increases but less. The paired-latency (Figure
    S20D) and time-bin-shuffle (Figure S22E) versions are shown as variants.
  depends_on:
  - low-high-rate-split
  - fig1c-sequence-content
- id: fig4e-high-gain-cells-replay
  statement: The PRE to POST increase in sequence content was limited to cells with high
    ripple-specific recruitment (within-ripple rate gain).
  source: Figure 4E; Results, paragraph 5; Figures S20E, S21C and S22E
  quote: Conversely, PRE to POST increases in sequence content were limited to cells that showed a
    high degree of ripple-specific recruitment (gain)
  criterion: As fig4d-slow-cells-replay, with the place cells split into equal halves by
    within-ripple firing-rate gain, under the split and epoch readings that matched in
    low-high-rate-split. Reproduced when the high-gain group's POST - PRE rZ is above zero (p <
    0.05) and the low-gain group's is not, under each reading of the test.
  depends_on:
  - low-high-rate-split
  - fig1c-sequence-content
- id: figs16de-more-ripples-post
  statement: Ripple events occur more often in POST than in PRE (median inter-event interval 2.47
    s against 3 s), as do purely LFP-detected sharp wave-ripples (1.06 s against 1.21 s).
  source: Figure S16D and S16E (medians read from the panel titles)
  quote: Increased synchrony (B) in the
    POST compared to PRE epoch may be attributable to both increases in ripple-triggered
    spiking (A) as well as to an increase in the incidence of ripple events
  statistics:
  - about: inter ripple-event intervals, PRE against POST
    test: Rank-Sum test
    p: 0
  - about: inter LFP-SWR intervals, PRE against POST
    test: Rank-Sum test
    p: 0
  expected:
  - quantity: median inter ripple-event interval, PRE
    value: 3
    tolerance: 0.3
    unit: s
  - quantity: median inter ripple-event interval, POST
    value: 2.47
    tolerance: 0.247
    unit: s
  - quantity: median inter LFP-SWR interval, PRE
    value: 1.21
    tolerance: 0.121
    unit: s
  - quantity: median inter LFP-SWR interval, POST
    value: 1.06
    tolerance: 0.106
    unit: s
  criterion: Intervals between consecutive events within offline states, intervals under 60 s
    only (legend); rank-sum test of PRE against POST intervals ("p ~ 0" printed, recorded as 0).
    Ripple events as in the opening comment; LFP-SWR events under readings L-a and L-b. Reproduced
    when POST intervals are shorter for both event types at p < 0.05 and the ripple-event
    medians are within tolerance; the LFP-SWR medians depend on the open detector and are
    reported, matching under one L reading counts toward reproduced.
- id: figs17-coactivity-preservation
  statement: Pair-wise coactivity is weakly preserved from PRE to RUN (r = 0.045), more strongly
    from RUN to POST (r = 0.16), and most strongly from PRE to POST (r = 0.34).
  source: Figure S17A and S17C (r values read from the panels)
  quote: the
    similarity between RUN and POST co-activity patterns (middle panel) was significantly ...
    greater (corr(RUN, POST) - corr(RUN, PRE) = 0.11, p ≈ 0, Fisher's Z-test). However, the
    similarity between RUN and POST was likewise far exceeded by the similarity between
    PRE and POST co-activity patterns (corr(PRE, POST) - corr(RUN, POST) = 0.18, p ≈ 0,
    Fisher's Z-test)
  statistics:
  - about: corr(RUN, POST) - corr(RUN, PRE)
    test: Fisher's Z-test
    p: 0
  - about: corr(PRE, POST) - corr(RUN, POST)
    test: Fisher's Z-test
    p: 0
  expected:
  - quantity: Pearson r, PRE against RUN coactivity
    value: 0.045
    tolerance: 0.0045
  - quantity: Pearson r, POST against RUN coactivity
    value: 0.16
    tolerance: 0.016
  - quantity: Pearson r, PRE against POST coactivity
    value: 0.34
    tolerance: 0.034
  - quantity: corr(RUN, POST) - corr(RUN, PRE)
    value: 0.11
    tolerance: 0.011
  - quantity: corr(PRE, POST) - corr(RUN, POST)
    value: 0.18
    tolerance: 0.018
  criterion: Coactivity as in the opening comment, all place-cell pairs on different shanks;
    Pearson correlation across pairs between epochs; differences of correlations by Fisher's Z
    test (as two independent correlations, the test's usual form; a test for dependent
    correlations is the other reading). Reproduced when both differences are significant (p <
    0.05) in the stated direction and the values are within tolerance; partially reproduced
    when the order RUN-PRE < RUN-POST < PRE-POST holds but values fall outside tolerance.
- id: figs17d-rigid-plastic-coactivity
  statement: Rigid cell pairs preserve PRE coactivity into RUN (r = 0.139) and into POST (r =
    0.31) more than plastic pairs (-0.02 and 0.09), while plastic pairs show higher RUN to POST
    preservation (0.36 against 0.11).
  source: Figure S17D (r values read from the panels); Results, paragraph 4
  quote: Rigid cell, but not plastic cell, pairs
    showed preservation of PRE co-activity patterns during the RUN. Conversely, plastic cell
    pairs showed a significantly higher preservation of co-activity patterns from the RUN to
    the POST
  expected:
  - quantity: rigid pairs, PRE against RUN r
    value: 0.139
    tolerance: 0.0139
  - quantity: plastic pairs, PRE against RUN r
    value: -0.02
    tolerance: 0.05
  - quantity: rigid pairs, RUN against POST r
    value: 0.11
    tolerance: 0.011
  - quantity: plastic pairs, RUN against POST r
    value: 0.36
    tolerance: 0.036
  - quantity: rigid pairs, PRE against POST r
    value: 0.31
    tolerance: 0.031
  - quantity: plastic pairs, PRE against POST r
    value: 0.09
    tolerance: 0.009
  criterion: As figs17-coactivity-preservation within rigid-rigid and plastic-plastic pairs;
    groups compared by Fisher's Z test (Figure S17D legend). The plastic PRE-RUN r is near zero,
    so its tolerance is 0.05, read as consistent with zero. Reproduced when the three group
    differences are significant (p < 0.05) in the stated direction; the r values are reported
    against tolerance, and a mismatch in values with the differences holding is partially
    reproduced.
  depends_on:
  - rigid-plastic-counts
- id: figs18-temporal-bias
  statement: Pair-wise temporal biases are not preserved from PRE to RUN (r = -0.009) but are
    preserved from RUN to POST (r = 0.117) and PRE to POST (r = 0.201); the PRE to POST
    preservation is carried by rigid cell pairs (r = 0.29) and the RUN to POST preservation by
    plastic cell pairs (r = 0.26).
  source: Figure S18B and S18C (r values read from the panels); Results, paragraph 4
  quote: When
    all place cells are included in the analysis, no similarity is observed between PRE and
    RUN (left panel) temporal biases. However, temporal biases are strongly preserved from
    the RUN to POST epochs (middle panel), as well as from the PRE to POST epochs
    (right). (C) Limiting this analysis to rigid (blue) or plastic (red) cell pairs, reveals that the
    preservation of temporal spiking patterns from PRE to POST and from RUN to POST is
    attributable to the rigid and plastic cell subpopulations, respectively
  expected:
  - quantity: all pairs, PRE against RUN r
    value: -0.009
    tolerance: 0.05
  - quantity: all pairs, RUN against POST r
    value: 0.117
    tolerance: 0.0117
  - quantity: all pairs, PRE against POST r
    value: 0.201
    tolerance: 0.0201
  - quantity: rigid pairs, PRE against POST r
    value: 0.29
    tolerance: 0.029
  - quantity: plastic pairs, RUN against POST r
    value: 0.26
    tolerance: 0.026
  criterion: Temporal bias and its median r over 1,000 sign randomisations as in the opening
    comment. The PRE-RUN value is near zero; its tolerance of 0.05 reads it as consistent with
    zero. Reproduced when the PRE-RUN r is not significant (p > 0.05), RUN-POST and PRE-POST are
    (p < 0.05), the rigid PRE-POST and plastic RUN-POST r are significant while the plastic
    PRE-POST (-0.037) and rigid RUN-POST (0.024) are not, and the values are within tolerance;
    partially reproduced when the significance pattern holds and a value does not.
  depends_on:
  - rigid-plastic-counts
- id: figs11-cluster-quality-similar
  statement: Rigid and plastic cells have similar waveforms and similar cluster quality and
    stability across PRE, MAZE and POST, so clustering errors do not explain their differences.
  source: Figure S11; Results, paragraph 3
  quote: Note
    that rigid and plastic cell waveforms are similar to each other and stable from the PRE to
    the POST epochs
  criterion: A claim of absence, judged by the paper's rank-sum tests of rigid against plastic
    cells at p < 0.05 (Figure S11 legend). Quality is the median Mahalanobis distance of each
    spike's PCA features to its cluster mean, for spikes in PRE ripple events, MAZE running and
    POST ripple events; stability is the symmetric Mahalanobis distance between a cell's
    clusters in two conditions; first spikes of bursts (ISI under 6 ms) only. Reproduced when no
    comparison is significant; the effect sizes are reported either way.
  depends_on:
  - rigid-plastic-counts
