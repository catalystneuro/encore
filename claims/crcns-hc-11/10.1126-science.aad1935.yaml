- id: fig1c-sequence-content
  statement: Ripple-event sequence scores (rZ) are above chance in PRE, MAZE and POST, highest on
    the MAZE, and higher in POST than in PRE sleep (replay).
  source: Figure 1C; Figure S5 legend; Results, paragraph 2
  quote: Cumulative distribution of rZ for PRE, MAZE, and POSTevents ... Sequence content
    increases from PRE to POST
  criterion: Events, decoding and rZ by the ripple-event and Bayesian replay methods of the
    opening comment. Tests from the Figure 1C legend, a sign-rank test of rZ against zero within
    each epoch, and a Kruskal-Wallis test across PRE, MAZE and POST followed by Tukey-Kramer
    tests. Reproduced when rZ is above zero in all three epochs (p < 0.05), POST rZ exceeds PRE
    rZ and MAZE exceeds both (Tukey-Kramer p < 0.05), under all readings of Y, L, S and D;
    partially reproduced when POST exceeds PRE but another part fails. The Figure 1C panel
    values are not available here, so no level is fixed. The time-bin-shuffle rZ of Figure S22B
    is shown as a variant.
