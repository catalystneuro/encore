# Claims for Grosmark & Buzsaki (2016), Science 351:1440-1443, on CRCNS data set hc-11
# (doi:10.6080/K0862DC5).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-07,
# protocol as stated in docs/protocol.md (Reader).
#
# Text read: the NIH author manuscript in PubMed Central (PMC4919122), as supplied under paper/,
# with the main text and the legends of Figures 1 to 4, and its supplement (Materials and
# Methods, Figures S1 to S22 with legends, references; PDF from PMC, text by PyMuPDF). The
# images of the main Figures 1 to 4 are not under paper/, so numbers and significance marks
# printed only inside those panels are not recorded here. The supplement PDF was rendered to
# read the supplementary panels: values printed in panel titles (Figures S5, S9, S12, S13, S14,
# S16 to S19) are marked as read from a figure; the text extraction does not hold them, so the
# quote checker cannot find their p-values. The paper links no analysis code ("Spike and LFP
# data are available at CRCNS.org"); none was read.
#
# Main-text figure numbers for supplementary figures are off by one in places: the main text
# cites figs. S16 and S17 for pair-wise coactivity and temporal bias, which are Figures S17 and
# S18 of the supplement, and fig. S12 for the exclusion analysis that the Methods call fig. S8.
# The claims below cite the supplement's own numbering.
#
# Data the paper used. Four male Long-Evans rats, bilateral silicon probes in dorsal CA1 (two
# with 8-shank BUZ64, two with 6-shank BUZ64SP), recorded at 20 kHz with neck EMG and a
# head-mounted accelerometer; 562 well isolated pyramidal cells. Eight novelty sessions, each a
# PRE epoch of about 4 hours of rest and sleep in the home cage in the familiar room A, a MAZE
# epoch in a novel room on a 1.9 m wooden linear maze (4 sessions), a 2.3 m metal linear maze
# (1 session) or a 1 m diameter wooden circular maze (3 sessions), then a POST epoch of about 4
# hours in room A. Position from two head LEDs at 39.69 Hz. Linear mazes have 15 cm reward areas
# at both ends (1.6 m or 2 m stem); the circular maze has a 30 cm reward area and clockwise
# running. Place cells n = 491 (counted per running direction on linear mazes). The hc-11
# description lists the same eight sessions (PRE, MAZE and POST concatenated per session),
# spike times, cluster identities with putative cell types, LFP at 1250 Hz with EMG and
# accelerometer channels, spike waveforms and features, and tracked position.
#
# Shared method, from the supplement's Materials and Methods unless stated.
# - Offline states are quiet waking (immobility) and NREM sleep, scored from the CA1 theta/delta
#   ratio, accelerometer and EMG as in reference 31 (Grosmark et al. 2012). No thresholds are
#   given (open; see readings S-a and S-b below).
# - Every PRE and POST analysis is yoked to the duration of the shorter of the two epochs of the
#   session. Which part of the longer epoch is kept is open. Readings Y-a, the last T of PRE and
#   the first T of POST (the parts nearest the maze); Y-b, the first T of each epoch; Y-c, T
#   counted in offline time. T is the duration of the shorter epoch.
# - Place fields. Spikes and occupancy in 2 cm bins, each smoothed with a 5 cm Gaussian kernel;
#   rate is smoothed spikes over smoothed occupancy. Only running at 5 cm/s or more outside the
#   reward areas. Circular maze linearised from the edge of the reward area, clockwise. Null,
#   5,000 rate vectors from spikes resampled with the unsmoothed occupancy as the density. A
#   place field is at least 5 consecutive bins above the null 99th percentile with an in-field
#   peak of at least 1 Hz. Linear mazes are analysed separately for left and right runs. Whether
#   "5 cm" is the kernel's SD or its width is not stated; SD is the standard reading.
# - Ripple events. All CA1 pyramidal spikes in 1 ms bins convolved with a 15 ms Gaussian (SD,
#   the standard reading); trigger at mean + 3 SD of all 1 ms bins in NREM of PRE and POST
#   together; event bounds where the rate returns to that NREM mean. Kept when the event holds
#   the peak of at least one LFP-detected sharp wave-ripple, lasts 50 to 500 ms, falls in an
#   offline state, and has at least five distinct pyramidal cells firing. The LFP ripple
#   detector is not described beyond the 150-250 Hz band of Figure S4; its threshold is open
#   (readings L-a, peak 150-250 Hz power above mean + 3 SD; L-b, above mean + 5 SD).
# - Bayesian replay. Events of at least 100 ms with at least 10% of place cells or 5 (whichever
#   is greater) firing; 20 ms non-overlapping bins; uniform-prior Poisson decoder (equations 1
#   and 2) on all place cells' smoothed rate maps; weighted correlation r of position and time
#   (equations 3 to 5); 1,000 circular place-field shuffles (each cell's unsmoothed map rotated
#   by a random number of bins, then re-smoothed); rZ = (|r observed| - mean |r null|) / SD |r
#   null| (equation 7). On linear mazes the decoding is done separately for each running
#   direction. Whether each event is scored with both direction templates (D-a, both scores
#   kept, as the Figure S20 legend "we independently compared the results of each running
#   direction to its null distribution" suggests) or assigned to one direction by the
#   direction decoder of equation 6 (D-b, the method the Methods give for Figure 1D) is open.
# - Per cell contribution (PCC). For each place cell, 1,000 templates in which only that cell's
#   map is circularly shuffled; for each event the cell fired in, PCC = (rZ observed - mean rZ
#   cell shuffle) x number of participating place cells (equation 8, Figure S9A); rZ of a
#   cell-shuffled template uses the event's own null mean and SD (the reading the equations
#   imply). PRE and POST PCC are the means over the cell's PRE and POST events; dPCC = POST - PRE.
# - Strongly contributing cells, rigid and plastic cells. A cell is strongly contributing when
#   its per-event PCC scores are significant (p < 0.05, one-tailed) in PRE or POST. The Methods
#   name a one-tailed rank-sum test; the Figure S19B legend names a one-tailed signed-rank test
#   (readings P-a, signed-rank test of per-event PCC against zero; P-b, rank-sum test of the
#   event's observed rZ against its mean cell-shuffled rZ). Within each session and running
#   direction, strongly contributing cells at or below the 50th percentile of dPCC are rigid,
#   those above are plastic, and with an odd count the median cell is dropped.
# - Offline excitability measures (Figure S14 legend). Firing rate, spikes per second in
#   offline states; within-ripple rate over concatenated ripple events; within-ripple gain,
#   within-ripple rate over offline rate; ripple participation, the percentage of ripple events
#   with at least one spike; burstiness, the percentage of ISIs under 6 ms (all, or within
#   ripples); within-ripple "on" rate, the within-ripple rate over events with a spike.
# - Pair-wise coactivity. Pearson correlation of 100 ms binned rates in offline states of PRE
#   and POST, and during running above 5 cm/s on the maze; pairs on the same shank excluded.
# - Temporal bias. CCG of half-width 150 ms in offline PRE and POST and in running on the maze;
#   bias = (spikes with the reference after the comparison - spikes before) / all coincident
#   spikes; pairs on one shank or with fewer than 40 coincident spikes in either condition
#   excluded; similarity is the median Pearson r (and its p) over 1,000 random sign flips per
#   pair applied alike to both epochs.
# Readings S-a and S-b for state scoring: S-a, the lab's own state epochs if the data set holds
# them (the paper's scoring); S-b, a recomputed scoring by the theta/delta ratio and EMG with
# thresholds the author states. Every criterion below names the readings it rests on; the
# outcome is the one all its readings give.
