# Claims for Yu, Gutnisky, Hires & Svoboda (2016) on dandiset 000005.
# Source: the abstract and the eight figure titles on the public landing page of the paper
# (https://www.nature.com/articles/nn.4412). The full text is not open access and no copy was
# found in PubMed Central, Europe PMC or a preprint server, so the claims are at the level of the
# abstract, no claim has a reported number, and every method choice below is made here.
#
# When these criteria were written, the author had seen the data check only: the file list and
# metadata, the recording mode of each L4 file read from its trace, spike counts and spike widths,
# the sampling rates, the light series of each file, the spike probability after single light
# pulses in VGAT-ChR2 mice, and the firing rate during the long light epochs in PV-Cre mice. No
# touch or whisking measure had been computed for any cell or unit.
#
# The dandiset gives no cell type for its 130 L4 cells. Cell types are assigned here from the
# data, before any claim's analysis:
# - FS interneuron (proxy): a cell in a VGAT-ChR2-EYFP mouse that spikes within 6 ms of isolated
#   5 ms light pulses (at least 10 pulses; evoked minus baseline spike probability at least 0.2;
#   one-sided binomial test on discordant pulses, p < 0.001). This tags GABAergic neurons; the
#   abstract's L4 FS interneurons are assumed to be the tagged cells.
# - Excitatory neuron (proxy): a whole-cell recording (median membrane potential below -20 mV)
#   with action potentials at least 0.6 ms wide at half maximum, not tagged where light pulses
#   were given.
# Measures, used by every claim (common choices, as the Methods were not available):
# - Only trials without light, unless the claim is about light.
# - Whisking: angle of the principal whisker band-passed at 6 to 30 Hz, Hilbert amplitude and
#   phase; whisking where the amplitude is at least 2.5 degrees. Samples within 100 ms of a touch
#   of any tracked whisker, or during a touch, are left out of whisking measures.
# - Touch response: spike rate 0 to 25 ms after each touch onset of the principal whisker minus
#   the rate 25 to 0 ms before it; responsive when a one-sided Wilcoxon signed-rank test over
#   touches gives p < 0.01.
# - Whisking modulation: Rayleigh test of the whisking phase at spikes during non-touch whisking,
#   modulated when p < 0.01; its size in Hz is 2 x vector strength x rate during whisking.
#   Amended after the first run (see below).
# - Touch selectivity: touch response / (touch response + whisking modulation), both in Hz, the
#   touch response floored at 0.
# - A cell or unit enters a measure when its principal whisker is named, it has at least 10
#   touches and at least 20 spikes in the trials used.
#
# Amendment, made after the first run of the notebook and before the outcomes were recorded. The
# null control of the data check (spikes moved to the next trial) showed that the Rayleigh test
# above marks 88% of VPM units as modulated with the wrong alignment (92% with the right one),
# because time is not spread evenly over whisking phase. The test cannot tell modulation from
# chance, so it was replaced for every claim, as follows. Whisking modulation is the amplitude of
# the first harmonic of spike rate against whisking phase (12 bins, rate = spikes over time spent
# in the bin), minus the median of a null made by moving the spikes 1 to 99 trials later and by a
# quarter, half and three quarters of a trial; modulated when p < 0.01 against that null. Touch
# selectivity uses this corrected amplitude. When this was decided the author had seen, from the
# first run, the outputs of every claim under the Rayleigh version: VPM 0.83 touch-responsive and
# 0.92 modulated; FS 0.65 and 0.75; the excitatory against FS and VPM selectivity tests p = 0.18
# and 0.26; the PV-Cre whisking-rate test p = 0.016 (6 of 7); the selectivity test p = 0.97; the
# VPM-light test p = 0.002 (9 of 9). The notebook shows both versions; the corrected one decides.
#
# Second amendment, after the first verification round. The publisher's page and the supplement
# PDF of the paper are public and hold the legends of Supplementary Figures 1 to 14 and
# Supplementary Tables 1 and 2, which the criteria above were written without. They settle that the
# PV-Cre mice express eNpHR in PV cells, that the VPM light is a 100 Hz train of 5 ms pulses, that
# FS cells are light-driven VGAT-ChR2 cells inside a waveform boundary, that spike-phase modulation
# is judged by the r2 of a sinusoid fit (> 0.25), and that Figure 7 compares FS cells in control and
# ION-transected mice. The criteria were not changed: the author had seen every outcome by then.
# The paper's choices are shown as variants in the notebook. The source of sensory-input-drives-fs
# now names the supplementary figures; that claim is blocked because no file marks the transected
# mice.
# Quotes from the abstract and the figure titles added 2026-10-19 where they state the finding;
# the rest are marked inferred (no open full text).
# Quotes and statistics added 2026-10-20 from the full text (PDF of the version of record, and its
# supplement).
schema_version: 1
dandiset: "000005"
paper: doi:10.1038/nn.4412
claims:
- id: vpm-touch
  statement: Neurons in the ventral posteromedial nucleus (VPM) fire in response to touch in mice
    locating objects with their whiskers.
  source: Results, Chronic extracellular recordings from somatosensory thalamus, paragraph 1;
    Figure 1b,d; Figure 5b,c
  quote: Neurons responded to active touch during behavior with an increase in spike rate (Fig. 1b).
  criterion: Over the VPM units with a named principal whisker, reproduced when at least half are
    touch-responsive; partially reproduced when 25% to 50% are; not reproduced below 25%.
- id: vpm-whisking
  statement: VPM neurons fire in response to whisker movement.
  source: Results, Chronic extracellular recordings from somatosensory thalamus, paragraph 2;
    Figure 1c,e; Supplementary Figure 2
  quote: Most VPM neurons increased their spike rate during whisking in the absence of touch ... The
    spike rate was modulated by the phase of the movement (Supplementary Fig. 2d).
  statistics:
  - test: Wilcoxon signed-rank test
    p: 4.0e-6
    n: 29 neurons
  criterion: Over the same VPM units, reproduced when at least half are significantly modulated by
    whisking phase (as amended above); partially reproduced when 25% to 50% are; not reproduced below 25%. The change
    of rate between whisking and quiet periods (amplitude below 1 degree), away from touch, is
    shown as a variant.
- id: fs-touch-and-whisking
  statement: L4 fast-spiking (FS) interneurons inherit the responses of VPM, firing in response to
    both touch and whisker movement.
  source: Results, Dynamics of L4 fast-spiking interneurons, paragraphs 1 to 3; Figure 5b-d;
    Supplementary Figure 7
  quote: Touch- and whisking-evoked spikes were typically multiplexed in individual L4 FS neurons
    (Fig. 5b,d and Supplementary Fig. 7), as in VPM neurons.
  statistics:
  - p: 2.7e-5
    n: 26 neurons
  criterion: Over the tagged FS cells (proxy), reproduced when at least half are touch-responsive
    and at least half are modulated by whisking phase; partially reproduced when only one of the
    two holds; not reproduced when neither does.
- id: exc-mainly-touch
  statement: In contrast with VPM neurons and L4 FS interneurons, L4 excitatory neurons respond
    mainly to touch.
  source: Results, Dynamics of L4 fast-spiking interneurons, paragraph 3; Figure 5b,d,e
  quote: Excitatory neurons responded mostly to touch (mean ± s.d., 0.3 ± 0.4 spikes per touch;
    median, 0.1 spikes per touch; n = 85 neurons; Fig. 5b,d) and showed weak response to whisker
    movement
  statistics:
  - p: 0.20
    n: 85 neurons
  depends_on:
  - vpm-whisking
  - fs-touch-and-whisking
  criterion: Touch selectivity of the excitatory cells (proxy) is compared with that of the FS
    cells (proxy) and with that of the VPM units, each by a one-sided Mann-Whitney test. Reproduced
    when the excitatory cells are more touch selective than both at p < 0.05; partially reproduced
    when only one comparison holds; not reproduced when neither does. The fractions of cells that
    are touch-responsive and whisking-modulated in each group are reported.
- id: fs-suppress-movement-spiking
  statement: FS interneurons reduce movement-related spiking in L4 excitatory neurons; silencing
    them increases the spiking of excitatory neurons during whisker movement.
  source: Results, Layer 4 FS interneurons suppress reafference in L4, paragraph 1; Figure 8d;
    Supplementary Figure 13
  quote: L4 excitatory neurons increased their spike rate during both nonwhisking periods (from 0.6 ±
    0.1 spikes per s to 1.6 ± 0.3 spikes per s; mean ± s.e.m., n = 40 neurons ... and whisking
    periods ... 0.8 ± 0.2 spikes per s to 2.7 ± 0.5 spikes per s
  statistics:
  - p: 2.0e-6
    n: 40 neurons
  criterion: Tested in PV-Cre mice, where the long light epochs at the vS1 site are taken to
    silence PV (FS) interneurons; the data check shows the light reduces the firing of some cells,
    which is what an inhibitory opsin in PV cells would do. For each excitatory cell (proxy) in a
    PV-Cre mouse, the spike rate during non-touch whisking inside the light epoch of light trials
    is compared with that inside the same span of trials without light. Reproduced when the rate
    rises in most cells and a one-sided Wilcoxon signed-rank test over cells gives p < 0.05;
    partially reproduced when it rises in most cells without significance; not reproduced
    otherwise. The juxtacellular cells of PV-Cre mice that the light does not suppress are shown
    as a variant; that selection is biased toward a rise and does not decide the outcome.
- id: fs-enhance-touch-selectivity
  statement: By suppressing movement-related spiking, FS interneurons enhance the selectivity of
    L4 excitatory neurons for touch.
  source: Results, Layer 4 FS interneurons suppress reafference in L4, paragraphs 1 to 4; Figure
    8d-h
  quote: L4 excitatory neurons were instead driven by whisker movements (P = 0.02, Fig. 8d), implying
    that their selectivity for touch was normally maintained in part by FS interneurons.
  statistics:
  - p: 0.02
  depends_on:
  - fs-suppress-movement-spiking
  criterion: For the same excitatory cells, touch selectivity computed inside the light epochs of
    light trials and inside the same span of trials without light. Reproduced when selectivity is
    lower with light in most cells and a one-sided Wilcoxon signed-rank test gives p < 0.05;
    partially reproduced when lower in most cells without significance; not reproduced otherwise.
- id: thalamus-drives-fs
  statement: Thalamic activity drives L4 FS interneurons.
  source: Results, Inhibition is driven by thalamus, paragraph 2; Figure 6d,e
  quote: Photoinhibition reduced spike rates in FS interneurons during nonwhisking (to 4% of control
    ... and whisking epochs (to 13% of control ... as well as in response to touch (to 32% of control
    ... FS interneurons were thus driven by input from the thalamus.
  statistics:
  - about: Nonwhisking spike rate with and without thalamic photoinhibition
    p: 5.0e-4
    n: 13 neurons
  - about: Whisking spike rate with and without thalamic photoinhibition
    p: 6.0e-5
    n: 15 neurons
  - about: Touch response with and without thalamic photoinhibition
    p: 1.0e-4
    n: 14 neurons
  criterion: Tested on the tagged FS cells (proxy) recorded with light at the site labelled VPM,
    which in VGAT-ChR2 mice is taken to silence VPM. The spike rate inside the light epoch of light
    trials is compared with that inside the same span of trials without light. Reproduced when it
    falls in most cells and a one-sided Wilcoxon signed-rank test over cells gives p < 0.05;
    partially reproduced when it falls in most cells without significance; not reproduced
    otherwise. The same comparison for whisking-period rate, and for all cells recorded with VPM
    light, is shown as a variant.
- id: sensory-input-drives-fs
  statement: The movement-related activity of L4 FS interneurons is driven by sensory input
    (reafference through the thalamus), not by a corollary discharge from motor areas.
  source: Results, Inhibition is driven by sensory input, paragraph 3; Figure 7g-i; Supplementary
    Figures 6, 11 and 12 legends
  quote: These data show that excitation of L4 excitatory neurons and L4 FS neurons is dominated by
    sensory input. Modulation correlated with whisker movement in L4 FS neurons constitutes
    reafference.
  statistics:
  - p: 0.80
    n: 10 neurons
