  expected:
  - quantity: mean FRV across neurons
    value: 0.26
    tolerance: 0.15
    unit: Hz (no unit is printed; FRV is a difference of mean firing rates, Methods 4.11)
  - quantity: neurons with positive FRV
    value: 41
    tolerance: 0
    unit: of 41
  depends_on:
  - neuron-count
  criterion: FRV per neuron is the AVERSIVE minus NEUTRAL mean firing rate over the whole time
    interval of firing (Methods 4.11), under readings (a) the 24 s blocks, (b) the 26 s trials.
    Tolerance is the stated spread (0.15). Reproduced when every neuron has FRV > 0 and the mean
    is within tolerance under one reading; partially reproduced when the mean is within
    tolerance and most neurons have FRV > 0. "FRV" is called Firing Rate Variation here and Firing
    Rate Variability in Methods 4.11; it is the same measure.
- id: fig3a-firing-gradual-sustained
  statement: The neurons' firing rose gradually and stayed enhanced throughout the AVERSIVE
    sequences, not as an immediate response at onset.
  source: Results 2.3, paragraph 2; Figure 3A
  quote: Contrary to our expectation of an immediate spiking onset, the neurons increased their
    firing gradually and sustained enhanced firing throughout the AVERSIVE video sequences
  depends_on:
  - neuron-count
  criterion: The paper gives no measure or test for this. Population AVERSIVE minus NEUTRAL
    firing rate across the 41 neurons, time-locked to sequence onset, in 100 ms bins smoothed
    over 1 s (Fig. 3A legend). The test is open; readings are (a) the difference averaged over
    the first 2 s is smaller than over 2 to 24 s (gradual), with the difference positive in each
    of the twelve 2 s bins of the block (sustained); (b) the time of the difference's first
    peak is later than 2 s and the difference stays positive to 24 s. Reproduced when both
    readings agree it holds, not reproduced when both agree it does not, blocked as
    methods_underspecified otherwise. The curve is shown either way.
