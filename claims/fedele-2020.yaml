    differ between the AVERSIVE and NEUTRAL conditions.
  source: Results 2.3, paragraph 3; Figure 3B, lower boxplot
  quote: Across all neurons, the covariation of neuronal firing with HGP was not significantly
    different between the two experimental conditions (Spearman’s r 1⁄4 0.17 ... �0.28 in AVERSIVE,
    0.18 �0.18 in NEUTRAL; Wilcoxon paired test, p > 0.05)
  statistics:
  - test: Wilcoxon paired test
    p: 0.05
    p_relation: ">"
    n: 41 neurons
  expected:
