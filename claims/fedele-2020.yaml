# Claims for Fedele, Tzovara et al. (2020), NeuroImage 213, 116705, on dandiset 000576.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record (PDF supplied by a person, text extracted with PyMuPDF),
# main text, figure legends, Tables 1 and 2 and Methods. Table 2 was read from the extracted
# text, in which minus signs print as a replacement glyph; its signs agree with the counts the
# Results give (12 of 14 negative DELTA MI, HGP MI positive in 7 of 7 nSOZ and negative in 6 of
# 7 SOZ amygdalae). The PDF pages could not be rendered here. The supplement (Appendix A, online)
# was not supplied; the text cites it only for Fig. S2 (waveforms and inter-spike intervals of
# the neurons of each patient), which carries no finding. The Results also cite "Methods 7.8"
# for the other spectral bands; no such section exists in the text, and section 4.8 lists the
# bands without results.
# The data descriptor of the same data (Fedele et al. 2021, Sci Data, doi:10.1038/s41597-020-00790-x,
# in paper/) was read for the layout of the deposited data only; no claim is taken from it.
#
# Code: the paper links no analysis code. The data descriptor says scripts for reading the NIX
# files and for its own Figs 2 and 3 come with the G-Node and OpenNeuro deposits; these are not
# the paper's analysis and were not read. Every method below is from the paper's Methods (4.7
# to 4.11), Results and figure legends.
#
# Data the paper used (Methods 4.1, Tables 1 and 2). Nine patients with drug-resistant mesial
# temporal lobe epilepsy, 14 implanted amygdalae: 7 outside the seizure onset zone (nSOZ:
# patients 1 L, 2 L, 3 L, 4 L, 6 L, 7 L, 8 L) and 7 within it (SOZ, starred in the tables:
# 1 R, 2 R, 5 R, 6 R, 7 R, 9 L, 9 R). Table 2 numbers the amygdalae 1 to 14 in that order by
# patient, left before right. Task: silent videos in a block design, blocks of 24 s of dynamic
# fearful faces (AVERSIVE, eight blocks) or dynamic landscapes (NEUTRAL, nine blocks), each
# block preceded by a repeated 2 s neutral landscape baseline (Methods 4.4); the data
# descriptor stores these as trials of 26 s. iEEG from depth macroelectrodes at 4 kHz,
# down-sampled to 2 kHz, re-referenced to a bipolar montage (one bipolar channel in each
# amygdala, Fig. 2B). Microwires at the electrode tips at 32 kHz, spike sorted with Combinato;
# 50 clusters from 9 amygdalae, 41 with firing rate above 1 Hz. Measured variables: delta and
# high gamma power envelopes of the macro iEEG (DELTA, HGP), high gamma power of the microwire
# signals (muHGP), spike times per unit, and the BOLD time course of each amygdala from a
# pre-operative fMRI session (7 of 9 patients, 9 amygdalae with BOLD in Table 2).
#
# Outside data (step 4). The BOLD time courses come from the clinical fMRI of these patients,
# part of the cohort of Schacher et al. (2006, Neurology 66, 81-87). The paper names no public
# deposit of them, and the data descriptor lists only iEEG, spikes and electrode positions. The
# claims that use BOLD are marked with_inputs. The muHGP claims need the continuous microwire
# signals; the data descriptor says only spike times and mean waveforms of the microwire data
# were shared.
#
# Inconsistencies in the paper, recorded here and in the claims that they touch: the abstract
# says 5 participants had microwires, Results 2.3 says 9 amygdalae, and the MUA column of
# Table 1 lists 8 amygdalae of 6 patients (1 L and R, 2 L and R, 3 L, 4 L, 5 R, 8 L), three of
# them SOZ, while Discussion 3.4 says there were no microwire recordings from SOZ amygdalae.
# Methods 4.4 gives eight AVERSIVE and nine NEUTRAL blocks; the data descriptor, quoting
# Schacher et al., gives eight of each. The Table 2 legend says BOLD correlated positively
# with HGP in 5 of 5 amygdalae; the Results and the table's own values give 3 of 5 nSOZ.
#
# Method of the iEEG power analysis, from Methods 4.8 and 4.11, used by several claims:
# bipolar amygdala channel; IIR Butterworth filter of order 2 per band, delta 1-4 Hz, theta
# 4-8, alpha 8-15, beta 15-30, gamma 30-60, high gamma above 60 Hz; amplitude of the Hilbert
# analytic signal; smoothed with a 1 s window; baseline corrected with the 1 s before the
# start of each sequence; z-scored within each trial; time-point by time-point linear mixed
# model Power ~ condition + (1|Patients) on all single trials; cluster-based permutation over
# time with 500 permutations of the AVERSIVE and NEUTRAL labels across participants,
# significance at p < 0.05. Modulation index MI = AVERSIVE minus NEUTRAL time-averaged power
# over the temporal clusters where the conditions differ significantly. Open details, each
# with the readings the text allows (the author runs them all):
# - HGP upper band edge. The text says only ">60 Hz". Reading (a) high-pass at 60 Hz up to
#   the Nyquist frequency of the 2 kHz signal; the macro pass-band was 0.5-1000 Hz (Methods 4.7).
# - Filter direction (one-pass or zero-phase) and the shape of the 1 s smoothing window are
#   not given; with 1 s smoothing they cannot change the outcome, and a zero-phase filter and a
#   boxcar window are used as standard choices.
# - "z-scored all data within each trial": (a) mean and SD over the whole 26 s trial
#   including the baseline; (b) mean and SD of the pre-sequence baseline; (c) over all trials
#   of the patient. Methods 4.8 also names two baseline variants (the mean of all epochs, the
#   mean of the previous epoch), reported as quantitatively similar; they are variants.
# - Which amygdalae enter the group test: (a) the 7 nSOZ amygdalae (Results 2.1, "In nSOZ
#   amygdalae"); (b) all 14 (Fig. 1 legend, "Over the group of participants"). Patients with
#   two amygdalae have one random factor level (the formula names only Patients).
# - The cluster-forming threshold and cluster statistic are not given: (a) time points with
#   p < 0.05 for the condition effect, cluster mass as the sum of the t (or F) values, as in
#   FieldTrip (Oostenveld et al. 2011, which the paper cites for the method); (b) cluster
#   length in time points.
# - The group test: Methods 4.11 name the mixed model; Results 2.1 names unpaired t-tests
#   corrected with random permutations. The mixed model is the main reading, the unpaired
#   t-test (AVERSIVE against NEUTRAL trials, pooled) a variant.
# - The MI window: (a) the group-level clusters of Fig. 1B and 1C applied to every amygdala;
#   (b) clusters found per amygdala. The Results say the window "occurred at stimulus onset in
#   HGP and was sustained throughout the trial in DELTA", which favours (a) but does not fix it.
#
# Method of the neuron analyses (Methods 4.11, Fig. 3 legend): Firing Rate Variability FRV =
# AVERSIVE minus NEUTRAL mean firing rate over the whole time interval of neuronal firing;
# Spatial Synchronization Index SSI = mean Spearman correlation of a neuron's firing rate with
# that of each neuron of the same amygdala on a different microwire; correlations are
# Spearman's; multiple linear regression of the per-neuron firing correlation (with HGP or
# BOLD) on FRV and SSI. Open details:
# - The time base of the firing rate correlations is given only per figure: Fig. 3A bins of
#   100 ms smoothed over 1 s; Fig. 3D a 15 s smoothing window; Methods 4.10 (for BOLD) iEEG
#   power down-sampled to 1.5 s and smoothed over 5 points (7.5 s). Each claim names which
#   readings apply.
# - Whether a correlation is computed over the concatenated time course of the session (or of
#   one condition's blocks) or per trial and then averaged is not given: (i) concatenated;
#   (ii) per trial, averaged.
# - FRV over (a) the 24 s blocks only, or (b) the full 26 s trials.
# - A neuron with no neighbour on another microwire has no SSI; it is left out of claims that
#   use SSI, the only reading under which SSI is defined.
