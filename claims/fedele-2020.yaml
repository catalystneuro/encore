claims:
- id: fig1b-delta-decrease
  statement: In amygdalae outside the SOZ, delta power (1-4 Hz) is lower during AVERSIVE than
    during NEUTRAL sequences, and the reduction lasts through the AVERSIVE sequence.
  source: Results 2.1, paragraph 1; Figure 1B
  quote: In nSOZ amygdalae, DELTA band power was consistently reduced throughout the duration of
    the AVERSIVE sequence (Fig. 1B)
  statistics:
  - test: linear mixed model per time point, cluster-based permutation correction (Fig. 1 legend
      calls it cluster analysis)
    p: 0.05
    p_relation: "<"
  criterion: The iEEG power method of the opening comment (Methods 4.8 and 4.11), run under each
    reading listed there (z-scoring, amygdala set, cluster statistic, mixed model or the
    unpaired t-test variant). Reproduced when, under the mixed model, at least one cluster with
    AVERSIVE below NEUTRAL has permutation p < 0.05 and the AVERSIVE mean delta power is below
    the NEUTRAL mean over the 24 s block, under every reading of the open details; blocked as
    methods_underspecified when the readings disagree. The Results say "throughout the duration"
    and Discussion 3.1 says the suppression "lasted for most of the AVERSIVE sequence"; no
    number is given in the main text (the abstract says "lasting up to 18 s"). "Most" is read as
    more than half of the 24 s block, and the claim is partially reproduced when the significant
    clusters cover less than half of it. The extent of the clusters is reported, and compared
    with the 18 s of the abstract.
- id: fig1c-hgp-increase-first-2s
  statement: High gamma power (above 60 Hz) is higher during AVERSIVE than during NEUTRAL
    sequences in the first 2 s of the sequence.
  source: Results 2.1, paragraph 1; Figure 1C
  quote: The HGP was enhanced in response to aversive stimuli during the first 2 s of the
    AVERSIVE sequence presentation (Fig. 1C, unpaired t-tests, corrected for multiple comparisons
    using random permutations, p < 0.05)
  statistics:
  - test: unpaired t-tests, corrected for multiple comparisons using random permutations (Results);
      linear mixed model with cluster-based permutation (Methods 4.11)
    p: 0.05
    p_relation: "<"
  criterion: As fig1b-delta-decrease, for HGP. Reproduced when a cluster with AVERSIVE above
    NEUTRAL with permutation p < 0.05 lies within, or begins within, the first 2 s after sequence
    onset, under every reading of the open details; the cluster's start and end are reported.
