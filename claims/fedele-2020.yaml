    value: 0.17
    tolerance: 0.28
  - quantity: mean Spearman r firing rate against HGP, NEUTRAL
    value: 0.18
    tolerance: 0.18
  depends_on:
  - neuron-count
  criterion: A claim of absence, judged on the paper's test, a Wilcoxon signed-rank test of
    per-neuron Spearman r (AVERSIVE against NEUTRAL) at p < 0.05. HGP is the bipolar macro
    channel of the neuron's amygdala (Methods 4.8 envelope). Open time base, readings (a) 100 ms
    bins smoothed over 1 s (Fig. 3A legend), (b) 1.5 s with 5-point smoothing (Methods 4.10),
    (c) 15 s smoothing (Fig. 3D legend); and (i) concatenated blocks of the condition, (ii) per
    block and averaged. Reproduced when the test finds no difference, not reproduced when it
    does; the effect size is reported for every reading. Tolerances on the means are the stated
    spreads.
