# Claims for Gillon, Lecoq et al. (2023, Sci Data 10, 287) on dandiset 000037.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-22,
# protocol as stated in docs/protocol.md (version pilot-10).
#
# Source: the version of record, full text as served by Europe PMC (PMC10192216), read from its
# Background, Methods, Data Records, Overview of data, Technical Validation, Usage Notes, Code
# availability, Tables 1 and 2 and the figure legends. No PDF was stored; no figure image was
# seen. The paper is a data descriptor: it states that it reports no statistical analyses, so
# no claim has statistics. Its only supplement, Supplementary Table 1 (session metadata), is
# also published as metadata.csv at https://github.com/jeromelecoq/allen_openscope_metadata
# (projects/credit_assignement, commit 0e9c7aca3d67cbab7c493ab824b7287fb9508f47); that copy was
# read. It holds the columns of Tables 1 and 2 plus local subject and session numbers, UTC
# imaging times, ages and experimental notes. The two other texts under paper/ (bioRxiv
# 10.1101/2021.01.15.426915 and J Neurosci 10.1523/jneurosci.1009-23.2023) are the analysis
# papers on the same data and are not the target here.
#
# Code read: https://github.com/colleenjg/OpenScope_CA_Analysis at commit
# 046e7fef5f452cdc0775fe54040b0f13aeae1e57 (2024-06-30), linked in Code availability and Usage
# Notes, with its dependency https://github.com/colleenjg/util (tag osca_mult, commit
# 2b05f954a4aa871dbfdd83d1546ebe8e7f3069c6), which holds math_util.calculate_snr and
# rolling_mean. The repository holds run_paper_figures.py (with --paper dataset), the panel
# definitions in paper_fig_util/paper_organization.py, the analyses in paper_fig_util/*_figs.py
# and analysis/*.py, mouse_df.csv (session table), roi_tracking/nway-matched-dfs (per-session
# ROI matching results, including the permutation examples of Fig. 8), and
# paper_figures/dataset_paper/Fig{1,2,5,6,7,8,9}/data_files/panel_*.json, the source data of
# each plotted panel. Choices the code settles, used below: figures 5, 7 and 9 use local
# sessions 1 to 3 that passed QC (sesspar pass_fail "P"), i.e. 33 sessions from 11 mice; mice
# 411400 and 412933, whose local sessions 1 to 3 failed QC, are left out of them; all ROIs in
# an NWB file are used (the code's list of bad ROIs is empty for NWB files); dF/F is used.
# The stimulus code (https://github.com/colleenjg/cred_assign_stimuli) and the matching package
# (https://github.com/AllenInstitute/ophys_nway_matching) were not read; the paper says its
# matching used a custom-modified version of the latter, which it does not link.
#
# Data the paper describes. Two-photon calcium imaging (GCaMP6f; Nikon A1R MP+, 16X objective,
# 910 nm; 30 Hz, 512 x 512 pixels, 400 um field of view) in the retinotopic centre of primary
# visual cortex of head-fixed mice on a running disc. 13 mice (7 male, 6 female) of two lines,
# Cux2-CreERT2;Camk2a-tTA;Ai93 (L2/3) and Rbp4-Cre_KL100;Camk2a-tTA;Ai93 (L5), each imaged in
# one plane: L2/3 somata (175 um, 3 mice), L2/3 distal apical dendrites (50 to 75 um, 3 mice),
# L5 somata (375 um, 3 mice), L5 distal apical dendrites (20 um, 4 mice). 50 sessions of 70
# min, listed with subject and session ids, dates, depth, ROI counts, tracked ROI counts, QC
# and stimulus seed in Tables 1 and 2. Somatic ROIs come from the Allen pipeline, dendritic
# ROIs from EXTRACT. Each session shows Gabor sequences (A-B-C-D-G, 300 ms images; inconsistent
# A-B-C-U-G) for 34 min and visual flow (105 squares, leftward and rightward, 17 min each, with
# 25% of squares reversed during inconsistent flow), in random order, flanked by 30 s of grey
# screen. Measured variables: per-ROI dF/F traces, ROI masks, ROI tracking indices across the
# three tracked sessions, a projection image, running velocity (60 Hz, cm/s), pupil diameter
# and centroid position (mm, from DeepLabCut), a stimulus parameter table, stimulus frame
# images (file version [I]) and the motion-corrected imaging stack (version [S]). Files are
# named sub-{subject}_ses-{session}_{content}.nwb, one per session and version. The paper names
# the dataset as DANDI 000037; that archive entry should hold these 50 sessions.
#
# Outside data. The repository's roi_tracking/nway-matched-dfs (commit above) holds the
# per-permutation matching counts used in Fig. 8 (claims fig8a-conflicts, fig8b-conflicts);
# paper_figures/dataset_paper/*/data_files hold the source data of the figures (claim
# fig7a-source-link). Illustrative videos are on FigShare (ref. 16), not used. Behaviour and
# pupil videos are available only on request.
#
# For the author's information only, not a criterion: the repository's Fig. 7c source data give
# 134 of 752101 L2/3 dendritic pairs (0.018%) with r of 0.8 or more over sessions 1 to 3, and its
# Fig. 7a source data give every ROI an SNR above 2.
schema_version: 2
dataset:
  archive: dandi
  id: "000037"
paper: doi:10.1038/s41597-023-02214-y
claims:
- id: table1-subjects
  statement: The dataset holds 13 mice whose subject ids, sex, date of birth, imaged cell type
    (L2/3 or L5 pyramidal) and imaging plane (somata or distal apical dendrites) are as listed
    in Table 1.
  source: Methods, Experimental animals and calcium imaging, Table 1
  inferred: The values are those of Table 1; no sentence states them.
  criterion: Each subject of the dataset is matched to Table 1 by its six-digit subject id, and
    sex, date of birth, cell type and plane are compared where the dataset records them.
    Reproduced when all 13 subjects are present and every recorded field matches; partially
    reproduced when all 13 are present and at most two fields in total disagree; not
    reproduced otherwise. Fields the dataset does not record are listed, not counted.
- id: cohorts-by-plane
  statement: Thirteen mice were imaged, three L2/3 dendritic, three L2/3 somatic, four L5
    dendritic and three L5 somatic, each with at least three imaging sessions.
  source: Methods, Experimental animals and calcium imaging, paragraph 1
  quote: "13 mice in total underwent imaging (L2/3-D: n = 3, L2/3-S: n = 3, L5-D: n = 4, L5-S: n =
    3) with at least three optical imaging sessions recorded in each"
  expected:
  - quantity: mice, L2/3 dendrites
    value: 3
    tolerance: 0
  - quantity: mice, L2/3 somata
    value: 3
    tolerance: 0
  - quantity: mice, L5 dendrites
    value: 4
    tolerance: 0
  - quantity: mice, L5 somata
    value: 3
    tolerance: 0
  criterion: Counts of subjects per line and plane, and of sessions per subject, from the
    dataset. Tolerance 0 because these are counts of deposited subjects, not estimates.
    Reproduced when all four counts match and every mouse has at least three sessions.
- id: sex-split
  statement: Seven of the mice are male and six female, and only one L2/3 dendritic mouse is
    female.
  source: Data Records, Animal and recording session attributes, paragraph 1
  quote: while the dataset is well-split between male (7) and female (6) subjects, splitting the
    data further by sex may result in some groups with N = 1 (e.g., there is only 1 female L2/3-D
    mouse)
  expected:
  - quantity: male mice
    value: 7
    tolerance: 0
  - quantity: female mice
    value: 6
    tolerance: 0
  - quantity: female L2/3 dendritic mice
    value: 1
    tolerance: 0
  criterion: Counts from the subjects' recorded sex. Tolerance 0 because these are counts.
- id: sessions-total
  statement: The dataset holds 50 imaging sessions from 13 animals, each session in its own
    files grouped by subject.
  source: Data Records, Data organization, paragraph 1; Animal and recording session
    attributes, paragraph 1
  quote: data for 50 recording sessions total were gathered from 13 animals
  expected:
    quantity: sessions
    value: 50
    tolerance: 0
  criterion: Count of distinct session ids in the dataset, and of subject folders. Tolerance 0
    because it is a count of deposited sessions. Reproduced when there are 50 sessions from 13
    subjects.
- id: table2-sessions
  statement: The 50 sessions have the subject ids, session ids, imaging dates, imaging depths,
    ROI counts, tracked ROI counts, QC results and stimulus seeds listed in Table 2.
  source: Methods, Experimental animals and calcium imaging, Table 2
  inferred: The values are those of Table 2; no sentence states them.
  criterion: Each session is matched to Table 2 by its nine-digit session id. Compared, where
    the dataset records them, are subject, imaging date, depth, the number of ROIs (the ROIs in
    the file; the paper's code uses every ROI of an NWB file, analysis/session.py
    _set_bad_rois), the number of tracked ROIs (the ROIs carrying a tracking index; 0 in Table 2
    means none), QC and stimulus seed. Reproduced when all 50 sessions are present and every
    recorded field matches; partially reproduced when at least 45 sessions match in every
    recorded field; not reproduced otherwise. Fields the dataset does not record are listed.
- id: qc-failures
  statement: Two animals had at least one session that failed the Allen Institute's QC
    thresholds, and some animals had more than three sessions, for example when an early
    session failed QC.
  source: Data Records, Animal and recording session attributes, paragraph 1
  quote: Of these, two animals had at least one session that did not meet the Allen
    Institute's previously-described 15 quality control thresholds
  expected:
    quantity: animals with a failed session
    value: 2
    tolerance: 0
  criterion: From the QC status the dataset records per session. The paper's own Table 2 marks
    failed sessions in three animals (411400 and 412933, sessions 1 to 3, and 440889, sessions
    5 and 6), so the count can be read as (a) animals with any failed session, or (b) animals
    whose first three sessions failed and that were therefore re-imaged. Reproduced when the
    count is 2 under one reading; the notebook reports both counts and the animals with more
    than three sessions. If the dataset records no QC status the claim is blocked.
- id: session-schedule
  statement: Each mouse had three 70-minute imaging sessions within three to six days, with at
    most one session per day.
  source: Methods, Experimental animals and calcium imaging, paragraph 1
  quote: Following habituation, they underwent three 70-minute optical imaging sessions within a
    span of three to six days, with no more than one session occurring per day
  criterion: For each mouse, the three sessions can be read as (i) its local sessions 1 to 3
    (Supplementary Table 1), the first three after habituation, whatever their QC, or (ii) the
    sessions of the paper's analyses, the local sessions 1 to 3 that passed QC, or for mice
    411400 and 412933 their tracked sessions 4 to 6. Dates from the sessions' start times. The
    span can be read as (a) days from the first to the third session (allowed 3 to 6) or (b)
    calendar days counted inclusively (allowed 3 to 6). By the dates of Table 2, reading (a)
    gives 2 days for five mice under (ii) and seven under (i), and reading (ii)(b) gives 7 days
    for mouse 411400; the notebook
    shows all four combinations. Reproduced when, under one combination, every mouse's span is
    in range and no two sessions of a mouse share a date; partially reproduced when all but one
    mouse meet it; not reproduced otherwise. Session durations are reported, with 70 min +/- 10%
    as the check.
- id: imaging-depths
  statement: Somata were imaged at 175 um (L2/3) and 375 um (L5) depth, and distal apical
    dendrites at 50 to 75 um (L2/3) and 20 um (L5).
  source: Methods, Experimental animals and calcium imaging, paragraph 1
  quote: two-photon calcium imaging was performed in either the cell body layer for somatic
    recordings (175 μ m depth for layer 2/3 and 375 μ m depth for layer 5) or in cortical layer 1
    for distal apical dendritic recordings (50–75 μ m depth for layer 2/3 and 20 μ m depth for
    layer 5)
  criterion: From the imaging depth the dataset records per session. Reproduced when every
    session's depth equals the value for its line and plane (any of 50, 75 for L2/3 dendrites);
    partially reproduced when all but up to two sessions do. Blocked if no depth is recorded.
- id: acquisition-rates
  statement: Calcium movies were recorded at 30 Hz over a 400 um field of view at 512 x 512
    pixels, and running was recorded at 60 Hz in cm/s.
  source: Methods, Experimental animals and calcium imaging, paragraph 2; Running and pupil
    tracking, paragraph 1
  quote: Calcium fluorescence movies were recorded at 30 Hz with resonant scanners over a 400 μ m
    field of view with a resolution of 512 × 512 pixels
  expected:
  - quantity: imaging frame rate
    value: 30
    tolerance: 3
    unit: Hz
  - quantity: running sampling rate
    value: 60
    tolerance: 6
    unit: Hz
  - quantity: imaging frame size, pixels per side
    value: 512
    tolerance: 0
  criterion: Rates from the timestamps (median inter-sample interval) or recorded rate of the
    dF/F and running series; frame size from the imaging plane image or stack. Tolerance 0 on
    the frame size because it is a fixed dimension. Reproduced when all values hold in every
    session that holds the series.
- id: roi-noise-rejection
  statement: ROIs that were too noisy, with a mean dF/F below 0 or a median dF/F above the
    midpoint between the trace's minimum and maximum, were rejected, so no retained ROI has
    either property.
  source: Methods, Experimental animals and calcium imaging, paragraph 3
  quote: any remaining ROIs identified as being duplicates or unions, overlapping the motion
    border or being too noisy (defined as having a mean ΔF/F below 0 or a median ΔF/F above the
    mid-range ΔF/F, i.e., the midpoint between the minimum and maximum) were rejected
  criterion: For every ROI of every session, the mean and median of its full-session dF/F trace
    and its mid-range ((min + max) / 2). Reproduced when no ROI has a mean below 0 or a median
    above its mid-range; partially reproduced when fewer than 1% of ROIs do; not reproduced
    otherwise. The counts per session are reported. The duplicate, union and motion-border
    rules cannot be checked from the traces and are not tested.
- id: roi-count-ranges
  statement: Somatic planes yielded 15 to 224 ROIs per mouse per session and dendritic planes
    159 to 1636.
  source: Methods, Experimental animals and calcium imaging, paragraph 3
  quote: In the somatic layers, 15–224 ROIs per mouse per session were identified and retained
    for analysis, compared to 159–1636 ROIs in the dendritic layers.
  expected:
  - quantity: fewest ROIs in a somatic session
    value: 15
    tolerance: 1.5
  - quantity: most ROIs in a somatic session
    value: 224
    tolerance: 22.4
  - quantity: fewest ROIs in a dendritic session
    value: 159
    tolerance: 15.9
  - quantity: most ROIs in a dendritic session
    value: 1636
    tolerance: 163.6
  criterion: The ROIs in each file (all are used, as in the paper's code). The sessions can be
    read as (a) the 33 sessions of the paper's analyses (local sessions 1 to 3 passing QC), (b)
    all sessions that passed QC, or (c) all 50 sessions. Reproduced when, under one reading, the
    minimum and maximum per plane type are within tolerance. The notebook shows all three.
- id: tracked-roi-totals
  statement: Matching produced 254 tracked ROIs in L2/3 dendritic planes, 261 in L2/3 somatic,
    516 in L5 dendritic and 129 in L5 somatic, about 100 to 500 per plane and about 32 to 75% of
    the theoretical maximum number of trackable ROIs.
  source: Methods, ROI tracking across sessions, paragraph 1
  quote: "In total, the modified matching algorithm produced ~100–500 highly plausible matched ROIs
    per plane, i.e., ~32–75% of the theoretical maximum number of trackable ROIs (L2/3-D: n = 254,
    L2/3-S: n = 261, L5-D: n = 516, L5-S: n = 129)"
  expected:
  - quantity: tracked ROIs, L2/3 dendrites
    value: 254
    tolerance: 0
  - quantity: tracked ROIs, L2/3 somata
    value: 261
    tolerance: 0
  - quantity: tracked ROIs, L5 dendrites
    value: 516
    tolerance: 0
  - quantity: tracked ROIs, L5 somata
    value: 129
    tolerance: 0
  - quantity: lowest percentage of the theoretical maximum, over planes
    value: 32
    tolerance: 3.2
    unit: "%"
  - quantity: highest percentage of the theoretical maximum, over planes
    value: 75
    tolerance: 7.5
    unit: "%"
  criterion: A tracked ROI is one carrying a tracking index in the dataset; each mouse's count is
    the number of tracked ROIs in one of its three tracked sessions (equal across them). The
    totals are summed per plane over the 11 mice of the paper's analyses; this is the reading
    under which Table 2 gives these totals (mice 411400 and 412933, tracked on sessions 4 to 6,
    are left out); a sum over all 13 mice is shown as a variant. Tolerance 0 on the totals
    because they are counts of deposited indices. The theoretical maximum is not defined in the
    paper; readings are (a) per mouse, the smallest ROI count of its three tracked sessions,
    summed per plane, and (b) per mouse, the mean ROI count of those sessions, summed per plane.
    The range claim holds when, under one reading, the lowest and highest plane percentages are
    within tolerance. Reproduced when the four totals match and the range claim holds;
    partially reproduced when only the totals match.
- id: tracked-sessions-overlap
  statement: The same imaging planes were recorded over three days and many ROIs could be
    identified in each day's recording, so that individual dendritic segments and somata can
    be followed over the three sessions.
  source: Background & Summary, paragraph 3
  quote: By segmenting the data in each plane into regions of interest (ROIs), and registering
    these ROIs across recording days, we were able to identify single ROIs that were present in
    each day's recording.
  depends_on:
  - tracked-roi-totals
  criterion: For each tracked mouse, the tracking indices of its three tracked sessions are read
    from the dataset. Reproduced when every tracked mouse's three sessions carry the same number
    of tracked ROIs and the tracking indices define one-to-one matches across the three
    sessions (each index appears once per session); not reproduced otherwise.
- id: fig8a-final-matches
  statement: In the example L2/3 dendritic mouse of Fig. 8a, removing four conflicting
    pairwise matches from the union over session orderings left 136 final matches.
  source: Figure 8a legend
  quote: In this example, four pairwise matches were identified as conflicts and removed,
    yielding 136 final matches.
  expected:
    quantity: tracked ROIs, example L2/3 dendritic mouse
    value: 136
    tolerance: 0
  criterion: The example mouse is the L2/3 dendritic mouse with 136 tracked ROIs in Table 2
