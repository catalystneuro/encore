- id: gabor-sequence-structure
  statement: Gabor sequences are repeating 1.5-s sequences of five 300-ms images (A-B-C-D-G),
    each non-grey image holding 30 Gabor patches, with inconsistent sequences replacing D by U,
    whose mean orientation is shifted by 90 degrees (drawn from 90, 135, 180 and 225 degrees,
    against 0, 45, 90 and 135 degrees for the other images).
  source: Methods, Visual stimulation, paragraphs 2 and 3
  quote: it consisted of repeating 1.5-second sequences, each comprising five consecutive images
    ( A-B-C-D-G ) presented for 300 ms each ... “Inconsistent” sequences were created by
    replacing D images with U images in the sequence ( A-B-C-U-G ) ... namely from {90°, 135°,
    180°, 225°}
  expected:
  - quantity: image duration
    value: 0.3
    tolerance: 0.03
    unit: s
  - quantity: Gabor patches per image
    value: 30
    tolerance: 0
  criterion: From the stimulus parameter table of each session. Image durations from their start
    and stop times; the number of patches from the per-image parameters, if recorded (tolerance
    0, a fixed design value). Reproduced when, in every session that holds the table, images
    follow the A-B-C-D/U-G order, last 300 ms +/- 10%, the mean orientations of A to D take
    only 0, 45, 90 and 135 degrees, and U mean orientations take only 90, 135, 180 and 225
    degrees and equal the sequence's mean orientation plus 90 degrees.
- id: visual-flow-structure
  statement: Visual flow is 105 white squares of 8 by 8 degrees moving at 50 degrees per second,
    in two consecutive periods (rightward and leftward) in random order, with 25% of squares
    reversed for 2 to 4 s during inconsistent flow.
  source: Methods, Visual stimulation, paragraph 4
  quote: The visual flow stimulus consisted of 105 white squares moving uniformly across the
    screen at a velocity of 50 visual degrees per second, with each square being 8 by 8 visual
    degrees in size.
  expected:
  - quantity: squares
    value: 105
    tolerance: 0
  - quantity: square speed
    value: 50
    tolerance: 5
    unit: deg/s
  - quantity: square size
    value: 8
    tolerance: 0.8
    unit: deg
  - quantity: fraction of squares reversed in inconsistent flow
    value: 25
    tolerance: 2.5
    unit: "%"
  criterion: From the stimulus parameter table, where it records these values. Tolerance 0 on
    the number of squares because it is a design count. Reproduced when every session holding
    the table matches, and each session shows the two directions as two consecutive periods.
    Values the table does not hold are listed as untestable.
- id: session-stimulus-durations
  statement: Each imaging session lasted 70 min, with 34 min of Gabor sequences and 17 min of
    visual flow in each direction, each stimulus period flanked by 30 s of grey screen.
  source: Methods, Visual stimulation, paragraph 1
  quote: optical imaging sessions always lasted 70 minutes, comprising 34 minutes of Gabor
    sequence stimulus and 17 minutes of visual flow stimulus in each direction. Each stimulus
    period was flanked by 1 or 30 seconds of grayscreen for the habituation and optical imaging
    sessions, respectively.
  expected:
  - quantity: Gabor stimulus duration
    value: 34
    tolerance: 3.4
    unit: min
  - quantity: visual flow duration per direction
    value: 17
    tolerance: 1.7
    unit: min
  - quantity: grey screen flanking each stimulus period
    value: 30
    tolerance: 3
    unit: s
  criterion: From the stimulus table's start and stop times, per session. Reproduced when all
    three hold in every session; partially reproduced when they hold in at least 45 of 50.
- id: inconsistent-fractions
  statement: Inconsistent sequences make up about 7% of Gabor sequences and 5% of visual flow
    time.
  source: Methods, Visual stimulation, paragraph 5
  quote: Inconsistent sequences, accounting for approximately 7% of the Gabor sequences and 5% of
    visual flow stimulus time, only occurred on optical imaging days, and not on habituation
    days.
  expected:
  - quantity: fraction of Gabor sequences that are inconsistent
    value: 7
    tolerance: 0.7
    unit: "%"
  - quantity: fraction of visual flow time that is inconsistent
    value: 5
    tolerance: 0.5
    unit: "%"
  criterion: From the stimulus table, per session; the values compared are the means over
    sessions, and each session's value is reported. Gabor, the number of A-B-C-U-G sequences
    over all sequences; visual flow, the time with reversed squares over all visual flow time.
    Habituation sessions are not in the dataset (Table 2 lists imaging sessions only), so the
    absence of inconsistent stimuli during habituation is not tested.
- id: inconsistent-blocks
  statement: Each session is divided into about 30 blocks, each of 30 to 90 s of consistent
    stimulus followed by 3 to 6 s (Gabor) or 2 to 4 s (visual flow) of inconsistent stimulus,
    in multiples of 1.5 s (Gabor) and 1 s (visual flow).
  source: Methods, Visual stimulation, paragraph 5
  quote: each 70-minute imaging session was broken up into approximately 30 blocks, each
    comprising 30–90 seconds of consistent sequences followed by several seconds of inconsistent
    sequences (3–6 seconds for Gabor sequence stimulus and 2–4 seconds for the visual flow
    stimulus)
  expected:
    quantity: blocks
    value: 30
    tolerance: 3
  criterion: A block is a run of consistent stimulus ending with a run of inconsistent
    stimulus, from the stimulus table. The block count can be read as (a) per session, all
    stimuli together, (b) per stimulus (Gabor, and visual flow with both directions together),
    or (c) per stimulus and direction. Reproduced when, under one reading, the mean count is
    within tolerance and the consistent and inconsistent durations fall in the stated ranges
    (each widened by 10% of its bounds) for at least 95% of blocks.
- id: fig5-example-responses
  statement: Both somatic and dendritic ROIs responded clearly to the Gabor and visual flow
    stimuli, many with increased fluorescence at stimulus onset.
  source: Overview of data, paragraph 1; Figure 5
  quote: Both the somatic and dendritic ROIs showed clear responses to both the Gabor and visual
    flow stimuli, with many showing increased fluorescence responses to the onset of the stimuli
    (Fig. 5 ).
  criterion: Session 1 (local, passing QC; 11 mice), each line and plane. Selection as in the
    Figure 5 legend ("for the session") and the code (analysis/seq_analys.py get_sess_ex_traces,
    identify_gabor_roi_ns, identify_visflow_roi_ns), made within each mouse's session; the
    selected ROIs are then pooled over mice per line and plane (get_ex_traces_df, which draws 6
    random examples from the pool for plotting; all selected ROIs are used here). Gabor, ROIs with SNR (claim fig7a-snr-above-1) above the session median;
    among them, those whose median pairwise correlation between individual sequence responses
    (each smoothed with a 4-point moving average), and the standard deviation and skew of their
    mean response, all exceed the 75th percentile of those ROIs; sequences are the -0.9 to 0.6 s
    window around D (consistent, panel a) or U (inconsistent, panel b) onset. Visual flow, per
    direction, the -2 to 2 s window around inconsistent flow onset; ROIs above the median SNR
    whose median pairwise correlation of post-onset responses and mean post-minus-pre
    difference exceed the 75th percentile. Traces are dF/F robust-scaled per ROI over the
    session ((x - median) / (95th - 5th percentile)), as in the code; unscaled dF/F is a
    variant. Reproduced when in all four planes the selection yields ROIs for the Gabor
    sequences and for each flow direction, and in each plane the mean over selected ROIs of
    their mean trace is higher after the reference onset (0 to 0.6 s for Gabor, 0 to 2 s for
    flow) than before it. Partially reproduced when this holds in at least two planes.
- id: fig5-consistent-vs-inconsistent
  statement: Responses to consistent and inconsistent stimuli differed clearly in the example
    ROIs.
  source: Overview of data, paragraph 1; Figure 5a versus b, and c and d
  quote: There were also clear differences in the responses to the consistent versus
    inconsistent stimuli as well (Fig. 5a versus b, and c & d).
  depends_on:
  - fig5-example-responses
  criterion: The paper reports no test and calls its examples randomly selected. Gabor, per
    plane, session 1, the ROIs selected as in fig5-example-responses; the selection can be read
    as (a) the panel a ROIs (selected on consistent sequences) or (b) the panel b ROIs (selected
    on inconsistent sequences). For the selected ROIs, the mean over ROIs of their mean trace
    after D onset and after U onset (0 to 0.6 s), with the SEM across ROIs as in the legend. A
    difference is clear when, at some time point in 0 to 0.6 s, the two mean traces differ by
    more than the sum of their SEMs (the plotted bands do not overlap). Reproduced when this
    holds in all four planes under both readings; partially reproduced when it holds in at least
    two planes under both; methods_underspecified if the readings disagree. For visual flow,
    the selection itself requires a larger response after inconsistent onset, so the
    comparison is circular and is reported, not judged.
- id: fig6-behaviour-all-mice
  statement: Running velocity and pupil diameter were recorded in sessions 1 to 3 of all 11
    mice, so their distributions can be shown per session across mice.
  source: Figure 6b legend
  quote: Data is stacked across all mice (11), with each mouse represented by a different shade
    of gray.
  expected:
    quantity: mice with running and pupil data in sessions 1 to 3
    value: 11
    tolerance: 0
  criterion: The 33 sessions of the paper's analyses (local sessions 1 to 3 passing QC). A
    session counts when it holds a running velocity series in cm/s and a pupil diameter series
    in mm with finite values. Tolerance 0 because it is a count. Reproduced when all 33
    sessions count; partially reproduced when at least 30 do.
- id: fig7a-snr-above-1
  statement: ROI dF/F traces have a relatively high SNR, above 1.
  source: Technical Validation, paragraph 2; Figure 7a
  quote: These are shown in Fig. 7A , and demonstrate that our recordings have relatively high
    SNR (>1)
  criterion: SNR per ROI on its full-session unscaled dF/F trace, as in the Methods and the
    code (util math_util.calculate_snr). The values at or below the trace's median are mirrored
    about the median to form the noise sample; its mean and standard deviation define a normal
    distribution whose 95th percentile is the noise threshold; SNR is the mean of values above
    the threshold divided by the noise standard deviation. The 33 sessions of the paper's
    analyses, ROIs pooled over mice per line, plane and session (12 groups), as in the code.
    "SNR (>1)" can be read as (a) the median of each group above 1, (b) the 5th percentile of
    each group (the lower whisker) above 1, or (c) every ROI above 1. By this construction an
    ROI's SNR exceeds 1.645 whenever its median dF/F is at least 0, which bears on reading (c).
    These are readings of a reported number (docs/protocol.md, Reader, step 3), so the claim is
    reproduced when it holds under one reading; the notebook shows each and names those that hold.
- id: fig7a-snr-stable
  statement: ROI SNR is stable over the three days.
  source: Technical Validation, paragraph 2; Figure 7a
  quote: demonstrate that our recordings have relatively high SNR (>1) and that this is quite
    stable over days
  depends_on:
  - fig7a-snr-above-1
  criterion: The SNR groups of fig7a-snr-above-1, compared across sessions 1 to 3 within each
    line and plane, as the boxplots of Figure 7a (notched, whiskers at the 5th and 95th
    percentiles, from the code). The paper defines no test. Stable can be read as (a) the
    notches of the three sessions overlap pairwise (matplotlib's notch, median +/- 1.57 IQR /
    sqrt(n), the code's plot) or (b) each session's median lies inside the interquartile range
    of every other session of the plane. Reproduced when all four planes are stable under both
    readings; partially reproduced when at least three are under both; methods_underspecified
    if the readings disagree.
- id: fig7b-signal-stable
  statement: The mean dF/F signal of ROIs is stable over days.
  source: Technical Validation, paragraph 2; Figure 7b
  quote: Similarly, the mean ΔF/F signal was stable over days (Fig. 7b ).
  depends_on:
  - fig7a-snr-above-1
  criterion: Signal per ROI is the mean of its full-session dF/F values above the noise
    threshold of fig7a-snr-above-1, as the Figure 7b legend defines it and the code computes it
    (the last value returned by calculate_snr). Same groups, readings and decision as
    fig7a-snr-stable.
- id: fig7c-correlations-similar
  statement: The distributions of pairwise ROI correlations are very similar for apical
    dendrite ROIs and somatic ROIs, which suggests the dendrites are not heavily
    over-segmented.
  source: Technical Validation, paragraph 3; Figure 7c
  quote: The distributions of correlation coefficients were very similar for the apical dendrite
    ROIs and for the somatic ROIs (Fig. 7c ), suggesting that we were unlikely to be heavily
    over-segmenting the dendritic data.
  criterion: Pearson correlation of every pair of ROIs within a session, on full-session dF/F
    traces each smoothed with a centred 4-point moving average (Figure 7c legend; the code uses
    scipy.ndimage.convolve, mode mirror). The 33 sessions of the paper's analyses; pairs pooled
    over mice per line, plane and session, as in the code, which bins them in 40 bins of width
    0.05 from -1 to 1. Similar is not defined; it is read as the dendritic and somatic
    distributions of the same line and session having medians, and 95th percentiles, that
    differ by less than (a) one bin (0.05) or (b) two bins (0.1). Reproduced when this holds for
    all six line and session comparisons under both readings; partially reproduced when it
    holds for at least four under both; methods_underspecified if the readings disagree. The
    fraction of pairs above 0.8 per group is reported.
- id: fig7c-high-correlation-fraction
  statement: About 0.01% of possible pairs of L2/3 dendritic ROIs have correlations above 0.8.
  source: Technical Validation, paragraph 3
  quote: To be more conservative, ROIs with correlations above 0.8 (e.g., approximately 0.01% of
    possible pairs of L2/3 dendrites)
  depends_on:
  - fig7c-correlations-similar
  expected:
    quantity: L2/3 dendritic ROI pairs with correlation above 0.8
    value: 0.01
    tolerance: 0.005
    unit: "%"
  criterion: The correlations of fig7c-correlations-similar, L2/3 dendritic sessions. Tolerance
    0.005 percentage points, the range of values that round to the stated one significant
    figure (0.005 to 0.015%), since the paper gives the value as approximate with one figure.
    Readings for the denominator are (a) all pairs pooled over the three sessions and three
    mice, (b) the mean of per-session fractions, and (c) each session separately. Above 0.8 is
    read as r > 0.8; r >= 0.8 (the code's histogram bin) is shown as a variant. Reproduced when
    one reading is within tolerance.
- id: fig7a-source-link
  kind: link
  statement: The per-ROI SNRs computed from the dataset agree with those in the source data of
    Figure 7a in the paper's repository.
  source: Figure 7a; paper_figures/dataset_paper/Fig7/data_files/panel_A.json at the commit
    above
  quote: These are shown in Fig. 7A
  data: with_inputs
  depends_on:
  - fig7a-snr-above-1
  criterion: Sessions matched by session id, ROIs by their order in the file. Reproduced when, in
    every one of the 33 sessions, the number of ROIs equals the source data's and at least 95%
    of ROIs have an SNR within 1% of the source value (the same computation on the same traces;
    1% allows for numerical precision); partially reproduced when this holds in at least 30
    sessions.
- id: fig9-onset-offset-transients
  statement: Mean dF/F responses across ROIs show distinct transients aligned to stimulus onsets
    (grey screen to stimulus) and offsets (stimulus to grey screen), which validates the
    temporal alignment of stimuli and recordings.
  source: Technical Validation, paragraph 5; Figure 9a and b
  quote: These ΔF/F traces show distinct transients that align with the stimulus onsets and
    offsets (Fig. 9 ), validating our temporal alignment, and demonstrating clear stimulus
    responses in the identified ROIs.
  criterion: The 33 sessions of the paper's analyses. As in the code (analysis/basic_analys.py
    get_stim_on_off_data), onsets are the ends of every grey screen period but the last, and
    offsets the starts of every grey screen period but the first; the text names transitions to
    and from Gabor sequences or visual flow, while the Figure 9a legend says "(Gabor sequence)",
    so the onsets and offsets can be read as (a) all transitions (text and code) or (b) Gabor
    transitions only. Window -2 to 2 s around each transition (code); per ROI, the mean trace
    over transitions; robust-scaled dF/F as in the code ((x - median) / (95th - 5th
    percentile) over the session), unscaled dF/F as a variant; then mean and SEM across ROIs
    pooled over mice per line, plane and session (12 groups). A group shows a transient when, at
    some time in 0 to 2 s, the mean trace differs from its mean over -2 to 0 s by more than k
    SEM at that time; k is not given and is read as 1 or 2. Reproduced when every group shows a
    transient at onset and at offset under all readings; partially reproduced when at least 9 of
    12 groups do for both onset and offset under all readings; methods_underspecified if the
    readings give different outcomes.
- id: file-sizes
  statement: Each session has three file versions; basic files are about 130 MB to 1.7 GB, the
    stimulus images add about 1.5 GB, and the motion-corrected stack adds about 45 GB.
  source: Data Records, Data organization, paragraph 2
  quote: amounting to about 130 MB to 1.7 GB per file. Adding the stimulus frame images increased
    the file sizes by about 1.5 GB each [I]. Further adding the motion corrected imaging stack
    increased the file sizes much more, by about 45 GB per file [S].
  expected:
  - quantity: smallest basic file
    value: 130
    tolerance: 13
    unit: MB
  - quantity: largest basic file
    value: 1.7
    tolerance: 0.17
    unit: GB
  - quantity: added size of stimulus images, median over sessions
    value: 1.5
    tolerance: 0.15
    unit: GB
  - quantity: added size of the imaging stack, median over sessions
    value: 45
    tolerance: 4.5
    unit: GB
  criterion: Sizes from the archive's asset list, files identified by the naming convention of
    the paper (behavior+ophys, behavior+image+ophys, obj-raw_behavior+image+ophys). Added sizes
    are per session, [I] minus [B] and [S] minus [I]. MB and GB can be read as decimal or binary
    units; reproduced when, under one, all four values are within tolerance and every session
    has the three versions.
- id: download-33-files
  statement: The basic files of the sessions 1 to 3 that passed QC are 33 files totalling about
    15 GB.
  source: Usage Notes, paragraph 1
  quote: If only the basic data files for sessions 1 to 3 that passed quality control are
    needed, the total download size is approximately 15 GB for 33 files in total.
  expected:
  - quantity: basic files, sessions 1 to 3 passing QC
    value: 33
    tolerance: 0
  - quantity: total size of those files
    value: 15
    tolerance: 1.5
    unit: GB
  criterion: Sessions 1 to 3 are local session numbers (Supplementary Table 1, as in the code's
    session table); passing QC as recorded in the dataset or Table 2. Tolerance 0 on the count
    because it is a count. Sizes from the asset list, decimal or binary GB as in file-sizes.
