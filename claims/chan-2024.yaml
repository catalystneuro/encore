- id: nocturnal-share-of-fruit
  statement: Hawkmoths and crepuscular bees account for about 40% of fruit set, so the 70% drop
    in visitation under NO3 would cut total fruit set by about 28%.
  source: Results, NO3 suppresses plant-pollinator visitations, paragraph 3; Table S3
  quote: hawkmoths and crepuscular bees account for 40% (±10%) of all fruits (table S3); thus, a
    70% drop in visitation will cause a 28% (±11%) reduction in the total fruit set
  expected:
  - quantity: share of fruit set due to nocturnal and crepuscular pollinators
    value: 40
    tolerance: 10
    unit: percent
  - quantity: predicted reduction of total fruit set
    value: 28
    tolerance: 11
    unit: percent
  criterion: The paper does not give the formula. The reading its numbers allow is (unbagged
    minus nocturnal exclusion) over unbagged fruit-set proportion for the share, and the
    share times the field drop in visitation (fig3d-visits-per-night) for the reduction. A
    second reading takes the share as (diurnal exclusion over unbagged), the fruit set left
    when only night pollinators visit. Tolerances are the paper's stated spreads. Reproduced
    when both values are within tolerance under one reading.
  depends_on:
  - fig3d-visits-per-night
  data: elsewhere
  where: Zenodo doi:10.5281/zenodo.8411927
- id: fig2a-gcead-monoterpenes
  statement: Hyles and Manduca antennae respond to many of the same compounds in the O. pallida
    scent and are especially sensitive to the monoterpenes cis-b-ocimene and b-pinene; 12
    antennal-active compounds were used for the synthetic floral odor.
  source: Results, Atmospheric oxidation of O. pallida floral scent, paragraph 1; Figure 2A;
    Figure S2
  quote: the hawkmoths had similar antennal responses and were especially sensitive to
    monoterpenes (cis-β-ocimene and βpinene) (Fig. 2A)
  criterion: Bioactive peaks are those whose EAD deflection exceeds the average baseline noise
    floor, judged visually (Supplementary Methods, GC-EAD). No threshold is given, so the
    threshold is open; the readings below are standard choices, not the paper's, (a) a
    deflection larger than 3 standard deviations of the baseline EAD signal, (b) larger than
    the largest baseline excursion in the 1 min before the peak. The paper does not say in how
    many antennae a peak must be active, nor what "especially sensitive" means; read as active
    in more than half of the antennae of each moth species, and as b-pinene and cis-b-ocimene
    having the two largest mean deflections among the active peaks, or being among the three
    largest. Reproduced when, under one reading, both peaks are active and especially
    sensitive in each moth species.
