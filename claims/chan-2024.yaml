# Claims for Chan, Parasurama, Atlas, Xu, Jongebloed, Alexander, Langenhan, Thornton & Riffell
# (2024), "Olfaction in the Anthropocene: NO3 negatively affects floral scent and nocturnal
# pollination", Science 383, 607-611, on Dryad doi:10.5061/dryad.vt4b8gtzk.
#
# Provenance: written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub
# Actions"), 2026-11-26, protocol pilot-19 as stated in docs/protocol.md (Reader, steps 1 to 4).
#
# Text read: the author manuscript (NIHMS2120560, PMC12704221; main text and figure legends)
# with the Supplementary Materials of the version of record (Materials and Methods, Equation
# S1, Figs. S1 to S9 with legends, Tables S1 to S13), in paper/10.1126-science.adi0858.txt,
# supplied by a person and extracted from the PDFs. PDF pages 9 to 12 (Figs. 1 to 4) were
# opened to read bar labels and the Fig. 2D inset table. The MDAR checklist was not supplied
# and no claim rests on it.
#
# Code read: the paper cites custom code at Zenodo doi:10.5281/zenodo.8411927, the release of
# https://github.com/riffelllab/Chan-et-al, read at commit
# ffc155978f86f1559e762a6d32c32aa0931db364. It holds one R script ("Figure 1/Fig 1D R script
# for analyzing Opall fruit set clean.R") that plots Fig. 1E from the Table S3 proportions and
# runs prop.test and pairwise.prop.test (R defaults, so Yates continuity correction for each
# pair and Holm adjustment) on the counts 5/44, 27/40, 21/44, 50/63, 44/67; and one notebook
# ("Figure 2/Fig 2D ToF Analysis VOCUS oxidation plotting clean.ipynb") that only plots the
# Fig. 2D traces (linear detrend of the aldoxime trace, each trace divided by the mean of a
# baseline index window: aldoxime 1100 to 1200, b-pinene 0 to 200, ocimene 150 to 240). It
# computes no percent change and no test. The repository also holds data files, by their
# names: raw GC-MS folders (Fig. S1, Tables S5, S7, S8), iButton, CAPS NO2 and ozone monitor
# logs (Fig. S3, Table S1), the EAG dose-response means and the Manduca dose-response wind
# tunnel sheet (Fig. S7, filed as "Fig S5"), the Fig. 3B wind tunnel sheet, the Fig. 2 VOCUS
# traces, and GEOS-Chem 12.1.0 output (Jan 2013 to Feb 2014, .mat) with the 13.2.1
# preindustrial/present factor maps for NO3 and O3 (.nc4). These were not opened. They are
# public, so a claim the Dryad deposit cannot test may be tested on them (author, step 4).
# No code for Fig. 3, Fig. 4, Table S9, Table S11, Table S13 or Fig. S9 is in the repository.
#
# Dataset: the Dryad record's title is the paper's and its description (methods) is the
# GEOS-Chem modelling of the Supplementary Methods, so it is meant to hold at least the Fig. 4
# and Table S13 model output. Whether it holds the behavioural and chemical data is the
# author's to find. The paper says "Data are available at (28) and (40)", that is the
# supplement and this Dryad record.
#
# Data the paper used, as reported.
# - Field site, Grant County, WA (46.913451, -119.921297), 26,250 m2, near-pristine. Pollinator
#   video, about 300 flowers over 200 h (110 h night, 90 h day), 836 visits identified (560
#   day, 276 night; Table S2). The main text dates the observations June and July 2017 and
#   2018; the Supplementary Methods date the monitoring 2018 and 2019 and Table S2 says 2018
#   and 2019. Ambient O3, NO2, wind, temperature and humidity, midnight to 6 am (Table S1,
#   Fig. S3; Fig. S3 says the 2018 season).
# - Pollinator exclusion (Fig. 1E, Tables S3, S4), 2017 and 2018: one flower per plant;
#   unbagged 63, crossed 40, total exclusion 44, nocturnal exclusion 44, diurnal exclusion 67;
#   fruit set recorded at season end.
# - Scent: 35 headspace samples; GC-MS; GC-EAD on 8 M. sexta and 13 H. lineata (and Megachile,
#   Fig. S2); EAG dose response on 159 of each moth species (Fig. S7). A 12-component synthetic
#   floral odor (Tables S6, S8).
# - Flowtube oxidation (Fig. 2D, Figs. S5, S6, Table S9): 3.2 SLM, 73 s residence, three
#   stages (clean, 120 ppb O3, then NO3 from the N2O5 generator with 60 ppb NO2), Vocus PTR-ToF
#   for single compounds and benzene-cation CIMS for the blend.
# - Wind tunnel (Fig. 3B, Fig. S7C): 234 naive males (138 M. sexta, 96 H. lineata), one flight
#   of 3 min per moth, 15 to 42 moths per stimulus (legend says 15 to 35); score is the
#   proportion that fed (proboscis into the corolla). Manduca at 1/100 floral equivalent:
#   floral odor, +NO2, +O3, +NO3, NO3-proxy mixture (84% less b-pinene, 67% less ocimene),
#   clean air. Hyles at 1 floral equivalent: floral odor, +NO3, clean air (the Methods also list
#   a one-flower treatment that the figure does not show).
# - Field scent treatments (Fig. 3D, Tables S10, S11): five simultaneous treatments (floral
#   odor, NO3-oxidized floral odor, no-odor control, live floral scent, live flower), about 344
#   h, hawkmoth visits counted from video.
# - GEOS-Chem (Fig. 4, Fig. S8, Fig. S9, Tables S12, S13): 12.1.0, 2 x 2.5 degrees, MERRA-2,
#   2013 emissions and meteorology (July 2013 for the north, January 2013 for the south),
#   bottom level; 13.2.1 at 4 x 5 degrees with anthropogenic emissions off for preindustrial,
#   applied as a factor map; 2019 and 2021 runs for interannual variation; 97 cities listed
#   in Table S13 (text says the top 98).
#
# Discrepancies in the paper, noted for the author: the Fig. 2D inset gives benzaldehyde -9%
# (O3) and -12% (NO3) and eucalyptol +4% and +2%, while Table S9 gives benzaldehyde 0% and +2%
# and lists no eucalyptol; the Fig. 2D legend says "all differences P < 0.001" while Table S9
# gives non-significant p for the non-monoterpenes. The main text and Table S11 call the GLM
# link "logistic", the Supplementary Methods "log". The Fig. 4 legend gives 72 vertical levels
# for the 12.1.0 run, the Supplementary Methods 47. Fig. S9 reports F(2, 96), which implies 99
# cities, while Table S13 lists 97.
schema_version: 2
paper: doi:10.1126/science.adi0858
claims:
- id: fig1d-assemblage-day-night
  statement: The diurnal and nocturnal pollinator assemblages of O. pallida differ; flowers are
    visited particularly by nocturnal hawkmoths (mostly Hyles) and diurnal bees.
  source: Figure 1D legend; Results, Oenothera pallida pollination, paragraph 2; Table S2
  quote: There was a significant difference in pollinator assemblages (Z = 17.67, P < 0.0001)
  statistics:
  - test: not named
    statistic: Z = 17.67
    p: 0.0001
    p_relation: "<"
    n: 836 visits (560 day, 276 night)
  expected:
  - quantity: identified visits, total
    value: 836
    tolerance: 83.6
  - quantity: identified visits, night
    value: 276
    tolerance: 27.6
  - quantity: Hyles lineata visits, night
    value: 114
    tolerance: 11.4
  criterion: Counts from the video logs as in Table S2. The paper does not name the test
    behind Z = 17.67. The readings it allows are (a) a chi-square test of independence of
    visitor group by day and night on the Table S2 groups, reported with its p; (b) a
    two-proportion z-test, day against night, of the share of visits by one major group, the
    groups being Sphingidae (Hyles and Manduca), all Lepidoptera, or all Hymenoptera.
    Reproduced when the counts are within tolerance and, under one reading, the day and night
    assemblages differ at p < 0.0001 with Sphingidae a larger share by night. The z of every
    reading in (b) is reported, and which, if any, is within 10% of 17.67.
- id: fig1e-bagged-fewer-fruit
  statement: Bagged flowers (all pollinators excluded) set fewer fruit than unbagged flowers
    (0.114 against 0.794).
  source: Results, Oenothera pallida pollination, paragraph 2; Figure 1E; Tables S3 and S4
  quote: Plants in bagged treatments had significantly fewer fruit sets than those of ...
    unbagged plants (pairwise comparison of proportions with Holm correction, P < 0.001)
  statistics:
  - test: pairwise comparison of proportions
    corrected: Holm
    p: 0.001
    p_relation: "<"
    n: 44 bagged and 63 unbagged flowers
  expected:
  - quantity: fruit set proportion, unbagged (50 of 63)
    value: 0.794
    tolerance: 0.051
  - quantity: fruit set proportion, total exclusion (5 of 44)
    value: 0.114
    tolerance: 0.0479
  criterion: As in the paper's R script, pairwise.prop.test in R (Yates continuity correction,
    Holm adjustment) on the five treatments' fruit counts. Tolerances are the standard
    deviations Table S3 gives. Reproduced when the proportions are within tolerance and the
    Holm-adjusted p for total exclusion against unbagged is below 0.001 (Table S4 gives
    1.70E-10).
  data: elsewhere
  where: Zenodo doi:10.5281/zenodo.8411927
- id: fig1e-nocturnal-exclusion
  statement: Excluding nocturnal pollinators lowers fruit set below that of unbagged controls
    (0.477 against 0.794).
  source: Results, Oenothera pallida pollination, paragraph 2; Figure 1E; Tables S3 and S4
  quote: The exclusion of nocturnal pollinators also resulted in fewer fruit sets than those of
    no-treatment controls (P = 0.0082)
  statistics:
  - test: pairwise comparison of proportions
    corrected: Holm
    p: 0.0082
    n: 44 nocturnal-exclusion and 63 unbagged flowers
  expected:
  - quantity: fruit set proportion, nocturnal exclusion (21 of 44)
    value: 0.477
    tolerance: 0.0753
  - quantity: Holm-adjusted p, nocturnal exclusion against unbagged
    value: 0.0082
    tolerance: 0.00082
  criterion: As fig1e-bagged-fewer-fruit (pairwise.prop.test with R defaults, as the paper's
    script). Reproduced when the proportion is within tolerance and the adjusted p is
    0.0082 within 10%.
  data: elsewhere
  where: Zenodo doi:10.5281/zenodo.8411927
- id: fig1e-groups
  statement: Crossed, diurnal-exclusion and unbagged flowers do not differ in fruit set;
    nocturnal exclusion does not differ from crossed or diurnal exclusion; total exclusion
    differs from all (letters a, a,b, c, b, a,b).
  source: Figure 1E legend; Table S4
  quote: Letters denote groups whose members are not statistically different from each other
  statistics:
  - about: crossed against unbagged
    test: pairwise comparison of population proportions
    corrected: Holm
    p: 0.5269
  - about: diurnal exclusion against unbagged
    test: pairwise comparison of population proportions
    corrected: Holm
    p: 0.4645
  - about: nocturnal exclusion against crossed
    test: pairwise comparison of population proportions
    corrected: Holm
    p: 0.4645
  - about: nocturnal exclusion against diurnal exclusion
    test: pairwise comparison of population proportions
    corrected: Holm
    p: 0.4645
  - about: diurnal exclusion against crossed
