- id: fig3b-o3-no2-no-effect
  statement: O3 alone (120 ppb) or NO2 alone added to the floral odor does not change Manduca
    visitation relative to the untreated floral odor.
  source: Results, NO3 suppresses plant-pollinator visitations, paragraphs 1 and 2; Figure 3B
  quote: Controls of the floral odor exposed to nitrogen dioxide (NO2; the nonreactive precursor
    to NO3) or O3 alone (to control for any physiological effects on the moth) were not
    significantly different from responses to the untreated floral odor (Fig. 3B)
  criterion: A claim of absence judged on the paper's test, a test of population proportions
    (Zar) at alpha 0.05, floral odor against O3-oxidized odor and against NO2-exposed odor.
    The paper does not say whether a continuity correction or a correction for several
    comparisons was used; as an absence claim it is judged on the plain two-proportion
    z-test without either, and R pairwise.prop.test with Holm adjustment (the paper's Fig.
    1E method) is shown as a variant. Reproduced when neither comparison gives p < 0.05; the
    differences in proportion are reported.
  data: elsewhere
  where: Zenodo doi:10.5281/zenodo.8411927
- id: fig3b-proxy-mixture
  statement: The NO3-proxy mixture (84% less b-pinene, 67% less b-ocimene, no oxidation
    products) draws fewer Manduca feeding visits than the untreated floral odor, and as many
    as the clean-air control and the NO3-degraded odor.
  source: Results, NO3 suppresses plant-pollinator visitations, paragraph 2; Figure 3B
  quote: The NO3-proxy mixture (with 84% less β-pinene and 67% less β-ocimene, but lacking
    the oxidation products) elicited significantly fewer responses than did the untreated flower
    odor and the same amount of responses as those with the clean air (no odor) control and
    the NO3-degraded scent that contained the oxidation products
  criterion: Test of population proportions (Zar) at alpha 0.05, with the readings of
    fig3b-manduca-no3-halves for the test and, for the letters of Fig. 3B, (a) no correction,
    (b) Holm adjustment over the 15 Manduca pairs. Reproduced when, under one reading, the
    proxy mixture is lower than the floral odor with p < 0.05, and the proxy mixture against
    the no-odor control and against the NO3-oxidized odor each give p >= 0.05 (the latter two
    judged on that reading's test, as absence).
  data: elsewhere
  where: Zenodo doi:10.5281/zenodo.8411927
- id: figs7-manduca-sensitivity
  statement: Manduca antennae are more sensitive than Hyles antennae to the floral odor, and in
    the wind tunnel 1/100 floral equivalent is the lowest dose whose Manduca feeding does not
    differ from one floral equivalent (P = 0.09).
  source: Figure S7 legend; Results, NO3 suppresses plant-pollinator visitations, paragraph 1
  quote: The 10-2 O. pallida odor concentration is the lowest intensity where there was no
    significant behavioral difference compared to the 100 floral odor concentration (P = 0.09)
  statistics:
  - about: Manduca feeding, 10^-2 against 10^0 floral equivalent
    test: test of population proportions
    p: 0.09
  criterion: EAG response per trial is the mean of the two largest of five deflections after
    removing noise spikes (Supplementary Methods, EAG dose response). The paper names no test
    for the EAG and does not define "more sensitive"; the readings are a larger mean Manduca
    EAG than Hyles EAG (a) at each concentration of Fig. S7A (10^-6, 10^-4, 10^-2), (b) at
    most concentrations of the series of the Methods (1:100,000,000 to 1:33). The legend's
    statistics for the EAG ("not statistically different ... (P < 0.05)") are garbled and are
    not used. For behaviour, test of population proportions with the readings of
    fig3b-manduca-no3-halves. Reproduced when, under one reading, Manduca EAG exceeds Hyles
    EAG, and the 10^-2 against 10^0 comparison gives p >= 0.05 while every lower dose of Fig.
    S7C against 10^0 gives p < 0.05.
- id: fig3d-field-no3-fewer-visits
  statement: In the field, hawkmoth visits to the NO3-oxidized floral odor are fewer than to the
    untreated odor, and not different from the clean-air control.
  source: Results, NO3 suppresses plant-pollinator visitations, paragraph 3; Figure 3D; Tables
    S10 and S11
  quote: the visitation rate to floral odor exposed to NO3 was significantly less than to the
    untreated odor (P = 0.027, generalized linear model, Poisson, logistic link) (tables S10 and
    S11) and not significantly different from the clean air control (Fig. 3D)
  statistics:
  - about: NO3-oxidized odor against floral odor
    test: generalized linear model, Poisson
    statistic: estimate -1.253, SE 0.567, Z = -2.21
    p: 0.027
    n: 14 and 4 visits in 49.5 h each
  expected:
  - quantity: GLM coefficient, NO3-oxidized odor against floral odor
    value: -1.253
    tolerance: 0.567
  - quantity: visits per hour, floral odor
    value: 0.283
    tolerance: 0.076
  - quantity: visits per hour, NO3-oxidized floral odor
    value: 0.081
    tolerance: 0.04
  criterion: Poisson GLM with log link, floral odor as reference, as the Supplementary Methods
    and Table S11 say, on hawkmoth visit counts pooled across nights. Tolerances are the
    standard errors the paper gives. How unequal observation hours enter is not stated; the
    readings are (a) each treatment's count rescaled to 49.5 h (visits per hour times 49.5),
    with no offset, which is the reading under which the Table S11 coefficients and standard
    errors follow from the Table S10 counts; (b) raw counts with log(hours) as offset.
    Reproduced when, under one reading, the NO3 coefficient is negative with p < 0.05, and the
    NO3 odor against the no-odor control (the same model with the control as reference)
    gives p >= 0.05.
- id: fig3d-real-and-synthetic-alike
  statement: In the field, hawkmoth visitation to the synthetic floral odor, the live floral
    scent and live flowers does not differ.
  source: Results, NO3 suppresses plant-pollinator visitations, paragraph 3; Figure 3D; Table S11
  quote: Visitation rates to the floral odor ... and to real flowers were not significantly
    different (Fig. 3D)
  statistics:
  - about: live flower against floral odor
    test: generalized linear model, Poisson
    statistic: estimate -0.027, SE 0.38, Z = -0.07
    p: 0.944
  - about: live floral scent against floral odor
    test: generalized linear model, Poisson
    statistic: estimate 0.069, SE 0.372, Z = 0.186
    p: 0.853
  criterion: A claim of absence judged on the paper's test, the Poisson GLM of
    fig3d-field-no3-fewer-visits (floral odor as reference), at alpha 0.05, under its reading
    (a) and with (b) shown as a variant. Reproduced when neither coefficient has p < 0.05;
    the coefficients are reported.
  depends_on:
  - fig3d-field-no3-fewer-visits
- id: fig3d-visits-per-night
  statement: An untreated flower is visited by a hawkmoth about twice a night (1.9), the
    oxidized scent 0.57 times a night, a drop of about 70%.
  source: Results, NO3 suppresses plant-pollinator visitations, paragraph 3; Table S10
  quote: an untreated O. pallida flower was visited by a hawkmoth approximately twice per night
    (1.9 ± 0.9), whereas flower visitation in the oxidized scent treatment fell to 0.57 (±0.28)
    visits per night, or a 70% (±20%) drop in visitation
  expected:
  - quantity: hawkmoth visits per night, live flower
    value: 1.9
    tolerance: 0.9
  - quantity: hawkmoth visits per night, NO3-oxidized floral odor
    value: 0.57
    tolerance: 0.28
  - quantity: drop in visitation
    value: 70
    tolerance: 20
    unit: percent
  criterion: Visits per hour (pooled count over hours analyzed) times 7 h, as Table S10 does.
    Which treatment the "untreated O. pallida flower" is, is open; the readings are the live
    flower (Table S10, 1.928) and the synthetic floral odor (1.980). Tolerances are the
    paper's stated spreads. The drop is 1 minus the ratio of the two
    nightly rates. Reproduced when all three values are within tolerance.
- id: fig4ab-no3-shortens-recognition
  statement: In the global model, NO3 degradation of the floral monoterpenes shortens the
    scent-recognition distance more than O3 alone, and in many populated areas the distance
    falls below 400 m.
  source: Results, Global modeling of pollutant impacts, paragraph 2; Figure 4A and 4B
  quote: NO3 degradation of monoterpenes in the floral scent has a more severe impact on
    recognition distance than that by O3 alone (Fig. 4, A and B) and that scent-recognition
    distances are reduced to below 400 m in many populated areas
  criterion: GEOS-Chem 12.1.0 bottom-level monthly means, July 2013 north of the equator and
    January 2013 south of it; land cells only (any land in the cell), cells south of -56
    degrees removed (Supplementary Methods, Global models). Degradation time to the
    thresholds of Fig. 4 (84% loss of b-pinene, 67% of cis-b-ocimene) under first-order loss,
    t = -ln(1 - f) / (k [X]), with the rate constants of Table S12, times the bottom-level
    mean horizontal wind speed. Open details and their readings are (a) the scent is
    unrecognizable when either compound reaches its threshold (shorter time) or (b) when
    both do (longer time); the NO3 map uses (i) NO3 alone or (ii) NO3 and O3 together;
    concentrations converted to number density at (1) the model cell's temperature and
    pressure or (2) the fixed 2.46e19 molecules/cm3 implied by Table S12; wind speed as (x)
    the speed of the monthly mean wind vector or (y) a monthly mean speed if the output
    holds one. "More severe" and "many" are not quantified; "more severe" is read as the NO3
    distance shorter than the O3 distance in more than half of land cells, and "many populated
    areas" as the Table S13 cities below 400 m (nine), reproduced within one (see
    table-s13-recognition-distances). Reproduced when both hold under one reading; the
    medians of the two maps over land are reported.
  depends_on:
  - table-s13-recognition-distances
- id: table-s13-recognition-distances
  statement: Around large cities the present scent-recognition distance ranges from about 73 m
    (Kabul) to over 16 km (Mumbai) and is 5% to 90% of its preindustrial value; Kabul,
    Santiago, Milan and Barcelona have the shortest distances.
  source: Table S13; Supplementary text after Figure S9
  quote: The geographic regions around Kabul, Santiago, Milan, and Barcelona have the shortest
    recognition distances though they contain neither the largest cities nor have the highest
    NO3 emissions (Table S13)
  expected:
  - quantity: recognition distance, Kabul
    value: 73.1
    tolerance: 7.31
    unit: m
  - quantity: recognition distance, Santiago
    value: 101.8
    tolerance: 10.18
    unit: m
  - quantity: recognition distance, Milan
    value: 157.6
    tolerance: 15.76
    unit: m
  - quantity: recognition distance, Barcelona
    value: 177.4
    tolerance: 17.74
    unit: m
  - quantity: recognition distance, Los Angeles
    value: 452.4
    tolerance: 45.24
    unit: m
  - quantity: current percentage of preindustrial distance, Hong Kong
    value: 4.9
    tolerance: 0.49
    unit: percent
  - quantity: current percentage of preindustrial distance, Tokyo
    value: 6.7
    tolerance: 0.67
    unit: percent
  - quantity: current percentage of preindustrial distance, Kinshasa
    value: 89.8
    tolerance: 8.98
    unit: percent
  criterion: The grid cell holding each city's coordinates (UN World Population Prospects 2019,
    ref. 79) in the maps of fig4ab-no3-shortens-recognition (NO3 chemistry) and
    fig4c-preindustrial-change; how a city is mapped to a cell (the containing cell, or
    interpolation) is open and both are run. Reproduced when, under one reading of the
    shared open details, all eight values are within tolerance; partially reproduced when at
    least six are. The four cities with the shortest recomputed distances are reported
    against Kabul, Santiago, Milan and Barcelona.
  data: with_inputs
- id: fig4c-preindustrial-change
  statement: Since preindustrial times, scent-recognition distances have fallen by 75% or more
    in most populated regions, while in sparsely populated areas such as Greenland the change
    is small.
  source: Results, Global modeling of pollutant impacts, paragraph 2; Figure 4C
  quote: The comparison map shows that in most populated regions of the world, there has been a
    75% or more decrease in scent-recognition distances since preindustrial times (Fig. 4C)
  criterion: Preindustrial NO3 and O3 are the 12.1.0 2013 fields times the factor map
    (13.2.1 preindustrial over 13.2.1 2013, regridded from 4 x 5 to 2 x 2.5 degrees, by
    nearest cell or by bilinear interpolation, both run), with 2013 winds; the map is the
    present distance over the preindustrial distance, in percent, with the readings of
    fig4ab-no3-shortens-recognition (Supplementary Methods, Global models). "Most populated
    regions" is not defined; the readings are (a) more than half of the Table S13 cities at
    25% or less, (b) more than half of their summed population at 25% or less. Table S13
    itself lists 42 of 97 cities at or below 25.0%. The paper gives no threshold for a small
    change; it is read as the complement of the paper's 75%, a present distance above 75% of
    the preindustrial one. Reproduced when the recomputed map gives a majority under one
    reading and the Greenland land cells are above 75%; partially
    reproduced when the Table S13 percentages are matched (table-s13-recognition-distances)
    but no reading gives a majority.
  depends_on:
  - fig4ab-no3-shortens-recognition
- id: interannual-similar
  statement: NO3 and O3 fields for 2013, 2019 and 2021 are similar; the change from
    preindustrial to present is orders of magnitude larger than the interannual variation.
  source: Results, Global modeling of pollutant impacts, paragraph 3; Supplementary Methods,
    Global models, paragraph 4
  quote: We find that the increase in O3 and NO3 from the preindustrial to present day are
    orders of magnitude larger than the interannual variability between 2013, 2019, and 2021
  criterion: Ratio maps of July NO3 from the 13.2.1 runs, 2021/2013, 2019/2013 and 2021/2019, as
    the Supplementary Methods say, against the 13.2.1 present/preindustrial ratio over land.
    "Orders of magnitude" is read as at least a factor of 10 between (a) the median over land
    cells of |log10 ratio| or (b) the median of |ratio - 1|. Reproduced when, under one
    reading, the present/preindustrial departure is at least 10 times each interannual one.
- id: figs8-no3-faster-than-o3
  statement: At typical northern terrestrial levels (2.6 ppt NO3, 37 ppb O3) most floral
    compounds react faster with NO3 than with O3, the exceptions being the sesquiterpenes
    a-humulene and b-caryophyllene; monoterpenes are the most reactive.
  source: Results, Global modeling of pollutant impacts, paragraph 4; Figure S8B; Table S12
  quote: our results show that most floral compounds had significantly greater reactivity toward
    typical NO3 concentrations than O3, except for the sesquiterpenes α-humulene and βcaryophyllene
    (fig. S8B and table S12)
  expected:
  - quantity: mean NO3 over land, 10 to 50 degrees N, July 2013
    value: 2.6
    tolerance: 0.26
    unit: ppt
  - quantity: mean O3 over land, 10 to 50 degrees N, July 2013
    value: 37
    tolerance: 3.7
    unit: ppb
  criterion: Mean concentrations averaged over land cells between 10 and 50 degrees latitude in
    the July 2013 12.1.0 bottom level (Supplementary Methods); north latitudes only is the
    reading the text gives. Rates are rate constant times concentration with the Table S12
    constants. Table S12's own rates are faster with O3 for a-terpinene and the three green
    leaf volatiles as well as for the two sesquiterpenes, so "most" is read as more than half
    of the 23 compounds, and "most reactive" as the compound with the largest summed O3 and
    NO3 rate being a monoterpene. Reproduced when the means are within tolerance, the NO3 rate
    exceeds the O3 rate for more than half of the compounds, a-humulene and b-caryophyllene
    are faster with O3, and the most reactive compound is a monoterpene; the compounds where
    O3 is faster are listed.
  data: elsewhere
  where: Zenodo doi:10.5281/zenodo.8411927
- id: figs9-urban-regressions
  statement: Across the large cities of Table S13, recognition distance is not related to
    population, the present/preindustrial impact is weakly related to population, and low
    recognition distances go with a large present/preindustrial impact.
  source: Figure S9 legend; Supplementary text after Figure S9
  quote: We found a significant correlation between urban population size, scent recognition
    distance, and present vs pre-industrial impacts (Fig. S9B,C)
  statistics:
  - about: recognition distance on population
    test: quadratic regression
    statistic: R2 = 0.008; F2,96 = 0.39
    p: 0.67
  - about: present/preindustrial impact on population
    test: quadratic regression
    statistic: R2 = 0.09; F2,96 = 4.89
    p: 0.01
    p_relation: "<"
  - about: present/preindustrial impact on recognition distance
    test: quadratic regression
    statistic: R2 = 0.41; F2,96 = 32.78
    p: 0.001
    p_relation: "<"
  expected:
  - quantity: R2, impact on recognition distance
    value: 0.41
    tolerance: 0.041
  criterion: Second-degree polynomial least-squares regressions on the Table S13 rows (Fig.
    S9 legend; Supplementary Methods). The number of cities is open (97 listed, 98 in the
    text, 99 implied by F2,96); the regressions are run on the 97 listed. Whether population
    enters raw or log-transformed, and whether R2 is plain or adjusted, are open; each is a
    reading. Reproduced when, under one reading, A has p >= 0.05, B has p < 0.01, C has p <
    0.001 with R2 within tolerance and with shorter distances going with a larger impact.
  depends_on:
  - table-s13-recognition-distances
