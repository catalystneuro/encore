  source: Results, Phenology, paragraph 1; Figure 1A and 1B
  quote: Higher daily air temperatures in spring were linked to an earlier bud swelling in both
    species, where beech was advanced by −1.1 d °C−1 and oak by −2.3 d °C−1 across the 2 yr and
    treatments
  statistics:
  - test: linear regression
    p: 0.05
    p_relation: "<"
    n: monoculture trees, 6 per treatment, species and year, 2020 and 2021
  expected:
  - quantity: slope of bud swelling date on Tspring, beech
    value: -1.1
    tolerance: 0.11
    unit: days per degree C
  - quantity: slope of bud swelling date on Tspring, oak
    value: -2.3
    tolerance: 0.23
    unit: days per degree C
  criterion: Phenology regression (opening comment) of bud swelling day of year on Tspring.
    Reproduced when, under one of the readings P1 or P2 with H1 or H2, both slopes are within
    tolerance and each regression has P <= 0.05.
