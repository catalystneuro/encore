- id: figs1-phenology-no-moisture
  statement: No phenological trait was related to soil moisture in either species.
  source: Results, Phenology, paragraph 1; Supplemental Figure S1
  quote: We observed no significant relationship between phenology and soil moisture for both
    species (Supplemental Fig. S1)
  criterion: A claim of absence, on the paper's test, linear regressions as in the phenology
    regression (opening comment), with soil moisture at 25 cm in place of air temperature, bud
    swelling and development duration on Mspring, onset and duration of senescence on Mfall,
    growing season length on Mannual (Supplemental Figure S1 legend, Methods, Statistical
    analysis). Reproduced when none of the ten regressions has P <= 0.05. The unit (P1 or P2) is
    open; the outcome is the one both give.
- id: fig2-gdd-chilling
  statement: The more chilling days trees received, the fewer growing degree days they needed to
    reach bud swelling, in both species, following a negative exponential.
  source: Results, Phenology, paragraph 2; Figure 2A and 2B
  quote: With an increase in the number of chilling days, both species had lower GDD requirements
    to budburst (Fig. 2)
  statistics:
  - test: negative exponential regression (nls)
    p: 0.05
    p_relation: "<"
    n: monoculture trees, one point per tree and year, 2020 and 2021
  criterion: Per species, monoculture trees in 2020 and 2021, one value per tree and year (Figure 2
    legend). GDD is accumulated from January 1 to the bud swelling date over daily mean air
    temperatures above 5 C, and chilling days are days with daily mean below 5 C from November 1
    (Methods, Phenology, paragraph 2), from the chamber's record. Open, (a) GDD as the sum of the
    excess over 5 C or (b) as the sum of the daily means above 5 C; the end of the chilling count
    at (c) bud swelling (Methods) or (d) leaf flushing, stage 4 (Figure 2 legend); the sensor (H1
    or H2); and the negative exponential as (e) GDD = a exp(b CD) or (f) GDD = a + b exp(c CD),
    the paper giving only nls. Reproduced when, under every reading, the fitted curve decreases
    with chilling days and its rate parameter has p <= 0.05 in both species; blocked as
    methods_underspecified when readings differ.
