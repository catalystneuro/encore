  source: Results, Impact of species interactions, paragraph 4; Supplemental Table S3
  quote: Under combined warming and lower moisture, a larger height increment by approximately 2 cm
    per year was found in monocultures compared to the mixtures in beech (Supplemental Table S3)
  statistics:
  - about: warming by interaction, beech height increment
    test: linear mixed-effects model ANOVA
    statistic: F = 6.80
    p: 0.009
  - about: warming by moisture reduction by interaction, beech height increment
    test: linear mixed-effects model ANOVA
    statistic: F = 11.91
    p: 0.001
  expected:
    quantity: beech height increment under WMR, monoculture minus mixture
    value: 2
    tolerance: 0.2
    unit: cm per year
  criterion: Interaction test (opening comment). Reproduced when, under WMR, beech height increment
