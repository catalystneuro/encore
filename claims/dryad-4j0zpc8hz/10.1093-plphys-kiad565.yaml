    Asat, (C - X) / C, over monoculture tree-year means. Open, which treatment X (MR alone, or MR
    and WMR) and which year (2020, 2021, or both pooled). Reproduced when the reduction is larger
    in beech than in oak under every reading; blocked as methods_underspecified when readings
    differ.
- id: tables6-no-seasonal-variation
  statement: Asat, starch and sugar did not vary among the three campaigns of the growing season.
  source: Methods, Statistical analysis, paragraph 2; Supplemental Table S6
  quote: As leaf-level responses (assimilation and starch and sugar concentrations) did not vary
    during the growing season, we averaged them per year before the analyses (Supplemental Table
    S6)
  statistics:
  - about: season effect, starch
    test: linear mixed-effects model ANOVA
    statistic: F = 2.64
    p: 0.074
  - about: season effect, sugar
    test: linear mixed-effects model ANOVA
    statistic: F = 1.56
    p: 0.213
  - about: season effect, Asat
    test: linear mixed-effects model ANOVA
    statistic: F = 2.03
    p: 0.134
  criterion: A claim of absence, on the paper's test (Table S6 footnote), lme(trait ~ (warming +
    moisture reduction + season)^3, random = ~1|Chamber) on square-root values, season the
    campaign (early, middle, late). Reproduced when the season term has p > 0.05 for all three
    traits. Table S6 has no species or year column, so open, (a) both species and all years
    pooled, (b) per species; and the trees (monocultures, or monocultures and mixtures). The
    outcome is the one all readings give.
- id: tables2-phenology-no-interaction
  statement: Species mixture did not change phenology in either species, except a development
    duration about 2 days shorter in oak mixtures than monocultures under lower moisture.
  source: Results, Impact of species interactions, paragraph 1; Supplemental Table S2
  quote: In both species, no impact of species interactions on phenology was found in any
    treatment, except in oak where we observed a slightly shorter development duration of 2 d in
    mixtures compared to the monocultures under lower moisture (Supplemental Table S2)
  statistics:
  - about: year by interaction, oak development duration
    test: linear mixed-effects model ANOVA
    statistic: F = 9.37
    p: 0.003
  - about: moisture reduction by year by interaction, oak development duration
    test: linear mixed-effects model ANOVA
    statistic: F = 11.21
    p: 0.001
  expected:
    quantity: oak development duration, monoculture minus mixture, MR
    value: 2
    tolerance: 0.2
    unit: days
  criterion: Interaction test (opening comment) on the five phenological traits, readings I1 and
    I2. Reproduced when the only significant mixture against monoculture contrast is oak
    development duration under MR, shorter in mixtures by a difference within tolerance (in one
    year under I1, or pooled under I2); partially reproduced when that contrast holds and one other
    is also significant. The NBE of oak development duration under MR is tested as in the
    biodiversity effects procedure and reported (the paper says it was not significant).
- id: tables3-beech-warming-no-interaction
  statement: Under warming, species mixture did not change beech leaf-level carbon relations or
    growth, and beech showed no net biodiversity effect.
  source: Results, Impact of species interactions, paragraph 2; Supplemental Table S3; Figure 5
  quote: In beech, no impact of species interactions on leaf-level carbon relations or growth was
    found under the warming treatment in 2020 and 2021 (Supplemental Table S3). Consequently,
    beech did not show any impact of net biodiversity in response to warming
  criterion: A claim of absence, on the paper's tests. Reproduced when, in beech under W, no
    mixture against monoculture contrast of the interaction test (opening comment) is significant
    for the six traits of Figure 5 in 2020 or 2021, and no NBE differs from zero by the t-test of
    the biodiversity effects procedure. Readings I1, I2, B1, B2, L1 and L2; the outcome is the one
    all give.
- id: figs2-beech-asat-selection-warming
  statement: Under warming, beech Asat showed a positive selection effect, too weak to change the
    net biodiversity effect.
  source: Results, Impact of species interactions, paragraph 2; Supplemental Figure S2E
  quote: However, we observed a positive selection effect on beech Asat under warming
    (Supplemental Fig. S2), suggesting positive interactions in the mixtures; although, this
    effect was not strong enough to influence the overall net biodiversity effect
  criterion: Biodiversity effects procedure (opening comment). The year is not stated; it may be
    2020 or 2021. Reproduced when, in one of these years, the beech Asat selection effect under W
    is positive and differs from zero by the t-test, and the NBE does not. The method readings
    (B1, B2, L1, L2, and the reading of Eq. 4) must all agree; when they do not, blocked as
    methods_underspecified.
- id: tables3-oak-warming-diameter
  statement: Under warming, oak in mixtures had a diameter increment about 0.3 cm per year lower
    than in monocultures, and no other difference between mixtures and monocultures.
  source: Results, Impact of species interactions, paragraph 2; Supplemental Table S3
  quote: For oak, no differences between mixtures and monocultures were found under warming, except
    for lower diameter increment of approximately 0.3 cm per year in mixtures compared to
    monocultures (Supplemental Table S3)
  statistics:
  - about: warming by year by interaction, oak diameter increment
    test: linear mixed-effects model ANOVA
    statistic: F = 4.15
    p: 0.016
  expected:
    quantity: oak diameter increment under W, monoculture minus mixture
    value: 0.3
    tolerance: 0.03
    unit: cm per year
  criterion: Interaction test (opening comment), readings I1 and I2. The unit is open, as the paper
    prints cm here but Table S4 gives diameters in mm; readings (u1) 0.3 cm and (u2) 0.3 mm.
    Reproduced when, under W, the oak diameter increment contrast is significant and lower in
    mixtures with a difference within tolerance under one unit reading, and no other oak trait
    contrast under W is significant.
- id: fig5-oak-agwb-nbe-warming-2020
  statement: Under warming in 2020, oak showed a negative net biodiversity effect on AGWB increment,
    explained by a negative complementarity effect.
  source: Results, Impact of species interactions, paragraph 2; Figure 5L; Supplemental Figure S3L
  quote: Moreover, oak trees showed a negative net biodiversity effect for the AGWB increment in
    response to warming in 2020 (Fig. 5), explained by a negative complementarity effect
    (Supplemental Fig. S3)
  criterion: Biodiversity effects procedure (opening comment). Reproduced when, for oak AGWB
    increment under W in 2020, the NBE and the complementarity effect are both negative and differ
    from zero by the t-test. The Discussion (paragraph 8) calls this complementarity effect
    positive; the sign found is reported. Readings B1 and B2 must agree; when they do not, blocked
    as methods_underspecified.
- id: tables3-beech-mr-diameter
  statement: Under lower soil moisture, beech in mixtures had a smaller diameter increment than in
    monocultures.
  source: Results, Impact of species interactions, paragraph 3; Supplemental Table S3
  quote: Under lower soil moisture, we found a reduced diameter increment in mixtures compared to
    the monocultures in beech (Supplemental Table S3)
  statistics:
  - about: moisture reduction by year by interaction, beech diameter increment
    test: linear mixed-effects model ANOVA
    statistic: F = 15.06
    p: 0.001
    p_relation: "<"
  criterion: Interaction test (opening comment). The year is not stated. Reproduced when, under MR,
    the beech diameter increment is significantly lower in mixtures than in monocultures in 2020
    or 2021 (I1) or over both years (I2).
- id: fig5-beech-sugar-nbe-mr
  statement: Under low soil moisture, beech showed a negative net biodiversity effect on sugar
    concentration, driven by a negative complementarity effect.
  source: Results, Impact of species interactions, paragraph 3; Figure 5C; Supplemental Figure S3C
  quote: Similarly, a negative net biodiversity effect on sugar concentration in response to low
    soil moisture was found in beech (Fig. 5), driven by a negative complementarity effect
    (Supplemental Fig. S3)
  criterion: Biodiversity effects procedure (opening comment). The Results give no year; the
    Discussion (paragraph 8) places it in 2020 and calls the complementarity effect positive.
    Reproduced when, for beech sugar under MR in 2020 or 2021, the NBE is negative and differs
    from zero by the t-test, and the complementarity effect is negative and differs from zero;
    the year and sign found are reported. The method readings (B1, B2, L1, L2) must agree; when
    they do not, blocked as methods_underspecified.
- id: oak-mr-no-interaction
  statement: Under low soil moisture alone, oak showed no effect of species interactions and no
    net biodiversity effect.
  source: Results, Impact of species interactions, paragraph 3; Supplemental Table S3; Figure 5
  quote: In contrast, we observed no impact of species interactions and net biodiversity effect in
    oak (Supplemental Table S3, Fig. 5)
  criterion: A claim of absence, on the paper's tests. Reproduced when, in oak under MR, no mixture
    against monoculture contrast of the interaction test is significant for the six traits of
    Figure 5 in 2020 or 2021, and no NBE differs from zero by the t-test (opening comment).
    Readings I1, I2, B1, B2, L1 and L2; the outcome is the one all give.
- id: tables3-beech-wmr-height
  statement: Under combined warming and lower moisture, beech height increment was about 2 cm per
