# Claims for Didion-Gency, Vitasse, Buchmann, Gessler, Gisler, Schaub & Grossiord (2024), Plant
# Physiology 194, doi:10.1093/plphys/kiad565, on Dryad dataset 4j0zpc8hz (doi:10.5061/dryad.4j0zpc8hz).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-10-27,
# protocol pilot-10 as stated in docs/protocol.md (Reader).
#
# Text read: the version of record from Europe PMC (PMC10828195, full-text XML) as supplied under
# paper/, with Results, Discussion, Materials and methods, the legends of Figures 1 to 7, and the
# supplement (kiad565_supplementary_data.pdf as extracted text) with the legends of Supplemental
# Figures S1 to S7, Supplemental Tables S1 to S6 and Supplemental Methods S1 to S4. No PDF was
# supplied, so the figures were not seen. The R2 and P values printed inside Figures 1, 2 and S1
# are therefore not recorded. Equations 3 and 4 of Supplemental Methods S4 (complementarity and
# selection effects) are garbled in the extracted text (an averaging bar is lost). The paper links
# no analysis code (analyses in R 4.2.0, nlme lme and multcomp), so none was read.
#
# Data the paper used. Open-top chambers (OTCs) at WSL Birmensdorf, 16 chambers, each with eight
# soil compartments. Seedlings of European beech (Fagus sylvatica) and downy oak (Quercus
# pubescens), 3 yr old, planted October 2018 as single trees, monocultures (four trees of one
# species) and mixtures (two of each); only monocultures and mixtures are analysed, one tree per
# species measured per compartment. Four climatic treatments from June 2019, each in four
# chambers, control (C), warming of about +5 C (W), soil moisture reduction of about 50% (MR) and
# both (WMR). Six trees per climatic treatment, species and interaction treatment, 96 trees.
# Measured 2019 to 2021; the paper reports 2020 and 2021 (2019 in Supplemental Figs. S5 and S6).
# Variables per tree, phenology once a year (bud swelling date, leaf development duration from
# stage 1 to 4, onset of senescence at 10% coloured or fallen leaves, senescence duration from
# 10% to 90%, growing season length from bud swelling to onset of senescence, all in days of
# year or days); leaf-level traits three campaigns a year (light-saturated assimilation Asat,
# predawn and midday leaf water potential, starch and sugar concentration of the midday leaf);
# growth once a year in September (height, basal diameter at 15 cm, and aboveground woody
# biomass AGWB estimated from height, Supplemental Methods S3, with increments as the difference
# from the previous year). Climate per chamber at 10 min (air temperature and relative humidity
# at 50 cm and 2 m, soil temperature and moisture at 25 cm), from which GDD, chilling days,
# Tspring, Tfall, Tannual, Mspring, Mfall and Mannual are computed.
#
# Outside data. AGWB uses the species-specific coefficients beta1 and beta2 of Annighofer et al.
# (2016), Eur J For Res 135:313-329, doi:10.1007/s10342-016-0937-z, which the paper does not
# print. If the dataset holds AGWB itself, they are not needed.
#
# Procedures used by the criteria below, each from the paper as cited; details it leaves open
# are named with their readings.
#
# Phenology regression (Methods, Statistical analysis, paragraph 1; Figure 1 legend). Per species,
# monoculture trees, 2020 and 2021 pooled, all four treatments, a linear regression (lm) of the
# phenological trait on the daily mean air temperature of the season (Tspring February to April,
# Tfall September to December, Tannual the year, as in Table S5), significant at P <= 0.05.
# Open, the unit of the regression (P1) each tree and year against its chamber's mean, or (P2)
# the eight treatment and year means against the treatment's mean, as Figure 1 plots them (Table
# S5 gives the treatment means). Open, the sensor (H1) 50 cm or (H2) 2 m; the Methods name both.
#
# Treatment test (Methods, Statistical analysis, paragraph 2; Table S1 footnotes; Figures 3 and 4
# legends). Per species, monoculture trees; leaf-level traits averaged per tree and year over the
# three campaigns (Methods); lme(trait ~ (warming + moisture reduction + year)^3, random =
# ~1|Chamber), warming and moisture reduction yes or no, year a factor; square root for starch,
# sugar, Asat and the increments (Table S1), none for leaf water potentials; Tukey-type contrasts
# among the four treatments within each year (multcomp), alpha 0.05. Open, (T1) the model on 2019
# to 2021 as the Methods and Table S1 state, or (T2) on 2020 and 2021, the years reported. Open,
# when an increment is negative, how the square root was taken; (S1) untransformed, (S2) square
# root after adding the constant that brings the minimum to zero. The F tests of Table S1 are
# read as nlme's anova (sequential); marginal tests are a variant.
#
# Interaction test (Methods, Statistical analysis, paragraph 3; Tables S2 and S3 footnotes). Per
# species, monoculture and mixture trees, lme(trait ~ (warming + moisture reduction + year +
# interaction)^3, random = ~1|Chamber), square root for all traits of Tables S2 and S3, and
# Tukey-type contrasts of mixtures against monocultures. Open, (I1) within each climatic treatment
# and year, or (I2) within each climatic treatment over 2020 and 2021.
#
# Biodiversity effects (Methods, Biodiversity, complementarity, and selection effects;
# Supplemental Methods S4; Methods, Statistical analysis, paragraph 3). Net biodiversity effect
# (NBE) by Eq. 2 as printed, [(FO x WO) - (FE x WO)] x 100, with FO the trait of the species in
# mixture, FE in monoculture, WO = 0.5; complementarity effect by Eq. 3 as printed, [N x (FO x
# WO / FE - WO) x FE] x 100, N = 2; selection effect by Eq. 4, whose averaging term is lost in the
# text, read as in Loreau and Hector (2001), the term (FO x WO / FE - WO) minus its mean over the
# trees of the species in that treatment and year, times FE, times 100. Tested against zero by
# t-test per climatic treatment, year and species (Methods); the legends of Figure 5 and
# Supplemental Figures S2 and S3 name Tukey's HSD, shown as a variant. The Methods run these
# tests only where the interaction test found an effect; that is reported for each. Open, (B1)
# each mixture tree against the mean of the monoculture trees of its species, treatment and year,
# or (B2) against the monoculture tree of its own chamber; (L1) leaf-level values as yearly tree
# means (Methods) or (L2) per campaign (the legends give n = 6 trees x 3 campaigns = 18).
