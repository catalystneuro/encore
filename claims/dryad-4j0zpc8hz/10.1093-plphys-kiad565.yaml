- id: fig5-oak-asat-nbe-wmr-2021
  statement: Under combined warming and drier soils in 2021, oak showed a positive net biodiversity
    effect on Asat, explained by complementarity.
  source: Results, Impact of species interactions, paragraph 4; Figure 5F; Supplemental Figure S3F
  quote: We also observed a positive net biodiversity effect for Asat in 2021 in oak (Fig. 5). This
    effect was explained by complementarity effects, indicating a resource complementarity under
    warmer air and drier soils (Supplemental Fig. S3)
  criterion: Biodiversity effects procedure (opening comment). Reproduced when, for oak Asat under
    WMR in 2021, the NBE and the complementarity effect are positive and differ from zero by the
    t-test; partially reproduced when the NBE holds and the complementarity effect is positive
    but not significant. Readings B1, B2, L1 and L2 must agree; when they do not, blocked as
    methods_underspecified.
