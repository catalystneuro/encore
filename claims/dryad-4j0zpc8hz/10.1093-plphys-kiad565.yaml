  source: Results, Impact of species interactions, paragraph 4; Supplemental Table S3
  quote: In oak, diameter increment was larger by 1.4 cm in mixtures compared to the monocultures
    (Supplemental Table S3)
  statistics:
  - about: warming by year by interaction, oak diameter increment
    test: linear mixed-effects model ANOVA
    statistic: F = 4.15
    p: 0.016
  expected:
    quantity: oak diameter increment under WMR, mixture minus monoculture
    value: 1.4
    tolerance: 0.14
    unit: cm
  criterion: Interaction test (opening comment), readings I1 and I2. The unit is open, as in
