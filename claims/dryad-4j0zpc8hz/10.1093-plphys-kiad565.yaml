- id: fig1ef-onset-senescence-no-temperature
  statement: The onset of senescence was not related to fall air temperature in either species.
  source: Results, Phenology, paragraph 1; Figure 1E and 1F
  quote: No relationship between the onset of senescence and fall daily air temperatures was
