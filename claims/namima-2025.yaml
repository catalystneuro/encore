# Claims for Namima, Kempkes, Zamarashkina, Owen & Pasupathy (2025), "High-Density Recording
# Reveals Sparse Clusters (But Not Columns) for Shape and Texture Encoding in Macaque V4",
# J Neurosci 45(5) e1893232024, on dandiset 001357.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21, protocol
# pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record (PDF supplied by a person, text extracted with PyMuPDF), with
# the main text, Materials and Methods, and figure legends. The paper has no supplement. The PDF
# was not opened; the text was enough.
#
# Code: the paper links no analysis code and gives no code or data availability statement. The
# only software it names for the experiments is the stimulus software, "Pype2; Mazer, 2013", with
# no link; the first reader read pype3 (github.com/mazerj/pype3, HEAD at
# 49056d6f7e02bb217b2f044dba6ec7a33173b4ca on 2026-10-21), a later version. It
# runs the stimuli and the fixation task and holds none of the analyses, so it settles no method
# detail here. The analyses were written in MATLAB (fit.m, confint.m, conv2.m, the cortex-lab
# Spikes toolbox) by the authors and are not public. The noise-corrected correlation follows
# Pospisil and Bair (2021, J Neurosci 41 5638), which the paper cites and does not link; its method
# is taken from this paper's Methods alone.
#
# Data the paper used: two rhesus macaques, M1 (female, 6.0 kg, Neuropixels 1.0) and M2 (male,
# 9.2 kg, Neuropixels NP1010), dorsal V4 of the right hemisphere, one acute penetration per day.
# Passive fixation; 4 to 8 stimuli per trial, each 200 ms with 200 ms gaps. Spikes sorted with
# Kilosort 2.0 or 2.5 and curated in phy; only units labelled "good" are analysed. Experiments:
# (1) main shape test, 15 shapes x 8 rotations = 120 shapes, each dark (4 cd/m2) or bright
# (12 cd/m2) cyan on an 8 cd/m2 background, 30 sessions in M1 and 44 in M2, median 5 repeats
# (minimum 3); (2) texture test, 40 grayscale textures, original and contrast-reversed, at one of 8
# random rotations per presentation, 17 sessions in M1 and 34 in M2, median 8 repeats (minimum 4);
# in M1 shape and texture tests were run in different sessions, in M2 both in 34 sessions;
# (3) position control, 15 shapes at one rotation each, dark only, at the aggregate RF center and
# 1/2 RF diameter north, south, east and west, 33 of the 44 M2 sessions; (4) RF localization on a
# 31x31 or 41x41 grid, 80 or 100 ms presentations, every session; blank presentations give the
# baseline. Measured variables: spike times of good units, each unit's axial position on the probe
# (center of mass of the waveform template across channels), stimulus identity, contrast,
# rotation, position and onset (photodiode), and, for the CSD claims only, the LF signal (2.5 kHz).
# Penetrations are named M1pN and M2pN in the paper (M2p6, M1p12, M2p9, M2p28, M2p51, M1p5); the
# paper does not say how N is assigned. The dandiset's description names the shape and texture
# sets and also a third texture version (spectrally matched noise) that the paper does not use.
#
# Outside data. The shapes are the set of Pasupathy and Connor (2001, J Neurophysiol 86 2505); the
# Gabor fits and the angular position x curvature (APC) fits need the shapes' images and boundary
# curvature descriptions, which this paper neither prints nor deposits. Those claims are
# data with_inputs, the input being the Pasupathy and Connor (2001) shape set and its APC
# descriptions, wherever the author finds them public and pinned. All other claims use the
# recordings (data dataset).
#
# Shared method, from the Methods (cited per section), used by every claim below unless the claim
# says otherwise.
# - Firing rate (Methods, Data analysis, Firing rate computation): spike count 30 to 200 ms after
#   stimulus onset, averaged over repeats; baseline the same window on blank presentations.
# - Responsive neurons (Methods, Dataset and data inclusion criteria): good units with a mean
#   response at least 5 spikes/s above baseline to at least one shape (for shape analyses) or one
#   texture (for texture analyses) at either contrast. All good units, responsive or not, set the
#   most superficial neuron of the penetration (depth zero).
# - Depth and distance (Methods, Depth from the most superficial neuron): depth is the axial
#   position on the probe of the template center of mass relative to the most superficial good
#   unit; inter-neuron distance is the absolute difference of depths in micrometers.
# - Tuning similarity (Methods, Tuning similarity and contrast invariance): for two neurons, the
#   noise-corrected correlation of Pospisil and Bair (2021) between their responses across the
#   stimuli of one contrast: square-root transformed spike counts per repeat, bias terms
#   subtracted from the numerator and denominator of r squared, the square root of the quotient,
#   given the sign of Pearson's r of the mean responses and truncated to [-1, 1]. Tuning
#   invariance is the same measure between one neuron's responses to the dark and to the bright
#   version of each stimulus (original and contrast-reversed for textures). A value is unreliable,
#   and left out, when its bootstrap confidence limit (500 resamples of repeats with replacement)
#   is above 0.5. OPEN, and able to change outcomes: (i) "the confidence limit was >0.5" can be
#   read as (a) the width of the bootstrap interval (upper minus lower bound) above 0.5 or (b) its
#   half-width above 0.5; (ii) the interval's level is not given; the reading is 95%, the level
#   the paper uses for its regressions. Each claim that rests on reliability is run under (a) and
#   (b).
# - Isimilarity and Ssimilarity (Methods, Clusters of similarly tuned neurons): for each neuron and
#   each contrast separately, an ordinary least-squares line of its reliable tuning similarities
#   with every other responsive neuron of the penetration against inter-neuron distance;
#   Isimilarity is the intercept, Ssimilarity the slope, each significant when its 95% confidence
#   interval (t based, as MATLAB confint gives it) excludes zero. Neurons with two or fewer
#   reliable similarities at a contrast have no line at that contrast. The neuron's similarity with
#   itself is not a data point ("a neuron and all other neurons"). OPEN, and able to change the
#   counts: the population results give one Isimilarity per neuron (n = 1,848 of 1,850 neurons)
#   without saying which contrast; Figure 3C uses dark shapes. The readings are (a) dark,
#   (b) bright, (c) significant at either contrast. Claims that count neurons with significant
#   Isimilarity are run under each.
