  - methods-sessions-and-neurons
  criterion: The paper shows the matrices and gives no measure. Sessions found as in
    ex-m2p6-cluster, accepted when the neuron counts match Figure 11 (16 in M2p9, 55 in M2p28)
    within 10%. Similarity matrices over the 15 shapes at each position, as in the opening
    comment. OPEN, the paper gives no measure of "similar across positions"; neither reading
    below is taken from the paper. (a) Pearson's r between the reliable off-diagonal similarities
    at each displaced position and at the center; holds when all eight correlations (four
    positions, two penetrations) are positive with p < 0.05. (b) The paper's own cluster
    measure, Isimilarity (opening comment) at each position; holds when M2p9 has two or more
    neurons with significant positive Isimilarity at every position and M2p28 has at most one
