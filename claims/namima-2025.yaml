- id: orientation-auc-coarse-clusters
  statement: Assayed at a coarse scale with two orthogonal orientations of the spindle shape, some
    penetrations consist entirely of neurons preferring horizontal or vertical, and in others the
    preference switches along the probe, as with optical imaging, even where single-neuron shape
    clustering is not extensive.
  source: Results, Tuning for stimulus orientation, paragraph 2; Figures 6C and 6D
  quote: We found penetrations that entirely consisted of neurons with preference for horizontal or
    vertical orientations (Fig. 6C) or penetrations where preference of neurons switched from one
    to the other (Fig. 6D), similar to what has been observed with optical imaging techniques
  criterion: Materials and Methods, Feature models; per neuron the AUC between spike counts (30 to
    200 ms, per presentation) for shape 1 at 0 and 180 degrees and at 90 and 270 degrees, both
    contrasts pooled, above 0.5 meaning vertical; averaged over neurons in 100 um depth bins. The
    examples are M2p6 and M1p5 (Figure 6C, D). The paper defines neither kind of penetration;
    the plain readings of "entirely" and "switched" are used, not taken from the paper. A
    penetration is all-one-preference when every occupied bin is on one side of 0.5, and
    switching when occupied bins lie on both sides, each side in a contiguous run of depth. OPEN
    which rotation is horizontal depends on the dataset's rotation labels and on shape 1 being
    the spindle (Figure 1B). Reproduced when at least one penetration of each kind exists among
    the 74 and M2p6 and M1p5 are each of one kind; the counts of each kind are reported.
- id: apc-peaks-sparse-clustering
  statement: Along angular position and curvature separately, clustering of tuning peaks is sparse;
    of 59 penetrations with at least four neurons well fit by the APC model, only 7 (angular
    position) and 5 (curvature) show a significant positive correlation between peak difference and
    distance, and only 9 and 5 sessions have smaller mean and STD of the differences than a
    permutation null.
  source: Results, Tuning for curvature or angular position, paragraph 1
  quote: Across 59 penetrations which included at least four neurons well-fit by the angular
    position × curvature model, only 7 (5) penetrations exhibited statistically significant positive
    correlation between the ΔAP (ΔCV) and inter-neuron distance (data not shown) ... we found that
    a minority (nine and five) of sessions exhibited smaller mean and STD than the null
    distributions (data not shown). These results indicate that evidence for clustered tuning ...
    is sparse in our dataset
  data: with_inputs
  depends_on:
  - methods-sessions-and-neurons
  expected:
  - quantity: penetrations with at least four well-fit neurons
    value: 59
    tolerance: 5.9
  - quantity: penetrations with significant positive correlation, delta AP against distance
    value: 7
    tolerance: 0.7
  - quantity: penetrations with significant positive correlation, delta CV against distance
    value: 5
    tolerance: 0.5
  - quantity: sessions below the permutation null, AP
    value: 9
    tolerance: 0.9
  - quantity: sessions below the permutation null, CV
    value: 5
    tolerance: 0.5
  criterion: Materials and Methods, Feature models and Statistical tests; shape responses fit with
    the 4D APC Gaussian of Pasupathy and Connor (2001) (one angular position Gaussian, three
    curvature Gaussians for adjoining segments); well fit means goodness of fit r > 0.5 (Figure 7A
    legend); delta AP is the circular absolute difference of AP peaks (0 to 180 degrees), delta
    CV the absolute difference of central curvature peaks; per penetration Pearson's r of the
    difference against inter-neuron distance over all pairs; the permutation null shuffles AP and
    CV values across penetrations, 1,000 times, and a session counts when its mean and STD are
    below the one-tailed 95% limit. Needs the shapes' boundary curvature descriptions (Pasupathy
    and Connor 2001). OPEN, able to change counts; (1) the fitting procedure and which contrast's
    responses are fit (readings dark, bright, both); (2) "statistically significant positive
    correlation" as (a) two-sided p < 0.05 with r > 0 or (b) one-sided p < 0.05; (3) "mean and
    STD" as (a) both below the limit or (b) either. Reproduced when every reading gives a
    minority of penetrations and sessions (under half of the 59) and one reading puts the counts
    within tolerance; partially reproduced when the minority holds and no reading matches the
    counts.
- id: apc-example-m2p51
  statement: In M2p51, 33 neurons well fit by the APC model show mild clustering of angular position
