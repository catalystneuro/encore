- id: position-optimal-consistent
  statement: In 33 M2 penetrations (723 neurons), Isimilarity computed from responses at each
    neuron's optimal stimulus position correlates positively with Isimilarity at the aggregate RF
    center (r = 0.325), so stimulus position and RF scatter do not explain the sparse clusters.
  source: Results, Position invariance for shape tuning similarity, paragraph 1; Figure 12B
  quote: We found a statistically significant positive correlation between Isimilarity in the RF
    aggregate center versus RF optimal positions (r = 0.325, p < 0.0001, Fig. 12B). These results
    provide evidence against the possibility that stimulus position and RF variability contributed
