- id: position-examples-invariant
  statement: In two example penetrations, the pattern of tuning similarity is the same at all five
    stimulus positions; a small cluster at every position in M2p9 and none at any position in
    M2p28.
  source: Results, Position invariance for shape tuning similarity, paragraph 1; Figures 11A and 11C
  quote: Results from two representative recording sessions are shown in Figure 11A,C, and in both
