- id: gyrus-penetrations-consistent
  statement: Restricted to the 18 M2 penetrations centered on the V4 gyrus, the percentage of
    neurons with significant Isimilarity is consistent with the whole population, also when only
    neurons within about 1,500 um of the most superficial neuron are kept.
  source: Results, Penetration trajectory, paragraph 1; Figure 8C
  quote: When we restricted our analyses to 18 penetrations centered on the V4 gyrus (Fig. 8B,
    rectangles), our results were consistent withwhat we observedacross the population (Fig. 8C,
