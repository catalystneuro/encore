  source: Results, Tuning for curvature or angular position, paragraph 1; Figure 7
  quote: The distribution of angular position peaks shows mild clustering with superficial neurons
    (magenta) tuned to features pointing to the lower right (∼330°) and deeper neurons (cyan) tuned
    to features pointing to the left (∼180°). This relationship can be visualized by the
    statistically significant positive correlation between inter-neuron distance and difference in
    angular position tuning peaks (ΔAP) for all pairs of neurons (Fig. 7B). No such relationship is
    evident along the curvature dimension (Fig. 7C)
  statistics:
