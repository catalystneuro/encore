# Claims for Qi, Parot, Wang, Pomeroy (SEP), Lavis & Cohen, "Large-scale all-optical
# electrophysiology links excitability and connectivity to circuit dynamics in vivo"
# (doi:10.64898/2026.10.05.756595) on dandiset 001960.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the bioRxiv preprint, version 1, full text flattened from the bioRxiv JATS XML
# (paper/10.64898-2026.10.05.756595.txt): main text, figure legends, Discussion and Methods,
# with the supplementary information PDF (media-5.pdf: Supplementary Movies 1 to 4 and
# Supplementary Figures 1 to 26) extracted into the same file. Pages 16, 39, 41 and 43 of the
# supplement PDF were rendered to read the significance marks of Supplementary Figures 10H,
# 24E, 25 and 26, which the extracted text garbles. The equations of the Methods (signal
# model, P(spk|V), the mixed model, balanced accuracy, the cross-STA definition) are lost in
# the flattened text; only their surrounding words survive. The movies were not seen.
#
# Code read: https://github.com/adamcohenlab/Qi2026WideAreaL1 at commit
# 181ad475520224c44d27903e7522d3e2aa76857d (2026-10-01). It holds figure_reproduction/, one
# MATLAB script and one NWB loader per figure (Figures 2 to 6), which rebuild the panels from
# the deposited NWB files, and tutorials/ 1 to 5 (movie to spikes, intrinsic properties, IPSP
# detection and fitting, spikelet detection, and the pre/post mixed model of Figures 3L and
# 3O). The scripts reproduce panels and a few text numbers (Figure 3J, 3K, 3M, 3N; the
# Figure 4 "STATS" numbers). They do not compute the statistics quoted in the Figure 5 and
# Figure 6 text, nor Supplementary Figures 22 to 26 (the Figure 5 header says these come from
# sup_fig5_connMap_stats_norm.m, which is not in the repository). Where the Methods are silent
# and the code settles a choice, the code is followed and cited as "code, <file>"; where they
# disagree, the Methods are followed and the code's choice is a variant.
#
# Dandiset: its title on DANDI ("Data for 'Large-scale electrophysiological mapping relates
# intrinsic properties to network dynamics in vivo'") is not the paper's title, but the
# paper's Data availability statement names dandiset 001960 and the description matches:
# two NDNF-Cre::NPY-GFP mice, about 320 cells each imaged at 787 Hz, three sessions per mouse
# (spontaneous, intrinsic excitability mapping, connectivity mapping) and a raw-movie excerpt.
#
# Data the paper used, as it reports them. Two NDNF-Cre::NPY-GFP double heterozygous mice
# (P60 to 180, both sexes), Optopatch (Voltron1-ST with JF608-HTL, and CheRiff-ST) in L1 of
# barrel cortex, head-fixed on a free-running treadmill; 320 targeted somas per mouse imaged
# at 787 Hz (1.27 ms exposure); face video at 40 fps (whisking) and treadmill speed. The code
# names the mice M-YQ0201-27 and M-YQ0201-29. The paper's "one mouse ... a second mouse"
# with 802 of 7,280 and 667 of 7,032 synaptic connections are M-YQ0201-27 and M-YQ0201-29
# (code, loadFigure5SessionFromNWB.m lines 16 to 18, 800 and 667 connections in the 60 to
# 400 um band). Sessions per mouse: (1) spontaneous activity, no stimulation, with quiet,
# whisking and running epochs ("behavior"); (2) intrinsic excitability mapping, 300 trials
# of four 500 ms blue steps (1.5 to 6 mW/mm2) and a 5 s ramp (0 to 6 mW/mm2) to sparse
# subsets at least 800 um apart ("sparseOpto"); (3) connectivity mapping, 20 ms blue pulses
# (14,400 trials, each cell 243 to 480 times) and, in every fourth recording chunk,
# Hadamard-Walsh codes of 750 ms steps for gap-junction mapping ("sparsePulseHad"). Measured
# variables: voltage normalized to each cell's spike height (SH), the subthreshold component,
# spike times, cell coordinates (6.5 um per pixel, code), per-cell intrinsic properties
# (adaptation, optical rheobase, maximum rate, membrane time constant, V_adp), GFP (NPY)
# status, running speed, whisking motion and quiet/whisking masks, and pairwise IPSP and
# spikelet amplitudes, decay constants and connection calls (code loaders read them from
# /units, /processing and /analysis/pairwise_connectivity_metrics). The paper also reports
# experiments the dandiset description does not list: the JF585 against JF608 and the 590
# against 620 nm LED comparisons (Supplementary Fig. 1), the 76-cell stimulation demonstration
# (Fig. 1C to E), the lattice off-target test (Supplementary Fig. 9), spinning-disk z-stacks
# (Supplementary Fig. 6), and the 7.5x high-magnification gap-junction check (Supplementary
# Fig. 18). Whether the dataset holds them is the author's to find.
#
# Shared method, from the Methods unless said otherwise.
# - Cells. Cells passing the stored QC flag (passed_qc), as every code script uses: 290 of 320
#   in M-YQ0201-27 and 286 of 320 in M-YQ0201-29 (code, tutorial5 loadSparsePulseHadForLme.m),
#   which is the paper's n = 576 cells. Spontaneous-activity analyses use the cells on the
#   stored correlation index of the behavior sessions, 247 + 258 = 505 (code, Figure 4
#   loader; the Figure 6 loader takes the QC cells, the same 258 for M-YQ0201-29), the
#   paper's n = 505.
# - States. Whisking and quiet epochs from the stored masks (Gaussian mixture on log whisking
#   motion; quiet excludes whisking extended by 100 frames). Running epochs are excluded; the
#   code excludes frames within 1000 frames of any running speed above 1e-3 (code, Figures 4
#   to 6). The code notes the stored quiet_mask is a fresh, unseeded mixture fit, not
#   bit-identical to the one used in the paper.
# - Connections. A pair is connected when the stored synaptic_connection or
#   gap_junction_connection flag is set (per-pair null distribution, p < 0.05 with
#   Benjamini-Hochberg correction). Pairs tested are those at most 400 um apart. Pairs closer
#   than 60 um are left out of the gap-junction and spontaneous analyses (Results, Gap
#   junction coupling, paragraph 4; code uses the band 60 to 400 um for Figures 3 and 5).
# - Units. Voltages in spike heights (SH); amplitudes stored positive for IPSPs and reported
#   negative in the text.
# - Group comparisons are two-sided Wilcoxon rank-sum tests unless stated (Methods,
#   Statistics). Correlations are Pearson.
# Where the readings named in a criterion give different outcomes, the claim is blocked as
# methods_underspecified, with every result shown. Readings "chosen here" are named as such:
# the paper gives no number or test for that claim.
schema_version: 2
dataset:
  archive: dandi
  id: "001960"
paper: doi:10.64898/2026.10.05.756595
claims:
# ---------------------------------------------------------------- Tools (Figure 1)
- id: jf608-brighter
  statement: In vivo, JF608-HTL is 3.6 times brighter than JF585-HTL with similar voltage
    sensitivity, giving a 50% increase in spike signal-to-noise ratio.
  source: Results, Molecular and optical tools for wide-area all-optical electrophysiology,
    paragraph 1; Supplementary Figure 1A to E
  quote: we found the redder JF608-HTL to be 3.6 times brighter, with similar voltage
    sensitivity, leading to a 50% increase in signal-to-noise ratio (SNR) in vivo
  statistics:
  - about: photon counts and spike-to-noise ratio, JF608 against JF585 (Supplementary Figure
      1C and 1E marked ***)
    test: single-sided Wilcoxon rank sum test
    p: 0.001
    p_relation: "<"
    n: 92 cells (photon counts), 91 cells stained in sequence (SNR)
  expected:
  - quantity: brightness ratio, JF608 over JF585
    value: 3.6
    tolerance: 0.36
  - quantity: increase in spike SNR
    value: 50
    tolerance: 5
    unit: percent
  criterion: Same cells imaged with JF585-HTL, then with JF608-HTL ten days later, under the
    same 590 nm illumination (Supplementary Figure 1A to E). The paper does not say how the
    ratios are formed; readings (a) ratio of the mean over cells, (b) median of per-cell
    ratios. Reproduced when the ratio of photon counts and the SNR increase are within
    tolerance under one reading and both one-sided rank-sum tests give p <= 0.001.
- id: targeting-signal-to-background
  statement: Soma-targeted red illumination raised the signal-to-background ratio about
    7.5-fold, from 0.15 +/- 0.05 to 1.12 +/- 0.32 (mean +/- s.d., 320 cells).
  source: Results, Molecular and optical tools, paragraph 4; Figure 1B, 1C; Supplementary
    Figure 5
  quote: This targeting increased the signal-to-background ratio ∼7.5-fold, from 0.15 ± 0.05
    to 1.12 ± 0.32 (mean ± s.d., n = 320 cells
  expected:
  - quantity: signal-to-background, wide-field illumination
    value: 0.15
    tolerance: 0.05
  - quantity: signal-to-background, targeted illumination
    value: 1.12
    tolerance: 0.32
  - quantity: fold increase
    value: 7.5
    tolerance: 0.75
  criterion: Needs wide-field and targeted images of the same field. The paper does not
    define signal-to-background; readings (a) (cell fluorescence minus background) divided by
    background, (b) cell fluorescence divided by background, with background taken from the
    pixels around each soma outside any cell. Reproduced when both values are within
    tolerance under one reading.
- id: spike-snr-and-detection-errors
  statement: Single-spike SNR (spike height over baseline shot noise) was 4.5 +/- 0.7; the
    estimated false-discovery proportion of spike detection was 17 +/- 13% and the
    false-negative rate 28 +/- 19%.
  source: Results, Molecular and optical tools, paragraph 5; Supplementary Figure 7
  quote: The single-spike SNR (spike-height:baseline shot noise) was 4.5 ± 0.7 (mean ± s.d.).
    Using a fitted mixture model, we estimated the spike-detection false-discovery proportion
    to be 17 ± 13% across all neurons, and false-negative rate to be 28 ± 19%
  expected:
  - quantity: spike SNR
    value: 4.5
    tolerance: 0.7
  - quantity: false-discovery proportion
    value: 17
    tolerance: 13
    unit: percent
  - quantity: false-negative rate
    value: 28
    tolerance: 19
    unit: percent
  criterion: As in Methods, Detecting spikes; SNR is spike height (mean of the spike Gaussian
    of the two truncated Gaussian mixture) over shot noise (1.4826 times the median absolute
    deviation of the one-frame difference); error rates from the fitted mixture. Over the 520
    cells of Supplementary Figure 7 (two mice). Which session and which 520 cells are not
    given; readings (a) the behavior sessions, (b) every session, with QC cells or all cells
    with a fit. Reproduced when the three means are within tolerance under one reading.
- id: snr-decay-one-hour
  statement: After 1 h of continuous imaging at 16 mW/mm2, spike SNR fell to 76 +/- 13% of its
    initial value.
  source: Results, Molecular and optical tools, paragraph 5; Supplementary Figure 8
  quote: After 1 h of continuous voltage imaging at 16 mW/mm 2 , the spike SNR decreased to 76 ±
    13% of its initial value
  expected:
    quantity: SNR after 1 h relative to the first 3 min chunk
    value: 76
    tolerance: 13
    unit: percent
  criterion: SNR per cell in 3 min chunks (Supplementary Figure 8A), n = 520 cells, two mice;
    the ratio of the chunk ending at 60 min to the first chunk, mean over cells. Whether the
    mean of ratios or ratio of means is meant is open; both are shown, and the claim holds when
    either is within tolerance.
- id: fig1d-stimulation-fold-change
  statement: Targeted stimulation of 76 randomly chosen cells raised their mean firing rate
    16-fold, while the unstimulated cells rose only 1.4-fold.
  source: Figure 1D legend; Results, Molecular and optical tools, paragraph 6
  quote: Stimulation increased the average firing rate of the stimulated cells (blue) 16-fold,
    and of the un-stimulated cells (red) 1.4-fold
  expected:
  - quantity: fold increase, stimulated cells
    value: 16
    tolerance: 1.6
  - quantity: fold increase, unstimulated cells
    value: 1.4
    tolerance: 0.14
  criterion: From the 3 s stimulation epochs repeated every 40 s (Figure 1D); rate during
    stimulation epochs over rate outside them. Readings (a) ratio of population mean rates,
    (b) mean of per-cell ratios. The dandiset description does not list this session; if it
    is absent the claim cannot be tested.
- id: off-target-length-constants
  statement: Displacing the stimulation spot from the soma showed that off-target excitation
    decays with length constants of 47 um for subthreshold voltage and 25 um for firing rate.
  source: Results, Molecular and optical tools, paragraph 6; Supplementary Figure 9
  quote: we laterally displaced the stimulation spots from the somas and found the excitatory
    response decayed with length constants of 47 and 25 μm for subthreshold voltage and firing
    rate, respectively
  expected:
  - quantity: length constant, subthreshold voltage
    value: 47
    tolerance: 4.7
    unit: um
  - quantity: length constant, firing rate
    value: 25
    tolerance: 2.5
    unit: um
  criterion: Lattice experiment of Methods, Characterization of blue light off-target effects
    (1000 trials, 20 distance bins of 15 um; voltage increase 60 to 190 ms after onset minus
    -130 to 0 ms; rate increase 0 to 130 ms minus -130 to 0 ms). The fit is not given;
    readings (a) exponential with no offset fitted to the population-average increase by bin,
    (b) the same on log values. The dandiset description does not list this session.
- id: l1-sampling-density
  statement: The recordings sampled about 20% of neurons in the focal plane and about 12%
    (320 of 2,702) of NDNF-positive L1 interneurons in the cylinder under the field of view;
    their density was 2,860 per mm3.
  source: Results, Molecular and optical tools, paragraph 4; Supplementary Figure 6
  quote: we recorded from ∼20% of the neurons in a focal plane of depth 50 μm and thickness ∼40
    μm, and ∼12% (320/2,702) of all the NDNF-positive L1 interneurons
  expected:
  - quantity: NDNF-positive cells in the cylinder
    value: 2702
    tolerance: 270
  - quantity: density
    value: 2860
    tolerance: 286
    unit: cells per mm3
  criterion: Needs the spinning-disk z-stack (Supplementary Figure 6), segmented with a
    fine-tuned Cellpose 3.0 model; the dandiset description does not list it. If absent, the
    claim cannot be tested.
# ---------------------------------------------------------------- Intrinsic excitability (Figure 2)
- id: adaptation-vadp-correlation
  statement: Spike-rate adaptation is weakly positively correlated with spike
    after-depolarization (R = 0.23, p = 1.9E-8, 564 neurons, 2 mice).
  source: Results, Intrinsic excitability, paragraph 3; Supplementary Figure 10E
  quote: firing rate adaptation was positively correlated with spike after-depolarization (V
    adp; Supplementary Fig. 10E, R = 0.23, p = 1.9E-8, Pearson correlation, n = 564 neurons, 2
    mice
  statistics:
  - test: Pearson correlation
    statistic: R = 0.23
    p: 1.9e-8
    n: 564 neurons, 2 mice
  expected:
    quantity: Pearson R, adaptation against V_adp
    value: 0.23
    tolerance: 0.023
  criterion: Per-cell adaptation (third step) and V_adp as defined in Methods, Calculating
    neural intrinsic excitability properties, from the sparseOpto sessions of both mice,
    pooled. The cells giving n = 564 are not stated; readings (a) QC cells with finite values
    of both properties, (b) all cells with finite values. Reproduced when R is within
    tolerance with p < 0.05 under one reading.
- id: fig2c-three-bins
  statement: Ward hierarchical clustering of the five z-scored intrinsic properties of the 320
    cells of one mouse gives three bins of 94, 116 and 110 cells.
  source: Figure 2C legend
  quote: We divided these cells into 3 bins via hierarchical clustering (left panel), n = 94,
    116, and 110 for clusters 1, 2, and 3 respectively
  expected:
  - quantity: cells in cluster 1
    value: 94
    tolerance: 0
  - quantity: cells in cluster 2
    value: 116
    tolerance: 0
  - quantity: cells in cluster 3
    value: 110
    tolerance: 0
  criterion: As in code, reproduce_figure2_from_nwb.m (linkage of the column-wise z-scored
    five properties of all 320 cells of M-YQ0201-29, Ward's method, cluster with maxclust 3),
    which the code README says should give these counts exactly; hence tolerance 0. The three
    counts are compared as a set, as cluster labels are arbitrary.
- id: fig2gk-bin-profiles
  statement: Bin 1 has the highest firing rate and the highest optical rheobase; bin 2 the
    lowest firing rate, the lowest adaptation and the highest membrane time constant; bin 3
    the highest after-depolarization and adaptation and the lowest optical rheobase.
  source: Results, Intrinsic excitability, paragraph 4; Figure 2G to K
  quote: Bin 1 had both the highest firing rate and the highest optical rheobase (i.e. it
    required the greatest depolarization to begin spiking); bin 2 had the lowest firing rate
    and lowest spike-rate adaptation, and the highest membrane time constant; bin 3 showed the
    highest after-depolarization and spike-rate adaptation and the lowest optical rheobase
  depends_on:
  - fig2c-three-bins
  criterion: The paper calls these comparisons descriptive. Bins identified by their sizes
    (94, 116, 110). For each property the bin medians (the boxes of Figure 2G to K), after
    removing values more than 6 s.d. from the mean as the code does (rmoutliers, 'mean',
    ThresholdFactor 6). "Firing rate" is not named; readings (a) maximum firing rate (Figure
    2I, one of the five properties), (b) the cluster-average firing rate of Figure 2F.
    Reproduced when all eight orderings hold; partially reproduced when
    six or seven hold. The code's two-sided rank-sum p values between bins are reported.
- id: two-mice-intrinsic-distributions
  statement: The two mice show similar broad distributions of intrinsic properties; by
    two-sided rank-sum tests they differ in optical rheobase (p <= 0.001) and membrane time
    constant (0.01 < p <= 0.05), not in V_adp, maximum rate or adaptation.
  source: Results, Intrinsic excitability, paragraph 3; Supplementary Figure 10H (marks read
    from the rendered PDF page 16)
  quote: We repeated this protocol on two mice and saw similar broad distributions of
    intrinsic properties in both animals
  statistics:
  - about: optical rheobase, mouse 1 against mouse 2
    test: double sided Wilcoxon rank sum test
    p: 0.001
    p_relation: "<"
    n: 320 cells per mouse
  - about: membrane time constant, mouse 1 against mouse 2
    test: double sided Wilcoxon rank sum test
    p: 0.05
    p_relation: "<"
    n: 320 cells per mouse
  criterion: Per property, two-sided rank-sum test between the sparseOpto sessions of the two
    mice. The legend gives n = 320 per mouse; readings (a) all cells with a finite value, (b)
    QC cells. Reproduced when rheobase and membrane time constant differ at p <= 0.05 and the
    other three do not; partially reproduced when four of the five calls match.
