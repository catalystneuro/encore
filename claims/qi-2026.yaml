    distance over all non-empty bins; per mouse, then averaged over the two mice. Recomputing
    the cross-correlation from the voltage (normalized by the lag-1 s.d.) is a variant.
    Reproduced when the four values are within tolerance.
- id: subthreshold-low-dimensional
  statement: Subthreshold dynamics are low dimensional; the first 10 principal components
    explain 72% of the variance in the quiet state and 62% in the whisking state.
  source: Results, Spontaneous spikes and subthreshold voltages, paragraph 3; Supplementary
    Figure 21B
  quote: principal components analysis (PCA) showed that the first 10 components accounted for
    72% of the variance in the quiet state and 62% of the variance in the whisking state
  expected:
  - quantity: variance in 10 components, quiet
    value: 72
    tolerance: 7.2
    unit: percent
  - quantity: variance in 10 components, whisking
    value: 62
    tolerance: 6.2
    unit: percent
  criterion: As in Methods, Dimensionality of subthreshold fluctuations; covariance of the
    subthreshold voltage of the behavior session per state, diagonal replaced by the lag-1
    variance where the voltage is not smoothed, eigenvalues over total variance. No code. Open,
