  statistics:
  - about: amplitude against mean outgoing weight of the presynaptic cell
    test: log scale Pearson correlation
    statistic: R = 0.61
    p: 1.1e-51
    n: 497 pairs
  - about: amplitude against mean incoming weight of the postsynaptic cell
    test: log scale Pearson correlation
    statistic: R = 0.26
    p: 4.3e-9
    n: 482 pairs
  expected:
  - quantity: R, outgoing
    value: 0.61
    tolerance: 0.061
  - quantity: R, incoming
    value: 0.26
    tolerance: 0.026
  criterion: As in code, reproduce_figure3_from_nwb.m (M-YQ0201-29). Pairs with
