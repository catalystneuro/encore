- id: fig5e-inhibition-in-spontaneous-voltage
  statement: Relative to distance-matched unconnected controls, a presynaptic spike is followed
    15 to 30 ms later by a postsynaptic hyperpolarization of -2.1% of a spike height for the
    strongest quintile of connections and -1% at median strength; unconnected control pairs
    instead rise by 1% of a spike height from -20 to -5 ms to 15 to 30 ms.
  source: Results, Local connectivity shapes network dynamics, paragraph 2; Figure 5D, 5E;
    Supplementary Figure 23F
  quote: For cell-pairs in the top quintile of synaptic strength, a presynaptic spike induced a
    median postsynaptic voltage decrease of -2.1% of a spike height in the 15 - 30 ms after a
    spike, relative to the distance-matched unconnected controls (p = 1.9E-33, n = 293 cell
    pairs, 2 mice). For the median synaptic strength (among connected pairs), this
    hyperpolarization was -1% of a spike height (p = 5.7E-39, n = 1,467 cell pairs, 2 mice,
    Wilcoxon rank sum test ... The STA waveform showed an increase by 1% of a spike height in
    the interval 15 – 30 ms after the triggering spike vs. the -20 to - 5 ms before the spike
  statistics:
  - about: top quintile, connected against unconnected controls
    test: Wilcoxon rank sum test (single-sided in Supplementary Figure 23F)
    p: 1.9e-33
    n: 293 cell pairs, 2 mice
  - about: all connected pairs against unconnected controls
    test: Wilcoxon rank sum test
    p: 5.7e-39
    n: 1,467 cell pairs, 2 mice
  expected:
  - quantity: voltage change, top quintile
    value: -0.021
    tolerance: 0.0021
    unit: spike heights
  - quantity: voltage change, median strength
    value: -0.01
    tolerance: 0.001
    unit: spike heights
  - quantity: control pairs' change from -20 to -5 ms to 15 to 30 ms
    value: 0.01
    tolerance: 0.001
    unit: spike heights
  criterion: Voltage suppression per pair is frames 12 to 25 minus frames -17 to -4 of the
    spontaneous cross-STA (Methods, Effect of connections). Connected pairs with
    synaptic_connection set, 60 to 400 um, quintiles of IPSP amplitude, both mice; controls per
    Methods (cell k within 400 um of i and j, not connected to i). No code for the numbers.
    Open, with readings (a) median over connected pairs of suppression minus the median over
    their controls; (b) median over connected pairs of (pair suppression minus mean over its
    own controls); (c) suppression of the quintile average after regressing out the control
    average (Methods, Estimating cross STAs). "Median strength" read as all connected pairs
    (n = 1,467) or as the third quintile; both shown. Test, rank-sum of pair suppressions,
    connected against controls, one-sided (Supplementary Figure 23F) and two-sided. Reproduced
    when both values are within tolerance under one reading and both tests give p < 0.05.
- id: fig5e-inhibition-in-spontaneous-rate
  statement: For the strongest quintile of synaptic connections, a presynaptic spike lowers the
    postsynaptic rate by 0.18 Hz 5 to 13 ms later, a loss of 7e-3 spikes over the IPSP; near
    median strength, by 0.083 Hz, a loss of 2.7e-3 spikes.
  source: Results, Local connectivity shapes network dynamics, paragraph 3; Figure 5E;
    Supplementary Figure 23D, H
  quote: For cell-pairs in the top quintile of synaptic strength, a presynaptic spike induced a
