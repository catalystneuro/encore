  - quantity: spikes lost, top quintile
    value: 0.007
    tolerance: 0.0007
  - quantity: rate decrease, median strength
    value: 0.083
    tolerance: 0.0083
    unit: Hz
  - quantity: spikes lost, median strength
    value: 0.0027
    tolerance: 0.00027
  criterion: Rate suppression is frames 4 to 10 minus frames -10 to -4 of the spontaneous
