  source: Results, Gap junction coupling, paragraph 5; Supplementary Figure 18D
  quote: Spikelet amplitude was strongly correlated with the coefficient of the self-STA
    footprint fitted to the cross-STA image (R = 0.94, p < 1E-15, n = 720 pairs from 48 cells
  statistics:
  - test: Pearson correlation
    statistic: R = 0.94
    p: 1.0e-15
    p_relation: "<"
    n: 720 pairs from 48 cells
  expected:
