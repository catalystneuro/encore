    connected-only selection is shown as a variant. Reproduced when, in both mice, the median
    in the nearest bin exceeds the median in the farthest bin for both measures and the
    Spearman correlation of amplitude with distance is negative at p < 0.05 (the test is a
    reading chosen here).
- id: fig3h-conduction-speed
  statement: Spikelet peak times increase with distance, giving a conduction speed of 0.28 m/s,
    consistent across two mice.
  source: Figure 3H; Results, The structure of connectivity in L1, paragraph 2
  quote: The spikelet peak times, determined by sub-frame interpolation, showed a
    distance-dependent time delay corresponding to a conduction speed of 0.28 m/s, consistent
    across n = 2 mice
  expected:
    quantity: conduction speed
    value: 0.28
    tolerance: 0.028
    unit: m/s
  criterion: As in code, reproduce_figure3_from_nwb.m panel H. Mean Hadamard cross-spike STA of
    all pairs in twelve 30 um bins from 60 to 420 um (the caption's ten 30 um bins are the
