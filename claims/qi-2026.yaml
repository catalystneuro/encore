    Reproduced when both values are within tolerance under one reading, with the quiet value
    above the whisking value.
- id: quiet-state-oscillations
  statement: In the quiet state, but not the whisking state, subthreshold dynamics often show
    global oscillations between 1 and 10 Hz.
  source: Results, Spontaneous spikes and subthreshold voltages, paragraph 4; Supplementary
    Figure 21A, C
  quote: In the quiet state - but not the whisking state - the subthreshold dynamics often
    showed global oscillations between 1 and 10 Hz
  criterion: Population-average Welch power spectrum of the subthreshold voltage per state
    (Methods, Frequency spectrum; Welch segment length a standard choice, 2 s). Reading chosen
    here, reproduced when in both mice the power integrated over 1 to 10 Hz is higher in the
    quiet than in the whisking state.
- id: traveling-waves
  statement: Quiet-state oscillations are traveling waves with various directions, a slight
    bias toward medial-posterior, and a mean speed of 18.2 +/- 8.3 mm/s (3,858 events, 2
    mice); a 5 Hz oscillation has a wavelength of about 4 mm.
  source: Results, Spontaneous spikes and subthreshold voltages, paragraph 4; Supplementary
    Figure 21D to H
  quote: with a slight bias toward the medial-posterior direction and an average speed of 18.2
    ± 8.3 mm/s (mean ± s.d., n = 3858 events, 2 mice). For a typical 5 Hz oscillation, the
    wavelength was ∼4 mm
  expected:
  - quantity: wave speed
    value: 18.2
    tolerance: 8.3
    unit: mm/s
  - quantity: wave events
    value: 3858
    tolerance: 386
  criterion: As in Methods, Wave propagation analysis. Events are peaks of the derivative of
    the population-average voltage above 3.5 times its s.d. during whisking, in quiet epochs;
    each event spans the voltage minimum to maximum flanking the peak; speed is the slope of
    pairwise distance against lag of peak cross-correlation. No code. The slope can be read (a)
    as distance regressed on lag, (b) lag regressed on distance and inverted; both shown.
    Direction from the phase gradient (Hilbert phase, 325 um Gaussian smoothing, 160 um grid).
    Reproduced when the mean speed and the event count are within tolerance under one reading
    and the circular mean direction lies in the medial-posterior quadrant.
- id: spike-synchrony-localized
  statement: Spike-rate cross-correlograms peak sharply in space (length constants of 277 um
    quiet and 270 um whisking) and time (50% decay by 2.5 ms lag), unlike subthreshold
    correlations (2.4 mm, full width at half maximum 80 ms).
  source: Results, Spontaneous spikes and subthreshold voltages, paragraph 5; Figure 4C, 4D;
    Supplementary Figure 20F, G
  quote: While the subthreshold cross-correlations decayed slowly over space (quiet-state
    length constant 2.4 mm) and time (quiet-state full-width at half-maximum 80 ms), the
    spike-rate cross-correlogram had a peak that was sharply localized in space (length
    constants of 277 and 270 μm for quiet and whisking state respectively) and time (decayed by
    50% at lags of just 2.5 ms
  expected:
  - quantity: spike synchrony length constant, quiet
    value: 277
    tolerance: 27.7
    unit: um
  - quantity: spike synchrony length constant, whisking
    value: 270
    tolerance: 27
    unit: um
  - quantity: subthreshold FWHM, quiet
    value: 80
    tolerance: 8
    unit: ms
  - quantity: lag of 50% decay of the spike correlogram peak
    value: 2.5
    tolerance: 0.25
    unit: ms
  criterion: As in code, reproduce_figure4_from_nwb.m STATS. Synchrony is the correlogram
    maximum over lags -1 to 1 frame minus the larger of the means over frames -5 to -3 and 3 to
    5 (Supplementary Figure 20G); length constants by log-linear fit per mouse, averaged.
    Readings for the 277 and 270 um (a) the synchrony fit restricted to r < 800 um, (b) the fit
    of the 2.5 ms-lag correlogram over all bins. FWHM is the code's quiet-state median over
    bins. The 2.5 ms is read as the half-width of the correlogram peak in the 60 to 120 um bin
    (code spikeHalfWidth, whisking state as in the code; quiet as a variant). Reproduced when
    all four values are within tolerance under one reading.
- id: voltage-to-spike-sigmoid
  statement: Each cell's spontaneous voltage-to-spike relationship (conditional spike rate as a
