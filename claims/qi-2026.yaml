    statistic: R = 0.33
    p: 4.7e-18
    n: 651 pairs
  - about: decay against mean of other outputs of the presynaptic cell
    test: log scale Pearson correlation
    statistic: R = 0.07
    p: 0.06
    n: 653 pairs
