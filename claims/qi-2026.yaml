- id: fig5g-gap-junction-synchrony
  statement: Gap-junction coupling raises spontaneous spike synchrony; for the strongest
    quintile, synchronous firing (lag <= 2.5 ms) exceeds near-synchronous firing by 0.86 Hz
    more than in unconnected neighbours, and by 0.32 Hz at median coupling.
  source: Results, Local connectivity shapes network dynamics, paragraph 4; Figure 5F, 5G;
    Supplementary Figure 23I
  quote: for cell-pairs in the top quintile of gap junction coupling, the rate of synchronous
    firing (time lag ≤ 2.5 ms) was 0.86 Hz greater than near-synchronous firing (time lag 5 ms,
    p = 8.6E-53, n = 1151 pairs, 2 mice, Wilcoxon rank sum test against unconnected neighbors;
    Supplementary Fig. 23I). Integrating the change in spike rate across the entire spikelet
    duration gave a gain of 1.7×10 -3 spikes. For the median gap-junctional coupling, the
    synchrony enhancement was 0.32 Hz (p = 1.9E-61, n = 5752 pairs, 2 mice, Wilcoxon rank sum
    test against unconnected neighbors), corresponding to a gain of 7×10 -4 spikes
  statistics:
  - about: top quintile against unconnected neighbours
    test: Wilcoxon rank sum test (single-sided in Supplementary Figure 23I)
    p: 8.6e-53
    n: 1151 pairs, 2 mice
  - about: all gap-junction pairs against unconnected neighbours
    test: Wilcoxon rank sum test
    p: 1.9e-61
    n: 5752 pairs, 2 mice
  expected:
  - quantity: synchrony enhancement, top quintile
    value: 0.86
    tolerance: 0.086
    unit: Hz
  - quantity: spikes gained, top quintile
    value: 0.0017
    tolerance: 0.00017
  - quantity: synchrony enhancement, median coupling
    value: 0.32
    tolerance: 0.032
    unit: Hz
  - quantity: spikes gained, median coupling
    value: 0.0007
    tolerance: 0.00007
