    end (code, tauLimits); leave-one-out arithmetic mean of the other pairs'
    amplitudes of the same presynaptic (J) or postsynaptic (K) cell; Pearson R on natural logs
    of pairs with both values positive. The code README expects R = 0.61 and 0.26 with a mask
    count of 561; the paper's n (497, 482) is read as the plotted pairs with a finite
    leave-one-out mean, shown with the counts. Reproduced when both R are within tolerance and
