    over frames -2 to +4 around it and its maximum; delay in seconds at 1.27 ms per frame;
    distance regressed on delay with intercept, pooling 12 bins times 2 mice. Reproduced when
    the pooled speed is within tolerance; per-mouse speeds are shown.
- id: amplitudes-log-normal
