# ---------------------------------------------------------------- Spontaneous dynamics (Figure 4)
- id: subthreshold-correlation-length
  statement: In the quiet state subthreshold voltages of nearby cells (60 to 120 um) correlate
    at 0.6 and the correlation decays with a 2.4 mm length constant; in the whisking state the
    values are 0.5 and 4.0 mm.
  source: Results, Spontaneous spikes and subthreshold voltages have distinct spatiotemporal
    dynamics, paragraph 3; Figure 4B; Supplementary Figure 20A, D
  quote: In the quiet state, the voltage dynamics were strongly correlated between nearby cells
    (correlation = 0.6, 60 μm < r < 120 μm) and decayed with an exponential length constant of
    2.4 mm ( Fig. 4B ; Supplementary Fig. 20D); in the whisking state, the short-range
    correlation was 0.5 and the decay length constant was 4.0 mm
  expected:
  - quantity: short-range correlation, quiet
    value: 0.6
    tolerance: 0.06
  - quantity: length constant, quiet
    value: 2.4
    tolerance: 0.24
    unit: mm
  - quantity: short-range correlation, whisking
    value: 0.5
    tolerance: 0.05
  - quantity: length constant, whisking
    value: 4.0
    tolerance: 0.4
    unit: mm
