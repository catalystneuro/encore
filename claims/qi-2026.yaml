  source: Results, The structure of connectivity in L1, paragraph 3; Supplementary Movie 3
  quote: a single L1 action potential evoked a brief excitatory pulse with a duration of ∼2 ms
    that rapidly propagated outward (0.28 m/s) with a ∼160 μm decay length constant, followed by
    a slower field of inhibition that peaked around 30 ms and decayed with a time constant of
    ∼35 ms
  depends_on:
  - fig3h-conduction-speed
  - connection-distance-structure
  expected:
  - quantity: excitatory pulse duration
    value: 2
    tolerance: 0.2
    unit: ms
  - quantity: inhibition peak time
    value: 30
    tolerance: 3
    unit: ms
  - quantity: inhibition decay time constant
    value: 35
    tolerance: 3.5
    unit: ms
  - quantity: excitatory decay length constant
    value: 160
    tolerance: 16
    unit: um
