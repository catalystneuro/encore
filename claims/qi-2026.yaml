- id: npy-intrinsic-differences
  statement: NPY-negative neurons have greater after-depolarization, lower optical rheobase,
    more spike-rate adaptation, slightly lower maximum firing rate and a shorter membrane time
    constant than NPY-positive neurons, each difference at p <= 0.001.
  source: Results, Brain state differentially modulates functional and genetic L1 interneuron
    subtypes, paragraph 2; Figure 6B, 6C; Supplementary Figure 24E (marks read from the
    rendered PDF page 39)
  quote: The NPY (-) neurons had greater after-depolarization, lower optical rheobase, more
    spike-rate adaptation, slightly lower maximum firing rate, and a shorter membrane time
    constant
  statistics:
  - about: each of the five properties, NPY- against NPY+
    test: double sided Wilcoxon rank sum test
    p: 0.001
    p_relation: "<"
    n: 257 NPY- and 248 NPY+ cells
  criterion: Per-cell properties from the sparseOpto sessions of both mice, QC cells, grouped by
    gfp_positive; two-sided rank-sum test per property. The legend's n (257, 248) matches the
    behavior-session cells; readings (a) QC cells of the sparseOpto sessions, (b) cells on the
    behavior-session correlation index. Reproduced when all five differ in the stated
    direction at p <= 0.001 under one reading; partially reproduced when four do.
- id: npy-classifier
  statement: A logistic-regression classifier on the five intrinsic properties identifies NPY
    status with 78% cross-validated balanced accuracy (95% CI 74 to 81%) against 50% (46 to
    55%) for shuffled labels; after-depolarization is the most informative feature.
  source: Results, Brain state differentially modulates functional and genetic L1 interneuron
    subtypes, paragraph 2; Methods, Cell type classification
  quote: Using these five electrophysiological parameters, a logistic-regression classifier
    identified cell type with 78% (95% CI [74%, 81%]) cross-validated balanced accuracy,
    compared with a 50% (95% CI [46%, 55%]) chance level. The most impactful feature for
    cell-type classification was spike afterdepolarization
  statistics:
  - about: balanced accuracy
    ci:
      level: 0.95
      low: 74
      high: 81
      unit: percent
  - about: chance level with shuffled labels
    ci:
      level: 0.95
      low: 46
      high: 55
      unit: percent
  expected:
  - quantity: balanced accuracy
    value: 78
    tolerance: 4
    unit: percent
  - quantity: chance level
    value: 50
    tolerance: 5
    unit: percent
  criterion: Tolerances from the confidence intervals (the wider side). Logistic regression on
    the five properties, trained on 80% and tested on 20% of cells, 10,000 resampled folds, 2.5
    and 97.5 percentiles; control by 5-fold cross-validation with shuffled labels (Methods).
