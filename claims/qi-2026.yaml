    spike, measured relative to nearby non-connected controls. Integrating the decrease in
    spike rate over the entire IPSP duration gave a median loss of 7×10 -3 spikes in the
    post-synaptic cell. For cell-pairs near median synaptic strength (among connected pairs),
    this decrease was 0.083 Hz, corresponding to a loss of 2.7×10 -3 spikes
  depends_on:
