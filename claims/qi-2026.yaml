    regression changes little; the corrected and raw matrices correlate with R = 0.82 and fewer
    than 20% of significant IPSPs differ by more than 20%.
  source: Methods, Analysis for mapping synaptic connections, paragraph 3; Supplementary Figure
    16C
  quote: The two matrices are highly correlated, with a Pearson correlation coefficient of
    0.82, p < 2E-308, n = 1755 pairs from 2 mice, and less than 20% of statistically
    significant IPSPs differ from the connectivity matrix by more than 20%
  statistics:
  - test: Pearson correlation
    statistic: R = 0.82
    p: 2.0e-308
    p_relation: "<"
    n: 1755 pairs from 2 mice
  expected:
  - quantity: Pearson R, corrected against raw
    value: 0.82
    tolerance: 0.082
  - quantity: significant IPSPs differing by more than 20 percent
    value: 20
    tolerance: 2
    unit: percent (upper bound)
  criterion: Model IPSP matrix R = S W with S the evoked spikes per stimulus in targeted and
