    reading and both rank-sum tests give p < 0.05.
- id: inhibition-gap-balance
  statement: Scaled by connection probability, spikes lost to inhibition per connected pair
    (2.7e-3, about four times the 7e-4 gained by gap junctions) and spikes gained from gap
    junctions are approximately balanced.
  source: Results, Local connectivity shapes network dynamics, paragraph 5
  quote: Hence, oppositely acting synaptic and gap-junctional influences are approximately
    balanced
  depends_on:
  - fig5e-inhibition-in-spontaneous-rate
  - fig5g-gap-junction-synchrony
  - synaptic-connection-counts
  - gap-junction-connection-counts
  criterion: Product of median spikes lost per synaptic pair and synaptic connection
    probability, against product of median spikes gained per gap-junction pair and gap
    junction probability, from the values of the claims it depends on (the paper's own
    numbers give 3.0e-4 and 2.9e-4). Reading chosen here, reproduced when the ratio of the two
    products lies between 0.5 and 2.
