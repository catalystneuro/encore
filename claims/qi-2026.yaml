    two subtypes are intermixed and have similar spike SNR and mean spike rate.
  source: Results, Brain state differentially modulates functional and genetic L1 interneuron
    subtypes, paragraph 1; Supplementary Figure 24A to D
  quote: Approximately 49% of recorded neurons were NPY (+) (166/320 in mouse 1, 145/320 in
    mouse 2). The two subtypes were intermixed throughout the field of view, and had similar
    spike SNR and similar average spike-rate
  expected:
  - quantity: NPY-positive cells, mouse 1
    value: 166
    tolerance: 17
  - quantity: NPY-positive cells, mouse 2
    value: 145
    tolerance: 15
  criterion: Stored gfp_positive over all 320 cells per mouse; which mouse is "mouse 1" is not
    stated, so the two counts are compared as a set. Similar SNR and rate (Supplementary Figure
    24B, D, 257 NPY- and 248 NPY+ behavior-session cells), reading chosen here, two-sided
    rank-sum p >= 0.05 or a difference of medians under 10%. Intermixed, reading chosen here,
