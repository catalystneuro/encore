    value: 0.94
    tolerance: 0.094
  criterion: Needs the 7.5x high-magnification recordings (16 cells per field, Voltron2),
    which the dandiset description does not list. If present, the method of Methods, High
    magnification spikelet footprint analysis.
- id: lasso-off-target-correction
