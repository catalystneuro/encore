    gap junction probability was 83% under 150 um with a 159 um length constant.
  source: Results, The structure of connectivity in L1, paragraph 1; Supplementary Figure 19C
    to F
  quote: The synaptic connectivity matrix had a single-scale network structure 47 , with an
    exponential degree distribution. The probability of connection was 24% for closely
    separated cells (< 150 μm) and fell with a ∼105 μm length constant (Supplementary Fig.
    19C,D). The gap junction matrix showed greater connectivity (connection probability 83%
    for cells separated by < 150 μm) and fell with a 159 μm length constant
  expected:
  - quantity: synaptic connection probability under 150 um
    value: 24
    tolerance: 2.4
    unit: percent
  - quantity: synaptic length constant
    value: 105
    tolerance: 10.5
    unit: um
  - quantity: gap junction connection probability under 150 um
    value: 83
    tolerance: 8.3
    unit: percent
  - quantity: gap junction length constant
    value: 159
    tolerance: 15.9
    unit: um
  criterion: No code computes these. Probability is connected over tested ordered pairs of QC
    cells by distance, both mice pooled (per-mouse values shown). The fit is not given;
    readings (a) p(r) = A exp(-r/lambda) by least squares on binned probability, (b) a line
    fitted to log probability, with bins of 30 um (as Figure 3F, 3H) or 60 um (as Figure 3E,
    3G), from 60 um (gap) or 0 um (synaptic) to 400 um. Degree distribution exponential when
    an exponential fits the in- and out-degree histograms better than a power law (lower
    residual on log counts), a reading chosen here. Reproduced when the four numbers are within
    tolerance under one reading and the degree distributions are exponential.
- id: fig3eg-amplitude-falls-with-distance
  statement: IPSP and spikelet amplitudes both decay with the distance between the cells.
  source: Figure 3E, 3G; Results, The structure of connectivity in L1, paragraph 2
  quote: IPSP and spikelet amplitudes both decayed with cell-cell distance
  criterion: As in code, reproduce_figure3_from_nwb.m panels E and G. IPSP pairs with stored
    amplitude above 1e-3 (no significance gate), spikelet pairs all, 60 to 400 um, six equal
