  expected:
  - quantity: cue-responsive neurons
    value: 257
    tolerance: 25.7
  - quantity: sessions with a cue-responsive neuron
    value: 153
    tolerance: 15.3
  criterion: As the Methods give it. For each neuron, cue (danger, uncertainty with shock and
    omission trials pooled, safety) and window (first 1 s, last 5 s of cue), a paired two-tailed
    t-test across trials of the window's mean rate (Hz) against the mean rate in the 10 s before
    that trial's cue onset; a neuron is cue-responsive when any of the six tests has p < 0.05,
    with no correction (the Methods say Bonferroni was not applied). Reproduced when both counts
    are within tolerance and every rat has a cue-responsive neuron.
- id: fig1f-suppression-cue-effect
  statement: Suppression ratios were high to danger, intermediate to uncertainty and low to
