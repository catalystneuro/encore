  source: Results, paragraph 4; Figure 1f
  quote: Suppression ratios were high to danger, intermediate to uncertainty, and low to safety (Fig.
    1f ). Analysis of variance (ANOVA) for mean individual suppression ratio [factor... revealed a
    main effect of cue
  statistics:
  - test: repeated measures ANOVA, factor cue
    statistic: F(2,26) = 75.34, partial eta squared 0.85
    p: 1.52e-11
    n: 14 rats
  depends_on:
  - cue-responsive-screen
  criterion: Suppression ratio per trial as (baseline poke rate - cue poke rate)/(baseline +
