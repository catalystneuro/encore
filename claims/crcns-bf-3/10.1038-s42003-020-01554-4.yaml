- id: cue-responsive-screen
  statement: 257 of the 435 neurons (about 59%) were cue-responsive, recorded in 153 sessions,
    with at least one cue-responsive neuron in each of the 14 rats.
  source: Results, paragraph 3; Methods, Identifying cue-responsive neurons
  quote: This screen identified 257 cue-responsive neurons (~59% of all recorded neurons) from 153
    sessions, with at least one cue-responsive neuron identified in each of the 14 rats
  depends_on:
