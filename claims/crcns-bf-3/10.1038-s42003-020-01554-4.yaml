# Claims for Moaddab, Ray & McDannald (2021), Commun Biol 4:43, "Ventral pallidum neurons
# dynamically signal relative threat", on CRCNS data set bf-3.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-06,
# protocol as stated in docs/protocol.md (Reader, version pilot-13).
#
# Text read: the version of record (PMC7794503, Europe PMC full-text XML flattened, under paper/),
# with its Results, figure legends and Methods. The Supplementary Information (Supplementary Figs.
# 1 to 10) was not supplied and was not read. The main findings rest on Figs. 1 to 6 and the
# Methods, which were read; the findings the Results state only by pointing to a supplementary
# figure (nose-poke pauses, Supplementary Figs. 6 and 9; cue-cue correlations, Supplementary
# Figs. 5 and 8) are kept, marked "(not read)" in their source, and the High firing neuron
# analyses (Supplementary Figs. 4 to 7) have no claim. No PDF was supplied. The paper links its
# Med Associates programs and behavioral Matlab code at http://mcdannaldlab.org/resources; that
# page returned HTTP 404 on 2026-11-06 and the lab site has no resources page, so no code was read.
# The data descriptor (paper/bf-3.data-description.txt) was read for the data set's contents only.
#
# Data the paper used. 14 adult male Long Evans rats, food restricted to 85% of free-feeding
# weight, rewarded for nose poking (VI-60) throughout. Fear discrimination sessions of 16 trials
# (4 danger, p(shock) = 1.00; 2 uncertainty shock and 6 uncertainty omission, p = 0.25; 4 safety,
# p = 0.00), mean ITI 3.5 min; each trial 20 s baseline, 10 s auditory cue, foot shock (0.5 mA,
# 0.5 s) 2 s after cue offset on shock trials. Drivable 16-wire bundles in the ventral pallidum
# (VP), Plexon recording, Offline Sorter. 435 VP single units from 194 sessions; 257
# cue-responsive units from 153 sessions are analysed. Measured variables: spike times, cue,
# shock, nose-poke and pellet-delivery times, mean waveforms. The CRCNS data set, by its title
# and data description, holds these 435 units from 14 rats and 194 sessions, with trial-ordered
# (danger, uncertainty shock, uncertainty omission, safety) firing, nose-poke and suppression
# ratio data and waveform characteristics.
#
# Method details fixed by the Methods and used by every claim below unless it says otherwise.
# Uncertainty shock and omission trials are pooled as "uncertainty" (Methods, Calculating
# suppression ratios; Population and single-unit firing analyses). Normalized firing (Methods,
# Z-score normalization): per neuron and trial type, firing rate in 250 ms bins from 20 s before
# cue onset to 20 s after cue offset (200 bins), averaged over trials, minus that trial type's
# mean firing over the 10 s before cue onset, then Z-scored over all bins of all trial types of
# the neuron. Periods: onset = first 1 s of cue, late cue = last 5 s of cue, delay = 2 s after cue
# offset. Population ANOVAs are repeated measures over neurons with cue and 56 bins of 250 ms
# from 2 s before cue onset to 2 s after cue offset; the reported degrees of freedom are
# uncorrected, so the F tests are read as uncorrected. 95% bootstrap confidence intervals are
# Matlab bootci, studentized, 1000 resamples, of the mean over neurons (or rats) of the
# per-neuron value or difference; an effect is "observed" when the interval excludes zero
# (Methods, 95% bootstrap confidence interval). The random seed is open and cannot change a
# conclusion beyond the edge of an interval; a standard seed is used and stated. Where an
# expected value is a bootstrap mean, its tolerance is the larger distance from the mean to a
# bound of the paper's 95% interval.
#
# Details the paper leaves open, with the readings each criterion uses.
# O1, Z-score pool. "across all trial types" may be (a) the three cue types (uncertainty pooled)
#   or (b) the four trial types (uncertainty shock and omission apart). Both are run.
# O2, per-trial firing for regression. The Methods define normalization on trial-averaged firing
#   but regress single trials. Readings: (a) each trial's 1 s bin rate minus that trial's own
#   10 s baseline, divided by the neuron's SD from the normalization above (and its mean
#   subtracted); (b) each trial's rate minus the trial-type mean baseline, Z-scored with that
#   same mean and SD; (c) per-trial baseline-subtracted rates Z-scored across all trials and bins
#   of the neuron. All three are run.
# O3, suppression ratio when a trial has no nose pokes in baseline and cue (0/0). Readings:
#   (a) the trial is dropped; (b) the ratio is set to 0. Per-rat means (Fig. 1f) are over
#   sessions with cue-responsive neurons, each session counted (a) once or (b) once per
#   cue-responsive neuron recorded in it.
# O4, reward events and their normalization. "Reward-related firing was extracted from
#   inter-trial intervals, when no cues were presented." Events: (a) pellet deliveries outside
#   the 10 s cue and 2 s delay; (b) deliveries outside the whole trial window (20 s baseline to
#   2 s after cue offset). Normalization: 16 bins of 250 ms, each minus the mean of the 1 s before
#   delivery, then Z-scored (i) over the 16 reward bins of the neuron, or (ii) with the SD of the
#   neuron's cue normalization.
# O5, cue and reward values for the correlations (Fig. 5d to 5i, Fig. 6g). Reward "[peak - pre]"
#   over "250 ms prior to reward delivery to 250 ms following": (a) the 250 ms bin after delivery
#   minus the 250 ms bin before; (b) the maximum of those two bins minus the bin before. Cue
#   values: the named 250 ms cue bin (second for inhibited neurons, first for excited) minus the
#   last 250 ms bin before cue onset.
# O6, sample sizes. Several reported degrees of freedom imply fewer neurons than the group size
#   (Low firing cue ANOVA 72 of 74; cue-excited cue ANOVA 130 of 131; Low reward ANOVA 72 of
#   74). The paper does not say which neurons were left out. The author runs all neurons of the
#   group and reports the n used.
# O7, k-means. The Methods name the five features and k = 3 (Matlab kmeans). Feature scaling,
#   distance, replicates and seed are not given. Readings: (a) raw features, Matlab defaults
#   (squared Euclidean, k-means++); (b) each feature Z-scored first. A fixed seed and 100
#   replicates are standard choices.
