  - {quantity: minimum Fano factor, value: 0.29, tolerance: 0.029}
  - {quantity: time of the Fano minimum, value: 0.23, tolerance: 0.023, unit: s}
  criterion: Unit 489101 of animal 489, 266 OL_L trials, spike counts in 10 ms bins (SI Analysis of
    VarCE). Fano factor per bin is variance over mean across trials. The epochs 1 and 2 value is
    the mean ± SD over bins from -1 to 0.065 s (window open; reading -0.5 to 0.065 s also shown).
    VarCE = variance minus phi times mean, phi the lowest Fano factor in the trial (SI Eq. 4).
    Reproduced when the three values match and VarCE averaged over 0.15 to 0.17 s exceeds that
    over 0.10 to 0.12 s. If the dataset's unit identifiers do not include 489101, the unit is the
    highest-rate RS unit in L5A or L5B of animal 489 (the paper's description, "an outlier with
    the highest spiking rate"), and the notes say so.
- id: fig4g-varce-population
  statement: Population VarCE increases linearly between decision onset (0.12 s) and decision
    termination (0.18 s), whether computed over all units, without outliers, or on residuals, and
    then declines to a minimum at t = 0.23 s when the decision is executed.
  source: Results, Ramping neural activity reflects temporal accumulation..., paragraph 3; Fig.
    4G-I; SI Analysis of VarCE
  quote: When VarCE is calculated from residuals ( 5 , 51 ) ( Materials and Methods ), it is similar
    ( Fig. 4G , black) showing linear increase between decision onset ( Fig. 4G , up arrow) and
    decision termination ( Fig. 4G , down arrow) times. VarCE exhibits a fast decline at decision
    end, reaching minimum at t = 0.23 when the decision is executed
  expected:
  - {quantity: time of the VarCE minimum after the ramp, value: 0.23, tolerance: 0.023, unit: s}
  criterion: Animal 489, 266 OL_L trials, 10 ms bins, per-unit VarCE with phi the unit's lowest
    Fano factor that keeps VarCE positive in the choice period (SI Eq. 4). Population VarCE is the
    "union" of unit VarCEs (SI); readings (a) sum over units, (b) mean over units. Three versions
    as the SI gives them; all units; without the four outliers of Fig. 4I (the four units with the
    largest summed VarCE over the choice period, taken as 0.06 to 0.38 s, mean FT to mean RT of
    fig2i-ft-rt); and on residuals (each unit's per-bin trial mean subtracted from its counts).
    The paper gives no test of the increase; the regression rule below is this file's.
    Reproduced when, in all three versions under a reading, the linear regression of VarCE on time
    over 0.12 to 0.18 s has a positive slope with p < 0.05 and the VarCE minimum between 0.18 and
    0.4 s lies within 0.023 s of 0.23 s; partially reproduced when the increase holds in all three
    but the minimum's time does not.
- id: fig4j-corce
  statement: The CorCE matrix, computed on residuals, shows correlation rising with time along the
    diagonal and decaying with time lag along a row, a pattern that disappears when bins are
    shuffled, as expected for a diffusion process.
  source: Results, Ramping neural activity reflects temporal accumulation..., paragraph 4; Fig. 4J;
    Fig. S10C
  quote: The calculated ( Materials and Methods ) CorCE matrix ( Fig. 4J ) indeed exhibits
    characteristic increase of correlation as a function of time and, for given time (e.g., along
    the top row), shows sequential decay as often observed ( 5 , 51 ) during decision-making. This
    correlation disappears when bins are randomly shuffled
  criterion: Animal 489, OL_L trials, residual spike counts in 10 ms bins (SI Analysis of VarCE and
    CorCE, SI Eq. 6), covariance of conditional expectation across bins with VarCE on the
    diagonal, normalised to correlation. The bins of the matrix are not given; readings (a) 0.12 to
    0.18 s (the ramp's VarCE window); (b) 0.06 to 0.38 s (the choice period, mean FT to mean RT).
    How units are combined is not given; readings (c) residuals summed over units per trial; (d)
    per-unit matrices averaged. The paper gives no test or shuffle count; the trend measures, the
    100 shuffles and the ±0.2 bound below are this file's. Reproduced when, under a reading, the diagonal's linear trend is
    positive, the top row's correlation decreases with lag (negative Spearman correlation), and in
    100 shuffles of bin order within trials (seeded) the top-row trend is gone (shuffled mean
    Spearman within ±0.2 of zero).
- id: fig4k-streak-index
  statement: Trial-by-trial streak index analysis during ramping shows random local spike count
    fluctuations with close to zero mean (0.06 ± 1.36, mean ± SD), indicating a gradual, not
    step-like, transition in each trial.
  source: Results, Ramping neural activity reflects temporal accumulation..., paragraph 4; Fig. 4K;
    SI Streak Index analysis
  quote: showed randomness of local spike count fluctuations with close to zero mean (0.06 ± 1.36,
    mean ± SD, Fig. 4K ), indicated gradual
  expected:
  - {quantity: mean streak index, value: 0.06, tolerance: 1.36}
  - {quantity: SD of streak index, value: 1.36, tolerance: 0.136}
  criterion: Animal 489, OL_L trials. The SI gives 8 successive 5 ms bins, counts compared with the
    across-trial median per bin, 1 above and 0 below, and the number of 0-1 switches per trial.
    Open details and readings. The statistic, (a) the switch count as the SI describes it, which
    cannot have a mean near zero; (b) the z-scored runs statistic of the cited methods (observed
    number of runs minus its expectation under randomness, over its SD, Wald-Wolfowitz). Placement
    of the 40 ms window during the ramp, (c) 0.12 to 0.16 s; (d) 0.14 to 0.18 s. Counts, (e) all
    units summed per trial ("from all layers combined", SI); (f) per unit and trial ("all units
    across all trials", Fig. 4K legend). Ties with the median, (g) assigned 0; (h) bins at the
    median left out. Reproduced when mean and SD match under some reading; the notes say which.
- id: fig5b-epochs-in-subpopulations
  statement: All epochs, including the suppression and ramp of epochs 3 and 4, are present in layer
    4 FS and RS units and in the units of every cortical layer and of each cell class, so the
    modulation is not confined to a subpopulation.
  source: Discussion, paragraph 3; Fig. 5B
  quote: All epochs including epochs 3 and 4 are already present in thalamo-recipient Layer 4
    populations of fast spiking (FS, putative inhibitory, Fig. 5 B , Top ) and regular spiking (RS,
    putative excitatory, Fig. 5 B , Top ) units. They also dominate the activity in subpopulations
    of all units across different cortical laminae
  expected:
  - {quantity: L2/3 units, value: 10, tolerance: 0}
  - {quantity: L4 units, value: 13, tolerance: 0}
  - {quantity: L5A units, value: 13, tolerance: 0}
  - {quantity: L5B units, value: 16, tolerance: 0}
  - {quantity: L6 units, value: 13, tolerance: 0}
  - {quantity: FS units, value: 43, tolerance: 0}
  - {quantity: RS units, value: 22, tolerance: 0}
  criterion: Animal 489, OL_L trials, normalised population rate (SI Spike rates) of each
    subpopulation; layers and FS/RS (waveform duration threshold 0.4 ms, SI) as the dataset
    labels them, and FS/RS recomputed from waveform duration when durations are available. In each
    subpopulation (L4 FS, L4 RS, each layer, all FS, all RS), the epoch sequence of
    fig1lm-staged-modulation is tested on that subpopulation's units. Reproduced when the
    sequence holds in L4 FS and L4 RS and in at least 6 of the 7 others; the counts are reported
    against the legend's.
- id: fig5cd-other-animals
  statement: Similar synchronous modulation epochs are seen in the other animals recorded in the C2
    principal column (n = 4) and in animals recorded in neighbouring barrel columns of the same or
    a different row (n = 3).
  source: Discussion, paragraphs 3 and 4; Fig. 5C-D; Fig. S4
  quote: Similar synchronous modulation is observed for other animals (n = 4, Fig. 5C ) with
    recordings from principal barrel column ... similar characteristic modulation epochs were
    observed in animals where recordings were done in a neighboring barrel column in the same or
    even a different row (n = 3, Fig. 5D )
  depends_on:
  - fig1lm-staged-modulation
  criterion: Animals 480, 489, 503, 528 (C2) and 482 (B2), 517 (C3), 530 (C1), per Table S1 and
    Fig. S4, OL_L and OL_R trials; the test of fig1lm-staged-modulation applied per animal.
    Reproduced when it holds in at least 3 of the 4 principal and 2 of the 3 neighbouring
    animals; partially reproduced when it holds in at least half of each group.
- id: fig5e-principal-vs-neighbor
  statement: The delay of the epoch 2 peak, the delay of ramp onset at the end of epoch 3, and the
    ramp slope do not differ between recordings in the principal C2 column (n = 4) and in
    neighbouring columns (n = 3).
  source: Discussion, paragraph 4; Fig. 5E
  quote: delay of epoch 2 ( Fig. 5 E , Left ), start of ramping at end of epoch 3 ( Fig. 5 E ,
    Middle ) and the linear slope of ramping activity in epoch 4 ( Fig. 5 E , Right ) shows no
    statistically significant difference (two-sample t test, P > 0.05) between principal C2
    whisker and neighboring barrel columns
  statistics:
  - about: epoch 2 delay, principal against neighbouring columns
    test: two-sample t test
    p: 0.109
    n: 4 principal and 3 neighbouring animals
  - about: ramp onset delay, principal against neighbouring columns
    test: two-sample t test
    p: 0.14
    n: 4 principal and 3 neighbouring animals
  - about: ramp slope, principal against neighbouring columns
    test: two-sample t test
    p: 0.97
    n: 4 principal and 3 neighbouring animals
  depends_on:
  - fig5e-slope-across-animals
  criterion: Animals as in fig5cd-other-animals, OL_L trials, normalised population rate. Per
    animal, epoch 2 delay is the time of the maximum bin from 0 to 0.065 s; ramp onset delay
    under the readings of fig4b-ddm-matches-ramp; slope under the readings of
    fig5e-slope-across-animals. A claim of absence on the paper's test. Reproduced when a
    two-sample t test (equal variances, the default reading of "two-sample t test") of the 4
    against the 3 per-animal values gives p > 0.05 for all three measures; not reproduced when any
    gives p < 0.05. The group means, their difference and Welch's test as a variant are reported.
    When the measure readings give different outcomes the claim is blocked as
    methods_underspecified.
