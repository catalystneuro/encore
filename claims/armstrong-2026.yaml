  statement: At turn onset the wall retracts to its maximum 12 mm distance within a mean of 11 ms,
    so most (>80%) first touches are on the approaching wall; during the epoch 3 suppression the
    wall approaches from 8.7 to 4.4 mm, and it reaches its final 2 mm position at 200 ms.
  source: Results, Could the neural activity modulation be explained by simple sensory drive?,
    paragraphs 2 and 3; Fig. 3A, 3P-Q
  quote: The wall retracts very rapidly ( Fig. 3P ), reaching the maximum 12 mm distance at a mean
    delay as fast as 11 ms. Therefore, the majority (>80%) of first whisker touch (FT) events (
    Fig. 3Q ) correspond to whisker palpating approaching ... when the wall is not retracting but
    fast approaching from 8.7 mm to 4.4 mm ... at a constant speed until the final position of 2
    mm is reached at 200 ms
  expected:
