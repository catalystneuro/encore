    RT under the same readings is also reported for every ephys animal, for use by
    fig4-ddm-fit.
- id: fig2jk-glm-mixed-tuning
  statement: During straight CL running, over 80% of units encode more than one behavioural or
    sensory variable (whisking kinetics and kinematics, speed, gait), and the wall feedback signal
    V_wall is among the strongest encoded variables.
  source: Results, Stages of decision-making..., paragraph 2; Fig. 2J-K; SI Multiparameter GLM
    regression
  quote: In fact, multidimensional tuning is characteristic for the majority of population (over
    80% of units, Fig. 2K ) ... Unsurprisingly, among the strongest correlations is the feedback
    signal V wall
  expected:
  - {quantity: fraction of units encoding more than one variable, value: 0.8, tolerance: 0.08}
  criterion: Animal 579 (Table S1, "2JK"). Poisson GLM with exponential link (SI Eq. 3). The SI
    gives "13 regressors" and then says V_wall (Eq. 2) was "additionally" included; Fig. S12A
    shows 13 variables. The SI names whisking phase and amplitude (Hilbert transform of the
    angle), run angle derivative (lateral acceleration), RH and LH leg push times, forward and
    absolute speed, run angle and lateral speed; the Results (Fig. 2K) add set angle, curvature
    and its derivative. These are 12 variables plus V_wall; whether a 13th variable exists, and
    which, is open, and the fit uses the 12 named plus V_wall. The same 3 s segment of 40 randomly chosen CL
    trials (SI; the Fig. 2J legend says 55 trials, a reading); spikes in 20 ms bins smoothed with a
    Savitzky-Golay filter; five-fold cross-validation with ridge regularisation; for each
    variable, the log likelihood ratio of full against reduced model averaged over the five folds,
    referred to a chi-squared distribution with 1 degree of freedom. Open details. The
    Savitzky-Golay window and order, the ridge penalty, the regressor lags or bases, which 3 s
    segment, and the significance threshold for "encoding" are not given; readings for the
    threshold are p < 0.05 and p < 0.01, and for the penalty the values a five-fold
    cross-validated search selects and no penalty. "Among the strongest" is not defined; readings
    V_wall among the three variables (a) encoded by the most units, (b) with the largest mean log
    likelihood ratio over units. Reproduced when at least 72% of units encode at least two
    variables and V_wall is among the strongest under either of these, under all
    readings; when readings disagree the claim is blocked as methods_underspecified.
- id: fig2-epoch2-at-first-touch
  statement: The epoch 2 peaks appear within 10 ms of the first whisker touch, consistent with the
    afferent delay from follicle to barrel cortex, which marks them as sensory (mismatch) signals.
  source: Results, Stages of decision-making..., paragraph 3; Fig. 1N-O; Fig. 2F
  quote: In all cases, epoch 2 peaks appear within 10 ms range from FT, which is consistent with the
    expected afferent delay from whisker follicle to barrel cortex
  expected:
  - {quantity: delay from FT to epoch 2 peak, value: 0.0, tolerance: 0.01, unit: s}
  criterion: Needs, in the same session, spikes and whisker touch times. Per ephys session with
    whisker touch times, the population epoch 2 peak time (maximum bin from 0 to 0.065 s, OL_L and
    OL_R) is compared with the mean FT of the same trials (FT as in fig2i-ft-rt, readings (a) and
    (b)), and in a second reading, the peak of the population rate aligned to each trial's FT.
    Reproduced when the absolute difference is at most 10 ms in every such session under a
    reading. The header notes that the paper's own numbers (epoch 2 at 0.026 s, FT at 0.06 to 0.07
    s) disagree with this; the notes give the difference either way.
- id: fig2l-running-vs-sitting
  statement: The epoch 4 ramp dominates the response only when the animal is actively running;
    during brief stops with active whisking the epoch 2 peak dominates and the ramp is absent.
  source: Results, Stages of decision-making..., paragraph 4; Fig. 2L
  quote: peak 4 activity dominates the modulation only when the animal is actively navigating
  criterion: OL_L trials split into sitting, the animal stopped for about 2 s with whisking
    maintained (Fig. 2L legend, 20 trials), and running (96 trials). The animal is 480 (Table S1,
    "2IL"); every other ephys animal with at least 10 sitting trials is reported as a variant.
    Sitting is not defined;
    readings (a) mean speed below 10 cm/s over -1 to 1 s (Table S1 defines running as above 10
    cm/s); (b) mean speed below 10 cm/s over -2 to 0 s. Population-averaged rate (header). Epoch 2
    size is the maximum from 0 to 0.065 s and epoch 4 size the maximum from 0.12 to 0.3 s, each
    minus the epoch 1 mean (-1 to 0 s). Reproduced when, in running trials, epoch 4 exceeds epoch 2,
    and in sitting trials epoch 2 exceeds epoch 4, in animal 480, under either reading; when readings disagree the claim is blocked as methods_underspecified.
- id: fig2m-dimensionality-collapse
  statement: Population activity is high-dimensional during epoch 1 and collapses to a single
    dimension after first touch during epochs 2 to 4, staying one-dimensional through the choice
    period and rising again at decision execution and in epoch 5.
  source: Results, Stages of decision-making..., paragraph 5; Fig. 2M; SI Dimensionality reduction
  quote: confirms the high-dimensional neural coding during epoch 1 that collapses rapidly to just a
    single dimension following the FT during epochs 2, 3, and 4 ... the neural population remains
    one-dimensional ( 46 ) during choice period between FT and RT and starts to increase only at
    the onset of decision execution and later, in epoch 5
  criterion: Animal 489 (Table S1, "2M"), OL_L trials. As the SI Dimensionality reduction gives
    it, spikes in 1 ms bins, smoothed with a 2 ms Gaussian kernel, units below 1 Hz removed, cut in
    100 ms segments; for each segment, the matrix of trial-averaged rates (units by 1 ms time
    points) is analysed by PCA and the number of components that explain 90% of the variance is
    its dimensionality. Open details and readings. The kernel width as (a) SD of 2 ms or (b) FWHM
    of 2 ms; the 1 Hz rate taken (c) over the whole session or (d) over the OL_L trial window;
    PCA on time points as samples and units as variables, centred per unit (the standard method of
    the cited references). Reproduced when, under all readings, dimensionality is 1 in every
    segment from 0.1 to 0.3 s and greater than 1 in the epoch 1 segments (-1 to 0 s), and rises
    above 1 in a segment after 0.4 s; when readings disagree the claim is blocked as
    methods_underspecified.
- id: figs12-tuning-lost-during-decision
  statement: Fitted separately to CL straight running and to OL turn decisions, the GLM shows that
    most units lose during the decision the significant tuning to sensory and behavioural variables
    they show during straight running (epoch 1).
  source: Results, Stages of decision-making..., paragraph 5; SI Fig. S12B-C
  quote: When analyzed with reduced GLM (examples in SI Appendix , Fig. S12 B and C ), the majority
    of units show no significant tuning for both sensory and behavioral variables during decision
    that they previously exhibited during epoch 1
  depends_on:
  - fig2jk-glm-mixed-tuning
  criterion: The GLM, likelihood ratio test and readings of fig2jk-glm-mixed-tuning, fitted
    separately to CL straight periods and to OL turn decisions, 100 trials per condition with a 2 s
    segment from each trial (Fig. S12B legend). Open details and readings. The animal; Table S1
    lists Fig. S12 under 589, a behaviour-only animal with no units, and 579, the Fig. 2J-K
    animal, has 55 trials in all, fewer than 100 per condition; readings (a) 579 with all its CL
    and OL_L trials, (b) each ephys animal with whisker tracking and at least 100 CL and 100 OL_L
    trials. Where in each trial the 2 s segment lies is not said; readings (c) OL from t = 0 to
    2 s and CL the 2 s straight section before an OL trial's t = 0, (d) OL as in (c) and CL the
    first 2 s of CL straight trials. Turn direction, OL_L trials (contralateral), and OL_R as a variant. Among units
    encoding at least one variable in the CL fit, the claim holds when more than half encode none
    of those variables in the OL fit. The paper gives only examples and no count; the majority
    rule is the text's "majority of units". Reproduced when it holds under the GLM readings in the
    animal of reading (a) or in most animals of reading (b); when GLM readings disagree the claim
