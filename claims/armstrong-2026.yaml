  - {quantity: maximum wall distance, value: 12, tolerance: 1.2, unit: mm}
  - {quantity: fraction of FT on the approaching wall, value: 0.8, tolerance: 0.08}
  - {quantity: wall distance at 0.065 s, value: 8.7, tolerance: 0.87, unit: mm}
  - {quantity: wall distance at 0.14 s, value: 4.4, tolerance: 0.44, unit: mm}
  - {quantity: final wall distance, value: 2, tolerance: 0.2, unit: mm}
  - {quantity: time final distance is reached, value: 0.2, tolerance: 0.02, unit: s}
  criterion: Approaching-wall position in OL_L trials of the session of Fig. 3A and 3P (50 trials;
