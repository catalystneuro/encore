# Claims for Armstrong & Vlasov (2026), "Neural correlates of perceptual decision-making in the
# primary somatosensory cortex", PNAS 123(18) e2514107123, on dandiset 001341.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read. The accepted author manuscript in PubMed Central (NIHMS2207436, PMC13142948, as served
# by Europe PMC), full text with figure legends, and its SI Appendix (NIHMS2207436-supplement-1.pdf,
# extracted to text in the same file), which holds Figures S1 to S12, Table S1, the SI Materials and
# Methods and the SI Data Analysis. The main text's Materials and Methods is a short pointer to the
# SI; the methods below come from the SI. Tables S2 and S3 (fitted DDM parameters, animals 489 and
# 503) are images with no extracted text, and the PDF page could not be rendered in this run, so
# their numbers are known only where the main text repeats them. The bioRxiv preprint
# (10.1101/2025.03.29.646003, version 1) was searched for method details the published text lacks;
# it gives none beyond the published text, and no claim rests on it.
#
# Code. The paper links no analysis code of its own. It names third-party tools only: Kilosort 3,
# the Allen Institute ecephys_spike_sorting package, Phy, the Pillow lab GLM tutorial
# (github.com/pillowlab/GLMspiketraintutorial_python), PyDDM (github.com/mwshinn/PyDDM) and SLEAP.
# None of these holds the paper's settings, so no repository was read and no detail below is
# settled by code.
#
# Data the paper describes. 19 Scnn1a-TG3-Cre x Ai32 (or Scnn1a) mice, P65 to P112, both sexes
# (Table S1). All whiskers but the two C2 whiskers trimmed. Each animal ran one unrewarded 2-h
# terminal session on an air-suspended sphere in tactile VR. Trials are closed-loop (CL) straight
# runs, with walls at 10 mm following the animal, and open-loop (OL) turns: at t = 0 (start of
# wall movement, "trial switch") the walls retract within about 12 ms, then one wall approaches
# the snout within 0.2 s to 2 mm and stays for 1.8 s before retracting. OL_L (left turn) trials
# have the right wall approaching, contralateral to the probe in the left hemisphere; OL_R (right
# turn) trials have the left wall approaching (ipsilateral). Ephys animals (Table S1) 453, 454,
# 456 (D1, D2, D2 barrels), 480, 489, 503, 516, 528, 579 (C2), 482 (B2), 488 and 530 (C1), 517
# (C3); probes Cambridge NeuroTech 64-channel or Neuropixels 1.0. Behaviour-only animals 474, 475,
# 499, 518 (psychometric curves, Fig. 2C-D), 573 (whisker tracking, Fig. 2E, F, I) and 589
# (whisker and gait tracking, Fig. 2G-H, Fig. 3A-D, G-P). Table S1 also assigns Fig. 2I and 2L to
# ephys animal 480 ("2IL"), Fig. 3E, F, Q, R to 489 ("3EFQR") and Fig. S12 to 589. Units are Kilosort 3 + ecephys quality
# filtered (amplitude cutoff <= 0.1, ISI violations <= 0.5, presence ratio >= 0.90) and curated in
# Phy; FS if waveform duration < 0.4 ms, else RS; each unit has a cortical depth and layer (L2/3,
# L4, L5A, L5B, L6). Behaviour: sphere forward and lateral velocity at 500 Hz, run angle (Eq. 1),
# wall positions, the wall feedback signal V_wall (Eq. 2), whisker angle and curvature from 1,000
# fps video (SLEAP), whisker-wall touch times, and paw contacts from 50 fps side video. The SI says
# spikes of all filtered units are packaged with the behavioural data in one NWB file per animal.
# The paper cites dandiset 001341 version 0.260414.1316. Example animal for Figs. 1, 4 and 5B is
# 489 (65 units, 266 OL_L and 265 OL_R trials); for Fig. 2A-B it is 503.
#
# Definitions used by several criteria, all from the paper.
# - t = 0 is the start of wall movement in an OL trial (Fig. 1L-O legends, "vertical dashed line
#   corresponds to start of wall movement"); the turn lasts to t = 1.8 s.
# - Population-averaged spike rate (SI Data Analysis, Spike rates): spikes binned at 0.005 s,
#   averaged over the trials of one type, and averaged over the units of the animal ("normalized on
#   the number of units"), in Hz. For comparison with the DDM (Fig. 4B, Fig. S9) and between
#   animals (Fig. 5B-D), min-max normalised to 0 and 1. The SI names no smoothing; criteria use
#   unsmoothed 5 ms bins and say where smoothing could matter.
# - Epoch windows (Results). Epoch 1 is t < 0. Epoch 2 is the sharp peak at t = 0.026 s (animal
#   489). Epoch 3 is the suppression, "(+65 ms: +140 ms)" (Results, Could the neural activity...,
#   paragraph 2), ending at the ramp onset, which Fig. 4B and the Results put at 0.12 s for animal
#   489. Epoch 4 is the ramp, from that onset to its maximum, at t = 0.25 s in Fig. 1N and at t =
#   0.23 s in the SI (Analysis of VarCE). Epoch 5 is the later stable spiking to t = 1.8 s.
# - Reaction time (SI, Fitting of drift diffusion models): the largest peak of the lateral
#   acceleration ("or run angle derivative") after the start of the turn trial. Correct trial: the
#   animal "achieves ±1cm clearance at t=1s from the trial start", otherwise error.
#
# Inconsistencies found in the paper, recorded so that the author can name them.
# - Unit counts. The SI says 634 units (Fig. S2C, n = 12 animals); Table S1 totals 668 over 13
#   ephys animals. The difference is animal 579 (34 units, the GLM animal of Fig. 2J-K).
# - Fig. 2K shows 30 units for animal 579, which Table S1 lists with 34. The GLM used 40 random CL
#   trials (SI) or 55 CL trials (Fig. 2J legend).
# - Animal 503. Fig. 2A has 414 trials, Fig. S1 481 trials, Fig. S4A and Fig. S7 305 OL_L and 304
#   OL_R trials, Table S1 1027 trials in all. Animal 489. Fig. 1J-K has 266 OL_L and 265 OL_R
#   trials; Fig. S6A and Fig. S7C have 520 OL_L trials.
# - Unit 489101 is "RS, layer 5A" in Fig. 4F and Fig. S10, "RS, layer 5B" in Fig. S5E.
# - Fig. 2C-D give n = 5 animals; the Results give n = 7; Table S1 lists four animals (474, 475,
#   499, 518) for Fig. 2C-D.
# - The reported DDM drift K = 2.91 and bound B = 0.59 give K/B = 4.93, not the 11.12 the text
#   gives as "normalized drift" (which follows the GDDM sentence).
# - The Results call whisking amplitudes, set angles and curvature maxima across epochs
#   "statistically identical" (Fig. 3J-L); the legends of Fig. 3J, K and L give "Two-sample t
#   test P value < 0.0001".
# - Epoch 2 peaks at t = 0.026 s (Fig. 1N) and first touch is at 0.06 to 0.07 s (Fig. 2F, 2I), yet
#   the Results say epoch 2 peaks "appear within 10 ms range from FT".
# - The streak index is described as a count of 0-1 switches in an 8-bin string (0 to 7), but its
#   reported distribution has mean 0.06 and SD 1.36, which a count of switches cannot have.
