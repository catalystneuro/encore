    partially reproduced when only the t = 0 values and the widening hold.
- id: fig2c-psychometric
  statement: The success rate rises steeply as the approaching wall comes closer to the snout,
    from 8 mm (whisker barely touching) to 1 mm (whisker strongly bent).
  source: Results, Behavioral correlates of decision-making..., paragraph 1; Fig. 2C; Fig. S6E-G
  quote: The resulting success rate as a function of wall distance ( Fig. 2C ) exhibits a strong
    increase toward shorter distances
  criterion: Behaviour-only psychometric animals of Table S1 (474, 475, 499, 518); the text says n =
    7 and the legend n = 5, so any other animal whose session varies the OL wall distance is also
    used and listed. Per animal and turn direction, success fraction (correct as in
    fig2a-success-rate, both readings of "±1 cm clearance") at each wall distance with at least 20
    trials (Fig. 2C legend). Reproduced when the population average (mean over animals) has a
    negative Spearman correlation with distance and the average at the two shortest distances
    exceeds that at the two longest in at least 3 of 4 animals; the paper reports no test and this
    rule is this file's.
- id: fig2d-turn-angle
  statement: Turns are steeper (larger mean turn angle) when the wall comes closer.
  source: Results, Behavioral correlates of decision-making..., paragraph 1; Fig. 2D
  quote: Better threshold clearance is achieved by steeper turn angles ( Fig. 2D ) at closer wall
    distances
  depends_on:
  - fig2c-psychometric
  criterion: Same animals and trials as fig2c-psychometric. Turn angle is the run angle of Eq. 1,
    theta = atan(D_lat/D_for), positive for left turns (SI Behavioral tactile virtual reality rig);
    turns to the right are sign-flipped. How the "mean turn angle" of a trial is taken is not
    given; readings (a) the mean of theta over the turn, 0 to 1.8 s; (b) the angle of the
    displacement from t = 0 to t = 1 s, atan of lateral over forward displacement. Reproduced when
    the population-average angle has a negative Spearman correlation with wall distance under
    either reading.
- id: fig2f-whisking-params
  statement: During straight CL running the C2 whisker whisks at 15 ± 2 Hz with an amplitude of 39
    ± 5 degrees around a set point of 58 ± 5 degrees; once the wall is close (t > 0.2 s) the
    whisker angle is clamped at 68 ± 12 degrees.
  source: Results, Behavioral correlates of decision-making..., paragraph 2; Fig. 2E-F
  quote: Whisking during CL straight run (t < 0) is executed at 15 ± 2 Hz (mean ± SD) with an
    amplitude of just 39 ± 5° (mean ± SD) around a set point of 58 ± 5° (mean ± SD) ... (whisker
    angle clamped at 68° ± 12 (mean ± SD) for t > 0.2 s
  expected:
  - {quantity: whisking frequency, value: 15, tolerance: 2, unit: Hz}
  - {quantity: whisking amplitude, value: 39, tolerance: 5, unit: deg}
  - {quantity: whisking set point, value: 58, tolerance: 5, unit: deg}
  - {quantity: clamped whisker angle, value: 68, tolerance: 12, unit: deg}
  criterion: Contralateral (right) C2 whisker angle, 0 degrees perpendicular to the head's AP axis,
    from the two tracked points nearest the base (SI Whisker tracking), in OL_L trials of the
    whisker-tracking animal of Fig. 2E-F (573 per Table S1; 589 also has whisker tracking and is
    shown as a variant). Phase and amplitude from the Hilbert transform (SI Multiparameter GLM);
    set point is not defined, readings (a) the slowly varying mean of the angle (mean per whisk
    cycle); (b) the mean angle over t < 0. Frequency is the inverse cycle duration. Window for the
    CL values is t < 0 within the trial (-1 to 0 s, open); clamped angle is the mean angle for t
    from 0.2 to 1.8 s. Tolerances are the paper's SD. Reproduced when all four means fall within
    tolerance under one set-point reading.
- id: fig2i-ft-rt
  statement: The choice period lasts 0.32 s, between the mean first whisker touch of the
    approaching wall (0.06 ± 0.03 s) and the mean reaction time defined by the stereotypic hind-leg
    push (0.38 ± 0.07 s).
  source: Results, Behavioral correlates of decision-making..., paragraph 3; Fig. 2I
  quote: Corresponding time histograms for FT and RT ( Fig. 2I ) indicate the choice period of 0.32
    s between the mean FT (0.06 ± 0.03 s, mean ± SD) and mean RT (0.38 ± 0.07 s, mean ± SD)
  expected:
  - {quantity: mean first touch time, value: 0.06, tolerance: 0.03, unit: s}
  - {quantity: mean reaction time, value: 0.38, tolerance: 0.07, unit: s}
  - {quantity: choice period, value: 0.32, tolerance: 0.032, unit: s}
  criterion: Animal of Fig. 2I. Table S1 assigns Fig. 2I to both 573 ("2EFI") and 480 ("2IL");
    readings (g) 573, (h) 480, (i) both pooled; OL_L trials. FT is the first
    whisker-wall touch after t = 0 to the approaching wall (Fig. 2F; Fig. 3Q); touches of the
    retracting wall in the first 11 ms (Fig. 3P) are excluded, reading (a), or not, reading (b).
    RT is the time of the largest peak of the lateral acceleration after t = 0 (SI Fitting of
    drift diffusion models), in the turn direction (positive for left turns, Fig. 2H). Open
    details and readings. The signal, (c) the derivative of the run angle theta of Eq. 1, (d) the
    derivative of the lateral velocity (the SI treats these as the same); the search window, (e)
    0 to 1 s, (f) 0 to 1.8 s (the turn). Tolerances are the paper's SD for FT and RT, 10% for the
