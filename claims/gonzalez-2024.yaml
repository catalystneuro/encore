- id: fig3d-cue-rate-remapping-model
  statement: A cue rate-remapping encoder (zones plus cue gain) predicts single-unit firing
    better than the zone-only and the cue global-remapping models, with a mean R2 of 12%.
  source: Results, Remapping of spatial representations relates to greater task performance,
    paragraph 2; Figure 3c and 3d
  quote: the rate remapping model outperformed the global remapping and position only model
  statistics:
  - test: LMEM likelihood ratio test of model
    statistic: chi2(3) = 962.05
    p: 1.24e-209
  expected:
  - quantity: mean single-unit test R2 of the Z+C model
    value: 0.12
    tolerance: 0.012
  criterion: Outbound data in 20 ms bins; one-hot zone features with the 50-sample look-ahead
    and inverse lag decay (Methods; feature_params max_lag 50, decay inverse); least squares;
    training folds balanced for cue with samples weighted by correct and incorrect proportions;
    Z, Z+C (two cue inputs) and ZxC (two sets of zones) models (Methods, Encoder). Folds are 5
    in the Methods and 10 in the code (zone_encoding_analyses default); the Methods are
    followed and 10 folds shown as a variant. Units with test R2 below -1 are left out. The
    model comparison is read as in paper_stats.py, _zone_encoder_scores, per unit, the
    Mann-Whitney z of test-fold R2 between model pairs, LMEM score ~ 0 + comparison, LRT
    against ~ 1; the LMEM on R2 by model (score_type mean_test) is a second reading.
    Reproduced when, under one reading, the LRT has p < 0.05, Z+C beats both Z and ZxC, and the
    mean Z+C R2 is within tolerance.
- id: fig3e-zone-decoder-cue
  statement: Adding the cue to a population position decoder reduces decoding error on held-out
    data, but only in sessions with many units, and most after the decision point.
  source: Results, Remapping of spatial representations relates to greater task performance,
    paragraph 4; Figure 3e
  quote: we observed significant modulation with the cue as an input, reflected by decreased errors
    ... but only in sessions with high number of units
  statistics:
  - about: interaction of model and unit grouping
    test: LMEM likelihood ratio test
    statistic: chi2(2) = 17.04
    p: 1.9e-4
  - about: interaction of model, unit grouping and pre or post decision
    test: LMEM likelihood ratio test
    statistic: chi2(2) = 214.31
    p: 2.9e-47
  criterion: Multinomial logistic regression of zone on population activity, with and without
    cue (Methods, Decoder; zone_decoder_analyses). The unit groupings are the tertiles of the
    sessions' unit counts, isolated units and MUA together (Figure 3e legend;
    Notebooks/enco_deco_paper_plots_stats.ipynb, pd.qcut(n_units, 3)). Outbound error distance
    averaged by session, subject, zone, grouping, model and fold; LMEM dist ~ grouping * model,
    groups subject, variance components zone and fold, fit by maximum likelihood, LRT against
    dist ~ grouping + model; and dist ~ grouping * model * post_dec (post_dec for zones after
    the Decision-well) against the same model without the triple term (same notebook, whose
    printed LRTs are 17.05 and 214.31, as in the paper). Reproduced when the model by grouping
    interaction has p < 0.05 with the V+C error lower than V only in the largest grouping, and
    the triple interaction has p < 0.05 with the larger reduction after the decision well.
- id: fig3f-decision-decoder
  statement: Decoding of the Left or Right decision from population activity is at chance on
    the stem before the decision point and rises beyond it, more so in sessions with more than 8
    units; in the stem, 19 of 42 sessions with 8 or fewer units and 23 of 36 sessions with 20 or
    more units decoded the decision above chance.
  source: Results, Remapping of spatial representations relates to greater task performance,
    paragraph 4; Figure 3f
  quote: Prospective decoding of the decision prior to the decision point (stem) was at chance,
    while it steadily increased beyond the decision point across sessions, more so in sessions with
    more than 8 units
  statistics:
  - about: interaction of unit grouping and pre or post decision
    test: LMEM likelihood ratio test
    statistic: chi2(2) = 356.82
    p: 3.28e-78
  expected:
  - quantity: sessions with 8 or fewer units with above chance decoding
    value: 19
    tolerance: 1.9
    unit: of 42 sessions
  - quantity: sessions with 20 or more units with above chance decoding
    value: 23
    tolerance: 2.3
    unit: of 36 sessions
  criterion: Logistic decision decoder on population activity, sample-wise probabilities
    averaged by zone and trial and integrated as logits across zones (Methods, Decoder);
    performance as balanced accuracy (BAC) by zone, unit groupings as in fig3e-zone-decoder-cue.
    LMEM bac ~ grouping * post_dec, groups subject, variance components zone and fold, maximum
    likelihood, LRT against bac ~ 1 + grouping + post_dec
    (Notebooks/enco_deco_paper_plots_stats.ipynb). The session counts are for the stem, as the
