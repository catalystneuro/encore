  quote: Subjects took an average of 25 sessions to reach the performance criterion for surgery ...
    sessions to criterion, range = 11–50 ... accuracy ≥ 70% and
  expected:
  - quantity: mean number of training sessions to criterion
    value: 25
    tolerance: 2.5
    unit: sessions
  - quantity: range of sessions to criterion, low bound
    value: 11
    tolerance: 1.1
    unit: sessions
  - quantity: range of sessions to criterion, high bound
    value: 50
    tolerance: 5
    unit: sessions
  criterion: Needs the pre-surgery training sessions. The Results criterion (70%) and the
