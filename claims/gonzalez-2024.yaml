- id: fig4gh-reward-remap-population-subject
  statement: Reward remapping also relates negatively to session performance at the population
    level and within individual subjects.
  source: Results, Absence of reward leads to higher activity and spatial remapping, paragraph 2;
    Figure 4g and 4h; Discussion, paragraph 3
  quote: The extent of reward related remapping correlated with performance accuracy for a session
    at the level of individual units, across co-recorded units, and individual subjects
  depends_on:
  - fig4d-reward-remapping
  criterion: As fig2g-population-remap-behaviour and fig2h-subject-remap-behaviour with the
    reward remapping score (Figure 4g and 4h legends; the Discussion lists population
    correlations among the levels, Figures 2 to 4). The paper gives no number or test for
    either. For subjects, the text does not say whether every subject shows it; reproduced
    when the population LRT has p < 0.05 with a negative slope and at least four of the five
    subjects have a negative correlation, and the number of subjects is reported.
- id: fig4-reward-remap-behaviour-controls
  statement: The relation between reward remapping and behaviour holds when the remapping score
    uses Pearson in place of Kendall correlation, when 500 ms after reward delivery are removed,
    and when periods of speed below 2 cm/s are removed, for isolated units and with MUA.
  source: Figure 4, figure supplements 3 and 4
  quote: Reward remapping vs behavior control analyses for isolated units ... For all control
    analyses, we observed a significant relationship between remapping and behavior
  depends_on:
  - fig4ef-reward-remap-behaviour
  criterion: As fig2-remap-behaviour-controls with the reward remapping score. Reproduced when
    every control gives LRT p < 0.05 with a negative slope; partially when most do.
- id: fig5-reward-rate-remapping-model
  statement: On inbound runs, a reward rate-remapping encoder fits most units better than the
    zone-only and reward global-remapping models.
  source: Results, Absence of reward leads to higher activity and spatial remapping, paragraph 3;
    Figure 5c and 5d
  quote: Similar to the cue models, we found that the activity of most units were better fitted by
    a rate-remapping model
  statistics:
  - test: LMEM likelihood ratio test of model
    statistic: chi2(3) = 856.9
    p: 1.98e-146
  criterion: As fig3d-cue-rate-remapping-model on inbound trials with reward in place of cue
    (rw_type none, fixed, inter; trial_seg in; zone_encoder_comps_dict 'rw'). Reproduced when
    the LRT has p < 0.05 and Zi+R beats both Zi and ZixR, under one reading.
- id: fig4s5-cue-reward-remap-correlated
  statement: Cue and reward remapping scores are correlated across units, across session means
    and at the population level.
  source: Results, Absence of reward leads to higher activity and spatial remapping, paragraph 4;
    Figure 4, figure supplement 5
  quote: First, we found that remapping scores were correlated ( Figure 4-figure supplement 5 )
    across individual units and at the population level
  depends_on:
  - fig2d-cue-remapping
  - fig4d-reward-remapping
  criterion: The paper reports no test. The Kendall correlation of cue and reward remapping
    scores (a standard choice, matching the paper's use of Kendall), at the unit, session mean
    and population levels. Reproduced when all three are positive with p < 0.05; partially when
    one or two are.
- id: fig4s6-incorrect-coding-overlap
  statement: Units coding for incorrect trials overlap more between cue (outbound) and reward
    (inbound) than units coding for correct trials, while remapping scores do not differ among
    these groupings.
  source: Figure 4, figure supplement 6; Results, Absence of reward leads to higher activity and
    spatial remapping, paragraph 4
  quote: Overlap of incorrect coding between cue and reward is greater than the overlap in correct
    (Fisher’s Exact Test p = 0.003 for strict, p = 0.007 for liberal)
  statistics:
  - about: overlap, strict criterion
    test: Fisher's exact test
    p: 0.003
  - about: overlap, liberal criterion
    test: Fisher's exact test
    p: 0.007
  - about: remapping scores among correct or incorrect groupings
    test: Kolmogorov-Smirnov two-sample tests
    p: 0.17
    p_relation: ">"
  criterion: Correct or incorrect coding from the pattern of U_Z over segments (cue on outbound,
    reward on inbound); strict needs all three segments, liberal two of three (legend). The code
    fixes the patterns (experiment_info.py, fr_uz_tau_cue_correct and fr_uz_tau_rw_correct;
    plot_functions.py, plot_cue_rw_correct_rate_coding_overlap_x_of_cluster). The cue score is
    the Kendall tau between the left, stem and right U_Z and (-1, 0, 1), and the reward score is
    (number of segments with U_Z > 0 - 1.5) / 1.5; strict correct is a score of 1 and strict
    incorrect -1, liberal correct a score above 0 and liberal incorrect below 0. No magnitude
    threshold is used. The table of the Fisher tests is not given; it is read as overlapping
    and non-overlapping units for incorrect against correct coding. The absence part is judged
    on the paper's two-sample KS tests between groupings, at p < 0.05. Reproduced when both
    Fisher tests have p < 0.05 with incorrect overlap greater, and no KS test has p < 0.05.
- id: fig4s7-error-signal-persists
  statement: Higher activity on incorrect than correct outbound runs predicts higher activity
    on the following incorrect inbound runs, and the reverse inference also holds, so the error
    signal persists through the inbound phase.
  source: Figure 4, figure supplement 7; Results, Absence of reward leads to higher activity and
    spatial remapping, paragraph 4
  quote: incorrect >correct activity levels on outbound trajectories predicted incorrect >correct
    activity levels on inbound trajectories
  statistics:
  - about: inbound conditioned on outbound, main effect of incorrect
    test: LMEM likelihood ratio test
    statistic: chi2(1) = 6.64
    p: 0.01
    n: 500 single units
  - about: inbound conditioned on outbound, interaction
    test: LMEM likelihood ratio test
    statistic: chi2(1) = 6.89
    p: 0.009
  - about: outbound conditioned on inbound, main effect of incorrect
    test: LMEM likelihood ratio test
    statistic: chi2(1) = 24.28
    p: 0.001
    p_relation: "<"
  - about: outbound conditioned on inbound, interaction
    test: LMEM likelihood ratio test
    statistic: chi2(1) = 9.67
    p: 0.002
  criterion: Z-scored mean rates of correct and incorrect trials per unit and branch, sessions
    with at least 5 incorrect trials, single units (legend, N=500); LMEM with segment, the
    conditioning variable and condition as fixed effects, subject groups, task version and
    session components (legend; paper_stats.py, _conditiona_co_inco_rates). Reproduced when all
    four LRTs have p < 0.05 in the stated direction; partially when the two main effects hold.
- id: fig6cd-of-aggregate-model
  statement: In open-field foraging, an aggregate model built from the speed, head-direction
    and position model predictions predicts single-unit firing on test data better than the
    individual models.
  source: Results, Units encoding head direction during open field foraging are more likely to
    remap, paragraph 1; Figure 6c and 6d
  quote: Across units, the aggregate model produced better results than individual models
  statistics:
  - about: test R2
    test: LMEM likelihood ratio test, main effect of model
    statistic: chi2(4) = 567.15
    p: 1.33e-122
  - about: rate map correlation r_p
    test: LMEM likelihood ratio test, main effect of model
    statistic: chi2(4) = 878.84
    # Printed "p = 3.44 − 190" in the text (exponent sign without "e"); read as 3.44e-190.
    p: 3.44e-190
  criterion: Speed, head-direction and position models by linear regression on binned features
    (Methods, Open-field encoding models), with the code's bins (3 cm position bins, PCA to 95%
    of variance; 10 degree angle bins; 2 cm/s speed bins from 2 to 80 cm/s;
    experiment_info.py task parameters), immobility below 2 cm/s left out of head-direction
    models, 5 blocked splits (open_field_functions.py n_xval). Blocks are 20 s in the Methods
    and 30 s in the code's call; the Methods are followed and 30 s shown as a variant. MUA and
    units with test R2 <= -1 left out (paper_stats.py, _open_field_models). Reproduced when both
    LRTs have p < 0.05 and the aggregate model has the highest test R2 and r_p.
- id: fig7b-matched-units
  statement: A waveform matching algorithm matched 217 units across 76 open-field and 82
    Tree-Maze sessions.
  source: Results, Units encoding head direction during open field foraging are more likely to
    remap, paragraph 1; Figure 7a and 7b
  quote: In total 217 units were matched across 76 OF and 82 Tree-Maze sessions
  expected:
  - quantity: matched units
    value: 217
    tolerance: 21.7
    unit: units
  - quantity: open-field sessions with matches
    value: 76
    tolerance: 7.6
    unit: sessions
  - quantity: Tree-Maze sessions with matches
    value: 82
    tolerance: 8.2
    unit: sessions
  criterion: Matching as in Methods, Across session unit matching, on tetrodes at the same
    depth, 1000 waveforms per unit, 2-D UMAP, minimum covariance determinant Gaussians and the
    misclassification distance d with threshold 0.5 (Figure 7a legend). UMAP is not
    deterministic and the Methods give no parameters; the code's defaults (n_neighbors 30,
    min_dist 0, seed 0; cluster_match_functions.py, dim_reduction) are used. The paper's own
    matches are in the repository's metadata/unit_table.csv, which is shown alongside. Reproduced when the three
    counts are within tolerance.
- id: fig7de-hd-speed-tradeoff
  statement: Clustering the aggregate model coefficients of matched units into three groups
    shows a trade-off between head-direction and speed coding; cluster 0 (n=98) codes strongly
    for head direction and poorly for speed, cluster 2 (n=59) the reverse.
  source: Results, Units encoding head direction during open field foraging are more likely to
    remap, paragraph 1; Figure 7c to 7e
  quote: units that coded strongly for head-direction (cluster 0, blue, n=98) coded poorly for
    speed, while units that coded strongly for speed coded poorly for head-direction (cluster 2,
    green, n=59)
  expected:
  - quantity: units in cluster 0
    value: 98
    tolerance: 9.8
    unit: units
  - quantity: units in cluster 2
    value: 59
    tolerance: 5.9
    unit: units
  depends_on:
  - fig6cd-of-aggregate-model
  - fig7b-matched-units
  criterion: Aggregate coefficients (speed, head direction, position) of matched units, 2-D UMAP
    (n_neighbors 20, min_dist 0.1) and agglomerative clustering into 3 clusters, renamed so the
    head-direction cluster is 0 (cross_task_functions.py, umap_cluster;
    experiment_info.py, get_matched_of_cell_clusters). The paper states no statistic (Figure 7e
    legend). Reproduced when the cluster with the highest mean head-direction coefficient has
    the lowest mean speed coefficient, the reverse holds for another cluster, and the two counts
    are within tolerance; the paper's clusters in metadata/unit_table.csv are shown alongside.
- id: fig7f-tuning-metrics-match
  statement: Classical open-field tuning scores (split-half map correlation, speed score,
    resultant vector length) of the clusters qualitatively match the model coefficients.
  source: Results, Units encoding head direction during open field foraging are more likely to
    remap, paragraph 1; Figure 7f
  quote: For completeness, OF tuning score metrics were also computed for these clusters with
    results qualitatively matching the model coefficients
  depends_on:
  - fig7de-hd-speed-tradeoff
  criterion: Scores as in Methods, Open-field tuning metrics (immobility below 2 cm/s left out
    of the head-direction score). Paired comparisons by Mann-Whitney U as in the Figure 7f
    legend, which gives only its significance key. Reproduced when the head-direction cluster has the highest
    median resultant vector length and the speed cluster the highest median speed score, each
    against the other clusters by Mann-Whitney U at p < 0.05.
- id: fig7g-hd-cluster-remaps-more
  statement: On matched units, cue and reward remapping remain significant, and units of the
    head-direction cluster 0 remap more than those of the other clusters.
  source: Results, Units encoding head direction during open field foraging are more likely to
    remap, paragraph 2; Figure 7g
  quote: units in cluster 0 remapped more than the other clusters
  statistics:
  - about: cluster by remap type interaction
    test: LMEM likelihood ratio test
    statistic: chi2(2) = 6.87
    p: 0.032
  - about: cluster main effect
    test: LMEM likelihood ratio test
    statistic: chi2(2) = 1.5
    p: 0.47
  data: with_labels
  depends_on:
  - fig2d-cue-remapping
  - fig4d-reward-remapping
  - fig7de-hd-speed-tradeoff
  criterion: Remapping scores of matched units melted over cue and reward; LMEM score ~ 1 +
    remap type * cluster against score ~ 1 + remap type + cluster, and the main effect test,
    groups subject, variance components Tree-Maze session, open-field session and match id
    (paper_stats.py, _of_cluster_TM_comps, score_group tm_remap). Clusters from the paper's
    metadata/unit_table.csv; recomputed clusters are a variant. The paper gives no test for
    remapping remaining significant on matched units; it is judged as in fig2d-cue-remapping
    and fig4d-reward-remapping on the matched units. Reproduced when the cue and reward
    intercepts have 95% CIs below zero, the interaction has p < 0.05, and cluster 0 has the
    most negative mean remapping score for cue or reward.
- id: fig7h-hd-cluster-encoder-scores
  statement: Tree-Maze rate and global remapping encoder scores are higher for the
    head-direction cluster 0.
  source: Results, Units encoding head direction during open field foraging are more likely to
    remap, paragraphs 2 and 3; Figure 7h
  quote: Tree-Maze encoder rate/global remapping scores were higher for cluster 0
  statistics:
  - test: LMEM likelihood ratio test, cluster
    statistic: chi2(2) = 13.89
    p: 9.62e-4
  data: with_labels
  depends_on:
  - fig3d-cue-rate-remapping-model
  - fig5-reward-rate-remapping-model
  - fig7de-hd-speed-tradeoff
  criterion: Test R2 of the rate (Z+C, Zi+R) and global (ZxC, ZixR) encoders for cue and reward
    of matched units, values with |R2| > 1 left out (experiment_info.py, encoder table); LMEM
    score ~ 1 + rate + cue + cluster against score ~ 1 + rate + cue, same random structure as
    fig7g (paper_stats.py, _of_cluster_TM_comps, score_group tm_enc_r2, test main). Reproduced
    when the LRT has p < 0.05 and cluster 0 has the highest mean score.
- id: methods-lookahead-encoder-best
  statement: Among zone encoders with retrospective, no, and prospective lags, the 1 s
    look-ahead encoder performed best.
  source: Methods, Tree-maze encoder/decoder, Encoder, paragraph 1
  quote: Because the best performing lag model was the Z 50 ’look ahead’ encoder, all additional
    encoder models were trained with this zone feature scheme
  criterion: Z-50, Z0 and Z50 encoders on outbound data as in fig3d-cue-rate-remapping-model
    (zone_encoder_comps_dict 'lag'), compared by the same LMEM. The paper gives no statistic.
    Reproduced when Z50 has the highest mean test R2 and the comparisons against Z0 and Z-50
    favour it at p < 0.05.
