# Claims for Gonzalez & Giocomo (2024), "Parahippocampal neurons encode task-relevant
# information for goal-directed navigation", eLife 12:RP85646, doi:10.7554/elife.85646, tested
# on DANDI:000405.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-11-24, protocol pilot-18 as stated in docs/protocol.md.
#
# Text read. paper/10.7554-elife.85646.txt, served by Europe PMC (PMC10942598), the eLife
# reviewed preprint as revised (published 16 February 2024, version of record history in the
# header). It holds the main text, the Methods, all figure and figure-supplement legends
# (Figure 1 to Figure 7 and their supplements), the eLife assessment and the public reviews.
# The only supplementary file is the MDAR checklist (elife-85646-mdarchecklist1.pdf), which
# holds no results. The PDF was not opened; no figure value was needed beyond the text.
#
# Code read. https://github.com/alexgonzl/TMA, the repository the Data availability statement
# names, at commit 6f935935d93a9a27f931f6e73c05d965dfbb862a (the Software Heritage archive the
# paper cites; HEAD 5ec5fc2 differs only in README.md). It holds the analysis package
# (Analyses/tree_maze_functions.py: trial tables, zone rates, balanced resampling, segment
# rate comparisons, remapping scores, zone encoders and decoders; Analyses/paper_stats.py: the
# LMEM and likelihood ratio tests for every reported statistic; Analyses/open_field_functions.py
# and experiment_info.py: open-field encoding models and parameters;
# Analyses/cross_task_functions.py: UMAP and clustering of matched units; Utils/robust_stats.py:
# Mann-Whitney z, Kendall to Pearson and Fisher transforms), notebooks that call them (their
# statistics are interactive widgets, so no printed result is kept), and metadata/
# (perf_table.csv: per-session trials and accuracy; session_table.csv: session list by task;
# unit_table.csv: the paper's matches of open-field and Tree-Maze units with their open-field
# cluster). Method details below cite the file and function they come from.
#
# Data the paper used. Five male Long Evans rats implanted with tetrode microdrives over the right MEC; units mostly in MEC
# with some PaS and PrS. Units spike sorted with Kilosort2 and curated as isolated units or MUA.
# Two kinds of session: Tree-Maze sessions (task names T3g and T3i in the code, the "task
# versions" used as a random effect) and open-field foraging sessions (OF, 1.3 m x 1.5 m arena
# on the same rig). Tree-Maze trials: Home-well trigger turns on a cue (Left Cue green, Right
# Cue purple), the rat runs through the Decision-well to a Goal-well (G1, G2 right; G3, G4
# left); correct trials are rewarded, incorrect trials give no reward and a 10 s timeout;
# outbound runs from Home-well reward to last Goal-well detection, inbound from there to the
# next Home-well reward. Inclusion: at least 1 unit and at least 50 trials per session.
# Measured variables: tracked position and head angle, well events, cue, decision, reward,
# spike times of units. Training sessions before surgery are reported in Figure 1, figure
# supplement 2. The dandiset's description says it holds session electrophysiological data and
# event metadata and time series needed for the figures, with session, unit matching and
# behavioural tables in the GitHub metadata folder.
#
# Method choices fixed here from the code where the Methods are silent, applying to all claims
# unless a claim says otherwise.
# - Trials. trial end 'tE_2'; samples outside the maze zones and invalid zone transitions are
#   blanked; no reward or speed blanking in the main analyses (experiment_info.py,
#   _default_trial_analyses_params). Change-of-mind trials are excluded (Methods, Behavioral
#   training).
# - Maze segments. "left", "stem" and "right" are the code's 'bigseg' segments of
#   TreeMazeZones; the zone maps use all sub-segments and wells (n_all_segs; the Methods give 39
#   zones).
# - Segment rate differences (Figures 2c and 4c). Per unit and big segment, trial-wise segment
#   rates of all trials of one condition against all of the other (CR against CL on outbound,
#   Co against Inco on inbound; not resampled), compared by the Mann-Whitney U turned into
#   z = (U - n1 n2 / 2) / sqrt(n1 n2 (n1 + n2 + 1) / 12) (tree_maze_functions.py,
#   rate_segment_comp_analysis; robust_stats.py, mannwhitney_z).
# - Balanced resampling. For each condition, each sub-condition is sampled with replacement to
#   the mean of the smallest and largest sub-condition size; 100 resamples, seed 0
#   (get_trials_boot_cond_set). Cue test: CR against CL trials, each balanced for correct and
#   incorrect; null: even against odd trials, each balanced for cue, outbound. Reward test:
#   correct against incorrect inbound trials, each balanced for cue; null: even against odd
#   inbound trials balanced for cue (bal_cond_pairs, test_null_bal_cond_pairs; Methods,
#   Balanced trial resampling, which balance the null by LC and RC). The Results paragraph on
#   Figure 4d says the reward null had "an equal number of rewarded and unrewarded trials";
#   that balancing is shown as a variant.
# - Remapping score. Kendall tau between the two mean zone rate maps of each resample, turned
#   to Pearson r = sin(pi tau / 2), Fisher z, and test against null compared per resample as
#   (z1 - z2) / sqrt(1/(n1 - 3) + 1/(n2 - 3)) with n the number of zones, then averaged over the
#   100 resamples (Methods, Remapping scores; all_zone_remapping_analyses, compare_corrs, the
#   'corr_zm' column). Sessions with fewer than five trials in a nested condition are excluded.
# - LMEM. statsmodels mixedlm with subject as group (random intercept), task version and
#   session as variance components (paper_stats.py). For behaviour, the dependent variable is
#   the session's fraction correct, logit transformed (rescale_behav=True), regressed on the
#   remapping score, with task version as variance component; LRT against the model without
#   the score, both fit by maximum likelihood, df the difference in fixed parameters.
# - Units. The Methods do not say whether MUA enter the main analyses. Figure 2, figure
#   supplement 6 says its panel (a), "Original results as reported in Figure 2", is for
#   isolated units, and figure supplement 7 adds MUA; the code's default is all units with
#   unit type as a fixed effect or variance component. Where a claim's numbers depend on the
#   unit set, both readings are named: (i) isolated units only; (ii) isolated units and MUA.
schema_version: 2
paper: doi:10.7554/elife.85646
claims:
- id: fig1d-task-performance
  statement: Across subjects, the median session accuracy on the Tree-Maze was 72.6% and the
    median number of trials per session was 110, among sessions with at least one unit and at
    least 50 trials.
  source: Results, Tree-Maze behavior and electrophysiological recordings, paragraph 2; Figure 1d
  quote: "criteria for inclusion in the analyses were... # units ≥ 1, # trials ≥ 50 (across subject
    median accuracy = 72.6%, median number of trials per session = 110; Figure 1d )"
  expected:
  - quantity: median session accuracy across subjects
    value: 72.6
    tolerance: 7.26
    unit: percent
  - quantity: median number of trials per session
    value: 110
    tolerance: 11
    unit: trials
  criterion: Sessions are Tree-Maze sessions with at least 1 unit and at least 50 trials
    (Results). Accuracy is correct trials over correct and incorrect trials, change-of-mind
    trials left out (Methods, Behavioral training). "Across subject median" is the median of
    the five subjects' median session values, as the code computes it (Notebooks/TM/fig1.ipynb,
    perf grouped by subject, median, then median; its output is 0.726 and 110.25); the median
    over all included sessions pooled is shown as a variant. Reproduced when both values are
    within tolerance.
- id: fig1-switch-performance
  statement: Performance on Switch trials (cue differs from the previous trial) was similar to
    non-Switch trials, with a median Switch-trial accuracy of 76.9% and a median of 54 Switch
    trials per session, so subjects did not follow an alternation or exploitative strategy.
  source: Results, Tree-Maze behavior and electrophysiological recordings, paragraph 2; Figure 1,
    figure supplement 2c and 2d
  quote: the mean Switch trial performance was similar to non-Switch trials (Switch trial median
    accuracy = 76.9%; median number of Switch trials per session = 54)
  expected:
  - quantity: median Switch-trial accuracy
    value: 76.9
    tolerance: 7.69
    unit: percent
  - quantity: median number of Switch trials per session
    value: 54
    tolerance: 5.4
    unit: trials
  criterion: A Switch trial is trial N+1 whose cue differs from trial N (Results). Same
    sessions and the same median of subject medians as fig1d-task-performance (fig1.ipynb gives
    pct_sw_correct 0.769 and n_sw_trials 54); the pooled median is a variant. "Similar" has no
    test or threshold in the paper; it is judged as the median Switch-trial accuracy lying
    within 10 percentage points of the median accuracy of non-Switch trials, a threshold fixed
    here and not from the paper, so that part of the outcome rests on an assumption. Reproduced
    when both expected values are within tolerance and the similarity holds.
- id: fig1-training-to-criterion
  statement: Subjects took an average of 25 training sessions (range 11 to 50) to reach the
