  source: Results, Remapping of spatial representations relates to greater task performance,
    paragraph 1; Figure 2e
  quote: There was a significant negative relationship between performance accuracy on a given
    session p s e and the degree of cue remapping calculated for single units
  statistics:
  - about: LMEM slope of performance on remapping score
    test: LMEM likelihood ratio test
    statistic: chi2(1) = 51.09; Kendall tau = -0.27
    p: 8.84e-13
    ci:
      level: 0.95
      low: -0.15
      high: -0.09
  expected:
  - quantity: Kendall tau between session performance and unit cue remapping score
    value: -0.27
    tolerance: 0.027
  - quantity: LMEM slope
    value: -0.12
    tolerance: 0.03
