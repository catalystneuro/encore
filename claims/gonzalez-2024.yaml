    # Printed "p = 3.06 − 20" in the text (exponent sign without "e"); read as 3.06e-20.
    p: 3.06e-20
    ci:
      level: 0.95
      low: -0.18
      high: -0.11
  - about: session means of co-recorded units
    test: LMEM likelihood ratio test
    statistic: chi2(1) = 30.54; Kendall tau = -0.43
    p: 3.28e-8
    ci:
      level: 0.95
      low: -0.38
      high: -0.19
  expected:
  - quantity: unit-level Kendall tau
    value: -0.28
    tolerance: 0.028
  - quantity: unit-level LMEM slope
    value: -0.14
    tolerance: 0.035
  - quantity: session-level Kendall tau
    value: -0.43
