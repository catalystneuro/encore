    highest tertiles). Reproduced when the interaction has p < 0.05 with post-decision accuracy
    higher in larger groupings, and the two counts are within tolerance.
- id: fig3g-decoder-tracks-behaviour
  statement: Trial-wise decoder choices compared with the cue give a performance that relates to
    the subject's performance after the decision point, modulated by the number of co-recorded
    units.
  source: Results, Remapping of spatial representations relates to greater task performance,
    paragraphs 4 and 5; Figure 3g
  quote: post-decision decoder predictions related to the subject’s performance and was modulated
    by the number of co-recorded neurons
  statistics:
  - about: interaction of model performance, unit grouping and pre or post decision
    test: LMEM likelihood ratio test
    statistic: chi2(2) = 43.48
    # Printed "p = 3.61 − 10" in the text (exponent sign without "e"); read as 3.61e-10.
    p: 3.61e-10
  depends_on:
  - fig3f-decision-decoder
  criterion: Decoder performance per session, zone and fold is the fraction of trials whose
    decoded decision matches the cue (cue_match); subject performance is the fraction correct
