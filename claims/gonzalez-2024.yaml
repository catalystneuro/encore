- id: fig2c-cue-error-coding
  statement: Across units, the Mann-Whitney z of Right-Cue against Left-Cue segment firing rates
    on outbound runs follows a left > stem > right pattern, so firing is higher on the branch
    the cue did not indicate (after incorrect decisions).
  source: Results, Visual cues evoked spatial remapping, paragraph 1; Figure 2c
  quote: Using a linear mixed effects model we found a main effect of Segment with follow-up
    pairwise comparisons showing a left >stem > right pattern
  statistics:
  - about: main effect of segment on U_Z
    test: LMEM likelihood ratio test
    statistic: chi2(3) = 85.25
    p: 3.07e-19
  - about: joint hypothesis left > stem > right
    test: Wald test
    statistic: chi2(2) = 90.45
    p: 2.27e-20
  criterion: U_Z per unit and big segment as in the opening comment (rate_segment_comp_analysis,
    the 'uz_val' column). LMEM U_Z ~ 0 + segment, groups subject, variance components task
    version and session (and unit type when MUA are included), LRT against U_Z ~ 1 by maximum
    likelihood, and a Wald test of left > stem and stem > right (paper_stats.py,
    _segment_rates). Unit set readings (i) and (ii). Reproduced when the segment LRT has p <
    0.05 and the fixed effects are ordered left > stem > right with the Wald test p < 0.05,
    under one reading.
- id: fig2d-cue-remapping
  statement: Across units the cue remapping score is shifted below zero (mean -0.67), so the cue
    induced significant remapping of spatial firing compared with an even and odd trial null.
  source: Results, Visual cues evoked spatial remapping, paragraph 2; Figure 2d
  quote: Across units we observed a significant negative shift in z ¯ Δ τ ... mean = −0.67, p =
    0.003 , CI 95% =(−1.105,–0.225))
  statistics:
  - test: LMEM, intercept
    p: 0.003
    ci:
      level: 0.95
      low: -1.105
      high: -0.225
  expected:
  - quantity: LMEM mean cue remapping score
    value: -0.67
    tolerance: 0.44
  criterion: Cue remapping score per unit as in the opening comment. LMEM score ~ 1 (plus unit
    type when MUA are included), groups subject, variance components task version and session
    (paper_stats.py, _remap_scores). Tolerance is the half-width of the paper's 95% CI.
    Reproduced when the intercept is within tolerance and its 95% CI excludes zero, under unit
    set reading (i) or (ii).
- id: fig2e-unit-remap-behaviour
  statement: The cue remapping score of single units correlates negatively with the session's
