# Claims for Krishnan, Heer, Cherian & Sheffield (2022), Nat Commun 13, 6662, on dandiset 000462.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23,
# protocol pilot-10 as stated in docs/protocol.md (Reader).
#
# Text read: the version of record, open access in PMC (PMC9636178), as served by Europe PMC:
# main text, figure legends and Methods. Supplement read: Supplementary Information
# (41467_2022_34465_MOESM1_ESM.pdf, Supplementary Figs. 1 to 21 with their legends), the peer
# review file and the reporting summary, from the PMC Open Access files. The Source Data file is
# not under paper/ and was not read. No PDF of the main article is under paper/, so p-values printed
# only inside the main figure panels could not be read; the text reports means with 95% CIs, and
# those are recorded here. No figure was copied.
#
# Code read: https://github.com/seethakris/HPCrewardpaper, commit 5b3b22a952ac14c62689b63ad9ada4ea9e0c72b3
# (6 Oct 2022). It holds Python for the behaviour (licking, lick stop, approach behaviour and
# engagement, pupil), the naive Bayes position decoder (scikit-learn GaussianNB), population vector
# and k-means cluster analysis, a graph analysis not used in the paper's figures, animal details
# files, and MATLAB for VTA axon ramps and pupil. It does not hold the place field detection, the
# place field parameters (reliability, out/in field ratio, width, firing intensity), the spatial
# correlation, the place field fate analysis, the COM density fits or the reward cell definition:
# the scripts load these from precomputed MATLAB files. Those criteria follow the Methods alone.
# Where the code and the Methods disagree, the Methods give the main reading and the code is a
# variant, as listed in each criterion.
#
# The data the paper used, as the paper reports it:
# - Wild-type C57BL/6J male mice, 10 to 12 weeks, 2-photon imaging of dorsal CA1 pyramidal cells
#   expressing GCaMP6f (30 Hz), on a 2 m virtual linear track (40 bins of 5 cm), water reward (4 uL)
#   at the track end, 1.5 s pause, teleport to the start. Behaviour recorded with the imaging:
#   track position, running velocity, reward delivery, licks (capacitive sensor), and pupil video
#   at 15 frames/s in 5 mice.
# - Reward extinction sessions, one day: Rewarded (R, 34 +/- 2 laps), Unrewarded (UR, 28 +/- 4 laps,
#   reward and solenoid click off), Re-rewarded (RR, 27 +/- 3 laps). 12 mice ran R and UR; 6 of
#   them also ran RR, and those 6 also ran a Novel-rewarded environment (NR, 31 +/- 5 laps). UR laps
#   are split at the lick stop into RE high (pre-licking) and RE low laps; RE low laps are split into
#   Engaged and Disengaged by approach behaviour. Figures 2 and 3 use the 3 of the 6 R-UR-RR mice
#   with more than 12 engaged RE low laps; Supplementary Figs. 9 and 11 use all mice.
# - Time controls: 6 mice in the familiar rewarded environment only, for about 15 to 20 minutes,
#   split into two halves.
# - Dark controls: 6 mice running with no visual cues (behaviour only).
# - DREADD experiments: DAT-Cre mice with hM4D(Gi)-mCherry in VTA, CA1 GCaMP6f, the same field of
#   view over 4 days: day 1 R-UR-RR; day 2 R before and after saline (12% DMSO); day 3 CNO
#   (5 mg/kg, back in R after 45 min); day 4 DCZ (0.1 mg/kg, back in R after 10 min); n = 6 mice
#   (5 for saline). Controls: 3 DAT-Cre mice with tdTomato in VTA, the same protocol.
# - VTA axon imaging: DAT-Cre mice with axon-GCaMP7b in VTA DA neurons, imaged in CA1: 7 ramping
#   axons from 6 mice in R and UR, 5 axons from 5 mice in RR and in a novel environment, plus 2
#   axons with other signals.
# The dandiset's description says it holds the WT reward extinction data of Figures 1 to 3 and four
# DREADD and control datasets of Figure 4, as suite2p fluorescence with behaviour; it does not
# mention the axon imaging of Figure 5, the dark controls or pupil video. Whether it holds them is
# the author's to find.
#
# Definitions taken from the Methods and used by several claims:
# - Running frames: speed >= 1 cm/s (frames below 1 cm/s are removed for the decoder, place
#   fields and pupil).
# - Lick stop: licks counted in a reward zone from the average track position at which the mouse
#   started pre-licking in R to after teleportation; the lap where pre-licking stops is "the lap
#   following 2 consecutive laps with an absence of these licks". The paper fixes this in three
#   ways that differ by a lap: (L1) the first of the two consecutive no-lick laps (the code,
#   LickStopAnalysis.py, First2, and the decoder code, which starts RE low at that index);
#   (L2) the second of them (Supplementary Fig. 4 legend, "the 2nd consecutive non-licking lap",
#   and the engagement code, which counts laps 0 to the index as licking laps); (L3) the lap after
#   the two (the Methods sentence read literally). RE high laps are the UR laps before the lick
#   stop lap and RE low laps the lick stop lap and later. Every claim that uses RE high or RE low
#   runs all three readings. Code variant: LickStopAnalysis.py counts all licks in the lap
#   (numlicks_withinreward_alllicks sums every spatial bin), not those in the reward zone; and the
#   reward zone it computes elsewhere starts at the first 5 cm bin where the summed R licks exceed
#   the number of R laps.
# - Engaged laps (approach behaviour): per lap, instantaneous velocity along the track averaged in
#   5 cm bins; approach ratio = mean velocity at 100 to 150 cm over mean velocity at 175 to 200 cm;
#   an RE low lap is engaged when its ratio is at least the R mean minus 1.5 SD of the R ratios of
#   that mouse (the Methods print "mean +/- 1.5 * standard deviation"; the code,
#   define_attentivelaps.py, uses mean - 1.5 SD, which is the reading that leaves most laps engaged
#   as reported). Code variant: velocity normalised to its peak per lap, 2 bins trimmed at each
#   end, and the ratio taken as the mean of the first 10 over the mean of the last 10 of the bins
#   from bin 20 on.
# - Place fields (Methods, Defining place fields): 40 bins of 5 cm, running frames only; a field
#   is wider than 10 cm (except fields clipped at the track end), mean dF/F more than 10% above
#   baseline, mean dF/F in field more than 4 times the mean outside, transients in field on more
#   than 30% of laps, rising phase on the track, bootstrap p < 0.05 (ref. 75, Dombeck et al. 2010).
#   Fields beginning at or after reward delivery or during teleportation are excluded. Several
#   fields in a cell are treated independently. The baseline and the significant-transient filter
#   follow refs. 44, 67 and 75, which are not part of this paper; the author takes them from those
#   references or from the dandiset's processed traces and records which.
# - Place field parameters (Methods): reliability = mean of the lap by lap Pearson correlation
#   matrix of the field's L x 40 map times the fraction of laps with a significant transient in the
#   field; out/in ratio = mean dF/F in bins outside the field over mean in bins inside; width =
#   distance between the bin where the mean field rises above 0 and the bin where it returns to 0;
#   firing intensity = peak dF/F of the mean field. Transients outside the field are removed for
#   all but the out/in ratio and the spatial correlation.
# - Spatial correlation: Pearson correlation between the mean 40-bin map of each place cell defined
#   in R and its mean map in another condition.
#
# How readings combine: readings of which laps, cells or fields a reported number is taken over
# (the lick stop readings L1 to L3, per-mouse or pooled means, the pupil thresholds P1 to P3, lap
# splits) follow the protocol's rule for reported numbers, and the claim holds when one reading
# matches. Readings of what a measure is compared with or how a test is corrected (the within-R
# reference S1 and S2, Bonferroni or not), and the fate definitions F1 to F3, which the paper does
# not give and the reader made up, follow the rule for open method
# details: the outcome is the one they all give, and when they differ the claim is blocked as
# methods_underspecified with every result shown. A code variant named as such is shown and does
# not decide the outcome. Thresholds that a criterion says are "fixed here" are the reader's,
# written before any analysis, for findings the paper states in words only.
#
# Tolerances: where the paper gives a mean with a 95% CI, the tolerance is the larger distance from
# the mean to a CI bound; otherwise 10% of the value, or the stated spread. Numbers given as
# "mean +/- 95% CI" use that half-width.
schema_version: 2
