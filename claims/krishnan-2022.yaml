  - quantity: mean decoder R2, RE high
    value: 0.90
    tolerance: 0.03
  - quantity: mean decoder R2, RE low
    value: 0.65
    tolerance: 0.11
  - quantity: mean decoder R2, RR
    value: 0.82
    tolerance: 0.05
  criterion: Decoder as in fig1d-decoder-drop-ur. Per mouse, the mean of the lap R2 values in each
