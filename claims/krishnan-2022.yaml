  id: "000462"
paper: doi:10.1038/s41467-022-34465-5
claims:
- id: session-lap-counts
  statement: Mice ran on average 34 laps in R, 28 in UR and 27 in RR (mean +/- 95% CI 34 +/- 2,
    28 +/- 4 and 27 +/- 3), and 31 +/- 5 laps in the novel rewarded environment.
  source: Methods, Imaging sessions, paragraph 1
  quote: Mice on average ran 34 ± 2 (mean ± 95% CI) laps in the Rewarded condition, at which point,
    reward was turned off and imaging in the Unrewarded environment continued (28 ± 4 laps)
  expected:
  - quantity: laps in R, mean over the 12 mice
    value: 34
    tolerance: 2
  - quantity: laps in UR, mean over the 12 mice
    value: 28
    tolerance: 4
  - quantity: laps in RR, mean over the 6 mice
    value: 27
    tolerance: 3
  - quantity: laps in the novel rewarded environment, mean over the 6 mice
    value: 31
    tolerance: 5
  criterion: A lap is one traversal from 0 to 200 cm ending at the track end. Whether a partial
    last lap counts is not said; the count with and without it is shown, and the claim holds when
    either matches.
- id: lick-persistence-ur
  statement: After reward removal mice kept pre-licking for about 5 laps (5 +/- 1) before stopping;
    4 of 12 mice licked randomly in later laps.
  source: Methods, Licking behavior; Results, Lowering reward expectation changes spatial encoding,
    paragraph 1; Supplementary Fig. 1
  quote: This anticipatory licking behavior continued for a few laps in UR (5 ± 1 lap) and decayed
    exponentially (Fig. 1e ) except for some animals (4/12) that randomly licked in later laps
  expected:
  - quantity: laps of pre-licking in UR before the lick stop, mean over 12 mice
    value: 5
    tolerance: 1
  - quantity: mice that licked randomly after the lick stop
    value: 4
    tolerance: 0
  criterion: The lick stop as defined in the opening comment, under readings L1, L2 and L3; the
    number of RE high laps per mouse is averaged over the 12 mice. The paper's "5 +/- 1" is read
    as mean +/- 95% CI, as for the lap counts in the Methods. What "randomly licked in later laps"
    counts is open, and the paper contradicts itself - the Methods (Engagement with VR, approach
    behavior) say "Only one animal continued to randomly pre-lick at laps after our definition of
    lick stop" (10 laps), against 4/12 in the quoted sentence. Readings for the 4 mice - (a) any RE
    low lap with a lick in the reward zone (the Methods sentence implies this gives 1 mouse); (b) any
    RE low lap with a lick anywhere on the track; (c) any UR lap after the first no-lick lap with a
    lick in the reward zone. The count is reported under each reading, with which ones give 4 and
    which give 1. Holds when, under one lick stop reading, the mean is within tolerance and one
    reading of the random licking gives 4 mice.
- id: fig1d-decoder-drop-ur
  statement: A naive Bayes decoder trained on initial R laps predicts position accurately on the
    final R laps and on the first UR laps, then abruptly underperforms later in UR.
  source: Results, Lowering reward expectation changes spatial encoding, paragraph 2; Figure 1d
  quote: We found that the decoder was able to accurately predict position on the final laps in R
    and initial laps in UR before abruptly underperforming
  criterion: Decoder as in the Methods (Position decoding) - Gaussian naive Bayes on the dF/F of all
    cells, running frames only, 40 position bins of 5 cm, track treated as circular, trained on the
    first 60% of R laps, R2 between true and predicted bin computed per lap. Code variant
    (RunControlmodelonothertasks.py) - trained on the first 50% of R running frames, and the
    prediction unwrapped circularly before R2 (yang_trace); laps with 100 frames or fewer are
    dropped. Holds, per mouse, when the mean R2 of the first 3 UR laps is within 0.1 of the mean
    R2 of the held-out R laps and the mean R2 of the RE low laps is below both; reproduced when this
    holds in at least 9 of the 12 mice, under readings L1 to L3 for RE low. The thresholds (0.1, 3
    laps, 9 of 12) are fixed here; the paper gives none, and the lap by lap R2 traces are shown.
  depends_on:
  - fig1f-decoder-r2
- id: fig1e-decoder-follows-licking
  statement: Averaged over 12 mice, lap by lap decoder R2 in UR falls as an S-shaped curve around
    the lap where pre-licking reaches zero; a reverse Boltzmann sigmoid fits the mean R2 with
    r = 0.94, and its point of maximum change is at lap 10.
  source: Results, Lowering reward expectation changes spatial encoding, paragraph 2; Figure 1e;
    Methods, Decoder performance with different behavioral parameters, Licking behavior
  quote: On average, pre-licking continued for a few laps before rapidly dropping, and interestingly,
    decoder performance sharply dropped around the same lap when pre-licking reached zero
  expected:
  - quantity: goodness of the sigmoid fit to the mean UR R2 curve
    value: 0.94
    tolerance: 0.094
  - quantity: UR lap of maximum decrease of the fitted R2 (first zero of the second derivative)
    value: 10
    tolerance: 1
  criterion: Per mouse, the UR lap by lap decoder R2 (decoder as in fig1d-decoder-drop-ur) and the
    lap by lap lick frequency in the reward zone are smoothed with a 3-lap rolling average, then
    averaged across the 12 mice lap by lap; the mean R2 is fitted with a reverse Boltzmann sigmoid
    (scipy curve_fit). The Methods call 0.94 both "r" and "coefficient of determination of curve
    fit"; both the correlation of fit and data and the R2 of the fit are shown, and either may
    match. The lap of maximum change is the first lap where the second derivative of the fit
    reaches zero, rounded to a whole lap. How mice with fewer UR laps enter the lap by lap average
    is not said; the average over the mice present at each lap is used and the lap range kept is
    the first 15 laps, as in the code (get_bayeserror_with_slidingwindow, totalnumlaps=15). Holds
    when both values are within tolerance and the normalised lick curve reaches its minimum within
    3 laps of the lap of maximum change (the 3 laps are fixed here; the paper says only "around the
    same lap"). The paper reports no test for this finding.
