- id: fig5l-ramps-return-rr
  statement: DA axon ramps return in RR and do not differ from R (slope x max RR 1.23, 95% CI -0.28 to
    2.74, n = 5 axons); ramps start to return early in RR and are near R levels late in RR.
  source: Results, VTA inputs to CA1 encode reward expectation through a proximity to reward signal,
    paragraphs 1 and 2; Figure 5f to h, l; Supplementary Fig. 19c, f
  quote: 'DA-axon-ramps were not different in R versus RR (Fig. 5k ; n = 5, Mean [95%CI]: Slope*max: R =
    1.00 [1.00, 1.00], RR = 1.23 [−0.28, 2.74])'
  statistics:
  - about: slope x max, RR
    ci:
      level: 0.95
      low: -0.28
      high: 2.74
    n: 5 axons
  expected:
  - quantity: slope x max, RR
    value: 1.23
    tolerance: 1.51
  criterion: A claim of absence. As in fig5k-ramp-slope-max for the 5 axons imaged in RR. Reproduced
    when the two-sided paired t-test of R against RR slope x max over the 5 axons (Figure 5l legend)
    gives p >= 0.05; the mean is compared with its tolerance and reported. The Methods (Statistics)
    say samples of five or fewer get only a non-parametric test; a two-sided Wilcoxon signed rank
    test is shown as a variant (with 5 pairs it cannot reach p < 0.05). Supplementary Fig. 19c gives
    for the same R against RR slope x max panel "Mean - slope - R = 1.00, RR = 1.01", which differs
    from the 1.23 of the text; both are reported, and the claim is judged against 1.23. The early
    against late RR return (Figure 5h) is shown, not judged; the paper does not say how laps are
    split.
