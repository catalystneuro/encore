    low laps (Fig. 1f , mean decoder R 2 [95% confidence intervals (CIs)] ... R = 0.95 [0.93 0.97], RE
    high = 0.90 [0.87 0.93], RE low = 0.65 [0.54 0.75]). ... The decoder accuracy somewhat recovered
