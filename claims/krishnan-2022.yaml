    exceeds S in at least 6 of the 7 axons and the maximum time bin of the mean lies before reward
    delivery (both fixed here, for the ramp the paper shows in a figure only), and RE low is below R
    in E by the paper's test at p < 0.01. The other position and RE high tests are shown. Needs the
    axon imaging, which the dandiset description does not mention.
- id: fig5k-ramp-slope-max
  statement: DA axon ramps (slope x max, normalised to R) are smaller in RE high laps (0.57) and
    nearly vanish in RE low laps (0.24); slope alone is R 1.00, RE high 0.69, RE low 0.35 and max
    alone 1.00, 0.79, 0.53.
  source: Results, VTA inputs to CA1 encode reward expectation through a proximity to reward signal,
    paragraph 2; Figure 5j, k; Supplementary Fig. 19
  quote: 'DA-axon-ramps were on average smaller in UR compared to R during RE High laps but disappeared
    in RE low laps (Fig. 5k ; n = 7, Mean [95%CI]: Slope*max: R = 1.00 [1.00, 1.00], RE High = 0.57
    [0.40, 0.74], RE low = 0.24 [0.03, 0.45])'
  statistics:
  - about: slope x max, RE high
    ci:
      level: 0.95
      low: 0.40
      high: 0.74
    n: 7 axons
  - about: slope x max, RE low
    ci:
      level: 0.95
      low: 0.03
      high: 0.45
    n: 7 axons
  expected:
  - quantity: slope x max, RE high
    value: 0.57
    tolerance: 0.17
  - quantity: slope x max, RE low
    value: 0.24
    tolerance: 0.21
  - quantity: slope, RE high
    value: 0.69
    tolerance: 0.069
  - quantity: slope, RE low
    value: 0.35
    tolerance: 0.035
  - quantity: max, RE high
    value: 0.79
    tolerance: 0.079
  - quantity: max, RE low
    value: 0.53
    tolerance: 0.053
  criterion: Per lap, from the time-binned data - max = the maximum bin, divided by the mouse's mean
    R max; slope = slope of a linear fit (MATLAB fitlm) between the minimum within the first 25 bins
    and the maximum within the last 15 bins (in other conditions the search range is limited to
    the bins where they fell in R), divided by the mean R slope; slope x max divided by its R mean
    (Methods; find_slope.m). Per axon mean per condition. RE high and RE low by the lick stop
    readings L1 to L3; the code (VTA_ramping_analysis.m) instead hard-codes frame ranges per mouse,
    which is shown as a variant if the frames can be located. Reproduced when, under one reading,
    the slope x max values are within tolerance and RE low is below R by a two-sided paired t-test
    over the 7 axons at p < 0.05 with Bonferroni correction (Supplementary Fig. 19 legend).
