- id: supp13-novel-environment
  statement: In a novel, never reinforced environment, decoding and place field reliability and out/in
    ratio are poor in early laps and improve over the session as mice develop reward expectation,
    becoming comparable to R and RR; RE low reliability and out/in ratio match the early novel laps.
  source: Results, Place fields show diminished reliability, paragraph 2; Supplementary Fig. 13
  quote: We found that the spatial decoding and place cell parameters were poor in the initial laps of
    the novel environment, however, with time, as the animal learned the environment and developed
    reward expectation (Supplementary Fig. 13B ), these properties became better and comparable to
    properties in R and RR
  criterion: The 6 mice with a novel rewarded session. Early = first 12 laps, late = last 12 laps
    (Supplementary Fig. 13b). Decoders trained and tested within each condition with the sliding
    cross-validation of the Methods (test 20% of laps, train on 80%, slide by one lap), each
    condition down-sampled to the fewest laps. Reproduced when in the novel session late laps have
    higher pre-licking, decoder R2 and reliability and lower out/in ratio than early laps, each by a
    two-sided paired t-test over the 6 mice at p < 0.05 (legend); partially reproduced when 2 or 3
    of the 4 hold. How place field parameters are computed for 12-lap blocks (fields defined in the
    block, or fields defined over the session and measured in the block) is not said; both are run.
