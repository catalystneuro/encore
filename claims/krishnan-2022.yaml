    the 3 mice. The within-R value comes from the control mice, first against second half of a
    rewarded session (Methods, Spatial correlation with Rewarded condition); the Figure 2c legend
    calls it "within R condition" and the test "paired", which a comparison with other mice cannot
    be. Readings - (S1) within-R from the control mice, compared with R against RE low by a
    two-sided unpaired t-test (Mann-Whitney U when not normal); (S2) within-R from the first against
    second half of R laps in the same 3 mice, compared by a two-sided paired t-test over the 605
    cells. S1 and S2 are what the measure is compared with, so both are run and must agree.
    Reproduced when R against RE low is lower than within R at p < 0.05 and R against RR lies
    between them, higher than R against RE low at p < 0.05 by a paired t-test over the 605 cells.
