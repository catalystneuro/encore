- id: supp20-novel-axons
  statement: In a novel environment DA axon activity has much lower peaks and is locked to reward
    delivery instead of ramping; peaks grow and ramps begin to develop late in the session (5 axons,
    5 mice).
  source: Results, VTA inputs to CA1 encode reward expectation through a proximity to reward signal,
    paragraph 3; Supplementary Fig. 20
  quote: We found DA axon activity had much lower peaks in N and were much more locked to reward
    delivery ... However, activity peaks increased with experience in N and DA-axon-ramps started to develop towards the end
    of the session
  criterion: Time and position binning as in fig5-da-axon-ramps, for the 5 axons with a novel session.
    The paper gives no test or split; early and late are read as the first and second halves of the
    novel laps. Reproduced when the mean peak in the novel session is below R, the time bin of the
    peak is at or after reward delivery in the early half, and the late half has a higher peak and a
    positive slope (as in fig5k-ramp-slope-max) than the early half, in at least 4 of the 5 axons.
    The halves and the 4 of 5 rule are fixed here.
  depends_on:
  - fig5-da-axon-ramps
- id: supp21-heterogeneous-axons
  statement: Two axons do not ramp to reward; one encodes running velocity and is insensitive to the
    R to UR switch, the other decreases its activity in VR compared with darkness.
  source: Results, VTA inputs to CA1 encode reward expectation through a proximity to reward signal,
    paragraph 4; Supplementary Fig. 21
  quote: We found two axons with distinct types of signals that did not ramp to reward (Supplementary
    Fig. 21 ). One of these encoded the animal's velocity and was not sensitive to the R-UR transition
  criterion: Velocity encoding as in the Methods - motion epochs with velocity >= 1 cm/s for at least
    1 s, aligned to motion onset, dF/F and velocity from 2 s before to 8 s after, velocity normalised
    to the epoch maximum. Reproduced when the velocity axon's mean dF/F follows velocity (Pearson r of
    the mean traces above 0.5, a threshold fixed here) in both R and RE low, and the second axon has
    lower mean dF/F in VR than in the dark. Needs the axon imaging.
