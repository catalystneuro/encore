# Claims for Johnson, King-Stephens, Weber, Laxer, Lin & Knight (2019), Front. Syst. Neurosci. 12,
# 65, "Spectral Imprints of Working Memory for Everyday Associations in the Frontoparietal Network",
# doi:10.3389/fnsys.2018.00065, on CRCNS data set fcx-3 (doi:10.6080/K06971S9).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-08,
# protocol as stated in docs/protocol.md (Reader), version pilot-13.
#
# Text read: the version of record, PMC6333050 (open access), full text from Europe PMC JATS XML as
# supplied under paper/: Introduction, Materials and Methods, Results, Discussion, Table 1 and the
# legends of Figures 1 to 5. The paper has no supplement. No PDF was supplied, so values shown only
# inside figures (per-subject accuracy and RT of Fig. 1B, per-subject PSI of Fig. 4A and 4C, the
# time courses of Fig. 5) were not read; claims on those figures rest on the Results and legends.
# The CRCNS data descriptor was read only to know which experiments the data set holds; no claim or
# method comes from it.
#
# Code. The paper's Data Availability says its custom MATLAB code is deposited at CRCNS with the
# data. By the data descriptor it is the analysis_scripts directory of data set fcx-3 itself. It is
# one of the data set's files, which this reader does not open, so it was not read and no commit is
# recorded. Every method below is from the paper's text. Where the scripts settle a detail named as
# open below, the author may follow them (protocol, Reader step 2) and should say so.
#
# Data the paper used. Seven adults with epilepsy (25.4 +- 3.3 years, four males) with intracranial
# electrodes (subdural and/or stereotactic) over lateral prefrontal (PFC) and parietal cortex, from
# UC Irvine (three), CPMC (two), UCSF (one) and Oslo (one; sampled at 512 Hz, the others at or
# resampled to 1 kHz). One session each of a visuospatial working memory task, 120 trials split
# evenly between identity, spatial and temporal conditions. Trial phases: 1 s pretrial fixation,
# 800 ms start screen (IDENTITY or RELATION), 100 ms fixation, two shapes of 200 ms each, 900 or
# 1150 ms pre-cue delay (maintenance), 800 ms test cue (SAME, TOP/BOTTOM or FIRST/SECOND), post-cue
# delay of the same length (processing), two-alternative forced choice. Measured: accuracy and RT
# per trial; iEEG on 192 bipolar virtual electrodes (Table 1: per subject PFC/parietal 21/2, 24/8,
# 54/14, 12/10, 10/16, 8/4, 4/5), 1129 same-hemisphere PFC-parietal pairs. Analysis segments,
# correct trials only: 200 ms pretrial baseline (-250 to -50 ms before the start screen), 900 ms
# maintenance from the offset of the second stimulus, 900 ms processing from the offset of the test
# cue. The data descriptor says fcx-3 holds, for the 7 subjects, the filtered continuous iEEG with
# per-trial event tables (accuracy, condition, jitter, RT, epoch starts), the preprocessed bipolar
# epochs (pre, encmain, proc), channel MNI coordinates and the analysis scripts.
#
# Shared method details, used by the criteria below.
# B1. Behavior (Methods, Behavioral Task, paragraph 3). Accuracy in a logit and correct-trial RT in a
#   linear mixed-effects model, condition fixed, subject random; post hoc pairs only after a
#   significant omnibus. The unit of observation is not stated. The reported degrees of freedom,
#   F(1,19) for three conditions and F(1,12) for pairs, equal 7 x 3 - 2 and 7 x 2 - 2, so the RT
#   models were fit to one value per subject and condition with condition as a single-df term and
#   residual degrees of freedom (as MATLAB fitlme does by default); this is reading (a). Reading (b)
#   fits single trials. For accuracy, reading (a) is the logit model on single correct/incorrect
#   trials, (b) on per-subject proportions. Whether accuracy is over all 120 trials or over the
#   trials kept after artifact rejection is not stated; readings (a) all trials, (b) kept trials.
#   How Cohen's d was computed is not stated; d is reported, not judged.
# S1. Power (Methods, Spectral Decomposition). Correct trials; time-frequency power 2 to 40 Hz in
#   1-Hz steps, Hanning-tapered windows of 3 cycles (3/f s), stepped by 10 ms, segments zero-padded
#   to 7500 ms. How windows longer than the 900 ms segment (below about 3.3 Hz) are formed is open;
#   readings (a) the segment is embedded in zeros and every window is computed, (b) FieldTrip-style
#   padding where windows that leave the data are not estimated. The paper reports effects from
#   2 Hz, which only (a) yields; (a) is the main reading. Baseline: the 200 ms pretrial power of all
#   correct trials pooled per channel and frequency; r points (r = the subject's number of trials)
#   drawn and averaged 1000 times; each trial's processing power z-scored on the mean and SD of
#   these 1000 averages. Whether r counts all correct trials or the trials of the condition is
#   open; reading (a) all correct trials.
# S2. Per-subject cluster test (Methods, Event-Related Potentials, paragraph 2, and Spectral
#   Decomposition, paragraph 3). Identity against spatial, and identity against temporal, correct
#   trials; independent-samples t-test per point, threshold 0.05 two-tailed; cluster mass is the sum
#   of t; 1000 shuffles of condition labels; a cluster is significant when fewer than 5% of
#   shuffles give a larger one. Clustering over electrode, time and frequency (power) or electrode
#   and time (ERP). Which electrodes are neighbours is not stated ("neighboring electrodes");
#   readings (a) bipolar channels adjacent on the same strip, grid or shaft, (b) channels within
#   the 4 to 10 mm contact spacing in the subject's coordinates, (c) no spatial clustering. Whether
#   the 5% is applied per tail or split between tails is not stated; readings (a) 0.05 per tail,
#   (b) 0.025 per tail. An electrode shows an effect of a sign when any of its points lies in a
#   significant cluster of that sign; its percentage is over all of the subject's analysed
#   electrodes, averaged (mean +- SD) over the subjects showing that effect. The paper does not
#   say how an electrode is assigned an effect; the rule above is reading (a), under which an
#   electrode in clusters of both signs counts for both. Figures 2A and 3A give each electrode one
#   colour, which allows reading (b), such an electrode counted for the sign with the larger
#   summed t over its significant points.
# P1. Phase slope index (Methods, Directional Connectivity, Task-Induced PSI). Correct trials; "the
#   raw trial-wise mean" is subtracted from each trial (readings (a) the mean over all correct
#   trials, (b) the mean over the trials of the condition, (c) each segment's own temporal mean);
#   PFC-parietal pairs in the same hemisphere;
#   positive PSI means PFC leads. Spectra "using the same parameters described above, but over the
#   full delay interval"; readings (a) one Hanning-tapered FFT of each 900 ms segment, zero-padded
#   to 7500 ms, read at 1-Hz steps, (b) the 3-cycle windows of S1 averaged over time. PSI per band,
#   delta-theta 2 to 7 Hz and alpha-beta 9 to 24 Hz; readings (a) one PSI from the cross-spectra
#   over all 1-Hz bins of the band (Nolte et al. 2008), (b) PSI per frequency with a 2-Hz
#   bandwidth, averaged over the band. Null: the frequencies of one signal shuffled and PSI
#   recomputed 1000 times; PSI z-scored on the null mean and SD. Whether one permutation serves all
#   trials or each trial gets its own is open; readings (a) one per shuffle, (b) one per trial.
#   PFC leads at z > 1.96, parietal leads at z < -1.96. Whether PSI is computed once per pair from
#   cross-spectra averaged over trials or per trial is not stated; readings (a) cross-spectra
#   averaged over trials, one PSI z per pair (Nolte et al. 2008, and one value per pair and
#   interval fits F(1,2256)), (b) PSI z per trial, averaged over trials per pair (Figure 4A legend,
#   "mean +- SEM per subject across all trials").
# P2. Group models. Task-induced PSI z per pair and interval in a linear mixed-effects model with
#   interval fixed and subject and pair random (Methods, Task-Induced PSI, paragraph 3);
#   F(1,2256) equals 2 x 1129 - 2, residual degrees of freedom. Time-resolved PSI (Methods,
#   Time-Resolved PSI): recomputed at 10-ms steps per condition on the pairs with |z| > 1.96 over
#   the whole processing interval (all conditions), z-scored per time point; at each time point a
#   model with condition fixed and subject and pair random; FDR 0.05 over time points (read as
#   Benjamini-Hochberg over the time points of the 900 ms interval, a standard choice); an effect
#   is sustained when significant time points run for at least 100 ms. Per-subject values are the
#   mean z over the subject's pairs; group values are mean +- SEM (figures) or mean +- SD (text)
#   over subjects.
# T1. Tolerances. 10% of the reported value unless a claim says otherwise. A mean +- SD in the text
#   is a spread over subjects, not an uncertainty of the mean, and is not used as a tolerance. A
#   value printed as a bound ("z < -40.03") also matches when the result lies beyond the bound.
