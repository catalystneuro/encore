  criterion: The alignment cells of fig5-class-proportions; aligned light-on and light-off
    tuning curves (light-on shifts applied to both, Methods). The paper gives no test; the
    paper's test for angles clustered at a value is the V-test (Methods), which is used. Per
    cell, the offset of the light-off peak bin from the nearer of the two light-on peaks (the
    peak bin and the peak bin of the other half circle), wrapped to +-180; circ_vtest against 0.
    Reproduced when p < 0.05 with V > 0; the share of cells with an offset within 18 degrees is
    reported.
- id: fig5f-heading-flip-unchanged
  statement: Heading cells show no significant difference in flip score between light-on and
    light-off conditions.
  source: Results, A functional class of RSC neurons coregisters visual and heading signals,
    paragraph 3; Figure 5F
  quote: Heading cells showed no significant difference in flip score across conditions (F1,662 =
    0.18, p = 0.67
  statistics:
  - test: F-test (mixed-effects model)
    statistic: F(1,662) = 0.18
    p: 0.67
    n: heading cells (332, from the degrees of freedom)
  depends_on:
  - fig5-class-proportions
  criterion: A claim of absence. Flip score (Methods, eq. 5; code Cue.calculateFlipScore) of each
    heading cell's light-on and light-off tuning curve. The paper's test is an F-test on the
    light condition in a (generalized) linear mixed-effects model with mouse as random effect
    (Methods, Statistical information, mixed models control for cells within the same animal;
    the residual df 2n - 2 fit one fixed effect and an intercept), run as fitlme-style flip ~
    light + (1|mouse). Reproduced when p >= 0.05; not reproduced when p < 0.05. The difference
    in mean flip score is reported either way, and a model with a random intercept per cell as
    well is shown as a variant.
- id: fig5gh-landmark-alignment-flip-drop
  statement: Landmark and alignment cells have significantly lower flip scores in light-off
    than in light-on (landmark F(1,1042) = 1062.5, p = 3.1e-161; alignment F(1,816) = 209.5,
    p = 2.0e-42).
  source: Results, A functional class of RSC neurons coregisters visual and heading signals,
    paragraph 3; Figure 5G, H
  quote: both landmark (F1,1042 = 1062.5, p = 3.1 × 10−161) and alignment (F1,816 = 209.5, p =
    2.0 × 10−42) cells have significantly lower flip scores in the light-off than the light-on
    condition
  statistics:
  - about: landmark cells, light-off against light-on flip score
    test: F-test (mixed-effects model)
    statistic: F(1,1042) = 1062.5
    p: 3.1e-161
    n: landmark cells (522, from the degrees of freedom)
  - about: alignment cells, light-off against light-on flip score
    test: F-test (mixed-effects model)
    statistic: F(1,816) = 209.5
    p: 2.0e-42
    n: alignment cells (409, from the degrees of freedom)
  depends_on:
  - fig5-class-proportions
  criterion: As fig5f-heading-flip-unchanged, for landmark and for alignment cells. Reproduced
