# Claims for Sit & Goard (2023), Nature Communications 14:1992, on dandiset 000483.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record (publisher's PDF supplied by a person, extracted to text):
# main text, figure legends, Methods and Statistical information. The Supplementary Information
# (Figures S1 to S7 and Table S1) was not in the paper store and was not read. The main
# findings and their statistics are all stated in the main text; the supplement holds the
# detail of three of them (Figure S5, Figure S6 and Table S1), and the claims that rest on it
# say so. The figures could not be opened (no PDF renderer), so no number below is read from a
# figure.
#
# Code read: the repository the paper links, given there as
# github.com/ucsb-goard-lab/Neurotar-HDExperiments; the repository is in fact
# github.com/ucsb-goard-lab/Neurotar-HD-Experiments, commit c6344f5 (2023-03-14). It holds
# MATLAB classes, not figure scripts: Cue.m (tuning curves, preferred direction, flip score,
# Gaussian fits), ControlledRotation.m (trial segmentation and the heading-selection test),
# FreelyMoving.m (the Rayleigh-vector test), LightDarkExperiment.m and its subclasses (light and
# dark segmentation), Separator.m, and _ReviewerCode/reviewer_reclassify_attempt.m (a GMM
# clustering run). No code for the V-tests, the coherent-remapping offsets, the flip-score
# F-tests, the LDA, the decoding or the statistics is in it. The lab's HeadingDecoder
# repository (github.com/ucsb-goard-lab/HeadingDecoder, commit ca9842e, 2022-07-14), whose
# README says it is part of this paper's analyses, is not linked by the paper; it was read and
# is used only as a named variant ("other software" in the protocol's order). The helper
# leaveOneOutAligner it and the reviewer code call is not in kevinksit/GeneralHelperCode
# (commit 8ccc95c) and was not found.
#
# Data the paper used (as reported). 26 mice (12 male, 14 female), 6 to 12 weeks old at
# surgery. Somata: Emx1-Cre x ROSA-LNL-tTA x TITL-GCaMP6s or Slc17a7-IRES2-Cre x
# TITL2-GC6s-ICL-TTA2 mice expressing GCaMP6s. Axons: AAV GCaMP7b in ADN or in AM/PM (the
# Results say wild-type mice, the Methods say AAV-Syn-Flex-jGCaMP7b in Emx1-Cre mice). Two-photon
# imaging of posterior dysgranular RSC at 10 Hz, head-fixed in an air-floated chamber (Neurotar
# Mobile HomeCage) that reports chamber position, angle (heading) and speed.
#   - Free chamber, single cue, mouse-driven: 4 recordings over 3 mice, 2665 neurons (Fig. 1D, E).
#   - Motor-rotated chamber, single cue (3 to 7 rpm, 90 to 120 s rotations with 5 s rests,
#     2 to 6 repeats): 16 recordings over 5 mice, 3179 neurons (Fig. 1G, H).
#   - Head rotation (2 rpm, chamber fixed) against chamber rotation, same field: 5 recordings
#     over 4 mice, with ROIs matched across the two (Fig. 2).
#   - Remapping: chamber in four quadrants of cues, all replaced in darkness between two
#     recordings (contexts A and B): 12 recordings over 4 mice (Fig. 3).
#   - Dual symmetric cues (A-B-A-B), light-on and light-off repeats: ADN axons 17 recordings
#     over 4 mice, AM/PM axons 7 recordings over 3 mice (Fig. 4); RSC somata 36 recordings over
#     6 mice (Figs. 5, 6); rotation in both directions 4 recordings over 2 mice (Fig. S5);
#     animal-controlled against motor-controlled arena 7 recordings over 3 mice (Fig. S6);
#     standard rotation against visual-cue-only rotation (a false floor that does not turn),
#     number of recordings not given (Fig. 5J, K).
# Measured variables: fluorescence of somata or axon ROIs, dF/F, inferred spikes (OASIS, AR(1),
# on dF/F), chamber heading, position and speed, light condition.
# The dandiset's description says it holds all the accompanying data of the paper. The paper
# also deposited processed data on Dryad (doi:10.25349/D91G8Q) and Source Data with the
# article; no claim needs them, but the author may use them to check the link.
#
# Methods shared by the claims, with their sources. "Methods" is the paper's Methods section;
# "code" is Neurotar-HD-Experiments at c6344f5.
#   - Activity: inferred spikes from OASIS with an AR(1) kernel on dF/F (Methods, Analysis of
#     calcium data); dF/F = (F - F0)/F0 with F0 the mode of the neuropil-corrected fluorescence
#     (Methods, eq. 2). If the dataset holds no inferred spikes, the deconvolution's other
#     parameters are open; the call left commented in Cue.m is deconvolveCa(dff, 'ar1',
#     'foopsi', 'optimize_pars'), which is the reading to use.
#   - Tuning curve: heading in 60 bins of 6 degrees, mean activity per bin, then a 15 degree
#     moving average (Methods; code Cue.binData, movmean over 15/6 bins); per trial, then
#     averaged over trials (Methods).
#   - Trials (rotation experiments): one full rotation of the chamber (Methods). Code
#     (ControlledRotation.getTrialResponses): heading glitches (steps of 20 to 350 degrees)
#     replaced by the previous value; breaks at wraps of heading and at rests (more than 20
#     consecutive frames with a change under 0.5 degree); segments under 50 frames dropped, and
#     segments whose 25th or 75th heading percentile lies more than 50 degrees from +-90 dropped.
#   - Light and dark segments (dual-cue experiments; the code hard-codes them as there were no
#     stimulus files): somata, 1950-frame recordings are one repeat of 950-frame segments,
#     7550-frame recordings three repeats and 15050-frame recordings six repeats of 1250-frame
#     segments; axons, three repeats of 1250 frames. Each repeat is a light segment then a dark
#     segment (Separator.m; Methods, the first repeat is always light-on).
#   - Heading selection, rotation experiments (Methods; code ControlledRotation
#     .calculateHeadDirection): 1000 iterations; in each, the trials are split at random into two
#     halves and the correlation of the two half-mean tuning curves is taken, for the real
#     trials and for trials each circularly shifted by an independent random amount (same
#     split); the two sets of 1000 correlations are compared by a two-sample KS test (p < 0.1)
#     and Cohen's d (> 0.8, pooled SD); a Gaussian (one term for a single cue, two terms for
#     dual cues) is fitted to the min-max rescaled trial-mean tuning curve and to the shuffled
#     trial means, and the real r2 must exceed the 90th percentile of the shuffled r2. The code
#     also requires the fitted amplitude a1 > 0 and fits with its bounds (single: a0 and a1 in
#     [0, 1], b1 in pi/2 +- pi/6, c1 in [0, pi/2]; double: a0 in [0, 0.2], a1, a2 in [0, 1], b1 in
#     pi/2 +- pi/24, b2 in 3pi/2 +- pi/24, c in [0, 2pi]; x from 0 to 2pi over the 60 bins);
#     these are followed. For dual-cue recordings the code's default runs the test on all
#     trials, light and dark together, and the reviewer code calls it so; that is followed.
#   - Cross-validated alignment (Methods): for each trial, the peak bin of the mean of the other
#     trials sets that trial's circular shift; for light/dark data the shifts come from light-on
#     trials and are applied to light-off trials. The target position of the peak is not in the
#     Methods; the code's Gaussian bounds (b1 near pi/2) and its shift point of bin 15 imply the
#     peak is put at bin 15 (90 degrees on a 0 to 360 axis), which is followed.
#   - Flip score (Methods, eq. 5; code Cue.calculateFlipScore): circular autocorrelation of the
#     tuning curve (smoothed with MATLAB smoothdata defaults), CC at 180 degrees minus the mean
#     of CC at 90 and 270 degrees.
#   - V-test: circ_vtest of the Circular Statistics Toolbox against 0 degrees (Methods,
#     Statistical information). The subscript of V in the paper (V32, V66) is read as n:
#     with u = V sqrt(2/n), V32 = 14.1 gives p = 2.1e-4 and V66 = 25.6 gives p = 4.2e-6, near the
#     printed 2.5e-4 and 4.9e-6.
#   - Decoding (Methods, Decoding RSC somatic activity): trials are the full rotations before
#     and after each rest that separates light-on from light-off (and light-off from light-on);
#     each trial resampled to 200 bins; trials aligned across recordings into pseudopopulations;
#     Bayesian decoding (Etter et al. 2020) of "the raw calcium data", trained on even and tested
#     on odd timepoints; 1000 bootstrap iterations, each sampling with replacement 332 neurons
#     (the smallest class) from the class decoded, or from all three classes in their rough
#     proportions for "all tuned cells"; decoder error |decoded - actual| per frame; decoder
#     accuracy per trial the fraction of frames with error under 18 degrees; mean and 2.5 and
#     97.5 percentiles over iterations; p of a light-on against light-off comparison is one minus
#     the fraction of iterations in which a t-test passes at alpha 0.05 (Statistical
#     information; decoding error across recordings is compared by paired t-tests). Open, with
#     readings: the decoder input, (a) dF/F ("raw calcium data", Methods) or (b) inferred spikes
#     (HeadingDecoder); the decoder, (a) the naive Bayes decoder of Etter et al. 2020 on
#     binarized activity, with 60 heading states of 6 degrees, or (b) HeadingDecoder's (activity
#     times row-rescaled leave-one-trial-out tuning curves, normalized, filtered over 10 samples,
#     maximum taken; 180 resample bins; up to 15 trials each side of the transition); the
#     t-test, (a) paired over trials or (b) unpaired; chance, (a) 0.18 (Methods) or (b) 0.10
#     (Figure 6A legend, which equals 36/360 and HeadingDecoder's 18/180). The Methods come first;
#     every reading is run.
