- id: fig5-three-classes
  statement: Clustering the Gaussian-fit coefficients of RSC somatic tuning curves in light-on
    and light-off conditions gives an optimum of three functional classes (heading, landmark and
    alignment cells), though the responses span a continuum.
  source: Results, A functional class of RSC neurons coregisters visual and heading signals,
    paragraph 1; Figure 5B; Methods, Clustering of RSC soma responses
  quote: We found that the data were optimally clustered into three functional classes ...
    although we note that the responses span a continuum
  criterion: The 36 dual-cue RSC soma recordings over 6 mice; heading-selective cells only (two-
    term Gaussian test of the opening comment), as the reviewer code clusters is_head_direction
    cells and the Results speak of tuned cells. For each cell, the light-on and light-off
