- id: fig5i-axons-in-clusters
  statement: Projected into the soma clusters' discriminant space, ADN axons fall mostly within
    the heading cluster and visual axons mostly within the landmark cluster, with some overlap
    with the alignment cluster.
  source: Results, A functional class of RSC neurons coregisters visual and heading signals,
    paragraph 4; Figure 5I
  quote: finding that ADN axons and visual axons are mostly restricted to the boundaries of the
    heading and landmark clusters, respectively (Fig. 5I), although there is some overlap with
    the alignment cluster boundary
  depends_on:
  - fig5-class-proportions
  - fig4-axons-light-on-shape
  criterion: An LDA model trained on the soma features and their GMM classes (Methods,
    Clustering of RSC soma responses) projects the axon features (same Gaussian fits, Methods,
    Clustering of axonal responses) onto its first two discriminants; each soma class has a 95%
    ellipse (Methods; read as the 95% region of a bivariate normal fitted to the class's
    points). Axons as in fig4-axons-light-on-shape, readings (a) and (b). "Mostly" is read as
    more than half. Reproduced when, under a reading, more than half of ADN axons lie inside the
    heading ellipse and more than half of visual axons inside the landmark ellipse; partially
    reproduced when only one holds. The shares inside the alignment ellipse are reported.
- id: fig5k-visual-cue-only
  statement: When only the visual cues rotate (no proprioceptive or somatosensory input), the
    visual contributions to tuning are retained, but heading-cell responses are strongly
    degraded.
  source: Results, A functional class of RSC neurons coregisters visual and heading signals,
    paragraph 4; Figure 5J, K
  quote: We found that the visual contributions to tuning were retained in visual cue only
    rotation, but the loss of proprioceptive and somatosensory information strongly degraded
    the heading cell responses
  depends_on:
  - fig5-class-proportions
  criterion: Neurons matched between a standard-rotation and a visual-cue-only recording (Figure
    5K legend), classed in the standard recording. The paper gives neither the number of
    recordings nor a measure or test. Readings, (a) the fraction of cells of each class that
    pass the heading-selection test in the visual-only recording; (b) the peak-to-trough range of
    the class's mean aligned light-on tuning curve (light-on shifts from the standard recording)
    in visual-only relative to standard rotation. Reproduced when, under a reading, landmark
    cells keep a bimodal light-on curve in visual-only rotation (flip score of the class mean
    above 0) and heading cells lose more than landmark cells (lower fraction or lower relative
    range). Blocked if the dataset holds no visual-cue-only recordings.
- id: fig6a-population-light-on
  statement: Decoding heading from all tuned RSC cells within single 100 ms frames is accurate in
    the light-on condition despite the symmetric cues (mean decoder accuracy 0.82, 95% CI 0.78
    to 0.86).
  source: Results, Contributions of distinct classes to representation of heading, paragraph 1;
    Figure 6A
  quote: When sampling across all the classes, the heading network shows remarkable accuracy,
    even in the presence of symmetric visual cues (mean decoder accuracy = 0.82, 95% CI = [0.78,
    0.86]
  statistics:
  - test: bootstrap confidence interval
    ci:
      level: 0.95
      low: 0.78
      high: 0.86
    n: 1000 bootstrap samples of 332 neurons
  expected:
  - quantity: mean decoder accuracy, all tuned cells, light-on
    value: 0.82
    tolerance: 0.04
  depends_on:
  - fig5-class-proportions
  criterion: The decoding method of the opening comment, sampling from all three classes.
    Tolerance is the half-width of the paper's 95% CI. Reproduced when a reading of the decoder
    gives a mean within tolerance; every reading is reported.
- id: fig6a-population-light-off
  statement: In the light-off condition the decoder's accuracy from all tuned cells drops (mean
    0.44, 95% CI 0.34 to 0.54; p = 7.6e-3 against light-on) but stays above chance.
  source: Results, Contributions of distinct classes to representation of heading, paragraph 1;
    Figure 6A, bottom
  quote: When transitioning from light-on to light-off, there is a drop in the performance of
    the decoder, although the performance remains above chance ... (mean decoder accuracy =
    0.44, 95% CI = [0.34, 0.54], p = 7.6 × 10−3
  statistics:
  - test: bootstrapped t-test
    p: 7.6e-3
    n: 1000 bootstrapped samples
  - test: bootstrap confidence interval
    ci:
      level: 0.95
      low: 0.34
      high: 0.54
  expected:
  - quantity: mean decoder accuracy, all tuned cells, light-off
    value: 0.44
    tolerance: 0.1
  depends_on:
  - fig6a-population-light-on
  criterion: As fig6a-population-light-on, light-off trials. Above chance means the 95% interval
    excludes chance (Methods), under either chance reading (0.18 or 0.10). Reproduced when, under
    a decoder reading, the mean is within tolerance, the interval excludes chance and the
    bootstrapped t-test of light-on against light-off gives p < 0.05 with light-off lower.
- id: fig6b-heading-cells
  statement: Heading cells alone decode heading accurately in both light-on (0.61, 95% CI 0.56 to
    0.66) and light-off (0.44, 95% CI 0.36 to 0.52) conditions, with no significant difference
    between them (p = 0.11).
  source: Results, Contributions of distinct classes to representation of heading, paragraph 2;
    Figure 6B, top
  quote: We found that heading cells were able to accurately decode in both light-on (mean
    decoder accuracy = 0.61, 95% CI = [0.56, 0.66]) and light-off conditions (mean decoder
    accuracy = 0.44, 95% CI = [0.36, 0.52]), suggesting that they contribute to the heading
    signal in both conditions (p = 0.11
  statistics:
  - test: bootstrapped t-test
    p: 0.11
    n: 1000 bootstrapped samples
  - about: light-on accuracy
    test: bootstrap confidence interval
    ci:
      level: 0.95
      low: 0.56
      high: 0.66
  - about: light-off accuracy
    test: bootstrap confidence interval
    ci:
      level: 0.95
      low: 0.36
      high: 0.52
  expected:
  - quantity: mean decoder accuracy, heading cells, light-on
    value: 0.61
    tolerance: 0.05
  - quantity: mean decoder accuracy, heading cells, light-off
    value: 0.44
    tolerance: 0.08
  depends_on:
  - fig5-class-proportions
  criterion: The decoding method of the opening comment on heading cells only. The values are
    judged under each decoder reading; reproduced when a reading puts both within tolerance and
    both intervals exclude chance. The absence of a light difference is judged on the paper's
    bootstrapped t-test alone, not significant when p >= 0.05; the claim is not reproduced if p
    < 0.05 under the reading that matches the values.
- id: fig6b-landmark-cells
  statement: Landmark cells decode heading very well in light-on (0.80, 95% CI 0.75 to 0.84) but
    fall to chance in light-off (0.20, 95% CI 0.14 to 0.27; p = 8.0e-4).
  source: Results, Contributions of distinct classes to representation of heading, paragraph 2;
    Figure 6B, middle
  quote: landmark cells have very high decoder performance in the light-on condition (mean
    decoder accuracy = 0.80, 95% CI = [0.75, 0.84]), with an overrepresentation of decoder
    errors at 180°, which immediately plummets to chance levels in the light-off condition (mean
    decoder accuracy = 0.20, 95% CI = [0.14, 0.27]; p = 8.0 × 10−4
  statistics:
  - test: bootstrapped t-test
    p: 8.0e-4
    n: 1000 bootstrapped samples
  - about: light-on accuracy
    test: bootstrap confidence interval
    ci:
      level: 0.95
      low: 0.75
      high: 0.84
  - about: light-off accuracy
    test: bootstrap confidence interval
    ci:
      level: 0.95
      low: 0.14
      high: 0.27
  expected:
  - quantity: mean decoder accuracy, landmark cells, light-on
    value: 0.80
    tolerance: 0.05
  - quantity: mean decoder accuracy, landmark cells, light-off
    value: 0.20
    tolerance: 0.07
  depends_on:
  - fig5-class-proportions
  criterion: The decoding method on landmark cells only; tolerances from the paper's intervals
    (the larger half-width). Reproduced when, under a decoder reading, both means are within
    tolerance, the light-on against light-off p < 0.05, and the light-off interval includes
    chance. Under the 0.10 chance reading the paper's own light-off interval excludes chance;
    the outcome under each chance reading is reported.
- id: fig6b-alignment-cells
  statement: Alignment cells decode between heading and landmark cells, better in light-on (0.71,
    95% CI 0.66 to 0.76) and fairly accurately in light-off (0.51, 95% CI 0.43 to 0.59), with no
    significant difference (p = 0.54).
  source: Results, Contributions of distinct classes to representation of heading, paragraph 2;
    Figure 6B, bottom
  quote: alignment cells show decoder performance that is between that of heading and landmark
    cells, taking advantage of improved decoding from the visual cues in the light-on condition
    (mean decoder accuracy = 0.71, 95% CI = [0.66, 0.76]), but retaining fairly accurate heading
    in the light-off condition (mean decoder accuracy = 0.51, 95% CI = [0.43, 0.59], p = 0.54
  statistics:
  - test: bootstrapped t-test
    p: 0.54
    n: 1000 bootstrapped samples
  - about: light-on accuracy
    test: bootstrap confidence interval
    ci:
      level: 0.95
      low: 0.66
      high: 0.76
  - about: light-off accuracy
    test: bootstrap confidence interval
    ci:
      level: 0.95
      low: 0.43
      high: 0.59
  expected:
  - quantity: mean decoder accuracy, alignment cells, light-on
    value: 0.71
    tolerance: 0.05
  - quantity: mean decoder accuracy, alignment cells, light-off
    value: 0.51
    tolerance: 0.08
  depends_on:
  - fig5-class-proportions
  criterion: The decoding method on alignment cells only. Reproduced when, under a decoder
    reading, both means are within tolerance, the light-on mean lies between those of heading
    and landmark cells, and the light-off interval excludes chance. The absence of a light
    difference is judged on the bootstrapped t-test alone (p >= 0.05); the claim is not
    reproduced if p < 0.05 under the reading that matches the values.
- id: fig6b-180-errors
  statement: Decoding from landmark cells in light-on gives an overrepresentation of 180 degree
    errors from the symmetric cues, while heading cells show no preponderance of 180 degree
    errors.
  source: Results, Contributions of distinct classes to representation of heading, paragraphs 1
    and 2; Figure 6B
  quote: As expected based on their tuning curves, heading cells did not exhibit a preponderance
    of 180° errors, suggesting they do not represent visual information directly
  depends_on:
  - fig6b-heading-cells
  - fig6b-landmark-cells
  criterion: Light-on decoder errors of the class decoders, under each decoder reading. The paper
    gives no measure; the measure is the share of frames with an absolute error within 18 degrees
    of 180 (the paper's accuracy window, moved to 180), against its share of 0.10 under uniform
    errors. Reproduced when that share exceeds 0.10 for landmark cells and is no more than 0.10
    for heading cells.
- id: fig6-heading-below-population
  statement: In light-on, heading cells alone decode worse than the whole tuned population, so
    alone they may not give an optimal representation of instantaneous heading.
  source: Results, Contributions of distinct classes to representation of heading, paragraph 2;
    Figure 6B, right (the text cites "Fig. 6C, right", but the class comparison is the right
    panel of Figure 6B by its legend); Table S1
  quote: Since their decoder performance is lower than the population in the light-on condition,
    heading cells alone may be insufficient for ... providing an optimal representation of
    instantaneous heading
  depends_on:
  - fig6a-population-light-on
  - fig6b-heading-cells
  criterion: Table S1, which holds the class comparisons (linear mixed-effects models, Figure 6
    legend), was not read (supplement missing), so the model is open. Readings, (a) the 95%
    bootstrap intervals of light-on accuracy for heading cells and for all tuned cells do not
    overlap; (b) a linear mixed-effects model of per-trial light-on decoder error with class
    (heading or total) as fixed effect and, as random intercept, (i) recording or (ii) mouse
    (Statistical information, mixed models control for cells within the same animal) gives
    p < 0.05 with heading cells worse. Reproduced when a reading holds under a decoder reading.
