- id: fig1-free-heading-fraction
  statement: In head-fixed mice moving a free floating chamber with a single cue, 14.0% of RSC
    neurons (373 of 2665) are heading selective, with no head movement.
  source: Results, Neurons in the RSC represent heading in the absence of physical head
    movements, paragraph 2; Figure 1D, E
  quote: revealing that a proportion of neurons in RSC faithfully represent heading (14.0%,
    373/2665 neurons
  expected:
  - quantity: percentage of heading-selective neurons, free chamber
    value: 14.0
    tolerance: 1.4
    unit: percent
  criterion: The 4 free-chamber recordings over 3 mice. Method from the Methods (Analysis of
    calcium data, paragraph 2) and code FreelyMoving.m. The Rayleigh vector length of each
    neuron's tuning curve (inferred spikes, 6 degree bins, 15 degree smoothing) is compared with
    1000 values from the spike data circularly shifted in time by a random amount; a neuron is
    selective when its RVL meets or exceeds the 99th percentile (Methods). The code keeps only
    frames with chamber speed above 2 (FreelyMoving.checkIsMoving), which the Methods do not
    mention; and its default threshold is the 95th percentile. Readings, run in turn, (a) all
    frames, 99th percentile; (b) moving frames only, 99th percentile; (c) the code's 95th
    percentile on moving frames, as a variant. Reproduced when (a) or (b) gives a percentage
    within tolerance; (c) is reported.
