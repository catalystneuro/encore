# Claims for Henze, Borhegyi, Csicsvari, Mamiya, Harris & Buzsaki (2000), J Neurophysiol 84:390-400,
# "Intracellular Features Predicted by Extracellular Recordings in the Hippocampus In Vivo",
# doi:10.1152/jn.2000.84.1.390, on CRCNS data set hc-1 (doi:10.6080/K02Z13FP).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-08,
# protocol as stated in docs/protocol.md (Reader), version pilot-13.
#
# Text read: the version of record, as supplied under paper/ (PyMuPDF text of the journal PDF):
# Introduction, Methods, Results, Discussion and the legends of Figures 1 to 8. The paper has no
# supplement and links no analysis code, so no code was read. The PDF could not be rendered here
# (no renderer installed), so values printed only inside figures were not read. The extracted
# text prints the signs =, <, >, plus/minus and "approximately" as a replacement character; they
# were read from the PDF's content streams, where they are glyphs of the Universal-GreekwithMathPi
# font ("5" is =, "6" is plus/minus, "," is <, "." is >, ";" is approx.) and of
# MathematicalPi-One ("#" is less or equal, "$" is greater or equal). So: start 0.01 +/- 0.02 (SD)
# ms and end 0.02 +/- 0.14 ms earlier; durations 1.28 +/- 0.18 and 1.27 +/- 0.19 ms; "R = 0.66,
# P < 0.03"; negative peak 0.20 +/- 0.08 ms before the intracellular peak; Fig. 4D "R = 0.40;
# P < 0.0001"; Fig. 4D bursts at approx. 200 Hz with "< 5-ms inter-spike intervals"; Fig. 4A to C
# first interspike interval approx. 10 ms; Fig. 5 "n = 202" pyramidal cells and "n = 43"
# interneurons, "P < 0.001" and "P < 0.003" in the legend, "P < 0.003" in the Results; largest
# spikes recorded "< 50 um" from the soma; small spikes "< 60 uV" at "> 50 um"; nothing at
# "> 140 um"; units "> 60 uV" are clusterable; spikes "< 50 um" from the tetrode are ">= 60 uV";
# a tetrode displaces ">= 13" neurons; recordable cells are "<= 140 um" away; units recorded
# ">= 100 um" above and below the soma (the same "$" glyph as in ">= 13" and ">= 60 uV"); neighbouring-shank cases "< 0.5%" of units; dendritic
# recordings have an action potential peak "< 0 mV"; resting potentials "more negative than -55 mV".
#
# Data the paper used. (1) Anesthetized experiments: 30 Sprague-Dawley rats (350 to 450 g),
# urethane 1.5 g/kg. A wire tetrode (four 13-um nichrome wires; in five rats a single 60-um wire)
# in the CA1 pyramidal layer, and a sharp micropipette (1 M potassium acetate, 2% biocytin)
# advanced near it at a 10 degree angle. Extracellular signals amplified 1,000 to 8,000 times and
# filtered 1 Hz to 3 kHz; all signals sampled at 10, 20, 25 or 50 kHz at 12 or 16 bit. Stable
# recordings from 33 neurons; 22 kept for analysis (resting potential more negative than -55 mV
# and satisfactory biocytin labelling): 21 pyramidal cells and one basket interneuron. Of the
# pyramidal cells, 11 were somatic and 9 dendritic impalements (dendritic: no fast
# afterhyperpolarization and/or an action potential peak below 0 mV), and one cell with an
# atypical large initial positivity was left out of the group analysis. Five further pairs were
# recorded with the single wire. Some cells received depolarizing current steps (e.g. 0.6 nA,
# 350 ms). Histology gave the distance from the tetrode tip to the soma for 19 pyramidal cells.
# Some anesthetized recordings used two-shank silicon probes with six sites per shank (25-um
# vertical, 150-um horizontal spacing) with an intracellular recording (Fig. 7). Measured
# variables: membrane potential, injected current, wideband extracellular potential on 4 (tetrode)
# or 12 (silicon probe) channels.
# (2) Behaving animals: recordings from 19 rats with wire tetrodes or silicon probes during sleep
# in the home cage, from a previous study (Csicsvari et al. 1999a) re-examined here, sessions of
# 15 to 50 min, units clustered as in that study. These give Figure 5 (theta against non-theta
# sleep), Figure 8 and, possibly, the propagation velocities of the Results section on the
# somatodendritic axis. The paper names no archive for them.
#
# The CRCNS data set, by its title and description, holds simultaneous intracellular and
# extracellular recordings from CA1 of anesthetized rats (tetrode or two-shank silicon probe),
# one folder per cell, with a spreadsheet of per-cell information. It does not, by its
# description, hold the behaving-animal recordings, the histology or the biocytin images; whether
# it holds the paper's per-cell distances, impalement sites (somatic or dendritic) and cell types
# is for the author to find.
#
# Method shared by the claims on the anesthetized recordings, from the Methods and Results.
# Intracellular action potentials are detected from peaks of the first derivative of the membrane
# potential; the action potential peak is where the derivative crosses back through zero.
# Extracellular spikes are taken at the times of the intracellular action potentials, on the
# wideband signal filtered 1 Hz to 3 kHz (Results and Fig. 1C legend: the relationships are
# reported for this band only), and averaged. Time points: start; "peak" (the negative peak of
# the extracellular spike, the peak of the intracellular action potential); "end" (the return to
# threshold potential for the intracellular trace, the peak of the late positivity for the
# extracellular one). Duration is start to end. Cells: tetrode recordings only (the single-wire
# cases are outside the group analysis), pyramidal cells with resting potential more negative
# than -55 mV, the atypical cell with a large initial positivity left out.
#
# Details the paper leaves open, used by several claims (each claim names those it rests on):
# (O1) The threshold of the derivative peak detection; a standard choice (a derivative peak
# well above the noise of the derivative, with capacitive transients of current steps excluded)
# cannot change the averages much and is used. (O2) Which spikes enter the averages; readings
# (a) every detected action potential of the cell's recordings, (b) spontaneous ones only, with
# spikes during current steps left out. (O3) Which tetrode channel; readings (a) the channel with
# the largest average spike (the channel the Fig. 6 legend uses for amplitude), (b) each of the
# four channels, a cell counting under the reading when the result holds on its largest channel
# and is reported for the others. (O4) How the start of each waveform is found; readings for the
# intracellular trace (a) the first point before the peak where dV/dt exceeds 10 V/s, (b) the
# point of maximal second derivative before the peak; for the extracellular trace (a) the last
# point before the negative peak within 2 SD of the pre-spike baseline noise, (b) the point of
# maximal second derivative (negative-going curvature) before the negative peak. The threshold
# potential that defines the intracellular end is the membrane potential at the intracellular
# start, under the same reading; the summary sentence of the same paragraph calls the end the
# "return to baseline", so a second reading of the intracellular end is the return to the mean
# membrane potential in the 2 ms before the start. (O5) The filter that brings recordings to 1 Hz to 3 kHz when
# they carry a wider band: a zero-phase low-pass at 3 kHz, a standard choice; recordings already
# at that band are used as they are. (O6) Action potential amplitude; readings (a) peak minus
# threshold (start), (b) peak minus the mean membrane potential in the 2 ms before the start.
# (O7) Extracellular spike amplitude; readings (a) negative to positive peak (the measure of the
# Fig. 5 analysis), (b) the initial negative peak against the pre-spike baseline (the measure
# the abstract and Fig. 4 discuss).
#
# Discrepancies in the paper: the back-propagation velocity is 1.61 m/s in the Results and
# Discussion and 1.68 m/s in the abstract; Figure 3B's legend counts "all 20 pyramidal cells" and
# the Results "all 21" (11 somatic plus 9 dendritic is 20, with the atypical cell 21); the Fig. 5
# legend gives P < 0.001 for pyramidal cells and the Results P < 0.003 for both groups; the
# intracellular end is the "return to threshold potential" in the definition and the "return to
# baseline" in the summary sentence of the same paragraph (O4).
