claims:
- id: sample-cells
  statement: Of 33 neurons recorded both intracellularly and by the tetrode, 22 were kept for
    analysis (stable recording, resting potential more negative than -55 mV, satisfactory
    labelling), 21 pyramidal cells and one interneuron.
  source: Results, opening section, paragraph 1
  quote: we were able to obtain recordings from 33 neurons ... A subset of 22 neurons were selected
    for further analysis because they had stable intracellular recordings ... This subset consisted
    of 21 pyramidal cells and one interneuron
  expected:
  - quantity: neurons recorded intracellularly and extracellularly
    value: 33
    tolerance: 3.3
  - quantity: neurons kept for analysis
    value: 22
    tolerance: 2.2
  - quantity: pyramidal cells kept
    value: 21
    tolerance: 2.1
  - quantity: interneurons kept
    value: 1
    tolerance: 0
    unit: cells
  criterion: Counts of distinct cells in the data set, with tetrode recordings (the five
    single-wire cases counted apart). Kept cells are those with a resting potential more
    negative than -55 mV (Methods and Results); labelling cannot be checked from recordings, so
    the count of kept cells is reported both with the potential criterion alone and with the
    data set's own cell type labels where it has them. The interneuron count is exact (one
    basket cell, Fig. 2). Reproduced when all four values are within tolerance; partially
    reproduced when the total and the kept count are.
- id: fig1c-start-end-timing
  statement: In the 11 somatic recordings, the start and the end of the average extracellular
    spike fall at almost the same times as those of the average intracellular action potential
    (0.01 +/- 0.02 ms and 0.02 +/- 0.14 ms earlier, mean +/- SD).
  source: Results, Temporal relationship between extracellularly and intracellularly recorded action
    potentials, paragraph 2; Figure 1C
  quote: For the 11 somatic intracellular recordings obtained for this study, the average
    extracellular spike started 0.01 ... ms earlier than the corresponding points on the average
    intracellular action potential
  expected:
  - quantity: mean lead of extracellular start over intracellular start
    value: 0.01
    tolerance: 0.02
    unit: ms
  - quantity: mean lead of extracellular end (late positive peak) over intracellular end (return
      to threshold)
    value: 0.02
    tolerance: 0.14
    unit: ms
  criterion: Per somatic pyramidal cell (11 in the paper), averaged waveforms as in the shared
    method; the tolerance is the SD the paper gives. Rests on O2, O3, O4 and O5; the readings are
    every combination of them. Reproduced when, under one reading, both means over cells are
    within tolerance.
- id: ap-duration-match
  statement: The action potential duration is the same whether measured from the intracellular
    waveform (1.28 +/- 0.18 ms) or from the extracellular one, start to late positive peak
    (1.27 +/- 0.19 ms).
  source: Results, Temporal relationship between extracellularly and intracellularly recorded action
    potentials, paragraph 2
  quote: The action potential duration was calculated to be 1.28 ... from the intracellular and
    extracellular waveforms, respectively
  expected:
  - quantity: intracellular action potential duration, mean over somatic cells
    value: 1.28
    tolerance: 0.18
    unit: ms
  - quantity: extracellular spike duration (start to late positive peak), mean over somatic cells
    value: 1.27
    tolerance: 0.19
    unit: ms
  depends_on:
  - fig1c-start-end-timing
  criterion: The same cells, waveforms and readings as fig1c-start-end-timing (O2 to O5);
    intracellular duration is start to return to threshold (or to baseline, the second reading
    of the end in O4), extracellular duration is start to
    the peak of the late positivity. The tolerance is the SD the paper gives. Reproduced when,
    under one reading, both means are within tolerance.
- id: duration-correlation
  statement: Across somatic cells, intracellular and extracellular spike durations are linearly
    related (R = 0.66, P < 0.03).
  source: Results, Temporal relationship between extracellularly and intracellularly recorded action
    potentials, paragraph 2
  quote: As expected, there was a linear relationship between the intracellular and extracellular
    spike durations across individual cells
  statistics:
  - test: not named (a linear relationship with its R)
    statistic: R = 0.66
    p: 0.03
    p_relation: "<"
    n: 11 somatic pyramidal cells
  expected:
    quantity: correlation coefficient R between intracellular and extracellular durations
    value: 0.66
    tolerance: 0.066
  depends_on:
  - ap-duration-match
  criterion: The per-cell durations of ap-duration-match; a least-squares linear regression of
    one on the other, R its correlation coefficient and P the two-sided test of zero slope (the
    paper names a linear relationship and R, not the test). Readings as in ap-duration-match.
    Reproduced when, under one reading, R is positive with P < 0.03 and R within tolerance;
    partially reproduced when R is positive with P < 0.03 but outside tolerance.
- id: neg-peak-precedes-intra-peak
  statement: In somatic recordings the negative peak of the extracellular spike precedes the peak
    of the intracellular action potential by 0.20 +/- 0.08 ms.
  source: Results, Temporal relationship between extracellularly and intracellularly recorded action
    potentials, paragraph 2; Figure 3B and C (black squares)
  quote: The negative peak of the extracellular spike preceded the peak of the intracellular somatic
    action potential by 0.20
  expected:
    quantity: mean latency from extracellular negative peak to intracellular peak, somatic cells
    value: 0.2
    tolerance: 0.08
    unit: ms
  criterion: Per somatic pyramidal cell, the time from the minimum of the averaged extracellular
    spike to the maximum of the averaged intracellular action potential; the tolerance is the SD
    the paper gives. Rests on O2, O3 and O5. Reproduced when, under one reading, the mean over
    cells is within tolerance and positive.
- id: fig1c-derivative-mismatch
  statement: The extracellular spike resembles the negative first derivative of the intracellular
    action potential during the rising phase but not during the falling phase and
    afterhyperpolarization, where the derivative follows a much faster time course.
  source: Results, Temporal relationship between extracellularly and intracellularly recorded action
    potentials, paragraph 4; Figure 1C
  quote: Whereas the waveforms were similar during the ascending phase of the action potential ...
    they differed substantially during the descending phase and spike afterhyperpolarization ...
    We consistently observed that after the initial ascending phase ... the intracellular
    derivative followed a much faster trajectory than the extracellular spike
  criterion: The paper shows this on traces and gives no measure, so the measure is open. Per
    somatic cell, the negative first derivative of the averaged intracellular action potential
    against the averaged extracellular spike (O2, O3, O5). Readings (a) after scaling the
    derivative to the extracellular negative peak, the Pearson correlation between the two over
    the rising phase (intracellular start to peak) exceeds that over the falling phase
    (intracellular peak to return to threshold); (b) the time from the negative peak to the
    positive peak is shorter for the negative derivative than for the extracellular spike.
    Reproduced when, under one reading, it holds in more than half of the somatic cells
    ("consistently" read as a majority).
- id: notch-and-ahp-landmarks
  statement: A notch on the ascending phase of the extracellular spike after its negative peak
    coincides with the peak of the intracellular action potential, and a change of slope after
    the late positive peak coincides with the peak of the afterhyperpolarization.
  source: Results, Temporal relationship between extracellularly and intracellularly recorded action
    potentials, paragraph 3; Figures 1C, 2B and 4B
  quote: This “notch” on the ascending phase corresponded in time to the peak of the
    intracellularly recorded action potential ... Often the late positive peak was followed by a
    clearly recognizable change in the slope ... corresponding to the peak of the intracellular
    spike afterhyperpolarization
  criterion: Seen "in some cases" and "often", without a measure, so the detection and the
    agreement window are open. Per pyramidal cell (somatic and dendritic, the paper does not
    restrict it), on averaged waveforms (O2, O3, O5) - the notch is a local minimum of the
    extracellular first derivative between the negative peak and the late positive peak; the
    slope change is a local extreme of the second derivative within 3 ms after the late positive
    peak; the AHP peak is the minimum of the intracellular trace within 5 ms after the return to
    threshold. Agreement readings (a) within 0.1 ms, (b) within 0.2 ms. Reproduced when, under
    one reading, the notch agrees with the intracellular peak in more than half of the cells
    that show a notch, and the slope change agrees with the AHP peak in more than half of the
    cells that show one; partially reproduced when one of the two holds. The number of cells
    with each landmark is reported.
- id: fig2-interneuron-narrow
  statement: The basket interneuron has a short action potential with fast repolarization, and its
    extracellular spike is narrow as well, supporting extracellular spike width as a measure to
    separate pyramidal cells from interneurons.
  source: Figure 2C legend; Discussion, Relationship between intracellular action potentials and
    extracellular spikes, paragraph 4
  quote: Note the short-duration and fast spike repolarization of the basket neuron ... these data
    further validate previous observations that suggest that the extracellular spike width is a
    useful measure for the separation of pyramidal cell and interneuron spikes
  depends_on:
  - ap-duration-match
  criterion: Durations of the interneuron's averaged waveforms measured as in ap-duration-match.
    The paper gives no comparison rule; readings (a) the interneuron's intracellular and
    extracellular durations are both shorter than those of every somatic pyramidal cell, (b) both
    are more than 2 SD below the pyramidal means. Reproduced when, under one reading, both
    durations are shorter.
- id: fig3b-latency-vs-amplitude
  statement: The latency from the extracellular negative peak to the intracellular peak grows as
    the intracellular action potential amplitude falls, longer in dendritic than in somatic
    recordings, as expected if spikes start at the soma and propagate back into the dendrites.
  source: Results, Temporal relationship between extracellularly and intracellularly recorded action
    potentials, paragraph beginning "Nine other pyramidal cell recordings" (8th or 9th); Figure 3B
  quote: Figure 3B shows that the latency between the extracellular peak and intracellular peak for
    all 21 pyramidal cells also varies as a function of intracellular action potential amplitude
  depends_on:
  - neg-peak-precedes-intra-peak
  criterion: Per pyramidal cell (somatic and dendritic; 20 in the Fig. 3B legend, 21 in the
