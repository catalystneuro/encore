- id: fig3c-backprop-velocity
  statement: Converting intracellular action potential amplitude to distance from the soma (4.9
    um/mV, from Kamondi et al. 1998), the latencies give an average back-propagation velocity of
    1.61 m/s.
  source: Results, Temporal relationship between extracellularly and intracellularly recorded action
    potentials, paragraph beginning "Nine other pyramidal cell recordings" (8th or 9th); Figure 3C
  quote: The average conduction velocity of the back-propagating spike calculated from these data
    are 1.61 m/s
  expected:
    quantity: back-propagation velocity
    value: 1.61
    tolerance: 0.161
    unit: m/s
  depends_on:
  - fig3b-latency-vs-amplitude
  criterion: The amplitudes and latencies of fig3b-latency-vs-amplitude; distance from the soma =
