    correlation is negative with two-sided P < 0.05 and the dendritic cells' median latency
    exceeds the somatic cells'; partially reproduced when only one of the two holds.
- id: fig3a-example-pair
  statement: In two cells impaled on the same track, a dendrite 240 um deeper than a soma, the
    extracellular peak led the intracellular peak by 0.55 ms in the dendritic recording and by
    0.28 ms in the somatic one.
  source: Results, Temporal relationship between extracellularly and intracellularly recorded action
