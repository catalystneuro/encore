- id: fig4bc-burst-attenuation
  statement: During current-evoked trains the intracellular action potential becomes smaller and
    slower, through depolarization of the baseline with the peak unchanged, and the extracellular
    spike follows - its amplitude and the slope of its positive-going phase decrease and the notch
    fades.
  source: Results, Correlated variations in amplitude and shape between intracellular and
    extracellular spikes, paragraph 1; Figure 4A to C
  quote: Over the course of the evoked depolarization, the amplitude of the action potential became
    smaller, and the slope of both the rising and falling phases decreased ... These data also
    indicate that the amplitude of the somatic intracellular action potential changes due to a
    depolarization of the baseline membrane potential and not due to changes in the peak
    potential of the action potential ... The amplitude of the extracellular spike decreased, the
    slope of the positive-going phase of the spike decreased and the “notch” became less prominent
  criterion: Cells with depolarizing current steps that evoke accommodating trains (Fig. 4A, 0.6
    nA, 350 ms, first interspike interval about 10 ms). Per cell, waveforms averaged by spike
    order in the train, 1st to 5th (Fig. 4B); amplitudes O6 and O7. Readings for "decrease"
    (a) the 5th spike's value is below the 1st's, (b) the values fall from each spike to the
    next from the 2nd on (the paper notes the 1st differs). Reproduced when, under one reading,
    in more than half of these cells the intracellular amplitude, the maximal rising and falling
    slopes, the extracellular amplitude and the maximal slope of the extracellular positive-going
    phase all decrease, the pre-spike baseline rises and the intracellular peak potential changes
    by less than the baseline does. Partially reproduced when the amplitude parts hold but a
    slope or the baseline part does not.
- id: fig4d-amplitude-correlation
  statement: Within high-frequency evoked bursts (about 200 Hz) in one cell, extracellular spike
    amplitude correlates positively with intracellular action potential amplitude (R = 0.40,
    P < 0.0001).
  source: Results, Correlated variations in amplitude and shape between intracellular and
    extracellular spikes, paragraph 1; Figure 4D
  quote: Figure 4D shows, for a different cell, the relationship between the extracellular spike
    amplitude and intracellular action potential amplitude for bursts of spikes occurring at a
    higher frequency ... illustrates the positive relationship between the intracellular and
    extracellular amplitudes
  statistics:
  - test: linear regression
    statistic: R = 0.40
    p: 0.0001
    p_relation: "<"
    n: individual spikes of one cell
  expected:
    quantity: correlation coefficient R, intracellular against extracellular spike amplitude
    value: 0.4
    tolerance: 0.04
  criterion: Single spikes in bursts evoked by strong depolarizing steps with interspike
    intervals below 5 ms; amplitudes per spike, O6 and O7. The cell is not identified; it is any
    cell other than the Fig. 4A to C cell with such bursts. Per candidate cell, a least-squares
    regression of extracellular on intracellular amplitude, R and the two-sided P of the slope.
