    unit: cells
  - quantity: cells within 140 um
    value: 1108
    tolerance: 110.8
    unit: cells
  depends_on:
  - fig6-amplitude-vs-distance
  criterion: Arithmetic on the paper's constants (density 300,000/mm3 from Aika et al. 1994,
    layer thickness 60 um, radii 50 and 140 um, tetrode radius 15 um), cylinder volume pi r^2 h.
    It uses no recordings beyond the radii of fig6-amplitude-vs-distance. Reproduced when both
    counts are within tolerance, and the radii hold in fig6-amplitude-vs-distance.
- id: silent-cells-inference
  statement: A tetrode should be able to separate 60 to 100 neurons (about 100 in the Discussion's
    summary, at least 60 after allowing for local damage), several times the units routinely
    separated per tetrode (about six in the abstract, 1 to 20 in the cited studies), which the
    authors explain by most pyramidal cells being silent in any given environment.
  source: Discussion, Sensitivity of tetrodes and spatial clustering techniques, paragraphs 2 and 3;
    Abstract; Discussion, opening paragraph
  quote: A more likely potential reason for the large discrepancy between theory and practice is
    that the great majority of pyramidal cells are silent in any given environment
  depends_on:
  - tetrode-cell-count-estimate
  criterion: An interpretation resting on unit counts from other studies (1 to 20 per tetrode) and
    on interneuron to pyramidal cell ratios from the literature; no test in the paper and no
    measurement in the anesthetized recordings bears on it. Recorded for coverage; expected to
    be untestable.
- id: fig7-vertical-spread
  statement: On a linear silicon probe, the spike of a cell can be recorded 100 um or more above
    and below the site nearest the soma (a vertical span of at least 200 um), and its rise and decay
    slopes decrease with distance from the soma along with its amplitude.
  source: Results, Multiple recording of extracellular spikes along the somatodendritic axis,
    paragraphs 1 and 2; Figure 7
  quote: The extracellular waveforms were averaged based on the occurrence of the simultaneously
    recorded intracellular action potentials ... above and below the putative location of the soma
    ... Coincident with the extracellular spike amplitude decrease, the rise and decay slopes of
    the extracellular spike also decreased with distance from the soma
  criterion: Anesthetized recordings with a two-shank, six-site silicon probe and an intracellular
    recording; per cell, extracellular waveforms on each site averaged on the intracellular
    action potentials (O1, O2), filtered 1 Hz to 10 kHz as the Fig. 7 legend states (O5 with 10
    kHz). The site with the largest spike is the soma (Results). A spike is present on a site when
    its averaged negative peak exceeds 2 SD of the averaged noise (a standard rule, the paper
    names none). The paper's distance is ">= 100 um" (Results); with 25-um site spacing, 10% of
    it does not reach the next site down, so the distance is four sites. Reproduced when, in
    more than half of the cells, the spike is present on sites at least 100 um (four sites) from
    the soma site on at least one side (a six-site shank spans 125 um, so both sides cannot
    reach 100 um at once), and amplitude and
    maximal rise and decay slopes decrease from the soma site outward on the shank.
- id: propagation-velocity-range
  statement: Propagation velocities from the delay between extracellular negative peaks on sites
    along the somatodendritic axis range from 0.4 to 2 m/s in pyramidal cells (n = 25) and 0.5 to
    1.5 m/s in pyramidal-layer interneurons (n = 6), in agreement with the 1.61 m/s from the
    intracellular data.
  source: Results, Multiple recording of extracellular spikes along the somatodendritic axis,
    paragraph 2
  quote: The propagation velocity of action potentials, estimated from the distance of the
    recording sites and the delay between the negative peaks of the extracellular spikes, varied
    from 0.4 to 2 m/s in pyramidal cells
  expected:
  - quantity: velocity range, pyramidal cells
    value: 0.4
    tolerance: 0.04
    unit: m/s (lower bound)
  - quantity: velocity range, pyramidal cells
    value: 2
    tolerance: 0.2
    unit: m/s (upper bound)
  - quantity: velocity range, interneurons
    value: 0.5
    tolerance: 0.05
    unit: m/s (lower bound)
  - quantity: velocity range, interneurons
    value: 1.5
    tolerance: 0.15
    unit: m/s (upper bound)
  criterion: Which recordings are used is open; readings (a) the anesthetized silicon probe
    recordings (Fig. 7 setting), (b) the behaving-animal silicon probe recordings of Csicsvari
    et al. 1999a, which the data set does not hold by its description. The 6 interneurons
    exceed the one intracellular interneuron, so reading (b), or units sorted from the
    extracellular channels, is implied; testable only to the extent the data set holds such
    units. Per unit, velocity from site spacing (25 um) and negative peak delays; pairing
    readings (a) the slope of a fit of negative peak time on site position over the sites where
    the spike is present, (b) the largest-spike site against the farthest site with the spike.
    Reproduced when, under one reading, every unit's velocity lies within the range widened by
    10% of each bound.
- id: fig8-neighbouring-shanks
  statement: Only two units, both putative interneurons and under 0.5% of clustered units, were
    recorded on two shanks 150 um apart; no pyramidal cell was, implying a larger vertical than
    horizontal spread of pyramidal cell spike currents.
  source: Results, Multiple recording of extracellular spikes along the somatodendritic axis,
    paragraph 3; Figure 8
  quote: we found only two cases in our database from behaving animals ... when the extracellular
    spike, recorded at one shank, was also recorded by the neighboring shank ... Both units were
    classified as putative interneurons
  criterion: Cross-correlograms between units clustered separately per shank, a peak at 0 ms
    flanked by suppression within 5 ms. These are the behaving-animal recordings of Csicsvari
    et al. 1999a, which the data set does not hold by its description; expected to be
    untestable.
