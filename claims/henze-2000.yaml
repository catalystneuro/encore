- id: fig5-theta-smaller-spikes
  statement: In sleeping rats, extracellular spike amplitudes of pyramidal cells (n = 202) and
    pyramidal-layer interneurons (n = 43) are smaller during REM sleep with theta than during
    slow-wave sleep without theta, sharp-wave bursts excluded.
  source: Results, Behavioral state effects on extracellular spike waveform, paragraph 1; Figure 5
  quote: This comparison revealed that the mean spike amplitude of individual pyramidal units and
    pyramidal layer interneuronal units was lower during theta oscillations
  statistics:
  - about: pyramidal cells, theta against non-theta (Fig. 5 legend)
    test: paired Student's t-test
    p: 0.001
    p_relation: "<"
    n: 202 pyramidal cells
  - about: pyramidal layer interneurons, theta against non-theta (Fig. 5 legend)
    test: paired Student's t-test
    p: 0.003
    p_relation: "<"
    n: 43 interneurons
  criterion: Per unit, the mean negative-to-positive peak amplitude of its spikes in theta (REM)
    epochs and in non-theta, non-sharp-wave slow-wave sleep epochs; paired t-test per cell class.
    Reproduced when both classes are smaller in theta with P below the legend's bounds. These are
    the behaving-animal recordings of Csicsvari et al. 1999a, which the data set does not hold by
    its description; expected to be untestable.
- id: theta-higher-rates
  statement: Pyramidal cells and interneurons fire at higher rates during theta than during
    periods without theta or sharp waves.
  source: Results, Behavioral state effects on extracellular spike waveform, paragraph 1
  quote: the frequency of discharge of both pyramidal cells and interneurons is higher during theta
    activity than during “no-theta and no-sharp wave” periods
  criterion: Per unit, firing rate in the two states as in fig5-theta-smaller-spikes; the paper
    gives no test. Behaving-animal data not held by the data set by its description; expected
    to be untestable.
- id: fig6-amplitude-vs-distance
  statement: Average extracellular spike amplitude falls steeply with distance from the soma - the
    largest spikes were within 50 um, small spikes below 60 uV were still seen beyond 50 um, and
    beyond 140 um no spike could be distinguished from noise even by averaging.
  source: Results, Field measurements of action potentials, paragraph 1; Figure 6A to C
  quote: We found that the amplitude of the average extracellular spike decreased rapidly as a
    function of distance of the tetrode tip from the soma ... The largest amplitude spikes were
    recorded ... from the soma ... no extracellular spike activity could be distinguished from the
    background noise activity even after averaging based on the occurrence of the intracellular
    action potentials
  depends_on:
  - sample-cells
  criterion: The 19 pyramidal cells with a histological distance (Fig. 6A legend); amplitude of
    the averaged spike on the tetrode channel with the largest peak amplitude (legend), readings
    O7; O2 and O5 apply. Needs the per-cell distances; not testable if the data set does not
    hold them. The paper reports no test; readings (a) Spearman, (b) Pearson correlation of
    amplitude with distance. Reproduced when, under one reading, the correlation is negative
    with two-sided P < 0.05, the cells within 50 um have average amplitudes of at least 60 uV,
    the cells beyond 50 um have below 60 uV, and no cell beyond 140 um has an averaged spike
    above 2 SD of the averaged noise (a standard detection rule, the paper names none).
    Partially reproduced when the correlation holds but a threshold part does not.
