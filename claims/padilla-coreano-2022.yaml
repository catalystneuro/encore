- id: fig2a-win-lose-segregated-before-cue
  statement: mPFC trajectories for win and lose trials, and for self and other port entries,
    occupy segregated subspaces, already before cue onset.
  source: Figure 2a; Results, mPFC reflects rank and winning
  quote: Neural trajectories during the cue and port entries of the self or other (competitor) for win or lose trials occupied segregated neural activity subspaces even before the cue onset
  criterion: The paper gives no test and no measure of segregation. With the shared trajectory
    method, the bin-by-bin distance between the win and lose trajectories over -5 to 0 s is
    compared with the distance between trajectories of two random halves of the data over 50
    iterations, the only reference distance the paper reports (ED Fig. 7g-h, right). The paper
    gives no threshold for this comparison; readings (a) the win against lose distance exceeds the
    mean random-half distance, (b) it exceeds the 95th percentile of the random-half distances.
    Reproduced when, for dom and for sub, both readings agree that it exceeds; when they disagree
    the claim is methods_underspecified.
