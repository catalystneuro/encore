# Claims for Padilla-Coreano, Batra, Patarino et al. (2022), Nature 603, 667-671, on dandiset 001749.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: paper/10.1038-s41586-022-04507-5.txt. It holds the PMC author manuscript (PMC9576144,
# NIHMS1838406): main text, legends of Figures 1 to 4 and Extended Data Figures 1 to 10. It also
# holds the Nature supplementary information (41586_2022_4507_MOESM1_ESM.pdf, extracted with
# PyMuPDF), which contains the Methods (sections 1 to 17). The main-text PDF is not
# present; all numbers used here are printed in the legends. The equations in the supplement are
# garbled by the extraction; only the alignment index (Methods 14) is needed, and it is read as
# Tr(P1' Cov(D2) P1) / Tr(P2' Cov(D2) P2), after Miri et al. (2017), which the Methods cite.
#
# Code read: github.com/Tyelab/HMMGLM at commit 3fc3567815b9c891402635664a844320136d2fac
# (run_model.m, model_HMMGLM.m; it also holds dataset_forHMMGLM_proc.mat, the paper's processed
# HMM-GLM input of 1.5 MB, which was not opened here). The code fixes, for the HMM-GLM, 6 hidden
# states; 100 epochs of gradient ascent on the Baum-Welch auxiliary function; learning rate
# 1e-6/(1 + epoch/128); Gaussian initialisation with mean 0 and SD 0.001 and a matching Gaussian
# penalty (1/0.001); a uniform initial state prior; 10 folds formed as contiguous blocks of trials
# in the order of the input file; one-step prediction; and per-behaviour, per-fold AUCs
# (MATLAB perfcurve, one against all, on every time point of the held-out trials), computed both
# without and with the one-bin shift (auc_ROC and auc_ROC_delay). AlphaTracker
# (github.com/ZexinChen/AlphaTracker, head 43e1264294c8732a83ee21a05014f38ff6cf16b4, linked from
# tyelab.org/tools) was surveyed: it holds the tracking, clustering and correction interface, and
# no analysis of rank, trials or neurons. No code is linked for the PCA trajectories, SVM decoding,
# single-unit responses, phototagging or behavioural statistics; those methods come from the
# Methods and legends alone. The paper's analyses were run in MATLAB (Methods 14, 17); where a
# MATLAB default is named below it is the default of the function the Methods name.
#
# The data the paper used, as it reports them:
# - Subjects: adult male C57BL/6J mice housed in cages of 3 to 4; ranks 1 (dominant) to 4 from a
#   round-robin tube test, stable for 3 or more days. In a competition the higher-ranked mouse of
#   the pair is the relative dominant (dom), the other the relative subordinate (sub).
# - Task: 10 s tone (5 kHz, 60 dB) and LED; 10 uL Ensure delivered 2 s after tone onset; ITI 60 to
#   100 s; port entries by lickometer or infrared beam. Competition sessions of two cagemates;
#   20 or 30 trials. The winner of a trial is the mouse at the port 1.5 to 3 s after tone onset, or
#   the first to the port after delivery when the port was empty; trials with a switch are
#   excluded. Pushing, resisting and displacement were hand-scored; video at 25 or 30 fps;
#   nose, ears and tail base tracked with AlphaTracker.
# - Unimplanted validation cohort (Figure 1b-c, Extended Data Fig. 1): 8 mice, 12 dyads.
# - mPFC recordings: 32-wire bundles, SpikeGadgets MiniLogger, 600 to 6,000 Hz, common average
#   reference, Klusta spike sorting with manual curation. 24 mice implanted, 20 with cells (998
#   cells; 913 kept for clustering). 24 mice recorded alone before any competition (17 of the
#   competition mice and 7 more). In 15 of the 20, alone trials followed by competition trials in
#   one session. Figure 2a: 20 mice, 27 sessions, 507 dom and 490 sub cells.
# - HMM-GLM dataset: 13 mice with equivalent video conditions, 965 trials from 32 sessions,
#   multi-unit rates on 32 channels (threshold 4 SD after common average reference), 70 bins of
#   200 ms, one of 9 behaviour labels per bin (Figure 1f). The dandiset description places the hand
#   scoring at -2 s to +12 s from tone onset, which is 70 bins of 200 ms; the paper gives the
#   length but not the alignment.
# - Projection-defined cells: ChrimsonR in mPFC-LH or mPFC-BLA neurons (CAV2-Cre in LH or BLA);
#   red light (635 nm, 5 ms pulses at 10 or 20 Hz, 8 mW) after the session; tagged cells in 3 of 12
#   LH mice and 3 of 8 BLA mice. Ex vivo latencies from a separate cohort of 6 mice.
# - Optogenetics: ChR2 or eYFP in mPFC-LH neurons, 473 nm bursts (four 5 ms pulses at 100 Hz every
#   200 ms) in 5 min epochs, to the relative subordinate only; 9 ChR2 and 7 eYFP mice.
# The dandiset is described as holding the mPFC ("ephys"), mPFC-BLA ("BLA") and mPFC-LH
# ("chrimson") recordings with behaviour, ranks, port entries, identity-corrected AlphaTracker
# poses and the 9 hand-scored behaviour labels. Whether it holds the unimplanted cohort, the alone
# sessions, the ex vivo or the optogenetic data is the author's to find.
#
# Shared methods used by several criteria below (cited once here, from the Methods):
# - Trajectories (Methods 14, Neural trajectories): one global PCA on a matrix of neurons by the
#   concatenated mean firing rates of six events (win trials, lose trials, self and other port
#   entries during the tone, self and other port entries during the ITI), -5 to 5 s around each
#   event in 100 ms bins, neurons of all animals together. As the Methods say coefficients are
#   per cell, neurons are the variables and time bins the observations; MATLAB pca centres the
#   columns by default. Group trajectories are the PCA coefficients times the group's mean
#   firing rates; length is the sum of Euclidean distances between adjacent 100 ms bins over
#   the first 148 PCs (90% of variance); distance between trajectories is the bin-by-bin
#   Euclidean distance; group sizes in neurons are matched; statistics run over leave-one-animal-
#   out iterations, one per mouse in the group. The Figure 2 legend says the 2-way ANOVAs are for
#   rank and event (baseline against event) or rank and trial type; baseline is read as -5 to 0 s
#   and event as 0 to 5 s.
#   Open, with readings: (a) 148 PCs as printed, (b) as many PCs as reach 90% of variance in the
#   reproduction; neuron matching by (a) one random subsample of the larger group, (b) a new
#   subsample in each iteration. The firing rates are used as rates, not z-scores, as the
#   Methods say "mean firing rate".
# - SVM (Methods 14, SVM classifier): single-trial trajectories from the global PCA
#   coefficients; features are the first 8 PCs at each time bin, from -30 to 30 s or -5 to 5 s
#   around the cue; Gaussian-kernel SVM with MATLAB R2019b fitcsvm defaults (box constraint 1,
#   kernel scale 1, no standardisation); Platt posterior; 10-fold cross-validation; AUC on each
#   test fold; classes balanced "where possible". The legend p-value 2e-4 is what MATLAB ranksum
#   (normal approximation with continuity correction) gives for 10 fold AUCs that all exceed 10
#   shuffled AUCs, so each comparison is read as a Wilcoxon rank-sum of 10 against 10 fold AUCs.
#   Open, with readings: the shuffle is a permutation of trial labels run through the same
#   pipeline; the bin width of single-trial features is 100 ms, as in the PCA (a standard
#   choice); class balance by (a) all trials, (b) random subsampling of the larger class.
# - Responsive cells (Methods 14, Firing rate analysis): Wilcoxon signed-rank test of per-trial (or
#   per-entry) firing rate in a 5 s baseline against the 5 s after the event; excited or inhibited
#   by the sign of the mean z-score over the 5 s response window; mean rates per trial type
#   smoothed with MATLAB smoothdata (default moving mean) before z-scoring. Response magnitude is
#   that mean z-score. Fisher's exact test on responsive against non-responsive cells per group;
#   Wilcoxon rank-sum on magnitudes of excited, and of inhibited, cells. Open, with readings: the
#   significance level of the signed-rank test is not given, (a) 0.05, (b) 0.01; the z-score is
#   taken (a) against the -5 to 0 s baseline, (b) against the whole -5 to 5 s window; bins of
#   100 ms as in the PCA (a standard choice); the Fisher denominator is (a) all cells of the
#   group, (b) the cells with baseline rate at or above 0.05 Hz.
# - Phototagging (Methods 12): mean rate 10 ms before against 10 ms after each pulse, Wilcoxon
#   signed-rank at alpha 0.001, and latency (first 1 ms bin above baseline mean plus 4 SD) of 7 ms
#   or less.
schema_version: 2
dataset:
  archive: dandi
  id: "001749"
paper: doi:10.1038/s41586-022-04507-5
claims:
- id: fig1b-dominants-more-rewards
  statement: In the unimplanted cohort, relative dominants collected more rewards than relative
    subordinates when competing in dyads.
  source: Figure 1b; Results, first paragraph
  quote: Mice with higher relative ranks (dominant; Dom ) collected more rewards than relative subordinates ( Sub ) when competing in dyads
  statistics:
  - test: Sign rank test on total rewards
    p: 0.008
    n: 12 dyads
  criterion: Per dyad, total rewards won by the relative dominant and the subordinate over the
    session, as in the legend; Wilcoxon signed-rank test across the 12 dyads. Reproduced when
    p < 0.05 with dominants higher. Percent competitions won by absolute rank (6 per rank, Figure
    1b right) is reported and not judged, as the text states no result for it.
- id: fig1c-port-pushing-displacement
  statement: In the unimplanted cohort, relative dominants had higher port occupation, higher
    pushing success, and higher time displaced from the port (as the legend words it) than
    relative subordinates.
  source: Figure 1c
  quote: Port occupation, pushing success (pushing that resulted in displacement of competitor), and time displaced from port was higher for relative dominants
  statistics:
  - about: port occupation
    test: Sign rank test
    p: 0.04
    n: 12 dyads
  - about: pushing success
    test: Sign rank test
    p: 0.02
    n: 12 dyads
  - about: time displaced from port
    test: Sign rank test
    p: 0.016
    n: 12 dyads
  criterion: Per dyad, dominant against subordinate, Wilcoxon signed-rank tests on port occupation
    time, pushing success (percent of pushes that displaced the competitor, Methods 6, Reward
    competition behavioral analysis) and time displaced. The legend leaves open which way the
    displacement measure runs; readings (a) time spent displacing the competitor, as the main text
    says dominants "were more successful at displacing competitors", (b) time being displaced, as
    printed. Reproduced when all three tests give p < 0.05 with dominants higher under one reading.
- id: ed1d-pushing-success
  statement: In the unimplanted cohort, relative dominants have higher pushing success during the
    tone.
  source: Extended Data Fig. 1d
  quote: Relative dominant mice have higher pushing success during the tone (n=12 per group, paired t-test p=0.025)
  statistics:
  - test: paired t-test
    p: 0.025
    n: 12 per group
  criterion: Pushing success (percent of pushes that displaced the competitor, Methods 6) during the
    10 s tone, per mouse, paired across the 12 dyads. Reproduced when the paired t-test gives p <
    0.05 with dominants higher.
- id: ed1g-distance-by-outcome-not-rank
  statement: In the unimplanted cohort, the distance to the reward port around the tone differs by
    trial outcome (win against lose) but not by relative rank.
  source: Extended Data Fig. 1g
  quote: Distance to reward port across time by trial type and relative rank
  statistics:
  - about: mean distance -5 s to cue onset, trial type
    test: 2-way ANOVA
    statistic: F(1,180) = 44.4
    p: 3.0e-10
    n: dom win 68, dom lose 24, sub win 24, sub lose 68 trials from 12 dyads
  - about: mean distance -5 s to cue onset, rank
    test: 2-way ANOVA
    p: 0.94
  - about: mean distance -5 s to 10 s, trial type
    test: 2-way ANOVA
    statistic: F(1,180) = 68
    p: 2.5e-14
  - about: mean distance -5 s to 10 s, rank
    test: 2-way ANOVA
    p: 0.071
  criterion: Per trial, the mean AlphaTracker distance to the human-marked port location over the
    windows the legend gives (-5 s to tone onset; -5 s to +10 s); 2-way ANOVA of trial type by
    relative rank on trials. Reproduced when trial type has p < 0.05 and rank has p >= 0.05 in
    both windows; the legend gives no direction for trial type, which is reported. The rank result is a claim of absence judged on this test.
- id: fig1e-alphatracker-precision
  statement: AlphaTracker tracks two unmarked mice with higher precision than human annotators.
  source: Figure 1e; Extended Data Fig. 2
  quote: AlphaTracker performance surpasses human accuracy when tracking 2 or 4 mice
  criterion: Needs the annotated evaluation frames of Methods 15 (800 frames from 4 videos, 200
    double-annotated), which the paper does not deposit. Reproduced when AlphaTracker's average
    precision over body parts exceeds the between-human precision on those frames.
- id: fig1i-hmmglm-decodes-behaviour
  statement: A 6-state HMM-GLM decodes the 9 behaviour labels from mPFC multi-unit activity above
    chance and better than a GLM or an ensemble of 9 GLMs, while the GLM and the 9 GLMs do not
    differ.
  source: Figure 1i; Extended Data Fig. 5j; Methods 17
  quote: An HMM-GLM model with 6 hidden states decoded behavioral labels from neural activity with superior cross-validated performance to static models
  statistics:
  - about: across the five models
    test: Kruskal Wallis test
    p: 6.7e-8
    n: 9 behaviours per model
  - about: HMM-GLM, 9 GLMs and GLM against chance
    test: sign test
    p: 0.004
    n: 9 behaviours
  - about: HMM-GLM against GLM
    test: Wilcoxon rank sum
    p: 4.0e-5
    n: 9 behaviours per model
  - about: HMM-GLM against 9 GLMs
    test: Wilcoxon rank sum
    p: 4.0e-5
    n: 9 behaviours per model
  - about: GLM against 9 GLMs
    test: Wilcoxon rank sum
    p: 0.54
    n: 9 behaviours per model
  - about: HMM-GLM with leave-one-animal-out cross-validation against chance
    test: Sign test
    p: 0.004
    n: 9 behaviour labels
  expected:
  - quantity: trials in the HMM-GLM dataset
    value: 965
    tolerance: 96
  - quantity: sessions
    value: 32
    tolerance: 3
  - quantity: mice
    value: 13
    tolerance: 1
  criterion: Input, from Methods 17 (Dataset), multi-unit rates on the 32 channels after common
    average reference, spikes at 4 SD from the mean, in 70 bins of 200 ms per trial (aligned at -2
    to +12 s from tone onset, from the dandiset description; the paper gives no alignment), and
    one of the 9 labels per bin. HMM-GLM as fixed by run_model.m and model_HMMGLM.m (see the opening
    comment). FT, GLM (multinomial logit, 9-output softmax), SVM (Gaussian kernel, one against
    all) and 9 GLMs (one logit GLM per label) as Methods 17 describe. Per behaviour, the AUC is the
    mean over the 10 folds. Tests as the legend gives them; the printed p-values match a two-sided
    sign test of 9 of 9 AUCs above 0.5 (0.0039) and an exact rank-sum with no overlap between 9 and
    9 (4.1e-5). Reproduced when HMM-GLM AUCs exceed 0.5 by the sign test (p < 0.05), exceed the
    GLM and 9-GLM AUCs by rank-sum (p < 0.05), and the GLM against 9 GLMs rank-sum gives p >= 0.05
    (a claim of absence, judged on that test). Open, with readings; spike threshold (a) negative
    crossings below mean minus 4 SD, (b) crossings in either direction; rates (a) counts per bin,
    (b) z-scored per channel; AUC (a) with the one-bin backward shift the Methods describe
    (auc_ROC_delay), (b) without (auc_ROC); folds (a) contiguous in session order, as the code
    forms them, (b) random. The processed input in the code repository is a variant input, not
    the basis of the outcome.
- id: ed5j-six-states
  statement: Held-out log-likelihood of the HMM-GLM increases with the number of hidden states and
    plateaus at 6 states.
  source: Extended Data Fig. 5j, left; Methods 17, Cross-validation and Model Selection
  quote: We found that as you increase the number of hidden states, the log likelihood increases, reaching a plateau at the 6-state model
  depends_on:
  - fig1i-hmmglm-decodes-behaviour
  criterion: Per number of states, the trial-averaged held-out log-likelihood over 10 folds, with
    SEM across folds (Methods 17), other settings as in fig1i-hmmglm-decodes-behaviour. The number
    of states tried is not given; read as 1 to 10. "Plateau" is not defined; readings (a) 6 is the
    smallest number whose mean lies within one SEM of the best mean, (b) 6 has the highest mean.
    Reproduced when one reading selects 6, partially reproduced when it selects 5 or 7.
- id: ed5k-hmmglm-generalizes-across-rank
  statement: The 6-state HMM-GLM predicts behaviour above chance whichever relative rank group is
    used for training and for testing.
  source: Extended Data Fig. 5k; Results, mPFC neurons encode competition behavior
  quote: The model performed equally well when training for one relative rank and testing on the other
  statistics:
  - test: Sign test performance vs 0.5 (chance)
    p: 0.004
    n: 9 behaviour labels, 482 dom and 478 sub trials
  depends_on:
  - fig1i-hmmglm-decodes-behaviour
  criterion: The model of fig1i-hmmglm-decodes-behaviour trained on dom trials and tested on sub
    trials, and the reverse, plus within-group 10-fold runs. Per behaviour the AUC on the test
    trials. Reproduced when every train and test combination gives a sign test of the 9 AUCs
    against 0.5 at p < 0.05.
