# Claims for Robotka, Thomas, Yu, Wood, Elie, Gahr & Theunissen (2023), Cell Reports 42, 112034,
# "Sparse ensemble neural code for a complete vocal repertoire", tested on CRCNS aa-5.
#
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-11,
# protocol pilot-14 as stated in docs/protocol.md (Reader). The criteria were written from the
# paper and its code alone; no data of the dataset were seen.
#
# Text read: the version of record (paper/10.1016-j.celrep.2023.112034.txt, extracted from the
# publisher PDF), with its STAR Methods and the Supplemental information (SI Figures 1 to 11 and
# their legends, which the PDF carries at its end). Table 1 was read from the text. Figures were
# not opened; no claim needed a value only printed in a figure.
#
# Code read: github.com/ftheunissen/Ensemble-Code-Cell-Reports-2022 at commit
# f2d237639217425e7fc81d694708f19428a3b026 (v1.0 in the key resources table, zenodo 7378502). It
# holds Jupyter notebooks with their printed outputs and decoders.py. GenerateReport.ipynb makes
# the per-unit summary (auditory test, per-call-type z, selectivity index); GenerateDataBase.ipynb
# makes the per-trial table (response strength z, the PCA of trial-averaged KDE responses and the
# five PC weights per trial); decodingCallTypesNaiveBayes.ipynb and DataBaseMerge.ipynb run the
# single-unit decoder; decodingCallTypesNaiveBayesPart2.ipynb and decoders.py run the ensemble
# decoders; plotConfusions.ipynb makes Figure 4; GenerateMLFilters.ipynb makes the MRFs, the LDA,
# the volume, the neural noise and the Figure 5 regressions (its printed outputs reproduce the
# paper's F(1,79) = 8.975, 6.73, 8.75 and F(4,76) = 5.832); EPHYS4-Population_Clustering.ipynb
# and Supplementary Calculations.ipynb make the Figure 6 clusterings. The acoustic clustering reads
# a vocalization parameter table (vocParamTable.h5) and a stimulus segment table that are not in
# the repository.
#
# Data the paper used (STAR Methods, Animals; Playback experiment and stimuli; Electrophysiology).
# Awake data (this dataset, CRCNS aa-5, doi 10.6080/K0TT4P5Q). Four freely behaving adult zebra
# finches, two pair-bonded couples, ZF4F, ZF5M, ZF6M and ZF7F, each implanted in the left
# hemisphere with a 16-electrode array on a microdrive, recorded 4 to 8 h a day for 28 to 31 days
# while the electrodes were lowered by 0.5 to 1 turn a day (a recording site is bird, depth in
# turns, date and time). Stimuli were 110 distinct vocalizations of 10 call types (Be 12, LT 13,
# Th 5, Di 5, Ag 9, Wh 13, Ne 15, Te 15, DC 14, So 9), each played 10 times per site in pseudo
# random order with 3 to 6 s intervals. Spikes were sorted with a hierarchical, drift-tracking
# sorter; units with spike SNR above 5 are the paper's units; 730 sorted units, of which 292
# auditory. Measured variables per trial are spike times from 500 ms before to 4.5 s after
# stimulus onset (the dataset's description), with the stimulus waveform and call-type label.
# Units were assigned to CLM, CMM, Field L, NCM or the L/NCM border from histology and depth
# (SI Figure 5). Anesthetized data (CRCNS aa-4, doi 10.6080/K00C4T06, Elie and Theunissen 2015,
# 2019): six urethane-anesthetized birds, four (BlaBro09xxF, GreBlu9508M, WhiWhi4522M,
# YelBlu6903F) used for decoding, 123 stimuli of 9 call types (no Wh). The claims on it are
# `elsewhere`. The acoustic clustering uses the Theunissen lab vocalization database (3405 bouts
# from 45 birds, 7920 to 8136 calls, Elie and Theunissen 2016); the paper gives no deposit for it.
#
# Common method, used by several criteria (C1 to C12). Where the Methods leave a choice open and
# the code settles it, the code is followed and named; where they disagree, the Methods come first
# and the code's choice is a variant.
# C1 Units. A unit is a spike-sorted cluster with SNR above 5 (Results, Auditory units, paragraph
#   1; Methods, Electrophysiology and spike sorting). It is auditory when a two-tailed one-sample
#   t-test on its spike-count difference d (spikes in 0 to 500 ms after onset minus spikes in the
#   500 ms before) over all trials of all stimuli gives p < 0.01 (SI Figure 2A legend). The code
#   (GenerateReport.ipynb calc_zscore_all) computes t as mean(d)/sd(d) times sqrt(n) with n degrees
#   of freedom; a standard one-sample t-test (n - 1 df) is the Methods reading and the code's is a
#   variant.
# C2 Response strength Z per trial. The Methods text reads as d z-scored with the mean and SD of d
#   over all trials and stimuli of the unit (reading a). The code (GenerateDataBase.ipynb) divides d
#   by its SD over all trials (numpy std, ddof 0) without subtracting the mean (reading b), which
#   keeps Z relative to background as the Results describe. The decoder results do not depend on
#   the reading (a Gaussian naive Bayes is unchanged by a shift of one feature). Only vocalization
#   stimuli are used.
# C3 Per-call-type Z and the selectivity index SI (Figure 3C, 3D). SI = (1 - mean(zCT)^2 /
#   mean(zCT^2)) / (1 - 1/n) over the n = 10 call types (Methods, Response strength). zCT is read
#   as (a) the mean of the trial Z of C2 over all trials of the call type (Methods), or (b) the
#   code's zCT, mean(d)/sd(d, ddof 1) over the trials of the call type (GenerateReport.ipynb
#   calc_zscore_category), which is what summarySel.pkl and the Figure 5F regressor use. Reading (a)
#   is computed on the Z of C2 reading (b): with C2 reading (a) the mean of zCT over call types is
#   near zero and SI is near 1/(1 - 1/n) = 1.11 for every unit, outside the 0 to 1 range the
#   Figure 5F legend gives for SI.
# C4 Time-varying response T (Methods, PC analysis; GenerateDataBase.ipynb). For each unit and
#   stimulus with at least 5 trials, the trial-averaged response is a Gaussian KDE of the spike
#   times with a 30 ms kernel, sampled at 1 ms over the first 1000 samples of the stored KDE (the
#   code's time base, which starts before stimulus onset; the stored tKDE fixes it). A PCA (sklearn)
#   over all these responses of all auditory units gives the PCs; each trial's T1 to T5 are the
#   projection of its spike train (1000 per spike at the sample of the spike) minus the PCA mean
#   onto the first five PCs. The PCA is fitted separately for each dataset.
# C5 Decoder (Methods, Naive Bayesian decoder). sklearn GaussianNB with uniform priors (code), on
#   Z (code Z) or on Z with T1 to T5 per unit (code Z+T). Units used are those with responses to all
#   110 stimuli and at least 2 trials of each (Methods; the code keeps units with 110 distinct
#   stimuli). Cross-validation is open. Reading (a), the Methods: for each call type the trials of
#   one exemplar stimulus are held out and tested, the decoder trained on the rest. Reading (b), the
#   code (decoders.naiveBayes): one randomly chosen trial of every stimulus is held out and tested,
#   the decoder trained on the remaining trials of all stimuli, and this is repeated (nperm = 100
#   repetitions by default in decoders.py, used for the ensembles; one repetition in the
#   single-unit notebook). For ensembles, training rows join the i-th trial of each unit to the
#   same stimulus, with random redraws for units with fewer trials (code). The confusion matrix sums
#   the posterior probabilities of the test trials by true call type. PCC is (a) the mean of the
#   diagonal of the row-normalized matrix (Methods, Figure 4 legend) or (b) the trace of the summed
#   matrix over the number of test trials (code). Chance is 10% (9 call types, 11.1%, without Wh).
# C6 The 100 good units. Units with 110 stimuli whose single-unit PCC Z+T is above 12% (Results,
#   Decoding call types, paragraph 2; Methods, Naive Bayesian decoder, paragraph 6; code
#   decodingCallTypesNaiveBayesPart2.ipynb, pcc > 12).
# C7 Ensembles. Ensembles are drawn from the 100 good units across birds and areas: all
#   combinations of 1 and 2 units, 10,000 random draws for larger sizes (sizes 1, 2, 3, 4, 5, 10,
#   15, 20 in the code), for the Figure 4B curve. For Figure 5, 1800 random 20-unit ensembles, each
#   with 100 held-out repetitions (Methods). The paper's 1746 ensembles are those of the 1800 with
#   PCC above 30% (GenerateMLFilters.ipynb, indGood = pcc > 30, printed sum 1746); the Methods do
#   not state this filter. Readings, (a) the code's filter and (b) all 1800 ensembles.
# C8 Ensemble-corrected statistics (Methods, Statistical analysis). With ns units sampled and
#   ensembles of ne, neff = ns - ne + 1 (81 for ns = 100, ne = 20). Corrected variance s_c^2 =
#   ns/(ns - ne) times the sample variance over ensembles; SEM = s_c/sqrt(neff). Two-sample t-tests
#   use these SEMs with 2 neff - 2 df (t(160)); paired tests across ensembles use neff - 1 df
#   (t(80)). Regression F = (neff/n)((SST - SSE)/(k - 1))/(SSE/(n - k)), with n ensembles, k model
#   parameters including the intercept, and df (k - 1, neff - k) (F(1,79), F(4,76)). R2adj = 1 -
#   (SSE/(n - k))/(SST/(n - 1)). The code (GenerateMLFilters.ipynb) implements these formulas.
# C9 MPS and MRFs (Methods, Modulation receptive fields; GenerateMLFilters.ipynb). Stimulus MPS by
#   soundsig BioSound (spectroCalc at 1 kHz sample rate, 50 Hz frequency spacing, 0 to 10 kHz;
#   mpsCalc with a 100 ms window, Norm = True). The window of sound is the first 500 ms of the
#   stimulus in the Methods; the code takes 500 ms before to 500 ms after onset (variant). Each MRF
#   component of a unit is the sum over stimuli of (MPS minus the mean MPS over stimuli) weighted by
#   the unit's trial-averaged Z (MRF-Z) or trial-averaged Tk (MRF-Tk), six components per unit. The
#   code keeps temporal modulations from -50 to 50 Hz and spectral modulations from 0 to 4 cyc/kHz.
# C10 LDA space and volume. Between covariance of the call-type mean MPS, within covariance the
#   mean over call types of the covariance of single MPS about their call-type mean; the LDA axes
#   are the eigenvectors of pinv(within) times between (code, rcond 1e-4). The Methods name the
#   first three discriminant dimensions, read as the three of largest eigenvalue. The code calls
#   numpy eigh and takes its first three columns, which eigh orders by ascending eigenvalue; this
#   is a variant to be run as written. Each MRF component is projected on the three axes and divided
#   by 110 times the SD of its response variable over all trials (code). The volume of an ensemble
#   is the determinant of the 3x3 covariance of its 120 projected vectors (Methods); the
#   regressions use its natural log (code).
# C11 Ensemble regressors. Mean over the 20 units of SI (C3), of Entropy Selectivity (ES), and of
#   neural noise. ES = 1 - H/log2(10) with H the entropy of the diagonal of the unit's single-unit
#   Z+T confusion matrix; the code normalizes the diagonal to sum 1 before the entropy (reading a),
#   the Methods formula uses the diagonal PCC values directly (reading b). Neural noise per unit is
#   the variance of trial Z within each call type, averaged over the 10 call types (Results; code,
#   numpy std ddof 0 squared); the Figure 5 legend says standard deviation (variant).
# C12 Neural clustering (Methods, Hierarchical clustering of neural ensemble activity;
#   EPHYS4-Population_Clustering.ipynb). For an ensemble, a stimulus by (units x 6) matrix of
#   trial-averaged Z and T1 to T5. The code embeds it with UMAP (default parameters, 2 dimensions)
#   and builds a Ward linkage; the Methods name hierarchical agglomerative clustering only. Readings,
#   (a) UMAP then Ward (code), (b) Ward on the averaged responses. The tree is cut at 499 evenly
#   spaced distance thresholds between its smallest and largest linkage distance (code) and the cut
#   with maximal ARI against the labels is kept, giving ARIcall or ARIacoustic and the optimal
#   number of clusters. ARIacoustic is computed on the stimuli that have an acoustic label.
# Readings. Where a criterion says "under one reading", the readings meant are those of a reported
# number (which units or ensembles form a count or a mean, the top 10% or 5%, the C7 filter, the
# Results' variance or the legend's SD in C11). Readings of a method (C1, C2, C3, C5 cross
# validation and PCC, C9 sound window, C10 axes, C11 ES) follow docs/protocol.md: the Methods
# reading is the main one and the code's a variant, except where the Methods leave the choice open
# and the code settles it (C12 UMAP), where the code's is the main one. When the method readings
# give different outcomes, the author adopts the reading the paper best supports, as an assumption,
# and shows the others.
# Random draws (ensembles, held-out trials, UMAP) use any seed; a seed is a standard choice that
# should not change an outcome judged on averages over many ensembles.
schema_version: 2
paper: doi:10.1016/j.celrep.2023.112034
claims:
- id: stimulus-set-link
  kind: link
  statement: The dataset holds the awake playback experiment the paper describes, four birds
    (ZF4F, ZF5M, ZF6M, ZF7F) and 110 distinct stimuli labelled with the 10 call types in the
    paper's numbers.
  source: STAR Methods, Playback experiment and stimuli, paragraph 3; Animals, paragraph 2
  quote: For the awake dataset we used 110 distinct stimuli sampling 10 call-types
  expected:
  - quantity: distinct stimuli
    value: 110
    tolerance: 0
  - quantity: birds
    value: 4
    tolerance: 0
  criterion: Count the distinct stimulus files and their call-type labels over all units, and the
    birds. Reproduced when there are 4 birds and the stimulus counts per call type are Be 12, LT 13,
    Th 5, Di 5, Ag 9, Wh 13, Ne 15, Te 15, DC 14 and So 9 (110 in all); partially reproduced when
    the total is 110 but up to two call-type counts differ by one (a label variant such as Tu for
    Th); not reproduced otherwise.
- id: auditory-units
  statement: Of 730 spike-sorted units in the awake dataset, 292 (40.1%) were auditory.
  source: STAR Methods, Electrophysiology and spike sorting, last paragraph; SI Figure 2A legend
  quote: In the awake dataset, we recorded the activity of 730 spike-sorted units of which 292 were
    classified as auditory (40.1%).
  expected:
  - quantity: spike-sorted units (SNR above 5)
    value: 730
    tolerance: 73
  - quantity: auditory units
    value: 292
    tolerance: 29.2
  - quantity: auditory fraction
    value: 40.1
    tolerance: 4.01
    unit: percent
  criterion: Units and the auditory test as in C1. The dataset may hold only part of the sorted
    units (the descriptor says pickle files are for units); the readings of the denominator are
    (a) all units the dataset holds with SNR above 5, (b) all units the dataset holds. Reproduced
    when the auditory count is within tolerance and, under one reading, the total and the fraction
    are; partially reproduced when only the auditory count is.
- id: inhibited-units
  statement: In the awake dataset 46 of the 292 auditory units (15.7%) were inhibited by sound.
  source: SI Figure 2A legend
  quote: In the awake dataset (4 birds), 292 units had z scores that were significantly different
    from zero and 46/292 (15.7 %) that were inhibited by sounds.
  depends_on:
  - auditory-units
  expected:
  - quantity: inhibited auditory units
    value: 46
    tolerance: 4.6
  - quantity: inhibited fraction of auditory units
    value: 15.7
    tolerance: 1.57
    unit: percent
  criterion: Auditory units as in C1; a unit is inhibited when its mean spike-count difference d
    over all trials is negative (code, zAud < 0). Reproduced when both values are within tolerance.
- id: fig3c-peak-call-types
  statement: Across the 292 auditory units, distress calls had the highest average response
    strength followed by song; 51 units had their peak response to distress calls and 61 to song;
    the preference is biased toward the longer calls (Ag, Be, So, Di).
  source: Figure 3C legend; Results, Auditory units have heterogeneous and selective responses,
    paragraph 2
  quote: distress calls (Di) had the highest average response strength followed by song (So), etc.
    ... 51 units had the peak responses for distress call, 61 for song, etc.
  depends_on:
  - auditory-units
  expected:
  - quantity: units with peak Z for Di
    value: 51
    tolerance: 5.1
  - quantity: units with peak Z for So
    value: 61
    tolerance: 6.1
  criterion: Per-call-type Z of each auditory unit under the two readings of C3 (zCT). The call
    types are ranked by their mean zCT over units. Reproduced when, under one reading, Di ranks
    first and So second, both peak counts are within tolerance, and Ag, Be, So and Di are four of
    the five call types with the most peak units; partially reproduced when Di and So are the two
    highest ranked but a count is outside tolerance. The paper gives no rule for "a bias toward the
    longer calls"; four of the top five is a reading, and the peak count of every call type is
