    value: -0.65
    tolerance: 0.05
    unit: s
  criterion: 'Methods, Quantification of the phase of local bumps, and code lines 4600 to 4939. Trials,
    from the code: one direction, distance 4 or 5, the code''s valid trials (first-attempt trials not
    flagged as lapses; Methods, Bayesian model, describe the lapse mixture), trials with low rate in -1.5
