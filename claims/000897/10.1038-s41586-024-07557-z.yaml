    paper, which gives three: (a) Methods, rate -500 to -300 ms and slope -550 to -250 ms before offset;
    (b) Extended Data Fig. 4 legend, rate in the last 200 ms and slope in the last 300 ms; (c) Results,
    Ramping, paragraph 3, rate and slope both in -550 to -250 ms. Neurons with at least 10 trials in each
