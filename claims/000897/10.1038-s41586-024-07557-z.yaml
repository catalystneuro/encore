# Claims for Neupane, Fiete & Jazayeri (2024), Nature 630, 704-711, on dandiset 000897.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record (open access, CC BY 4.0) as served by Europe PMC
# (PMC11224022), main text, Methods and the Extended Data figure legends; it includes the
# correction of 4 July 2024. The Supplementary Information (Supplementary Discussion only), the
# Supplementary Tables (recording sites and probe layouts) and the Source Data were not in the
# text read; no claim here rests on them. Figures were not opened.
#
# Code read: github.com/jazlab/Neupane_Fiete_Jazayeri_mental_navigation, commit 4bee109
# (2 December 2024). MATLAB scripts mnav_ec_fig1.m to mnav_ec_fig4.m, gc_CAN_model_simulation.m,
# BLS_model_self_consistency.m and utilities/. They start from preprocessed .mat tensors kept on
# Dropbox (neuron x 1 ms bin x trial, aligned to joystick onset, joystick offset, first image
# onset and the ITI, with trial fields ta, tp, curr, target, attempt, succ, trial_type, seqq,
# validtrials_mm) and from saved intermediate results; several steps (Extended Data Fig. 3, the
# rate against slope ANOVA, the Bayesian fits, the GP null) load results the repository does
# not compute. Where the code settles a detail the Methods leave open, the criteria below say
# so with the line; where it disagrees with the Methods, the Methods are the main reading and
# the code a variant.
#
# Data the paper used. Two male rhesus monkeys (Macaca mulatta), A (8.4 kg, 6 years; the code
# names it amadeus) and M (11.5 kg, 11 years; mahler). Task MNAV: six landmark images on a line,
# adjacent ones 0.65 s apart at the joystick speed; start image shown above fixation, target
# below; after the go cue the monkey deflects a 1D joystick, with the landmarks invisible, and
# releases it; 30 start and target pairs (distances 1 to 5 landmarks, both directions). The
# actual vector v_a (code ta, signed, seconds, positive rightward) and the produced vector v_p
# (code tp, joystick deflection duration with sign) are the behavioural variables. A trial is
# correct when made in a single attempt; a second attempt marks the trial incorrect. Trials of
# the visual NTS task (landmarks visible, code trial_type < 3) were interleaved in some
# sessions; MNAV trials are code trial_type 3. In monkey A two landmark sequences were used
# (code seqq 1 and 2). Recordings: 32 sessions (A 17, M 15) in the posterior entorhinal cortex
# with 32 and 64 channel Plexon V-probes, 30 kHz, Open Ephys; Kilosort 2 and phy gave 1,478
# single and multi-units (A 614, M 864), all analysed. Eye position (Eyelink, 1 kHz) and joystick
# voltage (1 kHz) were recorded. ITI segments longer than 4 s were pooled for comparisons.
# Behavioural training and generalization sessions (Fig. 1c,e) came before the recording
# chamber was implanted; the code says the raw training data are shared on request. The dandiset
# is described as entorhinal electrophysiology from two monkeys in the mental navigation task.
#
# Shared method, the periodicity index (PI), used by several claims (Methods, Periodicity and
# ramping; code mnav_ec_fig2.m get_gridness, lines 3683 to 3772, parameters lines 35 to 48 and
# 3570 to 3580):
# - Trials: MNAV first-attempt trials over at least three landmarks (code attempt == 1,
#   |target - start| >= 3, |tp| > 1 s, seqq < 3), each direction analysed separately (code
#   dir_condition = sign(ta)).
# - Rate: spikes in 1 ms bins smoothed with a Gaussian of SD 100 ms (Methods); the code's kernel
#   is 200 ms wide (cut at 1 SD), followed here. Window from joystick onset to 500 ms before
#   joystick offset; each trial detrended by its own linear fit (code line 3747).
# - ACG: per trial, the mean-removed rate autocorrelation normalised to 1 at lag 0, lags up to
#   2,400 ms; trials with mean smoothed rate at or below 0.05 dropped (code line 3756); averaged
#   over trials. A neuron needs more than 15 such trials (Methods and code line 4298).
# - PI at lag L: correlation of the mean ACG with itself circularly shifted by L, minus its
#   correlation with itself shifted by L/2 (code lines 3763 to 3766; Methods steps 5 and 7).
#   Lags 0 to 1,300 ms (Methods, main reading); the code uses 100 to 1,600 ms in 10 ms steps
#   (variant). Periodicity is the lag of the maximum PI.
# - Null: surrogate rates from a Gaussian process with a squared exponential kernel (variance 1,
#   length 100 ms), passed through an inhomogeneous Poisson process and smoothed as above, 1,000
#   repeats (Methods); the code's get_gpfr sets the GP mean to the mean rate of the trials and
#   has no Poisson step (variant). The surrogate file the code loads is not in the repository, so
#   the null is generated afresh. Open, the classification rule, two readings: (a) the code's,
#   score = maximum PI minus the mean PI from the first positive lag on, periodic when the score
#   exceeds the maximum over lags of (mean + 2 SD) of the surrogate scores (lines 3771 and 4295);
#   (b) the Methods' words, periodic when PI at any lag exceeds the surrogate PI mean + 2 SD at
#   that lag. Open, the surrogate trial durations, two readings: the durations of the neuron's
#   own trials, or one global null at the median trial duration as the code's single threshold
#   implies.
schema_version: 2
dataset:
  archive: dandi
  id: 000897
paper: doi:10.1038/s41586-024-07557-z
claims:
- id: fig1bc-produced-matches-actual
  statement: In MNAV the produced vectors match the actual vectors in direction and magnitude; performance
    is quantified by the slope of the regression of v_p on v_a.
  source: Results, paragraph 4 (The monkeys learned to perform MNAV); Figure 1b,c
  quote: The produced vectors ( v p ) quantified in terms of temporal distance (magnitude) and direction
    (sign) closely matched the actual vectors separating the start and target landmarks
  criterion: Per recorded session and monkey, ordinary least squares regression of signed v_p on signed
    v_a over all MNAV trials with no exclusion (Methods, Bayesian model of behaviour, last paragraph,
    says Fig. 1b,c slopes include all trials); the code (mnav_ec_fig1.m, get_tatp, lines 242 to 266) drops
    only trials without a recorded production (0.01 < |tp| and tp < 99 s), followed, and fits both all
    trials (black line) and validtrials_mm trials only (red line); the valid-only fit is a variant. "Closely
    matched" is judged against the paper's own performance criterion, a regression slope of 0.8 (Methods,
    Performance criterion). Reproduced when, in each monkey, the median session slope is at least 0.8 and
    every slope is positive; partially reproduced when that holds in one monkey only. Fig. 1c pools behavioural sessions with at least 400 successful MNAV
    trials (code cp.mintrial_in_session), most of them training sessions; the recorded sessions are a
    subset, and the result is reported for the sessions the dataset holds, with that subset named as a
    deviation.
- id: fig1e-immediate-generalization
  statement: After training on 15 start and target pairs, the monkeys performed the 15 held-out pairs
    with high performance from the first generalization session.
  source: Results, paragraph 5; Figure 1d,e
  quote: we found that they were able to readily generalize with high performance from the very first
    session
  criterion: Per monkey, the regression slope of v_p on v_a (all trials) on the held-out pairs in the
    first generalization session (monkey A sequence 1, monkey M sequence 2, code mnav_ec_fig1.m lines
    24 to 25). Reproduced when that slope is at least 0.8, the training criterion of the Methods. The
    generalization sessions preceded the recordings (Methods, Electrophysiology, paragraph 1), so the
    test needs behavioural sessions the paper describes but may not have deposited; whether the dataset
    holds them is the author's to find.
- id: fig2-periodic-proportion
  statement: A substantial fraction of EC neurons have significantly periodic activity during mental navigation,
    37% (231/614) in monkey A and 36% (311/864) in monkey M, and the proportion per session ranged from
    0% to 45% depending on recording site.
  source: Results, Neural signatures, paragraph 2; Figure 2c,d
  quote: Across sessions, the proportion of neurons with a significant PI ranged from 0% to 45% depending
    on the recording site in the posterior EC, with an overall average of 37% (231/614) and 36% (311/864)
    in monkeys A and M, respectively
  expected:
  - quantity: periodic neurons, monkey A
    value: 231
    tolerance: 23.1
    unit: neurons
  - quantity: periodic neurons, monkey M
    value: 311
    tolerance: 31.1
    unit: neurons
  - quantity: highest per-session proportion of periodic neurons
    value: 45
    tolerance: 4.5
    unit: '%'
  criterion: PI and classification as in the opening comment. A neuron counts as periodic when it is periodic
    in either direction (code count_ramp_periodicity_leftright, line 4550); the denominator is all units
    of the monkey (614 and 864). Each combination of the open readings (classification rule a or b, surrogate
    durations, Methods or code lag range) is run. Reproduced when, under the readings, both counts are
    within tolerance and every session's proportion lies in 0 to 49.5% (the reported range widened by
    10% of its upper bound); partially reproduced when one of these three conditions fails and the others
    hold. The 0.37 printed for A is 231/614 = 0.376; the counts are the expected values.
- id: fig2d-periodicity-at-065
  statement: Across neurons with significant PI, the lag of the peak PI was at or near 0.65 s, the temporal
    distance between landmarks.
  source: Results, Neural signatures, paragraph 2; Figure 2d; Extended Data Fig. 2a
  quote: across neurons with significant PI, the peak lag was at or near 0.65 s, which matches the temporal
    distance between consecutive landmarks
  depends_on:
  - fig2-periodic-proportion
  expected:
    quantity: median periodicity of periodic neurons
    value: 0.65
    tolerance: 0.05
    unit: s
  criterion: Periodic neurons and periodicity as in fig2-periodic-proportion, per monkey and direction
    (Extended Data Fig. 2a shows the two directions). "Near" is read with the 100 ms window centred on
    0.65 s that the paper uses for periodicity at 0.65 s (Results, paragraph 4, on Extended Data Fig.
    2c), hence the tolerance of 0.05 s. Reproduced when the median periodicity is within 0.60 to 0.70
    s in every monkey and direction; partially reproduced when in some. The mode, in 50 ms bins (a plotting
    choice), is reported as well.
- id: ed3-no-eye-hand-periodicity
  statement: Eye position (horizontal and vertical) and joystick position during the navigation epoch
    show no periodicity; their PI at 650 ms is below chance.
  source: Results, Neural signatures, paragraph 2; Extended Data Fig. 3a-c
  quote: Complementary analyses revealed no such periodicity in the monkeys' eye and hand (joystick) movements
  statistics:
  - about: horizontal eye position PI at 650 ms against chance
    test: one-tailed t-test
    statistic: t(99) = -67.8
    p: 0.0001
    p_relation: <
    n: 100 bootstraps
  - about: vertical eye position PI at 650 ms against chance
    test: one-tailed t-test
    statistic: t(99) = -81.6
    p: 0.0001
    p_relation: <
    n: 100 bootstraps
  - about: joystick position PI at 650 ms against chance
    test: one-tailed t-test
    statistic: t(99) = -138.1
    p: 0.0001
    p_relation: <
    n: 100 bootstraps
  expected:
  - quantity: average PI at 650 ms, horizontal eye
    value: -0.25
    tolerance: 0.025
  - quantity: average PI at 650 ms, vertical eye
    value: -0.44
    tolerance: 0.044
  - quantity: average PI at 650 ms, joystick
    value: -0.53
    tolerance: 0.053
  criterion: 'A claim of absence. The signals are treated as the firing rates are for the PI (opening
    comment), per trial between joystick onset and 500 ms before offset; the code for this figure is not
    in the repository (mnav_ec_fig2.m line 450 says it is to be copied in), so the bootstrap is open.
    Readings: (a) 100 resamples of the pooled trials with replacement, full size; (b) 100 subsamples of
    one third of the trials without replacement, as in the code''s peak-phase bootstrap. Open, what "chance"
    is, two readings from the legend: (a) the threshold of two SD above the GP surrogate PI at 650 ms;
    (b) the mean GP surrogate PI at 650 ms. Open, any smoothing of the eye and joystick signals (the paper
    gives none); the PI rate smoothing is used. The paper''s test is the one-tailed t-test (df 99) of the
    100 bootstrap PIs at 650 ms against chance, with the alternative that PI is below chance. Reproduced
    when, for each of the three signals, that test finds PI below chance at p < 0.0001 (the legend''s P
    << 0.0001); not reproduced when, for any signal, PI at 650 ms is significantly above chance by the same
    test with the opposite tail at p < 0.05; partially reproduced otherwise. The three mean PIs are compared
    with the expected values and reported either way.'
