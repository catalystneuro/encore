  criterion: 'Four-way ANOVA with distance (absolute), start landmark, target landmark and direction (Methods;
    code mnav_ec_fig3.m line 1166), per neuron with at least 10 correct trials in each of the 30 conditions;
    F-statistics of distance and of start (target) landmark compared across neurons with a significant
    effect (p < 0.05) of either. Open, the window: (a) -500 to -300 ms before offset (Methods); (b) the
    last 200 ms (legend); the code''s -400 to -300 ms is a variant. Open, the test: (a) t-test on the
    differences of F (Methods, and code line 1202, paired); (b) two-sample t-test (legend). Reproduced
    when distance F exceeds both landmark F at p < 0.0001 in both monkeys under all readings; partially
    reproduced when under some.'
- id: fig3e-xcorr-conserved-iti
  statement: The structure of pairwise cross-correlations among simultaneously recorded periodic neurons
    is conserved between the mental navigation epoch and the ITI (monkey A r = 0.84, monkey M r = 0.86).
  source: Results, Ramping, paragraph 5; Figure 3e; Extended Data Fig. 5b
  quote: Notably, the structure of correlations across the pairs was similar between the two periods
  statistics:
  - about: monkey A, MNAV against ITI pair cross-correlations
    test: Pearson correlation
    statistic: r(188) = 0.84
    p: 0.0001
    p_relation: <
  - about: monkey M, MNAV against ITI pair cross-correlations
    test: Pearson correlation
    statistic: r(292) = 0.86
    p: 0.0001
    p_relation: <
  depends_on:
  - fig2-periodic-proportion
  expected:
  - quantity: correlation of pair cross-correlations, monkey A
    value: 0.84
    tolerance: 0.084
  - quantity: correlation of pair cross-correlations, monkey M
    value: 0.86
    tolerance: 0.086
  criterion: 'Code mnav_ec_fig3.m lines 226 to 451 and 677 to 860, and Extended Data Fig. 5b legend. One
    session per monkey; the code uses its fifth monkey A session and first monkey M session in its session
    list, whose order is not shown; open, the readings are the chronological fifth (A) and first (M) session,
    and each session holding at least 20 periodic neurons. Neurons: the most periodic by PI score, (a)
    20 (Fig. 3e legend) or (b) 25 (code line 741 and Extended Data Fig. 5a). 20 neurons give 190 pairs,
    the count in the Results and r(188) for monkey A; 294 pairs (r(292)) for monkey M match neither 20 nor 25
    neurons (190 or 300 pairs), so the M pair count is open and is reported. Rates smoothed as for the PI, linearly detrended,
    cross-correlation normalised to 1 at lag 0, averaged over trials; MNAV first-attempt trials of distance
    above 3 from onset to 500 ms before offset; ITI segments longer than 4 s, the first 3 s (code). Per
    pair, the mean cross-correlation over lags -5 to 5 ms; Pearson r across pairs between MNAV and ITI.
    Per session reading, reproduced when, for each monkey, r is within tolerance and p < 0.0001 under one
    neuron reading; partially reproduced when r is positive and p < 0.0001 but out of tolerance. The outcome
    is the one all session readings give; when they differ, the claim is methods_underspecified with every
    session shown.
    The degrees of freedom (188, 292) are compared with the pair counts.'
- id: ed5-xcorr-conserved-other-epochs
  statement: The conserved correlation structure generalizes to the inference epoch, error trials and
    both directions of movement.
  source: Results, Ramping, paragraph 5; Extended Data Fig. 5a-c
  quote: This finding was robust and generalized to all task epochs, including the inference epoch (during
    start and target landmark presentation but before mental navigation), error trials and for both directions
    of movement
  depends_on:
  - fig3e-xcorr-conserved-iti
  criterion: As fig3e-xcorr-conserved-iti, with the MNAV pair values correlated against those of the inference
    epoch (first image onset -0.2 to 1.2 s, code lines 792 to 793), error trials (first attempt of multi-attempt
    trials, Methods) and each direction separately. Extended Data Fig. 5c tests Pearson correlation at
    p < 0.05 with Bonferroni correction across lags. Reproduced when every comparison gives a positive
    r with p < 0.05 at lag 0 after Bonferroni correction over the lags tested (-900 to 900 ms, code lines
    433 to 451), in both monkeys; partially reproduced when most do.
- id: fig4h-periodic-fano-factor
  statement: 'Many EC neurons have a Fano factor that is periodic at about 0.65 s: 55% (341/614) in monkey
    A and 43% (378/864) in monkey M.'
  source: Results, The behaviour of the monkeys, paragraph 4; Figure 4h; Extended Data Fig. 8
  quote: The proportion of neurons with a periodic Fano factor was 43% (378/864) in monkey M and 55% (341/614)
    in monkey A
  expected:
  - quantity: neurons with periodic Fano factor, monkey A
    value: 341
    tolerance: 34.1
    unit: neurons
  - quantity: neurons with periodic Fano factor, monkey M
    value: 378
    tolerance: 37.8
    unit: neurons
  criterion: 'Extended Data Fig. 8 legend and code mnav_ec_fig2.m plot_fanofactor, lines 991 to 1180.
    Correct MNAV trials with |tp| at least 2.3 s, one direction, at least 12 trials (code); spike counts
    in 200 ms windows stepped by 30 ms from joystick onset (code); Fano factor (variance over mean across
    trials) bootstrapped 100 times; Poisson null from the mean rate, 100 times (legend); each Fano time
    course linearly detrended, autocorrelated to 1.6 s and its PI computed as in the opening comment.
    Selection, open: (a) legend, PI significantly above the null by a two-sample t-test at p < 0.0001/20
    in the 300 to 900 ms lag window (the code''s window is 400 to 900 ms, a variant); (b) code ffgridness650,
    PI at 650 ms against the null by a one-tailed Welch t-test at alpha 0.01 (line 1135). Open, direction:
    a neuron counts if it qualifies in (i) either direction or (ii) direction 1. Denominator all units.
    Reproduced when, under one combination of readings, both counts are within tolerance and the periodicities
    of the selected neurons have a median within 0.60 to 0.70 s; partially reproduced when the median
    holds and the counts do not. Every combination is shown; the code does not compute the counts.'
- id: ed8-fano-periodic-without-rate-periodicity
  statement: The periodic Fano factor is not a by-product of firing-rate periodicity; it is also present
    in neurons whose firing rate is not periodic.
  source: Results, The behaviour of the monkeys, paragraph 4; Extended Data Fig. 8c,f
  quote: This periodicity was not a by-product of the underlying periodicity of firing rates, and was
    also evident in neurons with non-periodic activity
  depends_on:
  - fig4h-periodic-fano-factor
  - fig2-periodic-proportion
  criterion: The paper reports no test or count for this finding. The neurons are those not periodic
    in firing rate (fig2-periodic-proportion, either direction) that have a periodic Fano factor (fig4h-periodic-fano-factor,
    same readings). The code has a one-sided binomial test of cell counts against 5% chance with all units
    as the denominator (mnav_ec_fig2.m lines 445 to 448, counts 99/614 and 74/864, not labelled and not
    in the paper); reading it as this test, the count is compared with 5% of all units (main) and, as
    a variant, with 5% of the non-periodic neurons. Reproduced when p < 0.05 in both monkeys under the
    readings for which fig4h is run; partially reproduced in one. The counts are reported and compared
    with 99 and 74 for information only.
- id: ed10-motor-preparation-signal
  statement: Most EC neurons show a motor-related response before joystick offset, 77% (477/614)
    in monkey A and 70% (607/864) in monkey M, including most non-periodic neurons (81%, 368/452, in A
    and 89%, 432/481, in M).
  source: Extended Data Fig. 10 legend; Discussion, paragraph 1
  quote: Overall, the majority of neurons in both monkeys showed such motor-related response, 77% (477/614)
    in monkey A and 70% (607/864) in monkey M
  depends_on:
  - fig2-periodic-proportion
  expected:
  - quantity: motor-related neurons, monkey A
    value: 477
    tolerance: 47.7
    unit: neurons
  - quantity: motor-related neurons, monkey M
    value: 607
    tolerance: 60.7
    unit: neurons
  - quantity: motor-related non-periodic neurons, monkey A
    value: 368
    tolerance: 36.8
    unit: neurons
  - quantity: non-periodic neurons, monkey A
    value: 452
    tolerance: 45.2
    unit: neurons
  - quantity: motor-related non-periodic neurons, monkey M
    value: 432
    tolerance: 43.2
    unit: neurons
  - quantity: non-periodic neurons, monkey M
    value: 481
    tolerance: 48.1
    unit: neurons
  criterion: 'Code mnav_ec_fig2.m lines 3966 to 4006 and 422 to 443: direction 1, first-attempt trials
    of distance at least 3 with |tp| > 1.5 s, at least 6 trials; unsmoothed mean rate in tp - 1 to tp
    - 0.6 s and in tp - 0.4 to tp - 0.1 s after joystick onset; 200 bootstrap means of each, compared
    by a two-sample t-test at p < 0.0001 (legend and code); the code''s test is two-sided (ttest2, line
    4000), so a decrease also counts, followed; counting increases only is a variant. Non-periodic, PI score at or below threshold
    with more than 15 trials (code). Reproduced when all six counts are within tolerance; partially reproduced
    when the four proportions are each above 50%. The code''s direction (1 only) against either direction
    is shown as a variant.'
- id: fig4g-reset-model-fits-better
  statement: A Bayesian observer model whose timing variability grows sublinearly, as with resets at multiples
    of 0.65 s, fits the monkeys' behaviour better than a scalar-variability model without resets.
  source: Results, The behaviour of the monkeys, paragraph 6; Figure 4g
  quote: Fitting these two models to the monkeys' behaviour, we found that the model with intermediate
    resets was significantly better than the one without resets at capturing behaviour
  statistics:
  - about: monkey A, no-reset against reset model error
    test: paired t-test
    statistic: t(77) = 7.93
    p: 0.0001
    p_relation: <
  - about: monkey M, no-reset against reset model error
    test: paired t-test
    statistic: t(101) = 16.56
    p: 0.0001
    p_relation: <
  criterion: Methods, Bayesian model of behaviour; mnav_ec_fig4.m lines 1124 to 1184. Fig. 4g compares
    the code's models 10 and 12 (bls_offset_noncounter_oa and bls_offset_counter_oa_atp, line 1126 and
    get_mdl_names), whose functions are not in the repository; the repository holds only models 1 and
    2 (utilities/bls_offset_counter_nonuniformPrior_self.m and bls_offset_noncounter_nonuniformPrior_self.m),
    which are used here, and what the oa and atp variants change is open. Per session, both models (measurement noise wm, production
    noise wp, offset b; reset model with SD proportional to the square root of the interval, no-reset
    model proportional to it) fit by maximum likelihood (fminsearch from [0.5, 0.5, 0]) to |v_p| against
    |v_a| of correct MNAV trials, with the code's prior (linear in the interval, c = 0.5846, m = -0.1026,
    over 0.65 to 3.25 s). The Methods exclude lapses with a Gaussian against uniform (0 to 3 v_p) mixture
    before fitting; the code has none; Methods main, no exclusion a variant. Per session, model error
    is the absolute difference between the data's and the model's summed squared bias plus variance across
    distances (code line 118). Paired t-test of no-reset against reset error across sessions. Reproduced
    when, in each monkey, the reset model has lower error with p < 0.0001. The code's paired t-test leaves
    out the first session (line 1184; its ttest2 at line 1133 is a variant), so the degrees of freedom
    imply 79 and 103 sessions, more than the 17 and 15 recorded, so the paper's fit used behavioural sessions
    beyond the recordings; the test is run on the sessions the dataset holds, and a smaller n is named
    as a deviation.
- id: fig4b-learned-landmark-input
  statement: In the model, Hebbian plasticity from grid-cell modules to a landmark unit selectively strengthens
    inputs from the cells whose periodicity and phase match the external landmarks, so that the internal
    drive alone reproduces the landmark input when it is removed.
  source: Results, The behaviour of the monkeys, paragraph 2; Figure 4a,b; Extended Data Fig. 6a-c
  quote: In the presence of external landmarks, synapses were modified such that CAN inputs mimicked the
    external input, and when the external input was extinguished, the CAN drive alone was able to emulate
    that external drive
  criterion: A simulation, not a test on recorded data. The code's utilities/gc1d_init_oja.m and the Methods
    (Oja's rule, learning rate below 1e-7, weights centred per module) with an external input at 0.65
    s periodicity and four phases. Reproduced when, after learning, the grid cell with the largest weight
    onto the landmark unit belongs to the module of matching periodicity and its phase is within one unit
    spacing of the landmark phase for every phase tested.
- id: fig4d-model-subscalar-variability
  statement: The CAN model without landmarks shows scalar variability, its SD growing linearly with temporal
    distance, while the model with endogenous landmarks shows subscalar variability, with a power-law
    exponent below 1.
  source: Results, The behaviour of the monkeys, paragraph 5; Figure 4c,d
  quote: We verified this sublinearity by nonlinear regression in which the standard deviation and mean
    had a power-law relationship with an exponent of less than unity
  statistics:
  - about: power-law exponent b against 1, model with landmarks
    test: one-tailed t-test
    statistic: t(999) = -11.29
    p: 0.0001
    p_relation: <
    n: 1000 bootstraps
  criterion: 'A simulation, not a test on recorded data. gc_CAN_model_simulation.m and utilities/gc1d_*.m:
    two rings of 364 units, landmarks at states 60 to 300 in steps of 60, velocity 0.42 with landmarks
    and 0.35 without, Weber fraction 0.8 (Fig. 4c loads wm8), 50 simulations; times to reach each landmark
    state; 1,000 bootstrap SD and mean; s.d. = a mean^b + c fitted per bootstrap; one-tailed t-test of
    b against 1. The no-landmark velocity, Methods (CAN model), main reading: set by a grid search done
    separately for each of the five base intervals so that the mean time to reach each distance equals
    that of the landmark model (Extended Data Fig. 6e); the script''s single wolm_speed of 0.35 (line 20)
    is a variant. Reproduced when b < 1 at p < 0.0001 with landmarks and the no-landmark model''s b is
    not significantly below 1. The script''s own wm = 0.05 and file name disagree with Fig. 4c; Fig. 4c''s
    values are used.'
- id: ed6d-model-fano-periodic
  statement: In the CAN model with endogenous landmarks, the Fano factor of individual units fluctuates
    periodically with a periodicity of 0.65 s, and the periodicity of the Fano factor follows that of
    unit activation across a range of velocities.
  source: Results, The behaviour of the monkeys, paragraph 4; Extended Data Fig. 6d
  quote: As expected by the presence of reset events, the Fano factor of individual units fluctuated periodically
    with a periodicity of 0.65 s
  criterion: 'A simulation, not a test on recorded data. Methods (Fano factor of CAN model units): 50
    simulations under noisy velocity input, mean and variance of each unit across simulations, then the
    PI procedure of the opening comment on the Fano factor and on the activation time series. Code mnav_ec_fig4.m
    lines 293 to 345: each unit''s Fano time course linearly detrended, ACG to 2,000 lags, PI at lags
    1 to 1,600, periodicity the lag of maximum PI below 750; the code loads its simulations precomputed
    (ff_fr_dense_sampled_speed_wm2), so they are run afresh with the model of fig4d-model-subscalar-variability.
    Velocities, Extended Data Fig. 6d, a range around 42 a.u. whose values the paper does not give; open,
    a standard grid is used and named. Reproduced when, at the velocity whose unit-activation periodicity
    is 0.65 s, the median Fano-factor periodicity across units lies within 0.60 to 0.70 s (the 100 ms
    window the paper uses for "at 0.65 s"), and Fano and activation periodicities rise together across
    velocities (positive Spearman correlation, p < 0.05, a standard choice); partially reproduced when
    one of the two holds.'
- id: ed5efg-tighter-phase-clustering
  statement: The relative phases of cell to cell cross-correlations of periodic EC neurons are more tightly
    clustered than predicted for grid cells by the CAN model.
  source: Results, The behaviour of the monkeys, paragraph 3; Extended Data Fig. 5e-g
  quote: we found a significantly tighter clustering of the relative phase distribution of cell–cell cross-correlation
    in our data, which differs from what is predicted for GCs in rodents
  criterion: Extended Data Fig. 5e-g legend. Per pair of simultaneously recorded periodic neurons (fig3e-xcorr-conserved-iti
    selection), the lag of the peak of the mean cross-correlation in the navigation epoch, and the same
    for pairs of model units (fig4d-model-subscalar-variability, landmark model). The paper names no test
    and no measure of clustering; both are open. Readings, spread taken as the SD of the peak lags or
    as their interquartile range, each compared between monkey and model pairs by a two-sample test of
    spread (Levene test, a standard choice). Reproduced when, in both monkeys, the spread is smaller than
    the model's at p < 0.05 under every reading; partially reproduced in one monkey. The outcome rests
    on choices the paper does not make, which is recorded as a deviation.
  depends_on:
  - fig3e-xcorr-conserved-iti
  - fig4d-model-subscalar-variability
