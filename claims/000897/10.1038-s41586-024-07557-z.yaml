- id: ed4d-overshoot-longer-period
  statement: For trials of the same desired distance, the periodicity of EC neurons is significantly longer
    (lower frequency) on overshoot trials (top tertile of produced vector) than on undershoot trials (bottom
    tertile).
  source: Results, Neural signatures, paragraph 4; Extended Data Fig. 4c,d
  quote: We found a small but significant increase in the periodicity (that is, lower frequency) for the
    top tertile compared to the bottom tertile
  statistics:
  - about: monkey M, overshoot against undershoot periodicity
    test: rank-sum test
    statistic: Z(194) = -5.80
    p: 0.0001
    p_relation: <
  - about: monkey A, overshoot against undershoot periodicity
    test: rank-sum test
    statistic: Z(161) = -3.3
    p: 0.0001
    p_relation: <
  depends_on:
  - fig2-periodic-proportion
  criterion: Extended Data Fig. 4d legend and code lines 2180 to 2508 and 496 to 604. Periodic neurons;
    correct (first-attempt) MNAV trials of distance 3, per direction; trials sorted by timing error (code
    |tp| - |ta|), bottom and top tertiles; each neuron's periodicity computed on each tertile as in the
    opening comment (the code's variant uses the window 0.1 s to tp - 0.4 s and lags 100 to 1,090 ms);
    neurons with fewer than 15 trials in a tertile dropped; neurons with periodicity 0 or above 1 s dropped
    (code). Rank-sum test of overshoot against undershoot periodicities across neurons. Reproduced when,
    in both monkeys, overshoot periodicity is larger with rank-sum p < 0.05; partially reproduced in one
    monkey. A printed Z of -3.3 gives p near 0.001, not below 0.0001, so the paper's bound is not used
    as the threshold; the paper's p bound is recorded as printed. The code assigns the left-direction
    list where the right is tested (lines 2259 to 2264), a bug not followed.
- id: fig3b-onset-and-offset-coding
  statement: Single EC neurons encode temporal distance in their firing rate before joystick onset, before
    joystick offset, or, in a small number, at both.
  source: Results, Ramping, paragraph 1; Figure 3b
  quote: Some neurons encoded distance at joystick onset, others at joystick offset, and a small number
    of neurons had a representation of distance at both onset and offset
  criterion: 'Cross-validated R2 (Methods, Cross-validated R2; code mnav_ec_fig3.m lines 1353 to 1508):
    correct MNAV trials, mean rate in the window, trials split at random into halves, a linear fit of
    rate on ordinal distance 1 to 5 on the training half scored on the held-out half, 50 splits averaged
    (code), each distance subsampled to the smallest count (code). Positive coding is mean R2 > 0 (code
    rsqthres = 0, R2 below -1 dropped). Open, the window: (a) 100 ms before onset and offset (Results);
    (b) 200 ms before (Methods, Cross-validated R2); the code''s time-warped windows (-200 to -100 ms
    before onset, -400 to -300 ms at offset) are a variant. Neurons with at least 10 trials per distance
    in both directions (code), direction 1 (code line 93). Reproduced when, under each reading and in
    each monkey, the proportions of neurons with positive coding at onset only and at offset only each
    exceed the proportion with positive R2 under the shuffled regressor (code line 1519), and the proportion
    coding at both is smaller than each of the two; partially reproduced when that holds under some readings
    only.'
- id: fig3d-offset-coding-stronger
  statement: At the population level distance is encoded weakly before joystick onset and robustly and
