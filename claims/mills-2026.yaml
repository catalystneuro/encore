  quote: while freezing and darting could not be decoded in either group
  depends_on:
  - fig2-recorded-neurons
  criterion: A claim of absence. As the code does (fig4h_all_decoding_workflow.py) within CS-shock
    trials, 5-fold over trials, neurons z-scored by the training trials, freezing (or darting)
    bins against an equal number of other bins, liblinear logistic regression, accuracy per bin
    against 20 label shuffles. The paper's test is the legend's Mann-Whitney U test of CS window
    accuracy against chance. Reproduced when it does not give accuracy above chance at p < 0.05
    for freezing or for darting in either group. The code prints no statistics for these decoders.
