- id: fig3h-cs-decoded-paired-only
  statement: CS identity can be decoded from ASt activity above chance during the cue in paired but
    not unpaired mice.
  source: Figure 3H; Results, ASt neuron activity is sufficient to drive freezing and avoidance
    behavior, paragraph 2
  quote: showed that CS identity could be decoded from ASt activity above chance in paired but not
    unpaired mice
  depends_on:
  - fig2-recorded-neurons
  statistics:
  - about: paired, CS window against chance
    test: Mann-Whitney U test
    p: 0.01
    p_relation: "<"
  criterion: As the code does (scripts/notebook_utils/fig4h_decoding_workflow.py at the commit
    read), following the STAR Methods (Logistic regression classifier). Mice with more than 10 ASt
    units below 50 Hz (12 in the code's printout, 9 paired and 3 unpaired); spikes in 100 ms bins
    from -20 to 40 s around each CS onset; at most 29 trials per CS, equal numbers of each by
    random draw; stratified 5-fold cross-validation over trials; per fold a standard-scaled
    liblinear logistic regression trained on all bins of the training trials and tested bin by
    bin on held-out trials; chance from 20 label shuffles per fold. Accuracy averaged over 0 to
    18 s per mouse. The legend names a Mann-Whitney U test against chance; the code runs a
    Wilcoxon signed-rank test of each mouse's accuracy against its own chance (printed W = 0,
    p = 0.0039 for paired, p = 0.5 for unpaired), shown as a variant. Reproduced when the paired
    mice's accuracies exceed chance by the Mann-Whitney U test at p < 0.01 and the unpaired
    mice's do not at p < 0.05.
