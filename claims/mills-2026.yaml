- id: fig2e-ast-sustained-clusters
  statement: Clustering all recorded neurons by their CS-shock and CS-reward responses, ASt neurons
    make up the largest share of the two clusters with robust responses sustained over the full 20 s
    of CS-shock; TS neurons dominate a slowly rising CS-shock cluster and a CS-reward inhibited one,
    and CeA neurons the CS-reward excited clusters.
  source: Results, ASt neurons encode sustained conditioned responses to threat cues, paragraph 2;
    Figure 2D-E
  quote: Remarkably, however, ASt neurons were the dominant representative in two clusters (clusters 1
    and 2) that showed robust and sustained responses to CS-shock lasting the full 20 s of the cue
  depends_on:
  - fig2-recorded-neurons
  criterion: Per neuron, the CS-shock and CS-reward z-scored traces (ephys cue response, opening
    comment) concatenated and clustered by agglomerative hierarchical clustering on Euclidean
    distance (STAR Methods). The paper names seven clusters (clusters 1 to 7 in the Results) and
    the pie charts give each region's share normalized for region size. Open, with readings run
    together, the linkage ((a) average, (b) Ward, (c) MATLAB's default, single), the traces'
    span ((a) the 20 s cue, (b) 20 s before to 20 s after onset) and the bin size (10 or 100 ms).
    The tree is cut into seven clusters. A cluster is sustained when its mean CS-shock z over
    0.1 to 19 s is above 1 and its mean over the last 5 s of the cue is above half its mean
    over the first 5 s. Reproduced when under one reading the two sustained clusters with the
    largest mean CS-shock z each have ASt as the region with the largest normalized share.
