# Claims for Mills, Lee, Howe, Li et al. (2026), "Amygdalostriatal transition zone neurons encode
# sustained cue responses to guide defensive behaviors", Neuron, doi:10.1016/j.neuron.2026.08.012,
# tested on DANDI:001203.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-11-20, protocol pilot-18 as stated in docs/protocol.md.
#
# Text read. paper/10.1016-j.neuron.2026.08.012.txt, from Europe PMC (PMC13592531, NIHMS2206276):
# the author-accepted manuscript under CC BY, which its header says is the publisher's accepted
# version, with the Summary, Results with figure legends 1 to 6, Discussion, Resource
# availability, STAR Methods and Key resources table. The supplement read is MMC1 (the legends of
# Figures S1 to S17, as text extracted from its PDF). MMC2 (Data S1, 46 pages) is image only: per
# mouse histology of electrode, probe, fiber and virus placements, with the mice left out for
# poor targeting or CeA expression. Its first pages were looked at to identify it; no claim rests
# on it, but an author can use it to match exclusions. Figures themselves were not looked at.
#
# Code read. https://github.com/Tyelab/Mills-et-al-2026 at commit
# 1fee26d1a5bb8179c44b02b24632d3d872e0b801 (2026-09-08), linked in Data and code availability. It
# holds five Python analyses of the electrophysiology, all reading one MATLAB file (discAll.mat,
# not in the repository): the CS decoding of Figure 3H (named "fig4H" in the code), freezing and
# darting decoding, the GLM of Figures 3I to 3M (named "fig4G"), the average trajectories of
# Figure 2Q, example single-trial trajectory pairs of Figure S8B, and the 10 ms trajectories of
# Figure S9C. Executed notebooks print outputs, and results/cache holds the GLM tables
# (paired_vs_unpaired_summary.csv gives 125 paired and 66 unpaired neurons from 12 and 4 mice,
# one-sided Mann-Whitney p = 0.029 for CV delta deviance, as the paper). The MATLAB code for
# Figure 2 (z-scores, clustering, ANOVAs, chi-square), Figures S5 to S10, all calcium imaging,
# behavior scoring and snRNA-seq is not in the repository. The cosine-similarity statistics of
# Figure S8E-F (100 iterations, Wilcoxon) are not in it either; the code only plots example pairs.
#
# Data the paper used.
# - snRNA-seq (Figure 1A-J, S1 to S3) of ASt, CeA, TS and DS from wild-type C57BL/6J mice, 97,434
#   nuclei, deposited at GEO GSE211437, not in the dandiset.
# - RNAscope (Figure 1K-L, S4) of Drd1a, Drd2, Cdh6, Slit2, VGlut1; optogenetics with open field,
#   real-time place preference, elevated plus maze, rotarod (Figures 3A-C, 4, 6, S11, S12, S16,
#   S17). The dandiset description names neither; these claims are marked as using the paper's
#   own recordings, and the author is to find whether they exist anywhere.
# - Electrophysiology (Figures 2, 3D-M, S5 to S10). Freely moving mice with 16-wire arrays
#   (Open Ephys, 30 kHz, Offline Sorter) or Neuropixels 1.0 (SpikeGLX, Kilosort 2.5, phy) in the
#   ASt; Neuropixels also recorded TS and CeA. Two-tone discrimination session: 20 s tones (3.5 or
#   20 kHz, counterbalanced), 90 CS-reward trials (7.5 uL chocolate Ensure; collecting the reward
#   ends the tone) and 30 CS-shock trials (0.1 s, 0.7 mA shock co-terminating with the tone), ITI
#   90 +/- 20 s. Unpaired controls received the same CS and US unpaired. Mice: 21 paired and 4
#   unpaired (Figure S5). Neurons: ASt 15 mice, 193 neurons; TS 7 mice, 212; CeA 8 mice, 145
#   (paired, Figure 2); unpaired ASt 4 mice, 71 neurons (Figure S7). In the code's file, animals
#   carry group "paired" or "unpaired", ephysType "NPX" or "OE", units a region label ("ASt",
#   "TS", "CeA", "BLA"), and IDs such as NPX03 or 3016_donkey; events are CSrew and CSshk onsets.
# - Behavior during these sessions: SLEAP poses (14-point skeleton) from a top camera; freezing
#   when the displacement of all body points is below 0.08 cm per frame; darting when the rear
#   body center reaches 45 cm/s; total defensive behavior is freezing plus darting; reward
#   seeking from port beam breaks (Med-PC). Port latency is the time from tone onset to port entry.
# - Calcium imaging (Figures 5, S13 to S15). Miniscopes v3.2 and v4 through GRIN lenses over ASt
#   Drd1a-Cre or Drd2-Cre neurons expressing GCaMP7f, 15 frames/s, downsampled by two, NoRMCorre,
#   CNMF-E, manual curation. Discrimination session with 10 s tones, 45 CS-reward (reward 3 s
#   after tone onset) and 15 CS-shock trials, imaging on every shock trial and every other reward
#   trial, 10 s before the CS to 3 s or 10 s after it. Drd1a: paired 10 mice, 320 neurons,
#   unpaired 8 mice, 237; Drd2: paired 9 mice, 296, unpaired 6 mice, 257. A US session added
#   unpredicted shocks (0.1, 0.7, 1.4 mA, 250 ms) and rewards (1.875, 3.75, 7.5 uL). A contextual
#   fear session recorded in conditioned Context A and unconditioned Context B.
#
# Method fixed from the paper, used by several claims.
# - Ephys cue response (STAR Methods, Analysis of neural responses to cue delivery): per neuron,
#   the firing rate averaged over all trials of a CS type, z-scored by the mean and SD of that
#   average over the 20 s before cue onset. Phasic is the mean z over 0 to 100 ms after onset,
#   sustained over 0.1 to 19 s.
# - Ephys unit selection (code, scripts/utils/discall.py derive_metadata): units of the region
#   with mean firing rate (spike count over recording duration) below 50 Hz. The Methods do not
#   state it; the code's printout gives 193 paired ASt units after it, the paper's number.
# - Responsive neurons (STAR Methods, Statistical analysis): Wilcoxon signed-rank test at alpha
#   0.01 and mean z above +2 (excited) or below -2 (inhibited). Proportions compared by
#   chi-square tests, Holm-Bonferroni within each family.
# - Calcium response (STAR Methods, Statistical analysis of calcium recordings): per neuron, mean
#   fluorescence over trials of a CS type, z-scored by the mean and SD of the 10 s before cue
#   onset; short window 0 to 1 s, long 1 to 10 s.
#
# Details the paper leaves open, named where they bear on a claim.
# - Bin size of the ephys z-scored traces for Figure 2 and S6 to S10: the Methods give none.
#   Figure S6 shows 10 ms bins; the code uses 100 ms bins. Readings, 10 ms or 100 ms (with 100 ms
#   the phasic window is one bin).
# - Inputs of the signed-rank test for responsive neurons: readings, (a) each trial's mean rate in
#   the response window against the same trial's mean rate in the 20 s baseline; (b) against an
#   equal-length window just before cue onset.
# - Defensive behavior per trial: the share of CS time spent freezing plus the share spent
#   darting (reading a), or the summed seconds (reading b). The two give the same ordering
#   within a session of fixed-length tones.
# Further open details are named in the claims they concern.
