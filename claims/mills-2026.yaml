  statement: Among Drd2+ ASt neurons, only 2.4% respond in the same direction to CS-shock and
    CS-reward (salience-like), while 38% respond to only one CS or in opposite directions.
  source: Figure S14Q; Results, Drd2+ ASt neurons show robust responses to conditioned stimuli
    predicting shocks, paragraph 2
  quote: only 2.4% of neurons exhibited responses consistent with salience (excited or inhibited to
    both CS-shock and CS-reward), while 38% of neurons significantly responded to only one CS type
  expected:
  - quantity: Drd2+ neurons with same-direction responses to both CS
    value: 2.4
    tolerance: 0.24
    unit: percent
  - quantity: Drd2+ neurons responding to one CS only or in opposite directions
    value: 38
    tolerance: 3.8
    unit: percent
  criterion: Drd2+ neurons of paired mice from the US session (5 mice, 348 neurons, Figure S14
    legend), classed excited when the mean z over 0 to 3 s after CS onset exceeds 2.58 and
    inhibited when below -2.58. Reproduced when both shares are within tolerance.
- id: figs15-no-context-encoding
  statement: After contextual fear conditioning, neither Drd1a+ nor Drd2+ ASt neurons change their
    activity in the conditioned context compared with an unconditioned one, although the mice
    freeze more in the conditioned context.
  source: Figure S15D-K; Results, Drd2+ ASt neurons show robust responses to conditioned stimuli
    predicting shocks, paragraph 3
  quote: neither Drd1a + nor Drd2 + ASt neurons showed any changes in neural activity in the
    conditioned context compared with an unconditioned one
  statistics:
  - about: freezing, Context A against B
    test: paired t-test
    p: 0.05
    p_relation: "<"
  - about: activity measures, Context A against B
    test: paired t-test across mice
    p: 0.05
    p_relation: ">"
    n: Drd1a 6 mice, Drd2 5 mice
  criterion: A claim of absence for activity. Per mouse, mean raw fluorescence, calcium transient
    peak rate and estimated spike rate of its neurons in Context A and in Context B; the paper's
    paired t-tests across mice, for each measure and cell type. Peak detection and spike
    estimation are not given (CNMF-E outputs); readings, the CNMF-E deconvolved trace for
    spikes, and peaks above 2 SD of the trace. Reproduced when none of the six tests gives
    p < 0.05 and freezing is higher in Context A at p < 0.05 for both cell types.
