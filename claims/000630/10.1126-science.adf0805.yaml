- id: fig6a-ephys-dprime-subclass-structure
  statement: Pairwise electrophysiological distinctness (d') of human L1 t-types is smaller within
    subclasses than between them; the only within-subclass pair with high d' is LAMP5 NMBR
    against LAMP5 LCP2.
  source: Results, Cross-modality relationships of L1 subclasses and t-types, paragraph 1;
    Figure 6A
  quote: The resulting t-type similarity matrices (Fig. 6A) showed comparable subclass structure in
    both electrophysiology and transcriptomics, with smaller d’ values within subclass blocks and
