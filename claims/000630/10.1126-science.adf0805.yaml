    -20 set missing, KNN imputation again; for each t-type pair a random forest (scikit-learn
    defaults, class_weight balanced_subsample) scored by 5-fold stratified cross_val_predict
    probabilities; d' = sqrt(2) times the inverse normal of the ROC AUC, AUC of 1 replaced by
