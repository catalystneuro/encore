# Claims for Chartrand et al. (2023), Science 382, eadf0805, on dandiset 000630.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23,
# protocol pilot-10 as stated in docs/protocol.md (Reader).
#
# Text read. The author manuscript of the version of record in PubMed Central (PMC11864503,
# NIHMS2048794), as text (paper/10.1126-science.adf0805.txt). It has the main text, the legends
# of Figures 1 to 6, and the supplementary PDF (NIHMS2048794-supplement-5.pdf) extracted as text:
# the Materials and Methods, the legends of figs. S1 to S9, and Tables S1 and S2. The four
# supplementary data tables (Data S1 donors, Data S2 subclass statistics, Data S3 metadata
# statistics, Data S4 cross-species statistics, all .xlsx) are not under paper/, so no per-feature
# statistic from them is used here; each claim rests on the sentence or legend it quotes. The
# code that wrote Data S2 and S4 was read instead (below). No figure was opened. The bioRxiv
# preprint (doi:10.1101/2022.10.24.511199) is under paper/ but was not used.
#
# Code read. github.com/AllenInstitute/patchseq_human_L1 at commit 7777857 (2025-05-13), linked
# under Data and materials availability and archived as Zenodo doi:10.5281/zenodo.8310226 (v0.2).
# It holds patchseq_utils (data loading l1_load.py, statistics analysis.py, pairwise d' in
# cluster_pairs.py and dprime.py, GMM clustering in clustering.py, preprocessing pipelines.py),
# notebooks for each figure (l1_subclass_distinctness, l1_cross_species, l1_rosehip, l1_tnfaip,
# l1_dprime, clustering_classification, l1_metadata_effects, l1_TEA_comparison and others), R
# scripts for the transcriptomic UMAPs, and a data folder: per-cell tables
# (human_l1_dataset_2023_02_06.csv, 419 human rows with t-type, homology_type, core_l1_type,
# l1_type, collaborator, layer, structure, donor_age, donor_sex, medical_conditions, nwb_path;
# mouse_l1_dataset_2023_02_06.csv, 547 rows), the strict L1 cell lists
# (human_l1_dataset_strict.csv and mouse_l1_dataset_strict.csv, 272 rows each), the IPFX
# feature tables (aibs_features_E.csv, tamas_features_E.csv, mansvelder_features_E.csv,
# aibs_mouse_features_E.csv), morphology features, transcriptomes (ps_human.RData,
# ps_mouse.RData), MERFISH proportions and the cytoarchitecture source data. Only column headers
# and the label columns of the tables were read, not their feature values. Several features
# (adaptation ratios, irregularity ratio, initial firing rate, depolarizing sag, post-AP slope)
# come from custom code the Methods say "will be released in a future version of IPFX"; it is
# not in this repository nor in IPFX at commit c607a36, so their exact definitions are open
# (see "Open details" below). The ZINB regularization file used for the patch-seq transcriptomic
# d' (zinb_human.h5) and the LIMS donor lookups are on Allen Institute servers, not in the
# repository.
#
# Data the paper used. Human neurosurgical tissue (refractory temporal lobe epilepsy,
# hydrocephalus or deep tumour), mostly middle temporal gyrus (MTG) with smaller fractions from
# other temporal and frontal areas, recorded at three sites (Seattle, the primary dataset;
# Amsterdam and Szeged, a held-out secondary dataset). Acute 350 um slices, whole-cell current
# clamp at 32 to 34 C with synaptic blockers, Bessel 10 kHz, digitized at 50 kHz, potentials not
# corrected for the -14 mV junction potential; bias current holds the initial resting potential.
# Sweep QC: within 2 mV of target, leak 0 +/- 100 pA, rms noise < 0.2 mV (1.5 ms) and < 0.5 mV
# (500 ms). Stimuli: 1 s long squares (hyperpolarizing -10 to -90 pA, rheobase, rheobase + 40
# pA up to + 80 pA), 3 ms short squares, a slow ramp, and in a subset a logarithmic chirp; in a
# subset, nucleated-patch voltage clamp for K+ currents. Features from IPFX: spike threshold,
# height, width, fast AHP, trough, upstroke, downstroke and ratio; input resistance (all
# hyperpolarizing sweeps), sag (sweep closest to -100 mV), depolarizing sag (subthreshold sweep
# closest to rheobase), rheobase, f-I slope; spike-train features on the rheobase sweep and the
# sweep 40 pA above it ("hero" in the code); adaptation ratios between first and third spike on
# the lowest step with at least 4 spikes. Transcriptomes were mapped by tree mapping to the human
# MTG and mouse VISp taxonomies; 10 human L1 t-types grouped into four homology subclasses
# (LAMP5: LAMP5 NMBR, DBP, LCP2; MC4R: SST CHRNA4, ADARB2 MC4R; PAX6: PAX6 CDH12, PAX6
# TNFAIP8L3; L1 VIP: VIP TSPAN12) and "other" (SST BAGE2, VIP PCDH20). Table S2: 250 human cells
# (194 with electrophysiology, 71 with morphology); by subclass, electrophysiology counts LAMP5
# 96, MC4R 35, PAX6 33, L1 VIP 15, other 15. Mouse comparison data are 272 L1 patch-seq cells
# (255 with electrophysiology, 43 with morphology) from VISp (DANDI 000020, version
# 0.210913.1639) and additional recordings in visual cortex and TEa.
#
# Where the data are. The dandiset ("Human L1 patch-seq electrophysiology", 210 files, human
# only; the paper cites version 0.230915.2257) holds the human NWB electrophysiology. Its
# description points to the code repository for features. Cell labels (t-type, subclass,
# collaborator, layer, brain region, donor condition, age and sex) come from the code's
# human_l1_dataset_2023_02_06.csv; claims that need them are `with_labels`. The author adds the
# link claim that matches the dandiset's files to that table (protocol, author step 4).
# Mouse electrophysiology (DANDI 000020) is an outside input (`with_inputs`). Morphologies
# (BIL doi:10.35077/g.606), transcriptomes (NeMO; processed data in the Zenodo archive) and
# cytoarchitecture images are not in the dandiset (`elsewhere`).
#
# Sets used below, from the code.
#  - Strict L1 set: cells listed in human_l1_dataset_strict.csv, soma in L1 or in L2 within
#    40 um of the L1/L2 border (Methods, "border cells"; l1_cross_species.ipynb cell 5).
#  - Primary set P: strict L1 set, collaborator AIBS (Seattle) and failed_fx_long_squares
#    False (l1_load.py, primary_ephys). Table S2 gives 194 such cells among those of the ten L1
#    t-types (summarize() in l1_cross_species.ipynb counts over combined_l12, which drops cells
#    without a homology_type).
#  - Core subclasses: LAMP5, MC4R, PAX6, L1 VIP (core_l1_type True); l1_type adds "other".
#  - Code feature filters: first_isi_inv_rheo and first_isi_inv_hero above 1000 Hz and
#    input_resistance above 1000 MOhm are set missing (l1_load.py).
#
# Open details, and the readings named for each (criteria refer to these).
#  - O1, custom feature definitions. The Methods define the initial firing rate (inverse of the
#    first ISI) and the adaptation ratio (ratio of a spike feature between the first and third
#    spike on the lowest step with at least 4 spikes), but not the order of that ratio, the
#    irregularity ratio (ir_late_mean), the post-AP slope (postap_slope_rheo, "ADP slope" in
#    Fig. 5B) or the ADP voltage. Readings for the author's recomputation from the NWB files:
#    (a) the Methods' definitions with IPFX conventions; (b) the paper's own per-cell values in
#    aibs_features_E.csv, matched by cell, shown as a check of (a). Where (a) cannot be
#    computed for a feature, the claim that needs it is judged on (b) and the notes say so.
#  - O2, cross-species two-way ANOVA. The Methods say "two-way ANOVA on species and subclass
#    (heteroskedasticity-corrected)", the Fig. 3D legend says "2-way ANOVA on ranks", Data S4's
#    description says Type II; the code (run_species_subclass_stats) fits OLS with HC3 errors,
#    Type I sums of squares, no rank transform, species entered first. Readings: (a) ranks,
#    Type II, HC3 (legend and Data S4); (b) raw values, Type I, HC3 (code).
#  - O3, classifier preprocessing. The Methods give, for clustering and classification,
#    exclusion of cells missing more than 60% of features, LocalOutlierFactor < -20 outlier
#    removal, RobustScaler and KNNImputer; the code applies the outlier step in the d'
#    pipeline (pipelines.py) but not in the subclass classifier or the GMM search. Readings:
#    (a) Methods; (b) code.
schema_version: 2
dataset:
  archive: dandi
  id: "000630"
paper: doi:10.1126/science.adf0805
claims:
- id: patchseq-counts
  statement: The human L1 patch-seq dataset has 250 cells passing transcriptomic quality, 194 with
    electrophysiology passing quality control and 71 reconstructed; by subclass, 96 LAMP5, 35
    MC4R, 33 PAX6, 15 L1 VIP and 15 other cells have electrophysiology.
  source: Results, L1 patch-seq pipeline and transcriptomic references, paragraph 4; Table S2
  quote: All cells were filtered for transcriptomic (n=250) and electrophysiological quality
    (n=194), and a subset of neurons (n=71) with sufficient cell labeling were imaged at high
    resolution
  data: with_labels
  expected:
  - quantity: human cells with electrophysiology (primary set P)
    value: 194
    tolerance: 19.4
  - quantity: LAMP5 cells with electrophysiology
    value: 96
    tolerance: 9.6
  - quantity: MC4R cells with electrophysiology
    value: 35
    tolerance: 3.5
  - quantity: PAX6 cells with electrophysiology
    value: 33
    tolerance: 3.3
  - quantity: L1 VIP cells with electrophysiology
    value: 15
    tolerance: 1.5
  - quantity: other (SST BAGE2, VIP PCDH20) cells with electrophysiology
    value: 15
    tolerance: 1.5
  criterion: Counts of dandiset cells in the primary set P (strict L1 set, AIBS, long-square
    features extracted) that belong to one of the ten L1 t-types (homology_type set), overall and
    by homology_type; this is Table S2's "ephys cell count", as summarize() in
    l1_cross_species.ipynb cells 8 and 9 computes it over combined_l12, which drops cells without a
    homology_type. Reproduced when every count is within its
    tolerance. The 250 and 71 counts need transcriptomes and reconstructions and are not
    tested here; the count of dandiset files not in P is reported.
  depends_on:
  - dandiset-cell-link
- id: fig1a-human-types-separated
  statement: In transcriptomic reference data, many human L1 t-types form separated clusters while
    mouse L1 t-types vary more continuously, suggesting stronger transcriptomic specialization in
    human L1.
  source: Results, L1 patch-seq pipeline and transcriptomic references, paragraph 1; Figure 1A
  quote: many human t-types formed separated clusters, with others clustered in groups of related
    t-types, whereas mouse L1 t-types showed more continuous variability
  data: elsewhere
  where: Allen Brain Map RNA-seq portal (human MTG snRNA-seq of Hodge et al. 2019, mouse VISp
    scRNA-seq of Tasic et al. 2018), as the Methods cite them
  criterion: The paper shows this with UMAP projections and reports no test or measure for the
    contrast. A reading named here, not the paper's test, uses the paper's transcriptomic d'
    (Methods, Discriminant analysis, NB d' on the reference data, as used for Fig. 1B); reproduced
    when the median pairwise d' among human L1 t-types exceeds that among mouse L1 t-types.
- id: fig1b-three-subclasses
  statement: Ten human and eight mouse L1 t-types are defined from the references; grouping human
    t-types with d' below 2.2 forms three subclasses, leaving three t-types ungrouped.
  source: Results, L1 patch-seq pipeline and transcriptomic references, paragraph 1; Figure 1B;
    Methods, Subclasses and cross-species homology
  quote: we identified 10 L1 t-types in human and 8 in mouse ... This formed three subclasses, with
    three t-types remaining ungrouped
  data: elsewhere
  where: Allen Brain Map RNA-seq portal (human MTG snRNA-seq, mouse VISp scRNA-seq)
  expected:
  - quantity: human L1 t-types
    value: 10
    tolerance: 0
  - quantity: mouse L1 t-types
    value: 8
    tolerance: 0
  - quantity: human subclasses from d' grouping
    value: 3
    tolerance: 0
  criterion: Tolerances are zero because these are counts of categories that define the
    taxonomy; a 10% tolerance would admit no other integer. L1 t-types are those making up more
    than 5% of L1 cells or with more than 50% of the type in L1 dissections (Methods); subclasses
    group t-type pairs with NB-discriminant d' < 2.2 (Methods).
- id: fig1d-four-homology-subclasses
  statement: Cross-species matching of mouse t-types to human subclasses gives four
    homology-driven subclasses; two human L1 t-types (SST BAGE2, VIP PCDH20) are homologous to
    deeper-layer mouse types and are left out.
  source: Results, L1 patch-seq pipeline and transcriptomic references, paragraph 3; Figure 1D
  quote: These matches resulted in four homology-driven subclasses (called subclasses hereafter)
    with proportions largely comparable across species ... Two additional human L1 t-types (SST
    BAGE2 and VIP PCDH20) were excluded from cross-species L1 subclasses because of their homology
    to t-types found in deeper layers, but not L1 of mouse neocortex
  data: elsewhere
  where: Allen Brain Map RNA-seq portal references and the integrated coordinates in Zenodo
    doi:10.5281/zenodo.8310226 (data/scalign_coords.rda)
- id: fig1e-subclass-proportions
  statement: Subclass proportions in the L1 patch-seq data differ between human and mouse for every
    subclass except L1 VIP, PAX6 being the notable difference.
  source: Figure 1E legend; Results, L1 patch-seq pipeline and transcriptomic references,
    paragraph 3
  quote: All cross-species proportion differences (except L1 VIP) significant at FDR-corrected
    p<0.001, one vs. rest Fisher’s exact tests
  statistics:
  - test: one vs. rest Fisher's exact tests
    p: 0.001
    p_relation: "<"
    corrected: FDR
  data: elsewhere
  where: per-cell t-type tables in Zenodo doi:10.5281/zenodo.8310226 (human and mouse
    l1_dataset_2023_02_06.csv), from the NeMO transcriptomes
  criterion: As l1_proportions.ipynb cells 47 and 48 (fisher_test_all). Human cells of the strict
    set with soma in L1 (strict_l1, layer 1, border cells left out); mouse patch-seq cells with
    layer_ccf or layer_lims 1 from the full mouse metadata; categories LAMP5, MC4R, PAX6, L1 VIP,
    other L1 t-types and deeper t-types (cells with no homology_type). For each category a
    two-sided Fisher's exact test of species against in category or not; Benjamini-Hochberg across
    categories. Reproduced when every category but L1 VIP has FDR p < 0.001 and L1 VIP does not.
- id: figs2a-patchseq-vs-snrnaseq
  statement: Compared with snRNA-seq, patch-seq sampled fewer SST BAGE2 and more PAX6 CDH12 and VIP
    TSPAN12 cells; MERFISH proportions did not differ from patch-seq.
  source: Results, L1 patch-seq pipeline and transcriptomic references, paragraph 6; Figure S2A
  quote: patch-seq had fewer SST BAGE2 cells and more PAX6 CDH12 and VIP TSPAN12 compared to
    snRNA-seq (p<0.05, False discovery rate or FDR-corrected Fisher’s exact test). MERFISH had
    intermediate proportions of SST BAGE2 with no significant differences compared to patch-seq
    (p>0.18)
  statistics:
  - about: patch-seq against snRNA-seq
    test: Fisher's exact test
    p: 0.05
    p_relation: "<"
    corrected: FDR
  - about: MERFISH against patch-seq
    test: Fisher's exact test
    p: 0.18
    p_relation: ">"
  data: elsewhere
  where: Zenodo doi:10.5281/zenodo.8310226 (data/merfish_counts.csv, merfish_proportions.csv and
    the per-cell tables) and the Allen Brain Map human MTG snRNA-seq reference
- id: figs1d-marker-correlation
  statement: Marker gene expression by t-type correlates strongly between patch-seq and the
    snRNA-seq reference (r = 0.84).
  source: Figure S1D legend; Results, L1 patch-seq pipeline and transcriptomic references,
    paragraph 5
  quote: Correlation of marker gene expression between patch-seq and snRNA-seq reference (r=0.84,
    p<10-18)
  statistics:
  - test: correlation
    statistic: r = 0.84
    p: 1.0e-18
    p_relation: "<"
  expected:
    quantity: correlation of t-type mean marker expression, patch-seq against snRNA-seq
    value: 0.84
    tolerance: 0.084
  data: elsewhere
  where: Zenodo doi:10.5281/zenodo.8310226 (data/ps_human.RData) and the Allen Brain Map human MTG
    snRNA-seq reference
- id: fig2c-subclass-ephys-differences
  statement: Human L1 subclasses differ in electrophysiology, notably in sag and initial firing
    rate (Kruskal-Wallis, FDR-corrected p < 1e-7).
  source: Results, Morpho-electric diversity in human L1, paragraph 1; Figure 2C
  quote: Electrophysiologically, subclasses were distinguished by subthreshold properties such as
    sag ... as well as several suprathreshold properties including firing rate ... Electrophysiological
    and morphological features distinguishing L1 subclasses (KW test, FDR-corrected p<10−7 for
    electrophysiology
  statistics:
  - test: Kruskal-Wallis test
    p: 1.0e-7
    p_relation: "<"
    corrected: FDR (Benjamini-Hochberg)
    n: 96 LAMP5, 35 MC4R, 33 PAX6 and 15 L1 VIP cells (Table S2)
  data: with_labels
  criterion: As l1_subclass_distinctness.ipynb cells 8 and 10 (run_kw_dunn), which wrote Data S2.
    Cells in P of the four core subclasses; features with more than 40% non-missing values among
    l1_type cells of P; per feature a Kruskal-Wallis test across subclasses, epsilon2 = H/(n-1),
    Benjamini-Hochberg across features; Dunn's post hoc tests on significant features, FDR across
    pairs (Methods and legend; the code's cell 10 runs pairwise Mann-Whitney tests instead,
    posthoc='mw_full', shown as a variant). Sag is IPFX sag at the hyperpolarizing sweep closest to -100 mV; initial firing rate is
    first_isi_inv_hero (inverse first ISI at rheobase + 40 pA), as Fig. 2C plots (O1). Reproduced
    when both have FDR p < 1e-7; partially reproduced when both have FDR p < 0.05 but not both
    below 1e-7.
  depends_on:
  - patchseq-counts
  - dandiset-cell-link
- id: fig2b-subclass-ephys-profiles
  statement: LAMP5 cells show small sag and adaptation, PAX6 cells minimal sag and a high initial
    firing rate, while MC4R and L1 VIP cells show strong sag.
  source: Results, Morpho-electric diversity in human L1, paragraph 2; Figure 2B and 2C
  quote: Their electrophysiological phenotype was relatively undistinguished, with firing-rate
    adaptation and sag present but small ... along with minimal sag and high initial firing rate
    at the onset of response to depolarizing current injection ... MC4R cells had extremely
    compact ball-like axonal arbors, along with strong sag ... with a consistent stellate-like
    dendrite morphology and high sag
  data: with_labels
  depends_on:
  - fig2c-subclass-ephys-differences
  - dandiset-cell-link
  criterion: On the cells and features of fig2c-subclass-ephys-differences. Reproduced when (i)
    the median sag of MC4R and of L1 VIP each exceeds that of LAMP5 and of PAX6, (ii) PAX6 has the
    lowest median sag of the four, and (iii) PAX6 has the highest median first_isi_inv_hero.
    Not reproduced otherwise. Dunn's FDR-corrected p for each pair is reported; the paper states
    the ordering in words and reports no pairwise values in the text read.
- id: figs3a-sag-adaptation
  statement: Spike adaptation properties are strongly and inversely related to sag across human L1
    cells (R2 = 0.74).
  source: Results, Morpho-electric diversity in human L1, paragraph 1; Figure S3A legend
  quote: Spike adaptation properties showed a strong inverse relationship with sag across the
    dataset (Fig. S3A)
  statistics:
  - test: linear regression
    statistic: R2 = 0.74
    p: 1.0e-13
    p_relation: "<"
  expected:
    quantity: R2 of upstroke adaptation ratio regressed on sag
    value: 0.74
    tolerance: 0.074
  data: with_labels
  criterion: As l1_subclass_distinctness.ipynb cells 8, 16 and 17. Cells in P with l1_type (the
    five groups, other included); OLS of upstroke_adapt_ratio on sag with HC3 errors
    (run_regressions). Reproduced when R2 is within tolerance and p < 1e-13, and cells with more
    sag show less change of spike upstroke from the first to the third spike. The ratio's order
    is open (O1); the direction is judged on the change, whichever order the ratio has, and the
    slope's sign is reported with the order used.
  depends_on:
  - dandiset-cell-link
- id: fig2c-lamp5-gradient
  statement: Within the LAMP5 subclass, sag and initial firing rate decrease from the NMBR to the
    DBP to the LCP2 t-type.
  source: Results, Morpho-electric diversity in human L1, paragraph 2; Figure 2C
  quote: Within the LAMP5 subclass, sag and initial firing rate decreased from the NMBR t-type to
    DBP to LCP2 t-types ... Spearman correlation FDR-corrected p<10−3
  statistics:
  - test: Spearman correlation
    p: 0.001
    p_relation: "<"
    corrected: FDR
  data: with_labels
  criterion: As l1_subclass_distinctness.ipynb cell 59. All LAMP5 cells of the strict L1 set (the
    code does not restrict to P), t-type coded in the order LCP2, DBP, NMBR; Spearman correlation
    of each feature whose name has no "3" with that code (run_correlations), Benjamini-Hochberg
    across features. Reproduced when sag and first_isi_inv_hero each have FDR p < 0.001 and a
    positive Spearman rho with that code (values decreasing from NMBR to DBP to LCP2). If the dandiset lacks the Amsterdam and Szeged LAMP5
    cells the code includes, the test runs on what it holds and the notes say so; the same test
    on P alone is shown as a variant.
  depends_on:
  - dandiset-cell-link
- id: fig2d-subclass-morphology
  statement: Human L1 subclasses differ morphologically in vertical orientation of axons and
    dendrites, axon extent and shape, and dendrite branching (Kruskal-Wallis, FDR p < 1e-3).
  source: Results, Morpho-electric diversity in human L1, paragraph 1; Figure 2D
  quote: Morphologically, subclasses were distinguished by vertical orientation of axons and
    dendrites, axon extent and shape, and dendrite branching
  statistics:
  - test: Kruskal-Wallis test
    p: 0.001
    p_relation: "<"
    corrected: FDR
  data: elsewhere
  where: Brain Image Library doi:10.35077/g.606 (reconstructions); morphology features in Zenodo
    doi:10.5281/zenodo.8310226 (data/RawFeatureWide_human+derivatives.csv)
- id: figs6-donor-condition-ephys
  statement: No electrophysiological feature of human L1 cells differs with donor medical
    condition, sex or age after FDR correction.
  source: Results, Morpho-electric diversity in human L1, paragraph 3; Figure S6A and S6B legends
  quote: AP width (upper right) was the only significant electrophysiology feature (MW p=0.03, NS
    after FDR correction)
  statistics:
  - about: AP width, epileptic against non-epileptic donors, before correction
    test: Mann-Whitney test
    p: 0.03
  - about: sex, the only feature before correction
    test: Mann-Whitney test
    p: 0.02
  data: with_labels
  criterion: A claim of absence, judged on the paper's tests. As l1_metadata_effects.ipynb cells
    50 and 51 (medical condition), 99 and 100 (sex), 108 to 110 (age) and the Methods (Statistical
    analysis of variability). Cells of the strict L1 set
    with l1_type, AIBS and long-square features extracted; features with more than 40%
    non-missing values. Medical condition as epileptic or not (code's epileptic(), from the
    medical_conditions column) and sex, each by two-sided exact Mann-Whitney tests; age by
    Spearman correlation, where the code (run_correlations, default filter_dropouts) first drops
    features with fewer than 5 values above 1; Benjamini-Hochberg across features within each
    variable. The code takes condition, sex and age from LIMS donor records; the public table's
    medical_conditions, donor_sex and donor_age columns stand in for them. Reproduced
    when no feature has FDR p < 0.05 for any of the three; not reproduced when any does. The
    smallest uncorrected p and its feature are reported for each.
  depends_on:
  - dandiset-cell-link
- id: figs6a-tumor-dendrite-branching
  statement: Cells from tumor patients have higher dendritic branching than cells from epilepsy
    patients, not explained by brain area or subclass.
  source: Results, Morpho-electric diversity in human L1, paragraph 3; Figure S6A
  quote: with the exception of higher dendritic branching in cells from tumor patients compared to
    epilepsy patients
  statistics:
  - test: Mann-Whitney test
    p: 0.05
    p_relation: "<"
    corrected: FDR
  data: elsewhere
  where: Brain Image Library doi:10.35077/g.606; morphology features in Zenodo
    doi:10.5281/zenodo.8310226
- id: figs6c-region-ephys
  statement: Some electrophysiological features of human L1 cells, including input resistance,
    vary with brain region; sparsely sampled regions either match MTG or have larger input
    resistance.
  source: Results, Cross-species differences in L1, paragraph 2; Figure S6C
  quote: We also explored dependence of L1 interneuron morpho-electric properties on brain region
    within our human data and found moderate effects on a set of features including dendrite
    extent and input resistance (Fig. S6C). For these features, more sparsely sampled regions
    either failed to differ from MTG cells or had smaller dendritic extent and larger input
    resistance
  statistics:
  - test: Kruskal-Wallis test
    p: 0.05
    p_relation: "<"
    corrected: FDR
  data: with_labels
  criterion: As l1_metadata_effects.ipynb cells 15, 29 and 30. Cells of the strict L1 set with
    l1_type, AIBS and long-square features extracted, after the code's two relabels of structure
    (donor H18.03.003 as CeG, donor H22.26.404 as SFG; cell 15), in regions ITG, MTG, MFG and SFG (regions
    with at least 5 cells; TemL left out); features more than 50% non-missing; Kruskal-Wallis by
    region, Benjamini-Hochberg across features; Dunn's post hoc. Reproduced when
    input_resistance_ss has FDR p < 0.05 and no other region has a median input resistance below
    MTG's with Dunn's FDR p < 0.05. The other features of Fig. S6C (sag_peak_t, downstroke_rheo,
    avg_rate_max) are reported.
  depends_on:
  - dandiset-cell-link
- id: fig3b-l1-cytoarchitecture
  statement: Human L1 is thicker than mouse L1 but not less dense, with smaller cell bodies.
  source: Results, Cross-species differences in L1, paragraph 1; Figure 3B and S6D
  quote: human L1 was thicker but not less dense, with smaller cell bodies compared with several
    mouse neocortical areas
  statistics:
