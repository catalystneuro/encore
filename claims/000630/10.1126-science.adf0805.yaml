    dataset, we found comparable classification performance (81%, Fig. S8B)
  expected:
    quantity: subclass accuracy on held-out Amsterdam and Szeged cells
    value: 81
    tolerance: 8.1
    unit: percent
  data: with_labels
  criterion: As clustering_classification.ipynb cells 26 to 38 and the Methods. Features more
    than 50% non-missing at every site; a one-way ANOVA (OLS, HC3) of each on site (AIBS,
    Amsterdam, Szeged), features with p < 0.05 or R2 > 0.05 excluded (Methods; the code keeps p >
    0.05 and R2 < 0.05, the same rule); classifier as figs8a-classifier-cv fitted on all AIBS
    cells; scored on the Amsterdam and Szeged cells of the four core subclasses with soma in L1.
    Score readings (i) accuracy, as the code prints, (ii) balanced accuracy. Reproduced when
    either is within tolerance. The held-out cells are part of the paper's recordings; if the
    dandiset does not hold them the claim is blocked data_missing.
  depends_on:
  - dandiset-cell-link
