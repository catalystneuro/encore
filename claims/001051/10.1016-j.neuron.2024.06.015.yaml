# Claims for Bennett, Ouellette, Ramirez et al. (2024), "SHIELD: Skull-shaped hemispheric implants
# enabling large-scale electrophysiology datasets in the mouse brain", Neuron 112, 2869-2885, on
# dandiset 001051.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-22, protocol
# pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record (PDF supplied by a person, extracted to paper/...txt), main text,
# figure legends, STAR Methods (pages e1 to e8) and the supplemental information (legends of Figures
# S1 to S6). The supplement holds figure legends only; its numbers are quoted from those legends.
#
# Code read: https://github.com/AllenInstitute/SHIELD_Dynamic_Gating_Analysis at commit 3c09a0dc
# (2024-07-22; Zenodo doi:10.5281/zenodo.11494005 per the paper). It holds
#   analysis_notebooks/DynamicGating_ephys_metrics.ipynb (Figures 1C, 4C to 4G, S4A; the list of 87
#     sessions passing ephys QC in cell 26, the counts 25 mice, 87 experiments, 467 insertions),
#   analysis_notebooks/DynamicGating_4hz_analysis.ipynb (Figures 7B to 7F and 8D to 8F),
#   batch_processing/run_4Hz_bursts.py and run_4Hz_analysis.py (alpha-event detection, CCGs, PSTHs,
#     pupil and running around events, random times), analysis_utils.py (event detector, CCG),
#   make_dg_unit_tensor*.py (spike tensors for image flashes and VISp events), run_im115_responses.py
#     (Figure 4G), run_rfs_dg.py (RF metrics via brain_observatory_utilities ReceptiveFieldMapping_VBN),
#     dg_plot_firing_rate_drift_over_session.py (Figure S4I counts),
#   metadata_tables/ (sessions, probes, channels, units with RF p values, and VBN units and sessions).
# In units_table.csv the column is_sig_rf is p_value_rf < 0.01, as the Methods say. No code was found
# for Figures 3 (surgery, MRI, histology, training), 4B trajectories, 5, 6, S3, S4B, S4D to S4H, or S6.
#
# Data the paper used, as it reports them. Electrophysiology in 27 mice (Methods, Mice): C57BL/6J
# (n = 7), VGAT-ChR2 (n = 1), Sst-IRES-Cre;Ai32 (n = 14), Vip-IRES-Cre;Ai32 (n = 4), Vglut2-IRES-Cre
# (n = 1); 18 males, 9 females. The behaving-mouse analyses use 25 mice, 87 experiments (sessions)
# and 467 probe insertions (Discussion; code cell 34; the code's mice are 14 Sst;Ai32, 6 wild type,
# 4 Vip;Ai32, 1 Ai32, 18 M and 7 F). Up to six Neuropixels 1.0 probes per session through a
# single-hemisphere SHIELD implant over the left hemisphere, up to four consecutive recording days
# per mouse (session types EPHYS_1 to EPHYS_4 in the code). Mice performed a visual change detection
# task (8 natural images, 250 ms flash then 500 ms gray; lick on image change for water) and saw a
# receptive-field mapping stimulus (20 degree Gabors on a 9 x 9 grid spaced 10 degrees, 3
# orientations, 4 Hz, 0.08 cycles per degree, 250 ms, 15 repeats). Measured: spikes sorted with
# Kilosort2 and unit quality metrics, unit CCF locations (cortical units relabelled from ISI maps),
# LFP, running wheel speed, eye tracking (pupil) at 60 Hz, licks and rewards. Optogenetics used one
# VGAT-ChR2 mouse (cortical silencing) and one Vglut2-Cre mouse with ChrimsonR in MRN, recorded with
# Dura-Gel. Comparison data for the 5-mm window come from the Allen Visual Behavior Neuropixels (VBN)
# dataset, DANDI:000713 version 0.240702.1725 (reference 29), used through VBN_units_table.csv and
# VBN_sessions.csv in the code's metadata_tables; claims using it are with_inputs. Naive-mouse MRI
# comes from Qiu et al. 2018 (reference 35). Surgery records, ISI maps, MRI, histology and training
# histories are described but the dandiset's description (99 change-detection sessions with a
# no-reward block, session and LFP NWBs) does not mention them; whether it holds them is for the
# author to find.
#
# Shared method for the alpha-event claims (Figures 7, 8 and S6), from the Methods (Identification
# of alpha events; Cross-correlograms and coherence; Quality metric criteria) and the code named.
#   Units. QC criteria isi_violations < 0.5, amplitude_cutoff < 0.1, presence_ratio > 0.95, and not
#     noise (quality good) (Methods; run_4Hz_bursts.py). Figure 8 code instead keeps presence_ratio >
#     0.9 with no noise filter (tensor_utils.apply_good_units_filter); that is a variant.
#   Area membership (open, readings L1 and L2). L1, the Methods, units labelled with the area (for
#     cortex the ISI-based label supersedes the CCF label, Methods, Probe track annotation). L2, the
#     code, units whose channel structure_acronym contains the area's acronym as a substring
#     (region_psth uses str.contains, so VISp also takes VISpm, VISpl and VISpor).
#   Population rate. Spikes of the area's units in 10 ms bins, averaged over units, smoothed with a
#     symmetrical exponential filter of tau 10 ms (Methods; the code's filter is scipy's exponential
#     window of 10 samples, tau 1 sample, symmetric, normalised to sum 1). Areas with fewer than 20
#     units are excluded (Methods; the code requires more than 20, a variant).
#   Candidate events. Local maxima of the inverted trace with scipy.signal.find_peaks, prominence 5,
#     height -1, width 100 to 300 ms (Methods), searched in 1.25 s windows stepped by 0.25 s from time
#     0 to the end of the last stimulus (code). Event rule (open, readings E1 and E2). E1, the
#     Methods, at least four maxima at successive intervals between 125 and 350 ms in the window. E2,
#     the code, a window with at least four maxima of which three successive maxima have both
#     intervals in [125, 350) ms. The event time is the first of those maxima (code). A refractory
#     period of 2 s follows each event (Methods, code).
#   Qualifying events. The autocorrelogram of the area's population rate in a 2 s window centred on
#     the event (Methods give 2 s for CCGs; the notebook's stored CCGs have 200 samples; the batch
#     script in the repository uses 4 s, a variant), computed as scipy.signal.correlate (mode same)
#     of the mean-subtracted traces divided by the square root of the product of their sums of
#     squares (code crosscorrelogram), band-passed 3 to 7 Hz with a 2nd-order Butterworth filter run
#     forward and back at 100 Hz, squared; the event is kept when the maximum exceeds 0.1 (Methods
#     threshold; code get_qualifying_autoccgs).
#   Random times. As many as the events, uniform between the start of the first and the end of the
#     last active-behavior stimulus (code run_4Hz_analysis.py). The code sets no seed; any seed is a
#     standard choice, and the result is to be shown for it.
#   Coherence. Multi-taper coherence (nitime MTCoherenceAnalyzer, default settings) at 100 Hz on 4 s
#     windows centred on each event (Methods), each trace mean-subtracted, the spectrum smoothed with
#     a 4-bin boxcar (code); the 3 to 7 Hz band is the frequencies from the first at or above 3 Hz to
#     the last below 7 Hz (code searchsorted). Random-time coherence is subtracted (Methods); how it
#     is formed is open (readings R1 and R2). R1, the Methods read plainly, both areas at the same
#     random time. R2, the code, the reference area at the event time against the other area at the
#     random time.
#   Pair test (Figure 7F legend; code cells 21 to 23). Sessions with more than 5 qualifying events;
#     pairs with at least 25 pooled events; per pair the per-event band mean of (event minus random)
#     coherence tested against zero with the Wilcoxon signed-rank test, Benjamini-Hochberg across the
#     regions of each reference area, alpha 0.05.
#   The code printed 50 sessions with 1653 qualifying VISp events and 14 sessions with 113 MOp
#   events (cell 12). These are code outputs, not values the paper reports.
#   Every alpha claim is judged under each combination of the open readings; when they disagree the
#   claim is methods_underspecified.
#
# Session set. The Figure 4 analyses use the 87 sessions listed as passing ephys QC in
# DynamicGating_ephys_metrics.ipynb cell 26; the paper names no list. The alpha analyses use every
# session the batch scripts processed (no list in the code); readings are (a) the 87 sessions and
# (b) all sessions in the dandiset.
schema_version: 2
dataset:
  archive: dandi
  id: "001051"
paper: doi:10.1016/j.neuron.2024.06.015
claims:
- id: fig3b-surgical-outcomes
  statement: Of 106 mice entering SHIELD surgery, 79 passed all quality checks, 14 passed after a flag
    that resolved and 13 failed, a final passing rate of 87.7%, on par with 90% (122 of 135) for the
    earlier 5-mm cranial window surgery.
  source: Results, Installation of SHIELD implant and QC evaluation, paragraph 3; Figure 3B
  quote: Of the 106 mice entering surgery for this study, 79 passed all quality checks with no issues,
    14 passed with a flag that eventually resolved, and 13 mice failed ... The final passing rate of
    87.7% is on par with the success rate for our previous 5 mm cranial window surgery
  expected:
  - quantity: mice passing with no issues
    value: 79
    tolerance: 7.9
  - quantity: mice passing after a resolved flag
    value: 14
    tolerance: 1.4
  - quantity: mice failed
    value: 13
    tolerance: 1.3
  - quantity: final passing rate
    value: 87.7
    tolerance: 8.77
    unit: "%"
  criterion: Counts of surgical outcomes from the paper's surgery records. The Methods list failures
    as 4 detached headposts, 1 recurring seizures, 2 implant issues, 1 brain health, 3 unexpected
    deaths (11, not 13); both totals are reported. The earlier-surgery rate (122 of 135) is from
    references 18 and 28 and is not tested.
- id: fig3c-isi-through-implant
  statement: Intrinsic signal imaging through the implant maps the retinotopic boundaries of VISp and
    many higher visual areas.
  source: Results, Installation of SHIELD implant and QC evaluation, paragraph 4; Figure 3C
  quote: We found that standard procedures successfully mapped retinotopic boundaries of VISp and many
    higher visual cortical areas (Figure 3C)
  criterion: Sign maps computed as in the Methods (Intrinsic signal imaging) from at least three
    averaged trials show VISp and higher visual areas as contiguous regions. Shown in the paper by
    example only; the paper gives no count of mice.
- id: fig3d-histology-intact
  statement: The implanted left hemisphere shows little GFAP activation or loss of DAPI and NeuN
    staining compared with the unaltered right hemisphere (6 mice, 56 days after surgery).
  source: Results, Installation of SHIELD implant and QC evaluation, paragraph 5; Figures 3D and S3E
  quote: found little evidence of GFAP activation or cell loss, indicating that the implant did not
    compromise the underlying tissue
  criterion: The paper shows example sections only and reports no measure or test. Open. Readings
    (a) visual comparison of the two hemispheres as in Figure 3D; (b) GFAP, DAPI and NeuN intensity or
    cell density, implanted against control hemisphere per mouse, by the Wilcoxon signed-rank test
    (the Methods' default paired test), reproduced when no difference at p < 0.05.
- id: tracks-rare-bleeding
  statement: Inserted probes rarely caused significant intracranial bleeding, in 3 of 547 tracks.
  source: Results, Installation of SHIELD implant and QC evaluation, paragraph 5
  quote: We found that inserted probes rarely caused significant intracranial bleeding (3/547 tracks).
  expected:
  - quantity: tracks with significant bleeding
    value: 3
    tolerance: 0.3
  - quantity: tracks examined
    value: 547
    tolerance: 54.7
- id: fig3fh-mri-deformation
  statement: In MRI, the 5-mm cranial window deforms the brain under the window, while the brain
    under SHIELD implants (250 and 400 micrometre inserts) is close to naive mice; the thicker insert
    trended toward less deformation.
  source: Results, Installation of SHIELD implant and QC evaluation, paragraph 6; Figures 3F to 3H
  quote: revealed clear brain deformation for the non-contoured 5-mm window over the visual cortex ...
    the area between surface contours for SHIELD mice was more similar to naive mice ... though the
    thicker design trended toward less deformation
  statistics:
  - test: Wilcoxon rank-sum test, area between contours summed over the 4 most posterior sections
    p: 0.05
    p_relation: "<"
    corrected: Benjamini-Hochberg
    n: naive 3, SHIELD 250 4, SHIELD 400 5, 5-mm window 5 mice
  data: with_inputs
  criterion: Area between the mirrored right and the left brain surface contours at ten coronal
    planes, summed over the 4 most posterior, per mouse (Methods, Magnetic resonance imaging; Figure
    3H legend). The naive volumes are from Qiu et al. 2018 (reference 35). The legend does not say
    which pairs carry the asterisk; open. Readings (a) each implant group against naive; (b) all six
    pairs. Reproduced when, after Benjamini-Hochberg, the 5-mm window group is larger than naive at p
    < 0.05 and neither SHIELD group differs from naive at p < 0.05. The 250 against 400 trend is
    reported only.
- id: fig3i-learning-similar
  statement: SHIELD mice and 5-mm window mice learn the change detection task at similar rates
    (median sessions to criterion 12.5 against 14, p = 0.17).
  source: Results, Installation of SHIELD implant and QC evaluation, paragraph 7; Figure 3I
  quote: "Mice with either implant had similar learning rates (Figure 3I; median number of sessions to
    criterion: SHIELD 12.5 ± 2; 5-mm window 14 ± 3; p = 0.17, Wilcoxon rank-sum test)"
  statistics:
  - test: Wilcoxon rank-sum test
    p: 0.17
  expected:
  - quantity: SHIELD median sessions to criterion
    value: 12.5
    tolerance: 2
  - quantity: 5-mm window median sessions to criterion
    value: 14
    tolerance: 3
  data: with_inputs
  criterion: A claim of absence, judged on the paper's test, a Wilcoxon rank-sum test of sessions to
    criterion between the groups at p < 0.05; reproduced when it is not significant. Criterion and
    training stages as in references 36 and 37. The paper does not say where the 5-mm window mice's
    training records are, nor how many mice each group has. Tolerances are the paper's stated
    spread.
