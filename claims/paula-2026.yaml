# Claims for de Paula, Jungmann, Fontenele, Aguiar, Carelli, Matias, Copelli & de Vasconcelos
# (2026), "Revealing Stimulus-Dependent Dynamics Through Statistical Complexity", PRX Life 4,
# 023018, doi:10.1103/wndc-k654, tested on DANDI:000713.
#
# Provenance: written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub
# Actions"), 2026-11-27, protocol pilot-18 as stated in docs/protocol.md.
#
# Text read: the version of record (published 22 May 2026, corrected 22 July 2026, the
# correction fixing Eq. 9), from paper/10.1103-wndc-k654.txt, which holds the main text
# (Methods, Results, figure legends, Table I) and the Supplemental Material (Secs. I to III,
# supplementary Figs. 1 to 6, dated April 28, 2026). The PDF pages could not be rendered in
# this run, so no figure was read from its image; every value below is from the text and the
# legends. The paper links no analysis code: its Data Availability statement cites only the
# dataset, and the one URL of the supplement (https://bit.ly/4smMnMj) holds the figures of the
# parameter sweep. No code was read.
#
# Data the paper used (Methods II.A, Results III.A, Table I, legends of Figs. 1 to 5). The
# Allen Institute Visual Behavior Neuropixels dataset, cited as DANDI:000713 version
# 0.240702.1725 (Ref. 22). Wild-type and transgenic mice, head fixed, recorded with six
# Neuropixels 1.0 probes targeting visual cortex. 102 sessions. Measured variables used:
# the spike times of sorted units, each unit's brain structure, and the stimulus timing.
# Epochs: the first hour of the session is active behavior, a change detection task with water
# reward, eight natural images per session shown as 250 ms flashes, each followed by a 500 ms
# gray screen; after it, a 25 min interval without reward that includes about 5 min of gray
# screen, the spontaneous activity epoch. 26 subregions in four major areas (Table I):
# visual cortex VISal, VISam, VISl, VISp, VISpm, VISrl (53 985 neurons); thalamus LGd, LP, MGd,
# MGm, MGv, PIL, POL, PoT, SGN (20 541); hippocampus CA1, CA3, DG, POST, ProS, SUB (42 396);
# midbrain APN, NB, NOT, MRN, SCig (17 163). Populations (Fig. 3b) VIS 586, TH 313, HP 363,
# MB 175. 100-s analysis windows (Figs. 2 and 4) natural images 11 321, active behavior
# 51 704, blanks 11 321, spontaneous 2870, total 77 216.
#
# Methods shared by the claims, with their sources.
# - Population: the units of one subregion in one session (Methods II.A, "local population";
#   586 VIS populations over 6 areas and 102 sessions fits one per area and session). Kept
#   when it has at least 30 neurons, and a subregion is kept when such populations occur in at
#   least eight sessions (Methods II.A, "at least 30 recorded neurons sampled across a minimum
#   of eight recording sessions").
# - Condition series (Methods II.A). Active behavior, the first ~3600 s cut into
#   nonoverlapping 100-s windows (up to 36). Natural images, for each of the eight images the
#   spikes in its 250 ms presentations concatenated (about 140 s), and the central 100 s kept.
#   Blanks, for each image the spikes in the 500 ms gray screens that follow its
#   presentations concatenated (about 240 s), central 100 s kept. Spontaneous, two 100-s
#   windows from the ~5 min gray-screen interval after the task.
# - Population rate r(t), spike counts of all N units in 50 ms bins divided by N times 50 ms
#   (Methods II.B, Eq. 1). The bins do not overlap: a 100-s window gives T = 2000 points
#   (Methods II.C).
# - CV, within each nonoverlapping 10-s window the standard deviation of r(t) over its mean;
#   a 100-s window's CV is the mean of its ten values (Methods II.B, Eq. 2).
# - Bandt and Pompe, D = 6, tau = 1, 720 patterns, ties ranked higher for the later element
#   (Methods II.C). Normalized permutation entropy H (Eq. 6); MPR statistical complexity C =
#   Q0 DJS[P, Pe] H with Q0 the constant that sets Q in [0, 1] (Eqs. 7 to 9, Refs. 28 and 29;
#   the standard Q0 of Ref. 29 for N = D! states is the reading of "normalization constant").
# - Surrogate, for each window each neuron's interspike intervals shuffled independently
#   (Methods II.E).
#
# Details the paper leaves open, used by several claims (each claim says which it uses).
# - Session selection: the paper names 102 sessions without saying how they were chosen.
#   Readings (a) every session in which at least one population passes the thresholds; (b)
#   the sessions that also have the spontaneous gray-screen epoch. The counts above (102
#   sessions, 1437 populations, Table I neurons) are the check: the reading closer to them is
#   adopted, both shown.
# - Unit selection: no quality filter is stated. Readings (a) all units of the units table;
#   (b) the Allen default filters for this dataset (ISI violations < 0.5, amplitude cutoff <
#   0.1, presence ratio > 0.9). Table I neuron counts decide between them (claim
#   table1-sample); both are run.
# - Natural images and blanks: whether change flashes are included, and how the gray screens
#   around omitted flashes are treated, is not stated. Readings (a) all flashes of the image,
#   omitted flashes giving neither an image nor a blank interval; (b) as (a) but blank
#   intervals only after flashes followed by another flash. Spike times are shifted so that
#   the pieces abut. The "central 100 s" is the 100 s centred on the series midpoint.
# - Spontaneous windows: which two 100-s windows of the ~5 min gray screen is not stated.
#   Readings (a) the first two consecutive windows from its start; (b) two windows centred in
#   the interval.
# - Surrogate ISI shuffling: where the shuffled train starts is not stated; the first spike is
#   kept in place and the shuffled intervals follow it (a standard choice; it cannot change
#   the outcome). Random seed fixed, a standard choice.
# - JS divergence between two distributions of window values (Figs. 2b, 4e to 4h): the
#   histogram bins are not stated. Readings (a) 50 and (b) 100 equal bins over the range of
#   the two pooled distributions. Log base 2, so that JS lies in [0, 1], as the color scale of
#   Fig. 4 ("1.0 ... maximally divergent distributions") implies; natural log as a variant.
# - Mann-Whitney tests: two-sided (a standard choice; the bound p < 0.001 is what is tested).
