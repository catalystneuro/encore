  quote: 'Within hippocampal regions, DG and CA3 exhibited high JS divergences across all four
    conditions, with the largest values occurring during spontaneous activity (median DG: 0.84;
    CA3: 0.84) and blank screens (median DG: 0.63; CA3: 0.63)'
  expected:
  - quantity: DG median JS divergence, spontaneous
    value: 0.84
    tolerance: 0.084
  - quantity: CA3 median JS divergence, spontaneous
    value: 0.84
    tolerance: 0.084
  - quantity: DG median JS divergence, blanks
    value: 0.63
    tolerance: 0.063
  - quantity: CA3 median JS divergence, blanks
    value: 0.63
    tolerance: 0.063
  criterion: On the per-condition JS matrices of fig2b-vis-summed-js-cv (histogram readings of
    the opening comment), the median of a region's divergences from the other 25 subregions
    (the reading of "median DG"; a variant takes only the other hippocampal subregions).
    Reproduced when, under one reading, the four medians are within tolerance and the
    spontaneous medians of DG and CA3 are their largest over the four conditions. The Fig. 2b
    legend gives DG and CA3 "moderate divergences (0.15–0.35)", which conflicts with these
    values; claim fig2b-legend-js-cv tests the legend.

- id: fig2b-legend-js-cv
  statement: In the CV-based JS divergences, visual and thalamic regions diverge strongly
    between spontaneous and visually driven states (above 0.40 for most visual areas, above
    0.30 for thalamic regions), DG and CA3 moderately (0.15 to 0.35), and midbrain least (below
    0.15 for most condition pairs).
  source: Fig. 2b legend
  quote: Visual cortex and thalamic regions showed large JS divergences between spontaneous
    activity and visually driven states, with values exceeding 0.40 for most visual areas and
    0.30 for thalamic regions. Hippocampal regions, particularly DG and CA3, exhibited moderate
    divergences (0.15–0.35) across condition pairs
  criterion: The legend compares conditions within a region ("between spontaneous activity and
    visually driven states"), while the Results describe region-pair matrices within each
    condition. Readings (a) per subregion, the JS divergence between its CV distribution in
    spontaneous activity and in each visually driven condition; (b) the region-pair matrices
    of fig2b-vis-summed-js-cv, comparing a region's row in spontaneous against the visually
    driven conditions. Histogram readings as in the opening comment. Reproduced when, under
    one reading, more than half of the visual subregions exceed 0.44 and more than half of the
    thalamic subregions exceed 0.33 for spontaneous against visually driven, DG and CA3 lie
    in 0.135 to 0.385 across condition pairs, and most midbrain values are below 0.165 (the
    printed bounds widened by 10%).

- id: fig3a-reference-systems
  statement: In the C-H plane with D = 6, white noise lies at H near 1 and C near 0, a sine
    near H 0 and C near 0.1, exponentially correlated Brownian motion at C 0.3 to 0.5 for H 0.3
    to 0.6, and chaotic maps (logistic, tent, Ikeda) near maximum complexity, C 0.4 to 0.5 at H
    0.5 to 0.8.
  source: Results III.C, paragraph 2; Fig. 3a; Supplemental Material Sec. I
  quote: white noise approaches maximum entropy (H ≈1) with minimal complexity (C ≈0), while
    deterministic periodic signals (sine wave) exhibit minimum entropy (H ≈0) and low
    complexity (C ≈0.1) ... exponentially correlated processes (colored noise) achieving
    moderate complexity (C ≈0.3–0.5) at intermediate entropy values (H ≈0.3–0.6)
  data: elsewhere
  where: No deposit; synthetic series generated from the definitions in Supplemental Material
    Sec. I (no recordings are used)
  criterion: Series generated as in Supplemental Material Sec. I (correlated Gaussian noise
    with K = floor(100 alpha) + 1 and exponential kernel, logistic map, Ikeda map with u = 0.9
    and p in [5, 17], tent map, 1/f^k noise), H and C with D = 6, tau = 1. The parameter values
    of Fig. 3a, the series lengths and the transients dropped are not given in the text (the
    figure, which could not be read here, shows the parameters); the series length is 10^5
    points with the first 10^3 dropped, a standard choice. The supplement gives the tent map
    slope as mu in (0, 2] and the Ikeda p in [5, 17]; it gives no range for the logistic r or
    for alpha and k, so these are open, read as logistic r in [3.5, 4], tent mu in (1, 2]
    (the chaotic part of the stated range, the one the statement concerns), alpha in [0.01,
    1] and k in [0, 3]. Reproduced when the positions fall in the ranges quoted, widened by
    10% of each bound.

- id: fig3b-complexity-levels-by-region
  statement: Across the hour of active recording, visual cortex and hippocampus keep the
    highest statistical complexity (C about 0.13 to 0.15), thalamus is intermediate (about
    0.11) and midbrain lowest (about 0.10), and these differences stay stable over time.
  source: Results III.C, paragraph 3; Fig. 3b
  quote: Visual cortex (VIS) and hippocampus (HP) maintained consistently high complexity
    values (C ≈0.13–0.15) throughout the hour-long recording session (n=102 sessions) ...
    Thalamus (TH) exhibited intermediate complexity (C ≈0.11), while midbrain (MB) showed the
    lowest and most stable complexity values (C ≈0.10)
  expected:
  - quantity: VIS and HP mean C over time, low end
    value: 0.13
    tolerance: 0.013
  - quantity: VIS and HP mean C over time, high end
    value: 0.15
    tolerance: 0.015
  - quantity: TH mean C
    value: 0.11
    tolerance: 0.011
  - quantity: MB mean C
    value: 0.10
    tolerance: 0.01
  criterion: 'Per major area and 100-s window index, the mean C over populations, with its
    standard error (Fig. 3b legend). Which windows form the time course is open: the section
    is about natural image presentation, but a time course over "the hour-long recording
    session" and the point counts of Figs. 3c to 3f (summing to 51 704, the active behavior
    count) point to (a) the 36 active-behavior windows; (b) the eight natural-image windows
    per population, in image order, is the other reading. Reproduced when, under one reading,
    each area''s mean over windows is within tolerance and the order MB < TH < VIS and HP
    holds at every window index; partially reproduced when the order holds at most indices.'

- id: fig3c-vis-ch-plane
  statement: Visual cortex windows span H 0.8 to 1.0 and C 0.1 to 0.4 in the C-H plane, and
    differ from ISI-shuffled surrogates, which cluster at lower complexity (C 0.1 to 0.2),
    Mann-Whitney p < 0.001.
  source: Results III.C, paragraph 4; Fig. 3c
  quote: Local neuronal population in the visual cortex occupied a broad region of the plane
    spanning high entropy values (H ≈ 0.8–1.0) with complexity values ranging from C ≈0.1 to C
    ≈0.4 ... the empirical distribution differed significantly from temporally shuffled
    surrogate data (MannWhitney test, p < 0.001), with surrogate data clustering at lower
    complexity values (C ≈0.1–0.2)
  statistics:
  - test: Mann-Whitney
    p: 0.001
    p_relation: "<"
    n: 21 084 VIS windows and their surrogates
  depends_on:
  - fig3b-complexity-levels-by-region
  criterion: Windows as the reading of fig3b adopted (the active-behavior windows, whose count
    21 084 matches), with natural-image windows shown. Ranges read as the 2.5th to 97.5th
    percentiles of H and C (a standard reading of a visual span, not given by the paper), with
    the 0th to 100th as a variant. Reproduced when the spans lie within the quoted ranges
    widened by 10% of each bound, the Mann-Whitney test on C gives p < 0.001 with empirical
    above surrogate, and the surrogate median C lies in 0.09 to 0.22.

- id: fig3d-th-ch-plane
  statement: Thalamic windows occupy a narrower part of the C-H plane than visual cortex (H 0.75
    to 0.95, C 0.05 to 0.25), and differ from surrogates (p < 0.001).
  source: Results III.C, paragraph 5; Fig. 3d
  quote: Thalamic local neuronal populations [Fig. 3(d)] displayed a similar but more compact
    distribution, occupying a narrower range of the C-H plane with slightly lower entropy (H
    ≈0.75–0.95) and complexity (C ≈0.05–0.25) compared to visual cortex ... empirical data
    differed significantly from surrogates (p < 0.001)
  statistics:
  - test: Mann-Whitney
    p: 0.001
    p_relation: "<"
    n: 11 265 TH windows and their surrogates
  depends_on:
  - fig3c-vis-ch-plane
  criterion: As fig3c-vis-ch-plane, for thalamus (11 265 windows). The test is not named in
    this paragraph; it is the Mann-Whitney test of the VIS paragraph and the Fig. 3 legend
    asterisks. Reproduced when the spans match under the range rule, the C span is narrower
    than that of VIS, and p < 0.001.

- id: fig3e-hp-ch-plane
  statement: Hippocampal windows have the broadest complexity distribution (C 0.05 to 0.4) at
    high entropy (H 0.85 to 1.0), and differ from surrogates (p < 0.001).
  source: Results III.C, paragraph 6; Fig. 3e
  quote: Hippocampal populations [Fig. 3(e)] exhibited the broadest distribution, spanning an
    extensive range of complexity (C ≈ 0.05–0.4) at high entropy (H ≈0.85–1.0)
  statistics:
  - test: Mann-Whitney
    p: 0.001
    p_relation: "<"
    n: 13 059 HP windows and their surrogates
  depends_on:
  - fig3c-vis-ch-plane
  criterion: As fig3c-vis-ch-plane, for hippocampus (13 059 windows). Reproduced when the spans
    match under the range rule, the C span is the widest of the four areas, and p < 0.001.

- id: fig3f-mb-ch-plane
  statement: Midbrain windows occupy the most restricted part of the C-H plane, at high entropy
    (H 0.9 to 1.0) and low complexity (C 0.05 to 0.2), yet differ from surrogates (p < 0.001).
  source: Results III.C, paragraph 7; Fig. 3f
  quote: Midbrain populations [Fig. 3(f)] occupied the most restricted region of the C-H plane,
    clustering at high entropy (H ≈0.9–1.0) but consistently low complexity (C ≈ 0.05–0.2) ...
    Nevertheless, empirical data remained significantly different from surrogates (p < 0.001)
  statistics:
  - test: Mann-Whitney
    p: 0.001
    p_relation: "<"
    n: 6296 MB windows and their surrogates
  depends_on:
  - fig3c-vis-ch-plane
  criterion: As fig3c-vis-ch-plane, for midbrain (6296 windows). Reproduced when the spans match
    under the range rule, the C span is the narrowest of the four areas, and p < 0.001.

- id: fig3-complexity-range-fractions
  statement: The fractions of windows by complexity range are, for visual cortex, 0.8% in
    [0.3, 0.4] and 4.9% in [0.0, 0.1]; thalamus 0.6% in [0.2, 0.3] and 24.6% in [0.0, 0.1];
    hippocampus 2.7% in [0.3, 0.4] and 9.5% in [0.0, 0.1]; midbrain 45.4% in [0.1, 0.2] and
    54.0% in [0.0, 0.1].
  source: Results III.C, paragraph 4
  quote: Among the visual area windows analyzed, 0.8% exhibit complexity values in the range
    [0.3,0.4], compared to 4.9% in the range [0.0,0.1]. For thalamic regions, 0.6% of windows
    fall in the range [0.2,0.3], compared to 24.6% in the range [0.0,0.1]
  depends_on:
  - fig3b-complexity-levels-by-region
  expected:
  - quantity: VIS windows with C in [0.3, 0.4]
    value: 0.8
    tolerance: 0.08
    unit: percent
  - quantity: VIS windows with C in [0.0, 0.1]
    value: 4.9
    tolerance: 0.49
    unit: percent
  - quantity: TH windows with C in [0.2, 0.3]
    value: 0.6
    tolerance: 0.06
    unit: percent
  - quantity: TH windows with C in [0.0, 0.1]
    value: 24.6
    tolerance: 2.46
    unit: percent
  - quantity: HP windows with C in [0.3, 0.4]
    value: 2.7
    tolerance: 0.27
    unit: percent
  - quantity: HP windows with C in [0.0, 0.1]
    value: 9.5
    tolerance: 0.95
    unit: percent
  - quantity: MB windows with C in [0.1, 0.2]
    value: 45.4
    tolerance: 4.54
    unit: percent
  - quantity: MB windows with C in [0.0, 0.1]
    value: 54.0
    tolerance: 5.4
    unit: percent
  criterion: Windows as the reading of fig3b adopted, with the other reading shown. The bins
    are taken half open, [a, b), the last one closed (a standard choice; it can move a few
    windows only). Reproduced when all eight fractions are within tolerance under one reading;
    partially reproduced when at least six are.

- id: fig4a-vis-complexity-by-condition
  statement: All six visual areas have higher median complexity during natural image
    presentation (0.16 to 0.26) than during spontaneous activity (0.1), with active behavior
    and blank screens intermediate (0.1 to 0.19), all pairwise comparisons p < 0.001.
  source: Results III.D, paragraph 2; Fig. 4a and its legend
  quote: All six visual areas (VISl, VISal, VISp, VISam, VISrl, VISpm) showed elevated median
    complexity during natural image presentation (0.16–0.26) compared to spontaneous activity
    (0.1), with active behavior and blank screen conditions producing intermediate values
    (0.1–0.19)
  statistics:
  - about: pairwise comparisons between conditions, each visual area
    test: not named
    p: 0.001
    p_relation: "<"
    n: natural images 11 321, active behavior 51 704, blanks 11 321, spontaneous 2870 windows
      over all regions
  expected:
  - quantity: lowest VIS subregion median C, natural images
    value: 0.16
    tolerance: 0.016
  - quantity: highest VIS subregion median C, natural images
    value: 0.26
    tolerance: 0.026
  - quantity: VIS subregion median C, spontaneous
    value: 0.1
    tolerance: 0.01
  - quantity: lowest VIS subregion median C, active behavior and blanks
    value: 0.1
    tolerance: 0.01
  - quantity: highest VIS subregion median C, active behavior and blanks
    value: 0.19
    tolerance: 0.019
  criterion: 'Per visual subregion and condition, the median C of the 100-s windows pooled over
    populations, under the condition readings of the opening comment. The test of "all
    pairwise comparisons" is not named; the paper uses Mann-Whitney elsewhere (Figs. 1c, 3),
    so readings are (a) two-sided Mann-Whitney for each of the six condition pairs per area,
    uncorrected; (b) the same with Bonferroni over the 36 tests. Reproduced when, under one
    reading, every area has natural images > active and blanks > spontaneous in median, the
    medians fall in the quoted ranges widened by 10% of each bound, and all pairwise tests
    give p < 0.001. The legend gives narrower ranges (VISl 0.15–0.26; VISal 0.15–0.25; VISp
    0.16–0.19; spontaneous 0.1 each) and the IQRs 0.08 to 0.12 in visually driven states;
    these are reported and compared. Partially reproduced when the order holds but a value or
    test misses.'

- id: fig4b-thalamus-lgd-lp-modulated
  statement: Of nine thalamic nuclei, only LGd and LP show significant modulation of
    complexity across conditions (p < 0.001), higher during visually driven states (0.14 to
    0.18) than spontaneous activity (0.11 to 0.12), with smaller effects than visual cortex.
  source: Results III.D, paragraph 3; Fig. 4b legend
  quote: Among nine examined regions, only the lateral geniculate dorsal (LGd) and lateral
    posterior (LP) nuclei, both components of the visual thalamic pathway, showed significant
    modulation across conditions (p < 0.001). LGd and LP exhibited elevated complexity during
    visually driven states (0.14–0.18) compared to spontaneous activity (0.11–0.12)
  statistics:
  - test: not named
    p: 0.001
    p_relation: "<"
    n: LGd and LP windows in the four conditions
  depends_on:
  - fig4a-vis-complexity-by-condition
  expected:
  - quantity: LGd and LP median C, visually driven states, low end
    value: 0.14
    tolerance: 0.014
  - quantity: LGd and LP median C, visually driven states, high end
    value: 0.18
    tolerance: 0.018
  - quantity: LGd and LP median C, spontaneous, low end
    value: 0.11
    tolerance: 0.011
  - quantity: LGd and LP median C, spontaneous, high end
    value: 0.12
    tolerance: 0.012
  criterion: 'Medians as fig4a. The test of "modulation across conditions" is not named.
    Readings (a) a Kruskal-Wallis test across the four conditions; (b) the pairwise
    Mann-Whitney tests of fig4a, every visually driven condition against spontaneous. The
    legend gives other values (LP 0.12–0.14 against 0.11; LGd 0.12–0.15 against 0.1), a
    conflict with the text; the expected values are the text''s, and the legend''s are a
    second reading of the values. Reproduced when, under one test reading, LGd and LP give
    p < 0.001 with visually driven medians above spontaneous, their medians match the text or
    the legend values under the range rule, and their visually driven minus spontaneous
    difference is smaller than that of every visual area.'

- id: fig4b-other-thalamus-not-modulated
  statement: The other seven thalamic nuclei (MGd, PoT, SGN, POL, MGm, MGv, PIL) keep uniformly
    low complexity (0.10 to 0.13) with no significant stimulus dependence.
  source: Results III.D, paragraph 3; Fig. 4b
  quote: The remaining seven thalamic nuclei (MGd, PoT, SGN, POL, MGm, MGv, PIL) maintained
    uniformly low complexity (0.10–0.13) with minimal variability across all conditions,
    showing no significant stimulus-dependence
  depends_on:
  - fig4b-thalamus-lgd-lp-modulated
  expected:
  - quantity: median C of the seven nuclei, low end
    value: 0.10
    tolerance: 0.01
  - quantity: median C of the seven nuclei, high end
    value: 0.13
    tolerance: 0.013
  criterion: A claim of absence. The paper's test is the one of fig4b-thalamus-lgd-lp-modulated,
    unnamed, at its only stated level p < 0.001; both test readings of that claim are run.
    Reproduced when, for each of the seven nuclei, the test does not reach p < 0.001, and the
    medians lie in 0.09 to 0.143; not reproduced when the test finds modulation in any of
    them. The size of each nucleus' largest condition difference in median C is reported
    either way.

- id: fig4c-dg-ca3-complexity
  statement: DG and CA3 show elevated complexity across most conditions (DG 0.19 to 0.27, CA3
    0.15 to 0.21), peaking during spontaneous activity, opposite to visual cortex, while CA1,
    POST, ProS and SUB stay lower and stable (0.11 to 0.15).
  source: Results III.D, paragraph 4; Fig. 4c and its legend
  quote: 'DG and CA3 showed elevated complexity across most conditions (DG: 0.19–0.27; CA3:
    0.15–0.21) with modest conditiondependence ... Intriguingly, these regions exhibited peak
    complexity during spontaneous activity, opposite to the pattern observed in visual cortex.
    In contrast, CA1, POST, ProS, and SUB maintained more stable, lower complexity values
    (0.11–0.15) across states'
  expected:
  - quantity: DG median C, low end
    value: 0.19
    tolerance: 0.019
  - quantity: DG median C, high end
    value: 0.27
    tolerance: 0.027
  - quantity: CA3 median C, low end
    value: 0.15
    tolerance: 0.015
  - quantity: CA3 median C, high end
    value: 0.21
    tolerance: 0.021
  - quantity: CA1, POST, ProS and SUB median C, low end
    value: 0.11
    tolerance: 0.011
  - quantity: CA1, POST, ProS and SUB median C, high end
    value: 0.15
    tolerance: 0.015
  criterion: 'Medians as fig4a, per hippocampal subregion and condition. The legend differs from
    the text: it gives DG and CA3 low medians in natural images (DG 0.12; CA3 0.11; CA1 0.1)
    and elevated in the other conditions (DG 0.19–0.26; CA3 0.13–0.18; CA1 0.12–0.17), POST,
    ProS and SUB 0.1–0.13; the legend thus groups CA1 with DG and CA3, as does the summary
    of Results III.D ("some subfields (DG, CA3, CA1) maintaining high complexity that peaks
    during spontaneous activity"), while the text range puts CA1 with POST, ProS and SUB.
    Readings of the ranges (a) the text''s, over "most conditions"
    (three of four); (b) the legend''s, natural images apart. Reproduced when, under one
    reading, the DG and CA3 medians match under the range rule, their highest median is in
    spontaneous activity, and CA1, POST, ProS and SUB match their range; partially
    reproduced when the spontaneous peak holds but the values miss.'

- id: fig4d-midbrain-complexity-invariant
  statement: Most midbrain areas (NB, MRN, SCig, APN) keep uniformly low complexity (0.10 to
    0.12) across conditions; only NOT shows modest stimulus dependence (0.13 to 0.15 in
    visually driven states against 0.13 in spontaneous activity).
  source: Results III.D, paragraph 5; Fig. 4d and its legend
  quote: Most regions (NB, MRN, SCig, APN) showed uniformly low complexity (0.10–0.12) with
    minimal variability across all behavioral states ... Only the nucleus of the optic tract
    (NOT) displayed modest stimulus-dependence (0.13–0.15 during visually driven states versus
    0.13 during spontaneous activity)
  expected:
  - quantity: NB, MRN, SCig and APN median C, low end
    value: 0.10
    tolerance: 0.01
  - quantity: NB, MRN, SCig and APN median C, high end
    value: 0.12
    tolerance: 0.012
  - quantity: NOT median C, visually driven, high end
    value: 0.15
    tolerance: 0.015
  - quantity: NOT median C, spontaneous
    value: 0.13
    tolerance: 0.013
  criterion: 'Medians as fig4a. No test is reported for these regions. The legend gives NOT
    0.11–0.18, NB 0.11–0.12, MRN 0.10–0.11, SCig 0.1–0.11 and APN "0.9", read as 0.09 (C of
    these data cannot reach 0.9 by Fig. 3f). Readings of the values (a) the text; (b) the
    legend. Reproduced when, under one reading, the medians of NB, MRN, SCig and APN in every
    condition lie in their range widened by 10% of each bound, and the NOT range of medians
    across conditions is the largest of the five midbrain areas.'

- id: fig4e-js-complexity-natural-images
  statement: During natural image presentation the complexity distributions of visual areas
    are similar to each other (JS below 0.2) but diverge from thalamus and midbrain (JS above
    0.4), and DG and CA3 diverge moderately from other regions (JS 0.3 to 0.5).
  source: Results III.D, paragraph 6; Fig. 4e legend
  quote: During natural image presentation [Fig. 4(e)], visual cortex regions showed high
    within-group similarity (JS divergence <0.2) but large divergences from other brain areas
    (JS >0.4 for VIS-TH and VIS-MB comparisons)
  depends_on:
  - fig4a-vis-complexity-by-condition
  criterion: Per condition, the matrix of JS divergences between the complexity distributions
    (100-s windows) of every pair of subregions, with the histogram readings of the opening
    comment. Reproduced when, under one reading, most (more than half) of the VIS-VIS pairs
    are below 0.22, most VIS-TH and VIS-MB pairs above 0.36, and most pairs of DG or CA3 with
    other subregions lie in 0.27 to 0.55 (bounds widened by 10%).

- id: fig4fg-js-complexity-active-blanks
  statement: During active behavior and blank screens visual cortex keeps complexity
    distributions distinct from subcortical structures (JS above 0.4), with within-hippocampus
    divergences of 0.2 to 0.4 during active behavior.
  source: Results III.D, paragraph 6; Fig. 4f and 4g legends
  quote: During active behavior [Fig. 4(f)] and blank screens [Fig. 4(g)], similar patterns
    persisted, with visual cortex maintaining distinct complexity distributions from
    subcortical structures
  depends_on:
  - fig4e-js-complexity-natural-images
  criterion: Matrices as fig4e. Reproduced when, under one reading, in both conditions most
    pairs of a VIS subregion with a TH, HP or MB subregion exceed 0.36 (the legend's 0.4,
    widened by 10%), and in active behavior most HP-HP pairs lie in 0.18 to 0.44.

- id: fig4h-js-complexity-spontaneous-converges
  statement: In spontaneous activity the JS divergences between regions are lower overall, visual
    cortex differing less from other regions (JS 0.2 to 0.4) than in visually driven states, and
    midbrain divergences stay low in all conditions (below 0.2 within the midbrain group).
  source: Results III.D, paragraph 6; Fig. 4h legend
  quote: 'Critically, spontaneous activity [Fig. 4(h)] exhibited reduced overall divergences,
    with visual cortex showing smaller differences from other regions (JS: 0.2–0.4) compared to
    visually driven states ... Midbrain areas showed consistently low divergence across all
    conditions (JS <0.2 within MB group)'
  depends_on:
  - fig4e-js-complexity-natural-images
  criterion: Matrices as fig4e. Reproduced when, under one reading, the mean of all off-diagonal
    divergences in spontaneous activity is below that of each visually driven condition, the
    mean VIS against non-VIS divergence in spontaneous activity is below that of each visually
    driven condition with most of those pairs in 0.18 to 0.44, and most MB-MB pairs are below
    0.22 in every condition.

- id: supp-robustness-parameters
  statement: The hierarchical, stimulus-dependent pattern of complexity across regions holds
    for other parameter choices (bin sizes 20 and 50 ms, D from 3 to 6, tau from 1 to 4).
  source: Results III.D, paragraph 5; Supplemental Material Sec. II and supplementary Figs. 1
    to 5
  quote: These analyses were repeated for different parameter choices (D, τ and bin sizes)
    yielding consistent hierarchical results
  depends_on:
  - fig4a-vis-complexity-by-condition
  criterion: 'Recomputed for the five combinations the supplement shows (bin 20 ms with D 3 and
    tau 4, D 5 and tau 1, D 6 and tau 1; bin 50 ms with D 4 and tau 2, D 5 and tau 3). The
    20 ms window counts of the supplementary legends (11 321, 51 452, 11 265, 2856) are
    compared. "Consistent hierarchical results" is read as the main pattern of Fig. 4: in
    each visual area the natural image median of C exceeds the spontaneous one, and the
    visually driven minus spontaneous difference is larger in visual cortex than in midbrain.
    Reproduced when this holds for all five combinations; partially reproduced for three or
    four.'

- id: fig5-vis-complexity-cv-coupling
  statement: In visual cortex complexity rises with CV during visually driven conditions
    (natural images CV 0.1 to 0.9 and C 0.08 to 0.34; active behavior CV 0.2 to 1.6 and C 0.10
    to 0.38; blanks CV 0.1 to 1.2 and C 0.10 to 0.39), while in spontaneous activity the
    trajectory compresses, with C below about 0.15.
  source: Results III.E, paragraphs 2 and 6; Fig. 5 legend
  quote: 'During natural image presentation, visual cortex exhibited a monotonic increase in
    complexity with increasing CV (spanning CV: 0.1–0.9, C: 0.08–0.34)'
  expected:
  - quantity: VIS natural images, highest trajectory C
    value: 0.34
    tolerance: 0.034
  - quantity: VIS active behavior, highest CV
    value: 1.6
    tolerance: 0.16
  - quantity: VIS active behavior, highest trajectory C
    value: 0.38
    tolerance: 0.038
  - quantity: VIS blanks, highest CV
    value: 1.2
    tolerance: 0.12
  - quantity: VIS blanks, highest trajectory C
    value: 0.39
    tolerance: 0.039
  - quantity: VIS spontaneous, highest trajectory C
    value: 0.15
    tolerance: 0.015
  criterion: 'Per major area and condition, the 100-s windows binned by CV, and the mean C with
    its standard error in each bin (Fig. 5 legend, "mean trajectories"). The CV bin width and
    any minimum count per bin are not stated. Readings (a) bins of 0.1 CV, (b) bins of 0.05
    CV, each with no minimum and with a minimum of 10 windows. The CV span is the range of
    occupied bins and the C span the range of bin means. "Monotonic increase" is read as each
    bin mean not falling below the previous one by more than the sum of their standard
    errors, with a positive Spearman correlation of C and CV over windows. Reproduced when,
    under one reading, the VIS trajectory rises in natural images, active behavior and
    blanks, its spans match the quoted values under the range rule, and its maximum in
    spontaneous activity is below 0.165.'

- id: fig5-th-weaker-coupling
  statement: Thalamus shows a weaker but consistent positive complexity-CV relationship in the
    visually driven conditions, with shallower slopes than visual cortex and a restricted range
    (CV 0.2 to 0.8, C 0.10 to 0.20).
  source: Results III.E, paragraph 3; Fig. 5
  quote: 'Thalamic regions displayed weaker but consistent positive complexity-CV relationships
    across visually driven conditions (Fig. 5). The slopes of these trajectories were
    shallower than in visual cortex, and the explored regions of the C-CV plane were more
    restricted (typical range: CV: 0.2–0.8, C: 0.10–0.20)'
  depends_on:
  - fig5-vis-complexity-cv-coupling
  criterion: Trajectories as fig5-vis-complexity-cv-coupling. Slope read as the least-squares
    slope of C on CV over windows. Reproduced when, under one reading, in each visually
    driven condition the TH slope is positive and below the VIS slope, and the TH spans fall
    in CV 0.18 to 0.88 and C 0.09 to 0.22.

- id: fig5-hp-spontaneous-elevated
  statement: Hippocampus shows modest complexity (C 0.12 to 0.19) in the visually driven
    conditions but markedly elevated complexity during spontaneous activity (C 0.12 to 0.25) at
    intermediate CV (0.4 to 0.7), comparable to visual cortex during image viewing.
  source: Results III.E, paragraph 4; Fig. 5 legend; Discussion IV.B, paragraph 1
  quote: 'However, during spontaneous activity, hippocampus exhibited markedly elevated
    complexity (C: 0.12–0.25) at intermediate CV values (0.4–0.7), reaching levels comparable to
    those observed in visual cortex during active image viewing'
  depends_on:
  - fig5-vis-complexity-cv-coupling
  expected:
  - quantity: HP spontaneous, highest trajectory C at CV 0.4 to 0.7
    value: 0.25
    tolerance: 0.025
  - quantity: HP visually driven, highest trajectory C
    value: 0.19
    tolerance: 0.019
  criterion: Trajectories as fig5-vis-complexity-cv-coupling. Reproduced when, under one
    reading, the HP bin means at CV 0.4 to 0.7 in spontaneous activity reach 0.25 within
    tolerance and exceed the HP maximum of every visually driven condition, whose maxima lie
    within 0.19 +/- 0.019.

- id: fig5-mb-flat
  statement: Midbrain complexity stays low (C 0.10 to 0.13) across the full range of CV (0.1
    to 0.9) in all conditions, giving nearly flat trajectories.
  source: Results III.E, paragraph 5; Fig. 5 legend
  quote: 'Complexity values remained consistently low (C: 0.10–0.13) across the full range of
    observed CV values (0.1–0.9) in all behavioral states, yielding nearly flat trajectories in
    the C-CV plane'
  depends_on:
  - fig5-vis-complexity-cv-coupling
  criterion: Trajectories as fig5-vis-complexity-cv-coupling. Reproduced when, under one
    reading, in all four conditions the MB bin means lie in 0.09 to 0.143 and the MB
    least-squares slope of C on CV is the smallest in absolute value of the four areas. The
    Fig. 5 legend gives MB in natural images as C 0.10 to 0.15; bin means up to 0.165 in
    that condition meet the legend's reading and are reported as such.

- id: supp-fig6-mean-correlation
  statement: In visual cortex the mean pairwise spike count correlation is elevated during
    active behavior and blank screens (median 0.08 to 0.13) and near zero during natural
    images and spontaneous activity (0.00 to 0.01); midbrain values are low and invariant.
  source: Supplemental Material Sec. III; supplementary Fig. 6 legend
  quote: Visual cortex subregions exhibited elevated  ̄r during active behavior and blank screen
    conditions (median  ̄r ≈0.08–0.13), while natural image presentation and spontaneous
    activity yielded near-zero correlations ( ̄r ≈0.00–0.01)
  expected:
  - quantity: VIS subregion median mean correlation, active and blanks, low end
    value: 0.08
    tolerance: 0.008
  - quantity: VIS subregion median mean correlation, active and blanks, high end
    value: 0.13
    tolerance: 0.013
  - quantity: VIS subregion median mean correlation, natural images and spontaneous, high end
    value: 0.01
    tolerance: 0.001
  criterion: 'Per 100-s window, the mean over all pairs of the population''s units of the
    Pearson correlation of their spike counts; the median over windows per subregion and
    condition. The count bin is not stated. Readings (a) 50 ms, the bin of all main analyses;
    (b) 20 ms, the other bin the paper uses. Units without spikes in a window are left out
    (their correlation is undefined; a standard choice). Reproduced when, under one reading,
    the VIS medians fall in the two quoted ranges widened by 10% of each bound (the near-zero
    range taken as below 0.011), and the midbrain medians differ across conditions by less
    than 0.02 (the reading of "low and largely invariant"; the bound is not from the paper).'

- id: complexity-separates-images-from-spontaneous
  statement: Neither CV nor mean pairwise correlation separates natural image presentation from
    spontaneous activity in visual cortex, while statistical complexity does.
  source: Supplementary Fig. 6 legend; Results III.D, paragraph 2
  quote: The convergence between  ̄r and CV confirms the robustness of the reported hierarchy,
    while neither measure distinguishes natural image presentation from spontaneous activity in
    visual cortex
  depends_on:
  - fig2a-vis-cv-by-condition
  - fig4a-vis-complexity-by-condition
  - supp-fig6-mean-correlation
  criterion: 'The paper names no measure of "distinguishes". Its tool for comparing
    distributions is the JS divergence (Results III.B), and its CV medians for natural images
    and spontaneous activity (VISp 0.39 against 0.29) differ, so a difference of medians
    cannot be the reading. Readings (a) per visual subregion, the JS divergence between the
    natural-image and spontaneous distributions of each measure (histogram readings of the
    opening comment); (b) the overlap of the interquartile ranges of the two distributions.
    Reproduced when, under one reading, in most visual subregions complexity separates the
    two conditions (larger JS, or IQRs that do not overlap) while CV and mean correlation do
    not (smaller JS than complexity, or overlapping IQRs). The comparison is reported for
    every subregion.'
