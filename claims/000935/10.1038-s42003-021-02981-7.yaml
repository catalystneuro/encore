# Claims for Prakash et al. (2022), Communications Biology 5, 33, on dandiset 000935.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23,
# protocol pilot-10 (docs/protocol.md, Reader).
#
# Text read: the version of record, open access, as served by Europe PMC (PMC8752598), main
# text, figure legends and Methods, with the supplementary PDFs from the PMC Open Access files:
# Supplementary Figures 1 to 7 with legends (MOESM2), the description of Supplementary Data 1
# to 7 (MOESM3), the reporting summary (MOESM11) and the peer review file (MOESM1). The
# Supplementary Data spreadsheets themselves were not read; MOESM3 says they are the source
# data of Figs. 2d, 3c, 4c, 4e, 5c, 6c, 6f, 7b to 7f and Supplementary Fig. 4c.
#
# Code. The paper links no analysis code. It names the software used: Prism 8.2.1 for all
# statistics, MC Rack and NeuroExplorer for the MEA data, MATLAB R2020a with Chronux 2.11 for
# the in vivo data. Every method detail below is from the Methods, the figure legends or the
# Results; details none of them fixes are named as open in the criteria.
#
# The data the paper used.
# In vitro (Figs. 2 to 6, Supplementary Figs. 1 to 6): E18 rat cortical, hippocampal and
# striatal neurons, nucleofected with hPOMC1-26-sbGLuc-P2A-dTomato (luciferase) or an opsin
# (ChR2(C128S)-EYFP, hGtACR2-EYFP, or the non-functional ChR2(C128S)-E97R-D253A-EYFP), grown as
# mixed cultures or as two-compartment co-cultures on 60-electrode MEAs (60MEA200/30iR-Ti),
# recorded at 10 kHz on an MEA2100-Lite system at DIV 13 to 26. Treatments were blue light,
# CTZ (10 uM), vehicle, presynaptic electrical stimulation, a synaptic blocker cocktail (SB),
# 590 nm light, BoNT/A1 and cutting the co-culture. Spikes were counted above 9 SD of baseline
# noise; the unit of the ladder plots is the electrode, with spikes counted in 5 s before and
# 5 s after a treatment, only on electrodes that responded to blue light. These data are not in
# the dandiset; its description lists only the in vivo experiment. The per-electrode counts
# are in Supplementary Data 1 to 6 of the article, so those claims are marked data elsewhere.
# In vivo (Fig. 7, Supplementary Fig. 7): six male PV-Cre mice, 9 to 19 weeks old, under
# isoflurane, one session each. All received AAV2/9-hSyn-hPOMC1-26-sbGLuc-P2A-dTomato in
# somatosensory thalamus; three also received Cre-dependent ChR2(C128S/D156A)-EYFP in SI
# (Opsin (+)), three did not (Opsin (-)). A 32-channel laminar probe (NeuroNexus
# A1x32-Poly2-5mm-50s-177, two columns of 16 contacts 50 um apart over 790 um) in barrel
# cortex recorded at 30 kHz (Open Ephys); an EMCCD camera imaged bioluminescence over the
# craniotomy (512 x 512 pixels, 1 s exposures), synchronised by TTL. A baseline of at least 3
# min was followed by CTZ infusion (50 ul of 2.36 mM over the craniotomy at 25 ul/min) and at
# least 20 min of recording. Imaging is missing for one Opsin (+) mouse. Seven contacts were
# excluded in all animals, leaving 25. Measured variables are LFP gamma power relative to
# baseline (dB), gamma event counts, MUA percent change from baseline, and the bioluminescence
# time series. The dandiset's description matches this experiment: six PV-Cre mice in two
# groups of three, extracellular electrophysiology and bioluminescence imaging, a ~3 min
# baseline, and time intervals marking CTZ infusion.
#
# Outside data. Supplementary Data 7 of the article holds the source data of Fig. 7b to 7f;
# the in vivo claims are tested on the dandiset and do not use it.
#
# Common in vivo method, from the Methods, used by the Fig. 7 claims below and cited there as
# "the in vivo pipeline". Contacts with RMS above Q3 + 3 IQR or below Q1 - 3 IQR of the 32
# contacts in a recording are errant; the paper reports the same 25 contacts for all animals,
# so the excluded set is read as the union over animals of the contacts flagged in each (if
# that union is not 7 contacts, both the union and the per-animal sets are shown). Data are
# downsampled to 10 kHz and re-referenced to the common average of the kept contacts. Gamma
# power: downsample to 1 kHz, 1 Hz high-pass (3rd order Butterworth), multitaper spectrogram
# (time-bandwidth 3, 5 tapers, 10 s windows in 1 s steps, each zero padded to 16384 samples),
# P = 10 log10(A/B) with B the mean power over the 180 s before bioluminescence onset for that
# contact and frequency, then the mean of P over the 30 to 100 Hz bins. Gamma events: 30 to
# 100 Hz band-pass (3rd order Butterworth), Hilbert amplitude envelope, points above the upper
# bound of the 99% jackknifed confidence interval of the baseline mean amplitude, kept when
# above for at least 100 ms, counted over the 1200 s after onset per contact. MUA: 300 to 3000
# Hz band-pass (3rd order Butterworth), spikes as points below -3 SD with SD estimated as the
# median divided by 0.6745, binned in 1 s, converted to percent change from baseline.
# Bioluminescence: 3 x 3 median filter per image, mean of a 50-pixel-diameter circular ROI next
# to the electrode shank, onset at the peak of the discrete derivative. All data are aligned
# to that onset; the post period is 0 to 1200 s after it. An electrode's value is the mean
# over the post period (for events, the count). A mouse's value is the 85th percentile over
# its 25 contacts.
# Open in that pipeline, with the readings allowed (each run; an outcome is the one all give):
# (o1) The Opsin (+) mouse without imaging has no bioluminescence onset. Readings: (a) align
# it to the start of CTZ infusion; (b) align it to the start of CTZ infusion plus the mean
# delay from infusion start to onset in the five imaged mice.
# (o2) The ROI is placed by hand next to the shank and no coordinates are given. Readings: (a)
# a 50-pixel circle at the ROI position if the dandiset records one; (b) the mean over the
# whole frame. The onset is taken from each.
# (o3) The event window: the Methods say the 1200 s "post CTZ period", the Results 0 to 1200 s
# after bioluminescence onset. Readings: (a) after onset; (b) after the start of infusion.
# (o4) The jackknife of the event threshold is not described. Readings: (a) leave one sample
# out over the baseline envelope (which equals mean plus t times the standard error); (b)
# leave one 1 s block out. The sampling rate of the event analysis is not stated; 10 kHz (the
# rate before the LFP step) and 1 kHz are both run.
# (o5) MUA. "Median divided by 0.6745" is read as median(|x|)/0.6745 of the filtered signal
# (the usual estimate; the median of x itself is near zero). Over which span it is taken is
# not said. Readings: (a) the whole recording; (b) the baseline. Counting: (a) every sample
# below threshold, as written; (b) each downward threshold crossing. Percent change is
# 100 x (bin - baseline mean) / baseline mean.
# (o6) The 85th percentile interpolation is not said. Readings: (a) MATLAB prctile, the
# paper's analysis software; (b) linear interpolation (numpy default).
# (o7) The filters' phase is not said; zero-phase filtering (filtfilt) is used as the standard
# choice in MATLAB analyses of this kind, which cannot change an outcome materially.
