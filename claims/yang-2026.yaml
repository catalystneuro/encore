# Claims for Yang (2026), "Form, Timing, and Behavioral Matching of the Population Response to
# ALM Photoinhibition", Research Square preprint doi:10.21203/rs.3.rs-11447300/v1, on DANDI
# 000363 (Mesoscale Activity Map, Chen et al. 2024, Cell 187:676-691), which the paper reuses.
#
# Provenance. Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub
# Actions"), 2026-11-21, protocol pilot-18 as stated in docs/protocol.md (Reader, steps 1 to 4).
#
# Text read. The preprint, version 1 (posted 2026-10-22), from
# paper/10.21203-rs.3.rs-11447300-v1.txt: abstract, Introduction, Results, Materials and
# Methods, Discussion, figure legends of Figures 1 to 3, Table 1, and the Extended Data legends
# (Figures 1-1, 2-1, 3-1). There is no separate supplement; the Extended Data are figures whose
# legends are in the text. No PDF was supplied and no figure was read. Values shown only in a
# figure (per-mouse points, curves) are not available; claims rest on the numbers the text and
# Table 1 print.
#
# Code read. None. Code Accessibility says the code "has been deposited in a private GitHub
# repository and will be made publicly available upon publication". No method detail below is
# settled by code. The analyses used Python 3.12, NumPy and scikit-learn logistic regression
# (lbfgs), and one random seed, 17, for splits, folds and match order (Methods, Code and data;
# Statistics).
#
# Statistics. The paper reports no hypothesis test; every estimate is an unweighted mean
# across mice with the SEM across mice (Methods, Statistics, "No test was added after the means
# were known"). No claim has a statistics entry. Tolerances are the printed SEM where one is
# given (the paper's stated spread), otherwise 10% of the value, and for printed ranges the
# range widened by 10% of each bound.
#
# Data the paper used (Methods, Dataset; Units and regions; Table 1). DANDI 000363, version
# 0.231012.2129; spike times, trial events, optogenetic locations and video keypoints from the
# derived session files. Mice performing a memory-guided directional licking task (instructed
# left or right, lick after a Go cue), with Neuropixels recordings from ALM, striatum,
# thalamus, midbrain and medulla. 168 sessions contained photoinhibition; the analysed sessions
# are those with bilateral ALM photoinhibition during the last 0.5 s of the delay, ending at Go.
# 19 mice and 93 sessions gave an ALM estimate; Table 1 gives the counts per region (ALM 19 /
# 93, striatum 13 / 48, thalamus 10 / 31, midbrain 16 / 71, medulla 8 / 35; after matching 19 /
# 87, 12 / 42, 10 / 29, 15 / 64, 8 / 32). Measured variables per trial: instructed side,
# photostimulation code and its location list, laser onset, Go cue time, lick times and
# directions, early-lick flag, outcome; per unit: spike times, classification label, electrode
# location; per video frame: jaw, nose and tongue keypoints.
#
# Shared methods, cited once here and named in the criteria by label. Each says where it comes
# from; details the paper does not fix are marked open, with the readings its text allows.
# Every reading is run; a claim is reproduced when its result matches under any combination of
# readings, and the readings that match are reported.
# M1 Sessions (Methods, Dataset). Sessions that contain photoinhibition trials. Bilateral
#   trials are those whose photostimulation control code has an optogenetic location list with
#   ALM on both sides. A session enters when the median bilateral laser onset is within 0.08 s
#   of -0.50 s relative to Go; sessions with onset about 1.2 s before Go are not pooled. Laser
#   trials are the bilateral trials of a retained session. Control trials have no
#   photostimulation and no early lick. Open, whether laser trials with an early lick are kept
#   (the exclusion is stated for controls only); readings (a) kept, (b) excluded.
# M2 Units, regions and sides (Methods, Units and regions). Units with classification label
#   "good" (the classifier label of Chen et al., not the spike-sorting quality flag).
#   Electrode locations are mapped to ALM, striatum, thalamus, midbrain or medulla, the two
#   hemispheres pooled. A region enters a session with at least 20 good units; an instructed
#   side enters with at least 10 laser and 10 control trials. Open, the mapping from annotated
#   brain areas to the five regions; readings (a) the region labels of Chen et al. 2024 if the
#   session files carry them, (b) the Allen CCF parent structures (ALM by its annotation,
#   striatum STR, thalamus TH, midbrain MB, medulla MY). Counts in Table 1 check the choice.
# M3 Behavior (not defined in the paper). Lick direction and reaction time are not defined.
#   Open; lick direction readings (a) the side of the first lick after Go from the lick
#   events, (b) from instructed side and outcome (hit is the instructed side, miss the other,
#   no-response trials have none). Reaction time is the first lick after Go minus Go, a
#   standard choice. Trials without a lick enter no analysis that needs lick direction or the
#   lick. The pre-lick window is the 200 ms before that first lick (Methods, Decoding; Matched
#   distance).
# M4 Rates (Methods, Rates and coding axes). In a window, the mean spike rate of each good
#   unit, z-scored by the mean and standard deviation over control trials in that window; units
#   with control SD below 1e-6 are dropped from that window. Open, how windows referenced to
#   laser onset are placed on control trials, which have no laser; readings (a) all trials on
#   Go, at the session's median laser onset plus the offsets, (b) laser trials on their own
#   onset, controls on the session's median onset relative to Go. Open, which units enter when
#   a unit is dropped in one window and kept in another; standard choice, the units kept in
#   every window a measure uses.
# M5 Axes and early difference (Methods, Rates and coding axes). Fit on control trials only,
#   within session and region. Choice axis, mean lick-right minus mean lick-left activity from
#   600 ms before Go to Go, after least-squares removal of mean jaw, nose and tongue position in
#   the same window. Action axis, the same contrast from Go to 300 ms after Go, no video
#   regression. Each scaled to unit length. Early difference, mean laser minus mean control
#   activity within instructed side, 20 to 120 ms after laser onset, the two sides combined in
#   proportion to their numbers of laser trials. Open, the video regression; readings (a) the x
#   and y coordinates of each keypoint averaged over the window's frames, with an intercept,
#   frames without a detected keypoint left out of its mean and a trial with no detection
#   given the control mean; (b) the same with trials lacking any keypoint dropped from the fit.
# M6 Fractions (Methods, Rates and coding axes). Q from a QR factorization of the two axes;
#   joint fraction = |Q^T d|^2 / |d|^2 for difference vector d; choice and action fractions =
#   (axis . d)^2 / |d|^2. The cosine between the axes is stored, not the result.
# M7 Summary (Methods, Statistics). Sessions are averaged within mouse with no weighting, then
#   the unweighted mean across mice; uncertainty is the SEM across mice (standard choice, n-1
#   in the SD). A ratio is formed per mouse, then averaged.
# M8 Decoding (Methods, Decoding). Feature per trial, its z-scored population vector minus the
#   mean of control trials of the same instructed side, that mean estimated inside the
#   training fold. Label, lick direction. L2-penalized logistic regression (scikit-learn,
#   lbfgs). Balanced accuracy under 5-fold cross-validation stratified by instructed side and
#   lick direction, seed 17. A session needs at least 40 trials and 15 of each lick direction.
#   Early versus pre-lick, penalty chosen from {0.1, 1, 10} inside the training fold; the
#   Go-aligned curve, fixed penalty 1. Open, which trials are decoded; the Results say
#   "Single-trial deviations from the control mean" and "There is no paired trial without
#   laser"; readings (a) laser trials only, (b) laser and control trials together. Open, how
#   the penalty is chosen inside the fold; standard choice, an inner stratified 5-fold
#   search on balanced accuracy. The penalty is read as scikit-learn's C.
# M9 Matching (Methods, Matched distance). Within session and instructed side, each laser
#   trial with a lick paired to a control trial with the same lick direction and reaction time
#   within 100 ms, without replacement, in random order, ties broken at random, seed 17;
#   sessions with fewer than 10 pairs dropped. For each retained control trial a second control
#   trial drawn by the same rule from controls not already used. Residual, mean laser-control
#   Euclidean distance minus mean control-control Euclidean distance, on z-scored population
#   vectors. Primary window, the 200 ms before the lick in 50 ms bins. Open, the closest match
#   or any match within the caliper; readings (a) the control with the smallest reaction-time
#   difference, (b) a random control within 100 ms. Open, a laser pair whose control has no
#   second control; readings (a) the pair is dropped from both distances, (b) kept for the
#   laser-control distance only. Open, how the four 50 ms bins give one pre-lick distance;
#   readings (a) the distance per bin averaged over bins, (b) the distance of the four bins
#   concatenated. Open, the z-scoring of the pre-lick bins; readings (a) by control trials in
#   each lick-aligned bin, (b) by all non-early-lick control trials as for the curve.
# M10 Time courses (Methods, Time courses). Go-aligned, from 600 ms before to 600 ms after Go;
#   distance in 50 ms bins; joint fraction and balanced accuracy in 100 ms bins averaged from
#   adjacent 50 ms rates; axes not refit. For the distance curve, units must pass the SD
#   threshold in every bin; if fewer than 20 do, units passing in at least 80% of bins are kept
#   and their failing bins set to zero; the z-score reference for these bins is every
#   non-early-lick control trial. Energy per neuron, the squared length of the laser-minus-
#   control vector inside or outside the coding subspace divided by the number of units. Open,
#   the step of the 100 ms bins (the text names bins "centered 250 ms after Go" and "that
#   begins at onset"); readings (a) overlapping bins stepped by 50 ms, (b) non-overlapping
#   bins from -600 ms. Open, the bin of the energy curve; the text names "the 100 ms bin that
#   begins at onset", so 100 ms bins as for the fraction.
#
# Data. Every claim uses the dataset alone (data: dataset, the default). No outside data is
# used.
