# Claims for Semenov, Silkuniene, Silkunas, Pakhomova, Bixler, Ibey, Kochunov & Pakhomov (2026),
# "Sub-microsecond optical measurements of cell membrane charging and lesioning by pulsed electric
# fields", Bioelectrochemistry 171, 109283, on dandiset 001521.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-02,
# protocol pilot-13 as stated in docs/protocol.md.
#
# Text read: the version of record (PDF supplied by a person, text extracted with PyMuPDF), the
# main text with its Materials and methods, figure legends and Data availability. The paper has no
# supplement. It links no code, and its Data availability says data are available on request. The
# PDF pages could not be rendered in this run, so the figures were read from their legends and the
# Results only.
#
# Data the paper used. CHO-K1 cells plated 1 to 3 h on glass-bottom dishes so that they stay
# spheroidal, at room temperature (21 to 23 C), in a physiological solution of 1.64 S/m. Unipolar
# 0.3- or 1-us pulses through two tungsten rods 1.6 mm apart; field strengths are the Sim4Life
# values 5 um above the glass.
#   - Pulsed laser potentiometric imaging (Methods 2.3; Figs. 1 to 5 and 7): cells stained with
#     FluoVolt or Di-8-ANEPPS, one ~6-ns 440-nm laser flash per pulse, at 900 ns into 1-us pulses
#     or 275 ns into 0.3-us pulses, pulses at 6 Hz, sets of 100 images (40 without pulse, 60 with).
#     Fluorescence along a 6-pixel trace on the cell perimeter, resampled to 360 points; dF/F0 in
#     percent, and at the poles the mean over arcs of plus or minus 5 degrees. Groups of n = 4
#     (FluoVolt), 5 (Di-8-ANEPPS), 8 (Fig. 2C, D), 10 (0.3 us), 7 with 1 mM Gd3+ and 5 controls,
#     and 5 (two-pulse protocol), one cell per experiment.
#   - Fluo-4 calcium imaging (Methods 2.4; Fig. 6): cells loaded with 2.5 uM Fluo-4 AM, widefield
#     images every 1 or 2 s; background-subtracted mean fluorescence in a circular region over the
#     cell, dF/F0 in percent with F0 the mean before the pulse. Set A: one 1-us pulse at 60 s,
#     recording for 5 min, 0 to 1200 V/cm, 1 frame/s, mean traces over 14 cells (Fig. 6A). Set B:
#     60 pulses at 6 Hz from 30 s, recording for 150 s, one frame every 2 s, 28 to 54 cells per
#     field strength, 224 cells in all (Fig. 6B).
#
# The dandiset, by its archive title ("Threshold Characterization of Ca2+ Uptake in CHO Cells
# Following 1-us Electroporation Pulses") and description, is meant to hold set A, the Fluo-4
# imaging after single 1-us pulses (Fig. 6A). The claims on the potentiometric imaging and on the
# 60-pulse trains are kept to cover the paper's main findings; whether the dataset holds those data
# is the author's to find.
#
# Method details the paper leaves open for the Fig. 6A claims, with the readings allowed:
#   - The field strengths of Fig. 6A are given only as "from 0 to 1200 V/cm" with 780, 1000 and
#     1200 V/cm named; the set is taken from the dataset.
#   - "averaged across 14 cells" (Fig. 6A legend) can be 14 cells per field strength or 14 in all.
#   - The test behind "not statistically significant" for 780 V/cm is not named. Methods 2.5 names
#     Student's t-test and the one-sample t-test; Section 3.6 tests the 60-pulse data with a
#     one-sample t-test of the mean signal by the end of recording against zero and a t-test
#     against a weaker field. Readings are (a) one-sample t-test of each cell's dF at the end of
#     recording against zero, (b) two-tailed Student's t-test of that value against the 0 V/cm
#     group.
#   - The time over which the post-pulse dF is taken is not fixed. Readings are (a) the end of the
#     recording, as Section 3.6 uses for the trains, averaged over the last 10 frames (a standard
#     choice), (b) each cell's peak dF after the pulse.
#   - The size and placement of the circular region and of the cell-free background region are not
#     given; they are a standard choice that should not change the outcome.
