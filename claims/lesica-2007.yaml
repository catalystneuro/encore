    unclassified); 26 of them have the 90 s repeats and 31 have white noise and the 12 s repeats.
  source: Experimental Procedures, Natural Scene Movie and White Noise Stimuli, paragraph 2
  quote: This sample included 68 cells... 44 cells that were ON-center (19 X cells, 19 Y cells,
    and 6 cells that were not classified ... and 24 cells that were OFF-center (11 X cells, 8 Y
    cells, and 5 cells that were not classified). For a subset of 26 cells ... For a subset of
    31 cells
  expected:
  - quantity: cells passing inclusion with HC and LC 15 min movie
    value: 68
    tolerance: 6.8
  - quantity: cells with HC and LC white noise and 12 s repeats
    value: 31
    tolerance: 3.1
  - quantity: cells with 90 s cross-validation repeats
    value: 26
    tolerance: 2.6
  criterion: Inclusion as the Methods give it, the RF peak (largest absolute value of the HC and
    of the LC movie RF) at least ten times the SD of an RF estimated from shuffled responses.
