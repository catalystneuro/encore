# Claims for Lesica, Jin, Weng, Yeh, Butts, Stanley & Alonso (2007), Neuron 55:479-491, on
# DANDI:002028.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-19,
# protocol as stated in docs/protocol.md (Reader, version pilot-16).
#
# Text read: the version of record (PyMuPDF text of the journal PDF, supplied by a person),
# with its Results, figure legends, Discussion and Experimental Procedures, and its Supplemental
# Data (one PDF, the legend of Supplementary Figure 1). The PDF pages could not be rendered in
# this run (no PDF renderer was installed), so values shown only in figures (the bar heights of
# Figures 3, 4 and 6, the contrasts of Figure 7C, the per-pair correlation coefficients of
# Supplementary Figure 1, and which bars of Figure 6 carry ** and which ***) were not read; no
# claim rests on them. The paper links no analysis code, so none was read.
#
# Data the paper used. Anesthetized (ketamine, then thiopental) and paralyzed cats; the number
# of cats is not given. Extracellular single units recorded with a multielectrode array in
# layer A of the LGN, spike sorted offline; cells classed X or Y from counterphased sine wave
# gratings (Hochstein and Shapley 1976) and ON or OFF center; all nonlagged. Stimuli, on a
# 120 Hz monitor updated every other refresh (50 Hz frames), 0.2 degree pixels, 48 x 48
# pixel section: natural scene movies (cat-mounted camera, Kayser et al. 2003, 8 bit gray,
# interpolated to 50 Hz) at RMS contrast 0.40 (HC) and 0.15 (LC), and spatiotemporal binary
# white noise at RMS contrast 0.55 (HC) and 0.20 (LC). Sessions per cell: a single 15 min movie
# segment at HC and LC (68 cells passing inclusion: 44 ON-center, 19 X, 19 Y, 6 unclassified;
# 24 OFF-center, 11 X, 8 Y, 5 unclassified); for 26 of them, 24 repeats of a different 90 s
# movie segment at HC and LC (cross-validation); for 31 of them, a 6 min white noise segment at
# HC and LC plus 120 repeats of different 12 s segments of movie and white noise at HC and LC
# (reliability and sparseness). Measured variables are spike times; all analyses also need
# the stimulus frames and the animal of each cell. The archive's description says the dataset
# holds cat LGN recordings to natural movies and noise at two contrasts that supported four
# studies, this one among them. The movies come from the laboratory of Peter Konig (Kayser et
# al. 2003); the paper gives no other location for them, so if the dataset lacks the frames
# they are outside data with no stated source.
#
# Method, from the Experimental Procedures unless stated. Stimuli are scaled to zero mean, with
# values between -106 and 106. Spikes binned at 128 Hz (8 ms). RFs by recursive least squares
# (Lesica and Stanley 2006) with initial conditions g = 0 and K = D x I, D = 0.001; 21 x 21
# pixels and 24 lags of 8 ms; the same number of spikes for HC and LC; each response cut into
# nine segments, an RF per segment, the mean of the nine used. Inclusion for the 15 min movie
# analyses: RF peak at least ten times the noise (SD of the RF estimated from shuffled
# responses). Center: pixels at the latency of the RF's largest-amplitude point, contiguous
# with it, of its sign and above the error level (the SD of the shuffled-response estimate);
# surround: a ring around the center at most four pixels wide (Lesica and Stanley 2004).
# Spatial width: full width at half peak of a symmetric 2D difference of Gaussians fitted to the
# spatial RF at peak latency. Surround/center ratio: absolute peak of the surround temporal
# profile over the peak of the center temporal profile, from the raw RF. Temporal width: width
# of the primary phase of the center temporal profile at half its peak. NLs: the stimulus (zero
# mean) convolved with the unit-variance RF, filtered values sorted and grouped by 250, the
# mean filtered value and mean firing rate (8 ms bins) of each group; one NL per segment, the
# mean of nine. Gain a and offset q from a fit of f(x) = a(x - q) for x >= q, 0 otherwise; q
# adjusted per stimulus condition to have the same mean in each animal; normalized offset is q
# over the SD of the filtered stimulus. Reliability: signal to noise ratio of the 8 ms firing
# rate after Borst and Theunissen (1999), the total power of the trial-averaged response over
# the mean over trials of the power of each trial minus the average. Sparseness: (1 - m^2/(m^2 +
# s^2)) / (1 - 1/n), m and s the mean and SD of the firing rate over n time bins (Vinje and
# Gallant 2000), of the trial-averaged response. Comparisons across conditions are paired t tests
# across cells (Figures 3, 4 and 6 legends). A change of contrast compares HC with LC of one
# stimulus; a change of correlations compares LC NS with LC WN (Results, first section).
#
# Details the paper leaves open, used by several claims (each claim names those it rests on):
# (P1) How a reported percent change is formed; readings (a) the change of the sample means
# over the first condition's mean, (b) the mean over cells of each cell's percent change. For
# increases above 50% (gain, normalized offset) the paper's "increased by X%" also allows (c)
# the ratio of the means taken as X/100. (P2) Which responses give the mean firing rate and the
# RF and NL claims' cells for white noise; readings (a) the long segments used for RF
# estimation (15 min movie, 6 min noise), (b) the 12 s repeated trials. (P3) The significance
# level for "no significant effect"; the paper states none, so a paired t test at p < 0.05,
# the usual level, with p < 0.001 (the only level in the Figures 3 and 4 legends) shown as a
# variant. (P4) How the half-wave rectifier is fitted to the NL points; least squares on the
# nine-segment mean NL is the standard choice. (P5) How the per-animal adjustment of q is
# made; subtracting each animal's mean q for that condition and adding the grand mean is the
# standard reading. (P6) The temporal profile's peak and widths are read on the 8 ms lag grid;
# linear interpolation between lags for the half-height crossings is a standard choice. (P7)
# Whether the SD in the sparseness formula is the population or sample SD, a standard choice
# that cannot change any outcome (population). (P8) Whether the signal spectrum in the
# reliability measure includes the mean (DC) term; readings (a) it does, as written, (b) the
# mean is removed before the spectra.
