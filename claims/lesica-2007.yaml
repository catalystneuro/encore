    p: 0.01
    p_relation: "<"
    n: 31 cells
  expected:
    quantity: decrease in reliability, LC NS to LC WN
    value: 68
    tolerance: 6.8
    unit: "%"
  criterion: As fig6a-reliability-contrast, for LC NS against LC WN.
- id: fig6b-sparseness-contrast
  statement: A decrease in contrast causes only a small decrease in sparseness for natural movies
    (4%) and a larger one for white noise (16%).
  source: Results, Contrast- and Correlation-Induced Changes in the Reliability and Sparseness,
    paragraph 2; Figure 6B
  quote: a decrease in contrast during natural stimulation caused only a small decrease in
    sparseness (4%), but larger decreases in sparseness were evident for a decrease in contrast
    during white noise stimulation (16%)
  expected:
  - quantity: decrease in sparseness, HC to LC NS
    value: 4
    tolerance: 0.4
    unit: "%"
  - quantity: decrease in sparseness, HC to LC WN
    value: 16
    tolerance: 1.6
    unit: "%"
  criterion: Sparseness as in the Methods, of the trial-averaged 8 ms firing rate over the 120
    repeats of each 12 s segment (P7). Reproduced when both decreases are within tolerance under
    reading P1 (a) or (b), and the WN decrease exceeds the NS decrease; partially reproduced when
    the ordering holds and the sizes do not. Paired t tests are reported; the significance marks
    of Figure 6B could not be read, so none is required.
  depends_on:
  - sample-composition
- id: fig6b-sparseness-correlations
  statement: A decrease in correlations decreases sparseness by 14%.
  source: Results, Contrast- and Correlation-Induced Changes in the Reliability and Sparseness,
    paragraph 2; Figure 6B
  quote: and for a decrease in correlations (14%)
  expected:
    quantity: decrease in sparseness, LC NS to LC WN
    value: 14
    tolerance: 1.4
    unit: "%"
  criterion: As fig6b-sparseness-contrast, for LC NS against LC WN; reproduced when the decrease
    is within tolerance under P1 (a) or (b). The paired t test is reported.
- id: fig7c-effective-contrast
  statement: Filtering by the RF raises the effective contrast of the natural movies relative to
    white noise, so that low-contrast natural movies and high-contrast white noise have similar
    effective contrasts despite different RMS contrasts.
  source: Results, Contrast- and Correlation-Induced Changes in the Reliability and Sparseness,
    paragraph 4; Figure 7C; Discussion, The Effects of Contrast and Correlations, paragraph 2
  quote: spatiotemporal integration in the RF results in an increase in the effective contrasts
    of the NS stimuli relative to those of the WN stimuli, indicating that the NS stimuli contain
    more of the features to which the RF is sensitive
  criterion: Generic RFs per stimulus as the mean of the cells' RFs with OFF-center RFs sign
    reversed (Results, paragraph 3), normalized to unit variance; effective contrast is the SD
    of the stimulus filtered by the generic RF, RMS contrast the SD of the stimulus (Figure 7C
    text). Open are the cells averaged, readings (a) the 31 with all four stimuli, (b) all cells
    with each stimulus, and the stimulus filtered, readings (a) the long segments, (b) the 12 s
    repeated segments. Reproduced when, under one reading, the ratio of effective to RMS
    contrast is higher for each NS stimulus than for each WN stimulus, and the LC NS effective
    contrast is closer to the HC WN value than to that of any other stimulus.
  depends_on:
  - fig3c-surround-contrast
- id: fig7d-reliability-tracks-effective-contrast
  statement: Normalized to high-contrast natural movies, the effective contrasts of the four
    stimuli correspond closely to the observed reliability of LGN responses.
  source: Results, Contrast- and Correlation-Induced Changes in the Reliability and Sparseness,
    paragraph 4; Figure 7D
  quote: a comparison of the effective contrasts of the four stimuli (line) with the
    experimentally observed reliability in the LGN responses (circles) reveals a strong
    correspondence
  criterion: Effective contrast as in fig7c-effective-contrast; reliability the mean over the 31
    cells per stimulus; both divided by their HC NS value, the across-cell SD of reliability
    divided likewise (Figure 7D legend). Reproduced when the four stimuli rank the same on both
    and each normalized effective contrast lies within one normalized SD of the normalized mean
    reliability; partially reproduced when the ranks agree only.
  depends_on:
  - fig7c-effective-contrast
  - fig6a-reliability-contrast
- id: fig8a-filtered-kurtosis
  statement: The natural movies filtered by the generic RFs have heavy-tailed distributions
    (kurtosis 4.06) while filtered white noise is Gaussian (kurtosis 3.01), and shuffling the
    movie frames before filtering removes the excess kurtosis.
  source: Results, Contrast- and Correlation-Induced Changes in the Reliability and Sparseness,
    paragraph 5; Figure 8A
  quote: The distributions of the filtered NS stimuli (red and blue) have relatively heavy tails
    ... indicated by a high kurtosis (k = 4.06), while those of the filtered WN stimuli (black
    and gray) are Gaussian (k = 3.01). The high kurtosis in the distributions of the filtered NS
    stimuli disappears when the frames of the stimuli are shuffled
  expected:
  - quantity: kurtosis of filtered NS
    value: 4.06
    tolerance: 0.41
  - quantity: kurtosis of filtered WN
    value: 3.01
    tolerance: 0.30
  criterion: Kurtosis (non-excess, Gaussian = 3) of each stimulus filtered by its generic RF, as
    in fig7c-effective-contrast. Which NS stimulus gives 4.06 is open; readings (a) HC NS, (b)
    LC NS, (c) both. Reproduced when, under one reading, the NS and WN values are within
    tolerance and the frame-shuffled HC NS stimulus filtered by the HC NS generic RF has a
    kurtosis within 0.30 of 3 (the WN tolerance).
  depends_on:
  - fig7c-effective-contrast
- id: fig8-model-sparseness-shuffle
  statement: The generic LN model with the high-contrast natural movie RF and NL gives a response
    sparseness of 0.86 to the movie and 0.83 when the movie frames are shuffled.
  source: Results, Contrast- and Correlation-Induced Changes in the Reliability and Sparseness,
    paragraph 5
  quote: the sparseness of the response of the generic LN model (with high-contrast natural
    scene RF and NL) to the original high-contrast NS stimulus is 0.86, and shuffling the frames
    of the stimulus decreases this value to 0.83
  expected:
  - quantity: model sparseness, HC NS
    value: 0.86
    tolerance: 0.086
  - quantity: model sparseness, frame-shuffled HC NS
    value: 0.83
    tolerance: 0.083
  criterion: The generic NL is a perfect half-wave rectifier with the sample-mean gain and
    offset (Results, paragraph 3); open is whether the offset used is (a) the mean normalized
    offset times the SD of the filtered stimulus or (b) the mean absolute offset. Sparseness of
    the model rate in 8 ms bins. Reproduced when, under one reading, both values are within
    tolerance and the shuffled value is the lower.
  depends_on:
  - fig8a-filtered-kurtosis
  - fig4d-normalized-offset-contrast
- id: fig8b-model-vs-experiment-sparseness
  statement: The sparseness of the noiseless generic LN model increases as contrast and
    correlations decrease, the opposite of the experimental responses, matching the
    experiment only for high-contrast natural movies.
  source: Results, Contrast- and Correlation-Induced Changes in the Reliability and Sparseness,
    paragraph 6; Figure 8B
  quote: the sparseness of the model responses (line) increases as contrast and correlations are
    decreased. However, this is the opposite of what is observed in the experimental responses
    (circles)
  criterion: Model as in fig8-model-sparseness-shuffle, one generic model per stimulus.
    Reproduced when model sparseness is lowest for HC NS and highest for LC WN, the mean
    experimental sparseness is higher for HC NS than for LC WN, and the model HC NS value lies
    within one across-cell SD of the experimental HC NS mean (Figure 8B legend).
  depends_on:
  - fig8-model-sparseness-shuffle
  - fig6b-sparseness-contrast
- id: fig8de-noise-reconciles
  statement: Adding Gaussian white noise to the filtered stimulus before the nonlinearity lowers
    model sparseness most for low-contrast white noise, and at one noise level the model and
    experimental sparseness agree closely for all four stimuli.
  source: Results, Contrast- and Correlation-Induced Changes in the Reliability and Sparseness,
    paragraph 7; Figure 8C to 8E
  quote: as the noise level is increased, the sparseness of the model responses is decreased,
    with the strongest decreases for the low-contrast WN responses ... there is a certain noise
    level (Figure 8D, green bar) at which the sparseness of the model and experimental responses
    are in close agreement
  criterion: The noise level is not given; its SD is scanned from zero upward. Sparseness of the
    trial-averaged model response is open; readings (a) the model rate with noise, one
    realization, (b) the mean over 120 noisy trials as in the experiment. Reproduced when, under
    one reading, the decrease in sparseness with noise is largest for LC WN, and at some level
    the model value for each stimulus lies within one across-cell SD of the experimental mean
    (Figure 8E legend).
  depends_on:
  - fig8b-model-vs-experiment-sparseness
- id: disc-lcns-hcwn-reliability-sparseness
  statement: Low-contrast natural movies and high-contrast white noise, which have similar
    effective contrasts, evoke responses of similar reliability and sparseness, those to white
    noise slightly higher, so the decreases seen with a decrease in correlations disappear.
  source: Discussion, The Effects of Contrast and Correlations on Reliability and Sparseness,
    paragraph 2; Figure 6A and 6B
  quote: when comparing responses to lowcontrast NS and high-contrast WN stimuli, the decreases
    in reliability and sparseness corresponding to the decrease in correlations are no longer
    evident ... In fact, the reliability and sparseness of the high-contrast WN responses are
    slightly higher than those of the low-contrast NS responses
  criterion: A claim of absence, judged with the Figure 6 test, paired t tests over the 31 cells
    of LC NS against HC WN, reliability and sparseness as in fig6a and fig6b. Reproduced when
    neither shows HC WN significantly lower at p < 0.05 (P3) and both HC WN means are above the
    LC NS means; the differences are reported.
  depends_on:
  - fig6a-reliability-contrast
  - fig6b-sparseness-contrast
- id: disc-lcns-hcwn-rf-nl-differences
  statement: The differences in spatial width, surround strength, gain and normalized offset
    between low-contrast natural movies and low-contrast white noise remain significant when
    low-contrast natural movies are compared with high-contrast white noise.
  source: Discussion, Adaptation to Stimulus Correlations, paragraph 1
  quote: nearly all of the observed differences between low-contrast natural scene and white
    noise RFs and NLs (spatial width, surround strength, gain, and normalized offset) are still
    significant when RFs and NLs are compared across low-contrast NS and high-contrast WN
  criterion: Paired t tests over the 31 cells of LC NS against HC WN for the four properties.
    The level is not stated; readings (a) p < 0.05, (b) p < 0.001 as in the Figures 3 and 4
    legends. Each difference must be in the direction of the LC NS against LC WN change (WN
    narrower, weaker surround, higher gain, higher normalized offset). "Nearly all" is read as at
    least three of the four. Reproduced when, under one reading, at least three are significant
    in that direction.
  depends_on:
  - fig3b-spatial-width-correlations
  - fig3c-surround-correlations
  - fig4b-gain-correlations
  - fig4d-normalized-offset-correlations
- id: methods-latency-biphasic
  statement: Changes in contrast and correlations significantly change the latency (time to
    peak) of the RF center's temporal profile but not its biphasic ratio.
  source: Experimental Procedures, Measurement of Receptive Field and Nonlinearity Properties,
    paragraph 1
  quote: Changes in contrast and correlations also had significant effects on the latency (time
    to peak) of the temporal profile of the RF center, but not on the biphasic ratio
  criterion: Latency is the lag of the peak of the center temporal profile; biphasic ratio the
    absolute peak of the primary phase over the peak of the secondary phase (Methods). Paired t
    tests for the three comparisons (HC against LC NS, HC against LC WN, LC NS against LC WN).
    The level for latency is open, readings p < 0.05 and p < 0.001; the absence for the biphasic
    ratio is judged at p < 0.05 (P3). Reproduced when, under one reading, latency changes in all
    three comparisons and the biphasic ratio in none; partially reproduced when latency changes
    in at least two and the biphasic ratio in none.
- id: methods-offset-varies-across-animals
  statement: Of the RF and NL parameters, only the offset q differs significantly across animals
    within a stimulus condition.
  source: Experimental Procedures, Measurement of Receptive Field and Nonlinearity Properties,
    paragraph 2
  quote: The only RF or NL parameter value that was significantly different across animals for a
    given stimulus condition was q
  criterion: The test is not named. Readings (a) a one-way ANOVA of each parameter on animal,
    per stimulus condition, (b) a Kruskal-Wallis test. Parameters are spatial width,
    surround/center ratio, temporal width, gain, offset and normalized offset, unadjusted. The
    level is open, readings p < 0.05 and p < 0.001. Reproduced when, under one reading, q
    differs across animals in at least one condition and no other parameter does in any. Needs
    the animal of each cell.
- id: celltype-y-wider-than-x
  statement: The spatial RF center is wider for Y than X cells during high-contrast (0.75 against
    0.63 deg) and low-contrast (0.73 against 0.63 deg) natural movies.
  source: Experimental Procedures, Measurement of Receptive Field and Nonlinearity Properties,
    paragraph 3
  quote: The width of the spatial RF was significantly larger for Y cells than for X cells during
    both high-contrast (X, 0.63 ± 0.16 deg.; Y, 0.75 ± 0.18 deg.) and low-contrast (X, 0.63 ± 0.14
    deg ... natural stimulation (t tests, p < 0.01)
  statistics:
  - test: t tests
    p: 0.01
    p_relation: "<"
    n: 30 X and 27 Y cells
  expected:
  - quantity: spatial width, X, HC NS
    value: 0.63
    tolerance: 0.16
    unit: deg
  - quantity: spatial width, Y, HC NS
    value: 0.75
    tolerance: 0.18
    unit: deg
  - quantity: spatial width, X, LC NS
    value: 0.63
    tolerance: 0.14
    unit: deg
  - quantity: spatial width, Y, LC NS
    value: 0.73
    tolerance: 0.15
    unit: deg
  criterion: Tolerances are the SDs given. The counts of X and Y cells are from the 68-cell
    sample (19 + 11 X, 19 + 8 Y). Unpaired t tests of X against Y per contrast; reproduced when
    all four means are within tolerance and both tests give p < 0.01 with Y wider.
  depends_on:
  - fig3b-spatial-width-contrast
- id: celltype-y-stronger-surround
  statement: The relative surround strength is larger for Y than X cells during high-contrast
    natural movies (0.16 against 0.13).
  source: Experimental Procedures, Measurement of Receptive Field and Nonlinearity Properties,
    paragraph 3
  quote: the relative strength of the surround was significantly larger for Y cells than for X
    cells during high-contrast natural stimulation (X, 0.13 ± 0.04, Y, 0.16 ± 0.06; t test, p <
    0.05)
  statistics:
  - test: t test
    p: 0.05
    p_relation: "<"
    n: 30 X and 27 Y cells
  expected:
  - quantity: surround/center ratio, X, HC NS
    value: 0.13
    tolerance: 0.04
  - quantity: surround/center ratio, Y, HC NS
    value: 0.16
    tolerance: 0.06
  criterion: Tolerances are the SDs given. Unpaired t test of X against Y, surround/center ratio
    as in fig3c-surround-contrast; reproduced when both means are within tolerance and p < 0.05
    with Y larger.
  depends_on:
  - fig3c-surround-contrast
- id: celltype-off-wider-temporal
  statement: During low-contrast white noise the temporal profile of the RF center is wider for
    OFF than ON cells (29 against 25 ms).
  source: Experimental Procedures, Measurement of Receptive Field and Nonlinearity Properties,
    paragraph 3
  quote: the temporal profile of the RF center was significantly larger for OFF
    cells than for ON cells during low-contrast white noise stimulation (ON, 25 ± 0.4 ms; OFF, 29
    ± 0.4 ms; t test, p < 0.01)
  statistics:
  - test: t test
    p: 0.01
    p_relation: "<"
  expected:
  - quantity: temporal width, ON, LC WN
    value: 25
    tolerance: 2.5
    unit: ms
  - quantity: temporal width, OFF, LC WN
    value: 29
    tolerance: 2.9
    unit: ms
  criterion: The paper's spread (0.4 ms) is smaller than the 8 ms lag grid and is probably a
    standard error, so 10% of each value is used as tolerance. Unpaired t test of ON against OFF
    over the 31 cells with white noise; reproduced when both means are within tolerance and p <
    0.01 with OFF wider.
  depends_on:
  - fig3d-temporal-width-contrast
- id: celltype-prediction-x-y
  statement: LN model predictions are slightly more accurate for X than Y cells at high (0.73
    against 0.69) and low (0.78 against 0.75) contrast, but the differences are not significant.
  source: Experimental Procedures, Measurement of Receptive Field and Nonlinearity Properties,
    paragraph 3
  quote: the correlation coefficients between LN model predictions and experimental responses to
    repeated identical segments of novel NS stimuli (for firing rate in 8 ms bins) were higher
    for X cells than for Y cells at both HC (X, 0.73; Y, 0.69) and LC (X, 0.78; Y, 0.75), but these
    differences were not significant (t tests, p > 0.1)
  statistics:
  - test: t tests
    p: 0.1
    p_relation: ">"
  expected:
  - quantity: prediction correlation, X, HC
    value: 0.73
    tolerance: 0.073
  - quantity: prediction correlation, Y, HC
    value: 0.69
    tolerance: 0.069
  - quantity: prediction correlation, X, LC
    value: 0.78
    tolerance: 0.078
  - quantity: prediction correlation, Y, LC
    value: 0.75
    tolerance: 0.075
  criterion: Prediction correlations as in ln-prediction-accuracy, over the classified cells of
    the 26. A claim of absence for the difference; unpaired t tests of X against Y per contrast.
    Reproduced when neither gives p < 0.05 (P3) and the four means are within tolerance under
    one reading of ln-prediction-accuracy; the p-values are reported, and whether they exceed 0.1.
  depends_on:
  - ln-prediction-accuracy
- id: methods-spherical-asymmetry
  statement: RFs estimated by the paper's least-squares method from simulated LN responses to the
    movies do not differ significantly from those estimated from simulated responses to Gaussian
    white noise, so the movies' spherical asymmetry does not bias the RF estimates much.
  source: Experimental Procedures, Estimation of Receptive Fields, paragraph 3
  quote: We estimated the RF from simulated responses to both Gaussian white noise stimuli and
    the movie stimuli used in this study and found that the estimates were not significantly
    different
  criterion: A simulation that uses the stimuli only. The known RF, the NL, the simulation length
    and the test are not given; readings for the RF (a) the generic HC NS RF, (b) a cell's
    estimated RF. Reproduced when the RLS estimates from movie-driven and white-noise-driven
    simulated responses agree within the spread of the nine segment estimates at every RF point
    under one reading. This claim needs no recorded spikes.
  depends_on:
  - fig7c-effective-contrast
