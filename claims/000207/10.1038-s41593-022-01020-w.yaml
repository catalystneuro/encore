    frame that followed the boundary was later recognised than when it was forgotten; there was
    no such difference for clips with no boundary, for the time discrimination task, or for
    event cells.
  source: Figure 4a-c; Extended Data Figures 6 and 7; Results, Responses of boundary and event cells
    predict memory strength, paragraph 1
  quote: among boundary cells (n = 42) for frames preceded or followed by both SBs and HBs, but not
    by NBs ... the firing rate of boundary cells did not significantly predict performance in the
    time discrimination task ... the firing rate of event cells (n = 36) during encoding was not
    predictive of scene recognition memory
  statistics:
  - about: boundary cells, scene recognition, soft boundaries (Fig. 4c)
    statistic: F (1, 82) = 82.93
    p: 4.0e-14
  - about: boundary cells, scene recognition, hard boundaries (Fig. 4c)
    statistic: F (1, 82) = 156.9
    p: 1.0e-20
  - about: boundary cells, scene recognition, no boundary (Fig. 4c)
    statistic: F (1, 82) = 1.18
    p: 0.28
  - about: boundary cells, time discrimination, no boundary
    statistic: F (1, 82) = 1.25
    p: 0.27
  - about: boundary cells, time discrimination, soft boundaries
    statistic: F (1, 82) = 1.35
    p: 0.25
  - about: boundary cells, time discrimination, hard boundaries
    statistic: F (1, 82) = 1.14
    p: 0.29
  - about: event cells, scene recognition, no boundary
    statistic: F (1, 70) = 1.12
    p: 0.29
  - about: event cells, scene recognition, soft boundaries
    statistic: F (1, 70) = 1.63
    p: 0.21
  - about: event cells, scene recognition, hard boundaries
    statistic: F (1, 70) = 0.79
    p: 0.38
- id: fig4h-event-cells-phase-predicts-order
  statement: Event cells' spikes were locked more strongly to the phase of the theta-band local
    field potential after soft and hard boundaries when the temporal order of the clip was later
    remembered than when it was not; boundary cells showed no such effect.
  source: Figure 4e-h; Results, Responses of boundary and event cells predict memory strength,
    paragraph 2
  quote: The mean MRL across all event cells (n = 36) was significantly larger following both SB and
    HB but not NB if temporal order was later correctly remembered ... the strength of phase-locking
    of boundary cells neither predicted scene recognition memory success ... nor temporal order
    memory
  statistics:
  - about: event cells, soft boundaries
    statistic: F (1, 70) = 81.55
    p: 2.0e-13
  - about: event cells, hard boundaries
    statistic: F (1, 70) = 60.79
    p: 4.0e-11
  - about: event cells, no boundary
    statistic: F (1, 70) = 1.53
    p: 0.22
  - about: boundary cells, temporal order, condition not labelled in the text
    statistic: F (1, 82) = 1.33
    p: 0.25
  - about: boundary cells, temporal order, soft boundaries
    statistic: F (1, 82) = 0.14
    p: 0.71
  - about: boundary cells, temporal order, hard boundaries
    statistic: F (1, 82) = 1.98
    p: 0.16
- id: fig5d-state-shift
  statement: The state of the population of all medial temporal lobe neurons changed abruptly in
    the first 300 ms after soft and hard boundaries, and only slowly in clips with no boundary,
    measured as the distance in principal-component space from the state at the boundary.
  source: Figure 5a-d; Results, Neural state shifts across boundaries reflect memory strength,
    paragraph 1
  quote: During NB video clips, the neural state exhibited only slow changes as a function of time
    ... In contrast, the neural state changed abruptly following SBs and HBs ... Plotting MDD as a
    function of time revealed an abrupt change within ~300 ms after the boundary for SB and HB video
    clips
  criterion: Judged on the distance from the state at the boundary, averaged over the second
    after the boundary, for each pseudo-trial. Reproduced if for both soft and hard boundaries
    it is larger than in clips with no boundary (one-sided permutation test over pseudo-trials,
    p < 0.05), and the same holds for the distance in the second after the boundary minus the
    distance in the second before it. Partially reproduced if both hold for only one of the two
    kinds of boundary.
- id: fig5ij-state-shift-predicts-memory
  statement: The distance the population state travelled in the second after a boundary
    correlated positively with later recognition accuracy for soft (r = 0.65) and hard (r = 0.57)
    boundaries, and negatively with time discrimination accuracy for hard boundaries (r = -0.68).
  source: Figure 5i-j; Results, Neural state shifts across boundaries reflect memory strength,
    paragraph 3
  quote: The AUC MDD was positively correlated with recognition accuracy for frames following SBs
    and HBs, but not NBs ... the AUC MDD was negatively correlated with accuracy in the time
    discrimination task for HBs, but not for NBs or SBs
  statistics:
  - about: recognition accuracy, soft boundaries
    statistic: r = 0.653
    p: 0.002
  - about: recognition accuracy, hard boundaries
    statistic: r = 0.565
    p: 0.009
  - about: time discrimination accuracy, hard boundaries
    statistic: r = -0.677
    p: 0.001
- id: fig6-reinstatement
  statement: During scene recognition, population activity correlated with the activity during
    encoding shortly after the soft or hard boundary of the tested clip, for correctly
    recognised targets and for foils wrongly called old, but not for forgotten targets or
    correctly rejected foils.
  source: Figure 6a-h; Results, Neural context after boundaries reinstates during recognition,
    paragraphs 1, 2 and 4
  quote: were accompanied by a significant positive correlation between neural activity during the
    scene recognition and the encoding period shortly after SB/HB transitions ... no significant
    correlation for forgotten targets ... no significant correlation for correctly identified foils
    was observed ... strong correlations ... also occurred when a new image was incorrectly
    classified as seen before
  statistics:
  - about: correct targets
    test: permutation test
    p: 0.01
    p_relation: "<"
  - about: incorrect foils
    test: permutation test
    p: 0.01
    p_relation: "<"
- id: fig6i-reinstatement-timing
  statement: The reinstated state was most similar to the state about 1.2 s after the boundary
    that preceded the tested frame, and 1.5 to 1.7 s before the tested frame itself was shown.
  source: Figure 6i; Results, Neural context after boundaries reinstates during recognition,
    paragraph 2
  quote: The reinstated neural context during retrieval was most similar to the neural context
    present during encoding approximately ~1.2s after the boundary that preceded the tested frame
    ... the point of time of maximal similarity preceded the time at which the later tested frame
    was shown by 1–1.5s
  statistics:
  - about: time from the boundary, soft boundaries
    statistic: t19 = 14.68
    p: 8.0e-12
  - about: time from the boundary, hard boundaries
    statistic: t19 = 11.80
    p: 3.0e-10
  - about: time before the tested frame, soft boundaries
    statistic: t19 = 11.18
    p: 8.0e-10
  - about: time before the tested frame, hard boundaries
    statistic: t19 = 7.44
    p: 5.0e-7
- id: fig6jm-reinstatement-confidence
  statement: Reinstatement after soft and hard boundaries was stronger for old decisions made
    with high confidence than with low confidence.
  source: Figure 6j-m; Results, Neural context after boundaries reinstates during recognition,
    paragraph 3
  quote: the correlations following boundary transitions were significantly stronger in high-
    compared to low-confidence trials ... This difference was observed during both correctly
    remembered targets and falsely recognized foils
  statistics:
  - about: soft boundaries, correct targets
    test: t-test
    p: 5.0e-10
  - about: hard boundaries, correct targets
    test: t-test
    p: 4.0e-6
  - about: soft boundaries, incorrect foils
    test: t-test
    p: 5.0e-7
  - about: hard boundaries, incorrect foils
    test: t-test
    p: 5.0e-5
- id: fig6no-false-alarm-similarity
  statement: For foils wrongly called old, reinstatement was stronger when the foil was highly
    similar to its target; for correctly rejected foils it did not vary with similarity.
  source: Figure 6n-o; Results, Neural context after boundaries reinstates during recognition,
    paragraph 4
  quote: Correlations between encoding and scene recognition were significantly stronger for highly
    similar foils falsely recognized as old compared to low and medium similarity foils ... the
    extent of correlation for correctly rejected foils (true negatives) did not vary as a function
    of similarity
  statistics:
  - about: foils wrongly called old
    statistic: F (2, 54) = 10.67
    p: 1.0e-4
  - about: correctly rejected foils
    statistic: F (2, 54) = 2.182
    p: 0.144
