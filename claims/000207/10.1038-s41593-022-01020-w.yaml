# Claims for Zheng et al. (2022) on dandiset 000207.
# Source: the paper's Results, Methods and figure captions, read from the author manuscript in
# PubMed Central (PMC8966433). The tolerances are this registry's; the paper gives none.
# The criteria and tolerances were written after the data check and a first count of boundary and
# event cells, so with first results in view; the notebook's header says which. None was changed
# after the authors' published code (github.com/rutishauserlab/cogboundary-zheng) was read.
schema_version: 1
dandiset: "000207"
paper: doi:10.1038/s41593-022-01020-w
claims:
- id: fig2a-order-accuracy
  statement: In the time discrimination task, subjects chose the frame that was shown first in
    73% of trials when the two frames were separated by no boundary or by a soft boundary, and
    in 53% of trials, significantly fewer, when they were separated by a hard boundary.
  source: Figure 2a; Results, paragraph 3
  expected:
    quantity: time discrimination accuracy across a hard boundary, mean over subjects
    value: 0.53
    tolerance: 0.03
  criterion: Besides the expected value, accuracy with no boundary and with a soft boundary must
    each be within 0.03 of 0.73, and accuracy across a hard boundary must be lower than both in
    paired tests over subjects (p < 0.05).
- id: fig2b-order-reaction-time
  statement: Reaction times in the time discrimination task were longer when the two frames were
    separated by a hard boundary (2.10 s) than by no boundary (1.62 s) or a soft boundary (1.59 s).
  source: Figure 2b; Results, paragraph 3
  expected:
    quantity: time discrimination reaction time across a hard boundary, mean over subjects
    value: 2.10
    tolerance: 0.15
    unit: s
  criterion: Besides the expected value, the reaction time across a hard boundary must be longer
    than with no boundary and with a soft boundary in paired tests over subjects (p < 0.05).
- id: fig2c-order-confidence
  statement: Confidence ratings in the time discrimination task were lower when the two frames
    were separated by a hard boundary (1.95 on a scale of 1 to 3) than by no boundary (2.52) or a
    soft boundary (2.59).
  source: Figure 2c; Results, paragraph 3
  expected:
    quantity: time discrimination confidence across a hard boundary, mean over subjects
    value: 1.95
    tolerance: 0.10
  criterion: Besides the expected value, confidence across a hard boundary must be lower than
    with no boundary and with a soft boundary in paired tests over subjects (p < 0.05).
- id: edfig2a-recognition-similar
  statement: Scene recognition accuracy did not differ between frames from clips with no
    boundary (76%), a soft boundary (75%) and a hard boundary (75%).
  source: Extended Data Figure 2a; Results, paragraph 4
  criterion: Reproduced if a one-way ANOVA over the three kinds of clip, as in the paper, gives
    p > 0.05 and each mean over subjects is within 0.04 of the reported value.
- id: fig2def-recognition-vs-boundary-distance
  statement: Recognition accuracy for a target frame fell with the time between the frame and the
    boundary before it, for soft boundaries (r = -0.61) and hard boundaries (r = -0.44), but not
    for clips with no boundary (r = 0.085).
  source: Figure 2d-f
- id: fig3c-boundary-cells
  statement: 42 of 580 medial temporal lobe neurons (7.24%) were boundary cells, which changed
    their firing in the second after soft and hard boundaries but not in the middle of clips
    with no boundary; 2.11% were expected by chance.
  source: Figure 3a-c; Results, section 2; Methods, Boundary cell
  expected:
    quantity: fraction of medial temporal lobe neurons classified as boundary cells
    value: 0.0724
    tolerance: 0.03
  criterion: Besides the expected value, the number of boundary cells must exceed the 95th
    percentile of the numbers found after shuffling the condition labels of the clips.
- id: fig3g-event-cells
  statement: 36 of 580 medial temporal lobe neurons (6.20%) were event cells, which changed their
    firing in the second after hard boundaries but not after soft boundaries or in the middle of
    clips with no boundary; 2.26% were expected by chance.
  source: Figure 3e-g; Results, section 2; Methods, Event cell
  expected:
    quantity: fraction of medial temporal lobe neurons classified as event cells
    value: 0.062
    tolerance: 0.03
  criterion: Besides the expected value, the number of event cells must exceed the 95th
    percentile of the numbers found after shuffling the condition labels of the clips.
- id: fig3-cell-regions
  statement: Boundary cells were most common in the parahippocampal gyrus (18 of 68 neurons,
    26%, against 7% in the amygdala and 3.5% in the hippocampus), and event cells in the
    hippocampus (27 of 343, 7.9%, against 4.3% in the amygdala and 2.9% in the parahippocampal
    gyrus).
  source: Results, section 2; Supplementary Table 4
  criterion: Reproduced if the parahippocampal gyrus has the highest proportion of boundary cells
    and the hippocampus the highest proportion of event cells of the three regions, each above
    the 95th percentile of its label-shuffling chance level. Partially reproduced if one of the
    two holds.
- id: fig3dh-no-onset-response
  statement: Boundary cells and event cells did not change their firing at clip onsets or
    offsets during encoding, nor at image onsets or offsets in the two memory tests.
  source: Figure 3d,h; Extended Data Figures 3 and 4
  criterion: Judged only if at least 10 boundary cells and 10 event cells are found under
    fig3c-boundary-cells and fig3g-event-cells; the dandiset does not say which neurons the
    paper put in each class.
- id: edfig5-clip-onset-cells
  statement: 76 of 580 medial temporal lobe neurons (13.1%) changed their firing at clip onsets
    and 4 of 580 (0.7%) at clip offsets, and none of them was a boundary cell or an event cell.
  source: Extended Data Figure 5; Results, section 2
  expected:
    quantity: fraction of medial temporal lobe neurons that respond to clip onsets
    value: 0.131
    tolerance: 0.05
  criterion: Reproduced if the fraction responding to clip onsets is within the tolerance and the
    fraction responding to clip offsets is not above the 5% expected by chance. Partially
    reproduced if only the first holds. The paper's test is one-tailed without saying in which
    direction; an increase in firing is tested.
- id: fig3j-response-latency
  statement: Boundary cells responded to hard boundaries about 100 ms earlier than event cells;
    their firing peaked 197 ms after the boundary, against 301 ms for event cells.
  source: Figure 3i-j
  expected:
    quantity: peak time of event cells minus peak time of boundary cells after a hard boundary
    value: 0.104
    tolerance: 0.05
    unit: s
  criterion: Judged only if at least 10 boundary cells and 10 event cells are found under
    fig3c-boundary-cells and fig3g-event-cells.
- id: fig3-outside-mtl
  statement: Of 405 neurons recorded outside the medial temporal lobe, 8 were boundary cells and
    9 were event cells, so boundary responses are largely confined to the medial temporal lobe.
  source: Results, section 2; Supplementary Tables 2 and 4
- id: fig4c-boundary-cells-predict-recognition
  statement: Boundary cells fired more after soft and hard boundaries during encoding when the
    frame that followed the boundary was later recognised than when it was forgotten; there was
    no such difference for clips with no boundary, for the time discrimination task, or for
    event cells.
  source: Figure 4a-c; Extended Data Figures 6 and 7
- id: fig4h-event-cells-phase-predicts-order
  statement: Event cells' spikes were locked more strongly to the phase of the theta-band local
    field potential after soft and hard boundaries when the temporal order of the clip was later
    remembered than when it was not; boundary cells showed no such effect.
  source: Figure 4e-h
- id: fig5d-state-shift
  statement: The state of the population of all medial temporal lobe neurons changed abruptly in
    the first 300 ms after soft and hard boundaries, and only slowly in clips with no boundary,
    measured as the distance in principal-component space from the state at the boundary.
  source: Figure 5a-d
  criterion: Judged on the distance from the state at the boundary, averaged over the second
    after the boundary, for each pseudo-trial. Reproduced if for both soft and hard boundaries
    it is larger than in clips with no boundary (one-sided permutation test over pseudo-trials,
    p < 0.05), and the same holds for the distance in the second after the boundary minus the
    distance in the second before it. Partially reproduced if both hold for only one of the two
    kinds of boundary.
- id: fig5ij-state-shift-predicts-memory
  statement: The distance the population state travelled in the second after a boundary
    correlated positively with later recognition accuracy for soft (r = 0.65) and hard (r = 0.57)
    boundaries, and negatively with time discrimination accuracy for hard boundaries (r = -0.68).
  source: Figure 5i-j
- id: fig6-reinstatement
  statement: During scene recognition, population activity correlated with the activity during
    encoding shortly after the soft or hard boundary of the tested clip, for correctly
    recognised targets and for foils wrongly called old, but not for forgotten targets or
    correctly rejected foils.
  source: Figure 6a-h
- id: fig6i-reinstatement-timing
  statement: The reinstated state was most similar to the state about 1.2 s after the boundary
    that preceded the tested frame, and 1.5 to 1.7 s before the tested frame itself was shown.
  source: Figure 6i
- id: fig6jm-reinstatement-confidence
  statement: Reinstatement after soft and hard boundaries was stronger for old decisions made
    with high confidence than with low confidence.
  source: Figure 6j-m
- id: fig6no-false-alarm-similarity
  statement: For foils wrongly called old, reinstatement was stronger when the foil was highly
    similar to its target; for correctly rejected foils it did not vary with similarity.
  source: Figure 6n-o
