    the code's 10-shift null for SMA are reported.
- id: fig4a-example-sequences-q
  statement: In an example session of monkey Q's SMA with 40 cells, 13 sequences were detected in
    the spontaneous condition and 17 during the task, and the specific sequences differed between
    the two even where they involved the same cells.
  source: Results, Cells in SMA and M1 show sequential activation patterns, paragraph 2; Figure 4A
  quote: In an example imaging session in monkey Q's SMA, we detected 13 such sequences in
    spontaneous and 17 sequences during the task ... While some of the sequences detected involved
    the same cells ... the specific sequences differed
  expected:
  - quantity: sequences, spontaneous
    value: 13
    tolerance: 1.3
  - quantity: sequences, task
    value: 17
    tolerance: 1.7
  criterion: Method S on the Q SMA session with 40 cells (Figure 4A legend); the session is not
    named, so every Q SMA session with 40 accepted cells is a reading of which session is meant.
    Per reading of S, reproduced when for some such session both counts are within tolerance and
    the two sets of sequences (ordered cell lists) are not the same; the outcome is the one every
    reading of S gives, blocked as methods_underspecified when they differ; the number of sequences found in both is
    reported.
- id: fig4b-example-three-segments-q
  statement: In another Q SMA session with 18 cells and 20 min of spontaneous recording, 8, 13 and
    9 sequences were found in the two spontaneous halves and the task, and the sequences differed
    between all three segments.
  source: Results, Cells in SMA and M1 show sequential activation patterns, paragraph 2; Figure 4B;
    Discussion, paragraph 10
  quote: We detected 8, 13, and 9 unique sequences during ... The detected sequences differed
    between all three states
  expected:
  - quantity: sequences, spontaneous 1
    value: 8
    tolerance: 0.8
  - quantity: sequences, spontaneous 2
    value: 13
    tolerance: 1.3
  - quantity: sequences, reaching task
    value: 9
    tolerance: 0.9
  criterion: Method S, spontaneous split into its first and second 10 min, on the Q SMA session
    with 18 cells and a spontaneous part of about 20 min; each such session is a reading of
    which session is meant. Per reading of S, reproduced when for some such session the three
    counts are within tolerance and no two segments have the same set of sequences; the outcome is
    the one every reading of S gives, blocked as methods_underspecified when they differ. The number of sequences shared by each pair of segments, and
    by all three (the preprint says none), is reported.
- id: fig4d-sequence-measures-vary
  statement: The number of sequences per cell, their repetition and the proportion of cells in
    sequences varied across conditions and imaging sites.
  source: Results, Cells in SMA and M1 show sequential activation patterns, paragraph 3; Figure 4D
  quote: We found that these factors varied across conditions and across imaging sites, similar to
    observations made in monkey Q's SMA.
  criterion: Method S on every session and segment (spontaneous 1, spontaneous 2 where there are
    20 min, task). Per segment, the number of sequences over the number of cells, the median number
    of repetitions of its sequences, and the fraction of cells in at least one sequence (Figure 4D
    legend). The paper reports no test. Reproduced when the per-site medians of each measure are
    not all equal across segments, and not all equal across sites; the per-session values are
    compared with the Zenodo Fig. 4D table (doi:10.5281/zenodo.14976005) where they match by
    session.
- id: fig4c-sequence-cells-not-clustered
  statement: Cells involved in sequences were spread across the field of view, with no preferred
    spatial relation between them.
  source: Results, Cells in SMA and M1 show sequential activation patterns, paragraph 4; Figure 4C
    and Figure S2
  quote: Plotting the distribution of distances between pairs of cells that were involved in
    sequences, as well as the overall distribution of distances between all detected cells showed
    that there is no preferred spatial relation between cells involved in sequences
  depends_on:
  - fig4d-sequence-measures-vary
  criterion: The paper compares distributions by eye and reports no test; Figure S2 is not in the
    text read. What is compared is read two ways, (i) the centroid positions of cells in sequences
    against those of all cells, spontaneous condition, Q SMA and U M1 (Figure 4C legend), (ii) the
    distances between cells of the same sequence against the distances between all cell pairs
    (Results). The test is open; readings a two-sample Kolmogorov-Smirnov test and a Mann-Whitney
    test, p < 0.05, on distances (ii) or on each centroid coordinate (i). Reproduced when no
    reading finds a difference; not reproduced when every reading does; blocked as
    methods_underspecified otherwise.
- id: histology-lens-placement
  statement: Lenses and prisms were placed in the arm regions of SMA and M1, in deep cortical
    layers, with monkey Q's SMA lens at the anterior edge of SMA.
  source: Results, Expression of GCaMP6f and lens localization, paragraphs 1 and 2; Figure S3A
  quote: Postmortem histological examination confirmed that the lens and prism were placed in the
    arm regions of SMA and M1
  data: elsewhere
  where: Zenodo doi:10.5281/zenodo.15328390
  criterion: Histology, not imaging data. Judged from the MAP2 sections on Zenodo against the atlas
    of Paxinos et al. (2000); reproduced when each of the five lens tracks ends in deep layers of
    the arm region of SMA or M1 and Q's SMA lens lies at the anterior edge of SMA (Results).
- id: histology-gcamp-not-gabaergic
  statement: GCaMP6f expression was robust around most imaging sites, sparse in monkey U's SMA,
    and GCaMP6f-positive cells were not GABAergic.
  source: Results, Expression of GCaMP6f and lens localization, paragraph 2; Figure S3B to S3D
  quote: We observed robust GFP expression around the lens/prism for most sites, except in monkey
    U's SMA, where the GFP expression was sparse ... We confirmed that GCaMP6f expression was
    specific for non-GABAergic neurons by performing a double immunofluorescence assay for GABA and
    GFP
  data: elsewhere
  where: Zenodo doi:10.5281/zenodo.15328390
  criterion: Histology, not imaging data. From the GFP and GABA double-label images on Zenodo,
    reproduced when no GFP-positive cell body is also GABA-positive; GFP density per site is
    described.
