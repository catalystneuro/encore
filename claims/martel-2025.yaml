- id: cells-tracked-18pct
  statement: About 18% of cells were tracked across up to three recording sessions.
  source: Results, General description of calcium activity, paragraph 2
  quote: We could track a small portion of cells (18%) across up to three recording sessions.
  expected:
    quantity: fraction of unique cells seen in more than one session
    value: 0.18
    tolerance: 0.018
  depends_on:
  - cell-counts
