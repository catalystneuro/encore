    tolerance: 6.3
  - quantity: cells, U M1
    value: 37
    tolerance: 3.7
  - quantity: cells, V M1
    value: 23
    tolerance: 2.3
  criterion: Accepted cells per site over the sessions listed in the opening comment. Readings (i)
    unique cells, each counted once (C), as Fig. 2A treats 129 Q cells over seven sessions; (ii)
    the sum of accepted cells over sessions. The Limitations call 23 to 129 the number imaged per
