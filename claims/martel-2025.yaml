  - about: SMA, spontaneous against task
    test: Wilcoxon signed rank test
    p: 0.07
    n: SMA sessions with both conditions (12 in the code, Q 7 and U 5)
  - about: M1, spontaneous against task
    test: Wilcoxon signed rank test
    p: 0.22
    n: M1 sessions with both conditions (6 in the code, U 4 and V 2)
  criterion: A claim of absence, on the paper's test (Methods; 1_JaccardIndexAnalysisAllSessions.R).
    Per session and condition, the proportion of pairs with |Z-Jaccard| > 1.96 (method J); per
    region, a two-sided Wilcoxon signed-rank test of spontaneous against task, paired by session,
