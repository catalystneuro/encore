# Claims for Martel, Pittard, Devergnas, Risk, Nassi, Yu, Downer, Wichmann and Galvan (2025),
# iScience 28, 112767, on dandiset 001174.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-22, under
# docs/protocol.md, version pilot-10.
#
# Text read. The version of record as served by Europe PMC (PMC12192352), full text with Results,
# figure legends and STAR Methods (paper/10.1016-j.isci.2025.112767.txt). Its supplement (Document
# S1, Figures S1 to S3 and Tables S1 to S3) is not in the text and was not read: the CNMFe
# parameters (Table S1), the sessions and cells per site (Table S2), the injection depths (Table
# S3) and the legends of Figure S1 (monkey U alignment), S2 (sequence distances) and S3
# (histology) are missing. Every result the claims rest on is stated in the main text, so claims
# were written; where a claim would need the supplement it says so. The bioRxiv preprint
# (10.1101/2024.06.20.599918 v1, paper/10.1101-2024.06.20.599918.txt) was read for method
# details only; its analyses differ (uncorrected t-tests for Fig. 2, one session per site for the
# Jaccard analysis) and its numbers are not used. No figure was viewed (no PDF was supplied).
#
# Code read. Four Zenodo records the key resources table links, downloaded 2026-10-22 (Zenodo
# records are fixed; md5 sums noted for the files the criteria use).
# - Event based analysis, doi:10.5281/zenodo.14963213. ReorganizedData_Final.m (md5 05491fdf)
#   reads the IDPS exports (_Spikes, _Raw, _Denoised, _Raw-props csv), keeps accepted cells,
#   splits each concatenated recording into spontaneous and task at the time gap, and computes per
#   cell the event rate (events over segment duration), the mean event amplitude (the amplitude
#   column of the IDPS spike export) and, in ISI_Final.m, the IEI CV (SD over mean of the
#   inter-event intervals, times 100). CellmapFinal.m (md5 66945e35) makes the Fig. 2 heat maps and
#   the per-cell tests. FDR_correction.m applies Benjamini-Hochberg to the p-values. There is no
#   code for the Fig. 1D-F statistics.
# - Jaccard analysis, doi:10.5281/zenodo.14977106. permfun.R (md5 fc1d3ae6) and
#   1_JaccardIndexAnalysisAllSessions.R (md5 e17d842d) compute the Z-Jaccard and the Fig. 3C test;
#   2_JaccardDistancePlots.R makes the loess plots of Fig. 3A,B.
# - Sequence detection, doi:10.5281/zenodo.14963234. identify_sequences.m (md5 6fe2a4f0), with
#   its parameters as arguments; the values used are not recorded in the code.
# - MonkeyLogic task files, doi:10.5281/zenodo.15346239. Single_target: conditions 1, 2, 3 are
#   right, center and left targets, and a TTL marks target onset (trial start) and the touch.
#   Two_target: conditions 1 and 2 are left and right side targets; its center hold is 600 ms and
#   its release limit 500 ms, where the Methods say 1 s and 1 s.
#
# Which dataset. The dandiset's title is "Calcium imaging in SMA and M1 of macaques" and its
# description is the paper's summary. The key resources table names it (DANDI
# 10.48324/dandi.001174/0.250331.2218) as holding the one-photon microendoscopic raw data and the
# CNMFe extracted maps and time series.
#
# Data the paper used (Results; STAR Methods).
# - Subjects. Four rhesus macaques, F, Q, U and V (2 males, 2 females, 4 to 5 years). GRIN lens in
#   left SMA and prism in right M1 in each; imaging succeeded in SMA of Q, U and F and in M1 of U
#   and V. Code file names give the monkeys as Fuji (F), Quartz (Q), Ulrik (U) and Vader (V).
# - Sessions. nVista3 miniscope, 10 Hz. Each session has 10 to 20 min "spontaneous" imaging,
#   then the reaching task until 100 successful trials (median 12 min), recorded as one file with a
#   time gap between the two parts. The Jaccard code lists the sessions used. SMA, Q (seven,
#   2022-09-15, 09-22, 10-03, 10-28, 12-01, 12-02, 12-06, spontaneous and task), U (five,
#   2023-02-27, 03-07, 03-14, 03-21, 03-28, both), F (eight, 2024-02-13, 02-20, 02-23, 02-27,
#   02-29, 03-05, 03-07, 03-12, spontaneous only; 2024-03-19 left out, one cell). M1, U (four,
#   2023-02-24, 03-01, 03-16, 03-23, both), V (two, 2023-03-09, 03-16, both). The text says only Q
#   and U performed the task; the code treats the second part of V's recordings as task.
# - Task. Q, one target at right, center or left of a touchscreen, touched within 3 s. U, center
#   target held, then a left or right target, released and touched. TTL pulses from the task were
#   recorded with some sessions (seven Q SMA sessions, one U SMA and one U M1 session for Fig. 2).
# - Measured variables. Per accepted CNMFe cell, the raw trace, the denoised trace, OASIS
#   deconvolved events (times and amplitudes) and the centroid. Distances in the code are centroid
#   pixel distances times 3.2 um.
# - Cells. Results are reported for the first session in which a cell was identified (Methods,
#   Cell identification). The code reads cross-session identity (global cell ID and occurrence
#   number) from a spreadsheet, Metadata_all_monkeys.xlsx, which is not among the deposits.
#
# Outside data (step 4). The paper deposited its results tables on Zenodo. General descriptors per
# cell, doi:10.5281/zenodo.14727695; activity aligned to behavioral events,
# doi:10.5281/zenodo.14976651; Jaccard outputs (Fig. 3), doi:10.5281/zenodo.15116617; sequence
# parameters (Fig. 4D), doi:10.5281/zenodo.14976005; histology images, doi:10.5281/zenodo.15328390.
# The first may carry the cross-session cell identity the code reads; the author checks.
#
# Shared method. Criteria refer to these by letter. A detail none of the sources fixes is named as
# open with the readings the text allows; the notebook runs each. A claim's outcome is the one all
# its readings give; when they differ, it is blocked as methods_underspecified.
# C, cells and segments. Accepted cells of each session. Spontaneous and task are the parts before
#   and after the time gap in the recording (ReorganizedData_Final.m). Each cell counts once, in
#   the first session it appears in (Methods). If the dataset carries no cross-session identity
#   the author takes it from the Zenodo descriptors table when that holds it; otherwise every
#   session's cells are counted as separate cells, shown as a deviation.
# D, descriptors. Event rate is the number of deconvolved events in a segment over its duration;
#   IEI CV is SD over mean of the inter-event intervals; amplitude is the mean amplitude of the
#   cell's events in the segment (ReorganizedData_Final.m, ISI_Final.m). The Fig. 1 legend says each
#   circle is "the median value for a cell"; readings (i) the cell's value in its first session
#   (Methods), (ii) the cell's median over the sessions it appears in.
# Z, task alignment (Methods, Alignment to behavioral events; CellmapFinal.m). Events are the
#   rewarded target onset (Q, target onset, the trial start TTL; U, side target onset) and, for U,
#   the center release (movement onset). For each successful trial, raw trace from 1 s before to
#   2 s after the event (30 samples); the baseline is 2 s to 1 s before the trial start (Q,
#   target onset; U, center target onset). Z-score as the code's first method (the one its tests
#   use), each trial's trace minus the mean, over the SD, of the trial-averaged baseline trace.
#   Trials with the event in the first 3 s of the task segment, with windows past the end or with
#   an all-zero window are dropped (code); the code's loop also skips each condition's last trial,
#   which is followed and shown without as a variant. Per cell and condition (target position), a
#   Wilcoxon signed-rank test across trials of the mean z in 0 to 1 s after the event against the
#   mean z in the 1 s before. Benjamini-Hochberg FDR at 0.05 within each chamber and alignment over
#   all cells and conditions (387 tests for Q, 28 for U SMA, 12 for U M1, Methods); the code's
#   FDR_correction.m corrects each condition column separately, shown as a variant. Modulated is
#   any condition significant; direction-related is exactly one significant condition;
#   non-direction-related two or more (Methods). The code's example call aligns Q on the touch
#   (RewardOn), shown as a variant. Q conditions are right, center, left; U left, right
#   (MonkeyLogic condition files).
# J, Z-Jaccard (Methods, Cell coactivation; permfun.R). Deconvolved events binned at 0.2 s over
#   the spontaneous and task parts joined with the gap removed, the bin that mixes the two dropped;
#   a bin is 1 when the cell has an event in it or the four bins after; the last four bins of the
#   spontaneous part and of the record are dropped. Jaccard per pair within each part; null from
#   1000 random circular shifts of one cell (Methods; the code's SMA loop passes 10, a variant);
#   Z-Jaccard is (observed minus null mean) over null SD. A pair is synchronized when |Z-Jaccard|
#   exceeds 1.96; the session's proportion is over all pairs with a defined Z-Jaccard (pairs with a
#   cell with no events are left out, as the code does). All sessions listed above, all cells.
# S, sequences (Methods, Determination of precisely timed sequences; identify_sequences.m). Events
#   at 1 ms resolution; segments of 10 min of spontaneous and of task recording. Which 10 min is
#   open; readings (i) the first 10 min of each part (and, for a 20-min spontaneous part, its two
#   halves), (ii) the last 10 min of the task part. A sequence is 2 to 5 events of different cells
#   in order, each next event within 2 s of the one before; cell orders tested as the code does
#   (each set of cells in ascending and descending order; the Methods say only "all possible
#   combinations"); all orderings as a variant. The Methods say "two or more cells", so the code's
#   single-cell repeats are left out (included as a variant). Kept when it occurs at least 4 times
#   (Methods; the code's rule, more than the number given, as a variant), its count exceeds the
#   0.95 centile of 1000 circularly shifted shuffles (code's centile, ties half), and the 0.05 s
#   rule holds; double counting removed as the code does. The paper gives 0.05 s to two different
#   parameters, readings (a) a lower bound of 0.05 s between successive events of the sequence
#   and 0.05 s between the starts of repetitions (both), (b) the first only, (c) the second only.
