- id: fig1d-rate-no-change
  statement: Calcium event rates did not differ between the spontaneous and reaching task
    conditions in either SMA or M1.
  source: Results, General description of calcium activity, paragraph 3; Figure 1D
  quote: The calcium event rates and the coefficient of variation of the inter-event intervals (IEI
    CV) did not differ between the spontaneous and reaching task conditions in either cortical
    region
  depends_on:
  - cell-counts
  criterion: A claim of absence, on the paper's test, a Wilcoxon signed-rank test of spontaneous
    against task event rate, paired by cell, cells with both parts (C, D), with Benjamini-Hochberg
    FDR and significance at p < 0.05 (Methods, Statistical comparisons; Figure 1 legend). The
    grouping and the FDR family are not given; readings, groups (i) per region with monkeys pooled,
    (ii) per monkey and region (Q SMA, U SMA, U M1, and V M1 when its second part is taken as
    task); families (a) all spontaneous against task tests of the three measures of Fig. 1D-F, (b)
    the tests of this measure only; with D readings (i) and (ii). Reproduced when no reading finds
    a significant difference, not reproduced when every reading does, blocked as
    methods_underspecified when they differ. Median rates per condition
    and the effect size are reported.
- id: fig1e-ieicv-no-change
  statement: The IEI CV did not differ between the spontaneous and reaching task conditions in
    either SMA or M1.
  source: Results, General description of calcium activity, paragraph 3; Figure 1E
  quote: The calcium event rates and the coefficient of variation of the inter-event intervals (IEI
    CV) did not differ between the spontaneous and reaching task conditions in either cortical
    region
  depends_on:
  - cell-counts
  criterion: As fig1d-rate-no-change, for the IEI CV. Cells with fewer than two inter-event
    intervals in a part have no CV and are left out.
- id: fig1f-amplitude-u-sma-spont-higher
  statement: In monkey U's SMA, event amplitude was significantly higher in the spontaneous state
    than during the reaching task.
  source: Results, General description of calcium activity, paragraph 3; Figure 1F
  quote: In the SMA, the amplitude of the events was significantly higher in the spontaneous state,
    compared to the reaching task recordings in monkey U
  statistics:
  - test: Wilcoxon signed rank test
    p: 0.032
    corrected: FDR (Benjamini-Hochberg)
    n: monkey U SMA cells with both conditions
  depends_on:
  - cell-counts
  criterion: Wilcoxon signed-rank test of spontaneous against task mean amplitude, paired by cell,
    for U SMA cells with both parts (C, D), FDR as in fig1d-rate-no-change, families (a) and (b),
    D readings (i) and (ii). Reproduced when every reading gives corrected p < 0.05 with the
    spontaneous median higher, not reproduced when none does, blocked as methods_underspecified
    when they differ.
- id: fig1d-rate-m1-above-sma-u
  statement: In monkey U the event rate was higher in M1 than in SMA, in both the spontaneous and
    the reaching task conditions.
  source: Results, General description of calcium activity, paragraph 3; Figure 1D
  quote: In monkey U, we found that the event rate was higher in M1 than in SMA, both during the
    spontaneous and reaching task conditions
  statistics:
  - about: spontaneous condition
    test: Wilcoxon rank-sum test
    p: 0.001
    p_relation: "<"
    n: monkey U SMA and M1 cells
  - about: reaching task condition
    test: Wilcoxon rank-sum test
    p: 0.001
    p_relation: "<"
    n: monkey U SMA and M1 cells
  depends_on:
