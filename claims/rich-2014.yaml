- id: fig3c-lomax-recruitment
  statement: The recruitment curve (the location of each cell's field nearest the start) matches
    the Lomax (Pareto type II) curve predicted by the gamma-Poisson model fitted to the field
    counts (Kolmogorov-Smirnov statistic 0.05, P = 0.48), while the equal-rate Poisson model's
    exponential curve fits poorly.
  source: Main text, paragraphs 6 and 8; Figure 3C; Materials and Methods, Population models
  quote: The predicted recruitment curve matched the observed one well (Fig. 3C;
    Kolmogorov-Smirnov statistic = 0.05, P = 0.48)
  statistics:
  - test: Kolmogorov-Smirnov, adapted to censored data, Monte Carlo significance with 2000
      surrogates
    statistic: KS = 0.05
    p: 0.48
    n: 253 cells
  expected:
  - quantity: Kolmogorov-Smirnov statistic, gamma-Poisson recruitment curve
    value: 0.05
    tolerance: 0.005
  depends_on:
  - fig3b-negbin-fit
  criterion: Per cell, the location of its field nearest 0 m; cells with no field are censored at 48
    m. The observed curve is the fraction of all 253 cells recruited by each distance. Predicted
    curve, the Lomax CDF from r and p of fig3b-negbin-fit (opening comment). KS statistic, the
    largest absolute difference between the two over 0 to 48 m (the valid region). Significance by
    2000 surrogate samples of 253 cells drawn from the Lomax, censored at 48 m, each giving a KS
    statistic against the same predicted curve; p is the fraction of surrogate statistics at or
    above the observed one (Methods). Whether the surrogate parameters are refitted (the
    Lilliefors approach of reference 37) is open, with readings K-a, fixed fitted parameters, as the
    Methods describe; K-b, for each surrogate, field counts drawn from the fitted negative
    binomial, the parameters refitted, and recruitment locations drawn from them. Reproduced when
    the KS statistic is within tolerance and p > 0.05 under both readings and the equal-rate
    Poisson curve (1 - exp(-mean x / 48)) lies above the observed curve at 48 m; partially
    reproduced when p > 0.05 under both but the statistic is outside tolerance.
