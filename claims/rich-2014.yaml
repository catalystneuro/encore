- id: figs10-no-track-or-speed-influence
  statement: Field density is not influenced by local track features or running speed; the number
    of fields against the angle of the track in the room, the distance to the nearest corner and
    the animal's mean speed shows no consistent trend relative to a shuffle of field locations.
  source: Main text, paragraph 9; Figure S10
  quote: was uninfluenced by local track features or running speed (fig. S10)
  depends_on:
  - fig3b-negbin-fit
  criterion: A claim of absence. Fields by the shared method. (A) the direction of the track,
    relative to the room, at each field's location in the direction of the field, a field of both
    directions giving half a count to each; (B) the distance along the track from each field to
    the nearest corner of the track; (C) the animal's mean velocity in 5 cm bins of the track
    during novel exploration, and the number of fields in bins of each velocity. Null, the same
    number of fields placed at random uniformly along the track, 2000 times, with the expected
    value and the 95% interval per bin (legend). The bin widths of A to C (for C, of velocity) are
    not given; standard choices (30 degree angle bins, 1 m distance bins, 5 cm/s velocity bins)
    are used and each is a deviation. What counts as a corner is not given and changes the
    distances measured, so it is open, with readings Y-a, every vertex of the track's scale model
    (Methods, Position tracking) where the direction changes by 45 degrees or more; Y-b, by 90
    degrees or more. The paper's judgement ("no consistent trend") names no test, so readings
    are T-a, no more bins outside the 95% interval than a binomial test at p < 0.05 allows; T-b,
    no Spearman correlation between bin centre and count residual (observed minus shuffle mean) at
    p < 0.05 for B and C. Reproduced when all three panels pass under both readings of T (and of
    Y for B); not reproduced when any panel fails under all of them.
