    neither its L-ratio nor its isolation distance in RUN1.
  source: Materials and Methods, Spike sorting; Figure S3B and S3C
  quote: Across the population, the number of fields from each unit was uncorrelated with the
    L-ratio (B; Spearman's ρ=-0.01, p=0.86) or the isolation distance (C; Spearman's ρ=0.07,
    p=0.37) of each single unit cluster during RUN1
  statistics:
  - about: number of fields against L-ratio
    test: Spearman correlation
    statistic: rho = -0.01
    p: 0.86
    n: 253 cells
  - about: number of fields against isolation distance
    test: Spearman correlation
    statistic: rho = 0.07
    p: 0.37
    n: 253 cells
  depends_on:
  - fig3b-negbin-fit
  criterion: A claim of absence, judged on the paper's test. L-ratio and isolation distance as
    Schmitzer-Torbert et al. (2005) define them, computed on the peak amplitudes of the four
    channels for RUN1 spikes (Methods). Spearman correlation of each with the number of novel
    fields per cell (shared method). Reproduced when neither correlation has p < 0.05; not
    reproduced when either does. Rho and p are reported. If the data set gives the paper's
    cluster quality values in place of the spikes' amplitudes, those are used and the notes say
    so.
- id: fig1-recruitment-by-section
  statement: In each new section of track, existing place cells formed additional fields and new
    place cells were recruited from cells silent until then.
  source: Main text, paragraph 5; Figure 1; Figures S4 i to v
  quote: In each new section of track, existing place cells formed additional fields and new place
    cells were recruited from the pool of silent cells
  criterion: Fields by the shared method (F-a; readings P-a and P-b). For each of epochs 2, 3 and 4,
    count the cells with at least one field in an earlier novel section that form a field in the
    new section, and the cells with no earlier field that form their first. Reproduced when both
    counts are at least one in every one of the three epochs, pooled over animals; partially
    reproduced when that holds in one or two of them. Counts per animal are reported.
- id: fig2-individual-poisson
  statement: For the 61 of 253 cells with at least six fields, neither the field locations nor the
    inter-field intervals differ from a Poisson process (uniform locations, exponential
    intervals); no cell is significant by the Anderson-Darling test after false discovery rate
    adjustment.
  source: Main text, paragraph 5; Figure 2A; Materials and Methods, Poisson testing
  quote: For cells with ≥6 fields (61/253), neither the spatial distributions of fields nor
    interfield interval distributions differed from the Poisson model (Anderson-Darling test,
    0/61 cells with P < 0.05, adjusted for false discovery rate)
  expected:
  - quantity: cells with at least 6 fields
    value: 61
    tolerance: 6.1
  - quantity: cells significant after FDR adjustment, either test
    value: 0
    tolerance: 0
  depends_on:
  - fig3b-negbin-fit
  criterion: Fields by the shared method (F-a; P-a and P-b). Locations are the field locations in
    metres from the start, tested against the uniform distribution on 0 to 48 m. Intervals are
    the gaps between consecutive sorted field locations of the cell, merged fields counted once,
    regardless of direction (Methods), tested against an exponential with the cell's mean
    interval. Open, two details. How the exponential test treats the estimated mean (E-a, the
    composite Anderson-Darling test with the mean estimated, as MATLAB's adtest does for the
    exponential; E-b, a simple test with the cell's mean plugged in). Which p-values form a "set"
    for the Benjamini-Hochberg adjustment (S-a, the 61 location tests and the 61 interval tests
    separately; S-b, all 122 together). Reproduced when the count of cells with six or more
    fields is within tolerance and no cell has an adjusted p < 0.05 under every reading;
    partially reproduced when at most two cells (3%) do; not reproduced otherwise.
- id: fig2bc-population-bias
  statement: Across the cells with at least six fields there is no overall bias in field location
    or interval; the median field location and the normalized deviation of the median inter-field
    interval from its exponential expectation follow the distributions expected for uniform and
    exponential fields.
  source: Figure 2B and 2C; Materials and Methods, Poisson testing
  quote: Distribution of median field location of all cells with ≥6 fields across animals (n = 61
    cells from 5 rats) versus distribution expected for cells with uniformly distributed fields
    (red curve)
  depends_on:
  - fig2-individual-poisson
  criterion: Per cell (the cells of fig2-individual-poisson), the location of the median field,
    and (median observed interval - mean interval x ln 2) / mean interval, the exponential
    median being the mean times ln 2. Null, 5000 surrogate sets per cell with the cell's number of
    fields, uniform on 0 to 48 m and exponential with the cell's mean interval (Methods), pooled
    over cells. The paper reports no test of the comparison, so it is open. Readings C-a, a
    two-sample Kolmogorov-Smirnov test of the 61 observed values against the pooled null values;
    C-b, each cell's observed value expressed as its percentile in its own null, and a
    one-sample Kolmogorov-Smirnov test of the 61 percentiles against uniform. Reproduced when
    neither statistic differs from its null at p < 0.05 under both readings; not reproduced when
    either differs under both; otherwise the result rests on the reading, as the notes say.
- id: figs6-few-field-cells-uniform
  statement: For cells with fewer than six fields, the pooled field locations of cells with the
