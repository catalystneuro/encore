    piece at the start of the later section) and C (the next equal, non-overlapping piece of the
    later section); rho across = Spearman(A, B), rho within = Spearman(B, C), over cells. For
    sections 2 and 3 a 7 m piece does not fit twice in the 12 m section 3, so the piece length is
    open, with readings L-a, pieces as long as the earlier section, C cut at the end of the later
    section when short; L-b, pieces of the earlier section's length or half the later section's,
    whichever is shorter, A being the end of the earlier section. The shuffle is open, with readings
    H-a, for each cell the counts of A and C swapped at random; H-b, for each cell the three
    counts permuted at random; 8000 shuffles, two-sided p on rho across - rho within. Reproduced
    when no boundary has p < 0.05 under every reading; not reproduced when one does under all
    readings. The rho values are reported against their expected values.
- id: figs12-pairs-uncorrelated
  statement: Field locations are uncorrelated between pairs of cells; the correlations between the
    numbers of fields two cells have across spatial bins match the null of independence at every
    scale tested.
  source: Main text, paragraph 9; Figure S12
  quote: field locations were uncorrelated between pairs of cells (fig. S12)
  depends_on:
  - fig3b-negbin-fit
  criterion: A claim of absence. For each pair of cells from the same animal, the Pearson
    correlation between their numbers of fields in 48, 24, 12, 6 or 3 equal bins of the track
    (legend); pairs where either cell has the same count in every bin (as with no fields) have no
    correlation and are left out, a standard choice. Null, each cell's bins shuffled independently,
    2000 times (legend). No test of the comparison is reported, so readings are U-a, a two-sample
    Kolmogorov-Smirnov test of the observed against the pooled null correlations; U-b, the mean
    observed correlation against the 95% interval of the null means. Reproduced when the observed
    distribution does not differ from the null at p < 0.05 at all five scales under both
    readings; not reproduced when it differs at any scale under both. The observed and null means
    are reported.
- id: fig3e-memoryless-recruitment
  statement: Recruitment is memoryless; recruitment curves started at evenly spaced points along
    the track, ignoring earlier activity, have the same shape whatever the starting point, and the
    same holds working back from the far end.
  source: Main text, paragraph 10; Figure 3E; Figure S13
  quote: These memoryless recruitment curves had the same shape regardless of the starting point
  depends_on:
  - fig3b-negbin-fit
  criterion: From each starting point s, for every cell, the location of its first field beyond s,
    measured from s, over the 48 - s m that remain; the curve is the fraction of all cells
    recruited. Reverse curves likewise from the far end toward the start (Fig. S13B). The spacing
    of starting points is not given; Figure 3E shows curves about every 5 m, so starts at 0, 5, ...,
    40 m are used (V-a), with every 10 m as a check (V-b). No test is reported. The test is that of
    Fig. 3C, applied to each curve against the Lomax with the parameters of fig3b-negbin-fit,
    censored at 48 - s (K-a). Reproduced when no forward or reverse curve differs at p < 0.05 after
    Benjamini-Hochberg adjustment over the curves, under both spacings V-a and V-b; partially reproduced when
    only curves over less than 10 m of track differ.
- id: figs14-field-properties
  statement: Field size (65 plus or minus 43 cm) and in-field rate (5 plus or minus 2 Hz) are not
    correlated with location along the track (rho 0.05 and 0.01) or with the number of other fields
    of the same cell (rho 0.05 and 0.05).
  source: Figure S14 legend; main text, paragraph 11
  quote: Basic parameters of individual fields, field size (65±43 cm, mean±s.d.) and in-field rate
    (5±2 Hz), were not correlated with location along the track (Spearman's ρ=0.05,0.01,
    p=0.11,0.75, A and C) or the number of other fields from the same cell (ρ=0.05,0.05,
    p=0.14,0.17, B and D)
  statistics:
  - about: field size against location
    test: Spearman correlation
    statistic: rho = 0.05
    p: 0.11
  - about: in-field rate against location
    test: Spearman correlation
    statistic: rho = 0.01
    p: 0.75
  - about: field size against number of other fields
    test: Spearman correlation
    statistic: rho = 0.05
    p: 0.14
  - about: in-field rate against number of other fields
    test: Spearman correlation
    statistic: rho = 0.05
    p: 0.17
  expected:
  - quantity: mean field size
    value: 65
    tolerance: 6.5
    unit: cm
  - quantity: SD of field size
    value: 43
    tolerance: 4.3
    unit: cm
  - quantity: mean in-field rate
    value: 5
    tolerance: 0.5
    unit: Hz
  - quantity: SD of in-field rate
    value: 2
    tolerance: 0.2
    unit: Hz
  depends_on:
  - fig3b-negbin-fit
  criterion: The plus-or-minus values are spreads across fields, not uncertainties of the means, so
    tolerances are 10%. Field size is the field width between the 2 Hz crossings; in-field rate
    the mean of the rate map inside the field (Fig. S15A, "average in-field firing rate"). For a
    merged field these are open, with readings M-a, width of the union of the two directional fields
    and mean rate of the averaged directional maps over it; M-b, the mean of the two directional
    widths and rates. The four correlations are claims of absence, judged on the paper's Spearman
    test, reproduced when none has p < 0.05. The claim is reproduced when that holds and the four
    values are within tolerance under one reading; partially reproduced when the correlations
    hold but a value is out of tolerance.
- id: figs15-higher-threshold
  statement: Different criteria for place field detection do not change the results; with a higher
    threshold (an in-field rate above 4.8 Hz, which about 50% of fields reach), the gamma-Poisson
    model still describes the number of fields per cell and the recruitment of cells.
  source: Main text, paragraph 11; Figure S15
  quote: Different criteria for place field detection did not change the results (fig. S15)
  expected:
    quantity: fraction of fields with mean in-field rate above 4.8 Hz
    value: 50
    tolerance: 5
    unit: '%'
  depends_on:
  - figs14-field-properties
  criterion: Keep the fields whose mean in-field rate (as in figs14-field-properties, readings M-a
    and M-b) exceeds 4.8 Hz (Fig. S15A legend; the threshold line of Fig. S15B lies at the same
    rate). Refit the negative binomial to the counts per cell and test the recruitment curve as in
    fig3c-lomax-recruitment (readings K-a and K-b). The legend says only that the model "remains a
    good fit", so the test is that of Fig. 3C. Reproduced when the fraction kept is within
    tolerance and the recruitment test gives p > 0.05 under both readings of K; not reproduced
    when the recruitment test gives p < 0.05 under both. The refitted r and p, and the dispersion
    tests of fig3b-overdispersion on the new counts, are reported.
- id: figs16-anatomy
  statement: The number of fields per cell is weakly related to the anatomical position of the cell
    in the pooled data (septotemporal r = -0.20, p = 0.001; proximodistal r = -0.19, p = 0.002), but
    the relation is not consistent within individual animals.
  source: Figure S16D and S16E legend; main text, Fig. 4 discussion, paragraph 2
  quote: Although there was a weak relationship in the pooled data (ST r = -0.20 p = 0.001, PD r =
    -0.19 p = 0.002), this was not consistent within individual animals
  statistics:
  - about: number of fields against septotemporal position
    test: correlation
    statistic: r = -0.20
    p: 0.001
    n: 253 cells
  - about: number of fields against proximodistal position
    test: correlation
    statistic: r = -0.19
    p: 0.002
    n: 253 cells
  expected:
  - quantity: correlation, fields against septotemporal position, pooled
    value: -0.20
    tolerance: 0.02
  - quantity: correlation, fields against proximodistal position, pooled
    value: -0.19
    tolerance: 0.019
  depends_on:
  - fig3b-negbin-fit
  criterion: Each cell's relative septotemporal and proximodistal coordinates in CA1 from the
    histology of its tetrode (Methods, Experiment). The correlation is named only "r"; readings
    R-a, Pearson; R-b, Spearman. What "not consistent within individual animals" means is not
    given; readings N-a, fewer than three of the five animals show a significant correlation (p <
    0.05) of the pooled sign on that axis; N-b, at least one animal has a correlation of the
    opposite sign on that axis. Reproduced when, under one reading of R, both pooled values are
    within tolerance with p < 0.05 and, under one reading of N, the per-animal pattern holds on
    both axes; partially reproduced when the pooled values hold and the per-animal pattern does
    not.
- id: fig4a-pre-sleep-rate
  statement: Firing rates in slow-wave sleep before the animal experienced the maze are moderately
    correlated with the later number of fields per cell (r = 0.45, P < 10^-13), evidence that
    preexisting differences between cells contribute to field propensity.
  source: Main text, page 817, paragraph 1; Figure 4A (figure and legend missing from the text read)
  quote: Firing rates in slow-wave sleep (SWS) before the animal had experienced the maze were
    moderately correlated with the subsequent number of fields per cell (Fig. 4A; r = 0.45, P <
    10−13)
  statistics:
  - test: correlation
    statistic: r = 0.45
    p: 1.0e-13
    p_relation: "<"
    n: 253 cells
  expected:
    quantity: correlation, PRE slow-wave sleep firing rate against number of fields
    value: 0.45
    tolerance: 0.045
  depends_on:
  - fig3b-negbin-fit
  criterion: SWS in PRE by the Methods (PRE slow-wave sleep correlation), with immobility from the
    accelerometer with 5 s added either side of movement, REM where the theta (6-10 Hz) to delta
    (1-4 Hz) ratio smoothed over 2 s exceeds 2 for at least 0.5 s, ripples where the 150-250 Hz
    amplitude exceeds 3 SD for at least 15 ms, and SWS the immobile non-REM periods with at least
    0.2 ripples per second. How that background ripple rate is measured is not given; if the data
    set holds the paper's SWS periods, they are used, else a 10 s sliding window is used (a
    standard choice, a deviation). Rate per cell, spikes over total SWS time. The Fig. 4A legend
    is missing, so the correlation is open, with readings W-a, Pearson on rates; W-b, Pearson on log10
    rates (zero rates offset by the smallest positive rate); W-c, Spearman. With n = 253, r = 0.45
    gives a Pearson p of about 5e-14, consistent with W-a. Reproduced when, under one reading, r is
    within tolerance and p < 1e-13; partially reproduced when r is positive with p < 0.05 under
    one reading but out of tolerance.
- id: fig4b-single-field-proportion
  statement: Under the gamma-distributed propensities the proportion of cells with a single field
    would stay at about 5 to 10% over a wide range of environment sizes, which could allow a
    simple readout of location.
  source: Main text, page 817, paragraph 4; Figure 4B (figure and legend missing from the text read);
    Materials and Methods, Active subset simulation
  quote: But with the observed gamma-distributed propensities, the proportion of cells with single
    fields would remain at ~5 to 10% over a wide range of environment sizes
  expected:
  - quantity: lowest single-field proportion over the range
    value: 5
    tolerance: 0.5
    unit: '%'
  - quantity: highest single-field proportion over the range
    value: 10
    tolerance: 1
    unit: '%'
  depends_on:
  - fig3b-negbin-fit
  criterion: Computed exactly from the fitted model (Methods), for an environment of length L, the
    count is negative binomial with r and p_L = 1 / (1 + (L/48)(1 - p)/p), and the single-field
    proportion is r p_L^r (1 - p_L). The range of sizes Fig. 4B plots is not in the text read, so
    the claim is judged on the widest interval of L over which the proportion stays inside 4.5 to
    11% (the range widened by 10% of each bound). The paper puts no number on "a wide range", so
    the width is taken from the paper's own model, the printed parameters (r 0.57, p 0.14) under
    the same reading, less 10%. The denominator is open, with readings X-a, all cells (the formula
    above); X-b, place cells, r p_L^r (1 - p_L) / (1 - p_L^r). The printed parameters keep the
    proportion inside 4.5 to 11% from about 118 to 652 m under X-a (a factor of 5.5) and from about
    171 to 748 m under X-b (a factor of 4.4). Reproduced when, under one reading, the interval from
    the fitted model spans at least a factor of 5.0 in L under X-a, or 3.9 under X-b. Before any
    analysis, note that the printed parameters under X-a give about 16% at 48 m and 20% at 10 to
    20 m, with 5 to 10% for L of roughly 145 to 535 m (and near 1 to 2 m); the interval and its
    position under each reading are reported.
- id: fig4c-active-subsets
  statement: Unlike equal propensities, which recruit all cells in large enough environments, the
    observed distribution of propensities lets environments over a wider range of sizes be
    distinguished by their active subsets, even with each cell's propensity fixed across
    environments.
  source: Main text, page 817, paragraph 4; Figure 4C (missing from the text read); Figure S18;
    Materials and Methods, Active subset simulation
  quote: Instead, the observed distribution of propensities allows environments with a wider range
    of sizes to be distinguished based on their active subsets, even if one assumes each cell's
    propensity to be permanently fixed (Fig. 4C and fig. S18)
  depends_on:
  - fig3b-negbin-fit
  criterion: The simulation of the Methods, 1000 cells, each with a rate fixed across environments
    (drawn once from the fitted gamma, or the equal rate), 300 independent environments from 0.1
    to 50 m, Poisson field counts per environment; for each pair of environments the proportion of
    cells active in one and not the other (exclusive OR). The spacing of the 300 sizes is open, with
    readings G-a, logarithmic; G-b, linear. The comparison of Fig. 4C is the gamma-Poisson against
    the equal-rate model fitted to the data (Methods, "parameters ... estimated from the data";
    Fig. S18 legend, the first two conditions "are the gamma-Poisson and equal-rate-Poisson models
    shown in Fig. 4C"). The paper's measure is the range of sizes that can be distinguished, read
    as the share of all pairs of different environments in which the exclusive-OR proportion is
    above a level. Fig. 4C is missing, so the level is open, with readings K-a, 0.1; K-b, 0.2
    (standard choices, a deviation). Reproduced when the gamma-Poisson share is higher than the
    fitted equal-rate share under every reading of G and K; not reproduced when it is lower under
    every one; otherwise the readings disagree and the author proceeds as in Author, step 1.6. The
    mean exclusive-OR proportion over pairs both larger than 10 m is reported, not judged; the
    fitted equal rate does not recruit all cells by 50 m, so it does not test the paper's
    statement. The full matrices are shown. The low and high equal rates of Fig. S18 are not given;
    half and twice the fitted mean are shown as variants, with the Fig. S18 legend's statement
    that the high-rate proportion is almost zero between larger environments checked on the
    twice-the-mean variant.
- id: figs5-silent-cells-low-rate
  statement: Cells without fields had very low firing rates in the environment (0.006 plus or minus
    0.01 Hz), lower than cells with fields, and the number of fields and the run firing rate of a
    cell are tightly correlated.
  source: Materials and Methods, Place field determination; Figure S5
  quote: Cells without fields had very low firing rates (0.006±0.01 Hz, mean±std) in the
    environment, lower than cells with at least one place field (fig. S5)
  expected:
  - quantity: mean firing rate of cells without fields
    value: 0.006
    tolerance: 0.0006
    unit: Hz
  - quantity: SD of firing rate of cells without fields
    value: 0.01
    tolerance: 0.001
    unit: Hz
  depends_on:
  - fig3b-negbin-fit
  criterion: Run firing rate, spikes over time with speed above 5 cm/s (Fig. S5 legend). Which
    track time counts as "in the environment" is open, with readings Z-a, novel-section exploration of
    RUN1 only; Z-b, all RUN1 time on the track. The plus-or-minus value is a spread across cells,
    so tolerances are 10%. "Lower than cells with at least one place field" and "tightly
    correlated" name no test; the tests are a one-sided Mann-Whitney test of the rates of cells
    without fields against those of cells with fields, and a Spearman correlation between rate
    and number of fields, each at p < 0.05 in the stated direction, with rho reported. Reproduced
    when, under one reading, both values are within tolerance and both tests hold.
- id: figs8-silent-cells-form-fields
  statement: Some cells that remained silent on the 48 m track formed clear place fields in a second
    novel environment, the open field.
  source: Main text, paragraph 7; Figure S8
  quote: To see whether the ~35% of cells that remained silent were capable of forming fields at
    all, we later exposed the animal to a second novel environment and found that some of these
    cells formed clear place fields
  depends_on:
  - fig3c-recruitment-fraction
  criterion: Cells with no novel field in RUN1 (shared method), and their fields in the RUN3 open
    field (opening comment, readings O-a and O-b). Reproduced when at least two such cells (the
    number Fig. S8 shows) have at least one open-field field under one reading. The number and
    fraction of RUN1 silent cells with open-field fields are reported.
- id: figs17-propensity-across-environments
  statement: Field propensities are correlated across environments but not as strongly as within
    one environment; the number of fields per cell in a window of the track correlates with the
    rest of the track at Spearman rho about 0.41, the open field with the long track at about 0.22,
    against about 0 for the shuffle.
  source: Figure S17; Materials and Methods, Inter- and intramaze correlation comparison; main
    text, page 817, paragraph 3
  quote: Field propensities are correlated across environments but not as strongly as within a
    single environment
  expected:
  - quantity: median Spearman rho, window of RUN1 against the rest of RUN1
    value: 0.41
    tolerance: 0.075
  - quantity: median Spearman rho, RUN3 open field against the rest of RUN1
    value: 0.22
    tolerance: 0.015
  depends_on:
  - figs8-silent-cells-form-fields
  criterion: Values read from Figure S17, where they are printed only as points with 95% intervals
    (about 0.34 to 0.49 and 0.20 to 0.23); the tolerances are the half-widths of those intervals,
    read from the figure, the paper's own spread. Procedure of the Methods, 2000 times, a random
    start on the track, a window extended forward until it holds as many fields (over all cells)
    as the open field; rho within, Spearman between counts per cell inside and outside the window;
    rho between, Spearman between open-field counts and counts outside the window; median and 95%
    interval of each. What happens when the window reaches the end of the track is open, with readings
    J-a, the window wraps to the start; J-b, only starts from which the window fits are drawn.
    Shuffle null, the open-field counts permuted across cells. Whether cells are pooled across
    animals is not stated; pooled is the reading Figure S17's single points imply. Reproduced when,
    under one reading of J and of O, both medians are within tolerance and the between median is
    below the within median and above the shuffle's 95% interval; partially reproduced when the
    ordering holds but a median is out of tolerance.
checks:
- date: 2026-11-11
  kind: agent
  model: claude-opus-5-5
  ready: true
  changes:
  - fig2-individual-poisson. Removed the statistics entry (Anderson-Darling, FDR, p 0.05 recorded as ">"); "0/61 cells with P < 0.05" counts cells by a threshold, a method and not a result. The count stays as the expected value 0.
  - figs6-few-field-cells-uniform. Removed the statistics entry for the same reason; "0/5 pFDR<0.05" counts groups by a threshold. The criterion keeps the test.
  - fig3b-overdispersion. The statement says the fit is poor in each animal (Fig. S7A legend, "The fits for individual animals are poor"), but the criterion accepted four of five; it now needs all five, and the zero-field expectation is computed per animal with that animal's n and mean.
  - figs10-no-track-or-speed-influence. The corner definition (45 degrees) was called a standard choice, but it changes the distances panel B measures and the paper does not define a corner; it is now open, with readings Y-a (45 degrees) and Y-b (90 degrees).
  - figs15-higher-threshold. Removed the condition that the counts stay overdispersed; the Fig. S15 legend says only that the gamma-Poisson model describes the counts and the recruitment as for all fields, and names no dispersion test. The dispersion tests are now reported.
  - figs16-anatomy. "Not consistent within individual animals" was operationalized one way (fewer than three animals significant) as if the paper fixed it; it is now open, with readings N-a (that rule) and N-b (an animal with the opposite sign).
  - fig4b-single-field-proportion. The criterion named X-a and X-b but judged on X-a only; it now judges under either and gives the X-b formula. The note on the printed parameters is corrected to 150 to 550 m and 1 to 2 m (r p_L^r (1 - p_L) with r 0.57, p 0.14 gives about 8.5% at 200 m, 4.7% at 600 m, 6% at 1 m and 10% at 2 m).
  - fig4c-active-subsets. Removed the requirement that the fitted equal-rate proportion between environments over 20 m be below 0.05; the Fig. S18 legend says that of the high-rate condition, not of the fitted one, and the fitted equal rate (3.5 fields per 48 m) gives about 0.25 for 20 m against 50 m. The statement is now checked on the twice-the-mean variant.
  - figs5-silent-cells-low-rate. The criterion required every cell without fields to lie below the median cell with fields and called that a Mann-Whitney test; the paper compares the groups only, so the test is now the Mann-Whitney test alone, named as a reading. Readings renamed Z-a and Z-b, as E-a and E-b were already used in fig2-individual-poisson.
  - fig3e-memoryless-recruitment. Spacing readings renamed V-a and V-b, as S-a and S-b were already used in fig2-individual-poisson.
  - figs17-propensity-across-environments. The tolerance of the between-environment median was 0.02, but the criterion sets it to the half-width of the interval it reads (0.20 to 0.23), 0.015; set to 0.015.
  - Open. The values read from figures (Fig. S7A means per animal, the Fig. S17 points and intervals, the Fig. 3E spacing of about 5 m, the Fig. S15B threshold line) could not be checked; no PDF renderer was available in this run. They agree with what the text allows (the S7A means give a pooled mean between 3.2 and 3.6, against 3.5 from r and p).
  - Open. fig3c-extrapolation-500m. The printed parameters give about 436 m (410 to 480 m within their rounding), outside the 10% tolerance of 500 m; the paper's "~500 m" is approximate and its inset cannot be read, so the tolerance is kept and the result rests on the unrounded fit.
  - Open. fig4b-single-field-proportion. The factor of 10 in L that stands for "a wide range" is not from the paper, and the printed parameters give under a factor of 4 under either reading; the Fig. 4B legend, which would fix the range of sizes and the denominator, is missing from the text supplied.
