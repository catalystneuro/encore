- id: fig3b-overdispersion
  statement: The number of fields per cell is overdispersed relative to the equal-rate Poisson
    model, a few cells having many fields and many more cells than expected having few or none,
    so that model fits the field counts poorly, in the pooled data and in each animal.
  source: Main text, paragraph 7; Figure 3B; Figure S7A
  quote: Instead, the observed number of fields per cell was overdispersed relative to the
    equal-rate Poisson model (Fig. 3B and fig. S7A), indicating significant differences in the
    spatial rate of field formation between cells
  depends_on:
  - fig3b-negbin-fit
  criterion: The counts per cell of fig3b-negbin-fit. The paper names no test of the poor fit, so
    it is open. Readings D-a, the index-of-dispersion test (sum of squared deviations from the
    mean over the mean, against chi-square with n - 1 degrees of freedom); D-b, a likelihood ratio
    test of the negative binomial against the Poisson (half chi-square with one degree of
    freedom, as the dispersion parameter sits on its boundary). Reproduced when the variance
    exceeds the mean, the observed number of cells with no field exceeds the equal-rate Poisson
    expectation (n exp(-mean), for the pooled cells and for each animal's), and the test gives p <
    0.05 under both readings, pooled and in each of the five animals (Fig. S7A legend, "The fits
    for individual animals are poor"); partially reproduced when it holds pooled but in fewer
