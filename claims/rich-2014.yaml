  source: Materials and Methods, Poisson testing; Figure S6C
  quote: None of these distributions were significantly different from uniform (Anderson-
    Darling test, 0/5 pFDR<0.05)
  depends_on:
  - fig3b-negbin-fit
  criterion: Fields by the shared method (F-a; P-a and P-b). For each of the groups of cells with
    1, 2, 3, 4 and 5 fields, the field locations pooled over the group's cells, tested against
    uniform on 0 to 48 m by the Anderson-Darling test, the five p-values adjusted by
