claims:
- id: cell-counts
  statement: The study analysed 253 putative pyramidal cells from dorsal CA1 of five rats, 63, 58,
    24, 57 and 51 per animal, each isolated in PRE sleep and tracked over the whole experiment.
  source: Main text, paragraph 4; Materials and Methods, Spike sorting
  quote: We recorded 253 putative pyramidal cells from dorsal CA1 (fig. S1) in the rats ... The
    number of isolated putative pyramidal units from tetrodes localized to CA1 from each animal
    was 63, 58, 24, 57, and 51
  expected:
  - quantity: putative pyramidal cells, all animals
    value: 253
    tolerance: 25.3
  criterion: Cells as the data set marks the paper's putative pyramidal CA1 units isolated over
    the whole experiment (Methods, Spike sorting). Reproduced when the total is within tolerance
    and each animal's count is within 10% of 63, 58, 24, 57 and 51 under some one-to-one
    assignment of the paper's counts to the five animals (the paper does not say which animal
    has which count).
- id: figs3-cluster-quality
