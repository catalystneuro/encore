# Claims for Rich, Liaw & Lee (2014), Science 345:814-817, "Large environments reveal the
# statistical structure governing hippocampal representations", tested on CRCNS data set hc-31.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-11-11, protocol as stated in docs/protocol.md (version pilot-14, Reader).
#
# Text read: the version of record (paper/10.1126-science.1255635.txt, PyMuPDF text of the
# publisher PDF, supplied by a person) and its supplement (rich.sm.pdf: Materials and Methods,
# Supplementary Text, Figs. S1 to S18 with legends, references). The supplement PDF was rendered
# to read Figs. S5, S7, S15 and S17; the main PDF was rendered to read Fig. 3.
# Missing from the text read: the last page of the article (p. 817) has a damaged content stream
# in the PDF supplied. Its text columns survive, but Fig. 4 (panels A to C), the Fig. 4 legend,
# references 30 and 31 and the acknowledgments neither render nor appear in the text. The Fig. 4
# results are stated in the main text and its methods in the supplement, so those claims are
# kept, but every detail the Fig. 4 legend would fix (the correlation used in Fig. 4A, the range
# of sizes in Fig. 4B, what Fig. 4C plots) is named as open below.
# Code: the paper links no analysis code; none was read. The data set's own example script is
# part of the data set, not of the paper, and was not read.
#
# Data the paper used. Five adult male Long-Evans rats, one microdrive of 16 tetrodes over right
# dorsal CA1 each; spikes (600-6000 Hz, 32 kHz) and LFP. Only tetrodes localized to CA1 by
# histology. Units clustered in the PRE sleep session, kept only when isolated and tracked over
# the whole day (PRE, RUN1, REST, RUN2, RUN3, POST); putative interneurons removed by high rates
# and narrow waveforms. Putative pyramidal cells per animal 63, 58, 24, 57 and 51 (253 in all).
# One day per rat, in a novel room: PRE, about 2 h of rest in a sleep box; RUN1, a 48 m elevated
# linear track built in four sections of 3, 7, 12 and 26 m (track length 3, 10, 22 and 48 m in the
# four epochs), each epoch 3 to 5 traversals, the animal confined at the start while the next
# section was added; REST, at least 4 h in the sleep box; RUN2, 4 to 5 more laps of the full
# track; RUN3, 10 to 25 min in a novel oval open field (about 40 x 100 cm) in another room; POST,
# sleep. Position traced by hand from three overhead cameras and mapped onto a scale model of
# the track (linearized position, 0 m at the start). Histological positions of tetrodes on the
# septotemporal and proximodistal axes of CA1. The hc-31 description lists single units and LFP
# from dorsal CA1 of five rats on the novel 48 m track, the repeat exposure, the open field and
# the flanking sleep sessions.
#
# Shared method, from the supplement's Materials and Methods unless stated.
# - Cells. The 253 putative pyramidal cells. A cell counts in every population figure, including
#   those with no field.
# - Novel exploration. Only times when the animal explored the section new in that epoch of RUN1
#   (the whole first section in epoch 1; the added section in epochs 2 to 4); times confined at
#   the start and times on sections from earlier epochs are left out. Fields are detected
#   separately in each epoch (Fig. S4 legend) on that epoch's novel section, and a cell's number
#   of fields is the sum over the four novel sections. RUN2 is not used for the main results.
# - Rate maps. Per direction of travel (outbound and inbound, from the sign of the velocity),
#   spikes and occupancy in 1 cm bins of linearized position, each smoothed with a Gaussian of SD
#   10 cm, rate = smoothed spikes over smoothed occupancy; bins with occupancy not above 0.001
#   s/cm dropped; only periods with velocity above 5 cm/s. Velocity is the net linear
#   displacement in a sliding 1 s window; that the window is centred is a standard choice that
#   cannot change the outcome.
# - Place fields. At least 15 contiguous cm of a directional rate map above 2 Hz, bounded where
#   the rate falls below 2 Hz, kept only when at least one spike fell in at least 50% of the
#   passes through the field in that direction. Outbound and inbound fields are merged when
#   either overlaps the other by at least 50% (of its own extent, the reading the sentence
#   gives). The field location is the peak of the rate map within the field; for a merged field,
#   the peak of the mean of the two directional maps. What counts as a pass is open: readings
#   P-a, a traversal that enters the field at one edge and leaves at the other in the direction
#   considered; P-b, any visit to the field's bins while moving in that direction.
# - Open field (RUN3). 2D rate maps in 1 cm2 bins smoothed with a Gaussian of SD 5 cm; a field is
#   at least 100 cm2 of contiguous bins above 2 Hz. A speed threshold and an occupancy threshold
#   are not given for the open field: readings O-a, the track's 5 cm/s and 0.001 s per bin;
#   O-b, no speed threshold with the same occupancy rule.
# - Population models. Equal-rate Poisson, each cell's count Poisson with the mean count per
#   cell (maximum likelihood); gamma-Poisson, a negative binomial with parameters r and p fitted
#   by maximum likelihood to the counts per cell, with P(X = x) = Gamma(x + r) / (Gamma(r) x!)
#   p^r (1 - p)^x (Supplementary Text; the text extraction garbles the formula, and this is the
#   form whose mean, r(1 - p)/p = 3.5 for r = 0.57 and p = 0.14, agrees with the per-animal means
#   of Fig. S7A). The rate per metre is gamma with shape r and rate beta = 48 p/(1 - p) metres,
#   and the predicted recruitment curve (location of each cell's first field) is the Lomax
#   distribution 1 - (beta/(beta + x))^r, never refitted to the recruitment data.
# - Field set. Fields are recomputed from spikes and position by the method above (F-a). Where
#   the data set holds the paper's own detected fields, the same analysis on them is shown as a
#   variant (F-b); outcomes are judged on F-a and the notes say where the two differ.
# Every criterion names the readings it rests on; the outcome is the one all its readings give.
