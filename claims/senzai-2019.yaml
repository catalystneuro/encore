- id: fig2c-six-gamma-ics
  statement: ICA of the 30-100 Hz LFP yields six main independent components whose spatial loadings are
    highly consistent across mice and whose depth distribution is related to the anatomical layers.
  source: Results, Anchoring Mesoscopic Patterns to Physiological Landmarks, paragraph 3; Figure 2C
  quote: ICA yielded six main independent components (ICs) that were highly consistent across animals (p <
    0.001, Spearman’s correlation for ICs spatial loadings)
  statistics:
  - test: Spearman's correlation for ICs spatial loadings
    p: 0.001
    p_relation: "<"
    n: 19 mice
  criterion: Per mouse, the LFP band-passed 30-100 Hz, reduced by PCA to its first ten PCs, then runica
    (EEGLAB, Bell and Sejnowski; STAR Methods, Independent Component Analysis of LFPs); ICs ranked by
    variance explained, loadings as the inverse mixing matrix projected on depth. The paper does not say
    which six of the ten are the main ones or how ICs are matched across mice. Readings are (a) the six
    with the highest variance, matched by the depth of peak loading, and (b) the six whose loadings are
    confined in depth (not spread over all sites), matched likewise. The correlation test is (a) each
    mouse's loading against the across-mouse mean, or (b) all pairs of mice, in normalized depth. The
    brain state the ICA is run on is not given (Figure S2H compares IC variance across states, which
    suggests one decomposition per session); readings are the whole session and waking only.
    Reproduced when, under a reading, the median Spearman correlation is positive with p < 0.001 for each
    of the six ICs.
  depends_on:
  - fig1g-landmark-distances-consistent
  data: dataset
