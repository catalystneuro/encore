# Claims for Senzai, Fernandez-Ruiz & Buzsaki (2019) on dandiset 000166.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23,
# protocol pilot-10 as stated in docs/protocol.md (Reader).
#
# Text read: the version of record (Neuron 101, 500-513.e5, 2019, CC BY) as served by Europe PMC
# (PMC6367010), full text with Results, figure legends and STAR Methods, and its two supplements
# from the PMC Open Access data: mmc1.pdf (Document S1, legends and panels of Figures S1 to S8) and
# mmc2.pdf (Document S2, the article plus supplemental information, a PDF copy of the same text).
# No PDF page was rendered (no renderer was available); every number used here is in the text.
#
# Code read: the paper links no analysis code of its own. Its Key Resources Table links buzcode
# (https://github.com/buzsakilab/buzcode), read at commit e615663b2b100782d1f378580f6d7aaa35c12937
# (2026-10-01; the commit the paper used is not given). It is the lab's general MATLAB toolbox. The
# parts that bear on the paper are detectors/detectStates/SleepScoreMaster (brain state scoring, linked
# by the Methods), detectors/detectEvents/DetectSlowWaves.m (UP and DOWN detection after Levenstein et
# al., as the Methods describe), analysis/monosynapticPairs (bz_MonoSynConvClick.m, bz_cch_conv.m;
# CCG convolution baseline after Stark and Abeles 2009 and transmission probability after English et al.
# 2017) and the EEGLAB runica used for ICA. bz_MonoSynConvClick defaults (0.4 ms bins, a 10 ms window
# with a hollowed Gaussian, alpha 0.001 with a correction over bins, synaptic window 0.8 to 4 ms) differ
# from the paper's STAR Methods (0.5 ms bins, 7 ms SD Gaussian, 99.9999th Poisson percentile, two
# consecutive bins within +1.5 to +4 ms); the Methods are followed and the code is a variant. Its
# transmission probability is (CCG minus convolution predictor) divided by the presynaptic spike count.
#
# Data the paper used: 19 male mice (3 Ai35, 5 PV-Cre::Ai32, 9 VGAT-Cre::Ai32, 1 CaMKII-Cre::Ai35,
# 1 CaMKII-Cre::Ai32), each with a single-shank 64-site linear silicon probe (Cambridge NeuroTech H3,
# 20 um spacing) in V1, recorded in the home cage during sleep and free behaviour, wide band at 20 kHz,
# LFP downsampled to 1.25 kHz. One session per mouse was used for unit clustering (1,472 units, Kilosort
# then Phy). Brain states (waking, non-REM, REM) were scored with SleepScoreMaster and checked by hand;
# UP and DOWN states of non-REM were detected from high gamma power (100-400 Hz) and delta (0.5-8 Hz).
# Light flashes (520 nm, 500 pulses at 0.5 Hz, 400 ms in the Methods, 100 ms in the Results) were given
# in 13 mice for visual evoked responses; blue light pulses (450 nm, 10 ms, 500 at each of three
# intensities, 1 Hz) tagged PV and VGAT neurons. Lesions for histology were made in 4 mice. The dandiset
# (title as the paper, 19 NWB files, 19 subjects) lists LFP, Units and ElectrodeGroup as its measured
# variables. Whether it holds state intervals, UP and DOWN events, light pulse times or opto tags is the
# author's to find.
#
# Layer groups used throughout. The eight K-means clusters of Figure 5C are numbered 1 to 8 from the
# surface (Figure 7 legend, "Neuron groups 1-8 are as in Figure 5C") and labelled L2, L3, L4, L5?, L5a,
# L5b, L6s, L6d (Figure 5C axis). Layer 2/3 is clusters 1 and 2, layer 4 cluster 3, layer 5 clusters 4,
# 5 and 6 (Figure S8B legend, "clusters 4, 5 and 5 (layer 5)", read as 4, 5 and 6), layer 6 clusters 7
# and 8 (Results, "The bottom two clusters (black and gray) were designated as layer 6 neurons").
# Claims on layer groups depend on fig5b-eight-clusters.
#
# Unit classes (STAR Methods, Classification of units based on spike waveforms). Positive waveform units
# and putative fiber units (kurtosis beyond 5 SD) are set aside; of the remaining negative waveform units,
# trough-to-peak latency above 0.55 ms is a putative E cell and at most 0.55 ms a putative I cell.
#
# Monosynaptic connections (STAR Methods, Detection of monosynaptic functional connectiveties). CCGs in
# 0.5 ms bins, convolved with a Gaussian of 7 ms SD as baseline predictor; a bin is significant above the
# 99.9999th percentile of the Poisson distribution at the predicted rate (below the 0.0001th for
# troughs, the symmetric reading for "negative deviations"); a connection when at least two consecutive
# bins within +1.5 to +4 ms pass. Open details, each named in the claims that use them: whether the
# Gaussian kernel is hollowed (Methods silent; buzcode bz_cch_conv hollows 0.6 of the centre by default),
# the CCG half width (a standard 50 ms is used; it does not change the bins tested), and whether
# connections are detected over the whole session or within each state (whole session is read here, as
# the Results compare the same connections across states).
