- id: fig1f-sink-b-deeper
  statement: The layer 3/4 border sink of the DOWN-UP transition of non-REM slow oscillations (landmark b)
    lies slightly but significantly deeper than the early light-evoked sink (b') in the same mice, by 39 ±
    49 um.
  source: Results, Anchoring Mesoscopic Patterns to Physiological Landmarks, paragraph 2; Figure 1F
  quote: Sink b, associated with the “UP” state of slow oscillation during non-REM sleep, was slightly but
    significantly deeper than the light-evoked sink b′ in the layer 3/4 border (39 ± 49 μm
  statistics:
  - test: signed rank test
    p: 0.05
    p_relation: "<"
    n: 13 mice
  expected:
  - quantity: depth of sink b below sink b' (mean over mice)
    value: 39
    tolerance: 49
    unit: um
  criterion: Per mouse with light stimulation, the average CSD of DOWN-UP transitions (onsets from the UP
    and DOWN detection of the STAR Methods, as in buzcode DetectSlowWaves) and of light onsets, both as
    the second spatial difference of the LFP along the 64 sites (Figure 1D, 1E). The paper does not fix the
    time window or how a sink's depth is read from the map; the readings are the depth of the most
    negative CSD near the layer 3/4 border within (a) 0 to 100 ms after onset (the 100 ms pulse of the
    Results) and (b) 0 to 50 ms after onset (the early sink). Reproduced when, under a reading, b is deeper
    than b' with a two-sided Wilcoxon signed-rank p < 0.05 and the mean difference is within tolerance
    (the paper's SD). CSD spatial smoothing is not given; none is applied (standard choice; it shifts a
    sink by less than a site).
  data: dataset
