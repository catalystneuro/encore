- id: fig2b-six-coherence-clusters
  statement: Clustering the 64 sites by their pairwise gamma (30-100 Hz) coherence with a gradient-descent
    algorithm gives six clusters whose five boundaries are consistent across mice in normalized depth.
  source: Results, Anchoring Mesoscopic Patterns to Physiological Landmarks, paragraph 3; Figures 2A, 2B
  quote: the recording sites were clustered on the basis of their resulting cross-coherence matrix,
    resulting in six clusters whose five boundaries were consistent across animals when projected into
    normalized depth coordinates
  statistics:
  - test: signed rank test for cluster boundaries across animals
    p: 0.05
    p_relation: ">"
    n: 19 mice
  criterion: Coherence 30-100 Hz between all site pairs during waking (Figure 2A), clustered by the
    energy-gap rule of the STAR Methods (Gamma coherence and gradient descent clustering), from random
    starts, repeated (the paper says several times; 20 repeats is a standard choice) keeping the lowest
    energy. The paper does not say how the number of clusters reaches six (the algorithm merges to a local
    minimum). Readings are (a) the number of clusters at convergence, and (b) six clusters imposed. The
    boundary consistency test is unclear in what it compares; readings are (a) each boundary's normalized
    depth against the matching gamma IC boundary in the same mouse, and (b) each mouse's boundary depths
    against the across-mouse median. Reproduced when, under some reading, six clusters result in every mouse
    and no boundary differs at p < 0.05 by the signed-rank test.
  depends_on:
  - fig1g-landmark-distances-consistent
  data: dataset
