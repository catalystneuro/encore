- id: fig1c-slower-in-dz-post-run
  statement: In the air puff direction rats slow down before the air puff location in run and
    post-run, while in pre-run speed rises smoothly along the track, so that speed in the current
    danger zone is lower in post-run than in pre-run.
  source: Figure 1c; Results, Rats learn the daily location, paragraph 2
  quote: A similar speed change was maintained during post-run, whereas speed smoothly increased
    throughout the track during pre-run (Fig. 1c). This was quantitatively reflected by the
    significantly slower speed in the current danger zone in post-run compared to pre-run
  criterion: Air-puff-centred speed curves as in VelocityMaps.m and VelocityMaps_All.m, which the
    Methods describe only as normalized and aligned to the air puff location; speed with 2-sample
    smoothing, mapped in 50 bins of the normalized track for air puff laps in each epoch, centred on
    the bin of the air puff, flipped so the air puff is approached from the left; danger zone value
    the mean of the 7 bins up to the air puff; Wilcoxon rank-sum test of pre-run against post-run
    over sessions, as the code does. Reproduced when post-run is lower at p < 0.05.
- id: figs1c-habituation
  statement: The aversive effect of the air puff gradually diminishes with training days.
  source: Supplementary Figure 1c; Results, Rats learn the daily location, paragraph 2
  quote: The aversive valence of the air puff gradually diminished with training days
  criterion: Habituation index per session as the number of laps divided by the time spent on the
    track, x 100 (Online Methods, Analysis). Which laps are counted is open; the Methods say all
    back-and-forth laps in the run, the legend of Supplementary Figure 1c says air puff laps, and
    Performance.m counts left-to-right laps in the run. The paper reports no test. The readings for
    the test, run with each lap count, are (a) a Spearman correlation of the index with training
    day in each rat and (b) the same over all sessions pooled. Reproduced when, under one lap count,
    the index rises with training day (rho > 0, p < 0.05) in reading (b) and rho > 0 in at least 3
    of 4 rats in reading (a).
- id: airpuff-location-no-bias
  statement: The location of the air puff on the track does not correlate with the speed in the
    current danger zone in pre-run, run or post-run.
  source: Results, Rats learn the daily location, paragraph 2
  quote: The location of the air puff on the track did not correlate with the speed in the current
    danger zone in pre-run, training or post-run
  criterion: A claim of absence. The paper names no test; its code (AirpuffPositionDistribution.m and
    _Plot.m) uses a Pearson correlation over sessions between the air puff position normalized to
    the track (flipped for right-to-left sessions) and the current danger zone speed, per epoch.
    Reproduced when none of the three correlations has p < 0.05; not reproduced when any does. The r
    of each is reported.
