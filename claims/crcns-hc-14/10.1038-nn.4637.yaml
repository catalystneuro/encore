    and 2,514 per rat), of which 2,038 in BLA, 782 in the central nuclei, 1,560 in piriform cortex
    and 1,210 in hippocampus.
  source: Results, BLA recordings and sleep physiology, paragraph 1
  quote: Over the course of a total of 61 sessions, we recorded 7,390 well-isolated units (rat 1,
    2,444; rat 2, 1,294; rat ... 3, 1,138; rat 4, 2,514). On the basis of histological reconstruction
    of probe placement and probe movement record, 2,038 of these were in the BLA, 782 in the central
    nuclei, 1,560 in the piriform cortex and 1,210 in the hippocampus
  expected:
  - quantity: sessions
    value: 61
    tolerance: 6.1
  - quantity: well-isolated units, all rats
    value: 7390
    tolerance: 739
  - quantity: units in BLA
    value: 2038
    tolerance: 203.8
  - quantity: units in central nuclei
    value: 782
    tolerance: 78.2
  - quantity: units in piriform cortex
    value: 1560
    tolerance: 156
  - quantity: units in hippocampus
    value: 1210
    tolerance: 121
  criterion: Units are the sorted clusters of each session (noise and multi-unit clusters 0 and 1
    left out, as in StatesFiringRates.m), assigned to structures by shank and day from the
    histological maps under readings B1 and B2 of the opening comment. A unit recorded on several
    days counts once per session, as the paper's probes moved daily. Reproduced when all values are
    within tolerance under one reading.
- id: fig1b-dz-speed-anova
  statement: Speed in the danger zone depends on the epoch (pre-run, run, post-run) and on the zone
    (current against previous day's), with a significant interaction, in a two-way repeated measures
    ANOVA over 55 sessions in 4 rats.
  source: Figure 1b legend, left
  quote: speed in the current and previous DZ across animals and sessions during the three run
    epochs (two-way repeated measures ANOVA; n = 55 sessions in 4 animals; significant session effect
  statistics:
  - about: epoch effect (pre-run, run, post-run)
    test: two-way repeated measures ANOVA
    statistic: F = 41.51, d.f. = 2
    p: 7.48e-14
    n: 55 sessions in 4 rats
  - about: zone effect (current against previous)
    test: two-way repeated measures ANOVA
    statistic: F = 11.81, d.f. = 1
    p: 0.0012
    n: 55 sessions in 4 rats
  - about: interaction
    test: two-way repeated measures ANOVA
    statistic: F = 30.53, d.f. = 2
    p: 4.46e-11
    n: 55 sessions in 4 rats
  criterion: Danger zone speed as in the opening comment. Two-way repeated measures ANOVA with
    session as the repeated unit, factors epoch and zone, on sessions with all six speeds defined
    (BehavioralMeasures_Stats.m). Reproduced when the epoch effect, the zone effect and the
    interaction each have p < 0.05; partially reproduced when the interaction does and one main
    effect does not.
- id: fig1b-dz-speed-posthoc
  statement: In pre-run rats run slower in the previous day's danger zone than in the current one, in
    run and post-run slower in the current danger zone than in the previous one, and the speed in the
    current danger zone is lower in post-run than in pre-run.
  source: Figure 1b legend, left; Results, Rats learn the daily location, paragraph 2
  quote: Post hoc paired t-tests showed significant differences between previous and current DZ
    speed for pre-run, run and post-run (P = 0.0011, t(52) = 3.45; P = 9.70 × 10−9, t(51) = −6.84; P
    = 0.00307, t(51) = −3.10), as well as for the current DZ between pre-run and post-run
  statistics:
  - about: current against previous zone, pre-run
    test: paired t-test
    statistic: t(52) = 3.45
    p: 0.0011
    corrected: Bonferroni
  - about: current against previous zone, run
    test: paired t-test
    statistic: t(51) = -6.84
    p: 9.7e-09
    corrected: Bonferroni
  - about: current against previous zone, post-run
    test: paired t-test
    statistic: t(51) = -3.10
    p: 0.00307
    corrected: Bonferroni
  - about: current zone, pre-run against post-run
    test: paired t-test
    statistic: t(53) = 5.47
    p: 1.21e-06
    corrected: Bonferroni
  criterion: Danger zone speed as in the opening comment; paired t-tests over sessions with both
    values defined (BehavioralMeasures_Stats.m). The paper prints the uncorrected p and marks
    significance after Bonferroni correction (Online Methods, Statistical analysis); four tests, so
    the level is 0.05/4. Reproduced when all four tests are significant at that level with the
    directions in the statement (current faster than previous in pre-run, slower in run and
    post-run; current slower in post-run than in pre-run); partially reproduced when three are.
- id: fig1b-speed-ratio
  statement: The speed ratio (previous minus current over previous plus current danger zone speed)
    reverses between pre-run and post-run, with a significant epoch effect and every pair of epochs
    differing.
  source: Figure 1b legend, right; Results, Rats learn the daily location, paragraph 2
  quote: Therefore, the systematic reversal in the speed ratio (previous/current danger zone) between
    pre- and ... post-run indicates learning of the new air puff location
  statistics:
  - about: epoch effect
    test: one-way repeated measure ANOVA
    statistic: F = 40.48, d.f. = 2
    p: 1.31e-13
  - about: pre-run against run
    test: post hoc t-test
    statistic: t(51) = -8.49
    p: 2.5e-11
    corrected: Bonferroni
  - about: pre-run against post-run
    test: post hoc t-test
    statistic: t(51) = -5.08
    p: 5.3e-06
    corrected: Bonferroni
  - about: run against post-run
    test: post hoc t-test
    statistic: t(50) = 4.43
    p: 5.1e-05
    corrected: Bonferroni
  criterion: Ratio (pDZ - cDZ)/(pDZ + cDZ) per session and epoch (Online Methods, Analysis), from
    the danger zone speeds of the opening comment. One-way repeated measures ANOVA over sessions
    with all three ratios defined, and paired t-tests at 0.05/3. Reproduced when the ANOVA has p <
    0.05, the median ratio is below zero in pre-run and above zero in post-run, and the three paired
    tests are significant with pre-run below run, pre-run below post-run and run above post-run;
    partially reproduced when the ANOVA and the sign reversal hold but not all three paired tests.
