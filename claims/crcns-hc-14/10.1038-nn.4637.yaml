- id: fig7b-strong-pairs-correlated-changes
  statement: For the 2.5% most strongly contributing hippocampus-BLA pairs, the change in correlation
    from pre-run to post-run is positively correlated with the change from pre-NREM to post-NREM.
  source: Figure 7b legend; Results, NREM contributes to reinstatement, paragraph 1
  quote: We found that for strongly contributing, but not for weakly contributing, pairs the increase
    between pre-run and post-run coactivity was significantly correlated with the increase in
    coactivity between pre-NREM and post-NREM
  statistics:
  - test: Pearson correlation
    statistic: r = 0.27
    p: 2.11e-16
    n: 866 pairs in 3 rats
  criterion: Contribution per pair as in fig5b-top-contributors-gain-increase, the top 2.5% of the
    distribution of 37,660 pyramidal pairs. Post minus pre correlation for NREM as in the opening
    comment, and for the test runs from the post-run and pre-run test epochs. The script for the
    test-run correlations is not in the package, so their bins and intervals are open; the readings
    are (a) 50-ms bins over the whole test epoch, as for the run in EV, and (b) 50-ms bins over the
    laps of the test epoch. Pairs undefined in either test epoch are dropped (the paper's 866 is
    below 2.5% of 37,660). Pearson correlation. Reproduced when, under one reading, r > 0 at p <
    0.05.
  depends_on:
  - fig5b-top-contributors-gain-increase
- id: fig7b-weak-pairs-not-correlated
  statement: For the 2.5% least contributing pairs, the run and NREM correlation changes are not
    correlated.
  source: Figure 7b legend
  quote: but not for weakly contributing pairs
  statistics:
  - test: Pearson correlation
    statistic: r = 0.03
    p: 0.305
    n: 845 pairs in 3 rats
  criterion: A claim of absence, judged on the paper's test (Pearson correlation, p < 0.05), as
    fig7b-strong-pairs-correlated-changes for the lowest 2.5% of contributions. Judged under each
    test-run reading; reproduced when p >= 0.05 under the reading that reproduces
    fig7b-strong-pairs-correlated-changes (or under all readings when none does); not reproduced
    otherwise. r is reported.
  depends_on:
  - fig7b-strong-pairs-correlated-changes
- id: fig7c-quartiles
  statement: The relation holds for the most strongly contributing quartile of pairs (r = 0.13) and
    not for the least contributing quartile (r = 0.013).
  source: Figure 7c legend; Results, NREM contributes to reinstatement, paragraph 1; Supplementary
    Figure 7b
  quote: This result was maintained when the most strongly and the most weakly contributing quartiles
    (instead of 2.5th percentiles) of the distribution were compared
  statistics:
  - about: highest contribution quartile
    test: Pearson correlation
    statistic: r = 0.13
    p: 1.07e-32
    n: 9,415 pairs in 3 rats
  - about: lowest contribution quartile
    test: Pearson correlation
    statistic: r = 0.013
    p: 0.22
    n: 9,415 pairs in 3 rats
  criterion: As fig7b-strong-pairs-correlated-changes with quartiles of the contribution
    distribution, under the same test-run readings. Reproduced when, under one reading, the top
    quartile gives r > 0 at p < 0.05 and the bottom quartile gives p >= 0.05 (the absence part
    judged on the paper's test); partially reproduced when only the top quartile part holds. The
    second and third quartiles (Supplementary Figure 7b) and the middle 95% (Supplementary Figure
    7c) are reported.
  depends_on:
  - fig7b-strong-pairs-correlated-changes
