- id: fig2c-skewed-rates
  statement: The firing rates of BLA pyramidal cells follow a skewed distribution in NREM sleep, REM
    sleep and wakefulness.
  source: Figure 2c; Results, BLA recordings and sleep physiology, paragraph 1
  quote: The firing rates of pyramidal cells followed a skewed distribution during sleep (NREM and
    REM) and wakefulness
  criterion: Rates per state as in fig2c-bla-pyr-higher-in-sleep, monosynaptically identified BLA
    pyramidal cells as in the figure. The paper gives no measure of skew and plots the rates on a
