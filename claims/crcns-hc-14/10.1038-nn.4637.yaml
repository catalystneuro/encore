# Claims for Girardeau, Inema & Buzsaki (2017), Nature Neuroscience 20:1634-1642, "Reactivations of
# emotional memory in the hippocampus-amygdala system during sleep", on CRCNS data set hc-14
# (doi:10.6080/K0MS3QXD).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-08,
# protocol as stated in docs/protocol.md (Reader), version pilot-13.
#
# Text read: the version of record (PyMuPDF text of the journal PDF under paper/): main text,
# figure legends, Online Methods and the Life Sciences Reporting Summary, with the supplement
# (Supplementary Figures 1 to 11 and Supplementary Tables 1 and 2). Supplementary Table 1 (cells per
# structure) is an image whose numbers the text does not carry, and the PDF pages could not be
# rendered here, so it was not read; the totals per structure are taken from the Results. Values
# printed as powers of ten ("7.48 x 10-14") are recorded from the text; the quote checker cannot
# find them in that form. The data set's description (paper/hc-14.data-description.txt) was read
# only to know what the data set is meant to hold; no claim comes from it.
#
# Code read: github.com/buzsakilab/papers, folder GGirardeau-BLAHpcInteractions-Package, commit
# cdcec89f8d1f5cf11f407f82827f9af44405c5b7 (master, 2017-07-28), the repository the Online Methods
# link. MATLAB scripts in folders Behavior, CellClassification, Physiology, Reactivations and
# Miscellaneous, calling FMAToolbox. Not in the package: structures.mat (which shanks are BLA,
# CeN, Pir), poissonTest.m, the repeated-measures ANOVA functions, the script that computes the
# pre-run and post-run test correlations of Figure 7, the script that builds the air puff and safe
# firing curves, and any test of BLA firing rates in safe against air puff runs. Where the code
# settles a detail the Methods leave open, the criteria below follow it and say so.
#
# Data the paper used. Four male Long-Evans rats, 3 months, 300 g. Two 8-shank silicon probes over
# the left and right amygdala, moved down 140 um after each daily session, and one 4-shank probe in
# dorsal CA1 (left or right); 160 channels, 20 kHz, LFP at 1,250 Hz. The hippocampal probe failed in
# one rat, so all hippocampus-amygdala analyses use 3 rats. 61 sessions in total, one a day; 7,390
# units (rat 1, 2,444; rat 2, 1,294; rat 3, 1,138; rat 4, 2,514), of which 2,038 in BLA, 782 in the
# central nuclei (CeN), 1,560 in piriform cortex (Pir) and 1,210 in hippocampus. Behavior is
# analysed for 55 sessions in 4 rats, BLA-hippocampus physiology for 29 sessions in 3 rats. Each
# session is, in order, a pre-run test on the linear track without air puff, pre-sleep in the home
# cage, a run (training) with an air puff at one location in one running direction, post-sleep, and
# a post-run test without air puff. The air puff location and direction change daily. Measured
# variables: spike times of sorted units with their shank, LFP, head position from a red LED (ceiling
# camera), air puff and reward times, detected ripples, sleep states scored by hand, histological
# maps of the structure under each shank and day.
#
# The data set, by its description, holds the 4 rats in folders by rat and session: LFP (1,250 Hz),
# KlustaKwik clu and spk files, videos and position (.whl), events for subsessions (cat.evt),
# ripples (rip.evt), air puffs (puf.evt) and rewards, and StructureMapping.ods with the structure
# of each shank and day. Whether it holds the sleep states, cell types, ripple-modulation labels or
# lap classifications is the author's to find.
#
# Methods shared by several claims, from the Online Methods unless said otherwise.
# Epochs. The five subsessions in the order above; in the code, pre-run, run and post-run are
# rows 1, 2 and 3 of the run intervals, and the run is the whole training epoch, with no lap or
# speed filter (ExplainedVariance_Ultimate.m, ReplayInTime.m).
# Structures. Units are assigned by shank and day from the histological maps. Which amygdala labels
# make "BLA" is open: the code reads a "BLA" shank list not in the package, while the cell type
# clustering groups BLA, BLV, LaDL, BMA and BMP (Supplementary Figure 3b; CellClassifkmeans.m).
# The readings are (B1) shanks labelled BLA only and (B2) the basolateral group BLA, BLV, LaDL, BMA
# and BMP; the BLA total of 2,038 units (Results) and the 2,038 BLA cells of Figure 2c tell which
# the paper used, and the author runs both when the counts do not settle it. CeN is the CeCM label
# in the code, Pir the Pir label.
# Cell types. Units with a significant monosynaptic excitatory or inhibitory connection in the
# cross-correlogram (1 to 4 ms, p = 0.001; Supplementary Figure 3a) are pyramidal cells or
# interneurons; the others are split by k-means (2 clusters) on trough-to-peak time and the inverse
# of the peak frequency of the mean waveform, separately for amygdala, olfactory areas and
# hippocampus, the larger cluster being pyramidal (Online Methods, Preprocessing; CellClassifkmeans.m,
# FinalType.m). "Pyramidal" below means this final type unless a claim says monosynaptically
# identified.
# Sleep states. NREM and REM were scored by hand from spectrograms and an accelerometer (Online
# Methods, Preprocessing). The authors' scoring is used when the data set holds it; otherwise the
# scoring cannot be repeated as the paper did it, and the author states the substitute.
# Ripples. Band-pass about 100-200 Hz, squared and normalized; events starting at 1 s.d., peaking
# above 4 s.d., lasting 20 to 130 ms; events also on a non-hippocampal control channel removed.
# Ripple modulation. Spikes from ripple start to ripple end against the NREM baseline that excludes
# each ripple and 100 ms on each side, over all NREM of the session, by a Poisson test (Online
# Methods). The Methods give P < 0.001; the code applies it two-sided, a cell being upmodulated when
# the increase p is below 0.0005 and downmodulated when the decrease p is below 0.0005
# (PoissonRippleModPercent.m, ExplainedVariance_Ultimate.m). This is followed; 0.001 for each
# direction is a variant.
# Explained variance. Per session, Pearson correlations of 50-ms binned spike counts for every
# hippocampus-structure pair, separately over all NREM (or REM) bins of the whole pre-sleep, the
# whole run, and all NREM (or REM) bins of the whole post-sleep. EV is the squared partial
# correlation ((r_run,post - r_run,pre x r_pre,post) / sqrt((1 - r_run,pre^2)(1 - r_pre,post^2)))^2
# of the three pair matrices, REV the same with pre and post exchanged; pairs undefined in any
# epoch are dropped (ExplainedVariance_Ultimate.m). Sessions need at least 6 cells of the type used
# in each structure, and for REM more than 180 s of REM in pre-sleep and in post-sleep
# (ExplainedVarianceMean_Ultimate.m); the Methods also name 1 shank, which the code does not check.
# The test of reactivation is a two-sided Wilcoxon signed-rank test of EV against REV over sessions.
# Reactivation strength. Pyramidal cells; 50-ms bins z-scored per cell within each epoch; template
# C = Z_hpc' Z_bla / nBins over the run bins (whole run, air puff laps or safe laps); R(t) =
# z_hpc(t) C z_bla(t)'; R z-scored over all pre-NREM bins and over all post-NREM bins; mean R in
# +-2 s around each ripple peak of pre-NREM or post-NREM; per session, the mean over +-250 ms;
# sessions with at least 6 pyramidal cells in each structure (Online Methods; ReplayInTime.m,
# ReplayInTime_LapTypes.m, ReplayInTime_All.m). Air puff laps are track crossings in the day's air
# puff direction during the run, safe laps those in the other direction (LapType.m); a lap is a
# crossing of a 150-cm segment of the track with net displacement over 10 cm (ClassifyLaps.m).
# Danger zone speed. Positions in cm (0.43 cm per pixel), speed from FMAToolbox LinearVelocity with
# 5-sample smoothing; the danger zone is the 20 cm before the air puff location on the approach in
# the air puff direction, for the current day and the previous day (with the previous day's
# direction); per session and epoch, the mean speed over all samples in the zone
# (BehavioralMeasures.m).
