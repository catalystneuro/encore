- id: figs5-single-coefficient
  statement: The selectivity of most neurons can be attributed to one of the three coefficients,
    especially early in the trial, so most neurons mainly encode one behavioural variable at a
    time.
  source: Results, Analysis of Behavior-Related Activity, paragraph 2; Figure S5 (not read)
  quote: The selectivity of most neurons can be attributed to one of the three coefficients,
    especially during the early part of the trial (Figure S5)
  criterion: Figure S5 was not read; written from the main text. Per time bin, among neurons
    trial-type selective at that bin (convention M), the fraction purely selective (one factor)
    and the fraction mixed. Reproduced when the purely selective fraction exceeds one half in
    every bin from trial start to the go cue; partially reproduced when it does in most of them
    (more than half of the bins) but not all. The fraction after the go cue is reported. This
    measure is fixed here, as the text gives none.
- id: fig4a-lick-direction-epochs
  statement: Different neurons coded for lick direction in different epochs, some during the sample
    and delay epochs before licking, some during the response epoch, and some after the mouse
    stopped consuming water.
  source: Results, Analysis of Behavior-Related Activity, paragraph 3; Figure 4A
  quote: Some neurons were selective during the sample and delay epochs, long before onset of
    licking ... Other neurons became selective during the response epoch ... Some neurons even
    represented licking direction after the animal stopped consuming water
  criterion: Pure lick-direction selectivity per bin (convention M). Reproduced when there are
    neurons purely lick-direction selective in the delay epoch, and other neurons first
    lick-direction selective after the go cue, and neurons lick-direction selective more than 2 s
    after the go cue. The paper gives no count or time for "stopped consuming water"; the lick
    times give the last lick of each trial, and lick-direction selectivity after the median last
    lick is reported as the reading of it. Counts of each group are reported.
- id: fig4b-object-location-memory
  statement: Many object-location-selective neurons were selective during the sample epoch, and a
    subset coded object location mainly in the delay epoch after the pole was removed, some up to
    the end of the delay.
  source: Results, Analysis of Behavior-Related Activity, paragraph 4; Figure 4B
  quote: Many of these neurons were selective during the sample epoch when mice explored the object
    ... However, a subset of neurons coded object location primarily during the delay epoch, after
    the pole was removed ... Some of these neurons carried information about object location up to
    the end of the delay epoch
  criterion: Pure object-location selectivity per bin (convention M). Reproduced when (a) neurons
    are object-location selective in the sample epoch; (b) some neurons have most of their
    object-location-selective bins in the delay epoch; (c) some neurons are object-location
    selective in the last 0.5 s before the go cue. Counts of each group are reported.
- id: fig4c-outcome-after-lick
  statement: Outcome-selective neurons typically became selective after the answer lick; some
    preferred correct and others error trials, and some kept the outcome long after the trial
    ended.
  source: Results, Analysis of Behavior-Related Activity, paragraph 5; Figure 4C
  quote: These neurons typically became selective after the answer lick. A subset of the
    outcome-selective neurons responded preferentially during correct trials ... whereas others
    responded strongly during error trials
  criterion: Pure outcome selectivity per bin (convention M). Reproduced when most outcome-selective
    neurons (more than half) have their first outcome-selective bin after the go cue, and both signs
    of gamma occur among them. The latest outcome-selective bins in the extracted window (up to 5 s
    after the go cue) are reported.
- id: fig5-mixed-response-epoch
  statement: Most neurons with mixed selectivity were seen during the response epoch; a subset
    responded in only one trial type and a few switched the variable they coded during the trial.
  source: Results, Analysis of Behavior-Related Activity, paragraph 6; Figure 5
  quote: Most of these neurons with ‘‘mixed’’ selectivity were observed during the response epoch
  criterion: Mixed selectivity per bin (convention M). Reproduced when more than half of the
    neuron-bins of mixed selectivity fall after the go cue. Neurons purely selective for object
    location early and for outcome or lick direction later are counted and reported.
- id: fig6-object-location-mm
  statement: During the sample and early delay epochs, object location was represented mainly in MM.
  source: Results, Spatial Map of Behavior-Related Activity, paragraph 1; Figure 6B to 6D, 6H
  quote: During the sample and the early part of the delay epoch, representation of object location
    was prominent, mainly in MM
  depends_on:
  - neuron-counts
  criterion: Fraction of neurons purely object-location selective per time bin, in ALM and in MM
    (as Figure 6H and 6I), area by the reading that matched neuron-counts. Reproduced when the MM
    fraction exceeds the ALM fraction in most bins (more than half) from trial start to 2.2 s
    (the sample epoch and the first second of the delay; "early part" is not defined, and a
    window ending 1.5 s, the time of Figure 6D, is also read).
- id: fig6-lick-direction-deep-alm-first
  statement: Neurons selective for lick direction appeared first in the deep layers of ALM, early
    in the delay epoch.
  source: Results, Spatial Map of Behavior-Related Activity, paragraph 1; Figure 6D, 6E and 6H
  quote: Neurons selective for lick direction appeared first in the deep layers of ALM, early in the
    delay epoch
  depends_on:
  - neuron-counts
  criterion: Groups are ALM and MM, each split by depth (convention D, readings (D1) superficial
    against deep at 350 um; (D2) the three bins of Figure 6, 100-250, 250-400 and 400-620 um, with
    the deepest bin as deep). For each group, the fraction of neurons purely lick-direction selective
    per bin (Figure 6H). The text defines no onset for Figure 6; readings (F1) onset as convention O
    applied to the fraction; (F2) onset as convention O applied to mean |beta| (the measure used for
    the onset in Figure 8D), each with baselines O1 and O2. Reproduced when, under each reading,
    deep ALM has the earliest onset of all groups and that onset is in the delay epoch (1.2 to 4.2 s
    after trial start).
- id: fig6-lick-direction-spread
  statement: Lick-direction selectivity, in number of neurons and strength, kept increasing and
    spread across ALM layers and to a minor extent into MM, peaking after the go cue.
  source: Results, Spatial Map of Behavior-Related Activity, paragraph 1; Figures 6F to 6I and S7
    (not read)
  quote: Lickdirection selectivity, including number of neurons and the strength of coding,
    continued to increase and spread across ALM layers and to a minor extent into MM (Figure S7),
    reaching a maximum after the go cue
  depends_on:
  - neuron-counts
  criterion: Figure S7 was not read. Fraction of neurons purely lick-direction selective and mean
    |beta| (non-significant set to 0) per bin, in ALM and MM, each by depth (convention D).
    Reproduced when (a) in ALM both measures reach their maximum after the go cue; (b) the
    superficial ALM fraction at its maximum is above its value in the first half of the delay;
    (c) the MM fraction at its maximum is above its value in the delay epoch and below the ALM
    maximum.
- id: fig6-outcome-response-uniform
  statement: Outcome-selective neurons were seen only during the response epoch, scattered roughly
    uniformly through ALM and MM; mixed neurons were also seen mainly in the response epoch in both
    areas.
  source: Results, Spatial Map of Behavior-Related Activity, paragraph 2; Figure 6G to 6I
  quote: Outcome-selective neurons, which were observed only during the response epoch, were
    scattered approximately uniformly throughout ALM and MM
  depends_on:
  - neuron-counts
  criterion: Fraction of neurons purely outcome selective per bin in ALM and in MM. The paper gives
    no test; this measure is fixed here. Reproduced when (a) in both areas the largest fraction in
    any bin before the go cue is below one third of the largest fraction after it; and (b) the
    ALM and MM fractions averaged over the response epoch (go cue to 2.5 s after) differ by less
    than a factor of 1.5. The same is reported for mixed neurons.
- id: fig6h-preparatory-alm-object-mm
  statement: Throughout the trial preparatory activity, as the fraction of lick-direction-selective
    neurons or the average coding coefficient, was most pronounced in ALM, while object location
    selectivity was mainly limited to MM.
  source: Results, Spatial Map of Behavior-Related Activity, paragraph 2; Figure 6H, 6I, S6 and S8
    (not read)
  quote: Throughout the trial, preparatory activity, quantified either as fraction of lick
    direction-selective neuron (Figures 6H and 6I) or as average coding coefficient (Figures S6 and
    S8), was most pronounced in ALM, whereas object location related selectivity was mainly limited
    to MM
  depends_on:
  - neuron-counts
  criterion: Per bin, the fraction of purely lick-direction-selective neurons and mean |beta|
    (non-significant set to 0, convention M), and the same for object location and |alpha|, in ALM
    and MM. Reproduced when, in most bins (more than half) of the delay epoch, ALM is above MM on
    both lick-direction measures, and in most bins from trial start to the go cue MM is above ALM
    on both object-location measures; partially reproduced when only one of the two holds.
- id: figs9-photoinhibition-alm-mm
  statement: Optogenetic inactivation during the delay epoch affected lick direction more in ALM
    than in MM.
  source: Results, Spatial Map of Behavior-Related Activity, paragraph 2; Figure S9 (not read);
    Discussion, paragraph 2
  quote: Consistently, the effects of optogenetic inactivation during the delay epoch on lick
    direction were greater in ALM compared to MM
  criterion: Figure S9 and its methods were not read; the text gives only that VGAT-ChR2-EYFP mice
    were used and, from Guo et al. (2014b), 1.5 mW average power. Measure, per site, the change in
    the fraction of lick-right (contralateral) responses under photoinhibition against control,
    on lick-right and lick-left trials. Reproduced when the bias is larger for ALM (2.5 mm
    anterior, 1.5 mm lateral) than for MM (1.5 mm anterior, 1.0 mm lateral). The test, the sites
    and the number of mice are not in the text read; no statistic can be named.
- id: widefield-mm-to-alm
  statement: In wide-field imaging, activity during the sample and early delay was most pronounced
    in MM, and spread forward and laterally to ALM as the delay progressed; after the response it
    rose across much of motor and somatosensory cortex.
  source: Results, Mapping Neural Activity Using Wide-Field Imaging; Figure 2B to 2D
  quote: During the sample and early parts of the delay epoch, activity was most pronounced in MM
    ... As the delay epoch progressed, activity spread forward and lateral to ALM ... Behavior-related
    activity therefore shifts from MM to ALM before the behavioral response
  criterion: Per mouse (5), dF/F0 per pixel with F0 the mean of the six frames before trial start,
    averaged over trials of each correct type (Methods, Wide field calcium imaging). Peak location
    (pixel of maximum dF/F0, averaged over CR and CL) in the sample epoch and in the last second of
    the delay, in stereotactic coordinates. Reproduced when the sample-epoch peak is nearer the MM
    centre and the late-delay peak nearer the ALM centre, in the mean over mice and in at least 3 of
    5 mice. The paper's measure is the image itself; this measure is fixed here.
- id: widefield-contralateral-bilateral
  statement: Early wide-field activity in MM was contralateral to the whiskers touching the object,
    and the later ALM activity was in both hemispheres.
  source: Results, Mapping Neural Activity Using Wide-Field Imaging; Figure S1 (not read)
  quote: contralateral to the whiskers touching the object (Figure S1) ... across both ALM hemispheres
