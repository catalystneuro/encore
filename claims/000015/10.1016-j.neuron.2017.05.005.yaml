  source: Results, Projection-Specific Coding, paragraph 2; Figure 8D
  quote: The magnitude of lick direction selectivity (jbj) appeared stronger and earlier in PT than
    in IT neurons (delta onset time; time when selectivity rose to >6 SD above baseline = 1.4 ± 0.6 s;
    p < 0.01, bootstrap
  statistics:
  - about: onset of mean |beta|, ALM PT against ALM IT
    test: bootstrap
    p: 0.01
    p_relation: "<"
    n: 719 PT and 2,631 IT neurons from 3 mice (all areas)
  depends_on:
  - fig8c-pt-deep-only
  expected:
    quantity: IT onset minus PT onset of mean |beta|
    value: 1.4
    tolerance: 0.6
    unit: s
  criterion: Mean |beta| (non-significant set to 0) over ALM PT and over ALM IT neurons per bin;
    onset by convention O (baselines O1 and O2). The IT group is open, readings (I1) deep ALM IT,
    the neurons intermingled with PT; (I2) all ALM IT. The bootstrap is open, readings (H1)
    hierarchical over animals, planes and cells (convention B, as for Figure 8D); (H2) over cells.
    The +- is read as the bootstrap SD of the difference, and p as the fraction of resamples in which
    the PT onset is not earlier. Reproduced when, under one combination of readings, the difference
    is within tolerance, p < 0.01, and the PT maximum of mean |beta| exceeds the IT maximum.
- id: ephys-pt-it-onset-not-detected
  statement: The difference in onset of lick direction selectivity between PT and IT neurons was not
    detected in an electrophysiology dataset recorded under similar conditions (45 PT and 27 IT
    cells, Li et al., 2015).
  source: Results, Projection-Specific Coding, paragraph 2; Discussion, paragraph 8
  quote: However, this difference in lick direction selectivity onset was not detected in an
    electrophysiology dataset recorded under similar conditions (Li et al., 2015)
  data: with_inputs
  criterion: The data are those of Li et al. (2015, Nature 519, 51-56), tagged PT and IT units in
    ALM; the paper does not say where they are deposited. A claim of absence with no test named in
    the text; the test of fig8d-pt-earlier-than-it (onset of mean |beta| by convention O, bootstrap
    over units, p < 0.01) is applied to it. Reproduced when that test does not find PT earlier at
    p < 0.01; the onset difference is reported either way.
- id: fig8d-mm-object-location
  statement: MM neurons showed strong object location selectivity in superficial and deep layers and
    in PT and IT cells, PT cells particularly in the early delay; neither PT nor IT neurons in MM
    showed prominent lick direction selectivity before licking.
  source: Results, Projection-Specific Coding, paragraph 3; Figure 8D
  quote: In contrast, MM neurons displayed strong object location selectivity in both superficial and
    deep layers, and in both PT and IT cells. PT neurons in MM also displayed strong object location
    selectivity particularly during the early delay period ... Neither PT nor IT neurons in MM
    displayed prominent lick direction selectivity before licking movement
  depends_on:
  - fig8c-pt-deep-only
  criterion: Mean |alpha| and mean |beta| (non-significant set to 0) per bin for the Figure 8D
    groups of MM (deep PT, deep IT, deep other, superficial IT, superficial other) and of ALM, with
    bootstrap SD (convention B). Reproduced when (a) every MM group has a maximum of mean |alpha| in
    the sample or early delay (trial start to 2.2 s) larger than the ALM deep IT group's; (b) MM PT
    mean |alpha| over the first second of the delay is the largest of the MM groups; (c) before the
    go cue, the MM PT and MM IT maxima of mean |beta| are below half the ALM deep maximum. Partially
    reproduced when (a) holds and (b) or (c) does not. The thresholds are fixed here; the paper
    gives none.
- id: fig8d-mm-posterior-preferring
  statement: MM neurons were more active in posterior trials, when the pole was within reach of the
    whiskers, than in anterior trials.
  source: Discussion, paragraph 4; Figure 8D
  quote: Neurons were more active in posterior trials, when the pole was within reach of the
    whiskers, than in the anterior location, when the pole was out of reach (Figure 8D
  criterion: Mean alpha (signed, non-significant set to 0) of MM neurons per bin over the sample
    epoch, with bootstrap SD (convention B); alpha > 0 is posterior preferring. Reproduced when the
    mean over the sample epoch is above zero by more than 2 bootstrap SD (bound fixed here).
- id: fig8d-error-outnumber-correct
  statement: Overall, neurons preferring error trials outnumbered those preferring correct trials.
  source: Discussion, paragraph 6; Figure 8D
  quote: Overall, neurons preferring error trials outnumbered neurons preferring correct trials
    (Figure 8D
  criterion: Among neurons purely outcome selective at any bin from the go cue to 2.5 s after it,
    those whose gamma at their most significant bin is negative (error preferring) against
    positive. Reproduced when error-preferring neurons are more numerous, by a two-sided binomial
    test at p < 0.05 (test fixed here); the mean signed gamma per bin, which Figure 8D shows, is
    reported as well.
- id: fig8ef-area-explains-variance
  statement: Coding is mainly determined by cortical location; cortical area (ALM against MM) and
    cell depth explain most of the variance of selectivity, more than projection type.
  source: Results, Projection-Specific Coding, paragraph 4; Figure 8E and 8F
  quote: Our results suggest that coding of PT and IT neurons is primarily determined by their
    location in the motor cortex ... Cortical area ... and cell depth ... explained the majority of
    response variability (Figures 8E and 8F
  depends_on:
  - fig8c-pt-deep-only
  criterion: Methods, variance of neuronal selectivity. Groupings area (ALM, MM; k = 2), depth (z <
    350 against z >= 350 um; k = 2) and projection type (PT, IT, other; k = 3). For each grouping and
    coefficient (alpha, beta, gamma, |alpha|, |beta|, |gamma|, non-significant set to 0), SST(t) and
    SSB(t) over neurons; variance explained(t) = SSB/SST (Figure 8E); total variance explained = sum
    over t and the three absolute coefficients of SSB over the same sum of SST, t from 4.6 s before
    to 2.5 s after the go cue (Figure 8F). The neurons are open, readings (N1) the three labelled
    mice for all groupings; (N2) all six mice for area and depth, the three for projection type.
    Reproduced when total variance explained by area and by depth each exceed that by projection
    type, and area is the largest of the three; partially reproduced when area and depth together
    exceed projection type but area is not the largest. Bootstrap SD as convention B.
- id: ephys-selective-counts
