- id: fig7d-ephys-area-distribution
  statement: In the silicon probe recordings, object-location-selective neurons were most frequent in
    MM, lick-direction-selective neurons mainly in ALM, and outcome and mixed neurons numerous in
    both; most object location, lick direction and outcome selectivity fell in the sample,
    delay/response and response epochs.
  source: Results, Comparison with Extracellular Electrophysiology, paragraph 2; Figure 7D
  quote: The majority of object location-, lick direction-, and outcome-selective neurons were
    observed during sample, delay/response, and response epochs, respectively (Figure 7D). Neurons
    selective for object location were observed most frequently in MM; neurons selective for lick
    direction were mainly observed in ALM; neurons selective for outcome and mixed neurons were
    numerous in both ALM and MM
  data: elsewhere
  where: CRCNS doi:10.6080/K0S180F9
  depends_on:
  - ephys-selective-counts
  criterion: Fraction of units purely selective for each factor, and mixed, per 400 ms window
    (100 ms steps), in ALM and MM (Figure 7D). Reproduced when (a) the object-location fraction
    peaks in the sample epoch and the time-averaged fraction is higher in MM than ALM; (b) the
    lick-direction fraction averaged over delay and response is higher in ALM than MM, and its peak
    is in the delay or response epoch; (c) the outcome fraction peaks in the response epoch and is
    above 5% in both areas there; (d) the mixed fraction is above 5% in both areas in the response
    epoch. The 5% level (above the 1% expected by chance at p < 0.01) is fixed here.
- id: fig1c-whisking-similar
  statement: Whisker movements were similar across the four trial types, so neurons coding whisker
    movement were likely classed as non-selective.
  source: Discussion, paragraph 5; Figure 1C
  quote: In our experiments, whisker movements were similar across trial types (Figure 1) and neurons
    encoding whisker movements were likely classified as ‘‘non-selective.’’
  criterion: A claim of absence for which the paper names no test. Whisker angle from the 1 kHz
    video, whisking amplitude per trial averaged over the sample epoch, compared across the four
    trial types by a one-way ANOVA per session at p < 0.05 (test fixed here). Reproduced when the
    test finds no difference in most sessions (more than half); the effect size is reported. Not
    testable if the dataset holds no whisker tracking.
