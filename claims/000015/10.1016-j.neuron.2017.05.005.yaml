- id: fig8d-pt-contra-bias
  statement: During the delay epoch, ALM PT neurons showed a bias toward contralateral (lick right)
    selectivity.
  source: Results, Projection-Specific Coding, paragraphs 1 and 2; Figure 8D
  quote: A contra bias during the delay epoch was ... observed in PT neurons (Figure 8D), consistent
