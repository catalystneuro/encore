- id: fig8d-alm-deep-lick-direction
  statement: In ALM the strongest lick direction selectivity was in the deep layers, where PT and IT
    neurons were intermingled.
  source: Results, Projection-Specific Coding, paragraph 1; Figures 8D and S10 (not read)
  quote: In ALM, the strongest lick direction selectivity was observed in the deep layers (Figures 8D
    and S10), where PT and IT neurons were intermingled
  depends_on:
  - neuron-counts
  criterion: Mean |beta| over neurons (non-significant set to 0) per bin, ALM deep against ALM
