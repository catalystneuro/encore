    value: 6
    tolerance: 0
  - quantity: imaging locations
    value: 12
    tolerance: 0
  - quantity: image planes
    value: 105
    tolerance: 0
  - quantity: planes per location, mean
    value: 8.8
    tolerance: 2.6
  - quantity: trials per plane, mean
    value: 92
    tolerance: 26
  - quantity: percent correct per plane, mean
    value: 73
    tolerance: 9
    unit: percent
  - quantity: planes per session, mean
    value: 3
    tolerance: 1
  criterion: Counts of mice, locations and planes are exact (tolerance 0, as they are counts of
