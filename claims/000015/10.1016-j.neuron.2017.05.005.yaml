- id: fraction-selective-alm-mm
  statement: A large fraction of neurons distinguished between trial types, 23% in MM (1,523 of
    6,594) and 31% in ALM (2,754 of 8,837).
  source: Results, Mapping Activity Using Two-Photon Calcium Imaging, paragraph 3
  quote: the activity of a large proportion of neurons distinguished between trial types in MM (23%,
    1,523/6,594) ... and ALM (31%, 2,754/8,837
  depends_on:
