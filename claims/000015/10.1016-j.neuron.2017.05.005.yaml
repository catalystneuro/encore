# Claims for Chen, Li, Daie & Svoboda (2017) on dandiset 000015.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21, protocol
# as stated in docs/protocol.md (pilot-10), Reader steps 1 to 4.
#
# Text read: the version of record (Neuron 94, 866-879), from a PDF supplied by a person, as
# extracted to paper/10.1016-j.neuron.2017.05.005.txt: main text, figure legends 1 to 8 and the STAR
# Methods (e1 to e4). The PDF pages could not be rendered in this run, so no figure was looked at;
# everything below is read from the text and legends. Not in the text: the Supplemental Information
# (Figures S1 to S10 and one movie). The claims on Figures S1, S4, S5, S7 and S9
# (widefield-contralateral-bilateral, figs4-peak-shift, figs5-single-coefficient,
# fig6-lick-direction-spread, figs9-photoinhibition-alm-mm) are written from the main text alone;
# the main findings rest on Figures 2, 4 to 8 and the Methods, which are in the text.
#
# Code read: none. The paper links no analysis code. It names the data deposit in its Key
# Resources Table as "Imaging and electrophysiology data in NWB format", "Available at CRCNS.ORG",
# 10.6080/K0S180F9. The dandiset's archive title is the paper's title and its description reads
# 'Data from "A Map of Anticipatory Activity in Mouse Motor Cortex" Chen et al. Neuron 2017'; its
# metadata list 6 subjects, cell population imaging and behaviour (PlaneSegmentation,
# BehavioralEvents). The silicon probe recordings (3 mice) are therefore read as being in the CRCNS
# deposit; whether the dandiset holds the wide-field imaging or the photoinhibition behaviour is for
# the author to find.
#
# The data the paper used, as it reports them. Male Thy1-GCaMP6s (GP4.3) mice with a window over
# left motor cortex. Task: a pole presented at a posterior (lick right) or anterior (lick left)
# position during the sample epoch (1.2 s from pole movement onset to retraction onset), a 3 s
# delay epoch, an auditory go cue (3.4 kHz, 0.1 s) at 4.2 s after trial start, then licking one of
# two ports. Four trial types: correct right (CR), correct left (CL), error right (ER), error left
# (EL). Trials with licking during the delay epoch were excluded (13.3% +- 10%). Whisker video at
# 1 kHz; lick times from the lickport.
# Two-photon imaging: 6 mice, 12 locations (1 to 3 per mouse), 105 image planes (8.8 +- 2.6 per
# location, 4 to 12), 600 x 600 um, 512 x 512 pixels, 14 Hz, depths 100 to 600 um, 92 +- 26 trials
# per plane, 3 +- 1 planes per session (range 1 to 6). 15,431 neurons (ALM 8,837, MM 6,594),
# fluorescence with neuropil subtracted (r = 0.7, neuropil within 40 um of the cell centre, other
# cells excluded). Stereotactic coordinates of each cell from vascular landmarks. In three of the
# mice, PT neurons (719, red RetroBeads in left basal pontine nucleus) and IT neurons (2,631, CTB
# Alexa 647 in right ALM and MM) were labelled.
# Wide-field imaging: 5 mice (Figure 2C), 2X objective, 260 x 348 pixels, 15 Hz, dF/F0 with F0 the
# mean of the six frames before trial start.
# Silicon probes: 567 single units, 3 mice, 24 sessions (ALM 297 units in 13 sessions; MM, called
# vM1 in the Methods, 270 units in 11 sessions), 468 from deep layers; spike counts in 400 ms
# windows in 100 ms steps. Photoinhibition (Figure S9) used VGAT-ChR2-EYFP line 8 mice (Key
# Resources Table); the text gives no other detail of it.
#
# Conventions used by the criteria below, from the STAR Methods unless marked open.
# T (trials and time). Trials of the four types, early-lick trials excluded. Fluorescence 5 s
#   before to 5 s after the go cue, aligned to trial start (go cue at 4.2 s); dF/F = (F-F0)/F0 per
#   trial, F0 the mean over the 0.5 s before trial start. Time bins are open: Figure 3B gives 66.7
#   ms bins while imaging was at 14 Hz (71.4 ms frames); readings (T1) the frames as acquired,
#   (T2) traces resampled to 66.7 ms bins. Trials with no lick after the go cue fit none of the
#   four types and are left out.
# M (selectivity model). Per neuron and time bin, dF/F of single trials on three binary factors,
#   object location (posterior CR, ER against anterior CL, EL), lick direction (right CR, EL
#   against left CL, ER) and outcome (correct CR, CL against error ER, EL), by a 3-way ANOVA with
#   main effects only (MATLAB anovan, 'linear'). A neuron is trial-type selective at t if any
#   factor has p < 0.01; purely object location, lick direction or outcome selective if only that
#   factor has p < 0.01; mixed if more than one. Coefficients from trial-type means,
#   alpha = (CR - CL + ER - EL)/2, beta = (CR - CL - ER + EL)/2, gamma = (CR + CL - ER - EL)/2,
#   set to 0 where the factor is not significant before averaging over neurons. So alpha > 0 is
#   posterior-preferring, beta > 0 lick-right (contralateral to the left hemisphere imaged)
#   preferring, gamma > 0 correct-preferring. (The Results, paragraph 1 of Analysis of
#   Behavior-Related Activity, calls CR and EL "lick left trials"; the Methods and the trial names
#   say lick right, and the Methods are followed.)
# A (area). ALM is centred 2.5 mm anterior, 1.5 mm lateral; MM 1.5 mm anterior, 1.0 mm lateral.
#   The border of ALM is "a spatially deconvolved region where photo inactivation affects behavior
#   (Li et al., 2016)" (Figure 2A legend); no coordinates are given. Every neuron is in one of the
#   two (8,837 + 6,594 = 15,431). Open, readings (A1) the dataset's own area label per cell or
#   imaging location, if it has one; (A2) each cell assigned to the nearer of the two centres. The
#   counts 8,837 and 6,594 check the reading.
# D (depth). Superficial z < 350 um, deep z >= 350 um (Methods; the Results write > 350), z the
#   depth of the image plane. Figure 6 histograms use 100-250, 250-400 and 400-620 um.
# B (bootstrap). The error of averages over neurons is the SD of the average over hierarchical
#   resamples of animals, planes and cells, with replacement (Methods, for Figure 8D). The number
#   of resamples is not given; 1000 is used as a standard choice that cannot change the outcome.
# O (onset). "time when selectivity rose to >6 SD above baseline" (Results, Projection-Specific
#   Coding). The baseline period is open, readings (O1) the bins before trial start in the
#   extracted window (from 0.8 s before trial start), (O2) the 0.5 s F0 window before trial start.
