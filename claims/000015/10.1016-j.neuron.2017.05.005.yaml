  source: Results, Mapping Activity Using Two-Photon Calcium Imaging, paragraphs 2 and 3
  quote: Our sample (15,431 neurons across 6 mice) is therefore biased toward the active population
  expected:
  - quantity: neurons
    value: 15431
    tolerance: 1543
  - quantity: ALM neurons
    value: 8837
    tolerance: 884
  - quantity: MM neurons
    value: 6594
    tolerance: 659
