- id: fig8c-pt-deep-only
  statement: IT neurons were found in both superficial and deep layers, PT neurons only in deep
    layers; 719 PT and 2,631 IT neurons were imaged in three mice.
  source: Results, Projection-Specific Coding, paragraph 1; Figure 8C
  quote: In three mice, we combined retrograde labeling of pyramidal tract (PT) (n = 719) and
    intratelencephalic (IT) (n = 2,631) neurons ... IT neurons were found in both superficial and deep
