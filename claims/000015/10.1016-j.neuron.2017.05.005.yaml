  id: "000015"
paper: doi:10.1016/j.neuron.2017.05.005
claims:
- id: early-lick-fraction
  statement: Mice licked early, during the delay epoch, on 13.3% +- 10% of trials, and these trials
    were not analysed.
  source: Results, paragraph 2 (four trial types)
  quote: Trials in which the mice licked early during the delay epoch (13.3% ± 10%) were not analyzed
  expected:
    quantity: early-lick trials as a percentage of trials
    value: 13.3
    tolerance: 10
    unit: percent
  criterion: The tolerance is the paper's stated spread. The paper does not say over what the mean
    and SD are taken. Readings (a) mean over imaged planes; (b) mean over sessions; (c) mean over
    mice; (d) all trials pooled. Denominator all trials with a lick or all trials of the session,
    both read. Reproduced when the mean is within tolerance under one reading. If the dataset holds
    no early-lick trials, the claim cannot be tested.
