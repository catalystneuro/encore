    distinguished trial types, 115 in the sample, 182 in the delay and 309 in the response epoch.
  source: Results, Comparison with Extracellular Electrophysiology, paragraph 2; Methods,
    Electrophysiology data analysis
  quote: We recorded single units (n = 567, 3 mice) in the left ALM and MM under identical behavioral
    conditions as the imaging experiments. The spikes rates of 393 neurons distinguished trial types
    during either sample (n = 115), delay (n = 182), or response epoch (n = 309
  data: elsewhere
  where: CRCNS doi:10.6080/K0S180F9
  expected:
  - quantity: single units
    value: 567
    tolerance: 0
  - quantity: units selective in any epoch
    value: 393
    tolerance: 39
  - quantity: units selective in the sample epoch
    value: 115
    tolerance: 12
  - quantity: units selective in the delay epoch
    value: 182
    tolerance: 18
  - quantity: units selective in the response epoch
    value: 309
    tolerance: 31
  criterion: Units 297 in ALM (13 sessions) and 270 in MM (11 sessions) (Methods); the unit count
