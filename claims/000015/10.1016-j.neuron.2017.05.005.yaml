  quote: For each mouse (n = 6), we collected data from 1 to 3 image locations (n = 12 locations in
    total, Figure 2E), each containing multiple (8.8 ± 2.6) image planes ... Each image plane (n = 105,
    Figure 2F and S2) was sampled at 14 Hz while mice performed the task for 92 ± 26 trials, with
    performance at 73% ± 9% trials correct ... allowing sequential imaging of 3 ± 1 planes per
    session (range 1–6
  expected:
