  expected:
  - quantity: MM trial-type-selective neurons
    value: 1523
    tolerance: 152
  - quantity: ALM trial-type-selective neurons
    value: 2754
    tolerance: 275
  - quantity: MM fraction selective
    value: 23
    tolerance: 2.3
    unit: percent
  - quantity: ALM fraction selective
    value: 31
    tolerance: 3.1
    unit: percent
  criterion: The test is the Methods' 3-way ANOVA per time bin (convention M, p < 0.01 for any
