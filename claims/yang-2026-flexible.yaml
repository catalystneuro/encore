# Claims for Yang (2026), "Flexible Cellular Phenotypes Retain a Shared Type-Level Organization
# across Response Regimes", eNeuro 13(11) ENEURO.0275-26.2026, doi:10.1523/eneuro.0275-26.2026,
# on DANDI 000020 (Allen Institute Patch-seq of mouse visual cortex GABAergic neurons, Gouwens et
# al. 2020), which the paper reuses.
#
# Provenance. Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub
# Actions"), 2026-11-22, protocol pilot-18 as stated in docs/protocol.md (Reader, steps 1 to 4).
#
# Text read. The version of record, from paper/10.1523-eneuro.0275-26.2026.txt (PMC13737997):
# abstract, Significance Statement, Introduction, Materials and Methods, Results, Discussion,
# Table 1, Table 2 (statistical summary, rows a to y), the legends of Figures 1 to 4 and of the
# Extended Data (Figures 1-1 to 1-3, 2-1, 3-1 to 3-3, 4-1 to 4-4; Tables 1-1 and 2-1), and the
# synthesis of the reviews. The Extended Data files themselves (TIF figures, DOCX Tables 1-1,
# 2-1, 3-1, 4-1, 4-3) are not in the text and no PDF was supplied; only their legends were read.
# No claim rests on a number printed only in them: every expected value below is printed in the
# Results, the Methods or Table 2. The retained feature lists of Extended Data Table 1-1 are
# taken from the paper's code (below). The paper prints "Table 2 (rows a-y)" superscript letters
# after its values; they appear in the quotes as stray letters ("0.434 a").
#
# Code read. https://github.com/zy-neuro/protocol-response-geometry, commit 61a5a41 (2026-10-19),
# deposited as Extended Data 1. It holds the analysis scripts (scripts/q1_describe_phenotype.py,
# q1_knn_scale.py, q1_split_half_long_square.py, q2_anchor.py, q3a_explain.py,
# q3a_centroid_robustness.py, q3bc_explain.py, q3_mobility_modules.py, q3_wgcna_mobility.py,
# q3_wgcna_modules.R, figure scripts), the curated gene list
# (configs/q3_curated_excitability_genes.txt) and derived tables under results/: the per-regime
# PCA scores, loadings and variance, the retained feature names
# (results/phenotype/phenotype_summary.json), and the metadata join
# (results/m0/m0_molecular_join.csv, keyed by NWB file stem, with t_type, subclass, cre_line and
# transcriptomics_sample_id). It does not hold the script that ran IPFX on all cells to make the
# cell-level feature table (results/features/ipfx_cell_features.csv is referred to but absent),
# nor the script that wrote results/q3b/q3b_primary_null_1000.csv. Where the Methods leave a
# choice open and the code settles it, the criteria follow the code and say so. Common to all
# scripts: seed 0 (numpy default_rng); Euclidean distance; Spearman correlation computed as the
# Pearson correlation of ordinal ranks from np.argsort(np.argsort(x)), so ties get distinct
# ranks in an order the sort leaves arbitrary (this matters for the binary label distances of
# the A_t claims; see there); population standard deviation (ddof 0) for z-scores and CVs.
#
# Data the paper used (Methods, Dataset and animals; Electrophysiological feature extraction;
# Protocol-resolved cellular phenotype; Molecular labels). DANDI 000020, version 0.210913.1639,
# 4,435 files with the suffix _icephys.nwb, one per cell, current-clamp recordings of GABAergic
# interneurons (mostly VISp) from male and female Cre-driver mice (about P45 to P70). Three
# stimulus families are treated as response regimes: long-pulse (long squares), ramp, and
# brief-pulse (short squares). Cell-level features come from the Allen Institute IPFX package
# (extract_ok = 1), with empty NWB2 epoch fields dropped so that IPFX recovers the stimulus and
# experiment windows. Each regime has its own z-scored feature matrix and PCA, kept to k80
# components (long-pulse 4,344 cells, 42 features, k80 = 11; ramp 4,139, 20, 3; brief-pulse
# 4,422, 21, 5). Example cell, DANDI session 639797293 (Figure 1A). Cells are matched across
# regimes and to labels by NWB file stem.
#
# Outside data (step 4). The transcriptomic labels (t-type, subclass) and the Cre line are
# taken from the joined Allen metadata of the NeMO Patch-seq release 20200611, and the gene
# counts from its count matrix v2 (file 20200513_Mouse_PatchSeq_Release_count.v2.csv), at
# https://data.nemoarchive.org/other/AIBS/AIBS_patchseq/transcriptome/scell/SMARTseq/processed/analysis/20200611
# (README of the code). The paper's join of these to the NWB files is the code's
# results/m0/m0_molecular_join.csv. Claims that need labels or counts are data: with_inputs.
# Whether the NWB files carry the Cre line or t-type themselves is the author's to find.
#
# Statistics. Every p-value in the paper is an empirical permutation p, (1 + number of null
# values >= observed)/(1 + number of permutations); with no null value reaching the observed,
# it is 0.0099 for 100 shuffles, 0.020 for 50 and 0.000999 for 1,000 (Results, end; Table 2).
# These floors are recorded as printed. Tolerances are 10% of each reported value unless a claim
# says otherwise; for integers whose 10% is below 1 (k80 of 3 and 5) this means the value must
# match exactly.
