  criterion: Method from the Methods (Biological anchoring) and scripts/q2_anchor.py (align_D).
    On the cells with a t-type, D_mol is 1 for a pair of different t-types and 0 otherwise;
    80,000 cell pairs sampled (seed 0); A_t is the Spearman correlation of D_mol with the k80
    phenotypic distance over those pairs; null by permuting cell labels 100 times, p = (1 +
