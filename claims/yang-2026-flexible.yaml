- id: wgcna-mobility-within-type
  statement: WGCNA coexpression modules on a 2,000-gene panel show modest associations with
    mobility before accounting for t-type (largest |rho| 0.199) but within-type residual
    associations are |rho| at most 0.039 for every module, so within-type transcriptomic
    heterogeneity shows little association with mobility beyond t-type.
  source: Results, Transcriptomic structure preferentially tracks the shared phenotypic map,
    paragraph 3; Extended Data Figures 4-3 and 4-4B; Table 2 row y; Methods, Transcriptomic
    mobility and coexpression analysis
  quote: >-
    WGCNA modules built on the prespecified 2,000-gene panel showed modest associations with
    mobility before accounting for transcriptomic type (largest | ρ | = 0.199; Extended Data
    Fig. 4-3 ), but after within-type centering of mobility and module eigengenes, residual
    associations fell to | ρ | ≤ 0.039 for all modules
  data: with_inputs
  depends_on:
  - mobility-distribution
  expected:
  - quantity: cells with mobility, RNA and t-type
    value: 3906
    tolerance: 390.6
  - quantity: cells in types with at least three members
    value: 3902
    tolerance: 390.2
  - quantity: soft-threshold power beta
    value: 3
    tolerance: 0
  - quantity: scale-free fit R squared at the chosen beta
    value: 0.891
    tolerance: 0.0891
  - quantity: WGCNA modules (grey excluded)
    value: 10
    tolerance: 1
  - quantity: largest unadjusted absolute Spearman of an eigengene with mobility
    value: 0.199
    tolerance: 0.0199
  - quantity: largest residual absolute Spearman of an eigengene with mobility
    value: 0.039
    tolerance: 0.0039
  criterion: >-
    Method from the Methods (Transcriptomic mobility and coexpression analysis) and
    scripts/q3_mobility_modules.py, q3_wgcna_mobility.py and q3_wgcna_modules.R. Triple-shared
    cells with a transcriptomic sample identifier and a t-type; log-CPM as in
    fig4ab-rna-tracks-shared-map; panel the curated genes present, then genes in descending
    log-CPM variance over these cells, to 2,000, zero-variance genes dropped. WGCNA 1.74,
    goodSamplesGenes; pickSoftThreshold unsigned, powers 1 to 20, beta the lowest with
    scale-free R squared at least 0.80; blockwiseModules unsigned network and TOM, minModuleSize
    20, mergeCutHeight 0.25, reassignThreshold 0, pamRespectsDendro FALSE, one block, seed 0;
    grey not a module. Spearman of each eigengene with mobility, empirical p from 1,000
    shuffles of mobility (two-sided, as empirical_spearman_p). Residual analysis: mobility and
    each eigengene centered on their t-type mean, restricted to types with at least three
    members. The beta is an integer the rule selects, so its tolerance is 0. Reproduced when
    the largest residual |rho| is at most 0.039 plus tolerance, no module has residual |rho| >=
