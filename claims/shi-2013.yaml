    legend) - Position Only has a position main effect and no vision main effect or
    interaction; Position/Vision has both main effects or the interaction; Vision Only has a
    vision main effect and no position main effect or interaction. Outliers are removed as in
    the Fig. 4 legend, "indexes > 1.5 times the interquartile range", 5 cells in all. Open,
    readings (a) Tukey fences (below Q1 - 1.5 IQR or above Q3 + 1.5 IQR) over all cells, (b) the
    same fences within each group, (c) index above 1.5 times the IQR of all cells. Cells with an
    NV peak rate of 0 have no index and are left out (a standard choice). Reproduced when the
    four percentages are within tolerance under a reading; the group sizes are reported and
    compared.
