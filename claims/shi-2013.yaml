# Claims for Shi, Apker & Buneo (2013), J Neurophysiol 109:2097-2107, on CRCNS data set ppc-1.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-09,
# protocol as stated in docs/protocol.md (Reader).
#
# Text read: the version of record, as supplied under paper/ (PyMuPDF text of the journal PDF),
# with its Methods, Results, Discussion, Table 1 and the legends of Figures 1 to 6. The paper
# has no supplement. It links no analysis code, so none was read. The PDF could not be
# rendered here, and the extracted text prints the signs =, <, >, ~, plus/minus, minus and
# times as a replacement character. They were read from the PDF's font encodings (the
# Differences arrays of Universal-GreekwithMathPi and MathematicalPi-One). Every significance
# statement prints "P < 0.05"; the example cell's vision and interaction effects are
# "P = 0.52; P = 0.64"; values "a +/- b" are mean plus/minus spread; INDX1 means are -13% and
# -31%, the tuning split -24% and -40%, INDX2 means -9%, -13% and -13%; Table 1 y values carry
# a minus sign where the text shows the glyph; the Fig. 4 outliers are "indexes > 1.5 times the
# interquartile range"; the sample sizes are "N = 343" cells and "N = 200" for the bootstrap.
#
# The paper writes "(test, P < 0.05)" both after significant results and after results it
# calls not significant (correlations "identical ... permutation test, P < 0.05"; eye
# positions "neither ... differed ... P < 0.05"). Read with the Methods, which give each test
# as "(test, P < 0.05)", the bound is the threshold the test used. It is recorded as a
# statistic only where the finding is a significant difference.
#
# Data the paper used. Two head-fixed rhesus monkeys (monkey X, monkey B) reached in a 3D
# virtual environment, seeing the wrist as a green cursor, from a central start position to
# one of eight targets in a frontal plane (0 to 315 degrees in 45 degree steps, 0 degrees
# rightward, ipsilateral to the reaching arm), arranged in a rectangle 5 cm by 4 cm apart for
# monkey X and a square 5 cm apart for monkey B. After target acquisition the target went off
# (after 300 ms, X; 400 ms, B), a central yellow fixation point came on, and once it was
# fixated a static holding period of 800 to 1,200 ms followed, with the arm held at the target
# and the eyes at the centre. On half the trials the arm cursor stayed visible during the hold
# (Vision, V) and on the others it was blanked (No Vision, NV). Five trials per target were
# run; the decoder trains on four trials and tests on the fifth per target, so the five are
# read here as five per target in each condition (80 trials a session). Analysis is of the
# last 800 ms of the hold unless stated. Arm position was tracked at 250 Hz (Phoenix
# Technologies), eye position at 120 Hz. 343 single neurons (219 monkey X, 124 monkey B) in
# superficial area 5 of the SPL, one per session (Table 1 gives 219 and 124 sessions; the
# Results give 343 sessions), isolated with a window discriminator (Plexon), spike times at
# 2.5 kHz. Measured variables: spike times, trial events, arm endpoint position (x horizontal,
# y vertical, z depth, cm) and eye position.
#
# The CRCNS data set, by its title and description, holds the sorted spikes and strobed event
# codes of these sessions (Plexon and Matlab files, with an event code list and an analog file
# per session), with some extra behavioural training files the description says were used only
# for exploration. Whether it holds arm and eye position, and how V and NV trials are marked,
# is the author's to find.
#
# Method details fixed by the paper, used throughout. Mean firing rate in the last 800 ms of
# the hold. Single-cell effects by a two-factor ANOVA (target location by visual condition,
# with interaction, P < 0.05). Preferred location is the target of maximal NV mean rate. FF is
# the slope of spike count variance against spike count mean across cells, through the origin,
# at the NV preferred location. Details the paper does not fix are named in each criterion.
schema_version: 2
paper: doi:10.1152/jn.00223.2012
claims:
- id: behavior-mean-position-sessions
  statement: Few sessions showed a significant difference in mean arm endpoint position between
    V and NV at a target; the average percentage across animals and targets was 6.9 +/- 1.5%
    (one-factor MANOVA, P < 0.05).
  source: Results, Behavior, paragraph 1
  quote: The average percentage of sessions (across animals and targets) with a significant
    difference in mean position was 6.9
  expected:
  - quantity: percentage of sessions with a significant V against NV difference in mean endpoint
      position, averaged across animals and targets
    value: 6.9
    tolerance: 1.5
    unit: "%"
  criterion: Method from Materials and Methods, Behavioral analysis. For each session and
    target, the mean endpoint position (x, y, z) of each trial over the last 800 ms of the hold
    (the unit of Fig. 2, whose legend gives each point as a trial's mean over the 800 ms hold);
    V trials against NV trials by a one-factor MANOVA at P < 0.05 (with two groups every MANOVA
    statistic gives the same exact test). The tolerance is the paper's stated spread. Open, and
    both readings are shown, (a) the mean of the 16 animal and target percentages, (b) the
    percentage pooled over all session and target pairs. Reproduced when either reading is
    within tolerance.
- id: behavior-variability-sessions
  statement: Few sessions showed a significant difference in endpoint variability between V and
    NV; along the horizontal, vertical and depth axes the average percentages were 5 +/- 1.9%,
    4.7 +/- 1.6% and 6 +/- 0.9% (Levene's test, P < 0.05).
  source: Results, Behavior, paragraph 1
  quote: Similarly, the average percentages of sessions with a significant difference in
    variability along the horizontal, vertical, and depth axes were 5
  expected:
  - quantity: percentage of sessions with a significant variability difference, horizontal (x)
    value: 5
    tolerance: 1.9
    unit: "%"
  - quantity: percentage of sessions with a significant variability difference, vertical (y)
    value: 4.7
    tolerance: 1.6
    unit: "%"
  - quantity: percentage of sessions with a significant variability difference, depth (z)
    value: 6
    tolerance: 0.9
    unit: "%"
  criterion: Method from Materials and Methods, Behavioral analysis. Per session, target and
    axis, the trial mean endpoint positions of V trials against NV trials by Levene's test at P
    < 0.05. Tolerances are the paper's stated spreads. Open, and every reading is shown, the
    centre of Levene's test (mean, as in Levene's original test, or median, the Brown-Forsythe
    form), and the averaging (the mean of the 16 animal and target percentages, or pooled over
    session and target pairs). Reproduced when all three axes are within tolerance under one
    reading.
