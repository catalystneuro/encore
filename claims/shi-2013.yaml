- id: correlation-endpoint-datasets
  statement: Correlations between V and NV responses were the same where mean endpoint positions
    differed between conditions (r = 0.9301) and where they did not (r = 0.9281), so firing rate
    differences did not reflect endpoint differences.
  source: Results, Neurophysiology, paragraph 3
  quote: We found that the correlations were identical for these two data sets (r for data set
    1 ... 0.9301; r for data set 2 ... 0.9281; permutation test
  expected:
  - quantity: Spearman r, V against NV responses, endpoints differed (data set 1)
    value: 0.9301
    tolerance: 0.093
  - quantity: Spearman r, V against NV responses, endpoints the same (data set 2)
    value: 0.9281
    tolerance: 0.093
  depends_on:
  - behavior-mean-position-sessions
  criterion: Methods, Analysis of neurophysiological data, paragraph on Spearman correlations.
    Data set 1 is the session and target pairs with a significant MANOVA (behavior-mean-position-sessions),
    data set 2 the others. The response is the hold-period mean firing rate. Open, as the paper
    does not say what a response pair is, readings (a) the V and NV mean rates of each cell at
    each target, (b) single trials paired by order within cell and target. The difference
    between the two r values is tested by the permutation test of the FF (pairs pooled and
    randomly assigned to two groups of the original sizes, 1,000 times, P < 0.05, two-sided, a
    standard choice). A claim of absence; reproduced when the permutation test does not find a
    difference at P < 0.05 and both r values are within tolerance. The paper prints "P < 0.05"
    with "identical"; it is read as the test's threshold (see the header) and not recorded as a
    result.
