- id: fig3-example-neuron
  statement: An example neuron fired most when the hand was held at the lower left target (225
    degrees) in both V and NV; its hold-period rate showed a main effect of position (P < 0.05)
    but no effect of vision (P = 0.52) and no interaction (P = 0.64).
  source: Results, Neurophysiology, paragraph 1; Figure 3
  quote: For both the V and NV conditions, discharge was greatest when the animal held its hand
    at the target located in the lower left part of the workspace (225
  statistics:
  - about: main effect of position
    test: two-factor ANOVA
    p: 0.05
    p_relation: "<"
    n: one neuron, 8 targets, V and NV trials
  - about: main effect of the visual conditions
    test: two-factor ANOVA
    p: 0.52
    n: one neuron
  - about: position by visual conditions interaction
    test: two-factor ANOVA
    p: 0.64
    n: one neuron
  expected:
  - quantity: P of the vision main effect
    value: 0.52
    tolerance: 0.052
  - quantity: P of the interaction
    value: 0.64
    tolerance: 0.064
  criterion: The paper does not identify the neuron (no session or unit name). With the ANOVA of
    hold-period rates (Materials and Methods), the claim is reproduced when at least one neuron
    has its maximal mean rate at 225 degrees in both conditions, a position main effect at P <
    0.05, and vision and interaction P values within the tolerances. The candidates found are
    listed. When none is found the claim is not reproduced, and the closest neuron is shown.
- id: movement-epoch-tuning
  statement: In a 500 ms epoch centred on movement onset, 41% (139 of 343) of neurons were
    modulated by the movement vector (main and/or interaction effects, ANOVA, P < 0.05).
  source: Results, Neurophysiology, paragraph 2
  quote: when data during a 500-ms epoch centered on movement onset were analyzed, 41% (139/
    343) of the neurons were found to be modulated by the required movement vector
  expected:
  - quantity: neurons modulated by movement vector
    value: 139
    tolerance: 13.9
    unit: neurons
  criterion: The two-factor ANOVA of the Methods (target by visual condition, P < 0.05) on the
    mean rate in the 500 ms centred on movement onset; a cell counts when the target main effect
    or the interaction is significant. Open, as the paper does not define movement onset,
    readings (a) an event code marking movement onset, if the data hold one, (b) the time the
    arm cursor leaves the start window, read from arm position. Reproduced when a reading is
    within tolerance.
- id: hold-position-main-effect
  statement: In the 800 ms static holding period, 39% (135 of 343) of neurons showed a significant
    main effect of position.
  source: Results, Neurophysiology, paragraph 2
  quote: When data from the 800-ms static holding period were considered, 39% (135/343) of the
    neurons showed a significant main effect of position
  expected:
  - quantity: neurons with a position main effect
    value: 135
    tolerance: 13.5
    unit: neurons
  criterion: Two-factor ANOVA (target location by visual condition, with interaction) on each
    neuron's mean firing rate per trial in the last 800 ms of the hold, P < 0.05 (Materials and
    Methods, Analysis of neurophysiological data). The rate is the spike count over the window
    divided by 0.8 s, a standard choice; the paper's smoothed PSTH (Gaussian, sigma 50 ms)
    averaged over the window is shown as a variant. The design is balanced with five trials per
    cell of the design; where trials are missing, type II sums of squares are used, a standard
    choice.
- id: hold-vision-main-effect
  statement: Only 13% (44 of 343) of neurons showed a main effect of the visual conditions in the
    holding period.
  source: Results, Neurophysiology, paragraph 2
  quote: while only 13% (44/343) showed a main effect of the visual conditions
  expected:
  - quantity: neurons with a vision main effect
    value: 44
    tolerance: 4.4
    unit: neurons
  depends_on:
  - hold-position-main-effect
  criterion: The ANOVA of hold-position-main-effect; count of neurons with a significant visual
    condition main effect. Reproduced within tolerance, and when fewer neurons have a vision
    effect than a position effect.
- id: hold-interaction
  statement: Interaction effects of position and vision were found in 9% (27 of 343) of neurons.
