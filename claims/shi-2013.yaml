- id: fig5-fano-factor
  statement: The Fano factor was significantly larger in NV (1.54) than in V (1.13) (permutation
    test, P < 0.05).
  source: Results, Neurophysiology, paragraph 6; Figure 5
  quote: Statistical analysis revealed that the FF was significantly larger in the NV condition
    (permutation test
  statistics:
  - test: permutation test, 1,000 permutations
    p: 0.05
    p_relation: "<"
    n: spike count means and variances of all cells after outlier removal, at the NV peak location
  expected:
  - quantity: FF, V
    value: 1.13
    tolerance: 0.113
  - quantity: FF, NV
    value: 1.54
    tolerance: 0.154
  criterion: Methods, paragraphs on FF. Spike counts in the last 800 ms of the hold at the NV
    preferred location; for each cell the count mean and variance over trials in each
    condition; FF is the slope of variance on mean through the origin, by least squares (a
    standard choice for a line through the origin). Permutation test as the Methods give it,
    the 2N (mean, variance) pairs pooled and randomly split into two groups of N, FF difference
    computed, 1,000 times; P is the fraction of permuted differences at least the observed
    one, two-sided (a standard choice; one-sided shown). Open, which cells are outliers (Fig. 5
    legend "after outlier removal"), readings (a) the 5 cells removed for Fig. 4, (b) Tukey
    outliers (1.5 IQR) on the count means or variances. Reproduced when NV FF exceeds V FF with
    P < 0.05 and both FFs are within tolerance, under a reading.
- id: cv2-larger-nv
  statement: The squared coefficient of variation of interspike intervals (CV2) was also
    significantly larger in NV than in V (Kruskal-Wallis test, P < 0.05).
  source: Results, Neurophysiology, paragraph 6
  quote: Interestingly, the CV2, which assesses variability in the interspike intervals, was also
    significantly larger in the NV condition
  statistics:
  - test: Kruskal-Wallis test
    p: 0.05
    p_relation: "<"
    n: CV2 of each cell in V and in NV
  criterion: Methods, CV2 paragraph. CV2 = (SD / mean of ISIs)^2 per cell and condition, at the
    NV preferred location, ISIs within the last 800 ms of the hold. Open, readings (a) ISIs
    pooled over the trials, (b) CV2 per trial averaged over trials. Cells with fewer than two
    ISIs in a condition are left out (a standard choice). V against NV cell values by a
    Kruskal-Wallis test. Reproduced when the NV median exceeds the V median with P < 0.05 under
    a reading.
- id: fig6-decoding-vv
  statement: A maximum-likelihood decoder trained and tested on V data decoded hand position with
    an average accuracy across targets of 91.6 +/- 9%.
  source: Results, Neurophysiology, paragraph 7; Figure 6, top left
  quote: For example, when data from the full 800 ms of the holding period were used, average
    decoding accuracy across targets in the V conditions was 91.6
  expected:
  - quantity: decoding accuracy, trained and tested on V
    value: 91.6
    tolerance: 9
    unit: "%"
  criterion: Methods, decoding paragraph and Eqs. 3 and 4. All 343 neurons treated as
    simultaneously recorded; Poisson likelihood of the spike counts in the last 800 ms of the
    hold; lambda per cell and target is the mean count over four training trials; the held-out
    trial is decoded as the target of maximal likelihood; repeated so each of the five trials is
    the test trial; accuracy per target is the fraction of the five correct, averaged over the
    eight targets. Bootstrapped across cells, N = 200. Tolerance is the paper's stated spread.
    Open, readings for each, (i) the trials of different cells joined by their order within
    target and condition (a standard choice, as no other pairing exists); (ii) bootstrap,
    (a) 200 resamples of the cells with replacement, (b) resampled populations of 200 cells;
    (iii) a lambda of 0 is replaced by a small constant (1e-3 spikes, a standard choice).
    Reproduced when the accuracy is within tolerance under a reading.
- id: fig6-decoding-nvnv
  statement: Trained and tested on NV data, the decoder's accuracy fell to 81.9 +/- 18.0%.
  source: Results, Neurophysiology, paragraph 7; Figure 6, bottom right
  quote: In contrast, when the decoder was both trained and tested with data from the NV
    conditions (Fig. 6, bottom right) decoding accuracy fell to 81.9
  expected:
  - quantity: decoding accuracy, trained and tested on NV
    value: 81.9
    tolerance: 18
    unit: "%"
  depends_on:
  - fig6-decoding-vv
  criterion: The decoder of fig6-decoding-vv on NV trials, under its readings. Reproduced within
    tolerance.
- id: decoding-v-better-than-nv
  statement: Decoding accuracy was significantly higher in V than in NV (t-test, P < 0.05), a small
    but significant role of vision in representing limb position.
  source: Results, Neurophysiology, paragraph 7
  quote: The difference in decoding performance between the V and NV conditions was statistically
    significant
  statistics:
  - test: t-test
    p: 0.05
    p_relation: "<"
  depends_on:
  - fig6-decoding-vv
  - fig6-decoding-nvnv
  criterion: The paper names a t-test and not its samples. Readings (a) paired t-test over the
    eight per-target accuracies, (b) two-sample t-test over the 200 bootstrap accuracies of each
    condition, (c) two-sample t-test over the eight per-target accuracies. Reproduced when V
    accuracy exceeds NV accuracy with P < 0.05 under a reading; every reading is shown.
- id: fig6-decoding-cross
  statement: Training and testing on different conditions gave lower accuracies, 60.7 +/- 22%
    trained on NV and tested on V and 69.1 +/- 17% trained on V and tested on NV, so decoding
    degraded whenever NV data were used.
  source: Figure 6 legend; Results, Neurophysiology, paragraphs 7 and 8
  quote: Results from the analyses where the decoder ... was trained and tested with data from
    different conditions reinforce the idea that decoding of limb position degraded somewhat
    whenever data from the NV condition were used
  expected:
  - quantity: accuracy, trained on NV, tested on V
    value: 60.7
    tolerance: 22
    unit: "%"
  - quantity: accuracy, trained on V, tested on NV
    value: 69.1
    tolerance: 17
    unit: "%"
  depends_on:
  - fig6-decoding-vv
  criterion: Decoder of fig6-decoding-vv. Open, the cross-condition scheme, readings (a) lambda
    from four trials of one condition and the held-out trial order of the other, as in the
    leave-one-out, (b) lambda from all five trials of one condition and all five trials of the
    other tested. Reproduced when both accuracies are within tolerance and both are below the
    V/V accuracy, under a reading.
- id: decoding-subepochs
  statement: Decoding was less accurate with shorter windows, but did not differ between the first
    and the last 400 ms of the hold, in V or in NV.
  source: Results, Neurophysiology, paragraph 7; Discussion, Additional factors, paragraph 2
  quote: While accuracy decreased with shorter windows, no difference in decoding performance was
    found when the first 400 ms and the last 400 ms of the holding period were compared
  depends_on:
  - fig6-decoding-vv
  - decoding-v-better-than-nv
  criterion: The decoder of fig6-decoding-vv on the first and the last 400 ms of the analysed
    window, in V and in NV. A claim of absence. The paper names no test for this comparison;
    the test it uses for decoding performance is the t-test of decoding-v-better-than-nv, at P
    < 0.05, with its sample readings. Reproduced when the 400 ms accuracies are below the 800 ms
    accuracy and the t-test finds no first against last difference in either condition; the
    differences are given either way.
- id: decoding-nonsignificant-cells
  statement: Neurons with no ANOVA effect of position, vision or interaction still decoded
    position above chance at some targets, and slightly better in V than in NV (20% against
    14%), though this difference was not significant.
  source: Results, Neurophysiology, paragraph 8
  quote: Interestingly, average decoding accuracy was also slightly higher in the V condition
    than in the NV condition in this subset of cells (20% vs. 14%), similar in trend to what was
    observed for the entire population, though this difference was not statistically
    significant
  expected:
  - quantity: decoding accuracy, V, cells without ANOVA effects
    value: 20
    tolerance: 2
    unit: "%"
  - quantity: decoding accuracy, NV, cells without ANOVA effects
    value: 14
    tolerance: 1.4
    unit: "%"
  depends_on:
  - hold-overall-effects
  - decoding-v-better-than-nv
  criterion: The decoder of fig6-decoding-vv on the neurons with no significant effect in the
    ANOVA of hold-position-main-effect. Chance is 12.5% (eight targets). The paper names no test
    for above chance or for V against NV here; the V against NV test is the t-test of
    decoding-v-better-than-nv, at P < 0.05, with its readings, and above chance is a target
    with accuracy above 12.5% in both conditions (the paper gives no test). Reproduced when
    both accuracies are within tolerance, V exceeds NV, the t-test is not significant, and some
    target is above chance in both conditions.
- id: eye-position-no-difference
  statement: Neither mean eye position nor the variance of its horizontal or vertical component
    differed between V and NV for any target (MANOVA and Levene's test).
  source: Discussion, Additional factors influencing neural responses, paragraph 3
  quote: We found that neither the average eye positions nor the variances of the horizontal or
    vertical components of eye position differed between the V and NV conditions for any target
  criterion: A claim of absence. Per target, the trial mean eye positions (horizontal, vertical)
    in the last 800 ms of the hold, V against NV by a one-factor MANOVA, and each component's
    variance by Levene's test, at P < 0.05 as printed. Open, readings (a) per animal, trials
    pooled over sessions, (b) per session, the claim then read as the share of significant
    sessions near the 5% expected by chance. The paper's "for any target" fits (a); (b) is a
    variant. Reproduced when no target shows a difference under (a); the effects are given
    either way.
- id: aborted-trials-nv
  statement: In one animal, as the behavioral window around the reach targets was made smaller,
    aborted trials increased in both conditions, and were significantly more frequent on NV
    trials for smaller windows (t-test, P < 0.05), so the animals used vision to hold position.
  source: Discussion, Additional factors influencing neural responses, paragraph 1
  quote: We found that as the window size decreased the number of aborted trials increased for
    both the NV and V conditions and, moreover, the number of these aborted trials was
    significantly greater on NV trials for smaller window sizes
  statistics:
  - test: t-test
    p: 0.05
    p_relation: "<"
  criterion: The paper gives this test from Shi and Buneo (2009), an abstract, and gives neither
    the animal, the window sizes, the unit of the t-test nor how aborts are counted. It needs
    the aborted trials and the window size of each, in sessions where the window was varied.
    Readings (a) per session and window size, NV against V abort rate by a paired t-test, (b)
    the same by a two-sample t-test. Reproduced when, under a reading, aborts rise as the window
    shrinks in both conditions and are more frequent in NV at the smallest windows with P <
    0.05. When the data hold no such sessions, the claim cannot be tested.
- id: longer-hold-no-difference
  statement: In a subset of sessions with the minimum hold extended to 1,200 ms, neither behavior
    nor neural responses differed appreciably.
  source: Discussion, Additional factors influencing neural responses, paragraph 1
  quote: In a subset of experimental sessions we extended the minimum duration of the holding
    period out to 1,200 ms and found no appreciable differences in either the behavior of the
    animals or the neural responses
  criterion: A claim of absence that cites a preliminary abstract (Shi and Buneo 2009); the paper
    names no test, no measure and the sessions. Read here with the paper's own measures, the
    share of cells with a vision effect (hold-overall-effects) and the V against NV decoding
    difference (decoding-v-better-than-nv) in sessions with a minimum hold of 1,200 ms against
    the others, by a chi-square test of the counts and the t-test of decoding-v-better-than-nv,
    at P < 0.05. Reproduced when neither differs. The choice of measures is an assumption.
