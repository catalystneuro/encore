    interaction. The printed numbers disagree (27/343 is 7.9%; 9% of 343 is 31), so the readings
    are (a) 27 neurons, (b) 9% of 343, 31 neurons (tolerance 3.1). Reproduced when the count is
    within tolerance under either reading.
