- id: figs4b-astrocyte-gq-increases-rate
  statement: Activating Gq-DREADD in SNr astrocytes with CNO raises the basal spike rate of SNr
    neurons.
  source: Results, Tonic GABA release was not derived from GPe terminals or astrocytes, paragraph
    2; Figure S4B
  quote: In these slices, bath ... of the DREADD agonist CNO elevated the basal spiking rate
    of SNr neurons recorded in cell-attached mode (P = 0.03 and n = 8)
  statistics:
  - test: paired t test
    p: 0.03
    n: 8 neurons
  criterion: Rate before and after CNO in slices with GFAP-hM3 Gq-DREADD in SNr (M1, M4).
    Reproduced when a two-sided paired t test has P < 0.05 with rates higher after.
- id: figs4c-nppb-decreases-rate
  statement: The bestrophin1 inhibitor NPPB lowers SNr spike rate, so bestrophin1 channels in
    astrocytes are not releasing GABA onto SNr neurons.
  source: Results, Tonic GABA release was not derived from GPe terminals or astrocytes, paragraph
