# Claims for Simmons et al. (2026), Science Advances 12, eadq8840, tested on dandiset 001777.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-10,
# protocol pilot-14 as stated in docs/protocol.md (reader, steps 1 to 4).
#
# Text read: the version of record (Science Advances, 9 September 2026, CC BY), full text with
# Results, Discussion, Materials and Methods and figure legends, and its supplement PDF
# (sciadv.adq8840_sm.pdf, Figs. S1 to S9). PDF pages 3, 4, 5, 6, 7 and 8 and supplement page 7
# were opened to read Fig. 2B (the train runs from 2 to 4 s of a 6-s sweep), Fig. 3B (about 45
# cells are plotted), Fig. 5F (the inhibitor-treated group fires faster) and Fig. S6 (WT against
# KO, marked n.s.).
#
# Code read: the paper's code deposit, doi:10.5281/zenodo.10855006, which resolves to record
# 17297995 (doi:10.5281/zenodo.17297995), one Mathematica notebook, "Code Sample.nb". It holds
# three parts. (1) "Detect Mean Spike rate per trial/episode" imports the spike events exported
# from Clampfit (.atf), counts events per episode, divides by EPISODE_LENGTH to give a rate per
# episode, plots the rates "to identify stable baselines from START to END", and takes the median
# rate over episodes START to END. (2) "Collect Spiketimes across episodes into Histogram" builds a
# PSTH (findPSTHMini) as spike counts summed over episodes in bins of BINWIDTH, divided by bin
# width times the number of episodes, relative to TIMEZERO, after dropping "Glitched Episodes"
# (BADEP1, BADEP2). (3) Down-sampling and segmenting traces for figures. Every window, bin width,
# trigger time and dropped episode is a placeholder. Spike detection itself was done in Clampfit;
# its settings are not given in the paper or the code.
#
# Data the paper used. Male and female mice (C57BL/6J, DAT-Cre, PV-Cre, Aldh1a1-2A-iCre and
# Aldh1a1-2A-iCre/DAT-2A-Flpo). Ex vivo sagittal or coronal slices with the SNr, 240 um, recorded
# at 32 to 33 C (Methods). SNr neurons were recorded in cell-attached mode for spike rate, before
# and after bath application of a drug (quinpirole 2 uM, gabazine 10 uM, CNO, SCH39166 2 uM, NPPB,
# disulfiram 10 uM, DEAB 10 uM, rasagiline 10 uM, NNC-711, SNAP-5114 20 uM), in slices from mice
# injected with Chronos in GPe (Figs. 1, 2), Gi-DREADD in GPe (Fig. 4), Gq- or Gi-DREADD under GFAP
# in SNr (Figs. 7, S4), ALDH1A1 shRNA in SNc (Fig. 5) or Cre-dependent Gi-DREADD in SNc of DAT-Cre
# mice (Figs. 6, S3), and in low glucose (Fig. S8) or at room temperature (Fig. S4). Whole-cell
# voltage clamp at -60 mV with a Cs+ electrode gave optically (Fig. 1) or electrically (Fig. 4A)
# evoked IPSCs. SNc neurons were recorded for Fig. S3. Other data are two-photon PercevalHR imaging
# in SNc dopaminergic neurons (Fig. S9), RNAscope for D2R and S100B (Figs. 7A, S7), fluorescence
# images of ALDH1A1+ and ALDH1A1- dendrites (Fig. 5A, B), fast-scan cyclic voltammetry in striatum
# (Fig. S6), and outside expression data (Fig. 6D, Fig. S5). The n of each test is a number of
# neurons (Fig. 3B, 5D), except where the legend says mice or cells and mice. The dandiset's title
# is the paper's; its description says it holds "binary files of electrophysiology data", and its
# variables are VoltageClampSeries and VoltageClampStimulusSeries.
#
# Outside data. The paper's raw data and analyses per figure are deposited at
# doi:10.5281/zenodo.10850896 (resolves to record 15881780, "Data Files and Analysys for ...", with
# folders for Figs. 1 to 7, S2, S3, S4, S7 and S9). The key resource table is
# doi:10.5281/zenodo.17296457. Fig. 6D uses Dopabase (ref. 36, Gaertner et al. 2025, eLife 13,
# RP101035). Fig. S5 is a table from Gonzalez-Rodriguez et al. 2021, doi:10.1038/s41586-021-04059-0.
#
# Common method, used by the criteria below (cited as M1 to M6).
# M1 Spike rate. Spikes detected in Clampfit 10.3 (Methods, Analysis and statistics; the code
#    imports Clampfit event exports). Detection settings are given nowhere; this cannot be fixed
#    from the paper, so the author uses a standard threshold detection on the cell-attached current
#    and reports it. Rate per episode is the spike count divided by the episode length (code, part
#    1). A cell's rate in a condition is the median of its per-episode rates over a stable window
#    (code, part 1). Which episodes form the stable window is chosen by eye in the code and not
#    given in the paper. Readings: (a) all episodes of each condition; (b) the last stable stretch
#    of each condition, for a drug the episodes from 6 min after the start of application, when
#    the time courses of Fig. 7G have reached their steady level (the whole drug period when it
#    is shorter than 6 min). A claim holds when its result holds under either reading.
# M2 Percent change. The paper gives changes as "roughly 30%", "about 50%", "28% mean increase" and
#    the Discussion calls them "modal". Readings: (a) the mean over cells of each cell's percent
#    change; (b) the percent change of the group mean rates; (c) the median over cells of each
#    cell's percent change. Where the paper writes "mean", readings (a) and (b) only.
# M3 Tests. As named in each figure legend (paired t test for before and after in the same cell,
#    Welch's t test for groups of cells, Wilcoxon or Mann-Whitney where named), at P < 0.05
#    (Methods, Analysis and statistics). Sidedness is not stated; tests are two-sided (the
#    GraphPad Prism default, a standard choice) and a one-sided result is shown as a variant.
#    Where a legend names no test for a before and after comparison in the same cells, the paired
#    t test used by the other such legends is the main reading and the Wilcoxon signed-rank test a
#    variant.
# M4 Before and after. The control value is from the recording before the drug; the drug value is
#    from the same cell after bath application (legends, "before and after bath application").
#    For an occlusion experiment the control is the cell in the first drug and the second value
#    after the second drug is added (Figs. 3D, 5G, 5H, 6A, 6E, 7E, 7F).
# M5 Units of n. Neurons, as in the legends; the attempt reports the number of mice where the
#    dataset gives it. Where the text and the legend give different n or P for the same test, both
#    are recorded and the claim holds when the result matches either.
# M6 Absence. A claim that a drug had no effect is judged on the paper's test in M3 at P < 0.05:
#    reproduced when the test does not find the effect, not reproduced when it does, with the size
#    of the change given either way.
schema_version: 2
paper: doi:10.1126/sciadv.adq8840
claims:
- id: fig1c-quinpirole-reduces-gpe-ipsc
  statement: The D2R agonist quinpirole (2 uM) reduces the amplitude of optogenetically evoked
    GPe IPSCs in SNr neurons by roughly 30%.
  source: Results, D2R agonists inhibited phasic GABA release from GPe terminals, paragraph 1;
    Figure 1C
  quote: Quinpirole reduced the amplitude of the GPe evoked inhibitory postsynaptic currents
    (IPSCs) by roughly 30% (P = 0.02 and n = 5)
  statistics:
  - test: paired t test
    p: 0.02
    n: 5 neurons
  expected:
  - quantity: reduction in GPe evoked IPSC amplitude with quinpirole
    value: 30
    tolerance: 3
    unit: "%"
  criterion: Whole-cell voltage clamp at -60 mV, Cs+ internal, optical stimulation of Chronos in
    GPe axons (Results, paragraph 1). IPSC amplitude is how the paper does not say; read as the
    peak of the evoked current from the pre-stimulus baseline, averaged over sweeps in each
    condition (a standard choice, stated as one). Reproduced when a two-sided paired t test of
    before against after quinpirole has P < 0.05 with amplitudes lower after, and the reduction
    is within tolerance under one reading of M2.
- id: fig1e-ppr-rises
  statement: Quinpirole raises the paired-pulse ratio of GPe evoked IPSCs at a 50 ms interval,
    consistent with a presynaptic site of action.
  source: Results, D2R agonists inhibited phasic GABA release from GPe terminals, paragraph 1;
    Figure 1D and 1E
  quote: Consistent with a presynaptic locus of the ... the paired-pulse ratio of GPe
    evoked IPSCs rose in the presence of quinpirole (P = 0.02 and n = 6)
  statistics:
  - test: paired t test
    p: 0.02
    n: 6 neurons
  criterion: Paired pulses 50 ms apart (Fig. 1D legend). Paired-pulse ratio as the second IPSC
    peak over the first; the paper does not define it, and whether the second peak is taken from
    the pre-pulse baseline or from the decaying first IPSC is open. Readings (a) second peak from
    the baseline before the first pulse; (b) second peak from the current just before the second
    pulse. Reproduced when, under one reading, a two-sided paired t test has P < 0.05 with the
    ratio higher after quinpirole.
- id: fig2c-quinpirole-attenuates-gpe-inhibition
  statement: A 2-s, 30-Hz optogenetic train of GPe inputs inhibits SNr spiking, and quinpirole
    attenuates this inhibition.
  source: Results, D2R agonists inhibited phasic GABA release from GPe terminals, paragraph 2;
    Figure 2A to 2C
  quote: quinpirole attenuated the ability of GPe stimulation to slow the spiking of
    SNr neurons (P = 0.02 and n = 8)
  statistics:
  - test: Wilcoxon matched-pairs signed rank test
    p: 0.02
    n: 8 neurons
  criterion: Cell-attached recording, 6-s sweeps with the 2-s, 30-Hz train from 2 to 4 s (Fig. 2A
    and 2B). Percent inhibition is "change in discharge rate/basal discharge rate" (Fig. 2C
    legend), with the basal rate from 0 to 2 s and the rate during the train from 2 to 4 s of
    each condition's PSTH, built as in the code (part 2) over the condition's episodes. The
    paper gives no bin width; the rates are taken over the whole windows, so the bin does not
    matter. A per-sweep percent inhibition, its median over sweeps, is shown as a variant.
    Reproduced when a two-sided Wilcoxon signed-rank test of control against quinpirole has P <
    0.05 with less inhibition in quinpirole.
- id: fig2b-inhibition-wanes
  statement: The GPe train initially suppresses SNr spiking strongly, and the inhibition wanes
    during the 2-s train.
  source: Results, D2R agonists inhibited phasic GABA release from GPe terminals, paragraph 2;
    Figure 2A and 2B
  quote: this stimulation effectively suppressed SNr activity, but the efficacy of this
    inhibition waned with time (Fig. 2, A to C)
  criterion: The paper reports no test. From each cell's control PSTH (code, part 2), the rate in
    the first 0.5 s of the train (2 to 2.5 s) and in the last 0.5 s (3.5 to 4 s); the 0.5-s
    windows are a choice made here, as the paper gives none. Reproduced when the last window's
    rate is higher than the first in the PSTH pooled over the 8 cells and in more than half of
    the cells.
- id: fig3a-quinpirole-increases-rate
  statement: Quinpirole alone, with no GPe stimulation, raises the basal spike rate of SNr neurons,
    by about 50% in cell-attached recordings.
  source: Results, D2R agonists lowered tonic GABA release, paragraph 1; Figure 3A
  quote: One of the unexpected observations in these experiments was the ... in the basal
    spiking rate of SNr neurons with bath application of quinpirole, in the absence of GPe axon
    stimulation (P < 0.01 and n = 8) (Fig. 3A). The quinpirole-induced elevation in discharge rate
    was about 50% when monitored in cell-attached mode.
  statistics:
  - test: paired t test
    p: 0.01
    p_relation: "<"
    n: 8 neurons
  expected:
  - quantity: increase in SNr spike rate with quinpirole
    value: 50
    tolerance: 5
    unit: "%"
  criterion: Spike rates as in M1, before and after quinpirole (M4). Reproduced when a two-sided
    paired t test has P < 0.05 with rates higher after, and the increase is within tolerance
    under one reading of M2.
- id: fig3b-gabazine-increases-rate
  statement: Gabazine raises the basal spike rate of SNr neurons by roughly 25%, showing that they
    are tonically inhibited through GABAA receptors.
  source: Results, D2R agonists lowered tonic GABA release, paragraph 1; Figure 3B
  quote: gabazine (10 μM) increased the basal spiking rate of SNr ...
    recorded in cell-attached mode by roughly 25%, suggesting that they were tonically inhibited by
    activation of GABAARs (P < 0.01 and n = 10)
  statistics:
  - about: as given in the Results
    test: not named in the Results
    p: 0.01
    p_relation: "<"
    n: 10 neurons
  - about: as given in the Figure 3B legend
    test: paired t test
    p: 0.01
    p_relation: "<"
    n: 45 neurons
  expected:
  - quantity: increase in SNr spike rate with gabazine
    value: 25
    tolerance: 2.5
    unit: "%"
  criterion: Spike rates as in M1, before and after gabazine 10 uM at 32 to 33 C (M4). The Results
    give n = 10 and the legend n = 45 (Fig. 3B plots about 45 cells; Fig. S4E has 44 at
    physiological temperature, Fig. S1 has 39). The test uses every control cell with gabazine
    alone the dataset holds, and the count is reported (M5). Reproduced when a two-sided paired t
    test has P < 0.05 with rates higher after, and the increase is within tolerance under one
    reading of M2.
- id: fig3d-gabazine-occludes-quinpirole
  statement: In the presence of gabazine, quinpirole does not change SNr spike rate.
  source: Results, D2R agonists lowered tonic GABA release, paragraph 1; Figure 3D
  quote: Indeed, in the presence of gabazine, quinpirole did not modulate SNr spiking rate (P =
    0.13 and n = 7)
  statistics:
  - about: as given in the Results
    test: not named in the Results
    p: 0.13
    n: 7 neurons
  - about: as given in the Figure 3D legend
    test: paired t test
    p: 0.06
    n: 7 neurons
  criterion: A claim of absence (M6). Cells pretreated with gabazine, rate before and after
    quinpirole (M1, M4). Reproduced when a two-sided paired t test gives P >= 0.05; not reproduced
    when it gives P < 0.05. The change in rate is reported either way.
- id: figs1-gabazine-effect-vs-base-rate
  statement: The increase in SNr spike rate with gabazine is weakly and positively correlated with
    the basal rate.
  source: Supplementary Figure S1
  quote: Summary data and linear regression of a weak positive correlation between basal discharge
    rate and the effect of gabazine R2 = 0.11, n = 39
  expected:
  - quantity: R2 of the linear regression of the gabazine change in rate on basal rate
    value: 0.11
    tolerance: 0.011
  criterion: Per cell, the basal rate and the change in rate (Hz) after gabazine (M1, M4), the axes
    of Fig. S1 being "Base Rate" and "Delta". An ordinary least squares fit of the change on the
    basal rate over the cells of fig3b-gabazine-increases-rate. Reproduced when the slope is
    positive and R2 is within tolerance.
  depends_on:
  - fig3b-gabazine-increases-rate
- id: fig4a-gpe-gi-dreadd-reduces-ipsc
  statement: Activating Gi-DREADD in GPe with CNO reduces the amplitude of electrically evoked IPSCs
    in SNr neurons, similar in size to the quinpirole effect on optogenetically evoked IPSCs.
  source: Results, Tonic GABA release was not derived from GPe terminals or astrocytes, paragraph
    1; Figure 4A
  quote: Bath application of the DREADD agonist clozapine-N-oxide (CNO) reduced the ... of
    electrically evoked IPSCs in voltage-clamped SNr neurons (P = 0.02 and n = 4) (Fig. 4A). This
    modulation was similar in ... to that seen in optogenetically evoked IPSCs following D2R
    stimulation.
  statistics:
  - about: as given in the Results
    test: not named in the Results
    p: 0.02
    n: 4 neurons
  - about: as given in the Figure 4A legend
    test: paired t test
    p: 0.01
    p_relation: "<"
    n: 4 neurons
  criterion: IPSC amplitude as in fig1c-quinpirole-reduces-gpe-ipsc, before and after CNO.
    Reproduced when a two-sided paired t test has P < 0.05 with amplitudes lower after, and the
    percent reduction (M2) is within 10 percentage points of the reduction found for
    fig1c-quinpirole-reduces-gpe-ipsc; the paper gives no measure of "similar", so this margin is
    a choice made here, and the two reductions are reported.
  depends_on:
  - fig1c-quinpirole-reduces-gpe-ipsc
- id: fig4b-gpe-gi-dreadd-no-rate-change
  statement: Inhibiting GPe terminals with Gi-DREADD does not change the basal spike rate of SNr
