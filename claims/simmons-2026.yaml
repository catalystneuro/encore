  statistics:
  - about: as given in the Results
    test: not named in the Results
    p: 0.19
    n: 5 neurons
  - about: as given in the Figure 4B legend
    test: paired t test
    p: 0.16
    n: 5 neurons
  criterion: A claim of absence (M6). Rate before and after CNO in slices with GPe Gi-DREADD (M1,
