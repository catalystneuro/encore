  quote: In line with the notion that astrocytes were exciting (not inhibiting) SNr neurons, bath
    application of the bestrophin1 inhibitor NPPB decreased SNr spiking rate (P = 0.03 and n = 6)
  statistics:
  - test: paired t test
    p: 0.03
    n: 6 neurons
  criterion: Rate before and after NPPB (M1, M4); the NPPB concentration is not given. Reproduced
    when a two-sided paired t test has P < 0.05 with rates lower after.
- id: figs2a-d1-antagonist-increases-rate
  statement: The D1R antagonist SCH39166 (2 uM) raises SNr spike rate significantly, by a small
    amount (about 10%).
  source: Results, Dopamine enhanced tonic GABA release from dSPN terminals, paragraph 1; Figure
    S2A; Discussion, Tonic GABAergic signaling..., paragraph 2
  quote: Bath application of SCH39166 (2 μM) did significantly elevate SNr spiking rate (P = 0.02
    and n = 12) ... the modal change in spiking rate produced by antagonizing D1Rs was small (∼10%)
  statistics:
  - test: paired t test
    p: 0.02
    n: 12 neurons
  expected:
  - quantity: change in SNr spike rate with SCH39166
    value: 10
    tolerance: 1
    unit: "%"
  criterion: Rate before and after SCH39166 (M1, M4). Reproduced when a two-sided paired t test
