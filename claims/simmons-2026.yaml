  source: Figure S2B; Results, Dopamine enhanced tonic GABA release from dSPN terminals, paragraph 1
  quote: Bath applied D2R agonist elevates SNr firing rate significantly more than bath applied D1R
    antagonist. Unpaired T-test, n = 8 D2R / 12 D1R, p = 0.03.
  statistics:
  - test: unpaired t test
    p: 0.03
    n: 8 quinpirole and 12 SCH39166 neurons
  criterion: Per cell, the fold change in rate (after over before, the axis of Fig. S2B) for the
