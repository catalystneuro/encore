- id: figs9c-vigabatrin-lowers-perceval
  statement: The GABA-T inhibitor vigabatrin lowers the PercevalHR ATP/ADP ratio in SNc
    dopaminergic neurons.
  source: Results, SNc dopaminergic neurons directly contributed to tonic GABA release, paragraph
    8; Figure S9B and S9C
  quote: Bath application of the GABA-T inhibitor Vigabatrin (44) decreased the PercevalHR ratio,
    consistent with a drop in mitochondrial ATP
  statistics:
  - test: Wilcoxon matched pairs signed rank test
    p: 0.002
    n: 10 neurons from 10 mice (7 wild type with a TH-promoter probe, 3 Aldh1a1-cre with a
      Cre-dependent probe, pooled)
  criterion: Two-photon PercevalHR imaging; F950/F820 ratio per time point after background
    subtraction from a cytosolic region (Methods, 2PLSM optical workstation and PercevalHR
    experiments), in 1.5 mM glucose aCSF. Per cell, the baseline ratio (the stable baseline of
    four acquisitions) against the ratio in vigabatrin 20 uM (Fig. S9 legend); which vigabatrin
    acquisitions are used is open, readings (a) the last acquisition before oligomycin; (b) the
    mean of all vigabatrin acquisitions. Reproduced when, under one reading, a two-sided Wilcoxon
    signed-rank test has P < 0.05 with the ratio lower in vigabatrin.
- id: figs9de-vigabatrin-lowers-oxphos
  statement: Vigabatrin lowers the oligomycin-sensitive (OXPHOS) contribution to cytosolic ATP in
    SNc dopaminergic neurons and leaves the 2-DG-sensitive (glycolytic) contribution unchanged.
  source: Results, SNc dopaminergic neurons directly contributed to tonic GABA release, paragraph
    8; Figure S9D and S9E
  quote: with engagement of the GABA shunt, GABA-T inhibition ... decreased the
    mitochondrial contribution to maintenance of cytosolic ATP levels.
  statistics:
  - about: oligomycin-sensitive contribution, control against vigabatrin
    test: Mann-Whitney test
    p: 0.0017
    n: 6 control cells from 5 mice and 10 vigabatrin cells from 10 mice
  - about: 2-DG-sensitive contribution, control against vigabatrin
    test: Mann-Whitney test
    p: 0.367
    n: 6 control cells from 5 mice and 10 vigabatrin cells from 10 mice
  criterion: Percent oligomycin-sensitive and percent 2-DG-sensitive contributions to the
    PercevalHR ratio (Fig. S9D, E axes), computed as the drop in ratio after oligomycin 10 uM and
    after 2-DG 3.5 mM, each as a percent of the ratio before that step (Methods; Fig. S9 legend);
    the paper does not give the formula, and the other reading, each drop as a percent of the
    baseline ratio, is shown. Reproduced when, under one reading, a two-sided Mann-Whitney test
    gives P < 0.05 for the oligomycin-sensitive part (lower in vigabatrin) and P >= 0.05 for the
    2-DG-sensitive part.
