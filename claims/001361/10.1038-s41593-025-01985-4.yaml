- id: ed6a-rr-near-reward-stable
  statement: RR cells that first fired closer to reward were more likely to keep stable RR tuning
    across days, and TR cells closer to reward were more likely to remap relative to the track and
    become RR.
  source: Results, Dynamic cell recruitment into the RR population, paragraph 1; Extended Data Fig. 6a
  quote: Furthermore, RR cells that originally fired closer to reward were more likely to have stable
    RR tuning over days, and TR cells closer to reward were more likely to remap with respect to the
    track and become RR
  expected:
  - quantity: RR cells followed across switch-day pairs (day-A category)
    value: 2294
    tolerance: 229.4
  - quantity: TR cells followed across switch-day pairs (day-A category)
    value: 3408
    tolerance: 340.8
  criterion: As the Extended Data Fig. 6a legend and Fig5_Ext6_TrackingCellsAcrossDays.md:672-838 give
    it. For cells matched across consecutive switch-day pairs, categorized on day A, the absolute
    cross-day change in the pre-switch peak relative to reward (RR cells) and in track position (TR
    cells), binned by the day-A distance from the zone start in 10 cm bins (mean +/- s.e.m. over
    pooled cells, smoothed with a 10 cm s.d. Gaussian for display). The paper reports no test and no
    boundary between near and far, so how "closer to reward" is judged is open. Readings (a) the
    change within 50 cm of the zone start against beyond it (the near and far boundary of Figure
    4m), two-sided Wilcoxon rank-sum over pooled cells at p < 0.05; (b) a linear regression of the
    change on the day-A absolute distance from the zone start over pooled cells (the test Extended
    Data Fig. 6c uses for the neighbouring panel), at p < 0.05. Reproduced when under both readings
    the RR reward-relative change is smaller near reward (a) or grows with distance (b), and the TR
    track change is larger near reward (a) or falls with distance (b); not reproduced when both
    readings fail; blocked as methods_underspecified when they disagree. The binned curves are
    reported.
  depends_on:
  - fig5b-rr-remain-rr-increases
- id: ed6c-rr-shift-toward-reward
  statement: RR cells that stayed RR across switch-day pairs shifted their peaks slightly toward the
    reward zone start over days, their initial position being weakly anticorrelated with the change.
  source: Results, Dynamic cell recruitment into the RR population, paragraph 1; Extended Data Fig.
    6b,c
  quote: RR cells near reward shifted their peak firing even closer to the reward zone start over days
  expected:
    quantity: RR cells staying RR, within 80 cm of the zone start
    value: 551
    tolerance: 55.1
  criterion: RR cells RR on both days of a pair, day-A relative peak within 80 cm of the zone start,
    the signed cross-day change against the day-A position, linear regression (legend; code at
    Fig5_Ext6_TrackingCellsAcrossDays.md:841-978). Reproduced when the slope is negative at p < 0.05.
  depends_on:
  - fig5b-rr-remain-rr-increases
- id: ed6-across-day-drift
  statement: Across-day sequence correlations of RR and TR cells were generally lower than within-day
    sequence correlations, consistent with representational drift.
  source: Results, Dynamic cell recruitment into the RR population, paragraph 2; Extended Data Fig. 6j-m;
    Figure 4c,f
  quote: Although sequence preservation across switch days was greater than chance in some sessions,
    correlation coefficients across days were generally lower (Extended Data Fig. 6j–m ) than
    within-day sequences (Fig. 4c,f )
  criterion: Across-day correlation as the Methods give it (Sequence detection and quantification),
    the sort from day-A trials before the switch, correlating day-A after-switch peaks with day-B
    before-switch peaks of matched cells, at least 5 cells. The Results cite panels j-m, which hold
    two cell sets; readings for the cells (a) cells followed agnostic of their day-B category (panels
    j for RR, l for TR), (b) cells keeping their category on day B (panels k, m). The paper names no
    test for "generally lower"; the comparison of medians is a reading, not the paper's. Reproduced
    under a cell reading when the median across-day rho over mouse-pairs is below the median
    within-day rho of fig4c-rr-sequences-preserved for RR cells and of fig4f-tr-sequences-preserved
    for TR cells.
  depends_on:
  - fig4c-rr-sequences-preserved
  - fig4f-tr-sequences-preserved
  - fig5b-rr-remain-rr-increases
