# Claims for Sosa, Plitt & Giocomo (2025), "A flexible hippocampal population code for experience
# relative to reward", Nature Neuroscience 28, 1497-1509, on dandiset 001361.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21, protocol
# pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record, open access, as served by Europe PMC (PMC12229899), with the
# main text, figure legends, Extended Data Figs. 1-10 legends and Methods, and the one supplement
# file in the PMC deposit, the Nature Portfolio Reporting Summary (41593_2025_1985_MOESM1_ESM.pdf).
# The Source Data files are not part of the text read. The paper names a bioRxiv preprint (4 Feb
# 2024, "Hippocampal sequences span experience relative to rewards"), which was not read.
#
# Code read: github.com/GiocomoLab/Sosa_et_al_2024 at commit adf0f9ed3defa22275d92fa0ed996f47008e05b3
# (11 Jun 2025). It holds the package src/reward_relative (dayData.py for session and cell
# classes, spatial.py for place cells and remapping categories, behavior.py for licking, decode.py
# for the circular regression decoder, glmUtils.py for the GLM design, kMeansDistScore.py and
# regression.py for the distance score and sigmoid, multiDayROIAlign.py for cross-day matching,
# plotUtils.py for the mixed models) and one notebook per figure (Fig1_Ext1 to Fig8_Ext10_DistanceScore,
# Ext3_FieldQuant, Ext7_Anatomical_Map), with jupytext .md copies cited below as "notebook.md:line".
# The spatial information, its shuffle and the ROI matching run in the external package TwoPUtils
# (M. Plitt), which the repository does not hold; for these the Methods alone fix the method.
#
# Data the paper used: 14 C57BL/6J mice (7 male, 7 female). 11 "switch" mice (m3, m4, m7, m11, m12,
# m13, m14, m15, m17, m18, m19, as the Extended Data Fig. 7 and 8 legends list them; Extended Data
# Fig. 1d gives the identities) and 3 "fixed-condition" mice (one reward zone, ENV 1, for all 14
# days; m2 is one, Extended Data Fig. 6d). m11 was imaged from day 3 only (2P imaging, Methods). Two-photon imaging of dorsal CA1 (GCaMP7f, ~15.5 Hz, one session per day for 14 days, ~80
# trials per session, 80.5 +/- 7.4 trials, 155 to 2,172 neurons per session; two mice, m17 and m18,
# imaged in two planes, deep and superficial). Head-fixed mice ran a 450 cm virtual linear track with
# a hidden 50 cm reward zone at A (80-130 cm), B (200-250 cm) or C (320-370 cm); the zone moved after
# trial 30 on switch days 3, 5, 7, 8, 10, 12 and 14 (day 8 also changed the environment, ENV 1 to ENV
# 2 for 9 mice and the reverse for m17 and m18); reward was omitted on ~15% of trials; a teleport
# period (jittered gray screen 1-5 s, 5-10 s after omissions or misses, then a 50 cm gray tunnel)
# separated laps, imaged in some sessions only (2P imaging, Methods). Variables used: per-ROI dF/F and
# deconvolved activity (OASIS), ROI masks and their matching across days, track position, running
# speed, licks (capacitive sensor), reward delivery and omission per trial, reward zone per trial,
# environment, z-stack depth estimates per ROI (single-plane mice, day 14). Switch-task analyses use
# 11 mice and 77 switch sessions (7 days x 11 mice).
#
# The paper's other deposits: Figshare 10.25452/figshare.plus.27098065 (pre-processed neural and
# behavioral data with raw fluorescence) and 10.25452/figshare.plus.27138633 (post-processed data
# class with reward-relative cells identified). The DANDI version the paper cites is 0.250406.0045.
# No claim here needs them: every claim's test uses the recorded data (data: dataset).
#
# Conventions. A trial set is trials 1-30 (before the switch) and 31 to the end (after), as the
# Methods give it ("Each switch occurred after 30 trials") and behavior.py:77-157 codes it; on days
# without a switch the first and second halves. Speed below 2 cm/s is excluded from all spatial
# activity (Methods, Place cell identification). Place cells are cells with significant spatial
# information (SI) before or after the switch, as the Methods define it; cells whose dF/F correlates
# with running speed at Pearson r > 0.5 are excluded first (Methods, Calcium data processing).
# Percentages of cells are mean +/- s.d. over mouse-and-switch-day values, as the code computes them
# (pandas mean and std over mouse-day rows, Fig2_Ext2_identifyRewardRelative.md:365-440); the
# Methods say only "mean +/- s.d. out of all place cells identified on the specified days".
# Tolerances. A value given as mean +/- s.e.m. takes the s.e.m. as its tolerance; a confidence
# interval gives its half-width. A mean given +/- s.d. takes 10% of the mean, since the s.d. is the
# spread over mice and days, not an uncertainty of the mean. Counts of cells or sessions take 10%.
#
# Where the Methods and the code disagree, the Methods give the main reading and the code's choice
# is a variant, named in the claim. The ones that recur are these. (1) Circular bins. The Methods give
# 2pi/45 (~10 cm); the code builds circular maps and decoder bins from np.linspace(-pi, pi, 45),
# a step of 2pi/44 (dayData.py:954-957, Fig3_Decoder.md:177). (2) Shuffle offsets. The Methods give
# 0-44 bins (random remapping) and 1-45 bins (cross-correlation); the code draws 0 to nbins-1 and 1
# to nbins-1 (dayData.py:1076-1108, 1353-1451).
