  source: Results, Reward-relative remapping both near and far from reward, paragraph 3; Figure 3c
  quote: Moreover, this above-shuffle decode of RR position using RR cells was significant across the
    majority of the environment (Fig. 3c ; range of z -scored decode >2... −104.5 ± 20.1 cm to +152.7
