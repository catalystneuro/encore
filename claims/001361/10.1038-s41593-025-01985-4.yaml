    tolerance: 108.2
  - quantity: remapping cells, day 14, pooled over 11 mice
    value: 1153
    tolerance: 115.3
  criterion: As the Methods give it (Quantification of RR remapping compared to chance). Cells with
    significant SI before and after the switch, TR cells (peaks within 0.698 rad, 50 cm) removed;
    peaks re-computed on circular coordinates (0-450 cm to -pi..pi) and expressed relative to each
    zone start; the circular difference of relative peaks (after minus before), pooled over mice,
