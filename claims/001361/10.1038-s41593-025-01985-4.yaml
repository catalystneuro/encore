  statement: RR and TR cells showed no reliable bias in their medio-lateral, antero-posterior or
    superficial-deep distribution within CA1.
  source: Results, Dynamic cell recruitment into the RR population, paragraph 2; Extended Data Fig. 7
  quote: However, we found no reliable bias in the medio-lateral, antero-posterior or superficial-deep
    distributions of either subpopulation (Extended Data Fig. 7 )
  expected:
  - quantity: mice or planes with a significant RR against TR difference, ML axis, of 13
    value: 2
    tolerance: 1
  - quantity: mice or planes with a significant difference, AP axis, of 13
    value: 1
    tolerance: 1
  - quantity: single-plane mice with a significant difference, depth, of 9
    value: 1
    tolerance: 1
  criterion: A claim of absence, judged on the paper's tests (Extended Data Fig. 7b,c,h legends). Per
    mouse (and per plane in m17 and m18), cells pooled over the seven switch days, a two-sided
    Wilcoxon rank-sum test of RR against TR ROI centres of mass in ML and AP, at the legend's
    Bonferroni level p < 0.0038, and of estimated depth in single-plane mice at p < 0.0055. The
    code applies no correction (Ext7_Anatomical_Map.md:605-672). Counts tolerate one test, the
    smallest unit. Reproduced when in each axis the count of significant mice or planes is no more
