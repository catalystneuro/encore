    gave the highest relative contribution and was the top predictor for 32.8%, followed by speed
    (21.3%), track position (17.6%) and reward (14.0%); ~56% of well-fit RR cells had RR position as
    first or second predictor.
  source: Results, Encoding of reward proximity versus movement covariates, paragraph 4; Figure 7d,e;
    Extended Data Fig. 9d,e
  quote: Track position was the top predictor for 81.3% of TR cells (Fig. 7e ) ... For RR cells, RR
    position provided the highest relative contribution at the population level (Fig. 7d ) and the top
    predictor for 32.8% of RR cells, followed by speed (21.3%), linear track position (17.6%) and the
    receipt of reward (14.0%) ... Overall, ~56% of RR neurons well-fit by the GLM had RR position as a
    first or second predictor
  expected:
  - quantity: TR cells with track position as top predictor
    value: 81.3
    tolerance: 8.13
    unit: '%'
  - quantity: RR cells with RR position as top predictor
    value: 32.8
    tolerance: 3.28
    unit: '%'
  - quantity: RR cells with speed as top predictor
    value: 21.3
    tolerance: 2.13
    unit: '%'
  - quantity: RR cells with track position as top predictor
    value: 17.6
    tolerance: 1.76
    unit: '%'
  - quantity: RR cells with reward as top predictor
    value: 14.0
    tolerance: 1.4
    unit: '%'
  - quantity: RR cells with RR position first or second
    value: 56
    tolerance: 5.6
    unit: '%'
  criterion: The well-fit cells of glm-well-fit-cells, pooled over mice and switch days. Relative
    contribution by ablation as the Methods give it, (dev_ablated - dev_full)/(dev_null - dev_full)
    on the cross-validation data, each variable's coefficients zeroed, binned by track position and
    averaged over bins (Fig7_Ext9_GLM.md:426-512). Top predictor, the variable with the largest
    contribution; second, the largest of the rest (Fig7_Ext9_GLM.md:854-1052). Figure 7d, the
    variable with the highest median contribution in each subpopulation must be track position for TR
