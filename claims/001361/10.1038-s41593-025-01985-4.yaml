claims:
- id: fig1h-lick-ratio-improves
  statement: After each reward switch, every switch mouse improved its anticipatory licking before
    the new reward zone and kept that precise licking, as measured by the anticipatory lick ratio
    over blocks of ten trials.
  source: Results, Monitoring neural activity during a reward learning task, paragraph 2; Figure 1h
  quote: All mice improved and retained precise licking preceding the new reward zone (Fig. 1h ; n = 11
    mice), demonstrating accurate spatial learning and memory
  criterion: The anticipatory lick ratio as the Methods define it (Quantification of licking behavior),
    (lick in - lick out)/(lick in + lick out), lick in being the mean lick rate in the 50 cm before
    the reward zone start and lick out the mean rate outside that zone and the reward zone, licks
    binned in 10 cm bins and divided by occupancy, trials with sensor errors (more than 30% of
    frames with a cumulative lick count above 2) removed; computed per trial and averaged over
    blocks of ten trials within each reward zone, as Fig1_Ext1.md:474-690 and behavior.py:876-951
    do (np.array_split into ceil(n/10) blocks). The paper reports no test and does not say what
    "improved" is measured against. Readings (a) for each mouse and each switch day, the mean ratio
    of the last block after the switch exceeds that of the first block after the switch; (b) for
    each mouse, the mean over its switch days of (last block after minus first block after) is
    positive. Reproduced when all 11 mice improve under a reading and, for "retained", each mouse's
    mean ratio over the first block of the day after each switch day (a stay day, or the next
    switch day's pre-switch trials) is above 0. Partially reproduced when 9 or 10 mice meet it.
