- id: fig8e-rr-remap-precedes-behavior
  statement: The RR population's remap trial preceded the licking remap trial by about two trials for
    backward (2.1 +/- 0.6) and forward (1.7 +/- 0.7) reward moves, preceded the speed remap trial by
    4.4 +/- 1.1 trials for backward moves, and was synchronous with speed for forward moves (0.5 +/-
    0.5).
  source: Results, RR cell activity often updates before behavior, paragraph 2; Figure 8e
  quote: Neural remapping preceded changes in licking by approximately two trials regardless of whether
    the reward was moved backward or forward on the track (backward... 2.1 ± 0.6 trials (mean ± s.e.m.),
    neural before licking; forward... 1.7 ± 0.7 trials), but only preceded changes in speed when reward
    was moved backward (4.4 ± 1.1 trials, neural before speed) and was synchronous with speed when
    reward was moved forward (0.5 ± 0.5 trials before speed)
  statistics:
  - about: licking minus PV remap trial
    test: linear mixed-effects model, two-sided coefficient t-test
    statistic: β = 2.125
    p: 0.042
    corrected: Benjamini-Hochberg
    n: 10 mice
  - about: speed minus PV remap trial
    test: linear mixed-effects model, two-sided coefficient t-test
    statistic: β = 4.417
    p: 9.0e-6
    corrected: Benjamini-Hochberg
  - about: forward switch direction x (speed minus PV)
    test: linear mixed-effects model, two-sided coefficient t-test
    statistic: β = -3.871
    p: 0.011
    corrected: Benjamini-Hochberg
  expected:
  - quantity: licking minus PV remap trial, backward
    value: 2.1
    tolerance: 0.6
    unit: trials
  - quantity: licking minus PV remap trial, forward
    value: 1.7
    tolerance: 0.7
    unit: trials
  - quantity: speed minus PV remap trial, backward
    value: 4.4
    tolerance: 1.1
    unit: trials
  - quantity: speed minus PV remap trial, forward
    value: 0.5
    tolerance: 0.5
    unit: trials
  criterion: As the Methods give it (K-means clustering and distance score analysis). Per session and
    RR population, deconvolved activity in 10 cm bins smoothed (10 cm Gaussian), min-max scaled per
    cell; lvl factorized k-means, k = 2, 100 restarts; sessions accepted when the k = 2 model beats
    rotation shuffles on speckled holdout (50 repeats) by a Wilcoxon test at P < 0.05 (the Methods
    say two-sided, the code one-sided greater, kMeansDistScore.py:211-217; both shown; the paper
    accepted 50 of 77); cluster labels set so cluster one comes first; distance score; sigmoid
    L/(1 + exp(-k(x - x0))) + b by curve_fit (dogbox, p0 [max y, median x, 1, min y]), its
    inflection the remap trial (regression.py:172-195); the same for max-normalized binned licks
    and speed; sessions kept when all three fits converge. Direction, forward when the new zone is
    further down the track. Mixed model remap_trial ~ C(datatype, reference PV) * C(direction) +
    switch, random intercept per mouse, coefficient p Benjamini-Hochberg corrected
    (Fig8_Ext10_DistanceScore.md:759-790). The four values equal the model's coefficients
    (backward lick 2.125; forward 2.125 - 0.398; backward speed 4.417; forward 4.417 - 3.871), but
    the paper does not say how the "mean +/- s.e.m." is taken. Readings (a) the model coefficients
    and their combinations; (b) mean over sessions of per-session differences; (c) mean over mice of
    per-mouse means. Reproduced under a reading when the four values are within tolerance and the
    lick - PV and speed - PV coefficients are positive and the interaction negative at corrected p
    < 0.05.
  depends_on:
  - rr-cell-fractions
