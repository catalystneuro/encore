- id: glm-well-fit-cells
  statement: The GLM fit well (fraction deviance explained above 0.15 on held-out trials) 33% of place
    cells, 4,106 of 7,027 TR cells, 2,122 of 5,979 RR cells and 1,748 of 4,314 non-RR remapping cells;
    mean fraction deviance explained was 0.32 for TR cells and 0.29 for RR cells.
  source: Results, Encoding of reward proximity versus movement covariates, paragraph 3; Extended Data
    Fig. 9b,c
  quote: Only well-fit neurons (fraction deviance explained > 0.15) 37 were included in further analysis
    (33% of place cells across 11 mice and seven switch days; TR cells, 4,106 out of 7,027; RR cells,
    2,122 out of 5,979; non-RR remapping cells, 1,748 out of 4,314
  expected:
  - quantity: well-fit place cells, % (11605 of 35386)
    value: 33
    tolerance: 3.3
    unit: '%'
  - quantity: well-fit TR cells
    value: 4106
    tolerance: 410.6
  - quantity: well-fit RR cells
    value: 2122
    tolerance: 212.2
  - quantity: well-fit non-RR remapping cells
    value: 1748
    tolerance: 174.8
  - quantity: mean FDE, TR cells (well-fit)
    value: 0.32
    tolerance: 0.032
  - quantity: mean FDE, RR cells (well-fit)
    value: 0.29
    tolerance: 0.029
  criterion: As the Methods give it (GLM). Poisson GLM at ~15.5 Hz, speed of 2 cm/s or more; 45 cosine
    bases of track position, 45 of RR position, 45 of rewarded x position, 7 B-spline bases (degree
    3, 5 knots, on quantile-transformed values) for each of speed, acceleration (5-sample Gaussian)
    and licks (2-sample Gaussian), z-scored; trials split 85/15 by GroupShuffleSplit separately for
    rewarded-before, rewarded-after and omission trials, random_state 30 (Fig7_Ext9_GLM.md:284);
    fivefold cross-validation grouped by trial over the training trials; GLM_Tensorflow_2 GLM_CV with
    group lasso, lambda 10^linspace(-1, -6, 11), Adam, learning rate 0.01, exponential link,
    lambda chosen by best cross-validated deviance (Fig7_Ext9_GLM.md:292-302); FDE = 1 - dev_model /
    dev_null on the held-out trials. The response is the deconvolved activity (the code scales it by
    10, which leaves FDE unchanged). The Methods give "0.32 +/- 0.13 for TR cells" and "0.29 +/- 0.11
    for RR cells" next to 0.10 for all place cells and do not say over which cells; readings for
    the FDE means (a) the well-fit cells, (b) all cells of the subpopulation. The values match under
    a reading when all are within tolerance.
  depends_on:
  - rr-cell-fractions
