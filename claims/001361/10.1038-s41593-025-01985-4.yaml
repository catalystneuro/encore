- id: fig4c-rr-sequences-preserved
  statement: RR cells formed sequences whose firing order was preserved across the reward switch, above
    a cell-identity shuffle in 75 of 77 sessions.
  source: Results, Preserved behavioral timescale sequences relative to reward, paragraph 1; Figure 4a-c
  quote: Sequence preservation (the circular–circular correlation coefficient between peak firing
    positions pre-switch versus post-switch) was higher than the shuffle of cell identities for nearly
    all animals and days (75 out of 77 sessions)
  expected:
    quantity: sessions with RR sequence above shuffle
    value: 75
    tolerance: 7.5
  criterion: As the Methods give it (Sequence detection and quantification). Unsmoothed binned dF/F in
