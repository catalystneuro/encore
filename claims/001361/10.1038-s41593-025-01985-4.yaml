  statement: On the first switch day the fraction of remapping place cells whose firing kept the same
    position relative to reward exceeded a random-remapping shuffle.
  source: Results, Reward-relative remapping both near and far from reward, paragraph 2; Figure 2d,e
  quote: We found that the fraction of place cells that exhibited RR remapping across animals (Fig. 2d
    ) exceeded chance on the first switch day (Fig. 2e , top)
