- id: fig3b-decode-rr-position
  statement: A decoder trained before the switch decoded reward-relative position above shuffle from
    RR, TR and non-RR remapping cells when tested before the switch, but only RR cells decoded it
    above shuffle on trials after the switch.
  source: Results, Reward-relative remapping both near and far from reward, paragraph 3; Figure 3b
  quote: However, when we tested on trials after the reward switch, only the RR population decoded the
    animals’ RR position better than shuffle (Fig. 3b , bottom)
  statistics:
  - about: each subpopulation against its shuffle (the starred comparisons)
    test: two-sided Wilcoxon signed-rank
    p: 7.54e-14
    corrected: Bonferroni
    n: 77 sessions, 11 mice, seven switch days
  expected:
  - quantity: effect size, test before, RR
    value: 2.6
    tolerance: 0.26
  - quantity: effect size, test before, TR
    value: 3.3
    tolerance: 0.33
  - quantity: effect size, test before, non-RR
    value: 3.2
    tolerance: 0.32
  - quantity: effect size, test after, RR
    value: 2.7
    tolerance: 0.27
  - quantity: effect size, test after, TR
    value: -0.5
    tolerance: 0.05
  - quantity: effect size, test after, non-RR
    value: -0.2
    tolerance: 0.02
  criterion: As the Methods give it (Decoding of RR position). The circular-linear regression decoder
    of decode.py (CircularRegression, ridge 1e-4, tol 1e-5, 100 iterations, Fig3_Decoder.md:302) on
    deconvolved activity of the RR, TR or non-RR cells at speed above 2 cm/s, predicting position
    relative to the zone start; score cos(y - y_hat); tenfold cross-validation; data downsampled to
    equal occupancy per RR position bin (2pi/45) within trials before the switch or the last 30
    trials after; 100 shuffles circularly shifting each cell's timeseries independently. Per session,
    the mean score against the mean of the shuffles; two-sided Wilcoxon signed-rank over sessions
    per subpopulation, Bonferroni over the three subpopulations; effect size Hedges' g (pingouin
    pairwise_ttests, effsize hedges, Fig3_Decoder.md:982). Reproduced when all three exceed shuffle
    at corrected p < 0.05 tested before, RR exceeds shuffle tested after, and TR and non-RR do not
    (p of 0.05 or more, or real below shuffle); the effect sizes are compared with tolerance as
    well. Code variants shown, all post-switch trials in place of the last 30 (Fig3_Decoder.md:173,
    423), 2pi/44 bins (Fig3_Decoder.md:177), contiguous test folds (decode.py:124).
  depends_on:
  - rr-cell-fractions
