- id: fig7a-olm-sag
  statement: O-LM interneurons recorded in CXCR4-EGFP slices show a sag in their voltage
    response to hyperpolarizing current pulses (pulses of -100 and +50 pA in Figure 7A), and the
    ChR2-expressing O-LM cell of Figure 7D has a similar firing pattern.
  source: Figure 7A and 7D legends
  quote: Firingpatternsoftheaboveshowncells.Noticethepresenceofasaginthehyperpolarizingresponse.
    ... Notice the similarity with the firing patterns shown in A.
  criterion: The paper shows the sag in example traces and does not define a measure, so the
    measure is open. Taken from the legend, the -100 pA step is the hyperpolarizing response
    to examine. The readings the legend allows are (a) a visible sag, read as a depolarizing
    relaxation from the peak hyperpolarization during the -100 pA step to the mean voltage
    over its last 100 ms larger than twice the SD of the pre-step baseline voltage; (b) a sag
    ratio, (V_end - V_min) / (V_baseline - V_min), of at least 0.1, a common convention. Both
    are standard choices, not the paper's, and the outcome rests on that assumption. Each of
    the data set's cells is judged; reproduced when every cell shows a sag under both readings,
    partially reproduced when most do, not reproduced otherwise. Should the readings disagree,
    both results are shown and the claim is marked as resting on an assumption.
