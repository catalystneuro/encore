# Claims for Zandvakili & Kohn (2015), Neuron 87, 827-839, "Coordinated Neuronal Activity Enhances
# Corticocortical Communication" (doi:10.1016/j.neuron.2015.07.026), on CRCNS data set v1v2-1.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-10,
# protocol as stated in docs/protocol.md (Reader), version pilot-14.
#
# Text read. The version of record as supplied under paper/ (PyMuPDF text of the journal PDF, with
# the Supplemental Information appended): Results, Discussion, figure legends, Experimental
# Procedures, and the supplement (Figures S1 to S6 with their texts, Supplemental Experimental
# Procedures). The PDF pages could not be rendered in this run, so no figure was read from the
# image; every value below is from the text. The extracted text prints the degree sign as a
# replacement glyph and a few dashes oddly; one such case is named in figS5-middle-layer-relay.
#
# Code. The paper links no analysis code and names no repository. No code was read; every
# method below is from the Experimental Procedures, the Results, the figure legends or the
# supplement, and details none of them fixes are named as open.
#
# Data the paper used. Nine hemispheres of seven anesthetized (sufentanil), paralyzed adult male
# Macaca fascicularis. V1 recorded with a 10 x 10 Utah array (1 mm electrodes, 400 um spacing,
# layers 2/3 and 4B), RFs 2 to 4 deg from the fovea; 10 array implants, V1 populations of 61 to 160
# units (average 98). V2 recorded with seven moveable electrodes and tetrodes (300 um spacing) in
# translaminar penetrations through V1 and the white matter; 16 penetrations and 55 V2 recording
# sites (the CCG analysis counts 223 V2 sites, one per electrode and site), 896 V2 cells in all.
# Units are single units and small clusters with waveform SNR of 2 or more and a mean rate of at
# least 0.5 sp/s across stimuli. V2 depth is given relative to the layer 6/white matter border.
# Stimuli are full-contrast drifting gratings (1 cycle/deg, 3 to 6.5 Hz, typically 2 to 3.5 deg) of 8
# orientations at 22.5 deg steps, 1.28 s each with 1.5 s blanks, 300 to 400 presentations each;
# RFs were mapped with 0.6 deg gratings and fit with a 2D Gaussian (diameter as +/-2 SD). Measured
# variables are spike times of V1 and V2 units per trial, stimulus orientation, RF fits, V2 site
# depth and unit SNR. The CRCNS data set, by its title and description, holds 5 of these recording
# sessions in 3 animals (V1 array and V2 tetrodes, spike times, stimulus identity per trial and
# RF fits per channel), so the paper's totals (896 V2 cells, 223 sites, 83,441 pairs, the epoch
# counts) describe a larger sample than the data set; proportions and medians are the values the
# attempt compares, and counts are reported beside them.
#
# Shared CCG method (Experimental Procedures, Pairwise V1-V2 Analysis). Spike trains as binary
# series at 0.1 ms; CCG of Equation 1 (normalized by trial count, the triangular overlap function
# Q and the V1 rate), computed per stimulus, shuffle-corrected for stimulus-locked correlation,
# then combined over stimuli. Jitter-corrected CCG is the CCG minus the expected CCG of jittered
# data (Smith and Kohn 2008), smoothed with a Gaussian of SD 1.5 ms. A pair, or a V2 site from its
# site-average CCG over all V1-V2 pairs at that V2 electrode and site, is significant when the
# jitter-corrected peak within 10 ms of zero lag exceeds 5 SD of the noise in the flanks (75 to 125
# ms on both sides). Open, and named where it matters: (j-a) the CCG jitter window, given only as
# 10 ms for Figure 4C (used here for all narrow-peak tests) or (j-b) another window; the analysis
# window within the trial (the whole 1.28 s, or from 50 ms after onset as in the divergence
# analysis), a standard choice that is not expected to change the outcome; whether the peak is
# the maximum of the smoothed CCG (used here) or of the raw one.
#
# Shared divergence method (Experimental Procedures, Divergence Analysis; Results, V2 Spiking Is
# Preceded by Stronger V1 Coordination). The V1 network state is the proportion of V1 units active
# in a 1 ms window. For each spike of each V2 neuron in a group, the states in the epoch 1.5 to 3.5
# ms before (or, for other offsets, around) the spike are pooled into one distribution over all
# spikes and neurons of the group. Responses are used from 50 ms after stimulus onset to the end
# of the stimulus. The surrogate distribution comes from the same epochs in jittered V1 data:
# jitter windows tile the trial from 50 ms after stimulus onset, and each V1 spike is replaced by
# one drawn with replacement from the spikes that neuron fired in the same window on other trials,
# so each neuron's count per window and trial is kept. Windows are 5, 10, 20, 40, 80 and 1280 ms
# (Figure 6; Figure 7 uses 5 to 80). Divergence is Jensen-Shannon (Equations 2 and 3), in bits
# (log base 2, as the figures label bits). Control epochs take, for each V2 spike, an epoch from
# another trial at the same time after stimulus onset, as many control epochs as spike epochs.
# Confidence intervals by bootstrap over V2 neurons resampled with replacement, 5000 draws (Figure
# 6 legend), 95% intervals (Figure 7 legend). Open, and named where they matter: (e-a) the 2 ms
# epoch contributes its two 1 ms bins (1.5 to 2.5 and 2.5 to 3.5 ms before the spike) or (e-b) the
# one 1 ms bin centred 2.5 ms before; (s-a) the jittered spikes and the control trials are taken
# from trials of the same grating orientation (the CCGs are computed per stimulus) or (s-b) from
# all trials; (r-a) one jitter realization per divergence or (r-b) the mean distribution of
# several; (p-a) the bootstrap p-value as the fraction of draws, neurons resampled once and used
# for both spike and control epochs, in which the control divergence is at least the spike
# divergence, or (p-b) the two bootstrap distributions compared as independent (fraction of
# draw pairs where control is at least spike); (d-a) the states of all spikes of all neurons of
# the group pooled into one distribution, or (d-b) the mean of the per-neuron distributions (the
# Results say "an average distribution of V1 network states" in epochs before "each spike of each
# V2 neuron", which allows both). The paper names no test for its p-values; the bootstrap is the
# procedure it describes for the intervals. A comparison is significant at p < 0.05 two-sided
# under the reading in use. The outcome is the one all readings give; where they differ, every
# result is shown and the readings that match are named.
#
# Layer groups (Results; Experimental Procedures). Middle-layer V2 sites are those whose
# site-average V1-V2 CCG has a significant narrow peak, chosen per electrode. Non-middle sites are
# those superficial to or deeper than such sites in the same penetration. Offset-RF neurons are V2
# neurons 500 to 1000 um from the layer 6/WM border whose RF centre is at least 3 deg from the centre
# of the V1 population. The paper does not define "the center of the V1 population"; readings
# (o-a) the mean of the V1 RF centres, (o-b) the centre of the aggregate RF of the V1 units, on
# which the stimuli were centred (Visual Stimuli).
