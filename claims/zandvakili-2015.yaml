claims:
- id: fig4c-broad-ccg-peaks
  statement: V1-V2 CCGs frequently have broad peaks, tens to hundreds of milliseconds wide, evident
    in site-average CCGs at all laminar locations.
  source: Results, V1-V2 Recordings, paragraph 4 ("To understand how"); Figure 4C, left
  quote: We frequently observed broad peaks in V1-V2 CCGs, tens to hundreds of milliseconds wide.
    These were evident in the average V1-V2 CCGs at all laminar locations
  criterion: Site-average shuffle-corrected CCGs (shared CCG method, not jitter-corrected). The
    paper gives no test for a broad peak, so one is fixed here and is open. Readings, (a) the mean
    CCG over lags -50 to +50 ms is above the mean over the 75 to 125 ms flanks; (b) the mean over
    lags -50 to +50 ms is above zero. Reproduced when, under one reading, a majority of V2 sites
    have such a peak and sites both with and without a significant narrow peak have it. The
    fraction of sites and the width at half height of the across-site average are reported.
- id: fig4c-narrow-peak-sites
  statement: A significant narrow peak in the site-average V1-V2 CCG occurs at a minority of V2
    sites (46 of 223).
  source: Results, V1-V2 Recordings, paragraph 5 ("At a subset of V2 sites")
  quote: Average V1-V2 CCGs contained a significant narrow peak at 46 of 223 V2 sites
  expected:
  - quantity: fraction of V2 sites with a significant site-average narrow peak
    value: 0.206
    tolerance: 0.021
  criterion: Shared CCG method, site-average jitter-corrected CCG per V2 electrode and site, 5 SD
    rule. The paper's sample targeted middle-layer sites in some penetrations (Experimental
    Procedures, Physiology), so the fraction depends on sampling; the count of sites and of
    significant sites is reported beside the fraction.
