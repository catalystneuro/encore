# Claims for Gao, Ramachandran, Yu & He (2025), J Neurosci 45(23):e2218242025, on dandiset 000637.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record as served by PubMed Central (PMC12139594), full text with
# Materials and Methods, Results, figure legends and Discussion (paper/10.1523-jneurosci.2218-24.2025.txt).
# The paper has no supplement. No PDF was supplied. The equation defining the directional spike time
# tiling coefficient (dSTTC) is lost in the text ("The definition for dSTTC is as follows:" is followed
# by the prose that defines its terms, without the formula); its form is treated as open below.
# The paper links no analysis code (no repository and no code availability statement in the text),
# so no code was read.
#
# Data the paper used (Materials and Methods). Male Wistar rats (Hsd WI), 250 to 350 g, 3 to 6 months,
# under 2% isoflurane. Group 1 (N = 16): two 32-channel NeuroNexus probes, one in S1 (AP -2, ML 2.5,
# 40 degrees, 1 to 1.3 mm deep, layers III to V) and one in POm (AP -4.5, ML 2.6, 20 degrees, 5.8 mm).
# Group 2 (N = 12, auditory confound): probes in S1 and auditory cortex (AC; AP -4.5, ML 6.5).
# tFUS from a 128-element random array (H276, 1.5 MHz) steered to S1; ultrasound duration (UD) 67 ms;
# intersonication interval 2.5 s with 10% jitter; 500 trials per parameter; condition order randomized.
# Conditions: PRF 30, 300, 1500, 3000 and 4500 Hz at constant 200 us pulse duration (which gives DC 0.6,
# 6, 30, 60 and 90%); DC 0.6, 6, 30, 60 and 90% at 3000 Hz and at 30 Hz PRF; PRFs at constant 60% DC;
# sham sessions without tFUS; control sessions with tFUS steered to cingulate cortex (CG1, AP 3, ML 0).
# Recorded with a TDT system, band-passed 300 Hz to 5 kHz, sorted in Plexon Offline Sorter (threshold
# -3.5 SD, k-means). Measured variables: spike times and waveforms of sorted units, and stimulus onset
# times. The paper says all its data are in DANDI:000946 (Data acquisition and preprocessing). The
# description of dandiset 000637 lists S1 recordings with a 32-channel array, PRFs 30 to 4500 Hz and
# pulse durations of 100, 200 and 400 us (called UDs there), 500 trials per recording, spike times and
# trial event times. Which of the paper's groups and conditions it holds (POm, AC, sham, CG1, the DC
# series) is the author's to find; the claims below cover all the paper's findings.
#
# Shared methods, cited to the paper. Criteria refer to them by name.
#
# Method S (spiking responses). Units: sorted units with more than 2,000 spikes in the session
# (Methods, Neuronal type classification). Cell type: the initial phase (IP, onset to recrossing of
# baseline) and afterhyperpolarization period (AHP, end of IP to its recrossing of baseline) of the
# waveform, clustered by k-means into two clusters; the cluster with the shorter, narrower waveforms is
# FSU (Methods, citing Bartho et al. 2004), the other RSU. Open, could change the outcome: (K1) k-means
# over all units of one recording area pooled across sessions, or (K2) over all units of all areas
# pooled; IP and AHP are taken from each unit's mean waveform (the paper measures them "for each
# identified spike"; a per-unit median of per-spike values is a variant). The k-means seed is a standard
# choice. A unit is counted once per session it was recorded in (the n per condition in Figures 4 and 6
# to 9 differ by condition, so units are counted per session). Windows are 67 ms long aligned to tFUS
# onset, as the Results name them: pre-stimulus -67 to 0 ms (Methods), during sonication 0 to 67 ms,
# then 67 to 134, 134 to 201 and 201 to 268 ms; "delayed" or "postsonication" means 201 to 268 ms from
# Figure 6 on (Results, tFUS parameters, paragraph 1). Normalized spiking rate: a unit's rate in the
# window normalized to the 67 ms before each stimulation (Methods), in percent. Open, could change the
# outcome: (N1) the unit's spike count in the window summed over trials divided by its count in the
# pre-stimulus window summed over trials; (N2) the mean over trials of the per-trial ratio, trials
# without a pre-stimulus spike left out. Tests (Methods, Statistical analysis; Figure 4 legend):
# Kruskal-Wallis H test across conditions (or windows) of units' normalized rates; post hoc one-tailed
# two-sample Wilcoxon tests with Bonferroni correction; significance at 0.01 for spiking. The reported
# p-values are taken to be Bonferroni-corrected (several are printed as p = 1.0). Open, could change the
# outcome: the two samples of a test against baseline are (W1) units' rates in the window against units'
# rates in the pre-stimulus window, Wilcoxon rank-sum, or (W2) the same pairs per unit, Wilcoxon
# signed-rank; the rates compared are (R1) the raw spike rates in the two windows, or (R2) the normalized
# rates, the baseline then being 100% for every unit (the Methods normalize before testing and do not say
# which); the Bonferroni count is (M1) the number of conditions or windows in the panel each tested
# against baseline, or (M2) the number of all pairs among them and baseline. The tail is the direction
# the claim states. Under these readings a claim is reproduced when every reading gives its outcome; when
# readings give different outcomes it is blocked as methods_underspecified, with all results shown.
#
# Method D (directional correlation). dSTTC between a unit A and a unit B recorded in the same session,
# "A to B" meaning that A's spikes precede B's (Methods, Directional spike time tiling coefficient):
# PA is the fraction of A's spikes within dt = 20 ms before a spike of B, TB the fraction of time
# covered by the 20 ms before each spike of B, PB the fraction of B's spikes within 20 ms after a spike
# of A, TA the fraction of time covered by the 20 ms after each spike of A. The formula is missing from
# the text read. Reading taken from the terms and from the STTC it modifies (Cutts and Eglen 2014),
# dSTTC = 1/2 [(PA - TB) / (1 - PA TB) + (PB - TA) / (1 - PB TA)]; if the PDF shows another form, that
# form replaces it. dSTTC is computed trial by trial (Methods) in the 67 ms windows of Method S, with time
# fractions taken within the window. A trial where either unit has no spike in the window is open, as
# the paper does not say: (E1) it gives no value, as the STTC is undefined then (Cutts and Eglen 2014), or
# (E2) it gives 0. E1 and E2 apply to Method T too.
# Normalized dSTTC (Methods; formula not given) is open: (D1) the window's dSTTC minus the pre-stimulus
# dSTTC, or (D2) that difference divided by the absolute pre-stimulus dSTTC, per pair, from the means
# over trials. Tests: Kruskal-Wallis H across windows or parameters and post hoc one-tailed two-sample
# Wilcoxon tests against the pre-stimulus window, significance 0.05 (Methods; Figure 10 legend, "compared
# with prestimulation correlation"); W1 and W2 as in Method S. No Bonferroni correction is stated for
# dSTTC. Cell types and units as in Method S.
#
# Method T (traditional STTC, Figure 10C to F). STTC of Cutts and Eglen (2014), dt = 20 ms, between S1
# RSUs and POm RSUs of the same session (Results, tFUS elicited correlation change, paragraph 2), trial
# by trial in the pre-stimulus and during-sonication windows; the change is during minus pre-stimulus
# (D1) or that divided by the absolute pre-stimulus value (D2), per pair; Kruskal-Wallis across the five
# parameter levels and post hoc one-tailed two-sample Wilcoxon tests, significance 0.05.
