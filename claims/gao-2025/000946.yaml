# Claims for Gao, Ramachandran, Yu & He (2025) on dandiset 000946.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-22,
# protocol pilot-10 as stated in docs/protocol.md.
# Source: the version of record (J Neurosci 45(23) e2218242025, PMC12139594), full text as served
# by PMC: Abstract, Introduction, Materials and Methods, Results, figure legends and Discussion.
# The paper has no supplement (no Extended Data is cited). No PDF was supplied. The equation that
# defines the directional spike time tiling coefficient (dSTTC) is missing from the text read; only
# its description in words survives (Methods, Directional spike time tiling coefficient), and the
# symbols in that description are stripped. The paper links no analysis code, so no code was read.
#
# Data the paper used, as it reports them. Male Wistar rats under isoflurane (2%). Group 1 (N = 16):
# two 32-channel NeuroNexus probes, one in S1 (AP -2, ML 2.5, 1 to 1.3 mm deep, layers III to V)
# and one in POm (AP -4.5, ML 2.6, 5.8 mm). Group 2 (N = 12): S1 and auditory cortex (AC, AP -4.5,
# ML 6.5). tFUS from a 128-element array (1.5 MHz) aimed at S1, about 88 kPa in situ. Each session
# is one parameter set: 500 trials, ultrasound duration (UD) 67 ms, intersonication interval 2.5 s
# with 10% jitter, order of conditions randomized. PRFs 30, 300, 1500, 3000, 4500 Hz; duty cycles
# (DC) 0.6, 6, 30, 60, 90%; DC = PRF x pulse duration (PD). The PRF series uses PD 200 us, so 30,
# 300, 1500, 3000 and 4500 Hz are 0.6, 6, 30, 60 and 90% DC. DC series at 3000 Hz and at 30 Hz,
# and a PRF series at 60% DC. Sham sessions have no tFUS; control sessions aim tFUS at cingulate
# cortex (CG1, AP 3, ML 0). The dandiset description says each session's identifier holds the PRF
# and PD (e.g. BH494_1500_200_67_5 is 1500 Hz, 200 us) and that folders named with STTC hold STTC
# values of neuron pairs. Measured variables are sorted single units (Offline Sorter, threshold
# -3.5 SD, k-means), their spike times and waveforms, and trial onset times.
#
# Methods shared by the claims, from the Methods and figure legends; where the paper leaves a
# detail open, the readings it allows are named here with a label, and a criterion that says
# "under every reading" means every combination of them. Per the protocol, a method reading that
# could change an outcome is run in all its forms; the outcome is the one they all give, and when
# they differ the claim is blocked as methods_underspecified with every result shown.
#  - Units (Methods, Neuronal type classification): only units with more than 2000 spikes in the
#    session. A unit recorded in one session counts as one unit of that session's condition (the
#    n per condition in the Results differ, so units are counted per session).
#  - Cell type (Methods; Fig. 4 legend): the initial phase (IP, onset to recrossing of baseline)
#    and afterhyperpolarization (AHP, end of IP to recrossing of baseline) of the spike, k-means
#    with two clusters on (IP, AHP); the cluster with longer durations is RSU, the other FSU
#    (narrower waveforms are inhibitory, Methods). Open: K1, IP and AHP of the unit's mean
#    waveform; K2, the median over the unit's spikes of per-spike IP and AHP (the Methods say "for
#    each identified spike"). Open: P1, k-means over all units of one area pooled across sessions;
#    P2, k-means over all units of all areas pooled. If the dandiset carries the paper's own
#    RSU/FSU labels, those are used and K1, K2, P1, P2 are shown as variants. AC neurons are not
#    split by type (Fig. 11 counts "neurons").
#  - Normalized spiking rate (Methods; Statistical analysis): rate in a window divided by the rate
#    in the 67 ms before each stimulation, in percent. Open: N1, a unit's mean count in the window
#    over trials divided by its mean count in [-67, 0) ms over trials (units with zero baseline
#    left out); N2, the per-trial ratio averaged over trials with a nonzero baseline.
#  - Windows (Results; Fig. 4 to 9 legends): time 0 is sonication onset; during sonication 0 to 67
#    ms; 67 ms bins after it (67 to 134, 134 to 201, 201 to 268 ms); postsonication in Figs. 5 to 9
#    is 201 to 268 ms (the Fig. 6 legend's "201-28 ms" is read as 201 to 268).
#  - Test against baseline (Statistical analysis; Fig. 4 legend): Kruskal-Wallis, then post hoc
#    one-tailed two-sample Wilcoxon tests with Bonferroni correction, significance 0.01 for spiking.
#    The tail follows the claimed direction (greater for activation, less for inhibition). Open,
#    what the window is compared with: B1, the units' normalized rates in [-67, 0) ms (100% under
#    N1); B2, the units' normalized rates in [-134, -67) ms. The paper names a two-sample
#    (rank-sum) test, so a paired signed-rank test of the units' raw rates in the window against
#    [-67, 0) ms (B3) is not a reading of it; B3 is shown as a variant only and decides no
#    outcome. Open, the Bonferroni family: C1, the number of post hoc comparisons in the
#    figure panel (time bins against baseline in Figs. 4 and 5; parameter levels against baseline
#    for one window in Figs. 6 to 9 and 11); C2, no multiplication when the panel shows a single
#    comparison. The Kruskal-Wallis groups are the windows (Figs. 4, 5) or the parameter levels for
#    one window (Figs. 6 to 9, 11), units as observations.
#  - dSTTC (Methods, Directional spike time tiling coefficient): for a source train A and a
#    target train B in a window of length T, PA is the fraction of A spikes within 20 ms before a B
#    spike, TB the fraction of T covered by the 20 ms before each B spike, PB the fraction of B
#    spikes within 20 ms after an A spike, TA the fraction of T covered by the 20 ms after each A
#    spike. The equation is missing from the text read, so how the four terms combine is not
#    given by the paper as read. D1, the only reading named: the form of the STTC of Cutts and
#    Eglen (2014), which the Methods cite, with these one-sided terms; dSTTC =
#    0.5 x ((PA - TB) / (1 - PA x TB) + (PB - TA) / (1 - PB x TA)). This is a reconstruction; the
#    equation should be read from the version of record's PDF, and D1 replaced if it differs.
#    The Methods say the dSTTC was measured trial by trial for cross-area pairs of units recorded
#    in the same session. Open, the observation entering the tests: A1, each pair's dSTTC averaged
#    over the trials where it is defined; A2, every pair-trial as an observation. Open, the window
#    length T (not stated): W1, the 67 ms bins used for spiking, [-67, 0) ms and 67 ms bins from
#    0 ms; W2, 50 ms bins, the only other bin the paper names (the PSTH bin), [-50, 0) ms and 50 ms
#    bins from 0 ms. Open, the normalization ("normalized dSTTC", Fig. 10 legend "compared with
#    prestimulation correlation"): S1, window dSTTC minus the prestimulation dSTTC; S2, window
#    dSTTC divided by it (pairs with zero prestimulation dSTTC left out). Test (Statistical
#    analysis): Kruskal-Wallis across the time windows, then post hoc one-tailed two-sample
#    Wilcoxon of the values in a window against the prestimulation window, significance 0.05,
#    no correction (the Methods name none for dSTTC). The STTC (Figs. 10C to F) is the STTC of
#    Cutts and Eglen without direction, between S1 RSUs and POm RSUs; its Delta t is not stated
#    and is taken as the dSTTC's 20 ms, and A1/A2, W1/W2 and S1/S2 apply to it as well. The STTC
#    values stored in the dandiset's STTC folders are shown as a variant.
#  - Group summaries of the STTC change (Figs. 10C to F): the legends do not say whether mean or
#    median is shown; M1, the mean, and M2, the median, are both readings wherever a criterion
#    ranks parameters by their change.
#  - The paper's p-values are reported for comparison; a claim's outcome rests on significance at
#    the paper's level and on the direction, plus the numbers under expected.
