# Claims for Gao, Ramachandran, Yu & He (2025), J Neurosci 45(23) e2218242025, on dandiset 000463.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record as served by PubMed Central (PMC12139594), full text with
# Methods, Results, figure legends and Discussion (paper/10.1523-jneurosci.2218-24.2025.txt). The
# paper has no supplement. No PDF was provided, so the dSTTC equation of the Methods, which the
# text drops, could not be read (see open details). The paper links no analysis code; none was read.
#
# Which data. The paper says its data are at DANDI 000946 ("All experimental data has been made
# public in a repository at the DANDI Archive (https://dandiarchive.org/dandiset/000946)").
# Dandiset 000463 is titled "Electrophysiological Recordings in Anesthetized Rats in the Primary
# Somatosensory Cortex with Phased Ultrasound Array Stimulation"; its description cites this paper,
# speaks of S1 recordings with 32-channel NeuroNexus electrodes under 2% isoflurane, testing
# "different intensities and PRFs", stimulation every 2.5 s, 200 or 500 trials per recording, and
# its summary lists 4 subjects. Which of the paper's experiments it holds (S1 only, or S1 with POm,
# or the AC group) is the author's to find; DANDI 000946 is named here as the paper's own deposit.
#
# Data the paper used, as it reports them. Male Wistar rats (Hsd WI, Envigo), 250 to 350 g, 3 to 6
# months, under isoflurane (2%, 0.4 to 0.6 L/min). Main group N = 16 rats with two 32-channel
# NeuroNexus probes (A1x32-Poly3-10mm-50-177), one in S1 (layers III to V, 1 to 1.3 mm deep, at 40
# degrees) and one in POm (5.8 mm deep, at 20 degrees). Auditory-confound group N = 12 rats, probes
# in S1 and auditory cortex (AC). Signals from a Tucker-Davis Technologies system. tFUS from a
# 128-element random array (H276, 1.5 MHz) driven by a Verasonics Vantage 128, steered to S1.
# Every condition has ultrasound duration (UD) 67 ms, intersonication interval 2.5 s with 10%
# jitter, 500 trials. PRFs 30, 300, 1500, 3000 and 4500 Hz; duty cycles (DC) 0.6, 6, 30, 60 and
# 90%. The constant-PD series (200 us pulses) pairs 30 Hz with 0.6%, 300 Hz with 6%, 1500 Hz with
# 30%, 3000 Hz with 60% and 4500 Hz with 90% DC (Figure 6 legend); so the two conditions of
# Figure 4 (3000 Hz 60% and 30 Hz 0.6%) belong to that series. A DC series at 3000 Hz (Figure 7),
# one at 30 Hz (Figure 8) and a PRF series at 60% DC (Figure 9). Sham sessions have no tFUS;
# control sessions target cingulate cortex CG1 with 3000 Hz PRF. Measured variables are sorted
# single units of S1, POm and AC, their types (RSU or FSU), spike times relative to sonication
# onset, and pairwise correlation (dSTTC, STTC) between areas. Ten to twenty high-pressure
# (about 170 kPa) target-check trials preceded each recording; they are not analysed (Figure 2).
# Figure 3 shows single example units, which the paper does not identify; its findings are tested
# through the population claims of Figure 4.
#
# Common method, from the Methods (sections Data acquisition and preprocessing, Neuronal type
# classification and neuronal response quantification, Directional spike time tiling coefficient,
# Statistical analysis) and the figure legends. Criteria below refer to it.
#  M1 Units. Signals band-passed 300 Hz to 5 kHz; spikes detected beyond -3.5 SD of the Mean of
#     Peak Heights Histogram and clustered with k-means in Offline Sorter. Units are used only
#     when they fire more than 2000 spikes in the session.
#  M2 Type. For each unit's spikes, the initial phase (IP, onset to recrossing of baseline) and the
#     afterhyperpolarization period (AHP, end of IP to recrossing of baseline) are measured, and
#     k-means splits units into RSUs and FSUs. FSUs are the cluster with the shorter, narrower
#     waveforms (Methods, citing Bartho et al. 2004). AC neurons are not typed.
#  M3 Response. Normalized spiking rate, the rate in a window divided by the rate in the 67 ms
#     before each stimulation, in percent. Windows are 0 to 67 ms (during sonication, time-locked)
#     and 201 to 268 ms (postsonication, delayed) in Figures 5 to 9 and 11B; Figure 4 also uses
#     67 to 134 and 134 to 268 ms, consecutive 67 ms windows from onset.
#  M4 Tests on rates. Kruskal-Wallis H test across conditions, then one-tailed two-sample
#     Wilcoxon tests with Bonferroni correction, at alpha 0.01. A response "compared with
#     baseline" is the post hoc test of a window against the prestimulation baseline. Reported
#     p-values are read as Bonferroni-corrected values (several are printed as p = 1.0).
#  M5 dSTTC. Delta t = 20 ms. P_A is the fraction of spikes of A within Delta t before a spike of
#     B, T_B the fraction of time covered by Delta t before spikes of B, P_B the fraction of spikes
#     of B within Delta t after a spike of A, T_A the fraction of time covered by Delta t after
#     spikes of A. Computed trial by trial for cross-area pairs, then normalized. STTC (Cutts and
#     Eglen 2014), undirected, is used for the parameter comparisons of Figure 10C to F.
#  M6 Tests on correlation. Kruskal-Wallis H, then one-tailed two-sample Wilcoxon tests against
#     the prestimulation correlation, at alpha 0.05 (no correction is stated for dSTTC).
#
# Details the paper leaves open, with the readings its text allows. The notebook runs every
# reading; where a detail is a method (not the reading of a reported number) and the readings
# give different outcomes, the claim is methods_underspecified with every result shown.
#  O1 k-means inputs (M2). (a) per-unit IP and AHP from the unit's mean waveform; (b) per spike,
#     the unit taking its majority cluster. Features (i) in ms as measured, (ii) z-scored. Units
#     pooled (p) across all sessions and regions, or (q) per region. k = 2 throughout, as the
#     paper names two types.
#  O2 Normalization (M3). (a) the unit's mean rate in the window over trials divided by its mean
#     rate in the 67 ms before onset over trials; (b) the mean over trials of the per-trial ratio,
#     trials with no prestimulation spike left out.
#  O3 Baseline sample for "compared with baseline" (M4). (a) the units' normalized rate in the
#     prestimulation window itself (100% for every unit under O2a); (b) the units' normalized
#     rate in the window 134 to 67 ms before onset; (c) a one-sample Wilcoxon signed-rank test of
#     the units' normalized rates against 100%, the one-sample form of the comparison.
#  O4 Bonferroni factor (M4). (a) the number of windows compared with baseline in the panel; (b)
#     the number of parameter levels in the panel (5 in Figures 6 to 9 and 11B; 2 in Figure 4).
#  O5 One-tailed direction for claims of absence (M4, M6). (a) greater only, (b) each of greater
#     and less. For claims of a change the direction is that of the stated effect.
#  O6 dSTTC formula (M5). The equation is not in the text read. The reading named is the form of
#     Cutts and Eglen with the directional terms, dSTTC = 0.5 [(P_A - T_B)/(1 - P_A T_B) + (P_B -
#     T_A)/(1 - P_B T_A)]. The PDF should be read to confirm it before the attempt.
#  O7 dSTTC normalization and windows (M5). Normalized as (a) the window value minus the
#     prestimulation value, (b) that difference divided by the absolute prestimulation value.
#     The paper does not state the dSTTC windows. The one reading its text supports is 67 ms
#     windows (prestimulation -67 to 0, during 0 to 67, then 67 ms steps), as in M3.
#     A pair's value is (i) the mean over trials of per-trial values, trials where either unit is
#     silent in the window left out, or (ii) one value from all trials' windows concatenated.
#  O8 Which pairs (M5). All cross-area pairs of units recorded in the same session, by type.
