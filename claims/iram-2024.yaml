# Claims for Iram, Garcia et al. (2024), PNAS 121(12) e2307250121, on dandiset 001350.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record as served by Europe PMC (PMC10962977), main text, figure
# legends and Methods, with the SI Appendix (pnas.2307250121.sapp.pdf: Figs. S1 to S5, their
# legends, Supplementary Materials and Methods). Datasets S1 to S3 (XLSX) were not read. The
# main article's PDF was not supplied; values and p-values printed only on the panels of
# Figures 2 and 5 were read from the figure images of the PMC article (pnas.2307250121fig02.jpg,
# fig05.jpg), and those of Figs. S2 and S3 from the SI Appendix PDF. Figure 4's image could not
# be fetched, so the values of Fig. 4C to 4F are not recorded. Numbers read off a bar plot
# are marked as such and are good to about one tick of the axis's finest gridline.
#
# Code. The paper links no analysis code. Its Data availability names only NCBI GEO GSE241561
# (ChIP-seq, bulk RNA-seq, snRNA-seq). TEM was quantified by hand in Fiji/ImageJ and the
# statistics run in GraphPad Prism 9. The dandiset's description points to a segmentation
# model (github.com/axondeepseg/model_seg_unmyelinated_tem) trained later on these images.
# It is not the paper's code and was not read.
#
# The dandiset ("TEM Images of Corpus Callosum in Flox/SRF-cKO Mice") holds, by its
# description, 8000x TEM images of the corpus callosum of 5 WT (SRF-Flox) and 5 SRF-cKO mice,
# several images per mouse, prepared by high-pressure freezing and freeze substitution and
# imaged at UC Berkeley, with segmentation masks for myelinated axon, unmyelinated axon, myelin,
# oligodendrocyte nucleus and oligodendrocyte processes. These are the data of Fig. 2A to 2E
# and Fig. S3A to S3D. Every other claim uses data the dandiset does not hold.
#
# The paper's corpus callosum TEM data (Fig. 2A to E, Fig. S3A to D; SI Methods, Corpus callosum
# TEM). Subjects are adult mice (age not stated) of both sexes, SRF-flox/flox (SRF-Flox, the
# control, called WT in places) and SRF-flox/flox; Olig2-Cre/+ (SRF-cKO), n = 5 per genotype.
# Brains were perfusion-fixed, cut sagittally at 100 um; corpus callosum (just below cortex)
# punched at 1.5 mm, OTO-stained, high-pressure frozen and freeze-substituted, cut at 90 nm,
# imaged on a JEOL JEM-1400 as 8 x 8 montages at 8000x (SerialEM), stitched in IMOD. In Fiji,
# axons were scored myelinated or not with the Multi-point tool, and axon diameter and myelin
# thickness were measured with the line tool after setting the image scale to microns, blind to
# genotype. Measured variables, per mouse, are percent of axons myelinated (at least 2,500 axons
# per mouse; scored over at least 1,000 um2 because of regional heterogeneity), number of
# myelinated axons per area (average per mouse), g-ratio (average of 100 myelinated axons per
# mouse), myelin thickness and myelinated-axon diameter (averages of 100 myelinated axons per
# mouse). The test is an unpaired, two-tailed t test on per-mouse values (Methods, Data
# Analysis and Statistics; legends).
#
# Method details the paper leaves open for the corpus callosum claims, and the readings the
# paper's text allows (each corpus callosum criterion refers to these by number). The outcome of
# a claim is the one all readings give; when they disagree, the claim is blocked as
# methods_underspecified with every result shown.
#  O1. How axons are identified. The paper scored and measured by hand. The dandiset's masks
#      were made for a later segmentation project; using them in place of the hand scoring is a
#      difference from the paper's method, to be recorded as a deviation. There is no reading
#      to choose here.
#  O2. How a mouse's percent myelinated is formed. (a) total myelinated over total axons
#      counted across the mouse's images; (b) the mean over the mouse's images of each image's
#      percent.
#  O3. How a mouse's myelinated-axon density is formed, and its unit. The legend says "the
#      average per mouse", the axis has no unit. (a) total myelinated axons over total imaged
#      area; (b) the mean over images of each image's density. The unit is read as axons per
#      um2, the only unit under which the plotted values (about 1.4 to 1.8) are a plausible
#      density for adult corpus callosum; the cKO to Flox ratio is shown as a unit-free check.
#  O4. Axons cut by an image's edge. (a) left out; (b) kept. Applies to every count and measure.
#  O5. What the line tool measured as a diameter. (a) the equivalent-circle diameter from the
#      object's area; (b) the minimum Feret diameter. Axon diameter is from the axon (inner)
#      object, fibre diameter from the axon with its myelin; myelin thickness is half their
#      difference; g-ratio is axon diameter over fibre diameter, under the same reading.
#  O6. Which 100 myelinated axons per mouse. (a) all myelinated axons of the mouse's images;
#      (b) 100 drawn at random per mouse (one fixed seed, a standard choice; the spread of the
#      result over 100 draws is shown).
#  O7. The t test. The Methods name an unpaired, two-tailed t test run in Prism 9, whose
#      unpaired t test assumes equal variances by default (Student); Welch's test is the other
#      reading. For a claim of absence, Student's test is the paper's test and Welch's is shown
#      as a variant.
