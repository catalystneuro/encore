    hypomyelination seen in optic nerve persists into adulthood in corpus callosum.
  source: Figure 2C; Results, Conditional Knockout of SRF Causes CNS Hypomyelination, paragraph 2
  quote: This degree of hypomyelination of SRF-cKO mice persisted into adulthood in both the optic
    nerve ... and the corpus callosum
  statistics:
  - test: unpaired t test (p printed on Figure 2C)
    p: 0.003
    n: 5 SRF-Flox and 5 SRF-cKO mice, at least 2,500 axons per mouse
  expected:
  - quantity: SRF-Flox mean percent axons myelinated, adult corpus callosum (read from Figure 2C)
    value: 37
    tolerance: 3.7
    unit: percent
  - quantity: SRF-cKO mean percent axons myelinated, adult corpus callosum (read from Figure 2C)
    value: 22
    tolerance: 2.2
    unit: percent
  criterion: Per mouse, the percent of axons myelinated, from the counts of myelinated and
    unmyelinated axon objects (SI Methods, Corpus callosum TEM; Figure 2C legend), under the
    readings O1, O2, O4 and O7 of the opening comment. Reproduced when, under every reading,
    the SRF-cKO mean is lower than the SRF-Flox mean with an unpaired two-tailed t test p <
    0.05, and both group means are within tolerance. Partially reproduced when the direction and
    test hold but a group mean falls outside tolerance. The number of axons counted per mouse is
    reported against the paper's minimum of 2,500.
