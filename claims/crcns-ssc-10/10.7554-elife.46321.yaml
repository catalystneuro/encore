- id: fig7b-single-roi-decoder
  statement: Single-ROI decoders detected CW deflection against blank above chance, slightly better
    for EN cells than NH cells (fraction correct 0.65 against 0.63).
  source: Results, Enrichment improves population coding of columnar whisker deflections, paragraph
    1; Figure 7B
  quote: Single-ROI decoders performed above chance, with slightly better performance by EN cells
    than NH cells (fraction correct for NH ... 0.63 ± 0.005, for EN ... 0.65 ± 0.004, p=0.004,
    permutation test for difference in means
  statistics:
  - test: permutation test for difference in means
    p: 0.004
  expected:
  - quantity: NH single-ROI fraction correct
    value: 0.63
    tolerance: 0.005
  - quantity: EN single-ROI fraction correct
    value: 0.65
    tolerance: 0.004
  criterion: Responsive L2/3 ROIs of Drd3-Cre mice; for each, a logistic regression of stimulus
    against blank on the single-trial evoked response (the 1 s window, Results), fit on 80% of the
    CW and blank trials and tested on the other 20%, 500 repetitions, fraction correct averaged
    (Methods, Neural decoder). Predicted class is the more probable of stimulus and blank. Open,
    and named as readings, (i) the splits, as (a) 500 random 80/20 splits or (b) 5-fold
    cross-validation repeated 100 times (the Methods say both "K-fold" and "repeated 500 times");
    (ii) class balance, as (a) all trials of both classes or (b) blank trials subsampled to the
    number of CW trials; (iii) the ROIs, as (a) those over a barrel, tested on its CW, or (b) all
    responsive ROIs, tested on the whisker of the nearest column centre. Reproduced when, under
    one combination, EN is higher with p < 0.05 by the permutation test, both means exceed 0.5, and
    both values are within tolerance; partially reproduced when the test holds but values do not.
    The tolerances are the SEMs and tight; every combination's values are shown.
- id: fig7c-population-decoder
  statement: Detection by population decoders of randomly chosen, simultaneously imaged ROIs improved
    with ensemble size and was better for EN than NH for ensembles of 3 or more neurons.
  source: Results, Enrichment improves population coding of columnar whisker deflections, paragraph
    1; Figure 7C
  quote: Detection performance increased with population size, and was greater for EN than NH for
    populations containing ≥3 neurons (p<0.001; permutation test of difference in means
  statistics:
  - test: permutation test of difference in means
    p: 0.001
    p_relation: "<"
  depends_on:
  - fig7b-single-roi-decoder
  criterion: Ensembles of 1, 2, 3, 5, 10, 15, 20, 25 and 30 responsive ROIs from one field, the lesser
    of 500 or N-choose-K random ensembles per field and size; each ROI classifier's output
    normalised so units weigh equally, class probabilities summed over the ensemble and the larger
    class chosen (Methods). Tested whisker, open, (a) the whisker of the column closest to the
    ensemble centroid (Figure 7C legend), (b) performance averaged over the CWs of the ensemble's
    columns (Results). Normalisation, open, (a) each ROI's probabilities used as they are (they sum
    to one per trial), (b) each ROI's probability z-scored over test trials. Unit of the
    permutation test, open, (a) ensembles pooled, (b) per-field means. Reproduced when, under one
    combination, mean performance rises with size and EN exceeds NH with p < 0.001 at every size
    from 3 on; partially reproduced when p < 0.05 at every such size.
- id: fig7d-clustered-ensemble-topography
  statement: Spatially clustered ensembles detected the reference whisker best near its column
    centre; EN decoders outperformed NH decoders for ensembles centred 0-77 and 77-154 um from the
    column centre, and EN performed worse than NH farther away (e.g. 308-385 um).
  source: Results, Enrichment improves population coding of columnar whisker deflections, paragraph
    2; Figure 7D
  quote: Mean detection performance (on average across the population sizes) was greatest for
    ensembles centered near the whisker column center, and fell off with distance. EN decoders
    outperformed NH decoders for ensembles centered at 0-77 µm and 77-154 µm from a column center
    ... This effect disappeared and even reversed for more distant ensembles, where EN performed
    worse than NH (e.g., 308-385 µm bin
  statistics:
  - about: EN against NH, 0-77 and 77-154 um bins
    test: 2-way ANOVA
    p: 2.0e-6
  - about: EN against NH, 308-385 um bin
    test: 2-way ANOVA
    p: 2.0e-6
  depends_on:
  - fig7b-single-roi-decoder
  criterion: Ensembles from k-means clustering of responsive ROI positions in each field, relative
    to each reference whisker, for every k from 2 to the number of responsive ROIs (Methods),
    sizes 2 to 42; each tested on detecting the reference whisker against blank as in
    fig7c-population-decoder; ensembles binned by the distance of their centroid to the reference
    column centre in 77 um bins (the bins the Results name). The factors of the 2-way ANOVA are
    not given; readings (a) enrichment and ensemble size within each distance bin, (b) enrichment
    and distance bin with per-bin comparisons. Reproduced when, under one reading, performance
    is highest in the 0-77 um bin, EN exceeds NH with p < 0.05 in the 0-77 and 77-154 um bins, and
    NH exceeds EN with p < 0.05 in the 308-385 um bin; partially reproduced when the near bins hold
    but not the reversal.
