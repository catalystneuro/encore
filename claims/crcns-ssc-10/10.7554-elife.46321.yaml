- id: figs5-2-neuropil-robustness
  statement: The enrichment effects on tuning heterogeneity and point representation were
    qualitatively unchanged with neuropil subtraction at r = 0, 0.3 and 0.7 in L2/3 and L4; effects
    on signal correlations held at r = 0 and 0.3 but were lost at 0.7, and effects on noise
    correlations held at all levels.
  source: Results, Robustness to neuropil contamination, paragraph 1; Figure 5 figure supplement 2
  quote: Enrichment effects on tuning heterogeneity ( Figure 3 ) and point representation ( Figure 5
    ) were qualitatively unchanged across these levels of neuropil subtraction in both L2/3 and L4
    ... Effects of enrichment on signal correlations were conserved for r = 0 and r = 0.3, but were
    lost for r = 0.7 ... Effects of enrichment on noise correlations persisted across all neuropil
