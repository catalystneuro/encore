# Claims for LeMessurier, Laboy-Juarez, McLain, Chen, Nguyen & Feldman (2019), eLife 8:e46321,
# "Enrichment drives emergence of functional columns and improves sensory coding in the whisker
# map in L2/3 of mouse S1", on CRCNS data set ssc-10 (doi:10.6080/K0DB801M).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-08,
# protocol as stated in docs/protocol.md (Reader), version pilot-13.
#
# Text read: the version of record, PMC6697414 (Europe PMC JATS XML, flattened), as supplied
# under paper/: Results, Discussion, Materials and methods, Table 1, and the legends of Figures 1
# to 7 and their figure supplements (Figure 1 S1, Figure 2 S1 and S2, Figure 3 S1, Figure 4 S1
# and S2, Figure 5 S1 and S2). The paper has no other supplementary text. Table 1 is flattened
# to one cell per line and was read in that form. No PDF of the paper was supplied; no figure
# was read.
#
# Code read: github.com/alemessurier/imaging_analysis_pipeline, commit 5a21c9fef839fbc8eb79fa24f16662426e36904f
# (2019-07-10), the repository the paper links. rawDataPipeline/ holds the reduction from movies
# to ROI time series, dF/F, trial-aligned traces (traceByStim, sponTrace) and the responsiveness
# test (permuteTest_whisk_2016.m). plotting_2017/ holds the figure scripts. Many functions those
# scripts call are not in the repository, among them find_sigROIs, the computation of whiskPref
# (the equivalent best whiskers), find_CWtuned_byRad, find_rankedRFs, find_corr_simple,
# find_corrInBarrelvsAcross, decoder_PandPos and permutationTest_mean. What the code fixes:
#   - Evoked window: frames ceil(0.5*fs)+1 to ceil(0.5*fs)+ceil(1*fs) of each trial-aligned
#     trace, i.e. the 1 s after onset, with traces baseline-corrected to the 0.5 s before onset
#     (rawDataPipeline_shared.m, analysisTemplate.m), as the Methods say.
#   - EN against NH comparisons of means: permutationTest.m, 10,000 label shuffles of the pooled
#     units, statistic the absolute difference of means (two-sided), p the fraction of shuffles
#     (the observed value included) at least as large. Used in the figure scripts for responses
#     by distance, receptive fields, correlations and spontaneous activity.
#   - Fractions tuned by distance bin: the figure script somatotopy_plots_2018_eqSamp.m compares
#     EN with NH by permutationTest on the 0/1 tuned indicators, where the legend of Figure 3A
#     names Fisher's exact test. The legend is followed; the code's test is a variant.
# Where the code and the Methods differ, the Methods are followed and the code's choice is a
# variant: the responsiveness test is one-sided on means in the Methods ("greater than the 95th
# percentile"), two-sided in permuteTest_whisk_2016.m, with mean or median set per field
# (permTestType, 'median' in analysisTemplate.m); the temporal filter is a four-frame moving
# median in the Methods, a five-frame window (ptsToAvg = 2) in the code; F0 is the 20th percentile
# of the 80 s movie in the Methods, the 5th percentile in deltaF_simple.m.
#
# Data the paper used. Mice raised from weaning (P20-21) either enriched (EN, 2-3 littermates,
# tactile toys changed every 2-4 days) or normally housed (NH, one littermate, no toys), for
# 25-50 days. Drd3-Cre mice (L2/3 pyramidal cells; NH 7 mice, 11 fields; EN 7 mice, 11 fields)
# and Scnn1a-Tg3-Cre mice (L4 excitatory cells; NH 5 mice, 6 fields; EN 6 mice, 8 fields), with
# Cre-dependent GCaMP6s, imaged under isoflurane and chlorprothixene at 30 Hz through a cranial
# window, fields ~400 x 400 um (L2/3, 100-250 um deep) or ~300 x 300 um (L4). Nine whiskers in a
# 3 x 3 array centred on D2 (C1-C3, D1-D3, E1-E3) deflected one at a time with trains of five
# 300 um deflections 100 ms apart, interleaved with blank trials, 5 s apart in random order,
# 60 +/- 10 repetitions per whisker, ~40 movies of 80 s per field. Manually drawn soma ROIs; no
# neuropil subtraction for L2/3 in the main analysis, neuropil weight r = 0.3 for L4. ROI
# positions relative to the nine barrel centroids from cytochrome oxidase histology, barrel
# radii, and whether each ROI lies over a barrel or a septum. Measured variables: the evoked
# dF/F per trial, its median per whisker (the receptive field), responses z-scored to blank
# trials, best and equivalent best whiskers, signal and noise correlations of pairs, and
# logistic-regression decoders of single trials. Units of most tests are ROIs or ROI pairs
# pooled across fields and mice. Separately, juxtacellular recordings with GCaMP6s imaging of 10
# L2/3 cells in 5 C57BL/6 mice (Figure 1F) and a behavioural cohort of 6 NH and 6 EN mice
# (data not shown).
#
# The CRCNS data set, by its title and description, holds the population imaging of the four
# groups (raw and neuropil time series, dF/F, stimuli, trial-aligned traces, responsiveness
# p-values, ROI positions relative to each barrel). Whether it holds the juxtacellular recordings,
# or the barrel radii, is the author's to find.
#
# Methods common to the criteria below, from the Methods unless said otherwise:
#   - Evoked response of a trial: mean dF/F in the 1 s after train onset minus mean dF/F in the
#     0.5 s before (Methods, Quantification of whisker responses).
#   - Responsive ROI: for some whisker, the per-trial evoked responses exceed those of blank
#     trials by a permutation test of the difference in means (10,000 shuffles, one-sided at the
#     95th percentile), p-values Benjamini-Hochberg corrected over the nine whiskers at 0.05.
#     Variant: the p-values stored per ROI by the pipeline (two-sided, mean or median per the
#     field's permTestType), BH corrected. ROIs with nuclear GCaMP were excluded by the authors.
#   - Which responsive ROIs enter. Methods: for L2/3 "all whisker-responsive ROIs located within
#     any of the nine columns"; for L4 only responsive ROIs in columns C1, C2 and C3. Open for
#     L2/3: whether ROIs over septa enter the point representation and tuning-by-distance
#     analyses. Readings (A) all responsive ROIs of the field; (B) only ROIs over one of the nine
#     barrels. The counts favour (A) for Figures 2 and 3 (475 NH responsive cells, of which 344 lie
#     within a column). Correlations use only ROIs over (L2/3) or in (L4) a barrel (Methods).
#   - Receptive field: the median evoked response to each whisker over its trials (Methods).
#     Response normalised to spontaneous activity: that median z-scored to the distribution of
#     evoked-window responses on blank trials, read as (median - mean of blank) / SD of blank,
#     the standard z-score; centring on the blank median is a variant (Methods, Quantification).
#   - Best whisker (BW): the whisker with the largest mean evoked dF/F (Results, Whisker map
#     topography, paragraph 2). The median (the receptive field of the Methods) is a variant.
#   - Equivalent best whiskers (eBWs): whiskers whose response is "statistically
#     indistinguishable from the BW (see Materials and methods)". Neither the Methods nor the code
#     (whiskPref is loaded precomputed) say how. OPEN. Readings (E1) the paper's own permutation
#     test of the difference in means (10,000 shuffles, two-sided as in permutationTest.m) between
#     the BW's per-trial evoked responses and each other whisker's, p >= 0.05 uncorrected meaning
#     equivalent; (E2) as E1 with Benjamini-Hochberg correction over the eight comparisons, as the
#     Methods correct the responsiveness test; (E3) as E1 on medians (permutationTest_median.m).
#   - Distance to a column: Euclidean distance in um from the ROI to the centroid of the
#     reference whisker's barrel (Methods, 2-photon imaging, paragraph 4). In by-distance
#     analyses each responsive ROI enters once for each of the nine reference whiskers, at its
#     distance to that whisker's column; the bin counts the paper prints (406 and 419 NH cells at
#     225-300 and 525-600 um, from 475 responsive cells) require this.
#   - Columnar whisker (CW): the whisker of the barrel an ROI lies over (Results). Rows C, D, E run
#     dorsal to ventral and arcs 1, 2, 3 caudal to rostral, so for D2 the within-arc -1 and +1
#     row whiskers are C2 and E2 and the within-row -1 and +1 arc whiskers are D1 and D3
#     (Results, Enrichment sharpens whisker receptive fields, paragraph 3).
#   - EN against NH tests on means: the permutation test of the difference in means named in the
#     Results, as in permutationTest.m (two-sided, 10,000 shuffles), with ROIs or pairs pooled
#     across fields and mice as the units. Values reported as mean +/- SEM have the SEM as
#     tolerance; other values have 10% of the value.
