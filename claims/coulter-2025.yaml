# Claims for Coulter, Gillespie, Chu, ..., Eden, Kemere & Frank (2025), Neuron 113:949-961,
# "Closed-loop modulation of remote hippocampal representations with neurofeedback", on dandiset
# 001280 (version 0.241218.2300, the version the paper cites).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-10,
# protocol pilot-14 as stated in docs/protocol.md. The writer did not look at the dandiset's data or
# files; only its title and description on the archive were read.
#
# Text read: the version of record (open access, CC BY), from a PDF supplied by a person, with its
# supplement (Figures S1 to S7 and their legends, and Table S1, "Number of samples and statistical
# tests for main figures"), as the extracted text paper/10.1016-j.neuron.2024.12.023.txt. The text
# is complete (Results, legends, STAR Methods, supplement). Its minus signs in exponents are garbled
# ("p = 3.9e?11"); they were read as minus signs. No figure image was needed.
#
# Code read. The paper links (1) the analysis code and figure notebook, Zenodo
# doi:10.5281/zenodo.14522610, which is LorenFrankLab/hippocampus_content_neurofeedback tag v0.0.4,
# commit b27655c66cba8dbbcf2c23ada594f9d8852f8844; (2) the real-time decoder (Zenodo
# doi:10.5281/zenodo.14399029, the version used), not read, as no criterion rests on it. The
# repository holds DataJoint/Spyglass table classes that compute per-session quantities from the
# real-time decoder files and the Spyglass database (mcoulter_realtime_posterior_sum.py for target
# representation, mcoulter_realtime_lfp_posterior_sum.py for brain state, mcoulter_*assemblies.py
# for cell assemblies, mcoulter_theta_phase_shuffles.py for theta phase), and one notebook,
# single_cell_summary_plots-share-v3.ipynb, that loads per-session and per-assembly summaries from
# pickles ("all files with path beginning with '/stelmo/mcoulter/coulter_all_figures' are in the
# Dryad repository"), makes the figures and runs the tests, with its printed outputs. The code that
# classifies detected events (Figure 3) and computes the Figure 6 summaries from assembly activity
# is not in the repository. What the code settles is cited in each criterion.
# From the code: rat 1 = pippin, rat 2 = tonks, rat 3 = ginny, rat 4 = ron, rat 5 = molly, rat 6 =
# arthur (notebook cell 2); the target arm of each recording day, for head direction and
# neurofeedback days, is listed in mcoulter_arm_end_assemblies.py (dictionaries ron_all_dict and so
# on, keyed by NWB file name). The decoder's linearized position has 41 bins of 5 cm, x00 to x40:
# box x00-x08, arm 1 x13-x24, arm 2 x29-x40; arm ends (25 cm) x20-x24 and x36-x40; arm bases
# (25 cm) x13-x17 and x29-x33 (mcoulter_realtime_posterior_sum.py). Distance to the center port
# is the distance of the smoothed head position (smooth_x, smooth_y) from the center well position
# in pixels times 0.222 cm per pixel.
#
# Data the paper used. Six adult male Long Evans rats (6 to 9 months), each with a 64-tetrode
# microdrive in dorsal CA1 (both hemispheres); SpikeGadgets/Trodes recording at 30 kHz; position
# from red and green headstage LEDs, 30 Hz camera, which also give head direction. Three sessions a
# day of 40 to 45 min in a Y-shaped track (center box with a central reward port, two arms with
# ports at their ends). Each session has an exploration phase (10 to 15 min; lit ports guide 12
# visits to each arm end, randomly ordered, with returns to the center) and a feedback phase (30 min
# or 75 rewards, whichever comes first) in which reward is only at the center port, after a tone,
# for a nosepoke within 3 s. Days 1 to 4 are head direction feedback (tone for a head turn of 30
# degrees to the left, arm 1, or right, arm 2; target switched after 2 days); then remote
# representation neurofeedback, target the distal 25 cm of arm 1 or arm 2, switched every 3 days,
# for 6 days (rat 1) or 18 days (rats 2 to 6). The tone was triggered by the real-time clusterless
# decoder (6 ms bins) when, over a 30 ms running average, more than 40% of the posterior was in the
# target arm end, less than 20% in the opposite arm and less than 20% in the box, at least 2
# tetrodes (1 for rat 1) had spatially specific spikes, and the rat was less than 17 cm from the
# center port. Sessions with high-quality decoding were included (Figure S1D, n = 19, 62, 53, 55,
# 62, 63 sessions for rats 1 to 6). Measured variables the analyses use: the decoder's posterior
# over linearized position for every 6 ms bin, actual position, task phase and detection (reward)
# events; spike-sorted single units (MountainSort4); LFP (SWR detection, theta phase from a tetrode
# in stratum oriens); head speed.
#
# Where the data are. The paper deposits the raw recordings on DANDI (doi:10.48324/dandi.001280/
# 0.241218.2300; the archive's title is the paper's and its description says CA1 extracellular
# recordings from male Long Evans rats during a neurofeedback task) and the real-time decoder
# output, and the summarized results the notebook loads, on Dryad (doi:10.5061/dryad.dz08kps72,
# version 7 of 2025-01-17). The decoded posteriors on which Figures 1, 3, 4, 5, S1 to S5 rest are
# the real-time decoder's own output, so those claims are data elsewhere, on Dryad, and are to be
# tested on its decoder files (rec_4 decoder, rec_7 occupancy, rec_11 and rec_12 stimulation
# messages in each session's HDF5 file, as the code reads them), not on the summary pickles,
# which can serve as a check. Figures 6, 7, S6 and S7 combine the decoder output with spikes, LFP
# and position from the raw recordings, so they are with_inputs. Rewards (Figures 2 and S2D) are
# events of the raw recordings.
#
# Statistics as the code runs them, for every claim that cites them: Mann-Whitney U is
# scipy.stats.mannwhitneyu with its default two-sided alternative (the printed p of rat 1 in
# Figure 4C, U = 0 for 12 against 3 sessions, p = 0.0044, is the exact two-sided value); the LME
# is statsmodels smf.mixedlm("arm_representation ~ content_sessions", groups = rat), REML, fit with
# lbfgs, on the raw (not normalized) per-session values, with a random intercept per rat (the code
# codes head direction sessions 1 and neurofeedback 0, which flips the sign of the coefficient but
# not p); grouped regressions z-score each rat's values (scipy.stats.zscore) and run
# scipy.stats.linregress on the pooled values against session.
schema_version: 2
paper: doi:10.1016/j.neuron.2024.12.023
claims:
- id: fig2-max-rewards-neurofeedback
  statement: Every rat reached the maximum of 75 rewards in at least one remote representation
    neurofeedback session, with substantial variability across sessions and rats.
  source: Results, Closed-loop hippocampal neurofeedback, paragraph 4; Figure 2
  quote: Further, all six rats also reached the maximal number of rewards per session during remote
    representation neurofeedback, although there was substantial variability across sessions and
    rats.
  criterion: A reward is a reward delivery at the center port during the feedback phase of a
    neurofeedback session, counted from the recordings' behavioral events (the Methods say reward
    port nosepokes were saved in the NWB file). Reproduced when each of the six rats has at least
    one neurofeedback session with 75 rewards (the per-session maximum, Figure 2 legend). The
    per-session counts are also compared with those the notebook lists for Figure 2 (cell 11,
    "checked with daily data records"); the code's lists for rats 3 and 4 are identical, which
    looks like a copying error, so rat 3's list is not used for the comparison.
- id: figs2d-head-direction-rewards
  statement: All six rats rapidly and consistently reached the maximum number of rewards per session
    with head direction feedback.
  source: Results, Closed-loop hippocampal neurofeedback, paragraph 4; Figure S2D
  quote: Behavioral results showed that all six rats were able to rapidly and consistently maximize
    the number of rewards per session with behavioral feedback based on head direction (Figure
    S2D).
  criterion: Rewards per head direction feedback session (12 per rat) counted as in
    fig2-max-rewards-neurofeedback. The paper gives no threshold for "rapidly and consistently";
    the notebook's counts (cell 28) have 75 rewards in at least 10 of 12 sessions in every rat. The
    reading used is that each rat reaches 75 rewards in more than half of its head direction
    sessions and in at least one of the three sessions of its first day. Reproduced when this
    holds in all six rats.
- id: session-inclusion-decoding-quality
  statement: A small number of sessions with low-quality decoding were excluded; the included
    sessions number 19, 62, 53, 55, 62 and 63 for rats 1 to 6.
  source: Results, Closed-loop hippocampal neurofeedback, paragraph 5; STAR Methods, Data inclusion;
    Figure S1D and S2B legends
  quote: A small number of lower-quality decoding sessions were excluded from further analyses.
  data: elsewhere
  where: Dryad doi:10.5061/dryad.dz08kps72 (version 7), real-time decoder output files
  expected:
  - quantity: Included sessions, rat 1
    value: 19
    tolerance: 1.9
  - quantity: Included sessions, rat 2
    value: 62
    tolerance: 6.2
  - quantity: Included sessions, rat 3
    value: 53
    tolerance: 5.3
  - quantity: Included sessions, rat 4
    value: 55
    tolerance: 5.5
  - quantity: Included sessions, rat 5
    value: 62
    tolerance: 6.2
  - quantity: Included sessions, rat 6
    value: 63
    tolerance: 6.3
  criterion: The Methods define a high-quality session as one in which, during the exploration phase,
    when the rat was running outward from the box and in the end of the target arm, the posterior
    maximum of the decoded position was in the target arm in at least 65% of 6 ms time bins. Two
    details are open. "Running outward" needs a speed threshold and a direction; the readings are
    (a) head speed above 4 cm/s (the movement threshold of Figures S2C and 7) with linear position
    increasing, (b) any bin with linear position increasing. "The target arm" can be (a) the
    session's target arm, or (b) each arm in turn, the session passing when both do. The counts in
    Figure S1D are compared with the sessions each reading includes; the notebook's counts of good
    and bad sessions (cell 13, 19/11, 62/1, 53/13, 55/11, 62/4, 62/4) are shown beside them.
    Reproduced when, under one reading, every rat's count is within tolerance.
- id: decoded-spike-fraction
  statement: With a decoding latency of 30 ms, the real-time decoder decoded 90 to 99% of incoming
    spikes, about one million spikes per session.
  source: STAR Methods, Real-time spatial decoding; Figure S1D and S1E
  quote: With a decoding latency of 30 msec, 90-99% of incoming spikes were decoded.
  data: elsewhere
  where: Dryad doi:10.5061/dryad.dz08kps72 (version 7), real-time decoder output files
  expected:
  - quantity: Fraction of spikes decoded per session, range across sessions
    value: 0.945
    tolerance: 0.135
  criterion: Per included session, the fraction of spikes not dropped (Figure S1E, dropped means
    latency above 30 ms) out of all spikes the decoder received (Figure S1D). The range 90 to 99%
    widened by 10% of each bound is 81% to 100%. Reproduced when at least 90% of included sessions
    lie in 81% to 100% and the median session lies in 90% to 99%.
- id: fig1b-s3c-detection-content
  statement: The representations that triggered reward during neurofeedback were specific to the
    target arm end, while at head direction detections the decoder mostly represented the rat's
    current location in the box.
  source: Results, Closed-loop hippocampal neurofeedback, paragraph 5; Figure 1B right; Figure S3C
  quote: As expected, the spatial content was specific to the chosen remote target, while during head
    direction feedback sessions, the rat's current location was typically represented
  data: elsewhere
  where: Dryad doi:10.5061/dryad.dz08kps72 (version 7), real-time decoder output files
  criterion: As in Figure S3C, the posterior averaged over the 30 ms (5 bins of 6 ms) that triggered
    each detection, then averaged over detections, separately for arm 1 neurofeedback, arm 2
    neurofeedback and head direction feedback sessions. Reproduced when, for both neurofeedback
    groups, the summed average posterior in the target arm end exceeds that in the box and in the
    opposite arm, and, for head direction detections, the summed average posterior in the box
    (x00-x08) exceeds that in either arm end.
- id: fig3b-jump-fraction
  statement: Across rats, 65 to 75% of detected representations included only the target location
    or jumped from the current location to the target.
  source: Results, Closed-loop hippocampal neurofeedback, paragraph 6; Figure 3A and 3B
  quote: Across all rats, 65%–75% of detected representations included only the target location or
    jumped from the current location to the target
  data: elsewhere
  where: Dryad doi:10.5061/dryad.dz08kps72 (version 7), real-time decoder output files
  expected:
    quantity: Fraction of detected events classed as jump, per rat
    value: 0.705
    tolerance: 0.12
  criterion: Events are the reward-triggering detections of the included neurofeedback sessions,
    each with the 90 ms before detection (Figure 3B legend). The categories are from the Figure 3A
    legend, jump (posterior mass above 0.4 in the 25 cm at the end of the arm) and jump and arm base
    (posterior mass above 0.2 in the 15 cm at the base of the arm). The notebook (cell 23) takes the
    jump fraction as (all events minus arm-base events) over all events. Open, as the classifying
    code is not in the repository, is whether arm-base mass counts in (a) any 6 ms bin of the 90 ms
    window, or (b) the posterior summed over the window; and whether the 15 cm are (a) the first
    three bins of the arm (x13-x15, x29-x31) or (b) three bins of the 25 cm arm base. The range 65 to
    75% widened by 10% of each bound is 58.5% to 82.5%. Reproduced when, under one reading, every
    rat's jump fraction lies in it.
- id: fig3b-trajectory-fraction
  statement: Only 1 to 4% of detected representations were sequential trajectories down the length
    of the arm.
  source: Results, Closed-loop hippocampal neurofeedback, paragraph 6; Figure 3A and 3B
  quote: Across all rats, 65%–75% of detected representations ... were sequential trajectories down
    the length of the arm
  data: elsewhere
  where: Dryad doi:10.5061/dryad.dz08kps72 (version 7), real-time decoder output files
  depends_on:
  - fig3b-jump-fraction
  expected:
    quantity: Fraction of detected events classed as trajectories, per rat
    value: 0.0265
    tolerance: 0.0175
  criterion: Events as in fig3b-jump-fraction. The Figure 3A legend defines a medium trajectory as a
    representation with a significant linear regression covering at least 35 cm in the target arm,
    and a long trajectory as one covering at least 45 cm. Open are (1) which category the 1 to 4%
    counts, (a) long trajectories, (b) medium and long together; (2) the regression, read as a
    linear regression of the posterior-maximum position on time over the bins of the 90 ms window
    whose maximum lies in the target arm, significant at p < 0.05, with covered distance the span of
    fitted positions, and as variant the regression weighted by the posterior over all target-arm
    bins. The range widened by 10% of each bound is 0.9% to 4.4%. Reproduced when, under one
    reading, every rat's fraction lies in it.
- id: figs4a-jump-distance
  statement: Most detected representations (60 to 78% across rats) jumped at least 50 cm from the
    rat's current location.
  source: Results, Closed-loop hippocampal neurofeedback, paragraph 6; Figure S4A
  quote: Most representations (60%–78%) jumped at least 50 cm from the rat's current location (Figure
    S4A).
  data: elsewhere
  where: Dryad doi:10.5061/dryad.dz08kps72 (version 7), real-time decoder output files
  expected:
    quantity: Fraction of detected events with jump distance of 50 cm or more, per rat
    value: 0.699
    tolerance: 0.159
  criterion: For each detected event, the distance between the rat's position and the nearest
    high-confidence representation in the target arm (posterior mass above 0.4), including the 90
