- id: fig6e-target-assemblies-at-detection
  statement: At reward-triggering detections, target-representing cell assemblies were about 89 times
    more active than at random times and about 26 times more active than non-target assemblies, in
    every rat.
  source: Results, Remote representations engage hippocampal cell assemblies, paragraphs 3 and 4;
    Figure 6E; Table S1, Figure 6e
  quote: these assemblies were about 89 times more active at detection times compared with random
    times (Figures 6D and 6E, each rat p < 0.001, Mann-Whitney test) and were about 26 times more
    active than non-target assemblies
  statistics:
  - about: target assemblies at detection against random times, each rat
    test: Mann-Whitney
    p: 0.001
    p_relation: <
    n: 8, 126, 81, 57, 85 and 53 target assemblies for rats 1 to 6
  - about: target against non-target assemblies at detection, each rat
    test: Mann-Whitney
    p: 0.001
    p_relation: <
    n: 8, 126, 81, 57, 85 and 53 target and 72, 694, 527, 568, 578 and 769 non-target assemblies
  data: with_inputs
  depends_on:
  - session-inclusion-decoding-quality
  expected:
  - quantity: Target assembly activity at detection relative to random times
    value: 89
    tolerance: 8.9
  - quantity: Target assembly activity at detection relative to non-target assemblies
    value: 26
    tolerance: 2.6
  criterion: Assemblies per neurofeedback session from the isolated single units (MountainSort4,
    noise and multiunit clusters removed), by combined PCA and ICA (Lopes-dos-Santos et al. 2013),
    with spike counts in 30 ms bins (STAR Methods, Cell assembly analysis). The code
    (mcoulter_reward_assemblies.py, mcoulter_arm_end_assemblies.py) z-scores each unit, takes the
    number of assemblies from a circular-shift null (100 shuffles, 99.5th percentile of the largest
    eigenvalue) and FastICA patterns, and activation strength as in Lopes-dos-Santos (zero
    diagonal); it sums 5 indicator bins and prints this as 10 ms, against 30 ms in the Methods, so
    30 ms is the main reading and 10 ms a variant. Assemblies with maximum strength above 100 are
    kept (Figure 6E legend). Open is how an assembly is classed as target; the readings are (a) its
    activation strength during the exploration phase, binned by linearized position, peaks in the
    target arm end, (b) its mean activation during exploration is higher in the target arm end than
    in any other 25 cm segment, (c) as the code's mcoulter_arm_end_assemblies.py, assemblies built
    from cells with more than 30 spikes in the target arm end. Activity at detection is the
    strength in the bin containing each detection, averaged per assembly over detections; random
    times are center-port feedback times drawn uniformly, as many as the detections. Per rat,
    two-sided Mann-Whitney tests over assemblies. The fold change is open, (a) ratio of means over
    assemblies pooled across rats, (b) ratio of medians, (c) mean of the per-rat ratios of means.
    Reproduced when both comparisons have p < 0.001 in every rat with target higher and, under one
    reading, both fold changes are within tolerance; partially reproduced when the tests hold but
    no reading gives both fold changes.
