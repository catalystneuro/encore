- id: figs7d-jump-trajectory-state
  statement: Jump and trajectory representations both occurred during movement, stillness and SWRs,
    with no consistent difference in brain state between them across rats.
  source: Results, Brain state during remote representation events, paragraph 5; Figure S7D
  quote: We found both jump and trajectory representations across moving, still, and SWR periods with
    no consistent effects of prevalence across animals (Figure S7D).
  data: with_inputs
  depends_on:
  - fig3b-trajectory-fraction
  - fig7b-swr-fraction
  criterion: Events classed as jump (confined to the target location, with or without the center port)
    or trajectory (significant linear regression covering at least 35 cm in the target arm) as in
    fig3b-jump-fraction and fig3b-trajectory-fraction (Figure S7D legend), each assigned a brain
    state as in fig7b-swr-fraction at its detection time. The paper gives no test; per rat, a
