- id: fig5f-ripple-triggered-firing
  statement: LS firing around CA1 ripples is higher during NREM than during waking.
  source: Results, sixth paragraph; Figure 5F
  quote: This state-dependent coupling could also be observed ... in the SPW-R triggered LS firing
    rates (two-way T-test with Bonferroni correction; P < 0.001; Figure 5F)
  statistics:
  - test: two-way T-test
    p: 0.001
    p_relation: "<"
    corrected: Bonferroni
    n: 1,313 neurons
  criterion: Per LS neuron in recordings with sleep states and a hippocampal channel, the
