  criterion: The paper gives no method. The CA1 ripple-triggered firing of anterior cingulate
    units (all cortical units, if the dataset gives no finer label), pooled; the delay is the
    time of the minimum of the mean triggered rate between 0 and 200 ms (reading a), and the
    time of the extremum of the ripple-triggered cortical LFP in that window (reading b).
