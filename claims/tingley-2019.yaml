- id: fig5f-no-phase-coherence
  statement: CA1-LS 120-180 Hz phase coherence around CA1 ripples does not differ from that of
    randomly jittered windows, so LS does not inherit the ripple wave by wave.
  source: Results, paragraph on the local origin of LS HFOs; Figure 5F inset and legend
  quote: phase coherence between HFOs and SPW-Rs was not significantly different from a shuffled
    distribution ( Figure 5F inset)
  criterion: A claim of absence, judged on the figure's bounds of +-3 SD. The 120-180 Hz phase
    coherence of CA1 and LS relative to CA1 ripples, against an equal number of randomly
    jittered time windows (Figure 5F inset legend). Open details. The coherence measure is read
    as the phase-locking value across ripples of the CA1 minus LS phase at each lag around the
    ripple time; the jitter is not given, and is read as +-1 s, with 100 jittered sets (standard
    choices). Reproduced when the ripple-time value lies within the mean +-3 SD of the jittered
