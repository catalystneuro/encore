- id: fig5f-no-phase-coherence
  statement: CA1-LS phase coherence in the 120-180 Hz band around CA1 ripples does not differ
    from that of randomly jittered windows, so LS does not inherit the ripple wave by wave.
  source: Results, seventh paragraph; Figure 5F inset
  quote: phase coherence between HFOs and SPW-Rs was not significantly different from a shuffled
    distribution (Figure 5F inset)
  criterion: A claim of absence, judged on the figure's bounds of +-3 SD. Per recording, the
    phase-locking value across ripples of the CA1 minus LS phase at the ripple time, and at
    20 sets of times jittered by up to +-1 s. Averaged over recordings. Reproduced when the
    ripple value lies within the mean +-3 SD of the 20 jittered averages; not reproduced when
    it lies above.
- id: fig6-optogenetic-hfos
  statement: Optogenetic activation of LS GABAergic neurons with a Gaussian light waveform
    induces local oscillations of about 140 Hz.
  source: Results, seventh paragraph; Figure 6
  quote: Using a Gaussian waveform of blue light (450 nm), mimicking the envelope of SPW-R-induced
    hippocampal excitation, local oscillations of ~140 Hz could be reliably induced (Figure 6C–E;
    S2)
- id: fig7e-ca1-spikes
  statement: The number of CA1 spikes in a SPW-R significantly predicts the number of spikes of
    38% of LS neurons.
  source: Results, eighth paragraph; Figure 7D, E
  quote: For many LS neurons (38%), this measure significantly predicted the number of action
    potentials elicited in the postsynaptic LS neuron (Figure 7D, E)
  expected:
    quantity: percent of LS neurons predicted by the number of CA1 spikes
    value: 38
    tolerance: 3.8
    unit: percent
  criterion: The paper does not state its model. Fixed here, for LS neurons in recordings with
    hippocampal units and at least 100 CA1 ripples, and with at least 20 spikes inside ripples
    in total. Per ripple, the LS neuron's spike count between ripple start and stop is
    predicted from the feature by a linear regression, scored by 5-fold cross-validated
    mean squared error (MSE); the feature is shuffled over ripples 100 times. Readings of
    "significant" are (a) the actual MSE below the 5th percentile of the shuffled MSEs, (b)
    a one-sample two-sided t-test of the shuffled MSEs against the actual one at p < 0.05,
    with the actual MSE lower. The chance rate is the same test applied to one shuffle
    against the others (the figure's red points). Reproduced when the percentage is within
    tolerance under one reading; partially reproduced when it is out of tolerance but above
    the chance rate (binomial p < 0.05) under that reading; not reproduced otherwise.
