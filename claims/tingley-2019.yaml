  statement: In a model HPC-LS circuit, forward, reverse and scrambled temporally compressed
    sequences evoke nearly identical responses of the LS neuron.
  source: Results, last paragraph; Figure 8C, D and legend; STAR Methods, Spiking model of HPC-LS
    circuit
  quote: By providing the model with temporally compressed forward, reverse, or scrambled replay
    events (Figure 8C), we observed that the response of the postsynaptic model LS neuron was nearly
