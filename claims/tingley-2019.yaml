- id: figs2c-no-ls-reactivation
  statement: After controlling for the change in firing rate, by rate matching or by bin size,
    LS-LS pairs show no fast timescale reactivation beyond chance, and HPC and HPC-LS pairs give
    similar results.
  source: Results, paragraph 5; Figure S2C and legend; STAR Methods, Reactivation analysis
  quote: When controlling for this change in overall rate — both by down-sampling to rate match (
    Giri et al., 2019 ) or increasing bin size — we did not observe fast timescale reactivation of
    LS-LS cell pairs that exceeded what would be expected by chance, given the observed changes in
    firing rate ( Figure S2C ). We found similar results for HPC and HPC-LS pairs
  depends_on:
  - figs2-post-rate-increase
  criterion: From the Methods. Explained variance (EV) and reverse explained variance (REV) as
    in Kudrimoti et al. (1999) and Pennartz et al. (2004), from pair correlation vectors in PRE
    NREM ripple epochs, BEHAV and POST NREM ripple epochs, with 25 ms and 1 s bins, before and
    after rate matching (single spikes removed at random until PRE and POST rates are as close as
    can be, Giri et al., 2019). Open details. "NREM ripple epochs" is read as (a) within CA1
    ripples in NREM, (b) within LS HFOs in NREM for LS pairs. The test across recordings is a
    two-sided t-test of EV against REV (Figure S2C legend), paired by recording as a reading and
    two-sample as the other. The rate matching is repeated 10 times and averaged (a standard
    choice). Reproduced when, with 25 ms bins after rate matching, EV does not exceed REV at p <
    0.05 for LS-LS pairs, and the same holds for HPC and HPC-LS pairs; partially reproduced when
    it holds for LS-LS pairs only. The increase of EV over REV with 1 s bins, which the Methods
    report for every pair set, is shown.
- id: fig5b-nrem-and-rates
  statement: LS HFOs occur primarily during NREM sleep, and their rates are lower than those of
    hippocampal SPW-Rs.
  source: Results, paragraph 6; Figure 5A, B and legend
  quote: Across recordings with sleep and behavioral sessions, we primarily observed HFO events
    during NREM sleep ( Figure 5A ). While this is similar to the state-dependent occurrence of
    hippocampal SPW-Rs ( Buzsáki et al., 1983 ), the overall rates of LS HFOs were significantly
    lower than hippocampal SPW-Rs ( Figure 5B )
  criterion: Per recording with sleep states, the LS HFO rate in NREM and in WAKE (N = 89
    recordings in Figure 5B), and the CA1 ripple rate in each state (N = 53). The paper names no
    test. Readings for "lower" are (a) a rank-sum test of the 89 LS against the 53 CA1 rates, (b)
    a signed-rank test over the recordings with both, at p < 0.05, in NREM and over all time.
    "Primarily during NREM" holds when more than half of all LS HFOs fall in NREM and the NREM
    rate exceeds the WAKE rate in most recordings (signed-rank p < 0.05). Reproduced when both
    parts hold under one reading; partially reproduced when one does.
- id: fig5d-lag
  statement: LS HFOs are reliably coupled to CA1 ripples, with a median peak-to-peak lag of
    6.4 +- 4.2 ms, CA1 leading LS.
  source: Results, paragraph 6; Figure 5C, D and legend
  quote: Across recordings, we observed a reliable coupling of events across structures ( Figure 5D
    ) with a median peak-to-peak temporal lag of 6.4 ± 4.2 milliseconds (CA1 leading LS)
  expected:
    quantity: median lag of LS HFO after CA1 ripple
    value: 6.4
    tolerance: 4.2
    unit: ms
  criterion: Tolerance is the paper's stated spread. The lag is the LS HFO time minus the CA1
    ripple time for pairs of events. Open details, each run. Event time is read as the code's
    peak (trough of the filtered signal) and as the maximum NSS bin. Pairing is not stated;
    readings are the nearest CA1 ripple within +-50 ms (the coupling window of the Results, Figure
    7 paragraph) and within +-25 ms (the Figure 5E inset window). The median is (a) over
    recordings of per-recording medians, (b) over all pairs pooled. Reliable coupling holds when
    the pooled CA1-LS cross-correlogram (Figure 5D) peaks within +-25 ms above its mean at 100 to
