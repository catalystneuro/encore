  data: elsewhere
  where: GitHub DavidTingley/papers, commit 9f4cd48, LS_phasecoding/modeling/dynamicWeightingModel-ripple.ipynb
  criterion: The model as in the STAR Methods and the notebook. 50 CA1 and 50 CA3 Hodgkin-Huxley
