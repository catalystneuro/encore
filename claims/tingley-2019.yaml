- id: fig6-optogenetic-hfos
  statement: Optogenetic activation of LS GABAergic neurons with a Gaussian light waveform
    induces local oscillations of about 140 Hz in both animals.
  source: Results, paragraph on the local origin of LS HFOs; Figure 6 and legend; Figure S4;
    STAR Methods, Optogenetic experiments
  quote: Using a Gaussian waveform of blue light (450 nm), mimicking the envelope of
    SPW-R-induced hippocampal excitation, local oscillations of ~140 Hz could be reliably induced (
    Figure 6C – E ; S2 )
  statistics:
  - about: power spectral density per frequency, stimulation against no stimulation
    test: two-way T-test
    p: 0.01
    p_relation: "<"
    n: 2 rats
  criterion: As the STAR Methods give it. One second windows of the raw LFP (1.25 kHz) around
    every Gaussian stimulation and as many one second windows starting one second after each;
    the log power spectral density per window from 1 to 200 Hz; per frequency, a two-sided t-test
    of stimulation against no-stimulation windows; significance at p < 0.01 (Figure 6E legend).
    Open details. The PSD estimator is not named; Welch's method with 256 sample segments is a
    standard choice. Whether the window is centred on the stimulus or starts at it is not said;
    both are run. Reproduced when, in each animal, the frequency of the largest significant
    increase lies within 10% of 140 Hz (126 to 154 Hz); partially reproduced when it does in one
    animal. Square pulse and Figure S4 durations and powers are shown as variants.
