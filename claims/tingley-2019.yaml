  source: Results, sixth paragraph; Figure 5E and inset
  quote: HPC-LS coupling was significantly stronger during NREM sleep than during the waking
    immobile state ... the percentage of LS HFO events that occurred within ±25 milliseconds of a
    CA1 ripple (NREM = 0.3; WAKE = 0.15; P < 6.6e-6 two-way T-test; Figure 5E inset)
  statistics:
  - about: CA1 ripple and LS HFO coupling, NREM against WAKE
    test: two-way T-test
    p: 0.001
    p_relation: "<"
    corrected: Bonferroni
  - about: fraction of LS HFOs within ±25 ms of a CA1 ripple, NREM against WAKE
    test: two-way T-test
    p: 6.6e-6
    p_relation: "<"
  expected:
  - quantity: fraction of LS HFOs with a CA1 ripple within 25 ms, NREM
    value: 0.3
    tolerance: 0.03
  - quantity: fraction of LS HFOs with a CA1 ripple within 25 ms, WAKE
    value: 0.15
    tolerance: 0.015
  criterion: Recordings with sleep states, a hippocampal channel and at least 10 LS HFOs in each
