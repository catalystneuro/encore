- id: ls-spikes-not-locked-to-ca1-ripples
  statement: LS spiking is not phase-locked to the individual waves of hippocampal SPW-Rs.
  source: Results, paragraph on the local origin of LS HFOs
  quote: LS spiking activity was not phase-locked to individual waves of hippocampal SPW-Rs
  criterion: A claim of absence. The paper shows no figure or method for it; the phase locking
    analysis of the STAR Methods (as in fig1d-phase-locking, Rayleigh p < 0.05, more than 50
    spikes) is applied with the 120-200 Hz phase of the CA1 ripple channel, inside CA1 ripples
    (reading a) or inside the Methods' high-power epochs on that channel (reading b). Reproduced
    when the fraction of LS neurons significantly locked is not above the 5% expected by chance
    (one-sided binomial test, p < 0.05); not reproduced when it is. The fraction and the mean
    resultant length are reported either way, beside those of fig1d-phase-locking.
