    paper's test, a two-sample two-sided t-test of the two sets of correlations, at p < 0.05.
    Reproduced when it finds no difference, not reproduced when it does.
- id: fig4d-compression
  statement: Cross-correlograms of LS pairs during HFOs correlate with those during traversal
    above chance up to about 20-fold temporal compression (P < 0.01), similarly for PRE and
    POST (P > 0.01 for all compression factors).
  source: Results, fourth paragraph; Figure 4D; Figure S3B
  quote: We found correlations significantly higher than chance (up to ~20-fold compression; P <
    0.01) ... However, the strength of this compression was similar for HFOs recorded prior to, and
    after, maze traversal (P > 0.01 for all compression factors)
  statistics:
  - about: HFO against maze traversal CCG correlations above chance, up to about 20-fold compression
    p: 0.01
    p_relation: "<"
  - about: PRE against POST, every compression factor
    p: 0.01
    p_relation: ">"
  depends_on:
  - fig4b-pre-post-unchanged
  criterion: For compression factors 1, 2, 4, 6, 8, 10, 15, 20, 30, 40 and 50, the unsmoothed
    1 ms HFO CCG over +-120/c ms is interpolated to 241 points and correlated with the BEHAV
    CCG over +-120 ms. Chance is the same with the HFO CCG circularly shifted by a random lag.
