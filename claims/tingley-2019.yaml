  criterion: As fig7e-ca1-spikes, with the ripple duration as the feature.
- id: fig7e-ca1-depth
  statement: The mean depth within the CA1 pyramidal layer of the neurons active in a SPW-R
    predicts the spike count of 23% of LS neurons.
  source: Results, eighth paragraph; Figure 7D, E; STAR Methods, Relative anatomical depth
    within CA1
  quote: For a set of LS neurons (23%), the recording depth of the active CA1 population correlated
    significantly with the number of action potentials elicited (Figure 7D, E)
- id: fig7e-replay
  statement: The sequential content of SPW-Rs, by three replay scores, predicts the firing of
    only 7.9, 6.6 and 7.1% of LS neurons.
  source: Results, ninth paragraph; Figure 7D, E
  quote: The firing rates of only a minority of LS neurons—7.9, 6.6, and 7.1% respectively—could be
    significantly predicted by the sequential structure of hippocampal events captured by these
    methods (Figure 7D, E)
- id: fig7e-seqnmf
  statement: Template sequences extracted from SPW-Rs without supervision predict the firing of
    only 8.1% of LS neurons.
  source: Results, tenth paragraph; Figure 7E; Figure S5
  quote: we found that the percentage of LS neurons whose action potential firing could be
    significantly predicted with these templates was small (Figure 7E; 8.1%; P < 0.05)
- id: fig7e-content-independent
  statement: All spike-content-independent ripple features predict LS firing above chance,
    while all spike-content-based features do not.
  source: Results, eleventh paragraph; Figure 7E, bottom row
  quote: all spike content-independent ripple features were significantly different from chance
    (left seven columns), while all spike content-based ripple features were not significantly
    different from chance (Figure 7E; right four columns; bottom row)
