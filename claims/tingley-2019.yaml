    "~20". Partially reproduced when they exceed chance up to at least 5 and one of the other
    parts fails.
- id: figs3d-hpc-compression-post
  statement: For hippocampal cell pairs, compression of behavioural spike patterns during CA1
    ripples is higher after than before the behavioural session, for compression factors 1 to 7;
    HPC pairs are the only ones with a PRE to POST difference.
