- id: fig8-model
  statement: In a model HPC-LS circuit, forward, reverse and scrambled compressed sequences
    evoke nearly identical responses of the LS neuron.
  source: Results, twelfth paragraph; Figure 8C, D
  quote: By providing the model with temporally compressed forward, reverse, or scrambled replay
    events (Figure 8C), we observed that the response of the postsynaptic model LS neuron was nearly
    identical for all three event types (Figure 8D)
