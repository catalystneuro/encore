    two-sided t-test of the shuffled MSEs against the actual MSE gives p < 0.05 (actual lower);
    chance is one shuffled iteration tested against the rest (red points). Recordings are the 62
    with a hippocampal population and LS (dataset-composition), CA1 and CA3 merged, with SPW-Rs
    detected on CA1. Open details, which the paper does not give and which can change the
    outcome. (i) The prediction model, read as (a) a linear regression of spike count on the
    feature, (b) a generalized linear model with Poisson noise. (ii) Whether the MSE is in-sample
    or cross-validated, read as 5-fold cross-validation and in-sample. (iii) What is shuffled, read
    as the feature across SPW-Rs. (iv) The number of shuffles, 100 (a standard choice). (v) The
    LS firing window, read as SPW-R start to stop and as +-50 ms of the ripple time. (vi) A
    minimum firing of the neuron is not stated; none is applied, with 20 spikes in SPW-Rs as a
    variant. The CA1 spike count is all hippocampal units' spikes between start and stop.
    Reproduced when the percentage is within tolerance under one combination; partially
    reproduced when no combination is within tolerance but the percentage exceeds the chance rate
    (binomial p < 0.05) under one; not reproduced otherwise.
