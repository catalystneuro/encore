- id: fig5d-lag
  statement: LS HFOs are reliably coupled to CA1 ripples, with a median peak-to-peak lag of
    6.4 +- 4.2 ms, CA1 leading LS.
  source: Results, sixth paragraph; Figure 5D
  quote: Across recordings, we observed a reliable coupling of events across structures (Figure 5D)
    with a median peak-to-peak temporal lag of 6.4 ± 4.2 milliseconds (CA1 leading LS)
  expected:
    quantity: median lag of LS HFO after CA1 ripple
    value: 6.4
    tolerance: 4.2
    unit: ms
  criterion: Tolerance is the paper's stated spread. The lag is the LS HFO time minus the time
