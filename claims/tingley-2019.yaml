- id: fig4c-temporal-bias
  statement: The temporal ordering of LS spike pairs during HFOs before and after the maze
    correlates with the ordering during traversal to a similar degree (P = 0.85).
  source: Results, paragraph 4; Figure 4C and legend; STAR Methods, Temporal bias analysis
  quote: the spiking structure during HFOs prior to and after maze performance showed correlations
    with the spike ordering during maze traversal that were similar (Figure 4C; N = 53 recordings;
    Two-way T-test; P = 0.85)
  statistics:
  - test: Two-way T-test
    p: 0.85
    n: 53 recordings
  depends_on:
  - fig4b-pre-post-unchanged
  criterion: A claim of absence, judged on the paper's test at p < 0.05. From the Methods, the
    temporal bias of a pair in an epoch is the CCG summed over 0 to +200 ms minus that over -200
    to 0 ms, for pairs across different shanks; per recording, the correlation over pairs of the
    PRE with the BEHAV biases and of the BEHAV with the POST biases. Open details. The
    correlation is read as Pearson (Skaggs and McNaughton, 1996, whose analysis the Methods
    follow), Spearman as a variant. The two-sided t-test of the 53 PRE-BEHAV against the 53
    BEHAV-POST correlations is read as (a) paired by recording, (b) two-sample. The zero bin is
    left out of both sums. Pairs as in fig4b-pre-post-unchanged. Reproduced when the test finds no
    difference, not reproduced when it does; the mean difference is reported either way.
- id: fig4d-compression
  statement: Cross-correlograms of LS pairs during HFOs correlate with those during traversal
    above chance up to about 20-fold temporal compression (P < 0.01), similarly for PRE and
    POST (P > 0.01 for all compression factors).
  source: Results, paragraph 4; Figure 4D and legend; Figure S3B, C and legend; STAR Methods,
    Temporal compression analysis
  quote: We found correlations significantly higher than chance (up to ~20-fold compression; P <
    0.01) ... However, the strength of this compression was similar for HFOs recorded prior to, and
    after, maze traversal (P > 0.01 for all compression factors)
  statistics:
  - about: HFO against maze traversal CCG correlations above chance, up to about 20-fold compression
    p: 0.01
    p_relation: "<"
  - about: PRE against POST, every compression factor
    p: 0.01
    p_relation: ">"
  depends_on:
  - fig4b-pre-post-unchanged
  criterion: From the Methods. CCGs with 1 ms bins; the BEHAV CCG over +-120 ms; the HFO CCG
    (PRE or POST) over +-120/c ms for compression factor c, interpolated to 241 points and
    correlated with the BEHAV CCG; c from 1 (+-120 ms) to 50 (+-2.4 ms). Chance is the same
    correlation with one CCG circularly permuted (Figure 4D legend). Open details. The factors
    between 1 and 50 are not listed; every integer from 1 to 50 is used. The interpolation is
    linear (a standard choice). The correlation is Pearson. The tests are not named; readings for
    actual against chance over pairs are a Wilcoxon signed-rank and a rank-sum test, and for PRE
    against POST a rank-sum test. Pairs as in fig4b-pre-post-unchanged. Reproduced when PRE and
    POST each exceed chance at p < 0.01 at every factor up to 15 and PRE and POST do not differ
