- id: fig4b-pre-post-unchanged
  statement: The co-activation of LS neuron pairs during HFOs (excess correlation) is not
    modulated by waking experience on a familiar maze (PRE against POST, rank-sum P = 0.36).
  source: Results, third paragraph; Figure 4B
  quote: It also suggested that the degree of co-activation observed is not modulated by waking
    experience in a familiar environment (Figure 4B; rank-sum test; P = 0.36; PRE vs POST)
  statistics:
  - test: rank-sum test
    p: 0.36
    n: 7,172 pairs of LS neurons, 53 sessions
  criterion: A claim of absence, judged on the paper's test, a rank-sum test of PRE against POST
    excess correlations over all pairs, at p < 0.05. Pairs are LS neurons on different shanks
    in recordings with all three epochs. CCGs use 1 ms bins of the spikes inside LS HFOs
    (PRE, POST) or inside trials (BEHAV), normalized by the square root of the product of
    the spike counts, over +-400 ms, smoothed with Gaussian kernels of SD 5 ms and 200 ms
    (each divided by the kernel mass inside the window); the excess correlation is the
    difference of the two at zero lag. The jittered value moves every spike by a uniform
    +-200 ms before the CCG. A pair is kept when its
    CCG holds more than 5 spike pairs within +-200 ms in each epoch. Reproduced when the test
    finds no difference, not reproduced when it does; the effect size is reported either way.
- id: fig4b-hfo-above-behav
  statement: Excess correlations during HFOs (PRE and POST) are higher than during maze
    traversal (rank-sum P < 0.001), and those of PRE and POST HFOs exceed chance from spikes
    jittered by +-200 ms (P < 0.01).
  source: Results, third paragraph; Figure 4B; Figure S3A
  quote: the excess correlations for HFOs during the PRE and POST epochs were much greater than
    expected by chance ... during LS HFOs there is a higher degree of co-activation than observed
    during behavior or expected given LS firing rates (rank-sum test; P < 0.001 for PRE vs BEHAV and
    BEHAV vs POST)
  statistics:
  - about: PRE and POST HFO excess correlations against spikes jittered by ±200 ms
    test: rank-sum test
    p: 0.01
    p_relation: "<"
  - about: PRE against BEHAV and BEHAV against POST
    test: rank-sum test
    p: 0.001
    p_relation: "<"
  depends_on:
  - fig4b-pre-post-unchanged
  criterion: Same pairs and measure as fig4b-pre-post-unchanged. Reproduced when PRE > BEHAV and
    POST > BEHAV by rank-sum p < 0.001 and PRE and POST exceed their jittered values by
    rank-sum p < 0.01; partially reproduced when one of the two comparisons holds.
- id: fig4-sessions-few-change
  statement: Only 7 of 53 sessions have significantly different excess correlations in PRE and
    POST (rank-sum P < 0.01), three with PRE below POST and four with PRE above.
  source: Results, third paragraph
  quote: Only 7 out of 53 sessions had significantly different excess-correlation values for PRE and
    POST epochs (rank-sum test; P < 0.01), three where PRE was less than POST and four where PRE was
    greater than POST
  depends_on:
  - fig4b-pre-post-unchanged
  expected:
    quantity: fraction of sessions with PRE different from POST
    value: 0.132
    tolerance: 0.0132
  criterion: Per recording with at least 5 pairs, rank-sum test of PRE against POST at
    p < 0.01. Reproduced when the fraction is within tolerance and both directions occur;
    partially reproduced when the fraction is below 0.25 and both directions occur.
- id: fig4c-temporal-bias
  statement: The temporal ordering of LS spike pairs during HFOs before and after the maze
    correlates with the ordering during traversal to a similar degree (P = 0.85).
  source: Results, fourth paragraph; Figure 4C
  quote: the spiking structure during HFOs prior to and after maze performance showed correlations
    with the spike ordering during maze traversal that were similar (Figure 4C; N = 53 recordings;
    Two-way T-test; P = 0.85)
  statistics:
  - test: Two-way T-test
    p: 0.85
    n: 53 recordings
  depends_on:
  - fig4b-pre-post-unchanged
  criterion: A claim of absence. The temporal bias of a pair is the sum of its normalized CCG
    over +1 to +200 ms minus that over -200 to -1 ms. Per recording with at least 10 pairs, the
