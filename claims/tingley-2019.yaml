  statement: The number of hippocampal spikes in a SPW-R significantly predicts the number of
    spikes of 38% of LS neurons.
  source: Results, Figure 7 paragraph 1; Figure 7D, E and legend
  quote: For many LS neurons (38%), this measure significantly predicted the number of action
    potentials elicited in the postsynaptic LS neuron (Figure 7D, E)
  expected:
    quantity: percent of LS neurons predicted by the number of hippocampal spikes
    value: 38
    tolerance: 3.8
    unit: percent
  criterion: From the Figure 7E legend. For each LS neuron and feature, the mean squared error
