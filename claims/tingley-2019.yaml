# Claims for Tingley and Buzsaki (2019), Routing of hippocampal ripples to subcortical
# structures via the lateral septum, Neuron 105, 138-149, tested on dandiset 000218.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-18,
# protocol pilot-16 as stated in docs/protocol.md. The writer did not look at the dandiset's data or
# files; only its title on the archive was read. This file replaces the version of 2026-10-19,
# whose opening comment recorded outputs of the data and fixed method choices from them; those
# are removed, and every method detail below is taken from the paper or its code, or named as open.
#
# Text read: the accepted author manuscript in PubMed Central (PMC6952543, NIHMS1545124), full
# text as served by NCBI PMC: Summary, Introduction, Results, Discussion, STAR Methods, figure
# legends and Key Resources Table, with its one supplement (NIHMS1545124-supplement-1.pdf, Figures
# S1 to S5 and their legends). The main figures were not available as images, so values printed
# only inside main figure panels (axis labels of Figure 7E among them) could not be read.
#
# Code read. (1) github.com/DavidTingley/papers, commit 9f4cd48 (2020-03-16), the repository the
# Methods link for "code specific to figures/analyses in this manuscript". It holds the figure
# scripts of Tingley and Buzsaki (2018), not of this paper, and the network model of Figure 8
# (LS_phasecoding/modeling/dynamicWeightingModel-ripple.ipynb, pyNN with NEURON). No analysis code
# of Figures 1 to 7 is there. (2) github.com/buzsakilab/buzcode, commit e615663 (the current head,
# not a version dated to the paper), analysis/SharpWaveRipples/bz_FindRipples.m, the detector the
# Methods name. Its defaults are 130-200 Hz, thresholds [2 5] SD, a minimum inter-event interval
# of 30 ms before merging, maximum duration 100 ms, minimum 20 ms, EMG threshold 0.9; the event
# "peak" it returns is the time of the minimum (trough) of the filtered signal within the event,
# and amplitude the maximum normalized squared signal. Where the Methods give a value (120-200 Hz,
# 2 and 5 SD, 15 and 250 ms) it is used; the merge interval and EMG threshold are the code's.
#
# Data the paper used. Long-Evans rats. Five rats (3 males, 2 females) implanted with silicon
# probes in LS and the dorsal hippocampus (CA1 or CA3), as in Tingley and Buzsaki (2018), and one
# rat with a tetrode microdrive in LS (rat 1), used in the phase locking analysis: 6 animals with
# LS recordings. Two further rats for optogenetics (AAV-DLX-ChR2-mCherry in LS, 200 um optic fibres
# and 50 um tungsten wires, Gaussian and square light pulses from a PulsePal). Each recording is
# continuous: pre-behavior home cage (PRE), traversal of one of three linear track mazes (BEHAV),
# post-behavior home cage (POST). Intan RHD2000, 20 kHz wideband; LFP at 1.25 kHz; units sorted
# with SpikeDetekt and Klustakwik and curated in Klustaviewa. Position by OptiTrack (120 Hz) in
# four animals, a 30 Hz camera with head LEDs in one; only ballistic trials were analysed. Brain
# state (NREM, REM, WAKE) scored with the semi-automated method of Watson et al. (2016), manually
# curated. Electrode depth within LS was estimated per recording from implantation depth, daily
# drive turns and histology (Methods, Relative anatomical depth within LS); CA1 neuron depth
# from waveform amplitude across sites relative to the pyramidal layer centre. Measured variables
# the claims need are LS and hippocampal LFP, unit spike times with region and shank, probe
# geometry, sleep states, the three epochs and maze trials and position, and for Figure 6 the
# light stimulation times and waveforms.
#
# Methods common to the claims, from the Methods and buzcode.
# - Detection of CA1 ripples and LS HFOs (Methods, Ripple detection) is bz_FindRipples.m with
#   120-200 Hz (Butterworth, order 3) on the 1.25 kHz LFP, the normalized squared signal (NSS),
#   peak threshold 5 SD and start and stop at 2 SD, durations 15 to 250 ms, and noise events on
#   a non-ripple channel, or the EMG estimated from the LFP (Schomburg et al., 2014) where there
#   is none, used to exclude events. Duration is stop minus start; amplitude is the maximum NSS;
#   instantaneous frequency as the Methods give it (Hilbert phase, unwrapped, median filtered
#   over +-6 bins, difference at the peak power bin divided by 2 pi). For CA3 recordings the
#   ripple is detected on a CA1 reference electrode (Methods, Experimental model).
# - Open details of detection. (i) Which channel is used. The Methods say that the input
#   parameters are stored with each set of detected events; where the dataset holds the events
#   or their parameters, they are used (reading a); otherwise the channel with the highest
#   120-200 Hz power in the structure (reading b, the criterion the Methods use for the CA1
#   pyramidal layer centre). (ii) Whether the SD is taken over the whole recording or a
#   restricted epoch; the code's default is the whole signal, used here as a standard choice.
#   (iii) Merge interval and EMG threshold, the code's defaults (30 ms, 0.9), a standard choice.
#   (iv) The event time. The Methods call it the "peak power" bin; the code's peak is the trough
#   of the filtered signal. Both are readings where a claim uses event times at ms precision.
# - States. NREM and WAKE are the scored states; WAKE in Figure 5 is "the waking immobile state"
#   (Results, paragraph on coupling). Whether the WAKE events are restricted to immobility by a
#   speed criterion is not said; readings are all WAKE and WAKE outside maze trials.
# - Regions. CA1 and CA3 neurons are pooled as hippocampal (HPC) where the paper merges them
#   (Methods, Experimental model, "these recordings were therefore merged").
schema_version: 2
paper: doi:10.1016/j.neuron.2019.10.012
claims:
- id: dataset-composition
  statement: LS was recorded in 6 rats with 1989 LS neurons in the phase locking analysis; 62
    recordings had a hippocampal population with LS, 37 with CA1 and 25 with CA3; LS HFO rates
    come from 89 recordings and CA1 ripple rates from 53; recordings held 8 to 74 LS neurons
    (mean 29.6).
  source: Results, paragraph 1; Figure 1C and 1D legends; Figure 5B legend; STAR Methods,
    Experimental model and subject details, and Phase locking analysis
  quote: The dataset used for Figure 6 consists of 62 recordings with both CA1 and LS
    simultaneously recorded (N = 37) or CA3 and LS simultaneously recorded (N = 25)
  expected:
  - quantity: animals with LS recordings
    value: 6
    tolerance: 0
  - quantity: LS neurons in the phase locking analysis
    value: 1989
    tolerance: 198.9
  - quantity: recordings with CA1 and LS
    value: 37
    tolerance: 3.7
  - quantity: recordings with CA3 and LS
    value: 25
    tolerance: 2.5
  - quantity: recordings with LS HFO rates
    value: 89
    tolerance: 8.9
  - quantity: recordings with CA1 ripple rates
    value: 53
    tolerance: 5.3
  - quantity: mean LS neurons per recording
    value: 29.6
    tolerance: 15.5
  criterion: Counts from the dataset. The Methods sentence names Figure 6, the optogenetic
    figure; its content (hippocampal populations merged across CA1 and CA3, ripple depth) is
    that of Figure 7, so it is read as describing the Figure 7 dataset. The tolerance on the
    mean neurons per recording is the paper's stated SD (29.6 +- 15.5). Readings for the LS
    neuron count are (a) LS neurons with more than 50 spikes in high 120-200 Hz power epochs
    (the selection of the phase locking analysis, STAR Methods), (b) all LS units. Reproduced
    when the animal count matches and all other counts are within tolerance under one reading
    each; partially reproduced when the animal count matches and at least four of the six other
    counts are.
- id: fig1c-hfo-each-animal
  statement: Transient 120-180 Hz HFOs occur in LS in each of the 6 animals, with a robust
    increase in the firing probability of LS neurons at the events.
  source: Results, paragraph 1; Figure 1A to C and legend
  quote: we observed transient high frequency oscillations (HFOs) in the 120–180 Hz frequency range
    in each animal (Figure 1A, B) and an associated robust increase in the firing probability of LS
    neurons (Figure 1C)
  criterion: LS HFOs detected as in the opening comment. The spike probability is HFO-triggered
    and normalized by the number of events, against the same measure at an equal number of
    randomly selected times per recording, with bounds of +-3 SEM across neurons (Figure 1C
    legend). The bin and window of the triggered histogram are not given; 1 ms bins over +-100
    ms are a standard plotting choice, and the comparison is made at the bin of the event time
    and the +-5 ms around it. Per animal, the median instantaneous frequency of its LS HFOs lies
    in 120 to 180 Hz, and the mean triggered probability at the event exceeds the random-time
    mean by more than 3 SEM. Reproduced when this holds in all 6 animals, partially reproduced in
    3 to 5, not reproduced in fewer.
- id: fig1c-post-burst-suppression
  statement: LS HFOs are accompanied by a suppression of LS firing immediately after the
    population burst.
  source: Results, paragraph on the local origin of LS HFOs; Figures 1C and 5F
  quote: LS HFOs were significantly shorter than hippocampal SPW-Rs ( Figure 1F ) and were
    accompanied by a suppression of firing immediately following the population burst
  depends_on:
  - fig1c-hfo-each-animal
  criterion: On the HFO-triggered LS spike probability of fig1c-hfo-each-animal, the paper gives
    no test or window for the suppression. Reading, with the figure's +-3 SEM bounds, the mean
    probability after the burst (the bins from the event stop, or 20 ms after the event time, to
    50 ms after it; the window is open and both ends are reported) is below the random-time mean
    by more than 3 SEM. Reproduced when it is, not reproduced when it is not.
- id: fig1c-event-count
  statement: Across 6 animals, 29,955 LS HFO events were analysed.
  source: Figure 1C legend
  quote: Average power spectrum across all events (N = 6 animals, 29,955 events)
  expected:
    quantity: LS HFO events
    value: 29955
    tolerance: 2995.5
  criterion: Count of LS HFOs detected as in the opening comment. Readings for the recordings
    counted are (a) all recordings with LS electrodes, (b) recordings with LS units. Under
    detection reading (a) the deposited events are counted. Reproduced when one reading is
    within tolerance.
- id: figs1-participation
  statement: On average 16% of LS neurons take part in a given HFO, firing an average of 0.23
    spikes per event.
  source: Results, paragraph 1; Figure S1A, B and legend
  quote: On average, 16% of LS neurons participated in any given event, firing an average of 0.23
    spikes per event (Figure S1A, B)
  expected:
  - quantity: fraction of LS neurons firing in an HFO
    value: 0.16
    tolerance: 0.016
  - quantity: spikes per LS neuron per HFO
    value: 0.23
    tolerance: 0.023
  criterion: The Figure S1A legend defines the first as the proportion of neurons firing at
    least one action potential in each LS HFO (N = 8 to 74 neurons per recording). The window
    counted is not given; readings are (a) between the event's start and stop, (b) +-25 ms of
    the event time. The averaging is open; readings are (i) the mean over all events pooled, with
    spikes per event the mean over all neuron and event pairs, (ii) the mean over recordings of
    per-recording means. Reproduced when both values are within tolerance under one combination;
    partially reproduced when one is.
- id: fig1d-phase-locking
  statement: The vast majority of LS neurons (1840 of 1989, 92%) are significantly
    phase-locked to the 120-200 Hz band (Rayleigh P < 0.05), with a strong unimodal preference
    for the trough of each cycle.
  source: Results, paragraph 1; Figure 1D, E and legend; STAR Methods, Phase locking analysis
  quote: Across entire recordings, the vast majority of LS neurons (1840 of 1989; 92%) were
    significantly phase-locked to the 120–200 Hz frequency band, with a strong unimodal phase
    preference for the trough of each cycle (Figure 1D, E)
  statistics:
  - test: Rayleigh test
    p: 0.05
    p_relation: "<"
    n: 1989 LS neurons, 6 animals
  expected:
    quantity: fraction of LS neurons significantly phase-locked
    value: 0.925
    tolerance: 0.0925
  criterion: As the STAR Methods give it. Epochs where the 120-200 Hz power (4th order
    Butterworth, 7 ms RMS smoothing) is continuously above 2 SD of its mean; the phase of every
    spike in them from the Hilbert transform; neurons with more than 50 spikes in these epochs;
    circular mean and resultant per neuron (CircStat); Rayleigh test at p < 0.05 (Figure 1D
    legend). The null circularly shifts the LFP phases by a random offset, 10 iterations. Open
    details. The LFP channel is not named; readings are the LS HFO detection channel and the LS
    channel nearest the neuron's shank. The band is 120-200 Hz in the Methods and Results and
    120-180 Hz in the Figure 1D legend; the Methods' band is used and the legend's shown as a
    variant. The denominator readings are (a) neurons passing the 50 spike selection, (b) all LS
    neurons. The phase convention is the angle of the analytic signal, trough at 180 degrees.
    The trough preference holds when the circular mean of the preferred phases of significant
    neurons is within 45 degrees of 180 and a Rayleigh test over them gives p < 0.05 (the 45
    degree bound is set here; the paper gives none). Reproduced when the fraction is within
    tolerance under one reading and the trough preference holds; partially reproduced when one
    of the two holds.
- id: fig1f-shorter-than-ripples
  statement: LS HFOs are shorter than CA1 ripples from the same animals (27 +- 9 against
    31 +- 14 ms; rank-sum P < 0.01).
  source: Results, paragraph 1; Figure 1F
  quote: These events were significantly shorter in duration (27±9 vs 31±14 milliseconds) ... than
    CA1 ripples recorded from the same animals (Figure 1F, G; rank-sum test; P < 0.01)
  statistics:
  - test: rank-sum test
    p: 0.01
    p_relation: "<"
  expected:
  - quantity: LS HFO duration, mean
    value: 27
    tolerance: 9
    unit: ms
  - quantity: CA1 ripple duration, mean
    value: 31
    tolerance: 14
    unit: ms
  criterion: Tolerances are the paper's stated SDs. Durations are stop minus start of events
    detected as in the opening comment, pooled over the animals with both LS and CA1 channels
    (readings are events from recordings with both channels, and all events of those animals).
    Rank-sum test of LS against CA1 durations. Reproduced when both means are within tolerance,
    LS HFOs are shorter and the test gives p < 0.01; partially reproduced when LS HFOs are
    significantly shorter but a mean is out of tolerance.
- id: fig1g-slower-than-ripples
  statement: LS HFOs are slower in frequency than CA1 ripples (147 +- 5.7 against 159 +- 8 Hz;
    rank-sum P < 0.01).
  source: Results, paragraph 1; Figure 1G
  quote: These events were significantly ... slower in frequency (147±5.7 vs 159±8 Hz) than CA1
    ripples recorded from the same animals (Figure 1F, G; rank-sum test; P < 0.01)
  statistics:
  - test: rank-sum test
    p: 0.01
    p_relation: "<"
  expected:
  - quantity: LS HFO peak frequency, mean
    value: 147
    tolerance: 5.7
    unit: Hz
  - quantity: CA1 ripple peak frequency, mean
    value: 159
    tolerance: 8
    unit: Hz
  depends_on:
  - fig1f-shorter-than-ripples
  criterion: Tolerances are the paper's stated SDs. Events as for fig1f-shorter-than-ripples;
    peak frequency is the instantaneous frequency of the STAR Methods (Ripple detection). The
    Methods' last step ("taking the difference between samples nearest the peak power bin ...
    and dividing by two pi") does not say whether it is multiplied by the sampling rate to give
    Hz; it is, as a value in Hz requires. Reproduced when both means are within tolerance, LS
    HFOs are slower and the rank-sum test gives p < 0.01; partially reproduced when LS HFOs are
    significantly slower but a mean is out of tolerance.
- id: fig1h-no-amplitude-frequency-correlation
  statement: LS HFOs show no significant correlation between event amplitude and peak
    frequency.
  source: Results, paragraph 1; Figure 1H
  quote: However, they showed no significant correlation between event amplitude and peak frequency
    (Figure 1H)
  depends_on:
  - fig1g-slower-than-ripples
  criterion: A claim of absence. Amplitude is the maximum NSS of the event and frequency as in
    fig1g-slower-than-ripples, over all LS HFOs pooled (Figure 1H is one scatter plot). The paper
    names no test; the readings are a Pearson and a Spearman correlation at p < 0.05. Reproduced
    when the test finds no significant correlation, not reproduced when it does; r is reported
    either way, with per-animal values as a variant. With some 30,000 events a very small r is
    significant, so r is given beside p.
- id: fig2-confined-to-ls
  statement: HFO events are seen only at recording sites within LS, not at sites in
    neighbouring structures.
  source: Results, paragraph 2; Figure 2A to C and legend; Discussion, paragraph 2
  quote: We only observed HFO events at recording sites that were confined to the LS (Figure 2A–C)
  criterion: Figure 2C shows 120-180 Hz power during LS HFOs by recording depth, with the borders
    of LS and of cortex and corpus callosum marked. In recordings where a probe spans LS and
    another structure (sites placed by the dataset's anatomical labels, which the paper derives
    from the depth estimate of the STAR Methods), the mean 120-180 Hz power at each site within
    +-25 ms of the LS HFO times, divided by its mean at random times (the window and the random
    baseline are set here; the paper gives neither). Reproduced when, in every such recording,
    the median ratio over LS sites exceeds the median ratio of the sites of every non-hippocampal
    structure and those sites' ratios are below 1.5 (a site without HFOs); partially reproduced
    when this holds in most such recordings. The hippocampus is left out, as it has its own
    ripples.
- id: fig2ef-intermediate-ls
  statement: HFO power and the proportion of phase-locked neurons are highest in intermediate
    LS and taper towards its dorsal and ventral borders; both are best fit by a second order
    polynomial of depth.
  source: Results, paragraph 2; Figure 2D to F and legend; Figure S1C, D and legend
  quote: Both the power of HFOs and the proportion of phase-locked neurons were highest in the
    intermediate LS and tapered off as recordings approached either the dorsal or ventral border of
    LS
  depends_on:
  - fig1d-phase-locking
  criterion: Per recording, the average 120-180 Hz power of its LS HFO events (Figure 2E) and the
    percentage of its LS neurons significantly phase-locked (fig1d-phase-locking; Figure 2F),
    against the recording's estimated relative depth in LS (STAR Methods, Relative anatomical
    depth within LS). Polynomials of order 1 to 5 are fit and compared by adjusted R squared
    (Figure S1C, D). Whether the fit is per animal or over all recordings is open (Figure 2F
    colours dots by animal and shows one black fit line per panel); both readings are run, and
    power is compared within animals as raw power is not comparable across them. Reproduced when,
    for both measures, order 2 has the highest adjusted R squared and the fitted parabola opens
    downward with its maximum inside the depth range; partially reproduced when this holds for
    one of the two. Not testable without per-recording depth estimates.
- id: fig3-travelling-waves
  statement: LS HFOs are travelling waves, posterior to anterior at 1.01 m/s (4 animals),
    medial to lateral at 0.53 m/s (1 animal) and dorsal to ventral at 2.19 m/s (4 animals).
  source: Results, paragraph 2; Figure 3 and legend
  quote: we estimated that the travel speed was 1.01 meters per second in the posterior-to-anterior
    direction (N = 4 animals), 0.53 meters per second in the medial-to-lateral direction (N = 1
    animal), and 2.19 meters per second in the dorsal-to-ventral direction (N = 4 animals)
  expected:
  - quantity: posterior to anterior speed
    value: 1.01
    tolerance: 0.101
    unit: m/s
  - quantity: medial to lateral speed
    value: 0.53
    tolerance: 0.053
    unit: m/s
  - quantity: dorsal to ventral speed
    value: 2.19
    tolerance: 0.219
    unit: m/s
  criterion: As the Figure 3 legend gives it. The event-averaged LS HFO on each site (Figure 3B
    averages events across shanks); for each pair of sites aligned to one axis (AP, ML or DV),
    20 to 800 um apart, the lag between troughs, against the distance between the sites, from
    the probe geometry. Open details. The alignment of the average is not stated; it is aligned
    on the event time of the detection channel (both readings of the event time are run). How
    the speed follows from lags and distances is not stated; readings are (a) the inverse slope
    of a regression of lag on distance through the origin, (b) the median over pairs of distance
    divided by lag. Probe orientation in AP and ML comes from the probe layout of the recording.
    Reproduced when, under one reading, each speed is within tolerance and the sign of the lag
    puts posterior before anterior, medial before lateral and dorsal before ventral; partially
    reproduced when the directions hold and at least one speed is within tolerance.
- id: fig4b-pre-post-unchanged
  statement: The co-activation of LS neuron pairs during HFOs (excess correlation) is not
    modulated by waking experience on a familiar maze (PRE against POST, rank-sum P = 0.36).
  source: Results, paragraph 3; Figure 4A, B and legend; STAR Methods, Excess correlation analysis
  quote: It also suggested that the degree of co-activation observed is not modulated by waking
    experience in a familiar environment (Figure 4B; rank-sum test; P = 0.36; PRE vs POST)
  statistics:
  - test: rank-sum test
    p: 0.36
    n: 7,172 pairs of LS neurons, 53 sessions
  expected:
    quantity: LS neuron pairs across different shanks
    value: 7172
    tolerance: 717.2
  criterion: A claim of absence, judged on the paper's test, a rank-sum test of PRE against POST
    excess correlations over all pairs, at p < 0.05. From the Methods and Results. Pairs of LS
    neurons on different shanks; three CCGs per pair from spikes during LS HFOs in PRE, during
    maze traversal (BEHAV) and during LS HFOs in POST; 1 ms bins over +-200 ms; each CCG
    convolved with a 5 ms and a 200 ms Gaussian, and the excess correlation is the 5 ms version
    minus the 200 ms version at the zero bin. Open details, each run under both readings. (i)
    The inclusion rule "both neurons fired more than 5 spikes within 200 milliseconds of each
    other" is read as (a) the CCG holds more than 5 spike pairs within +-200 ms, (b) each neuron
    has more than 5 spikes with a partner spike within 200 ms; applied in every epoch. (ii) 5 and
    200 ms are read as the Gaussian SD and, as a variant, its full width. (iii) The CCG
    normalization is not stated; readings are raw counts and counts divided by the square root
    of the product of the two spike counts. (iv) BEHAV spikes are those inside maze trials,
    with all of BEHAV as a variant. "During HFOs" is between start and stop. Edges are handled by
    dividing by the kernel mass inside the window (a standard choice). Reproduced when the test
    finds no difference, not reproduced when it does; the effect size is reported either way.
- id: fig4b-hfo-above-behav
  statement: Excess correlations during HFOs (PRE and POST) are much greater than chance from
    spikes jittered by +-200 ms and BEHAV excess correlations slightly greater (P < 0.01), and
    co-activation during HFOs is higher than during maze traversal (P < 0.001).
  source: Results, paragraph 3; Figure 4B; Figure S3A and legend
  quote: By randomly jittering each spike by ±200 milliseconds, we found that the excess
    correlations for HFOs during the PRE and POST epochs were much greater than expected by chance,
    while excess correlations during the BEHAV epoch were also slightly greater than chance levels
    ( Figure S3A ; rank-sum test; P < 0.01). This analysis also revealed that during LS HFOs there
    is a higher degree of co-activation than observed during behavior or expected given LS firing
    rates (rank-sum test; P < 0.001 for PRE vs BEHAV and BEHAV vs POST)
  statistics:
  - about: PRE, BEHAV and POST excess correlations against jittered spikes
    test: rank-sum test
    p: 0.01
    p_relation: "<"
  - about: PRE against BEHAV and BEHAV against POST
    test: rank-sum test
    p: 0.001
    p_relation: "<"
  depends_on:
  - fig4b-pre-post-unchanged
  criterion: Same pairs and measure as fig4b-pre-post-unchanged under each of its readings. The
    jittered value moves every spike by a uniform random amount in +-200 ms and repeats the
    analysis (STAR Methods); one jitter per pair, as the Methods describe one. Reproduced when PRE
    and POST each exceed BEHAV by rank-sum p < 0.001 and PRE, POST and BEHAV each exceed their
    jittered values by rank-sum p < 0.01; partially reproduced when one of the two parts holds.
- id: fig4-sessions-few-change
  statement: Only 7 of 53 sessions have significantly different excess correlations in PRE and
    POST (rank-sum P < 0.01), three with PRE below POST and four with PRE above.
  source: Results, paragraph 3
  quote: Only 7 out of 53 sessions had significantly different excess-correlation values for PRE and
    POST epochs (rank-sum test; P < 0.01), three where PRE was less than POST and four where PRE was
    greater than POST
  depends_on:
  - fig4b-pre-post-unchanged
  expected:
  - quantity: sessions with pairs
    value: 53
    tolerance: 5.3
  - quantity: fraction of sessions with PRE different from POST
    value: 0.132
    tolerance: 0.0132
  criterion: Per session, a rank-sum test of PRE against POST excess correlations over its pairs
    at p < 0.01, under the readings of fig4b-pre-post-unchanged. The paper sets no minimum of
    pairs per session; every session with pairs is tested. Reproduced when the session count and
