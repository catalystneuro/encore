- id: figs2-post-rate-increase
  statement: Firing rates increase during post-behavior NREM sleep in CA1, CA3 and LS.
  source: Results, fifth paragraph (Figure S2A, B)
  quote: we observed a systematic increase in firing rates during post-behavior NREM sleep in CA1,
    as well as CA3 and LS populations
  criterion: Per unit, the firing rate in NREM within PRE and within POST, for units in
    recordings with sleep states and at least 60 s of NREM in each epoch. Per region (`hpc`,
    `ca3`, `ls`), a Wilcoxon signed-rank test, at p < 0.05, with the median POST/PRE ratio
    above 1. Reproduced when all three regions show the increase, partially reproduced when
    one or two do.
- id: fig5b-nrem-and-rates
  statement: LS HFOs occur primarily during NREM sleep, and their rates are lower than those of
    hippocampal SPW-Rs.
  source: Results, sixth paragraph; Figure 5A, B
  quote: we primarily observed HFO events during NREM sleep (Figure 5A) ... the overall rates of LS
    HFOs were significantly lower than hippocampal SPW-Rs (Figure 5B)
  criterion: Per recording with sleep states, the LS HFO rate in NREM and in WAKE, and the CA1
    ripple rate in NREM where a hippocampal channel exists. Reproduced when the NREM rate
    exceeds the WAKE rate (Wilcoxon signed-rank over recordings, p < 0.05, median ratio
