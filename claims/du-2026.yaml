    0.01372 in the released numerical velocity units per 20 ms bin. Adding measured-output
    history reduced the remaining MSE by 2.72%. Corresponding TCR reductions were 2.83% and
    1.31%.
  datasets:
  - "001201"
  depends_on:
  - nested-geometry-gain
  - nested-history-gain
  expected:
  - quantity: SBP geometry-by-phase mean percentage MSE reduction
    value: 4.92
    tolerance: 0.492
    unit: percent
  - quantity: SBP mean context RMSE, geometry by phase
    value: 0.01407
    tolerance: 0.001407
    unit: released velocity units per 20 ms bin
  - quantity: SBP mean correct-pair RMSE, geometry by phase
    value: 0.01372
    tolerance: 0.001372
    unit: released velocity units per 20 ms bin
  - quantity: SBP plus-history mean percentage MSE reduction
    value: 2.72
    tolerance: 0.272
    unit: percent
  - quantity: TCR geometry-by-phase mean percentage MSE reduction
    value: 2.83
    tolerance: 0.283
    unit: percent
  - quantity: TCR plus-history mean percentage MSE reduction
    value: 1.31
    tolerance: 0.131
    unit: percent
  criterion: Per session 100 (MSE_C - MSE_C+X) / MSE_C (Methods 4.9), averaged over the 18
