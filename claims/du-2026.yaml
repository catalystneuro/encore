  source: Results 2.2, paragraph 2; Figure 2a
  quote: The template-only median context-conditional neural gain was -0.0000023 (range,
    -0.0000588 to 0.0000248; Figure 2)
  data: elsewhere
  where: Not deposited; generated by the paper's code, github.com/gwkuqgfkqe/neural-decoder-context-audit
    tag v1.0-jne-submission (commit b042fbe), src/neural_evidence/synthetic.py and
    scripts/run_synthetic_calibration.py
  expected:
  - quantity: template-only median gain over seeds 20260726 to 20260735
    value: -0.0000023
    tolerance: 0.03
    unit: delta R2
  criterion: The generator and regimes are those of Methods 4.8 (480 trials, 60 bins, eight
    conditions, 48 neural features, AR(1) coefficient 0.85, template scale 1.0, neural noise SD
    0.20; template-only regime trial-signal scale 0.20 and embedding strength 0), seeds 20260726
    to 20260735, estimated with the fully nested estimator. The tolerance is the paper's own
    prespecified criterion, template-null median absolute gain below 0.03 (Methods 4.8), since
    10% of a value this close to zero has no meaning. Reproduced when the median absolute gain is
    below 0.03; the median and range are reported.
