- id: context-capacity-contrast
  statement: Adding quadratic geometry to the context changed the descriptive RD-minus-CO gain
    contrast, and the richest quadratic-history context gave a small positive contrast for both
    SBP and TCR.
  source: Results 2.7, paragraph 2; Figure 7c
  quote: Adding quadratic geometry changed the descriptive RD-minus-CO contrast, and the richest
    quadratic-history specification yielded a small positive contrast for both SBP and TCR.
  datasets:
  - "001201"
  depends_on:
  - nested-geometry-gain
  criterion: Contexts linear geometry by phase (141 features), quadratic (351), linear plus
    history (151), quadratic plus history (361) (Methods 4.4; link.py geometry_quadratic and
    causal_history_quadratic). The release has no script for this run; the fully nested
    estimator is assumed, as for the other development results, and the Figure 7c intervals are
    paired date-bootstrap intervals (as in link-task-contrast-by-context). The paper calls these
    exploratory. Reproduced when the quadratic-plus-history mean RD minus CO difference is
    positive for SBP and for TCR, and, for at least one signal, the quadratic-geometry contrast
    differs from the linear-geometry contrast in sign or in whether its 95% interval excludes
    zero (the paper gives no measure of "changed"; these are the two readings).
