# Claims for Du, Lai, Hu & Ye (2026), "A Context-Conditional Audit of Trial-Pairing-Dependent
# Neural Gain in Motor-Cortex Decoding", bioRxiv doi:10.64898/2026.08.04.742876, tested on
# DANDI:001201 (LINK) and DANDI:000129 (MC_RTT).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-21,
# protocol as stated in docs/protocol.md (version pilot-18, Reader).
#
# Text read. The bioRxiv preprint posted August 10, 2026 (a Journal of Neural Engineering
# submission), full text in paper/10.64898-2026.08.04.742876.txt: main text, figure legends,
# Tables 1 to 3, Methods, Data and Code availability. No PDF was supplied. The paper's
# Supplementary information (formal properties, complete ladder results, replacement
# diagnostics, confirmation details, nonlinear-map seeds, temporal and capacity sensitivities)
# is not under paper/ and is not in the code release; every claim below rests on numbers the
# main text or its tables state. The one main-text sentence that points to supplement values
# (replacement ranks one to five) is a claim judged by sign alone (replacement-ranks-lower).
#
# Code read. github.com/gwkuqgfkqe/neural-decoder-context-audit, tag v1.0-jne-submission,
# commit b042fbe1cda2ca5a353751c693d7c95f45de0456 (Code availability names this release). It
# holds the loaders (src/neural_evidence/link.py, mc_rtt.py, mc_maze.py), the fully nested and
# nonlinear estimators (nested_estimators.py), the synthetic generator (synthetic.py), run
# scripts for the synthetic calibration, the primary analyses, the LINK context ladder, the
# confirmation and the nonlinear-map seeds, the figure builder, tests, and frozen outputs and
# figure source tables. It holds no script for the temporal-offset, quadratic-capacity,
# block-penalty or nonlinear-context runs; only their frozen tables. Frozen outputs were not
# used to set any expected value; every expected value is the paper's.
#
# The datasets. DANDI:001201 is LINK, long-term Utah-array recordings from one macaque
# (Monkey N) doing a finger task in center-out (CO) and random-target (RD) sessions. DANDI:000129
# is MC_RTT, the Neural Latents Benchmark self-paced random-target reaching session of monkey
# Indy. The paper also uses MC_Maze-medium, DANDI:000139 version 0.220113.0408, which is not one
# of this attempt's datasets: its claims are data elsewhere. The synthetic calibration uses data
# generated by the paper's code: data elsewhere.
#
# Data the paper used, as it reports them (Methods 4.2 and 4.3, Table 2).
# - LINK, Dandiset 001201 version 0.251023.2336. Development set: the nine dates that have both a
#   CO and an RD session, 18 sessions, 6,750 usable trials, 375 per session. The code's
#   data/data_manifest.json lists them: 2021-10-15, 2022-02-25, 2022-04-08, 2022-04-15,
#   2022-04-29, 2022-05-13, 2022-08-10, 2022-09-21, 2022-11-02. Confirmation set: 10 CO and 10 RD
#   sessions, outside the development set, taken by sorting assets by date and asset ID within
#   task and picking those nearest the interior ranks j/11, j = 1 to 10 (7,500 usable trials);
#   the selected assets are listed in the code's outputs/primary_analysis/
#   link_confirmation_manifest.json. Features are the public 20 ms series in the NWB analysis
#   module: 96-channel spiking-band power (SBP, "SpikingBandPower") and threshold-crossing rate
#   (TCR, "ThresholdCrossings"), finger position and velocity. Outcome is two-dimensional
#   finger velocity (code: index_velocity and mrs_velocity); position is index_position and
#   mrs_position; targets are the trials table's index_target_position and mrs_target_position.
# - MC_RTT, Dandiset 000129 version 0.241017.1444, sub-Indy_desc-train_behavior+ecephys.nwb.
#   1,080 fixed blocks (the trials table), 130 units, finger velocity, cursor position, target
#   position; release split 810 train and 270 validation blocks.
# - MC_Maze-medium, Dandiset 000139, one session, 250 trials, 27 conditions, 152 units, 188/62
#   release split.
#
# Shared method, from the Methods and the code (cited per item).
# - LINK trial windows (Methods 4.3; link.py). 25 velocity bins of 20 ms (500 ms) per trial.
#   Neural features for each velocity bin are the eight 20 ms bins (160 ms) of SBP or TCR over 96
#   channels ending immediately before that bin, flattened to 768 predictors. In the code the
#   trial's start bin is the neural timestamp nearest the trial start_time, and the window starts
#   after the history warm-up (8 bins, 160 ms, for the primary analyses); a trial is dropped when
#   its window runs past start bin plus trial_count. Initial position is the position at the
#   start bin.
# - LINK contexts (Methods 4.4; link.py). Phase basis 1, sin(r pi tau), cos(r pi tau), r = 1 to 4,
#   tau the within-window phase in [0, 1). Direction is the octant of target minus initial
#   position (code floor(((atan2(dy, dx) + pi) / 2 pi) 8) mod 8). Ladder: phase only (9 features);
#   direction by phase plus phase (81); plus additive target, initial position and displacement
#   (87); plus geometry by phase (141, "geometry by phase", the primary context); plus five past
#   bins of two-dimensional measured finger position ending at the same bin as the neural
#   history (151, "measured-output history"). Quadratic sensitivities add the 21 second-order
#   products of the six geometry variables and their phase interactions (351 and 361 features).
# - MC_RTT (Methods 4.3 and 4.4; mc_rtt.py). Behavior averaged from 1 kHz samples into 20 ms bins,
#   spikes histogrammed on the same grid; five 20 ms spike-count bins over 130 units (650
#   predictors) ending 80 ms before each behavior bin. Headline context is target plus five
#   cursor-position history bins ending at the same 80 ms boundary plus target minus the last
#   history cursor position. Direction octant of the block's mean target error is used for
#   stratification and replacement matching. Blocks use all bins after the warm-up (code; 21
#   bins per block in Table 2).
# - Fully nested estimator (Methods 4.5; nested_estimators.py, evaluate_fully_nested_audit).
#   Ridge with predictors standardized on each training scope, penalty grid 0.1, 1, 10, 100, 1e3,
#   1e4, 1e5. LINK outer split 70/30 whole trials stratified by direction (code random_state
#   20260726 for the primary results); NLB uses the release labels. Five condition-stratified
#   nuisance folds; in each, separate context-to-behavior and context-to-neural penalties from an
#   inner 80/20 split of the fold's training trials, refit on the fold's training trials, predict
#   the held fold. The residual learner maps out-of-fold neural residuals to out-of-fold behavior
#   residuals; its penalty by three-fold whole-trial validation on those residuals; refit on all.
#   Final nuisance penalties from an inner split of all outer-training trials, nuisances refit on
#   all of them, the outer test evaluated once.
# - Gain (Results 2.1, Methods 4.9). Gain = (MSE_C - MSE_C+X) / Var(Y) on the flattened outer-test
#   bins of one session, MSE averaged over both components, Var(Y) the component-averaged squared
#   deviation from each test-component mean. R2 is variance-weighted multi-output. Percentage MSE
#   reduction = 100 (MSE_C - MSE_C+X) / MSE_C. A task mean is the mean over its sessions; a
#   combined LINK mean is the mean over all sessions.
# - Replacement (Methods 4.7). For each test trial, the source is another test trial of the same
#   condition minimizing mean squared distance between complete flattened context trajectories,
#   standardized with outer-training centers and scales; integer trial index breaks ties; the
#   source's neural history is residualized with its own context. Permutation diagnostic: 100
#   within-condition permutations of test trials without fixed points; fitted model held fixed.
# - LINK date-clustered intervals (Table 1 legend; build_submission_figures.py,
#   date_cluster_summary). Resample the nine dates with replacement 10,000 times, take the mean
#   gain over the sessions of the sampled dates, 2.5 and 97.5 percentiles. NLB intervals resample
#   held-out trials within condition (estimators.py, _cluster_bootstrap_delta_r2; 500 resamples in
#   run_primary_analyses.py).
#
# Details the paper and code leave open are named in the criteria of the claims they affect.
schema_version: 2
