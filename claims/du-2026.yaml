    LINK session, with an across-session mean of -0.0142.
  source: Results 2.4, paragraph 2
  quote: The mean of 100 within-condition whole-trial permutations was negative in every session
    (across-session mean, -0.0142).
  datasets:
  - "001201"
  depends_on:
  - nested-geometry-gain
  expected:
  - quantity: across-session mean of session permutation-mean gains
    value: -0.0142
    tolerance: 0.00142
    unit: delta R2
  criterion: Permutations as in Methods 4.7. The sentence follows the primary SBP geometry
    sentence, but which sessions it covers is not stated; readings (a) the 18 SBP
    geometry-by-phase sessions, (b) the 36 sessions of SBP and TCR under geometry by phase.
    Reproduced when, under a reading, every session's permutation mean is negative and the
    across-session mean is within tolerance.
- id: replacement-penalty-distance
  statement: The replacement penalty had no consistent rank relation to the nearest-source
    context distance across sessions.
  source: Results 2.4, paragraph 2
  quote: Replacement penalty had no consistent rank relation to nearest-source distance across
    sessions
  datasets:
  - "001201"
  depends_on:
  - nested-replacement-negative
  criterion: Per session, the Spearman correlation over test trials between the nearest-source
    distance and the replacement penalty (trial MSE under replacement minus trial MSE under
    correct pairing), as computed in nested_estimators.py. The paper gives no test; "no
    consistent rank relation" is read as (a) the session correlations are not all of one sign, or
    (b) the across-session mean correlation has a 95% date-bootstrap interval (as for Table 1)
    that contains zero. A claim of absence with no test in the paper; reproduced when both
    readings hold, partially when one does, not reproduced when neither. Sessions are the 18 SBP
    geometry-by-phase sessions.
- id: replacement-ranks-lower
  statement: Replacement with the first to fifth nearest sources and with a random same-condition
    source all lowered the across-session mean gain.
  source: Results 2.4, paragraph 2 (values in the supplement, not available)
  quote: Ranks one through five and a random same-condition source, reported in the supplement,
    all lowered the across-session mean.
  datasets:
  - "001201"
  depends_on:
  - nested-replacement-negative
  criterion: The supplement with the values was not available, so only the direction is judged.
    For each of the six source rules, the across-session mean gain is compared with the
    correct-pair across-session mean. Which sessions are meant is not stated; readings (a) the 18
    SBP geometry-by-phase sessions, (b) SBP and TCR geometry-by-phase sessions, each signal
    separately. How the random source is drawn is not given beyond "same-condition"; a uniform
    draw among the other same-condition test trials with a fixed seed is a standard choice, and
    three draws are shown. Reproduced when, under a reading, all six means are below the
    correct-pair mean.
