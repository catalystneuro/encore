- id: representative-trial
  statement: The prespecified rule for the illustrative trajectory (session with median primary
    SBP geometry gain, then the held-out trial with median context-minus-correct trial MSE
    improvement) selects 2022-09-21 RD, trial 123.
  source: Figure 8a and legend; Methods 4.9, last paragraph
  quote: Prespecified median-improvement trial... 2022-09-21 RD, trial 123
  datasets:
  - "001201"
  depends_on:
  - nested-geometry-gain
  criterion: Rule of Methods 4.9; ties to the earlier date and the lower trial index. With 18
    sessions there is no single median session; the paper's tie rule takes the earlier date, read
    as the lower of the two middle sessions (the ninth in gain order), or the one of the two
    middle sessions with the earlier date. With an odd number of test trials (113) the median
    trial is the middle one. What "trial 123" indexes is not stated; readings (a) the row of the
    session's NWB trials table, (b) the index among the session's usable trials (the code's
    trial_id), (c) the position among the session's held-out trials. Reproduced when the rule
    selects 2022-09-21 RD and the selected trial is 123 under a reading; partially reproduced
    when only the session matches.
