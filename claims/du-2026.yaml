  statement: Shifting both the neural and the measured-output histories back by 40, 80 and 120 ms
    with the behavioral window fixed reduced the small output-history-conditional gain and
    changed the RD direction at intermediate offsets.
  source: Results 2.7, paragraph 1; Figure 7a
  quote: Holding the behavioral window fixed and shifting both neural and measured-output
    histories to offsets 0, 40, 80, and 120 ms reduced the small output-history-conditional gain
    and changed the RD direction at intermediate offsets (Figure 7).
  datasets:
  - "001201"
  depends_on:
  - nested-history-gain
  criterion: LINK SBP, geometry by phase plus measured-output history, 18 development sessions,
    fully nested estimator, CO and RD means at offsets 0, 40, 80 and 120 ms (the offset is the
    gap between the end of both histories and the behavior bin; link.py neural_lead_ms and
    output_lead_ms). The release has no script for this run. Holding the window fixed is read
    as one window start for all offsets, the earliest that the 120 ms offset allows (eight SBP
    bins plus six offset bins, 280 ms after the trial start bin; link.py sample_offset_ms), so
    the gain at offset 0 here differs from nested-history-gain. "Reduced" is read as the gain
    at 120 ms below that at 0 ms for both tasks. "Changed the RD direction" is open; readings
    (a) the RD mean gain is negative at 40 or 80 ms, (b) the RD minus CO difference at 40 or 80
    ms has the opposite sign to that at 0 ms. Reproduced when the reduction holds and a reading
    of the RD change holds.
