- id: estimator-family-link
  statement: Separately penalized context and neural blocks and nonlinear context random features
    retained positive LINK task means, with magnitudes that differed between estimator families.
  source: Results 2.6, paragraph 5; Figure 5a
  quote: Separately penalized context and neural blocks and nonlinear context random features
    retained positive LINK task means
  datasets:
  - "001201"
  depends_on:
  - nested-geometry-gain
  - nested-history-gain
  criterion: Block penalties minimize the objective of Methods 4.5 with lambda_C and lambda_X
    chosen separately from the grid; nonlinear context augments standardized context with
    random Fourier features (Methods 4.6). The release has no run script for these, and the
    Methods do not say how the penalties are selected for the block model or which of the
    nonlinear-context settings (D = 128, 256, 512; three map seeds; g in 0.25, 1, 4) Figure 5
    shows. Readings for the nonlinear context, (a) every setting, (b) D = 256 and seed 20260726
    with g chosen per session from the three values by inner validation, as the frozen
    rff_capacity_sensitivity.csv baseline rows suggest. For the block model, penalties chosen
    jointly on the inner 80/20 split of the outer-training trials (as for the nuisances). "Task
    means" are read as the four signal-by-context means of Figure 5a (SBP and TCR, geometry by
    phase and plus history). Reproduced when all are positive for both families under a reading.
