- id: fig1f-rem-shift
  statement: Earlier-born light-responsive neurons more often shift their preferred theta phase in
    REM sleep (30.89% at E13.5 to 19.7% at E16.5; regression slope -3.42% per day).
  source: Figure 1f; Results, In vivo recordings from birthdated CA1 pyramidal neurons,
    paragraph 1; Methods, REM shifting and theta-depth modulation
  quote: received the strongest drive from the entorhinal cortex, as reflected indirectly by the
    largest fraction of pyramidal neurons with a theta-phase preference that shifted in rapid eye
    movement (REM) sleep ( Fig. 1f )
  statistics:
  - test: linear regression (bootstrap, one tailed)
    statistic: slope = −3.42%
    p: 0.028
    n: 123, 106, 143 and 76 modulated neurons
  expected:
  - quantity: percentage REM shifting, E13.5
    value: 30.89
    tolerance: 3.09
    unit: percent
  - quantity: percentage REM shifting, E14.5
    value: 24.5
    tolerance: 2.45
    unit: percent
  - quantity: percentage REM shifting, E15.5
    value: 23.8
    tolerance: 2.38
    unit: percent
  - quantity: percentage REM shifting, E16.5
    value: 19.7
    tolerance: 1.97
    unit: percent
  - quantity: regression slope
    value: -3.42
    tolerance: 0.342
    unit: percent per day
