  source: Figure 1e; Results, In vivo recordings from birthdated CA1 pyramidal neurons, paragraph 1
  quote: The fraction of light-responsive pyramidal neurons at each birthdate was consistent with
    the previously observed, bell-shaped wave of hippocampal neurogenesis peaking between E14 and
    E15
  statistics:
  - test: ANOVA (bootstrap)
