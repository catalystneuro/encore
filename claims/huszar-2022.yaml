- id: fig4d-model-fit
  statement: A model with a bell-shaped rate of neurogenesis and correlations among SBD neurons
    reproduces the assembly expression rates, a model without the correlations does not, and a
    uniform-neurogenesis model does not at any parameters.
  source: Figure 4c,d; Extended Data Figures 8 and 9; Results, Cofiring of SBD neurons interacts
    with rates of neurogenesis
  quote: as we increased the strength of correlations, the bell-shaped model generated assembly
    dynamics yielding a good match to those observed in data ( Fig. 4c , d and Extended Data Fig.
    8d , e ). ... which failed to capture assembly dynamics observed in data across all tested
    parameters ( Extended Data Fig. 9 ).
  criterion: Simulation as the Methods give it (linear-nonlinear Poisson; 350 units with
    birthdates from N(14.5, 1 d) or uniform; squared exponential covariance in birthdate
    difference with sigma_max^2 and tau; mean rates matched to the SPW-R rate distributions of
    Figure 2f per birthdate bin; 25 ms steps, 10,000 samples; ICA as fig3c; run until 200
    assemblies; Gaussian process fit; error the cumulative -log P of the four observed mean
    rates; 100 uniform-model runs per parameter pair as the null, one-tailed). The parameter grid
    is the code's (revision2022_code/hpc/devAssembly_paramsVrev.mat, devAssembly_simVrev.m).
    Reproduced when, under the bell-shaped model, the error at the largest sigma_max^2 and tau is
    below that at sigma_max^2 near zero, and a region of the grid at large sigma_max^2 has P <
    0.05 against the uniform model while the small sigma_max^2 corner does not. Partially
    reproduced when the bell-shaped model improves with correlations but no grid point beats the
    uniform model.
  depends_on:
  - fig2f-ripple-firing-by-birthdate
  - fig3e-assembly-expression
