    overlapping, yet distinct, sublayers spanning the deep-to-superficial axis of the pyramidal
    layer ( Fig. 1b , c )
  statistics:
  - test: Kruskal–Wallis
    statistic: H = 4.5 × 10^3, d.f. = 3
    p: 0
    n: 2,657, 1,993, 7,749 and 9,173 tdTomato+ puncta
  expected:
