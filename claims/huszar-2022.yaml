- id: ed3-depth-control
  statement: Birthdate differences in single-cell features are not explained by anatomical depth
    alone; after matching depth distributions the bell-shaped birthdate profiles remain in most
    resamplings.
  source: Extended Data Figure 3; Results, Cofiring of SBD pyramidal neurons in all brain states,
    paragraph 1; Supplementary Table 2
