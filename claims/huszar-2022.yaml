    tolerance: 0.071
  - quantity: median normalized depth, E14.5
    value: 0.48
    tolerance: 0.048
  - quantity: median normalized depth, E15.5
    value: 0.28
    tolerance: 0.028
  - quantity: median normalized depth, E16.5
    value: 0.19
    tolerance: 0.019
  criterion: Histology, as the Methods give it (perpendicular distance to the SP-SR border over
