# Claims for Huszar, Zhang, Blockus and Buzsaki (2022), Preconfigured dynamics in the hippocampus
# are guided by embryonic birthdate and rate of neurogenesis, Nature Neuroscience 25, 1201-1212,
# tested on dandiset 000552.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-19,
# protocol pilot-16 as stated in docs/protocol.md. The writer did not look at the dandiset's data or
# files; only its title and description on the archive were read. This file replaces the version of
# 2026-10-19, whose opening comment recorded outputs of a data check and fixed method choices from
# them (a 5 Hz rate rule for pyramidal cells, a 0.2 s speed smoothing, a 5 cm/s running threshold
# for theta-related rates); those are removed, and every method detail below is taken from the
# paper or its code, or named as open.
#
# Text read: the author manuscript in PubMed Central (PMC10807234, NIHMS1955147), full text as
# served by NCBI PMC: main text, Methods, main figure legends and Extended Data Figure 1 to 10
# legends; with its two supplements, the Reporting Summary (NIHMS1955146_Supplemental_Material.pdf)
# and the Supplementary Information (NIHMS1955146_Supplemental_Material_2.pdf, Supplementary
# Tables 1 to 5). The supplementary tables are images in that PDF; they were read from the images.
# The version of record is not open access. Main figure images were not available, so values
# printed only inside panels could not be read.
#
# Code read: github.com/rhuszar/optotagCA1_final, commit 51320d4 (its only commit), the repository
# of the author named under Code availability. It holds MATLAB scripts for the homecage metrics
# (revision2022_code/getHomecageMetrics.m, get_corrHome_v2.m), maze and novel environment analyses
# (revision2022_code/get_corrBeh_v3.m, get_corrBeh_famnov.m), figure statistics
# (revision2022_code/analyze_sngUnitMetrics.m, analyze_pairwise.m, analyze_assemblies.m),
# monosynaptic analyses (revision2022_code/get_monoConnections.m), ICA assemblies and the network
# model (revision2022_code/hpc/runAssembly_Vrev.m, devAssembly_simVrev.m and its parameter file),
# and saved outputs (.mat). Not in it: the session list (basepaths_mac_rev1.mat), the rate map
# builder (getFiringMaps_rh_v2), the code writing BehaviorMetrics.mat (spatial information and
# coverage of Figure 5b), the theta cycle and theta modulation detectors, the monosynaptic
# connection detector, the spike transmission function (GetTransProb) and the bootstrap ANOVA
# (boot_anova1). The buzcode repository also named under Code availability holds the lab's
# detectors (state scoring, SPW-R detection) that the Methods cite by URL.
#
# Data the paper used. C57BL/6 mice, in utero electroporated with ChR2-eYFP and tdTomato at E13.5,
# E14.5, E15.5 or E16.5; 17 adult mice (12 male, 5 female, 3-6 months) chronically implanted in
# dorsal CA1 with high-density silicon probes (250 um shank spacing) and an optic fibre; 30 kHz
# wideband, LFP at 1,250 Hz. Supplementary Table 1 lists the mice (E13.5 1m1, 1f1, 16f1, 26m1;
# E14.5 1m1, 2m2, 2m3; E15.5 4m1, 4m2, 5m1, 9f1, 10m1, 13f1; E16.5 1f1, 2m1, 3m1, 3m2; the code
# writes e13_26m1 and so on), with each mouse's sessions and light-responsive cells and the
# analyses it enters: 15 mice (all but E15.5 13f1 and E16.5 3m2) in the homecage analyses of
# Figures 1 to 4 and 7; 9 mice (E13.5 16f1, 26m1; E14.5 2m2, 2m3; E15.5 9f1, 10m1; E16.5 1f1, 2m1,
# 3m1) in the familiar figure-eight analyses of Figure 5; 3 mice (E13.5 26m1, E15.5 13f1, E16.5
# 3m2) in the novel environment analyses of Figure 6. Each session has a homecage period of sleep
# and wake; maze sessions add ~120 min homecage, the figure-eight maze (205 cm trials, left and
# right alternation, 5 s delay, 30 Hz overhead tracking of head LEDs), ~120 min homecage; novel
# sessions add, after the figure-eight, ~60 min homecage and one or two novel environments (linear
# tracks, open fields, a figure-eight). Optogenetic light pulses (blocks of five, 1.5-3 ms, 200 ms
# apart, 300-1,600 blocks) are given at the end of each session in the homecage. Measured
# variables the claims need are unit spike times and channels with shank, putative cell type,
# light-responsiveness (or the pulse times to derive it), sleep states, SPW-Rs, theta LFP or
# cycles, maze epochs, trials and position. Figure 1c and Extended Data Figure 1 rest on histology
# (tdTomato puncta depths, BrdU counts) that the paper describes but that need not be in the dandiset.
#
# Methods common to the claims, from the Methods and code.
# - Pyramidal cells and interneurons are CellExplorer's classification (Methods, Unit isolation
#   and classification); the code takes cell_metrics.putativeCellType matching 'Pyramidal' and
#   'Interneuron' (getHomecageMetrics.m, get_corrBeh_v3.m).
# - Light-responsive (birthdated) pyramidal cells pass SALT at P <= 0.001 and the reliability
#   tests at alpha 0.001 Bonferroni corrected (Methods, Detection of light-responsive...); the code
#   reads them as cell_metrics.optoTag.p_salt < 0.001 and optoTag.h_reliable. Where a stored label
#   exists it is used (reading a); otherwise they are detected from the pulses as the Methods say
#   (reading b).
# - SBD pairs are all unique pairs of light-responsive pyramidal cells in a session; DBD pairs are
#   all pairs of one light-responsive and one nonresponsive pyramidal cell in a session (Methods,
#   SBD versus DBD pairs; get_corrHome_v2.m).
# - Homecage period. In the code (getHomecageMetrics.m, get_corrHome_v2.m) homecage metrics use the
#   recording up to the start of the second behavioural subsession when there is one, else the
#   whole recording, without optogenetic pulse periods and maze epochs.
# - SPW-Rs as the Methods give them (130-200 Hz, 4th order Chebyshev, peak 5 SD, edges 2 SD,
#   20-200 ms, noise channel exclusion; buzcode bz_FindRipples.m). The code uses all ripples of the
#   homecage period, without a NREM restriction. Where the dataset holds detected ripples they are
#   used.
# - Theta cycles as the Methods give them: a channel above the pyramidal layer centre (positive
#   sharp wave), 6-12 Hz 4th order Chebyshev, Hilbert phase and amplitude, intervals with amplitude
#   above mean + 1 SD, cycles between consecutive 0 degree crossings, only within waking periods.
# - Multigroup tests (ANOVA, Kruskal-Wallis) are bootstrap tests (Methods, Statistical analysis);
#   data pooled and reassigned to groups with replacement, 5,000 resamplings, p the fraction of
#   null statistics at or above the observed. Group comparisons are two-sided Wilcoxon rank-sum.
# - Rate maps (Methods, Spatial ratemap analyses). Linearized trials, velocity by a Kalman filter,
#   moments with speed > 1.5 cm/s, spikes and occupancy in 1 cm bins for left and right trials
#   apart, each smoothed with a 9 cm FWHM Gaussian, rate is smoothed spikes over smoothed
#   occupancy, never-visited bins excluded. Open fields, 1 cm x 1 cm bins, 4.5 cm FWHM. The
#   familiar figure-eight is the first behavioural subsession, novel environments the later ones
#   (get_corrBeh_famnov.m, "1 is always familiar").
#
# Open details common to several claims.
# - The Kalman filter's model and noise settings are not given; the code's open field call is
#   trajectory_kalman_filter(x, y, t, 2) (novelEnv_example.m). A standard constant-velocity filter
#   is used; it cannot change outcomes at a 1.5 cm/s threshold beyond the margin of single bins.
# - The bootstrap post hoc test (Tukey q on bootstrap nulls) is not in the code; post hoc P values
#   of Supplementary Tables 3 to 5 are reported for comparison, not judged.
# - The session list itself is not in the code. The sessions are those of the mice of
#   Supplementary Table 1 for each analysis.
schema_version: 2
paper: doi:10.1038/s41593-022-01138-x
claims:
- id: cohort-birthdates
  statement: Chronic recordings were made from 17 adult mice (12 males, 5 females) electroporated
    at E13.5 (n = 4), E14.5 (n = 3), E15.5 (n = 6) and E16.5 (n = 4).
  source: Methods, Implantation and recording, paragraph 1; Supplementary Table 1; Reporting
    Summary, Sample size
  quote: "Chronic recordings were performed from n = 17 freely moving adult mice (12 males, 5
    females; age 3–6 months; electroporated at: E13.5, n = 4; E14.5, n = 3; E15.5, n = 6; E16.5, n =
    4)"
  expected:
  - quantity: mice
    value: 17
    tolerance: 0
  - quantity: males
    value: 12
    tolerance: 0
  - quantity: females
    value: 5
    tolerance: 0
  criterion: Mice are the distinct subjects; sex and electroporation day as the subjects'
    records give them, matched to the animal ids of Supplementary Table 1 (the day is part of each
    id, as e13_26m1 in the code). Counts of animals carry no measurement error, so the tolerance
    is zero. Reproduced when the counts of mice, of each sex and of each birthdate all match.
    Not reproduced otherwise.
- id: st1-animal-sessions
  statement: Supplementary Table 1 lists each mouse's recording sessions and light-responsive
    cells; the 15 homecage mice contribute 96 sessions and 664 light-responsive cells, and the
    17 mice 104 sessions.
  source: Supplementary Table 1
  inferred: Per-animal counts from the image of Supplementary Table 1 (sessions 12, 5, 12, 3, 4, 3,
    9, 4, 8, 7, 7, 9, 5, 4, 4, 4, 4 in the table's row order; light-responsive cells 14, 6, 56, 35,
    68, 19, 124, 9, 67, 67, 44, 49, 23, 43, 40, 53, 69). The sums are this reader's; no sentence
    states them. The 96 sessions of the 15 homecage mice match the session counts of Figure 1e
    (30, 24, 24, 18) and the Figure 7f legend (n = 96 sessions, n = 15 mice).
  expected:
  - quantity: sessions of the 15 homecage mice
    value: 96
    tolerance: 0
  - quantity: sessions of all 17 mice
    value: 104
    tolerance: 0
  - quantity: light-responsive pyramidal cells of the 15 homecage mice
    value: 664
    tolerance: 66.4
  criterion: Sessions counted per mouse and compared with the table row by row. Session counts
    are bookkeeping, so their tolerance is zero; the light-responsive count depends on
    detection and has the 10% default. Reproduced when every mouse's session count matches and
    the 664 is within tolerance (light-responsive cells as in the opening comment). Partially
    reproduced when at least 14 of 17 mice match. The per-mouse light-responsive counts and their
    percentages of pyramidal cells are reported against the table.
- id: sessions-durations
  statement: The recordings comprise 92 sessions lasting 113.7 to 475.6 min (median 309.1 min),
    each including a homecage period of sleep and wake.
  source: Methods, Implantation and recording, paragraph 2
  quote: All recordings (92 sessions ranging in duration from 113.7 min to 475.6 min; median
    duration = 309.1 min) included a homecage period of sleep and wake.
  expected:
  - quantity: number of sessions
    value: 92
    tolerance: 9.2
  - quantity: median session duration
    value: 309.1
    tolerance: 30.9
    unit: min
  criterion: A session is one recording day of one mouse; its duration is the length of the
    recording. The paper gives three session counts that disagree, 92 (this sentence), 96 (Figure
    1e, Figure 7f legend, and the 15 homecage mice of Supplementary Table 1) and 104 (all 17 mice of
    Supplementary Table 1); the count, median and range are judged on each of these session sets,
    listed before the analysis. The range holds when every duration lies within 113.7 to 475.6 min
    widened by 10% of each bound (102.3 to 523.2 min). Reproduced when, under one reading, the
    count is within tolerance, the median is within tolerance and the range holds, and every
    session holds sleep states including non-REM sleep. Partially reproduced when the durations
    hold under one reading and the count under none. Not reproduced otherwise.
  depends_on:
  - st1-animal-sessions
- id: spwr-duration
  statement: The median duration of SPW-Rs across all recordings is 36.4 ms, under detection
    limits of 20 to 200 ms.
  source: Figure 2b legend; Methods, SPW-R detection
  quote: SPW-R duration limits were set to be between 20 and 200 ms. ... White dotted lines indicate
    the median duration of SPW-Rs across all recordings (36.4 ms).
  expected:
    quantity: median SPW-R duration
    value: 36.4
    tolerance: 3.64
    unit: ms
  criterion: SPW-Rs as in the opening comment, durations from start to stop. "Across all
    recordings" can be read as (a) the median over all ripples pooled over sessions, (b) the
    median of per-session medians; and the ripple set as (i) all detected ripples of each
    session, (ii) homecage ripples as the code uses them. Reproduced when the median is within
    tolerance under one combination and every ripple lies within 20 to 200 ms. Partially
    reproduced when only one of the two holds. Not reproduced when neither does.
- id: unit-count
  statement: The dataset includes 9,471 well-isolated units, 7,411 putative pyramidal cells and
    2,060 putative interneurons (1,556 narrow waveform, 504 wide waveform).
  source: Methods, Unit isolation and classification; Extended Data Figure 2a legend
  quote: The dataset includes a total of 7,411 well-isolated putative pyramidal cells and 2,060
    putative interneurons (1,556 narrow waveform, 504 wide waveform; ... for isolated units ( n =
    9,471)
  expected:
  - quantity: well-isolated units
    value: 9471
    tolerance: 947
  - quantity: putative pyramidal cells
    value: 7411
    tolerance: 741
  - quantity: putative interneurons
    value: 2060
    tolerance: 206
  criterion: Units and their CellExplorer cell types as in the opening comment; narrow and wide
    interneurons as CellExplorer names them. The code does not compute these totals. Which
    sessions they cover is open; readings are (a) the 96 sessions of the 15 homecage mice (the
    sessions whose 664 light-responsive cells make 8.96% of 7,411, Extended Data Figure 2a), (b)
    all sessions of the 17 mice. Reproduced when the three counts are within tolerance under one
    reading. Partially reproduced when the total is within tolerance and a type count is not.
  depends_on:
  - st1-animal-sessions
- id: ed2-light-responsive-count
  statement: 664 of 7,411 putative pyramidal neurons (8.96%) were light-responsive, that is,
    birthdated, leaving 6,747 nonresponsive.
  source: Extended Data Figure 2a and 2g legends
  quote: "Red: pyramidal neurons (n = 7,411). ... Blue crosses: light-responsive pyramidal neurons
    ( n = 664, 8.96%)."
  expected:
  - quantity: light-responsive pyramidal neurons
    value: 664
    tolerance: 66
  - quantity: fraction of pyramidal neurons light-responsive
    value: 0.0896
    tolerance: 0.009
  criterion: Light-responsive pyramidal cells as in the opening comment, readings (a) stored
    labels, (b) detection from the pulses, over the sessions of reading (a) of unit-count.
    Reproduced when both values are within tolerance under one reading. Not reproduced otherwise.
  depends_on:
  - unit-count
- id: ed2-waveform-validation
  statement: Light-evoked spikes most resemble the spontaneous spikes of their own cluster, and
    light-responsive and nonresponsive pyramidal cells have the same waveform trough-to-peak.
  source: Extended Data Figure 2f and 2i; Results, In vivo recordings from birthdated CA1
    pyramidal neurons, paragraph 1
  quote: Waveform shapes of light-responsive pyramidal neurons were no different from those of
    nonresponsive neurons ( Extended Data Fig. 2i ). Furthermore, light-evoked spikes were
    systematically most similar to spontaneous spikes of their assigned cluster
  statistics:
  - about: evoked against own spontaneous spikes (median 4.56) and against nearby neurons'
      spontaneous spikes (median 14.269), waveform profile distance
    test: two-sided Wilcoxon
    p: 1.06e-255
    n: 664 and 3,086
  - about: trough-to-peak, light-responsive (mean 0.696 ms) against nonresponsive (mean 0.7 ms)
    test: two-sided, two-sample t-test
    p: 0.134
    n: 664 and 6,747 neurons
  expected:
  - quantity: median waveform profile distance, evoked to own spontaneous
    value: 4.56
    tolerance: 0.456
  - quantity: median waveform profile distance, evoked to nearby neuron
    value: 14.269
    tolerance: 1.427
  criterion: Needs the raw waveforms around pulses. Extended Data Figure 2d-f define the distance
    as the L2 norm of the difference of channel-concatenated mean waveforms, evoked spikes within
    10 ms after light offset, 1,000 spontaneous spikes outside stimulation, nearby neurons those
    with their maximum on the same channel. The trough-to-peak comparison is a claim of absence,
    judged on the paper's two-sided t-test at 0.05. Reproduced when the distance test gives p <
    0.05 with own-cluster smaller, the medians are within tolerance, and the t-test gives p >=
    0.05. Partially reproduced when the two tests come out as the paper's and a median does not.
- id: ed1-brdu-specificity
  statement: BrdU given at the time of electroporation labels the largest fraction of tdTomato
    neurons and BrdU given 24 h later almost none, so populations electroporated 24 h apart have
    distinct birthdates.
  source: Extended Data Figure 1e; Methods, BrdU experiments
  quote: The largest overlap occurred when BrdU was given at the time of in utero electroporation,
    whereas minimal overlap was seen when BrdU was injected 24 h after.
  criterion: Histology (n = 3 animals per timepoint, > 300 tdTomato neurons), as the Methods give
    it; a neuron is BrdU positive when its ROI mean exceeds the image mean + 2 SD
    (brdu_analyze.m). Reproduced when the double-labelled fraction is highest at 0 h and lowest
    at 24 h. Not reproduced otherwise. No test is reported.
