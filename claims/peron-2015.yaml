# Claims for Peron, Freeman, Iyer, Guo & Svoboda (2015), "A Cellular Resolution Map of Barrel Cortex
# Activity during Tactile Behavior", Neuron 86:783-799, doi:10.1016/j.neuron.2015.03.027, tested on
# CRCNS ssc-1 (calcium imaging in vibrissal S1 of mice performing a pole localization task,
# doi:10.6080/K0TB14TN).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-09,
# protocol pilot-14 as stated in docs/protocol.md (Reader).
#
# Text read. The version of record with its Supplemental Information, as supplied under paper/
# (10.1016-j.neuron.2015.03.027.txt, PyMuPDF text of the journal PDF followed by the supplement):
# Summary, Results, Discussion, Experimental Procedures, figure legends, and the supplement (legends
# of Figures S1 to S7, Table S1, Supplemental Experimental Procedures). The PDF pages could not be
# rendered in this run (no renderer was available), so the numbers printed only inside the panels of
# Figures 3, 6 and 8 (the per-population percentages of Figure 3, the Pearson r and p of Figure 8E,
# 8I and 8K) were not read and no expected value rests on them. The figures were read from their
# legends and the Results sentences that cite them.
#
# Code. The paper links no analysis code. It names ScanImage (scanimage.org) for acquisition, the
# Janelia Whisker Tracker (Clack et al., 2012), BControl for the task, and "a custom, automated MATLAB
# package" for whisker identity, none of which settles an analysis choice. Every method below is from
# the Experimental Procedures, the Results, the figure legends or the Supplemental Experimental
# Procedures.
#
# Data the paper describes (Table S1, Experimental Procedures).
# (1) Volume imaging, 8 mice (an171923, an194181, an194672, an197522, an198503, an229716, an229717,
#     an229719): six Emx1-Cre x Rosa26-LSL-H2B-mCherry (red nuclei in excitatory neurons), one
#     Gad2-T2A-NLS-mCherry (an194181, red nuclei in GABAergic neurons), one C57BL/6 without a red
#     marker (an171923). Spared whiskers C2, D2, D2, D2, C3, C2, D3, D2 in that order (Table S1). Each
#     mouse has two volumes of eight subvolumes; a subvolume is three planes 15 um apart (600 x 600 um,
#     512 x 512 pixels) imaged at 7 Hz, each subvolume over 4.0 sessions on average (range 1 to 8),
#     data pooled across sessions. L1 to L3 over 360 um of depth. Core counts are 82,732 L2/3
#     excitatory neurons, 777 L1 neurons, 3,806 L2/3 GABAergic neurons and 2,469 L5 apical dendrites
#     imaged in deep L3 (Figure 3 prints n=2496 for L5).
# (2) Imaging during learning, 4 of these mice (an194181, an194672, an197522, an198503): one subvolume
#     of three planes 120 um apart tracked from the start of training, 7, 10, 13 and 17 sessions; 1,612,
#     1,913, 1,552 and 1,301 neurons imaged during learning (Table S1).
# (3) L4 axon imaging in L2/3, 3 Scnn1a-Tg3-Cre mice (an224823, an227254, an238004) with FLEX GCaMP6s;
#     six subvolumes, grid ROIs of 12 x 12 um on a 25 um grid (Figure S5).
# (4) Anesthetized against awake directionality imaging, 3 Emx1-Cre x LSL-H2B-mCherry mice (an257218,
#     an257219, an257221), passive piezo deflection under 0.5% isoflurane (Figure 8G to 8K).
# (5) Simultaneous imaging of L5A somata and deep L3 apical dendrites, 42 pairs from 3 mice (Figure S4);
#     the mice are not named.
# Behavior: trials with a 1 s sample epoch (pole in reach), 1 s delay, a 50 ms auditory reward cue and
# a response epoch; correct response right for proximal pole positions, left for the distal position;
# trial types hit and error, left and right, and no response. Whisker video at 500 Hz gives whisker
# angle (theta, positive for protraction) and curvature change (delta kappa, negative for touches
# during protraction, zero outside touch), and touch times verified by hand. The data set's
# description (CRCNS ssc-1 data description, version 0.8) speaks of the eight volume-imaging mice,
# with per-session and per-volume MATLAB structures holding ROI masks, raw fluorescence, dF/F,
# extracted calcium events, whisker angle, curvature, touch times, trial types, timing and outcomes,
# and raw images and whisker videos. Whether it holds the learning, L4 axon, anesthetized and L5-soma
# data, the high-resolution stacks and the column outlines is for the author to find.
#
# Shared method, from the Experimental Procedures, used by the criteria below unless a claim says
# otherwise.
# M1 Activity. All analyses use the event-based dF/F (events convolved with their rise and decay),
#    "unless noted" (Results, Imaging Large Neuronal Populations, paragraph 8; Calcium Imaging
#    Analysis, step 5). Where the data set holds the events or event-based trace, they are used as
#    given; the event detector is not rerun.
# M2 Active. Event rate > 0.0083 Hz (Figure 3A legend).
# M3 Task related. Per ROI and per correct trial type (left, right), the fraction of trials with an
#    event in each trial-aligned time bin; events shuffled in time 10,000 times; task related when the
#    real peak exceeds the 95th percentile of shuffled peaks for at least one trial type (Model-Free
#    Analysis, paragraph 1). Open: the bin width (readings are one imaging frame at 7 Hz, and the
#    frame rate of the subvolume as acquired, the same thing for volume data) and the shuffle scope
#    (readings are events shuffled within each trial, and across the whole session).
# M4 Trial-type discrimination. Per neuron, ROC on the decision variable "dot product of the trial's
#    PSTH with the mean respond-left PSTH minus that with the mean respond-right PSTH", PSTH from the
#    event trace without decay, activity up to the reward cue, correct and error trials, no-response
#    trials excluded, AUC above the 95th percentile of 100 label shuffles; pooled across all volumetric
#    sessions (Model-Free Analysis, paragraph 2; Results, Task-Related Activity, paragraph 4). Open:
#    whether the trial itself is left out of the mean PSTH (readings are included, and left out); the
#    time bin of the PSTH (one frame is the standard choice).
# M5 Encoding model. Per neuron, dF/F modelled as f1(theta)*k1 + f2(delta kappa)*k2 with Gaussian
#    noise; f1, f2 sums of 16 tent functions, applied at 500 Hz and linearly downsampled to 7 Hz; k1, k2
#    of 14 time points (2 s); fit by alternating least squares (3 to 5 iterations), nonlinearities
#    rescaled to 0..1 after each iteration; smoothness prior with inverse covariance the second
#    difference matrix (2 on the diagonal, -1 off it); 5-fold cross-validation across trials, Rfit the
#    Pearson r of held-out predicted and actual dF/F. A neuron encodes touch (whisking) when the model
#    fit with curvature (angle) alone has Rfit above the 95th percentile of 100 fits to time-shuffled
#    traces made by redistributing the neuron's events at random with their rise and decay; both
#    significant is "mixed". For volume data the fit uses all sessions pooled; for learning, single
#    sessions with the 99th percentile; for maps (Figures 7, 8D, S5), the 99th percentile (Model-Based
#    Encoding Analysis). Open, and able to change the counts: (a) the penalty scale, which the paper
#    chose "from a cross-validated inspection of a random subset of ROIs" without giving it; readings
#    are a single scale chosen by cross-validated Rfit over a log grid on a random subset of ROIs and
#    applied to all, and a scale chosen per neuron by cross-validation; (b) the tent knots, not placed
#    by the paper; readings are 16 knots equally spaced over the range of the variable, and at its
#    quantiles; (c) the kernel lags, readings are lags 0 to 13 frames after the input (causal) and
#    lags centred on 0; (d) which frames enter the fit, readings are all imaged frames of the trials,
#    and the trial frames only. Touch and whisking bouts are aligned at first touch and at the first
#    frame where the Hilbert amplitude of whisking exceeds 10 degrees (Supplemental Experimental
#    Procedures); used for display only.
# M6 Columns and layers. The principal column is the barrel column of the spared whisker, from
#    confocal sections, two-photon L4 images, intrinsic signal imaging and the neuropil touch signal
#    (Figure S1). Laminar borders as in Experimental Procedures (Two Photon Imaging, paragraph 4).
#    The author uses the column and layer labels the data set carries; if it carries none, the claims
#    that need them are blocked, as no rule here could redraw them.
# M7 Summaries. Percentages given "n = 8 mice" are read as the mean and spread over mice of per-mouse
#    fractions. Where the paper does not say, the spread is read as SD (the paper states "mean ± SD"
#    for the behavioral numbers, learning numbers and dendrite numbers); a reading as SEM is shown as
#    a variant. Pooled fractions over all mice (Figure 3, which prints pooled n) are a second reading.
#
# Discrepancies in the paper. L5 apical dendrites are 2,469 in the Results and n=2496 in Figure 3.
# The Experimental Procedures say "Four ... imaging planes were acquired at
# 7 Hz", the Results three planes per subvolume; the fourth is the fly-back frame, discarded.
# The Summary gives "300 layer (L) 2/3 pyramidal neurons (17%)" per column for each of touch and
# whisking; the Discussion gives 12% touch, 12% whisking and 5% both in the principal column.
