- id: fig8jk-neuropil-anesthetized
  statement: The neuropil remained direction selective under anesthesia, with forward deflection evoking
    responses in and near the column of the whisker anterior to the deflected one, as in anesthetized rats;
    this is the same spatial map as active protraction touch but with opposite lateral force.
  source: Results, Directional Tuning in vS1, paragraphs 5 and 7; Figures 8F, 8J and 8K
  quote: The neuropil signal was still direction selective under anesthesia (Figure 8J). Moreover, the
    topography of neuropil directionality under anesthesia was consistent with that observed in
    anesthetized rats (Kremer et al., 2011
  criterion: As fig8i-no-anesthetized-topography for neuropil ROIs, with DI defined so that forward
    preference is positive in the anterior direction of the row axis. Reproduced when the binned DI
    against row position has p < 0.05 with forward preference toward anterior columns, and the
    fraction of responsive neuropil ROIs with |DI| > 0.5 exceeds half.
  depends_on:
  - fig8h-passive-active-overlap
- id: figs3d-neuropil-correction
  statement: Without peri-somatic neuropil correction more neurons are classed as touch; the corrected
    fraction is consistent with electrophysiology.
  source: Figure S3D
  quote: Touch fraction among neurons without peri-somatic neuropil correction (above) and with correction
    (below). The bottom plot is consistent with electrophysiological results
  criterion: Neuropil correction F_ROI - 1.0 x F_neuropil (annulus 3 to 13 um from the ROI edge, excluding
    pixels with neighbour correlation above 0.2 and ROI pixels), clipped at baseline; F0 over a 3 min
    window at a skew-dependent percentile (Calcium Imaging Analysis, step 4). The skew to percentile map
    is not given; readings are the 5th percentile for all and the median for all. Touch fraction by M5
    on dF/F from uncorrected and corrected traces, with events re-extracted only if the data set does
    not hold uncorrected events. Reproduced when the uncorrected touch fraction exceeds the corrected
    one for L2/3 excitatory neurons pooled and in at least six mice. Blocked when the data set holds
    neither raw ROI and neuropil fluorescence nor uncorrected events.
- id: discussion-correlation-more-touch
  statement: A correlation-based classification of the same data classifies a larger proportion of neurons
    as touch than the encoding model.
  source: Discussion, paragraph 5
  quote: Applying a correlation-based approach to our data set classifies a larger proportion of neurons as
    touch
  criterion: The correlation-based approach is not specified. Readings are the Pearson r of each neuron's
    dF/F with the curvature change (absolute, downsampled to 7 Hz) above the 95th percentile of the same
    r on the event-shuffled traces of M5, and the r with a binary touch trace convolved with the
    neuron's events' decay. Reproduced when, under one reading, the correlation touch fraction of L2/3
    excitatory neurons exceeds the M5 touch fraction pooled and in at least six mice.
  depends_on:
  - fig3d-principal-touch-whisking-equal
- id: methods-event-detection
  statement: On simultaneous imaging and cell-attached data from mouse visual cortex, degraded to this
    study's dwell time and rate, the event detector found 54% ± 10% of single action potentials at a
    false positive rate of 0.01 Hz (n = 7 neurons).
  source: Experimental Procedures, Calcium Imaging Analysis, paragraph after step 5
  quote: For a false-positive detection rate of 0.01 Hz, 54% ± 10% of single action potentials (mean ±
    SD; n = 7 neurons) were detected
  data: elsewhere
  where: Simultaneous imaging and cell-attached data of Chen et al. (2013b), Nature 499:295-300, as the
    paper cites them; the paper names no archive or identifier
  expected:
    quantity: single action potentials detected at 0.01 Hz false positives
    value: 54
    tolerance: 10
    unit: percent
  criterion: The detector as Calcium Imaging Analysis step 5 (template bank of rise 3 to 5 frames, decay 7
    to 35 frames; candidates from large second derivatives; noise sigma from a Savitzky-Golay residual;
    accept when RMS difference < sigma and mean amplitude > sigma; peel and repeat). The degradation to
    the volume-imaging dwell time, the Savitzky-Golay window and the detection matching window are not
    given; this claim is outside the data set and is listed for completeness.
