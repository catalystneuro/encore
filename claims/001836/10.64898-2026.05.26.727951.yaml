# Claims for Gu, Liu, Gillespie, Nevers, Denovellis, Coulter, Kay & Frank (2026), "Naturalistic
# behavior and self-generated neural activity predictive of self-correction", on dandiset 001836.
#
# Provenance. Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-11-05, protocol pilot-13 as stated in docs/protocol.md. The reader had not seen the dataset's
# data; it read only the dandiset's title and description on the archive.
#
# Text read. The bioRxiv preprint, version 1 (posted May 27, 2026), main text and figure legends,
# with its supplement (media-4.pdf), which holds the Materials and Methods and the legends of Figures
# S1 to S12, from paper/10.64898-2026.05.26.727951.txt. The PDF was opened once, for page 4 (Figure 1),
# to read the table in the Figure 1E inset, which the text extraction scatters. Movies S1 to S3 and
# Table S1 were not read (not supplied); no claim rests on them.
#
# Code read. The paper links https://github.com/shijiegu/Gu2026_docker (read at commit 910c547), whose
# README points to the analysis package https://github.com/shijiegu/Gu2026 (read at commit 0f0c9a7,
# archived as Zenodo doi:10.5281/zenodo.20371883, the record the paper cites). The package holds the
# Spyglass-based pipeline functions (COM detection, triggered decodes, remote and local extended event
# detection, the GLM helpers and figure scripts). The notebooks that call them, with their printed
# outputs, are only inside the Docker image and were not read. Choices settled by the code and used
# below: (1) a COM is detected when the head passes a proportion of 0.1 of an outer arm's length
# (changeOfMind.py, changeOfMind_helper.findProportion), where the Methods say theta = 10 cm; arms are
# 96 cm, so the two differ by about 0.4 cm, and both readings are named where counts depend on it;
# (2) sessions with fewer than 20 completed trials are left out (behavior.determine_if_include_session);
# (3) the papers' "mixed logistic regression" and "mixed linear model" are fixed-effect statsmodels
# Logit or OLS fits with one indicator per rat, as the Methods describe, not random-effects models
# (figure4c.do_GLM_version2, Methods, Generalized linear models); (4) a trial's correctness is whether
# the outer well poke was rewarded (rewardNum == 2), and an initial choice is correct when it is the
# next arm of the sequence after the last rewarded arm (changeOfMind_triggered.parse_to_correct);
# (5) side transitions are same-side for arm pairs 1-2 and 3-4 and switch-side for the other pairs
# (behavior.return_neighbor_nonneighor); (6) a nearby control trial is drawn at random among trials
# t-3 to t+3 that are not COM trials (changeOfMind_byTransition.return_a_nearby_random_trial).
#
# Data the paper used. Five male Long-Evans rats, named M, E, J, K and L in the paper (molly, eliot,
# julio, klein and lewis in the code and file names). Each had a microdrive of 32 (rat E) or 64 (rats
# M, J, K, L) tetrodes aimed at dorsal CA1 bilaterally (some tetrodes of rat K putatively in CA3),
# with corpus callosum reference tetrodes. Recording at 30 kHz (spikes detected above 100 uV, LFP),
# head-mounted LED tracking from an overhead camera (23 Hz or 28 Hz, both stated), inertial sensors
# (gyroscope and accelerometer) on the headstages of rats M, J, K and L, and Statescript logs of well
# pokes and rewards. The task is a maze with a home arm and four outer arms (1 to 4); after a home
# poke the rat chooses an outer arm, rewarded only in a hidden 4-arm cyclic sequence (1-2-4-3-1 in 2
# rats and 3-4-2-1-3 in 3 rats per the Results; Figure S1E names Seq2, 1-2-4-3-1, for M, E and J and
# Seq2', the cycle 3-4-2-1-3, for K and L, while the Figure 1B legend gives 3-4-2-1-3 for rat E, so
# the per-rat sequence is to be read from the reward log). The analyses use 5 to 11 consecutive days
# per rat ending on the day of peak performance (Methods, Behavioral training; Figure 1C shows about
# 6, 9, 11, 8 and 6 days for M, E, J, K, L), several run sessions per day (about 80 trials each)
# flanked by sleep sessions. Measured variables: trial start (home poke) and end (outer poke) times,
# the outer well chosen and whether rewarded, 2D and linearized head position and speed, head
# direction, clusterless spike marks, LFP and theta phase, and the decoded position from a clusterless
# state-space decoder (2 ms bins, two states, continuous and fragmented, encoding from times with 2D
# head speed above 4 cm/s, per session). The decoder results are derived quantities; whether the
# dataset holds them or only the raw recordings is the author's to find.
#
# Details the paper leaves open, used in several claims (named in each criterion where they matter):
# the day of peak performance (read as the day with the highest percentage of transitions conforming
# to the correct sequence, Figure 1C); the per-rat sequence (above); the COM threshold (10 cm or 0.1 of
# arm length). The "mixed" models are fit by maximum likelihood with an intercept and one indicator per
# rat as the Methods say; as an intercept with all five indicators is collinear, the readings are (a)
# indicators for all rats without an intercept and (b) an intercept and indicators for four rats; the
# fold change of the predictor of interest is the same under both.
schema_version: 2
dataset:
  archive: dandi
  id: "001836"
paper: doi:10.64898/2026.05.26.727951
claims:
- id: fig1c-learning
  statement: All rats learned the spatial sequence task over a period of 5 to 19 days, the percentage
    of consecutive trials conforming to the correct sequence transitions rising over the days analysed.
  source: Results, Rat spatial sequence task and change-of-mind behavior, paragraph 4; Figure 1C
  quote: All rats learned the task over a period of 5-19 days (Figure 1B,C, Figure S1E)
  criterion: As in the Figure 1C legend and behavior.correctPairSessions, the measure per session is the
    fraction of transitions between adjacent trials (outer arm on trial t to outer arm on trial t+1)
    that are transitions of the rat's correct sequence, averaged over the day's sessions weighted by
    trial count, sessions with fewer than 20 trials left out. The paper gives no test. Reproduced when,
    for every rat, the value on the day of peak performance is above the value on the first analysed
    day and above 25% (chance for a random choice among four arms, the dashed line in Figure 1C), and a
    Spearman correlation of the daily value with day is positive; partially reproduced when this holds
    for three or four rats.
- id: fig1e-trial-counts
  statement: The dataset analysed holds 2370, 3554, 4628, 3779 and 2087 trials for rats M, E, J, K and
    L, of which 107, 225, 138, 315 and 309 are COM trials, hundreds of COM trials per subject.
  source: Figure 1E inset; Results, Rat spatial sequence task and change-of-mind behavior, paragraph 5
  quote: In total, we identified hundreds of COM trials per subject (Figure 1E inset
  expected:
  - quantity: trials, rat M
    value: 2370
    tolerance: 237
  - quantity: trials, rat E
    value: 3554
    tolerance: 355
  - quantity: trials, rat J
    value: 4628
    tolerance: 463
  - quantity: trials, rat K
    value: 3779
    tolerance: 378
  - quantity: trials, rat L
    value: 2087
    tolerance: 209
  - quantity: COM trials, rat M
    value: 107
    tolerance: 11
  - quantity: COM trials, rat E
    value: 225
    tolerance: 23
  - quantity: COM trials, rat J
    value: 138
    tolerance: 14
  - quantity: COM trials, rat K
    value: 315
    tolerance: 32
  - quantity: COM trials, rat L
    value: 309
    tolerance: 31
  criterion: Counts read from the Figure 1E inset table. A COM trial, per the Methods (Change-of-mind
    trial detection and Change of mind time detection), is a trial in which the head enters an outer
    arm other than the final one beyond the threshold and reverses (moving in the negative direction
    along the arm for more than 100 ms after binary closing of the 1D position). The code also counts
    the larger of the by-arm and by-time COM counts and requires at least 0.8 s of position data in the
    second before the reversal (behavior.get_com_num_animal, findProportion); followed here. Open,
    named readings for the threshold, (a) 10 cm into the arm, (b) 0.1 of the arm's length; and for the
    trials counted, (i) every trial of the analysed days, (ii) trials of sessions with at least 20
    trials. Reproduced when, under one reading, at least 8 of the 10 counts are within tolerance and
    every rat has at least 100 COM trials; partially reproduced for 5 to 7 counts.
- id: fig1d-initial-switch-bias
  statement: Early in learning every rat was biased to side-switching transitions, with a ratio of
    switch-side to same-side transition probabilities greater than 2 (the ratio for a random choice).
  source: Results, Rat spatial sequence task and change-of-mind behavior, paragraph 4; Figure 1D
  quote: Initially animals were biased strongly to switch-side transitions (Figure 1D; ratios were
    greater than 2 for all animals
  statistics:
  - test: binomial test
    p: 0.032
    p_relation: "<"
    n: 5 rats
  criterion: Per rat and day, P(switch-side)/P(same-side) from the outer-arm transitions between
    adjacent trials (behavior.find_behavior_transitions, return_neighbor_nonneighor; arms 1-2 and 3-4
    are same-side), sessions weighted by trial count. "Initially" is open; readings (a) the first
    analysed day, (b) the mean of the first two analysed days. Reproduced when, under one reading, the
    ratio exceeds 2 in all five rats (a one-sided binomial test of 5 of 5 against 0.5 gives p = 0.031).
- id: fig1d-switch-bias-declines
  statement: As learning progressed the switch-side to same-side ratio fell to about 1.5, with each
    day in the maze multiplying the bias by an estimated 0.92.
  source: Results, Rat spatial sequence task and change-of-mind behavior, paragraph 4; Figure 1D
  quote: As learning progressed, this ratio decreased to ~1.5 (mixed generalized logistic effect, mean
    multiplicative estimate of number of days spent in the maze in reducing bias is 0.92, p < 1e-4)
  statistics:
  - test: mixed generalized logistic model, effect of days
    p: 1.0e-4
    p_relation: "<"
    n: 5 rats
  expected:
  - quantity: multiplicative effect of one day on the odds of a switch-side transition
    value: 0.92
    tolerance: 0.092
  - quantity: P(switch-side)/P(same-side) at the end of learning
    value: 1.5
    tolerance: 0.15
  criterion: The model is not described in the Methods. Following the paper's other GLMs (Methods,
    Generalized linear models), a logistic regression over transitions between adjacent trials, the
    response 1 for switch-side and 0 for same-side, on the day index with one indicator per rat, the
    coefficient exponentiated. Readings for the day index, (a) days from peak performance, (b) days
    from the first analysed day (the same slope); for the unit, (i) single transitions, (ii) daily
    counts as binomial responses (the same fit). The final ratio is read as (a) the mean over rats of
    the ratio on the day of peak performance, (b) the ratio pooled over all rats' transitions on that
    day. Reproduced when the day effect is below 1 with p < 1e-4 and within tolerance, and one reading
    of the final ratio is within tolerance; partially reproduced when the effect is below 1 with p <
    0.05 but a value is outside tolerance.
- id: figs1f-multiple-com
  statement: In most COM trials the rats changed their minds once (entering two choice arms), but
    trials with several COM events (more than two arms entered) occurred in every rat.
  source: Results, Rat spatial sequence task and change-of-mind behavior, paragraph 5; Figure S1F
  quote: In most COM trials, rats changed their minds once (entered 2 choice arms), though trials with
    multiple COM events (>2 arms entered in a trial) were also seen in all rats
  depends_on:
  - fig1e-trial-counts
  criterion: COM trials as in fig1e-trial-counts; the number of COM events per trial is the code's
    larger of the by-arm and by-time counts. Reproduced when in every rat more than half of COM trials
    have one COM event and at least one trial has two or more.
- id: fig1g-com-corrective
  statement: COM trials were corrective; the final choice of a COM trial was rewarded more often than
    the initial choice would have been, in each rat.
  source: Results, Rat spatial sequence task and change-of-mind behavior, paragraph 6; Figure 1G
  quote: the final decision in COM trials resulted in higher reward rates than would have been the
    case had the animal continued with their initial choice
  statistics:
  - about: rats M, J, K and L
    test: rank-sum test, per rat
    p: 0.01
    p_relation: "<"
  - about: rat E
    test: rank-sum test, per rat
    p: 0.05
    p_relation: "<"
  depends_on:
  - fig1e-trial-counts
  criterion: Per the Figure 1G legend, the daily probability that the initial choice would have been
    rewarded (it would have been when the initial arm is the next arm of the sequence after the last
    rewarded arm) and the
    daily probability that the final choice was rewarded, over COM trials; one value per day. Per rat a
    two-sided Wilcoxon rank-sum test of the final against the initial daily values. Reproduced when
    the final values are higher and p < 0.05 in all five rats; partially reproduced for three or four.
- id: fig1g-com-matches-run-through
  statement: After correction, the reward rate on COM trials did not differ from that of temporally
    nearby run-through trials.
  source: Results, Rat spatial sequence task and change-of-mind behavior, paragraph 6; Figure 1G
  quote: These corrections brought the average performance on COM trials up to the level seen on
    run-through trials
  depends_on:
  - fig1e-trial-counts
  criterion: A claim of absence. Daily reward probability of the final choice on COM trials against
    that of nearby run-through trials (for each COM trial one trial drawn at random from t-3 to t+3
    that is not a COM trial, Methods, Identification of nearby trials), one value per day. The paper
    names no test for this comparison; the test of the same panel, a two-sided Wilcoxon rank-sum test
    per rat at p < 0.05, is used. As the random draw can change the result and the paper does not say
    how it was handled, the test is repeated over 100 draws and judged on each rat's median p-value
    over the draws, a choice the paper does not make; the share of draws with p < 0.05 is shown.
    Reproduced when no rat shows a significant difference; not reproduced when any does. The
    difference of medians is reported per rat either way.
- id: fig1h-final-choice-less-switching
  statement: The initial choice on COM trials was heavily biased to side-switching, while the final
    choice was much less so, with a switch-side to same-side ratio close to 1.
  source: Results, Rat spatial sequence task and change-of-mind behavior, paragraph 7; Figure 1H
  quote: The initial choice on COM trials was heavily biased to be a side-switch, while the final
    choice was much less likely to be a side-switch with a ratio of switching to same-side transitions
    close to 1
  statistics:
  - about: initial against final ratio, all rats except M
    test: paired t-test
    p: 0.01
    p_relation: "<"
  - about: initial ratio against 2, rats J and K
    test: sign test
    p: 0.01
    p_relation: "<"
  - about: initial ratio against 2, rats E and L
    test: sign test
    p: 0.05
    p_relation: "<"
  - about: final ratio against 2, rats J, K, E and L
    test: sign test
    p: 0.05
    p_relation: "<"
  depends_on:
  - fig1e-trial-counts
  criterion: As in changeOfMind_byTransition.info2matrix, per COM trial the transition from the
    previous trial's outer arm to the initial COM arm and to the final arm (first COM only, first
    trial of a session skipped), counted per day, and the daily ratio P(switch-side)/P(same-side) for
    initial and final choices. Per rat a two-sided paired t-test over days of initial against final
    ratio, and two-sided sign tests of the daily ratios against 2. Reproduced when the initial ratio
    exceeds the final with p < 0.01 in at least four rats, the initial ratio is above 2 by the sign
    test (p < 0.05) in at least four rats and the final ratio below 2 (p < 0.05) in at least four
    rats, as the legend reports for rats E, J, K and L; partially reproduced when the paired t-test holds in at least three rats. Days with no
    same-side transition give an undefined ratio and are dropped, a detail the paper does not settle.
- id: fig1h-final-ratio-near-one
  statement: The final choice of COM trials did not differ from a switch-side to same-side ratio of 1
    in any rat.
  source: Figure 1H legend
  quote: between final ratio and 1 yield insignificant difference in all rats
  depends_on:
  - fig1h-final-choice-less-switching
  criterion: A claim of absence, judged on the paper's test, a two-sided sign test per rat of the
