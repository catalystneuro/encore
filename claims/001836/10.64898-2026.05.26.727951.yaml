- id: fig3b-extended-before-stopping
  statement: Before stopping, COM trials showed more extended hippocampal representations within the
    arm than outbound run-through trials over matched arm regions.
  source: Results, Hippocampal representations of alternatives are only expressed after stopping,
    paragraph 4; Figure 3B
  quote: We found that there were more extended representations preceding stopping on COM trials than
    run-through trials (Figure 3B, ranksum test, p < 0.01 for all rats)
  statistics:
  - test: rank-sum test, per rat
    p: 0.01
    p_relation: "<"
    n: 5 rats
  depends_on:
  - fig1e-trial-counts
  criterion: Per the Figure 3B legend and Methods (Change of mind triggered decoded location), per trial
    the maximum absolute difference between the decoded MAP position and the head position within the
    COM arm, at head speed of at least 4 cm/s, from the causal posterior of the state-space decoder; for
    each COM trial one nearby run-through outbound trial, its distance taken only over an arm range
    drawn at random from the ranges the COM trials covered (figure4c.return_distance_day). Moments
    with less than 0.2 of the posterior in the COM arm are left out only in the Figure 3A plots; the
    readings are (a) all moments, (b) moments with at least 0.2 posterior in the arm. The pre-stopping
    window is not stated; readings (i) from arm entry to the stopping time, (ii) the 5 s before stopping
    (the code's control parameter is named "5seconds"). Per rat a rank-sum test, COM greater.
    Reproduced when, under one reading, p < 0.01 with COM greater in all five rats; partially
    reproduced for three or four.
