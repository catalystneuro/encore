    test: one-way Friedman test with Dunn's correction
    p: 0.009
  - about: stim 3
    test: one-way Friedman test with Dunn's correction
    p: 0.008
  - about: stim 4
    test: one-way Friedman test with Dunn's correction
    p: 0.001
  - about: stim 5
    test: one-way Friedman test with Dunn's correction
    p: 0.04
  data: elsewhere
  where: figshare doi:10.6084/m9.figshare.12613811.v1 (In vitro recordings_oxytocin)
  criterion: Spike probability per pulse, baseline against 15-30 min after wash onset. Reproduced
    when stimuli 2 to 5 increase at p < 0.05 by Friedman test with Dunn's post hoc, stimulus 1 does
    not, and ACSF controls (n=7) show no change at p < 0.05.

- id: fig4e-ot-inhibition-deficits
  statement: Inhibiting oxytocin neurons during slow morph playback lowers retrieval of warm pups
    (43.8% against 92.3%), prototype-dubbed pups (36.8% against 83.3%) and slow-morph-dubbed pups
    (33.3% against 83.3%), and changes retrieval latencies.
  source: Figure 4e; Extended Data Fig. 9d
  quote: "we observed deficits in retrieval rates for warm pups (CH+575 sham : 92.3% vs. CH+575 opto-OT : 43.8% of trials), as well as cold pups dubbed over with prototypes (83.3% vs. 36.8%) and slow morphs (83.3% vs. 33.3%"
  statistics:
  - about: warm
    test: two-tailed Fisher's test
    p: 0.008
    n: sham 3 mice 12-13 trials, opto-OT 5 mice 16-19 trials
  - about: prototypes
    test: two-tailed Fisher's test
    p: 0.02
  - about: slow
    test: two-tailed Fisher's test
    p: 0.01
  - about: latencies
    test: unpaired two-tailed Mann-Whitney test
    p: 0.0003
    n: 32 and 20 trials
  expected:
  - quantity: warm, sham
    value: 92.3
    tolerance: 9.2
    unit: "% of trials"
  - quantity: warm, opto-OT
    value: 43.8
    tolerance: 4.4
    unit: "% of trials"
  - quantity: prototypes, sham
    value: 83.3
    tolerance: 8.3
    unit: "% of trials"
  - quantity: prototypes, opto-OT
    value: 36.8
    tolerance: 3.7
    unit: "% of trials"
  - quantity: slow, sham
    value: 83.3
    tolerance: 8.3
    unit: "% of trials"
  - quantity: slow, opto-OT
    value: 33.3
    tolerance: 3.3
    unit: "% of trials"
  criterion: Reproduced when all six rates are within tolerance, each pair differs at p < 0.05 by
    two-tailed Fisher's exact test, and latencies on successful trials differ at p < 0.05 by
    unpaired two-tailed Mann-Whitney test. The text does not give the direction of the latency
    change; it is reported.

- id: fig4g-ot-inhibition-narrow-tuning
  statement: Virgins with oxytocin neurons inhibited during cohousing have uncharacteristically
    narrow tuning 24 hours after first retrieval, narrower than cohoused virgins' excitatory and
    inhibitory tuning.
  source: Figure 4f,g; Extended Data Fig. 9e
  quote: "These behavioral deficits were associated with uncharacteristically narrow temporal tuning in auditory cortex 24 hours after first retrieval"
  statistics:
  - about: opto-OT against CH excitatory
    test: Kruskal-Wallis test with Dunn's correction
    p: 0.008
    n: 4 opto-OT and 14 CH mice
  - about: opto-OT against CH inhibitory
    test: Kruskal-Wallis test with Dunn's correction
    p: 0.03
    n: 4 opto-OT and 10 CH mice
  criterion: Per-mouse tuning widths (reading (vi)); CH is all retrieving virgins imaged (Methods),
    excitatory N=14 and inhibitory N=10. Reproduced when opto-OT is lower than both at p < 0.05 by
    Kruskal-Wallis with Dunn's post hoc. Which mice make up the 14 and 10 is not listed; the
    counts reached are reported.

- id: fig4h-ot-like-unreliable-retrievers
  statement: Single-cell tuning in opto-OT virgins is narrower than in reliably retrieving virgins
    but similar to virgins retrieving on 10-30% of trials.
  source: Figure 4h; main text, paragraph citing Fig. 4h
  quote: "Single-cell tuning curves in CH+575 opto-OT virgins were significantly narrower compared to reliably retrieving virgins"
  statistics:
  - about: against CH 100%
    test: Kruskal-Wallis test with Dunn's correction
    p: 0.0001
    p_relation: "<"
    n: 40 opto-OT and 52 CH 100% curves
  - about: against CH 10-30%
    test: Kruskal-Wallis test with Dunn's correction
    p: 0.99
    p_relation: ">"
    n: 40 opto-OT and 78 CH 10-30% curves
  criterion: Single-cell widths of opto-OT (N=4, n=40) and the two virgins of Extended Data Fig. 4g
    before (n=78) and after (n=52) reliable retrieval. Reproduced when opto-OT is lower than CH 100%
    at p < 0.05 and does not differ from CH 10-30%, by Kruskal-Wallis with Dunn's post hoc.
  depends_on:
  - ed4g-broadening-with-reliable-retrieval

- id: ed3bc-neuropil-no-effect
  statement: Neuropil correction has no significant effect on prototype-evoked dF/F in excitatory or
    inhibitory neurons.
  source: Extended Data Fig. 3a-c; Methods, Image processing and analysis
  quote: "Neuropil correction had no significant effect on call-evoked ΔF/Fs in excitatory or inhibitory neurons"
  statistics:
  - about: excitatory
    test: two-tailed unpaired Kolmogorov-Smirnov test
    p: 0.57
    n: 52 neurons, one region
  - about: inhibitory
    test: two-tailed unpaired Kolmogorov-Smirnov test
    p: 0.14
    n: 64 neurons, one region
  criterion: A claim of absence. F_true = F_raw - r F_neuropil, r = F_blood_vessel / F_neuropil, on
    one excitatory and one inhibitory region; which regions is not said, so every region is run and
    the claim judged on the regions with 52 and 64 responsive neurons if they can be identified, and
    on all otherwise. Reproduced when the two-sample KS test of corrected against uncorrected
    prototype dF/F gives p >= 0.05 in both.

