# Claims for Schiavo, Valtcheva, Bair-Marshall, Song, Martin & Froemke (2020), Nature 587, 426-431,
# on dandiset 000249.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23, protocol
# pilot-10 as stated in docs/protocol.md.
#
# Text read: the NIH author manuscript in PubMed Central (PMC7677212, NIHMS1609780), as served by
# ncbi_pmc: main text, Methods, the ten Extended Data figure legends and the four main figure legends.
# It is the accepted manuscript, not the version of record, and its title reads "Innate and plastic
# mechanisms in auditory cortex for maternal behavior". The paper has no separate supplement beyond
# Extended Data; the source data Excel sheet it mentions was not available and no claim relies on it.
# No PDF was read.
#
# Code. The paper's data and code statements point to figshare doi:10.35092/yhjc.c.5037737, which
# did not resolve on 2026-10-23 (doi.org, DataCite and the figshare API all return not found). The
# dandiset links figshare collection doi:10.6084/m9.figshare.c.5043830.v6, same title as the
# manuscript. Its only code item is "Behavior code" (doi:10.6084/m9.figshare.13054076.v1), read in
# full; it holds MATLAB scripts (KAMB_OperantTask_prototypes.m, _fast.m, _slows.m, a circuit loader
# and a date helper) and RPvdsEx circuits that run the operant task. They run 30 min sessions (1800 s)
# and append to a csv the time of every polling sample at which the touch sensor reads a touch; they
# hold no analysis. No analysis code for imaging, whole-cell or behaviour was found, so every method
# detail below comes from the Methods and legends, and what they leave open is named in the criteria.
# The same collection holds per-mouse imaging items (titled e.g. EV27_Experienced_Exc,
# NV33_Naive_Inh, EV123_Experienced-Right ACtx_Exc, OXTHALO-19_Naive_Synapsin, M001_Dam_Exc), the
# in vivo and in vitro whole-cell recordings, and the operant touch-time files; only titles and
# descriptions were read, not data.
#
# The dandiset (title as the paper; 777 NWB files, 54 subjects, two-photon microscopy, variables
# TwoPhotonSeries, ImagingPlane, OpticalChannel) holds the two-photon calcium imaging. The behavioural
# assays, whole-cell recordings, in vitro slices and vocalization recordings are not described by it.
#
# Data the paper used, as it reports them.
# - Subjects. C57BL/6 virgin females 6-48 weeks old; naive virgins (NV, no retrieval at baseline);
#   experienced virgins (EV, cohoused with a dam and litter at least 72 h); lactating dams; Gad2-IRES-Cre
#   mice for interneurons; Oxt-IRES-Cre and Oxt-IRES-Cre x Ai39 mice for oxytocin neuron inhibition.
# - Stimuli. 6-9 prototypical pup calls (4-5 syllables, ISI 175 +/- 25 ms, about 1 s long) and for
#   each seven temporal morphs with ISI bin centres 75, 125, 225, 275, 375, 575 and 975 ms; pure tones
#   (4-64 kHz, 500 ms, 70 dB SPL, 0.2 Hz) and tone-pip sequences at the best frequency with ISIs 75,
#   175, 375 and 575 ms. Calls played in pseudorandom order at 0.1 Hz; morphs played only for the
#   prototypes that evoked responses.
# - Imaging. Awake head-fixed mice, layer 2/3 of left auditory cortex (right in Extended Data Fig.
#   4a-c), GCaMP6f in excitatory neurons (AAV9.CamKII) or interneurons (mDLX, or Flex in Gad2-Cre),
#   pan-neuronal (Syn.Flex) in the oxytocin-inhibition mice; 256x256 pixels at 4 Hz (0.26 s per
#   frame), one example at 16 Hz. Groups and counts: EV excitatory N=9 mice, NV excitatory N=12,
#   EV interneurons N=5, NV interneurons N=6, EV right cortex N=4, one dam; chronic imaging through
#   cohousing (N=13 virgins, retrieval tested every 12 h, imaged at least every 24 h, always at first
#   retrieval and 24 h after); non-cohoused controls (3 sessions); CH+575 virgins (N=6); CH+575
#   opto-OT virgins (N=4).
# - Behaviour. Cold pup retrieval assay with dubbed calls (trials, % retrieved, latency), y-maze,
#   operant lever task (N=7 per group, 8 sessions). Whole-cell in vivo (EPSC, IPSC per cell and ISI)
#   and in vitro (short-term depression; oxytocin spike probability).
#
# Imaging method from the Methods, used by every imaging claim below ("the imaging method").
# ROIs drawn by hand on the average image after TurboReg x-y registration (Fiji). A cell responds to a
# prototype when the integral of fluorescence in the stimulus epoch (from 250 ms after call onset,
# 1 s long) is significantly above baseline (F0, the 1 s before onset) by a paired one-tailed
# Student's t-test across trials at p < 0.05 and is at least 1.5 standard deviations above baseline.
# dF/F (%) is the mean of (Ft - F0)/F0 x 100 over the epoch; for morphs the epoch gains or loses a
# frame for each 500 ms added to or taken from the call, and the window is shifted to the signal's
# peak cell by cell. Each responsive cell and prototype gives one tuning curve. Normalized dF/F for a
# morph is 1 - |(P - M)/(P + M)|, P and M the prototype- and morph-evoked dF/F. Tuning width is the
# mean normalized dF/F over the behaviourally salient ISIs 75:375 ms. Slope at the transition is the
# slope of the line between 375 and 975 ms.
# Open in the imaging method, with the readings the text allows.
# (i) ROIs. The paper's ROIs were drawn by hand. If the dataset holds them they are used; if not,
#     any segmentation is not the paper's and is recorded as a deviation.
# (ii) The 1.5 SD rule. (a) The trial-averaged epoch mean exceeds the baseline mean by 1.5 SD of the
#     baseline frames pooled over trials; (b) by 1.5 SD of the trial-wise baseline means.
# (iii) The peak shift. (a) One shift per cell, from the peak of the mean prototype response, applied
#     to all its stimuli; (b) a shift per stimulus from that stimulus's own mean response peak. The
#     maximal shift is not given; a shift that keeps the epoch inside the inter-call interval is used.
# (iv) Tuning width. Whether the prototype (normalized value 1 by definition) is in the average is not
#     said; including it is an affine change of every width and changes no test, so it is left out,
#     a standard choice.
# (v) Slope. (a) The two-point slope (y975 - y375)/600 per ms; (b) the least-squares slope over the
#     points 375, 575 and 975 ms.
# (vi) Population tuning of a mouse. (a) The mean over that mouse's single-cell normalized curves;
#     (b) normalized from the mouse's mean raw dF/F curve (Extended Data Fig. 3g,h shows raw population
#     tuning "summarized in Fig. 1f").
# (vii) Normalized dF/F when P + M is near zero or of mixed sign is not addressed; values are used as
#     computed, and the count of curves with P + M <= 0 is reported.
# Readings (ii), (iii), (v) and (vi) are method details. Unless a claim says otherwise, its outcome is
# the one every combination of them gives, and it is blocked as methods_underspecified when they
# disagree, with every result shown.
schema_version: 2
dataset:
  archive: dandi
  id: "000249"
paper: doi:10.1038/s41586-020-2807-6
claims:
- id: subject-group-link
  kind: link
  statement: The dandiset's subjects can be assigned to the paper's imaging groups (experienced or
    naive virgin, dam, right cortex, cohousing, CH+575, opto-OT; excitatory, inhibitory or
    pan-neuronal indicator), with stimulus identity (prototype or morph ISI) for each presentation.
  source: Methods, Data availability statement; Methods, In vivo two-photon calcium imaging
  quote: "The data that support the findings of this study are further available at figshare"
  data: with_labels
  criterion: Reproduced when every subject carries a group and indicator, from the dataset's own
