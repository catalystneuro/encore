    with the same mouse ID, and every imaging presentation can be assigned its call and ISI bin.
    The counts per group are compared with the paper's (EV excitatory N=9, NV excitatory N=12, EV
    interneurons N=5, NV interneurons N=6, EV right cortex N=4, dam N=1, CH+575 N=6, CH+575 opto-OT
    N=4, chronic cohousing N=13). Partially reproduced when groups can be assigned but stimulus
    identity cannot, or counts differ for some groups; not reproduced when groups cannot be assigned.

- id: fig1a-isi-distribution
  statement: Pup distress call ISIs (5,355 intervals from 37 recordings of pups at postnatal days
    1-8) follow a lognormal distribution; calls with ISIs around the median (175 +/- 25 ms) serve as
    prototypes, and ISIs of 575 ms or more essentially never occur.
  source: Figure 1a; Methods, Stimulus library and vocalization analysis
  quote: "5,355 inter-syllable intervals were measured from 37 audio recordings ... and a lognormal frequency distribution was generated"
  expected:
  - quantity: number of ISIs measured
    value: 5355
    tolerance: 0
  - quantity: number of audio recordings
    value: 37
    tolerance: 0
  criterion: From the vocalization recordings, the ISIs measured and binned at +/-25 ms. Reproduced
    when the counts match, a lognormal fits (the median lies in the 150-200 ms bin), and fewer than
    1% of ISIs are 550 ms or longer. The 1% bound is not in the paper; it reads "essentially never".

- id: fig1c-warm-vs-cold
  statement: Experienced females (dams and experienced virgins pooled) retrieve cold, silent pups on
    fewer trials than warm, vocalizing pups (32.0% against 80.0%).
  source: Figure 1c; main text, paragraph citing Fig. 1c
  quote: "Experienced females retrieved cold, silent pups on fewer trials than warm, vocalizing pups (retrieval (cold) : 32.0% of trials, retrieval (warm) : 80.0%"
  statistics:
  - about: warm against cold, single syllable and 575 ms
    test: two-tailed Fisher's test, FDR correction
    p: 0.0003
    corrected: FDR (Benjamini-Hochberg)
    n: warm 55 trials, cold 25, single 20, 575 ms 22
  expected:
  - quantity: retrieval, cold pups
    value: 32.0
    tolerance: 3.2
    unit: "% of trials"
  - quantity: retrieval, warm pups
    value: 80.0
    tolerance: 8.0
    unit: "% of trials"
  criterion: Reproduced when both rates are within tolerance and warm against cold is significant by
    two-tailed Fisher's exact test with Benjamini-Hochberg correction at p < 0.05. The family of
    comparisons is not stated (Methods, Statistics, say only that FDR was corrected in Fisher's
    tests with multiple comparisons). The readings are (a) every condition tested (cold, prototypes,
    each morph tested, single syllables) against warm, (b) the three comparisons the legend reports
    (cold, single, 575 against warm). The outcome is the one both give; blocked as
    methods_underspecified when they disagree. Uncorrected p-values are shown as a variant.

- id: fig1c-salient-isis-retrieved
  statement: Cold pups dubbed over with prototypes (76.7%) or with morphs of ISIs 75 to 375 ms
    (73.7-81.0%) are retrieved at rates similar to warm pups.
  source: Figure 1c; main text, paragraph citing Fig. 1c
  quote: "Cold pups dubbed over with prototypes (76.7%), as well as morphs with ISIs between 75:375 ms (73.7–81.0%), were retrieved at similar rates to warm pups"
  expected:
  - quantity: retrieval, prototypes
    value: 76.7
    tolerance: 7.7
    unit: "% of trials"
  - quantity: retrieval range over morphs 75 to 375 ms, low bound
    value: 73.7
    tolerance: 7.4
    unit: "% of trials"
  - quantity: retrieval range over morphs 75 to 375 ms, high bound
    value: 81.0
    tolerance: 8.1
    unit: "% of trials"
  criterion: A claim of absence. Each of prototypes and morphs 75, 125, 225, 275, 375 ms against warm
    by two-tailed Fisher's exact test with Benjamini-Hochberg correction over reading (a) of the
    family in fig1c-warm-vs-cold (reading (b) does not hold these comparisons). Reproduced when none differs at p < 0.05 and the rates lie within the range
    widened by 10% of each bound; the differences from warm are reported.
  depends_on:
  - fig1c-warm-vs-cold

- id: fig1c-slow-and-single-not-retrieved
  statement: ISIs slower than 575 ms (27.3%) and single syllables (15.0%) do not effectively elicit
    retrieval, being retrieved less than warm pups.
  source: Figure 1c; main text, paragraph citing Fig. 1c
  quote: "In contrast, ISIs slower than 575 ms (27.3%) and single syllables (15.0%) did not effectively elicit retrieval"
  statistics:
  - about: warm against cold, single syllable and 575 ms
    test: two-tailed Fisher's test, FDR correction
    p: 0.0003
    corrected: FDR (Benjamini-Hochberg)
    n: warm 55 trials, single 20, 575 ms 22
  expected:
  - quantity: retrieval, 575 ms morphs
    value: 27.3
    tolerance: 2.7
    unit: "% of trials"
  - quantity: retrieval, single syllables
    value: 15.0
    tolerance: 1.5
    unit: "% of trials"
  criterion: Reproduced when both rates are within tolerance and each is below warm by two-tailed
    Fisher's exact test with Benjamini-Hochberg correction (both family readings of
    fig1c-warm-vs-cold, with the same rule) at p < 0.05. The 975 ms morph is reported but not required, since the text names 575 ms.
  depends_on:
  - fig1c-warm-vs-cold

- id: ed2a-dams-evs-similar
  statement: Dams and experienced virgins do not differ in retrieval of warm pups, prototype-dubbed
    pups or cold pups.
  source: Extended Data Fig. 2a
  quote: "Dams and EVs did not differ in their retrieval behavior"
  statistics:
  - about: warm, dams 85.2% (27 trials) against EVs 77.0% (26)
    test: two-tailed Fisher's test
    p: 0.50
  - about: prototypes, dams 91.7% (12) against EVs 66.7% (18)
    test: two-tailed Fisher's test
    p: 0.19
  - about: cold, dams 25.0% (12) against EVs 38.5% (13)
    test: two-tailed Fisher's test
    p: 0.67
  criterion: A claim of absence. Two-tailed Fisher's exact test, dams against EVs, for each of warm,
    prototype and cold. Reproduced when none has p < 0.05; the rates are reported.

- id: ed2b-latency-slow-longer
  statement: On successful trials, latencies to retrieve cold pups and pups dubbed with slow stimuli
    (single syllables and 575 ms) are longer than for warm pups and for pups dubbed with 75 to 375 ms
    ISIs.
  source: Extended Data Fig. 2b
  quote: "Latencies to retrieve cold pups and cold pups dubbed over with slow morphs (single syllables (‘SS’) and 575 ms ISIs) were longer than for warm pups (p=0.02) or cold pups dubbed over with morphs containing ISIs between 75:375 ms (p=0.001)"
  statistics:
  - about: slow and cold against warm
    test: Kruskal-Wallis H-test with Dunn's correction
    p: 0.02
  - about: slow and cold against 75:375 ms morphs
    test: Kruskal-Wallis H-test with Dunn's correction
    p: 0.001
  criterion: Latencies of successful trials in three bins (warm; morphs 75 to 375 ms; cold, single
    syllable and 575 ms). Whether prototypes are in the 75 to 375 ms bin is not said; the readings
    are with and without prototypes. Reproduced when, under one reading, the Kruskal-Wallis test
    with Dunn's post hoc shows the slow bin longer than both others at p < 0.05.

- id: ed2d-ymaze-approach
  statement: In a y-maze, experienced females show no preference between a prototype and a morph
    with ISIs 25 to 350 ms, but approach prototypes more than morphs slower than 350 ms (425 ms 25.0%,
    575+ ms 15.8% of trials approaching the morph).
  source: Extended Data Fig. 2d; main text, paragraph citing Extended Data Fig. 2c,d
  quote: "Mice showed a significant preference to approach prototypes when ISIs were slower than 350 ms"
  statistics:
  - about: 62.5 ms bin, 44.2%, 52 trials
    test: two-tailed binomial test against 0.50
    p: 0.49
  - about: 275 ms bin, 55.6%, 45 trials
    test: two-tailed binomial test against 0.50
    p: 0.46
  - about: 425 ms bin, 25.0%, 20 trials
    test: two-tailed binomial test against 0.50
    p: 0.04
  - about: 575+ ms bin, 15.8%, 19 trials
    test: two-tailed binomial test against 0.50
    p: 0.005
  expected:
  - quantity: morph approach, 425 ms bin
    value: 25.0
    tolerance: 2.5
    unit: "% of trials"
  - quantity: morph approach, 575+ ms bin
    value: 15.8
    tolerance: 1.6
    unit: "% of trials"
  criterion: First room entry per trial, bins of +/-75 ms except 575+. Reproduced when the 425 and
    575+ bins differ from 0.5 by two-tailed binomial test at p < 0.05 with values in tolerance, and
    the 62.5 and 275 ms bins do not.

- id: ed3e-prototype-responsive-fraction
  statement: About 16% of excitatory neurons in left auditory cortex respond to prototypes,
    regardless of maternal experience.
  source: Extended Data Fig. 3e; main text, paragraph citing it
  quote: "We observed robust responses to prototypes in ~16% of excitatory neurons regardless of maternal experience"
  statistics:
  - test: two-tailed unpaired t-test
    p: 0.74
    n: 9 experienced and 12 naive virgins
  expected:
    quantity: prototype-responsive excitatory neurons
    value: 16
    tolerance: 1.6
    unit: "% of neurons"
  criterion: Per mouse, the responsive ROIs (the imaging method, responsive to any of the 6-9
    prototypes) over all ROIs. Whether ~16% is the mean over mice or over neurons pooled is not
