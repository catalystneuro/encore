  where: figshare doi:10.6084/m9.figshare.12611522.v1 (ACtx slice recordings - Repeated stimulation),
    in collection doi:10.6084/m9.figshare.c.5043830.v6; the paper's own figshare DOI did not resolve
  criterion: Peak PSCs normalized to the first (Sn/S1) per cell; 75 ms n=10 cells, 175 ms n=14,
