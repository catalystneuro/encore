    tolerance and the per-mouse percentages of EV and NV do not differ by two-tailed unpaired t-test
    at p < 0.05.

- id: fig1f-ev-broader-than-nv
  statement: Excitatory neuronal tuning to temporal morphs is broader in experienced than in naive
    virgins across the ISIs that elicit retrieval; naive cortex responds less to morphs than to
    prototypes.
  source: Figure 1f; main text, paragraph citing Fig. 1e,f
  quote: "Compared to naive virgins, temporal tuning was broader in experienced virgins across ISIs that reliably elicited pup retrieval"
  statistics:
  - about: EV against NV at 375 ms
    test: one-way ANOVA, Bonferroni correction
    p: 0.050
    corrected: Bonferroni
    n: 9 experienced and 12 naive virgins
  criterion: Per-mouse population tuning curves of normalized dF/F (the imaging method, readings (vi)
    a and b). The ANOVA design is not given; the readings are (a) a one-way ANOVA over all group and
    ISI cells with Bonferroni-corrected EV against NV comparisons at each of the seven morph ISIs;
    (b) EV against NV t-tests per morph ISI, Bonferroni over the seven. Reproduced when the EV mean
    exceeds the NV mean at each of 75, 125, 225, 275 and 375 ms and the 375 ms comparison has
    p <= 0.05 under every reading (of the design and of (vi)); partially reproduced when EV exceeds
    NV at all five but no reading gives p <= 0.05 at 375 ms; blocked as methods_underspecified when
    the readings disagree.

- id: ed6c-tuning-width-groups
  statement: Tuning width over 75 to 375 ms is broader for excitatory neurons in experienced than in
    naive virgins; in naive cortex interneurons are more broadly tuned than excitatory neurons; and
    interneuron tuning width does not differ between experienced and naive virgins.
  source: Extended Data Fig. 6c
  quote: "Excitatory neuronal tuning curves were significantly broader in EVs (N=9 mice) than in NVs (N=12; p=0.001), and interneuron tuning was broader than excitatory tuning in naive cortex (Inh: N=6; p=0.04). Interneuron tuning width did not differ between experienced (N=5) and naive virgins (p>0.99; one-way ANOVA, Bonferroni correction)"
  statistics:
  - about: EV against NV excitatory
    test: one-way ANOVA, Bonferroni correction
    p: 0.001
    corrected: Bonferroni
    n: 9 EV and 12 NV mice
  - about: NV interneurons against NV excitatory
    test: one-way ANOVA, Bonferroni correction
    p: 0.04
    corrected: Bonferroni
    n: 6 and 12 mice
  - about: EV against NV interneurons
    test: one-way ANOVA, Bonferroni correction
    p: 0.99
    p_relation: ">"
    corrected: Bonferroni
    n: 5 and 6 mice
  criterion: Per-mouse tuning widths (the imaging method, readings (vi) a and b) in four groups (EV
    and NV, excitatory and interneuron); one-way ANOVA with Bonferroni post hoc comparisons. Which
    pairs form the Bonferroni family is not stated; the readings are (a) the three pairs reported,
    (b) all six pairs. Reproduced when, under every reading (of the family and of (vi)), EV
    excitatory exceeds NV excitatory and NV interneurons exceed NV excitatory, each at p < 0.05, and
    EV against NV interneurons is not significant; blocked as methods_underspecified when the
    readings disagree.

- id: ed3k-tones-no-experience-effect
  statement: The narrow tuning in naive cortex does not extend to temporally modulated pure tones;
    tuning width to tone sequences does not differ between experienced and naive virgins.
  source: Extended Data Fig. 3k; main text, paragraph citing Extended Data Fig. 3i-m
  quote: "the narrow tuning in naive cortex did not extend to temporally-modulated pure tones"
  statistics:
  - test: unpaired two-tailed t-test
    p: 0.97
    n: experienced 3 mice, 94 neurons; naive 4 mice, 45 neurons
  criterion: A claim of absence. Cells responsive to the best frequency and to the 175 ms (5 Hz)
    sequence by paired one-tailed t-test at p < 0.05; normalized dF/F of the 75, 375 and 575 ms
    sequences to the 175 ms one; width as the mean "across all stimuli" (the legend), the readings
    being with or without the 175 ms value (an affine change, so one is used). Unpaired two-tailed
    t-test. The legend gives both mice (3 and 4) and neurons (94 and 45) and does not say which is
    the unit; the readings are (a) neurons, (b) per-mouse mean widths. Reproduced when p >= 0.05
    under both, not reproduced when p < 0.05 under both, blocked as methods_underspecified when they
    disagree; the difference is reported.

- id: ed3m-tones-broader-than-calls-naive
  statement: In naive auditory cortex, normalized responses to temporally modulated tones are higher
    than to pup call morphs at 75, 375 and 575 ms.
  source: Extended Data Fig. 3m
  quote: "We observed higher normalized ΔF/Fs to temporally-modulated tones (N=5 mice) than to pup call morphs (n=11–12) in naive auditory cortex"
  statistics:
  - about: 75 ms
    test: unpaired two-tailed Mann-Whitney test
    p: 0.009
  - about: 375 ms
    test: unpaired two-tailed Mann-Whitney test
    p: 0.04
  - about: 575 ms
    test: unpaired two-tailed Mann-Whitney test
    p: 0.004
  criterion: Normalized dF/F to tone sequences (normalized to the 175 ms sequence, Methods) per
    naive mouse (N=5) against normalized dF/F to call morphs per naive excitatory mouse of Fig. 1f
    (n=11-12, the count varying by ISI), at 75, 375 and 575 ms. The legend gives N=5 tone mice where
    Extended Data Fig. 3k gives N=4 naive mice; the difference is not explained, and the mice
    reached are reported. Whether the per-mouse value is the mean of single-cell curves or comes from
    the mean raw curve is reading (vi). Reproduced when, under every reading, tones exceed calls at
    all three ISIs by unpaired two-tailed Mann-Whitney test at p < 0.05.

- id: ed4c-left-broader-than-right
  statement: Broad temporal tuning in experienced virgins is left-lateralized; tuning width (75 to
    375 ms) is larger in left than in right auditory cortex.
  source: Extended Data Fig. 4a-c
  quote: "broad temporal tuning was left-lateralized in experienced females"
  statistics:
  - test: unpaired two-tailed Mann-Whitney test
    p: 0.003
    n: 9 left and 4 right experienced virgins
  criterion: Per-mouse tuning widths (the imaging method) of EV excitatory neurons, left (the nine of
    Fig. 1f) against right (N=4). The unit is mice, since panel c is "from animals in (b)", and p = 0.003
    matches the smallest exact two-sided Mann-Whitney p for 9 against 4 mice (2/715, about 0.0028,
    complete separation). Reproduced when left exceeds right at p < 0.05 by unpaired two-tailed
    Mann-Whitney test over mice; single-cell curves are shown as a variant.

- id: ed4d-response-tracks-isi-probability
  statement: In experienced virgins, call-evoked dF/F across ISI bins is correlated with the
    probability of each ISI in natural pup calls.
  source: Extended Data Fig. 4d
  quote: "In EVs (N=9 mice), evoked ΔF/Fs were correlated with ISI probability from the distribution in Fig. 1a (Pearson’s r=0.86, p=0.007; two-tailed)"
  statistics:
  - test: two-tailed Pearson correlation
    statistic: r = 0.86
    p: 0.007
    n: 9 experienced virgins; 8 ISI bins
  expected:
    quantity: Pearson r, dF/F against ISI probability
    value: 0.86
    tolerance: 0.086
  data: with_inputs
  criterion: The mean dF/F per ISI bin over the nine EV mice (eight points, prototype and seven
    morphs) against the probability of that bin in the Fig. 1a distribution. The ISI distribution is
    not in the dataset; it comes from fig1a-isi-distribution or from the source data. The legend says
    "evoked ΔF/Fs", the term the paper uses for raw responses as against "normalized ΔF/F", so raw
    dF/F is used and normalized dF/F is shown as a variant. Reproduced when r is within tolerance and
    p < 0.05.
  depends_on:
  - fig1a-isi-distribution

- id: ed4e-dam-broad-tuning
  statement: Qualitatively, the left auditory cortex of a lactating dam shows broad temporal tuning,
    similar to that of experienced virgins.
  source: Extended Data Fig. 4e; main text, paragraph citing Extended Data Fig. 4d,e
  quote: "Qualitatively, we observed broad temporal tuning in the left auditory cortex of a lactating dam (N=1 dam, n=10 single-cell tuning curves)"
  criterion: The dam's mean normalized curve (10 single-cell curves). The paper gives no test ("we
    observed similar tuning in a lactating dam", main text). Reproduced when its tuning width lies
    within the range of the nine EV mice's widths and above the NV median; these bounds are a
    reading of "similar" and "broad", not the paper's.

- id: ed4g-broadening-with-reliable-retrieval
  statement: In virgins retrieving on 10-30% of trials, temporal tuning was sharper before the
    onset of reliable retrieval; more neurons are broadly tuned once they retrieve on 100% of trials.
  source: Extended Data Fig. 4f,g
  quote: "A larger proportion of neurons were more broadly tuned (higher normalized ΔF/Fs) when EVs retrieved on 100% of trials (p<0.0001; two-tailed unpaired Kolmogorov-Smirnov test)"
  statistics:
  - test: two-tailed unpaired Kolmogorov-Smirnov test
    p: 0.0001
    p_relation: "<"
    n: 2 mice, 78 neurons before and 52 after
  criterion: Single-cell tuning widths of the two virgins before (n=78) and after (n=52) reliable
    retrieval (Extended Data Fig. 4f, the 10% virgin day 0 n=21 and day 2 n=26, the 30% virgin
    day 1 n=57 and day 2 n=26). Reproduced when the after distribution lies to the right (higher median) and the
    two-sample KS test has p < 0.0001; partially reproduced when p < 0.05.

- id: fig1g-ipsc-depress-faster
  statement: In pup-naive auditory cortical slices, IPSCs depress faster than EPSCs at the
    prototypical stimulation rate (175 ms), while EPSCs and IPSCs depress similarly at 75 or 575 ms.
