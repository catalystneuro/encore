# Claims for Costabile, Balakrishnan, Schwinn & Haesemeyer (2023), "Model discovery to link neural
# activity to behavioral tasks", eLife 12:e83289, tested on DANDI:000235, 000236, 000237 and 000238.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-25,
# protocol as stated in docs/protocol.md (version pilot-19, Reader).
#
# Text read. The version of record (eLife, published 6 June 2023), paper/10.7554-elife.83289.txt,
# extracted from the publisher PDF (also under paper/): main text, the legends of Figures 1 to 7,
# Table 1, Methods, Data availability. The PDF was opened only to read Figure 6 (panels F and G)
# and Figure 7 (panel E), whose values the text does not give. eLife's figure supplements
# (Figure 1, 2, 3, 4, 5, 6 and 7, figure supplement 1) are online only: neither their panels nor
# their legends are in the PDF or the text. The Results state what each of them shows, and the
# claims that rest on them (region enrichments, Figure 6, figure supplement 1D, E, G to I;
# Figure 7, figure supplement 1A to E) are written from those Results sentences and from the
# code that draws them. Supplementary file 1 (Z-Brain region abbreviations) and the MDAR checklist
# are not under paper/; neither holds results.
#
# Code read. github.com/haesemeyer/mine_pub at commit 368d75650a1de92d9dd6c7dd1aadff24be6ba379,
# the revision the paper archives (Software Heritage, Haesemeyer 2023). It holds the CNN
# (model.py), the Taylor routines (taylorDecomp.py), the MINE interface (mine.py), the simulation
# scripts for Figures 1 to 4 (cnn_fit_test.py, cnn_nonlin_test.py, cnn_sta_test.py, mine_edf.py,
# perf_nlc_nonlin.py), the mouse analysis (processMusall.py, plotMusall.py), the zebrafish fitting
# (rwave_data_fit.py), decomposition (rwave_decompose.py), classification (rwave_build_main.py)
# and figure code (rwave_plot_panels.py), the backfill analysis (rspinal_build_main.py,
# rspinal_plot_panels.py), anatomical clustering (AnatomyClustering.py) and helpers
# (utilities.py). It reads the lab's own hdf5 experiment files (experiment.py), not the NWB files
# on DANDI. The tail-processing code (bitbucket.org/jcostabile/2p) and CaImAn pipeline
# (github.com/haesemeyer/imaging_pipeline) were not read.
#
# Zebrafish method fixed by the code where the Methods are silent (cited in the criteria as
# "code"). Calcium signal, CaImAn's denoised trace (all_c), interpolated to 5 Hz, z-scored per
# neuron and smoothed with a Gaussian of sigma 2.5 frames (rwave_data_fit.py); components with
# average brightness below 0.1 skipped. Predictors at 5 Hz, in this order: temperature (laser
# command converted to power and then to temperature with the heating model, alpha 0.8787 K/J,
# beta 0.0356 per s, baseline 22 C), swim starts (bout count per bin), vigor and direction (the
# tail metrics summed over each bout, placed at its start bin); the three behavior predictors
# mean-subtracted, orthogonalized by modified Gram-Schmidt in that order, then each z-scored.
# CNN as get_standard_model, 50 timepoints (10 s), 80 linear filters, two 64-unit swish layers,
# dropout 0.5, L1 1e-3, Adam at 1e-3, batch 256, 100 epochs; trained on the first two-thirds of
# each plane's frames and tested on the last third. Fit when the test correlation is at least
# sqrt(0.5). Taylor metrics from expansions every 5 frames predicting 25 frames ahead, each with
# 1000 bootstrap resamples of the timepoints; a metric counts when its bootstrap mean minus n
# bootstrap SDs exceeds 0.1, where n is the smallest whole number of SDs whose two-sided normal
# coverage exceeds 1 - 0.05/(number of fit neurons); a "behavior" metric removes all behavior
# terms and behavior-behavior interactions together. Linearity and complexity from the expansion
# at the mean of the training inputs, scored every 5 frames. The comparison linear model is a
# Ridge regression (alpha 1e-4) on the four predictors shifted by 0 to 49 frames, fit on the same
# training frames, identified at the same test correlation sqrt(0.5).
#
# Data the paper used, as it reports them. Zebrafish (Methods, Zebrafish experiments and
# Processing of zebrafish data). 25 larval zebrafish, 5 to 7 days post fertilization, mitfa -/-;
# elavl3-H2B:GCaMP6s +/-; vglut2a-mCherry, imaged on a two-photon microscope at 2.5 Hz,
# 0.78 um per pixel, 30 planes 5 um apart per fish (750 planes). The brain was split into six
# overlapping regions (two dorsoventral by three anterior-posterior). Each plane received 495 s of
# a "random wave" heat stimulus (sine waves with periods of 13 to 200 s, 22 to 30 C) from a laser;
# the code splits each plane's recording into three trials and rotates by one trial for the
# control. The tail was tracked at 250 Hz; swim starts, vigor (summed absolute angular derivative
# over a bout) and direction (summed tail-tip angle over a bout) were extracted. CaImAn found
# 706,543 components, 432,882 after excluding dim ones. All stacks except the backfill ones were
# registered to the Z-Brain atlas (CMTK to an internal reference, then ANTs). Excluded before
# analysis: five fish died, eight could not be registered, six had failed tail tracking, four had
# imaging artifacts. The paper's data list names DANDI:000235 "Thermoregulatory Responses
# Forebrain", 000236 "Midbrain" and 000237 "Hindbrain", which together hold the 25 fish, and
# 000238 "Thermoregulatory Responses Reticulospinal system", six fish (mitfa -/-;
# elavl3-H2B:GCaMP6s) whose reticulospinal neurons were backfilled with Texas-Red dextran and
# annotated by hand; these were not registered.
#
# Data outside the four dandisets. The simulations of Figures 1 to 4 are generated by the code
# (data elsewhere). The mouse analysis of Figure 5 uses the widefield dataset of Musall et al.
# 2019, CSHL repository doi:10.14224/1.38599, one session from each of 13 mice (data elsewhere).
# The anatomical claims need the Z-Brain atlas masks (Randlett et al. 2015) and each neuron's
# registered position; the paper deposits its processed data, which hold the Z-Brain centroids,
# on Zenodo doi:10.5281/zenodo.7737788, and the fit CNN weights on doi:10.5281/zenodo.7738603 and
# doi:10.5281/zenodo.7741542 (data with_inputs).
schema_version: 2
paper: doi:10.7554/elife.83289
claims:
- id: fig1f-mine-fits-ground-truth
  statement: On simulated ground-truth responses MINE's CNN predicts held-out data for every
    response type, while a simple linear regression fails in most types and an expanded linear
    model (calcium-kernel convolution and pairwise interactions) fails on the time derivative of
    an input and on some nonlinear transformations.
  source: Results, A model discovery approach to identify task-relevant neurons, paragraphs 2 and
    3; Figure 1F
  quote: a simple linear regression model fails to explain activity in most cases ... the expanded
    linear model is poor in capturing some nonlinear transformations of predictors and fails to
    capture responses that relate to the time derivative of an input
  data: elsewhere
  where: Not deposited; generated by the paper's simulation code, github.com/haesemeyer/mine_pub
    at commit 368d756, cnn_fit_test.py
  criterion: As in cnn_fit_test.py (Methods, Ground-truth datasets), 20 simulations per response
    type, first two-thirds for training, last third for test, squared correlation to test data.
    The paper gives no number for "fails" or "poor"; it is read against MINE. Reproduced when (a)
    for every response type MINE's mean test r2 is at least that of both linear models minus the
    SD across the 20 runs, (b) the simple model's mean r2 is below MINE's by more than 0.2 in more
    than half of the types, and (c) the expanded model's mean r2 for dS1/dt and for at least one
    nonlinear type (|S1| or T(S2)) is below MINE's by more than 0.2. The 0.2 margin is set here
    and is not the paper's; results at margins 0.1 and 0.3 are shown too.
- id: fig2bcd-complexity-scores
  statement: Mixing a nonlinear function (tanh squared of x cubed) into a response lowers both the
    linear and the second-order Taylor approximation scores; mixing in the derivative lowers
    neither; mixing in a rectified version lowers the linear score but not the second-order score.
  source: Results, MINE characterizes computational complexity, paragraph 3; Figure 2B to 2D
  quote: Increasing the contribution of an arbitrary nonlinear function ... leads to a marked
    decrease in both of these ... increasing the contribution of a derivative of the predictor
    indeed does not decrease either ... When increasing the contribution of a rectified linear
    version of the predictor, the amount of variance explained by the linear truncation drops while
    this is not the case for the truncation after the second-order term
  data: elsewhere
  where: Not deposited; generated by the paper's simulation code, github.com/haesemeyer/mine_pub
    at commit 368d756, cnn_nonlin_test.py
  criterion: As in cnn_nonlin_test.py, linear (LAS) and second-order (SOS) scores of the
    expansion at the data mean (Methods, equations 3 and 4) across the mixing fractions of each
    series. Reproduced when, from the smallest to the largest mixing fraction, the tanh series
    drops in both scores, the derivative series stays at or above 0.8 in both, and the softplus
    series drops below 0.8 in LAS while SOS stays at or above 0.8. The 0.8 level is the paper's
    linearity cutoff, used here also for SOS as the paper gives no level for "drops".
- id: fig2e-linearity-roc
  statement: As a classifier of nonlinear transformations, the linear approximation score ranks a
    nonlinear transformation below a linear one in 99% of cases (AUC 0.99), and a cutoff of 0.8
    gives false-positive and false-negative rates below 0.05.
  source: Results, MINE characterizes computational complexity, paragraph 4; Figure 2E
  quote: This analysis revealed that the ... value ranks a nonlinear transformation lower than a
    linear one in 99% of cases (Figure 2E). Importantly, this metric allows disambiguating linear
    and nonlinear processing with acceptable false-positive and false-negative rates
  data: elsewhere
  where: Not deposited; generated by the paper's simulation code, github.com/haesemeyer/mine_pub
    at commit 368d756, cnn_nonlin_test.py
  expected:
  - quantity: ROC AUC of the linear approximation score over 500 sets of linear and nonlinear
      transformations
    value: 0.99
    tolerance: 0.099
  - quantity: false-positive and false-negative rate at a linear score cutoff of 0.8 (each below)
    value: 0.05
    tolerance: 0.005
  criterion: As in cnn_nonlin_test.py (Methods, Ground-truth datasets), 500 sets of five random
    stimuli, two linear and two nonlinear responses each. Reproduced when the AUC is within
    tolerance and both error rates at 0.8 are at most 0.055.
- id: fig3-receptive-fields-slow-stimuli
  statement: With slowly varying stimuli MINE recovers a linear and a nonlinear receptive field
    well, ordinary least-squares fits of the Volterra kernels fail, Ridge fits with high penalties
    come close, and MINE's model predicts test data slightly better than the best Volterra fit.
  source: Results, MINE characterizes neural receptive fields, paragraphs 2 and 3; Figure 3B, 3C,
    3E and 3F
  quote: Under these more naturalistic conditions, MINE still yielded well-fitting receptive fields
    ... An ordinary regression fit of the Volterra kernels, on the other hand, failed to recover the
    receptive fields ... for high penalties, the direct fit of the Volterra kernels yielded
    receptive fields of almost comparable quality to MINE ... The CNN model fit by MINE also had
    slightly higher predictive power compared to the best-fit Volterra model
  data: elsewhere
  where: Not deposited; generated by the paper's simulation code, github.com/haesemeyer/mine_pub
    at commit 368d756, cnn_sta_test.py
  criterion: As in cnn_sta_test.py, 100 simulations per filter set, the best cosine similarity of
    the eigenvectors of Q with the three largest eigenvalues to each true filter (Methods,
    equation 17). Reproduced, for each of the two filter sets, when MINE's median similarity
    exceeds the OLS fit's for both filters, the best Ridge penalty's median is within 0.1 of
    MINE's or below it, and MINE's median test correlation is at least that of every Volterra
    fit. The 0.1 margin for "almost comparable" is set here.
- id: fig3-effective-degrees-of-freedom
  statement: Although the CNN has nearly 14,000 parameters, its effective degrees of freedom are
    below 50, close to those of the Ridge models that recover the receptive fields.
  source: Results, MINE characterizes neural receptive fields, paragraph 5; Figure 3, figure
    supplement 1K
  quote: in spite of having nearly 14,000 parameters, the effective degrees of freedom of the CNN
    model are <50
  data: elsewhere
  where: Not deposited; generated by the paper's simulation code, github.com/haesemeyer/mine_pub
    at commit 368d756, mine_edf.py
  expected:
  - quantity: CNN parameters for one predictor and 50 timepoints
    value: 14000
    tolerance: 1400
  criterion: Effective degrees of freedom of the CNN by equation 22 (Methods), estimated by
    simulation as in mine_edf.py. Reproduced when the estimate is below 50 and the parameter
    count is within tolerance.
- id: fig4-taylor-metric-ranks-predictors
  statement: On ground-truth data the full Taylor expansion predicts the change in network output
    well, and the Taylor metric ranks the predictors and interactions that generate a response
    above those that do not.
  source: Results, Taylor analysis identifies predictors driving the response, paragraphs 2 and 3;
    Figure 4B to 4E
  quote: Sorting individual terms by this metric consistently ranks those that we expect to
    contribute (Figure 4C–E, red bars) higher than those that should not
  data: elsewhere
  where: Not deposited; generated by the paper's simulation code, github.com/haesemeyer/mine_pub
    at commit 368d756, cnn_fit_test.py
  criterion: Taylor metrics as in Methods, Identifying contributing predictors by Taylor
    decomposition (equations 23 to 34), 20 simulations per response type. Reproduced when, for the
    M2, R(S1) x R(S2) and |S1| response types, every expected term's mean metric exceeds every
    unexpected term's mean metric.
- id: fig5c-cortex-components-fit
  statement: On the mouse widefield data, with a test correlation cutoff of 0.1, MINE fits more
    than 91% of the temporal components per session on average.
  source: Results, MINE characterizes cortical sensorimotor processing, paragraph 2; Figure 5B and 5C
  quote: On average, this led to the identification of >91% of all components per session
  data: elsewhere
  where: CSHL repository doi:10.14224/1.38599 (Musall et al. 2019), one session from each of 13
    mice; the paper's results are on Zenodo doi:10.5281/zenodo.7737788
  expected:
    quantity: mean over 13 sessions of the fraction of 200 components with test correlation of at
      least 0.1
    value: 0.91
    tolerance: 0.091
  criterion: As in processMusall.py and plotMusall.py, predictors shifted by 5 s, MINE with the
    first two-thirds of each session for training. Reproduced when the mean fraction is at least
    0.819 (the reported bound less 10%).
- id: fig5d-cortex-largely-linear
  statement: Only 3% of the fit cortical components have a linear approximation score below 0.8,
    so the relationships between predictors and widefield activity are largely linear.
  source: Results, MINE characterizes cortical sensorimotor processing, paragraph 2; Figure 5D
  quote: only 3% of fit components have a linear approximation score <0.8
  data: elsewhere
  where: CSHL repository doi:10.14224/1.38599 (Musall et al. 2019), one session from each of 13
    mice
  depends_on:
  - fig5c-cortex-components-fit
  expected:
    quantity: fraction of fit components with a linear approximation score below 0.8
    value: 0.03
    tolerance: 0.005
  criterion: The tolerance is the rounding of a whole percent (2.5 to 3.5%), wider than 10%.
    Fraction over all fit components of all 13 sessions, as plotMusall.py prints it.
- id: fig5e-uninstructed-movements-dominate
  statement: Across sessions, uninstructed movements have the largest Taylor metric in more than
    half of the fit cortical components.
  source: Results, MINE characterizes cortical sensorimotor processing, paragraph 3; Figure 5E
  quote: uninstructed movements appear overrepresented sporting the largest Taylor metric in more
    than half of the fit components
  data: elsewhere
  where: CSHL repository doi:10.14224/1.38599 (Musall et al. 2019), one session from each of 13
    mice
  depends_on:
  - fig5c-cortex-components-fit
  criterion: Taylor metrics significant when the bootstrap mean minus 3 standard errors exceeds 0
    (plotMusall.py; the zebrafish cutoff of 0.1 is not used for the mouse data in the code).
    Uninstructed movements are the predictors Figure 5E groups so (Piezo, Whisk, Nose, Pupil,
    Face, Body). Reproduced when the predictor with the largest significant metric is one of them
    in more than half of the fit components.
- id: fig5fh-cortex-maps
  statement: Per-pixel Taylor metrics place visual stimuli in visual cortex with a left-right
    asymmetry, whisking in regions matching Musall et al., and instructed left and right grabs in
    motor cortex with a left-right asymmetry, though not every session shows clear grab regions.
  source: Results, MINE characterizes cortical sensorimotor processing, paragraph 3; Figure 5F to
    5H and Figure 5, figure supplement 1
  quote: visual stimuli are shown to contribute most strongly to responses in visual cortical areas
    with the expected left–right asymmetry ... instructed left and right grab events largely
    contribute to motor cortical regions, again with the expected left–right asymmetry
  data: elsewhere
  where: CSHL repository doi:10.14224/1.38599 (Musall et al. 2019), with the dataset's Allen CCF
    alignment
  depends_on:
  - fig5c-cortex-components-fit
  criterion: For the example session (the one plotMusall.py draws), maps of lVisStim minus
    rVisStim and of lGrab minus rGrab per-pixel Taylor metrics. Reproduced when the visual
    difference map has its positive and negative extremes in opposite posterior (visual) cortices
    and the grab difference map has them in opposite anterior (motor) cortices. Which hemisphere
    carries which sign is read from the figure, contralateral to the stimulus or limb.
- id: fig5i-cortex-receptive-fields
  statement: Receptive fields of visual pixels are biphasic and lie entirely in the past, with
    excitation stronger than inhibition, while grab receptive fields are sharper and extend up to
    100 ms into the future, indicating preparatory activity.
  source: Results, MINE characterizes cortical sensorimotor processing, paragraph 4; Figure 5I
  quote: The visual receptive fields have essentially zero weight after the current time ... the
    grab-related receptive fields contain coefficients different from baseline for up to 100 ms
    into the future
  data: elsewhere
  where: CSHL repository doi:10.14224/1.38599 (Musall et al. 2019)
  depends_on:
  - fig5fh-cortex-maps
  criterion: As in plotMusall.py (cluster_jacobian_map), pixels in the top 10% of the Taylor
    metric for the visual or grab predictors, receptive fields split into two clusters by
    spectral clustering. Reproduced when the excitatory visual cluster averages have weights
    after time 0 below 10% of their peak, and the excitatory grab cluster averages depart from
    baseline (by more than 10% of their peak) at a lag after 0 of at most 0.2 s. The 10% levels
    are set here; the paper reads the figure by eye.
