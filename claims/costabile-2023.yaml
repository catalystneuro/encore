    tolerance: 0.086
  criterion: The value is read from the bars of Figure 6F (about 390 behavior, 45 temperature, 10
    mixed and 8 with neither); no sentence gives it. Fitting and Taylor analysis as for the
    whole-brain data, with the Bonferroni count over the fit neurons of the six backfill fish
    (rspinal_build_main.py). A neuron is reticulospinal when at least half of it lies in the
    hand-annotated backfill mask (code). Behavior is any significant behavior metric (the Results);
    rspinal_plot_panels.py, through an overwritten line, counts only the combined behavior term or
    swim start, and is shown as a variant. Reproduced when the behavior-only fraction is within
    tolerance under the Results reading, or at least 0.75 of the classified neurons are
    behavior-driven (behavior-only or mixed) and behavior-only is the largest class.
- id: figs6-stimulus-neuron-regions
  statement: Stimulus-driven neurons are enriched in telencephalic regions, the habenula and the
    interpeduncular nucleus, and temperature-sensitive neurons are found in a medial zone of the
    olfactory epithelium.
  source: Results, Functional characterization of thermoregulatory circuits, paragraph 7; Figure 6,
    figure supplement 1G and 1I
  quote: We found stimulus-driven neurons to be enriched in telencephalic regions, as well as the
    habenula and its output region the interpeduncular nucleus ... with the exception of the
    olfactory epithelium where we found temperature-sensitive neurons in a medial zone
  data: with_inputs
  datasets:
  - "000235"
  - "000236"
  - "000237"
  depends_on:
  - fig6e-functional-classes
  criterion: Needs each neuron's Z-Brain region (Z-Brain masks, Randlett et al. 2015, and the
    registered centroids on Zenodo doi:10.5281/zenodo.7737788, or a re-registration). Enrichment
    as Methods, Processing of zebrafish data, paragraph 6, with the code's details
    (plot_region_enrichment) of regions holding at least 50 neurons of the population, 5000
    simulated draws at the overall fraction, enriched when the region's fraction is above the
    97.5th percentile. The population is open, (a) stimulus, behavior and mixed neurons together
    (Methods) or (b) all fit neurons (code). Reproduced when, under one reading, at least one
    telencephalic region (pallium, subpallium or telencephalic migrated area 4), the habenula and
    the interpeduncular nucleus are enriched for stimulus neurons, and the olfactory epithelium
    mask holds stimulus neurons.
- id: figs6-behavior-neuron-regions
  statement: Behavior-driven neurons are enriched in hindbrain regions and in the nucleus of the
    medial longitudinal fasciculus.
  source: Results, Functional characterization of thermoregulatory circuits, paragraph 7; Figure 6,
    figure supplement 1H; Figure 6H
  quote: As expected, behavior-driven neurons are enriched in hindbrain regions and the midbrain
    nucleus of the medial longitudinal fasciculus
  data: with_inputs
  datasets:
  - "000235"
  - "000236"
  - "000237"
  depends_on:
  - fig6e-functional-classes
  criterion: Enrichment as in figs6-stimulus-neuron-regions, for behavior neurons. Reproduced when,
    under one reading, the nucMLF and at least half of the rhombencephalic regions tested are
    enriched.
- id: figs6-mixed-neuron-regions
  statement: Mixed-selectivity neurons are enriched in telencephalic area M4 and the
    interpeduncular nucleus, shared with stimulus neurons, and strongly in the superior raphe, the
    caudal hypothalamus and the torus longitudinalis.
  source: Results, Functional characterization of thermoregulatory circuits, paragraph 7; Figure 6,
    figure supplement 1I
  quote: Mixed-selectivity neurons occupy some regions shared with stimulus-driven neurons such as
    telencephalic area M4 and the interpeduncular nucleus but are also strongly enriched in the
    raphe superior as well as the caudal hypothalamus and the torus longitudinalis
  data: with_inputs
  datasets:
  - "000235"
  - "000236"
  - "000237"
  depends_on:
  - fig6e-functional-classes
  criterion: Enrichment as in figs6-stimulus-neuron-regions, for mixed neurons. Reproduced when,
    under one reading, at least four of the five named regions are enriched; partially reproduced
    for two or three.
- id: fig7a-behavior-feature-regions
  statement: Swim-start neurons are enriched in the dorsal thalamus and medial hindbrain, vigor
    neurons in the ventral thalamus, forebrain and locus coeruleus, and turning neurons in mid- and
    hindbrain regions.
  source: Results, Functional characterization of thermoregulatory circuits, paragraph 8 and
    Computational features of thermoregulatory circuits, paragraph 1; Figure 7A and Figure 7,
    figure supplement 1A to 1C
  quote: Swim start neurons are enriched in the dorsal thalamus as well as the medial hindbrain,
    while the ventral thalamus, the forebrain, and the locus coeruleus preferentially encode swim
    speed ... encode turning are enriched in mid- and hindbrain regions
  data: with_inputs
  datasets:
  - "000235"
  - "000236"
  - "000237"
  depends_on:
  - fig6e-functional-classes
  criterion: Neurons with a significant vigor, direction or swim-start metric, made exclusive as
    the code does (vigor first, then direction, then swim start); the population is the three
    together (Methods, and code). Enrichment otherwise as in figs6-stimulus-neuron-regions.
    "Medial hindbrain" and "forebrain" name no Z-Brain region; they are read as any rhombomere 1
    to 7 or medial hindbrain stripe, and any telencephalic region. Reproduced when at least five
    of the seven named sites are enriched for their type (dorsal thalamus and medial hindbrain
    for swim start; ventral thalamus, forebrain and locus coeruleus for vigor; a mesencephalic
    and a rhombencephalic region for direction); partially reproduced for three or four.
- id: fig7b-receptive-field-clusters
  statement: Clustering the temperature receptive fields of stimulus-driven neurons by cosine
    similarity yields 15 clusters, each with neurons from at least 15 fish.
  source: Results, Computational features of thermoregulatory circuits, paragraph 2; Figure 7B
  quote: A clustering approach based on the cosine similarity of receptive fields (see ‘Methods’)
    resulted in 15 clusters. For each of these clusters, neurons came from at least 15 fish across
    our dataset
  datasets:
  - "000235"
  - "000236"
  - "000237"
  depends_on:
  - fig6e-functional-classes
  expected:
  - quantity: receptive field clusters
    value: 15
    tolerance: 1.5
  - quantity: fish contributing to the smallest-fish cluster (at least)
    value: 15
    tolerance: 1.5
  criterion: Receptive field is the temperature part of the Jacobian at the data mean (Methods,
    equation 35) of pure stimulus neurons, clustered by the greedy cosine method of Methods,
    Clustering of neurons according to receptive field, at a similarity of 0.8, with clusters below
    25 neurons dropped (rwave_build_main.py; the Methods give no size cut). Reproduced when the
    count is within tolerance and every cluster has neurons from at least 14 fish.
- id: fig7c-receptive-field-types
  statement: Receptive field clusters differ in the temperature feature they extract and in where
    they lie; clusters responding to slow heating and to slow cooling are enriched in the
    forebrain, a cluster computing the rate of heating over short timescales lies almost only in
    the hindbrain, and a cluster with only negative weights (excited by cold) lies mainly in hind-
    and midbrain.
  source: Results, Computational features of thermoregulatory circuits, paragraph 2; Figure 7B and
    7C
  quote: Clusters 1 and 4 are enriched in the forebrain (Figure 7B, right), and their receptive
    fields suggest that they are most responsive to heating and cooling stimuli over slow
    timescales ... Cluster 3, on the other hand, computes the rate of heating over shorter
    timescales (Figure 7C) and is almost exclusively localized to the hindbrain ... Cluster 12
    represents neurons that are excited by colder temperatures since the receptive field
    exclusively has negative coefficients
  data: with_inputs
  datasets:
  - "000235"
  - "000236"
  - "000237"
  depends_on:
  - fig7b-receptive-field-clusters
  expected:
  - quantity: neurons in the slow-heating cluster (cluster 1)
    value: 1691
    tolerance: 169
  - quantity: neurons in the slow-cooling cluster (cluster 4)
    value: 1675
    tolerance: 168
  - quantity: neurons in the fast heating-rate cluster (cluster 3)
    value: 362
    tolerance: 36
  - quantity: neurons in the all-negative cluster (cluster 12)
    value: 112
    tolerance: 11
  criterion: Cluster numbers depend on the order of the greedy method, so clusters are matched to
    the paper's by the shape of their normalized mean receptive field (Figure 7C), one zero
    crossing rising to positive weights near time 0 (1), one zero crossing falling to negative
    weights (4), two zero crossings with a positive peak near time 0 (3), no crossing and all
    negative (12). Fraction of each cluster in telencephalon, diencephalon, mesencephalon and
    rhombencephalon as in rwave_plot_panels.py. Reproduced when the four shapes are found, the
    two slow clusters have their largest telencephalic fraction among the four, the fast heating
    cluster has more than 0.8 of its neurons in the rhombencephalon ("almost exclusively", level
    set here), and the cold cluster has more than half in mesencephalon and rhombencephalon
    together; the sizes are compared with the expected values.
- id: fig7d-mixed-integration-modes
  statement: Nonlinear neurons driven by both swim starts and temperature integrate the two in
    diverse ways, some adding behavioral and thermosensory drive and others gated, their sensory
    responsiveness scaled by swim drive.
  source: Results, Computational features of thermoregulatory circuits, paragraph 3; Figure 7D and
    Figure 7, figure supplement 1E
  quote: Clustering neurons according to these response landscapes ... revealed diverse modes of
    integration across 10 clusters. Some neurons appear to add behavioral inputs linearly with
    thermosensory inputs ... Other neurons, however, show gating
  datasets:
  - "000235"
  - "000236"
  - "000237"
  depends_on:
  - fig6e-functional-classes
  criterion: Neurons with significant temperature and swim-start metrics and classed nonlinear;
    response landscapes from unit-norm receptive fields scaled from -10 to 10 in 100 steps, fed to
    each neuron's CNN; similarity the maximum of the normalized 2D circular cross-correlation;
    spectral clustering into 10 clusters (Methods; rwave_plot_panels.py). The number 10 is set in
    the code, not found. The paper defines additive and gating by eye. Read here as, for each
    cluster's mean landscape (and its exemplar, as in the figure), the response range across
    sensory drive at swim drive +5 divided by that at -5; near 1 with a shifted curve is
    additive, far from 1 is gating. Levels open, (a) additive within 0.8 to 1.25 and gating
    outside 0.5 to 2, (b) within 0.67 to 1.5 and outside 0.33 to 3. Reproduced when under a
    reading at least one cluster is additive and at least one is gating.
- id: fig7e-complexity-by-cluster
  statement: Computational complexity maps onto receptive field type; three clusters have lower
    average complexity than expected, and one (cluster 6) has an average complexity above 1.
  source: Results, Computational features of thermoregulatory circuits, paragraph 4; Figure 7E
  quote: averaging the complexity score for different receptive field clusters reveals that three of
    these clusters have lower complexity than expected ... One cluster (cluster 6) had an average
    complexity score >1
  datasets:
  - "000235"
  - "000236"
  - "000237"
  depends_on:
  - fig7b-receptive-field-clusters
  expected:
  - quantity: clusters with average complexity below the bootstrap 95% interval
    value: 3
    tolerance: 0
  - quantity: clusters with average complexity above 1
    value: 1
    tolerance: 0
  criterion: Complexity 0 when the linear score is at least 0.8, 1 when it is below 0.8 and the
    second-order score is at least 0.5, 2 otherwise (Methods). Interval per cluster as
    boot_complexity in rwave_plot_panels.py, 1000 draws with replacement of the cluster's size
    from all stimulus neurons' scores, 2.5th to 97.5th percentile. Counts are small integers, so
    no tolerance; reproduced when exactly three clusters fall below their interval and exactly
    one has a mean above 1 (the figure shows clusters 1, 2 and 9 below and cluster 6 at about
    1.4); partially reproduced when two or four fall below and one or two exceed 1.
- id: fig7f-complexity-anatomy
  statement: Complexity classes are generally intermingled but regionalized; complexity 2 neurons
    lie medially in rhombomeres 1 and 2, in the habenula and in the dorsal telencephalon, while
    linear neurons are enriched in the posterior and medial hindbrain.
  source: Results, Computational features of thermoregulatory circuits, paragraph 4; Figure 7F
  quote: Within the hindbrain, neurons of complexity class 2 are found medially in rhombomeres 1 and
    2 ... Prominent clusters of complexity 2 neurons can also be found in the habenula and dorsal
    telencephalon ... Linear neurons, on the other hand, are enriched in the posterior and medial
    hindbrain
  data: with_inputs
  datasets:
  - "000235"
  - "000236"
  - "000237"
  depends_on:
  - fig7e-complexity-by-cluster
  criterion: The paper shows this by anatomical clustering (5 um radius, connected components,
    clusters of 10 or more plotted) and reports no test. Read here with the enrichment method of
    figs6-stimulus-neuron-regions over all fit neurons, complexity 2 against the rest and
    complexity 0 against the rest. Reproduced when complexity 2 is enriched in rhombomere 1 or 2,
    the habenula and the pallium, and complexity 0 is enriched in at least one of rhombomeres 5 to
    7; the anatomical cluster maps are shown.
- id: lm-recovers-fewer-clusters
  statement: The linear model identifies neurons in every receptive field cluster, but fewer than
    five in four clusters, and clustering only the neurons it identifies recovers 4 of the 15
    receptive field clusters.
  source: Discussion, Novel insight into biological circuits, paragraph 4; Figure 7, figure
    supplement 1D
  quote: in four clusters the linear model identified less than five neurons ... applying our
    clustering on the neurons identified by the linear model only recovers 4 instead of the 15
    unique receptive field clusters that are obtained with MINE
  datasets:
  - "000235"
  - "000236"
  - "000237"
  depends_on:
  - fig7b-receptive-field-clusters
  expected:
  - quantity: receptive field clusters with fewer than five linear-model neurons
    value: 4
    tolerance: 0
  - quantity: clusters recovered when clustering only linear-model neurons
    value: 4
    tolerance: 0
  criterion: The code at the cited commit does not hold this analysis. For the first count, the
    neurons of each MINE cluster that the linear model also identifies. For the second, the
    readings are (a) the greedy clustering (similarity 0.8, minimum 25 neurons) run on the MINE
    receptive fields of the stimulus neurons the linear model also identifies, counting clusters
    that match a MINE cluster at cosine similarity of at least 0.8, and (b) the number of MINE
    clusters holding at least 25 linear-model neurons, the size cut of the clustering. Reproduced
    when the first count is exactly 4 and the second is 4 under one reading; partially reproduced
    when one of the two holds or the counts are 3 or 5.
- id: temperature-nonlinear-behavior-linear
  statement: Most temperature-driven neurons are classified as nonlinear while most behavior-driven
    neurons are classified as linear.
  source: Discussion, Characterizing the model implemented by the CNN, paragraph 2
  quote: In our zebrafish dataset, the majority of temperature-driven neurons were classified as
    nonlinear while most behavior-driven neurons were classified as linear
  datasets:
  - "000235"
  - "000236"
  - "000237"
  depends_on:
  - fig6e-functional-classes
  criterion: Temperature-driven read as (a) pure stimulus neurons or (b) all neurons with a
    significant temperature metric; behavior-driven as (a) pure behavior neurons or (b) all with a
    significant behavior metric. Reproduced when, under a reading, more than half of the
    temperature-driven neurons have a linear score below 0.8 and more than half of the
    behavior-driven neurons have one of at least 0.8.
- id: interaction-terms-small
  statement: Interaction terms between predictors have very small Taylor metrics in the zebrafish
    data, so there is little evidence of multiplicative interactions.
  source: Results, Functional characterization of thermoregulatory circuits, paragraph 6; Discussion,
    Characterizing the model implemented by the CNN, paragraph 1
  quote: Since interaction terms had very small Taylor metrics, we ignored them for neuron
    classification purposes ... we found little evidence of multiplicative interactions in the
    biological data
  datasets:
  - "000235"
  - "000236"
  - "000237"
  depends_on:
  - fig6d-mine-identifies-more-than-lm
  criterion: The paper gives no number. Over MINE-fit neurons, the Taylor metrics of the six
    pairwise interaction terms. Reproduced when the median of every interaction metric is below
    the 0.1 cutoff for a contributing predictor (Methods) and below the median of the
    temperature and the combined behavior metrics, and fewer than 5% of fit neurons have any
    interaction metric significant at the corrected level; the 5% level is set here and the
    fraction is reported.
