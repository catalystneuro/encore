  statistics:
  - about: response size, Results
    test: unpaired t-test
    p: 0.019
    n: 31 interneurons and 350 pyramidal cells
  - about: response size, Supplementary Figure 9D legend
    test: Wilcoxon signed-rank test
    p: 0.05
    p_relation: "<"
  expected:
  - quantity: increase in interneurons
    value: 35.5
    tolerance: 5.9
    unit: percent
  - quantity: increase in pyramidal cells
    value: 26.2
    tolerance: 1.0
    unit: percent
  depends_on:
