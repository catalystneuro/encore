  statistics:
  - test: Wilcoxon signed-rank test
    statistic: W = 142 155
    p: 1.0e-6
    p_relation: "<"
    n: 1109 cells, 7 NpHR+ animals
  criterion: Method from Methods, Single unit versus multi-unit coherence analysis. Multi-unit
    activity is the summed spikes of all other units of the session; spikes binned at 500 Hz;
