# Claims for Espinosa, Alonso, Morales, Espinosa, Chavez & Fuentealba (2017), "Basal Forebrain
# Gating by Somatostatin Neurons Drives Prefrontal Cortical Activity", Cereb Cortex 29:42-53
# (advance access 17 November 2017), doi:10.1093/cercor/bhx302, tested on CRCNS bf-2 ("Basal
# forebrain extracellular recordings of anesthetized mice with somatostatin positive neurons
# optogenetically inhibited", doi:10.6080/K0MG7MQW).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-09,
# protocol pilot-14 as stated in docs/protocol.md (Reader).
#
# Text read. The version of record with its supplement, as supplied under paper/
# (10.1093-cercor-bhx302.txt, PyMuPDF text of the journal PDF and of the supplementary PDF
# bhx302suppmat_161017.pdf): Methods, Results, Discussion, figure legends, and the supplement
# (Supplementary Figures 1 to 14, Supplementary Tables 1 to 3, the legends of Supplementary Movies 1
# to 3). The figures were read from their legends and the Results sentences that cite them. The
# supplementary movies were not supplied; no claim rests on them. Supplementary Table 2 prints
# p as "4.94E-04" and the Figure 1D legend prints "4.10×10−5"; the quote checker does not find
# these forms, so they were confirmed by reading.
#
# Code. The paper links no analysis code of its own. It names the tools it used: KlustaKwik
# (github.com/kwikteam/klustakwik2) for spike sorting, the Chronux toolbox for multitaper spectra
# and coherence, eegfilt.m from EEGLAB for the slow-band filter, circ_corrcl.m from CircStat, MATLAB
# kmeans.m, and the LAN-toolbox for gamma event detection at http://lantoolbox.wikispaces.com/.
# That address did not respond on 2026-11-09 (Wikispaces closed in 2018). The data descriptor
# names a Bitbucket copy (bitbucket.org/marcelostockle/lan-toolbox), which asked for a login; it
# was not read. The descriptor also says the data set holds MATLAB scripts (fig_gamma_VP.m,
# fig_fourier_VP.m and others) written for a later manuscript; they are inside the data set, which
# the reader may not open, and were not read. Every method below is from the Methods, the Results,
# the figure legends or the supplement.
#
# Data the paper describes. Mice 8 to 30 weeks old, either sex, 27 in all (Methods). NpHR+ mice are
# Sst-IRES-Cre x Ai39 crosses expressing halorhodopsin in somatostatin cells; NpHR- controls are
# C57Bl/6J, Ai39 or Sst-IRES-Cre mice. Experiments:
# (1) In vitro whole-cell recordings in ventral pallidum slices (Supplementary Figs 2 and 3).
# (2) Basal forebrain recordings under urethane with a 32-channel optrode (100 um fiber, 4 to 6 mW,
#     5-s green light pulses): 330 units from 4 animals (Figure 1: 56 excited, 29 inhibited, 245
#     unaffected), part of them also tested with tail pinch (Supplementary Fig. 4).
# (3) Medial prefrontal cortex recordings under urethane with a 4-shank 32-channel probe, light
#     delivered to the basal forebrain by a 200 um fiber (10 to 25 mW): 1308 units from 7 NpHR+
#     animals in Figure 2C; light power series in 9 NpHR+ and 5 NpHR- animals (Figure 2D); local
#     atropine and mecamylamine in 3 mice (Figure 3); LFP slow oscillations and gamma (Figure 4).
# (4) Open-field video of chronically implanted mice (bilateral fibers), 5 NpHR+ and 5 NpHR-
#     (Figure 5, Supplementary Fig. 14, Supplementary Table 3).
# Measured variables are spike times, waveforms, LFP (20 kHz, analysed at 500 Hz), the laser and
# tail-pinch timing, and per-frame video movement. The data set's title and descriptor say it holds
# ventral pallidum recordings from 4 animals (20 ten-minute recordings, 32 channels, 330 neurons,
# laser 5 s on and 15 s off) for this paper, medial septum and hippocampus recordings for a later
# paper, LAN structures with the laser and somatosensory TTLs, per-neuron spike times and waveforms,
# and open-field and Y-maze videos for medial septum, ventral pallidum and control animals. The
# descriptor does not mention prefrontal recordings. Its files were not looked at.
#
# Discrepancies in the paper, recorded where they bear on a claim. The Results say discharge was
# "slightly higher in infralimbic cortex" while the Supplementary Fig. 6 legend gives a higher value
# for prelimbic (supp6-prelimbic-infralimbic). The low gamma power test is P = 0.0226 in the Results
# and P = 0.0018 in the Figure 4G legend (fig4g-low-gamma-power). The cell-type comparison of response
# size is an unpaired t-test in the Results and a Wilcoxon signed-rank test in the Supplementary
# Fig. 9D legend (supp9-interneurons-stronger). The Supplementary Fig. 10B legend reports a
# significant phase modulation over the first 3 s, the Results and 10C only over 3 to 5 s
# (supp10-phase-modulation). The Methods give the behavioral train as 10 1-s pulses at 1 Hz, the
# Figure 5 and Supplementary Fig. 14 legends as 10 1-s pulses at 0.5 Hz; the latency definition
# (measured from 20 s after train onset) follows the 0.5 Hz train. The Figure 1C legend bins at
# 250 ms, the Methods' cross-correlation at 500 ms.
#
# Shared method: responsive units (Methods, Unit cross-correlation analysis). Per unit, spikes in a
# window of 15 s before to 15 s after each light onset, in 500-ms bins, normalized to the unit's
# basal firing rate and accumulated over the pulses of the session. Spike times and pulse onsets
# are shuffled 100 times by exchanging their inter-event intervals, and the original sequence is
# compared bin to bin with the shuffled ones at P < 0.01. Open, and named in the claims that use
# it: (r1) a unit is excited (inhibited) when the mean normalized rate over the bins of the 5-s
# pulse is above (below) all 100 shuffled values; (r2) when at least one bin of the pulse is above
# (below) all 100 shuffled values in that bin, the sign taken from the mean over the pulse; (r3)
# when the pulse bins differ from the shuffled pulse bins by a two-sided rank-sum test at P < 0.01.
# The basal rate used to normalize is also open: (b1) the 5 s before each light onset, the
# light-off epoch the paper uses for coherence and slow oscillations; (b2) the whole 15 s before
# onset; (b3) the unit's mean rate over the recording outside the pulses. A 250-ms bin (Figure 1C)
# is a variant of the 500-ms bin.
