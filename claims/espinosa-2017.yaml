- id: fig4bcd-slow1-suppressed
  statement: Slow oscillation epochs form two clusters by power and frequency; only the very slow,
    high power cluster (slow 1, 0.5 to 1 Hz) is suppressed by the light, while slow 2 (1 to 2 Hz) is
    not.
  source: Results, Optogenetic stimulation of the basal forebrain reorganizes cortical oscillatory
    patterns, paragraph 1; Figure 4B to 4D legend; Supplementary Figure 8
  quote: we found that slow oscillatory episodes distributed in 2 clusters (Fig. 4B), from which, only
    1 cluster was affected by optical stimulation in the basal forebrain (Fig. 4C, D). That is, only
    very slow frequency, high power oscillations were suppressed by optogenetic stimulation
  statistics:
  - about: slow 1 power, light on against off
    test: paired t-test
    p: 0.0009316
    n: 77 epochs
  - about: slow 2 power, light on against off
    test: paired t-test
    p: 0.22603
    n: 793 epochs
  expected:
  - quantity: slow oscillation epochs
    value: 870
    tolerance: 87
    unit: epochs
  criterion: Method from Methods, Spectral analysis, and Supplementary Figure 8. Prefrontal LFP at
    500 Hz, z-scored, filtered 0.5 to 2 Hz (two-way least-squares FIR, eegfilt), Hilbert amplitude
    averaged over the 5 s before and the 5 s during each pulse. An epoch is not defined; readings are
    one per pulse (its light-off window) and one per pulse and channel. Each epoch's normalized power
    and main frequency are clustered by k-means with k = 2. Reproduced when, under one reading, two
    clusters separate a lower-frequency high-power group, its power falls during light by a paired
    t-test at p < 0.05, and the other cluster's does not (p >= 0.05). The Figure 4C sample (77
    epochs) is in Supplementary Figure 8.
- id: supp10-phase-modulation
  statement: The cortical response to the light is phase-modulated by the slow oscillation, largest
    in its active phase and smallest at the peak of the cycle, and this holds only in the second half
    of the light pulse (3 to 5 s).
  source: Results, Optogenetic stimulation of the basal forebrain reorganizes cortical oscillatory
    patterns, paragraph 1; Supplementary Figure 10
  quote: In fact, the effect was maximal during the active phase of slow oscillations and minimal at
    the peak of oscillatory cycles ... optogenetic stimulation of the basal forebrain was
    phase-modulated by the slow oscillation only during the second half of the laser pulse (i.e., 3–5
    s, Supplementary Fig. 10)
  statistics:
  - about: phase modulation of light-evoked discharge (Supplementary Figure 10B)
    test: circular-linear correlation
    p: 0.0047
  - about: responses at cycle peaks against troughs
    test: Wilcoxon signed-rank test
    p: 0.05
    p_relation: "<"
  criterion: Phase of the slow oscillation from the Hilbert transform of the 0.5 to 2 Hz band
    (Methods), with 0 degrees at the LFP peak; per pulse, the phase at light onset and the evoked
    discharge, in 36-degree bins (10A) or 40-degree bins (10B); circular-linear correlation
    (circ_corrcl) over integration windows from light onset. The legend of 10B places p = 0.0047 in
    the first 3 s while the Results and 10C place significance only in the second half; readings
    are the window from onset to 3 s and from 3 to 5 s. Reproduced when the correlation is
    significant (p < 0.05) for windows ending after 3 s and not for those ending at or before 3 s,
    with the largest response away from the peak; the 0 to 3 s result is reported.
- id: fig4g-low-gamma-power
  statement: Prefrontal LFP power in the low gamma band (20 to 40 Hz) is higher during the light than
    in control periods.
  source: Results, Optogenetic stimulation of the basal forebrain reorganizes cortical oscillatory
    patterns, paragraph 2; Figure 4E and 4G legend
  quote: found a prominent shoulder in the low gamma range (20–40 Hz, Fig. 4E), which power was
    significantly more elevated during optical stimulation when compared to control periods (Wilcoxon
    signed-rank test, P = 0.0226, Fig. 4G)
  statistics:
  - about: as given in the Results
    test: Wilcoxon signed-rank test
    p: 0.0226
  - about: as given in the Figure 4G legend
    test: Wilcoxon signed-rank test
    p: 0.0018
  criterion: Multitaper spectra (Chronux, TW = 3, 5 tapers) of the 500-Hz LFP over the 5-s pulse and
    the 5 s before it, normalized by 1/f, mean power 20 to 40 Hz (Methods, Spectral analysis). The
    unit of the test is not given; readings are per animal (n = 7) and per pulse. Reproduced when,
    under one reading, the signed-rank test gives p < 0.05 with higher power during light.
