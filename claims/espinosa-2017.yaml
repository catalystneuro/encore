- id: fig4h-low-gamma-episodes
  statement: The density of low gamma episodes increases during the light, while high gamma episode
    density does not change.
  source: Results, Optogenetic stimulation of the basal forebrain reorganizes cortical oscillatory
    patterns, paragraph 2; Figure 4H legend; Supplementary Figure 11B
  quote: We found that the density of oscillatory episodes significantly increased (t-test, P = 5.8 ×
    10−8) only in the low gamma band during optical stimulation (Fig. 4H), but was not affected in
    the high gamma band (Supplementary Fig. 11)
  statistics:
  - about: low gamma episode density, light on against off
    test: paired t-test
    p: 5.76e-8
  - about: high gamma episode density, light on against off
    p: 0.17033
  criterion: Detection from Methods, Detection of cortical gamma band oscillations. LFP at 500 Hz,
    band-pass FIR (20 to 40 Hz for low and 55 to 80 Hz for high, from the Results; the Methods filter
    20 to 80 Hz), rectified, 20 Hz fourth-order Butterworth low-pass, z-scored over the whole
    signal; events exceed 2 SD, bounded at 1 SD, 150-ms refractory window and 150-ms minimum
    duration. Density is events per second in the 5-s pulse against the 5 s before. The unit of the
    paired test is not given; readings are per pulse and per animal. Reproduced when, under one
    reading, low gamma density is higher during light by a paired t-test at p < 0.05 and high gamma
    density is not (p >= 0.05).
