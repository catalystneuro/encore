  source: Results, Optogenetic disinhibition of the basal forebrain, paragraph 2; Supplementary
    Figure 9D legend
  quote: Optical stimulation of the basal forebrain activated similar proportions of putative
    interneurons and pyramidal cells. However, the increase in discharge probability produced by
    laser stimulation was significantly higher on interneurons (35.5 ± 5.9%) than on pyramidal cells
