  source: Results, Optogenetic disinhibition of the basal forebrain, paragraph 2; Supplementary
    Figure 9C
  quote: A histogram of spike durations for all recorded units showed a bimodal distribution, with
    fast-spiking cells (i.e., spike duration <0.6 ms), putative GABAergic interneurons (McCormick et
    al. 1985), accounting for a small fraction of the total neuronal population (9.9%). Fast-spiking
    cells discharged at significantly higher rates (unpaired t-test, P = 3.9 × 10−36, 5.16 ± 0.39 Hz)
  statistics:
  - test: unpaired t-test
    p: 3.9e-36
    n: 287 interneurons and 2588 pyramidal cells
  expected:
