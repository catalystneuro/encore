    79.8%, the cells of the lower two or lower three bins, and "active" as excited units or all
    recorded units. The legend's excited counts (14, 131, 176, 60) are matched under the same
    readings. Reproduced when, under one reading, all five values are within tolerance; partially
    reproduced when the four fractions are within tolerance and no bin's fraction differs from the
