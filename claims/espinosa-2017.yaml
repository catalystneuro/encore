- id: fig3b-baseline-unchanged-response-decays
  statement: The cholinergic antagonists do not change baseline cortical spiking, while the light
    raises discharge at all tested intervals and this effect progressively decreases after the drug.
  source: Results, Optogenetic disinhibition of the basal forebrain, paragraph 1; Figure 3B
  quote: Importantly, baseline spiking activity in the cortex was not affected by cholinergic receptor
    antagonists (Fig. 3B). On the other hand, optical stimulation produced a significant increase in
    cortical discharge probability at all tested intervals (Friedman test, P = 1.07 × 10−18); yet,
    this effect progressively decreased after local drug application (Wilcoxon signed-rank test, P =
    2.6 × 10−4, Fig. 3B)
  statistics:
  - about: light against no light across intervals
    test: Friedman test
    p: 1.07e-18
  - about: decrease of the light effect after the drug
    test: Wilcoxon signed-rank test
    p: 2.6e-4
  depends_on:
  - fig3a-cholinergic-blockade
  criterion: Units of fig3a-cholinergic-blockade. The time points of Figure 3B are not listed;
    readings are 1-min intervals and the pulses grouped by 5 per interval. The paper gives no test
    for the unchanged baseline; it is judged with the paper's paired test (Wilcoxon signed-rank) on
    the per-unit baseline rate before against after the drug, p >= 0.05 meaning unchanged.
    Reproduced when the baseline is unchanged, the Friedman test gives p < 0.05 for light against no
    light, and the light response after the drug is lower than before by a signed-rank test at p <
    0.05.
