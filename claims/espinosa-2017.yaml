  - supp9-fast-spiking-cells
  criterion: Excited units of fig2c-mpfc-activation split by spike duration as in
    supp9-fast-spiking-cells (31 and 350 in the legend). Per unit, percent change over the pulse.
    The Results name an unpaired t-test, the legend a signed-rank test (which cannot compare two
    unpaired groups); the unpaired t-test is the main reading and a rank-sum test the variant.
    Reproduced when the test gives p < 0.05 with interneurons higher and both values are within
