  - quantity: fraction activated, depth 1 (superficial)
    value: 25.5
    tolerance: 2.55
    unit: percent
  - quantity: fraction activated, depth 2
    value: 30.8
    tolerance: 3.08
    unit: percent
  - quantity: fraction activated, depth 3
    value: 28.7
    tolerance: 2.87
    unit: percent
  - quantity: fraction activated, depth 4 (deep)
    value: 31.1
    tolerance: 3.11
    unit: percent
  depends_on:
  - fig2c-mpfc-activation
  criterion: The depth bins and which of them are "deeper layers" are not given. Readings are four
