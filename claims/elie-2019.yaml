# Claims for Elie & Theunissen (2019), PLoS Computational Biology 15(9):e1006698, "Invariant neural
# responses for sensory categories revealed by the time-varying information for communication calls",
# doi:10.1371/journal.pcbi.1006698, on CRCNS data set aa-4 (doi:10.6080/K00C4T06).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-11,
# protocol as stated in docs/protocol.md (Reader), version pilot-14.
#
# Text read: the version of record (PMC6762074, open access), as JATS XML flattened to text under
# paper/: main text, Methods, Table 1, and the legends of Figures 1 to 10 and of S1 to S7 Fig. The
# supplement is the seven figures whose legends are in the text; it has no other file. No PDF was
# supplied. The extraction drops every displayed equation: the information formulas, the
# coherence-based information (Methods, Time-varying spike rate estimation), the exponential model
# of the cumulative information (Results, Time-varying Information for 3 example neurons), the
# definition of the CII (Methods, Calculation of the expected value of categorical information) and
# the confusion-matrix information. Where the words around an equation or the code fix it, the
# criteria say so; where not, the equation is named as open and the reading the text allows is given.
# The author may read those equations in the published article (they are not figures). The data
# set's description (paper/aa-4.data-description.txt) was read only to know what it holds; no claim
# comes from it.
#
# Code read: https://github.com/julieelie/PoissonTimeVaryingInfo, commit 97802032 (2019-04-01), the
# repository the Methods and Data Availability link. It holds the per-unit calculations. The stimulus
# selection selVoc.m keeps the call types Ag (the Wsst call, Ws), Be, DC, Di, LT, Ne, Te, Th and song
# (whines and noise are dropped). info_callsemantic.m and info_model_Calculus_wrapper2.m compute the
# instantaneous information in 10 ms bins ending at 10, 20, ..., 600 ms after stimulus onset
# (MinWin 10, Increment 10, NeuroBin 10, ResDelay 0); the Poisson mean of a bin is the sum of the
# KDE rate (sampled at 1 kHz) over the bin; spike counts are summed from 0 to MaxY = 20; the lower
# bound on the mean is 1/20 (MuLims default, info_poisson_model_calculus.m); p(y|c) is the mean of
# p(y|s) over the stimuli of the category and categories are weighted equally; the random-category
# floor permutes the call-type labels once per unit (randperm in info_callsemantic.m); the fixed
# rate code uses each stimulus's KDE rate averaged over 0 to 600 ms. cumulative_info_poisson_model_
# calculus_MCJK.m and its wrapper do the Monte Carlo with importance sampling, 10^5 samples per chunk,
# up to 5x10^6, target error 0.2 bits, and stop at the first bin whose error exceeds 0.6 bits; the
# bootstrap of the jackknife uses NbBoot_CumInfo = 20. PoissonTestNeuralResponses.m holds the Poisson
# log-likelihood test (1000 simulated sets) and the noise correlation; PoissonGaussianNeuralResponses.m
# the Fano factor. The repository does not hold the locally adaptive KDE that makes the rates
# (PSTH_KDE_Filtered and JackKnife_KDE_Filtered are loaded already made), the coherence function
# (compute_coherence_mean, called but not present), the Benjamini-Hochberg step, the selection of the
# 404 and the 337 units, the exponential fits, the expected categorical information and the CII, or
# any population statistic, regression or anatomical analysis. Those come from the paper alone.
#
# Data the paper used (Results, opening paragraph; Methods, Animals and stimuli, Neurophysiological
# and histological procedures, Table 1).
# - Subjects. Six adult zebra finches (Taeniopygia guttata), 4 males and 2 females, urethane
#   anesthetized, head fixed. Table 1 names five of them (BlaBro09xxF, GreBlu9508M, LblBlu2028M,
#   WhiWhi4522M, YelBlu6903F); the sixth bird's electrode tracks were not recovered and it is left out
#   of the anatomy.
# - Recordings. One (1 bird) or two (5 birds) arrays of 16 tungsten electrodes (2 rows of 8), one per
#   hemisphere, at several sites per penetration (4.2 +- 2 sites per bird and hemisphere, 400 to
#   2550 um deep), in Field L (L1, L2, L3), CLM, CMM and NCM. Spikes by voltage threshold, sorted
#   offline into 914 single auditory units (SNR > 5); spike times aligned to stimulus onset.
# - Stimuli. At each site a new random subset of a bank of 486 vocalizations of 15 adults and 8
#   chicks, 9 call types (So, DC, Te, Ne, Ws, Di, Th for adults; Be, LT for chicks), up to 3 bouts per
#   call type from each of 10 callers (3 adult females, 3 adult males, 2 female and 2 male chicks), up
#   to 141 stimuli, 114 on average per unit (sd 22, 34 to 123), 10 trials each (9 to 11), random order,
#   75 dB SPL. The search stimuli (song, white noise, distance call, modulation-limited noise) are not
#   analysed (S4 Fig legend).
# - Units analysed. 404 of the 914 units, those from which call type could be decoded above chance in
#   Elie & Theunissen 2015 (Eur J Neurosci 41:546-567, the paper's reference 40); 337 of them with
#   significant stimulus cumulative information; 303 of the 337 with an anatomical location (Table 1).
# - Measured variables. Spike arrival times per trial over the first 600 ms after stimulus onset; the
#   call type and caller of each stimulus; the anatomical area and x, y, z coordinates of each site
#   (relative to the midline, the rostro-caudal position of the LPS peak, and the brain surface).
#
# Shared method. Criteria refer to these by letter.
# R, rates. For each unit and stimulus, the 9 to 11 trials of 600 ms are combined into a time-varying
#   rate at 1 kHz by the locally adaptive kernel bandwidth optimisation of Shimazaki and Shinomoto
#   (the paper's reference 42, ssvkernel) (Methods, Time-varying spike rate estimation, paragraph 2).
#   A stimulus with no spike in any trial gets the constant rate 1/(2*Ntrials*600) per ms, one with a
#   single spike 1/(Ntrials*600) (same paragraph). Jackknife rates are the same estimate on each set
#   of Ntrials-1 trials (Methods, Bias correction). Open, whether the rates are low-pass filtered
#   before binning (the code's inputs are named KDE_Filtered, the filter is not in the code; the text
#   says the rates "were sampled at 10ms (Nyquist limit frequency of 50Hz)"); readings (a) bin the KDE
#   rate as it is, (b) low-pass it at 50 Hz first. Either is expected to give the same outcome.
# B, bins. 60 bins of 10 ms, [0,10) to [590,600) ms after onset; the Poisson mean of a bin is the KDE
#   rate summed over the bin, bounded below by 1/20 (code, info_callsemantic.m and
#   info_poisson_model_calculus.m; Methods, The instantaneous information). Stimuli are the nine call
#   types of selVoc.m.
# I, information. Instantaneous stimulus and category information per bin, and cumulative stimulus
#   and category information from 0 ms to each bin by Monte Carlo with importance sampling, as the
#   Methods (Information theoretic calculations to Bias correction) and the code above give them,
#   bias-corrected by the jackknife and with errors from 20 bootstraps of the jackknife. A unit's
#   cumulative curve ends at the first bin whose error exceeds 0.6 bits (Methods, The cumulative
#   information, last paragraph). The paper's code is in MATLAB; a port is acceptable when it follows
#   the code.
# F, exponential fit. The equation is lost from the text read. Its words fix three parameters, a
#   latency dt, a time constant tau and a saturation k as a fraction of I_Max, with I_Max = log2(n_stim)
#   for stimuli and log2(n_cat) for categories (Fig 3D and Fig 7 legends). Reading, unless the printed
#   equation says otherwise, I(t) = k*I_Max*(1 - exp(-(t - dt)/tau)) for t > dt and 0 before, fitted by
#   least squares to each unit's bias-corrected cumulative curve over the bins it has. k300 is the
#   model's value at 300 ms divided by I_Max (Results, paragraph after the model equation). Open, what
#   "well fitted" means for the 214 units kept (Fig 7 legend); the paper gives no rule. Readings (a) the
#   fits of both curves converge with tau > 0, dt >= 0 and 0 < k <= 1; (b) as (a), and the 214 units
#   whose summed MSE of the two fits is lowest.
# C, CII. Per unit and bin, from the cumulative category information CCI and three references (Methods,
#   Calculation of the expected value of categorical information). Floor, the cumulative information
#   for categories formed by one random permutation of the call-type labels (code, info_callsemantic.m
#   and cuminfo_callsemantic.m, CICRand). Ceiling, the stimulus cumulative information capped at
#   log2(n_c), n_c = 9 (Results, Analysis of the categorical information, paragraph 1). Expected value,
#   by the three steps of the Methods: invert mi = log2 n + p log2 p + (1-p) log2((1-p)/(n-1)) for the
#   probability p of correct decoding of the n stimuli (the information of a confusion matrix with p on
#   the diagonal and (1-p)/(n-1) elsewhere, equal stimulus probabilities), group the joint
#   probabilities (p/n on the diagonal, (1-p)/(n(n-1)) elsewhere) by the unit's own call types, and
#   take the information of the grouped matrix. The CII formula is lost from the text read; the text
#   fixes CII = 0 at the floor, 1 at the expected value and 2 at the ceiling and says it lies between 0
#   and 2. Reading, unless the printed equation says otherwise, the piecewise linear map
#   CII = (CCI - Floor)/(Exp - Floor) when CCI <= Exp, and 1 + (CCI - Exp)/(Ceil - Exp) above it. A
#   unit's time-averaged CII is its mean CII from 50 to 300 ms (Fig 9A legend).
# P, population. Population analyses use the 337 units (claim units-337), the Poisson checks the 404
#   (Methods, Information theoretic calculations, paragraph 2). Open, how a unit whose cumulative curve
#   ended early enters a population average at later bins; readings (a) it is left out of the average
#   from the bin where it ends, (b) its last value is carried forward. Averages are means over units
#   with 2 SEM bands, as in the Fig 6 and Fig 9 legends.
# A, anatomy. The 303 units with a location (Table 1). Open, the distance to the L2 axis; the paper
#   says the sites were aligned on the oblique rostro-caudal long axis of L2 (Fig 10 legend) and that
#   values rise "as one moved rostrally or caudally" from it. Readings (a) the absolute perpendicular
#   distance, in the parasagittal plane, from each site to the line of the L2 axis, (b) the absolute
#   rostro-caudal distance from the L2 axis at the site's depth. The three regressions print F(2,195)
#   degrees of freedom; the printed p-values (0.0042, 0.00258, 0.0047) match F(1,195) and not
#   F(2,195), so the regression is read as one predictor (the distance) on about 197 units (the units
#   with a location among the well-fitted units, for the tau and k300 regressions), and the printed
#   p-values are the targets.
#
# Outside data. The 404-unit selection rests on the decoding analysis of Elie & Theunissen 2015
# (reference 40); this paper does not describe its method beyond "call-types could be decoded above
# chance level". The vocalization bank is at http://bit.do/ZebeVocBank (Data Availability); no claim
# needs it. The model neurons of Fig 1 are simulations; the code repository holds the tutorial's
# model cell data (ModelCell_InfoCumInfo_Tutorial.mat).
schema_version: 2
paper: doi:10.1371/journal.pcbi.1006698
claims:
- id: units-404
  statement: The analysis uses 404 of the 914 isolated single units, those from which call type
    could be decoded above chance in the authors' earlier study.
  source: Methods, Neurophysiological and histological procedures, last paragraph
  quote: The data of neural responses from 404 out of 914 isolated single units were used in this
    study. The 404 neurons were selected based on a prior analysis that showed that this subset of
    units were not only auditory but also contained information about call-types
  data: with_inputs
  expected:
  - quantity: single units in the data set
    value: 914
    tolerance: 0
  - quantity: units selected
    value: 404
    tolerance: 40
  criterion: The selection is the decoding analysis of Elie & Theunissen 2015 (Eur J Neurosci
    41:546-567, reference 40), which this paper does not describe. Readings (a) a list of the 404
    units from the data set's documentation or the 2015 paper, (b) the 2015 decoding selection redone
    as that paper describes it. Reproduced when the data set holds 914 single units and a selection
    of 404 +- 40 units can be made under one reading; the units, not only the count, are carried to
    later claims. Blocked as methods_underspecified when neither reading can be carried out.
- id: units-337
  statement: Of the 404 units, 337 have at least one time point with significant stimulus
    cumulative information, and these 337 form the population analysed.
  source: Methods, Information theoretic calculations, paragraph 2
  quote: categorical instantaneous and cumulative information were calculated on a restricted set of
    337 neurons that presented at least one time point with a significant value of stimulus
    cumulative information (significant threshold set as 3 times the local error
  depends_on:
  - units-404
  expected:
    quantity: units with significant stimulus cumulative information
    value: 337
    tolerance: 34
  criterion: Methods R, B and I on the 404 units. A unit is kept when, in at least one bin, its
    bias-corrected stimulus cumulative information exceeds 3 times its error (the bootstrap
    standard error of Methods, Bias correction). Open, whether the first bin (where the cumulative
    information equals the instantaneous information) counts; readings (a) all bins, (b) bins from
    20 ms. Reproduced when the count is within tolerance under one reading.
- id: s1-temporal-resolution
  statement: Low-pass filtering at 50 Hz (10 ms bins) keeps 96.7% +- 6.9% of the coherence-based
    information of the spike trains, only 88 of 404 units lose more than 5%, and 98.8% +- 1.6% of
    the power of the KDE rates lies below 50 Hz.
  source: Methods, Time-varying spike rate estimation, paragraph 4; S1 Fig
  quote: Over all units, 96.7% ±6.9% (mean ± SD) of information was conserved by a lowpass filtering
    at 50Hz and only 88 out of 404 cells had information losses greater than 5%. ... On average
    across units, the cumulative power reached 98.8%±1.6% (mean ± SD) at 50Hz
  depends_on:
  - units-404
  expected:
  - quantity: mean percentage of coherence information below 50 Hz
    value: 96.7
    tolerance: 6.9
    unit: percent
  - quantity: units losing more than 5% of the information
    value: 88
    tolerance: 8.8
  - quantity: mean percentage of KDE rate power below 50 Hz
    value: 98.8
    tolerance: 1.6
    unit: percent
  criterion: Tolerances on the two percentages are the stated SDs (protocol). Coherence, per unit
    the coherence between the PSTHs of two halves of the trials over all stimuli, converted to the
    coherence between one spike train and the mean response by the formula of the Methods (lost
    from the text read; reference 99, Hsu, Borst and Theunissen 2004), and I_AR = -integral of
    log2(1 - coherence) over frequency, from 0 to 50 Hz against 0 to 500 Hz (S1 Fig legend). Spike
    trains at 10 kHz as the Methods say (code, organiz_SpikeArray4coherence.m; the coherence function
    is not in the repository). Power, per unit, the KDE rates of all stimuli, each Hanning-windowed
    over 600 ms and concatenated, Welch periodogram in 200 ms windows at 1 kHz, cumulative power
    normalised to the total, read at 50 Hz (Methods; code, Semantic_NeuroInfo_Poisson_savio.m).
    Reproduced when all three values are within tolerance; partially when one or two are.
- id: fig1-model-neurons
  statement: For simulated Poisson neurons (rate, onset and temporal codes, 4 stimuli, 10 trials),
    the KDE recovers the model rates with an average error below 0.02 spikes/ms, the cumulative
    information approaches the 2-bit maximum, and the temporal neuron's peak instantaneous
    information is 0.5 bits.
  source: Results, Time-varying information for model neurons, paragraphs 2 and 3; Figure 1
  quote: over all stimuli and model neurons, the average error was less than 0.02 spikes/ms ... in
    the Temporal neuron ( Fig 1C & 1F ) a peak instantaneous information of 0.5 bits is expected as
    1 out 4 stimuli will be almost perfectly discriminated
  data: elsewhere
  where: GitHub julieelie/PoissonTimeVaryingInfo, commit 97802032, ModelCell_InfoCumInfo_Tutorial.mat
    and Tutorial_TimeVarying_Information.mlx
  expected:
  - quantity: average KDE error, all model neurons and stimuli
    value: 0.02
    unit: spikes/ms
  - quantity: peak instantaneous information, temporal neuron
    value: 0.5
    tolerance: 0.05
    unit: bits
  criterion: A simulation, not the recordings. The model rates are not given numerically in the
    paper; the tutorial's model cells are used. Reproduced when the mean absolute difference between
    KDE and model rates is below 0.02 spikes/ms, the cumulative information of each model neuron
    reaches at least 1.8 bits (90% of 2 bits, a fixed reading of "approaches", the paper giving no
    number) before it ends, and the temporal neuron's peak
    instantaneous information is within tolerance.
- id: fig2a-poisson-test
  statement: For most units (240 of 404) the spike counts in 10 ms bins cannot be told from a
    Poisson distribution in 90% of the bins, only 5 of 404 deviate in 40% of the bins, and on
    average 10.5% of bins are rejected.
  source: Results, Avian auditory neurons have approximate Poisson statistics, paragraph 2; Figure 2A
  quote: For the large majority of cells (240/404), the empirical spike count could not be
    distinguished from a Poisson distribution for 90% of the time bins. For a small number of
    neurons (5/404) non-Poisson spike count statistics could be observed in 40% of the time bins.
    The mean number of rejected time bins was 10.5%.
  depends_on:
  - units-404
  expected:
  - quantity: units with Poisson not rejected in 90% of bins
    value: 240
    tolerance: 24
  - quantity: units with Poisson rejected in 40% of bins
    value: 5
    tolerance: 1
  - quantity: mean percentage of rejected bins
    value: 10.5
    tolerance: 1.05
    unit: percent
  criterion: Per unit, stimulus and 10 ms bin, the Poisson log-likelihood of the trial counts with
    the delete-one (jackknife) KDE mean of each trial, against 1000 log-likelihoods of 10 Poisson
    samples with the full KDE mean; two-tailed p; Benjamini-Hochberg at 0.05 within each unit over
    all its stimulus-bin tests (Methods, Testing the poisson assumptions). The code
    (PoissonTestNeuralResponses.m) takes a one-tailed p, 1 minus the fraction of simulated
    log-likelihoods above the data's, has no FDR step, and uses bins from 10 to 610 ms; the Methods
    are followed and the code's p is a variant. Open, the cut-offs; readings (a) rejected in at most
    10% of bins and in at least 40%, (b) rejected in under 10% and over 40%. Reproduced when the
    three values are within tolerance under one reading; the count of 5 is held to +- 1 unit, as 10%
    of 5 is below one unit. Partially reproduced when the mean is within tolerance and one count is.
- id: fig2cd-fano-factor
  statement: The time-averaged Fano factor of the population is 1.04 (SEM 0.04) and is not
    significantly different from 1.
  source: Results, Avian auditory neurons have approximate Poisson statistics, paragraph 2; Figure
    2C and 2D
  quote: The mean Fano factor for the population was 1.04 with SEM of 0.04 ( Fig 2D )
  depends_on:
  - units-404
  expected:
    quantity: mean time-averaged Fano factor over units
    value: 1.04
    tolerance: 0.04
  criterion: Per unit, 10 ms bin and stimulus, the variance over the mean of the trial spike counts,
    averaged over stimuli (Fig 2C legend), then over the 60 bins (Fig 2D). The code
    (PoissonGaussianNeuralResponses.m) sets the ratio to 1 where variance equals mean, which covers
    stimuli with no spike in the bin; open, readings (a) as the code, (b) such stimuli left out. A
    claim of absence. The legend says "Fano Factors are not significantly different from 1" and
    names no test; readings (i) a two-sided one-sample t-test of the 404 time-averaged values against
    1, (ii) a two-sided Wilcoxon signed-rank test against 1, both at 0.05. Reproduced when the mean is
    within tolerance and neither test finds a difference; not reproduced when a test finds one. The
    mean and its SEM are reported either way.
- id: fig2b-noise-correlations
  statement: Noise correlations between successive 10 ms bins are small, centred near zero with a
    slight positive skew, while stimulus correlations between consecutive bins are high, centred
    around 0.4.
  source: Results, Avian auditory neurons have approximate Poisson statistics, paragraphs 3 and 4;
    Figure 2B
  quote: Significant noise correlations were observed (red bars versus non-significant values shown
    in blue), but they were small, centered around zero and their distribution showed a slight
    positive skew. ... the distribution of stimulus correlation (correlation of mean rate between
    pairs of consecutive time bins in the trial average response of each stimulus) across the neural
    population show high positive values centered around 0.4
  depends_on:
  - units-404
  expected:
    quantity: centre of the distribution of stimulus correlations over units
    value: 0.4
    tolerance: 0.04
  criterion: Noise correlation, per unit, the Pearson correlation over trials of the spike counts in
    successive bins for the same stimulus, averaged across pairs of bins and stimuli (Methods,
    Testing the poisson assumptions, paragraph 3, which come first). Variant, the code's
    (PoissonTestNeuralResponses.m), trial deviations from the delete-one KDE mean with the sums of
    products and of squares pooled over pairs of bins and stimuli; significance per unit against the 1000 simulated Poisson sets,
    two-tailed, as the code does. Stimulus correlation, per unit, the Pearson correlation over
    stimuli of the mean counts in consecutive bins, averaged over bin pairs; the text does not say
