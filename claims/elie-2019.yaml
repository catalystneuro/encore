    reading.
- id: fig3-5-example-neurons
  statement: Three example units show distinct codes, a high-rate unit responding to all calls with
    high cumulative information, a low-rate unit selective for distance calls with a selective onset,
    and a unit selective for Wsst calls with a long latency (100 to 300 ms).
  source: Results, Time-varying Information for 3 example neurons, paragraph 1; Figures 3 to 5
  quote: The neurons in Figs 4 and 5 have much lower firing rates and exhibit selectivity for a
    call-type, the Distance Call (DC) and the Wsst Call (Ws) respectively.
  criterion: The paper does not name the three units, so they cannot be found in the data set unless
