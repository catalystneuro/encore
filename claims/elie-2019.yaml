- id: fig6a-onset-sustained-information
  statement: Across the population the firing rate shows an onset followed by a lower sustained
    response, while the instantaneous information about stimuli and about categories stays almost
    constant, so the onset and sustained responses are equally informative in bits/s.
  source: Results, Rate and time-varying information, Population analysis, paragraph 1; Figure 6A
  quote: On average, avian cortical auditory neurons show an onset response followed by a sustained
    response ... The instantaneous information, however, remains almost constant during the entire
    time. This is true both for the information about individual stimuli or the information about
    categories.
  depends_on:
  - units-337
  criterion: Methods R, B, I and P. Population mean over the 337 units of the mean rate over stimuli
    and of the bias-corrected instantaneous stimulus and category information, per bin. The paper
    gives no rule for "almost constant"; this one is fixed here. The onset peak is the maximum
    population rate within 0 to 100 ms and the sustained level the mean rate over 150 to 600 ms.
    Reproduced when the onset peak exceeds the sustained level by at least 50%, and for both kinds of
    information the mean over 150 to 600 ms is within 20% of the mean over the bins from 20 ms to the
    rate peak plus 30 ms. Not reproduced otherwise.
- id: fig6c-new-information
  statement: The new information acquired per bin (the slope of the cumulative information) about
    categories stays roughly constant while the rate falls between 50 and 150 ms, whereas the new
    information about stimuli decreases and is correlated with the spike rate.
  source: Results, Rate and time-varying information, Population analysis, paragraph 1; Figure 6C
  quote: The new information for categories is relatively constant (red line Fig 6C ) and similar to
    the instantaneous information about category (yellow line Fig 6A ), while the spike rate is
    drastically decreasing between 50 and 150ms. ... In contrast, the new information for individual
    stimuli decreases and is, on average, remarkably correlated with spike rate ( Fig 6C ).
  depends_on:
  - units-337
  criterion: Methods R, B, I and P. Per bin, the population mean of the difference between successive
