# Claims for Brezovec, Berger, Druckmann & Clandinin (2022) on dandiset 000727.
# Source: the full text of the bioRxiv preprint, version 1 (posted 21 March 2022, CC BY-NC-ND),
# read from its Results, figure legends and STAR Methods. It is the only version on bioRxiv.
#
# What the author had seen when these criteria were written. The data check: the file list,
# metadata, shapes, rates, units and FicTrac series of all nine files; the per-voxel means and
# spreads of the processed planes; the brain masks of each fly. Before that, the correlations of
# one fly's FDA plane 50 with VF, VL and VR, summed by image half (left turns on one half, right
# turns on the other), which identified the left-right axis. Then one prototype analysis, of
# the voxel correlations behind fig2c-fraction-correlated, fig2c-venn-categories and
# fig2-symmetry, on the 12 planes used here. With behaviour sampled at the midpoint of each
# volume (fixed in the helper module before this was run) 31.1% of in-brain voxels passed
# p < 1e-4, 11.9% forward only, 15.9% forward and turning, 3.2% turning only, all three 11.5% of
# the correlated voxels; with behaviour sampled at the start of each volume 39.2%, 11.6%, 24.1%,
# 3.5% and 25.8%. The forward map correlated with its mirror image at r = 0.82, the left and
# right maps with their own mirror images at 0.45 and 0.33. The volume midpoint stays the main
# choice, as decided before; the start of the volume is a variant. No other claim's analysis
# had been run.
#
# The dandiset holds, for each of the nine flies, the raw volumes, the processed GCaMP6f volumes
# registered into the Functional Drosophila Atlas (FDA), the anatomical scan and the FicTrac
# output. It does not hold the paper's mean brain, the neuropil atlas in any space, the
# supervoxel labels, the per-plane acquisition times, or the motion-corrected tdTomato channel.
#
# Method choices fixed here, from the paper's code (ClandininLab/brezovec_volition_2023 at
# commit 8e2b275) where the Methods are silent, and otherwise chosen here (marked "choice").
# Forward velocity is FicTrac's dRotLabY and rotational velocity dRotLabZ, Savitzky-Golay
# smoothed (25 frames, order 3); VF is forward velocity clipped at 0, VL the positive part of
# rotation, VR the negative part with its sign flipped (the code labels these forward, left and
# right). Behaviour is sampled at the midpoint of each volume, as the files give no plane times
# (choice). Correlations are Pearson over the nine flies' 30,456 volumes pooled. In-brain
# voxels are those that are not constant in time in all nine flies. Supervoxels are replaced by
# 6 x 6 voxel blocks within each FDA plane, kept when at least half their voxels are in the
# brain in every fly (choice). Twelve FDA planes are used, every seventh from plane 10 (choice,
# for the time limit). The left-right axis of the FDA volume is its 314-voxel axis and the
# midline its centre (from the data check); which half is the fly's left is not stated.
# Quotes and statistics added 2026-10-20 from the full text (PDF of the preprint, version 1).
schema_version: 1
dandiset: "000727"
paper: doi:10.1101/2022.03.20.485047
claims:
- id: dataset-structure
  statement: Nine flies were imaged for 30 minutes each at a volume rate of about 1.8 Hz, with
    256 x 128 x 49 voxels of 2.6 x 2.6 x 5 um (about 1.6 million voxels per volume), giving
    30,456 volumes in all, while the ball was tracked at 50 Hz.
  source: Results, A novel method for whole-brain imaging in walking Drosophila, paragraphs 1 and 2;
    Figure 1A legend; STAR Methods, Two-Photon Imaging and Behavior Tracking
  quote: We then employed two-photon imaging with resonant scanning to achieve a volume imaging rate
    of 1.8 Hz, collecting approximately 1.6M voxels per volume... 1.6M voxels have each been sampled
    30,456 times over the course of 4.5 hr and 9 individuals
  expected:
  - quantity: flies
    value: 9
    tolerance: 0
  - quantity: volumes over all flies
    value: 30456
    tolerance: 0
  - quantity: volume rate
    value: 1.8
    tolerance: 0.18
    unit: Hz
  - quantity: voxels per volume
    value: 1600000
    tolerance: 160000
  - quantity: ball tracking rate
    value: 50
    tolerance: 0
    unit: Hz
  criterion: Counts are exact (tolerance 0, as they are counts or a stated device rate); the
    rate and voxel count use 10%. The voxel size and the 30 minute length are checked against
    the stored grid spacing and the number of volumes over the rate. Reproduced when every value
    matches.
- id: fig2c-fraction-correlated
  statement: About 39% of the brain volume correlates with at least one of forward velocity,
    left and right angular velocity.
  source: Results, Neural encoding of velocity space is widespread across the brain, paragraph 1;
    Figure 2C; Figure S2
  quote: We observed that signals were widespread, with 39% of the brain volume correlating with at
    least one of the three behavioral variables
  expected:
    quantity: percent of in-brain volume correlated with VF, VL or VR
    value: 39
    tolerance: 3.9
    unit: percent
  criterion: Pooled Pearson correlation of each voxel with VF, VL and VR over the nine flies,
    denominator the in-brain voxels of the 12 planes. The paper gives two thresholds, so the
    readings are (a) single voxels at two-sided p < 1e-4 (Figure 2B, Methods); (b) blocks at
    p < 1e-8, the Methods' Bonferroni threshold for 2000 x 49 supervoxels, counted as the
    in-brain voxels of the significant blocks. Reproduced when one reading is within tolerance.
    Partially reproduced when no reading is within tolerance but one is at least half of 39%
    (19.5%) and below the tolerance band; not reproduced otherwise. Behaviour at the start of
    each volume, and voxels in the brain of at least one fly, are shown as variants.
- id: fig2c-venn-categories
  statement: Of the brain volume, about 15% correlates only with forward velocity, 20% with
    forward velocity and turning, and 4% only with turning; only about 10% of correlated voxels
    correlate with all three components, so 90% show a tuning preference.
  source: Results, Neural encoding of velocity space is widespread across the brain, paragraph 1;
    Figure 2C
  quote: consisted of voxels that correlated only to VF (15% brain volume)... Most voxels that
    correlated with VR or VL also correlated with VF (20% brain volume), with relatively few
    correlating only with turning (4% brain volume)... with only 10% of voxels responding
    indiscriminately to all velocity components
  expected:
  - quantity: percent of in-brain volume correlated with VF only
    value: 15
    tolerance: 1.5
    unit: percent
  - quantity: percent of in-brain volume correlated with VF and VL or VR
    value: 20
    tolerance: 2.0
    unit: percent
  - quantity: percent of in-brain volume correlated with VL or VR but not VF
    value: 4
    tolerance: 0.4
    unit: percent
  - quantity: percent of correlated voxels correlated with all three
    value: 10
    tolerance: 1.0
    unit: percent
  criterion: Same correlations, denominator and readings (a) and (b) as
    fig2c-fraction-correlated. Reproduced when all four values are within tolerance under one
    reading. Partially reproduced when they are not, but under one reading the ranking holds
    (forward and turning above forward only, forward only above turning only) and fewer than
    20% of correlated voxels correlate with all three. Not reproduced otherwise.
- id: fig2-symmetry
  statement: Forward velocity correlations are mirror-symmetric across the midline, while left
    and right turning correlations are anti-symmetric, with more correlated voxels in the
    hemisphere ipsilateral to the turn.
  source: Results, Neural encoding of velocity space is widespread across the brain, paragraph 1;
    Figure 2D, E
  quote: VF correlations exhibited strong mirror symmetry across the midline... In contrast, VR and
    VL correlations were anti-symmetric, with high levels of correlation on the side of the brain
    that is ipsilateral to the direction of the turn
  criterion: Mirror about the centre of the FDA's left-right axis. Reproduced when (i) the VF
    voxel correlation map correlates with its mirror image at r of at least 0.7 over in-brain
    voxel pairs (choice); (ii) the VL map correlates more strongly with the mirrored VR map
    than with its own mirror image; and (iii) voxels significant for VL (p < 1e-4) are at least
    twice as many in one half as in the other, and voxels significant for VR at least twice as
    many in the other half. Partially reproduced when one or two of these hold. Which half is
    the fly's left is not given by the dandiset, so the ipsilateral part is reported as the
    image half and not judged.
- id: fig2e-region-fractions
  statement: Behaviour-correlated voxels occupy most neuropils with non-uniform velocity
    preferences, strongly in the central complex, posterior slopes, vest, superior medial and
    lateral protocerebrum, higher visual, olfactory and auditory areas and the mushroom body;
    IPS, AOTU and VES hold turning-only voxels, MB and LAL forward-and-turning, SMP and SIP
    forward-only.
  source: Results, Neural encoding of velocity space is widespread across the brain, paragraphs 2
    and 3; Results, Distinct topographic maps of locomotor signals exist in multiple brain regions,
    paragraph 1; Figure 2E-I
  quote: Although almost all neuropils contained signals that were correlated with behavior, their
    velocity preferences were highly non-uniform across brain regions (Figure 2E-I).
  criterion: Needs the neuropil of each voxel. Blocked if the dandiset has no neuropil labels for
    the space of its processed data.
- id: fig3-topographic-maps
  statement: Within neuropils, voxels of different velocity tuning are spatially organized, for
    example a forward and ipsilateral-turning column in PLP, left and right compartments in IPS,
    bands in LO, a dorsal-ventral split in LH, layers in FB, alternating turning in PB, glomeruli
    in NO and medial and lateral compartments in LAL.
  source: Results, Distinct topographic maps of locomotor signals exist in multiple brain regions,
    paragraph 2; Figure 3; Figure S3
  quote: Taking slices through orthogonal planes of each neuropil, we observed clear spatial
    organization at the sub-neuropil scale (Figure 3; Figure S3).
  criterion: Needs neuropil boundaries. Blocked if the dandiset has no neuropil labels for the
    space of its processed data.
- id: fig4bcd-pc-structure
  statement: The first principal components of brain-wide activity are structured by behaviour;
    PC1 is low when the fly is stopped and high otherwise, PC2 increases with forward velocity
    and not with angular velocity, and PC3 carries the sign of angular velocity.
  source: Results, Neural activity in the central brain is highly predictive of locomotor velocity,
    paragraph 2; Figure 4B-D
  quote: In particular, the value of PC1 was low when the fly was not moving and high otherwise,
    while PC2 increased with forward velocity but was invariant with respect to angular velocity,
    and PC3 encoded information about the sign of the angular velocity.
  criterion: PCA (covariance eigendecomposition) of the block signals of the nine flies pooled
    (30,456 time points, each block centred). Each PC's time course is the projection on it;
    PC1 and PC2 are signed to correlate positively with VF over all time points, PC3 to
    correlate positively with VL. The movement threshold is 0.75 s.d. of each velocity
    component (Figure 4E legend), read as (a) the component divided by its pooled s.d. above
    0.75, or (b) the z-scored component above 0.75. Correlations are computed separately below
    and above the threshold. Reproduced when, under one reading, (i) PC1's below-threshold
    correlation with VF is positive and larger in absolute value than PC2's and PC3's; (ii)
    among PC1 to PC3, PC2 has the largest above-threshold correlation with VF, and its
    above-threshold correlations with VL and VR are smaller in absolute value than with VF; and
    (iii) PC3's above-threshold correlations with VL and VR have opposite signs, each with
    p < 0.05. Partially reproduced when one or two of (i) to (iii) hold.
- id: fig4fg-ridge-r2
  statement: Linear models on the principal components predict forward, left and right
    velocity on held-out data with average R2 of about 0.3 using 100 PCs, performance improving
    over the first 100 PCs before declining.
  source: Results, Neural activity in the central brain is highly predictive of locomotor velocity,
    paragraph 3; Figure 4F, G
  quote: model performance improved over the first 100 PCs used, before declining as additional PCs
    were incorporated (Figure 4F). Notably, all three behavioral variables displayed comparable
    predictability on held-out test data, with average R2 values of approximately 0.3
  expected:
  - quantity: average held-out R2 for VF with 100 PCs
    value: 0.3
    tolerance: 0.03
  - quantity: average held-out R2 for VL with 100 PCs
    value: 0.3
    tolerance: 0.03
  - quantity: average held-out R2 for VR with 100 PCs
    value: 0.3
    tolerance: 0.03
  criterion: PCs from fig4bcd-pc-structure (the pooled superfly). For each fly, ridge regression
    from the first n PCs (n = 1, 10, 30, 100, 250, 500) to VF, VL or VR at the neural times,
    five contiguous folds within the fly (choice; the code does not show its folds), and, as
    the code does (pca_fit_behavior_models.py), the score is the largest over its alpha grid
    (1e-7 to 1e7) of the mean held-out R2. The average is read as (a) the median over flies
    (Figure 4G box plots) or (b) the mean over flies. Reproduced when all three are within
    tolerance under one reading. Partially reproduced when they are not but all three are at
    least 0.15. Not reproduced otherwise. Alpha chosen within the training folds, and PCs of
    each fly alone, are variants. Whether R2 rises up to 100 PCs and falls after is reported.
- id: fig4h-r2-vs-movement
  statement: Flies that moved less along a velocity component were poorly predicted (R2 near 0),
    while flies that explored it more were well predicted, with R2 up to 0.6.
  source: Results, Neural activity in the central brain is highly predictive of locomotor velocity,
    paragraph 3; Figure 4H
  quote: comparing model predictions on individual animals revealed that flies that moved less along
    a given velocity component were poorly predicted (R2 of approximately 0), while those that
    explored a velocity component more were well predicted (with R2 values up to 0.6)
  depends_on:
  - fig4fg-ridge-r2
  expected:
    quantity: largest per-fly R2 with 100 PCs
    value: 0.6
    tolerance: 0.06
  criterion: Per fly and component, the R2 of fig4fg-ridge-r2 with 100 PCs against the fly's mean
    of that component (mm/s or deg/s). Reproduced when the Spearman correlation is positive for
    each of the three components, the correlation of within-component ranks over the 27 fly and
    component points is positive with p < 0.05, the largest R2 is within tolerance and the
    smallest is below 0.1. Partially reproduced when the correlation part holds but not the
    extremes, or the correlation is positive for two of three components. Not reproduced
    otherwise.
- id: fig4i-weights-stereotyped
  statement: The model weights given to each PC are stereotyped across flies; PC1 is used for
    all components, PC2 mainly for forward velocity, and PC3 for left and right turning with
    opposite signs.
  source: Results, Neural activity in the central brain is highly predictive of locomotor velocity,
    paragraph 3; Figure 4I
  quote: the weights assigned to each PC for each fly, and for each behavior, were highly
    stereotyped... PC1 was used to predict all velocity components, PC2 was predominantly used to
    predict forward velocity, and PC3 was used for left and right turning predictions, flipping sign
    between the two.
  depends_on:
  - fig4fg-ridge-r2
  criterion: Per fly, ridge with 100 PCs at the alpha chosen in fig4fg-ridge-r2, fitted to all
    the fly's time points with each component divided by its s.d.; weights on PCs 1 to 20.
    (i) For each component, the median Pearson correlation of the 20 weights over the 36 pairs
    of flies is at least 0.5 (choice); (ii) PC3's weights for VL and VR have opposite signs in
    at least 7 of 9 flies; (iii) PC2's weight for VF is larger in absolute value than its
    weights for VL and VR in at least 7 of 9 flies; (iv) PC1's weights for the three components
    have the same sign in at least 7 of 9 flies. Reproduced when all four hold, partially
    reproduced when two or three hold, not reproduced otherwise.
- id: fig5a-unique-variance
  statement: Demixing with linear models shows that forward velocity is uniquely encoded by a
    spatially organized subset of voxels, while locomotor state (walking or stopped) is not
    uniquely encoded anywhere, although the single-variable maps of forward velocity and
    locomotor state are very similar.
  source: Results, Demixing the unique contribution of each velocity component to neural activity,
    paragraph 2; Figure 5A
  quote: while the single variable forward walking and locomotor state (stopped versus walking) maps
    were very similar, the maps created by demixing revealed that forward velocity was encoded by a
    spatially organized subset of voxels, while locomotor state was not encoded uniquely anywhere in
    the brain.
  criterion: Per block, ridge regression (alpha 1, choice; the Methods give none) of the block
    signal on VF, VL, VR and the code's walking state, pooled over flies, five-fold
    cross-validated with fold k the k-th fifth of every fly (choice). The unique contribution of
    a variable is R2 with all four minus R2 without it; a block encodes a variable uniquely when
    this is at least 0.01 (choice). Reproduced when at most 1% of blocks encode walking state
    uniquely, and at least 5% and at least five times as many encode VF uniquely. Partially
    reproduced when more blocks encode VF than walking state uniquely but a threshold is missed.
    Not reproduced otherwise. The correlation over blocks of the single-variable R2 of VF and of
    walking state is reported for the similarity part. The walking state as the code intended
    it is a variant.
- id: fig5c-global-below-threshold
  statement: The functional regions defined by the unique contributions of forward, left and
    right velocity are all correlated with velocity when the fly is below the movement
    threshold, a widespread increase in activity at the initiation of movement, while above the
    threshold each region correlates most with its own velocity component.
  source: Results, Demixing the unique contribution of each velocity component to neural activity,
    paragraph 3; Figure 5B, C; Figure S5B
  quote: we found that all three regions were highly correlated when the fly was stopped (below the
    threshold), strongly arguing for a wide-spread increase in neural activity associated with the
    initiation of movement... each region had strong correlations with only one behavioral velocity
    component.
  depends_on:
  - fig5a-unique-variance
  criterion: Regions are the blocks that encode VF, VL or VR uniquely in fig5a-unique-variance;
    a region's signal is the mean of its blocks. Threshold and readings (a), (b) as
    fig4bcd-pc-structure. Reproduced when, under one reading, all nine below-threshold
    correlations of the three regions with the three components are positive with p < 0.05,
    and above the threshold each region's largest correlation is with its own component.
    Partially reproduced when one of the two parts holds.
- id: fig5f-ipsi-contra
  statement: When the fly turns, neural activity increases in specific regions of the
    ipsilateral hemisphere and decreases in the same regions of the contralateral hemisphere.
  source: Results, Demixing the unique contribution of each velocity component to neural activity,
    paragraph 4; Figure 5F
  quote: the demixing linear model revealed that when the fly is turning, neural activity on the
    ipsilateral hemisphere increases in specific regions, while the contralateral hemisphere
    experiences a corresponding decrease in activity in the same regions (Figure 5F).
  criterion: The paper does not give its bounds for slow walking and turning, so they are chosen
    here; slow walking is forward 1 to 3 mm/s with absolute rotation below 30 deg/s; a left turn
    is rotation above 100 deg/s, a right turn below -100 deg/s, at the neural times. Per block,
    the mean activity during left turns minus that during slow walking, and the same for right
    turns. For each turn, take the blocks in the top 10% of increase; their mirror blocks
    across the midline must have a median change below 0, with a Wilcoxon signed-rank p < 0.05,
    and the increases must lie mostly (over half) in opposite image halves for left and right
    turns. Reproduced when both turns satisfy this, partially reproduced when one does.
- id: fig6-peak-time-range
  statement: The time of peak cross-correlation between supervoxel activity and forward velocity
    ranges from about 300 ms before the change in behaviour, the earliest, to more than 1 s
    after it.
  source: Results, The temporal relationship between neural activity and behavior varies across
    brain regions, paragraph 1; Figure 6A-E
  quote: the earliest correlations between neural activity and behavior emerged in specific
    neuropils approximately 300 milliseconds before the change in behavior, with the latest peak
    correlations persisting for more than 1 second after the change in behavior.
  expected:
    quantity: earliest peak lead of neural activity over forward velocity
    value: 0.3
    tolerance: 0.03
    unit: s
  criterion: Filters per block as in the paper's linear_filters.py (behaviour at the neural time
    plus shifts of -5 to 5 s in 20 ms steps, weighted by the block signal and summed over
    flies), notch-filtered at the volume rate (scipy iirnotch, Q = 2, choice) and deconvolved
    with the code's GCaMP6f kernel (deconvolution.py); the top 40% of blocks by filter peak are
    kept. The lead is the shift at the peak (positive when activity precedes behaviour).
    Readings for the earliest and latest are (a) the extreme blocks, (b) the 99th and 1st
    percentiles of lead. Reproduced when, under one reading, the earliest lead is within
    tolerance and the latest is a lag of more than 1 s; partially reproduced when one of the two
    holds. The neural times carry an error of up to 0.27 s (no plane times), noted with the
    result. VL and VR are reported.
- id: fig6h-peak-vs-width
  statement: Supervoxels whose peak correlation lags behaviour have broader temporal kernels,
    while those that anticipate behaviour have narrow kernels.
  source: Results, The temporal relationship between neural activity and behavior varies across
    brain regions, paragraph 1; Figure 6H
  quote: we observed a positive correlation between the time of peak correlation and the width of
    the temporal kernel, i.e. supervoxels that contain delayed information about behavior displayed
    a broad temporal kernel, while supervoxels that contain anticipatory information about behavior
    displayed narrow temporal kernels
  depends_on:
  - fig6-peak-time-range
  criterion: Over the top 40% of blocks for VF in fig6-peak-time-range, the Pearson correlation
    of lag (minus the lead) with the full width at half maximum of the deconvolved filter around
    its peak is positive with p < 0.05. Reproduced when it is, not reproduced otherwise.
- id: fig6fg-ipsi-leads-contra
  statement: Across nearly all brain regions, the peak correlation with angular velocity comes
    first in the hemisphere ipsilateral to the turn, then in the contralateral one.
  source: Results, The temporal relationship between neural activity and behavior varies across
    brain regions, paragraph 3; Figure 6F, G
  quote: Finally, across nearly all brain regions, the time of peak correlation with angular
    velocity emerged first in the ipsilateral hemisphere relative to the contralateral hemisphere.
  depends_on:
  - fig2-symmetry
  - fig6-peak-time-range
  criterion: Ipsilateral for VL is the image half with more voxels significant for VL in
    fig2-symmetry, and for VR the half with more significant for VR. Over mirror pairs of blocks
    both in the top 40% for that component in fig6-peak-time-range, the lead of the ipsilateral
    block minus that of the contralateral block has a median above 0 with a Wilcoxon
    signed-rank p < 0.05. Reproduced when this holds for VL and VR, partially reproduced when
    for one.
- id: fig6eg-region-sequence
  statement: Peak correlations follow a sequence across regions; for forward velocity the
    antennal lobe and lateral horn first, then mushroom body, GNG and saddle, the central
    complex spanning onset, and the optic lobes lagging by up to more than a second; for angular
    velocity IPS, GOR and VES lead and the central complex and optic lobes lag.
  source: Results, The temporal relationship between neural activity and behavior varies across
    brain regions, paragraphs 2 and 3; Figure 6E-G
  quote: For changes in forward velocity, the earliest peak correlations appeared in olfactory
    sensory areas, namely the Antennal Lobe (AL) and Lateral Horn (LH)... Thus, changes in forward
    velocity are correlated with a characteristic sequence of changes in neural activity distributed
    widely across the brain
  criterion: Needs the neuropil of each supervoxel. Blocked if the dandiset has no neuropil
    labels for the space of its processed data.
- id: fig7-within-region-gradients
  statement: Within brain regions, peak correlation times form spatial gradients, for example a
    dorsal before ventral order in LH for forward velocity and ipsilateral before contralateral
    order in LAL, MB-ML and PLP for angular velocity.
  source: Results, Individual brain regions display spatiotemporally structured patterns of
    engagement, paragraph 1; Figure 7; Figure S7
  quote: These analyses revealed that even within each brain region, the temporal order of neural
    engagement was highly organized, and aligned with both behavioral and anatomical features.
  criterion: Needs neuropil boundaries and plane times. Blocked if the dandiset has no neuropil
    labels for the space of its processed data.
- id: figs2-tdtomato-control
  statement: Correlations computed from the tdTomato structural channel show no behaviour-related
    signal, so motion artefacts are undetectably small.
  source: Figure S2E, H legend
  quote: The absence of signal in this Figure indicates that motion artifacts were undetectably
    small.
  criterion: Needs the motion-corrected tdTomato channel in the space of the GCaMP6f analysis.
    Blocked if it is not in the dandiset.
- id: figs4a-supervoxel-number
  statement: Behaviour prediction peaks at 2000 supervoxels per plane, among 1 to 10,000.
  source: STAR Methods, Agglomerative Clustering Supervoxel Creation; Figure S4A
  quote: Too few or too many supervoxels results in lower prediction accuracy, with a peak at 2000
    supervoxels (Figure S4A).
  criterion: Needs Ward clustering of every plane of the pooled flies at each of seven sizes.
    Blocked if the data that requires cannot be streamed within the time limit.
