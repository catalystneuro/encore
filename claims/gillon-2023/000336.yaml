  criterion: The signal of an ROI is the mean of its dF/F values above the noise threshold used for
    SNR (Fig. 7b legend; calculate_snr, signal_mean). ROIs, sessions and groups as in
    fig7a-snr-high-stable. "Stable over days" has the readings (i) and (ii) of fig7a-snr-high-stable.
    Reproduced when both readings hold for all four planes; not reproduced when neither does;
    blocked as methods_underspecified when they disagree. Every group's median and quartiles are
    reported.
- id: fig7c-correlations-similar
  statement: The distributions of pairwise ROI correlations are very similar for apical dendrite ROIs
    and for somatic ROIs, so the dendrites are unlikely to be heavily over-segmented.
  source: Technical Validation, paragraph 3; Figure 7c
  quote: The distributions of correlation coefficients were very similar for the apical dendrite ROIs
    and for the somatic ROIs ... suggesting that we were unlikely to be heavily over-segmenting the
    dendritic data
  data: elsewhere
  where: DANDI:000037 version 0.230426.0054 (doi:10.48324/DANDI.000037/0.230426.0054)
  criterion: Pearson correlations over all ROI pairs of each session, from whole-session dF/F traces
    smoothed with a 4-sample rolling mean (Fig. 7c legend; get_correlation, rolling_win 4), ROIs
    without NaN or Inf values, sessions 1 to 3 of the 11 analysed mice, pooled across mice within
    each line, plane and session. Comparisons are dendritic against somatic within a line and session
    (six comparisons). The paper gives no measure of similarity. Its argument is that over-segmentation
    would give many highly correlated dendritic pairs, so the readings are (i) the dendritic median
    correlation lies inside the somatic 25th to 75th percentile range, and (ii) the dendritic 99th
    percentile does not exceed the somatic 99th percentile by more than 10% of the latter.
    Reproduced when both readings hold in all six comparisons; not reproduced when neither holds in
    most; blocked as methods_underspecified otherwise. Quantiles and the fractions of pairs above 0.8
    are reported for every group.
- id: high-correlation-pairs
  statement: About 0.01% of possible pairs of L2/3 dendritic ROIs have correlations above 0.8.
  source: Technical Validation, paragraph 3
  quote: ROIs with correlations above 0.8 (e.g., approximately 0.01% of possible pairs of L2/3
    dendrites)
  data: elsewhere
  where: DANDI:000037 version 0.230426.0054 (doi:10.48324/DANDI.000037/0.230426.0054)
  depends_on:
  - fig7c-correlations-similar
  expected:
    quantity: fraction of L2/3-D ROI pairs with correlation above 0.8
    value: 0.01
    tolerance: 0.005
    unit: percent
  criterion: Correlations as in fig7c-correlations-similar. The tolerance is half the last printed
    digit (values that round to 0.01% at one significant figure), since the paper writes
    "approximately" and the default 10% would demand more precision than it gives. The denominator
    is open, (a) pairs pooled over the L2/3-D sessions 1 to 3 of the analysed mice, (b) the mean of
    per-session fractions over those sessions, (c) session 1 only. Reproduced when the fraction is
    within tolerance under one reading.
- id: fig9-onset-offset-transients
  statement: Mean dF/F traces show distinct transients aligned with the stimulus onsets and offsets
    (grey screen to stimulus and back), in every plane and session.
  source: Technical Validation, paragraph 6; Figure 9a and 9b
  quote: These ΔF/F traces show distinct transients that align with the stimulus onsets and offsets
  data: elsewhere
  where: DANDI:000037 version 0.230426.0054 (doi:10.48324/DANDI.000037/0.230426.0054)
  criterion: Onsets and offsets, windows and averaging as the code fixes them (see the opening
    comment; stimulus_onset_sess123 and stimulus_offset_sess123, pre 2 s, post 2 s, both stimuli),
    for sessions 1 to 3 of the 11 analysed mice, per line, plane and session (12 groups). Per ROI,
    the mean dF/F over 0 to 2 s after the event minus the mean over 2 s before. The paper gives no
    test and no sign for offsets. Readings, (i) the mean of this difference across ROIs exceeds twice
    its SEM in absolute value (the figure plots mean and SEM across ROIs), and (ii) a two-sided
    Wilcoxon signed-rank test across ROIs at p < 0.05. Reproduced when both readings find a
    transient at onset and at offset in all 12 groups, partially reproduced when they agree that
    some groups lack one, blocked as methods_underspecified when they disagree. The Fig. 9a legend
    names the Gabor sequence onset only, while the text and the code use both stimuli; onsets of the
    Gabor stimulus alone are shown as a variant.
