# Claims for Gillon, Lecoq et al. (2023), Scientific Data 10, 287, on dandiset 000336.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23, protocol
# pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record as served by Europe PMC (PMC10192216), full text with Background,
# Methods, Data Records, Technical Validation, Usage Notes, Code availability, Tables 1 and 2 and the
# figure legends, as extracted under paper/. No PDF was supplied, so the figures themselves were not
# seen, only their legends. Supplementary Table 1 (the full session metadata table) is not under
# paper/; the paper says it holds the columns of Tables 1 and 2 with a few more (dandiset number,
# local subject and session numbers, start time, age, experimental notes), and no claim rests on its
# extra columns. The other text under paper/ (Keller and Mrsic-Flogel 2018, Neuron, a review that
# the dandiset also cites) is not this paper and was not used.
#
# This is a data descriptor. The paper says it reports no statistics ("As this is a data
# descriptor paper, we leave aside any statistical analyses and interpretations"), so no claim has
# a statistics entry, and every criterion below that needs a test names its readings as open.
#
# Which data. The paper describes, and deposited, DANDI:000037 (version 0.230426.0054,
# doi:10.48324/DANDI.000037/0.230426.0054), the OpenScope "Credit Assignment" project. Dandiset
# 000336, by its archive title and description, is a different OpenScope project ("Dendritic
# Coupling"), which near-simultaneously images L2/3 and L5 somata and distal apical dendrites in V1,
# LM, PM and AM; the paper describes no such recordings. So every finding below is marked data
# elsewhere, on DANDI:000037, and one link claim (dataset-holds-paper-sessions) asks whether 000336
# holds any of the paper's sessions. Whether it does is the author's to find.
#
# Data the paper used (Methods; Data Records; Tables 1 and 2). 13 mice, two transgenic lines with
# GCaMP6f: Cux2-CreERT2;Camk2a-tTA;Ai93 (L2/3 pyramidal) and Rbp4-Cre_KL100;Camk2a-tTA;Ai93 (L5
# pyramidal). Each mouse is imaged in one plane, giving four groups: L2/3-D (distal apical dendrites
# at 50 to 75 um, 3 mice), L2/3-S (somata at 175 um, 3), L5-D (dendrites at 20 um, 4), L5-S (somata
# at 375 um, 3). Two-photon imaging of retinotopic centre of primary visual cortex at 30 Hz, 512 x 512
# pixels over 400 um. 50 sessions of 70 min (Table 2 gives subject ID, session ID, date, depth,
# number of ROIs, number of tracked ROIs, QC pass or fail and stimulus seed). Each session shows a
# Gabor sequence stimulus (34 min; sequences A-B-C-D-G of 300 ms images, inconsistent sequences
# A-B-C-U-G) and a visual flow stimulus (17 min in each of two directions, with counterflow of 25%
# of squares for 2 to 4 s as the inconsistent event), separated by 30 s of grey screen. Measured
# variables in each NWB file: ROI dF/F traces, ROI masks, ROI tracking indices, plane image, running
# velocity (cm/s, 60 Hz), pupil diameter and centroid (mm), stimulus parameter table; larger file
# versions add stimulus frames and the motion-corrected stack. Dendritic ROIs were segmented with
# EXTRACT, somatic ROIs with the Allen pipeline.
#
# Code read. The paper's analysis code, github.com/colleenjg/OpenScope_CA_Analysis at commit
# 046e7fef5f452cdc0775fe54040b0f13aeae1e57 (main): paper_fig_util/paper_organization.py maps each
# figure panel of this paper ("dataset" paper) to its analysis and parameters; analysis/misc_analys.py
# (SNR, signal, correlations), analysis/seq_analys.py and analysis/basic_analys.py (stimulus onset and
# offset traces), plot_fcts/misc_plots.py (box plots), mouse_df.csv (the session table), and
# roi_tracking/ (the tracking outputs only, as json; the custom-modified matching code itself is not
# in the repository). Its dependency github.com/colleenjg/util, tag osca_mult, commit
# 2b05f954a4aa871dbfdd83d1546ebe8e7f3069c6: util/math_util.py calculate_snr and rolling_mean. The
# stimulus code, github.com/colleenjg/cred_assign_stimuli at commit
# d056e0bf2eeddc534799badbc69eeb610fd5b821: run_generate_stimuli.py and
# cred_assign_stims/stimulus_params.py (block durations).
#
# Method choices fixed by the code where the text is silent. The figures of this paper use sessions
# 1 to 3 that passed QC (run_paper_figures.py, pass_fail "P", sess_n "1-3", with the session numbers
# of mouse_df.csv), which leaves out mice 411400 and 412933, whose sessions 1 to 3 failed QC: 11 mice
# and 33 sessions, as in the Usage Notes (33 files) and the Fig. 6b legend (11 mice). dF/F traces
# are used unscaled, and ROIs with NaN or Inf values are removed (rem_bad True). ROI values are
# pooled across mice within each line, plane and session number. SNR (calculate_snr) takes the
# values at or below the trace median, mirrors them about the median, takes their mean and standard
# deviation as the noise distribution, sets the noise threshold at its 95th percentile, and divides
# the mean of the values above the threshold (the signal) by the noise standard deviation.
# Correlations are Pearson correlations of whole-session dF/F traces after a 4-sample rolling mean,
# over all ROI pairs of a session. Stimulus onsets are the ends of every grey-screen period but the
# last, and offsets the starts of every grey-screen period but the first, for both stimuli, with 2 s
# before and 2 s after, no baselining, the mean over each ROI's onsets and then the mean and SEM
# across ROIs.
