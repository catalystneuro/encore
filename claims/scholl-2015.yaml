  statement: Across 6 animals 338 PV+ neurons were identified, 115 (34%) visually responsive to
    monocular and 236 (70%) to binocular stimuli; of 3,982 PV- neurons, 944 (24%) were
    responsive to monocular and 2,001 (50%) to binocular stimuli.
  source: Results, Binocular Integration in PV+ and PV- cells of Mouse V1 Binocular Zone,
    paragraph 3
  quote: we identified a total of 338 PV+ neurons, of which 115 (34%) were visually responsive
    for monocular stimuli and 236 (70%) were visually responsive for binocular stimuli. We
    identified 3,982 tdTomato ... (24%) were visually responsive for monocular stimuli and 2,001
    (50%) were responsive for binocular stimuli
  expected:
  - quantity: PV+ neurons identified
    value: 338
    tolerance: 33.8
  - quantity: PV+ responsive to monocular stimuli
    value: 115
    tolerance: 11.5
  - quantity: PV+ responsive to binocular stimuli
    value: 236
    tolerance: 23.6
  - quantity: PV- neurons identified
    value: 3982
    tolerance: 398.2
  - quantity: PV- responsive to monocular stimuli
    value: 944
    tolerance: 94.4
  - quantity: PV- responsive to binocular stimuli
    value: 2001
    tolerance: 200.1
  criterion: Responsiveness by the Methods' criterion, (mean stimulus - mean blank) / (SE
    stimulus + SE blank) >= 1 on the 0.5 s window response. The Methods require this for at
    least one monocular and one binocular stimulus, but the Results count monocular and
    binocular responsiveness separately and note binocular responses without monocular ones, so
    the count is read as cells with at least one monocular stimulus passing, and cells with at
    least one binocular stimulus passing, each counted on its own (counting only cells that meet
    the joint criterion would make the two counts equal, which the reported numbers rule out).
    The neuropil requirement (responses above the neuropil's
    95% confidence interval) is applied where neuropil traces are available and the result
    without it is shown; the paper does not define the neuropil region for this test. The
    counts hold when all six values are within tolerance.
