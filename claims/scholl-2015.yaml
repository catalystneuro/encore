- id: fig4ag-salt-and-pepper
  statement: Mouse V1 has no functional organization for ocular dominance or disparity
    preference; response similarity is unrelated to distance between cells (MI, bootstrapped
    PCA slope 0.01, p = 1; disparity, circular-linear correlation 0, p = 1, cells with DSI >
    0.1).
