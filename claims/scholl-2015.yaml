# Claims for Scholl, Pattadkal, Dilly, Priebe & Zemelman (2015), Neuron 87:424-436, "Local
# Integration Accounts for Weak Selectivity of Mouse Neocortical Parvalbumin Interneurons",
# doi:10.1016/j.neuron.2015.06.030, on CRCNS data set pvc-10 (doi:10.6080/K0GT5K3V).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-10,
# protocol as stated in docs/protocol.md (Reader), version pilot-14. The writer did not look at
# the data set's data or files; only its title and its data descriptor (paper/pvc-10.data-
# description.txt) were read, to know which experiments it is meant to hold.
#
# Text read: the version of record, as text extracted from the PDF under paper/ (main text,
# figure legends, Experimental Procedures) with the Supplemental Information (legends of
# Supplementary Figures 1 to 6) in the same file. The extraction prints micrometres as "mm",
# Greek lambda as "l" and minus signs as a replacement character; quotes copy the text as
# extracted. Equations in the Methods are garbled in the text; they were read in context.
#
# Code: the paper links no code. The Methods say images were analysed with custom MATLAB
# software, and cite CircStat (Berens, 2009) for the circular-linear correlation.
#
# Data the paper used. Six PV-Cre;Ai14 mice (P40-P60, urethane and chlorprothixene anaesthesia)
# with PV+ interneurons labelled by tdTomato, and two wild-type mice infected with
# rAAV CaMKIIa-nls-tdTomato (excitatory neurons labelled). V1 binocular zone bulk loaded with
# OGB-1; two-photon imaging at 30 Hz of a 300 um wide field (256 by 455 pixels), 6 to 15 focal
# planes 20 to 25 um apart, 150 to 460 um below the pia, green (OGB-1) and red (tdTomato)
# channels. Cells co-labelled with tdTomato are PV+ (or CaMKIIa+), OGB-1 only cells are PV-.
# Stimuli: dichoptic square-wave drifting gratings of one orientation (90 or 270 degrees) and
# spatial frequency (0.02 or 0.03 cpd) per experiment, 1.5 to 2 s, 3 s blank after each; eight
# binocular phase differences (0 to 315 degrees in 45 degree steps), monocular contralateral and
# ipsilateral stimulation, and blank (mean luminance) trials, pseudorandom, 6 to 7 repeats per
# focal plane. Measured variables per cell: dF/F time courses, mean dF/F per condition, ODI,
# monocularity index (MI = |ODI|), DSI, disparity (phase) preference, and the cell's 3D position.
# Separate histology (anti-PV immunostaining in 3 mice) gives the co-localization numbers. The
# data descriptor says the data set holds 6 animals (folders mouse5 to mouse10) from PV-Cre
# mice; whether it holds the CaMKIIa animals or neuropil patches is the author's to find.
#
# Method shared by all claims, from the Experimental Procedures (Data Imaging Analysis).
# dF/F = (Ft - Fo)/Fo, Fo the gray-screen fluorescence immediately before the stimulus; each
# condition's response is the mean dF/F in a 0.5 s window centred on the global average peak,
# found by averaging the responses to all conditions and trials. A cell is visually responsive
# when at least one monocular and one binocular stimulus give (mean stimulus - mean blank) /
# (SE stimulus + SE blank) >= 1, and those responses exceed neuropil activity (above its 95%
# confidence interval). ODI = (Ripsi - Rcontra)/(Rcontra + Ripsi), -1 contralateral only;
# MI = |ODI|; DSI = |sum_f R_f exp(i f)| / sum_f R_f over the eight binocular phases f.
# Disparity preference is the angle of that vector (the Methods take it from the cosine fit's
# phase psi; for eight equally spaced phases the least-squares cosine phase and the vector angle
# coincide). Open details shared by all claims: the length of the window that gives Fo; whether
# the global average peak is found per cell or per plane (per cell is the plain reading); how
# negative responses enter ODI and DSI (as measured, or set to zero); the readings are named
# where a claim depends on them.
#
# Local network analysis (Methods, Local Network Analysis). Within each imaging session (one
# animal's volume across depths), around each visually responsive cell, local populations of
# visually responsive PV- cells are drawn from a sphere of radius 50 um and shells 50-75,
# 75-100, 100-125 and 125-150 um, by 3D distance (x-y converted from pixels to microns, plus
# depth). Individual cells within 50 um of the image edges are not used; a population needs at
# least 3 cells. Population ODI is the average ODI of the population's cells; the population
# disparity vector is (1/n) sum_n DSI_n exp(i psi_n). The relation between individual and
# population ODI is the major-axis slope of a PCA (Sokal and Rohlf), bootstrapped by resampling
# cells with replacement: the "mean slope" is the mean of the bootstrap slopes and its SE their
# standard deviation. Significance compares the true mean slope with slopes from populations
# whose PV- cell positions are shuffled within the session. Disparity uses the circular
# correlation printed in the Methods, corr = (1/N) |sum_n exp(i (psi_n - z_n))|, psi the cell's
# preference and z its population vector angle, minus the same quantity for shuffled positions
# (shuffle-corrected), SE by bootstrap. Spatial length constants come from fitting
# y = a exp(-r/lambda) to the values across radii.
# Open in the local analysis, for every claim that uses it (the readings to run): (1) which axis
# is which in the major-axis slope; the Supplementary Figure 5 and 6 panels label the vertical
# axis "Individual ODI" and the horizontal "Population ODI", so (a) individual on population
# is the main reading and (b) population on individual a variant; (2) which cells enter an ODI
# analysis, (a) cells passing the visual response criterion as written or (b) cells responsive
# to monocular stimuli; (3) whether a cell excluded at one radius for having fewer than 3
# neighbours is dropped at that radius only (a) or from all radii (b); (4) the number of
# bootstrap resamples and shuffles (not fixed; 1000 each is used as a standard choice, at least
# enough to resolve p < 0.01); (5) whether the shuffle p-value is one-sided (fraction of
# shuffled slopes at or above the true one) or two-sided; (6) how the exponential is fitted
# (unweighted least squares on the mean values at the five radii, or weighted by their SE);
# (7) the pixel to micron scale, as the text gives 300 um for a field of 256 by 455 pixels,
# (a) 300 um along each image axis or (b) 300 um along the 455 pixel axis with square pixels;
# (8) for disparity, whether cells with DSI < 0.1 are left out as individuals only (a) or also
# from the populations (b); (9) the circular correlation as printed in the Methods (a) or the
# Batschelet/CircStat circular correlation coefficient the Methods cite (b).
schema_version: 2
paper: doi:10.1016/j.neuron.2015.06.030
claims:
- id: fig1e-pv-tdtomato-colocalization
  statement: tdTomato and endogenous PV co-localize broadly in V1 of PV-Cre;Ai14 mice; 1,274 of
    1,613 PV+ cells expressed tdTomato (79.4% +/- 7.8% SD) and 1,274 of 1,354 tdTomato cells
    expressed PV (94.3% +/- 3.6% SD), in 3 animals.
  source: Results, Binocular Integration in PV+ and PV- cells of Mouse V1 Binocular Zone,
    paragraph 1; Figure 1E
  quote: "Broad co-localization of tdTomato and endogenous PV in V1 was established using post
    hoc immunostaining (1,274 of 1,613 PV+ expressed tdTomato: 79.4% ± 7.8% SD; 1,274 of 1,354
    tdTomato cells expressed PV: 94.3% ± 3.6% SD, n = 3 animals"
  expected:
  - quantity: PV+ cells expressing tdTomato
    value: 79.4
    tolerance: 7.8
    unit: percent
  - quantity: tdTomato cells expressing PV
    value: 94.3
    tolerance: 3.6
    unit: percent
  criterion: Histology (anti-PV immunostaining of fixed sections, four fields of view in V1,
    layers 2 to 5, 3 mice; Experimental Procedures, Immunohistochemical Analysis). Tolerances
    are the paper's SD across animals. The Methods state the two percentages the other way
    round ("Most (94.3%) PV+ neurons expressed tdTomato, whereas ~80% tdTomato neurons were
    PV+"), so the readings are (a) the Results' assignment and (b) the Methods' assignment; the
    claim holds when the two percentages match under either. The data set is described as
    imaging data; if it holds no histology the claim cannot be tested.
