  quote: "we measured the correlation between distance and binocular response similarity,
    finding no relationship (monocularity [MI]: Bootstrapped PCA slope = 0.01, p = 1; disparity:
    circular-linear correlation = 0, p = 1, for cells with DSI > 0.1)"
  statistics:
  - about: MI similarity against distance
    test: Bootstrapped PCA
    statistic: slope = 0.01
    p: 1
  - about: disparity preference difference against distance
    test: circular-linear correlation
    statistic: r = 0
    p: 1
  criterion: A claim of absence, judged at p < 0.05 (the paper reports p = 1 and states no
    threshold for this test; 0.05 is a standard choice). Pairs of visually responsive cells within
    an imaging session, 3D distance in microns. Disparity, from the Methods, the difference in
    disparity preference of each pair against its distance, circular-linear correlation
    (CircStat circ_corrcl), cells with DSI > 0.1; reproduced when p >= 0.05. MI, the Methods
