# Claims for Perich, Gallego & Miller (2018), "A Neural Population Mechanism for Rapid Learning",
# Neuron 100, 964-976, on dandiset 000688.
#
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23, protocol
# pilot-10 as stated in docs/protocol.md.
#
# Text read: the accepted author manuscript in PubMed Central (PMC6250582, NIHMS1507895), as served
# by ncbi_pmc, not the version of record: main text, figure legends 1 to 7 and STAR Methods, with
# its eight supplement files (NIHMS1507895-supplement-1 to -8). Supplements 1 to 7 are the main
# Figures 1 to 7 as images; supplement 8 holds Figures S1 to S7 with their legends. Figure panels
# and the p-values printed inside them (Figures 3E, S5F, S7A, S7D) were read from the PDFs. The
# figure letters of the manuscript do not all agree with the Results: the Results cite Figure 3E,F,G
# and 4E where the legends call the same panels 3E, 3F, 3G and 4D; Figure 6 has two panels "d" in
# its legend (the lag histogram is panel C in the image). Sources below give both where they differ.
#
# Code: the paper links no code. Data and Software Availability says "Custom code was used to
# process the neural and kinematic data ... This code may be shared upon reasonable request", and
# names the MATLAB functions used (cov, pca, factoran, glmfit, mahal). No repository was read. Every
# method below is from the STAR Methods, the legends or the Results.
#
# Dataset: dandiset 000688, "Long-term recordings of motor and premotor cortical spiking activity
# during reaching in monkeys", lists this paper and Glaser et al. 2018 (Nat. Commun.) as
# IsDescribedBy. Whether it holds the curl field and visuomotor rotation sessions this paper
# analyses is the author's to find; the data were not looked at.
#
# Data the paper used, as it reports them:
# - Subjects: two male rhesus macaques, Monkey C (11.7 kg) and Monkey M (10.5 kg), with 96-channel
#   Utah arrays in M1 and PMd (Blackrock Cerebus), spikes sorted offline (Plexon Offline Sorter)
#   over all three epochs of a session together.
# - Task: instructed-delay center-out reaching with a 2-D planar manipulandum, eight targets on a
#   circle of 8 cm (6 cm in Monkey C's first three sessions), 2 cm square targets; hold 0.5 to 1.5
#   s, instructed delay 0.5 to 1.5 s, auditory go cue, 1 s to reach, 0.5 s target hold. Handle
#   position at 1 kHz.
# - Sessions: each has a Baseline epoch, a perturbation epoch and a Washout epoch. Curl field (CF)
#   sessions: 85 degree velocity-dependent field, k = 0.15 N s/cm, CW or CCW; Baseline 170 to 225
#   rewards, Force 201 to 337, Washout 153 to 404. Monkey C three CW and two CCW, Monkey M four
#   CCW (9 sessions). Visuomotor rotation (VR) sessions: 30 degree rotation of the cursor, CW or
#   CCW; Baseline 154 to 217 successful trials, Rotation 219 to 316, Washout 162 to 348. Monkey C
#   two CW and two CCW, Monkey M three CCW (7 sessions). The Methods and Figure 6 legend count 9 CF
#   and 7 VR, 16 sessions in all; the Figure 2C legend shows two CW and five CCW CF sessions and the
#   Figure 7 legend one CW and four CCW VR sessions, which do not add up to these counts.
# - Neurons: 137 to 256 PMd and 55 to 93 M1 per session in Monkey C, 66 to 121 PMd and 26 to 51 M1
#   in Monkey M. Cells with high coincidence across channels excluded. GLM analyses use neurons
#   above 5 Hz trial-averaged rate (918 M1, 2221 PMd pooled over all sessions); the covariance
#   analysis uses neurons above 1 Hz.
# - Measured variables: spike times of sorted units, handle position (and its derivatives), trial
#   events (target onset, go cue, movement onset, reward), the perturbation type and direction,
#   the epoch of each trial.
#
# Shared methods, from the STAR Methods unless said otherwise. Claims cite these as M1 to M8.
# M1 Behavioral error: angular deviation of the hand from the target direction 150 ms after
#    movement onset, minus the mean deviation for that target in Baseline; CW sessions sign-flipped
#    and all sessions pooled (Behavioral adaptation analysis).
# M2 Latent activity: spikes counted in 50 ms bins, square-root transformed, convolved with a
#    non-causal Gaussian kernel of width 100 ms; PCA per area per session, with the PCA axes found on
#    Baseline trials only; 8 components for M1 and 16 for PMd (Dimensionality reduction;
#    Output-potent and output-null subspaces; Results, Models to study ..., paragraph 3).
# M3 Subspaces: a linear map W from the 16 PMd latent dimensions to the 8 M1 latent dimensions
#    (M = W P), fit on Baseline trials; SVD W = U S V'; the rows of V' give the output-potent and
#    output-null axes. PMd latent activity is projected on each to give potent and null activity.
# M4 GLMs: Poisson GLMs with exponential link fit with glmfit (no regularization) on 50 ms bins.
#    Kinematic covariates, in every model: endpoint position, velocity and acceleration,
#    downsampled to 20 Hz, shifted by three bins (150 ms) and convolved with raised cosine bases
#    centered at 0 and 100 ms. Basic model = kinematics only; Full model = kinematics plus neural
#    inputs. Full models: M1-M1 and PMd-PMd (latent activity of the same area recomputed without the
#    predicted neuron), PC-M1 (all PMd latent activity, called PMd-M1 in places), Pot-M1 and Null-M1
#    (PMd potent or null activity predicting M1 neurons), and the single-neuron controls M1sn-M1,
#    PMdsn-PMd, PMdsn-M1. Only neurons above 5 Hz.
# M5 Performance: pseudo-R2 (pR2, Equation 9) and relative pseudo-R2 of Full against Basic (rpR2,
#    Equation 12) from Poisson log-likelihoods; 95% bounds by bootstrap with 1000 resamples.
# M6 Training and testing: models trained on the last 50% of the Force or Rotation epoch, reward
#    trials only, with ten-fold cross-validation; tested on single trials from the start of the
#    same epoch. For Washout (Figures 5, 7F) models are trained on Baseline and tested on Washout.
#    Neurons kept when the Basic pR2 and the rpR2 lower bounds are above zero in all ten folds
#    (Selecting cells with significant GLM predictions).
# M7 Model error: on each test trial the rpR2 minus the rpR2 of a fixed Late block of eight
#    consecutive trials (around 70 trials from the start of the epoch), divided by the
#    cross-validated training rpR2, in percent; zero in Late by construction (Calculating GLM
#    error). Early is the block starting at the first perturbation trial (Figure 3C legend).
# M8 Tests: GLM comparisons at p = 0.01 (Results, Curl field adaptation is not associated ...,
#    paragraph 1); Kolmogorov-Smirnov test on rpR2 values for Figures 3E and S5F; two-sample t-test
#    on the normalized change in rpR2 (model error) for Early against Late; all tests two-sided
#    (Quantification and statistical analysis).
#
# Details none of the sources fixes, with the readings the text allows. Each criterion that uses
# one says so; the notebook runs every reading, and when they disagree the claim is blocked as
# methods_underspecified.
# O1 Early and Late blocks in Force and Rotation. Early begins at the first perturbation trial;
#    its length is not given for these epochs (eight trials in Washout, Figure 5 legend). Late is
#    eight consecutive trials "around 70 trials from the start". Readings: Early = first 8 trials;
#    Late = trials 66 to 73 or trials 70 to 77; trials counted (a) over reward trials only, as
#    for training, or (b) over all trials.
# O2 Washout blocks: Early = first eight Washout trials; Late = "eight trials taken later in
#    Washout", closer in time than in Force, position not given. Readings: Late Washout = trials
#    21 to 28, 31 to 38 or 41 to 48 of Washout.
# O3 The part of each trial used for PCA, the subspaces and the GLMs is not given. Readings: (a)
#    target presentation to target acquisition, as in the covariance analysis; (b) the whole
#    trial, start to end.
# O4 Gaussian kernel "width 100 ms": readings (a) standard deviation 100 ms; (b) full width at half
#    maximum 100 ms. Not expected to change an outcome.
# O5 Unit of the model-error t-test (M7, M8). Late is zero by construction for the block mean, yet
#    Figures 3G, 4D, 5B and 7E show spread in Late. Readings: (a) single-trial model errors of all
#    neurons in the block, pooled across sessions, Early against Late, two-sample t-test; (b) one
#    value per neuron per block (mean over the block's trials), Early against Late, two-sample
#    t-test, with the one-sample t-test of Early against zero shown as a variant.
# O6 Raised cosine bases: widths not given (the paper adapts Pillow et al. 2008, "bases further back
#    in history become wider"). Standard choice: Pillow-form raised cosines with peaks at 0 and
#    100 ms and spacing 100 ms. The 150 ms shift is read as kinematics lagging neural activity
#    (neural activity at time t paired with kinematics at t + 150 ms), as "transmission delays
#    between cortical activity and the motor output" implies.
# O7 Subspace rows. The Methods text says the first N rows of V' are potent and the remaining R - N
#    null, with N = 16 PMd and R = 8 M1 dimensions, which cannot be; the reading is first R = 8 rows
#    potent, last N - R = 8 null (the only one consistent with "equal dimensionality", Results).
#    W is fit by ordinary least squares at zero lag (not stated; standard choice).
# O8 rpR2 bootstrap resampling unit not given. Readings: (a) time bins; (b) trials.
# O9 Dimensionality (Figure 3B). Readings for the threshold: (a) the number of principal components
#    whose variance exceeds the 99th percentile of the matching noise eigenvalue (Results wording);
#    (b) the number of components needed to explain 95% of the variance left after subtracting
#    the noise variance (Methods wording). Data: trial-averaged rates per target in Baseline
#    (the noise is "across targets"), window as O3.
# O10 Movement onset (M1) not defined. Readings: hand speed first crossing (a) 10%, (b) 20% or
#    (c) 30% of the trial's peak speed after the go cue.
