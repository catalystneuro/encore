    is read as the sum of absolute values; the sum of squares is the second reading. Reproduced when
    the mean index over neurons lies between -0.1 and 0.1 and fewer than 1% of neurons have an
    absolute index above 0.9 (the reader's reading of "centered" and "virtually no", recorded as a
    deviation); the shuffled control is shown.
