    tolerance: 222.1
  criterion: Units as sorted in the data, per area and session, for the 9 CF and 7 VR sessions.
    Each per-session count must lie in its monkey's range widened by 10% of each bound. The 5 Hz
    rule is the trial-averaged mean rate over all trials of the session (Methods do not say which
    trials; reading as stated). Reproduced when all ranges and both pooled counts hold; partially
    reproduced when the ranges hold and a pooled count does not.
- id: fig2d-cf-behavioral-adaptation
  statement: On exposure to the curl field the monkeys made large reach direction errors that
    shrank gradually until behavior stabilized, and mirror-image after-effects appeared at the
    start of Washout.
  source: Results, Curl field adaptation involves widespread ..., paragraph 1; Figure 2C and 2D
  quote: Within each session, the monkeys exhibited large errors upon exposure to the CF, which were
    gradually reduced until behavior stabilized ... Further evidence of adaptation was revealed by
    behavioral after-effects (mirror image errors) that occurred upon return to normal reaching
    during the Washout epoch
  criterion: Error as M1 (movement onset per O10), CW sessions sign-flipped. The paper gives no
    test. Per session, the mean error of the Early block, of the Late block (O1 readings) and of
    the first eight Washout trials (Figure 5 legend). Reproduced when, across the 9 CF sessions,
    the Early mean exceeds the Late mean in at least 8 sessions and is greater by a two-sided
    paired t-test at p < 0.05, and the first eight Washout trials have a mean error of opposite
    sign to the Early Force error in at least 8 sessions. The thresholds of 8 of 9 sessions and the
    t-test are the reader's operational reading of "large errors ... gradually reduced" and are
    recorded as a deviation; the session medians are shown.
- id: fig7bc-vr-behavior-similar
  statement: In VR sessions behavioral errors were similar in magnitude and time course to those of
    CF sessions, with large initial errors in Rotation and strong after-effects in Washout.
  source: Results, PMd to M1 mapping is unchanged throughout adaptation to a visuomotor rotation,
    paragraph 2; Figure 7B and 7C
  quote: In many respects, adaptation during the CF and VR sessions was quite similar. Behavioral
    errors were similar in magnitude and time course
  depends_on:
  - fig2d-cf-behavioral-adaptation
  criterion: As fig2d-cf-behavioral-adaptation for the 7 VR sessions (Rotation in place of Force).
    Reproduced when the VR sessions meet the same rule and a two-sided two-sample t-test of
    per-session Early errors, VR against CF, gives p >= 0.05 (no test is given by the paper for
    "similar"; this reading is recorded as a deviation and the medians of both are shown).
- id: figs2-covariance-preserved-example
  statement: In a representative CF session, the pairwise covariance of neurons in the Force and
    Washout blocks correlated with Baseline values at r of at least 0.85 in M1 and at least 0.93 in
    PMd.
  source: Results, Models to study adaptation-related changes ..., paragraph 2; Figure S2E
  quote: representative session ... Pearson's correlation with Baseline values r ≥ 0.85 for M1
    and r ≥ 0.93 for PMd
  expected:
  - quantity: minimum r with Baseline over blocks, M1, representative session
    value: 0.85
    tolerance: 0.085
  - quantity: minimum r with Baseline over blocks, PMd, representative session
    value: 0.93
    tolerance: 0.093
  criterion: Method from STAR Methods, Single neuron covariance. Neurons above 1 Hz; spikes in 10 ms
    bins from target presentation to target acquisition; five blocks (Baseline split in two, Force
    split in two, Washout); in each block trials averaged per target; covariance between all pairs
    of neurons; Pearson r between each block's covariances and the Baseline covariances (Figure S2D
    legend, the two Baseline halves compared with each other and the Force and Washout blocks with
    the full Baseline). The representative session is the Monkey C session of Figures S2 and S6A,
    which the paper does not name; every CF session is computed. Open (deviation) whether the
    diagonal (variances) enters the correlation; both are run. Open (deviation) which neurons the
    r values pool, since the Results call them a representative session and the Figure S2E legend
    says "all combinations of neurons recorded in each of the nine CF sessions"; readings (a) one
    session at a time, (b) the pairs of all nine CF sessions pooled into one correlation per block.
    Reproduced when, under reading (a), at least one CF session has all its block r values at or
    above 0.85 - 0.085 in M1 and 0.93 - 0.093 in PMd, or, under reading (b), the pooled block r
    values meet the same bounds.
- id: figs3a-covariance-like-baseline-split
  statement: Across all CF sessions the similarity of the covariance between Baseline and the Force
    and Washout blocks resembled that between random subsamples of Baseline, so the covariance
    structure did not change with adaptation.
  source: Results, Models to study adaptation-related changes ..., paragraph 2; Figure S3A
  quote: Across all sessions, the differences in covariance strongly resembled those obtained from
    random subsamples of Baseline data for which the covariance structure should be unchanged
  depends_on:
  - figs2-covariance-preserved-example
  criterion: Covariance as figs2-covariance-preserved-example; the reference distribution from
    random subsamples of Baseline trials, compared with each other, 100 times per session (STAR
    Methods, Single neuron covariance; the subsample size is not given, read as two random halves
    of Baseline compared with each other, as in Figure S2D). The paper gives no test. Reading recorded as a deviation; reproduced when, in each
    area, the median over sessions of the Force 1, Force 2 and Washout r values lies inside the
    range of the pooled Baseline-split r values, and partially reproduced when that holds for one
    area only. The distributions are shown.
- id: figs3b-covariance-preserved-vr
  statement: In VR sessions as well, the changes in neural activity preserved the population
    covariance structure.
  source: Results, PMd to M1 mapping is unchanged throughout adaptation to a visuomotor rotation,
    paragraph 2; Figure S3B (the Results cite it as Figure S2B, which shows CF example neurons; the
    VR covariance summary is Figure S3B)
  quote: Additionally, changes in neural activity preserved the population covariance structure
  depends_on:
  - figs3a-covariance-like-baseline-split
  criterion: As figs3a-covariance-like-baseline-split for the 7 VR sessions (Rotation blocks in
    place of Force).
- id: fig3b-pmd-higher-dimensional
  statement: In every session the PMd manifold had more dimensions than the M1 manifold (median 14
    against 8.5).
  source: Results, Models to study adaptation-related changes ..., paragraph 3; Figure 3B
  quote: In all sessions, the PMd manifold contained more dimensions than did the M1 manifold ...
    M1 median, 8.5; PMd median, 14
  expected:
  - quantity: median M1 dimensionality across sessions
    value: 8.5
    tolerance: 0.85
  - quantity: median PMd dimensionality across sessions
    value: 14
    tolerance: 1.4
  criterion: Dimensionality by the method adapted from Machens et al. 2010 (STAR Methods,
    Dimensionality reduction, paragraph 2) on rates as M2; noise from differences between random
    pairs of trials to the same target, 1000 repetitions, 99% limit of each noise eigenvalue;
    threshold rule and data as O9, window as O3. Over all 16 sessions (Figure 3B legend, "all
    sessions from both monkeys"). Reproduced when, under one reading, PMd exceeds M1 in every
    session and both medians are within tolerance; partially reproduced when PMd exceeds M1 in
