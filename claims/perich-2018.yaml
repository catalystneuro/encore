- id: figs4d-dimensionality-robust-to-size
  statement: With random subsamples of equal, fixed numbers of neurons, estimated dimensionality
    fell for small samples but PMd stayed higher-dimensional than M1 for every neuron count tested.
  source: Figure S4D legend; STAR Methods, Dimensionality reduction, paragraph 2
  quote: With decreasing neuron counts, we began to underestimate the apparent dimensionality.
    However, critically, PMd (red) was consistently higher dimensional than M1 (black) for all
    tested neuron counts
  depends_on:
  - fig3b-pmd-higher-dimensional
  criterion: As fig3b-pmd-higher-dimensional, on random subsamples of 40, 50, 60 and 70 neurons per
    area and all neurons (the counts on the Figure S4D axis), mean over sessions. Number of
    subsamples per size not given; standard choice of 100 (cannot change the sign of the
    comparison in expectation). Sessions with fewer neurons than a size are left out of that size
    (open; deviation). Reproduced when the PMd mean exceeds the M1 mean at every size.
- id: figs4c-null-potent-index-centered
  statement: Single neurons contributed to both output-potent and output-null subspaces; the
    null/potent index was centered on zero with virtually no neurons near -1 or 1.
  source: Figure S4C legend; STAR Methods, Output-potent and output-null subspaces, paragraph 3
  quote: The distribution of neurons was centered around zero and virtually no neurons had a
    null/potent index close to -1 / 1, indicating that the output-potent and output-null subspaces
    captured population-wide features
  criterion: Index per PMd neuron from the product of the PCA loading matrix and V (M2, M3, O7) as
