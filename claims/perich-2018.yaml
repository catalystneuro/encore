  quote: Across all sessions, we isolated between 137 - 256 PMd and 55 - 93 M1 neurons for Monkey
    C, and 66 - 121 PMd and 26 - 51 M1 neurons for Monkey M ... Pooled across all monkeys and CF and
    VR sessions, this gave a population of 918 M1 and 2221 PMd neurons
  expected:
