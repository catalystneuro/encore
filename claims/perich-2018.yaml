- id: figs7e-dimensionality-range
  statement: The Null-M1 failure and Pot-M1 generalization held for M1 dimensionalities from 7 to
    20 (PMd twice that); Null-M1 was significant at all tested values except 9, Pot-M1 at none.
  source: Figure S7E; STAR Methods, Controls for the output-potent and output-null subspaces;
    Results, Output-potent activity in PMd consistently predicts M1 neurons ..., paragraph 3
  quote: Our primary effect that Pot-M1, and not Null-M1, generalizes to early CF trials held for a
    wide range of dimensionalities
  statistics:
  - test: two-sample t-test
    p: 0.01
    p_relation: "<"
  depends_on:
  - fig4d-null-m1-fails-early
  criterion: As fig4d-null-m1-fails-early with M1 dimensionality 7, 8, 9, 10, 11, 12, 15 and 20
    and PMd twice that (the values on the Figure S7E axis; the Methods say 5 to 20). Reproduced when
    Null-M1 is significant at p = 0.01 for at least six of the eight values and Pot-M1 for none;
    partially reproduced when Null-M1 is significant for at least four (the figure shows seven of
    eight; the thresholds are the reader's reading of "a wide range", a deviation).
- id: figs7f-factor-analysis
  statement: The main result held with Factor Analysis in place of PCA; in CF only Null-M1 and PC-M1
    had larger Early error, and in VR no model did.
  source: Figure S7F; Results, Output-potent activity in PMd consistently predicts M1 neurons ...,
    paragraph 3
  quote: We thus replicated these main results using Factor Analysis, another common method for
    dimensionality reduction of neural data, instead of PCA
  depends_on:
  - fig4d-null-m1-fails-early
  criterion: As fig4d-null-m1-fails-early and fig7de-vr-all-generalize, with latent activity from
    Factor Analysis (factoran, 8 M1 and 16 PMd factors; STAR Methods, Dimensionality reduction)
    in place of PCA. Reproduced when in CF Null-M1 and PC-M1 are significant at p = 0.01 and
    M1-M1, PMd-PMd and Pot-M1 are not, and in VR none is.
- id: figs7cd-single-neuron-models
  statement: With single-neuron spiking as inputs, M1sn-M1 and PMdsn-PMd generalized well through
    CF adaptation while PMdsn-M1 did not, in each monkey; in Washout, PMdsn-M1 alone showed
    de-adaptation in CF (p = 0.00), and no model changed in VR.
  source: Figure S7C and S7D; Results, Output-potent activity in PMd consistently predicts M1
    neurons ..., paragraph 3
  quote: Indeed, the local models ( M1sn -M1, PMdsn PMd) generalized well throughout adaptation,
    while the between area model ( PMdsn -M1) did not
  statistics:
  - about: Washout CF, M1sn-M1
    p: 0.25
  - about: Washout CF, PMdsn-PMd
    p: 0.15
  - about: Washout CF, PMdsn-M1
    p: 0
  - about: Washout VR, M1sn-M1
    p: 0.07
  - about: Washout VR, PMdsn-PMd
    p: 0.64
  - about: Washout VR, PMdsn-M1
    p: 0.6
  depends_on:
  - fig4d-null-m1-fails-early
  - fig5-washout-null-m1
  criterion: Models as M4 with all other single neurons of the area as inputs (M1sn-M1, PMdsn-PMd)
    or all PMd neurons (PMdsn-M1). The kinematic covariates are open. The STAR Methods (Covariate
    inputs to the GLMs) say "For Figure S7C, D, we performed a control in which we repeated the GLM
    models for the CF task using only the velocity inputs", while the S7C and S7D legends describe
    single-neuron inputs only; readings (a) position, velocity and acceleration as M4, (b) velocity
    only. Force as fig4d-null-m1-fails-early per monkey, Washout as
    fig5-washout-null-m1. Reproduced when PMdsn-M1 alone is significant at p = 0.01 in Force in
    both monkeys and in CF Washout, and no model is in VR Washout; partially reproduced when the
    Force result holds and the Washout result does not.
- id: fig5-washout-null-m1
  statement: Models trained on Baseline predicted the first eight Washout trials worse than later
    Washout trials for Null-M1 only; Pot-M1 predicted both blocks well.
  source: Figure 5B; Results, Output-potent activity in PMd consistently predicts M1 neurons ...,
    paragraph 4
  quote: We found that Null -M1 generalized poorly in the earliest trials, then rapidly improved
    with de-adaptation as output-null activity began to return to Baseline. There was no such effect
    for the Pot -M1 model, which accurately predicted both early and late Washout trials
  statistics:
  - about: Null-M1, Early against Late Washout model error
    test: two-sample t-test
    p: 0.01
    p_relation: "<"
  criterion: Models trained on Baseline trials (M6), tested on Washout; model error as M7 with the
    Washout blocks of O2; cells selected as M6 on the Baseline training data. Which Baseline trials
    train the models is not given (STAR Methods, Training the GLMs, says only "trained the GLMs
    using Baseline data"); readings (a) all Baseline reward trials, (b) the last 50% of Baseline
    reward trials, as for Force. Two-sided two-sample
    t-test at p = 0.01, O5 readings. Reproduced when Null-M1 Early error is significantly larger
    and Pot-M1 does not differ, under every reading.
- id: fig6c-null-leads-potent
  statement: In Baseline, output-null activity preceded output-potent activity by 35 ms on average
    across the 16 sessions, a lag significantly below zero (t-test, p = 0.02), and output-null also
    led at the end of Force.
  source: Figure 6B and 6C (legend's first "d"); Results, Evolving changes in PMd output-null
    planning activity ..., paragraph 1
  quote: Output-null activity preceded output-potent by 35 ms on average, and the distribution was
    significantly negative (t-test; p = 0.02)
  statistics:
  - test: t-test
    p: 0.02
    n: 16 CF and VR sessions
  expected:
  - quantity: mean lag of output-potent relative to output-null, Baseline
    value: -35
    tolerance: 3.5
    unit: ms
  criterion: Method from STAR Methods, Calculating the lag. Baseline trials, a 700 ms window
    after target presentation, potent and null activity (M3, O7) shifted relative to each other
    by -350 to 350 ms in 10 ms steps, CCA at each lag, the lag of maximum first canonical
    correlation per session. Open (deviations) - the time resolution (readings (a) latent activity
    from 10 ms bins, smoothed as M2; (b) 50 ms latent activity interpolated to 10 ms) and trials
    concatenated within a session. The t-test is read as one-sample against zero, two-sided.
    Reproduced when, under one reading, the mean lag is negative with p < 0.05 and within 3.5 ms
    of -35 ms and the mean end-of-Force lag over the 9 CF sessions (same method on a block of
    trials from the end of Force, STAR Methods) is also negative; partially reproduced when the
    Baseline lag is significantly negative and either it is outside tolerance or the end-of-Force
    mean lag is not negative. The paper gives no test for the end-of-Force lags.
- id: fig6e-planning-change-in-null
  statement: Changes in preparatory (planning) activity from Baseline were largely confined to the
    output-null subspace and grew significantly from Early to Late Force; in the movement window,
    M1 activity changed significantly more in Late Force.
  source: Figure 6D and 6E; Results, Evolving changes in PMd output-null planning activity ...,
    paragraph 2
  quote: Changes in preparatory activity were largely confined to the output-null subspace.
    Furthermore, the amount of this altered preparatory activity increased significantly between
    Early and Late adaptation
  statistics:
  - about: Null subspace, planning window, Early against Late Force
    p: 0.05
    p_relation: "<"
  - about: M1, movement window, Early against Late Force (asterisk on the M1 bars of Figure 6E)
    p: 0.05
    p_relation: "<"
  criterion: Method from STAR Methods, Quantifying changes in neural state space activity. Trials
    aligned on go cue, latent activity in 20 ms bins for M1 (8 dimensions) and PMd potent and null
    subspaces; at each time point the Mahalanobis distance (MATLAB mahal) of each Force trial from
    all Baseline reaches to the same target; normalized by subtracting the value at a reference
    point and dividing by the maximum over the adaptation period. Open (deviations) - the reference
    point (readings the first bin of the window, 0.5 s before go cue, or the go cue); the planning
    and movement windows, not given in the text (read from the bars of Figure 6D, about -0.15 to
    0 s and 0.25 to 0.40 s from go cue, on an axis from -0.5 to 0.8 s); the blocks, labeled Force 1 and Force 4 in the panel
    (read as the first and last quarter of Force; the O1 Early and Late blocks as the second
    reading); the test, not named (two-sided two-sample t-test over trials, session values as a
    second reading). Reproduced when, under every reading, the null planning change is larger in
    Force 4 at p < 0.05 and exceeds the potent and M1 planning changes in Force 4, and the M1
    movement-window change is larger in Force 4 at p < 0.05; partially reproduced when the null
    planning result holds and the M1 movement result does not.
- id: fig7de-vr-all-generalize
  statement: During VR adaptation all four GLM models, including Null-M1, generalized to Early and
    Late Rotation trials, with no significant change in model error.
  source: Figure 7D and 7E; Results, PMd to M1 mapping is unchanged ..., paragraph 2
  quote: However, all GLM models, including Null -M1, accurately generalized throughout Rotation
  statistics:
  - test: two-sample t-test
    p: 0.01
    p_relation: ">"
    n: seven VR sessions
  criterion: As fig3g-local-models-generalize and fig4d-null-m1-fails-early for the seven VR
    sessions (Rotation epoch), M1-M1, PMd-PMd, Pot-M1 and Null-M1. A claim of absence, judged on
    the paper's test (two-sided two-sample t-test at p = 0.01); reproduced when no model differs
    between Early and Late, not reproduced when any does.
- id: fig7f-vr-washout-unchanged
  statement: In VR Washout neither Pot-M1 nor Null-M1 showed a change in performance during
    de-adaptation, despite behavioral after-effects.
  source: Figure 7F; Results, PMd to M1 mapping is unchanged ..., paragraph 2
  quote: Furthermore, we did not see any effect of de-adaptation in the neural predictions during
    Washout, despite the presence of behavioral after-effects
  depends_on:
  - fig5-washout-null-m1
  criterion: As fig5-washout-null-m1 for the seven VR sessions. A claim of absence; reproduced when
    neither model differs at p = 0.01, not reproduced when either does.
- id: cf-vr-dissociation
  statement: The Null-M1 failure to generalize is specific to CF adaptation; it is absent in VR
    adaptation of similar behavioral magnitude, so it is not a necessary consequence of changing
    behavior.
  source: Results, PMd to M1 mapping is unchanged ..., paragraph 2; Discussion, Visuomotor rotation
    and curl field likely employ distinct adaptive processes
  quote: This result highlights a fundamental difference in the neural adaptation to these two
    perturbations
  depends_on:
  - fig4d-null-m1-fails-early
  - fig5-washout-null-m1
  - fig7de-vr-all-generalize
  - fig7f-vr-washout-unchanged
  - fig7bc-vr-behavior-similar
  criterion: Reproduced when fig4d-null-m1-fails-early and fig7de-vr-all-generalize are both
    reproduced; partially reproduced when they are and fig7bc-vr-behavior-similar is not.
