    tolerance: 25.6
  - quantity: M1 neurons per session, Monkey C, range 55 to 93 (lower bound)
    value: 55
    tolerance: 5.5
  - quantity: M1 neurons per session, Monkey C, range 55 to 93 (upper bound)
