    the curves by eye. Reading recorded as a deviation; reproduced when the Pearson correlation
    across Force trials between the smoothed behavioral error and the Null-M1 curve is positive
    and larger than that for Pot-M1, and partially reproduced when only the first holds.
- id: figs6-pc-m1-fails
  statement: PC-M1, with all PMd latent activity as input, also failed to generalize during CF
