  statistics:
  - about: CF, M1-M1
    p: 0.13
  - about: CF, PMd-PMd
    p: 0.44
  - about: CF, Pot-M1
    p: 0.54
  - about: CF, Null-M1
    p: 0.01
  - about: CF, PC-M1
    p: 0
  - about: VR, M1-M1
