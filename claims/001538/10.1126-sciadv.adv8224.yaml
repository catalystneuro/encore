# Claims for Zhai, Cui, Wokosin, Sun, Tkatch, Crittenden, Graybiel & Surmeier (2025) on dandiset 001538.
# Source: the full text of the version of record in PubMed Central (PMC12674127, CC BY), read from
# its Results, figure legends and Materials and Methods.
#
# What the author had seen when these criteria were written. The data check: the file list and
# metadata of every NWB file; for every patch-clamp file the cell and condition counts, the spike
# counts per current step and each cell's rheobase, and per group the median rheobase; the
# dendritic excitability index per cell and its group medians; the Sr2+-oEPSC events found by the
# detector in lid.py and their per-cell counts and mean amplitudes; the GRAB-ACh areas per mouse;
# the AIM tables. Also the paper's per-cell tables (Zenodo doi:10.5281/zenodo.17307059), and that
# most dandiset cells match a row of them exactly. No statistical test of any claim had been run.
#
# The paper's statistics (Methods) are two-sided Mann-Whitney tests for unpaired and Wilcoxon tests
# for paired data at P < 0.05, unless stated otherwise; the criteria use these. Where the dandiset
# holds so few units that the paper's test cannot reach P < 0.05 whatever the data (the smallest
# attainable two-sided P is 0.057 for 3 against 4, 0.10 for 3 against 3, 0.25 for 3 pairs and
# 0.0625 for 5 pairs), the claim is blocked with `other`, and the numbers are shown under the link
# claim for that data. Groups are formed from the file's condition_subfolder column, not from the
# session name, because files named for a drug also hold baseline cells.
#
# Method choices fixed here where the paper leaves them open. Rheobase and spike counts as in the
# paper's script (upward crossings of 0 mV over the sweep; first positive step with a spike). The
# F-I comparison uses the per-cell sum of spike counts from 20 to 300 pA. The dendritic index uses
# the script's backgrounds (55 red, 161 green), keeps pairs with a basal ratio between 0.5 and 2,
# pairs proximal and distal sites by their number, and averages pairs within a cell. GRAB-ACh uses
# the single-pulse trials and the trial table's stimulus time.
# Quotes and statistics added 2026-10-19 from the full text (Europe PMC PMC12674127).
schema_version: 1
dandiset: "001538"
paper: doi:10.1126/sciadv.adv8224
claims:
- id: link-somatic-cells
  statement: The dandiset's somatic current-step recordings are those behind the paper's somatic
    excitability figures, and the spike counts computed from them agree with the paper's per-cell
    tables.
  source: Figures 1E, 3C, 6C, 7C and 9D; the paper's tables at Zenodo doi:10.5281/zenodo.17307059
  data: with_inputs
  criterion: Groups are matched by name. Each dandiset cell is compared with every row of the
    paper's table for its group over the steps from 20 to 300 pA present in both, and its best
    match is the row with the smallest summed absolute difference in spike counts. The link holds
    (reproduced) when, over all groups the dandiset holds, the cell counts per group equal the
    paper's n, and at least 80% of cells have an exact match and at least 95% a best match
    within 3 spikes in total. Partially reproduced when at least 50% match exactly; not reproduced
    otherwise. Rheobase agreement with the best match is reported.
- id: link-dendritic-cells
  statement: The dandiset's dendritic line scans are those behind the paper's dendritic
    excitability index figures, and the index computed from them agrees with the paper's per-cell
    values.
  source: Figures 1I, 3F, 6D and 7F; the paper's tables at Zenodo doi:10.5281/zenodo.17307059
  data: with_inputs
  criterion: Where the paper's table names cells by date and letter (Figure 6D), cells are matched
    by that identifier (letter a, b, c for the first, second and third cell of the day). Elsewhere
    the paper's rows are taken to follow the dandiset's order by date and cell number, an
    assumption checked by the somatic link, where rows follow that order. Reproduced when the
    counts of cells with an index equal the paper's n in at least 7 of the 10 groups and the
    matched values differ from the paper's by a median of at most 10% of the paper's value.
    Partially reproduced when only one of these holds.
- id: link-sr-cells
  statement: The dandiset's Sr2+-oEPSC recordings are cells of the paper's Figures 2 and 4, and
    their events agree with the paper's per-cell values.
  source: Figures 2G to 2I and 4F to 4H; the paper's tables at Zenodo doi:10.5281/zenodo.17307059
  data: with_inputs
  criterion: Cells are matched by date and session letter (the paper's identifiers are the date
    followed by a letter). Reports the fraction of the paper's cells that are in the dandiset and,
    for those, the events found by lid.detect_events against the paper's event counts and mean
    amplitudes. Reproduced when every dandiset cell matches a paper identifier and the per-cell
    mean amplitude and event count are within 25% of the paper's for at least 75% of cells;
    partially reproduced when every cell matches but the values do not; not reproduced when cells
    do not match.
- id: link-grab-rois
  statement: The dandiset's GRAB-ACh recordings are regions of the paper's Figure 5F, and the
    normalised areas computed from them agree with the paper's per-region values.
  source: Figure 5F; the paper's tables at Zenodo doi:10.5281/zenodo.17307059
  data: with_inputs
  criterion: The paper's regions carry no identifier that links them to the dandiset's mice, so
    each mouse's vector of single-pulse areas (no drug, quinpirole, sulpiride, and dopamine where
    present) is matched to the paper's region in the same group with the smallest summed absolute
    difference. Reproduced when the counts per group are those of the paper and every mouse has a
    match within 0.05 per treatment; partially reproduced when the dandiset holds part of the
    regions and at least half of its mice match within 0.05 per treatment; not reproduced
    otherwise.
- id: link-aim-mice
  statement: The dandiset's AIM score tables are mice of the paper's Figures 8 and 10, with
    genotypes and scores that agree with the paper's tables.
  source: Figures 8B, 8C and 10B; the paper's tables at Zenodo doi:10.5281/zenodo.17307059
  data: with_labels
  criterion: Mice are matched by their numeric identifier. The paper's total AIM score per
    session is taken to be the sum over the session's time points of the three scores. Reproduced
    when every dandiset mouse matches a paper mouse and every matched session total is equal;
    partially reproduced when the matched mice agree but some dandiset mice are not in the paper or
    the dandiset's genotype labels disagree with the paper's; not reproduced when matched values
    differ.
- id: fig1f-dspn-rheobase-on-lower
  statement: In dSPNs the rheobase is lower in the LID on-state than in the off-state.
  source: Figure 1F; Results, Intrinsic excitability and synaptic connectivity of dSPNs increased in
    the on-state of LID, paragraph 2 (P < 0.0001, Mann-Whitney)
  quote: in on-state dSPNs, the current needed to evoke a spike (rheobase) was significantly smaller
    than that in the off-state
  statistics:
  - test: Mann-Whitney
    p: 0.0001
    p_relation: "<"
  criterion: Two-sided Mann-Whitney test of per-cell rheobase, on-state against off-state.
    Reproduced when P < 0.05 and the on-state median is lower.
- id: fig1e-dspn-fi-on-higher
  statement: In on-state dSPNs suprathreshold current steps evoke more spikes than in off-state
    dSPNs across a range of intensities.
  source: Figure 1E; Results, Intrinsic excitability and synaptic connectivity of dSPNs increased in
    the on-state of LID, paragraph 2
  quote: the number of spikes evoked by suprathreshold current steps was greater across a range of
    intensities
  criterion: Per cell, the sum of spike counts from 20 to 300 pA (over the steps present).
    Reproduced when a two-sided Mann-Whitney test gives P < 0.05 with the on-state higher; the
    per-step medians are reported.
- id: fig1f-dspn-sch-no-change
  statement: Bath application of the D1R antagonist SCH 23390 does not reverse the lower rheobase
    of on-state dSPNs.
  source: Figure 1F; Results, Intrinsic excitability and synaptic connectivity of dSPNs increased in
    the on-state of LID, paragraph 2 (P = 0.589, Mann-Whitney)
  quote: bath application of the D1R antagonist SCH 23390 (3 μM) did not reverse the leftward shift
