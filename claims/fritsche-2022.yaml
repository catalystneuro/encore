- id: fig1e-consistent-across-mice
  statement: The 1-back response reduction is consistent across mice, in thalamus and in cortex.
  source: Figure 1E; Results, Orientation-specific adaptation in visual cortex and thalamus,
    paragraph 1
  quote: The orientation-specific response reductions for immediate stimulus repetition were highly
    consistent across mice (Fig. 1E).
  depends_on:
