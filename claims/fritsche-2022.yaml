# Claims for Fritsche, Solomon & de Lange (2022), "Brief Stimuli Cast a Persistent Long-Term Trace
# in Visual Cortex", J Neurosci 42(10):1999-2010, doi:10.1523/JNEUROSCI.1350-21.2021, on dandiset
# 000021 (Allen Institute, Visual Coding, Neuropixels, Brain Observatory 1.1 Stimulus Set), which the
# paper reuses.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-21,
# protocol as stated in docs/protocol.md (pilot-18).
#
# Text read. The version of record, full text from PubMed Central (PMC8916757), in
# paper/10.1523-jneurosci.1350-21.2021.txt: abstract, Introduction, Materials and Methods, Results,
# Discussion, the legends of Figures 1 to 8 and Tables 1 and 2. The paper has no supplement. The
# extracted text drops the display equations; these were read from the MathML of the same PMC page
# (pmc.ncbi.nlm.nih.gov/articles/PMC8916757). They are (1) adaptation ratio = fr_repeat /
# fr_orthogonal; (2) the double exponential, printed as r(n) = 1 - a_fast * exp(-(n-1)/tau_fast) +
# a_slow * exp(-(n-1)/tau_slow); (3) the single exponential r(n) = 1 - a * exp(-(n-1)/tau); (4) OSI =
# (fr_preferred - fr_non-preferred) / (fr_preferred + fr_non-preferred); (5) the cumulative ratio of
# Fig. 4, ar_2-8 = product over n = 2 to 8 of ar_n. Figures were not opened (there is no PDF under
# paper/); no number below is read from a figure.
#
# Code. The paper links its analysis code at the Donders Repository, doi:10.34973/kpt9-y956
# (collection DSC_3018000.01_830, version 1). Its file list can be read without a login. It holds
# download_sessions.py, drifting_grating_analysis_scripts/ (a1 to f3, Python, R and MATLAB: time
# course, tuning and its ANOVA, n-back adaptation, exponential decay fits and their F tests, mouse
# scatterplots, the artificial neuron simulation, cumulative adaptation, the blank baseline),
# static_grating_analysis_scripts/ (a1 to c2, the same steps), models/ and processed_data/. Only
# README.txt could be fetched; every script returned HTTP 401 (restricted access under a data use
# agreement). The code was therefore not read, and no criterion below rests on it. Details the
# Methods leave open are named as open, with the readings the text allows.
#
# Data the paper describes. The Allen Brain Observatory Visual Coding Neuropixels data (Siegle et
# al., 2021), Brain Observatory 1.1 subset: 32 mice (16 C57BL/6J wild type, 6 Sst-IRES-Cre x Ai32,
# 5 Pvalb-IRES-Cre x Ai32, 5 Vip-IRES-Cre x Ai32, either sex), all analysed regardless of line,
# awake and passively viewing. The paper names DANDI 000021 as holding the NWB files. Stimuli used.
# (a) Full-field drifting gratings, 2 s on, 1 s gray between; 0.04 cycles/degree, 80% contrast, 8
# directions (0 to 315 degrees in 45 degree steps) and 5 temporal frequencies (1, 2, 4, 8, 15 Hz),
# 15 repeats each, 600 presentations in three blocks, in random order with 30 interleaved blank
# (gray) trials. Orientation is direction modulo 180; repeat means the same orientation (either
# direction), orthogonal means 90 degrees apart; temporal frequency is ignored. (b) Static gratings,
# 0.25 s each, back to back without gray; 6 orientations (0 to 150 degrees in 30 degree steps), 5
# spatial frequencies (0.02 to 0.32 cycles/degree), 4 phases, about 50 repeats each, 6000
# presentations in three blocks, blank sweeps about once every 25 gratings. Units. Spike-sorted
# units with their area; kept when ISI violations <= 0.5, amplitude cutoff <= 0.1 and presence
# ratio >= 0.9 (the AllenSDK defaults). Visually responsive units, separately per stimulus set, have
# a mean rate to their preferred orientation above 5 Hz and above 1 SD of the rate in gray-screen
# presentations, over 0 to 100 ms from onset (drifting) or 0 to 250 ms (static). Regions with at
# least 50 responsive units are kept. For drifting gratings these are V1, LM, AL, RL, PM, AM
# (cortex) and LGN (dorsolateral geniculate), LP (thalamus), 2365 responsive units in all (V1 562,
# LGN 140, LP 90). For static gratings V1 has 530, LGN 60, LP 16; LP is dropped from the decay
# analysis. Measure. The firing rate in 0 to 100 ms after onset (drifting) or 0 to 250 ms
# (static); the adaptation ratio per unit is the rate when the n-back grating had the same
# orientation as the current one over the rate when it was orthogonal, for n = 1 to 50.
#
# Details the paper leaves open, named in the criteria that use them.
# O1 Ratio per unit. (a) The mean rate over all repeat trials over the mean over all orthogonal
#   trials, pooling current orientations; (b) the ratio per current orientation, averaged (or
#   geometric-mean averaged) over orientations.
# O2 Region value. The paper tests log ratios against zero, so the region's ratio is (a) the
#   exponent of the mean over units of the log ratio; or (b) the mean over units of the ratio.
# O3 n-back position. (a) Blank trials hold a position in the sequence (supported by the blank
#   baseline analysis, which uses "n-back blank trial" at "the same n-back position"), and pairs
#   whose n-back trial is a blank are left out of repeat and orthogonal; (b) blanks are removed
#   from the sequence first. Independently, (c) pairs are formed within each of the three blocks,
#   or (d) across the whole concatenated sequence.
# O4 Visual responsiveness. "Larger than 1 SD of the firing rate during the first 100 ms of gray
#   screen presentations" is read as (a) above the gray mean plus 1 SD, or (b) above 1 SD itself;
#   the gray presentations are (c) the blank trials of the same stimulus set, or (d) the session's
#   spontaneous gray-screen epoch. The preferred orientation, "eliciting the highest firing rate",
#   is (e) the orientation whose trials, pooled over both directions and all temporal
#   frequencies, give the highest mean rate, or (f) the orientation of the single direction and
#   temporal frequency condition with the highest mean rate; the Methods do not say which.
# O5 Exponential fit. Least squares on log ratios against the log of the model, over n = 1 to 50
#   (Methods), with bounds a_fast, a_slow <= 0.5 and tau in [-50, 50]. The data fitted are (a) the
#   region's mean log ratio at each n, or (b) every unit's log ratio at each n. The double
#   exponential's second term is printed with a plus sign; readings (a) both terms reduce the
#   response, r(n) = 1 - a_fast exp(-(n-1)/tau_fast) - a_slow exp(-(n-1)/tau_slow), which Tables 1
#   and 2 support by giving both amplitudes as "%-response reduction"; (b) as printed. The F test
#   compares the nested fits with the residual sums of squares and degrees of freedom of the data
#   fitted under (a) or (b). The bootstrap resamples units with replacement 1000 times, drops fits
#   on a bound, and takes the 2.5 and 97.5 percentiles.
# O6 Correction. Where "corrected for multiple comparisons" names no method, the paper's stated
#   method, Benjamini-Hochberg FDR at 0.05, is used; Bonferroni is a variant.
#
# A value with a bootstrapped 95% CI matches when it falls inside that CI; the tolerances given
# under expected are the larger distance from the value to a CI bound, so they never reject a value
# the CI accepts, and the CI decides where the two differ. Unit counts and other values without an
# interval use 10%. A reported range is widened by 10% of each bound.
schema_version: 2
paper: doi:10.1523/jneurosci.1350-21.2021
claims:
- id: units-responsive-count
  statement: The drifting grating analysis rests on 2365 visually responsive neurons in visual
    cortex and thalamus of 32 mice, with 562 in V1, 140 in LGN and 90 in LP.
  source: Results, Orientation-specific adaptation in visual cortex and thalamus, paragraph 1;
    Materials and Methods, Unit exclusion; Figure 1D
  quote: we analyzed responses from a total of 2365 visually responsive neurons in the visual
    cortex and thalamus of 32 mice
  expected:
  - quantity: visually responsive units, drifting gratings, regions with at least 50 units
    value: 2365
    tolerance: 236.5
  - quantity: V1 responsive units, drifting gratings
    value: 562
    tolerance: 56.2
  - quantity: LGN responsive units, drifting gratings
    value: 140
    tolerance: 14
  - quantity: LP responsive units, drifting gratings
    value: 90
    tolerance: 9
  criterion: Units pass the AllenSDK quality metrics named in the Methods (ISI violations, amplitude
    cutoff, presence ratio) and the responsiveness rule of Unit exclusion (over 5 Hz and over 1 SD
    of gray-screen rate in 0 to 100 ms, for the preferred orientation), in all 32 mice; regions
    with at least 50 such units are kept. The readings of O4 are each run; the claim is reproduced
    when under one reading all four counts are within tolerance, and the set of kept regions is
    V1, LM, AL, RL, PM, AM, LGN and LP.
- id: fig1d-v1-1back
  statement: In V1 the immediate repetition of orientation reduces the early (0 to 100 ms) response
    to drifting gratings by 17%, a 1-back adaptation ratio of 0.83.
  source: Results, Orientation-specific adaptation in visual cortex and thalamus, paragraph 1;
    Figure 1C and 1D
  quote: Adaptation reduced the response by 17% in V1 (1-back adaptation ratio = 0.83, p = 4e-57, 95%
    CI [0.81, 0.84])
  statistics:
  - test: two-tailed t test of log-transformed adaptation ratios against zero
    p: 4.0e-57
    corrected: FDR (Benjamini-Hochberg)
    ci:
      level: 0.95
      low: 0.81
      high: 0.84
    n: 562 V1 units
  expected:
    quantity: V1 1-back adaptation ratio, drifting gratings
    value: 0.83
    tolerance: 0.02
  depends_on:
  - units-responsive-count
  criterion: Per unit the ratio of O1, over 0 to 100 ms; the region value as O2; the t test of
    unit log ratios against zero (Methods, Orientation-specific adaptation to drifting gratings).
    Reproduced when, under one reading of O1 to O3, the value lies in [0.81, 0.84] and p < 0.05.
- id: fig1d-extrastriate-1back
