- id: fig2-v1-tuning-main-effect
  statement: In V1, 1-back adaptation is strongest when adaptor and test match the neuron's
    preferred orientation and weakens for less preferred orientations, a main effect of relative
    orientation.
  source: Figure 2D to 2F legend; Materials and Methods, Orientation-specific adaptation to
    drifting gratings, paragraph 3
  quote: In V1 (D–F, far left columns), adaptation was strongest when adaptor and test stimuli
    corresponded to the preferred orientation of the neuron and decreased when adapting and testing
    with less preferred orientations (significant main effect of relative orientation, p = 4e-11)
  statistics:
  - test: 3 x 3 mixed ANOVA, main effect of relative adaptor/test orientation
    p: 4.0e-11
    n: V1 responsive units in three OSI tertiles
  depends_on:
  - units-responsive-count
  criterion: Per region, units are split into OSI tertiles (OSI from the 0 to 100 ms rates to the
    preferred orientation and its orthogonal, Methods). Per unit, the 1-back ratio for test
    orientations at 0, 45 and 90 degrees from preferred, each the test orientation preceded by
    itself over preceded by its orthogonal (Figure 2 legend). A mixed ANOVA with relative
    orientation within units and OSI tertile between units. Open, each run. (a) the ANOVA on log
    ratios (the paper's scale for all tests) or (b) on ratios; the 45 degree level (c) pools
    test orientations at +45 and -45 degrees or (d) averages their two ratios; the preferred
    orientation is taken from the same trials (the paper names no held-out set). Reproduced when
    the main effect has p < 0.05 with the 0 degree ratio lowest, under one reading.
- id: fig2-v1-tuning-interaction
