  criterion: Per mouse, the average 0 to 100 ms firing rate of its responsive thalamic (LGN, LP)
    and, separately, cortical units for 1-back repeat and orthogonal trials (Figure 1E legend).
    The paper gives no test or count for "consistent". Readings, each run. (a) every mouse with
    units in the group has orthogonal above repeat; (b) a two-sided sign test across mice at p <
