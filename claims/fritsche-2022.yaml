    between 0.80 and 0.88, all significant.
  source: Results, Orientation-specific adaptation in visual cortex and thalamus, paragraph 1;
    Figure 1D
  quote: had a similar impact in higher-level extrastriate visual areas (Fig. 1D; 1-back adaptation
    ratios between 0.80 and 0.88, all p values < 2e-21, two-sided t tests, corrected for multiple
    comparisons)
  statistics:
  - test: two-sided t tests
    p: 2.0e-21
    p_relation: "<"
    corrected: multiple comparisons (FDR, Benjamini-Hochberg, per the Methods)
    n: units of LM, AL, RL, PM and AM
  expected:
  - quantity: lowest extrastriate 1-back ratio
    value: 0.80
    tolerance: 0.08
  - quantity: highest extrastriate 1-back ratio
    value: 0.88
    tolerance: 0.088
  depends_on:
  - units-responsive-count
  criterion: As fig1d-v1-1back, for LM, AL, RL, PM and AM. Reproduced when, under one reading,
