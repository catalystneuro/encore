    test: one-tailed hierarchical bootstrap mean difference test
    statistic: mean difference 0.06 (rho)
    p: 0.0007
    corrected: Holm, across 7 bins
    n: 753 same-range and 6,586 different-range neuron pairs, 20 sessions, 11 mice
  depends_on:
  - figs4-session-selection
  expected:
  - quantity: same minus different coupling range mean pairwise correlation, bin 0.00 to 14.29%
    value: 0.06
    tolerance: 0.006
    unit: rho
  criterion: E1 to E8, under the readings of O1 to O3 carried from figs4-session-selection.
