# Claims for Gable, Newman, Young, Scheib, Bliese, Miller & Kerlin (2026), "Tuft Dendrite Spikes
# Are Accompanied by Selective Input From Distinct Functional Networks", J Neurosci 46(38)
# e0974262026, doi:10.1523/jneurosci.0974-26.2026, tested on DANDI:000010, which the paper reuses.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-22,
# protocol pilot-18 as stated in docs/protocol.md, Reader section.
#
# Text read. The version of record (PMC13612898, open access, CC BY) in
# paper/10.1523-jneurosci.0974-26.2026.txt: abstract, Significance Statement, Introduction,
# Materials and Methods, Results with the legends of Figures 1 to 5 and Tables 1 to 8, Discussion.
# The same file holds the supplement (JN-RM-0974-26-suppl.pdf, legends of Figures S1 to S5 and the
# panel text); the PDF of the supplement is under paper/ and was not needed. The supplement legends
# refer to "Table 6", "Table 7" and "Table 8" where the main text puts the matching statistics in
# Tables 2, 4 and 5; the main-text numbering is used here.
#
# Code read. github.com/kerlin-lab/Gable_2026, commit 688e662767ed32b6ea60a2827c3483408edf6deb
# (2026-06-09), named in Code and data availability. It holds one notebook per figure (Figures 1 to
# 5, S1 to S5) and a function library, Figures/sled_glutamate_functions.py. The notebooks load
# pickled, already processed data from the lab's own servers; the repository holds no data. For
# Figure S4 it holds the coupling and statistics code (FigureS4.ipynb; functions
# calculate_ephys_population_coupling, _ephys_cluster_synchy, corrXCoupling_ephys_v3,
# _spont_group_boot_iter) but not the step that builds its input (ephys_secondaryAna.PKL, one
# neurons x trials x time-bins array per session) from the DANDI files: unit and session
# selection, trial selection, binning, smoothing and trial-specific activity are not in the code.
# The notebook's printed outputs show 20 sessions of 18 to 25 neurons each, and same-range and
# different-range pair counts per bin summing to 771 and 6,586 (Table 5 prints 753 and 6,586).
# These outputs were not used to set any expected value.
#
# The datasets. DANDI:000010, "A motor cortex circuit for motor planning and movement" (Li, Chen,
# Guo, Gerfen & Svoboda 2015; published version 0.220126.1905), extracellular recordings from
# mouse ALM (and thalamus) and calcium imaging during a delayed response task. The paper cites it
# as Li et al. 2015b and reanalyses its silicon-probe ALM recordings for Figure S4 and Table 5
# only. Those are the claims this attempt can test (figs4-*). Every other finding rests on the
# paper's own two-photon imaging, which is not in DANDI:000010 and is not deposited in any public
# archive the paper or the code names: those claims are data elsewhere, recorded as not public.
#
# Data the paper used, as it reports it.
# - Own imaging (Methods, Mice and surgeries; In vivo imaging; Results paragraph 3). 20 C57BL/6J
#   mice (11 male, 9 female); 19 task-trained, 1 imaged during spontaneous behaviour. Retrograde
#   AAV-Cre in VM thalamus; Cre-dependent iGluSnFR3 (glutamate) and jRGECO1a (calcium) in left
#   ALM, labelling L5B ET neurons; two mice (12 sessions) iGluSnFR3 only. Auditory delayed
#   directional licking task (3 or 18 kHz sample, 1.25 s delay, GO cue, 2 s response window);
#   imaging at about 175 Hz, 140 x 35 um, apical tufts under 0.1 mm depth, a 2.5 s window per trial
#   from delay onset to 1.25 s after GO. N = 19 mice, 64 FOV (one per session), 611 dendrite
#   segments, 2,591 synapses; median 235 trials per session (162 to 302). Trial types CL, CR, IL,
#   IR (correct or incorrect, left or right). Spontaneous imaging (Figure S3E): one mouse, three
#   sessions.
# - DANDI:000010 (Methods, Secondary analysis of electrophysiology dataset; Table 5). Delayed
#   directional licking with a tactile sample cue; ALM units from NeuroNexus silicon probes,
#   spike sorted. Eight Sim1_KJ18-Cre and three Tlx_PL56-Cre mice; high-quality units as labelled
#   in the dataset; sessions with at least 18 units whose session-wide firing rate exceeds 0.5 Hz;
#   photostimulation trials excluded. Table 5 reports 11 mice, 20 sessions, 753 same-range and
#   6,586 different-range neuron pairs. Measured variables used: unit spike times, unit quality
#   labels, subject genotype, trial times (sample onset, GO cue), lick direction and outcome, and
#   photostimulation per trial.
#
# Method for the Figure S4 claims (E1 to E8), from the Methods paragraph "Secondary analysis of
# electrophysiology dataset" (SA), the Methods on synapses that SA points to, the Statistics
# section (ST) and the code (FigureS4.ipynb and sled_glutamate_functions.py at 688e662).
# - E1 Mice and sessions. Sim1_KJ18-Cre (8) and Tlx_PL56-Cre (3) mice; sessions that contain at
#   least 18 units with a session-wide firing rate above 0.5 Hz (SA).
# - E2 Units. "Only high-quality units, as labeled in the original dataset" (SA).
# - E3 Trials. Photostimulation trials excluded (SA). The code then drops every trial in which any
#   neuron's array holds a NaN (FigureS4.ipynb cell 2).
# - E4 Activity. Spike counts in 5 ms bins, smoothed with a Gaussian of sigma 2 bins and 20 ms
#   (4-bin) radius (SA), over each trial from tactile sample onset to 2 s after the GO cue (SA,
#   "estimated session-wide from activity recorded between the tactile stimulus onset and 2 s
#   after the GO signal").
# - E5 Trial-specific activity (TSA). "TSA was calculated as described for synaptic imaging data"
#   (SA): for each trial type (CL, CR, IR, IL) the trial-averaged activity is subtracted from the
#   activity on the trials of that type (Methods, Activity extraction; Figure 2G).
# - E6 Population coupling. Per session and neuron, the Pearson correlation between the neuron's
#   TSA, flattened over trials and bins, and the summed TSA of all other neurons of the session
#   (Methods, Population coupling; code calculate_ephys_population_coupling, which excludes no
#   neuron other than itself). Coupling values of all sessions pooled and cut into 7 bins at the
#   k/7 percentiles (k = 1 to 6), a value equal to an edge going to the lower bin (code, n_slices
#   = 7; Table 5 bins 0.00 to 14.29% ... 85.71 to 100.00%).
# - E7 Pairs. Within each session, every pair of neurons: "same range" for bin k when both are in
#   bin k, "different range" when one is in bin k and the other in another bin. Pair value, the
#   Pearson correlation of the two neurons' flattened TSA (code _ephys_cluster_synchy; Methods,
#   "Pearson's correlation coefficient was used"). The code applies no distance or r > 0.5
#   exclusion to neuron pairs; the Methods state those for synapse pairs only.
# - E8 Test. For each bin, the same-range and the different-range pairs are bootstrapped
#   independently: draw the sessions with replacement (as many as there are), pool their pairs,
#   keep the draw only if the pool holds at least the observed number of pairs, take the mean;
#   10,000 kept draws per group (code _spont_group_boot_iter, corrXCoupling_ephys_v3, nBoot =
#   10000; ST, "10,000 valid ... resamples"). Differences are taken draw by draw (same minus
#   different); the mean difference is the mean of these; one-tailed p = (number of differences
#   <= 0, plus 1) / (number of valid differences, plus 1); Holm correction across the 7 bins, alpha
#   0.05 (ST; code alternative = 'greater', pvalue_correction = 'holm'; Table 5 title "One-tailed").
#
# Open details for the Figure S4 claims, each with the readings the text allows. The notebook runs
# every combination; a claim's outcome is the one they all give (protocol, Reader step 3).
# - O1 Which units enter a selected session. (a) All high-quality units of a session that has at
#   least 18 high-quality units above 0.5 Hz; (b) only the high-quality units above 0.5 Hz.
#   SA's sentence ("we also included only sessions that contained at least 18 units with a
#   session-wide firing rate >0.5 Hz") reads most directly as a session filter, (a), but (b) is
#   allowed.
# - O2 "Session-wide firing rate". (a) The unit's spike count over the whole recording divided by
#   its duration; (b) its mean rate within the E4 windows of the included trials.
# - O3 Trials outside the four types CL, CR, IR, IL (early-lick or no-response trials, if the
#   dataset marks them). (a) Excluded, since TSA is defined on those four types; (b) kept, each
#   with its own trial-type mean subtracted.
# - O4 Where the Gaussian smoothing is applied: within each trial's window (standard choice; it
#   cannot change the outcome beyond edge bins).
# - O5 If trial windows from sample onset to GO + 2 s differ in length across trials, the code's
#   fixed-size array and its NaN trial filter (E3) imply a common length; the paper does not say
#   how it is set. Recorded as a deviation if met; the shortest common window from sample onset
#   is the standard choice.
# - The bootstrap seed is not given; it is a standard choice that cannot change the outcome beyond
#   resampling noise.
#
# Method for the imaging claims (M1 to M6), from the Methods. These claims are not tested here;
# the criteria say how they would be judged if the data were obtained.
# - M1 Synaptic measures. Theta(dF/F0): dF/F0 binarized at the 99th percentile of the absolute
#   negative deflections; Theta(dF/dt): dF/dt smoothed by a Gaussian (sigma 2, radius 4 frames)
#   binarized at the 92nd percentile; TSA subtracts each trial type's mean (CL, CR, IL, IR);
#   synapses with SNR < 1.5 excluded (Methods, Activity extraction).
# - M2 Tuft spikes, SD and OD. Spike detection as in Methods, Activity extraction; only synapses on
#   dendrites with at least 4 spikes; SD = synapses on the spiking dendrite, OD = synapses on
#   dendrites with session-wide calcium correlation < 0.4 to it (Methods, Characterization of
#   synaptic activity associated with tuft spikes).
# - M3 Windows. Pre -575 to 0 ms and post 0 to 575 ms from spike onset (Figure 2F legend); coupling
#   group and mode windows -50 to 150 ms (Figures 3F and 5B legends).
# - M4 Population coupling and groups. Pearson correlation of a synapse's Theta(dF/dt)TSA with the
#   summed Theta(dF/dt)TSA of the other synapses in the FOV, excluding those within 10 um on the
#   same branch; ranks pooled over sessions; SC top 20%, WC middle 60%, NC bottom 20% (Methods,
#   Population coupling; Results).
# - M5 Activity modes. Weights from Equations 2 to 4, GO mode orthogonalized to the Response
#   Direction, Outcome Direction orthogonalized to GO mode then Response Direction (Methods,
#   Activity modes and coding directions).
# - M6 Statistics. Hierarchical bootstrap over sessions, 10,000 valid resamples, tails as each
#   table's title states, add-one p-values, Holm correction within each table's stated family;
#   for Figure 3D, pairs drawn by resampling synapses 100 times without replacement within each of
#   1,000 session bootstraps, synapse pairs closer than 2.5 um or with r > 0.5 excluded (Methods,
#   Statistics; Pairwise correlation and autocorrelation analyses).
