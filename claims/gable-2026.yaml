    as the synapses with the lowest coupling are.
  source: Results, Inputs SC to the population are the most active at tuft spike onset, paragraph
    2; Figure S4B; Table 5
  quote: These enhanced correlations among the lowest couplers were also found in ... publicly
    available silicon probe recordings of ALM activity ( Fig. S4 ; Table 5 ; Li et al., 2015a )
  statistics:
