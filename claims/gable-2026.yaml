- id: figs4-session-selection
  statement: The reanalysis of the Li et al. (2015) ALM silicon-probe recordings includes eight
    Sim1_KJ18-Cre and three Tlx_PL56-Cre mice, 20 sessions, and yields 753 same-coupling-range and
    6,586 different-coupling-range neuron pairs.
  source: Methods, Secondary analysis of electrophysiology dataset; Table 5 footnote
  quote: Our analysis included eight Sim1_KJ18-Cre mice and three Tlx_PL56-Cre mice from this study
  expected:
  - quantity: mice
    value: 11
    tolerance: 0
  - quantity: sessions
    value: 20
    tolerance: 2
  - quantity: same coupling range neuron pairs, summed over the 7 bins
    value: 753
    tolerance: 75
  - quantity: different coupling range neuron pairs, summed over the 7 bins
    value: 6586
    tolerance: 659
  criterion: Selection E1 to E3, binning E4 and pairs E6 and E7, under each reading of O1, O2 and
    O3. Mice are counted exactly, as the paper names them by genotype (8 Sim1_KJ18-Cre, 3
    Tlx_PL56-Cre); 10% for the other counts. Reproduced when, under one reading, all four
    values are within tolerance; partially reproduced when mice and sessions are and a pair count
    is not. The code's printed output (771 same-range pairs) is reported beside the result. The
    reading or readings that match are carried into the other figs4 claims; when none matches,
    those claims are run under every reading and say so.
