    partially reproduced when the test holds and a mean is outside tolerance.
- id: fig4d-alm-predicts-medulla-null
  statement: Medullary movement-null activity is predicted from ALM movement-null activity (40 +- 8.1%,
    mean +- s.e.m.) nearly as well as contralateral ALM predicts ALM (54 +- 7.0%).
  source: Results, A subset of null dynamics is found downstream of motor cortex, paragraph 4; Figure 4d
  quote: Medullary movement-null activity could be predicted from ALM movement-null dynamics (40 ± 8.1%, mean
    ± s.e.m; Fig. 4d ) nearly as accurately as from the contralateral ALM (54 ± 7.0%, mean ± s.e.m; Fig. 4d ).
