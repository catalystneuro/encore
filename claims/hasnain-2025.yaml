# Claims for Hasnain, Han & Economo (2025), "Mapping neural subspace dynamics onto the structure
# of the mouse descending motor system", bioRxiv doi:10.1101/2025.10.17.682917, tested on
# DANDI:000363 (Mesoscale Activity Map Dataset), which the paper reuses.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-22,
# protocol pilot-18 as stated in docs/protocol.md (Reader, steps 1 to 4).
#
# Text read. The preprint (version 1, posted 2025-10-17), full text from PMC (PMC12632980), in
# paper/10.1101-2025.10.17.682917.txt: Abstract, Introduction, Results, Discussion, Methods, the
# legends of Extended Data Figures 1 to 3, and the legends of Figures 1 to 4. The paper has no
# separate supplement (PMC lists none); the Extended Data legends are in the text. No PDF was
# supplied, so no figure was read; every claim rests on the text.
#
# Code read. github.com/economolab/subspaceID, commit d593949fef8a39fe0a6eb54a21fc05cbca7bae84,
# the only code the paper links ("Code for identifying movement-null and movement-potent
# subspaces"). It holds orthogonal_subspaces.m (the manopt optimization of the Methods'
# objective, each term normalized by the sum of the top-d eigenvalues of its covariance, with a
# regularization weight alpha that example.m sets to 0), example.m (z-scores each neuron over all
# bins and trials, takes the covariance of stationary and of moving bins, fixes 15 dimensions per
# subspace, rng(101)), and a Python port (funcs.py, example.ipynb). It holds none of the paper's
# other analyses (session selection, movement masks, dimensionality, variance explained,
# selectivity, decoding, UMAP). The rest of the paper's code "will be made available on Github
# upon publication".
#
# Data the paper used, as it reports them.
# (1) The paper's own recordings (Figures 1 to 3, Extended Data Figures 2 and 3). 9 mice (3 male,
# 6 female, C57BL/6J or VGAT-ChR2-EYFP negative), 27 sessions, delayed-response auditory licking
# task (sample tones, 1.2 s delay, go cue). Neuropixels 1.0 (4 sessions) and 2.0 (23 sessions) in
# ALM (13 sessions, 49 L-ETNs, 1020 UNs) and tjM1 (14 sessions, 55 L-ETNs, 830 UNs); L-ETNs
# phototagged by retrograde ChR2 from the medulla and confirmed by collision tests. 400 Hz side and
# bottom video, motion energy, DeepLabCut tongue tracking, Facemap singular vectors. These data are
# not public ("Data will be made publicly available upon publication") and are not in DANDI:000363.
# Their claims are kept, as data the paper recorded (data: dataset), and cannot be tested here.
# (2) The MAP dataset, DANDI:000363 (Chen et al. 2024, ref 58), used for Figure 4: Neuropixels
# recordings in mice doing the same delayed-response task. The paper takes sessions with at least
# 30 units classified as 'good' in each region of interest: bilateral ALM sessions (20 sessions,
# 10 mice, 961 right and 1055 left ALM units), and simultaneous ALM and medullary reticular nuclei
# sessions (IRN, GRN and PARN; 604 ALM and 724 medulla units). ALM units are those labelled MOs in
# the Allen CCF on probes described as targeting ALM. Movement is taken from the provided jaw and
# nose keypoint tracking (side camera, 300 Hz). Measured variables used: unit spike times, unit
# CCF location and quality label, probe target, trial times and types (lick left or right,
# correct or error), and the jaw and nose keypoints.
#
# Method for the claims on DANDI:000363, from the Methods ("Curation of Mesoscale Activity Map
# Dataset", "Subspace identification", "Dimensionality of subspaces", "Identifying selective
# neurons", "UMAP embeddings", "Cross-region decoding") and the subspaceID code. Cited in the
# criteria as M1 to M10. Where the paper leaves a detail open, the readings are named.
# M1 Sessions. Sessions with at least 30 'good' units in each region of interest (Methods). The
#    count of ALM and medulla sessions is open, between (S1) 16 sessions (Results; Figure 4c
#    legend; every statistic of Figure 4 has n = 16) and (S2) 11 sessions from 7 mice (Methods).
#    The bilateral ALM count is 20 sessions from 10 mice in both places, but the unit count
#    differs (1116 neurons in the Results, 2016 units in the Methods).
# M2 Units. Open between (U1) only units labelled 'good' in the regions of interest and (U2) all
#    units in those regions of the selected sessions; the Methods use 'good' only to select
#    sessions. The reported unit counts (604 ALM, 724 medulla; 961 and 1055 ALM) decide between
#    them where they can. The ALM hemisphere in ALM and medulla sessions is not stated; all ALM
#    units of the session are pooled, a reading of "ALM: 604 units". Medulla units are those in
#    IRN, GRN or PARN, both hemispheres pooled.
# M3 Firing rates. Spike counts in 5 ms bins, smoothed with a causal Gaussian kernel of 20 ms
#    s.d. (Methods). Each neuron's single-trial activity has the mean baseline activity across
#    trials subtracted and is divided by the standard deviation across trials, baseline -2.1 to
#    -1.85 s before the go cue (Subspace identification; the Coding direction section gives -2.15
#    to -1.85 s). The z-scoring of example.m (over all bins and trials) is a variant. All correct
#    and error trials enter the subspace estimate (Methods). The trial window is not stated for
#    the MAP data. Readings (W1) -2.15 s to +1.5 s around the go cue (the baseline start to the end
#    of the late response epoch, the widest span the Methods' windows give) and (W2) -1.8 s to
#    +1.5 s (the task epochs of the selectivity analysis only).
# M4 Moving and stationary bins. Per session, the velocity magnitude of the jaw and nose
#    keypoints, averaged, is thresholded by hand; movement bouts (at least 100 ms continuous)
#    separated by 50 ms or less are merged (Methods). The threshold is open; the paper's procedure
#    for its own data sets it between the two modes of the bimodal histogram (Videography and
#    behavioral analysis), and that is the reading here. Whether supra-threshold runs shorter than
#    100 ms count as moving is open, between (B1) they are stationary and (B2) they are moving.
#    Keypoint velocities are resampled to the 5 ms bins.
# M5 Subspaces. The Methods' objective, solved with manopt trust regions as orthogonal_subspaces.m
#    does, alpha 0, computed in each region of a session independently (Results, paragraph on
#    MAP). The dimensions d_null and d_potent are the number of eigenvalues of the stationary and
#    moving covariances above the 95th percentile of 1000 shuffles of the time bins of each neuron
#    separately (Dimensionality of subspaces). The Methods add a garbled sentence on sessions with
#    forty or fewer neurons; it is read as (D1) no cap other than d_null + d_potent no larger than
#    the number of neurons, or (D2) each dimension capped at 20 (example.m notes that above 20
#    dimensions optimization is slow). The fixed 15 dimensions of example.m are a variant.
# M6 Variance explained of a subspace (Figure 4c). VE = Tr(Q'CQ) / sum of the top d eigenvalues
#    of C (Methods). Which C and which d are open. Readings (V1) C is the covariance of all
#    single-trial activity, d the subspace's own dimension, and for both subspaces together d =
#    d_null + d_potent; (V2) the same C normalized by its total variance, so that the two
#    subspaces' values add up to that of both, as the paper's 37 + 41 = 78% do; (V3) C_stationary
#    for the null and C_moving for the potent subspace, as in the objective.
# M7 Selectivity (Figure 4b). For each unit, random equal samples of correct right and left
#    trials; firing rate averaged within each epoch (seconds from the go cue; sample -1.8 to -1.2,
#    early delay -1.2 to -0.5, late delay -0.5 to 0, early response 0 to 0.5, late response 0.5 to
#    1.5); AUROC right against left, 1000 label shuffles, p the share of shuffles with |AUROC -
#    0.5| at least the observed; significant below 0.05/5 (Bonferroni over the 5 epochs). The
#    number of trials sampled is open; the reading is the smaller of the two trial counts. How
#    the five epochs map onto the paper's three (sample, delay, response) is open between (E1) a
#    unit selective in either sub-epoch counts for the epoch and (E2) each sub-epoch alone, every
#    one reported. The Figure 1i legend gives "p < 0.05; shuffle test" with no correction; the
#    Methods' Bonferroni threshold, which names Fig. 1i and Fig. 4b, is the main reading, and the
#    uncorrected p < 0.05 is a variant.
# M8 Cross-region decoding (Figure 4d). Movement-null projections of single trials. For each time
#    bin t, ridge regression (lambda 0.01) from the source projections at t and the 8 preceding
#    bins (D_source x 9 predictors) to all target dimensions at t; 70% of trials to train, 30% to
#    test; R2 on the test set at each bin, averaged over all task epochs per session; paired t
#    tests over sessions (Methods). The Results say "the previous 40 ms"; the Methods' 45 ms
#    (t and 8 bins) is used. Open details. The trials used (T1 all trials, T2 correct trials
#    only). The R2 over several target dimensions, (R1) one minus the residual over the total sum
#    of squares pooled over dimensions, or (R2) the mean of each dimension's R2. Whether the
#    predictors are standardized before the ridge (MATLAB's ridge() does so by default, and the
#    paper uses it for Figure 3) is open; both are run. The ALM to ALM value is (A1) the mean of
#    both directions per session, or (A2) each direction alone. The span averaged is the task
#    epochs of M7, -1.8 to +1.5 s.
# M9 Dimensionality (Figure 4e). Open between (N1) the shuffle count of M5 from the stationary
#    bins (the Methods' only dimensionality procedure) and (N2) the participation ratio of the
#    eigenvalues of the movement-null activity, as a stand-in for the effective dimensionality the
#    Results cite to ref 70 (Recanatesi et al. 2022, a scale-dependent measure of dimensionality);
#    the paper does not say which scale or measure it used. ALM against medulla, paired t test over sessions.
# M10 UMAP (Figure 4f). Equal numbers of left and right correct trials, half to train and half to
#    test; trial-averaged movement-null reconstructions (X Q Q') of both trial types concatenated
#    in time; z-scored per unit on the training set; run_umap with 2 components, 30 neighbours,
#    min_dist 0.3, cosine metric, fitted on the training data of ALM and medulla units together,
#    test data transformed (Methods). umap-learn with the same parameters stands in for the MATLAB
#    run_umap; the seed is a standard choice.
#
# Tolerances. The paper's stated spread where it gives one (s.d. over sessions for Figure 4c,
# s.e.m. for Figure 4d and the paper's own data); otherwise 10% of the reported value. For a
# directional result the paper tested, the criterion also asks for the same direction at p < 0.05
# with the paper's test.
