- id: fig4f-medulla-null-not-spanning-alm
  statement: In a joint UMAP embedding of movement-null activity, medullary units do not span the set of
    movement-null activity patterns seen in ALM.
  source: Results, A subset of null dynamics is found downstream of motor cortex, paragraph 5; Figure 4f
  quote: Further, examining a UMAP embedding of ALM and medullary movement-null activity, we found that the
