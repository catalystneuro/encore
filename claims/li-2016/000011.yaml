  quote: 1012 single units were recorded during behavior across 58 recording sessions (20 sessions of
    unilateral experiments, Fig. 1 ; 38 sessions of bilateral experiments ... Units with spike width <
    0.35 ms were defined as fast-spiking (FS) neurons (72/1012) and units with spike widths > 0.45 ms
    as putative pyramidal neurons (890/1012). Units with intermediate values (0.35 - 0.45 ms, 50/1012)
    were excluded
  expected:
  - quantity: single units
    value: 1012
    tolerance: 101.2
  - quantity: recording sessions
    value: 58
    tolerance: 5.8
  - quantity: fast-spiking units
    value: 72
    tolerance: 7.2
  - quantity: putative pyramidal units
    value: 890
    tolerance: 89
  - quantity: intermediate units
    value: 50
    tolerance: 5
  criterion: Width is the trough-to-peak interval of the mean waveform (Methods). Units and
