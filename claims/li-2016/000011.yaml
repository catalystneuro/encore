# Claims for Li, Daie, Svoboda & Druckmann (2016) on dandiset 000011.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21, protocol
# as stated in docs/protocol.md, Reader steps 1 to 4.
#
# Text read: the HHMI author manuscript in PubMed Central (PMC5081260, NIHMS767125), as served by
# Europe PMC (paper/10.1038-nature17643.txt): main text, Methods, the legends of Figures 1 to 6 and
# of Extended Data Figures 1 to 10. It is the accepted manuscript, not the version of record. The
# paper has no Supplementary Information beyond the Extended Data (the record says no supplement).
# No PDF was supplied, so no figure could be read; values shown only in figures are not claimed.
# Not read: the Corrigendum (Nature 537, 122; doi:10.1038/nature18623), which the record lists and
# the text does not include. Whether it changes any value below is not known.
#
# Code read: none. The paper links no analysis or model code. It names the data deposit "Data have
# been deposited at https://crcns.org/ and can be accessed at http://doi:10.6080/K0RB72JW". The
# dandiset is listed for this paper; which of the experiments below it holds is for the author to
# find. The dataset's files were not looked at.
#
# The data the paper used, as it reports them (Methods). 33 mice, male and female, older than P60.
# Photoinhibition behaviour, 10 VGAT-ChR2-EYFP and 9 PV-ires-cre x Rosa26-LSL-ReaChR mice; of these,
# 5 VGAT and 7 PV x ReaChR mice also had electrophysiology during behaviour. Callosotomy, 7 mice (6
# VGAT, 1 PV x ReaChR); cut on the left (3) or right (4). Photoactivation, 2 Tlx_PL56-cre x Ai32
# mice. Photoinhibition characterisation, 4 untrained mice (2 VGAT, 2 PV x ReaChR). Anatomy, 1
# Tlx_PL56-cre mouse. Task: a pole at one of two positions 4.29 mm apart (posterior, lick right;
# anterior, lick left); sample epoch 1.3 s from pole movement onset to 0.1 s after retraction
# onset; delay epoch 1.3 s (unilateral experiment, Fig. 1), 1.7 s (bilateral experiment, Fig. 2),
# or 1.2 to 1.7 s in 0.1 s steps (Extended Data Fig. 3c, d); go cue 3.4 kHz, 0.1 s; lick early
# trials punished; no lick within 1.5 s of the go cue is rare. Photoinhibition on 25% of trials in
# behaviour and 40% during electrophysiology; photoactivation on 40%. Recordings from left ALM with
# 32-channel NeuroNexus probes (A4x8), 19531.25 Hz after demultiplexing, band-pass 300 Hz to 6 kHz,
# manual spike sorting. 1012 single units in 58 sessions (20 unilateral, Fig. 1; 38 bilateral,
# Fig. 2 and Extended Data Fig. 7) from 12 mice; callosotomy recordings 7 mice. Measured variables:
# spike times and waveforms per unit, trial type (pole position), licks and outcome (correct,
# incorrect, lick early), photostimulus condition and timing, delay duration.
#
# Conventions used by the criteria below (from the Methods and legends unless marked open).
# T (photoinhibition timing). Unilateral experiment (Fig. 1): 0.5 s including a 100 ms ramp down,
#   ending 1.6 s (sample), 0.8 s (early delay), 0.3 s (late delay) or 0 s (before cue) before the
#   go cue (Methods). The Results name the conditions differently; the 0 s condition is called
#   "late delay" and the 0.3 s one "middle delay". Electrophysiology in this experiment used the
#   sample, early delay and late delay conditions (Methods). Whether this recorded "late delay"
#   ends 0.3 s (Methods naming) or 0 s (Results naming) before the go cue is not fixed by the text;
#   the author reads the photostimulus times from the dataset's trial metadata. Bilateral experiment (Fig. 2): 0.8 s
#   including a 200 ms ramp, from the start of the sample or of the delay epoch; recordings used the
#   delay start (Extended Data Fig. 2e). Photoinhibition offset is the end of the ramp (Extended
#   Data Fig. 3b, "the end of ramp offset"). The callosotomy experiment's delay duration and
#   photostimulus are not given; the Fig. 5a legend says "early delay epochs". Open, with readings
#   (C1) as the bilateral experiment, 1.7 s delay, 0.8 s from delay onset; (C2) as recorded in the
#   dataset's trial metadata, which the author reads.
# U (units). Trough-to-peak spike width < 0.35 ms, fast-spiking; > 0.45 ms, putative pyramidal;
#   between, excluded. Analyses use putative pyramidal neurons.
# S (selective). Spike counts in the sample, delay or response epoch differ between lick left and
#   lick right trials, two-tailed t-test, p < 0.05; selective in any epoch. The response epoch
#   length is not given; open, readings (R1) 1.3 s after the go cue, (R2) 1.5 s, the response
#   window. Which outcomes enter is open; readings (O1) correct trials only, as for the cd, (O2)
#   correct and incorrect trials grouped by instructed movement. Student's or Welch's t-test is not
#   stated; open, readings (a) Student's, (b) Welch's.
# D (selectivity and its recovery). Preferred trial type from 10 trials; selectivity is the spike
#   rate difference preferred minus non-preferred on the remaining trials; all trials (correct and
#   incorrect), grouped by instructed movement, when photoinhibition effects are quantified.
#   Which 10 trials (random, or the first) and from which condition are not given; standard choice,
#   10 random control trials, repeated across the bootstrap. Selectivity change is photoinhibition
#   minus control selectivity. Recovery time is the first time bin after photoinhibition offset at
#   which photoinhibition selectivity reaches 80% of control selectivity, mean and s.e.m. by
#   bootstrap over neurons. The bin for the selectivity time course is not given; open, readings
#   (B1) 200 ms (the PSTH window of Fig. 1e), (B2) 400 ms (the rate test window), both in 50 ms
#   steps. Whether 80% is of the time-matched control selectivity is not stated; reading, the
#   time-matched control, as the change is plotted against control in time. Neurons included,
#   selective (S) and tested on more than 3 trials in every condition (Fig. 1g legend).
#   Answered 2026-10-21, not given by the paper (no code is linked): the window of the spike
#   counts that set the preferred trial type; readings (D1) the whole trial, sample onset to the
#   end of the response epoch, (D2) the delay epoch, (D3) each time bin separately. Whether ">3
#   trials in all conditions" counts per condition or per condition and trial type; (N1) per
#   condition, the legend's words, decides the outcome, and (N2) per condition and trial type is
#   shown as a variant. No further selection
#   behind the legend counts (55, 143, 129, 40, 26) is stated; the Fig. 2e legend says only "Same
#   as Fig. 1g". Which time labels a bin; readings (L1) its centre, (L2) its end. How far the
#   search for the first bin at 80% runs; readings (E1) to the end of the delay epoch, (E2) to the
#   end of the analysed window after the go cue (Extended Data Fig. 7d says "no recovery at end of
#   delay period", which fits E1 for the no-recovery judgement). D1 to D3, L1 and L2, E1 and E2
#   are method details the paper leaves open (Reader step 3): the outcome is the one they all
#   give, and when they give different outcomes the claim is methods_underspecified.
# K (lick early trials in neural analyses). Answered 2026-10-21, not given by the paper. The
#   Methods exclude them from performance only ("excluding 'lick early' trials"); no passage says
#   whether they enter selectivity tests, rate tests, selectivity time courses or the activity
#   space. Readings (K1) dropped, (K2) kept, with events at their logged times. Applies to every
#   claim on conventions S, D, R and A; a method detail, so the outcome is the one K1 and K2 both
#   give, else methods_underspecified.
# R (rate change). Two-tailed t-test on spike counts in 400 ms windows, control against
#   photoinhibition, lick left and lick right trials pooled, tested in 50 ms steps, significant at
#   p < 0.01. Whether a window is labelled by its start, centre or end is not given; readings (W1)
#   end, (W2) centre. Neurons with mean rate below 1 spike/s or fewer than 3 trials are excluded in
#   Extended Data Figs 5e and 7c; applied here to Figs 1f, 2d and 5d as a reading (the Fig. 1f, 2d
#   and 5d legends do not say), with (X2) no exclusion as the other reading.
# P (performance). Fraction correct, lick early trials excluded; photoinhibition against control by
#   two-tailed t-test, per mouse values (figure symbols are mice). Paired or unpaired is not said;
#   readings (P1) paired over mice, (P2) unpaired over mice.
# A (activity space, Methods). Sessions of the bilateral experiment with > 5 neurons recorded
#   simultaneously for > 5 trials per condition (16 of 38 sessions). Spike counts in 400 ms windows,
#   10 ms steps. w_t is the lick right minus lick left mean response vector, correct control trials;
#   cd is the average of w_t over the sample and delay epochs. The cd, the offsets and the decision
#   boundary use a subset of control trials; projections use the other control trials and the
#   perturbation trials. The size of the subset is not given; open, readings (H1) a random half of
#   correct control trials, (H2) a random third. Projections use correct and incorrect trials,
#   grouped by instructed movement. ROC is the area under the ROC curve of cd'x between lick right
#   and lick left trials in the last 400 ms of the delay epoch, per session, mean and s.e.m. over
#   sessions. Decision boundary as the Methods give it, the inverse-variance weighted mean of the
#   two class means, from the last 400 ms before the go cue. Whether cd is normalised to unit
#   length is not stated; it does not change ROC or the side of the boundary, and unit length is
#   used as a standard choice.
#   Answered 2026-10-21, not given by the paper: the Methods' rule (> 5 neurons recorded
#   simultaneously for > 5 trials per condition) is the only selection stated; the Results give
#   the outcome, 6 to 20 neurons per session, mean 11, 16 sessions, and Extended Data Fig. 6b
#   sessions of 20, 16, 18, 10 and 12 neurons. No restriction to selective neurons, to neurons
#   held over the whole session, or cap on neurons is given. The rule is followed as written,
#   (T1) trials counted per condition, for the outcome; (T2) per condition and trial type is shown
#   as a variant. The session and neuron counts are reported against the paper's.
