  statement: After callosotomy, selectivity along cd was reduced following ipsilateral
    photoinhibition.
  source: Results, Contralateral input is required for recovery, paragraph 2; Figure 5f
  quote: Selectivity in the cd direction was reduced ( Fig. 5f , 16 sessions)
  criterion: Convention A on callosotomy sessions (> 5 neurons, > 5 trials per condition; 16
    sessions expected). ROC at the end of the delay for control and ipsilateral trials per session.
    The paper gives no test; reproduced when ipsilateral ROC is lower than control by a paired
    t-test over sessions at p < 0.05 (a reading) under H1 or H2, and the session count is within
    10% of 16.
- id: ed1-monolithic-models-fail
  statement: Monolithic network models (integrator, integrator with corrective feedback, trained
    random recurrent networks) do not recover the unperturbed trajectory after transient silencing
    of half their neurons.
  source: Results, Robust model networks, paragraph 1; Extended Data Figure 1f-i
  quote: Overall, all “monolithic” models consisting of one network were unable to explain
    robustness
  criterion: A simulation, not a test on recorded data. Parameters from the Methods and Extended
    Data Fig. 1 legend (simple integrator N = 100, tau 100 ms, one eigenvalue 0.99; FORCE network N =
    400, tau 200 ms, tanh, p = 0.1, gain 1.5, 30 iterations; silencing 0.2 to 1.0 s of 2 s). The
    integration step, noise and random seeds are not given; standard choices (1 ms step, fixed
    seeds, at least 10 networks). Reproduced when, at 2 s, the output of each model differs from
    its unperturbed output by more than 10% of the unperturbed selectivity (a reading of failure to
    recover), for the simple integrator and the transient-input FORCE network. The corrective
    feedback and tamed chaos models lack parameters in the text (weights, tuning threshold) and are
    reported only if they can be built from the cited methods.
- id: fig6-modular-models-recover
  statement: Modular networks of two coupled modules (attractor, integrator, trained recurrent
    network) recover after silencing of one module; the modular attractor drifts to a random fixed
    point when both modules are silenced.
  source: Results, Robust model networks, paragraph 2; Figure 6b-d
  quote: Selective commissural connections restored activity on the other side after unilateral
    transient silencing ( Fig. 6b ). When the two sides are silenced, the network drifts to one of the
    fixed points randomly
  criterion: A simulation, not a test on recorded data. Modular attractor with the Methods'
    weights (self 0.5235, within-module -0.5235, between-module 0.3), tau 100 ms, f(x) = g(x) -
    g(0) with g(x) = 1.4 / (1 + exp(-(x - 0.5) / 0.3)), input 0.1 from 0.05 to 0.1 s, tonic 0.5,
    noise variance 0.01; modular integrator with the 8 by 8 matrix printed in the Methods, tau 10
    ms, input 0.04, tonic 40. Integration step and noise scaling with step are not given; standard
    choice 1 ms with Euler-Maruyama. Answered 2026-10-21, not given by the paper; readings (n1)
    white noise of intensity 0.01, Euler-Maruyama increments of sd sqrt(0.01 dt)/tau, (n2) a
    Gaussian sample of variance 0.01 drawn every step and integrated as an input; the outcome must
    hold under both, else methods_underspecified. The integration step is not given either;
    readings (h1) 1 ms, (h2) 0.1 ms, under both noise readings. Reproduced when, over 100 simulated trials per trial type, the
    modular attractor ends at the instructed fixed point in more than 90% of trials after
    unilateral silencing (0.2 to 1.0 s) and in 30% to 70% after bilateral silencing (the 90% and
    the 30% to 70% are readings of "restored" and "randomly"; the paper gives no numbers), and the
    modular integrator returns within 10% of its unperturbed trajectory by 2 s after unilateral
    silencing. The FORCE modular network is not specified enough to rebuild and is reported only.
