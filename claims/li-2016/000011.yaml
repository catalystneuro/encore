    p: 0.01
    p_relation: "<"
    n: 5 mice
  criterion: Behaviour of the unilateral experiment (convention T, the condition ending 0 s before
    the go cue). An ipsilateral bias lowers performance on trials whose instructed lick is
    contralateral to the photoinhibited hemisphere (lick right for left ALM). The measure tested is
    not stated; readings (M1) performance on contralateral trials, (M2) overall performance (Fig.
    1d plots "behavioral performance"). Per mouse, photoinhibition against control (convention P,
    readings P1 and P2), left and right hemisphere pooled per mouse. Reproduced when performance on
