- id: fig1d-late-delay-ipsilateral-bias
  statement: Unilateral photoinhibition of ALM (0.5 s) ending at the go cue caused an ipsilateral
    response bias.
  source: Results, Preparatory activity after unilateral silencing, paragraph 1; Figure 1d
  quote: Transient (duration, 0.5 s) unilateral photoinhibition of ALM up to the ‘go’ cue (late
