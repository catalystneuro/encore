  criterion: Mode 4 (Methods), the first SVD eigenvector of the baseline-subtracted PSTH matrix
    (lick right and lick left concatenated, sample and delay epochs as a reading of the time range)
    made orthogonal to modes 1 to 3 by Gram-Schmidt; mode 3 from the lick left difference, made
    orthogonal to mode 2. Reproduced when the control projection rises over the delay (end minus
    start of delay, positive in the session mean), its ROC between trial types and its fraction
    predicted fail the tests of fig3d-persistent-mode, and for ipsilateral, contralateral and
    bilateral trials the perturbed minus control difference at the go cue is within 2 bootstrap
    s.e.m. of zero (a standard choice). Mode 5 is reported as a variant. Ipsilateral trials are
    split as in fig3d-persistent-mode. The sign of mode 4 is not given (answered 2026-10-21); the
