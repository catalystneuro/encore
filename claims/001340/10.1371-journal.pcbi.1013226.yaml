- id: fig3c-aic-around-switch
  statement: Around block switches (first 5 trials after a switch) BRLfwr and the dynamic RL
    models fit similarly better than RL4p, with relative AIC of -163.68 (BRLfwr), -163.92
    (RL_meta) and -158.91 (PearceHall).
  source: Results, Bayesian models and complex RL models, paragraph 4; Fig 3C
  quote: 'We found similar Δ AIC results for BRLfwr and dynamic RL models (BRLfwr: −163.6763,
