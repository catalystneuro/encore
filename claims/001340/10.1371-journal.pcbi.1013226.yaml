# Claims for Qü, Tai, Hall, Tu, Eckstein, Mishchanchuk, Lin, Chase, MacAskill, Collins, Gershman
# & Wilbrecht (2025), "Nucleus accumbens dopamine release reflects Bayesian inference during
# instrumental learning", PLoS Comput Biol 21(7) e1013226, on dandiset 001340.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read. The version of record as served by Europe PMC (PMC12233953, "vor-update-to-uncorrected-
# proof", publication update 2025-07-07), full text with Results, figure legends, Table 1, Materials
# and methods, and the Supporting information legends (S1 to S8 Fig) and the published peer review
# history. The supporting figures themselves are images and are not in the text; only their
# legends are, so claims from S1 to S8 Fig rest on the legends and on the Results sentences that
# cite them. No PDF was supplied. The bioRxiv preprint (10.1101/2023.11.10.566306) is also under
# paper/; it was not used, and no claim or method rests on it.
#
# Code. The paper links github.com/Wilbrecht-Lab/cogmodels, read at commit 589555c ("preliminary
# codebase", 2025-02-20). It holds the cognitive models (RL4p, RLCF, RLFQ3p, RL_meta, PearceHall,
# RFLR, BIfp, BRLfwr, BRLfw, BRLwrp and others), their maximum-likelihood fitting, simulation
# ("generate", a fresh task; "emulate", the model choosing on a mouse's sessions), parameter
# recovery and model identification drivers (utils_test.py), and a plot of stay probability by
# two-trial history. It holds no behavioural preprocessing, no photometry preprocessing, and none
# of the neural analyses (DA-PT, the RPE regressions, cross-validation, the LMER models). Choices
# the code settles, used below:
# - Fits are per mouse over all its sessions (fit_model_per_subject), L-BFGS-B with the code's
#   bounds, tol 1e-6, one start drawn from the Methods' initial distributions; seed 230 is a
#   standard choice that cannot change an outcome. AIC = 2k + 2 NLL per mouse, k the number of
#   fitted parameters.
# - Miss trials (no choice, Decision -1) are left out of the likelihood and give a stickiness
#   term of 0 on the next trial. At each new session the belief returns to 0.5 and Q values and
#   BRL weights to their initial values (gam = 1).
# - Parameter bounds. beta, phi >= 0; learning rates, zeta, psi, alpha_nu in [0, 1]; q in
#   [0.001, 1]; RFLR tau >= 1e-4, RFLR phi unbounded and beta fixed at 1 (as the Methods say).
#   rho_2 = 1e-4, rho_1 = 0.75 and BRLfwr w1 starts at 0.75.
# - PearceHall has beta, alpha+, alpha-, phi, psi and zeta (k = 6), with alpha_nu a latent that
#   starts at 1 and Q values at 0. Table 1 lists alpha+, alpha-, phi, alpha_nu and zeta; the
#   code's list is used, as Eq 2 applies beta to every model and Eq 16 names psi.
# - RL_meta has 7 parameters as in Table 1; omega starts at 0 and alpha-_t at alpha-.
# - Parameter recovery and model identification simulate 500 sessions per model of 500 trials,
#   one session each, with parameters drawn uniformly between the minimum and maximum fitted
#   over the mice, a 75-0 task, and blocks of 8 to 15 rewards (the default of generate()).
# Where the code and the Methods disagree, the Methods are followed and the code is a variant:
# - RLFQ3p forgetting. The Methods say zeta = (alpha+ + alpha-)/2; Table 1 and the code
#   (RL_Forgetting3p) use zeta = 1 - (alpha+ + alpha-)/2. Both are run.
# - BIfp pseudo-RPE. The Methods define it as the difference between observed and expected
#   reward, read here as r - [rho_1 b(c) + rho_2 (1 - b(c))], with b(c) the belief that the
#   chosen port is correct. The code's latent is r - b(c)/2 (BIModel.calc_q). Both are run.
# - Simulations. The Methods say 1000 simulated data sets per model; S2 Fig legend says 500
#   runs; the code uses 500. The Methods' task has blocks of 7 to 23 rewards; the code's
#   simulations use 8 to 15. Both are run.
#
# Data the paper describes. Five male C57Bl/6 mice (bred in-house, 104 to 167 days old) with AAV
# dLight (dLight1.3b or dLight1.2) and optic fibres in nucleus accumbens core. A two-armed bandit
# with three nose-poke ports: a centre poke starts a trial, then a left or right poke is the
# choice. In the "full task" the correct port gives 2 ul water with probability 0.75 and the
# other port never does; the correct port switches, uncued, after a number of rewards drawn
# uniformly from 7 to 23. Each mouse ran 14 daily full-task sessions, recorded in a left
# hemisphere, right hemisphere, no recording sequence. Photometry with a Neurophotometrics
# FP3001 at 20 Hz, 470 nm dLight channel and 415 nm isosbestic channel. Measured per trial. the
# choice, the reward, the correct port, and event times centre in (CI), centre out (CO), side in,
# outcome (O), zeroth side out (SO0), first side out (SO1), last side out (SOf). The paper
# reports 34 sessions with valid dopamine recordings, 30,707 trials in total, and 20,952 trials
# after cleaning. The dataset's title and description on DANDI were not read further than to
# know it is meant to hold these behaviour and photometry recordings (Data Availability).
#
# Definitions used by several criteria, all from the paper unless marked.
# - Correct choice. The choice of the port that is rewarded in the current block. A block switch
#   is the first trial of a new block. Stay and switch compare the choice at t with t-1; the
#   first trial of a session is neither (code, add_switch). Trials with no choice are dropped
#   from behavioural measures (Methods, Task behavior analysis).
# - Timing measures (Methods, Task behavior analysis). MVMT = CI(t) - SOf(t-1); center_dur =
#   CO - CI; port_dur = SO1 - O; SO_lat = SO1 - SO0.
# - Z(DA) (Methods, Fiber Photometry, Neural data analysis). Trends of both channels removed
#   with airPLS, a robust linear regression of 415 nm onto 470 nm subtracted from 470 nm, then
#   z-scored per session. The airPLS settings and the robust regression's loss are not given.
#   If the dataset holds processed dLight, it is used; otherwise these steps with standard
#   settings, recorded as a deviation. Aligned to outcome by interpolation and de-based by
#   subtracting its value at outcome time.
# - DA-PT (Results, Predictions from BRLfwr and BIfp, paragraph 4; Fig 4B legend). The maximum
#   of de-based Z(DA) in the 1 s after outcome on rewarded trials, the minimum on unrewarded
#   trials.
# - Sessions for neural analyses. The 34 sessions with valid recordings. The Methods select
#   them by visual inspection and an AUC-ROC above 0.9 between the rescaled 415 nm baseline and
#   the 470 nm recording, with no sharp discontinuities; visual inspection cannot be redone. If
#   the dataset marks the sessions, those are used; otherwise the AUC-ROC rule, read as the
#   ROC AUC separating 470 nm samples from rescaled 415 nm samples, and the count of sessions
#   kept is reported.
# - Cleaned trials (Methods, Neural data analysis). center_dur <= 0.8 s, port_dur <= 6 s,
#   MVMT <= 3 s, and SO_lat not above a limit that the Methods give twice and differently
#   ("SO_lat01 > 1" and "gaps longer than 6s"); readings 1 s and 6 s. Rows with missing neural
#   or behavioural entries dropped.
# - Model RPE (Methods, Computational modeling; code). Each model fitted to the mouse's choices
#   as above, then run on the mouse's own choices and rewards with its fitted parameters; the
#   RPE of trial t is r_t - Q_t(c_t) (code, sim latent rpe). BIfp as above.
# - Three-trial histories (Results, Bayesian models and complex RL models, paragraph 2). t-3 is
#   A (rewarded) or a (unrewarded); t-2 and t-1 are A/a when at the port of t-3 and B/b when at
#   the other port. Switch probability at t compares t with t-1.
# - Tolerances. 10% of the value when the paper gives no uncertainty; the paper's 95% CI when it
#   gives one, with the tolerance the larger distance from the value to a bound and the
#   criterion asking the result to lie inside the interval itself; the paper's ± for the
#   relative AIC values. Counts of mice and sessions are exact.
# - Readings. Where a claim lists readings of a reported number, it matches if it matches under
#   any of them. Where a claim lists readings of a method detail, its outcome is the one all
#   readings give, and it is methods_underspecified when they differ.
