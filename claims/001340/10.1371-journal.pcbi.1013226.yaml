    legend gives none. Fitted with a binomial GLM (code). Reproduced when in every mouse the
    lag-1 choice-by-reward weight is positive and the largest of the four, and the mean over
    mice falls from lag 1 to lag 4; partially reproduced when this holds in 3 or 4 mice. The
    S6 Fig B blocking model is described but no result is stated, so it has no claim.
