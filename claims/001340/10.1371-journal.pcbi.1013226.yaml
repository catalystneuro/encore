- id: fig4f-bayesian-rpe-fit
  statement: RPEs of BIfp and BRLfwr explain outcome dopamine better than RL4p RPEs and better
    than RLCF, RLFQ3p, RL_meta and PearceHall, by cross-validated log-likelihood.
  source: Results, Predictions from BRLfwr and BIfp, paragraph 4; Fig 4F
  quote: we found that both BIfp and BRLfwr models yielded larger relative log-likelihood ( Δ
    llk CV ) than the RL4p baseline, evaluated on cross validation sets (70-30) for each animal
    ... Both Bayesian models also outperformed other complex RL models on this measure
  statistics:
