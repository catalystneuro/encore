- id: fig4bc-no-laterality
  statement: Choice laterality relative to the recorded hemisphere has no significant effect on
    outcome dopamine (p = 0.523).
  source: Results, Predictions from BRLfwr and BIfp, paragraph 2; Fig 4B and 4C
  quote: There was no significant effect of hemisphere (laterality, contra or ipsi relative to
    reward port) on NAc dopamine release (p = 0.523)
  statistics:
  - test: OLS coefficient
    p: 0.523
  depends_on:
  - fig4bc-reward-omission
  criterion: A claim of absence, judged on the paper's test, the laterality coefficient of the
    four-factor OLS of fig4bc-reward-omission. Reproduced when its p >= 0.05 under the
    readings of that claim; not reproduced when it is below. The coefficient is reported.
- id: fig4de-port-duration
  statement: The duration of the outcome dopamine response follows the time the mouse stays at
    the reward port, with the trough after omissions reached just after the mouse leaves.
  source: Results, Predictions from BRLfwr and BIfp, paragraph 3; Fig 4D and 4E
  quote: When we visualized single trial dopamine traces around "outcome" events, we found that
    the temporal span of the dopamine response qualitatively aligned with the amount of time
    mice stayed at the peripheral reward port
  criterion: The paper shows this only qualitatively, in heatmaps sorted by port_dur. Read as
    (1) on rewarded trials, the Spearman correlation between port_dur and the time after
    outcome at which de-based Z(DA) first falls below half its peak after the peak is
    positive with p < 0.05; (2) on unrewarded trials, the Spearman correlation between
    port_dur and the time of the minimum in 0 to 6 s after outcome is positive with p < 0.05,
    and the median of (trough time - port_dur) lies between 0 and 1 s. Cleaned trials of the
    34 sessions, pooled. Reproduced when all hold; partially reproduced when (1) and the
    correlation of (2) hold.
- id: trial-cleaning-counts
  statement: After trial cleaning 20,952 trials (about 68% of the data) remain across 34
    sessions with valid dopamine recordings.
  source: Methods, Neural data analysis, paragraph 2
  quote: After this cleaning, we were left with 20952 trials ( ~ 68 % of the dataset) across 34
    sessions with valid dopamine recordings
  expected:
  - quantity: cleaned trials
    value: 20952
    tolerance: 2095
  - quantity: sessions with valid recordings
    value: 34
    tolerance: 0
  criterion: Sessions and cleaning as in the opening comment, under both SO_lat limits.
