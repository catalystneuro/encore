      level: 0.95
      low: 60.84
      high: 102.79
  - about: BIfp
    test: 95% bootstrapped confidence interval
    ci:
      level: 0.95
      low: 65.71
      high: 217.5
  - about: RLCF
    test: 95% bootstrapped confidence interval
    ci:
      level: 0.95
      low: -47.03
      high: 4.64
  - about: RLFQ3p
    test: 95% bootstrapped confidence interval
    ci:
      level: 0.95
      low: 4.98
      high: 33.31
  - about: RL_meta
    test: 95% bootstrapped confidence interval
    ci:
      level: 0.95
      low: 7.96
      high: 33.9
  - about: PearceHall
    test: 95% bootstrapped confidence interval
    ci:
      level: 0.95
      low: 6.04
      high: 32.83
  expected:
