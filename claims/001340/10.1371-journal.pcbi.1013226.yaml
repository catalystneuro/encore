- id: fig2b-model-identifiability
  statement: In model identification, the Bayesian model and the hybrid BRL are poorly told
    apart, and so are the complex RL models (RL_meta, RLFQ3p, RFLR), but the families can be
    told apart and the standard RL model RL4p can be rejected.
  source: Results, Cognitive model fitting confirms, paragraph 4; Fig 2B
  quote: This revealed relatively poor identifiability between the Bayesian model and the
    hybril BRL, as well as poor identifiability between the complex RL models (RL_meta,
    RLFQ3p, RFLR). These results indicate that the 2ABT cannot be used to discriminate within
    each family of model on the basis of behavioral data, but can discriminate across families
  criterion: The 8 models (RL4p, RLCF, RFLR, BRLfwr, BIfp, RLFQ3p, RL_meta, PearceHall), each
    simulated from parameters drawn uniformly over the range fitted to the mice, each
    simulated set fitted with all 8, the best by lowest AIC, and the confusion matrix P(fit j
    | simulated i) (Methods, Model identification). Simulation readings (a) Methods, 1000
    sets per model on the 7 to 23 reward blocks; (b) code, 500 sets of 500 trials on 8 to 15
    reward blocks. The paper gives no threshold for "poor" or "can discriminate"; read as
    (1) BIfp and BRLfwr each send more of their row to the other than any non-Bayesian model
    takes, and at least one of the two has a diagonal below 0.5; (2) the same within RL_meta,
    RLFQ3p and RFLR; (3) for every row, the summed probability on its own family (Bayesian =
    BIfp, BRLfwr; complex RL = RL_meta, RLFQ3p, RFLR, PearceHall; RL4p and RLCF each alone) is
    above 0.5; (4) the RL4p row's diagonal is its largest entry and no other row gives RL4p
    more than 0.2. Reproduced when all four hold; partially reproduced when (3) and (4) hold.
    The full matrix is shown.
- id: figs2-parameter-recovery
  statement: Parameters are recovered well for the Bayesian models such as BRLfwr, while
    RL_meta, the most complex model with 7 parameters, has poor parameter identifiability.
  source: S2 Fig legend; Results, Bayesian models and complex RL models, paragraph 4; Methods,
    Model fitting and comparison
  quote: However, RL_meta was also the most complex model with 7 parameters, with poor
    parameter identifiability ( S2 Fig ). One might therefore argue that that the Bayesian
    model BRLfwr was better because it exhibited good parameter recovery
  criterion: For each model, parameters drawn uniformly between the minimum and maximum fitted
    over the mice (S2 Fig legend), behaviour simulated and refitted; Pearson r between true
    and fitted values per parameter, after dropping fitted values more than 6 SD from the
    mean true value as the legend and code do. Simulation readings as in
    fig2b-model-identifiability. The Methods' sentence that all three model classes recover
    parameters with high correlation conflicts with poor identifiability for RL_meta; the
    claim follows the Results. No threshold is given; read as good when every parameter has
    r >= 0.7 and poor when at least one has r < 0.5. Reproduced when BRLfwr is good and
    RL_meta is poor; partially reproduced when one of the two holds. All r values are shown.
- id: brlfw-alpha-zero
  statement: In the unrestricted BRL model (BRLfw) the fitted learning rate alpha was zero for
    most subjects, making it equivalent to BIfp in this task.
  source: Methods, Computational modeling, paragraph on BIfp
  quote: Interestingly, the best fitted parameter for α in the unrestricted BRL version (BRLfw)
    above was zero for most subjects
  criterion: BRLfw as in the code (BRL_fw, both weights updated, Eqs 7 and 8, initial weights
    0.75 and 1e-4), fitted per mouse. Zero is read as the lower bound to the optimiser's
    precision (alpha < 1e-6). Reproduced when this holds in at least 3 of the 5 mice. The
    fitted values are reported.
- id: figs8-brlwrp-no-difference
  statement: A BRL model with fitted initial reward weight and reward probability (BRLwrp)
    does not differ from BRLfwr in explaining behaviour or dopamine.
  source: S8 Fig legend; Methods, Computational modeling, paragraph on BRL
  quote: No statistical differences were observed between BRLfwr and BRLwrp in their ability
    to explain mice behavior and dopamine data
  depends_on:
  - fig4f-bayesian-rpe-fit
  criterion: A claim of absence. BRLwrp as in the code (BRL_wrp, wr0 and p_rew fitted). The
    test is not named; read as the paper's model comparison tests. For behaviour, a
    two-sided t-test of the 5 per-mouse AIC differences, p >= 0.05; for dopamine, the 95%
    bootstrapped CI of the Δllk_CV difference (as in fig4f-bayesian-rpe-fit) contains 0.
    Reproduced when both hold; not reproduced when either finds a difference. Effect sizes are
    reported. The Methods cite S8 Fig for a different comparison, BRLfwr against the
    unrestricted BRL (BRLfw, "which we found to perform just as well"); the claim follows the
    legend, and the same tests of BRLfw against BRLfwr are shown as a variant.
- id: figs7-no-change-across-sessions
  statement: Models fitted to single sessions show no sustained, consistent change in model
    fitness across the full-task sessions, so no change of strategy across days.
  source: S7 Fig legend; Discussion, paragraph 6
  quote: We did not find evidence of any significant and consistent increase in model fitness
    across multiple sessions
  criterion: A claim of absence; the paper names no test. Each model fitted per mouse and
    session (behaviour, Discussion paragraph 6). The legend does not say whether "model
    fitness" is relative to RL4p or absolute; readings (a) per session relative AIC to RL4p,
    (b) per session AIC divided by the number of trials with a choice; for BIfp and BRLfwr.
    Read as an OLS of the 70 per-session values on session number, for each Bayesian model.
    Reproduced when neither slope is negative (improving) with p < 0.05; not reproduced when
    either is. The slopes are reported under both readings.
- id: fig2f-adaptation-after-switch
  statement: BRLfwr and RLCF adapt to block switches faster than RL4p, resembling the mice.
  source: Results, Bayesian models and complex RL models, paragraph 1; Fig 2F
  quote: we observed that BRLfwr and RLCF predicted faster adaptation to block switches
    compared to RL4p, resembling the adaptation rate of mouse switching behavior
  criterion: P(correct) by trial after block switch, block trials 0 to 10 (the code's
    behaviour plot uses blockTrial <= 10, the first trial of a new block being 0). Model
    behaviour readings (a) the code's emulate, the model choosing on each mouse's sessions with
    its fitted parameters; (b) the code's generate, fresh sessions with each mouse's
    parameters, on 7 to 23 or 8 to 15 reward blocks. Measure, the mean P(correct) over block
    trials 0 to 10. Reproduced when BRLfwr and RLCF each exceed RL4p and are each closer to
    the mice's mean than RL4p is.
- id: fig3b-sse
  statement: Against mouse switch probabilities after each three-trial history, the models'
    errors are RL4p 0.8270, RLCF 0.2748, BRLfwr 0.1796, RFLR 0.1537, PearceHall 0.1084 and
    RL_meta 0.0787; RL4p fits worst.
  source: Results, Bayesian models and complex RL models, paragraph 3; Fig 3A and 3B
  quote: We then compared the average mouse switch probability after each outcome history
    against the mean predictions of the three different cognitive models ( Fig 3B ; sum of
    squared errors (SSE)
  expected:
  - quantity: SSE, BRLfwr
    value: 0.1796
    tolerance: 0.018
  - quantity: SSE, RL4p
    value: 0.827
    tolerance: 0.0827
  - quantity: SSE, RLCF
    value: 0.2748
    tolerance: 0.0275
  - quantity: SSE, RFLR
    value: 0.1537
    tolerance: 0.0154
  - quantity: SSE, RL_meta
    value: 0.0787
    tolerance: 0.0079
  - quantity: SSE, PearceHall
    value: 0.1084
    tolerance: 0.0108
