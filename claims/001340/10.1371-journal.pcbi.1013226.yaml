- id: figs6a-decaying-history-weights
  statement: Logistic regressions fitted to each mouse show weights of past choice-outcome
    history that decay for more distant trials, consistently across mice.
  source: S6 Fig A legend; Results, Mice rapidly adapt to block switches in the 2ABT, paragraph 3
  quote: we fitted logistic regression models to individual mice behavior data and identified
    consistent patterns of decaying choice outcome weights for more distant outcome histories
  criterion: Per mouse, the S6 Fig A model following Beron et al. 2022, choice at t on lagged
    choice (coded -1/1), reward, and their product; this is the code's LR class (formula
