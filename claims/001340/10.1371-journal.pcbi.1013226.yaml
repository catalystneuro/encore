  - about: omission
    test: OLS coefficient
    p: 0.00001
    p_relation: "<"
    ci:
      level: 0.95
      low: -1.604
      high: -1.564
  expected:
  - quantity: reward coefficient
    value: 1.6345
    tolerance: 0.022
  - quantity: omission coefficient
    value: -1.584
