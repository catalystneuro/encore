  - quantity: relative AIC around switch, RL_meta
    value: -163.9207
    tolerance: 16.39
  - quantity: relative AIC around switch, PearceHall
    value: -158.9066
    tolerance: 15.89
  criterion: The models fitted to all trials, the AIC taken over the first 5 trials after each
