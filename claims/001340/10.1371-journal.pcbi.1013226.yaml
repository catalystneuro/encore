- id: fig3a-both-port-contexts
  statement: After histories with rewards at both ports in the last 3 trials, mice rarely
    switched (0.2143) and BRLfwr predicted a similar rate (0.1801), while RL4p overestimated it
    (0.4328); RLCF gave 0.2248 and RFLR 0.2778.
  source: Results, Bayesian models and complex RL models, paragraph 3; Fig 3A
  quote: Since these outcome contexts occurred only around block switches, mice usually stayed
