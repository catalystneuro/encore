    value: 0.85
    tolerance: 0.09
  - quantity: RL4p alpha-
    value: 0.73
    tolerance: 0.02
  criterion: RL4p fitted per mouse as in the opening comment; the mean of the 5 mice's
    values. The narrow CI for alpha- may come from per-session fits; reading (b) is the mean
