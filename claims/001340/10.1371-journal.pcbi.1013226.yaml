  - quantity: Δllk_CV, RLCF
    value: -19.23
    tolerance: 27.8
  - quantity: Δllk_CV, RLFQ3p
    value: 18.85
    tolerance: 14.46
  - quantity: Δllk_CV, RL_meta
    value: 22.54
    tolerance: 14.58
  - quantity: Δllk_CV, PearceHall
    value: 19.5
    tolerance: 13.46
  depends_on:
