    tolerance: 0.091
  criterion: Cleaned trials. R_chosen is the number of rewarded trials among t-1 to t-4 at the
    port chosen at t, R_unchosen at the other port; Reward the outcome at t; Switch and Stay
    indicators of trial t. The Methods' lme4 formula DA ~ Reward:Switch + R_chosen:Switch +
    Switch + R_unchosen:Switch + 1 + Reward:Stay + R_chosen:Stay + R_unchosen:Stay, each term
    with a by-Subject random effect. Not given; readings of the random part (a) (term |
    Subject) for each term, (b) uncorrelated random slopes (0 + term | Subject) plus (1 |
    Subject); of DA, (i) DA-PT, (ii) mean de-based Z(DA) over 0 to 1 s; Wald CIs. Reproduced
    when, under one reading, both slopes have the paper's sign with CI excluding 0 and lie in
    the paper's intervals; partially reproduced when the signs hold with CI excluding 0 but a
    value lies outside.
- id: fig4j-lmer-stay
  statement: On stay trials, past rewards at the chosen port reduce outcome dopamine (slope
    -0.09), as all models predict.
  source: Results, Predictions from BRLfwr and BIfp, paragraph 8; Fig 4J
  quote: All models predicted a negative relationship between R_chosen and RPE signal, matching
    the dopamine observation (slope estimate
  statistics:
  - test: linear mixed effects model (lme4)
    p: 0.01
    ci:
      level: 0.95
      low: -0.11
      high: -0.07
  expected:
  - quantity: R_chosen slope, stay trials
    value: -0.09
    tolerance: 0.02
  depends_on:
  - fig4i-lmer-switch
  - fig4i-model-runchosen
  criterion: The same model and readings as fig4i-lmer-switch, the R_chosen:Stay term; model
    predictions as in fig4i-model-runchosen. Reproduced when, under one reading, the slope is
    negative with CI excluding 0 inside [-0.11, -0.07] and every model's R_chosen:Stay
    coefficient is negative; partially reproduced when the data slope holds outside its
    interval.
- id: fig4i-model-runchosen
  statement: On switch trials BIfp, BRLfwr and RLCF predict a positive effect of past rewards
    at the other port on the RPE, while the other RL models predict little or none.
  source: Results, Predictions from BRLfwr and BIfp, paragraph 8; Fig 4I right
  quote: On animal switch trials, both BIfp, BRLfwr, and RLCF predicted a positive effect of
    R_unchosen, but other RL models predicted little to no effect
  criterion: Model RPEs regressed with the fixed part of the fig4i-lmer-switch formula by OLS,
    without subject effects (Methods, Linear mixed effects modeling). The Methods speak of
    model simulated data with a uniform sample size per simulated session; readings (a) the
    code's generate with each mouse's fitted parameters, one simulated session per real
    session of the same length, on 7 to 23 or 8 to 15 reward blocks; (b) RPEs of the models
    run on the mice's own trials. "Little to no effect" is read as not significantly positive
    at p < 0.05, or below half the smallest of the three positive coefficients. Reproduced
    when, under every reading, the R_unchosen:Switch coefficient is positive with p < 0.05 for
    BIfp, BRLfwr and RLCF and "little to no" for RL4p, RLFQ3p, RL_meta and PearceHall.
- id: figs5-per-animal
  statement: Dopamine results are qualitatively consistent across animals; per-animal
    regressions on switch trials resemble the Bayesian model predictions in all but one
    animal, and switch-stay differences in outcome responses are consistent across animals.
  source: S5 Fig legend
  quote: All but one animal showed a strong qualitative resemblance to Bayesian model
    predictions for Switch trials
  depends_on:
  - fig4i-lmer-switch
  criterion: Per animal, OLS with the fixed part of the fig4i-lmer-switch formula. Read as
    resemblance when the R_chosen:Switch coefficient is negative and R_unchosen:Switch is
    positive, the sign pattern BRLfwr and BIfp predict. Reproduced when 4 of the 5 animals
    show it and, in at least 4 animals, mean DA-PT of rewarded switch trials exceeds rewarded
    stay trials and unrewarded stay trials are below unrewarded switch trials (S5 Fig A);
    partially reproduced when 3 animals show the regression pattern.
- id: reward-switch-reward-count
  statement: Only 94 trials start a reward, switch, reward sequence, out of 30,707 trials.
  source: Discussion, paragraph 5
  quote: Yet in our dataset, there are only 94 trials initiating such sequences out of 30,707
    trials in total
  expected:
  - quantity: trials starting a reward-switch-reward sequence
    value: 94
    tolerance: 9.4
  - quantity: trials in total
    value: 30707
    tolerance: 3071
  criterion: A trial rewarded at one port followed, in the same session, by a choice of the
    other port that is rewarded. Readings of the trial set (a) the 34 sessions with valid
    recordings (20,952 is about 68% of 30,707, which fits this), (b) all recorded sessions,
    (c) all 70 sessions. Reproduced when, under one reading, both counts are within tolerance.
- id: figs4-lmer-feature-sets
  statement: In cross-validated R2 of dopamine regressions, the 3R+Sw feature set (Reward,
    R_chosen and R_unchosen, each split by switch and stay trials) captures a similar level of
    variance to L0:R, the standard set of trial-back choice and reward interactions; 4 lags were
    used at the expense of about 1% of variance explained.
  source: S4 Fig legend; Methods, Linear mixed effects modeling
  quote: Together we found that 3R+Sw was enough to capture similar levels of variance compared
    to L0:R. We used 4 lags because it allows us to capture a relatively high amount of past
    outcome levels, with only the expense of 1% variance explained
  depends_on:
  - fig4i-lmer-switch
  criterion: Cleaned trials, DA-PT as the output (the legend keeps dopamine as the output
    variable). Feature sets from the S4 Fig legend, L0:R (choice, reward and their interaction
    for each trial back) and 3R+Sw (the fixed part of the fig4i-lmer-switch formula). Not given
    (the regression type, the cross-validation scheme, the lags compared, and what the 1% is
    measured against); readings (a) OLS with the 70-30 splits of fig4f-bayesian-rpe-fit, (b)
    the LMER of fig4i-lmer-switch with the same splits; lags 1 to 8. Read "similar" as a
    cross-validated R2 of 3R+Sw at 4 lags within 0.01 of L0:R at 4 lags, and the 1% as the R2
    of 3R+Sw at 4 lags within 0.01 of its best over lags, or of L0:R's best. Reproduced when
    both hold under every reading; partially reproduced when the first holds. All R2 values
    are shown.
