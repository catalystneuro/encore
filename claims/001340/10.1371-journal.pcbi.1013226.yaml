  statement: Outcome dopamine is shifted upward on switch trials (coefficient 0.5030); reward
    responses are larger when mice have just switched ports, and omission dips are larger
    when they stayed.
  source: Results, Predictions from BRLfwr and BIfp, paragraph 2; Fig 4B and 4C
  quote: We observed a significant Z(DA) difference (OLS coefficient estimate for switch
  statistics:
  - test: OLS coefficient
    p: 0.00001
    p_relation: "<"
    ci:
      level: 0.95
      low: 0.454
      high: 0.552
  expected:
  - quantity: switch coefficient
    value: 0.503
    tolerance: 0.049
