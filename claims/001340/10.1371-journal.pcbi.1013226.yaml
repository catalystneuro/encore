- id: fig4bc-reward-omission
  statement: Rewards are followed by an increase of NAc dLight signal (estimate 1.6345) and
    omissions by a decrease (estimate -1.5840).
  source: Results, Predictions from BRLfwr and BIfp, paragraphs 1 and 2; Fig 4B and 4C
  quote: After mice received a water reward, we observed a dLight dopamine signal (Z(DA))
    increase on average (estimate ... When reward was omitted at the peripheral port, we
    observed a reduction (OLS estimate
  statistics:
  - about: reward
    test: OLS coefficient
    p: 0.00001
    p_relation: "<"
    ci:
      level: 0.95
