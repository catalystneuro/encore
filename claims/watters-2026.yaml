- id: ext2-stimulus-delay-activity
  statement: Neurons are typically active in both the stimulus and the delay phase, and a unit's
    spatial preference is similar across the two phases.
  source: Results, The Triangle Dataset, paragraph 1; Extended Data Fig. 2a and 2b
  quote: We found that neurons were typically active in both stimulus and delay phases ( Extended
    Data Fig. 2 )
  criterion: >-
    Triangle units (T5), per monkey. Panel a, the stimulus-phase (0 to 1000 ms after stimulus onset)
    against the delay-phase mean rate (T4) per unit; panel b, per unit and triangle location, the
    1-object mean rate at that location divided by the unit's mean over locations, stimulus phase
    against delay phase, for DMFC and FEF apart, as the legend defines it. The paper gives no test.
    Readings of "typically active in both": (a) the Pearson and (b) the Spearman correlation across
    units of panel a's rates is positive at p < 0.05, for both monkeys; (c) more than half of the
    units, all above 1 Hz in the delay phase by T5, are also above 1 Hz in the stimulus phase (the
    Methods' activity threshold applied to the other phase). Panel b is judged by readings (a) and
    (b) per monkey and area. Reproduced when all three readings hold for panel a in both monkeys and
    (a) and (b) hold for at least three of the four panel b plots; not reproduced when none hold;
    methods_underspecified when they differ. The second half of the statement is read from the
    title of the panel b legend, "Correlation in spatial selectivity across stimulus and delay
    phases"; the three-of-four rule is the agent's reading. The correlations and shares are
    reported.
- id: ext3ab-decoding
  statement: Single-trial delay-phase activity carries information about object positions and
    identities, decoded above a shuffled-label control.
  source: Results, The Triangle Dataset, paragraph 1; Extended Data Fig. 3a and 3b
  quote: We also found that neural activity contained information about object positions and
    identities ( Extended Data Fig. 3a-b )
  criterion: >-
    As the Extended Data Fig. 3 legend and figures/supp_fig_decoding/ fix it, on the three Triangle
    sessions with the most units entering the models (T7; the code's analysis notebook uses Perle
    2022-05-31, 2022-06-01 and 2022-06-04): a linear decoder (MSE loss to a one-hot target, L1
    weight 0.003, SGD at learning rate 0.01, 10,000 steps, config_1_triangle.py) from single-trial
    rates of the stimulus and delay phases, ten 80/20 train/test splits, against the same with
    shuffled labels. Panel a decodes the location or identity of 1-object trials; panel b, on
    2-object trials, the absent location or identity. The paper sets no rule for "above control";
    readings (a) the neural accuracy exceeds the shuffled accuracy in all ten splits; (b) the mean
    neural accuracy exceeds the shuffled mean by more than two standard deviations of the shuffled
    splits. Reproduced when, under both readings, delay-phase position and identity decoding of
    panel a are above control in all three sessions; panel b is reported, with the legend's 66%
    mark.
- id: ext3c-decoder-orthogonality
  statement: The coding axes of a two-object decoder come out nearly orthogonal even for synthetic
    data with no slot structure, so decoder orthogonality does not diagnose slots.
  source: Methods, Decoding Analyses, paragraphs 1 and 4; Extended Data Fig. 3c
  quote: However, we found that this orthogonality resulted even on synthetic data that was
    specifically not Slot-like. In other words, orthogonality of these decoding subspaces is not
    diagnostic of object slots.
  criterion: >-
    The 2-object decoder of Methods, Decoding Analyses (two linear decoders and a per-trial
    assignment sigma pressed to be binary; figures/supp_fig_decoding/modeling/models.py,
    LinearModel2Objects) fitted on 2-object trials of the three Triangle sessions of
    ext3ab-decoding and of the three Ring sessions with the most units entering the models (the
    Extended Data Fig. 3 legend picks three sessions from each dataset; the code's run_2_ring.py uses
    Perle 2022-06-09, 2022-06-10 and 2022-06-11), and on the Receptive Field and Orthogonal synthetic
    datasets built from them as Methods describe; angles between corresponding columns of W0 and W1
    for each location, over ten bootstraps, stimulus and delay phases. The paper gives no threshold
    for "orthogonal". Reproduced when the angles for the neural data and for the Receptive Field
    data are both centred near 90 degrees, read as (a) a median between 75 and 105 degrees and (b) a
    median within 10 degrees of the Orthogonal dataset's median; both cut-offs are the agent's.
    Not reproduced when neither reading holds; methods_underspecified when they differ.
- id: fig2b-selectivity-range
  statement: Delay-phase position and identity AUCs on 1-object trials span a wide range across
    units.
  source: Results, The Triangle Dataset, paragraph 1; Figure 2b
  quote: A Receiver Operating Characteristic analysis of firing rates in the delay phase revealed a
    wide range of selectivities for position and identity across neurons ( Fig. 2b )
  criterion: >-
    Position and identity AUC (T6) of every Triangle unit (T5) per monkey, with significance at
    p < 0.05 as the legend shades it. The paper gives no number for "wide". Reproduced when, for both
    monkeys and both features, the AUCs run from near 0.5 (lowest decile below 0.6) to high values
    (highest decile above 0.7), with both significant and non-significant units present; the
    deciles are reported under both p-value methods of T6. These cut-offs are the agent's reading of
    "wide range" and are recorded as such.
- id: fig2d-signal-noise-triangle
  statement: In the Triangle dataset, pairs of neurons with similar 1-object tuning have positive
    noise correlations on 2-object trials, and dissimilarly tuned pairs negative ones.
  source: Results, The Triangle Dataset, paragraph 2; Figure 2d
  quote: Pairs of neurons with similar selectivities on 1-object trials tended to have positive noise
    correlations on 2-object trials ... Conversely, dissimilarly tuned pairs of neurons tended to have
    negative noise correlations.
  criterion: >-
    Pairs of simultaneously recorded Triangle units, per monkey, delay-phase rates (T4). Main method,
    Methods, Noise Correlations: signal correlation is the correlation across the 9 1-object
    conditions of the two units' mean rates, pairs dropped unless each condition has at least 3
    trials; noise correlation is the mean over the 18 2-object conditions (identity included) with
    at least 3 shared trials of the across-trial correlation. Variant, the paper's
    figures/figure_2/noise_correlations/run_compute_triangle.py: per pair and per triple of two
    1-object conditions and their 2-object composite, the signal correlation from the two 1-object
    conditions with trials shuffled between units, the noise correlation on the composite, units
    above 1 Hz, rows kept with more than 5 trials in each condition. As in
    plot_noise_vs_signal_correlation.ipynb, signal correlation is cut into 6 bins with edges at
    linspace(-0.8, 0.8, 7), ends open, and the mean noise correlation per bin is shown with its 95%
    confidence interval. The paper gives no test. Reproduced when, for both monkeys, the bin of
    highest signal correlation has a mean noise correlation above zero and the lowest bin one below
    zero, each with a 95% interval excluding zero; partially reproduced when only the rise from the
    lowest to the highest bin holds (non-overlapping intervals). Both methods are run; when they
    differ the claim is methods_underspecified.
- id: fig4a-gain-best-triangle
  statement: On the Triangle dataset the Gain model has a higher cross-validated model likelihood
    than the Slot and Switching models, in 88% of sessions and in every session with at least 100
    simultaneously recorded units.
  source: Results, Modeling Results, paragraph 1; Figure 4a
  quote: Across sessions, the Gain model had a higher cross-validated likelihood than the Slot and
    Switching models ( Fig. 4a ). This held for 88% of sessions, including all sessions with at least
    100 simultaneously recorded units.
  statistics:
  - about: Gain against Slot and against Switching, mean model likelihood, per monkey
    test: significance of the difference of the mean (Figure 4a brackets)
    p: 0.05
    p_relation: "<"
    n: 10 sessions of Monkey P and 14 of Monkey E, 10 train/test splits each
  expected:
  - quantity: share of Triangle sessions where Gain has the highest model likelihood
    value: 0.88
    tolerance: 0.088
  - quantity: share of Triangle sessions with at least 100 modeled units where Gain is highest
    value: 1.0
    tolerance: 0
  criterion: >-
    Models fitted and compared as T7 on all 24 Triangle sessions. A session's winner is the model of
    highest mean model likelihood over its splits. The test behind the brackets is, in
    model_comparison.ipynb, an independent two-sample t-test (scipy ttest_ind) between two models'
    session-by-split likelihoods, per monkey; the legend marks p < 0.05 while the notebook draws
    brackets at p < 0.01, and both thresholds are reported. Reproduced when Gain's mean likelihood
    exceeds both others' for both monkeys with t-test p < 0.05, and the two expected shares hold.
    "At least 100 units" is read as at least 100 modeled units (T7); the notebook's > 100 is shown
    as a variant. Unit stability threshold of T5 (500 against 200 trials) is run both ways. The
    paper's notebook printed 12 of 14 sessions for E and 10 of 10 for P. A full refit is the test;
    the bracket pattern of the figure could not be read (no PDF).
- id: ext6-gain-best-areas
  statement: The Gain model's advantage holds in DMFC alone, in FEF alone, and in single neurons
    alone.
  source: Results, Modeling Results, paragraph 1; Extended Data Fig. 6
  quote: The results were consistent across both DMFC and FEF ( Extended Data Fig. 6 )
  depends_on:
  - fig4a-gain-best-triangle
  criterion: >-
    As fig4a-gain-best-triangle, restricted as the Extended Data Fig. 6 legend fixes it to 8 Triangle
    sessions (the four with the most units from each monkey), refitted with units from DMFC only
    (probe s0), FEF only (V-probes), and good units only (unit_filters.py qualities). Reproduced
    when, in each of the three restrictions, Gain has the highest mean model likelihood and differs
    from each other model by the t-test of fig4a at p < 0.05; partially reproduced when this holds in
    two of three.
- id: ext5-general-slot
  statement: Letting slots be arbitrary linear subspaces (the General Slot model) does not change the
    model comparison; Gain still wins.
  source: Results, Slot hypothesis, paragraph 1; Methods, General Slot Model; Extended Data Fig. 5
  quote: we found that relaxing this assumption and allowing the slots to be linear subspaces in
    neural activity space does not qualitatively change our results ( Extended Data Fig. 5 )
  depends_on:
  - fig4a-gain-best-triangle
  criterion: >-
    As fig4a-gain-best-triangle on the 24 Triangle sessions with the General Slot model
    (configs/neural/triangle_slot.py, 2 slots) in place of the disjoint Slot model. Reproduced when
    Gain's mean likelihood exceeds General Slot's and Switching's for both monkeys at t-test
    p < 0.05.
- id: fig4b-identifiability
  statement: Applied to synthetic spike trains sampled from each fitted model, the full fitting and
    comparison pipeline recovers the generating model, Slot, Switching or Gain.
  source: Results, Modeling Results, paragraph 3; Methods, Validation Using Synthetic Data; Figure
    4b
  quote: This analysis confirmed that our model comparison reliably recovered the ground truth for
    each of the Slot, Switching, and Gain models ( Fig. 4b )
  depends_on:
  - fig4a-gain-best-triangle
  criterion: >-
    As Methods, Validation Using Synthetic Data, with phys_modeling/synthetic_datasets and
    configs/synthetic: the ten Triangle sessions with the most units (five per monkey), one shared
    split, each model at its stopping step sampled as Poisson spikes with kappa 0; kappa and stopping
    step re-tuned; models refitted; model likelihood as T7 but over 300 neuron-trial pairs. The
    number of new splits is open: two (Methods) or five (seeds 3 to 7 in
    figures/figure_4/model_comparison/identifiability.ipynb); both are allowed, the run states which.
    Reproduced when, for each of the three generating models, that model has the highest mean
    likelihood and beats each other model by the t-test of fig4a at p < 0.05.
- id: nslots-two-best
  statement: Two slots give the best cross-validated likelihood for the Slot model on both datasets
    and both monkeys.
  source: Methods, Slot Model, paragraphs 1 and 2
  quote: Through hyperparameter sweeping, we found that N slots = 2 provided the best cross-validated
    performance on both the Triangle and Ring dataset for both monkeys.
  criterion: >-
    As Methods, Slot Model, paragraph 2: for each monkey and dataset, 4 random sessions, N slots of
    1, 2, 3 and 4, two random splits each, mean test log-likelihood. Reproduced when 2 is best on
    average in all four monkey and dataset combinations. The random sessions are drawn with a fixed
    seed and named.
- id: ext11-kappa-tuning
  statement: For most sessions the best temporal smoothness kappa lies inside the sweep, is broadly
    the same across models, and is lower in sessions with more units.
  source: Methods, Tuning the Temporal Smoothness and Training Steps, paragraphs 1 and 2; Extended
    Data Fig. 11
  quote: We found that for most sessions, cross-validated likelihood was maximized for a value of κ
    somewhere in the middle of our sweep. Furthermore, this optimal value of κ was broadly consistent
    across models.
  depends_on:
  - fig4a-gain-best-triangle
  criterion: >-
    From the kappa sweeps of T7 on the Triangle sessions. Reproduced when (i) in more than half of
    sessions and models the best kappa is neither 0 nor 200 ms; (ii) per session the best kappas of
    the three models span at most 60 ms (three sweep steps) in more than half of sessions; (iii) the
    Spearman correlation across sessions of unit count and best kappa is negative, per model. The
    unit count is the number of modeled units (T7), the count the code's figures colour sessions
    by; the count of all units (T5) is shown as a variant. The paper gives no numbers for (ii) and
    (iii); the 60 ms span is the agent's reading of "broadly consistent" and is reported with the
    full table. Reproduced when (i), (ii) and (iii) hold; partially reproduced when (i) and (iii)
    hold and (ii) does not.
- id: ext7-gains-distributed
  statement: The Gain model's per-trial gains are spread across objects and do not pick one object
    per trial.
  source: Results, Gain model predictions for behavioral errors and reaction times, paragraph 1;
    Extended Data Fig. 7c
  quote: These gains were distributed across the objects and did not sparsely select one object per
    trial ( Extended Data Fig. 7 )
  depends_on:
  - fig4a-gain-best-triangle
  criterion: >-
    Gains (T8) of the fitted Gain models on 3-object Triangle trials, per monkey and object location,
    as Extended Data Fig. 7c plots them
