# Claims for Watters, Gabel, Tenenbaum & Jazayeri (2026), "Working Memory of Multi-Object Scenes in
# Primate Frontal Cortex", on dandiset 000620.
#
# Provenance: written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions),
# 2026-10-23, protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the bioRxiv preprint, version 1 (doi:10.64898/2026.01.27.702062), full text from the
# bioRxiv JATS XML (paper/10.64898-2026.01.27.702062.txt): main text, Methods, and the legends of
# Extended Data Figures 1 to 11. There is no separate supplement. No PDF was supplied, so figure
# panels could not be looked at; the JATS text drops the display equations of the models (they are
# described in words in the Results and Methods) and garbles the statistics of Extended Data Fig. 8a.
#
# Code read: https://github.com/jazlab/multi_object_memory_2025 at commit
# 6e4b333b78cd4461e6373a42378535e8fd392cdb (2026-02-03), the repository the Methods link. It holds
# behavior_processing/ (NWB trials to per-trial tables, with "correct" and reaction time),
# phys_processing/ (per-trial spike counts in 10 ms bins, delay-phase rates, AUC selectivity and the
# unit selection for modeling), phys_modeling/ (the Slot, Switching and Gain models in PyTorch, their
# configs, training, synthetic data and sweeps), and figures/ (one notebook per panel, several with
# printed outputs). Intermediate results (fitted models, caches) are on OSF (osf.io/vyw49), named by
# the code's README, not by the paper; no claim's test uses them.
#
# Data the paper used. Two rhesus macaques: Monkey P (female, 10 years, 8 kg; "Perle" in the code)
# and Monkey E (male, 10 years, 12 kg; "Elgar"). Task: fixation, 1 s stimulus of 1 to 3 fruit images
# (apple, blueberry, orange during physiology; ids "a", "b", "c" in the code) at 8.4 degrees
# eccentricity, 1 s delay, a cue (one of the shown fruits) at fixation for 180 ms, then a saccade to
# the remembered location of the cued object. Two datasets. Triangle: 1 to 3 objects on the vertices
# of an equilateral triangle (right, top-left, bottom-left), in performance-conditioned blocks, with
# 10% of 2- and 3-object trials at random positions (excluded from analysis); 24 sessions, 10 from P
# (2022-05-26 to 2022-06-05 in the code) and 14 from E (2022-08-19 to 2022-09-05). Ring: 1 or 2
# objects at positions uniform on a circle, plus 5% left/right 2-object trials; 22 sessions, 10 from P
# and 12 from E (the code's Ring model comparison lists 20, 10 per monkey: P 2022-06-07 to 06-19, E
# 2022-09-06 to 09-20). Recording: right DMFC with a Neuropixels 1.0 probe (probe "s0" in the code)
# and left FEF with 64-channel Plexon V-probes ("vprobe0", "vprobe1"); Kilosort 2.5, units labelled
# single ("good") or multi-unit ("mua"); each unit has a stable interval (the code reads it from the
# units table as obs_trials). Measured variables: trial events (stimulus, delay, cue, response,
# feedback onsets), object positions and identities, the target, the response position and time,
# broken fixation, and spike times.
#
# Shared definitions, cited from the paper or its code, used by the criteria below.
# T1 trials. Completed trials only, those without broken fixation and with a finite response time
#   (behavior_processing/run_cache_data.py). Triangle analyses use only trials whose objects all lie
#   on the triangle vertices (Methods, Behavioral Task, paragraph on the Triangle dataset; code
#   on_triangle). Ring analyses use all conditions (Methods, "We used all conditions for analysis");
#   the code drops the left/right 2-object trials from selectivity and modeling
#   (phys_modeling/training/trial_filters.py), shown as a variant.
# T2 correct. Methods (Feedback phase) say a response is correct within 2.4 degrees of the target
#   centre; the code (load_triangle_data.py, load_ring_data.py) uses 0.2 arena widths, 4.8 degrees.
#   Open; both readings are run wherever correctness enters.
# T3 reaction time. Response time minus cue onset (code); the Fig. 1c legend says cue onset to onset
#   of the response saccade and drops saccades earlier than 180 ms as broken fixation.
# T4 delay-phase rate. Spike count from delay onset to cue onset divided by its duration
#   (phys_processing/spikes_to_trials/run_firing_rates_per_phase.py; Extended Data Fig. 2 legend);
#   stimulus-phase rate from stimulus onset to delay onset (0 to 1000 ms). The models use 1000 to
#   2000 ms after stimulus onset in 10 ms bins (phys_modeling/constants.py).
# T5 units. Spikes outside a unit's stable interval excluded; units with delay-phase mean rate below
#   1 Hz excluded (Methods, Data Processing; code threshold > 1 Hz). The Methods also exclude units
#   stable for fewer than 500 trials; the code's modeling dataset requires 200 trials per unit and 5
#   units per trial (phys_modeling/training/dataset.py). Both qualities, good and mua, are used by the
#   code everywhere (unit_filters.py, selectivity notebook).
# T6 AUC. As in Methods, Receiver-Operator Characteristics, on 1-object trials: for each pair of the
#   three labels the AUC folded to be at least 0.5; the unit's value is the largest AUC among pairs
#   with p < 0.05, or the largest overall if none is. Ring trials are labelled by the nearest triangle
#   vertex (three 120-degree sectors). The p-value is open: the Methods shuffle labels 1,000 times;
#   the code (phys_processing/selectivity/auc.py) uses 5,000 bootstrap resamples, takes the pair of
#   lowest p when none is significant, and drops the Ring left/right trials. Both are run. The Fig. 2b
#   legend calls the AUC values cross-validated; neither the Methods nor the code says how, so the
#   uncross-validated value of the Methods is used and this is recorded as a deviation.
# T7 modeling. As in Methods, Modeling to Model Comparison, with the code's configs
#   (phys_modeling/configs/neural/{triangle,ring}_{slot_partition,switching,gain}.py). Units entered
#   when position or identity AUC > 0.65 with p < 0.05 and delay rate > 1 Hz (Methods, Model-Fitting;
#   run_cache_selectivity.py). The main Slot model is the disjoint-neuron one ("slot_partition") with
#   2 slots. Ten train/test splits per session (seeds 2 to 11 in the code), each neuron-trial pair in
#   test with probability 0.2. Temporal noise kappa (0 to 200 ms by 20 ms) and the stopping step
#   (within 10,000 steps) tuned per session and model on two splits. Adam, learning rate 0.003,
#   gradient clipping 1, per-trial parameters frozen for the first 1000 steps. Model likelihood of a
#   split is, as in figures/figure_4/model_comparison/model_comparison.ipynb, the mean over 1000
#   bootstraps of the softmax across the three models of the test log-likelihood summed over 100
#   neuron-trial pairs drawn with replacement; a session's value is the mean over its splits.
# T8 gain. A trial's gain of an object is the sigmoid of the fitted W at the stopping step of each
#   split ("attention.npy" in the code); "averaged over random seeds" means over the ten splits.
schema_version: 2
dataset:
  archive: dandi
  id: "000620"
paper: doi:10.64898/2026.01.27.702062
claims:
- id: fig1b-performance-load
  statement: In both monkeys accuracy falls as the number of objects grows, yet stays far above the
    chance of saccading to a random stimulus object for two- and three-object stimuli.
  source: Results, Task, Behavior, and Hypotheses, paragraph 1; Figure 1b
  quote: Animals learned the task and exhibited variable reaction times, with error rates increasing
    as the number of objects grew ... However, performance remained far above chance for two- and
    three-object stimuli
  criterion: >-
    Per monkey, the fraction correct (T2) of completed trials (T1) for 1, 2 and 3 objects; chance is
    1/n, as the Fig. 1b legend defines it. Reproduced when, for both monkeys, the fraction falls from
    1 to 2 to 3 objects and the 2- and 3-object fractions lie above 1/2 and 1/3. The paper gives no
    test; "far above" is not given a number, so the margin is reported and not judged. Which trials
    form the figure is open: (a) Triangle trials on the triangle only, as the paper's
    figures/figure_1/performance/performance.ipynb plots; (b) Triangle and Ring trials pooled, as the
    legend says (the Ring has no 3-object trials). Each reading is run under both correctness radii
    of T2. For reference, that notebook printed, for reading (a) with the code's radius, P 0.953,
    0.93, 0.692 and E 0.928, 0.759, 0.561 for 1, 2, 3 objects; these are reported against, not used
    to judge.
- id: fig1c-reaction-times
  statement: Reaction times, from cue onset to the response saccade, vary from trial to trial, with
    trials faster than 180 ms counted as broken fixation.
  source: Results, Task, Behavior, and Hypotheses, paragraph 1; Figure 1c legend
  quote: Animals learned the task and exhibited variable reaction times
  criterion: >-
    Per monkey, reaction times (T3) of completed trials, correct and incorrect apart, as in
    figures/figure_1/reaction_times/reaction_times.ipynb, which bins them from 100 to 600 ms and
    shows 150 to 500 ms. Trials with a saccade earlier than 180 ms after cue onset are left out as
    broken fixation (Fig. 1c legend). Which trials form the figure is open, as for
    fig1b-performance-load: (a) Triangle trials on the triangle, as the notebook plots; (b) Triangle
    and Ring trials pooled, as the legend says; both are run. The paper fixes no measure of
    variability. Reproduced when the distribution of each monkey is not degenerate (interquartile
    range above one 10 ms bin) and its median lies inside the plotted 150 to 500 ms range; these
    cut-offs are the agent's reading of "variable" and are recorded as such. The histograms,
    quartiles and the share of trials under 180 ms before the cut are reported.
- id: ext1-misbinding-errors
  statement: A common error is a saccade to the location of a non-target stimulus object, reporting
    the cued identity at the wrong location.
  source: Discussion, Position-identity binding, paragraph 1; Extended Data Fig. 1
  quote: A common error in our task occurs when the monkey reports the identity of an object at the
    wrong location ( Extended Data Fig. 1 ), consistent with misbinding in working memory
  criterion: >-
    Completed Triangle trials on the triangle with 2 or 3 objects, per monkey. Each response is
    assigned to the triangle vertex within the correctness radius (T2), as in load_triangle_data.py
    (response_location), and counted by target location and response location as in Extended Data
    Fig. 1. Among incorrect trials, the share whose response lies at a non-target object's vertex.
    The paper gives no number for "common"; two readings are run, (a) these responses are the largest
    class of errors (against responses at an empty vertex or at no vertex), and (b) they are more
    than half of the errors. Reproduced when both readings hold for both monkeys and both set sizes,
    not reproduced when neither does; when the readings give different outcomes the claim is
    methods_underspecified, with the shares reported.
