- id: fig5ab-ring-behavior
  statement: Both monkeys perform well on the Ring dataset, with reaction-time variability like that
    on the Triangle dataset.
  source: Results, Replication of the Results with the Ring Dataset, paragraph 1; Figure 5a and 5b;
    Extended Data Fig. 9a and 9b (the Results cite "Extended Data Fig. 8a-b", but the per-monkey
    Ring figure is the ninth Extended Data legend)
  quote: Both monkeys performed well on the Ring dataset and exhibited reaction-time variability
    similar to the Triangle dataset
  criterion: >-
    Completed Ring trials (T1), per monkey and pooled, fraction correct (T2) for 1 and 2 objects and
    the reaction-time distribution (T3), as figures/figure_5/performance_reaction_time/. The paper
    gives no number. Reproduced when the 2-object fraction correct is above chance (1/2) for both
    monkeys and each monkey's Ring reaction-time interquartile range is within a factor of 1.5 of its
    Triangle one; the factor is the agent's reading of "similar" and the ranges are reported. For
    reference, the paper's notebook printed P 0.958 and 0.903, E 0.945 and 0.756 for 1 and 2 objects
    with the code's radius.
- id: fig5cd-ring-tuning
  statement: Ring neurons in DMFC and FEF show a variety of spatial receptive fields and diverse
    delay-phase position and identity selectivities, as in the Triangle dataset.
  source: Results, Replication of the Results with the Ring Dataset, paragraph 1; Figure 5c and 5d;
    Extended Data Fig. 9c
  quote: These neurons showed a variety of spatial receptive fields in both DMFC and FEF ( Fig. 5c ;
    Extended Data Fig. 9c ) and diverse selectivities to position and identity in delay-phase firing
    rates ( Fig. 5d ), similar to the Triangle dataset
  depends_on:
  - fig2b-selectivity-range
  criterion: >-
    Position and identity AUC (T6) of Ring units, judged as fig2b-selectivity-range. Tuning curves as
    Methods, Ring Dataset Tuning Curves (256 points on the ring, 100 bootstraps of 100 1-object
    trials, Gaussian kernel of 2.4 degrees); "variety" is judged by the preferred angles of units
    with significant position AUC, reproduced when in each area they fall in all three 120-degree
    sectors.
- id: fig5e-signal-noise-ring
  statement: In the Ring dataset, noise correlation rises with signal correlation, as in the Triangle
    dataset.
  source: Results, Replication of the Results with the Ring Dataset, paragraph 1; Figure 5e;
    Extended Data Fig. 9d
  quote: We also found a positive relationship between signal correlation and noise correlation (
    Fig. 5e ; Extended Data Fig. 9d ), corroborating our findings in the Triangle dataset
  criterion: >-
    As Methods, Ring Dataset Signal and Noise Correlations (the Methods call it Fig. 5c), on pairs
    of Ring units: trials embedded in 6 dimensions (x and y of each fruit, 0 when absent); signal
    correlation on 1-object trials between one unit's rate and the other's on the nearest-neighbour
    trial. The noise correlation is open between (a) the Methods' wording, per 2-object trial the
    correlation of the two units over its 10 nearest-neighbour trials, averaged over trials, and (b)
    the paper's figures/figure_5/noise_correlations/run_compute_ring.py, each trial's rate minus
    the mean of its 10 neighbours, one Pearson correlation of these residuals across trials. Pairs
    kept with at least 50 1-object and 200 2-object trials (noise_correlations.ipynb); 8 bins of
    signal correlation with edges at linspace(-s, s, 9), s 0.8 for P and pooled, 0.3 for E. The paper
    gives no test. Reproduced when, per monkey, the mean noise correlation of the highest bin
    exceeds that of the lowest with non-overlapping 95% intervals; when the readings differ the claim
    is methods_underspecified.
