# Claims for Gao, Davis, Thomas, Economo, Abrego, Svoboda, De Zeeuw & Li (2018), Nature, on
# dandiset 000007. Source, the author manuscript in PubMed Central (PMC6212318), full text, with
# its Methods, figure legends and Extended Data legends, and the Supplementary Information from
# the publisher (Supplemental Table 1 lists the mice of each experiment).
#
# The dandiset holds the ALM recordings only, 54 sessions from 13 mice (9 with ChR2 in the
# fastigial or dentate nucleus, 4 L7-cre x Ai32 for CN photo-inhibition), with spike times, a
# trial table and an undescribed photostimulation code. The CN recordings, the lesion and
# behaviour-only sessions, the anatomy and the lick times are not in it. The paper's data
# description and the CN recordings are on Zenodo (NWB, doi:10.5281/zenodo.6647629; MATLAB with
# the paper's CN analysis scripts, doi:10.5281/zenodo.6653158), found through CRCNS alm-6, which
# the paper's reporting summary names. Claims on the CN recordings are `elsewhere`; claims that
# need the names of the photostimulation codes take them from the Zenodo data description
# (`with_labels`) and depend on stim-code-link.
#
# When these criteria were written the author had seen the data check only: the file list and
# metadata, counts of sessions, trials, outcomes, codes and units per file, the cell type labels
# and spike widths, a search for duplicated units and sessions, and, to see what the codes are,
# the mean absolute difference in ALM firing between each code's trials and control trials in
# 10 ms and 100 ms bins from 0.6 s before to 3.6 s after pole in, pooled over all units. That
# last check showed the change starting 5 to 15 ms after sample onset for codes 1 and 3 and
# after delay onset for codes 2, 4, 5 and 6, lasting longer after code 1 and 2 (fastigial) than
# after 3 and 4 (dentate), and longer after 6 than after 5. It bears on stim-code-link,
# ed9a-fn-latency, ed9a-dn-latency, fig4f-fn-persistent and fig4g-dn-recovery. No unit-level
# test, selectivity, performance or coding direction had been computed. The author had also
# read the paper's CN analysis scripts.
#
# Method choices fixed here, from the Methods and the paper's CN scripts where the Methods are
# silent (see the helper module). Epochs are sample (pole in to pole out), delay (pole out to
# cue) and response (cue to 1.3 s after). Trials with early licks are dropped, and each unit
# uses its stable trials (first to last trial with a spike). The trial type is the R or L of
# `response`. Units are the putative pyramidal neurons as labelled in the files, unless a claim
# says otherwise. A unit is selective when a two-tailed t-test on spike rates of correct
# control trials, lick right against lick left, has p < 0.05 in the sample, delay or response
# epoch. Photostimulation effects use control (code 0) against photostimulation trials, correct
# and error trials together, grouped by instructed type where selectivity is computed.
schema_version: 1
dandiset: "000007"
paper: doi:10.1038/s41586-018-0633-x
claims:
- id: stim-code-link
  statement: The dandiset's photostimulation codes 1 to 6 can be named from the paper's Zenodo
    data description (1 and 2 fastigial photo-activation in the sample and delay epochs, 3 and 4
    dentate photo-activation in the sample and delay, 5 and 6 CN photo-inhibition in the delay
    for 0.5 and 1.3 s), and the ALM responses agree with those names.
  source: Data description of Zenodo records 6647629 and 6653158; Methods
  data: with_labels
  criterion: Codes are matched by their integer value. Reproduced when (1) codes 1 and 2 occur
    only in the mice with ChR2 in the fastigial nucleus, 3 and 4 only in the dentate mice and 5
    and 6 only in the L7-cre mice; (2) for each code the population change in ALM firing
    (mean over units of the absolute difference from control trials, 10 ms bins) first exceeds
    the pre-trial level by 4 standard deviations within 50 ms after the stated onset (pole in
    for the sample codes, pole out for the delay codes), and not before it; and (3) the change
    after code 5 ends earlier than after code 6 (smaller mean change 0.7 to 1.2 s after onset).
    Partially reproduced when (1) and (2) hold and (3) does not.
- id: methods-alm-unit-counts
  statement: The ALM recordings comprise 912 putative pyramidal neurons in the 9 mice tested
    with CN photo-activation (446 with fastigial and 466 with dentate photo-activation), and
    490 single units (454 putative pyramidal) in 4 mice across 19 sessions during CN
    photo-inhibition.
  source: Methods, Electrophysiology data analysis; Figure 4f and 4g legends
  expected:
  - quantity: putative pyramidal neurons, photo-activation mice
    value: 912
    tolerance: 91.2
  - quantity: putative pyramidal neurons, fastigial photo-activation mice
    value: 446
    tolerance: 44.6
  - quantity: putative pyramidal neurons, dentate photo-activation mice
    value: 466
    tolerance: 46.6
  - quantity: single units, photo-inhibition mice
    value: 490
    tolerance: 49
  - quantity: putative pyramidal neurons, photo-inhibition mice
    value: 454
    tolerance: 45.4
  - quantity: sessions, photo-inhibition mice
    value: 19
    tolerance: 1.9
  criterion: Pyramidal neurons are counted under two readings, (a) the files' cell type label
    and (b) the Methods' width rule (trough to peak above 0.45 ms). Reproduced when every count
    is within tolerance under one reading, partially reproduced when at least half are, not
    reproduced otherwise.
- id: fig1g-fn-delay-performance
  statement: Fastigial photo-activation during the early delay epoch reduced behavioural
    performance (incorrect choices).
  source: Results, paragraph 4; Figure 1g; Extended Data Figure 10b
  data: with_labels
  depends_on:
  - stim-code-link
  criterion: Performance (fraction correct, without early-lick and no-lick trials) on code 2
    trials against control trials in the fastigial mice, trial types pooled. Reproduced when
    performance is lower with photostimulation and the one-tailed hierarchical bootstrap
    (mice, sessions, trials; 10,000 resamples) gives p < 0.05.
- id: fig1-fn-sample-no-effect
  statement: Fastigial photo-activation during the early sample epoch had no effect on
    behavioural choice (p > 0.05 for either trial type, bootstrap).
  source: Results, paragraph 4
  data: with_labels
  depends_on:
  - stim-code-link
  criterion: A claim of absence, judged on the paper's test, the one-tailed hierarchical
    bootstrap of the performance change on code 1 trials, for lick right and lick left trials
    separately. Reproduced when neither trial type shows a decrease with p < 0.05; not
    reproduced when either does.
- id: fig1g-dn-little-effect
  statement: Dentate photo-activation produced little effect on behavioural choice (p = 0.06,
    bootstrap).
  source: Results, paragraph 5; Figure 1g
  data: with_labels
  depends_on:
  - stim-code-link
  criterion: A claim of absence, judged on the paper's test, the one-tailed hierarchical
    bootstrap of the performance change with delay-epoch dentate photo-activation (code 4),
    trial types pooled. Reproduced when the decrease has p >= 0.05; not reproduced when p <
    0.05. The size of the change is reported either way.
- id: fig1h-fn-delay-bias-either-direction
  statement: Fastigial photo-activation during the delay epoch biased future movements to
    either the contralateral or the ipsilateral direction in individual mice.
  source: Results, paragraph 4; Figure 1h; Extended Data Figure 1e
  data: with_labels
  depends_on:
  - stim-code-link
  criterion: For each fastigial mouse, the bias is the performance change on ipsilateral
    trials minus that on contralateral trials (trial types relative to the manipulated
    hemisphere; a contralateral trial instructs licking to the side opposite the stimulated
    nucleus), on code 2 trials, with a bootstrap over that mouse's sessions and trials (10,000
    resamples, two-tailed p < 0.05). Reproduced when at least one mouse is significantly biased
    in each direction; partially reproduced when mice are biased in one direction only.
- id: ed1f-fn-no-early-licks
  statement: Fastigial photo-activation during the delay epoch did not evoke early licks.
  source: Results, paragraph 5; Extended Data Figure 1f
  data: with_labels
  depends_on:
  - stim-code-link
  criterion: A claim of absence. The paper gives no test; the test fixed here is the one-tailed
    hierarchical bootstrap of the increase in the early-lick rate on code 2 trials against
    control trials. Reproduced when p >= 0.05; not reproduced when the increase has p < 0.05.
- id: fig1k-pi-delay-performance
  statement: CN photo-inhibition during the delay epoch resulted in incorrect behavioural
    choices.
  source: Results, paragraph 6; Figure 1k; Extended Data Figure 2g and 2h
  data: with_labels
  depends_on:
  - stim-code-link
  criterion: Performance on photo-inhibition trials (codes 5 and 6 pooled) against control
    trials in the L7-cre mice, trial types pooled. Reproduced when performance is lower and the
    one-tailed hierarchical bootstrap gives p < 0.05. Codes 5 and 6 are also shown apart.
- id: fig1d-fn-lesion
  statement: Fastigial lesions impaired initiation of contralesional licking, while dentate
    lesions did not change behavioural choice or movement execution.
  source: Results, paragraph 3; Figure 1d
- id: fig1e-lesion-lick-timing
  statement: Fastigial lesions slowed initiation of contralesional licking after the go cue,
    and licking after initiation was unaffected.
  source: Results, paragraph 3; Figure 1e; Extended Data Figure 1b and 1c
- id: fig1h-response-contra-bias
  statement: Fastigial photo-activation immediately before movement onset (response epoch)
    produced a contralateral bias.
  source: Results, paragraph 4; Figure 1h
- id: fig1i-licking-unaffected
  statement: Fastigial photo-activation did not block or perturb the frequency and duration of
    licking after initiation of lick bouts, and CN photo-inhibition minimally affected movement
    execution.
  source: Results, paragraphs 5 and 6; Figure 1i and 1l
- id: fig1k-response-ipsi-bias
  statement: CN photo-inhibition during the response epoch produced an ipsilateral bias, and
    photo-inhibition during the early sample epoch did not affect choice.
  source: Results, paragraph 6; Figure 1k; Extended Data Figure 2g
- id: ed2-pi-silences-fastigial
  statement: Photostimulation of Purkinje cells in L7-cre x Ai32 mice silenced fastigial
    neurons, and at the intensities used in the task evoked no consistent movement.
  source: Figure 1j; Extended Data Figure 2b to 2f
- id: fig2-alm-selective-fraction
  statement: Most ALM pyramidal neurons distinguished lick left and lick right trials
    (980/1194, p < 0.05, two-tailed t-test).
  source: Results, paragraph 7
  expected:
    quantity: fraction of ALM putative pyramidal neurons that are selective
    value: 0.821
    tolerance: 0.082
  criterion: The paper's 1194 neurons come from the 10 mice recorded during behaviour (Figure 2;
    Supplemental Table 1), the 9 photo-activation mice of the dandiset and one excluded mouse.
    The readings are (a) the pyramidal neurons of the 9 photo-activation mice and (b) those of
    all 13 mice. Reproduced when the fraction is within tolerance under one reading.
- id: fig2-alm-preparatory-fraction
  statement: Preparatory activity (selectivity before the response epoch) was present in 59% of
    ALM neurons.
  source: Results, paragraph 7
  expected:
    quantity: fraction of ALM neurons selective in the sample or delay epoch
    value: 0.59
    tolerance: 0.059
  criterion: Readings (a) and (b) as in fig2-alm-selective-fraction; the denominator is all
    pyramidal neurons, as "59% of neurons" reads. Reproduced when the fraction is within
    tolerance under one reading.
- id: fig2-alm-perimovement-fraction
  statement: Peri-movement activity (selectivity in the response epoch) was present in 67% of
