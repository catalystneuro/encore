  source: Results, paragraph 7
  expected:
    quantity: fraction of ALM neurons selective in the response epoch
    value: 0.67
    tolerance: 0.067
  criterion: Readings (a) and (b) as in fig2-alm-selective-fraction. Reproduced when the fraction
