  criterion: Pyramidal neurons of the fastigial mice, delay photostimulation (code 2). For each
    400 ms bin (50 ms steps) the fraction of neurons whose spike counts differ between control
    and code 2 trials (two-tailed t-test, p < 0.01). Reproduced when the fraction in the bin
    from 1.0 to 1.4 s after photostimulus offset is more than twice the fraction in the bin
    ending at photostimulus onset and higher than it by a one-tailed Fisher exact test (p <
    0.05).
- id: fig4g-dn-recovery
  statement: ALM activity quickly recovered after dentate photo-activation.
  source: Results, paragraph 14; Figure 4g
  data: with_labels
  depends_on:
  - stim-code-link
  criterion: As fig4f-fn-persistent, for the dentate mice and code 4. Reproduced when, in the
    bin from 1.0 to 1.4 s after offset, the dentate fraction is less than twice its own fraction
    in the bin ending at onset and lower than the fastigial fraction in the same bin (two-tailed
    Fisher exact test, p < 0.05).
- id: fig4i-fn-cd-collapse
  statement: Fastigial photo-activation resulted in a collapse of ALM activity trajectories
    along the coding direction, destroying the coding of future movement.
  source: Results, paragraph 15; Figure 4i
  data: with_labels
  depends_on:
  - stim-code-link
  criterion: Sessions of the fastigial mice with more than 5 pyramidal neurons and more than 5
    trials of each type in each condition. The coding direction from a random half of the
    correct control trials (400 ms windows stepped by 10 ms, the lick right minus lick left
    mean, averaged over the delay epoch); projections of the other control trials and of all
    code 2 trials (correct and error, by instructed type), offset by the mean projection of
    the training trials. Separation is the lick right minus lick left projection in the last
    400 ms of the delay; the ratio is its mean over sessions for code 2 over that for control,
    with a bootstrap over sessions (10,000). Reproduced when the ratio is below 0.5 and its
    upper 95% bound below 1; partially reproduced when the upper bound is below 1 and the ratio
    is 0.5 or more.
- id: fig4i-dn-cd-minimal
  statement: Dentate photo-activation minimally impacted ALM activity trajectories along the
    coding direction, despite having an impact on ALM neuron responses.
  source: Results, paragraph 15; Figure 4i; Extended Data Figure 9c
  data: with_labels
  depends_on:
  - stim-code-link
  criterion: As fig4i-fn-cd-collapse, for the dentate mice and code 4. Reproduced when the ratio
    is above 0.75 and lower for the fastigial than for the dentate photo-activation in at least
    95% of paired bootstrap resamples; partially reproduced when the ratio is between 0.5 and
    0.75.
- id: ed10d-fn-no-prediction
  statement: After fastigial photo-activation, ALM activity along the coding direction no longer
    predicted the future movement direction (n = 337 trials).
  source: Supplementary Information; Extended Data Figure 10d
  data: with_labels
  depends_on:
  - stim-code-link
  expected:
    quantity: fastigial photo-activation trials analysed
    value: 337
    tolerance: 33.7
  criterion: Sessions and coding direction as in fig4i-fn-cd-collapse; the projection in the
    last 400 ms of the delay, minus the midpoint of the two training-trial endpoints. A
    claim of absence; the paper gives no test, the test fixed here is a logistic regression of
    licking right on the projection, pooled over sessions. Reproduced when the slope on code 2
    trials has p >= 0.05 while the slope on held-out control trials has p < 0.05; not
