- id: figs16-pupil-spiking
  statement: LC-NE spiking correlates with pupil size; pupil autocorrelation decays with a time
    constant of 3.37 +/- 1.03 s across sessions.
  source: Figure S16 title and panels i, j; Methods, Pupil auto-correlogram
  quote: τ had a mean of 3.37 and SD of 1.03
  expected:
    quantity: pupil autocorrelation time constant, mean over sessions
    value: 3.37
    tolerance: 1.03
    unit: s
    # tolerance is the reported SD
  criterion: Pupil diameter from left and right edges with confidence at least 0.9, 5 Hz low-pass
    (Methods, Pupil tracking); exponential fit, A exp(-t/tau) + C, to the whole-session
    autocorrelogram per session, computed with a 0.5 s sliding window and with periods of poor
    time alignment or edge detection removed (Methods, Pupil auto-correlogram).
    For spiking, per neuron, Pearson correlation over trials of the rate and pupil diameter 1 s
    before the go cue (Methods, Pupil correlation with neuron activity). The paper gives no
    population test; reproduced when the mean tau is within tolerance and more neurons have
    significant positive than negative baseline correlations (binomial test p < 0.05, a standard
