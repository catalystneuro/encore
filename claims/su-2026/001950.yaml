# Claims for "Topographic structure and function of locus coeruleus noradrenaline neurons"
# (Nature, doi:10.1038/s41586-026-11026-0) on dandiset 001950.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-11-04, protocol as stated in docs/protocol.md.
#
# Text read: the version of record text under paper/ holds only the abstract and the
# reference list, so the claims are read from the bioRxiv preprint, version 1
# (doi:10.64898/2026.04.10.717727, JATS XML flattened): Results, Methods and the legends of
# the main and supplementary figures (S1 to S18), which the preprint carries inline. The
# preprint's equations and Table 3 (model priors) are lost in the flattened text. Figure,
# section and quote references below are to the preprint; the Nature version may number
# the supplementary figures as Extended Data (the code calls S12 to S17 "E9" to "E14").
# No PDF was available. No supplementary data table is cited by the claims.
#
# Code read (linked from the preprint's Methods and Data and code availability):
# github.com/AllenNeuralDynamics/aind-beh-ephys-analysis at commit 971c1ca (in vivo spiking,
# photometry, pupil, licks and spatial analyses; its README says all physiology and behavior
# sessions are on DANDI:001950, one NWB file per session), github.com/AllenNeuralDynamics/
# aind_stan_fit_sim at commit 89371ee (hierarchical Stan Q-learning model with learning rates
# for reward and no reward, forgetting rate, inverse temperature and side bias), and the index
# github.com/AllenNeuralDynamics/locus_coeruleus_norepinephrine_neurons at commit 43f7083,
# which lists 16 Code Ocean capsules. The analysis code reads the model's per-session
# variables (Q values, RPE) from precomputed files; it does not refit the model.
#
# Data the paper used for the claims the dataset can hold (Methods, Physiology and behavior):
# heterozygous Dbh-Cre mice; 42 mice (6 female) for behavior, 28 mice (5 female) for
# electrophysiology during the task, 14 mice (1 female) for axonal calcium recordings.
# Head-fixed mice in a dynamic foraging task: a 0.5 s go cue (7.5 or 15 kHz; no-go cues at
# P = 0.05 in tetrode and photometry experiments, treated as part of the inter-trial
# interval), free choice of a left or right lick, reward (2 to 3 uL) delivered with 300 ms
# delay (200 ms for photometry) at probabilities from {0.1, 0.5, 0.9} in blocks of 20 to 35
# trials per spout, exponential inter-trial intervals. Spiking from right LC with tetrodes
# (Neuralynx, 32 kHz) or Neuropixels probes (Kilosort), LC-NE neurons identified by
# optogenetic tagging (ChR2, Chrimson or ChRmine), some identified as projecting to cortex by
# antidromic stimulation over frontal cortex with collision tests; 241 identified LC-NE
# neurons from 19 mice in the task, with CCF locations for a subset (103 to 115 cells, 15
# mice). Pupil video (22 to 24 Hz, DeepLabCut edges), tongue video (500 Hz, Lightning Pose),
# lick sensors. Fiber photometry in prelimbic cortex of axonal GCaMP6s or jGCaMP8s with a
# 405 nm isosbestic channel, 20 Hz per channel. Trial events (go cue, choice, outcome), and
# the Q-learning model variables per trial. The anatomy, transcriptomics and patch-seq data
# (SPIM, single-neuron reconstructions, MAPseq/BARseq, snRNAseq, MERFISH, retro-seq,
# patch-seq) are not in this dataset as its title describes it; their claims are marked
# elsewhere, at the Code Ocean collection the paper names (not pinned by a DOI).
#
# Method choices the code settles where the Methods are silent (cited in each criterion from
# aind-beh-ephys-analysis at 971c1ca): the unit selection of metrics/beh_all.json (opto-tag
# criteria as in the Methods, ISI violation ratio <= 0.1 or <= 0.2 for cortex-projecting
# units, slow drift ratio <= 0.3, trial count 100 to 2000) and the session behavior criteria
# of metrics/beh_only.json (at least 90 trials, among others), which give 241 units, 19 mice
# and 106 sessions; windows start 0.01 s after or end 0.01 s before the aligning event;
# regressions are ordinary least squares with the per-trial waveform amplitude as the drift
# regressor; outcome windows are 1.5 s bins centred at the outcome time plus the auROC lags
# stored in metrics/beh_all_NP/auc_windows.json (Neuropixels, 0.736 s for reward-excited and
# 1.782 s for no-reward-excited) and metrics/beh_all_TT/auc_windows.json (tetrodes, 1.274 s
# and 0.996 s); the polar angle is arctan2 of the chosen-value coefficient over the outcome
# coefficient.
#
# Details left open, with the readings named in the criteria: the switch definition (against
# the previous trial or the previous responded trial); extra regressors in the respond and
# switch regressions (the code adds them, the Methods do not name them); the photometry
# regressors (the Methods add the isosbestic signal, the code does not) and unit of sample
# (session or mouse); the denominators of 46.5% and 76.8%; which spatial test gives the p of
# Figure 6a; the groups compared by the Fisher's exact tests; the binning behind Figure 6c's
# rank correlation; the population of Figure 4h; the multiple-comparison correction of the
# spatial tests (FDR in the code, none named in the paper).
schema_version: 2
