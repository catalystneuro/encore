  statistics:
  - about: angles of reward and chosen value coefficients
    test: Rayleigh test
    statistic: z = 19.53
    p: 2.3e-9
  - about: cortex-projecting neurons against the population
    test: Watson-Wheeler test, permutation
    statistic: W = 0.04
    p: 0.01
  criterion: Angle of the (R, Qc) coefficients per neuron (Methods, Linear regression models of
