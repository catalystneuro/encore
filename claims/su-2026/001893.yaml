# Claims for Su, Kosillo, Jung et al. (2026), "Topographic structure and function of locus
# coeruleus noradrenaline neurons", Nature, doi:10.1038/s41586-026-11026-0, on dandiset 001893.
#
# Provenance. Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub
# Actions"), 2026-11-04, under docs/protocol.md version pilot-13 (Reader). The reader did not
# look at the dataset's data or files; only its title and description on the archive.
#
# Text read. The version of record, as served by Crossref from the publisher's HTML (stored
# 2026-10-21): main text, Methods, figure legends and Extended Data Fig. 1 to 15 legends. The
# Supplementary Tables 1 to 3 (a PDF) are not in the text; the paper cites them only for
# injection coordinates and volumes (Tables 1 and 2) and model priors (Table 3), and no result
# rests on them. The bioRxiv preprint (doi:10.64898/2026.04.10.717727, version 1) was also
# read, only to compare. It differs in places used here. Its Figure S14k legend names "paired
# t-tests" where the version of record (Extended Data Fig. 11k) names two-sided Welch's
# t-tests, and its Figure S15t p-values differ from Extended Data Fig. 12t. The version of
# record is followed.
#
# Code read. (1) github.com/AllenNeuralDynamics/locus_coeruleus_norepinephrine_neurons at
# 43f7083 (the index the paper's Code availability links), which lists one capsule per
# analysis. (2) Capsule 13, github.com/AllenNeuralDynamics/LCNE-patchseq-figures at 79fa20a,
# which builds Extended Data Fig. 11j,k (preprint Figure S14j,k) from dandiset 001893 version
# 0.260817.1647. It reads 96 NWB files (sourcedata/raw/*/*_icephys.nwb, one per ephys_roi_id),
# takes donor and projection target from the dandiset's participants.tsv (donor_local_id,
# injection_target_region), recomputes an action-potential waveform PC1 from the raw sweeps,
# reads the membrane time constant from a frozen table (code/data/LCNE_patchseq_S14_cell_table.csv,
# the IPFX "tau" from the Allen pipeline, in ms, missing for 14 of 96 cells), and runs two-sided
# Welch t-tests per cell. (3) github.com/AllenNeuralDynamics/LCNE-patchseq-analysis at 1190697,
# the fuller Patch-seq pipeline; it takes ipfx_tau from an upstream IPFX table and does not
# recompute it. The other capsules (anatomy, sequencing, in vivo physiology) were not read in
# full, as the dataset holds none of those data.
#
# Data the paper used. The dataset's title ("Patch-seq profiling of mouse locus coeruleus
# norepinephrine neurons") and approach (electrophysiology) say it holds the Patch-seq
# experiment only. As the paper reports it, whole-cell current-clamp recordings in acute
# coronal or sagittal slices of LC from Dbh-Cre;Ai65 mice (50 to 74 days old, male and female)
# whose LC-NE neurons were retrogradely labelled with AAVrg-DIO-FLPo from frontal cortex,
# cerebellar cortex or spinal cord, about 21 days before recording: 96 cells from 28 mice
# (frontal cortex 27 cells, 8 mice; cerebellar cortex 15 cells, 7 mice; spinal cord 54 cells,
# 13 mice). Signals were Bessel filtered at 10 kHz and digitized at 50 kHz, uncorrected for a
# -14 mV liquid junction potential. Measured variables are membrane voltage and injected
# current per sweep (long-square steps including rheobase protocols), from which the action
# potential waveform and the membrane time constant are computed (IPFX). The nucleus was
# extracted for SMART-Seq v4 RNA sequencing (gene counts as CPM); the paper's code points to
# the NeMO collection col-p9d5w39 for the Patch-seq transcriptomes.
#
# The paper's other experiments are not in this dataset: whole-brain SPIM of Dbh+ nuclei (8
# mice); dense LC-NE axon labelling; 132 reconstructed LC-NE neurons (4 mice); MAPseq/BARseq (2
# mice); retrograde tracing (35 mice); snRNA-seq (40 mice, 4,743 LC-NE nuclei); retro-seq
# (1,076 nuclei); MERFISH data reused from Nardone et al. 2024 (ref. 39); in vivo tetrode and
# Neuropixels recordings of optotagged LC-NE neurons during a dynamic foraging task (241
# cells, 19 mice); axonal GCaMP photometry in prelimbic cortex (7 mice); pupil and tongue
# video. The paper's Data availability names the GitHub index, the NeMO collection
# col-p9d5w39 and a Code Ocean collection, without saying which data each holds. Claims on
# sequencing data are marked `elsewhere` with NeMO; the rest are `dataset` and their data are
# for the author to look for.
#
# Paper inconsistency noted. Fig. 3e gives the difference between the projection and gene
# expression axes as chi-squared(2) = 29.9, bootstrapped P = 10^-4; Extended Data Fig. 15c
# gives the same chi-squared with p = 3.25 x 10^-7.
schema_version: 2
dataset:
  archive: dandi
  id: "001893"
paper: doi:10.1038/s41586-026-11026-0
claims:
# Patch-seq: the claims this dataset is meant to test.
- id: patchseq-sample
  statement: Whole-cell patch-clamp recordings were made from 96 LC-NE neurons in brain slices
    from 28 mice, retrogradely labelled from frontal cortex (27 cells, 8 mice), cerebellar cortex
    (15 cells, 7 mice) or spinal cord (54 cells, 13 mice).
  source: Results, LC-NE activity during action-outcome learning, paragraph 5
  quote: we made whole-cell patch clamp recordings from LC-NE neurons in brain slices (96 cells,
    28 mice). We retrogradely labelled neurons from frontal cortex (27 cells, 8 mice), cerebellar
    cortex (15 cells, 7 mice) or spinal cord (54 cells, 13 mice)
  expected:
  - quantity: Patch-seq cells
    value: 96
    tolerance: 0
  - quantity: mice
    value: 28
    tolerance: 0
  - quantity: cells labelled from frontal cortex
    value: 27
    tolerance: 0
  - quantity: mice, frontal cortex
    value: 8
    tolerance: 0
  - quantity: cells labelled from cerebellar cortex
    value: 15
    tolerance: 0
  - quantity: mice, cerebellar cortex
    value: 7
    tolerance: 0
  - quantity: cells labelled from spinal cord
    value: 54
    tolerance: 0
  - quantity: mice, spinal cord
    value: 13
    tolerance: 0
  criterion: A cell is one recorded neuron (one ephys_roi_id, one NWB file, as the paper's code
    LCNE-patchseq-figures at 79fa20a reads them), a mouse is one donor, and the group is the
    injection target. The tolerance is zero because these are counts of the deposited cells
    themselves, and the paper's code reads exactly 96. Reproduced when every count matches;
    partially reproduced when the total is within 10% (87 to 106 cells) but a count differs.
    Recordings deposited twice are counted once (author, step 1.2). Cells that fail the
    Methods' inclusion rule (seal above 1 GOhm before break-in, initial access resistance below
    20 MOhm and below 15% of input resistance; Methods, Patch-seq recordings) are reported
    where the files hold those values.
- id: patchseq-ne-identity
  statement: The RNA sequenced from each recorded cell's nucleus confirmed that every recorded
    cell was a noradrenergic neuron.
  source: Results, LC-NE activity during action-outcome learning, paragraph 5; Methods, cDNA and
    sequencing
  quote: At the end of the recording, we extracted the nucleus for RNA sequencing 41 and
    confirmed the identity of each cell as a noradrenergic neuron.
  data: elsewhere
  where: NeMO collection col-p9d5w39 (https://assets.nemoarchive.org/col-p9d5w39), named in the
    paper's Data availability; the README of LCNE-patchseq-figures (79fa20a) names it as the
    Patch-seq transcriptomic data
  depends_on:
  - patchseq-sample
  - patchseq-transcriptome-link
  criterion: The paper does not say how identity was confirmed. Gene counts as CPM of exonic
    plus intronic reads (Methods, cDNA and sequencing). The markers the paper uses for
    noradrenergic identity elsewhere are Dbh, Th, Slc6a2 and Slc18a2 (Methods, Identification of
    noradrenergic cells; Retro-seq). Open, with these readings named before the analysis (a)
    Dbh detected (CPM above 0) in the cell; (b) all four markers detected; (c) the cell's
    transcriptomic type mapped to the LC-NE (Dbh) type, as the LCNE-patchseq-analysis diagram
    shows with MapMyCells. Reproduced when all cells with a transcriptome pass under a reading;
    partially reproduced when at least 90% pass. The fraction of the 96 cells with a
    transcriptome is reported.
- id: patchseq-transcriptome-link
  kind: link
  statement: The Patch-seq transcriptomes at the NeMO Archive can be matched to the dandiset's
    recorded cells, one library per cell, through the identifiers the dandiset gives.
  source: The dandiset's mapping.tsv and README.txt (ASSOCIATED DATASETS); the paper's Data
    availability
  data: elsewhere
  where: NeMO Archive collection nemo:col-s96tk9a (Patch-seq raw FASTQ), named in the dandiset's
    README and metadata; files pinned by their NeMO identifiers and MD5 sums
  depends_on:
  - patchseq-sample
  criterion: Added by the author (protocol, author, step 4). Records are matched by identifier;
    each cell's library_aliquot_nhash_id in mapping.tsv, and the NeMO sample named by its
    nemo_assets_url, whose sample name must equal that identifier. The link holds (reproduced)
    when every cell with a library identifier resolves to a NeMO library with two FASTQ files
    (R1 and R2) whose MD5 sums match NeMO's, and whose specimen type is nuclei and technique
    SMART-seq, as the paper describes; partially reproduced when at least 90% do. The number of
    the 96 cells that have a library identifier is reported.
- id: tau-table-link
  kind: link
  statement: The membrane time constants in the paper's frozen table (LCNE-patchseq-figures at
    79fa20a, code/data/LCNE_patchseq_S14_cell_table.csv) can be matched to the dandiset's cells
    and agree with the time constants computed from the dandiset's sweeps.
  source: README of LCNE-patchseq-figures at 79fa20a, Cell metadata
  data: with_inputs
  depends_on:
  - patchseq-sample
  criterion: Added by the author (protocol, author, step 4), for the code variant of the
    patchseq-tau claims. Records are matched by ephys_roi_id, the session label of each NWB file.
    The link holds (reproduced) when every table row matches one file and, over cells with a
    value on both sides, the IPFX time constant computed here from all of a cell's subthreshold
    long squares (no sweep rule, as the code's variant has none) is within 10% of the table's value
    for at least 90% of the cells; partially reproduced for 50% to 90%; not reproduced below.
- id: patchseq-ap-waveform-spinal-vs-cortex
  statement: The intracellular action potential waveforms of LC-NE neurons projecting to the
    spinal cord differ significantly from those of neurons projecting to isocortex (two-sided
    Welch's t-test, p < 0.01).
  source: Extended Data Fig. 11k, left; Results, LC-NE activity during action-outcome learning,
    paragraph 5
  quote: Neurons projecting to spinal cord had significantly different action potential
    waveforms than those projecting to isocortex or cerebellum.
  statistics:
  - test: two-sided Welch's t-test
    p: 0.01
    p_relation: "<"
    n: cells projecting to spinal cord against cells projecting to isocortex (54 and 27 cells)
  depends_on:
  - patchseq-sample
  criterion: Method from the paper's code (LCNE-patchseq-figures at 79fa20a, code/spikes.py and
    code/generate_S14jk.py), as the legend names no waveform measure. For each cell, take the
    long-square rheobase sweeps (protocols X3LP_Rheo_DA_0 and X5LP_Rheo_DA_0) whose main pulse
    lasts at least 0.8 s, and choose the one of lowest absolute amplitude that has at least one
    spike during the pulse. Detect spike peaks as the voltage maximum between paired upward and
    downward crossings of -10 mV (after eFEL-style resampling at the sampling step), and average
    the raw voltage from -5 to 10 ms around every peak of that sweep. Min-max normalize each
    average over -2 to 4 ms, keep -3 to 6 ms, mean-centre across all cells, and take PC1 by SVD
    (its sign is arbitrary and does not affect the test). Compare PC1 between spinal cord and
    cortex cells with a two-sided Welch t-test at the cell level (scipy ttest_ind,
    equal_var=False). Reproduced when p < 0.01; partially reproduced when 0.01 <= p < 0.05.
    The group means, t, degrees of freedom and p are reported. The Methods and the code
    disagree on sweep inclusion. The Methods give a sweep inclusion rule (bridge balance below
    20 MOhm and 15% of input resistance, bias current within 100 pA, RMS noise below 0.07 mV
    over 1.5 ms and 0.5 mV over 500 ms; Methods, Patch-seq recordings) that the code does not
    apply. Following protocol step 2, the main reading applies the Methods' sweep rule before
    choosing the rheobase sweep, where the files hold the values it needs; the variant is the
    code's, with no further sweep rule. Where the files lack those values the two coincide, and
    this is recorded. Results under both are shown.
- id: patchseq-ap-waveform-spinal-vs-cerebellum
  statement: The intracellular action potential waveforms of LC-NE neurons projecting to the
    spinal cord differ significantly from those of neurons projecting to cerebellum (two-sided
    Welch's t-test, p < 0.05).
  source: Extended Data Fig. 11k, left; Results, LC-NE activity during action-outcome learning,
    paragraph 5
  quote: Intracellular action potential waveforms (left; two-sided Welch’s \(t\) -tests, spinal
    cord vs. cortex, \(p < 0.01\) , spinal cord vs. cerebellum, \(p < 0.05\) )
  statistics:
  - test: two-sided Welch's t-test
    p: 0.05
    p_relation: "<"
    n: cells projecting to spinal cord against cells projecting to cerebellum (54 and 15 cells)
  depends_on:
  - patchseq-sample
  criterion: The same waveform PC1 as in patchseq-ap-waveform-spinal-vs-cortex, from the paper's
    code (LCNE-patchseq-figures at 79fa20a), with the same main reading (the Methods' sweep rule)
    and variant (the code's) of sweep inclusion.
    Compare PC1 between spinal cord and cerebellum cells with a two-sided Welch t-test at the
    cell level. Reproduced when p < 0.05; not reproduced otherwise. Group means, t, degrees of
    freedom and p are reported.
- id: patchseq-tau-cortex-vs-spinal
  statement: LC-NE neurons projecting to isocortex have significantly longer membrane time
    constants than neurons projecting to the spinal cord (two-sided Welch's t-test, p < 0.001).
  source: Extended Data Fig. 11k, right; Results, LC-NE activity during action-outcome learning,
    paragraph 5
  quote: Neurons projecting to isocortex had significantly longer membrane time constants than
    those projecting to cerebellum or spinal cord
  statistics:
  - test: two-sided Welch's t-test
    p: 0.001
    p_relation: "<"
    n: cells projecting to spinal cord against cells projecting to isocortex with a time constant
  depends_on:
  - patchseq-sample
  criterion: The Methods say the features were computed with the IPFX package (Methods,
    Patch-seq recordings). The paper's code (LCNE-patchseq-figures at 79fa20a) does not compute
    the time constant; it reads IPFX's tau from a frozen table, in ms, missing for 14 of 96
    cells. Main reading, from the Methods and the dataset - compute tau per cell with IPFX's
    long-square subthreshold analysis at its default settings (exponential fits to the
    hyperpolarizing long-square responses, averaged over the qualifying sweeps), using the
    Methods' sweep inclusion rule where the files hold its values. Variant, from the code - the
    frozen values in code/data/LCNE_patchseq_S14_cell_table.csv at 79fa20a, keyed by
    ephys_roi_id (an outside input). Compare cortex and spinal cord cells with a two-sided
    Welch t-test at the cell level (code/generate_S14jk.py, scipy ttest_ind, equal_var=False).
    Reproduced when p < 0.001 and the cortex mean exceeds the spinal cord mean; partially
    reproduced when p < 0.05 with cortex longer. The number of cells with a time constant per
    group, the group means, t and p are reported for each reading.
- id: patchseq-tau-cortex-vs-cerebellum
  statement: LC-NE neurons projecting to isocortex have significantly longer membrane time
    constants than neurons projecting to cerebellum (two-sided Welch's t-test, p < 0.001).
  source: Extended Data Fig. 11k, right; Results, LC-NE activity during action-outcome learning,
    paragraph 5
  quote: membrane time constants (right; two-sided Welch’s \(t\) -tests, spinal cord vs. cortex,
    \(p < 0.001\) , cerebellum vs. cortex, \(p < 0.001\) ) showed differences by projection
    target
  statistics:
  - test: two-sided Welch's t-test
    p: 0.001
    p_relation: "<"
    n: cells projecting to cerebellum against cells projecting to isocortex with a time constant
  depends_on:
  - patchseq-sample
  criterion: The time constant as in patchseq-tau-cortex-vs-spinal (IPFX on the dataset, main;
    the code's frozen table, variant). Compare cortex and cerebellum cells with a two-sided
    Welch t-test at the cell level. Reproduced when p < 0.001 and the cortex mean exceeds the
    cerebellum mean; partially reproduced when p < 0.05 with cortex longer. Cells per group,
    means, t and p are reported for each reading.
# Anatomy: not in this dataset.
- id: lc-definition
  statement: LC, defined in the CCF as the region at the 67th density percentile of pontine Dbh+
    nuclei (34,998 cells, 8 mice), is a small dorsal region of 0.13 mm3 holding 1,507 +- 55
    noradrenergic neurons per mouse, with 367 +- 95 more in sub-coeruleus.
  source: Results, LC-NE projections are spatially organized, paragraph 1; Fig. 1a,b
  quote: We defined LC in the CCF as a small dorsal region (0.13 mm 3 in volume) containing
    approximately two-thirds of all pontine noradrenergic neurons (67th density percentile,
    1,507 ± 55, mean ± s.d.).
  expected:
  - quantity: LC volume
    value: 0.13
    tolerance: 0.013
    unit: mm3
  - quantity: LC-NE neurons per mouse in LC, mean (s.d. 55)
    value: 1507
    tolerance: 55
  - quantity: noradrenergic neurons in sub-coeruleus per mouse, mean (s.d. 95)
    value: 367
    tolerance: 95
  criterion: Method from Methods, Definition of LC-NE neurons - Dbh-Cre;H2B-GFP nuclei detected
    in SmartSPIM volumes, registered to CCFv3, restricted to caudal midbrain and dorsal pons,
    reflected into one hemisphere; local density by nearest neighbours; LC is the mesh at the
    67th density percentile. Tolerances on counts are the paper's s.d.
- id: axon-density
  statement: LC-NE axons from one hemisphere reach a high density in all CNS regions except the
    striatum, at varying densities; projections to the telencephalon are mainly ipsilateral and
    those to other regions bilateral.
  source: Results, LC-NE projections are spatially organized, paragraph 2; Fig. 1c-e
  quote: We found a high density of LC-NE axons in all CNS regions other than the striatum, with
    varying densities across regions (Fig. 1c–e and Extended Data Fig. 1 ). Projections to the
    telencephalon were predominantly ipsilateral
  criterion: From the unilateral dense labelling imaged by SPIM (Results, paragraph 2; Methods,
    Single-neuron reconstructions for the imaging). The paper gives no measure of density or a
    threshold, and does not say which set of regions the comparison spans. Open, with readings
    (a) the level-2 CCF regions, the level the paper uses for the reconstructions (Results,
    paragraph 3); (b) the coarse regions of Methods, Models of single-neuron axonal
    distributions, with striatum split out of cerebral nuclei. Reproduced when the striatum has
    the lowest axon density of the regions and the telencephalon's ipsilateral density exceeds
    its contralateral density.
- id: axon-length-and-branching
  statement: Reconstructed LC-NE neurons (132 cells, 4 mice) have long axons (34.20 +- 12.83 cm,
    longest 70.32 cm) that branch little (17.7 branches per cm), significantly less than 1,549
    other CNS neurons (32.6 branches per cm; ANCOVA).
  source: Results, LC-NE projections are spatially organized, paragraph 3; Extended Data Fig. 2b
  quote: Many neurons had long axons (34.20 ± 12.83 cm, mean ± s.d.; Extended Data Fig. 2b ),
    with the largest neurons reaching 70.32 cm of total length ... LC-NE neurons branched
    significantly less (ANCOVA (analysis of covariance), P = 3.9 × 10 −160 )
  statistics:
  - about: branches against axon length, LC-NE neurons
    test: linear regression
    statistic: R2 = 0.72
    p: 3.6e-38
    n: 132 neurons
  - about: branches against axon length, MouseLight neurons
    test: linear regression
    statistic: R2 = 0.45
    p: 3.6e-201
    n: 1,549 neurons
  - about: LC-NE against other CNS neurons, branches per length
    test: ANCOVA
    p: 3.9e-160
  expected:
  - quantity: mean total axon length (s.d. 12.83)
    value: 34.20
    tolerance: 12.83
    unit: cm
  - quantity: longest total axon length
    value: 70.32
    tolerance: 7.03
    unit: cm
  - quantity: LC-NE branches per cm (regression slope)
    value: 17.7
    tolerance: 1.77
  - quantity: MouseLight branches per cm (regression slope)
    value: 32.6
    tolerance: 3.26
  criterion: Reconstructions in CCF from ExA-SPIM and HortaCloud (Methods, Single-neuron
    reconstructions); the comparison set is the MouseLight database. Reproduced when the values
    are within tolerance and the ANCOVA finds fewer branches per length for LC-NE neurons at p
    < 0.05.
- id: single-neuron-primary-targets
  statement: Individual LC-NE neurons tend to send their axons mainly to one region (cortex,
    thalamus and midbrain, cerebellum, brainstem or spinal cord); neurons projecting to the
    forebrain avoid the brainstem and spinal cord, and the reverse.
  source: Results, LC-NE projections are spatially organized, paragraph 3; Fig. 2b,c
  quote: Consistent with largely non-overlapping pathways, neurons with forebrain projections
    tended to project to other regions in the forebrain but not the brainstem or spinal cord
    (Fig. 2c ).
  criterion: Fraction of each neuron's axon length in each coarse region and the rank
    correlation across neurons between region pairs (Fig. 2c legend; Methods, Models of
    single-neuron axonal distributions, for the regions). Reproduced when the rank correlations
    are positive among forebrain regions and negative between forebrain regions and medulla or
    spinal cord.
- id: markov-renewal-model
  statement: A model in which axons grow as a Markov random walk between brain regions with a
    length-dependent Weibull renewal process captures the anterior-posterior block structure of
    LC-NE projections, unlike random projections.
  source: Results, LC-NE projections are spatially organized, paragraph 3; Extended Data Fig. 2d;
    Methods, Models of single-neuron axonal distributions
  quote: A simple model that assumes axons grow as a random walk with a renewal process that
    depends on the length of the axons captured fundamental structural features of LC-NE
    projections (Extended Data Fig. 2d ).
  criterion: Model as in Methods, Models of single-neuron axonal distributions (10-um steps,
    transitions counted after 2 mm in the new region, minimum length 10 mm, Weibull renewal fit
    with incomplete spinal neurons censored). Reproduced when the model's region correlation
    matrix shows the anterior-posterior block structure of the data and the shuffled model does
    not.
- id: mapseq-consistent
  statement: MAPseq/BARseq barcoding finds LC-NE neurons projecting across the CNS, with soma and
    axon distributions consistent with the single-neuron reconstructions.
  source: Results, LC-NE projections are spatially organized, paragraph 5; Extended Data Fig. 3
  quote: We found LC-NE neurons with projections across the CNS, with distributions of somata
    and axons consistent with our single-neuron morphologies (Extended Data Fig. 3 ).
  criterion: Methods, BARseq and MAPseq and the following sections (1-mismatch barcode matching,
    12 coarse regions, row-normalized fractions). The paper gives no measure of consistency.
    Reproduced when the share of neurons whose top region is forebrain against hindbrain
    follows the same dorsal-ventral soma order as in dorsal-ventral-projection-targets.
- id: dorsal-ventral-projection-targets
  statement: LC-NE neurons in dorsal LC have primary projections to the forebrain (olfactory
    bulb, isocortex, hippocampus) and neurons in ventral LC to the hindbrain (pons, medulla,
    spinal cord).
  source: Results, LC-NE projections are spatially organized, paragraph 6; Fig. 2d,e
  quote: Neurons in more dorsal LC had primary projections to the forebrain (olfactory bulb,
    isocortex and hippocampus), whereas neurons in more ventral LC had primary projections to
    the hindbrain (pons, medulla and spinal cord).
  criterion: Soma CCF dorsal-ventral position of each reconstructed neuron against its primary
    target (region with the largest axon fraction). The paper reports no test. Reproduced when
    the median soma depth of forebrain-primary neurons is dorsal to that of hindbrain-primary
    neurons.
- id: retrograde-dorsal-cortex-ventral-spinal
  statement: Retrograde tracing confirms that noradrenergic neurons projecting to cortex lie
    preferentially in dorsal LC and those projecting to the spinal cord in ventral LC.
  source: Results, LC-NE projections are spatially organized, paragraph 6; Fig. 2f; Extended
    Data Fig. 5
  quote: somata of noradrenergic neurons with projections to cortex were preferentially in
    dorsal LC and noradrenergic neurons with projections to the spinal cord were in ventral LC
  criterion: AAVrg-DIO-FLPo in Dbh-Cre;Ai65 mice, labelled somata registered to CCF (Methods,
    Retrograde tracing). The paper reports no test here. Reproduced when the median
    dorsal-ventral CCF coordinate of cortex-labelled somata is dorsal to that of spinal
    cord-labelled somata.
# Gene expression: sequencing data not in this dataset.
- id: snrnaseq-single-cluster
  statement: LC-NE gene expression from snRNA-seq (4,743 Dbh+ neurons, 40 mice) is best
    described by a single cluster with smooth, graded variation (a continuum).
  source: Results, LC-NE neurons have graded gene expression in space, paragraph 1; Extended Data
    Fig. 6e
  quote: A single cluster best explained the data (Extended Data Fig. 6e ), although gene
    expression varied smoothly across the LC-NE neuron population.
  data: elsewhere
  where: NeMO collection col-p9d5w39 (https://assets.nemoarchive.org/col-p9d5w39), the
    sequencing archive named in the paper's Data availability
  expected:
  - quantity: LC-NE nuclei after QC
    value: 4743
    tolerance: 474
  criterion: Methods, Cluster quality analysis - silhouette scores for K = 1 to 15 with Gaussian
    mixture models in 10-dimensional PCA space (and MMIDAS), five seeds each. Reproduced when
    the mean silhouette score is highest at K = 1 under both clustering methods (Methods, Cluster
    quality analysis, "always highest with a single cluster").
- id: pseudospace-graded-genes
  statement: Many genes vary smoothly along the pseudospace axis of LC-NE gene expression,
    including axon guidance, adhesion, extracellular matrix, ion channel, receptor and
    transcription genes, some in opposing gradients (Epha6 against Epha7, Col18a1 against
    Col6a5).
  source: Results, LC-NE neurons have graded gene expression in space, paragraph 1; Fig. 3a,b
  quote: In some cases, two related genes were expressed in opposing gradients ... Epha6 versus
    Epha7 and Col18a1 versus Col6a5
  data: elsewhere
  where: NeMO collection col-p9d5w39 (https://assets.nemoarchive.org/col-p9d5w39)
  expected:
  - quantity: variance explained by the first 10 PCs
    value: 0.80
    tolerance: 0.08
  - quantity: variance explained by the pseudospace curve
    value: 0.46
    tolerance: 0.046
  criterion: Pseudospace as in Methods, Pseudospace analysis (cubic polynomial in the first 10
    PCs of 1,500 HVGs after scVI, cells projected to the nearest of 10,000 curve points, scaled
    0 to 1). Reproduced when Epha6 and Epha7, and Col18a1 and Col6a5, have rank correlations
    with pseudospace of opposite sign.
- id: merfish-pseudospace-dorsal-ventral
  statement: Pseudospace imputed onto 2,308 MERFISH LC-NE neurons registered to the CCF aligns
    with the dorsal-ventral axis of LC.
  source: Results, LC-NE neurons have graded gene expression in space, paragraph 2; Fig. 3c
  quote: Gene expression pseudospace aligned with the dorsal–ventral axis of the LC (Fig. 3c and
    Extended Data Fig. 7 )
  data: elsewhere
  where: MERFISH data of Nardone et al. 2024 (Nat. Commun. 15, 1966; ref. 39) and snRNA-seq in
    NeMO collection col-p9d5w39
  expected:
  - quantity: MERFISH LC-NE neurons
    value: 2308
    tolerance: 231
  criterion: Methods, Analysis of MERFISH data and Pseudospace score imputations (k = 50
    nearest snRNA-seq neighbours on shared genes). Reproduced when imputed pseudospace
    correlates with the CCF dorsal-ventral coordinate at p < 0.05 and more strongly than with
    the other two axes.
- id: retroseq-projection-gene-space
  statement: Neurons projecting to isocortex, cerebellum or spinal cord occupy different parts
    of gene expression space; cortex-projecting neurons resemble dorsal LC-NE neurons,
    spinal cord-projecting neurons ventral ones, and cerebellum-projecting neurons lie between.
  source: Results, LC-NE neurons have graded gene expression in space, paragraph 3; Fig. 3d
  quote: Cortex-projecting neurons shared gene expression with dorsal LC-NE neurons, spinal
    cord-projecting neurons with ventral neurons, and cerebellum-projecting neurons were in
    between.
  data: elsewhere
  where: NeMO collection col-p9d5w39 (https://assets.nemoarchive.org/col-p9d5w39)
  statistics:
  - test: Kruskal-Wallis
    p: 0.001
    p_relation: "<"
  criterion: Projection targets imputed onto snRNA-seq cells by 10 nearest retro-seq
    neighbours with at least 8 agreeing (Methods, Projection site imputations for snRNA-seq
    data). Reproduced when pseudospace differs between imputed targets (Kruskal-Wallis p <
    0.001) in the order cortex, cerebellum, spinal cord.
- id: projection-and-expression-axes
  statement: The primary spatial axes explaining axonal projections (retrograde tracing) and
    gene expression (MERFISH) both run dorsal-ventral, about 20 degrees apart, and differ
    significantly.
  source: Results, LC-NE neurons have graded gene expression in space, paragraph 4; Fig. 3e
  quote: Primary axes that explain axonal projections (black, from retrograde tracing) and gene
    expression (grey, from MERFISH) were primarily dorsal–ventral but differed
  statistics:
  - test: bootstrapped Mahalanobis test of axis difference
    statistic: chi-squared(2) = 29.9
    p: 1.0e-4
  expected:
  - quantity: angle between the two axes
    value: 20
    tolerance: 2
    unit: degrees
  criterion: Methods, Global linear trend test for single features using LDA (retrograde
    labels), CCA (MERFISH genes), Bootstrap estimation of spatial vector confidence intervals
    and Comparison of two primary spatial axes. Reproduced when both axes are mainly
    dorsal-ventral, the angle is within tolerance and the bootstrap p < 0.05. Extended Data
    Fig. 15c prints p = 3.25 x 10^-7 for the same chi-squared; either p meets the criterion.
# In vivo physiology and behaviour: not in this dataset.
- id: behaviour-history-dependence
  statement: Mice tracked changing reward probabilities, using reward and choice history to
    guide choices; a logistic regression on outcome history fits choices with R2 = 0.60 and
    predicts 0.88 of them (259 sessions, 32 mice).
  source: Fig. 4c; Results, LC-NE activity during action-outcome learning, paragraph 3
  quote: Mice tracked the changing reward probabilities, using reward and choice history to
    influence future choices (Fig. 4c ).
  expected:
  - quantity: R2 of choice logistic regression
    value: 0.60
    tolerance: 0.06
  - quantity: fraction of choices predicted
    value: 0.88
    tolerance: 0.088
  criterion: Choice model in Methods, Analyses and models of behaviour (10 trials of reward and
    choice history). Reproduced when both values are within tolerance and the reward history
    coefficients are positive and decay with lag.
- id: go-cue-response
  statement: Nearly all LC-NE neurons (240 of 241, 19 mice) increase their spike rate in the 300
    ms after the go cue, and the size of this increase relative to baseline is anticorrelated
    with the correlation between go-cue and baseline rates.
  source: Results, LC-NE activity during action-outcome learning, paragraph 6; Fig. 4g,h
  quote: Nearly all LC-NE neurons showed an increase in spike rate in a 300 ms window following
    the go cue (paired t -tests, 240 out of 241 cells, 19 mice; Fig. 4e–h ).
  statistics:
  - about: go-cue response against baseline-response correlation
    test: correlation
    statistic: r = -0.38
    p: 8.3e-11
    n: 241 cells
  expected:
  - quantity: cells with an increase after the go cue
    value: 240
    tolerance: 24
  - quantity: correlation coefficient, Fig. 4h
    value: -0.38
    tolerance: 0.038
  criterion: Per cell, a paired t-test of the spike rate in the 300 ms after go cues against the
    2 s before (Fig. 4g legend). Open, the paper does not give the threshold for counting a cell;
    readings (a) p < 0.05 with a higher rate after the cue; (b) a higher mean rate after the cue.
- id: ventral-respond-ignore
  statement: Spike rates in the 2 s before the go cue predict whether the mouse responds, higher
    before ignored trials (46.5% of neurons significant), strongest in ventral LC.
  source: Results, LC-NE activity during action-outcome learning, paragraph 7; Fig. 5b-d
  quote: "This effect was strongest in neurons in ventral LC (Fig. 5c ; P values from permutation
    test of linear regression between t -statistics and spatial location: R 2 = 0.152, P = 1.4 ×
    10 −3 )."
  statistics:
  - about: t-statistics against CCF location, linear model
    test: permutation test of linear regression
    statistic: R2 = 0.152
    p: 1.4e-3
    n: 103 cells, 15 mice
  - about: t-statistics against CCF location, kNN
    test: kNN cross-validated permutation test
    statistic: R2 = 5.57e-2
    p: 8.4e-3
    n: 103 cells, 15 mice
  - about: projection onto the retrograde tracing axis
    test: Pearson correlation
    statistic: r = 0.36
    p: 2.0e-4
  - about: projection onto the MERFISH axis
    test: Pearson correlation
    statistic: r = 0.36
    p: 2.2e-4
  expected:
  - quantity: fraction of neurons with p < 0.05
    value: 0.465
    tolerance: 0.0465
  criterion: Per neuron, linear regression of the baseline rate 2 s before each go cue on
    respond against ignore (Methods, Linear regression models of spike rates); spatial tests as
    in Methods, Analysing relationships with space (5,000 permutations; kNN with k = 20, 5
    folds). Reproduced when the fraction is within tolerance and the linear permutation p <
    0.05 with ventral neurons more positive for ignore.
- id: dorsal-switch-stay
  statement: LC-NE neurons with higher activity in the 500 ms after the go cue on switch than on
    stay choices lie in dorsal LC, and those preferring stay in ventral LC.
  source: Results, LC-NE activity during action-outcome learning, paragraph 8; Fig. 5f-h
  quote: Neurons with higher activity during switch choices tended to be in dorsal LC, whereas
    those with higher activity during stay choices tended to be in ventral LC
  statistics:
  - about: t-statistics against CCF location, linear model
    test: permutation test of linear regression
    statistic: R2 = 0.168
    p: 3.0e-4
    n: 114 cells, 15 mice
  - about: t-statistics against CCF location, kNN
    test: kNN cross-validated permutation test
    statistic: R2 = -4.96e-2
    p: 0.15
    n: 114 cells, 15 mice
  - about: projection onto the retrograde tracing axis
    test: Pearson correlation
    statistic: r = 0.37
    p: 4.4e-5
  - about: projection onto the MERFISH axis
    test: Pearson correlation
    statistic: r = 0.35
    p: 1.3e-4
  criterion: Per neuron, linear regression of the go-cue period rate (0.5 s) on switch against
    stay (Methods, Linear regression models of spike rates); spatial tests as in Methods,
    Analysing relationships with space. Reproduced when the linear permutation p < 0.05 with
    dorsal neurons more positive for switch.
- id: cortex-input-switch
  statement: LC-NE axonal fluorescence in prelimbic cortex and the spiking of LC-NE neurons
    identified as projecting to cortex are higher on switch than on stay choices, more so than
    the population of single neurons.
  source: Results, LC-NE activity during action-outcome learning, paragraph 9; Fig. 5j,k
  quote: LC-NE axonal fluorescence changes in PL and single-neuron spiking projecting to frontal
    cortex were significantly higher during switch versus stay choices (Fig. 5j,k , Fisher’s
    exact test, P = 7.8 × 10 −5 ).
  statistics:
  - test: Fisher's exact test
    p: 7.8e-5
  criterion: Sign-based comparison of switch-versus-stay t-statistics (proportion positive)
    between groups, Fisher's exact test (Methods, Comparison between single-neuron activity and
    axonal GCaMP); axonal regression in 0.75 s after the go cue (Methods, Linear regression
    models of axonal GCaMP). Reproduced when p < 0.05 with a larger positive share for the
    cortex-projecting signals.
- id: outcome-responses-spatial
  statement: LC-NE neurons respond variously to reward or its absence (76.8% with significant
    regressions); reward-excited neurons lie more dorsal and anterior than no-reward-excited
    neurons, a nonuniform distribution in space.
  source: Results, Frontal cortex LC-NE activity correlates with RPE, paragraphs 1 and 2; Fig. 6a
  quote: Neurons with increased activity in response to reward tended to lie more dorsal and
    anterior in LC than neurons with increased activity in response to no reward
  statistics:
  - about: spatial distribution of reward- and no-reward-excited neurons
    p: 3.0e-4
  expected:
  - quantity: fraction of cells with significant outcome regressions
    value: 0.768
    tolerance: 0.0768
  criterion: Outcome regressions as in Methods, Linear regression models of spike rates (reward
    and no-reward windows, the larger absolute t kept). The test behind P = 3.0 x 10^-4 is not
    named; the LDA trend test (Methods, Global linear trend test for single features using LDA)
    is the one the Methods give for categorical labels. Reproduced when the fraction is within
    tolerance and the spatial test gives p < 0.05 with reward-excited neurons dorsal.
- id: rpe-predicts-choice-change
  statement: The change in choice between consecutive trials correlates with model-estimated
    RPE (rank correlation 0.84).
  source: Fig. 6c; Results, Frontal cortex LC-NE activity correlates with RPE, paragraph 1
