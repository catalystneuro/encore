- id: extracellular-waveform-spatial
  statement: Extracellular spike waveforms of LC-NE neurons vary in space; dorsal neurons have
    more symmetric waveforms and longer peak-to-trough times than ventral neurons.
  source: Results, LC-NE activity during action-outcome learning, paragraph 4; Extended Data Fig.
