- id: outcome-coefficients-cluster
  statement: Regression coefficients of outcome-period spiking on reward and chosen value are
    nonuniformly distributed in angle, and neurons projecting to isocortex are biased towards
    RPE (excited by reward, inhibited by predicted reward).
  source: Fig. 6e,f; Results, Frontal cortex LC-NE activity correlates with RPE, paragraph 2
  quote: Polar histogram of coefficients from regressions in e shows a nonuniform distribution
