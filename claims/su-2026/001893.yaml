- id: frontal-axons-rpe
  statement: LC-NE axonal activity in prelimbic cortex 1.5 s after outcome correlates with RPE,
    and the regressions of axonal activity and of cortex-projecting neurons are more positive
    than those of the population of single neurons.
  source: Results, Frontal cortex LC-NE activity correlates with RPE, paragraph 3; Fig. 6i-l
