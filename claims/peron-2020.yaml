# Claims for Peron, Pancholi, Voelcker, Wittenbach, Olafsdottir, Freeman & Svoboda (2020),
# "Recurrent interactions in local cortical circuits", Nature 579, 256-259, on CRCNS ssc-11.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-11-10, protocol pilot-14 as stated in docs/protocol.md.
#
# Text read: the version of record (paper/10.1038-s41586-020-2062-x.txt, supplied by a person,
# extracted from the PDF), with the main text, figure legends, Methods, Extended Data Figs. 1-8
# legends, Extended Data Table 1 and the reporting summary. The P values printed only inside
# Figs. 2j, 2k, 3b, 3f, 3g and Extended Data Figs. 5 and 6, and the rows of Extended Data
# Table 1, were read from the PDF pages, as the text extraction garbles or omits them. The
# supplementary information named online is the reporting summary, which is in the text; no
# other supplement is cited by the results.
#
# Code read. Analysis, github.com/peronlab/ablation at commit 74b7321 (74b732149ea5813c2394207f94a6a9e7f84d9bed,
# 2020-02-16), MATLAB. It holds the mouse lists per ablation type (get_anims.m), the pre and
# post data folders and ablation files per mouse (get_data_path.m), the per-neuron table of
# touch and whisking scores, shuffle scores, event rates, positions and ablation flags
# (get_ablation_data.m), the membership rule (get_restricted_neurons.m,
# get_rejects_based_on_shuffle.m), Fig. 2j-l (ablation_figure_score_change.m), Fig. 2m and
# Extended Data Figs. 3a and 5 (ablation_figure_distance.m), Fig. 3c-g
# (ablation_figure_correlation.m), Extended Data Fig. 6 (ablation_figure_beh.m), Extended Data
# Fig. 2 (ablation_figure_energy.m), Fig. 2h-i maps (ablation_figure_3d_plot.m) and the counts
# quoted in the Results (ablation_summ_stats.m). Simulation, github.com/jwittenbach/ablation-sim
# at commit a8b5583 (a8b5583ef8ac9b8ad1cfef883186e67763c925ef, 2016-02-05), Python with Brian.
# Its parameter files (5,000 neurons, 4,000 excitatory, tauE 15 ms, ablation of 30 neurons)
# are not those of the Methods (2,000 neurons, 1,700 excitatory, tau 30 ms, 20 ablated), so it
# predates the published model; the model claims follow the Methods and use the repository only
# for its structure (encoding score by cross-correlation, removal of outgoing synapses).
#
# Data the paper used. 16 mice (Extended Data Table 1; 15 male), two lines: j mice
# (Emx1-IRES-cre x R26-LSL-H2B-mCherry, AAV2/1-syn-GCaMP6s) and n mice (Ai162 x
# Slc17a7-IRES2-cre). IDs j250220, j257218, j257220, j258836, j271211, j278937, j278939,
# j281915, n274424, n272761, n274577, n275801, n275798, n278288, n276013, n278759. Mice
# performed a single-whisker object localization task (pole in proximal or distal positions,
# lick right or left; sample, delay and response epochs). Two-photon volumetric imaging of L2/3
# of the spared whisker's barrel column at 7 Hz, three 600 x 600 um planes 15 um apart per
# subvolume, 4-6 subvolumes (12-18 planes, 180-270 um), about 50 trials per subvolume per day.
# Pre-ablation and post-ablation data are each 2-4 sessions (typically 3), with the ablation
# day between them. Ablation types (24 ablations in all): touch, 9 mice (code: 250220, 257220,
# 258836, 271211, 281915, 274424, 272761, 274577, 275801); whisking, 7 mice (278937, 278939,
# 281915, 275798, 278288, 276013, 278759); silent, 8 mice (257218, 258836, 271211, 278937,
# 278939, 275801, 275798, 276013). Several mice had two ablations in sequence; the code takes
# the post data of the first as the pre data of the second (get_data_path.m). Measured
# variables, as the code reads them from the session files: per neuron, the touch encoding
# score Rtouch (feature eventBasedDff_k16t14_<whisker>AbsMaxKappaZeroNotouchGLMScore), the
# whisking score Rwhisking (eventBasedDff_k16t14_MeanWhiskerAmplitudeGLMScore), their shuffle
# scores (GLMShuffleScore), the calcium event rate (eventRateHz), ROI positions, and
# trial-averaged dF/F on correct left and right trials (dffBased_HitLTrialAvg,
# dffBased_HitRTrialAvg); the ablation logs and the curation files flagging which targets were
# ablated successfully; whisker angle, curvature at touch, touches and trial outcomes.
#
# Methods common to the experimental claims, from the Methods and the analysis code.
# A neuron belongs to a representation when its score exceeds 0.1 and exceeds the 99th
# percentile of the shuffle scores of the neurons in its subvolume and event-rate decile
# (Methods, Neuronal classification; get_rejects_based_on_shuffle.m), in the pre-ablation
# period, the post-ablation period or both (Methods; get_restricted_neurons.m). Neurons that
# belong to both representations are left out (Methods; code). Ablated neurons (successful
# targets in the curation file) are always left out, and so are neurons within a cylinder of
# radius 10 um and height 60 um centred on an ablated neuron (Methods, Multiphoton ablation).
# The code applies the cylinder as lateral distance < 10 um and signed depth difference < 30
# um (get_ablation_data.m), which also drops every neuron shallower than the ablated one within
# 10 um laterally; the Methods cylinder (|depth difference| < 30 um) is the main reading and
# the code's rule a variant. For each mouse, the median of the included neurons' scores before
# and after ablation; across mice, the grand median and the adjusted MAD (1.4826 x MAD); pre
# against post by the Wilcoxon signed-rank test on the paired mouse medians; ablation types
# compared by the Wilcoxon rank-sum test on the per-mouse changes (Methods, Statistical
# analyses; ablation_figure_score_change.m). The response-similarity analysis uses an
# encoding-score cutoff of 0.25 in place of 0.1, with the same shuffle rule (Methods; code).
#
# Tolerances. The +/- values the paper gives with its grand medians and means are the spread
# across mice (adjusted MAD or s.d.), not an uncertainty of the statistic; as the attempt
# reruns the same mice, the statistic itself should come out close, so each value takes 10% of
# itself. Simulation values take 10% likewise, as the networks are random.
#
# Simulation claims (data elsewhere). The model outputs were not deposited; they are to be
# regenerated from the Methods. Open in the Methods and not settled by the repository: the
# input strength for Pconn 0.2 and 0.4, chosen as the one whose excitatory encoding-score
# distribution "most closely" matched the in vivo data "in terms of distribution shape and
# fraction of neurons encoding the stimulus". The paper matched to the data of its ref. 7
# (Peron et al. 2015, Neuron; "measured in vivo7", "physiological data7"), which are not this
# paper's recordings; this paper's in vivo values stand in for them. Readings: (a) the strength
# at which the fraction of excitatory neurons with score above 0.1 equals the in vivo fraction
# of touch neurons (0.108, Results); (b) the strength minimizing the Kolmogorov-Smirnov
# distance between the model's excitatory score distribution and the pooled pre-ablation
# Rtouch of the touch ablation mice; (c) as (a), with the fraction of 17% the Methods take
# from ref. 7 ("of which 17% (287) belonged to each representation7"). Also open, with no
# effect expected on the outcome, the stimulus interval
# (20 s holds 66 presentations, so about 300 ms apart, as the repository's interval of 300
# ms) and the random seeds.
schema_version: 2
dataset:
  archive: crcns
  id: ssc-11
paper: doi:10.1038/s41586-020-2062-x
claims:
- id: model-amplification-increases
  statement: In the L2/3 network model, the sensory input needed to match in vivo responses
    declines as subnetwork connectivity rises, so amplification (network output over input,
    normalized to Pconn 0.2) increases with subnetwork connectivity.
  source: Results, paragraph 3; Figure 1c
  quote: The strength of sensory input required to match in vivo responses declined with increasing
    subnetwork connectivity. Amplification ... therefore increased with subnetwork connectivity
  data: elsewhere
  where: Not deposited; generated by the model of the Methods (Network model), with structure from
    github.com/jwittenbach/ablation-sim at commit a8b5583
  criterion: >-
    The network of the Methods (2,000 leaky integrate-and-fire neurons; 200 input-recipient
    excitatory, 1,500 other excitatory, 300 inhibitory; connection probabilities 0.2 among
    excitatory and 0.6 for all with inhibitory; PSP 1 mV, and 1.6 mV within the subnetwork at
    Pconn 0.4, linearly interpolated or extrapolated in between; beta(3,5) input peaking at 10
    ms; Poisson background 5,000 Hz excitatory and 2,000 Hz inhibitory; dt 0.1 ms; 20 s per run).
    The input strengths for Pconn 0.2 and 0.4 are set under each reading named in the opening
    comment and interpolated linearly for other Pconn. Amplification is the inverse of input
    strength normalized to Pconn 0.2 (Methods). As the strengths between 0.2 and 0.4 are
    interpolated from the two matched ones, amplification over that range follows from them
    alone. Reproduced when the matched input strength at Pconn 0.4 is below that at 0.2, so
    that normalized amplification at 0.4 is above 1, under each reading; the readings' strengths
    and amplification are reported.
- id: model-equal-connectivity-ablation-increases
  statement: In networks with equal subnetwork connectivity (Pconn 0.2), ablating the strongest
    encoders raises the encoding scores of spared neurons, from 0.237 to 0.274, owing to reduced
    feedback inhibition.
  source: Results, paragraph 4; Figure 1d-f
  quote: Encoding scores for spared neurons increased after simulated ablation of 10% of the subnetwork14,
    owing to reduced feedback inhibition13,20 (encoding score, from 0.237 ± 0.027 to 0.274 ± 0.032
  statistics:
  - test: Wilcoxon signed-rank test
    p: 0.001
    p_relation: "<"
    n: 30 simulated networks
  data: elsewhere
  where: Not deposited; generated by the model of the Methods (Network model)
  depends_on:
  - model-amplification-increases
  expected:
  - quantity: grand median encoding score before ablation, Pconn 0.2
    value: 0.237
    tolerance: 0.024
  - quantity: grand median encoding score after ablation, Pconn 0.2
    value: 0.274
    tolerance: 0.027
  criterion: >-
    Model as in model-amplification-increases at Pconn 0.2, 30 random networks. Encoding score
    per neuron as the Methods define it (spikes convolved with a 20 ms s.d. Gaussian, rate and
    stimulus downsampled to 0.5 ms, peak normalized cross-correlation within lags of 10 ms). The
    20 excitatory neurons with the highest score are ablated by setting their outgoing synapses
    to 0 (Methods, which fix 20; the Results say 10% of the subnetwork, also 20) and the run is
    repeated. Neurons with score above 0.1 before or after, ablated neurons left out; per
    network the median score before and after; grand median across networks; Wilcoxon
    signed-rank test over networks. Reproduced when both grand medians are within tolerance and
    the test gives an increase at p < 0.001.
- id: model-increased-connectivity-ablation-decreases
  statement: In networks with increased subnetwork connectivity (Pconn 0.4), ablation lowers the
    encoding scores of spared neurons, from 0.243 to 0.143, because amplification is reduced.
  source: Results, paragraph 5; Figure 1d-f
  quote: Ablations reduced encoding scores for spared neurons, from 0.243 ± 0.049 to 0.143 ± 0.028
    (connectivity = 0.4; P < 0.001, n = 30 networks), because of reduced amplification
  statistics:
  - test: Wilcoxon signed-rank test
    p: 0.001
    p_relation: "<"
    n: 30 simulated networks
  data: elsewhere
  where: Not deposited; generated by the model of the Methods (Network model)
  depends_on:
  - model-amplification-increases
  expected:
  - quantity: grand median encoding score before ablation, Pconn 0.4
    value: 0.243
    tolerance: 0.024
  - quantity: grand median encoding score after ablation, Pconn 0.4
    value: 0.143
    tolerance: 0.014
  criterion: >-
    As model-equal-connectivity-ablation-increases, at Pconn 0.4 with PSPs of 1.6 mV within the
    subnetwork. Reproduced when both grand medians are within tolerance and the signed-rank test
    gives a decrease at p < 0.001.
- id: model-all-or-none-robust
  statement: Subnetwork connectivity above 0.4 gives all-or-none responses, a transient input
    driving the subnetwork into persistent activity, and such networks keep their all-or-none
    response after ablation of 10% of the subnetwork.
  source: Results, paragraphs 3 and 5; Extended Data Fig. 1 (Pconn 0.44)
  quote: Networks in the all-or-none regime19 were robust to ablation, and maintained their all-or-none
    response
  data: elsewhere
  where: Not deposited; generated by the model of the Methods (Network model)
  criterion: >-
    Model at Pconn 0.44 (Extended Data Fig. 1), with the input strength twice the extrapolated
    value and a strong excitatory pulse to the inhibitory population 300 ms after each stimulus
    onset (Methods). The pulse strength is not given; the reading used is the smallest pulse
    that returns the subnetwork rate to its pre-stimulus level before the next stimulus.
    All-or-none is read as a bimodal response, each stimulus either driving the subnetwork to a
    sustained rate until the reset pulse or leaving it near baseline. The paper gives no measure
    of robustness beyond "maintained their all-or-none response". Reproduced when the response
    is all-or-none before and after ablating the 20 strongest encoders (10% of the subnetwork,
    Extended Data Fig. 1 legend); the fraction of stimuli that trigger the persistent state and
    the change in encoding score are reported.
- id: model-more-ablation-larger-decline
  statement: In the model with Pconn 0.4, ablating more neurons (top 10, 20 or 50 encoders) gives
    larger declines in encoding score, the change correlating with the net encoding score
    ablated (R = -0.65).
  source: Results, paragraph 7; Extended Data Fig. 4
  quote: >-
    Correlation of net Rstimulus ablated and ΔRstimulus: R = −0.65, P < 0.01
  statistics:
  - test: Pearson correlation
    statistic: R = -0.65
    p: 0.01
    p_relation: "<"
    n: 30 networks per ablation size
  data: elsewhere
  where: Not deposited; generated by the model of the Methods (Network model)
  depends_on:
  - model-increased-connectivity-ablation-decreases
  expected:
  - quantity: Pearson R, net encoding score ablated against change in encoding score
    value: -0.65
    tolerance: 0.065
  criterion: >-
    Pconn 0.4, 30 networks for each of the top 0, 10, 20 and 50 neurons ablated (Methods list 0,
    10, 20, 50 and 100; the legend omits sizes above 50 as unstable). Per network, the change in
    median encoding score of spared neurons (score above 0.1 before or after) against the summed
    pre-ablation score of the ablated neurons; Pearson correlation over all networks. Whether
    the 0-ablation networks enter is open; both readings are run. Reproduced when R is within
    tolerance with p < 0.01 under one reading, and the median change is more negative for each
    larger ablation size.
- id: model-slow-input-sensitive
  statement: Networks with Pconn 0.4 given slower, whisking-like input (peak at 50 ms) are also
    sensitive to ablation, encoding scores falling from 0.143 to 0.104; with equal subnetwork
    connectivity (Pconn 0.2) the slow-input representation is not degraded.
  source: Results, paragraph 9; Extended Data Fig. 8 (title and panel c)
  quote: >-
    Change in encoding score after ablation: from 0.143 ± 0.024 to 0.104 ± 0.013, grand median
    ± adjusted MAD. P < 0.001, Wilcoxon signed-rank test paired by network (n = 30 networks)
  statistics:
  - test: Wilcoxon signed-rank test, paired by network
    p: 0.001
    p_relation: "<"
    n: 30 networks
  data: elsewhere
  where: Not deposited; generated by the model of the Methods (Network model)
  expected:
  - quantity: grand median encoding score before ablation, slow input, Pconn 0.4
    value: 0.143
    tolerance: 0.014
  - quantity: grand median encoding score after ablation, slow input, Pconn 0.4
    value: 0.104
    tolerance: 0.010
  criterion: >-
    As model-increased-connectivity-ablation-decreases, with the beta(3,5) input stretched so
    that it peaks 50 ms after onset (Methods). The input strength for slow input is not given;
    readings are (a) the strength used for touch input at the same Pconn, and (b) a strength
    set anew by the matching rule of the opening comment. The same is run at Pconn 0.2 (Methods,
    "We examined both the equal (Pconn = 0.2) and increased (Pconn = 0.4) connectivity cases").
    Reproduced when, under one reading, at Pconn 0.4 both grand medians are within tolerance
    and the signed-rank test gives a decrease at p < 0.001, and at Pconn 0.2 the same test does
    not give a decrease at p < 0.05 (the legend's title, "representation degradation in
    networks with increased, but not equal subnetwork connectivity"; the paper gives no
    number for Pconn 0.2, so its change is reported).
- id: model-response-similarity
  statement: In networks with increased subnetwork connectivity, neurons whose activity is more
    similar to the mean activity of the ablated neurons lose the most encoding score after
    ablation; with equal connectivity the relationship is absent.
  source: Results, paragraph 10; Figure 3a, b
  quote: In networks with increased subnetwork connectivity, neurons with high response similarity
    showed the largest decline in encoding score after ablation (Fig. 3b). In networks without
    increased subnetwork connectivity, the relationship disappeared
  statistics:
  - about: Pconn 0.4, slopes of change in encoding score against response similarity
    test: sign test
    p: 0.001
    n: 30 networks, 3,466 neurons
  - about: Pconn 0.2
    test: sign test
    p: 0.2
    n: 30 networks, 3,779 neurons
  data: elsewhere
  where: Not deposited; generated by the model of the Methods (Network model)
  depends_on:
  - model-equal-connectivity-ablation-increases
  - model-increased-connectivity-ablation-decreases
  criterion: >-
    Response similarity is the Pearson correlation of a neuron's Gaussian-convolved rate (20 ms
    s.d.) with the mean convolved rate of the ablated neurons (Methods, Response similarity),
    neurons with encoding score above 0.25 (Methods). Per network, a line is fitted to the
    change in encoding score against response similarity of the neurons (Methods, Statistical
    analyses, "we first fit a line to individual networks or mice (for example, Fig. 3e; the
    linear fit is distinct from the cross-cell mean that is shown)"). A fit to the means in
    0.1-wide similarity bins, as the analysis code does for the mice
    (ablation_figure_correlation.m), is run as a variant. Sign test of the 30 slopes against 0. Reproduced when at Pconn 0.4 the slopes are negative with p < 0.05 and
    at Pconn 0.2 the sign test gives p >= 0.05.
