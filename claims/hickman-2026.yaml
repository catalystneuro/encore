# Claims for Hickman, Hughes, Sahai, Miles & Denman (2026), "Neural population dynamics of direct
# electrical stimulation of neocortex", Cell Reports 45, 117420, on dandiset 000774.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23, protocol
# pilot-10 as stated in docs/protocol.md.
#
# Text read: the NIH author manuscript in Europe PMC / PMC (PMC13404931, NIHMS2190715), full text
# with Results, figure legends and STAR Methods, and Document S1 (supplement 1, 13 pages, legends of
# Figures S1 to S12). Table S1 (the "Statistics Table", the second supplementary file) is not in the
# text read: claims whose full model output is said to be there use only what the Results and
# legends print. The manuscript is based on the bioRxiv preprint of 2025-10-29 (10.1101/2025.10.28.685195).
#
# Data the paper used. Acute recordings: 9 C57BL6 mice, 9 recordings, awake and head-fixed, each with
# three Neuropixels 1.0 probes (A, B and C; 25 probes in all, probe A n = 7, B n = 9, C n = 9) inserted
# at 45 degrees around a 16-channel stimulating electrode (Neuronexus A1x16) in left V1, layer 5.
# Units sorted with Kilosort 2.5, registered to Allen CCF (region and coordinates per channel).
# Stimulation: single biphasic constant-current pulses, 100 us per phase, amplitudes 5, 25, 50 and
# 100 uA, cathodal-leading monopolar ("cathodal", negative amplitudes), anodal-leading monopolar
# ("anodal", positive amplitudes) and cathodal-leading bipolar ("bipolar"), 75 trials per condition,
# at least 2 s apart; other frequencies, depths and pulse widths were tested in some recordings and
# are in the dataset but not in the analyses. Measured variables: spike times of single units with
# waveform, channel, cluster annotation, CCF coordinates and region (NWB "units" table), and
# stimulation onset, amplitude, polarity, pulse width, frequency and contact CCF coordinates (NWB
# "trials" table). The paper says the raw AP-band, LFP-band and NI-DAQ binaries are not in the NWB
# (available on request); the evoked-potential and saturation claims (Figures 1L, 2, 3, S1, S2) rest
# on the raw AP band. Behaviour: 4 further mice (of 9 trained) with chronic stimulating electrodes in
# V1, a lick detection task with static gratings, moving circles and electrical pulses; the paper
# names only the NWB of the acute recordings as deposited, and its code reads the behaviour from local
# CSV files.
#
# Code read: github.com/denmanlab/estim_populations, commit c4aaa608314c8e8e91aee422baa69cd1b443a682
# (2025-10-29), written for the preprint. It holds notebooks figure1 to figure8 (the code's figure6 is
# the paper's Figure 5G-J, figure7 the paper's Figure 6, figure8 the paper's Figure 7), the helper
# package jlh_ephys, cached ZETA p-values per recording (recordings/*/zetascores300ms.pkl), CCF
# coordinates per probe, and intermediates (direct_df.csv, EP_distances.pkl,
# EP_boundaries_w_array_distances_curated.pkl, cortical_mi_traces*.pkl). It does not hold code for the
# Gaussian mixture of latencies, the 5 and 10 ms early windows, the high and low state analysis, the
# unit stability flags (loaded from precomputed files) or the FS/RS classifier (an external package).
#
# Method choices common to the claims on units, from the Methods and, where they are silent, the code
# (figure4_figure5.ipynb and figure7.ipynb):
# - Trials of a condition are single pulses (pulse_number 1) of 100 us per phase with the condition's
#   amplitude and polarity; the first 75 such trials (choose_stim_parameter, stim_times[0:75]). The
#   Methods say the contacts used were in or near layer 5 of V1; the code applies no depth filter and
#   takes the first run that matches. Both readings are named where a recording has more than one
#   matching run (open).
# - Units are those Kilosort/phy labels "good" that pass the stability filter (Methods, single unit
#   stability: firing rate in 60 s bins, linear fit, y-intercept over mean rate, units beyond 1.5 IQR
#   of the recording's quartiles removed); the code loads these flags (slope_outlier) from files not
#   in the repository, so the Methods procedure is used when the dataset holds no flag.
# - Distance from stimulation is the Euclidean CCF distance from the unit's peak channel to the
#   cathodal stimulation contact (code, Analysis.get_dists, contact_negative of the first trial, also
#   for bipolar). The signed "distance from stimulation" of Figures 4H and 5J is the code's
#   norm_distance (distance minus the probe's minimum distance, signed by side of the probe's closest
#   point, negative superficial).
# - Direct response probability (DRP), Methods: fraction of trials with at least one spike in
#   [onset, onset + 2 ms]; nDRP subtracts the same fraction for a 2 ms baseline window, which the code
#   (spike_probability) places from 7 to 5 ms before onset. A direct responder has nDRP > 0.15.
# - FS and RS classes, Methods: k-means on spike duration, peak-to-trough ratio and repolarisation
#   slope; units with peak-to-trough ratio >= 1 are "up", narrow up units (< 0.4 ms) "axon", left out
#   of FS/RS analyses. The dataset's cluster annotations are used if they hold these labels; otherwise
#   the k-means details (normalisation, initialisation) are open.
#
# Tolerances: 10% of the reported value unless a claim says otherwise. Where a value is printed as
# mean +- SD across units, probes or trials, that spread does not bound the mean and 10% is used; where
# the legend states mean +- SEM over recordings or mice, the SEM is the tolerance when it exceeds 10%.
schema_version: 2
dataset:
  archive: dandi
  id: "000774"
paper: doi:10.1016/j.celrep.2026.117420
