    ols('value ~ amplitude * C(polarity)') with type II sums of squares. Reproduced when the polarity
    effect has p >= 0.05 and the amplitude effect p < 0.001; the polarity effect size is reported.
- id: fig2g-extent-increases
  statement: The spatial extent of the evoked potential, both superficial and deep to the stimulation
