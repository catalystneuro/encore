    unit: um
  - quantity: superficial extent, 50 uA
    value: -741.94
    tolerance: 74.2
    unit: um
  - quantity: superficial extent, 100 uA
    value: -743.84
    tolerance: 74.4
    unit: um
  - quantity: deep extent, 5 uA
    value: 510
    tolerance: 51
    unit: um
  - quantity: deep extent, 25 uA
    value: 591
    tolerance: 59.1
    unit: um
  - quantity: deep extent, 50 uA
    value: 662
    tolerance: 66.2
    unit: um
  - quantity: deep extent, 100 uA
    value: 712
    tolerance: 71.2
    unit: um
  criterion: Needs the raw AP band, which the paper says is not in the NWB; the code's intermediate
    EP_boundaries_w_array_distances_curated.pkl holds the boundaries it computed (an outside input
    for the author to judge). Method, STAR Methods (Algorithmically determining the spatial extent) -
    trials aligned by threshold detection of the saturating artifact, 0.3 to 3 ms window, per sample
    the median over the saline channels outside the brain subtracted (Methods say the first 20 such
    channels, figure2.ipynb cell 8 uses 15; the code's 15 is a variant), mean over trials, the 1 ms
    sample, extent on each side where the potential returns to 20 uV. Where the Methods are silent the
    code is followed - Gaussian smoothing over channels (sigma 2), peak taken past channel 30 and kept
    only if above 40 uV, the boundary moved two channels inward. Distance is Euclidean CCF distance,
    negative superficial. Cathodal values. The model, from the Methods - recording as random
    intercept, maximum likelihood, Wald z test of the amplitude term; the fixed effects are polarity,
