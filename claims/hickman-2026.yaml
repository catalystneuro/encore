  source: Results, Orthogonal multi-Neuropixels recordings, paragraph 3; Figure 1L
  quote: >-
    saturation persisted for approximately 0.14 ± 0.00 ms at 5 μ A, 0.24 ± 0.01 ms at 25 μ A, 0.26 ±
    0.01 ms at 50 μ A, and 0.30 ± 0.01 ms at 100 μ A ( Figure 1L , one-way ANOVA, F = 105.62, p < 0.001)
  statistics:
  - test: one-way ANOVA
    statistic: F = 105.62
    p: 0.001
    p_relation: "<"
    n: 25 probes from 9 recordings
  expected:
  - quantity: saturation duration, 5 uA
    value: 0.14
    tolerance: 0.014
    unit: ms
  - quantity: saturation duration, 25 uA
    value: 0.24
    tolerance: 0.024
    unit: ms
  - quantity: saturation duration, 50 uA
    value: 0.26
    tolerance: 0.026
    unit: ms
  - quantity: saturation duration, 100 uA
    value: 0.30
    tolerance: 0.03
    unit: ms
  criterion: Needs the raw AP band, which the paper says is not in the NWB. Method from figure1.ipynb
    (cells 22 to 26), as the Methods give none - cathodal trials (first 75) aligned to the artifact
    onset found on channel 0, samples above 1100 uV counted per trial and channel and converted to ms
    at 30 kHz, averaged over trials, outlier channels (|z| >= 1) replaced by their neighbours'
    mean, averaged over channels to one value per probe; one-way ANOVA (scipy f_oneway) across the
    four amplitudes. Reproduced when the four means are within tolerance and the ANOVA has p < 0.001.
