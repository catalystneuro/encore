  source: Results, Orthogonal multi-Neuropixels recordings, paragraph 3; Figure S1B
  quote: >-
    despite increases in saturation with amplitude (two-way ANOVA, F = 236.04, p < 0.001), and
    polarity alone did not significantly change saturation duration ( F = 2.48, p = 0.09)
  statistics:
  - about: amplitude
    test: two-way ANOVA
    statistic: F = 236.04
    p: 0.001
    p_relation: "<"
  - about: polarity
    test: two-way ANOVA
    statistic: F = 2.48
    p: 0.086
    n: 9 recordings
