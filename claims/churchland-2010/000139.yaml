  statistics:
  - about: tuning correlation against AP location, J-array
    test: regression
    statistic: r = 0.20
    p: 0.27
  depends_on:
  - fig4d-mean-correlation-j-array
  criterion: A claim of absence, judged on the paper's test, a linear regression of each neuron's
