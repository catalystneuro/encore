- id: ap-location-no-effect-other-datasets
  statement: For monkeys A, B and J (single electrodes) the tuning correlation does not depend on
    AP location (r = -0.05, p = 0.82; r = -0.03, p = 0.85; r = -0.07, p = 0.52).
  source: Results, Comparison of anterior versus posterior sites, paragraph 1
  quote: r =-0.05, p =0.82; r =-0.03, p =0.85; r =-0.07, p =0.52; and r =0.20, p =0.27 for the four
    datasets
  statistics:
  - about: monkey A
    test: regression
    statistic: r = -0.05
    p: 0.82
  - about: monkey B
    test: regression
    statistic: r = -0.03
    p: 0.85
  - about: monkey J
    test: regression
    statistic: r = -0.07
    p: 0.52
  criterion: As ap-location-no-effect-j-array, on single-electrode datasets the archive does not
