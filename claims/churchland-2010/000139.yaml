- id: fig7c-anterior-posterior-performance
  statement: The peri-movement space captures preparatory tuning at both anterior and posterior
    sites, with normalized performance only slightly different from that of randomly divided data,
    and slightly better at anterior sites.
  source: Results, Comparison of anterior versus posterior sites, paragraph 1; Figure 7C
  quote: The ability of the peri-movement space to capture tuning also held for both anterior and
    posterior sites
  depends_on:
  - fig6d-perimovement-best-j-array
  criterion: As the Figure 7C legend gives it. Neurons split at the median AP location (anterior
    at or above, posterior at or below); for each half, a 6-D peri-movement space from that half's
    neurons and PD performance, divided by the upper limit of fig6-preparatory-dimensionality
    computed on the same half; the same for random halves (20 random splits, a standard choice).
    Open, the dimensionality of the upper limit; readings (a) 6, (b) its best k. AP location as
    in ap-location-no-effect-j-array. The paper averages over datasets. "Only slightly different"
    is read as within 10% of the random halves' value (a reading; the paper gives no value).
    Reproduced when both halves have normalized performance above zero and within 10% of the
    random halves' value, and the anterior half is higher than the posterior; partially
    reproduced when the first two hold and the posterior half is higher.
- id: prep-activity-more-anterior
  statement: Preparatory activity is more prevalent at anterior sites.
  source: Results, Comparison of anterior versus posterior sites, paragraph 1
  quote: We similarly found preparatory activity to be more prevalent at anterior sites (data not
    shown)
  criterion: The paper shows no data or test. The fraction of units passing the preparatory
    tuning threshold (opening comment) in the anterior and posterior halves split at the median
    AP location, AP as in ap-location-no-effect-j-array. Readings (a) a higher fraction anterior,
    (b) higher with a Fisher exact test at p < 0.05. Reproduced when it holds under a reading.
- id: fig7d-pd-consistency
  statement: The PD is most stable across random condition subsets when measured in the
    peri-movement space, for every comparison and all four datasets.
  source: Results, Stability of the PD, paragraph 1; Figure 7D
  quote: Yet for every comparison, and for all four datasets, the PD was most stable when measured
    in the peri-movement space
  depends_on:
  - fig6d-perimovement-best-j-array
  criterion: As the Results and Figure 7D legend give it. Per neuron, 25 conditions drawn at random
    with replacement, the PD fitted; another 25 drawn, the PD refitted; consistency is the dot
    product of the two unit PDs, averaged over neurons. Comparison spaces for the maze task are
    endpoints + maximum speed (3-D), segment directions (6-D) and the kinematic space at its best
    k from fig6d-perimovement-best-j-array; the peri-movement space at the same dimensionality as
    each. EMG is absent for J-array. The number of draws per neuron is not given; 100 is used as
    a standard choice that changes only the noise of the mean. Reproduced when the peri-movement
    space is more consistent in all three comparisons; partially reproduced in two.
- id: some-neurons-better-elsewhere
  statement: Although the peri-movement space performs best on average, some individual neurons are
    better captured in one of the other spaces.
  source: Discussion, paragraph 3
  quote: while the peri-movement space performed better on average, there were individual neurons
    whose activity was better captured in one of the other spaces
  depends_on:
  - fig6d-perimovement-best-j-array
  criterion: Per-neuron performances of fig6d-perimovement-best-j-array, each space at its best k
    (averaged over neurons) and task spaces at their own dimensionality. Reproduced when at least
    one neuron has higher performance in another space than in the peri-movement space; the
    fraction is reported.
- id: high-dimensional-task-spaces-underperform
  statement: The high-dimensional task spaces, including the kitchen-sink space, always perform
    below the peri-movement space, so high dimensionality alone does not explain its performance.
  source: Results, Controls, paragraph 2; Methods, Task spaces
  quote: the high-dimensional task spaces (including the gratuitously high-dimensional
    'kitchen-sink' space) always underperformed the peri-movement space
  depends_on:
  - fig6d-perimovement-best-j-array
  criterion: Task-space and peri-movement performances of fig6d-perimovement-best-j-array. For the
    maze task the kitchen-sink space is 11-D (Methods, Task spaces). Open, which spaces count as
    high-dimensional and what they are compared with; readings (a) the kitchen-sink (11-D) and
    segment directions (6-D) spaces against the peri-movement space at the same k, (b) the same
    spaces against the best peri-movement performance over k. Reproduced when every such space is
    below the peri-movement space under a reading.
- id: fig8-linear-dynamics-simulation
  statement: In a simulated two-unit linear dynamical system with 25 random initial states,
    preparatory activity correlates weakly with peri-movement activity at the single-unit level (r
    = 0.08), yet a PD in the PCA-based peri-movement space captures preparatory tuning perfectly.
  source: Results, Tuning from a dynamical systems perspective, paragraph 2; Figure 8
  quote: The correlation of preparatory activity with peri-movement activity (averaged over the
    gray interval) was 0.08 ... The PD points towards the pattern recruited by the activity of
    unit one (panel A ), and perfectly captures preparatory 'tuning'
  expected:
    quantity: correlation of unit 1 preparatory rate with its mean peri-movement rate
    value: 0.08
    tolerance: 0.008
  criterion: A simulation, not a test on recorded data. x(t+1) = W x(t), W = [1, -2π/360; 2π/360,
    1], 25 random initial states held, then released (Figure 8 legend). Open, the distribution of
    initial states (readings uniform in a square centred on zero, standard Gaussian), the number
    of time steps after release and the gray interval (readings one full cycle of 360 steps, the
    first quarter cycle). The 0.08 rests on one random draw, so its tolerance does not apply to a
    single run; reproduced when 0.08 lies inside the central 95% of the correlations over 1000
    draws under a reading, and the 2-D PCA peri-movement space with the PD model of the opening
    comment fits unit 1's initial rates with performance 1 to numerical precision, without
    cross validation.
