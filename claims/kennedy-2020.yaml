    enter the responsive rule is open, (a) the mean over the five trials of a session, (b) each
    trial, (c) the ten trials of both sessions. Peak and half-peak times are defined in the Methods for
    imaging only; applying them to the trial-averaged rate is an assumption. The paper gives no
    number for heterogeneity; read as in fig2jo-diverse-peak-times, units peaking within the 10 s
    presentation and units peaking after it each make up at least 10% of rat-responsive units
    (threshold set here). Silicon probe data, not described as part of the dataset.
- id: imaging-cell-counts
  statement: Microendoscopic imaging of 5 mice yields 187.3 +/- 8.1 cells per day, summed over the
    five mice, and 78 cells in total are tracked across the three days.
  source: Main text, paragraph 5; Methods, Microendoscopic imaging data acquisition and processing
  quote: n=5 mice, 187.3±8.1 cells imaged per day, 78 cells tracked across days
  expected:
  - quantity: cells imaged per day
    value: 187.3
    tolerance: 8.1
    unit: cells per day, summed over the 5 mice
  - quantity: cells tracked across days
    value: 78
    tolerance: 7.8
    unit: cells, total over the 5 mice
  criterion: Tolerance on the cells per day is the paper's stated spread, read as the mean +/- SEM over
    the three days of the count summed over the five mice; 10% for the tracked cells. The per-mouse
    reading is ruled out by the paper's own counts. Figure 3e gives 133 USS-responsive and Figure 2j
    202 rat-responsive cells from 5 mice across 3 days, and Figure 3k 74.4% of neurons responsive to
    at least one of five stimuli; 187.3 cells per mouse and day would give about 2810 cell-days, of
    which the five stimuli would need about 2090 responders, while 187.3 summed over mice gives about
    562 cell-days and 418 responders, in line with those counts. The tracked count is then a total
    too (78 of 187.3, the "roughly half" of the Methods). The cells are those of the dataset's traces
    (CNMF-E after manual screening). Reproduced when both counts are within tolerance.
- id: fig2cd-population-persistent
  statement: The VMHdm SF1 population response measured by imaging persists after rat presentation,
    and its fitted decay constant differs between rat and mouse.
  source: Main text, paragraph 5; Figure 2c and 2d; Supplementary Table 1, Fig 2d
  quote: Although downsampled VMHdm SF1 population responses persisted following rat presentation
  statistics:
  - about: fitted decay constant, rat against mouse
    test: paired t-test
    statistic: t = 3.3452, DF 4
    p: 0.0287
    ci:
      low: 3.136
      high: 33.757
    n: 5 mice
  expected:
    quantity: difference in decay constant, rat against mouse (midpoint of the paper's interval)
    value: 18.45
    tolerance: 15.31
    unit: s
  criterion: The tolerance is half the width of the paper's confidence interval, so the claim holds
    when the mean difference lies in 3.136 to 33.757 s. Per mouse, the population response is the
    mean over all cells (downsampled_MEI_traces.m, which averages the cells of each trial; the paper
    does not otherwise say what "downsampled" means), on day 1, with the mean before -1 s subtracted.
    The fit is the Methods' difference of exponentials, over the 30 s from onset (Methods, Fitting
    decay constants). Trials are open, (a) the first day-1 trial only, as the code does, (b) the mean
    of the two day-1 trials, (c) each trial fitted and the two constants averaged, as the Methods'
    "fit for each trial" says. The code's fit window of -200 to 550 frames (-18 to 50 s) with a
    time-offset parameter is a variant. Reproduced when, under one reading, a two-sided paired
    t-test of the rat and mouse constants over the 5 mice gives p < 0.05 and the mean difference is
    within tolerance. The text does not state which is longer; the direction is reported.
- id: fig3ab-uss-persistent
  statement: The ultrasonic sweep strongly and persistently activates VMHdm SF1 neurons, more than a
    2 kHz tone.
  source: Main text, paragraph 6; Figure 3a and 3b
  quote: The USS strongly and persistently activated VMHdm SF1 neurons
  criterion: The paper gives no number or test. Population response and fit as in
    fig2cd-population-persistent, under the same trial readings. Reproduced when the mean over the 5
    mice of the USS population peak exceeds that of the tone and the fitted USS decay constant
    exceeds the 10 s stimulus; these thresholds are set here. The USS and rat constants are reported
    side by side, as Fig 3b shows them.
- id: fig2jo-diverse-peak-times
  statement: Individual neurons show diverse but reproducible dynamics; many responsive cells peak at
    stimulus onset while others reach their peak only after stimulus removal (202 rat-responsive,
    160 mouse-responsive and 133 USS-responsive cells).
  source: Main text, paragraph 5; Figure 2e to 2g and 2j to 2o; Figure 3c to 3f
  quote: While many cells were activated at stimulus onset, others reached their peak only after
    stimulus removal
  expected:
  - quantity: rat-responsive cells
    value: 202
    tolerance: 20.2
    unit: cells from 5 mice across 3 days
  - quantity: mouse-responsive cells
    value: 160
    tolerance: 16
    unit: cells from 5 mice across 3 days
  - quantity: USS-responsive cells
    value: 133
    tolerance: 13.3
    unit: cells from 5 mice across 3 days
  criterion: Responsive cells, peak and half-peak times as the Methods define them (see the opening
    comment). Open details, each run, (i) the counts as cell-days summed over mice and days, or as
    distinct tracked cells responsive on at least one day; (ii) the 1 s windows of the responsive
    rule as sliding windows or contiguous 1 s bins; (iii) the baseline standard deviation of the
    frames or of the 1 s means; (iv) the peak searched within 0 to 30 s or 0 to 45 s after onset.
    The 20 Hz mouse is put on the 11 Hz time base by averaging in time, a standard choice. Counts
    match when within tolerance under one reading. The paper gives no fraction for "many" and
    "others"; reproduced when, for the rat, cells peaking within the 10 s presentation and cells
    peaking after it each make up at least 10% of rat-responsive cells (threshold set here), under
    the reading that matches the counts or, if none does, under all readings; the same is reported
    for mouse and USS.
- id: fig2hi-rat-mouse-overlap
  statement: Rat and mouse responses are partially overlapping but distinct; among 219 cells
    responsive to either, some respond to both and others exclusively to one.
  source: Main text, paragraph 5; Figure 2h and 2i
  quote: Interestingly, rat and mouse responses were partially overlapping but distinct
  expected:
    quantity: cells responsive to rat or mouse
    value: 219
    tolerance: 21.9
    unit: cells from 5 mice across 3 days
  criterion: Responsive cells as in fig2jo-diverse-peak-times, under the same readings. The Methods'
    preference |sa - sb| / (|sa| + |sb|) runs from 0 to 1, while the Fig 2i histogram runs from -1
    to +1; the histogram is drawn with the signed form (sa - sb) / (|sa| + |sb|), sa the rat, on the
    mean over 45 s from onset averaged over the two trials (Methods, Strength of cell preference).
    The paper gives no threshold; reproduced when cells responsive to both stimuli and cells
    responsive to only one each make up at least 10% of the 219 (threshold set here).
- id: fig3gj-uss-intermingled
  statement: USS-responsive neurons are spatially intermingled with rat-responsive cells, and some
    cells respond to both (216 cells responsive to rat or USS, 219 to mouse or USS).
  source: Main text, paragraph 6; Figure 3g to 3j
  quote: USS-responsive neurons were spatially intermingled with rat-responsive cells, with some
    responding to both stimuli
  expected:
  - quantity: cells responsive to rat or USS
    value: 216
    tolerance: 21.6
    unit: cells from 5 mice
  - quantity: cells responsive to mouse or USS
    value: 219
    tolerance: 21.9
    unit: cells from 5 mice
  criterion: Responsive cells and preference as in fig2hi-rat-mouse-overlap. Reproduced when some
    cells respond to both rat and USS and the spatial footprints of rat-only and USS-only cells are
    not segregated; the paper gives no test of mixing, so segregation is judged by whether, in each
    mouse, the mean distance between rat-only and USS-only centroids is no larger than the mean
    distance within each group (set here). If the dataset holds no footprints, only the overlap is
    tested.
- id: fig3k-few-stimuli-per-cell
  statement: 74.4% of neurons respond significantly to at least one of the five stimuli; of these
    43.6% respond to only one, and over 70% respond to two or fewer.
  source: Main text, paragraph 6; Figure 3k
  quote: Among neurons responding significantly to at least one stimulus (74.4%), 43.6% responded to
    only one, and over 70% responded to ≤ 2 of the five tested stimuli
  expected:
  - quantity: cells responding to at least one stimulus
    value: 74.4
    tolerance: 7.44
    unit: percent
  - quantity: of these, responding to only one
    value: 43.6
    tolerance: 4.36
    unit: percent
  - quantity: responding to two or fewer (a lower bound, holds above 63%)
    value: 70
    tolerance: 7
    unit: percent
  criterion: Responsive cells as in fig2jo-diverse-peak-times, under the same readings. Further
    readings, (a) "responding" means excited only (the Methods' criterion) or excited or inhibited
    (Fig 3d and 3l show inhibited cells; inhibition as in fig3l-mostly-excited); (b) the denominator
    of "over 70%" is the responsive cells, or all cells, as the Fig 3k histogram (zero to five) is
    of all cells; (c) cells pooled over mice and days, or the mean over mice. Reproduced when all
    three numbers match under one reading.
- id: fig3l-mostly-excited
  statement: Most stimulus-responsive VMHdm SF1 neurons are excited, and a few are inhibited.
  source: Main text, paragraph 6; Figure 3d and 3l; Extended Data Fig 6c
  quote: Most stimulus-responsive VMHdm SF1 neurons were excited, although a few were inhibited
  criterion: The Methods define only excitation. Inhibition is open, (a) the mirror rule, the mean of
    any 1 s window in the first 30 s more than four baseline standard deviations below the baseline
    mean on both trials, or (b) the mean over the first 30 s below that level. Reproduced when, for
    every stimulus, excited cells outnumber inhibited cells and at least one stimulus has inhibited
    cells, under both readings; per-stimulus percentages are reported.
- id: fig3n-pca
  statement: The first principal component of time-averaged population activity separates the
    physical stimuli (rat, mouse, toy) from the auditory ones, and the second declines from initial
    to later trials.
  source: Main text, paragraph 6; Figure 3n; Extended Data Fig 7
  quote: The first principal component (PC) of population activity reflected stimulus class (rat,
    mouse, or toy vs. auditory stimuli), while the second PC declined from initial to later trials
  criterion: From the Fig 3n legend, PCA of time-averaged population responses pooled across mice,
    5 trials per stimulus from 3 days. Pooling is read as concatenating each mouse's tracked cells
    into one population, trials matched by stimulus and order. Time averaging as in
    fig3m-decoder (both of its readings). Which 5 of the 6 trials is open, (a) the first five, (b)
    all six. The paper gives no measure; reproduced when the area under the ROC curve of PC1 scores,
    physical against auditory trials, is at least 0.9, and the Spearman correlation of PC2 score with
    presentation order (1 to 6 within stimulus) has magnitude at least 0.5 with p < 0.05 (thresholds
    and tests set here; the sign of a PC is arbitrary, so PC2 is oriented so that the first trial is
    positive). Partially reproduced when one of the two holds.
- id: fig3m-decoder
  statement: A five-way Naive Bayes decoder predicts stimulus identity from population activity above
    chance (1/5) in held-out trials across three days of imaging.
  source: Main text, paragraph 6; Figure 3m; Extended Data Fig 9a; Methods, Decoder analysis
  quote: A 5-way Naïve Bayes decoder was able to predict stimulus identity with above-chance accuracy
    in held-out trials, across three days of imaging
  criterion: Per mouse, the cells tracked across the three days (Methods); 30 trials (5 stimuli, 2 per
    day, 3 days); fitcnb with leave-one-out cross-validation, as Fig3m_naiveBayes_multiclass.m does.
    The response is open between the code and the Methods, (a) the code, the mean after onset minus
    the mean of the 200 frames before it (the window of the struct's rast field is not in the code;
    downsampled_MEI_traces.m uses -200 to 550 frames, so 0 to 50 s); (b) the Methods, the mean from
    30 s before to about 60 s after onset. Accuracy per stimulus and mouse as in the code. The paper
    gives no test; reproduced when the mean over the 5 mice of the overall accuracy exceeds 0.2 under
    both readings, and as a check the per-stimulus mean accuracies exceed 0.2 for at least four of
    the five stimuli; a one-sided t-test of the five mice against 0.2 is reported as a variant.
- id: ed9-persistent-decoding
  statement: Stimulus identity remains decodable for tens of seconds after stimulus onset.
  source: Main text, paragraph 6; Extended Data Fig 9b and 9c; Methods, Decoder analysis (the text
    also cites ED Fig 8, whose legend shows pairwise Pearson's correlations, not decoders)
  quote: Importantly, stimulus identity also remained decodable for tens of seconds after stimulus
    onset
  criterion: A separate cross-validated decoder for each 1 s window from 10 s before to 30 s after
    onset, on the time-averaged activity in that window (Methods), five-way and for each stimulus
    pair, with the tracked cells and leave-one-out validation of fig3m-decoder. The code for this
    decoder is not in the repository, so baseline subtraction is open, (a) subtract the mean of the
    10 s before onset per trial, (b) none. Chance is 1/5 and 1/2. The paper gives no number;
    reproduced when the five-way accuracy, mean over the 5 mice, exceeds 1/5 in at least 15 of the
    20 windows from 10 to 30 s (threshold set here), under one reading, the other reported.
- id: ed7cd-identity-across-days
  statement: Stimulus identity is maintained by the population across days; a stimulus's population
    response on one day correlates more with its own response on another day than with the responses
    to other stimuli.
  source: Extended Data Fig 7c and 7d
  quote: stimulus identity is maintained by the population across days ... higher Pearson's correlation
    of a stimulus with itself than with other stimuli
  criterion: As ED7c_representation_separation_spearman.m computes it, per mouse, each tracked cell's
    response averaged over time, the Pearson correlation across cells between day 3 and day 2, the
    same stimulus averaged over the two trial pairs (trial 1 with 1, 2 with 2) and different stimuli
    over four combinations; days 1 against 2 and 1 against 3 as ED Fig 7d. The paper gives no test;
    reproduced when, in the mean over mice for days 2 against 3, each stimulus's same-stimulus
    correlation exceeds the mean of its correlations with the other four; partially reproduced for
    three or four stimuli. Whether it exceeds every other stimulus is reported.
- id: ed7e-strong-cells-stable
  statement: Cells with strong responses keep their stimulus tuning across days, while weakly
    responding cells vary more from day to day.
  source: Main text, paragraph 5; Extended Data Fig 7e
  quote: The stimulus selectivity of strongly responsive cells remained stable across days
  criterion: Per tracked cell and day pair (1 and 2, 2 and 3, 1 and 3), the Pearson correlation of
    its five time-averaged stimulus responses on the two days, against its response to its most
    preferred stimulus (ED Fig 7e legend), time averaging as in ed7cd-identity-across-days. The paper
    gives no test; reproduced when the Spearman correlation between the two over all cells and day
    pairs is positive with p < 0.05 (test set here).
- id: ed7b-habituation
  statement: The population response decreases across trials and days, suggesting habituation.
  source: Main text, paragraphs 1 and 5; Extended Data Fig 7a and 7b
  quote: Population mean response to different stimuli on each trial across three days of imaging,
    showing a decrease in the population response across trials and days
  criterion: Per mouse and trial, the population mean response; its measure is not given, so (a) the
    mean over 0 to 45 s after onset (the preference window of the Methods) and (b) the peak are run,
    baseline the 10 s before onset. The paper gives no test; reproduced when, in the mean over mice,
    the Spearman correlation of response with presentation order (1 to 6) is negative for at least
    four of the five stimuli under one reading (set here).
- id: fig4cd-autocorrelation
  statement: USS-evoked population activity evolves in time; its mean autocorrelation falls with the
    lag between timepoints over the 45 s after onset.
  source: Main text, paragraph 7; Figure 4b to 4d; Methods, Stimulus-evoked autocorrelation
  quote: We then quantified time-evolving dynamics by taking the mean autocorrelation as a function of
    the lag between timepoints
  criterion: From the Methods, C is the correlation between all time columns of a cells by time
    matrix, frames 0 to 45 s from onset at 11 Hz, averaged over the six USS trials of the three days,
    then over the 5 mice; the mean for lag dt averages C(x, x + dt) for x from 0 to 45 - dt s. Cells
    are open, (a) all cells imaged that day, (b) the tracked cells. The code's data path
    (simStatsAndPlots.m, with simulated = 0) smooths with a 1 s box and samples at 1 Hz; that is a
    variant. The paper gives no number; reproduced when, in each mouse, the mean autocorrelation at
    lags of 30 to 45 s is below its mean at lags of 0 to 5 s (set here). The curve is kept for
    fig4e-models-dynamics.
- id: fig4g-rat-uss-specificity
  statement: Rat- and USS-evoked population activity are partially correlated during the response and
    its persistence, so the representations overlap but stay distinct.
  source: Main text, paragraph 7; Figure 4f and 4g; Extended Data Fig 10d; Methods, Rat/USS
    Pearson's correlation
  quote: This specificity was quantified as the time-evolving Pearson's correlation between rat- vs.
    USS-evoked activity
  criterion: From the Methods, per mouse, the trial-averaged response of all cells on day 1; at each
    frame from 10 s before to 30 s after onset at 11 Hz, the Pearson correlation between the rat and
    USS population vectors. The paper gives no number; ED Fig 10d calls it partial overlap.
    Reproduced when the mean over the 5 mice from 10 to 30 s after onset lies between 0 and 1 with
    its mean +/- SEM excluding both 0 and 1 (set here). The curve is kept for fig4h-models-specificity.
- id: fig4e-models-dynamics
  statement: Models with slow neuromodulation alone or with NMDA-mediated recurrent excitation alone
    cannot match the observed autocorrelation dynamics, while slow recurrent network (sRNN) models,
    except the high-gain one, can.
  source: Main text, paragraph 7; Figure 4a and 4e; Figure 4i; Methods, model sections and Data
    similarity score, time-evolving dynamics
  quote: models that used slow neuromodulatory transmission alone ... could not match the response
    dynamics we observed in VMHdm SF1 neurons
  data: with_inputs
  depends_on:
  - fig4cd-autocorrelation
  criterion: Outside input, the model code at https://github.com/DJALab/VMHdm_persistence commit
    7e5911b. Six models with the Methods' parameters (peptide, tau_p 25 s, 10% of 1000 cells driven;
    RNN with NMDA, g 1, g_inh 3.8; sRNN low gain g 1, g_inh 8.8, tau_S 6 s; high gain g 6, g_inh 7.8;
    high tau_S g 2.5, g_inh 4.25, tau_S 20 s; local connectivity sigma 0.7 N), 10 repeat simulations
    each, spikes convolved with 0.5 s and 1.5 s exponentials, correlations computed every 10 ms of
    simulation (Methods, Stimulus-evoked autocorrelation) and read at the 11 Hz frame times from 0 to
    45 s for the score (Methods, Data similarity score); how they are read at those times (nearest
    step or interpolation) is a standard choice that cannot change the outcome. Where
    the code's scripts set other values (the low-gain script uses g 2, g_inh 2.4, tau_m 0.1 s, dt
    5 ms and drives a quarter of cells), the Methods are followed and the code is a variant. Score as
    the Methods' Similarity Score dynamics against each mouse's USS curve, averaged over mice. The
    paper sets no cut-off for "match"; two readings, (a) a model matches when its score is within the
    range of the scores of each mouse against the mean of the other four, (b) the peptide and NMDA
    models score below the low-gain, high tau_S and local sRNNs. Reproduced when the statement holds
    under one reading.
- id: fig4h-models-specificity
  statement: Raising excitatory gain in the sRNN keeps rat and USS representations specific but breaks
    the autocorrelation match; a 20 s slow time constant, or distance-dependent connectivity with
    spatially biased inputs, matches both the dynamics and the specificity.
  source: Main text, paragraph 7; Figure 4a3, 4a4, 4e and 4h; Extended Data Fig 10
  quote: Maintaining stimulus specific representations during persistence could be achieved in the
    sRNN by increasing the gain (strength) of excitatory synapses ... but such models failed to match
    the autocorrelation dynamics of observed activity ... both temporal dynamics and stimulus
    specificity could be matched by one of two models
  data: with_inputs
  depends_on:
  - fig4g-rat-uss-specificity
  - fig4e-models-dynamics
  criterion: Simulations as in fig4e-models-dynamics; model rat and USS inputs as the Methods give
    them, with the local model's middle 50% of cells driven by both and the outer 25% by one each.
    Model correlation over cells firing 10 or more spikes across the two stimuli. Score as the
    Methods' Similarity Score specificity. Its frames are open, (a) 0 to 45 s after onset as the
    score's definition says, extending the data correlation past the 30 s of its own definition,
    (b) 0 to 30 s, where the data correlation is defined. Matching read as in fig4e-models-dynamics,
    both readings. Reproduced when the high-gain model matches specificity but not dynamics and the
    high tau_S and local models match both, under one pair of readings.
- id: fig4ijk-two-models
  statement: Of the six models, only two (sRNN with a 20 s slow time constant, and sRNN with local
    connectivity) satisfy both data similarity scores.
  source: Main text, paragraph 7; Figure 4i to 4k
  quote: only two models satisfied both conditions
  data: with_inputs
  depends_on:
  - fig4e-models-dynamics
  - fig4h-models-specificity
  criterion: Both scores as in fig4e-models-dynamics and fig4h-models-specificity. "Satisfied" is not
    defined; readings (a) within the range of the mice's leave-one-out scores on both, (b) the two
    named models are the two with the highest minimum of the two scores. Reproduced when exactly the
    two named models satisfy both under one reading.
