- id: fig1de-rat-persistent
  statement: In freely moving mice, fiber photometry shows VMHdm SF1 activity rising at the onset of a
    10 s presentation of an anesthetized rat and persisting for over a minute after its removal, with
    a decay time constant of 26.7 +/- 2.2 s.
  source: Main text, paragraph 1; Figure 1d and 1e; Extended Data Fig 1d
  quote: Remarkably, this activity persisted for over a minute following rat removal (time constant
    τ decay = 26.7±2.2 seconds
  expected:
  - quantity: decay time constant of the rat-evoked photometry response, home cage
    value: 26.7
    tolerance: 2.2
    unit: s
  criterion: Tolerance is the paper's stated spread (mean +/- SEM, the convention of the legends).
    The fit is the Methods' difference of exponentials K(t) = A (tau_decay - tau_rise)^-1
    (exp(-t/tau_rise) - exp(-t/tau_decay)), fit per trial to minimise the mean squared error over the
    30 s from stimulus onset (Methods, Fitting decay constants). Reproduced when the mean over the 4
    mice is within tolerance. Fiber photometry, not described as part of the dataset.
