# Claims for Kennedy, Kunwar, Li et al. (2020), Nature 586, 730-734, on DANDI:001182.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-10,
# protocol as stated in docs/protocol.md (version pilot-14). No data of the dataset were seen.
#
# Text read: the accepted author manuscript in Europe PMC (PMC7606611, NIHMS1606924), full text,
# with its Methods, figure legends and Extended Data legends 1 to 10, and Supplementary Table 1
# (41586_2020_2728_MOESM1_ESM.pdf, the table of statistical tests). The version of record was not
# read. No main-text PDF was supplied, so no figure was looked at; claims rest on the text, the
# legends and Supplementary Table 1.
#
# Code read: https://github.com/DJALab/VMHdm_persistence at commit 7e5911b28deb10c0327d6b51330534dbafa04469
# (2021-11-15). It holds MATLAB scripts for the fiber photometry (data_analysis/fiberphotometry), the
# Fig 3m decoder (Fig3m_naiveBayes_multiclass.m), the population decay fits of Fig 2d and 3b
# (downsampled_MEI_traces.m), the cross-day correlation of ED Fig 7c
# (ED7c_representation_separation_spearman.m), and the six network models of Fig 4
# (network_models). It does not hold the cell extraction, the responsive-cell selection, the peak and
# half-peak times, the preference index, the PCA, the time-resolved decoders, the autocorrelation of
# the imaging data, or the two data similarity scores; computeMetricDiagonal and applyMetricToRaster,
# which the model scripts call, are missing. The scripts read a MATLAB struct `expt` (mice indexed
# 1, 3, 4, 5 and 7; days session1 to session3; stimuli named rat, male, toy, USS and tone) that is not
# in the repository.
#
# Data the paper describes. Male SF1-Cre mice, 8 to 20 weeks. The dataset (DANDI:001182, GCaMP traces
# with behaviour annotation, sessions such as sub-M5-session3) is meant to hold the microendoscopic
# imaging experiment only: 5 mice expressing GCaMP6s in VMHdm/c SF1 neurons, imaged through a GRIN
# lens with an nVista microscope at 11 Hz (one mouse at 20 Hz), head-fixed on a running wheel, on three
# consecutive days. Each day each of five stimuli was presented twice for 10 s in pseudorandom order
# with at least five minutes (ED Fig 7 says ten minutes) between presentations: an awake rat in a wire
# mesh cage, a male BALB mouse in the cage, a toy rat in the cage, an ultrasonic sweep (USS, 100 ms
# sweeps of 17 to 20 kHz at 85 dB) and a 2 kHz tone. Traces come from CNMF-E after manual screening;
# 187.3 cells were imaged per day and cells were registered across the three days (roughly half).
# Responses are in units of the standard deviation of a 30 s pre-stimulus baseline (Methods, Units of
# neuronal activation). The fiber photometry (Fig 1, ED 1 and 3), the open field and home cage
# behaviour with optogenetic silencing or activation (Fig 1i to n, ED 2 and 3), the tetanus toxin
# photometry (Fig 1o to r), the slice electrophysiology and imaging (ED 4) and the silicon probe
# recordings (ED 6) are not described as part of the dataset; the paper says its data are available
# from the corresponding author on request. Their claims are kept, as data the paper recorded.
#
# Numbering in the Methods differs from the legends. The Methods place the decoder bar plot in
# "Fig 3n" and its confusion matrix in "ED 7a"; the legends place them in Fig 3m and ED Fig 9a. The
# time-resolved decoders are "Fig 3o, ED 8b-c" in the Methods and ED Fig 9b-c in the legends. The
# preference index is cited for "Fig 2g and Fig 3i, k"; the histograms are Fig 2i, 3h and 3j. The
# legends are followed here.
#
# Methods fixed from the paper for the imaging claims (cited in each criterion). Responsive cell
# (Methods, Identifying stimulus-responsive cells): baseline the 10 s before stimulus onset; a cell
# responds when the mean of any 1 s window in the first 30 s after onset exceeds the baseline mean by
# more than four baseline standard deviations, on both trials of that day. Peak time: the first time
# the trace passes 95% of its maximum; half-peak time: the last time it is above 50% of its maximum
# relative to the pre-stimulus baseline; per cell and day, averaged over the two trials. Preference:
# |sa - sb| / (|sa| + |sb|) on the mean response over 45 s from onset, averaged over two trials,
# per cell and day, for cells responsive to either stimulus.
#
# Details left open by the paper and its code, named in the criteria with their readings: whether the
# 1 s windows of the responsive-cell rule slide or are contiguous bins, and whether the baseline
# standard deviation is that of frames or of 1 s means; how the 20 Hz mouse is put on the 11 Hz time
# base; whether cell counts pool cell-days or count tracked cells; the inhibition criterion; the
# window searched for peaks; the sign convention of the preference histograms; the decoder's response
# window (code against Methods); which five of six trials the PCA plots; the cells used for the
# autocorrelation; the frame range of the specificity score; what "satisfied both conditions" means
# for the model scores; and the model parameters where the code and the Methods disagree.
schema_version: 2
