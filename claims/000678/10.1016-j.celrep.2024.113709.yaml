- id: fig5c-state-classification
  statement: For every mouse, support vector machines on the value and 10-trial variability of
    the measures predict the performance state above chance, with 88.2% +/- 1.8% accuracy for
    optimal against disengaged and 77.7% +/- 2% for optimal against sub-optimal states.
  source: Results, Arousal measures predict optimal performance state, paragraph 1; Figures 5B
    and 5C
  quote: 'We found that for all subjects, performance states could be significantly predicted
    using the recorded arousal measures with high accuracy (opt. vs. dis. = 88.2% ± 1.8%; opt.
    vs. sub. = 77.7% ± 2%'
  depends_on:
  - fig2a-state-types
  expected:
  - quantity: accuracy, optimal against disengaged, mean over 13 classifications
    value: 88.2
    tolerance: 1.8
    unit: '%'
  - quantity: accuracy, optimal against sub-optimal, mean over 19 classifications
    value: 77.7
    tolerance: 2
    unit: '%'
  criterion: As 5_decoding.py and Figure5.py, sessions of M5. For each mouse, optimal against
    each other state separately (13 disengaged and 19 sub-optimal classifications), only when
    the two classes give more than 30 trials. Equal numbers of trials per class, at most 1500,
    sampled at random; features min-max scaled; RBF SVC (scikit-learn defaults); 5-fold KFold;
    accuracy is the mean over folds and over 1000 runs. Features are the six of the Methods
    (pupil, face motion energy, locomotion speed and their 10-trial SDs). Two code variants are
    shown, the "All measures" points of Figure5.py and FigureS7.py, which are 5_decoding.py
