- id: figs8a-regression-weights
  statement: In linear regressions of state probability on the measures, the quadratic weights
    of pupil diameter and of locomotion speed are negative for the optimal state and positive
    for the disengaged state, as are the weights of their 10-trial SDs, while face motion energy
    weights center on zero.
  source: Results, Arousal measures predict optimal performance state, paragraph 3; Figure S8A
  quote: weights for the quadratic terms fit to predict optimal state probability were negative
    for pupil diameter across mice ... and the weights were positive when fit to disengaged state
    probabilities ... This was also true for quadratic terms of locomotion speed, while face
    motion energy had weights centered around zero across subjects
  depends_on:
  - fig2a-state-types
  criterion: As FigureS8.py, sessions of M5. Per mouse, OLS of each state's posterior probability
    per trial on min-max scaled features (constant, pupil, face, locomotion, their squares and
    pairwise products, their 10-trial SDs, and the triple product), the design min-max scaled
    again. The paper reports no test for "across mice" and "consistently". Readings are (a) a
    two-tailed Wilcoxon signed-rank test of the 13 weights against zero at p < 0.05 with the
    stated sign (the paper's test family, M6), (b) the median weight over mice has the stated
    sign; "centered around zero" is the test of (a) at p >= 0.05. Reproduced when this holds for the pupil and locomotion quadratic and SD weights in the
    optimal (negative) and disengaged (positive) fits, and the face quadratic and SD weights do
    not differ from zero; partially reproduced when the pupil terms hold and others do not.
- id: figs8b-pupil-movement-interaction
  statement: With the movement index, the quadratic movement weight is negative for the optimal
    state, and the pupil-by-movement interaction is the only consistent weight for sub-optimal
    states (0.42 +/- 0.11), differing from its weight for the optimal state (-0.95 +/- 0.21).
  source: Results, Arousal measures predict optimal performance state, paragraph 3; Figure S8B
  quote: the only consistently weighted feature across fits to sub-optimal state probabilities
    was the interaction between pupil diameter and the movement index ( Figure S8B ; 0.42 ±
    0.11), which was also significantly different than weights fit to optimal state probability
    (−0.95 ± 0.21
  depends_on:
  - fig2a-state-types
  statistics:
  - test: Wilcoxon rank-sum test
    p: 0.0000034
    n: sub-optimal state fits against 13 optimal state fits
  expected:
  - quantity: pupil-by-movement weight, sub-optimal state fits, mean
    value: 0.42
    tolerance: 0.11
  - quantity: pupil-by-movement weight, optimal state fits, mean
    value: -0.95
    tolerance: 0.21
  criterion: As FigureS8.py (second model). Per mouse, OLS of each state's posterior probability
    on min-max scaled constant, pupil, movement index, their squares and product, the pupil SD
    and the movement SD index, the design min-max scaled again. Each sub-optimal state of each
    mouse is one fit (the code pools them all). Tolerances are the paper's SEMs. Reproduced when
    both means are within tolerance, the two sets differ by a two-tailed Wilcoxon rank-sum test
    at p < 0.05, and the mean quadratic movement weight of the optimal fits is negative.
- id: figs1-iti-independence
  statement: The inter-trial interval is long enough that trial-evoked responses do not carry
    over; correlations of the measures at trial start with the prior ITI are weak and centered on
    zero, and evoked pupil responses do not differ across performance states.
  source: Figure S1C and S1D
  quote: Correlations between all measures at the start of a trial and prior inter trial intervals
    are weak and centered around zero across mice. (D) Average evoked pupil responses of mice are
    not significantly different across performance states
  depends_on:
  - fig2a-state-types
  statistics:
  - about: evoked pupil response across performance states
    test: Kruskal-Wallis test
    p: 0.54
  criterion: As FigureS1.py, all sessions. Per mouse, Pearson r between each measure at
    stimulus onset (pupil from the trial's pupil trace at onset, face motion energy and
    locomotion speed as M4) and the preceding ITI, taken as the difference between consecutive
    trial start times within a session; trials with any value missing are dropped. The paper
    gives no threshold for "weak and centered around zero"; readings, chosen here and not from
    the paper, are (a) median r over mice with absolute value below 0.1, (b) below 0.2, each
    with a two-tailed Wilcoxon signed-rank test against zero at p >= 0.05. The ITI part holds
    when it holds for all three measures under one reading. The evoked pupil response is
    defined by FigureS1.py as follows. From onset to 2.5 s after, the largest rise and the largest fall of
    pupil diameter from its onset value, keeping the one of larger absolute size, signed; per
    mouse, the median over the trials of each state. The absence across states is judged on the
    paper's test, a Kruskal-Wallis test over mice of these medians. For the groups,
    FigureS1.py plots optimal, disengaged, sub-optimal (pooled) and indeterminate in the panel
    whose legend gives p = 0.54, so the test is run on those four groups, as the paper's test of
    absence; the three discrete states alone are shown as a variant. Reproduced when the
    four-group test gives p >= 0.05 and the ITI part holds; the effect sizes are given either
    way.
- id: figs5-movement-index-correlations
  statement: The movement index is equally correlated with face motion energy and with
    locomotion speed, and highly correlated with both in each mouse.
  source: Results, Arousal and uninstructed movement, paragraph 4; Figure S5B and S5C
  quote: we combined these two measures into a single continuous measure of uninstructed movement
    levels termed the “movement index,” which is equally correlated with each measure
  criterion: Per mouse, Pearson r of the movement index (M4) with face motion energy and with
    locomotion speed over the trials of M5 (Figure3.py). The sum of two z-scores has equal
    correlation with each term by construction, so the test is that the two r agree to 0.01 in
    every mouse. "Highly correlated" has no threshold in the paper; readings are (a) both r above
    0.7 in every mouse, (b) both above 0.5. Reproduced when the r agree and (b) holds; the
    reading met is reported.
