    set only), and the eight features unshuffled (condition 13). The null is 1000 runs
    with all training features shuffled across trials (the code's surrogate; the Methods say
    class labels are permuted, which is the same up to pairing); z is the mean over runs of
    (accuracy minus null mean) over null SD. The Methods give no significance threshold;
    Figure5.py draws a dashed line at z = 1.98. Readings are (a) z > 1.98 (that line), (b)
    z > 1.645, (c) accuracy above the 95th percentile of the null.
