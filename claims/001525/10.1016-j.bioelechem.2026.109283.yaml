- id: fig5b-conductivity-calibration
  statement: Under Eq. (2), effective membrane conductivity barely affects charging while it
    stays far below cytosol and medium conductivity; a 10-fold increase reduces IMP by about
    2% and a 100-fold increase by 12%.
  source: Results, 3.5, paragraph 3; Figure 5B
  quote: its 10-fold increase would go unnoticed, yielding just a ~2% IMP reduction, and a
    100-fold increase would reduce IMP by just 12%
  expected:
  - quantity: IMP reduction for a 10-fold lm increase
    value: 2
    tolerance: 0.5
    unit: "%"
  - quantity: IMP reduction for a 100-fold lm increase
    value: 12
    tolerance: 1.2
    unit: "%"
  criterion: A computation from Eq. (2) with the Methods' parameters (li 0.4 S/m, lo 1.64 S/m,
