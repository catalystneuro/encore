    sides). Per strength, the mean over cells of measured IMP (dF / 9.1 x 100 mV) against
    IMPC at those points. A mean over points on both sides of the equator would cancel to
    about zero, so agreement is measured point by point - the slope of a least-squares line
    through the origin of measured IMP on IMPC over the equatorial points (the fit of Results
    3.3). Reproduced when, under one width reading, at every strength up to 1000 V/cm that
    slope is within 0.9 to 1.1 (protocol default 10%, not the paper's) or its 95% interval
    includes 1, and at 780 and 1000 V/cm the pole ratio of measured IMP to IMPC is lower than
    the equatorial slope.
- id: fig4d-short-pulses-same-limit
  statement: With 0.3-us pulses of 357 to 3320 V/cm imaged at 275 ns, the maximum dF is 53 +-
    4% (about 600 mV) at both poles, and the dependence on field strength is like that with
    1-us pulses.
  source: Results, 3.4, paragraph 5; Figure 4D
  quote: the maximum ΔF reached was 53 ± 4% (~600 mV) at both cell poles. The pattern of how the
    response changed with increasing PEF strength was not different from that with 1-μs PEFs
