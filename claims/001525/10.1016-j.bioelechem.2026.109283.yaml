# Claims for Semenov, Silkuniene, Silkunas, Pakhomova, Bixler, Ibey, Kochunov & Pakhomov (2026)
# on dandiset 001525.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record (Bioelectrochemistry 171 (2026) 109283), from a PDF supplied
# by a person, as extracted text (paper/10.1016-j.bioelechem.2026.109283.txt): main text,
# Materials and methods, Results, Discussion and figure legends. The paper has no supplement.
# It links no code; Data availability says "Data will be made available on request". No PDF
# page could be rendered in this run; Eq. (2), garbled in the text, was read as the thin-shell
# formula of Kotnik et al. (refs [46,47]):
#   f = 3 lo [3 R^2 d li + (3 d^2 R - d^3)(lm - li)] /
#       [2 R^3 (lm + 2 lo)(lm + li/2) - 2 (R - d)^3 (lo - lm)(li - lm)],
# which gives f = 1.5 for an intact membrane and, with the stated parameters, a 12% IMP
# reduction for a 100-fold rise in lm, as the Results say. The Methods defer to Semenov et al.
# 2025 (Bioelectrochemistry 168, 109143, ref. [20]), not under paper/ and not read; from it
# come the fit of the charging time constant tau against cell radius used in Eq. (1), the
# Excel macro that resamples each perimeter trace to 360 points, and the linearity of both
# dyes below 300 V/cm. Claims that need the calculated IMP (IMPC) use that fit as an outside
# input (data with_inputs).
#
# The dandiset's title and description (DANDI 001525, version 0.261006.1856) say it holds the
# membrane recovery experiment after 1-us electroporation by strobe fluorescence microscopy,
# which is the two-pulse protocol of Section 3.7 and Fig. 7. Claims for the other figures are
# listed because they are the paper's main findings; whether their data are here is the
# author's to find. Dandiset 001526 (same paper) is titled as the post-electroporation
# suitability (repeated sets) experiment.
#
# Data the paper used, as it reports them. Spheroidal CHO-K1 cells, plated 1 to 3 h on 35-mm
# glass-bottom dishes, one cell per experiment, 21 to 23 C. Potentiometric dyes FluoVolt or
# Di-8-ANEPPS; ~6 ns 440 nm laser flashes at 900 ns into 1-us pulses or 275 ns into 0.3-us
# pulses; iXon Ultra 897 camera, 60x/1.42 objective; pulses at 6 Hz from parallel rod
# electrodes 1.6 mm apart; field strength in V/cm from a Sim4Life model. Images in sets of
# 100, the first 40 without a pulse (baseline) and the next 60 with a pulse of one amplitude;
# amplitude escalated across sets or alternated. Groups: Fig. 2A FluoVolt n = 4 cells,
# 43 to 1400 V/cm; Fig. 2B Di-8-ANEPPS n = 5; Fig. 2C-D Di-8-ANEPPS n = 8, alternating 150 and
# 230 V/cm, then 1000 V/cm; Fig. 3 both dyes, 43 to 360 V/cm; Fig. 4A FluoVolt n = 4; Fig.
# 4B-C Di-8-ANEPPS n = 5, 43 to 1400 V/cm; Fig. 4D Di-8-ANEPPS n = 10, 0.3 us, 357 to 3320
# V/cm; Fig. 5A Di-8-ANEPPS with 1 mM Gd3+ n = 7 and control n = 5, 150 to 1400 V/cm; Fig. 7
# Di-8-ANEPPS n = 5, a conditioning 1-us pulse at 150 to 1400 V/cm (escalated) followed 5 us
# later by a 1-us 150 V/cm test pulse, one laser flash per pulse pair at 900 ns into the test
# pulse. Calcium imaging with Fluo-4 (widefield, every 1 or 2 s): Fig. 6A single 1-us pulse at
# 60 s, 5 min recording, 0 to 1200 V/cm, 14 cells per strength; Fig. 6B 60 pulses at 6 Hz from
# 30 s, 150 s recording, 28 to 54 cells per strength, 224 in all, each cell tested once.
# Measured variables: fluorescence along a 6-pixel-wide trace on the cell perimeter (360
# points after resampling) or in +-5 degree arcs at the cathodic (depolarized, dF > 0) and
# anodic (hyperpolarized, dF < 0) poles; cell radius from the image; Fluo-4 intensity in a
# circular region over the cell minus a cell-free background.
#
# Method details shared by the criteria, from Methods section 2.3 unless said. dF = 100% x
# (F - F0)/F0. For Fig. 2, pole F per image and F0 the mean of the first 40 images. For the
# later figures (Fig. 3 on), the 40 baseline and 60 pulse images are collapsed into one
# baseline and one polarization image, and dF is taken per perimeter point or per pole arc.
# Group values are means over cells, error bars s.e. IMPC is Eq. (1), 1.5 E R cos(theta)
# (1 - exp(-t/tau)), t = 900 or 275 ns, R from each cell's image, tau from the fit of [20].
# IMP from dF uses 26% (FluoVolt) or 9.1% (Di-8-ANEPPS) per 100 mV (Fig. 3). Effective
# membrane conductivity lm,eff solves (measured IMP)/(IMPC) = f/1.5 with Eq. (2), li = 0.4
# S/m, lo = 1.64 S/m, R = 8 um, d = 5 nm, intact lm = 3e-7 S/m. Tests are Student's t-test
# or one-sample t-test (section 2.5); alpha 0.05 unless a claim says otherwise.
# Open in all of them, none of which a criterion here turns on beyond what each names: how the
# perimeter trace and cell centre are drawn (by hand in MetaMorph); how R is measured (readings
# (a) perimeter length over 2 pi, (b) radius of the circle of equal area); whether background
# is subtracted from potentiometric images (readings (a) none, as section 2.3 describes none,
# (b) a cell-free region, as for Fluo-4); whether "collapsed" means averaged or summed (the
# same dF either way); the LOESS/LOWESS span (a plotting choice). The text labels the same
# nominal strengths 570 and 780 V/cm in Sections 3.1 to 3.6 and mostly 560 and 760 V/cm in
# Section 3.7 (which also writes 570 once); criteria take the dataset's nearest label.
