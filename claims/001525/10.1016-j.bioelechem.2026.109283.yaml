- id: fig6a-ca-single-pulse
  statement: A single 1-us pulse causes clear Ca2+ entry at 1000 and 1200 V/cm, with the signal
    elevated through the 5-min observation; the small rise after 780 V/cm is not significant.
  source: Results, 3.6, paragraph 2; Figure 6A
  quote: established a clear peak of Ca2+ entry at 1000 and 1200 ... and Ca2+ signal remained
    elevated through the 5-min observation period (Fig. 6A). A subtle ΔF increase after
    exposure at 780 V/cm was at the detection limit and not statistically significant.
  criterion: Fluo-4 dF in a circular region over the cell, background-subtracted, F0 the mean
    before the pulse (Methods 2.4); 14 cells per strength (Fig. 6A legend). The test and the
    time point are not given. Test readings, both used in Section 3.6 for Fig. 6B - (i) the
    one-sample t-test against zero, two-sided, p < 0.05; (ii) an unpaired t-test against the
    0 V/cm group, two-sided, p < 0.05. Time point readings (a) the peak dF after the pulse;
    (b) dF at the end of the recording (the measure of Section 3.6 for Fig. 6B). Reproduced
    when, under one test and time reading, dF at 1000 and 1200 V/cm is above zero (or the
    0 V/cm group) at p < 0.05, the end-of-recording dF at those strengths is above zero, and
    780 V/cm is not significant under that same reading. The 780 V/cm part is a claim of
    absence on a test the paper does not name; every reading is shown, and when they give
    different outcomes for it the claim is methods_underspecified.
- id: fig6b-ca-train-thresholds
  statement: With trains of 60 1-us pulses at 6 Hz, a strong Ca2+ response occurs in 28% of
    cells at 780 V/cm and nearly all cells at higher strengths; at 650 V/cm only 2 cells
    (5.9%) respond strongly, but the mean signal at the end is above zero (p < 0.001) and
    above that at 230 V/cm (p < 0.05, one-tailed).
  source: Results, 3.6, paragraph 3; Figure 6B
  quote: A strong Ca2+ response was recorded in 28% of cells exposed at 780 V/cm and in nearly
    all cells at higher intensities (Fig. 6B). At 650 V/cm, only 2 cells (5.9%) showed a strong
    response, but the mean Ca2+ signal by the end of recording was significantly different
    from zero (p < 0.001, one sample t-test) and marginally higher than after exposure at 230
    V/cm (p < 0.05, single-tailed t-test)
  statistics:
  - about: 650 V/cm end-of-recording signal against zero
    test: one sample t-test
    p: 0.001
    p_relation: "<"
  - about: 650 V/cm against 230 V/cm
    test: single-tailed t-test
    p: 0.05
    p_relation: "<"
  expected:
  - quantity: fraction of strong responders at 780 V/cm
    value: 28
    tolerance: 2.8
    unit: "%"
  - quantity: fraction of strong responders at 650 V/cm
    value: 5.9
    tolerance: 0.59
    unit: "%"
  criterion: Fluo-4 dF as in fig6a-ca-single-pulse, 28 to 54 cells per strength, 224 in all,
    each tested once. The mean-signal tests are fixed by the text - dF at the end of the
    recording (read as the last frame; the mean of the last five frames, 10 s, is shown as a
    variant), one-sample t-test against zero, and an unpaired one-tailed t-test against 230
    V/cm. "Strong response" is not defined in the paper, its legends or Methods; no threshold
    can be taken from them, so the two percentages are judged only if the dataset marks
    responders, and otherwise are blocked as methods_underspecified with the distribution of
    end dF per strength shown. Reproduced when the two tests reach p < 0.001 and p < 0.05 (and
    the percentages match where they can be judged).
