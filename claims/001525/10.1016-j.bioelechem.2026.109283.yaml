- id: fig4c-equator-follows-cosine
  statement: Membrane regions near the equator remain unaffected and follow the cosine
    dependence predicted by the Schwan equation up to 1000 V/cm, even when the poles are
    electroporated.
  source: Results, 3.4, paragraph 4; Figure 4C
  quote: appeared relatively unaffected and followed the cosine dependence predicted by Schwan
    formula up to 1000 V/cm
  data: with_inputs
  criterion: Data as fig4b-di8-threshold-570, the 360-point profiles. "Closer to the equator"
