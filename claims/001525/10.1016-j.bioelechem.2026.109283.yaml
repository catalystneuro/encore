    -150 to +150 mV fit by least squares with a line through the origin. The correlation
    coefficient is not defined for a fit through the origin; readings (a) Pearson r of dF and
    IMPC over those points; (b) the square root of the uncentred R^2 of the fit through the
    origin. Reproduced when both slopes are within tolerance and, under one reading, both
