  - quantity: maximum anodic dF, Di-8-ANEPPS
    value: -55
    tolerance: 4
    unit: "%"
  criterion: Di-8-ANEPPS, 1-us pulses, n = 5, averaged over all 60 pulse images; pole dF as in
