- id: fig7a-test-pulse-cosine-up-to-1000
  statement: After a conditioning pulse of up to 1000 V/cm, polarization by the 150 V/cm test
    pulse 5 us later still follows a cosine of the angle to the field, while 1200 and 1400 V/cm
    conditioning pulses markedly reduce charging at the cell poles.
  source: Results, 3.7, paragraph 3; Figure 7A
  quote: Polarization still followed a cosine function after conditioning PEFs of up to 1000
    V/cm. However, 1200 and 1400 V/cm conditioning PEFs markedly hindered charging by the test
    pulse at cell poles, indicating a persistent membrane permeabilization.
  criterion: Per conditioning strength, the test-pulse dF profile over the 360 perimeter points,
    averaged over the n = 5 cells (Methods 2.3; Fig. 7A legend), is fit by least squares with
    a cosine of the angle to the field (A cos(theta - phi)), as Fig. 7A fits it; the benchmark
    is the fit after the 150 V/cm conditioning pulse (Fig. 7A legend). "Follows a cosine" has
    no stated measure. It is not read as matching the benchmark amplitude, since the paper
    puts the 1000 V/cm test response at ~80% of control and still calls it a cosine. Readings
    - (a) the mean pole dF (+-5 degree arcs) at each pole lies within the s.e. outline of the
    profile (Fig. 7A legend, gray outline) around the strength's own cosine fit at that pole;
    (b) pole dF does not differ from the benchmark by the two-sided t-test of Fig. 7B at p <
    0.05 (readings of that test as in fig7b-test-pulse-unchanged-to-760). "Markedly hindered"
    at 1200 and 1400 V/cm is pole dF below the benchmark at p < 0.05 by that test (as in
    fig7b-test-pulse-reduced-1200-1400). Reproduced when, under a reading, every conditioning
    strength up to 1000 V/cm follows a cosine and 1200 and 1400 V/cm are hindered at the
    poles. The cosine amplitude and R^2 of every strength are reported.
