    relative to the intact f; the "~2%" may be read from the Fig. 5B graph, and the equation
    itself is read from garbled text, so a mismatch at 10-fold is reported with both values.
- id: fig5c-gd-reduces-conductivity
  statement: For most datapoints, Gd3+ reduces the electroporation-induced effective membrane
    conductivity 2- to 3-fold.
  source: Results, 3.5, paragraph 4; Figure 5C
  quote: For most datapoints, Gd3+ reduced the electroporation ... induced effective
    conductivity 2–3-fold
  data: with_inputs
