- id: fig5a-gd-extends-anodic-charging
  statement: 1 mM Gd3+ extends anodic charging to -864 +- 44 mV against -542 +- 57 mV in
    controls (p < 0.001), and measured IMP stays nearly equal to calculated IMP down to -780
    mV, so the dye response is linear at high IMPs.
  source: Results, 3.5, paragraph 1; Figure 5A
  quote: 1 mM Gd3+ extended the range of membrane charging at the anodic pole down to −864 ± 44
    mV (p < 0.001 compared to −542 ± 57 mV in parallel control experiments, Fig. 5A).
    Furthermore, measured IMP remained nearly identical to the theoretical IMPC down to −780 mV
  data: with_inputs
  statistics:
  - test: 2-tailed t-test
    p: 0.001
    p_relation: "<"
    n: 7 cells with Gd3+ and 5 control cells
  expected:
  - quantity: most negative anodic IMP, Gd3+
    value: -864
    tolerance: 44
    unit: mV
  - quantity: most negative anodic IMP, control
    value: -542
    tolerance: 57
    unit: mV
  criterion: Di-8-ANEPPS, 1-us pulses of 150 to 1400 V/cm, pole dF converted to IMP (9.1% per
