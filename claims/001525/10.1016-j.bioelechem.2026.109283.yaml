  source: Results, 3.5, paragraph 2; Figure 5A
  quote: At the cathodic pole, polarization in the presence of Gd3+ reached 647 ± 44 mV, a value
    not significantly higher than that in the control group without Gd3+. However, Gd3+
    prevented the progressive decline in IMP as the electric field was increased.
  data: with_inputs
  statistics:
  - about: Gd3+ against control, datapoints below -700 mV and above 1200 mV of IMPC
    test: 2-tailed t-test
    p: 0.05
    p_relation: "<"
    n: 7 cells with Gd3+ and 5 control cells
  expected:
    quantity: maximum cathodic IMP, Gd3+
    value: 647
    tolerance: 44
    unit: mV
  criterion: Data and readings (a) and (b) of the extreme as in fig5a-gd-extends-anodic-charging.
