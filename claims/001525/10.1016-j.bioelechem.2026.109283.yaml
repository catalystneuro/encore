  data: with_inputs
  expected:
  - quantity: maximum cathodic |dF|, 0.3 us
    value: 53
    tolerance: 4
    unit: "%"
  - quantity: maximum anodic |dF|, 0.3 us
    value: 53
    tolerance: 4
    unit: "%"
  criterion: Di-8-ANEPPS, 0.3-us pulses, n = 10, image at 275 ns, IMPC at t = 275 ns; pole dF as
