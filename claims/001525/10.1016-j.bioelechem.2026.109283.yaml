- id: fig4b-cathodic-pole-more-damaged
  statement: Above the threshold, pole IMP falls progressively as the field rises, more at the
    cathodic pole; at 1400 V/cm charging is no longer detectable at the cathodic pole and is
    about 30% dF (about -330 mV) at the anodic pole.
  source: Results, 3.4, paragraph 4; Figure 4B
  quote: As the electric field increased further, the IMP reached at the poles progressively
    decreased, and the reduction was more pronounced at the cathodic pole ... At 1400 V/cm,
    charging was no longer detectable at the cathodic pole (i.e., the membrane became fully
    permeable) and dropped to ~30% ΔF (~ −330 mV) at the anodic pole
  data: with_inputs
  expected:
  - quantity: anodic dF at 1400 V/cm, magnitude
    value: 30
    tolerance: 3
    unit: "%"
  - quantity: anodic IMP at 1400 V/cm
    value: -330
    tolerance: 33
    unit: mV
  criterion: Data as fig4b-di8-threshold-570. Reproduced when the mean |IMP| at each pole is
    lower at each strength above 780 V/cm than at the one below it, the drop from the pole's
    maximum to 1400 V/cm is larger at the cathodic pole, the cathodic dF at 1400 V/cm is not
    above zero by a one-sample t-test (two-sided, p < 0.05), and the anodic values are within
