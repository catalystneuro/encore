# Claims for Park, Keeley, Savin, Ranck & Fenton (2019), Neuron 101:285-293, tested on CRCNS hc-20.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-10,
# protocol pilot-14 as stated in docs/protocol.md.
#
# Text read: the version of record (paper/10.1016-j.neuron.2018.11.019.txt, PyMuPDF extraction
# of the publisher PDF), main text, figure legends, STAR Methods and the Supplemental
# Information (Figures S1 to S6 and Table S1). Video S1 (the rotating arena) holds no result.
# The PDF could not be rendered in this run, so figures were read from their legends and the
# Results only. Glyphs garbled by the extraction were read as follows: "10�14" is 10^-14, "R" is
# "at least", "%" is "at most", "4.17 3 107" is 4.17 x 10^7, "�0.141" is -0.141. The spike width
# of head-direction cells is printed "169.79 ± 4.58 ms"; the unit is very likely microseconds.
#
# Code read: https://github.com/FentonLab/PyCode_MEC_HDC-NeuronMS_Park at commit 545a738 (4 Nov
# 2018), linked under Data and Software Availability. It holds two Python 2 scripts that read
# the TSD files of the dataset. HD_Max_likelihood.py is the decoder of Figures 2 and 5: windows
# of 20 tracker samples (at 30 Hz, 667 ms; the Methods say 660 ms), the window's head direction
# the circular mean of its samples (samples with direction > 360 dropped), 36 bins of 10
# degrees, a Poisson rate per cell and bin fitted on the training file (spikes in windows at
# that bin divided by the number of such windows), the summed Poisson log likelihood maximized
# over the bins, windows in which no cell spiked left undecoded. Training is stable1 (the
# DIR/SA1 folder), testing another trial (TSD/SA2, or the rotating trial in room or arena
# coordinates). Spike_triggered_FR_curve.py is the internally referenced tuning of Figure 4: for
# each spike of cell 1, the head direction at that spike minus the head direction at each cell 2
# spike in a window of move_ts = 900 samples (30 s) that ends at the cell 1 spike, binned in 36
# bins of 10 degrees, divided by the count of the same differences over all tracker samples of
# the window (an occupancy normalization). The Gaussian process tuning estimator of Figures S5
# and S6 is at https://bitbucket.org/crissavin/pfgp.git; it was not read in this run. No code
# is given for Idir, the cell-pair correlations, the tuning measures or the statistics (JMP 12).
#
# Data the paper used (STAR Methods, Animals; Behavior and recording environment;
# Electrophysiology; Data Analysis; Table S1). Fifteen adult male Long-Evans rats; 1594 MEC
# single units recorded with tetrodes, 1059 well isolated (IsoIBG and IsoINN above 3.5; Figure
# S6 says 1049), of which 115 head-direction cells from 13 rats (Table S1 lists 15 rats, two
# with none). 353 MEC cells and 556 MEC cell pairs in Table S1; 142 simultaneously recorded
# head-direction cell pairs (Results, Figure 4). Each recording is a triad of 30 min trials,
# stable1, rotating (arena at 1 rpm clockwise), stable2, during active place avoidance on a
# 1.2 m arena with a shock zone (a 30 or 45 degree sector) fixed in the room and, during
# rotation, a second one fixed to the arena. Position and head direction tracked at 30 Hz from
# two LEDs; spikes digitized at 48 kHz; LFP at 2 kHz. Rats R030 and R850 are left out of the
# behavioural analysis of Figure 1. The CRCNS description of hc-20 says it holds the MEC spike
# trains in TSD files (30 Hz samples of x, y, head direction and spike times) in folders SA1,
# SA2, RA_ar (arena coordinates) and RA_rm (room coordinates), a FileNameList.xlsx matching
# units across trials, and the tracker's .dat behaviour files. It does not mention LFP,
# waveforms or the pretraining and training sessions of the learning curves; whether they are
# there is for the author to find.
#
# Head-direction cells (Data Analysis): long-duration spikes, mean rate below 10 AP/s, and in
# stable1 a significant Rayleigh test and a Kuiper's test showing the tuning differs from the
# sampled head directions; tuning curves at 10 degree resolution, rate = spikes over time in
# each bin. Preferred direction is the bin of maximum rate; directionality is the Rayleigh
# vector length of the tuning curve; instability is the resistor-average symmetric
# Kullback-Leibler divergence (KLD) between two tuning curves made into probabilities with the
# Krichevsky-Trofimov estimate (Quantifying Head-direction Signals). Statistics (Statistics)
# are one- or two-way ANOVA with or without repeated measures, Greenhouse-Geisser correction
# when Mauchly's test shows a violation of sphericity, Tukey-Kramer HSD for all pairs and
# Dunnett's test against a baseline. The two halves of stable1 (the baseline of Figures 1D and
# 4D) are read as its first and second 15 min, as the code's folder names suggest
# (spk_trig_15min_2, 2nd15).
schema_version: 2
paper: doi:10.1016/j.neuron.2018.11.019
claims:
- id: cell-counts
  statement: The paper analyses 115 dorsal MEC head-direction cells from 13 rats, among 353 MEC
    cells forming 556 cell pairs (Table S1), out of 1594 MEC single units recorded.
  source: Results, Degraded Directional Tuning, paragraph 1; STAR Methods, Electrophysiology;
    Table S1
  quote: We recorded 115 dorsal MEC head-direction cells (Figure S1; Table S1) from 13 rats
  expected:
  - quantity: head-direction cells
    value: 115
    tolerance: 11.5
  - quantity: MEC cells in Table S1
    value: 353
    tolerance: 35.3
  - quantity: MEC cell pairs in Table S1
    value: 556
    tolerance: 55.6
  criterion: Counts of units and simultaneously recorded pairs, matched across the three trials
    with FileNameList.xlsx. The dataset may hold only the cells of Table S1, or all recorded
    units; the readings are (a) count the units and pairs the dataset holds; (b) apply the
    paper's head-direction criteria (mean rate below 10 AP/s, significant Rayleigh test and
    significant Kuiper's test against sampled head directions in stable1, each at p < 0.05,
    a level the Methods do not state) and count the cells that pass. Spike width cannot be
    applied without waveforms. Reproduced when the counts are within tolerance under a
    reading; the per-rat counts of Table S1 are compared as well.
- id: hd-cell-rate
  statement: The head-direction cells have long-duration spikes and a mean firing rate of 1.41 ±
    0.20 AP/s.
  source: STAR Methods, Data Analysis, paragraph 2
  quote: MEC head direction cells were classified as cells with long duration action potentials
    (avg. width at 30% of the peak voltage 169.79 ± 4.58 ms) and average firing rate below 10
    AP/s (avg. 1.41 ± 0.20 AP/s)
  depends_on:
  - cell-counts
  expected:
  - quantity: mean firing rate of head-direction cells
    value: 1.41
    tolerance: 0.2
    unit: AP/s
  criterion: Mean over the 115 cells of the spike count over the trial's duration. The trial is
    not stated; the readings are (a) stable1, the classification trial; (b) the mean over the
    three trials. The tolerance is the paper's stated spread. Spike width is not tested
    (waveforms are not described as deposited).
- id: fig1a-avoidance-learning
  statement: The 13 recorded rats learned the place avoidance task, with performance improving
    over trials in the stable (baseline) and the rotating (challenge) conditions and no trial by
    frame interaction in the rotating condition.
  source: Figure 1A legend; Results, Degraded Directional Tuning, paragraph 1
  quote: "right: learning curves from the 13 recorded rats in the stable [baseline]"
  statistics:
  - about: stable condition, trial effect
    test: repeated-measures ANOVA, Greenhouse-Geisser corrected
    statistic: F(3.78, 46.01) = 3.79
    p: 0.01
    n: 13 rats
  - about: rotating condition, trial effect
    test: repeated-measures ANOVA, Greenhouse-Geisser corrected
    statistic: F(3.76, 90.29) = 23.57
    p: 0.001
    p_relation: "<"
  - about: rotating condition, trial by frame interaction
    test: repeated-measures ANOVA, Greenhouse-Geisser corrected
    statistic: F(3.76, 90.29) = 0.31
    p: 0.86
  criterion: The paper does not say which measure of avoidance is plotted or how many trials
    the curves span (the corrected numerator degrees of freedom imply at least five trials).
    The readings are (a) shock zone entrances per trial; (b) time to first entrance, the two
    usual measures of this task. Per condition, a repeated-measures ANOVA on trial (and in the
    rotating condition on trial and frame, room or arena zone) with Greenhouse-Geisser
    correction, as the legend and Statistics state. Reproduced when, under a reading, the trial
    effect has p < 0.05 in both conditions, performance improves over trials, and the trial by
    frame interaction has p ≥ 0.05. Rats R030 and R850 are left out (Table S1 footnote).
    Training sessions may not be in the dataset; whether they are is the author's to find.
- id: fig1c-speed
  statement: Rotation did not change locomotor speed relative to stable1, measured in either
    frame, but speed was lower in stable2 than in the other conditions.
  source: Figure 1C, top left, and its legend
  quote: Effect of rotation on (top left) speed
  statistics:
  - test: repeated-measures ANOVA, Greenhouse-Geisser corrected, Tukey-Kramer HSD
    statistic: F(2.02, 74.68) = 46.61
    p: 1.0e-14
  criterion: Mean speed per recording in four conditions, stable1, rotating in the room frame,
    rotating in the arena frame, stable2, from the 30 Hz positions (RA_rm and RA_ar for the two
    frames). The paper does not fix how speed is computed or the unit of the ANOVA; the degrees
    of freedom imply about 38 units. Readings of the speed are (a) displacement between
    successive 30 Hz samples; (b) displacement over 1 s steps. The unit is read as the
    recording session; the cell (n = 115) is ruled out, as it would give a denominator near
    230 degrees of freedom. Repeated-measures ANOVA with Greenhouse-Geisser
    correction and Tukey-Kramer HSD. Reproduced when, under a reading, the condition effect has
    p < 0.05, stable2 is lower than each other condition by Tukey-Kramer at p < 0.05, and the
    other three do not differ; partially reproduced when the effect holds with another order.
- id: fig1c-lfp-power
  statement: Power in the MEC local field potential did not differ across conditions.
  source: Figure 1C, top right, and its legend; Results, Degraded Directional Tuning, paragraph 1
  quote: Despite excellent navigation (Figure 1A), maintained firing rates, and power in the local
    field potential (LFP)
  statistics:
  - test: ANOVA
    statistic: F(2, 183) = 1.27
    p: 0.28
  criterion: A claim of absence, judged on the paper's test, an ANOVA on LFP power across
    stable1, rotating and stable2 with p ≥ 0.05 (Statistics; the degrees of freedom imply a
    one-way ANOVA on 186 values). Power by Welch's method (MATLAB pwelch) on artifact-free
    segments longer than 4 s (Local field potential analysis). The band is not stated; the
    readings are total power and theta-band power. The LFP is not described as part of hc-20.
- id: fig1c-firing-rate
  statement: Firing rates of the head-direction cells were maintained across stable1, rotating
    and stable2.
  source: Figure 1C, bottom left, and its legend
  quote: Despite excellent navigation (Figure 1A), maintained firing rates
  statistics:
  - test: repeated-measures ANOVA, Greenhouse-Geisser corrected
    statistic: F(1.34, 153.21) = 1.89
    p: 0.17
    n: 115 cells
  depends_on:
  - cell-counts
  criterion: A claim of absence, judged on the paper's test. Mean rate per cell and trial
    (spikes over trial duration), repeated-measures ANOVA on trial (three levels) with
    Greenhouse-Geisser correction when Mauchly's test is significant. Reproduced when p ≥ 0.05;
    the mean change is reported either way.
- id: fig1c-directionality
  statement: Directional tuning of head-direction cells was strongly degraded during rotation in
