  statistics:
  - test: repeated-measures ANOVA, Tukey-Kramer HSD
    statistic: F(3, 342) = 70.36
    p: 1.0e-35
    n: 115 cells
  - about: post hoc pairs
    test: Tukey-Kramer HSD
    p: 0.01
    p_relation: "<"
  depends_on:
  - cell-counts
  criterion: Directionality is the Rayleigh vector length of the 10 degree tuning curve
    (Quantifying Head-direction Signals, Directionality), per cell in four conditions
    (stable1, rotating room frame, rotating arena frame, stable2). Repeated-measures ANOVA on
    condition, then Tukey-Kramer HSD. Reproduced when the effect has p < 0.05, stable1 and
    stable2 do not differ, each stable trial > room and room > arena, each of these pairs
