- id: fig1d-instability
  statement: Directional instability (the KLD between tuning curves) differs across trial pairs
    and is greater for every trial pair than between the two halves of stable1.
  source: Figure 1D, right, and its legend; Results, Degraded Directional Tuning, paragraph 1
  quote: the change in preferred direction of directional tuning and the overall change in
    directional tuning (''instability'') was greater across the two stable conditions and
