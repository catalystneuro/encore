    a between-groups test on about 141 pairs). Reproduced when p ≥ 0.05 at all three
    timescales; the Pearson r between the pairs' tau in stable1 and in each other trial is
    reported as well.
- id: figs4-all-pair-correlations-preserved
  statement: Cell-pair discharge correlations among all 556 MEC cell pairs were preserved across
    trials (r² > 0.55 between the two stable trials and r² ≥ 0.52 between stable1 and rotating).
  source: Results, Degraded Directional Tuning and Maintained Temporal Coupling, paragraph 1;
    Figure S4
  quote: these correlations were also preserved among all the MEC cell pairs that were recorded (n
    = 556 pairs), regardless of the spatial functional class of the cells (r2 > 0.55 across the
    two stable conditions; r2 R 0.52 across the first stable and rotating session; Figure S4)
  depends_on:
  - cell-counts
  expected:
  - quantity: smallest r², stable1 against stable2 Kendall correlations
    value: 0.55
    tolerance: 0.055
  - quantity: smallest r², stable1 against rotating Kendall correlations
    value: 0.52
    tolerance: 0.052
  criterion: Kendall's tau of every simultaneously recorded MEC pair at 40, 250 and 1000 ms, and
    the squared Pearson correlation between the sets of tau in stable1 and in each other trial
    (Stability of a correlated network state). The reported values are lower bounds over the
    timescales. Reproduced when at every timescale r² is at least 0.495 for stable1 against
    stable2 and at least 0.468 for stable1 against rotating (each bound less 10%).
- id: figs5-hd-cells-high-model-information
  statement: The 115 conventionally identified head-direction cells also score high in
    head-direction information estimated by the Gaussian process tuning model among the 921
    modelled MEC cells.
  source: Figure S5 legend
  quote: The conventionally-identified cells also scored high in head-direction information, which
    validates the model-based approach.
  depends_on:
  - cell-counts
  criterion: Model as in the Methods (Model-based estimation ...), code at
    https://bitbucket.org/crissavin/pfgp.git, on spike counts over a 4-dimensional lattice of
    2D position, speed and head direction; head-direction information is the mutual information
    between the posterior mean response and head direction. Cells modelled are those with rate
    below 30 AP/s and more than 50% of the arena visited in all three trials (Figure S6 legend).
    The lattice resolution and time bin are not stated in the paper; they are taken from the
    pfgp code. "Scored high" names no test; the readings are (a) the median of the
    head-direction cells lies in the upper third of the population, the class threshold of
    Figure S6, (b) the head-direction cells exceed the other cells by a one-sided Mann-Whitney
    test at p < 0.05. Reproduced when a reading holds.
- id: figs6-subclass-correlations-preserved
  statement: Cell-pair discharge correlations within the grid-tuned, position-tuned and
    speed-tuned subclasses of MEC cells are maintained across stable and rotating trials.
  source: Figure S6 legend
  quote: Cell-pair specific discharge correlations within subclasses of spatially-tuned cells are
    maintained across the stable and rotating sessions.
  depends_on:
  - figs5-hd-cells-high-model-information
  criterion: Classes by the Gaussian process model (Figure S6 legend), each the upper third of
    its metric among the 921 cells, grid score from the session-averaged rate map (60 and 120
    degree rotation correlations minus 30, 90 and 150 degree ones), and position and speed
    information. Kendall's tau within each class at 40, 250 and 1000 ms, stable1 against
    rotating and against stable2. "Maintained" names no threshold; the readings are (a) r² at
    least the bounds of figs4-all-pair-correlations-preserved less 10%, (b) a positive Pearson
    r at p < 0.05. Reproduced when a reading holds for every class, timescale and trial pair;
    partially reproduced when it holds for most.
- id: no-angular-velocity-tuning
  statement: The MEC head-direction cells showed no systematic tuning of firing rate to angular
    head velocity.
  source: Results, Transient Allocentric Registration, paragraph 1
  quote: There was no systematic tuning of firing rate to angular velocity in these MEC
    head-direction cells (data not shown).
  depends_on:
  - cell-counts
  criterion: The paper shows no data and names no measure or test. The readings are (a) per cell,
    the Pearson correlation of rate with signed angular velocity in 30 Hz samples, (b) the same
    with unsigned angular velocity; the head direction derivative over successive samples.
    A claim of absence with no test in the paper; reproduced when, under a reading, the
    fraction of cells significant at p < 0.05 does not exceed what chance gives by a binomial
    test at p < 0.05, and the result rests on that assumption.
- id: fig4-internal-tuning-preserved
  statement: Internally referenced directional tuning of head-direction cell pairs (tuning of one
    cell to head-direction displacement since the other's spikes) was preserved across stable1,
    rotating and stable2; neither its instability nor its change in preference differed between
    trials or from the two halves of stable1.
  source: Results, Transient Allocentric Registration, paragraph 2; Figure 4B and 4D and the
    legend
  quote: Internally referenced tuning to head-direction displacement was preserved across the
    stable and rotating conditions
  statistics:
  - about: instability across trial pairs
    test: repeated-measures ANOVA, Greenhouse-Geisser corrected
    statistic: F(1.70, 219.83) = 2.81
    p: 0.07
  - about: preference change across trial pairs
    test: repeated-measures ANOVA, Greenhouse-Geisser corrected
    statistic: F(1.83, 248.26) = 0.42
    p: 0.6
  - about: instability, trial pairs against stable1 halves
    test: ANOVA
    statistic: F(3, 522) = 1.39
    p: 0.2
  - about: preference change, trial pairs against stable1 halves
    test: ANOVA
    statistic: F(3, 536) = 0.34
    p: 0.8
  depends_on:
  - cell-counts
  criterion: A claim of absence, judged on the paper's tests (four ANOVAs as in Figure 4D, each
    at p ≥ 0.05). Internally referenced tuning as in the Methods (Estimating internally
    referenced head direction), for the 142 ordered or unordered pairs; KLD and preferred
    direction change as in fig1d-instability and fig1d-preference-change, on the same trial
    pairs and stable1 halves. Open details and readings. The interval, (a) 5 s as in the
    Results and Figure 4B, (b) 30 s, the code's window. The window side is not fixed by the
    Methods or Results ("within a maximal interval"); the code settles it, cell 2 spikes before
    the cell 1 spike (Spike_triggered_FR_curve.py, window from the cell 1 spike time less
    move_ts samples to that time), which is the main reading, with cell 2 spikes after the cell 1
    spike as a variant. The normalization, (a) the Methods' division by the sum of the time
    offsets, (b) the code's division by the occupancy of each displacement. The degrees of
    freedom imply about 130 to 137 pairs, so some pairs were dropped for a reason the paper
    does not give; the pairs used are those with a defined curve in every trial. Reproduced
    when all four tests have p ≥ 0.05 under the main readings (5 s, the code's side, the
    Methods' normalization); the variants are shown.
- id: fig4c-arena-registration-short-lived
  statement: The strength of internally referenced directional tuning is similar in all
    conditions and frames for intervals up to 10 s, but beyond 10 s it falls in the rotating arena
    frame (20 to 60 s; stable1 = stable2 = rotating room > rotating arena) and at 300 to 600 s also
    in the rotating room frame (stable1 = stable2 > rotating room > rotating arena).
  source: Figure 4C and its legend; Results, Transient Allocentric Registration, paragraph 3
  quote: during short intervals in the rotating condition, the strength of internally referenced
    directional tuning was similar in the two spatial frames but less so across longer
    intervals (Figure 4C). Specifically, internally referenced arena-frame tuning abruptly
    decreased after 10 s.
  statistics:
  - about: condition by interval interaction
    test: repeated-measures two-way ANOVA, Greenhouse-Geisser corrected
    statistic: F(6.91, 1287.7) = 15.16
    p: 1.0e-17
  - about: conditions at each interval up to 10 s
    test: one-way ANOVA
    statistic: F(3, 564) ≤ 1.59 (printed with the glyph for ≥, read as ≤ since p > 0.19 at
      each interval)
    p: 0.19
    p_relation: ">"
  - about: conditions at each interval beyond 10 s
    test: one-way ANOVA, Tukey-Kramer HSD
    statistic: F(3, 564) ≥ 23.73 (printed with the glyph for ≤, read as ≥ since p < 10^-14 at
      each interval)
    p: 1.0e-14
    p_relation: "<"
  depends_on:
  - fig4-internal-tuning-preserved
  criterion: Per pair and maximum interval (3, 4, 5, 10, 20, 30, 40, 50, 60, 300 and 600 s, as the
    Methods list; the legend says 10 intervals), internally referenced tuning in stable1,
    stable2, rotating room and rotating arena frame, with the readings of window side and
    normalization of fig4-internal-tuning-preserved. Strength is not defined; the reading is
    the Rayleigh vector length of the curve, the paper's directionality measure. One-way ANOVA
    of the four conditions at each interval (142 pairs, as the degrees of freedom imply) with
    Tukey-Kramer HSD. Reproduced when the ANOVA has p ≥ 0.05 at every interval up to 10 s,
    p < 0.05 at every interval beyond 10 s, the arena frame is below the three others at 20 to
    60 s, and at 300 to 600 s the room frame is also below both stable trials; partially
    reproduced when the arena frame falls below the others beyond 10 s and not before, but the
    room-frame order at long intervals is not found.
- id: fig5-error-inhomogeneous
  statement: The angular distribution of decoding error is inhomogeneous in the room frame
    (resultant r = 0.589) and the arena frame (r = 0.653) and differs from the distribution of
    sampled head directions, which is itself biased in both frames (r = 0.147 room, r = 0.378
    arena).
  source: Results, Transient Allocentric Registration, paragraph 4; Figure 5A and 5B and the
    legend
  quote: The angular distribution of the decoded directional error was not homogeneous in the room
    frame (Figure 5A; resultant vector r = 0.589; Rayleigh’s test; z = 236.36; p = 0.000); nor
    was the error distribution similar to the head-direction distribution
  statistics:
  - about: room-frame error, uniformity
    test: Rayleigh's test
    statistic: r = 0.589, z = 236.36
    p: 0
  - about: room-frame error against head directions
    test: Kuiper's test
    statistic: V = 4.17 × 10^7
    p: 0.001
  - about: arena-frame error, uniformity
    test: Rayleigh's test
    statistic: r = 0.653, z = 289.63 (the legend prints 153.24 and 230.58)
    p: 0.0001
  - about: arena-frame error against head directions
    test: Kuiper's test
    statistic: V = 5.38 × 10^7
    p: 0.001
  - about: room-frame head directions, uniformity
    test: Rayleigh's test
    statistic: r = 0.147, z = 230.6
    p: 0.0001
    p_relation: "<"
  - about: arena-frame head directions, uniformity
    test: Rayleigh's test
    statistic: r = 0.378, z = 153.2
    p: 0.001
  depends_on:
  - fig2-decoding-stable-vs-rotating
  expected:
  - quantity: resultant r of room-frame decoding error
    value: 0.589
    tolerance: 0.0589
  - quantity: resultant r of arena-frame decoding error
    value: 0.653
    tolerance: 0.0653
  - quantity: resultant r of room-frame head directions
    value: 0.147
    tolerance: 0.0147
  - quantity: resultant r of arena-frame head directions
    value: 0.378
    tolerance: 0.0378
  criterion: Decoding error during rotation from the decoder of fig2-decoding-stable-vs-rotating,
    in each frame, a Rayleigh test of uniformity and a Kuiper's test against the sampled head
    directions of the same trial. Which recordings are pooled is not stated; the z values
    imply about 680 decoded windows and 1,100 to 10,700 head-direction samples. The readings
    are (a) all seven ensembles pooled, (b) the exemplar ensemble with the most cells, (c)
    each ensemble apart, with the median r. The window is 660 ms, with 133 ms as a variant.
    Reproduced when, under a reading, both error distributions and both head-direction
    distributions are non-uniform at p < 0.05, both Kuiper's tests have p < 0.05 and the four
    r values are within tolerance; partially reproduced when the tests hold but not every r.
- id: fig5c-error-minima-at-cues
  statement: The room-frame decoding error histogram has strong minima at 110 and 350 degrees in
    the room frame, the directions of the leading edges of prominent orienting cues given the
    clockwise rotation; the minima correspond to the cue edges in the room frame but not in the
    arena frame.
  source: Results, Transient Allocentric Registration, paragraph 4; Figure 5C and 5D
  quote: Interestingly, the room frame direction decoding error distribution showed strong minima
    at 110 ... in the room frame, which, given the clockwise arena rotation, are the directions
    at which the leading edges of prominent orienting cues were located
  depends_on:
  - fig5-error-inhomogeneous
  expected:
  - quantity: direction of first minimum of room-frame decoding error
    value: 110
    tolerance: 10
    unit: degrees
  - quantity: direction of second minimum of room-frame decoding error
    value: 350
    tolerance: 10
    unit: degrees
  criterion: The tolerance is one 10 degree bin, the decoder's resolution, since 10% of an angle
    has no meaning. What the histogram is a function of is not stated; the readings are (a)
    the mean absolute decoding error as a function of the rat's room-frame head direction in 10
    degree bins, (b) the histogram of the signed decoding error itself. Under the pooling
    readings of fig5-error-inhomogeneous. Reproduced when the two deepest local minima lie
    within tolerance of 110 and 350 degrees under a reading; partially reproduced when one
    does. Whether they match the cue positions cannot be tested, as the room's cue positions
    are given only in the figure.
