- id: fig1d-preference-change
  statement: The change in preferred direction differs across trial pairs (stable1-stable2 =
    stable1-rotating room frame > stable1-rotating arena frame), and is greater for every trial
    pair than between the two halves of stable1.
  source: Figure 1D, left, and its legend; Results, Degraded Directional Tuning, paragraph 1
  quote: The rotation-induced change in (left) directional preference differs across trial pairs
  statistics:
  - about: across the three trial pairs
    test: repeated-measures ANOVA
    statistic: F(2, 228) = 10.54
    p: 1.0e-5
