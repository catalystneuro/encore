- id: fig2-decoding-stable-vs-rotating
  statement: Head direction decoded from stable1 ensemble tuning is relatively accurate in
    stable2 and relatively inaccurate and abruptly changing in both frames during rotation,
    although for some ensembles room-frame decoding is similar to stable2; seven ensembles of at
    least five head-direction cells were analysed.
  source: Results, Degraded Directional Tuning, paragraph 2; Figure 2A and 2B
  quote: Seven ensembles of R5 cells were analyzed ... Relatively accurate decoding of the stable2
    recordings (Figure 2A) contrast with relatively inaccurate and abruptly changing decoding in
    both the room and arena spatial frames during rotation, although for some ensembles, decoding
    in the room frame was similar to decoding in the stable2 condition
  expected:
  - quantity: ensembles of at least 5 head-direction cells
    value: 7
    tolerance: 0
  depends_on:
  - cell-counts
  criterion: The decoder of HD_Max_likelihood.py (see the opening comment), trained on stable1
    and applied to stable2 and to the rotating trial in room and in arena coordinates; error is
    the circular difference of decoded and actual direction. The window is 660 ms in the
    Methods (20 samples in the code) and 133 ms in the Figure 2 legend; 660 ms is the main
    reading and 133 ms a variant. The paper gives no summary measure (Figure 2 shows error
    histograms); the readings are (a) the median absolute circular error per ensemble and
    condition, (b) the mean absolute circular error. The paper names no count of ensembles for
    "relatively accurate" and "relatively inaccurate"; a majority (at least four of seven) is
    an assumption. Reproduced when there are seven ensembles of at least five simultaneously
    recorded head-direction cells (no tolerance, as this is a count of recordings), the stable2
    error is below the arena-frame error in at least four ensembles, and below the room-frame
    error in at least four (the paper allows some ensembles with room-frame decoding similar
    to stable2, and one ensemble, b, with poor stable2 decoding).
- id: figs2-frame-preference
  statement: During rotation, frame-specific directional discharge alternated between signaling
    room and arena direction; four of seven ensembles showed an overall room preference and two
    of seven an arena preference.
  source: Results, Degraded Directional Tuning, paragraph 3; Figure S2A and S2B; Figure 2C legend
  quote: 4/7 ensembles showed an overall preference to signal room directions over arena
    directions and 2/7 showed an overall preference to signal arena directions over room
    directions
  expected:
  - quantity: room-preferring ensembles
    value: 4
    tolerance: 0
  - quantity: arena-preferring ensembles
    value: 2
    tolerance: 0
  depends_on:
  - fig2-decoding-stable-vs-rotating
  criterion: Per cell and 133 ms interval of the rotating trial, Idir = |p(n|d) log2(p(n|d)/p(n))|
    for the observed spike count n and head direction d, separately with room and arena
    directions; ΔIdir is the room sum over cells minus the arena sum (Estimating momentary
    directional information). Open details and their readings. Direction bins, (a) 10 degrees
    as the tuning curves, (b) 45 degrees as the position by direction maps. The probabilities
    from (a) the rotating trial itself, (b) stable1. The SD of the 2 SD rule, (a) the SD of the
    ensemble's ΔIdir series, (b) the SD of stable1 Idir, given in Figure 2C for calibration.
    An ensemble prefers the room when p(ΔIdir > 2 SD) exceeds p(ΔIdir < -2 SD) and the arena
    in the reverse case (Figure 2C legend, Figure S2B); the margin for "no preference" is not
    stated, and is read as (a) the two probabilities within a factor of 2, (b) both below 0.05.
    Counts are of seven ensembles, so no tolerance. Reproduced when the counts are 4 and 2
    under a reading; partially reproduced when room-preferring ensembles outnumber
    arena-preferring ones.
- id: fig2c-proximity-anticorrelation
  statement: The rat's relative proximity to one shock zone versus the other is anti-correlated
    with frame-specific directional information, so that near the room shock zone directional
    discharge favours the arena frame and the reverse; this holds for Idir in each frame (mean r
    = -0.141 ± 0.029, all p < 0.0001) and for ΔIdir (r = -0.18, p < 0.05, in the exemplar).
  source: Results, Degraded Directional Tuning, paragraphs 3 and 4; Figure 2C and its legend;
    Figure S2C
  quote: This anticorrelation was observed for Idir defined for each spatial frame ... 0.141 ± 0.029;
    all p < 0.0001), as well as for their combination DIdir
  statistics:
  - about: Idir per frame against relative proximity, each ensemble
    test: Pearson correlation
    statistic: mean r = -0.141 ± 0.029
    p: 0.0001
    p_relation: "<"
  - about: Idir against relative proximity, second report
    test: Pearson correlation
    statistic: mean r = -0.132 ± 0.024
    p: 0.0001
    p_relation: "<"
  - about: ΔIdir against relative proximity, ensemble b
    test: Pearson correlation
    statistic: r = -0.18
    p: 0.05
    p_relation: "<"
  depends_on:
  - figs2-frame-preference
  expected:
  - quantity: mean Pearson r, Idir against relative proximity
    value: -0.141
    tolerance: 0.029
  criterion: Idir and ΔIdir as in figs2-frame-preference, at 133 ms steps of the rotating trial,
    correlated (Pearson) with the relative proximity to the two shock zones at the same steps.
    The paper does not define relative proximity (it cites Kelemen and Fenton 2010); the
    readings are (a) (d_arena - d_room) / (d_arena + d_room) with d the distance to each zone,
    (b) d_arena - d_room, each signed so that a positive value means nearer the room zone,
    paired with the room-frame Idir and its mirror for the arena-frame Idir. The two averages
    the Results give (-0.141 ± 0.029 and -0.132 ± 0.024) are read as (a) one per frame-specific
    Idir correlation over 14 values, (b) the second over the ΔIdir correlations; either value
    may match. The tolerance is the paper's stated spread. Reproduced when every correlation is
    negative with p < 0.0001 and the mean is within tolerance of either value; partially
    reproduced when the mean is negative but not every correlation is significant.
- id: figs3-no-head-direction-bias
  statement: The frame preference ΔIdir does not vary systematically with head direction; its
    polar distribution over head direction in either frame is not biased toward the shock zones
    and does not differ from uniform.
  source: Results, Degraded Directional Tuning, paragraph 4; Figure S3 legend
  quote: did not significantly differ from uniform (average r = 0.17 ± 0.02; p > 0.17; Figure S3)
  statistics:
  - test: Rayleigh test
    statistic: average r = 0.17 ± 0.02
    p: 0.17
    p_relation: ">"
  depends_on:
  - figs2-frame-preference
  expected:
  - quantity: average Rayleigh r of normalized ΔIdir over head direction
    value: 0.17
    tolerance: 0.02
  criterion: A claim of absence, judged on the paper's test. Per ensemble and frame, mean ΔIdir
    in head-direction bins (10 degrees, as the tuning curves; the bin is not stated),
    normalized to 0 to 1 by adding the magnitude of the minimum and dividing by the maximum
    (Figure S3 legend), and a Rayleigh test with the normalized values as weights. The n of the
    test is not stated; the readings are (a) the number of bins, which with r = 0.17 gives p
    near 0.35, consistent with p > 0.17, (b) the sum of the weights. Reproduced when every test
    has p ≥ 0.05; the average r is reported against the expected value.
- id: fig3-hd-pair-correlations-preserved
  statement: The sub-second temporal coupling of head-direction cell pairs (Kendall correlations
    of spike counts at 40, 250 and 1000 ms) was maintained across stable1, rotating and stable2.
  source: Figure 3B and its legend; Results, Degraded Directional Tuning and Maintained Temporal
    Coupling, paragraph 1
  quote: The three conditions did not differ at any of the timescales
  statistics:
  - about: 40 ms
    test: ANOVA
    statistic: F(2, 420) = 0.097
    p: 0.9
  - about: 250 ms
    test: ANOVA
    statistic: F(2, 420) = 0.305
    p: 0.7
  - about: 1000 ms
    test: ANOVA
    statistic: F(2, 420) = 0.44
    p: 0.7
  depends_on:
  - cell-counts
  criterion: A claim of absence, judged on the paper's test. Spike counts in 40, 250 and 1000 ms
    bins over each trial, Kendall's tau for each simultaneously recorded head-direction pair,
    Fisher z-transformed (Figure 3B legend; Stability of a correlated network state). One-way
