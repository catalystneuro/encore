- id: edf10-decision-mice-like-frequent
  statement: Frequent morph mice trained to report whether S was above or below 0.5 by where they
    licked (FD1 to FD4) remapped like frequent morph mice without the task.
  source: Results, CA1 population activity approximates optimal estimation of the stimulus,
    paragraph 6; Extended Data Fig. 10
  quote: The remapping patterns were similar to those observed in frequent morph mice that did not
    perform this task
  data: with_inputs
  criterion: Extended Data Fig. 10f-h. SF, Q and Delta D_KL as in fig6a-dkl-sign and the prior
    reconstruction as in fig6d-prior-reconstruction, for FD mice; FD sessions are read as in
    session-and-trial-counts. The comparison is not stated; readings (a) the Q estimate pooled
    over FD mice has Delta D_KL > 0 (closer to the frequent posterior), (b) each FD mouse's
    reconstructed prior has Delta D_KL > 0. Reproduced when both readings hold; partially when one.
  depends_on:
  - fig6a-dkl-sign
- id: edf1-licking-before-reward
  statement: Well-trained mice ran steadily down the first half of the track and began licking as
    they approached the reward.
  source: Methods, Morphed environments, paragraph 1; Extended Data Fig. 1c-g
  quote: Once the animals were well trained, they often ran consistently down the first half of the
    track and began licking as they approached the reward
  criterion: Lick rate in the 10 cm bins of M3 per trial, sessions 8 to N. Extended Data Fig. 1g bins
    trials by reward location (50 cm bins) and plots lick rate against position, with no test. Read
    as reproduced when, in the across-mouse mean for each reward-location bin, lick rate rises over
    the 50 cm before the reward location and its peak lies within 50 cm of the reward location, and
    per mouse the mean lick rate over 0 to 225 cm is below that over 250 to 400 cm. The running
    part of the statement is shown in no figure (Extended Data Fig. 1 shows licking only) and is
    not judged; mean speed by position is shown.
- id: edf2-fh-best-predictor
  statement: Of the stimulus features, the horizontal component of wall frequency f_h best predicts
    the first principal component of the variance across VR scenes.
  source: Extended Data Fig. 2g legend; Results, Two-photon imaging of CA1 cells in morphed VR
    environments, paragraph 3
  quote: The horizontal component of wall frequency, f h , is the strongest predictor of the
    projection onto PC1.
  criterion: Extended Data Fig. 2a-g. Uses screenshots of the VR scene every 10 cm for the range of
    wall, tower and background morph settings, their per-channel FFT power spectra, PCA across
    settings, and single-predictor linear regressions onto PC1. These are renders of the Unity
    scenes, not recorded data. Reproduced when the f_h model has the lowest mean squared error of
    the single-feature models.
- id: fig7-model-reproduces-remapping
  statement: A Hebbian network with radial basis inputs and k-winners-take-all competition, trained
    on stimuli drawn from the rare or frequent morph prior, gives Q estimates that match the
    matching posterior.
  source: Results, Simple associative-learning mechanisms can approximate probabilistic inference in
    neural populations, paragraph 1; Figure 7b-f
  quote: model-derived SF values and Q estimates were good matches to the appropriate posterior
    distributions
  data: elsewhere
  where: figshare doi:10.6084/m9.figshare.31974756.v1 (Unprocessed VR data; the model needs
    only the priors of M7)
  criterion: Methods, Hebbian learning model (the parameter list says "For Fig. 4", read as Fig. 7),
    with the code (notebooks/KWTA_EmpiricalPrior.ipynb at dca5a57, kwta_network_model and d_def)
    for what the Methods leave open (answer of 2026-10-22). The model is run in the code's rescaled
    unit of M6 (1 unit = 27.42 f_h); the Methods' values are the same numbers in f_h, and the two
    are one model. M = 100 inputs with tuning exp(-(mu_j - x)^2/sigma^2) (the Methods drop the minus
    sign; code utilities.gaussian), sigma = 0.15 units (4.11 f_h; the Methods' "sigma^2 = 4.11" is
    the code's width sigma, so the denominator is 0.0225 units^2, 16.9 f_h^2), centres evenly spaced
    from -0.1 to 1.1 units (5.5 to 38.5 f_h, code THETA). N = 100 outputs, K = 20, c_y = 0.01 (code
    alpha = 1/M), eta = 0.1, tau = 0.001, W_max = 5, W initial U(0, 0.1). Noise as in the code, in
    training and in testing alike. Stimulus noise 0.1 units N(0,1) (sigma_S, 2.74 f_h) added to the
    stimulus before the inputs; 0.01 N(0,1) (sigma_y) added to every z before the K winners are
    chosen; winners y = c_y z; each other output y = 0.01 times the (K+1)-th largest z times N(0,1);
    all rectified at 0. Weight noise 0.05 N(0,1) (sigma_w, code dW noise) added to every weight
    update before the decay and the clipping; the earlier reading (b), without it, is dropped. The
    code's loser indexing (sort[-k:0:-1]) also gives noise to the K-th winner and leaves the weakest
    output at 0, a slip; the Methods' reading (all N - K losers) is followed. 1,000 training stimuli
    drawn from the group prior of M7 on the M6 grid; 50 models per condition (Fig. 7c legend).
    Testing, from the code, on the f_h of 1,000 evenly spaced S from -0.3 to 1.3 (code
    ut.wallmorphx(np.linspace(-.3, 1.3)), all between 5.5 and 38.5 f_h); SF centroids from test
    stimuli below 0.05 and above 0.9 units; the affine map sends the median SF of test stimuli with
    S in [-0.1, 0.1] and in [0.9, 1.1] to 0.094 and 1.073 units; then Q and Delta D_KL as M10 and
    M11. Seeds are a standard choice. Reproduced when the median Delta D_KL of the 50 rare-trained models is
    below 0 and that of the 50 frequent-trained models above 0 (Fig. 7f). The model uses no
    recorded activity; it needs only the trial morph values for the prior.
  depends_on:
  - vr-deposit-link
- id: fig7g-model-prior-reconstruction
  statement: Priors reconstructed from the model's Q estimates are closer to the prior of the
    matching condition, though less closely matched than for the neural data.
  source: Results, Simple associative-learning mechanisms can approximate probabilistic inference in
    neural populations, paragraph 1; Figure 7g
  quote: These unsupervised reconstructions were quantitatively more similar to the prior of the
    matching condition, but the match between the reconstruction and the true priors was not as
    compelling as the match seen in the neural data.
  data: with_inputs
  criterion: Models as in fig7-model-reproduces-remapping; R per model as in
    fig6d-prior-reconstruction, averaged over the 50 models (Fig. 7g legend, "Delta D_KL is for the
    averaged reconstructed prior"), in bits (the code's nats are a variant). Reproduced when the
    averaged reconstructed prior's Delta D_KL is negative for rare-trained and positive for
    frequent-trained models, and its magnitude is below the neural across-mouse mean magnitude
    of fig6d-prior-reconstruction in both conditions.
  depends_on:
  - fig7-model-reproduces-remapping
  - fig6d-prior-reconstruction
- id: edf3-simulated-posterior-population
  statement: A simulated population that stochastically encodes samples from the rare or frequent
    morph posterior reproduces the recorded remapping patterns.
  source: Results, CA1 population activity approximates optimal estimation of the stimulus,
    paragraph 6; Extended Data Fig. 3
  quote: Simulating neural populations that were designed to stochastically encode the posterior
    distributions also reproduced the remapping patterns described above
  data: with_inputs
  criterion: Methods, Simulating a neural posterior distribution. Per trial, samples s from the
    group posterior (M8) at the trial's f-hat_h; neuron i has gamma activity with theta = 1 and
    kappa_i(s) = alpha exp(-(s - mu_i)^2/sigma^2) + beta, sigma = 4.11, alpha = 2, beta = 0, mu_i
    evenly spaced over the M6 grid, 0.06 to 43.9 f_h (answer of 2026-10-22; the paper says only
    "possible f h values", and the code spaces the centres over the grid on which the posterior is
    sampled, SimulatedSimMats.simulate_session, xx_lims (-.3, 1.3)); 1,000 simulations (Extended
    Data Fig. 3g,h). The simulated difference is that of the mean over the 1,000 simulations, each
    simulation's trial-by-trial matrix z-scored over its off-diagonal entries before averaging
    (Extended Data Fig. 3j legend; code TheoreticalSimMats), and the mean z-scored matrices are
    averaged within the S-tilde blocks of fig3f-zscored-difference-at-025 for the comparison. The trials are those of the recorded
    sessions 8 to N (code TheoreticalSimMats uses a session's morph values and its cell count; the
    code's rbf_sigma 0.4, alpha 1 and beta 0.25 are a variant). Open, the samples per trial
    (Methods "several times", code 1) and the number of neurons, read as (a) one sample, the
    session's cell count, (b) 45 samples (one per position bin), 100 neurons. Reproduced when the
    z-scored rare minus frequent simulated similarity difference (Extended Data Fig. 3j) has the same
    sign as the recorded one (fig3f-zscored-difference-at-025) at every entry of the S-tilde = 0.25
    row that was significant there, under both readings.
  depends_on:
  - vr-deposit-link
  - fig3f-zscored-difference-at-025
- id: supp-earlier-morph-studies
  statement: With reasonable assumed priors, the probabilistic inference framework reproduces the
    discrete and gradual remapping reported in earlier morphed-environment studies (Wills 2005,
    Colgin 2010 double and single location, Leutgeb 2005).
  source: Discussion, paragraph 1; Supplementary Figs. 1 to 4
  quote: making reasonable assumptions, we reproduced each of the conflicting findings from previous
    studies using our probabilistic inference framework
  criterion: A simulation with priors the authors propose for other laboratories' experiments
    (Supplementary Figs. 1 to 4; code WillsLeutgebColgin_models). It uses no data of this paper,
    so the dataset cannot test it; it is listed to cover the paper's findings.
checks:
