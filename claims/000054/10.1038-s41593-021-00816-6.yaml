    value: -0.44
    tolerance: 0.044
  - quantity: pooled frequent morph Delta D_KL
    value: 0.42
    tolerance: 0.042
  data: with_inputs
  criterion: Per mouse, the across-session Q estimate is the average of its session Q estimates,
