- id: edf9k-null-models-rare
  statement: For rare morph sessions, Q estimates are fit worse by the frequent, uniform, Gaussian
    and multimodal prior posteriors and by a uniform posterior than by the rare morph posterior.
  source: Results, CA1 population activity approximates optimal estimation of the stimulus,
    paragraph 5; Extended Data Fig. 9j,k
  quote: Furthermore, a comparison of Q estimates to a number of other null model posteriors yielded
    poor fits to the data
  statistics:
  - about: frequent posterior against rare
    test: Wilcoxon signed-rank test
    p: 2.3e-4
    n: 24 sessions
  - about: uniform prior against rare
    test: Wilcoxon signed-rank test
    p: 4.7e-4
    n: 24 sessions
  - about: Gaussian prior against rare
    test: Wilcoxon signed-rank test
    p: 1.8e-5
    n: 24 sessions
  - about: multimodal prior against rare
    test: Wilcoxon signed-rank test
    p: 1.8e-5
    n: 24 sessions
  - about: uniform posterior against rare
    test: Wilcoxon signed-rank test
    p: 1.82e-5
    n: 24 sessions
  data: with_inputs
  criterion: Per rare morph session 8 to N, the mean over f-hat_h (M11 rows) of D_KL(P || Q) for the
    rare posterior and for each null; Wilcoxon signed-rank of null minus rare over sessions (code
    NullModels4GrumpyPantsReviewer). Null priors not in the Methods, taken from the code (cell 3)
