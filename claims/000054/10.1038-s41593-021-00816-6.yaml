  archive: dandi
  id: "000054"
paper: doi:10.1038/s41593-021-00816-6
claims:
- id: cells-per-session
  statement: Each imaging session recorded between 161 and 3,657 putative CA1 pyramidal cells.
  source: Results, Two-photon imaging of CA1 cells in morphed VR environments, paragraph 1; Methods,
