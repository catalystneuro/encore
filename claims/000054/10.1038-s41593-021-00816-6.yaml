  source: Results, CA1 population activity approximates optimal estimation of the stimulus,
    paragraph 4; Figure 6b-d
  quote: "A similar Δ D KL metric showed that the reconstructed priors are closer to the ideal prior
    from the correct condition than the ideal prior from the incorrect condition ( Fig. 6d ) (across
