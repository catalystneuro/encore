- id: edf4a-overlap-above-chance
  statement: The fraction of cells that are place cells in both S-tilde = 0 and S-tilde = 1 trials
    (6.07% rare, 1.98% frequent) slightly exceeds the overlap expected of independent populations
    (4.78% and 1.06%), so the two extreme maps are largely independent (global remapping).
  source: Results, Prior experience of stimulus frequency determines CA1 place cell remapping,
    paragraph 2; Extended Data Fig. 4a
  quote: Specifically, 6.07% and 1.98% of recorded cells had significant spatial information in both
    environments for rare morph and frequent morph sessions, respectively (chance 4.78% and 1.06%,
    respectively; one-sample two-sided t -test of actual minus chance overlap, t =−4.87, P =
    1.37×10 −5 , N = 45 sessions pooled across all mice)
  statistics:
  - test: one-sample two-sided t-test of actual minus chance overlap
    statistic: t = -4.87
    p: 1.37e-5
    n: 45 sessions pooled across all mice
  expected:
  - quantity: rare morph fraction of cells place cells in both
    value: 0.0607
    tolerance: 0.00607
  - quantity: frequent morph fraction of cells place cells in both
    value: 0.0198
    tolerance: 0.00198
  - quantity: rare morph chance overlap
    value: 0.0478
    tolerance: 0.00478
  - quantity: frequent morph chance overlap
    value: 0.0106
    tolerance: 0.00106
  criterion: Place cells as in place-cell-fractions. Per session, actual overlap is the fraction of
    all cells that are place cells for both S-tilde = 0 and = 1; chance is the product of the two
    fractions (Results; code PlotAllPlaceCells, randovlp and actlovlp). The group values in the
    code are pooled; read as (a) pooled over cells and (b) the mean over sessions. Test, as the
    code runs it, scipy ttest_1samp of chance minus actual over all sessions of both groups (the
    order that gives the paper's negative t). Reproduced when the test gives p < 0.05 with actual
    above chance and the four values are within tolerance under one reading; partially reproduced
    when only the test holds. The 2020 code ran it on 47 sessions; the attempt reports its count.
  depends_on:
  - place-cell-fractions
- id: edf4bc-overlap-cells-at-ends-and-reward
  statement: Cells with place fields in both extreme environments (2,219 rare, 594 frequent)
    tended to cluster at the end points of the track and in the reward zone.
  source: Results, Prior experience of stimulus frequency determines CA1 place cell remapping,
    paragraph 2; Extended Data Fig. 4b,c
  quote: Cells with place fields in both extreme environments tended to cluster at the end points of
    the track and the reward zone
  expected:
  - quantity: rare morph cells place cells in both S-tilde = 0 and = 1
    value: 2219
    tolerance: 221.9
  - quantity: frequent morph cells place cells in both
    value: 594
    tolerance: 59.4
  criterion: Cells of edf4a-overlap-above-chance that are place cells in both. Location is the
    position bin of peak trial-averaged activity in S-tilde = 0 trials and in S-tilde = 1 trials
    (Extended Data Fig. 4b,c). The paper shows this only as scatter plots; it gives no region or
    test. The reward zone is 250 to 400 cm (Methods, Morphed environments); "end points" is read as
    (a) the first and last bin and (b) the first and last 50 cm. How the two peaks of a cell are
    counted is not in the paper or the code (answer of 2026-10-22). The figure and the code
    (PlaceCellAnalysis.common_cell_remap_heatmap) show the joint histogram of the two peaks and a
    marginal histogram for each environment, so the paper allows (i) each environment's peaks
    separately, the S-tilde = 0 peaks and the S-tilde = 1 peaks each against their own reference,
    and (ii) cells with both peaks in the regions against the product of the two references. The
    reference is (a) the share of the track the regions cover and (b) the share of the peaks of all
    place cells of the same environment in the regions (S-tilde = 0 place cells for the S-tilde = 0
    peaks, S-tilde = 1 place cells for the S-tilde = 1 peaks). Reproduced when, in both conditions,
    the share of overlap cells in the end points or reward zone exceeds the reference under every
    combination of readings (end points, peaks, reference); the counts are judged by their
    tolerances.
  depends_on:
  - edf4a-overlap-above-chance
- id: fig2eh-place-cell-similarity-differs
  statement: Rare morph place cells keep their map up to a threshold morph value (S about 0.25 to
    0.5) and then switch coherently, while frequent morph place cells change gradually; the
    difference shows in the place-cell similarity matrices across S-tilde values.
  source: Results, Prior experience of stimulus frequency determines CA1 place cell remapping,
    paragraph 3; Figure 2e-h
  quote: In the rare morph condition, place cells maintained their representation until a threshold
    morph value ( S ≈ 0.25–0.50) and then coherently switched to a different representation ... This
    difference between conditions was also apparent in the normalized place cell population
    similarity matrices ( P < 0.0011, two-sided permutation test using animal identities (IDs), n =
    12 mice)
  statistics:
  - about: z-scored place cell similarity matrices, rare minus frequent (Fig. 2h)
    test: two-sided permutation test using animal identities
    p: 0.0011
    p_relation: "<"
    n: 12 mice
  - about: raw place cell similarity matrices, rare minus frequent (Fig. 2g)
    test: two-sided permutation test of mice across conditions
    p: 0.05
    p_relation: "<"
    n: 12 mice
  criterion: Methods, Place cell similarity matrices. Cells that are place cells for any S-tilde
    (place-cell-fractions), pooled over sessions 8 to N and mice of a condition. Per cell, the five
    trial-averaged rate maps (one per S-tilde, smoothed per M5), rows divided by their l2 norm, give
    a 5 x 5 cosine matrix; matrices are averaged over the cells of a condition and subtracted (rare
    minus frequent). For the z-scored version each cell's matrix is z-scored over its off-diagonal
    entries (Methods; the 2020 code z-scores jointly over all cells of a session, a variant).
    Mouse permutation test M12 on each entry, all cells of a mouse moving together, with the 6 rare
    and 6 frequent mice of the paper (the 2020 code counts R6 as frequent, mi<5, a variant).
    Reproduced when at least one off-diagonal entry of the z-scored difference lies outside the
    range of the 923 permuted differences, and at least one entry of the raw difference lies
    outside their 2.5 to 97.5 percentiles. The entries that do, with their signs, are reported.
  depends_on:
  - place-cell-fractions
- id: edf5-umap-rare-frequent-separable
  statement: In a nonlinear embedding (UMAP) of the morph-by-position activity of task-modulated
    cells, cells from rare morph and frequent morph mice can be told apart.
  source: Results, Prior experience of stimulus frequency determines CA1 place cell remapping,
    paragraph 4; Extended Data Fig. 5c
  quote: Rare and frequent morph cells were also separable using this approach.
  criterion: Methods, UMAP for dimensionality reduction. The Methods do not name the sessions; read
    as sessions 8 to N, the sessions of the remapping analyses (Results, Prior experience...,
    paragraph 1). Cells kept when the
    Euclidean distance between their mean S-tilde = 0 and S-tilde = 1 rate maps exceeds 99.9% of
    1,000 shuffles of the S-tilde labels of those trials (the Methods report 18,230 cells kept, 150
    of them dropped between the manifolds; the attempt reports its counts); maps binned by S into
    ten bins (edges not stated; read as ten equal bins over S from -0.1 to 1.1, a standard choice)
    and flattened (450 values per cell); UMAP (n_neighbors 100, correlation, min_dist 0.1, 3 dimensions;
    the code's min_dist 0.01 is a variant); DBSCAN into two manifolds (the code's min_samples 200,
    default eps), points outside both dropped; k-means with k = 10 in each; per cluster a new
    10-dimensional UMAP (n_neighbors 20, min_dist 0.1, correlation); logistic regression with
    ridge penalty and balanced class weights (code default C = 1, 10-fold cross-validation,
    permutation_test_score) classifies rare against frequent cells; significant when accuracy
    exceeds all label shuffles. The number of shuffles disagrees, 100 in the Methods and 1,000 in
    the Extended Data Fig. 5c legend; both are run, and a cluster is significant under that
    reading when it exceeds all shuffles. The paper does not say how many clusters make the two
    "separable"; readings (a) most of the 20 clusters significant, (b) at least one. UMAP and
    k-means seeds are a standard choice. The outcome is the one all readings give.
- id: edf6-nmf-confirms-remapping
  statement: Non-negative matrix factorization of single-cell trial-by-trial similarity matrices
    confirms discrete remapping in rare morph sessions and gradual remapping in frequent morph
    sessions.
  source: Results, Prior experience of stimulus frequency determines CA1 place cell remapping,
    paragraph 4; Extended Data Fig. 6
  quote: These findings were also confirmed using a second unsupervised approach ... non-negative
    matrix factorization
  criterion: Extended Data Fig. 6a legend. Per session 8 to N, each cell's trial-by-trial cosine
    similarity matrix (Methods, Single-cell trial-by-trial similarity matrices; maps smoothed per
    M5), upper triangle flattened, stacked over cells, factorised with rank 3; each factor reshaped
    into a trial-by-trial prototype and sorted by S. The paper judges the factors by eye and gives
    no measure. Read as follows (a reading, not from the paper, the same measure as
    fig3ab-block-versus-gradual-similarity). For each factor, average its prototype over S-tilde
    blocks (5 x 5, diagonal left out); for the factors whose largest block is (0, 0) or (1, 1),
    the step share of that extreme's row is the largest fall between neighbouring S-tilde values
    divided by the whole fall to the other extreme. Per session the mean over those factors, per
    mouse the mean over sessions. Reproduced when the across-mouse mean step share is higher for
    rare than for frequent morph mice and test M12 (2.5 and 97.5 percentiles) finds the
    difference. The 2020 code bins all sessions of a mouse into ten S bins with ranks 2 and 3
    (SingleCellNMF), a variant.
- id: fig3ab-block-versus-gradual-similarity
  statement: Single-session population trial-by-trial similarity matrices show two blocks in the
    rare morph condition and a gradual transition between the extremes in the frequent morph
    condition.
  source: Results, Population similarity analyses reveal distinct remapping patterns visible at the
    level of single trials, paragraphs 1 and 2; Figure 3a,b; Extended Data Figs. 7 and 8
  quote: For the rare morph condition, a strong block diagonal structure in the trial-by-trial
    similarity matrices suggested clustering of morph values into two representations
  criterion: Methods, Population trial-by-trial similarity matrices. Per session, all cells' single
    trial rate maps (M2, M3, M5) concatenated per trial, rows l2-normalised, cosine matrix C; rows
    and columns binned by S-tilde, diagonal left out; binned matrices averaged over sessions per
    mouse. The paper judges the single sessions by eye and gives no measure of a block or of a
    gradual transition; the group comparison it tests is fig3f-zscored-difference-at-025, on which
    this claim depends. Read as follows (a reading, not from the paper). In the S-tilde = 0 row and
    in the S-tilde = 1 row of a mouse's binned matrix, the step share is the largest fall in
    similarity between neighbouring S-tilde values divided by the whole fall from the row's own
    extreme to the other extreme; two blocks give a share near 1, an even gradient one near 0.25.
    A mouse's value is the mean of its two rows. Reproduced when the across-mouse mean step share
    is higher for rare than for frequent morph mice and test M12 (2.5 and 97.5 percentiles) finds
    the difference; the per-mouse shares are shown.
  depends_on:
  - fig3f-zscored-difference-at-025
- id: edf7-checkerboard-sessions
  statement: In six named rare morph sessions, trials near S-tilde = 0.25 randomly take one extreme
    representation or the other, seen as checkerboard bands in the sorted similarity matrices.
  source: Results, Population similarity analyses reveal distinct remapping patterns visible at the
    level of single trials, paragraph 1; Extended Data Fig. 7
  quote: checker-board dark bands were observed in the similarity matrices near S ~ = 0.25 , as if
    the matrix was missorted for R1 session 8, R2 session 13, R3 session 9, R4 session 11, R5 session
    8 and R6 session 10
  criterion: The paper shows this by eye only. Read with the paper's own measure of which extreme a
    trial resembles, the whole-trial SF (M9). Reproduced when, in each of the six sessions named,
    the S-tilde = 0.25 trials include at least one trial with SF above 0.5 and at least one below
    0.5. Session numbers follow the paper's numbering; how they map onto the dataset is the
    author's to show.
- id: fig3f-zscored-difference-at-025
  statement: After z-scoring within session, trial-by-trial population similarity differs
    significantly between rare and frequent morph mice for S-tilde = 0.25 trials.
  source: Results, Population similarity analyses reveal distinct remapping patterns visible at the
    level of single trials, paragraph 3; Figure 3c-f
  quote: As predicted, group differences in trial-by-trial similarity were significant for S ~ =
    0.25 trials after z -scoring within session similarity ( P < 0.05 two-sided mouse permutation
    test, n = 12 mice)
  statistics:
  - test: two-sided mouse permutation test
    p: 0.05
    p_relation: "<"
    n: 12 mice
  criterion: Methods, Population trial-by-trial similarity matrices. Per session 8 to N, C as in
    fig3ab-block-versus-gradual-similarity; binned into the five S-tilde values (code
    PlotPopSimMats) as means over off-diagonal entries; the 25 binned entries z-scored within the
    session (Methods; the 2026 code z-scores the mouse means, a variant); averaged over sessions per
    mouse; rare minus frequent across-mouse means; permutation test M12 at the 2.5 and 97.5
    percentiles of the 923 permuted differences. Reproduced when at least one entry of the S-tilde
