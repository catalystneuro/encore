    ~ = 0 place cells, 21% of cells S ~ = 1 place cells; frequent = 8,933 place cells across all S ~
    values, 30% of recorded population, 11% of cells S ~ = 0 place cells, 10% of cells S ~ = 1 place
    cells
  expected:
  - quantity: rare morph place cells, any S-tilde
    value: 15829
    tolerance: 1582.9
  - quantity: rare morph fraction place cells, any S-tilde
    value: 0.43
    tolerance: 0.043
  - quantity: rare morph fraction S-tilde = 0 place cells
    value: 0.23
    tolerance: 0.023
  - quantity: rare morph fraction S-tilde = 1 place cells
    value: 0.21
    tolerance: 0.021
  - quantity: frequent morph place cells, any S-tilde
    value: 8933
    tolerance: 893.3
  - quantity: frequent morph fraction place cells, any S-tilde
