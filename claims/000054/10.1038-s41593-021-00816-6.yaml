- id: edf4a-fewer-place-cells-frequent
  statement: A smaller proportion of recorded cells were place cells in the frequent morph than in
    the rare morph condition.
  source: Results, Prior experience of stimulus frequency determines CA1 place cell remapping,
    paragraph 1; Extended Data Fig. 4a
  quote: The proportion of recorded cells that were classified as place cells was smaller in the
    frequent morph compared to the rare morph condition
  criterion: The place cells of place-cell-fractions, under each of its readings. The paper reports
