# Claims for Plitt & Giocomo (2021), Nature Neuroscience 24, 705-714, on dandiset 000054.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-22,
# protocol pilot-10 as stated in docs/protocol.md (reader, steps 1 to 4).
#
# Text read: the NIH author manuscript in PubMed Central (PMC8893323, NIHMS1780011), full text
# with Results, Discussion, Methods, the main and Extended Data figure legends, and the
# supplementary information PDF (Supplementary Figs. 1 to 4, the simulations of earlier morph
# studies). It is the accepted manuscript, not the version of record. No main-text PDF was
# available, so no figure was read from an image; claims shown only in a figure are read from
# legends and Results. The Supplementary Video and the Reporting Summary were not read.
#
# Code read: https://github.com/GiocomoLab/PlittGiocomo_2021 (linked under Code availability),
# at two commits. dca5a57 (2020-10-28) is the last commit before publication; its analysis is in
# notebooks/*.ipynb (PlotAllPlaceCells, PlotPopSimMats, SFReg, DataLLR, NullModels4GrumpyPantsReviewer,
# SingleCellSimMats, SingleCellNMF, KWTA_EmpiricalPrior, TheoreticalSimMats) and morph_analyses/*.py;
# its main_figs and extended_data_figs notebooks are empty. 9230b0a (2026-04-16, HEAD) is a refactor
# under src/morph_analyses and notebooks/main_figs that reads the NWB files; its README says it holds
# data and cells not in the paper and that place cells were recomputed with an updated shuffle. Where
# the Methods are silent the 2020 code is followed and the 2026 code is named when it differs. Where
# the Methods and the code disagree, the Methods give the main reading and the code a variant.
#
# Data the paper used. 16 mice (9 male, 7 female) with GCaMP in dorsal CA1, head-fixed, running a
# 450 cm virtual linear track with a reward cue at a random place between 250 and 400 cm, licking for
# sugar water. Rare morph mice R1 to R6 and frequent morph mice F1 to F6 (n = 6 each); four more
# frequent morph mice FD1 to FD4 also had to report S above or below 0.5 by where they licked
# (Extended Data Fig. 10 only). On each trial a shared morph value S-tilde (0, 0.25, 0.5, 0.75 or 1)
# set the wall gratings, tower colours and background, each with its own uniform jitter in -0.1 to
# 0.1; the trial's morph value S is S-tilde plus the wall jitter (-0.1 to 1.1), and f_h, the
# horizontal wall frequency, is a monotonic function of S. Rare morph mice saw only S-tilde 0 and 1
# except during imaging on sessions 3 and 8 to N (half of imaged trials intermediate); frequent
# morph mice saw all five equally often in every session. One session per day; imaging on sessions
# 1, 3 and 8 to N, 60 to 120 imaged trials per session, two-photon at 15.46 Hz, 1 x 1 mm field,
# 161 to 3,657 Suite2P cells per session, analysed as deconvolved activity rate. Analyses use
# sessions 8 to N (24 rare morph and 21 frequent morph sessions, Fig. 3c,d; 45 in all), with
# session 3 in Extended Data Fig. 9. Measured variables are the activity of each cell, VR
# position, speed, licks, rewards (omitted on 20% of trials in some sessions), reward location,
# S-tilde and the three jitters. The dandiset description says rare morph mice are labelled RX,
# frequent morph FX and the decision mice FDX.
#
# Common method, used by the criteria below (cited as M1 to M12).
# M1 Sessions. Sessions 8 and later of each mouse (Results, Prior experience..., paragraph 1). The
#    paper counts 24 rare and 21 frequent sessions (Fig. 3c,d legend), but Fig. 4e says n = 19
#    frequent sessions; the 2020 code's own session sets hold 23 to 26 rare sessions, and its
#    Extended Data Fig. 4a test ran on 47 sessions (PlotAllPlaceCells, printed len 47). The 2026
#    code lists rare 25 and frequent 21 (mouse_metadata.py). The attempt uses every session 8 to N
#    the dataset holds and reports the counts.
# M2 Signal. The deconvolved activity rate of every cell (Methods, Two-photon imaging, "For all
#    analyses"). The 2020 code uses the raw Suite2P spks for the trial-matrix analyses (similarity,
#    SF, Q) and spks divided by each cell's 95th percentile for place cells; the 2026 code uses spks
#    divided by the 99th percentile (sess.py). Main reading raw deconvolved rate; the 2026
#    normalisation is a variant, shown for the population analyses (a per-cell scale changes
#    population cosine similarity, not spatial information).
# M3 Position bins. 10 cm bins from 0 to 450 cm, 45 bins (Methods, Place cell identification). Not
#    in the Methods, settled by the 2020 code (utilities.make_pos_bin_trial_matrices, speed_thr=2):
#    timepoints with speed below 2 cm/s are left out of the trial matrices. For place cells the code
#    is unclear (the 2020 call passes no speed but the arrays were masked in place before; the 2026
#    call uses none), so place-cell claims run both (a) speed below 2 cm/s excluded and (b) no
#    speed exclusion.
# M4 Trial groups. Trials are grouped by S-tilde; S (S-tilde plus wall jitter) and f_h are used for
#    the posterior analyses (Methods, Morphed environments).
# M5 Smoothing. Single-trial rate maps smoothed along position with a "20-cm (2-spatial bin)"
#    Gaussian (Methods, Single-cell and Place cell similarity matrices; the population matrix A is
#    built from these). Read as a Gaussian of s.d. 2 bins along position, as the code applies it for
#    the SF (utilities.similarity_fraction, gaussian_filter1d sigma 2). The 2020 code does not
#    smooth for Fig. 2e-h and Fig. 3 (variant).
# M6 Stimulus axis. f_h from S by the code's transform (UnityTransforms.py: frequency 2.5S +
#    3.5(1-S), angle 60S + 10(1-S) degrees, xfreq = |f 1500/120 (cos(a + pi/4) - sin(a + pi/4))|).
#    The code works in a rescaled unit wallmorphx, linear in f_h, 1 unit = 27.42 f_h, on a grid of
#    1000 points from -0.3 to 1.3 units (f_h 0.06 to 43.9); this grid is followed.
# M7 Priors. Per mouse, the normalised Gaussian-smoothed histogram of f_h of every trial the mouse
#    ran before session 8, imaged or not (Methods, Probabilistic inference; Fig. 1e "at the beginning
#    of session 8"). The kernel width is not in the Methods; the code uses exp(-d^2/0.1^2) in units
#    (s.d. 1.94 f_h). The group prior is the mean of the mouse priors, renormalised (Methods). Code
#    variants, shown and not deciding: the 2020 code keeps only the last mouse's prior
#    (first_prior_post, prior = _prior.mean(axis=0)); the 2026 code takes sessions within 8 calendar
#    days of the first (empirical_priors.py). The trials of sessions 1 to 7 and the non-imaged trials
#    of imaging days are needed; the paper says its data are in DANDI; the 2026 code downloads extra
#    VR data from figshare article 31974756 (notebooks/01_DOWNLOAD_DATASETS.ipynb, no version given).
#    Answer of 2026-10-22: that deposit is the authors' "Unprocessed VR data"
#    (doi:10.6084/m9.figshare.31974756.v1, published 2026-04-09, morph_vr_data.zip, one VR sqlite file
#    per session), described as "All virtual reality behavior for reproducing empirical prior
#    distributions over morph values". It is public and pinned, so the priors are built from it; its
#    mice are named by alias (e.g. 4139265.3), mapped to R1 to F6 in the 2026 code (mouse_metadata.py).
#    Claims that use the priors are `data: with_inputs`; claims that use nothing but the deposit are
#    `data: elsewhere`.
# M8 Likelihood and posterior. Gaussian centred at f_h with variance 8.23 (Methods); posterior
#    proportional to likelihood times group prior, normalised over f_h for each observed f_h; MAP is
#    its argmax. The code disagrees: it uses exp(-d^2/sigma^2) with sigma 0.3 units (8.23 f_h, s.d.
#    5.82 f_h; 2026 code, 2020 null models), and 0.4 units (s.d. 7.76 f_h) for the 2020 posteriors
#    behind Fig. 6. Main reading the Methods (s.d. 2.87 f_h); the two code widths are variants.
# M9 SF. Whole-trial SF from all cells of the session: the smoothed trial vector (positions x
#    cells), its cosine similarity to the mean S-tilde = 0 and S-tilde = 1 vectors, with the trial
#    left out of its own centroid; SF = cos1 / (cos0 + cos1) (Methods, Similarity fraction; code as
#    above). Position-wise SF uses one position bin (code rt_similarity_fraction, same smoothing).
# M10 Q. Per session, SF mapped affinely so that median SF of S-tilde = 0 trials goes to the mean MAP
#    of those trials (10.86 f_h, mean of 11.08 and 10.64) and of S-tilde = 1 trials to 37.715 f_h
#    (mean of 38.13 and 37.30) (Methods); clipped to the grid (code). Q is the sum over trials of a
#    2D Gaussian at (f-hat_h, transformed SF), normalised over f_h for each f-hat_h; width not in the
#    Methods, the code uses exp(-d^2/0.1^2) in units on both axes (SFReg; similarity_fraction.py).
# M11 Delta D_KL. Mean over f-hat_h of D_KL(P_rare || Q) - D_KL(P_freq || Q) (Methods), over grid
#    rows with f-hat_h from 0.1 to 1.1 units (11.0 to 38.5 f_h) and in bits, as in the code. A grid
#    point where Q is zero and P is not is left out (a standard choice; it is reported).
# M12 Mouse permutation test. Per-mouse value (mean over sessions), difference of the rare and
#    frequent across-mouse means, against the same difference for every one of the 923 other ways
#    to assign 6 of the 12 mice to each group (Methods, Place cell similarity matrices). "P < 0.0011"
#    is read as the observed difference lying outside the range of all 923 (the code's min and max);
#    "P < 0.05, two-sided" as outside their 2.5 to 97.5 percentiles (code).
schema_version: 2
