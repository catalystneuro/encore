- id: fig4-sf-stable-along-track
  statement: Position-wise SF shows stable clustered representations along the whole track in rare
    morph mice and a spectrum in frequent morph mice; remapping happens soon after the trial starts
    and stays as the mouse runs.
  source: Results, CA1 representations show stable discrimination of morph values along the length
    of the track, paragraphs 1 and 2; Figure 4b-e
  quote: Plotting SF as a function of the position of the animal along the VR track revealed a
    clustering of stable representations across the entire length of the track for the rare morph
    condition ... Together, these results indicate that remapping rapidly occurred after the start of
    a new trial and remained stable as the animal traversed the virtual track.
  criterion: Position-wise SF (M9) for every trial of sessions 8 to N, averaged per S-tilde within
    session, then over sessions per mouse, then across mice with s.e.m. (Fig. 4d,e legends). The
    paper reads the curves by eye. Read as reproduced when (1) in both conditions the mean SF of
    S-tilde = 0 and of S-tilde = 1 differ by more than the sum of their s.e.m. in every bin after the
    first bin; (2) in rare morph mice the S-tilde 0.75 and 1.0 curves overlap within s.e.m. over
    most bins (Fig. 4d legend) while the S-tilde 0.25 curve stays nearer the S-tilde 0 than the
    S-tilde 1 curve; (3) in frequent morph mice the S-tilde 0.25 curve lies between the S-tilde 0
    and 0.5 curves over most bins.
- id: fig6a-dkl-sign
  statement: Delta D_KL of each session's Q estimate took the expected sign (negative for rare,
    positive for frequent) in 41 of 45 sessions and in every session of 9 of 12 mice; across mice,
    rare -0.88 +- 0.23 and frequent 0.50 +- 0.11 (mean +- s.e.m.), a significant difference.
  source: Results, CA1 population activity approximates optimal estimation of the stimulus,
    paragraph 2; Figure 6a
  quote: "This Δ D KL measure took the expected sign (rare sessions Δ D KL < 0 and frequent sessions
    Δ D KL > 0) in 41 out of 45 sessions, and it took the expected sign in every session from 9 out of
    12 mice (across animal mean±s.e.m.: rare Δ D KL = −0.88 ± 0.23, frequent Δ D KL = 0.50±0.11; P
    <0.0011, two-sided animal permutation test, n = 12 mice)"
  statistics:
  - test: two-sided animal permutation test
    p: 0.0011
    p_relation: "<"
    n: 12 mice
  expected:
  - quantity: sessions with the expected sign
    value: 41
    tolerance: 4.1
  - quantity: mice with the expected sign in every session
    value: 9
    tolerance: 0.9
  - quantity: rare morph across-mouse mean Delta D_KL
    value: -0.88
    tolerance: 0.23
  - quantity: frequent morph across-mouse mean Delta D_KL
    value: 0.50
    tolerance: 0.11
  data: with_inputs
  criterion: Per session 8 to N, SF (M9), Q (M10) and Delta D_KL (M11) against the ideal rare and
