- id: replication-sample
  statement: In an independent sample of 20 adults, reverse correlation finds 7 ToM and 9 pain events,
    all of them also found in the main adult sample; P08, P09 and P11 are not replicated.
  source: Supplementary Figure 6; Methods, fMRI data analysis, paragraph 3
  quote: Seven ToM and nine pain events were identified in the reverse correlation analysis of this
    independent sample of adults
  data: elsewhere
  where: Not deposited. The paper names no archive for the 20 adults scanned by Evelina Fedorenko and
    colleagues.
  criterion: Not testable on this dataset, which holds the paper's 155 participants only.
- id: hand-coded-events
  statement: Of the adult reverse-correlation events, 6 of 7 ToM events but only 2 of 12 pain events
    fall at least partly within the mental, social or pain events hand-coded in an earlier study.
  source: Supplementary Figure 7
  quote: most ToM events identified by the reverse correlation analysis were at least partially included
    in the original coding (6/7 ToM events labeled as Mental or Social), only two of twelve pain events
    were included in the coding
  expected:
  - quantity: ToM events in the hand coding
    value: 6
    tolerance: 0
  - quantity: pain events in the hand coding
    value: 2
    tolerance: 0
  data: with_inputs
  depends_on:
  - rc-events
  criterion: The hand-coded events are those of Jacoby et al. 2016 (NeuroImage 126, 39-48), an outside
    input. An event counts as included when any of its TRs falls in a coded event. For ToM, coded
    Mental or Social events; for pain, the paper says "included in the coding", read as (a) coded
    Pain events, (b) any coded event. Reproduced when both counts match under one reading.
