# Claims for Richardson, Lisandrelli, Riobueno-Naylor & Saxe (2018), "Development of the social
# brain from age three to twelve years", Nature Communications 9, 1027,
# doi:10.1038/s41467-018-03399-2, on OpenNeuro dataset ds000228 ("MRI data of 3-12 year old children
# and adults during viewing of a short animated film"), snapshot 1.1.1
# (doi:10.18112/openneuro.ds000228.v1.1.1).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-10-28,
# protocol pilot-12 as stated in docs/protocol.md (Reader).
#
# Text read: the version of record (Nature Communications, open access, CC BY 4.0) as supplied
# under paper/ (text extracted from the PDF), with the main text, figure legends, Methods and the
# Supplementary Information (Supplementary Figures 1 to 8, Tables 1 to 4, Note 1). The four
# supplementary tables are images in the supplement PDF and are missing from the text; they were
# read from the PDF (pages 10 to 13), and their numbers are used below. The Peer Review File was
# not supplied and is not needed.
# Code: none linked. Code availability says the analysis code "is available from the
# corresponding author upon request", so no repository was read and no open detail is settled by
# code. The ToM behavioral battery is on OSF (https://osf.io/G5ZPV/, doi:10.17605/OSF.IO/G5ZPV).
#
# Data the paper used (Methods, Participants and fMRI sections; Supplementary Table 1).
# - 122 children aged 3.5 to 12 years (M 6.7, s.d. 2.3; 64 female) and 33 adults aged 18 to 39
#   (M 24.8, s.d. 5.3; 20 female). Age groups used in figures: 3yo n = 17, 4yo n = 14, 5yo n = 34,
#   7yo n = 23, 8-12yo n = 34, adults n = 33. Age is a continuous variable in all tests.
# - One fMRI run per participant (the first run; children under five did two, only the first is
#   analysed): silent viewing of Pixar's "Partly Cloudy" (5.6 min), preceded by 10 s of rest,
#   168 volumes, TR 2 s, TE 30 ms, 32 near-axial slices, voxel size 3 or 3.13 mm with slice gaps
#   that differ between participants (Methods, fMRI data acquisition), plus a T1 image (1 mm).
#   TRs 1 to 10 are rest and opening logos; the movie proper starts at TR 11.
# - Behavior (children only): ToM score, the proportion correct of 24 matched items of the
#   explicit ToM battery; for the 65 children aged 3 to 5, a false-belief (FB) composite of six
#   items giving passers (5-6 correct, n = 30), inconsistent performers (3-4, n = 20) and failers
#   (0-2, n = 15); DCCS summary score (3- to 5-year-olds analysed, n = 64, one inconsistent
#   performer missing); nonverbal IQ (WPPSI block design under 5, KBIT-2 matrices from 5).
# - Motion: the number of artifact timepoints per run (ART toolbox), used as the motion covariate
#   in every analysis.
#
# Shared pipeline, with its source (Methods, fMRI data analysis, paragraphs 1 to 6, unless noted).
# P1 SPM8; functional images registered to the run's first image, that image to the participant's
#    anatomical image, the anatomical image normalized to MNI; upsampled to 2 mm isotropic voxels;
#    5 mm Gaussian smoothing.
# P2 Artifact timepoints (ART): composite motion > 2 mm relative to the previous timepoint, or a
#    global-signal change beyond 3 s.d. from the mean global signal. Participants with one third
#    or more artifact timepoints were dropped (5 children).
# P3 Group ROIs: 9 mm spheres around the peaks of Supplementary Table 2. ToM: RTPJ [48 -60 30],
#    LTPJ [-48 -62 30], PC [0 -54 34], DMPFC [-6 54 36], MMPFC [-4 58 16], VMPFC [-4 56 -16].
#    Pain: RS2 [60 -28 38], LS2 [-62 -32 34], RInsula [42 6 -6], LInsula [-42 -2 -4],
#    RMFG [50 42 12], LMFG [-46 36 14], AMCC [0 2 42] (DAMCC in Fig. 2). Sizes in voxels: 376, 368,
#    382, 217, 275, 198; 368, 269, 309, 240, 142, 256, 249. Face: RFFA [38 -42 -22] (1019),
#    LFFA [-40 -52 -18] (531), group-constrained parcels (Supplementary Fig. 4a). M1 10 mm spheres
#    at [38 -24 58] and [-38 -20 58]; V1 at [-10 -86 2] and [10 -86 2] (Methods and Supplementary
#    Fig. 3).
# P4 Per voxel in each ROI: nearest-neighbour interpolation over artifact timepoints; regression of
#    nuisance covariates, (1) the artifact timepoints and (2) five CompCor principal components from
#    the participant's white-matter mask eroded by two voxels, computed on the interpolated data;
#    for the inter-region correlation (IRC) analyses only, also the raw bilateral M1 timecourse;
#    high-pass filter at 100 s; average over the ROI's voxels; artifact timepoints set to NaN.
# P5 IRC: each ROI timecourse correlated with every other, per participant, Fisher z-transformed.
#    Within-ToM is the mean over ToM ROI pairs, within-Pain over Pain ROI pairs, across-network
#    over all ToM-Pain pairs (Methods, paragraph 7).
# P6 Network timecourse for reverse correlation and functional maturity: each ROI timecourse
#    z-normalized, then averaged over the ROIs of the network (Methods, paragraph 9). Functional
#    maturity uses the same timecourses before z-normalization, TRs 11 to 168 (paragraph 13).
# P7 Reverse correlation: in adults, per timepoint from TR 11 on, a one-tailed t-test of the
#    network values against 0; an event is two or more consecutive significantly positive
#    timepoints; events ranked by the adult mean at their peak timepoint (T01, P01 highest).
# P8 Event response magnitude in children: the child's value at the event's peak timepoint, the
#    timepoint with the highest adult mean (Methods, paragraph 11). Peak TRs (Supplementary
#    Table 3): T01 131, T02 96, T03 46, T04 150, T05 54, T06 124, T07 64; P01 118, P02 73, P03 111,
#    P04 39, P05 56, P06 135, P07 160, P08 29, P09 143, P10 49, P11 84, P12 100. Durations (s):
#    T01 10, T02 16, T03 6, T04 14, T05 8, T06 10, T07 4; P01 10, P02 18, P03 12, P04 6, P05 6,
#    P06 10, P07 4, P08 to P12 4 each.
# P9 Motion covariate: number of artifact timepoints. Partial correlations with motion as covariate
#    are Spearman, except IRC against ToM score, which is Kendall; each claim names its test.
#    Regressions are ordinary linear regressions.
#
# Details none of the paper's sources fixes, with the readings named. Each criterion that rests on
# one refers to it by its label.
# O1 ROI extent. Supplementary Table 2 gives sizes of 142 to 382 voxels, while a full 9 mm sphere
#    at 2 mm voxels holds about 380, so some spheres were cut down in a way the paper does not
#    state. Readings: (a) ROI masks deposited with the paper's data, where they match these sizes;
#    (b) full 9 mm spheres around the Supplementary Table 2 centers; (c) those spheres restricted
#    to voxels with data in each participant.
# O2 Artifact regressors. "motion artifact timepoints" as nuisance covariates is read as one
#    indicator regressor per artifact timepoint (a); (b) a single regressor marking all of them.
#    ART's composite-motion measure is used with its default definition, a standard choice.
# O3 TRs in the IRC analysis: (a) all 168; (b) TRs 11 to 168, as in the other timecourse analyses.
# O4 Scale of regression coefficients. The b values are on a scale the paper does not state; the
#    adult-child effect of b = -.97 on within-ToM correlation is about one s.d., so (a) outcome and
#    continuous predictors z-scored; (b) raw units. Criteria judge regressions on t, p and sign,
#    which do not depend on the scale, and report b under both readings.
# O5 Reverse-correlation threshold. The alpha of the per-timepoint one-tailed t-test is not given.
#    Readings: (a) p < .05 uncorrected; (b) p < .01 uncorrected; (c) p < .05 FDR-corrected over
#    the 158 timepoints. The reading whose events best match Supplementary Table 3 is reported.
# O6 Span of z-normalization (P6): (a) TRs 11 to 168; (b) all 168 TRs. Artifact timepoints (NaN)
#    are left out of the mean and s.d.
# O7 Child event magnitude (P8) taken from (a) the z-normalized network timecourse used in the
#    reverse correlation, (b) the same timecourse before z-normalization.
# O8 Partial Kendall tau: computed as the partial rank correlation of Kendall (the formula used
#    by R's ppcor), a standard choice; its p-value from the normal approximation.
# O9 Tukey HSD differences in the behavioral results (e.g. Pass-Fail diff = 1.2 for ToM, against
#    a mean difference of .20) are on a standardized scale: (a) the scores z-scored over the 65
#    children aged 3 to 5; (b) raw scores. The tests are judged on p, and diffs reported for both.
#
# Tolerances. Means given with an s.e. use the s.e. as tolerance (the paper's uncertainty for a
# mean); other reported numbers use 10% of the value. Counts of participants use 0, as they are
# counts of the same people. Rule S, used by many criteria: a claim is reproduced when every
# expected value is within tolerance and every test listed under statistics gives the same sign
# and meets the paper's p bound (for an exact p, the same side of .05, or of the corrected alpha
# the claim gives, as the paper's); partially reproduced when the tests hold but some value is out of
# tolerance; not reproduced when a test fails or its sign is reversed.
#
# Outside data the paper relies on: the independent adult sample (n = 20, scanned by Evelina
# Fedorenko and colleagues) that defined the group ROIs and replicated the events (not deposited;
# only the ROI centers are given); the face and scene group-constrained parcels of Julian et al.
# 2012 (http://web.mit.edu/bcs/nklab/GSS.shtml); the hand-coded "mental", "social" and "pain"
# events of Jacoby et al. 2016 (NeuroImage 126, 39-48); Neurosynth for the M1 and V1 centers
# (coordinates given).
