  source: Results, Reverse correlation analysis, paragraph 3; Figure 3c; Methods, fMRI data analysis,
    paragraph 11
  quote: Response magnitude during ToM events did not differ significantly between children who pass
    and fail explicit falsebelief tasks
  statistics:
  - test: linear regressions of response magnitude on FB-Group, age and motion
    p: 0.08
    p_relation: '>'
    n: Pass 30, Fail 15
  depends_on:
  - rc-events
  - beh-fb-groups
  criterion: A claim of absence, judged on the paper's tests at p < .05, one linear regression per ToM
    event, and for T03 a permutation test of the group effect (Methods, paragraph 11, R lmPerm).
    Reproduced when no event shows a significant FB-group effect; not reproduced when any does.
- id: rc-3yo-events
  statement: Reverse correlation on the 3-year-olds alone finds 4 of the 12 adult pain events and 1 of
    the 7 adult ToM events; of its 32 s of pain events 14 s fall in adult pain events and 8 s in
    adult ToM event T04, and of its 8 s of ToM events 4 s fall in an adult ToM event and 4 s in
    adult pain event P01.
  source: Results, Reverse correlation analysis, paragraphs 4 and 5; Figure 4a (dark borders)
  quote: 'identified 4 of the 12 pain events and 1 of the 7 ToM events discovered in the ... adult
    sample. These events correspond to a subset of the timepoints that were identified as ToM or pain
    events in 3 year olds (Pain: 14/32 s, ToM: 4/8 s)'
  expected:
  - quantity: 3yo pain event time
    value: 32
    tolerance: 3.2
    unit: s
  - quantity: 3yo ToM event time
    value: 8
    tolerance: 0.8
    unit: s
  - quantity: adult pain events found in 3yo
    value: 4
    tolerance: 0
  - quantity: adult ToM events found in 3yo
    value: 1
    tolerance: 0
  depends_on:
  - rc-events
  criterion: P7 run on the 17 three-year-olds with the reading of O5 and O6 that reproduced rc-events.
    Reproduced when the counts and times match and the 3yo pain events overlap T04 and the 3yo ToM
    events overlap P01; partially reproduced when the cross-network overlaps (T04 in the pain
    network, P01 in the ToM network) hold but counts or times differ.
- id: maturity-across
  statement: Among children, the maturity (correlation with the adult mean) of each network's
    timecourse is predicted by stronger across-network anti-correlation, not by within-network
    correlation, with age and motion in the model.
  source: Results, Relating functional maturity to inter-region correlations, paragraph 1; Figure 5
  quote: We found that the maturity of the movie-driven timecourse in both ToM and Pain networks was
    predicted by the anti-correlation of regions across networks
  statistics:
  - about: ToM maturity, across-network effect
    test: linear regression on across-network, within-network correlation, age and motion
    statistic: b = -.4, t = -5.5
    p: 2.2e-7
    n: 122 children
  - about: ToM maturity, within-ToM effect
    test: same regression
    statistic: b = .1, t = 1.5
    p: 0.14
  - about: Pain maturity, across-network effect
    test: linear regression on across-network, within-network correlation, age and motion
    statistic: b = -.51, t = -7.4
    p: 2.8e-11
    n: 122 children
  - about: Pain maturity, within-Pain effect
    test: same regression
    statistic: b = .13, t = 1.9
    p: 0.06
  expected:
  - quantity: t, across-network effect on ToM maturity
    value: -5.5
    tolerance: 0.55
  - quantity: t, across-network effect on Pain maturity
    value: -7.4
    tolerance: 0.74
  depends_on:
  - irc-age-within
  criterion: Maturity is the Pearson r of each child's P6 network timecourse (not z-normalized, TRs 11
    to 168, artifact timepoints left out) with the mean adult timecourse; IRC measures as
    irc-age-within. Rule S on the across-network effects, with the within-network effects not
    significant at p < .05 (as in the paper); b reported under both scales of O4.
- id: maturity-within
  statement: Among children, within-network correlations are associated with age but not with timecourse
    maturity.
  source: Results, Relating functional maturity to inter-region correlations, paragraph 2
  quote: Greater within-network correlations were strongly associated with age, but not with timecourse
    maturity
  statistics:
  - about: within-ToM, maturity effect
    test: linear regression of within-network correlation on maturity, age and motion
    statistic: b = .05, t = .48
    p: 0.63
  - about: within-ToM, age effect
    test: same regression
    statistic: b = .3, t = 2.5
    p: 0.01
  - about: within-Pain, maturity effect
    test: linear regression of within-network correlation on maturity, age and motion
    statistic: b = .07, t = .61
    p: 0.55
  - about: within-Pain, age effect
    test: same regression
    statistic: b = .2, t = 1.96
    p: 0.05
  depends_on:
  - maturity-across
  criterion: A claim of absence for the maturity effects, judged on the paper's regressions at p <
    .05; reproduced when neither maturity effect is significant, not reproduced when either is. The
    age effects are reported (ToM p = .01, Pain marginal p = .05) and do not decide the outcome.
- id: maturity-tom-behavior
  statement: ToM timecourse maturity correlates with ToM score controlling for motion, but not once age
    is added.
  source: Results, Relating functional maturity to inter-region correlations, paragraph 2
  quote: while having an adult-like ToM timecourse was positively correlated with ToM behavior ... this
    relationship did not remain significant in a regression including age as an additional predictor
  statistics:
  - about: maturity against ToM score
    test: spearman partial correlation test, motion as covariate
    statistic: rs(119) = .54
    p: 1.3e-10
    n: 122 children
  - about: ToM score effect with age
    test: linear regression of ToM maturity on age, ToM score and motion
    statistic: b = .1, t = 1.2
    p: 0.3
  - about: age effect
    test: same regression
    statistic: b = .5, t = 4.2
    p: 0.00005
    p_relation: <
  expected:
    quantity: partial Spearman r, ToM maturity against ToM score
    value: 0.54
    tolerance: 0.054
  depends_on:
  - maturity-across
  criterion: Reproduced when the partial correlation is within tolerance with p < .05, and in the
    regression the ToM score effect is not significant (p >= .05) while age is.
- id: maturity-fb
  statement: ToM timecourse maturity does not differ between false-belief passers and failers.
  source: Results, Relating functional maturity to inter-region correlations, paragraph 2
  quote: Functional maturity of the ToM timecourse did not differ based on explicit false-belief task
    performance
  statistics:
  - test: linear regression, effect of FB-Group (pass vs. fail) with age and motion
    statistic: b = -.12, t = -.35
    p: 0.73
    n: Pass 30, Fail 15
  depends_on:
  - maturity-across
  - beh-fb-groups
  criterion: A claim of absence, judged on the paper's regression at p < .05. Reproduced when the
    FB-group effect is not significant; not reproduced when it is.
- id: face-rc
  statement: In bilateral fusiform face regions, the children's mean timecourse correlates with the
    adults' (r .86; 3-year-olds .72), reverse correlation in adults finds 7 face events (88 s) and in
    3-year-olds 4 events (18 s), and face-event responses do not change with age.
  source: Supplementary Figure 4; Results, Reverse correlation analysis, paragraph 1
  quote: 'The average timecourse in bilateral fusiform ROIs in children was highly correlated with that
    of adults (pearson correlation: r=.86, p<1.0x10-47)'
  statistics:
  - about: children against adults
    test: pearson correlation
    statistic: r = .86
    p: 1.0e-47
    p_relation: <
  - about: 3-year-olds against adults
    test: pearson correlation
    statistic: r = .72
    p: 1.0e-26
    p_relation: <
  - about: age effect on face-event magnitudes
    test: spearman partial correlation including motion as covariate
    statistic: '|r|s < .24'
    p: 0.01
    p_relation: '>'
    corrected: Bonferroni, alpha .0071 for 7 events
  expected:
  - quantity: r, children against adults
    value: 0.86
    tolerance: 0.086
  - quantity: r, 3yo against adults
    value: 0.72
    tolerance: 0.072
  - quantity: adult face events
    value: 7
    tolerance: 0
  - quantity: adult face event time
    value: 88
    tolerance: 8.8
    unit: s
  - quantity: 3yo face event time
    value: 18
    tolerance: 1.8
    unit: s
  - quantity: 3yo face events
    value: 4
    tolerance: 0
  data: with_inputs
  criterion: Fusiform ROIs are the group-constrained face parcels of Julian et al. 2012 (outside input;
    RFFA 1019 and LFFA 531 voxels, Supplementary Table 2), timecourses as P4 and P6, reverse
    correlation as P7 with readings O5 and O6. Face events in adults have durations of 16, 4, 5, 7,
    4, 4 and 4 TRs (Supplementary Note 1). The age test is absence at the paper's alpha .0071.
    Reproduced when the two r values and event counts and times are within tolerance and no face
    event changes with age; partially reproduced when the correlations hold but events differ.
- id: face-overlap
  statement: The overlap of face events with ToM events (4 TRs) and with pain events (15 TRs) does not
    differ from chance.
  source: Supplementary Note 1
  quote: Thus, the amount of overlap between face and ToM events, and face and pain events, did not
    differ from that expected by chance
  statistics:
  - about: face and ToM
    test: permutation test, 1000 permutations
    statistic: 111/1000
    p: 0.11
  - about: face and pain
    test: permutation test, 1000 permutations
    statistic: 928/1000
    p: 0.93
  data: with_inputs
  depends_on:
  - face-rc
  - rc-overlap
  criterion: Permutation as rc-overlap, with the face events of face-rc. A claim of absence judged at
    p < .05 for fewer overlaps than chance, as in the paper; reproduced when neither p is below .05.
