- id: fig5e-adcd-av-unchanged
  statement: Selective inhibition of VP cholinergic neurons activated by the AV odor does not change
    avoidance of it, nor locomotion.
  source: Figure 5D and 5E; Figure S10 (not in the text read); Results, Selective inhibition,
    paragraph 2
  quote: "In sharp contrast to the dramatic effects of silencing APP-odor-activated VP cholinergic neurons, mice with ADCD-hM4Di silencing of VP cholinergic neurons previously activated by exposure to the AV odor had no effect ( Figures 5D [right] and 5E ). These results underscore our findings using hM4Di for non-selective inhibition of VP cholinergic neurons ( Figure 2 ) and were devoid of any changes in locomotor activity ( Figure S10 )."
