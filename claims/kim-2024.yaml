  quote: "In these mice, ~80% of VP cholinergic neurons activated on day 1 were reactivated on day 2 ( Figures S9A and S9B ). ... In these mice, ~70% of day-1-activated VP cholinergic neurons were reactivated ( Figures S9C and S9D )."
  expected:
  - quantity: day-1 activated VP cholinergic neurons reactivated, APP then second APP odor
    value: 80
    tolerance: 8
    unit: percent
  - quantity: day-1 activated VP cholinergic neurons reactivated, AV then second AV odor
    value: 70
    tolerance: 7
    unit: percent
  criterion: Percentage is ChAT+ ADCD+ cFos+ over ChAT+ ADCD+. Whether it is pooled over mice or the
