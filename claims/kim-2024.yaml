- id: figs11-intermingled
  statement: APP- and AV-odor-activated VP cholinergic neurons are spatially intermingled within the
    VP from bregma +0.62 to +0.14.
  source: Figure S11 (not in the text read); Results, APP- vs. AV-odor-activated VP cholinergic
    neurons are intermingled, paragraph 1
  quote: "Across the targeted regions (bregma +0.62 to +0.14), we found that these differentially activated subgroups of VP cholinergic neurons are spatially intermingled within the VP ( Figure S11 )."
  criterion: Shown as a map with no test. Reproduced when cells of both groups occupy overlapping
    positions on each mapped section, with no section or VP subregion holding one group alone.
- id: fig6f-max-firing-rate
  statement: APP- and AV-odor-activated VP cholinergic neurons both have a higher maximum firing rate
    than home-cage VP cholinergic neurons.
  source: Figure 6F; Results, APP- vs. AV-odor-activated VP cholinergic neurons, paragraph 2
  quote: "Both APP and AV VP cholinergic neurons displayed a greater rate of maximum firing ( F (2, 38) = 10.71, pairwise comparisons: ALL vs. APP t (31) = 5.36, p < 0.01; ALL vs. AV t (27) = 2.80, p < 0.05; Figure 6F ) and sag potential ( Figure S12A )."
  statistics:
  - about: ALL against APP (the ANOVA, F(2, 38) = 10.71, is printed without a p-value)
    test: pairwise comparison after one-way ANOVA
    statistic: t(31) = 5.36
    p: 0.01
    p_relation: "<"
    n: 21 ALL cells from 8 mice, 12 APP cells from 6 mice
  - about: ALL against AV
    test: pairwise comparison after one-way ANOVA
    statistic: t(27) = 2.80
    p: 0.05
    p_relation: "<"
    n: 21 ALL cells from 8 mice, 8 AV cells from 4 mice
  criterion: Max firing rate as defined in the opening comment (Methods item 16; spike detection from
    the code v1.0.0). Cells are those of Figure 6 (APP 12, AV 8, ALL 21, compared with the dataset's
    counts); the Methods' exclusion rules (series resistance over 25 MOhm, input resistance under
    50 MOhm, resting potential above -50 mV, or a change of more than 20% in any of these) are
    applied, and any rule the data do not allow to be checked is named. The test is open between
    two readings, both run; when they disagree the claim is blocked as methods_underspecified. (a) Cell-level one-way ANOVA over the three groups (df
    2, 38) and uncorrected two-tailed unpaired t-tests for each pair (df 31 and 27, as reported). (b)
    The nested ANOVA the Methods name, cells nested in mice nested in group. Reproduced when both
    pairwise comparisons give p < 0.05 with APP and AV above ALL; the F is compared with 10.71 and
    the t values with 5.36 and 2.80, without deciding the outcome.
- id: figs12a-sag-higher
  statement: APP- and AV-odor-activated VP cholinergic neurons both have a larger sag potential than
    home-cage VP cholinergic neurons.
  source: Figure S12A (not in the text read); Results, APP- vs. AV-odor-activated VP cholinergic
    neurons, paragraph 2
  quote: "Both APP and AV VP cholinergic neurons displayed a greater rate of maximum firing ... and sag potential ( Figure S12A )."
  criterion: Sag as defined in the opening comment (Methods item 2, with the code's smoothing and
    windows). The test in Figure S12A is not in the text read; the two readings of
    fig6f-max-firing-rate are used. Reproduced when APP and AV each exceed ALL at p < 0.05.
- id: figs12-other-features-shared
  statement: Most other passive and active electrophysiological features do not differ between
    home-cage and odor-activated VP cholinergic neurons.
  source: Figure S12 (not in the text read); Results, APP- vs. AV-odor-activated VP cholinergic
    neurons, paragraph 2
  quote: "Most other passive and active features were shared by control and odor-sensitive VP cholinergic neurons ( Figure S12 )."
  criterion: A claim of absence over the eighteen features of the Methods, less the four the paper
    reports as different (max firing rate, sag, membrane potential, AHP amplitude). Each feature is
    tested by the one-way ANOVA over the three groups at alpha 0.05 (reading (a) of
    fig6f-max-firing-rate, the test whose df the paper reports). Which features Figure S12 shows is
    not known here. Reproduced when more than half of the fourteen remaining features show no
    difference (this file's reading of "most"); list every feature with its effect and p.
- id: fig6g-av-more-hyperpolarized
  statement: AV-odor-activated VP cholinergic neurons have a more hyperpolarized membrane potential
    than APP-odor-activated ones.
  source: Figure 6C and 6G; Results, APP- vs. AV-odor-activated VP cholinergic neurons, paragraph 3
  quote: "Specifically, AV-odor-activated VP cholinergic neurons were slightly more hyperpolarized than APP-odor-activated VP cholinergic neurons ( F (2, 38) = 11.39, p < 0.001; pairwise comparisons: APP vs. AV t (18) = 2.72, p < 0.05; Figures 6C and 6G )."
  statistics:
  - about: ALL, APP and AV
    test: one-way ANOVA
    statistic: F(2, 38) = 11.39
    p: 0.001
    p_relation: "<"
    n: 41 cells (21 ALL, 12 APP, 8 AV)
  - about: APP against AV
    test: pairwise comparison
    statistic: t(18) = 2.72
    p: 0.05
    p_relation: "<"
    n: 12 APP cells from 6 mice, 8 AV cells from 4 mice
  criterion: Membrane potential with the two readings in the opening comment ((a) the code's
    baselineVm, (b) a segment with no injected current), crossed with the two test readings of
    fig6f-max-firing-rate. Reproduced when the ANOVA gives p < 0.05 and the APP against AV
    comparison gives p < 0.05 with AV more negative under every reading run; partially reproduced
