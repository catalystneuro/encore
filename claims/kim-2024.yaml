# Claims for Kim, Ananth, Desai, Role & Talmage (2024), Cell Rep 43(4) 114009, on dandiset 001544.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21, under
# docs/protocol.md (version pilot-10), Reader section.
#
# Text read. The NIH author manuscript as served by PMC (PMC11080946, NIHMS1988691), in
# paper/10.1016-j.celrep.2024.114009.txt: Summary, Introduction, Results, Discussion, STAR Methods,
# the Key Resources Table and the legends of Figures 1 to 7. No PDF was supplied. The supplemental
# information (Figures S1 to S14 and their legends) is not in the text read. The main findings rest
# on the main figures and the Methods, which are present; claims that cite a supplementary figure
# rest on the sentence of the Results that cites it, and no number, test or n from those figures is
# known here. No figure was read, so no group mean or spread is known for any panel.
#
# Code read.
# - Electrophysiology. https://github.com/nsdesai/patch_clamp_analysis, at tag v1.0.0 (commit
#   4ee1125), the version archived as Zenodo 10.5281/zenodo.10723870 and cited in the Key Resources
#   Table; the GitHub head (commit 5d756c2, April 2025, after publication) was also read. MATLAB
#   feature extraction from current-step sweeps (analysis_of_neurophysiology_data.m and the functions
#   it calls). It holds no statistics; the Methods say tests were run in Prism 9 or SigmaPlot 14.
#   v1.0.0 and the head differ in spike detection (a peak above -10 mV with width under 10 ms in
#   v1.0.0, above 0 mV with width under 5 ms in the head) and in input resistance (v1.0.0 takes the
#   -20 pA step, as the Methods say; the head fits steps from -50 to 0 pA). v1.0.0 is followed here.
# - Fiber photometry. https://github.com/rokim01/Fiber-Photometry-analysis at commit 49dcfd4 (tag
#   1_updated; the Zenodo record 10.5281/zenodo.10723901 cites a tag "1" that no longer exists on
#   GitHub, made the same day). One MATLAB script, FP_analysis. It deinterleaves channels, fits a
#   biexponential to a channel and divides the signal by the robust-scaled fit (its final section
#   normalizes the signal "to itself", not to the isosbestic channel as the Methods say), averages
#   20 Hz frames into 5 Hz bins and z-scores the whole session. AUC was taken in Prism; the script
#   holds no epochs and no statistics.
#
# Data the paper used (8 to 12 week old male and female mice).
# - Odor preference in a Y-maze (10 min, odor arm against saline arm; EthoVision time per arm), with
#   cFos and ChAT immunohistochemistry of the VP about 45 min later (SAL n = 8, APP n = 9, AV n = 8
#   mice). APP odor 2-phenylethanol, AV odor mountain lion urine; peanut butter oil and peppermint
#   oil as second APP and AV odors.
# - Fiber photometry of VP cholinergic neurons (Chat-Cre, GCaMP6f; n = 7 mice), three 10 s odor
#   deliveries every 3 min in a 10 min session, one odor per day.
# - Chemogenetic inhibition (hM4Di in Chat-Cre, clozapine 0.1 mg/kg) and ADCD-hM4Di inhibition of
#   previously activated neurons (Chat-Cre x Fos-tTA/GFP) during the preference test.
# - ADCD (day 1) and cFos-GFP (day 2) labeling of activated and reactivated VP cholinergic neurons,
#   counted in Imaris over 4 to 6 slices per mouse; a RAM replication in C57 mice; Fast Blue
#   retrograde labeling from the BLA.
# - Whole-cell current clamp in acute slices at about 31 C: FLEX-RAM-labeled APP-odor-activated
#   neurons (12 cells from 6 mice), AV-odor-activated neurons (8 cells from 4 mice), recorded 3 to
#   21 days after odor exposure, and home-cage Chat-tau-eGFP neurons ("ALL", 21 cells from 8 mice).
#   Neurons held at -65 mV by DC injection; 500 ms current steps from -60 to 200 pA, 10 s apart;
#   chirp currents of 0.5 to 12 Hz. Neurobiotin fills were reconstructed in Imaris for morphology
#   (convex hull, dendrite area and volume, Sholl analysis).
# Dandiset 001544 is described on the archive as "The electrophysiological data included in Kim et
# al." (current clamp, NWB). It is meant to hold the patch-clamp data of Figure 6 and Figure S12;
# whether it holds anything else is for the author to find.
#
# Electrophysiological features (STAR Methods, Quantification and statistical analysis, items 1 to
# 18), with the code v1.0.0 where the Methods are silent. Common to all: the first 500 ms of each step
# is analysed; a spike is a peak above -10 mV with prominence at least 30 mV, width under 10 ms and at
# least 5 ms from the previous peak (code; the head of the repository uses 0 mV and 5 ms, a variant).
# - Membrane potential, "measured in the absence of a current injection" (Methods). The code's
#   baselineVm is the mean, over all sweeps, of the voltage from 10 to 1 ms before step onset, which
#   in these recordings includes the DC holding current that sets -65 mV. This is open; readings are
#   (a) the code's baselineVm and (b) the voltage in a segment with no injected current at all, if
#   the data hold one.
# - Sag, from the -60 pA step, steady-state minus minimum potential (Methods). Code, after a 20 ms
#   median filter, the maximum of the second half of the step minus the minimum of the first half;
#   the nearest step at or below -60 pA is used, and negative values are set to 0.
# - Rheobase, the smallest step that elicits a spike. Spike latency, from step onset to the threshold
#   crossing of the first spike at rheobase (Methods; the code measures to the peak, a variant).
# - Spike threshold, the potential at which dV/dt crosses 20 mV/ms on the first spike at rheobase
#   (Methods). The code uses 10 mV/ms after 10-fold interpolation; a variant.
# - AHP amplitude, after the first spike at rheobase, "the difference between threshold and the
#   minimum potential 100 ms later" (Methods). Open; readings are (a) threshold minus the minimum
#   voltage within 100 ms after threshold and (b) threshold minus the voltage 100 ms after threshold.
#   The code (a variant) takes the first step at or above rheobase with two or more spikes and the
#   minimum between the first and second spike (or to the end of the window when no step has two),
#   with a 10 mV/ms threshold on uninterpolated data.
# - Max firing rate, the largest spike count over the full 500 ms of any step from 0 to 200 pA,
#   divided by 0.5 s (Methods and code).
#
# Statistics (STAR Methods). Two groups, two-tailed t-test; three groups, one-way ANOVA; for
# electrophysiology and morphology "a nested ANOVA was run to account for replicate values obtained
# from the same mouse"; non-parametric tests where Shapiro-Wilk or Kolmogorov-Smirnov fails; alpha
# 0.05. The reported degrees of freedom for electrophysiology match cell-level tests (F(2, 38) with
# 41 cells; pairwise t(31), t(27) and t(18), the pooled df of each pair), not a nested design. The
# paper names no correction for the pairwise comparisons.
