  quote: "Mice with hM4Di inhibition of VP cholinergic neurons also displayed avoidance of the AV odor ( Figures 2D [right] and 2E ). These results indicate that inhibition of cholinergic signaling in the VP was not sufficient to alter avoidance of the AV odor. These results were not due to any hM4Di-induced changes in behavior, as mice in both groups displayed comparable locomotor activity ( Figures S3A – S3D ). Furthermore, mice with hM4Di inhibition of VP cholinergic neurons displayed equal time spent in each arm during a preference test with SAL in both arms of the Y-maze ( Figures S3E and S3F ), ..."
