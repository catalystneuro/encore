  quote: "The convex hull enveloping APP-odor-activated VP cholinergic neurons was smaller in surface area ( F (1, 10) = 12.22, p < 0.05; Figure 6J ) and volume ( Figure S13C ) compared to AV-odor-activated VP cholinergic neurons."
