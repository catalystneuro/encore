    methods_underspecified, with every result shown.
- id: fig6h-av-smaller-ahp
  statement: AV-odor-activated VP cholinergic neurons have a smaller afterhyperpolarization amplitude
    than APP-odor-activated ones.
  source: Figure 6B (right), 6D and 6H; Results, APP- vs. AV-odor-activated VP cholinergic neurons,
    paragraph 3
  quote: "AV-odor-activated VP cholinergic neurons also had a smaller amplitude of the afterhyperpolarization potential ( F (2, 38) = 4.53, p < 0.05; pairwise comparisons: APP vs. AV, t = 2.74, p < 0.05; Figures 6D and 6H )."
  statistics:
  - about: ALL, APP and AV
    test: one-way ANOVA
    statistic: F(2, 38) = 4.53
    p: 0.05
    p_relation: "<"
    n: 41 cells
  - about: APP against AV
    test: pairwise comparison
    statistic: t = 2.74
    p: 0.05
    p_relation: "<"
  criterion: AHP amplitude per the Methods (item 12), with threshold at dV/dt 20 mV/ms, under the
