- id: fig5c-adcd-app-reversal
  statement: Selective inhibition (ADCD-hM4Di) of VP cholinergic neurons activated by the APP odor
    abolishes approach to it and produces avoidance.
  source: Figure 5B and 5C; Results, Selective inhibition of VP cholinergic neurons previously
    activated by the APP odor, paragraph 1
  quote: "However, selective silencing of VP cholinergic neurons that were previously activated by exposure to the APP odor abolished this behavior ( t (11) = 2.72, p < 0.05; Figures 5B [right] and 5C ). Particularly striking was that inhibition of previously activated APP odor VP cholinergic neurons not only blocked approach behavior but in fact elicited active avoidance of the APP odor."
