  quote: "Although we found an equal number of VP cholinergic neurons that were activated by the APP vs. AV odor ( Figure 7D , left), the relative proportion of BLA-projecting APP vs. AV VP cholinergic neurons was not equivalent. The percentage of BLA-projecting VP cholinergic neurons that were activated by the AV odor was significantly greater than the number of BLA-projecting VP cholinergic neurons activated by the APP odor ( t (6) = −2.98, p < 0.05; Figure 7D , right)."
