    ATP 75.2 uM, MT 22.0 nM and HA 6.39 uM.
  source: Table 1, EC50 (MORSE) column; Figure 1I, Figure S3C
  quote: We found that the sensors’ half-maximal effective concentrations (EC 50 , equivalent to a
    sensor’s apparent dissociation constant K d ) could be reliably estimated for all sensors (
    Table 1 ; Figures 1I , S3C )
