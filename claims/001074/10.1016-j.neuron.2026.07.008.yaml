- id: fig1j-ec50-consistent-across-probes
  statement: Dose-response relationships, after peak normalization and averaging over cells of the
    same sensor, are precise and consistent across probes.
  source: Results, MORSE probe development and characterization, paragraph 5; Figure 1I-J
  quote: peak-normalizing each cell’s signal and averaging across cells expressing the same sensor
    produced precise dose-response relationships that were consistent across probes ( Figures 1I - J
    , S3C )
  criterion: Per-probe EC50s are fitted as in table1-ec50-on-target to each probe's cells alone,
    for probes with more than one cell of the sensor (morse_figs3_rev cell 662); Figure 1J shows
    their mean and SEM across 5 to 8 probes per sensor (cells 677, 685). The paper does not say what
    consistent means. Readings (a) for every sensor, every per-probe EC50 lies within one 10-fold
    dose step of the consensus EC50 (between a tenth and ten times it); (b) for every sensor, the
    SEM across probes is less than half the mean. Reproduced when both hold; blocked as
    methods_underspecified when they differ.
  depends_on:
  - table1-ec50-on-target
- id: figs3e-tau-on-under-one-minute
  statement: Ligands diffuse quickly through the hydrogel; almost all sensors show an onset time
    constant under 1 minute, and most signals plateau within 1 minute.
  source: Figure S3E legend; Results, MORSE probe development and characterization, paragraph 5
  quote: Almost all sensors demonstrate a t-on under 1 minute, reflecting rapid diffusion of all ten
    ligands through the hydrogel to reach their sensors
  criterion: Per cell, an exponential rise (x0 - xinf)*exp(-t/tau) + xinf fitted to the first
    three minutes in the well with the lowest concentration of its ligand above the sensor's EC50
    (Methods; S3E legend; morse_figs3_rev cells 688-692, which fit frames 0 to 78 after a 31-frame
    median filter, set xinf to the median of frames 47 to 78, and drop tau above 200 frames). Done on
    the peak-normalized dF/F0 and on the Eq. 8 concentration. "Almost all sensors" read as at least
    8 of the 10 sensors with a median tau-on across cells under 60 s. The S3E legend plots both fits
    and does not say which one its sentence is about, and the Methods treat the concentration fit
    as the diffusion measure; readings (a) the dF/F0 fits, (b) the concentration fits (larger by
    construction, S3E legend). The outcome is the one both give; if they differ, the claim is
    blocked as methods_underspecified.
  depends_on:
  - table1-ec50-on-target
- id: figs3f-depth-delay
  statement: Onset times increase only modestly with cell depth in the gel, with a positive slope
    for all sensors except ATP.
  source: Figure S3F legend; Results, MORSE probe development and characterization, paragraph 5
  quote: Notably, all but one sensor demonstrate a small increase in t-on with increasing cell depth
  criterion: The concentration tau-on of figs3e-tau-on-under-one-minute against each cell's depth,
    the z centre of mass of its mask measured from the front face of the gel (morse_figs3_rev cells
    712-718, 9.89 um per plane), a least-squares line per sensor. Reproduced when 9 of the 10 slopes
    are positive (tau-on rising with distance from the front face) and the ATP slope is the
    negative one. "Modest" is read as a slope below 1 s per um. Needs masks with depth.
  depends_on:
  - figs3e-tau-on-under-one-minute
- id: figs2c-stabilization
  statement: Registration using probability maps of the GRAB signal stabilizes the images as well
    as or better than registration using the tdTomato channel, in dipping, slice and in vivo
    recordings.
  source: Results, MORSE probe development and characterization, paragraph 3; Figure S2C
  quote: Registration using Cellpose2.0 probability maps derived from the GRAB signals performed
    similarly to or better than those from tdTomato signals ( Figure S2C ; Video S4 )
  criterion: Image stability is the normalized cross-correlation of the GRAB probability map at
    each time with the first, restricted to voxels with at least 50% cell probability at the first
    timepoint (S2C legend; Methods, MORSE hydrogel deformation quantification; morse_figs2 cells
    3-12 use skimage match_template on maps downsampled 4-fold in x and y). Over the dipping (n=36), slice (n=11) and in vivo (n=11)
    recordings with both channels, reproduced when both alignments raise the mean cross-correlation
    above the unaligned one and the GRAB-aligned mean is at least the tdTomato-aligned mean minus
    its SEM at most times. Needs raw imaging.
