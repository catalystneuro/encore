    value: 15
    tolerance: 1.5
    unit: min
  criterion: POOLED-INVIVO on the three-sensor recordings (n=11 mice in the legend; the code uses
    10, morse_fig3_rev cell 96). Onset is open. Readings (a) TAU-RISE of the per-mouse trace within
    0 to 45 min; (b) the first time after injection at which the trace exceeds 1.96 times the
    largest pre-injection SD across mice (the Methods' threshold rule). Reproduced when, for each
    ligand, the onset is at most 16.5 min in every mouse (or in the mean trace, reported both), the
    mean peak dF/F0 of the matching sensor in 0 to 45 min exceeds that of the other two sensors
    (specificity, read from Figure 3D-F), and the mean trace at 45 min is below its peak by more
    than the threshold (washout). The code prints tau-rise of 11 to 36 min for older data (morse_fig3
    cells 142-150), which is noted.
- id: figs6ef-photometry-kinetics
  statement: Single-sensor fiber photometry probes in CSF show AVP and OXT time courses after IP
    injection with kinetics similar to MORSE two-photon recordings.
  source: Results, Real time, quantitative tracking of CSF composition with MORSE in vivo, paragraph
    2; Figure S6D-F, Figure 3D-E
  quote: This approach demonstrated similar kinetics of CSF AVP and OXT time courses following IP
    injection as compared to the MORSE technique involving two-photon imaging ( Figures 3D - E )
  criterion: Photometry at 50 Hz, a 2-s median filter, an exponential background fitted over the
    tens of minutes before activation, dF/F0 against the 15 min before each IP injection (Methods).
    n=4 mice per sensor. Kinetics compared through TAU-RISE of the mean traces (photometry against
    MORSE of fig3df-ip-responses). "Similar" is not defined; readings (a) the photometry tau-rise
    lies within the range of per-mouse MORSE tau-rise; (b) the two mean tau-rise differ by less
    than 5 min. Not in the code. Needs the photometry recordings.
  depends_on:
  - fig3df-ip-responses
- id: fig3g-ten-sensor-yield
  statement: With ten-sensor probes in CSF of four mice, up to 9 sensors per probe were recovered
    (median 8.5), with on average 3.8 cells per sensor per probe.
  source: Results, Real time, quantitative tracking of CSF composition with MORSE in vivo, paragraph
    3; Figure 3G
  quote: Across four animals, we were able to successfully recover simultaneous signals from up to 9
    distinct sensors per probe ... 8.5 sensors; average of 3.8 cells per sensor) ( Figure 3G )
  expected:
  - quantity: maximum sensors per probe
    value: 9
    tolerance: 0
  - quantity: median sensors per probe
    value: 8.5
    tolerance: 0.85
  - quantity: mean cells per sensor per probe
    value: 3.8
    tolerance: 0.38
  criterion: SENSOR IDENTITY on the four ten-sensor in vivo recordings; a sensor is recovered on a
    probe when at least one cell carries its label; cells per sensor per probe is total cells over
    (probe, sensor) pairs with a cell (morse_fig3_rev cells 192-203 print sensors per probe 9, 8, 9,
    5 and 119/31 = 3.84).
- id: fig3h-each-sensor-responds-ip
  statement: Each of the ten sensors responded after IP injection of its ligand, with kinetics that
    differ across ligands.
  source: Results, Real time, quantitative tracking of CSF composition with MORSE in vivo, paragraph
    3; Figure 3H
  quote: Each sensor demonstrated a response following IP injection of the respective ligand, with
    diverse response kinetics across ligands that likely reflect differential permeability from
    blood into CSF ( Figure 3H )
  criterion: POOLED-INVIVO for each sensor around the IP mixture that contains its ligand (and the
    ICV 5-HT), on the ten-sensor probes (Figure 3H uses 5 probes, morse_fig3_rev cells 337-346,
    31-frame median filter). Reproduced when, for every sensor recorded, the mean dF/F0 after its
    ligand's injection exceeds 1.96 times the largest pre-injection SD across probes (Methods
    threshold rule) within 0 to 45 min, and the TAU-RISE of the sensors' mean traces span more than
    a factor of 2 (diverse kinetics). Sensors with no cell in any probe are listed.
  depends_on:
  - fig3g-ten-sensor-yield
- id: fig4-ip-csf-concentrations
  statement: IP delivery raised CSF concentrations to tens of nanomolar for 5-HT and hundreds of
    nanomolar for AVP and OXT.
  source: Results, Real time, quantitative tracking of CSF composition with MORSE in vivo, paragraph
    3; Figure 4A, D, G and 4B, E, H left
  quote: We found that IP delivery drove CSF levels in the tens of nanomolar (5-HT) or hundreds of
    nanomolar (AVP, OXT) range ( Figures 4A , D , G )
  expected:
  - quantity: 5-HT, lower bound of tens of nM
    value: 10
    tolerance: 1
    unit: nM
  - quantity: 5-HT, upper bound of tens of nM
    value: 99
    tolerance: 9.9
    unit: nM
  - quantity: AVP and OXT, lower bound of hundreds of nM
    value: 100
    tolerance: 10
    unit: nM
  - quantity: AVP and OXT, upper bound of hundreds of nM
    value: 999
    tolerance: 99.9
    unit: nM
  criterion: CONC-INVIVO on the mice with ICV of the same ligand (AVP 5, OXT 6, 5-HT 5; morse_fig3_rev
    cell 224). Which value is meant is open. Readings (a) the mean across mice of the value at
    30 min after injection, a single timepoint (Figure 4B, E, H left; code cells 294-297); (b) the
    mean across mice of the peak within 0 to 45 min. Reproduced when, under one reading, 5-HT lies
    in 9 to 109 nM and AVP and OXT each in 90 to 1099 nM.
- id: fig4-ex-vivo-elevations
  statement: In naive mice, IP injections raised serum levels of the injected ligands 30 min later,
    and raised AVP and OXT in CSF as well.
  source: Results, Real time, quantitative tracking of CSF composition with MORSE in vivo, paragraph
    3; Figure 4B-C, E-F, H-I
  quote: We found that the IP injections drove elevated levels in serum, with AVP and OXT increases
    also detected in CSF.
  criterion: ELISA (AVP, OXT) and mass spectrometry (5-HT, 5-HIAA) of cisterna magna CSF and cardiac
    serum 30 min after IP ligand (n=3 AVP, n=3 OXT, n=4 5-HT) or saline (n=2, 2, 4), as in the
    Figure 4 legends; values as tabulated (the code loads AVP_all_samples.csv, OXT_all_samples.csv,
    vandy_core.csv, morse_fig3_rev cells 298-323). No test is reported. Readings (a) the IP group
    mean exceeds the saline mean; (b) every IP sample exceeds every saline sample. Reproduced when
    both hold for serum AVP, OXT and 5-HT and for CSF AVP and OXT; not reproduced when neither
    does; blocked as methods_underspecified when they differ. Needs the ELISA and mass
    spectrometry tables.
- id: fig4-ex-vivo-two-orders-lower
  statement: CSF concentrations measured ex vivo were over two orders of magnitude lower than those
    MORSE estimated in vivo 30 min after the same IP injection.
  source: Results, Real time, quantitative tracking of CSF composition with MORSE in vivo, paragraph
    3; Figure 4B, E, H
  quote: Notably, the levels quantified in these ex vivo CSF samples were over two orders of
    magnitude lower than those estimated in vivo by MORSE at the same 30-minute timepoint following
    IP injection.
  expected:
    quantity: ratio of MORSE 30-min estimate to ex vivo CSF value
    value: 100
    tolerance: 0
    unit: fold, lower bound
  criterion: For AVP and OXT, the mean across mice of the MORSE 30-min value (fig4-ip-csf-concentrations
    reading a) divided by the mean ELISA CSF value of the IP group; reproduced when both ratios
    exceed 100. The sentence follows the one on AVP and OXT increases in CSF, and does not say
    whether 5-HT is included. For 5-HT the ratio of the MORSE 30-min value to the mean mass
    spectrometry CSF value of the IP group (Figure 4H) is reported, or to the detection limit (0.050
    pg/uL, about 0.28 nM; Methods) where values lie below it; the paper does not say whether they do.
    Not computed in the code (a note in morse_fig3_rev cell 334).
  depends_on:
  - fig4-ip-csf-concentrations
  - fig4-ex-vivo-elevations
- id: figs6j-serum-dipping-matches-elisa
  statement: AVP concentrations estimated by MORSE dipping into serum samples ex vivo were similar
    to ELISA values from the same kind of samples.
  source: Results, Real time, quantitative tracking of CSF composition with MORSE in vivo, paragraph
    3; Figure S6G-J
  quote: AVP concentration estimated by MORSE ex vivo by dipping in serum samples was similar to
    that obtained with ELISA
  criterion: A ten-sensor probe dipped in serum from IP AVP mice (n=3); AVP concentration by Eq. 8
    from the AVP sensor signal calibrated in the same recording (S6H). The code takes twice the
    median over the last part of each well (morse_fig2 cell 56, 2*median of frames 104 to 156) and
    prints 13.9, 31.0 and 39.5 nM (morse_fig3_rev cell 320); the factor 2 is not explained, so
    readings with and without it are shown. "Similar" is not defined; readings (a) the MORSE and
    ELISA ranges overlap; (b) the ratio of means lies within a factor of 10 (against the "two orders
    of magnitude" contrast the paper draws). Reproduced when both hold; not reproduced when neither
    does; blocked as methods_underspecified when they differ.
- id: fig5ab-spontaneous-5ht
  statement: In 3 of 7 recordings of undisturbed mice, CSF 5-HT rose spontaneously within the first
    60 to 90 min, in all 5-HT sensor cells and in none of the other sensor cells.
  source: Results, MORSE detects endogenous CSF signals at concentrations that impact downstream
    signaling, paragraph 1; Figure 5A-B
  quote: In a subset of experiments (n=3/7), we observed a spontaneous elevation in CSF 5-HT that
    was evident in all 5-HT sensor cells (but none of the other sensor cells) within the first 60–90
    min of the recording
  expected:
    quantity: recordings with a spontaneous 5-HT elevation
    value: 3
    tolerance: 0
    unit: of 7
  criterion: The 7 three-sensor recordings with 2 h of quiet imaging before IP injections. The code
    picks the 3 by hand (morse_fig3 cells 232-243, l_vals 1, 2, 5) and gives no rule. Reading, an
    elevation is a rise of the per-mouse median 5-HT sensor dF/F0 (F0 the mean of the lowest 1/15
    of values, 51-frame median filter, code cell 232) above 1.96 times its SD over the first 15 min,
    peaking within the first 90 min and before the first IP injection, with every 5-HT cell rising
    above its own baseline and no AVP or OXT sensor median doing so. Count exact.
- id: fig5cd-spontaneous-5ht-dynamics
  statement: The spontaneous CSF 5-HT fluctuations were as large as or larger than responses to IP
    5-HT, and rose and decayed over tens of minutes.
  source: Results, MORSE detects endogenous CSF signals at concentrations that impact downstream
    signaling, paragraph 1; Figure 5C-D
  quote: These fluctuations were of similar magnitude or larger than the signals we observed in CSF
    following IP 5-HT delivery (c.f. Figure 3F ) and slowly rose and decayed over tens of minutes (
    Figures 5C - D )
  criterion: On the 3 recordings of fig5ab-spontaneous-5ht, the per-mouse mean 5-HT trace; FWHM as
    the last minus the first time above half the maximum, tau-off as the last time above max/e
    minus the time of the peak (morse_fig3 cells 238-243, which print FWHM 79.8, 94.6 and 87.6 min
    and tau-off 91.1, 84.8 and 76.1 min). Reproduced when the FWHM and tau-off of each lie between
    10 and 99 min (tens of minutes) and each peak dF/F0 is at least 0.9 times the mean peak dF/F0 of
    the 5-HT sensor after IP 5-HT in fig3df-ip-responses (same F0 rule across both, readings with
    the Figure 3 F0 and with the Figure 5 F0).
  depends_on:
  - fig5ab-spontaneous-5ht
  - fig3df-ip-responses
- id: fig5gh-chp-calcium
  statement: IP and ICV 5-HT drove calcium responses of similar amplitude in choroid plexus
    epithelial cells, both lasting at least 60 min.
  source: Results, MORSE detects endogenous CSF signals at concentrations that impact downstream
    signaling, paragraph 2; Figure 5G-H
  quote: Both routes of 5-HT administration drove similar amplitudes of calcium activity in the ChP
    epithelial cells, and both responses persisted for at least 60 minutes following delivery.
  criterion: GCaMP6f in FoxJ1-Cre::Ai95D mice, ICV n=3 and IP n=6. A square ROI over several
    epithelial cells, the mean signal; an exponential fitted to the signal before injection and
    subtracted where it decays; dF/F0 against the first 5 min (Methods, ChP signal processing).
    The code (morse_fig3 cells 334-405) median filters over about 100 s and divides by the mean
    over the 15 min before injection; both F0 readings are shown. Peak = maximum after injection.
    Code prints peaks ICV 0.72, 0.75, 1.47 and IP 0.58, 0.50, 0.34, 0.61, 1.28, 0.59. "Similar"
    read as the IP and ICV mean peaks within a factor of 2 of each other. Persistence read as the
    mean dF/F0 at 60 min after delivery still above 1.96 times the pre-injection SD, for both
    routes. Needs the ChP traces.
- id: fig6-chp-grab-similar-time-courses
  statement: GRAB sensors expressed in the choroid plexus epithelium report IP 5-HT, AVP and OXT with
    time courses similar to those seen with MORSE in CSF.
  source: Results, MORSE detects endogenous CSF signals at concentrations that impact downstream
    signaling, paragraph 3; Figure 6C, E, G against Figure 3F, D, E
  quote: In subsets of mice, IP delivery of 5-HT, AVP, or OXT drove associated sensor signals in ChP
    with similar time courses as observed previously with MORSE
  criterion: ChP GRAB dF/F0 as in fig5gh-chp-calcium (5-HT 5 injections in 4 mice, AVP 9 in 4, OXT 3
    in 2), TAU-RISE per injection (morse_fig3 prints 5-HT 1.9 to 6.8 min, AVP 4.4 to 42.9, OXT 4.2
    to 29.3). "Similar" is not defined; readings (a) the mean ChP tau-rise of each ligand lies within
    the range of per-mouse MORSE tau-rise of fig3df-ip-responses; (b) the mean tau-rise differ by
    less than a factor of 2. Needs the ChP traces.
  depends_on:
  - fig3df-ip-responses
- id: fig6c-ip-5ht-reaches-chp-fast-enough
  statement: IP 5-HT reached the apical choroid plexus membrane fast enough to explain the choroid
    plexus calcium response.
  source: Results, MORSE detects endogenous CSF signals at concentrations that impact downstream
    signaling, paragraph 3; Figure 6C, Figure 5H
  quote: Furthermore, IP 5-HT reached the apical ChP membrane ( Figure 6C ) fast enough to explain
    the ChP calcium response ( Figure 5H )
  criterion: TAU-RISE after IP 5-HT of the ChP GRAB-5-HT2h signal (Figure 6C right, 5 injections)
    against the GCaMP6f signal (Figure 5H right, 6 mice). The paper does not say what "fast enough"
    means. Readings (a) the mean GRAB tau-rise is not later than the mean GCaMP tau-rise plus its
    SEM; (b) the mean GRAB signal exceeds 1.96 times its pre-injection SD (the Methods' threshold
    rule) no later than the mean GCaMP signal does. The outcome is the one both give; if they
    differ, the claim is blocked as methods_underspecified. The code's printed values (below) fail
    reading (a), so it may not be what the authors meant. The code prints GRAB 6.8, 5.5, 1.9, 5.0,
    3.8 min and GCaMP 1.4, 4.4, 0.6, 1.3, 1.6, 3.0 min (morse_fig3), which is noted; the code's
    exclusion of one GCaMP mouse from the mean is shown as a variant.
  depends_on:
  - fig5gh-chp-calcium
- id: figs6a-no-implant-inflammation
  statement: MORSE probe implantation caused no asymmetry in microglial (Iba1) or astrocytic (GFAP)
    staining, nor in diffusion of labeled BSA from CSF into tissue.
  source: Figure S6A-C legends
  quote: No Iba1 or GFAP signal asymmetry between left and right hemispheres induced by MORSE probe
    implantation into one of the cannulae was noted in any animals (n=12) across the span of the
    ventricular system.
  criterion: Histology of 12 mice. A claim of absence with no test in the paper; reproduced when the
    Iba1 and GFAP intensities on the implanted side are within the range of the other side in every
    mouse, and the BSA profile (S6C) is symmetric. Needs histology images, which the paper does not
    say are deposited.
checks:
- date: 2026-10-22
  kind: agent
  model: claude-opus-5-5
  ready: true
  changes:
  - fig1f-koh-stability. The 10% to 65% sentence is in the Methods and is about the whole optimization, and Figure 1F's groups differ in both recipe and KOH; the statement credited KOH alone. Rewrote the statement and put the Methods first in the source.
  - fig1f-koh-stability. The tolerance of 0.01 on 0.10 excluded 1/9 (0.11), the only count of 9 probes that "~10%" can denote. Recorded as 1 of 9, exact.
  - methods-revision-probe-stability. The paper defines stability only for dipping (Figure 1F); the criterion now says applying it to slice and in vivo is a reading.
  - fig1h-crosstalk-pairs. The quote is from the Methods, so the source now leads with it; said that the Methods' 1-min window decides and the code's 10 frames are a variant.
  - figs3e-tau-on-under-one-minute. The S3E legend does not say whether its "under 1 minute" refers to the dF/F0 or the concentration fits, and the Methods treat the concentration fit as the diffusion measure. The criterion had chosen dF/F0; it now names both readings, with blocking if they differ.
  - figs2c-stabilization. Added the Methods' restriction of the cross-correlation to voxels with at least 50% cell probability at the first timepoint.
  - figs5d-pvh-ne-alone. The criterion said the 190 and 102 nM thresholds do not decide the claim. The Methods define one threshold per dataset, so they are the PVH dataset's; they now count with their tolerances.
  - fig2h-lc-ne-da-peaks. "DA reaches its peak before NE" was judged only by tau-rise, which the paper does not name for it. Added reading (b), the time of the maximum, with blocking if they differ.
  - fig2jk-lc-robust-counts. The criterion took the code's THRESH as the main one, which goes against the protocol's rule that the Methods come first when they and the code disagree. The Methods now decide and the code's variant is shown. Named as open which recordings form the dataset (LC alone, or the code's LC and DRN recordings, which the paper never mentions).
  - fig4-ex-vivo-elevations, figs6j-serum-dipping-matches-elisa. "Reproduced when both readings hold" would have made a split result not reproduced. A split now blocks as methods_underspecified.
  - fig4-ex-vivo-two-orders-lower. The criterion said the 5-HT CSF values were below detection, which the paper does not say. It now reports the 5-HT ratio from the Figure 4H values (or the detection limit if they fall below it), and notes that the sentence may or may not include 5-HT.
  - fig6c-ip-5ht-reaches-chp-fast-enough. "Fast enough" had one reading of the file's own making, and the code's printed tau-rise values fail it. Added reading (b), the Methods' threshold-crossing onset, with blocking if they differ.
  - Header. THRESH now says the Methods do not define a dataset. Added two inconsistencies, the S4D legend panel names and the IP 5-HT dose for ChP imaging (3 against 2 mg/kg).
  - Open, not settled. fig5ab-spontaneous-5ht has no detection rule in the paper (the code picks the 3 recordings by hand); its rule is the file's reading, and the count may depend on it.
  - Open, not settled. Several undefined words have one reading each, whose thresholds come from the file and not the paper. These are "modest" in figs3f (under 1 s per um), "similar magnitude" in fig5cd (at least 0.9 times), "similar" in fig5gh (within a factor of 2), "diverse kinetics" in fig3h (a factor of 2 spread) and "most probes" in fig1c and figs2f.
  - Open, not settled. Findings without claims. Two are not main findings. One is that 10 of 16 tested sensors gave reliable responses (Results, paragraph 1). The other is the Discussion's statement that every ligand reached detectable CSF levels within 15 min of IP injection on the ten-sensor probes; fig3h has no 15 min limit.
  - Open, not settled. The code repository was not available in this run, so the citations of notebook cells and printed values were not checked against it.
