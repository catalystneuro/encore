# Claims for Kalugin, Soden, ... Lehtinen & Andermann (2026), Neuron, doi:10.1016/j.neuron.2026.07.008,
# on dandiset 001074 ("Multiplexed optical recording of sensors on a micro-endoscope (MORSE)",
# most recent published version 0.260928.0807; title and description read, no data or asset list read).
#
# Provenance. Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions),
# 2026-10-22, protocol pilot-10 as stated in docs/protocol.md (Reader, steps 1 to 4).
#
# Text read. The accepted author manuscript in PubMed Central (PMC13568791, NIHMS2202779), as
# fetched to paper/10.1016-j.neuron.2026.07.008.txt: Summary, Introduction, Results, Discussion,
# STAR Methods (including "Quantification and statistical analysis"), figure legends of Figures 1
# to 6, Table 1, the key resources table and the video legends (S1 to S16); and the supplement
# NIHMS2202779-supplement-1.pdf (Figures S1 to S6 with legends), extracted into the same file.
# The version of record was not read. The paper reports no statistical test and no p-value: all
# support is means with SEM, counts, and figures. No claim therefore has `statistics`.
#
# Code read. github.com/pkalugin/kalugin-et-al-morse at commit fa4526ac02eaa2c5a24c4cfdcaab5c36ed5ae4ed
# (2026-08-06; the paper also cites Zenodo doi:10.5281/zenodo.21142692, not read). It holds
# microscope motor control (1_), Cellpose probability maps (2_), demons deformation fields (3_, 4_),
# CaImAn mask extraction, curation and cross-recording matching (5_), and the trace analyses by
# figure in 6_trace_analysis/ (Jupyter notebooks with printed outputs). Cells cited below are
# 0-based cell positions in the .ipynb files. Which notebook made which paper number:
#   morse_figs3_rev: Figure 1G-J, S3, Table 1 (the revision set of 10 ten-sensor probes). Its printed
#     outputs match the paper (506 cells, median 9 sensors, 6.02 cells per sensor, all EC50s).
#   morse_fig2_rev: the LC optogenetic slices (Figure 2G-L, S4F). Printed outputs match the paper
#     (thresholds 148, 84.3, 30.3 nM; peaks 347 and 248 nM; delay 30.7 s).
#   morse_fig2: an older analysis of the dLGN and PVH slices (Figure 2A-F, S4A-E, S5) with older
#     parameters (fixed threshold 0.125, older EC50s). Its printed values do not match the paper
#     (for example NE peak 2.21 uM against 4.61 uM; thresholds 278/45.9/28.3 nM against
#     348/116/62.7 nM). The code that made the paper's dLGN and PVH numbers is not in the repository.
#   morse_fig3_rev: Figure 3 and Figure 4 (in vivo MORSE, ELISA and mass spectrometry tables).
#   morse_fig3: Figure 5A-D (spontaneous 5-HT), Figure 5G-H and Figure 6 (choroid plexus, from CSV
#     traces of square ROIs).
#   Not in the code: fiber photometry (S6E-F), the "100-200 cells" of Figure 1C, the probe stability
#     counts, the "two orders of magnitude" comparison, and the PVH and dLGN numbers above.
#
# Data the paper used, as it reports them.
#   In vitro dipping (Figure 1, S1-S3): MORSE probes (HEK-293T cells, one GRAB sensor per cell,
#     colchicine-treated, in a ~200 um collagen I/Matrigel hydrogel on a 0.5 mm GRIN lens), imaged
#     at ~0.5 volumes/s (30 planes) while robotically dipped into 20 uL wells of a 384-well plate
#     (3-5 min per well). Ten ten-sensor probes (AVP, 5-HT, NE, ACh, ATP, OXT, HA, DA, CCK, MT) were
#     dipped into near-saturating single ligands (identification) and then two 5-ligand mixtures at
#     10-fold dilutions (dose response). Warping and detachment tests used 50:50 (n=9) and 40:60
#     (n=24) Matrigel:collagen probes with and without KOH coating, and pure Matrigel against 50:50
#     probes (n=6 each, 9 h).
#   Acute slices (Figure 2, S4, S5): seven-sensor probes (ACh, AVP, OXT, 5-HT, NE, DA, HA) pressed on
#     the slice. dLGN, 9 slices (Pet1-Cre mice with DRN tdTomato; 6 mice), bath 50 mM KCl then 50 uM
#     DA, 5-HT and NE wash-ons; 4 of 9 followed by dipping. PVH, 6 recordings (TH-Cre::Ai32 mice; 8
#     mice), KCl at 1.56 to 50 mM in 2-fold steps then DA and NE. LC, 5 slices with NE responses
#     (ChrimsonR in LC, 5 male mice), 655 nm light in the first 5 s of each 20 s trial, 45 trials,
#     then DA, 5-HT, NE wash-ons. Frames of 1.92 s (31.25 volumes per minute in morse_fig2_rev).
#   In vivo CSF (Figure 3, 4, 5A-D, S6): probes inserted into a lateral ventricle cannula of awake
#     head-fixed mice on a wheel, 3-4 h of imaging. Three-sensor probes (AVP, OXT, 5-HT), IP AVP
#     1 mg/kg, OXT 1 mg/kg, 5-HT 3 mg/kg, then ICV AVP (n=5) or OXT (n=6) or 5-HT, "n=11 mice" in
#     Figure 3D-F; ten-sensor probes in 4 mice with three IP mixtures and ICV 5-HT; spontaneous 5-HT
#     in 3 of 7 three-sensor recordings. Post hoc dipping identified each cell's sensor.
#   Fiber photometry (S6D-F): single-sensor probes on a 400 um fiber, AVP (n=4 mice), OXT (n=4).
#   Ex vivo (Figure 4B,C,E,F,H,I, S6G-J): naive Swiss Webster mice, CSF and serum 30 min after IP
#     AVP, OXT or 5-HT or saline; ELISA (AVP, OXT), mass spectrometry (5-HT, 5-HIAA); a ten-sensor
#     probe dipped into the serum samples.
#   Choroid plexus imaging (Figure 5E-H, 6): FoxJ1-Cre::Ai95D mice (GCaMP6f; ICV 5-HT n=3, IP 5-HT
#     n=6) and mice with ICV AAV5 GRAB sensors (5-HT 5 injections in 4 mice, AVP 9 in 4, OXT 3 in
#     2), imaged through a cranial window, 1 volume per 4.32 s.
#   The paper says single-cell traces from all experiments are on DANDI; raw imaging and fiber
#   photometry are "available from corresponding authors upon request". Claims that need raw
#   imaging, photometry, ELISA or histology are still `dataset` (the paper's own recordings);
#   whether the dandiset holds them is the author's to find.
#
# Shared methods. Claims refer to these by name. Each part is from the Methods (M) or the code (C).
#   POOLED-SLICE. Per recording and sensor, the median across that sensor's cells of dF/F0 at each
#     timepoint (M, "pooled signals"; C morse_fig2_rev cell 107). F0 is the mean of the lowest 10% of
#     each cell's trace (M Eq. 27; C morse_fig2_rev cell 11). Median filter of 31 frames, about 60 s
#     (M "10-60 sec window"; C cell 107). Peak normalization (M) so that the post-wash-on peak of the
#     50 uM ligand wash-on equals F*c/(Kd+c) with c = 50 uM, Kd and F of that sensor (CONSTANTS).
#     Open, the post-wash-on peak (the code divides by the median of a hand-picked 100-frame window,
#     morse_fig2_rev cells 73 and 107). Readings (a) the median of the 100 frames centred on the
#     maximum of the filtered trace between that wash-on and the next; (b) that maximum. Variant
#     (code, not Methods), a linear detrend between hand-chosen frames before normalization; its
#     frames are not recoverable, so it is shown only where the dataset gives them.
#   CONSTANTS. Kd = the MORSE EC50s of Table 1 (consensus fits, as printed in morse_figs3_rev cell
#     375). F (the fitted maximum) from morse_figs3_rev cell 376, not printed in the paper:
#     AVP 1.0593, AVP sensor by OXT 1.2894, OXT sensor by AVP 1.0089, OXT 1.0596, 5-HT 1.0484,
#     CCK 1.0671, NE 1.0440, NE sensor by DA 1.0907, DA sensor by NE 1.0816, DA 1.0007, ACh 1.0643,
#     ATP 1.0633, MT 1.0648, HA 1.0050. Crosstalk ratios gamma (morse_figs3_rev cell 368), AVP sensor
#     by OXT 0.2777, OXT sensor by AVP 0.2190, NE sensor by DA 0.4415, DA sensor by NE 0.7981.
#   CONC. Concentration from a peak-normalized signal y clipped to [0, F], by Eq. 8,
#     [L] = Kd*y/(F - y), for one ligand, and by Eq. 19 for NE and DA together (M; C morse_fig2_rev
#     cells 67 and 107, which solve the two equations of Eq. 18 numerically).
#   THRESH. Robust-response threshold of a dataset (M, "a threshold defining robust response"; the
#     Methods do not define a dataset, read here as one brain region and stimulus, and for LC see
#     fig2jk-lc-robust-counts) (M, "a threshold
#     defining robust response"). The SD of each sensor's pooled peak-normalized signal over the
#     period before any KCl or optogenetic stimulation or IP injection, for each recording; the
#     maximum across the dataset's recordings; times 1.96; converted to a concentration by Eq. 8.
#     A response is robust when its peak concentration exceeds the threshold (Figure 2D legend).
#     Variant (code, morse_fig2_rev cells 120 and 144), the SD is of the unnormalized pooled dF/F0
#     over the first 5 min of the recording.
#   PEAK. The median of the 10 largest values of the concentration trace within the response
#     window (C morse_fig2_rev cell 139). For optogenetic slices the window is 5 to 12.5 min of the
#     recording, stimulation starting at 5 min (C cell 139). For KCl the paper and the code do not fix
#     it; readings (a) from KCl wash-on to the start of the next wash-on, (b) from KCl wash-on to
#     7.5 min after it (the length of the code's optogenetic window).
#   TAU-RISE. The time from stimulus onset to the first frame at which the trace exceeds
#     (1 - 1/e) times its PEAK, within the response window (C morse_fig2_rev cell 170; the same
#     definition in morse_fig3_rev cells 288-290 and morse_fig3). The Methods name it "onset timing"
#     without a definition.
#   POOLED-INVIVO. Per mouse and sensor, the median across cells of dF/F0 with F0 the mean of the
#     15 min before the injection (M Eq. 27; C morse_fig3_rev cells 96 and 127-142, cells median
#     filtered over 11 frames), from 15 min before to 45 min after the injection; then mean and SEM
#     across mice (Figure 3D-F legend; C).
#   CONC-INVIVO. As POOLED-INVIVO with a 31-frame (about 60 s) median filter, normalized so that the
#     peak after the saturating ICV infusion of the same ligand equals F (M, "normalized to their
#     peaks matching the F parameter"; C morse_fig3_rev cells 224-274; the code takes the maximum of
#     the trace up to 1000 volumes, about 32 min, after the ICV onset), then Eq. 8 with CONSTANTS.
#     Variant (code), a stretched exponential plus linear detrend fitted over hand-set frames, used
#     for some mice only; not recoverable, shown only if the dataset gives the frames.
#   SENSOR IDENTITY. Each cell's sensor is the label the dataset gives from the post hoc dipping. If
#     the dataset gives none, labels are made as in the Methods and morse_figs3_rev cells 21-78
#     (exponential background fit, Savitzky-Golay first derivative, window 30 frames and order 1,
#     HDBSCAN with min_cluster_size 3 on correlation distance, clusters matched to the ligand wells);
#     the code then corrects clusters by hand, which cannot be repeated, so counts would differ.
#
# Inconsistencies noted while reading (for the author's findings, not resolved here).
#   Results say KCl-free optogenetic increments of "100-300 nM" (Figure 2I text); the Figure 2I
#     legend says "100-200 nM".
#   Methods say ">90% probe stability" in revision experiments, with n=10/13 dipping (77%), 9/9
#     slice and 13/14 in vivo.
#   Figure 1G IQR "8-9"; the code prints the 25th percentile as 8.25.
#   Figure 1F legend defines late warp as >25 um in the second hour; the code (morse_figs1 cell 139)
#     uses >50 um within 2 h.
#   Figure 3D-F legend "n=11 mice"; morse_fig3_rev cell 96 uses 10 recordings (n 10, 10, 9 by sensor).
#   Figure 5H legend "six mice"; morse_fig3 leaves one of the six out of the mean.
#   Figure 6D names GRAB-AVP2.0, Figure 6E and the Results GRAB-AVP0.2.
#   Figure S4D legend names NE (left) and DA (right), then reports NE and 5-HT tau-rise.
#   Results give IP 5-HT at 3 mg/kg for ChP GCaMP imaging; the Figure 5H legend and the Methods
#     ChP table give 2 mg/kg.
schema_version: 2
dataset:
  archive: dandi
  id: "001074"
paper: doi:10.1016/j.neuron.2026.07.008
claims:
- id: fig1c-cells-per-gel
  statement: Imaging a MORSE hydrogel through the GRIN lens shows 100 to 200 green sensor cells
    spread through the full thickness of the gel.
  source: Results, MORSE probe development and characterization, paragraph 1; Figure 1C
  quote: 3D two-photon imaging of the resultant hydrogel through the GRIN lens (30 planes/volume,
    ~600×600×270 μm 3 volume) demonstrated a uniformly distributed set of 100–200 green cells
    spanning the full thickness of the gel
  expected:
  - quantity: green cells per probe, lower bound of the range
    value: 100
    tolerance: 10
  - quantity: green cells per probe, upper bound of the range
    value: 200
    tolerance: 20
  criterion: Neither the Methods nor the code say how the cells were counted. Readings (a) the
    number of cell masks extracted per recording before curation (CNMF components); (b) the number
    of curated cell masks per recording. Reproduced when the per-probe counts of a reading lie in 90
    to 220 for most probes (more than half) and the cells occupy all depths of the gel (cell centres
    found in the top, middle and bottom thirds of the gel thickness). Needs masks or imaging.
- id: fig1d-collagen-reduces-warping
  statement: Hydrogels of pure Matrigel deform substantially over tens of minutes; a mixture of
    Matrigel and collagen I deforms less.
  source: Results, MORSE probe development and characterization, paragraph 2; Figure 1D
  quote: The small hydrogel volume (~40 nL) on the GRIN lens tip, when composed of pure Matrigel,
    exhibited substantial global and local deformations over tens of minutes. We minimized these
    deformations using an optimized mixture of Matrigel and collagen I
  criterion: Deformation is the local strain magnitude, the mean over the hydrogel volume of the
    magnitude of the displacement field minus its mean (Figure 1D legend, Figure S1C; morse_figs1
    cells 3, 92, 97), from demons registration of Cellpose probability maps to a reference volume.
    With n=6 probes per recipe imaged for 9 h, reproduced when the mean deformation across probes of
    the 50:50 recipe stays below that of pure Matrigel over the recording (mean over the 9 h lower,
    and lower at the end). The paper gives no test. Needs the deformation fields or raw imaging.
- id: fig1f-koh-stability
  statement: Treating the silicone surface with KOH before applying the gel strongly reduces gel
    warping and detachment during dipping; with the optimized protocol (40:60 Matrigel:collagen I
    with 2.5% KOH, against 50:50 without KOH) probe stability rose from about 10% to about 65% in
    initial tests.
  source: Methods, Optimization of MORSE manufacture, paragraph 1; Figure 1F; Figure S1D-E; Results,
    MORSE probe development and characterization, paragraph 2
  quote: This allowed us to increase probe stability from ~10% to ~65% in initial tests ( Figure 1F
    )
  expected:
  - quantity: stable probes, 50:50 Matrigel:collagen without KOH
    value: 1
    tolerance: 0
    unit: of 9
  - quantity: fraction of stable probes, 40:60 Matrigel:collagen with 2.5% KOH
    value: 0.65
    tolerance: 0.065
  criterion: A probe is early warp when the 3D translation of the hydrogel (the norm of the mean
    displacement over the gel) exceeds 25 um in the first hour, late warp when it exceeds 25 um in
    the second hour, and stable otherwise (Figure 1F legend). Stable fraction over the 9 probes of
    50:50 without KOH and the 24 of 40:60 with KOH. Variant (code, morse_figs1 cell 139), late warp
    as more than 50 um within 2 h. The code's comments (cell 126) give "~66% success" for the KOH
    group. The two groups differ in both recipe and KOH (Figure 1F legend), so the comparison does
    not separate the two. Of 9 probes, "~10%" can only be 1 (11%), recorded as a count. Needs the
    deformation fields or raw imaging.
- id: methods-revision-probe-stability
  statement: In the revision experiments more than 90% of probes were stable, 10 of 13 in vitro
    dipping, 9 of 9 slice and 13 of 14 in vivo CSF experiments.
  source: Methods, Optimization of MORSE manufacture, paragraph 1
  quote: In revision experiments, >90% probe stability was achieved (n=10/13 in vitro dipping
    experiments, n=9/9 brain slice experiments, n=13/14 in vivo CSF experiments).
  expected:
  - quantity: stable dipping probes
    value: 10
    tolerance: 0
    unit: of 13
  - quantity: stable slice probes
    value: 9
    tolerance: 0
    unit: of 9
  - quantity: stable in vivo probes
    value: 13
    tolerance: 0
    unit: of 14
  criterion: The paper does not define stability for the revision experiments. Read as in
    fig1f-koh-stability (no translation above 25 um), the only definition the paper gives, made for
    dipping; for slice and in vivo recordings this is a reading. Counts are exact.
    The ">90%" does not follow from 10/13; the counts decide the claim. Needs deformation fields
    or raw imaging, and a record of which recordings were revision experiments.
- id: fig1g-sensor-yield
  statement: Ten ten-sensor probes yielded 506 identified single-cell masks; per probe a median of
    9 sensors were active (IQR 8 to 9), with on average 6.02 cells per sensor per probe.
  source: Figure 1G and legend; Results, MORSE probe development and characterization, paragraph 4
  quote: we could assign clear sensor identities across several hundred cells from ten
    representative MORSE probes (median of 9 active sensors per probe, interquartile range 8–9;
    average of 6.02 cells per sensor per probe)
  expected:
  - quantity: identified cells over the ten probes
    value: 506
    tolerance: 50.6
  - quantity: median active sensors per probe
    value: 9
    tolerance: 0.9
  - quantity: 25th percentile of active sensors per probe
    value: 8
    tolerance: 0.8
  - quantity: 75th percentile of active sensors per probe
    value: 9
    tolerance: 0.9
  - quantity: mean cells per sensor per probe
    value: 6.02
    tolerance: 0.602
  criterion: From SENSOR IDENTITY on the identification dipping recordings of the ten ten-sensor
    probes. A sensor is active on a probe when at least one cell carries its label; there is no
    threshold (morse_figs3_rev cells 139-143). Cells per sensor per probe is the total number of
    cells divided by the number of (probe, sensor) pairs with at least one cell (cells 139, 144,
    506/84). Percentiles by numpy's default linear interpolation (cell 142, which prints 8.25).
- id: fig1g-all-ten-sensors-respond
  statement: Dipping ten-sensor probes into each ligand in turn gave rapid, strong and consistent
    responses in a subset of cells for each ligand, and all ten sensors were activated.
  source: Results, MORSE probe development and characterization, paragraph 4; Figure 1G, Figure S3A
  quote: This resulted in rapid, strong, and consistent patterns of elevated fluorescence in subsets
    of cells evenly spread throughout the gel in response to each ligand
  criterion: Reproduced when each of the ten sensor labels is carried by cells on at least one of
    the ten probes, and the mean peak-normalized dF/F0 of each sensor's cells is highest during the
    well of its own ligand (Figure 1G heatmap; peak normalization by Eq. 28, mean of the highest 10%
    minus mean of the lowest 10%), except that the DA and NE sensors and the AVP and OXT sensors may
    also respond to each other's ligand (fig1h-crosstalk-pairs). Background correction by an
    exponential fit to the signal before activation (Methods), as in morse_figs3_rev cells 21-24.
  depends_on:
  - fig1g-sensor-yield
- id: fig1h-crosstalk-pairs
  statement: Among the ten sensors, only the DA and NE sensors, and to a lesser extent the AVP and
    OXT sensors, show crosstalk in their ligand responses.
  source: Methods, Quantification and statistical analysis; Figure 1H, Figure S3B; Results, MORSE
    probe development and characterization, paragraph 4
  quote: Calculating the means of the derivative time courses across each cell cluster and
    cross-corelating them with each other consistently demonstrated that only the DA2.9 dopamine and
    the NE2h norepinephrine sensors, as well as to a lesser extent the AVP0.2 vasopressin and OXT1.7
    oxytocin sensors, exhibited crosstalk in their ligand responses
  criterion: Per cell, the time derivative of the peak-normalized dF/F0 by a Savitzky-Golay filter
    (1-min window, order 1; Methods, which decide; morse_figs3_rev cell 216 uses 10 frames, shown as
    a variant), each divided by its
    own maximum (cell 218); the mean per sensor (cell 224); the Pearson correlation at zero lag
    between the ten sensor means (cell 227). The paper and the code set no threshold for crosstalk.
    Reproduced when the DA-NE correlation is the largest off-diagonal value, the AVP-OXT
    correlation is the second largest, and every other pair is lower than both. Variant (code, cell
    219), a band-pass 3-minute dipping artefact subtracted before averaging.
  depends_on:
  - fig1g-sensor-yield
