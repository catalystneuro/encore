- id: ma-fraction-over-nrem-episodes
  statement: The fraction of time occupied by MAs decreases over the course of nonREM episodes
    (R = -0.85, p < 1e-10).
  source: Results, Identification of brain states, paragraph 2
  quote: "Over nonREM episodes the fraction of time occupied by MAs decreased (correlation versus
