- id: packet-duration
  statement: The duration of nonREM packets spans two orders of magnitude, with a median of 111
    s.
  source: Results, Identification of brain states, paragraph 3
  quote: We found that the duration of packets was distributed over two orders of magnitude, with a
    median of 111 seconds.
  expected:
    quantity: median packet duration
    value: 111
    tolerance: 11.1
    unit: s
  criterion: Readings (a) every Non-REM epoch; (b) Non-REM epochs inside SLEEP periods.
    Reproduced when the median is within tolerance under one reading.
- id: wake-sleep-cycles
  statement: The dataset holds 54 WAKE-SLEEP episodes (at least 7 min of WAKE followed by at
    least 20 min of SLEEP), an average of 2.0 per session, and sessions without one were
    discarded.
  source: Results, Identification of brain states, paragraph 3; Results, Assessment of firing
    patterns in different brain states, paragraph 1; Results, Firing pattern and LFP changes across
    the course of sleep, paragraph 1
  quote: Sessions without full WAKE-SLEEP cycles (Supplementary Materials) were also discarded. ...
