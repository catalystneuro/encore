# Claims for Watson, Levenstein, Greene, Gelinas and Buzsaki (2016) on dandiset 000041.
# Source: the NIH author manuscript in PubMed Central (PMC4873379), full text of the main
# article, read from its Results, Experimental Procedures and figure legends. The Supplemental
# Experimental Procedures and the supplementary figures (NIHMS776601-supplement-1 and -2) could
# not be retrieved (PMC and the publisher answer with a browser check), and Table 1 is not in
# the manuscript text. Where the main text leaves a method open, the choice is fixed below.
# Quotes and statistics added 2026-10-19 from the full text (PMC4873379, NCBI PMC JATS XML via
# E-utilities; Europe PMC returned an error).
#
# When these criteria were written, the author had seen the data check only: the file list and
# dandiset metadata; for every file the subject, session, scalar metadata, unit counts by
# cell_type and region, spike-time ranges, the number and total duration of each state label,
# LFP shape, rate and chunking, electrode columns; the first 40 rows of the state table in two
# sessions; and the spike times of Dino-072114, which are whole seconds divided by 20000. No
# claim's analysis had been run. The paper links no analysis code; the NWB conversion code
# (catalystneuro/buzsaki-lab-to-nwb at commit 5f6a375) was read.
#
# Method choices fixed here, before the analysis:
# - Sessions. The 21 files whose spike times are usable; Dino-072114 is left out (see the data
#   check). Each session's units are treated as distinct cells, as the paper counts cells per
#   session; units have no identifier across sessions.
# - Cells. Putative pyramidal (pE) cells are units with cell_type "excitatory", putative
#   interneurons (pI) those with "inhibitory"; the 23 "unknown" units are left out.
# - States. The dandiset's state table has only Awake, Non-REM and REM. A microarousal (MA) is
#   an Awake epoch shorter than 40 s whose previous and next epochs are both Non-REM (Results,
#   identification of brain states). WAKE is every other Awake epoch. A nonREM packet is one
#   Non-REM epoch. A nonREM episode is a maximal run of packets and MAs, beginning and ending
#   with a packet. A SLEEP period is a maximal run of epochs that begins with the first
#   non-Awake epoch after an Awake epoch longer than 120 s and holds no Awake epoch longer than
#   120 s; it ends at the last non-Awake epoch before an Awake epoch longer than 120 s, must
#   last at least 20 min from its first start to its last stop, and must be followed by such an
#   Awake epoch (SLEEP is "terminated by prolonged (>120 sec) WAKE"). A WAKE-SLEEP cycle is a
#   SLEEP period whose preceding Awake epoch lasts at least 7 min.
# - Rates. A cell's rate over a set of intervals is its spike count over their total duration.
# - Sextiles. Each pE cell's WAKE rate is its rate over all WAKE epochs of its session; the six
#   groups are cut at the sextiles of these rates over all pE cells of all sessions (Results:
#   "divided pE cells from across the dataset into 6 sextile groups based on their WAKE firing
#   rates"). Sextile 1 is the slowest, 6 the fastest.
# - Time courses. Within packets, episodes, WAKE and REM epochs, 10 bins of normalized time;
#   packets and episodes of at least 20 s, WAKE epochs of at least 40 s, REM epochs of at least
#   20 s; for episodes and SLEEP, only Non-REM time within a bin counts. A group's value in a
#   bin is the mean rate of its cells, divided by the mean of that value over the bins of the
#   same packet, episode or epoch (units with no spikes in the whole interval are dropped as
#   undefined). R is the Pearson correlation of these values with bin centre, pooled over all
#   intervals of all sessions. Other bin counts (5, 20) and a longer minimum (60 s) are shown
#   as variants.
# - LFP. One channel per session, the electrode flagged spindle_reference in the electrodes
#   table (the first when several), read in raw int16 units as the file gives no conversion
#   factor. Power from 2 s Hann windows stepped by 1 s; bands delta 0.5 to 4 Hz, sigma 9 to 25
#   Hz, gamma 40 to 100 Hz (Results); log10 of the mean power in band. Only Non-REM time is read.
schema_version: 2
dataset:
  archive: dandi
  id: "000041"
paper: doi:10.1016/j.neuron.2016.03.036
claims:
- id: dataset-composition
  statement: The recordings come from 11 rats and 27 sessions of 294 plus or minus 137 min,
    yielding 995 putative pyramidal cells and 126 putative interneurons.
  source: Results, Identification of brain states, paragraph 1; Results, Assessment of firing
    patterns in different brain states, paragraph 1; Experimental Procedures
  quote: We recorded across different brain states from 11 rats ... Recordings from 27 sessions
    (294±137 min) ... This resulted in 995 putative pyramidal (pE) cells ... and 126 putative
    interneurons (pI)
  expected:
  - quantity: rats
    value: 11
    tolerance: 1.1
  - quantity: sessions
    value: 27
    tolerance: 2.7
  - quantity: mean session duration
    value: 294
    tolerance: 137
    unit: min
  - quantity: putative pyramidal cells
    value: 995
    tolerance: 99.5
  - quantity: putative interneurons
    value: 126
    tolerance: 12.6
  criterion: Counted over the files as deposited (22 files), with session duration from the
    first start to the last stop of the state table (the session's spike span is shown too).
    The spread given for duration is used as its tolerance. Reproduced when all five values
    are within tolerance, partially reproduced when at least three are, not reproduced
    otherwise. The counts in the 21 usable sessions are reported as well.
- id: fig2a-median-rates
  statement: Median firing rates of pE cells are 0.76 Hz in WAKE, 0.69 Hz in nonREM and 0.88 Hz
    in REM; of pI cells 5.59, 4.69 and 4.25 Hz.
  source: Results, Assessment of firing patterns in different brain states, paragraph 2; Figure 2A
  quote: "Median rates (±SD) of putative pyramidal cells in each state were: WAKE: 0.76±1.53 Hz,
    nonREM: 0.69±0.86 Hz, REM: 0.88±1.33 Hz; and for putative interneurons were: WAKE: 5.59±7.25 Hz,
    nonREM: 4.69±5.62 Hz, REM 4.25±9.43 Hz."
  expected:
  - quantity: pE median rate, WAKE
    value: 0.76
    tolerance: 0.076
    unit: Hz
  - quantity: pE median rate, nonREM
    value: 0.69
    tolerance: 0.069
    unit: Hz
  - quantity: pE median rate, REM
    value: 0.88
    tolerance: 0.088
    unit: Hz
  - quantity: pI median rate, WAKE
    value: 5.59
    tolerance: 0.559
    unit: Hz
  - quantity: pI median rate, nonREM
    value: 4.69
    tolerance: 0.469
    unit: Hz
  - quantity: pI median rate, REM
    value: 4.25
    tolerance: 0.425
    unit: Hz
  criterion: Each cell's rate over all epochs of a state in its session. Readings (a) WAKE
    without MAs, as defined above; (b) WAKE as every Awake epoch, MAs included. Reproduced
    when under one reading all six medians are within tolerance; partially reproduced when at
    least three are; not reproduced otherwise.
- id: fig2a-skewed-wide-distribution
  statement: The distribution of pE firing rates is strongly positively skewed and spans three
    orders of magnitude, from 0.05 to 5 Hz.
  source: Results, Assessment of firing patterns in different brain states, paragraph 2; Figure 2A
  quote: the distribution of per-cell mean firing rates for putative pyramidal neurons was strongly
    positively skewed ... spanning three orders of magnitude range from 0.05 Hz to 5 Hz (Figure 2A)
  criterion: On WAKE rates of pE cells (zero rates kept). Reproduced when the skewness of the
    rates in Hz is above 1 and the 2.5th and 97.5th percentiles lie within a factor of 2 of
    0.05 Hz and 5 Hz. The range is read from a log axis ("three orders of magnitude"), so the
    tolerance is a factor on that scale, not 10% of each bound. Partially reproduced when only
    one of the two holds. The same numbers for nonREM and REM are reported.
- id: fig2a-fraction-above-2hz
  statement: The fraction of pE cells firing above 2 Hz is 19.2% in WAKE, 19.2% in REM and 8.8%
    in nonREM (chi-square, p < 1e-10).
  source: Results, Assessment of firing patterns in different brain states, paragraph 2; Figure 2A
  quote: "The right tail extended toward higher rates during WAKE and REM compared to nonREM (Figure
    2A; fraction of >2 Hz neurons: WAKE= 19.2%; REM= 19.2%; nonREM= 8.8%; Chi-Square Test"
  statistics:
  - test: Chi-Square Test
    p: 1.0e-10
    p_relation: "<"
  expected:
  - quantity: fraction above 2 Hz, WAKE
    value: 19.2
    tolerance: 1.92
    unit: '%'
  - quantity: fraction above 2 Hz, REM
    value: 19.2
    tolerance: 1.92
    unit: '%'
  - quantity: fraction above 2 Hz, nonREM
    value: 8.8
    tolerance: 0.88
    unit: '%'
  criterion: Rates as in fig2a-median-rates, reading (a). Chi-square tests on the 2 x 2 tables
    of cells above and below 2 Hz, nonREM against WAKE and nonREM against REM. Reproduced when
    the three fractions are within tolerance and both tests give p < 1e-10 with nonREM lower;
    partially reproduced when the tests hold but a fraction is outside tolerance.
- id: fig2b-wake-nrem-slope
  statement: Per-cell nonREM and WAKE rates are highly correlated (R = 0.82), and the slope of
    their relation is below 1 (95% confidence interval 0.66 to 0.71), so state transitions act
    differently across the rate spectrum.
  source: Results, Assessment of firing patterns in different brain states, paragraph 2; Figure 2B
  quote: "Whereas nonREM and WAKE firing rates remained highly correlated on a per-cell basis (R =
    0.82 ... the slope of this relationship significantly deviated from 1 (Figure 2B) ... (95%
    confidence interval of slope: 0.66 – 0.71)"
  statistics:
  - about: correlation of nonREM and WAKE rates
    statistic: R = 0.82
    p: 1.0e-10
    p_relation: "<"
  - about: slope of the nonREM against WAKE rate relation
    ci:
      level: 0.95
      low: 0.66
      high: 0.71
  expected:
  - quantity: Pearson R, nonREM against WAKE rates
    value: 0.82
    tolerance: 0.082
  - quantity: slope of nonREM on WAKE rate
    value: 0.685
    tolerance: 0.096
  criterion: The slope is judged against the reported interval widened by 10% of each bound,
    0.594 to 0.781 (given above as its centre and half width). Readings (a) log10 rates,
    cells with a zero rate in either state left out, OLS of nonREM on WAKE; (b) rates in Hz,
    all pE cells. Reproduced when under one reading R is within tolerance, the slope is in the
    widened interval and its 95% confidence interval excludes 1; partially reproduced when the
    slope is below 1 with its interval excluding 1 under some reading but the values miss.
    The reverse regression (WAKE on nonREM) is shown as a check on regression to the mean.
- id: fig2-burst-index-by-state
  statement: The burst index (fraction of spikes with inter-spike intervals under 15 ms) is
    highest in nonREM (median 11.8%), lowest in WAKE (4.0%), with REM (5.5%) slightly above
    WAKE (Kruskal-Wallis, p < 0.05).
  source: Results, Assessment of firing patterns in different brain states, paragraph 3
  quote: Burst index was highest during nonREM (median in nonREM = 11.8%) and lowest during WAKE
    (4.0 %), with REM (5.5 %) slightly higher than WAKE (p < 0.05; Kruskal-Wallis test).
  statistics:
  - test: Kruskal-Wallis test
    p: 0.05
    p_relation: "<"
  expected:
  - quantity: median burst index, nonREM
    value: 11.8
    tolerance: 1.18
    unit: '%'
  - quantity: median burst index, WAKE
    value: 4.0
    tolerance: 0.4
    unit: '%'
  - quantity: median burst index, REM
    value: 5.5
    tolerance: 0.55
    unit: '%'
  criterion: Per pE cell and state, intervals between consecutive spikes in the same epoch of
    that state; cells with fewer than 10 such intervals in a state are left out of it.
    Readings (a) the fraction of intervals under 15 ms; (b) the fraction of spikes with an
    interval under 15 ms to the previous or the next spike. Reproduced when under one reading
    the three medians are within tolerance, the order is nonREM > REM > WAKE, and a
    Kruskal-Wallis test across the three states gives p < 0.05; partially reproduced when the
    order and test hold but a median misses.
- id: fig2c-acg-peaks
  statement: The average spike autocorrelogram of pE cells peaks near 8 ms in nonREM, with a
    smaller peak near 125 ms (theta) in REM and WAKE.
  source: Results, Assessment of firing patterns in different brain states, paragraph 3; Figure 2C
  quote: a large peak occurred at approximately 8ms inter-spike interval during nonREM, whereas
    smaller peaks were present at ~125 ms (i.e., theta frequency) during REM and WAKE (Figure 2C)
  criterion: Per pE cell and state, counts of spike-time differences at 1 ms resolution from 0
    to 300 ms, pairs within the same epoch, divided by the cell's spike count in the state;
    averaged over cells with at least 100 spikes in the state. NREM peak is the argmax from 2
    to 50 ms. The theta peak is the location of the maximum of the mean autocorrelogram
    smoothed with a 21 ms moving average between 60 and 250 ms, required to lie at least 3 ms
    inside that window. Reproduced when the nonREM peak is at 7 to 9 ms (8 ms plus or minus
    10%, rounded to whole bins) and the theta peak in both REM and WAKE is within 112.5 to
    137.5 ms; partially reproduced when one of the two parts holds.
- id: fig2c-acg-decay
  statement: The autocorrelogram of pE cells decays faster in nonREM than in WAKE and REM (decay
    fit exponent medians -1.35, -0.83 and -0.80; Kruskal-Wallis p < 0.05).
  source: Results, Assessment of firing patterns in different brain states, paragraph 3; Figure 2C
  quote: Time decay of the autocorrelograms of pyramidal neurons was significantly faster during
    nonREM compared to WAKE and REM (Figure 2C; decay fit exponent median nonREM = – 1.35, WAKE = –
    0.83, REM = – 0.80; p < 0.05; Kruskal-Wallis test).
  statistics:
  - test: Kruskal-Wallis test
    p: 0.05
    p_relation: "<"
- id: fig2f-rate-group-correlations
  statement: In nonREM, pairs of fast-firing pE cells are positively correlated, while pairs of
    one slow and one fast cell are negatively correlated.
  source: Results, Assessment of firing patterns in different brain states, paragraph 5; Figure 2F
  quote: the fastest and slowest firing neurons tended to be positively correlated within groups,
    but were actually negatively correlated across groups (Figure 2F).
  criterion: Pearson correlation of spike counts in 100 ms bins over nonREM packets, for every
    pair of pE cells in the same session; mean correlation for each of the 21 combinations of
    six rate groups. Readings for the groups (a) WAKE-rate sextiles as above; (b) sextiles of
    the rate over the whole session. Reproduced when under one reading the mean correlation of
    group (6,6) pairs is positive and the largest of the 21, and that of (1,6) pairs is below
    zero by a two-sided one-sample t-test at p < 0.05; partially reproduced when only the
    (6,6) part holds.
- id: ma-statistics
  statement: Microarousals have a median duration of 15.9 plus or minus 3.3 s, occur 0.32 plus
    or minus 0.12 times per minute and occupy 9.1 plus or minus 3.5% of SLEEP (790 in total).
  source: Results, Identification of brain states, paragraph 2
  quote: There were a total of 790 MAs in our dataset (median duration = 15.9±3.3sec; frequency =
    0.32±0.12 per minute; 9.1±3.5% of time in SLEEP).
  expected:
  - quantity: median MA duration
    value: 15.9
    tolerance: 3.3
    unit: s
  - quantity: MA frequency
    value: 0.32
    tolerance: 0.12
    unit: per min
  - quantity: fraction of SLEEP time in MA
    value: 9.1
    tolerance: 3.5
    unit: '%'
  criterion: MAs derived from the state table as defined above; the paper's spreads are the
    tolerances. Readings (a) MAs inside SLEEP periods, frequency and fraction per session over
    SLEEP time, then averaged over sessions, median duration over all those MAs; (b) all MAs,
    pooled over sessions, frequency per minute of nonREM episode time. Reproduced when under
