# Claims for Duszkiewicz, Orhan, Skromne Carrasco, Brown, Owczarek, Vite, Wood & Peyrache (2024),
# Nature Neuroscience 27, 782-792, on dandiset 000939.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record as served by Europe PMC (PMC11001581), main text, figure
# legends, Methods and Extended Data figure legends, with both supplements: the Supplementary
# Information (41593_2024_1588_MOESM1_ESM.pdf, Supplementary Methods on model fitting and theory)
# and the Reporting Summary (MOESM2). The main article's PDF was not supplied, so the figures
# were not seen. Values printed only on figure panels (the r values of Fig. 6c and Extended Data
# Fig. 9, the CV of Fig. 4f, medians in Fig. 2 and 3, most p-values) are not recorded. Most
# legends give a z statistic and no p-value; those z values are given in the criteria, as the
# claims schema records a statistic only with a p-value.
#
# Code read: the paper's Code availability, figshare doi:10.6084/m9.figshare.24921252 (version 3,
# published 2025-12-11), files MatlabCode_Duszkiewicz2024.zip (md5 8f391dec0d3fa120ef58f3158443f5df)
# and SessionLists_ForAnalysis.zip (md5 5653a94673ce2db0da9ac38a38800413). It holds the MATLAB
# scripts that compute every analysis but the simulations (Duszkiewicz2024_Get*.m per session,
# Duszkiewicz2024_Figure_*.m per figure), their dependencies (TStoolbox, CircStat, the
# Dimensionality Reduction Toolbox, FindSynapse_Exc and cch_conv) and the session lists
# (dataset_All.list, 32 PoSub sessions; dataset_All_FT.list, the 32 plus 19 ADN sessions;
# dataset_All_Rem.list, 28; dataset_Stability.list, 19; dataset_Opto.list, 21; dataset_cuerot.list,
# 7). The Python code of the simulations and model fit (Fig. 4, Extended Data Fig. 5,
# Supplementary Methods) is not deposited there. The data files of the figshare item were not
# opened.
#
# Where the code settles what the Methods leave open, the criteria follow it and say so. Where
# they disagree the Methods are followed and the code's choice is named as a variant. The
# disagreements found are these. (1) Cell classes. Methods give a trough-to-peak cut of 0.4 ms;
# Duszkiewicz2024_GetCellTypes_PoSub.m uses 0.35 ms (FS at or below 0.35 ms and at least 10 Hz,
# excitatory above 0.35 ms and at most 10 Hz). (2) Fourier power. Methods call the power "the root
# mean square of the projection values onto the sine and cosine basis"; the code takes the
# squared modulus of the complex coefficient (ft .* conj(ft)), which is what makes the Parseval
# check of Extended Data Fig. 3e hold. Both are named as readings, as the Methods' own text
# allows both. (3) KL divergence. Methods give D_KL(sigma_i || S); the code's KLDiv(S, sigma_i)
# computes D_KL(S || sigma_i). (4) The as-shipped Figure_Fourier.m keeps only PoSub-HD cells with
# a multipeak score below 0.05 for every Fourier analysis, which is the Extended Data Fig. 3k
# control; the legends' n = 1,602 shows that Fig. 3 used all PoSub-HD cells. (5) Stability
# analyses (Figure_Stability.m) take the tuning curves smoothed at 2 degrees (index smoothTC, not
# smoothTC+1); Methods give 3 degrees throughout. (6) Widths before and during light (Extended
# Data Fig. 7d, i) are tested with the Wilcoxon signed-rank test in the legends and with ranksum
# in the code. (7) The opto exclusion rule (below). (8) The cue rotation epoch exclusion rule
# (fig2f-cue-rotation). (9) Extended Data Fig. 4a is tested with the Wilcoxon signed-rank test in
# the legend and with ranksum in the code.
#
# The data the paper used. Electrophysiology in 43 adult male mice (VGAT-IRES-Cre, PV-IRES-Cre or
# SST-IRES-Cre crossed with C57BL/6J; one C57BL/6J x FVB mouse with a Neuropixel 1.0 probe for
# Fig. 1a-c). PoSub was recorded with 64-channel H5 linear probes, vertically (931 units, 14
# mice) or parallel to the cell layers (1,999 units, 18 mice), one session per mouse; ADN with
# four-shank Buzsaki32 probes, several sessions per mouse (97 ADN-HD cells, 8 mice). Each session
# is a home-cage sleep epoch, square open-field exploration (80 cm walls), a second sleep epoch,
# and in a subset a triangular open field, a cue rotation session (6 sessions) or, in
# VGAT-Cre mice with ArchT or control virus in TRN and optic fibres over ADN, a second
# exploration with 240 one-second 520 nm light pulses (PoSub ArchT 83 HD and 47 FS cells from 5
# mice; control 89 HD and 38 FS cells from 3 mice; ADN 127 thalamic cells including 52 HD cells
# from 3 mice). Signals at 20 kHz, spikes sorted with Kilosort 2.0 and curated; head direction
# (yaw of the Optitrack headcap) at 100 Hz; sleep scored with SleepScoreMaster (REM, NREM, WAKE).
# Measured variables are spike times, mean waveforms (trough-to-peak), head direction, position
# and speed, sleep states, light pulse times, and probe channel positions.
#
# The dandiset ("Large-scale recordings of head direction cells in mouse postsubiculum"), by its
# description, holds the PoSub H5-probe recordings, one session per mouse, 31 mice, 42 to 185
# units per recording, each with a square open field and two sleep epochs and some with a
# triangle or an optogenetic stimulation epoch, with spike times, waveforms, position, head
# direction, sleep scoring and raw data. These are the figshare Datasets 1 (17 parallel) and 2
# (14 vertical). The paper's PoSub list has 32 sessions, so counts over the dandiset may fall a
# little short of the paper's. The ADN recordings (figshare Dataset_5), the cue rotation sessions
# (Dataset_3), the Neuropixel session (Dataset_4) and the ADN and other opto sessions (Dataset_6)
# are on figshare only; the claims that need them have data elsewhere. Whether the dandiset
# holds the control-virus PoSub opto sessions is for the author to find.
#
# Method fixed for every PoSub claim, from the Methods and the code. Units with mean rate at
# least 0.5 Hz over the square open-field epoch and a negative-going waveform (the code's
# waveform features are NaN for positive spikes). FS cells, trough-to-peak below 0.4 ms and rate
# above 10 Hz; excitatory, trough-to-peak above 0.4 ms and rate below 10 Hz (code variant 0.35
# ms). HD cells, excitatory cells with HD information above 0.2 bits per spike, the 99th
# percentile of the time-reversed control (the computed percentile is a second reading). Tuning
# curves, spike count over occupancy in 1 degree bins, smoothed with a Gaussian of 3 degrees s.d.,
# from times in the square epoch (first to last tracked sample) with speed above 2 cm/s. HD
# information as the Methods' formula, in bits per spike, from the smoothed curve. Time-reversed
# control, the HD series reversed in time within the epoch. Tuning curve width, from the code
# (Figure_Fourier.m), the full width at half maximum of the peak-aligned, max-normalized curve
# averaged over its two sides. Fourier signature, the projection of the 360-bin curve on the
# harmonics 1 to 180, power per harmonic, the first ten normalized to their sum. All tests
# two-tailed (Methods).
schema_version: 2
dataset:
  archive: dandi
  id: "000939"
paper: doi:10.1038/s41593-024-01588-5
claims:
- id: cell-classes-counts
  statement: PoSub units split into 1,835 putative excitatory cells and 427 putative FS cells by
    firing rate and waveform, and 1,602 excitatory cells (87%) were HD cells with HD information
    above 0.2 bits per spike; the vertical recordings gave 931 units from 14 mice and the parallel
    ones 1,999 units from 18 mice.
  source: Results, High-density recordings in the PoSub of freely moving mice, paragraph 1;
    Methods, Spike sorting and unit classification, and HD tuning curves and tuning metrics
  quote: The probe was implanted either vertically ( n = 931 units from 14 mice, range ... or
    parallel to PoSub cell layers ( n = 1,999 units from 18 mice ... PoSub units were subdivided
    into putative excitatory cells ( n = 1,835) and putative PoSub-FS cells ( n = 427) based on
    mean firing rate and waveform shape ... were classified as PoSub-HD cells (>0.2 bits per
    spike, n = 1602, 87% of excitatory cells
  expected:
  - quantity: putative excitatory cells
    value: 1835
    tolerance: 184
  - quantity: putative FS cells
    value: 427
    tolerance: 43
  - quantity: PoSub-HD cells
    value: 1602
    tolerance: 160
  - quantity: fraction of excitatory cells that are HD cells
    value: 0.87
    tolerance: 0.087
  - quantity: units in vertical recordings
    value: 931
    tolerance: 93
  - quantity: units in parallel recordings
    value: 1999
    tolerance: 200
  criterion: Classification as fixed in the opening comment (Methods). The 0.4 ms trough-to-peak
    cut is the main reading and the code's 0.35 ms a variant; the HD threshold is read as 0.2
    bits per spike (Results, Methods and code) and as the 99th percentile of the excitatory
    cells' time-reversed HD information (Methods' definition). The fraction can be 87% (Results)
    or 85% (Methods, "85% of putative excitatory cells"); either value within tolerance counts.
    Unit counts are over all units of each probe orientation as the dandiset's metadata gives it.
    The dandiset holds 31 of the 32 sessions, so a count below the paper's by one session's
    cells is reported as such. If the dandiset carries its own cell-type labels, they are
    compared with the recomputed classes and both counts are shown.
- id: ed2b-excitatory-hd-information
  statement: Putative excitatory PoSub cells carry more HD information than their time-reversed
    controls, and HD information across all PoSub cells is bimodal.
  source: Extended Data Fig. 2b,c
  quote: Distribution of HD information carried by tuning curves of putative excitatory cells in
    PoSub ( n = 1835; Wilcoxon signed rank test vs time-reversed control, z = 37.1
  criterion: As in Duszkiewicz2024_Figure_BasicProperties.m, log10 HD information of each
    excitatory cell against that of its time-reversed control, Wilcoxon signed-rank test, paired
    by cell. The paper reports z = 37.1 and no p-value. Reproduced when p < 0.05 with the real
    median above the control median. The bimodality of Extended Data Fig. 2c is shown, not judged.
- id: fig2a-fs-hd-information
  statement: The HD information carried by PoSub-FS cell tuning curves is higher than that of
    their time-reversed controls.
  source: Results, Tuning of PoSub-FS cells is stable and anchored to landmarks, paragraph 1;
    Figure 2a
  quote: at the population level, the quantity of HD information conveyed by PoSub-FS cells was
    significantly higher than that of the time-reversed control
  depends_on:
  - cell-classes-counts
  criterion: As in Duszkiewicz2024_Figure_BasicProperties.m, log10 HD information of each FS cell
    against its time-reversed control, Wilcoxon signed-rank test (Fig. 2a legend, n = 427, z =
    17.9, no p-value printed). Reproduced when p < 0.05 and the median of the real values is above
    that of the controls. The median HD information of PoSub-HD cells (the dashed line of Fig. 2a)
    is reported alongside.
- id: fig2b-decoding-from-fs
  statement: The animal's HD can be decoded accurately from PoSub-FS cell spiking with a Bayesian
    decoder built on their tuning curves, and decoding error falls as more FS cells are used.
  source: Results, Tuning of PoSub-FS cells is stable and anchored to landmarks, paragraph 1;
    Figure 2b; Extended Data Fig. 2e
  quote: The information contained in PoSub-FS cell tuning curves was sufficient to accurately
    decode the animal's HD from PoSub-FS cell spiking activity
  depends_on:
  - cell-classes-counts
  criterion: The Methods do not describe this decoder; Duszkiewicz2024_GetBayesianDecoding.m
    settles it. Tuning curves (360 bins, 3 degree smoothing) from the first half of the square
    epoch at speed above 2 cm/s; spike counts in 100 ms bins smoothed with a Gaussian of 2 bins
    s.d.; one-dimensional Bayesian decoding (Poisson) over the second half of the epoch, all
    times; error as the absolute angular difference from the real HD, median per session; the
    same with time-reversed tuning curves gives the chance level. Reproduced when the mean over
    the sessions (32 in the paper) of the FS decoder's median error is below the chance level
    (the mean of the control medians, as Extended Data Fig. 2e draws it) and the Pearson
    correlation across sessions between the number of FS cells and the median error is negative
    with p < 0.05 (Extended Data Fig. 2e, Pearson, n = 32). The HD-cell decoder's error is shown
    for comparison.
- id: fig2c-geometry-independent
  statement: The tuning of PoSub-FS cells is preserved between the square and triangular arenas,
    as it is for PoSub-HD cells.
  source: Results, Tuning of PoSub-FS cells is stable and anchored to landmarks, paragraph 2;
    Figure 2c; Extended Data Fig. 2j
  quote: the tuning of PoSub-FS cells was stable within a single exploration epoch (Extended Data
    Fig. 2h ) and independent of the enclosure geometry (Fig. 2c ), reflecting the properties of
    canonical PoSub-HD cells
  depends_on:
  - cell-classes-counts
  criterion: Sessions with a triangle epoch. Selection from Figure_Stability.m, FS cells with rate
    above 10 Hz and HD cells with rate above 0.5 Hz in both arenas. The triangle tuning curves of
    each session are shifted back by the circular mean rotation of its HD cells (the lag of
    maximum square-triangle cross-correlation), as the Methods say; then the Pearson correlation
    at zero lag of each cell's square and triangle curves, against the same for time-reversed
    curves, Wilcoxon signed-rank (Fig. 2c, n = 264 FS cells, z = 14.0; Extended Data Fig. 2j,
    n = 1,013 HD cells, z = 27.6; no p-values printed). Reproduced when both tests give p < 0.05
    with real correlations above the controls. Curves smoothed at 3 degrees (Methods); the code's
    2 degrees is a variant.
- id: ed2hi-within-epoch-stability
  statement: Tuning curves of PoSub-FS and PoSub-HD cells computed from the two halves of the
    square-arena epoch are correlated above their time-reversed controls.
  source: Extended Data Fig. 2h,i
  quote: PoSub-FS cell tuning curve correlation across two halves of the square arena epoch
  depends_on:
  - cell-classes-counts
  criterion: As in Figure_Stability.m and GetHdTuning_xval.m, tuning curves from the two halves
    of the movement epoch, zero-lag Pearson correlation per cell against the time-reversed halves,
    Wilcoxon signed-rank (FS n = 427, z = 17.8; HD n = 1,602, z = 34.7; no p-values printed).
    Reproduced when both give p < 0.05 with real correlations higher. Smoothing at 3 degrees
    (Methods), 2 degrees (code) as a variant.
- id: fig2f-cue-rotation
  statement: In a cue rotation task PoSub-FS cell tuning curves follow the rotated distal landmark
    together with PoSub-HD cells.
  source: Results, Tuning of PoSub-FS cells is stable and anchored to landmarks, paragraph 2;
    Figure 2d-f
  quote: PoSub-FS cell tuning curves followed the rotated distal landmark in concert with PoSub-HD
    cells
  data: elsewhere
  where: figshare doi:10.6084/m9.figshare.24921252 version 3, Dataset_3.tar.gz (cue rotation, 6
    sessions)
  criterion: Per the Methods (Analysis of HD cell realignment after cue rotation) and
    Figure_CueRotation.m. Rotation epochs kept when the decoder error over the next 200 s exceeds
    45 degrees and the animal moved (mean speed at least 2 cm/s) in the preceding epoch;
    realignment ends at 0.99 of a fitted sigmoid; per FS cell the mean absolute difference between
    its rotation and the mean rotation of the session's HD cells, against the time-reversed
    control, Wilcoxon signed-rank (n = 99 FS cells, z = 8.25, no p-value printed). Reproduced when
    p < 0.05 with real differences smaller than control. The Methods' exclusion reads "(1) ... and
    (2)"; it is read as excluding epochs that fail either condition and, as a second reading,
    both. The code (Duszkiewicz2024_GetSigmoids_CueRotation.m) uses another rule, run as a
    variant. It excludes an epoch when the change in circular mean decoder error from the
    previous epoch is below 45 degrees, or the circular variance of the error (converted with
    rad2deg) exceeds 10, or the mean absolute angular head velocity is below 10; it has no speed
    condition.
- id: fig3c-adn-broader
  statement: ADN-HD cells have broader tuning curves than PoSub-HD cells.
  source: Results, Equivalence of PoSub-HD and FS cell tuning in Fourier space, paragraph 1;
    Figure 3c
  quote: In mice, ADN-HD cells tend to have broader HD tuning curves than PoSub-HD cells
  data: elsewhere
  where: figshare doi:10.6084/m9.figshare.24921252 version 3, Dataset_5.tar.gz (ADN recordings)
  depends_on:
  - cell-classes-counts
  criterion: Width as in the opening comment (code). Mann-Whitney U test of PoSub-HD against
    ADN-HD widths (n = 1,602 and 97, z = 11.4, no p-value printed). Reproduced when p < 0.05 with
    the ADN median wider. ADN-HD cells are classified by Duszkiewicz2024_GetCellTypes_ADN.m.
- id: fig3-ten-components-power
  statement: Fourier power of tuning curves decays quickly with frequency, and the first ten
    components hold on average 98% of the total power.
  source: Results, Equivalence of PoSub-HD and FS cell tuning in Fourier space, paragraph 2
  quote: Across the cell population, the Fourier power decayed rapidly as a function of
    frequency. Hence, for clarity, we focused our analysis on the relative power of the first ten
    Fourier components that contained, on average, 98% of the total power
  expected:
    quantity: mean fraction of power (harmonics 1 to 180) in harmonics 1 to 10
    value: 0.98
    tolerance: 0.02
  depends_on:
  - cell-classes-counts
  criterion: The tolerance is 0.02 because a fraction cannot exceed 1, so 10% of the value would
    not test it. "The cell population" is read as (a) PoSub-HD and PoSub-FS cells pooled (the
    dandiset) and (b) each of the two separately; ADN-HD cells, when available, as a variant. Power
    is read as (a) the squared modulus of the complex coefficient (code, and the Parseval check of
    Extended Data Fig. 3e) and (b) the root mean square of the sine and cosine projections
    (Methods' words). Reproduced when one population reading under each power reading is within
    tolerance.
- id: fig3e-fourier-signatures-differ
  statement: The average Fourier signatures of PoSub-FS, PoSub-HD and ADN-HD populations differ,
    with ADN-HD cells having more power at low and less at high components than PoSub-HD and
    PoSub-FS cells, which are alike.
  source: Results, Equivalence of PoSub-HD and FS cell tuning in Fourier space, paragraph 3;
    Figure 3e; Extended Data Fig. 3f
  quote: the Fourier signature of ADN-HD cells was different from both PoSub-HD and PoSub-FS
    cells, with higher power at low frequencies and lower power at higher frequencies
  statistics:
  - test: two-way ANOVA, Fourier component by cell type interaction
    statistic: F (9,19116) = 2.76
    p: 0.003
    n: 427 PoSub-FS, 1,602 PoSub-HD and 97 ADN-HD cells
  data: elsewhere
  where: figshare doi:10.6084/m9.figshare.24921252 version 3, Dataset_5.tar.gz (ADN recordings)
  depends_on:
  - cell-classes-counts
  criterion: As in Figure_Fourier.m, a repeated-measures ANOVA (fitrm and ranova) of the ten
    normalized powers with cell type as the between-subjects term; the component by cell type
    interaction. The code enters cell type as a numeric covariate (PoSub-FS 1, PoSub-HD 2, ADN-HD
    3), which is what gives the paper's degrees of freedom (9, 19116) for 2,126 cells; a
    categorical factor would give (18, 19107). The numeric coding is the main reading and the
    categorical factor a variant. The paper does not say which components are "low" and "high";
    the readings are (a) the ADN-HD mean signature above both PoSub means at component 1 and below
    both summed over components 3 to 10, and (b) the ADN-HD cumulative signature (Fig. 3e inset)
    above both PoSub cumulative signatures at every component from 1 to 9. Reproduced when p <
    0.05 and the direction holds under both readings. Both power readings (squared modulus, code;
    root mean square, Methods) are run. The same ANOVA on PoSub-FS and PoSub-HD only, which the
    dandiset alone allows, is shown as a variant and not judged.
- id: fig3f-posub-hd-closer-to-fs
  statement: Individual PoSub-HD cell Fourier spectra are closer to the average PoSub-FS signature
    than ADN-HD cell spectra are.
  source: Results, Equivalence of PoSub-HD and FS cell tuning in Fourier space, paragraph 3;
    Figure 3f
  quote: we found that the average Fourier signature of the PoSub-FS cell population was often
    indistinguishable from the Fourier signatures of individual PoSub-HD cells
  statistics:
  - test: Mann-Whitney U test
    p: 1.0e-9
    p_relation: "<"
    n: 1,602 PoSub-HD and 97 ADN-HD cells
  data: elsewhere
  where: figshare doi:10.6084/m9.figshare.24921252 version 3, Dataset_5.tar.gz (ADN recordings)
  depends_on:
  - cell-classes-counts
  criterion: KL divergence between each HD cell's ten-component spectrum and the mean PoSub-FS
    spectrum, Mann-Whitney U of PoSub-HD against ADN-HD. Readings, all run, for what the paper
    leaves open or states against its code. Divergence direction, D_KL(sigma_i || S) (Methods)
    and D_KL(S || sigma_i) (code). Power, squared modulus (code) and root mean square (Methods).
    Reproduced when p < 1e-9 with the PoSub-HD median smaller under every reading; partially
    reproduced when p < 0.05 with PoSub-HD smaller under every reading but p is not below 1e-9 in
    all. PoSub-HD cells are all HD cells (n = 1,602); the shipped code's multipeak filter is the
    Extended Data Fig. 3k control.
- id: ed3k-robust-to-controls
  statement: The smaller distance of PoSub-HD than ADN-HD spectra from the PoSub-FS signature holds
    after excluding multipeaked HD cells, after excluding noisy clusters, and with a 10 cm/s speed
    threshold; ADN-HD cells have higher multipeak scores than PoSub-HD cells.
  source: Results, Equivalence of PoSub-HD and FS cell tuning in Fourier space, paragraph 3;
    Extended Data Fig. 3j,k
  quote: the similarity between PoSub-HD and PoSub-FS cell Fourier signatures on a population level
    was preserved when the analysis was limited to HD cells with a single receptive field.
    Additionally, it was preserved when a threshold was applied to keep only the best isolated
    unit clusters or when a higher velocity threshold was used to compute tuning curves
  data: elsewhere
  where: figshare doi:10.6084/m9.figshare.24921252 version 3, Dataset_5.tar.gz (ADN recordings)
  depends_on:
  - fig3f-posub-hd-closer-to-fs
  criterion: The Fig. 3f test under each control, with the readings of fig3f-posub-hd-closer-to-fs.
    Multipeak score as the Methods define it, the mean of the normalized curve outside its peak
    (plus or minus the width from the maximum), cells kept below 0.05 (code, Figure_Fourier.m);
    expected n = 789 and 69, z = 10.4. Contamination score, spike autocorrelogram at plus or minus
    100 ms in 1 ms bins, value at 0.1 ms over the highest value, clusters kept at or below 0.2;
    n = 1,472 and 83, z = 5.91. Speed above 10 cm/s; n = 1,602 and 97, z = 6.46. Multipeak scores,
    Mann-Whitney U, n = 1,602 and 97, z = 4.25. No p-values are printed. Reproduced when all four
    tests give p < 0.05 in the paper's direction under every reading.
- id: fig3g-first-three-components
  statement: Compared with time-reversed controls, the PoSub-FS spectrum has higher power for the
    first three Fourier components only.
  source: Results, Equivalence of PoSub-HD and FS cell tuning in Fourier space, paragraph 4;
    Figure 3g
  quote: Compared to controls, the spectrum of PoSub-FS cells showed higher power for the first
    three Fourier components only
  statistics:
  - about: component by condition interaction, FS against time-reversed control
    test: two-way ANOVA, Fourier component by cell type interaction
    statistic: F (9,3834) = 64.1
    p: 4.0e-110
    n: 427 PoSub-FS cells
  - about: first component, FS against control
    test: Wilcoxon signed-rank test
    statistic: z = 0.65
    p: 8.0e-10
    corrected: Bonferroni
    n: 427 PoSub-FS cells
  - about: second component, FS against control
    test: Wilcoxon signed-rank test
    statistic: z = 0.85
    p: 3.0e-16
    corrected: Bonferroni
    n: 427 PoSub-FS cells
  - about: third component, FS against control
    test: Wilcoxon signed-rank test
    statistic: z = 0.46
    p: 4.0e-5
    corrected: Bonferroni
    n: 427 PoSub-FS cells
  depends_on:
  - cell-classes-counts
  criterion: As in Figure_Fourier.m, ten normalized powers of each FS cell and of its time-reversed
    curve; repeated-measures ANOVA with condition and component as within factors (the
    interaction); then a Wilcoxon signed-rank test per component with p multiplied by 10. The code
    divides the printed z by 10, which is why the legend's z values are small; the test's own z is
    reported too. Reproduced when the interaction has p < 0.05 and components 1, 2 and 3, and no
    other, are significantly higher than control after correction. Both power readings are run.
- id: fig3h-dominant-component
  statement: Of the 427 PoSub-FS cells, 231, 141 and 55 have their highest power in the first,
    second and third Fourier component, proportions similar to the relative mean power of those
    components.
  source: Results, Equivalence of PoSub-HD and FS cell tuning in Fourier space, paragraph 4; Figure
    3h; Extended Data Fig. 4a legend
  quote: The proportions of recorded PoSub-FS cells with the highest relative power in each of the
    first three Fourier components were similar to the relative mean power for the population
  expected:
  - quantity: FS cells with highest power in component 1
    value: 231
    tolerance: 23
  - quantity: FS cells with highest power in component 2
    value: 141
    tolerance: 14
  - quantity: FS cells with highest power in component 3
    value: 55
    tolerance: 6
  depends_on:
  - cell-classes-counts
  criterion: The counts are those of Extended Data Fig. 4a (n = (231, 141, 55)), each cell assigned
    to the largest of its first three powers (code, highComp; the power reading does not change
    the assignment). "Similar" is not defined; the readings are (a) the three proportions are in
    the same order as the mean relative powers of components 1 to 3 renormalized over those three,
    and (b) each proportion is within 10% of its renormalized mean power. Reproduced when the
    counts are within tolerance and both readings hold under both power readings; partially
    reproduced when the counts hold and only one reading does.
- id: ed3g-fs-spectra-heterogeneous
  statement: Fourier signatures are far more variable among PoSub-FS cells than among HD cells of
    the same region, so individual FS cells are narrowly tuned in Fourier space.
  source: Results, Equivalence of PoSub-HD and FS cell tuning in Fourier space, paragraph 5;
    Extended Data Fig. 3g
  quote: while the shape of Fourier signatures was largely uniform among HD cells from the same
    brain region, it was highly variable among PoSub-FS cells
  statistics:
  - about: cell type effect on distance from own population mean
    test: one-way ANOVA
    statistic: F (2,2123) = 169
    p: 5.0e-69
    n: 427 PoSub-FS, 1,602 PoSub-HD and 97 ADN-HD cells
  depends_on:
  - cell-classes-counts
  criterion: Distance of each cell's spectrum from its own population's mean spectrum. The legend
    says "statistical distance" and its abbreviations name D_KL; the code (Figure_Fourier.m,
    ftDist) uses the Euclidean distance over the ten components for the ANOVA and the tests. Both
    are run, with both power readings. The part the dandiset holds is FS against PoSub-HD,
    Mann-Whitney U, p multiplied by 3 (legend z = 5.71, a third of the test's z as the code
    divides it; no p printed). Reproduced when that test gives p < 0.05 with FS distances larger
    under every reading. The ANOVA and the comparisons with ADN-HD (z = 3.40 and 0.45) are run
    when the figshare ADN data are used and are reported.
- id: ed3l-fs-phases-independent
  statement: Phases of the Fourier components are correlated with each other in individual HD
    cells but random relative to each other in PoSub-FS cells.
  source: Results, Equivalence of PoSub-HD and FS cell tuning in Fourier space, paragraph 5;
    Extended Data Fig. 3l
  quote: In contrast, the Fourier components of individual PoSub-FS cells had random phases
    relative to each other
  depends_on:
  - cell-classes-counts
  criterion: As in Figure_Fourier.m, phase of each component as the angle of the complex
    coefficient; circular correlation (circ_corrcc) between twice the first phase (mod 2 pi) and
    the second phase, and between three times the first phase and the third phase, across cells
    (Extended Data Fig. 3l, 1,602 PoSub-HD and 427 PoSub-FS cells). The FS part is a claim of
    absence judged on that test at p < 0.05. Reproduced when both PoSub-HD correlations are
    significant and neither FS correlation is; the coefficients are reported either way. ADN-HD
    cells are a variant when their data are used.
- id: ed4a-autocorrelogram-symmetries
  statement: Tuning curve auto-correlograms of FS cells with the highest power in the second
    component peak at 180 degrees, and those with the highest power in the third at 120 and 240
    degrees, above controls.
  source: Results, Equivalence of PoSub-HD and FS cell tuning in Fourier space, paragraph 6;
    Extended Data Fig. 4a
  quote: Auto-correlograms of tuning curves for cells with maximum power for the second component
    showed a second maximum at 180°, reflecting their twofold radial symmetry. For cells with
    maximum power in the third component, auto-correlograms peaked at 120° and 240°
  depends_on:
  - fig3h-dominant-component
  criterion: Cross-validated auto-correlograms as the Methods and GetTuningAutocorr_xval.m give
    them (z-scored curves from the two halves of the movement epoch, Pearson correlation at each
    circular shift). As in Figure_Fourier.m, the value at 180 degrees (row 181) for twofold cells
    and at 120 degrees (row 121) for threefold cells, each against the same value from the
    time-reversed curves; the code tests no value at 240 degrees, which is shown and not judged.
    Test, Wilcoxon signed-rank (legend, n = 141 and 55; no statistic printed); the code's
    Mann-Whitney U (ranksum) is a variant. Reproduced when both give p < 0.05 with real values
    higher.
- id: ed4cd-isomap-posub-central
  statement: In a joint Isomap embedding of tuning curve auto-correlograms, PoSub-HD cells lie
    nearer the centre of the PoSub-FS distribution than ADN-HD cells.
  source: Results, Equivalence of PoSub-HD and FS cell tuning in Fourier space, paragraph 6;
    Extended Data Fig. 4c,d
  quote: The distribution of PoSub-HD cells occupied the center of the PoSub-FS cell distribution
    while that of ADN-HD cells was closer to the periphery
  data: elsewhere
  where: figshare doi:10.6084/m9.figshare.24921252 version 3, Dataset_5.tar.gz (ADN recordings)
  depends_on:
  - cell-classes-counts
  criterion: As in the Methods and Figure_Fourier.m, Isomap (12 neighbours, 2 dimensions) on the
    cross-validated auto-correlograms of all FS, PoSub-HD and ADN-HD cells together; Euclidean
    distance of each HD cell to the mean FS position; Mann-Whitney U of PoSub-HD against ADN-HD
    (n = 1,602 and 97, z = 4.26, no p printed). Reproduced when p < 0.05 with PoSub-HD distances
    smaller.
- id: fig4-random-connectivity-simulation
  statement: In simulation, random linear combinations of HD-tuned inputs preserve the input
    population's average Fourier spectrum, and the proportions of outputs dominated by the first
    three components converge to those of PoSub-FS cells when the s.d. of the weights exceeds
    their mean.
  source: Results, PoSub-FS cell tuning reveals key circuit properties, paragraphs 1 and 2; Figure
    4a-d,g; Extended Data Fig. 5
  quote: random connectivity preserved the Fourier spectrum of the input population ... This
    convergence emerged for weight distributions in which the standard deviation (s.d.) exceeded
    the mean of the weights
  data: elsewhere
  where: none deposited; the simulation code (Python, Methods, Data analysis and statistics) is not
    in figshare doi:10.6084/m9.figshare.24921252 version 3
  criterion: A result of simulation, not of the recordings. It can be tested only by rerunning a
    simulation the paper does not fully specify (input tuning widths, number of inputs, the
    log-normal weight parameters, 30 simulations per point); the author reports it as not testable
    from the dataset unless the simulation code is found.
- id: fig4f-synaptic-weights-dispersed
  statement: Putative synaptic weights from PoSub-HD to PoSub-FS cells, estimated from spike train
    cross-correlograms, are heavy-tailed with an s.d. larger than their mean, in the range where
    simulations predict the radial symmetries of FS tuning.
  source: Results, PoSub-FS cell tuning reveals key circuit properties, paragraph 2; Figure 4e,f;
    Extended Data Fig. 2f,g
  quote: The distribution was heavy-tailed (Fig. 4f ), with the ratio of s.d. and mean input weight
    (i.e. coefficient of variation), in the range where in silico simulation predicted the
    emergence of radial symmetries
  depends_on:
  - cell-classes-counts
  criterion: Detection from the Methods (Detection of monosynaptic connections) with details from
    GetSpikeCrosscorrs.m, GetSynapticPairs.m and Figure_SynapticConnections.m. Cross-correlograms
    in 0.2 ms bins over plus or minus 50 ms (Methods; the code's plus or minus 25 ms is a
    variant), baseline from convolution with a partially hollowed Gaussian of about 4 ms s.d.
    (cch_conv, window 41 bins), upper bound the 99th percentile of the Poisson distribution at the
    largest predicted count within 0 to 2 ms, at least two consecutive bins above it; HD cell as
    reference with the peak at positive lag, latency above 0.5 ms, no peak at negative lag. Weight
    as the code's strZ, peak minus prediction over the square root of the prediction (the ratio
    strR is a variant). The paper prints no CV in the text; Figure 4g and the sentence above make
    the threshold s.d. greater than the mean. Reproduced when the CV of the weights over all
    putative HD-to-FS connections exceeds 1 and their skewness is positive.
- id: fig4h-model-fit
  statement: A model fit to the PoSub-FS tuning statistics gives near-Gaussian weights from ADN-HD
    inputs and heavy-tailed weights from PoSub-HD inputs, so that FS tuning is best explained by
    flat, high-rate ADN input and HD-modulated, low-rate PoSub input.
  source: Results, PoSub-FS cell tuning reveals key circuit properties, paragraph 3; Figure 4h;
    Supplementary Methods, Fourier spectrum simulations, Model fitting
  quote: established that PoSub-FS cell-like outputs are best explained by flat, high firing rate
    inputs from ADN-HD cells and low firing rate, HD-modulated inputs from PoSub-HD cells
  data: elsewhere
  where: none deposited; the fitting code (PyTorch, Supplementary Methods) is not in figshare
    doi:10.6084/m9.figshare.24921252 version 3
  criterion: The fit uses the recorded FS, PoSub-HD and ADN-HD tuning curves (the ADN curves only on
    figshare) and three losses minimized with Adam (learning rate 0.0001, 200,000 steps), the
    first two scaled by 0.25 of their left-hand side, ADN inputs expanded tenfold by circular
    shifts (Supplementary Methods). The input numbers and initial values are not given. The author
    reports it as not testable unless the fitting code is found; a reimplementation would rest on
    the author's choices.
- id: ed7-adn-disinhibition
  statement: Light over ADN in VGAT-Cre mice with ArchT in TRN raises the firing of ADN-HD cells but
    not of non-HD thalamic cells, without broadening ADN-HD tuning curves.
  source: Results, PoSub-FS cells receive directionally uniform thalamic input, paragraph 2;
    Extended Data Fig. 7b-d
  quote: Targeted illumination of ADN (inactivating the inhibitory presynaptic terminals of the TRN
    neurons) resulted in a net increase of the firing rates of ADN-HD cells but not of untuned
    neurons (non-HD cells) recorded in the same sessions
  statistics:
  - about: width of ADN-HD tuning curves, baseline against high gain
    test: Wilcoxon signed rank test
    statistic: z = 0.67
    p: 0.5
    n: 52 ADN-HD cells
  data: elsewhere
  where: figshare doi:10.6084/m9.figshare.24921252 version 3, Dataset_6.tar.gz (optogenetics)
  criterion: Light ON, the 240 one-second pulses; OFF, the 4 s before each pulse onset (Methods;
    offStart = 4 in Figure_Optogenetics.m). Cells with rate above 0.5 Hz in ON, OFF and baseline
    (code). Modulation as the ON over OFF rate (code, optoRes); ADN-HD against non-HD,
    Mann-Whitney U (n = 52 and 75, z = 6.57, no p printed), reproduced when p < 0.05 with ADN-HD
    higher and ADN-HD median above 1. Width (1 degree bins, 3 degree smoothing) before and during
    light is a claim of absence judged on the legend's Wilcoxon signed-rank test at p < 0.05; the
    code's rank-sum test is a variant.
- id: fig5b-posub-rates-increase
  statement: Thalamic disinhibition raises the firing rates of PoSub-HD and PoSub-FS cells in
    ArchT mice; the rise of FS cells is larger than in control-virus mice.
  source: Results, PoSub-FS cells receive directionally uniform thalamic input, paragraph 3;
    Figure 5b; Extended Data Fig. 7e,f
  quote: Similarly to the upstream ADN-HD cells, PoSub-HD and PoSub-FS cells increased their firing
    rates
  depends_on:
  - cell-classes-counts
  criterion: Opto sessions of PoSub, cells and ON and OFF epochs as in ed7-adn-disinhibition;
    modulation as the ON over OFF rate (code); ArchT against control, Mann-Whitney U (Extended
    Data Fig. 7f; PoSub-FS n = 47 and 38, z = 4.99; PoSub-HD n = 83 and 89, z = 1.69; no p
    printed). The paper's z for PoSub-HD corresponds to a two-tailed p of about 0.09. Reproduced
    when the FS test gives p < 0.05 with ArchT higher and the ArchT medians of both FS and HD
    cells exceed 1 and exceed the control medians. If the dandiset lacks the control sessions,
    only the ArchT medians and a Wilcoxon signed-rank of per-pulse ON against OFF rates (the
    Methods' light-modulation test) can be shown, and the claim is partially testable.
- id: ed7gj-tuning-preserved
  statement: Thalamic disinhibition preserves the HD tuning of PoSub-HD and PoSub-FS cells.
  source: Results, PoSub-FS cells receive directionally uniform thalamic input, paragraph 3;
    Extended Data Fig. 7g-j
  quote: increased their firing rates (Fig. 5b and Extended Data Fig. 7e,f ) while preserving their
    HD tuning
  depends_on:
  - fig5b-posub-rates-increase
  criterion: Two claims of absence judged on the legends' tests at p < 0.05. PoSub-HD tuning curve
    width, baseline against high gain, Wilcoxon signed-rank (Extended Data Fig. 7i, z = 0.30; the
    legend's n = 52 is read as the ArchT PoSub-HD cells, 83 in Fig. 5, as Figure_Optogenetics.m
    selects them, and the count found is reported; the code's rank-sum test is a variant).
    PoSub-FS baseline against high-gain tuning curve correlation (6 degree bins, no smoothing, all
    47 ArchT FS cells, as Figure_Optogenetics.m computes rTC), ArchT against control, Mann-Whitney U (Extended Data
    Fig. 7j, n = 47 and 38, z = 1.14). Reproduced when neither test finds a difference; the
    effect sizes are reported.
- id: fig5e-hd-multiplicative-fs-additive
  statement: Thalamic gain modulates PoSub-HD cell tuning multiplicatively and PoSub-FS cell tuning
    additively, so that FS cells receive thalamic input that is uniform across directions.
  source: Results, PoSub-FS cells receive directionally uniform thalamic input, paragraph 4;
    Figure 5c-e; Extended Data Fig. 8a,b
  quote: The modulation of PoSub-HD cells was purely multiplicative ... In contrast, modulation of
    PoSub-FS cell tuning was exclusively additive
  depends_on:
  - fig5b-posub-rates-increase
  criterion: Per the Methods (Gain modulation analysis, experiment) and Figure_Optogenetics.m. ON
    and OFF tuning curves in 6 degree bins, unsmoothed, without speed threshold, both divided by
    the maximum of the OFF curve; linear fit of ON on OFF (polyfit), slope the multiplicative and
    intercept the additive factor. ArchT cells excluded, by the Methods, when they show neither a
    significant light modulation (Wilcoxon signed-rank of per-pulse ON against preceding OFF
    rates, p < 0.05) nor a significant ON-OFF tuning correlation (Pearson, p < 0.05). The sentence
    reads "did not show ... and did not show", so the readings are (a) exclusion when both fail
    and (b) when either fails; the code (c) excludes on the correlation alone. The paper excluded
    1 of 47 FS cells and no other cells. Tests, Mann-Whitney U, ArchT PoSub-HD against PoSub-FS
    (Fig. 5e, additive z = 7.72, multiplicative z = 5.99; legend n = (83, 52), read as 83 and 46);
    each against control (Extended Data Fig. 8a, HD additive z = 1.57, multiplicative z = 6.80;
    8b, FS additive z = 4.16, multiplicative z = 0.36; no p printed). Reproduced when, under every
    reading, HD multiplicative factors exceed FS ones and FS additive factors exceed HD ones (p <
    0.05), HD multiplicative and FS additive factors exceed control (p < 0.05), and HD additive and
    FS multiplicative factors do not differ from control (p of 0.05 or more). Partially
    reproduced when the HD against FS comparisons hold and the control comparisons cannot be run
    or do not all hold.
- id: ed8cd-multiplicative-detectable
  statement: Simulations of noisy gain on real FS tuning curves show that multiplicative gain would
    be detectable at the FS cells' tuning correlations, and the FS data are best explained by
    additive gain.
  source: Results, PoSub-FS cells receive directionally uniform thalamic input, paragraph 4;
    Methods, Gain modulation analysis, simulations; Extended Data Fig. 8c,d
  quote: These simulations allowed us to establish that multiplicative gain is indeed detectable in
    tuning curves with correlation values similar to those observed experimentally in PoSub-FS
    cells and that our experimental results in PoSub-FS cells are best explained by significant
    additive gain
  depends_on:
  - fig5e-hd-multiplicative-fs-additive
  criterion: Per the Methods and Duszkiewicz2024_Figure_GainSimulation.m. ArchT FS baseline curves;
    simulated high-gain curves with no gain, with multiplicative gain (times 1.2) or additive gain
    (plus 20% of the curve's maximum) before Gaussian noise titrated to the observed distribution
    of baseline-high-gain correlations; factors computed as for the data; each simulation's factor
    distributions against the control group's, Mann-Whitney U (n = 46 and 38). Reproduced when the
    multiplicative simulation's multiplicative factors differ from control (p < 0.05) and the
    additive simulation's factors match the data's pattern (additive differs, multiplicative does
    not). The noise seed is a standard choice.
- id: ed8e-adn-mixed-gain
  statement: ADN-HD cells show multiplicative factors like those of PoSub-HD cells and larger
    additive factors.
  source: Results, PoSub-FS cells receive directionally uniform thalamic input, paragraph 4;
    Extended Data Fig. 8e,f
  quote: this high degree of multiplicative modulation largely reflected the modulation of the
    upstream ADN-HD cells
  data: elsewhere
  where: figshare doi:10.6084/m9.figshare.24921252 version 3, Dataset_6.tar.gz (optogenetics)
  depends_on:
  - fig5e-hd-multiplicative-fs-additive
  criterion: Factors as in fig5e-hd-multiplicative-fs-additive. ADN-HD against PoSub-HD,
    Mann-Whitney U (multiplicative z = 0.55, additive z = 5.07; no p printed). Reproduced when
    the multiplicative factors do not differ (p of 0.05 or more, a claim of absence on the
    paper's test) and the additive factors do (p < 0.05, ADN higher, as the Extended Data Fig. 8
    title says ADN-HD cells show a mixture of both).
- id: fig6c-coupling-preserved-wake-rem
  statement: GLM cross-coupling of PoSub-HD pairs, PoSub-FS pairs and PoSub-HD to PoSub-FS pairs is
    preserved between wakefulness and REM sleep, less for FS pairs than for HD pairs.
  source: Results, PoSub-FS cells are coupled to the PoSub-HD ring manifold, paragraph 2; Figure
    6a-c
  quote: Similarly, PoSub-FS cell pairs also preserved their coupling across WAKE and REM, albeit to
    a smaller degree than PoSub-HD cell pairs (Fig. 6a-c , middle). Notably, the coupling of the
    two cell populations to each other was also preserved across WAKE and REM
  depends_on:
  - cell-classes-counts
  criterion: Sessions with at least 100 s of REM (Methods). GLM per the Methods and
    GetGLM_Forward.m and GetGLM_Reverse.m. Spike counts in 100 ms bins smoothed with a 100 ms s.d.
    Gaussian; the population rate (all units) smoothed alike and z-scored; cell B's train z-scored;
    Poisson GLM (log link) of cell A on population rate and cell B within WAKE (the square epoch)
    or REM; the coefficient at lag 0 averaged with the reversed pair's; pairs with fit warnings
    removed. Pearson correlation across pairs of WAKE against REM coefficients for HD-HD, FS-FS and
    HD-FS pairs (n = 34,270, 2,492 and 8,992; no r or p in the text). Reproduced when all three
    correlations are positive with p < 0.05 and the FS-FS r is below the HD-HD r. The HD-FS count
    is read as either ordering of the pair (code, both ordered sets) or one per pair; Extended
    Data Fig. 9d gives 18,992, so both counts are shown.
- id: ed9d-coupling-follows-tuning
  statement: The polarity of the GLM coupling within a pair depends on the similarity of the two
    cells' HD tuning, during both WAKE and REM.
  source: Results, PoSub-FS cells are coupled to the PoSub-HD ring manifold, paragraph 2; Extended
    Data Fig. 9d
  quote: Predictably, the polarity of the cross-coupling coefficient depended on the HD tuning
    relationship within each cell pair during both WAKE and REM
  depends_on:
  - fig6c-coupling-preserved-wake-rem
  criterion: As in Figure_GLMRemWake.m, Pearson correlation across pairs between the zero-lag
    tuning curve correlation and the lag-0 coupling coefficient, for HD-FS and FS-FS pairs, in
    WAKE and in REM (n = 18,992 and 2,492). Reproduced when all four correlations are positive
    with p < 0.05.
- id: fig7b-wake-isomap-tuning
  statement: HD tuning curves of PoSub-HD and PoSub-FS cells computed from the virtual HD of the
    WAKE ring manifold are equivalent to those computed from the real HD.
  source: Results, PoSub-FS cells are coupled to the PoSub-HD ring manifold, paragraph 3; Figure
    7a,b; Extended Data Fig. 10e
  quote: The HD tuning curves of both PoSub-HD and PoSub-FS cells computed using virtual HD values
    during WAKE were equivalent to those computed using real HD values
  depends_on:
  - cell-classes-counts
  criterion: Per the Methods (Visualization and analysis of the ring manifold). HD cell spikes over
    the whole square epoch in 200 ms bins, smoothed with a 400 ms s.d. Gaussian, square root;
    Isomap with 12 neighbours and 3 dimensions; virtual HD the four-quadrant arctangent of the
    first two dimensions, its direction chosen by the smaller circular variance of the difference
    from real HD, its origin by the mean offset of maximum cross-correlation over HD cells; real
    and virtual tuning curves in 1 degree bins, 3 degree smoothing, real HD downsampled to 200 ms.
    Zero-lag Pearson correlation of each cell's real and virtual curves against the time-reversed
    Isomap angle control, Wilcoxon signed-rank (HD n = 1,602, z = 34.7; FS n = 427, z = 17.9; no p
    printed). Reproduced when both give p < 0.05 with real correlations higher.
- id: ed10b-ring-topology
  statement: Population vectors of PoSub-HD cells lie on a ring during WAKE, farther from the
    centre of the manifold than shuffled vectors, and the ring has the same radius during REM.
  source: Extended Data Fig. 10b,d; Figure 7c legend
  quote: Distance of population vectors to the center of the manifold ( d ) is the same during WAKE
    and REM
  depends_on:
  - fig7b-wake-isomap-tuning
  criterion: Per the Methods and the Isomap scripts, distance of each point to the manifold centre,
    normalized to the mean distance of the real projection; shuffles by shifting each cell's
    binned train by a random number of bins. Mean distance real against shuffled, Wilcoxon
    signed-rank across sessions (n = 32, z = 4.79), reproduced when p < 0.05 with real larger.
    REM against subsampled WAKE in the joint embedding is a claim of absence on the legend's
    Wilcoxon signed-rank (n = 26, z = 0.17), reproduced when p is 0.05 or more. The shuffle and
    subsampling seeds are standard choices.
- id: fig7d-rem-isomap-tuning
  statement: During REM sleep the HD tuning of PoSub-HD and PoSub-FS cells can be estimated from
    the virtual HD of the ring manifold alone and matches their WAKE tuning.
  source: Results, PoSub-FS cells are coupled to the PoSub-HD ring manifold, paragraph 4; Figure
    7c,d; Extended Data Fig. 10f
  quote: Notably, HD tuning of PoSub-FS cells could also be accurately estimated during REM based
    solely on the virtual HD obtained from the HD ring attractor manifold
  depends_on:
  - fig7b-wake-isomap-tuning
  criterion: Sessions with at least 100 s of REM. WAKE population vectors randomly subsampled to the
    number of REM vectors, Isomap on both together, virtual HD as in fig7b-wake-isomap-tuning;
    tuning curves in 6 degree bins with 6 degree smoothing. Cells with REM rate above 0.5 Hz (HD)
    or above 10 Hz (FS), as Figure_IsomapREM.m selects them (expected n = 1,148 and 317). Zero-lag
    Pearson correlation of WAKE and REM curves against the time-reversed control, Wilcoxon
    signed-rank (HD z = 29.2, FS z = 10.4; no p printed). The WAKE curve is read as the WAKE
    Isomap curve (legend) and as the real-HD WAKE curve (the code's cc_WkRem); both are run.
    Reproduced when, under both readings, both tests give p < 0.05 with real correlations higher.
- id: fig1ac-posub-border
  statement: Along a Neuropixel probe crossing pRSC and PoSub, HD tuning of excitatory cells rises
    in a step at the functional border between the two regions.
  source: Results, High-density recordings in the PoSub of freely moving mice, paragraph 1; Figure
    1a-c
  quote: We first established the functional border between PoSub and posterior retrosplenial
    cortex (pRSC) using a Neuropixel linear electrode array
  data: elsewhere
  where: figshare doi:10.6084/m9.figshare.24921252 version 3, Dataset_4.tar.gz (Neuropixel session)
  criterion: The paper reports no measure, test or border position for the step, and the code
    places no border. HD information of excitatory cells against probe depth, with the running
    average of Duszkiewicz2024_Figure_SingleRec_NPX.m (mean HD information in 50 um depth bins from
    0 to -2.5 mm, empty bins interpolated, Gaussian smoothing of 2 bins s.d.). Reproduced when the
    running average rises in a single step from low values at the pRSC end of the probe to high
    values at the PoSub end, as Fig. 1b shows it; the profile is shown, and since no test is given
    the judgement is qualitative and is reported as such.
- id: ed6-trn-innervates-adn
  statement: TRN sends denser inhibitory projections to ADN than to the other rostral thalamic
    nuclei.
  source: Results, PoSub-FS cells receive directionally uniform thalamic input, paragraph 2;
    Extended Data Fig. 6
  quote: The ADN is strongly innervated by inhibitory afferents from the thalamic reticular nucleus
  statistics:
  - test: repeated measures ANOVA
    statistic: F (2,9) = 44.9
    p: 1.0e-4
    p_relation: "<"
    n: 4 mice
  data: elsewhere
  where: none deposited; anatomical images are not in the dandiset or the figshare item
  criterion: Anatomy (ImageJ intensity of GFP in ROIs per nucleus) on images the paper does not
    deposit. Not testable from the dataset.
