claims:
- id: model-positive-error-short-latency
  statement: In the two-compartment model, L4 sensory input without L5 IT predictive input makes the
    L2/3 neuron fire a short-latency singlet or doublet, depending on L4 strength, immediately after
    the input arrives; basket cell inhibition ends the response.
  source: Results, Positive prediction error, paragraph 1; Figure 1D
  quote: When L4 sensory input arrives in the absence of L5 IT predictive input, the L2/3 neuron
    produces a singlet or doublet depending on the L4 input strength ... Because no ChC clamp is
    active, action potential initiation at the AIS is rapid and unimpeded. The resulting spike or
    burst occurs immediately following sensory input arrival
  data: elsewhere
  where: the paper's two-compartment LIF model, specified in full in the Methods (Brian 2); its code
    (github.com/bendor-lab/SETA-model_allen_analysis) was not public on 2026-11-21
  criterion: Simulated with the Methods' parameters (L4 60 nS, tau 4 ms; basket 1.2 times L4, tau
    6 ms, onset 2.5 ms after L4; no L5 IT or ChC input; 80 runs with noise). Reproduced when the
    neuron fires in most runs and the first spike falls within the first few ms after L4 onset,
    with no spike after the basket conductance peaks, and stronger L4 gives doublets. "Short" has
    no number in the paper; the latency is reported. The simulation time step is not given; a
    standard 0.1 ms step is used, a choice that should not change the outcome.
- id: model-negative-error-delayed-release
  statement: With L5 IT predictive input and no sensory input, the ChC clamp holds the AIS below
    threshold and the neuron fires a single gated release spike after the clamp decays, 15 to 20 ms
    after the time the same L5 IT input could have triggered the L5 ET bAP.
  source: Results, Negative prediction error, paragraph 1; Figure 1D
  quote: In the absence of additional sensory drive from L4, the AIS cannot escape this clamp until
    ChC conductance sufficiently decays, at which point the accumulated depolarisation is released as
    a singlet if the soma remains sufficiently depolarised ( Fig. 1D ). In such case, the L2/3 input
    arrives to the L5 ET 15–20 ms delayed
  data: elsewhere
  where: the paper's two-compartment LIF model, specified in the Methods; code not public on
    2026-11-21
  expected:
  - quantity: delay of the gated release spike
    value: 17.75
    tolerance: 4.25
    unit: ms
  criterion: Simulated with the Methods' defaults (L5 IT 12 nS, tau 8 ms; ChC 25 nS, tau 4 ms,
    reversal -58 mV, onset 1.5 ms after L5 IT; no L4 input; 80 runs). The range 15 to 20 ms is
    widened by 10% of each bound (13.5 to 22 ms). The model has no L5 ET neuron, so the reference
    time is open. Readings (a) latency of the first spike from L5 IT onset; (b) the same, measured
    from the time of the L5 IT conductance peak (8 ms after onset). Reproduced when, under one
    reading, the median latency over runs that spike lies in the range and runs that spike fire a
    single spike.
- id: fig2a-weak-sensory-silenced
  statement: When L4 input is weaker than the predictive input, the ChC clamp vetoes the L2/3 spike
    and basket cell inhibition prevents the gated release spike, so the neuron is silent.
  source: Results, The circuit encodes a continuous error spectrum, paragraph 1; Figure 2A
  quote: When L4 input was weaker than the predictive input, the ChC clamp successfully vetoed the
    L2/3 spike, and basket cell hyperpolarisation prevented the gated release spike ( Fig. 2A ),
    resulting in no spiking.
  data: elsewhere
  where: the paper's two-compartment LIF model, specified in the Methods; code not public on
    2026-11-21
  criterion: L5 IT 12 nS and ChC 25 nS (Figure 2B legend), with L4 below 12 nS and basket 1.2 times
    L4. "Weaker than the predictive input" is read as L4 conductance below the L5 IT conductance.
    Reproduced when the expected spike count is near zero (below 0.1 per run, a choice made here;
    the paper says "no spiking") for weak L4 inputs,
    and lower than with the L5 IT and ChC input alone. The onset of L4 relative to L5 IT is not
    given for Figure 2A and 2B; simultaneous onset is the reading, as Figure 2C shows delays of up
    to 5 ms leave the behaviour unchanged.
- id: fig2b-breakthrough-doublet-threshold
  statement: A sufficiently strong L4 input during the active ChC clamp overrides it and drives a
    breakthrough spike, but the L4 conductance needed for a doublet is higher than without a
    prediction.
  source: Results, The circuit encodes a continuous error spectrum, paragraph 1; Figure 2B
  quote: When the L4 input was sufficiently strong and arrived during the active ChC clamp window,
    it overrode the clamp and drove a spike, a breakthrough event, albeit with a higher threshold
    for producing a doublet relative to a completely unpredicted positive error ( Fig. 2B ).
  data: elsewhere
  where: the paper's two-compartment LIF model, specified in the Methods; code not public on
    2026-11-21
  criterion: Expected spike count against L4 conductance, basket scaled 1.2 times, with (L5 IT
    12 nS, ChC 25 nS) and without prediction conductances (Figure 2B legend), 80 runs per point.
    Doublet threshold is the lowest L4 conductance with expected count >= 2 under each reading of
    the threshold the paper leaves open, (a) expected count crossing 2, (b) half the runs firing
    two or more spikes. Reproduced when strong L4 gives spikes with prediction and the doublet
    threshold with prediction is higher than without. The L4 range is not given; 0 to 150 nS is a
    plotting choice.
- id: fig2c-robust-to-input-delay
  statement: Delaying either the predictive or the sensory input by 5 ms leaves the model's
    behaviour the same.
  source: Results, The circuit encodes a continuous error spectrum, paragraph 1; Figure 2C
  quote: The model was robust to exact time difference between prediction and sensory inputs and
    delaying either input by 5 ms resulted in the same behaviour ( Fig. 2C ).
  data: elsewhere
  where: the paper's two-compartment LIF model, specified in the Methods; code not public on
    2026-11-21
  criterion: Expected spike count against sensory delay from L5 IT onset, at the L4 conductance
    marked by the arrow in Figure 2B (not readable from the text; the Methods' default 60 nS is the
    reading). Reproduced when the expected spike count at delays of -5 and +5 ms differs from that
    at 0 ms by less than 0.5 spike (a choice made here; the paper gives no measure of "the same").
- id: fig2d-latency-grows-as-sensation-weakens
  statement: As sensory input weakens relative to the prediction, the latency of the breakthrough
    spike lengthens continuously.
  source: Results, The circuit encodes a continuous error spectrum, paragraph 1; Figure 2D
  quote: As sensation weakened relative to prediction, breakthrough latency lengthened ... the
    resulting L2/3 spike arrived progressively later relative to the bAP ( Fig. 2D )
  data: elsewhere
  where: the paper's two-compartment LIF model, specified in the Methods; code not public on
    2026-11-21
  criterion: Latency of the first spike from sensory onset against L4 conductance, for the
    simulation of Figure 2B (Figure 2D legend), averaged over runs that spike. Reproduced when the
    latency decreases with L4 conductance (Spearman rho < 0 over the conductances where any run
    spikes) without a single jump between two values; the test is a choice made here, as the paper
    shows the curve only.
- id: fig3a-low-gain-suppresses-errors
  statement: At low somatic gain of L4 and L5 IT, strong sensory input rarely drives bursts and an
    omission (prediction only) often ends in silence instead of a gated release spike.
  source: Results, Precision weighting of prediction error, paragraph 1; Figure 3A
  quote: At low gain, both error signals were effectively suppressed ... strong sensory inputs rarely
    drove bursts, and stimulus omission frequently ended in silence
  data: elsewhere
  where: the paper's two-compartment LIF model, specified in the Methods; code not public on
    2026-11-21
  criterion: All four conductances (L4, basket, L5 IT, ChC) scaled by 0.2 (Low), 0.5 (Mid) or 1.0
    (High) (Methods, Scaling of L2/3 inputs; Figure 3A legend), sensory only and prediction only.
    The Methods set the default L4 (60 nS) to give a single spike, so bursts at High gain need a
    stronger L4; "strong sensory inputs" is read as the L4 conductances at which High gain gives an
    expected count >= 2 (the L4 range is open, as in fig2b-breakthrough-doublet-threshold).
    Reproduced when, at those L4 conductances, the fraction of sensory-only runs with two or more
    spikes at Low gain is below one half (a reading of "rarely") and below that at High gain, and
    the fraction of prediction-only runs with no spike at Low gain is above one half (a reading of
    "frequently").
- id: fig3b-gain-lowers-burst-threshold
  statement: Raising L4 and L5 IT gain lowers the sensory threshold for bursts and raises the
    probability of a gated release spike on omission trials.
  source: Results, Precision weighting of prediction error, paragraph 1; Figure 3A and 3B
  quote: As L4 and L5 IT gain increased the sensory threshold for bursts decreased (favouring LTP;
    Fig. 3A,B ), and the probability of a gated release spike on omission trials increased
    (favouring LTD; Fig. 3B ).
  data: elsewhere
  where: the paper's two-compartment LIF model, specified in the Methods; code not public on
    2026-11-21
  criterion: Expected spike count against L4 strength at gains 0.2, 0.5 and 1.0 (Figure 3B legend).
    The Results read the omission probability from Figure 3B, which suggests its simulation keeps
    the prediction conductances while L4 varies, but the legend does not say so. Open, (a) L5 IT
    and ChC at their defaults times the gain, L4 varied, omission being L4 = 0; (b) sensory only
    for the burst threshold and prediction only for omission, as in Figure 3A. Reproduced when,
    under one reading, the burst threshold (lowest L4 with expected count >= 2) falls from Low to
    Mid to High, and the fraction of omission runs with a spike rises from Low to Mid to High.
