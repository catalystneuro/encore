# Claims for Jarzebowski & Bendor (2026), "Temporal Gating by Chandelier Cells Encodes Signed
# Prediction Errors", bioRxiv doi:10.64898/2026.06.26.734797, tested on dandiset 000713 (Allen
# Institute, Visual Behavior Neuropixels), which the paper reuses.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-21,
# protocol pilot-18 as stated in docs/protocol.md, Reader section.
#
# Text read. The bioRxiv preprint (Europe PMC record PPR1261135, EMS219534; header "Version:
# preprint", posted 28 06 2026, record dated 29 09 2026) in paper/10.64898-2026.06.26.734797.txt:
# Summary, Introduction, Results, Discussion, STAR Methods with the Key Resources Table, and the
# legends of Figures 1 to 7. No PDF was supplied, so no figure was seen and no value drawn only in
# a panel is known here. The text has a heading "Supplementary Material Supplemental Figures" with
# nothing under it, so the Supplementary Figures S1 and S2 and their legends are not in the text
# read. The main findings rest on Figures 5 to 7 and the Methods, which are present. The claims on
# Figures S1 and S2 (post-omission and novelty bursting, noise correlations) rest on the Results
# sentences that cite them; no number, n or test from those figures is known here.
#
# Code. The Key Resources Table links https://github.com/bendor-lab/SETA-model_allen_analysis
# ("Computer codes for simulation and dataset analysis"); Code Availability says the codes "will
# be made available on publication". On 2026-11-21 the repository was not public (GitHub API 404;
# not among the public repositories of bendor-lab). No code was read. Every method below is from
# the Methods and the legends.
#
# Data the paper used. The Visual Behavior Neuropixels dataset of Bennett et al. (2025), read with
# AllenSDK 2.16.2 from s3://visual-behavior-neuropixels-data/visual-behavior-neuropixels/, citing
# DANDI 000713 version 0.240702.1725 (Methods, Allen Brain Observatory data analysis). Mice
# trained on a visual change detection task; natural images shown for 250 ms with 500 ms grey
# between, in blocks of repeats; the image changes after a random number of repeats; licks after a
# change are rewarded with water; some presentations are omitted. Two periods of each session
# are used, the active task and the period of inactivity right after it (spontaneous activity).
# Spikes of units in VISp only, layer from CCFv3 coordinates; putative pyramidal L2/3 and L5 units.
# Running speed for locomotion. Optotagging (VIP-IRES-Cre;Ai32, Sst-IRES-Cre;Ai32 mice) to remove
# Vip and Sst cells. The legends give n = 266 L2/3 cells from 78 recordings and 1075 L5 cells from
# 98 recordings (Figures 6 and 7A, 7B), and 47 L2/3 cells from 35 recordings and 658 L5 cells from
# 94 recordings (Figures 7C, 7D). A recording is a session.
#
# Figures 1 to 4 are simulations of a two-compartment LIF model of one L2/3 neuron in Brian 2, with
# all parameters in the Methods (Computational model of L2/3 neuron; Synaptic connectivity and
# kinetics; Scaling of L2/3 inputs). They use no recorded data; their claims are data elsewhere.
#
# Outside data. Layer labels come from the units' CCFv3 coordinates and "the average brain
# template in CCFv3, as described by Siegle et al. (2021)" (Methods, Laminar classification), so
# claims that split units by layer use the CCFv3 annotation volume (with_inputs).
#
# Common method for the recorded data (D1 to D9), cited to the Methods (M) or a legend. Criteria
# below refer to these.
# D1 Units (M, Unit inclusion). Units on channels in VISp; ISI violations <= 0.5; amplitude cutoff
#    <= 0.1; presence ratio >= 0.9; SNR > 1; firing rate > 0.2 Hz; quality "good".
# D2 Responsive (M, Unit inclusion). Over presentations of all images, spike count in the 250 ms
#    after onset against the 250 ms before, Wilcoxon paired test, p < 0.05 with higher rate during
#    presentation, and spikes in the 250 ms window on >= 20% of presentations.
# D3 Putative pyramidal (M, Identification of pyramidal neurons). Peak-to-trough duration > 0.4 ms
#    and firing rate < 10 Hz; units optotagged as Vip or Sst removed, a unit being tagged when its
#    rate in the 1 to 10 ms after light onset exceeds 50 Hz and its z-score against baseline
#    exceeds 2. Layer L2/3 or L5 from CCFv3 (M, Laminar classification).
# D4 Windows and bursts (M, Spiking metrics and burst detection). 250 ms windows from presentation
#    or omission onset. A burst is two or more spikes with ISI <= 10 ms; FSB is the fraction of the
#    spikes in the windows that are in bursts.
# D5 Firing-rate change (M). Modulation index (FR' - FR_control) / (FR' + FR_control).
# D6 Periods (M, Allen Brain Observatory data analysis). Presentations and omissions from the
#    active task; spontaneous activity from the period of inactivity immediately after the task.
#    Repetition 1 is the first presentation of an image after an image change (Figure 5B legend).
# D7 Locomotion (M, Locomotion detection). A presentation is locomotion when mean speed > 5 cm/s
#    and speed > 3 cm/s for 75% of its duration; stationary when mean speed < 5 cm/s and speed
#    < 3 cm/s for 75% of its duration; others are neither.
# D8 Statistics (M, Quantification and statistical analysis). Mixed-effects model with a random
#    effect of session; linear, or on the square-root-transformed response. Figure 5C models the
#    fixed effect of repetition; the other figures test the intercept of the per-cell change.
#    95% CI from the t distribution with the model's degrees of freedom; p < 0.05 significant.
# D9 Noise correlations (M, Spiking metrics; Unit inclusion). Per trial, subtract the cell's mean
#    response to that image at that repetition ordinal; average over the cells of one layer in one
#    session; sessions with at least 10 putative pyramidal cells per layer; for L5 FSB, only
#    trials with spikes.
#
# Open details of the common method, with the readings the text allows. Each claim that rests on
# one names it.
# O1 Responsive test sidedness (D2). (a) one-sided Wilcoxon, during > before; (b) two-sided, with
#    the during rate higher. Which presentations enter it is also open: (a) all non-omitted image
#    presentations of the active task; (b) those of the whole session.
# O2 Firing rate for D1 and D3. (a) the dataset's unit firing rate (whole session); (b) the mean
#    rate over the active task.
# O3 Optotagging baseline (D3). The baseline of the z-score is not given. (a) the unit's rate in a
#    window of the same length before each light pulse, across pulses; (b) its mean rate over the
#    optotagging block. Which light pulses are used is not given; all pulses are the reading.
# O4 FSB per cell (D4). (a) spikes in bursts summed over all windows of a condition, divided by all
#    spikes in them; (b) the mean over windows of per-window FSB, windows without spikes left out.
#    Only spikes inside a window count toward a burst under both.
# O5 Spontaneous windows (D6). Fig. 6A splits spontaneous activity into 1 s trials "for
#    visualisation purposes only", and the Methods compute metrics over 250 ms periods. (a)
#    consecutive 250 ms windows over the spontaneous block that follows the active task; (b) the
#    same, keeping only stationary windows (D7), as the Methods call it a period of inactivity.
# O6 Square-root transform (D8). Legends say "Linear mixed-effects model" for Figures 6B, 7B, 7C,
#    7D and "Mixed-effects model" for 5C, 6C and 7A. (a) linear on the raw change; (b) for the
#    latter figures, the change computed on square-root-transformed FSB. The Results call the
#    Figure 5C model "A linear mixed-effects model", against its legend. Signs and p are judged
#    under both; an expected CI is compared under the reading that matches.
# O7 Locomotion window (D7). (a) the 250 ms presentation or omission window; (b) the 750 ms from
#    its onset to the next onset.
# O8 Presentations counted as repetitions (Figure 5). Whether presentations that follow an
#    omission keep their ordinal is not said. (a) ordinals count every presentation since the
#    change, all kept; (b) presentations right after an omission are left out (Figure S1 treats
#    them apart).
#
# Inconsistencies in the printed statistics, recorded and not corrected. Figure 5C L5 slope is
# printed t(7523) = 8.1 with CI [-0.0011, -0.0007]; the t is positive and the CI negative, and the
# Results say FSB decreased. Figure 5C L2/3 slope is printed t(1860) = -0.59 with CI [-0.001,
# 0.004], whose centre is positive.
schema_version: 2
