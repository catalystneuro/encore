  criterion: A claim of absence. SVM (Matlab) on goal-distance neurons' activity, trained and
    validated as the probabilistic decoder. The paper says only "shuffled data" (refs. 49, 50);
    the shuffle is read as the standard one of those references, each neuron's activity
    permuted independently across training trials at the same goal distance (4.2-cm bin).
    Kernel, classes and error measure are not given; readings (a) linear multiclass SVM over 4.2-cm distance bins, error the absolute
    difference of the predicted bin centre from the actual distance; (b) linear SVM regression,
    absolute error. One-sided signed-rank test (recorded better) over frames per setting.
