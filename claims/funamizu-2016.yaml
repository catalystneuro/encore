    value: 0.258
    tolerance: 0.0258
  - quantity: largest session r
    value: 0.822
    tolerance: 0.0822
  criterion: The Results do not name the two variables of r. They are read as those of the
    Methods' session selection, since every reported P is below its 0.01 threshold. The Methods
