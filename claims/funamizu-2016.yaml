# Claims for Funamizu, Kuhn & Doya (2016), Nat Neurosci 19(12):1682-1689, on dandiset 001605.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record (Nature Neuroscience, December 2016), from the PDF supplied by
# hand, stored as paper/10.1038-nn.4390.txt: main text, figure legends, Online Methods, and the
# supplement (41593_2016_BFnn4390_MOESM16_ESM.pdf: Supplementary Figs. 1 to 14 and Supplementary
# Table 1). The display equations of the Methods are garbled in the text; the words around them
# were read. PDF pages were rendered only to read Figure 1c, Figure 2c,d, Figure 4 and
# Supplementary Table 1 (columns), which the text garbles. Code: the paper says its Matlab scripts
# are "available from corresponding author upon request"; it links no code, so none was read.
# Data availability in the paper points to https://groups.oist.jp/ncu/data.
#
# Data the paper used, as it reports them.
#  - Imaging: eight male C57BL/6N mice, 94 sessions (one per day, one imaging plane), mouse 1 to 8
#    with 2, 10, 5, 14, 15, 15, 12 and 21 sessions. Areas PPC (LPtA, about 1.7 mm posterior and
#    1.6 mm lateral of bregma) and PM (V2ML, with some V2MM or MM), right hemisphere, layers 2, 3
#    and 5. PPC: 17, 15 and 14 sessions in layers 2, 3, 5; PM: 16, 15 and 17. 41,031 active
#    neurons (PPC 8,371, 7,108, 4,859; PM 7,788, 7,005, 5,900). Two-photon imaging at 30.9 Hz,
#    GCaMP6f with TurboRFP; signal is the green/red ratio R(t), and dR/R = (R - mean R)/mean R with
#    the mean over all 150 trials including inter-trial intervals. ROIs drawn by hand; active ROIs
#    carry a signal beyond 3 sigma in the session.
#  - Behaviour, simultaneous with imaging: auditory virtual navigation on a spherical treadmill in
#    darkness. A trial starts with a start tone; the virtual sound source (goal) is 67 to 134 cm
#    from the start; reward when the mouse passes the goal and licks. Conditions continuous,
#    intermittent 1 and intermittent 2 at 70, 15 and 15%. Zones are 17 cm long; in intermittent 1
#    a no-sound zone is centred on the goal, in intermittent 2 a sound zone is; the first 33 cm
#    from the start always have sound. The figures put zone borders at 8.4, 25.1, 41.9 and 58.6 cm
#    from the goal, so in intermittent 1 the zones 8.4-0 and 41.9-25.1 cm are silent and 25.1-8.4
#    and 58.6-41.9 cm have sound; intermittent 2 is the reverse. Variables: goal distance,
#    locomotion speed, licks, sound on or off, reward.
#  - Per session, the first 150 trials; trials taking more than 20 s to reward (2.71%) and error
#    trials (0.142%) excluded. Sessions kept only when the start-to-first-lick distance correlated
#    positively with start-to-goal distance (P < 0.01; 4 of 100 dropped) and motion correction
#    sufficed (2 of 100 dropped). First lick means the first lick more than 33 cm from the start.
#  - Sound-response mapping before each imaging session: the task sound (200 ms) from each of 12
#    speakers, ten times each, 5 s apart (Supplementary Fig. 4).
#  - Muscimol: three further mice, bilateral PPC injection of muscimol or PBS on alternate days,
#    no imaging (Fig. 1d-g, Supplementary Fig. 2). Fig. 1f gives "12 sessions, 3 mice"; its
#    signed-rank w reaches 78 = 12 x 13 / 2 for both muscimol and PBS, so 12 sessions of each. Five more mice for the spread of
#    fluorescent muscimol (histology only).
# The archive's description of dandiset 001605 names only the imaging sessions with their
# behaviour (94 session files); whether the muscimol sessions or the sound-mapping trials are
# there is for the author to find. No claim uses outside data.
#
# Methods fixed by the paper and used throughout (Online Methods unless named):
#  - Task-relevant neurons: trial traces of dR/R aligned (i) in time to the start tone, (ii) in
#    time to reaching the goal, (iii) in time to the first lick, (iv) in distance from the start,
#    (v) in goal distance; averaged over trials, then moving-averaged over 500 ms (time) or
#    8.37 cm with 0.42 cm steps (distance). Task-relevant when the aligned average is
#    significantly positive at any point against baseline, one-sided one-sample t-test,
#    P < 1e-10. Start neurons, significant within 2 s of the start ((i) or (iv)); goal-aligned
#    ((ii) or (v)) neurons are split by the time of peak activity into before- and after-reaching;
#    the after-reaching group is split by k-means (two clusters) on the activity of the last
#    500 ms (16 frames) before the goal into after-reaching (ramping) and reward neurons.
#    Goal-distance neurons are the before- and after-reaching neurons. A neuron significant in
#    goal-aligned and lick-aligned activity is assigned to whichever is more significant.
#    Trials of all conditions are used (Fig. 2c legend, "Neural activity of all trials was
#    averaged"). Traces are shown up to the goal in goal distance and after it in time (Fig. 2c
#    legend); the before/after split is read on that joined trace.
#  - Regression of single neurons (equations 1 to 3): unfiltered dR/R on Gaussian basis functions
#    of goal distance or goal time, lick frequency and locomotion speed, with the centre of each
#    basis at the value of maximal averaged activity and its width free; 11 variable sets; the
#    best set by BIC on the sum of squared errors over all frames of the 150 trials.
#  - After-reaching slopes (equation 5): per neuron, dR/R binned every 0.42 cm of goal distance,
#    linear regression on distance within each zone.
#  - Decoder (equations 6 to 10): all goal-distance neurons of a session (sessions with none, 3 of
#    94, excluded); n is dR/R after a 3-frame (97.1 ms) moving average; tuning from continuous
#    trials, 4.2 cm distance bins, mean and s.d. of log activity by maximum likelihood, smoothed
#    with a Gaussian of s.d. 4.2 cm and resampled every 0.84 cm; traces shifted per neuron to be
#    positive; log-normal likelihood, neurons independent, flat prior. Continuous trials decoded
#    by leave-one-trial-out; intermittent trials decoded by a decoder trained on all continuous
#    trials. Outputs per frame: RMSE, the root of the posterior-expected squared deviation from
#    the actual distance; MAP; uncertainty, the posterior s.d. about the MAP. MAP and uncertainty
#    slopes: linear regression on goal distance within each zone of each trial (equation 10).
#    The slope is reported as decrease per cm of approach (Fig. 5 axes, "MAP decrease per cm").
#  - Statistics: two-sided Mann-Whitney U, Wilcoxon signed-rank or Ansari-Bradley tests unless
#    one-sided is stated; P < 0.01 for the multiple comparisons of Figs. 1c,f and 2d (Bonferroni).
#    Medians with robust s.e. (1.4826 x MAD / sqrt(n)).
#
# Details the paper leaves open. The notebook runs every reading of a method; the outcome is the
# one they all give, and the claim is blocked as methods_underspecified when they disagree. Where
# readings are of what a reported number counts, the claim holds under any of them.
#  - O1, baseline of the task-relevance t-test. Readings (a) zero, the session mean of R that
#    dR/R is taken against; (b) the neuron's mean dR/R over inter-trial intervals. The t-test is
#    over trials at each point of the aligned trace.
#  - O2, extent of the aligned traces. Read from the axes of Fig. 2c: start, -1 to 6 s; goal
#    time, -3 to 3 s; goal distance, 67 to 0 cm then 0 to 3 s after the goal; first lick, -2 to
#    3 s. The start-aligned distance window (iv) is given nowhere; readings (a) 0 to 67 cm, the
#    shortest start-to-goal distance; (b) 0 to 33 cm, the stretch always with sound.
#  - O3, k-means feature for after-reaching against reward neurons. Readings (a) the 16-frame
#    trace before the goal of each neuron's trial-averaged activity, normalized 0 to 1 as in
#    Fig. 2c; (b) the mean of that trace. The cluster with higher pre-goal activity is
#    after-reaching. Standard k-means with a fixed seed and repeated starts (a standard choice).
#  - O4, distance preference: the goal distance of peak activity of the distance-aligned trace
#    (67 to 0 cm), the "peaks of distance coding" of Fig. 2d, for every goal-distance neuron.
#  - O5, per-session proportions against pooled counts, for percentages of neurons. Readings
#    (a) mean over sessions of per-session proportions of active neurons; (b) pooled counts over
#    sessions. The tests of proportions are Mann-Whitney U tests over sessions (the Wilcoxon w
#    values of Fig. 2d, such as 13.5, fit sessions, not neurons).
#  - O6, frames of the single-neuron regression. "All frames during all 150 trials". Readings
#    (a) start tone to reaching the goal; (b) start tone to 3 s after the goal, with goal
#    distance and time continuing past zero. The four initial values of each width are not
#    given; readings (a) 1/8, 1/4, 1/2 and 1 of the variable's range in the session; (b) 1/16,
#    1/8, 1/4 and 1/2 of it.
#  - O7, the positive shift of traces for the log-normal likelihood. Readings: each neuron's
#    trace shifted so its minimum is (a) 0.01 or (b) 0.1 in dR/R units.
#  - O8, distance range decoded and bins of Figs. 4 and 5. The decoder covers 67 to 0 cm (axes of
#    Fig. 4). Per-trial values in Fig. 4c-e are means over frames within 4.2-cm goal-distance bins
#    (the tick spacing of Fig. 4c-e and the decoder's bin width); Supplementary Fig. 11a uses
#    0.42 cm bins, a second reading for Fig. 4c-e. Fig. 5 zones are 58.6-41.9, 41.9-25.1,
#    25.1-8.4 and 8.4-0 cm (axis of Fig. 5a); Figs. 5b,d use the last two.
#  - O9, slow and fast trials (Supplementary Figs. 1 and 13): trials of each session split into
#    equal halves by locomotion speed. Readings (a) mean speed over the trial; (b) mean speed in
#    the no-sound zones analysed. Which no-sound zones: readings (a) every no-sound zone between
#    67 and 0 cm, slopes averaged per trial; (b) the no-sound zone nearest the goal.
#
# Paper inconsistencies noted: the Results say uncertainty decreased with sound "between 25.8 and
# 0 cm", where the figures use 25.1 cm. Fig. 4c legend calls RMSE "the expected squared
# deviation", while its name and the Methods take the root. The Results give positive PM slopes
# in no-sound zones as "P = 2.40 x 10-4 to 0, z = 3.67 to 9.59", while Supplementary Fig. 8a
# gives PM without sound as "P = 0.497 to 9.97 x 10-10, z = 0.679 to 6.11".
