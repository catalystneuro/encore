- id: fig7i-iti-timebin-locust
  statement: In the locust a time-bin k-NN classifier's accuracy decays across the 20 s after
    offset to about 40% averaged over odors, but for most odors does not fall to chance.
  source: Results, Odor OFF responses persist long after odor offset, paragraph 3; Figure 7I
  quote: Classifier accuracy decreased to ∼40% across odors throughout the 20-second post stimulus
