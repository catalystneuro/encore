  data: elsewhere
  where: Figshare doi:10.6084/m9.figshare.31435543.v2 (data5_locust_PN85.mat)
  expected:
    quantity: accuracy averaged over odors at the end of the ITI
    value: 40
    tolerance: 4
    unit: percent
  criterion: As Script_Fig5.m and the Methods, 200 ms bins (four 50 ms bins) over the 21 s after
