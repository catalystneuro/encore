- id: figs4a-reference-odor-locust
  statement: In the locust the ON response to a reference odor is closer to other odors' ON
    responses than to OFF responses for most reference odors, significantly for 5 of 11.
  source: Results, ON and OFF responses occupy distinct regions of feature space, paragraph 1;
    Figure 3B and S4A
  quote: While this finding was consistent for most reference odors, the difference in angular
    separation was significant for 5 out of 11 odors in the panel (Fig. S4A).
  data: elsewhere
  where: Figshare doi:10.6084/m9.figshare.31435543.v2 (data2_locust_PN66.mat)
  expected:
    quantity: reference odors with a significant difference
    value: 5
    tolerance: 1
  criterion: As Script_Fig3.m (Fig 3c), PCA of the trial-averaged ON and OFF bins of all 11 odors,
