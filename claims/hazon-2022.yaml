- id: fig2ef-imse-saturates-with-correlations
  statement: With noise correlations the decoding accuracy (IMSE) approaches a bound as ensembles
    grow, while without them it keeps increasing; the asymptotic IMSE (I0 N) and the saturation size
    N are larger for the shuffled data.
  source: Figure 2e and 2f; Results, paragraphs 4 and 5; Supplementary Figure 7c and 7d
  quote: The decoding error approached an asymptotic minimum value for ensembles with large numbers
    of neurons. In contrast, the error decreased without apparent bound for the shuffled data ... The
    asymptotic IMSE value ( I 0 N ) was significantly larger in the trial-shuffled data than in the
    ensemble data for all animals
  statistics:
  - about: asymptotic IMSE I0 N, unshuffled against shuffled
    test: Wilcoxon signed-rank test
    p: 0.001
    p_relation: "<"
  - about: fitted N, unshuffled against shuffled
    test: Wilcoxon signed-rank test
    p: 0.001
    p_relation: "<"
  criterion: IMSE against ensemble size as in the common method (code PanelGenerator.m lines 42 and
    724 to 753). Fit of IMSE(n) = I0 n/(1 + n/N) by unweighted nonlinear least squares to the mean
    IMSE at every size including n = 1, start point I0 = 1, N = 100, no bounds
    (createFit_infoSaturation.m), separately for unshuffled and shuffled data, per working session.
    Two-sided Wilcoxon signed-rank tests of I0 N and of N, unshuffled against shuffled (code
    PanelGenerator.m lines 803 to 852); the code tests either all 110 sessions (multiballnstick.m)
    or the 12 per-animal means (ballnstick.m), both readings. Reproduced when, under one reading,
