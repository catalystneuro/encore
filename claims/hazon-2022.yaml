- id: fig2cd-shuffle-better-in-all-bins
  statement: Decoding is less accurate with noise correlations than without in every spatial bin;
    misclassifications are typically one bin and reach up to three bins.
  source: Figure 2c and 2d; Supplementary Figure 5; Results, paragraph 3
  quote: The misclassification error for ensemble activity data was worse than the case of ensemble
    activity without noise correlations. This effect was consistent across all spatial bins (Fig. 2c
    & Suppl. Fig. 5 ). The misclassification errors were typical of the order of one but could reach
    up to three spatial bins
  criterion: Decoding as in fig2d-rms-error-ensemble-vs-shuffled, all neurons. Per session, the
