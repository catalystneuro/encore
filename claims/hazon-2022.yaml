# Claims for Hazon, Minces, Tomàs, Ganguli, Schnitzer & Jercog (2022), Nature Communications 13,
# 4276, doi:10.1038/s41467-022-31254-y, tested on CRCNS hc-30.
#
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-11,
# protocol as stated in docs/protocol.md (version pilot-14), reader role. The dataset's data were
# not looked at; only its title and its data descriptor (paper/hc-30.data-description.txt) were read.
#
# Text read: the version of record, open access in PMC (PMC9314334), full text from Europe PMC
# (JATS XML flattened): main text, figure legends and Methods; and the Supplementary Information
# (41467_2022_31254_MOESM1_ESM.pdf, Supplementary Figures 1 to 19 and Supplementary Tables 1 and 2),
# as text, with the PDF for the tables. The Source Data file and the Reporting Summary were not
# read; no claim rests on them.
#
# Code read: github.com/approbatory/ML-project, commit 2057af9facfd3035c573e1254bdc32ed4781ba60
# (2022-06-07), linked from Code availability. MATLAB. It holds the event detection
# (utils/hyperdetect.m, supfigs_code/events_converter.mlx), the trial selection, activity tensor,
# trial shuffle, two-fold decoding and signal and noise measures (DecodeTensor.m), the SVM decoders
# (decoding/my_algs.m), the IMSE fit (createFit_infoSaturation.m, PanelGenerator.m), the noise
# eigenvector analyses (@Cloud), the per-session and per-animal quantities and correlations (@Org),
# the session lists (SessManager.m), and live scripts behind most published numbers
# (supfigs_code/*.mlx, fig3_on_events.mlx, fig5_on_events.mlx, pf_widths_nsv_correlation.mlx),
# several with their outputs saved. Method choices taken from it are cited as "code" with the file.
# The script of the synthetic place-field model (Fig. 5a to 5d) was not located.
#
# Data the paper used (Results, paragraph 1; Methods): male C57BL6/J mice expressing GCaMP6m under
# the CaMKIIa promoter in dorsal CA1, imaged with an nVista head-mounted microscope through a GRIN
# lens at 20 Hz while running back and forth on a linear track (120 cm in the Results, 100 cm
# corridor plus two 10 cm end compartments in Methods; the code takes 118 cm) for water rewards at
# alternating ends, about 20 min per session. 239 sessions from 12 mice were recorded; 110 sessions
# from 12 mice with more than 150 neurons and 30 valid trials in each direction are analysed
# ("working" sessions, 27,898 neurons, 151 to 497 per session, median 235), and 73 sessions from 10
# mice with at least 200 neurons ("large-data" sessions) are used for Fig. 3g onwards. Mice are named
# by numbers (2021, 2022, 2026 and so on). Measured variables: the position of the mouse on the track
# from an overhead camera, synchronised frame by frame, and per neuron an event trace (detected
# calcium events, amplitude at onset, convolved with an alpha function of tau = 0.2 s and divided by
# its standard deviation). The data descriptor says CRCNS hc-30 holds 110 sessions, each with the
# mouse name, session ID, a frames by neurons sparse event array and the position per frame.
#
# Common method, from Methods and code, used by many criteria below.
# - Trials (Methods, Data preprocessing; code DecodeTensor.new_sel): velocity is the frame
#   difference of position times cm per pixel times 20 Hz, with 118 cm taken as the span between the
#   5th and 95th percentiles of the position; a trial is a contiguous run of frames with speed above
#   4 cm/s that starts within 1/20 of the span from one end and ends within 1/20 of the other; trials
#   that do not visit all 20 bins are discarded. Direction is that of the run.
# - Bins and tensor (Methods; code construct_tensor): 20 equal bins over the 5th to 95th percentile
#   span (5.9 cm), positions outside clamped to the end bins, separately for each direction (40
#   classes). The tensor holds, per neuron, bin and trial, the mean event trace over the trial's
#   frames in that bin.
# - Trial shuffle (Methods; code shuffle_tensor and decoding/shuffle.m): each neuron's values are
#   permuted across trials independently within each bin and direction; training and test halves are
#   shuffled separately.
# - Decoder (Methods, Computational spatial position decoder; code my_algs 'ecoclin'): one-vs-one
#   ECOC (fitcecoc) of linear SVMs (templateLinear, lasso, Lambda 0, SpaRSA solver), 40 classes.
#   Equal numbers of rightward and leftward trials (the smaller count of the two), split in half at
#   random within direction; train on one half and test on the other and the reverse, errors
#   averaged over the two folds (code decode_all). The position error ignores direction (bin index
#   ceil(class/2)) and is in units of 5.9 cm; MSE is the mean squared bin error times 5.9 squared.
# - Ensemble sizes (code decode_series): 1, 10, 20, ... up to all neurons, 80 random neuron subsets
#   (each with a new trial split) per size; IMSE is 1/MSE per subset, averaged over subsets.
# - Signal and noise (Methods, Analyzing signal and noise; code DecodeTensor.adjacent_metrics and
#   signal_and_noise_analysis.m): per adjacent bin pair and direction (38 pairs), signal direction
#   from the training half's mean difference, signal (projected mean difference)^2 and noise
#   (projected average of the two bins' covariances) on the test half; median over the 38 pairs; 80
#   subsets per ensemble size (sizes 2, 10, 20, ... all); slopes from an unweighted line fit to the
#   subset-averaged values at ensemble sizes of 100 neurons or more (Utils.fitaline); asymptotic SNR
#   is signal slope divided by noise slope.
# - Per-animal correlations (Methods, Statistics; code Org.correlogram): Pearson correlation on
#   values averaged over sessions within each animal, large-data sessions.
schema_version: 2
