- id: fig3f-signal-slope-beginning-vs-end
  statement: The asymptotic signal slope differs between the beginning and the end of runs, decreasing
    over the run as the legend states.
  source: Figure 3f legend
  quote: Signal slope decreases significantly between the beginning and end of runs ( p = 2 × 10 −18 ,
    one-tailed Wilcoxon signed-rank test, n = 110 sessions)
  statistics:
  - test: one-tailed Wilcoxon signed-rank test
    p: 2.0e-18
    n: 110 sessions
  criterion: Per session and per adjacent bin pair, the signal slope fitted at 100 neurons or more
    (common method; code supfigs_code/signal_noise_analysis_by_bin.mlx, calculate_slopes_bins). The
    beginning is the first bin pair of rightward runs and the last of leftward runs (the start of
    each run), the end the opposite pairs, both directions concatenated, 2 x 110 paired values
