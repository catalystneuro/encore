    the standard deviation (code) and the variance (text) are readings. Single-cell SNR per neuron,
    as Supplementary Table 1 footnote *** defines it, is the variance over the track of the mean
    response (signal) over the mean over the track of the trial-by-trial variance; mean and
    standard deviation over neurons. The code that printed 0.41 was not found; the code's version
    of this ratio (same live script) uses a stale variable for the within-bin variance and printed
    0.8782 +/- 0.9971, so it is not a reading. Readings for the pooling are the 40 classes together
    (code) and each direction separately, averaged. Reproduced when the two means match under one
    reading; partially reproduced when one does.
