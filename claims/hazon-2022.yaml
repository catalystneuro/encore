    the code's test, which printed p = 2.19e-18, is signrank(begin, end, tail left), a test that the
    slope is lower at the beginning, so it increases over the run. Reproduced when, under one
    reading, the one-tailed test in the legend's direction (beginning greater) gives p < 0.001; the
    test in the code's direction is reported as a variant, and an outcome that holds only in the
    code's direction is recorded as resting on that reading.
  depends_on:
  - fig3cd-signal-and-noise-growth
- id: fig3g-noise-slope-decreases-over-run
  statement: The asymptotic noise slope decreases monotonically and significantly from the beginning
    to the end of runs.
  source: Figure 3g legend
  quote: Asymptotic noise slope displayed monotonic and significant decreases over the run ( p = 8 ×
    10 −10 , one-tailed Wilcoxon sign rank test, pooling left and right runs, n = 110 sessions)
  statistics:
  - test: one-tailed Wilcoxon signed-rank test, left and right runs pooled
    p: 8.0e-10
    n: 110 sessions
  criterion: As in fig3f-signal-slope-beginning-vs-end, with the unshuffled noise slope, both
    directions pooled (legend and code), one-tailed signrank(begin, end, tail right), that is
    beginning greater (code printed 7.73e-10). The legend says n = 110 sessions, while Methods
    restrict Fig. 3g and the following figures to the 73 large-data sessions; 110 sessions is the
    main reading and 73 a variant. Reproduced when p < 0.001 in that direction. The
    median noise slope over sessions per bin pair, along the run, is reported; "monotonic" is not
    tested, as the paper gives no test for it.
  depends_on:
  - fig3cd-signal-and-noise-growth
- id: fig3h-snr-higher-at-run-end
  statement: The asymptotic SNR (signal slope over noise slope) is significantly higher at the end of
    runs than at their start.
  source: Figure 3h legend; Results, paragraph 7
  quote: The asymptotic SNR (signal-slope / noise-slope) was significantly higher at the end of the
    run than at its initiation ( p = 2 × 10 −29 , one-tailed Wilcoxon sign rank test, n = 110
    sessions)
  statistics:
  - test: one-tailed Wilcoxon signed-rank test
    p: 2.0e-29
    n: 110 sessions
  criterion: As in fig3f-signal-slope-beginning-vs-end, with the asymptotic SNR per bin pair,
    one-tailed signrank(begin, end, tail left), beginning lower (code printed 2.37e-29); pooled
    directions (code) and rightward runs only are readings. Sessions as in
    fig3g-noise-slope-decreases-over-run, 110 (legend) with 73 (Methods) as a variant. Reproduced when p < 0.001 in that
    direction under one reading.
  depends_on:
  - fig3cd-signal-and-noise-growth
- id: fig4a-snr-along-noise-pcs-peaks-at-6
  statement: Along the eigenvectors of the noise covariance, each component's SNR contribution rises
    to a maximum at the sixth component, and the first six carry only a small part of the total, so
    spatial information is spread over many dimensions.
  source: Figure 4a and legend; Results, paragraph 8; Supplementary Figure 12
  quote: We found that each noise component’s contribution to the SNR increased until it reached its
    maximum at the sixth largest component ... The first six components only accounted for a small
    proportion of the neuronal ensemble’s total information
  expected:
    quantity: noise component with the largest test-set SNR
    value: 6
    tolerance: 0
  criterion: 73 large-data sessions. As in the code (@Cloud/eigen_snr_crossval.m,
    @Org/eigen_snr_crossval_aggregation.m). For each of the 38 adjacent bin pairs, 100 random
    half splits of trials; principal components of the noise covariance of the first bin on the
    training half (up to T/2 - 1 components); on the test half, per component, (difference of the
    two bins' mean projections)^2 over the mean of their projection variances. Mean over sessions per
    component, mean over splits, median over bin pairs. Tolerance 0 because the index is an integer
    and 10% of 6 is below 1; a peak at 5 or 7 is partially reproduced. The share of the first six in
    the sum over all computed components is reported; "small" is read as below one half, from the
    legend's "small percentage of the area under the curve".
  depends_on:
  - data-sessions-and-neurons
- id: fig4b-correlations-increase-noise-signal-overlap
  statement: Noise correlations increase the overlap (squared cosine) between the noise principal
    directions and the signal direction compared with shuffled data.
  source: Figure 4b and legend; Results, paragraph 9; Supplementary Figure 15
  quote: We used the area between the two curves (gray) to quantify how noise correlations increased
    the overlap between the noise modes and the signal direction
  criterion: Per large-data session and bin pair, cos^2 between the unit signal direction and each
    noise covariance eigenvector, unshuffled and shuffled (code @Cloud/Cloud.m; Methods, Definitions,
    "the overlap"); the total overlap change is the sum over components of the unshuffled minus the
    shuffled cos^2 (code area_between in @Org/load_definitions.m line 90), averaged over bin pairs.
    Which components are summed is open. The legend and the code use all available components;
    Methods say up to the sixth; both are readings. The eigenvectors are those of the noise
    covariance matrix (Methods, legend; code Cloud.m with use_corr false, as load_from_clouds.m
    calls it); those of the noise correlation matrix (Supplementary Table 2, row 2) are a variant.
    Reproduced when, under one reading, the change
    is positive in the median session and in every one of the 10 animals' means; partially
    reproduced when positive in the median session only.
  depends_on:
  - data-sessions-and-neurons
- id: fig4c-overlap-predicts-asymptotic-snr
  statement: Across animals, the increase in noise and signal overlap caused by noise correlations is
    inversely correlated with the asymptotic SNR (r squared 0.50, p = 0.014), so the geometry of the
    noise predicts where information saturates.
  source: Results, paragraph 9; Figure 4c legend
  quote: We found that the average change in total overlap between noise and signal direction was
    inversely correlated with the asymptotic SNR slope (i.e., Fig. 3e & Suppl. Fig. 10b ) across
    animals (Fig. 4c , r 2 = 0.50, p = 0.014), confirming the intuition
  statistics:
  - test: Pearson correlation across animals
    statistic: r2 = 0.50
    p: 0.014
    n: 73 sessions with 10 mice, averaged per animal
  expected:
    quantity: r squared across animals
    value: 0.50
    tolerance: 0.05
  criterion: Overlap change per session from fig4b-correlations-increase-noise-signal-overlap,
    unshuffled asymptotic SNR per session from suppl10-asymptotic-snr-lower-with-correlations; both
    averaged within each of the 10 animals; Pearson correlation (code fig3_on_events.mlx,
    correlogram('cos2_area','asymp_snr'), which printed adjusted R squared 0.498, r = -0.744, p =
    0.0136). The legend's "Pearson's corr. = 0.81" does not match r squared 0.50 and is not used.
    Readings are the r squared as adjusted (code) or plain, the components summed as in
    fig4b-correlations-increase-noise-signal-overlap, and the y variable as the unshuffled asymptotic
    SNR (code, Results) or the asymptotic SNR ratio (Supplementary Table 2, row 2, aggregated r =
    -0.74, p = 0.015). Reproduced when, under one reading, r is negative, p < 0.05 and r squared is
    within tolerance; partially reproduced when r is negative with p < 0.05.
  depends_on:
  - fig4b-correlations-increase-noise-signal-overlap
  - suppl10-asymptotic-snr-lower-with-correlations
- id: fig5f-pf-width-variance-vs-nsv
  statement: Across animals, the broader the distribution of place-field widths, the smaller the
    normalized signal variance (NSV) (Pearson r = -0.65, r squared 0.36, p = 0.039).
  source: Figure 5f legend; Results, paragraph 11
  quote: f Correlation between animal’s PF width and NSV. The broader the width distribution, the
    narrower the NSV values per animal. Pearson’s corr. = −0.65, r 2 = 0.36, p val = 0.039
  statistics:
  - test: Pearson correlation across animals
    statistic: r = -0.65, r2 = 0.36
    p: 0.039
    n: animals, each the average of its sessions
  expected:
    quantity: Pearson r across animals
    value: -0.65
    tolerance: 0.065
  criterion: Large-data sessions. NSV per bin pair is the variance over neurons of the squared
    elements of the unit signal direction (difference of the two bins' trial-mean responses, all
    neurons; Methods, Definition of the NSV; code @Org/load_definitions.m line 43), averaged over the
    38 bin pairs per session. PF width spread per session is the variance over neurons of the
    half-width at half maximum of each direction's mean tuning curve, in cm (code var_fwhm_cm,
    load_definitions.m lines 255 and 559 to 611). Both averaged per animal; Pearson correlation
    (code pf_widths_nsv_correlation.mlx printed r = -0.657, p = 0.0389 on 73 sessions). Reproduced
    when r is within tolerance with p < 0.05; partially reproduced when r is negative with p < 0.05.
  depends_on:
  - data-sessions-and-neurons
- id: fig5hi-nsv-predicts-noise-correlation-effect
  statement: Across animals, the NSV correlates with the ratio of asymptotic SNR with and without
    noise correlations (Pearson 0.83, r squared 0.65, p = 0.003); animals with a small NSV lose more
    information to noise correlations.
  source: Figure 5h and 5i legends; Results, paragraph 11; Supplementary Table 2, row 1
  quote: i Correlation between the asymptotic SNR ratio (i.e., ensemble with noise correlations over
    ensemble shuffled) and averaged NSV (Pearson’s corr. = 0.83, r 2 = 0.65, p val = 0.003)
  statistics:
  - about: across animals
    test: Pearson correlation
    statistic: r = 0.83, r2 = 0.65
    p: 0.003
    n: animals, each the average of its sessions
  - about: across sessions
    test: Pearson correlation
    statistic: rho = 0.76, adjusted R2 = 0.57
    p: 1.6e-14
    n: 73 sessions with more than 200 neurons
  expected:
  - quantity: Pearson r across animals
    value: 0.83
    tolerance: 0.083
  - quantity: Pearson r across sessions
    value: 0.76
    tolerance: 0.076
  criterion: NSV per session as in fig5f-pf-width-variance-vs-nsv; asymptotic SNR ratio per session is
    unshuffled over shuffled (legend 5i; code session_properties_dataset.m lines 14 to 16). The
    Results sentence names the same ratio but says the smaller the NSV the larger the ratio, which
    fits shuffled over unshuffled, the ratio the Supplementary Table 2 header names; with a positive
    r 0.83 and Fig. 5h (larger effect for small NSV), unshuffled over shuffled is the main reading. Code filters
    (Org.m lines 206 to 209) keep sessions with values larger than their confidence interval and
    ratio below 7 (72 sessions; printed r = 0.831, p = 0.00287); with and without these filters are
    readings. Reproduced when, under one reading, the across-animal r is within tolerance with p <
    0.05 and the across-session r is positive with p < 0.05; partially reproduced when one of the two
    holds.
  depends_on:
  - fig5f-pf-width-variance-vs-nsv
  - suppl10-asymptotic-snr-lower-with-correlations
- id: suppl-table2-nsv-best-predictor
  statement: Of the variables tested, the NSV explains the effect of noise correlations on the
    asymptotic SNR best (highest adjusted R squared), and the result does not depend on the number of
    neurons or trials in a session.
  source: Results, paragraph 11; Supplementary Table 2; Supplementary Figure 19
  quote: NSV described the relation between noise correlation and asymptotic SNR ratio better than
    other variables that parametrized PF shape (see Suppl. Table 2 for comparisons with other
    quantities). We confirmed that our result does not depend on the number of neurons active or
    trials performed in a given session
  statistics:
  - about: number of neurons against the ratio, across sessions
    test: Pearson correlation
    statistic: rho = -0.54
    p: 9.3e-7
  - about: number of trials against the ratio, across sessions
    test: Pearson correlation
    statistic: rho = -0.18
    p: 0.12
  - about: NSV against the ratio at a fixed number of neurons, across sessions
    test: Pearson correlation
    statistic: r = 0.470
    p: 3.0e-5
  - about: NSV against the ratio at a fixed number of neurons, across animals
    test: Pearson correlation
    statistic: r = 0.738
    p: 0.01
  criterion: The variables of Supplementary Table 2 as its notes define them (eleven rows, though the
    note says ten), per session over
    adjacent bin pairs, against the asymptotic SNR ratio of fig5hi-nsv-predicts-noise-correlation-effect,
    73 large-data sessions, excluding points whose confidence interval is larger than the value
    (table notes). Reproduced when the NSV has the highest adjusted R squared across sessions, and
    at a fixed ensemble of 200 neurons (code fixed_nsv, load_definitions.m lines 24 and 25, 100
    random subsets) the NSV still correlates with the ratio at p < 0.05 across sessions. Partially
    reproduced when the NSV is among the two highest. The variables whose definition the table
    leaves unclear (the effective number of modes and the two inverse sums of fourth powers) are
    computed as their formulas read; if one cannot be computed it is left out and reported.
  depends_on:
  - fig5hi-nsv-predicts-noise-correlation-effect
- id: pf-width-variance-not-predictive
  statement: The variance of place-field widths or amplitudes does not directly correlate with the
    effect of noise correlations on information saturation.
  source: Results, paragraph 11; Supplementary Table 2, row "Var(PF's halfwidths)"
  quote: We did not find a direct correlation between the variance of PF amplitudes or widths with the
    effect of noise correlations on information saturation
  statistics:
  - about: variance of PF half-widths against the ratio, across sessions
    test: Pearson correlation
    statistic: rho = -0.21
    p: 0.082
  - about: variance of PF half-widths against the ratio, across animals
    test: Pearson correlation
    statistic: rho = -0.51
    p: 0.13
  criterion: A claim of absence, judged on the paper's test, the Pearson correlation of Supplementary
    Table 2 (73 large-data sessions, and aggregated per animal) between the variance over neurons of
    PF half-widths and the asymptotic SNR ratio, at p < 0.05. Reproduced when neither the
    session-level nor the animal-level test reaches p < 0.05; not reproduced when either does. The
    same test on the variance of PF amplitudes (peak of the trial-mean tuning curve) is shown, as the
    text names it but the table does not.
  depends_on:
  - fig5hi-nsv-predicts-noise-correlation-effect
- id: suppl11b-i0-vs-single-cell-snr
  statement: Across mice, the initial slope I0 of the IMSE curve correlates with the average
    single-cell SNR (r squared 0.73, p < 0.01).
  source: Supplementary Figure 11b; Methods, Analyzing signal and noise in the spatial code,
    paragraph 4
  quote: The linear slope coefficients, I0, from the IMSE of decoding, were strongly correlated with
    the SNR computed across each neuron individually ... The variables were directly correlated
    across mice (r2=0.73, p < 0.01)
  statistics:
  - test: Pearson correlation across mice
    statistic: r2 = 0.73
    p: 0.01
    p_relation: "<"
    n: 73 sessions from 10 mice, averaged per mouse
  expected:
    quantity: r squared across mice
    value: 0.73
    tolerance: 0.073
  criterion: Unshuffled I0 from fig2ef-imse-saturates-with-correlations; single-cell SNR per neuron as
    Methods define it here, the median over adjacent bin pairs of the squared mean difference
    divided by the median over bin pairs of the pooled variance, averaged over neurons (main
    reading). The code (DecodeTensor.single_cell_d_primes2, lines 2298 to 2316) takes the ratio per
    bin pair and averages it over bin pairs (its comment says it used to be the median); the mean
    and the median of the per-pair ratio are variants. Per-mouse averages over the
    large-data sessions; Pearson correlation. Reproduced when r is positive, p < 0.01 and r squared
    within tolerance; partially reproduced when r is positive with p < 0.05.
  depends_on:
  - fig2ef-imse-saturates-with-correlations
- id: suppl11c-asymptotic-imse-vs-asymptotic-snr
  statement: Across mice, the fitted asymptotic IMSE (I0 N) correlates with the asymptotic SNR (r
    squared 0.88).
  source: Supplementary Figure 11c
  quote: The fitted asymptotic IMSE of the decoders (as in Fig. 2f), I0N, correlated with the
    asymptotic SNR values ... The variables were directly correlated across mice (r2=0.88, p <
    4・10-5)
  statistics:
  - test: Pearson correlation across mice
    statistic: r2 = 0.88
    p: 4.0e-5
    p_relation: "<"
    n: 73 sessions from 10 mice, averaged per mouse
  expected:
    quantity: r squared across mice
    value: 0.88
    tolerance: 0.088
  criterion: Unshuffled I0 N from fig2ef-imse-saturates-with-correlations and unshuffled asymptotic
    SNR from suppl10-asymptotic-snr-lower-with-correlations, large-data sessions, averaged per mouse,
    Pearson correlation; values on linear and on log scales (Suppl. Fig. 11a uses a log scale) are
    readings. Reproduced when r is positive, p < 0.001 and r squared is within tolerance under one
    reading; partially reproduced when r is positive with p < 0.05.
  depends_on:
  - fig2ef-imse-saturates-with-correlations
  - suppl10-asymptotic-snr-lower-with-correlations
- id: suppl8-task-performance-and-accuracy
  statement: Task performance correlates with the number of trials (r 0.85) and with asymptotic
    decoding accuracy (r 0.52); the number of trials correlates weakly with accuracy (r 0.34), and a
    path analysis shows performance predicts accuracy while trial number does not.
  source: Supplementary Figure 8a to 8d; Methods, Path analysis
  quote: Performance, computed as the ratio of correct over total trials, correlated with the number
    of trials done by an animal on a given session, using n = 73 sessions (r2 = 0.71, Pearson-corr =
    0.85, pval = 4x10-21)
  statistics:
  - about: performance against number of trials
    test: Pearson correlation
    statistic: r = 0.85, r2 = 0.71
    p: 4.0e-21
    n: 73 sessions
  - about: asymptotic accuracy against number of trials
    test: Pearson correlation
    statistic: r = 0.34, r2 = 0.11
    p: 0.0029
    n: 73 sessions
  - about: asymptotic accuracy against performance
    test: Pearson correlation
    statistic: r = 0.52, r2 = 0.26
    p: 2.1e-6
    n: 73 sessions
  expected:
  - quantity: r, performance against trials
    value: 0.85
    tolerance: 0.085
  - quantity: r, accuracy against trials
    value: 0.34
    tolerance: 0.034
  - quantity: r, accuracy against performance
    value: 0.52
    tolerance: 0.052
  criterion: 73 large-data sessions, one value per session. Performance is correct over total runs,
    where a run is incorrect when slow (below 4 cm/s) or turning back before 5.9 cm from the end
    (code error_trial_counter.m); number of trials is the total of both directions (code
    @Org/load_from_clouds.m line 27). Asymptotic accuracy is the unshuffled I0 N of
    fig2ef-imse-saturates-with-correlations; the code (supfigs_code/sf6_events.mlx) uses log10(I0
    N) and printed r = 0.843, 0.402 and 0.559, close to but not equal to the legend, so log10 and
    linear I0 N are readings. Path analysis as Methods say, a linear model of log asymptotic IMSE on
    trials and performance (fitlm). Reproduced when, under one reading, the three r values are within
    tolerance with p < 0.05 and in the path model performance has p < 0.05 and trials p > 0.05;
    partially reproduced when the signs and significance hold but some r is outside tolerance.
  depends_on:
  - fig2ef-imse-saturates-with-correlations
- id: suppl6-twenty-bins-near-optimal
  statement: Twenty spatial bins give close to the smallest decoding error relative to the continuous
    position (11.75 cm, 95% CI 10.33 to 13.18 cm), similar to 30 bins (11.53 cm).
  source: Supplementary Figure 6; Methods, Analysis of behavioral data
  quote: For 20 bins, the RMS error across sessions was 11.75 cm with a 95% CI of [10.33 - 13.18 cm]
    based on the SEM. For 30 bins, the RMS error was 11.53 cm with a 95% CI of [10.08 - 12.98 cm]
  statistics:
  - about: RMS error with 20 bins
    ci:
      level: 0.95
      low: 10.33
      high: 13.18
      unit: cm
    n: 110 sessions, 12 mice
  - about: RMS error with 30 bins
    ci:
      level: 0.95
      low: 10.08
      high: 12.98
      unit: cm
    n: 110 sessions, 12 mice
  expected:
  - quantity: mean RMS error with 20 bins
    value: 11.75
    tolerance: 1.43
    unit: cm
  - quantity: mean RMS error with 30 bins
    value: 11.53
    tolerance: 1.45
    unit: cm
  criterion: Tolerances are the half-widths of the paper's 95% intervals. Decoder of the common method
    with all neurons, unshuffled, the number of bins varied, 80 train and test divisions per session;
    error relative to the continuous position (legend), RMS per session, mean and 1.96 SEM over the
    110 sessions. The bin numbers compared and the point of the bin taken as the prediction are open;
    readings are the bin centre (main) and the mean position of the training samples in the bin.
    Reproduced when both means are within tolerance and no number of bins tested has a mean RMS more
    than one SEM below that of 20 bins; the one-SEM margin for "close to the smallest" is a standard
    choice, not the paper's.
- id: fig5cd-synthetic-narrow-widths-broader-nsv
  statement: In synthetic Gaussian place-field populations, a narrow distribution of field widths
    gives a broader distribution of PF slopes, a higher NSV, than a broad width distribution, up to
    ten thousand neurons.
  source: Figure 5a to 5d and legend; Results, paragraph 11; Supplementary Figures 16 and 17
  quote: Although counterintuitive, the narrower the distribution of PF widths, the broader the
    distribution of PF slope, quantified by the NSV (Fig. 5c, d )
  data: elsewhere
  where: simulation from the paper's model; GitHub approbatory/ML-project at commit 2057af9 (the script
    of this model was not located)
  criterion: Synthetic populations of 50 Gaussian place fields with centres uniform over 20 bins, 1000
    simulations per width distribution, NSV per adjacent bin pair. The width distribution is open,
    as the paper gives two. The legend (and Supplementary Figure 16) says uniform half-widths of 0.2
    to 1.42 bins (narrow) and 0.8 to 2.0 (broad); Methods say log-normal half-widths with log mean 0
    and log variance 0.3 (narrow) and 2 (broad). Both are readings. Amplitudes are open (all 1 is the
    standard choice). Reproduced when, under both readings, the median NSV over simulations and bins
    is higher for the narrow distribution, and at 10,000 neurons the mean NSV is still higher for it
    (Suppl. Fig. 17); resting on an assumption when only one reading gives it.
- id: suppl9-fit-recovers-saturation
  statement: On simulated place cells with information-limiting input noise, the IMSE fit gives
    consistent saturation estimates N from ensembles of 500 and 2000 neurons.
  source: Supplementary Figure 9; Results, paragraph 5
  quote: We validated our method for finding the saturation point; we created artificial data and
    compared the procedure with populations of 500 and 2000 neurons and found no significant
    difference in the saturation parameter estimates N
  data: elsewhere
  where: simulation from the paper's model (Supplementary Figure 9 legend); GitHub
    approbatory/ML-project at commit 2057af9, simulation/ (the script of this figure was not
    identified)
  criterion: Model from the Supplementary Figure 9 legend. Gaussian place fields with FWHM 30 cm,
    centres uniform on the track, peak rate 0.05 (per frame), inhomogeneous Poisson firing driven by
    a 30-minute trajectory corrupted with Gaussian noise of 10 cm SD, decoded on the true position
    with a Poisson naive Bayes decoder, 16 random subsets and splits per size, IMSE fit as in
    fig2ef-imse-saturates-with-correlations. The trajectory model, binning and time bin are open;
    the standard choice is the 20 bins of the main analysis, frames at 20 Hz and back-and-forth runs
    at constant speed. A claim of absence judged as the legend shows it, by the 95% intervals. It is
    reproduced when the two fitted N have overlapping 95% intervals, and not reproduced when they
    do not.
  depends_on:
  - fig2ef-imse-saturates-with-correlations
