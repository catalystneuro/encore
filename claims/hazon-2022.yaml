  source: Results, paragraph 3; Figure 2d; Discussion, paragraph 8
  quote: the root mean square (RMS) error between predicted and recorded mouse positions showed that
    the effect of noise correlations was detrimental for position estimation across all spatial bins
    ... 9.38 + /−4.06 cm ... 5.15 + /−2.40 cm (median + /− IQR, n = 110 sessions)
