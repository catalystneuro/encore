- id: fig1d-noise-correlation-by-field-distance
  statement: Noise correlations between neuron pairs depend on the distance between their place-field
    peaks, highest for nearby fields, and trial shuffling drastically reduces them.
  source: Figure 1d and legend; Results, paragraph 2
  quote: The shuffling procedure drastically reduced noise correlations in the shuffled data ... we
    found that noise correlations’ dependence on PF distance was similar to previously measured
    values in other brain regions
  criterion: As in the code (@Cloud/Cloud.m lines 56 to 63, @Org/load_definitions.m lines 258 to 328
    and 397 to 404, final_figures/f1d_noiseCorrByPeakDistance.m). Per session and per bin of each
    direction, the Pearson correlation over trials between every pair of neurons, from the tensor
    and from its trial-shuffled copy; averaged over the 20 bins of each direction. Place-field peak
    is the bin of the largest trial-mean response in that direction; distance is the absolute
    difference in bins. Mean correlation per distance per session, then mean and 95% interval (1.96
    SEM) over the 110 sessions, for each direction; the legend counts 3,941,140 pairs, so the mean
    and 95% interval over all pairs pooled is also a reading. The code's averaging joins distances d and d+1
    in one point (its avg_bins takes both ends); single distances are the main reading and the
    code's joined bins a variant. "Similar to other regions" is read, from the Introduction's
    limited-range correlations, as larger correlations at short distance. Reproduced when, in both
    directions, the unshuffled mean correlation at distance 0 exceeds that at distances of 10 bins
    or more, and the shuffled mean is below the unshuffled one, with non-overlapping intervals, at
    every distance up to 10 bins; partially reproduced when only one of the two parts holds.
- id: noise-correlation-not-physical-distance
  statement: Pairwise correlations do not depend on the physical distance between the neurons in the
    field of view, so they are not produced by contamination from nearby cells.
  source: Results, paragraph 2
  quote: to test if the correlations were generated through contamination from nearby cells, we
    confirmed that pairwise correlations were independent of the physical distance of the neurons
    within the recording field of view
  criterion: A claim of absence, for which the paper names no test or threshold. The code
    (neuropil_contamination_argument.m) takes noise residuals (activity minus the class mean, over
    all 40 classes pooled), their Pearson correlation matrix, the Euclidean distance between cell
    centroids, and a linear fit of distance on correlation reported by its adjusted R squared. The
    test used here follows it, per session, over all pairs. The threshold is open; readings are (a)
    adjusted R squared below 0.05 in every session, (b) a pooled Pearson correlation across all pairs
    of all sessions with absolute value below 0.1. Reproduced when both hold, not reproduced when
    neither does, and resting on an assumption otherwise. Needs cell positions; if the dataset has
    none, the claim cannot be tested.
