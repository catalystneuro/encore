- id: single-cell-variability
  statement: Single-neuron responses vary strongly between visits to the same bin (response variance
    0.7263 +/- 0.6117), and the single-cell signal-to-noise ratio, variance between bins over
    variance within bins, is 0.41 +/- 0.34, pooled over 27,898 neurons.
  source: Results, paragraph 1; Supplementary Table 1 (last column and footnote ***)
  quote: Neuronal response fluctuations were, in general, large for different visits to each spatial
    bin (response variance = 0.7263 + /− 0.6117, variance between bins / variance within bins =
    single-cell signal-to-noise ratio = 0.41 + /− 0.34, pooled from 27,898 neurons)
  expected:
  - quantity: response variability, mean over neurons and bins
    value: 0.7263
    tolerance: 0.0726
  - quantity: response variability, spread
    value: 0.6117
    tolerance: 0.0612
  - quantity: single-cell SNR, mean over neurons
    value: 0.41
    tolerance: 0.041
  - quantity: single-cell SNR, spread over neurons
    value: 0.34
    tolerance: 0.034
  criterion: Tolerances are 10% of the reported values, as the +/- is the spread over neurons, not an
    uncertainty of the mean. Tensor from the common method, 110 working sessions, 40 bin and
    direction classes. Response variability per neuron and class over trials; the text calls it a
    variance, while the code (supfigs_code/variance_per_neuron.mlx) averages the standard deviation
