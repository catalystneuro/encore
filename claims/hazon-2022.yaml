- id: fig3cd-signal-and-noise-growth
  statement: The spatial signal grows linearly with ensemble size and does not change with trial
    shuffling, while the noise along the signal direction keeps growing linearly in the unmodified
    data but saturates within about 100 neurons in the shuffled data.
  source: Figure 3c and 3d; Methods, Analyzing signal and noise in the spatial code, paragraph 1
  quote: This quantity grew linearly with ensemble size and was independent of trial shuffling (Fig.
    3b, c ). Similarly, we defined noise σ 2 as the trial-by-trial variance of the neuronal
    population responses along the signal direction between two adjacent spatial bins (Fig. 3b ).
    The noise in the unmodified data kept increasing linearly with ensemble size, whereas in the
    shuffled data, it reached saturation well within the first ~100 neurons
  criterion: Signal and noise against ensemble size as in the common method, 110 working sessions,
    unshuffled and shuffled. "Linear" and "saturated" are judged from the linear fits at 100 neurons
    or more that the paper uses for slopes, as no test is named. Reproduced when, in the median
    session, (1) the signal slope from shuffled data is within 10% of that from unshuffled data;
    (2) the unshuffled noise slope is positive with the line explaining at least 90% of the variance
    of the subset-averaged noise values over 100 neurons; (3) the shuffled noise slope is below 10%
    of the unshuffled one. Partially reproduced when two of the three hold. The 10% and 90% margins
    are standard choices, not the paper's.
