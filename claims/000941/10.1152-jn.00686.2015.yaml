    mean whose maximum lies inside the epoch with a rise before it and a fall after it.
    Reproduced when all three hold; partially reproduced when two hold.
- id: fig2-hand-opening-two-phases
  statement: In the same movements, the ThumbFlex, four MCP, ThumbMCP, IndexPIP, MiddlePIP, RingPIP
    and ThumbAbAd angles extend
    (decrease) first, pause or slightly reverse near the middle of the epoch, near the time of peak
    transport speed, then extend again, and keep extending, opening the hand, until just before
    contact.
  source: Results, Temporal Trajectories of Individual Joint Angles, paragraphs 2 and 3; Figure 2
  quote: All of these angles initially decreased (extended), paused or slightly reversed near the
    middle of the reach-to-grasp epoch, and then decreased again, apparently separating the time
    course of hand opening into two phases ... all of these latter joints continued to extend
    (decreasing values), opening the hand, until immediately prior to peripheral object contact
  depends_on:
  - fig2-trial-count-coax-45
  criterion: The trials of fig2-trial-count-coax-45, the mean time-normalized trajectory of each
    of the ten angles the paper lists (ThumbFlex, the four MCP, ThumbMCP, IndexPIP, MiddlePIP,
    RingPIP and ThumbAbAd; LittlePIP is not in this list, the paper puts it with the angles that
    decrease, increase and decrease again). No measure is given, so the words are read as
    follows (open). A pause is a local minimum of the extension speed (the negative of the mean
    angle's derivative), or a reversal to positive derivative, between 25% and 75% of normalized
    time; its time is compared with that of peak distal forearm speed. Extension until just
