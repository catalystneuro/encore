- id: fig4-armps-time-course
  statement: For ArmPS in monkey L, the location effect rises until about midway between onset and
    contact and then declines to small but still significant values before contact; the object
    effect stays small until shortly before the midpoint and then rises until contact, when it
    accounts for almost all the variance; the interaction is significant but small throughout.
  source: Figure 4; Results, Effects of Location and Object on Joint Angles as a Function of Time,
    paragraph 2
  quote: After movement onset (M), the main effect of location (red) increased until
    approximately midway between movement onset and peripheral object contact (C) and thereafter
    decreased, reaching small but still significant values prior to contact. In contrast, the main
    effect of object (blue) remained small until shortly before the midpoint and then rose
    progressively until contact, at which time the object effect accounted for almost all of the
    variance in ArmPS angle
  statistics:
  - test: two-way ANOVA F-test with the maximum SSError
    p: 0.05
    p_relation: "<"
    corrected: Bonferroni, over 153 time points
    n: analyzed trials of session L20120928
  criterion: ANOVA effect sizes and significance as in the common methods, ArmPS, session
    L20120928, each sum of squares reading. "Approximately midway" and "almost all" are not
    given numbers; they are read as a location peak between 30% and 70% of normalized time, and
    an object eta2 at C of at least 0.9 (the default 10% tolerance on all of the variance, 1.0).
    Reproduced when, under every sum of squares reading, the location peak lies in that window,
    location eta2 at C is below its peak and significant, object eta2 at C is at least 0.9,
    object eta2 is below location eta2 at 30%, and the interaction eta2 is below both main effects
    at C and significant at some time from M to C. Partially reproduced when the order of the
    location peak and the object rise holds but a number does not. Readings that disagree make the
    claim blocked as methods_underspecified.
