# Claims for Rouse & Schieber (2015), J Neurophysiol 114:3268-3282, on dandiset 000941.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23,
# protocol pilot-10 as stated in docs/protocol.md (Reader, steps 1 to 4).
#
# Text read. The version of record (PDF supplied by a person, text extracted with PyMuPDF),
# complete with Methods, Results, figure legends, Table 1 and Table 2. The paper has no
# supplement. Some symbols are garbled in the extracted text (the "<", ">", "~", "x" glyphs
# and the eta in "eta squared"); quotes are cut around them with "...". The sense of each
# garbled comparison was taken from the sentence around it (e.g. "Qm ratios ... 0.5, indicating
# larger location than object effects" is Qm > 0.5).
#
# Code read. The paper links no code and gives no code or data availability statement. Nothing
# below rests on code; every method detail is from the Methods, the Results or the legends.
#
# Dataset. Dandiset 000941 is titled "FALCON Benchmark M1-A: primary motor cortex recordings in
# primate during reach-to-grasp task" and lists this paper with three others from the same
# laboratory (J Neurosci 2016, J Neurophysiol 2016 on EMG, Cell Reports 2018). Whether it holds
# the kinematic data of this paper (marker positions or joint angles, for which monkeys and
# sessions) is for the author to find.
#
# Data the paper used (as reported). Three male rhesus monkeys, L, X and Y, one session each:
# L20120928, X20121219, Y20130516 (Table 2). Task: from a center coaxial cylinder the monkey
# reached to, grasped and manipulated one of four peripheral objects (perpendicular cylinder,
# coaxial cylinder, button, sphere), cued by blue LEDs; the object array was rotated to put the
# objects at eight locations, 0 to 157.5 degrees in 22.5 degree steps, giving 24 location-object
# combinations (sphere and button never at the leftmost locations, perpendicular cylinder not at
# the rightmost). Events: Cue, release of center object, Contact (strain gauges), Switch.
# Successful trials preceded by an error trial were excluded. 36 reflective markers tracked at
# 200 frames/s (Vicon); 22 joint angles computed with a rigid body model (Table 1: ShoulderIER,
# ShoulderFlex, ShoulderAbAd, ElbowFlex, ArmPS, WristFlex, WristRU, ThumbFlex, Index/Middle/Ring/
# LittleMCP, ThumbAbAd, Index/Middle/Ring/LittleAbAd, ThumbMCP, Index/Middle/Ring/LittlePIP).
# Measured variables needed: marker positions or joint angles, object and location per trial,
# trial outcome and order, cue, movement onset and contact times.
#
# Methods common to the claims (each from the Methods unless said; criteria refer to them).
# - Trials (Methods, Behavioral Task): successful trials, excluding successful trials preceded
#   by an error trial.
# - Movement onset (Methods, Temporal Normalization): speed of each of the 36 markers in 5 ms
#   steps, averaged over markers; baseline mean and SD over 100 ms before to 100 ms after the
#   cue across all successful trials of the session; onset is when the average speed exceeds 5
#   SDs of the baseline. Open: whether the threshold is the baseline mean plus 5 SD or 5 SD
#   alone, and whether the first crossing is sought after the cue or anywhere in the trial.
#   Readings (a) mean + 5 SD, first crossing after the cue; (b) 5 SD alone, first crossing after
#   the cue. If the dataset gives onset times, those are used and the readings are not needed.
# - Time normalization (Methods): each joint angle linearly interpolated (interp1) between onset
#   (M) and contact (C) to the session's median movement duration in 200 Hz samples (52, 48 and
#   68 samples including M and C, Table 2); after C resampled at the same rate; before M left at
#   200 Hz. Normalized time 0% is M and 100% is C. The 30% and 90% points are not tied to a sample;
#   readings (a) nearest sample, (b) linear interpolation between samples; a standard choice that
#   should not change outcomes, both shown.
# - ANOVA (Methods, Data Analysis): at each normalized time point, each joint angle submitted to
#   a two-way ANOVA with location, object and location x object. Effect size (Eq. 1) is
#   eta2_i(t) = SS_i(t) / (SSLoc(t) + SSObj(t) + SSLocxObj(t) + max over time of SSError).
#   Significance by the ANOVA F-test using the maximum SSError, at P < 0.05 divided by the number
#   of time points (153 for L, 143 for X, 185 for Y). Open, could change magnitudes: (1) the sum of
#   squares type for this unbalanced design with empty cells, readings type I (location first),
#   type II and type III (the default of Matlab anovan, Matlab being the software the Methods
#   name); (2) where the 153, 143 and 185 points lie, as the paper gives their number but not how
#   many fall before M and after C (52, 48 and 68 lie from M to C); reading (a) the extra points
#   split equally before M and after C (odd one after C), and reading (b) the maximum SSError
#   taken from M to C only. Neither placement is given by the paper; (a) and (b) are both readings,
#   and an outcome holds only when they agree. Qm = SSLoc/(SSLoc+SSObj) (Eq. 2); Qx = SSLocxObj/(SSLoc+SSObj+SSLocxObj)
#   (Eq. 3).
# - LDA (Methods, Linear discriminant analysis): five angle groups (shoulder: ShoulderIER,
#   ShoulderAbAd, ShoulderFlex; wrist: ArmPS, WristFlex, WristRU; proximal digit F/E: ThumbFlex and
#   the four finger MCP; digit Ab/Ad: the five AbAd; intermediate digit F/E: ThumbMCP and the four
#   PIP). At each normalized time point, location classified given the object (4, 6 or 8 classes)
#   and averaged over the four objects; object classified given the location (2, 3 or 4 classes)
#   and averaged over the eight locations. 10-fold cross-validation on random partitions of the
#   session's trials; 95% Clopper-Pearson intervals. Open: class priors (readings empirical, the
#   default of Matlab classify and fitcdiscr, and uniform); whether folds are stratified (a
#   standard choice, unstratified as written, stratified as a variant); how the interval is
#   formed after averaging (readings (a) Clopper-Pearson on correct and total counts pooled over
#   objects or locations, (b) on the mean accuracy with the total trial count). The fold seed is
#   a standard choice.
# - Epoch: the reach-to-grasp epoch is M to C. "Peak" below means the maximum over the samples
#   from M to C, and "mean" the mean over those samples, unless said otherwise.
