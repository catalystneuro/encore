- id: fig2-joint-patterns
  statement: In monkey L's movements to the coaxial cylinder at 45 degrees, the distal forearm
    speed has a bell-shaped profile, ShoulderIER moves monophasically from one position to
    another, and ElbowFlex first increases and then decreases.
  source: Results, Temporal Trajectories of Individual Joint Angles, paragraph 2; Figure 2
  quote: although the speed of the distal forearm point showed the conventional bell-shaped
    profile, the trajectories of individual joint angles showed a variety of temporal patterns. Only
    ShoulderIER showed a monophasic transition from one angular position to another. The elbow
    flexion/extension (ElbowFlex) angle first increased and then decreased
  depends_on:
  - fig2-trial-count-coax-45
  criterion: The trials of fig2-trial-count-coax-45, time-normalized (common methods), the mean
    trajectory over trials from M to C. The paper gives no measure for these shapes, so they are
    read as follows (open, a reading of the words). Bell-shaped is a single interior maximum of
    the mean distal forearm speed; the distal forearm point is the point 1.1 cm deep to the five
