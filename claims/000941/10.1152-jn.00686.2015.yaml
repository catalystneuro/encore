- id: fig7-mean-eta-30
  statement: Averaged over the 22 angles at the 30% point, location effects are as large as or
    larger than object effects (location/object/interaction, L 0.22/0.08/0.05, X 0.15/0.16/0.05,
    Y 0.12/0.11/0.04).
  source: Figure 7; Results, Effects of Location and Object on Joint Angles as a Function of
    Time, paragraph 9
  quote: >-
    At the 30% time point, location effects were as large as, or somewhat larger than, object
    effects (location/object/ interaction: monkey L: 0.22/0.08/0.05; monkey X: 0.15/0.16/ 0.05;
    monkey Y: 0.12/0.11/0.04)
  expected:
  - quantity: mean location eta2 at 30%, monkey L
    value: 0.22
    tolerance: 0.022
  - quantity: mean object eta2 at 30%, monkey L
    value: 0.08
    tolerance: 0.008
  - quantity: mean interaction eta2 at 30%, monkey L
    value: 0.05
    tolerance: 0.005
  - quantity: mean location eta2 at 30%, monkey X
    value: 0.15
    tolerance: 0.015
  - quantity: mean object eta2 at 30%, monkey X
    value: 0.16
    tolerance: 0.016
  - quantity: mean interaction eta2 at 30%, monkey X
    value: 0.05
    tolerance: 0.005
  - quantity: mean location eta2 at 30%, monkey Y
    value: 0.12
    tolerance: 0.012
  - quantity: mean object eta2 at 30%, monkey Y
    value: 0.11
    tolerance: 0.011
  - quantity: mean interaction eta2 at 30%, monkey Y
    value: 0.04
    tolerance: 0.004
  criterion: Mean over the 22 angles of eta2 (Eq. 1) for each effect at the 30% point, under every
    sum of squares reading and both placements of the maximum SSError (common methods).
    The tolerance is the default 10%, tight for two-decimal values; the values printed to two
    decimals are compared after rounding. The sum of squares type and the SSError placement are
    method details the paper leaves open, so the outcome is the one all combinations give.
    Reproduced when all nine values are within tolerance under every combination; partially
    reproduced when, under every combination, location is at least object minus 0.01 in every
    monkey and some value misses tolerance. Combinations that give different outcomes make the
    claim blocked as methods_underspecified. The values under every combination are shown.
- id: fig7-mean-eta-90
  statement: By the 90% point object effects are substantially larger on average than location
    effects in all three monkeys (location/object/interaction, L 0.12/0.52/0.07, X 0.13/0.44/0.04,
    Y 0.20/0.36/0.08).
  source: Figure 7; Results, Effects of Location and Object on Joint Angles as a Function of
    Time, paragraph 9
  quote: >-
    By the 90% time point, still prior to contact with the object, object effects were
    substantially larger on average than location effects in all three monkeys (location/
    object/interaction; monkey L: 0.12/0.52/0.07; monkey X: 0.13/ 0.44/0.04; monkey Y:
    0.20/0.36/0.08)
  expected:
  - quantity: mean location eta2 at 90%, monkey L
    value: 0.12
    tolerance: 0.012
  - quantity: mean object eta2 at 90%, monkey L
    value: 0.52
    tolerance: 0.052
  - quantity: mean interaction eta2 at 90%, monkey L
    value: 0.07
    tolerance: 0.007
  - quantity: mean location eta2 at 90%, monkey X
    value: 0.13
    tolerance: 0.013
  - quantity: mean object eta2 at 90%, monkey X
    value: 0.44
    tolerance: 0.044
  - quantity: mean interaction eta2 at 90%, monkey X
    value: 0.04
    tolerance: 0.004
  - quantity: mean location eta2 at 90%, monkey Y
    value: 0.20
    tolerance: 0.02
  - quantity: mean object eta2 at 90%, monkey Y
    value: 0.36
    tolerance: 0.036
  - quantity: mean interaction eta2 at 90%, monkey Y
    value: 0.08
    tolerance: 0.008
  criterion: As fig7-mean-eta-30, at the 90% point. Reproduced when all nine values are within
    tolerance under every combination of readings; partially reproduced when, under every
    combination, mean object eta2 exceeds mean location eta2 in all three monkeys and some value
    misses tolerance. Combinations that give different outcomes make the claim blocked as
    methods_underspecified.
- id: fig7-time-course
  statement: Averaged over angles, location and object effects begin to appear at about the same
    time; after the 30% point object effects grow more than location effects, which decline
    somewhat in L and X and stay about constant in Y; the proportions stay about constant after
    contact; interaction effects stay small.
  source: Figure 7; Results, Effects of Location and Object on Joint Angles as a Function of
    Time, paragraph 9
  quote: Main effects of location and of object began to appear at approximately the same time on
    average ... Thereafter, object effects grew more than location effects, which actually
    declined somewhat in monkeys L and X, although remaining relatively constant in monkey Y ...
    The ratio of location, object, and interaction effects then remained relatively constant
    after peripheral object contact
  depends_on:
  - fig7-mean-eta-30
  - fig7-mean-eta-90
  criterion: Mean eta2 over the 22 angles as a function of normalized time (common methods). The
    paper gives no measure for these words; they are read as follows (open). Begin to appear is
    the first sample at or after M where the mean exceeds 0.05; the two times are compared, and
    "approximately the same" is a difference of at most 10% of normalized time. Growth from 30%
    to 90% is larger for object than location in each monkey. Location at 90% is below location
    at 30% in L and X, and not below it in Y (the paper's own values for Y rise from 0.12 to 0.20,
    so "relatively constant" is read as not declining). Constant after contact is Qm of the mean
    eta2 values staying within 0.1 of its value at C over the samples after C. The interaction
    mean is below both main effect means from 30% to C. Reproduced when all parts hold in all
    monkeys; partially reproduced when the growth part holds and another fails.
- id: fig8a-lda-location
  statement: Location given the object is best predicted by shoulder angles, which reach nearly
    100% before contact, then by wrist angles, which match shoulder angles early but fall below them
    by the midpoint; digit angle groups exceed chance early, become less accurate than proximal
    groups shortly after onset, and still carry some location information just before contact.
  source: Figure 8A; Results, LDA of Joint Angles as a Function of Time, paragraph 2
  quote: In predicting location, shoulder joint angles (blue) were easily dissociated for different
    locations of a given object, reaching nearly 100% correct before peripheral object contact.
    Wrist angles (red) were next most strongly predictive of location. In the first part of the
    movements, wrist angles predicted location as accurately as shoulder angles in all three
    monkeys ... Nevertheless, note that just prior to peripheral object contact (C), wrist joints
    and even digit joints still had some degree of discriminable information on location
  criterion: LDA of location given object, from the common methods, each prior and interval
    reading. Nearly 100% is read with the default 10% tolerance as at least 90% correct; "the first
    part of the movements" as the 30% point and "by the temporal midpoint" as the 50% point (readings,
    not fixed by the paper). In each monkey, (1) shoulder accuracy at least 90% at some sample from 90% to C; (2) the mean accuracy over
    the samples from 50% to C orders shoulder above wrist, and wrist above each digit group; (3) the shoulder
    and wrist 95% intervals overlap at the 30% point and wrist upper bound is below shoulder
    accuracy at the 50% point; (4) each digit group's interval lower bound is above chance at the
    30% point and at the 90% point; chance is the mean of 1/(locations available) over objects.
    Reproduced when all parts hold in all three monkeys under every reading; partially reproduced
    when (1) and (2) hold in all monkeys. Readings that disagree make the claim blocked as
    methods_underspecified.
- id: fig8b-lda-object
  statement: Object given the location is predicted similarly by all five angle groups, each
    reaching near 100% correct before contact in all three monkeys, including the shoulder angles.
  source: Figure 8B; Results, LDA of Joint Angles as a Function of Time, paragraph 3
  quote: In all three monkeys, all five joint-angle groups reached levels of object prediction close
    to 100% correct prior to peripheral object contact
  criterion: LDA of object given location, from the common methods, each prior and interval reading.
    Close to 100% is read with the default 10% tolerance as at least 90% correct. Reproduced when
    each of the five groups reaches at least 90% at some sample from 90% of normalized time to C,
    in all three monkeys, under every reading; partially reproduced when this holds for at least
    12 of the 15 group-monkey pairs. Readings that disagree make the claim blocked as
    methods_underspecified.
- id: fig9-hand-configuration-location
  statement: At the 90% point in monkey L, index finger flexion varies modestly with location for
    the perpendicular and coaxial cylinders but little for the button and sphere, and hand
    configuration varies more with object than with location.
  source: Figure 9; Results, Hand Configurations and Reach Trajectories, paragraphs 1 and 2
  quote: Modest variation in the degree of index finger flexion is evident depending on location
    for the perpendicular and coaxial cylinders, but relatively little if any variation in index
    finger flexion was present for the button or sphere ... A modest degree of locationdependent
    variation in hand configuration again can be appreciated, although more variation in hand
    configuration depended on object
  criterion: As in Fig. 9 (legend and Results), session L20120928, the 90% point, marker positions
    averaged over successful trials of each location-object combination, translated and rotated
    to co-register the five hand markers. The paper gives no measure of spread; the following is
    a reading (open). Location spread per object is the mean distance of the four index finger
    markers' combination means from their mean over locations; object spread per location
    likewise over objects, using all 20 digit markers, compared with location spread using all 20
    digit markers. Reproduced when index location spread is larger for each cylinder than for each
    of button and sphere, and mean object spread exceeds mean location spread. Partially reproduced
    when one of the two holds. If the dataset holds joint angles and not markers, the across-location
    SD of mean IndexMCP and IndexPIP per object is used instead, as a variant.
- id: fig10-forearm-trajectory-object
  statement: Distal forearm point trajectories vary mainly with location, but at a given location
    they also depend on the object from early in the reach, with little overlap between objects by
    the end; at contact the point is typically highest for the sphere, intermediate for the coaxial
    cylinder and lowest for the button.
  source: Figure 10; Results, Hand Configurations and Reach Trajectories, paragraphs 3 and 4;
    Discussion, Effects of Object on Proximal Joint Angles, paragraph 1
  quote: At any given location, however, the trajectory of the distal forearm point through space
    depended to some extent on the object to which the hand was being transported, beginning quite
    early in the reach ... by the time of peripheral object contact, the distal forearm point
    typically was positioned highest for the sphere (orange), intermediate for the coaxial cylinder
    (cyan), and lowest for the button (violet) at any of the locations sampled
  criterion: Distal forearm point from the distal forearm markers in earth-fixed coordinates (as
    the Results say), successful trials, normalized time. Fig. 10 does not name the monkey; readings
    (a) monkey L (as Figs. 3 and 9), (b) each monkey. The paper gives no measure here (its quantitative
    support is Fig. 8B); the following is a reading (open). The LDA of object given location of the
    common methods, run on the point's three coordinates; reproduced when its accuracy interval lower bound
    exceeds chance by the 30% point and accuracy reaches at least 90% at C, and the mean up
    coordinate at C is ordered sphere above coaxial cylinder above button at more than half of the
    locations where all three were presented. Partially reproduced when one of these holds. Under
    reading (b) the result per monkey is reported and the claim judged on L.
- id: elbow-point-trajectory-object
  statement: The elbow point trajectory, set by shoulder rotation alone, also varies mainly with
    location and to some extent with object from early in the reach.
  source: Results, Hand Configurations and Reach Trajectories, paragraph 4 (plots not illustrated)
  quote: These plots likewise demonstrated variation depending primarily on location, but also
    depending to some extent on the object, beginning early in the reach
  criterion: The elbow point estimated as in the Methods (from the three upper arm and three
    proximal forearm markers, 1.7 cm deep), the same reading and measure as
    fig10-forearm-trajectory-object, without the vertical ordering, and with a location LDA given
    object on the same coordinates. "Primarily on location" is read (a reading, the paper gives no
    measure) as the comparison of accuracies above chance below. Reproduced when object classification given location exceeds
    chance by the 30% point and, at C, location accuracy given object minus its chance level
    exceeds object accuracy given location minus its chance level. The monkey is not named; judged on L
    with the others reported.
- id: fig8-hand-shape-invariant-to-location
  statement: Late in the reach, location-dependent differences in hand shape are minor compared
    with object-dependent differences in distal forearm position, as the lower accuracy of
    predicting location from digit angles compared with the high accuracy of predicting object from
    shoulder angles confirms; grasp shape is comparatively invariant to location.
  source: Discussion, Effects of Location on Distal Joint Angles, paragraph 2; Figure 8; Abstract
  quote: The late location-dependent differences in hand shape (Fig. 9) overall seemed relatively
    minor compared with the objectdependent differences in distal forearm position (Fig. 10). This
    impression was confirmed by the lower prediction accuracies of location from digit joint angles
    compared with the high prediction accuracy of object from shoulder joint angles (Fig. 8)
  depends_on:
  - fig8a-lda-location
  - fig8b-lda-object
  criterion: LDA from the common methods, each prior and interval reading. The paper compares
    percent correct and does not name the time; "late" is read as the 90% point (the time of Fig. 9)
    and as C, two readings of the text. Reproduced when, in each monkey, the object accuracy given
    location from shoulder angles exceeds the location accuracy given object from each of the three
    digit groups, at the 90% point or at C; partially reproduced when this holds in two monkeys.
    Accuracy above chance for each is reported as well. Prior and interval readings that disagree
    make the claim blocked as methods_underspecified.
