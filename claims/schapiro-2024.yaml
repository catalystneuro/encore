# Claims for Schapiro, Rittenberg, Kenngott & Marder (2024), eLife, doi:10.7554/elife.98844, on Dryad
# dataset doi:10.5061/dryad.1rn8pk129 ("Effects of Cs on temperature response of C. borealis pyloric
# rhythm").
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-25,
# protocol as stated in docs/protocol.md (version pilot-19).
#
# Text read: the version of record, full text from Europe PMC (PMC11479588, open access JATS), with
# Results, Discussion, Methods, the figure legends of Figures 1 to 6, Figure 1-figure supplement 1
# (the paper's only supplement) and Table 1. The dataset's files were not opened.
#
# Code. The Data availability statement says the code and data to reproduce the results and figures
# were uploaded to the Dryad dataset itself. Being among the dataset's files, that code was not read
# in this run and no commit is recorded. The Methods also link Crabsort (github.com/sg-s/crabsort,
# commit ee237eaea4565d4139a31a40fe180f884175a20b, read), the MATLAB spike-sorting software used to
# detect and assign spikes. It holds the sorting interface, file loading, clustering and generic
# helpers (computePeriods, consolidate); the paper does not say those helpers were used, and nothing
# in it fixes the frequency, Q10, phase or jag measures below. Every method below is from the paper's
# text. Where the deposited scripts settle a detail named as open here, the author may follow them
# and should say so.
#
# Data the paper used, as it reports them.
# - Isolated stomatogastric nervous systems of adult Cancer borealis (STG desheathed), acquired
#   November 2022 to December 2023. Extracellular recordings of lvn, pdn and pyn; intracellular
#   recordings of PD, LP and PY somata; 10 kHz sampling; dish temperature from a thermocouple within
#   1 cm of the STG.
# - Step protocol (Figure 1A, Methods, Temperature protocol). 2 min at 11 degrees C, then steps of
#   2 degrees C to 21 degrees C, each allowed to stabilize over 4 min; return to 11 degrees C; 10 min
#   solution change; the protocol repeated in the other condition. Conditions saline and 5 mM CsCl,
#   order randomized; N=21 experiments with both (Figures 1, 3, 5, 6; PY phases in 12 of them).
# - Control experiments with two consecutive saline step protocols, N=6 (Figure 1E and 1F).
# - Picrotoxin experiments, N=6: saline and Cs+ in random order, then Cs+ + 10^-5 M picrotoxin
#   (Figure 4). The paper does not say whether these 6 are among the 21.
# - Voltage clamp of PD and LP at 11 and 21 degrees C, saline and Cs+: held at -50 mV, steps to
#   -100 to -120 mV for 12 s (Figure 1-figure supplement 1); 4 PD and 3 LP cells at 11 degrees C,
#   3 PD and 5 LP cells at 21 degrees C.
# - Measured variables: spike times of PD, LP and PY; temperature; membrane potential; clamp
#   current.
#
# Method fixed by the paper and used throughout (Methods, Analysis; Results, section 1).
# - PD bursts are two or more consecutive PD spikes separated from the next burst by at least
#   200 ms. Period is the time between the first spikes of consecutive PD bursts; frequency is its
#   inverse. Phase of an event is its delay from the first PD spike of the cycle divided by the
#   period. Onset is the neuron's first spike in the cycle, offset its last.
# - The frequency at a holding temperature is the mean over the times the preparation was within
#   0.3 degrees C of the target (Results, The steady-state frequency increase, paragraph 3).
# - Jag measure: frequency and temperature smoothed with a moving average over 30 and 10 pyloric
#   cycles; a cycle is temperature-increasing when the smoothed temperature rose by more than
#   0.01 degrees C from the previous cycle, otherwise stable; among increasing cycles, the percent
#   with a smoothed frequency decrease of more than 0.002 Hz per cycle; among stable cycles, the
#   percent with an increase of more than 0.002 Hz per cycle.
# - Phase constancy: per experiment and condition, a line fitted to mean phase against temperature;
#   slopes tested against zero across experiments by Wilcoxon signed-rank (non-normal) or one-sample
#   t-test (normal), Bonferroni-adjusted for 10 tests (5 phases by 2 conditions).
# - Normality by Shapiro-Wilk decides parametric or non-parametric tests; where the paper names the
#   test used for a comparison, that test is used.
# - Summary values are mean +- SD over experiments or cells.
#
# Details the paper leaves open, used by several claims (each claim names the ones it rests on).
# - O1, Q10. "as described previously (Tang et al., 2010)", with no formula. Readings are (a) a fit
#   of f = f11 * Q10^((T - 11)/10) to the six holding-temperature mean frequencies by nonlinear least
#   squares; (b) a straight-line fit of log10 frequency on temperature, Q10 = 10^(10 * slope);
#   (c) the two-point ratio (f21/f11)^(10/10).
# - O2, which 11 degrees C. The holding period at 11 degrees C is read as the first one of each
#   condition's step protocol (the 2 min before the first step); the return to 11 degrees C after
#   21 degrees C is a variant.
# - O3, jag smoothing and span. MATLAB movmean is centred by default; a centred window is the main
#   reading, a trailing window a variant. The span of cycles is (a) the step protocol from the first
#   cycle at 11 degrees C to the end of the 21 degrees C hold; (b) the whole recording of the
#   condition, cooling included, cycles that did not warm counted as stable as the Methods' wording
#   allows. The per-cycle temperature is the mean over the cycle ("change in mean temperature",
#   Results, Cs+ revealed dynamic transitory frequency response, paragraph 2).
# - O4, cycles that form a phase at a temperature. (a) cycles within 0.3 degrees C of the target,
#   as for frequency; (b) all cycles of the holding period (yellow in Figure 1A). For the slope,
#   (a) a line through the six per-temperature means; (b) a line through all cycles' phases against
#   their temperature.
# - O5, Tukey HSD after a one-way repeated-measures ANOVA. (a) MATLAB multcompare on the fitted
#   repeated-measures model (Tukey-Kramer on paired differences); (b) the classic Tukey HSD using the
#   ANOVA's within-subject error term. Both are reported.
# - O6, LP and PY onset and offset. The first and last spike of the neuron between the first spikes
#   of two consecutive PD bursts (standard choice; the paper gives no burst rule for LP and PY).
#
# Tolerances. Where the paper gives mean +- SD, the tolerance is the stated SD, the paper's own
# spread (protocol, Reader, step 3); a count or a number without spread has 10%.
