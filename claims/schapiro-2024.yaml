- id: fig2c-decrease-by-depolarizing-phase
  statement: In Cs+, the frequency decrease right after a temperature increase came from an
    elongation of the PD depolarizing phase, with bursting and repolarization phases maintained.
  source: Results, Cs+ revealed dynamic transitory frequency response, paragraph 1; Figure 2C; also
    Figure 4G for Cs+ + PTX
  quote: Alignment of each PD cycle during this window to the first PD spike reveals that the
    decrease in frequency was due to elongation of the depolarizing phase and not the bursting,
    repolarization, or inhibitory phases
  criterion: The paper shows this in one example preparation, not identified, for the step from 13
    toward 15 degrees C, and gives no measure. A measure is fixed here from the legend's phases. On
    the intracellular PD trace, per cycle, burst duration (first to last spike), repolarization
