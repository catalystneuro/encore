    tolerance: 0.068
  - quantity: mean neuron participation, core
    value: 0.14
    tolerance: 0.014
  - quantity: mean neuron participation, periphery
    value: 0.18
    tolerance: 0.018
  criterion: Densities and classes as in Methods (Community Motifs Analysis), within-community
    density over n(n-1) possible directed edges, between-community density over n_r n_s. The
    fraction of pairs is over the n(n-1) ordered community pairs, as in SMB_ADCP_Enrichment.py.
    The paper does not say which edges the between-community density counts; readings (a) edges
    from r to s only, (b) edges in both directions over 2 n_r n_s. Neuron participation is the
    fraction of each neuron's pair labels in each class, averaged over neurons (Figure 4b
    legend). The pie values in Figure 4b are assigned to signaling as the one without a
    disassortative slice. Reproduced when all values are within tolerance under one reading.
- id: fig4d-pharynx-amphid-core
  statement: In the signaling network, pharyngeal and amphid sensory neurons are significantly
    enriched for the core of core-periphery interactions.
  source: Results, Linking neurobiological annotations to community motifs, paragraph 4; Figure 4d
  quote: Strikingly pharyngeal and amphid sensory neurons were significantly enriched for
    participation in the “core” component of the core-periphery interactions in the signal
    propagation network (Fig. 4 d)
  statistics:
  - test: z-score against shuffled interactions, one-sided t-test
    p: 0.05
    p_relation: "<"
    corrected: FDR
  data: with_labels
  depends_on:
  - fig4-community-motif-fractions
  criterion: As in SMB_ADCP_Enrichment.py, per role the mean over its neurons of the fraction of
    core labels, against 1000 permutations of the neurons' label fractions, z-score, one-sided
    t-test, FDR over the roles and classes with a defined p-value, p < 0.05. Reproduced when both
    roles are significantly enriched for core under one reading of fig4-community-motif-fractions;
    partially when one is.
- id: fig4d-anatomy-pharynx-amphid-assortative
  statement: In the anatomical network the same pharyngeal and amphid sensory neurons are
    impoverished for coreness and enriched for assortative interactions, and locomotory
    interneurons are enriched for disassortative interactions.
  source: Results, Linking neurobiological annotations to community motifs, paragraphs 4 and 6;
    Figure 4d
  quote: in the anatomical network, these same neurons were impoverished for their coreness and
    instead were significantly enriched for participation in the assortative community motif
  data: elsewhere
  where: EM connectomes of White et al. 1986 and Witvliet et al. 2021, as for
    anatomy-network-properties
- id: fig4c-broadcaster-integrator
  statement: In the signaling network pharyngeal neurons act as broadcasters, with more outgoing
    than incoming edges, and amphid sensory neurons have more incoming than outgoing edges,
    each compared with shuffled role assignments.
  source: Results, Linking neurobiological annotations to community motifs, paragraph 5; Figure 4c
  quote: we find that pharyngeal neurons show more broadcasting-like behavior ... (Fig. 4 c).
    Counterintuitively amphid sensory neurons have more incoming than outgoing edges in the
    signaling network
  statistics:
  - test: comparison with shuffled neuron role assignments
    p: 0.05
    p_relation: "<"
  data: with_labels
  depends_on:
  - signaling-network-size
  criterion: As in broadcaster_integrator.py, for each group the number of edges into it from
    other neurons over the number of edges out of it to other neurons, against 1000 random
    groups of the same size (20 pharyngeal, 24 amphid sensory), by a one-sided t-test (pharynx
    lower than the null, amphid higher) at p < 0.05. Reproduced when both tests hold and the
    amphid in-edges exceed its out-edges; partially when one group holds.
- id: ed9-sampling-not-confound
  statement: Pharyngeal neurons were not stimulated more often than other neurons
    (Kolmogorov-Smirnov p = 0.9), and amphid neurons were not observed more often (p = 0.38).
  source: Extended Data Figure 9c, 9d
  quote: Pharynx neurons do not have a larger than expected number of stimulations compared to all
    other neurons (Kolmogorov-Smirnoff test p-value = 0.9) ... Amphid neurons do not have a larger
    than expected number of observations compared to all other neurons (Kolmogorov-Smirnoff test
    p-value = 0.38)
  statistics:
  - about: stimulations, pharyngeal against other neurons
    test: Kolmogorov-Smirnov test
    p: 0.9
  - about: observations, amphid sensory against other neurons
    test: Kolmogorov-Smirnov test
    p: 0.38
  data: with_labels
  criterion: A claim of absence, judged on the paper's test, the two-sample Kolmogorov-Smirnov test
    (scipy ks_2samp, as in broadcaster_integrator.py) of the per-neuron counts of the group
    against those of all other head neurons, at p < 0.05. The counts of stimulations and
    observations per neuron are taken from the recordings that build the network (reference 27
    does not define them here; the reading is the number of stimulation events of a neuron and
    the number of recordings in which a neuron was identified). Reproduced when neither test
    gives p < 0.05; the p-values and the median counts of each group are reported.
- id: fig5a-signaling-rich-club
  statement: The signaling network has a dual rich club, with 16 neurons of degree 25 or more and
    a more exclusive tier of five neurons of degree 40 or more, at local maxima of the normalized
    rich club coefficient.
  source: Results, Anatomy and signaling exhibit rich clubs of mostly non-overlapping neurons,
    paragraph 2; Figure 5a; Methods, Determining the Rich Club
  quote: "The signaling network exhibited a “dual rich club” with two clear tiers: the first tier
    contained 16 neurons of degree 25 or higher, whereas the second and more exclusive tier
    contained five neurons of degree 40 or higher"
  depends_on:
  - signaling-network-size
  expected:
  - quantity: neurons in the first tier
    value: 16
    tolerance: 1.6
  - quantity: neurons in the second tier
    value: 5
    tolerance: 0.5
  criterion: Degree is in-degree plus out-degree; the rich club coefficient at k is the number of
    directed edges among neurons of degree > k over N_k (N_k - 1), normalized by its mean over
    degree-preserving rewired networks (graph-tool random_rewire, configuration model; Methods
    and richclub.py). Number of rewired networks 1000 (Methods); 100 (legend) and 500 (code) are
    variants. Tiers read (a) degree > 25 and > 40 (legend and code), (b) degree >= 25 and >= 40
    (Results). Reproduced when, under one reading, both counts are within tolerance, the
    normalized coefficient has local maxima at or within two of k = 25 and k = 40, and the
    coefficient exceeds the null mean by more than one null SD from k = 3 onwards. The code's
    list is ASHL, AVDL, AVEL, AVER, AVJL, AVJR, AWBL, AWBR, M3L, M3R, OLLR, OLQDR, RMDDL, RMDDR,
    RMDVL and RMDVR; membership is compared with it.
- id: fig5c-rich-clubs-disjoint
  statement: The signaling and anatomical rich clubs are nearly disjoint; only AVEL and AVER are in
    both.
  source: Results, Anatomy and signaling exhibit rich clubs, paragraph 3; Figure 5c
  quote: "There were two neurons present in both rich clubs: command interneurons AVEL and AVER"
  data: with_inputs
  depends_on:
  - fig5a-signaling-rich-club
  criterion: The anatomical rich club is degree > 62 in the anatomical network (richclub.py; 15
    neurons in the code's list). Reproduced when the intersection of the signaling first tier
    and the anatomical rich club is exactly AVEL and AVER, under either reading of
    fig5a-signaling-rich-club.
- id: fig5b-degree-correlation
  statement: Signaling and anatomical degree are weakly correlated across neurons (Pearson r =
    0.22); the highest-degree anatomical neurons tend to have lower signaling degree.
  source: Results, Anatomy and signaling exhibit rich clubs, paragraph 3; Figure 5b
  quote: Neurons that exhibited the highest degree in the anatomical network tended to have lower
    degrees in the signaling network (Pearson correlation r = 0.22)
  data: with_inputs
  depends_on:
  - signaling-network-size
  expected:
    quantity: Pearson correlation of signaling and anatomical total degree over 188 neurons
    value: 0.22
    tolerance: 0.022
- id: rich-club-controls
  statement: The near disjointness of the rich clubs persists under the conservative and
    enforced-density controls, and every signaling rich club neuron at q <= 0.18 was in the
    original signaling rich club.
  source: Results, Anatomy and signaling exhibit rich clubs, paragraph 3; Extended Data Figures
    11b, 12a, 13a
  quote: We find that this result persists in both the conservative control and the enforced
    density controls
  data: with_inputs
  depends_on:
  - fig5c-rich-clubs-disjoint
  - signaling-threshold-controls
  criterion: The thresholds for the rich clubs of the control networks are not given in the
    paper or the code; the reading is the same degree thresholds as the originals (25 for
    signaling, 62 for anatomy). Reproduced when, in all three threshold pairs, the overlap of
    the two rich clubs is at most AVEL and AVER, and the q <= 0.18 signaling rich club is a
    subset of the original.
- id: fig5d-community-vi-hubs
  statement: Signaling community VI holds 10 of the 16 rich club neurons, including AVEL and AVER,
    about 21% of its members, and is enriched for them; the others are M3L and M3R in I, OLLR and
    OLQDR in II, RMDDR in III and RMDDL in V.
  source: Results, Anatomy and signaling exhibit rich clubs, paragraphs 4 and 5; Figure 5d
  quote: Community VI was highly enriched for hub neurons, containing 10 out of the 16 hub neurons,
    including AVEL and AVER. Rich club neurons also make up a large fraction of this community,
    approximately 21%.
  statistics:
  - test: z-score against 1000 shuffled community assignments, one-sided t-test
    p: 0.05
    p_relation: "<"
    corrected: FDR
  depends_on:
  - fig5a-signaling-rich-club
  - table1-signaling-membership
  expected:
  - quantity: rich club neurons in community VI
    value: 10
    tolerance: 1
  - quantity: fraction of community VI that is rich club
    value: 0.21
    tolerance: 0.021
  criterion: Enrichment as in Neuron_type_enrichment.py (overlap with the rich club against 1000
    shuffles of the community labels, one-sided t-test, FDR over the six communities, p < 0.05).
    Reproduced when the match of VI holds the expected number and fraction and is significantly
    enriched.
- id: ed10-rich-club-cell-classes
  statement: Signaling rich club neurons are spread fairly equally among sensory, inter- and motor
    neurons, unlike the anatomical rich club, which is mostly interneurons.
  source: Results, Anatomy and signaling exhibit rich clubs, paragraph 5; Extended Data Figure 10b,
    10c
  quote: Surprisingly, members of the rich club were fairly equally spread among sensory, inter-,
    and motor neurons (Extended Data Fig. 10 b). This is in contrast to the anatomical network
    where the rich club is primarily composed of interneurons
  data: with_labels
  depends_on:
  - fig5a-signaling-rich-club
  criterion: Classes as in Extended Data Figure 5a. The code's signaling list has 5 sensory, 5
    inter- and 6 motor neurons. The paper gives no test; reproduced when no class holds more than
    half of the recomputed first tier, and, for the anatomical part (outside data), when
    interneurons are more than half of the degree > 62 anatomical rich club.
- id: fig5e-rich-club-core
  statement: In both networks the rich club neurons are enriched for the core of core-periphery
    interactions.
  source: Results, Anatomy and signaling exhibit rich clubs, paragraph 6; Figure 5e
  quote: As predicted, in both the anatomical and signaling networks, each network’s respective
    rich club members were enriched for coreness
  statistics:
  - test: z-score against shuffled interactions, one-sided t-test
    p: 0.05
    p_relation: "<"
    corrected: FDR
  depends_on:
  - fig5a-signaling-rich-club
  - fig4-community-motif-fractions
  criterion: As fig4d-pharynx-amphid-core, for the group of signaling rich club neurons in the
    signaling network. Reproduced when its core enrichment has FDR p < 0.05. The anatomical half
    of the finding uses outside data and is shown when the connectome is used; it does not decide
    this claim.
- id: ed9e-degree-observations
  statement: Signaling degree is correlated with the number of times a neuron was observed
    (Pearson r = 0.71), but rich club members have degrees well above what that correlation
    predicts.
  source: Results, Anatomy and signaling exhibit rich clubs, paragraph 7; Extended Data Figure 9e,
    9f
  quote: signal propagation degree is correlated with the number of empirical observations made of
    each neuron in ... our experimental dataset (pearsons correlation r = 0.71, Extended Data Fig. 9
    e). We were reassured, however, that rich club members had large degrees well in excess of
    what we could explain from the correlation
  depends_on:
  - fig5a-signaling-rich-club
  expected:
    quantity: Pearson correlation of signaling degree with number of observations
    value: 0.71
    tolerance: 0.071
  criterion: As in degree.py, a least-squares line of total degree on number of observations, the
    residual of each neuron, and a Gaussian fit to all residuals. Number of observations as in
    ed9-sampling-not-confound. Reproduced when r is within tolerance and every signaling rich
    club neuron lies more than one fitted SD above the line; partially when most do.
