# Claims for Dvali, Seguin, Betzel & Leifer (2025), "Diverging Network Architecture of the
# C. elegans Connectome and Signaling Network", doi:10.1103/6wgv-b9m6, on DANDI:001075.
#
# Provenance: written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub
# Actions"), 2026-11-22, protocol pilot-18 as stated in docs/protocol.md (Reader, steps 1 to 4).
#
# Text read: paper/10.1103-6wgv-b9m6.txt. Its header says "version of record", but only the
# abstract and reference list come from the publisher; the body is the arXiv preprint
# 2412.14498v2 (12 Aug 2025), with Introduction, Results, Discussion, Methods, Figures 1 to 5
# with legends, Tables 1 and 2, and Extended Data Figures 1 to 14 and Extended Data Table 1.
# The version of record's supplement (reference 37, "extended data figures") was not read as
# a separate file; the preprint's Extended Data were read in its place. Figure panels are
# garbled in the text (axis ticks only); no PDF was supplied, so values shown only in panels
# are not used.
#
# Code read: https://github.com/SophieDvali/FunconnNetworkAnalysis (Code availability), commit
# 35e87cafc1b95ad1496e64b05e9df0700a6bd46e (2024-12-19). It holds Python scripts for the
# stochastic block model (SMB_posteriordist_mcmc.py), bilateral pairs (LeftRight.py),
# enrichment (Neuron_type_enrichment.py, Enrich_anatomy.py, SMBHeir_Module_Enrichment.py,
# SMB_compare_to_connectome.py), community motifs (SMB_ADCP_Enrichment.py and _Aconn),
# broadcaster and integrator (broadcaster_integrator.py), feed-forwardness (SIM.py,
# SIM_doubleedge.py), triads, clustering and small-worldness (motifs.py, motifs_ER.py), the
# rich club (richclub.py) and degree against observations (degree.py). Every script reads
# precomputed files from the author's computer that are not in the repository
# (get_adj_matrix.pkl, get_adj_matrix_aconn.pkl, neuronlist.pkl, q_head_binary.csv,
# observations.csv, and the community motif tables Morph_values*.csv and C_values*.csv). So
# the code that builds both networks, computes the q-values, counts observations and
# stimulations, classifies community motifs and computes the adjusted Rand score is not in it.
# The code fixes these details, used below: degree is in-degree plus out-degree; rich club
# membership is degree > 25 and > 40 and the anatomical rich club degree > 62; the rich club
# coefficient is E_k / (N_k (N_k - 1)) over nodes of degree > k; enrichment uses 1000
# shuffles of the community labels, z = (observed - shuffle mean) / shuffle SD, a one-sided
# two-sample t-test of the observed value against the shuffles, and Benjamini-Hochberg FDR
# (scipy false_discovery_control); the bilateral test uses 100 shuffles; small-worldness uses
# 100 directed Erdos-Renyi graphs at densities 0.033 and 0.092; clustering is networkx
# average_clustering on the directed graph; neuron classes and roles are lists in the code that
# match Extended Data Figure 5.
#
# Data the paper used. Two binarized directed networks on the same 188 head neurons.
# - Signaling network (signal propagation atlas of Randi et al. 2023, reference 27). Measured
#   by optogenetic stimulation of single neurons and whole-brain calcium imaging. A directed
#   edge from stimulated neuron j to responding neuron i is present when the pair's q-value is
#   below 0.05 (Methods, The Networks). 1151 edges. The paper names the dataset as
#   DANDI:001075 version 0.240920.1434. The q-values come from the statistical framework of
#   reference 27, which this paper does not restate; the per-neuron numbers of observations
#   and stimulations (Extended Data Figure 9) also come from those recordings. Controls use q
#   below 0.01 (conservative) and q at most 0.18 (enforced density).
# - Anatomical network (outside data). Chemical and electrical synapses from four EM datasets,
#   "three adults and one L4" (White et al. 1986, reference 11; Witvliet et al. 2021,
#   reference 36; Cook et al. 2019, reference 35, is also cited). An edge when there is at
#   least one contact in any of the four datasets. 3250 edges. Controls require at least three
#   contacts in at least one dataset, or an average of at least 1.25 synapses across the four.
#   The paper does not name which datasets of references 11 and 36 were used, nor how gap
#   junctions are given a direction.
# - Neuron annotations (outside labels). Sensory, inter- and motor neuron classes, and five
#   roles (pharyngeal, amphid sensory, locomotory interneuron, VNC motor, ring interneuron),
#   listed in Extended Data Figure 5 and in the code.
# The dataset's archive description is the signal propagation atlas of Randi et al. 2023. So
# claims about the signaling network alone use the dataset; claims comparing it with the
# connectome use outside inputs; claims about the connectome alone are elsewhere.
#
# Details left open by the paper and its code, with the readings named in the criteria:
# - The q-values. Reading (a), recompute them from the dataset with the method of reference 27;
#   reading (b), use the q-values reference 27 distributes with its atlas. Which strains enter
#   the atlas (wild type only, or also the unc-31 recordings) is not said; wild type only is
#   the reading that matches "signal propagation atlas", and the other is a variant.
# - The SBM is a stochastic MCMC without a fixed seed; community counts and memberships may
#   vary between runs (Extended Data Figure 2 shows the spread of assignments).
# - Rich club threshold. "degree 25 or higher" (Results) against "k > 25" (Figure 5 legend and
#   code); both readings are named. Number of rewired null networks is 1000 (Methods), 100
#   (Figure 5 legend) or 500 (code); the Methods are followed and the others are variants.
# - Community motif classification on a directed network. Whether the between-community
#   density uses edges from r to s only, or both directions, is not said.
