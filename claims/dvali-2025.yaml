    different numbers of edges (corresponding to M = 1151 for signaling
  expected:
  - quantity: edges in the signaling network
    value: 1151
    tolerance: 115
  - quantity: density of the signaling network
    value: 0.033
    tolerance: 0.0033
  criterion: Directed edges from stimulated to responding neuron among the 188 head neurons, kept
    when q < 0.05 (Methods). Density is edges over 188 x 187 possible directed edges, which
