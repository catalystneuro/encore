# Claims for Wang, Morotti, Tapa et al. (2019), J Physiol, on SPARC dataset 212
# ("Sympathetic nerve stimulation of mouse and rabbit hearts").
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-11-18, under protocol pilot-16 (docs/protocol.md), reader role.
#
# Text read: the accepted author manuscript in PubMed Central (PMC6675632), full text with
# Methods, Results, Discussion and figure legends (paper/10.1113-jp278016.txt). No PDF was
# supplied, so the figures themselves were not seen; claims rest on the text and legends. The
# paper cites no supplement.
#
# Code: the paper links only the published myocyte models, at
# https://somapp.ucdmc.ucdavis.edu/Pharmacology/bers/ (rabbit model in the Negroni et al. 2015
# / Bartos et al. 2017 lineage, mouse model of Morotti et al. 2014) and
# http://elegrandi.wixsite.com/grandilab/downloads. Both pages were listed on 2026-11-18; the
# MATLAB downloads sit behind a registration form (name, affiliation, email) and were not
# fetched. They hold no analysis of the optical maps: the paper did that analysis in Optiq
# (Cairn, UK), which is not open. No criterion below takes a detail from code.
#
# Data the paper used. Male C57BL/6J mice (12 to 16 weeks, n=13) and male New Zealand White
# rabbits (3.0 to 3.5 kg, n=9). Innervated hearts with spinal cord (C1 to T12),
# Langendorff-perfused via the descending aorta, blebbistatin 20 uM (rabbit also vecuronium
# 5 uM). Dual optical mapping of the anterior epicardium, RH237 (voltage) and Rhod-2 (Ca),
# two CMOS cameras at 1 kHz, 100 x 100 pixels, field of view 31 x 31 mm (rabbit) and 10 x 10 mm
# (mouse); a bath ECG (lead I). Bilateral sympathetic nerve stimulation (SNS) through a spinal
# catheter at T1 to T3, 5 to 15 Hz, 7.5 V (Methods range 5 to 10 V), 20 s or 60 s. Conditions:
# SNS with free heart rate (Fig. 1, 2, 5, 7); SNS with constant atrial pacing, CL 250 ms rabbit
# and 100 ms mouse (Fig. 4, 6, 3F); a subset of 4 mouse hearts traditionally perfused (no
# nerves) given bolus tyramine 20 uM or noradrenaline 50 nM (Fig. 3A to C); SNS after
# propranolol 10 uM (Fig. 3D, n=3); a step-wise increase in pacing rate without and with SNS
# (Fig. 3E, n=3). Measured variables: heart rate; APD80 and CaTD80 (activation at 50% of
# amplitude, repolarization or decay at 80% return to baseline), each heart's value the mean
# over the whole field of view unless stated; CaT amplitude normalized to pre-SNS; activation,
# repolarization and CaT decay time maps; APD change in base and apex regions. Values are
# mean +- SD; repeated measures ANOVA or paired t-tests against baseline or time 0; P < 0.05.
# Fig. 8 and 9 are simulations with the two published models (data elsewhere).
#
# Details the paper leaves open, named in the criteria: which test (repeated measures ANOVA
# or paired t-test) and which post hoc comparison underlies each "*p<0.05 vs. time 0"; the
# time points sampled in the 60 s time courses (the text names 0, 15 and 60 s only); the
# window that stands for "during SNS" in the 20 s experiments; how "monotonic" and "similar"
# are judged; how the direction of the repolarization wavefront and its "reversal" are
# measured; how the base and apex regions are drawn.
