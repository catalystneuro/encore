    p_relation: "<"
    n: 4 rabbit hearts
  criterion: Per heart, HR, APD80 and CaTD80 at the time points of the 60 s SNS. The sampled times
    are not given in the text; the data's own time points are used. "Monotonic" is read as (a)
    the mean over hearts moves in the stated direction at every successive time point, or (b)
    no successive pair of time points differs in the opposite direction by a paired t-test at
    p < 0.05. Significance against time 0 is read as (i) paired t-tests of each time point
    against time 0, or (ii) a one-way repeated measures ANOVA with comparisons against time 0.
    Reproduced when, under some combination of readings, all three variables are monotonic in
    the stated direction and each differs from time 0 at p < 0.05 at 60 s.
