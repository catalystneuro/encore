- id: edfig9-dorsal-ventral
  statement: Dorsal and ventral CA1 SPW-Rs are only weakly correlated, and ventral SPW-Rs are
    significantly less correlated with glucose fluctuations than dorsal SPW-Rs, which match the
    earlier dorsal cohorts.
  source: Results, Lateral septum relays SPW-Rs downstream, paragraph 1; Extended Data Fig. 9d-f
  quote: SPW-R events were only weakly correlated between septal and temporal poles of the
