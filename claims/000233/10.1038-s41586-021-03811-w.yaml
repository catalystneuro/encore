    ratio holds but the nA values do not.
- id: fig3ef-stimulation-dose-response
  statement: In seven of the eight optogenetic rats the glucose decrease is larger at higher
    stimulation rates (median R = -0.11, P < 0.01).
  source: Results, Induced ripples decrease glucose levels, paragraph 1; Figure 3e
  quote: In seven of the eight rats, the effect on glucose concentrations was larger at higher
    stimulation rates ... median R = - 0.11, P < 0.01
  statistics:
  - test: not named
    p: 0.01
    p_relation: "<"
    n: 8 rats
  expected:
  - quantity: rats with larger glucose decrease at higher stimulation rates
    value: 7
    tolerance: 0.7
  - quantity: median across rats of R between stimulation rate and delta current at +10 min
    value: -0.11
    tolerance: 0.011
  criterion: Per rat, the correlation between stimulation rate per 5-min window and delta current
    10 min later (Fig. 3e legend). A rat counts when its R is negative. OPEN, the test behind
    P < 0.01 is not named; readings (a) a Wilcoxon signed-rank test of the 8 per-rat R against
    zero, (b) the correlation over all rats' windows pooled. Reproduced when both expected values
    hold and, under one reading, p < 0.01; partially when R and the count hold at p < 0.05 only.
- id: fig3f-stimulation-vs-shuffle
  statement: Correlations between stimulation rate and glucose change at 10 min differ from those
    with circularly permuted stimulation rate (P = 0.00015, two-sample Kolmogorov-Smirnov test).
  source: Figure 3f legend
  quote: P = 0.00015, using a two-sample Kolmogorov-Smirnov test
  statistics:
  - test: two-sample Kolmogorov-Smirnov test
    p: 0.00015
    n: 8 rats, 100 shuffles each
  depends_on:
