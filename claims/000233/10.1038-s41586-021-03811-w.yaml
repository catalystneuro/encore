    Reproduced when the largest mean difference over predictors and offsets belongs to SPW-R rate
    at an offset between +5 and +15 min.
- id: edfig6d-pairwise-predictors
  statement: In single-predictor models SPW-R rate predicts glucose fluctuations better than each
    other measured signal; it beats brain state in 6 of 8 rats.
  source: Extended Data Fig. 6c-d; Supplementary Discussion, paragraph 4
  quote: For example, the upper leftmost value of 6 indicates that ripple rate was a better
    predictor than brain state in 6 of the 8 rats
  expected:
    quantity: rats in which SPW-R rate predicts better than brain state
    value: 6
    tolerance: 0.6
  criterion: As in the Methods, one linear regression per predictor at the +10-min offset, same
    100 splits, two-sample t-test of MSE across splits per rat at p < 0.05. Reproduced when the
