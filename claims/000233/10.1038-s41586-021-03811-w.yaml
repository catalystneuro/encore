  criterion: Observed correlation at +10 min per rat against 100 circular shuffles per rat.
    OPEN, what the red histogram holds; readings (a) the 8 per-rat observed correlations against
    all 800 shuffled ones, (b) per-rat observed correlations over repeated subsamples of windows
    (not described). Reproduced when the KS test gives p < 0.05 with observed values more negative
    under reading (a), the paper's p compared.
- id: edfig7ab-stimulation-protocol
  statement: The stimulation protocol has no ultradian structure, and the mean stimulation rate
    does not differ across the light-dark cycle.
  source: Extended Data Fig. 7a-b; Results, Induced ripples decrease glucose levels, paragraph 1
  quote: Autocorrelation of stimulation protocol showing no ultradian structure. b , Average
    stimulation rate was not different across the circadian light-dark cycle
  criterion: A claim of absence; the paper names no test. Choices made here, per rat,
    autocorrelation of stimulation rate in 5-min bins at lags from 15 min to 12 h within the 99%
    white-noise bound (2.58 over the square root of the bin count) at more than 95% of lags, and
    a two-sided t-test of 5-min stimulation rates in light (07:00 to 19:00) against dark not
    significant at p < 0.05.
- id: edfig7jm-induced-ripples-decoupled
  statement: Induced ripples are decoupled from ongoing changes in vigilance, brain state and
    behaviour (power spectrum slope, EMG proxy, movement and wake/NREM ratio).
  source: Results, Induced ripples decrease glucose levels, paragraph 1; Extended Data Fig. 7j-m
  quote: can be mimicked with artificially produced ripples in a manner that was decoupled from
    ongoing changes in vigilance, brain state and behaviour
  criterion: As in Extended Data Fig. 7j-m, the mean cross-correlogram across the 8 rats of
    stimulation rate (5-min bins) with power spectrum slope, high-pass coherence, accelerometer
    movement and the wake/NREM ratio per 5-min bin. Reproduced when, for each signal, no offset
    from -100 to +100 min has a mean correlation outside the 2.5th to 97.5th percentiles of
    circularly shuffled means (a choice made here; the paper gives no test).
- id: edfig7-ppc-stimulation-no-effect
  statement: The same stimulation in posterior parietal cortex does not change glucose; the CA1
    and PPC cross-correlograms with glucose differ.
  source: Results, Induced ripples decrease glucose levels, paragraph 1; Extended Data Fig. 7e-h
  quote: The same intensity optogenetic stimulation in the posterior parietal area did not induce
    a measurable change in glucose concentrations
  depends_on:
  - fig3d-induced-ripples-lower-glucose
  criterion: As in Extended Data Fig. 7g-h, per rat cross-correlograms of stimulation rate with
    delta current, CA1 cohort (8 rats) against PPC cohort (5 or 6 rats), compared at each offset
    by a two-way (two-sided) unpaired t-test. Reproduced when the CA1 correlation is more
    negative at +10 min with p < 0.05 and the PPC mean correlogram at +10 min lies within the
    2.5th to 97.5th percentiles of its circular shuffles.
- id: edfig8-lateral-septum-rectified
  statement: Lateral septal populations fire at a nearly constant rate across theta cycles of
    different hippocampal synchrony but increase linearly with SPW-R synchrony; theta cycles
    occur at low and SPW-Rs at the highest synchrony percentiles.
  source: Results, Lateral septum relays SPW-Rs downstream, paragraph 1; Extended Data Fig. 8c
  quote: Theta cycles occurred primarily at lower population firing rates, whereas SPW-Rs
    primarily occurred at the highest percentiles ... Lateral septal neuronal populations fired
    at a semi-constant rate across theta cycles with different levels of hippocampal synchrony,
    but increased linearly with SPW-Rs
  expected:
  - quantity: recordings
    value: 38
    tolerance: 3.8
  - quantity: rats
    value: 5
    tolerance: 0
  criterion: Hippocampal synchrony as in the Results, the mean of z-scored firing rates of all
    hippocampal neurons in 25-ms bins; recordings with at least 15 lateral septal neurons
    (legend); for each theta cycle and SPW-R, its synchrony percentile and the mean z-scored
    lateral septal rate. OPEN, theta cycle detection is given only by ref. 26; the choice made
