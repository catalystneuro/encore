- id: edfig6ef-latent-variables
  statement: Principal or independent components of all predictors do not predict glucose better
    than SPW-R rate; PC1 performs similarly to SPW-R rate and the other components worse in at
    least 4 of 8 rats.
  source: Extended Data Fig. 6e-f
  quote: SPW-R rate and PC1 were similar in all rats, all other principal components and
    independent components performed worse for at least 4 out of 8 rats
  depends_on:
  - edfig6d-pairwise-predictors
  criterion: As in the legend, generalized linear models with two predictors each, built from
