# Claims for Tingley, McClain, Kaya, Carpenter & Buzsaki (2021), Nature 597, 82-86,
# doi:10.1038/s41586-021-03811-w, on dandiset 000233.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-10-28,
# protocol pilot-12 as stated in docs/protocol.md (Reader).
#
# Text read: the accepted author manuscript in PubMed Central (PMC9214835, NIHMS1804409) as
# supplied under paper/, with the main text, Methods, Data and Code availability, and the legends
# of Figures 1 to 4 and Extended Data Figures 1 to 10, and the Supplementary Information PDF
# (Supplementary Table 1, the list of animals, and the Supplementary Discussion). No PDF of the
# main article was supplied, so the figures themselves were not seen; claims rest on the text and
# legends. The Supplementary Discussion cites some panels under older numbers ("Figure 2I-K" for
# the fasting experiment, now Extended Data Fig. 4d-f; "Extended Data Figure 4" for SPW-R rate
# rhythms, now Extended Data Fig. 3).
#
# Code: the paper links https://github.com/buzsakilab/buzcode (Code availability; SPW-R detection
# names bz_FindRipples.m). Read at commit e615663b2b100782d1f378580f6d7aaa35c12937. It holds the
# lab's general toolbox: the ripple detector (analysis/SharpWaveRipples/bz_FindRipples.m), the
# sleep scorer (detectors/detectStates/SleepScoreMaster), the EMG-from-LFP estimate
# (detectors/bz_EMGFromLFP.m) and a circular shuffle (utilities/bz_shuffleCircular.m, each row
# shifted by a random number of samples). It holds no code for the glucose signal, the
# cross-correlograms, the regression models or the DREADD analysis. The detector's defaults
# (passband 130-200 Hz, thresholds 2 and 5 s.d., maximum duration 100 ms, minimum 20 ms) differ
# from the Methods (120-200 Hz, 2 and 5 s.d., 15 to 250 ms); the Methods are followed, and the
# Methods say the parameters used are stored with each session's ripple events.
#
# Data the paper used. Adult Long Evans rats in their home cage, ad libitum food and water, 12-h
# light-dark cycle with lights on at 07:00, recorded continuously for up to 7 days (Methods). The
# Methods count 45 rats: 10 chronic ripple and glucose recordings, 8 optogenetic induction of
# ripples in dorsal hippocampus (5 CA1, 3 CA3), 6 DREADD (hM4Di) in lateral septum and 7 CNO
# controls without virus, 3 simultaneous dorsal and ventral CA1, 6 posterior parietal cortex (PPC)
# optogenetic controls, and 5 hippocampus and lateral septum unit recordings from ref. 26.
# Supplementary Table 1 lists rats 1 to 45 with somewhat different counts (9 ripple and glucose
# rats, 7 lateral-septum and 3 medial-septum DREADD rats, 8 CA1-implanted DREADD controls, 4
# dorsal and ventral rats, 6 PPC rats), and Extended Data Fig. 7e says 5 PPC rats. The main
# correlation is reported for n = 30 rats (Results; Fig. 2e; Extended Data Figs 5d and 9e), which
# no single cohort in the Methods matches.
# Measured variables: wideband signals (Intan RHD2000, 20 kHz), analysed at 1,250 Hz; CA1 SPW-R
# events (start, peak, stop, amplitude, duration, frequency); brain state (NREM, wake) from the
# sleep scorer; head accelerometer; an EMG proxy (high-pass coherence); interstitial glucose as
# the current (nA) of a Medtronic iPro2 sensor on the back, with a single tail-vein blood reading
# per placement used to convert current to mg/dl; optogenetic stimulation times, whose rate was
# drawn at random for each 5-min window (0 to 40 per minute); CNO (5 mg/kg) or vehicle injected
# on alternating days between 08:00 and 09:00 (Methods; the Results say 09:00); meal times of
# 3-g pellets in the fasting experiment (4 rats, 36 meals); spikes of hippocampal and lateral
# septal neurons for Extended Data Fig. 8 (38 recordings from 5 rats). Histology scores of viral
# expression (Extended Data Fig. 10e) were given by ten colleagues and are printed only in that
# figure's table.
# Outside data: the paper's Data availability names the lab server
# https://buzsakilab.nyumc.org/datasets/TingleyD/ as holding the datasets; no other archive.
#
# Methods shared by the criteria below, each from the paper as cited.
# - SPW-R detection as in the Methods (SPW-R detection): 120-200 Hz third-order Butterworth on the
#   1,250-Hz LFP, normalized squared signal, peak above 5 s.d., edges at 2 s.d., duration 15 to
#   250 ms, events coincident with a 5 s.d. event on a noise channel (or the estimated EMG)
#   excluded. Events already detected and stored in the dataset with these parameters are used.
# - Time base. The glucose reading interval is taken as 5 min: calibration used the iPro2 reading
#   within 2.5 min of the blood sample (Methods, Glucose sensor calibration), Fig. 2g uses 5-min
#   epochs, Extended Data Fig. 6a uses offsets in 5-min increments and Extended Data Fig. 7m
#   5-min bins. SPW-R rate (and stimulation rate) is the count of events in each 5-min bin aligned
#   to the glucose readings, expressed per minute (Fig. 2a, "rate of SPW-Rs per minute").
# - Glucose fluctuation is the derivative of the sensor signal, "change in current (delta
#   current)" (Fig. 2a legend). OPEN, readings: (a) the difference between successive raw
#   readings; (b) the same after high-pass filtering the current as in Fig. 1b, whose cutoff is
#   not given (a standard choice is to be named). Current in nA is used; conversion to mg/dl is a
#   constant per placement and cannot change a correlation.
# - Cross-correlogram: the correlation coefficient R between SPW-R rate and delta current at
#   offsets from -100 to +100 min in 5-min steps (Extended Data Figs 4b and 6a), a positive offset
#   meaning glucose after SPW-Rs ("future changes", Results). OPEN, the correlation type is not
#   named: (a) Pearson, (b) Spearman.
# - Unit of analysis. OPEN, readings: (a) one cross-correlogram per rat over all its recording,
#   pairs taken only within continuous recording; (b) one per session (a continuous recording),
#   averaged per rat.
# - Circular shuffle: SPW-R rate (or stimulation rate) circularly shifted against delta current,
#   100 iterations per rat (Fig. 2f and 3f legends); the shift is a random number of bins, as in
#   buzcode's bz_shuffleCircular (whether that function was used is not stated).
# - The "+-" spreads the paper gives (R, lag, SPW-R rate) are not said to be s.d. or s.e.m.
schema_version: 2
dataset:
  archive: dandi
  id: "000233"
paper: doi:10.1038/s41586-021-03811-w
claims:
- id: fig2-ripple-rate-predicts-glucose
  statement: SPW-R rate is negatively correlated with future changes in interstitial glucose,
    with a mean peak correlation of R = -0.21 (+- 0.08) at a lag of 10.7 (+- 4.5) min, over 30
    rats.
  source: Results, SPW-Rs phase reset glucose oscillations, paragraph 1; Figure 2a-f
  quote: Notably, SPW-R rates were negatively correlated with future changes in glucose
    concentrations ... R = -0.21 ± 0.08, n = 30 rats, temporal lag of 10.7 ± 4.5 min
  expected:
  - quantity: mean across rats of the most negative correlation between SPW-R rate and delta
      current
    value: -0.21
    tolerance: 0.08
  - quantity: mean across rats of the lag of that correlation (glucose after SPW-Rs)
    value: 10.7
    tolerance: 4.5
    unit: min
  criterion: Cross-correlograms as in the opening comment. Per rat, R is the most negative
    correlation and the lag its offset. OPEN, the search range for the lag is not given; readings
    (a) offsets 0 to +100 min, (b) -100 to +100 min. OPEN, which rats form n = 30; readings (a)
    every rat in the dataset with CA1 SPW-Rs and glucose recorded together, in all conditions
    (vehicle and CNO-free days for the DREADD rats, the optogenetic rats' natural SPW-Rs), (b)
    only the ripple and glucose cohort of the Methods and Supplementary Table 1. Reproduced when,
    under one combination of the readings named here and in the opening comment, both expected
    values hold and R is negative in most rats; the number of rats used is reported.
- id: fig2ef-correlation-beyond-shuffle
  statement: The correlation between SPW-R rate and glucose change at a 10-min lag is more
    negative than the correlations obtained when SPW-R rate is circularly permuted.
  source: Figure 2e-f legends
  quote: Histograms of the correlation between SPW-R rate and current flux at 10 min (red) and
    the correlation observed when SPW-R rate is circularly permuted (black) (100 iterations per
    rat)
  depends_on:
  - fig2-ripple-rate-predicts-glucose
  criterion: The paper gives no test for this panel. Correlation at +10 min per rat, against 100
    circular shuffles per rat (opening comment). Reproduced when the median of the observed
    per-rat correlations is below the median of the shuffled ones and a two-sample
    Kolmogorov-Smirnov test of observed against shuffled values gives p < 0.05, the test the
    paper uses for the same comparison in Fig. 3f.
- id: fig2g-clustered-ripples
  statement: Isolated SPW-Rs have little or no effect on glucose, whereas clustered SPW-Rs (more
    than 30 per minute) are followed by a several-fold larger decrease.
  source: Results, SPW-Rs phase reset glucose oscillations, paragraph 1; Figure 2g
  quote: Isolated SPW-Rs had little or no effect, whereas clustered events with more than 30
    SPW-Rs per minute induced a several-fold-larger decrease in peripheral glucose levels
  depends_on:
  - fig2-ripple-rate-predicts-glucose
  criterion: As in the Fig. 2g legend, the mean delta current 10 min after each 5-min epoch,
    grouped by the number of SPW-Rs in the epoch. OPEN, the threshold; the Results say 30 per
    minute and the legend counts per 5-min epoch, so readings (a) more than 150 SPW-Rs per epoch,
    (b) more than 30 per epoch. OPEN, "isolated" is not defined; the choice made here is epochs
    with 1 to 5 SPW-Rs (at most one per minute). Reproduced when, under one reading, the mean
    delta current after clustered epochs is negative and at least twice the magnitude of that
    after isolated epochs; the full curve over epoch counts is shown.
- id: edfig4-ripple-features
  statement: Of the SPW-R features, the inter-SPW-R interval (clustering) most strongly modulates
    the glucose effect, then amplitude, then duration, and ripple frequency least.
  source: Results, SPW-Rs phase reset glucose oscillations, paragraph 1; Extended Data Fig. 4a-c
  quote: The most impactful of these was the inter-SPW-R interval (that is, the degree of
    clustering of SPW-Rs) ... The second most influential feature was the amplitude of SPW-Rs,
    followed by SPW-R duration; the frequency of the ripple oscillation had the least effect
  criterion: As in the Extended Data Fig. 4b legend, SPW-Rs binned by the percentile of each
    feature (duration in ms), and for each bin the mean peri-SPW-R delta current at +10 min.
    Features from the Methods (amplitude as the maximum normalized squared signal, duration as
    stop minus start, frequency from the Hilbert phase). OPEN, the influence measure is not
    defined; the choice made here is the range of the +10-min effect across bins. OPEN, bin width;
    readings (a) deciles, (b) 5-percentile bins. Reproduced when, under one reading, the order of
    the four ranges is interval, amplitude, duration, frequency; partially reproduced when the
    interval has the largest range but the rest of the order differs.
- id: fig2h-phase-reset
  statement: The phase dispersion of the glucose rhythm decreases after SPW-Rs, more so for
    higher SPW-R rates.
  source: Results, SPW-Rs phase reset glucose oscillations, paragraph 2; Figure 2h
  quote: Furthermore, the phase dispersion of the glucose rhythm decreased after SPW-Rs, and the
    magnitude of this decrease was proportional to SPW-R rate
  criterion: As in the Fig. 2h legend, the circular s.d. of glucose phase across peaks of SPW-R
    rate, at offsets -100 to +100 min. OPEN, the phase extraction is not given; readings
    (a) Hilbert phase of delta current band-passed at periods of 15 to 75 min (the coupling range
    of Extended Data Fig. 5), (b) at 15 to 90 min (the elevated power of Extended Data Fig. 1h).
    OPEN, peaks are local maxima of SPW-R rate, grouped here into quartiles of peak rate.
    Decrease is the circular s.d. at offset 0 minus its minimum from 0 to +30 min (the 5 to 15
    min sensor lag of the Methods lies inside it). Reproduced when, under one reading, the
    decrease is positive for the top quartile and its Spearman correlation with peak rate across
    peaks is positive at p < 0.05.
- id: edfig5-cross-frequency-coupling
  statement: SPW-R rate and glucose show power-power and phase-power coupling at periods of 15 to
    75 min, with the faster SPW-R rhythm (about 40 min) modulating the slower glucose rhythm
    (about 60 min).
  source: Results, SPW-Rs phase reset glucose oscillations, paragraph 2; Extended Data Fig. 5d-e
  quote: We observed significant power-power and phase-power relationships in the 15-75-min range
    ... which suggests that a faster SPW-R frequency (about 40 min) modulates a slower (about 60
    min) glucose rhythm
  statistics:
  - about: power-power comodulogram against circularly shuffled data
    test: Student's t-test
    p: 1.0e-24
    p_relation: "<"
    n: 30 rats
  - about: phase of glucose against SPW-R rate amplitude
    test: Rayleigh test for non-uniformity
    p: 1.0e-18
    p_relation: "<"
  criterion: OPEN, the band filters and envelope method are not given; the choice made here is
    band-pass at log-spaced periods from 10 to 120 min and Hilbert envelopes and phases.
    Power-power, the correlation of SPW-R-rate and glucose envelopes for each pair of periods,
    per rat, against circular shuffles; t-test across rats on the mean over 15 to 60 min.
    Phase-power, SPW-R rate (z-scored per rat) as a function of glucose phase, Rayleigh test of
    rate-weighted phases. Reproduced when both tests give p < 0.05 and the comodulogram peak lies
    at a longer glucose period than SPW-R period. The paper's p bounds are compared, not required.
- id: edfig1-glucose-rhythm
  statement: Interstitial glucose fluctuations show an approximately 60-min oscillation, with
    power elevated above the 1/f fit at periods of 15 to 90 min.
  source: Results, SPW-Rs phase reset glucose oscillations, paragraph 2; Extended Data Fig. 1g-i
  quote: Because interstitial glucose fluctuations displayed an approximately 60-min oscillation
  expected:
  - quantity: period of the glucose oscillation
    value: 60
    tolerance: 6
    unit: min
  criterion: As in Extended Data Fig. 1g-h, power spectral density of delta current per rat, a
    linear fit in log-log axes subtracted, averaged across rats. Reproduced when the residual
    power is positive over 15 to 90 min and its peak, or the first side peak of the mean
    autocorrelogram (Extended Data Fig. 1i), lies within tolerance of 60 min.
- id: edfig1-glucose-circadian-meals
  statement: Glucose concentrations are modulated over the circadian cycle and rise after meals.
  source: Results, SPW-Rs phase reset glucose oscillations, paragraph 1; Extended Data Fig. 1e-f
  quote: Interstitial glucose concentrations are modulated over the circadian timescale. f ,
    Interstitial glucose concentrations increase during the postprandial period ( n = 36 meals,
    collected from 4 rats)
  expected:
  - quantity: meals in the fasting experiment
    value: 36
    tolerance: 3.6
  - quantity: rats in the fasting experiment
    value: 4
    tolerance: 0
  criterion: The paper gives no test. Circadian, glucose (current) by hour of day averaged per
    rat; reproduced when a one-way ANOVA of hour of day on hourly means pooled over rats gives
    p < 0.05 (a choice made here). Meals, current in the 60 min after each meal against the 30
    min before; reproduced when the mean change is positive and a paired t-test across meals
    gives p < 0.05 (a choice made here; the windows are not given in the paper).
- id: edfig1-sensor-decay
  statement: The raw sensor current decays slowly over days after implantation, while the
    magnitude of its fluctuations (delta current) stays stable.
  source: Extended Data Fig. 1b, 1d
  quote: Note the slow decay over days, an indication of glucose oxidase enzyme breakdown on the
    electrode surface ... Note the relatively stable readings over days, and that the slow decay
    in absolute current readings is no longer present
  criterion: The paper gives no test. Per placement, daily mean current and daily mean absolute
    delta current against day since implantation. Reproduced when the slope of daily mean
    current is negative in most placements and the slope of absolute delta current, as a
    fraction of its first-day value, is smaller in magnitude than that of the current.
