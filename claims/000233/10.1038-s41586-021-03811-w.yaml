- id: edfig6-ripple-rate-best-predictor
  statement: Among seven measured predictors, SPW-R rate is the most predictive of glucose
    fluctuations; leaving it out raises the model error most, at a +10-min offset.
  source: Results, SPW-Rs phase reset glucose oscillations, paragraph 3; Extended Data Fig. 6a-b;
    Supplementary Discussion, paragraph 3
  quote: In all cases, SPW-R rate was the most predictive variable
  criterion: As in the Methods (Leave-one-out and pairwise model comparisons) for each rat, the
    seven predictors (SPW-R rate, NREM or wake, high-pass coherence, power spectrum slope, theta
    residual, theta/delta ratio, accelerometer movement), a linear regression on all seven and on
    six, two thirds of bins for training and one third for testing, 100 random splits, offsets
