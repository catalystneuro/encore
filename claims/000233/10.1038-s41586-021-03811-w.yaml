- id: fig4-cno-controls-no-change
  statement: In control rats without virus, CNO does not change the SPW-R correlation with
    glucose fluctuations compared with vehicle days.
  source: Results, Lateral septum relays SPW-Rs downstream, paragraph 2; Figure 4b-d
  quote: When CNO was injected into control rats, the SPW-R correlation with glucose fluctuations
    was not significantly different from vehicle days
  depends_on:
  - fig2-ripple-rate-predicts-glucose
  criterion: A claim of absence, judged on the paper's two-way t-test (Extended Data Fig. 10d,
    Fig. 4e) at p < 0.05. Correlation of SPW-R rate with delta current at +10 min (Fig. 4e) in the
    2-h window after each injection (Methods), one value per day, control rats; CNO days against
    vehicle days by a two-sided unpaired t-test (the choice made here, as Extended Data Fig. 10d
    compares days). The paired test on per-rat means (Fig. 4c) is shown as a variant. Reproduced
    when the test does not give p < 0.05; the difference is reported either way.
