- id: fig2c-cue-pc1-ordered
  statement: Across all 1812 neurons, the first principal component of cue firing (29.7% of firing
    variance) was ordered cue firing, danger > uncertainty > safety.
  source: Results, paragraph 2; Figure 2c inset
  quote: Principal component analysis (PCA) revealed ordered cue firing (danger > uncertainty >
    safety) to be the primary low-dimensional feature across all brainstem neurons (PC1, explaining
    29.7% of firing variance
  expected:
    quantity: variance explained by PC1 of cue firing
    value: 29.7
    tolerance: 2.97
    unit: percent
  criterion: PCA of the 1812 x 42 cue matrix (shared method). PC1 oriented so its mean weight over
    the 10 danger cue intervals is positive. Reproduced when the variance explained is within
    tolerance and the mean PC1 weight over the 10 cue intervals is ordered danger > uncertainty >
    safety; partially reproduced when the order holds and the variance is out of tolerance.
    Open, how 29.7% was computed. On the paper's own matrix (Source Data Fig. 2c inset, 1812 x
    42) PCA with MATLAB's defaults gives 47.1% for PC1; with columns scaled 39.2%, uncentred
    50.2%, with intervals as observations 25.8%; none gives 29.7%. The network PCAs of Fig. 4e
    do reproduce from Source Data with the defaults (37.0% and 29.2%), so the defaults stay the
    method, and the author reports the value on the Source Data matrix beside the recomputed one.
- id: fig2c-pc1-contribution
  statement: PC1 firing information originated from nine clusters (k1 to k9), a minority of
    neurons (505 of 1812, 27.9%), with k1 and k2 contributing most per unit.
  source: Results, paragraphs 3 and 4; Figure 2c; Source Data Fig. 2c
  quote: PC1 firing information originated from nine clusters (k1–k9; Fig. 2c and Supplementary
    Fig. S5 ) composed of a minority of neurons (505/1812, 27.9%)
  depends_on:
  - fig2c-cue-pc1-ordered
  expected:
  - quantity: neurons in the nine clusters contributing most to PC1
    value: 505
    tolerance: 50.5
  - quantity: PC1 contribution per unit of k1 (Source Data Fig. 2c)
    value: 0.121
    tolerance: 0.012
    unit: percent variance per neuron
  - quantity: PC1 contribution per unit of k2 (Source Data Fig. 2c)
    value: 0.113
    tolerance: 0.011
    unit: percent variance per neuron
  criterion: Per cluster, its members' rows of the cue matrix shuffled (readings s-a, s-b), PCA,
    and the drop in PC1 variance explained from the intact 29.7% averaged over 1000 iterations,
    divided by the cluster's size (Results; Supplementary Methods, PCA). Under L1, reproduced when
    the nine largest contributions per unit are those of k1 to k9 and k1 and k2 are the two
    largest, and the k1 and k2 values are within tolerance; partially reproduced when at most two
    clusters are out of place. Under L2, the nine clusters with the largest contributions must
    hold a total within the tolerance of 505. The reading that reproduces the Source Data values
    is reported.
- id: fig2d-danger-latency
  statement: Clusters k1 to k9 showed shorter firing latencies after danger onset, and across all
    21 clusters danger firing latency correlated negatively with the magnitude of PC1 contribution
    (R2 = 0.41, p = 0.0017).
  source: Results, paragraph 4; Figure 2d; Supplementary Methods, Danger
    firing latency
  quote: Clusters k1–k9 showed shorter firing latencies following danger onset, and across all
    clusters, danger firing latency negatively correlated with the magnitude of PC1 contribution (
    R 2 = 0.41, p = 0.0017; Fig. 2d )
  depends_on:
  - fig2c-pc1-contribution
  statistics:
  - test: linear correlation across clusters
    statistic: R2 = 0.41
    p: 0.0017
    n: 21 cue clusters
  expected:
    quantity: R2 between cluster mean danger latency and PC1 contribution
    value: 0.41
    tolerance: 0.041
  criterion: Per unit, mean normalized danger firing over the 10-s cue in 10,000 1-ms bins, latency
    = the bin of greatest change found by MATLAB findchangepts with its defaults (one change point
    in the mean); the cluster's latency is the mean over its units (Supplementary Methods). Open,
    (l-a) normalized 1-ms firing built from spike times with the unit's z-score parameters, or (l-b)
    the 250-ms normalized firing repeated into 1-ms bins; and which units carry no latency (Source
    Data Fig. 2d lists 1498 of 1812 units; a unit with no change point, such as one silent during
    danger, is left out). The contribution is read as (c-a) per unit (Results) or (c-b) the
    cluster total; on the paper's Source Data values (c-a) gives R2 = 0.51 and (c-b) 0.39.
    Reproduced when, under one reading, the correlation is negative with p < 0.05, R2 within
    tolerance, and the mean latency of k1 to k9 units is below that of k10 to k21 units; partially
    reproduced when negative and significant with R2 out of tolerance.
- id: fig2e-cue-subnetwork
  statement: Clusters k1 to k9 separated from the rest by cluster-cluster cue firing correlations,
    forming a functional subnetwork within the larger brainstem network, with k3 the exception
    showing weak correlations with its fellow clusters.
  source: Results, paragraph 4; Figure 2e; Supplementary Methods, Correlated
    cluster firing
  quote: Clusters k1–k9 further separated themselves based on cluster-cluster cue firing
    correlations (Fig. 2e and Supplementary Fig. S5 ), forming a functional subnetwork within the
    larger brainstem network. An exception was k3, which showed weak firing correlations with fellow
    clusters.
  depends_on:
  - fig2c-pc1-contribution
  criterion: Pearson correlation between every pair of cluster mean cue profiles. The Methods give
    36 columns (12 1-s intervals per cue, 2 s pre-cue through the 10-s cue) and Source Data Fig. 2e
    holds 42 (14 per cue); both are run, and r and r squared both reported (the Methods write
    "Pearson's correlation coefficient (R2)"). No test is given. Reproduced when the mean
    correlation among the 36 pairs of k1 to k9 exceeds the mean correlation of k1 to k9 with k10
    to k21, and k3 has the lowest mean correlation with the other eight subnetwork clusters;
    partially reproduced when only the first holds.
- id: fig2f-cue-hubs
  statement: K1 and k2 were hubs of the cue subnetwork, with the greatest PC1 contributions, short
    danger latencies, and single-unit firing that correlated most strongly with the mean cue firing
    of their fellow subnetwork clusters.
  source: Results, paragraph 4; Figure 2f; Supplementary Methods, Hub
    identification with single unit x cluster correlations; Source Data Fig. 2f
  quote: K1 and k2 neurons showed indicators of a subnetwork hub ... Furthermore, k1 and k2
    single-unit firing correlated most strongly with mean cue firing of their fellow subnetwork
    clusters
  depends_on:
  - fig2c-pc1-contribution
  statistics:
  - test: two-tailed independent samples t-test (means) and Levene's test (variances), between
      clusters
    p: 0.007
    p_relation: "<"
    corrected: Bonferroni (0.05/7)
    n: 505 cue subnetwork units
  expected:
  - quantity: mean unit x cluster correlation of k1 (Source Data Fig. 2f)
    value: 0.424
    tolerance: 0.042
  - quantity: mean unit x cluster correlation of k2 (Source Data Fig. 2f)
    value: 0.466
