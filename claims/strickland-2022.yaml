- id: fig2b-cue-clusters
  statement: K-means clustering of cue firing organized brainstem neurons into at least 21
    functional clusters, of sizes from 24 to 219 (median 83).
  source: Results, paragraph 2; Figure 2b; Supplementary Methods, K-means
    clustering
  quote: K-means clustering for mean, single-unit firing in 1-s bins from 2-s prior to 2-s
    following cue presentation (danger, uncertainty, and safety) revealed neurons could be organized
    into at least 21 functional clusters ... Cluster size varied (min size = 24, max = 219, and
    median = 83)
  expected:
  - quantity: smallest cue cluster
    value: 24
    tolerance: 2.4
  - quantity: largest cue cluster
    value: 219
    tolerance: 21.9
  - quantity: median cue cluster size
    value: 83
    tolerance: 8.3
  criterion: Shared method (cue matrix, k-means, L2) with 21 clusters. The paper's choice of 21 was
    by inspection and is taken as given; the mean squared distance for 1 to 25 clusters is
    reported. Reproduced when the median over seeds of the smallest, largest and median cluster
