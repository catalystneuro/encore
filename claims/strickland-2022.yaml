# Claims for Strickland & McDannald (2022), Nat Commun 13:6192, "Brainstem networks construct
# threat probability and prediction error from neuronal building blocks", on CRCNS data set bst-3
# (doi:10.6080/K0Q23XGR).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-10,
# protocol as stated in docs/protocol.md (Reader), version pilot-14.
#
# Text read: the version of record (PMC9582012, open access, Europe PMC JATS XML flattened), with
# Results, Discussion, figure legends and Methods, and its Supplementary Information
# (41467_2022_34021_MOESM1_ESM.pdf as extracted text, publisher's site): Supplementary Methods
# (head cap, surgery, acquisition, sorting, z-score normalization, heat plots, k-means, PCA,
# latency, correlations, hubs, regression, lesion PCA, anatomy, chi-square), Supplementary
# Figures 1 to 7 (legends; the panels are garbled in the extraction) and Supplementary Tables 1
# and 2 (read from the extracted cells; Table 2's column layout is garbled, its row and subject
# totals are not). The Source Data workbook (41467_2022_34021_MOESM4_ESM.xlsx) was read with a
# small XML parser; numbers marked "Source Data" below come from it. The supplement PDF could not
# be rendered (no poppler), so no panel was read as an image. The CRCNS data descriptor
# (paper/bst-3.data-description.txt) was read only to know what the data set holds; no claim or
# method comes from it.
#
# Code. The paper's Code availability says "Code for single-unit analyses is available at
# https://crcns.org/", which puts it inside the data set (by its descriptor the scripts folder,
# cubeAnalysis, cueAnalysis, cueRegression, outcomeAnalysis, outcomeRegression, MATLAB). Being
# among the data set's files, it was not read in this run, and no commit is recorded. Every method
# below is from the Methods, the Supplementary Methods, the legends or the Source Data. Where those
# scripts settle a detail named as open below, the author may follow them (protocol, Reader step 2)
# and should say so.
#
# Data the paper used. Ten Long-Evans rats (six male, four female; subjects 1 to 3 and 10 female,
# Supplementary Table 1), shaped to nose poke for pellets on VI-60 independent of cues and shock,
# then 12 sessions of probabilistic fear discrimination before a single Neuropixels 1.0 probe was
# implanted through the brainstem (AP -8.00, ML -2.80, DV -7 to -7.5, 15 degree angle). Each
# recording session (1 to 10 per rat) has 16 trials, 10-s auditory cues, mean ITI 3 min, random
# order. 4 danger (shock p = 1), 2 uncertainty shock and 6 uncertainty omission (p = 0.25),
# 4 safety (p = 0). Shock is 0.5 mA, 0.5 s, starting 2 s after cue offset, so shock offset falls
# 2.5 s after cue offset (the same time is used on omission and safety trials). Measured variables
# are spike times of sorted single units (Kilosort 2 or 2.5, Phy, a MATLAB stability screen), cue,
# shock, pellet and nose-poke times, and each unit's brain region (21 regions, from histology and
# the Paxinos and Watson atlas). 1812 units from 73 sessions; 965 from females. Supplementary
# Table 1 lists 8, 9, 10, 2, 8, 1, 10, 7, 10 and 10 sessions for subjects 1 to 10 (75 in total),
# against 73 in the Results and in Source Data Fig. 1c; the paper does not say which two sessions
# are not counted. By its title and description the data set holds the 1812 units as one MATLAB
# file each, with per-trial firing, z-normalized firing, nose pokes, suppression ratios and
# anatomy (region, coordinates) per unit.
#
# Shared method, used by the claims below and cited there as "shared method".
#  - Suppression ratio (Methods, Calculating suppression ratios). Per trial, baseline rate = pokes
#    in the 20 s before cue onset x 3, cue rate = pokes in the 10-s cue x 6, ratio = (baseline -
#    cue) / (baseline + cue). Open, (sr-a) a trial with no pokes in either period set to 0, or
#    (sr-b) left out of means. A session's value for a cue is the mean over its trials of that
#    cue (uncertainty pooling its 8 trials).
#  - Normalized firing (Supplementary Methods, Z-score normalization). Per unit and trial, firing
#    rate in 250-ms bins; the trial's baseline (mean rate over the 2 s before cue onset) is
#    subtracted; the differential firing is z-scored across all trials and bins of the unit.
#    Open, (n-a) baseline per trial, or (n-b) the mean baseline of that trial type ("baseline
#    firing rate (2 s prior to cue onset) specific to that trial type"). Open, the epoch is given
#    both as "from 20 s prior to cue onset to 20 s following cue offset" (w-a, 200 bins) and as
#    "a total of 240 bins" (w-b, 60 s from 20 s before cue onset). Mean over trials per trial type,
#    then 250-ms bins averaged into 1-s intervals (cue) or 500-ms intervals (outcome).
#  - Cue matrix (Supplementary Methods, K-means clustering and PCA). 1812 x 42, per cue 14 1-s
#    intervals from 2 s before cue onset to 2 s after cue offset, columns 1-14 danger, 15-28
#    uncertainty (all 8 trials), 29-42 safety.
#  - Outcome matrix. 1812 x 80, per trial type 20 500-ms intervals over the 10 s from shock offset,
#    columns 1-20 danger, 21-40 uncertainty shock, 41-60 uncertainty omission, 61-80 safety.
#  - K-means (Supplementary Methods, K-means clustering). MATLAB kmeans, number of clusters 21
#    (cue) and 11 (outcome), chosen by the paper by inspecting solutions for 1 to 25 and 1 to 20
#    clusters. No option, replicate count or seed is given. Standard choice, MATLAB's defaults
#    (squared Euclidean distance, k-means++ seeding, one replicate); since one replicate depends
#    on the seed, a solution's result is reported as the median over 20 seeds, and the best of
#    20 replicates (lowest summed distance) is shown as a variant.
#  - Cluster labels, two readings. (L1) The paper's own membership. Source Data sheets
#    "Figure 2b k1" to "k21" hold the 42-value cue row of every member unit and "Figure 4b k1" to
#    "k11" the 80-value outcome row; each dataset unit is assigned to the sheet whose row it
#    matches (claim source-data-cluster-link). Their row counts give cue cluster sizes 24, 43, 26,
#    44, 44, 72, 92, 57, 103, 105, 74, 46, 83, 202, 55, 137, 219, 89, 110, 94, 93 (k1 to k21; k1-k9
#    sum to 505) and outcome sizes 77, 46, 142, 169, 245, 142, 111, 171, 189, 198, 322 (k1 to k11;
#    k1-k3 sum to 265, k6-k9 to 613, as the Results give). (L2) The author's own k-means. Cue
#    clusters are numbered by decreasing PC1 contribution per unit, as the paper's are (Source
#    Data Fig. 2c falls from 0.121 for k1 to -0.0026 for k21); outcome clusters are matched to the
#    paper's by largest member overlap with L1 (Hungarian assignment), or, when L1 fails, by
#    correlation of cluster-mean 80-value profiles with the means of the Source Data Fig. 4b
#    sheets. Claims that name a cluster need L1 or this matching.
#  - Networks. Cue subnetwork k1-k9 and supranetwork k10-k21 (Results; Source Data Fig. 3e rows
#    "k1_k9" and "k10_k21", Fig. 2f with 505 units). The Supplementary Methods name "clusters 1-8"
#    (hubs, lesion); that is shown as a variant. Phasic outcome network k1-k3 (n = 265) and tonic
#    k6-k9 (n = 613) (Results). The Supplementary Methods name phasic "clusters 1-5" and tonic
#    "clusters 7-10" for the hubs. Source Data use k1-k9 for the cue hubs (Fig. 2f, 505 rows),
#    k1-k3 and k6-k9 for the outcome hubs (Fig. 4f, 265 and 613 rows) and for the lesions (see
#    Shuffle, lesion), and the Methods' sets are variants there. Source Data Fig. 5e's row "1_3"
#    holds 679 units, the size of k1-k5, so for Fig. 5e alone phasic is read as (p-a) k1-k3 or
#    (p-b) k1-k5.
#  - PCA. MATLAB pca with its defaults (columns centred, not scaled), units or clusters as rows;
#    percent variance explained as the paper's "% firing variance" or "% signaling variance".
#    A PC's sign is arbitrary; each criterion fixes the orientation it uses.
#  - Shuffle, PC1 contribution (Supplementary Methods, PCA). 1000 iterations. The paper does not
#    say what is permuted. Open, (s-a) each row of the shuffled clusters permuted independently
#    across its columns, or (s-b) all entries of the shuffled block permuted together.
#  - Shuffle, lesion (Results, paragraph 7; Supplementary Methods, 'Lesion' x PCA x linear
#    regression). 1000 iterations. The Results shuffle cluster firing and then regress; the
#    Supplementary Methods shuffle beta coefficients. Source Data Fig. 3c, 3d, 5c and 5d middle
#    hold the matrices the paper ran PCA on, and they settle three points. (1) The shuffled
#    clusters are k1-k9 (Fig. 3c), k10-k21 (3d), k1-k3 (5c) and k6-k9 (5d); every other row equals
#    the intact matrix. (2) Cue lesion: each shuffled row's values are close to that row's mean
#    over the 14 intervals of the same regressor, so (s-c) each shuffled cluster's values are
#    permuted across the 14 intervals (betas, or firing before regression; both give this),
#    averaged over the 1000 iterations. Outcome lesion: the shuffled rows are close to 0 (k1 to k3
#    within 0.05), which a permutation of betas (s-a, s-b) cannot give (they keep the row or block
#    mean, 0.17 for k1-k3). They fit (s-d) each shuffled cluster's firing permuted across its 16
#    trial rows before regression, betas averaged over the 1000 iterations; whether intervals are
#    permuted too is open. (3) PCA (MATLAB defaults) of these averaged matrices gives 79.95% and
#    16.82% (Fig. 5c) and 61.27% and 29.77% (Fig. 5d), the paper's 80.0, 16.8, 61.3 and 29.8; so
#    the reported percentages are (v-a) from one PCA of the averaged shuffled matrix. The
#    Supplementary Methods' (v-b), PCA per iteration with weights averaged, is shown as a variant;
#    for it each iteration's PC is sign-aligned to the intact PC (positive dot product), a choice
#    the paper does not state. s-a and s-b are shown as variants.
#  - Regression (Supplementary Methods, Linear regression). Per cluster and interval, MATLAB
#    regress of firing on two regressors over the 16 trial rows. Cue, threat probability (1 for
#    the 4 danger rows, 0.25 for the 8 uncertainty rows, 0 for the 4 safety rows) and behaviour
#    ("the trial-specific, mean suppression ratio for the cluster"), 14 1-s intervals. Outcome,
#    shock (1, 1, 0, 0 for danger, uncertainty shock, uncertainty omission, safety) and prediction
#    error (0, 0.75, -0.25, 0), 20 500-ms intervals. Open, (r-a) one regression on the cluster's
#    mean normalized firing per trial row, with behaviour the mean over member units of that row's
#    suppression ratio, or (r-b) one regression per unit on its own trials and its session's
#    ratios, betas then averaged within the cluster (the legends call them "Mean cluster beta
#    weights", with SEM); and (i-a) with an intercept column or (i-b) without. Source Data Fig. 3b
#    middle holds the paper's 21 x 28 cue beta matrix and Fig. 5b middle the outcome matrix; the
#    reading whose matrix matches them is to be adopted where the readings disagree.
#  - Mapping (Supplementary Methods, Mapping cluster and network membership). The Methods
#    subtract "the proportion contributing to each network ... from the overall proportion". The
#    paper's own values follow a different formula: Source Data Fig. 3e right is, per region, its
#    share of subnetwork units minus its share of supranetwork units, in percentage points (DPG,
#    62/505 - 83/1307 = 5.93; LPAG, 61/505 - 61/1307 = 7.41), and Fig. 5e right is the region's
#    share of tonic units minus its share of phasic units (MnR, 24/613 - 57/679 = -4.48). That
#    formula is used; the region's proportion in a network minus the network's overall proportion
#    (the Methods' wording) is shown as a variant.
#
# Not claimed. The sex splits (Supplementary Figs. 3, 5, 6, 7) carry no stated finding; Fig. 2a and
# 4a heat maps and Supplementary Fig. 4 (rat x cluster counts) are descriptive.
schema_version: 2
paper: doi:10.1038/s41467-022-34021-1
claims:
- id: source-data-cluster-link
  kind: link
  statement: The data set's units can be matched to the rows of the paper's Source Data cluster
    sheets, which gives the paper's own cue and outcome cluster membership.
  source: Source Data, sheets Figure 2b k1 to k21 and Figure 4b k1 to k11; Supplementary Methods,
    Z-score normalization and K-means clustering
  criterion: For each unit, the 42-value cue row and 80-value outcome row are computed with the
    shared method, under each normalization reading (n-a, n-b, w-a, w-b), and compared with the
    rows of the Source Data sheets. A unit matches a row when the largest absolute difference is
    below 0.01 (a standard tolerance for rounding). The link holds (reproduced) when, under one
    reading, at least 95% of the 1812 Source Data cue rows and of the 1812 outcome rows each match
    exactly one unit; partially reproduced for 50% to 95%, using the best Pearson correlation
    above 0.99 as the match; not reproduced below. The reading that matches is reported, as it
    settles the normalization readings for the other claims.
- id: fig1c-suppression-order
  statement: During recording sessions suppression of rewarded nose poking was high to danger,
    intermediate to uncertainty and low to safety, with a main effect of cue (F(2,142) = 149.2,
    p = 1.26 x 10^-35) over 73 sessions.
  source: Results, paragraph 1; Figure 1c; Source Data Fig. 1c
  quote: Suppression of rewarded nose poking was high to danger, intermediate to uncertainty, and
    low to safety (Fig. 1c ; ANOVA main effect of cue [ F (2,142) = 149.2, p = 1.26 × 10 –35 ]
  statistics:
  - test: ANOVA, main effect of cue
    statistic: F(2,142) = 149.2
    p: 1.26e-35
    n: 73 recording sessions
  expected:
  - quantity: F for the main effect of cue
    value: 149.2
    tolerance: 14.92
  - quantity: mean danger suppression ratio over sessions (Source Data Fig. 1c)
    value: 0.914
    tolerance: 0.091
  - quantity: mean uncertainty suppression ratio over sessions (Source Data Fig. 1c)
    value: 0.709
    tolerance: 0.071
  - quantity: mean safety suppression ratio over sessions (Source Data Fig. 1c)
    value: 0.230
    tolerance: 0.023
  criterion: Session values per cue as in the shared method (suppression ratio). The ANOVA design
    is not given. Its degrees of freedom, 2 and 142 with 73 sessions, fit (a-a) a cue (within) x
    sex (between, sessions as subjects) mixed ANOVA, error df 2 x (73 - 2); (a-b) a one-way
    repeated-measures ANOVA over sessions has df 2 and 144 and is shown as well. On the paper's
    own Source Data Fig. 1c values (a-b) gives F(2,144) = 116.2, so (a-a) is the leading reading.
    Reproduced when the session means are ordered danger > uncertainty > safety, each within
    tolerance, and the cue effect has p < 0.05 with F within tolerance under one reading;
    partially reproduced when the order and p < 0.05 hold but F or a mean is out of tolerance.
- id: figs2-each-rat-discriminates
  statement: Rats showed complete discrimination during the recording sessions, shown rat by rat
    with 95% bootstrap confidence intervals over sessions.
  source: Results, paragraph 1; Supplementary Fig. 2 legend
  quote: Rats showed complete discrimination during recording sessions
  criterion: Per rat, session suppression ratios per cue (shared method). Supplementary Fig. 2 marks
    "+" where a "95% bootstrap confidence interval does not contain zero" but does not say of
    which quantity, and its marks are not readable in the extracted text. Bootstrap, 10,000
    resamples of sessions, percentile interval (a standard choice). Readings, (c-a) the intervals
    of danger minus safety and uncertainty minus safety exclude zero; (c-b) the intervals of danger
    minus uncertainty and uncertainty minus safety exclude zero; (c-c) the interval of each cue's
    suppression ratio excludes zero for danger and uncertainty. Rats 4 and 6 (2 and 1 sessions)
    give no usable interval and are reported by their means. Reproduced when, under one reading,
    every rat with at least 3 sessions meets it; partially reproduced for at least 6 of those 8.
