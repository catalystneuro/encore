# Claims for Mohebi, Pettibone, Hamid, Wong, Vinson, Patriarchi, Tian, Kennedy & Berke (2019),
# Nature 570, 65-70, "Dissociable dopamine dynamics for learning and motivation",
# doi:10.1038/s41586-019-1235-y, on CRCNS data set vta-2 (doi:10.6080/K0VQ30V9).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-10,
# protocol as stated in docs/protocol.md (Reader), version pilot-14.
#
# Text read: the version of record as served by Europe PMC (PMC6555489, open access), JATS XML
# flattened to text in paper/10.1038-s41586-019-1235-y.txt, with the main text, the Methods, the
# legends of Extended Data Figs. 1 to 8 and the legend of the Supplementary Figure; and the
# Supplementary Information PDF (41586_2019_1235_MOESM1_ESM.pdf), which is that Supplementary
# Figure, one page per identified dopamine cell, with no text beyond its legend. Missing from the
# text: the legends of main Figures 1 to 5. The statistical tests, sample sizes and windows those
# legends give (for Fig. 2f,h,i, Fig. 3c,d,f-h, Fig. 4c,e,f and Fig. 5a-d) were therefore not read,
# and the criteria below name such details as open with the readings the rest of the paper allows.
# No PDF of the article was supplied, so the figures were not seen.
#
# Code: none read. The paper says "Custom MATLAB code is available upon request"; it links no
# repository. The semi-Markov decision process model is "exactly as previously described" in its
# ref. 5 (Hamid et al. 2016, Nat. Neurosci.), which was not supplied.
#
# Data the paper used. Male rats (300-500 g), wild-type Long-Evans or TH-Cre+ on a Long-Evans
# background, in a five-hole operant "bandit" task. Each trial: a nose-poke port lights (Light-On),
# the rat enters it (Center-In), holds 0.5-1.5 s (uniform) until white noise (Go cue), withdraws
# (Center-Out), pokes an adjacent side port (Side-In); on rewarded trials Side-In comes with a food
# hopper click and the rat collects a sugar pellet at the food port (Food-Port-In). Left and right
# are rewarded with independent probabilities that change in blocks of 35-45 trials; 10, 50 or 90%
# for electrophysiology, photometry and voltammetry rats, 20, 50 or 80% for the newly reported
# microdialysis rats. Latency is the time from Light-On to Center-In. The same electrophysiology
# and photometry rats also did a Pavlovian task with three tones (2, 5, 9 kHz; pips 100 ms on and
# 50 ms off for 2.6 s, then a 500 ms delay) predicting food with different probabilities, and
# unpredicted food deliveries, at 15-30 s intervals.
#  - Microdialysis with LC-MS: 12 rats (8 with prelimbic/infralimbic and dorsomedial striatum/NAc
#    guides, 4 with anterior cingulate and NAc core/shell guides), 26 sessions, 51 sample series,
#    1 min samples, 21 neurotransmitters and metabolites, seven subregions.
#  - Electrophysiology: 25 rats with 16-tetrode optrodes in lateral VTA (VTA-l), 30 kHz wideband,
#    MountainSort with manual curation. Optogenetic tagging (AAV-DIO-ChR2 in TH-Cre rats) identified
#    27 dopamine cells from four rats with VTA-l virus (IM657 1, IM1002 3, IM1003 15, IM1037 9),
#    plus 2 retrogradely tagged cells from one rat with NAc core virus (IM-1078), 29 in all. 38
#    untagged fast-spiking VTA-l "non-dopamine" cells from the same sessions.
#  - Photometry: dLight1.1 (3 rats, 4 NAc placements) and dLight1.3b (4 rats, 6 placements), one
#    session per placement, 10 in all; 470 nm and 405 nm control excitation, dF/F at 50 Hz.
#  - Voltammetry: a reanalysis of data published in the paper's ref. 5.
#  - In vitro dLight1.3b characterization in HEK293T cells; CTb retrograde tracing in 3 rats.
# The data set's description (paper/vta-2.data-description.txt) was read only to know what it
# holds: spike times of identified VTA-l dopamine cells in bandit ("RL"), Pavlovian, sleep and laser
# segments, with the behavioural events and trial variables of each. No claim comes from it. It
# describes no microdialysis, photometry, voltammetry, histology or non-dopamine cells; whether the
# data set holds the data a claim needs is the author's to find.
#
# Method details fixed by the Methods and used in several criteria:
#  - Reward rate (Methods, Behavior, paragraph 2) is a time-based leaky integrator, incremented at
#    each reward and decaying exponentially with time constant tau; tau is chosen per session to
#    maximize the negative correlation between reward rate and log(latency), from 1 to 1200 s
#    (Extended Data Fig. 1 legend). Open: the size of the increment (any constant gives the same
#    correlations, terciles and median splits) and the time step of the integration (a standard
#    choice, 10 ms or finer, cannot change the outcome). Open: which value of reward rate a trial
#    gets; the reading is the value at the event the analysis is aligned to (Light-On for latency).
#  - High and low reward blocks: for each session, a median split of the block-averaged
#    leaky-integrator reward rate (Methods, Electrophysiology, Analysis, paragraph 3).
#  - Tonic firing: spike counts in 1 min bins. Spike density functions: Gaussian kernel with
#    variance 20 ms (read as the paper prints it; the reading of 20 ms as the SD is a variant).
#    Bursts: the 80/160 ms template. (Methods, Electrophysiology, Analysis, paragraph 1.)
#  - Time to cue response: 40 ms bins sliding in 20 ms steps, shuffle test with 10,000 shuffles
#    against the 250 ms before the cue, first bin with p < 0.01 corrected for multiple comparisons.
#    Open: the correction (Bonferroni over the bins tested is the reading; the length of the
#    post-cue window tested is open, 0.5 s or 1 s).
#  - Latency split for Fig. 4d,e: short below 1 s, long above 2 s (Results).
schema_version: 2
dataset:
  archive: crcns
  id: vta-2
  doi: 10.6080/K0VQ30V9
paper: doi:10.1038/s41586-019-1235-y
claims:
- id: fig1b-latency-scales-with-reward-rate
  statement: Rats were more motivated when rewards were more likely; their latency from Light-On
    to Center-In scaled inversely with reward rate.
  source: Results, Dopamine tracks motivation in key loci, paragraph 1; Figure 1b
  quote: This was apparent in their “latency” – the time between Light-On and Center-In - which was
    sensitive to the outcome of the preceding few trials ( Extended Data Fig.1 ) and thereby scaled
    inversely with reward rate ( Fig.1b ).
  criterion: Per session, reward rate from the leaky integrator with the session's best tau
    (Methods, Behavior, paragraph 2) and log(latency) per trial, correlated with Pearson's r
    (the Methods' "correlation"). Which sessions Fig. 1b uses is in its legend, not read; the
    readings are every bandit session of the electrophysiology rats, and of the photometry and
    microdialysis rats where those are available. Reproduced when the correlation is negative in
    more than half of the sessions and its mean over sessions is negative with a one-sample
    t-test p < 0.05 (a standard choice, the paper's test for Fig. 1b not being read). Note that
    tau is chosen to make this correlation negative, so the test is of its presence, not of an
    independent prediction.
- id: ed1b-latency-depends-on-recent-outcomes
  statement: In microdialysis sessions, (log) latency depended on the outcomes of the preceding few
    trials, with regression weights of recent trials significantly different from zero.
  source: Extended Data Fig. 1b
  quote: Top left, Regression analysis showing dependency of (log-) latency on the outcome of recent
    trials, during microdialysis sessions (n=26 sessions, 7113 trials, from 12 rats; error bars show
    SEM). Asterisks indicate average regression weights significantly different from zero (t-test,
    p<0.05).
  statistics:
  - about: average regression weight of each past trial's outcome against zero
    test: t-test
    p: 0.05
    p_relation: "<"
    n: 26 sessions, 7113 trials, 12 rats
  expected:
  - quantity: microdialysis sessions
    value: 26
    tolerance: 2.6
  - quantity: trials
    value: 7113
    tolerance: 711.3
  criterion: Per session, a linear regression of log(latency) on the reward outcomes (1 or 0) of
    the preceding trials; the regression weights averaged over sessions and each tested against
    zero with a t-test across sessions, p < 0.05 (legend). The number of past trials is open (the
    figure was not seen); readings 5 and 10. Reproduced when the weights of the most recent trials
    (at least trial n-1) are negative and significant, and weights fall toward zero for older
    trials.
- id: fig1cd-nac-core-dopamine-reward-rate
  statement: Microdialysis dopamine correlated with reward rate in NAc core, unlike the other
    neurotransmitters and metabolites, and not in NAc shell or dorsal-medial striatum.
  source: Results, Dopamine tracks motivation in key loci, paragraph 4; Figure 1c,d; Extended Data
    Fig. 2
  quote: We replicated the correlation between reward rate and NAc dopamine – unlike other
    neurotransmitters ( Fig.1c , d ). However, this relationship was localized to NAc core, not NAc
    shell or dorsal-medial striatum.
  criterion: From Methods, Microdialysis, Analysis. Concentrations smoothed with the 3-point moving
    average (0.25, 0.5, 0.25) and z-scored within session; reward rate averaged in each 1 min
    dialysis bin (Extended Data Fig. 2 legend). Linear regression of each analyte on reward rate
    (MATLAB regress) per subregion, coefficients judged at alpha 0.05 after Bonferroni correction.
    The Methods give the divisor as 21 chemicals x 7 regions x 9 regressors, the Extended Data
    Fig. 2 legend as 7 x 21 x 12 measures; both readings are run. Whether sessions are pooled or
    fitted one by one per subregion is open; both readings are run. Cross-correlograms per session
    are averaged per subregion, with 1% confidence bounds from 100,000 shuffles of one series.
    Reproduced when dopamine in NAc core has a significant positive reward-rate coefficient and
    its zero-lag cross-correlation exceeds the shuffle bound, and neither dopamine in NAc shell
    nor dopamine in dorsomedial striatum, nor any other analyte in NAc core, has a significant
    positive coefficient.
- id: fig1ce-ventral-prelimbic-dopamine-reward-rate
  statement: In frontal cortex, microdialysis dopamine correlated with reward rate in ventral
    prelimbic cortex but not in more dorsal or more ventral subregions.
  source: Results, Dopamine tracks motivation in key loci, paragraph 4; Figure 1c,e
  quote: dopamine release correlated with reward rate in ventral prelimbic cortex, but not more
    dorsal or ventral subregions ( Fig.1c , e ).
  depends_on:
  - fig1cd-nac-core-dopamine-reward-rate
  criterion: The method of fig1cd-nac-core-dopamine-reward-rate, applied to the cortical
    subregions (Extended Data Fig. 1a defines them; anterior cingulate, dorsal and ventral
    prelimbic, infralimbic are the reading). Reproduced when dopamine has a significant positive
    reward-rate coefficient in ventral prelimbic cortex and none in the other cortical subregions.
- id: ed1-behavior-similar-across-subregions
  statement: Overall behaviour did not differ between the microdialysis sessions sampling each of
    the seven subregions, in rewards per min, attempts per min or latency.
  source: Extended Data Fig. 1 legend, last sentence
  quote: Overall behavioral metrics were similar between sessions sampling from each of the seven
    subregions (mean rewards/min... ANOVA F(6,44)=0.58, p=0.746; mean attempts/min... F(6,44)=0.40,
    p=0.872; mean latency... F(6,44)=0.27, p=0.948).
  statistics:
  - about: rewards per min across subregions
    test: one-way ANOVA
    statistic: F(6,44) = 0.58
    p: 0.746
  - about: attempts per min across subregions
    test: one-way ANOVA
    statistic: F(6,44) = 0.40
    p: 0.872
  - about: latency across subregions
    test: one-way ANOVA
    statistic: F(6,44) = 0.27
    p: 0.948
  expected:
  - quantity: lowest subregion mean rewards per min
    value: 1.42
    tolerance: 0.142
  - quantity: highest subregion mean rewards per min
    value: 1.77
    tolerance: 0.177
  - quantity: lowest subregion mean attempts per min
    value: 3.32
    tolerance: 0.332
  - quantity: highest subregion mean attempts per min
    value: 3.97
    tolerance: 0.397
  - quantity: lowest subregion mean latency
    value: 5.99
    tolerance: 0.599
    unit: s
  - quantity: highest subregion mean latency
    value: 8.02
    tolerance: 0.802
    unit: s
  criterion: A claim of absence. One-way ANOVA across the seven subregions of the per-series
    session means (51 series, so 44 residual degrees of freedom), for each metric; reproduced when
    p >= 0.05 for all three. Attempts are initiated trials including errors (Extended Data Fig. 2
