- id: ed5-pavlovian-dopamine-click-responses
  statement: In the Pavlovian task, dopamine cells responded strongly to randomly timed food hopper
    clicks and progressively less strongly when the clicks were made more predictable by preceding
    cues.
  source: Results, VTA firing is unrelated to motivation, paragraph 3; Extended Data Fig. 5b,c
  quote: VTA-l dopamine cells responded strongly to randomly-timed food hopper clicks, and
    progressively less strongly when these clicks were made more predictable by preceding cues (
    Extended Data Fig.5 ).
  expected:
  - quantity: cells with 75 and 25% high and medium tones
    value: 9
    tolerance: 0.9
  - quantity: cells with 100 and 50% high and medium tones
    value: 18
    tolerance: 1.8
  criterion: From Extended Data Fig. 5 legend. Click response is the peak firing rate in the 0.5 s
    after the food hopper click, per trial, for unpredicted clicks and for clicks after the medium
    and high tones; one-way ANOVA across these conditions per session (cell). Reproduced when the
    mean over the 27 cells is ordered unpredicted > medium > high and the ANOVA has p < 0.05 (a
    standard threshold; the legend gives none) in more than half of the cells. Peak firing is read
    from the spike density function (Gaussian kernel, Methods); a 50 ms binned histogram is a
    variant.
- id: ed5-pavlovian-dopamine-cue-responses
  statement: Dopamine cell responses to the Pavlovian cues followed the cues' reward probability,
    in line with RPE-like coding.
  source: Extended Data Fig. 5b,c; Results, VTA firing is unrelated to motivation, paragraph 3
  inferred: The Results say only that the Pavlovian responses are consistent with canonical
    RPE-like coding; the cue part is read from the Extended Data Fig. 5 legend, which plots and
    tests the cue response by tone. The figure was not seen.
  criterion: Peak firing rate in the 0.5 s after cue onset per trial, by tone, one-way ANOVA per
    session (Extended Data Fig. 5 legend). Reproduced when the mean over the 27 cells is ordered
    high > medium > zero-probability tone and the ANOVA has p < 0.05 in more than half of the cells.
- id: ed5a-pavlovian-behavior
  statement: Rats learned the cue probabilities; in an example session the rat entered the food
    port more during the 75% cue than the 25% and 0% cues.
  source: Extended Data Fig. 5a legend
  quote: This rat was more likely to go to the food port during the cue that was highly (75%)
    predictive of rewards compared to the other cues (25% and 0%; one-way ANOVA, F=11.1, p<1.2×10
    −6 ).
  statistics:
  - about: food-port head entry during 0.3 to 3 s after cue onset, across the three cues, one session
    test: one-way ANOVA
    statistic: F = 11.1
    p: 0.0000012
    p_relation: "<"
    n: trials of one example session
  criterion: Food-port head entry during 0.3-3 s after cue onset per trial (Extended Data Fig. 5
    legend), one-way ANOVA across tones. The example session is not identified; the reading is
    every Pavlovian session with 75/25/0% tones. The per-trial measure is open; readings are the
    fraction of the 0.3-3 s epoch spent at the food port and whether the rat was at the port at
