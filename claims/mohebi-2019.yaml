    VTA dopamine cell firing.
  source: Results, Tracking release on multiple timescales, paragraph 1; Extended Data Fig. 5d-f
  quote: We observed clear NAc dopamine responses to Pavlovian reward-predictive cues, similarly to
    VTA dopamine cell firing ( Extended Data Fig.5 ).
  expected:
    quantity: dLight Pavlovian sessions
    value: 10
    tolerance: 1
  criterion: Peak dLight signal within 1 s of cue onset, by tone (75, 25, 0%), one-way ANOVA per
    session (Extended Data Fig. 5 legend). Reproduced when the mean over sessions is ordered with
    tone probability and the ANOVA has p < 0.05 in more than half of the sessions.
- id: fig3cd-dlight-reward-rate-minutes
  statement: In 1 min bins, NAc dLight showed a clear relationship with reward rate, in
    cross-correlation and across block transitions.
  source: Results, Tracking release on multiple timescales, paragraph 2; Figure 3b-d
  quote: We again saw a clear relationship between NAc dopamine release and reward rate, in both
    cross-correlation and analysis of block transitions ( Fig.3c , d ).
  criterion: dLight dF/F averaged in 1 min bins; reward rate per bin. Cross-correlation per session
    and averaged, judged against a 1% shuffle bound (100,000 shuffles, as for microdialysis,
    Methods, Microdialysis, Analysis; that this method carries over is a reading). Block transitions
    are increasing or decreasing by the last 5 min of a block against the first 8 min of the next
    (Methods, Behavior, paragraph 3), binned into 3 min epochs after discarding the 1 min sample
    (here bin) that includes the transition time (Microdialysis Analysis). Reproduced when the zero-lag correlation is positive above the bound
    and dLight rises after increasing transitions and falls after decreasing ones.
- id: fig3fh-dlight-tracks-state-value
  statement: Moment-by-moment NAc dopamine correlated strongly with SMDP state value, and in every
    individual dLight session more strongly with value than with RPE or reward rate.
  source: Results, Tracking release on multiple timescales, paragraph 2; Figure 3f,h; Extended Data
    Fig. 6
  quote: In every individual dLight session dopamine showed a stronger correlation with values than
    either RPEs or reward rate ( Fig.3h and Extended Data Fig.6 ).
  expected:
    quantity: dLight sessions in which value correlation exceeds both RPE and reward-rate correlations
    value: 10
    tolerance: 0
  criterion: State value and RPE from the semi-Markov decision process model "exactly as previously
    described" in ref. 5 (Methods, Voltammetry and computational model), which was not supplied;
    the author takes the model from that paper. Correlations of the 50 Hz dF/F with value, RPE and
    reward rate per session, at the lag that maximizes each (Fig. 3g). Tolerance 0 because the
    paper says every session. Reproduced when all 10 sessions show value > RPE and value > reward
    rate.
- id: fig3g-dlight-lag
  statement: Correlations of dLight with state value and with RPE peaked at a lag of about 0.3 s.
  source: Results, Tracking release on multiple timescales, paragraph 2; Figure 3g
  quote: Correlations with both state values and RPE were maximal to the dLight signal ~0.3s s
    later
  depends_on:
  - fig3fh-dlight-tracks-state-value
  expected:
    quantity: lag of maximal correlation (dLight after model variable)
    value: 0.3
    tolerance: 0.03
    unit: s
  criterion: Cross-correlation of dF/F with value and RPE per session, lag at the maximum, averaged
    over sessions; both lags within tolerance of 0.3 s. At 50 Hz one sample is 0.02 s.
- id: fig4ac-dopamine-cue-responses
  statement: Light-On, the Go cue and rewarded Side-In (food hopper click) each evoked a rapid
    firing increase in dopamine cells, seen in the great majority of cells.
  source: Results, Dopamine firing does not explain release, paragraph 1; Figure 4a,c
  quote: External stimuli at Light-On, Go cue, and rewarded Side-In (food hopper click) each evoked
    a rapid firing increase ( Fig.4a ). These responses were observed in the great majority of
    dopamine cells ( Fig.4c )
  criterion: Per cell and event, the time-to-cue-response shuffle test (Methods, Analysis,
    paragraph 1); a cell responds when some bin in the post-cue window passes. "Great majority" is
    judged, as a standard choice, as at least 75% of the 27 cells for each of the three events
    (partially reproduced when more than half). The Results' count of 25 cells responding to
    Light-On (fig4e-light-on-alignment) is consistent with this.
- id: fig4bc-dlight-cue-responses
  statement: The NAc dLight signal also responded rapidly and reliably to Light-On, the Go cue and
    rewarded Side-In.
  source: Results, Dopamine firing does not explain release, paragraph 1; Figure 4b,c
  quote: The NAc dLight signal also responded rapidly and reliably to each of these salient cues (
    Fig.4b , c )
  criterion: Per session and event, dF/F after the event against the 250 ms before it, by the
    shuffle test of the Methods (its carrying over to dLight is a reading; the Fig. 4c legend was
    not read). Reproduced when at least 75% of the 10 sessions respond to each event.
- id: fig4a-no-dopamine-firing-ramp-before-approach
  statement: The VTA-l dopamine cell population did not increase firing as rats approached the
    start port (before Center-In) or the food port (before Food-Port-In), where NAc dopamine release
    increased.
  source: Results, Dopamine firing does not explain release, paragraph 2 and paragraph 3; Figure 4a,f
  quote: However, the VTA-l dopamine cell population did not show a corresponding increase in
    firing at these times ( Fig.4a
  criterion: Ramp angle per cell (Methods, Analysis, paragraph 3) from mean firing smoothed with a
    50 ms Gaussian kernel, the maximum and minimum in the 0.5 s before Center-In (long-latency
    trials, > 2 s, as in Fig. 4f) and before Food-Port-In, and the signed angle of the line joining
    them (positive when the later extremum is the higher). The axis scaling of the angle is open;
    the sign, which decides, does not depend on it. The test of Fig. 4f was not read; readings are
    a Wilcoxon signed-rank of the cells' angles against zero and a sign test, one-sided for an
    increase, p < 0.05. Reproduced when neither event shows a significant increase under the
    readings run.
- id: fig4ef-dlight-ramps-before-approach
  statement: NAc dLight increased before Center-In on long-latency trials in 10 of 10 sessions and
    before Food-Port-In in 9 of 10, distinct from cue-evoked release and without corresponding
    increases in dopamine firing.
  source: Results, Dopamine firing does not explain release, paragraph 3; Figure 4d-f
  quote: dLight signals consistently increased before Center-In on long-latency trials (10/10
    sessions), and also before Food-Port-In (9/10 sessions), without corresponding increases in
    dopamine firing ( Fig.4f ).
  depends_on:
  - fig4a-no-dopamine-firing-ramp-before-approach
  expected:
  - quantity: sessions with dLight increase before Center-In, long-latency trials
    value: 10
    tolerance: 1
  - quantity: sessions with dLight increase before Food-Port-In
    value: 9
    tolerance: 0.9
  criterion: Ramp angle per session (Methods, Photometry, last paragraph), maximum and minimum of
    dF/F in the 0.5 s before each event (Center-In on long-latency trials, > 2 s, as the Results
    say; Food-Port-In on all rewarded trials), positive when the later extremum is higher. A
    session counts when its angle is positive; the counts are compared with the expected values.
- id: fig4e-light-on-alignment
  statement: Dopamine cell firing increases were locked to Light-On, preferentially on short-latency
    trials; all 25 cells with significant increases after Light-On were better aligned to Light-On
    than to Center-In.
  source: Results, Dopamine firing does not explain release, paragraph 3; Figure 4d,e
  quote: Increases in dopamine cell firing were consistently locked to the cue onset at Light-On,
    preferentially for short-latency trials. All 25 dopamine cells with significant firing rate
    increases after Light-On were better aligned to Light-On than Center-In ( Fig.4e ).
  expected:
    quantity: dopamine cells with significant firing increase after Light-On
    value: 25
    tolerance: 2.5
  criterion: Significant increase after Light-On by the time-to-cue-response shuffle test (Methods,
    Analysis, paragraph 1). The measure of "better aligned" is in the unread Fig. 4e legend;
    readings (a) the peak of the trial-averaged spike density function is higher aligned on
    Light-On than on Center-In; (b) the trial-to-trial spread (SD) of the time of the first post-event
    response peak is smaller relative to Light-On than to Center-In. Reproduced when the count is
    within tolerance and every such cell is better aligned to Light-On under a reading. For
    "preferentially for short-latency trials", the Light-On response (peak in the 0.5 s after) on
    short (< 1 s) against long (> 2 s) latency trials, larger on short trials in most cells, with a
    Wilcoxon signed-rank across cells p < 0.05 (a standard choice).
- id: fig5a-early-trial-firing-not-reward-rate
  statement: During the early part of each trial dopamine cell firing did not depend on reward rate,
    though reward rate affected motivation.
  source: Results, Dopamine firing does not explain release, paragraph 4; Figure 5a,b
  quote: During the early part of each trial dopamine cell firing was not dependent on reward rate (
    Fig.5a ) - despite the influence of reward rate on motivation ( Fig.5b ).
  criterion: A claim of absence; the Fig. 5 legend that names the test and window was not read.
    Trials split into terciles of reward rate (Extended Data Fig. 8 legend), firing aligned to
    Light-On and Center-In. The window is open; readings are the 0.5 s after Light-On and the
    0.5 s before Center-In (the hold until the Go cue being too variable). Test readings are a
    per-cell Pearson correlation of trial firing rate with reward rate (as Extended Data Fig. 8),
    judged by the count of significant cells at p < 0.01 against chance, and a population
    Friedman test across terciles, p < 0.05. Reproduced when neither shows a dependence; give the
    effect either way.
- id: fig5a-positive-rpe-reward-cue
  statement: The phasic dopamine response to the reward cue at Side-In was reliably stronger when
    reward rate was lower, consistent with positive RPE coding, strongly and consistently across cells.
  source: Results, Dopamine firing does not explain release, paragraph 4; Figure 5a; Extended Data
    Fig. 8
  quote: Subsequently, the phasic response to the reward cue was reliably stronger when reward rate
    was lower ( Fig.5a ), consistent with positive RPE encoding.
  criterion: Peak firing per rewarded trial, the maximum Gaussian-smoothed rate in the 250 ms after
    Side-In (Methods, Analysis, paragraph 2), correlated per cell with reward rate (Extended Data
    Fig. 8 legend; Pearson as the reading, Spearman a variant), significant at p < 0.01 before
    correction and after it (the correction is not named; Bonferroni over the 29 cells is the
    reading). Reproduced when the population mean peak is highest in the lowest reward-rate tercile
    and lowest in the highest, the median correlation is negative (Wilcoxon signed-rank across
    cells, p < 0.05), and significant negative correlations outnumber positive ones. The set is the
    29 cells, as in the pause count; the 27 is a variant.
- id: fig5ab-weak-negative-rpe
  statement: When the reward cue was omitted dopamine cells paused, but encoding of negative RPEs
    was much weaker or absent, at the population level and in individual cells; negative RPE coding
    by pause duration was seen in only 2 of 29 neurons.
  source: Results, Dopamine firing does not explain release, paragraph 4; Figure 5a,b; Extended Data
    Fig. 8
  quote: When this reward cue was omitted dopamine cells paused firing, though encoding of negative
    RPEs was much weaker or absent... It has been proposed that negative RPEs are encoded in the
    duration of dopamine pauses 31 , but this was observed in just 2/29 individual neurons.
  depends_on:
  - fig5a-positive-rpe-reward-cue
  expected:
    quantity: neurons whose pause duration encodes negative RPE
    value: 2
    tolerance: 0.2
  criterion: On unrewarded trials, the valley (minimum smoothed firing) and the pause duration
    (maximum ISI) after Side-In, each correlated per cell with reward rate (Extended Data Fig. 8
    legend); negative RPE coding is a lower valley or a longer pause at higher reward rate. The
    valley window differs between sources; readings the Methods' 2 s window starting 1 s after
    Side-In and the Extended Data Fig. 8 legend's 2 s after Side-In. The pause window is 2 s after
    Side-In (legend). Whether the 2/29 count is of correlations significant before (p < 0.01) or
    after correction is open; both readings. Reproduced when the pause count matches under a
    reading and fewer cells have significant valley correlations in the negative-RPE direction
    than have significant peak correlations in fig5a-positive-rpe-reward-cue.
- id: ed8-other-reward-expectation-estimates
  statement: Similar dopamine firing results held when reward expectation was estimated by
    trial-based actor-critic or Q-learning models or by counting recent rewards.
  source: Results, Dopamine firing does not explain release, paragraph 4; Extended Data Fig. 8
  quote: Similar results were obtained if reward expectation was estimated in other ways, including
    trial-based reinforcement learning models (actor-critic, Q-learning) or simply counting recent
    rewards ( Extended Data Fig.8 ).
  depends_on:
  - fig5a-positive-rpe-reward-cue
  - fig5ab-weak-negative-rpe
  criterion: From Extended Data Fig. 8 legend. Reward expectation as the number of rewards in the
    previous 10 trials; the actor-critic V with V' = V + alpha (reward - V); the Q-learning sum
    Q_left + Q_right, updating only the chosen side; alpha per session by best fit to latencies
    (the fit measure is open; the reading is the most negative correlation with log latency, as for
    tau). The initial values are open; reading 0.5. The range of alpha searched is open; reading
    0.01 to 1 in steps of 0.01. Reproduced when, under each estimate, the
    criteria of fig5a-positive-rpe-reward-cue hold and negative RPE coding is weaker than positive
    as in fig5ab-weak-negative-rpe.
- id: fig5cd-dlight-positive-not-negative-rpe
  statement: NAc dLight at Side-In showed a transient encoding of positive but not negative RPEs,
    slightly delayed and prolonged compared to firing but subsecond.
  source: Results, Dopamine firing does not explain release, paragraph 5; Figure 5c,d
  quote: Dopamine release at Side-In also showed a clear, transient encoding of positive, but not
    negative, RPEs ( Fig.5c , d ). This dLight response was slightly delayed and prolonged compared
    to firing, consistent with time taken for release and reuptake 32 , but remained a subsecond
    phenomenon.
  criterion: dF/F after rewarded and unrewarded Side-In by reward-rate terciles. Windows and test
    are in the unread Fig. 5 legend; the reading is the peak in the 1 s after rewarded Side-In and
    the minimum in the 2 s after unrewarded Side-In, per-session correlation with reward rate,
    p < 0.05. Reproduced when the rewarded response is larger at lower reward rate in most sessions
    and the unrewarded dip does not deepen significantly with reward rate. For "slightly delayed
    and prolonged compared to firing, but subsecond" (no measure given), the reading is that the
    peak of the mean rewarded dLight response comes later than the peak of the mean dopamine cell
    response, and its full width at half maximum is longer than that of firing and below 1 s.
- id: fig5cd-dlight-early-trial-value
  statement: Unlike firing, dLight early in each trial was greater when recent trials had been
    rewarded, even while the rat held still in the center port awaiting the Go cue.
  source: Results, Dopamine firing does not explain release, paragraph 5; Figure 5c,d
  quote: Unlike firing, however, dLight signals early in each trial were greater when recent trials
    had been rewarded ( Fig.5c ), consistent with value coding. We observed this dependence on
    reward history even while the rat was not actively moving, but was maintaining a nosepoke in the
    center port waiting for the Go cue ( Fig.5d ).
  criterion: dF/F around Light-On and Center-In by reward-rate terciles, and during the hold from
    Center-In to the Go cue. Window and test are in the unread Fig. 5 legend; readings are the mean
    dF/F from Center-In to the Go cue and in the 0.5 s after Light-On, per-session correlation with
    reward rate, positive, with p < 0.05 in most sessions and a sign test across the 10 sessions.
- id: ed7-dlight-470-not-405
  statement: Rapid behaviour-linked dLight fluorescence changes occur with 470 nm excitation and not
    in the 405 nm control band.
  source: Extended Data Fig. 7 legend
  quote: Rapid, behavior-linked dLight fluorescence changes occur at 470nm, as expected, not in the
    control 405nm band.
  criterion: Event-aligned 470 nm and 405 nm signals separately (Methods, Photometry). Reproduced
    when the cue and approach responses of fig4bc-dlight-cue-responses are present at 470 nm and
    the same test finds none at 405 nm in most sessions.
- id: ed7-non-dopamine-movement-activity
  statement: Non-dopamine cell firing was more variable but on average showed activity during
    movements, starting just before Center-In regardless of latency, before Side-In and before
    Food-Port-In.
  source: Extended Data Fig. 7 legend
  quote: Non-dopamine cell firing is much more variable (wider error bands), but on average shows
    activity during movements... starting just before Center-In (irrespective of latency), just before
    Side-In , and just before Food-Port-In .
  criterion: Mean firing of the 38 non-dopamine cells aligned on Center-In (short and long latency
    trials), Side-In and Food-Port-In. Reproduced when the population rate in the 0.5 s before each
    event exceeds that in the 0.5 s before it (0.5 to 1 s before the event), by a Wilcoxon
    signed-rank across cells p < 0.05, for each event and both latency groups; the windows are a
    standard choice, the figure not being read.
