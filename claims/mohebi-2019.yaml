- id: fig2-tagged-dopamine-cells
  statement: Optogenetic tagging identified 27 well-isolated VTA-l cells with reliable
    short-latency light-evoked spikes as dopamine neurons, plus 2 retrogradely tagged cells from a
    rat with NAc core virus.
  source: Results, VTA firing is unrelated to motivation, paragraph 1 and paragraph 5; Methods,
    Electrophysiology, Classification
  quote: We found 27 well-isolated VTA-l cells with reliable short-latency spikes, and considered
    these identified dopamine neurons.
  expected:
  - quantity: tagged dopamine cells from VTA-l virus rats
    value: 27
    tolerance: 2.7
  - quantity: retrogradely tagged cells (rat IM-1078)
    value: 2
    tolerance: 0.2
  criterion: From Methods, Classification. A unit is light responsive when the stimulus-associated
    latency test (ref. 55) gives p < 0.001 for 5 ms and 10 ms pulse trains (the 10 ms condition
    only for cells tested with it, Supplementary Figure legend, panel d), and the light-evoked
    waveform (spikes within 10 ms of pulse onset) correlates with the session-wide average with
    Pearson r > 0.9. The test's own window and bin are not given by the paper; the reading is the
    test's published defaults (10 ms window, 1 ms bins, baseline before each pulse). Reproduced
    when both totals are within tolerance; the counts per rat are shown against the Methods'
    (IM657 1, IM1002 3, IM1003 15, IM1037 9, IM-1078 2).
