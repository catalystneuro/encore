- id: fig2efgh-tonic-firing-indifferent-to-reward-rate
  statement: Tonic dopamine cell firing in each block was indifferent to reward rate, with no
    significant change in the firing rate of any individual dopamine cell between higher- and
    lower-reward blocks.
  source: Results, VTA firing is unrelated to motivation, paragraph 4; Figure 2e-h
  quote: However, in the bandit task tonic dopamine cell firing in each block of trials was
    strikingly indifferent to reward rate ( Fig.2e , g ). There was no significant change in the
    firing rates of individual dopamine cells
  criterion: A claim of absence; the Fig. 2f legend that names the test was not read. Spikes in
    1 min bins (Methods, Analysis, paragraph 1); blocks split per session into high and low by the
    median of block-averaged reward rate (Methods, paragraph 3). Readings for the per-cell test
    (a) Wilcoxon rank-sum of the 1 min bin rates in high against low blocks; (b) rank-sum of the
    block-mean firing rates, high against low blocks; threshold p < 0.05 uncorrected (standard).
    Both readings are run. Reproduced under a reading when no cell shows a significant change, as
    the paper states; not reproduced otherwise. Report the count of significant cells with a
    binomial test against chance, each cell's difference in Hz, and a population Wilcoxon signed-rank test of
    high minus low across cells as a variant. The set is the 27 cells; the 29 with the retrograde
    cells is a variant.
- id: fig2fh-non-dopamine-no-tonic-change
  statement: No other VTA-l neurons changed firing rate between higher- and lower-reward blocks.
  source: Results, VTA firing is unrelated to motivation, paragraph 4; Figure 2f,h
  quote: There was no significant change in the firing rates of individual dopamine cells – or any
    other VTA-l neurons - between higher- and lower-reward blocks
  depends_on:
  - fig2efgh-tonic-firing-indifferent-to-reward-rate
  criterion: The test of fig2efgh-tonic-firing-indifferent-to-reward-rate applied to the 38
    non-dopamine cells (and to all other VTA-l units, as a second reading of "any other VTA-l
    neurons").
- id: fig2i-burst-rate-no-change
  statement: There was no overall change in the rate at which dopamine cells fired bursts between
    higher- and lower-reward blocks.
  source: Results, VTA firing is unrelated to motivation, paragraph 4; Figure 2i
  quote: There was also no overall change in the rate at which dopamine cells fire bursts of spikes
    ( Fig.2i ).
  criterion: A claim of absence. Bursts by the 80/160 ms template (Methods, Analysis, paragraph 1),
    burst rate per cell in high and in low blocks (median split, Methods). The population test is
    in the unread Fig. 2 legend; readings are a Wilcoxon signed-rank and a paired t-test across
    cells of high against low, p < 0.05. Reproduced when the test run does not find a difference;
    give the median difference either way.
- id: fig2i-no-inactive-states
  statement: Dopamine cells never switched between active and inactive states; the proportion of
    time spent inactive (long inter-spike intervals) was very low and did not change between
    higher- and lower-reward blocks.
  source: Results, VTA firing is unrelated to motivation, paragraph 4; Figure 2i
  quote: The proportion of time dopamine cells spent inactive (long inter-spike-intervals) was very
    low, and did not change between higher- and lower-reward blocks ( Fig.2i ).
  criterion: The ISI that counts as long is not given by the text read (it may be in the Fig. 2i
    legend); readings 0.5 s, 1 s and 2 s. Proportion of bandit-task time in ISIs longer than the
    threshold, per cell, in high and low blocks. "Very low" is judged, as a standard choice, as a
    median below 5% of time over cells. "Did not change" is a claim of absence; the test is open,
    readings a Wilcoxon signed-rank and a paired t-test across cells, p < 0.05. Reproduced when
    the median is low and the test finds no difference under the readings run, with the result of
    each reading shown.
