- id: fig5b-tone-categories
  statement: Deep-layer PFC ww tone responses cluster into eight categories ordered by peak delay;
    most units have flat or negative responses (category 8), categories 1 to 4 have sharp peaks
    with consistent onsets, and categories 5 to 7 have variable onsets and persistent responses.
  source: Figure 5b; Extended Data Fig. 8a to c; Results, Tone response maps do not align with
    cytoarchitecture, paragraph 1
  quote: Most units displayed flat or negative response traces (category 8). Units belonging to tone
    response categories 1–4 exhibited well-defined peaks and consistent response peak onsets. In
    contrast, units belonging to tone response categories 5–7 had variable peak onset latencies and
    persistent responses
  criterion: PSTHs from tone response epochs (−2 to 0.7 s, dropping licking, sleep-like and
    saturation epochs), 0.5-ms bins, Gaussian kernel sd 10 ms, z-scored to the prestimulus window,
    units below 0.1 Hz overall or prestimulus dropped, 0 to 0.65 s trace; PCA over nw and ww units
    pooled, 8 components; SOM of 400 nodes on ww units (code somsettings_carlenResp.yml), Ward into
    8 categories numbered by mean peak delay, the flat or negative category last (Methods). The
    units the SOM is trained on are open; readings (a) deep-layer ww units of all regions, n =
    15,352 (Results, Tone response maps, paragraph 1); (b) all ww units of all regions and layers,
    as the code's runCresp*_brain settings (layerlist all). The claim is judged on the PFC
    deep-layer ww units with tone responses, n = 7,184 (Fig. 5 legend), under both readings. The
    code drops units beyond 5 sd on any component; shown as a variant. Reproduced when the
    category whose mean trace has no positive peak is the largest, and the across-unit spread
    (IQR) of ZETA onset times of significant units is smaller in each of categories 1 to 4 than in
    each of 5 to 7; partially reproduced when only the first holds. ZETA as in fig5e.
