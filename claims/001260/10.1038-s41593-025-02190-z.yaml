# Claims for Le Merre, Heining et al. (2026), "A prefrontal cortex map based on single-neuron
# activity", Nature Neuroscience, doi:10.1038/s41593-025-02190-z, on dandiset 001260.
#
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-22,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read. The version of record (publisher HTML, open access, stored as
# paper/10.1038-s41593-025-02190-z.txt) in full: main text, figure legends, Methods, Data and
# Code availability, and the legends of Extended Data Figs. 1 to 9. No PDF was stored, so the
# figures themselves (values shown only in panels, such as correlation coefficients of Fig. 3
# and Fig. 4g) were not seen. Missing from the text read is the Supplementary Information file
# (Supplementary Methods, which describe the behavioral settings, Supplementary Figs. 1 and 2,
# and Supplementary Tables 1 to 7, which give the E-score p-values and the within-PFC
# hierarchy correlations of Supplementary Table 5), and the Source Data files. The main
# findings rest on the main and Extended Data figures, whose legends are in the text; the
# claims that cite a supplementary table say so. The bioRxiv preprint (10.1101/2024.11.06.622308
# v1, also under paper/) was read only to compare; it reports earlier unit counts (23,386 in the
# Results, 23,667 in the figure legends) and no IBL task analysis, and no claim is taken from it.
#
# Code read. https://github.com/hejDMC/pfcmap at commit 9ae52eddc47fbb590ef4e1b1949507334707a0f1
# (2025-04-30), named by the paper's Code availability and by the dandiset. It holds Python
# scripts for metric extraction, SOM training and clustering, enrichment (E-score) shuffling,
# flatmap tessellation, the Harris and Gao hierarchy correlations, tone responses, the IBL task
# tuning and the map comparisons, and Julia scripts for Fig. 1 (waveform histogram, mixed
# models). It runs on intermediate files from Zenodo record 14205018 (per-recording metrics
# files with unit quality flags and nw/ww labels, trained SOMs, flatmap polygons, the Harris
# hierarchy table hierarchy_summary_CreConf.xlsx, the Gao ROI hierarchy table
# ROI_Gao_hierarchy_index.csv, ZETA results). The paper also cites Zenodo
# doi:10.5281/zenodo.17559037 for the code; that archive was not read. The code that applies
# the unit quality criteria and the waveform thresholds and that runs the ZETA test is not in
# the repository.
#
# Data the paper used. Dataset KI. 66 adult C57BL/6J mice (27 male, 39 female, 3 to 6 months),
# head-fixed and awake, 99 acute Neuropixels 1.0 (phase 3B) recordings (up to 3 probes at a
# time), in distinct behavioral settings (passive listening and auditory tasks; the code's
# table config/datatables/allrecs_allprobes.xlsx lists Aversion 31, Passive 20, Detection 15,
# Attention 15, Context 14 and Opto 4 recordings). 10-kHz pure tones of 200 ms at random
# intervals of 5 to 10 s, through earphones. Measured: spike-sorted single units (Kilosort2 and
# manual curation), their mean waveforms (peak-to-trough duration), the CCFv3 location of each
# unit's peak channel (region, subregion, layer, and flatmap position), LFP, EMG from the
# reference electrode, licks (piezo or LFP artifact), tone onset times. After quality control
# 24,248 units: 19,186 wide-waveform (ww), 4,200 narrow-waveform (nw), 862 unclassified; 52%
# from 11 PFC subregions (MOs, ACAd, ACAv, PL, ILA, ORBm, ORBvl, ORBl, AId, AIv, FRP), the rest
# from other regions. Spontaneous epochs are the 3 s before each tone onset (about 227 per
# session); tone response epochs run from 2 s before to 0.7 s after onset. The paper deposits
# dataset KI in two dandisets, 000473 and 001260, and does not say which recordings each holds;
# 001260 is described on the archive as these recordings (the archive lists 74 files and 43
# subjects), so it may hold only part of dataset KI. The paper's analyses pool all 99.
#
# Data from outside dataset KI. (1) Dataset IBL, the International Brain Laboratory Brain Wide
# Map (https://registry.opendata.aws/ibl-brain-wide-map/, accessed February 2024; ref. 31,
# doi:10.1038/s41586-025-09235-0); for the task, 16,148 PFC deep-layer ww units from 66
# recordings in 29 mice; dataset IBL Passive is its subset of 303 recordings with a 5-min
# spontaneous block, cut into 99 epochs of 3 s. (2) Cortical hierarchy scores of Harris et al.
# 2019 (doi:10.1038/s41586-019-1716-z; the code reads column 'CC+TC+CT iterated' of
# hierarchy_summary_CreConf.xlsx on Zenodo 14205018). (3) The PFC flatmap, the 60 GaoROIs and
# the intra-PFC hierarchy scores of Gao et al. 2022 (doi:10.1038/s41593-022-01041-5), shared
# with the authors; the code reads them from Zenodo 14205018 (flatmap_PFCrois.h5,
# ROI_Gao_hierarchy_index.csv). The projection of 3D coordinates into the flatmap is Gao's code,
# shared privately; the code reads flatmap coordinates from the Zenodo metrics files.
#
# Method choices fixed here for every claim, from the Methods unless marked as from the code.
# Units are ww or nw by peak-to-trough duration (< 0.38 ms nw, > 0.43 ms ww, between them
# unclassified, Methods, Waveform classification). Spontaneous epochs are [tone onset - 3 s, tone
# onset], dropping epochs that overlap licking or spike-band saturation, and keeping only
# epochs at least 1 s from a sleep-like period (Methods, Epoch selection; the 1 s margin on both
# sides as in the code, extract_prepost_quietactive.py). Per epoch, log10FR is log10 of the spike
# count over 3 s; burstiness B = (sd - mean)/(sd + mean) of the ISIs and memory M the Pearson
# correlation of successive ISIs, both only in epochs with at least 6 spikes (Methods,
# equations 2 and 3); each metric is averaged over epochs, and units with fewer than 12 epochs of
# at least 6 spikes are dropped (Methods). The code averages log10FR over epochs with at least
# one spike (zero-spike epochs masked), which is followed. Deep layers are L5 and L6 (any layer
# label containing 5 or 6, code calc_statsdict.py); cortical units outside L5 and L6 are left out
# of region analyses, all units of non-cortical regions are kept (Results, Enrichment...,
# paragraph 1). Regions outside the PFC are grouped as the code's parent_dict in settings.py.
# The ww SOM has 400 nodes and the nw SOM 220 (code, somsettings_carlenSpont.yml), hexagonal,
# shape and initial prototypes from the PCA of the standardized features (Kohonen linear
# initialization, Methods), batch training for 200 iterations with a Gaussian neighborhood
# (Methods; code my_somz.py). Categories are clusters of the SOM prototype vectors by Ward
# linkage cut at 8 (ww) or 5 (nw) clusters (Methods; code settings.py nclust_dict), and a unit
# takes the category of its best matching node. E-scores are as in Methods equation 5, with
# 1,000 shuffles of the region and category labels within each group (Methods, Enrichment
# statistics). Significance of an E-score is P = 1 - max(f-, f+); the text gives no threshold;
# the code marks an E-score significant when the count lies above the 95th or below the 5th
# percentile of the shuffles, with no correction, and that is followed (P < 0.05). ROIs need at
# least 20 deep-layer units (Fig. 4f legend, fewer than 20 not analyzed; Extended Data Figs. 7i
# and 9d, n >= 20). The code's settings.py has Nmin_maps = 20 but most dataset KI scripts keep
# counts > 20 while the IBL scripts keep >= 20; the legends' >= 20 is followed, > 20 is a variant.
# For brain (sub)regions the text gives no minimum; the code's Nmin_maps is used. Random seeds of the SOM initialization, the shuffles and the
# constrained k-means are not set in the code; any seed is a standard choice, and results near a
# threshold should be shown for several seeds.
#
# Details open for several claims, each with the readings the paper allows.
# (G1) The groups for group control. Methods say regional and ROI enrichment and the
# spontaneous-tone mutual enrichment are controlled for behavioral settings, which the missing
# Supplementary Methods describe. The code groups by its 'task' label with Opto merged into
# Passive (five groups). Readings (a) the five code groups; (b) six settings, Opto apart.
# (G2) Which retrained category is which of the paper's 1 to 8 (ww) or 1 to 5 (nw). The text
# describes ww categories 1 to 3 as low-rate, regular-firing (1 the most regular), 4 to 6 as
# high-rate (4 high-rate Poissonian, 6 high-rate bursty), 7 and 8 as low-rate bursty (6 to 8
# bursty, low memory). The code orders Ward clusters by decreasing median memory of the node
# prototypes and then applies the fixed permutation [4,1,6,2,3,7,8,5] for 8 ww clusters and
# [1,2,4,5,3] for 5 nw clusters (relabel_clusters.py). Readings (a) the code's ordering; (b)
# matching each retrained cluster to the text's descriptions by its median log10FR, B and M.
# The notebook shows both and the median metrics of each category; a claim whose outcome
# differs between them is blocked as methods_underspecified. Projecting units onto the paper's
# own trained SOM from Zenodo 14205018 is an outside input and may be shown as a variant only.
# (G3) Unit quality. The Methods criteria (ISI violation ratio < 0.1, plausible waveform,
# presence ratio > 0, amplitude cutoff < 0.1) are applied in the paper through quality flags
# precomputed outside the repository. Readings (a) the dataset's own quality label or metrics,
# where it has them, under the Methods criteria; (b) all units the dataset holds. The unit counts
# under each are reported against 24,248.
schema_version: 2
dataset:
  archive: dandi
  id: "001260"
paper: doi:10.1038/s41593-025-02190-z
claims:
- id: dataset-ki-counts
  statement: Dataset KI holds 24,248 single units from 99 Neuropixels recordings in awake
    head-fixed mice, 52% of them in the PFC and 48% in other brain regions.
  source: Results, Capturing the diversity of spontaneous firing patterns, paragraph 1; Methods,
    Unit quality control
  quote: We recorded the firing activity of 24,248 single units from awake, head-fixed mice
    (dataset KI; Fig. 1a–c ). Overall, 52% of the units originated from the PFC and 48% from other
    brain regions
  expected:
  - quantity: single units after quality control
    value: 24248
    tolerance: 2425
  - quantity: fraction of units in the PFC subregions
    value: 52
    tolerance: 5.2
    unit: percent
  - quantity: recordings (probes)
    value: 99
    tolerance: 0
  - quantity: units in the PFC subregions (Extended Data Fig. 1b legend)
    value: 12674
    tolerance: 1267
  criterion: Units counted under both readings of G3. The PFC fraction is the share of units
    whose location is one of the 11 PFC subregions the Results list. The recording count has no
    tolerance, as it is a count of files the paper names; a dandiset holding only part of
    dataset KI is reported as such (the author finds what 001260 holds), and the expected
    values are then compared for the whole of dataset KI only if 000473 is used as well.
- id: fig1h-waveform-classes
  statement: Peak-to-trough durations are bimodal, splitting units into 19,186 ww units (81.1%)
    and 4,200 nw units (17.7%), with 862 intermediate units left unclassified.
  source: Figure 1h and legend; Results, Capturing the diversity of spontaneous firing patterns,
    paragraph 2
  quote: As expected, spike widths were bimodally distributed, allowing us to distinguish ww ( n =
    19,186; 81.1%) and nw ( n = 4,200; 17.7%) units (Fig. 1h )
  expected:
  - quantity: ww units
    value: 19186
    tolerance: 1919
  - quantity: nw units
    value: 4200
    tolerance: 420
  - quantity: unclassified units
    value: 862
    tolerance: 86
  - quantity: ww fraction
    value: 81.1
    tolerance: 8.1
    unit: percent
  - quantity: nw fraction
    value: 17.7
    tolerance: 1.8
    unit: percent
  criterion: Thresholds from the Methods (Waveform classification), < 0.38 ms nw and > 0.43 ms ww,
    on the peak-to-trough duration of each unit's mean waveform. The percentages do not follow
    from the counts given (19,186 of 24,248 is 79.1%); they match a total of 23,667 units, the
    preprint's count. Readings of the denominator are (a) all units, classified and unclassified
    (the legend's 24,248); (b) ww plus nw units only. The fractions hold if they match under
    either reading; the conflict between counts and percentages is recorded as a paper
    inconsistency. Bimodality is shown by the
    histogram (1-ms bins as in the legend are too coarse for a 0.4 ms valley; a finer bin is a
    plotting choice).
- id: fig1i-nw-higher-metrics
  statement: Narrow-waveform units have significantly higher firing rates, burstiness and memory
    than wide-waveform units.
  source: Figure 1i; Results, Capturing the diversity of spontaneous firing patterns, paragraph 2
  quote: indeed, nw units displayed significantly higher firing rates, along with higher burstiness
    and memory compared to ww units (Fig. 1i )
  criterion: For each metric (log10FR, B, M), a linear mixed-effect model Metric ~ 1 + Unittype +
    (1|Mouse) (Methods, equation 6), with the unit-type effect tested by a post hoc F test with
    Kenward-Roger degrees of freedom and Tukey's correction for multiple comparisons (Methods;
    Fig. 1i legend; code Fig1i__MixModel_Statistics.jl, emmeans
    pairwise contrast). The VoR text gives no p-value; the figure marks are not in the text.
    Reproduced when, for all three metrics, the nw estimate is higher than the ww estimate with p
    < 0.05; partially reproduced for one or two metrics. The code also drops units with log10FR <
    0.1 and pools active and other epoch states; shown as a variant.
- id: extfig1d-sleep-like-differ
  statement: Firing metrics in sleep-like epochs differ from those in active spontaneous epochs,
    which is why sleep-like epochs are excluded.
  source: Results, Capturing the diversity of spontaneous firing patterns, paragraph 1; Extended
    Data Fig. 1d,e
  quote: Epochs contaminated by ‘sleep-like’ periods 27 were excluded due to their fundamentally
    different, nonstationary firing characteristics
  criterion: Sleep-like periods detected as in Methods (Detection of sleep-like periods; mean
    cortical rate in 10-ms bins, Savitzky-Golay 11 points order 3, troughs below 0.2 of the
    geometric mean for longer than 5 ms, extended to the geometric mean, merged within 1.5 s,
    padded by 1 s or 0.3 s). Sleep-like epochs overlap such a period. Per unit, metrics computed
    over active epochs (all ww units with enough active epochs, n = 19,186) and over sleep-like
    epochs (ww units with at least 12 sleep-like epochs of at least 6 spikes, n = 11,599), as the
    Extended Data Fig. 1 legend gives the two samples. A mixed model Metric ~ 1 + EpochType +
    (1|Mouse) (Methods, equation 7) per metric and unit type, post hoc F test with Kenward-Roger
    degrees of freedom and Tukey's correction (Methods). The legend's per-metric marks and any
    direction are in the figure only, so the count of metrics required is this file's rule.
    Reproduced when the epoch-type effect has p < 0.05 for all three metrics in ww units;
    partially reproduced for one or two; the direction of each is reported.
- id: extfig1-epoch-counts
  statement: Sleep-like episodes occupy a median 6% (IQR 0 to 18%) of recording time; sessions hold
    a median 227 (IQR 172 to 284) spontaneous active epochs and 19 (IQR 1 to 84) sleep-like
    epochs.
  source: Methods, Detection of sleep-like periods and Epoch selection; Extended Data Fig. 1 legend,
    Data (unit count)
  quote: Sleep-like episodes occupied 6% (IQR, 0–18%) of the time in recording sessions ...
    Recording sessions contained 227 (IQR, 172–284) spontaneous active epochs and 19 (IQR, 1–84)
    sleep-like epochs
  expected:
  - quantity: median fraction of session time in sleep-like episodes
    value: 6
    tolerance: 0.6
    unit: percent
  - quantity: median spontaneous active epochs per session
    value: 227
    tolerance: 22.7
  - quantity: median sleep-like epochs per session
    value: 19
    tolerance: 1.9
  - quantity: ww units with enough sleep-like epochs (Extended Data Fig. 1 legend)
    value: 11599
    tolerance: 1160
  criterion: Sleep-like detection and epoch rules as in extfig1d-sleep-like-differ. Whether a
    "recording session" is one probe recording (99) or one session of up to 3 probes is open;
    both readings are shown, and the values hold under either.
- id: extfig1f-burstiness-memory-uncorrelated
  statement: Across ww units, a linear correlation does not reveal a dependence between burstiness
    and memory.
  source: Results, Brain regions have distinct firing repertoires, paragraph 1; Extended Data Fig.
    1f,g
  quote: Note that linear correlation did not reveal this empirical dependence between burstiness
    and memory (Extended Data Fig. 1f,g )
  criterion: A claim of absence. The paper's test is a mixed model Metric1 ~ 1 + Metric2 +
    (1|Mouse) (Methods, equation 8) across all ww units, reported as the marginal R2 and marked
    n.s. in the legend. Reproduced when the fixed effect of memory on burstiness is not
    significant at p < 0.05; not reproduced when it is. The marginal R2 and the effect size are
    given either way, with burstiness on memory as a variant.
- id: fig2a-som-memory-burstiness
  statement: On the ww SOM, burstiness and firing rate vary along perpendicular gradients, while
    high memory occurs only with medium to low burstiness, so high memory and high burstiness are
    mutually exclusive.
  source: Figure 2a; Results, Brain regions have distinct firing repertoires, paragraph 1
  quote: The SOM displayed perpendicular gradients of burstiness and firing rate, showing that these
    two metrics vary independently of each other. In contrast, high memory patches coincided with
    medium to low burstiness, indicating that high memory and high burstiness are mutually
    exclusive
  criterion: The paper shows this in the component planes and gives no measure. Across the nodes
    of the ww SOM trained as in the header, using the de-standardized prototype values. Part 1
    (perpendicular gradients) is judged by the angle between the directions of steepest
    increase of B and of log10FR over the node grid, from a linear fit of each prototype value on
    the node coordinates; reproduced when the angle is between 60 and 120 degrees. Part 2 is
    judged by the nodes with the highest memory, read as (a) the top 10% of nodes or (b) the top
    25%; reproduced when, under both, none of these nodes lies in the top quartile of node
    burstiness. The angle bounds and the quantiles are this file's, as the paper gives none, and
    are recorded as a deviation; the claim is reproduced only when both parts hold under both readings, and blocked as
    methods_underspecified when the readings disagree.
- id: fig2b-pfc-regular-territory
  statement: PFC ww units are widely spread on the SOM, with many matching regular-firing (low
    burstiness) nodes and few in anti-memory territory, while units from other regions populate
    different territories.
  source: Figure 2b; Extended Data Fig. 2e; Results, Brain regions have distinct firing
    repertoires, paragraph 2
  quote: Overall, PFC units were widely distributed on the SOM, with many units matching best to
    regular firing (that is, low burstiness) and avoiding anti-memory territories (Fig. 2b ),
    while units from other brain regions populated different territories
  expected:
  - quantity: share of the ww SOM training units that are PFC units
    value: 54
    tolerance: 5.4
    unit: percent
  criterion: The paper shows this as SOM hit maps and gives no measure or test, so the comparison
    below is a reading of this file, not the paper's, and is recorded as a deviation. Compared
    with all non-PFC ww units, reproduced when PFC ww units have a lower median burstiness and a
    smaller fraction of units with negative memory (M < 0, "anti-memory" as in Fig. 1e), each by a
    two-sided Mann-Whitney test (burstiness) or a chi-square test (fraction) at p < 0.05. The 54%
    is the share of PFC units among the ww units the SOM is trained on (all regions and layers).
- id: fig2e-category-stability
  statement: About 57% of ww units keep their category from one block of about 50 spontaneous
    epochs to the next, far above the 18% expected by chance from the marginal distributions.
  source: Figure 2e; Results, Stable classification of single-unit firing patterns, paragraph 1
  quote: Consistently, around 57% of units remained in the category they had in the previous block,
    which is considerably above the 18% expected from chance (marginal distributions; Fig. 2e )
  expected:
  - quantity: fraction of ww units retaining their category from block to block
    value: 57
    tolerance: 5.7
    unit: percent
  - quantity: chance stability from the marginal distributions
    value: 18
    tolerance: 1.8
    unit: percent
  depends_on:
  - fig2a-som-memory-burstiness
  criterion: Blocks as in Methods (Stability analyses), the recording's own blocks of 50 or 100
    epochs (100 split in two) where the setting has them, else blocks of about 50 epochs; blocks
    with fewer than 12 epochs of at least 6 spikes dropped for that unit (Methods; the code uses
    at least 3 valid epochs per block and 5 per transition, shown as a variant). Block metrics
    standardized to the full-data ww SOM and assigned their best matching node's category.
    Stability per transition t is the trace of the summed transition matrix M_t over its total,
    and chance is the same for the matrix expected from the marginals of M_t (Methods,
    Assessment of overall stability per transition; Fig. 2e plots it per transition). The
    paper does not say how "around 57%" summarizes the transitions; readings (a) the mean over
    transitions, (b) the pooled matrix summed over transitions. Both are shown with the
    per-transition values, and the value holds under either. The dataset may not mark the recordings' inherent block structure; if it does not,
    blocks of about 50 consecutive epochs are used and this is a deviation.
- id: fig2f-low-rate-less-stable
  statement: Block-wise category assignment is less stable for low-rate categories (1 to 3, 7 and
    8) than for high-rate categories, and low-rate regular categories 1 to 3 mostly transition
    among themselves, as do the low-rate bursty categories 7 and 8.
  source: Figure 2f; Extended Data Fig. 3d; Results, Stable classification of single-unit firing
    patterns, paragraph 1
  quote: Indeed, the block-wise assignment of categories to units was substantially less stable for
    low-rate categories (1–3, 7 and 8) compared to high-rate categories (Fig. 2f and Extended Data
    Fig. 3d ) ... low-rate, regular-firing categories (1–3) mostly transitioned among themselves, as
    did the low-rate, bursty categories (7 and 8)
  depends_on:
  - fig2e-category-stability
  criterion: From the summed transition count matrix of fig2e-category-stability, the transition
    probability matrix P (rows sum to 1, Methods). Part 1, the stability of a category read as its
    diagonal entry of P; reproduced when the mean diagonal of categories 1 to 3, 7 and 8 is lower
    than the mean diagonal of 4 to 6, with the diagonal of the coincidence coefficient matrix X
    (Methods, equation 4) shown as a second reading that must agree. Part 2, for each category in
    1 to 3, the summed probability of moving to the other two categories of 1 to 3 exceeds that of
    moving to any other single category outside the group, and likewise for 7 and 8. Reproduced
    when both parts hold; partially reproduced when one does.
- id: extfig3f-layer-enrichment
  statement: Superficial cortical layers (L2/3) are enriched in bursty ww units, while deep layers
    (L5 to 6) are enriched in regular-firing ww units.
  source: Extended Data Fig. 3f,g; Results, Enrichment of low-rate, regular-firing units in the
    PFC, paragraph 1
  quote: E-score analysis of ww unit activity revealed substantial enrichment in bursty units in the
    superficial cortical layers (L2/3), while deep cortical layers (L5–6) were enriched in
    regular-firing units
  criterion: E-scores of cortical layer against ww category, all cortical ww units, with each
    combination of region and behavioral setting as a group (Methods, Group-bias control), 1,000
    shuffles. Supplementary Tables 1 and 2 (the p-values) were not read. Reproduced when L2/3 has
    a significant positive E-score for at least one of the bursty categories 6 to 8, and L5 and
    L6 each have a significant positive E-score for at least one of
    categories 1 to 3. Layers as labeled in the dataset (L6a and L6b counted as L6). Under G1 and
    G2.
- id: fig2g-pfc-regular-enrichment
  statement: Most PFC subregions (ILA, PL, ACAd, ACAv, ORBm and ORBvl) are enriched in low-rate,
    regular-firing ww units (categories 1 to 3).
  source: Figure 2g; Results, Enrichment of low-rate, regular-firing units in the PFC, paragraph 2
  quote: The majority of the cytoarchitectural PFC subregions, that is, ILA, PL, ACAd, ACAv, ORBm and
    ORBvl, were generally enriched in low-rate, regular-firing units (categories 1–3)
  criterion: E-scores of brain (sub)region against ww category, deep-layer units for cortical
    regions and all units elsewhere, against all such units (the code's refall), grouped by
    behavioral setting (Methods), 1,000 shuffles, regions with more than 20 units. "Generally
    enriched" is read as (a) a positive sum of the E-scores of categories 1 to 3, or (b) a
    significant positive E-score in at least one of categories 1 to 3. Reproduced when all six
    subregions meet the reading, under both readings; partially reproduced when at least four
    do under both. Under G1 and G2; readings that disagree block the claim as
    methods_underspecified.
- id: fig2g-ila-pl-category1
  statement: ILA and PL are both strongly and significantly enriched in the most regular-firing
    category 1.
  source: Figure 2g; Supplementary Table 3 (not read); Results, Enrichment of low-rate,
    regular-firing units in the PFC, paragraph 2
  quote: Interestingly, ILA and PL were both heavily and significantly enriched in units of the most
    regular-firing category 1 (Supplementary Table 3 )
  depends_on:
  - fig2g-pfc-regular-enrichment
  criterion: The E-scores of fig2g-pfc-regular-enrichment. Reproduced when the category 1 E-score
    is positive and significant (P < 0.05) for both ILA and PL; partially reproduced for one.
- id: fig2g-bursty-orbl-mos-aiv
  statement: ORBl, MOs and AIv are significantly enriched in bursty category 8 units, setting them
    apart from the activity-defined prefrontal entity.
  source: Figure 2g,h; Results, Enrichment of low-rate, regular-firing units in the PFC, paragraph 2
  quote: The ORBl, MOs and AIv, in contrast, were significantly enriched in bursty category 8 units
  depends_on:
  - fig2g-pfc-regular-enrichment
  criterion: The E-scores of fig2g-pfc-regular-enrichment. Reproduced when the category 8 E-score is
    positive and significant for all three; partially reproduced for one or two.
- id: fig2g-th-hpf-bursty
  statement: Thalamus and hippocampal formation are strongly and significantly enriched in bursty
    units (categories 6 to 8), unlike the PFC.
  source: Figure 2g; Results, Enrichment of low-rate, regular-firing units in the PFC, paragraph 2
  quote: Other brain regions like thalamus (TH) and hippocampal formation (HPF) were heavily and
    significantly enriched in bursty units (categories 6–8)
  depends_on:
  - fig2g-pfc-regular-enrichment
  criterion: The E-scores of fig2g-pfc-regular-enrichment, with TH and HPF as the code's parent
    groups. Readings (a) a significant positive E-score in each of categories 6, 7 and 8; (b) in
    at least one of them. Reproduced when both TH and HPF meet the reading under both readings;
    when they differ, the claim is blocked as methods_underspecified with both shown.
- id: fig2i-ibl-replication
  statement: Regional enrichment profiles of dataset KI are highly similar to those of dataset IBL
    Passive; for category 1, enrichment across 14 cortical (sub)regions correlates between the two
    datasets.
  source: Figure 2i; Extended Data Fig. 4; Results, Enrichment of low-rate, regular-firing units in
    the PFC, paragraph 3
  quote: Repeating the analyses with spontaneous activity obtained from the International Brain
