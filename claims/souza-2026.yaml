    six coordinates; the number of permutations is not given and 1,000 is used (a standard choice;
    p < 0.001 needs at least 1,000). Reproduced when eta squared is within tolerance and no shuffle
    reaches it; partially reproduced when eta squared is below 0.01 and p < 0.001 but outside
