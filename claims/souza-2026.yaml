    tolerance: 8.9
    unit: percent
  - quantity: anticipatory fraction, VISl
    value: 77
    tolerance: 7.7
    unit: percent
  criterion: The text classifies a unit by "the sign of its pre- vs. post-reward ramp" and gives no
    windows. Readings, on the standardized profiles of fig3a-archetypes. (a) Mean response over -0.5
    to 0 s greater than over 0 to +1.5 s; (b) mean over -0.5 to 0 s greater than over 0 to +0.5 s; (c)
    the NMF weight on the anticipatory archetypes (A1 to A3) greater than on the others. Reproduced
    when, under one reading, VISp and VISl are within tolerance and VISrl, VISal, VISpm and VISam lie
