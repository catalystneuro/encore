    tolerance: 0.272
  - quantity: percent of units with a weight at least 0.9
    value: 1.0
    tolerance: 0.1
    unit: percent
  - quantity: variance explained, NMF mixture
    value: 0.72
    tolerance: 0.072
  - quantity: variance explained, hard assignment
    value: 0.36
    tolerance: 0.036
  criterion: Effective number = exp of the entropy of the unit's normalized NMF weights (Materials and
    methods 2.7). Open details. (1) Weight normalization is (a) the unit's W row divided by its sum;
    (b) the same after scaling each archetype by the norm of its H row. (2) Variance explained is in
    the signed space, 1 minus residual over total sum of squares. (3) The hard assignment is a
    full-covariance Gaussian mixture after PCA; the numbers of components are not given, and the
    reading is six PCs and six mixture components (rank matched), with each unit reconstructed (a) by
    its cluster's mean profile; (b) by that mean scaled by least squares. Reproduced when, under one
    reading, the four values are within tolerance; partially reproduced when the mixture explains at
    least 1.5 times the variance of the hard assignment and the median effective number exceeds 2.
- id: fig3c-area-overlap
  statement: The six areas' distributions in the archetype simplex overlap almost entirely; the
    between-area variance is small (eta squared 0.004) though above a label-shuffle null (p < 0.001).
  source: Results 3.4, paragraph 2; Figure 3C
  quote: the per-area distributions overlapped almost entirely ... the between-area variance of the
    simplex positions was small (η2 = 0.004), though reliably above a null obtained by shuffling the
