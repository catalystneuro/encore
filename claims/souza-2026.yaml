- id: fig3d-anticipatory-gradient
  statement: The fraction of cohort units with an anticipatory profile is highest in VISp (89%) and VISl
    (77%) and lower and similar across the four higher-order areas (66 to 69%).
  source: Results 3.4, paragraph 3; Figure 3D
  quote: the fraction of units with an anticipatory profile was highest in primary visual cortex
    (VISp, 89%) and in VISl (77%), and lower and similar across the four higher-order areas (66-69%)
  depends_on:
