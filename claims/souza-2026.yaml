- id: anticipatory-direction-overlap
  statement: The anticipatory label largely re-expresses the suppression label; they agree for 80.7% of
    the cohort (phi = 0.56), 91.5% of suppressed against 39.9% of enhanced units carry an anticipatory
    ramp, and standardizing areas to the overall direction composition leaves 31% of the VISp to VISam
    gradient (+0.07 of +0.23).
  source: Results 3.4, paragraph 3
  quote: the two unit-level labels agreed for 80.7% of the cohort (φ = 0.56) ... 91.5% of suppressed
    units carried an anticipatory ramp, against 39.9% of enhanced units. Standardizing every area to
    the overall direction composition leaves 31% of the VISp-to-VISam amplitude of the
    anticipatory-fraction gradient (+0.07 of +0.23)
  depends_on:
