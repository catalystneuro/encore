- id: hits-vs-false-alarms
  statement: In the underpowered hits against false alarms contrast (486 false alarms in 102 sessions,
    a median of 4 per session against 160 hits), 14.6% (VISp) to 22.2% (VISpm) of cohort units differ
    after FDR correction, with a median SI of -0.56 in VISp, deeper suppression when the lick is
    rewarded.
  source: Discussion, paragraph 6
  quote: Only 486 false alarms were available in the 102 sessions covered by this family, a median of
    four per session against a median of 160 hits ... Even so, between 14.6% (VISp) and 22.2% (VISpm)
    of cohort units differed between the two conditions after false-discovery-rate correction, with a
    median specificity index of -0.56 in VISp
  depends_on:
  - fig1e-cohort-size
  expected:
  - quantity: false alarm trials
    value: 486
    tolerance: 49
  - quantity: sessions covered by the hits against false alarms family
    value: 102
    tolerance: 10
  - quantity: median false alarms per session
    value: 4
    tolerance: 0.4
  - quantity: median hits per session
    value: 160
    tolerance: 16
  - quantity: median SI, VISp
    value: -0.56
    tolerance: 0.056
  criterion: Amplitudes, Mann-Whitney test, BH per area and SI as in Families A and B (Materials and
    methods 2.4), on cohort units. The alignment of false alarm trials is not given; the readings are
    (a) hits aligned to reward and false alarms to the first lick after the catch change, as the
    contrast is "licking with water against licking without it"; (b) false alarms at the session median
    change-to-reward latency after the catch change. Whether the responsiveness filter applies is
    open; with and without are run. Reproduced when, under one reading, the counts and VISp median SI
    are within tolerance and the per-area fractions lie in 14.6 to 22.2% widened by 10% of each bound,
    with VISp lowest and VISpm highest not required. The power figures (probability of superiority
    0.91; 26 sessions where no effect could reach it) are reported, not judged.
- id: hits-vs-lick-bouts
  statement: Against the onsets of unrewarded lick bouts (a median of 415 per session), 74.9% (VISp) to
    88.8% (VISrl) of cohort units differ from the hit lick after correction, with deeper suppression on
    rewarded licks in VISp (median SI -0.50).
  source: Discussion, paragraph 7
  quote: Unrewarded lick bouts occur about a hundred times more often than false alarms (median 415 per
    session), and comparing the lick of a hit against the onset of an unrewarded bout, 74.9% (VISp) to
    88.8% (VISrl) of cohort units differed after correction, again with deeper suppression on rewarded
    licks in VISp (median specificity index -0.50)
  depends_on:
  - fig1e-cohort-size
  expected:
  - quantity: median unrewarded lick bouts per session
    value: 415
    tolerance: 41.5
  - quantity: percent of cohort differing, VISp
    value: 74.9
    tolerance: 7.49
    unit: percent
  - quantity: percent of cohort differing, VISrl
    value: 88.8
    tolerance: 8.88
    unit: percent
  - quantity: median SI, VISp
    value: -0.50
    tolerance: 0.05
  criterion: The paper does not define a lick bout, nor the baseline for a bout onset that has no image
    change. Bouts are taken from the dandiset's lick times with an inter-lick gap threshold as a stated
    assumption; 250 ms and 500 ms are run. A bout is unrewarded when no reward falls within it. The
    baseline is (a) the 0.5 s before the lick event; (b) for hits, the 0.5 s before the image change,
    as in Families A and B, and for bouts the 0.5 s before onset. Response window 0 to 0.75 s after
    the hit's first lick and after the bout onset; Mann-Whitney, BH per area, SI as Materials and
    methods 2.4. Reproduced when, under one combination of readings, the values are within tolerance
    and every area lies in 74.9 to 88.8% widened by 10% of each bound (67.4 to 97.7%).
