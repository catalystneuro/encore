# Claims for Souza, Vieira, Ventura, de Lima, Arcanjo, de Paula, Sales, Souza, Alvarez-Jacobo,
# Fontenele, Aguiar, de Santana, Sousa & de Vasconcelos (2026), "Reward coding across mouse visual
# cortical areas", Front. Behav. Neurosci. 20:1944695, doi:10.3389/fnbeh.2026.1944695, on dandiset
# 000713 (Allen Institute, Visual Behavior Neuropixels), which the paper reuses.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-21,
# protocol as stated in docs/protocol.md (pilot-18).
#
# Text read. The version of record (Brief Research Report, published 28 October 2026), in
# paper/10.3389-fnbeh.2026.1944695.txt: abstract, Introduction, Materials and methods 2.1 to 2.8,
# Results 3.1 to 3.4, Discussion, the legends of Figures 1 to 3, and the legend of Supplementary
# Figure S1. There is no PDF under paper/, so no figure was opened and no number below is read from a
# figure. The display equations are garbled in the text but readable: (1) r_split =
# corr(PSTH_odd, PSTH_even); (2) p_split = (1 + sum over b of 1[r_null(b) >= r_split]) / (N_perm + 1);
# (3) SI = (A1 - A2) / (|A1| + |A2|); (4) M = (r_post - r_pre) / (r_post + r_pre); (5) n(t) = summed
# spike count of the group in [t, t + T), T = 50 ms; (6) CV_i = SD(n) / E(n) over the 50 ms bins of
# 10 s window i. The supplement is one figure (Supplementary Figure S1, rank selection for the NMF,
# ranks 2 to 8); its image is not under paper/, only its legend. The rank-6 choice is the only result
# that rests on it, and no claim below is about rank selection.
#
# Code. The Data availability statement says "The analysis code is available from the corresponding
# authors upon reasonable request." No repository is linked, so no code was read. Every method below
# comes from the text; details the text leaves open are named as open in the criterion, with the
# readings the text allows. Section 2.8 says the analyses used Python 3.11 with numpy, scipy, pandas
# and scikit-learn, and fixed seeds "defined in the production scripts" (not available).
#
# Data the paper describes (Materials and methods 2.1). 103 sessions of the Allen Visual Behavior
# Neuropixels dataset, dandiset 000713 version 0.240702.1725, from 54 head-fixed trained adult mice
# recorded with Neuropixels 1.0 probes in a visual change-detection task. The paper does not say how
# the 103 sessions were chosen. Units from six visual areas, VISp, VISl, VISal, VISpm, VISam and
# VISrl, 54,039 units in all; no unit quality filter is named. Two of six stimulus blocks are used,
# the active behavior block (block 0; task, licking, reward) and the passive replay block (block 5;
# same natural-image sequence, no task, no reward). Images shown for 250 ms with a 500 ms gray
# interval. Change trials scored hit (lick in the response window, 150 to 750 ms after the change,
# followed by water) or miss; catch trials scored false alarm or correct rejection. Only
# performance-contingent rewards are used; automatic priming rewards are excluded. Measured
# variables used: spike times, unit area labels, mean spike waveforms (trough-to-peak duration,
# half-width), unit CCF coordinates, reward, lick and image-change times, trial outcomes.
#
# Outside data. Cortical layers come from the Allen Mouse Brain Common Coordinate Framework (CCFv3,
# Wang et al., 2020) 25 um annotation volume, queried at each unit's CCF coordinates (Materials and
# methods 2.5). The layer claims are therefore data with_inputs; the paper does not give a version or
# file of the annotation volume.
#
# The cohort pipeline (Materials and methods 2.2 to 2.4), which most claims use. (i) Reward-aligned
# PSTH of the active block, -0.5 to +2.0 s around each performance reward in 10 ms bins, rate =
# counts / (events x bin width), smoothed with a normalised Gaussian kernel of sigma 25 ms; events
# kept only when the whole window lies in the active block. (ii) Split-half reliability r_split, the
# Pearson correlation across bins of the PSTHs of the odd and even rewards in chronological order.
# (iii) ISI-shuffle null, 1,000 permutations, one-sided p_split as in equation (2); p values pooled
# across sessions and Benjamini-Hochberg corrected within each area at q = 0.05. (iv) Per trial
# amplitude = mean rate 0 to 0.75 s after the response event minus mean rate in the 0.5 s before the
# trial's image change. Family A, hit trials (aligned to reward) against passive replay (pseudo-reward
# after each replayed image change at the session's median change-to-reward latency); Family B, hit
# trials against miss trials (pseudo-reward time after the miss trial's image change). Two-sided
# Mann-Whitney U per unit and family, among units responsive in at least one of the two conditions
# (two-sided Wilcoxon signed-rank of per-trial amplitude against zero, p < 0.05), BH at q = 0.05 per
# area and family. (v) Cohort = split-half positive, significant in both families, and SI of the same
# sign in both; negative = reward-suppressed, positive = reward-enhanced. The text implies A1 is the
# rewarded condition (hit) and A2 the control, since a negative SI is labeled suppressed.
