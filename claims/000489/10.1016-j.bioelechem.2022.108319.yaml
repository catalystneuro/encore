    fields from 12 to 15 kV/cm, and lower than the ratio at every other repetition rate.
- id: fig7-charging-time-constant
  statement: Fitting the cathodic pole response to the first unipolar pulse gave a charging time
    constant of 200 ns and a maximum polarization of 31% emission change (425 points, r = 0.93,
    p < 0.0001), and the discharge after it a time constant of 520 ns from 31.5% (425 points,
    r = 0.85, p < 0.0001).
  source: Results 3.5, paragraph 2; Figure 7 (dotted lines, top panel)
  quote: The best fit for membrane charging with an exponential function (using the first pulse
    in the unipolar pulse train) yielded the time constant of 200 ns and the maximum membrane
    polarization at 31% emission change (425 datapoints, correlation coefficient 0.93,
    p<0.0001). The best fit for the discharging portion of the curve yielded the same initial
    polarization (31.5% emission change) but, unexpectedly, a 2.5 times larger time constant of
    520 ns
  statistics:
  - about: charging fit
    test: exponential fit, correlation coefficient
    statistic: r = 0.93
    p: 0.0001
    p_relation: "<"
    n: 425 datapoints
  - about: discharging fit
    test: exponential fit, correlation coefficient
    statistic: r = 0.85
    p: 0.0001
    p_relation: "<"
    n: 425 datapoints
  expected:
  - quantity: charging time constant
    value: 200
    tolerance: 20
    unit: ns
  - quantity: maximum polarization, charging fit
    value: 31
    tolerance: 3.1
    unit: "% emission change"
  - quantity: discharging time constant
    value: 520
    tolerance: 52
    unit: ns
  - quantity: initial polarization, discharging fit
    value: 31.5
    tolerance: 3.15
    unit: "% emission change"
  criterion: FluoVolt emission at the cathode-facing pole of the 18 cells given unipolar pulses,
    scaled to whole-cell emission, the two trials of each cell averaged, as percent difference
    from the mean of the 40 points before the pulse (Methods 2.6). A single exponential
    (Fig. 7 legend) is fitted to the first pulse (0 to 600 ns, charging, A(1 - exp(-t/tau)))
    and to the interval from its end to the next pulse (600 to 1200 ns at 833 kHz, discharge,
    A exp(-t/tau)). The 425 datapoints are about 18 cells times 24 time steps of 25 ns, so the
    readings are (a) per-cell points pooled (the reading the count supports) and (b) the
    trace averaged over cells. Reproduced when all four values are within tolerance under one
    reading and both correlations have p < 0.0001.
- id: fig7-bipolar-overshoot
  statement: Bipolar pulses caused the same initial polarization as unipolar ones during the
    first phase, followed by a faster discharge and an overshoot into the opposite polarity.
  source: Results 3.5, paragraph 1; Figure 7
  quote: Bipolar nsEP caused the same initial polarization during the first phase of the pulse,
    followed by a faster discharge and an overshoot into the opposite polarity.
  criterion: Cathodic pole traces as in fig7-charging-time-constant, for the 17 bipolar and 18
    unipolar cells. Reproduced when (i) at the end of the first phase (600 ns) the bipolar
    and unipolar cell values do not differ by the paper's two-sided Student's t-test at p <
    0.05 (Methods 2.5; unpaired, as they are different cells), a claim of absence judged on
    that test, with the paper's error bar gap rule (Methods 2.5) shown as a variant; (ii)
    after the first phase the bipolar trace returns to the resting level sooner than the
    unipolar trace; and (iii) during the second phase (600 to 1200 ns) the bipolar mean goes
    below the resting level, its minimum differing from zero by a two-sided one-sample t-test
    across cells at p < 0.05 (the Methods 2.5 test and threshold applied to this point, a
    reading of the file, as the paper reports no test here).
- id: fig7-summation-without-buildup
  statement: With 600 ns unipolar pulses at 833 kHz, each pulse charged the membrane to the same
    peak, with no stepwise build-up; the pulses merged into a continuous sawtooth polarization.
  source: Results 3.5, paragraph 3; Figure 7
  quote: Although charging by the subsequent pulses in unipolar pulse trains started with the
    partially charged membrane, it reached the same peak potential. A stepwise build-up of the
    peak membrane potential ... did not occur in our experiments with 833-kHz, 600-ns unipolar
    pulses.
  criterion: Cathodic pole traces of the unipolar cells as in fig7-charging-time-constant.
    The peak of each of the five pulses (the value at the end of each pulse) is compared with
    the first by the paper's two-sided Student's t-test at p < 0.05 (a claim of absence). The
    paper does not say whether it is paired; it is run (a) paired across cells and (b)
    unpaired, and methods_underspecified when they disagree. Reproduced when no later peak
    differs from the first and the trace between pulses stays above the resting level (the
    minimum before each of pulses 2 to 5 differs from zero by a two-sided one-sample t-test
    across cells at p < 0.05, the Methods 2.5 test applied here by the file); not reproduced
    when a later peak differs from the first at p < 0.05.
- id: fig1e-heating
  statement: In the worst case tested, trains of 5 bipolar pulses (second phase 50%) at 1 Hz
    heated the sample to no more than 30 degrees C; at 833 kHz heating exceeded 30 degrees C
    but never reached 44 degrees C, and stayed close to 30 degrees C along the bb' line.
  source: Methods 2.4, paragraph 2; Figure 1E
  quote: Pulses applied at 1 Hz (the repetition rate used in all but one sets of experiments)
    caused only modest heating, not exceeding 30 °C. At a high repetition rate of 833 kHz,
    heating exceeded 30 °C but never reached the next transition point of 44 °C and remained
    close to 30 °C (green to blue transition) along the bb' line
  criterion: Measured with thermochromic liquid crystal sheets photographed with a camera
    (Methods 2.4). Reproduced when the photographs show no blue at 1 Hz, and at 833 kHz no
    return to black (44 degrees C) and no more than the green to blue transition along bb'.
    The dandiset is not meant to hold these photographs.
- id: fig6cf-cancellation-stronger-at-high-field
  statement: For high-frequency bursts of nsEP, a stronger electric field enhanced bipolar
    cancellation.
  source: Discussion, paragraph 1; Figure 6C and F
  quote: For high-frequency nsEP bursts, stronger electric field enhanced cancellation ( Fig. 6C ,
    F ).
  criterion: The ratio of the fits of bipolar and unipolar mean YP against field (Fig. 6 legend,
    fit readings as in fig4ac-ns-bipolar-20-25pct, whose outcomes must agree,
    methods_underspecified when they differ) for each kHz repetition rate (10 to 833 kHz),
    over the ROI with unipolar uptake above background (the paper gives no cutoff for Fig. 6;
    the Fig. 3 cutoff of 7 to 8 kV/cm is used, readings 7 and 8). "High-frequency" is not
    defined; readings are (a) 833 kHz only and (b) every kHz rate; either suffices. Reproduced
    when the ratio falls from the lowest to the highest included field. The paper reports no
    test; dish ratios (bipolar YP over the unipolar mean at the same ROI) at the lowest and
    highest included ROI are compared by an unpaired two-sided t-test and reported.
