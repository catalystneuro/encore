# Claims for Kim, Semenov, Kiester, Keppler, Ibey, Bixler & Pakhomov (2022) on dandiset 000489.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read. The accepted author manuscript in PubMed Central (PMC9729435, NIHMS1849847), as
# served by ncbi_pmc, in paper/10.1016-j.bioelechem.2022.108319.txt. It holds the main text,
# the Methods (sections 2.1 to 2.6), the Results, the Discussion and the legends of Figs. 1 to 7.
# The paper has no supplement (PMC lists none, and the text cites none). No PDF was supplied;
# figures were not read, so values shown only in a figure are not used. The paper links no
# code and no data deposit, so no repository was read.
#
# The dandiset. Its title on DANDI is "The impact of the second phase amplitude (% to the first
# phase) on the electroporation efficiency (measured as YP emission)" and its description
# names 5-pulse, 1-Hz trains of unipolar 600 ns pulses (0%) or bipolar 600+600 ns pulses with
# a second phase of 25, 50, 75 or 100%, delivered by two stainless-steel cylinders 1.5 mm in
# diameter and 3 mm apart. That is the experiment of Fig. 2 (Results 3.1). The claims on Figs.
# 3 to 7 and on heating cover the paper's other findings; the dandiset is not meant to hold
# them, and whether it does is the author's to find.
#
# Data the paper used, as it reports them.
# - Electroporation experiments (Figs. 2 to 6). Monolayers of bovine pulmonary artery
#   endothelial (BPAE) cells in 35 mm glass bottom dishes, in a physiological solution with
#   1 uM YO-PRO-1 (YP), pre-treated with propidium iodide and labeled with MemBrite Fix 405/430.
#   Pulses were delivered by two hollow stainless-steel needles (1.5 mm, 3 mm apart). After
#   10 min, the whole dish was imaged (216 tiles, 10x 0.38 NA, DAPI cube for MemBrite and FITC
#   cube for YP) and stitched. Fluorescence was averaged in 200 um square ROI along the bb'
#   line (equidistant from both electrodes; strongest field at the centre, falling towards the
#   edges) or, for Fig. 5, along the aa' line (connecting anode and cathode). The measure is
#   YP = YP_ROI x MB_0 / MB_ROI - YP_0, where YP_0 and MB_0 are measured within the electrode
#   footprints. Each exposure protocol was tested 3 to 8 times; graphs show mean and s.e.m.
#   Fig. 2 used 5.75 kV for the first phase and second phases of 0, 25, 50, 75 and 100%.
#   Fig. 3 used 5, 10 or 15 pulses (600 ns, 600+600 ns at 50%), n = 3. Fig. 4 used phase
#   durations of 300, 600 and 1200 ns (5.75 kV) and 50, 100 and 500 us (425, 350 and 250 V),
#   second phase 50%. Fig. 5 re-analyzes the Fig. 4 dishes along aa'. Fig. 6 used 5 pulses of
#   600 ns or 600+600 ns (50%) at 1 Hz, 10 to 500 kHz and 833 kHz.
# - Strobe imaging (Fig. 7). CHO-K1 cells loaded with FluoVolt, tungsten rod electrodes
#   (0.5 mm, 1 mm apart, 50 um above the dish bottom), 37 V giving 0.3 kV/cm, trains of 5 pulses
#   at 833 kHz, unipolar 600 ns (18 cells) or bipolar 600+600 ns with a 50% second phase
#   (17 cells). Laser flash delay stepped by 25 ns over 12.5 us (500 exposures at 6 per second),
#   each cell recorded in two trials (ascending and descending delays) that were averaged.
#   Pole signals were scaled to the whole-cell signal and expressed as a percent difference
#   from the mean of the 40 points before the pulse.
#
# Outside input the paper relies on (step 4). The electric field strength of each ROI is not
# measured; it comes from the paper's finite element model (Sim4Life V5.2, Methods 2.3, Fig. 1B
# and C), computed for 1 V and scaled by the applied voltage. The model output is not deposited.
# Its geometry is given in Methods 2.3 (two stainless-steel cylinders 1.5 mm in diameter, 3 mm
# apart, touching the glass of a 35 mm dish filled to 3.5 mm with a 1.6 S/m solution, field
# taken 1 um above the glass). If the dandiset does not hold the field per ROI, the author
# recomputes it from that geometry and records it under inputs. The paper's own values are a
# check on the result, 15.1 kV/cm being the strongest field cited for 5.75 kV in Fig. 2C.
# For bipolar pulses the field quoted is that of the first phase (Fig. 2 and Fig. 6 legends).
#
# Details the paper leaves open, used by several criteria below.
# - ROI placement along bb'. The paper gives the ROI size (200 um square) and the line, not the
#   spacing or the number of ROI. Readings are (a) contiguous ROI tiled outward from the centre
#   along bb' on both sides, and (b) the same on one side only. Values at a named field strength
#   (6.7, 8.7, 15.1 kV/cm) are taken from the ROI whose mean field is closest to it.
# - Statistics. The paper uses a two-sided Student's t-test at p < 0.05 (Methods 2.5) and does
#   not say whether it is paired or unpaired, nor whether ratios were tested. Exposures with
#   different pulse parameters are different dishes, so comparisons between protocols are
#   unpaired; comparisons between ROI of the same dishes can be (a) paired or (b) unpaired.
# - Fits. Grapher 16 was used for fitting (Methods 2.5). Whether fits were made to the mean
#   values or to all dish values, and on linear values or on log values for exponential fits,
#   is not given. Readings are named where an outcome depends on them.
schema_version: 2
dataset:
  archive: dandi
  id: "000489"
paper: doi:10.1016/j.bioelechem.2022.108319
claims:
- id: fig2a-uptake-rises-with-field
  statement: For unipolar 600 ns pulses and for bipolar 600+600 ns pulses with every second
    phase amplitude, a train of 5 pulses at 1 Hz evoked YP uptake that increased with the
    local electric field strength.
  source: Results 3.1, paragraph 1; Figure 2A
  quote: A train of 5 pulses applied at 1 Hz evoked YP uptake proportionally to the local
    electric field strength ( Fig. 2A ), along with a strong dependence on the 2 nd phase
    amplitude.
  criterion: YP per ROI along bb' as defined in Methods 2.5, with the field of each ROI from the
    model (opening comment). For each of the five second phase amplitudes (0, 25, 50, 75,
    100%), the dish values at the ROI with the strongest field are compared with those at the
    ROI with the weakest field by the paper's two-sided Student's t-test (Methods 2.5), read
    (a) paired across dishes and (b) unpaired. Reproduced when YP is higher at the strongest
    field with p < 0.05 for all five amplitudes; partially reproduced for three or four; not
    reproduced otherwise. When readings (a) and (b) give different outcomes the claim is
    methods_underspecified. The paper reports no test for this finding; the strongest
    against weakest ROI comparison is the file's reading of "proportionally", with the test
    taken from Methods 2.5. The Spearman correlation of mean YP with field across ROI is
    reported for each amplitude as a description.
- id: fig2a-vertical-scales
  statement: Although the panels of Fig. 2A look similar, their vertical scale goes from 1200
    a.u. for unipolar pulses down to only 250 a.u. for bipolar pulses with a 75% second phase.
  source: Results 3.1, paragraph 1; Figure 2A
  quote: note the difference in the vertical scale, which is varied from 1200 a.u. for unipolar
    pulses to only 250 a.u. for 75% bipolar pulses
  criterion: The numbers are axis limits, not measured values, so they bound the data. With YP
    in the units of the dataset's fluorescence images, reproduced when the largest mean plus
    s.e.m. over ROI is at most 1200 a.u. for unipolar pulses and at most 250 a.u. for 75%
    bipolar pulses, and the largest unipolar mean exceeds 250 a.u. (so that the unipolar data
    could not fit the 75% scale). If the images are not in the units the paper measured (for
    example rescaled on export), only the ratio of the two largest means is reported and the
    claim is blocked on the absolute values.
- id: fig2b-exponential-same-slope
  statement: YP uptake increased exponentially with the field strength, and the second phase did
    not change the slope of the exponential fits on a semi-log scale.
  source: Results 3.1, paragraph 1; Figure 2B and its legend
  quote: YP uptake increased exponentially with the electric field, and the presence of the 2nd
    phase did not change the apparent slope of exponential fits when plotted on a semi-log scale
  criterion: As the Fig. 2B legend says, mean YP per ROI is fitted with an exponential function
    of field, YP = A exp(kE), leaving out low-signal ROI. The legend's cutoff is "less than 6-8
    kV/cm"; readings 6, 7 and 8 kV/cm are each run. Grapher's fitting method is not given;
    readings are (a) nonlinear least squares on linear YP and (b) linear regression of log YP
    on field. The exponential is judged adequate when it fits better than a straight line
    (lower residual sum of squares on linear YP) for at least four of five amplitudes; the
    paper gives no such test, so this rule is the file's and is named as such. For the
    slope (a claim of absence, with no test reported), the paper's test, a two-sided t-test at
    p < 0.05, compares the slope k of each bipolar amplitude with the unipolar slope, using
    (i) per-dish fits compared by an unpaired t-test and (ii) the fits to the means with the
    slope standard errors. Reproduced when no bipolar slope differs from the unipolar slope at
    p < 0.05 and the exponential is adequate; not reproduced when any slope differs. Slopes
    and their ratios to the unipolar slope are reported under every reading; when the readings
    disagree the claim is methods_underspecified.
- id: fig2c-max-inhibition-50-75
  statement: The strongest inhibition of YP uptake, to about 20% of the uptake after unipolar
    pulses, was reached with a second phase of 50 to 75% of the first (p < 0.01).
  source: Results 3.1, paragraph 2; Figure 2C and its legend
  quote: The maximum inhibition of YP uptake, down to ~20% of the unipolar pulses, was achieved
    with the 2 nd phase set to 50-75% of the first one (p<0.01, Fig. 2C ).
  statistics:
  - test: two-sided Student's t-test
    p: 0.01
    p_relation: "<"
    n: 3 to 8 exposures per protocol
  expected:
  - quantity: YP after bipolar pulses with the most effective second phase, as percent of unipolar
    value: 20
    tolerance: 2
    unit: "%"
  criterion: As the Fig. 2C legend says, for each selected field strength the mean YP for each
    amplitude is expressed as percent of the unipolar mean at that field. The paper names
    6.7, 8.7 and 15.1 kV/cm and does not list the other selected values; all ROI with fields
    from 8.7 to 15.1 kV/cm are used. Reproduced when the lowest of the 50% and 75% values is
    below the 25% and 100% values at every such field, the percent is within 18 to 22%, and
    the 50 or 75% dish values differ from the unipolar dish values by an unpaired two-sided
    t-test at p < 0.01. Which "~20%" is meant is open; readings are (a) the mean percent
    over the fields from 8.7 to 15.1 kV/cm for the better of 50 and 75%, and (b) the lowest
    percent at any of those fields. Which comparison carries p < 0.01 is open; readings are
    (i) 50% and 75% against unipolar and (ii) 50% and 75% against 25% and 100%, each on raw
    YP and on dish values divided by the unipolar mean. Reproduced when the values and the
    test hold under one reading of each; partially reproduced when the ordering and test hold
    but the percent is outside tolerance under every reading.
- id: fig2c-inhibition-flat-above-8-7
  statement: Between 8.7 and 15.1 kV/cm the degree of inhibition by the second phase did not
    depend on the field strength.
  source: Results 3.1, paragraph 2; Figure 2C
  quote: The degree of inhibition showed no dependence on the electric field strength between 8.7
    and 15.1 kV/cm.
  criterion: A claim of absence. Bipolar YP of each dish is divided by the unipolar mean at the
    same ROI field (Fig. 2C legend, unipolar as 100%). For each bipolar amplitude, the values
    at 8.7 kV/cm are compared with those at 15.1 kV/cm, and every pair of ROI fields in the
    range is compared, by the paper's two-sided Student's t-test at p < 0.05 (Methods 2.5),
    which the paper does not say is paired or unpaired, so it is run (a) paired across dishes
    and (b) unpaired. Reproduced when the 8.7 against 15.1 comparison shows no difference for
    any amplitude under both; not reproduced when it does under both; methods_underspecified
    when (a) and (b) disagree. The other pairs and the size of each difference are shown as
    variants.
  depends_on:
  - fig2c-max-inhibition-50-75
- id: fig2c-weaker-at-6-7
  statement: Inhibition was weaker at 6.7 kV/cm than at the higher field strengths, with p <
    0.01 for the 50% bipolar pulses and p < 0.05 for the 100% bipolar pulses.
  source: Results 3.1, paragraph 2; Figure 2C
  quote: However, inhibition was weaker at 6.7 kV/cm (p<0.01 compared to the higher electric field
    strengths for 50% bipolar pulses, and p<0.05 for 100% bipolar pulses).
  statistics:
  - about: 50% bipolar, 6.7 kV/cm against higher field strengths
    test: two-sided Student's t-test
    p: 0.01
    p_relation: "<"
  - about: 100% bipolar, 6.7 kV/cm against higher field strengths
    test: two-sided Student's t-test
    p: 0.05
    p_relation: "<"
  criterion: Bipolar YP as percent of the unipolar mean at the same field, per dish, as in
    fig2c-inhibition-flat-above-8-7. For 50% and for 100% bipolar pulses, the value at the
    ROI closest to 6.7 kV/cm is compared with the higher fields (ROI from 8.7 to 15.1 kV/cm)
    by a two-sided Student's t-test. "Compared to the higher electric field strengths" allows
    two readings, (i) against each higher field ROI and (ii) against the dish values of all
    higher field ROI pooled; either suffices. The test is not said to be paired, so each is
    run (a) paired and (b) unpaired, and the outcome is the one (a) and (b) both give
    (methods_underspecified when they differ). Reproduced when the percent at 6.7 kV/cm is
    higher than at every higher field, with p < 0.01 for 50% and p < 0.05 for 100%;
    partially reproduced when it is higher at every field but the tests hold for only one
    amplitude.
- id: fig3-uptake-linear-in-pulse-number
  statement: Uptake rose with field strength and with pulse number for both uni- and bipolar
    pulses, almost linearly with the number of pulses, so that plots for 5, 10 and 15 pulses
    look alike when the y-axis is scaled to 800, 1600 and 2400 a.u.
  source: Results 3.2, paragraph 1; Figure 3A to C
  quote: Increasing the pulse number increased YP uptake almost linearly [ 15 ]. Therefore, YP
    uptake plots for 5, 10, and 15 pulses appeared almost identical when plotted with the y-axis
    scaled proportionally (to 800, 1600, and 2400 a.u., respectively).
  expected:
  - quantity: YP for 10 pulses over YP for 5 pulses
    value: 2
    tolerance: 0.2
  - quantity: YP for 15 pulses over YP for 5 pulses
    value: 3
    tolerance: 0.3
  criterion: Mean YP per ROI along bb' for each pulse type and number, ROI below the paper's
    background cutoff (7 to 8 kV/cm, Results 3.2; readings 7 and 8) left out. The ratios are
    taken (a) as the mean over ROI of the ratio of means, and (b) as the ratio of the 2nd
    degree polynomial fits the paper used (Fig. 3 legend) averaged over the included field
    range. The expected 2 and 3 are read from the axis limits 800, 1600 and 2400 a.u. and
    "almost linearly"; the paper prints no ratio. Reproduced when both ratios are within
    tolerance for unipolar and for bipolar pulses; partially reproduced when they are for
    one pulse type. The paper does not fix the measure, so the outcome is the one (a) and (b)
    both give, and methods_underspecified when they differ.
- id: fig3d-cancellation-independent-of-number
  statement: The relative efficiency of 50% bipolar pulses was the same for 5, 10 and 15 pulses
    and did not depend on the field strength.
  source: Results 3.2, paragraph 2; Figure 3D and its legend
  quote: The plots for 5, 10, and 15 pulses nearly overlapped, showing that within the studied
    limits cancellation of electroporation by adding a 50% opposite polarity phase did not
    depend on the pulse number or the electric field strength.
  criterion: A claim of absence, for which the paper reports no test. As the Fig. 3 legend
    says, mean YP against field is fitted with a 2nd degree polynomial for each pulse type and
    number, and the bipolar fit is divided by the unipolar fit, over fields above 7 to 8
    kV/cm (readings 7 and 8). The paper's test, a two-sided Student's t-test at p < 0.05,
    is applied to dish values of bipolar YP divided by the unipolar mean at the same ROI,
    (i) between pulse numbers at each ROI (unpaired) and (ii) between the lowest and highest
    included ROI for each pulse number (paired). Reproduced when no comparison of pulse
    numbers differs at any ROI and no field comparison differs; not reproduced otherwise. The
    fitted ratio curves and their range are reported.
- id: fig4ac-ns-bipolar-20-25pct
  statement: Bipolar 300+300 and 600+600 ns pulses with a 50% second phase gave 20 to 25% of
    the uptake of the respective unipolar pulses, independent of the field strength.
  source: Results 3.3, paragraph 1; Figure 4A to D
  quote: Electroporation by 300+300 and 600+600 ns pulses was at 20-25% of the respective unipolar
    pulses and did not depend on the electric field strength.
  expected:
  - quantity: bipolar over unipolar YP, 300 ns phases
    value: 22.5
    unit: "%"
  - quantity: bipolar over unipolar YP, 600 ns phases
    value: 22.5
    unit: "%"
  criterion: The reported range 20 to 25% is widened by 10% of each bound, to 18 to 27.5%. The
    ratio is that of the fits of bipolar and unipolar mean YP against field (Fig. 4 legend,
    "either exponential or polynomial"; the legend does not say which for which duration, so
    three readings are run, (a) exponential for all, (b) 2nd degree polynomial for all, as in
    Fig. 3, and (c) for each curve the one with the lower residual sum of squares). Fields
    are those above the background cutoff stated for Fig. 3 (7 to 8 kV/cm, readings 7 and 8;
    the Fig. 4 legend refers to Fig. 2 and the text and states no cutoff of its own).
    Reproduced when, for both durations, the ratio stays in 18 to 27.5% over the included
    field range; partially reproduced when its mean over the range does but it leaves the
    range somewhere. The outcome is the one the fit readings all give; methods_underspecified
    when they differ. The field dependence is judged as in
    fig3d-cancellation-independent-of-number, between the lowest and highest included ROI.
