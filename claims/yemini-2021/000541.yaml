# Claims for Yemini, Lin, Nejatbakhsh et al. (2021), NeuroPAL, Cell 184, 272-288, on dandiset 000541.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-10-30,
# protocol pilot-12 as stated in docs/protocol.md.
#
# Text read: the accepted author manuscript in PubMed Central (PMC10494711, NIHMS1925874), with
# its Results, Discussion, figure legends, STAR Methods and Key Resources Table, and the two
# supplement PDFs Methods S1 (semi-automated identification, statistical atlas) and Methods S2
# (optimal coloring). The version of record was not read. Tables S1 to S6 (spreadsheets) were
# not in the paper store. Table S6 holds the per-neuron statistics of the whole-brain imaging
# (Figure 6), so the claims below on Figure 6 take their findings from the Results text and
# their method from the STAR Methods, with no per-neuron p or q value to compare against.
#
# Code read: github.com/venkatachalamlab/NeuroPAL-traces at 92b27ed (trace extraction from
# GCaMP movies, the older method the paper used for strain OH15500 only); github.com/amin-nejat/
# CELL_ID at 759898d (the NeuroPAL ID software: neuron detection, statistical atlas,
# identification); github.com/Eviatar/Optimal_Coloring at f01284f (the optimal-coloring
# solver). None of them holds the statistics or the correlation and connectome analysis of
# Figure 6, so those methods come from the STAR Methods alone.
#
# The dandiset ("NeuroPAL Microfluidic Chip Images and GCaMP activity") is meant to hold the
# whole-brain imaging of Figure 6, Figure S1H and Figure S2. The paper describes these data as
# follows. Strain OH16230 (otIs669[NeuroPAL]; otIs672[panneuronal GCaMP6s]), young-adult
# hermaphrodites with at most 2 visible eggs, immobilized with 1 mM tetramisole in a microfluidic
# chip. Per animal: one 4-color NeuroPAL landmark volume for identification, a 2 min unlit wait,
# then a 4 min single-channel nuclear GCaMP6s recording at about 4 Hz. After 1 min, three 10 s
# pulses (160 mM NaCl, 1e-4 2-butanone, 1e-4 2,3-pentanedione) in CTX buffer, one per minute, in
# an order rotated between animals. 21 heads (189 identified neurons) and, separately, 21 tails
# (42 neurons); heads were kept when ASE responded to NaCl and AWC to both odors; tails were
# kept without that check. A second strain, OH15500 (200 mM NaCl for 20 s, in water), is in
# the supplement only and is not discussed in the paper's text. Measured variables: neuron
# identities from the NeuroPAL volume, GCaMP6s traces per identified neuron, stimulus timing.
# The paper also deposited the imaging data and whole-brain activity on Zenodo
# (doi:10.5281/zenodo.3906530). The Figure 6J and 6K comparison uses the connectome of Cook et
# al. 2019 (doi:10.1038/s41586-019-1352-7).
#
# The trace processing the STAR Methods fix ("Brainwide imaging of neuronal activity traces"):
# traces extracted with dNMF; first 1 s and last frame removed; downsampled to the lowest frame
# rate of the group (4 Hz heads, 3.87 Hz tails); dF/F0 with dF the trace minus a fitted first-order
# exponential bleach curve and F0 the 5th percentile of the trace; neurons within 5 um of each
# other with traces correlated at 95% or more removed; neuron types with N of 3 or fewer not
# evaluated. The response tests ("Analysis of brainwide imaging data"): premotor interneurons
# (AVA, AVB, AVD, AVE, PVC) and ventral-cord motor neurons excluded; left and right neurons of a
# class pooled except for asymmetry tests; two-tailed paired t-test of the mean during the 10 s
# stimulus against the identical period immediately before, in the same neuron; p values
# corrected by Storey (2002) FDR q values; significance at p or q of 0.05 or less.
#
# Most findings of the paper (the reagent, the receptor expression maps, the mutant analyses, the
# positional atlas and the identification software) rest on imaging the dandiset is not
# described as holding. They are listed so the paper's main findings are covered.
