    value: 21
    tolerance: 0
    unit: animals
  - quantity: identified head neurons
    value: 189
    tolerance: 18.9
    unit: neurons
  - quantity: tail recordings
    value: 21
    tolerance: 0
    unit: animals
  - quantity: identified tail neurons
    value: 42
    tolerance: 4.2
    unit: neurons
  - quantity: median number of animals per neuron type
    value: 18
    tolerance: 1.8
    unit: animals
  criterion: Counts of OH16230 recordings. Animal counts are exact (tolerance 0, as they are
