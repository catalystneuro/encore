- id: fig6c-odors-more-inhibitory
  statement: Both odors evoke responses in many sensory and interneurons throughout the brain,
    with more inhibitory (decreasing calcium) activity than NaCl.
  source: Results, Whole-Brain Activity Imaging of Gustatory and Olfactory Responses, paragraph 2;
    Figure 6C
  quote: We found that odors also evoked responses in a large set of both sensory and
    interneurons, throughout the brain, but exhibited more inhibitory activity (decreasing [Ca 2+
    ]) than seen for NaCl
  criterion: The paper gives no measure for "more inhibitory". Figure 6C shows peak activity
    before and during the stimulus per head class. The readings are (a) the number of head
    classes with a significant decrease (paired t-test as in fig6-nacl-unknown-interneurons,
    q of 0.05 or less) and (b) the fraction of head classes whose mean response (during minus
    before) is negative. Reproduced when, under one reading, each odor exceeds NaCl.
  depends_on:
  - fig6-nacl-unknown-interneurons
