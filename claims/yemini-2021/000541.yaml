- id: fig6-all-heads-responsive
  statement: 21 head recordings showed the published responses of the primary sensory neurons,
    ASE excitation to NaCl and AWC inhibition to both odors, in the left or the right neuron,
    and were kept for analysis.
  source: STAR Methods, Analysis of brainwide imaging data
  quote: Worms were marked as stimulus responsive if either their left or right neuron showed the
    published response to their corresponding stimuli (ASE excitation for NaCl and AWC inhibition
    for odors) ... 21 heads responded to all three stimuli
  expected:
    quantity: heads responding to all three stimuli
    value: 21
    tolerance: 0
    unit: animals
  criterion: The paper says only that ASE and AWC responses were "reviewed", and does not say
    how a single neuron's response was judged in one animal, which had one pulse of each
    stimulus. The readings are (a) the mean dF/F0 during the 10 s pulse exceeds (ASE) or falls
    below (AWC) the mean over the 10 s before; (b) the same difference exceeds two standard
    deviations of the 10 s before. The paper does not say how many heads were recorded before
    this selection. Reproduced when, under one reading, 21 head recordings in the dataset pass
    for all three stimuli (all of them when the dataset holds only the 21 heads the paper kept).
- id: fig6d-ase-nacl
  statement: NaCl evokes left/right asymmetric responses in the two ASE neurons, and ASER shows
    an increase in calcium upon NaCl presentation.
  source: Results, Whole-Brain Activity Imaging of Gustatory and Olfactory Responses, paragraph 2;
    Figure 6D
  quote: NaCl evoked stereotyped left/right (L/R) asymmetric responses in the two ASE neurons.
    However, ASER exhibited an increase in [Ca 2+ ] upon NaCl presentation
  statistics:
  - about: ASER response to NaCl, stimulus against prior period
    test: two-tailed paired t test
    p: 0.05
    p_relation: "<"
    corrected: FDR (Storey q values)
  criterion: Per the STAR Methods, ASER's mean dF/F0 during the NaCl pulse against the identical
    10 s before, two-tailed paired t-test over head recordings; reproduced in part when the
    mean is higher with q of 0.05 or less. For the asymmetry, a two-tailed unpaired t-test of
    ASEL against ASER. The measure the asymmetry test compares is open; the readings are (a)
    the response, mean during the pulse minus mean before; (b) the mean during the pulse.
    The FDR family is open; the readings are (a) all neuron and stimulus tests of the heads
    together; (b) each stimulus apart. Reproduced when ASER is excited and the asymmetry test
    gives p of 0.05 or less under one pair of readings; partially reproduced when only one of
    the two holds.
- id: fig6-nacl-unknown-interneurons
  statement: NaCl evokes significant responses in six interneurons with no previously known
    function, AIN, AVF, AVH, AVJ, I2 and MI.
  source: Results, Whole-Brain Activity Imaging of Gustatory and Olfactory Responses, paragraph 2;
    Figures 6C to 6F
  quote: In particular, we detected significant NaCl responses in six interneurons with no
    previously known function ... AIN, AVF, AVH, AVJ, I2, and MI
  statistics:
  - test: two-tailed paired t test, stimulus against prior period
    p: 0.05
    p_relation: "<"
    corrected: FDR (Storey q values)
  criterion: Per the STAR Methods, for each class (left and right pooled) the mean dF/F0 during
    the NaCl pulse against the identical period before, two-tailed paired t-test, significant
    at p or q of 0.05 or less. The figure legend says significant responses are those with "p
    or q" of 0.05 or less, so the readings are (a) q from Storey FDR over all head tests of the
    three stimuli; (b) q over the NaCl tests only; (c) uncorrected p. Reproduced when all six
