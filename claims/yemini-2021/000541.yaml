- id: fig5ab-pag3-fate
  statement: In pag-3 null mutants the NeuroPAL color codes of the VA and VB motor neurons are
    absent, and the AVE and PVR interneurons change color; a pag-3 fosmid reporter is expressed
    in previously unidentified neurons including AVE and PVR.
  source: Results, Uncovering Determinants of Cell Fate, paragraph 1; Figures 5A to 5C; Table S5
  quote: As predicted, the color codes that identify the VA and VB cell types in NeuroPAL are
    absent in pag-3 mutants ... Unexpectedly, we also found color changes in the AVE and PVR
    interneurons caused by pag-3 mutation
  criterion: Per the STAR Methods, one-sided Fisher's exact tests for PVR, VA2 and VB3 and a
    one-sided rank-sum test for AVE (scored 0, 1 or 2 altered AVE neurons), Bonferroni corrected
    for eight tests, in each of the two alleles n3098 and ok488. The p values are in Table S5,
    not read.
- id: fig5ef-eor1-rme
  statement: In eor-1 null mutants the dorsal and ventral RME neurons (RMED/V) lose all their
    blue NeuroPAL coloring but keep the panneuronal label, while RMEL/R are unchanged; an
    unc-25/GAD reporter confirms the loss, with no defect in UNC-47/VGAT expression.
  source: Results, Uncovering Determinants of Cell Fate, paragraph 2; Figures 5E to 5G; Table S5
  quote: The dorsal and ventral RME neurons (RMED/V) lost all their blue coloring but retained
    their panneuronal label ... In contrast, the left and right RME neurons (RMEL/R) exhibited no
    changes in their color codes ... but at the same time found no defects in UNC-47/VGAT
    expression
  criterion: Per the STAR Methods, a one-sided Fisher's exact test for loss of RMED/V blue color
    and a one-sided rank-sum test of unc-25 reporter scores (0 lost, 1 weak, 2 unchanged),
    Bonferroni corrected for eight tests, in each of the alleles cs28 and ok1127. The p values
    are in Table S5, not read.
