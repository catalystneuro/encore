- id: figs1h-avf-cyclic
  statement: In many animals the AVF interneurons show robust cyclical activity of about 0.3 Hz
    for the whole 4 min recording, whatever the stimulus, similar to the crawling frequency of
    freely moving worms of this strain.
  source: Results, Whole-Brain Activity Imaging of Gustatory and Olfactory Responses, paragraph 3;
    Figure S1H
  quote: in many animals, the pair of AVF interneurons displayed robust cyclical activity for the
    entire 4-min recording, irrespective of delivery of gustatory or olfactory stimuli. The
    frequency of this activity was ~0.3 Hz
  expected:
    quantity: AVF cycle frequency
    value: 0.3
    tolerance: 0.03
    unit: Hz
  criterion: Per the Figure S1H legend, AVF traces median filtered at 0.5 s, and the frequency
    counted as the number of peaks per 4 min interval; the legend shows traces from five
    OH16230 worms, and the Results say "in many animals". How peaks are detected, and which
    animals count as cyclical, are open. The readings for peaks are (a) local maxima of the
    filtered trace with prominence of at least one standard deviation of the trace; (b) the
    same with half a standard deviation. The readings for animals are (a) all head recordings
    with AVF identified; (b) those whose AVF trace has its largest spectral peak between 0.1
    and 1 Hz. Reproduced when, under one pair of readings, the median frequency over AVF
    neurons is within tolerance. The crawling frequency (Figure S1G, Table S2) is from a
    behavioral assay the dandiset is not described as holding, and is not tested.
- id: fig6gi-stimulus-specific-correlations
  statement: Pairwise correlations between neurons are similar across individuals for a
    stimulus, but each stimulus generates its own brainwide correlation pattern, even the two
    attractive odors.
  source: Results, Whole-Brain Neuronal Dynamics and Connectivity, paragraph 1; Figures 6G to 6I
    and S2C to S2E
  quote: We found similar stimulus-specific neuronal correlations across individuals, but each
    stimulus generated its own brainwide correlation pattern ... Even the two attractive odors
    produced distinct sets of neuronal correlations among and between sensory and interneurons
  criterion: Per the Figure 6 legend, Pearson correlations between head neurons in each animal
    over the 30 s following stimulus onset, averaged across animals. The paper gives no test
    of "similar" or "distinct". The readings are (a) for each pair of animals, the correlation
    between their correlation matrices over shared neuron pairs, same stimulus against
    different stimuli, compared by a one-sided Wilcoxon signed-rank test over animal pairs;
    (b) split the animals in two halves at random 100 times, and compare the correlation of
    the two halves' mean matrices for the same stimulus against that for different stimuli.
    Reproduced when, under one reading, same-stimulus similarity exceeds different-stimulus
    similarity for each of the three stimulus pairs (p < 0.05 for reading a; in at least 95 of
    100 splits for reading b); partially reproduced when it holds for NaCl against the odors
    but not between the two odors.
- id: figs2a-pca-trajectories
  statement: The average trajectories of whole-brain activity in the space of its first three
    principal components, over the 10 s stimulus and 20 s after, show similarities but remain
    distinguishable between the three stimuli.
  source: Figure S2A and S2B; Results, Whole-Brain Neuronal Dynamics and Connectivity, paragraph 1
  quote: Average phase trajectories (N = 21 animal heads) of whole-brain neuronal activity in
    response to stimuli (10 s of stimulus application and 20 s thereafter) ... The average
    stimulus trajectories exhibit similarities but remain distinguishable
  criterion: The paper does not say how the principal components are computed or how
    "distinguishable" is judged. The PCA is read as (a) on the matrix of class-averaged traces
    over the whole recording, or (b) on the stimulus windows only, with neurons missing from
    an animal left out. A trajectory is distinguishable from another when the two
    trajectories' mean distance exceeds twice the mean standard error of the mean over the
    21 heads (the mesh of Figure S2A). Reproduced when, under one reading, all three pairs are
    distinguishable.
- id: fig6jk-connectome-correlation
  statement: Functional correlations correspond little to the anatomical connectome; the R2 of
    the Pearson correlation between absolute functional correlations and synapse counts is
    2.8% (head) and 1.7% (tail) for electrical synapses, and 0.5% (head) and 1.5% (tail) for
    chemical synapses.
  source: Results, Whole-Brain Neuronal Dynamics and Connectivity, paragraph 2; Figures 6J and 6K
  quote: We found low Pearson correlation between these functional and structural matrices. For
    electrical connectivity, R 2 = 2.8% in the head and R 2 = 1.7% in the tail, and for chemical
    connectivity, R 2 = 0.5% in the head and R 2 = 1.5% in the tail
  data: with_inputs
  expected:
  - quantity: R2, electrical synapses, head
    value: 2.8
    tolerance: 0.28
    unit: percent
  - quantity: R2, electrical synapses, tail
    value: 1.7
    tolerance: 0.17
    unit: percent
  - quantity: R2, chemical synapses, head
    value: 0.5
    tolerance: 0.05
    unit: percent
  - quantity: R2, chemical synapses, tail
    value: 1.5
    tolerance: 0.15
    unit: percent
  criterion: Per the Results, the absolute value of the functional correlation matrix against
    the synapse count matrix of Cook et al. 2019 (hermaphrodite), Pearson R2. Open details and
    their readings. The functional matrix is (a) the per-animal correlation over the whole
    recording averaged over animals (the variations the paper lists include limiting to
    stimulus periods, so the default is read as the whole recording); (b) per-animal neuron
    pairs pooled. Neuron pairs are (a) all off-diagonal pairs of identified neurons, those
    without synapses counted as zero; (b) only pairs with at least one synapse. Electrical
    counts are made symmetric; chemical counts are (a) summed over both directions; (b) the
    larger direction. Reproduced when, under one combination of readings, all four values are
    within tolerance; partially reproduced when all four R2 values are below 5% but not within
    tolerance.
- id: fig6-connectome-variations
  statement: Variations of the comparison (thresholding for low sampling, ranked correlation,
    log-scaled synapse counts, stimulus or non-stimulus periods only) do not noticeably improve
    the correlation between functional activity and the connectome.
  source: Results, Whole-Brain Neuronal Dynamics and Connectivity, paragraph 2
  quote: We tried multiple variations in our calculations (e.g., thresholding for low sampling,
    using ranked correlation metrics, log-scaling synaptic counts, and limiting functional
    activity to only stimulus or non-stimulus delivery periods) but these did not noticeably
    improve correlation between functional activity and the structural connectome
  data: with_inputs
  depends_on:
  - fig6jk-connectome-correlation
  criterion: The paper gives no threshold for "noticeably" and the values are in Table S6, not
    read. Each variation is run on the reading of fig6jk-connectome-correlation that matched
    (the first listed if none did); thresholding for low sampling keeps pairs seen in more
    than 5, 10 or 15 animals, the thresholds of Figure S2C to S2E. That legend writes "N > 5,
    10, and 15 neurons", while the STAR Methods (Statistical analysis) say N is the number of
    worms; the worm reading is used, as a neuron count does not define a sampling threshold
    for a pair. Ranked correlation is Spearman, a standard choice the paper does not name.
    The 3.1% bound for "noticeably" is a choice of this file, not the paper's. Reproduced when no variation gives an R2 above 3.1%, the largest R2 the paper
    reports widened by 10%.
