# Claims for Ito & Doya (2015), J Neurosci 35(8):3499-3514, on dandiset 001642.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record, open access, as served by PMC (PMC4339358), stored in
# paper/10.1523-jneurosci.1962-14.2015.txt: abstract, Introduction, Materials and Methods,
# Results, Discussion and the figure legends. The paper has no supplement. No PDF was available.
# The display equations of the Methods (decision-tree probability, normalized likelihood,
# Markov model, DFQ update and choice rule, parameter drift, mutual information, BIC, and the
# regression model (2)) are images on PMC and are missing from the text; only the words around
# them were read. Where a criterion needs one of them, it is named as open with the readings
# the surrounding text allows. Figure panels (such as the windows drawn in Fig. 6A) could not
# be read. The paper links no code, so no code was read.
#
# Data the paper used, as it reports them. Seven male Long-Evans rats. 86 recording sessions,
# 78,107 trials: 12,185 single fixed-choice, 22,234 double fixed-choice, 36,292 free-choice and
# 3505 extinction-test trials. Each trial starts with a start tone; a center-hole poke of
# 500-1000 ms brings one of three cue tones (left tone 900 Hz, right tone 6500 Hz, choice tone
# white noise, 1000-2000 ms); after cue offset the rat pokes the left or right hole and hears
# a reward tone (followed by a sucrose pellet) or a no-reward tone. Reward probabilities
# (left, right) are (50%, 0%) for the left tone, (0%, 50%) for the right tone, and one of
# (90, 50), (50, 90), (50, 10), (10, 50) per block for the choice tone. Block sequence per
# repeat: two single fixed-choice blocks (left tone, then right tone), two double fixed-choice
# blocks (left and right tones at random), four free-choice blocks (choice tone), with
# extinction tests of 5 unrewarded trials for left and right tones between the third and fourth
# blocks and for the choice tone between the sixth and seventh. Repeated two or three times per
# session. Wait-error trials (leaving the center hole early) and error trials (no L/R poke in
# 60 s) end with an error tone. Six task events per trial: E1 center-hole entry, E2 cue onset,
# E3 cue offset, E4 center-hole exit, E5 L/R-hole entry, E6 L/R-hole exit; E0 is 2 s before E1
# and E7 2 s after E6 (the Methods print "2 s after E8", a typo). Phases 1 to 7 lie between
# them; the mean durations of Phases 2 to 6 are 0.75, 1.50, 0.54, 0.76 and 0.38 s.
# Units: spike-sorted single units from three bundles of eight microwires per rat, DLS and DMS
# in the left hemisphere, VS in the right. 260 DLS, 178 DMS and 179 VS neurons passed the
# stability criteria; of these 190, 105 and 119 were phasically active neurons (PANs), the
# only units analysed. Behavioural model comparison used 202 sessions (101 training, 101
# test), more than the 86 recording sessions; the paper does not say where the others are from.
#
# Methods fixed by the paper and used throughout (Materials and Methods):
#  - Unit inclusion: the five exclusion conditions of Electrophysiological recording, the
#    cross-correlation duplicate check, then PAN = proportion of time spent in ISIs longer than
#    1 s greater than 0.4.
#  - EASH: spike times within Phases 2 to 6 of each trial scaled linearly onto the mean phase
#    durations above, spike counts per phase preserved; Phases 1 and 7 (2 s each) unscaled;
#    10 ms bins.
#  - Mutual information (Figs. 5, 9, 10): firing F in a window takes four levels f1 to f4;
#    the event X is binary (left or right action; fixed- or free-choice block; rewarded or
#    not). MI is in bits/s. Fig. 5 uses 100 ms EASH bins and all trials of single fixed,
#    double fixed and free-choice blocks. Figs. 9 and 10 use the last 20 trials of each block
#    and a sliding window of the preceding 500 ms, step 50 ms. Significance threshold for a
#    region average, p < 0.01, is the second largest of 100 region averages of MI with random
#    binary events.
#  - Regression (Figs. 7, 8): y(t), the spike count of trial t in a time bin, on a constant, the
#    trial index t, a(t) (1 left, 2 right), r(t) (1 reward, 0 none), a(t-1), r(t-1), QL(t) and
#    QR(t) from the FQ-learning model with time-varying parameters. For each neuron and bin, the
#    subset of regressors with the smallest BIC is chosen, and a regressor is coded when its
#    coefficient has p < 0.01 in that model. Action-value coding is QL or QR coded; state-value
#    coding is QL and QR coded with the same sign; policy coding is both with opposite signs.
#
# Details the paper leaves open and that bear on several claims (each criterion names those
# it needs):
#  - O1, MI estimation. The four firing levels and any bias correction are referred to Ito and
#    Doya (2009) and not restated. Readings: (a) levels as quartiles of the neuron's spike
#    counts in that window across the trials used (equal occupancy), no bias correction;
#    (b) the same with the mean MI of the random-event shuffles subtracted. The plug-in
#    estimate from the 4 x 2 table is used in both, divided by the window length for bits/s.
#  - O2, smoothing of EASHs for Fig. 4. The Methods use a 10 ms Gaussian (unit exclusion), the
#    Fig. 3 legend 30 ms. Readings: (a) 10 ms SD; (b) 30 ms SD; (c) none.
#  - O3, trials in EASHs and Fig. 5. "Whole trials" may (a) exclude or (b) include the
#    extinction-test trials; wait-error and error trials have no action and are left out.
#  - O4, chi-square tests of proportions. Readings: 2 x 2 test (a) without or (b) with Yates
#    continuity correction.
#  - O5, "Mann-Whitney U test" for proportions of coding neurons (Figs. 8 and 6). Read as a
#    Mann-Whitney U test on per-neuron 0/1 coding indicators, two-sided.
#  - O6, regression time bins for Fig. 8, "500 ms before and after the seven trial events".
#    Readings: (a) 500 ms windows before and after each event in real time; (b) the
#    same windows on the EASH time axis. Which seven events is not stated either: the Methods
#    define six task events E1 to E6 and the time points E0 and E7, so the readings are
#    (i) E1 to E7, (ii) E0 to E6. The Results refer to phases (Phase 1, first half of
#    Phase 4, Phase 5); a phase result is taken from the windows lying in that phase.
#
# Readings and outcomes. Where a criterion lists readings of what a reported number counts
# (trial-counts, trials-per-block), the claim holds when it matches under any of them. Where
# the readings are of a method (any O above, a window, a test, how trials are combined), the
# notebook runs each, the outcome is the one they all give, and when they disagree the claim
# is blocked as methods_underspecified.
#  - O7, trials in the regression. The values come from the free-choice model, so readings are
#    (a) free-choice trials only, (b) all choice trials with QL and QR carried through the
#    session. The text says the full model has "six variables (including the constant
#    variable for β0)" and "26 models" (2^6 garbled), which does not match the eight terms
#    listed; reading (c) of the subset search keeps all eight terms as candidates (2^8 subsets,
#    or 2^7 with the constant always in).
#  - O8, FQ model. The update and choice equations are missing. The text's description implies
#    Q of the chosen action moves toward kappa1 after reward and toward -kappa2 after no reward
#    with rate alpha1, the unchosen Q decays toward 0 with rate alpha2 (= alpha1 in FQ), and
#    P(left) is a logistic function of QL - QR. Initial values, the priors of the particle
#    filter and the search for sigma_alpha and sigma_kappa are referred to Ito and Doya (2009).
#    5000 particles; QL and QR are the means of the predictive distribution.
#
# Paper inconsistencies noted: the Results cite "Fig. 7F" for state-value neurons, meaning
# Fig. 8F; the Discussion cites Fig. 8C for action-value neurons, meaning Fig. 8E; E7 is defined
# as "2 s after E8".
#
# All claims use the dataset's own recordings and behaviour (data: dataset). The paper relies on
# no outside data.
