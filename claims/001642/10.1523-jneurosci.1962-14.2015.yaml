    value: 0.5080
    tolerance: 0.0508
  criterion: The paper names the model only as a regular actor-critic model with constant
    parameters (Sutton and Barto, 1998) and gives neither its equations nor its parameters.
    "Constant" is read as in Fig. 2G, parameters constant across sessions, fitted by maximum
    likelihood on the training sessions and scored on the test sessions as in
    fig2g-fq-variable-best. The readings of the model are the tabular actor-critic for one
    state and two actions (critic V and actor preferences both updated by the reward prediction
