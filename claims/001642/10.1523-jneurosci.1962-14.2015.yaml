- id: fig2c-extinction-differs
  statement: During extinction tests, choice probabilities for the left and right tones differ
    significantly from those for the choice tone.
  source: Results, Behavioral performance, paragraph 1; Figure 2B and 2C
  quote: Choice probabilities during extinction tests were significantly different between the
    left and right tones and the choice tone (Fig. 2C; p < 0.0001, χ2 test)
  statistics:
  - test: χ2 test
    p: 0.0001
    p_relation: "<"
  criterion: Choices over the five trials of each extinction test (Fig. 2C legend). The
    contingency table of the χ2 test is not given. Readings are (a) left-tone trials against
    choice-tone trials after a left-optimal free-choice block, and right-tone trials against
    choice-tone trials after a right-optimal block, each a 2 x 2 table of left and right
    choices; (b) one 2 x 2 table of choices of the previously optimal action, fixed tones pooled
    against the choice tone pooled. Reproduced when, under every reading, every test gives p <
    0.0001 with the fixed tones further from 50% than the choice tone.
- id: fig2b-extinction-time-course
  statement: In extinction tests the choice-tone choice probability shifts toward 50% after the
    first unrewarded trial, while the left- and right-tone choice probabilities stay biased
    after five unrewarded trials.
  source: Results, Behavioral performance, paragraph 1; Figure 2B
  quote: whereas the choice probabilities for the free-choice tone shifted toward 50% following
    the first nonrewarded trial (orange lines, Fig. 2B), choice probabilities for the left and
    right tones remained biased even after five no-reward trials
  criterion: Left-choice probability at each of the five extinction trials, per tone, with the
    choice tone split by the optimal action of the previous free-choice block (Fig. 2B legend),
    with 95% confidence intervals of a binomial proportion (the interval method is not given;
    the readings are Wilson and Clopper-Pearson intervals). Reproduced when, under both readings,
    (1) for both choice-tone groups the probability at trial 2 is closer to 0.5 than at trial 1,
    and (2) at trial 5 the 95% interval for the left tone lies above 0.5 and that for the right
    tone below 0.5.
- id: fig2d-f-decision-trees
  statement: Choice-tone choices depend on the previous one or two trials' actions and rewards
    (a decision tree that expands symmetrically), while left- and right-tone choices stay
    biased toward left and right whatever the previous experience.
  source: Results, Behavioral performance, paragraph 2; Figure 2D to 2F
  quote: The decision tree for choice tones expands symmetrically (Fig. 2D), indicating that
    action selection was sensitive to past experiences ... action probabilities for the left or
    right tones (in both single and double fixed-choice blocks) are biased toward 1 (Fig. 2E) or
    0 (Fig. 2F), respectively, indicating insensitivity to past experiences
  criterion: Conditional left-choice probabilities for d = 1 and d = 2 from counts NL and NR after
    each experience sequence, within choice-tone trials and within left- and right-tone trials
    (single and double fixed-choice blocks), as the Methods define (Decision trees); 95%
    binomial intervals as in fig2b-extinction-time-course. Experience sequences are taken over
    consecutive trials of the same tone within a session (the Methods say "sequences of choice
    behavior in choice-tone trials"); whether they run across block borders is open, and both
    are readings. The paper gives no test or threshold. Reproduced when, under every reading,
    (1) for choice tones P(L) after L1 exceeds P(L) after R1 with non-overlapping 95% intervals,
    and (2) every d = 1 and d = 2 conditional probability is above 0.5 for the left tone and
    below 0.5 for the right tone. For (2), the readings are all sequences, and sequences with
    at least 10 trials (a sparse branch is not a reliable estimate; the paper gives no floor).
- id: fig2g-fq-variable-best
  statement: Of six DFQ-learning variants and the Markov models, the FQ-learning model with
    time-varying parameters predicts held-out rat choices in free-choice blocks best.
  source: Results, Behavioral performance, paragraph 5; Figure 2G
  quote: found that the FQ-learning model with time-varying parameters predicted rat behaviors
    best (Fig. 2G). Prediction accuracy was higher than that of Markov models
  statistics:
  - about: other models against FQ-learning (variable), as marked in Fig. 2G (which models carry
      the marks could not be read)
    test: paired-sample Wilcoxon's signed rank test
    p: 0.05
    p_relation: "<"
  criterion: Choice-tone trials of free-choice blocks; models Q (alpha2 = kappa2 = 0), FQ
    (alpha1 = alpha2) and DFQ, each with constant or time-varying parameters, and Markov models
    of order d (Methods, Evaluation of decision-making models). Sessions split into training
    and test halves (the paper used 101 and 101 sessions; how the split was made is not
    given, so the readings are alternate sessions and a seeded random half, both shown);
    parameters fitted by maximum likelihood on training data, the time-varying models with a
    particle filter of 5000 particles. Model equations as O8 (opening comment). The normalized
    likelihood formula is missing; it is read as the geometric mean of per-trial choice
    likelihoods, which is 0.5 at chance, computed per test session for the paired Wilcoxon
    test across sessions. Reproduced when, under every reading, FQ (variable) has the highest
    normalized likelihood of test data and exceeds every Markov model.
- id: actor-critic-near-chance
  statement: A regular actor-critic model with constant parameters predicts test choices close
    to chance, with normalized likelihood 0.5080.
  source: Results, Behavioral performance, last paragraph
  quote: We also tested a regular actor-critic model with constant variables (Sutton and Barto,
    1998), but the normalized likelihood of test data was close to the chance level (0.5080; data
