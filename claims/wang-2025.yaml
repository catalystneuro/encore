    and within R; 20-fold cross-validation, AUC averaged over folds. Classifier, regularized logistic
    regression with the penalty from nested leave-one-out cross-validation (Methods); the code uses
    RidgeClassifierCV with balanced class weights and 20 random folds, a variant. A neuron is choice-
    (movement-) modulated when its choice (movement) AUC exceeds 0.65 (Methods) and the other does
    not; the ratio is the count of choice-only over movement-only neurons (code,
    get_medulla_alm_fraction_stats, which prints medulla 171/142, ALM 710/148, midbrain 678/159).
    The Methods say "exceeded 0.65" and that some neurons pass for both; counting all neurons above
    0.65 for each AUC (both included) is a variant to be shown.
    Test (code), two-sided binomial test of medulla's choice-only count out of its choice-only plus
    movement-only count against the pooled proportion of the two areas compared, p times 2.
    Reproduced when the three ratios are within tolerance and both corrected p < 0.001.
  depends_on:
