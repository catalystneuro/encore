# Claims for Wang, Kurgyis, Chen, Kang, Chen, Liu, Liu, Svoboda, Li & Druckmann (2025), "Brain-wide
# analysis reveals movement encoding structured across and within brain areas", Nature Neuroscience,
# doi:10.1038/s41593-025-02114-x, on dandiset 000363 (Mesoscale Activity Map Dataset), which the
# paper reuses.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-20,
# protocol as stated in docs/protocol.md (pilot-18).
#
# Text read. The version of record (published 18 November 2025, open access), full text from the
# publisher's page: main text, figure legends, Methods, Extended Data Figs. 1 to 10 legends. The
# Supplementary Information PDF (41593_2025_2114_MOESM1_ESM.pdf; Supplementary Discussion on the
# session-independent autoencoder, Supplementary Table 1 on thalamic nuclei, Supplementary Figs. 1
# and 2) was read from its extracted text in the same file. The Reporting Summary and the three
# Supplementary Videos were not read; no claim rests on them. Figures were not opened; every
# number used below is printed in the text or a legend.
#
# Code read. github.com/druckmann-lab/MapVideoAnalysis at commit 7d27624 (7d276243db16db5af6da68a48de7720ef77007c2),
# the repository the paper links (Zenodo doi:10.5281/zenodo.16740762). It holds the package
# VideoAnalysisUtils (ridge prediction and explained variance, functions_for_r2.py; single-neuron
# choice and movement AUCs, functions_for_auc.py; area selection, nearest-neighbour and spatial
# uniformity tests, functions.py; figure classes and their statistics, plotting_utils.py, where
# the paper's Figs. 2, 4, 3, 5 and 7 are the classes Figure2, Figure3, Figure4, Figure7 and
# Figure6), the cluster scripts under Sherlock/ (train/test splits, ridge fits at each time shift,
# AUC runs) and figure notebooks under Notebooks/ with their printed outputs. The deep networks
# (autoencoder, end-to-end) are in a separate repository, github.com/kurgyis/BehaviorVideo, which
# could not be fetched (not public at the time of reading); a light version is at
# github.com/druckmann-lab/VideoAnalysisTools (commit 5850625), read only for its file list. The
# code that decodes choice from video (Fig. 6, the Calinski-Harabasz scores, the correlation with
# performance, and the single-trial video predictions used in Fig. 7) is not in either repository:
# MapVideoAnalysis reads its output from a precomputed file (cal4cat-delay.pickle). Details of Fig. 6
# that the Methods leave open are therefore open below.
# Where the Methods are silent the criteria follow this code and say so. Where the code differs from
# the Methods, the Methods come first and the code's choice is named as a variant. Some printed
# outputs in the notebooks differ from the paper (the method improvements print as 174%, 377% and 83%
# against the paper's 155%, 330% and 76%), so the code's data files are not exactly those of the
# paper; the claims hold to the paper's numbers.
#
# Data the paper describes. A reanalysis of the Mesoscale Activity Map data (Chen et al., Cell 2024,
# ref. 30; DANDI 000363, cited as version 0.230822.0128; the code's README cites 0.231012.2129). The
# Methods say 28 mice (25 VGAT-ChR2-EYFP, one C57BL/6J, one Sst-IRES-Cre x Ai32, one Emx1-IRES-Cre x
# R26-LNL-GtACR1-Fred-Kv2.1), 3 to 7 months old; the Supplementary Discussion says 22 mice and 100
# sessions for the session-independent autoencoder. Task. Delayed response; a series of pure tones
# in the sample epoch (12 kHz instructs lick left, 3 kHz lick right), a 1.2 s delay without licking,
# then a go cue and a response epoch of directional licking for water. Epochs in the code, relative
# to the go cue: sample -1.85 to -1.2 s, delay -1.2 to 0 s, response 0 to 1.5 s; the epoch averages
# leave out 150 ms at each edge, which the code takes as -1.7 to -1.35, -1.05 to -0.15 and 0.15 to
# 1.2 s. Trials with photoinhibition, free water, early licks or no response are excluded from all
# analyses. Recordings. Two to five Neuropixels probes at once, in ALM (both hemispheres in some
# sessions), medulla, midbrain, striatum, thalamus and other areas; Kilosort spike sorting with the
# project's quality control; each unit registered to the Allen CCF v3 with an annotation. More than
# 50,000 neurons in total. Firing rates are spike counts in 40 ms bins at a 3.4 ms stride; neurons
# below 2 Hz are excluded. Video. 300 Hz side and bottom views of face and paws; only the side view
# is used. DeepLabCut markers (jaw, nose and tongue in the Results and Fig. 1e; the Methods list
# jaw, paws and tongue), with 5-sigma velocity outliers imputed and the occluded tongue set to its
# mean. A 16-dimensional autoencoder embedding per frame (encoder as given in the Methods, linear
# decoder, one per session). Sample sizes. 105 sessions for the method comparison (Fig. 2), 106
# sessions for choice decoding (Fig. 6), 87 sessions in Fig. 7d, 80 sessions with video choice AUC
# above 0.6. Insertions per area for Fig. 2b: medulla 36, midbrain 79, ALM 77, striatum 67,
# thalamus 62. An insertion in the code is one probe file of one session (a region and hemisphere).
#
# Outside data. The paper states that all data are on DANDI. The authors also deposited processed
# data for the figures (Zenodo doi:10.5281/zenodo.16740783; it holds the Allen hierarchy table
# mousebrainontology_heirarchy_cortexMaskExclusions21_sc.xlsx that the code uses to group CCF labels
# into areas) and go-cue aligned single-trial autoencoder embeddings (a Google Drive folder linked
# from the code's README, not pinned). The claims use the dataset; whether it holds the raw video
# the embeddings and end-to-end networks need is the author's to find, and the authors' embeddings
# are the named alternative input. The grouping of CCF labels into areas can be rebuilt from the
# Allen ontology (structure tree) where the Zenodo table is not used.
#
# Method choices fixed from the paper and code, used by many claims.
# - Prediction of activity (Methods, Prediction of neural activity). At each time bin t, features at
#   five frames t-6.8, t-3.4, t, t+3.4 and t+6.8 ms are concatenated (80 dimensions for the
#   embedding, 15 for three markers) and ridge regression predicts every neuron's rate at t across
#   trials. The penalty is chosen by inner fivefold cross-validation from 0.001, 0.01, 0.1, 1 and 10
#   (code, RidgeCV).
# - Explained variance (Methods, Epoch-averaged explained variance; code). R2 (sklearn r2_score) of
#   the test-trial rates at each time bin, negatives set to 0, averaged over folds, then over the
#   bins of the epoch with 150 ms trimmed at each edge.
# - Neuron filter. Rate above 2 Hz and explained variance above 0.01 (Methods). The code uses the
#   epoch rate for the area comparison, the trial-average rate elsewhere, and 0.005 in place of 0.01
#   for the method comparison; these are named in the criteria.
# - Splits. Fig. 2 and Extended Data Figs. 2 and 3: one stratified random split with 64 test trials
#   (strata lick direction by correctness), the same for all three methods (Methods; code uses
#   StratifiedShuffleSplit, random_state 0). Figs. 3 to 5: fivefold cross-validation stratified by
#   lick direction and correctness. Figs. 6 and 7: correct trials only, 20-fold cross-validation.
# - Areas. Medulla, Midbrain, Striatum and Thalamus are the neurons whose CCF annotation falls under
#   that Allen structure; ALM is the neurons of the probes targeted to ALM (code, get_single_area_inds:
#   the probe file name contains ALM), and ALM neurons are removed from other cortical groups.
schema_version: 2
paper: doi:10.1038/s41593-025-02114-x
claims:
- id: link-authors-deposit
  kind: link
  statement: The authors' processed-data deposit can be linked to the dataset; the CCF annotation
    names of its area grouping are the dataset's unit annotations, and the sessions of its Fig. 6
    and 7 file are sessions of the dataset.
  source: Zenodo doi:10.5281/zenodo.16740783, members area2anno.json and cal4cat-delay.pickle; code
    github.com/druckmann-lab/MapVideoAnalysis at commit 7d27624 (area grouping, get_single_area_inds)
  data: with_labels
  criterion: Annotation names are matched after removing commas (the deposit's names have none),
    sessions by mouse (the files' subject description, for example SC026) and date (MMDDYY), a
    suffix _s<n> naming one of two sessions on a day. Reproduced when each of the 16 areas of
    area2anno.json has at least one name found among the dataset's anno_name values, and at least
    95% of the 106 session names match a dataset session, with as many dataset files as named
    sessions on each day; partially reproduced when one of the two holds. The number of matched
    annotations and the mice of the matched sessions are reported.
- id: data-scale
  statement: The analysis covers more than 50,000 neurons recorded in more than a dozen cortical and
    subcortical structures, simultaneously with high-speed video of orofacial movements.
  source: Main text, Introduction, paragraph 4
  quote: we analyzed recordings of more than 50,000 neurons, recorded in more than a dozen cortical
    and subcortical structures, simultaneously with high-speed video of orofacial movements
  criterion: Counted over the sessions of the dataset with video, after the paper's trial
    exclusions. Reproduced when the number of units passing the dataset's quality labels exceeds
    50,000 and they fall in more than 12 distinct Allen structures at the level of the areas the
    paper names (for example ALM, other isocortex, striatum, thalamus, midbrain, medulla, pons,
    cerebellum). The paper does not say whether the count is before or after the 2 Hz filter; both
    counts are reported, and the claim holds if either exceeds 50,000.
  data: with_labels
  depends_on:
  - link-authors-deposit
