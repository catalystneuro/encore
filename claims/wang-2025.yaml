- id: edfig10-subtraction-consistent
  statement: Subtracting the video-predicted activity and reassessing choice selectivity gives results
    largely consistent with the trial-grouping approach.
  source: Results, Activity related to uninstructed movement and decision-making, paragraph 3; Extended
    Data Fig. 10; Methods, Defining choice-modulated neurons after subtraction of movement-related
    activity
  quote: We also tested a different approach, predicting and then subtracting movement-related neural
    activity, followed by reassessing choice selectivity, and found largely consistent results
    (Extended Data Fig. 10 ).
  criterion: Methods. Per neuron, the embedding-predicted rate (fivefold cross-validated, zero shift)
    subtracted at each time bin; delay-epoch mean residual; regularized logistic regression of choice
    with fivefold cross-validation and nested selection of the penalty (code, functions_for_r2.calculate_auc,
    C in 0.01, 0.1, 1, 10, 100); choice-modulated when AUC > 0.65. The paper gives no measure of
    consistency; the one fixed here, from Extended Data Fig. 10c, is that in each of the six areas of
    Fig. 7d the fraction classified choice-modulated after subtraction is higher among the
    trial-grouping choice-modulated neurons than among the trial-grouping movement-modulated
    neurons. Reproduced when this holds in at least five of the six areas; partially reproduced in
    three or four. The Spearman correlation of the two choice AUCs across neurons is reported.
