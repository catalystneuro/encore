  source: Methods, Cortical thickness normalization and layer assignment
  quote: We obtained soma depth information for 1,284 neurons out of 1,329 (45 neurons were
    mistakenly recorded using a solution with insufficient biocytin concentration, and we could
    measure soma depths for only 2 of those; for 2 other neurons the measurements could not be
    carried out because the slices were lost).
  expected:
