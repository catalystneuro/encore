    Reduced-rank regression
  quote: The selected model used 25 genes with a 5-dimensional latent space and achieved a
    cross-validated R 2 of 0.38. ... The cross-validated correlations between the first three
    pairs of projections were 0.90, 0.74, and 0.67, respectively.
  data: with_inputs
  expected:
  - quantity: cross-validated R2
    value: 0.38
    tolerance: 0.038
  - quantity: correlation of the first projections
    value: 0.90
    tolerance: 0.09
  - quantity: correlation of the second projections
    value: 0.74
    tolerance: 0.074
  - quantity: correlation of the third projections
    value: 0.67
    tolerance: 0.067
  criterion: As the Methods and the code (reduced-rank-regression.ipynb, sparseRRR.py) do it. The
