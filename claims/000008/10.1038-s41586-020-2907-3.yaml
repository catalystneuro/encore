- id: hold-time-yield
  statement: The cDNA yield was not correlated with the recording hold time (Spearman
    correlation -0.01).
  source: Methods, Patch-seq recording procedures, last paragraph
  quote: The resulting cDNA yield was not correlated with the hold time (Spearman correlation
    −0.01).
