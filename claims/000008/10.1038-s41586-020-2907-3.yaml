# Claims for Scala, Kobak et al. (2021), "Phenotypic variation of transcriptomic cell types in
# mouse motor cortex", Nature 598:144-150, on dandiset 000008.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-20,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record, open access (CC BY), as served by Europe PMC (PMC8113357):
# main text, Methods, figure legends and Extended Data figure legends. Not in the text: the
# Extended Data Tables 1 and 2 (descriptions of the t-types), the Supplementary Files 1 to 3
# (galleries of morphologies and traces, dot plots of all features, the list of morphometric
# statistics) and the figures themselves. No PDF was supplied. No claim below rests on numbers
# that are only in those items; the Extended Data figures are read from their legends only.
#
# Code read: https://github.com/berenslab/mini-atlas at commit
# 3bf98a524b8e48aa8647e1b9ae8f2351d9c712c9. It holds the analysis notebooks (feature extraction
# from the NWB files in preprocess-ephys-files.ipynb with ephys_extractor.py and
# ephys_features.py; t-type assignment; reduced-rank regression with sparseRRR.py; the
# t-SNEs, kNN family classifiers, normalized variances and Leiden entropies in
# phenotype-tsne.ipynb; the distance correlations of Fig. 4 and Extended Data Fig. 7 in
# families.ipynb; Extended Data Fig. 6 in physiological-temperature.ipynb) and the paper's
# preprocessed data: per-cell metadata (m1_patchseq_meta_data.csv, 1,329 cells, with t-type,
# family, soma depth, cortical thickness, Cre line, mouse, exclusion reasons), the 29
# electrophysiological features of 1,328 cells (m1_patchseq_ephys_features.csv), exon and intron
# counts, morphometric features and z-profiles. Choices the code fixes where the Methods are
# silent are cited in the criteria as "the code".
#
# The data the paper used. 1,329 neurons from 266 adult mice (median age 75 days) of ten
# genotypes (wild type and nine Cre/Ai9 lines), patched in acute coronal slices of primary motor
# cortex at room temperature (25 degrees C). Each neuron got 600 ms current steps from -200 pA in
# 20 pA increments up to 1,380 pA (Methods). Measured variables: the membrane voltage traces,
# from which 29 features are extracted (17 used in all statistics); per cell, the soma depth and
# cortical thickness (normalized soma depth, and a layer from Nissl boundaries 0.07, 0.29 and
# 0.73; the targeted layer for the 45 cells without depth); the transcriptome (exon and intron
# counts), from which each cell gets a t-type and a family; and for 646 cells a morphological
# reconstruction. Families are Lamp5, Sncg, Vip, Sst, Pvalb (inhibitory) and IT, ET, NP, CT
# (excitatory; the code puts the L6b t-types in CT).
#
# What is where. The dandiset is described as holding the intracellular electrophysiological
# recordings of these neurons. The paper says sequencing data are at NeMO
# (http://data.nemoarchive.org/biccn/grant/zeng/tolias; the code's README gives NeMO accession
# dat-kq04hua and GEO GSE163764), reconstructions at the Brain Image Library
# (https://download.brainimagelibrary.org/3a/88/3a88a7687ab66069/), and all preprocessed data
# and metadata in the mini-atlas repository. Transcriptomic distances use the reference
# single-cell 10x v2 data set of Yao et al. 2021 (doi:10.1038/s41586-021-03500-8), which the
# code reads as a reduced pickle (10X_cells_v2_AIBS.pickle, Zenodo record 5118962, or rebuilt
# with allen-data-preprocess.ipynb). Claims that need the per-cell t-type or family are marked
# `dataset`, as the t-type is part of the paper's record of each recorded cell; whether the
# files carry it, or it must come from the paper's metadata table through a link claim, is for
# the author to find. Claims that need gene counts, the reference data or morphology are marked
# `with_inputs` or `elsewhere`.
#
# Common method, from the Methods and the code, used by several criteria. "The 17 features":
# the 29 extracted features less afterdepolarization, burstiness, rebound number of APs, sag
# area, sag time, wildness, AP Fano factor, ISI Fano factor, latency at +20 pA, AP amplitude
# average adaptation index, ISI average adaptation index and spike frequency adaptation; AP CV,
# ISI CV, ISI adaptation index and latency log-transformed (Methods; the code's RRR notebook
# log-transforms only the first three, named as a variant in fig2-rrr). "The ephys
# representation": the 17 features standardized over all cells with all 17 defined (1,320
# cells, excluded and unassigned cells included, as the code does), turned into all 17
# principal components, all scaled by the standard deviation of PC1 (Methods, t-SNE
# visualization; code phenotype-tsne.ipynb). "Excluded cells": the 5 cells with a t-type that
# the Methods exclude (4 with excitatory RNA but inhibitory phenotype, 1 outside MOp; Methods,
# t-type assignment). The code's metadata table lists 7 cells with an exclusion reason; 2 of the
# 6 RNA/phenotype mismatches there already failed transcriptomic quality control and have no
# t-type, so both sources give the same 5. "Layer": from normalized soma depth with the boundaries above, the targeted layer
# where depth is missing (Methods, Cortical thickness normalization; code).
schema_version: 2
dataset:
  archive: dandi
  id: "000008"
paper: doi:10.1038/s41586-020-2907-3
