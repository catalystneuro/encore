  expected:
    quantity: Spearman correlation
    value: -0.01
    tolerance: 0.05
  criterion: As the code does it (patch-seq-data-load.ipynb, last cell), the Spearman correlation
    over cells with both values between hold time and the log of cDNA yield (yield from the
