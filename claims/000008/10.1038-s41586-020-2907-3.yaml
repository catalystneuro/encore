  quote: leaving 1,227 neurons for further analysis (817 inhibitory, 410 excitatory; 369 and 269
    with morphological reconstructions, respectively). The resulting data set covered 77 out of
    the 90 neuronal t-types (Fig. 1a )
  expected:
  - quantity: neurons with a t-type
    value: 1227
    tolerance: 0
  - quantity: inhibitory neurons with a t-type
    value: 817
    tolerance: 0
  - quantity: excitatory neurons with a t-type
    value: 410
    tolerance: 0
  - quantity: t-types covered
    value: 77
    tolerance: 0
  criterion: Counts of the paper's t-type labels for the dandiset's cells, excluded cells left
