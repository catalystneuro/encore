- id: stimulus-protocol
  statement: Each neuron was stimulated with 600 ms current pulses from -200 pA upwards in 20 pA
    steps up to 1,380 pA (sometimes stopped earlier), with 1.3 or 1.4 s between pulses, and for
    most neurons the series was repeated several times.
  source: Methods, Patch-seq recording procedures, paragraph 4
  quote: Each neuron was injected with 600-ms-long current pulses starting from −200 pA and up to
    1,380 pA with 20-pA increment steps (in some cases stimulation was stopped before reaching 1,380
    pA). There were 1.3- or 1.4-s intervals between successive current pulses, depending on the used
    setup. For most neurons, the stimulation was then repeated multiple times from the beginning.
  criterion: For every cell, the stimulus of each sweep is read from the file. A cell conforms
    when every step lasts 600 ms (to within 1 ms), the first step of each series is -200 pA,
    consecutive steps differ by 20 pA, and the largest is at most 1,380 pA. The interval
    between pulses is taken as onset to onset, the reading the code's 0.1 s to 0.7 s stimulus
    window within each sweep allows, or as offset to onset; both are reported, and an interval
    conforms when it is 1.3 or 1.4 s (to within 0.05 s) under either. "Most" neurons repeated
    is read as more than half of cells with a second series starting again at -200 pA. The
    paper gives no margins; the 1 ms and 0.05 s timing margins and the 95% and 80% shares of
    cells are standard choices for "each neuron" under recording jitter, not the paper's, and
    are named as such. Reproduced when at least 95% of cells conform on steps and intervals and more than half
    have repeats; partially reproduced when at least 80% conform; not reproduced otherwise.
