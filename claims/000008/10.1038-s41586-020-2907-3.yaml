# --- Family separability with morphology ----------------------------------------------------
- id: fig3d-morph-combined
  statement: Between inhibitory families, separability is weaker with morphological features
    than with electrophysiological ones, and it is strongest with the two combined.
  source: Results, Distinct phenotypes of major families, paragraph 4; Figure 3b-d
  quote: The separability between inhibitory families was weaker than with electrophysiological
    features (Fig. 3d ). The between-family separability was strongest when we had combined
    electrophysiological and morphological features into a joint representation (Fig. 3c, d ),
    showing that these sets of properties are not redundant.
  data: with_inputs
  criterion: The three representations of the Methods (t-SNE visualization) and the code
    (phenotype-tsne.ipynb), the kNN classifier as in fig3d-families-ephys. Morphology is the
    paper's published morphometric features and z-profiles (mini-atlas), combined with the
    dandiset's electrophysiology for the 628 cells with both. Separability is the mean of the
    diagonal of the confusion matrix, over the four inhibitory families for the first part and
    over all seven for the second (the paper names no summary; the mean diagonal is read from
    "mostly diagonal"). The Methods call the electrophysiological block of the combined
    representation "16-dimensional", while they build 17 PCs and the code stacks all 17; both
    are run, (a) the first 16 PCs and (b) all 17, and if they give different outcomes the
    claim is blocked as methods_underspecified. Excluded cells are left out (Methods); the
    code's handling, as in fig3d-families-ephys, is shown as a variant. Reproduced when the inhibitory mean is lower for morphology than for
    electrophysiology and the seven-family mean is highest for the combined representation.
  depends_on:
  - link-metadata-table
# --- Variability of individual t-types ------------------------------------------------------
- id: fig5a-ttypes-between-families
  statement: Most t-types are classified into their own family from electrophysiology, but some
    lie between two families; many Sst Pvalb Calb2 neurons are classified as Pvalb, Lamp5
    Egln3_1 neurons have Vip- and Sst-like firing, and Vip Mybpc1 neurons often have Sst-like
    firing.
  source: Results, Variability in individual t-types, paragraph 1; Figure 5a and legend
  quote: Most t-types could be unambiguously placed into the correct family (Fig. 5a ), but some
    t-types were in between two families. For example, many Sst Pvalb Calb2 neurons were
    classified as belonging to the Pvalb subclass on the basis of electrophysiology. ... Vip
    Mybpc1 neurons often had Sst -like firing.
  criterion: As the code does it (get_type_confusion in phenotype-tsne.ipynb), the classifier of
    fig3d-families-ephys applied to the cells of each t-type with at least 10 cells (Fig. 5a
    legend); the legend marks a t-type misclassified when more than 25% of its cells go to
    wrong families. Parts, (i) more than half of these t-types have at most 25% wrong; (ii) Sst
    Pvalb Calb2 has more than 25% classified as Pvalb; (iii) Lamp5 Egln3_1 has more than 25%
    classified as Vip and Sst together; (iv) for Vip Mybpc1 more than 25% classified as Sst,
    the t-type read as (a) any of the Vip Mybpc1 t-types with at least 10 cells or (b) all
    Vip Mybpc1 t-types pooled. Reproduced when all four hold (iv under one reading); partially
    reproduced when (i) and at least two others hold. A t-type below 10 cells is reported and
    its part not judged. Excluded cells are left out (Methods); the code's get_type_confusion
    keeps the 5 excluded cells in their t-types and as labelled neighbours, shown as a variant.
  depends_on:
  - link-metadata-table
- id: fig5b-ttype-variability
  statement: Many t-types have a normalized total variance of electrophysiological features well
    above that of k-means clusters; some, such as Pvalb Vipr2_2 (chandelier cells), appear
    homogeneous, while Vip Mybpc1_2 is highly variable.
  source: Results, Variability in individual t-types, paragraphs 2 and 3; Figure 5b
  quote: We found that many t-types had total variance substantially above the variances of the
    k -means clusters (Fig. 5b ) ... some of them, such as Pvalb Vipr2_2 (chandelier cells), appeared morpho-electrically homogeneous. By contrast,
    Vip Mybpc1_2 was marked as having high electrophysiological variability
  criterion: As the Methods (T-type variability analysis) and the code (get_type_variability and
    get_cluster_variability in phenotype-tsne.ipynb) do it, in the ephys representation. For
    each t-type with at least 10 cells, the sum of its per-dimension variances over that of all
    1,320 cells; k-means (scikit-learn defaults, random_state 42, as the code) with K the number
    of such t-types on their cells pooled; the band from the smallest to the largest variance
    of clusters with at least 10 cells. "Substantially above" is read as above the band's top.
    "Many" is read as (a) at least a quarter or (b) at least a third of the t-types. Reproduced
    when "many" holds under one reading, Pvalb Vipr2_2 is not above the band (if it has at
    least 10 cells), and Vip Mybpc1_2 is above it; partially reproduced when two of the three
    hold. T-type members are cells with a t-type and no exclusion (Methods); the code's
    get_type_variability keeps the 5 excluded cells in their t-types, shown as a variant.
  depends_on:
  - link-metadata-table
- id: ed8-leiden-entropy
  statement: An alternative analysis using the entropy of Leiden cluster assignments within each
    t-type often highlights the same t-types as variable.
  source: Results, Variability in individual t-types, paragraph 3; Extended Data Figure 8g-l
  quote: an alternative analysis using entropies of Leiden clustering 35 often highlighted the same
    t-types as variable (Extended Data Fig. 8 ).
  criterion: As the Methods and the code (phenotype-tsne.ipynb, Leiden section) do it. kNN graph
    with k = 10 on the ephys representation (directed, scikit-learn kneighbors_graph), Leiden
    (leidenalg, RBConfigurationVertexPartition) at resolution 2, the code's "fine" setting for
    electrophysiology, 100 repetitions, repetition i with Leiden seed i and numpy seed i for
    the subsampling, each t-type with at least 10 cells subsampled to 10 cells, natural-log
    entropy of its cluster labels (scipy.stats.entropy); median entropy per t-type. The paper
    gives no measure of agreement with Fig. 5b; the reader's reading is a Spearman correlation
