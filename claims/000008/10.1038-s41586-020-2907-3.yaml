  source: Results, Continuous phenotypic variation, paragraph 1; Figure 4a
  quote: For example, electrophysiological properties of the t-types within the Vip subclass
    varied continuously across the transcriptomic landscape; the membrane time constant, for
    instance, had its largest values close to the Sncg subclass and gradually decreased towards
