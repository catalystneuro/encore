- id: fig1b-depth-layers
  statement: Within-type distributions of soma depth agree with the layer-specific names of the
    excitatory t-types.
  source: Results, Patch-seq of mouse primary motor cortex, paragraph 3; Figure 1b
  quote: Within-type distributions of soma depths (Fig. 1b ) agreed well with previous data 4 and
    with the layer-specific nomenclature of excitatory t-types, confirming the validity of our
    t-type assignment.
  criterion: The paper gives no measure, so it is fixed from Fig. 1b's legend. Normalized soma
    depth (depth over cortical thickness) of cells with a t-type, excluded cells left out; for
    each excitatory t-type with at least three cells (the legend's cut for showing medians),
    the median depth is placed in a layer by the Nissl boundaries (L1 below 0.07, L2/3 to 0.29,
    L5 to 0.73, L6 beyond). A t-type agrees when that layer is one its name gives (L2/3; L4/5
    as L2/3 or L5; L5; L5/6 as L5 or L6; L6 and L6b as L6). Reproduced when all such t-types
    agree; partially reproduced when at least 80% do.
  depends_on:
  - link-metadata-table
- id: l45-it1-boundary
  statement: The L4/5 IT_1 t-type is located on the boundary between L2/3 and L5, and probably
    corresponds to the quasi-L4 neurons described before in motor cortex.
  source: Results, Patch-seq of mouse primary motor cortex, paragraph 4; Figure 1b
  quote: We were also able to identify a t-type, L4/5 IT_1, that was located on the boundary
    between L2/3 and L5 and probably corresponds to the quasi-L4 neurons described previously in
    motor cortex 31 .
  criterion: Normalized soma depths of L4/5 IT_1 cells (excluded cells left out). The paper's
    L2/3 to L5 boundary is 0.29 (Fig. 1b legend). The paper gives no measure of "on the
    boundary"; two readings, both run, (a) the t-type's median depth lies closer to 0.29 than
    to the middle of either neighbouring layer (0.18 for L2/3, 0.51 for L5), that is between
    0.235 and 0.40, and (b) the interquartile range of the t-type's depths contains 0.29.
    Reproduced when both hold, not reproduced when neither does; when they differ,
    methods_underspecified. The
    correspondence to quasi-L4 neurons is an interpretation and is not tested.
  depends_on:
  - link-metadata-table
# --- Within-family structure (needs the reference transcriptomes) --------------------------
- id: fig4c-distance-correlation
  statement: Across 200 pairs of t-types from the same family (50 t-types with at least 5
    cells), the transcriptomic and electrophysiological distances between t-types are
    correlated with r = 0.60.
  source: Results, Continuous phenotypic variation, paragraph 3; Figure 4c and legend
  quote: Pooling the pairs across all families, we found that these two distance measures were
    correlated, with r = 0.60 (Fig. 4c , n = 200 pairs; Extended Data Fig. 7 ).
  data: with_inputs
  expected:
  - quantity: Pearson r over within-family pairs
    value: 0.60
    tolerance: 0.06
  - quantity: within-family pairs
    value: 200
    tolerance: 0
  - quantity: t-types with at least 5 cells
    value: 50
    tolerance: 0
  criterion: As the Methods (Within-family analysis) and the code (families.ipynb, cell for the
    main figure) do it. Cells with a t-type, not excluded, with all 17 features; the 17 features
    (four log-transformed) standardized over all cells with all features. T-types with at least
    5 such cells; each t-type's mean feature vector; electrophysiological distance the Euclidean
    distance between means. Transcriptomic distance is the correlation distance (one minus
    Pearson r) between the t-types' mean log(x + 1) UMI counts in the reference single-cell 10x
    v2 data (t-types with at least 10 reference cells), over the 1,000 most variable genes
    across all neural types. Pairs are within-family by the code's family of each t-type name
    (L6b counted with CT). Pearson r over within-family pairs. The Methods do not mention
    excluding any t-type for Fig. 4c; the code leaves out Sst Chodl and Pvalb Vipr2_2. Reading
    (a) is the code's, reading (b) keeps them; the 50 t-types and 200 pairs show which the paper
    used. Reproduced when, under one reading, r is within tolerance; the counts are reported.
    Needs the reference 10x v2 data (Yao et al. 2021) as the code reads them.
  depends_on:
  - link-metadata-table
- id: ed7-within-families
  statement: The correlation between transcriptomic and electrophysiological distances is also
    seen within several individual families and for many individual features.
  source: Results, Continuous phenotypic variation, paragraph 3; Extended Data Figure 7c-n
  quote: The correlation was also observed within multiple individual families and for many
    individual electrophysiological features (Extended Data Fig. 7 ).
  data: with_inputs
  criterion: As the code does it (families.ipynb, the loop over families) and the Extended Data
    Fig. 7 legend says. For each of the families Pvalb, Sst, Vip, Lamp5, IT and CT, t-types with
    at least 5 cells, Sst Chodl and Pvalb Vipr2_2 left out; transcriptomic distance over the 500
    most variable genes of that family's transcriptomic group in the reference 10x v2 data
    (MGE for Pvalb and Sst, CGE for Vip and Lamp5, excitatory for IT and CT); distances as in
    fig4c-distance-correlation; Pearson r over the family's pairs, and, as the code does, for
    each feature alone within each family. The paper gives no p or threshold. "Multiple
    families" is read as (a) at least two or (b) a majority (at least four) of the six families
    with r > 0. "Many features" is read as at least half of the 17 features having r > 0 in at
    least half of the counted families; the code computes per-family feature correlations and
    no pooled one, so this count is the reader's reading, not the paper's. Reproduced when
    the feature part holds and the family part holds under reading (b); partially reproduced
    when it holds only under reading (a). Families with fewer than three t-types are reported
    and not counted.
  depends_on:
  - link-metadata-table
- id: fig4d-it-depth
  statement: Among IT t-types (eight with at least five cells), transcriptomic distances are
