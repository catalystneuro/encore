- id: fig2-family-features
  statement: Pvalb neurons are characterized by high firing rates, while Sst neurons have high
    hyperpolarization sag and rebound.
  source: Results, Distinct phenotypes of major families, paragraph 2; Figure 2 (right biplots)
  quote: 'These groups had distinct electrophysiological properties: for example, as expected,
    Pvalb neurons were characterized by high firing rates while Sst neurons had high values of
    the hyperpolarization sag and rebound'
  criterion: The paper shows this in a biplot and gives no test, so the comparison is fixed from
    its wording. Cells are those with all 17 features, a t-type and no exclusion. Firing rate is
    the maximum number of APs in the 600 ms window (Methods); sag is the sag ratio and rebound
    the rebound (mV). "High" is compared with the other families, under two readings, (a)
    the family median is the highest of the seven families of Fig. 3d (Lamp5, Vip, Sst, Pvalb,
    IT, ET, CT), or (b) the highest of the five groups Fig. 2 separates (Pvalb, Sst, Vip, Lamp5,
    and the excitatory class pooled; Results, paragraph after the Fig. 2 legend). The paper
    gives no test; a two-sided Mann-Whitney test of the group against the other cells is
    reported for information only and does not decide the outcome. Reproduced when, under one
    reading, Pvalb has the highest median maximum AP count and Sst the highest median sag
    ratio and rebound; partially reproduced when two of the three hold.
  depends_on:
  - link-metadata-table
- id: fig3d-families-ephys
  statement: In a k-nearest-neighbour classification of cells into seven transcriptomic families
    from electrophysiological features, the confusion matrix is mostly diagonal, with only the
    ET and IT subclasses strongly overlapping.
  source: Results, Distinct phenotypes of major families, paragraph 3; Figure 3a, d
  quote: 'We quantified this separation using a confusion matrix for k -nearest neighbours (kNN)
    classification of cells into families: it was mostly diagonal, with only the ET and IT
    subclasses strongly overlapping (Fig. 3d ).'
  criterion: As the Methods (kNN classification) and the code (get_family_confusion in
    phenotype-tsne.ipynb) do it. The ephys representation (see the opening comment); k = 10
    nearest neighbours by Euclidean distance, the cell itself left out; neighbours drawn from
    all 1,320 cells with features, those with no t-type labelled as no family; each cell's
    predicted family is the most common label among its neighbours (ties to the label first
    in numpy's sort order, code-point order with the no-family label "low quality" last, as
    numpy's unique and argmax do), and a cell whose prediction is not one of the seven
    families is not counted. Rows are Lamp5, Vip, Sst, Pvalb, IT, ET, CT (Sncg and NP not
    used). The excluded cells are handled in two ways, both run, (a) the Methods', as if they
    had no t-type (no family as neighbours, not counted in rows), and (b) the code's, which
    keeps each excluded cell's RNA family (4 IT, 1 Sst) both as a row and as a neighbour
    label. The paper's own threshold for
    "classified into wrong families" is 25% (Fig. 5a legend). Reproduced when the ET row puts
    at least 25% into IT or the IT row at least 25% into ET, and every other off-diagonal entry
    is below 25%; partially reproduced when ET and IT overlap so and one or two other
    off-diagonal entries reach 25%; not reproduced otherwise. The outcome is the one both
    handlings of the excluded cells give; if they differ, the claim is blocked as
    methods_underspecified. The 34 degree follow-up of the
    same overlap is in dandiset 000035 and not tested here.
  depends_on:
  - link-metadata-table
- id: ed6-it-et-room-features
  statement: At room temperature, the features that differ most between layer 5 IT and ET
    neurons by a two-sided Wilcoxon-Mann-Whitney test, after omitting the upstroke-to-downstroke
    ratio, sag time and sag area, are the sag ratio, input resistance, AP width and rebound.
  source: Extended Data Figure 6a-e legend; the code, physiological-temperature.ipynb, cells 22
    and 23
  quote: The first four panels correspond to features showing the largest IT/ET differences at
    room temperature, according to the two-sided Wilcoxon-Mann–Whitney test statistic (and omitting
    several features that are very correlated with the shown ones ... upstroke-to-downstroke
    ratio, sag time, and sag area).
  criterion: The legend names the features only in the figure; the four are those the code plots
    (featuresToShow, the first four of sag ratio, input resistance, AP width, rebound, AP
    threshold). As in the code, layer 5 IT against layer 5 ET cells (family from the t-type,
    layer as in the opening comment, excluded cells left out), a two-sided Mann-Whitney test for
    each of the 29 features except rebound number of APs, ranked by p. Reproduced when, after
    leaving out UDR, sag time and sag area, the four smallest p are those four features in any
    order; partially reproduced when three of them are.
  depends_on:
  - link-metadata-table
- id: ed6-physiological-temperature
  statement: Follow-up experiments at 34 degrees C confirmed the electrophysiological overlap
    between IT and ET neurons and the continuous variation of rebound across neighbouring
    layer 5 Sst t-types.
  source: Results, Distinct phenotypes of major families, paragraph 3, and Continuous phenotypic
    variation, paragraph 2; Methods, Experiments at physiological temperature; Extended Data
    Figure 6
  quote: We confirmed the electrophysiological overlap between IT and ET neurons in follow-up
    experiments at 34 °C (Extended Data Fig. 6 ).
  data: elsewhere
  where: DANDI dandiset 000035 (physiological temperature recordings); features and metadata in
    mini-atlas data/m1_patchseq_phys_temp_* at commit 3bf98a524b8e48aa8647e1b9ae8f2351d9c712c9
  criterion: Recorded for coverage. The 34 degree recordings (185 neurons from 8 mice; Methods)
    are not in this dandiset, and the paper gives no measure of the IT/ET overlap at 34 degrees
    (Extended Data Fig. 6f, g show it in two-dimensional plots only). Not tested here.
# --- Transcriptomic coverage ----------------------------------------------------------------
