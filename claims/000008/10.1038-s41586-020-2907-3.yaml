- id: fig5d-sst-pvalb-calb2-firing
  statement: Sst Pvalb Calb2 cells vary widely in maximum firing rate, but high-firing cells are
    mostly grouped in one part of the transcriptomic landscape.
  source: Results, Variability in individual t-types, paragraph 3; Figure 5d
  quote: Similarly, Sst Pvalb Calb2 cells had high variability in terms of the maximum firing rate,
    but high-firing cells were mostly grouped in one part of the transcriptomic landscape (Fig. 5d
