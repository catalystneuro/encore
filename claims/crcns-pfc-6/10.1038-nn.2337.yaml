# Claims for Peyrache, Khamassi, Benchenane, Wiener & Battaglia (2009), Nat Neurosci 12:919-926,
# on CRCNS data set pfc-6 (doi:10.6080/K0KH0KH5).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-05,
# protocol as stated in docs/protocol.md (Reader), version pilot-13.
#
# Text read: the version of record, as supplied under paper/ (PyMuPDF text of the journal PDF),
# with its Results, Discussion, figure legends and Online Methods, and the supplement
# (41593_2009_BFnn2337_MOESM12_ESM.pdf), from which the Supplementary Discussion, the legends of
# Supplementary Figures 2 to 13 and Supplementary Table 1 were read. The legend of
# Supplementary Figure 1 (histology) is not in the extracted text; no claim rests on it. The PDF
# pages could not be rendered here, so no figure was read from the image. The extracted text
# prints some signs as other glyphs. "P o" is P <, "P 4" is P >, "n 1⁄4" is n =, "B" before a
# number is "about", and "10�30" is 10 to the power -30. Quotes keep these glyphs as printed,
# and the p-values below are read from them; the quote checker cannot find p-values printed as
# powers of ten, which were confirmed by reading. The paper links no analysis code, so none was
# read; every method below is from the Online Methods, the figure legends or the supplement.
#
# Data the paper used. Four male Long-Evans rats (rats 15, 18, 19 and 20), a drive of six
# recording tetrodes in the right prelimbic cortex (mPFC) and three tetrodes for LFP in ventral
# CA1. 63 sessions (rat 15, 16; rat 18, 11; rat 19, 12; rat 20, 24), 1,692 mPFC cells. Only
# sessions with at least ten cells and at least 4 min of SWS in each rest epoch were analyzed.
# Each session is a 20-30 min rest epoch (pre), 20-40 min of a Y-maze rule-shift task (awake)
# and a second 20-30 min rest epoch (post). Rules are right arm, left arm, lit arm and dark arm;
# per trial, the chosen arm, reward and the lit arm are recorded, and the rule changes after ten
# consecutive correct trials or one error in 12. Measured variables are single-unit spike
# times, position on the maze (headstage LEDs), prefrontal and hippocampal LFP (2 kHz), SWS
# periods detected by K-means on LFP power and head speed, and from the LFP, hippocampal
# sharp wave/ripple complexes (SPWRs), cortical delta waves and spindles. Ten sessions with
# rule learning (four rats) are used for Figure 7.
#
# The CRCNS data set, by its title and description, holds per session the spike times and cell
# identities, a putative cell type per cell, the trials (start, end, rule, correct, arm chosen,
# lit arm), the wake and pre and post SWS intervals, and the position. Its description lists no
# LFP, no SPWR, delta or spindle times, and no tetrode of each cell. Claims that need those
# (SPWRs, delta waves, spindles, same-tetrode pairs) are kept, as the paper's findings, and the
# author decides whether the data set can test them.
#
# Method shared by the reactivation claims (Online Methods, Computational methods; Supplementary
# Figure 3). Spike counts of every mPFC cell in 100 ms bins, z-transformed per cell within each
# epoch (Q); the template correlation matrix C = QQ'/B of the awake epoch; its eigenvectors p(l)
# and eigenvalues; projectors P(l) = p(l)p(l)'; reactivation strength in a match epoch
# R_l(t) = sum over i not equal j of Q_it P(l)_ij Q_jt. Signal components have eigenvalues above
# lambda_max = (1 + sqrt(1/q))^2 with q = B/n (B awake bins, n cells), nonsignal those between
# lambda_min = (1 - sqrt(1/q))^2 and lambda_max; encoding strength Phi = lambda/lambda_max; signal
# groups Phi > 1.8, 1.4 to 1.8 and 1 to 1.4 (Figure 2). Analyses of Figures 2 to 6 use SWS bins of
# the pre and post epochs only. Open throughout, and named in each criterion that it can change,
# is whether the match epoch is z-transformed over the whole rest epoch or over its SWS bins
# alone (the Methods say "For all epochs"); both readings are to be run. Bins are counted as SWS
# when they lie inside an SWS interval (a standard choice).
