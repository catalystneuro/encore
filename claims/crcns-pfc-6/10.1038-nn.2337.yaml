  source: Results, Transient synchronized replay of awake patterns, paragraph 2; Figure 2b and 2c
  quote: The average reactivation strength was greater during post epoch SWS than pre epoch SWS for
    signal components (P o 0.005 all comparisons, n 1⁄4 10, 40 and 273 for the three signal groups
    observed here, sorted according to their encoding strength, n 1⁄4 811 for nonsignal components;
    Fig. 2b,c).
  statistics:
  - about: post against pre average reactivation strength, each signal group
    p: 0.005
    p_relation: <
    n: 10, 40 and 273 signal components in the three groups; 811 nonsignal components
  expected:
  - quantity: signal components with Phi above 1.8
    value: 10
    tolerance: 1
  - quantity: signal components with Phi from 1.4 to 1.8
    value: 40
    tolerance: 4
  - quantity: signal components with Phi from 1 to 1.4
    value: 273
    tolerance: 27
  criterion: Per signal component, the mean of R_l(t) over SWS bins of the post epoch and of the pre
