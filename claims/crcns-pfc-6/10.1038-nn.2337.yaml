    least 4 min of SWS in each rest epoch.
  source: Results, mPFC ensemble activity patterns during a rule shift task, paragraph 2
  quote: We recorded 1,692 cells in the mPFC (Supplementary Fig. 1) from four rats during a total of
    63 recording sessions (rat 15, 16; rat 18, 11; rat 19, 12; rat 20, 24). Only sessions with a
    minimum of ten cells and at least 4 min of SWS in each rest epoch were analyzed.
  expected:
  - quantity: recorded mPFC cells
    value: 1692
    tolerance: 169
  - quantity: sessions
    value: 63
    tolerance: 6
  criterion: Counts of sessions per rat and of cells over all sessions. The text does not say
    whether 1,692 cells and 63 sessions are before or after the inclusion rule (at least ten cells,
    at least 4 min of SWS in each of the pre and post epochs). Readings are (a) all sessions, and (b)
    sessions passing the rule. Figure 2b's legend ("data from 63 sessions and 1,692 recorded
    cells") supports (b). Reproduced when the counts match within tolerance under one reading;
    the per-rat counts are reported.
- id: rules-learned
  statement: All four rats learned the right-arm and lit-arm rules; two learned the left-arm rule and
    one the dark-arm rule.
  source: Online Methods, Behavioral task, last paragraph
  quote: All four rats learned the right and light arm rules (according to above criteria), whereas
    only two learned the left arm rule and one learned the dark arm rule.
  expected:
  - quantity: rats that learned the right-arm rule
    value: 4
    tolerance: 0
  - quantity: rats that learned the lit-arm rule
    value: 4
    tolerance: 0
  - quantity: rats that learned the left-arm rule
    value: 2
    tolerance: 0
  - quantity: rats that learned the dark-arm rule
    value: 1
    tolerance: 0
  criterion: Tolerances are zero because the values are counts of four rats. A rule is learned
    when the rat reaches the criterion of the Methods, ten consecutive correct trials or one error
    in 12 trials, under that rule. The Methods say acquisition often spanned sessions, and do not
    say whether runs are counted within a session or across consecutive sessions under the same
    rule. Readings are (a) within a session, and (b) across consecutive sessions of the rat with the
    same rule. Reproduced when the four counts match under one reading.
- id: learning-sessions
  statement: Ten sessions, from four rats, contained rule learning, with a learning point defined as
    the first trial of a block of at least three consecutive rewarded trials after which
    performance to the end of the session stayed above 80%.
  source: Figure 7b legend; Online Methods, Behavioral task, paragraph 3
  quote: during sessions with learning (n 1⁄4 10, four rats)
  expected:
    quantity: sessions with learning
    value: 10
    tolerance: 1
  criterion: The learning point as the Methods define it ("the first trial of a block of at least
    three consecutive rewarded trials after which the performance until the end of the session was
    above 80%"). Open in the text are whether performance after the block counts the block itself,
    and which sessions count as learning sessions. Readings are (a) performance from the first
    trial of the block to the last trial of the session, and (b) from the trial after the block; and
    for sessions, (i) any session where such a point exists after the first trial, and (ii) only
    sessions where the rule in force at the point had not reached the rule-change criterion in an
    earlier session. Reproduced when a reading gives 9 to 11 sessions spanning four rats; the
    sessions and learning trials found are listed.
- id: fig1b-signal-components
  statement: Comparing the awake-epoch correlation matrix eigenvalues with the Marcenko-Pastur bound
    typically gives 1 to 6 signal components per session; 323 components were signal and 811
    nonsignal in total.
  source: Results, mPFC ensemble activity patterns during a rule shift task, paragraph 3; Figure 1b;
    Online Methods, Signal and nonsignal components
  quote: we could typically discriminate 1–6 signal components (and occasionally more) in each
    session (Fig. 1b) ... For the awake epoch, a total of 323 components were classified as signal and
    811 were classified as nonsignal.
  expected:
  - quantity: signal components, all sessions
    value: 323
    tolerance: 32
  - quantity: nonsignal components, all sessions
    value: 811
    tolerance: 81
  criterion: Awake template as in the opening comment, with lambda_max from q = B/n. Nonsignal
    components are those with eigenvalues between lambda_min and lambda_max, as the Methods define
    them; components below lambda_min are neither. Reproduced when both totals are within tolerance
    and most sessions have 1 to 6 signal components (the per-session distribution is reported).
    Session selection follows the reading of sessions-and-cells that matches.
  depends_on:
