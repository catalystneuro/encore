- id: replay-in-delta-spindle-periods
  statement: Episodes of strong replay are concentrated in periods of elevated prefrontal LFP delta
    (2 to 4 Hz) and spindle (10 to 20 Hz) power.
  source: Results, Relation of slow oscillations with SPWRs and mPFC replay, paragraph 1
  quote: episodes of strong replay were significantly concentrated into periods of elevated
    prefrontal LFP oscillatory activity in the delta (2–4 Hz) and spindle (10–20 Hz) ranges (P o 10�5
    for all, t test; Supplementary Fig. 5)
  statistics:
  - test: t test
    p: 1.0e-5
    p_relation: <
  criterion: The paper does not define strong replay episodes or the comparison. Readings are (a) a
    t-test of delta and of spindle power (1 s spectrogram bins, as for SWS detection) in bins whose
    R_l exceeds the 99th percentile of post SWS against the other post SWS bins, and (b) the same
    with the 95th percentile. Reproduced when, under one reading, both bands are higher with p <
    1e-5. Needs the prefrontal LFP.
  depends_on:
  - fig2b-post-greater-than-pre
- id: fig6a-delta-waves
  statement: In post epoch SWS, reactivation strength of signal components rises significantly about
    400 ms before the peak of cortical delta waves; the modulation is smaller in pre SWS and absent
    for nonsignal components.
  source: Results, Relation of slow oscillations with SPWRs and mPFC replay, paragraph 1; Figure 6a
  quote: During post epoch SWS, the reactivation strength for signal components showed a significant
    (P o 0.001, t test) increase B400 ms before the peak of the delta wave (Fig. 6a). This was
    experience dependent and possibly memory related, as the modulation was smaller for pre epoch
    SWS and null for nonsignal components.
  statistics:
  - test: t test
    p: 0.001
    p_relation: <
  expected:
    quantity: time of the reactivation rise before the delta peak
    value: -400
    tolerance: 100
    unit: ms
  criterion: Delta wave peaks as in the Online Methods (LFP filtered 0.1 to 4 Hz, minima at least 2
    s.d. below). Event-triggered average of R_l over -4 to 4 s, baseline -4 to -2 s and 2 to 4 s,
    bins tested against baseline by t-test at p < 0.001 (Figure 6a legend). The tolerance is one
    100 ms bin. Reproduced when the post average has significant bins with its peak 300 to 500 ms
    before the delta peak, the pre peak is lower, and nonsignal components show no significant bin.
    Needs the prefrontal LFP.
  depends_on:
  - fig1b-signal-components
- id: fig6b-down-up
  statement: Reactivation and SPWR occurrence relative to putative DOWN to UP transitions, with DOWN
    states defined as decreases of neural activity lasting at least 80 ms, are comparable with the
    delta wave results.
  source: Results, Relation of slow oscillations with SPWRs and mPFC replay, paragraph 2; Figure 6b
  quote: the same analysis was carried out with reference to putative DOWN to UP state transitions
    (putative DOWN states were defined as a decrease of neural activity in windows of at least 80
    ms; Fig. 6b). The relationships between reactivation and SPWR occurrence with these transitions
    were comparable with our delta wave results.
  criterion: The paper fixes only the 80 ms minimum. Readings for DOWN states are (a) periods of at
    least 80 ms with no spike from any recorded cell, and (b) periods of at least 80 ms with the
    population rate, in 10 ms bins, below a fifth of its SWS mean; transitions are the ends of DOWN
    states. As fig6a-delta-waves for the reactivation average (baseline -4 to -2 s and 2 to 4 s,
    t-test at p < 0.001). Reproduced when, under one reading, post SWS reactivation has significant
    bins before the transition, as for delta waves, and the pre average is lower. The SPWR part
    needs ripple times.
  depends_on:
  - fig1b-signal-components
- id: fig6c-spindles
  statement: Reactivation strength is higher in the about 1 s before spindle troughs than after them,
    echoing a higher SPWR probability before spindles, while population activity peaks
    symmetrically at spindles.
  source: Results, Relation of slow oscillations with SPWRs and mPFC replay, paragraph 2; Figure 6c
  quote: Reactivation event-triggered averages centered on spindles troughs were asymmetric, with an
    increase in reactivation in the B1 s preceding spindles compared with the period thereafter (P o
    0.001, t test; Fig. 6c).
  statistics:
  - test: t test
    p: 0.001
    p_relation: <
  criterion: Spindles as in the Online Methods (10 to 20 Hz, r.m.s. smoothed with a 100 ms Gaussian,
    1 s.d. threshold, intervals closer than 100 ms merged, at least 500 ms long; troughs the minima of
    the filtered signal). Post SWS event-triggered average of R_l for signal components; the
    t-test compares the mean over -1 to 0 s with that over 0 to 1 s, per component (paired form).
    Reproduced when the pre-spindle mean is higher with p < 0.001. Needs the prefrontal LFP.
  depends_on:
  - fig1b-signal-components
- id: fig6d-reactivation-spwr-correlation
  statement: Relative to each of delta waves, DOWN to UP transitions and spindles, the time course of
    reactivation strength and that of SPWR occurrence are strongly correlated.
  source: Results, Relation of slow oscillations with SPWRs and mPFC replay, paragraph 2; Figure 6d
  quote: The respective cross-correlograms and event-time averages of reactivation relative to these
    three cortical events were strongly correlated (Fig. 6d).
  statistics:
  - about: the three panels of Figure 6d; the text does not say which value belongs to which event
    statistic: r = 0.79, r = 0.53 and r = 0.96
    p: 0.001
    p_relation: <
  criterion: Pearson correlation, per event type, between the post SWS reactivation event-triggered
    average and the SPWR cross-correlogram over -2 to 2 s (the axes of Figure 6d). The figure prints
    r = 0.79 (P < 1e-8), r = 0.53 (P < 1e-3) and r = 0.96 (P < 1e-20), and the extracted text does not
    tie them to events. Reproduced when all three correlations are positive with p < 0.001, the
    weakest bound printed. Needs ripple times.
  depends_on:
  - fig6a-delta-waves
  - fig6b-down-up
  - fig6c-spindles
- id: fig7b-post-spwr-after-learning
  statement: In learning sessions, significantly more principal components from post epoch SPWR
    activity are stronger in the awake epoch after the learning point than before (15 of 30 against 1
    of 30).
  source: Results, Replay of choice point activity increases with learning, paragraph 1; Figure 7b;
    Supplementary Table 1
  quote: For a significant number of components (P o 0.05) extracted from SPWR bins (Fig. 7a,b,
    Supplementary Table 1 and Supplementary Fig. 12 online), coactivations became stronger as the rat
    started the first run of correct trials marking rule acquisition.
  statistics:
  - test: multinomial confidence intervals (Methods); two-way ANOVA followed by t test (Figure 7b
      legend)
    p: 0.05
    p_relation: <
    n: 30 principal components from 10 learning sessions, four rats
  expected:
  - quantity: post SPWR components, all
    value: 30
    tolerance: 0
  - quantity: post SPWR components higher before learning
    value: 1
    tolerance: 1
  - quantity: post SPWR components higher after learning
    value: 15
    tolerance: 2
  criterion: Tolerances on counts are 10% of the count rounded up, and the total is fixed by three
    components per session. Templates from post SWS SPWR bins (the 100 ms bin of the ripple peak and
    the next, Methods), the first three components per session; R_l(t) of each in the awake epoch.
    Per component, activation before against after the learning point by ANOVA, each counted as
    higher, lower or not different at p 0.05. What the ANOVA is run on is not given. Readings are (a)
    per-trial mean R_l, one-way ANOVA on before and after, and (b) per trial and spatial bin (25 bins
    of the linearized maze), two-way ANOVA on learning and bin, the learning effect. Significance of
    the proportions by non-overlapping 95% simultaneous multinomial confidence intervals
    (Fitzpatrick and Scott 1987) of the higher and lower categories. Reproduced when, under one
    reading, the counts are within tolerance and the higher-after proportion's interval lies above
    the higher-before one. Needs ripple times.
  depends_on:
  - learning-sessions
  - fig5a-spwr-bins
- id: fig7b-controls
  statement: No such difference is found for components from pre epoch SPWRs or from inter-SPWR
    periods, between the halves of sessions without learning (31 of 111 lower, 22 higher), or across
    switches between unrewarded strategies (7 of 24 lower, 8 higher).
  source: Results, Replay of choice point activity increases with learning, paragraphs 1 and 3;
    Figure 7b; Supplementary Table 1; Online Methods, Detection of sleep-related patterns, paragraph 1
  quote: This difference was not significant (P 4 0.05) for principal components computed from the
    inter-SPWR intervals in post or pre epochs ... For nonlearning days, a total of 111 principal
    components were considered; 31 were lower (28%) and 22 were higher (20%) when the halves of the
    session were compared. For nonrewarded strategy switches, 24 principal components were
    considered; seven were lower (29%) and eight were higher (33%).
  statistics:
  - p: 0.05
    p_relation: '>'
  expected:
  - quantity: pre SPWR components higher before, of 30
    value: 9
    tolerance: 1
  - quantity: pre SPWR components higher after, of 30
    value: 7
    tolerance: 1
  - quantity: inter-SPWR pre components higher before, of 42
    value: 12
    tolerance: 2
  - quantity: inter-SPWR pre components higher after, of 42
    value: 10
    tolerance: 1
  - quantity: inter-SPWR post components higher before, of 46
    value: 15
    tolerance: 2
  - quantity: inter-SPWR post components higher after, of 46
    value: 6
    tolerance: 1
  - quantity: nonlearning session components, of 111, lower in the second half
    value: 31
    tolerance: 4
  - quantity: nonlearning session components, of 111, higher in the second half
    value: 22
    tolerance: 3
  - quantity: unrewarded switch components, of 24, lower after
    value: 7
    tolerance: 1
  - quantity: unrewarded switch components, of 24, higher after
    value: 8
    tolerance: 1
  criterion: A claim of absence for each control, judged on the paper's test as in
    fig7b-post-spwr-after-learning (non-overlapping multinomial intervals at 95%), with the same
    readings. Inter-SPWR templates use only signal components of all SWS bins outside SPWR bins
    (Methods). Nonlearning sessions compare the two halves of the awake epoch's trials; strategy
    switches follow the Methods' block rules (six consecutive trials, or nine with one noncompliant
    trial placed as the Methods allow, strategies right, left, light, dark and alternation, last
    switch of a session, eight sessions). Tolerances are 10% of each count rounded up. Reproduced
    for each control when the intervals overlap; counts are reported. Needs ripple times.
  depends_on:
  - fig7b-post-spwr-after-learning
- id: fig7c-choice-point
  statement: Post SPWR components that strengthened after learning are most active from the central
    platform toward the end of the target arm, the only part of the maze where after-learning
    activation differs significantly from before.
  source: Results, Replay of choice point activity increases with learning, paragraph 2; Figure 7c
  quote: A significant effect (P o 0.05) of learning on the spatial distribution of principal
    components from post SPWR appeared only in the part of the maze going from the central platform
    toward the end of the target arm (Fig. 7c).
  statistics:
  - test: t test
    p: 0.05
    p_relation: <
    n: '10'
  criterion: The fifteen post SPWR components higher after learning; their mean R_l in each of 25
    equal bins of the linearized maze (departure arm, platform, target arm, with left and right arms
    combined), before and after learning, averaged over trials. The legend's n of 10 is read as 10
    sessions, each the mean of its components. Per bin, a paired t-test at p < 0.05. Reproduced when
    the significant bins all lie from the platform onward; the platform's position along the
    linearized path comes from the maze geometry (85 cm arms, Methods). Needs ripple times.
  depends_on:
  - fig7b-post-spwr-after-learning
- id: fig7d-two-factors
  statement: Factor analysis of the spatial distributions of post SPWR patterns gives two main
    factors, concentrated on the central platform and on the target arm.
  source: Results, Replay of choice point activity increases with learning, paragraph 2; Figure 7d
  quote: a factor analysis of these spatial distributions revealed that the two most important
    factors were concentrated on the platform and on the target arm, respectively (Fig. 7d and
    Online Methods).
  criterion: Principal component analysis with varimax rotation of the spatial profiles (25 bins) of
    the post SPWR components, two factors (Methods). Which profiles enter is not fixed. Readings
    are (a) the fifteen components of fig7c-choice-point, after learning, and (b) all 30 post SPWR
    components. Reproduced when, under one reading, one factor's largest loadings fall on the
    platform bins and the other's on the target arm bins. Needs ripple times.
  depends_on:
  - fig7c-choice-point
- id: supp12-behavior-unchanged
  statement: Rule acquisition does not change trial duration or the running speed along the
    trajectory.
  source: Results, Replay of choice point activity increases with learning, paragraph 3;
    Supplementary Figure 12B and 12C
  quote: Average trial length (time from initial movements by rat until arrival at end of arms)
    before and after learning (10 learning days). The distributions are not significantly different
    (t-test, p>0.05).
  statistics:
  - about: trial length before against after learning
    test: t-test
    p: 0.05
    p_relation: '>'
    n: 10 learning days
  criterion: A claim of absence, judged on the paper's test, a t-test of trial length before against
    after the learning point at p 0.05. Trial length is the trial's end minus its start. The legend
    does not say whether trials or session means are compared; readings are (a) all trials of the
    10 sessions pooled, unpaired, and (b) session means, paired. Under the rule for absence the
    paper's test decides; reading (b) is primary as it matches "10 learning days", and (a) is shown.
    Speed per linearized position bin before and after is reported, with the same paired test per
    bin.
  depends_on:
  - learning-sessions
