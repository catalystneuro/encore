- id: supp10-no-coactivation
  statement: During sleep, reactivation strengths of different simultaneously recorded signal
    components tend not to peak together, with a trough at zero lag in their cross-correlograms,
    while in the awake epoch they coactivate more than by chance.
  source: Results, Transient synchronized replay of awake patterns, paragraph 3; Supplementary Figures
    9 and 10
  quote: concomitant activation of different principal component–related patterns was less than
    expected by chance, as can be inferred from the zero lag trough in their cross-correlograms ...
