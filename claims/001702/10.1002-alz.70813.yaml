# Claims for Chaunsali, Li, Fleischel et al. (2025), "Degradation of perineuronal nets in
# hippocampal CA2 explains the loss of social cognition memory in Alzheimer's disease",
# Alzheimer's & Dementia 21, e70813, doi:10.1002/alz.70813, on dandiset 001702 ("Hippocampal CA2
# Perineuronal Net Degradation and Social Memory Deficits in a 5XFAD Alzheimer's Disease Mouse
# Model").
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21,
# protocol as stated in docs/protocol.md (version pilot-10).
#
# Text read: the version of record, open access, as served by Europe PMC (PMC12541281), stored
# under paper/: main text, Methods, figure legends of Figures 1 to 5, Data Availability. No PDF
# was available, so the asterisks in the figures (which comparison has which p level) could not
# be read; where a legend lists several levels, the claims record the bound the legend allows
# for the comparison. The article has a correction (Alzheimers Dement 2026, e71098) that was not
# in the text read. The Supporting Information was not in the text read: Figures S1 to S9,
# Table S1 (reagents), Tables S2 and S3 (means, SEM, n, test statistics and post hoc results
# of every test) and Table S4 (the RNA-seq analysis). The main findings rest on the main
# figures and are stated in the main text, so claims were written. Claims on the supplementary
# figures quote the main text that cites them; their legends, tests and sample sizes are not
# known here, and each says so. No exact p-value or test statistic is printed in the text read.
#
# Code: the paper links no code. Analyses were run in GraphPad Prism 9 (statistics), ImageJ
# (images) and R 4.4.1 with DESeq2 1.44.0 and GOplot (RNA-seq). Data Availability says data
# "will be provided upon reasonable request". The dandiset's description (not the paper) says it
# holds immunohistochemical images quantifying CA2 PNNs, behavioral assay results and bulk
# RNA-seq data with metadata, and that the transcriptomic data are also deposited in GEO under
# GSE317499. The paper names no outside data; every claim is `data: dataset`, and whether the
# RNA-seq counts are in the dandiset or only in GEO is the author's to find.
#
# Data the paper used.
# Mice: 5XFAD (congenic on C57Bl/6J) and age-matched WT littermates (5XFAD-, "control"); J20
# and 3XTg (Figure S4); Acan fl/fl and Acan wt/wt (WT) mice injected with AAV9 hSyn eGFP-Cre
# into CA2; C57Bl/6J mice injected into CA2 with ChABC, heat-inactivated ChABC or penicillinase
# (PNase, the sham control); 5XFAD and control mice injected daily i.p. for 1 month (from 5 M)
# with GM6001 (100 mg/kg) or vehicle (4% CMC). IHC used both sexes; behavior used males only.
# - IHC (Figure 1): coronal 50 um sections, WFA (PNNs), PCP4 (CA2 neurons), NeuN, PV. CA2 PNN
#   area coverage (WFA area / PCP4 area inside a rotated rectangle covering all PCP4 neurons of
#   CA2) and WFA intensity in that rectangle, for 5XFAD and controls at 3, 6, 9 and 12 M; n is
#   slices (7 to 12 per group) from five mice per group. PV density (PV cells per PCP4 volume,
#   ~20 um z-stacks) and NeuN density (NeuN cells per PCP4 area) at 3 and 6 M, 8 to 10 slices
#   from five mice per group.
# - Direct social interaction (Figures 2, 3, 5): three trials 1 h apart in a 35 cm open field
#   (Novel 1, then the same mouse as Familiar, then Novel 2); the measure is the test mouse's
#   interaction time with the other mouse in each trial; difference scores Novel 1 - Familiar
#   and Familiar - Novel 2 per mouse. Groups (n mice): 3 M control 7, 5XFAD 9 (Fig 2B-D); 6 M
#   control 10, 5XFAD 9 (Fig 2E-G); WT AAV Cre 10, Acan AAV Cre 10 (Fig 3C-E); PNase 8, ChABC 10
#   at 5 and 14 days post injection (Fig 3H-M); 5 M control 7, 5XFAD 11 (Fig 5B-D); 6 M 5XFAD +
#   GM6001 14, 5XFAD + vehicle 12 (Fig 5E-G). The trial length is not stated.
# - Novel object recognition at 6 M (Figure 2I-K): 10 min familiarization with two identical
#   objects, 30 min delay, 10 min test with one object replaced; time exploring each object
#   (Ethovision XT), percent time, discrimination index (N - F) / (N + F); distance moved.
#   n = 11 control, 17 5XFAD (2I, 2J); 17 control, 22 5XFAD (2K).
# - GM6001 IHC (Figure 5I): CA2 PNN expression in 6 M 5XFAD + vehicle, 5XFAD + GM6001,
#   control + vehicle, control + GM6001, n = 4 to 5 mice per group.
# - Bulk RNA-seq (Figure 4): 1 mm punches of CA2 from 500 um acute slices of 3 M and 7 M 5XFAD
#   and control mice; Illumina NovaSeq poly-A, STAR to mm39, featureCounts, DESeq2. The number of
#   mice per group is not given in the text read (Table S4).
#
# Shared definitions used in the criteria (all from the Methods 2.6, 2.8 and 2.10 and the
# legends, except where named open):
# - SOCIAL: per mouse, the interaction time in each of the three trials as the Methods define
#   it (nose-to-nose, nose-tail and anogenital sniffing, allogrooming, and following initiated
#   by the test mouse). Open: the trial length, which the Methods do not state; the reading is
#   the whole trial as the dataset records or scores it. No mouse is excluded ("No data were
#   excluded", Methods 2.10).
# - TRIALS-ANOVA: a two-way ANOVA of interaction time on group and trial (Novel 1, Familiar,
#   Novel 2) with Tukey's multiple comparisons, as each legend names it. Open, where a legend
#   says only "two-way ANOVA" (Figures 3C, 3H, 3K, 5B, 5E), whether trial is a repeated measure;
#   Figure 2B and 2E name "two-way repeated measures ANOVA" for the same design. Readings (a)
#   repeated measures on trial, (b) ordinary two-way ANOVA. Open in all panels, which means
#   Tukey's test compares (Prism allows both): readings (i) the three trials within each group,
#   (ii) all six group by trial cells. Each claim is judged under every combination.
# - INTACT memory in a group: Familiar below Novel 1 and Novel 2 above Familiar, each with
#   Tukey p < 0.05. IMPAIRED: neither of these two comparisons has p < 0.05.
# - DIFF: the two difference scores per mouse, compared between groups by a two-tailed unpaired
#   t-test (legends). Open, the sign of the second score: the legends label it Familiar - Novel
#   2, which is negative with intact memory, while the Results call the scores of impaired mice
#   "lower". The two-tailed test does not depend on the sign; the direction is judged as which
#   group's score lies further from zero on the side of intact memory (Novel 1 above Familiar,
#   Novel 2 above Familiar).
# - PNN-AREA and PNN-INTENSITY: the measures of Methods 2.8. When the dataset holds the
#   per-slice values, they are used as given. From images, the binary masks come from ImageJ
#   auto thresholds; open, which of the two named ("OTSU or Triangle"); readings (a) Otsu,
#   (b) Triangle, for every channel. PNN-AREA is WFA mask area / PCP4 mask area inside the CA2
#   rectangle. PNN-INTENSITY is open between (a) the mean WFA intensity inside the WFA mask
#   ("intensity of the WFA-covered area") and (b) the mean WFA intensity over the CA2 rectangle
#   ("WFA intensity within the CA2 area rectangle"); both phrases are in Methods 2.8.
# - READINGS: where a criterion lists readings of an open method detail (threshold, intensity
#   measure, ANOVA form, Tukey family, unit, DESeq2 model, enrichment background, session), the
#   notebook runs every one. The outcome is the one they all give; when they give different
#   outcomes the claim is methods_underspecified, with every result shown (docs/protocol.md,
#   Reader, step 3). "Under every reading" in the criteria below means this.
schema_version: 2
dataset:
  archive: dandi
  id: "001702"
paper: doi:10.1002/alz.70813
claims:
- id: fig1g-3m-pnn-area-no-difference
  statement: At 3 M, CA2 PNN area coverage does not differ between 5XFAD and control mice.
  source: Results 3.1, paragraph 2; Figure 1C and 1G
  quote: At 3 M, CA2 PNNs were indistinguishable between 5XFAD and controls
  criterion: A claim of absence, judged on the paper's test. PNN-AREA per slice (unit is the
    slice, as the legend's n), 5XFAD and control at 3, 6, 9 and 12 M, in a two-way ANOVA on
    genotype and age with Tukey's multiple comparisons (Figure 1 legend). Reproduced when the
    Tukey comparison of 5XFAD against control at 3 M has p >= 0.05; not reproduced when p <
    0.05. The mean difference and its p are reported, under each threshold reading.
- id: fig1g-pnn-area-reduced-6-to-12m
  statement: CA2 PNN area coverage is significantly lower in 5XFAD than in age-matched control
    mice at 6 M, and stays lower at 9 and 12 M.
  source: Results 3.1, paragraph 2; Figure 1D to 1G
  quote: at 6 M, we observed a significant reduction in CA2 PNN area in the 5XFAD mice ... This
    decrease in the PNN coverage persisted in the 9 and 12 M old 5XFAD
  statistics:
  - test: two-way ANOVA, Tukey's multiple comparisons test
    p: 0.05
    p_relation: "<"
    n: 9 to 12 slices from five mice per group at 6, 9 and 12 M
  criterion: PNN-AREA per slice, two-way ANOVA on genotype and age with Tukey's multiple
    comparisons (Figure 1 legend). Reproduced when, at each of 6, 9 and 12 M, 5XFAD is below
    control with Tukey p < 0.05 under every threshold reading; partially reproduced when this holds
    at one or two of the three ages. The legend lists levels from p < 0.05 to p < 0.0001
    without the figure, so p < 0.05 is the bound recorded.
- id: fig1h-wfa-intensity-reduced-6-to-12m
  statement: WFA intensity in CA2 is significantly lower in 5XFAD than in control mice at 6 to
    12 M.
  source: Results 3.1, paragraph 2; Figure 1H
  quote: we computed WFA intensity in the CA2 area which was similarly reduced significantly at
    6-12 M in 5XFAD mice
  statistics:
  - test: two-way ANOVA, Tukey's multiple comparisons test
    p: 0.05
    p_relation: "<"
    n: 9 to 12 slices from five mice per group at 6, 9 and 12 M
  criterion: PNN-INTENSITY per slice, two-way ANOVA on genotype and age with Tukey's multiple
    comparisons (Figure 1 legend), under each intensity and threshold reading. Reproduced when,
    under every reading, 5XFAD is below control with Tukey p < 0.05 at each of 6, 9 and 12 M;
    partially reproduced when at one or two of these ages. If the readings give different
    outcomes the claim is methods_underspecified, with every result shown. The 3 M comparison
    is reported as well.
- id: fig1gh-aging-reduction-smaller-than-5xfad
  statement: Normal aging also reduces CA2 PNN coverage in control mice, but the loss is
    significantly more pronounced in 5XFAD mice.
  source: Results 3.1, paragraph 2; Figure 1G and 1H
  quote: Note that normal aging also presented with a reduction in PNN coverage, yet the loss of
    PNNs was significantly more pronounced in 5XFAD mice
  statistics:
  - test: two-way ANOVA, Tukey's multiple comparisons test
    p: 0.05
    p_relation: "<"
  criterion: PNN-AREA per slice, two-way ANOVA on genotype and age with Tukey's multiple
    comparisons over all eight cells (Figure 1 legend). The paper does not say which
    comparisons show the aging effect, so the reading of the reported finding is any older
    control group (6, 9 or 12 M) below control at 3 M with Tukey p < 0.05. Nor does it say
    which result makes the 5XFAD loss "significantly more pronounced"; the two-way ANOVA named
    in the legend tests this as the genotype by age interaction, which is used. Reproduced
    when the aging decline holds, the interaction has p < 0.05, and at each of 6, 9 and 12 M
    the 5XFAD loss relative to 5XFAD at 3 M is larger than the control's loss relative to
    control at 3 M. Partially reproduced when the aging decline holds and the 5XFAD loss is
    larger but the interaction is not significant. The same is reported for PNN-INTENSITY.
- id: fig1a-pv-pnns-intense-in-5xfad
  statement: In 6 M 5XFAD mice, the PNNs around PV neurons in CA2 remain relatively intense,
    while those around CA2 pyramidal neurons are lost.
  source: Results 3.1, paragraph 1; Figure 1A to 1D
  quote: however we observed relatively intense PV neuron-associated PNNs in 5XFAD mice
  criterion: The paper reports no measure or test for this observation, and says the PNNs of
    pyramidal and PV neurons in CA2 could not be analysed separately (Results 3.1, paragraph
    1). No source fixes how a PV neuron's PNN would be measured, and that choice could change
    the outcome, so the claim is blocked as methods_underspecified unless the dataset itself
    holds a per-PV-neuron WFA measure, which is then compared between 6 M 5XFAD and control
    by the Methods 2.10 default for two groups (two-tailed unpaired t-test); reproduced when
    the 5XFAD mean is not below the control mean at p < 0.05 while claim
    fig1g-pnn-area-reduced-6-to-12m holds at 6 M. As variants only, the mean WFA intensity in
    (a) a 2 um ring outside the PV cell outline and (b) the WFA mask overlapping the PV cell
    outline may be shown; they are not the basis of the outcome.
  depends_on:
  - fig1g-pnn-area-reduced-6-to-12m
- id: fig1b-loss-of-wfa-peaks
  statement: Along the periphery of a single CA2 pyramidal neuron, the WFA line profile shows
    many high-intensity peaks in control and loses this peak and valley pattern in 5XFAD.
  source: Figure 1B
  quote: showing many high-intensity WFA peaks in control (dark magenta line) compared to the
    5XFAD (light magenta line) group
  criterion: The paper shows one example neuron per group and defines no peak measure, no
    peak threshold and no test. Testable only if the dataset holds the high magnification
    images or line profiles of Figure 1B, identified as such. Reproduced when the control
    profile has a higher maximum intensity than the 5XFAD profile and more peaks under peak
    prominence thresholds of both 10% and 25% of the control profile's intensity range; these
    two thresholds are not from the paper and stand for "many high-intensity peaks" only when
    they agree. Otherwise blocked as methods_underspecified.
- id: fig1i-pv-density-unchanged
  statement: PV neuron density in CA2 does not differ between 5XFAD and control mice at 3 or 6
    M.
  source: Results 3.1, paragraph 5; Figure 1I
  quote: We did not find any change in either PV ... or NeuN cell density at 6 M of 5XFAD
    compared to age-matched controls
  statistics:
  - test: unpaired two-tailed t-test
    p: 0.05
    p_relation: ">"
    n: 8 to 10 brain slices from five mice per group
  criterion: A claim of absence, judged on the paper's test. PV cells counted in ~20 um
    z-stacks divided by the PCP4-covered CA2 volume, per slice (Methods 2.8); 5XFAD against
    control by a two-tailed unpaired t-test at each age (Figure 1 legend). Reproduced when p >=
    0.05 at both 3 and 6 M; not reproduced when either has p < 0.05. The difference and p are
    reported for each age.
- id: fig1j-neun-density-unchanged
  statement: NeuN neuron density in CA2 does not differ between 5XFAD and control mice at 3 or
    6 M, so PNN loss precedes neuronal loss.
  source: Results 3.1, paragraph 5; Figure 1J
  quote: showing no difference between any groups
  statistics:
  - test: unpaired two-tailed t-test
    p: 0.05
    p_relation: ">"
    n: 8 to 10 brain slices from five mice per group
  criterion: A claim of absence, judged on the paper's test. NeuN cells in single-plane images
    counted inside the PCP4-covered CA2 ROI and divided by its area, per slice (Methods 2.8);
    5XFAD against control by a two-tailed unpaired t-test at each age (Figure 1 legend).
    Reproduced when p >= 0.05 at both 3 and 6 M; not reproduced when either has p < 0.05.
- id: figs2-pcp4-unchanged
  statement: PCP4 expression in CA2 is unaltered in 5XFAD mice at all ages studied, which is
    why it serves as the internal control for PNN area.
  source: Methods 2.8; Figure S2 (not in the text read)
  quote: The expression of PCP4 remained unaltered in all studied age groups
  criterion: A claim of absence. The Figure S2 legend was not read, so the paper's measure and
    test are not known. Readings the text allows, (a) PCP4 mask area in the CA2 rectangle per
    slice, two-way ANOVA on genotype and age with Tukey's comparisons as for Figure 1G, (b) the
    same measure, two-tailed unpaired t-test of 5XFAD against control at each age (Methods 2.10
    default for two groups). Reproduced when no 5XFAD against control comparison has p < 0.05
    under either reading; not reproduced when one does under both; if the readings disagree,
    methods_underspecified with both shown.
- id: figs3-other-regions-subtle
  statement: Outside CA2, the PNNs in other brain regions of 6 M 5XFAD mice show only subtle
    changes.
  source: Results 3.1, paragraph 1; Discussion, paragraph 2; Figure S3 (not in the text read)
  quote: Although subtle changes in PNN expression were visible in some brain regions
  criterion: The Figure S3 legend was not read, so its regions, measure and test are not known.
    Testable only if the dataset holds WFA images or values for regions outside CA2 at 6 M.
    With the Methods 2.8 measures and the Methods 2.10 default test (two-tailed unpaired
    t-test), reproduced when, in each region the dataset labels, the relative 5XFAD against
    control difference in PNN-INTENSITY is smaller in size than in CA2 of the same mice.
    Otherwise blocked.
- id: figs4-ca2-pnn-loss-j20-3xtg
  statement: CA2 PNNs are also conspicuously lost in two other AD models, J20 and 3XTg.
  source: Results 3.1, paragraph 1; Figure S4A to S4C (not in the text read)
  quote: we assessed two more widely used AD models namely J20 and 3XTg, which also showed a
    conspicuous loss of PNN in CA2 area
  criterion: The Figure S4 legend was not read, so the ages, sample sizes and test are not
    known. PNN-AREA and PNN-INTENSITY per slice, each model against its controls by a
    two-tailed unpaired t-test (Methods 2.10 default for two groups). Reproduced when both
    models are lower than their controls at p < 0.05 on at least one of the two measures;
    partially reproduced when one model is. Blocked if the dataset holds no J20 or 3XTg data.
- id: figs5-aggrecan-unchanged
  statement: Aggrecan expression in CA2 at 6 M is unaltered in 5XFAD mice, suggesting that the
    loss of WFA-labelled PNNs reflects a loss of chondroitin sulfate chains.
  source: Results 3.1, paragraph 3; Figure S5A and S5B (not in the text read)
  quote: Aggrecan expression in CA2 at 6 M remains unaltered in 5XFAD mice
  criterion: A claim of absence. The Figure S5 legend was not read. The text allows, for the
    measure, (a) aggrecan mask area / PCP4 area and (b) aggrecan intensity in the CA2
    rectangle (the Methods 2.8 measures applied to the aggrecan channel), and for the test the
    Methods 2.10 default for two groups, a two-tailed unpaired t-test, on slices. Reproduced
    when 5XFAD against control has p >= 0.05 under both readings; not reproduced when p < 0.05
    under both; methods_underspecified if they disagree.
- id: figs6-ca2-devoid-of-plaques
  statement: Despite widespread amyloid beta plaques in the hippocampus of 5XFAD mice, the CA2
    area is largely devoid of plaques.
  source: Results 3.1, paragraph 4; Figure S6A to S6C (not in the text read)
  quote: despite a widespread hippocampal deposition of amyloid beta plaques ... the CA2 area
    remained largely devoid of amyloid beta plaques
  criterion: The Figure S6 legend was not read, so the measure is not known. Readings, (a)
    amyloid beta mask area fraction, (b) plaque count per area, in CA2 (the PCP4 rectangle)
    against the rest of the hippocampus in the same 5XFAD sections. Reproduced when, under
    both readings, CA2 is below the rest of the hippocampus in every 5XFAD section imaged with
    an amyloid stain; blocked if the dataset holds no amyloid stain.
- id: fig2b-3m-intact-social-memory
  statement: At 3 M, both 5XFAD and control mice have normal social memory, spending less time
    with the familiar mouse than with Novel 1 and more time with Novel 2.
  source: Results 3.2, paragraph 3; Figure 2B
  quote: We found that the 3 M old 5XFAD mice with intact PNNs behave identically to control
    mice, spending less time with the familiar mouse and more time with the novel mouse
  statistics:
  - test: two-way repeated measures ANOVA, Tukey's multiple comparisons test
    p: 0.05
    p_relation: "<"
    n: 7 control and 9 5XFAD mice
  criterion: SOCIAL and TRIALS-ANOVA with repeated measures on trial (the legend names it),
    under Tukey readings (i) and (ii). Reproduced when both groups show INTACT memory under every
    reading; partially reproduced when both comparisons go in the INTACT direction in both
    groups but only two or three of the four reach p < 0.05.
- id: fig2cd-3m-difference-scores-no-difference
  statement: At 3 M, the difference scores (Novel 1 - Familiar and Familiar - Novel 2) do not
    differ between 5XFAD and control mice.
  source: Results 3.2, paragraph 3; Figure 2C and 2D
  quote: with no significant difference in the difference scores between the groups
  criterion: A claim of absence, judged on the paper's test. DIFF, two-tailed unpaired t-test
    for each score (n = 7 control, 9 5XFAD). Reproduced when both scores have p >= 0.05; not
    reproduced when either has p < 0.05. Group means and p are reported.
- id: fig2e-6m-impaired-social-memory
  statement: At 6 M, control mice show intact social memory, while 5XFAD mice show no
    difference in interaction time between Novel 1 and Familiar, nor between Familiar and
    Novel 2.
  source: Results 3.2, paragraph 3; Figure 2E
  quote: Specifically, unlike age-matched controls, 5XFAD mice showed no difference in
    investigation times between the first novel mouse and the familiar mouse, nor between the
    familiar mouse and the second novel mouse
  statistics:
  - test: two-way repeated measures ANOVA, Tukey's multiple comparisons test
    p: 0.05
    p_relation: "<"
    n: 10 control and 9 5XFAD mice
  criterion: SOCIAL and TRIALS-ANOVA with repeated measures on trial (legend), Tukey readings
    (i) and (ii). Reproduced when, under every reading, controls show INTACT memory and 5XFAD show
    IMPAIRED memory; partially reproduced when controls are INTACT and 5XFAD have one of the
    two comparisons at p < 0.05; not reproduced otherwise. The 5XFAD part is a claim of absence
    and is judged on this test as written.
- id: fig2fg-6m-difference-scores-lower
  statement: At 6 M, both difference scores show weaker discrimination of familiar and novel
    mice in 5XFAD than in control mice.
  source: Results 3.2, paragraph 3; Figure 2F and 2G
  quote: However, the lower difference scores in 5XFAD mice indicate a diminished ability to
    distinguish between familiar and novel mice
  statistics:
  - about: Novel 1 - Familiar (Figure 2F)
    test: unpaired two-tailed t-test
    p: 0.05
    p_relation: "<"
    n: 10 control and 9 5XFAD mice
  - about: Familiar - Novel 2 (Figure 2G)
    test: unpaired two-tailed t-test
    p: 0.01
    p_relation: "<"
    n: 10 control and 9 5XFAD mice
  criterion: DIFF. Reproduced when both scores differ at p < 0.05 by the two-tailed unpaired
    t-test with the control score further from zero on the side of intact memory; partially
    reproduced when one does.
- id: figs7-nor-training-no-side-preference
  statement: During the training phase of the object recognition test, neither control nor
    5XFAD mice prefer the right or the left object.
  source: Results 3.2, paragraph 4; Figure S7 (not in the text read)
  quote: During the training phase both control and 5XFAD mice did not show any preference
    toward right or left object
  criterion: A claim of absence. The Figure S7 legend was not read, so the paper's test is not
    known. Readings, on percent time with each object in the 10 min familiarization phase, (a)
    two-way mixed-effects ANOVA on genotype and side with Sidak's comparisons of left against
    right within genotype, as the paper used for the test phase (Figure 2I), (b) a two-tailed
    paired t-test of left against right within each genotype. Reproduced when no comparison has
    p < 0.05 under either reading; not reproduced when one does under both;
    methods_underspecified if they disagree.
- id: fig2i-nor-novel-object-preference
  statement: At 6 M, both control and 5XFAD mice spend significantly more time with the novel
    object than with the familiar one.
  source: Results 3.2, paragraph 4; Figure 2I
  quote: Bar graph showing significantly higher time spent with the novel object compared to
    familiar by both 6 M control and 5XFAD
  statistics:
  - test: two-way ANOVA mixed-effects, Sidak's multiple comparisons
    p: 0.01
    p_relation: "<"
    n: 11 control and 17 5XFAD mice
  criterion: Percent of object exploration time with the novel and the familiar object in the
    10 min test phase (Methods 2.6.2), a two-way mixed-effects ANOVA on genotype and object
    (object within mouse) with Sidak's comparisons of novel against familiar within each
    genotype (legend). Reproduced when novel exceeds familiar with p < 0.05 in both genotypes;
    partially reproduced when in one.
- id: fig2j-nor-discrimination-index-no-difference
  statement: The novel object discrimination index does not differ between 6 M control and
    5XFAD mice.
  source: Results 3.2, paragraph 4; Figure 2J
  quote: with no significant differences in the discrimination index between the groups
  criterion: A claim of absence, judged on the paper's test. Discrimination index (novel -
    familiar) / (novel + familiar) exploration time in the test phase (Methods 2.6.2),
    two-tailed unpaired t-test (n = 11 control, 17 5XFAD). Reproduced when p >= 0.05; not
    reproduced when p < 0.05. Means and p are reported.
- id: fig2k-distance-moved-no-difference
  statement: Total distance moved does not differ between 6 M control and 5XFAD mice, so the
    social memory deficit is not due to a change in locomotion.
  source: Results 3.2, paragraph 5; Figure 2K
  quote: We measured the total travel distance in 6-M-old 5XFAD and control mice and found no
    significant difference between these groups
  criterion: A claim of absence, judged on the paper's test, a two-tailed unpaired t-test (n =
    17 control, 22 5XFAD). Open, in which session distance was measured, as the text does not
    say and n differs from Figure 2J; readings (a) the 10 min habituation in the open field,
    (b) the 10 min familiarization phase, (c) the 10 min test phase, each as the dataset holds
    it. Reproduced when p >= 0.05 under the readings the dataset allows; not reproduced when p
    < 0.05 under all; methods_underspecified if they disagree.
- id: figs8-baseline-social-memory-before-injection
  statement: Before AAV Cre injection, Acan fl/fl and WT mice both have normal social memory.
  source: Results 3.3, paragraph 1; Figure S8 (not in the text read)
  quote: We began by confirming the normal social behavior of Acan fl/fl and WT mice
  criterion: SOCIAL and TRIALS-ANOVA, Figure S8 legend not read, so readings (a) and (b) and
    (i) and (ii) all apply. Reproduced when both genotypes show INTACT memory under every reading;
