    behaviour.
  source: Results, Robustness along the coding direction, paragraph 3; Figure 3d, e; Extended Data
    Fig. 8b-e
  quote: However, this projection did not discriminate trial type nor predict behavior on control
    trials. Third, a mode that maximally captured the remaining activity variance, showed
    non-selective ramping during the delay epoch, did not predict behavior, and was resistant to
    unilateral and bilateral perturbations
