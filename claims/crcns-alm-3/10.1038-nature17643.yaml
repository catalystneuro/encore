    the delay within 0.5 +- 0.1 averaged over sessions and a prediction accuracy on control trials
    whose binomial test against 0.5 has p > 0.05. Robustness of the ramping mode is judged by the
    perturbed projection in the last 400 ms of the delay lying within the s.e.m. band over sessions
    of the control projection for ipsilateral and bilateral trials, while the persistent-mode
    projection lies outside it for ipsilateral trials. Reproduced when all hold.
