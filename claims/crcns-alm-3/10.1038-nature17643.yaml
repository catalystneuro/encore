# Claims for Li, Daie, Svoboda & Druckmann (2016), Nature 532, 459-464, "Robust neuronal dynamics
# in premotor cortex during motor planning", doi:10.1038/nature17643, on CRCNS data set alm-3
# (doi:10.6080/K0RB72JW).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-07,
# protocol as stated in docs/protocol.md (Reader), version pilot-13.
#
# Text read: the accepted author manuscript in PubMed Central (PMC5081260, NIHMS767125), as supplied
# under paper/ (Europe PMC): main text, Methods, and the legends of Figures 1 to 6 and Extended Data
# Figures 1 to 10. The paper has no separate Supplementary Information. No PDF of the paper was
# supplied, so values printed only inside figures (per-condition performance in Fig. 1d and 5b,
# fractions in ED Fig. 8a and 8b) were not read; claims on those panels rest on the text and
# legends. The version of record was not read. The record lists a corrigendum
# (doi:10.1038/nature18623) whose text was not supplied or read.
#
# Code. The paper links no analysis or simulation code. The CRCNS data set's description says it
# holds MATLAB analysis scripts that reproduce the paper's figures; they are files of the data set
# and were not read here. Every method below is from the paper's text.
#
# Data the paper used. 33 mice (age > P60). Electrophysiology during behaviour, left ALM, 12 mice
# (5 VGAT-ChR2-EYFP, 7 PV-ires-cre x ReaChR), NeuroNexus 32-channel probes: 1012 single units in 58
# sessions (20 unilateral, Experiment 1, Fig. 1; 38 bilateral, Experiments 2 and 3, Fig. 2 and ED
# Fig. 7); 890 putative pyramidal (spike width > 0.45 ms), 72 FS (< 0.35 ms), 50 excluded.
# Callosotomy, 7 mice (6 VGAT, 1 PV x ReaChR), recorded daily for 5 to 7 days from about 17 h after
# the cut. Photoactivation (ED Fig. 5), 2 Tlx_PL56-cre x Ai32 mice. Behaviour-only photoinhibition
# mice (Fig. 1d, 2b, ED Fig. 3) and 4 untrained mice for the spatial extent of photoinhibition (ED
# Fig. 2d). Task: pole location discrimination, sample epoch 1.3 s, delay 1.3 s (Experiment 1),
# 1.7 s (Experiments 2, 3), 1.2 to 1.7 s (ED Fig. 3c), auditory go cue, lick right (posterior) or
# lick left (anterior). Photoinhibition on 40% of trials during electrophysiology. Experiment 1:
# left ALM, 1 spot, 0.5 s with 100 ms ramp, in sample, early delay or a third delay window.
# Experiment 2: 0.8 s with 200 ms ramp from delay onset, left ALM 1 spot (ipsilateral), right ALM 1
# spot (contralateral), bilateral 4 spots per side. Experiment 3: ipsilateral 4 spots, contralateral
# 4 spots, bilateral 1 spot. Variables: spike times per unit and trial, trial type, outcome (correct,
# error, lick early), photostimulus condition, epoch times, licks. By its description the data set
# holds 91 recording sessions from 19 mice (the 12 electrophysiology mice and the 7 callosotomy
# mice), with spike times, cell type, trial types, photostimulation type, epoch times and lick
# traces; its documentation says the behaviour-only sessions and the photoactivation data are not
# included.
#
# Naming of the third Experiment 1 window. The Methods name the windows by when they end before the
# go cue, 1.6 s (sample), 0.8 s (early delay), 0.3 s (late delay) and 0 s (before cue); the Results
# call the window ending at the cue "late delay" and the one ending 0.3 s before it "middle delay".
# The electrophysiology used sample, early delay and the window ending 0.3 s before the cue (it is
# the one with a recovery time in Fig. 1g). Claims below say which window they mean by its end time.
#
# Shared method details, used by the criteria below.
# M1. Trials. Performance is the fraction correct excluding lick-early trials (Methods, Behavioral
#   data analysis). Whether lick-early trials enter the electrophysiology analyses is not stated;
#   readings (a) excluded, as for performance (the data set's documentation also says to exclude
#   them), (b) included. Selectivity changes under photoinhibition use all trials, correct and
#   incorrect, grouped by instructed movement (Methods, Electrophysiology data analysis); the
#   example PSTHs of ED Fig. 1a use correct trials only.
# M2. Epochs. Sample epoch from pole movement onset to 0.1 s after pole retraction onset (1.3 s);
#   delay epoch from then to the go cue (Methods, Behavior and surgery). The response epoch's length
#   is not stated; readings (a) the first 400 ms after the go cue (the window ED Fig. 2e calls the
#   first 400 ms of the response epoch), (b) the 1.5 s answer window after the go cue.
# M3. Neurons. Putative pyramidal neurons only, spike width (trough to peak of the mean waveform)
#   > 0.45 ms (Methods). A neuron is selective when spike counts on lick left and lick right trials
#   differ by a two-tailed t-test at p < 0.05 in any of the sample, delay or response epochs
#   (Methods). The trials of this test are not stated; readings (a) correct control trials, (b) all
#   control trials grouped by instructed movement. Figure legends add "selective neurons tested for
#   >3 trials in all conditions" (Fig. 1g, 2e, ED Fig. 5f, 7d); ED Fig. 2b, 5e and 7c exclude neurons
#   with mean rate < 1 spike/s, and Fig. 1f, 2d and 5d do not say; readings (a) with that exclusion,
#   (b) without.
# M4. Selectivity and its recovery (Methods, Electrophysiology data analysis). Each neuron's
#   preferred trial type from a subset of 10 trials, selectivity as the rate difference between
#   preferred and non-preferred types on the remaining trials; delta selectivity is photoinhibition
#   minus control; s.e.m. by bootstrap over neurons. Open details. Which 10 trials; readings (a) 10
#   trials of each type drawn at random, (b) 10 trials in total drawn at random. The window that sets
#   the preference; readings (a) the spike count over sample, delay and response epochs together,
#   (b) the count in the epoch where the neuron is most selective. The time bins of the selectivity
#   trace; readings (a) 200 ms windows (the PSTH window of Fig. 1e and ED Fig. 1a), (b) 400 ms
#   windows (the rate-test window); in 50 ms steps in both (the step of the rate test; a standard
#   choice). The recovery time is the first bin after photoinhibition offset at which the mean
#   selectivity on photoinhibition trials reaches 80% of control (Methods), offset being the end of
#   the ramp (ED Fig. 3b); the time stamp of a window is its centre in reading (a) and its end in
#   reading (b) of a separate choice the paper leaves open. "Control selectivity" is read as the
#   time-matched control value.
# M5. Spike-rate change (Methods). Two-tailed t-test of spike counts in 400 ms windows, control
#   against photoinhibition trials, lick right and lick left pooled, every 50 ms, significant at
#   p < 0.01.
# M6. Population analyses (Methods, Analysis of population dynamics). Sessions from the bilateral
#   experiments (Experiment 2) with > 5 neurons recorded simultaneously for > 5 trials per condition
#   (16 of 38 sessions; 7 mice). The paper does not say whether FS units enter; readings (a)
#   putative pyramidal only (M3), (b) all single units. Spike counts in 400 ms windows in 10 ms
#   steps. cd is the mean over windows in the sample and delay epochs of the difference of mean
#   response vectors, correct lick right minus correct lick left trials; which windows count as in
#   those epochs is open, readings (a) windows whose centre lies in them, (b) windows wholly inside
#   them. cd, decision boundary and session offsets come from one set of control trials, and the
#   projections from independent control and perturbation trials. The split is not stated; readings
#   (a) one random half of control trials for cd, the other half projected, (b) leave-one-out over
#   control trials. Projections are cd^T x on single trials, all trials grouped by instructed
#   movement, minus the session offset. ROC values compare projections on lick right and lick left
#   trials in the last 400 ms of the delay epoch, per session, reported as mean +- s.e.m. over
#   sessions. Movement prediction uses the same window and the decision boundary of the Methods
#   (the inverse-variance weighted mean of the two class means); a trial is predicted lick right when
#   its projection lies on the lick right side; it is compared with the lick the mouse made.
# M7. Behavioural tests. "Two-tailed t-test against control" across mice (Methods); whether paired
#   is not stated, readings (a) paired over mice, (b) unpaired. A mouse's performance is read as
#   (a) its trials pooled over sessions, (b) the mean of its session values.
# M8. Tolerances. 10% of the reported value unless a claim says otherwise. Where the paper gives
#   mean +- s.e.m. the s.e.m. is the tolerance. Counts of deposited units and sessions are exact
#   (tolerance 0), as the units are sorted and labelled in the data set.
