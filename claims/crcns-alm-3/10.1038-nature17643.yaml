- id: models-monolithic-fail
  statement: Monolithic network models (fixed-point attractor, integrators, trained recurrent
    networks) do not recover their unperturbed trajectory after transient silencing of half of
    their neurons.
  source: Results, Robust model networks, paragraph 1; Figure 1c; Extended Data Fig. 1f-i, 4c
  quote: Overall, all “monolithic” models consisting of one network were unable to explain
    robustness
  criterion: A simulation that uses no recorded data (the data set's title says it holds simulations
    as well); parameters from the Methods and ED Fig. 1 legend (simple integrator N = 100, tau 100 ms,
    one eigenvalue 0.99; corrective-feedback integrator with the synaptic time constants given;
    FORCE network N = 400, tau 200 ms, g 1.5, p 0.1, 30 iterations; tamed chaos, 20 iterations).
    Silencing holds half the neurons at zero for 0.2 s < t < 1.0 s. Open details, each a standard
    choice that should not change the outcome, Euler step 1 ms and random seeds; the connectivity of
    the simple integrator beyond its spectrum, the weight-pruning threshold of the tamed chaos
    network and the FORCE learning rate are open and could matter, so three random draws are run.
    Reproduced when, in each model, the output at t = 2 s after perturbation differs from the
    unperturbed output by more than 20% of the unperturbed selectivity (a threshold chosen here)
    in at least two of three draws.
- id: fig6-modular-models-robust
  statement: Modular networks of two coupled modules (attractor, integrator, trained recurrent
    network) restore activity after transient silencing of one module but drift to a random fixed
    point when both are silenced.
  source: Results, Robust model networks, paragraph 2; Figure 6b-d; Methods, Modeling and simulation
  quote: Selective commissural connections restored activity on the other side after unilateral
    transient silencing ( Fig. 6b ). When the two sides are silenced, the network drifts to one of
    the fixed points randomly
  criterion: A simulation with the parameters of the Methods (modular attractor, self weight 0.5235,
    mutual -0.5235, inter-module 0.3, tau 100 ms, the given g(x), input 0.1, tonic 0.5, noise
    variance 0.01; modular integrator with the printed 8 x 8 matrix, tau 10 ms, inputs +-0.04, tonic
    40; modular FORCE network). Integration step 1 ms (a standard choice; for the noise, variance per
    step as printed, and per unit time as a second reading). Unilateral silencing holds one module
    at zero for 0.2 s < t < 1.0 s; bilateral silencing holds both. Reproduced when, for the
    attractor and integrator, the silenced module returns within 10% of its unperturbed state by
    t = 2 s in at least 90% of 100 noisy runs, and after bilateral silencing the attractor ends at
    the wrong fixed point in between 25% and 75% of runs (thresholds chosen here; "randomly" read as
    near one half). The FORCE network is reported, as its training is not fully specified.
