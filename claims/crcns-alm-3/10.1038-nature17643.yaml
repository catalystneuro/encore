- id: fig3-cd-predicts-movement
  statement: Deviations along the coding direction predict the upcoming movement trial by trial, in
    control trials and after unilateral and bilateral perturbation, even when average selectivity
    is destroyed.
  source: Results, Robustness along the coding direction, paragraphs 2 and 4; Figure 3c; Figure 4b;
    Extended Data Fig. 8b, 9e
  quote: Individual trials with a deviation toward the “lick right” trajectory along the cd
    predicted more frequent “lick right” responses and vice versa ( Fig. 4 , Extended Data Figs 6b
    and 9 ). This analysis shows that even after average selectivity is destroyed by perturbations,
    ALM population dynamics still dictate upcoming movements
  depends_on:
  - fig3-cd-roc
  criterion: M6, trials pooled over sessions (Methods). For each condition (control, ipsilateral,
    contralateral, bilateral), the fraction of trials whose lick matches the side of the decision
    boundary, and performance on lick right and lick left trials binned by distance from the
    boundary (bin 4 on the cd distance scale, ED Fig. 9e, read in the units of cd^T x after the
    session offset; scaling of cd is open, readings (a) cd as the raw mean difference, (b) cd of
    unit length). The paper gives no test; as a standard choice, the fraction of lick right
    responses rises with distance toward the lick right side by logistic regression of the lick
    on the signed distance, p < 0.05, and the prediction accuracy exceeds 0.5 by a binomial test,
    p < 0.05. Reproduced when both hold in control and bilateral trials; partially reproduced when
    they hold in control only.
