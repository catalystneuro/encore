  statement: Juvenile Fmr1-/y and WT rats do not differ in the time spent inactive, the time spent
    in the centre of the arena, or the speed while active.
  source: Figure S1c (t-tests on animal averages, t(10) = 1.53, 1.07 and 1.53, P > 0.05)
  quote: Juvenile Fmr1-/y rats showed no differences in exploratory behaviour in comparison with
    their WT littermates (Figure S1b-c).
  statistics:
  - about: time spent inactive
    test: t-test on animal averages
    statistic: t(10) = 1.53
    p: 0.05
    p_relation: ">"
  - about: time spent in the centre
    test: t-test on animal averages
    statistic: t(10) = 1.07
    p: 0.05
    p_relation: ">"
  - about: speed while active
    test: t-test on animal averages
    statistic: t(10) = 1.53
    p: 0.05
    p_relation: ">"
  criterion: Claim of absence, judged by two-sided Student's t-tests on animal averages at 0.05.
    Over the tracked frames of both exploration sessions, inactive is speed below 1 cm/s (the
    paper's movement threshold for tuning curves); the centre is the disc of half the arena radius
    around the middle of the tracked extent; active speed is the mean speed of frames at or above
    1 cm/s. Reproduced when none of the three tests is significant; not reproduced when any is.
