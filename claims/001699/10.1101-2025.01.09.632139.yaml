# Claims for Moore, Duszkiewicz, Asiminas, Dudchenko, Peyrache & Wood (bioRxiv 2025) on dandiset 001699.
# Source: the full text of version 1 of the preprint (9 January 2025), whose title the dandiset links
# and this target names, read from bioRxiv's JATS XML. Version 2 (7 January 2026, retitled "Altered
# developmental profile of the cortical head-direction signal in a rat model of Fragile X Syndrome")
# revises figures and numbers; its Methods are used only where version 1 leaves a procedure out (the
# decoder and the speed smoothing), and its numbers are given in the attempt's notes for comparison.
#
# When these criteria were written, the author had seen the data check only: the file list and
# metadata, the subjects' genotypes and dates, the units per file, the tracking blocks, the
# trough-to-peak distribution, the contamination scores, the time-lag check of HD information
# pooled over cells per session (not split by genotype), and the pseudo-EMG per sleep stage. The
# totals of units per group had been summed, so unit-counts was written knowing that the archive's
# labels do not give the paper's counts and that one relabelling does. No other claim's analysis
# had been run.
#
# Definitions used by every claim, fixed before the analysis:
# - Groups. The archive labels H3026 as WT and gives H3029 a birth date that makes it an adult. The
#   paper's unit counts (406 units in 7 juvenile WT, 372 in 5 juvenile Fmr1-/y, 543 in 6 adult WT)
#   are matched exactly only if H3026 is a juvenile Fmr1-/y rat and H3029 a juvenile WT rat, and
#   the paper's range of 8 to 83 units per juvenile recording is matched only if H3026 (83 units)
#   is juvenile. The main grouping uses this assignment; the archive's labels are a variant.
#   Juvenile WT H3001 H3006 H3009 H3015 H3022 H3023 H3029; juvenile KO H3003 H3008 H3016 H3019
#   H3026; adult WT H4813 H4815 H4820 H4823 H4826 H4830; adult KO H4817 H4819 H4822 H4824 H4827.
# - H4825's file holds the spikes, waveforms and tracking of H4824, re-timed to H4825's epochs. The
#   recording is counted once, as H4824; H4825 has no data of its own here.
# - Cells. Units with a trough-to-peak duration above 0.5 ms (juvenile) or 0.4 ms (adult), not
#   positive, with a contamination score of at most 0.5 (the Methods say units "below 0.5" were
#   excluded, which would remove nearly every unit; read as above), and at least 100 spikes in the
#   analysed epoch. Every recording day is used; cells re-recorded on the next day cannot be
#   excluded as the paper did, as the files give no probe depth per day; the first day of each rat
#   alone is a variant.
# - Exploration sessions. The files' epoch tables disagree with the tracking (some merge wake and
#   sleep), so session 1 is the first tracking block of at least 10 min and session 2 the first
#   such block starting at least 60 min later; a block over 30 min is cut to its first 1300 s.
# - Tuning curves from session 1, 1 degree bins, 6 degree SD smoothing, speed above 1 cm/s; HD
#   information with occupancy (version 1); half-width; offsets from tuning curve cross-correlation.
# - LME. A linear mixed model of the cell values on genotype with a random intercept per rat, against
#   the model without genotype, by a likelihood-ratio test on maximum-likelihood fits, p < 0.05.
#   Variants (do not decide) are the log values, a Mann-Whitney test on cells, a t-test on animal
#   means, the first day only, uniform occupancy, and the archive's grouping.
# Quotes and statistics added 2026-10-20 from the full text (PDF of the preprint, version 1).
