    value: 406
    tolerance: 40.6
  - quantity: juvenile WT rats
    value: 7
    tolerance: 0.7
  - quantity: juvenile Fmr1-/y units
    value: 372
    tolerance: 37.2
  - quantity: juvenile Fmr1-/y rats
    value: 5
    tolerance: 0.5
  - quantity: adult WT units
    value: 543
    tolerance: 54.3
  - quantity: adult WT rats
    value: 6
    tolerance: 0.6
  - quantity: adult Fmr1-/y units
    value: 507
    tolerance: 50.7
  - quantity: adult Fmr1-/y rats
    value: 6
    tolerance: 0.6
  criterion: Units are the rows of every file's units table, each recording counted once, in the
