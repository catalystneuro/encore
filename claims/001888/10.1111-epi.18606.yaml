    effect and does not interact with genotype (linear mixed model, genotype F = 55.36, p <
    .00001; hour p = .16; interaction p = .49).
  source: Figure 2B
  quote: Hour of the day had no effect on the number of seizures between the two genotypes, and
    Grin2b+/− rats had significantly more seizures overall when compared to wild‐type littermates
  statistics:
  - about: effect of genotype
    test: linear mixed model
    statistic: F = 55.36, df = 1
    p: 0.00001
    p_relation: "<"
    n: 9 wild-type and 15 Grin2b+/- rats
  - about: effect of hour
    test: linear mixed model
    statistic: F = 1.29, df = 23
    p: 0.16
    n: 9 wild-type and 15 Grin2b+/- rats
  - about: hour x genotype interaction
    test: linear mixed model
    statistic: F = .97, df = 23
    p: 0.49
    n: 9 wild-type and 15 Grin2b+/- rats
  criterion: SWD counts per ZT hour per animal (mean of the two days); split-plot ANOVA with
    genotype between and hour within animals. Reproduced when the genotype effect has p < 0.05
    with Het higher and neither hour nor the interaction has p < 0.05. Partially reproduced when
    Het are higher on average but the genotype p >= 0.05, or hour or the interaction is
    significant. Not reproduced when Het are not higher.
