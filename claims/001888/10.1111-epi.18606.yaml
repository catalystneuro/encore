    both genotypes (linear mixed model, treatment p = .0049; ethosuximide-saline p = .0081).
  source: Figure 6B
  quote: systemic ethosuximide resulted in significantly fewer SWDs than memantine and saline
  statistics:
  - about: effect of treatment
    test: linear mixed model
    statistic: F = 6.48, df = 2
    p: 0.0049
    n: 5 wild-type and 12 Grin2b+/- rats
  - about: ethosuximide against saline
    test: Tukey post hoc test
    p: 0.0081
    n: 5 wild-type and 12 Grin2b+/- rats
  - about: ethosuximide against memantine
    test: Tukey post hoc test
    p: 0.015
    n: 5 wild-type and 12 Grin2b+/- rats
  criterion: Needs the pharmacology recordings (2-channel EEG, baseline, treatment and washout
    days), which are not in the dandiset.
