- id: figs4-normal-development
  statement: Grin2b+/- rats survive, grow and develop motor reflexes like WT littermates (survival
    48% and 52%; body weight, righting reflex and negative geotaxis do not differ).
  source: Results, Normal physical and motor development in Grin2b+/- rats, paragraph 1; Figure S4
  quote: Following weaning, survival rates were determined to be 48% for Grin2b+/− rats and 52% for
    ... Taken together, these findings indicate that Grin2b haploinsufficiency does not impair
    physical development or gross motor function
  statistics:
  - about: pup body weight, effect of genotype (Figure S4A)
    test: linear mixed model
    statistic: F = 2.78, df = 1
    p: 0.12
    n: 5 wild-type and 8 Grin2b+/- pups
  - about: adult body weight, effect of genotype (Figure S4B)
    test: linear mixed model
    statistic: F = .0056, df = 1
    p: 0.94
    n: 47 wild-type and 49 Grin2b+/- rats
  - about: righting reflex, effect of genotype (Figure S4C)
    test: linear mixed model
    statistic: F = .29, df = 1
    p: 0.6
    n: 12 wild-type and 18 Grin2b+/- pups
  - about: negative geotaxis (Figure S4D)
    test: Wilcoxon rank-sum test
    statistic: W = 87
    p: 0.37
    n: 12 wild-type and 18 Grin2b+/- pups
  criterion: Needs the survival, weight and reflex measures, which are not in the dandiset.
- id: figs1-scorer-agreement
  statement: The automated sleep scorer agrees with visual scoring on 90.8% of epochs (Cohen's
    kappa 0.83).
  source: Supplementary Methods; Table S1; Figure S1
  quote: Overall agreement between the scoring methods is 90.8%. The kappa coefficient was .83
  criterion: Needs the visual scores of the 4-h validation periods, which are not in the
    dandiset.
- id: fig6b-systemic-etx-number
