# Claims for Randi, Sharma, Dvali & Leifer (2023) on dandiset 001075.
# Source: the full text in PubMed Central (PMC10632145, open access, CC BY), with its Methods,
# figure legends and the Source Data files of the Nature article.
#
# When these criteria were written, the author had seen the data check only: the file list of
# both published versions, the metadata and contents of the files, counts of subjects,
# recordings, stimulations, ROIs and labels, the stimulation durations, powers and intervals,
# the recording lengths, the units and ranges of the traces, the per-recording fit of the
# target positions, and the rate at which the stimulated ROI passes the paper's response
# classifier at the true and at shifted stimulation times. While testing the pipeline on one
# recording (sub-0), the author saw three single-trial dF/F0 values of AVDR after AVJR
# stimulation (0.21, 0.15, -0.04). No claim's analysis over the recordings had been run. The
# author had read the paper's Source Data (per-pair observation counts, mean dF/F0 and q values
# of Extended Data Figs. 3 and 4, and the distance distributions of Extended Data Fig. 2i,j).
#
# The dandiset holds the 113 wild-type-background (WT) recordings of the paper; 110 have the
# segmentation file with the extracted traces. The unc-31 recordings, the spontaneous-activity
# recordings of Fig. 6 and the unstimulated control recordings that define the null
# distribution of every q value are not in it. The paper's OSF repository (doi
# 10.17605/OSF.IO/E2SYT) holds exported traces of the WT and unc-31 recordings and the
# spontaneous recordings, but not the control recordings, which the code reads from private
# paths.
#
# Method choices fixed here (see the helper module for where each comes from): traces are the
# file's NaN-interpolated green signal, corrected for photobleaching, cleaned of outliers and
# smoothed as in the Methods; a stimulation counts only when the stimulated ROI passes the
# paper's response classifier (autoresponse); the stimulated ROI is the manually located ROI
# when the file gives one, otherwise the ROI centroid nearest the stimulation target; neurons
# are named by their NeuroPAL label, without merging left and right, and a label is taken to
# name the same neuron in every animal; <dF/F0>_t is the mean of (F - F0)/F0 over 30 s after
# the stimulation with F0 the mean of the 30 s before; a trace is used for a stimulation when
# it has no run of missing volumes longer than 5% of the 90 s window; head neurons are the 188
# of the paper's code.
#
# The criteria of fig4-rid-wt and fig4-rid-unc31 were added after the first verification round,
# which asked whether any ROI or stimulation names RID. When they were written, the author had
# run every other claim and had seen only these counts for RID: 11 ROIs labelled RID in 11
# dandiset recordings, 5 manually located targets on such ROIs, 12 stimulations of the WT export
# whose ROI is labelled RID, and 28 stimulations in 8 of the 18 recordings of the unc-31 export
# whose ROI is labelled RID. No response to a RID stimulation had been computed.
schema_version: 1
dandiset: "001075"
paper: doi:10.1038/s41586-023-06683-4
claims:
- id: recordings-protocol
  statement: Activity was recorded from 113 WT-background animals, each for up to 40 min, while
    a neuron was stimulated once every 30 s with a 0.5 s train of light pulses.
  source: Results, "Population imaging and single-cell activation"; Methods, "Stimulus delivery
    and pulsed laser"
  expected:
  - quantity: WT-background animals recorded with stimulation
    value: 113
    tolerance: 0
    unit: animals
  criterion: Reproduced when 113 recordings hold both calcium traces and a stimulation table,
    the median interval between stimulations is within 10% of 30 s, and at least 90% of
    recordings last no more than 44 min (40 min plus 10%). Partially reproduced when the
    interval and duration conditions hold and between 100 and 112 recordings hold traces and
    stimulations. The stated 0.5 s duration is reported, with whether the files could show
    any other.
- id: pairs-measured
  statement: Responses to stimulation were imaged for 23,433 pairs of neurons (66% of all
    possible pairs in the head), from 186 of the 188 head neurons, and some pairs were observed
    as many as 59 times.
  source: Results, "Signal propagation map"; Extended Data Fig. 4a
  expected:
  - quantity: head neuron pairs observed at least once
    value: 23433
    tolerance: 2343
    unit: pairs
  - quantity: head neurons recorded while another neuron was stimulated
    value: 186
    tolerance: 18.6
    unit: neurons
  - quantity: largest number of observations of one pair
    value: 59
    tolerance: 5.9
    unit: observations
  criterion: An observation of pair (i, j) is a stimulation of the neuron labelled j that
    evoked an autoresponse, while an ROI labelled i had a usable trace (5% NaN rule and a
    nonzero local standard deviation); both labels must be among the 188 head neurons. The
    paper's text allows these readings, (a) pairs including i = j (the Source Data count of
    23,433 includes the diagonal), (b) pairs with i different from j, (c) as (a) without
    requiring the autoresponse. Reproduced when under one reading all three values are within
    tolerance; partially reproduced when one or two are. Counts per animal are reported.
- id: fig1e-avjr-avdr
  statement: Stimulation of the interneuron AVJR evoked activity in AVDR.
  source: Fig. 1e
  criterion: Over all AVJR stimulations with an autoresponse in which AVDR was observed, the
    mean <dF/F0>_t of AVDR is above 0 and the response classifier detects an AVDR response in
    at least one of them. Reproduced when both hold; not reproduced otherwise. The value per
    animal and the number of trials are reported.
- id: fig1f-aver-avar
  statement: Activation of the premotor interneuron AVER evoked activity transients in AVAR.
  source: Fig. 1f
  criterion: As for fig1e-avjr-avdr, with AVER stimulated and AVAR observed.
- id: fig1g-saadl-ollr
  statement: Activation of SAADL inhibited the activity of the sensory neuron OLLR.
  source: Fig. 1g
  criterion: Over all SAADL stimulations with an autoresponse in which OLLR was observed, the
    mean <dF/F0>_t of OLLR is below 0 and the classifier detects an OLLR response in at least
    one of them. Reproduced when both hold; not reproduced otherwise.
- id: sourcedata-link
  statement: The per-pair measurements computed from the dandiset agree with the paper's
    published per-pair values, the number of observations (Extended Data Fig. 4a) and the mean
    response <dF/F0>_t (Extended Data Fig. 3a).
  source: Source Data of Extended Data Figs. 3a and 4a
  data: with_inputs
  criterion: Pairs are matched by the names of the responding and the stimulated neuron.
    Reproduced when at least 90% of the paper's observed pairs are observed here, the Spearman
    correlation of the observation counts over pairs observed in both is at least 0.9, and the
    Pearson correlation of mean <dF/F0>_t over pairs observed in both is at least 0.7.
    Partially reproduced when at least 70% are observed here and the two correlations are at
    least 0.7 and 0.5. Not reproduced otherwise. The mean over all observations is the main
    reading; the mean over detected responses only and the code's correction of decaying
    traces are shown as variants.
- id: osf-link
  statement: The dandiset's recordings can be linked to the recordings the paper exported to
    its OSF repository, and the stimulated neuron found here from the target position agrees
    with the one the paper's pipeline assigned.
  source: Data availability (OSF doi 10.17605/OSF.IO/E2SYT, raw_extracted_data)
  data: with_labels
  criterion: Recordings are matched by the date and time in the dandiset's session id and in
    the folder name the export gives for each recording. Reproduced when at least 95% of the
    110 recordings with traces match one exported recording with the same number of
    stimulations and ROIs, and, over stimulations that both assign to an ROI, at least 80% are
    assigned to the same ROI. Partially reproduced when at least 80% of recordings match and
    the agreement is at least 60%. The labels of matched ROIs are compared as well, and the
    head-pair count of pairs-measured is shown with the exported assignment as a variant.
- id: fig2d-inhibitory-fraction
  statement: 11% of the functional connections at q < 0.05 are inhibitory.
  source: Results, "Signal propagation map"; Fig. 2d
  data: with_inputs
  depends_on:
  - sourcedata-link
  expected:
  - quantity: fraction of q < 0.05 pairs with a negative mean response
    value: 0.11
    tolerance: 0.011
    unit: fraction
  criterion: The q values cannot be computed from the dandiset (see fig2c-1310-connected), so
    the pairs with q < 0.05 are taken from the paper's Source Data (Extended Data Fig. 4b), and
    the sign of each pair's mean <dF/F0>_t is computed from the dandiset. Readings, (a) all
    q < 0.05 pairs observed here, including i = j; (b) excluding i = j. Reproduced when the
    fraction with a negative mean is within tolerance under one reading; the fraction from the
    paper's own Source Data means is given for reference.
- id: edfig2ij-spatial-specificity
  statement: Stimulation does not elicit responses in most close neighbours of the targeted
    neuron; at 75% of the cumulative distribution, neighbours' responses are below a dF/F0 of
    0.1.
  source: Extended Data Fig. 2i,j and legend; Methods, "Characterization of the size of the
    two-photon excitation spot"
  expected:
  - quantity: fraction of neighbour responses below dF/F0 of 0.1
    value: 0.75
    tolerance: 0.075
    unit: fraction
  criterion: Over stimulations with an autoresponse, <dF/F0>_t of the targeted ROI (0 um) and
    of every other ROI with a usable trace whose centroid lies 4 to 10 um or 10 to 16 um away,
    with 0.42 um per pixel and the imaging file's plane spacing. The legend does not say which
    neighbours the 75% refers to; readings, (a) both bands pooled (4 to 16 um), (b) 4 to 10 um,
    (c) 10 to 16 um. Reproduced when under one reading the fraction below 0.1 is within
    tolerance and the median of the targeted ROI is at least three times that of the 4 to 10
    um band. Partially reproduced when only the second condition holds.
- id: fig2c-1310-connected
  statement: 1,310 of the 23,433 measured neuron pairs (6%) are functionally connected at
    q < 0.05.
  source: Results, "Signal propagation map"; Fig. 2c
- id: fig2c-bilateral
  statement: Bilaterally symmetric neurons are eight times more likely to be functionally
    connected than pairs chosen at random.
  source: Fig. 2c
- id: fig2efg-path-length
  statement: The probability of a functional connection decreases with the minimal anatomical
    path length, functionally connected pairs are on average 2.1 hops apart, and pairs with
    long paths are more often functionally non-connected.
  source: Fig. 2e-g
- id: fig3-anatomy-predictions
  statement: Signal propagation differs from predictions of a connectome-constrained model;
    pairs predicted to respond strongly respond more, but agreement over all pairs is poor
    (R2 < 0), improves when weights and signs are fitted, and is better in unc-31 animals.
  source: Fig. 3b-d
- id: edfig6-kernel-stereotypy
  statement: Kernels of one neuron pair are more similar to each other than to kernels of
    other pairs, and kernel rise times characterize the speed of signal propagation.
  source: Extended Data Fig. 6b-f
- id: edfig7b-unc31-fewer
  statement: unc-31 mutants have a smaller proportion of functionally connected pairs than WT
    animals.
  source: Extended Data Fig. 7b
- id: fig4-rid-wt
  statement: URX, ADL and AWB, predicted from anatomy to have no response, respond strongly to
    RID stimulation in WT animals.
  source: Fig. 4a-d; Extended Data Fig. 7c
  criterion: RID stimulations are those whose stimulated ROI, found as in the other claims,
    carries the NeuroPAL label RID. As the Methods state for Fig. 4, no autoresponse is required
    and values of <dF/F0>_t beyond 2 in absolute value are excluded; the dandiset holds only the
    regular traces, not the matchless ones. Readings, (a) URX, ADL and AWB with left and right
    pooled; (b) the neurons shown in Fig. 4, URXL, ADLR and AWBR. For each of the three, over
    RID stimulations in which it is observed, the mean <dF/F0>_t is above 0 and the classifier
    detects a response in at least one trial. Reproduced when this holds for all three under one
    reading; partially reproduced when it holds for one or two; not reproduced when for none.
    Blocked (other) when none of the three is observed after a RID stimulation. Where each mean
    falls among the means of all head pairs is reported for "strongly".
- id: fig4-rid-unc31
  statement: The responses of URXL, ADLR and AWBR to RID stimulation are reduced or absent in
    unc-31 mutants.
  source: Fig. 4b-d
  data: elsewhere
  where: OSF doi 10.17605/OSF.IO/E2SYT (exported_data_full.tar.gz and exported_data_unc31.tar.gz)
  depends_on:
  - fig4-rid-wt
  criterion: In the 18 unc-31 recordings of the OSF export (exported_data_unc31.tar.gz), RID
    stimulations are those whose exported stimulated ROI carries the exported label RID. The
    exported traces are processed as the dandiset's, with the inclusion rules of fig4-rid-wt and
    the same two readings. A neuron's response is reduced when its mean <dF/F0>_t in unc-31 is
    below its WT mean in fig4-rid-wt. Reproduced when the response is reduced for every one of
    the three neurons observed in both strains under one reading; partially reproduced when for
    some; not reproduced when for none. Blocked (other) when none is observed in both. Because
    the WT values come from the dandiset and the unc-31 values from the export, the WT values
    computed in the same way from the WT export are shown as a variant.
- id: fig5-extrasynaptic-screen
  statement: Fifty-three pairs are functionally connected in WT (q < 0.05) and functionally
    non-connected in unc-31 (q_eq < 0.05), with timescales similar to all functional
    connections.
  source: Results, "Extrasynaptic-dependent signal propagation screen"; Fig. 5a; Extended Data
    Fig. 9
- id: fig6-spontaneous
  statement: Correlations derived from the measured kernels predict spontaneous activity
    correlations better than anatomical weights or the connectome-constrained model.
  source: Fig. 6
  data: elsewhere
  where: OSF doi 10.17605/OSF.IO/E2SYT (spont_data_fig6.zip)
  depends_on:
  - edfig6-kernel-stereotypy
