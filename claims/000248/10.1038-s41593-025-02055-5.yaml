    absence of contrast within their receptive fields, paragraph 3
  quote: When analyzing only fixed-gaze trials, there were n = 11 exclusively center-responsive V1
    RS units; 10 sessions had eye tracking data and of these, 9 sessions had a valid receptive field
    mapping block where the fixed-gaze constraint left at least one trial in each position
