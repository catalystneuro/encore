- id: fig2d-npx-ccg-hva-input
  statement: V1 IC-encoders (n = 79) are more likely than V1 segment responders (n = 526) to receive
    putative excitatory connections from higher visual areas, by cross-correlogram analysis.
  source: Figure 2d legend; Results, A subpopulation of V1 neurons respond to ICs but not to its
    inducing segments, paragraph 4
  quote: V1 IC-encoders ( n = 79) are substantially more likely than V1 segment responders ( n =
    526) to receive putative excitatory connections from higher visual areas (LM, RL, AL, PM and AM)
  statistics:
  - test: Wilcoxon rank-sum test
    p: 7.0e-6
    n: 79 V1 IC-encoders and 526 V1 segment responders, 12 sessions from 12 mice
  expected:
  - quantity: V1 IC-encoders in the analysis
    value: 79
    tolerance: 7.9
    unit: units
  - quantity: V1 segment responders in the analysis
    value: 526
    tolerance: 52.6
    unit: units
  criterion: Methods, Cross-correlogram analysis. Spike trains of cortical RS units over the
    ICwcfg1 block in 1 ms bins; CCG(tau) = sum over t of x1(t) x2(t + tau) divided by the square
    root of the two spike counts, tau up to +/- 100 ms (code analyze_CCGfftlong.m); the CCG of the
    same trains smoothed with a 25 ms window is subtracted; a putative excitatory connection from an
    HVA unit to a V1 unit when the corrected CCG peak in the 1 to 10 ms window with the HVA unit
    leading exceeds 7 times the SD of the CCG flank (50 to 100 ms from zero). Groups as in the
    opening comment, in ICwcfg1 (larger repository, aggregate_ctxqcCCGfftlong.m lines 285 to 287).
    Open details, each could change the outcome. Smoothing window shape, (a) a 25-bin boxcar, (b) a
    Gaussian kernel 25 ms long with s.d. 5 ms, the kernel the paper uses for PSTHs (Extended Data
    Fig. 4b legend). Flank SD taken from (i) the uncorrected CCG (larger repository,
    line 77), (ii) the corrected CCG. Per V1 unit measure, (x) the fraction of the session's HVA RS
    units with a connection to it (larger repository, Pin_flank.HVA), (y) the number of such units.
    Reproduced when, under every combination, IC-encoders have the higher median and a two-sided
    rank-sum test gives p < 0.05; not reproduced when none does; when the readings differ the
    claim is blocked as methods_underspecified with all results shown. Group sizes are compared
    with the expected counts.
