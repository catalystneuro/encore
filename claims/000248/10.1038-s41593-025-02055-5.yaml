# Claims for Shin, Ogando, Abdeladim, ... Lecoq & Adesnik (2025), "Recurrent pattern completion
# drives the neocortical representation of sensory inference", Nature Neuroscience 28, 2319-2329,
# on dandiset 000248 ("Allen Institute Openscope - Illusion project").
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record (CC BY 4.0), full text from Europe PMC in
# paper/10.1038-s41593-025-02055-5.txt: main text, figure legends, Methods and the Extended Data
# figure legends (Extended Data Figs. 1 to 10). The Supplementary Information (Supplementary
# Results, Supplementary Discussion, Supplementary Figs. 1 to 8) is not in paper/ and was not
# read. The main findings are shown in the main and Extended Data figures; the Supplementary
# Figures are cited for support only (Supp. Fig. 1 heatmaps of the subsets, Supp. Fig. 2 mesoscope
# area borders, Supp. Fig. 3 other decoders, Supp. Fig. 4, Supp. Fig. 6). The claim that rests on
# a Supplementary Figure (supp3-decoder-types) says so. The bioRxiv preprint (10.1101/2023.06.05.543698,
# version 1) is also in paper/; it was not used. No PDF was supplied, so no figure was read.
#
# Code. The paper's Code availability names a Code Ocean capsule, 10.24433/CO.6659254.v2
# (codeocean.com/capsule/2540707); it returned HTTP 403 from this run and was not read. Read in
# its place, as the first author's public code for this dataset (its data path is
# 'S:\OpenScopeData\00248_v240130\'): github.com/hs13/IC_paper_code at commit
# 50e04eaf7c9192a067c129f3c1f174a27f10c406 (2024-10-27, "Initial commit"), cited below as "the
# code". It holds the Neuropixels analysis only, in MATLAB: postprocessnwb_v240130.m (reads the
# NWB files, trial parsing, response windows), analyzeStaticICtxi.m (IC-encoder, LC-encoder and
# segment responder definitions), analyzeRFCI.m (receptive fields), merge_postprocessed.m,
# analyzeICtxi_SVM_areas.m and aggregateICtxi_SVM_trainICRC_areas.m / _trainREx_areas.m (decoding),
# plot_SVM_*.m, analyze_CCGfftlong.m and computeCCGpeaktroughs.m (raw cross-correlograms),
# analyzeMouseEye.m, aggregateMouseEye.m and aggregate_fixedgaze.m (eye tracking). The
# cross-correlogram correction and the Fig. 2d count are not in it; they were read in the same
# author's larger repository github.com/hs13/Analyze_IC_OpenScope_v240130 at commit
# 4ee15852ca19bf32ff876ede0598f3099f2e4208 (aggregate_ctxqcCCGfftlong.m), which the paper does not
# link and which is cited as "the larger repository", a lower source than the Methods and the code.
# No code for the 2p analyses or for the Figure 1 percentages was found.
#
# Data the paper describes. Three kinds of experiment.
# (1) Neuropixels (this dandiset; Data availability gives dandiset 000248): 12 sessions from 12
# mice, six probes targeted to V1, LM, RL, AL, PM and AM, Allen Brain Observatory pipeline,
# Kilosort2, spike times per unit. The Methods' Animals list Sst-IRES-Cre;Ai32 (n = 10) and
# PV-IRES-Cre;Ai32 (n = 4) mice, 14 in all, against 12 elsewhere; the code's CCG script names 12
# subjects (sub-619293, 619296, 620333, 620334, 625545, 625554, 625555, 630506, 631510, 631570,
# 633229, 637484). Analyzed units are regular-spiking (RS) units, trough-to-peak width >= 0.4 ms
# (the code uses the NWB units column waveform_duration > 0.4). A unit's area is the location
# label of its peak channel (code; 'VISp' and not 'VISpm' for V1). Stimuli, monocular on a monitor
# 15 cm from the right eye. IC blocks (Extended Data Fig. 1b) ICwcfg1 (default, white circles on
# black), ICwcfg0 (rotated 315 degrees), ICkcfg1 and ICkcfg0 (black-white inverted); each image
# 0.4 s with 0.4 s ITI; in ICwcfg1 the IC and LC images 400 times and the others at least 50; in
# configuration 0 each image 30 times. Images per IC block (code trial codes): blank 0, X 101,
# TC1 105, IC1 106, LC1 107, TC2 109, LC2 110, IC2 111, IRE1 506, IRE2 511, TRE1 1105, TRE2 1109,
# XRE1 1201, XRE2 1299, In BR/BL/TL/TR 1301 to 1304, Out BR/BL/TL/TR 1305 to 1308. In the NWB
# stimulus table of an IC block the code takes every second row from the first non-zero frame
# (image rows alternate with ITI rows) and maps the frame value to these codes. Receptive field
# block (RFCI) 16-degree drifting grating patches at 9 positions (center and 8 at 16 degrees), each
# presentation 4 directions of 0.25 s, 10 repeats; size tuning block (sizeCI) 0 to 64 degrees.
# Eye tracking video at 30 Hz with pupil ellipse fits in the NWB (EyeTracking); running wheel.
# (2) 2p calcium imaging (not in this dandiset): V1L2/3 (CaMKII-tTA;tetO-GCaMP6s, 11 sessions from 5
# mice for decoding; 29 sessions from 5 mice for Fig. 1), V1L4 (Scnn1a-Tg3-Cre;Ai162, 8 sessions
# from 2 mice), 2p mesoscope (19 sessions from 5 mice); z-scored neuropil-corrected fluorescence.
# (3) 2p holographic optogenetics (24 sessions from 4 mice, GCaMP6m-ChRmine) and the 2p holographic
# mesoscope (11 sessions from 2 Vglut1-Cre;Ai203 mice). Not in this dandiset.
# Outside data. The paper deposits "Additional postprocessed data" in the same Code Ocean capsule
# and does not say what they are; it does not say where the 2p and holography recordings are. The
# 2p and holography claims are marked data dataset (the paper's own recordings); the author is to
# find whether any public copy exists.
#
# Shared methods, cited below by name.
# "IC response": per trial, the mean spike rate from 0 to 400 ms after image onset (code,
# postprocessnwb_v240130.m and merge_postprocessed.m, 1 ms bins).
# "IC-encoder" (Methods, Definition of functional subsets; code analyzeStaticICtxi.m): in one IC
# block, Kruskal-Wallis across blank, IC1, LC1, LC2 and IC2 trials at p < 0.05, then Tukey-Kramer
# comparisons (MATLAB multcompare default); IC1-encoder when IC1 differs from blank at p < 0.05 with
# AUROC against blank > 0.5 and neither LC1 nor LC2 differs from blank; IC2 likewise. LC-encoders
# (Extended Data Fig. 10a) the same with IC and LC exchanged.
# "segment responder" (Methods; code): BR-segment responder when Kruskal-Wallis across blank and
# the 8 segment images is p < 0.05, a rank-sum test of In BR against Out BR trials is p < 0.05 with
# AUROC > 0.5, and the unit is neither IC- nor LC-encoder; likewise BL, TL, TR. The Methods name
# only the rank-sum test; the Kruskal-Wallis gate is the code's.
# "decoder" (Methods, Decoding analysis; code analyzeICtxi_SVM_areas.m): block ICwcfg1; units of
# one area (RS units for Neuropixels; code aggregate scripts load the 'RS' files); response as the
# IC response; training classes IC1, LC1, LC2, IC2, trials balanced to the smallest class by taking
# its first trials; tenfold stratified partition (cvpartition), test sets not overlapping; each
# fold z-scores every unit by the training trials' mean and SD (NaN set to 0); linear SVM in
# MATLAB fitcecoc (default one-vs-one coding, templateSVM with Standardize true). Cross-validation
# accuracy is the mean over the four classes of the fraction of test trials decoded correctly,
# averaged over folds. Probe trials are decoded by each of the ten fold models and the fractions
# averaged. Neuropixels areas are kept in a session when it has >= 50 RS units there; 2p areas
# when >= 100 neurons. Open detail, could change the outcome: the code calls fitcecoc with
# OptimizeHyperparameters 'auto' (MATLAB Bayesian optimization of the coding and SVM
# hyperparameters, its default settings), which the Methods do not mention. Readings, run both:
# (a) fixed defaults, linear SVM with C = 1, one-vs-one; (b) C chosen by an inner cross-validation
# on the training folds, the Python counterpart of the code's search.
# "inference score" (Results; code aggregateICtxi_SVM_trainICRC_areas.m line 171): with P(x -> y)
# the fraction of x trials decoded as y, ((P(TRE1->IC1) - P(TRE1->LC1)) + (P(TRE2->IC2) -
# P(TRE2->LC2)))/2 per session; tested against 0 across sessions with a two-sided Wilcoxon
# signed-rank test (the same test as IC against LC fractions paired by session).
# The Statistics section says tests are nonparametric and two-sided unless noted.
schema_version: 2
dataset:
  archive: dandi
  id: "000248"
paper: doi:10.1038/s41593-025-02055-5
claims:
- id: fig1e-npx-exclusive-center
  statement: In the Neuropixels data, 18 of 1,804 V1 RS units respond exclusively to the grating
    patch at the center position (the illusory gap region) of the receptive field mapping block.
  source: Methods, Definition of functional subsets of neurons, paragraph 1; Figure 1e legend
  quote: In the Neuropixels data, there were n = 18 exclusively center-responsive neurons of 1,804
    V1 RS units
  expected:
  - quantity: exclusively center-responsive V1 RS units
    value: 18
    tolerance: 1.8
    unit: units
  - quantity: V1 RS units, all 12 sessions
    value: 1804
    tolerance: 180.4
    unit: units
  criterion: V1 RS units as in the opening comment. Per RF trial (one presentation of the four
    directions, 1 s), the mean rate from 0 to 1000 ms after onset (code, postprocessnwb_v240130.m,
    every fourth row of the RFCI table), standard (not inverse) patches only. The Methods test
    each position against gray-screen trials with a Wilcoxon rank-sum test, Bonferroni-Holm
    corrected, and keep units significant at the center only. The RF block has no gray-screen
    trials (0 s ITI), so what forms the gray-screen sample is open. Readings, (a) the code
    (analyzeRFCI.m, RFsigexclclassic with RFindclassic = center), a Wilcoxon signed-rank test of
    each position's trial rates against the unit's mean rate in the longest spontaneous block,
    the position of largest mean response being the center and the only one significant after the
    Holm step; (b) the Methods, a rank-sum test of each position's trial rates against rates in
    1 s windows tiled over the longest spontaneous (gray screen) block, Holm corrected over the 9
    positions, center the only significant position. Reproduced when, under one reading, both
    counts are within tolerance.
- id: fig1f-npx-ic-ire-responsive
  statement: Of the exclusively center-responsive V1 RS units, 66.7% respond substantially to the
    IC image and 77.8% to the real-edge (IRE) image of their preferred IRE orientation, although
    the IC image has no contrast in their receptive field.
  source: Figure 1f legend; Results, Mouse V1 neurons respond to ICs despite the absence of contrast
    within their receptive fields, paragraph 2
  quote: Bottom, individual neurons with substantially I C -responsive (left; 66.7%) and I RE
    -responsive (right; 77.8%) neurons marked in magenta on the y axis
  depends_on:
  - fig1e-npx-exclusive-center
  expected:
  - quantity: IC-responsive fraction of exclusively center-responsive units
    value: 66.7
    tolerance: 6.67
    unit: percent
  - quantity: IRE-responsive fraction of exclusively center-responsive units
    value: 77.8
    tolerance: 7.78
    unit: percent
  criterion: Units of fig1e-npx-exclusive-center. Preferred IRE orientation is the IRE image with
    the strongest mean IC response (Results, paragraph 2); the IC image is the one with the illusory
    bar of that orientation. Neither the Methods nor the code read fixes the test for
    "substantially responsive" or the block. Readings, test (a) the code's analyzeStaticICtxi.m,
    Kruskal-Wallis across blank, IC and IRE of that orientation at p < 0.05 with Tukey-Kramer
    comparison against blank at p < 0.05 and mean above blank (sigmcBICREl1/2); (b) a rank-sum test
    of those trials against blank trials at p < 0.05 with AUROC > 0.5. Block (i) ICwcfg1 only, two
    orientations (135 and 45 degrees); (ii) ICwcfg1 and ICwcfg0 together, four orientations.
