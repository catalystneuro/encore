    value: 9
    tolerance: 0
    unit: sessions
  criterion: Fixed-gaze trials per the Methods (Eye tracking analysis), pupil position within 8
    visual degrees of the modal pupil position throughout the trial. The code (analyzeMouseEye.m)
    uses the NWB EyeTracking pupil fits, a threshold of 20 camera pixels (its stand-in for 8
    degrees) on the maximum distance from the mode during the trial, and drops likely blinks. The
    paper gives no pixel to degree conversion, so the threshold is open. Readings, (a) 8 visual
    degrees, when the dataset gives pupil or gaze position in degrees; (b) the code's 20 camera
    pixels. Then fig1e, fig1f and fig1g are repeated on fixed-gaze trials only, in the sessions whose
    fixed-gaze RF trials cover all 9 positions. Session counts must match exactly. The paper shows
    the match against a shuffle null (Extended Data Fig. 2e) and gives no threshold for it; the
    95th percentile of 1,000 shuffles of the preferred IC orientations among those units is a
    standard choice, recorded as a deviation, and the match fraction is also compared with the
    78.6% of fig1g. Reproduced when the unit count is within tolerance and the match exceeds that
    percentile; partially reproduced when one holds.
