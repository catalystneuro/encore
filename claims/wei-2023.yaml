- id: fig5c-sp-rs-two-way-mapping
  statement: A random forest trained on the SP models' multi-channel features identifies SP1 to
    SP3 with more than 94% accuracy and maps RS1 to SP1, RS2 to SP2 and RS3 to SP3; the
    experiment-based classifier maps SP1 to SP3 back to RS1 to RS3.
  source: Results, Composition and properties of multi-channel RS clusters, paragraph 2;
    Figure 5c,d
  quote: we applied the model-based classifier on the test experimental data sets (in vivo
    clustered RS1-3) and found that, indeed, RS1 units are mapped to SP1, RS2 to SP2, and RS3
    to SP3 with high fidelity (performance... >94%; Fig. 5c )
  expected:
    quantity: model-based classifier accuracy
    value: 94
    unit: percent
  data: with_inputs
  depends_on:
  - fig5a-sp-models-three-clusters
  - fig5d-experiment-classifier-rs
  criterion: Random forest as fig5d-experiment-classifier-rs, trained on SP1 to SP3 and
    applied to RS1 to RS3, and the reverse. Reproduced when the model-based validation
    accuracy exceeds 94%, the most frequent SP label of each RS cluster is the matching one,
    and each SP cluster's models are labelled the matching RS cluster by majority.
- id: fig5e-ca-lva
  statement: Axonal low-voltage-activated Ca conductance is higher in SP1 and SP3 models than
    in SP2 models, with a large effect size.
  source: Results, Composition and properties of multi-channel RS clusters, paragraph 3;
    Figure 5e
  quote: Pairwise comparison between SP1 and 3 model conductances indicates that the axonal
    low-voltage activated Ca-conductance is increased for SP1 and SP3 vs. SP2 (Cohen's d effect
    size > 0.8; Fig. 5e )
  data: elsewhere
  where: GitHub yinawei/Mouse-all-active-models-EAP (Zenodo doi:10.5281/zenodo.7679762);
    Source Data sheet Fig5e
  criterion: Cohen's d of axonal gbar_Ca_LVA. Reproduced when d > 0.8 for SP1 against SP2 and
    SP3 against SP2, with SP2 lower.
- id: fig5g-bifurcation-velocity-sp
  statement: Across SP models the morphological bifurcation distance is linearly related to the
    inverse spike propagation velocity (slope 2.7, r = 0.8).
  source: Results, Composition and properties of multi-channel RS clusters, paragraph 3;
    Figure 5g, right
  quote: the morphology bifurcation distance exhibits a strong linear relationship with the
    spike propagation speed across SP1-3 (Fig. 5g right, slope = 2.7, the correlation
    coefficient r = 0.8
  statistics:
  - test: linear regression
    statistic: r = 0.8, slope = 2.7
    p: 1.02e-07
    n: 15 SP models, above and below soma
  expected:
  - quantity: slope
    value: 2.7
    tolerance: 0.27
  - quantity: correlation coefficient
    value: 0.8
    tolerance: 0.08
  data: elsewhere
  where: Allen Cell Types Database reconstructions (cell ids of Table S1); Source Data sheet
    Fig5g
  criterion: Bifurcation distance as Methods eq. 2 (normalised, nodes beyond 200 um excluded,
    summed above and below soma) against 1/V above and 1/V below. Reproduced when slope and r
    fall within tolerance with p < 0.001.
- id: fig5j-sp1-rate-tau
  statement: In vitro, SP1 neurons reach a higher maximum spike rate than SP2 neurons and are
    more electrotonically compact (differing cellular time constant).
  source: Results, Composition and properties of multi-channel RS clusters, paragraph 4;
    Figure 5j
  quote: Specifically, SP1 neurons achieve a higher spike rate especially compared to SP2 ...
    Moreover, SP1 is more electrotonically compact than SP2 (Fig. 5j ).
  data: elsewhere
  where: Allen Cell Types Database (cell ids of Table S1); Source Data sheet Fig5j
  criterion: Cohen's d (the legend marks d > 0.8). Reproduced when SP1 against SP2 gives d >
    0.8 for maximum spike rate, SP1 higher, and for tau.
- id: fig6b-pvalb-sst-models-symmetry
  statement: The symmetry index separates Pvalb from Sst models, Pvalb models being more
    symmetric.
  source: Results, Multi-channel features separate inhibitory Pvalb and Sst, paragraph 1;
    Figure 6b, right
  quote: Notably, a clearer separation between Pvalb and Sst models was achieved based on the
    symmetry index
  statistics:
  - test: two-sample t-test, two-sided
    p: 0.000998
    n: 9 Pvalb and 9 Sst models
  data: elsewhere
  where: model_features.csv in yinawei/Mouse_V1_EAP_Analysis (Zenodo doi:10.5281/zenodo.
    7679748); Source Data sheet Fig6b
  criterion: Symmetry index of the models. Reproduced when Pvalb mean is lower with p < 0.01.
- id: fig6cf-kv31
  statement: Pvalb and Sst models differ significantly in three conductances, the largest
    effect being dendritic Kv3.1.
  source: Results, Multi-channel features separate inhibitory Pvalb and Sst, paragraph 2;
    Figure 6c,f
  quote: Pairwise comparison between Pvalb and Sst models at the level of ionic conductances
    reveals statistically significant differences in three conductances, with the effect size
    being largest for Kv3.1
  statistics:
  - test: Mann-Whitney U test, two-sided
    p: 0.05
    p_relation: <
    n: 9 Pvalb and 9 Sst models
  data: elsewhere
  where: GitHub yinawei/Mouse-all-active-models-EAP (Zenodo doi:10.5281/zenodo.7679762);
    Source Data sheet Fig6cf
  criterion: Mann-Whitney tests of every conductance. Reproduced when exactly three give p <
    0.05 and dendritic Kv3.1 has the largest |d| among them.
- id: fig6d-sst-asymmetric-morphology
  statement: Sst morphologies are asymmetric, with bifurcation distance above the soma longer
    than below, while Pvalb morphologies are symmetric; Pvalb and Sst differ below the soma
    (p = 0.03) but not above (p = 0.45).
  source: Results, Multi-channel features separate inhibitory Pvalb and Sst, paragraph 2;
    Figure 6d
  quote: Specifically, while Pvalb morphologies are symmetric (i.e., above vs. below bifurcation
    distance remains similar), Sst possesses a more asymmetric morphology with the bifurcation
    distance above being longer than below their soma
  statistics:
  - about: above soma, Pvalb against Sst
    test: two-sample t-test, two-sided
    p: 0.45
    n: 9 Pvalb and 9 Sst
  - about: below soma, Pvalb against Sst
    test: two-sample t-test, two-sided
    p: 0.03
    n: 9 Pvalb and 9 Sst
  data: elsewhere
  where: Allen Cell Types Database reconstructions (cell ids of Table S1); Source Data sheet
    Fig6d
  criterion: Bifurcation distances as fig5g-bifurcation-velocity-sp. Reproduced when the below
    comparison gives p < 0.05, the above one p >= 0.05, and Sst |above| exceeds |below|.
- id: fig6e-bifurcation-velocity-inhibitory
  statement: Across Pvalb and Sst models the bifurcation distance above and below the soma is
    linearly related to the inverse EAP propagation velocity (slope 2.67, r = 0.8).
  source: Results, Multi-channel features separate inhibitory Pvalb and Sst, paragraph 2;
    Figure 6e
  quote: We found that the bifurcation distance above and below the soma is robustly related to
    the inverse of the EAP propagation velocity (Fig. 6e , right, slope = 2.67, the correlation
    coefficient r = 0.8
  statistics:
  - test: linear regression
    statistic: r = 0.8, slope = 2.67
    p: 5.12e-09
    n: 9 Pvalb and 9 Sst models, above and below soma
  expected:
  - quantity: slope
    value: 2.67
    tolerance: 0.267
  - quantity: correlation coefficient
    value: 0.8
    tolerance: 0.08
  data: elsewhere
  where: Allen Cell Types Database reconstructions (cell ids of Table S1); Source Data sheet
    Fig6d
  criterion: As fig5g-bifurcation-velocity-sp, on the 18 inhibitory models.
- id: fig6g-pvalb-sst-in-vitro
  statement: In vitro, Pvalb and Sst neurons differ in maximum spike rate, rheobase and resting
    potential among other properties.
  source: Results, Multi-channel features separate inhibitory Pvalb and Sst, paragraph 3;
    Figure 6g
  quote: Maximum spike rate to dc current injections separates between Pvalb and Sst neurons.
    Mann-Whitney U test, two-sided, p = 0.0067
  statistics:
  - about: maximum spike rate
    test: Mann-Whitney U test, two-sided
    p: 0.0067
    n: 9 Pvalb and 9 Sst neurons
  data: elsewhere
  where: Allen Cell Types Database (cell ids of Table S1); Source Data sheet Fig6g
  criterion: Reproduced when maximum spike rate gives p < 0.01 and rheobase and resting
    potential each p < 0.05.
- id: figs8-rotation-symmetry
  statement: The angle between the probe and the morphology changes multi-channel EAP metrics,
    including the symmetry index, of Pvalb and Sst models, with some angles enlarging and some
    hiding the Pvalb against Sst difference.
  source: Results, Multi-channel features separate inhibitory Pvalb and Sst, paragraph 4;
    Figure S8
  quote: we varied the angle between the extracellular probe and morphology across Pvalb and Sst
    models and found that, indeed, certain EAP multi-channel metrics, including the symmetry
    index, are affected by this parameter
  data: elsewhere
  where: GitHub yinawei/Mouse-all-active-models-EAP (Zenodo doi:10.5281/zenodo.7679762)
  criterion: Simulation of rotated morphologies; the angles are shown only in Fig S8a, which
    was not read. Reproduced when the Pvalb against Sst symmetry-index test is significant at
    some angles and not at others.
