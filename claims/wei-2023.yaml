# Claims for Wei, Nandi, Jia, Siegle, Denman, Lee, Buchin, Van Geit, Mosher, Olsen & Anastassiou
# (2023), "Associations between in vitro, in vivo and in silico cell classes in mouse primary
# visual cortex", Nature Communications 14, 2344, on DANDI:000021.
#
# Provenance: written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub
# Actions"), 2026-11-21, protocol pilot-18 as stated in docs/protocol.md (Reader, steps 1 to 4).
#
# Text read: the version of record (paper/10.1038-s41467-023-37844-8.txt, from PubMed Central),
# its main text, figure legends and Methods; the Supplementary Information (Figures S1 to S8
# with legends, Table S1), which the same text file holds; and the Source Data workbook
# (41467_2023_37844_MOESM3_ESM.xlsx, read from the copy under paper/). The supplement PDF
# (MOESM1) was not opened, as its text was legible. Table S2, cited for the visual stimulus
# metrics, is not in the supplement text; Table 2 of the Methods names the same three metrics.
# Fig 3d, 3e, S6 and the opto kappa and phase are given in the Source Data only as pickle files
# (wt_phase_locking_df2.pickle, Fig7h_opto_kappa_phase.pickle) that are not supplied, and the
# main-figure PDF is not supplied, so the significance stars of the main figures could not be
# read. Statistics are recorded as the text and legends give them.
#
# Code read (Code availability). https://github.com/yinawei/Mouse_V1_EAP_Analysis at commit
# 1e35126f1e521b4c98e9ba5fd6a4a8abce70530a (2021-08-10; Zenodo doi:10.5281/zenodo.7679748).
# It holds Examples/NP_EAP_FeatureAnalysis.ipynb (EAP features and K-means clusters, Fig 2d),
# Examples/Exp_Model_Classifier.ipynb (the FS/RS and AP/SP classifiers, Fig 4f to h; the
# README calls them Fig 3c,f,g,h, from an earlier figure numbering), Examples/ecp_func.py (the
# helper functions) and data: per-session mean waveforms (Examples/data/wt_EAP_data_info/
# <session>.npy, units x 82 samples x 40 channels) with unit tables (<session>unitinfo.csv:
# good flag, unit id, fr_5min, fr, depth relative to layer 4), exp_features.csv (features and
# cluster labels of the 1204 units) and model_features.csv (features of the 33 models). The
# code starts from these prepared files; how waveforms, the good flag, fr_5min and depth were
# taken from the NWB files is not in it. No code for Fig 3, Fig 5 to 7, the phase-locking or
# the optotagging is in it. https://github.com/yinawei/Mouse-all-active-models-EAP at commit
# f1a426867032527e1ed5cbdf87eb56e9f7fa65ef (2021-08-10; Zenodo doi:10.5281/zenodo.7679762)
# holds the BMTK/NEURON set-up to simulate one example model (cell 395830185).
#
# Method details the code fixes (NP_EAP_FeatureAnalysis.ipynb, ecp_func.py), followed below:
# - Sessions: the 25 wild-type session ids listed in the notebook (732592105, 739448407,
#   744228101, 750332458, 750749662, 754312389, 754829445, 757216464, 757970808, 759883607,
#   761418226, 763673393, 766640955, 767871931, 768515987, 771160300, 771990200, 774875821,
#   778240327, 778998620, 779839471, 781842082, 793224716, 799864342, 847657808); the Source
#   Data (sheet Fig 1d) lists the same ids with unit counts summing to 1204.
# - Waveforms: 40 channels around the peak channel; every second channel (one per 20 um row,
#   the two columns on one side) gives 20 sites, the peak at index 10; each trace high-passed
#   at 300 Hz (5th-order Butterworth, filtfilt) at 30 kHz; time axis sample*1/30 ms - 0.6 ms;
#   cubic spline to 10000 points for feature timing.
# - Features: TPW from the trough (minimum between -1 and 2.5 ms) to the following maximum;
#   REP from that peak to the half-peak after it; 1/V below and above as the slope (times
#   1000, ms/mm) of trough time against distance over sites within 100 um whose amplitude is at
#   least max(0.5% of the peak amplitude, 5); spread from the 12% amplitude points of a spline
#   of amplitude against distance; symmetry index |1/V below + 1/V above| / sqrt(2).
# - Exclusions after the good flag and a hard-coded list of 38 unit ids: peak channel not at
#   the centre, values beyond 3 SD of the mean in half width, TPW, REP, the two W slopes or the
#   two 1/V features, trough time more than 0.1 ms from 0, amplitude below 15 or above 300.
#   1287 good units became 1204.
# - Clustering: features median-imputed and z-scored; K-means (k-means++, 1000 initialisations)
#   for K = 1 to 9; the elbow is the largest ratio of successive WCSS differences, f(K) as in
#   Methods eq. 5-6, the optimum its minimum. Two clusters on TPW and REP; then each of FS and
#   RS clustered on 1/V below and 1/V above (z-scored over all units) with K from f(K).
# - Classifiers (ecp_func.classifier): features z-scored, minority class upsampled with
#   replacement to balance; 100 stratified 75/25 splits for each of 100 resamplings; linear SVC
#   (C = 1, balanced weights) for two classes, random forest (20 trees, gini) for more; label
#   by most frequent prediction.
# - Two- and three-group tests (two_sample_test, three_sample_test): Shapiro-Wilk on each group
#   at 0.05; t-test or Mann-Whitney U for two groups; one-way ANOVA with Holm-corrected t-tests,
#   or Kruskal-Wallis with Holm-corrected Mann-Whitney tests (scikit_posthocs), for three.
#
# Data the paper used (Results; Methods, In vivo neuropixels recordings; Source Data).
# - The Allen Brain Observatory Visual Coding Neuropixels dataset, via the AllenSDK and DANDI
#   000021. Awake head-fixed mice on a running disc; V1 recorded with Neuropixels probes (384
#   sites, 30 kHz, KiloSort2 spike sorting); stimuli named are flashes, drifting gratings and a
#   mean-luminance gray screen (spontaneous). 25 wild-type C57BL/6J mice (24 male, 1 female),
#   8 Pvalb-IRES-Cre x Ai32 (6 male, 2 female), 12 Sst-IRES-Cre x Ai32 (8 male, 4 female).
#   The paper does not say which of the Visual Coding stimulus sets each session belongs to;
#   the dandiset's title names the Brain Observatory 1.1 stimulus set only, so the author
#   finds which of the 25 sessions, and which opto-tagging mice, it holds.
# - Units: 1204 V1 units from the 25 wild-type mice (Source Data Fig2d gives each unit id and
#   its cluster label, TPW, REP and 1/V features). Fig 3 uses units with EAP amplitude above
#   50 uV and at least 100 spikes (745 RS for rate, CV and LV; 768 RS for the grating metrics;
#   203 FS and 745 RS for phase-locking). Depth relative to the layer 4 centre found from the
#   first CSD sink to flashes (Fig S1). LFP bands theta 3-8, alpha 8-12.5, beta 12.5-30, low
#   gamma 30-50, high gamma 50-90 Hz (Results) or 8-12 and 12-30 Hz for alpha and beta
#   (Methods). Optotagging with 10 ms square light pulses.
# - Outside the dataset: 33 all-active single-cell models (15 spiny, Cre lines 5 Nr5a1, 4
#   Scnn1a, 6 Rorb; 18 aspiny, 9 Pvalb, 9 Sst) fitted to cells of the Allen Cell Types Database
#   (celltypes.brain-map.org, cell ids in Table S1), with their in vitro electrophysiology and
#   reconstructed morphologies. The models are in the second repository (Zenodo
#   doi:10.5281/zenodo.7679762); their simulated EAP features are in model_features.csv of the
#   first (Zenodo doi:10.5281/zenodo.7679748) and in the Source Data.
#
# Details the paper and code leave open, with the readings named in the criteria:
# - unit isolation ("well-isolated", "see Methods", but the Methods give no criteria);
# - which recording period gives fr_5min, the FS/RS firing rate (Fig S3b);
# - the drifting-grating period and spike sets for Fig 3 and how ISIs are pooled;
# - the method of the ISI-median confidence interval;
# - the LFP channel ("different neighboring electrodes"), the band filter, which spikes form
#   the 10,000-spike cap, the alpha and beta band edges, and what "kappa" is (the text says it
#   ranges from 0 to 1, which a von Mises concentration does not);
# - the boundaries of the supragranular, granular and infragranular regions;
# - the opto-tagging baseline window and unit selection.
schema_version: 2
paper: doi:10.1038/s41467-023-37844-8
claims:
- id: source-data-units-link
  kind: link
  statement: The 1204 unit ids of the paper's Source Data, with their one- and multi-channel
    cluster labels, are units of the dataset's wild-type V1 recordings.
  source: Source Data, sheets Fig 1d and Fig2d; NP_EAP_FeatureAnalysis.ipynb session list
  data: with_labels
  criterion: Each unit id of Source Data sheet Fig2d is looked up in the units tables of the
    dataset's sessions among the 25 the code lists. The link holds (reproduced) when the
    dataset holds all 25 sessions and every one of the 1204 ids is found, with the per-session
    counts of sheet Fig 1d, in the VISp structure. It is partially reproduced when the dataset
    holds only some of the 25 sessions and every id of those sessions is found; the number of
    sessions and units held is then reported, and every claim judged on the dataset is judged
    on that subset, as a deviation. It is not reproduced when ids of sessions the dataset holds
    are missing or lie outside V1.
- id: fig1d-unit-count
  statement: The analysis rests on 1204 well-isolated V1 units from 25 wild-type mice, an
    average of 48 units per mouse.
  source: Results, EAP recordings from in vivo experiments and biophysical models of cell
    types, paragraph 1; Figure 1d
  quote: We only analyzed units located in V1 with an average of 48 units per wild-type mouse
    being well-isolated (unit isolation criteria... the total number of units = 1204) during
    spontaneous activity
  expected:
  - quantity: well-isolated V1 units from wild-type mice
    value: 1204
    tolerance: 120.4
  - quantity: mean units per wild-type mouse
    value: 48
    tolerance: 4.8
  depends_on:
  - source-data-units-link
  criterion: Units in VISp of the 25 sessions the code lists, then the code's exclusions (the
    hard-coded list of 38 ids, peak channel off centre, 3 SD outliers in the seven features,
    trough time beyond 0.1 ms, amplitude outside 15 to 300). The isolation step that sets the
    code's good flag is not stated in the paper or code; two readings are run, (a) the
    AllenSDK default unit filter the paper's stated access route applies (isi_violations <
    0.5, amplitude_cutoff < 0.1, presence_ratio > 0.9), (b) every VISp unit the NWB units
    table lists. The claim is reproduced when either reading gives counts within the
    tolerances. Figure 1d's legend gives 24 wild-type mice and "204" units; the text and
    Source Data give 25 and 1204, used here.
- id: fig2-one-channel-two-clusters
  statement: K-means clustering of the one-channel features TPW and REP gives two clusters as
    the optimum by both the elbow method and the density function, a narrow-waveform cluster
    with short REP and a wide-waveform cluster with long REP.
  source: Results, The standard waveform features reveal two clusters, paragraph 1; Figure 2c,d
  quote: Both the elbow method and density method of unsupervised K -means clustering 22
    independently confirmed the optimal number of clusters is two.
  depends_on:
