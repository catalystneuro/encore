- id: fig3-590-inconsistent
  statement: After demagnetization at 590 C in zero field, the replicate directions of the
    crystals are inconsistent, consistent with a null magnetization state.
  source: Results, Single crystal measurements, paragraph 2; Figure 3b and 3e; Methods, Thermal
    measurements, paragraph 5
  quote: but this consistency is not seen after demagnetization at 590 °C (Fig. 3b,e)
  criterion: Per crystal, the replicate 590.0 directions, with Fisher mean, k and alpha95. Readings
    (a) k of the 590.0 replicates lower than k of the NRM replicates, (b) Watson's test does not
    reject randomness of the 590.0 replicates at p < 0.05. Reproduced when, under one reading,
    more than half of the twelve crystals are inconsistent, including 12040g1 and 14053g2. The
    590.0 moments are reported against the 8e-11 emu threshold.
  depends_on:
  - fig3-nrm-consistent
