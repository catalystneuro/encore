- id: table2-no-fit
  statement: The other thirteen failed glass specimens (g2, ss8, s11, ss18, ss24, ss27, ss29,
    ss36, ss38, ss39, ss45, ss46, ss48) gave no fit, most because they did not acquire TRM in a
    regular fashion and some because their directions trend out of the origin.
  source: Methods, Paleointensity Selection criteria, paragraph 2; Table 2
  quote: We note that some specimens did not acquire TRM in a regular fashion, or showed directions
    that trended out of ... the origin of their respective orthogonal vector plots
  criterion: The paper gives no measure of regular TRM acquisition. Over each specimen's Table 2
    range, TRM gained per step is computed as in the opening comment and the pTRM check
    percentages listed for these specimens are compared with Table 2 as in table2-fit-statistics.
    Regularity is read as (a) TRM gained increasing with each temperature step, or (b) a TRM
    gained against temperature curve with no step falling by more than 15% (the pTRM tolerance
    of the selection criteria). Reproduced when, under one reading, at least 9 of the 11
    specimens marked "no regular TRM acquisition" show irregular acquisition, and ss36 and ss39
    have field-off vectors whose distance from the origin grows over the last steps of the range.
    The counts under each reading are reported.
