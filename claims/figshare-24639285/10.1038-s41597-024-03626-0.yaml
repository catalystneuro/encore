- id: fig2-changing-field
  statement: Glass subsamples ss41 and ss22 show field-off directions that change over a
    temperature interval, consistent with a changing ambient field during magnetization, and
    curved NRM lost against TRM gained plots.
  source: Background & Summary, Glass, paragraph 2; Figure 2; Table 2
  quote: Other specimens show a changing vector, consistent with a changing ambient field (Fig. 2)
  criterion: The arrows marking the interval in Figure 2 were not seen, so the Table 2 ranges
    are used (ss41 500 to 580 C, ss22 250 to 500 C), with the earlier steps shown. The paper
    names no measure of a changing direction. Readings (a) the angle between the first and the
    last field-off direction of the range exceeds the MAD of a line fit over the range, (b) a
    great-circle fit over the range has a smaller MAD than a line fit. Reproduced when both
    specimens show a changing direction under one reading and R2 is within tolerance of Table 2
    (0.38 each); the angles and MADs are reported.
