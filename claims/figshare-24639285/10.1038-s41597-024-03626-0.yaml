# Claims for Tarduno, Cottrell & Zhou (2024), Scientific Data, doi:10.1038/s41597-024-03626-0,
# on Figshare dataset 24639285 (doi:10.6084/m9.figshare.24639285.v1).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-10-27,
# protocol pilot-12 as stated in docs/protocol.md (Reader).
#
# Text read: the version of record from Europe PMC (PMC11271266, full-text XML converted to text)
# as supplied under paper/, with Background & Summary, Methods, Data Records, Technical
# Validation, the legends of Figures 1 to 3 and Tables 1 and 2. The paper is a Data Descriptor
# and has no supplement; its additional plots are in the Figshare deposit itself. No PDF was
# supplied, so the figures were not seen: the nominal paleointensities printed in Figure 1 and
# the step ranges marked by arrows in Figures 1 and 2 are not recorded. The footnote legends of
# both tables (the marks after "M590 20 uT" and "Max intensity" in Table 1, and the marks after
# the specimen names, after n and after T Range in Table 2) are missing from the text.
# Code: the paper states that no custom code was used. It names PmagPy for looking at the
# directional and paleointensity data during collection and for checking quality factors
# (Technical Validation), with no version; no repository was read.
#
# Data the paper used. Two sets of measurements, all made with the WSGI three-component DC SQUID
# magnetometer (6.3 mm bore) in the shielded room at the University of Rochester, moments in emu.
# Per the Data Records, each sample's data are a sheet of an Excel file with columns sample name,
# demagnetization step, moment (emu), declination and inclination; AF steps carry an "mT" label,
# all other steps are degrees Celsius.
# (1) Glass of Apollo 64455,24: mm and smaller subsamples (ss numbers, one "g2", one printed
# "s11"), Thellier-Coe paired heating with a CO2 laser (90 s for specimens under 1 mm, 120 s for
# 1 to 2 mm), laboratory field 18 uT (Figure 1 legend). Step labels are the step temperature
# followed by .0 (field-off), .1 (field-on) and .2 (pTRM check, field-on). 25 subsamples in all,
# 13 measured in 2014 and 2015 without AF pre-treatment and 12 later with AF demagnetization along
# six directions at 5 and 10 mT (some also at 2.5, 7.5 and 20 mT); three passed the selection
# criteria of Tarduno et al. (ref. 1) and the 22 that failed are the ones presented (Table 2).
# (2) Single silicate crystals (feldspar or pyroxene) from Apollo 14053,262, 12021,30, 12053,283,
# 12040,209 and 71055,2, twelve crystals named as in Table 1 (12021g2, 12021g3, 12040g1 to g3,
# 12053g1, 12053g2, 14053g1 to g3, 71055g1, 71055g3). Each: NRM, then 590 C in zero field (label
# 590.0), 590 C in a 20 uT field (590.1), 590 C in zero field as alteration check (590.3), 590 C
# in a 40 uT field (590.4). The NRM, 590.0 and 590.3 steps were measured several times
# (replicates). One crystal, 14053g1, was also measured after 400 C during initial tests.
# The magnetometer sensitivity threshold is 8e-11 emu (8e-14 A m2).
#
# Procedures used by the criteria below, each from the paper as cited.
# - TRM (pTRM) gained at a step is the vector subtraction of the field-on and field-off
#   measurements (Methods, Thermal measurements, paragraph 3). NRM lost is read from the
#   field-off measurements; whether it is NRM minus the remaining moment or plotted as remaining
#   does not change R2, MAD or the slope magnitude.
# - Paleointensity is the absolute slope of the NRM lost against TRM gained line times the
#   laboratory field, 18 uT for the glass (Figure 1 legend).
# - Selection criteria (Methods, Paleointensity Selection criteria): linear NRM-TRM relationship
#   with R2 about 0.9, four or more points, evenly distributed, pTRM checks within 15%, MAD
#   threshold relaxed (no value given), a three-point sliding window on orthogonal vector plots.
# - Threshold field detection limit (Technical Validation) = 8e-14 A m2 / TRM at 590 C x 20 uT.
#
# Open details, named here and in the criteria that use them.
# - MAD: the paper says neither whether the line is anchored to the origin nor whether it is fit
#   to the three-point smoothed directions. Readings (a) free line on the measured field-off
#   directions, (b) anchored line, (c) free line on the three-point running mean of the
#   field-off vectors.
# - pTRM check percentage: the paper gives no formula. It cites "standard paleointensity
#   definitions" (ref. 31) without detail here. Readings (a) difference between the check's pTRM
#   and the original pTRM at the same temperature, over the original pTRM; (b) the same
#   difference over the length of the fitted TRM segment (a DRAT-like measure). The check's pTRM
#   is the .2 vector minus (i) the field-off vector measured just before it, or (ii) the
#   field-off vector at the check's temperature.
# - M590 in Table 1: (a) the TRM vector difference 590.1 minus 590.0, (b) the magnitude of the
#   590.1 measurement. Which replicate of 590.0 is used: (i) the first, which the paper says was
#   used for the nominal paleointensities of ref. 1, (ii) the mean of the replicates.
# - Consistency of replicate directions: the paper names no measure, only stereonets. Readings
#   (a) Fisher precision parameter k of the replicate directions compared between steps, (b)
#   Watson's test of randomness on the replicates at p < 0.05 (a standard test, not named by the
#   paper).
#
# Table 2 marks. Twelve specimens carry one mark and ten another; with the three successful
# specimens these split 13 and 12, the counts the Methods give for experiments without and with
# AF pre-treatment, and ss19 and ss43, which Figure 1 shows with AF steps, carry the second mark.
# The legend is missing, so this reading is not stated by the paper.
#
# Text errors noted. The Results cite Figure 3 for "12041g1"; the Figure 3 legend and Table 1 have
# 12040g1. The Technical Validation example for 14053g1 uses a TRM of 8e-12 A m2 and gives 0.2 uT,
# while Table 1 gives 14053g1 3.203E-09 emu (3.2e-12 A m2) and 0.51 uT; the example's numbers
# are those of 12040g1 in Table 1 (8.002E-09 emu, 0.20 uT). Table 1 values are 1 to 3% above
# 8e-11 / M590 x 20 uT computed from its own M590 column.
