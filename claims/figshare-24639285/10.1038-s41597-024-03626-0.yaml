- id: glass-directions-not-random
  statement: The field-off directions of the failed glass specimens, as seen on orthogonal vector
    plots, are not random, implying the presence of an ambient field.
  source: Background & Summary, Glass, paragraph 2
  quote: The directions, as viewed on orthogonal vector plots, are not random and imply the presence
    of an ambient field
  criterion: The paper names no test. Per specimen, the field-off directions of its thermal steps
    are tested for randomness with Watson's test (n directions, resultant length R, p < 0.05),
    a standard choice. Reproduced when more than half of the 22 specimens reject randomness,
    partially reproduced for a quarter to a half. Because successive demagnetization steps of
    one remanence are not independent, the count is also given for the steps within each
    specimen's Table 2 range where one is printed.
  depends_on:
  - glass-specimen-set
