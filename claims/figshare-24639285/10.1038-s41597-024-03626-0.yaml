  statement: The replicate directions after the zero-field alteration check at 590 C are also
    inconsistent.
  source: Results, Single crystal measurements, paragraph 2; Figure 3c and 3f
  quote: The directions are also inconsistent after the alteration check at 590 °C (Fig. 3c,f)
  criterion: As fig3-590-inconsistent, for the replicate 590.3 directions.
  depends_on:
  - fig3-590-inconsistent
- id: crystal-14053g1-400c-stable
  statement: Crystal 14053g1, measured after heating to 400 C during initial tests, held a stable
    remanence, which was removed by treatment at 590 C.
  source: Results, Single crystal measurements, paragraph 3
  quote: One crystal (14053g1) was measured after heating to an intermediate temperature (400 °C)
    during initial tests, and found to be stable
  criterion: Applies only if the deposit holds 400 C measurements for 14053g1. The paper names no
    measure of stability; stable is read, as for the NRM, as replicate 400 C directions
    consistent under fig3-nrm-consistent's readings, with the 590.0 replicates of the same
    crystal inconsistent. Reproduced when both hold under one reading.
  depends_on:
  - fig3-nrm-consistent
- id: no-alteration-recording-efficiency
  statement: Alteration during the laser heating of the single crystals was not significant;
    apparent recording efficiencies far above 100% were not observed and the alteration checks
    did not fail.
  source: Background & Summary, paragraph 5
  quote: If alteration had resulted in the formation of new magnetic minerals, apparent recording
    efficiencies ≫ 100% should have be observed (but these were not), and alteration checks
    should fail
  criterion: The paper does not define recording efficiency or the failure of the alteration
    check for the crystals. Readings (a) the 590.3 moment does not exceed the 590.0 moment by
    more than the 8e-11 emu threshold, and the 590.3 directions are inconsistent as in
    fig3-alteration-check-inconsistent; (b) the 590.4 TRM (40 uT, vector difference from 590.3)
    is no more than about twice the 590.1 TRM (20 uT), as linear recording predicts. Reproduced
    when every crystal passes under one reading; the ratios are reported. Recording efficiency
    against a theoretical TRM needs grain properties the paper does not give, so it is not
    computed.
  depends_on:
  - fig3-alteration-check-inconsistent
- id: interpretation-impact-no-dynamo
  statement: Together with ref. 1, the data are consistent with impact plasma magnetization of the
    64455 glass and with the absence of a long-lived lunar core dynamo recorded in the 3.9 to
    3.2 Ga crystals.
  source: Background & Summary, paragraphs 2 and 6
  quote: These 64455 field strengths1 match those predicted by the charge separation mechanism
  criterion: An interpretation that rests on ref. 1 and on models of impact plasmas, not on a
    measurement this deposit can repeat. Not tested; it is judged as following from the
    outcomes of fig2-changing-field, glass-directions-not-random, fig3-590-inconsistent and
    table1-max-intensity, which are reported together.
  depends_on:
  - fig2-changing-field
  - glass-directions-not-random
  - fig3-590-inconsistent
  - table1-max-intensity
