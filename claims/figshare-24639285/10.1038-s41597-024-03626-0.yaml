- id: fig3-nrm-consistent
  statement: For most crystals the replicate NRM measurements have a consistent direction, as
    shown on stereonets for 12040g1 and 14053g2.
  source: Results, Single crystal measurements, paragraph 2; Figure 3a and 3d
  quote: These show that for most of the crystals there is consistency of the NRM direction (Fig.
    3a,d)
  criterion: Per crystal, the replicate NRM (step 0.0) directions, with Fisher mean, k and
    alpha95. Readings for "consistent", named in the opening comment, (a) k of the NRM replicates
    higher than k of the 590.0 replicates, (b) Watson's test rejects randomness of the NRM
    replicates at p < 0.05. Reproduced when, under one reading, more than half of the twelve
    crystals are consistent, including 12040g1 and 14053g2.
  depends_on:
