    absolute z over frequencies (the measure is not defined in the paper; a reading fixed here),
    with the median over participants as in fig. S15G. The cohort is open, (a) the 7 included
    participants, (b) every participant with a 40-min infusion in the dataset. Reproduced when,
    under one reading, ORB has the largest magnitude and the frontal regions (ORB, IFG, MFG) rank
