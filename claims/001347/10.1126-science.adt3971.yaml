- id: fig2g-nmf-six-factors
  statement: Non-negative matrix factorisation of trial-averaged, puff-triggered channel
    spectrograms yields six shared spectrotemporal factors, with explained variance 0.47 on
    held-out trials, from 458 channels of 7 participants.
  source: Figure 2F and 2G; figs. S17 and S18; Table S3, Fig. 2G; Methods, Factorization
  quote: Factoring the responses into six components (Fig. 2G) was found to be optimal, with an
    explained variance ... of 0.47 on held-out trials and diminishing returns with more components
  expected:
  - quantity: explained variance on held-out trials, six components
    value: 0.47
    tolerance: 0.047
  criterion: Per channel, multitaper spectrogram (time-bandwidth 2, 3 tapers, 0.4 s windows,
    0.05 s stride), z-scored per frequency to the 2 min before the puff sequence and again to the
    1.5 s before each puff (Methods, Multitaper Spectrogram). Channels in the 21 regions sampled
    in at least two participants (Table S3 lists them and the counts SD168 86, SD172 97, SD181
    58, SD185 43, SD186 47, SD211 44, SD245 83). From 0 to 1.4 s after the puff, the mean over
    every other preinfusion and postinfusion trial (code split 1, trials 2, 4, ...) is the
    training set and the remaining trials the test set; the array is split into positive and
    negative parts, each factored with 3 components (code decode_utils.get_nmf; Open G).
    Reproduced when the channel count is 458 and the test-set explained variance with six
    components is within tolerance with the elbow of the test curve at six (fig. S17A).
