    participant level with inhibition of the affective eyepuff response (fig. S14G)
  statistics:
  - test: Spearman rank-order correlation coefficient
    statistic: rho = 0.744
    p: 0.014
    n: 10 participants
  expected:
  - quantity: Spearman correlation
    value: 0.744
    tolerance: 0.074
  criterion: From the code (analyze_airpuff_ieeg_behavior_across_subjects.py,
