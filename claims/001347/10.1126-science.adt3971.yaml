- id: figs12-erp-not-explained-by-eyelid-closure
  statement: Puff-triggered ERPs are much larger than the activity around spontaneous blinks,
    although eyelid closure reaches a similar magnitude in both.
  source: fig. S12A to S12D; Table S3, fig. S12 C and D; Results, Brain-wide activity screen
    during emergence of affect in human beings, paragraph 3
  quote: Despite similar magnitude of measured eyelid closure in spontaneous versus puff-triggered
    eyeblinks, the ERP pattern was not seen in spontaneous eyeblinks
  criterion: ERP magnitude is the mean absolute LFP (200 Hz, bipolar, 60 Hz notch) around blink
    onset, baseline-subtracted with the pre-blink interval, averaged over 773 channels from the 7
    participants, 52 puff-triggered and 52 spontaneous blinks (Table S3; Methods, ERP analysis;
    code for_reference/analyze_airpuff_ieeg_natural_blinks.py uses hand-listed spontaneous blink
    onsets). The paper reports no test. Reproduced when the mean post-onset ERP magnitude is
    larger for puff blinks than spontaneous blinks in more than half of the channels and on
    average, and the peak mean eye closure of the two blink types differs by less than 10% of the
    puff-blink peak (a threshold fixed here as the paper gives none). If the spontaneous blink
    onsets are not in the dataset, the claim is blocked.
- id: figs13-auditory-control-no-response
