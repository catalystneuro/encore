- id: figs27-slow-oscillations-with-strong-dissociation
  statement: All participants with strong dissociation (CADSS above 10) show ketamine-induced
    oscillations below 10 Hz, and high-CADSS participants tend to have a larger fraction of
    channels with such oscillations.
  source: fig. S27E to S27I; Results, Brain-wide activity screen during emergence of affect in
    human beings, paragraph 9
  quote: all participants with strong dissociation (CADSS score >10) exhibited low-frequency (<10
    Hz) oscillations induced by ketamine
  criterion: Band-limited oscillation detection as in Methods (multitaper PSD, time-half-bandwidth
    30, 59 tapers, 30 s windows, 15 s stride; 3-min segments; FOOOF aperiodic removal;
    scipy.signal.find_peaks; peaks clustered across segments by 80% overlap of peak width;
    clusters in fewer than 40% of segments dropped; a ketamine cluster within 2 Hz of a baseline
    cluster counts if a one-sided rank-sum test of peak heights gives p < 0.001, otherwise a
    ketamine cluster at a new frequency counts). Windows avoid sleep and ictal activity and the
    ketamine window is at peak drug level; their exact bounds are not given and are chosen per
    participant from the recording notes in the dataset, if any, else the 30 to 40 min window of
    fig. S15. Open H, the threshold (Results "CADSS score >10", Methods and fig. S27F ">= 10")
    and the cohort ((a) the 7 included participants, (b) every iEEG participant with ketamine in
    the dataset). Reproduced when, under one reading, every high-CADSS participant has at least
    one channel with a ketamine-unique oscillation below 10 Hz; the second part is reported with
    the label-permutation test of the Methods (10,000 shuffles) and is not required.
