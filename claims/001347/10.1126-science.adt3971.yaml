  quote: Frontal cortex exhibited the largest magnitudes of change, led by ... orbitofrontal cortex
  criterion: Per channel, multitaper spectrogram z-scored at each frequency to a 25-min
    pre-ketamine baseline window, averaged over the 30 to 40 min peak ketamine window (fig. S15B
