    per-trial late/early at preinfusion is below 0.5 (fig. S14G legend says the same). The CADSS
    value is infusion minus preinfusion total (infusion as in fig2d). The eye-closure value is
    open between the legend ("infusion - mean(preinfusion, postinfusion)"), Table S3 ("ketamine
    - preinfusion") and the code (mean of the preinfusion and postinfusion medians minus the
