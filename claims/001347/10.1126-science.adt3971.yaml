# Claims for Kauvar, Richman, Liu et al. (2025), Science 388, eadt3971, on dandiset 001347.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-02,
# protocol pilot-13 as stated in docs/protocol.md.
#
# Text read: the version of record (Science, 29 May 2025), main text with Materials and Methods,
# figure legends and references, and both supplement PDFs (the MDAR checklist, and the
# Supplementary Materials with Supplemental Note 1, the legends of figs. S1 to S38 and Tables S1
# to S3), all as extracted in paper/10.1126-science.adt3971.txt. No figure image could be
# rendered in this run, so every claim rests on the text and on Table S3. The body of Table S1
# (contacts with significant changes per HCP area) is garbled in the extraction and is not used.
# The variance-explained labels of Fig. 5G to 5I (0.954, 0.870, 0.927) are read from the
# extracted figure text; their assignment to panels is named as open in that claim.
#
# Code read:
# - Human electrophysiology and behaviour, and mouse behaviour (ref. 101): Zenodo record
#   14920570, kauvar-richman-liu-2025_zenodo.zip (md5 bd1fb567121aaf0291337783df57bcfc), a git
#   repository with one commit, b873ca5 ("First commit."). It loads its data from dandiset 001347.
#   Key scripts: human_ieeg/scripts/analyze_airpuff_p50.py (Fig. 1, fig. S1),
#   analyze_airpuff_ieeg_behavior_across_subjects.py (Fig. 2C and 2D, figs. S8 and S14G),
#   analyze_airpuff_ieeg_cd.py (Fig. 6C, 6E, 6G), analyze_airpuff_ieeg_sgram_load_allpt.py (Figs.
#   2 and 3), for_reference/analyze_airpuff_ieeg_top_cd_network.py (fig. S38), mouse_eyepuff/
#   scripts/fig1_*.py (Fig. 1 and figs. S2, S5, S6), and the ketman and ketmouse packages. The code
#   for Fig. 6I (human phase locking) and fig. S27 (no FOOOF step) is not in the record; for fig.
#   S15 only spectral helper modules (ketman/analyze/power_multitaper.py) were seen, no script.
# - Mouse electrophysiology (ref. 103): Zenodo record 14876694, a single analysis.py (no commit,
#   no driver script; the session lists and some window arguments are not in it). It uses the
#   brainwide-npix package, which the record does not pin.
#
# The dataset, from its archive description: "SD" subjects are iEEG participants, "h" subjects
# the non-iEEG eyepuff participants, "m" subjects mice, and the "H" and "mouse" folders hold data
# aggregated across participants. The human code reads per-participant files
# sub-<SD id>_ses-puff_behavior.nwb, sub-<h id>_ses-P50_behavior.nwb, mouse behaviour files
# sub-mouse_ses-<experiment id>_behavior.nwb, and Neuropixels-rig behaviour files
# sub-<mouse id>_ses-puff_behavior.nwb. The mouse spiking data are in dandiset 001326 (ref. 104),
# so the mouse Neuropixels claims are marked as data elsewhere.
#
# Data the paper used:
# - Non-iEEG human cohort (Fig. 1A to 1F, fig. S1): 4 non-clinical adults aged 22 to 51, a
#   blinded crossover of saline and 0.5 mg/kg IV ketamine over 40 min on two visits 10 to 14 days
#   apart; the eyepuff assay about 30 min after infusion start; CADSS at 40 min. The code names
#   them h009, h011, h012, h013.
# - iEEG cohort (Figs. 2, 3, 6; figs. S7 to S27, S35, S37, S38): epilepsy patients in Phase 2
#   monitoring; 27 recruited, 16 given the eyepuff assay, 2 bolus participants excluded, 14
#   considered, 7 meeting behavioural inclusion (SD168, SD172, SD181, SD185, SD186, SD211, SD245;
#   the others are SD163, SD170, SD178, SD184, SD207, SD215, SD242). An additional cohort of 7
#   received ketamine without the eyepuff assay. Ketamine mostly 0.5 mg/kg over 40 min, some by
#   target-controlled infusion (0.13 then 0.26 mcg/ml). Eyepuff sessions before infusion
#   (preinfusion), about 30 min after infusion start (infusion), 110 min after (postinfusion),
#   and for some an auditory control at 115 min with the nozzle turned away. CADSS before, at 10,
#   20, 40 and 110 min. Each session has 40 puffs of about 60 ms at the left eye, in blocks of 8
#   with 3 to 8 s between puffs and 35 s between blocks, the same timing sequence in every
#   session. Video at 200 frames/s, eyelids tracked with DeepLabCut, sync LED for puff times.
#   iEEG with AdTech depth electrodes (12 to 16 contacts), Nihon Kohden JE-120, anti-alias
#   filtered and downsampled to 200 Hz, 60 Hz notch (Q 20, forward and backward), bad and
#   out-of-brain channels removed, bipolar re-reference. Anatomical labels by region (Fig. 3C
#   legend), Yeo7 and Yeo17 networks and HCP areas.
# - Mice, behaviour (Fig. 1G to 1P; figs. S2, S4 to S6): C57BL/6J, 8 to 20 weeks, mostly
#   female; trials of 8 puffs of 250 ms every 3 s at the right eye, 45 to 90 s between trials,
#   20 trials before IP injection and at least 20 after; eye closure from video correlation with
#   a closed-eye template (DeepLabCut for the Neuropixels rig).
# - Mice, Neuropixels (Figs. 4 to 6; figs. S28 to S36): 3 to 4 probes, 13 sessions from 10 mice
#   (11 sessions from 9 mice for cross-puff and population analyses), 100 mg/kg ketamine by
#   subcutaneous cannula after trial 20; some sessions with a 16 kHz tone series (fig. S34).
#
# Common methods, cited in the criteria by name:
# - H-EYE (human eye closure). Eye closure per frame is (baseline eye size - eye size) /
#   baseline, baseline the median eye size in the first 2 s of the first trial window (code,
#   airpuff_utils.get_pt_eyeclosure). Early (reflexive) eye closure is the mean over 0.1 to 0.2 s
#   after puff onset, late (affective) the mean over 0.3 to 0.8 s (Fig. 1 legend, fig. S1B and
#   S1C legends; code). For the non-iEEG cohort, each participant's late/early value is the mean
#   over trials of late divided by the mean over trials of early (code, analyze_airpuff_p50.py,
#   mean_ref = True); trials 3 to 40 are used (38 trials; code trial_range, fig. S1 legend and
#   Table S3). For the iEEG cohort the trials used are those stored with each participant's
#   behaviour file (which_trials), and late/early is the per-trial ratio (code, airpuff_utils;
#   Table S3, fig. S8A, "normalized by the reflexive eye closure on each trial").
# - H-CD (human coding dimension; Methods, Coding Dimension; code analyze_airpuff_ieeg_cd.py and
#   trace_utils.compute_all_cd). Band power is the squared magnitude of the Hilbert transform of
#   the band-passed LFP (fifth-order Butterworth, sosfiltfilt), beta 12 to 30 Hz unless stated;
#   z-scored within each session over the 20-min epoch beginning 10 min before the first puff;
#   epochs around each puff. For each participant, from the preinfusion session, the weight of a
#   channel is (mean over trials of the window mean in the target window - the same in 0.5 to 0 s
#   before the puff) / sqrt(variance over trials of the target window mean + variance of the
#   pre-puff mean), divided by the sum of absolute weights. Target window 0.5 to 1.5 s
#   (persistent) or 0.05 to 0.10 s (fast; Table S3 and code; the Methods say "0.05 s immediately
#   after each puff"). The trial-averaged band-power epoch of each session is projected on the
#   preinfusion weights, z-scored, baseline subtracted, and averaged over the summary window
#   (0.5 to 1.5 s persistent, 0.05 to 0.10 s fast). Comparison across the 7 participants by
#   paired t-tests, preinfusion against infusion and postinfusion against infusion, with
#   Benjamini-Hochberg correction over the two (Table S3; code cd_utils.plot_cd_projection_summary).
# - H-TAU (human intrinsic timescale; Methods, Intrinsic timescale; code
#   trace_utils.get_cd_timescales and extract_timescale). Beta band power of each channel in a
#   baseline period before the eyepuff assay in the preinfusion and the infusion session,
#   projected on the preinfusion persistent weights; autocorrelation with scipy.signal.correlate,
#   normalised to its maximum, fit a*exp(-x/b) + c over 2.5 s of lag with initial values a = 1,
#   b = 0.2, c = 0 (scipy.optimize.curve_fit); the timescale is b. Paired t-test across the 7
#   participants (Table S3).
# - H-PLV (human phase locking; Methods, Phase-locking Value). Beta (12 to 30 Hz) phase from a
#   fifth-order Butterworth band-pass applied forward and backward and the Hilbert transform;
#   PLV of each channel pair as the magnitude of the circular mean of phase differences in
#   sliding 5-s windows; persistent sites are the top tenth percentile of absolute persistent
#   coding-dimension weight per participant (Methods; Table S3 says "greater than 90th
#   percentile weight"), white-matter contacts excluded; the value is the mean over edges with
#   both ends persistent. Periods with the eyepuff assay, strong epileptic or sleep-related
#   activity are excluded.
# - M-EYE (mouse eye closure; Methods, Eyepuff assay (mouse); code ketmouse/eye_trace_utils.py
#   and mouse_eyepuff/scripts). Each trial is baseline-subtracted by its first 2 s (6 to 4 s
#   before the first puff) and scaled by 1/(1 - baseline). Early is the mean over 0.1 to 0.2 s
#   after a puff, late the mean over 0.3 to 0.8 s; late/early per mouse is the mean late over
#   trials divided by the mean early over trials (code mean_ref = True). In the 40-trial drug
#   sessions the code uses trials 6 to 20 as preinfusion and 23 to 37 as infusion (15 each,
#   matching "15 trials per mouse" in Table S3); the first puff is at 0 s and the eighth at 21 s
#   of a trial. Tests are paired t-tests on per-mouse values, with Benjamini-Hochberg correction
#   across the conditions of a panel where Table S3 says so.
#
# Details the paper leaves open, with the readings the criteria run:
# - Open A, trials excluded at the start of a human session. The Methods exclude the first
#   trial; the fig. S1 legend and the code exclude the first two (38 of 40 trials, as Table S3
#   gives). Readings, (a) the first two excluded, (b) the first only.
# - Open B, how late is normalised by early in the non-iEEG cohort. Readings, (a) the code's
#   ratio of trial means (H-EYE), (b) the mean of per-trial ratios.
# - Open C, the z-scoring of the human projection. The Methods z-score within 0.5 s before to
#   1.5 s after the puff and subtract the mean of 0.5 to 0 s before; the code z-scores over 1.0 s
#   before to 1.5 s after, subtracts the mean of 1.0 to 0 s before, and evaluates the summary
#   window on a time axis shifted by 0.05 s (origin_shift_s), that is 0.55 to 1.55 s and 0.10 to
#   0.15 s after the recorded puff time. Readings, (a) the Methods, (b) the code.
# - Open D, channels entering the human coding dimension. The code excludes channels labelled
#   white matter; the Methods say so only for the phase-locking analysis. Readings, (a) white
#   matter excluded, (b) all channels kept after bad-channel removal.
# - Open E, the baseline period for the human timescale. The Methods give the 8 min immediately
#   before the eyepuff assay; Table S3 and the code (the first 10 min of the epoch that starts
#   10 min before the first puff) give 10 min. The code's autocorrelation starts at a lag of one
#   sample; the Methods fit "from the peak". Readings, (a) 8 min, (b) 10 min, each fit from lag 0
#   and from lag one sample.
# - Open F, the human phase-locking windows and normalisation (code not released). The Methods
#   use 25 min before the start of infusion and the final 25 min of the infusion (from minute 5
#   for single-step target-controlled infusion) and z-score each channel's PLV to its preinfusion
#   window; Table S3 uses the 10 min preceding the eyepuff assay in each condition and divides by
#   the preinfusion value. Readings, (a) Methods windows, (b) Table S3 windows, each with the
#   divisive normalisation the figure shows; the z-scored change is shown as a variant.
# - Open G, the identity of the NMF factors. The code fits NMF (scikit-learn, solver 'mu',
#   random_state 1, Frobenius loss) with 3 components on the positive part and 3 on the negative
#   part, and numbers them by a fixed permutation [0, 2, 4, 5, 1, 3] of its fit. A refit may come
#   out in another order. In the code's order, factors 0, 1 and 4 come from the positive part
#   and factors 2, 3 and 5 from the negative part. Readings, (a) the code's order after the
#   code's fit, (b) factors 1 and 2 matched to the Results' descriptions (factor 1 a fast, partly
#   sustained increase above 50 Hz; factor 2 a delayed, sustained decrease below 20 Hz) and the
#   other four matched within their part (positive or negative) by peak time, earliest first.
# - Open H, the cohort and threshold for the slow-oscillation claim; see that claim.
# - Open I, the mouse infusion trials. The Methods count trials at least 3 min after the
#   injection as post infusion; the code uses trials 23 to 37. Readings, (a) the code's trials,
#   (b) all trials starting 3 min or more after the injection, at most 15.
