- id: fig3b-cluster-test-yeo-networks
  statement: Permutation cluster tests find ketamine-altered spectrotemporal clusters in the
    limbic, ventral attention and somatomotor Yeo7 networks.
  source: Figure 3B; fig. S21A; Table S3, Fig. 3B; Results, Brain-wide activity screen during
    emergence of affect in human beings, paragraph 7
  quote: Permutation cluster ... testing resolved ketamine-altered spectrotemporal clusters which
    reached statistical significance in the limbic, ventral attention, and somatomotor Yeo7
    resting-state networks
  criterion: Per participant and network, the trial spectrogram is the mean over the network's
    channels (only bipolar channels with both contacts in the same region); trials are stacked
    across participants (Frontoparietal 178, Default 214, Dorsal Attention 153, Limbic 214,
    Ventral Attention 214, Somatomotor 214 trials). The infusion minus preinfusion difference of
    trials paired by position in the puff sequence is tested with
    mne.stats.permutation_cluster_1samp_test, cluster-forming threshold the two-tailed t at
    p = 0.01, 512 permutations, seed 1, spectrogram from 0.5 s before to 1.5 s after the puff
    (Methods, Permutation cluster test; Table S3; code trace_utils.permutation_cluster_test and
    analyze_airpuff_ieeg_sgram_load_allpt.py). The lowest cluster p of each network is
    Benjamini-Hochberg corrected across networks; a network is significant when it is below
    0.01. Reproduced when limbic, ventral attention and somatomotor are significant; the result
    for the other three networks is reported.
