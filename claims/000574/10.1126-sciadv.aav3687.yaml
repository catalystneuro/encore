  criterion: >-
    The decoder of fig4e-maintenance-decodes-workload rerun nine times, each without the
    hippocampal units of one subject. Reproduced when all nine accuracies lie in 71 to 81%
    widened by 10% of each bound (63.9 to 89.1%), under a reading of fig4e that reproduced.
- id: fig4e-maintenance-neurons-carry-workload
  statement: >-
    Workload decoding from hippocampal maintenance neurons alone was little different from
    decoding from all hippocampal neurons, while excluding the maintenance neurons reduced the
    accuracy to 71%.
  source: Results, Decoding of information during the trial, paragraph 2; Figure 4E
  quote: >-
    We also performed the same analysis using only maintenance neurons; there was little
    difference in the decoding accuracy between the use of only maintenance neurons and the use
    of the whole population of hippocampal neurons. Conversely, the exclusion of maintenance
    neurons reduced the prediction accuracy to 71%.
  expected:
    quantity: accuracy without maintenance neurons
    value: 71
    tolerance: 7.1
    unit: '%'
  depends_on:
  - fig2b-maintenance-neurons-hippocampus
  - fig4e-maintenance-decodes-workload
  criterion: >-
    The decoder of fig4e-maintenance-decodes-workload on (i) hippocampal maintenance neurons
