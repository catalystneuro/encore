# Claims for Boran, Fedele, Klaver, Hilfiker, Stieglitz, Grunwald & Sarnthein (2019), Science
# Advances 5, eaav3687, on dandiset 000574.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record as served by Europe PMC (PMC6436923), in
# paper/10.1126-sciadv.aav3687.txt, with its Results, figure legends and Methods, and the
# supplement aav3687_SM.pdf (figs. S1 to S6, table S1 and table S2, the statistics checklist)
# extracted into the same file. Table S1 is garbled by the extraction; it was read by its column
# order (subject, diagnosis, age, hemisphere of the hippocampal electrode with maximal PLV,
# tissue SOZ or non-SOZ, scalp electrode with maximal PLV, PLV peak frequency, individual PLV
# band, maximal PLV, PLV workload dependent and its band, PLV maintenance against encoding,
# EEG workload dependent, iEEG workload dependent, then the median band limits), and the
# medians it prints (6.0 to 11.5 Hz, 7.8 to 10.0 Hz) were recomputed from the rows to confirm
# the reading. The supplement PDF page could not be rendered in this run. Movie S1 was not read.
# The data descriptor for the deposit (Boran et al. 2020, Sci Data 7, 30,
# doi:10.1038/s41597-020-0364-3, paper/10.1038-s41597-020-0364-3.txt) was read for the
# description of the deposited data; it repeats the behavior and spike sorting numbers.
#
# Code read: the paper links no analysis code ("Additional data related to this paper may be
# requested from the authors"). It links the task (Presentation,
# www.neurobs.com/ex_files/expt_view?id=266, not read; stimulus software) and Combinato
# (spike sorting, run before the data were deposited). The data descriptor names the G-Node
# deposit doi:10.12751/g-node.d76994
# (gin.g-node.org/USZ_NCH/Human_MTL_units_scalp_EEG_and_iEEG_verbal_WM, master at commit
# 0b27b34ecd0da217e4403bdd080b4a0d78f155fd, read 2026-10-23). Its code_MATLAB folder holds one
# script, Load_Data_Example_Script.m, which only reads and plots the NIX files (metadata, iEEG,
# scalp EEG, trial events, spike times, waveforms, electrode MNI coordinates). No analysis
# method below is settled by code. The dandiset's related resources name the GIN deposit as
# a variant form of it and the conversion code (github.com/janhohenheim/usz-neuro-conversion),
# which was not read.
#
# Data the paper used: nine epilepsy patients (table S1; ages 24, 39, 18, 28, 20, 31, 47, 56
# and 19 for subjects 1 to 9, which match Table 1 of the data descriptor, so subject numbers
# are the same in both papers) with depth electrodes in hippocampus, entorhinal cortex and
# amygdala, each with nine microwires at its tip; 36 sessions in total (up to seven per
# subject), 50 trials per session. Task: modified Sternberg task. Fixation [-6, -5] s;
# encoding [-5, -3] s, a string of eight consonants of which the middle 4, 6 or 8 are the
# memory items (set size; the outer positions are X); maintenance [-3, 0] s; probe letter at
# 0 s, answered IN or OUT by button press, then acoustic feedback. Times are relative to probe
# onset throughout the paper. An error trial is always followed by a set size 4 trial.
# Measured variables: per trial set size, match (IN) or mismatch (OUT), correct or incorrect,
# response and response time; spike times and mean waveforms of 1526 sorted units (putative
# neurons) in hippocampus (676), entorhinal cortex (449) and amygdala (401), units seen in more
# than one session counted once per session; iEEG from the macroelectrodes (recorded at 4 kHz
# against a common intracranial reference, analysed as one bipolar signal per macroelectrode
# from its deepest contacts; deposited at 2 kHz per the data descriptor); scalp EEG on the
# 10-20 system (recorded at 256 Hz, re-referenced to averaged mastoids; deposited at 200 Hz);
# local field potentials of the microwires (used for spike-field coherence; the data
# descriptor does not list them among the deposited data); electrode MNI coordinates,
# anatomical labels and seizure onset zone (SOZ) electrodes. Trials with eye movements or
# artifacts were removed by visual inspection (the data descriptor lists trial rejection
# information per trial).
#
# Definitions used throughout, from the Methods unless a claim says otherwise:
# - Unless a claim says otherwise, the neuron analyses use correct trials only (Results,
#   Single-unit electrophysiology, paragraph 2).
# - "Permutation t test" is the EEGLAB test that mixes values of the two distributions 2000
#   times and takes P from the resulting t values (Methods, Statistics). Firing rates and power
#   spectra are compared with cluster-based nonparametric permutation tests as in FieldTrip.
#   A "permutation test against scrambled data" builds a null from n > 200 label-scrambled
#   repetitions, with minimum P = 1/(n + 1).
# - High workload is set sizes 6 and 8 pooled and low workload set size 4 for the neuron
#   analyses (Fig. 2 and Fig. 4E); the EEG, iEEG and PLV analyses compare set size 8 with set
#   size 4 (Fig. 5 and Fig. 6).
#
# Details the paper leaves open and that apply to several claims:
# - Paired or unpaired permutation t test for comparisons of periods within the same trials.
#   Readings (a) paired over trials, (b) unpaired. A difference counts in the named direction
#   when two-sided P < 0.05 and the mean is higher in the named period.
# - The number of label-scrambled repetitions behind "permutation test against scrambled
#   data". The printed P = 0.002 is the minimum for 499 repetitions (Methods, Statistics),
#   while table S2 gives 1000 resampling runs for Fig. 2B, 2C and 3E. Both are run; this can
#   only move a P near 0.05.
# - Correct trials only, or all artifact-free trials, for the EEG, iEEG and PLV analyses. The
#   rule "unless stated otherwise ... only trials with correct responses" is stated in the
#   neuron section. Readings (a) correct trials only, (b) all artifact-free trials.
