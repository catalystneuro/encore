  source: Results, Electrophysiology of cortico-hippocampal functional coupling, paragraph 2; Figure 5B and 5C; fig. S5; table S1
  quote: >-
    the scalp EEG power increased during maintenance for a high workload (set size 8), with a
    peak within the 8- to 12-Hz alpha range over parietal cortex ( Fig. 5 , A and B). This
    workload-dependent EEG power increase extended to frontal electrode Fz ( Fig. 5C ). While
    this power increase is known from healthy subjects for the same or similar task ( 5 , 6 ),
    it did not appear in the other subjects of our study group (fig. S5 and table S1)
  statistics:
