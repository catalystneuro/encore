    (a) the deepest contact, (b) the midpoint of the two contacts. The fit's P from a
    permutation of PLV values over positions (2000 permutations; table S2 gives 32 degrees of
    freedom). Reproduced when, under one reading, there are 34 pairs, the slope is positive
    (PLV higher posteriorly) with P < 0.05 and R2 within tolerance, and posterior sites exceed
    anterior sites by an unpaired permutation t test at P < 0.05; partially reproduced when the
    direction and one of the two tests hold.
- id: fig6i-no-left-right-difference
  statement: >-
    There was no evidence that the PLV differed between left and right hippocampus.
  source: Results, Cortico-hippocampal low-frequency coupling in the group of subjects, paragraph 3; Figure 6I
  quote: >-
    There was no evidence that the PLV differed between the left and right hippocampus.
  depends_on:
  - fig6i-plv-posterior-gradient
  criterion: >-
    A claim of absence. The paper names no test here; Methods, Statistics, give the permutation
    t test for comparing two distributions, which is used: the 34 maximal PLV values of
    fig6i-plv-posterior-gradient, left against right channels, unpaired, P < 0.05. Reproduced
    when the test is not significant; not reproduced when it is. The difference of means is
    reported either way.
- id: soz-plv-no-difference
  statement: >-
    The increase in PLV did not differ significantly between hippocampal channels inside and
    outside the seizure onset zone.
  source: Results, Recordings in the epileptogenic zone, paragraph 1; table S1
  quote: >-
    When comparing hippocampal channels within and outside the seizure onset zone (SOZ) (table
    S1), the increase in the PLV was not significantly different between the non-SOZ electrodes
    and SOZ electrodes.
  depends_on:
  - fig6-plv-all-subjects
  criterion: >-
    A claim of absence, with the permutation t test of Methods, Statistics, unpaired, P < 0.05.
    SOZ membership from the deposited SOZ electrode list (table S1 marks the maximal-PLV
    hippocampal channel as SOZ in subjects 3 and 4). Open, which increase; readings (a) set
    size 8 minus set size 4, (b) maintenance minus encoding, each the maximum in the individual
    band. Open, which channels; readings (a) all hippocampal channels paired with the
    maximal-PLV scalp electrode, as in Fig. 6I, (b) the nine maximal-PLV pairs. Reproduced when
    no reading finds a significant difference; not reproduced when a reading does. Effect
    sizes are reported for every reading.
- id: hfo-rates-unaffected
  statement: >-
    The rates of clinically relevant high-frequency oscillations were not affected by
    performing the task.
  source: Results, Recordings in the epileptogenic zone, paragraph 1
  quote: >-
    The rates of clinically relevant HFOs were not affected by the performance of the task.
  criterion: >-
    A claim of absence for which the paper names neither the HFO detector nor the test nor the
    comparison. It cites reference 27 (Fedele et al. 2017, Sci Rep 7, 13836) for the detector;
    that paper is not under paper/ and was not read. The comparison is not given; the readings
    the text allows are (a) per-channel HFO rates in the task periods (encoding, maintenance)
    against fixation, (b) rates in trials of set size 8 against set size 4. The test is then
    the permutation t test of Methods, Statistics, at P < 0.05, the paper's general test for
    two distributions. Reproduced when no reading finds a significant difference in any
    channel group (SOZ, non-SOZ); not reproduced when one does. Without the detector of
    reference 27 (a question to a reader) the claim is blocked as methods_underspecified.
- id: sfc-maintenance-over-encoding
  statement: >-
    Maintenance neurons showed significant spike-field coherence to the local field potential,
    but not to the iEEG or scalp EEG, and for all frequency bins the percentage of neurons with
    spike-field coherence was higher during maintenance than during encoding.
  source: Results, Spike-field coherence, paragraph 1; fig. S6b; Figure 5J
  quote: >-
    We found significant spike-field coherence to the LFP but not to the iEEG or the scalp EEG.
    For all frequency bins, the percentage of neurons with spike-field coherence was higher
    during maintenance than during encoding (fig. S6).
  expected:
    quantity: maintenance neurons with at least 100 spikes in maintenance and in encoding
    value: 94
    tolerance: 9.4
  depends_on:
  - fig2b-maintenance-neurons-hippocampus
  criterion: >-
    Maintenance neurons of fig2b-maintenance-neurons-hippocampus with at least 100 spikes in
    both periods (fig. S6b legend gives N = 94). Pairwise phase consistency, the P-hat-2
    estimator of Vinck et al. 2012 (FieldTrip ppc2), between each neuron's spikes and the LFP
    of the same microwire; maintenance is the last 2 s (fig. S6a), encoding -5 to -3 s.
    Significance per frequency bin against the 95th percentile of 200 PPCs with the spike
    trials permuted (Methods, Spike-field coherence). Open, the frequency range; readings
    (a) 4 to 30 Hz, (b) 1 to 40 Hz. Open, the spectral estimate around each spike; the
    reading is FieldTrip's spike-triggered spectrum with a window of a fixed number of cycles,
    and the cycle number is a further open detail, run at 3 and 5 cycles. Reproduced when,
    under one reading, the maintenance percentage exceeds the encoding percentage in every
    frequency bin and the percentages for iEEG and scalp EEG are no higher than the 5%
    expected by chance (the paper does not say how "not to the iEEG or the scalp EEG" was
    judged; this is the reading of its per-bin 95th percentile threshold); partially reproduced when the maintenance percentage is higher in most
    bins. The LFP of the microwires is not among the data listed by the data descriptor; if
    the dataset lacks it, the LFP parts are blocked and the iEEG and scalp EEG parts are run.
