    quantified; it is judged with the protocol's default tolerance, the maintenance-neuron
    median within 8 percentage points (10% of the 80% accuracy) of the all-hippocampus median, with (i) significant
    against its scrambled null (Fig. 4E legend, "Sufficient decoding was possible"). Reproduced
