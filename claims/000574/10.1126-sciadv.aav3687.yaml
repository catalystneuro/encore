    Methods equation 2 with step 20 ms, averaged over set sizes and over each period; 200 runs
    of dPCA on neural trajectories subsampled at 20% with replacement (Methods). Periods
    fixation -6 to -5 s, encoding -5 to -3 s, maintenance -3 to 0 s; the retrieval window is
    not given; readings (a) 0 to 1 s after probe onset, (b) 0 to 2 s. Permutation t test of the
    per-run maintenance speeds against each other period. Open, the number of runs; the Methods
    give 200 dPCA runs and table S2 (Fig. 4b, 4c) gives n = 2000 "nr of runs"; both are run.
    Reproduced when, under one
    reading, maintenance speed is below each other period with P < 0.05 and encoding speed is
    the highest; partially reproduced when maintenance is lowest but encoding is not highest.
- id: fig4c-distance-largest-maintenance
  statement: >-
    The pairwise distance between the trajectories of different set sizes was larger during
    maintenance than during encoding, and the largest of the trial periods.
  source: Results, Attractors in neural population dynamics, paragraph 2; Figure 4C
  quote: >-
    Analyzing the pairwise distance between trajectories that corresponded to different set
    sizes, we found that the distances during maintenance were larger than during encoding
    (permutation t test, P = 0.0005; Fig. 4C )
  statistics:
  - test: permutation t test
    p: 0.0005
  depends_on:
  - fig4a-dpca-workload-separation
  criterion: >-
    As fig4b-speed-lowest-maintenance, with distance from Methods equation 1 between each of
    the three pairs of set-size trajectories, averaged over pairs and over each period, 200
    or 2000 subsampled runs (as there). Reproduced when, under one reading, maintenance distance exceeds encoding
    distance with P < 0.05 and is the largest of the four periods; partially reproduced when it
    exceeds encoding only.
- id: fig4d-encoding-decodes-correct
  statement: >-
    During encoding of high-workload trials (set sizes 6 and 8), hippocampal neurons, but not
    entorhinal or amygdala neurons, predicted whether the subject would later respond correctly,
    with a median decoding accuracy of 80%.
  source: Results, Decoding of information during the trial, paragraph 2; Figure 4D
  quote: >-
    For the encoding period (−5 to −3 s), we found that the activity of hippocampal neurons, but
    not neurons in other areas, could be used to decode whether the subject would later reply
    correctly or incorrectly in the trial. The median decoding accuracy was 80% (permutation test
    against scrambled data, P = 0.002; Fig. 4D )
  statistics:
  - test: permutation test against scrambled data
    p: 0.002
    corrected: Bonferroni over 12 tests, corrected P = 0.024
    n: 500 decoder runs with scrambled labels
  expected:
    quantity: median decoding accuracy, hippocampus, encoding
    value: 80
    tolerance: 8
    unit: '%'
  criterion: >-
    Pseudopopulation decoding with a support vector machine as in the NDT toolbox (Methods,
    Neural decoding): spikes in 1 ms bins smoothed in a 1500 ms window, classified at 250 ms
    steps, 500 resampling runs, trials of set sizes 6 and 8 (Fig. 4D legend), units from
    sessions with at least five incorrect responses, five cross-validation splits; null from
    500 runs with scrambled labels; Bonferroni over 12 tests. Populations hippocampus,
    entorhinal cortex and amygdala. Open, the smoothing window shape; readings (a) a 1500 ms
    boxcar (NDT binning), (b) a Gaussian. Open, feature normalization; readings (a) z-score
    per neuron on training data (NDT's usual preprocessing), (b) none. Open, the SVM kernel;
    the reading is NDT's default linear kernel. Open, how "median accuracy" is taken; readings
    (a) median over resampling runs of the accuracy averaged over the 250 ms steps inside -5 to
    -3 s, (b) median over runs and steps together. Reproduced when, under one reading,
    hippocampus is above the null at corrected P < 0.05 with median within tolerance and
    neither other area is significant; partially reproduced when hippocampus holds and another
    area is significant too.
- id: fig4e-maintenance-decodes-workload
  statement: >-
    During maintenance, workload (set size 4 against 6 and 8) could be decoded from hippocampal
    neurons with a median accuracy of 80%, but not from neurons of the other areas.
  source: Results, Decoding of information during the trial, paragraph 2; Figure 4E
  quote: >-
    For the maintenance period, we found that the workload (set size 4 versus set sizes 6 and 8)
    of each trial could be decoded from hippocampal neurons but not from neurons in the other
    areas (permutation test against scrambled data, P = 0.002; Fig. 4E ). The median decoding
    accuracy was 80%.
  statistics:
  - test: permutation test against scrambled data
    p: 0.002
    corrected: Bonferroni over 12 tests, corrected P = 0.024
    n: 500 decoder runs with scrambled labels
  expected:
    quantity: median decoding accuracy, hippocampus, maintenance
    value: 80
    tolerance: 8
    unit: '%'
  criterion: >-
    As fig4d-encoding-decodes-correct, with correct trials, labels set size 4 against 6 and 8,
    all units, ten cross-validation splits, and the maintenance period -3 to 0 s. Open, class
    balance; readings (a) equal numbers of trials per class drawn for each neuron (NDT's
    requirement), (b) all trials. Reproduced when, under one reading, hippocampus is above the
    null at corrected P < 0.05 with median within tolerance and neither entorhinal cortex nor
    amygdala is significant; partially reproduced when hippocampus holds and another area is
    significant too.
- id: fig4e-workload-decoding-leave-one-subject-out
  statement: >-
    Excluding any one subject changed the hippocampal workload decoding accuracy to a value in
    the range 71 to 81%.
  source: Results, Decoding of information during the trial, paragraph 2
  quote: >-
    To ensure that some subjects did not drive the results, we performed a leave-one-out
    analysis. The exclusion of any subject changed the decoding accuracy to a value in the range
    [71 to 81%].
  expected:
  - quantity: lowest leave-one-subject-out accuracy
    value: 71
    tolerance: 7.1
    unit: '%'
  - quantity: highest leave-one-subject-out accuracy
    value: 81
    tolerance: 8.1
    unit: '%'
  depends_on:
