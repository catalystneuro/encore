- id: ed4l-alm-initiation
  statement: More ALM neurons are tuned to sequence initiation than neurons of the other regions.
  source: Results, "Sequence tiling of single-unit responses", paragraph 2; Extended Data Fig. 4l
  quote: We observed that single-neuron responses tile the sequence progression (Fig. 2e-h, Extended
    Data Fig. 4k), with more ALM neurons tuned to sequence initiation (Extended Data Fig. 4l).
  depends_on:
  - ed4m-active-neuron-counts
  criterion: For each active neuron (reading (a) of ed4m), the window holding the peak of its 6
    PETHs. Reproduced when the fraction peaking in the initiation window is higher in ALM than in
    M1TJ and in S1TJ, each by Fisher's exact test at p < 0.05; partially when higher than both but
    significant for one; not reproduced otherwise.
- id: ed4o-rhythmicity
  statement: S1TJ and M1TJ contain more neurons modulated by individual licks than ALM.
  source: Results, "Sequence tiling of single-unit responses", paragraph 2; Extended Data Fig. 4n,o
  quote: "S1TJ and M1TJ contained more neurons (e.g. cluster #7; Extended Data Fig. 4k,m) that show
    greater modulation by individual licks (Extended Data Fig. 4n,o)."
  depends_on:
  - ed4m-active-neuron-counts
  criterion: For each active neuron, the correlation of each mid-sequence PETH with its best
    fitting 6.5 Hz sinusoid, averaged over the two directions (r_avg). Reproduced when the median
    r_avg of S1TJ and of M1TJ each exceed ALM's with a one-sided Mann-Whitney p < 0.05; partially
    when one does; not reproduced otherwise.
- id: ed6-alm-reward-drop
  statement: ALM contains neurons that fire during sequence execution and decrease firing
    abruptly when the tongue first contacts water, although licking continues.
  source: Results, "Reward modulation in ALM", paragraph 2; Extended Data Fig. 6a
  quote: ALM contained single neurons (Extended Data Fig. 6a) that fired actively during sequence
    execution but abruptly decreased firing upon tongue contact with water, even though mice
    continued with ~5 consummatory licks
  depends_on:
  - ed4m-active-neuron-counts
  criterion: Over standard trials of the 13 ALM sessions, for each active ALM neuron, the rate in
    0 to 0.5 s after the first touch at or after water delivery is compared with -0.5 to 0 s
    (Wilcoxon signed-rank over trials, p < 0.01). Reproduced when neurons that decrease outnumber
    those that increase (binomial test p < 0.05); not reproduced otherwise. M1TJ and S1TJ are
    shown for reference.
- id: ed1h-sequence-duration
  statement: Expert mice completed the 7 port positions in about a second.
  source: Results, first section, paragraph 3; Extended Data Fig. 1h
  quote: expert mice showed remarkable sequence execution speed, with the 7 positions completed in
    about a second (Extended Data Fig. 1h).
  expected:
    quantity: median time to complete a standard sequence
    value: 1.0
    tolerance: 0.1
    unit: s
  criterion: Sessions are the recording sessions with standard sequences (ephys groups except ZZ)
    and the opto sessions (trials without light). Per mouse, the median over standard trials; the
    value is the median over mice. Readings, (a) from the first port-moving touch to the first
    touch at the last position, (b) from the cue to that touch. Reproduced when a reading is
    within tolerance.
- id: ed1l-learning-curves
  statement: Over training, 15 mice reduced their sequence initiation time and increased their
    sequence speed.
  source: Extended Data Fig. 1l; Results, first section, paragraph 3
  quote: Learning curves for 15 individual mice (gray) and the mean (black) showing a reduction in
    sequence initiation time (left) in response to the auditory cue and an increase in sequence
    speed (right).
  expected:
    quantity: mice with learning sessions
    value: 15
    tolerance: 0
  criterion: Learning files (described as Data learning), standard trials, in session order. The
    first and last 100 standard trials of each mouse; initiation time is the cue to the first
    touch, sequence speed the mean over the six intervals of 1 over the time between port-moving
    touches. Reproduced when 15 mice are present and at least 12 of them show both a lower
    initiation time and a higher speed (medians), with a Wilcoxon signed-rank test over mice at p
    < 0.05 for each; partially when only one of the two measures meets this; not reproduced
    otherwise. Files deposited twice are left out.
- id: ed1l-proficiency-1500
  statement: Mice reached proficiency in standard sequences after about 1500 trials of training.
  source: Results, first section, paragraph 3; Extended Data Fig. 1l-n
  quote: Mice reached proficiency in standard sequences (Fig. 1e) after ~1500 trials of training
    (Methods; Extended Data Fig. 1l-n).
  depends_on:
  - ed1l-learning-curves
  expected:
    quantity: median number of trials to proficiency
    value: 1500
    tolerance: 150
  criterion: The paper does not define proficiency. Readings, counting all trials of the learning
