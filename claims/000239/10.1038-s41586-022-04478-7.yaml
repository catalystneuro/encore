- id: ed5b-variables-uncorrelated
  statement: Any pair of the five behavioural variables (L, L', theta, I, tau) is uncorrelated.
  source: Results, "Hierarchical population coding", paragraph 1; Extended Data Fig. 5b
  quote: Conveniently, any pair of these variables is uncorrelated (Extended Data Fig. 5b).
  depends_on:
  - fig3-session-counts
  criterion: Over the samples of the regression (selected standard trials, -0.5 to 0.5 s from the
    middle touch), the absolute Pearson correlation of each pair, averaged over the 35 sessions.
    The paper gives no threshold; reproduced when every pair is below 0.3 (a common bound for a
    weak correlation), partially when all but one pair are, not reproduced otherwise.
- id: ed5e-variance-explained
  statement: Across regions, the summed variance explained by the five coding axes reached about
    half that of the top five principal components.
  source: Results, "Hierarchical population coding", paragraph 7; Extended Data Fig. 5e
  quote: Across regions, the sum of variance explained (VE) by the five coding axes reached about
    half that of the top five PCs (Methods; Extended Data Fig. 5e).
  depends_on:
  - fig3c-length
  - fig3c-velocity
  - fig3c-angle
  - fig3c-identity
  - fig3c-time
  expected:
    quantity: median over sessions of summed VE of coding axes over summed VE of top 5 PCs
    value: 0.5
    tolerance: 0.05
  criterion: The coding axes are the unit vectors of the elastic net weights; their VE is the
    variance of the projected normalised rates over the total variance, on -0.5 to 0.8 s around
    the middle touch of the selected standard trials. An axis with all weights zero has VE 0.
- id: ed5f-axes-orthogonal
  statement: The five coding axes were largely orthogonal to each other.
  source: Results, "Hierarchical population coding", paragraph 7; Extended Data Fig. 5f
  quote: The five coding axes were largely orthogonal with each other (Extended Data Fig. 5f)
  depends_on:
  - ed5e-variance-explained
  criterion: The absolute cosine of each pair of coding axes, averaged over sessions where both
    are non-zero. Reproduced when every pair is below 0.3, partially when all but one or two are,
    not reproduced otherwise. The mean absolute cosine of random directions in the same
    sessions is shown as a reference.
- id: fig3e-cca
  statement: After canonical correlation, ALM trajectories in the top three PCs correlate best
    with the theta, I, tau coding subspace (group 2), more than with L, L', theta (group 1) or all
    five variables with five PCs (group 3); in S1TJ and M1TJ the correlation is high only when the
    coding subspace includes L and L'.
  source: Figure 3d,e; Results, "Hierarchical population coding", paragraph 6
  quote: trajectories of the ALM population in the subspace of the top three PCs aligned (Fig. 3d)
    and correlated (Fig. 3e; group 2 in ALM) well with the trajectories in the subspace encoding θ,
    I, and τ ... M1TJ and S1TJ also showed a strong correlation but only when the coding subspaces
    included L and L'
  statistics:
  - test: paired two-tailed permutation test
    p: 0.001
    p_relation: "<"
  depends_on:
  - ed5e-variance-explained
  criterion: For each session, trial averages per direction of the decoded variables and of the
    PC projections on -0.5 to 0.8 s from the middle touch are concatenated; the mean canonical
    correlation is computed for group 1 (L, L', theta with PC1-3), group 2 (theta, I, tau with
    PC1-3) and group 3 (all five with PC1-5). Paired two-tailed permutation tests (sign flips over
    sessions) at p < 0.05 for five comparisons, the ones the figure marks; ALM 2 > 1 and 2 > 3;
    S1TJ 1 > 2 and 3 > 2; M1TJ 3 > 2. Reproduced when all five hold, partially for three or four,
    not reproduced for fewer.
- id: fig3f-backtracking-svm
  statement: ALM and M1TJ activity predicts whether the port backtracked from the initial missed
    lick on; S1TJ shows only an insignificant trend and S1BF no prediction.
  source: Figure 3f; Results, "Sequence branching signals in ALM, M1TJ", paragraph 2
  quote: ALM and M1TJ activity started to predict the presence or absence of backtracking during the
    initial missed lick (Fig. 3f). ... S1TJ populations showed only a statistically insignificant
    trend toward being able to distinguish backtracking from standard sequences ... As expected,
    S1BF populations showed no prediction.
  depends_on:
  - fig3-session-counts
  criterion: Sessions with backtracking in both directions. Standard and backtracking trials
    are selected as for Figure 3, and the two directions are balanced within each class by
    random subsampling. For each 15 ms bin from -0.15 to 0.4 s after the backtracking trigger
    (the middle touch), a linear SVM on the first 12 PCs of the normalised rates, 10-fold CV,
    balanced classes; the null is 20 label shuffles per session. A region decodes when its mean
    accuracy over sessions in 0.2 to 0.4 s exceeds the 95th percentile of the same mean over
    shuffles. Reproduced when ALM and M1TJ decode and S1TJ and S1BF do not; partially when ALM
    and M1TJ decode and S1TJ or S1BF also does, or when only one of ALM and M1TJ decodes; not
    reproduced otherwise.
- id: fig4g-zigzag-context
  statement: In the zigzag task, ALM population activity predicts the sequence identity
    (context) during subsequences with the same licking movements, across 6 sessions from 3 mice.
  source: Figure 4f,g; Results, "Context-dependent coding of subsequences", paragraph 2
  quote: Using population activity as a predictor, linear SVM classifiers (Methods) were able to
    predict the sequence identity, or context, in the example session (Fig. 4f) and across sessions
    and mice (Fig. 4g).
  criterion: The 6 files described as ephys ZZ. Trials with perfect execution (13 touches and no
    lick without a touch between the first and last touch). The four matched comparisons pair the
    seventh touch of one sequence with the third or eleventh touch of the other, which are at the
    same position and in the same direction of movement. For each 5 ms bin from -0.25 to 0.25 s, a
    linear SVM on 12 PCs, 10-fold CV, balanced classes, 20 label shuffles per session. A comparison
    decodes when the mean accuracy over sessions and bins exceeds the 95th percentile of the same
    mean over shuffles. Reproduced when all four decode, partially for one to three, not
    reproduced for none. The session and mouse counts are checked (6 and 3).
- id: ed7f-target-position-alm
  statement: During the inter-trial interval, ALM populations encode the upcoming target position
    more strongly than the other regions.
  source: Extended Data Fig. 7e,f; Results, "ALM encodes upcoming sequences", paragraph 2
  quote: On average, ALM populations showed stronger encoding of TP (Extended Data Fig. 7e,f)
    compared to other regions.
  depends_on:
  - fig3-session-counts
  criterion: For each of the 35 sessions, the cross-validated R2 of an elastic net predicting the
    upcoming sequence direction from normalised rates in the second before the cue, over all
    standard trials. Reproduced when the ALM mean R2 is the highest and a one-sided Mann-Whitney
    test of ALM against each other region gives p < 0.05; partially when the ALM mean is the
    highest but not every test is significant; not reproduced otherwise.
- id: ed7h-no-time-coding
  statement: None of the regions, including ALM, encoded time or distance to the trial start
    during the inter-trial interval.
  source: Extended Data Fig. 7h; Results, "ALM encodes upcoming sequences", paragraph 2
  quote: None of the regions, including ALM, encoded time or a distance to trial start (Extended
    Data Fig. 7h)
  depends_on:
  - fig3-session-counts
  criterion: Same model as ed7f-target-position-alm, predicting the time to the cue over the 1 s
    before it. The paper gives no test; the claim of absence is reproduced when the mean R2 of
    every region is below 0.1 and not reproduced when any region's mean is 0.1 or more. The
    effect size is reported for each region.
