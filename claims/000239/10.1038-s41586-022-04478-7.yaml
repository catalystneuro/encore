  statement: Extended Data Fig. 4m counts 324 ALM, 233 M1TJ and 119 S1TJ neurons.
  source: Extended Data Fig. 4m legend
  quote: Proportions of neurons from different clusters at different cortical depths. ... ALM (n =
    324), M1TJ (n = 233) and S1TJ (n = 119).
  depends_on:
  - ephys-unit-counts
