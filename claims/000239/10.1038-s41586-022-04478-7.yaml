    recording sessions.
  source: Results, "Sequence tiling of single-unit responses", paragraph 1; Extended Data Fig. 4a-d
  quote: We used silicon probes to record from multiple brain regions from both hemispheres (Fig.
    2d) during the task, obtaining 1537 single-units and 303 multi-units (Methods; Extended Data
    Fig. 4a-e) from 57 recording sessions.
  expected:
  - quantity: recording sessions
    value: 57
    tolerance: 0
  - quantity: single units
    value: 1537
    tolerance: 153.7
  - quantity: multi-units
    value: 303
    tolerance: 30.3
  criterion: Sessions are the 57 files described as ephys ALM, M1TJ, S1TJ, S1BF, M1B, S1L or ZZ.
    Units are classified by the two criteria of the Methods (a unit is multi when its ISI
    violation rate exceeds 1% or its contamination exceeds 15%). Reproduced when the session
    count is 57 and both unit counts are within tolerance; partially reproduced when the session
    count and the total (1840, 10%) match but the split does not; not reproduced otherwise.
