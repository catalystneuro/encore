- id: ed2e-missed-licks
  statement: After the port backtracked, mice took on average 1 to 2 missed licks before
    relocating it.
  source: Results, first section, paragraph 4; Extended Data Fig. 2e
  quote: On average, it took 1 to 2 missed licks before mice quickly relocated the port (Extended
    Data Fig. 2e).
  depends_on:
  - fig3-session-counts
  expected:
    quantity: mean missed licks in the fourth interval of backtracking trials
    value: 1.55
    tolerance: 0.65
  criterion: Tolerance is the stated range 1 to 2 widened by 10% of each bound (0.9 to 2.2). The
    fourth interval runs from the middle touch to the next port-moving touch; a missed lick is a
    video lick starting in it with no touch onset within 12.5 ms of the lick. Sessions are those
    of Figure 3 with backtracking trials. Reproduced when the mean over backtracking trials is in
    range and exceeds that of standard trials (Mann-Whitney p < 0.05); partially when only the
    second holds; not reproduced otherwise.
- id: ed6b-consummatory-licks
  statement: After the first lick that touched water, mice continued with about 5 consummatory
    licks.
  source: Results, "Reward modulation in ALM", paragraph 2; Extended Data Fig. 6b
  quote: ALM contained single neurons ... abruptly decreased firing upon tongue contact with water,
    even though mice continued with ~5 consummatory licks (Extended Data Fig. 6b)
  depends_on:
  - fig3-session-counts
  expected:
    quantity: median number of licks after the first lick touching water
    value: 5
    tolerance: 0.5
  criterion: Standard trials of the 35 Figure 3 sessions. The first water lick is the first
    touch at or after water delivery; the bout continues while successive intervals are below 1.5
    times the session's median inter-lick interval. Readings, (a) video licks after it, (b) touches
    after it, (c) as (a) counting the first water lick. Trials whose video ends during the bout
    are left out of (a) and (c). Reproduced when the median over trials is within tolerance under
    a reading.
- id: ed7b-correct-side
  statement: Expert mice usually initiated sequences from the correct side without exploring the
    other side.
  source: Results, "ALM encodes upcoming sequences", paragraph 1; Extended Data Fig. 7b
  quote: Expert mice nevertheless usually initiated sequences from the correct side without
    exploring the other (Extended Data Fig. 7b)
  depends_on:
  - fig3-session-counts
  criterion: Standard trials of the 35 Figure 3 sessions. A trial is initiated without exploring
    when no lick before the first touch has theta_shoot on the other side of the midline from the
    lick that made the first touch. Reproduced when the fraction exceeds 0.5 in every mouse;
    partially when it does in most mice; not reproduced otherwise. A 5 degree margin around the
    midline is shown as a variant.
- id: fig2b-s1tj-angle-variability
  statement: Inhibiting S1TJ increased the across-trial variability of lick angle, SD(theta_shoot),
    without reducing the lateral reach |theta_shoot|, and did not shorten licks.
  source: Figure 2b; Extended Data Fig. 3j; Results, "Optogenetic inhibition screen", paragraph 2
  quote: SD(Θshoot) increased significantly compared with no inhibition (Fig. 2b, left). Despite
    disorganized targeting, the ability to direct licks to the sides (i.e. |Θshoot|) was
    uncompromised ... Inhibiting S1TJ also did not shorten the length of licks
  criterion: Needs the inhibited region of each opto session.
- id: fig2b-almm1tj-angle-length
  statement: Inhibiting ALM/M1TJ reduced the ability to direct licks to the sides and decreased
    lick length; inhibiting M1B only slightly increased angle variability; inhibiting S1BF or S1Tr
    changed nothing.
  source: Figure 2b; Extended Data Fig. 3j; Results, "Optogenetic inhibition screen", paragraph 3
  quote: when inhibiting ALM/M1TJ, mice had reduced ability to direct licks to the sides ... and
    showed decreased length of lick (Fig. 2b, right). Inhibiting M1B caused only minor increases in
    lick angle variability ... Inhibiting S1BF or S1Tr changed no aspects of lick control.
  criterion: Needs the inhibited region of each opto session.
- id: fig2c-almm1tj-initiation
  statement: Inhibiting ALM/M1TJ at sequence initiation strongly suppressed licking (licks largely
    absent in 4 of 7 mice), and less strongly at mid-sequence.
  source: Figure 2c; Extended Data Fig. 3k; Results, "Optogenetic inhibition screen", paragraph 4
  quote: inhibiting ALM/M1TJ at sequence initiation strongly suppressed production of licking
    sequences (Fig. 2c, left; Supplementary Video 4). In 4 of 7 mice, licks were largely absent ...
    When applied at mid-sequence, ALM/M1TJ inhibition also suppressed the production of licks,
    although less strongly.
  criterion: Needs the inhibited region of each opto session.
- id: fig2c-termination
  statement: Inhibiting S1TJ or M1B at water consumption impaired the stopping of ongoing
    licking.
  source: Figure 2c; Extended Data Fig. 3k; Results, "Optogenetic inhibition screen", paragraph 5
  quote: when inhibiting S1TJ or M1B at water consumption, mice were impaired at stopping ongoing
    sequences (Fig. 2c, right; Extended Data Fig. 3k, bottom row; example in Supplementary Video 5).
  criterion: Needs the inhibited region of each opto session.
- id: ed3lm-half-power
  statement: With half the illumination power (2 mW) the effects were consistent with, though
    weaker than, those at 4 mW, and the termination deficit of S1TJ and M1B inhibition was
    similarly strong.
  source: Extended Data Fig. 3l,m; Results, "Optogenetic inhibition screen", paragraph 6
  quote: Effects of ALM/M1TJ inhibition ... remained largely consistent with, though weaker than,
    our previous results using higher power (4 mW). At consumption, inhibiting S1TJ or M1B resulted
    in similarly strong deficits in terminating ongoing sequences
  criterion: Needs the inhibited region of each opto session.
- id: ed3f-inhibition-efficiency
  statement: At 4 mW, light within 1 mm reduced the spike rate of putative pyramidal cells by 91%,
    at about 1.5 mm by 61% and at about 3 mm by 19%; FS neurons within 1 mm increased by 739%.
  source: Methods, "Photostimulation", paragraph 4; Extended Data Fig. 3c-f
  quote: light within 1 mm distance reduced mean spike rate of putative pyramidal cells (Extended
    Data Fig. 3c-e) by 91%, light at ~1.5 mm away by 61%, and ~3 mm away by 19% ... light shined
    within 1 mm increased the mean spike rate of FS neurons by 739%
  criterion: Needs the spike waveform widths (pyramidal against FS) and the distance of the fibre
    from the recording site in each efficiency session.
- id: ed1i-earplug
  statement: Hearing loss with earplugs did not increase missed licks during sequences.
  source: Extended Data Fig. 1i; Results, first section, paragraph 3; Methods, "Hearing loss"
  quote: Control experiments (Methods) showed that mice did not rely on auditory (Extended Data Fig.
    1i) or olfactory (Extended Data Fig. 1j) cues
  criterion: Needs which of the two sessions of each mouse had earplugs.
- id: ed1j-odor-masking
  statement: Masking odours with an air flow did not change missed licks.
  source: Extended Data Fig. 1j; Results, first section, paragraph 3; Methods, "Odor masking"
  quote: Control experiments (Methods) showed that mice did not rely on auditory (Extended Data Fig.
    1i) or olfactory (Extended Data Fig. 1j) cues
  criterion: Needs which part of each session had the air flow on.
- id: ed1k-tongue-numbing
  statement: Numbing the tongue with lidocaine increased missed licks, so mice require tactile
    feedback from the tongue.
  source: Extended Data Fig. 1k; Results, first section, paragraph 3; Methods, "Tongue numbing"
  quote: Control experiments (Methods) showed that mice ... did require tactile feedback from the
    tongue (Extended Data Fig. 1k).
  criterion: Needs which session of each mouse was lidocaine and which saline.
- id: ed1f-lick-force
  statement: The maximal force of a lick was on average about 4 mN.
  source: Methods, "Two-axis optical force sensors", paragraph 2; Extended Data Fig. 1f
  quote: In contrast, the maximal force of a lick was on average about 4 mN (Extended Data Fig. 1f).
  criterion: Needs the calibration from sensor voltage to force.
- id: ed4j-nnmf-clusters
  statement: Clustering the PETHs of all neurons by NNMF was most consistent with 13 clusters.
  source: Methods, "PETH and NNMF clustering", paragraph 5; Extended Data Fig. 4j,k
  quote: We ran this method with the number of clusters set to each value from 6 to 20, and found
    that 13 clusters achieved the best consistency (Extended Data Fig. 4j)
  criterion: Needs how cluster labels are matched across bootstrap iterations, which the Methods
    do not give.
