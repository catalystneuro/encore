  - quantity: ALM neurons
    value: 324
    tolerance: 32.4
  - quantity: M1TJ neurons
    value: 233
    tolerance: 23.3
  - quantity: S1TJ neurons
    value: 119
    tolerance: 11.9
  criterion: Neurons are units of the Figure 3 sessions of each region that pass the PETH
