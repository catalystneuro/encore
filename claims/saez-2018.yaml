# Claims for Saez, Lin, Stolk, Chang, Parvizi, Schalk, Knight & Hsu (2018), Current Biology
# 28:2889-2899, on CRCNS ofc-3.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-11,
# protocol pilot-14 as stated in docs/protocol.md. The writer did not look at the dataset's data or
# files; only its description on crcns.org (paper/ofc-3.data-description.txt) was read, for which
# experiments it holds.
#
# Text read: the version of record, as a text extraction of the publisher's PDF (PyMuPDF), with the
# PDF: main text, figure legends, STAR Methods (pages e1 to e3) and the Supplemental Information
# (Figures S1 to S7, Tables S1 and S2). The extraction garbles some symbols (minus signs, "~" and
# the exponents of "p < 10^-5" and "p < 10^-6" print as a replacement glyph; the formulas of Table
# S1 are garbled); they were read from context and from the PDF, and quotes are cut around them.
#
# Code read: none. The paper links no code; it says analysis was done "in MATLAB and R using
# custom scripts" (STAR Methods, ECoG Recording).
#
# Data the paper used. 10 adult patients (4 female) with intractable epilepsy, implanted with
# subdural grids or strips at UCSF (2), Stanford (2), UC Irvine (5) and Albany (1). 210 OFC
# electrodes recorded, 192 artifact-free and confirmed in OFC kept (per patient 5, 6, 52, 5, 61,
# 7, 11, 10, 19 and 16 for s01 to s10, Table S2). One session of 200 rounds per patient (plus
# practice). Each round: fixation cross (t = 0), game presentation at 750 ms showing a gamble
# prize ($10 to $30 in $5 steps) and a number 0 to 10; up to 2 s to choose the safe bet ($10) or
# the gamble (left/right side randomized); outcome reveal 550 ms after the button press, a second
# number, the gamble winning when it is greater than the first; new round 1 s after reveal.
# Timeouts (9.98% of trials) excluded. The outcome is revealed whether or not the patient
# gambled. 10 healthy comparison participants (UC Berkeley undergraduates) played the same task;
# the paper does not say whether their data were deposited.
# Signals: ECoG at 1 kHz after downsampling, common average reference, 1 Hz high-pass; HFA is the
# 70-200 Hz band (two-way zero-phase FIR band-pass) and its analytic amplitude (Hilbert
# transform); broadband field potential (FP) power is used for comparison. Epochs are locked to
# game presentation (game epoch) and to the button press or reward (buttonpress epoch; outcome is
# a fixed 550 ms after the press). The dataset description lists HFA epochs ([-1, 2] s around
# game presentation and around the button press, raw and window averaged), the behavior files
# with event times, choices and outcomes, the gamble parameters per trial, and per-subject files
# of "the behavioral regressors used for analysis" (sXX_behav_globals.mat). It lists no broadband
# signal and no electrode coordinates or Brodmann labels; whether the data hold them is the
# author's to find.
#
# Method details fixed by the paper and used below (STAR Methods, ECoG analysis and behavioral
# regression, and Behavioral Analysis):
# - Dependent variable: HFA analytic amplitude, epoched with a 200-ms baseline "to remove any
#   pre-stimulus differences in baseline amplitude", averaged in 200-ms windows stepped by 50 ms.
# - Per electrode, regressor and window, a separate linear regression of trial HFA on one
#   regressor; %EV is its R2 (in percent). Game and buttonpress epochs are analysed separately.
# - Encoding (task-active) electrode for a regressor: p < 0.05 in 5 or more consecutive windows
#   at any point in the epochs. The Behavioral Analysis section says "over 5 consecutive
#   windows"; the ECoG analysis section and Figure S6 legend say 5 or more, which is used.
# - Chance: labels shuffled against HFA 1,000 times per regressor and electrode.
# - Duration of encoding: the longest stretch in which all time points have p < 0.05.
# - Regressors (Table S1; Results, Economic Choice Behavior, paragraph 3): win probability p, risk
#   (variance of the gamble), chosen value (p times prize for a gamble, $10 for the safe bet),
#   gamble (1 gamble, 0 safe bet), win index (1 for gamble wins), loss index (1 for gamble losses),
#   RPE (reward obtained minus chosen value), regret (reward obtained minus the maximum reward
#   possible given the outcome, from -20 to 0). Past regressors are the same quantities from 1 to 5
#   trials back (t-1 to t-5). Defined on all trials except timeouts.
# - Stepwise regression: per electrode and regressor, sum of F statistics over the longest stretch
#   of consecutive windows with p < 0.05; 10,000 label shuffles give a permutation p, Bonferroni
#   corrected over 192 electrodes; surviving regressors enter forward selection by ANOVA at p <
#   0.05, starting from the one with the highest peak %EV.
# Details the paper leaves open, used by several claims, with the readings it allows:
# - Baseline. Which 200 ms (the 200 ms before the locking event, or before game presentation for
#   both epochs) and how removed (subtracted, or divided). Readings (a) subtract the mean of the
#   200 ms before each epoch's event; (b) subtract the mean of the 200 ms before game
#   presentation, for both epochs. Whether the dataset's HFA is already baseline corrected is
#   the author's to find.
# - Win probability. Table S1 and the Behavioral Analysis worked example give 0.8 for a shown 2,
#   so p = (10 - n)/10 for a shown number n; the Behavioral task paragraph says a shown 2 "had a
#   win probability of 20%". The first is used (it agrees with the rule that a greater second
#   number wins and the example); the second is a variant.
# - Risk. Table S1 gives E{(V - E(V))^2}, the variance of the gamble. Readings (a) p(1-p)x^2 with
#   x the prize; (b) p(1-p). Both peak at p = 0.5 as the paper says.
# - Offer value. The Results say "offer value (win probability)" and Figure 3 lists offer value in
#   place of win probability, so offer value is read as win probability; the gamble's expected
#   value p times x (Figure S2A) is a variant.
# - Past regressors across timeouts. Readings (a) the regressor of the round before, with rounds
#   whose previous round was a timeout (and round 1) dropped; (b) the regressor of the last
#   non-timeout round.
# The per-subject regressor files the dataset description lists may settle the regressor
# readings; where they do, the author follows them and says so.
