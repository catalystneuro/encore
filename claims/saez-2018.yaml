    and whether current win probability is in the model, is not stated; readings (a) one past
    regressor at a time with current win probability as covariate; (b) one at a time alone.
    Reproduced when no past regressor has p < 0.05 under reading (a), with (b) shown as a variant
    and the paper's 0.15 compared; not reproduced when one does. Effect sizes are reported.
- id: fig6-past-short-lived
  statement: Encoding of past information was limited to the immediately preceding trial; the
    proportion of electrodes encoding choices and outcomes 2 to 5 trials back was significantly
    lower than for the current and previous trials (p < 0.01, t test), with no evidence of
    encoding from earlier rounds.
  source: Results, Dissociable OFC Encoding of Past Choice and Outcome Information, paragraph 3;
    Figure 6A and 6B
  quote: Strikingly, we found no evidence for encoding of information from earlier rounds
  statistics:
  - test: t test
    p: 0.01
    p_relation: "<"
  depends_on:
  - fig3-present-encoding
  - fig4-past-encoding
  criterion: The proportion of encoding electrodes (selection of fig3-present-encoding) for each of
    the 8 regressors at lags t, t-1 and t-2 to t-5 (Behavioral Analysis). The unit of the t test
    is not stated; readings (a) per regressor proportions, t-2 to t-5 pooled against t and
    against t-1 (two-sample); (b) per lag means over regressors, t-2 to t-5 against t and t-1.
    "No evidence" is judged against the Null regressor line of Figure 6B, which the paper does
    not define; read as the shuffled chance proportion of fig3-present-encoding, with its 95th
    percentile as a standard choice. Reproduced when, under one reading, t-2 to t-5 are lower
    than both t and t-1 with p < 0.01 and, at each lag t-2 to t-5, the mean proportion over the 8
    regressors does not exceed the 95th percentile of chance; the per-regressor proportions
    against chance are reported (Figure 6B).
- id: figs5d-sharp-boundary
  statement: The distribution of encoding significance at the peak %EV shows a sharp boundary
    between t-1 and t-2 but not between t and t-1 (one-sided Kolmogorov-Smirnov tests).
  source: Figure S5C and S5D legends
  quote: Summary statistical results for ECDFs in (C) highlighting the sharp temporal boundary in
    encoding extent between t-1 and t-2, but not t and t-1
  criterion: For each regressor and lag, the -log10 p of each electrode's linear regression at its
    peak %EV window; ECDFs compared with one-sided Kolmogorov-Smirnov tests, t-1 greater than t
    and t-2 greater than t-1, as the legend states. The direction "t-2>t-1" is read as the ECDF
    of t-2 lying above that of t-1, so that t-2 has smaller -log10 p (weaker encoding), the only
    reading under which a significant result is the boundary the legend describes (the
    one-sided "larger" tail of a two-sample KS test on ECDFs); "t-1>t" likewise. The paper prints no p values; the threshold is open, 0.05 is used as
    a standard choice. Reproduced when the t-1 against t-2 comparison is significant and the t
    against t-1 comparison is not, for a majority of the 8 regressors, or for the pooled
    regressors.
- id: mixed-effects-robust
  statement: In nested mixed-effects models with patient and electrode as random effects, all
    regressors were significant (all p < 10^-4, Bonferroni corrected).
  source: Results, Dissociable OFC Encoding of Past Choice and Outcome Information, paragraph 4;
    STAR Methods, Stepwise regression, paragraph 3
  quote: We found that all of our regressors were significantly active
  statistics:
  - test: nested mixed-effects model
    p: 0.0001
    p_relation: "<"
    corrected: Bonferroni
  criterion: Concatenated HFA of all electrodes as dependent variable, round-by-round regressors as
    fixed effects, electrode nested in patient as random effects (STAR Methods). Open, with
    readings. Time point (a) the HFA in each window, one model per window, with a regressor
    counted significant in any window after correction over windows and regressors; (b) the HFA
    averaged over the epoch's post-event windows. Regressors (a) one model per regressor; (b) all
    current and t-1 regressors together. Electrodes (a) all 192; (b) encoding electrodes only.
    The paper does not say what the Bonferroni correction is over; read as over the regressors
    tested (16), and over windows as well under time point (a). Reproduced when, under one reading, every regressor has
    corrected p < 10^-4.
- id: figs6b-stepwise-similar
  statement: Stepwise regression with model selection gave proportions of encoding electrodes per
    regressor similar to those of the 5-consecutive-window selection.
  source: Results, Dissociable OFC Encoding of Past Choice and Outcome Information, paragraph 4;
    Figure S6B
  quote: The proportion of electrodes encoding each reward-related computational component as
    estimated by selecting electrodes with ≥5 consecutive encoding windows and stepwise regression
    followed by model selection were similar
  depends_on:
  - fig3-present-encoding
  - fig4-past-encoding
  criterion: Stepwise procedure as in the opening comment (STAR Methods, Stepwise regression). The
    paper gives no measure of "similar"; readings (a) the Spearman correlation across the 16
    regressors of the two proportions is positive with p < 0.05; (b) every regressor's two
    proportions differ by less than 10 percentage points. Reproduced when both hold, partially
    when one does.
- id: figs3a-risk-all-trials
  statement: The risk regressor over all trials explains slightly more HFA variance than risk
    restricted to gamble trials, so risk is encoded whatever the subsequent choice.
  source: Figure S3A legend
  quote: The regressor including all trials explains a slightly higher proportion of variance in
    HFA (%EV), suggesting that risk is encoded regardless of subsequent patient choice
  depends_on:
  - fig3-present-encoding
  criterion: Mean %EV time course of risk over risk-encoding electrodes, all non-timeout trials
    against gamble trials only, game epoch. Open whether electrodes are those selected with all
    trials or selected separately; the first is used as the one the legend implies ("compared
    the %EV of risk encoding"). Reproduced when the all-trial peak mean %EV is at least as high as
    the gamble-only peak.
- id: figs3b-no-motor-encoding
  statement: The direction of the response (left or right option) is not reflected in OFC HFA.
  source: Figure S3B legend; Results, OFC HFA Reflects Choice- and Outcome-Related Valuation
    Signals, paragraph 3; Discussion, paragraph beginning "Finally, although ECoG is not affected"
  quote: Regressors encoding direction of choice (left/right options) are not reflected in OFC HFA
  criterion: A claim of absence, judged with the paper's selection (p < 0.05 in 5 or more
    consecutive windows) for a left or right response regressor in both epochs. Reproduced when
    the proportion of electrodes so classified does not exceed the 95th percentile of its
    shuffled chance proportion; not reproduced when it does. The proportion and the peak mean %EV
    are reported.
- id: anatomy-brodmann-counts
  statement: Most electrodes lay in putative Brodmann area 11 (53 of 192), 13 (40) and 14 (67).
  source: Results, Anatomical Distribution of Present and Past Valuation Signals, paragraph 1
  quote: The majority of electrodes in our sample were located in putative BA 11 (n = 53 out of
    192 total), 13 (n = 40/192), and 14 (n = 67/192)
  expected:
  - quantity: electrodes in BA 11
    value: 53
    tolerance: 0
    unit: electrodes
  - quantity: electrodes in BA 13
    value: 40
    tolerance: 0
    unit: electrodes
  - quantity: electrodes in BA 14
    value: 67
    tolerance: 0
    unit: electrodes
  criterion: Exact counts when the data carry the paper's area labels. When only coordinates are
    available, the atlas assignment (JuBrain and AAL with visual confirmation from surgical
    notes, STAR Methods) cannot be repeated exactly; counts within 10% are then partially
    reproduced. Needs electrode locations, which the dataset description does not list.
- id: fig7-all-areas-similar
  statement: Electrodes encoding each signal type (present and past choice and outcome) were found
    in all three areas (BA 11, 13 and 14), in similar proportions across areas.
  source: Results, Anatomical Distribution of Present and Past Valuation Signals, paragraph 1;
    Figure 7B to 7E; Figure S7A
  quote: there was strong evidence for the presence of electrodes capturing each type of signal
    (present and past choice and outcome) across all three areas
  depends_on:
  - anatomy-brodmann-counts
  - fig3-present-encoding
  - fig4-past-encoding
  - figs6b-stepwise-similar
  criterion: Electrodes encoding any regressor of a group (choice, outcome, past choice, past
    outcome). The selection behind Figure 7B to 7E is not stated; readings (a) the
    5-consecutive-window selection, as in Table S2's "any" rows; (b) the stepwise selection,
    which the Results use for the groups of Figure 7F. The paper names no test for "similar"; a
    chi-square test of encoding against area per group is borrowed from the paper's test of the
    overlap of groups (Figure S7), with 0.05 a standard choice. Reproduced when each group has encoding electrodes in all three areas
    and no group's chi-square test has p < 0.05. Needs electrode locations.
- id: no-anatomical-gradient
  statement: There was no consistent evidence for differential encoding of individual valuation
    components across BA 11, 13 and 14, nor along fronto-posterior or medio-lateral gradients.
  source: Results, Anatomical Distribution of Present and Past Valuation Signals, paragraph 2;
    STAR Methods, Anatomical reconstructions; Discussion, paragraph beginning "As electrode
    locations were based"
  quote: We found no consistent evidence for differential encoding of individual valuation
    components across OFC subregions (BA 11/13/14), or across anatomical gradients
    (fronto-posterior or medio-lateral; STAR Methods)
  depends_on:
  - anatomy-brodmann-counts
  - fig3-present-encoding
  criterion: A claim of absence, with the paper's tests (STAR Methods, Anatomical
    reconstructions). For every electrode and regressor, the %EV at the window of the peak of the
    regressor's mean %EV profile over encoding electrodes; per regressor, Kolmogorov-Smirnov
    tests of these values between areas, and correlations with the x and y coordinates
    (referenced to the anterior commissure). The paper gives no threshold, correlation type or
    meaning of "consistent"; readings (a) p < 0.05 with Bonferroni over regressors and tests;
    (b) p < 0.05 uncorrected, with "consistent" meaning the same area or direction for most
    regressors of a group. The correlation is read as (a) Pearson or (b) Spearman. Reproduced when no
    regressor is significant under (a) and no consistent pattern appears under (b), with either
    correlation; the significant tests are listed either way. Needs electrode locations.
- id: tables2-patients-coverage
  statement: All signals were present in at least 6 of the 10 patients (mean 7.41 plus or minus
    0.4).
  source: Results, Anatomical Distribution of Present and Past Valuation Signals, paragraph 2;
    Table S2
  quote: We found that all signals were present in at least 6 of the 10 patients in our sample
    (mean = 7.41 ± 0.4; Table S2)
  expected:
  - quantity: mean number of patients with at least one encoding electrode per regressor
    value: 7.41
    tolerance: 0.4
    unit: patients
  depends_on:
  - fig3-present-encoding
  - fig4-past-encoding
  criterion: Per regressor, the number of patients with at least one encoding electrode (selection
    of fig3-present-encoding). The paper's own Table S2 does not give 7.41 by the plain reading;
    counted from it, the 16 regressors give 7.75 patients on average and past risk is present in
    only 5. Readings (a) the 16 current and t-1 regressors; (b) the 15 without past risk, which
    the Results treat as the exception; (c) the four group rows ("any choice" and so on).
    Reproduced when, under one reading, every regressor is present in at least 6 patients and the
    mean is within tolerance; partially reproduced when the result matches Table S2 counted the
    same way but not 7.41.
- id: fig7f-multiplexing
  statement: Most electrodes (132 of 192, 68.7%) encoded at least two of the four signal types
    (choice, outcome, past choice, past outcome) and 30 of 192 (15.6%) encoded all four.
  source: Results, Anatomical Distribution of Present and Past Valuation Signals, paragraph 3;
    Figure 7F
  quote: We observed significant overlap in electrode sets, with most electrodes (n = 132/192;
    68.7%) encoding at least two types of signals and 15.6% of electrodes (n = 30/192) encoding
    all four
  expected:
  - quantity: electrodes encoding at least two signal types
    value: 132
    tolerance: 13.2
    unit: electrodes
  - quantity: electrodes encoding all four signal types
    value: 30
    tolerance: 3
    unit: electrodes
  depends_on:
  - figs6b-stepwise-similar
  criterion: The Results say these sets come from the stepwise regression results, with an
    electrode in a group when any regressor of the group survives model selection. Table S2's
    selection (167 task-active electrodes) is a variant. Reproduced when both counts are within
    tolerance under the stepwise reading; partially reproduced when they are within tolerance
    only under the variant.
- id: figs7-present-past-overlap
  statement: Electrodes encoding both present and t-1 information were overrepresented, for choice
    (39 of 120, 32.5%, against an expected 31, p < 0.05) and for outcome (43 of 120, 35.8%,
    against an expected 34, p < 0.01), chi-square tests; many electrodes still encoded only
    present or only past information.
  source: Results, Anatomical Distribution of Present and Past Valuation Signals, paragraph 3;
    Figure S7 legend
  quote: We found an overrepresentation of electrodes that encoded both t+t-1 regressors both in
    the case of choice (39/120 or 32.5%, vs. an expected 31/120 or 25.8% under assumption of
    independence, p<0.05, chi-square test) and outcome information (n=43/120, or 35.8% vs. an
    expected 34/120 or 28.5% under assumption of independence, p<0.01, chi-square test)
  statistics:
  - about: choice, present and past
    test: chi-square test
    p: 0.05
    p_relation: "<"
  - about: outcome, present and past
    test: chi-square test
    p: 0.01
    p_relation: "<"
  expected:
  - quantity: electrodes encoding both present and past choice
    value: 39
    tolerance: 3.9
    unit: electrodes
  - quantity: electrodes encoding both present and past outcome
    value: 43
    tolerance: 4.3
    unit: electrodes
  depends_on:
  - fig7f-multiplexing
  criterion: A 2 by 2 chi-square test of independence of present and t-1 encoding, per signal
    class, with the expected count under independence. The denominator 120 is not explained and
    is not 192 nor the 160 electrodes in BA 11, 13 and 14; readings (a) the electrodes encoding
    any choice or outcome regressor (current or t-1) under the stepwise selection; (b) the same
    under the 5-consecutive-window selection; (c) all 192, the counts compared as proportions. Set membership
    as in fig7f-multiplexing. Reproduced when, under one reading, both observed counts are within
    tolerance and exceed the counts expected under independence with the stated p levels.
- id: fig2-example-electrodes
  statement: Example electrodes show risk encoding with an inverted U relation between win
    probability and HFA at peak encoding, and regret encoding with a linear drop of HFA with
    regret.
  source: Figure 2D to 2G legends
  quote: The relationship follows an inverted u shape with win probabilities as would be expected
    for risk encoding
  criterion: The paper does not identify the example electrodes. Among risk-encoding electrodes,
    the HFA at each electrode's peak %EV window against win probability; among regret-encoding
    electrodes, against regret. The paper names no test; the quadratic and linear fits at p <
    0.05 are standard choices. Reproduced when at least one risk electrode shows a significant
    negative quadratic term in win probability (p < 0.05) and at least one regret electrode a
    significant linear slope; the shares of encoding electrodes that do are reported.
