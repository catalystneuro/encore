claims:
- id: methods-electrode-trial-counts
  statement: Of 210 OFC electrodes recorded in 10 patients, 192 were artifact-free and included;
    each patient played 200 rounds, and timeouts, 9.98% of all trials, were excluded.
  source: STAR Methods, ECoG Recording, and Behavioral task; Table S2, last row
  quote: Out of 210 OFC electrodes, 192 were artifact-free and included in subsequent analyses
  expected:
  - quantity: OFC electrodes included
    value: 192
    tolerance: 0
    unit: electrodes
  - quantity: patients
    value: 10
    tolerance: 0
    unit: patients
  - quantity: timeout trials, percent of all trials
    value: 9.98
    tolerance: 0.998
    unit: percent
  criterion: Exact counts for electrodes and patients (the per-patient electrode counts of Table
    S2 are 5, 6, 52, 5, 61, 7, 11, 10, 19 and 16 for s01 to s10, which the author compares as
    well). The timeout percentage is the number of timeout trials over all trials of the 10
    patients. The paper's denominator is not stated; 9.98% of 2,000 is not a whole number of
    trials, so it is read as all trials recorded (2,000 when each patient played 200 rounds).
- id: behavior-risk-neutral
  statement: Patients were approximately risk neutral, choosing the gamble only slightly more often
    than a risk-neutral baseline model, on 55.9% (plus or minus 8.5%) of trials.
  source: Results, Economic Choice Behavior in Neurosurgical Patients, paragraph 4
  quote: we found that subjects were approximately risk neutral, choosing to gamble only slightly
    more often than a risk neutral baseline model (55.9% ± 8.5% of risky choices)
  expected:
  - quantity: percent of non-timeout trials on which the gamble was chosen
    value: 55.9
    tolerance: 8.5
    unit: percent
  criterion: The tolerance is the stated spread, which the paper does not name (SD or SEM). The
    paper does not say how the percentage is formed. Readings (a) the mean over the 10 patients
    of each patient's percentage of gamble choices among non-timeout trials; (b) the pooled
    percentage over all non-timeout trials. The risk neutral baseline model is not defined; the
    share of gamble choices a risk-neutral chooser would make (gamble when p times x exceeds $10,
    ties split) is reported for comparison.
- id: fig1c-choice-win-probability
  statement: The proportion of risky choices increased with win probability, well captured by a
    logit model (p < 0.001, random effects logit analysis).
  source: Results, Economic Choice Behavior in Neurosurgical Patients, paragraph 4; Figure 1C
  quote: The proportion of risky choices increased as the offer value (win probability) increased,
    which was well captured by a logit model of decision under risk (p < 0.001; random effects
    logit analysis; Figure 1C)
  statistics:
  - test: random effects logit analysis
    p: 0.001
    p_relation: "<"
    n: 10 patients
  criterion: A logistic regression of gamble choice (1 gamble, 0 safe bet; timeouts excluded) on
    win probability with patient as random effect. The random-effects structure is not stated;
    readings (a) random intercept per patient; (b) random intercept and slope per patient.
    Reproduced when, under one reading, the slope is positive with p < 0.001.
- id: figs2a-choice-gamble-ev
  statement: Patients' choices were sensitive to the expected value of the gamble (prize times win
    probability), with gamble choices more frequent at higher gamble expected value.
  source: Figure S2A legend
  quote: Patients' choices were sensitive to the expected value of the gamble (i.e., the gamble
    prize times the win probability), with gamble choices more prevalent for higher gamble
    expected value
  criterion: The paper shows this in a figure and reports no test. The test is borrowed from
    fig1c-choice-win-probability (the paper's test of choice against win probability) and the
    0.05 level is a standard choice, neither from the paper. A logistic regression of gamble
    choice on gamble expected value (p times x) with patient as random effect, readings (a)
    random intercept; (b) random intercept and slope. Reproduced when, under one reading, the
    slope is positive with p < 0.05. The proportions of gamble choices per expected-value level
    are reported.
- id: fig1c-patients-like-controls
  statement: The patients' choices were comparable to those of 10 healthy comparison participants
    (all p > 0.2).
  source: Figure 1C legend; Results, Economic Choice Behavior in Neurosurgical Patients, paragraph 4
  quote: Subjects' choices were significantly affected by likelihood of winning the gamble ... and
    were comparable to those of healthy participants (gray line; all p > 0.2)
  statistics:
  - test: not named
    p: 0.2
    p_relation: ">"
    n: 10 patients and 10 healthy participants
  criterion: A claim of absence. The paper does not name the test behind "all p > 0.2"; the plural
    and Figure 1C suggest one comparison per win-probability level. Readings the legend and the
    Results (Figures 1C and S1) allow, neither fixed by them, (a) per shown number, a two-sample t test of the proportion of gamble choices, patients
    against controls; a variant (b) compares the slopes of per-subject logit fits (Figure S1B).
    Reproduced when no comparison has p < 0.05 (the paper's 0.2 is reported against the result);
    not reproduced when one does. Needs the healthy participants' choices, which the paper does
    not say were deposited.
- id: figs2b-rt-conflict
  statement: Reaction times were longer in high-conflict trials (win probability 40 to 60%) than in
    low-conflict trials (below 30% or above 70%), in patients and in healthy subjects (both p <
    0.001, t test), with comparable effect sizes.
  source: Figure S2B legend
  quote: Patients and healthy subjects took longer to react in high-conflict trials (both p<0.001,
    t-test), and the effect size was comparable between both groups
  statistics:
  - about: patients, high against low conflict
    test: t test
    p: 0.001
    p_relation: "<"
  - about: healthy subjects, high against low conflict
    test: t test
    p: 0.001
    p_relation: "<"
  criterion: Reaction time is the button press time minus the game presentation time (the trial
    start plus 750 ms, STAR Methods, Behavioral task; or the photodiode-derived presentation time
    if the data give one). The unit and form of the t test are not stated; readings (a) a
    two-sample t test over pooled trials; (b) a paired t test over the 10 subjects' mean RTs.
    Reproduced for patients when, under one reading, high-conflict RTs are longer with p < 0.001.
    The healthy-subject part needs data the paper does not say were deposited. The paper gives no
    measure or test for "comparable" effect sizes; the effect size (Cohen's d, a standard choice)
    is reported for each group and that part is not judged.
