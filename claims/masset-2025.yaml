  statistics:
  - about: 0.6 s
    test: one-tailed Wilcoxon signed rank test
    p: 1
  - about: 1.5 s
    test: one-tailed Wilcoxon signed rank test
    p: 1.0e-31
    p_relation: "<"
  - about: 3.75 s
    test: one-tailed Wilcoxon signed rank test
    p: 1.0e-33
    p_relation: "<"
  - about: 9.375 s
    test: one-tailed Wilcoxon signed rank test
    p: 1.0e-3
    p_relation: "<"
  depends_on:
  - cued-delay-neurons
  criterion: M4 with the exponential matrix against M4 with the hyperbolic matrix 1 / (1 + k t)
