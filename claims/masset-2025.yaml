- id: ed5-behavioral-neural-discount-uncorrelated
  statement: Discount factors fitted to anticipatory licking are not correlated with the neural
    discount factors in the two mice with most neurons (r = -0.29, P = 0.27 in m3044; r = -0.029,
    P = 0.9 in m3054).
  source: Results, Discounting across dopamine neurons, paragraph 3; Extended Data Fig. 5b and 5e
  quote: Furthermore, we measured behavioral discounting using the anticipatory lick rate and show
    that it is not correlated to the discounting measured from single dopamine neurons
  statistics:
  - about: mouse 3044
    test: Spearman's rank correlation, two-tailed t-test
    statistic: r = -0.29
    p: 0.27
  - about: mouse 3054
    test: Spearman's rank correlation, two-tailed t-test
    statistic: r = -0.029
    p: 0.9
  depends_on:
  - cued-delay-neurons
  criterion: A claim of absence. Per neuron, the session's mean lick rate per delay after the odor,
    fitted with the exponential model and bounds of M2; Spearman correlation with the neural gamma
    over the neurons of each mouse, two-tailed, p < 0.05 counts as an effect. The window is 0.6 s
    after the cue in the Methods and 0.2 to 0.8 s (bins 12 to 14 of 200 ms) in the code
    (LickPSTHs_Revision.m); the Methods window decides and the code's is a variant. Reproduced
    when neither mouse shows p < 0.05; r is reported.
- id: fig3b-vr-ramp-population
  statement: In the VR task, 90 dopamine neurons ramp up on average before reward (mean slope
    0.097, P = 0.0175), but single neurons vary, 53 with significant positive slopes, 32 with
    significant negative slopes and 5 not significant.
  source: Results, Ramping heterogeneity and discounting, paragraph 2; Figure 3b
  quote: "the slope of the activity ramp (computed between the two black horizontal ticks in main
    panel) is positive on average but varies across neurons (population: mean slope = 0.097, P =
    0.0175. Single neurons: positive and P < 0.05: n = 53; negative and P < 0.05: n = 32; P > 0.05:
    n = 5, two-tailed t-test)"
  statistics:
  - about: population mean slope against zero
    test: two-tailed t-test
    p: 0.0175
    n: 90 neurons
  expected:
  - quantity: neurons analysed in the VR task
    value: 90
    tolerance: 9
  - quantity: population mean slope
    value: 0.097
    tolerance: 0.0097
    unit: normalised rate per second
  - quantity: neurons with significant positive slope
    value: 53
    tolerance: 5.3
  - quantity: neurons with significant negative slope
    value: 32
    tolerance: 3.2
  - quantity: neurons not significant
    value: 5
    tolerance: 0.5
  criterion: Neurons as M6. Slope per bootstrap half (code VR_Figures_Revision.m lines 100 to 118),
    (mean of normalised bins 34 to 39 minus mean of bins 6 to 11) / 2.8 s, on the M6 normalised
    PSTH; per neuron a two-tailed one-sample t-test over its 200 half slopes; population a
    two-tailed t-test of the per-neuron mean slopes against zero. Reproduced when all values are
    within tolerance; partially reproduced when the population slope is positive with p < 0.05
    and the neuron count is within tolerance but a class count is not.
- id: fig3-common-value-fit
  statement: A model with one convex value function shared across neurons and a discount factor,
    gain and baseline per neuron captures the diversity of ramping, with discount factors
    distributed as 0.42 +- 0.23 (mean +- s.d.).
  source: Results, Ramping heterogeneity and discounting, paragraph 4; Figure 3e, 3f, 3k and 3l
  quote: The heterogeneity of ramping activity across single neurons is explained (Fig. 3e,f) by a
    common convex value function (Fig. 3k) and a diversity of discount factors across single
    neurons (Fig. 3l)
  depends_on:
  - fig3b-vr-ramp-population
  expected:
  - quantity: mean discount factor over neurons
    value: 0.42
    tolerance: 0.042
    unit: per second
  - quantity: s.d. of discount factor over neurons
    value: 0.23
    tolerance: 0.023
    unit: per second
  criterion: Fit as M7 on M6. Reproduced when the mean and s.d. of the per-neuron gammas are within
    tolerance and the mean fitted value function is convex (its second difference positive over
    most of the last 4.3 s, judged on the mean over fits); partially reproduced when the value
    function is convex and the gammas spread over at least 0.2 to 0.8 but the summary is outside
    tolerance. The fit has random initial values; a standard seed is used and recorded.
- id: ed8b-slope-correlates-with-discount
  statement: The inferred VR discount factor and the ramp slope are strongly correlated (r = 0.81).
  source: Extended Data Fig. 8b
  quote: The inferred discount factor and the slope in spiking activity (see Fig. 3b) are strongly
    correlated (r = 0.81, P = 0, Spearman rank correlation, two-tailed t-test)
  statistics:
  - test: Spearman rank correlation, two-tailed t-test
    statistic: r = 0.81
    p: 0
    n: 90 neurons
  depends_on:
  - fig3b-vr-ramp-population
  - fig3-common-value-fit
  expected:
    quantity: Spearman r, VR gamma against slope
    value: 0.81
    tolerance: 0.081
  criterion: Per-neuron mean slope from fig3b-vr-ramp-population against per-neuron mean gamma from
    M7.
- id: ed7c-discount-not-related-to-ml-position
  statement: The VR discount factor is not correlated with the medio-lateral position of the
    implant (r = 0.015, P = 0.89).
  source: Results, Ramping heterogeneity and discounting, paragraph 4; Extended Data Fig. 7c
  quote: The discount factor inferred in the VR task is not correlated with the medio-lateral (ML)
    position of the implant (Pearson’s r = 0.015, P = 0.89, two-tailed t-test)
  statistics:
  - test: Pearson correlation, two-tailed t-test
    statistic: r = 0.015
    p: 0.89
    n: 90 neurons
  depends_on:
  - fig3-common-value-fit
  criterion: A claim of absence, judged on the paper's test, Pearson correlation of per-neuron mean
    gamma (M7) with the unit's ML position, two-tailed, p < 0.05 counts as an effect (code
    VR_Figures_Revision.m line 546). Reproduced when p >= 0.05; r is reported.
- id: ed9g-models-agree
  statement: Discount factors from the common value model and the common reward expectation model
    are strongly correlated across neurons (rho = 0.93).
  source: Results, Ramping heterogeneity and discounting, paragraph 4; Extended Data Fig. 9g
  quote: the inferred discount factors are strongly correlated for single neurons (Spearman’s ρ =
    0.93, P < 1.0 x 10−20, two-tailed t-test)
  statistics:
  - test: Spearman correlation, two-tailed t-test
    statistic: rho = 0.93
    p: 1.0e-20
    p_relation: "<"
    n: 90 neurons
  depends_on:
  - fig3-common-value-fit
  expected:
    quantity: Spearman rho between the two models' gammas
    value: 0.93
    tolerance: 0.093
  criterion: The common reward expectation model as Methods eq. 28 to 31 with the code
    Master_Script_Folded_All_ValCon.m, Cost_VR_FoldedNormal_All.m, FoldedNormal.m and
    ValueConstraint.m (mean value across neurons at most 2 at each bin; reward horizon 10 s),
    fitted to the same bootstraps as M7; Spearman correlation of the per-neuron mean gammas.
- id: fig4a-discount-correlated-across-tasks
  statement: For the 43 neurons recorded in both tasks, the discount factors inferred in the VR task
    and the cued delay task are correlated (Spearman r = 0.45, P = 0.0013).
  source: Results, Correlated discount factors across tasks, paragraph 2; Figure 4a
  quote: Correlation across neurons between the discount factors inferred in the VR task and the
    discount factors inferred in the cued delay task (r = 0.45, P = 0.0013, Spearman’s rank
    correlation, one-tailed t-test)
  statistics:
  - test: Spearman's rank correlation, one-tailed t-test
    statistic: r = 0.45
    p: 0.0013
    n: 43 neurons
  depends_on:
  - cued-delay-neurons
  - fig3-common-value-fit
  expected:
  - quantity: neurons in both tasks
    value: 43
    tolerance: 4.3
  - quantity: Spearman r
    value: 0.45
    tolerance: 0.045
  criterion: M8 on the mean gammas of M2 and M7. Reproduced when the neuron count and r are within
    tolerance and the one-tailed p < 0.05; partially reproduced when r > 0 with p < 0.05 but
    outside tolerance.
- id: fig4b-bootstrap-correlation
  statement: Correlations between the two tasks' discount factors over random pairs of bootstrap
    estimates are positive, 0.34 +- 0.104 (mean +- s.d.).
  source: Figure 4b
  quote: Distribution of Spearman’s rank correlation correlations between the discount factors
    across the two tasks for randomly sampled pairs of bootstrap estimates (0.34 ± 0.104, mean ±
    s.d., P < 1.0 x 10−30, one-tailed t-test)
  statistics:
  - test: one-tailed t-test
    p: 1.0e-30
    p_relation: "<"
  depends_on:
  - fig4a-discount-correlated-across-tasks
  expected:
  - quantity: mean bootstrap Spearman r
    value: 0.34
    tolerance: 0.034
  - quantity: s.d. of bootstrap Spearman r
    value: 0.104
    tolerance: 0.0104
  criterion: M8 bootstrap, each pair one random half-fit of the VR model and one of the cued delay
    model (code draws a bootstrap index from 1 to 100 into the first 100 rows of GamAll, that is
    the first halves only; the Methods say "pairs of bootstraps"). Readings are (a) the code's draw,
    (b) a draw over all 200 half-fits of each task; 10,000 pairs as the Methods say, 100,000 as a
    variant. The t-test is a one-sample one-tailed test of the correlations against zero (the
    paper does not name the null; zero is the only one the legend allows). Reproduced when, under
    one reading, mean and s.d. are within tolerance and p < 0.05.
- id: ed10-cross-task-decoding
  statement: Reward timing in the cued delay task can be decoded with the discount factors inferred
    in the VR task, better than shuffle for the 1.5, 3.75 and 9.375 s delays.
  source: Results, Correlated discount factors across tasks, paragraph 2; Extended Data Fig. 10c-d
  quote: we were able to decode subjective reward timing from population cue responses using the
    discount matrix built from the discount factors inferred in the virtual reality task
  statistics:
  - about: 0.6 s
    test: one-tailed Wilcoxon signed rank test
    p: 1
  - about: 1.5 s
    test: one-tailed Wilcoxon signed rank test
    p: 1.1e-20
    p_relation: "<"
  - about: 3.75 s
    test: one-tailed Wilcoxon signed rank test
    p: 3.8e-20
    p_relation: "<"
  - about: 9.375 s
    test: one-tailed Wilcoxon signed rank test
    p: 2.9e-5
    p_relation: "<"
  depends_on:
  - fig4a-discount-correlated-across-tasks
  criterion: M4 on the 43 neurons of both tasks, with the discount matrix built from each VR
    bootstrap estimate (M7) and the cued delay responses and baselines (code
    Tuning_Figures_Revision.m lines 424 to 617). Reproduced when, under one reading of M4, data
    beat shuffle at p < 0.05 for 1.5, 3.75 and 9.375 s.
