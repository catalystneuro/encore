- id: fig2k-reward-timing-decoded
  statement: Reward timing can be decoded from the population cue responses with a regularised
    inverse of the discount matrix, and decoding is better than with neuron identities shuffled
    (P = 1.2 x 10-4 at 0.6 s, P < 10-20 for the other delays).
  source: Results, Discounting across dopamine neurons, paragraph 5; Figure 2k; Extended Data Fig.
    4f-g
  quote: Remarkably, the decoder was able to predict reward timing, closely matching the true reward
    delay (Fig. 2k, top row). This prediction was lost if we shuffled the neuron identities
  statistics:
  - about: 0.6 s delay, data against shuffle
    test: one-tailed Wilcoxon signed rank test
    p: 1.2e-4
    n: 200 bootstrap decodings
  - about: 1.5, 3.75 and 9.375 s delays, data against shuffle
    test: one-tailed Wilcoxon signed rank test
    p: 1.0e-20
    p_relation: "<"
    n: 200 bootstrap decodings
  depends_on:
  - cued-delay-neurons
  criterion: Decoding and test as M4, under readings (a) and (b) of the number of components.
    Reproduced when, under one reading, the Wasserstein distance is smaller for data than for
