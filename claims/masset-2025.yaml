# Claims for Masset, Tano, Kim, Malik, Pouget & Uchida (2025), Nature 642:682-690, "Multi-timescale
# reinforcement learning in the brain", tested on dandiset 000251 (relation reuses).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-20,
# protocol pilot-18 as stated in docs/protocol.md. The writer did not look at the dandiset's data
# or files; only its title and description on the archive were read.
#
# Text read: paper/10.1038-s41586-025-08929-9.txt. Its header says "version of record", but the
# body is the accepted author manuscript in PubMed Central (PMC13254605, NIHMS2174924): main text,
# figure legends, Methods, Extended Data Figure legends 1 to 10, Data and Code availability. The
# paper has no supplement beyond the Extended Data, whose legends are all in the text. The text
# drops inline equations and symbols ("mice (, see Extended Data Fig. 10e)", "Using this
# approach, we used in our decoding analysis"); where a dropped value matters, the code below
# gives it and the claim says so. No PDF was available and none was opened.
#
# Code read.
# (1) Analysis code, Mendeley Data doi:10.17632/tc43t3s7c5.1 (version 1, published 2025-04-09),
#     the MATLAB scripts only: Olfaction_Script.m (cued delay fits), Olfaction_Figure_Revision.m
#     (Fig. 2, Extended Data Figs 3 to 6), Master_Script_SingleValue_All_gain.m with
#     Cost_VR_SingleValue_Norm_All_gain.m (common value model, Fig. 3), Master_Script_Folded_All_
#     ValCon.m (common reward expectation model), VR_Figures_Revision.m (Fig. 3, Extended Data
#     Figs 7 to 9), Tuning_Figures_Revision.m (Fig. 4, Extended Data Fig. 10), LickPSTHs_Revision.m,
#     Discount_Behavior_Revision.m, VR_Behavior_Revision.m and the simulation-for-recovery scripts.
#     The scripts load curated .mat and .h5 files from the same deposit (CellValuesArray.mat with
#     per-trial cue responses and delays, FinalAverageArray.mat with PSTHs, Valid_S.mat with the
#     flags Valid.OdorNew and Valid.VR that mark the neurons used); those data files were not
#     opened. Helper functions DecodeTime, rsquare, hist2samples, ExpResponse, HypResponse,
#     compute_psth and ws_distance are called but not in the deposit (ws_distance is the
#     github.com/nklb/wasserstein-distance function the Methods name).
# (2) Simulation code, github.com/pablotano8/multi_timescale_RL at commit 37f11c6 (2023-12-01),
#     Python scripts for Fig. 1 and Extended Data Figs 1 and 2 (TD learning with several
#     discounts, policy gradient decoders, myopic bias MDP, grid-world maze, Lunar Lander DQN).
#     The file names follow the preprint's figure numbers (Fig_2_c_d_e is Fig. 1 here).
# Where the Methods are silent and the code settles a detail, the claim says so (cited as code,
# with the script); where they disagree, the Methods decide and the code's choice is a variant.
#
# Data the paper used (all collected for Kim et al. 2020, Cell 183:1600, ref 44, which the dandiset
# description names). 13 adult male DAT-Cre mice, all in the VR task, 8 also in the cued delay
# task. Single units recorded with tetrode microdrives in the VTA; dopamine neurons identified
# optogenetically (SALT). Units with medio-lateral position above 900 um excluded (SNc).
# - Cued delay task. Head-fixed on a wheel; a green screen flash starts the trial; 1.25 s later
#   one of four odors predicts water after 0.6, 1.5, 3.75 or 9.375 s; trial starts 17 to 20 s
#   apart; 81.4 +- 12.5 trials per session over 36 sessions; 78 neurons recorded, 50 analysed.
#   Variables: spike times, trial start, odor onset and identity (delay), reward, licks.
# - Approach-to-target VR task, open loop, sessions without teleport or speed manipulation: a
#   linear track moves at constant speed and reward comes 7.35 s after scene motion onset;
#   58.8 +- 21.7 trials per session over 60 sessions; 90 neurons analysed. Variables: spike
#   times, scene motion onset, reward, licks, condition labels (to exclude teleport and speed
#   trials and closed-loop sessions).
# - 43 neurons were recorded in both tasks on the same day.
# - Per-unit medio-lateral position of the implant and the mouse identity (m3044 and m3054 are
#   named) are used.
#
# Outside material. The curated per-neuron arrays and the selection flags (Valid_S.mat) are in the
# Mendeley deposit above; a claim that needs the paper's own neuron list may use them as labels
# where the author can match them to the dandiset's units. Fig. 1 and Extended Data Figs 1, 2 and
# 7f-k are simulations (data elsewhere, generated by the code in (2) or, for the mixing model,
# by code not found in either deposit).
#
# Method shared by the claims (M1 to M8), from the Methods unless marked.
# M1. Cue response (cued delay). Firing rate from 0.1 to 0.4 s after odor onset, per trial (Fig.
#     2c legend). Whether the rate is baseline-subtracted is not stated; the fit has its own
#     baseline term, so the raw rate is the reading (code fits CellValues{:,1}, a precomputed
#     per-trial rate).
# M2. Fits per neuron (Methods, Fitting neural activity in the cued delay task; code
#     Olfaction_Script.m). Exponential r = a + b exp(c t), discount factor gamma = exp(c), per
#     second; hyperbolic r = a + b / (1 + k t). Least squares on single trials (MATLAB fit),
#     bounds a, b in [0, 50], c in [-20, -0.0001], k in [0, 20]; start points [1, 1, -3e-4] and
#     [1, 1, 1]. 100 bootstraps, each a random split of the trials in halves, each half fitted;
#     a neuron's parameter is the mean over the 200 half-fits. Held-out R2 is the fit of one
#     half scored on the other half's trials.
# M3. Selection, cued delay (Methods; code Olfaction_Figure_Revision.m line 122). Positive mean
#     held-out R2 of the exponential model, mean over the four delays of the per-delay mean cue
#     response above 2 spikes/s, ML position below 900 um, among optogenetically identified
#     dopamine neurons recorded in the task (Valid.OdorNew, definition not in the code). The
#     paper's exclusion counts disagree with each other (17 + 11 + 4 = 32 removed from 78 in the
#     Methods, but 50 kept; 23 non-selected in Extended Data Fig. 3b; 13 negative R2 in Extended
#     Data Fig. 3c). The criterion is applied as written and the count compared with 50.
# M4. Decoding of reward timing (Methods, Decoding expected reward timing; code
#     Olfaction_Figure_Revision.m lines 546 to 626). Discount matrix gamma_i^t on t = 0 to 12 s
#     in 120 points (dt 0.1 s), from one half's fitted gammas; responses of the other half,
#     minus the first half's baseline, each neuron scaled so its maximum over delays is 1;
#     regularised SVD inverse with Tikhonov parameter alpha = 2 (code; Extended Data Fig. 4b
#     "black line at 2"); negative predictions set to 0 and normalised to sum 1. DecodeTime is
#     not in the deposit, so how many singular components enter the main decoder is open: (a)
#     all of them, as in Eq. 21-22; (b) the first 12, as the code's average-discount SVD and
#     Extended Data Fig. 4d use. Shuffle control permutes neurons in the test responses. 200
#     decodings (100 bootstraps x 2 directions). Accuracy is the 1-Wasserstein distance from
#     100,000 samples of the predicted distribution to the true delay (code places the true
#     delay at grid indices 7, 16, 38, 95); comparisons by one-tailed Wilcoxon signed-rank
#     tests (MATLAB signrank, tail left) over the 200 decodings.
# M5. Single-discount decoder (Methods eq. 23, garbled in the text; code lines 600 to 609). With
#     the population mean gamma, each neuron's held-out response gives t = log((r - a) / b) /
#     log(gamma) (the ratio floored at 0.0001), histogrammed on the 0 to 12 s grid, the last bin
#     zeroed, normalised.
# M6. VR PSTHs (Methods, Fitting neural activity in the VR task; code
#     Master_Script_SingleValue_All_gain.m). Trial-averaged rate at 10 ms, the last 4.30 s before
#     reward (3.05 to 7.35 s after scene motion onset) in 43 bins of 0.1 s; neurons with mean rate
#     above 2 spikes/s over that window and ML below 900 um, among the identified dopamine neurons
#     of the open-loop sessions (Valid.VR); 100 bootstraps of random half-splits of trials.
#     Normalised PSTH (code VR_normpsth) subtracts the mean of the first 15 bins and divides by
#     the s.d. over all 43 bins (Methods, "modified z-score").
# M7. Common value function model (Methods eq. 25 to 27; code Cost_VR_SingleValue_Norm_All_gain.m).
#     delta_i(t) = b_i + a_i (dV/dt + ln(gamma_i) V(t)), V shared across neurons and free at each
#     bin, dV/dt by first difference, fitted to the raw binned PSTHs (VR_binpsth) by fmincon
#     (interior point, MaxIter 2000, TolFun 1e-5) minimising the root of the summed squared error;
#     bounds gamma in [0.05, 0.999999], b in [0.05, 12], a in [0.05, 50], V in [0.001, 1];
#     initial V linear from 0.05 to 1, initial gamma 0.1 + 0.8 U(0,1), b and a 3 U(0,1). Each half
#     of each bootstrap fitted; a neuron's gamma is the mean over the 200 fits.
# M8. Cross-task comparison (Methods, Comparing parameters across tasks; code
#     Tuning_Figures_Revision.m). Neurons that pass both M3 and M6; Spearman correlation of the mean
#     gammas, one-tailed (Tail right); bootstrap distribution from random pairs of half-fit
#     estimates, 10,000 pairs in the Methods and 100,000 in the code (variant).
schema_version: 2
paper: doi:10.1038/s41586-025-08929-9
claims:
- id: fig1f-multi-timescale-advantage
  statement: In simulations of a linear maze, agents learning values with three discount factors
    (0.6, 0.9, 0.99) report reward timing independently of magnitude, the hyperbolic value of the
    cue, reward timing before convergence and the true value under noisy rewards more accurately
    than agents with one or two discount factors.
  source: Results, Advantages of multi-timescale RL, Tasks 1 to 4; Figure 1e-f; Extended Data Fig. 1
  quote: Our result shows that only multi-timescale systems can reliably report the hyperbolic value
    of the cue given a diversity of exponential ones
  data: elsewhere
  where: Not deposited; generated by the paper's simulation code, github.com/pablotano8/multi_timescale_RL
    at commit 37f11c6 (Fig_2_c_d_e.py)
  criterion: Run as the Methods (Decoding Tasks) and the script set it, 2,000 training episodes,
    accuracy over 100 test episodes and 3 trained networks. The accuracies are shown only in Fig.
    1f, so the claim is judged by order. Reproduced when the three-discount agent has the highest
    mean accuracy in all four tasks; partially reproduced in two or three tasks.
- id: mixing-model-accuracy
  statement: With a small degree of shared value across discounts, the three-discount agent keeps
    its accuracy, 82, 94, 92 and 93% in Tasks 1 to 4.
  source: Methods, Mixing in distributed RL models, paragraph 3
  quote: the accuracy of the report of the agent with three discounts {0.6,0.9,0.99} is 82 ± 5% in
    Task 1, 94 ± 2% in Task 2, 92 ± 3% in Task 3 and 93 ± 3% in Task 4
  data: elsewhere
  where: Not deposited; the sharing modification of eq. 32-33 is not in github.com/pablotano8/multi_timescale_RL
    at commit 37f11c6, and its sharing parameter is lost from the text
  expected:
  - quantity: Task 1 accuracy
    value: 82
    tolerance: 5
    unit: percent
  - quantity: Task 2 accuracy
    value: 94
    tolerance: 2
    unit: percent
  - quantity: Task 3 accuracy
    value: 92
    tolerance: 3
    unit: percent
  - quantity: Task 4 accuracy
    value: 93
    tolerance: 3
    unit: percent
- id: ed2e-branching-myopic-bias
  statement: In a branching MDP learned from three trajectories, a two-discount agent with
    discounts 0.6 and 0.99 reaches 94% correct, more than single-discount agents (77% with 0.6,
    83% with 0.99).
  source: Methods, Myopic learning bias, branching task, paragraph 3; Extended Data Fig. 2e
  quote: For the single-discount agent, we report the maximum performance over the agents with
    discounts [0.6,0.6] and [0.99,0.99], which achieve a performance of 77±2% and 83±1% respectively.
    For the multi-discount agent, we use the discounts [0.6,0.99], which achieves a performance of
    94±1%
  data: elsewhere
  where: Not deposited; generated by the paper's simulation code, github.com/pablotano8/multi_timescale_RL
    at commit 37f11c6 (Fig_2_f_myopic_mdp.py)
  expected:
  - quantity: accuracy, discounts 0.6 and 0.6
    value: 77
    tolerance: 2
    unit: percent
  - quantity: accuracy, discounts 0.99 and 0.99
    value: 83
    tolerance: 1
    unit: percent
  - quantity: accuracy, discounts 0.6 and 0.99
    value: 94
    tolerance: 1
    unit: percent
- id: ed2-myopic-bias-maze-lunar
  statement: Myopic value estimates are more accurate near important events and far-sighted ones
    far from them, in a grid-world maze learned from two trajectories and in the auxiliary
    Q-values of a DQN trained on Lunar Lander.
  source: Methods, Myopic learning bias, grid world and auxiliary tasks; Extended Data Fig. 2h and 2l
  quote: Q-values computed using a myopic discount provide a more accurate representation of the
    future when the agent is close to the landing site (blue in Extended Data Fig. 2k), whereas the
    opposite holds when the agent is far from the landing site
  data: elsewhere
  where: Not deposited; generated by the paper's simulation code, github.com/pablotano8/multi_timescale_RL
    at commit 37f11c6 (Ext_Fig_3_myopic_bias_maze.py, Fig_2_g_train_lunar_multi_gamma.py,
    Fig_2_g_lunar_q_accuracy.py)
  criterion: Kendall rank correlation between estimated and true values as a function of the
    discount, as the Methods set it (10,000 sets of two trajectories for the maze; 10 networks,
    25,000 states for Lunar Lander). Reproduced when, in both settings, the discount with the
    highest accuracy is lower for the near group (lower half of the maze; close to the landing
    site) than for the far group.
- id: cued-delay-neurons
  statement: Of 78 optogenetically identified VTA dopamine neurons recorded in the cued delay task,
    50 pass the selection criteria.
  source: Results, Discounting across dopamine neurons, paragraph 2; Methods, Fitting neural activity
    in the cued delay task, paragraph 4
  quote: We recorded optogenetically identified single dopamine neurons in the ventral tegmental
    area (VTA) (n = 78, see Methods). We focused our analysis on neurons (n = 50) who passed the
    selection criteria
  expected:
  - quantity: neurons recorded in the cued delay task
    value: 78
    tolerance: 7.8
  - quantity: neurons selected
    value: 50
    tolerance: 5
  criterion: The selection is M3 on the fits of M1 and M2. The identified neurons are the units the
    dandiset marks as optogenetically identified dopamine neurons; the SALT threshold is not given
    in this paper (it is Kim et al. 2020's), so the dandiset's own marking is used, and the
    Mendeley flags (Valid.OdorNew) are a variant where they can be matched. The paper's exclusion
    counts (17, 11, 4) disagree with 78 minus 50; the counts found at each step are reported.
- id: session-trial-counts
  statement: Mice performed 81.4 +- 12.5 trials per session across 36 cued delay sessions and
    58.8 +- 21.7 trials per session across 60 VR sessions with recorded neurons.
  source: Methods, Cued delay task, paragraph 2; Methods, Approach-to-target virtual reality task,
    paragraph 3
  quote: Mice performed 81.4 ± 12.5 trials (mean ± s.d.) per session across the 36 sessions in which
    neurons were recorded in the task ... Mice performed 58.8 ± 21.7 trials (mean ± s.d.) per session
    across the 60 sessions in which neurons were recorded in the task
  expected:
  - quantity: cued delay sessions
    value: 36
    tolerance: 3.6
  - quantity: cued delay trials per session, mean
    value: 81.4
    tolerance: 8.14
  - quantity: VR sessions
    value: 60
    tolerance: 6
  - quantity: VR trials per session, mean
    value: 58.8
    tolerance: 5.88
  criterion: Sessions with at least one neuron of the analysed set (M3 for the cued delay task, M6
    for VR). Readings, as the text allows, for VR trials are (a) open-loop trials without teleport
    or speed manipulation only, (b) all trials of those sessions; for the cued delay task, (a)
    trials of the four odor cues, (b) all trials. Reproduced when the counts and means are within
    tolerance under one reading.
- id: fig2b-anticipatory-licking
  statement: Mice lick in anticipation of reward, and the onset of anticipatory licking is later
    for cues predicting longer delays.
  source: Results, Discounting across dopamine neurons, paragraph 1; Figure 2b
  quote: Importantly, the onset of the anticipatory licking was delayed for trials with cues
    predicting longer reward delays, indicating that the mice learned the delay contingencies
  criterion: The paper gives no test and no definition of onset. Lick rate per delay in 200 ms bins
    from -2 to 12 s around the odor (code LickPSTHs_Revision.m), averaged over the sessions of the
    analysed neurons. Onset is open; readings (a) the first bin after the odor at which the lick
    rate exceeds the pre-cue mean by half of its rise to the pre-reward maximum, (b) the first
    bin exceeding the pre-cue mean by 2 s.d. of the pre-cue bins. Reproduced when, under one
    reading, onset increases with delay across the four cues (ties between the two shortest
    delays allowed, since 0.6 s is three bins).
- id: fig2c-mean-cue-response-decreases
  statement: The average cue response of the population decreases as the predicted reward delay
    increases.
  source: Results, Discounting across dopamine neurons, paragraph 2; Figure 2c
  quote: the average responses to the reward cue decreased as the predicted reward timing
    increased
  depends_on:
  - cued-delay-neurons
  criterion: Cue response as M1, averaged over trials per neuron and delay, then over the 50
    neurons. No test is reported. Reproduced when the population mean falls monotonically from 0.6
    to 9.375 s; partially reproduced when it falls from the shortest to the longest delay with one
    inversion.
- id: fig2f-exponential-better-than-hyperbolic
  statement: Across neurons, the exponential discount model fits held-out cue responses better than
    the hyperbolic model (P = 2.2 x 10-5).
  source: Results, Discounting across dopamine neurons, paragraph 3; Figure 2f; Extended Data Fig.
    3c-e
  quote: The exponential model provided a better fit to the neurons’ responses than the hyperbolic
    model (P = 2.2 x 10−5, two-tailed t-test, comparing the distribution across neurons of the mean
    (across bootstraps) difference in R2 between the two fits
  statistics:
  - test: two-tailed t-test
    p: 2.2e-5
    n: 50 neurons
  depends_on:
  - cued-delay-neurons
  criterion: M1 and M2; per neuron, the mean over the 200 half-fits of held-out R2 for each model
    (R2 as 1 minus residual over total sum of squares on the held-out trials, the usual rsquare,
    which is not in the deposit); a one-sample two-tailed t-test across the 50 neurons of the
    exponential minus hyperbolic difference (code ttest on DistCue, which divides the difference
    by sqrt(2), with no effect on the test). Reproduced when the mean difference is positive and
    p < 0.05; the p-value is compared with 2.2e-5.
- id: fig2g-discount-factor-distribution
  statement: Inferred discount factors are widely distributed across neurons, 0.56 +- 0.21 (mean
    +- s.d.).
  source: Results, Discounting across dopamine neurons, paragraph 3; Figure 2g
  quote: This view is consistent with the wide distribution of inferred discount factors obtained
    across the population (0.56 ± 0.21 s−1, mean ± s.d., Fig. 2g)
  depends_on:
  - cued-delay-neurons
  expected:
  - quantity: mean discount factor over neurons
    value: 0.56
    tolerance: 0.056
    unit: per second
  - quantity: s.d. of discount factor over neurons
    value: 0.21
    tolerance: 0.021
    unit: per second
  criterion: Each neuron's gamma is the mean over its 200 half-fits (M2; Fig. 2g legend "mean
    discount factor across bootstraps"), over the 50 neurons of M3. The s.d. is the sample s.d.
    (MATLAB std).
