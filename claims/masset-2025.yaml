    p: 1.0e-20
    p_relation: "<"
  - about: baseline
    test: Pearson correlation, highest p over bootstraps
    p: 1.0e-32
    p_relation: "<"
  - about: discount factor
    test: Pearson correlation, highest p over bootstraps
    p: 1.0e-46
    p_relation: "<"
  depends_on:
  - cued-delay-neurons
  expected:
  - quantity: mean split-half correlation, gain
    value: 0.84
    tolerance: 0.084
  - quantity: mean split-half correlation, baseline
    value: 0.9
    tolerance: 0.09
  - quantity: mean split-half correlation, discount factor
    value: 0.93
    tolerance: 0.093
  criterion: Per bootstrap, Pearson correlation across neurons between the two halves' fitted
