- id: fig6c-spike-pwc-narrower-than-strf-pwc
  statement: For pairs of neurons in the same cNE, spike train PWCs were much narrower than the
    PWCs of their STRFs' temporal profiles, while for pairs not in the same cNE the spike train
    PWCs were often as wide as the STRF PWCs.
  source: Results, Synchrony between cNE members cannot be fully explained by receptive field
    overlap, paragraph 1; Figure 6A to F
  quote: Comparing STRF PWCs to spike train PWCs ( Figure 6A–6F ) revealed that the spike train
    PWCs ( Figure 6C , histogram) were much narrower than the STRF PWCs ( Figure 6C , solid line)
    for neuronal pairs within the same cNE. In contrast, for non-cNE pairs, the spike train PWCs
    were often as wide as the STRF PWCs
  depends_on:
  - fig6j-sharpness-cne-pairs
  criterion: The paper shows one example of each kind and reports no population test. The STRF
    temporal profile is the STRF averaged over frequency at each delay (Figure 6B, E legend); the
    STRF PWC is the cross-correlation of the two profiles; its sharpness is measured as for spike
    PWCs. Read over all pairs of the 16 penetrations, the claim holds when the spike PWC is
    sharper than the STRF PWC for more than half of cNE pairs, and the ratio of spike to STRF PWC
    sharpness is lower for cNE pairs than for non-cNE pairs (Mann-Whitney U, p < 0.05, the test
    of Figure 6J). "Most" and the ratio comparison are readings of "much narrower" and "often as
    wide", not the paper's.
