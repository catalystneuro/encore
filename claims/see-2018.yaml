- id: fig7e-no-depth-bias
  statement: cNEs and their member neurons were found across the whole explored depth with no bias
    to any depth; the depths of cNE members and of all recorded neurons were similarly
    distributed.
  source: Results, cNEs are not depth-biased and reflect local circuitry, paragraph 1; Figure 7E
