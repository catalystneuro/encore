  expected:
  - quantity: median MI ratio, cNE over neuron
    value: 1.11
    tolerance: 0.13
  - quantity: cNE and member neuron pairs
    value: 330
    tolerance: 33
  criterion: Method from Materials and methods, MI analysis on 5-s repeats. Trials by 10-ms bins;
