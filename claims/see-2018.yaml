- id: fig9c-cne-events-more-mi
  statement: Over 50 repeats of a 5-s stimulus, cNE events carried about 10% more mutual
    information than the spikes of each member neuron; the median cNE/neuron MI ratio was 1.11
    +/- 0.13 (median absolute deviation), significantly above 1.
  source: Results, cNEs show enhanced information processing, paragraph 1; Figure 9C, D;
    Supplementary file 1
  quote: the MI conveyed by cNE events was, accordingly, ~10% higher than the MI of each member
    neuron (p < 0.001, Wilcoxon signed-rank test; Figure 9C ). Correspondingly, the ratio of the
