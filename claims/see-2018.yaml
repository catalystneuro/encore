  statistics:
  - test: Wilcoxon signed-rank test
    p: 1.62e-37
    n: 703 cNE and member neuron pairs
  criterion: STRFs by event- or spike-triggered average of the 10-min stimulus, after subsampling
    the larger train to equal counts; PTD is the highest minus the lowest STRF value divided by
    the number of spikes or events (legend B). The STRF window and the subsampling seed are
    standard choices, stated. Under both event readings. Reproduced when p < 0.001 with cNE PTD
    higher under one reading; the number of pairs is reported against 703.
- id: fig10c-strf-mi-higher
  statement: cNEs had higher mutual information between their STRFs and single events than member
    neurons had between their STRFs and single spikes.
  source: Results, cNEs show enhanced information processing, paragraph 4; Figure 10C;
    Supplementary file 1
  quote: and MI (p < 0.001, Wilcoxon signed-rank test; Figure 10C )
  statistics:
  - test: Wilcoxon signed-rank test
    p: 1.60e-59
    n: 703 cNE and member neuron pairs
  depends_on:
  - fig10b-ptd-higher
  criterion: STRF MI as in fig5a-mi-peaks-10-15ms (projection distributions, extrapolation over
