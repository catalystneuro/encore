# Claims for See, Atencio, Sohal & Schreiner (2018), eLife 7, e35587, on CRCNS ac-3.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-11,
# protocol pilot-14 as stated in docs/protocol.md. The writer did not look at the dataset's data or
# files; only its description on crcns.org (paper/ac-3.data-description.txt) was read, for what
# the dataset is meant to hold.
#
# Text read: the version of record (PMC6017807, Europe PMC full-text XML, flattened), with its
# figure legends, figure supplement legends and Materials and methods; and Supplementary file 1
# (elife-35587-supp1-v2.xlsx, the table of statistical tests with test, N and exact p for each
# panel), which the text file reproduces at its end. No PDF was supplied; every value used here is
# printed in the text, a legend or Supplementary file 1. Figure axes were not read.
#
# Code read: the paper links one repository, the dichotomized Gaussian (DG) implementation of
# Macke et al., https://github.com/mackelab/CorBinian, read at commit 8ebb12d (2021-07-26; the
# paper cites the 2017 state, which is not pinned). It holds the DG fit (findLatentGaussian01.m)
# and sampler (sampleDichGauss01.m) for binary vectors with given means and covariances. The
# paper's own analysis code (MATLAB) is not linked; the PCA/ICA code was supplied privately by
# Lopes-dos-Santos (Acknowledgements). The dataset's sample STRF code is the dataset's, not the
# paper's, and was not read.
#
# Data the paper used. Female Sprague-Dawley rats, 2 to 3 months, ketamine/xylazine anesthesia.
# Right primary auditory cortex (AI), penetrations perpendicular to the surface.
# - 16 columnar penetrations with a 32-channel probe (NeuroNexus a1x32-poly3, to about 800 um),
#   20 kHz, Bayesian spike sorting; 655 single units in total. Stimulus a 10-min continuous
#   dynamic moving ripple (DMR) or ripple noise (RN, the sum of 16 DMRs), 500 Hz to 40 kHz. Each
#   penetration used one of the two stimuli. These give Figures 1 to 7, 9, 10 and 11C to F.
# - 5-s frozen segments of DMR or RN, repeated 50 times with 0.5 s silence (Figures 9 and its
#   supplements; 330 cNE and neuron pairs in Figure 9C).
# - 15 repetitions of the 10-min RN stimulus, from which 24 units with stable rates were kept
#   (Figure 11A, B; also the 'repeat' CR of Figure 11E, F).
# - 8 recordings with a 64-channel probe (Cambridge NeuroTech H3, to about 1400 um), MountainSort,
#   with contiguous epochs of spontaneous activity and DMR-evoked activity (Figure 8).
# Measured variables are spike times per unit, the channel position and depth of each unit, the
# stimulus envelopes and the triggers. The dataset descriptor (version 0.6, March 2018) lists unit
# spike times with channel, depth and position, triggers, and the rn1 and rn16 stimulus matrices;
# which of the experiments above it holds is the author's to find.
#
# The cNE detection used throughout ("cNE detection" in the criteria), from Materials and methods,
# Detection of coordinated neuronal ensembles, and Results, Identification of cNEs. Spikes binned
# at 10 ms, each unit's binned train z-scored; PCA of the correlation matrix; eigenvalues above
# the upper Marcenko-Pastur bound are significant and their number is the number of cNEs; fastICA
# (negentropy) on the significant eigenvectors gives one IC per cNE; cNE activity is the
# projection of the IC onto the z-scored spike matrix. Membership is an IC weight beyond 1.5 SD
# above or below the mean of the distribution of IC weights from 100 independently circularly
# shuffled spike matrices (ICA run on the N largest eigenvectors of each, N the number found in
# the real data). A cNE is active where its activity exceeds the 99.9th percentile of the
# activity of the real ICs projected onto the shuffled matrices.
# Details of the detection the paper does not fix, with the readings it allows.
# - The Marcenko-Pastur upper bound is taken as (1 + sqrt(n/T))^2 for n units and T bins, the
#   standard bound of Lopes-dos-Santos et al. (2013) for z-scored data; the paper names only the
#   distribution.
# - IC scale and sign are open. Readings (a) each IC scaled to unit length and its sign set so the
#   largest absolute weight is positive, as in Lopes-dos-Santos et al. (2013); (b) ICs as fastICA
#   returns them, unit length, sign unchanged. The sign matters for the negative-weight count.
# - The activity projection is open. Readings (a) the quadratic form z(t)' P z(t) with P the outer
#   product of the IC and its diagonal set to zero, as in Lopes-dos-Santos et al. (2013); (b) the
#   linear projection w . z(t).
# - fastICA settings (nonlinearity, initial values, iterations) and the shuffle seeds are standard
#   choices; the paper names only fastICA based on negentropy.
# - What a cNE event is, once activity crosses threshold, is open. Readings (a) every 10-ms bin
#   above threshold; (b) one event per contiguous run of bins above threshold, at its peak.
schema_version: 2
paper: doi:10.7554/elife.35587
claims:
- id: fig2bd-pwc-measures-covary
  statement: Across all penetrations, the sharpness and peak delay of pairwise correlation (PWC)
    functions covaried with the pairs' spike train correlation coefficients, accounting for about
    50% of the variance.
  source: Results, Heterogeneous functional connectivity between columnar AI neurons, paragraph 2;
    Figure 2B to D
  quote: Across all penetrations, PWCs were fairly heterogeneous but sharpness and delay covaried
    with correlation coefficients, accounting for ~50% of the variance
  expected:
  - quantity: R2 of PWC sharpness against spike train correlation coefficient
    value: 0.5
    tolerance: 0.05
  - quantity: R2 of PWC peak delay against spike train correlation coefficient
    value: 0.5
    tolerance: 0.05
  criterion: All pairs of simultaneously recorded units in the 16 penetrations. The correlation
    coefficient is Pearson's correlation of the spike trains binned at 10 ms (Results, same
    paragraph). Peak delay is the absolute lag of the PWC maximum; sharpness is the half-count
    width of the PWC folded around its peak (Results, Synchrony between cNE members, paragraph
    2; Figure 6G to I legend). R2 is that of a least-squares line. Open, as the paper does not
    fix them, are the PWC lag bin and lag range, and the axes of the fit. Readings (a) 1-ms lag
    bins over plus or minus 50 ms; (b) 1-ms bins over plus or minus 100 ms; each with the fit on
    linear axes and on log axes. Reproduced when, under one reading, both R2 values are within
    tolerance; partially reproduced when one is.
- id: fig2eg-distance-weak
  statement: The correlation between the pairwise synchrony measures (sharpness, peak delay,
    correlation coefficient) and the distance between the pair's channels explained only about
    10 to 30% of the variance.
  source: Results, Heterogeneous functional connectivity between columnar AI neurons, paragraph
    3; Figure 2E to G
  quote: We observed similar trends in columnar recordings, although the correlation between these
    synchrony aspects and pairwise distance only explained ~10–30% of the total variance
  depends_on:
  - fig2bd-pwc-measures-covary
  expected:
    quantity: R2 of each synchrony measure against pairwise distance (range)
    value: 0.21
    tolerance: 0.12
  criterion: The three measures of fig2bd-pwc-measures-covary, each regressed on the pairwise
    distance across all pairs of the 16 penetrations. The claim is a range, so it holds when each
    R2 lies within 0.09 to 0.33 (10 to 30%, each bound widened by 10%); the expected entry above
    records the centre and half-width of that interval. Pairwise distance is open. Readings (a)
    the difference in depth ('position') between the two units' channels; (b) the Euclidean
    distance between the channels on the three-column probe layout. Under each PWC reading of
    fig2bd-pwc-measures-covary. Reproduced when all three R2 lie in the interval under one
    reading; partially reproduced when one or two do.
- id: fig4-example-nine-cnes
  statement: In an example columnar recording with 38 isolated neurons, the cNE detection found
    nine cNEs, with 2 to 6 member neurons each.
  source: Results, Identification of coordinated neuronal ensembles (cNEs), paragraph 2; Figure 4B
  quote: Applying this cNE detection algorithm to an actual AI columnar recording with 38 isolated
    neurons ( Figure 4D ), we identified nine separate cNEs ( Figure 4B ) with significantly
    contributing members ranging from 2 to 6 neurons
  expected:
  - quantity: number of cNEs in the 38-neuron penetration
    value: 9
    tolerance: 1
  - quantity: smallest cNE size
    value: 2
    tolerance: 0
  - quantity: largest cNE size
    value: 6
    tolerance: 1
  criterion: The penetration with 38 units, with cNE detection as in the opening comment. The
    tolerance on counts is one, 10% of a small integer rounded up; the smallest size of 2 is the
    least a cNE can have. If more than one penetration has 38 units, each is reported and the
    claim holds when one matches. Under each reading of IC scale and sign.
- id: fig4s2-interleaved-halves-stable
  statement: cNEs detected independently in two interleaved halves of a recording were the same,
    with about 96% of the ICs of one half having a significant match in the other.
  source: Results, Identification of coordinated neuronal ensembles (cNEs), paragraph 4; Figure
    4-figure supplement 2
  quote: Approximately 96% of independent components had significant matches ( Figure 4-figure
    supplement 2D and E ), indicating that the two interleaved parts of the recording contained
    the same independent components
  expected:
    quantity: percentage of ICs (of both halves) with a significant match
    value: 96
    tolerance: 9.6
    unit: '%'
  criterion: Each of the 16 recordings split into 10 equal parts, the odd parts forming half A and
    the even parts half B; cNE detection on each. IC A against IC B by the absolute correlation of
    their weights. The null distribution comes from spike trains circularly shuffled and run
    through the detection, its ICs correlated; the threshold is its 99th percentile, per
    penetration (Results, same paragraph; legend). Open, the paper does not fix them, are the
    number of shuffles, which ICs the shuffled ones are correlated with, and what counts as a
    match. Readings (a) 100 shuffles, as for membership, shuffled ICs of one half correlated with
    shuffled ICs of the other; (b) 100 shuffles, real ICs of one half correlated with shuffled
    ICs of the other; with a match being, for each IC, its largest absolute correlation with any
    IC of the other half above the threshold. The percentage pools IC As and IC Bs over all
    penetrations (legend E). Reproduced when one reading is within tolerance.
- id: fig4s3-train-test-83pct
  statement: cNEs detected in the first half of a recording predicted cNE activity in the second
    half; of 102 training cNEs, about 83% had significant matches to test cNE activity.
  source: Results, Identification of coordinated neuronal ensembles (cNEs), paragraph 5; Figure
    4-figure supplement 3E
  quote: Across all penetrations, approximately 83% of training cNE activity had significant
    matches to test cNE activity
  expected:
  - quantity: number of training cNEs, all penetrations
    value: 102
    tolerance: 10.2
  - quantity: percentage of training cNEs with a significant match
    value: 83
    tolerance: 8.3
    unit: '%'
  criterion: Each recording split into a first half (training) and second half (test); cNE
    detection on each; both sets of ICs projected onto the test half to give training and test
    activities, which are correlated pairwise. For each training cNE the largest correlation is
    its matched correlation; all other correlations of all penetrations pooled form the null, and
    its 95th percentile is the threshold (Results, same paragraph; legend C). Under each reading
    of the activity projection. Reproduced when both values are within tolerance under one
    reading; partially reproduced when the percentage is and the count is not.
- id: fig5a-mi-peaks-10-15ms
  statement: The mutual information between cNE STRFs and the stimulus peaked at bin sizes of
    about 10 to 15 ms.
  source: Results, cNE identity is dependent on time bin size, paragraph 2; Figure 5A
  quote: Receptive field information peaked at bin sizes of approximately 10–15 ms ( Figure 5A )
  criterion: Method from Materials and methods, STRF mutual information. cNE detection at bin
    sizes 2, 5, 8, 10, 15, 20, 35 and 50 ms; activity interpolated to 1 ms; per cNE a threshold
    giving 5000 events; STRF by event-triggered average; MI between STRF projections and events,
    from P(x|event) and P(x) of the projections z-scored, extrapolated to infinite data by a line
    through the means of 20 subsamples at 90, 95, 97.5, 99 and 100% of events against the
    inverse fraction. Open are the STRF time window, the number of projection bins, and how MI
    is summarised over cNEs at a bin size. Readings for the summary (a) mean over all cNEs; (b)
    median over all cNEs; the window and bins are taken as standard choices and stated.
    Reproduced when, under one summary reading, the largest value falls at 10 or 15 ms.
- id: fig5b-number-decreases-with-bin
  statement: The number of detected cNEs decreased as the bin size increased.
  source: Results, cNE identity is dependent on time bin size, paragraph 3; Figure 5B
  quote: we found that as the spike train temporal bin size increased, the number of recovered
    cNEs decreased ( Figure 5B )
  criterion: cNE detection on the 16 penetrations at the bin sizes of fig5a-mi-peaks-10-15ms. The
    paper reports no test. Read as a trend, the number of cNEs (mean over penetrations) has a
    negative Spearman correlation with bin size over the eight sizes and is lower at 50 ms than
    at 2 ms; this test is a reading of "decreased", not the paper's.
- id: fig5c-size-increases-with-bin
  statement: The mean number of member neurons per cNE increased as the bin size increased.
  source: Results, cNE identity is dependent on time bin size, paragraph 3; Figure 5C
  quote: the number of member neurons in each cNE increased ( Figure 5C )
