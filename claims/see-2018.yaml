    of neurons (p < 0.001, Wilcoxon signed-rank test
  statistics:
  - about: PTD, cNE against median random group
    test: Wilcoxon signed-rank test
    p: 1.39e-6
    n: 103 cNEs
  - about: STRF MI, cNE against median random group
