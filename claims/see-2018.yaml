- id: fig9s1-cne-mi-above-random-groups
  statement: The MI of the summed spikes of cNE members exceeded that of random groups of neurons
    of the same size, and the uniqueness index distribution was skewed towards 0, unlike the
    uniform distribution expected for random membership.
  source: Results, cNEs show enhanced information processing, paragraph 2; Figure 9-figure
    supplement 1D; Supplementary file 1
  quote: We found that the MI of spikes from cNE members was significantly higher than the MI of
    spikes from random groups of neurons (p < 0.001, Wilcoxon signed-rank test ... The
    distribution of UI values was significantly skewed towards 0 and was significantly different
    from an expected uniform distribution
  statistics:
  - about: cNE MI against median random group MI
    test: Wilcoxon signed-rank test
    p: 2.03e-8
    n: 96 cNEs
  - about: UI distribution against uniform
    test: Kolmogorov–Smirnov test
    p: 0.001
    p_relation: <
  depends_on:
  - fig9c-cne-events-more-mi
  criterion: Random groups as in Materials and methods, MI comparisons between cNE and random
