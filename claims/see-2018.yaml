- id: fig11ab-real-vs-surrogate
  statement: Spike matrices built from simultaneous spike trains ('real') gave more cNEs, and
    larger ones, than matrices built from different presentations of the same stimulus
    ('surrogate'), so stimulus-driven synchronization is not the main source of cNE synchrony.
  source: Results, cNE events are not fully accounted for by stimulus synchronization, paragraph 1;
    Figure 11A, B; Supplementary file 1
  quote: We found, however, that the ‘surrogate’ spike train matrices had fewer cNEs ( Figure 11A )
    and that the detected cNEs had fewer member neurons ( Figure 11B )
  statistics:
  - about: number of cNEs, real against surrogate
    test: paired t-test
    p: 6.15e-38
    n: 100 combinations of 15 neurons
  - about: mean cNE size, real against surrogate
    test: paired t-test
    p: 2.79e-57
    n: 100 combinations of 15 neurons
  criterion: Method from Materials and methods, Constructing repeat ('surrogate') spike matrices.
    Units responding to all 15 presentations of the 10-min RN with rates varying by less than 30%
    between adjacent presentations (24 in the paper); 100 unique random 15-unit combinations; per
    combination 15 real and 15 surrogate matrices (the shuffled order shifted circularly by one
    each time); cNE detection on each, averaged over the 15. How the 30% is computed is open;
    readings (a) the absolute rate difference over the mean of the two; (b) over the earlier
    presentation. Reproduced when both paired t-tests give p < 0.001 with real higher; the number
    of units passing is reported against 24.
- id: fig11c-models-number
  statement: Surrogate spike trains from the 'shuffled' and 'preserved receptive field' (PR)
    models gave fewer cNEs than the real data, while the dichotomized Gaussian (DG) model gave
    more.
  source: Results, cNE events are not fully accounted for by stimulus synchronization, paragraph 6;
    Figure 11C; Supplementary file 1
  quote: Surrogate spike trains from the ‘shuffled’ and ‘PR’ models had significantly fewer cNEs (
    Figure 11C ) than the real data. On the other hand, the ‘DG’ model overestimates the number of
    detected cNEs
  statistics:
  - about: shuffled against real
    test: paired t-test with Bonferroni correction
    p: 4.87e-9
    corrected: Bonferroni
    n: 16 penetrations
  - about: PR against real
    test: paired t-test with Bonferroni correction
    p: 4.62e-8
    corrected: Bonferroni
    n: 16 penetrations
  - about: DG against real
    test: paired t-test with Bonferroni correction
    p: 7.98e-6
    corrected: Bonferroni
    n: 16 penetrations
  criterion: Models from Materials and methods, Simulated spike trains. Shuffled, each unit's
    binned train shifted circularly by a random number of bins. PR, the full range of each unit's
    STRF projection values split into 15 equal bins, and spikes moved at random to time bins of
    the same projection bin. DG, binary 5-ms trains fitted for means and covariances and sampled
    with CorBinian (findLatentGaussian01, sampleDichGauss01), then rebinned to 10 ms. 200
    iterations per model and penetration, mean number of cNEs per penetration. Open are the bin
    width of the PR shuffle and the STRF used for it; readings (a) 10-ms bins; (b) 5-ms bins;
    with the STRF of the same recording. Bonferroni over the three model comparisons of the
    panel, a reading, as the paper does not name the family (Figure 11 legend; Supplementary
    file 1 lists three comparisons per panel). Reproduced
    when, under one reading, all three corrected p < 0.05 with shuffled and PR fewer and DG more;
    partially reproduced when two of the three hold.
- id: fig11d-models-size
  statement: All three models, including the DG model, gave cNEs with fewer member neurons than
    the real data.
  source: Results, cNE events are not fully accounted for by stimulus synchronization, paragraph 6;
    Figure 11D; Supplementary file 1
  quote: all three models, including the ‘DG’ model, resulted in cNEs that were smaller in size
    (i.e., fewer member neurons, Figure 11D ) than the real data (n = 16 penetrations
  depends_on:
