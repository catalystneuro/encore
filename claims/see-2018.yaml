- id: fig9s2-noise-correlations
  statement: Pairs of neurons in the same cNE had higher noise correlations than pairs not in the
    same cNE, in each of the 16 recordings and across them.
  source: Results, cNEs show enhanced information processing, paragraph 3; Figure 9-figure
    supplement 2; Supplementary file 1
  quote: Over the 16 columnar recordings, pairs of neurons that were members of the same cNE had
    significantly higher noise correlations than pairs of neurons not within the same cNE
  statistics:
  - about: per-recording medians, cNE pairs against non-cNE pairs, 16 recordings
    test: paired t-test
    p: 1.73e-5
    n: 16 recordings
  - about: example recording 1 (Figure 9-figure supplement 2B), cNE against non-cNE pairs
    test: Mann-Whitney U-test
    p: 5.24e-14
    n: 204 and 261 pairs
  - about: example recording 2 (Figure 9-figure supplement 2B), cNE against non-cNE pairs
    test: Mann-Whitney U-test
    p: 2.75e-49
    n: 237 and 583 pairs
  - about: example recording 3 (Figure 9-figure supplement 2B), cNE against non-cNE pairs
    test: Mann-Whitney U-test
    p: 3.26e-43
    n: 329 and 337 pairs
  criterion: Noise correlation is Pearson's R between two neurons' spike rates over the 50 trials
    of the 5-s repeat (legend A). Open is the rate; readings (a) spike count over the whole 5-s
    trial; (b) the rate in each 10-ms bin minus its PSTH, correlated over trials and bins.
    The per-recording medians of cNE and non-cNE pairs go into the paired t-test (legend C). Per
    recording, a Mann-Whitney U test of cNE against non-cNE pairs (legend B) gives the number of
    the 16 recordings where cNE pairs are higher with p < 0.001, for the statement's "in each".
    Reproduced when, under one reading, the paired t-test over recordings gives p < 0.001 with
    cNE pairs higher and all 16 per-recording tests do; partially reproduced when only the
    paired t-test does, or it gives only p < 0.05.
- id: fig10b-ptd-higher
  statement: cNE STRFs had stronger excitatory and inhibitory subfields than those of their member
    neurons, with a higher peak-trough difference.
  source: Results, cNEs show enhanced information processing, paragraph 4; Figure 10B;
    Supplementary file 1
  quote: Compared to neuronal STRFs, cNE STRFs had higher peak-trough differences (PTD; p < 0.001,
