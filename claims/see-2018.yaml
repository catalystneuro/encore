  statistics:
  - about: shuffled against real
    test: paired t-test with Bonferroni correction
    p: 1.23e-7
    corrected: Bonferroni
    n: 16 penetrations
  - about: PR against real
    test: paired t-test with Bonferroni correction
    p: 0.04
    corrected: Bonferroni
    n: 16 penetrations
  - about: DG against real
    test: paired t-test with Bonferroni correction
    p: 7.2e-3
    corrected: Bonferroni
    n: 16 penetrations
  criterion: The model runs of fig11c-models-number, mean cNE size per penetration. A model run
    that yields no cNE has no size; whether such runs are left out or count as zero is open, and
    both are shown. Reproduced when all three corrected p < 0.05 with the models smaller;
    partially reproduced when two hold.
- id: fig11ef-coincidence-ratios
  statement: Normalized to the real data, the coincidence ratios of groups of 2 and 3 cNE members
    were significantly below one for the 'repeat' data and the shuffled, PR and DG models.
  source: Results, cNE events are not fully accounted for by stimulus synchronization, paragraph 7;
    Figure 11E, F; Supplementary file 1
  quote: The normalized CR for the repeated stimulus data (‘repeat’), ‘shuffled’, ‘PR’ and ‘DG’
    models were significantly less than one for all groups ( Figure 11E and F )
  depends_on:
  - fig11c-models-number
  statistics:
  - about: each of shuffled, PR, repeat and DG against real, pairs (Figure 11E)
    test: paired t-test with Bonferroni correction
    p: 1.0e-100
    p_relation: <
    corrected: Bonferroni
    n: 400 groups
  - about: each of shuffled, PR, repeat and DG against real, triplets (Figure 11F)
    test: paired t-test with Bonferroni correction
    p: 1.0e-100
    p_relation: <
    corrected: Bonferroni
    n: 400 groups
  criterion: Method from Materials and methods, Calculation of coincidence ratios. CR is the
    number of bins in which all units of the group spike over the number in which its
    lowest-rate unit spikes; 400 unique groups of 2 and of 3 members of the same cNE; one real
    CR, one repeat CR (trains from different presentations), and the median of 1000 iterations
    of each model; all divided by the real CR. The CR bin is open; 10 ms, the detection bin, is
    taken as the paper names no other, and stated as an assumption. Which recordings the groups
    come from is open; the Methods take real and repeat CRs from presentations of one stimulus,
    which fits the 15 repeats of the 10-min RN, while the models are defined on the 16
    recordings. Readings (a) groups from cNEs detected on the repeated RN data, all CRs there;
    (b) groups from cNEs of the 16 recordings for real and model CRs, repeat CRs from the
    repeated RN data. The repeat CR needs the repeated 10-min RN data; without it the claim is
    judged on the three models. Reproduced when every comparison gives corrected p < 0.001 with
    the normalized CR below one; partially reproduced when the models hold and repeat cannot be
    run.
- id: fig11s3b-pr-strf-similarity
  statement: The PR model preserved the neurons' STRFs (median STRF similarity with the real
    spike trains about 0.74), while the shuffled and DG models gave STRF similarities close to
    zero.
  source: Results, cNE events are not fully accounted for by stimulus synchronization, paragraph
    5; Figure 11-figure supplement 3B
  quote: the ‘PR’ model had a high median correlation value (~0.74) while the ‘shuffled’ and ‘DG’
    models had values close to zero
  depends_on:
  - fig11c-models-number
  expected:
    quantity: median STRF similarity, PR model against real
    value: 0.74
    tolerance: 0.074
  criterion: STRF similarity is the correlation of a unit's model STRF with its real STRF, by
    spike-triggered average; median over all units and iterations. "Close to zero" is read as an
    absolute median below 0.1, a reading not fixed by the paper. Reproduced when the PR median is
    within tolerance and both other medians are below 0.1 in absolute value.
