# Claims for Wright & McDannald (2019), eLife 8:e45013, "Ventrolateral periaqueductal gray neurons
# prioritize threat probability over fear output", on CRCNS data set pag-1.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-10,
# protocol as stated in docs/protocol.md (Reader, version pilot-14).
#
# Text read: the version of record, PMC6435320 (open access), from the Europe PMC full-text JATS
# XML as supplied under paper/ (10.7554-elife.45013.txt): main text, Materials and methods, the
# legends of Figures 1 to 6 and of all figure supplements (Figure 1, supplements 1 to 6; Figure 2,
# supplements 1 and 2; Figure 5, supplements 1 and 2), and the example regression input table of
# the Methods. The paper has no other supplement. No PDF was supplied, so the values printed only
# inside figures (the R2 and sign-test p-values of Figure 4, the F values of Figure 5, supplement
# 1, the tuning curves of Figure 5E and 5J) could not be read; the claims on them are judged on
# the tests the legends name.
#
# Code. The paper links one source of code, the lab website ("Med Associates programs used for
# behavior and MATLAB programs used for behavioral analyses are made freely available at our lab
# website, http://mcdannaldlab.org/resources"). On 2026-11-10 that address returned 404, and the
# only Internet Archive capture (2020-10-25) of the page holds no files or links. No code was
# read. The data set's description says it includes sample MATLAB scripts (a cube-building script,
# population plots and a sample regression); these are files of the data set and were not read
# here. Every method below comes from the paper's text.
#
# Data the paper used. Six adult male Long Evans rats (of ten implanted; three yielded no units
# and one had a misplaced electrode), each with a drivable 16-wire bundle aimed at caudal vlPAG
# (bregma -7.62 to -7.98). 88 recording sessions of fear discrimination, each of 32 trials with a
# mean ITI of 3.5 min, in randomized order: six danger trials (shock p = 1.00), six uncertainty
# shock and ten uncertainty omission trials (p = 0.375), ten safety trials (p = 0.00). Cues are
# 10 s auditory motifs (click, phaser, trumpet, counterbalanced across rats); the foot shock (0.5
# mA, 0.5 s) starts 2 s after cue offset on danger and uncertainty shock trials. Rats nose poke for
# food on a VI-60 schedule throughout. 245 single units (Plexon, sorted offline), with spike times,
# mean waveforms, and the timestamps of cues, shocks and nose pokes. The measured variables are
# spike times, waveform half duration and amplitude ratio, baseline firing rate, and nose poke
# rates, from which suppression ratios are computed. The data set, by its description, holds the
# 245 units of the 88 sessions from these six rats, with per-unit firing, nose poke rates and
# suppression ratios for the 32 trials, so it is meant to hold every experiment of the paper.
#
# Method details fixed by the paper (Materials and methods unless stated).
# - Suppression ratio = (baseline poke rate - cue poke rate) / (baseline poke rate + cue poke
#   rate), for the whole 10 s cue (total fear) or one 1 s interval (interval fear), per trial (the
#   Methods regression table gives one total and one interval ratio per trial).
# - Uncertainty shock and omission trials are collapsed for all cue-period analyses and split for
#   the post-cue period ("Population and single-unit firing analyses").
# - Cue-responsive screen: paired two-tailed t-test across a cue's trials of raw firing rate
#   (spikes/s) in the 2 s before cue onset against the first 1 s cue interval, for each of the
#   three cues, p < 0.017; an increase makes an Onset neuron. The remaining neurons are screened
#   the same way with the last 1 s interval; those in the LFR cluster are the Ramping neurons.
# - 100 ms firing for population ANOVAs: per neuron and trial type, mean rate in 100 ms bins from
#   10 s before cue onset to 12 s after cue offset (320 bins), minus the trial type's mean 2 s
#   pre-cue rate, then Z-scored across all trial types and bins of the neuron.
# - Interval firing for t-tests, single-unit biases, pairs and regressions: per neuron, the
#   differential firing in the interval of interest on each of the 32 trials, Z-scored across the
#   32 trials, separately for each interval (1 s in the cue, 500 ms after it).
# - Population ANOVAs are repeated measures over neurons (or sessions); the reported degrees of
#   freedom fix the design, for example F(218, 6104) for cue (3) x bin (110 bins of 100 ms, 1 s
#   before onset to the end of the 10 s cue) over 29 neurons, and F(132, 1716) for trial type (4)
#   x bin (45 bins, the 5 s after cue offset without the five 100 ms bins of the shock) over 14.
#   No sphericity correction is named; the uncorrected tests are the reading the integer degrees
#   of freedom imply.
# - Single-unit regression: per neuron and interval, ordinary least squares (MATLAB regress, with
#   a constant) of interval Z firing over the 32 trials on interval fear, total fear and
#   probability (1.00, 0.375, 0.00); after the cue, 500 ms intervals and no total fear regressor.
#   Betas are compared across neurons by ANOVA (regressor x interval), paired two-tailed t-tests,
#   single-sample t-tests against zero at p < 0.005 (Bonferroni for 10 tests, Figure 5D legend),
#   sign tests and Pearson correlations.
#
# Details the paper leaves open, with the readings each criterion names.
# 1. The nose poke baseline window of the suppression ratio is not stated. Readings (a) the 2 s
#    before cue onset, the baseline the paper uses for firing; (b) the 10 s before cue onset, the
#    length of the cue.
# 2. A ratio with no pokes in baseline or cue (0/0). Readings (a) set to 0, as the 0.00 entries
#    of the Methods regression table allow; (b) left out of means.
# 3. A session's suppression ratio for a cue (Figure 1C, 1D, n = 88). Readings (a) the mean of the
#    per-trial ratios; (b) the ratio of the session's mean baseline and cue rates.
# 4. The baseline of the per-trial interval differential firing. Readings (a) the trial's own 2 s
#    before cue onset; (b) the trial type's mean 2 s baseline, as for the 100 ms bins.
# 5. The k-means features. The baseline firing rate is not defined (readings (a) the mean rate in
#    the 2 s pre-cue baselines of all 32 trials; (b) the mean rate over the session); nor is
#    feature scaling (readings (a) raw values; (b) each feature Z-scored). Initialization is a
#    standard choice (MATLAB kmeans defaults, several replicates, fixed seed).
# 6. Sign tests are two-sided unless the reading says otherwise; the paper does not say.
# 7. Others are named in the claims they bear on (shuffles, sliding windows, nose poke cessation).
#
# Inconsistencies within the paper, noted for the author. The danger vs uncertainty first-interval
# test of the Onset population is p = 9.70x10-5 in the Results and 9.70x10-4 in the Figure 2B
# legend (t(28) = 4.54 gives about 1e-4). The Ramping first-interval uncertainty vs safety test is
# p = 0.81 in the Results and 0.82 in the legend. The mean danger suppression ratio is 0.80 in the
# Results and 0.83 in the Figure 2, supplement 2 legend.
#
# All claims use the data set's own recordings (data: dataset, the default).
schema_version: 2
paper: doi:10.7554/elife.45013
claims:
- id: fig1c-total-suppression
  statement: Over the 88 recording sessions, suppression ratio over the whole 10 s cue differs by
    cue, high to danger (0.80), intermediate to uncertainty (0.53) and low to safety (0.03), and
    each cue pair differs.
  source: Results, first section, paragraph 2 (after Figure 1 supplements); Figure 1C
  quote: Across all 88 recording sessions, these six rats showed excellent discriminative fear ...
    high to danger, intermediate to uncertainty, and low to safety
  statistics:
  - about: cue effect, one-way ANOVA over danger, uncertainty and safety
    test: ANOVA
    statistic: F(2,174) = 592.00
    p: 2.32e-78
  - about: danger against uncertainty
    test: paired t-test
    statistic: t(87) = 12.36
    p: 7.44e-21
  - about: uncertainty against safety
    test: paired t-test
    statistic: t(87) = 20.85
    p: 3.50e-35
  expected:
  - quantity: mean suppression ratio to danger, total cue
    value: 0.80
    tolerance: 0.08
  - quantity: mean suppression ratio to uncertainty, total cue
    value: 0.53
    tolerance: 0.053
  - quantity: mean suppression ratio to safety, total cue
    value: 0.03
    tolerance: 0.05
  criterion: Per session (88, each counted once however many units it holds) and cue, the total
    cue suppression ratio (Methods, Calculating suppression ratios), uncertainty trials collapsed.
    Reproduced when, under one reading of details 1 to 3 of the opening comment, all three means
    are within tolerance, the repeated-measures ANOVA of cue has p < 0.05 and both paired t-tests
    have p < 0.05 in the reported direction; partially reproduced when the tests hold and a mean
    is outside tolerance. The safety tolerance is 0.05, not 10%, because 10% of 0.03 is below the
    printed precision; 0.05 is about the tolerance of the uncertainty value (0.053). The 0.83 for danger in the
    Figure 2, supplement 2 legend is reported against the same values.
- id: fig1c-nonlinear-scaling
  statement: Suppression scales non-linearly with shock probability. Uncertainty's shock
    probability is closer to safety, but its mean suppression ratio is closer to danger.
  source: Results, first section, paragraph 2
  quote: While the foot shock probability associated with uncertainty was closer to safety ... the
    mean suppression ratio to uncertainty was closer to danger
  depends_on:
  - fig1c-total-suppression
  criterion: From the session means of fig1c-total-suppression. Reproduced when the mean ratio to
    uncertainty exceeds the midpoint of the danger and safety means, under the reading that
    claim matched on (under every reading if it matched none).
- id: fig1d-interval-suppression
  statement: Suppression ratios in each 1 s cue interval discriminate every cue pair in every
    interval, with a cue effect and a cue x interval interaction.
  source: Results, first section, paragraph 3; Figure 1D
  quote: When the total cue period was divided into 10, 1 s intervals, discrimination was observed
    in each interval and its pattern showed subtle change over cue presentation
  statistics:
  - about: cue effect, cue x interval ANOVA
    test: ANOVA
    statistic: F(2,174) = 489.40
    p: 3.59e-72
  - about: cue x interval interaction
    test: ANOVA
    statistic: F(18,1566) = 6.21
    p: 5.90e-15
  - about: danger against uncertainty, each interval
    test: paired t-test
    statistic: all t(87) > 3.00
    p: 0.005
    p_relation: "<"
    corrected: Bonferroni for 10 tests
  - about: uncertainty against safety, each interval
    test: paired t-test
    statistic: all t(87) > 7.00
    p: 0.005
    p_relation: "<"
    corrected: Bonferroni for 10 tests
  criterion: Per session and cue, the suppression ratio of each of the ten 1 s cue intervals
    (readings of details 1 to 3). Reproduced when the two-way repeated-measures ANOVA has a cue
