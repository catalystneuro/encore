- id: fig6ef-beta-correlations
  statement: Probability betas of the delay intervals correlate with those of the post-shock
    intervals in 13 of 20 comparisons for Onset neurons but 4 of 20 for Ramping neurons, a
    significant difference (6 and 1 of 20 after Bonferroni correction, also different).
  source: Results, Ramping neurons signal threat probability through delay until shock receipt,
    paragraph 3; Figure 6E and 6F
  quote: Significant between-interval correlations for the probability beta coefficient were
    observed for 13/20 comparisons in Onset neurons ... significant correlations were found for
    only 4/20 comparisons in Ramping neurons
  statistics:
  - about: proportions at p < 0.05, Onset against Ramping
    test: chi-square test
    statistic: χ2 = 8.08
