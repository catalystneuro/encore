- id: fig1s1a-nose-poke-rates
  statement: Baseline nose poke rates do not differ between trial types, and poking falls from
    baseline to cue for danger and uncertainty but not for safety.
  source: Figure 1, figure supplement 1A
  quote: Baseline nose poke rates did not differ between trial types and rats showed significant
