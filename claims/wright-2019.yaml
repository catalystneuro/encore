    effects and the interaction have p < 0.01; and in the mixed ANOVA with neuron type the three
    neuron type interactions have p < 0.01. Partially reproduced when two of these three parts
    hold.
- id: fig6c-onset-post-cue-regression
  statement: After cue offset Onset neurons signal neither interval fear nor probability; no
    effect of regressor or regressor x interval interaction, and no beta differs from zero.
  source: Results, Ramping neurons signal threat probability through delay until shock receipt,
    paragraph 2; Figure 6C
  quote: Onset neurons did not signal interval fear or probability at any time following cue offset
    ( Figure 6C ). ANOVA revealed no main effect of regressor (F 1,28 = 1.02, p=0.32
  statistics:
  - about: main effect of regressor
    test: ANOVA
    statistic: F(1,28) = 1.02
    p: 0.32
  - about: regressor x interval interaction
    test: ANOVA
    statistic: F(8,224) = 0.53
    p: 0.83
  depends_on:
  - onset-population
