- id: fig6d-ramping-post-cue-regression
  statement: Ramping neurons signal probability throughout the delay (the first four 500 ms
    intervals after cue offset), and this signal diminishes after shock delivery, with a
    regressor x interval interaction.
  source: Results, Ramping neurons signal threat probability through delay until shock receipt,
    paragraph 2; Figure 6D
  quote: By contrast, Ramping neurons signaled probability throughout the delay period ( Figure 6D ,
    first four intervals), which diminished following shock delivery
  statistics:
  - about: regressor x interval interaction
    test: ANOVA
    statistic: F(8,104) = 5.20
    p: 0.01
    p_relation: "<"
  depends_on:
  - ramping-population
  criterion: As fig6c-onset-post-cue-regression, on the 14 Ramping neurons. Reproduced when the
