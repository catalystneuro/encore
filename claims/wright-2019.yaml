  depends_on:
  - onset-population
  - ramping-population
  criterion: Per trial position within each trial type (danger 1 to 6, uncertainty shock 1 to 6,
    uncertainty omission 1 to 10, safety 1 to 10), the population mean raw firing rate (Hz) of the
    interval against the population mean rate of the 2 s before onset. Reproduced when Onset
    first-interval firing exceeds baseline at all 32 positions, and Ramping last-interval firing
    exceeds baseline at all 22 danger and uncertainty positions and at no more than half of the
    10 safety positions; the paper gives no rule for "not safety trials", and this is the reading
    named here.
- id: fig2s2-nose-poke-cessation
  statement: Onset and Ramping firing is not driven by nose poke cessation. Across neurons,
    firing to danger (Onset first interval, Ramping last interval) is uncorrelated with firing to
    the first second of an ITI poke cessation and is consistently greater.
  source: Figure 2, figure supplement 2; Results, Population biases are evident in vlPAG
    single-units, paragraph 3
  quote: Comparison of single-unit firing to danger (Onset, first interval; Ramping, last interval)
    and nose poke suppression (first interval) revealed no correlation and an overwhelming bias
    towards greater firing to danger
  statistics:
  - about: Onset neurons, correlation
    test: Pearson correlation
    statistic: R2 = 0.01
    p: 0.32
  - about: Onset neurons, bias to danger
    test: sign test
    p: 1.62e-6
  - about: Ramping neurons, correlation
    test: Pearson correlation
    statistic: R2 = 0.08
    p: 0.10
  - about: Ramping neurons, bias to danger
    test: sign test
    p: 1.22e-4
  depends_on:
  - onset-population
  - ramping-population
  criterion: Cessation events are ITI periods (no cue) in which a nose poke is followed by at
    least 2 s without a poke; the interval of the poke is -1 and the first no-poke second +1
    (legend). Open are the ITI limits (readings (a) any time outside cue, delay and shock
    periods; (b) excluding also 10 s after each cue offset) and the firing measure (readings (a)
    raw rate in Hz for danger and for the +1 interval; (b) each as differential firing, danger
    against its 2 s pre-cue baseline and cessation against the -1 interval). Reproduced when,
    under one reading, the Pearson correlation across neurons is not significant (p >= 0.05) and a
    two-sided sign test finds danger greater at p < 0.05, for both populations; partially
    reproduced when this holds for one.
- id: fig3-onset-ramping-independent
  statement: In the four sessions with an Onset and a Ramping neuron recorded together, trial by
    trial firing of the two is not negatively related; a significant negative beta appears for one
    interval of one pair only.
  source: Results, vlPAG neurons show differential firing that is maximal to danger, paragraph 4;
    Figure 3
  quote: A significant (p<0.05), negative β was only found for one interval, for one neuron pair
    (pair 1, interval indicated by +)
  expected:
  - quantity: Onset-Ramping pairs recorded in the same session
    value: 4
    tolerance: 0
  depends_on:
  - onset-population
  - ramping-population
  criterion: For each pair and each 1 s cue interval, a regression (with constant) over the 32
    trials of the Onset neuron's interval Z firing on the Ramping neuron's (Methods, Single-unit,
    linear regression, last sentences). Reproduced when four pairs are found and at most two of
    the 40 interval regressions give a negative beta with p < 0.05 (one reported; at a 0.05 level
    about one is expected by chance); not reproduced when three or more do.
- id: fig4abc-onset-single-unit-biases
  statement: In the first 1 s interval, Onset single units' danger and uncertainty firing are
    correlated and biased to danger; uncertainty and safety firing are correlated but the bias
    to uncertainty is not significant; danger firing is biased to the first over the last
    interval, with no correlation between them.
  source: Results, Population biases are evident in vlPAG single-units, paragraph 1; Figure 4A to
    4C; Methods, Population and single-unit firing analyses, paragraph 3
  quote: Danger and uncertainty firing were correlated, and single-units were biased towards greater
    firing to danger ( Figure 4A ). Uncertainty and safety firing were also correlated; however, the
    single-unit bias towards greater firing to uncertainty was not significant
  depends_on:
  - onset-population
  criterion: Per Onset neuron, mean interval Z firing per cue (readings of detail 4). Pearson
    correlation (p < 0.05) and sign test (p < 0.05, two-sided per detail 6) for each panel
    (Methods, Population and single-unit firing analyses, paragraph 3). Reproduced when A has a
    correlation with p < 0.05 and a danger bias, B a correlation with p < 0.05 and a sign test
    with p >= 0.05, and C a first-interval bias and a correlation with p >= 0.05; partially
    reproduced when two of the three panels hold. The text gives no sign for the correlations;
    the sign found is reported. The R2 and p values printed in the panels could not be read from
    the text.
- id: fig4d-onset-patterns
  statement: The most common pattern of Onset neurons in the first 1 s interval is danger >
    uncertainty > safety (14 neurons), the only pattern with more neurons than expected by
    chance.
  source: Results, Population biases are evident in vlPAG single-units, paragraph 1; Figure 4D;
    Methods, Determining observed and expected cue firing patterns
  quote: Examining relative cue firing for each Onset neuron in the first 1 s interval revealed the
    most common pattern to be ... danger > uncertainty > safety (n = 14). This was the only pattern
    to contain more units than would be expected than chance
  expected:
  - quantity: Onset neurons with danger > uncertainty > safety
    value: 14
    tolerance: 1.4
  depends_on:
  - onset-population
  criterion: Each neuron is placed by the order of its mean interval Z firing to the three cues;
    the chance distribution comes from 1000 shuffles (Methods, Determining observed and expected
    cue firing patterns). The Methods name four categories, (d > u > s), (d > s > u), (s > u > d)
    and (u > d > s), and Figure 4D shows these four; the claim is judged on them, with all six
    orders shown as a variant. Open are the shuffle (readings (a) the three cue values permuted
    within each neuron, as "each neurons firing pattern was shuffled" reads most directly; (b)
    each cue's values permuted across neurons) and "more than expected by chance" (readings (a)
    above the 95th percentile of the shuffled counts; (b) above the most extreme non-outlier of
    the box plot, 1.5 interquartile ranges above the 75th percentile, a standard box plot rule the
    paper does not state). Reproduced when, under one reading, the count is within tolerance, is
    the largest, and is the only one of the four categories above chance.
- id: fig4efg-ramping-single-unit-biases
  statement: In the last 1 s interval, Ramping single units' danger and uncertainty firing are
    correlated and biased to danger; uncertainty and safety firing are not correlated but are
    biased to uncertainty; danger firing is biased to the last over the first interval, with no
    correlation between them.
  source: Results, Population biases are evident in vlPAG single-units, paragraph 2; Figure 4E to
    4G
  quote: A significant correlation between firing to danger and uncertainty was observed, along with
    a single-unit bias towards greater firing to danger ( Figure 4E ). Only now, there was no
    correlation between uncertainty and safety firing, but a consistent bias towards greater
    uncertainty firing
  depends_on:
  - ramping-population
  criterion: As fig4abc-onset-single-unit-biases, on the 14 Ramping neurons and the last 1 s
    interval. Reproduced when E has a correlation with p < 0.05 and a danger bias, F a correlation
    with p >= 0.05 and an uncertainty bias, and G a last-interval bias and a correlation with p >=
    0.05; partially reproduced when two of the three hold. The sign of the E correlation is
    reported; the text gives none.
- id: fig4h-ramping-patterns
  statement: The most common pattern of Ramping neurons in the last 1 s interval is danger >
    uncertainty > safety (11 neurons), the only pattern above chance.
  source: Results, Population biases are evident in vlPAG single-units, paragraph 2; Figure 4H
  quote: The most common firing pattern in the last 1 s interval was ... danger > uncertainty >
    safety (n = 11). This was the only pattern to contain more units than expected by chance
  expected:
  - quantity: Ramping neurons with danger > uncertainty > safety
    value: 11
    tolerance: 1.1
  depends_on:
  - ramping-population
  criterion: As fig4d-onset-patterns, on the 14 Ramping neurons and the last 1 s interval, with the
    same four categories (Figure 4H legend, "reported as in D") and the same readings.
- id: fig5a-onset-probability-first-interval
  statement: In the first 1 s cue interval the Onset population's probability beta is positive
    and significant and exceeds both fear betas, neither of which differs from zero.
  source: Results, Onset neurons signal threat probability, paragraph 2; Figure 5A
  quote: The beta coefficient for the probability regressor was positive and significant, exceeding
    the beta coefficient for either measure of fear output – neither of which differed from zero
  statistics:
  - about: probability against total fear
    test: paired samples t-test
    statistic: t(28) = 3.75
    p: 8.01e-4
  - about: probability against interval fear
    test: paired samples t-test
    statistic: t(28) = 4.57
    p: 8.90e-5
  depends_on:
  - onset-population
  criterion: Single-unit regressions of the Methods on first-interval Z firing (readings of details
    1, 2 and 4). Reproduced when the probability beta exceeds each fear beta by paired two-tailed
    t-tests at p < 0.05, the probability beta is above zero by a single-sample t-test at p <
    0.005, and neither fear beta differs from zero at p < 0.005 (the threshold of the Figure 5D
    legend, the paper's test for comparisons to zero); the result at 0.05 is shown as a variant.
- id: fig5bc-onset-beta-bias
  statement: Onset single-unit betas are positively biased for threat probability but not for
    total or interval fear.
  source: Results, Onset neurons signal threat probability, paragraph 2; Figure 5B and 5C
  quote: Single-unit beta coefficients were positively biased for threat probability, but not for
    either measure of fear output
  depends_on:
  - fig5a-onset-probability-first-interval
  criterion: First-interval betas of the 29 Onset neurons; the legend's sign test of each
    regressor against zero, two-sided, p < 0.05. Reproduced when probability is biased positive
    and neither fear regressor is (p >= 0.05, the paper's test, as written).
- id: fig5d-onset-all-intervals
  statement: Over the ten 1 s cue intervals, Onset threat probability signaling is highest in the
    first interval, persists several seconds and diminishes, while total and interval fear account
    for firing in no interval; an ANOVA shows a main effect of regressor and a regressor x interval
    interaction.
  source: Results, Onset neurons signal threat probability, paragraph 3; Figure 5D
  quote: Examining the entirety of cue presentation, threat probability signaling was highest in the
    first interval, persisted several more seconds and diminished ( Figure 5D ). Total fear or
    interval fear did not account for variance in single-unit firing at any interval
  statistics:
  - about: main effect of regressor
    test: ANOVA
    statistic: F(2,56) = 7.16
    p: 0.01
    p_relation: "<"
  - about: regressor x interval interaction
    test: ANOVA
    statistic: F(18,504) = 2.38
    p: 0.01
    p_relation: "<"
  depends_on:
  - fig5a-onset-probability-first-interval
  criterion: Betas of the 29 Onset neurons for the three regressors in each of the ten intervals;
    repeated-measures ANOVA (regressor x interval). Reproduced when both effects have p < 0.01,
    the mean probability beta is largest in the first interval and above zero (single-sample
    t-test, p < 0.005) in it and in at least one later interval, and no fear beta differs from
    zero at p < 0.005 in any interval.
- id: fig5s1-regressor-combinations
  statement: Onset neurons prioritize probability whatever the combination of regressors; a fear
    beta reaches significance only when total fear is the sole regressor, and even then its
    relation is weaker than that of probability.
  source: Results, Onset neurons signal threat probability, paragraph 3; Figure 5, figure
    supplement 1A to 1E
  quote: In fact, significance for fear output could only be found if total fear was the only
    regressor used in the analysis ... Even then, the predictive relationship was weaker than that
    of probability
  depends_on:
  - fig5a-onset-probability-first-interval
  criterion: Regressions as in fig5d-onset-all-intervals with the regressors (A) probability and
    total fear, (B) probability and interval fear, (C) interval fear, (D) total fear, (E)
    probability (supplement legend). What counts as "significance for fear output" is open; the
    supplement legend reports only the main effect of regressor (A, B) and of interval (C to E),
    and no comparison to zero. Readings (a) single-sample t-tests of the mean beta against zero in
    each interval at p < 0.005, as in the Figure 5D legend; (b) the legend's F for the main effect
    of interval in the single-regressor panels, at p < 0.05. Reproduced when, under one reading, no
    fear regressor reaches significance in A, B and C, the total fear regressor does in D, and the
    D beta is below the E beta; and when A and B each show a main effect of regressor with the
    probability beta above the fear beta ("Identical results were obtained when probability was
    compared to total fear or interval fear separately", repeated-measures ANOVA, regressor x
    interval, p < 0.05). "Weaker" is open; readings (a) the mean betas of the first interval; (b)
    the largest mean beta over intervals.
- id: fig5e-onset-tuning-curve
  statement: Varying the probability assigned to uncertainty from 0 to 1 in 0.125 steps, the
    Onset population's mean probability beta in the first interval peaks at the actual 0.375,
    with the flanking values next highest and betas falling off toward the extremes.
  source: Results, Onset neurons signal threat probability, paragraph 4; Methods, Threat
    probability tuning curve; Figure 5E
  quote: The beta coefficient resulting from regression using the actual shock probability
    (uncertainty = 0.375), was the 'peak' of the tuning curve. The probabilities with the next
    highest beta coefficients were those flanking 0.375
  expected:
  - quantity: uncertainty assignment at the peak of the Onset tuning curve
    value: 0.375
    tolerance: 0
  depends_on:
  - fig5a-onset-probability-first-interval
  criterion: Nine regressions per neuron with all three regressors, danger 1.00 and safety 0.00,
    uncertainty 0 to 1 in steps of 0.125; mean probability beta over the 29 neurons per
    assignment. Reproduced when the largest mean is at 0.375 and the next two are at 0.25 and
    0.5; partially reproduced when the peak is at 0.375 and the order of the next two differs.
    The tolerance is 0 because the assignments are a grid of 0.125.
- id: fig5s2-binary-regressor
  statement: Onset firing is better captured by the actual shock probability (uncertainty 0.375)
    than by a binary regressor equating uncertainty with safety, in the first interval and
    across the cue.
  source: Figure 5, figure supplement 2; Results, Onset neurons signal threat probability,
    paragraph 5
  quote: The activity of vlPAG single-units was better captured by the regressor that reflected the
    actual foot shock probability (uncertainty = 0.375) over a regressor that equated uncertainty
    to safety (uncertainty = 0.000)
  statistics:
  - about: analysis x regressor x interval, all ten intervals
    test: ANOVA
    statistic: F(18,504) = 2.51
    p: 5.89e-4
  - about: analysis x regressor, first interval
    test: ANOVA
    statistic: F(2,56) = 7.80
    p: 1.03e-3
  depends_on:
  - fig5d-onset-all-intervals
  criterion: A second set of regressions with the binary regressor (danger 1, uncertainty and
    safety 0) in place of probability, run separately. Repeated-measures ANOVA on betas with
    analysis (probability or binary), regressor and interval. Reproduced when both interactions
    have p < 0.05 and the first-interval mean beta is larger for probability than for binary.
- id: fig5f-ramping-last-interval
  statement: In the last 1 s cue interval, Ramping probability and total fear betas both exceed
    the interval fear beta and do not differ from each other.
  source: Figure 5F legend (the tests); Results, Ramping neurons prioritize threat probability
    over fear output, paragraph 1
  quote: Beta coefficients for probability and total fear were significantly greater than interval
    fear (probability vs. interval fear, t 13 = 3.61, p=3.20×10 −3 ; total fear vs. interval fear, t
    13 = 4.68, p=4.34×10 −4 ), but did not differ from one another (t 13 = 1.11, p=0.29)
  statistics:
  - about: probability against interval fear
    test: paired samples t-test
    statistic: t(13) = 3.61
    p: 3.20e-3
  - about: total fear against interval fear
    test: paired samples t-test
    statistic: t(13) = 4.68
    p: 4.34e-4
  - about: probability against total fear
    test: paired samples t-test
    statistic: t(13) = 1.11
    p: 0.29
  depends_on:
  - ramping-population
  criterion: Last-interval betas of the 14 Ramping neurons. Reproduced when both comparisons with
    interval fear are significant at p < 0.05 in the stated direction and probability against
    total fear has p >= 0.05 (the paper's test, as written).
- id: fig5gh-ramping-beta-bias
  statement: Ramping single-unit betas in the last interval are biased positive for probability
    and total fear, which are uncorrelated; they are not biased for interval fear, and the
    probability and interval fear betas are negatively correlated.
  source: Results, Ramping neurons prioritize threat probability over fear output, paragraph 1;
    Figure 5G and 5H
  quote: Ramping single-units were biased towards positive beta coefficients for probability and
    total fear ( Figure 5G ), but there was no correlation between these regressors. Ramping
    single-units were not biased towards positive beta coefficients for interval fear ( Figure 5H
    ), but signaling of probability and interval fear were negatively correlated
  depends_on:
  - fig5f-ramping-last-interval
  criterion: Sign tests against zero (two-sided, p < 0.05) and Pearson correlations (p < 0.05)
    across the 14 neurons. Reproduced when probability and total fear are biased positive, their
    correlation has p >= 0.05, interval fear is not biased (p >= 0.05), and probability and
    interval fear correlate negatively at p < 0.05; partially reproduced when three of the four
    hold.
- id: fig5i-ramping-all-intervals
  statement: Over all ten cue intervals Ramping neurons prioritize probability (mean beta 0.58,
    against 0.12 for total fear and -0.03 for interval fear); only the probability beta differs
    from zero and it exceeds both fear betas, with a main effect of regressor and a regressor x
    interval interaction.
  source: Results, Ramping neurons prioritize threat probability over fear output, paragraph 1;
    Figure 5I
  quote: Linear regression for all ten intervals revealed that threat probability signaling was
    prioritized over total fear and interval fear ... Only the beta coefficient for probability
    differed significantly from zero
  statistics:
  - about: main effect of regressor
    test: ANOVA
    statistic: F(2,26) = 8.96
    p: 0.01
    p_relation: "<"
  - about: regressor x interval interaction
    test: ANOVA
    statistic: F(18,234) = 2.16
    p: 0.01
    p_relation: "<"
  - about: probability beta against zero
    test: single-sample t-test
    statistic: t(13) = 4.21
    p: 1.02e-3
  - about: probability against total fear
    test: paired t-test
    statistic: t(13) = 2.32
    p: 0.04
  - about: probability against interval fear
    test: paired t-test
    statistic: t(13) = 4.32
    p: 8.28e-4
  expected:
  - quantity: mean probability beta over the ten intervals
    value: 0.58
    tolerance: 0.14
  - quantity: mean total fear beta over the ten intervals
    value: 0.12
    tolerance: 0.10
  - quantity: mean interval fear beta over the ten intervals
    value: -0.03
    tolerance: 0.05
  depends_on:
  - ramping-population
  criterion: Per Ramping neuron, the mean of its betas over the ten intervals; tolerances are the
    reported SEMs. Reproduced when the three means are within tolerance under one reading of
    details 1, 2 and 4, the ANOVA effects have p < 0.01, the probability mean differs from zero
    and exceeds both fear means at p < 0.05, and the fear means do not differ from zero at p <
    0.05; partially reproduced when the tests hold and a mean is outside tolerance.
- id: fig5s1-ramping-regressor-combinations
  statement: For Ramping neurons, the prioritization of probability over all ten intervals holds
    when probability is compared with total fear or interval fear alone, and when each regressor
    is used in isolation.
  source: Results, Ramping neurons prioritize threat probability over fear output, paragraph 1;
    Figure 5, figure supplement 1F to 1J
  quote: This pattern of results held when probability was separately compared to total fear and
    interval fear, and when each regressor was considered in isolation
  depends_on:
  - fig5i-ramping-all-intervals
  criterion: Regressions of fig5i-ramping-all-intervals (14 Ramping neurons, ten 1 s cue
    intervals) with the regressors (F) probability and total fear, (G) probability and interval
    fear, (H) interval fear, (I) total fear, (J) probability (supplement legend). "This pattern"
    is the one of fig5i-ramping-all-intervals; per neuron, the mean beta over the ten intervals.
    Reproduced when, in F and G, the probability mean differs from zero (single-sample t-test, p <
    0.05), the fear mean does not, the probability mean exceeds the fear mean (paired two-tailed
    t-test, p < 0.05), and the repeated-measures ANOVA (regressor x interval) has a main effect of
    regressor at p < 0.05 (the F the legend shows); and when, of H, I and J, only the probability
    mean (J) differs from zero. The legend's F for the main effect of interval in H to J is
    reported. Partially reproduced when F and G hold and H to J do not.
- id: fig5j-ramping-tuning-curve
  statement: The Ramping population's tuning curve for the last interval is shifted right of the
    actual probability, peaking at 0.625, consistent with mixed signaling of probability and fear.
  source: Results, Ramping neurons prioritize threat probability over fear output, paragraph 2;
    Figure 5J
  quote: Tuning was shifted right of the actual probability, with a 'peak' at 0.625
  expected:
  - quantity: uncertainty assignment at the peak of the Ramping tuning curve
    value: 0.625
    tolerance: 0
  depends_on:
  - fig5f-ramping-last-interval
  criterion: As fig5e-onset-tuning-curve, on the 14 Ramping neurons and the last 1 s interval.
    Reproduced when the largest mean probability beta is at 0.625; partially reproduced when it
    is at 0.5 or 0.75 (right of 0.375 but not at 0.625).
- id: fig6ab-post-cue-firing
  statement: In the 5 s after cue offset (delay, shock, post-shock; the shock itself excluded)
    Onset neurons show no effects of trial type or bin, while Ramping neurons keep firing to
    danger and uncertainty through the delay, with a trial x bin interaction, and the two
    populations differ.
  source: Results, Ramping neurons signal threat probability through delay until shock receipt,
    paragraph 1; Figure 6A and 6B
  quote: ANOVA for normalized firing rate ... revealed no main effects or interactions for Onset
    neurons (F s <2.3, ps >0.09). By contrast, identical ANOVA revealed main effects of trial and
    bin (Fs >3, ps <0.01), as well as a trial x bin interaction for Ramping neurons (F 132,1716 =
    3.14, p<0.01
  statistics:
  - about: Onset neurons, all effects
    test: ANOVA
    statistic: Fs < 2.3
    p: 0.09
    p_relation: ">"
  - about: Ramping neurons, main effects of trial type and bin
    test: ANOVA
    statistic: Fs > 3
    p: 0.01
    p_relation: "<"
  - about: Ramping neurons, trial type x bin
    test: ANOVA
    statistic: F(132,1716) = 3.14
    p: 0.01
    p_relation: "<"
  - about: neuron type interactions (trial type, bin, trial type x bin)
    test: ANOVA
    statistic: Fs > 2.50
    p: 0.01
    p_relation: "<"
  depends_on:
  - onset-population
  - ramping-population
