    and both uncertainty types fall significantly and safety does not. The paper names no test for
    baseline across trial types; the reading is a one-way repeated-measures ANOVA over the four
    types at p < 0.05, with paired t-tests of each pair as a variant. The claim is reproduced when
    both parts hold.
- id: fig1s1b-sr-poke-correlation
  statement: Suppression ratio and cue nose poke rate are significantly correlated across
    sessions, particularly for danger and uncertainty.
  source: Figure 1, figure supplement 1B
  quote: The two measures were significantly correlated, particularly for danger and uncertainty
  criterion: For each cue, the correlation over the 88 sessions of the total cue suppression ratio
    and the cue poke rate (readings of details 1 to 3). The legend names no test; Pearson is the
    correlation the Methods use elsewhere and is the reading here. Open is the unit of the overall
