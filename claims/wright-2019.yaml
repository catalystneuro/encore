  statistics:
  - about: baseline against cue, per trial type
    test: paired samples t-test
    p: 0.05
    p_relation: "<"
  criterion: Per session (88) and trial type (danger, uncertainty shock, uncertainty omission,
    safety), the mean baseline and cue poke rates (baseline readings of detail 1). Baseline against
