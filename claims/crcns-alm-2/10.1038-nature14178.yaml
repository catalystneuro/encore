  - quantity: task-related cells
    value: 2740
    tolerance: 274
    unit: cells
  - quantity: fraction task-related
    value: 58
    tolerance: 5.8
    unit: percent
  criterion: Method from the Methods (Calcium imaging data analyses). dF/F as in the opening
    comment; cells kept when at least 5% brighter than their neuropil. The brightness comparison
    is not specified further; the standard choice is the mean raw ROI fluorescence over the
    session against the mean neuropil fluorescence, at least 1.05 times. Per trial, dF/F averaged
    in consecutive bins of five frames (0.33 s); for contra and for ipsi trials separately, a
    Kruskal-Wallis test across bins with trials as samples; task-related when either test has
    P < 0.01. Which part of the trial forms "the task" is open. Readings (a) from sample onset to
    the end of the response epoch, under each response epoch length of the opening comment;
    (b) from trial start to the end of the response epoch. The trial selection readings of the
    opening comment apply. Reproduced when, under one reading, all three expected values hold.
