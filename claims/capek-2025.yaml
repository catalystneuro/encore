  statement: In a combined morphology (CAJAL) and centre of mass distance matrix of LH arborizations,
    the five D. mojavensis TPN-V reconstructions cluster apart from those of D. melanogaster, D.
    persimilis and D. mettleri (SigClust p = 1.97e-5).
  source: Figure 5g; Results, LH innervation matches species behaviour, paragraph 4; Methods,
    Quantification of projection neuron anatomy
  quote: A distance matrix for reconstructions in f (Methods) demonstrates distinct clustering of the D.
    mojavensis TPN-V arborizations within the LH
  statistics:
  - test: SigClust test
    p: 1.97e-5
    n: 20 reconstructions, 5 per species
  criterion: From the Methods. Reconstructions cropped to the LH; CAJAL (v1.0.3) samples 100 points
    per skeleton, builds Euclidean distance matrices and computes pairwise Gromov-Wasserstein
    distances; the LH COM of each neuron is measured on a normalized maximum projection and pairwise
    taxicab distances taken; both matrices are divided by their maxima and summed; hierarchical
    clustering with scikit-learn AgglomerativeClustering, UMAP with umap-learn, SigClust at 0.05.
