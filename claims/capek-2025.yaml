    (readings (a) rows of the summed distance matrix as feature vectors; (b) a classical
    multidimensional scaling embedding of the matrix; (c) the UMAP coordinates) and the split it tests
    (the D. mojavensis reconstructions against the rest). Reproduced when, under one reading, the top
    split of the dendrogram separates the five D. mojavensis reconstructions from the other fifteen
    and SigClust gives p < 0.05. Partially reproduced when D. mojavensis forms a pure cluster below the
    top split, or four of five group together, with p < 0.05.
