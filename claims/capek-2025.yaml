- id: fig2i-two-q10-processes
  statement: Arrhenius plots of DmelGr28b.d currents show two processes with different Q10 values,
    below and above the threshold.
  source: Figure 2h,i legend
  quote: A representative Arrhenius plot (Methods) reveals two distinct processes characterized by
    different Q10 values
  data: elsewhere
  where: Nature Source Data for doi:10.1038/s41586-025-08682-z (41586_2025_8682_MOESM3_ESM.xlsx), sheet
