# Claims for Capek, Arenas, Alpert, ... Para & Gallio (2025), "Evolution of temperature preference in
# flies of the genus Drosophila", Nature 641, 447-455, doi:10.1038/s41586-025-08682-z, on dandiset
# 001609 ("Comparative anatomy of thermosensory projection neurons in Drosophila species"; title and
# description read on the archive, no data or asset list read).
#
# Provenance. Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-11-20, protocol pilot-18 as stated in docs/protocol.md (Reader, steps 1 to 4).
#
# Text read. The version of record, as supplied in paper/10.1038-s41586-025-08682-z.txt (PyMuPDF
# extraction of the PDF): main text, figure legends 1 to 5, Methods, Data and Code availability,
# Extended Data Fig. 1 to 7 legends, the Nature Portfolio reporting summary, and the Source Data
# workbook (41586_2025_8682_MOESM3_ESM.xlsx, one sheet per panel, extracted into the same file). The
# paper has no other supplementary information; the Extended Data figures are its supplement.
#
# Code. None to read: "No custom algorithms or computer code was produced as part of this work"
# (Code availability). The reporting summary names the software used (Fiji 2.14.0, CMTK Registration
# GUI, neuTube 1.0, Vaa3D 1.1.2, CAJAL 1.0.3, scikit-learn 1.5.0, umap-learn, SigClust, Clustal Omega
# 1.2.3 in Geneious Prime 2023.1.1, STAR 2.7.9a, MATLAB R2023a, Igor Pro 6.37, AxoGraph 1.5.4).
#
# Data the paper used, as it reports them.
#   Behaviour. Two-choice temperature preference: groups of 15 male flies, 3-5 days old, on four
#     Peltier tiles, base temperature 25 C against a test temperature in opposite quadrants, 3 min,
#     then the configuration reversed for 3 min; PI = (no. BT - no. TT)/total, the two trials
#     averaged; positive PI is avoidance of the test temperature, negative is attraction; each group
#     tested against zero by a two-tailed one-sample t-test at 0.05 (Methods, Temperature preference
#     assays). Species and strains: D. persimilis (NDSSC 14011-0111.51; extra strain 14011-0111.24),
#     D. melanogaster (Canton-S; extra strain EG16), D. mojavensis mojavensis (15081-1352.47; extra
#     strain D. m. wrigleyi 15081-1352.29), D. mettleri (15081-1502.13); D. melanogaster Gr28b
#     mutants and rescues (Gr28b.d exc66 control, exc8 mutant, HC>DmelGr28b.d, HC>DmojGr28b.d);
#     D. mojavensis Gr28b.d delta1 mutant and its DmelGr28b.d rescue. Optogenetic red/blue light
#     choice with groups of 25 flies (Extended Data Fig. 5f).
#   Electrophysiology. Whole-cell patch clamp of HEK293T (and S2R+) cells expressing Gr28b.d of four
#     species; currents normalized, log-transformed, plotted against 1/T; threshold at the
#     intersection of linear fits to the shallowest and steepest regions (Methods, Electrophysiology).
#     Only per-cell thresholds and Q10 values are deposited (Source Data); no raw recordings.
#   Sequences and RNA-seq. Gr28b.d coding sequences in GenBank (OQ624956 D. persimilis, OQ621410
#     D. mojavensis, PP885916 D. mettleri); arista RNA-seq in NCBI SRA BioProject PRJNA948454.
#   Connectome. Hemibrain v1.2.1 on neuprint.janelia.org (Fig. 4f, Extended Data Fig. 5a-c).
#   Anatomy (the dandiset). TPN-V and other thermosensory projection neurons dye-labelled by
#     electroporation in dissected brains, imaged on a two-photon microscope at 1,024 x 1,024 pixels in
#     two mounting orientations, "front view" (scanned on the anterior-posterior axis) and "top view"
#     (scanned on the dorsal-ventral axis). LH and calyx segmented in Fiji, stacks registered within
#     species with CMTK, neurons traced with neuTube after thresholding (or Simple Neurite Tracer
#     masks), skeletons exported as SWC. n = 5 TPN-V reconstructions per species for D. melanogaster,
#     D. mojavensis, D. persimilis and D. mettleri (Fig. 5f), plus fills of one extra strain each of
#     D. melanogaster, D. mojavensis and D. persimilis (Extended Data Fig. 7d-g). The dandiset
#     description lists ten TPN-V z-stacks per species (five front view, five top view), front and top
#     fills of an extra strain of each species, and representative fills of TPN-Ia, TPN-Ib and TPN-VI
#     in D. mojavensis. Confocal images (Fig. 3f-i, 4c), the DM1 olfactory fills (Extended Data Fig. 6)
#     and the full set of dye-fill experiments counted in Extended Data Fig. 4 are not in that list.
#
# The dandiset can test only the anatomy claims (Fig. 4e, 4h, 4i, 5b, 5e, 5f, 5g, Extended Data Fig.
# 3d, 3e, 7d-g). Behaviour, threshold and connectome claims use the Source Data or the public archives
# named above (data elsewhere).
#
# Method details the paper leaves open for the anatomy claims, with the readings named in the
# criteria. (1) Which stacks form the n = 5 reconstructions per species: the Methods do not say whether
# the front-view and top-view stacks of a species are the same five neurons, or which view feeds the
# LH and which the calyx analysis. (2) The threshold used to binarize stacks before neuTube tracing.
# (3) The size images are normalized to before the centre of mass (COM) is measured (Extended Data Fig.
# 3e source data give COM in pixels; the frame size is not stated). (4) The linkage of the
# agglomerative clustering (scikit-learn, "using Gower distance as a similarity measure"). (5) What
# SigClust is run on (it needs feature vectors; the paper has a distance matrix) and which split it
# tests. (6) UMAP parameters. CAJAL sampling (100 points, Euclidean distances, Gromov-Wasserstein) and
# the combination of the two matrices (each normalized to its maximum, then summed) are fixed by the
# Methods.
#
# Source Data irregularities noted for the author (not used to change any expected value). The sheet
# named Figure5c holds the Fig. 5d thresholds and the sheet named Figure5d holds the Fig. 5c PIs. In
# EDFigure5f the TLHON-II Gal4/+ values are identical to the TLHON-II > CsChrimson values. In EDFigure2
# the wild-type 45 C values equal Figure1d's 40 C column, and the 40 C group has 7 and 7 values where
# the legend says N = 11. Figure2i lists 12 cells where the legend says n = 13. The Fig. 3j legend
# prints nearly the same P values for the control and the DmelGr28b.d rescue.
schema_version: 2
paper: doi:10.1038/s41586-025-08682-z
claims:
- id: fig1b-persimilis-prefers-cool
  statement: In two-choice assays against a 25 C base, D. persimilis prefers about 15 to 20 C and
    avoids warmer test temperatures (n = 8 groups of 15 flies).
  source: Results, Thermal preference in Drosophila species, paragraph 1; Figure 1b
  quote: in two-choice temperature preference assays, D. persimilis prefers distinctly cool
    conditions9 (15–20 °C; Fig. 1a,b)
  data: elsewhere
  where: Nature Source Data for doi:10.1038/s41586-025-08682-z (41586_2025_8682_MOESM3_ESM.xlsx), sheet
    Figure1b
  criterion: Per test temperature, the group PIs (PI = (no. BT - no. TT)/total; negative is
    attraction) tested against zero by a two-tailed one-sample t-test at 0.05 (Methods, Temperature
    preference assays). The paper does not say how "prefers 15 to 20 C" is decided. Readings are (a)
    the PI is significantly negative at both 15 and 20 C; (b) 15 and 20 C are the only test
    temperatures with a negative mean PI. Reproduced when, under one reading, that holds and the PI is
    significantly positive at 30, 35 and 40 C.
- id: fig1c-melanogaster-prefers-25
  statement: D. melanogaster prefers about 25 C, avoiding both lower and higher test temperatures
    against a 25 C base (n = 6 groups of 15 flies).
  source: Results, Thermal preference in Drosophila species, paragraph 2; Figure 1c
  quote: in laboratory assays this species prefers temperatures close to those also favoured by its
    human host10,11 (about 25 °C; Fig. 1c)
  data: elsewhere
  where: Nature Source Data for doi:10.1038/s41586-025-08682-z (41586_2025_8682_MOESM3_ESM.xlsx), sheet
    Figure1c
  criterion: Two-tailed one-sample t-test of the group PIs against zero at 0.05 per test temperature
    (Methods). Reproduced when the PI is significantly positive at 10, 15, 20, 30, 35 and 40 C;
    partially reproduced when it is at five of these six.
- id: fig1d-mojavensis-prefers-hot
  statement: D. mojavensis prefers about 30 to 35 C over 25 C (n = 11 groups of 15 flies), conditions
    that D. melanogaster and D. persimilis strongly avoid.
  source: Results, Thermal preference in Drosophila species, paragraph 3; Figure 1d
  quote: D. mojavensis prefers distinctly hot conditions9,14 (30–35 °C; Fig. 1d), conditions that were
    strongly avoided by both D. melanogaster and D. persimilis
  data: elsewhere
  where: Nature Source Data for doi:10.1038/s41586-025-08682-z (41586_2025_8682_MOESM3_ESM.xlsx), sheets
    Figure1b, Figure1c and Figure1d
  criterion: Two-tailed one-sample t-test of the group PIs against zero at 0.05 per test temperature
    (Methods). Reproduced when the D. mojavensis PI is significantly negative at 30 and 35 C and the
    D. melanogaster and D. persimilis PIs are significantly positive at 30 and 35 C. Partially
    reproduced when the D. mojavensis part holds alone. The Figure1d 40 C column equals the wild-type
    45 C values of sheet EDFigure2; it is not used here.
