  data: elsewhere
  where: Nature Source Data for doi:10.1038/s41586-025-08682-z (41586_2025_8682_MOESM3_ESM.xlsx), sheet
    Figure2n (per-cell thresholds; the recordings are not deposited)
  criterion: Means of the per-cell thresholds. The legend calls the pairwise P values "one-way analysis
