  source: STAR Methods, Experimental Model and Subject Details, paragraph 1
  quote: independent-samples t tests with equal variance confirmed that the control group matched
    on demographics (age t1,32 < 0.36, p > 0.72; education t1,32 < 1.22, p > 0.23; variance
    F13,19 < 1.31, one-tailed p > 0.31)
  statistics:
  - about: age, patients against controls
    test: independent-samples t test, equal variance
    statistic: t(1,32) < 0.36
    p: 0.72
    p_relation: ">"
  - about: education, patients against controls
    test: independent-samples t test, equal variance
    statistic: t(1,32) < 1.22
    p: 0.23
    p_relation: ">"
  - about: variance, patients against controls
    test: F test of variances, one-tailed
    statistic: F(13,19) < 1.31
    p: 0.31
    p_relation: ">"
  expected:
  - quantity: patient mean age
    value: 46
    tolerance: 16
    unit: years
  - quantity: control mean age
    value: 44
    tolerance: 19
    unit: years
  criterion: A claim of absence, judged on the paper's tests. Two-tailed independent-samples t
    tests with pooled variance on age and on years of education, 14 patients against 20
    controls, and a one-tailed F test of variances with 13 and 19 degrees of freedom (patients
    in the numerator). The paper does not say which variable's variance was tested; readings
    (a) age, (b) education, (c) both. Reproduced when none of the tests gives p < 0.05; not
    reproduced when one does. The t, F and p values are reported either way.
- id: patient-factors-no-effect
  statement: In patients, no lesion or demographic factor (lesion hemisphere, etiology, size,
    years since lesion, age, gender, education, IQ) nor visual hemifield or condition has a
    significant effect on accuracy, which permits pooling the patients into one group.
  source: Results, Behavior, paragraph 1; Table S2
  quote: No significant effects were observed (p > 0.14; Table S2), permitting the normalization
    of patient data into one group [24].
  statistics:
  - test: repeated-measures mixed ANCOVA
    p: 0.14
    p_relation: ">"
    n: 14 patients
  criterion: A claim of absence, judged on the paper's test (STAR Methods, Behavioral Analysis;
    Table S2). Patient accuracy per visual hemifield (lesion, intact) and condition (identity,
    spatial, temporal) in a repeated-measures ANCOVA with lesion hemisphere, etiology (stroke
    against tumor resection, one degree of freedom as Table S2 gives), lesion size, years
    elapsed, age, gender, education and IQ as between-subject terms, and the terms Table S2
    lists (hemisphere by etiology, hemisphere by gender, etiology by gender, and their
    interactions with the within-subject factors). Reproduced when no term has p < 0.05; not
    reproduced when one does. All F and p values are reported against Table S2. The
    per-patient covariates are in Table S1; whether the data set holds them is the author's to
