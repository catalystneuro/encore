claims:
- id: cohort-and-trials
  statement: The study has 14 unilateral PFC patients and 20 age- and education-matched
    controls; after cleaning, subjects kept on average 187 trials, 94 +- 21 (55 to 119) in the
    lesioned and 93 +- 22 (51 to 120) in the intact visual hemifield.
  source: Results, paragraph 1; STAR Methods, Data Preprocessing, EEG Cleaning, last sentence
  quote: 'Fourteen unilateral PFC patients (mean ± SD: 46 ± 16 years of age; 15 ± 3 years of
    education; Figures 1A and S1; Table S1) and 20 age- and education-matched healthy controls
    ... The final dataset included an average of 187 trials per subject (mean ± SD [range]
    trials: 94 ± 21 [55-119] lesioned visual hemifield, 93 ± 22 [51-120] intact visual
    hemifield).'
  expected:
  - quantity: patients
    value: 14
    tolerance: 0
  - quantity: controls
    value: 20
    tolerance: 0
  - quantity: mean trials per subject after cleaning
    value: 187
    tolerance: 18.7
  - quantity: mean trials, lesioned visual hemifield
    value: 94
    tolerance: 21
  - quantity: mean trials, intact visual hemifield
    value: 93
    tolerance: 22
  criterion: Subjects are counted, and trials are counted per subject and visual hemifield
    after all exclusions. The paper does not say whether these counts include incorrect trials.
    Readings (a) all trials kept after cleaning; (b) correct trials only. Means use the paper's
    SD as tolerance. The ranges hold when the minimum and maximum fall within 55 to 119 and 51
    to 120 widened by 10% of each bound.
