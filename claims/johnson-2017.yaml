    trial or two of exclusion moves the value by 0.01 to 0.02; 10% of the value would not tell
    patients apart). Reproduced when at least 26 of the 28 values are within tolerance;
    partially reproduced for 20 to 25. Readings for the denominator (a) all trials after the
