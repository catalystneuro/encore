  statement: A post hoc network analysis of delta-theta PSI shows group differences from
    lesioned PFC to bilateral central-posterior regions, sustained for 200 ms early in active
    processing, for both visual hemifields.
  source: Results, Task-Induced Directional Connectivity, paragraph 4; Figure 3, right
  quote: Cluster-based permutation testing of network data revealed group effects from lesioned
