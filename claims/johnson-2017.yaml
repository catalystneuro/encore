  source: Results, Task-Induced Power, paragraph 3; Figure S4
  quote: increased parieto-occipital activity in the betagamma range (12–35 Hz) and narrowband
    alpha desynchronization marked visual processing during encoding, followed by widespread
    alpha-beta (9–24 Hz) decreases throughout maintenance
  statistics:
  - about: alpha-beta at maintenance
    test: bootstrapped Z against the pretrial baseline
    statistic: '|Z| > 1.96'
    p: 0.05
    p_relation: "<"
  - about: alpha-beta at active processing
    test: bootstrapped Z against the pretrial baseline
    statistic: Z < -3.29
    p: 0.001
    p_relation: "<"
  criterion: Z-scored power with the shared methods over the POSTERIOR channels of Figure S4 (P1,
