- id: accuracy-patients-impaired
  statement: PFC patients are less accurate than controls (mean +- SD 0.87 +- 0.08 against 0.95
    +- 0.03), a group effect with p < 7 x 10^-5 in the mixed-effects model with group as the only
    fixed effect.
  source: Results, Behavior, paragraph 2; Figure 1C; Table S3
  quote: 'Results revealed that PFC patients were impaired at the task relative to controls (mean
    ± SD correct: controls 0.95 ± 0.03 versus patients 0.87 ± 0.08'
  statistics:
  - about: group, model with group as the only fixed effect
    test: mixed-effects model (fitglme)
    statistic: F(1,202) = 16.77, Cohen's d = 1.47
    p: 0.00007
    p_relation: "<"
    n: 14 patients and 20 controls
  - about: group, full model with group, visual hemifield and condition
    test: mixed-effects model (fitglme)
    statistic: F(1,196) = 4.70, Cohen's d = 0.78
    p: 0.03
    corrected: does not survive Bonferroni over 7 effects (alpha 0.0071)
  expected:
  - quantity: control mean accuracy
    value: 0.95
    tolerance: 0.03
  - quantity: patient mean accuracy
    value: 0.87
    tolerance: 0.08
  - quantity: F of group, group-only model
    value: 16.77
    tolerance: 1.68
  criterion: The model is from STAR Methods, Behavioral Analysis, and Table S3. The Results
    sentence puts group p < 7 x 10^-5 after the full model, but Table S3 gives the full model's
    group effect p = 0.03 and its legend ties p < 7 x 10^-5 to the re-submitted models; F(1,202)
    = 16.77 of the group-only model gives p = 6.1 x 10^-5, so the bound is that model's. Its rows are
    read as the 204 subject by visual hemifield by condition accuracies (34 x 6), with a random
    intercept per subject; the denominator degrees of freedom of Table S3 (196, 202, 200) fit
    this and a condition term of one degree of freedom (condition coded as one number). The
    paper calls the model "logit mixed-effects" in the Results and "linear mixed-effects" in
    the Methods. Readings (a) a Gaussian (linear) model on the cell accuracies; (b) a binomial
    logit model on the cells, weighted by trial counts; (c) condition as a three-level factor
    instead of one number. Group means are over each subject's accuracy, read (a) over all the
    subject's trials or (b) as the mean of its six cells. Reproduced when, under one reading,
    both means are within tolerance and the group effect of the group-only model has p < 7 x
    10^-5 with patients lower; partially reproduced when the means hold and p < 0.0071 (the
    paper's Bonferroni level). The full model's group effect is reported as well.
