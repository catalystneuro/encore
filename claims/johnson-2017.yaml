- id: table-s1-patient-accuracy
  statement: Each patient's accuracy in the lesioned and intact visual hemifield is as Table S1
    lists, from 0.65 to 0.98.
  source: Table S1
  inferred: Numbers from Table S1 (Accuracy, Lesion VHF and Intact VHF columns); no sentence of
    the text states them.
  criterion: Accuracy per patient and visual hemifield as the fraction of correct trials after
    the eye-gaze exclusion. Patients are matched to Table S1 rows by subject number if the data
    set numbers them alike, otherwise by lesion hemisphere, etiology, age and gender. Tolerance
