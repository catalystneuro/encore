# Claims for Johnson, Dewar, Solbakk, Endestad, Meling & Knight (2017), Current Biology 27,
# 1829-1835, "Bidirectional Frontoparietal Oscillatory Systems Support Working Memory",
# doi:10.1016/j.cub.2017.05.046, on CRCNS data set pfc-5 (doi:10.6080/K0ZC811B).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-09,
# protocol as stated in docs/protocol.md (Reader), version pilot-14.
#
# Text read: the version of record with its supplemental information, as supplied under paper/
# (PDF extracted to text): main text (Results, Discussion), figure legends 1 to 4, STAR Methods
# (pages e1 to e4), and the supplement (legends of Figures S1 to S4, Tables S1 to S3, read from
# the text). The PDF could not be rendered in this run, so the figures themselves were not read:
# the channel list of the Figure 2 cluster (the PFC region of interest of the PSI analysis) and
# the time courses of Figures 2 to 4 are known only from the text and legends. The extraction
# garbles symbols: "3" stands for the multiplication sign, "/" for an arrow, "%" for less than
# or equal, "R" for greater than or equal, "jZj" for |Z|, and a replacement character for the
# minus sign in exponents. Quotes keep the extracted characters. The CRCNS data descriptor
# (paper/pfc-5.data-description.txt) was read only to know what the data set holds; no claim or
# method comes from it.
#
# Code. The paper's Key Resources Table and Data and Software Availability say the custom MATLAB
# code is deposited with the data at CRCNS (http://crcns.org). By the data descriptor it is the
# analysis_scripts directory of pfc-5 itself (<metric>_compute, <metric>_stat_group,
# <metric>_stat_group_hem, subfunctions; FieldTrip). Being among the data set's files, it was
# not read in this run, and no commit is recorded. Every method below is from the paper's text.
# Where those scripts settle a detail named as open below, the author may follow them (protocol,
# Reader step 2) and should say so.
#
# Data the paper used (Experimental Model and Subject Details; Behavioral Task; Data
# Acquisition; Data Preprocessing). 14 patients with unilateral lateral PFC lesions (7 left, 7
# right; 5 stroke tested in Berkeley, 9 low-grade tumor resection tested in Oslo; 46 +- 16 years,
# 5 males) and 20 healthy controls (44 +- 19 years, 11 males, all Berkeley). Per-patient lesion
# hemisphere, etiology, size, years since lesion, age, gender, education, IQ and accuracy by
# visual hemifield in Table S1. One session of 240 trials (at least 120 completed by every
# subject), six bins of visual hemifield (left, right) by condition (identity, spatial relation,
# temporal relation). Trial: 2 s pretrial fixation, start screen (IDENTITY or RELATION), 100 ms
# fixation, two shapes of 200 ms each to one hemifield, a 900 or 1150 ms jittered maintenance
# interval, a test prompt, an active processing interval of the same length as the maintenance,
# then a two-alternative forced choice. 64-channel BioSemi EEG at 1024 Hz with EOG and earlobe
# references; eye tracking used to drop trials in which gaze reached the ipsilateral hemifield.
# Preprocessing: earlobe reference, 256 Hz, 1 to 70 Hz FIR, EMG removal (AAR), line noise
# removal, ICA, channel interpolation, manual trial rejection (on average 187 trials per
# subject kept). Then the surface Laplacian, swapping of channels across the midline for the 7
# right-lesioned patients and 10 randomly chosen controls, so that the lesion is on the left, and
# three segments per trial: pretrial baseline (550 to 50 ms before the start screen), encoding
# and maintenance (1500 ms from first stimulus onset; the second stimulus ends at 400 ms), and
# active processing (900 ms from the offset of the test prompt). Measured variables: accuracy,
# ERPs, baseline power spectra, task-induced power, and phase slope index (PSI) between channels.
# "Lesioned visual hemifield" trials are those whose stimuli went to the hemifield contralateral
# to the lesion (Table S1 note).
#
# Methods shared by the EEG claims below, from STAR Methods (Spectral Decomposition; Phase Slope
# Index; Statistical Bootstrapping; Cluster-Based Permutation Testing), fixed for every criterion
# that cites "the shared methods":
# - Correct trials only, except the baseline spectra (all trials). Each visual hemifield is
#   analysed separately.
# - Power, per subject: time-frequency representations at each frequency 1 to 40 Hz with a
#   Hanning-tapered window of 3 cycles (3/f), 10 ms steps, segments zero-padded to 7500 ms. The
#   baseline power of all correct trials and time points is pooled per channel and frequency;
#   r values are drawn and averaged (r = the subject's trial count), 1000 times; the mean task
#   power is Z scored on that distribution.
# - PSI, per subject: the mean over correct trials (per visual hemifield) subtracted from each
#   trial; the same time-frequency analysis in 100 ms steps; cross-spectra per frequency; PSI
#   (Nolte et al. 2008) over 2 to 7 Hz (delta-theta) and 9 to 24 Hz (alpha-beta) for every
#   channel pair. Null: frequency bins shuffled per channel pair and time point and PSI
#   recomputed, 1000 times; raw PSI Z scored on the null. Encoding-maintenance and processing Z
#   then have the temporal mean of the baseline Z subtracted. Positive PSI from A to B means A
#   leads.
# - Group tests: Monte Carlo cluster-based permutation (FieldTrip), independent-samples t test
#   between patients (14) and controls (20), cluster-forming threshold 0.05 two-tailed, cluster
#   size the sum of t, 1000 shuffles of group labels, cluster p < 0.05. Clusters over spatial
#   adjacency and over time and/or frequency "as appropriate".
# - Group by hemisphere interaction: a lesion-minus-intact index (e.g. F5 minus F6) for each
#   non-midline channel pair, in both groups, then the group test on the index.
#
# Details the paper leaves open, shared by several criteria (each criterion names those it
# needs):
# - O1, channel neighbours for spatial clustering. Not given. Readings (a) FieldTrip's
#   biosemi64 neighbour template; (b) neighbours by triangulation of the electrode positions.
# - O2, which dimensions are clustered "as appropriate". Readings (a) channels by time by
#   frequency (1 to 40 Hz) for power, channels by time for ERPs and band PSI; (b) channels by
#   time on the band average named in the claim (3 to 4 Hz, 2 to 7 Hz, 9 to 24 Hz).
# - O3, the hemisphere index. "on all 54 non-midline channels" with "subtracting the signal in
#   each intact-hemisphere channel from its lesioned-hemisphere homolog". Readings (a) 27
#   indices placed at the lesioned-hemisphere (left) positions; (b) 54 values, each channel
#   minus its homolog.
# - O4, which 10 controls were swapped across the midline: "randomly chosen". Readings (a) the
#   swap already in the deposited preprocessed data, if it is there; (b) several random draws
#   of 10, all shown.
# - O5, the surface Laplacian's parameters. Not given; FieldTrip's ft_scalpcurrentdensity
#   spline defaults are the standard choice. Whether the deposited preprocessed data already
#   carry it is the author's to find.
# - O6, the PFC region of interest for the PSI time courses ("the lesioned PFC region of
#   interest, as identified in the analysis of power asymmetry (see Figure 2)"). The text does
#   not list its channels. Readings (a) the lesioned-hemisphere anterior channels of the
#   significant cluster found under claim power-lowtheta-interaction; (b) the ANTERIOR channels
#   of Figure S4, AF7-F5-F7-FC5-FT7. Its partners, "parieto-occipital channels in the same
#   hemisphere", are read as P1-P3-P5-P7-P9-PO3-PO7-O1, the left posterior set Figures S3 and
#   S4 name.
# - O7, the group summary behind a thresholded Z ("single-subject analyses revealed ... Z >
#   1.96" on a figure of group means). Readings (a) the group mean of the subjects' Z crosses
#   the threshold; (b) most subjects' Z crosses it.
schema_version: 2
