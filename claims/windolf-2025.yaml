# Claims for Windolf et al. (2025), "DREDge: robust motion correction for high-density
# extracellular recordings across species", Nature Methods, doi:10.1038/s41592-025-02614-5, on
# dandiset 001290.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the accepted author manuscript in PubMed Central (PMC13055889, NIHMS2068114), main
# text, Methods, figure and Extended Data legends, Extended Data Table 1, and the supplement
# (NIHMS2068114-supplement-supplementary.pdf, supplementary text and the legends of
# Supplementary Figs. 1 to 18), as stored in paper/10.1038-s41592-025-02614-5.txt. The Extended
# Data figures themselves were not available as images; only their legends were read. No PDF
# of the main text was available.
#
# Code read: github.com/evarol/dredge at commit ed236113 (DREDge AP and LFP registration,
# motion_util, demo notebooks); github.com/williamunoz/InterpolationAfterDREDge at commit
# 0041079b (MATLAB LFP interpolation); github.com/Center-For-Neurotechnology/
# HumanNeuropixelsPipeline at commit d74413cb (human data pipeline). None of them holds the
# spline-based fast motion method (HDBSCAN clustering and spline fit) of Extended Data Fig. 3,
# and the paper links no code for it. The code settles one detail the Methods give differently:
# dredge_ap.register applies no Gaussian smoothing to the raster by default
# (gaussian_smoothing_sigma_um and _s are None), while the Methods say the raster is smoothed
# at 1 um and 1 s scale; the Methods are followed and the code's choice is a variant.
#
# What the dandiset is meant to hold. The Data availability says "the fast-motion NHP dataset of
# Extended Data Fig. 3 is available at DANDI (https://dandiarchive.org/dandiset/001290/)". The
# archive's title is "Neuropixels pulsation datasets", Macaca nemestrina, one subject, one NWB
# file; its description names a recording by RT Raghavan in the Movshon lab, "Studied in Supp.
# Fig. 3" (the preprint's numbering). The Methods describe this recording: an anesthetized,
# paralyzed macaque (ketamine induction, sufentanil infusion, vecuronium neuromuscular
# blockade), with a Neuropixels array or a two-shank 128-channel NeuroNex silicon array
# inserted through a craniotomy and durotomy, during visual noise stimulation at 40 Hz on a CRT.
# The paper gives no session length, probe channel map or spike counts for it. The measured
# variable is the extracellular voltage; spikes are detected and localized from it, and their
# positions along the probe over time are the input to motion estimation.
#
# One inconsistency is left open. The Results tie the spline method of Extended Data Fig. 3 to
# Fig. 2b, a "human recording" from ref. 13 (Paulk et al. 2022), and the Fig. 2b legend calls it
# "a human intraoperative recording snippet"; the Methods and the Data availability place
# Extended Data Fig. 3 in this macaque recording. The claims on Fig. 2b are therefore recorded
# as data elsewhere (the human recording of ref. 13), and only the Extended Data Fig. 3 claims
# use this dandiset.
#
# All other findings of the paper rest on data deposited elsewhere (human recordings on Dryad
# and DANDI:000397, IBL data on AWS, Figshare imposed-motion data, DANDI:000957 NP Ultra,
# DANDI:001282 macaque insertion, G-node rat data, MEArec simulations). They are listed so the
# paper's main findings are covered, with data elsewhere.
#
# Pipeline for the Extended Data Fig. 3 claims, as the paper and code fix it (each criterion
# below refers to it as "the pipeline"):
#  1. AP band 300 to 6,000 Hz (Methods, Preprocessing of AP band data, paragraph 1). The
#     Methods say the filtering, detection and localization "were chosen to suit each data
#     source" and do not say what was chosen for this recording. The only spike pipeline they
#     describe is the IBL one (high-pass filtering, phase shift correction, dead and noisy
#     channel detection, spatial high-pass filtering, channel-wise standardization) run in
#     SpikeInterface, then spike detection, denoising and point-source localization with
#     DARTsort (ref. 37, 38) (Methods, Mouse brain activity in vivo data). Since detection and
#     localization can change the spike positions every later step uses, two readings are run:
#     (i) that pipeline; (ii) SpikeInterface detect_peaks (locally_exclusive, threshold 6, both
#     signs) and localize_peaks (monopolar_triangulation, radius 75 um), as in the dredge
#     repository's notebook/ap_registration.ipynb. Every "combination of readings" in the
#     criteria below includes readings (i) and (ii) of this step.
#  2. Spike raster of 1 um by 1 s bins of log(1 + x)-transformed amplitudes summed and
#     transformed again with log(1 + x), smoothed with a Gaussian at 1 um and 1 s (Methods,
#     Preprocessing of AP band data, and Setting parameters, paragraph 4). Correlation threshold
#     0.1 (AP), time horizon 1,000 s (Setting parameters, paragraphs 3 and 4); lambda_T and
#     lambda_S set to 1 (Methods, Robust decentralized registration). Extended Data Table 1 has
#     no row for this recording, so rigid against nonrigid registration and the window
#     parameters are open; the readings are (a) nonrigid with the code defaults (win_step_um
#     400, win_scale_um 450, max_disp_um win_scale_um / 4) and (b) rigid. The legend says only
#     "AP DREDge displacement estimate".
#  3. Fast motion (Methods, Tracking fast motion from spikes using clustering and splines):
#     HDBSCAN clusters high-amplitude spikes on DREDge-corrected locations and amplitude
#     features; each cluster's centroid is subtracted; points more than five standard
#     deviations from the cluster mean are removed; one smoothing spline with 2.5 knots per
#     second is fit to all centered positions at once. Open, with no source fixing them: the
#     amplitude cut for "high-amplitude" spikes (readings: the top 10% and the top 25% of
#     amplitudes); which location coordinates enter HDBSCAN (readings: depth and lateral
#     position with amplitude, or depth with amplitude); feature scaling (z-scored features as
#     the standard choice); HDBSCAN min_cluster_size (readings: 25 and 100 spikes); the spline
#     degree (cubic, a standard choice) and whether a roughness penalty is added (readings: a
#     least-squares cubic spline with interior knots every 0.4 s; a penalized cubic spline on the
#     same knots with the penalty chosen by generalized cross-validation). The spline models the
#     depth coordinate only, the axis along which the motion is estimated. Whether the paper used
#     the whole recording or a snippet is not said; the whole recording is used, and the
#     snippet length shown cannot be known from the text.
schema_version: 2
dataset:
  archive: dandi
  id: "001290"
paper: doi:10.1038/s41592-025-02614-5
claims:
- id: edf3a-ap-dredge-slow-trend
  statement: In the fast-motion macaque recording, DREDge's spike-based (AP) motion estimate
    follows the drift visible in the unregistered spike raster.
  source: Extended Data Fig. 3a legend; Methods, Tracking fast motion from spikes using
    clustering and splines
  quote: a Spike raster before registration, with AP DREDge displacement estimate overlaid in red.
  data: dataset
  criterion: The legend shows the estimate over the raster and states no result in words; that
    it follows the slow drift is read from the Methods ("First, slower timescale motion is
    estimated using DREDge"). Run the pipeline (opening comment, steps 1 and 2) on the whole recording. The paper
    shows this only as a figure, so the measure is the paper's own registration quality metric,
    the mean template correlation (Methods, Spike registration quality metrics) on a 1 um by 1 s
    raster of mean spike amplitudes, bins outside the probe after correction masked. Reproduced
    when, under readings (a) and (b) of step 2 and (i) and (ii) of step 1, the mean template correlation after DREDge
    correction exceeds that of the unregistered raster; not reproduced when it is lower under
    all; methods_underspecified when the readings disagree. The size of the estimated
    displacement (range and s.d. in um) and the plot of the trace over the raster are reported.
    That a small improvement may reflect little drift in an anesthetized, paralyzed animal is
    noted, not judged.
- id: edf3b-hdbscan-clusters
  statement: After AP DREDge registration, high-amplitude spikes form clusters that HDBSCAN
    isolates using their registered positions and amplitudes.
  source: Extended Data Fig. 3b legend; Results, DREDge rescues spike sorting and LFP features
    in human brain activity, paragraph 1
  quote: Colored spikes represent high amplitude spikes that were clustered by HDBSCAN using their
    registered positions and amplitudes.
  data: dataset
  depends_on:
  - edf3a-ap-dredge-slow-trend
  criterion: Pipeline step 3, HDBSCAN on the DREDge-registered spikes, under each combination of
    the open readings named there (amplitude cut, coordinates, min_cluster_size) and of
    registration readings (a) and (b). The legend shows several colored clusters and gives no
    count, so the claim holds when HDBSCAN returns at least two clusters other than noise.
    Reproduced when every combination does; not reproduced when none does;
    methods_underspecified otherwise. The number of clusters and spikes per cluster are
    reported for each.
- id: edf3c-spline-subsecond
  statement: A smoothing spline fit to the centered positions of the clustered spikes captures
    sub-second displacement left after AP DREDge registration.
  source: Extended Data Fig. 3c legend; Methods, Tracking fast motion from spikes using
    clustering and splines
  quote: Left, centered positions of the clustered spikes (blue) with the spline fit, that captures
    the sub-second displacement, overlaid in red.
  data: dataset
  depends_on:
  - edf3b-hdbscan-clusters
  criterion: Pipeline step 3 under each combination of its open readings. The paper gives no
    number and no test for this panel. The control is borrowed from another panel of the paper,
    the "randomly permuted or 'scrambled'" motion estimate of Fig. 2e (legend), which the paper
    uses for ISI violations, not for this figure, and whose permutation unit it does not give.
    For each combination, the pooled within-cluster s.d. of corrected depth of the clustered
    spikes is computed after correction by the spline and after correction by the same spline
    trace with its time bins randomly permuted. The permutation bin (0.4 s, the knot spacing),
    the 100 permutations with a fixed seed and the one-sided 5% level are choices of this file,
    not of the paper. Reproduced when, in every combination, the spline-corrected s.d. is below
    the 5th percentile of the scrambled s.d. values; not reproduced when in none;
    methods_underspecified otherwise. The spline
    trace's range and s.d. (um) and its power spectrum are reported, as is the noted
    circularity that the spline is fit to the spikes it is evaluated on.
- id: edf3de-spline-improves-registration
  statement: Correcting the AP-registered spikes with the spline estimate of sub-second
    displacement gives a more stable spike raster and tighter spike localizations than AP
    DREDge registration alone.
  source: Extended Data Fig. 3d and 3e legends; Results, DREDge rescues spike sorting and LFP
    features in human brain activity, paragraph 1
  quote: d Top, AP registered spike raster. Bottom, AP registered spike raster corrected using the
    spline estimate of sub-second displacement. e Localizations of detected spikes after AP
    DREDge registration (left), and spline correction (right).
  data: dataset
  depends_on:
  - edf3c-spline-subsecond
  criterion: The legends show the comparison and state no result in words; the improvement is
    read from the Results, which call the spline estimate "a faster timescale AP-based
    estimate". Two measures, one per panel, both from the paper. Panel d, the mean template
    correlation (Methods, Spike registration quality metrics) of all detected spikes, on the 1
    um by 1 s raster of mean amplitudes, after AP DREDge correction and after AP DREDge plus
    spline correction (the spline displacement subtracted from each spike's registered depth at
    its time). Panel e, the pooled within-cluster s.d. of corrected depth over the HDBSCAN
    clusters, before and after spline correction; the paper names no measure for panel e, so
    this one is the file's choice, and since the spline is fit to minimize these residuals it
    is reported with that circularity noted. The 1 s bins of the template correlation are the
    Methods' and cannot show motion faster than 1 s, so the panel d measure is also reported
    at 0.1 s bins as a variant that does not enter the outcome. Reproduced when both measures improve (higher
    correlation, lower s.d.) under every combination of the open readings of steps 2 and 3;
    not reproduced when neither improves under any; partially reproduced when one measure
    improves under every combination and the other does not; methods_underspecified when the
    readings disagree. The size of each change is reported.
