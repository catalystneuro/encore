    across the 10 cells. Reproduced when the largest mean |dF| at each pole is within tolerance,
    and, as with 1-us pulses (fig4b-cathodic-asymmetry), the mean |dF| at both poles declines at
    the field strengths above the one giving the maximum, more at the cathodic pole. The paper
    gives no test for "not different"; none is applied.
- id: fig5a-gd-extends-anodic
  statement: With 1 mM Gd3+ the anodic pole charged to -864 +- 44 mV, against -542 +- 57 mV in
    parallel controls (p < 0.001).
  source: Figure 5A; Results 3.5, paragraph 1
  quote: Indeed, we found that 1 mM Gd3+ extended the range of membrane charging at the anodic
    pole down to −864 ± 44 mV (p < 0.001 compared to −542 ± 57 mV in parallel control
    experiments, Fig. 5A).
  statistics:
  - test: 2-tailed t-test (Fig. 5 legend)
    p: 0.001
    p_relation: "<"
    n: 7 cells with Gd3+, 5 control cells
  expected:
  - quantity: most negative anodic IMP with 1 mM Gd3+
    value: -864
    tolerance: 44
    unit: mV
  - quantity: most negative anodic IMP in controls
    value: -542
    tolerance: 57
    unit: mV
  criterion: Tolerances are the paper's s.e. Collapsed anodic pole dF converted to IMP (dF /
    9.1%), per cell and field strength (150 to 1400 V/cm). Which datapoints are compared is not
    stated; readings (a) the most negative group mean over field strengths in each group,
    compared at those strengths, (b) the two groups at the same field strength, at the strength
    giving the Gd3+ minimum, (c) each cell's own most negative value. Two-tailed unpaired
    t-test. Reproduced when under one reading both values are within tolerance and p < 0.001.
- id: fig5a-gd-linear
  statement: With Gd3+, the measured IMP stayed nearly identical to IMPC down to -780 mV, so the
    Di-8-ANEPPS calibration holds at high IMPs.
  source: Figure 5A; Results 3.5, paragraph 1
  quote: Furthermore, measured IMP remained nearly identical to the theoretical IMPC down to −780
    mV, indicating that the dye response remained linear and its calibration was valid even at
    high IMPs.
  data: with_inputs
  criterion: A claim of absence of a deviation. Gd3+ group, anodic pole, every field strength
    whose mean IMPC is -780 mV or less negative; measured IMP against IMPC by a 2-tailed paired
    t-test at p < 0.05 (n = 7; the Student's t-test of Methods 2.5). Reproduced when none
    differs; not reproduced when any does. The ratio of measured to calculated is reported.
- id: fig5a-gd-cathodic
  statement: At the cathodic pole Gd3+ cells reached 647 +- 44 mV, not significantly above
    controls, but Gd3+ prevented the decline of IMP with stronger fields.
  source: Figure 5A; Results 3.5, paragraph 2
  quote: At the cathodic pole, polarization in the presence of Gd3+ reached 647 ± 44 mV, a value
    not significantly higher than that in the control group without Gd3+. However, Gd3+
    prevented the progressive decline in IMP as the electric field was increased.
  expected:
    quantity: largest cathodic IMP with 1 mM Gd3+
    value: 647
    tolerance: 44
    unit: mV
  criterion: Tolerance is the paper's s.e. Collapsed cathodic pole IMP per cell and field strength.
    The comparison with controls is a claim of absence, judged on the 2-tailed t-test of the
    Fig. 5 legend at p < 0.05, Gd3+ (n = 7) against control (n = 5), with the readings for which
    datapoints of fig5a-gd-extends-anodic. "Prevented the progressive decline" has no test;
    read as the Gd3+ mean cathodic IMP at 1200 and 1400 V/cm being no lower than its maximum by
    more than the s.e., while the control mean declines from its maximum. Reproduced when the
    value is within tolerance, no reading finds Gd3+ significantly higher, and the decline
    condition holds.
- id: fig5a-gd-differences
  statement: Gd3+ and control data differ significantly for datapoints with IMPC below -700 mV
    and above 1200 mV.
  source: Figure 5A legend
  quote: Differences between Gd3+ and control group data are significant at p < 0.05 or better
    (2-tailed t-test) for datapoints below −700 mV and above 1200 mV.
  statistics:
  - test: 2-tailed t-test
    p: 0.05
    p_relation: "<"
    n: 7 cells with Gd3+, 5 control cells
  data: with_inputs
  criterion: Datapoints are field strengths, placed by their mean IMPC (the x axis of Fig. 5A,
    which the "mV" bounds refer to). For each field strength and pole, measured IMP of the Gd3+
    against the control cells by a 2-tailed unpaired t-test. Reproduced when every datapoint
    with mean IMPC below -700 mV or above 1200 mV differs at p < 0.05.
- id: fig5b-conductivity-calibration
  statement: By Eq. (2), the effective membrane conductivity barely affects charging while it
    stays far below cytosol and medium conductivities; a 10-fold rise reduces IMP by about 2% and
    a 100-fold rise by 12%.
  source: Figure 5B; Results 3.5, paragraph 3
  quote: its 10-fold increase would go unnoticed, yielding just a ~2% IMP reduction, and a
    100-fold increase would reduce IMP by just 12%.
  expected:
  - quantity: IMP reduction for a 10-fold increase from 3e-7 S/m
    value: 2
    tolerance: 0.2
    unit: "%"
  - quantity: IMP reduction for a 100-fold increase from 3e-7 S/m
    value: 12
    tolerance: 1.2
    unit: "%"
  criterion: A computation from Eq. (2) with the constants of Methods 2.3 (lambda_i 0.4 S/m,
    lambda_o 1.64 S/m, R 8 um, d 5 nm, intact lambda_m 3e-7 S/m); it uses no recordings. The
    reduction is relative to IMPC, readings (a) 1 - f/1.5, (b) 1 - f(lambda_m)/f(3e-7 S/m).
    Reproduced when both values are within tolerance under one reading.
- id: fig5c-gd-reduces-conductivity
  statement: For most datapoints, Gd3+ reduced the electroporation-induced effective membrane
    conductivity 2 to 3-fold.
  source: Figure 5C; Results 3.5, paragraph 4
  quote: For most datapoints, Gd3+ reduced the electroporation- induced effective conductivity
    2–3-fold.
  data: with_inputs
  depends_on:
  - fig5b-conductivity-calibration
  expected:
    quantity: control over Gd3+ effective conductivity ratio (range 2 to 3, widened to 1.8 to
      3.3)
    value: 2.55
    tolerance: 0.75
    unit: fold
  criterion: For each field strength and pole, the ratio of mean measured to mean calculated IMP
    in each group (Fig. 5C uses the datapoints of Fig. 5A, mean values), converted to effective
    conductivity through Eq. (2) as in fig5b-conductivity-calibration. Datapoints whose measured
    IMP is not below IMPC give no conductivity increase and are left out. Reproduced when more
    than half of the remaining datapoints have a control-to-Gd3+ ratio between 1.8 and 3.3.
- id: fig6a-ca-single-pulse
  statement: A single 1-us pulse caused clear Ca2+ entry at 1000 and 1200 V/cm, with the signal
    elevated through 5 min; the small rise at 780 V/cm was not significant.
  source: Figure 6A; Results 3.6, paragraph 2
  quote: Exposure to a single 1-μs pulse at escalating field strengths, from 0 to 1200 V/cm
    established a clear peak of Ca2+ entry at 1000 and 1200 V/ cm, and Ca2+ signal remained
    elevated through the 5-min observation period (Fig. 6A). A subtle ΔF increase after exposure
    at 780 V/cm was at the detection limit and not statistically significant.
  criterion: Fluo-4 dF (Methods 2.4), background-subtracted, F0 the mean before the pulse, 14
    cells. The test is not named; the paper uses a one-sample t-test against zero for the
    pulse-train Ca2+ data (Results 3.6), applied here at p < 0.05. The window is not given;
    readings (a) the peak frame after the pulse, (b) the last 30 s of the recording. Reproduced
    when at 1000 and 1200 V/cm dF is significantly above zero under both windows, and at 780
    V/cm it is not under reading (a) (a claim of absence, judged on that test).
- id: fig6b-ca-train-responders
  statement: After a train of sixty 1-us pulses at 6 Hz, 28% of cells responded strongly at 780
    V/cm and nearly all at higher field strengths.
  source: Figure 6B; Results 3.6, paragraph 3
  quote: A strong Ca2+ response was recorded in 28% of cells exposed at 780 V/cm and in nearly
    all cells at higher intensities (Fig. 6B).
  expected:
    quantity: fraction of strongly responding cells at 780 V/cm
    value: 28
    tolerance: 2.8
    unit: "%"
  criterion: Each cell exposed once; Fluo-4 dF as in Methods 2.4. The paper does not define a
    strong response. Readings (a) peak dF after the train above the mean plus 3 s.d. of the
    pre-train baseline of the same cell, (b) peak dF above 50%, (c) peak dF above 100%. Reproduced
    when, under one reading, the 780 V/cm fraction is within tolerance, at least 90% of cells
    respond at each higher strength, and the 650 V/cm fraction is 2 cells (5.9%).
- id: fig6b-ca-650
  statement: At 650 V/cm only 2 cells (5.9%) responded strongly, yet the mean Ca2+ signal at the
    end of recording differed from zero (p < 0.001) and was marginally higher than at 230 V/cm
    (p < 0.05).
  source: Figure 6B; Results 3.6, paragraph 3
  quote: At 650 V/cm, only 2 cells (5.9%) showed a strong response, but the mean Ca2+ signal by
    the end of recording was significantly different from zero (p < 0.001, one sample t-test)
    and marginally higher than after exposure at 230 V/cm (p < 0.05, single-tailed t-test).
  statistics:
  - about: 650 V/cm mean signal at the end of recording against zero
    test: one sample t-test
    p: 0.001
    p_relation: "<"
    n: about 34 cells (2 cells are 5.9%)
  - about: 650 against 230 V/cm
    test: single-tailed t-test
    p: 0.05
    p_relation: "<"
  criterion: Fluo-4 dF per cell (Methods 2.4). "By the end of recording" is not defined; readings
    (a) the last frame, (b) the mean of the last 10 s, (c) the mean of the last 30 s. One-sample
    t-test against zero at 650 V/cm; one-tailed unpaired Student's t-test of 650 against 230
    V/cm. Reproduced when under one reading both p-values are within their bounds.
  depends_on:
  - fig6b-ca-train-responders
- id: fig7b-charging-during-pulse
  statement: Normalized to 150 V/cm, pole polarization during the conditioning pulse fell 1.5
    times below linear scaling at 560 V/cm and 2-fold at 760 V/cm, and further at stronger
    fields (p < 0.01 for every point from 560 V/cm).
  source: Figure 7B, top panels; Results 3.7, paragraph 5
  quote: Actual measurements fell 1.5 times below this line for 560 V/cm PEFs, 2- fold for 760
    V/cm PEFs, and diverged further for more intense PEFs (p < 0.01 for all datapoints ≥560
    V/cm, one sample t-test).
  statistics:
  - test: one sample t-test
    p: 0.01
    p_relation: "<"
    n: 5 cells
  expected:
  - quantity: linear expectation over measured, 560 V/cm
    value: 1.5
    tolerance: 0.15
  - quantity: linear expectation over measured, 760 V/cm
    value: 2
    tolerance: 0.2
  criterion: Data are those of Fig. 4B (Di-8-ANEPPS, 1-us pulses, no test pulse), pole dF as in
    fig4b-di8-limits, each strength as % of the 150 V/cm value, compared with the linear line
    (100% x E / 150 V/cm). Not stated whether normalization is per cell or of the means;
    readings (a) per cell, (b) of the means (the ratios), with the test per cell under both.
    Which pole is not stated; readings (c) each pole, (d) the mean of the poles. One-sample
    t-test of the per-cell values against the line. Reproduced when under one reading both
    ratios are within tolerance, the ratio at 1000 to 1400 V/cm exceeds 2, and every datapoint
    from 560 V/cm is below the line at p < 0.01.
  depends_on:
  - fig4b-di8-limits
- id: fig7ab-test-pulse-recovery
  statement: A 150 V/cm test pulse 5 us after the conditioning pulse charged the poles as in
    undamaged cells after conditioning up to 760 V/cm, to about 80% (not significant) after 1000
    V/cm, and to about 70% and 50% after 1200 and 1400 V/cm, a persistent permeabilization.
  source: Figure 7A and 7B, bottom panels; Results 3.7, paragraphs 3 and 5
  quote: Polarization still followed a cosine function after conditioning PEFs of up to 1000
    V/cm. However, 1200 and 1400 V/cm conditioning PEFs markedly hindered charging by the test
    pulse at cell poles, indicating a persistent membrane permeabilization ... In contrast,
    measurements 6 μs later (test pulse) did not differ from the control up to 760 V/cm strength
    of the conditioning PEF; they were at ~80% of the control reading after 1000 V/cm
    conditioning PEF but the difference was not statistically significant. Still more intense
    PEFs of 1200 and 1400 V/cm reduced charging by the test pulse to ~70% and ~ 50%,
    respectively (p < 0.05 and p < 0.01, two-sided t-test).
  statistics:
  - about: 1200 V/cm conditioning, test pulse against control
    test: two-sided t-test
    p: 0.05
    p_relation: "<"
    n: 5 cells
  - about: 1400 V/cm conditioning, test pulse against control
    test: two-sided t-test
    p: 0.01
    p_relation: "<"
    n: 5 cells
  expected:
  - quantity: test-pulse pole dF after 1000 V/cm conditioning, % of 150/150 control
    value: 80
    tolerance: 8
    unit: "%"
  - quantity: test-pulse pole dF after 1200 V/cm conditioning, % of control
    value: 70
    tolerance: 7
    unit: "%"
  - quantity: test-pulse pole dF after 1400 V/cm conditioning, % of control
    value: 50
    tolerance: 5
    unit: "%"
  criterion: Collapsed pole dF at 900 ns into the test pulse, as % of the 150/150 V/cm value.
    The test, from the Fig. 7 legend, is a two-sided t-test of the difference from the undamaged
    membrane; readings (a) one-sample t-test of per-cell % values against 100%, (b) paired
    t-test of dF against the same cell's 150/150 value. Pole readings as in
    fig7b-charging-during-pulse. The 570/760 and 1000 V/cm points are claims of absence, judged
    on that test at p < 0.05. Reproduced when under one reading the three values are within
    tolerance, 1200 and 1400 V/cm meet their p bounds, and no point up to 1000 V/cm differs.
    The 1400 V/cm cathodic value that the paper drops as negative (Results 3.7, paragraph 6)
    is reported both ways.
- id: fig7c-fast-conductivity-drop
  statement: Within 6 us of the electroporating pulse, effective membrane conductivity at the
    poles fell by a factor of about 10 (range 7 to 20) for most datapoints; the cathodic pole,
    more conductive during the pulse, no longer differed from the anodic pole at the test pulse.
  source: Figure 7C; Results 3.7, paragraph 7
  quote: "Fig. 7C shows a profound reduction in the λm,eff within just 6 μs after the
    electroporating pulse. For most datapoints, it dropped by a factor of 10 (range: 7–20). While
    the cathodic pole became more conductive than the anodic pole during the electroporating
    pulse ... no difference between the poles was detected by the test pulse."
  expected:
    quantity: ratio of effective conductivity during the conditioning pulse to that at the test
      pulse (range 7 to 20, widened to 6.3 to 22)
    value: 14.15
    tolerance: 7.85
    unit: fold
  criterion: As Methods 2.3 and Results 3.7 give it. From the mean values of
    fig7b-charging-during-pulse and fig7ab-test-pulse-recovery, each pole and field strength, the
    measured fraction (of the linear line, and of the 150/150 control) converted to effective
    conductivity through Eq. (2) as in fig5b-conductivity-calibration. The 1400 V/cm cathodic
    test value is left out if negative, and a test value above 100% is set to 100%, as the paper
    did. Datapoints with no conductivity increase during the conditioning pulse are left out. A
    test value of 100% maps to the intact 3e-7 S/m (full resealing, fig7c-full-reseal-mild), which
    gives a finite ratio far above 22; the paper's "most datapoints" leaves open whether these
    count, readings (a) left out, (b) counted as outside the range. Reproduced when more than
    half of the counted datapoints fall within 6.3 to 22 fold, the cathodic conductivity exceeds
    the anodic during the conditioning pulse at 1000 V/cm and above, and at the test pulse the
    cathodic and anodic dF do not differ at any conditioning strength by a two-sided paired
    t-test at p < 0.05 over the 5 cells (the t-test of the Fig. 7 legend, applied between the
    poles; a claim of absence). The paper gives no test for the pole comparison; the ratio of
    the two poles' test-pulse conductivities is reported.
  depends_on:
  - fig7b-charging-during-pulse
  - fig7ab-test-pulse-recovery
- id: fig7c-full-reseal-mild
  statement: After mildly electroporating 570 and 760 V/cm pulses the membrane resealed fully
    within 6 us; after stronger pulses a residual conductivity increase persisted.
  source: Figure 7C; Results 3.7, paragraph 7
  quote: For mildly electroporating PEFs of 570 and 760 V/cm, membrane resealed fully (within the
    accuracy of measurements) within just 6 μs. With more intense PEFs, the residual increased
    conductivity persisted for at least 6 μs, indicating the formation of more stable membrane
    lesions.
  criterion: Judged on the test of fig7ab-test-pulse-recovery. Reproduced when the test-pulse
    pole dF after 570 and 760 V/cm conditioning does not differ from the control (so the
    inferred effective conductivity is the intact value), and after 1200 and 1400 V/cm it is
    significantly reduced at either pole.
  depends_on:
  - fig7ab-test-pulse-recovery
