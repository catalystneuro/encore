- id: fig5a-gd-significant-points
  statement: Differences between Gd3+ and control data are significant at p < 0.05 or better
    for the datapoints below -700 mV and above 1200 mV.
  source: Figure 5A legend
  quote: Differences between Gd3+ and control group data are significant at p < 0.05 or better
    (2-tailed t-test) for datapoints below −700 mV and above 1200 mV.
  statistics:
  - test: 2-tailed t-test
    p: 0.05
    p_relation: "<"
    n: 7 cells with Gd3+ and 5 control cells
  data: with_inputs
  criterion: Fig. 5A; per field strength and pole, measured IMP of the two groups compared by a
    2-tailed two-sample t-test. The text does not say which axis the -700 and 1200 mV refer
    to. Readings (a) IMPC (horizontal axis) below -700 mV at the anodic pole and above 1200 mV
    at the cathodic pole; (b) measured IMP below -700 mV in the Gd3+ group for the anodic
    pole, with IMPC above 1200 mV for the cathodic pole. Reproduced when, under a reading,
    every datapoint in those ranges has p < 0.05.
- id: fig5b-eq2-sensitivity
  statement: By Eq. (2), effective membrane conductivity has little effect on charging while
    it stays much smaller than the cytosol and medium conductivities; a 10-fold increase gives
    about a 2% IMP reduction and a 100-fold increase about 12%.
  source: Results, section 3.5, paragraph 3; Figure 5B
  quote: As expected, effective conductivity had little impact on charging for as long as it
    remained much smaller than the cytosol and media conductivities ... its 10-fold increase would go
    unnoticed, yielding just a ~2% IMP reduction, and a 100-fold increase would reduce IMP by just
    12%.
  expected:
  - quantity: IMP reduction for a 10-fold conductivity increase
    value: 2
    tolerance: 0.2
    unit: '%'
  - quantity: IMP reduction for a 100-fold conductivity increase
    value: 12
    tolerance: 1.2
    unit: '%'
  criterion: A computation from Eq. (2) with the parameters in section 2.3 (cytoplasm 0.4 S/m,
    medium 1.64 S/m, intact membrane 3e-7 S/m, R = 8 um, d = 5 nm); it uses no recordings.
    Reduction is 1 - f/1.5 (the ratio of calculated to measured IMP is 1.5/f) at 10 and 100
    times the intact membrane conductivity. Reproduced when both are within tolerance. If Eq.
    (2) as printed (the extracted text garbles it) gives a value of f far from 1.5 at the intact
    conductivity, both its literal form and the form normalized so that the intact membrane
    gives 1.5 are shown.
- id: fig5c-gd-reduces-conductivity
  statement: For most datapoints, Gd3+ reduced the electroporation-induced effective membrane
    conductivity 2 to 3 fold.
  source: Results, section 3.5, paragraph 4; Figure 5C
  quote: For most datapoints, Gd3+ reduced the electroporation- induced effective conductivity 2–3-fold.
  data: with_inputs
  depends_on:
  - fig5b-eq2-sensitivity
  expected:
  - quantity: ratio of control to Gd3+ effective conductivity, range
    value: 2.55
    tolerance: 0.75
  criterion: As the Fig. 5C legend says, per field strength and pole, the effective conductivity
    from the ratio of the group-mean measured IMP to the group-mean IMPC, interpolated on the
    Eq. (2) curve of fig5b-eq2-sensitivity. The range 2 to 3 widened by 10% of each bound is
    1.8 to 3.3. Reproduced when the control-to-Gd3+ ratio lies in 1.8 to 3.3 for more than half
    of the datapoints where both groups show a reduction of IMP below IMPC; the ratios are
    listed.
- id: fig6a-single-pulse-ca
  statement: A single 1 us pulse at 0 to 1200 V/cm produced a clear Ca2+ entry at 1000 and 1200
    V/cm, with the signal elevated through the 5 min observation; the small increase after 780
    V/cm was at the detection limit and not significant.
  source: Results, section 3.6, paragraph 2; Figure 6A
  quote: Exposure to a single 1-μs pulse at escalating field strengths, from 0 to 1200 V/cm
    established a clear peak of Ca2+ entry at 1000 and 1200 V/ cm, and Ca2+ signal remained elevated
    through the 5-min observation period (Fig. 6A). A subtle ΔF increase after exposure at 780 V/cm
    was at the detection limit and not statistically significant.
  criterion: Fig. 6A; the legend says the means are across 14 cells, and does not say whether
    these are 14 cells per field strength or 14 cells in all; Fluo-4 dF against F0 the mean before
    the pulse, background-subtracted (section 2.4). The paper does not name the test or the
    time point. Readings for the test (a) one-sample t-test of dF against 0 (Methods 2.5);
    (b) two-sample t-test against the 0 V/cm group, both 2-tailed at p < 0.05; for the time,
    (i) the peak dF after the pulse, (ii) dF at the end of the 5 min recording. Reproduced
    when, under every reading, 1000 and 1200 V/cm give dF significantly above the comparison
    and 780 V/cm does not; not reproduced when every reading fails for 1000 or 1200 V/cm or
    finds 780 V/cm significant; blocked as methods_underspecified when the readings disagree.
    The size of the 780 V/cm effect is reported under each reading.
- id: fig6b-train-ca
  statement: With trains of 60 1 us pulses at 6 Hz (224 cells, each tested once), a strong Ca2+
    response occurred in 28% of cells at 780 V/cm and nearly all cells at higher fields; at 650
    V/cm only 2 cells (5.9%) responded strongly, but the mean signal at the end of recording
    was significantly above zero (p < 0.001, one-sample t-test) and marginally higher than at
    230 V/cm (p < 0.05, single-tailed t-test).
  source: Results, section 3.6, paragraph 3; Figure 6B
  quote: A strong Ca2+ response was recorded in 28% of cells exposed at 780 V/cm and in nearly all
    cells at higher intensities (Fig. 6B). At 650 V/cm, only 2 cells (5.9%) showed a strong
    response, but the mean Ca2+ signal by the end of recording was significantly different from
    zero (p < 0.001, one sample t-test) and marginally higher than after exposure at 230 V/cm (p <
    0.05, single-tailed t-test).
  statistics:
  - about: 650 V/cm, end-of-recording dF against zero
    test: one sample t-test
    p: 0.001
    p_relation: "<"
  - about: 650 V/cm against 230 V/cm, end-of-recording dF
    test: single-tailed t-test
    p: 0.05
    p_relation: "<"
  expected:
  - quantity: fraction of strong responders at 780 V/cm
    value: 28
    tolerance: 2.8
    unit: '%'
  - quantity: fraction of strong responders at 650 V/cm
    value: 5.9
    tolerance: 0.59
    unit: '%'
  - quantity: total cells
    value: 224
    tolerance: 0
  criterion: Fig. 6B; Fluo-4 dF against F0 the mean before the train (first 30 s),
    background-subtracted. "By the end of recording" is read as (a) the last frame; (b) the
    mean of the last 10 s (5 frames at 2 s). The single-tailed test is a two-sample Student's
    t-test, 650 above 230 V/cm. The paper does not define a strong response, and no reading
    is given; the fractions (28%, 5.9%, nearly all at higher fields) are tested only if the
    dataset or a reader's answer gives the definition, and otherwise that part is blocked as
    methods_underspecified with the distribution of end-of-recording dF per field shown.
    Reproduced when the cell count is 224 with 28 to 54 cells per field, and under a reading
    of the end, both tests give p below their bounds; partially reproduced when one does.
- id: fig7a-test-pulse-cosine
  statement: Polarization by a 150 V/cm test pulse 5 us after a conditioning pulse still
    followed a cosine after conditioning PEFs up to 1000 V/cm, while 1200 and 1400 V/cm
    conditioning PEFs markedly hindered charging at the cell poles.
  source: Results, section 3.7, paragraph 3; Figure 7A
  quote: Polarization still followed a cosine function after conditioning PEFs of up to 1000 V/cm.
    However, 1200 and 1400 V/cm conditioning PEFs markedly hindered charging by the test pulse at
    cell poles, indicating a persistent membrane permeabilization.
  criterion: Fig. 7A, n = 5; perimeter dF (360 points) during the test pulse, mean over cells,
    fit with a cosine of the polar angle by least squares (Grapher, Methods 2.5). The 150/150
    V/cm cosine is the benchmark (legend). The paper judges "followed a cosine" by eye. Read
    here as the absence of flattening at the poles, the mean dF in each +-5 degree pole arc
    not below the profile's own cosine fit by more than its s.e. Reproduced when this holds at
    both poles for every conditioning strength up to 1000 V/cm, and for 1200 and 1400 V/cm the
    mean pole dF is below the benchmark cosine's pole value by more than its s.e. at both
    poles. The fit significance, r and residuals of every cosine fit are reported.
- id: fig7b-conditioning-sublinear
  statement: During the conditioning pulse, pole polarization normalized to 150 V/cm fell 1.5
    times below linear scaling at 560 V/cm, 2-fold at 760 V/cm and further for stronger PEFs (p
    < 0.01 for all points at 560 V/cm and above, one-sample t-test).
  source: Results, section 3.7, paragraph 5; Figure 7B, top panel
  quote: Actual measurements fell 1.5 times below this line for 560 V/cm PEFs, 2- fold for 760 V/cm
    PEFs, and diverged further for more intense PEFs (p < 0.01 for all datapoints ≥560 V/cm, one
    sample t-test).
  statistics:
  - test: one sample t-test
    p: 0.01
    p_relation: "<"
    n: 5 cells
  expected:
  - quantity: linear expectation over measured, 560 V/cm
    value: 1.5
    tolerance: 0.15
  - quantity: linear expectation over measured, 760 V/cm
    value: 2
    tolerance: 0.2
  criterion: Section 3.7 says the top panel uses the Fig. 4B data (conditioning pulses without
    test pulses; n = 5), with pole dF at 150 V/cm taken as 100% and linear scaling as E/150 x
    100%. The fields 560 and 760 V/cm are read as the 570 and 780 V/cm sets of Fig. 4B. The
    paper does not say whether normalization is per cell or of the group mean; readings (a)
    per cell, then averaged; (b) group mean over group mean. Per pole, the one-sample t-test
    of per-cell normalized values against the linear expectation. Reproduced when, under a
    reading, both ratios are within tolerance at both poles or in their mean, the ratio grows
    beyond 760 V/cm, and p < 0.01 at every field of 560 V/cm and above.
- id: fig7b-test-pulse-recovery
  statement: Polarization by the test pulse 6 us after the conditioning pulse did not differ
    from control up to 760 V/cm conditioning, was about 80% of control after 1000 V/cm (not
    significant), and was reduced to about 70% and 50% after 1200 and 1400 V/cm (p < 0.05 and
    p < 0.01).
  source: Results, section 3.7, paragraph 5; Figure 7B, bottom panel
  quote: In contrast, measurements 6 μs later (test pulse) did not differ from the control up to
    760 V/cm strength of the conditioning PEF; they were at ~80% of the control reading after 1000
    V/cm conditioning PEF but the difference was not statistically significant. Still more intense
    PEFs of 1200 and 1400 V/cm reduced charging by the test pulse to ~70% and ~ 50%, respectively
    (p < 0.05 and p < 0.01, two-sided t-test).
  statistics:
  - about: 1200 V/cm conditioning against control
    test: two-sided t-test
    p: 0.05
    p_relation: "<"
    n: 5 cells
  - about: 1400 V/cm conditioning against control
    test: two-sided t-test
    p: 0.01
    p_relation: "<"
    n: 5 cells
  expected:
  - quantity: test-pulse pole polarization after 1000 V/cm, % of control
    value: 80
    tolerance: 8
    unit: '%'
  - quantity: test-pulse pole polarization after 1200 V/cm, % of control
    value: 70
    tolerance: 7
    unit: '%'
  - quantity: test-pulse pole polarization after 1400 V/cm, % of control
    value: 50
    tolerance: 5
    unit: '%'
  criterion: Fig. 7A data, n = 5; pole dF during the test pulse with the 150/150 V/cm value as
    100%. Normalization readings as in fig7b-conditioning-sublinear. The legend calls the test
    a "two-way t-test for the difference from the undamaged membrane"; readings (a) a
    one-sample two-sided t-test of the normalized values against 100%; (b) a two-sample
    two-sided t-test against the 150/150 V/cm values. The paper does not say which pole;
    readings (i) each pole, (ii) the mean of both. Reproduced when, under a reading, the three
    values are within tolerance, 1200 and 1400 V/cm reach p < 0.05 and p < 0.01, and no
    conditioning strength up to 1000 V/cm reaches p < 0.05.
- id: fig7c-fast-resealing
  statement: Effective membrane conductivity at the poles dropped about 10-fold (range 7 to 20)
    within 6 us after the electroporating pulse; the cathodic pole was more conductive during
    the pulse but no pole difference was seen by the test pulse; after 570 and 760 V/cm the
    membrane resealed fully within 6 us, while stronger PEFs left residual conductivity.
  source: Results, section 3.7, paragraphs 6 and 7; Figure 7C
  quote: Fig. 7C shows a profound reduction in the λm,eff within just 6 μs after the electroporating
    pulse. For most datapoints, it dropped by a factor of 10 ... 7–20). While the cathodic pole
    became more conductive than the anodic pole during the electroporating pulse ... no difference
    between the poles was detected by the test pulse. For mildly electroporating PEFs of 570 and 760
    V/cm, membrane resealed fully (within the accuracy of measurements) within just 6 μs.
  depends_on:
  - fig5b-eq2-sensitivity
  - fig7b-conditioning-sublinear
  - fig7b-test-pulse-recovery
  expected:
  - quantity: fold drop in effective conductivity from conditioning to test pulse, range
    value: 14.15
    tolerance: 7.85
  criterion: As section 3.7 and the Fig. 7C legend say, effective conductivity per pole and field
    from the mean normalized values of Fig. 7B, interpolated on the Eq. (2) curve (fraction of
    IMPC is the normalized value over the linear expectation for the conditioning pulse, and
    the normalized value over 100% for the test pulse); values above 100% taken as 100%, and
    the negative cathodic value at 1400 V/cm omitted, as the paper did. The range 7 to 20 widened
    by 10% of each bound is 6.3 to 22. The paper does not say which datapoints "most" counts;
    readings (a) every pole and field shown in Fig. 7C; (b) only those whose test-pulse value is
    below 100% (residual conductivity). The paper names no test for the absence of a pole
    difference at the test pulse; it is read as a 2-tailed paired t-test (Methods 2.5) of the
    cathodic against the anodic normalized test-pulse value across the 5 cells, at each field,
    not significant at p < 0.05. Reproduced when, under a reading, the fold drop lies in 6.3 to
    22 for most datapoints, the conditioning-pulse conductivity is higher at the cathodic pole
    at most fields, no field shows a pole difference at the test pulse, the test-pulse
    conductivities at 570 and 760 V/cm are at the intact value (fraction of control at or above
    100% within s.e.), and those at 1200 and 1400 V/cm are above it.
