  statistics:
  - test: t-test (2-tailed t-test in the Fig. 5A legend; Student's t-test in Methods 2.5)
    p: 0.001
    p_relation: "<"
    n: 7 cells with Gd3+ and 5 control cells
  expected:
  - quantity: most negative anodic IMP with 1 mM Gd3+
    value: -864
    tolerance: 44
    unit: mV
  - quantity: most negative anodic IMP in controls
    value: -542
    tolerance: 57
    unit: mV
  criterion: Fig. 5A, Di-8-ANEPPS, 1 us, 150 to 1400 V/cm; anodic pole dF from the polarization
