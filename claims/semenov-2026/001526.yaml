    the equator" reaches. Readings (a) the points within 30 degrees of the equator; (b) within
    45 degrees. The paper compares by eye; the measure is, separately for the cathodic and
    anodic halves, the mean measured IMP over the points in that range divided by the mean IMPC
    over the same points (a ratio of means, since IMPC tends to 0 at the equator), against 1
    with the protocol's default tolerance of 10% (0.9 to 1.1).
    Reproduced when, under a reading, that ratio is within 0.9 to 1.1 at 780 and 1000 V/cm
    while the ratio in the +-5 degree pole arcs is below 0.9 at the same fields.
- id: fig4d-short-pulses-same-limit
  statement: With 0.3 us PEFs at 357 to 3320 V/cm (imaged at 275 ns), the maximum dF was 53 +-
    4% (about 600 mV) at both poles, similar to 1 us pulses, and its pattern with increasing
    field strength did not differ from that with 1 us pulses.
  source: Results, section 3.4, paragraph 5; Figure 4D
  quote: Contrary to the expectations, the results were similar to those with 1-μs pulses ... the
