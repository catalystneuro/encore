- id: fig5a-gd-linear-to-780
  statement: With Gd3+, measured IMP stayed nearly identical to IMPC down to -780 mV, showing
    that the Di-8-ANEPPS response stayed linear and its calibration valid at high IMPs.
  source: Results, section 3.5, paragraph 1; Figure 5A
  quote: Furthermore, measured IMP remained nearly identical to the theoretical IMPC down to −780
    mV, indicating that the dye response remained linear and its calibration was valid even at
    high IMPs.
  data: with_inputs
  criterion: Fig. 5A Gd3+ group, n = 7; anodic pole IMP against IMPC per field strength, means
    and s.e. both ways, compared with the bisector of Fig. 5A. The paper names no test for
    "nearly identical". Readings (a) a one-sample t-test (Methods 2.5) of per-cell measured
    IMP minus IMPC against 0, not significant at p < 0.05; (b) the mean measured IMP within
