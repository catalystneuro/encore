    hyperpolarizes the anode-facing pole, falls off towards the equator and scales with field
    strength up to 570 V/cm; at 780 V/cm the cathodic pole stops increasing and dims; at 1000
    to 1400 V/cm the poles show reduced or absent polarization while regions nearer the equator
    remain polarized and may exceed the poles.
  source: Results, section 3.1, paragraph 1; Figure 1 and legend
  quote: At a higher electric field strength of 780 V/cm, polarization at the cathodic pole does not
    further increase but dims out, indicating a less efficient charging of the partially
    permeabilized membrane. Still stronger electric fields produce a distinct pattern of reduced
    or absent polarization at the poles
  criterion: Figure 1 shows representative images; the paper does not identify the cells. Tested on the
    Di-8-ANEPPS 1 us escalation data (the Fig. 4B group, n = 5), with polarization images as in
    section 2.3 and perimeter dF resampled to 360 points. Reproduced when, in the mean over
    cells, (1) cathodic pole dF is positive and anodic pole dF negative at 43 to 570 V/cm and
    pole |dF| rises with field strength over that range; (2) cathodic pole dF at 780 V/cm is not
