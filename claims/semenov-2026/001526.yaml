  expected:
  - quantity: maximum cathodic IMP with 1 mM Gd3+
    value: 647
    tolerance: 44
    unit: mV
  criterion: Readings for the maximum and its comparison as in fig5a-gd-anodic-extension, at the
    cathodic pole. The absence of a difference is judged on the paper's test, a 2-tailed
