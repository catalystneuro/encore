    V/cm; at stronger fields the poles become leaky and show reduced or absent polarization while
    regions near the equator stay polarized.
  source: Results, 3.1 Visualization of electroporation, paragraph 1; Figure 1
  quote: Still stronger electric fields produce a distinct pattern of reduced or absent polarization at
    the poles (where the membrane becomes too leaky to accumulate the charge) while regions closer
    to the equator remain relatively intact and may polarize more than the poles
  criterion: Shown in Fig. 1 as representative images, with no measure. Judged with the measure of
    Fig. 4B (pole dF within plus or minus 5 degrees, from collapsed baseline and polarization
    images); reproduced when the pole dF divided by field strength falls at 780 V/cm and above
    relative to 43 to 360 V/cm, while dF at 45 to 60 degrees from the poles keeps rising up to 1000
