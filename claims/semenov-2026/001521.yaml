  source: Results, 3.5 Membrane charging in the presence of Gd3+ ions, paragraph 3; Figure 5B
  quote: its 10-fold increase would go unnoticed, yielding just a ~2% IMP reduction, and a 100-fold
    increase would reduce IMP by just 12%
  expected:
  - quantity: IMP reduction for a 10-fold conductivity increase
    value: 2
    tolerance: 0.2
    unit: "%"
  - quantity: IMP reduction for a 100-fold conductivity increase
    value: 12
    tolerance: 1.2
    unit: "%"
  criterion: A model computation, needing no recordings. Eq. 2 with the paper's values (cytoplasm 0.4
    S/m, medium 1.64 S/m, membrane 3e-7 S/m intact, R 8 um, d 5 nm). The paper defines the reduction
    as % of IMPC (Fig. 5B legend), so the main reading is 1 - f/1.5; f relative to f at the intact
    conductivity is a variant.
- id: fig5c-gd-reduces-conductivity
  statement: Gd3+ reduced the electroporation-induced effective membrane conductivity 2 to 3-fold for
    most datapoints.
  source: Results, 3.5 Membrane charging in the presence of Gd3+ ions, paragraph 4; Figure 5C
  quote: For most datapoints, Gd3+ reduced the electroporation- induced effective conductivity 2–3-fold
  depends_on:
  - fig5b-conductivity-calibration
  expected:
    quantity: control over Gd3+ effective conductivity, most datapoints
    value: 2.55
    tolerance: 0.75
  criterion: The range 2 to 3, widened by 10% of each bound (1.8 to 3.3). Effective conductivity from
    the ratio of measured to calculated pole IMP through Eq. 2 (Methods 2.3; Fig. 5C legend).
    Reproduced when more than half of the datapoints give a ratio in that range. Which datapoints
    count is open; readings are (a) every field strength and pole datapoint of Fig. 5A, as the Fig.
    5C legend says, (b) those with electroporation, 570 V/cm and above (the threshold of Section
    3.4), as a ratio is not meaningful where conductivity stays at the intact value.
- id: fig7a-test-pulse-cosine
  statement: A 150 V/cm test pulse 5 us after a conditioning pulse still charges the membrane along a
    cosine after conditioning up to 1000 V/cm, while 1200 and 1400 V/cm conditioning markedly hinders
    charging at the poles.
  source: Results, 3.7 Fast restoration of membrane conductivity, paragraph 3; Figure 7A
  quote: Polarization still followed a cosine function after conditioning PEFs of up to 1000 V/cm.
    However, 1200 and 1400 V/cm conditioning PEFs markedly hindered charging by the test pulse at cell
    poles
  depends_on:
  - fig7b-test-pulse-recovery
  criterion: The pole part is judged with the measures of fig7b-test-pulse-recovery (1200 and 1400 V/cm
    conditioning lower the test-pulse pole dF). For the cosine part, a cosine is fit to the azimuthal
    test-pulse dF profile (Methods 2.5, Grapher fit) after each conditioning pulse up to 1000 V/cm;
    reproduced when its correlation coefficient is not lower than that of the 150/150 V/cm benchmark
    profile by more than 10% of it (a bound fixed here; the paper judges the fit by eye, and its Fig.
    7A legend switches to LOESS fits for the last two graphs).
- id: fig7b-conditioning-sublinear
  statement: During the conditioning pulse, pole dF falls 1.5 times below linear scaling at 560 V/cm,
    2-fold at 760 V/cm and further at stronger fields.
  source: Results, 3.7 Fast restoration of membrane conductivity, paragraph 5; Figure 7B top
  quote: Actual measurements fell 1.5 times below this line for 560 V/cm PEFs, 2- fold for 760 V/cm
    PEFs, and diverged further for more intense PEFs (p < 0.01 for all datapoints ≥560 V/cm, one
    sample t-test)
  statistics:
  - test: one sample t-test
    p: 0.01
    p_relation: "<"
    n: 5 cells
  expected:
  - quantity: linear expectation over measured, 560 V/cm
    value: 1.5
    tolerance: 0.15
  - quantity: linear expectation over measured, 760 V/cm
    value: 2
    tolerance: 0.2
  criterion: Pole dF (plus or minus 5 degrees) during the conditioning pulse, normalized to that at 150
    V/cm as 100% (Section 3.7; Fig. 7B legend), taken from the Fig. 4B experiments as the paper
    does. Linear expectation is 100% times E/150 V/cm. Each cell's normalized value is tested against
    the linear value by a one-sample t-test, p < 0.01, at every field of 560 V/cm and above, and the
    ratios at 560 and 760 V/cm must be within tolerance and the ratio must rise at stronger fields.
    The paper does not say whether the ratios are per pole or for both; readings are (a) each pole,
    (b) the mean of the two poles. Fields are labeled 560 and 760 V/cm here and 570 and 780 V/cm
    elsewhere in the paper; they are taken as the same fields.
- id: fig7b-test-pulse-recovery
  statement: Six us after the conditioning pulse, test-pulse charging is unchanged after conditioning
    up to 760 V/cm, about 80% (not significant) after 1000 V/cm, and about 70% and 50% after 1200 and
    1400 V/cm.
  source: Results, 3.7 Fast restoration of membrane conductivity, paragraph 5; Figure 7B bottom
  quote: Still more intense PEFs of 1200 and 1400 V/cm reduced charging by the test pulse to ~70% and ~
    50%, respectively (p < 0.05 and p < 0.01, two-sided t-test)
  statistics:
  - about: 1200 V/cm conditioning
    test: two-sided t-test
    p: 0.05
    p_relation: "<"
    n: 5 cells
  - about: 1400 V/cm conditioning
    test: two-sided t-test
    p: 0.01
    p_relation: "<"
    n: 5 cells
  expected:
  - quantity: test-pulse dF after 1000 V/cm conditioning, % of 150 V/cm
    value: 80
    tolerance: 8
    unit: "%"
  - quantity: test-pulse dF after 1200 V/cm conditioning, % of 150 V/cm
    value: 70
    tolerance: 7
    unit: "%"
  - quantity: test-pulse dF after 1400 V/cm conditioning, % of 150 V/cm
    value: 50
    tolerance: 5
    unit: "%"
  criterion: Test-pulse pole dF normalized to that after 150 V/cm conditioning as 100% (Fig. 7B legend,
    n = 5). The two-sided t-test is for the difference from the undamaged membrane (Fig. 7B legend);
    readings are (a) a one-sample test of the normalized values against 100%, (b) a Student's t-test
    against the 150/150 V/cm values. Reproduced when the values are within tolerance, 1200 and 1400
    V/cm differ at p < 0.05 and p < 0.01, and, as claims of absence, conditioning up to 760 V/cm and
    at 1000 V/cm gives no difference at p < 0.05 by the same test. Per pole or the mean of both is
    open, as in fig7b-conditioning-sublinear.
- id: fig7c-fast-resealing
  statement: Effective membrane conductivity at the poles dropped about 10-fold (range 7 to 20) within
    6 us after the electroporating pulse, with full resealing after 570 and 760 V/cm and residual
    conductivity after stronger pulses.
  source: Results, 3.7 Fast restoration of membrane conductivity, paragraph 7; Figure 7C
  quote: Fig. 7C shows a profound reduction in the λm,eff within just 6 μs after the electroporating
    pulse. For most datapoints, it dropped by a factor of 10 (range ... 7–20)
  depends_on:
  - fig5b-conductivity-calibration
  - fig7b-test-pulse-recovery
  expected:
    quantity: fold drop of effective conductivity in 6 us, most datapoints
    value: 10
    tolerance: 1
  criterion: Effective conductivity interpolated from the mean pole dF of Fig. 7B through Eq. 2, with
    the cathodic 1400 V/cm value omitted and the 120% value taken as 100%, as the paper does.
    Reproduced when the median fold drop is within tolerance (the median is a reading of "for most
    datapoints" fixed here) and all fold drops lie in 6.3 to 22 (the stated range widened by 10%).
    For the resealing part, the test-pulse conductivity after 570 and 760 V/cm is at the intact value
    within the accuracy of the measure, read as test-pulse pole dF not different from 100% as in
    fig7b-test-pulse-recovery, and after 1000 V/cm and above it is above the intact value.
