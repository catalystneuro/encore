- id: fig6a-ca-entry-1000-1200
  statement: A single 1-us pulse causes clear Ca2+ entry into CHO cells at 1000 and 1200 V/cm, among
    field strengths escalated from 0 to 1200 V/cm.
  source: Results, 3.6 Electroporative uptake of Ca2+, paragraph 2; Figure 6A
  quote: Exposure to a single 1-μs pulse at escalating field strengths, from 0 to 1200 V/cm established
    a clear peak of Ca2+ entry at 1000 and 1200 V/cm
  criterion: Per cell, Fluo-4 dF (%) = 100 (F - F0)/F0, with F the mean over a circular region on the
    cell less a cell-free background region and F0 the mean before the pulse (Methods 2.4). The
    paper names no test for this panel (see the opening comment for the readings of the test and of
    the post-pulse value). Reproduced when, under at least one reading, the post-pulse dF at both
    1000 and 1200 V/cm is significantly above zero (one-sample t-test) or above the 0 V/cm group
    (two-tailed Student's t-test) at p < 0.05, and the group means at 1000 and 1200 V/cm exceed
    those of every field strength of 650 V/cm or less (this comparison is a reading of "a clear
    peak" fixed here; the paper states no comparison). Partially reproduced when this holds at one
    of the two. Group means and s.e. for every field strength are reported, with the per-cell traces.
- id: fig6a-ca-sustained
  statement: After a single 1-us pulse at 1000 or 1200 V/cm the Ca2+ signal stays elevated through the
    5-min observation period.
  source: Results, 3.6 Electroporative uptake of Ca2+, paragraph 2; Figure 6A
  quote: Ca2+ signal remained elevated through the 5-min observation period
  depends_on:
  - fig6a-ca-entry-1000-1200
  criterion: dF as in fig6a-ca-entry-1000-1200. Reproduced when, at both 1000 and 1200 V/cm, the mean
