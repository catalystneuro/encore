# Claims for Churchland, Cunningham, Kaufman, Ryu & Shenoy (2010), Neuron 68, 387-400, on dandiset 000140.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-10-28,
# protocol as stated in docs/protocol.md.
#
# Text read: the NIH author manuscript in PubMed Central (PMC2991102), not the version of record,
# as extracted to paper/10.1016-j.neuron.2010.09.015.txt: Summary, Results, Discussion, Methods,
# figure legends, and its one supplement (NIHMS240235-supplement-01.pdf: Supplemental Figures 1
# to 5 with legends, Supplemental Text, Supplemental Experimental Procedures). The figures are not
# in the text; values shown only in Figures 4, 6 and 7 are not stated and no expected value is
# taken from them. The paper links no code, so every method below comes from the Methods, the
# legends or the supplement. The archive also lists doi:10.1038/nature11129 for this dandiset;
# these claims are for the 2010 paper only.
#
# Data the paper used (Results, Behavior and recordings; Methods; Supplemental Experimental
# Procedures). Three adult male rhesus monkeys (A, B, J, about 10 kg) made delayed reaches on a
# fronto-parallel screen from a central touch spot to a target. Events per trial: target onset
# (the target jitters), go cue (jitter stops, touch spot disappears), movement onset. Delays about
# 0 to 1000 ms; only trials with delays above 400 ms analysed. Hand tracked at 60 Hz, eye at
# 240 Hz. Four datasets:
#   monkeys A and B, speed task, 28 conditions (7 directions, 2 distances, 2 instructed speeds),
#   single electrodes, 64 and 74 single units, mean 311 and 492 trials per neuron, EMG from 6 and
#   11 recordings;
#   monkey J, maze task, single electrodes, 172 single units, four sets of 27 conditions (about 53
#   neurons per set; population analyses per set, then averaged), mean 388 trials per neuron, EMG
#   from 8 recordings;
#   monkey J-array, maze task, all 108 conditions interleaved, two 96-electrode arrays (caudal PMd,
#   and surface M1 perhaps extending into caudal PMd), 146 single- and multi-unit isolations, mean
#   2166 trials per neuron (2155 in the Methods), no EMG.
# Maze conditions: one third straight reaches without barriers, one third curved around virtual
# barriers, one third the same barrier mazes with distractor targets. For the maze task only trials
# whose horizontal and vertical velocity profiles correlate with a reference proto-trial at r > 0.9
# were kept (typically about 90%). Measured variables: spike times per unit, hand position, the
# trial events, condition identity; EMG for A, B and J only.
#
# The dandiset's archive title is "MC_Maze_Small: macaque primary motor and dorsal premotor cortex
# spiking activity during delayed reaching" (Neural Latents Benchmark). By that title it is meant to
# hold maze-task array recordings of monkey J, that is a part of the J-array dataset. Claims about
# monkeys A, B and the single-electrode J recordings, and claims that need EMG, are listed because
# they are findings of the paper; the author finds what the dandiset holds.
#
# Method details fixed by the paper and used throughout (Methods; Supplemental Experimental
# Procedures): spike trains smoothed with a 20 ms Gaussian before averaging; condition means
# computed separately locked to target onset, go cue and movement onset; preparatory rate is the
# mean from 200 ms before to 100 ms after the go cue; peri-movement rate (for correlations) the mean
# from 100 ms before to 350 ms after movement onset; trials with delay > 400 ms; inclusion of
# J-array units with > 5 spikes/s of preparatory tuning (10 spikes/s for single electrodes).
# Details the paper leaves open, used by several claims, with the readings named:
#   O1 "spikes/s of preparatory tuning" is not defined. Readings: (a) the range (maximum minus
#      minimum) of the preparatory rate across conditions; (b) its standard deviation across
#      conditions.
#   O2 "robust peri-movement tuning (at least 1.5 times as strong as preparatory tuning)" uses the
#      same undefined measure. Readings follow O1, applied to (i) the peri-movement epoch means, or
#      (ii) the largest across-condition range or SD at any time from 100 ms before to 350 ms after
#      movement onset.
#   O3 movement onset is not defined in this paper (it cites Churchland et al., 2006c). Readings:
#      (a) the movement-onset time the dataset provides; (b) the first time hand speed exceeds a
#      fixed fraction of its peak on that trial, the fraction stated in the notebook.
#   O4 the proto-trial for the maze trial filter is not defined. Readings: (a) per condition, the
#      trial whose velocity profile best correlates with the condition mean; (b) the condition mean
#      itself; (c) no filter, when the dandiset holds only trials already kept.
#   O5 the time step of the T matrices is not given; 10 ms samples of the 20 ms smoothed rates are
#      used as a standard choice that should not change the outcome.
schema_version: 2
