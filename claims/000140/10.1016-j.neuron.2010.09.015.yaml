claims:
- id: fig4d-mean-correlation-j-array
  statement: For the J-array dataset, the correlation across conditions between a unit's
    preparatory and peri-movement firing rates is positive on average but small (mean Pearson r =
    0.13, p = 0.03; mean Spearman r = 0.11).
  source: Results, Correlations between preparatory and peri-movement tuning, paragraph 1; Figure
    4D
  quote: Across the four datasets the mean correlation was positive (p=0.01, p=0.01, p=0.12, p=0.03)
    but only very modestly so (mean r = 0.21, 0.19, 0.06 and 0.13). Non-parametric correlations
    were similarly modest (mean Spearman's r = 0.20, 0.20, 0.06 and 0.11)
  statistics:
  - about: mean Pearson correlation against zero, J-array
    test: not named
    p: 0.03
    n: J-array units passing the preparatory and peri-movement tuning criteria (count not given)
  expected:
  - quantity: mean Pearson r, J-array
    value: 0.13
    tolerance: 0.013
  - quantity: mean Spearman r, J-array
    value: 0.11
    tolerance: 0.011
  criterion: Per unit, the vector of condition-mean preparatory rates (200 ms before to 100 ms
    after the go cue) is correlated with the vector of condition-mean peri-movement rates (100 ms
    before to 350 ms after movement onset), Methods. Units with > 5 spikes/s of preparatory tuning
    and peri-movement tuning at least 1.5 times as strong (Methods), under readings O1 and O2;
    trials with delay > 400 ms; trial filter under O4; movement onset under O3. The test of the
    mean against zero is not named; readings are (a) a two-sided one-sample t-test on r, (b) the
    same on Fisher z-transformed r, (c) a two-sided Wilcoxon signed-rank test. Reproduced when,
    under one reading, both means are within tolerance and the mean is positive at p < 0.05;
    partially reproduced when the mean is positive at p < 0.05 and below 0.3 but outside
    tolerance. Fewer conditions than the paper's 108 make r noisier per unit; the number of
    conditions and units used is reported.
