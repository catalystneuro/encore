- id: fig4-broad-near-zero
  statement: Correlations between preparatory and peri-movement tuning span a broad range centred
    near zero, with no separate populations of concordant (r near 1) and opposing (r near -1)
    tuning; most neurons have weakly correlated tuning.
  source: Results, Correlations between preparatory and peri-movement tuning, paragraphs 3 and 4;
    Figure 4A to 4D
  quote: different neurons show markedly different relationships between preparatory and
    peri-movement activity, with a broad range of correlations centered near zero ... Instead, most
    neurons have weakly correlated tuning
  depends_on:
  - fig4d-mean-correlation-j-array
  criterion: The paper gives no test; the judgement rule is fixed here. On the J-array units and
    correlations of fig4d-mean-correlation-j-array, reproduced when the median r lies between
    -0.3 and 0.3, the interquartile range spans at least 0.3, more than half of units have |r|
    below 0.5 (most weakly correlated), and fewer than 15% of units have r above 0.8 and fewer
    than 15% below -0.8 (no cluster at either end). The histogram is shown in
    bins of 0.1, a standard choice.
- id: fig4e-correlation-time-course
  statement: When peri-movement activity is taken at single time points, its correlation with
    preparatory tuning starts to fall about 200 ms before movement onset and is near zero by
    movement onset.
  source: Results, Correlations between preparatory and peri-movement tuning, paragraph 2; Figure
    4E
  quote: The correlation with preparatory activity began to decline ... prior to movement onset,
    and reached values near zero by movement onset
  depends_on:
  - fig4d-mean-correlation-j-array
  criterion: As the Figure 4E legend and Supplemental Experimental Procedures say, the rate at a
    single time point of the 20 ms smoothed condition means, swept along the trace spliced from the
    go-locked and movement-locked means, correlated per unit with the preparatory rate vector, and
    averaged over units. Which units are averaged is not stated; readings are (a) the units of
    Figure 4A to 4D, (b) all units with > 5 spikes/s preparatory tuning. Judgement thresholds fixed
    here, as the paper gives none. Reproduced when the mean correlation at movement onset is below
    0.1 and below half its value at 200 ms before onset, and the largest drop over any 50 ms step
    begins between 300 ms before and movement onset; partially reproduced when the correlation
    falls toward movement onset but stays above 0.1.
- id: suppfig1-population-averages-lose-tuning
  statement: Population-average PSTHs grouped by each neuron's preparatory preference show weak
    peri-movement differences that shrink with time, with little relationship to preparatory
    tuning by movement onset.
  source: Results, Correlations between preparatory and peri-movement tuning, paragraph 3;
    Supplemental Figure 1
  quote: In population averages ( Supp. Fig. 1 ) the lack of correlation averages out and the means
    are dominated by the weak agreement between preparatory and peri-movement tuning. However, such
    effects grow dramatically smaller with time. By movement onset even population averages show
    little relationship with preparatory tuning
  depends_on:
  - fig4d-mean-correlation-j-array
  criterion: As the Supplemental Figure 1 legend says, for each unit of fig4d-mean-correlation-j-array
    the conditions with the strongest and weakest preparatory response and two intermediate ones
    (taken here as the conditions at the 1/3 and 2/3 ranks, a choice the legend leaves open) are
    found, each unit's rates normalised by its maximum rate, and averaged across units. Reproduced
    when the spread between the strongest and weakest averaged traces at movement onset is less
    than half the spread in the preparatory epoch, with the strongest-preparatory trace still on
    top at 150 ms before movement onset. The unnormalised average is shown as a variant (the
    legend says results were similar).
- id: fig6d-perimovement-best-j-array
  statement: For the J-array dataset, the cross-validated performance of a preferred direction in
    capturing preparatory tuning is highest when the PD is expressed in the PCA-based
    peri-movement space, compared with the kinematic space and the task spaces.
  source: Results, PD performance in a variety of spaces, paragraphs 1 to 3; Figure 6D
  quote: For every dataset, the highest level of performance was achieved ... when PDs were
    expressed in the peri-movement space
  criterion: Methods, Using a PD to capture preparatory tuning, PCA-based spaces and PD
    performance. Per unit (> 5 spikes/s preparatory tuning under O1, no peri-movement
    criterion), the preparatory rate vector is regressed on a c x k matrix S of condition
    locations plus an offset, with leave-one-condition-out cross-validation; performance is one
    minus the mean squared prediction error divided by the variance of the preparatory rates
    across conditions; averaged over units. The peri-movement space is the first k PC scores of
    the c x nt matrix of condition-mean rates from 150 ms before to 800 ms after movement onset
    of all units except the one fitted, not normalised, columns mean-centred (Supplemental Text).
    The kinematic space is the PC scores of a c x 2t-style matrix of horizontal and vertical hand
    position, velocity and acceleration from 150 ms before movement onset to the end of the reach,
    each variable scaled to unit range across times and conditions; the Methods say each neuron
    contributed one kinematic variable so the matrix matches the neural one in size, which is read
    as (a) the six variables each repeated equally to about n columns, or (b) the six variables
    once, as the stated scaling makes repetition change only the relative weights; the end of the
    reach is taken as 600 ms after movement onset (Figure 1 legend, reaches last about 200 to
    600 ms) or as 800 ms, the neural window. Task spaces for the maze task as listed in Methods,
    Task spaces (initial velocity, endpoints + maximum speed, endpoints + orthogonal excursion,
    endpoints + viapoint, endpoints + maximum velocity, endpoints + halfpoint, segment directions,
    kitchen sink of 11 dimensions with barrier and distractor flags). PCA dimensionalities tested
    are not listed; readings are k = 1 to 14 (the range the Results give) and k = 1 to 20. Time
    step under O5. Reproduced when, under each reading, the best peri-movement performance
    over k exceeds the best kinematic performance and every task space; partially reproduced when
    it exceeds all but one. No EMG space can be built for J-array (no EMG recorded).
- id: fig6abc-perimovement-best-other-datasets
  statement: For the monkey A, B and J single-electrode datasets as well, PD performance is best
    in the peri-movement space, including against the PCA-based EMG space.
  source: Results, PD performance in a variety of spaces, paragraph 3; Figure 6A to 6C
  quote: performance was nearly always best for the space derived from the population-level
    peri-movement response. For every dataset, the highest level of performance was achieved
  criterion: As fig6d-perimovement-best-j-array, with the speed-task window ending 400 ms after
    movement onset, the speed-task task spaces including targets + instructed speed, the EMG space
    built as the Methods say (all muscles, same window, each muscle scaled to unit range), and for
    monkey J the analysis done per 27-condition set and averaged. These are single-electrode data
    with EMG, expected outside this dandiset.
- id: fig6-perimovement-best-each-dimensionality
  statement: Taken one dimensionality at a time, performance is almost always higher in the
    peri-movement space than in other spaces of the same dimensionality, the exception being the 3-D
    targets + instructed speed and endpoints + maximum speed spaces for the speed task.
  source: Results, PD performance in a variety of spaces, paragraph 3; Figure 6A to 6D
  quote: Even if we consider each dimensionality individually, performance was almost always higher
    for the peri-movement space. An exception was that, among 3-dimensional spaces, the
    'targs+instr. spd.' and 'endpoints + max. spd.' performed very well for the datasets collected
    using the speed task
  depends_on:
  - fig6d-perimovement-best-j-array
  criterion: With the performances of fig6d-perimovement-best-j-array, for each k tested under its
    readings the peri-movement space is compared with the kinematic space at the same k and with every task
    space of that dimensionality. "Almost always" is judged here as at least 80% of these
    comparisons won by the peri-movement space, under each reading of fig6d.
- id: fig6-maze-endpoint-speed-space-poor
  statement: In the maze task the endpoints + maximum speed space, which did well for the speed
    task, does not perform well.
  source: Results, PD performance in a variety of spaces, paragraph 3; Figure 6C and 6D
  quote: The former is undefined for the maze task, but the latter did not perform well
  depends_on:
  - fig6d-perimovement-best-j-array
  criterion: From fig6d-perimovement-best-j-array. "Did not perform well" is judged here as
    performance of the 3-D endpoints + maximum speed space below that of the 3-D peri-movement
    space by at least 0.1 and below half of the best peri-movement performance over k.
- id: fig6-dimensionality-trend
  statement: Performance of the PCA-based spaces typically improves with dimensionality and then
    declines above about 10 dimensions, an indication of overfitting.
  source: Results, PD performance in a variety of spaces, paragraph 2; Figure 6A to 6D
  quote: Performance typically improved with dimensionality ... Performance typically declined at
    dimensionalities >10, an indication of over-fitting
  depends_on:
  - fig6d-perimovement-best-j-array
  criterion: From the peri-movement and kinematic performance curves of
    fig6d-perimovement-best-j-array over k = 1 to 20. Reproduced when, for the peri-movement
    space, performance at its best k exceeds performance at k = 2 and the best k lies between 3 and
    14 (the range the Results give for k), and performance at k = 20 is below performance at
    k = 10 (the Results place the decline above 10 dimensions); partially reproduced when only the
    rise holds. Thresholds fixed here, as the paper gives none.
- id: fig6e-summary-rank
  statement: Across monkeys A, B and J, the peri-movement space gives the highest performance
    averaged across neurons, with the advantage growing as higher dimensionalities are allowed
    (limits 3, 6, 12); the task spaces are largely outperformed by the PCA-based kinematic and EMG
    spaces, which are in turn outperformed by the peri-movement space. Spaces marked by asterisks
    are significantly worse than the best space (p < 0.001).
  source: Results, PD performance in a variety of spaces, paragraph 4; Figure 6E and legend
  quote: Performance (averaged across neurons) was highest when the PD employed the space based on
    peri-movement neural activity ... the task spaces were largely outcompeted by the PCA-based
    kinematic and EMG spaces, which were in turn outperformed by the peri-movement space
  statistics:
  - about: other spaces against the best space (asterisks)
    test: not named
    p: 0.001
    p_relation: "<"
    n: neurons of monkeys A, B and J
  criterion: Figure 6E excludes J-array (no EMG). For each limit (3, 6, 12), the best PCA-based
    performance with k up to the limit and each task space defined for all three datasets at or
    under the limit, averaged over neurons of A, B and J; SEs across neurons. The test behind the
    asterisks is not named; readings are (a) paired t-test across neurons and (b) Wilcoxon
    signed-rank test, each against the best space. Not testable unless the dandiset holds the
    single-electrode and EMG data. As a variant on J-array, the same ranking without EMG is
    reported.
- id: prep-dimensionality-7-to-10
  statement: Preparatory activity is moderately high dimensional; depending on the dataset 7 to 10
    dimensions capture 90% of its variance.
  source: Supplemental Experimental Procedures, Estimating the upper limit of PD performance;
    Results, PD performance in a variety of spaces, paragraph 2
  quote: depending on the dataset, 7-10 dimensions were required to capture 90% of the data variance
  expected:
  - quantity: PCs needed for 90% of variance of the c x n preparatory matrix
    value: 8.65
    tolerance: 2.35
  criterion: PCA of the c x n matrix of condition-mean preparatory rates (one row per condition),
    as the supplement defines it, on the units of fig6d-perimovement-best-j-array. The number of
    components whose cumulative explained variance first reaches 90%. The expected value and
    tolerance encode the reported range 7 to 10 widened by 10% of each bound (6.3 to 11). Whether rates are normalised
    is not stated; the supplement's T matrices for neurons are not normalised, so unnormalised
    is the main reading and z-scored units a variant. With fewer conditions than the paper's 108
    the count is bounded by c - 1; this is reported.
- id: fig7a-shuffled-space-poor
  statement: A control peri-movement space in which each condition's peri-movement response is
    inverted at random on half the conditions performs poorly.
  source: Results, Controls, paragraph 1; Figure 7A and legend
  quote: The PCA-based 'shuffled-space' performed poorly
  depends_on:
  - fig6d-perimovement-best-j-array
  criterion: As the Figure 7A legend says, for each unit and condition, with probability 0.5 the
    activity after 150 ms before movement onset is reflected vertically around the rate at that
    time; the shuffled T matrix is then used as the peri-movement space. Whether the coin is drawn
    per unit and condition (the legend's wording) or per condition for all units is read the first
    way, with the second as a variant. Twenty random shuffles, a standard choice. Reproduced when
    the best shuffled performance over k is below half the best intact peri-movement performance
    and below the best kinematic performance (judgement fixed here, as the paper gives none).
- id: fig7b-window-start-slide
  statement: Sliding the start of the peri-movement window later costs little; with the window
    starting at movement onset, performance is still 97% (monkey J) and 94% (monkeys A, B) of its
    original value.
  source: Results, Controls, paragraph 1; Figure 7B
  quote: Even when the window began at movement onset ... performance was still at 97% (monkey J),
    and 94% (monkeys A, B) of its original value
  expected:
  - quantity: performance with window starting at movement onset, relative to start at -150 ms, monkey J
    value: 0.97
    tolerance: 0.097
  - quantity: same ratio, monkeys A and B
    value: 0.94
    tolerance: 0.094
  depends_on:
  - fig6d-perimovement-best-j-array
  criterion: As the Figure 7B legend says, performance averaged across neurons at the best k for
    each start time, with the window end fixed. "Monkey J" can be read as (a) the J-array dataset,
    (b) the single-electrode J dataset only, or (c) both averaged; on this dandiset only (a) can
    be computed, so the J value is compared under reading (a). Reproduced when the ratio is within
    tolerance.
- id: ap-location-no-effect-j-array
  statement: For J-array, the preparatory to peri-movement tuning correlation does not depend on
    anterior-posterior recording location (r = 0.20, p = 0.27).
  source: Results, Comparison of anterior versus posterior sites, paragraph 1
  quote: Regressing tuning correlation (as in Figure 4 ) against AP location yielded little or no
    effect ... and r =0.20, p =0.27 for the four datasets
  statistics:
  - about: J-array, tuning correlation regressed on AP location
    test: linear regression
    statistic: r = 0.20
    p: 0.27
  depends_on:
  - fig4d-mean-correlation-j-array
  criterion: A claim of absence. The per-unit correlations of fig4d-mean-correlation-j-array are
    regressed on each unit's anterior-posterior location (Pearson r, two-sided p of the slope).
    Reproduced when p >= 0.05; the r is reported either way. The AP location of an array unit is
    its electrode's position along the anterior-posterior axis; if the dandiset gives only array
    identity (PMd or M1), the two-group comparison of correlations by a two-sided t-test is
    shown as a variant.
- id: ap-location-no-effect-other-datasets
  statement: For monkeys A, B and J, tuning correlation is not related to anterior-posterior location
    (r = -0.05, -0.03, -0.07; p = 0.82, 0.85, 0.52).
  source: Results, Comparison of anterior versus posterior sites, paragraph 1
  quote: Regressing tuning correlation (as in Figure 4 ) against AP location yielded little or no
    effect ... r =-0.05, p =0.82; r =-0.03, p =0.85; r =-0.07, p =0.52
  statistics:
  - about: monkey A
    test: linear regression
    statistic: r = -0.05
    p: 0.82
  - about: monkey B
    test: linear regression
    statistic: r = -0.03
    p: 0.85
  - about: monkey J
    test: linear regression
    statistic: r = -0.07
    p: 0.52
  depends_on:
  - fig4abc-mean-correlation-other-datasets
  criterion: As ap-location-no-effect-j-array, with each penetration's AP coordinate. These
