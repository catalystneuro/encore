- id: fig7c-anterior-posterior-performance
  statement: The peri-movement space captures preparatory tuning at both anterior and posterior
    sites, with normalised performance slightly better at anterior sites.
  source: Results, Comparison of anterior versus posterior sites, paragraph 1; Figure 7C and legend
  quote: The ability of the peri-movement space to capture tuning also held for both anterior and
    posterior sites ( Figure 7C ) ... Performance was slightly better at anterior sites
  depends_on:
  - fig6d-perimovement-best-j-array
  criterion: As the Figure 7C legend says, a six-dimensional peri-movement space; units split at the
    median AP location (>= median anterior, <= median posterior); performance normalised by its
    upper limit (the PCA space of the c x n preparatory matrix of all units, Supplemental
    Experimental Procedures) and compared with random halves. Whether the space for a half is
    built from that half's units or from all units is open; both are run. Reproduced when both
    halves reach at least 70% of the normalised performance of random halves (judgement fixed
    here) and the anterior half is higher than the posterior half (Results, performance slightly
    better at anterior sites); partially reproduced when only the first part holds.
- id: prep-activity-more-anterior
  statement: Preparatory activity is more prevalent at anterior sites.
  source: Results, Comparison of anterior versus posterior sites, paragraph 1
  quote: We similarly found preparatory activity to be more prevalent at anterior sites (data not
    shown)
  criterion: Data not shown, so no method is given. Read here as the fraction of units passing the
    > 5 spikes/s preparatory tuning criterion (O1) being higher among units anterior of the median
    AP location than posterior of it, tested by a two-sided Fisher exact test at p < 0.05;
    partially reproduced when higher without significance.
- id: fig7d-pd-consistency
  statement: The PD measured on two random sets of 25 conditions is more stable (higher dot product)
    in the peri-movement space than in the task, kinematic and EMG spaces, for every comparison and
    every dataset.
  source: Results, Stability of the PD, paragraphs 1 and 2; Figure 7D and legend
  quote: Yet for every comparison, and for all four datasets, the PD was most stable when measured
    in the peri-movement space
  depends_on:
  - fig6d-perimovement-best-j-array
  criterion: Per unit, 25 conditions drawn with replacement, the PD fitted (unit-length b), another
    25 drawn and the PD refitted; consistency is the dot product, averaged over units (Results,
    Stability of the PD). Spaces for the maze task as Figure 7D legend gives them, endpoints + max.
    spd. and segment directions, and the kinematic space at its best k from Figure 6; the
    peri-movement space at the same dimensionality as each comparison space. The number of
    repeats per unit is not given; 100, a standard choice. Reproduced when on J-array the
    peri-movement space is more consistent than each comparison space. If the dandiset has fewer
    than 25 conditions, drawing 25 with replacement still follows the text and is reported as
    such.
- id: fig8-linear-dynamics-simulation
  statement: In a simulated two-unit rotational linear system with 25 random initial states, the
    single-unit correlation between initial (preparatory) and later (peri-movement) activity is
