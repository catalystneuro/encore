  depends_on:
  - fig4-unipolar-strongest
  - fig4-bipolar-weaker
- id: fig5a-trains-stronger-throughout
  statement: Without rotation, the unipolar control trains from e1 cause much stronger
    electroporation throughout the array than 40 Packet 2 applications from e1, and the uptake
    with trains follows the electric field strength.
  source: Results, 3.2, paragraph 1; Figure 5A
  quote: The lack of cancellation caused a much stronger electroporation throughout the array, and
    the distribution of YP uptake expectedly followed the electric field strength distribution in
    Fig. 3C.
  criterion: Profiles along the e1 to e3 diagonal, as in the Fig. 5A legend; per dish, intensity
    per ROI in a.u.; mean over dishes per ROI. The paper reports no test for this finding; the
    Methods' test is the two-sided Student's t-test at p < 0.05 on dish values (Section 2.4).
    "Throughout" allows two readings, (a) trains higher at every ROI, by the t-test at each ROI,
    (b) trains higher in the per-dish mean over all ROIs, by the t-test on those means. The trains
    profile must also decline from e1 toward the center (it follows the field of Fig. 3C).
    Reproduced when both readings hold, not reproduced when neither does, and blocked as
    methods_underspecified when they differ; outcomes under each reading are reported.
- id: fig5a-packet-center-peak-e1-stronger
  statement: Packet 2 without rotation enhances electroporation in the center of the array despite
    the weakening field, but uptake near e1 remains stronger than in the center.
  source: Results, 3.2, paragraph 1; Figure 5A
  quote: In contrast, Packet 2 enhanced electroporation in the center of the array, despite gradual
    weakening of the electric field with distance from e1. However, the bipolar cancellation only
    partially offset the electric field weakening, and electroporation near e1 remained stronger
    than in the center.
  criterion: The 40 Packets profile along the e1 to e3 diagonal (Fig. 5A). The paper gives no
    number. Reproduced when the center ROI exceeds the lowest ROI between e1 and the center (a
    central peak), and the ROI closest to e1 exceeds the center ROI. Which ROI is the center
    (the single ROI at distance 0, or the mean of the two ROIs flanking 0 when none sits at 0)
    is open; both are shown.
- id: fig5bc-rotation-focuses-center
  statement: Rotating the first-energized electrode with Packet 2 (1Px40) makes electroporation in
    the center exceed that at the perimeter, while the same rotation of control trains leaves a
    void of electroporation in the center.
  source: Results, 3.2, paragraph 2; Figure 5B and 5C
  quote: Rotation with Packet 2 “smeared” the electroporation effect at the perimeter and
    emphasized the remote effect in the center. This remote effect contrasted with a void of
    electroporation in the center when the pulse train was applied in the same manner instead of
    the packet.
  criterion: Profiles averaged across both diagonals (Fig. 5B legend), normalized to the most
    peripheral ROI as 100% (Fig. 5C). Which peripheral ROI is open; readings (a) the mean of the
    ROIs closest to each electrode, (b) each diagonal end separately. Reproduced when, under a
    reading, the 1Px40 center is above 100% and the 1T x 40 center is below 100%, and the two
