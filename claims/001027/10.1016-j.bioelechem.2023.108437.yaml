# Claims for Pakhomov, Gudvangen, Mangalanathan, Kondratiev, Redondo & Semenov (2023) on
# dandiset 001027.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-22,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the accepted author manuscript in PubMed Central (PMC10247516, NIHMS1891360), full
# text with Methods and figure legends, as served by PMC. The version of record is not open
# access. PMC lists no supplement and the text cites none. The paper links no analysis code, so
# no repository was read. Every method detail below is from the Methods (sections 2.2 to 2.4),
# the Results or the figure legends.
#
# Data the paper used. CHO-K1 cells; YO-PRO-1 (YP, 1 uM) uptake as the measure of
# electroporation. All pulses are 600 ns, from a 4-channel EPULSUS-FPM4-7 generator.
# (1) Single cells on coverslips (Section 2.2, Fig. 4). Two tungsten electrodes (140 um gap), 15
#     kV/cm first phase. Groups: sham, one unipolar pulse, 4-phase bipolar, 8-phase bipolar,
#     8-phase bipolar with 5-us interphase delays; 21 to 30 cells per group. Confocal images every
#     10 s for 600 s, pulses at 57 s. Per cell, F is the mean pixel intensity in a hand-drawn ROI;
#     F0 is the mean of the six images before the pulses; F-F0 is the measure.
# (2) Cell monolayers in 35-mm dishes with a quadrupole array of four 1.5-mm needles (e1 to e4),
#     small or large (about 2-fold size difference; the large one has an 8.4-mm diagonal).
#     Packets 1 (4 phases), 2 (8 phases) and 3 (8 phases, 5-us delays) of unipolar pulses, each
#     phase 12.5% lower; packets at 1 Hz; "nPxm" names n packets from each of the electrodes in
#     rotation, "1Px40" one packet rotated 40 times, "trains" the control with one electrode
#     energized. YP for 10 min, rinsed, then a stitched 10x image of the area between electrodes.
#     Intensity measured in MetaMorph in 92 (small array) or 224 (large array) ROIs along one or
#     both diagonals, covering +/-1.65 mm or +/-3.65 mm from the array center; areas within 5% of
#     the diagonal length next to electrodes excluded. Shown in a.u. or in % of the most
#     peripheral ROI (closest to an electrode); mean +/- s.e. over 3 to 5 independent experiments
#     (dishes), LOESS fit for display only; two-sided Student's t-test, p < 0.05.
#     Fig. 5: Packet 2 at 6.4 kV, 40 packets without rotation (one diagonal, e1 to e3) or 1Px40,
#     against trains; n = 4 to 5. Fig. 6: Packet 2, 1Px4, 5Px4, 10Px4; n = 3 to 4. Fig. 7: Packet
#     2, small array 1Px4 at first-pulse amplitudes from 2.4 to 5.6 kV, large array 10Px4; n = 3.
#     Fig. 8: Packets 1, 2 and 3 at 4 kV, 1Px4; n = 3 to 4. Fig. 9: large array, Packet 2, 10Px4,
#     6.4 kV, electrode tips 0, 1, 2 or 3 mm above the monolayer; n = 3 to 4. The array of Fig. 5
#     is not stated; Section 3.2 compares its trains profile with the field of Fig. 3C, the large
#     array, which points to the large array.
# (3) Electric field simulations in Sim4Life (Fig. 3), not recordings; no claim is written for
#     them.
#
# The dandiset's title ("CANCAN focusing of electroporation in a quadrupole array by different
# pulsing protocols") and description (protocols applied once from each electrode, four in all,
# first pulse 4 kV, YoPro-1) match the Fig. 8 experiment. The other experiments are claimed as
# well; whether the dataset holds them is the author's to find.
#
# Details the paper leaves open, named in the criteria with the readings it allows: which array
# was used in Figs. 6 and 8 (small or large); whether a profile is taken along one diagonal or
# averaged over both (stated only for Fig. 5); which ROI is "the center" and which is "most
# peripheral" when a diagonal has two ends; the ROI size; whether monolayer intensities are
# background-subtracted; whether the t-test is applied in Fig. 4 (the Methods name it only in
# Section 2.4); and how peak width is measured (Fig. 6).
