claims:
- id: fig4-unipolar-strongest
  statement: A single unipolar 600-ns pulse at 15 kV/cm causes the strongest YP uptake of all
    treatments in single CHO cells, reaching 126 +/- 14 a.u. (n = 25) by the end of recording.
  source: Results, 3.1, paragraph 1; Figure 4
  quote: A single 600-ns pulse at 15 kV/cm caused by far the strongest YP uptake, reaching 126±14
    a.u. (n=25) by the end of recording.
  expected:
  - quantity: YP F-F0 at the end of recording, single unipolar pulse
    value: 126
    tolerance: 14
    unit: a.u.
  criterion: Per cell, F-F0 as in Section 2.2 (ROI mean intensity minus the mean of the six images
    before the pulses), at the last image of the 600-s series; the group mean over cells.
    Tolerance is the paper's s.e. Reproduced when the unipolar mean is within tolerance and is
    the highest of the five groups.
- id: fig4-bipolar-weaker
  statement: Bipolar signals starting with the same pulse cause significantly weaker uptake than
    the single pulse (p < 0.001), reaching 20.8 +/- 2.0 a.u. (4-phase), 6.9 +/- 1.6 a.u. (8-phase)
    and 25.4 +/- 2.8 a.u. (8-phase with 5-us delays) by the end of recording.
  source: Results, 3.1, paragraph 1; Figure 4
  quote: Bipolar signals started with exactly the same pulse (600 ns, 15 kV/cm) but caused
    significantly weaker effects (p<0.001). By the end of recording, YP signal reached only
    20.8±2.0 a.u. for the 4-phasic signal; 6.9±1.6 a.u. for the 8-phasic signal; and 25.4±2.8 a.u.
    for the 8-phasic signal with 5-μs delays between phases.
  statistics:
  - about: each bipolar signal against the single unipolar pulse
    test: not named for Fig. 4; the only test in the Methods is a two-sided Student's t-test
    p: 0.001
    p_relation: "<"
    n: 21 to 30 cells per group
  expected:
  - quantity: YP F-F0 at the end of recording, 4-phase bipolar
    value: 20.8
    tolerance: 2.0
    unit: a.u.
  - quantity: YP F-F0 at the end of recording, 8-phase bipolar
    value: 6.9
    tolerance: 1.6
    unit: a.u.
  - quantity: YP F-F0 at the end of recording, 8-phase bipolar with 5-us delays
    value: 25.4
    tolerance: 2.8
    unit: a.u.
  criterion: F-F0 per cell at the last image, as in fig4-unipolar-strongest; tolerances are the
    paper's s.e. Section 2.2 says F-F0 was used for statistical analyses but names no test; the
    only test the Methods name is the two-sided Student's t-test (Section 2.4), so each bipolar
    group is compared with the unipolar group by that test on per-cell values, and this choice is
    recorded as open.
    Reproduced when all three means are within tolerance and all three tests give p < 0.001;
    partially reproduced when the tests hold but a mean falls outside tolerance.
  depends_on:
  - fig4-unipolar-strongest
- id: fig4-sham-no-uptake
  statement: Sham-exposed cells show no gain in YP fluorescence over the 10 min of observation.
  source: Results, 3.1, paragraph 1; Figure 4
  quote: Sham-exposed cells showed no gain in YP fluorescence during the 10 min of observation.
  criterion: A claim of absence. The paper names no test for it (Section 2.2 names none); its
    only named test is the two-sided Student's t-test at p < 0.05 (Section 2.4), applied here as a
    one-sample test of per-cell F-F0 at the last image against 0, which is the same as a paired
    test of F against F0. That this is the test is open and recorded as such. Reproduced when
    p >= 0.05; the mean F-F0 and its s.e. are reported either way.
- id: fig4-twenty-fold-cancellation
  statement: The 8-phase bipolar signal causes about 20-fold weaker electroporation than a single
    unipolar pulse identical to its first phase, while the 4-phase and the delayed 8-phase signals
    cancel only 4 to 5-fold.
  source: Results, 3.1, paragraph 1, and 3.4, paragraph 1; Figure 4 legend
  quote: the other two types of bipolar signals which were less efficient at cancellation (4–5-fold,
    Fig. 4 ). ... Note that applying the 8-phasic bipolar signal with no inter-phase delays caused
    about 20-fold weaker electroporation than a single unipolar pulse
  expected:
  - quantity: ratio of unipolar to 8-phase F-F0 at the end of recording
    value: 20
    tolerance: 2
  - quantity: ratio of unipolar to 4-phase or delayed 8-phase F-F0, lower bound of the range 4 to 5
    value: 4
    tolerance: 0.4
  - quantity: ratio of unipolar to 4-phase or delayed 8-phase F-F0, upper bound of the range 4 to 5
    value: 5
    tolerance: 0.5
  criterion: Ratios of group means of F-F0 at the last image. The 8-phase ratio is reproduced
    within 18 to 22. Section 3.4 gives 4 to 5-fold for the other two, but the paper's own means
    (126/20.8 = 6.1 and 126/25.4 = 5.0) give 6.1 for the 4-phase signal, so the 4 to 5 range
