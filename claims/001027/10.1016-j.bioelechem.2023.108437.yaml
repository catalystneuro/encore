- id: fig7bd-targeting-independent-of-amplitude
  statement: Normalized to the most peripheral ROI, the profiles for different amplitudes fully
    overlap, in the small array with 1Px4 and in the large array with 10Px4, so targeting does
    not depend on nsEP amplitude within the range studied.
  source: Results, 3.3, paragraph 2; Figure 7B and 7D
  quote: When the YP emission was normalized to the most peripheral ROI, the data for different
    nsEP amplitudes fully overlapped ( Fig. 7B ). ... The findings held true for rotating multiple
    packets and when using the larger array ( Fig. 7C and D ).
  criterion: A claim of absence. The paper reports no test for it; the Methods' test is the
    two-sided Student's t-test at p < 0.05 over dishes (Section 2.4). The text concludes that
    targeting does not depend on amplitude, and Section 3.3, paragraph 1, defines targeting
    efficiency as the ratio of the effect in the center to that near the electrodes, so the
    measure judged is the normalized center value. In each array it is compared between every
    pair of amplitudes. Reproduced when no comparison is significant; not reproduced when any
    is. The effect sizes, and the same tests at the half-way ROI and at every ROI ("fully
    overlapped" read as whole profiles), are shown as variants.
