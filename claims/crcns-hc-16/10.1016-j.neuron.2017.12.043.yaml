    are the large box, the small box, or both. A place field and the in-field rate are not defined
    in the paper or the code linked for Figure 2 (there is none; a field routine in
    CorrelateBPFSpikeTrainEpisodes takes contiguous pixels above a per-cell rate threshold, which
    is not set there). The readings are fields as contiguous pixels (4-connected) with rate above
