# Claims for Talbot, Sparks, Dvorak, Curran, Alarcon & Fenton (2018), Neuron 97:684-697, on CRCNS
# data set hc-16 (doi:10.6080/K01V5C44).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-05,
# protocol as stated in docs/protocol.md (Reader), version pilot-13.
#
# Text read: the version of record with its supplemental information, as supplied under paper/
# (PyMuPDF text of the journal PDF): Results, Discussion, figure legends, STAR Methods, and the
# supplement (Figures S1 to S6, Tables S1 and S2). The PDF pages could not be rendered here, so no
# figure was read from the image. The extracted text prints some signs as other glyphs. "Dt" is
# delta t, "t" before a value in the Kendall passages is tau, "jDIposj" is |delta Ipos|, "3" between
# factors is "x", "hp 2" is partial eta squared, and "10�17" is 10 to the power -17. Quotes keep these
# glyphs as printed; p-values printed as powers of ten were confirmed by reading, as the quote
# checker cannot find them. The second paper under paper/ (Dvorak et al. 2018, PLoS Biol) also
# uses the data set; no claim comes from it, nor from the data set's description.
#
# Code read (the Key Resources Table links three FentonLab repositories, for Figures 3, 4, 5 and
# S5). SpikeField, commit 4dfbc35 (MATLAB, getLFPphase.m and getWavelets.m): spike phases from
# complex Morlet wavelets (wavelet factor 8) at 100 log-spaced frequencies from 2 to 250 Hz on LFP
# sampled at 2 kHz, the wire of each tetrode with the least artifact, spikes in artifact periods
# dropped, cluster 0 dropped; no speed filter. CorrelateBPFSpikeTrainEpisodes, commit 150c2df (C):
# Kendall tau-b (ties corrected) between spike counts of all cell pairs (cluster 0 dropped) in bins
# of a chosen size, in consecutive episodes of 300 s by default from the start of the recording; by
# default a pair of bins enters tau only when, in both bins, the mouse was in a pixel where each
# cell's rate is at or above the cell's mean rate (option KRtThr, default 100% of the mean rate);
# rate maps of 32 x 32 pixels, unsmoothed; samples without a tracked position dropped; no speed
# filter; PCorr vectors and PCo are not computed in it. PositionalInfo, commit 9f186c5 (C):
# momentary Ipos for the observed spike count i at the current pixel x, p(i|x) ln(p(i|x)/p(i)), one
# value per position sample of the input file, on a 32 x 32 pixel map, pixels visited fewer than 10
# times left undefined; natural log, and sign kept unless option -A; delta Ipos, the ensemble sums
# and the correlations are not computed in it.
#
# Data the paper used. Ex vivo slices (Figure 1, S1): male WT (n = 22) and Fmr1-null (n = 26)
# mice, 3-4 months, naive (home cage), exposed or trained in active place avoidance; fEPSPs at CA1
# stratum radiatum. In vivo (Figures 2 to 6, S2 to S6): male WT (12) and Fmr1-null (9) mice, 4-6
# months, tetrodes in dorsal CA1 (Axona recording, 8-tetrode Flexdrive or 4-tetrode Versadrive),
# position tracked at 30 frames/s from head LEDs (room frame, and arena frame during rotation).
# Environments: small box (28.5 cm square), large box (50 cm square), a 10 cm wide ring (40 cm
# outer diameter), and a 40 cm circular arena, stationary or rotating at 0.75 rpm; recordings
# during quiet wakefulness and sleep for a subset. 1,115 clusters (499 WT, 616 Fmr1-null); 226 WT
# and 334 Fmr1-null well-isolated cells. Table S2 lists, per mouse (M1 to M37 and pie1 to pie6),
# the date, environment (big box, small box, ring, stationary arena 1 and 2, rotating arena),
# tetrode and cell counts; its extracted text lists 11 WT and 9 Fmr1-null mice. Nine mice (5 WT, 4
# Fmr1-null) were later trained in active place avoidance (Figure 6), with shock zone entries per
# session as the measure.
#
# The CRCNS data set, by its title and description, holds CA1 spike trains with position (TS files:
# spike times and x, y per position sample), from WT and Fmr1-null mice, in directories by
# environment (small and large box, ring, stationary and rotating circular arena) and genotype. Its
# description lists no LFP, no waveforms, no slice recordings and no avoidance sessions. Claims that
# need those are kept as the paper's findings; the author decides what the data set can test.
#
# Methods shared by several claims, from the STAR Methods unless said otherwise.
# Cells. Units with IsoIBG and IsoINN of at least 4 bits; pyramidal cells have waveforms longer than
# 250 (printed "ms", read as microseconds), rate below 2 AP/s and bursts (peak ISI below 10 ms);
# interneurons have short waveforms and rate above 2 AP/s. Place cells have overall rate 0.1-2
# AP/s, spatial coherence (z) above 0.4 and information content above 0.4 bits/spike; the other
# pyramidal cells are non-spatial pyramidal cells. Rate maps have 1.25 x 1.25 cm pixels (spikes
# over time in each pixel). The session used to classify a cell ("standard recordings") is open:
# the readings are its first stationary-environment session, or each session classified on its
# own. Map smoothing and a minimum occupancy are not stated; unsmoothed maps (the Methods stress
# measures free of smoothing) and pixels with any occupancy are used, a standard choice.
# Passes. A pass is a 5 s interval in which the expected count exp (the sum over visited pixels of
# time spent times the session's time-averaged rate there) is at least the cell's average rate;
# z = (obs - exp)/sqrt(exp). How the 5 s intervals are placed is not stated; consecutive,
# non-overlapping intervals from the start of the session are used (the reading the text gives,
# "each 5 s interval"), and a 1 s sliding step is shown as a variant. For a pair, passes are the
# intervals that qualify for both cells.
# Kendall. Tau between spike-count series of a cell pair at 25, 40, 125, 250 ms, 1 s and 5 s.
# Two readings of which bins enter, both to be run: (K1) every bin of the session, as the Results
# call the measure "location-independent"; (K2) the code's default, only bin pairs in which the
# mouse was in an active pixel (rate at least the cell's mean) of both cells. Tau-b, as in the code.
# Correlations are compared on Fisher z values where a t test is used (Quantification).
# Statistics. Two-group comparisons by t test, with Mann-Whitney U when a sample is not normal by
# Shapiro-Wilk; proportions by z test; ANOVA with Tukey post hoc; significance at p < 0.05.
schema_version: 2
dataset:
  archive: crcns
  id: hc-16
  doi: 10.6080/K01V5C44
paper: doi:10.1016/j.neuron.2017.12.043
claims:
- id: fig1ab-baseline-transmission
  statement: Baseline CA3-CA1 synaptic responses do not differ between naive WT and Fmr1-null
    slices; training enhances them in both genotypes, and Fmr1-null mice, unlike WT, show the
    enhancement after control exposure as well, with responses almost twice those of naive mice.
  source: Results, Exaggerated Baseline and Learning-Induced Changes, paragraph 1; Figure 1A and 1B
  quote: Synaptic responses from the exposed Fmr1-null group were almost twice as large as the
    task-naive Fmr1-null and the WT groups (Figure 1B)
  statistics:
  - about: training effect, area under the stimulus-response curve
    test: two-way genotype x training ANOVA
    statistic: F(2, 42) = 25.7
    p: 1.0e-8
  - about: genotype x training interaction
    test: two-way genotype x training ANOVA
    statistic: F(1, 42) = 3.49
    p: 0.04
  criterion: As in the Figure 1 legend, a two-way genotype x training (naive, exposed, trained)
    ANOVA on the area under each slice's stimulus-response curve (fEPSP slope against stimulus
    voltage, 0 to 40 V, Methods), with Tukey post hoc tests. Reproduced when the training effect and
    the interaction have p < 0.05 and the Tukey tests give Fmr1-null exposed above WT exposed and
    above both naive groups, with naive WT and naive Fmr1-null not different. Whether the unit is
    the slice or the mouse is not stated; the slice is used, as the Methods describe one slice
    recording per stimulus-response curve.
- id: fig1cd-potentiation
  statement: Post-tetanic and early potentiation after 100 Hz stimulation are greater in exposed
    Fmr1-null than in exposed WT mice and smaller in trained mice of both genotypes; late
    potentiation does not differ between genotypes but is weakest in the trained groups.
  source: Figure 1C and 1D legend; Results, Exaggerated Baseline and Learning-Induced Changes,
    paragraph 1
  quote: The de novo protein-synthesis-independent PTP and early-potentiation changes were greater
    in exposed Fmr1-null mice than in exposed WT mice ... De novo protein-synthesis-dependent late
    potentiation was not different between the genotypes
  statistics:
  - about: PTP, exposed Fmr1-null against exposed WT
    test: two-way genotype x training ANOVA, genotype effect
    statistic: t(42) = 2.79
    p: 0.008
  - about: early potentiation, exposed Fmr1-null against exposed WT
    test: two-way genotype x training ANOVA, genotype effect
    statistic: t(42) = 3.62
    p: 0.0008
  - about: PTP, training effect
    statistic: F(2, 42) = 13.72
    p: 1.0e-5
  - about: early potentiation, training effect
    statistic: F(2, 42) = 14.42
    p: 1.0e-5
  - about: late potentiation, genotype
    statistic: t(42) = 0.84
    p: 0.4
  - about: late potentiation, training effect
    statistic: F(2, 42) = 19.36
    p: 1.0e-6
  criterion: Phases from the Methods, as slope relative to the 10 min baseline before HFS, PTP the
    mean of the first 8 min, early 10-20 min, late 50-60 min after HFS. A two-way genotype x
    training ANOVA per phase, as the legend does. Reproduced when PTP and early potentiation show
    exposed Fmr1-null above exposed WT at p < 0.05 and a training effect at p < 0.05 with trained
    lowest, and late potentiation shows no genotype effect (p >= 0.05) and a training effect at p <
    0.05.
- id: figs1-avoidance-equal
  statement: Fmr1-null mice learn the active place avoidance task as well as WT mice (the slice
    cohort).
  source: Results, Exaggerated Baseline and Learning-Induced Changes, paragraph 1; Figure S1
  quote: Fmr1-null mice performed as well as WT mice (Figure S1) in the hippocampus- and
    LTP-dependent active place avoidance task
  criterion: A claim of absence for which the paper prints no test. The test for the same measure
    in Figure 6D (a genotype x session repeated-measures ANOVA on entries per session) is used,
    over the trained mice's Pretrain, Train 1-3 and Retest sessions. Reproduced when the genotype
    effect has p >= 0.05; the effect size is given either way.
- id: unit-and-cell-counts
  statement: Of 1,115 clusters, 499 came from 12 WT and 616 from 9 Fmr1-null mice; 226 WT and 334
    Fmr1-null well-isolated cells formed the data set.
  source: Results, Non-spatial and Spatial Single-Cell Discharge Features, paragraph 1; Table S2
  quote: Of the 1,115 single-unit waveform clusters that were identified, 499 were recorded from 12
    WT mice and 616 were recorded from 9 Fmr1-null mice (Table S2) ... 226 WT and 334 Fmr1-null
    presumptive cells comprised the dataset
  expected:
  - quantity: WT clusters
    value: 499
    tolerance: 49.9
  - quantity: Fmr1-null clusters
    value: 616
    tolerance: 61.6
  - quantity: WT cells passing isolation criteria
    value: 226
    tolerance: 22.6
  - quantity: Fmr1-null cells passing isolation criteria
    value: 334
    tolerance: 33.4
  - quantity: WT mice
    value: 12
    tolerance: 0
  - quantity: Fmr1-null mice
    value: 9
    tolerance: 0
  criterion: Mice are counted exactly. The extracted Table S2 lists 11 WT mice, so 11 and 12 are
    both readings of the WT count. Whether a cell recorded in several sessions is counted once or
    per session is open; both counts are given and either may match.
- id: interneuron-proportion
  statement: A lower proportion of the well-isolated cells is classified as interneurons in WT (28,
    12.4%) than in Fmr1-null mice (98, 29.3%).
  source: Results, Non-spatial and Spatial Single-Cell Discharge Features, paragraph 1
  quote: A lower proportion of these were classified as interneurons in WT mice (28, 12.4%) than
    Fmr1-null mice (98, 29.3%; test of proportions z = 9.4, p = 10�17)
  statistics:
  - test: test of proportions
    statistic: z = 9.4
    p: 1.0e-17
    n: 226 WT and 334 Fmr1-null cells
  expected:
  - quantity: WT interneuron percentage
    value: 12.4
    tolerance: 1.24
    unit: '%'
  - quantity: Fmr1-null interneuron percentage
    value: 29.3
    tolerance: 2.93
    unit: '%'
  criterion: Classification as in the Methods (waveform duration, rate, bursting). Reproduced when
    both percentages are within tolerance and a two-proportion z test gives p < 0.05 with WT lower.
    The printed z cannot be recovered from the printed counts by a pooled two-proportion z test,
    which gives about 4.7, so z itself is not a target. Waveform duration needs waveforms; when the
    data hold none, the classification by rate and bursting alone is a variant, and the claim
    rests on it.
- id: place-cell-proportion
  statement: Place cells are less prevalent in Fmr1-null mice (141, 42.2%) than in WT mice (108,
    47.8%).
  source: Results, Non-spatial and Spatial Single-Cell Discharge Features, paragraph 1
  quote: when the putative principal cells were classified as place cells (WT n = 108 [47.8%], Fmr1
    null n = 141 [42.2%]), the prevalence was lower in the Fmr1-null mice (test of proportions z =
    2.04, p = 0.02)
  statistics:
  - test: test of proportions
    statistic: z = 2.04
    p: 0.02
  expected:
  - quantity: WT place cells
    value: 108
    tolerance: 10.8
  - quantity: Fmr1-null place cells
    value: 141
    tolerance: 14.1
  - quantity: WT place cell percentage
    value: 47.8
    tolerance: 4.78
    unit: '%'
  - quantity: Fmr1-null place cell percentage
    value: 42.2
    tolerance: 4.22
    unit: '%'
  criterion: Place cell criteria from the Methods (rate 0.1-2 AP/s, coherence z above 0.4,
    information above 0.4 bits/spike). The denominator is open. The printed percentages are 108/226
    and 141/334, all well-isolated cells; the sentence names the principal cells (198 WT, 236
    Fmr1-null), which would give 54.5% and 59.7%. Both readings are run, and the claim holds under
    one if the counts and percentages are within tolerance and a two-proportion z test (one-sided,
    as the printed p suggests, and two-sided as a variant) gives p < 0.05 with Fmr1-null lower. The
    printed z cannot be recovered from the printed counts by a pooled test (about 1.3 for the
    first reading), so z is not a target.
- id: figs3-nonspatial-properties-similar
  statement: Waveform width, burst probability, interspike interval and overall firing rate do not
    differ between genotypes in any cell class.
  source: Figure S3C to S3F; Results, Non-spatial and Spatial Single-Cell Discharge Features,
    paragraph 1
  quote: The fundamental extracellular waveform and non-spatial discharge characteristics of the
    classified cells were indistinguishable between the genotypes
  statistics:
  - about: action potential width, genotype
    test: two-way genotype x cell class ANOVA
    statistic: F(1, 386) = 0.97
    p: 0.32
  - about: burst probability, genotype
    test: two-way genotype x cell class ANOVA
    statistic: F(1, 386) = 0.69
    p: 0.41
  - about: interspike interval, genotype
    test: two-way genotype x cell class ANOVA
    statistic: F(1, 386) = 2.78
    p: 0.1
  - about: overall firing rate, genotype
    test: two-way genotype x cell class ANOVA
    statistic: F(1, 386) = 0.32
    p: 0.57
  criterion: A claim of absence on the paper's test, a two-way genotype x cell class ANOVA per
    measure (Figure S3 legend). Burst probability is the fraction of interspike intervals below 10
    ms; width is at 30% of the peak; the interspike interval measure (mean or median per cell) is
    not stated, the mean is used and the median shown as a variant. Reproduced when no genotype
    effect has p < 0.05; the effect sizes are given. Measures needing waveforms are left to the
    author if the data hold none.
- id: fig2-spatial-quality-similar
  statement: In a fixed environment, spatial firing quality (coherence, proportion of active pixels,
    information content, number of place fields, in-field rate) differs between place cells and
    interneurons but not between genotypes.
  source: Figure 2B to 2F; Results, Non-spatial and Spatial Single-Cell Discharge Features,
    paragraph 1
  quote: Spatial firing quality differs between place cells and interneurons, but not between
    genotypes, as assessed by two-way genotype 3 cell class ANOVAs
  statistics:
  - about: spatial coherence, genotype
    test: two-way genotype x cell class ANOVA
    statistic: F(1, 340) = 0.60
    p: 0.44
  - about: proportion of active pixels, genotype
    statistic: F(1, 340) = 3.7
    p: 0.06
  - about: information content, genotype
    statistic: F(1, 340) = 3.6
    p: 0.06
  - about: number of place fields, genotype
    statistic: F(1, 340) = 0.13
    p: 0.72
  - about: in-field firing rate, genotype
    statistic: F(1, 340) = 0.24
    p: 0.62
  criterion: A claim of absence on the paper's test, a two-way genotype x cell class (place cell,
    non-spatial pyramidal, interneuron) ANOVA per measure on cells recorded "in the box" (Figure 2
