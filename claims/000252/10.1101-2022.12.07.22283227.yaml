# Claims for Guan et al., "Compositional coding of individual finger movements in human posterior
# parietal cortex and motor cortex enables ten-finger decoding", on dandiset 000252.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23,
# protocol pilot-10 as stated in docs/protocol.md (Reader).
#
# Text read. The bioRxiv preprint, version 1 (doi:10.1101/2022.12.07.22283227), full text from
# bioRxiv JATS XML (paper/10.1101-2022.12.07.22283227.txt): main text, Methods, figure legends and
# the supplementary figure legends (Supplementary Figures 1 to 11). The contents of Supplementary
# Table 1 (phase durations) and Supplementary Table 2 (session dates) are not in the text, only
# their legends; no claim here rests on their numbers, since every analysis window is defined from
# a phase onset. The equation of the cross-validated Mahalanobis distance (Methods, Neural distance
# between fingers) is lost in the text; its description in words is used. No PDF was supplied.
#
# Code. The paper links no analysis code. It names two Python libraries: the representational
# similarity analysis toolbox (rsatoolbox, ref 57) for cross-validated Mahalanobis distances, and
# DABEST (ref 53) for Hedges' g with bootstrap confidence intervals.
#
# Dataset. Its archive title is "Finger_RL: human intracortical recordings during attempted finger
# movements of right and left hands", and the paper's Data Availability names dandiset 000252. It is
# meant to hold the ten-finger (right and left hand) task; whether it also holds the
# contralateral-only, reaction-time and BMI sessions is for the author to find.
#
# Data the paper used.
# - Participants. N, tetraplegic woman (C3-C4, AIS-A), one working 96-channel Utah array in left
#   PPC at the junction of the intraparietal and postcentral sulci (PC-IP), called N-PPC. J,
#   tetraplegic man (C4-C5), two 96-channel arrays recorded simultaneously, J-PPC in the superior
#   parietal lobule and J-MC near the hand knob of left motor cortex.
# - Ten-finger press task (Figure 3, 7, 8). Text-cued, instructed delay, all ten fingers (R or L
#   hand; t, i, m, r, p) interleaved in each run-block. N, 100 trials per session over 10
#   sessions; J, 100 trials per session over 2 sessions. N-PPC 111 neurons per session (102 to
#   119), 1111 pooled; J-PPC 160 (159 to 160); J-MC 130 (120 to 130).
# - Alternating-cues task with delay (Figures 1, 4, 5). Right-hand fingers T, I, M, R, P and a
#   No-Go X, Spatial-Cue and Text-Cue variants interleaved. N, 120 trials per session over 4
#   sessions (480); J, 112 per session (96 to 120) over 3 sessions (336). N-PPC 118 neurons per
#   session (111 to 128); J-PPC 103 (92 to 116); J-MC 93 (90 to 95). The legends correct for 466,
#   308 and 278 neurons pooled.
# - Reaction-time task with randomized cue location (Figure 2, 6). 3 x 4 letter grid, 48 trials per
#   run-block, decoded finger shown 1.5 s after the cue. Online BMI, N 4016 trials over 9 sessions
#   (previously reported in ref 46), J 1488 trials over 8 sessions (right hand), J 336 trials over
#   3 sessions (left hand).
# - Measured variables. Sorted single-neuron spike times (k-medoids clusters) for offline
#   analyses; threshold crossings (-3.5 x RMS) per electrode for online control.
#
# Method fixed by the paper (Methods, Feature Extraction and following sections). Firing rate is
# the spike count in a 500 ms window over its duration. Go (move) window 200 to 700 ms after the Go
# cue; Delay (plan) window 200 to 700 ms after the Delay screen; Cue window 200 to 700 ms after the
# Cue screen; ITI window the last 500 ms of the ITI. Neurons with mean rate below 0.5 Hz are
# excluded from all analyses. Single-neuron selectivity is a one-way ANOVA across conditions,
# Benjamini-Hochberg FDR over the neurons of a participant (pooled across sessions), q < 0.05;
# large effect eta2 > 0.14; Dunnett's test against No-Go for which fingers differ. Offline
# classifier is diagonal-covariance LDA (Gaussian naive Bayes with one shared covariance), one per
# session, stratified 8-fold cross-validation, accuracies pooled over trials of all sessions.
# CCGP uses a pseudo-population of neurons pooled across sessions, and a permutation test with 1001
# label shuffles.
#
# Details the paper leaves open, with the readings each criterion runs (all are run; the outcome is
# the one they all give, or the claim is methods_underspecified).
# - O1 The 0.5 Hz exclusion. (a) mean rate over the whole session; (b) mean rate over the analysis
#   windows of all trials of the task.
# - O2 Fold assignment of stratified 8-fold cross-validation. (a) folds in trial order, no
#   shuffling (scikit-learn StratifiedKFold default); (b) shuffled folds, repeated over 10 seeds
#   and averaged (the seed is a standard choice and is reported).
# - O3 Noise covariance of the cross-validated Mahalanobis distance (rsatoolbox). (a) from the
#   residuals about the condition means, with diagonal shrinkage ('shrinkage_diag'); (b) the same
#   with shrinkage toward identity ('shrinkage_eye'); (c) diagonal only ('diag'). The Methods say
#   a noise covariance is used and that both folds' covariances enter, not how it is estimated.
# - O4 Cross-validation partition of the distance. (a) two independent halves A and B of each
#   condition's trials (odd and even repetitions), as the Methods' wording of partitions A and B
#   reads; (b) leave-one-repetition-out over all fold pairs (rsatoolbox crossnobis with each
#   repetition index as the cross-validation descriptor).
# - O5 The 95% confidence interval of the matching against non-matching distance difference.
#   (a) bias-corrected and accelerated bootstrap of the difference of means, as DABEST (the
#   estimation library the Methods name) computes it, 5000 resamples; (b) percentile bootstrap.
#   Both resample the RDM elements pooled over sessions, which Figure 8b plots.
# - O6 Pseudo-trials of the CCGP pseudo-population. (a) trials matched across sessions by their
#   repetition index within condition; (b) trials matched at random within condition, resampled
#   100 times and averaged.
# - O7 The linear decoder of the CCGP analysis. (a) the diagonal LDA of the Methods' offline
#   classification; (b) a linear support vector machine, as in the CCGP literature the Methods cite
#   (ref 60). The paper says only "linear decoders".
# - O8 Within-condition (standard) finger-type accuracy that bounds finger-type CCGP. (a) a 5-class
#   finger decoder trained and tested within each hand by stratified 8-fold cross-validation,
#   averaged over hands (the "within-hand accuracy" of Results, last paragraph); (b) a 5-class
#   finger-type decoder over the trials of both hands, cross-validated the same way.
# - O9 "Close to" standard accuracy (Figure 8e). The paper prints no margin. (a) CCGP at least 0.9
#   of the standard accuracy; (b) the CCGP to accuracy ratio above that of J-PPC finger-type, which
#   the paper calls much lower (36% against 65%, ratio 0.55).
# - O10 Features of the retrospective single-array BMI decoder. (a) threshold crossing rates per
#   electrode in [0.5, 1.5] s after the cue, as online; (b) sorted neurons in the same window.
# - O11 Analysis window of the ten-finger analyses (selectivity, decoding, distances, CCGP). The
#   Results and legends of Figures 7 and 8 do not name it. The Go window is used, as the Feature
#   Extraction default for movement execution and as the Results compare these results with the
#   contralateral-only movement-period results ("Similar to the contralateral-only results"). No
#   other reading is supported by the text.
#
# Tolerances. 10% of each reported value, except where the paper gives a confidence interval or a
# spread, as each claim says.
