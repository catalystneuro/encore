    sessions, as the Methods pool single-neuron metrics; (ii) the mean over sessions of the
    per-session percentages, as the Figure 4c line shows. Reproduced when, under one reading,
    all four values are within tolerance.
- id: fig5a-contra-decoding
  statement: Contralateral finger movements (five fingers and No-Go) are classified offline well
    above the 17% chance level (N-PPC 86%, J-PPC 64%, J-MC 84%), and most errors are adjacent
    fingers (75%, 42%, 67%).
  source: Results, Classifying finger presses from neural activity, paragraph 1; Figure 5a;
    Supplementary Figures 4a and 5a
  quote: "Classification accuracies substantially exceeded chance (N-PPC: 86%; J-PPC: 64%; J-MC:
    84%; chance: 17%). The majority (N-PPC: 75%; J-PPC: 42%; J-MC: 67%) of errors misclassified an
    adjacent finger"
  expected:
  - quantity: N-PPC accuracy (480 trials over 4 sessions)
    value: 86
    tolerance: 8.6
    unit: "%"
  - quantity: J-PPC accuracy (336 trials over 3 sessions)
    value: 64
    tolerance: 6.4
    unit: "%"
  - quantity: J-MC accuracy (336 trials over 3 sessions)
    value: 84
    tolerance: 8.4
    unit: "%"
  - quantity: N-PPC adjacent-finger share of errors
    value: 75
    tolerance: 7.5
    unit: "%"
  - quantity: J-PPC adjacent-finger share of errors
    value: 42
    tolerance: 4.2
    unit: "%"
  - quantity: J-MC adjacent-finger share of errors
    value: 67
    tolerance: 6.7
    unit: "%"
  criterion: As tenfinger-decoding-accuracy, over six classes (T, I, M, R, P, No-Go) in the Go
    window. J-PPC 42% is called a majority in the text although below half; it is reproduced as a
    number. The paper does not say how errors involving No-Go enter the share; readings (a) all
    errors form the denominator and those involving No-Go are not adjacent; (b) only errors
    between two finger classes form the denominator. Reproduced when, under one reading of O1, O2
    and these, all six values are within tolerance; partially reproduced when the three
    accuracies are.
- id: fig5bcd-npcc-data-requirements
  statement: For N-PPC, cross-validated accuracy reaches 80% with about 40 training trials, about 70
    neurons, and window durations of about 350 ms.
  source: Results, Classifying finger presses from neural activity, paragraphs 3 and 4; Figure 5b
    to 5d
  quote: Cross-validated accuracy increased with more training data, reaching 80% accuracy when
    training on about 40 trials (2.7 minutes) for N-PPC. Higher neuron counts provide more finger
    information and thus improved classification accuracy, reaching 80% accuracy at about 70
    neurons for N-PPC
  depends_on:
  - fig5a-contra-decoding
  expected:
  - quantity: training trials to reach 80%
    value: 40
    tolerance: 4
  - quantity: neurons to reach 80%
    value: 70
    tolerance: 7
  - quantity: window duration to reach 80%
    value: 350
    tolerance: 35
    unit: ms
  criterion: As in Methods, Offline classification. Learning curve from subsets of each training
    fold; neuron-dropping curve from random subsets of neurons stacked across the 4 sessions;
    window sweep [200 ms, 200 ms + duration] after Go. Each value is the smallest training size,
    neuron count or duration at which mean accuracy reaches 80%. Step sizes and the number of
    random subsets (100) are standard choices. How stacked neurons of different sessions form
    trials is not stated; readings as O6. Reproduced when, under one reading, all three values are
    within tolerance.
- id: fig5e-planning-decoding
  statement: Finger movements are also decoded from PPC during the planning period, with lower
    accuracy than during execution (N-PPC 66%, J-PPC 61%, chance 17%).
  source: Results, Classifying finger presses from neural activity, paragraph 5; Figure 5e
  quote: "Finger movements could also be decoded from PPC during the planning period ( Figure 5e
    )), although classification accuracy was lower (N-PPC: 66%; J-PPC: 61%; chance: 17%) than
    during movement execution"
  depends_on:
  - fig5a-contra-decoding
  expected:
  - quantity: N-PPC Delay-window accuracy
    value: 66
    tolerance: 6.6
    unit: "%"
  - quantity: J-PPC Delay-window accuracy
    value: 61
    tolerance: 6.1
    unit: "%"
  criterion: As fig5a-contra-decoding in the Delay window. Reproduced when, under one reading, both
    values are within tolerance and below the Go-window accuracies.
- id: fig6-online-bmi
  statement: During online BMI control of right-hand fingers, participant N reached 86% accuracy
    (4016 trials over 9 sessions) and J 92% (1488 trials over 8 sessions), against 17% chance.
  source: Results, Brain-machine interface control of finger movements, paragraphs 3 and 4; Figure
    6a and 6b
  quote: Confusion matrix for participant N (PPC), right-hand finger presses. 86% accuracy, 4016
    trials over 9 sessions ... Confusion matrix for participant J (PPC+MC), right-hand finger
    presses. 92% accuracy, 1488 trials over 8 sessions
  expected:
  - quantity: N online accuracy
    value: 86
    tolerance: 8.6
    unit: "%"
  - quantity: J online accuracy
    value: 92
    tolerance: 9.2
    unit: "%"
  criterion: Accuracy is the share of online trials whose decoded class (shown 1.5 s after the cue)
    equals the cued class, over all trials of the BMI runs (calibration runs without classifier
    output excluded). Reproduced when both are within tolerance and the trial and session counts
    match.
- id: figs6-single-array-retrospective
  statement: Retrospectively decoding J's BMI trials from a single array, with a classifier trained
    on earlier run-blocks, gives 83% (plus or minus 7%) from J-PPC and 87% (plus or minus 8%) from
    J-MC.
  source: Results, Brain-machine interface control of finger movements, paragraph 4; Supplementary
    Figure 6
  quote: We trained the linear classifier on earlier run-blocks [0, 1, …, M-1] and evaluated on
    run-block M, repeating for all run-blocks in each session. 83% +/- 7% accuracy (chance 17%),
    1488 trials over 8 sessions ... Same as (a) using J-MC population activity. 87% +/- 8%
    accuracy (chance 17%), 1488 trials over 8 sessions
  expected:
  - quantity: J-PPC retrospective accuracy
    value: 83
    tolerance: 7
    unit: "%"
  - quantity: J-MC retrospective accuracy
    value: 87
    tolerance: 8
    unit: "%"
  criterion: Tolerances are the paper's spread. Diagonal LDA trained on run-blocks 0 to M-1 of a
    session and tested on block M, for every block, features by O10; accuracy pooled over the 1488
    trials. Whether block 0 (the calibration run) is itself tested is not stated; it is not, as it
    has no earlier block to train on. Reproduced when, under one reading, both values are within
    tolerance.
- id: figs7-left-hand-bmi
  statement: Participant J controlled left-hand finger presses through the BMI with 94% accuracy
    (336 trials over 3 sessions).
  source: Supplementary Figure 7
  quote: Confusion matrix for participant J (PPC+MC), left-hand finger presses. 94% accuracy, 336
    trials over 3 sessions
  expected:
    quantity: J left-hand online accuracy
    value: 94
    tolerance: 9.4
    unit: "%"
  criterion: As fig6-online-bmi, for the left-hand runs.
