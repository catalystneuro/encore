# Claims for Kim & Shin (2025), doi:10.1101/2025.06.30.662469, read for dandiset 000248.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-21,
# protocol as stated in docs/protocol.md (Reader).
#
# Text read: paper/10.1101-2025.06.30.662469.txt, the bioRxiv full text of the preprint posted
# July 04, 2025, under the title "Neural variability structure in primary visual cortex is optimal
# for robust representation of visual similarity". The registry lists the paper under a later
# title ("Intrinsic geometry of trial-to-trial variability in primary visual cortex is optimal for
# robust representation of visual similarity"); that later version was not supplied, and every
# claim here is from the July 2025 text. That text holds the Results, Discussion, Methods and the
# legends of Figures 1 to 4 and S1 to S6; the supplementary figures are part of it, and there is
# no separate supplement. The equations of the Methods (slope manipulation, effective
# dimensionality, orthogonal component, number of RSA trial pairs, modulated Poisson model) are
# lost in the extraction, and the legends of Figures 2 and 3 are cut after "(Wilcoxon signed-rank
# test". No PDF was supplied, so figure panels could not be read. Where the equations are needed
# they are taken from the code below.
#
# Code read: GitHub jhk4839/Neural_variability_robustness at commit
# ac3300b007c2348ccda73c0c87fb02f557791089 (2025-07-03), the last commit before the preprint was
# posted; its README names the July 2025 title and maps the notebooks to this text's figure
# numbers (fit_slope_histogram for 1B, 1C, S1 to S3, S5A; dimensionality_tangent for 1D, 2D;
# box_counting_analysis for S5C; decode_noise_corr for 2B, S4, S6A; RSA_overlap_SCC for 2A, 2C,
# 4, S4C, S6B, S6C; ortho_variance for 3A to 3D; local_global_alignment for 3E, 3F;
# visualize_manifold for 1C, S5B, S5D; fit_slope_openscope fits slopes to the Illusion data and
# makes no figure). The notebooks load pickles that are not in the repository. The head of the
# repository (2026) belongs to the later version and uses other figure numbers; it was not used.
#
# Data the paper used.
# (1) Main dataset, not in dandiset 000248. Allen Brain Observatory Visual Coding Neuropixels,
#     "Brain Observatory 1.1" sessions, "natural scenes" block, read through AllenSDK. 32
#     sessions, one mouse each; 2 excluded for V1 (more than 10% of natural scenes trials with no
#     spikes in any unit), leaving 30 (the code drops session indices 0 and 6). 119 stimuli (118
#     natural scenes and a gray image), 250 ms each, no interval, 50 repeats in random order (one
#     session 47 to 50 repeats, subsampled to 47 for decoding and RSA). Spike counts in the 250 ms
#     from onset. Units kept when isi_violations < 0.5, amplitude_cutoff < 0.1 and presence_ratio
#     > 0.9. V1 has 64 +- 25 units per session (14 to 110). Higher visual areas LM, RL, AL, PM, AM
#     (one RL session also excluded). Running speed (moving when the trial mean speed is >= 1
#     cm/s) and pupil area (tertiles of the trial mean) for Figure S2. Natural movie one (30 s,
#     60 repeats) from 23 of 26 "Functional Connectivity" sessions, in 12-frame (400 ms) bins, 75
#     bins, for Figure S5A and S5B.
# (2) Allen Institute OpenScope Illusion dataset, dandiset 000248, used only for the Isomap
#     pictures of Figures 1C (bottom), 3A, 3E (left) and 3F (left). V1 spike counts in the 400
#     ms from stimulus onset, all stimuli with 400 repeats in the "ICwcfg1" block of one example
#     session. In the paper's code the data come from a post-processed MATLAB copy (folder
#     "OpenScopeData_00248_v240130_postprocessed") with 11 subjects, sub_619296, sub_620333,
#     sub_620334, sub_625545, sub_625554, sub_625555, sub_630506, sub_631510, sub_631570,
#     sub_633229 and sub_637484; the example is index 6, sub_630506. V1 units are those whose
#     location contains "VISp" and not "VISpm"; spike counts are the stored rate times 0.4 s; no
#     unit quality filter is applied in the code (a waveform-duration filter is commented out).
#     Stimulus codes are named by the code's map 0 Blank, 1 X, 2 Tc1, 3 Ic1, 4 Lc1, 5 Tc2, 6 Lc2,
#     7 Ic2, 8 Ire1, 9 Ire2, 10 Tre1, 11 Tre2, 12 Xre1, 13 Xre2, 14 BR_in, 15 BL_in, 16 TL_in, 17
#     TR_in, 18 BR_out, 19 BL_out, 20 TL_out, 21 TR_out. The code expects 12 stimuli with 400
#     repeats. Figure 1C shows Ic1, Lc1 and Tre1; Figure 3A shows Ic1, Lc1 and Tre2; Figures 3E
#     and 3F left show Lc1 and Tre2 against the rest.
# Only the claims marked data dataset (illusion-*) can be tested on dandiset 000248. Every other
# claim is on the Allen Visual Coding Neuropixels data (data elsewhere).
#
# Shared method, from the Methods unless stated.
# - M1 slope fit. Per session and stimulus, across-trial mean and variance (ddof 1, code) of each
#   neuron's spike count; neurons with zero count on all trials of the stimulus excluded; OLS of
#   log10 variance on log10 mean across neurons (np.polyfit, code) gives slope s and intercept i.
# - M2 slope manipulation (Methods, "Manipulation of slope by residual rescaling"; the equations
#   are lost in the text and taken from the code). Target slopes s' from 0 to 2 in steps of 0.1.
#   For each neuron, log10 var' = (s'/s)(log10 var - i) + (s - s') mean_n(log10 mean) + i, which
#   keeps the mean log variance across neurons; each trial's residual (count minus the stimulus
#   mean) is multiplied by sqrt(var'/var) and added back to the mean; neurons with zero mean stay
#   0. Means, pairwise noise correlations and the summed log variance are unchanged.
# - M3 overlap percentage of manifold A relative to B. The fraction of A's trials whose nearest
#   trial of B is closer than the 5th percentile of the pairwise distances within B (Euclidean,
#   in the N-neuron space; box_and_overlap.py uses np.percentile(..., 5)).
# - M4 statistics on curves. Each slope-changed value is compared with the as-is value by a
#   Wilcoxon signed-rank test across sessions (or session pairs), p < 0.05, uncorrected (the
#   notebooks call scipy wilcoxon per slope with no correction). n is 30 sessions or 435 session
#   pairs for V1.
# - M5 geodesic distances between centroids. Isomap (n_neighbors 5) fitted on all trials with the
#   stimulus centroids appended; the geodesic distance matrix among the centroids
#   (compute_geo_ortho.py, local_global_alignment.py).
#
# Details the paper leaves open, used by several criteria.
# - O1 "peaks near (around) slope 1". The paper fixes no window. Readings, (a) the slope with the
#   largest across-session mean lies in 0.8 to 1.2, (b) in 0.7 to 1.3; in both, the values at
#   slopes 0 and 2 are lower than as-is and differ from it by the M4 test. Reproduced under
#   either reading; both are reported.
# - O2 "increases (decreases) with slope". Read as the across-session mean at slope 2 above (below)
#   the mean at slope 1, which is above (below) the mean at slope 0, with slopes 0 and 2 both
#   differing from as-is by the M4 test. "Monotonically" (Figure 2B) is read strictly, a change
#   in the stated direction at every 0.1 step.
# - O3 Illusion units. The paper states no unit filter for dandiset 000248. Readings, (a) all
#   units located in VISp (not VISpm), as the code, (b) the same units restricted by the Allen
#   quality criteria the Methods give for the main dataset. The code's post-processed input may
#   already have been filtered; that cannot be checked. Both readings are run.
# - O4 Illusion example session. The text says "one example session"; the code uses sub_630506.
#   That session is the main reading; the other sessions with an ICwcfg1 block are a variant.
