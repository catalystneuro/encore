- id: illusion-fig1c-isomap-geometry
  statement: In an example session of the Illusion data, three stimulus manifolds of V1 activity
    appear continuous with little overlap in the as-is data, discontinuous at slope 0 and heavily
    overlapping at slope 2.
  source: Figure 1C bottom; Results, Neural variability structure is highly consistent across
    visual stimuli and mice, paragraph 6
  quote: As the slope increases from 0 to 2, the stimulus manifolds become increasingly
    overlapping. At slope 0, the stimulus manifolds appear discontinuous with one another,
    hindering smooth transitions between stimuli. At slope 2, the stimulus manifolds are hard to
    discriminate due to the large overlap.
  depends_on:
  - illusion-data-link
  criterion: Session sub_630506 (O4), V1 units (O3), spike counts in the 400 ms from onset, the 12
    stimuli with 400 repeats. Slope manipulation M2 at target slopes 0, 1 and 2 with M1 fits on
    these stimuli (fit_slope_openscope.ipynb). The Isomap pictures (n_neighbors 5, 2 components,
    fitted on all trials of the 12 stimuli, visualize_manifold.ipynb cell 8) are drawn for Ic1,
    Lc1 and Tre1 and shown, but the claim is judged on the measures the paper uses to formalize
    this picture (Results, Neural variability structure enables maximal discriminability,
    paragraph 1), computed in the full N-neuron space. Among Ic1, Lc1 and Tre1, with the M3
    overlap percentages and a directed edge wherever one is above zero, (i) at slope 0 the three
    do not form one strongly connected component, (ii) in the as-is data they do, (iii) the mean
    of the six directed overlap percentages is larger at slope 2 than as-is and larger as-is than
    at slope 0. Reproduced when all three hold, partially when two hold. The same measures over
    all 12 stimuli (the size of the largest strongly connected component, the mean overlap) and
    the other sessions are shown as variants.
- id: illusion-fig3a-orthogonal-variance-example
  statement: In the example session of the Illusion data, the Lc1 manifold has larger orthogonal
    variance toward the faraway Ic1 manifold than toward the nearby Tre2 manifold.
  source: Figure 3A (legend; the labels "Faraway stimulus, larger variance" on Ic1 and "Nearby
    stimulus, smaller variance" on Tre2 are from ortho_variance.ipynb cell 9 at commit ac3300b)
  quote: Purple and green arrows indicate the orthogonal variances of the orange manifold
    relative to the purple and green manifolds, respectively.
  depends_on:
  - illusion-data-link
  criterion: The arrows of Figure 3A are drawn in the 2D Isomap with lengths set by hand in the
    code (60 toward Ic1, 22 toward Tre2), so the claim is tested with the paper's measures in the
    N-neuron space. As-is data of sub_630506 (O4), V1 units (O3), the 12 stimuli with 400
    repeats. Geodesic distance between centroids by M5. Orthogonal variance as the Methods define
    it, the variance (ddof 1, code) across Lc1 trials of the norm of the component of each
    trial's deviation from the Lc1 centroid along the line joining the two centroids, divided by
    the summed per-neuron variance of Lc1. Reproduced when Ic1 is geodesically farther from Lc1
    than Tre2 is and Lc1's orthogonal variance toward Ic1 is larger than toward Tre2; partially
    reproduced when only the variance order holds. The Spearman correlation between geodesic
    distance and orthogonal variance over all 132 ordered pairs of the 12 stimuli is shown as a
