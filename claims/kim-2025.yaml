- id: illusion-geometry-similar-across-datasets
  statement: The changes in manifold geometry that come with changing the slope are qualitatively
    the same in the Illusion data as in the natural scenes data.
  source: Methods, Visualization of stimulus manifold geometry, paragraph 3
  quote: The geometric changes accompanying log-mean vs. log-variance slope changes are
    qualitatively similar across datasets, as well as across Isomap and UMAP.
  depends_on:
