# Claims for Fujisawa, Amarasingham, Harrison & Buzsaki (2008), Nature Neuroscience 11:823-833,
# doi:10.1038/nn.2134, tested on DANDI:000067 and CRCNS pfc-2 (doi:10.6080/K01V5BWK).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-15,
# protocol as stated in docs/protocol.md (version pilot-15, Reader). It replaces the two files
# read per dataset, claims/fujisawa-2008/000067.yaml and claims/fujisawa-2008/crcns-pfc-2.yaml;
# their ids are kept where the finding is the same (map below).
#
# Text read. The version of record (PDF supplied by a person; text by PyMuPDF in
# paper/10.1038-nn.2134.txt): main text, figure legends, Methods, and the supplement (Supplementary
# Note; legends of Supplementary Figures 1 to 16; references). PDF pages were opened only for
# figures the text garbles: Figure 2 (the counts and t-test marks of panels d and e), Figure 3
# (legend of 3b, the matrix size printed as 117 squared), Supplementary Figures 1 to 3, and the
# legend of Supplementary Figure 11 (142 squared). Where the extracted text prints "1172" and
# "1422" the PDF has 117^2 and 142^2 (a lost superscript); quotes keep the extracted text. The
# paper links no analysis code; its only link is to the KlustaKwik spike sorter, which was not
# read, as it is not analysis code of the paper.
#
# The datasets. DANDI:000067 is titled with the paper's title and carries its abstract as
# description. The CRCNS pfc-2 description says it holds simultaneous PFC (64 channels) and CA1
# (32 channels) recordings in three rats (EE, FF, GG) during the working memory task of this
# paper, with sleep and a spontaneous alternation task on some days, and names session EE.188 as
# the session of Figures 2A and 3D. Both are read here as holding the same recordings, so every
# claim on the recordings rests on both. The channel map link rests on 000067 alone.
#
# Data the paper used, as it reports them. Four adult male rats (3 to 5 months) trained on an
# odor-based delayed matching-to-sample task on a figure-eight T-maze: after a nose poke in the
# start box an odor (cheese or chocolate) signals the reward in the right or left goal arm (the
# pairing varied across rats). Mean correct performance in the recording sessions 91.9%. One
# 8-shank, 64-site silicon probe per rat (200 um shank separation, 8 staggered sites per shank,
# 20 um vertical separation) in anterior cingulate (area 24) and dorsal prelimbic (area 32)
# cortex; three rats in layer 2/3 and one in layer 5. Supplementary Figure 1 names the rats E, F,
# G and H: F in layer 5, E, G and H in layer 2/3. Wideband signals at 20 kHz, high-pass 0.8 to
# 5 kHz for sorting, KlustaKwik with manual adjustment; two head LEDs (5 cm apart) tracked at 40
# Hz. 633 well-isolated units, 411 in layer 2/3 and 222 in layer 5 (counts printed in Figure 2d);
# of these, putative pyramidal cells 133 (layer 2/3) and 85 (layer 5), putative interneurons 37
# and 47. Each trial's path is linearised to a normalised position from 0 (odor sampling, the
# end of nose poking; Supplementary Figure 6 legend) to 1 (reward area), total length 230 cm, and
# labelled LEFT or RIGHT by the goal arm. Figure 2a and Figures 3b to 3d, 4, 5, 6b and 7a use one
# layer 2/3 session of 117 neurons; Figure 2a and Supplementary Figure 11 use one layer 5 session
# of 142 neurons (Figure 2a legend, "in two rats").
#
# Rats and layers (open). The datasets name three rats EE, FF and GG; the paper names four, E to
# H, and never links its names to the files. Readings: R-a, the datasets' EE, FF and GG are the
# paper's rats E, F and G, so FF is the layer 5 rat and layer 2/3 rat H is not in the data; R-b,
# the names are not linked, each dataset rat may be either layer, with at most one in layer 5.
# Every claim with values by layer is run under both.
#
# Shared method, from the Methods unless stated.
# - Trials and positions. A trial runs from the end of nose poking (position 0; Supplementary
#   Figure 6 legend, "The onset of the maze trial is defined as the end of nose-poking") to the
#   reward area (position 1; Results, Figure 1b). Where in the reward area position 1 is set is
#   not said (open; readings E-a the arrival at the end of the goal arm, E-b the start of reward
#   consumption), nor which poke ends nose poking when a rat pokes more than once (open; readings
#   N-a the last poke before leaving the start box, N-b the first). Whether error trials enter
#   any analysis is not said (open; readings T-a correct trials only, T-b all trials).
# - Firing-rate differences (LEFT against RIGHT, or any two trial labels). Spikes are placed at
#   the normalised position where they occur; the PSTH per condition is the sum of Gaussian
#   kernels (bandwidth 0.05 normalised length) over the condition's spikes divided by its number
#   of trials. Statistic D0(x) = left PSTH minus right PSTH. Labels are permuted M times;
#   pointwise two-sided bands, and global bands by the stepping procedure (the smallest pointwise
#   band whose global acceptance level is alpha). A segment is significant when the global band is
#   broken; its extent is where the pointwise band is broken (Figure 1c legend, Supplementary
#   Figure 4E). Alpha = 0.05 (Figure 1c legend). M is not given (Methods M, Supplementary
#   Figure 4 R): 1,000 is a standard choice, as for the jitter; it should not change the outcome.
#   The positions at which D0 is evaluated are not given; 101 points from 0 to 1 is a standard
#   choice.
# - Rates for display and widths. Figure 1c legend says rates are normalised by the time spent at
#   each position (Hz); the Methods' PSTH is spikes per unit length per trial (Supplementary
#   Figure 4A says one converts to the other by dividing by occupancy). Where a rate's shape
#   matters (widths, peaks), readings P-a occupancy-normalised, P-b the Methods' PSTH.
# - Units. All well-isolated PFC units of a session; the paper sets no rate threshold. The 1 Hz
#   "Cells" list of the CRCNS description is not the paper's and is only a variant.
# - Monosynaptic connections. Every spike of each neuron is jittered uniformly on [-5, +5] ms,
#   1,000 surrogates. Cross-correlogram over latencies [-5, +5] ms; pointwise and global bands at
#   the 99% level, the global band from the maximum and minimum of each surrogate. A connection is
#   excitatory (peak) or inhibitory (trough) when the counts break the global band anywhere in
#   [1, 4] ms. Pairs are counted in both directions. The Results add onset below 5 ms and a peak
#   of 2 ms or less. Supplementary Figure 9A jitters the spikes of one neuron only, a variant.
#   The CCG bin width is not given (open; readings B-a 1 ms, B-b 0.5 ms). How the 2 ms width is
#   measured is not given (open; readings W-a the [1, 4] ms global band test alone, as the
#   Methods state it; W-b also requiring the run of bins above the pointwise 99% band to span 2 ms
#   or less). A pair's CCG uses the whole task session, intertrial intervals included (Results,
#   on Figure 3b).
# - Cell types. A reference cell with a significant short-latency peak is a putative pyramidal
#   cell, one with a significant trough a putative interneuron (Figure 3a legend). A unit with
#   both is not covered (open; readings C-a unclassified, C-b excluded from the denominators).
# - Position of excess coincidences. Coincident events are spike pairs with 1 <= tdiff <= 4 ms
#   (presynaptic first), placed at the position where they occur, smoothed with the 0.05 kernel
#   and divided by the number of trials; surrogates by jittering the spikes on [-5, +5] ms (both
#   cells, Methods; the presynaptic cell only, Supplementary Figure 12B, as a variant; 1,000, a
#   standard choice, as this section gives no number); one-sided pointwise and global bands for
#   excess at P < 0.01 (Figures 4 and 5). Whether the event is placed at the presynaptic or the
#   postsynaptic spike is not said; the two are at most 4 ms apart, so the presynaptic spike is a
#   standard choice.
#
# Id map. From 000067.yaml: rats-and-units (crcns unit-count), fig2c-active-fraction (crcns
# fig2c-synchrony-by-layer), fig2-field-size (crcns lifetime-width), traj-diverge (crcns
# trajectory-divergence), odor-nosepoke (crcns odor-selective-fraction), fig3-connection-rates
# (crcns connection-counts), fig3-cell-classes (crcns cell-type-fractions), fig4-position-dependence
# (crcns position-dependent-transmission), fig6-facilitation-depression (crcns
# fig6-depression-facilitation), fig7-supralinear (crcns fig7-supralinear-coincidence),
# fig3-trajectory-by-class (crcns connected-cells-trajectory-specific). The 000067 claim
# fig2b-trajectory-selective is split into side-arm-selectivity-by-layer and
# central-arm-selectivity; its ee188-example-session is split into fig3b-session-connections,
# fig3d-hub, fig5a-session-selective-connections, fig4-pair-156-136, fig5b-example-pairs and
# fig6b-convergent-examples. New: fig2d-layer-rates and fig2e-layer-discrimination.
schema_version: 2
paper: doi:10.1038/nn.2134
claims:
- id: channel-region-link
  kind: link
  statement: The recording channels of DANDI:000067 can be assigned to the prefrontal probe, the
    CA1 probe and the nose-poke sensors by the channel map of the CRCNS pfc-2 description of the
    same recordings (channels 1 to 64 prefrontal, 65 to 96 CA1, 97 right and 98 left nose-poke
    sensors), and the data agree with that map.
  source: Methods, Surgery and recording (8-shank, 64-site probe in mPFC); CRCNS pfc-2 data
    description, version 0.7
  data: with_labels
  datasets:
  - "000067"
  criterion: Two checks in each working memory session. (i) The median theta ratio (6 to 10 Hz
    over 1 to 40 Hz power, during trials) of the CA1 channels is above that of channels 1 to 64.
    (ii) In at least 90% of trials the sensor channel with more activity during the nose poke is
    the one of the trial's side. Reproduced when both hold in every session with the CRCNS channel
    numbers; partially reproduced when both hold only with a per-rat correction of the channel
    numbers found in the data; not reproduced otherwise.
- id: rats-and-units
  statement: A total of 633 well-isolated units were recorded from anterior cingulate and dorsal
    prelimbic cortex in four rats, 411 in layer 2/3 (three rats) and 222 in layer 5 (one rat).
  source: Results, paragraph 1; Methods, Surgery and recording; Figure 2d (unit counts in the bars)
  quote: We recorded a total of 633 well-isolated units from the anterior cingulate area (area 24)
    and dorsal prelimbic area (area 32) of the medial prefrontal cortex (mPFC)22 in four rats.
  datasets:
  - "000067"
  - crcns-pfc-2
  expected:
  - quantity: well-isolated mPFC units, layer 5 rat
    value: 222
    tolerance: 22.2
    unit: units
  - quantity: well-isolated mPFC units, all four rats
    value: 633
    tolerance: 63.3
    unit: units
  criterion: Units are the sorted PFC units of all working memory sessions, each session's units
    counted as distinct (the paper does not say whether a unit recorded on several days counts
    once; sorting is per session). The datasets hold three of the four rats, so their total is
    expected below 633. Layer 5 is one rat, so its 222 units can be checked whole. Reproduced when
    one rat's units are within 222 +/- 22.2 (FF under reading R-a; any rat under R-b) and the
    other two rats together hold no more than 411 + 41.1; partially reproduced when the total
    over the three rats is within 633 +/- 63.3 but no rat matches 222; not reproduced otherwise.
    The total is reported against 633.
- id: task-performance
  statement: Rats performed the odor-place matching task at 92% correct, 91.9% in the recording
    sessions.
  source: Results, Medial prefrontal cortical units predict behavioral choice, paragraph 1;
    Methods, Behavioral task
  quote: All rats performed the task at high proficiency (mean performance, 92% correct) at the
    time of neurophysiological data collection ... In the recording sessions, the mean correct
    performance was 91.9%.
  datasets:
  - "000067"
  - crcns-pfc-2
  expected:
    quantity: mean percentage of correct trials over recording sessions
    value: 91.9
    tolerance: 9.19
    unit: percent
  criterion: Correct trials over all trials, per session, averaged over the working memory
    sessions; the pooled percentage over sessions is shown as a variant (the paper does not say
    which). Blocked (data_missing) if the datasets list correct trials only.
- id: fig2-population-uniform
  statement: Individual neurons fire transiently at specific locations, but the population as a
    whole fires relatively uniformly over the whole maze.
  source: Results, Medial prefrontal cortical units predict behavioral choice, paragraph 3; Figure
    2a and 2b
  quote: viewed as a population, the firing properties of mPFC neurons were quite homogeneous
    ... individual neurons fired transiently, but, as a whole, the population of neurons fired
    relatively uniformly over the entire apparatus
  datasets:
  - "000067"
  - crcns-pfc-2
  criterion: The paper gives no measure or test. Per neuron, the left and right PSTHs (shared
    method); the position of each neuron's peak rate on its side of higher peak, as Figure 2a
    orders them. Reproduced when, in each Figure 2a session, no tenth of the maze holds more than
    twice or less than half its expected share of peaks, and the population mean rate per tenth
    stays within 50% of its overall mean (Figure 2b). These thresholds are standard choices, not
    the paper's; a chi-square test of the peak positions against uniform at p < 0.05 is reported
    as a variant, and all sessions as a second variant.
- id: fig2c-active-fraction
  statement: About 10% of layer 2/3 neurons and 20% of layer 5 neurons fire at least one spike in
    a given 100 ms window, a fraction relatively constant over the maze.
  source: Results, Medial prefrontal cortical units predict behavioral choice, paragraph 3; Figure
    2c; Discussion, Behavior-dependence of short-term plasticity in mPFC, paragraph 1
  quote: the population firing rates (Fig. 2b) and the fraction of simultaneously active neurons
    (10% and 20% in 100-ms windows, layers 2/3 and 5, respectively; Fig. 2c) were relatively
    constant in all segments of the maze
  datasets:
  - "000067"
  - crcns-pfc-2
  expected:
  - quantity: mean percentage of layer 2/3 neurons active in a 100 ms window
    value: 10
    tolerance: 1
    unit: percent
  - quantity: mean percentage of layer 5 neurons active in a 100 ms window
    value: 20
    tolerance: 2
    unit: percent
  criterion: Per Figure 2c legend, the percentage of the session's neurons firing at least one
    spike in consecutive 100 ms windows, averaged over the windows within trials (Figure 2c is
    plotted against normalised position, left and right trials apart). Which sessions is open;
    readings (a) the two Figure 2a sessions (117 and 142 neurons; Figure 2c sits under them and,
    unlike 2b, is not labelled "group"); (b) all sessions of each layer, under rat readings R-a
    and R-b. Reproduced when both values are within tolerance under one reading, and the mean
    over the windows in each tenth of the maze stays within 50% of the overall mean (a standard
    choice for "relatively constant"; the paper gives no test).
- id: fig2-field-size
  statement: Most neurons are active over a similar stretch of the maze, 0.27 (62 cm) +/- 0.17 (39
    cm) of normalised length (mean +/- s.d.), measured between the 50% boundaries of the peak
    rate.
  source: Results, Medial prefrontal cortical units predict behavioral choice, paragraph 3;
    Supplementary Figure 2B
  quote: most neurons were generically active for similar standardized distances of 0.27 (62 cm)
    ± 0.17 (39 cm) (mean ± s.d.) in the maze (as determined by the 50% firing boundaries of the
    peak firing rate
  datasets:
  - "000067"
  - crcns-pfc-2
  expected:
  - quantity: mean width of firing at 50% of peak
    value: 0.27
    tolerance: 0.17
    unit: normalised length
  - quantity: s.d. of width across neurons
    value: 0.17
    tolerance: 0.017
    unit: normalised length
  criterion: Width of the PSTH between the 50% boundaries of its peak height (Supplementary
    Figure 2B), with rate readings P-a and P-b. The tolerance of the mean is the stated s.d.; the
    s.d. takes 10%. Open details and readings. Which PSTH; (a) each neuron's PSTH over all
    trials; (b) its left and right PSTHs as two entries; (c) the PSTH of the side with the higher
    peak. The width; (i) the contiguous run around the peak at or above 50%; (ii) the total length
    at or above 50%. Which neurons; (x) the two Figure 2a sessions, (y) all units of the task
    sessions (Supplementary Figure 2B shows "All" with a count axis to 150, larger than one
    session). Reproduced when both values are within tolerance under one combination.
- id: population-vector-width
  statement: Population vector correlations fall off over similar distances throughout the maze,
    0.18 +/- 0.087 of normalised length in layer 2/3 and 0.27 +/- 0.13 in layer 5.
  source: Supplementary Figure 2A
  quote: Neuronal populations were relatively evenly correlated throughout the maze segments with
    0.18(41cm) ± 0.087(29cm) (L2/3) and 0.27(62cm) ± 0.13(30cm) (L5) in normalized length
  datasets:
  - "000067"
  - crcns-pfc-2
  expected:
  - quantity: layer 2/3 correlation width
    value: 0.18
    tolerance: 0.087
    unit: normalised length
  - quantity: layer 5 correlation width
    value: 0.27
    tolerance: 0.13
    unit: normalised length
  criterion: Population vectors of PSTHs (shared method) at each position, and the correlation
    matrix between positions, as Supplementary Figure 2A. The width is not defined in the paper;
    reading, for each position, the length around the diagonal over which the correlation stays
    above half its diagonal value, mean +/- s.d. over positions. Which trials is open; readings
    (a) left and right PSTHs concatenated in each vector, (b) all trials. The panel does not name
    its sessions; the Figure 2a sessions, with all sessions of each layer as a variant. The
    tolerances are the stated s.d. The legend's lengths in cm do not all agree with its
    normalised values over 230 cm (0.18 is 41 cm, 0.27 is 62 cm and 0.13 is 30 cm, but 0.087 is
    20 cm, not the printed 29 cm, which is 0.126); the normalised 0.087 is kept, and the layer
    2/3 s.d. is also reported against 0.126. Reproduced when both values are within tolerance under one
    reading.
- id: fig2d-layer-rates
  statement: Layer 5 neurons fire at higher mean rates than layer 2/3 neurons, over all neurons
    (222 against 411) and over putative pyramidal cells (85 against 133), both at P < 0.01 by
    t-test; putative interneurons (47 against 37) carry no significance mark.
  source: Figure 2d
  quote: Mean firing rates of the neuronal populations (± s.d.)
  statistics:
  - about: all neurons, layer 5 against layer 2/3
    test: t-test
    p: 0.01
    p_relation: "<"
    n: 411 layer 2/3 and 222 layer 5 neurons
  - about: putative pyramidal cells, layer 5 against layer 2/3
    test: t-test
    p: 0.01
    p_relation: "<"
    n: 133 layer 2/3 and 85 layer 5 cells
  datasets:
  - "000067"
  - crcns-pfc-2
  depends_on:
  - fig3-cell-classes
  criterion: Per neuron, its mean rate over the task session (the paper does not say over which
    period; readings (a) trials only, (b) the whole task session). Layers by rat readings R-a and
    R-b; cell types from fig3-cell-classes. The t-test form is not given; readings Student's and
    Welch's two-sample tests. Reproduced when, under one combination, layer 5 is higher for all
    neurons and for pyramidal cells, each at p < 0.01; partially reproduced when one of the two
    holds. The interneuron comparison is reported, not judged. Figure 2d bars read near 2.0 and
    3.6 Hz (all), 1.6 and 2.9 Hz (pyramidal), 8.3 and 7.8 Hz (interneurons); these are read from
    the figure, so they are reported for comparison and not judged.
- id: fig2e-layer-discrimination
  statement: Single layer 5 neurons discriminate left from right trials over a larger fraction of
    the maze than layer 2/3 neurons, for all neurons (P < 0.05), putative pyramidal cells (P <
    0.01) and putative interneurons (P < 0.01), by t-test.
  source: Figure 2e
  quote: Mean fraction of maze lengths discriminated by firing rates of single neurons (± s.d.)
  statistics:
  - about: all neurons, layer 5 against layer 2/3
    test: t-test
    p: 0.05
    p_relation: "<"
  - about: putative pyramidal cells, layer 5 against layer 2/3
    test: t-test
    p: 0.01
    p_relation: "<"
  - about: putative interneurons, layer 5 against layer 2/3
    test: t-test
    p: 0.01
    p_relation: "<"
  datasets:
  - "000067"
  - crcns-pfc-2
  depends_on:
  - fig3-cell-classes
  - side-arm-selectivity-by-layer
  criterion: Per neuron, the total length of its significant segments (global band broken,
    extent by the pointwise band, shared method) as a fraction of the maze. Which neurons enter
    the mean is open; readings (a) all neurons, a non-selective neuron counting 0, (b) selective
