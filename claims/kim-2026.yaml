# Claims for Kim, Lycke, Zolotavin, Montes, Xie & Luan (2026), Science Advances 12, eaef0343,
# "Learning induces activation-mechanism-dependent neural plasticity in an intracortical
# microstimulation task", on DANDI 001868 (version 0.260715.2016).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-11-03, protocol pilot-13 as stated in docs/protocol.md.
#
# Text read: the version of record, full text from Europe PMC (PMC13544205): main text, figure
# legends of Figures 1 to 7, Materials and Methods, and the supplement (sciadv.aef0343_sm.pdf,
# legends of figs. S1 to S9, extracted with PyMuPDF). The bioRxiv preprint
# (10.64898/2026.06.05.730421 v1), which the dandiset names, was not used for claims. The
# supplement holds figure legends only; it has no tables.
#
# Code read: https://github.com/XieLuanLab/icms-activation-plasticity at commit d1922d1
# (2026-07-15). python/ holds the figure scripts for Figs. 4 to 6 and figs. S1, S3 to S9, and
# utils/ (filters, early and late weeks, currents, effect size); matlab/ holds the imaging and
# threshold figure scripts for Figs. 2 and 3 and fig. S2 and the statistics helper report_stat.m;
# processing/ holds the upstream pipeline (artifact suppression and sorting, response metrics,
# pulse-locking, population coupling, UnitMatch, the volumetric and planar imaging pipelines).
# The figure scripts read processed tables from the paper's Zenodo figure source data
# (doi:10.5281/zenodo.21382755), not the NWB files. None of the scripts computes the counts of
# Fig. 3B, the exponential fit of Fig. 2A, or the delta-spikes values and hit and miss PSTHs of
# Fig. 6 (all read precomputed).
#
# Data the paper used: 12 Thy1-GCaMP6s (GP4.3) mice, all implanted with a 32-channel
# ultraflexible NET in S1 with a cranial window. Six behavioural mice (four male, two female;
# named Mouse 1 to 6 in the paper, ICMS92, ICMS93, ICMS98, ICMS100, ICMS101 and ICMS83 in the code)
# did an ICMS detection task (wheel turn, go/no-go) over weeks 0 to 4, 46 sessions. Six control
# mice (from an earlier study, ref. 22) received similar stimulation without behaviour (imaging
# 18 sessions; ephys from 4 control animals, 15 sessions). Each behavioural mouse had 3 fixed
# stimulation contacts at 200 to 400 um depth. Each session had four blocks of 100 trials (10 catch
# trials at 0 uA and 90 stimulation trials, 3 channels x 3 currents x 10), with currents
# re-centred on the threshold between blocks, plus a fifth block for planar imaging. A trial is
# a prestimulus period of 1 to 1.5 s, a 700 ms train of 100 Hz biphasic cathode-leading pulses
# (70 pulses, 167 us phases, 67 us interphase), a 2.5 s poststimulus period and a 1 to 1.5 s
# intertrial interval; outcomes hit, miss, false alarm (catch). Measured variables: wheel
# position (rotary encoder, reliable in 5 mice; Mouse 6 excluded), response times, spike-sorted
# units from 30 kHz recordings on the NET (973 units, 484 modulated), volumetric 2P imaging
# (512 x 512 pixels, 1 x 1 mm, 30 fps, 25 um steps over 300 um) and planar 2P imaging at 100 um
# depth (30 fps; cells tracked across weeks in three mice, Mouse 1 to 3 in the code). Only the
# 4, 5 and 6 uA currents were analysed. The paper says the dandiset holds the processed
# electrophysiology, behavioural and 2P imaging data; whether it holds the control animals and
# the imaging ROIs and activation calls is for the author to find. Raw recordings are not public.
#
# Method fixed here for every criterion, from the paper and its code (referred to as "the common
# method"):
# - Week of a session is ceil(days since the animal's first session / 7), day 0 being week 0;
#   weeks above 4 are dropped. Early is weeks 0 and 1, late weeks 2 to 4 (Results, Behavioral
#   learning enhances, paragraph 1; code matlab/fig2/fig2a_thresholds.m, python/utils/config.py,
#   processing/batch_process/postprocessing/longitudinal_data_utils.py).
# - Currents 4, 5 and 6 uA (Methods, Analysis of behavioral data).
# - Tests are two-sided Mann-Whitney U at P < 0.05 unless a claim says otherwise (Methods,
#   Statistics; figure legends). Effect size r is |Z|/sqrt(n1 + n2) for imaging and thresholds
#   (matlab/report_stat.m) and the rank-biserial 1 - 2U/(n1 n2) for ephys
#   (python/utils/plotting.py); it is reported, not judged.
# - Ephys response: one unit at one stimulation channel and current in one session (Methods,
#   Quantifying neuromodulation metrics). Modulated when the paired t test of per-trial spike
#   counts, stimulation train against the 700 ms before it, gives P < 0.05 with the z-score above
#   zero, the response has more than 50 spikes and a baseline rate of at least 0.5 Hz (Methods;
#   code processing/.../stim_response_util.py and python/utils/filters.py). The code also drops
#   stimulation channels recorded on fewer than 5 days, responses with 5 trials or fewer, and
#   z-scores of 50 or more (100 for Fig. 4 and fig. S5); these are followed, and the Methods
#   filters alone are a variant. Modulation score is (mean stimulation rate minus mean
#   prestimulus rate) / STD of the per-trial prestimulus rates (Methods). Time to maximum firing
#   rate is the argmax over the train of the rate in 10 ms bins smoothed by a Gaussian of
#   sigma 20 ms (code responses_v3/stim_condition_response.py; 2 ms bins, sigma 5 ms, for the
#   120 ms window); the Methods do not give it.
# - Pulse-locking: spikes in each 10 ms interpulse interval in 0.5 ms bins, the first 1.5 ms and
#   last 0.5 ms blanked; spike probability is spikes per bin over trials (Methods). PLI is the mean
#   of the 3 bins around the peak minus the median of the unblanked bins, on the mean curve of 500
#   bootstrap draws of 20% of pulses; PL when PLI exceeds the 99th percentile of 100 surrogates
#   with the same spike count placed uniformly at random in the unblanked window (code
#   responses_v2/pulse_locked_response_metrics.py). The Methods call the null "shuffled data"
#   and give 5000 bootstrap resamples for Fig. 5C; the code's choices are followed and 5000
#   resamples is a variant.
# - Cell type: trough-to-peak of the unit's template on its main channel; below 0.45 ms is a
#   narrow-waveform interneuron, otherwise pyramidal (Fig. 4H legend; code
#   longitudinal_data_utils.py).
# - Imaging activation (volumetric): per channel and current, the stimulation-window volume minus
#   the prestimulus volume, a voxel responsive above 2 x its baseline STD, an ROI activated when
#   at least 50% of its voxels are responsive, ROIs under 5 um radius dropped; distance is the 3D
#   distance of the ROI centroid from the stimulation site, counts limited to 800 um (Methods,
#   Detection and quantification; code matlab/fig2/*.m). The code applies this to the
#   trial-averaged difference with a channel-specific multiplier (stdMod in
#   NeuroAnalysis_BehavioralParametricSweepBlockExtractTest.m); the Methods' fixed 2 x STD is
#   followed and the code's multiplier is a variant. Where the dataset holds the paper's ROIs or
#   activation calls, they are used.
# - Imaging activation (planar): EXTRACT ROIs; an ROI's response is activated when its
#   trial-averaged dF/F exceeds threshold for a run of more than 5 frames with onset before
#   700 ms (Methods). The Methods give the threshold as mean + 2 STD of the ROI's full trace; the
#   code uses 2 x CV of the trace; both are readings.
#
# Data from outside the paper's recordings: none for the tests. The paper's Zenodo figure source
# data (doi:10.5281/zenodo.21382755) hold the processed tables the figure code reads; they are
# not used for any claim here.
