- id: fig2a-threshold-decrease
  statement: Behavioural detection thresholds fall with learning; thresholds in the late phase
    (weeks 2 to 4) are lower than in the early phase (weeks 0 to 1), median 5.5 against 4.2 uA.
  source: Results, Behavioral learning enhances ICMS-evoked population activation over time,
    paragraph 1; Figure 2A
  quote: The detection thresholds in the late phase were significantly lower than those in the
    early phase ( Fig. 2A ), decreasing from a median of 5.5 to 4.2 μA
  statistics:
  - test: two-sided Mann-Whitney U test
    statistic: r = 0.40
    p: 7.68e-6
    n: 43 early and 80 late channel-session thresholds
  expected:
  - quantity: median early-phase threshold
    value: 5.5
    tolerance: 0.55
    unit: uA
  - quantity: median late-phase threshold
    value: 4.2
    tolerance: 0.42
    unit: uA
  - quantity: number of early thresholds
    value: 43
    tolerance: 4
  - quantity: number of late thresholds
    value: 80
    tolerance: 8
  criterion: A threshold per channel and block from a cumulative Gaussian fitted to the hit
    proportions at each current, with the block's catch-trial false-alarm rate as a 0 uA point
    (Methods, Analysis of behavioral data; code processing/dataloader.py, psignifit sigmoid norm,
    experiment type YesNo, free guess and lapse), the threshold being the current at 50%
    detection of the fitted function; the session threshold of a channel is the mean of its four
    block thresholds (Methods). One value per channel and session, all six mice, weeks by the
    common method (code fig2a_thresholds.m). Reproduced when both medians are within tolerance
    and the two-sided Mann-Whitney test gives P < 0.05 with late lower. Session thresholds the
    dataset stores are used when present, and the refitted ones are shown with them. The
    exponential fit drawn in Fig. 2A is not in the code and is not tested.
