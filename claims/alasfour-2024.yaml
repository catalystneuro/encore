# Claims for Alasfour & Gilja (2024), Front. Hum. Neurosci. 18:1388267, "Consistent
# spectro-spatial features of human ECoG successfully decode naturalistic behavioral states",
# on dandiset 000055 (AJILE12).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-11-10, protocol pilot-14 as stated in docs/protocol.md.
#
# Text read. The version of record from PubMed Central (PMC11169785), in
# paper/10.3389-fnhum.2024.1388267.txt: abstract, Introduction, Methods, Results, figure legends
# (Figures 1 to 7), Table 1, Discussion and Data availability statement. The paper has no
# supplement (PMC lists none, and the text cites none). No PDF was supplied, so the figures
# could not be read; every claim rests on the text and the legends. Values shown only in the
# figures (per-feature accuracies, confidence intervals, the finite chance level, the
# per-participant matrices and curves) are not known here.
#
# Code read. None. The paper links no analysis code and names no software or toolbox.
#
# Data the paper used. Five of the twelve AJILE12 participants (Peterson et al., 2022), 2 male
# and 3 female, numbered 1, 2, 4, 5 and 8 in Table 1, chosen as those with at least 1 h of the
# behaviours of interest, in epilepsy monitoring with ECoG placed for clinical needs.
# Post-surgical days 3 to 7 only. ECoG at 1 kHz, preprocessed as in AJILE12 (median removed,
# discontinuities handled, 1-200 Hz bandpass, 60 Hz and harmonic notches, downsampled to 500
# Hz, common median reference); the dandiset's 500 Hz recordings are these. Video at 30 fps,
# cut into 2-min blocks, each block given one coarse behaviour label by hand; active labels are
# talking, watching TV and using a computer or phone (using electronics), inactive labels are
# sleeping and awake rest. Measured variables: the ECoG of the good electrodes (85, 80, 67, 104
# and 82 per participant), electrode positions, and the block labels. Table 1 gives sex, age,
# good electrodes and minutes of each active label per participant. The dandiset's description
# names annotated behavioural states, electrode recordings and pose; it is meant to hold these
# data.
#
# Outside data. Electrodes are assigned to eight AAL regions with "the electrode-to-region of
# interest (ROI) projection matrices used in a previous study" (Methods 2.1), those of Peterson
# et al. (2021a, eNeuro 8, ENEURO.0007-21.2021, claims/peterson-2021.yaml). The paper gives no
# location for them. That paper deposited its projection matrices on Figshare
# (figshare.com/projects/Behavioral_and_neural_variability_of_naturalistic_arm_movements/78666)
# and its code at github.com/BruntonUWBio/naturalistic_arm_movements_ecog. Every claim on
# regions uses them (data with_inputs). The eight regions, as Results 3.1 names them, are taken
# to be middle frontal (the paper's "frontal middle"), precentral,
# postcentral, inferior parietal, supramarginal, superior temporal, middle temporal and
# inferior temporal.
#
# Method fixed by the paper (Methods 2.1 and 2.2, figure legends).
# M1 Labels. Talking and Watching TV for the two-class analyses; Using Electronics added as a
#    third class for four of the five participants (Methods 2.2).
# M2 Bands. Five IIR Butterworth bandpass filters, theta 4-8, alpha 8-12, beta 8-32, low gamma
#    32-55 and high gamma 70-110 Hz; amplitude envelope by the Hilbert transform; envelopes
#    averaged over 10-s bins (Methods 2.1). One 10-s bin is one sample.
# M3 Artifacts. A 2-min segment is dropped when 10% of channels exceed 3 SD of the channel for
#    more than 2 s (Methods 2.1).
# M4 Regions. Each electrode gets the ROI closest to it from the projection matrix, only
#    electrodes close to one of the eight ROIs are used, and an ROI is dropped for a
#    participant when its electrode density is below 3 (Methods 2.1).
# M5 Classifier. One LDA per participant, ROI and band (40 features per participant), with a
#    covariance shared by the classes. 7-fold cross-validation over the time-ordered data with
#    a one-fold buffer between training and test sets. Training and test sets each downsampled
#    to balance the classes, and each z-scored on its own (Methods 2.2).
# M6 Group accuracy. The 35 fold accuracies (7 folds by 5 participants) of each feature are
#    compared with the finite-data chance level of Combrisson and Jerbi (2015) by a two-sided
#    Student's t-test, with Benjamini-Hochberg FDR at alpha 0.01 (Methods 2.2; Figure 2 legend).
# M7 ANOVA. Two-way ANOVA on accuracy with ROI, band and their interaction (Methods 2.2;
#    Results 3.1).
# M8 Mean difference. For each fold model, the fitted class mean of Talking minus that of
#    Watching TV (positive means Talking higher, Results 3.1); 35 values per feature, a
#    two-sided Student's t-test against zero, BH FDR at alpha 0.01. A feature is consistent
#    when both this test and the accuracy test (M6) are significant (Methods 2.2; Figure 5
#    legend).
# M9 Participant matrices. Per participant, accuracy (Figure 4) and mean difference averaged
#    over the training folds (Figure 6, legend and Results 3.1) for each ROI and band.
# M10 Additivity. Per participant and band, ROIs ranked by performance on a validation set,
#    then the classifier refit starting from the top ROI and adding ROIs one at a time, in a
#    7-fold scheme with validation and test sets (Methods 2.2; Figure 7 legend).
#
# Details the paper leaves open, with the readings it allows. Criteria refer to these by
# number. An outcome that rests on one of them rests on an assumption.
# O1 Participant numbers. Table 1 numbers the five 1, 2, 4, 5 and 8 (AJILE12 numbers), but the
#    Results and legends name a Participant 3, who is not in Table 1. Readings: (a) the figures
#    number the five 1 to 5 in the order of Table 1 (figure 1, 2, 3, 4, 5 are Table 1's 1, 2, 4,
#    5, 8); (b) the figures use Table 1's numbers. Only (a) makes every sentence name an
#    analysed participant; (b) is run wherever it names one. Which dataset subject is which
#    AJILE12 participant is the author's to find.
# O2 Inclusion. "at least 1 h of recorded neural activity of the behaviors of interest" can be
#    (a) at least 1 h of each of talking and watching TV, or (b) at least 1 h of the two
#    together; both counted over days 3 to 7, before or after artifact rejection.
# O3 Filters. The Butterworth order and whether filtering is zero phase are not given. This is
#    a standard choice (4th order, zero phase) and is not expected to change an outcome.
# O4 Artifact rule. Readings: (a) at least 10% of channels each above 3 SD of that channel for
#    more than 2 s in total within the block; (b) the same with more than 2 s contiguous.
#    Applied to the preprocessed voltage (the text calls them high-amplitude bursts). The span
#    of "the standard deviation of the channel" is not given and can change which blocks are
#    dropped. Readings: (i) the SD over the channel's whole recording for the participant;
#    (ii) the SD over the channel's recording of that day.
# O5 ROI assignment. The distance threshold for "close to any of the eight defined ROIs" is not
#    given. Readings: (a) every good electrode with a nonzero projection weight to any of the
#    eight ROIs, assigned to its largest-weight ROI; (b) every good electrode assigned to the
#    ROI whose centroid is nearest. "Electrode density of less than 3" can be (i) fewer than 3
#    electrodes assigned, or (ii) a summed projection weight below 3.
# O6 Feature of an ROI. The three-class analysis uses "all available electrodes from the eight
#    8 ROIs as features" (Methods 2.2), so the electrodes of an ROI are read as its features,
#    reading (a); the scalar mean difference of an ROI in Figures 5 and 6 is then the mean over
#    its electrodes. Reading (b) is one feature per ROI, the mean of its electrodes' envelopes.
# O7 Folds and buffer. The data of the two classes are pooled in time order and cut into 7
#    contiguous folds of equal size (Methods "temporally sequenced"). The buffer can be (a) the
#    folds next to the test fold on both sides left out of training, or (b) only one
#    neighbouring fold left out (the following one; the preceding one for the last fold).
# O8 Balancing and LDA. Random downsampling of the larger class, seed a standard choice. LDA
#    solver and shrinkage are not given; the standard choice is an unregularised shared
#    covariance (scikit-learn LinearDiscriminantAnalysis defaults) with equal priors.
# O9 Finite chance level. Combrisson and Jerbi (2015) give the threshold as the binomial inverse
#    at 1 - alpha for n test samples and c classes. Neither alpha nor n is given. Readings:
#    alpha (a) 0.05 or (b) 0.01; n (i) the balanced test samples of each fold, a threshold per
#    fold, or (ii) all test samples of the participant. With a chance level per fold, the
#    t-test is on fold accuracy minus fold chance against zero. "Above chance" is a significant
#    two-sided test with the mean above chance.
# O10 ANOVA sums of squares. ROIs missing for some participants make the design unbalanced; the
#    type is not given. Standard choice type II; type I and III shown as variants. Participant
#    is not a factor (the paper names ROI, band and interaction only). The observations are not
#    named either. Readings: (a) the fold accuracies pooled for Figure 2 (35 per feature, M6);
#    (b) the participant mean accuracies (5 per feature).
# O11 Averages over ROIs or bands (Results 3.1, post-hoc). Readings: (a) mean of all fold
#    accuracies pooled; (b) mean of the per-feature means.
# O12 Post-hoc test on ROIs ("statistically higher than all the other ROIs"). Not named.
#    Readings: (a) Tukey HSD on the ROI factor at 0.05; (b) pairwise two-sample t-tests of the
#    pooled fold accuracies, BH FDR at 0.01.
# O13 Participant-level significance (Figure 4). Not stated. Readings: (a) per participant, a
#    one-sample t-test of the 7 fold accuracies against the finite chance level, BH FDR at 0.01
#    over the participant's features; (b) the mean fold accuracy above the participant's finite
#    chance threshold (O9).
# O14 Sign consistency (Figure 6). A participant without the ROI has no value. Readings: (a) the
#    combination counts when all participants that have the ROI share a sign; (b) only
#    combinations present in all five participants can count.
# O15 Additivity scheme (Figure 7). The validation set is not described. Readings: (a) within
#    each outer fold, one training fold (the one next to the buffer) held out as validation to
#    rank ROIs; (b) ROIs ranked by the participant's single-ROI cross-validated accuracies.
#    Features of the k top ROIs are concatenated, for k from 1 to the participant's number of
#    ROIs.
# O16 Three-class scheme. Not described apart from the features; read as the two-class scheme
#    (M5) with three balanced classes and chance for c = 3. Which participant lacked data is not
#    said; Table 1 suggests participant 8 (29 min of using electronics).
