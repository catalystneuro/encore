    the supramarginal gyrus, inferior parietal and superior temporal lobe.
  data: with_inputs
  criterion: As fig5-gamma-higher-talking (M8, O5 to O9). For the absence part, the paper's
    test is the consistency rule of M8. Reproduced when, under one reading, none of the six
    gamma features (low and high gamma in the three ROIs) is consistent with a positive
    difference, and in each of the three ROIs at least one of theta and alpha is consistent
    (with the sign of fig5-theta-alpha-lower-talking); partially reproduced when the gamma part
    holds and the theta and alpha part holds in two of the three ROIs. The size of each
    difference is reported.
- id: fig5-middle-temporal-tv
  statement: The middle temporal lobe shows consistently higher activity in 4 of the 5 bands
    when participants watch TV than when they talk.
  source: Results, 3.1, paragraph 6; Figure 5
  quote: Additionally, the middle temporal lobe displayed consistent increased activation in 4 out
    of 5 frequency bands of interest when the participants watched TV instead of talking.
  data: with_inputs
  expected:
  - quantity: middle temporal bands consistent with negative difference
    value: 4
    tolerance: 0
  criterion: As fig5-gamma-higher-talking (M8, O5 to O9). Reproduced when, under one reading,
    exactly 4 of the 5 middle temporal bands are consistent with a negative difference (Watching
    TV higher); partially reproduced when 3 or 5 are.
- id: inferior-temporal-high-gamma-inconsistent
  statement: High gamma in the inferior temporal lobe decodes well but its mean difference is
    virtually zero, so its signal is inconsistent across folds and participants.
  source: Discussion, paragraph 5
  quote: When investigating high γ activity in the inferior temporal lobe, the decoding
    performance was generally high, whereas the mean difference was virtually zero.
  data: with_inputs
  depends_on:
  - fig2-highest-accuracy
  criterion: A claim of absence on the mean difference, judged on the paper's test, the two-sided
    t-test against zero with BH FDR at 0.01 (M8), with O5 to O9. Reproduced when inferior
    temporal high gamma is significant for accuracy (M6) and its mean difference is not
    significant; not reproduced when the mean difference is significant. The mean difference,
    its 95% interval and its size relative to the other features are reported either way.
- id: all-rois-but-inferior-parietal
  statement: Every ROI except the inferior parietal lobe has at least one band that both
    separates the two behaviours and is consistent across participants.
  source: Discussion, paragraph 3
  quote: It would lead us to conclude that with in this study, all analyzed ROIs, except the
    inferior parietal lobe, had at least one frequency band that could separate the two
    naturalistic behaviors and consistent signal characteristics across participants.
  data: with_inputs
  criterion: Consistency per M8, with O5 to O9. Reproduced when, under one reading, each of the
    seven other ROIs has at least one consistent band and the inferior parietal lobe has none;
    partially reproduced when six of the seven have one and the inferior parietal lobe has
    none.
- id: fig6-sign-consistency
  statement: The sign of the Talking minus Watching TV difference is the same in all participants
    for 9 of the 40 ROI and band combinations (22.5%).
  source: Results, 3.1, paragraph 7; Figure 6 legend
  quote: A total of 9 out of 40 (22.5%) of ROI/frequency band combinations show no change in sign
    differences across participants, highlighting the consistency of the learned features.
  data: with_inputs
  expected:
  - quantity: combinations with the same sign in all participants
    value: 9
    tolerance: 1
  criterion: Per participant, the mean over the 7 training folds of the mean difference (M9),
    the ROI scalar under O6, with O5, O7, O8; missing ROIs under O14. The tolerance is 10% of 9
    rounded to a whole combination, since the count is an integer. Reproduced when, under one
    reading, the count is 8 to 10; partially reproduced when it is 7 or 11.
- id: fig6-examples
  statement: High gamma in the precentral, middle frontal and postcentral regions, and alpha in
    the precentral, inferior parietal and supramarginal regions, have the same sign in all
    participants.
  source: Results, 3.1, paragraph 7; Figure 6
  quote: For example, we note that high gamma activity in the precentral, frontal middle and post
    central lobes all show the same directionality across the participants. In addition, alpha
    band is completely consistent across participants in the precentral, inferior parietal and
    supramarginal lobes.
  data: with_inputs
  depends_on:
  - fig6-sign-consistency
  criterion: As fig6-sign-consistency (M9, O5 to O8, O14). Reproduced when, under one reading,
    all six named combinations share a sign across participants; partially reproduced when 4 or
    5 do.
- id: fig7-non-additive
  statement: Adding electrodes from further top-ranked ROIs generally does not improve a
    participant's decoding performance; the information is not additive across ROIs.
  source: Results, 3.2, paragraph 1; Figure 7 legend; Discussion, paragraph 3
  quote: The main trend is that the performance is not additive, indicating that adding the
    top-performing ROIs does not contribute additional information that would improve the
    decoding performance.
  data: with_inputs
  criterion: Per participant and band (25 curves), the incremental scheme of M10 under O15, with
    O5, O7, O8. The paper gives no test or threshold for "additive". Readings, named before the
    analysis are (a) a curve is additive when its test accuracy with all ROIs exceeds its
    accuracy with the top ROI alone; (b) a curve is additive when the best accuracy over k
    exceeds the top-ROI accuracy by more than the 95% interval of the top-ROI fold accuracies.
    Reproduced when, under one reading, at most 5 of the 25 curves (a fifth, read from
    "generally") are additive; partially reproduced when 6 to 12 are. The outcome rests on the
    reading chosen.
- id: fig7-participant4-low-gamma
  statement: The only notable additive case is Participant 4 in the low gamma band.
  source: Results, 3.2, paragraph 1; Figure 7
  quote: The only instance with notable additive information is for Participant 4 when analyzing
    the low γ band.
  data: with_inputs
  depends_on:
  - fig7-non-additive
  criterion: As fig7-non-additive (M10, O15, readings (a) and (b)), participant numbers under O1
    (figure 4 is Table 1's 5 under (a), Table 1's 4 under (b)). Reproduced when, under one
    reading, Participant 4's low gamma curve has the largest gain of the 25 curves (best
    accuracy over k minus top-ROI accuracy); partially reproduced when it is among the three
    largest.
- id: fig7-above-70
  statement: With a simple LDA, every participant reaches more than 70% accuracy, with a maximum
    of about 80% for Participant 4 in the low and high gamma bands.
  source: Results, 3.2, paragraph 1; Figure 7; Abstract, Main results
  quote: Using a simple classifier such as LDA, we would achieve a performance of greater than 70%
    for all participants, with maximum classification accuracy being around 80% for Participant 4
    when analyzing low and high γ bands.
  data: with_inputs
  expected:
  - quantity: maximum accuracy, Participant 4, low and high gamma
    value: 80
    tolerance: 8
    unit: '%'
  criterion: Per participant, the best test accuracy over the bands and k of the Figure 7 curves
    (M10, O15), with O5, O7, O8; participant numbers under O1. Reproduced when, under one
    reading, every participant's best accuracy exceeds 70%, and Participant 4's best accuracy
    in low and in high gamma are within tolerance of 80% and are the highest of the five
    participants; partially reproduced when the 70% part holds for four participants or the
    maximum is out of tolerance.
- id: discussion-above-80
  statement: Subject-specific classification performance regularly exceeds 80% with a simple LDA.
  source: Discussion, paragraph 3
  quote: Subject-specific classification performance regularly exceeds 80% when using a simple LDA
    classifier.
  data: with_inputs
  depends_on:
  - fig7-above-70
  criterion: Over the single-ROI participant accuracies (Figure 4, M9) and the Figure 7 curves
    (M10), with O5, O7, O8, O15. The paper gives no count for "regularly". It sits beside the
    Results' "greater than 70% for all participants" and "maximum ... around 80%"; read as at
    least three of the five participants having some feature or curve point above 80%.
    Reproduced when that holds under one reading; partially reproduced when one or two
    participants exceed 80%.
- id: fig7-exceeds-group
  statement: For individual participants, performance usually exceeds the group-level
    performance of Figure 2.
  source: Results, 3.2, paragraph 1; Figure 7; Figure 2
  quote: Further, we observed that for individual participants, performance usually exceeded
    group-level performance ( Figure 2 ).
  data: with_inputs
  criterion: The paper does not say which Figure 7 and Figure 2 values are compared. Readings,
    with M10, O15, O5, O7, O8; (a) each participant's best Figure 7 accuracy against the highest
    participant-wide accuracy of Figure 2 (claim fig2-highest-accuracy), "usually" read as at
    least four of the five participants; (b) each of the 25 curves' best accuracy against the
    participant-wide accuracy of the same band in its top ROI (Figure 2), "usually" read as
    more than half of the curves. Reproduced when, under one reading, the count is met;
    partially reproduced when three participants (a) or at least a third of the curves (b)
    exceed it.
- id: fig7-best-band-varies
  statement: The band that gives a participant's highest performance varies by participant;
    Participant 5 is best with theta and Participant 3 best with alpha.
  source: Results, 3.2, paragraph 1; Figure 7
  quote: For example, Figure 7 shows that Participant 5's decoding performance is highest when
    using the θ band, while Participant 3's decoding performance is highest when using the α
    band.
  data: with_inputs
  criterion: Per participant, the band whose Figure 7 curve reaches the highest test accuracy
    (M10, O15), with O5, O7, O8; participant numbers under O1 (a), the only reading in which a
    Participant 3 exists (Participant 5 is Table 1's 8, Participant 3 is Table 1's 4). Reproduced
    when, under one reading, Participant 5's best band is theta and Participant 3's is alpha;
    partially reproduced when one holds.
checks:
