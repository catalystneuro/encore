    of the threshold.
  source: Supplemental Material VI; Figure S5C
  quote: the hit rate below some threshold ρth is not a monotonic function of ρth (Fig. S5C)
  criterion: Active-phase windows split by their mean firing rate (as in figs5a-firing-rate-order)
    at rho_th on a grid of step 0.0025 from 0.05 to 0.20 (the plotted range); hit rate pooled as
    in M5. Reproduced when the below-threshold hit rate has an interior maximum that exceeds its
    values at both ends of the range by more than one bootstrap SE (O8); not reproduced when the
    curve is monotonic within that margin.
  depends_on:
  - figs5a-firing-rate-order
- id: figs7-fatigue-halves
  statement: In each half of the active phase (first and last 30 min), the scaling hit rate still
    rises above the no-scaling hit rate as the threshold grows, though the overall hit rate is
    lower in the second half.
  source: Results B, paragraph 2; Supplemental Material VIII; Figure S7
  quote: in the second half of the active phase, we observe lower kurtoses than in the first half,
    but the relation between performance and kurtosis is preserved
  criterion: The analysis of fig3c-scaling-hit-rate-higher, separately for windows in the first
    and the last 30 min of the active phase. Reproduced when, in each half, the relative gain
    (Eq. 13) is positive at every grid point from kappa_th = 8 to 12 and larger at 12 than at 8,
    and the overall hit rate (all windows) of the second half is lower than that of the first.
    Partially reproduced when the gain holds in one half.
  depends_on:
  - fig3c-scaling-hit-rate-higher
- id: figs8-halves-and-phase-order
  statement: Kurtosis is lower in the second half of the active phase than in the first, yet both
    halves keep more windows above threshold than the passive and non-natural image phases; the
    non-natural image phase, though it precedes the passive phase, has the lowest kurtosis.
  source: Supplemental Material VIII, paragraph 2; Figure S8
  quote: The active phase - even subdivided into two halves - consistently exhibits higher kurtosis
    levels compared to the other phases
  criterion: Complementary cumulative distributions as in fig4a-active-most-scaling for four
    groups (active first 30 min, active last 30 min, passive, NNI), on the grid of O7 from
    kappa_surr_max to 15. Reproduced when, at every point where any group is above zero, active
    first half >= active second half > passive > NNI. Partially reproduced when the order of
    the second half over passive, or the first half over the second, fails at some points.
  depends_on:
  - fig4a-active-most-scaling
