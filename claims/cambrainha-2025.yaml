# Claims for Cambrainha, Castro, de Vasconcelos, Carelli & Copelli (2025), PRX Life,
# doi:10.1103/w49n-2vz8, "Criticality at Work: Scaling in the Mouse Cortex Enhances
# Performance", on dandiset 000713 (Allen Institute, Visual Behavior, Neuropixels).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-11-27, protocol pilot-18 as stated in docs/protocol.md.
#
# Text read. arXiv preprint 2410.23508 version 2 (15 Sep 2025), standing in for the PRX Life
# version of record, in paper/10.1103-w49n-2vz8.txt: main text, Appendix (Methods and
# Materials, sections 1 to 6), and the Supplemental Material (sections I to VIII and Figures
# S1 to S8). The PDF was opened to read Figures 3, 4, S1, S5, S7 and S8, whose axes the text
# garbles. Values read from figures are marked as such.
#
# Code read. None. The paper links no analysis code and no repository (the contributions
# statement says D.M.C. provided initial code and G.G.C. refined it, without a location).
#
# Data the paper used (Appendix 1, Figure 1A). The Allen Visual Behavior Neuropixels dataset
# (ref. 60, DANDI), which the dandiset's title names. Mice trained to lick on an image change.
# Each recording about 2 h 25 min, in three phases. Active: about 60 min of natural images in
# 250-ms flashes, a change-detection task with reward, lick port present. Non-natural images
# (NNI): Gabor patches for 15 min, full-field black and white flashes, and a gray screen for
# 5 min. Passive: the same natural images in the same order, lick port retracted, no reward.
# Spikes sorted with Kilosort2 by the Allen Institute; single-unit and multiunit activity both
# kept. Units in primary visual cortex (V1). The 62 sessions (from 44 mice) with more than 128
# V1 units. Measured variables used: V1 spike times, the phase boundaries (stimulus blocks),
# and the task trials with their outcomes (hit or miss). Familiar and novel image sessions are
# not told apart in the paper; all are pooled.
#
# Method fixed by the paper (Appendix, figure legends, Supplemental Material).
# M1 Binning and windows. Spikes binned at 50 ms; each phase cut into 30-s windows (600 bins);
#    windows with CV > 5 excluded, CV = sigma/mu of "the activity across the window"
#    (Appendix 1).
# M2 Surrogate. Per window, the interspike intervals of each unit shuffled within the window
#    (Appendix 2).
# M3 Momentum-space coarse graining (Appendix 3). Per window, the covariance of the units'
#    binned counts (Eq. 2); eigenvectors ranked by eigenvalue; projector onto the top Ncutoff
#    (Eq. 4); psi_i = Z_i sum_j P_ij (phi_j - <phi_j>) with Z_i making var(psi_i) = 1 (Eq. 5,
#    which prints phi_i inside the sum; read as phi_j, the projection). Kurtosis at Ncutoff =
#    N/16, kappa = <psi^4>/<psi^2>^2.
# M4 Kurtosis threshold. A window with kappa > kappa_th is "scaling", otherwise "no scaling"
#    (Results A; Figure 3A). kappa_surr_max is the largest surrogate kurtosis; it is about 7 in
#    Figures 3C, 3D and 4A (read from the figures).
# M5 Hit rate (Appendix 5, Eqs. 11 and 12). Pooled over all windows of all sessions above (or
#    below) kappa_th, total hits over total trials. Relative performance (Eq. 13), scaling minus
#    no-scaling hit rate over no-scaling hit rate. Standard error by bootstrap over windows,
#    10^5 resamples.
# M6 Trial-shuffled control (Appendix 6). For each trial, another trial of the same session
#    chosen at random and their outcomes swapped; scaling-window hit rate computed as in M5;
#    500 repetitions, mean and SD shown.
# M7 Real-space coarse graining (Appendix 4; Results B, paragraph 3). Per window, the most
#    correlated pair of units summed, repeated until none is left unpaired (Eq. 6); iterated k
#    times to clusters of K = 2^k units. alpha from mean cluster variance M2 ~ K^alpha (Eq. 7);
#    beta from F = -log P_silence ~ K^beta (Eq. 8); mu from the covariance spectrum
#    lambda = A (K/rank)^mu (Eq. 9), windows with r^2 < 0.85 discarded for mu; z from the time
#    tau_c at which the cluster-averaged autocorrelation reaches 1/e, tau_c ~ K^z (Eq. 10).
#    Trivial values alpha = 1, beta = 1, z = 0. Exponents computed over all windows of a session
#    (Supplement III), reported as mean and SD across sessions (Figure 4 legend; Supplement V).
# M8 Tests. Mann-Whitney U between phases' distributions of session exponents (Figure 4
#    legend; Supplement V).
#
# Details the paper leaves open, with the readings it allows. Criteria refer to these by
# number. An outcome that rests on one of them rests on an assumption.
# O1 Units and sessions. "more than 128 recorded units" (Appendix 1) against "N>=128" (Figure
#    1D). The main analysis keeps a greedy sorting "potentially including noise units"
#    (Supplement II), so units are read as all units whose structure is V1 (VISp), with no
#    quality filter, reading (a). Reading (b) applies the dataset's default unit quality
#    filters. The "more strict sorting criteria" of the 43-session variant (Supplement II) are
#    not named. Readings: (i) the dataset's default quality filters (ISI violations, amplitude
#    cutoff, presence ratio, as the dataset documents them); (ii) units labelled good by the
#    sorter's curation. Counts > 128 and >= 128 are both run.
# O2 CV of a window (M1). "The activity" can be (a) the population count (sum over units) per
#    bin over the 600 bins; (b) the mean over units of each unit's CV; (c) the CV of all
#    unit-bin counts pooled. Which windows each reading drops can change every later result.
# O3 Kurtosis pooling (M3). "From the distribution" of the coarse-grained activity: read as
#    (a) the psi_i(t) of all units and bins pooled into one distribution (as in Figure 2B), the
#    reading the text supports; (b) the mean over units of each unit's kurtosis. Ncutoff =
#    floor(N/16) when N is not a multiple of 16 (a standard choice).
# O4 Phases. Active is the change-detection block; passive is the replay block. NNI can be
#    (a) Gabors, flashes and the gray screen (Figure 1A names a gray background), or (b) Gabors
#    and flashes only. Windows tile each phase from its start, without overlap, the last
#    partial window dropped (a standard choice).
# O5 Trials. "Hits and misses" read as go (change) trials with outcome hit or miss; catch and
#    aborted trials left out. Auto-rewarded trials (a) left out or (b) kept as hits. A trial
#    belongs to the window holding its change time (a standard choice; the trial start time is
#    a variant).
# O6 kappa_surr_max (M4). (a) The maximum of surrogate kurtosis over all surrogate windows of
#    the phase analysed (active for Figure 3); (b) over all phases (Figure 4A uses one shaded
#    area for all phases). One surrogate per window (a standard choice).
# O7 Threshold grid. kappa_th is evaluated on a grid of step 0.05 (a standard choice). The
#    range judged is the plotted one, from kappa_surr_max to 12.5 for Figure 3, to 15 for
#    Figures 4A and S8.
# O8 Bootstrap (M5). "averaging" can be (a) recomputing the pooled hit rate (Eq. 11) on the
#    resampled windows, or (b) averaging the resampled windows' own hit rates. How the 3%
#    error of the relative gain is propagated is not said; (c) the SD of Eq. 13 over the same
#    bootstrap resamples is used for it.
# O9 Real-space details (M7). Correlation is Pearson between binned counts, recomputed among
#    clusters at each step; the unit left unpaired when the count is odd is dropped (standard
#    choices following ref. 42). P_silence: (a) F = -log of the mean over clusters of each
#    cluster's fraction of silent bins; (b) the mean over clusters of -log of that fraction.
#    tau_c by linear interpolation between 50-ms lags (a standard choice). Fit range of K:
#    (a) from K = 1 to the largest K with at least two clusters; (b) from K = 1 to N/16. mu:
#    (a) one fit on the within-cluster spectra of all cluster sizes K >= 16 pooled against
#    rank/K, (b) the spectrum of clusters of the single size K = 64 (the largest with two
#    clusters at N = 128), ranks 1 to K. Fits are least squares on log-log axes.
# O10 Session exponents (M7). (a) One fit per window, the session value the mean over its
#    windows (supported by the per-window r^2 rule for mu); (b) the window quantities (M2, F,
#    spectra, tau_c) averaged over the session's windows, one fit per session.
# O11 Unit of the exponent test (M8). (a) Session values, 62 per phase, two-sided, unpaired, the
#    reading the reported p-values fit (the smallest p printed, 8e-21, is about what complete
#    separation of 62 against 62 gives); (b) window values pooled, shown as a variant.
