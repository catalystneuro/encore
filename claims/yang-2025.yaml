- id: fig5c-interictal-iis-no-difference
  statement: Interictal IIS rates did not differ between stimulated and non-stimulated sites in
    either target or non-target stimulation groups.
  source: Results D, paragraph 2; Figure 5C
  quote: During the interictal period, IIS rate at stimulated and non-stimulated sites in both
    target and non-target stimulation groups showed no significant differences (Fig. 5C).
  depends_on:
  - figs2-target-assignment
  criterion: A claim of absence. IIS rates from 30 min interictal segments as in Methods F, per
    channel, in four sets (target group stimulated site, target group other sites, non-target
    group stimulated site, non-target group other sites). The legend names no test; Methods G
    gives Kruskal-Wallis for several independent samples, which is the test judged, at p < 0.05,
    with pairwise Mann-Whitney shown as a variant. The unit (per segment-channel, or per group and
    channel mean) is open; both are shown. Reproduced when the Kruskal-Wallis test is not
    significant; not reproduced when it is. Medians (Figure 5C shows about 0.3 to 0.4 per s) are
    reported.
- id: fig5d-iis-seizure-correlation
  statement: Interictal IIS rate correlates positively with seizure frequency (r = 0.57).
  source: Results D, paragraph 2; Figure 5D
  quote: Fig. 5D shows a positive correlation between interictal IIS rate and seizure frequency
    (r = 0.57), indicating that higher interictal IIS rate may predict increased seizure risk.
  expected:
  - {quantity: Pearson r of z-scored IIS rate and seizure rate, value: 0.57, tolerance: 0.057}
  criterion: Figure 5D plots z-scored IIS rate (per s) against z-scored seizure rate (per h), with
    about 50 points. Pearson correlation (the paper's correlation method, Methods C). The unit of a
    point and the z-scoring are open; readings are (a) one point per recording day, z-scored within
    rat; (b) one point per group (baseline and stimulation, 56 groups), z-scored within rat;
    (c) as (a) or (b) z-scored over all rats. Reproduced when, under one reading, r is within
    tolerance and positive; partially reproduced when r is positive and significant (p < 0.05) but
    outside tolerance.
- id: fig6cd-interictal-hfo-no-difference
  statement: Interictal ripple and fast ripple rates, normalized to the preceding baseline, did not
    differ between target and non-target stimulation.
  source: Results E, paragraph 1; Figure 6C-D
  quote: Results revealed no significant differences in ripples and fast ripples during the
    interictal period between target stimulation and non-target stimulation (Fig. 6C, D)
  depends_on:
  - figs2-target-assignment
  criterion: A claim of absence, judged on the paper's test, the paired t-test of the Figure 6
    legend, at p < 0.05, for ripples and fast ripples separately. HFOs detected by short line
    length (HFO App, ref. 50) in six 30 min interictal segments per day; the window length,
    threshold and filter are not given, so the HFO App defaults are used, and the manual review
    cannot be repeated (automatic detections are used, a deviation). Fast ripples at 1 kHz sampling
    are filtered from 250 Hz to just below the 500 Hz Nyquist limit. Rates normalized to the
    preceding baseline group (relative change). The pairing is not defined, as the groups are
    independent; readings are (a) by rat, each rat's target-group mean against the mean of its
    non-target groups; (b) unpaired t-test across groups. Reproduced when the test is not
    significant for either band under the paired reading (a); not reproduced when it is. Means and
    p under both readings are reported.
- id: fig6e-ictal-ripples-no-difference
  statement: During seizures, ripple rates normalized to pre-stimulation did not differ between
    target and non-target stimulation.
  source: Results E, paragraph 2; Figure 6E
  quote: During the ictal period, electrical stimulation showed limited effects on ripple
    regulation, with no significant difference between target and non-target stimulation.
  depends_on:
  - figs2-target-assignment
  criterion: A claim of absence, judged on the paper's test, the paired t-test of the Figure 6
    legend, at p < 0.05, target against non-target. Ictal ripple rates in the post window normalized
    to the pre window (relative change); the windows are not stated for HFOs and are taken from
    Methods D (pre from onset to stimulation start, post 5 s after the first train; for baseline
    seizures 0 to 5 s and 10 to 15 s), as Figure 6E-F also shows a Baseline group. Pairing readings
    as in fig6cd-interictal-hfo-no-difference. The x-axis labels of Figure 6E-F name the red point
    "Non-target stim" and the yellow one "Target stim", against the colour code of Figure 6C-D and
    of Figures 3 to 5 (red for target) and against the text of Results E; the colour code is taken
    (red is target), so Figure 6E shows target near -0.16 and non-target near -0.04 (read from the
    plot, for comparison only). Reproduced when the test is not significant under reading (a); not
    reproduced when it is.
- id: fig6f-ictal-fast-ripples-reduced
  statement: During seizures, target stimulation reduced the fast ripple rate, normalized to
    pre-stimulation, compared with baseline and with non-target stimulation.
  source: Results E, paragraphs 2 and 3; Figure 6F
  quote: However, Fig. 6F demonstrates that target stimulation significantly reduced fast ripple
    frequency, closely associated with the pathological processes of epileptic seizures [61].
  statistics:
  - about: target against baseline
    test: paired T-test
    p: 0.05
    p_relation: "<"
  - about: target against non-target
    test: paired T-test
    p: 0.05
    p_relation: "<"
  depends_on:
  - figs2-target-assignment
  criterion: Computed as in fig6e-ictal-ripples-no-difference, for fast ripples. Figure 6F shows
    target near -0.25, baseline near 0.2 and non-target near 0.1 (read from the plot, for
    comparison only), taking the red point as target by the colour code; its x-axis label reads
    "Non-target stim" (see fig6e-ictal-ripples-no-difference). The text says target stimulation
    reduced fast ripples, which fits the colour code and not the labels; the stars join the red
    point to each of the other two. Reproduced when, under one pairing reading, the target mean is below both
    others with p < 0.05 for each comparison; partially reproduced when one comparison holds.
