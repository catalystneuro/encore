- id: fig6fg-disordered-eigenvectors
  statement: Spectral embedding finds rings in a circulant matrix with weak noise, whose
    eigenvectors are Fourier modes, but not in the model, whose eigenvector point clouds are
    structureless, while eigenvalue degeneracy is present in every case, so degeneracy is proposed
