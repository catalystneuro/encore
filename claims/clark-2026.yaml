- id: fig4-generative-fit
  statement: A single parameter set of the generative process, fitted to the two-point
    correlation function pooled over mice, is (sigma, beta, b) of about (1.42, 2.77, 1.73).
  source: Results, Statistical generative process, paragraph 5; Fig. 4d to f; Methods, Model
    settings, Setting 2
  quote: This yields (σ, β, b) ≈ (1.42, 2.77, 1.73; Fig. 4d–f) and tuning curves closely
    resembling the experimental ones (Fig. 4g)
  data: dataset
  depends_on:
  - hd-cell-selection
  expected:
  - quantity: Fourier decay scale sigma
    value: 1.42
    tolerance: 0.142
  - quantity: sharpness beta
    value: 2.77
    tolerance: 0.345
  - quantity: soft threshold b
    value: 1.73
    tolerance: 0.173
  criterion: As in ring/gp_opt.py and the notebook. The data target is the power spectrum of the
    1,533 unit-mean curves (fn.calc_C, the mean over neurons of the squared moduli of the rfft
    with norm forward). The model spectrum is computed the same way from 500,000 samples of the
    Gaussian process (Fourier coefficients of the wrapped Gaussian exp(-n^2 / 2 sigma^2) / (sqrt(2
    pi) sigma), as tc.wrapped_gaussian_cov) passed through the softplus of equation (19) and
    divided by their means. The error is the Euclidean norm of the difference over the first 20
    coefficients (indices 0 to 19, Fig. 4d legend), minimised over the grid sigma in linspace(1,
    2, 20), b in linspace(0.01, 5, 30) and beta in linspace(0.01, 10, 30), seed 42. The tolerance
    on beta is one step of that grid (0.345), larger than 10% (0.277), because the fit can only
    land on grid points; the others are 10%, which is about one grid step for b and nearly three
    for sigma.
