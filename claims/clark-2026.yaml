  - fig2b-sorted-weights-mexican-hat
  criterion: As in the notebook's run_analysis. J and J' (the solution for the angular derivative
    of the targets, Methods equation (41)), c 1, tau 50 ms, step 1 ms, started at the target
    state of angle 0 and run for 110 s; omega is 0.8 rad/s from 20 s on (j), or the angular
    velocity of A3707's wake_square head direction (k), with gaps interpolated on the circle,
    unwrapped, 2,000 still samples prepended, smoothed with a Gaussian of 10 samples and
    differenced (data_driven.preprocess_hd_data). The first 20 s are dropped. m(theta, t) is
    equation (5) with the target firing rates; the target is the integral of omega. The paper
    gives no measure of tracking; the readings are (a) the median absolute circular difference
    between the angle of the peak of m and the target is below pi/8, and (b) the circular
    correlation between them is at least 0.9 (thresholds chosen here, open). Reproduced when both
    inputs track under one reading; partially when only the constant input does.
- id: fig2l-recorded-bump-tracks-hd
  statement: The overlap order parameter computed directly from the recordings, with the measured
    tuning curves and binned spike counts of one mouse, forms a bump that tracks the animal's head
    direction.
  source: Results, Dynamics of the data-derived network model, paragraph 7; Fig. 2l
  quote: The resulting bump tracks the animal’s head direction (Fig. 2l) and closely resembles
    that of the model (Fig. 2k)
  data: dataset
  depends_on:
  - hd-cell-selection
  criterion: Mouse A3707 (the session with most head-direction cells, 117), wake_square epoch, as
    in notebooks/closing_the_loop.ipynb. Spike counts of the 117 cells in 10-ms bins, averaged in
    100-ms bins (10 bins), each cell's counts and curve divided by the mean of its curve; m is the
    mean over cells of curve times counts at each of the 100 angles. The curves are those of the
    whole session (mean of the two partitions), as the code uses. The paper gives no measure;
    the readings are (a) the median absolute circular difference between the angle of the peak
    of m and the mean head direction in the same 100-ms bin is below pi/8, and (b) their circular
    correlation is at least 0.9 (thresholds chosen here, open). Bins with untracked head direction
    are left out. Reproduced under either reading. Curves from one partition applied to the
    other partition's spikes are shown as a variant.
- id: figs8-s9-lambda-and-c
  statement: In the data-derived network, with no uniform inhibition activity diverges or
    collapses to the origin, small c leaves the collapse, a large regularization destroys the
    manifold, and the flow error rises at both large and small lambda, with lambda 1e-8 just above
    its minimum.
  source: Supplementary Note 3, section 8.4; Supplementary Figs. 8 and 9
  quote: At c = 0 the activity either diverges or collapses to the origin, depending on the
    initial condition. Any c > 0 in the grid prevents the divergence, but small c leaves the
    collapse. Additionally, λ can be too large ... Supplementary Fig. 9 shows the mean squared
    flow rising with larger λ and also rising at small λ, where the optimization kernel becomes
    ill-conditioned
  data: dataset
  depends_on:
  - fig2b-sorted-weights-mexican-hat
  criterion: As in notebooks/data_driven_reconstruction.ipynb, the lambda values 1e-12, 1e-10,
    1e-8, 1e-6, 1e-4 and 1e-2 and the c values of its grid, 100 perturbed initial conditions,
    trajectories projected on the top two principal components of the target manifold. Collapse
    to the origin, final firing rates with a norm below one tenth of the manifold's (threshold
    chosen here, open); divergence, non-finite or growing states. Flow error, the mean squared
    flow on the target manifold. Reproduced when c 0 gives divergence or collapse, the largest
    lambda gives collapse at c 1, and the flow error at 1e-8 is lower than at 1e-2 and at 1e-12.
- id: figs11b-data-network-global-stability
  statement: In the data-derived network, initial conditions far from the manifold converge to
