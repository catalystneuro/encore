- id: figs14-data-spectrum-doublets
  statement: In the data-derived weight matrix the leading eigenvalues are approximately real and
    come in visible but inexact doublets.
  source: Discussion, From world structure to circuit structure, paragraph 3; Supplementary Fig.
    14a
  quote: In our data-derived ... weight matrix, the eigenvalues are approximately real, and the
