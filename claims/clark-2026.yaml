  source: Results, Dynamics of the data-derived network model, paragraph 6; Fig. 2j,k; Methods,
    Angular velocity integration
  quote: m(θ, t) tracks the input accurately (Fig. 2j), and the network also follows the more
    complex trajectories of the behavioral data (Fig. 2k)
  data: dataset
