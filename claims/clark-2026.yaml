- id: fig3c-correlation-approaches-circulant
  statement: Within a mouse, the two-point correlation function of the tuning curves approaches a
    circulant form as more neurons are included, as does the centered and variance-normalized
    correlation function, whose leading eigenvectors are Fourier modes, as circular symmetry
    predicts.
  source: Results, Statistical generative process, paragraph 3; Fig. 3c; Supplementary Fig. 13
  quote: This function approaches a circulant form (Fig. 3c), as does the centered and
    variance-normalized correlation function, whose eigenvectors converge to Fourier modes
    (Supplementary Fig. 13), both being predictions of circular symmetry
  data: dataset
  depends_on:
  - hd-cell-selection
  criterion: For the four mice with most cells (A3707, A3716, A3711, A3706), the correlation
    function of equation (4) over random subsets of 5, 10, 20, 40 and 80 neurons, and the
    centered and variance-normalized version of Supplementary Fig. 13 (each angle centered and
    divided by its standard deviation across the subset's neurons, as the notebook does). The
    paper shows single random subsets (seed 42) and gives no measure, so one is fixed here and
