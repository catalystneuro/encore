  source: Results, Weights in the large-network limit, paragraphs 6 to 8; Fig. 6b,e,f,g
  quote: This procedure reveals rings in circulant matrices, whose eigenvectors are Fourier modes,
    but not in our model, where the point clouds from Vx and Vφ are structureless (Fig. 6f ...
    Eigenvalue degeneracy, however, is present in every one of these cases
  data: elsewhere
  where: github.com/davidclark1/symmetries-continuous-attractors at commit 245726f,
    notebooks/spectra.ipynb (simulation code; no recorded data)
  criterion: Run spectra.ipynb (the model matrix, and the circulant matrix with the same large-N
