- id: fig7-dmft-mexican-hat-and-stability
  statement: In the mean-field theory the effective interactions are circulant with a Mexican hat
    profile set by sigma and beta; at a bump state all Jacobian eigenvalues have negative real
    parts except the symmetry-induced zero, the uniform state has a real positive eigenvalue for
    all sigma and beta (a Turing instability), and fixing Q destabilizes the bump.
  source: Results, Dynamical mean-field theory, paragraphs 3 to 6; Fig. 7a,b,d,e,f
  quote: has the Mexican hat profile characteristic of pattern-forming systems, with shape set by
    the Fourier decay scale ... σ and sharpness β (Fig. 7a) ... At a bump state, all eigenvalues of
    M(θ, θ′) have negative real parts except the symmetry-induced zero (Fig. 7f, teal curve)
    ... a real, positive eigenvalue ... for all σ and β (a Turing instability) ... Fixing Q at Γx(0)
    for all time, a manipulation with no analog in the high-dimensional network, destabilizes the
    bump, producing a positive eigenvalue (Fig. 7f, orange)
  data: elsewhere
  where: github.com/davidclark1/symmetries-continuous-attractors at commit 245726f,
