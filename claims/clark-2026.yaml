  source: Results, Failure of classical ring-attractor models, paragraph 3; Fig. 1f,g
  quote: When tuning curves are aligned within each of the 31 mice by their circular centers of
    mass, the mean profiles are unimodal and symmetric (Fig. 1f), but the fluctuations about them
