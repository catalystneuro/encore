- id: fig2b-sorted-weights-mexican-hat
  statement: The optimized data-derived weight matrix looks unstructured in arbitrary order, and
    ordering neurons by their tuning-curve centers of mass reveals a noisy approximate Mexican hat
    structure.
  source: Results, Dynamics of the data-derived network model, paragraph 1; Fig. 2a,b
  quote: Ordering neurons by the circular centers of mass of their tuning curves reveals a noisy
    approximate Mexican hat structure (Fig. 2b
  data: dataset
  depends_on:
  - hd-cell-selection
  criterion: The network is built as in notebooks/data_driven_attractor.ipynb and Supplementary
    Note 3, section 8.1. From the 1,533 unit-mean curves, input currents by the inverse softplus
    (beta 2), smoothed with a circular Gaussian filter of 2 bins, softplus again, Sinkhorn-Knopp
    normalization of both axes (1,000 alternating sweeps, data_driven._sinkhorn_normalize),
    inverse softplus, zero-padded Fourier resampling to 10,000 angles, softplus; weights by
    regression.compute_J (dual form, lambda 1e-8, zero diagonal, Methods equation (39)). The
    matrix is shown before the uniform shift by c, as Supplementary Note 3, section 8.3, says.
    Neurons are sorted by the center of mass of the resampled curves (sort_weight_matrix). The
    profile is the mean of the sorted matrix along each circular diagonal (the first row of the
    notebook's create_circularized_matrix). Reproduced when the profile is highest at offsets
    near 0 and falls below its mean over offsets at intermediate offsets, with local excitation
    and longer-range inhibition; the paper gives no measure of noise and none is judged.
- id: fig2ef-data-network-quasicontinuous
  statement: Started at regularly spaced manifold points perturbed by noise, the data-derived
    network's trajectories return to the manifold within about 1 s and then persist over 30 s, an
    order-of-magnitude separation between convergence and drift timescales.
  source: Results, Dynamics of the data-derived network model, paragraph 3; Fig. 2e,f
  quote: Initialized at regularly spaced manifold points perturbed by noise, trajectories return to
    the manifold within ~1 s (Fig. 2f) and then persist over 30 s (Fig. 2e), an order-of-magnitude
    separation between convergence and drift timescales
  data: dataset
  depends_on:
  - fig2b-sorted-weights-mexican-hat
  criterion: The network of fig2b-sorted-weights-mexican-hat with softplus beta 2, tau 50 ms, Euler
    step 1 ms, uniform inhibition c 1 (the mean stabilizer of Supplementary equation (137)), 100
    initial conditions at every 100th of the 10,000 manifold angles with independent Gaussian
    noise of standard deviation 3 added to the input currents (run_convergence_analysis), run for
    30 s and saved every 10 ms. Distance is the smallest Euclidean distance between the firing
    rates and the 10,000 target firing-rate points, over the square root of N
    (compute_distances_to_ring). The thresholds are not given and are named as open. Returns
    within about 1 s, the median distance at 1 s is at most one tenth of that at 0 s (reading a),
    or at most twice its value at 20 s (reading b). Persists, the manifold angle of each
    trajectory (the angle of its nearest target point) moves by less than 2 pi / 20 between 1 s
    and 30 s for at least 90% of trajectories (reading c), or the 100 final angles occupy at
    least 50 distinct bins of width 2 pi / 100 (reading d). Reproduced when one of (a, b) and one
    of (c, d) hold.
- id: fig2gi-circulant-noise-collapses
  statement: The optimal weights keep a continuum of stable heterogeneous states; their circulant
    average gives bumps identical up to translation, while the circulant matrix plus the scrambled
    residuals collapses onto a few discrete states within 30 s, so the optimal weights are not a
    noisy circulant matrix.
  source: Results, Dynamics of the data-derived network model, paragraphs 4 and 5; Fig. 2c,d,g to
    i; Supplementary Note 3, section 8.2
  quote: The optimal weights (Fig. 2b) maintain a continuum of stable, heterogeneous states (Fig.
    2g). Averaging the sorted weights along ... diagonals gives a circulant matrix (Fig. 2c) whose
    bumps are identical up to translation ... this network collapses onto a few discrete states
    within the 30-s window (Fig. 2i)
  data: dataset
  depends_on:
  - fig2b-sorted-weights-mexican-hat
  criterion: As in data_driven_attractor.ipynb. The sorted matrix; its circulant version, the
    average over circular diagonals; and the circulant plus noise, the residuals (circulant minus
    sorted) with all off-diagonal entries shuffled together, the asymmetric version used in Fig.
    2d,i (numpy seed 42); both surrogates multiplied by 1.275. Each is run with c 1 from 100
    initial conditions at regularly spaced manifold points with input-current noise of standard
    deviation 2.5, for 30 s. A final state's position is the neuron index of the peak of its
    activity, smoothed across sorted neurons with a Gaussian of 2.5 neurons, as the figure is
    drawn. The paper gives no count or similarity measure; these are fixed here and named as
    open. Final positions within 2 pi / 50 of each other (31 neurons) are merged into one state.
    Reproduced when the sorted optimal matrix keeps at least 50 distinct states, the circulant
    plus noise matrix at most 10, and the circulant matrix's final states are shifts of one
    another (each correlates at least 0.99 with the best circular shift of the first). Partially
    reproduced when the contrast between the optimal and the circulant plus noise holds alone.
    The symmetric scrambled version is shown as a variant.
