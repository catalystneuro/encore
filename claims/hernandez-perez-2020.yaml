- id: fig8c-relative-delay-flat
  statement: The relative conduction delay (percent of the theta period) does not change
    significantly with theta frequency.
  source: Results, Residual phase shifts after accounting for varying waveform asymmetry resemble
    those generated by weakly coupled oscillators, paragraph 2; Figure 8C
  quote: The results revealed that the relationship between relative conduction delay (% theta
    period) and theta frequency (Hz) was not significantly different from zero (median slope 0.34%
