- id: fig8-coupled-oscillators
  statement: The residual phase shifts behave as weakly coupled oscillators predict and not as a
    fixed-delay mechanism, with stable relative delays and absolute delays that shorten as theta
    frequency rises.
  source: Results, Residual phase shifts after accounting for varying waveform asymmetry resemble
    those generated by weakly coupled oscillators, paragraph 2; Figure 8
  quote: These results are consistent with the pattern of effects that would be generated by a
    coupled-oscillator-based mechanism
  depends_on:
  - fig8c-relative-delay-flat
  - fig8d-absolute-delay-slope
  criterion: Following the predictions in Methods, Comparison to coupled-oscillators and
    fixed-delay models, reproduced when fig8c-relative-delay-flat and fig8d-absolute-delay-slope
