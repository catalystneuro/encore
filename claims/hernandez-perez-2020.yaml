# Claims for Hernández-Pérez, Cooper & Newman (2020), "Medial entorhinal cortex activates in a
# traveling wave in the rat", eLife, doi:10.7554/elife.52289, tested on CRCNS:hc-27.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-11-11, protocol pilot-14 as stated in docs/protocol.md.
#
# Text read. paper/10.7554-elife.52289.txt, the version of record (PMC7046467, open access,
# Europe PMC full-text XML flattened). It holds the abstract, Introduction, Results, Discussion,
# Materials and methods, the legends of Figures 1 to 8 and of Figure 1, figure supplement 1
# (histology, the only supplement), and the Data availability statement. No PDF was supplied, so
# no figure could be read. One display equation, the asymmetry-related delay of "Asymmetry-
# corrected data", was lost in extraction; it was read from the same Europe PMC full-text XML
# (PMC7046467, disp-formula equ1) and is
#   Delay_Asym = (D_falling(elec i) - D_rising(elec i)) - (D_falling(elec j) - D_rising(elec j)).
# The reference list is not in the text; Cole and Voytek (2017, 2019) and Belluscio et al. (2012)
# are known only by name.
#
# Code. The paper links none. Methods, Data analysis, say only "custom scripts and ... the CMBHOME
# toolbox", with no repository or commit. The dataset descriptor says the dataset's code folder
# holds loading and plotting scripts only (readData.m, spreadLFP.m) and that the analysis code is
# available on request. No code was read; every method below is from the paper's text.
#
# Data the paper used. Six male Long-Evans rats (Methods, Animals), each implanted over the right
# MEC with a custom multi-shank array of up to eight shanks whose tips are about 566 um apart
# along the dorsal-ventral axis (Methods, Electrode array construction). Recordings were made as
# rats ran laps on a circular track for food in 25-min trials (Behavioral protocol); one key
# recording per rat is analysed. Field potentials were recorded at 30 kHz (Electrophysiological
# recordings). One of the six rats carried a laminar variant of the array, up to six stereotrodes
# per shank at 450 um vertical spacing (Figure 3). For multi-unit activity, arrays were lowered
# into layer II in later recordings; three rats had multi-unit activity on four or more channels
# (Figure 4). Measured variable, the LFP voltage on each selected channel, ordered dorsal to
# ventral. The dataset's descriptor (CRCNS hc-27) says it holds one MATLAB file per rat for the six
# rats, channel 1 the most dorsal, at 500 Hz. The multi-unit band (600 to 3000 Hz) lies above that
# rate's Nyquist limit, so the Figure 4 claims need recordings the descriptor does not list;
# whether the dataset holds them is the author's to find.
#
# Shared method, from the Methods. Artefacts are voltage swings over 5 times the signal's RMS,
# removed with 500 ms either side, repeated until none remain (Data inclusion criteria). Analyses
# use high-amplitude theta epochs, where the 6-12 Hz amplitude (zero-phase fourth-order
# Butterworth) exceeds 400 uV for 500 ms or longer, dips of 100 ms or less ignored, unless
# otherwise noted (same section; coherence is not restricted to them). Hilbert phase from the
# 6-12 Hz band; waveform phase from the 1-25 Hz band, local maxima (0 deg) and minima (180 deg)
# separated by 83 to 250 ms, 90 and 270 deg at the time the filtered voltage is closest to the
# mean of the nearest minimum and maximum (Theta phase estimation). Summaries are medians with
# 95% bootstrap CIs from 500 resamples; paired tests Wilcoxon signed-rank, unpaired rank-sum;
# Pearson correlation for goodness of fit (Statistics).
#
# Open details, with the readings the text allows (criteria refer to them by number).
# O1 Electrode positions. Distance from the dorsal-most electrode is (a) 0.566 mm times the
#    channel index, from the nominal spacing (Electrode array construction); (b) per rat, the
#    spacing the dataset or its documentation gives, where it differs (one array had merged
#    shanks whose spacing was measured, and its value is not in the text).
# O2 Which channels. The Methods select one electrode per shank before analysis (Electrode
#    selection criteria); Figure 1, figure supplement 1 marks some electrodes as outside the MEC.
#    Readings, (a) every channel the rat's file holds; (b) only those marked inside the MEC, where
#    the dataset marks them.
# O3 Artefacts and theta epochs, which channel. Readings, (a) each channel's own artefacts and
#    epochs, with pairwise measures on the times both channels keep; (b) times kept on all of the
#    rat's channels at once; (c) epochs from the dorsal-most channel. Artefact threshold on the
#    absolute deviation of the raw signal from its mean (standard choice). Theta amplitude is the
#    magnitude of the Hilbert transform of the 6-12 Hz signal (standard choice).
# O4 The test printed as "rank sum [max]". Its printed values (maximum 21 with n = 6, p = 0.03 at
#    a statistic of 0 or 21, p = 0.06 at 20, p = 0.09 at 19, p = 0.16 at 3, p = 0.84 at 12) are
#    those of an exact two-sided Wilcoxon signed-rank test on six values; a rank-sum test of six
#    values does not have a maximum of 21. Read as a signed-rank test of the six per-rat values
#    against zero (one-sample) or of their paired differences.
# O5 Significance level. Not stated. The paper calls p = 0.06 significant (Results, Theta waveform
#    varies, paragraph 1) and p = 0.09 and 0.16 not. Read as p of at most 0.0625, the exact
#    signed-rank p of a statistic of 1 or 20 with n = 6; p = 0.03 is the exact p at 0 or 21.
# O6 Phase offset and its slope (Hilbert). Per electrode, the circular mean of the instantaneous
#    phase difference to the dorsal-most electrode over theta epochs (Phase locking), positive
#    when the ventral site lags. Per rat, the slope of offset on distance, (a) by least squares
#    with an intercept; (b) through the origin. The value reported with "+/-" is (a) the mean of
#    the per-rat slopes; (b) their median. What "+/-" is (SEM or SD) is not stated; it is used as
#    the tolerance.
# O7 Waveform extrema. Readings, (a) local maxima and minima of the 1-25 Hz signal, alternating,
#    keeping those whose spacing to the neighbouring opposite extremum gives a cycle of 83 to 250
#    ms; (b) one maximum and one minimum between successive zero crossings of the 6-12 Hz signal,
#    as in the method of Cole and Voytek, with the same 83-250 ms limits. Rise duration is the time
#    from a trough to the next peak, decay from a peak to the next trough; peak duration is the
#    time from the rising-phase midpoint to the next falling-phase midpoint, trough duration from a
#    falling-phase midpoint to the next rising-phase midpoint (Figure 5A legend).
# O8 Filters. "Fourth-order" Butterworth applied with zero phase; read as MATLAB butter(4, band)
#    passed through filtfilt (standard choice, unlikely to change an outcome).
