    of MEC, paragraph 1; Figure 7B and 7D
  quote: These calculations revealed that the conduction delay due to varying asymmetry was 3.56
    ms/mm [5.89–1.56] ( Figure 7B and D ). This was significantly greater than zero (signed rank
    [max]=21 [21], p=0.03, n=6)
  statistics:
  - test: signed rank
