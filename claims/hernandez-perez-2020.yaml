  quote: Comparing the correlation strength between the relative conduction delays (median rho =
    0.02 [0.02–0.04]) and absolute conduction delays (median rho = 0.14 [0.09–0.19]) confirmed that
    conduction delay varied significantly more with theta frequency than did the phase difference
    (signed rank [max]=21 [21], p=0.03, n=6)
  statistics:
  - test: signed rank
