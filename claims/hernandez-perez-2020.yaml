    different from zero across six rats.
  source: Results, Theta phase shifts gradually across the dorsal-ventral axis of the MEC,
    paragraph 2; Figure 2A and 2D
  quote: Dorsal sites were phase advanced relative to ventral, as can be seen in the cycle-triggered
    averages of the raw LFP, with the phase shifting at an average rate of 26.36 °/mm ± 2.64 °/mm (
    Figure 2A and D ). This mean shift was significantly different from zero (rank sum [max]=21
    [21], p = 0.03, n=6)
  statistics:
  - test: rank sum (read as Wilcoxon signed-rank, O4)
    statistic: rank sum [max]=21 [21]
    p: 0.03
    n: 6 rats
  expected:
  - quantity: theta phase shift along the dorsal-ventral axis
    value: 26.36
    tolerance: 2.64
    unit: deg/mm
  criterion: Hilbert phase (Methods, Theta phase estimation) on the high-theta epochs (Data
