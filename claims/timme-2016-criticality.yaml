# Claims for Timme, Marshall, Bennett, Ripp, Lautzenhiser & Beggs (2016), Front. Physiol. 7:425,
# "Criticality Maximizes Complexity in Neural Tissue", doi:10.3389/fphys.2016.00425, on CRCNS data
# set hc-8 (doi:10.6080/K0PC308P).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-09,
# protocol as stated in docs/protocol.md.
#
# Text read: the version of record (PMC5037237, open access) as supplied under paper/ (Europe PMC
# JATS XML flattened): Methods 2.1 to 2.11, Results 3.1 to 3.3, Discussion, figure legends of
# Figures 1 to 12 and Table 1, and the supplement (Data_Sheet_1.PDF, supplementary Figures S1 to S9
# with their text). The supplied text drops the display equations; Equations 1 to 14 were read from
# the MathML of the PMC XML (eutils efetch, PMC5037237): Eq. 9 integration, Eq. 10
# C_N(X) = (1/N) sum over k = 2..N of [((k-1)/(N-1)) I(X_1^N) - <I(X_j^k)>_j], Eq. 11
# B_basic = <A(t+1)/A(t)>_t, Eq. 12 A(t+k) = r_k A(t), Eq. 13 r_k ~ B_new^k, Eq. 14
# chi = var(A(t)/N_neurons). No PDF of the main article is supplied, so values printed only inside
# the figures were not read: the mean and standard deviation of each exponent in Figure 8, the
# branching ratio histograms of Figure 9, the significance stars of Figures 10 and 11, the list of
# excluded recordings in Figure 2B, and the axes of Figures 7 and 12. Claims on those figures rest on
# the Results and the legends and carry no expected values from the figures.
#
# Code. The paper cites the NCC MATLAB toolbox (Marshall et al., 2016) and "Timme N. M. (2016).
# Available online at: http://www.nicholastimme.com" for brestimate. Read: NCC Toolbox Version 1
# (June 14th, 2016), downloaded from the Software page of nicholastimme.com, zip sha256
# b7c912f8154f70fc82b13ab1725ed191935ed2877256cadd7e39f66737be294b. It holds the power-law MLE and
# support search (plmle, plparams, pvcalc: 500 surrogates, p threshold 0.2, support pairs ranked by
# log(xmax/xmin) and tried largest first), avalanche detection (avprops), rebinning (rebin, integer
# multiples of the original bin only), size given duration fit (sizegivdurwls), mean profiles and
# shape collapse (avgshapes with cutoffs 4 and 20, avshapecollapse: variance of scaled profiles over
# 1/sigma nu z in [0, 4] refined to 0.001, quadratic fit, secondDrv = 2 times the leading
# coefficient), complexity with sub-sampling correction (complexity: at most nSubSets random
# subsets per size, randomized data from independent time permutation of each neuron subtracted,
# cut at the first peak of the corrected integration over k), randomizations (randomizeasdf2:
# wrap, jitter, Poisson, swap, swap2), the branching ratio (brestimate), and the two models
# (bethelattice, cbmodel). The analysis scripts that ran these functions on the cultures are not
# published. Where the Methods leave a choice open and the toolbox settles it, the criteria follow
# the toolbox and say so.
#
# Data the paper used. Dissociated hippocampal cultures from embryonic day 18 Sprague-Dawley rat
# embryos, about 200,000 cells plated per culture on Multichannel Systems 60-electrode arrays
# (200 um spacing, 30 um electrodes), recorded without stimulation from DIV 6 to 35; 435 recordings
# (Methods 2.2; 28 cultures per the data set's description), first 59 min of each, 20 kHz; spikes sorted with wave_Clus (5 SD
# negative threshold, no dead time, checked by hand); 39,529 neurons in total, most recordings about
# 100 neurons, firing rates about 0.05 to 20 Hz. Some recordings were excluded for too few
# avalanches (red squares of Figure 2B; the threshold is not stated). Measured variables: spike
# times per neuron. The data set's description names files CultureXDIVY with data.spikes in 0.05 ms
# bins, matching the paper. The model results (Bethe lattice, cortical branching model, chain
# model) are simulations that use no recorded data.
#
# Method common to the culture claims, from Methods 2.3 to 2.11 unless said otherwise. Spikes of
# the first 59 min are rebinned to the recording's mean network-wide ISI (the ISI of all spikes of
# all neurons pooled); an avalanche is a run of consecutive bins with at least one spike, its
# duration the number of bins and its size the number of spikes (avprops). Randomizations act on
# the rebinned data: jitter with a normal SD of 1, 10 or 100 bins keeping spike counts, wrap,
# Poisson, spike swap and neuron shuffling (Methods 2.5). Complexity is computed on the avalanche
# time bins only (Methods 2.9, "unless otherwise noted") with the sub-sampling correction of the
# toolbox, at most 100 subsets per size (Methods 2.9). "Full data sets" in Figures 10 and 11 means
# the whole recorded system without the sub-sampling extrapolation (Methods 2.10).
#
# Details the paper leaves open, used by several claims, with the readings each criterion runs:
# (1) The mean network ISI must be a whole number of 0.05 ms bins for rebin; rounding to the
# nearest bin is a standard choice that cannot change the outcome. (2) Which recordings were
# excluded for too few avalanches: the threshold is not stated and Figure 2B could not be read;
# readings (a) all recordings in which the size and the duration distributions each keep at least
# one value after the cuts of Methods 2.7 and at least two durations for the shape collapse, (b)
# all recordings; the number excluded is reported. (3) The multiple comparisons correction of
# Figures 10 and 11 cites both Benjamini and Hochberg (1995) and Benjamini and Yekutieli (2001);
# readings (a) Benjamini-Hochberg, (b) Benjamini-Yekutieli, over the comparisons of one panel, at
# 0.05. The family is not stated either; one panel is used, and all comparisons of the figure are
# shown as a variant. (4) Which randomizations appear in Figures 10 and 11: the Methods list jitter 1, 10 and 100
# bins, wrap, Poisson, swap and shuffling; the criteria use all seven and report each. (5) The
# susceptibility: Eq. 14 is var(A(t)/N); readings (a) Eq. 14 as printed, (b) N var(A(t)/N), the
# Williams-Garcia et al. (2014) form, which fits the 0 to 5 range of the Figure S8 axis; both over
# all time bins of the recording. (6) Shape collapse curvature: the toolbox returns 2 times the
# leading coefficient of the quadratic fit, negative for an arched profile, while Figures S5 and 7
# report positive curvatures and Results 3.2 speaks of "average absolute curvature"; the criteria
# use the absolute value.
