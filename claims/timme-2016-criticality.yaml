- id: fig2e-avalanche-count
  statement: After rebinning to the network ISI, most recordings contain around 10,000 avalanches.
  source: Methods 2.3, paragraph 1; Figure 2E
  quote: Following the rebinning procedure and avalanche detection, most recordings contained around
    10,000 avalanches
  depends_on:
  - fig2d-network-isi
  expected:
    quantity: typical number of avalanches per recording
    value: 10000
    tolerance: 1000
  criterion: Avalanches as avprops on the rebinned first 59 min. Readings as fig2d-network-isi
