claims:
- id: fig3-chain-model-complexity
  statement: In the 12-neuron chain model, random data (c = 0) give zero integration, ordered data
    (c = 1) give high integration, and only the complex data (c = 0.8) give non-zero complexity.
  source: Methods 2.9, paragraph 6; Figure 3B and 3C
  quote: Note that random data shows no integration, while ordered data shows high integration ...
    Only the complex data shows non-zero complexity.
  criterion: A simulation, not a test on recorded data. The chain model of Methods 2.4 (12 neurons,
    first neuron alternating active and inactive between runs, p(a_i+1 = a_i) = 0.5(1 + c)), with
    complexity from Eq. 10 on the exact joint distribution (Methods 2.9, last paragraph says the
    model's distributions were defined exactly). Reproduced when C_N is zero within 1e-6 bits for
    c = 0 and c = 1 and above that for c = 0.8, and the whole-system integration is near zero for
    c = 0 and the largest for c = 1.
- id: fig5d-bethe-small-avalanches
  statement: In the critical Bethe lattice model (p_trans = 0.5), avalanche sizes are power-law
    distributed and show shape collapse, and the small avalanches (stopped by the 8th layer) are
    power-law distributed in size and have non-zero complexity.
  source: Results 3.1, paragraph 1; Figure 5B to 5D
  quote: In the original small avalanches, the sizes of the avalanches were power-law distributed
    and a non-zero complexity was observed
  criterion: A simulation, not a test on recorded data. Bethe lattice of Methods 2.4 (two outgoing
    connections per neuron, p_trans = 0.5, activity stopped at layer 10^4, one neuron active in the
    first layer per run), as in the toolbox's bethelattice.m. The number of runs is not stated; a
    standard choice of 10^4 runs is used and cannot change the direction of the result. Small
    avalanches are those that stop on or before layer 8; each run is one time series of network
    states over the neurons of layers 1 to 8. Reproduced when the size distribution of the small
    avalanches is accepted as a truncated power law by plparams (p at least 0.2) and their
    complexity (toolbox complexity, sub-sampling correction on) is above zero.
- id: fig5e-shuffle-removes-complexity
  statement: In the Bethe lattice small avalanches, neuron shuffling preserves the avalanche size
    distribution but removes the complexity.
  source: Results 3.1, paragraph 1; Figure 5E
  quote: First, we randomized the neuron identities in the avalanches (neuron shuffling). This
    operation preserved the avalanches and their power-law size distributions, but removed the
    complexity
  depends_on:
  - fig5d-bethe-small-avalanches
  criterion: A simulation, not a test on recorded data. Neuron shuffling as in Methods 2.5 (at each
    time bin the active count kept and the identities drawn uniformly over all neurons). Reproduced
    when the shuffled size distribution equals the original and the complexity falls to below 10%
    of the original value ("removed" read as near zero; 10% is a choice the paper does not make).
- id: fig5f-network-state-poisson-keeps-complexity
  statement: In the Bethe lattice small avalanches, randomizing the order of whole network states
    preserves the complexity but changes the avalanche size distribution dramatically.
  source: Results 3.1, paragraph 1; Figure 5F
  quote: when we randomized the order of the network states, but preserved neuron spiking states at
    each individual time bin (Poisson randomization for the whole network state), the complexity was
    preserved, but the distribution of avalanche size changed dramatically
  depends_on:
  - fig5d-bethe-small-avalanches
  criterion: A simulation, not a test on recorded data. Whole network states (one per time bin)
    placed at random times, as Methods 2.5, paragraph 4, last sentence. Complexity depends only on
    the distribution of states (Methods 2.9), so it is preserved exactly when the same states are
    kept; reproduced when the complexity differs from the original by less than 5% (the residue of
    the random subset draws; 5% is a choice the paper does not make) and the size distribution of the permuted data is no longer accepted as
    the original power law (plparams p below 0.2 or exponent outside the original's error).
- id: fig6-cb-distribution-curvature
  statement: In the cortical branching model, low transmission probabilities give size and duration
    distributions that curve downwards, high ones give distributions that curve upwards, and
    p_trans near 0.25 gives the straightest distributions.
  source: Results 3.2, paragraph 1; Figure 6A and 6B
  quote: note that the low transmission probability models produced distributions that curved
    downwards, whereas the high transmission probability models produced distributions that curved
    upwards. The model with a transmission probability near the infinite system critical
    transmission probability ( p trans = 0.25) produced the straightest size and duration
    distributions
  criterion: A simulation, not a test on recorded data. Cortical branching model of Methods 2.4
    (100 neurons on a 10 by 10 torus, four nearest neighbours, p_spont = 10^-4, 3 x 10^5 steps),
    as cbmodel.m. Curvature read as the sign of the quadratic term of a quadratic fit of
    log10 probability on log10 size (and duration) over the values kept by the cuts of Methods 2.7;
    a measure the paper does not define. Reproduced when, averaged over 30 models each, the
    quadratic term is negative at p_trans 0.2, positive at 0.3, and smallest in magnitude at 0.25.
- id: fig7ab-cb-complexity-susceptibility-peak
  statement: Across cortical branching models, the complexity and the susceptibility (both
    extrapolated to infinite size by sub-sampling) peak near p_trans 0.265, close to the infinite
    system critical point of 0.25.
  source: Results 3.2, paragraph 2; Figure 7A and 7B
  quote: When we plotted the complexity and susceptibility vs. the transmission probability, we
    found both peaked near p trans ≈ 0.265
  expected:
  - quantity: p_trans at the peak of mean complexity
    value: 0.265
    tolerance: 0.0265
  - quantity: p_trans at the peak of mean susceptibility
    value: 0.265
    tolerance: 0.0265
  criterion: A simulation, not a test on recorded data. 30 cortical branching models per p_trans
    (Methods 2.4); complexity on avalanche time bins; susceptibility by Eq. 14 (common detail 5);
    each extrapolated to 1/N = 0 by the sub-sampling of Methods 2.10 (sub-samples from 40 to 100
    neurons, weighted least squares with weight N; for complexity, the 10 largest sub-samples
    first, smaller ones added until a residual exceeds the mean plus 3 SD of the residuals). Open,
    the p_trans grid. Methods 2.4 prints "increments of 0.05" on 0.2 to 0.3, which gives three
    values and cannot place a peak at 0.265, while Figure S1 shows p_trans = 0.26 and Figure S2 a
    curve over the interval; readings (a) steps of 0.005 (21 values), (b) steps of 0.01 (11
    values). Open, the sub-sampling layout (Methods 2.10, "30 times at evenly spaced systems
    sizes"); readings (a) 30 sub-samples whose sizes are evenly spaced from 40 to 100 neurons, (b)
    30 random sub-samples at each of the integer sizes from 40 to 100. Reproduced when the mean
    over models of each extrapolated quantity has its interior maximum within tolerance of 0.265
    (the rise of complexity at the upper boundary, fig7a-complexity-boundary-rise, is not the peak).
- id: fig7a-complexity-boundary-rise
  statement: The cortical branching model's complexity also rises near the upper end of the tested
    range (p_trans near 0.3), a bias from longer recordings, as higher transmission gives longer
    avalanches.
  source: Results 3.2, paragraph 3; Figure 7A legend
  quote: we also found that the complexity was increasing near the boundary for the tested range of
    transmission probabilities (i.e., near p trans = 0.3)
  depends_on:
  - fig7ab-cb-complexity-susceptibility-peak
  criterion: A simulation, not a test on recorded data. With the analysis of
    fig7ab-cb-complexity-susceptibility-peak, reproduced when the mean complexity at the largest
    p_trans tested is above that at the next lower p_trans and above the minimum between the main
    peak and 0.3.
- id: figs2-recording-length
  statement: In the cortical branching model, longer recordings give higher complexity, and with all
    time bins analysed the high-p_trans rise shrinks relative to the main peak as the recording
    lengthens.
  source: Supplement, Cortical branching model, paragraph 2; Figure S2
  quote: We found that longer recordings tended to produce higher complexity values. Furthermore,
    though a secondary peak in the complexity was apparent for high transmission values (similar to
    results shown in the main text), this peak decreased in magnitude relative to the primary peak
    near ptrans ≈0.28 as the recording length increased
  expected:
  - quantity: p_trans at the primary complexity peak, all time bins
    value: 0.28
    tolerance: 0.028
  criterion: A simulation, not a test on recorded data. 30 models per p_trans run for 3 x 10^4,
    10^5 and 3 x 10^5 steps; complexity on all time bins (Figure S2 legend). The p_trans grid as
    the readings of fig7ab-cb-complexity-susceptibility-peak. Open whether the sub-sampling
    extrapolation was applied (the supplement says the analysis was identical to the main text
    apart from the time bins); readings (a) extrapolated, (b) whole 100-neuron system. Reproduced
    when the mean complexity at the primary peak increases with recording length, the primary peak
    lies within tolerance of 0.28, and the ratio of the value at p_trans 0.3 to the primary peak
    value decreases with recording length.
- id: fig7c-cb-curvature-no-peak
  statement: The shape collapse curvature of the cortical branching model does not peak near the
    critical point; sub-critical avalanches are more curved than super-critical ones.
  source: Results 3.2, paragraph 4; Figure 7C
  quote: We found that the shape collapse curvature did not peak near the critical point (Figure 7C
    ) ... the curvature results indicate that sub-critical avalanches were more curved than
    super-critical avalanches
  criterion: A simulation, not a test on recorded data. Shape collapse of mean profiles of durations
    of at least 4 with at least 20 avalanches (Methods 2.8, avgshapes cutoffs 4 and 20), absolute
    curvature (common detail 6), extrapolated by sub-sampling as Figure S1C. Reproduced when the
    mean curvature at p_trans 0.2 exceeds that at 0.3 and the curvature has no interior maximum
    within 0.02 of 0.25 and 0.265 (0.02 is a choice the paper does not make).
- id: fig7d-cb-branching-ratio-near-1
  statement: The cortical branching model's branching ratio is closest to 1 near the same
    transmission probability at which complexity and susceptibility peak.
  source: Results 3.2, paragraph 2; Figure 7D
  quote: Furthermore, the branching ratio was found to be closest to 1 near this same transmission
    probability (Figure 7D )
  depends_on:
  - fig7ab-cb-complexity-susceptibility-peak
  criterion: A simulation, not a test on recorded data. B_new from Eq. 12 and 13 with delays 1 to 8
    and 0 <= A(t) <= 5 (Methods 2.11), polyfit slopes and an exponential fit as brestimate.m, no
    sub-sampling correction (Methods 2.10). Reproduced when the p_trans whose mean B_new is
    closest to 1 lies within 0.0265 of the peaks found in fig7ab-cb-complexity-susceptibility-peak.
- id: culture-counts
  statement: The culture data hold 435 recordings and 39,529 spike-sorted neurons in total; most
    recordings yield about 100 neurons, and firing rates range from roughly 0.05 to 20 Hz.
  source: Methods 2.2, paragraphs 1 and 2; Figure 2A and 2C
  quote: "total number of neurons across all recordings: 39,529). Most recordings yielded
    approximately 100 spike sorted neurons and firing rates ranged from roughly 0.05–20 Hz"
  expected:
  - quantity: number of recordings
    value: 435
    tolerance: 0
  - quantity: total number of neurons
    value: 39529
    tolerance: 0
  - quantity: typical number of neurons per recording
    value: 100
    tolerance: 10
  criterion: Counts of recordings and of sorted units are exact properties of the deposited data, so
    the tolerance is zero. "Most recordings ... approximately 100" is read as (a) the median number
    of neurons per recording, (b) the mode of a histogram with Terrell-Scott bins; reproduced when one
    is within 10% of 100. Firing rate as spike count over the first 59 min
    (Methods 2.2); the range holds when the 5th and 95th percentiles over neurons lie within 0.045 to
    22 Hz (the range widened by 10% of each bound; the percentiles are a choice the paper does not
    make, and the minimum and maximum are reported). Firing rates span "multiple orders of magnitude"
