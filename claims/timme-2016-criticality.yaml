- id: fig2d-network-isi
  statement: Most recordings have a mean network-wide interspike interval of around 7 ms, though some
    are much higher or lower.
  source: Methods 2.3, paragraph 1; Figure 2D
  quote: Most recordings had ISIs of around 7 ms, though some data sets showed much higher or lower
    ISIs
  expected:
    quantity: typical mean network-wide ISI across recordings
    value: 7
    tolerance: 0.7
    unit: ms
  criterion: Per recording, the mean interval between consecutive spikes of all neurons pooled, over
    the first 59 min (Methods 2.3). "Most ... around" read as (a) the median over recordings, (b)
