- id: fig8-subsampling-exponents
  statement: In the culture recordings, sub-sampling extrapolation gives lower values of tau and alpha
    with lower errors than the search algorithm on the full system, while 1/sigma nu z changes
    little between the two.
  source: Results 3.3, paragraph 2; Figure 8A to 8D
  quote: We found lower values of τ and α using the sub-sampling analysis, as well as lower errors
    (Figures 8A,B ). The values of 1/σ νz showed little change between sub-sampling and the
    analysis of the full system (Figures 8C,D )
  criterion: The means and SDs printed in Figure 8 could not be read (no main PDF), so the claim is
    judged on directions. Full system, per recording, tau and alpha from plparams after the cuts of
    Methods 2.7 (sizes or durations of at least 4, and values seen at least 20 times removed one by
    one, as demoempdata.m does), 1/sigma nu z from the weighted least squares fit of size given
    duration over the fitted duration range (sizegivdurwls) and from the shape collapse
    (avshapecollapse). Sub-sampling, per Methods 2.10, the fit over all avalanches surviving the
    cuts with no range search, values regressed on 1/N with weight N, the intercept kept; layout
    readings as fig7ab-cb-complexity-susceptibility-peak. "Errors" read as the SD across recordings
    (the legend quotes mean and SD). Reproduced when the mean over recordings of the extrapolated
    tau and alpha are each below the full-system means and their SDs are smaller, and each mean of
    1/sigma nu z changes by less than 10% between the two analyses ("little change" read as 10%, a
    choice the paper does not make).
- id: fig8-exponents-match-literature
  statement: The culture critical exponents from the sub-sampling method agree better with previously
    reported values for neural avalanches (Mazzoni et al. 2007, Pasquale et al. 2008, Friedman et al.
    2012) than those from the search algorithm on the full system.
  source: Results 3.3, paragraph 2; Figure 8
  quote: The exponents found using the sub-sampling method agreed best with previously reported
    values for the critical exponents in neural avalanches
  data: with_inputs
  where: The reference values are not printed in this paper; they are those reported in Mazzoni et
    al. (2007), Pasquale et al. (2008) and Friedman et al. (2012), as cited at Results 3.3,
    paragraph 2.
  depends_on:
  - fig8-subsampling-exponents
  criterion: With the means over recordings of fig8-subsampling-exponents, and for each exponent
    (tau, alpha, 1/sigma nu z) the values the three cited papers report. Which value of each cited
    paper is meant, and how agreement is measured, are not stated; read as the absolute difference of
    the mean from each cited value. Reproduced when, for tau and alpha, the sub-sampling mean is
    closer than the full-system mean to the cited values for most of the cited papers that report
    that exponent; 1/sigma nu z is reported.
- id: fig8-sigmanuz-methods-agree
  statement: The values of 1/sigma nu z from the size given duration fits and from the shape
    collapse agree within error.
  source: Results 3.3, paragraph 2; Figure 8C and 8D
  quote: Note that the values of 1/σ νz found using distinct methods (average size given duration
    fits and shape collapse) agree within error
  depends_on:
  - fig8-subsampling-exponents
  criterion: Within error read as the difference of the two means over recordings smaller than the
    larger of their two SDs, as quoted in Figure 8 (mean +/- SD); judged for the full-system and the
    sub-sampling estimates, and reproduced when it holds for both.
- id: eq4-exponent-relation
  statement: The culture critical exponents satisfy the relation (alpha - 1)/(tau - 1) = 1/sigma nu z
    (Eq. 4) with both the search algorithm and the sub-sampling method.
  source: Results 3.3, paragraph 2; Figure 8
  quote: Furthermore, note that the critical exponents satisfy the general relationship given in
    Equation (4) using both the search algorithm and the sub-sampling method
  depends_on:
  - fig8-subsampling-exponents
  criterion: The paper gives no test. Using the means over recordings from Figure 8 as the paper
    does, reproduced when (alpha - 1)/(tau - 1) lies within one SD (propagated from the SDs of tau
    and alpha) of the mean 1/sigma nu z from size given duration or from shape collapse, for both
    analyses. Per-recording agreement is reported as a variant.
- id: eq4-relation-randomized
  statement: Randomized culture data also satisfy the critical exponent relation, with different
    exponent values.
  source: Results 3.3, paragraph 2
  quote: However, we also found that randomized data satisfied the critical exponent relationship,
    though with different exponent values (data not shown)
  depends_on:
  - eq4-exponent-relation
  criterion: As eq4-exponent-relation on the full-system exponents of the randomized data
    (fig10-randomization-markers lists the methods). Reproduced when the relation holds as defined
    there for at least one randomization method and that method's mean tau or alpha differs from the
    real data's by more than one SD ("different" read as one SD, a choice the paper does not make). The data are "not shown", so the methods it covers are open;
    every method is reported.
- id: fig9-branching-ratio
  statement: With the sub-sampling-corrected method, most culture recordings have branching ratios
    slightly below 1, while the basic method gives ratios substantially below 1 and more varied.
  source: Results 3.3, paragraph 3; Figure 9
  quote: Using the new method, we found most recordings produced branching ratios slightly below 1
    (i.e., slightly sub-critical). Using the previous basic method, we found most recordings
    produced branching ratios that were substantially less than 1 and much more varied
  criterion: B_new per recording by Eq. 12 and 13, delays 1 to 8, 0 <= A(t) <= 10 (Methods 2.11),
    polyfit and an exponential fit by non-linear least squares as brestimate.m. B_basic by Eq. 11,
    the time average of A(t+1)/A(t) over bins with A(t) > 0 (the ratio is undefined otherwise);
    the toolbox's brsimple (slope of A(t+1) on A(t)) and the per-avalanche ratio of avprops are
    shown as variants. "Slightly below 1" is not given a width; readings (a) within 0.05 below 1,
    (b) within 0.1 below 1. Reproduced when, under one reading, more than half of the recordings
    have B_new in that band, more than half have B_basic below the band, and the SD of B_basic
    across recordings exceeds that of B_new.
- id: fig10a-complexity-randomization
  statement: Culture complexity decreases under randomization, most under the strongest forms such as
    Poisson randomization, with the exception of spike swapping.
  source: Results 3.3, paragraph 4; Figure 10A
  quote: Complexity decreased under randomization, with the exception of spike swapping
  criterion: Per recording, complexity of the real data and of each randomization (common method).
    The Figure 10 legend gives the test, a rank sum test of real against each randomization across
    recordings with false discovery rate control (common detail 3). Reproduced when, under one
    correction reading, every randomization other than spike swapping gives a lower median and a
    corrected p below 0.05, and Poisson randomization is among the two largest median decreases
    (a reading of "most under the strongest forms", which the paper does not quantify).
    The swap comparison is judged in fig12a-swap-preserves-complexity.
- id: fig10b-susceptibility-randomization
  statement: Culture susceptibility decreases under randomization, most under the strongest forms such
    as Poisson randomization.
  source: Results 3.3, paragraph 4; Figure 10B
  quote: The complexity and susceptibility decreased most under the strongest forms of randomization
    (e.g., Poisson randomization)
  criterion: Susceptibility per recording by Eq. 14 (common detail 5). Test as
    fig10a-complexity-randomization. Swapping and shuffling preserve A(t) and leave chi unchanged
    (Figure 10 legend), so the claim is judged over the jitters, wrap and Poisson. Reproduced when,
    under one reading of details 3 and 5, each of these gives a lower median with corrected p below
    0.05 and Poisson is among the two largest median decreases (read as in
    fig10a-complexity-randomization).
- id: fig10c-curvature-randomization
  statement: The culture shape collapse curvature decreases under randomization, so the collapsed
    avalanches become flatter.
  source: Results 3.3, paragraph 4; Figure 10C
  quote: The shape collapse curvature decreased under randomization indicating that avalanches shape
    collapses became flatter
  criterion: Absolute curvature of the full-system shape collapse per recording (Methods 2.8, common
    detail 6). Test as fig10a-complexity-randomization, judged over the jitters, wrap and Poisson
    (swapping and shuffling preserve the profiles). Reproduced when, under one correction reading,
    each of them gives a lower median with corrected p below 0.05.
- id: figs8-complexity-susceptibility-correlation
  statement: Across culture recordings, complexity and susceptibility are positively correlated
    (correlation 0.23).
  source: Results 3.3, paragraph 4; Figure S8
  quote: We also found a correlation of 0.23 between the complexity and the susceptibility of the
    recordings
  depends_on:
  - fig10a-complexity-randomization
  - fig10b-susceptibility-randomization
  expected:
    quantity: correlation between complexity and susceptibility across recordings
    value: 0.23
    tolerance: 0.023
  criterion: Over the real recordings. The coefficient is not named; Pearson is the reading, with
    Spearman reported as a variant. Readings of the susceptibility as common detail 5.
- id: fig11ac-fit-range-randomization
  statement: The size and duration power-law fit ranges decrease under strong randomization such as
    Poisson randomization, but increase slightly under 10-bin jittering.
  source: Results 3.3, paragraph 5; Figure 11A and 11C
  quote: We found that the fit ranges decreased for strong forms of randomization (e.g., Poisson
    randomization), but showed slight increases for 10 bin jittering
  criterion: Fit range per recording as log10(xmax/xmin) of the plparams support (Methods 2.7 defines
    the ranges in decades). Test as fig10a-complexity-randomization, over the jitters, wrap and
    Poisson (the fits are unchanged under swapping and shuffling, Figure 11 legend). Reproduced when,
    for both size and duration, Poisson gives a lower median with corrected p below 0.05 and 10-bin
    jitter gives a higher median than the real data; the jitter's significance is reported. The
    Figure 11A,C legend says the ranges decreased under every randomization except 10-bin jitter;
    the direction and corrected p of 1-bin and 100-bin jitter and wrap are reported.
- id: figs9-complexity-fit-range-correlation
  statement: Across culture recordings, complexity is positively correlated with the size fit range
    (0.296) and the duration fit range (0.197).
  source: Results 3.3, paragraph 5; Figure S9
  quote: We found a correlation of 0.296 between the complexity and the size fit ranges of the
    recordings and a correlation of 0.197 between the complexity and the duration fit ranges of the
    recordings
  depends_on:
  - fig10a-complexity-randomization
  - fig11ac-fit-range-randomization
  expected:
  - quantity: correlation of complexity with size fit range
    value: 0.296
    tolerance: 0.0296
  - quantity: correlation of complexity with duration fit range
    value: 0.197
    tolerance: 0.0197
  criterion: Over the real recordings, Pearson as the reading, Spearman as a variant.
- id: fig11bd-exponents-randomization
  statement: The size and duration power-law exponents increase under randomization, as randomization
    removes large or long avalanches and steepens the distributions.
  source: Results 3.3, paragraph 5; Figure 11B and 11D
  quote: We also found that the power-law fit exponents increased under randomization because
    randomization tends to remove large or long avalanches and produce a shorter and steeper
    distribution of avalanche sizes or durations
  criterion: Full-system tau and alpha per recording from plparams after the cuts (as
    fig8-subsampling-exponents). Test as fig10a-complexity-randomization, over the jitters, wrap and
    Poisson. Reproduced when, under one correction reading, for both tau and alpha each of the five
    gives a higher median with corrected p below 0.05 (the Figure 11B,D legends name no exception);
    partially reproduced when only some do.
- id: fig12a-swap-preserves-complexity
  statement: Culture complexity does not change substantially under spike swapping, and real and
    swapped complexity are strongly correlated with most recordings near the equality line.
  source: Results 3.3, paragraph 6; Figure 12A; Figure 10A
  quote: Surprisingly, we found that the complexity did not change substantially under spike swapping
    (Figure 12A ) ... Furthermore, we found strong correlations between complexity in the real data
    and complexity in the spike swapped data
  depends_on:
  - fig10a-complexity-randomization
  criterion: A claim of absence, judged on the paper's test, the rank sum test of real against
    swapped complexity across recordings with the false discovery rate control of Figure 10A
    (common detail 3); reproduced when the corrected p is at least 0.05 under the reading used for
    fig10a-complexity-randomization, not reproduced otherwise; the median relative change is given
    either way. "Strong correlation" is not given a value; Pearson r of at least 0.7 is the reading
    (a choice the paper does not make), Spearman as a variant. A paired signed-rank test is shown
    as a variant.
- id: fig12b-shuffle-lowers-complexity
  statement: Culture complexity decreases somewhat under neuron shuffling; real and shuffled
    complexity are strongly correlated, but real complexity tends to be greater.
  source: Results 3.3, paragraph 6; Figure 12B
  quote: Note that the complexity values were strongly correlated, but complexity in the real data
    tended to be greater than the complexity in the shuffled data
  depends_on:
  - fig10a-complexity-randomization
  criterion: Shuffling as Methods 2.5 (identities redrawn uniformly over all neurons at each bin);
    the toolbox's swap2 is shown as a variant. Reproduced when real complexity exceeds shuffled
    complexity in more than half of the recordings, the rank sum test of Figure 10A gives a
    corrected p below 0.05, and the correlation is strong as read in
    fig12a-swap-preserves-complexity.
