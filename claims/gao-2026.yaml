    p: 0.05
    p_relation: ">"
    n: 6 sham rats
  criterion: A claim of absence. Seizures from M1, durations as in M2, sham rats, blocks baseline,
    condition, post 1, post 2 and post 3. Two-way ANOVA (hemisphere by block) with Bonferroni post
