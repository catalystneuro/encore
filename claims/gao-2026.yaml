# Claims for Gao, Frake, Durand and He (2026), "Transcranial Focused Ultrasound Stimulation
# Targeting White Matter Inhibits Seizures in a Rat Model of Epilepsy", IEEE Trans Neural Syst
# Rehabil Eng 34, doi:10.1109/tnsre.2025.3644273, on dandiset 001683 (same title on the archive;
# its description says the dataset is described in this paper).
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21,
# protocol as stated in docs/protocol.md (version pilot-10).
#
# Text read: the NIH author manuscript (PMC12848950) as served by Europe PMC, stored under paper/:
# abstract, Introduction, Methods, Results, Discussion, Data Availability and the legends of Figs. 1
# to 6; and the supplement (supp1-3644273.pdf, 8 pages: ex-vivo scanning, target confirmation, Figs.
# S1 to S7). There is no PDF of the main paper, so values and significance marks drawn only inside
# Figs. 2 to 6 were not read; Figs. S4, S5 and S7 were viewed in the supplement PDF. The paper links
# no code; the only repository it names is the dandiset. No code was read.
#
# Data the paper used, as it reports them (Methods A to E, supplement):
#  - Rats. 16 adult male Sprague-Dawley rats in the epilepsy study, 10 tFUS (experimental) and 6
#    sham; 7 more in a mechanism study, 23 in all. The wild-type analysis (Fig. 5) uses all 23
#    (Fig. 5B, N = 23 per group). Isoflurane anesthesia throughout.
#  - Recordings. A 32-channel skull EEG probe (NeuroNexus HC32), aligned with bregma, and a
#    64-channel intracranial array in left S1 (AP -2, ML -2.5, DV -1.5 mm). Tucker-Davis system at
#    3051.8 Hz. The 4-AP cocktail is injected into right S1 (ipsilateral = right, the injection
#    side; contralateral = left).
#  - Target confirmation (supplement), before any 4-AP. A resting baseline recording, then tFUS
#    bursts (200 us PD, 1.5 kHz PRF, 30% DC, 67 ms UD, 2 s inter-burst interval, ~127 kPa) at a
#    series of positions around the CC (AP -2, ML 0, DV -3 mm); 200 trials per position recording;
#    the position with the clearest EP is kept. These are the EPs and the resting "sham" of Fig. 5.
#  - Epilepsy experiment (Fig. 1E). Injections of 1.2 uL 4-AP cocktail into right S1 about every
#    62.5 min. A first monitoring block (repeated with more drug or less isoflurane when it had
#    fewer than 5 seizures), then the time blocks baseline, condition, post 1, post 2 and post 3,
#    each ~62.5 min. In the condition block the tFUS group received 3,750 pulses (20 ms PD, 1 Hz
#    PRF, 2% DC, ~127 kPa) to the CC; the sham group received none. Post 3 is left out of the
#    sham against tFUS comparisons (Results A).
#  - Measured variables. EEG and intracranial LFP; seizure start and stop times per hemisphere.
#
# Shared methods, cited by the criteria below.
#  M1 Seizure labels (Methods C). Signals notch filtered at 60 Hz and bandpass filtered 3 to 300 Hz;
#     ICA and common average reference on the EEG. Each hemisphere is labelled on its own, from the
#     EEG electrode closest to that side's burr hole (encircled in Fig. 1A; the channel numbers are
#     not given in the text). A seizure is a period where the summed 30 to 80 Hz power exceeds a
#     manually set threshold for at least 10 s; seizures less than 10 s apart are merged. The
#     labels were set by hand, blinded to the block. If the dandiset holds the paper's seizure
#     labels (its Data Availability says processed data were deposited), they are used. Otherwise
#     the threshold, the power window and which ICA components were removed are open; the
#     readings are thresholds of 2, 3 and 5 times the median of the summed 30 to 80 Hz power of
#     that channel over the block, in 1 s windows, on CAR-referenced EEG without ICA, and a
#     claim's outcome is the one all three give (blocked as methods_underspecified when they
#     differ).
#  M2 Seizure metrics (Methods C, Fig. 2 and 3 legends), per rat, hemisphere and block. Seizure
#     Count; Percent Time in Seizure, summed durations over block length; Seizure Duration, the
#     mean duration, leaving out seizures that start before or continue after the recording;
#     Inter-Seizure Interval, the mean interval between neighbouring seizures, with the two tFUS
#     rats that had a block without seizures left out (N = 8). Values are averaged over rats.
#  M3 Statistics (Methods F, figure legends). Two-way ANOVA with Bonferroni-corrected post hoc tests,
#     at P < 0.05, in GraphPad Prism. Fig. 3 and 4 plot each hemisphere in its own panel, so the
#     factors are group (sham, tFUS) and block (baseline, condition, post 1, post 2), per
#     hemisphere. Open, with readings: (a) ordinary two-way ANOVA, (b) repeated measures on block
#     (Prism's mixed-effects model where values are missing); and the Bonferroni family, (i) each
#     set of comparisons on its own (each block against baseline within a group; sham against tFUS
#     at each block), (ii) all those comparisons in one family. A claim of significance holds
#     when the stated comparisons are significant under one reading; a claim of absence follows
#     the absence rule of the protocol, and both ANOVA readings are reported.
#  M4 Percent change from baseline (Results B). Open, with readings: (a) the group mean of the block
#     over the group mean at baseline, minus 1; (b) the mean over rats of each rat's change from
#     its own baseline.
#  M5 Band power and AI (Methods E). PSD by Fourier transform from the EEG electrode closest to
#     each burr hole, bands theta 5 to 8, alpha 8 to 12, beta 12 to 30, gamma 30 to 80 Hz; band
#     power divided by the total PSD of the entire spectrum. AI = (ipsi - contra)/(ipsi + contra)
#     per band, normalized to the group's baseline AI. Open, with readings: the segment analysed,
#     (a) the whole block, (b) the seizure periods of M1 only (Fig. S5 compares "seizure periods");
#     the total, (a) 3 to 300 Hz, the filter band, (b) 0 Hz to Nyquist; the normalization of AI,
#     (a) divided by the group's mean baseline AI, (b) minus it. Welch's method with 2 s Hann
#     windows is a standard choice for the PSD.
#  M6 PLI (Methods E). Per band, instantaneous phase by Hilbert transform of the band-filtered EEG
#     (a zero-phase 4th order Butterworth filter is a standard choice), PLI = |mean over time of
#     sign(sin(dphi))| for each pair of channels, one channel in each hemisphere. S1 pairs join
#     left S1 and right S1 channels; non-S1 pairs join left and right non-S1 channels. The S1
#     channels are drawn only in Fig. 5A (and marked as black squares in Figs. 5C-F, S6 and S7A),
#     not listed in the text read. Open, with readings: the change, (a) a difference from the
#     reference, (b) a ratio to it (the heat maps say "PLI change" and Fig. S7B plots values near
#     zero, which favours (a)); for evoked windows, (a) a PLI per trial averaged over the 200
#     trials, (b) one PLI over all trials' samples in the window; for seizures, (a) a PLI per
#     seizure averaged, (b) one PLI over the concatenated seizure samples.
#
# The paper's text is at odds with itself in one place: the Methods give the wild-type tFUS window
# as "20 ms of stimulation", but the bursts of the target confirmation the EPs come from last 67 ms
# (supplement). The windows of Fig. 5 (-20 to 0, 0 to 20, 20 to 200 ms) are used as printed.
