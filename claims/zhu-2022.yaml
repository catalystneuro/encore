  statistics:
  - about: each class accuracy against chance level 25%
    test: two-sided t-test
    p: 0.0001
    p_relation: "<"
  expected:
  - {quantity: SYN-P accuracy, value: 0.456, tolerance: 0.0456}
  - {quantity: SYN-C accuracy, value: 0.73, tolerance: 0.073}
  - {quantity: SEM accuracy, value: 0.693, tolerance: 0.0693}
  - {quantity: non-responding accuracy, value: 0.384, tolerance: 0.0384}
  depends_on:
  - fig2b-single-type
  criterion: k-nearest neighbours (Supplementary Fig. 9 legend) with the settings the Methods give for
    the frequency decoding (5 neighbours, Minkowski p = 2, uniform weights; the Methods state them
    for that analysis, and no other kNN settings are given), features from the CORR response of each
    electrode only, onset, offset, peak (L), area and amplitude at T0 (Methods, Predicting different
    types of electrodes). Open, (a) the electrodes and labels, single-type electrodes of
    fig2b-single-type labelled by their type, and non-responding electrodes either (a1) the electrodes
    of E that pass V for no condition or (a2) the IFG electrodes outside E; co-activated electrodes
    left out;
    (b) the cross-validation, (i) stratified 5-fold repeated 100 times with the t-test over repeats,
    or (ii) leave-one-out with the t-test over electrodes of each class (correct as 1, wrong as 0);
    (c) features standardized or raw; (d) L readings. Accuracy per class is the fraction of that class's
    electrodes predicted correctly. Reproduced when, under one combination of readings, all four
    accuracies are within tolerance and each exceeds 25% with two-sided t-test p < 0.0001; partially
    reproduced when, under every combination, all four exceed chance at p < 0.0001 but the values miss
    tolerance; not reproduced when any class fails to exceed chance under every combination.
- id: fig3-latency-values
  statement: SYN-P responses start and peak earliest (onset 113 ms, peak 480 ms), then SEM (122 ms,
    524 ms) and SYN-C (283 ms, 579 ms).
  source: Results, paragraph 10; Figure 3c, 3d and 3f
  quote: The results suggested that the SYN-P (onset, 113 ms and peak, 480 ms) occurred earlier than SEM
    (122 ms and 524 ms) and SYN-C (283 ms and 579 ms) in terms of both onset and peak of the response,
    respectively.
  expected:
  - {quantity: SYN-P onset, value: 113, tolerance: 11.3, unit: ms}
  - {quantity: SYN-P peak, value: 480, tolerance: 48, unit: ms}
  - {quantity: SEM onset, value: 122, tolerance: 12.2, unit: ms}
  - {quantity: SEM peak, value: 524, tolerance: 52.4, unit: ms}
  - {quantity: SYN-C onset, value: 283, tolerance: 28.3, unit: ms}
  - {quantity: SYN-C peak, value: 579, tolerance: 57.9, unit: ms}
  depends_on:
  - fig2b-violation-electrodes
  criterion: Latencies L per electrode and condition, averaged (mean, as Fig. 3a's box centre is the
    mean) over electrodes. Open, the electrodes, (a) for each condition the electrodes passing V for it;
    (b) the electrodes of E+ (pars opercularis, pars triangularis and precentral, the set of the Fig. 3d
    legend, n = 106), each giving latencies for all three conditions; with L1, L2, L3 and the readings
    of E and V. Reproduced when, under one combination, all six values are within tolerance and SYN-P
    precedes SEM and SYN-C in both onset and peak; partially reproduced when the order holds under
    every combination but no combination puts all six within tolerance. The n of each reading is
    reported against 106.
- id: fig3d-latency-differences
  statement: Onset and peak latencies differ significantly between each pair of SYN-P, SYN-C and SEM.
  source: Results, paragraph 10; Figure 3d legend
  quote: we estimated the latency differences based on ANOVA (Fig. 3d, P < 0.001, one-way ANOVA, two
    tailed, Bonferroni, corrected for ten participants.
  statistics:
  - about: SEM onset against SYN-P onset
    test: one-way ANOVA, two tailed
    p: 1.83e-5
    corrected: Bonferroni, for ten participants
    n: 106 electrodes in pars opercularis, pars triangularis and precentral
  - about: SEM onset against SYN-C onset
    test: one-way ANOVA, two tailed
    p: 1.93e-14
    corrected: Bonferroni, for ten participants
  - about: SYN-C onset against SYN-P onset
    test: one-way ANOVA, two tailed
    p: 5.85e-30
    corrected: Bonferroni, for ten participants
  - about: SEM peak against SYN-P peak
    test: one-way ANOVA, two tailed
    p: 3.26e-13
    corrected: Bonferroni, for ten participants
  - about: SEM peak against SYN-C peak
    test: one-way ANOVA, two tailed
    p: 1.02e-5
    corrected: Bonferroni, for ten participants
  - about: SYN-C peak against SYN-P peak
    test: one-way ANOVA, two tailed
    p: 9.3e-27
    corrected: Bonferroni, for ten participants
  depends_on:
  - fig3-latency-values
  criterion: For each pair of conditions and for onset and peak, a one-way ANOVA (f_oneway) of the
    electrodes' latencies of the two conditions, p multiplied by 10 (Bonferroni "for ten participants",
    as printed). Electrodes and latencies under the readings of fig3-latency-values. Reproduced when,
    under every combination of readings, all six corrected p are below 0.001; partially reproduced
    when at least four are under every combination; not reproduced when fewer than four are under
    every combination; blocked otherwise. The paper's p for SEM against SYN-P onset (1.83e-5) with
    means 9 ms apart is noted as surprising; it is matched as printed.
- id: fig3-sync-latency-variability
  statement: Onset and peak latencies vary more across electrodes for SYN-C than for SYN-P.
  source: Results, paragraph 10; Figure 3c and 3d
  quote: This possibility may help explain the results that relatively later (and also greater
    variations of) onset and peak were observed for SYN-C than SYN-P.
  depends_on:
  - fig3-latency-values
  criterion: The paper gives no measure or test of the variation. Electrodes and latencies under the
    readings of fig3-latency-values; the spread is the standard deviation of the latencies across
    electrodes (a standard choice; the interquartile range, which Fig. 3a's boxes show, as a variant).
    Reproduced when the SYN-C spread exceeds the SYN-P spread for both onset and peak under every
    reading; not reproduced when it does for neither under every reading; blocked otherwise.
- id: fig3e-latency-not-location
  statement: Response latencies do not depend on the location of the electrodes along the
    anterior-posterior or superior-inferior axis, or across pars opercularis, pars triangularis and
    precentral gyrus.
  source: Results, paragraph 11; Figure 3e; Supplementary Figure 10c and 10d
  quote: Moreover, response latencies did not depend on the spatial location of the electrodes (Fig. 3e
    and Supplementary Fig. 10c,d).
  depends_on:
  - fig3-latency-values
  criterion: A claim of absence, judged on the paper's test, a linear regression of latency on electrode
    coordinate with its 95% confidence interval (Fig. 3e legend), for onset and peak, each condition,
    and each axis. The legend calls the axes the x and y coordinates, while the panel names the
    anterior-posterior and superior-inferior axes; on MNI152 these are y and z. Open, (a) MNI y and z;
    (b) MNI x and y, as the legend prints. Reproduced when every slope's 95%
    CI includes zero; not reproduced when any excludes it, under the readings of fig3-latency-values
    and of the axes (blocked when they differ). Slopes are reported in ms per mm. The comparison across the three areas
    (Supplementary Fig. 10c) has no test in the paper; a one-way ANOVA of latency on area at p < 0.05
    is shown as a variant.
- id: suppfig10a-separable-400-700
  statement: The accuracy of classifying the conditions after the keyword peaks about 400 to 700 ms
    after keyword onset.
  source: Results, paragraph 10; Supplementary Figure 10a legend
  quote: The accuracies for classifying different conditions peaked at about 400–700 ms after the
    keywords, which indicated they were most separable in this time frame
  expected:
  - {quantity: start of peak accuracy window, value: 400, tolerance: 40, unit: ms}
  - {quantity: end of peak accuracy window, value: 700, tolerance: 70, unit: ms}
  criterion: The paper does not name the classifier, features, time resolution or cross-validation of
    this panel. Readings, each of the three classifiers with the Methods settings (SVM, logistic
    regression, kNN), classifying CORR, SYN-P, SYN-C and SEM trials together, or each violation
    against CORR (the legend says "classification accuracy of each violation type"), from the HGA of
    the responding electrodes of fig2b-violation-electrodes within each participant at each 10 ms
    sample (or in 100 ms windows), 5-fold stratified cross-validation (a standard choice), accuracy
    averaged over participants. Reproduced when, under every reading, the time of maximum accuracy
    lies in 360 to 770 ms (the range widened by 10% of each bound); not reproduced when it lies
    outside under every reading; blocked otherwise.
- id: suppfig10b-duration-differs
  statement: The total length of the significant difference from CORR differs between SYN-P, SYN-C and
    SEM electrodes.
  source: Results, paragraph 11; Supplementary Figure 10b legend
  quote: The discrepancy in terms of the total length of the significant difference between respect
    violation and correct sentence of each electrode (ANOVA). This also indicated temporal differences
    in processing each linguistic component
  statistics:
  - test: one-way ANOVA, two tailed
    p: 0.001
    p_relation: "<"
    corrected: Bonferroni
  depends_on:
  - fig2b-violation-electrodes
  criterion: For each electrode and each violation it passes V for, the total length of significant
    samples (times 10 ms). One-way ANOVA of these lengths across SYN-P, SYN-C and SEM, and pairwise
    one-way ANOVAs Bonferroni-corrected for three pairs (the paper does not say what is corrected;
    the three pairs are read). Reproduced when the three-group ANOVA has p < 0.001 and at least one
    corrected pair has p < 0.001 under every reading of E and V; the group medians are reported.
- id: nl-low-frequency
  statement: In the non-linguistic task, the violation enhances activity mainly at lower frequencies
    (4 to 10 Hz), where many electrodes respond to both linguistic and non-linguistic tasks, unlike
    the high-gamma band.
  source: Results, paragraph 3; Supplementary Figures 4 and 7c
  quote: In contrast, in the NL task, the violation condition showed an enhanced activity mainly at the
    lower frequency (Supplementary Fig. 4), indicating that neural oscillations during linguistic and NL
    tasks may arise in different frequency bands.
  criterion: Needs the 4 to 10 Hz amplitude, which a high-gamma dataset does not hold. If the broadband
    signal is present, the test of V for NL-VIO against NL-CORR at P < 0.01 corrected (Supplementary
    Fig. 4b) on the 4 to 10 Hz amplitude and on HGA; reproduced when more electrodes pass at 4 to 10 Hz
    than in high gamma. The measure of Supplementary Fig. 4a (peak power during NL-VIO against peak
    power during NL-CORR, per electrode and band) is shown with it.
- id: stimuli-word-frequency
  statement: Keyword frequencies are matched between CORR (shared by SYN-P and SEM; mean 31.88 per
    million) and SYN-C (30.25 per million).
  source: Methods, The Chinese language and stimuli design, paragraph 3
  quote: the word frequencies were matched between CORR (same in SYN-P and SEM, mean frequency = 31.88
    per million, s.d. = 35.14) and SYN-C (mean frequency = 30.25 per million, s.d. = 73.58) (t(62) =
    0.11, P = 0.91)
  data: with_inputs
  statistics:
  - test: t-test
    statistic: t(62) = 0.11
    p: 0.91
    n: 32 CORR and 32 SYN-C keywords
  expected:
  - {quantity: CORR keyword mean frequency, value: 31.88, tolerance: 3.188, unit: per million}
  - {quantity: SYN-C keyword mean frequency, value: 30.25, tolerance: 3.025, unit: per million}
  criterion: Keywords from the supplement's sentence lists (word 4 of CORR and SYN-C), frequencies from
    the corpus the paper names (lingua.mtsu.edu/chinese-computing, the Modern Chinese word frequency
    list). Reproduced when both means are within tolerance and an independent two-sample t-test gives
    p > 0.05.
