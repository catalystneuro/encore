# Claims for Zhu, Xu, Lu, Hu et al. (2022), Nature Human Behaviour 6, 1104-1111, on dandiset 001193.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-22, under
# docs/protocol.md, version pilot-10.
#
# Text read: the version of record (paper/10.1038-s41562-022-01334-6.txt, from the publisher PDF
# supplied by hand), with main text, figure legends, Methods and reporting summary, and the
# Supplementary Information PDF (Supplementary Table 1, Supplementary Figures 1 to 10 and the list of
# stimulus sentences). The Supplementary Excel file and the Source Data named in the paper were not
# supplied; nothing below needs them except where said. Figure panels were not viewed (the PDF could
# not be rendered here), so numbers printed only inside panels (the region counts of the Fig. 2b Venn
# diagram) are not used.
#
# Code. The paper links no code: "The completely developed code that operates on the full data set
# will be made available from the authors upon reasonable request" (Code availability). No repository
# was read. Every method detail below is from the Methods, the figure legends or the supplement.
#
# Which dataset. The dandiset's title and description say it holds high-gamma (70-150 Hz) ECoG activity
# from the paper's syntactic and semantic tasks in the inferior frontal gyrus, in NWB. Claims that need
# other frequency bands (Fig. 1b, Supplementary Figs. 3, 4 and 7c) cannot be tested on high-gamma alone.
#
# Data the paper used (Results, paragraph 1; Methods, Participants, Stimuli design, Neural data
# acquisition; Supplementary Table 1).
# - Subjects. Ten native Mandarin speakers (4 male, 6 female, 19 to 50 years) in awake brain tumour
#   surgery at Huashan Hospital. Two 128-channel high-density grids each (256 electrodes), over the
#   left IFG and the left MFG or STG. Analyses use IFG electrodes only.
# - Task. Written Chinese sentences, one word at a time: 800 ms fixation, 500 ms blank, each word 400 ms
#   with a 100 ms interval; then a correctness judgement by button press (up to 3 s). Four blocks,
#   each sentence shown once in random order. Conditions, 32 sentences each (supplement list): CORR
#   (correct, 6 words), SYN-P (degree adverb before the object noun, 7 words), SYN-C (object noun
#   replaced by an adjective, 6 words), SEM (verb's selectional restriction violated, 6 words), all ten
#   participants. COM (SYN-P and SEM combined, 7 words), participants given in the text only as "five
#   participants". NL, the other five: sequences of geometric shapes, changed (NL-VIO) or not (NL-CORR),
#   with the number of shapes matched to the number of words. The keyword is the first object noun
#   (the adjective in SYN-C): word 4 in CORR, SYN-C and SEM, word 5 in SYN-P and COM.
# - Signals. TDT recording at 3,052 Hz, reference on the skull at Cz; bad channels and bad intervals
#   excluded; downsampled to 400 Hz, notch at 50, 100, 150 Hz, common average reference per bank of 64
#   channels. High-gamma activity (HGA), the first principal component of Hilbert amplitudes in eight
#   bands from 70 to 150 Hz, downsampled to 100 Hz and z-scored within each block. Electrode
#   coordinates on the MNI152 template and FreeSurfer anatomical labels.
# - Behaviour. Button responses and response times (Supplementary Fig. 2b, 2d).
#
# Shared method. Criteria refer to these by letter. Each detail is from the place cited; a detail the
# paper does not fix is named as open, with the readings its text allows, and the criterion holds when
# all readings give the same outcome (otherwise the claim is blocked as methods_underspecified).
# H, signal. The dataset's HGA. If it is not already z-scored within each block, z-score it so
#   (Methods, Frequency component extraction, paragraph 2). Trials are aligned to keyword onset as T0
#   (Methods, ERP amplitude), from the event times the dataset gives.
# E, responsive IFG electrodes. Electrodes labelled pars opercularis or pars triangularis (FreeSurfer
#   labels) whose response differs between resting state and stimuli by a one-way ANOVA (scipy
#   f_oneway) at p < 0.01 (Methods, Electrode selection). Fig. 3d also includes precentral electrodes
#   ("n = 106, electrodes in pars opercularis, pars triangularis and precentral"); E+ is E with the
#   precentral gyrus added. Open, (E1) what "resting state" is: (a) the 800 ms fixation before the
#   sentence, or (b) the fixation and the 500 ms blank (1,300 ms); the stimulus period is the sentence's
#   word presentation. (E2) what is compared: per trial the mean HGA in the rest period against per
#   trial the mean HGA in the stimulus period, the trials of all linguistic conditions pooled (the NL
#   task for NL electrodes). No uncorrected or corrected alternative is named; p < 0.01 as printed.
# V, violation electrodes. An electrode of E is a SYN-P, SYN-C or SEM (or COM) electrode when its HGA
#   for that violation is reliably higher than for CORR: at each 10 ms sample after T0, a one-way ANOVA
#   (f_oneway) over trials of the violation against CORR, two-tailed, p < 0.05/256 (Bonferroni for the
#   256 electrodes of a participant), significant for more than 50 ms, with amplitude above 0.55 z
#   (Methods, Electrode selection, paragraph 3; ERP amplitude; Results, paragraph 5). The violation
#   mean must be above the CORR mean at the significant samples ("reliably higher"). Open, (V1) "more
#   than 50 ms" as (a) a run of at least 6 consecutive significant samples, or (b) at least 6
#   significant samples in total, or (c) a run spanning more than 50 ms from its first to its last
#   sample (at least 7 consecutive samples); (V2) "> 0.55 z score in amplitude" as (a) the violation's mean HGA
#   above 0.55 z at some significant sample, or (b) the violation minus CORR difference above 0.55 z at
#   some significant sample. The window is 0 to 1,000 ms after T0, the extent of every keyword-locked
#   figure (Fig. 1e, 2a, 3b, 3c); the paper names no other.
# F, F value. The F statistic of the one-way ANOVA of the violation against CORR for an electrode
#   (Fig. 2b legend). An electrode "strongly responded" to a violation when F > 4 (Results, paragraph
#   5). Open, (F1) the maximum F over samples 0 to 1,000 ms; (F2) the mean F over the electrode's
#   significant samples; (F3) the F of the trial-wise mean HGA over 0 to 1,000 ms.
# L, latencies. Onset, peak and offset are the times at which 10%, 50% and 90% of the area of the
#   keyword-locked mean response is reached (fractional area latency; Methods, ERP amplitude). Open,
#   (L1) the response is (a) the violation's trial-mean HGA or (b) the violation minus CORR difference;
#   (L2) the area is taken over (a) 0 to 1,000 ms or (b) the electrode's discriminating period (its
#   significant samples under V, first to last); (L3) negative values are (a) set to zero or (b) kept.
#
# Data. Every claim uses the dataset alone unless it says otherwise. The paper uses no outside data,
# except the word frequency corpus of the stimulus check (lingua.mtsu.edu/chinese-computing).
schema_version: 2
dataset:
  archive: dandi
  id: "001193"
paper: doi:10.1038/s41562-022-01334-6
claims:
- id: participants
  statement: Ten participants (four male, six female, 19 to 50 years) were recorded with two
    128-electrode grids each; all ten did the CORR, SYN-P, SYN-C and SEM conditions, five of them the
    combined violation (COM) and the other five the non-linguistic task (NL).
  source: Methods, Participants, paragraph 1, and The Chinese language and stimuli design, paragraph 3;
    Supplementary Table 1
  quote: This study included ten participants (age range, 19–50 years; four males, six females) ...
    All the ten participants performed under CORR, SYN-P, SYN-C and SEM conditions. Five participants
    performed under COM and the other five performed under NL conditions.
  expected:
  - {quantity: participants, value: 10, tolerance: 0}
  - {quantity: male participants, value: 4, tolerance: 0}
  - {quantity: female participants, value: 6, tolerance: 0}
  - {quantity: participants with COM, value: 5, tolerance: 0}
  - {quantity: participants with NL, value: 5, tolerance: 0}
  - {quantity: electrodes per participant, value: 256, tolerance: 0}
  criterion: Counts of distinct subjects in the dataset, their sex, and the tasks each has. Tolerance
    zero, as these are counts the paper gives exactly. Reproduced when all match; partially reproduced
    when the dataset holds a subset of the participants with matching metadata. Ages are compared with
    Supplementary Table 1 (30, 39, 19, 30, 50, 34, 42, 36, 40, 31 for participants 1 to 10) where the
    dataset gives them.
- id: task-structure
  statement: Each of the CORR, SYN-P, SYN-C, SEM and COM conditions has 32 sentences, with six words per
    sentence in CORR, SYN-C and SEM and seven in SYN-P and COM, each word shown for 400 ms with a 100 ms
    interval after an 800 ms fixation and a 500 ms blank.
  source: Methods, The Chinese language and stimuli design, paragraph 4; Supplementary Information,
    stimulus sentence lists
  quote: Each trial started with an 800 ms fixation followed by a 500 ms blank screen, and then each
    word of the sentence (or geometric shape) was displayed for 400 ms, with a 100 ms interstimulus
    interval. There were six words per sentence in the CORR, SYN-C and SEM conditions and seven words
    in the SYN-P and COM conditions.
  expected:
  - {quantity: sentences per condition, value: 32, tolerance: 0}
  - {quantity: words per sentence in CORR SYN-C and SEM, value: 6, tolerance: 0}
  - {quantity: words per sentence in SYN-P and COM, value: 7, tolerance: 0}
  - {quantity: word duration, value: 400, tolerance: 10, unit: ms}
  - {quantity: word onset to next word onset, value: 500, tolerance: 10, unit: ms}
  criterion: The 32 sentences per condition are read from the numbered lists in the supplement (no
    sentence of the text gives the count). Per participant, the number of trials of each condition
    (before bad-interval exclusion, where the dataset says which were excluded) and the word timing
    from the event times. The timing tolerance of 10 ms is one sample of the 100 Hz HGA. Reproduced
    when every count matches and the timings are within tolerance in every participant; partially
    reproduced when they do in some.
- id: behaviour-response-time
  statement: Most participants responded fast and accurately in the linguistic task, most response times
    lying around 0.5 to 1.0 s.
  source: Results, paragraph 1; Supplementary Figure 2b legend
  quote: Most of the responding time is around 0.5-1.0 second.
  expected:
  - {quantity: lower bound of the usual response time, value: 0.5, tolerance: 0.05, unit: s}
  - {quantity: upper bound of the usual response time, value: 1.0, tolerance: 0.1, unit: s}
  criterion: Response times of the linguistic trials of all ten participants pooled, measured from the
    onset of the question as the dataset times it. The paper gives no measure of "most"; the reading
    taken is that more than half of the response times lie in the range widened by 10% of each bound
    (0.45 to 1.1 s), and no other is named in the text. Accuracy is reported (proportion of correct
    judgements per participant) but has no number to match. Reproduced when more than half lie in the
    range.
- id: fig1b-high-gamma-best-band
  statement: High-gamma components above 70 Hz classify the linguistic conditions with the highest
    accuracy (above 80%), and the evoked responses are more prominent in the 70 to 150 Hz band than in
    other bands.
  source: Results, paragraph 3; Figure 1b; Supplementary Figure 3a to 3e
  quote: Results showed that high-gamma (HG) components (>70 Hz) discriminated conditions with the
    highest accuracy (>80%, Fig. 1b and Supplementary Fig. 3a) and ERPs were more prominent in the HG
    band (70–150 Hz) compared with other frequency bands
  expected:
  - {quantity: best classification accuracy, value: 0.8, tolerance: 0.08}
  criterion: Needs the broadband signal, from which the analytic amplitude of bands from 0 to 150 Hz in
    10 Hz steps is taken as the first principal component across band-passes, and classified with the
    SVM, logistic regression and k-nearest-neighbour settings of the Methods (Frequency component
    extraction) into correct, syntactic violation, semantic violation and resting state. If the dataset
    holds only high-gamma activity, as its description says, the claim cannot be tested. Otherwise,
    open, the cross-validation and the features (time samples of the band amplitude in the keyword
    window). The paper reports the band accuracies for the SVM (Fig. 1b legend) and for logistic
    regression (Supplementary Fig. 3a legend) only; reproduced when, under both, a band with lower
    bound at or above 70 Hz gives the highest accuracy and, for the SVM, it exceeds 0.72 (80% less
    the tolerance). The kNN result is shown as a variant. The ERP part is judged from the measure of
    Supplementary Fig. 3d (the peak power during violation against the peak power during CORR, per
    responding electrode), and holds when the mean difference is largest in the 70 to 150 Hz band.
- id: fig1c-responsive-in-ifg
  statement: Most electrodes showing enhanced activity to linguistic stimuli lie in the IFG.
  source: Results, paragraph 3; Figure 1c; Supplementary Figure 3f
  quote: Most of the electrodes showing enhanced activities to linguistic stimuli were located in the
    IFG
  criterion: The rest against stimulus test of E (with readings E1a and E1b) applied to every electrode
    of every participant, regardless of location, with HGA higher during stimuli. Reproduced when more
    than half of the responsive electrodes carry an IFG label. Open, which labels form the IFG, (a)
    pars opercularis and pars triangularis, the labels of E, or (b) these and pars orbitalis.
- id: fig1d-only-after-keyword
  statement: The enhanced activity for violation conditions relative to CORR appears only after the
    keyword.
  source: Results, paragraph 3; Figure 1d
  quote: In the linguistic task, the enhanced activity of violation conditions relative to CORR was only
    observed after the keywords, indicating that the responses were highly linked to the violation
    manipulations (Fig. 1d).
  depends_on:
  - fig2b-violation-electrodes
  criterion: A claim of absence before the keyword, judged on the paper's test, the test of V (the
    discriminating period of Fig. 1e and the ERP amplitude Methods), applied to the electrodes of E
    over the sentence before the keyword, aligned to the first word (words 1 to 3, 0 to 1,500 ms).
    Reproduced when no electrode and condition pair passes V before the keyword; not reproduced when
    any does. The count of passing pairs, before and after the keyword, is reported either way. The
    SEM verb (word 2) differs from the CORR verb; the test without SEM samples 500 to 1,000 ms is
    shown as a variant.
- id: fig2b-violation-electrodes
  statement: 58 IFG electrodes respond to at least one violation type more strongly than to correct
    sentences.
  source: Results, paragraph 5; Figure 2b
  quote: we defined a significant effect in each electrode if its response to a certain type of
    violation was reliably enhanced compared with the CORR condition for more than 50 ms (P < 0.05,
    ANOVA, two tailed, Bonferroni correction for the number of electrodes, n = 256 for each
    participant); there were 58 electrodes satisfying this criterion
  expected:
  - {quantity: electrodes passing V for any of SYN-P SYN-C and SEM, value: 58, tolerance: 5.8}
  criterion: Electrodes of E (readings E1a, E1b) passing V (readings V1a, V1b, V2a, V2b) for at least
    one of SYN-P, SYN-C and SEM, over the ten participants. Reproduced when the count is within
    tolerance under at least one combination of readings (a count that a reading can move is a
    reported number read in more than one way, so any reading may match); not reproduced when none
    is. The count under every combination is reported.
- id: fig2b-single-type
  statement: Most responding electrodes (49 of 58) respond strongly to only one violation type; few (9
    of 58) are co-activated by two types, mainly SYN-P and SYN-C.
  source: Results, paragraph 5; Figure 2b
  quote: We found that most of the electrodes (49 of 58) strongly responded to only one type of
    violation (Fig. 2b, one-way ANOVA F statistic > 4). Only a few electrodes were co-activated by two
    violation types (9 of 58) and were mainly co-activated by SYN-P and SYN-C
  expected:
  - {quantity: electrodes strongly responding to one type, value: 49, tolerance: 4.9}
  - {quantity: electrodes co-activated by two types, value: 9, tolerance: 0.9}
  depends_on:
  - fig2b-violation-electrodes
  criterion: Among the electrodes of fig2b-violation-electrodes, an electrode strongly responds to a
    violation when its F (readings F1, F2, F3) exceeds 4. Counts of electrodes strongly responding to
    exactly one, and to two, of the three types. Reproduced when, under one combination of readings,
    both counts are within tolerance and the SYN-P and SYN-C pair is the most frequent pair among the
    co-activated electrodes; partially reproduced when the single-type electrodes are a majority and
    SYN-P with SYN-C is the most frequent pair, but the counts are outside tolerance under every
    reading. The 10% tolerance on 9 is below one electrode, so the second count must match exactly.
- id: suppfig6a-half-split
  statement: When half of the sentences select the responding electrodes and the other half are
    analysed, most electrodes (46 of 62) still respond to one violation type only and 16 of 62 to two,
    mainly SYN-P and SYN-C.
  source: Results, paragraph 5; Supplementary Figure 6a legend
  quote: We used first half sentences to identify the linguistic responding electrodes and used the
    remaining sentences for further analysis, to resolve non-independence issue. We found that most of
    the electrodes (46/62) strongly responded to only one type of violation (below figure). Only a few
    electrodes were ... by two violation types (16/62) and were mainly ... by SYN-P and SYN-C
  expected:
  - {quantity: responding electrodes, value: 62, tolerance: 6.2}
  - {quantity: electrodes responding to one type, value: 46, tolerance: 4.6}
  - {quantity: electrodes co-activated by two types, value: 16, tolerance: 1.6}
  criterion: As fig2b-violation-electrodes and fig2b-single-type, with E and V computed on the trials of
