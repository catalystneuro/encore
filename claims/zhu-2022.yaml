- id: fig2c-euclidean-similarity
  statement: The response time courses of SYN-P and SYN-C are more similar (Euclidean distance 48.43)
    than those of the syntactic and semantic conditions (62.17).
  source: Results, paragraphs 5 and 6; Figure 2c
  quote: the similarity between SYN-P and SYN-C (Euclidean distance, 48.43) was greater than that
    between syntactic and semantic conditions (Fig. 2c, Euclidean distance, 62.17)
  expected:
  - {quantity: Euclidean distance SYN-P to SYN-C, value: 48.43, tolerance: 4.843}
  - {quantity: Euclidean distance syntactic to semantic, value: 62.17, tolerance: 6.217}
  depends_on:
  - fig2b-violation-electrodes
  criterion: Distances computed with scipy's hierarchical clustering on Euclidean distance (Methods,
    Electrode selection, paragraph 3), between condition vectors built from the responding electrodes
    of fig2b-violation-electrodes. Open, (a) each condition's vector is the trial-mean HGA from 0 to
    1,000 ms of every responding electrode, concatenated over electrodes; (b) the trial-mean HGA time
    course from 0 to 1,000 ms averaged over the responding electrodes (the Methods call it a
    "time-course similarity", so a reading without time is not allowed); and the "syntactic to
    semantic" distance read as (i) SEM to SYN-P, (ii) SEM to SYN-C, (iii) the mean of the two, or (iv)
    the linkage height at which SEM joins the SYN-P and SYN-C cluster. Fig. 2c's y axis is a "relative
    distance", so absolute values depend on the vector. Reproduced when, under every reading, the
    syntactic to semantic distance is larger than SYN-P to SYN-C, and under at least one reading both
    values are within tolerance; partially reproduced when the order holds under every reading but no
    reading matches the values; not reproduced when the order fails under every reading; blocked
    otherwise. The values under each reading are reported.
- id: suppfig7a-com-overlap
  statement: Of the electrodes responding to the combined violation (COM), 78.3% also respond to SYN-P
    but only 26.1% to SEM.
  source: Results, paragraph 6; Supplementary Figure 7a
  quote: for the electrodes responding to the combined violation condition (COM), 78.3% of them also
    showed enhanced activity to the syntactic violation (SYN-P), but only 26.1% of them responded to the
    semantic violation (SEM)
  expected:
  - {quantity: COM electrodes also responding to SYN-P, value: 0.783, tolerance: 0.0783}
  - {quantity: COM electrodes also responding to SEM, value: 0.261, tolerance: 0.0261}
  criterion: In the five participants with COM, electrodes of E passing V for COM against CORR (COM
    keyword at word 5, as in SYN-P). Fractions of those that also pass V for SYN-P, and for SEM. Open,
    whether "responded" to SYN-P and SEM means passing V or having F > 4 (F1 to F3), as Supplementary
    Fig. 7a plots F values. The smallest count the two percentages fit is 18 and 6 of 23 electrodes
    (an inference; the paper gives no count), so the 10% tolerance on 26.1% is below one electrode
    there. Reproduced when both fractions are within tolerance under one reading;
    partially reproduced when, under every reading, the SYN-P fraction exceeds the SEM fraction but
    the values are outside tolerance.
- id: suppfig7b-not-nonlinguistic
  statement: The electrodes responding to linguistic violations do not respond to the non-linguistic
    violation in the high-gamma band.
  source: Results, paragraph 6; Supplementary Figure 7b and 7c legend
  quote: at 70 -150 Hz, the linguistic responding electrodes were almost completely not responding to
    the non-linguistic task
  depends_on:
  - fig2b-violation-electrodes
  criterion: A claim of absence. In the five NL participants, the electrodes of fig2b-violation-electrodes
    tested for NL-VIO against NL-CORR with the test of V, NL trials aligned to the onset of the shape
    in the keyword's position. The paper's NL test is a one-way ANOVA at P < 0.01, corrected
    (Supplementary Fig. 4b); the threshold read is 0.01/256 per sample, with 0.05/256 (the linguistic
    test) as a variant. "Almost completely not" is read as at most 5% of those electrodes passing, the
    rate a test at the paper's alpha allows. Reproduced when no more than 5% pass; not reproduced
    otherwise. The count and the electrodes' NL-VIO minus NL-CORR differences are reported either way.
- id: fig2de-no-spatial-separation
  statement: Across participants, the activation centres and epicentres of the SYN-P, SYN-C and SEM
    electrodes are not spatially separated in the IFG.
  source: Results, paragraph 7; Figure 2d and 2e; Supplementary Figure 8a
  quote: Unlike the result at the electrode level, we failed to observe a tendency of spatial
    separation for the activation centre of syntactic and semantic conditions. Likewise, the epicentre
    of these responses failed to show separations using a permutation test of the clusters of electrodes
    (Fig. 2e).
  depends_on:
  - fig2b-violation-electrodes
  criterion: A claim of absence, judged on the paper's test, a non-parametric permutation test of the
    spatial segregation among SYN-P, SYN-C and SEM electrodes on the MNI152 template (Methods, Spatial
    organization). The Methods do not give the statistic or the permutation scheme. Readings, (a) for
    each pair of conditions, the distance between the mean MNI coordinates of their electrodes; (b)
    the distance between the peaks of their kernel density estimates (bandwidth 20, as the Methods
    give, in mm); in both, condition labels permuted among the electrodes of the pair 1,000 times (the
    permutation count the Methods give for ALE), two-sided, p < 0.05. Co-activated electrodes count in
    each of their conditions. Reproduced when no pair is significant under every reading; not
    reproduced when a pair is under every reading; blocked otherwise. The distances are reported. The
    ALE analysis (GingerALE) is not repeated.
- id: suppfig8b-individual-no-separation
  statement: Even within individual participants the SYN-P, SYN-C and SEM electrodes show no clear
    spatial separation.
  source: Results, paragraph 7; Supplementary Figure 8b
  quote: However, even at the individual level, we were unable to obtain a clear separation pattern
    (Supplementary Fig. 8b).
  depends_on:
  - fig2b-violation-electrodes
  criterion: The paper shows one representative participant and reports no test. The test of
    fig2de-no-spatial-separation, reading (a), run per participant on native or MNI coordinates, for
    pairs of conditions with at least three electrodes each (a standard minimum, not the paper's). A
    claim of absence, reproduced when no participant has a pair significant at p < 0.05 uncorrected;
    not reproduced otherwise. The number of participants with a significant pair is reported.
- id: fig2f-circuit-diameter
  statement: From the fraction of co-activated electrodes, the diameter of the functional circuits is
    estimated as no greater than about 3.25 mm.
  source: Results, paragraph 8; Figure 2f; Methods, Functional circuit size estimation
  quote: The results showed that the diameter of functional circuits was no greater than ~3.25 mm (Fig.
    2f)
  expected:
  - {quantity: functional circuit diameter, value: 3.25, tolerance: 0.325, unit: mm}
  depends_on:
  - fig2b-single-type
  criterion: The Methods give p(co-activation) = 1 - (r - 0.5 mm)/r for an electrode of radius 0.5 mm
    and a circuit of diameter r, so r = 0.5 mm / p. p is the fraction of co-activated electrodes from
    fig2b-single-type (9 of 58 gives 3.22 mm, matching the paper's 15.6% and 3.25 mm on Fig. 2f).
    Reproduced when r from the dataset's fraction is within tolerance under a reading that also
    reproduces fig2b-single-type, or under any reading if none does.
- id: suppfig9-predict-from-corr
  statement: Electrode types (SYN-P, SYN-C, SEM, non-responding) can be predicted from responses to
