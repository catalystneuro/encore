- id: suppfig6b-duration-metric
  statement: When the length of the period differing from CORR is used in place of amplitude, most
    electrodes (61 of 79) respond to one violation type only and 18 of 79 to two, mainly SYN-P and SYN-C.
  source: Results, paragraph 5; Supplementary Figure 6b legend
  quote: We found that most of the electrodes (61/ 79) strongly responded to only one type of violation
    (below figure). Only a few electrodes were ... by two violation types (18/79) and were
    mainly ... by SYN-P and SYN-C
  expected:
  - {quantity: responding electrodes, value: 79, tolerance: 7.9}
  - {quantity: electrodes responding to one type, value: 61, tolerance: 6.1}
  - {quantity: electrodes co-activated by two types, value: 18, tolerance: 1.8}
  criterion: The paper does not say how 79 electrodes are selected or what length counts as a response.
    Readings, (a) electrodes of E with a significant period (V, without the amplitude rule V2) of more
    than 50 ms for a violation count as responding to it; (b) as (a) with the amplitude rule kept. The
    length of an electrode's significant period is the number of significant samples times 10 ms.
    Reproduced when, under one reading (crossed with V1a and V1b), all three counts are within
    tolerance and SYN-P with SYN-C is the most frequent pair; partially reproduced when the single-type
