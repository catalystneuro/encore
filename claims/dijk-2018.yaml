claims:
- id: fig1-single-field-proportion
  statement: Most place cells had a single place field in the first standard session (64% of
    DG and 75% of CA place cells), with no significant difference between the regions.
  source: Results, DG Place Field Remapping across a Modified Environment, paragraph 2
  quote: The majority of DG (64%) and CA (75%) place cells had a single place field during the
    initial recording in the standard environment (test of proportions, z = 1.6, p = 0.1)
  statistics:
  - test: test of proportions
    statistic: z = 1.6
    p: 0.1
    n: 45 DG and 20 CA place cells
  expected:
  - quantity: DG place cells with one field, first standard session
    value: 64
    tolerance: 6.4
    unit: percent
  - quantity: CA place cells with one field, first standard session
    value: 75
    tolerance: 7.5
    unit: percent
  criterion: Fields counted on the room rate map (M2) of the first standard session under each
    place field reading of M5. The absence of a regional difference is judged on a two-sided
    two-sample z test of proportions at alpha 0.05. Reproduced when, under one M5 reading,
    both percentages are within tolerance and the test gives p >= 0.05; the result rests on
    the M5 assumption.
- id: fig1-field-number-scaling
