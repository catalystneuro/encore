# Claims for van Dijk & Fenton (2018), "On How the Dentate Gyrus Contributes to Memory
# Discrimination", Neuron 98, 832-845, on CRCNS hc-17.
#
# Provenance: written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub
# Actions"), 2026-11-10, protocol pilot-14 as stated in docs/protocol.md (Reader, steps 1 to 4).
#
# Text read: the version of record (paper/10.1016-j.neuron.2018.04.018.txt, supplied by a
# person, extracted from the PDF), the main text, figure legends, STAR Methods (e1 to e5) and
# the Supplemental Information (Figures S1 and S2 with legends, Tables S1 and S2). No figure
# was read from a PDF page. The CRCNS data descriptor (hc-17.data-description.txt) was read
# only to know which experiments the dataset holds; no claim comes from it.
#
# Code read: the Data and Software Availability section links
# https://github.com/FentonLab/Mcode_DG-MemoryDiscrimination-NeuronMS. At commit
# 3542a85bb44a1739425e63eb4d16f9dc30ce7f54 (2018-04-01, the only commit) it holds a one-line
# README and a file "vanDijkFenton2018Neuron-AnalysisCode" that is a macOS alias (a pointer to
# a folder on the authors' computer), not code. No analysis code could be read, so no method
# detail below is settled by code. Statistics were run in JMP 12 (STAR Methods).
#
# Data the paper used (Results; STAR Methods, Experimental model, Recording set up, Behavioral
# Procedures).
# - Environment manipulation experiment (Figure 1, Table S1). Results say 5 mice for DG (45
#   place cells of 133 cells) and 3 mice for CA (20 place cells, 7 CA3 and 13 CA1, of 42 cells);
#   Behavioral Procedures say seven implanted mice. Three versions of an environment: standard
#   (transparent 40-cm circular enclosure with three cards, inside a 50 x 50 cm box with one
#   card), rotated (cards on the enclosure rotated 90 degrees; called "relocated" in Figure 1),
#   removed (the square box alone). Comparisons: replication (standard-standard,
#   rotated-rotated, removed-removed), rotation or relocation (standard-rotated), removal
#   (standard-removed, rotated-removed).
# - Active place avoidance with recording (Figures 3 to 6, Table S2, Figure S2). Six wild-type
#   mice, 42 DG place cells of 113 cells and 21 putative DG interneurons; one mouse lost 6
#   place cells after training 2, so the conflict data are 36 place cells from 5 mice. One day,
#   90-min rests: two 20-min pretraining sessions (rotating arena, no shock); a 20-min training
#   session with shock, then a 20-min shock-off recording and a 5-min shock reminder; a 10-min
#   training 2 with shock, then a 20-min shock-off recording; a 20-min conflict session with
#   the 60-degree shock zone relocated 180 degrees, then a 20-min shock-off recording. Units
#   were recorded only in shock-off sessions. The shock zone is fixed in the room frame; the
#   arena rotates; spike positions exist in both room and arena frames.
# - Optogenetic behavior (Figure 2). POMC-Halorhodopsin Cre+ and Cre- littermates (14 Cre+ and
#   15 Cre- in all; cohort 1, 7 Cre+ and 8 Cre-, behavioral validation protocol; cohort 2, 7
#   Cre+ and 7 Cre-, recording protocol), with cFos counts. The data descriptor describes
#   wild-type recordings only; whether the dataset holds these data is the author's to find.
# - Measured variables: spike times of sorted single units by tetrode, position at 30 Hz from
#   two LEDs, at 1.5 cm per pixel for spatial analyses, cell class (place cell, non-spatial
#   principal cell, putative interneuron), session identity, shock zone location.
#
# Shared method, cited once here and named in the criteria by its label.
# M1 Cell classes. Units were classed as place cells, non-spatial principal cells or
#   inhibitory interneurons from waveform width, firing rate, rate map information content,
#   coherence and % active pixels (STAR Methods, Recording set up). No cut-offs are given, so
#   the classification cannot be rebuilt from the paper. The author uses the paper's own
#   class lists if the dataset holds them; claims that need classes and have no such list are
#   methods_underspecified. The k-means subclasses (granule, mossy, immature) are not used,
#   as the paper combined them (same section).
# M2 Rate maps. Spikes per pixel divided by time in the pixel, at 1.5 cm per pixel (STAR
#   Methods, Recording set up). Open, as no smoothing or minimum occupancy is given. Readings
#   (a) unsmoothed, every visited pixel; (b) unsmoothed, pixels with less than 0.67 s of
#   occupancy left out (the sampling threshold the Overdispersion section uses). For the
#   rotating arena, maps are made in the room frame and the arena frame (Firing rate
#   stability).
# M3 Stability. Fisher z of the Pearson correlation between corresponding pixels of two
#   maps, taking the maximum over shifts of one map by up to 2 pixels in x and y; on the
#   rotating arena the higher of the room-frame and arena-frame values; when a cell has
#   several pairs for one manipulation, their average (STAR Methods, Firing rate stability).
# M4 Rate remapping. The difference of a cell's mean rates in two sessions divided by the
#   larger of the two (Firing rate stability; Figure 6 inset axis "Δ(A,B)/max(A,B)"). Field
#   rate remapping uses the same ratio on the mean rate inside a field mask, the pixels of the
#   largest place field in the first session of the day. "Magnitude" (Figures 1C, 3D) is read
#   as the absolute value; the signed ratio is shown as a variant.
# M5 Place fields. The paper does not define a place field (no rate threshold, minimum size or
#   contiguity rule). Open; readings (a) a region of at least 9 edge-contiguous pixels whose
#   rate exceeds 20% of the map's peak; (b) the same with a fixed threshold of 1 AP/s. These
#   are standard choices, not the paper's; outcomes that rest on field counts or field masks
#   rest on an assumption.
# M6 Positional information. Ipos = |p(n|x) log2(p(n|x)/p(n))| per cell in 133-ms steps, with
#   p(n|x) the probability of n spikes in 133 ms at location x and p(n) the same regardless
#   of location, computed separately in room and arena frames; ensemble ΔIpos is the sum over
#   the ensemble's place cells of room Ipos minus the sum of arena Ipos at each step (STAR
#   Methods, Positional information). Open, the size of location x. Readings (a) the 1.5-cm
#   pixel (the stated spatial resolution of location-specific analyses); (b) 2 x 2 pixel
#   blocks (3 cm). The probabilities are taken over the session analysed.
# M7 Shock zone vicinity. Ipos (Figure 4D) uses times within 3 pixels (4.5 cm) of a shock zone
#   or in it (Positional information). Kendall correlations near zones (Figure 5E; Figure 6
#   uses the 4-s windows of M8 instead) use
#   times within 3 pixels (4.5 cm) of the zone but not in it (Cell pair spike train discharge
#   correlations). Network consistency near zones uses passes through firing fields in the
#   zone and its surrounding 6 cm, longer than 3 s (Network Consistency). The "training zone"
#   is the 60-degree room-frame sector shocked in training; the "conflict zone" is the sector
#   180 degrees away, shocked in conflict. Both vicinities are computed in every session,
#   pretraining included (Positional information).
# M8 Approach events. Local minima of the distance to the nearest edge of the shock zone. For
#   Ipos (Figure 4C) a minimum counts when it is closer than 50% of the animal's average
#   distance, and the Ipos values of the ~1 s before it are averaged per mouse (Positional
#   information). For correlations (Figure 6) a minimum counts when closer than 75% of the
#   average distance, and the 4 s before it are used; minima inside the zone are errors, the
#   others avoidances (Cell pair spike train discharge correlations; Figure 6A legend). Open,
#   how local minima are found. Readings (a) on the raw 30-Hz distance series; (b) after a
#   1-s moving average.
# M9 Kendall correlation. Kendall's tau between the spike counts of two cells in 133-ms bins
#   (20 and 250 ms for Figure S2) over a session, for every place cell pair and every place
#   cell-interneuron pair of an ensemble (Cell pair spike train discharge correlations). The
#   change across two sessions is the later minus the earlier tau, divided by the SD of six
#   tau values from the earlier session cut into six equal periods (same section; Figure 5A
#   legend). Open, the tau variant and empty bins; the standard choice is tau-b over all bins.
# M10 Standardized rates. For each 5-s episode in which the expected count (the sum over the
#   pass of the session rate map times time in each pixel) exceeds the cell's average rate,
#   z = (observed - expected)/sqrt(expected), using only pixels sampled more than 0.67 s;
#   overdispersion is the variance of z (STAR Methods, Overdispersion). Network consistency
#   for a pair on a pass through overlapping fields is NC = z1 z2 tau12 (Network Consistency).
#   Open, whether the 5-s episodes tile the session or are centered on field passes;
#   readings (a) consecutive non-overlapping 5-s windows; (b) 5-s windows centred on each
#   entry into a firing field.
# M11 Manipulations in the place avoidance task (Results, DG-dependent memory discrimination;
#   Figure 3C legend). Replication is pretraining 1 against pretraining 2 and training 1
#   against training 2; shock addition is pretraining against training; shock relocation is
#   training against conflict. The text says that shock addition and replication used both
#   training 1 and training 2. Open, which pairs form shock addition and shock relocation.
#   Readings (a) pretraining 2 against training 1, and training 2 against conflict (the
#   sessions next to each other in time); (b) every pretraining and training pair for
#   addition, and both training sessions against conflict for relocation, averaged per cell
#   as in M3. The paper's conclusions held with training 1 alone (same paragraph).
# M12 Statistics. One-, two- and three-way (repeated-measures) ANOVA; for non-normal data or
#   unequal variances, two-way ANOVA on ranks, Kruskal-Wallis or Welch's ANOVA; Fisher's LSD
#   post hoc; alpha 0.05, two-tailed; JMP 12 (STAR Methods, Quantification and Statistical
#   Analysis). Many reported F tests have fractional denominator df (for example F1,64.2),
#   which implies a mixed model fit by REML with a random subject term. Open, the random term.
#   Readings (a) mouse as a random effect; (b) cell, or cell pair, as a random effect nested
#   in mouse; (c) an ordinary ANOVA with observations as independent (which gives integer df).
#   The claim's df, where printed, show which design the paper used; the author takes the
#   reading whose df match and shows the others.
#
# Tolerances. A mean printed with its SEM takes 1.96 times that SEM. Other numbers take 10%
# of the value, or for percentages 10% of the percentage.
#
# Discrepancies inside the paper, noted in the claims they touch. Field counts in Results
# (DG 1.48 ± 0.19, CA 1.19 ± 0.28) and Table S1 (1.48 ± 0.10, 1.19 ± 0.07) give different
# SEMs. Results give 5 DG mice and 3 CA mice for Figure 1, the Methods seven mice. The Figure
# 1B legend prints the interaction without its F value. The overdispersion F tests give
# df 4189 and 1791 for training and conflict against 3169 for pretraining.
