    larger box after wall removal, more in DG (1.48 to 2.70) than in CA (1.19 to 2.0), with a
    condition effect, a region effect at p = 0.05 and no interaction; post hoc, removed DG
    exceeded circular DG and CA, and CA did not change.
  source: Results, DG Place Field Remapping across a Modified Environment, paragraph 2
  quote: The number of place fields scaled with the 2-fold increase in area from the circular
    (standard and cue-relocated environments) to the wall removal conditions, with the DG cells
    scaling more (DG circular, 1.48 ± 0.19 fields; removed, 2.70 ± 0.20 fields; CA circular,
    1.19 ± 0.28 fields; removed, 2.0 ± 0.30 fields
  statistics:
  - about: region
    test: two-way ANOVA (region by condition)
    statistic: F(1, 64.2) = 4.12
    p: 0.05
  - about: condition (circular against removed)
    test: two-way ANOVA (region by condition)
    statistic: F(1, 64.2) = 17.1
    p: 0.0001
  - about: region by condition interaction
    test: two-way ANOVA (region by condition)
    statistic: F(1, 64.2) = 0.67
    p: 0.42
  expected:
  - quantity: DG fields per place cell, circular environments
    value: 1.48
    tolerance: 0.37
  - quantity: DG fields per place cell, wall removed
    value: 2.7
    tolerance: 0.39
  - quantity: CA fields per place cell, circular environments
    value: 1.19
    tolerance: 0.55
  - quantity: CA fields per place cell, wall removed
    value: 2.0
    tolerance: 0.59
  criterion: Fields per cell by M5, averaged per cell over the circular sessions (standard and
    rotated) and over the removed sessions. A two-way region by condition mixed ANOVA under
    the M12 readings (the fractional df imply cell as a repeated measure). Reproduced when,
    under one M5 reading, the four means are within tolerance, the condition effect has
    p < 0.05 with more fields after removal, and the post hoc test (Fisher's LSD) puts removed
    DG above circular DG and circular CA and finds no difference between circular and removed
    CA (Results, same sentence). The SEMs differ in Table S1 (DG 0.10, CA 0.07); the Results values
    are used. The result rests on the M5 assumption.
