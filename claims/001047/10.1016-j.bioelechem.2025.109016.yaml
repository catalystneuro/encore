- id: fig5c-nuclear-yp-centre
  statement: In the central spot cells showed bright nuclear YP staining, indicating irreversible
    damage, while farther out reversibly electroporated cells were weakly stained with less contrast
    between nucleus and cytoplasm; cells inside the electrode footprint were unstained though present
    (Hoechst).
  source: Results 3.2, paragraph 1; Figure 5C
  quote: Indeed, a closer examination of the central spot confirmed bright YP staining of cell nuclei
    ( Fig. 5C , zone 1), which is indicative of the irreversible membrane damage and cell death.
    Reversible electroporation is distinguished by a much weaker YP staining and smaller difference
    in staining of the nucleus and cytoplasm, such as in zones 2 and 3 in Fig. 5C .
  criterion: Set S2 at 0 mm. Zone locations are shown only in Figure 5A, not seen. Zone 3 straddles
    an electrode wall (Results 3.2, its right portion lies inside the footprint; Figure 5C legend,
    dotted lines mark the wall), so its outside part is the band within 0.5 mm outside a wall, and
    the footprint is inside the wall. Zone 1 is in the central spot and zone 2 is not placed by the
    text; readings, zone 1 within 1 mm of the centre, zone 2 (a) 2 to 4 mm, (b) 3 to 5 mm from the
    centre along a diagonal. Nuclei are Hoechst-positive objects (Otsu threshold,
    a standard choice); the cytoplasm is a ring around each nucleus, readings (a) 2 to 4 um, (b) 4 to
    8 um. Reproduced when, under every reading, median nuclear YP in zone 1 exceeds that in zones 2
    and 3, the median nucleus to cytoplasm YP ratio is higher in zone 1, footprint YP is below zones
    2 and 3, and the footprint has Hoechst-positive nuclei. Blocked when the dataset lacks
    full-resolution Hoechst and YP images of these wells.
- id: fig6b-900ns-peak-not-significant
  statement: The central YP peak was highest for 900-ns pulses, but not significantly different from
    300- or 600-ns pulses.
  source: Results 3.3, paragraph 2; Figure 6B
  quote: The central peak of YP uptake was higher for 900-ns pulses, but the difference from the other
    two pulse durations was not statistically significant (CT26 cells, 2 bursts (x4), Fig. 6B ).
  criterion: A claim of absence, judged on the paper's test. Set S3, F1 to F3, O2; per experiment YP at
    x = 0. Two-sided t tests of 900 ns against 300 ns and against 600 ns, Bonferroni over the two
    (F7). The paper does not say whether Bonferroni covers these two comparisons or all three pairs;
    both are run. Reproduced when the 900-ns mean is the highest and no corrected p is below 0.05;
    not reproduced when one is. Effect sizes are reported.
- id: fig6c-normalized-decline-similar
  statement: Normalized to the central peak, the sideways decline of YP was similar for the three
    pulse durations.
  source: Results 3.3, paragraph 2; Figure 6C
  quote: When the peak YP emission was taken as 100%, its decline sideways was similar for the three
    tested pulse durations ( Fig. 6C ).
  criterion: Set S3, F1 to F3, O1, O2, each profile in percent of its value at x = 0 (Methods 2.5;
    Figure 6C legend, the same data normalized to the peak). Whether each experiment or each mean is
    normalized is not given; readings (a) each experiment, then mean +/- s.e., (b) the mean profile,
    with s.e. scaled by the same factor. Judged by the paper's error-bar rule (F8). Reproduced when,
    under every reading, no distance has two durations whose means differ by a gap larger than the
    error bars.
- id: fig6d-fwhm-falls-with-duration
  statement: Longer pulses focused electroporation into a smaller spot; the FWHM fell with pulse
    duration (slope p = 0.003), 600- and 900-ns pulses differed from 300 ns, and 900-ns packets gave
