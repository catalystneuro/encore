# Claims for Silkuniene, Silkunas, Pakhomova, Semenov & Pakhomov (2025), Bioelectrochemistry 166,
# 109016, on dandiset 001047.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-22, under
# docs/protocol.md version pilot-10, as the reader.
#
# Text read. The NIH author manuscript (NIHMS2087238, PMC12331426) as served by PMC: abstract, main
# text, Materials and methods, Results, Discussion and figure legends (Figures 1 to 7), in
# paper/10.1016-j.bioelechem.2025.109016.txt. PMC lists no supplement and the text cites none. The
# version of record was not read. There is no PDF, so Figures 1 to 7 were not seen; values shown only
# in a figure (the packet rates tested, the burst numbers, the measured distances, per-group means)
# are not known here and no claim rests on reading them from a figure.
#
# Code. The paper links no code; its Data availability says "Data will be made available on
# request". It names the software: MetaMorph 7.8.13 for intensities, RStudio, Excel and Grapher 16
# for processing, fits and plots, Sim4Life Lite 7.0.1.8169 for the field. No repository was read, so
# no method detail below is settled by code.
#
# The dandiset. Its title on DANDI (version 0.250701.1609) is "Optimizing NG-CanCan Protocol Delivery
# with MHz Compression to Minimize Near-Electrode Ablation", species house mouse and Chinese hamster,
# and it names this paper (IsPublishedIn). It is taken to hold the monolayer images of this paper (CT26
# are mouse cells, CHO hamster cells). Whether it holds the thermometry images (Figure 2) is the
# author's to find.
#
# Data the paper used. CT26 mouse colon carcinoma and CHO-K1 cell monolayers in 6-well plates. Four
# hollow 2.8-mm needle electrodes in a square with 15.3-mm diagonals, touching the monolayer or raised
# 1 or 2 mm above it. Packets of 16 pulses (Figure 1B), first pulse 7.2 kV, later pairs 12.5% lower
# per phase; 9 packets per burst, bursts at 1 Hz, applied from 4 directions ("2 bursts (x4)" is 8
# bursts). Controls deliver only the first pulse of each packet. Measured variables are stitched
# whole-well images taken with a 4x objective: Hoechst 33342 (DAPI cube) before exposure, YO-PRO-1
# (YP, FITC cube) 30 min after exposure, and for killing experiments propidium (Pr, Cy3 cube) 2 h
# after, with Hoechst re-imaged. Experiment sets: (S1) CT26, 600-ns pulses, 2 bursts (x4), packet
# rate 1 Hz to 0.208333 MHz (packets with no interval; "0.2 MHz") and control, n = 3 per CANCAN rate
# and n = 5 controls (Figures 3, 4), with one subset also measured parallel to the array sides
# (Figure 3C); (S2) CT26, 0.2 MHz, 2 bursts (x4), electrodes at 0, 1 or 2 mm, YP n = 6 to 7 and Pr n
# = 4 to 5 (Figure 5); (S3) CT26, packets of 300-, 600- or 900-ns pulses with no interval, 18, 9 or
# 6 packets per 43.2-us burst, 2 bursts (x4), n = 5 each (Figure 6); (S4) CT26 (n = 3 to 5) and CHO
# (n = 4), 0.2 MHz, several burst numbers up to 6 bursts (x4) (Figure 7); (S5) thermochromic film
# images after 2 and 6 bursts at 0.2 MHz without rotation (Figure 2). The text names the rates 1 Hz,
# 1 kHz, 10 kHz and 0.2 MHz; the log fit over 1 Hz to 10 kHz has n = 15 at n = 3 per rate, so five
# rates were tested up to 10 kHz, plus 0.2 MHz.
#
# Method details fixed from the paper, used by the criteria.
# (F1) Intensity is the mean YP (or Pr) emission in 325 x 406 um ROIs placed along the diagonals of
# the square, joining the electrode footprints, at distances x (mm) from the array centre; in the
# Figure 3C subset, also along lines through the centre parallel to the sides (Methods 2.5).
# (F2) Background is the mean of 3 ROIs inside one electrode footprint, subtracted from every ROI
# (Methods 2.5).
# (F3) The two diagonals of a well are pooled as one experiment; n counts wells (Methods 2.5; Figure
# 3B legend). Data are mean +/- s.e. over experiments (Methods 2.5).
# (F4) YP profiles are fitted with YP(x) = a (b/2)^2 / (x^2 + (b/2)^2), a the peak at x = 0 and b
# the FWHM (Methods 2.5). Pr profiles are fitted with Pr(x) = a exp(-x^2 / (2 sigma^2)), FWHM about
# 2.4 sigma (Methods 2.5). Fits are least squares (Grapher), a standard reading of "fitted".
# (F5) FWHM per condition is the mean of FWHM values from Lorentzian fits of each experiment (Results
# 3.1; Figure 4C and 6D legends).
# (F6) Fitted ranges: -4 to 4 mm for Figures 3 and 4 (Results 3.1; Figure 3B legend), -5 to 5 mm
# for Figure 5 (Results 3.2; Figure 5B legend) and the mean profiles of Figure 6 (Figure 6B legend).
# (F7) Tests are two-sided Student's t tests, with Bonferroni correction where several groups are
# compared, at p < 0.05 (Methods 2.5). A trend's slope is tested with a two-sided one-sample t test
# of the regression slope (Figure 4C, 6D, 7 legends).
# (F8) The paper's own reading of its plots: "A gap exceeding the length of the error bars indicates
# a significant difference at p<0.05" (Methods 2.5). Claims the paper states without a test are
# judged by this rule on mean +/- s.e., as the paper asks its reader to judge them.
# (F9) Fields from the paper's simulation, not from the data: a 7.2-kV first pulse gives 3.3 kV/cm at
# the centre, 9.4 kV/cm at 6 mm and 13.5 kV/cm at 7 mm toward the active electrode (Methods 2.2).
# (F10) Percent of the diagonal: FWHM / 15.3 mm x 100 (Figure 4C legend, right axis; 1.7 mm is given
# as 11.1%).
#
# Details the paper leaves open, with the readings named. Each criterion that uses one runs every
# reading; a claim is decided when all readings give its outcome, and blocked as
# methods_underspecified when they give different outcomes.
# (O1) ROI positions along a diagonal are not given. Positions are taken from the dataset when it
# holds them; otherwise readings (a) ROIs centred at whole-mm distances (0, 1, ... 7 mm each way; the
# text names only whole-mm distances: 0, 6, 7 mm and fit limits 4, 5, 6 mm), (b) contiguous ROIs
# from the centre outward. Which ROI side lies along the diagonal is not given; 406 um along the
# diagonal is used as a standard choice that cannot move a centre by more than 0.04 mm.
# (O2) "Pooled" diagonals. Readings (a) the two diagonals averaged at each signed position (profiles
# run from -x to x, as plotted in Figures 3B, 5B, 6B), (b) all four half-diagonals averaged at each
# distance (Figure 4A legend, "measurements in 4 diagonal directions from the center were pooled").
# Fits under (b) use the folded profile mirrored to -x.
# (O3) The fitted range for per-experiment FWHM. Methods say "limited to 4-6 mm"; Figures 3 and 4
# use 4 mm, Figure 5 and 6B use 5 mm, Figure 6D refers to the method of 3.1 (4 mm), Figure 7 gives
# none. Readings for Figure 6D, (a) -4 to 4 mm, (b) -5 to 5 mm; for Figure 7, (a) 4, (b) 5, (c) 6 mm.
# (O4) Regressions over experiments or means. The Figure 4C fit uses n = 15 individual experiments;
# for Figures 6D and 7 readings are (a) per-experiment values, (b) group means.
# (O5) The near-electrode distance of the 40-fold ratio. Readings (a) 6 mm, (b) 7 mm (both are "near
# electrodes" in Results 3.1 and Figure 4B).
#
# Data. Every claim uses the paper's own recordings (data dataset). The field values of F9 come from
# the paper's simulation and are taken from the text; no claim tests them.
schema_version: 2
dataset:
  archive: dandi
  id: "001047"
paper: doi:10.1016/j.bioelechem.2025.109016
claims:
- id: fig2-heating
  statement: With packets at the maximum rate, heating followed the field and was largest near the
    electrodes; after 2 bursts it was confined to about 2 mm next to the electrodes and could exceed
    30 C but not 44 C; after 6 bursts it spread further, exceeding 30 C even near the centre, yet
    never exceeded 44 C.
  source: Methods 2.3, paragraph 1; Figure 2
  quote: With 2 bursts ( Fig. 2A ), heating was restricted to an approximately 2-mm zone next to
    electrodes, where it could reach over 30 °C but did not exceed 44 °C. With 6 bursts ( Fig. 2B ),
    heating was more widespread ... Temperature could exceed 30 °C even near the center of the
    array, but did not exceed 44 °C even near the electrodes.
  criterion: Film images at the end of the 2nd and 6th burst (Methods 2.3). Temperature classes from
    the calibrated colour transitions, black to red, green, blue and back to black at 25, 26, 30 and
    44 C (Methods 2.3). The hue limits of the colours are not given; readings (a) red below 45,
    green 75 to 165, blue 180 to 270 degrees of hue, (b) red below 30, green 90 to 150, blue 195 to
    255 degrees, with black any pixel of value below 0.2 (standard choices). Above 30 C is blue;
    above 44 C is black after blue, that is a dark pixel inside a blue region. "Near the center" is
    not given as a distance; readings (a) within 1 mm, (b) within 2 mm of the centre. Reproduced
    when, under every reading, the 2-burst image has blue pixels only within 2.2 mm of an electrode
    edge ("approximately 2-mm", widened by 10%), the 6-burst image has blue pixels near the centre, and neither
    image has a dark pixel enclosed by blue outside the electrode footprints. Blocked when the dataset
    holds no film images.
- id: fig3a-centre-enhanced
  statement: Every CANCAN protocol enhanced electroporation at the array centre, while in the control
    (single unipolar pulse per packet) YP uptake decreased gradually toward the centre.
  source: Results 3.1, paragraph 2; Figure 3A
  quote: All CANCAN protocols visibly enhanced electroporation at the center of the array, in
    contrast to its gradual decrease toward the center in the control ( Fig. 3A ).
  criterion: Set S1, F1 to F3, O1, O2. For each CANCAN rate, the mean diagonal profile has its
    maximum at x = 0 (reading (b) of O1 allows the ROI nearest 0); for the control, the mean at x = 0
    is below the means at 6 and 7 mm by a gap larger than the error bars (F8). Reproduced when both
    hold for every rate under every reading.
- id: fig3bc-rate-suppresses-off-target
  statement: Raising the packet rate from 1 Hz to 0.2 MHz suppressed electroporation better both near
    the electrodes (diagonal profile) and at the perimeter between electrodes (profile parallel to
    the sides).
  source: Results 3.1, paragraph 2; Figure 3B, 3C
  quote: The most conspicuous effect of increasing the packet rate from 1 Hz to 0.208333 MHz
    (abbreviated to 0.2 MHz below and in figure legends) was better suppression of electroporation
    both near electrodes ( Fig. 3B ) and at the perimeter between electrodes ( Fig. 3C ).
  criterion: Set S1, F1 to F3, F8, O1, O2. Near electrodes is YP at 6 and 7 mm on the diagonals. The
    perimeter is not given as a distance; readings (a) the outermost ROIs of the parallel profile,
    (b) the mean of the parallel ROIs at 4 mm or more from the centre. Reproduced when, under every
    reading, mean YP at 0.2 MHz is below that at 1 Hz with a gap larger than the error bars (F8) at
    6 mm, at 7 mm and at the perimeter; a two-sided t test at each is reported. Blocked for the
    perimeter part when the dataset has no parallel measurements.
- id: fig3-lorentzian-profile
  statement: The decline of YP emission from the centre was bell-shaped and fitted a Lorentzian
    function over -4 to 4 mm nearly perfectly (R > 0.9, p < 0.001) for every packet rate.
  source: Results 3.1, paragraph 3; Figure 3B, 3C legend; Methods 2.5
  quote: The fit correlation with data in the −4 to 4 mm radius was nearly perfect (R>0.9, p<0.001).
  statistics:
  - about: correlation of the Lorentzian fit with the data, -4 to 4 mm
    statistic: R > 0.9
    p: 0.001
    p_relation: "<"
  - about: significance of each YP fit in Figures 3, 5 and 6
    p: 0.0001
    p_relation: "<"
  expected:
    quantity: Pearson correlation of fitted and measured mean YP, -4 to 4 mm, each rate
    value: 0.9
    tolerance: 0
  criterion: Set S1, F1 to F4, F6, O1, O2. For each CANCAN rate, the Lorentzian (F4) is fitted to the
    mean diagonal profile over -4 to 4 mm and to the parallel profile where present. R is the Pearson
    correlation of fitted and measured values over that range, and p its test. Reproduced when R
    exceeds 0.9 with p < 0.001 for every rate and profile under every reading; the threshold 0.9 is
    the paper's bound, so the tolerance is zero.
- id: fig3-tail-deviation-falls-with-rate
  statement: Beyond the fitted range, the data deviated from the Lorentzian fit less as the packet
    rate increased.
  source: Results 3.1, paragraph 3; Figure 3B, 3C
  quote: The deviation of experimental data from the fits at larger distances from the center
    diminished with increasing the packet repetition rate, highlighting better suppression of the
    off-target electroporation.
  depends_on:
  - fig3-lorentzian-profile
  criterion: Set S1, fits of fig3-lorentzian-profile extended to all distances (Figure 3B legend, the
    plots were extended to the x-axis limits). The deviation is the mean of (data - fit) over ROIs
    beyond 4 mm. The paper does not say in which units; readings (a) a.u., (b) percent of the fitted
    peak a. Reproduced when, under every reading, the deviation is largest at 1 Hz and smallest at
    0.2 MHz, and its Spearman correlation with rate over the tested rates is negative (a standard
    measure of a monotone trend, as the paper names none).
- id: fig4b-centre-no-rate-effect
  statement: YP uptake at the array centre showed no significant effect of packet rate.
  source: Results 3.1, paragraph 4; Figure 4B
  quote: YP intensity in the center showed no significant effect of the packet rate ( t -test with
    Bonferroni correction, Fig. 4B ).
  criterion: A claim of absence, judged on the paper's test. Set S1, F1 to F3, O2; per experiment the
    background-subtracted YP at x = 0. Two-sided Student's t tests with Bonferroni correction (F7).
    The set of comparisons is not given; readings (a) each rate against 1 Hz (as in Figure 4C), (b)
    all pairs of rates. Reproduced when no corrected comparison has p < 0.05; not reproduced when
    any does. Group means and the largest ratio between rates are reported either way.
- id: fig4b-near-electrode-decline
  statement: In contrast to the centre, YP uptake at 6 and 7 mm from the centre (1.65 and 0.65 mm from
    the electrodes) declined steeply as the packet rate increased.
  source: Results 3.1, paragraph 4; Figure 4B
  quote: It contrasted with a steep, packet rate-dependent decline of YP uptake at 6 and 7 mm from
    the center (i.e., 1.65 and 0.65 mm from electrodes).
  criterion: Set S1, F1 to F3, O2. At 6 mm and at 7 mm, a power function YP = c rate^k is fitted to
    YP against packet rate (Figure 4B legend, best fits using power function), by least squares.
    Whether the fit uses the plotted means or the individual experiments is not given; readings (a)
    group means, (b) per-experiment values. Reproduced when, under every reading, k < 0 at both
    distances and mean YP at 0.2 MHz is below that at 1 Hz with a gap larger than the error bars (F8)
    at both.
- id: fig4b-40-fold-ratio
  statement: At 0.2 MHz, YP uptake at the centre was 40 times that near the electrodes, despite the
    field there being about 4 times weaker (3.3 against about 14 kV/cm).
  source: Results 3.1, the sentences on the ratio of YP uptake in the center and near electrodes; Figure 4B; Abstract
  quote: Now, by increasing the packet repetition rate to 0.2 MHz, we achieved a 40-fold difference (
    Fig. 4B ), despite using a bigger array with larger reduction of the electric field from
    electrodes to the center.
  expected:
    quantity: ratio of mean YP at the centre to mean YP near electrodes, 0.2 MHz
    value: 40
    tolerance: 4
  criterion: Set S1 at 0.2 MHz, F1 to F3, F9, O2, O5. The ratio of group-mean background-subtracted
    YP at x = 0 to that at the near-electrode distance. Reproduced when the ratio is within 36 to 44
    under one reading of O5 and O2 (the paper names one number for a choice it leaves open).
- id: fig4c-fwhm-falls-with-rate
  statement: Higher packet rates focused electroporation into a smaller spot; the FWHM fell from
    about 4 mm at 1 Hz to about 2 mm at 1 kHz, 10 kHz and 0.2 MHz (p = 0.03, 0.02 and 0.09 against 1
    Hz), and could be under 15% of the inter-electrode gap.
  source: Results 3.1, paragraphs 5 and 6; Figure 4C
  quote: FWHM decreased from ~4 mm at 1 Hz to ~2 mm at 1 kHz, 10 kHz, and 0.2 MHz packet rates (p =
    0.03; 0.02, and 0.09, respectively; t -test with Bonferroni correction).
  statistics:
  - about: 1 kHz against 1 Hz
    test: t-test
    p: 0.03
    corrected: Bonferroni
    n: 3 experiments per rate
  - about: 10 kHz against 1 Hz
    test: t-test
    p: 0.02
    corrected: Bonferroni
    n: 3 experiments per rate
  - about: 0.2 MHz against 1 Hz
    test: t-test
    p: 0.09
    corrected: Bonferroni
    n: 3 experiments per rate
  expected:
  - quantity: mean FWHM at 1 Hz
    value: 4
    tolerance: 0.4
    unit: mm
  - quantity: mean FWHM at 1 kHz
    value: 2
    tolerance: 0.2
    unit: mm
  - quantity: mean FWHM at 10 kHz
    value: 2
    tolerance: 0.2
    unit: mm
  - quantity: mean FWHM at 0.2 MHz
    value: 2
    tolerance: 0.2
    unit: mm
  criterion: Set S1, F1 to F7, F10, O1, O2. Per experiment, the Lorentzian fitted over -4 to 4 mm
    gives b; FWHM per rate is the mean over experiments. Two-sided t tests of each rate against 1
