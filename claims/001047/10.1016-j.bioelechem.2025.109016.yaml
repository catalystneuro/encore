  statistics:
  - about: each of the four fits
    p: 0.0001
    p_relation: "<"
  expected:
  - quantity: R2 of Lorentzian fit to Pr
    value: 0.92
    tolerance: 0.092
  - quantity: R2 of Gaussian fit to Pr
    value: 0.96
    tolerance: 0.096
  - quantity: R2 of Lorentzian fit to YP
    value: 0.98
    tolerance: 0.098
  - quantity: R2 of Gaussian fit to YP
