    is read as a Spearman correlation of accuracy with SNR over the 250 ground-truth units, positive with
    p < 0.05. Low-SNR units are open, read as (a) those below the median ground-truth SNR or (b) those
    below the mode of the ground-truth SNR histogram (bins of 1, a standard choice), the reference Figure
