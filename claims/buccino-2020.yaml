- id: fig2s1a-precision-recall-bias
  statement: 'Sorters trade precision against recall differently: HerdingSpikes2, SpyKING Circus and HDSort
    favour precision, IronClust recall, Kilosort2 scores well on both, and Tridesclous shows no bias.'
