    than one unit. Reproduced when, for every sorter, the false positive units with k >= 2 are within
    tolerance, and its true positive units with k >= 2 outnumber those with k = 1; partially reproduced when this holds for four or five sorters.
- id: fig3s1-ks2-ic-best-pair
  statement: With two sorters, combining Kilosort2 and IronClust identified true positives most reliably,
    with false positive and true positive detection rates of 96% and 95%.
  source: Results, Low-agreement units are mainly false positives, paragraph 2; Figure 3, figure supplement
    1 legend
  quote: For two sorters, the most reliable identification of true positives for this dataset was achieved
    by combining Kilosort2 and Ironclust (96% and 95% false positive and true positive detection rate,
    respectively)
  expected:
  - quantity: false positive detection rate, Kilosort2 and IronClust
    value: 96
    tolerance: 9.6
    unit: percent
  - quantity: true positive detection rate, Kilosort2 and IronClust
    value: 95
    tolerance: 9.5
    unit: percent
  depends_on:
  - fig3c-fp-found-by-one-sorter
  criterion: 'No code for this figure was found; the legend gives the method: for each subset of sorters,
    the units of the other sorters are removed from the full comparison of fig3a, the units of the subset
    found by one sorter (k = 1) are predicted false positive and the others true positive, against the
    truth of fig3c-fp-found-by-one-sorter. The false positive detection rate is the fraction of false
    positive units predicted so, the true positive rate likewise. Open, with readings: removal (a) drops
    the nodes and recomputes connected components, or (b) keeps the full comparison''s components and
    counts the subset''s sorters in each; the rate is (i) pooled over the units of the subset''s sorters
    or (ii) the mean of the per-sorter rates. The legend says the best pairs combine two of Kilosort2,
    IronClust and HDSort; the Results name Kilosort2 and IronClust. The four combinations of readings
    are choices of method, so the outcome is the one they all give, blocked as methods_underspecified
    when they differ. Reproduced when both rates are within tolerance and Kilosort2 with IronClust has the highest true positive rate of
    the 15 pairs; partially reproduced when the rates are within tolerance and the best pair is another
    pair of Kilosort2, IronClust and HDSort.'
- id: fig3s1-pairs-remove-fp-four-keep-tp
  statement: A pair of sorters suffices to isolate almost all false positive units, but with fewer than
    four sorters a significant fraction of true positive units, found by only one sorter, are wrongly
    classed as false positives; four or more sorters reliably identify most true positives.
  source: Results, Low-agreement units are mainly false positives, paragraph 2; Figure 3, figure supplement
    1 legend
  quote: This analysis showed that using a pair of sorters is sufficient to isolate almost all false positive
    units in each sorter, yet when fewer than four sorter outputs are compared, a significant fraction
    of true positive units found by only one sorter can be wrongly classified as false positives with
    this approach
  depends_on:
  - fig3s1-ks2-ic-best-pair
  criterion: 'Subsets of two to five sorters and the rates as in fig3s1-ks2-ic-best-pair, under the same
    readings. "Almost all" is read against the paper''s own example of a pair, 96%, widened by 10%: the
    median false positive detection rate over the 15 pairs is at least 86.4%. "Most" true positives is
    more than half: every subset of four or five sorters has a true positive rate above 0.5. The loss
    with fewer sorters: the lowest true positive rate over pairs and over triples is below the lowest
    over subsets of four. The outcome is the one all the readings give, blocked as methods_underspecified
    when they differ. Reproduced when all three hold; partially reproduced when the false positive part
    holds and one true positive part fails.'
- id: fig3d-snr-rises-with-agreement
  statement: Ground-truth units with higher SNR are found by more sorters.
  source: Results, Low-agreement units are mainly false positives, paragraph 3; Figure 3D
  quote: This shows, as expected, that higher SNR units have higher agreement among sorters
  depends_on:
  - fig3c-fp-found-by-one-sorter
  criterion: Sorters, agreement graph and k as in the opening comment. For each sorter, its true positive
    units (as in fig3c-fp-found-by-one-sorter) with the SNR of the ground-truth unit each matches (ground-truth
    SNR as in the opening comment), as the notebook's Figure 3D cell pairs them. The paper reports no
    test; the claim is read as a positive Spearman correlation between k and SNR. Reproduced when the
    correlation is positive for all six sorters; partially reproduced when positive for four or five.
- id: fig3s2-snr-does-not-separate-ks2-fp
  statement: 'For Kilosort2, SNR is not a good predictor of false positives: many of its false positive
    units have an SNR above the mode of the ground-truth SNR.'
  source: Results, Low-agreement units are mainly false positives, paragraph 3; Figure 3, figure supplement
    2 legend
  quote: Many detected false positive units have an SNR above the mode of the ground-truth SNR, indicating
    that SNR is not a good measure to separate false and true positives in this case
  depends_on:
  - fig2e-ks2-unit-types
  criterion: No code for this figure was found. The SNR of each Kilosort2 unit is computed with the same
    function and arguments as the ground-truth SNR (opening comment); the mode of the ground-truth SNR
    is the peak of its histogram in bins of 1 (a standard choice). Units "without matches" are read as
    (a) the Methods' false positive class (fig2e-ks2-unit-types) or (b) units that are the best match
    of no ground-truth unit (the rule of fig3c-fp-found-by-one-sorter). "Many" is open, read as more than
    half or as at least a quarter of those units above the mode. Reproduced when every reading holds;
    not reproduced when none does; blocked as methods_underspecified when they differ.
- id: fig4a-curators-agree
  statement: The two experts' manual curations of the Kilosort2 output agree on most curated units (226
    of 351, 64.2%), and 174 Kilosort2 units are discarded by both.
  source: Results, Consensus units highly overlap with manually curated ones, paragraph 1; Figure 4A
  quote: most of the curated units (226 out of 351–64.2%) are agreed upon by both experts. Notably, 174
    units found by Kilosort2 are discarded by both experts
  expected:
  - quantity: curated units agreed by both curators
    value: 226
    tolerance: 22.6
    unit: units
  - quantity: curated units in all
    value: 351
    tolerance: 35.1
    unit: units
  - quantity: agreed curated units over all curated units
    value: 64.2
    tolerance: 6.42
    unit: percent
  - quantity: Kilosort2 units discarded by both curators
    value: 174
    tolerance: 17.4
    unit: units
  depends_on:
  - fig1b-unit-counts
  criterion: 'As the notebook''s Venn diagram: compare_multiple_sorters on curated 1, curated 2 and the
    Kilosort2 run (defaults), and the counts of agreement units by which of the three they hold. Read
    as 226 = units holding both curators, 351 = units holding either curator, 174 = units holding Kilosort2
    alone. For 226 and 351 a second reading is the pairwise compare_two_sorters(curated 1, curated 2):
    matched pairs, and the two counts summed less the matched pairs. Curated counts do not depend on a
    sorter run; 174 does, as the curators worked on the paper''s run. Reproduced when the values are within
    tolerance under one reading; partially reproduced when 226, 351 and 64.2% are and 174 is not.'
- id: fig4b-single-sorter-match-curated
  statement: Only a small percentage of each sorter's units match the curated units; IronClust matches
    best (59.83% and 61.1%), above Kilosort2 (50.67% and 56.25%), from whose output the curations were
    made.
  source: Results, Consensus units highly overlap with manually curated ones, paragraph 2; Figure 4B
  quote: The highest percentage match is actually IronClust which is surprising given that the initial
    sorting output was curated from Kilosort2’s output (IC ∩ C1 = 59.83%, IC ∩ C2 = 61.1%, KS ∩ C1 = 50.67%,
    KS ∩ C2 = 56.25%)
  expected:
  - quantity: IronClust units matched to C1
    value: 59.83
    tolerance: 5.98
    unit: percent
  - quantity: IronClust units matched to C2
    value: 61.1
    tolerance: 6.11
    unit: percent
  - quantity: Kilosort2 units matched to C1
    value: 50.67
    tolerance: 5.07
    unit: percent
  - quantity: Kilosort2 units matched to C2
    value: 56.25
    tolerance: 5.63
    unit: percent
  depends_on:
  - fig1b-unit-counts
  criterion: Percentages as in the opening comment (comparisons with the curated sortings), for all of
    each sorter's units. Reproduced when the four values are within tolerance and IronClust has the highest
    percentage of the six sorters for both curators; partially reproduced when IronClust is highest but
    a value is outside tolerance.
- id: fig4c-consensus-match-curated
  statement: Consensus units (found by at least two sorters) match the curated units at above 70% for
    every sorter; Kilosort2 is highest (84.55% and 89.55%), slightly above IronClust (82.63% and 83.83%).
  source: Results, Consensus units highly overlap with manually curated ones, paragraph 2; Figure 4C
  quote: The average match percentage is above 70% for all sorters showing that there is a large agreement
    between the manually curated outputs and the consensus-based output. Kilosort2 has the highest match
    (KS c ∩ C1 = 84.55%, KS c ∩ C2 = 89.55%), slightly higher than Ironclust (IC c ∩ C1 = 82.63%, IC c
