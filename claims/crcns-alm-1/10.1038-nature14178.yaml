# Claims for Li, Chen, Guo, Gerfen & Svoboda (2015), Nature 519, 51-56, "A motor cortex circuit for
# motor planning and movement", doi:10.1038/nature14178, on CRCNS data set alm-1
# (doi:10.6080/K0RF5RZT).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-07,
# protocol as stated in docs/protocol.md (Reader), version pilot-13.
#
# Text read: the version of record, as text extracted from the PDF supplied under paper/ (main
# text, Methods, legends of Figures 1 to 5 and Extended Data Figures 1 to 7). The paper has no
# separate Supplementary Information. The extraction prints "=" as "5", "<" as ",", ">" as ".",
# "±" as "6" and a minus sign as "2"; quotes keep these glyphs as printed. PDF pages 2, 3 and 5
# were opened to read Fig. 1d, 2c, 2d, 3e, 3f, 3i and 5b, which the text garbles.
#
# Code. The paper links no analysis code. The data set's description says it holds MATLAB scripts;
# they are files of the data set and were not read. Every method below is from the paper's text.
#
# Data the paper used. 52 mice (age > P60). Behaviour, whisker-based object location
# discrimination, head-fixed (n = 42 mice in the Results): pole at an anterior (lick left) or
# posterior (lick right) position; sample epoch 1.3 s from pole movement onset to 0.1 s after pole
# retraction onset; delay epoch 1.3 s; auditory go cue (3.4 kHz, 0.1 s); response by licking one of
# two lickports; licks before the cue are "lick early" trials. Photoinhibition of ALM (Fig. 1), 5
# VGAT-ChR2-EYFP and 3 PV-ires-Cre x ReaChR mice, 8 mice in Fig. 1d, 1.3 s in the sample or delay
# epoch, 25% of trials. Electrophysiology (Figs 2 and 3), left ALM, NeuroNexus 32-channel silicon
# probes, 9 Sim1_KJ18-Cre, 3 Rbp4-Cre and 4 Tlx_PL56-Cre mice injected with AAV-FLEX-ChR2, plus 1
# Sim1_KJ18-Cre x Ai32 and 2 Tlx_PL56-Cre x Ai32 mice: 1,408 single units, 19 mice, 99 sessions;
# 1,245 putative pyramidal (spike width > 0.45 ms), 124 fast-spiking (< 0.35 ms), 39 excluded.
# Antidromic tagging, by photostimulating PT axons in the reticular formation through an implanted
# fibre or IT axons in contralateral ALM through a window (pairs of 1 ms pulses 10 ms apart, every
# 500 ms), with a collision test: 45 PT and 27 IT neurons. Simultaneous recording and subthreshold
# PT photoactivation (ED Fig. 7), 2 mice, 8 sessions, 91 neurons. Two-photon calcium imaging
# (Fig. 4), GCaMP6s, 4 C57Bl/6Crl mice, 59 fields of view, PT and IT neurons labelled
# retrogradely. Photoactivation behaviour (Fig. 5, ED Figs 3 and 6), 7 Sim1_KJ18-Cre x Ai32 and 7
# Tlx_PL56-Cre x Ai32 mice; untrained mice in ED Fig. 3f, g. Anatomy (ED Figs 3 and 4). Variables:
# spike times per unit and trial, spike waveforms, trial type (lick right or lick left), outcome
# (correct, error, lick early), epoch times, lick or mouth-movement traces, photostimulus timing,
# raw voltage traces for the antidromic responses. By its description the data set holds the
# electrophysiology, 1,408 units from 99 sessions in 19 mice, with cell type labels (pyramidal, FS,
# PT, IT), trial types, epoch times, photostimulation type per trial, lick traces and raw voltage
# traces. The photoinhibition and photoactivation behaviour, the imaging and the anatomy are not
# named in it.
#
# Shared methods for the electrophysiology claims, from the Methods unless marked open.
# - Lick right trials are contralateral to the recorded left ALM, lick left trials ipsilateral
#   (Results, ALM contains neurons with bilateral selectivity, paragraph 2).
# - Epochs. Sample, pole movement onset to 0.1 s after pole retraction onset (1.3 s); delay, the
#   1.3 s before the go cue (Methods, Behaviour). The length of the response epoch is open: the
#   paper does not give it. Readings, (a) 1.3 s after the go cue, as long as the other epochs;
#   (b) 1.5 s, the response window in Methods, Behaviour. Fig. 2c plots about 1.5 s after the cue.
# - Trials. Correct trials only ("Only trials in which mice correctly reported pole locations were
#   included", Methods, Electrophysiology data analyses; Fig. 2b legend). Whether lick early
#   trials are dropped from the neural analyses is open; they are dropped from performance
#   (Methods, Behavioural data analyses). Readings, (a) dropped, (b) kept. Trials with axonal
#   photostimulation are not named in the neural analyses; they are left out, as the analyses
#   describe the task without stimulation, and the claim notes say so.
# - Selectivity test. Two-tailed t-test on spike counts of lick right against lick left trials,
#   per epoch, P < 0.05, not corrected (Results; Methods). Pooled or Welch variance is open; the
#   pooled (Student) test is the standard reading, Welch a variant.
# - Time courses use a 200 ms averaging window (Fig. 2c and ED Fig. 2a legends); the step is open
#   and cannot change an outcome beyond the window; a step of 10 ms is a standard choice.
schema_version: 2
dataset:
  archive: crcns
  id: alm-1
  doi: 10.6080/K0RF5RZT
paper: doi:10.1038/nature14178
claims:
- id: fig1d-photoinhibition-ipsilateral-bias
  statement: Unilateral photoinhibition of ALM during the delay epoch biases licking to the side of
    the inhibited hemisphere; inhibiting left ALM raises performance on lick left trials and lowers
    it on lick right trials, and inhibiting right ALM does the reverse.
  source: Results, ALM is required for movement planning, paragraph 2; Figure 1d
  quote: Unilateral photoinhibition (Methods) of anterior lateral motor cortex (ALM, centred at 2.5
    mm anterior, 1.5 mm lateral), limited to the delay epoch, produced an ipsilateral bias ...
    Inhibiting left ALM caused a tendency to lick the left port, resulting in increased performance
    in 'lick left' trials and decreased performance in 'lick right' trials
  statistics:
  - about: left ALM, delay epoch, lick right performance decrease (stars read from Fig. 1d)
    test: one-tailed test, bootstrap
    p: 0.001
    p_relation: "<"
    n: 8 mice
  - about: left ALM, delay epoch, lick left performance increase (stars read from Fig. 1d)
    test: one-tailed test, bootstrap
    p: 0.01
    p_relation: "<"
    n: 8 mice
  - about: right ALM, delay epoch, lick left performance decrease (stars read from Fig. 1d)
    test: one-tailed test, bootstrap
    p: 0.001
    p_relation: "<"
    n: 8 mice
  - about: right ALM, delay epoch, lick right performance increase (stars read from Fig. 1d)
    test: one-tailed test, bootstrap
    p: 0.05
    p_relation: "<"
    n: 8 mice
  criterion: As in Methods, Behavioural data analyses. Performance is the fraction correct,
    lick early trials excluded, computed separately for lick right and lick left trials. The
    change is photoinhibition minus control performance. Its P value is the fraction of 10^4
    bootstrap rounds, resampling with replacement animals, sessions within animal and trials
    within session, that give a change of the opposite sign (one-tailed). Reproduced when, for
    delay epoch inhibition of each hemisphere, the contralateral trial type loses performance
    and the ipsilateral gains it, each at P < 0.05; partially reproduced when this holds for
    one hemisphere or for the contralateral loss only.
- id: fig1d-sample-epoch-smaller-bias
  statement: The ipsilateral bias is smaller when ALM is photoinhibited during the sample epoch
    than during the delay epoch.
  source: Results, ALM is required for movement planning, paragraph 2; Figure 1d
  quote: This ipsilateral bias was smaller when photoinhibiting during the sample epoch.
  criterion: Performance changes as in fig1d-photoinhibition-ipsilateral-bias. The paper reports
    no test of sample against delay. Reproduced when, for each hemisphere, the performance change
    on the contralateral trial type is smaller in magnitude for sample than for delay epoch
    inhibition.
- id: task-performance
  statement: Mice performed the task at 78.4% correct on average, with responses before the go
    cue on fewer than 13% of trials (n = 42 mice).
  source: Results, ALM is required for movement planning, paragraph 1
  quote: "(mean per cent correct, 78.4%; responses before the go cue, ,13%)"
  expected:
  - quantity: mean per cent correct
    value: 78.4
    tolerance: 7.84
    unit: "%"
  criterion: Per cent correct excludes lick early trials (Methods, Behavioural data analyses).
    The figure is over 42 mice, more than the electrophysiology mice; how the mean is taken is
    open. Readings, (a) mean over sessions, (b) mean over mice of per-mouse means, (c) pooled
    trials. Which trials enter is also open (the paper does not say whether photostimulation
    trials are left out); readings, control (unstimulated) trials only, or all trials. Reproduced when the mean is within tolerance under
    one reading and the fraction of lick early trials is below 13% (14.3% with the 10%
    tolerance) under the same reading.
