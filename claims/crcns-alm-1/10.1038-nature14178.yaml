- id: fig2-selective-fraction
  statement: 73% (912 of 1,245) of putative pyramidal neurons distinguish the trial types in at
    least one epoch.
  source: Results, ALM contains neurons with bilateral selectivity, paragraph 1; Methods,
    Electrophysiology data analyses, paragraph 2
  quote: A large fraction (73%, 912/1,245) of neurons distinguished trial types (P , 0.05,
    two-tailed t-test, not corrected for multiple comparisons)
  expected:
  - quantity: fraction of putative pyramidal neurons selective
    value: 0.73
    tolerance: 0.073
  - quantity: selective neurons
    value: 912
    tolerance: 91.2
  depends_on:
  - unit-counts
  criterion: A neuron is selective when the shared selectivity test is significant in the
    sample, delay or response epoch (Methods). Under each reading of the response epoch length
    and of lick early trials. Reproduced when both values are within tolerance under one reading.
- id: fig2d-response-categories
  statement: Of the selective neurons, 219 have selectivity only in the sample or delay epochs
    (preparatory only), and the rest have peri-movement selectivity in the response epoch, alone
    or together with preparatory selectivity (389 and 304 of 912).
  source: Results, ALM contains neurons with bilateral selectivity, paragraph 1; Figure 2d
  quote: subsets of neurons showed selective preparatory activity (Fig. 2b, left column; Fig. 2d,
    219/912 neurons), peri-movement activity during the response epoch (Fig. 2b, right column;
    389/912), or both (Fig. 2b, middle column; 304/912)
  expected:
  - quantity: preparatory only
    value: 219
    tolerance: 21.9
  - quantity: peri-movement only (text reading)
    value: 389
    tolerance: 38.9
  - quantity: preparatory and peri-movement (text reading)
    value: 304
    tolerance: 30.4
  depends_on:
  - fig2-selective-fraction
  criterion: Preparatory means significant in the sample or delay epoch, peri-movement means
    significant in the response epoch (Methods). The text and Fig. 2d disagree on the two larger
    counts. Readings, (a) the text, 389 peri-movement only and 304 both; (b) the figure, whose
    bars read about 0.43 for both and 0.33 for peri-movement only, that is 389 both and 304
    peri-movement only. Counts may also be compared as fractions of the selective neurons found
    here. Reproduced when all three counts (or fractions) are within tolerance under one
    reading of the labels, the response epoch and lick early trials; the text and figure
