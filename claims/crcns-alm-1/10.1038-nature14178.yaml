- id: contra-ipsi-selectivity-forms
  statement: Contra-preferring neurons include most of the neurons with large spike count
    differences between trial types, while ipsi-preferring neurons more often express their
    selectivity through suppression of activity on contra trials.
  source: Methods, Calcium imaging data analyses, paragraph 4; Extended Data Fig. 1d
  quote: Contra-preferring neurons include a majority of the neurons with large spike count
    differences, whereas ipsi-preferring neurons tend to express their selectivity more often
    through contra-suppression.
  depends_on:
  - fig2e-equal-contra-ipsi
  criterion: The paper gives no threshold for "large" and no definition of contra-suppression.
    Per selective putative pyramidal neuron, the absolute spike count difference over the three
    epochs. Readings for "large", (a) the top quarter, (b) the top tenth of absolute differences.
    Contra-suppression is read as a firing rate on lick right trials below the rate before sample
    onset, with the rate on lick left trials not below it. Reproduced when contra-preferring
    neurons are more than half of the large group under one reading, and ipsi-preferring neurons
    show contra-suppression more often than contra-preferring neurons show ipsi-suppression
    (the same rule with trial types swapped).
- id: fig5-pt-activation-contralateral-bias
  statement: Subthreshold photostimulation of PT neurons during the delay epoch biases licking to
    the contralateral side; in left ALM it lowers performance on lick left trials, and in right
    ALM on lick right trials. Stimulation during the sample epoch also causes a significant
    contralateral bias.
  source: Results, Pyramidal tract neurons drive upcoming movements, paragraphs 2 and 3; Figure 5b
  quote: Subthreshold photostimulation of the pyramidal tract neurons during the delay epoch biased
    licking to the contralateral direction. Subthreshold stimulation of pyramidal tract neurons in
    the left ALM produced a rightward bias, resulting in a decrease in performance in the lick left
    trials and vice versa (Fig. 5) ... Notably, stimulation of pyramidal tract neurons during the
    sample epoch also caused a significant contralateral bias (Fig. 5b)
  statistics:
  - about: left ALM, delay epoch, lick left performance decrease (stars read from Fig. 5b)
    test: one-tailed test, bootstrap
    p: 0.001
    p_relation: "<"
  - about: left ALM, sample epoch, lick left performance decrease (stars read from Fig. 5b)
    test: one-tailed test, bootstrap
    p: 0.01
    p_relation: "<"
  - about: right ALM, delay epoch, lick right performance decrease (stars read from Fig. 5b)
    test: one-tailed test, bootstrap
    p: 0.001
    p_relation: "<"
  criterion: Performance and bootstrap as in fig1d-photoinhibition-ipsilateral-bias; data from
    subthreshold powers pooled (0.12 to 0.8 mW average power, Fig. 5 legend). Reproduced when the
    three decreases are significant at P < 0.05; partially reproduced when the delay effects hold
    and the sample effect does not.
- id: ed6b-pt-dose-response
  statement: The behavioural effect of PT neuron activation grows monotonically with laser power.
  source: Results, Pyramidal tract neurons drive upcoming movements, paragraph 2; Extended Data Fig.
    6b
  quote: The effect size was monotonically dependent on laser power (Extended Data Fig. 6b).
  criterion: Delay epoch photostimulation only (ED Fig. 6b legend). Per mouse and in the mean
    over mice, the performance change on the contralateral-bias trial type at each average power
    plotted in ED Fig. 6b (0.12, 0.24, 0.8 mW; not every mouse was tested at every power, and
    only one at 0.8 mW). Reproduced when the mean change grows in magnitude with each step
    of power; partially reproduced when it grows overall (highest power larger than lowest) with
    one reversal.
- id: ed6d-it-activation-inconsistent
  statement: Subthreshold photostimulation of IT neurons also changes behaviour, but the changes
    vary across mice and depend non-monotonically on laser intensity.
  source: Results, Pyramidal tract neurons drive upcoming movements, paragraph 4; Extended Data Fig.
    6d
  quote: Subthreshold photostimulation of the intratelencephalic neurons also caused behavioural
    changes, but these varied across mice and depended non-monotonically on laser intensity
  criterion: Per mouse, delay epoch performance change against average power as in
    ed6b-pt-dose-response. Reproduced when at least one power gives a performance change outside
    the 95% band of control resampling (ED Fig. 6 legend) and the sign or the order across powers
    differs between mice, with at least one mouse non-monotonic.
- id: ed3-high-power-contralateral-licking
  statement: High-power unilateral photostimulation of ALM IT or PT neurons triggers contralateral
    licking with short latencies, also in untrained mice and as premature licks in trained mice,
    while stimulation of vibrissal motor cortex causes whisker protraction but not licking.
  source: Results, Pyramidal tract neurons control directional licking, paragraph 2; Extended Data
    Fig. 3e to g
  quote: Unilateral photostimulation of ALM intratelencephalic or pyramidal tract neurons ('high'
    power, 0.8 mW, 2 ms pulses at 20 Hz, Methods) triggered contralateral licking with short
    latencies (Extended Data Fig. 3e), even in untrained mice (Extended Data Fig. 3f) ...
    Photostimulating the vibrissal motor cortex (anterior 1 mm, lateral 1 mm) caused whisker
    protraction but not licking
  criterion: Reproduced when, in ALM stimulation trials, licks to the contralateral port
    outnumber ipsilateral licks during stimulation for both lines, the fraction of stimulation
    trials with early (premature) licks in trained mice and with licking in untrained mice is
    above zero at high power, and vM1 stimulation produces no increase in lick rate over
    baseline (n = 8 trained mice, n = 6 untrained mice, ED Fig. 3e, f legends). The paper gives
    no test for these; the comparisons are read from ED Fig. 3e, f.
- id: ed3d-non-overlapping-it-pt
  statement: Retrograde tracers in the ipsilateral pontine nucleus and contralateral ALM label
    non-overlapping populations of PT and IT neurons (fewer than 4% doubly labelled, n = 2 mice),
    intermingled in layer 5B.
  source: Results, Pyramidal tract neurons control directional licking, paragraph 1; Extended Data
    Fig. 3d
  quote: Injection of retrograde tracers in the ipsilateral pontine nucleus and the contralateral
    ALM labelled non-overlapping populations of intratelencephalic neurons and pyramidal tract
    neurons (Extended Data Fig. 3d) (doubly labelled neurons, ,4%, n 5 2 mice)
  criterion: Reproduced when the fraction of doubly labelled neurons is below 4% (4.4% with the
    10% tolerance).
- id: ed7-pt-stimulation-persistent-activity
  statement: Subthreshold stimulation of PT neurons during the sample epoch causes changes in ALM
    activity and a directional bias that persist for seconds after the photostimulus ends.
  source: Results, Pyramidal tract neurons drive upcoming movements, paragraph 3; Extended Data Fig.
    7
  quote: Simultaneous recordings and optogenetics revealed that subthreshold stimulation of
    pyramidal tract neurons caused changes in ALM activity and a directional bias that persisted
    for seconds after cessation of the photostimulus
  criterion: Data of ED Fig. 7 (2 mice, 8 sessions, 91 neurons, left ALM, sample epoch
    stimulation). The paper gives no test for the neural change. Population selectivity as in
    ED Fig. 7d (preferred minus non-preferred trial type, preference from control trials) on
    control and photostimulation trials. Readings for "changes in activity", (a) a difference in
    population selectivity in the delay epoch, after the stimulus ends, between photostimulation
    and control trials (paired t-test across neurons, P < 0.05); (b) the fraction of neurons
    whose delay epoch spike counts differ between photostimulation and control trials of the same
    type (two-tailed t-test, P < 0.05) exceeding 5%, the rate expected by chance at that
    threshold (an assumption). Reproduced when one reading holds and
    lick left performance falls with sample stimulation (ED Fig. 7b).
