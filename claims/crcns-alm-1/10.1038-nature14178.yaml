- id: fig2c-selectivity-time-course
  statement: Selectivity emerges in the sample epoch, increases through the delay epoch and is
    largest at the beginning of the response epoch.
  source: Results, ALM contains neurons with bilateral selectivity, paragraph 1; Figure 2c and
    Extended Data Fig. 1d, f
  quote: Selectivity emerged in the sample epoch, increased throughout the delay epoch, and reached
    a maximum at the beginning of the response epoch
  depends_on:
  - fig2-selective-fraction
  criterion: Two measures from the paper. (1) ED Fig. 1f, the number of putative pyramidal
    neurons significantly selective in 200 ms windows (two-tailed t-test, P < 0.05). (2) Fig. 2c
    bottom, the population selectivity of the 912 selective neurons, the spike rate difference
    between preferred and non-preferred trial type, with the preferred type set from 10 trials
    and the difference taken on the remaining trials (Methods). Which 10 trials is open; a
    random draw is the standard choice. What counts as "emerged" and "the beginning" is open.
    Readings, (a) both measures in the last 200 ms of the sample epoch exceed their value in the
    200 ms before sample onset, the last 200 ms of the delay exceed the first 200 ms of the delay,
    and the maximum over the trial falls within 0.5 s after the go cue; (b) the same with the
    maximum within 0.2 s after the cue. Reproduced when all three hold for both measures under
    one reading; partially reproduced when they hold for one measure.
- id: fig2c-dynamic-single-neurons
  statement: Individual neuron responses are dynamic while selectivity at the population level is
    stable.
  source: Results, ALM contains neurons with bilateral selectivity, paragraph 1; Figure 2c bottom
    and Extended Data Fig. 2a
  quote: Individual neuron responses were dynamic, despite stable selectivity at the level of the
    population
  depends_on:
  - fig2-selective-fraction
  criterion: The paper's measure is the population response correlation of Fig. 2c, Pearson's
    correlation between the population response vector at each time and the vector at the go cue,
    all neurons treated as simultaneous, each neuron's response mean-subtracted and normalized
    to the variance of its response across the trial in 200 ms bins (Methods). Which trials and
    how the two trial types enter the vector are open. Readings, (a) the vector of
    selectivities (lick right minus lick left rates); (b) the two trial types' rates
    concatenated. The paper gives no threshold. Reproduced when the mean correlation in the
    sample epoch and the first 0.5 s of the delay is below 0.5, while the population selectivity
    of fig2c-selectivity-time-course stays above zero from the end of the sample epoch through
    the delay; the 0.5 bound is read from Fig. 2c, whose grey trace stays between about 0 and
    0.5 before the cue, and is an assumption.
- id: ed2-error-trials-predict-choice
  statement: On error trials, when mice lick opposite to the instructed direction, ALM activity
    predicts the licking direction; most selective neurons switch their trial type preference.
  source: Results, ALM contains neurons with bilateral selectivity, paragraph 1; Extended Data Fig.
    2b, c
  quote: On error trials, when mice licked in the opposite direction to the instruction provided by
    object location (Fig. 1a), a majority of ALM neurons switched their trial type preference to
    predict the licking direction, as indicated by the negative correlations
  depends_on:
  - fig2-selective-fraction
  criterion: As in ED Fig. 2c. For each of the 912 selective neurons and each epoch (sample,
    delay, response), selectivity is the firing rate on lick right minus lick left trials,
    computed on correct trials and on error trials, with error trials labelled by the instructed
    trial type (pole position), so that negative correlation means activity follows the lick.
    Pearson's r between correct and error selectivity across neurons. Neurons without error
    trials of both types are left out; a minimum number of error trials is not given and is
    open (readings, at least 1, or at least 5, of each type). The paper gives r but no test of it;
    a two-sided test of Pearson's r at P < 0.05 is a standard choice. The "majority" is the
    fraction of neurons whose error selectivity has the sign opposite to their correct
    selectivity. Reproduced when r is negative with P < 0.05 and that fraction exceeds one half
    in all three epochs under one reading; partially reproduced for one or two epochs.
