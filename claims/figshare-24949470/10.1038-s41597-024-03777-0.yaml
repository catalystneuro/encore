- id: coder-agreement-kappa
  statement: Agreement between the two expert coders of party positions was high, with a
    weighted Cohen's kappa of 0.84.
  source: Methods, Party selection and coding, paragraph 3
  quote: we employed Weighted Cohen’s Kappa37, which provided a value of κ = 0.84, indicating a
    high level of consistency among coders
  expected:
  - quantity: weighted Cohen's kappa between the two coders
    value: 0.84
    tolerance: 0.084
  criterion: Weighted Cohen's kappa (Methods, citing ref. 37) between the two coders' positions
    over the 429 party-by-statement positions, ordered Completely Disagree, Tend to Disagree,
    Neutral, Tend to Agree, Completely Agree. Two details are open in the text. The weights,
    readings (a) linear and (b) quadratic. The "No Opinion" category, readings (i) pairs with
    No Opinion from either coder left out, (ii) No Opinion scored as Neutral (50), as the
    cleaning does for users. Reproduced when kappa is within tolerance under one reading;
    every reading is reported. The claim needs each coder's separate positions; whether the
    dataset holds them is the author's to find.
- id: uni-and-landscape-placements
  statement: The platform placed each party on five uni-dimensions, using 18 of the 39
    statements, and on a two-dimensional socio-economic and socio-cultural landscape from 0 to
    100, using 16 statements; the placements (Figs. 2 and 3) conform to the anticipated
    placements of Slovak parties.
  source: Methods, Volebný Kompas implementation and usage, paragraphs 3 and 4; Figs. 2 and 3;
    Technical Validation, Content validation, last paragraph
  quote: Out of the 39 statements, 18 were assigned to the five uni-dimensions ... Of the 39
    statements, 16 influenced this two-dimensional political landscape
  criterion: The dimensions and polarities of each statement come from Supplementary Table 1,
    which was not in the text read; the author takes them from it or from the data dictionary.
    Party positions on 0 to 100 as in the Methods (Completely disagree 0 to Completely agree
    100). The scoring is said to follow the euandi method (ref. 30) and is not given in full.
    Readings for a dimension score (a) the mean over its statements of the position for
    polarity +1 and 100 minus the position for polarity -1; (b) for the landscape, a start at
    50 moved by each statement's polarity-adjusted deviation from 50, averaged over the axis's
    statements. How "No Opinion" party positions enter is not stated, readings (i) left out and
    (ii) scored as 50, as the cleaning does for users. Reproduced when the
    counts of assigned statements are 18 and 16 and, under one reading, the order of the
    parties on each uni-dimension and each landscape axis matches Figs. 2 and 3 of the
    published paper. The figures were not readable here, so the expected placements are read
    from the published figures by the author.
  data: with_labels
- id: party-clustering
  statement: Hierarchical clustering of the parties' recoded positions, by Manhattan distance
    and average linkage, groups the parties largely as anticipated (Fig. 7).
  source: Technical Validation, Content validation, paragraph 7; Fig. 7
  quote: We used the ‘recoded_party_positions’ dataset and computed pairwise Manhattan
    distances to emphasize the absolute differences in policy positions, applying average
    linkage clustering
  depends_on:
  - eleven-parties
  criterion: Method from the Technical Validation; party positions coded 0, 25, 50, 75, 100 as
    in the Methods; pairwise Manhattan distances between the 11 parties over the 39 statements;
    average linkage. The recoding behind 'recoded_party_positions' is made by the deposited R
    code and is not described; for "No Opinion" the readings are (a) recoded to 50, as the
    cleaning does for users, and (b) left out of each pairwise distance. Which positions are
    clustered is not stated either; the final positions adopted by the team (Methods, Party
    selection and coding, paragraph 4) are the natural reading, and the expert-coded positions
    are a variant if the dataset holds them separately. Reproduced when, under
    one reading, the dendrogram's merge order (its topology) matches Fig. 7 of the published
    paper. The text names no expected grouping and the figure was not readable here, so the
    author reads it from the published figure.
