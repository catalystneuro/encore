  statement: The Party Positions Dataset lists the 39 statements in Slovak, Hungarian and
    English and holds 429 party positions, both party self-placements and expert-coded
    positions, with sources, snippets and links.
  source: Data Records, Party Positions Dataset
  quote: This dataset lists the n = 39 statements used in the survey across three languages —
    Slovak, Hungarian, and English and offers detailed information on various parties’ positions
    concerning specific statements with n = 429 observations
  expected:
  - quantity: statements
    value: 39
    tolerance: 0
    unit: statements
  - quantity: party positions (observations)
    value: 429
    tolerance: 0
    unit: observations
  criterion: Tolerance 0, as these are counts of a fixed design (11 parties by 39 statements).
    Reproduced when the file holds 39 statements, each with a Slovak, Hungarian and English
    wording, and 429 party-by-statement positions with expert-coded positions, self-placement
    columns, and source, snippet and link columns.
