# Claims for "The Volebny Kompas Datasets on Slovak Voter and Party Positions" (Scientific Data, 2024),
# on Figshare item 24949470. The text read names the authors by initials only (J.M.M., K.B. and others).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-10-27, protocol as stated in docs/protocol.md.
#
# Text read: the version of record (open access, PMC11374779), as served by Europe PMC, in
# paper/10.1038-s41597-024-03777-0.txt: Background & Summary, Methods, Data Records, Technical
# Validation, Usage Notes, Code availability, Tables 1 and 2 and the figure titles. The text
# gives only the titles of Figs. 1 to 7, not their content, and there is no PDF, so the party
# placements of Figs. 2, 3 and 7 and the daily counts of Fig. 4 could not be read. The paper's
# one supplement, Supplementary Table 1 (the 39 statements, with the uni-dimensions,
# landscape axes and polarities assigned to them), is named but not in the text read. No
# claim's expected value rests on it; the claim on the uni-dimension and landscape
# placements needs its assignments, and the factor analysis needs its list of negatively
# worded statements (see those claims).
#
# Code read: none. The paper's code ("R code for pre-processing the data and conducting basic
# analysis", Code availability) is deposited in the same Figshare item as the data
# (doi:10.6084/m9.figshare.24949470), and the reader does not open the dataset's files. The
# code may settle several details named as open below; the author should read it and record
# what it fixes.
#
# Data the paper used. User Responses Dataset (data_without_email.csv): n = 134,699 raw
# responses to the Volebný Kompas voting advice application, collected from its launch on
# 5 September 2023 to election day, 30 September 2023. Per response: a timestamp
# (TIME.STAMP); answers S1 to S39 on 0, 25, 50, 75, 100 (completely disagree to completely
# agree), with an empty string for "no opinion" and -1 for an unanswered statement; up to
# three most salient statements; the parties the user would consider voting for and would
# never vote for (e.g. UN26, 0/1); GENDER, AGE (categories), EDUCATION (categories);
# EMAIL_ID (pseudonymized placeholder, duplicates allowed). Party Positions Dataset
# (VAA_party_positions coded.xlsx): the 39 statements in Slovak, Hungarian and English and
# 429 party positions (11 parties by 39 statements), with expert-coded positions, party
# self-placements (4 of the 11 parties answered), sources, snippets and links. The Figshare
# item also holds a data dictionary, a README, R scripts, the raw data and a pre-processed
# Slovak census CSV (Data Records, Usage Notes).
#
# Cleaning, from Technical Validation, Data cleaning: rows with -1 in any of S1 to S39 are
# removed as incomplete; empty demographics become NA; empty Likert answers ("no opinion")
# become 50. Which claims use the cleaned rows is not always said; the readings are named
# in each criterion.
#
# Not claimed: the political background (Background & Summary), the 3% polling rule for
# party selection (a method), the platform's matching by Manhattan distance (a method), the
# President's Instagram video likes (outside data the paper does not cite).
schema_version: 2
dataset:
  archive: figshare
  id: "24949470"
paper: doi:10.1038/s41597-024-03777-0
claims:
- id: user-responses-count
  statement: The User Responses Dataset holds 134,699 voter responses, each with answers to the
    39 statements, along with demographics, the three most salient statements and the parties
    the respondent would and would never vote for, for most responses.
  source: Data Records, User Responses Dataset; Table 1
  quote: This raw dataset provides n = 134,699 individual Likert-scale responses to a series of
    39 policy issues and value statements along with additional user demographics and
    preferences for most of the responses
  expected:
  - quantity: rows of the raw user responses file
    value: 134699
    tolerance: 13470
  criterion: Count the rows of the raw user responses file (data_without_email.csv) and check
    that it has the columns of Table 1 (TIME.STAMP, S1 to S39, the would-not-vote columns such
    as UN26, GENDER, AGE, EDUCATION, EMAIL_ID). Reproduced when the row count is within
    tolerance and the columns are present. The count is of the raw file, before cleaning, as
    the Data Records say ("This raw dataset"); the count after removing incomplete rows is
    reported as well.
- id: collection-window
  statement: The responses were gathered during the 26 days leading up to and including
    election day, from the launch on 5 September 2023 to the election on 30 September 2023.
  source: Background & Summary, paragraph 3; Methods, Volebný Kompas implementation and usage,
    paragraph 5
  quote: gathered during the 26 days leading up to and including the day of the 2023 snap
    Slovak Parliamentary Elections
  criterion: From TIME.STAMP of the raw rows. The time zone of TIME.STAMP is not stated, so it
    is open, readings (a) dates as given and (b) the timestamp read as UTC and converted to
    Slovak time (CEST, UTC+2). Reproduced when, under one reading, every timestamp falls between
    2023-09-05 and 2023-09-30 inclusive. Table 1's sample entry (2023-10-09 08:57:38) falls
    outside this window, so the number of rows outside it and their dates are reported under
    each reading. The paper sets no share of rows that may fall outside.
