- id: efa-eleven-factors
  statement: Parallel analyses on both the polychoric and the Pearson correlation matrices of
    S1 to S39 indicated that 11 factors should be extracted.
  source: Technical Validation, Content validation, paragraphs 5 and 6; Fig. 6
  quote: Both parallel analyses indicated that 11 factors should be extracted.
  expected:
  - quantity: factors indicated by parallel analysis, polychoric correlations
    value: 11
    tolerance: 0
    unit: factors
  - quantity: factors indicated by parallel analysis, Pearson correlations
    value: 11
    tolerance: 0
    unit: factors
  criterion: Tolerance 0, a count of factors. Method from the Technical Validation, R package
    psych (ref. 45) on S1 to S39, with negatively worded statements reversed (which ones is in
    Supplementary Table 1 or the R code; reversing an item does not change the eigenvalues, so
    this cannot change the count). Open details, all of which could change the count. Rows,
    readings (a) the cleaned rows with "no opinion" as 50 and (b) the cleaned rows with "no
    opinion" as missing, pairwise complete. The parallel analysis settings are not given;
    reading psych's fa.parallel defaults (minres factoring, 20 iterations, the factor count it
    reports, not the component count), once with cor "poly" and once with "cor". The random
    seed is a standard choice that may move the count by one; it is reported. Reproduced when
    both counts are 11 under one reading of the rows.
- id: efa-loadings-consistent
  statement: With 11 factors and promax rotation, maximum likelihood and principal axis
    factoring gave consistent results, and S1 (real estate tax raised to lower labour taxes) and
    S3 (retirement age) loaded strongly.
  source: Technical Validation, Content validation, paragraph 6
  quote: various estimation strategies were employed, including Maximum Likelihood (ML) and
    principal axis factoring, with promax rotation. This approach yielded consistent results.
    Notably statements such as S1 — ‘Real estate tax should be increased to lower labor taxes
    rises’ and S3 — ‘The retirement age should rise as life expectancy rises’ had strong
    loadings
  depends_on:
  - efa-eleven-factors
  criterion: psych fa with nfactors 11, rotate "promax", fm "ml" and fm "pa", on the matrices
    and rows of efa-eleven-factors. "Strong" and "consistent" are not defined in the paper; the
    thresholds here are this file's choices and an outcome resting on them rests on an
    assumption. S1 and S3 have strong loadings when their largest absolute loading is at least
    0.4 under reading (i) and 0.5 under reading (ii). The two solutions are consistent when each
    statement's factor of largest absolute loading, matched between solutions by Tucker
    congruence, agrees for at least 35 of 39 statements. Reproduced when, under one reading,
    S1 and S3 load strongly in both solutions and the solutions are consistent; all loadings
    are reported.
