  source: Results, LC-NE projections are spatially organized, paragraph 2; Figure 1c to 1e; Figure S2
  quote: We found a high density of LC-NE axons in all CNS regions other than the striatum, with
    varying densities across regions ... Projections to the telencephalon were predominantly
    ipsilateral, from somata in the same hemisphere
  criterion: Uses the dense-labelling SPIM volumes, not described as part of this dandiset.
- id: fig2b-single-neuron-targets
  statement: Individual reconstructed LC-NE neurons (130 cells, 4 mice) tend to send axons to one
    particular region (cortex, thalamus and midbrain, cerebellum, brainstem or spinal cord), and
    neurons with forebrain projections avoid the brainstem and spinal cord and the reverse.
  source: Results, LC-NE projections are spatially organized, paragraph 3; Figure 2b, 2c; Figure S3
  quote: However, individual LC-NE neurons tended to have axons in a particular region ... neurons
