  - quantity: fraction of choices predicted correctly
    value: 0.88
    tolerance: 0.088
  - quantity: exponential fit coefficient
    value: 3.95
    tolerance: 0.395
  criterion: Choice c_r(t) (1 right, 0 left) regressed on past outcomes. The Methods name regressors
