# Claims for "Topographic structure and function of locus coeruleus norepinephrine neurons"
# (Allen Institute; bioRxiv doi:10.64898/2026.04.10.717727, preprint version 1) on dandiset 001950.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21, under
# docs/protocol.md as it stands (version pilot-10).
#
# Text read: the preprint, version 1, full text from the bioRxiv JATS XML (paper/
# 10.64898-2026.04.10.717727.txt): Results, Discussion, Methods, the legends of Figures 1 to 6 and
# of Supplementary Figures S1 to S18. The supplementary figures exist in this text as legends
# only; their panels were not seen. The extraction lost every display equation of the Methods (the
# logistic regressions, the Q-learning update, the softmax, the change of choice likelihood, the
# drift contrast, the Watson-Wheeler statistic, the permutation p-values) and the contents of
# Tables 1 to 3 (injection coordinates and counts, Stan priors). Where these matter the code fixes
# them, as noted below. The analysis code's README cites a later version of record (Nature,
# doi:10.1038/s41586-026-11026-0), not read here; its figure numbering differs (code Fig. E9 to
# E15 are preprint Figs. S12 to S18).
#
# Code read (Data and code availability; Methods, Data analysis):
# - github.com/AllenNeuralDynamics/aind-beh-ephys-analysis, commit 971c1ca (2026-10-05): all in vivo
#   physiology and behaviour analyses. Prep scripts in code/beh_ephys_analysis/session_combine/
#   figure_preparation (unit tables, go-cue metrics in basic_ephys_generation.py, go-cue and
#   baseline t-statistics in response_tstats_generation.py, outcome windows in
#   outcome_window_generation_parallel.py, outcome regressions in
#   beh_combined_outcome_generation.py, photometry regressions in photometry_generation.py),
#   figure notebooks in session_combine/manuscript_figures (F_*.ipynb, with printed outputs),
#   unit criteria in session_combine/metrics/*.json. It names DANDI:001950 as the home of the NWB
#   files.
# - github.com/AllenNeuralDynamics/aind_stan_fit_sim, commit 89371ee: the hierarchical Q-learning
#   model (code/stan_qLearning_5params.stan) and the posterior-averaged model variables (Q, RPE).
# - github.com/AllenNeuralDynamics/aind-fip-dff, commit 03ca4d2: photometry dF/F preprocessing.
# - github.com/AllenNeuralDynamics/LC-ephys-tonguemovements, commit f6dd736: reaction-time analysis.
# - github.com/AllenNeuralDynamics/locus_coeruleus_norepinephrine_neurons, commit 43f7083: an index
#   of the 16 Code Ocean capsules (anatomy, transcriptomics, Patch-seq, physiology). The anatomy
#   and transcriptomic capsules were not read.
#
# Data the paper used (as the paper reports them):
# - Anatomy and genes (not the subject of this dandiset): SPIM of H2B-labelled Dbh+ nuclei (34,998
#   cells, 8 mice); dense unilateral axon labelling; 130 complete single-neuron reconstructions (4
#   mice, ExA-SPIM); retrograde tracing from six targets (4 to 7 mice each); MAPseq/BARseq (2
#   brains); snRNAseq (398,912 nuclei, 40 mice, 4,845 LC-NE neurons); MERFISH of 2,221 LC-NE neurons
#   from Nardone et al. 2024 (4 mice); retro-seq; Patch-seq (96 cells, 28 mice).
# - Physiology (this dandiset, "Electrophysiology and fiber photometry"): Dbh-Cre mice, head-fixed,
#   in a dynamic foraging task. 42 mice (6 female) for behaviour, 28 (5 female) with
#   electrophysiology during the task, 14 (1 female) with axonal calcium recordings. Each trial has
#   a 0.5 s go cue (7.5 or 15 kHz; no-go cues with P = 0.05 in tetrode and photometry experiments,
#   treated as inter-trial interval), a 1.5 or 1.8 s response window, a left or right lick, reward
#   after a 300 ms delay (ephys) or 200 ms (photometry), with reward probabilities from {0.1, 0.5,
#   0.9} changing in blocks of 20 to 35 trials per spout; a trial with no lick is "ignored".
#   Spiking from tetrodes (Neuralynx, 32 kHz) or Neuropixels probes in right LC, with LC-NE neurons
#   identified by optogenetic tagging (ChR2, Chrimson or ChRmine) and, in some sessions,
#   projections to cortex identified by antidromic stimulation of frontal cortex with collision
#   tests. Unit locations in CCF coordinates (Neuropixels sessions with probe reconstruction).
#   Pupil video (22 to 24 frames/s, DeepLabCut edges) and tongue video (500 Hz, Lightning Pose) in
#   some sessions. Axonal GCaMP (axon-GCaMP6s or axon-jGCaMP8s) photometry from an optic fibre over
#   prelimbic cortex (PL), 488 nm and 405 nm (isosbestic) channels at 20 Hz each. The dandiset's
#   description also lists photometry from thalamus and cerebellum, which the paper does not
#   analyse. The behavioural analyses use 241 LC-NE neurons from 19 mice (Results, paragraph on
#   the go cue); Figure 6i has 9 mice with PL photometry.
#
# Definitions shared by the claims below (from the Methods unless marked as code):
# - Population. Identified LC-NE neurons recorded during the task. Methods (Electrode recording,
#   Optical identification, Drift control): ISI-violation ratio < 0.1 (0.2 for cortex-projecting
#   neurons), presence ratio > 0.8, amplitude cutoff < 0.1; tetrode units L-ratio < 0.05 and ISI
#   violations < 0.1%; light responses on early and late pulses with latency between 2 and 20 ms
#   and response probability > 0.55; light-evoked and spontaneous waveforms with correlation > 0.95
#   and normalised Euclidean distance < 0.35; periods with abrupt drift removed; neurons whose SD/mean
#   of rate in 300 s bins exceeds 0.3 excluded. The code (metrics/beh_all.json applied by
#   utils/combine_tools.py apply_qc, then the session filter metrics/beh_only.json) applies ISI <
#   0.1 (0.2 if antidromic tier 1), response probability minus baseline > 0.55, latency 2 to 20 ms,
#   correlation > 0.95, distance < 0.35, 4.5 < significant pulse counts < 6, drift sd < 0.3, 100 to
#   2000 trials, and sessions with at least 90 choices and fitted behaviour passing aN >= 0.15,
#   |bias| <= 1.25, p_sw_L >= 0.04; it does not apply presence ratio or amplitude cutoff. It prints
#   241 units, 19 mice, 106 sessions, the paper's numbers. Per the protocol the Methods population
#   is the main one and the code population a variant; when they give different outcomes the
#   claim is blocked as methods_underspecified. A unit label in the dataset that marks identified
#   LC-NE neurons may stand for either, once the author has checked its counts.
# - Trials. Go-cue trials; responded = a left or right lick in the response window, ignored = no
#   lick. Switch = a choice different from the previous choice; stay = the same.
# - Drift regressor (Methods, Drift control and Linear regression models of spike rates): the
#   deviation of each trial's mean waveform amplitude on the peak channel from the mode of the
#   amplitudes, added to every single-neuron regression. The code (drift_analysis.py) takes the
#   absolute deviation of the mean spike amplitude within 60 s of the trial from its mode (10-unit
#   bins) for the outcome model, and the signed amplitude for the go-cue models.
# - Space (Methods, Analyzing relationships with space). CCF coordinates (x, y, z) with ML replaced by
#   its absolute value; neurons with missing location removed; tests run only with at least 100
#   neurons (the 103 and 114 neurons of Figure 5 meet this). Linear model: OLS of the feature on
#   the three coordinates, R2, one-sided permutation p over B = 5000 permutations of the feature
#   (code 10000, seed 42; waveform notebook 2000). kNN: distance-weighted k-nearest-neighbour
#   regression, k = 20, 5-fold shuffled cross-validation, cross-validated R2 with a permutation p
#   (code seed 42; the waveform and cross-correlation notebooks use k = 30). The coefficient
#   vector of the linear model, normalised, is the primary spatial axis.
# - Directions. The criteria state directions anatomically (dorsal, anterior). In Allen CCFv3 the
#   DV coordinate grows ventrally and the AP coordinate posteriorly, so a coefficient pointing
#   dorsally is negative there. The code's printed axes (fig5d) suggest it uses coordinates that
#   grow dorsally and anteriorly. The author states the convention of the coordinates used, and
#   for fig5d, fig5h and figs18d projects on the code's axes only in the code's convention.
# - Behavioural model (Methods, Analyses and models of behavior; Behavioral model fitting). The
#   Q-learning model with separate learning rates after reward and no reward, a forgetting rate on
#   the unchosen value and softmax inverse temperature (code adds a side bias: 5 parameters, Stan
#   file stan_qLearning_5params.stan), fit hierarchically per mouse in Stan (16 chains, 5000
#   iterations, 2500 warmup); Q values and RPE (delta = R - Q of the chosen side) are averaged over
#   at least 1000 posterior draws run through the actual choices and outcomes. Qc is the chosen
#   value. The dataset's files were not opened, so whether they hold these model variables is the
#   author's to find; if not, the model is fit as above.
#
# Discrepancies between the preprint and its code that bear on the claims are named in each
# criterion. The paper also disagrees with itself in places: the GCaMP variant (Results
# "jGCaMP8s"; Methods "GCaMP6s, or jGCaMP8m" then "Axon-jGCaMP8s"); the legend of Figure S15f gives
# the same r and p for two different panels; Figure 6i reports 9 mice while the code's outcome
# regression prints 67 sessions from 7 mice.
schema_version: 2
