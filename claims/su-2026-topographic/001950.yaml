    nuclei, is a small dorsal region of 0.13 mm3 holding about two thirds of pontine NE neurons
    (1507 +- 55 per mouse, mean +- SD), with 367 +- 95 more in sub-coeruleus (34,998 cells, 8 mice).
  source: Results, LC-NE projections are spatially organized, paragraph 1; Figure 1a, 1b; Figure S1
  quote: We defined LC in the CCF as a small dorsal region (0.13 mm 3 in volume) containing
    approximately two-thirds of all pontine NE neurons (67th density percentile, 1507 ± 55, mean ±
    SD). Additional NE neurons were found in sub-coeruleus (367 ± 95)
  expected:
  - quantity: LC volume
    value: 0.13
    tolerance: 0.013
    unit: mm3
  - quantity: LC-NE neurons per mouse, mean
    value: 1507
    tolerance: 55
  - quantity: sub-coeruleus NE neurons per mouse, mean
    value: 367
    tolerance: 95
  criterion: The tolerances on the counts are the SD the paper gives. Uses the SPIM nucleus data,
    which this dandiset is not described as holding.
- id: fig1-axon-density
