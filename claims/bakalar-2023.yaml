- id: fig2a-pca-components
  statement: A principal component analysis of the homecage behaviours of PACAPko and control
    mice gives three components, explaining 45.95%, 14.55% and 13.56% of the variance (80.05%
    together).
  source: Results 3.1, Jumping and repetitive jumping, paragraph 1; Figure 2A legend
  quote: PC1 accounts for 45.95% of the variance, PC2 for 14.55%, and PC3 for 13.56%, for a
    cumulative 80.05% of variability accounted for by these components.
  expected:
