# Claims for Bakalar, Gavrilova, Jiang, Zhang, Roy, Williams, Liu, Wisser, Usdin & Eiden (2023),
# J Neuroendocrinol 35(11) e13286, on dandiset 001362.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21,
# protocol as stated in docs/protocol.md (pilot-10), Reader steps 1 to 4.
#
# Text read: the NIH author manuscript in PubMed Central (PMC10620107, NIHMS1900413), as served
# by ncbi_pmc: main text, Methods, figure legends 1 to 13 and Tables 1 to 5, and the one
# supplement file, the Supplemental Methods (NIHMS1900413-supplement-SUPP_METHODS.docx), which
# gives the whole-brain c-Fos pipeline and its statistics. Supplemental Figures 1 and 2 are
# images (cerebellar staining; DAPI in the IHC regions) and were not read; no claim rests on
# them. No PDF was supplied.
#
# Code read: the paper links one repository, CATNIP (https://github.com/snehashis-roy/CATNIP,
# commit 4fb92da2226ae6fd6b4e5172ea4a58c282bf8e53, 2024-10-02). It holds compiled MATLAB
# binaries with shell wrappers (CATNIP.sh and one script per step), six atlas versions
# (v1 to v3 are single-hemisphere sagittal atlases with 561 labels, matching the 561 regions
# of the Supplemental Methods) and a PDF manual that could not be read here (no PDF renderer).
# CATNIP.sh settles that FRST segmentation and cell counts are produced at a list of
# thresholds (--thr), that an optional exclusion mask removes the counts of labels it
# overlaps, and that counts per label are written per threshold. It does not hold the Python
# statistics (density, IQR outliers, Mann-Whitney U, BKY correction); that code is not linked.
#
# Data the paper used, as it reports them.
# - Whole-brain c-Fos (Figure 5, Table 4; the subject of this dandiset): constitutive
#   PACAPko mice and control PACAP fl/fl mice placed in the CleverSys homecage before lights
#   out and perfused 2 to 3 h after lights out (Figure 1 legend: 1.5 to 2.5 h). Brains cleared
#   by a modified iDISCO, stained for c-Fos, imaged on a LaVision UltraMicroscope II one
#   hemisphere at a time, sagittal, 5 um z steps, 3.7 um pixels; Richardson-Lucy deconvolved,
#   N4 corrected, registered to a customized Allen atlas of 561 regions and segmented by FRST
#   (CATNIP). Unit of analysis: the hemisphere. N = 8 hemispheres from 6 PACAP fl/fl animals
#   and 11 hemispheres from 6 PACAPko animals. Measure: c-Fos-positive cells per region
#   divided by region size (plotted as cells per cubic mm), in 431 regions. The dandiset's
#   description names Richardson-Lucy deconvolved, N4 corrected stacks and CATNIP derivatives;
#   its archive summary lists 13 subjects, the paper 12 animals.
# - Homecage Scan behaviour (Figures 2, 3, 4, 8, 10a, 11): time in each behaviour (distance
#   for travel) over the 12 dark hours; constitutive PACAPko and controls, tamoxifen-induced
#   CAG-Cre/Esr1::PACAP fl/fl (adult and postnatal day 1 to 3 inductions), Baf53b-Cre::PACAP
#   fl/fl, PACAPko from heterozygous dams, wheel-raised PACAPko.
# - c-Fos IHC sections (Figure 6): N = 4 wild-type C57BL/6N and 8 PACAPko mice.
# - qRT-PCR of Adcyap1, Xaf1 and Pttg1 in hypothalamus, hippocampus and cerebellum (Figure 7).
# - RNAscope Fos and Adcyap1 in PVN after restraint (Figure 9); HCR ISH in DG and STN (Figure
#   10c); weight loss 24 h after 3 h restraint (Figure 10b).
# - Telemetry of core body temperature and activity, 12-h averages over fed, 24-h fasted and
#   refed periods (Figures 12, 13): PACAPko against WT, Sim1-Cre::PACAP fl/fl against Cre-
#   littermates, PAC1ko against WT littermates.
# Only the whole-brain c-Fos claims (fig5-dg-fos, table4-lenient-regions,
# table4-region-values) concern the data the dandiset says it holds; the other claims are
# recorded to cover the paper's main findings.
#
# Details the paper leaves open for the c-Fos claims, with the readings named in the
# criteria: the FRST threshold used (chosen by an expert by eye, value not given); the region
# size divided by (the region's volume in that hemisphere's registered label image, or the
# atlas region volume); whether the 1.5 IQR outlier rule is applied within each genotype or
# to both pooled; which hemispheres were left out (6 animals gave 8 and 11 hemispheres); how
# "PACAPko as % of PACAPfl/fl" is formed (ratio of group means or of group medians); the
# alpha passed to the BKY correction (not stated; the statsmodels default is 0.05).
#
# Inconsistencies noticed in the paper: the Figure 2 legend says the PCA inputs are listed in
# Table 2, which holds TaqMan probes (Table 3 lists the behaviours); the Figure 5 legend points
# to Table 3 for the lenient-cutoff regions, which are in Table 4; the Table 4 title says
# regions with raw p <= 0.05 are shown, but every row has raw p <= 0.01; Methods 2.7 names
# PACAP fl/fl controls for c-Fos, while the Figure 6 IHC legend names wild-type C57BL/6N
# controls; Figure 12 prints F(1, 36) = 11.12 with p < 0.0001, while that F on those degrees
# of freedom gives p near 0.002.
