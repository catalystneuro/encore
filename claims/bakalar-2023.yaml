- id: fig7-cprg-expression
  statement: Adult induction does not change the cPRG Xaf1 and slightly increases Pttg1 in
    cerebellum; postnatal induction changes neither Pttg1 nor Xaf1 in any region.
  source: Results 3.2, Adult and early postnatal KO, paragraph 2; Figure 7A, 7B
  quote: Adult-induced PACAP depletion did not alter expression of the cPRG Xaf1 , upregulated
    in constitutive PACAPko mice. Pttg1, downregulated in constitutive PACAPko mice ( 14 ), was
