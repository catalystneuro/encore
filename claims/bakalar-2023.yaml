  criterion: Method from the Supplemental Methods (Statistical analysis) and the Figure 5
    legend. Unit is the hemisphere, PACAPko against PACAP fl/fl. CATNIP cell counts per region
    of the 561-region atlas; white matter tracts, nerves and ventricles, the cerebellum, SPVI
    and all layer 1 regions excluded, leaving 431 regions; counts of regions overlapping an
    artifact mask ignored; each count divided by the region's size (cells per cubic mm);
    outliers removed per region by the 1.5 IQR rule; scipy.stats.mannwhitneyu per region;
    statsmodels multipletests method "fdr_tsbky" over the 431 regions. The test is two-sided
    and exact, as Table 4 implies (raw p 2.65E-05 for U = 88 at 11 and 8 hemispheres is
    2/C(19,8), the exact two-sided value for complete separation); U is that of the PACAPko
    sample (88 = 11 x 8 is its maximum). Open details, each named reading run - (1) the FRST
    threshold, chosen by an expert by eye and not given; readings are the threshold the
    dataset's derivatives mark as used, or, if none is marked, every threshold the
    derivatives hold. (2) Region size; readings are (a) the region's volume in that
    hemisphere's registered label image, (b) the atlas region volume. (3) The IQR rule;
    readings are (a) within each genotype, (b) both genotypes pooled. (4) Which hemispheres;
    the paper used 8 and 11 hemispheres from 6 and 6 mice without saying which were left out
    or why; readings are (a) the hemispheres the dataset marks as used, if it does, (b) every
    hemisphere of the two genotypes in the dataset. (5) The percentage; readings are the ratio
    of group means and the ratio of group medians, after outlier removal. (6) The alpha of
    the BKY procedure, not stated; the statsmodels default 0.05 is used and the result at
    0.1 shown. Reproduced when, under the readings, DG-sg and DG-po both have PACAPko higher
    with BKY-adjusted p < 0.05; reported values within tolerance are reported and do not
    decide the outcome alone. Partially reproduced when one of the two holds. If the readings
    of (1) to (4) give different outcomes, the claim is blocked as methods_underspecified with
    every result shown.
