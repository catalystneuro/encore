    value: 45.95
    tolerance: 4.6
    unit: percent
  - quantity: variance explained by PC2
    value: 14.55
    tolerance: 1.46
    unit: percent
  - quantity: variance explained by PC3
    value: 13.56
    tolerance: 1.36
    unit: percent
  - quantity: cumulative variance of PC1 to PC3
    value: 80.05
    tolerance: 8.0
    unit: percent
  criterion: From the Figure 2 legend and Methods (Behavioral analysis). Inputs are the 16
    behaviours of Table 3 (the legend says Table 2, which holds the TaqMan probes), as time
    spent (distance for travel) over the 12 dark hours, for 38 PACAPko and 18 control mice
    pooled; each behaviour standardized to mean 0 and SD 1; the number of components chosen by
    parallel analysis. Open, could change the outcome - whether the components were rotated.
    The loadings of Table 3 (all positive, each behaviour high on one component) suggest a
    rotation, but none is named. Readings are (a) unrotated components, (b) varimax-rotated
    components. Reproduced when, under one reading, parallel analysis keeps three components
    and the variance values are within tolerance.
