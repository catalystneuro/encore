# Claims for Lee, Marchionni, Bezaire, Varga, Danielson, Lovett-Barron, Losonczy & Soltesz (2014),
# Neuron 82:1129-1144, on CRCNS data set hc-10 (doi:10.6080/K00P0WXQ).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-06,
# protocol as stated in docs/protocol.md (Reader).
#
# Text read: the version of record with its Supplemental Information, as supplied under paper/
# (PyMuPDF text of the journal PDF): Results, Discussion, Experimental Procedures, the legends
# of Figures 1 to 6 and S1 to S5, Table S1 and the Supplemental Experimental Procedures. The
# extracted text prints micrometres as "mm" and some minus signs as a replacement character.
# Values shown only in Figures S1E to S1H and S3F were read from the PDF pages (rendered here)
# and are marked as read from a figure.
#
# Code read: the model code the paper links, ModelDB accession 153280 ("superdeep", NEURON),
# downloaded from modeldb.science/download/153280 on 2026-11-06 (zip sha256 333fd221...fe405,
# README "Last updated on May 15, 2014"). It holds the cell templates, connectivity, stimulation
# and job scripts of the network model of Figures 4C to 4F and S3. It holds no analysis of the
# experimental recordings, so it fixes none of the criteria for the intrinsic properties. The
# lab page the paper also links (ivansolteszlab.org/models/superdeep.html, said to hold the
# simulation results and analysis procedures) is now a parked domain, and the Open Source
# Brain project page returns 404; neither was read.
#
# Data the paper used. Coronal hippocampal slices (300 um) from 2- to 3-month-old PV-TOM,
# PV-ChR2 and C57BL/6J mice of either sex, septal (AP -1.9 to -2.5 mm) and temporal (AP -3.1
# to -3.7 mm) CA1; recordings at 33 C, filtered at 3 kHz, digitized at 10 kHz (MultiClamp
# 700B, Digidata 1440A). PCs are superficial (sPC) or deep (dPC) by soma distance from the
# Pyr/Rad border (septal 0-20 and 20-40 um; temporal 0-50 and 50-200 um). Experiments: paired
# recordings PVBC to PC (euIPSC, uIPSC, CV, release probability, paired-pulse ratio, connection
# probability; Figure 1), PC to PVBC (euEPSC, connection probability; Figure 3), PVBC trains
# against PC firing in current clamp (Figure 4A, 4B), CCKBC to PC (Figure 5), PVBC to
# retrogradely labelled mPFC-, AMG- and MEC-projecting dPCs (Figure 6); bouton counts and
# morphology (Figures 1J to 1L, 2G to 2I, 5G, S1, S4, S5); optogenetic IPSCs (Figure 1N); in
# vivo two-photon GCaMP5 imaging of PV+ axons in 5 head-fixed running mice (Figure 2B to 2F);
# a NEURON network model of 1,000 sPCs, 1,000 dPCs and 36 PVBCs (Figure 4C to 4F, S3).
# Intrinsic properties (Figure S1E to S1H): sPC n = 8, dPC n = 9, held at -70 mV, 1 s steps
# (0 to +550 pA in 50 pA steps for firing; -100 to +100 pA for input resistance, steady state
# 0.8 to 1.0 s after step onset); voltages uncorrected for the +14.6 mV junction potential,
# which Table S1 subtracts.
#
# The CRCNS data set, by its description, holds ATF files of current-injection sweeps: for
# this paper 8 superficial and 9 deep PCs (steps -400 to +550 pA in 50 pA increments, the
# protocol of Supplemental Experimental Procedures 8A) and 6 PV+ basket cells; its other cells
# belong to other papers. Only the claims figs1e-if-curves, figs1f-input-resistance,
# figs1g-resting-potential, figs1h-sag, tables1-rheobase and figs3f-pvbc-firing concern those
# recordings. The other claims cover the paper's main findings, whose data the data set does
# not hold. The model claims need simulations of the ModelDB code (data with_inputs).
#
# Statistics, from Experimental Procedures, Statistical Analysis: two-tailed Student's t tests,
# paired or unpaired as appropriate, replaced by Wilcoxon signed-rank (paired) or Mann-Whitney
# (unpaired) when a group fails the Shapiro-Wilk test; Pearson's chi-square for connection
# probabilities, with Bonferroni-Holm correction for three groups (Figure 6G); ANOVA with
# Tukey-Kramer for Figures 6E, S5D and 4D to 4F; mean and SEM; significance at p < 0.05. The
# text does not say which test each comparison used, so `test` below names the rule. Where a
# mean is given with its SEM, the SEM is the tolerance.
schema_version: 2
