- id: figs1h-sag
  statement: Superficial PCs show larger sag potentials than deep PCs in response to large
    hyperpolarizing current pulses (about 8.7 against 5.6 mV).
  source: Results, PVBCs Preferentially Innervate Subpopulations of CA1 PCs, paragraph 2;
    Figure S1H
  quote: as reported before (Jarsky et al., 2008), larger sag potentials in response to large
    hyperpolarizing current pulses (Figure S1H)
  statistics:
  - test: two-tailed unpaired t test, or Mann-Whitney test when Shapiro-Wilk fails
    p: 0.05
    p_relation: <
    n: 8 sPCs and 9 dPCs
  expected:
  - quantity: sPC sag amplitude (read from Figure S1H)
    value: 8.7
    tolerance: 0.87
    unit: mV
  - quantity: dPC sag amplitude (read from Figure S1H)
    value: 5.6
    tolerance: 0.56
    unit: mV
  criterion: 'Sag amplitude is the difference between the peak hyperpolarization during the
    step and the steady state; the paper does not define the windows or the step. Steady state
    is taken as the mean at 0.8 to 1.0 s, the window the Supplemental Experimental Procedures 2B
    use for input resistance, and the peak as the most negative voltage in the step (a standard
    choice). The step is open; readings (a) -400 pA, the largest step of the protocol (Figure
    S3C plots sag against current down to -400 pA, and its biological values there are of the
    size of Figure S1H), (b) -300 pA, (c) -200 pA. Reproduced when, under one reading, sPC sag
    exceeds dPC sag by the paper''s rule (two-tailed unpaired t test, Mann-Whitney if
    Shapiro-Wilk fails, p < 0.05) and both means are within tolerance; partially reproduced when
    the difference holds under a reading but no reading puts both means within tolerance.'
