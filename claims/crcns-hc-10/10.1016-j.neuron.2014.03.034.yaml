- id: figs1e-if-curves
  statement: Superficial and deep CA1 PCs do not differ in firing frequency as a function of
    injected current (two-way ANOVA, p > 0.4; 8 sPCs, 9 dPCs).
  source: Results, PVBCs Preferentially Innervate Subpopulations of CA1 PCs, paragraph 2;
    Figure S1E and legend
  quote: There were no differences between dPCs and sPCs in terms of their firing frequency as a
    function of intracellularly injected current (Figure S1E)
  statistics:
  - test: two-way ANOVA
    p: 0.4
    p_relation: ">"
    n: 8 sPCs and 9 dPCs
  expected:
  - quantity: sPC firing frequency at +550 pA (read from Figure S1E)
    value: 31.5
    tolerance: 3.15
    unit: Hz
  - quantity: dPC firing frequency at +550 pA (read from Figure S1E)
    value: 30.5
    tolerance: 3.05
    unit: Hz
  criterion: 'From the Supplemental Experimental Procedures 2B, steps of 1 s from 0 to +550 pA
    in 50 pA increments, cells held at -70 mV; the data set''s steps from 0 to +550 pA are used.
    How firing frequency is computed is not stated. Readings: (a) spikes during the 1 s step
    divided by 1 s; (b) (spikes - 1) over the time from first to last spike, the form the
    Figure S3E legend implies for the model (31.06 Hz for 30 spikes). Spike detection is a
    standard choice (upward crossing of 0 mV) that cannot change the outcome. A claim of
    absence, judged on the paper''s test as written, a two-way ANOVA of firing frequency on
    group (sPC, dPC) and current step: reproduced when the group effect is not significant
    (p >= 0.05), not reproduced when it is; the effect size is reported either way, and a
    repeated-measures ANOVA is shown as a variant. The expected values, read from the figure,
    are checked as well under either reading.'
- id: figs1f-input-resistance
  statement: Superficial and deep PCs do not differ in input resistance (117 against 124 MOhm).
  source: Results, PVBCs Preferentially Innervate Subpopulations of CA1 PCs, paragraph 2;
    Figure S1F; Table S1
  quote: There were no differences between dPCs and sPCs in terms of their firing frequency as a
    function of intracellularly injected current (Figure S1E) and in input resistance (Figure
    S1F)
  expected:
  - quantity: sPC input resistance (Table S1, experimental)
    value: 117
    tolerance: 11.7
    unit: MOhm
  - quantity: dPC input resistance (Table S1, experimental)
    value: 124
    tolerance: 12.4
    unit: MOhm
  criterion: 'From the Supplemental Experimental Procedures 2B, voltage responses to 1 s steps
    from -100 to +100 pA in 50 pA increments, cells held at -70 mV, measured at steady state
    0.8 to 1.0 s after step onset. How resistance is computed from these responses is not
    stated. Readings: (a) the slope of a linear fit of steady-state voltage against current
    over the five steps; (b) the mean of the change from the pre-step baseline divided by the
    current, over the four non-zero steps. Per cell, then mean per group. Reproduced when, under
    one reading, both group means are within tolerance and the groups do not differ by the
    paper''s rule (two-tailed unpaired t test, Mann-Whitney if Shapiro-Wilk fails, p >= 0.05).
    Partially reproduced when the groups do not differ but a mean falls outside tolerance.'
