    tolerance: 0.06
  - quantity: r, ST-remapping maps
    value: 0.62
    tolerance: 0.062
  criterion: >-
    Methods, Prevalence of the perisaccadic effects. For each neuron with the effect in both
    response and model (from the fig6 claims), and each time t from saccade and latency tau,
    m(t, tau) is 1 when rates at latency tau after probes at the effect's location shown at t
    differ from rates at tau after the same probe shown -500 to -100 ms, in the effect's
    direction, by a one-sided Wilcoxon rank-sum test at p < 0.05 (the indicator equation is
    lost; this is the reading of its text), else 0; the map is the percentage of neurons
    with 1. Recorded rates are spike trains smoothed with a Gaussian of FWHM 33 ms; model rates
    the A-model's predicted rates (D6). Open, with readings. The grid of t and tau, (a) 1 ms
    steps, (b) 7 ms steps (one probe duration); the pixels correlated, (a) all t of the model
    span (-540 to 540 ms, get_info.m) and tau 1 to 150 ms, (b) t from -50 to 150 ms (the
    perisaccadic stimulus and spike windows of Methods, Model evaluation) and tau 1 to 150 ms.
    Pearson r across pixels. Reproduced when, under one combination of readings, all three
    r are within tolerance and p < 0.001; partially reproduced when all three are positive
    with p < 0.001 but one or more is outside tolerance.
- id: fig7-experimental-maps-lower
  statement: The recorded prevalence maps have lower values than the model-predicted maps,
    because smoothed recorded rates are more variable and fewer comparisons reach
    significance.
  source: Results, The model captures the spatial and temporal characteristics of the
    perisaccadic effects, paragraph 3; Figure 7A and 7B
  quote: >-
    This high variability means that fewer effects reach statistical significance, as
    reflected in the low values of the experimental maps in comparison with the
    model-predicted ones.
  data: with_labels
  depends_on:
  - fig7-prevalence-maps-correlate
  criterion: >-
    On the maps of fig7-prevalence-maps-correlate, under the reading it reproduced with (or
    reading a when none did). Reproduced when, for each of the three effects, the mean over
    pixels of the recorded map is below that of the model map; partially reproduced for two
    of the three.
- id: fig8c-example-neuron-detectability
  statement: In an example neuron, detectability of RF probes at ~60 ms latency is lost ~60 ms
    after the saccade; at about the same time FF and ST probes become detectable at ~100 ms
    latency, and from ~100 ms after the saccade the new RF (former FF) is detected at ~60 ms
    latency.
  source: Results, The model produces predictions about the time course and contribution of
    perisaccadic modulatory sources to the neuron's instantaneous firing rate, paragraph 4;
    Figure 8C
  quote: >-
    The neuron can detect stimuli presented in the RF location with a latency of ~60 ms; it
    loses its ability to detect stimuli in the original RF location after the saccade (~60 ms
    after saccade onset).
  data: with_labels
  depends_on:
  - fig6b-model-ff-remapping
  - fig6c-model-st-remapping
  criterion: >-
    The example neuron is not identified. Detectability by Methods, Spatiotemporal
    detectability analysis. 1000 sequences to the A-model (O6 a main), simulated history
    (ref [73]); for each probe, time t and latency tau, the AUC between predicted rates at t
    after a probe at that location at t - tau and the same rates paired with trial-shuffled
    stimuli; significance by a two-sample t-test of the AUC against 100 AUCs between two
    shuffled distributions, p < 1e-9. Candidates are the neurons with both FF- and
    ST-remapping in response and model; the paper does not say the example is one of them,
    so this is an assumption (the example shows FF and ST detection), and the other neurons
    of the 41 are searched as a variant and reported. Reproduced when at least one candidate shows, by
    significant detectability with peak at latency over 50 ms: RF peak latency 50-75 ms
    before the saccade, RF detectability ending between 30 and 100 ms after saccade onset, FF
    and ST peak latencies of 80 to 130 ms around that time, and FF detected at 50-75 ms
    latency from about 100 ms after the saccade. Partially reproduced when a candidate shows
    the RF loss and the long-latency FF or ST detection but not all four. The tolerance on
    the "~" times (plus or minus about 30 ms) is fixed here and is a reading of "~".
- id: fig8d-equal-detectability-at-55ms
  statement: For the example neuron 55 ms after the saccade, FF and ST probes reach peak
    detectability at longer latencies than the RF probe but with nearly equal peak values.
  source: Results, The model produces predictions about the time course and contribution of
    perisaccadic modulatory sources to the neuron's instantaneous firing rate, paragraph 4;
    Figure 8D
  quote: >-
    As seen, peak detectability at the FF and ST locations occurs at longer latencies than
    peak detectability for the RF location; however, peak detectability values for the FF
    and ST locations are nearly equal to the original RF.
  data: with_labels
  depends_on:
  - fig8c-example-neuron-detectability
  criterion: >-
    On the neuron fig8c-example-neuron-detectability matched, at t = 55 ms after saccade
    onset (Figure 8C legend), the latency and AUC at peak over tau for the RF, FF and ST
    probes. "Nearly equal" is not quantified in the paper; read here as FF and ST peak AUC
    within 10% of the RF peak AUC above chance (AUC minus 0.5). Reproduced when both FF and ST
    peak later than RF and both are nearly equal by that reading; partially reproduced when
    the latency order holds only. Not testable when no neuron matched.
- id: fig8e-example-neuron-time-course
  statement: The example neuron detects FF probes at ~90 ms latency from ~65 ms before the
    saccade, loses them 25 ms later, detects them again from ~13 ms after the saccade for ~60
    ms, and detects ST probes at ~130 ms latency from 66 to 130 ms after the saccade.
  source: Results, The model produces predictions about the time course and contribution of
    perisaccadic modulatory sources to the neuron's instantaneous firing rate, paragraph 5;
    Figure 8E, left
  quote: >-
    Next, ~65 ms before the saccade, the neuron can also detect stimuli presented at the FF
    location ~90 ms earlier (blue circles). This ability to detect FF stimuli disappears 25
    ms later, then reemerges ~13 ms after the saccade (with a latency of ~80–100 ms) and
    persists for ~60 ms.
  data: with_labels
  depends_on:
  - fig8c-example-neuron-detectability
  criterion: >-
    On the neuron fig8c-example-neuron-detectability matched, the maximum significant
    detectability over tau (only peaks at tau over 50 ms) and its latency at each t, smoothed
    over t with a 7 ms moving average (Methods, Spatiotemporal detectability analysis,
    paragraph 2), for the RF, FF and the probe closest to the ST. Reproduced when the FF and ST
    epochs and latencies quoted match within about 30 ms (the reading of "~" of
    fig8c-example-neuron-detectability); partially reproduced when the post-saccadic FF
    epoch and the ST epoch match but the presaccadic FF epoch does not. Not testable when no
    neuron matched.
- id: fig8e-population-ff-detectability
  statement: A synthetic neuron built from the FF-remapping subpopulation detects FF probes at
    60-90 ms latency from ~50 ms before to ~60 ms after the saccade, after which the FF latency
    returns to ~60 ms, the FF having become the new RF.
  source: Results, The model produces predictions about the time course and contribution of
    perisaccadic modulatory sources to the neuron's instantaneous firing rate, paragraph 6;
    Figure 8E, middle
  quote: >-
    From ~50 ms before to ~60 ms after a saccade, the population can detect FF stimuli with
    latencies of ~60–90 ms, indicating that the neural population is detecting stimuli
    appearing in the FF ~140 to ~0 ms before the saccade.
  data: with_labels
  depends_on:
  - fig6b-model-ff-remapping
  criterion: >-
    Methods, Spatiotemporal detectability analysis, paragraph 4. The A-model Gaussian
    parameters and c of the neurons with FF-remapping in both response and model, in units
    of probe spacing (the code's parameters are already in grid units, fmodel.m), averaged.
    The Methods say only that the variables were normalized by the probe distance; how the
    centres of neurons with different RF and FF probes are aligned before averaging is not
    stated. The centres are taken relative to each neuron's FF probe, an assumption;
    averaging absolute grid positions would mix neurons whose FF lies at different probes. a synthetic neuron with only
    the FF Gaussian (RF and ST amplitudes zero), detectability as
    fig8c-example-neuron-detectability with significance p < 1e-7. Which fixation kernel,
    post-spike and offset kernels, b0 and r_max the synthetic neuron uses is not stated.
    Readings, (a) the averages of those of the same neurons, (b) the fixation kernel set to
    zero and the rest averaged. Reproduced when, under one reading, significant FF
    detectability at 55 to 100 ms latency spans from 20 to 80 ms before to 30 to 90 ms after
    the saccade, and the latency is 50-75 ms after that; partially reproduced when the
    long-latency epoch holds and the return to short latency does not.
- id: fig8e-population-st-detectability
  statement: A synthetic neuron built from the ST-remapping subpopulation detects ST probes at
    long latencies (~100-120 ms) from 45 ms before to 15 ms after the saccade and again from 74
    to 114 ms after it.
  source: Results, The model produces predictions about the time course and contribution of
    perisaccadic modulatory sources to the neuron's instantaneous firing rate, paragraph 6;
    Figure 8E, right
  quote: >-
    Similar to the FF-remapping effect, the population can detect ST stimuli at longer
    latencies (~100–120 ms) from 45 before to 15 ms after a saccade and from 74 to 114 ms
    after a saccade.
  data: with_labels
  depends_on:
  - fig6c-model-st-remapping
  criterion: >-
    As fig8e-population-ff-detectability, with the ST Gaussian only, for the neurons with
    ST-remapping in both response and model. Reproduced when, under one reading, significant
    ST detectability at 90 to 130 ms latency occurs in two epochs within about 30 ms of
    -45 to 15 ms and 74 to 114 ms from saccade onset; partially reproduced when one of the two
    epochs matches.
- id: figs4-f-model-share-of-s-model
  statement: The F-model reaches about 60% of the S-model's performance in Delta LL per spike.
  source: S4 Fig legend
  quote: >-
    The F-model, despite being based on an approximation of the S-model, has a performance of
    the order of ~60% of the performance of the S-model, in terms of Δ LL / spk (see Fig 5A
    ).
  depends_on:
  - fig5a-s-model-perisaccadic-better
  - fig5a-f-model-perisaccadic-better
  data: with_labels
  expected:
    quantity: F-model Delta LL per spike as a share of the S-model's
    value: 60
    tolerance: 6
    unit: "%"
  criterion: >-
    The ratio of the mean F-model to the mean S-model Delta LL per spike over the 41 neurons
    from the fig5a claims. Which period is meant is not stated; readings, (a) fixation, (b)
    perisaccadic, (c) the two pooled. Reproduced when one reading is within tolerance.
- id: figs5-spike-history-no-effect
  statement: Using simulated or no spike history in place of the true history does not
    change the S-model's performance significantly in either period, and the S-model with
    either still predicts perisaccadic spikes better than fixation spikes.
  source: S5 Fig legend, panels B and C
  quote: >-
    There is no significant difference between the results obtained from the true-history
    model, the simulated-history model, and the no-history model.
  statistics:
  - about: true against no history, fixation (0.24 against 0.23 bits/spk)
    test: Wilcoxon signed-rank test
    p: 0.98
    n: 41 neurons
  - about: true against no history, perisaccadic (0.30 against 0.30 bits/spk)
    test: Wilcoxon signed-rank test
    p: 0.87
    n: 41 neurons
  - about: true against simulated history, fixation (0.24 against 0.23 bits/spk)
    test: Wilcoxon signed-rank test
    p: 0.48
    n: 41 neurons
  - about: true against simulated history, perisaccadic (0.30 against 0.29 bits/spk)
    test: Wilcoxon signed-rank test
    p: 0.99
    n: 41 neurons
  - about: no history, perisaccadic against fixation
    test: Wilcoxon signed-rank test
    p: 0.001
    p_relation: "<"
    n: 41 neurons
  - about: simulated history, perisaccadic against fixation
    test: Wilcoxon signed-rank test
    p: 0.001
    p_relation: "<"
    n: 41 neurons
  depends_on:
  - fig5a-s-model-perisaccadic-better
  expected:
  - quantity: no-history S-model Delta LL per spike, fixation
    value: 0.23
    tolerance: 0.02
    unit: bits/spk
  - quantity: no-history S-model Delta LL per spike, perisaccadic
    value: 0.3
    tolerance: 0.02
    unit: bits/spk
  - quantity: simulated-history S-model Delta LL per spike, fixation
    value: 0.23
    tolerance: 0.02
    unit: bits/spk
  - quantity: simulated-history S-model Delta LL per spike, perisaccadic
    value: 0.29
    tolerance: 0.02
    unit: bits/spk
  criterion: >-
    The fitted S-model of fig5a-s-model-perisaccadic-better evaluated on the same test
    trials with the history term removed (no history) or with history simulated by drawing
    spikes from the model rate step by step (ref [73], algorithm 2; the code's make_result.m
    make_resp), D5 and O5 as in that claim. The no-difference parts are claims of absence on
    the paper's test, a Wilcoxon signed-rank test over 41 neurons at p < 0.05. Reproduced when
    none of the four true-against-other tests is significant and both perisaccadic-against-
    fixation tests are significant with perisaccadic higher; not reproduced when any of the
    four finds a difference. The means are reported against the expected values.
- id: figs1-rf-centres
  statement: In leftward-saccade sessions the RF centres lie on average 5.81 dva right and
    5.23 dva below fixation; in rightward-saccade sessions 6.49 dva left and 7.44 dva below.
  source: S1 Fig legend, panel B
  quote: >-
    In the sessions where the saccades were made to the left, the average center of the
    receptive fields was 5.81 ± 3.63 (mean ± SD) dva rightward, and 5.23 ± 2.08 (mean ± SD)
    dva downward.
  data: with_inputs
  expected:
  - quantity: RF centre, leftward sessions, horizontal (rightward)
    value: 5.81
    tolerance: 0.58
    unit: dva
  - quantity: RF centre, leftward sessions, vertical (downward)
    value: 5.23
    tolerance: 0.52
    unit: dva
  - quantity: RF centre, rightward sessions, horizontal (leftward)
    value: 6.49
    tolerance: 0.65
    unit: dva
  - quantity: RF centre, rightward sessions, vertical (downward)
    value: 7.44
    tolerance: 0.74
    unit: dva
  criterion: >-
    RF maps from responses to each probe shown 700 to 140 ms before saccade, 50-70 ms after
    onset, interpolated by a factor of 1000, centre of the contour at 95% of the maximum (S1
