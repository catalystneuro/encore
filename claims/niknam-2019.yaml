- id: probe-locations-link
  kind: link
  statement: The RF, FF and ST probe of each neuron listed in the code repository's
    main_lists.mat correspond to the dataset's neurons, and the RF probe recomputed from the
    dataset by the Methods' definition matches the listed one.
  source: Methods, Receptive field, future field, and saccade target location estimation; code
    lib/models/fmodel.m (get_centers) at commit 1438dde
  data: with_labels
  criterion: >-
    Neurons are matched by session and channel (file name, and probe_list columns 1 and 2, as
    fmodel.m reads them). The link holds (reproduced) when all 41 analysed neurons are listed
    and, for at least 37 of them (90%), the probe with the highest mean spike count 50-75 ms
    after onset of probes shown -500 to -100 ms from saccade (D1, onset reading O2 i) is the
    listed RF probe or one of its eight neighbours; partially reproduced for 29 to 36; not
    reproduced below 29. For each neuron the FF minus RF offset is reported, with its sign
    taken as the saccade direction, against the paper's 27 leftward and 14 rightward neurons.
- id: methods-neuron-counts
  statement: Of 49 well-isolated MT neurons, 41 responded to the probes and were analysed;
    they come from 11 sessions, 27 neurons from 9 sessions with leftward saccades and 14 from 2
    sessions with rightward saccades.
  source: Methods, Experimental paradigm and data acquisition, paragraph 1
  quote: >-
    In total, data were recorded from 41 MT neurons during 11 recording sessions. In 9
    recording sessions, the saccades were made to the left (27 of 41 neurons), and in 2
    recording sessions, the saccades were made to the right (14 of 41 neurons).
  data: with_labels
  depends_on:
  - probe-locations-link
  expected:
  - quantity: neurons analysed
    value: 41
    tolerance: 0
  - quantity: sessions
    value: 11
    tolerance: 0
  - quantity: neurons with leftward saccades
    value: 27
    tolerance: 0
  - quantity: neurons with rightward saccades
    value: 14
    tolerance: 0
  criterion: >-
    Counts are exact, so no tolerance. Sessions are the first 8 digits of the file name
    (dataset description). Saccade direction is not a variable of the dataset; it is read as
    the sign of the horizontal FF minus RF offset from probe_list (O3 a), with the grid's
