# Claims for Niknam, Akbarian, Clark, Zamani, Noudoost & Nategh (2019), "Characterizing and
# dissociating multiple time-varying modulatory computations influencing neuronal activity",
# PLoS Comput Biol, doi:10.1371/journal.pcbi.1007275, tested on CRCNS:mt-3.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-11-11, protocol pilot-14 as stated in docs/protocol.md.
#
# Text read. paper/10.1371-journal.pcbi.1007275.txt, the version of record (PMC6759185, open
# access, Europe PMC full-text XML flattened). It holds the abstract, Introduction, Results,
# Discussion, Methods, the legends of Figures 1 to 8, the legends of S1 to S6 Fig and S1 to S3
# Movie, and the Data Availability statement. No PDF was supplied, so no figure could be read.
# The supplement figures themselves are not in the text, only their legends; the numbers the
# results rest on are in the Results text and the legends, so the supplement's absence does not
# block a claim. Lost in extraction: every displayed equation (Eqs 1 to 14, including the
# parameter-selection threshold, Eq 10; the classification measures of the dichotomous analysis;
# the prevalence-map indicator m(t, tau); the maximum-detectability definition) and the whole
# reference list, so ref [48] (the N-model), ref [49] (the McNemar mid-P test) and ref [73]
# (Chen et al., algorithm 2) are known only by number.
#
# Code. https://github.com/nnategh/SFA-Models, commit 1438dde9dd3207348ec0df1e5c4dd2a7b014e68e
# (2019-12-20), linked in Methods (A-model framework) and Data Availability. MATLAB. It holds
# the S-model fit (lib/models/smodel.m; parameter selection in lib/make/select_bases.m and
# decide_bases.m; coordinate-ascent fit in lib/make/fit_model.m; condition-wise
# train/validation/test split in lib/load/load_trials.m), the F-model fit
# (lib/models/fmodel.m), the A-model average (lib/models/amodel.m), Delta LL per spike
# (lib/get/get_dll.m), mean stimulus-aligned responses (lib/get/get_mean_resp.m) and plots. Its
# README restates the Methods. It holds no code for the N-model, the Wilcoxon tests, the
# McNemar test, the classification measures, the partial F-models, the robust regression, the
# prevalence maps, the ROC detectability analysis or the synthetic neurons. It also holds
# assets/data/*.mat (copies of the neuron files; not opened) and assets/data/main_lists.mat,
# whose probe_list fmodel.m reads as each neuron's RF, FF and ST probe (columns 3-4, 5-6,
# 7-8). Settings the code fixes where the Methods are silent: kernels span -540 to +540 ms from
# saccade and delays 1 to 150 ms (get_info.m); trials are split by condition, 35% of conditions
# for test, then 35% training and 30% validation (load_trials.m); the parameter-selection
# threshold is |mean - control mean| >= 1.5 control SD (make_profile.m, README Eq 10); r_max is
# fixed at 1000 spk/s and b0 = f^-1 of the mean rate over bins with a probe on screen
# (select_bases.m make_params, phi.m); F-model delay bins as in get_info.m lags; bounds for
# t >= 100 ms tie the RF Gaussian centre to the RF probe with spread at most 1 (fmodel.m); the
# F-kernel is smoothed with a 10-point moving average over delay (fmodel.m). Where the code
# and Methods disagree, the Methods are the main reading and the code a variant: get_fr0.m
# uses as NULL model the S-model's offset and post-spike kernels without stimulus kernels, the
# Methods a constant average rate; amodel.m averages kernels, the Methods average the
# Gaussian parameters; get_info.m sets num_folds = 1, the Methods fit ten S-models;
# get_mean_resp.m takes every ms a probe is on, the Methods take stimulus onset.
#
# Data the paper used (Methods, Experimental paradigm and data acquisition). Two adult male
# rhesus monkeys; 41 single MT neurons (of 49 isolated; 8 dropped for no probe response), 11
# sessions, saccades leftward in 9 sessions (27 neurons) and rightward in 2 (14 neurons).
# Visually guided saccade task, fixation point at centre, saccade target 10 deg horizontal,
# fixation 600-750 ms before the go cue. Throughout each trial (2100-2300 ms) white 0.5 deg
# probes flashed for 7 ms each, one at a time, on a 9 x 9 grid, in a pseudorandom order (a
# "condition") of 81 probes. Variables per neuron, per the dataset's description: stimcode
# (trial x ms, probe index 0-81), conds (condition per trial), resp (trial x ms spikes, 1 ms
# bins) and tsaccade (saccade onset per trial, ms). The grid geometry in dva, the saccade
# direction and the ST position on the grid are not among the variables the description lists;
# the RF, FF and ST probes are in the code repository's main_lists.mat (see O3).
#
# Shared definitions, cited, used by the criteria below.
# D1 Locations (Methods, Receptive field, future field, and saccade target location
#    estimation). RF is the probe with the highest firing rate for stimuli shown -500 to -100
#    ms from saccade, counted 50-75 ms after probe onset. FF is the RF probe shifted by the
#    rounded saccade vector. ST is, of the 4 x 4 probes around the target and excluding the FF
#    and its neighbours, the probe with the largest late (80-150 ms) increase for stimuli at
#    -50 to 0 ms against fixation.
# D2 Recorded effects (Methods, Statistical analysis of perisaccadic responses). Suppression is
#    a decrease in spike count 50-75 ms after an RF probe shown -30 to 0 ms from saccade onset,
#    against the same probe shown -500 to -100 ms. FF and ST remapping are increases in spike
#    count 80-150 ms after an FF or ST probe shown -50 to 0 ms, against -500 to -100 ms. Test
#    one-sided Wilcoxon signed-rank, p < 0.05, uncorrected, on spike counts.
# D3 Normalized responses (same section, paragraph 2). The response is the average
#    stimulus-aligned spike train 0-150 ms after onset; each neuron's perisaccadic and fixation
#    responses are divided by the mean of their two means over 0-150 ms, then averaged over
#    neurons; SE across neurons. Plots smooth with a Gaussian of FWHM 13 ms.
# D4 Models (Methods, S-model, F-model and A-model frameworks; code above). S-model, Eq 1 with
#    a sigmoid, 1 ms bins, B-spline bases with the knots stated in Methods, parameter
#    selection over 100 random 65% subsets against shuffled responses, block coordinate
#    ascent on training data while validation likelihood rises, test 35% withheld. F-model
#    fitted to the S-kernels per time and delay bin with the bounds stated in Methods,
#    fixation kernel from -400 to -300 ms. A-model from ten S-model and F-model fits on random
#    65% subsets with Gaussian parameters and c averaged. "Model" from Fig 6 on is the A-model
#    (Results, "From now on").
# D5 Delta LL per spike (Methods, Model evaluation). Point-process log-likelihood of the test
#    spikes with true spike history, minus that of a NULL model, divided by the spike count, in
#    bits. Perisaccadic spikes are those 0 to 150 ms after saccade onset, fixation spikes those
#    450 to 0 ms before.
# D6 Model-predicted effects (Methods, Statistical analysis of model predictions). 1000
#    stimulus sequences given to each fitted model with simulated spike history (ref [73],
#    algorithm 2; the code's make_result.m make_resp draws spikes from the rate step by step);
#    effects defined with the windows of D2 on the predicted rate, tested with a one-sided
#    Wilcoxon rank-sum test, p < 0.05; normalized as D3 on predicted rates.
#
# Open details, with the readings the text allows (each criterion names the ones it uses).
# O1 Pairing for the signed-rank test of D2. The Methods name a paired test but not the pairs.
#    (a) per trial, mean count over the trial's presentations in the perisaccadic window
#    against its mean over presentations in the fixation window, trials with both; (b) per
#    condition, the same pooled over the trials of each condition; (c) unpaired, all
#    presentations, one-sided rank-sum, the test the Methods use for model predictions. The
#    Methods name the signed-rank test for recorded responses, so (c) is a variant that is
#    shown but does not decide an outcome; "one reading of O1" below means (a) or (b).
# O2 What counts as a presentation. (i) the onset ms of each 7 ms probe (Methods, "stimulus
#    onset"); (ii) every ms the probe is on, as get_mean_resp.m does. (i) is the main reading.
# O3 RF, FF and ST probes. (a) probe_list in main_lists.mat of the code repository; (b)
#    recomputed by D1, possible for RF from the dataset alone, for FF and ST only with the
#    saccade vector and target position on the grid. (a) is the main reading; claim
#    probe-locations-link checks it.
# O4 The value reported for a subpopulation's normalized response. (a) mean over the effect's
#    window (50-75 ms or 80-150 ms after onset) of the normalized response, averaged over
#    neurons, the reading Fig 6's text states ("over the early response window"); (b) the
#    value at the peak, within that window, of the neuron-averaged curve smoothed as D3.
# O5 The NULL model of D5. (a) constant at the neuron's mean rate over all trials (r0 of the
#    S-model framework); (b) constant at the mean rate of the evaluated test trials; (c) the
#    code's get_fr0.m (offset and post-spike kernels without stimulus kernels), a variant.
#    Whether D5 is pooled over all test trials of a neuron or averaged per trial is settled
#    by get_dll.m: pooled.
# O6 The sequences of D6, "the same as those for the experimental paradigm". (a) the
#    recorded conditions resampled, each with a recorded saccade time; (b) new pseudorandom
#    81-probe sequences of 7 ms probes, saccade at a recorded time drawn at random.
# O7 Nulling a source in the partial F-models (Methods, The perisaccadic to fixation
#    performance ratio analysis, paragraph 2). (a) for each time and delay bin, the Gaussian's
#    parameters taken from a randomly drawn time between -400 and -300 ms at the same delay
#    bin; (b) one randomly drawn fixation time per model, used for all times.
# O8 The N-model (ref [48]). This paper does not describe its fitting beyond Fig 4 and the
#    Results paragraph on it, the code holds none, and the reference list is missing from the
#    text read. The author takes it from ref [48] if it can be identified (the Introduction
#    calls it the nonstationary generalized linear model, NSGLM, of the same group); if not,
#    claims that need it are blocked.
