# Claims for Zaki et al. (2024), "Offline ensemble co-reactivation links memories across days",
# Nature 637, 145-155 (issue of January 2025, published online 6 November 2024), on dandiset 000718.
# Source: the full text, open access under CC BY (PMC11666460), read from its Results, figure and
# Extended Data legends and Methods.
# Quotes and statistics added 2026-10-19 from the full text (Europe PMC PMC11666460).
#
# When these criteria were written, the author had seen the data check only: the file list and
# metadata of version 0.260825.1902, the contents of every NWB file, the ranges and timestamps of
# the deconvolved traces, the sleep-state intervals of the three offline sessions (wake and quiet
# wake only), the cell registration tables of mouse Ca_EEG2-1 and the sizes of the four ensembles
# they give for its offline session (97 neutral, 80 aversive, 166 overlap, 282 remaining), the
# agreement of registered ROI centroids, the telemetry around the fear conditioning epoch, and,
# from the freezing check, the freezing fraction of four sessions (FC of both mice, neutral exposure
# of Ca_EEG2-1, and Recall2 of Ca_EEG3-4, 15.1%). The last of these is one of the four values the
# source-data-link claim compares. No burst, shuffle, locomotion or co-bursting analysis had been
# run. The author had also read the per-mouse values in the paper's source-data repository
# (denisecailab/RetrospectiveMemoryLinkingData_2024 at commit a508164), which list both deposited
# mice in Figure 5c and Extended Data Figure 9.
#
# The dandiset holds two of the nine mice of the calcium imaging and EEG/EMG experiment (Figure 5,
# Extended Data Figures 9 and 10): Ca_EEG2-1 (1.5 mA, high shock) and Ca_EEG3-4 (0.25 mA, low shock).
# For Ca_EEG2-1 it holds neutral encoding, aversive encoding (FC), aversive recall (Recall1), the
# first of the 24 offline recordings after aversive encoding, the cell registration of the 19
# offline-day-2 recordings with the encoding and recall sessions, and a week of telemetry. For
# Ca_EEG3-4 it holds the five encoding and recall sessions and the first offline recording of each
# day, without cell registration. None of the mice of the one-hour offline experiments (Figures 2 to
# 4 and 6, Extended Data Figures 3, 4, 7), the behaviour-only experiments, or the inhibitory tagging
# and no-shock experiments are in it.
#
# Method choices fixed here from the Methods (the analysis code the paper names is not public):
# deconvolved activity; each cell z-scored over time (cells without activity left out); the mean
# over cells, z-scored, gives the population trace; a burst event is a maximal run of frames above
# z = 2; a cell or an ensemble participates in an event when its z-scored activity exceeds 2 at any
# frame of the event; ensembles of an offline cell come from the cell registration (matched to
# neutral encoding only, to FC only, to both, or to neither).
schema_version: 1
dandiset: "000718"
paper: doi:10.1038/s41586-024-08168-4
claims:
- id: source-data-link
  statement: The two deposited mice are the mice of the same names in the paper's per-mouse source
    data, with the same shock group, and the freezing computed from the dandiset's freezing intervals
    agrees with the per-mouse freezing the paper reports for them.
  source: Extended Data Figure 9b and 9c; source-data repository denisecailab/RetrospectiveMemoryLinkingData_2024
  data: with_inputs
  expected:
  - quantity: Ca_EEG2-1 freezing during aversive recall (ExtData9b.csv)
    value: 63.87
    tolerance: 6.39
    unit: percent
  - quantity: Ca_EEG3-4 freezing during aversive recall (ExtData9b.csv)
    value: 8.46
    tolerance: 0.85
    unit: percent
  - quantity: Ca_EEG3-4 freezing during neutral recall (ExtData9c.csv)
    value: 16.90
    tolerance: 1.69
    unit: percent
  - quantity: Ca_EEG3-4 freezing during novel-context exposure (ExtData9c.csv)
    value: 14.60
    tolerance: 1.46
    unit: percent
  criterion: Records are matched by the mouse name (subject_id in the files, Mouse in the CSV
    files). The session descriptions name the context of each recall session. Freezing is read in
    two ways, (a) the percentage of MotionSeries frames that fall inside a freezing interval and (b)
    the summed duration of the freezing intervals over the duration of the MotionSeries. Reproduced
    when both mice are found, their shock amplitude in the files matches the source data's group,
    and all four values are within tolerance under one reading; partially reproduced when two or
    three are; not reproduced otherwise.
- id: ed9b-aversive-freezing-high-vs-low
  statement: In the calcium imaging and EEG/EMG experiment, high-shock mice froze more during
    aversive recall than low-shock mice (t7 = 8.99, p = 0.020).
  source: Extended Data Figure 9b
  quote: High-shock mice froze more during Aversive recall than low-shock mice
  statistics:
  - statistic: t7 = 8.99
    p: 0.020
    n: 4 low-shock and 5 high-shock mice
  criterion: The dandiset holds one mouse per group, so the paper's t-test cannot be run. Freezing
    as in source-data-link reading (a), in Recall1 (the aversive context). Reproduced when the
    high-shock mouse (Ca_EEG2-1) freezes more than the low-shock mouse (Ca_EEG3-4) and the
    per-30-s-bin freezing of the two sessions (10 bins each) differs by a two-sided Mann-Whitney test
    at p < 0.05; partially reproduced when only the direction holds; not reproduced otherwise.
- id: offline-bursts-above-shuffle
  statement: During offline periods, hippocampal population bursts occur more often than expected
    from shuffled neuronal activity, so CA1 neurons fire in a more coordinated way than chance.
  source: Results, Neutral ensemble recruited into population bursts, paragraph 1; Extended Data
    Figure 3l and 3m
  quote: True burst frequencies were greater than shuffled burst frequencies in every mouse ...
    suggesting that during the offline period, hippocampal CA1 neurons fire in a more coordinated
    manner than would be expected from shuffled neuronal activities
  statistics:
  - statistic: t7 = 6.159
    p: 0.000463
    n: 8 mice
  criterion: In each of the three deposited offline recordings, burst frequency (events per minute)
    of the population trace, compared with 1000 surrogates in which each cell's trace is circularly
    shifted by an independent random offset and the population trace is recomputed and z-scored as
    for the data. Reproduced when the true frequency exceeds the 95th percentile of the surrogates in
    all three recordings; partially reproduced when it exceeds the surrogate mean in all three but
    the 95th percentile in fewer; not reproduced otherwise.
- id: offline-skew-above-shuffle
  statement: The mean population activity during offline periods is more right-skewed than in
    shuffled data, showing brief burst-like activations that need coordinated activity of groups of
    neurons.
  source: Extended Data Figure 3n and 3o
  quote: The true skew was greater than the shuffled skew in every mouse ... supporting the idea
    that the mean population activity undergoes brief burst-like activations requiring the
    coordinated activity of groups of neurons
  statistics:
  - statistic: t7 = 13.36
    p: 0.000003
    n: 8 mice
  criterion: As offline-bursts-above-shuffle, with the skewness of the population trace (scipy.stats.skew)
    in place of the burst frequency, and the same thresholds for the three outcomes.
- id: burst-locomotion-pause
  statement: Offline population bursts coincide with the mouse briefly slowing down about 1 s
    before the burst and resuming its movement about 1 to 2 s later.
  source: Figure 2d and 2e; Extended Data Figure 6e; Results, Co-reactivation occurs more during
    wake, paragraph 1
  quote: Mice showed a robust and brief slowing down around 1 s before each burst event, before
    increasing locomotion back up around 2 s later.
  criterion: Movement is the magnitude of the telemetry ActivitySignal (the absolute value, averaged
    in 100 ms bins), the only movement measure in the offline files. Time zero of a burst is read
    two ways, (a) the frame of peak population activity and (b) the first frame of the event. For
    each burst with both windows inside the recording, the mean movement from 1 s before to time
    zero is compared with the mean from 5 s to 3 s before, by a one-sided Wilcoxon signed-rank test
    (lower before the burst). Reproduced when p < 0.05 in all three offline recordings under one
    reading; partially reproduced when it holds in one or two; not reproduced otherwise. The mean
    movement trace from 5 s before to 5 s after time zero is shown, with the same windows around
    random times as a reference.
- id: fig5c-wake-overlap-neutral-coburst
  statement: After a strong (high-shock) aversive experience, during wake in the offline period the
    overlap ensemble co-bursts more with the neutral ensemble than with the aversive ensemble (t4 =
    4.94, P = 0.016).
  source: Figure 5c (left); Methods, "Ensemble co-participation analysis"
  quote: Left, wake high-shock mice had higher co-bursting of overlap × neutral than overlap ×
    aversive
  statistics:
  - statistic: t4 = 4.94
    p: 0.016
    n: 5 high-shock mice
  criterion: Tested on the one deposited high-shock mouse (Ca_EEG2-1) and its one deposited offline
    recording after aversive encoding (the first of 24). A burst is assigned the sleep state of its
    peak frame. Two readings of wake, (a) wake and quiet wake together and (b) wake alone, and two
    readings of a co-participation, (i) both ensembles participate, whatever the third does, and
    (ii) both participate and the third does not. Over the wake bursts, the percentage with overlap
    and neutral co-participation (OxN) and with overlap and aversive co-participation (OxA).
    Reproduced when OxN > OxA under one reading and an exact McNemar test across those bursts gives p
    < 0.05; partially reproduced when OxN > OxA under one reading without that; not reproduced when
    OxN <= OxA under every reading.
