    a minimum 18 ms before offset and dropping below its average level during singing 48 ms
    before offset.
  source: Results, Song-related activity in Uva, paragraph 4; Fig 6C and 6E; S2 and S3 Figs
  quote: a significant decrease prior to syllable offsets ( Fig 6B ; significant for each bird
    recorded; n = 5) ... The decrease in Uva activity at syllable offsets reaches a minimum
    18±1ms (±SEM) prior to the offset ( Fig 6D ) and drops significantly below average Uva
    activity during singing 48±8ms prior to the offset
  statistics:
  - test: paired t-test
    p: 0.01
    p_relation: "<"
    n: each of 5 birds
  expected:
  - quantity: time of MUA minimum before syllable offset, mean over birds
    value: 18
    tolerance: 1
    unit: ms
  - quantity: time MUA drops below the singing average before offset, mean over birds
    value: 48
    tolerance: 8
    unit: ms
  criterion: As fig6-peak-before-onset, aligned to syllable offsets, with the minimum and a
    downward crossing of the 95% band, and for the test the 50 ms before offset (the span of
    the reported drop) against the rendition's bout mean, reading (a), or against the 40 ms
    before the next onset, reading (b). The p < 0.01 of the paper is printed with the onset
    increase; the offset decrease is read as tested the same way.
- id: fig7a-correlation-with-amplitude
  statement: Uva activity correlates with song amplitude (peak correlation 0.40) and leads it
    by 42 ms.
  source: Results, Song-related activity in Uva, paragraph 4; Fig 7A
  quote: Uva activity is also strongly correlated with song amplitude (magnitude of peak
    correlation ... 0.40±0.04), with a latency of 42±6ms ( Fig 7A , ± S.D)
  expected:
  - quantity: magnitude of peak correlation, MUA with song amplitude
    value: 0.4
    tolerance: 0.04
  - quantity: lag at peak correlation, MUA leading amplitude
    value: 42
    tolerance: 6
    unit: ms
  criterion: Tolerances are the paper's SDs. Cross-correlation of MUA with sound amplitude
    during singing, per bird, averaged over 5 birds (Fig 7A). Open; the amplitude, readings as
    in the header; the segments, readings (a) bouts, (b) motifs; the normalization, Pearson
    correlation at each lag. Reproduced when under one reading the peak magnitude and its lag
    (MUA first) are within tolerance.
- id: spectral-features-weak
  statement: None of six spectral song features correlates significantly with Uva activity
    within a bird; pooled over birds only amplitude (r = 0.18) and gravity center (r = 0.17)
    do, after Bonferroni correction.
  source: Results, Song-related activity in Uva, paragraph 5
  quote: None of these six spectral features is significantly correlated with Uva activity in
    individual birds. When combined across all birds, only amplitude (r = 0.18) and gravity
    center (r = 0.17) exhibit significant correlation after Bonferroni correction for multiple
    comparisons (6 comparisons; p<0.008)
  statistics:
  - about: amplitude and gravity center, all birds combined
    test: correlation
    statistic: r = 0.18 and r = 0.17
    p: 0.008
    p_relation: "<"
    corrected: Bonferroni, 6 comparisons
  expected:
  - quantity: correlation of MUA with amplitude, all birds
    value: 0.18
    tolerance: 0.018
  - quantity: correlation of MUA with gravity center, all birds
    value: 0.17
    tolerance: 0.017
  criterion: Features (pitch goodness, Wiener entropy, amplitude, amplitude modulation,
    frequency modulation, gravity center) are not defined in the paper, which cites ref 49 for
    the analysis; read as defined in Sound Analysis Pro, which the Methods name for recording,
    an assumption; windows from 10 ms after syllable onset to 10 ms before offset; MUA
    taken 42 ms earlier than the song (Results, paragraph 5). Open; the unit of correlation,
    readings (a) per syllable rendition, the mean feature against the mean MUA, (b) per time
    bin (1 ms) within the windows; for (a) features z-scored within syllable type before
    pooling as a variant. Pearson r, Bonferroni over 6 features (alpha 0.05/6). Reproduced
    when under one reading no feature passes in any single bird, and in the pooled data
    amplitude and gravity center pass with r within tolerance and the other four do not.
- id: fig7b-10hz-power-peaks
  statement: Song amplitude and Uva activity both have a broad spectral peak near 10 Hz, at 8.0
    Hz for song and 8.8 Hz for Uva.
  source: Results, Song-related activity in Uva, paragraph 6; Fig 7B
  quote: we found that the song amplitude profile of our adult birds exhibits a broad spectral
    peak near this frequency ( Fig 7B ; peak of average song rhythm spectrum at 8.0Hz). Notably,
    Uva multiunit activity also exhibits peaks at nearly the same frequency (8.8Hz)
  expected:
  - quantity: peak frequency of the average song amplitude spectrum
    value: 8.0
    tolerance: 0.8
    unit: Hz
  - quantity: peak frequency of the average MUA spectrum
    value: 8.8
    tolerance: 0.88
    unit: Hz
  criterion: Power spectra as in the header (Spectra), normalized and averaged over 5 birds
    (Fig 7B). The peak is the maximum of the average normalized spectrum above 3 Hz (the bound
    of Song rhythmicity) and below 30 Hz (a standard window for a "near 10 Hz" peak). Open;
    the normalization, readings (a) by the sum of the spectrum, as for long syllables
    (Rhythmicity, paragraph 2), (b) by bout length, as for song rhythm; the segments as in the
    header. Reproduced when under one reading both peaks are within tolerance.
- id: fig7d-10hz-coherence
  statement: Uva activity and song amplitude are significantly coherent near 10 Hz (peak at
    8.8 Hz, coherence 0.75, p < 0.01, phase -0.77 pi), with a large peak in their
    cross-spectrum.
  source: Results, Song-related activity in Uva, paragraph 6; Fig 7C and 7D
  quote: Further analysis reveals a large peak in the cross spectral density between multiunit
    activity and song amplitude, as well as a significant coherency at this frequency (F peak =
    8.8Hz, C peak = 0.75, p<0.01, phase = -0.77π)
  statistics:
  - test: coherency against a null of randomly shifted MUA, corrected for multiple testing
    p: 0.01
    p_relation: "<"
    n: 5 birds
  expected:
  - quantity: frequency of peak coherency
    value: 8.8
    tolerance: 0.88
    unit: Hz
  - quantity: peak coherency
    value: 0.75
    tolerance: 0.075
  - quantity: phase at peak coherency
    value: -0.77
    tolerance: 0.077
    unit: pi radians
  criterion: Coherency and cross-spectrum of MUA with song amplitude by Chronux with [2 1]
    tapers, averaged over birds; null by random shifts of MUA relative to amplitude, 1000
    times (Rhythmicity, paragraph 1), with the 95th percentile corrected for multiple testing
    by taking it on the maximum over frequencies (Fig 7D legend gives the correction but not
    its form; this is a standard choice). Peak between 3 and 30 Hz (a standard window, as for
    fig7b-10hz-power-peaks). Phase sign as Chronux
    returns it; the opposite convention is shown. Reproduced when under one reading of the
    segments and amplitude the peak frequency, coherency and phase are within tolerance and
    the peak exceeds the null at p < 0.01.
- id: fig8-no-gte-relation
  statement: Uva activity shows no significant correlation with gesture trajectory extrema
    (GTEs), in single birds or averaged across birds, against GTE times shuffled within
    syllables.
  source: Results, Song-related activity in Uva, paragraph 7; Fig 8D to 8F
  quote: No significant peaks are observed in this correlation within individual birds or
    averaged across birds, compared to surrogate datasets in which GTE times are randomly
    shuffled within song syllables
  criterion: A claim of absence, judged on the paper's test. GTE times from the automated
    method of Boari et al. (ref 50, a published model of the syrinx; no code linked, so the
    authors' published implementation is to be used if public). Cross-correlation of MUA with
    the GTE train, against 1000 surrogates (a standard number) where the GTE count is
    redistributed across syllables in proportion to their length and then placed at random
    within syllables, GTEs at syllable onsets and offsets kept in place (GTE analysis); the
    band is the 99% interval of the surrogates (Fig 8E and 8F legend), lags within +-100 ms (a
    standard window). Reproduced when no lag leaves the band in any bird or in the average;
    not reproduced when one does. The largest excursion is reported.
- id: fig9-long-syllable-gamma
  statement: In long syllables (> 150 ms; 13 syllables, 43% of song syllables) Uva activity
    can oscillate fast; 8 of 13 have a significant spectral peak above 10 Hz, at 17 to 51 Hz,
    and Uva activity is coherent with song amplitude from 1 to 55 Hz.
  source: Results, Song-related activity in Uva, paragraph 8; Fig 9A to 9D; S4 Fig
  quote: analysis done for 13 syllables longer than 150ms, in order to provide adequate sample
    duration; this was 43% of all song syllables). Of these 13 syllables, 8 syllables show a
    significant peak in the spectrum of the neural activity greater than 10Hz. These peaks
    occur at frequencies ranging from 17 to 51Hz. Notably, in individual syllables, Uva
    activity and sound amplitude are found to be significantly coherent across a broad range
    of frequencies (1-55Hz)
  expected:
  - quantity: syllable types longer than 150 ms
    value: 13
    tolerance: 1.3
  - quantity: fraction of song syllable types longer than 150 ms
    value: 0.43
    tolerance: 0.043
  - quantity: long syllables with a significant MUA peak above 10 Hz
    value: 8
    tolerance: 0.8
    unit: of 13
  - quantity: frequencies of those peaks
    value: 17
    tolerance: 1.7
    unit: Hz (lower bound)
  - quantity: frequencies of those peaks
    value: 51
    tolerance: 5.1
    unit: Hz (upper bound)
  criterion: Long syllables are syllable types whose duration exceeds 150 ms; spectra of MUA
    and amplitude from onset to 50 ms before offset, normalized by their sum; null by
    scrambling MUA then smoothing at 2 ms (Rhythmicity, paragraph 2); significance against the
    95% band for maxima anywhere in the window (Fig 9 legend). Open; "syllable" as a type
    pooled over renditions (the counts 13 and 43%), or renditions; length as the median
    duration of the type. The counts can only be matched on the 5 birds; with fewer birds the
    fractions are compared (8/13 = 0.62, tolerance 10%), with peaks within 15.3 to 56.1 Hz.
    The coherence part holds when the across-bird average coherence exceeds the null band
    without a break from 1.1 to 49.5 Hz (the reported 1 to 55 Hz, each bound moved inward by
    10%); the range where it does is reported. The Fig 9 legend gives the band for the
    coherence panels, and the null of scrambled MUA is the Methods' null for the neural
    spectrum; the same form of band is used for both.
- id: bout-offset-suppression
  statement: Uva activity is transiently suppressed for about 200 ms after bout offsets.
  source: Results, Song-related activity in Uva, paragraph 9; S5 Fig; Fig 4A legend
  quote: We did find, however, that Uva activity was transiently suppressed following bout
    offsets for a period of approximately 200ms
  expected:
  - quantity: duration of suppression after bout offset
    value: 200
    tolerance: 20
    unit: ms
  criterion: MUA aligned to bout offsets (bouts per the Segmentation method) and averaged,
    against the baseline during non-singing from random shuffling of MUA, with its 95% band
    for maxima and minima (S5 Fig legend); shuffle readings as in the header, with the random
    times taken outside singing. Suppression lasts from offset until the average returns into
    the band. Reproduced when the average falls below the band after offset and the duration
    is within tolerance.
- id: no-motif-bout-signal
  statement: Uva shows little activation related to the onsets or offsets of motifs or bouts.
  source: Results, Song-related activity in Uva, paragraph 9
  quote: Finally, we find little evidence for activation in Uva related to the onsets or offsets
    of longer timescale song structures, such as song motifs or bouts
  depends_on:
  - fig6-peak-before-onset
  criterion: A claim of absence; the paper names no test. As for syllables (Fig 6), MUA
    aligned to motif onsets and offsets, and to bout onsets and offsets, against the
    Shuffled baseline. The paper's comparison is the syllable-level signal. Reproduced when
    the peak before motif and bout onsets is no larger than the peak before other syllable
    onsets (two-sample t-test over renditions at p < 0.05; the paper names no test for this,
    so test and level are a standard choice), and no
    excursion above the band follows motif or bout offsets; not reproduced otherwise. The
    suppression after bout offsets (bout-offset-suppression) is not activation and does not
    count against the claim. Introductory notes before bouts are excluded from the bout-onset
    alignment, as their activation is a separate finding (fig4b-introductory-note-premotor).
