# Claims for Danish, Aronov & Fee (2017), PLoS ONE 12(6), e0169568, tested on CRCNS aa-3.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-11-11, protocol pilot-14 as stated in docs/protocol.md.
#
# Text read: the version of record (PMC5472270, Europe PMC full-text XML, flattened), with its
# main text, figure legends, Materials and methods, and the legends of the supporting
# information (S1 Video, S1 Fig to S5 Fig). The supporting figures themselves were not needed;
# no supplementary text beyond these legends exists. No PDF was supplied.
#
# Code: the paper links no code ("All data analyses were performed with custom MATLAB
# software"). The spectral analyses use the Chronux package (ref 77), and the GTE times the
# automated method of Boari et al. (ref 50); neither is linked to a version. The CRCNS
# data description says the dataset holds MATLAB conversion and plotting scripts; they are
# part of the dataset's files and were not read here.
#
# Data the paper used, as it reports them. Subjects are adult male zebra finches (>90 dph).
# (1) Lesions: bilateral electrolytic Uva lesions in 7 birds (lesions > 90% only), and control
# lesions 250 um dorsal (2 birds) or 200 um ventral (2 birds) to Uva. Song recorded in sound
# isolation chambers for several days before surgery and for up to a week from the first day
# of singing after it, undirected (social isolation) and directed (a female presented).
# Measured from audio: syllable and gap durations, goodness of fit to an exponential (Gamma),
# maturity index M and song rhythmicity R. (2) Recordings: multiunit activity in the
# HVC-projecting core of Uva, right hemisphere, motorized microdrive, in 5 freely singing
# birds; sites recorded at successive depths along a penetration; Uva identified by
# antidromic stimulation from HVC. Single units only off song (4 HVC-projecting neurons in 2
# birds; 5 neurons dorsal or ventral to Uva). Audio and neural signal at 40 kHz. The archive's
# description of CRCNS aa-3 says it holds multiunit recordings from 3 birds during singing,
# with syllable segmentations, and pre- and post-lesion song as .wav files; it does not say
# which lesion birds, or whether control lesions and directed song are included.
#
# Common methods, from the Materials and methods; criteria refer to them by name.
# - Multiunit activity (MUA): the recorded signal (hardware band-pass 300 Hz to 15 kHz)
#   rectified and smoothed with a 2 ms (SD) Gaussian (Chronic neural recordings; Rhythmicity).
# - Sound amplitude: audio band-passed 1 to 4 kHz, squared, smoothed with a 2.5 ms (SD)
#   Gaussian, and in dB as 10 log10 (Sound analysis). The Rhythmicity section instead says
#   the sound waveform was rectified and smoothed with a 2 ms (SD) Gaussian. Open for the
#   spectral and correlation claims; readings (a) the Sound analysis amplitude in dB, (b) the
#   same without the log, (c) the rectified audio smoothed at 2 ms.
# - Segmentation: threshold at the Fisher discriminant of two Gaussian modes fit by EM to the
#   log-amplitude; onsets and offsets at the nearest points 2 SD from noise; sounds separated
#   by < 7 ms merged; sounds < 7 ms dropped; bouts are syllable sequences with gaps <= 300 ms;
#   renditions with noise or female calls removed; onsets and offsets checked by hand (Sound
#   analysis). Where segmentations made by the authors are in the dataset they are used;
#   otherwise this procedure is run.
# - Time warping: piecewise linear warping of MUA between syllable onsets and offsets onto a
#   template motif, the motif whose length is closest to the median (Time warping).
# - Shuffled baseline: "baseline activity during vocalization determined from random
#   shuffling of multiunit activity", with a 95% band "for maxima and minima anywhere in this
#   window" (Fig 4 and Fig 6 legends). The shuffle is not described. Open; readings (a)
#   aligned averages built at random times during singing (inside bouts), (b) MUA circularly
#   shifted within each bout relative to the syllable times. In both, 1000 shuffles (not
#   stated for this baseline; taken from the Rhythmicity section's null, a standard choice),
#   and the band is the 2.5 and 97.5
#   percentiles of the shuffles' maxima and minima over the plotted window. The average
#   level of activity during singing is the mean of the shuffled averages.
# - Spectra: Chronux, "1 tapers, 2 time half-bandwith product" (Rhythmicity), read as tapers
#   [TW K] = [2 1]; a standard choice, as the text pairs one taper with TW 2. Null for
#   coherency and cross-spectrum by randomly shifting MUA relative to song amplitude for all
#   renditions, 1000 times. The segment over which spectra are taken (motif, bout or song
#   file) is not stated; readings (a) each bout, (b) each motif rendition, averaged.
schema_version: 2
paper: doi:10.1371/journal.pone.0169568
claims:
- id: lesion-directed-song-abolished
  statement: After complete bilateral Uva lesions, birds presented with a female court her but
    do not sing; they produce only sporadic short sounds like introductory notes without their
    rhythm.
  source: Results, Uva is necessary for adult stereotyped song, paragraph 1; S1 Video
  quote: However, consistent with previous reports [ 26 , 27 ], lesioned birds failed to sing and
    only produced sporadic short sounds, acoustically similar to introductory notes but without
    their characteristic rhythmicity
  criterion: The paper shows this by video and gives no measure. Open; the reading used here
    (not the paper's) is, on post-lesion directed-song recordings segmented by the Segmentation
    method, that no bout of the bird's pre-lesion motif occurs, judged with the spectral
    correlation of the Maturity index method (no bout of at least 700 ms whose correlation with
    pre-lesion bouts reaches the range of pre-lesion bout pairs), in every lesioned bird
    recorded in the directed context. The rhythm of the short sounds is not tested. Untestable
    unless the dataset marks which recordings were directed.
- id: lesion-undirected-rate-similar
  statement: In social isolation, Uva-lesioned birds sing at rates similar to intact birds.
  source: Results, Uva is necessary for adult stereotyped song, paragraph 2
  quote: While Uva lesions completely abolished directed singing, lesioned birds in social
    isolation sang at rates similar as intact birds in social isolation
  criterion: The paper gives neither the measure nor a test. Open; readings for the measure
    (a) syllables per hour of recording, (b) bouts per hour, (c) total singing time per hour;
    for the days compared, which the paper does not give, readings (a) the first day of
    post-lesion singing against the last pre-lesion day, (b) all recorded post-lesion days
    against all pre-lesion days; for
    "intact birds" the same birds before the lesion (the only intact undirected song the
    paper describes recording). As a claim of similarity with no test given, judged by the
    paper's test for pre and post comparisons, the Wilcoxon signed-rank test over birds at
    p < 0.05; reproduced when it finds no difference under the readings, with the post to
    pre ratio of each bird reported. Rates depend on how much was recorded, so the
    recording hours per day are reported too.
- id: fig2g-maturity-index-drop
  statement: Uva lesions lower the maturity index, a measure of song repeatability, from 0.26
    to 0.08 (Wilcoxon signed-rank test, p < 0.025, 7 birds).
  source: Results, Uva is necessary for adult stereotyped song, paragraph 2; Fig 2G
  quote: Uva lesions cause a significant decrease in a measure of song repeatability (maturity
    index; M pre = 0.26±0.03, M post = 0.08±0.02; p<0.025, Wilcoxon signed rank test, n = 7
    lesioned birds, ±SD
  statistics:
  - test: Wilcoxon signed rank test
    p: 0.025
    p_relation: "<"
    n: 7 lesioned birds
  expected:
  - quantity: maturity index before lesion, mean over birds
    value: 0.26
    tolerance: 0.03
  - quantity: maturity index after lesion, mean over birds
    value: 0.08
    tolerance: 0.02
  criterion: Tolerances are the paper's SDs over birds. Maturity index as the Methods give it
    (Maturity index) about 100 bouts drawn at random, only bouts 700 ms to 2 s long;
    multitaper spectrograms (2 tapers, 10 ms window, 1 ms step, bandwidth parameter 1.5);
    for every distinct pair of bouts, the correlation of power spectra between 860 Hz and 8.6
    kHz for each pair of 1 ms slices; the maximum of the lag correlation function; averaged
    over the ~10,000 pairs. Open; how the lag correlation function is formed from the
    slice-by-slice matrix, readings (a) the mean of the matrix along each diagonal, maximum
    over lags, (b) the same over the overlap only; the bout gap, readings (a) 300 ms (Sound
    analysis), (b) 350 ms (Song rhythmicity); the post-lesion day, readings (a) the first day
    of singing after surgery (Fig 2B), (b) all post-lesion days pooled. Reproduced when under
    one reading both means are within tolerance and the decrease is significant by a
    Wilcoxon signed-rank test at p < 0.025 over birds; partially reproduced when every bird
    decreases but the values or the test (an exact two-sided test cannot reach p < 0.025 with
    fewer than 7 birds, a one-sided one with fewer than 6) do not hold. The Methods take this
    analysis from Aronov et al. 2008; where that paper settles an open detail, it is followed.
- id: fig2f-closer-to-exponential
  statement: After Uva lesions syllable-duration distributions are much closer to exponential
    (goodness of fit Gamma 3.7 against 16 before; Wilcoxon signed-rank test, p < 0.025, 7
    birds), but stay above the subsong criterion of Gamma < 2.
  source: Results, Uva is necessary for adult stereotyped song, paragraph 3; Fig 2C and 2F
  quote: Post-lesion syllable duration distributions are significantly closer to exponential (Γ
    post = 3.7±1.2) than are pre-lesion songs (Γ pre = 16±6) (p<0.025, Wilcoxon signed rank
    test, n = 7 lesioned birds) ( Fig 2F ), but do not meet the strictest criterion for subsong
    (Γ < 2)
  statistics:
  - test: Wilcoxon signed rank test
    p: 0.025
    p_relation: "<"
    n: 7 lesioned birds
  expected:
  - quantity: goodness of fit Gamma before lesion, mean over birds
    value: 16
    tolerance: 6
  - quantity: goodness of fit Gamma after lesion, mean over birds
    value: 3.7
    tolerance: 1.2
  criterion: Tolerances are the paper's spreads over birds (the text gives no unit for them;
    read as SD, as in the paragraph before). Syllables segmented by the Segmentation method,
    one day of singing (1000 to 10,000 syllables); an exponential fit to the syllable
    durations by maximum likelihood; Gamma from the Lilliefors statistic (Methods, Sound
    analysis, paragraph 3). Open; the scale of Gamma, which the Methods do not define and
    whose values (16, threshold 2) exceed any raw Kolmogorov-Smirnov distance; readings (a)
    the Lilliefors distance D times the square root of the number of syllables, (b) D divided
    by the Lilliefors critical value at alpha 0.05 for that number of syllables; the
    post-lesion day, readings as for the maturity index. The Methods cite ref 41 for this
    analysis and ref 42 for the statistic; where ref 41 defines the scale of Gamma, its
    definition is followed and the readings above are variants. Reproduced when under one
    reading both means are within tolerance, the decrease is significant by a Wilcoxon
    signed-rank test at p < 0.025, and the post-lesion mean is above 2.
- id: fig2c-small-syllable-peak
  statement: In 6 of 7 Uva-lesioned birds the post-lesion syllable-duration distribution has a
    small peak at 50 to 100 ms.
  source: Results, Uva is necessary for adult stereotyped song, paragraph 3; Fig 2C
  quote: Indeed, in the majority of Uva-lesioned birds (n = 6/7), a small peak is seen in the
    syllable distribution at 50-100ms
  expected:
  - quantity: lesioned birds with a post-lesion peak at 50-100 ms
    value: 6
    tolerance: 0
    unit: birds of 7
  criterion: The paper gives no rule for a peak. Open; readings (a) a local maximum of the
    post-lesion syllable-duration histogram between 50 and 100 ms that lies above the fitted
    exponential (the null of Fig 2C), (b) the same with the histogram counts above the 95%
    bound of the fitted exponential's bin counts (Poisson). Bins of 5 ms, a standard choice;
    10 ms is shown as a variant. Reproduced when the peak is found in 6 of 7 birds, or, with
    fewer lesioned birds in the dataset, in all but at most one of them.
- id: fig2d-gaps-broader
  statement: After Uva lesions gap durations become broadly distributed, with more long and
    more short gaps, like subsong.
  source: Results, Uva is necessary for adult stereotyped song, paragraph 4; Fig 2D
  quote: Following Uva lesions, however, gap durations become more broadly distributed, with an
    increased incidence of long and short gaps
  criterion: The paper gives no measure or test. Gaps from the Segmentation method, within
    bouts. Open; readings for the measure (a) the fraction of post-lesion gaps outside the
    bird's pre-lesion 5th to 95th percentile range of gap durations, against the 10% expected
    if unchanged, (b) the interquartile range of log gap duration, post against pre. Reproduced
    when under one reading the change is in the claimed direction in every lesioned bird, or
    is significant by the Wilcoxon signed-rank test the paper uses for its other pre and post
    comparisons at p < 0.05, with, for reading (a), both the short and the long fractions
    increased.
- id: fig2e-rhythmicity-drop
  statement: Uva lesions decrease song rhythmicity, R, from 3.30 to 1.7 (Wilcoxon signed-rank
    test, p < 0.025, 7 birds).
  source: Results, Uva is necessary for adult stereotyped song, paragraph 5; Fig 2E
  quote: the increase in variability in both syllable and gap durations following Uva lesions is
    accompanied by a significant decrease in rhythmicity of song temporal structure in
    post-lesion birds ( Fig 2E ; R pre = 3.30±1.1, R post = 1.7±0.3; p<0.025 Wilcoxon signed
    rank test, n = 7 lesioned birds
  statistics:
  - test: Wilcoxon signed rank test
    p: 0.025
    p_relation: "<"
    n: 7 lesioned birds
  expected:
  - quantity: song rhythmicity R before lesion, mean over birds
    value: 3.3
    tolerance: 1.1
  - quantity: song rhythmicity R after lesion, mean over birds
    value: 1.7
    tolerance: 0.3
  criterion: Tolerances are the paper's spreads over birds. Rhythmicity as in Methods, Song
    rhythmicity; bouts with gaps of no more than 350 ms; amplitude in each bout rectified,
    smoothed, log-scaled, mean-subtracted and detrended; spectrum with 1 taper and time
    half-bandwidth product 2 (the section names "the FFT function in Matlab", not Chronux);
    normalized by bout length and squared, then averaged over bouts; R is the maximum above 3
    Hz of the ratio of this spectrum to the null spectrum. Open; the smoothing, readings as
    for Sound amplitude in the header; the null spectrum, "generated from an exponential
    distribution of syllable durations and a unimodal distribution of gap durations", with
    neither fitted distribution nor the synthetic amplitude given; readings (a) synthetic
    bouts of alternating syllables and gaps, durations drawn from an exponential fit to the
    bird's own syllable durations and a log-normal fit to its gap durations, amplitude the
    bird's mean syllable and gap levels, run through the same pipeline, (b) the same with the
    syllable and gap distributions of the bird's post-lesion song; the post-lesion day,
    readings as for the maturity index. Reproduced when under one reading both means are
    within tolerance and the decrease is significant by a Wilcoxon signed-rank test at p <
    0.025.
- id: fig2e-residual-rhythm-peak
  statement: Unlike subsong, 6 of 7 Uva-lesioned birds keep a significant peak in the song
    rhythm spectrum between 3 and 8 Hz.
  source: Results, Uva is necessary for adult stereotyped song, paragraph 5; Fig 2E legend
  quote: However, unlike subsong birds that had no significant rhythmicity, 6 of 7 Uva-lesioned
    birds exhibited a significant peak in the power spectrum between 3-8Hz
  expected:
  - quantity: lesioned birds with a significant post-lesion peak at 3-8 Hz
    value: 6
    tolerance: 0
    unit: birds of 7
  depends_on:
  - fig2e-rhythmicity-drop
  criterion: Spectra and null as in fig2e-rhythmicity-drop, under each of its readings. The
    test of a peak is not given. Open; readings (a) the ratio to the null spectrum exceeds the
    95th percentile of the same ratio computed on synthetic null bouts (the null of reading
    (a) or (b) of that claim, 1000 draws) at some frequency between 3 and 8 Hz, (b) the band
    of the Fig 2E legend, 4 to 8 Hz, with the same test. Reproduced when the peak is found in
    6 of 7 birds, or, with fewer lesioned birds, in all but at most one.
- id: figs1-control-lesions-no-effect
  statement: Control lesions 250 um dorsal or 200 um ventral to Uva have no significant effect
    on syllable or gap duration distributions, maturity index or song rhythm (p > 0.50, 4
    birds).
  source: Results, Uva is necessary for adult stereotyped song, paragraph 6; S1 Fig
  quote: these control lesions had no effect on song structure as assessed in song spectrograms,
    nor did they have a significant effect on syllable or gap duration distributions (p>0.50 for
    all measurements, n = 4 birds), on maturity index (p>0.50), or song rhythm spectrum (p>0.50)
  statistics:
  - about: syllable and gap duration distributions
    p: 0.5
    p_relation: ">"
    n: 4 control birds
  - about: maturity index
    p: 0.5
    p_relation: ">"
    n: 4 control birds
  - about: song rhythm spectrum
    p: 0.5
    p_relation: ">"
    n: 4 control birds
  criterion: A claim of absence. The test is not named; the paper's test for the same measures
    in Uva-lesioned birds is the Wilcoxon signed-rank test, used here on Gamma (syllables and,
    for gaps, the same fit to gap durations), M and R, each computed as in the claims above
    under their readings. Reproduced when no test gives p < 0.05; not reproduced when one
    does; the pre and post values of each bird are reported. With 4 birds the exact two-sided
    test cannot fall below 0.125, so the per-bird changes are also compared with the Uva
    lesion changes. Untestable if the dataset has no control-lesion birds.
- id: fig3-antidromic
  statement: Antidromic responses of Uva neurons to HVC stimulation have short latencies (1.5
    to 5 ms) and small jitter (< 100 us), and can be elicited by stimulation intensities of 70
    to 300 uA.
  source: Results, Song-related activity in Uva, paragraph 1; Fig 3B and 3C
  quote: Antidromic responses had short latencies (1.5-5ms) with a small jitter (<100μs), and
    could be elicited by stimulation intensity of 70–300μA
  expected:
  - quantity: antidromic latency range
    value: 1.5
    tolerance: 0.15
    unit: ms (lower bound)
  - quantity: antidromic latency range
    value: 5
    tolerance: 0.5
    unit: ms (upper bound)
  - quantity: jitter
    value: 100
    tolerance: 10
    unit: us (upper bound)
  criterion: A reported range; holds when every latency lies within 1.35 to 5.5 ms and every
    jitter, the SD of latency across stimulations of one unit, is below 110 us. Latency is the
    time from stimulus to the response spike. Stimulus intensities are judged only if the
    dataset records them (70 to 300 uA, widened to 63 to 330 uA); the Methods (Antidromic
    identification of Uva) give intensities of 50 to 200 uA instead, so the paper disagrees
    with itself and both ranges are reported. Collision (Fig 3B, red
    arrow) is reported where seen. Untestable unless the dataset holds antidromic
    stimulation recordings with stimulus times.
- id: single-unit-spontaneous-rates
  statement: HVC-projecting Uva neurons recorded off song fire regularly at 20 to 50 Hz (4
    neurons, 2 birds), while units just dorsal or ventral to the core appear to fire much
    less, below 10 Hz (5 neurons).
  source: Results, Song-related activity in Uva, paragraph 1
  quote: Single-unit recordings of HVC-projecting Uva neurons during non-singing revealed regular
    spontaneous spiking at 20-50Hz (n = 4 neurons, n = 2 birds). Single-units recorded just
    dorsal or ventral to HVC-projecting core of Uva appeared to exhibit much lower rates of
    spontaneous spiking (n = 5 neurons, <10Hz)
  expected:
  - quantity: spontaneous rate of HVC-projecting Uva neurons
    value: 20
    tolerance: 2
    unit: Hz (lower bound)
  - quantity: spontaneous rate of HVC-projecting Uva neurons
    value: 50
    tolerance: 5
    unit: Hz (upper bound)
  - quantity: spontaneous rate of units outside the core
    value: 10
    tolerance: 1
    unit: Hz (upper bound)
  criterion: Mean firing rate of each single unit outside singing. Holds when the HVC-projecting
