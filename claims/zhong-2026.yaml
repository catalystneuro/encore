- id: fig4a-universal-slope
  statement: Plotted against log2 of passage length, the fraction of recalled words for each
    order of approximation to English falls on a straight line, and all lines collapse onto one
    common line by shifting their intercepts.
  source: Results, Experimental tests of the new magic number, paragraph 2; Figure 4A
  quote: we replotted the data from [42] in a semi-log plot (with f as a function of log2 L) and
    observed that all the different n-gram curves are well approximated by straight lines. We
    hence collapsed all the curves into a common line by adjusting the individual intercepts
  data: elsewhere
  where: Miller and Selfridge 1950, Am J Psychol 63:176, doi:10.2307/1418920 (published
    recall table); not in any data archive
  criterion: Not testable on DANDI:000207. On the data of [42], f against log2 L per order n
    and for natural text (the black curve of Fig. 4a), one common slope with a separate
    intercept per curve. The fitting method is open; (a) least
    squares with a shared slope, (b) the mean of the separate slopes. No measure of "well
    approximated" is given.
- id: fig4b-plateau-near-eight
  statement: The critical length Lc of perfect recall, found by extrapolating each curve to f = 1
    with the common slope, increases with the order of approximation and plateaus from about
    n = 4 at roughly 8 words, the predicted M* for C = 4.
  source: Results, Experimental tests of the new magic number, paragraph 2; Figure 4B
  quote: Lc increases with n as expected but starts to plateau around n = 4, saturating at
    roughly the predicted value of 8.
  data: elsewhere
  where: Miller and Selfridge 1950, Am J Psychol 63:176, doi:10.2307/1418920 (published
    recall table); not in any data archive
  depends_on:
  - fig4a-universal-slope
  expected:
  - quantity: Lc at the plateau
    value: 8
    tolerance: 0.8
    unit: words
  criterion: Not testable on DANDI:000207. Lc per n is the L at which the fitted line of
    fig4a-universal-slope reaches f = 1 (Fig. 4 legend). Reproduced when Lc rises with n up to
    n = 4 and the values from n = 4 on are within tolerance of 8.
- id: fig4b-three-languages
  statement: Danish and Hindi replications of the Miller-Selfridge experiment give the same
    trend, and in all three languages Lc saturates in the region predicted by M* = 2^(C-1) with
    C = 4.
  source: Results, Experimental tests of the new magic number, paragraphs 2 and 3; Figure 4B
  quote: The same analysis of two replicates of the Miller-Selfridge experiment in Danish and
    Hindi [46, 47] reveals similar trends. ... Notably, in Fig. 4(b) for all three languages, Lc
    saturates within the region predicted by M ∗ = 2C−1, when substituting for C = 4 [4].
  data: elsewhere
  where: Maher and Skovengaard 1988, Scand J Psychol 29:194,
    doi:10.1111/j.1467-9450.1988.tb00791.x; Sharma and Sen 1977, Indian J Psychol, no DOI or
    volume given in the paper (published recall tables); not in any data archive
  depends_on:
  - fig4b-plateau-near-eight
  criterion: Not testable on DANDI:000207. The analysis of fig4a-universal-slope and
    fig4b-plateau-near-eight applied to each replication. "Within the region predicted" is
    open; (a) the plateau within 10% of 8, (b) the plateau at or below 8, M* being stated as
    a limit beyond which perfect retrieval is impossible. Reproduced when in each replication
    Lc rises with n and then plateaus (the "similar trends") and, under one reading, the
    plateau of all three languages is in the region.
