    value: 4
    tolerance: 0
    unit: clusters
  criterion: A simulation result, not a finding on recorded data; DANDI:000207 cannot test it.
    It needs the model of Methods A (Eqs. 2 to 8, lost in the text read), the parameters of
    Table I (values not in the text read) and the timings of Methods C (stimuli from t = 1 s,
    0.025 s long, every 0.45 s, input 750 Hz, background 10 Hz). The tolerance is 0 because the
    value is a count of clusters and 10% of it is under one cluster.
- id: fig1d-chunking-retrieves-six
