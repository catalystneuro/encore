# Claims for Zhong, Katkov & Tsodyks (2026), "Synaptic Theory of Chunking in Working Memory",
# eLife, doi:10.7554/elife.109538, tested on DANDI:000207.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-11-10, protocol pilot-14 as stated in docs/protocol.md.
#
# Text read. paper/10.7554-elife.109538.txt, fetched from eLife's site. Its header says
# "version of record", but the page it holds is the eLife Reviewed Preprint version 1
# (doi:10.7554/eLife.109538.1, 9 January 2026, "Not revised"). It holds the main text, the
# Methods (sections A to E), the legends of Figures 1 to 4 and of the supplementary Figures S1
# to S3, and the Data availability statement. No PDF was supplied. The equations (1) to (15)
# and the values of Table I (simulation parameters) did not survive extraction; Eq. (1) is
# known from the text as M* = 2^(C-1) ("M ∗ = 24−1 = 8" for C = 4, and "M ∗ = 2C−1" in the
# Figure 4 legend, superscripts lost). Figure axes and plotted values could not be read.
#
# Code. The paper links none. Data availability says "The code for simulation will be made
# available in a Github repository at a later stage"; no analysis code for Figure 3 or Figure 4
# is named. No repository or commit was read.
#
# Data the paper used.
# - Figures 1, 2 and S1, S2 are numerical simulations of the rate model of Methods A, with the
#   parameters of Table I (not in the text read) and the input timings of Methods C. No
#   recorded data.
# - Figure 3 and S3 reanalyse the single-neuron recordings of Zheng et al. 2022 (ref. [41],
#   Nat Neurosci 25:358), downloaded from DANDI at dandiset 000207 version 0.220216.0323
#   (Methods E). Drug-resistant epilepsy patients with depth electrodes in the medial temporal
#   lobe watched movie clips, each made of two episodes separated by a cut in the middle. Cuts
#   are soft boundaries (change of camera position) or hard boundaries (change of movie
#   content); this paper pools neurons coding either as "boundary neurons". "Onset neurons"
#   respond to clip onset. Of the 18 subjects in [41], 4 were left out (no onset-responsive or no
#   cut-responsive neuron detected), so 14 are analysed. Measured variables are spike times of
#   sorted units, clip onset times and cut times. Subject IDs named in Fig. S3 include P64CS and
#   TWH120.
# - Figure 4 uses behavioural recall data extracted from Miller and Selfridge 1950 (ref. [42],
#   Am J Psychol 63:176) and its Danish (ref. [46], Maher and Skovengaard 1988) and Hindi
#   (ref. [47], Sharma and Sen 1977) replications. Variables are the fraction of words
#   recalled f, the passage length L in words, and the order n of the approximation to the
#   language. These are published tables, not in any archive and not in DANDI:000207.
#
# Method details the paper fixes for Figure 3 (Methods E, Fig. 3 legend, Results paragraph on
# Fig. 3). Soft and hard boundary neurons are pooled as boundary neurons; all other detected
# neurons are non-boundary neurons; raw firing rates of all boundary (or non-boundary)
# neurons of a subject are pooled, then z-scored and averaged across subjects; time zero is the
# cut (Fig. 3a, b) or the clip onset (Fig. 3c); the shade is one standard deviation; 4 of 18
# subjects are excluded by the rule above. Details the paper leaves open are named in each
# criterion (how boundary and onset neurons are selected, bin width and smoothing, the plotted
# window, the z-score reference, and how a dip and a ramp are judged). The paper reports no
# statistical test for any finding.
