- id: fig3a-dip-after-boundary
  statement: Aligned to movie cuts and averaged over subjects and trials, the firing of
    non-boundary neurons dips about 130 ms after the peak of boundary-neuron firing, then
    ramps up continuously, as the chunking model predicts.
  source: Results, Experimental evidence for the existence of chunking clusters, paragraph 2;
    Figure 3A
  quote: we find that after the peak in the firing rate of boundary neurons (top panel of Fig. 3
    (a)), about ~ 130 ms later, there is a dip in the average activities of the rest of the
    recorded neurons (bottom panel of Fig. 3 (a)). Further-more, there is a continuous ramp-up
    of activities following the dip.
  data: dataset
  depends_on:
  - methods-subjects-included
  expected:
  - quantity: lag from the boundary-neuron peak to the non-boundary dip
    value: 130
    tolerance: 13
    unit: ms
  criterion: From the paper (Methods E, Fig. 3 legend). The 14 included subjects; trials
    aligned to the cut (time zero); soft and hard boundary neurons pooled as boundary neurons
    and all other detected neurons as non-boundary; per subject, the raw firing rates of all
    boundary (or non-boundary) neurons pooled over neurons and trials, z-scored, and averaged
    across subjects; the mean is the trace, one standard deviation the shade. Open, with the
    readings run. (1) Boundary-neuron selection, which the paper takes from [41] without
    giving the test; (a) the classification of [41] where the dataset or [41] gives it, (b)
    re-selection by the method in the Methods of [41], cuts of either type. (2) Trials; clips
    with a cut (soft and hard) only, the reading the text supports ("each consisting of two
    episodes separated by a cut"). (3) Bins and smoothing; 10 ms and 25 ms bins, each with no
    smoothing and with a Gaussian kernel of 50 ms SD. (4) Window, -1 to 2 s around the cut, a
    standard choice. (5) Z-score reference; (a) the subject's whole trace in the window, (b)
    its pre-cut part (-1 to 0 s). Measures fixed here as the paper gives none. Boundary peak
    is the time of the maximum of the boundary trace after time zero; the dip is the minimum of
    the non-boundary trace from that peak to 500 ms after it; the lag is the dip time minus
    the peak time. A dip is present when its value is below the mean of the non-boundary trace
    from -1 to 0 s; a ramp is present when a line fitted to the non-boundary trace from the dip
    to 1 s after the cut has positive slope. Reproduced when the dip and the ramp are present
    and the lag is within tolerance; partially reproduced when dip and ramp are present but the
    lag is outside it. Tolerance is 10% of 130 ms, widened to one bin when the bin is wider,
    since the lag cannot be resolved finer than a bin. The paper's "about ~" marks the value
    as approximate.
