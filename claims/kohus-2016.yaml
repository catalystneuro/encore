    release, and both BC and DTI pairs show either pattern.
  source: Results, Interactions among CCK+ interneurons show heterogeneous dynamics regardless of
    axonal location, paragraphs 2 and 3; Figure 10Aa to Ac
  quote: Although short-term facilitation was a common feature of all connections, four out of nine
    cells evoked only synchronous transmitter release (Fig. 10Aa), whereas five of them showed a
    frequency-dependent strong ... asynchronous release (Fig. 10Ab). Both BCs and DTIs could show either
    of these patterns
  expected:
  - quantity: CCK+ to CCK+ pairs with only synchronous release
    value: 4
    tolerance: 0
    unit: pairs of 9
  - quantity: CCK+ to CCK+ pairs with asynchronous release
    value: 5
    tolerance: 0
    unit: pairs of 9
  criterion: CCK+BC to CCK+BC and CCK+DTI to CCK+DTI pairs, 10-AP trains. Asynchronous release in a
    pair is judged by the onset rule of fig6-cckbc-async-onset (both readings) on the trains above
    10 Hz. Which trains count is read two ways, (a) 40 Hz and above (paragraph 4 places its
    appearance after the 5th AP at 40 and 160 Hz); (b) 20 Hz and above (Fig. 10Ac legend, "appeared
    at frequencies higher than 10 Hz"). Reproduced when under one
    reading four pairs show none and five show it (if the data set holds a different number of pairs,
