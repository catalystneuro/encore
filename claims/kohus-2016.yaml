# Claims for Kohus, Kali, Rovira-Esteban, Schlingloff, Papp, Freund, Hajos & Gulyas (2016), J Physiol,
# "Properties and dynamics of inhibitory synaptic communication within the CA3 microcircuits of
# pyramidal cells and interneurons expressing parvalbumin or cholecystokinin", doi:10.1113/jp272231,
# on CRCNS data set hc-7 (doi:10.6080/K0MK69T5).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-06,
# protocol as stated in docs/protocol.md (Reader), version pilot-13.
#
# Text read: the version of record (J Physiol 2016, pp 1 to 30), as supplied under paper/ (text
# extracted from the PDF with PyMuPDF): Key points, Methods, Results, Discussion, the legends of
# Figures 1 to 13 and Tables 1 to 4. The paper has no supplement. The PDF could not be opened as
# images in this run (no renderer installed), so values printed only inside figures (the medians of
# Fig. 4B, 5C, 5Db, 6B and C, 7, 10, 11B and 12) were not read; claims on those figures rest on the
# Results and the legends. The extracted Table 4 holds every column: for the three PV+ types U0,
# tau_r (1080, 1620, 1700 ms), tau_e (23.7, 13.5, 13.6 ms), a_e, k_e and Imax; for CCK+BC to PC U0
# 0.15 (0.11, 0.18), tau_r 71 ms, tau_f 10.9 (7.2, 53.5) ms and Imax 499 (252, 708) pA. Table 4 gives
# the best model of each type; the Figure 11 legend gives the type parameters of a fit that includes
# use-dependent replenishment for all four types, and differs from Table 4 for CCK+BC to PC (tau_r
# 12.9 s against 71 ms) and for PV+BC to PV+BC tau_e (2.37 against 23.7 ms).
#
# Code. The paper links no code. Its Methods name in-house and third-party programs (Stimulog, EVAN,
# MATLAB 7.0.4 and Delphi 6.0 scripts, a feature extraction script by M. Rozsa modified by S. Kali,
# software for asynchronous charge by D. Gemes, Origin 9.0 for exponential fits and statistics); none
# is published. Every method below is from the paper's text.
#
# Data the paper used. Acute horizontal hippocampal slices (250 to 350 um) from BAC-PV-eGFP and
# BAC-CCK-DsRed mice of both sexes, postnatal day 18 to 25, CA3 area, modified aCSF (3.5 mM K, 1.6 mM
# Ca, 1.2 mM Mg), 30 to 32 C, NBQX 20 uM and AP-5 50 uM, AM251 1 uM for CCK+ cells. Paired whole-cell
# recordings: presynaptic interneuron in current clamp at -65 mV, driven by 1 ms, 1500 pA current
# pulses; postsynaptic cell in voltage clamp at -60 mV; 3 kHz low-pass, 10 kHz sampling. Mostly high
# KCl pipette solution in both cells; in some pairs low KCl (presynaptic) and high CsCl (postsynaptic).
# Cell types identified post hoc (biocytin, ankyrin G for AACs, CB1 for CCK+ cells): PV+ basket
# cells (PV+BC), axo-axonic cells (AAC), CCK+ basket cells (CCK+BC) and CCK+ dendritic-region
# targeting cells (CCK+DTI), and pyramidal cells (PC). Protocols: 10 APs at 1, 5, 10, 20, 40, 80,
# 160 and 320 Hz followed by an 11th AP after 1000 ms; RIP (a single AP, then after 1000 ms four APs
# at 160 Hz); EPI (a single AP, then after 1000 ms 30 APs at 160 Hz and four at 320 Hz); recovery
# (two RIP trains 50, 100, 200, 300, 500, 800 or 1200 ms apart). Pairs reported: interneuron to PC,
# high KCl, PV+BC 8, AAC 9, CCK+BC 14, CCK+DTI 8 (Fig. 4, 5; 10-AP trains PV+BC 6, AAC 8, CCK+BC 6,
# CCK+DTI 3 or 4, Fig. 6; recovery PV+BC 7, AAC 9, CCK+BC 11); with CsCl, PV+BC 9, AAC 10, CCK+BC 6;
# interneuron to interneuron, PV+BC to PV+BC 16 (13 with 10-AP trains), CCK+BC to CCK+BC 6, CCK+DTI
# to CCK+DTI 4, nine CCK+ to CCK+ pairs with trains (Fig. 10), heterogeneous pairs 2 each. Measured
# variables: uIPSC 10 to 90% rise time, decay time constant, latency, amplitude (with failures),
# potency (without failures), transmission probability, amplitudes normalized to the first IPSC,
# asynchronous charge. Not paired recordings: current-step responses of 67 interneurons (40 features,
# Tables 1 and 2, Fig. 2), connection testing of all filled pairs (Fig. 3, Table 3), spontaneous IPSCs
# in PCs and interneurons (Fig. 12), local field potentials of SWRs in slices and optogenetic SWRs in
# PV-Cre x ChR2 mice aged P60 to 300 in 450 um slices (Fig. 13). By its description the CRCNS data
# set holds the paired recordings (raw pre- and postsynaptic sweeps and per-sweep amplitude and
# success tables) of the eight connection types under the stimulation protocols above; it is not
# described as holding the current-step, connectivity, spontaneous IPSC or field potential data.
#
# Shared method details, used by the criteria below.
# M1. uIPSC measures (Methods, Electrophysiological recordings and analysis, paragraph 6; Fig. 4B
#   legend): rise time, decay time constant, latency, potency and transmission probability on the
#   averaged events excluding failures; amplitude on averaged events including failures; latency from
#   the presynaptic AP peak to the uIPSC start, the start being the intersection of the baseline with
#   a line fitted to the 10 to 90% rising phase; decay a single exponential fit to the decaying phase
#   of the average; transmission probability the fraction of APs followed by a uIPSC.
# M2. Failures. The paper does not say how a failure is scored. Readings: (a) the success and
#   amplitude scored per sweep by the authors, as the data set's own tables hold them; (b) a
#   detection on the raw sweeps, a uIPSC being a peak in the response window larger than three
#   standard deviations of the pre-AP baseline (a standard choice, not the paper's).
# M3. Which APs are "single" (Results, The type of interneuron determines the properties of uIPSCs
#   onto PCs, paragraph 1; Fig. 4Ca; Fig. 8A legend). Readings: (a) the single AP that precedes the
#   RIP train by 1000 ms (Methods, paragraph on protocols); (b) the ten APs of the 1 Hz train (the
#   Fig. 8A legend shows uIPSCs "triggered by 10 single action potentials"); (c) both pooled.
# M4. Amplitude in trains. The paper does not fix the window or baseline. Readings: (a) the per-sweep
#   amplitudes of the data set's tables, averaged over sweeps; (b) the peak of the sweep-averaged
#   trace in the interval from the AP to the next AP (or 10 ms after the last AP), measured from the
#   current just before that AP. Relative amplitude is the mean amplitude at each AP divided by the
#   mean amplitude of the first IPSC of the same train (Methods, paragraph 6), per pair; the group
#   value is the median over pairs (Fig. 6C and 9B legends; Statistical analysis).
# M5. Sweeps. The Methods say each pattern was repeated 10 (trains) or 10 or 20 times (RIP, EPI); the
#   Results say 20 bursts were averaged. All sweeps of a protocol are used. The Fig. 5A legend speaks
#   of a "steady-state average"; whether any first sweeps were left out is not said, so a variant
#   leaving out the first three sweeps is shown where a criterion depends on sweep averages.
# M6. Tests (Methods, Statistical analysis): Kruskal-Wallis across groups, post hoc Mann-Whitney U
#   with Bonferroni correction; the number of comparisons is not given, so the factor is the number of
#   pairwise comparisons among the groups of that panel (3 for three groups); Pearson chi-squared for
#   connection probabilities. A threshold of p < 0.05 unless the claim states another. The
#   chi-squared p-values 9.42e-4, 0.0175 and 0.0181 are those of a 2 x 2 Pearson test without Yates
#   correction on the Figure 3A counts (checked by hand), so the chi-squared tests are run without it.
# M7. Tolerances. Values reported as median (first quartile, third quartile) use the paper's stated
#   spread: the tolerance is the distance from the median to the nearer quartile, so the value holds
#   when it falls within the reported interquartile range on that side. Other values use 10%.
