- id: fig10bd-be-async-charge
  statement: Between CCK+ cells immediate asynchronous charge per AP rises from 10 to 40 Hz, starting
    near the 5th AP, and falls at higher frequencies; delayed asynchronous charge grows with frequency
    and saturates at 160 Hz.
  source: Results, Interactions among CCK+ interneurons show heterogeneous dynamics regardless of
    axonal location, paragraph 5; Figure 10Bd and Be
  quote: immediate asynchronous charge increased with increasing frequency between 10 and 40 Hz,
    starting around the 5th AP. However, at higher frequencies, immediate asynchronous charge started
    to drop ... delayed asynchronous charge strongly potentiated in a frequency-dependent manner, and
    saturated at 160 Hz
  criterion: Methods, Asynchronous charge calculation. Template, a difference of two exponentials
    (Eq. 6) fitted to the average of all 11th IPSCs; delay from the rise onset; the synchronous trace
    rebuilt by adding templates at each AP plus the delay, scaled to the averaged IPSC amplitude at
    that AP; original and rebuilt traces low-pass filtered at 100 Hz; immediate charge per AP over the
    interval to the next AP (100, 50, 25, 12.5, 6.25, 3.125 ms at 10 to 320 Hz); delayed charge in the
    500 ms after the 10th AP. The filter type and order are not given; a standard choice (fourth-order
    zero-phase Butterworth) is used and named. Median over pairs with asynchronous release. Reproduced
    when the median immediate charge summed over APs 5 to 10 is larger at 40 than at 10 Hz and smaller
    at 320 than at 40 Hz, and the median delayed charge rises from 10 to 160 Hz (each step not lower
    than the previous by more than 10%) with 320 Hz within 20% of 160 Hz. The paper gives no test or
    margin for these trends; the sum over APs 5 to 10 and the 10% and 20% margins are standard
    choices.
  depends_on:
  - fig10-cck-cck-heterogeneity
- id: fig11-model-pv-udr
  statement: For PV+BC to PV+BC, PV+BC to PC and AAC to PC connections a purely depressing
    Tsodyks-Markram model fits adequately; adding use-dependent replenishment lowers the summed
    squared error by 35%, 22% and 34%, while adding facilitation gives no significant improvement; the
    BIC favours the depressing model with use-dependent replenishment.
  source: Results, Simple mathematical models of short-term plasticity effectively capture the
    temporal properties of transmission, paragraphs 3 and 5; Figure 11A and B
  quote: the combined sum of squared error decreased by 35% for PV+BC to PV+BC connections, by 22% for
    PV+BC to PC connections, and by 34% for AAC to PC connections when use-dependent replenishment was
    assumed). Adding synaptic facilitation to the model did not lead to any significant improvement
    for these three types of connection ... The BIC clearly favoured the purely depressing model which
    included use-dependent replenishment for PV+BC to PV+BC, PV+BC to PC and AAC to PC connections
  expected:
  - quantity: decrease of combined SSE with UDR, PV+BC to PV+BC
    value: 35
    tolerance: 3.5
    unit: percent
  - quantity: decrease of combined SSE with UDR, PV+BC to PC
    value: 22
    tolerance: 2.2
    unit: percent
  - quantity: decrease of combined SSE with UDR, AAC to PC
    value: 34
    tolerance: 3.4
    unit: percent
  criterion: Methods, Modelling the short-term plasticity, Eqs. 1 to 5; Results, same section,
    paragraph 3; Table 4 legend. Data, per connection the mean IPSC amplitudes (pA, M4) of the 10-AP
    trains at 1 to 320 Hz with the 11th AP, all frequencies fitted together. Four models, TM
    depressing (Eqs. 1, 5), TM depressing plus facilitating (Eqs. 1, 2, 5), UDR depressing (Eqs. 1, 3,
    4, 5), UDR plus facilitation; n = 1 and p = p0 before the first spike. U0 (p0), tau_f and Imax are
    fitted per connection, the other parameters (tau_r, tau_e, a_e, k_e) jointly per connection type
    (Table 4 legend; Fig. 11C legend). Not stated, and so open, the optimizer, the error weighting and
    the BIC's form. Readings, (a) unweighted sum of squared errors in pA squared over all APs and
    connections, BIC = N ln(SSE/N) + k ln N with N the number of fitted amplitudes and k the number of
    free parameters; (b) the same with each connection's errors divided by its first-IPSC amplitude
    squared. Fits started from several initial points (a standard choice). The SSE decrease is 1 minus
    SSE(UDR depressing)/SSE(TM depressing), per type. Reproduced when under one reading the three
    decreases are within tolerance, the lowest BIC is the UDR depressing model for all three types,
    and adding facilitation to UDR lowers the SSE by less than 10% (the paper says "did not lead to
    any significant improvement" without a test; 10% is a standard choice, and the BIC of the two
    is shown); partially reproduced when the BIC
    ranking holds and the decreases lie within 10 to 50%.
- id: fig11-model-cck-facilitation
