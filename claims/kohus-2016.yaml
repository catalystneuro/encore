- id: fig10-cck-cck-async
  statement: In the five CCK+ pairs with asynchronous release, release is synchronous at 10 Hz but
    asynchronous after the 5th AP at 40 and 160 Hz, and persists after the train for 69.8 to 339.6 ms,
    a duration independent of frequency; the total charge depends on the presynaptic frequency.
  source: Results, Interactions among CCK+ interneurons show heterogeneous dynamics regardless of
    axonal location, paragraph 4; Figure 10Ac and Ad
  quote: In five CCK+ to CCK+ cell pairs, transmitter release was synchronous at 10 Hz stimulation
    but, at 40 and 160 Hz stimulation, asynchronous release appeared after the 5th AP (immediate
    asynchronous release). This asynchronous release persisted after the end of stimulation train,
    lasting 69.8-339.6 ms for different cells (delayed asynchronousrelease).Itsdurationwasindependentofthe
    frequency of stimulation train (data not shown). However, the total inhibitory charge during the
    stimulation train (including a 500 ms window following the end of the 10th ... AP) was determined
    by the frequency of presynaptic APs
  expected:
  - quantity: duration of delayed asynchronous release, range over pairs, shortest
    value: 69.8
    tolerance: 6.98
    unit: ms
  - quantity: duration of delayed asynchronous release, range over pairs, longest
    value: 339.6
    tolerance: 33.96
    unit: ms
  criterion: For the pairs with asynchronous release (fig10-cck-cck-heterogeneity). Onset by the rule
    of fig6-cckbc-async-onset. Duration of delayed release, the time from the last AP to the point
    where the low-pass (100 Hz) residual current (original minus reconstructed synchronous, Methods)
    returns within two standard deviations of baseline, a standard choice the paper does not state.
    Total charge as the Methods define it (area under the mean trace during the train and 500 ms
    after, minus an equal window at least 500 ms later). Frequency dependence of total charge,
    Kruskal-Wallis across 10 to 320 Hz at p < 0.05 (the paper's test for several groups); duration
    independent of frequency, the same test not significant. Reproduced when under one reading the
