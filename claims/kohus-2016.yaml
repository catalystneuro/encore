- id: fig12-sipsc-kinetics
  statement: Spontaneous IPSCs decay faster in PV+BCs (n = 8) and AACs (n = 6) than in PCs (n = 10)
    and CCK+BCs (n = 9); rise time differs only between AACs and CCK+BCs, and sIPSC amplitude and
    frequency do not differ among cell types.
  source: Results, IPSCs onto interneurons are more rapid than on PCs, paragraphs 2 and 4; Figure 12
  quote: The spontaneous IPSCs onto PV+BCs (n = 8) and AACs (n = 6) decayed significantly faster
    compared to those measured in PCs (n = 10) and CCK+BCs (n = 9). The only difference in the 10-90%
    rise time value was between AACs and CCK+BCs ... We did not find significant differences in the
    amplitude and frequency of sIPSCs among cell types
  statistics:
  - test: not named; asterisks in Figure 12
    p: 0.05
    p_relation: "<"
    n: 10 PC, 8 PV+BC, 6 AAC and 9 CCK+BC
  criterion: sIPSCs recorded at -60 mV with high KCl, NBQX and AP-5. Event detection is not described;
    a standard template or threshold detection is used and named. Per cell, the averaged sIPSC, its
    10 to 90% rise time and single exponential decay, the median amplitude and the mean interevent
    interval. Kruskal-Wallis, post hoc Mann-Whitney with Bonferroni factor 6 (M6). Reproduced when
    decay is shorter in PV+BC and in AAC than in PC and in CCK+BC (four comparisons, corrected p <
    0.05), rise time differs only for AAC against CCK+BC, and the amplitude and interevent interval
    tests are not significant. Needs the sIPSC recordings, which the data set is not described as
    holding.
- id: sipsc-continuum
  statement: In every cell type the sIPSCs form a continuum; PCA shows amplitude, rise and decay
    strongly coupled on the first component, and clustering does not divide the events into groups.
  source: Results, IPSCs onto interneurons are more rapid than on PCs, paragraph 5
  quote: because PCA revealed a strong coupling among IPSC amplitude, rise and decay time values
    (strong loading on the first component, data not shown), the IPSC population could not be divided
    by clustering, meaning that the observed events form a continuum
  criterion: Events as fig12-sipsc-kinetics. Per cell type, PCA on the event amplitude, 10 to 90%
    rise time and decay time constant, then hierarchical clustering with Euclidean distance and Ward
    linkage (the paper names "multidimensional exploratory methods" and PCA only; the clustering
    method of its Methods, Electrophysiological characterization and clustering of cell types, is used
    as the nearest the paper gives). Whether features are standardized is open; readings z-scored and
    raw. Reproduced when under one reading amplitude, rise and decay all load on the first component
    with the same sign (absolute loading above 0.4, a standard choice) and no two-cluster cut gives
    clusters separated by more than the within-cluster spread (silhouette below 0.5, a standard
    choice). Needs the sIPSC recordings, which the data set is not described as holding.
  depends_on:
  - fig12-sipsc-kinetics
