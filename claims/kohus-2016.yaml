- id: fig10-cck-cck-frequency
  statement: Between CCK+ cells IPSC amplitudes facilitate at 10 and 40 Hz, while at 160 Hz they show
    no consistent change or a mixture of depression and facilitation.
  source: Results, Interactions among CCK+ interneurons show heterogeneous dynamics regardless of
    axonal location, paragraph 3; Figure 10Ac
  quote: the amplitude of evoked IPSCs among CCK+ cells displayed short-term facilitation at 10 and
    40 Hz stimulation. On the other hand, the amplitude of individual IPSCs at 160 Hz stimulation was
    characterized by no consistent change or by a mixture of short-term depression and short-term
    facilitation
  criterion: Relative amplitudes (M4, M5) per pair. Reproduced when under one reading of M4 the median
