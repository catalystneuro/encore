- id: fig2b-pv-cck-clusters
  statement: Hierarchical clustering of 67 CA3 interneurons on principal components of 40
    electrophysiological features gives two clusters that match PV+ and CCK+ cells with more than
    98% overlap; a single PV+ cell falls in the CCK+ cluster.
  source: Results, Hierarchical clustering based on electrophysiological properties identifies
    interneuron types, paragraphs 1 and 2; Figure 2B, left
  quote: We found that the cells clearly formed two separate clusters based on their physiological
    features ... the two main clusters corresponded almost perfectly to PV+ and CCK+ cells,
    respectively, with only a single PV+ cell misplaced into the group of CCK+ cells. This resulted in
    a more than 98% overlap between the anatomical and physiological classification
  expected:
  - quantity: agreement between the two clusters and the anatomical class
    value: 98
    tolerance: 2
    unit: percent
  criterion: Methods, Electrophysiological characterization and clustering of cell types. The 40
    features of Tables 1 and 2 from the 800 ms current steps; PCA on the features, keeping the
    components that carry most of the variance; hierarchical clustering with Euclidean distance and
    Ward linkage, cut into two clusters. The paper does not say whether features were standardized
    before PCA or how many components were kept ("solutions involving different numbers of principal
    components were tested"). Readings, (a) z-scored features, components explaining 80% of the
    variance; (b) z-scored features, components with eigenvalue above 1; (c) raw features, same two
    rules. Reproduced when under one reading the two-cluster cut agrees with the PV+/CCK+ labels for
    at least 98% of cells (at most one cell of 67 misplaced). The tolerance of 2 points is the step
    between "more than 98%" and the next lower whole percent.
