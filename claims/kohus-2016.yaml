- id: fig5c-pv-rip-depression
  statement: Under the RIP protocol (four APs at 160 Hz) PV+BC to PC pairs show short-term
    depression at the 3rd and 4th AP, and AAC to PC pairs already at the 2nd AP.
  source: Results, Cell type-specific short-term plasticity characterizes the synaptic transmission
    of interneurons onto PCs, paragraph 3 (Transmission of PV+ cells is depressing and homogenous);
    Figure 5C
  quote: PV+BC-PC pairs (n = 8) expressed short-term depression in response to the 3rd and 4th APs of
    the RIP protocol, whereas AAC-PC pairs (n = 9) ) expressed short-term depression in response to
    the 2nd AP
  statistics:
  - test: not named; asterisks in Figure 5C
    p: 0.05
    p_relation: "<"
    n: 8 PV+BC and 9 AAC to PC pairs
  criterion: High KCl pairs. Per pair, relative amplitudes of the four RIP IPSCs (M4 readings a and
    b, M5), normalized to the first of the four. The paper does not name the test behind the Fig. 5C
    asterisks. Readings, (a) Wilcoxon signed-rank test of the per-pair relative amplitude at AP n
    against 1; (b) Mann-Whitney U test of the per-pair relative amplitudes at AP n against those at
    AP 1 (all equal to 1), the paper's named two-group test. Reproduced when under one reading of
    M4 and of the test, the PV+BC medians at the 3rd and 4th AP and the AAC median at the 2nd AP are
    below 1 with p < 0.05. Whether the PV+BC 2nd AP is also depressed is reported.
- id: fig5c-cck-rip-facilitation
  statement: CCK+BC to PC (n = 14) and CCK+DTI to PC (n = 4) pairs on average show strong short-term
    facilitation, although individual pairs can show either facilitation or depression.
  source: Results, Cell type-specific short-term plasticity characterizes the synaptic transmission
    of interneurons onto PCs, paragraph 5 (Transmission of CCK+ cells is variable); Figure 5C
  quote: IPSCs between CCK+BC to PC (n = 14) and CCK+DTI-PC pairs (n = 4) on average were
    characterized by powerful short-term facilitation; however, individual cell pairs could display
    both short-term facilitation and short-term depression
  criterion: As fig5c-pv-rip-depression, RIP protocol. Reproduced when for CCK+BC to PC pairs the
    median relative amplitude at the 2nd to 4th AP is above 1 at two or more of the three APs, the
    same holds for the CCK+DTI pairs that transmit under RIP, and at least one CCK+ pair has a
    relative amplitude below 1 at the 4th AP. Pairs whose first IPSC is all failures under M2 cannot
    be normalized and are counted apart.
- id: fig5db-recovery
  statement: After a RIP train, PV+BC to PC (n = 7) and AAC to PC (n = 9) transmission recovers
    gradually with the interval to a second RIP train, while CCK+BC to PC transmission (n = 11) rises
    and falls with the interval; PV+BC and CCK+BC pairs differ at several intervals.
  source: Results, Cell type-specific short-term plasticity characterizes the synaptic transmission
    of interneurons onto PCs, paragraph 4; Figure 5Da and Db
  quote: PV+BC to PC (n = 7) and AAC to PC (n = 9) transmission gradually recovered, whereas CCK+BC to
    PC transmission (n = 11) showed a more complex (increasing and decreasing) behaviour depending on
    the interstimulus interval
  statistics:
  - about: PV+BC against CCK+BC to PC, recovery ratio at given intervals
    test: not named; asterisks in Figure 5Db
    p: 0.05
    p_relation: "<"
  criterion: Recovery ratio, the amplitude of the first IPSC of the second RIP train over that of the
    first IPSC of the first train (Methods, paragraph on protocols; Fig. 5Db legend), per pair and
    interval (50 to 1200 ms), amplitudes by M4. Gradual recovery, the median ratio over PV+BC pairs,
    and over AAC pairs, rises with the interval (Spearman correlation of ratio with interval above 0
    with p < 0.05 over the pair by interval values), below 1 at 50 ms. Complex behaviour, the CCK+BC
    median ratio is not monotonic in interval (at least one rise followed by a fall of more than 10%
    of the ratio). The paper names no test for either shape; the Spearman test, the 50 ms condition
    and the 10% fall are standard choices, not the paper's. Difference, two-sided Mann-Whitney U test of PV+BC against CCK+BC at each
    interval; the paper gives no correction (readings uncorrected and Bonferroni over 7 intervals).
    Reproduced when all three parts hold under one reading of M4, with at least one interval
    significant.
- id: fig6-pv-trains-depression
  statement: PV+BC to PC (n = 6) and AAC to PC (n = 8) pairs show purely short-term depression to 10
    APs at 1 to 320 Hz and to the EPI protocol, more pronounced at higher frequencies, with IPSCs
    synchronous to the APs even under EPI.
  source: Results, Cell type-specific short-term plasticity characterizes the synaptic transmission
    of interneurons onto PCs, paragraph 3; Figure 6A and C
  quote: PV+BC to PC (n = 6) and AAC to PC (n = 8) pairs displayed purely short-term depression in
    response to 10 APs at frequencies between 1 and 320 Hz and to our EPI protocol. The short-term
    depression becomes more prominent with ... increasing frequency
  criterion: Per pair and protocol, relative amplitudes (M4, M5); medians over pairs (Fig. 6C
    legend). Purely depressing, the median relative amplitude of APs 2 to 10 is below 1 at every
    frequency and for the EPI protocol, for each of the two types (a value up to 1.05 at a single AP
    is allowed as noise, a standard choice). More prominent with frequency, the median over pairs of
    the mean relative amplitude of APs 2 to 10 falls with frequency (Spearman correlation below 0 with
    p < 0.05 over the pair by frequency values; the paper names no test, so this is a standard
    choice). Synchronous release, no pair of either type shows an onset of asynchronous release
    under EPI by the onset rule of fig6-cckbc-async-onset (Results, same section, paragraph 3, "The
    evoked IPSCs were synchronous to APs, even during the high frequency EPI stimulation pattern").
    Reproduced when all three hold for both types under one reading of M4; partially reproduced when
    the two depression parts hold and synchrony fails.
- id: fig6-cckbc-pc-trains
  statement: All CCK+BC to PC pairs (n = 6) facilitate at 1 to 40 Hz; at 80 Hz and above and under
    EPI the facilitation of the 1st to 5th APs turns into depression later in the train.
  source: Results, Cell type-specific short-term plasticity characterizes the synaptic transmission
    of interneurons onto PCs, paragraph 6; Figure 6A and C
  quote: All CCK+BC-PC pairs (n = 6) were characterized by short-term facilitation at frequencies
    between 1 and 40 Hz. At higher frequencies (80 Hz, 160 Hz, 320 Hz; EPI protocol) the transient ...
    short-term facilitation of the 1st to 5th APs turned later into short-term depression
  criterion: As fig6-pv-trains-depression. Facilitation at 1 to 40 Hz, for every pair the mean
    relative amplitude of APs 2 to 10 is above 1 at each of 1, 5, 10, 20 and 40 Hz. At 80, 160 and
    320 Hz and EPI, the median over pairs is above 1 at some AP from 2 to 5 and below 1 at the last
    AP of the train. Reproduced when both hold under one reading of M4; partially reproduced when
    facilitation holds for at least five of six pairs and the high-frequency pattern for at least
    three of the four protocols.
- id: fig6-cckbc-async-onset
  statement: At CCK+BC to PC pairs asynchronous release appears only during the EPI protocol, between
    the 10th and 19th AP (median 11, interquartile range 10 to 14).
  source: Results, Cell type-specific short-term plasticity characterizes the synaptic transmission
    of interneurons onto PCs, paragraph 6; Figure 6A
  quote: Asynchronous release at CCK+BC-PCpairsappearedonlyduringtheEPIprotocol between the 10th and
    19th AP [median (interquartile range) 11 (10-14)]
  expected:
  - quantity: AP index of asynchronous release onset, CCK+BC to PC, EPI
    value: 11
    tolerance: 1
  criterion: The paper does not say how the onset of asynchronous release is determined. The
    immediate asynchronous charge at each AP is computed as in the Methods (Asynchronous charge
    calculation, a template from the averaged 11th IPSC, synchronous release reconstructed and
    subtracted, 100 Hz low-pass, window the interval to the next AP). Readings for the onset, (a)
    the first AP after which the immediate asynchronous charge stays above two standard deviations of
    the charge in equal windows of the pre-train baseline for at least three APs; (b) the first AP
    after which the current between APs no longer returns to within 10% of the IPSC peak of the
    baseline (a standard choice). Reproduced when under one reading the median onset is 10 to 12 (11
    against the nearer quartile 10, M7, and 10% above), onsets lie within 9 to 21 (10 to 19 widened by
    10%), and no pair shows asynchronous release under the 10-AP trains by the same rule.
- id: cckdti-pc-transmission
  statement: Of eight CCK+DTI to PC pairs, four respond at low frequencies (1 to 40 Hz) or to RIP; in
    these the first AP of trains evokes an IPSC only from about the fourth sweep, transmission
    facilitates at 10 Hz but depresses at 40 and 160 Hz; the other four transmit, with depression,
    only under EPI.
  source: Results, Cell type-specific short-term plasticity characterizes the synaptic transmission
    of interneurons onto PCs, paragraph 7; Figures 5A and 6A
  quote: From a total of eight CCK+DTI-PC pairs, only four pairs responded to stimulation already at
    low frequencies (1-40 Hz) or to RIP protocol with clearly distinguishable inhibitory transmission
    ... the first AP of stimulation trains resulted in an IPSC starting from the fourthtraceonaverage
    ... Transmission was characterized by short-term facilitation at 10 Hz (n = 3) but turned into
    short-term depression at 40 Hz (n = 3) and 160 Hz (n = 4) stimulation. In the remaining four
    CCK+DTI-PC pairs, inhibitory transmission (showing short-term depression) was observed only for
    the stronger and longer lasting EPI stimulation train
  expected:
  - quantity: CCK+DTI to PC pairs transmitting at 1 to 40 Hz or RIP
    value: 4
    tolerance: 0
    unit: pairs of 8
  - quantity: first sweep with an IPSC to the first AP, mean over responding pairs
    value: 4
    tolerance: 0.4
    unit: sweep index
  criterion: Transmission per pair as in fig4c-cckdti-pc-silent-single-ap (M2), relative amplitudes
    by M4. Reproduced when four of eight pairs transmit at 1 to 40 Hz or RIP, the mean first
    successful sweep is within tolerance, and in the responding pairs the median mean relative
    amplitude of APs 2 to 10 is above 1 at 10 Hz and below 1 at 40 and 160 Hz, while the other pairs
    transmit only under EPI with the last-AP relative amplitude below 1. Partially reproduced when
    the counts hold and the frequency pattern holds at two of the three frequencies.
- id: cckdti-async-onset
  statement: At CCK+DTI to PC pairs asynchronous release appears earlier than at CCK+BCs, between the
    7th and 13th AP of the EPI protocol (median 7, interquartile range 7 to 9) and in trains at 160 Hz
    and above (median 7, interquartile range 6 to 8).
  source: Results, Cell type-specific short-term plasticity characterizes the synaptic transmission
    of interneurons onto PCs, paragraph 8; Figure 6A and C
  quote: In the CCK+DTIs, asynchronous release appeared earlier than for the CCK+BCs ... between the 7th
    and 13th AP of the EPI protocol [median (interquartile range) 7 (7-9)] and above 160 Hz stimulation
    [median (interquartile range) 7 (6-8)]
  expected:
  - quantity: AP index of asynchronous release onset, CCK+DTI to PC, EPI
    value: 7
    tolerance: 0.7
  - quantity: AP index of asynchronous release onset, CCK+DTI to PC, trains at 160 Hz and above
    value: 7
    tolerance: 1
  criterion: Onset readings as fig6-cckbc-async-onset. For EPI the nearer quartile equals the median,
    so the tolerance is 10%; for trains the nearer quartile (6) gives 1. "Above 160 Hz" is read two
    ways, (a) the 160 and 320 Hz trains pooled, (b) the 320 Hz train alone. Reproduced when under
    one reading both medians are within tolerance and the CCK+DTI EPI onset median is lower than the
    CCK+BC one.
  depends_on:
  - fig6-cckbc-async-onset
- id: async-charge-epi-vs-160
  statement: At CCK+BC to PC pairs the EPI protocol triggers a larger asynchronous charge after the
    last AP than 160 Hz trains, while the charge is unchanged between the two patterns at PV+BC, AAC
    and CCK+DTI to PC pairs.
  source: Results, Cell type-specific short-term plasticity characterizes the synaptic transmission
    of interneurons onto PCs, paragraph 9; Figure 6A
  quote: At CCK+BC-PC pairs, the EPI protocol triggered a significantly larger asynchronous charge
    compared to 160 Hz stimulation (Mann-Whitney U test ... P = 0.002), whereas the charge transfer at
    PV+BC to PC (Mann-Whitney U test ... P = 0.17) and AAC-PC pairs (Mann-Whitney U test ... P = 0.27) was
    unchanged between the two stimulus patterns. We did not find any significant difference in the
    asynchronous charge transfer at CCK+DTI-PC pairs (Mann-Whitney U test ... P = 0.9)
  statistics:
  - about: CCK+BC to PC, EPI against 160 Hz
    test: Mann-Whitney U test
    p: 0.002
  - about: PV+BC to PC, EPI against 160 Hz
    test: Mann-Whitney U test
    p: 0.17
  - about: AAC to PC, EPI against 160 Hz
    test: Mann-Whitney U test
    p: 0.27
  - about: CCK+DTI to PC, EPI against 160 Hz
    test: Mann-Whitney U test
    p: 0.9
  criterion: Charge in the 500 ms window after the last AP of the EPI protocol and of the 10-AP 160
    Hz train (paragraph 9). The paper says asynchronous charge; readings, (a) the delayed asynchronous
    charge of the Methods (the 100 Hz low-pass original trace minus the reconstructed synchronous
    trace, 500 ms after the last AP); (b) the area under the mean trace in that window minus the area
    of an equal window at least 500 ms later (the total charge method of the Methods, applied to the
    window). Two-sided Mann-Whitney U test per type, EPI against 160 Hz, as the paper names it.
    Reproduced when under one reading CCK+BC gives p < 0.05 with EPI larger, and the absence parts
    hold on the paper's test, PV+BC, AAC and CCK+DTI each p >= 0.05; partially reproduced when
    CCK+BC holds and one absence part fails.
- id: decay-epi-vs-160
  statement: The decay time constant after the last AP lengthens under EPI compared with 160 Hz
    trains, from 13.01 to 103.65 ms at CCK+BC to PC pairs and from 36.82 to 138.71 ms at CCK+DTI to PC
    pairs.
  source: Results, Cell type-specific short-term plasticity characterizes the synaptic transmission
    of interneurons onto PCs, paragraph 9; Figure 6B
  quote: the decay time (τ) of release prolonged significantly during EPI protocol compared to 160 Hz
    stimulation at both CCK+BC-PC (from 13.01 ms to 103.65 ms; Mann-WhitneyUtest ... P =0.01) and
    CCK+DTI-PC pairs (from 36.82 ms to 138.71 ms; Mann-Whitney U test ... P = 0.01)
  statistics:
  - about: CCK+BC to PC
    test: Mann-Whitney U test
    p: 0.01
  - about: CCK+DTI to PC
    test: Mann-Whitney U test
    p: 0.01
  expected:
  - quantity: decay time constant after 10th AP at 160 Hz, CCK+BC to PC, median
    value: 13.01
    tolerance: 1.3
    unit: ms
  - quantity: decay time constant after last EPI AP, CCK+BC to PC, median
    value: 103.65
    tolerance: 10.37
    unit: ms
  - quantity: decay time constant after 10th AP at 160 Hz, CCK+DTI to PC, median
    value: 36.82
    tolerance: 3.68
    unit: ms
  - quantity: decay time constant after last EPI AP, CCK+DTI to PC, median
    value: 138.71
    tolerance: 13.87
    unit: ms
  criterion: Per pair, a single exponential fitted to the decay of the averaged current after the
    10th AP of the 160 Hz train and after the last AP of the EPI protocol (Fig. 6A legend), medians
    over pairs (Fig. 6B legend). The fit window is not given; readings, (a) from the peak to 500 ms
    after the last AP (the window of the charge analysis); (b) from the peak to the return to
    baseline, the first point within 5% of the peak above baseline. Two-sided Mann-Whitney U test,
    EPI against 160 Hz. Reproduced when under one reading the four medians are within tolerance and
    both tests give p < 0.05; partially reproduced when both tests hold with EPI longer but some
    medians fall outside tolerance. Fig. 6B also reports PV+BC and AAC values (asterisks on CCK+BC and
    "PTI"), not given in the text; these are shown and not judged.
- id: fig7b-cscl-stp
  statement: With the CsCl (postsynaptic) and low KCl (presynaptic) solutions short-term depression
    at the 3rd and 4th RIP APs is larger at AAC to PC pairs, and short-term facilitation is smaller at
    CCK+BC to PC pairs, than with high KCl.
  source: Results, Cell type-specific short-term plasticity characterizes the synaptic transmission
    of interneurons onto PCs, paragraph 11; Figure 7B
  quote: The use of different intrapipette solutions significantly increased the short-term
    depression between AACs and PCs, and decreased the short-term facilitation of CCK+BC-PC pairs,
    compared to values of short-term plasticity observed with high KCl-based intrapipette solution
  statistics:
  - test: not named; asterisks in Figure 7B
    p: 0.05
    p_relation: "<"
  criterion: RIP relative amplitudes (M4) at the 3rd and 4th AP (Fig. 7B legend), per pair, CsCl
    pairs against high KCl pairs, two-sided Mann-Whitney U test per type and AP (the paper's
    two-group test). Reproduced when under one reading of M4 the AAC relative amplitudes are lower
    with CsCl at the 3rd and 4th AP and the CCK+BC relative amplitudes are lower with CsCl at the 3rd
    and 4th AP, each p < 0.05; partially reproduced when two or three of the four hold. Needs the pairs
    to be labelled by pipette solution.
  depends_on:
  - fig7a-cscl-kinetics
- id: fig8-pvbc-pvbc-uipsc
  statement: uIPSCs between PV+BCs (n = 16) are fast (10 to 90% rise time 0.63 ms, decay time
    constant 3.17 ms), with short latency (0.76 ms), large amplitude (81.18 pA) and transmission
    probability of 1.
  source: Results, Properties of uIPSCs among interneurons are also connection type specific,
    paragraph 2; Figure 8B
  quote: uIPSCs at PV+BC to PV+BC pairs (n = 16) were fast (10-90% rise time, 0.63 ms; decay time
    constant, 3.17 ms) with short latency (0.76 ms), large amplitude (81.18 pA) and high transmission
    probability (P = 1)
  expected:
  - quantity: 10 to 90% rise time, median
    value: 0.63
    tolerance: 0.063
    unit: ms
  - quantity: decay time constant, median
    value: 3.17
    tolerance: 0.317
    unit: ms
  - quantity: latency, median
    value: 0.76
    tolerance: 0.076
    unit: ms
  - quantity: amplitude, median
    value: 81.18
    tolerance: 8.12
    unit: pA
  - quantity: transmission probability, median
    value: 1.0
    tolerance: 0.1
  criterion: Measures of M1, single APs by M3 (the Fig. 8A legend favours reading b, the 1 Hz train),
    failures by M2, median over pairs (Fig. 8B legend). Reproduced when under one reading of M2 and
    M3 all five medians are within tolerance; partially reproduced when three or four are.
- id: fig8-cck-pairs-uipsc
  statement: uIPSCs between CCK+BCs (n = 6) have rise and decay times like those between PV+BCs
    (0.63 and 3.65 ms) but significantly longer latency (1.59 ms) and lower transmission probability
    (0.7); uIPSCs between CCK+DTIs (n = 4) are slowest (rise 0.98 ms, decay 4.47 ms, latency 1.52 ms),
    smallest (43.71 pA) and least reliable (0.55).
  source: Results, Properties of uIPSCs among interneurons are also connection type specific,
    paragraph 2; Figure 8B
  quote: The properties of inhibitory synapses among CCK+BCs (n = 6) were similar to PV+BC to PV+BC
    synapses with respect to the 10-90% rise time (0.63 ms) and decay time constant (3.65 ms); however,
    uIPSCs were evoked with a significantly longer latency (1.59 ms) and lower transmission
    probability (P = 0.7). Finally, we found that synapses between CCK+DTI pairs (n = 4) had the
    slowest time course of rise time (0.98 ms), decay time (4.47 ms) and latency (1.52 ms), with the
    smallest amplitude (43.71 pA) and lowest transmission probability (0.55)
  statistics:
  - about: CCK+BC against PV+BC pairs, latency and transmission probability
    test: Mann-Whitney U test, post hoc
    corrected: Bonferroni
    p: 0.05
    p_relation: "<"
    n: 16 PV+BC, 6 CCK+BC and 4 CCK+DTI pairs
  expected:
  - quantity: CCK+BC pairs, 10 to 90% rise time
    value: 0.63
    tolerance: 0.063
    unit: ms
  - quantity: CCK+BC pairs, decay time constant
    value: 3.65
    tolerance: 0.365
    unit: ms
  - quantity: CCK+BC pairs, latency
    value: 1.59
    tolerance: 0.159
    unit: ms
  - quantity: CCK+BC pairs, transmission probability
    value: 0.7
    tolerance: 0.07
  - quantity: CCK+DTI pairs, 10 to 90% rise time
    value: 0.98
    tolerance: 0.098
    unit: ms
  - quantity: CCK+DTI pairs, decay time constant
    value: 4.47
    tolerance: 0.447
    unit: ms
  - quantity: CCK+DTI pairs, latency
    value: 1.52
    tolerance: 0.152
    unit: ms
  - quantity: CCK+DTI pairs, amplitude
    value: 43.71
    tolerance: 4.37
    unit: pA
  - quantity: CCK+DTI pairs, transmission probability
    value: 0.55
    tolerance: 0.055
  criterion: As fig8-pvbc-pvbc-uipsc. Kruskal-Wallis across the three pair types, post hoc
    Mann-Whitney U with Bonferroni factor 3 (M6). Reproduced when under one reading of M2 and M3 at
    least seven of the nine medians are within tolerance and CCK+BC pairs have a longer latency and
    lower transmission probability than PV+BC pairs at corrected p < 0.05; partially reproduced when
    the tests hold and four to six medians are within tolerance. The uncorrected p is also shown.
  depends_on:
  - fig8-pvbc-pvbc-uipsc
- id: fig8-cckbc-vs-cckdti-pairs
  statement: Among CCK+ pairs, uIPSC decay, latency, amplitude and transmission probability are
    similar between CCK+BC and CCK+DTI pairs, but CCK+BC uIPSCs rise significantly faster.
  source: Results, Properties of uIPSCs among interneurons are also connection type specific,
    paragraph 2; Figure 8B
  quote: The decay time constant, latency, amplitude and transmission probability of uIPSCs among
    CCK+BC and CCK+DTI pairs were similar, although the 10-90% rise time of uIPSCs mediated by
    CCK+BCs was significantly faster compared to CCK+DTI pairs
  statistics:
  - about: 10 to 90% rise time, CCK+BC against CCK+DTI pairs
    test: Mann-Whitney U test, post hoc
    corrected: Bonferroni
    p: 0.05
    p_relation: "<"
  criterion: As fig8-cck-pairs-uipsc, post hoc Mann-Whitney U test with Bonferroni factor 3. The
    similarity is a claim of absence, judged on that test at corrected p < 0.05. Reproduced when the
    rise time differs (CCK+BC faster) and decay, latency, amplitude and transmission probability do
    not; partially reproduced when the rise time holds and one of the four absences fails. Under
    the stated correction a 6 against 4 Mann-Whitney test has a smallest two-sided p of 0.0095, times
    3 is 0.029, so complete separation is needed for the rise time.
  depends_on:
  - fig8-cck-pairs-uipsc
- id: fig9-pvbc-pvbc-depression
  statement: Transmission between PV+BCs (n = 13) depresses during 10-AP trains at all frequencies
    from 1 to 320 Hz, more strongly at higher frequencies.
  source: Results, Short-term depression among PV+BC pairs is frequency-dependent, paragraph 2;
    Figure 9B, left
  quote: The transmission was characterized by short-term depression (Fig. 9B); the amplitude of
    triggered IPSCs decreased during the train of 10 APs at all frequencies. Moreover, as shown in Fig.
    9, the short-term depression became more prominent as the frequency ofstimulation was increased
  criterion: As fig6-pv-trains-depression, for PV+BC to PV+BC pairs (M4, M5). Reproduced when under
    one reading of M4 the median relative amplitude at the 10th AP is below 1 at all eight frequencies
    and the median mean relative amplitude of APs 2 to 10 falls with frequency (Spearman correlation
    below 0, p < 0.05, over pair by frequency values; a standard choice, the paper names no test).
- id: fig9-pvbc-pvbc-transmission-probability
  statement: Between PV+BCs the transmission probability starts to fall at 80 Hz (to 0.9 at the 10th
    AP), falls by 5 to 10% at the 8th to 10th AP at 160 Hz, and lies between 0.8 and 0.9 from the 3rd
    to the 10th AP at 320 Hz; it recovers by the 11th AP.
  source: Results, Short-term depression among PV+BC pairs is frequency-dependent, paragraph 2;
    Figure 9B, right
  quote: the transmission probability started to decrease at 80 Hz stimulation (at the 10th AP to 0.9;
    fast gamma frequency range). Increasing the frequency of stimulation to 160 Hz (SWR frequency
    range), we observed a 5-10% decrease of transmission probability at the 8th to 10th AP, whereas,
    at 320 Hz stimulation, the inhibitory transmission became less effective between the 3rd and 10th
    AP (transmission probability between 0.8 and 0.9)
  expected:
  - quantity: transmission probability at the 10th AP, 80 Hz, median over pairs
    value: 0.9
    tolerance: 0.09
  - quantity: decrease of transmission probability at the 8th to 10th AP, 160 Hz
    value: 7.75
    tolerance: 3.25
    unit: percent
  - quantity: transmission probability at the 3rd to 10th AP, 320 Hz, median over pairs
    value: 0.855
    tolerance: 0.135
  criterion: Per pair and AP, the fraction of sweeps with a uIPSC (M2), median over pairs (Fig. 9B
    legend). The 160 Hz decrease is read relative to the first AP; the reported range 5 to 10% widened
    by 10% of each bound gives 4.5 to 11 (7.75 plus or minus 3.25). The 320 Hz range 0.8 to 0.9
    widened gives 0.72 to 0.99 (0.855 plus or minus 0.135) for every AP from the 3rd to the 10th. Below 80 Hz the median is 1 at
    every AP. Reproduced when under one reading of M2 all hold and the 11th AP median is at least
    0.95 at every frequency (the paper says only that it "recovered by the time of the 11th
    stimulation", Fig. 9B legend; 0.95 is a standard choice); partially reproduced when the 80 Hz and
    320 Hz parts hold.
  depends_on:
  - fig9-pvbc-pvbc-depression
- id: fig9-pvbc-pvbc-recovery-11th
  statement: Between PV+BCs a 1 s pause does not fully relieve depression, and the recovery of the
    11th IPSC does not depend on the frequency of the preceding train.
  source: Results, Short-term depression among PV+BC pairs is frequency-dependent, paragraph 3;
    Figure 9B, left
  quote: The 1 s interstimulus interval was not sufficient to completely recover synaptic depression
    and the level of recovery was similar, regardless of the previous train frequency (Kruskal-Wallis
    ANOVA ... P = 0.152)
  statistics:
  - test: Kruskal-Wallis ANOVA
    p: 0.152
    n: 13 PV+BC to PV+BC pairs, trains at 5 to 320 Hz
  criterion: Per pair, the 11th IPSC amplitude over the first (M4), for trains at 5 to 320 Hz
    (paragraph 3). Incomplete recovery, the median over pairs is below 1 at every frequency. Absence
    of a frequency effect, Kruskal-Wallis across the seven frequencies on the per-pair values, as the
    paper did (groups treated as independent though the pairs repeat), not significant at p < 0.05.
    A Friedman test over pairs with all frequencies is shown as a variant. Reproduced when both hold.
  depends_on:
  - fig9-pvbc-pvbc-depression
- id: fig10-cck-cck-heterogeneity
  statement: Transmission between CCK+ cells is heterogeneous; all connections facilitate, four of
