- id: fig7-second-us-peak-dynamics
  statement: The second US peak was stronger in recordings with poor behavior (26 +/- 32 against 13
    +/- 26 Hz, p = 0.025) and did not decline over training (r = 0.102, p = 0.13, n = 224); across
    recordings with poor CRs it grew over training (r = 0.287, p = 0.0007, n = 138), from 16 +/- 28.3
    Hz on days 1 to 4 to 46.5 +/- 33 Hz later (p = 0.0001), with higher spike rate velocity later
    (0.55 +/- 0.32 against 0.77 +/- 0.45 Hz/ms, p = 0.0072).
  source: Results, US pauses are followed by fast excitatory responses in IpN neurons after
    conditioning, paragraph 1; Figure 7D,E
  quote: Like the first US peak, the second peak was more prevalent in recordings with poor
    conditioned behavior (26 ± 32 Hz, vs 13 ± 26 Hz, p=0.025, MWU; Figure 7E ), but it did not show a
    steady decline over the course of training days (r = 0.102, p=0.13, n = 224, Spearman). To the
    contrary, across recordings in which CR performance was poor, the second US peak actually grew
    stronger over the course of conditioning days (r = 0.287, p=0.0007, n = 138, Spearman), with
    maximum peak amplitudes 30–60 ms post-US of 16 ± 28.3 Hz on training days 1–4 (n = 121), and
    46.5 ± 33 Hz on later training days (n = 46, p=0.0001, MWU; Figure 7B ). Similarly, spike rate
    velocity was lower during the second US peak on earlier training days compared to later ones
    (0.55 ± 0.32 vs 0.77 ± 0.45 Hz/ms, p=0.0072, MWU; Figure 7C ).
  statistics:
