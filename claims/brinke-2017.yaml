# Claims for ten Brinke, Heiney, Wang, Proietti-Onori, Boele, Bakermans, Medina, Gao & De Zeeuw
# (2017), eLife 6:e28132, on CRCNS cb-1.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-11,
# protocol pilot-14 as stated in docs/protocol.md. The writer did not look at the dataset's data or
# files; only its description on crcns.org (paper/cb-1.data-description.txt) was read, for which
# experiments it holds.
#
# Text read: the version of record (PMC5760204, Europe PMC full-text XML, flattened), with its
# Results, figure legends and figure supplement legends, Materials and methods, and Supplementary
# file 1 (elife-28132-supp1-v2.docx, the linear mixed model summaries). No PDF was supplied; no
# figure was read, and every value below is printed in the text, a legend or Supplementary file 1.
#
# Code read: none. The paper links no analysis code; spikes were "thresholded in MATLAB ... using
# custom-written code and SpikeTrain", the model was written in Python, and the statistics were
# done in MATLAB. The dataset ships an example script (eLife_dataset.m), which is part of the
# dataset and was not read.
#
# Data the paper used.
# - Subjects. Wild-type C57Bl/6 mice, 12 to 20 weeks old. The Results say the first dataset came
#   from 19 mice; the Methods say n = 25 in all, with 22 (first dataset) and 6 (second dataset),
#   numbers that do not add up. Three L7cre-Ai27 mice for the optogenetics.
# - First dataset. 270 single-unit extracellular recordings (glass electrodes, 20 kHz) of
#   interpositus nucleus (IpN) cells at depths of 1500 to 3000 um, each with at least 10 valid
#   paired trials, made over the course of delay eyeblink conditioning (recordings from training
#   day 1 onward in 11 mice, after 5 days of training in 8). CS a 260 ms green LED, US a 10 ms
#   corneal air puff, co-terminating; CS-US interval 250 ms. Eyelid filmed at 250 fps.
# - Second dataset. 102 IpN recordings made after full training (mice with at least 80% CRs),
#   within about 300 um of sites where microstimulation evoked eyelid closure. The Results give
#   a 220 ms CS, a 20 ms US and a 200 ms CS-US interval; the dataset description gives 232 ms,
#   20 ms and 212 ms. In 25 of these cells, 13 +/- 2 US-only trials were interspersed.
# - Measured per recording and trial. Normalized eyelid position, spike times and spike density
#   functions, training day, mouse, and recording depth. The paper's Source data 1 holds 51 such
#   variables per trial and cell; the CRCNS description lists eyelid and spike traces, spike
#   times, mouse, training day (1 to 6, 7.5 for days 7 to 10, 10.5 for the second dataset), a
#   per-trial facilitation, a per-trial CR amplitude at US onset and the US onset time. The first
#   270 cells are the first dataset, the next 102 the second.
# - Outside data. Purkinje cell recordings from ten Brinke et al. (2015) (Figure 4A,D; Figure
#   5-figure supplement 1; Figure 6-figure supplement 1B,C) and a model of 26 IpN neurons built
#   on them with the parameters of Figure 5-source data 1. The paper does not say where those
#   Purkinje cell data are deposited.
# - Source data 1 (elife-28132-data1-v2.mat, published with the article on the eLife site,
#   https://cdn.elifesciences.org/articles/28132/elife-28132-data1-v2.mat). A MATLAB structure
#   'ipn' of 51 variables "relevant to the analyses in this paper", with per-trial values for the
#   372 cells in the dataset's order (first 270 cells the first dataset, the next 102 the second).
#   Recording depth, which the CRCNS description does not list, is taken from it; the claims that
#   use depth (firing-rate-depth, fig4s1-cs-peak-suppression-not-different,
#   fig5ej-cs-pause-cells-shallower, fig6g-us-response-depth) are data with_inputs.
#
# Methods fixed by the paper and used below (Materials and methods unless said otherwise).
# - Eyelid. Normalized per recording to the full blink range (resting open position to mean UR
#   peak), smoothed with a 2nd-degree Savitzky-Golay filter of 10 ms span. Trials removed by an
#   iterative Grubbs test (alpha 0.05) on trial baseline standard deviations, and when the eye
#   was not at least halfway open. A trial has a CR when closure exceeds 5% from the baseline
#   mean within the CS-US interval. A recording "with behavior" (conditioned behavior) has CRs
#   in at least 20% of trials (Results, Characterization, paragraph 3).
# - CR amplitude. The Methods define it as the maximum eyelid position in the CS-US interval
#   relative to the trial baseline; the Results and Supplementary file 1 use eyelid closure at
#   US onset. Both readings are named wherever a claim uses CR amplitude.
# - Spikes. Spike density functions from 1 ms bins convolved with a Gaussian of 5 ms width
#   (whether 5 ms is the SD is not said). Baseline 500 ms before the CS. The second dataset's
#   trials, per the dataset description, start 200 ms before the CS, so a 500 ms baseline may not
#   exist there; the reading for it is the whole pre-CS period available.
# - CS-US modulation. Mean change in the last 200 ms of the CS-US interval from the baseline
#   mean, in absolute Hz, after subtracting the mean above-baseline (or below-baseline) activity
#   within the baseline itself; at least +5 Hz is facilitation, at least -5 Hz suppression.
#   Duration is the number of 1 ms bins beyond 3 baseline SDs in the last 200 ms, with at least
#   10 ms beyond the threshold. Open: how "above-baseline activity within the baseline" is
#   formed. Readings (a) the mean of the positive (or negative) parts of the baseline trace minus
#   its mean, subtracted from the window's mean change; (b) the same positive (or negative) parts
#   taken in both the window and the baseline. Also open: which class a cell meeting both
#   thresholds takes (the counts 60, 23 and 187 are exclusive); readings, the larger absolute
#   change, or facilitation first.
# - Second dataset window. The last 200 ms of the CS-US interval is 0 to 200 ms after CS onset
#   under the paper's 200 ms interval, or 12 to 212 ms under the description's 212 ms.
# - CS pause and CS peak. In the average spike trace standardized to baseline, between 50 and
#   125 ms after the CS (the Results' overview paragraph says 50 to 130 ms), a rapid drop
#   exceeding 4.5 SDs followed by a peak of at least 2 SDs is a CS pause; an upstroke of 4.5 SDs
#   followed by a drop of at least 2 SDs is a CS peak. Open: whether 4.5 SDs is measured from the
#   baseline mean or as the size of the drop, and whether the 2 SD rebound is measured from the
#   trough or from the baseline mean; each claim using them names the four readings as
#   combinations of these two.
# - US responses. Average traces standardized to the 500 ms baseline; windows 1 to 30 ms (first
#   US peak), 16 to 45 ms (US pause) and 31 to 60 ms (second US peak) after the US. First peak,
#   more than 5 baseline SDs above the mean of the last 50 ms of the CS-US interval, or more than
#   2 SDs above it and 5 SDs above baseline. Pause, 5 SDs below the last 50 ms and at least 2 SDs
#   below baseline, or 2 SDs below the last 50 ms and 5 SDs from baseline. Second peak, at least
#   2 SDs above the last 50 ms and 5 SDs above baseline. For the pause and second peak the trace
#   must then turn back at least 2 SDs toward baseline. Trial-by-trial values are absolute
#   firing rates, the maximum (minimum for pauses) in a 30 ms window centred on the cell's
#   average peak (pause) time.
# - Statistics. Means +/- SD unless said otherwise. Correlations by Pearson's r when there are
#   at least 30 points and both variables are normal after a Grubbs outlier test (alpha 0.05),
#   otherwise Spearman (the normality test is not named; the test printed with each result is
#   followed). Group differences by Mann-Whitney U. Mixed-effects linear regression with random
#   intercepts and slopes per cell, kept by likelihood ratio tests. Bootstrap tests of how many
#   cells are significant, against 500 random datasets with similar numbers of cells and trials;
#   how the random datasets are made is not said (readings, (a) trial pairings of spike and
#   eyelid values shuffled within each cell; (b) independent random values with the cells' trial
#   counts, so that the expected count is 5% of cells). The alpha for a single cell's
#   trial-by-trial correlation is not stated; the reading is 0.05, two-sided.
# - Trial-by-trial facilitation (or suppression). Not defined beyond "firing rate"; readings,
#   (a) the trial's mean rate in the last 200 ms of the CS-US interval minus its own baseline
#   mean; (b) the same minus the cell's mean baseline; (c) the dataset's per-trial facilitation
#   variable, which its description defines in the same terms.
# - Spike rate velocity (Hz/ms) is not defined; the reading is the maximum (minimum for
#   suppression) of the first difference of the 1 ms spike density function within the window
#   named in the claim.
