- id: fig7fg-us-pause-resembles-cs-pause
  statement: In 12 second-dataset cells, the pause and rapid excitation after the US in US-only
    trials closely resembled the pause and rapid excitation after the CS in paired trials, the two
    profiles diverging only about 50 ms after the pause.
  source: Results, US pauses are followed by fast excitatory responses in IpN neurons after
    conditioning, paragraph 2; Figure 7F-H legend
  quote: In fact, there was a remarkable similarity between the pause and subsequent rapid
    excitation observed after the US in US-only trials, and the pause and subsequent rapid
    excitation observed after the CS in paired trials ( Figure 7F,G ), hinting at the possibility of
    a similar underlying mechanism.
  depends_on:
  - fig7s1c-us-only-second-peak-cs-pause-cells
  criterion: Per cell, the paired-trial trace aligned to the CS pause minimum and the US-only trace
    aligned to the US pause minimum, each standardized to the activity 150 to 50 ms before the
    minimum (Figure 7F legend). The paper gives no test or measure of similarity, so the measure is open; the
    readings named here are standard choices, not the paper's, (a) the mean
    difference trace stays within 2 SEM of zero from the minimum to 50 ms after it, (b) the
    correlation of the two mean traces over that span exceeds 0.8. Reproduced when both readings
    hold; the difference trace is shown.
