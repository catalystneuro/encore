# Claims for Vijayan, Wang, Chandra, Chakravorty, Li, Sarbanes, Akhlaghpour & Maimon (2022),
# "An internal expectation guides Drosophila egg-laying decisions", Science Advances 8,
# eabn3852, on DANDI 000212 ("Tracking of Drosophila during egg-laying decisions").
#
# Provenance: written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub
# Actions"), 2026-11-25, protocol pilot-18 as stated in docs/protocol.md (Reader, steps 1 to 4).
#
# Text read: the version of record as served by Europe PMC (PMC9616500), in
# paper/10.1126-sciadv.abn3852.txt, with the main text, figure legends, Materials and Methods,
# and the supplement PDF (sciadv.abn3852_sm.pdf, Figs. S1 to S7 with legends and the legends of
# Tables S1 and S2 and Movies S1 to S3), extracted into the same file. No page of a PDF was
# opened. Not available here: Tables S1 (summary of all tracking data) and S2 (the Gal4 screen),
# which are separate spreadsheets, and the main-text PDF, so numbers printed only inside main
# figures (most bin p-values, merge-arrow positions, bar heights) could not be read. The Methods
# defer the chamber design, tracking and egg annotation to ref. 16 (Vijayan et al., the
# rise-to-threshold study), which is not under paper/.
#
# Code read: none. The paper links no code; "All data analyses were done using MATLAB" (Data
# analysis software). No method detail below is settled by code.
#
# Data the paper used (Results; Materials and Methods). Single mated females, overnight in dark
# egg-laying choice chambers, agarose islands (1% agarose, 1.6% ethanol, 0.8% acetic acid, with
# sucrose at 0, 200 or 500 mM; 1.2% agarose for D. suzukii; 0.8% or 1.4% agarose in Fig. 6)
# separated by 2.5-mm plastic barriers (fig. S1). Video at 2 frames per second; measured
# variables are the xy position of the fly's centroid, the island the fly is on, and the times
# of egg deposition events. Chamber types: two-choice 0/200, 0/500, 200/500 mM (CS data from
# ref. 16); three- and five-island chambers 0/200/200 and others (Fig. 2B, C); 0/500/200 (Fig.
# 2D, E); 0/500/500/500/200 (Fig. 2F); 0/500/200/500/200 (Fig. 2G to I); 0/200 mM with a 4-mm
# tunnel, a 2-mm tunnel, and a 2-mm tunnel with bounce walls (Fig. 3); 500/0/500, 500/0/200,
# 0/500/500 (Fig. 4); 0.8% against 1.4% agarose with and without sucrose, and 0.8/0.8 and
# 1.4/1.4 (Fig. 6). Genotypes: wild-type Canton-S (CS), DL and TUT D. melanogaster strains, D.
# suzukii (Fig. 5); DDC-Gal4 with tub-Gal80ts and UAS-Kir2.1, pretreated at 18, 27, 29/29.5 or
# 31 C for 23 h before the assay at 24 C, with TH-Gal80, R58E02-Gal80, TSH-Gal80 or OTD-FLP
# with TUB-FRT-Gal80-FRT (Fig. 7); 115 Gal4 lines in a screen (Fig. 7A, Table S2); dopamine
# and serotonin receptor mutants (Fig. 8). Other experiments: chambers with movable boundaries
# (Fig. 1D, E), glued sensory organs (Fig. 1F), and the latency to feeding assay, groups of
# three to six food-deprived flies filmed at 15 frames per second and scored by hand (Figs. 7B,
# 8B). The archive says the dandiset holds "All fly tracking data used in the paper" (Data and
# materials availability); whether it holds the untracked or hand-scored experiments, and the
# ref. 16 CS data, is the author's to find.
#
# Shared methods, cited once here and named in the criteria by label.
# M1 Island assignment. The fly is on a substrate by whether its centroid is above or below the
#   chamber midline in two-choice chambers (Results, A framework, paragraph 1). For chambers
#   with more islands the boundaries are not given in the text; they follow from the
#   dimensions in fig. S1 (open; the author takes the barrier positions from the chamber
#   geometry the dataset records, or from fig. S1).
# M2 Locomotor speed. Not defined in the text beyond being from the tracked position;
#   frame-to-frame centroid displacement times 2 frames per second, in mm/s, is the standard
#   choice. Speed traces in figures are smoothed with a 5-s boxcar (Fig. 1 legend).
# M3 Search period. For each egg, the speed before deposition smoothed with an 18.5-s boxcar;
#   the search starts at the first frame before the egg where the smoothed speed is below 0.1
#   mm/s, and ends at deposition; minimum 9 s (Methods, Automated determination of egg-laying
#   search). "First frame before" is read as the last frame, going back from the egg, where the
#   smoothed speed is below 0.1 mm/s; the 9-s minimum implies a centred filter. For rate
#   functions, searches shorter than 30 s are set to 30 s (Methods, Calculation of egg-laying
#   rate); extending the start back to 30 s before the egg is the reading taken.
# M4 Egg-laying rate function. All flies of a chamber type pooled. For each bin of time since
#   leaving the other (indicated) substrate, while the fly is on the current substrate during a
#   search period, rate = (# eggs in bin)/(# frames in bin) x 120 eggs/min; 90% CI by
#   Clopper-Pearson on # eggs/# visits, scaled by 120 x # visits/# frames (Methods, Calculation
#   of egg-laying rate). Bin edges are not stated in the text; the x-axis ticks of fig. S2 read
#   0, 5, 10, 15, 20, 25, 30, 45, 60, 90, 150, 300, 600, 1200, 7200 s, taken as the edges (a
#   reading; the Methods say other binnings do not change the conclusions).
# M5 Bin test. Two-sided Wilcoxon rank sum test on 0/1 trials, a trial with an egg being 1
#   (Methods, Statistics). What a trial is is open; readings (a) one visit to the bin during a
#   search, the unit of the CI; (b) one search period that enters the bin. Merge point, as
#   Fig. 5A legend defines it, is the first bin past 5 s for which P > 0.05.
# M6 Choice fraction. Eggs on the named option over all eggs, pooled over flies, with a 95%
#   Clopper-Pearson CI; group comparisons are two-sided Wilcoxon rank sum tests on per-fly
#   fractions of flies that laid at least 5 eggs (Fig. 1F and Fig. 7 legends; Methods,
#   Statistics).
# M7 Pause time. Time from the last moment before deposition that the 1-s boxcar smoothed
#   speed rose above 0.1 mm/s to the deposition, compared between groups of eggs with the
#   two-sided Wilcoxon rank sum test (Methods, Statistics). Read as the duration of the final
#   stop before the egg.
# M8 Egg-aligned speed. Mean locomotor speed (M2) aligned to egg deposition; eggs within the
#   first or last few minutes of a video left out to avoid partial traces (Fig. 3F legend; the
#   window is not given, the plotted window from the figure is a standard choice).
schema_version: 2
paper: doi:10.1126/sciadv.abn3852
claims:
- id: leave-higher-stay-lower
  statement: In two-choice sucrose chambers, flies leave the higher sucrose substrate in 964 of
    1205 (80%) searches that start on it, and leave the lower sucrose substrate in only 918 of
    2744 (33%) searches that start on it.
  source: Results, A framework for understanding how previous substrate experiences guide
    egg-laying choices, paragraph 4
  quote: flies leave higher sucrose in 964 of 1205 or 80% of searches initiated on higher
    sucrose), whereas flies that start a search on lower sucrose know to stay (flies leave lower
    sucrose in only 918 of 2744 or 33% of searches initiated on lower sucrose) ( P < 0.001,
    two-sided Wilcoxon rank sum test
  statistics:
  - test: two-sided Wilcoxon rank sum test on searches as 0/1 trials
    p: 0.001
    p_relation: "<"
    n: 1205 searches started on higher sucrose and 2744 on lower sucrose
  expected:
  - quantity: searches started on higher sucrose
    value: 1205
    tolerance: 120.5
  - quantity: fraction of searches started on higher sucrose that leave it
    value: 0.80
    tolerance: 0.08
  - quantity: searches started on lower sucrose
    value: 2744
    tolerance: 274.4
  - quantity: fraction of searches started on lower sucrose that leave it
    value: 0.33
    tolerance: 0.033
  criterion: Searches by M3 (the 30-s minimum not applied, as this is not a rate function), CS
    flies in the 0/200, 0/500 and 200/500 mM two-choice chambers of ref. 16 (the sentence cites
    ref. 16, and its 1205 + 2744 = 3949 searches match the 3979 eggs of those three chambers in
    fig. S3); island at search start and whether the fly crosses to the other island before the
    egg, by M1. Reproduced when both fractions are within tolerance and the two-sided Wilcoxon rank sum test on 0/1 trials
    (Methods, Statistics) gives p < 0.001; partially reproduced when the fractions differ in the
    stated direction at p < 0.001 but are out of tolerance.
- id: fig1d-no-substrate-marking
  statement: When a previously preferred 200 mM island carrying eggs from earlier flies is paired
    with 0 mM, new flies lay eggs normally on 0 mM, and likewise for a nonpreferred option, so
    flies do not rely on previously laid eggs or other lasting chemical marks.
  source: Results, Flies continuously make sucrose assessments, paragraph 2; Figure 1D and 1E
  quote: Flies laid eggs normally on 0 mM, although 200 mM had many eggs from the start ...
    Thus, our flies did not seem to rely on previously laid eggs, or other long-lasting chemical
    cues, which mark either the preferred ( Fig. 1D ) or nonpreferred ( Fig. 1E ) option
  criterion: Fraction of eggs on the lower sucrose option, M6. Reproduced when, in the second
    assay of each pair (Fig. 1D right bar, Fig. 1E second bar), the pooled fraction on the
    lower sucrose option is above 0.5 with its 95% Clopper-Pearson CI above 0.5 (a bound fixed
    here from the 0.5 line the legend draws for reference). The paper reports no test; the first-night fractions are reported alongside.
- id: fig1f-tarsi-proboscis
  statement: Gluing the front tarsi or the proboscis significantly reduces the bias to lay eggs
    on 0 over 200 mM, gluing both leaves no detectable population preference, and gluing the
    back tarsi does not significantly affect choice.
  source: Results, Flies continuously make sucrose assessments, paragraph 3; Figure 1F
  quote: When we applied glue to the front tarsi (front leg tips) or proboscis, the bias to
    laying eggs on 0 mM was significantly reduced, and when both these body parts had glue, we
    could not detect a population-level preference for 0 over 200 mM
  statistics:
  - about: first and second displayed comparisons, top to bottom
    test: two-sided Wilcoxon rank sum test, flies that laid at least 5 eggs
    p: 0.005
    p_relation: "<"
    corrected: Bonferroni for seven comparisons (P < 0.05/7 = 0.007)
    n: 18, 13, 12, 41, 20, 13, 28 and 9 flies with at least 5 eggs in the eight groups
  - about: third displayed comparison
    test: two-sided Wilcoxon rank sum test, flies that laid at least 5 eggs
    p: 0.001
    p_relation: "<"
  expected:
  - quantity: mean eggs per fly in the eight groups (25, 24, 29, 25, 29, 18, 23, 14)
    value: 25
    tolerance: 2.5
    unit: eggs per fly, first group
  criterion: M6 on the eight groups of Fig. 1F. The group names and which pairs the three
    p-values compare are shown only in the figure, which could not be read. The legend's
    Bonferroni correction for seven comparisons among eight groups fits one control against
    the seven other groups; reading taken, each glued group against the unglued control. If the
    dataset shows a separate control for each glued group, each glued group is compared with
    its own control as a second reading.
    Reproduced when front tarsi, proboscis, and front tarsi with proboscis each differ from
    their control at p < 0.007 with a lower fraction on 0 mM, the fraction with both glued has
    a 95% CI that includes 0.5, and back tarsi does not differ at p < 0.007. The eight mean
    egg counts and the eight counts of flies with at least 5 eggs are reported against the
    legend.
- id: fig2bc-larger-chambers-two-options
  statement: In three- and five-island chambers with two sucrose concentrations, flies choose
    the low sucrose option with egg-laying rate dynamics similar to standard two-choice chambers.
  source: Results, Flies lay eggs on the best of three options, paragraph 1; Figure 2B and 2C
  quote: flies effectively chose the low sucrose option when presented with two sucrose
    concentrations, and they did so with similar egg-laying rate dynamics to those observed in
    standard two-choice chambers
  criterion: Rate functions M4 for each chamber (0/200/200 mM for Fig. 2B as Fig. 4B legend
    names it; Fig. 2C's five-island layout is not named in the text and is taken from Table S1
    or the dataset). Reproduced when, in each chamber, the rate on the higher sucrose option
    since leaving the lower one is below the rate on the lower option since leaving the higher
    one in the bins from 5 to 60 s, with at least one bin significant by M5 at p < 0.05, as for
    two-choice chambers (Fig. 2A). The paper gives no test of similarity to two-choice
    dynamics; the merge point M5 of each chamber is reported.
- id: fig2d-three-choice-inhibit-200
  statement: In a 0/500/200 mM chamber flies inhibit egg laying upon entering 200 mM from 500
    mM, although 200 mM is strongly preferred after the same transition in two-choice chambers.
  source: Results, Flies lay eggs on the best of three options, paragraphs 2 and 3; Figure 2D
  quote: However, we observed that flies inhibited egg laying upon entering 200 mM in this
    chamber
  criterion: M4 in the 0/500/200 chamber, rate on 200 mM since leaving 500 mM, against the rate
    on 200 mM since leaving 500 mM in the CS 200/500 two-choice chamber (ref. 16 data), bins 5
    to 60 s. Reproduced when the three-choice rate is lower in most of these bins and at least
    one bin differs by M5 at p < 0.05. The paper prints no test for this comparison; the
    criterion uses the Methods' bin test.
- id: fig2e-200-recovers-with-time
  statement: In the 0/500/200 mM chamber, the egg-laying rate on 200 mM rises gradually with time
    since the last visit to 0 mM.
  source: Results, Flies lay eggs on the best of three options, paragraph 2; Figure 2E
  quote: As time passed since the last visit to 0 mM, the egg-laying rate on 200 mM gradually
    increased
  criterion: M4, rate on 200 mM by time since leaving 0 mM. The paper gives no test; the measure
    fixed here is the pooled rate over bins from 300 s onward against the pooled rate over bins
    5 to 30 s, compared by M5. Reproduced when the later rate is higher at p < 0.05 and the
    rate is non-decreasing across most successive bins.
- id: fig2efg-inhibit-200-after-0
  statement: In all three-choice chambers flies inhibit egg laying on 200 mM nearly completely if
    they visited 0 mM in the last ~30 s, and this holds with a larger distance between 0 and 200
    mM (0/500/500/500/200) and with several 500 to 200 mM transitions along the path
    (0/500/200/500/200).
  source: Results, Flies lay eggs on the best of three options, paragraph 2; Figure 2E to 2G
  quote: In all these three-choice chambers, flies inhibited egg laying nearly completely on 200
    mM if they had visited 0 mM in the last ~30 s
  criterion: M4 in the 0/500/200, 0/500/500/500/200 and 0/500/200/500/200 chambers, rate on 200
    mM and on 0 mM by time since leaving the other of the two, pooled over 5 to 30 s.
    "Nearly completely" has no threshold in the paper; readings (a) the 200 mM rate at most 10%
    of the 0 mM rate over that window; (b) at most 20%. Reproduced when, under one reading, it
    holds in all three chambers and the difference is significant by M5 at p < 0.05 in each;
    partially reproduced when it holds in two. Bins below 5 s are left out, as in the merge-point
    definition (Fig. 5A legend); the paper says every rate function starts low for the first 10
    s after a transition (Results, A framework, last paragraph), so a 10 to 30 s window is also
    shown.
- id: fig2-earlier-merge-three-choice
  statement: The 0 and 200 mM rate functions merge at an earlier time in three-choice chambers
    than in two-choice chambers.
  source: Results, Flies lay eggs on the best of three options, paragraph 3; Figure 2A to 2G
  quote: the 0 and 200 mM egg-laying rate functions did appear to merge at an earlier time point
    in three-choice ( Fig. 2, E to G ) compared to two-choice chambers
  criterion: Merge point by M5 (first bin past 5 s with P > 0.05) of the 0 mM and 200 mM curves
    (each since leaving the other) in each three-choice chamber of claim fig2efg. The text
    compares with Fig. 2, A to C; readings (a) against the CS 0/200 two-choice chamber of ref.
    16, whose curves do not merge within the plotted interval (Fig. 5A legend); (b) against
    that chamber and the 0/200/200 and five-island chambers of Fig. 2B and 2C. Reproduced when,
    under one reading, the merge bin is earlier than in every comparison chamber in at least
    two of the three three-choice chambers.
- id: fig3ab-2mm-tunnel-faster
  statement: With a 2-mm tunnel between 200 mM and 0 mM, flies lay eggs at a higher rate in the
    5 to 10 s after entering 0 mM than with a 4-mm tunnel.
  source: Results, Flies lay eggs more rapidly on high-quality substrates that they visit rarely
    or briefly, paragraph 1; Figure 3A and 3B
  quote: In chambers with a tiny (2 mm) tunnel between substrates, flies laid eggs at a higher
    rate in the 5- to 10-s window after a transition to 0 mM compared to very similar chambers
    with a 4-mm tunnel
  criterion: M4, rate on 0 mM since leaving 200 mM in the 5 to 10 s bin; 2-mm against 4-mm
    tunnel chambers by M5. The paper's p-value is shown only in Fig. 3B. Reproduced when the
    2-mm rate is higher at p < 0.05.
- id: fig3c-bounce-faster
  statement: With angled walls that bounce flies away from the 2-mm tunnel, flies lay eggs even
    more rapidly on entering 0 mM than in the 2-mm and 4-mm tunnel chambers.
  source: Results, Flies lay eggs more rapidly on high-quality substrates, paragraph 1; Figure 3C
  quote: In this chamber, flies laid eggs even more rapidly upon entering the 0 mM side
  criterion: As fig3ab-2mm-tunnel-faster, the bounce chamber's indicated bin against the same
