  source: Results, Most SWRs contain interpretable spatial content, paragraph 6; Figure 2F
  quote: Across all animals, we found that a substantial fraction of detected SWRs contained
    remote replay ... 35.1%, 41.1%, 34.5%, and 47.2% for the 4 subjects (Figure 2F)
  depends_on:
