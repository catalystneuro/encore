    value: 0.011
    tolerance: 0.0011
  - quantity: R2, subject 2
    value: 0.028
    tolerance: 0.0028
  - quantity: R2, subject 3
    value: 0.012
    tolerance: 0.0012
  - quantity: R2, subject 4
    value: 0.018
    tolerance: 0.0018
  criterion: As dfs_ripcontent.m part 8. Search trials (task phase <= 1) of all blocks; for each
    trial and each arm last visited k trials ago (lockout trials not counted), the count of box
