- id: fig3b-search-prevgoal-enriched
  statement: In search trials where the past, future and previous goal arms are distinct, the
    previous goal arm is consistently and strongly over-represented in pre-choice remote replay,
    about 20% of these events, in all subjects.
  source: Results, Replay content is enriched for previous goal locations, paragraph 2; Figure 3B
  quote: In contrast, we saw consistent and strong enrichment for replay of the previous goal arm
    ... such replay accounted for roughly 20% of all pre-choice remote replay events during these
    search trials (Figure 3B, previous goal)
  statistics:
  - test: Wilcoxon rank-sum test against a random distribution matched for remote event numbers
      per session
    p: 0.05
    p_relation: "<"
    n: 22, 23, 16 and 26 sessions per subject
  depends_on:
  - fig2f-remote-fraction
  expected:
    quantity: previous goal fraction of box remote replay, search, session median, each subject
    value: 0.2
    tolerance: 0.02
  criterion: As the Methods (Quantification of replay content) and dfs_ripcontent.m part 4. Box
    remote events, sessions after the first trial block, search trials with past, future and
    previous goal all distinct, sessions with at least 5 such trials; per session the count of
    events of each category over all remote events. The null is the open detail; readings, each
    run, (a) Methods, per session 5000 draws of a random arm 1 to 8 for each event, the null
    values of all included sessions pooled; (b) dfs_ripcontent.m, 100 draws per session pooled;
    (c) 5000 draws over the subject's events pooled across sessions. Per subject, a two-sided
    Wilcoxon rank-sum test of session fractions against the null. "Roughly 20%" does not say
    which summary; the session median (the boxplot's) and the session mean are both read.
    Reproduced when the previous goal fraction is above the null at p < 0.05 in all four
    subjects under every null reading and the median or the mean is within tolerance; partially
    reproduced when it is enriched in all four but neither is within tolerance.
- id: fig3b-search-past-depleted
  statement: In those search trials the immediately past arm is replayed far less often than
    chance.
  source: Results, Replay content is enriched for previous goal locations, paragraph 2; Figure 3B
  quote: we found far fewer replays of the immediate past arm than would be expected by chance
    (Figure 3B, past)
  statistics:
  - test: Wilcoxon rank-sum test against a random distribution
    p: 0.05
    p_relation: "<"
    n: 22, 23, 16 and 26 sessions per subject
  depends_on:
  - fig3b-search-prevgoal-enriched
  criterion: Selection, measure, null readings and test as fig3b-search-prevgoal-enriched.
    Reproduced when the past fraction is below the null at p < 0.05 in all four subjects under
    every reading; partially reproduced in two or three.
- id: fig3b-search-future-inconsistent
  statement: In those search trials the upcoming (future) arm shows a small but significant
    enrichment in two of the four subjects only.
  source: Results, Replay content is enriched for previous goal locations, paragraph 2; Figure 3B
  quote: while we did see a small but significant enrichment for the upcoming arm in two out of
    four subjects, this enrichment was not consistent across animals (Figure 3B, future)
  statistics:
  - test: Wilcoxon rank-sum test against a random distribution
    p: 0.05
    p_relation: "<"
    n: 22, 23, 16 and 26 sessions per subject
  depends_on:
  - fig3b-search-prevgoal-enriched
  criterion: Selection, measure, null readings and test as fig3b-search-prevgoal-enriched.
    Reproduced when the future fraction is significantly above the null (p < 0.05) in fewer than
    four subjects and its session median is below that of the previous goal in every subject.
    The count of subjects with significant enrichment is reported; the paper's count is two.
- id: fig3b-search-other
  statement: Each of the other arms is replayed at about chance per arm, yet the other arms
    together make up the majority of pre-choice remote replay.
  source: Results, Replay content is enriched for previous goal locations, paragraph 2; Figure 3B
    right
  quote: Finally, replay of other arms occurred at roughly chance levels per arm (Figure 3B,
    other), but the total fraction of "other" events comprised the majority of replay events
    overall (Figure 3B, right)
  depends_on:
  - fig3b-search-prevgoal-enriched
  criterion: Per session, other-arm events over all remote events divided by 5 (per arm) and
    not divided (total), as the Methods and dfs_ripcontent.m part 4. "Roughly chance" has no
    test in the text; the per-arm session median is compared with 0.125 using the protocol's
    10% tolerance (0.1125 to 0.1375) and the rank-sum p against the null is reported.
    Reproduced when, in all four subjects, the per-arm median is within that range and the
    total-other median is above 0.5.
- id: fig3c-repeat-prevgoal
  statement: In repeat trials where past, future and current goal are the same arm and the
    previous goal is distinct, all animals still strongly over-replay the previous goal, while
    the future (past and goal) arm shows only a small and variable effect; other arms together
    are again the majority.
  source: Results, Replay content is enriched for previous goal locations, paragraph 3; Figure 3C
  quote: During the large subset of repeat trials in which the past, future, and goal arm refer to
    the same location, distinct from the previous goal arm, all animals still showed a strong and
    highly significant tendency to replay the previous goal location (Figure 3C, previous goal).
    In contrast, replay of the future arm still showed only a small and variable effect
  statistics:
  - test: Wilcoxon rank-sum test against a random distribution
    p: 0.05
    p_relation: "<"
    n: 23, 30, 22 and 31 sessions per subject
  depends_on:
  - fig3b-search-prevgoal-enriched
  criterion: As fig3b-search-prevgoal-enriched, for repeat trials (task phase > 1) after the
    first block where past, future and current goal are one arm and the previous goal differs;
    other arms per arm are divided by 6. Reproduced when, under every null reading, the previous
    goal fraction is above the null at p < 0.01 ("highly significant", the figure's ** level)
    in all four subjects, the future/past/goal fraction is significantly above the null in
    fewer than four subjects or has a median below that of the previous goal in every subject,
    and the total-other median exceeds 0.5 in all four.
- id: fig3d-glm-search
  statement: In a Poisson GLM over all search trials, being the previous goal roughly doubles an
    arm's replay rate, the strongest effect; the past arm is consistently replayed less; the
    future arm has a small increase significant in three of four subjects.
  source: Results, Replay content is enriched for previous goal locations, paragraph 5; Figure 3D
  quote: During search trials, previous goal arm status had the strongest impact on replay, such
    that if an arm was the previous goal, there was an approximately two-fold increase in replay
    rate from baseline (Figure 3D). The past arm showed a significant and consistent reduction in
    the rate of replay. The future category showed a small increase in replay rate that was
    significant in three of the four subjects but not in the fourth
  depends_on:
  - fig2f-remote-fraction
  expected:
    quantity: previous goal fold change, search GLM, each subject
    value: 2
    tolerance: 0.2
  criterion: As the Methods (Generalized linear models to measure the effect of arm category)
    and dfs_ripcontent.m part 5. Per subject, eight rows per search trial (task phase <= 1),
    response the count of box remote continuous events of that arm, binary predictors future,
    past and previous goal, Poisson log link, 99% Wald intervals, exponentiated. The trial set
    is the open detail; (a) Methods, trials after the first block of each session (main);
    (b) dfs_ripcontent.m, all search trials with the previous goal predictor zero in the first
    block, whose trial counts appear to be those of the legend (711 here against 534 search
    trials after the first block in Figure 5A), run as a variant. Reproduced under (a) when, in
    all four subjects, the previous goal fold change has its interval above 1 and is the largest
    of the three, the past fold change has its interval below 1, and the future interval is
    above 1 in at most three subjects; the previous goal values are compared with 2 within
    tolerance, and partially reproduced when only that fails. The pooled
    fit of the code is shown too. The legend gives 711, 848, 725 and 1065 trials per subject.
- id: fig3e-glm-repeat
  statement: In a Poisson GLM over all repeat trials the previous goal arm is again the strongest
    and most consistent driver of replay and the past arm is reliably replayed less.
  source: Results, Replay content is enriched for previous goal locations, paragraph 5; Figure 3E
  quote: Applying the GLM approach to repeat trials yielded similar results (Figure 3E),
    confirming that for both search and repeat phase, the previous goal arm was the strongest and
    most consistent driver of replay content, while the replay of the past arm was reliably
    reduced
  depends_on:
  - fig3d-glm-search
  criterion: As fig3d-glm-search with a fourth predictor, current goal, over repeat trials (task
    phase > 1), with the same two trial-set readings. In dfs_ripcontent.m part 5 the current goal
    on the final unrewarded trial of a block is already the new goal; this is kept. Reproduced
    when, in all four subjects, the previous goal interval is above 1 and its fold change is
    the largest of the four predictors, and the past interval is below 1. The legend gives 1347,
    1661, 1154 and 1730 trials per subject.
- id: fig4ab-current-goal-late
  statement: Replay of the current goal is consistently enhanced only late in the repeat phase
