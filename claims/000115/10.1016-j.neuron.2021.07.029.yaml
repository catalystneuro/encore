- id: fig8-outer-prevgoal
  statement: Replay at the rewarded outer arm port also favours the previous goal; beyond the
    expected strong over-representation of the current arm, the previous goal arm is replayed
    more than other arms, consistently in a GLM over all rewarded trials.
  source: Results, Enhanced replay of previous goal at outer arms, paragraph 2; Figure 8A-B
  quote: However, we also observed greater replay of the previous goal compared to other arms
