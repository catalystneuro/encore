- id: fig6a-pg-replay-persists
  statement: Replay of a goal arm stays enriched long after it stops being rewarded, peaking
    several trials after the switch, extended and significant in all subjects; two subjects
    also show elevated replay before the switch.
  source: Results, Previous goal replay persists through multiple trial blocks, paragraph 2;
    Figure 6A
  quote: The enrichment for replay of a goal location peaked several trials after it ceased to
    provide reward and continued for many subsequent trials. This enrichment was extended and
