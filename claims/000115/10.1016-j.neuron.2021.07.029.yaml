- id: fig1ef-reward-rate
  statement: Aligned to the goal change, the outer-arm reward rate starts at chance (0.125) and
    rises; aligned to the first reward at the new goal, it is well above chance, so all subjects
    keep visiting a goal once found.
  source: Results, Rats learn to perform a flexible spatial memory task, paragraph 5; Figure 1E
    and 1F
  quote: Aligned to the first search trial of each trial block, the reward rate at the outer arms
    for all subjects began at chance (0.125) and rose (Figure 1E) ... the outer reward rate was
    well above chance, indicating that all subjects preferentially visited the goal location
    consistently after finding it (Figure 1F)
  depends_on:
  - fig1d-sessions-blocks
  criterion: As dfs_ripcontent.m part 2, per subject over trial blocks with at least four
    rewards, the final unrewarded trial of the block dropped; a trial scores 1 when rewarded;
    binomial S.E.M. sqrt(p(1-p)/n), trials 1 to 15. The paper gives no test, so the figure's
    S.E.M. band is read. Reproduced when, in all four subjects, the band on trial 1 of Figure 1E
    reaches 0.125 or lies below it, the rate rises over trials 1 to 15, and every point of
    Figure 1F (trials 1 to 15 after the first reward) has its band above 0.125.
- id: figs1c-swr-reward-consumption
  statement: SWRs occur mainly during reward consumption at the home port, the center ports and
    the rewarded goal arm, and are rarely detected at unrewarded outer ports.
  source: Results, Most SWRs contain interpretable spatial content, paragraph 1; Supplementary
    Figure 1C
  quote: SWRs occurred primarily during reward consumption (Supplementary Figure 1C) ... As
    expected, SWRs were rarely detected at non-goal outer arm ports, which did not provide reward
  criterion: SWRs detected as in the Methods (consensus ripple envelope, 150 to 250 Hz, over all
    CA1 cell-layer tetrodes, above 2 SD of the session mean for at least 15 ms, bounds at the
    mean crossing, immobility below 4 cm/s). Per session, time, SWR count and SWR rate in each
    trial phase (home port, center port before and after reward, rewarded outer port,
    unrewarded outer port), as dfs_ripcontent.m part 12. Reproduced when, in all four subjects,
    the median over sessions of the SWR count at unrewarded outer ports is the lowest of the
    five phases and its SWR rate is below that of each reward phase.
- id: figs3abc-decode-accuracy
  statement: During movement the decoded position (posterior maximum) is usually on the same or
    an adjacent maze segment as the real position, and the median deviation between them is
    less than one 5 cm bin, on every maze segment.
  source: Results, Most SWRs contain interpretable spatial content, paragraph 3; Supplementary
    Figure 3A-C; Methods, Spatial decoding, paragraph 5
  quote: The median deviation between predicted and real position was less than a single spatial
    bin (5 cm), indicating that the maximum of the posterior and the subject's real position most
    often corresponded to the same spatial bin, and this was consistent across all segments of
    the maze
  criterion: Decoding as the Methods give it (clusterless, encoding on spikes above 100 uV at
    > 4 cm/s with a 20 uV Gaussian kernel on the four amplitudes and 5 cm bins, 2 ms steps, a
    continuous and a uniform fragmented movement state, 0.98 probability of staying in a state,
    acausal smoother, each session decoded alone, a spike's own position not used to decode it).
    For 30 Hz frames during movement, the frame is same/adjacent when the real and decoded
    segments match or one is the box; for those frames the deviation in 5 cm bins.
    Reproduced when, in every subject, the median deviation is 0 bins (less than one bin) on
    the pooled frames and on each of the nine segments. dfs_decodequant_movement.m part 2 plots
    the mean deviation per segment; it is shown as a variant.
- id: figs3df-goal-arm-no-remapping
  statement: Decoding error on the goal arm shows no systematic change over the course of a
    trial block, so repeated reward does not change spatial coding at the ensemble level.
  source: Results, Most SWRs contain interpretable spatial content, paragraph 3; Supplementary
    Figure 3D-F
  quote: We found no systematic changes in the deviation over the course of the trial block,
    indicating that the changing reward location did not alter overall spatial coding at the
    ensemble level
  depends_on:
  - figs3abc-decode-accuracy
  criterion: A claim of absence. The legend names no test; dfs_decodequant_movement.m part 6
    compares the mean deviation in the last 5 bins (25 cm) of the goal arm on the first against
    the last rewarded goal visit of each block with a Wilcoxon rank-sum test, and fits a line to
    the per-visit deviations of each block with at least 4 visits. Reproduced when the rank-sum
    test gives p >= 0.05 in each subject; the slope distributions (median and its sign) are
    reported either way.
- id: figs3g-continuous-fraction
  statement: About 95% of SWRs contain spatially continuous representations.
  source: Results, Most SWRs contain interpretable spatial content, paragraph 4; Supplementary
    Figure 3G
  quote: We found that the vast majority of SWRs (~95%) contained spatially continuous
    representations of the environment
  depends_on:
  - figs3abc-decode-accuracy
  expected:
    quantity: fraction of SWRs that are spatially continuous, mean over sessions, each subject
    value: 0.95
    tolerance: 0.095
  criterion: Per session, spatially continuous SWRs (as in the opening comment, with the 0.3
    single-segment share) over all SWRs inside trial intervals, as dfs_ripcontent.m part 3
    (fraccohall). Reproduced when the session mean of each subject is within tolerance.
- id: likelihood-decode-same-segment
  statement: A history-independent Bayesian decoder with 20 ms bins and no movement model
    assigns more than 90% of SWRs to the same maze segment as the state space decoder.
  source: Results, Most SWRs contain interpretable spatial content, paragraph 4
  quote: We found that >90% of SWRs decoded to the same maze segment and our main results were
    unchanged with the use of this simplified decoding approach
  depends_on:
  - figs3abc-decode-accuracy
  expected:
    quantity: fraction of SWRs assigned the same segment by both decoders
    value: 0.9
    tolerance: 0.09
  criterion: The comparison is not described beyond the sentence. Readings, each run, (a) over
    all SWRs, the segment with the largest summed posterior during the SWR under each decoder;
    (b) over spatially continuous SWRs only. Reproduced when the fraction is above 0.9 under one
    reading, pooled over subjects and in each subject. The "main results unchanged" part is
    tested in robustness-controls.
- id: fig2f-remote-fraction
  statement: A substantial fraction of all detected SWRs contain remote replay, 35.1%, 41.1%,
