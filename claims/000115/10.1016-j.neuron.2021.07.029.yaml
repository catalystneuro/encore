  statement: Among outbound remote events, and among the final remote event before each choice,
    the previous goal is still the most consistently enriched arm, and future and current goal
    replay still do not differ consistently between correct and error trials.
  source: Results, Subsequent arm choice is not biased by replay, paragraph 5; Supplementary
    Figure 8
  quote: For neither of these subsets of events did we see any difference in the relationships
