- id: fig3a-box-majority
  statement: The large majority of spatially continuous replay events occur in the box area,
    before the arm choice, and include local and remote events.
  source: Results, Replay content is enriched for previous goal locations, paragraph 1; Figure 3A
  quote: The large majority of spatially continuous replay events occurred in the box area,
    before arm choice, and included both local and remote representations (Figure 3A)
  depends_on:
  - figs3abc-decode-accuracy
  criterion: Pooled over sessions per subject, the shares of continuous events that are box
