    value: 24
    tolerance: 2.4
  - quantity: sessions, subject 2
    value: 32
    tolerance: 3.2
  - quantity: sessions, subject 3
    value: 23
    tolerance: 2.3
  - quantity: sessions, subject 4
    value: 33
    tolerance: 3.3
  - quantity: trial blocks, subject 1
    value: 89
    tolerance: 8.9
  - quantity: trial blocks, subject 2
    value: 85
    tolerance: 8.5
  - quantity: trial blocks, subject 3
    value: 105
    tolerance: 10.5
  - quantity: trial blocks, subject 4
    value: 166
    tolerance: 16.6
  criterion: Sessions are the full-task sessions of each subject, less sessions 1 and 3 of
    subject 1 (Methods, Spatial decoding). Trial blocks are counted as in dfs_ripcontent.m part
    2, blocks with at least four rewards at the goal (a trial of task phase >= 4, the code's
