    tolerance: 0.0351
  - quantity: remote fraction of SWRs, subject 2
    value: 0.411
    tolerance: 0.0411
  - quantity: remote fraction of SWRs, subject 3
    value: 0.345
    tolerance: 0.0345
  - quantity: remote fraction of SWRs, subject 4
    value: 0.472
    tolerance: 0.0472
  criterion: Per session, remote continuous events (segment other than the current one) over all
