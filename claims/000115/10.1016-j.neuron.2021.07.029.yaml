    p: 0.05
    p_relation: "<"
    n: 159-433, 212-555, 144-386 and 198-520 trials per bar per subject
  - about: correlation, subject 1
    test: correlation
    statistic: R2 = 0.011
    p: 1.04e-4
  - about: correlation, subject 2
    test: correlation
    statistic: R2 = 0.028
    p: 4.04e-13
  - about: correlation, subject 3
    test: correlation
    statistic: R2 = 0.012
    p: 7.94e-5
  - about: correlation, subject 4
    test: correlation
    statistic: R2 = 0.018
    p: 2.76e-8
  depends_on:
