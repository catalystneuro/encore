  quote: Indeed, we found a consistent enhancement of current goal replay only in the late portion
    of the repeat phase. In contrast, the three other categories did not differ substantially
    between early and late conditions
  depends_on:
  - fig3e-glm-repeat
  criterion: The repeat GLM of fig3e-glm-repeat fit separately to early and late repeat trials.
