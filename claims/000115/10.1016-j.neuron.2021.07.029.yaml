# Claims for Gillespie, Astudillo Maya, Denovellis, Liu, Kastner, Coulter, Roumis, Eden & Frank
# (2021), Neuron 109, 3149-3163, on dandiset 000115.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-22,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the accepted author manuscript in PubMed Central (PMC8497431, NIHMS1731801), in
# paper/10.1016-j.neuron.2021.07.029.txt: Summary, Introduction, Results, Discussion, STAR
# Methods, all figure legends, and the Supplemental Information PDF (Supplementary Figures 1
# to 8 with legends), extracted into the same file. The version of record was not read; the
# bioRxiv preprint (version 2, paper/10.1101-2021.03.09.434621.txt) was not used for claims.
# The PDF was not needed: every claim rests on a sentence or a legend.
#
# Code read: the analysis code the paper links (doi:10.5281/zenodo.5140706), which is the
# GitHub repository LorenFrankLab/Gillespie_Neuron_2021, tag v1.0, commit
# 1be6a6a7dbd806154a544d6f509452617e52d8c3 (the later head 48108d8 changes only the README).
# MATLAB scripts in the Frank lab filter framework. dfs_ripcontent.m, parts 1 to 16, makes
# Figures 1D to 8 and Supplementary Figures 1, 3G-H, 5 to 8 (its README maps parts to
# panels); dfa_ripcontent.m labels trials and assigns each SWR to a trial phase;
# utilities/label_trial_interval.m codes each trial's task phase; dfa_makeFFripdecodes.m
# summarises the decoder posterior over each SWR; dfs_decodequant_movement.m makes
# Supplementary Figure 3A-F; dfa_ripcontent_ripspeed.m and dfs_ripcontent_ripspeed.m make
# Supplementary Figure 8A-D; dfs_muacontent.m, dfs_likcontent.m, dfs_ripcontent_3state.m and
# dfs_ripcontent_contentthresh.m are the controls. The SWR detector (filterframework_shared),
# the linearisation and the clusterless state space decoder itself (Spykshrk,
# github.com/LorenFrankLab/spykshrk_realtime, and replay_trajectory_classification,
# github.com/Eden-Kramer-Lab/replay_trajectory_classification) are not in the repository.
# Details the code settles, used in the criteria below:
#   - Sessions: full-task ("goal") sessions without forage assist and with a good decode.
#     Subjects 1 to 4 of every legend are, in the code's order, jaq, roquefort, despereaux and
#     montague.
#   - Trial task phase (label_trial_interval.m): 0 or -0.2 for search trials before the goal
#     is found; an integer n for a rewarded visit, the n-th reward of the block (1 is the
#     search trial that finds the goal); n + 0.3, 0.5 or 0.8 for a repeat error after n
#     rewards; n + 0.9 for the final unrewarded visit to the old goal. Search is phase <= 1,
#     repeat is phase > 1. Lockout (timeout) trials are dropped; the past arm is the last arm
#     visited, lockouts included (prevarm column 2), except in Figure 7 (column 1).
#   - Replay events: SWRs during immobility (< 4 cm/s) inside a trial's home, center port
#     (delay and reward) or outer port interval. A SWR is spatially continuous when the
#     continuous state has more 2 ms bins above 0.8 than the fragmented state (ties go to
#     fragmented), and its maze segment is the one with the largest mean posterior, kept only
#     when that share is > 0.3. Box events are those at the home and center ports; a box
#     event is remote when its segment is an arm. An outer event is local when its segment is
#     the arm the rat is on.
#   - Correct repeat trials include the final n + 0.9 trial; error trials are the n + 0.3,
#     0.5 and 0.8 trials.
#
# Data the paper used: four male Long-Evans rats, each with a 30-tetrode bilateral drive in
# dorsal CA1, recorded during 45 to 90 min sessions of an eight-arm win-stay lose-switch task
# (home port, two center ports with a 2 to 20 s delay, eight outer arm ports, one rewarded
# goal arm changing after 4 to 15 rewards). 24, 32, 23 and 33 sessions per subject after two
# sessions of subject 1 were excluded for poor decoding. Measured: continuous 30 kHz tetrode
# data (LFP 0.1 to 300 Hz, spikes above 100 uV with four-channel amplitudes), port beam
# breaks, lights and reward delivery, head LED position at 30 Hz, and the task log with goal
# arm and trial structure. Dandiset 000115 says it holds the CA1 tetrode electrophysiology
# and the behavioural data (port triggers, reward delivery, position tracking) of this paper.
# The SWR times, the linearised position and the decoder output are derived; every claim on
# replay content needs them recomputed with the paper's methods (data: dataset; the decoder
# software is cited above).
#
# Not claimed: the Discussion's interpretation (storage, not planning) and its readings of
# earlier studies; Supplementary Figure 5 (SWR features by event class), shown without a
# finding stated in the text; Supplementary Figure 2 and 4 (schematic and examples).
schema_version: 2
