# Claims for Chowdhury, Glaser & Miller (2020) on dandiset 000127.
# Source: the paper's Results and figure captions (open access).
# Quotes added 2026-10-19 from the full text; statistics added 2026-10-19 from the full text.
schema_version: 1
dandiset: "000127"
paper: doi:10.7554/elife.48198
claims:
- id: fig4-whole-arm-fits-better
  statement: In the two-workspace experiment, the whole-arm model predicted neural activity
    better than the hand-only model for 238 of 288 neurons, with no significant difference for
    the other 50.
  source: Figure 4
  quote: Of the 288 neurons recorded across the 8 sessions, 238 were significantly better predicted
    by the whole-arm model than the hand-only model, and for the other 50, there was no significant
    difference
- id: fig5-consistent-across-workspaces
  statement: A whole-arm model trained on both workspaces explained as much neural variance as
    models trained within a single workspace.
  source: Figure 5
  quote: The symbols lying very close to the unity line in each panel of Figure 5 indicate that the
    full model explained just as much neural variance as did the individual models.
- id: fig6-tuning-curves
  statement: The whole-arm model predicted the shape of directional tuning curves in the two
    workspaces better than the hand-only model for 138 of 288 neurons, and worse for 2.
  source: Figure 6
  quote: Only two out of 288 neurons were significantly better predicted by the hand-only model (using
    p < 0.05), while 138 of 288 neurons were significantly better predicted by the whole-arm model.
- id: fig7-pd-shift
  statement: The whole-arm model predicted the shifts of preferred direction between workspaces
    better than the hand-only model, with a circular variance accounted for of 0.75 against 0.57.
  source: Figure 7B
  quote: Figure 7B shows that the whole-arm model once again out-performed the hand-only model, with an
    average cVAF over all neurons of 0.75 compared to 0.57.
  statistics:
  - about: whole-arm against hand-only cVAF, the sessions in which the whole-arm model out-performed
    test: corrected resampled t-test on repeated 5-fold cross-validation
    p: 0.05
    p_relation: "<"
    corrected: Bonferroni (correction factor of 6)
    n: 7 of 8 sessions, 100 cross-validation samples of the cVAF per model and session
  - about: whole-arm against hand-only cVAF, the remaining session
    test: corrected resampled t-test on repeated 5-fold cross-validation
    p: 0.05
    p_relation: ">"
    corrected: Bonferroni (correction factor of 6)
    n: 1 session, 100 cross-validation samples of the cVAF per model
- id: fig8-hand-speed-similar
  statement: In the 120 ms after movement onset, average hand speed was similar in active reaches
    and passive bumps.
  source: Figure 8B
  quote: However, average movement speed was similar between active and passive trials in this 120 ms
    window, which we used for data analysis.
- id: fig8-arm-kinematics-separable
  statement: A linear discriminant classifier predicted whether a movement was active or passive
    89% of the time from whole-arm kinematics in the analysis window.
  source: Results, Area 2 represents passive movements differently from active reaches, paragraph 3
  quote: Averaged over the sessions, a linear discriminant analysis (LDA) classifier could predict the
    movement type 89% of the time, using only the whole-arm kinematics in the analysis window
  expected:
    quantity: classification accuracy
    value: 0.89
    tolerance: 0.05
- id: fig8-neurons-separable
  statement: Many neurons had an above-chance separability index, the accuracy of a linear
    discriminant predicting the trial type from that neuron's firing.
  source: Figure 8E
  quote: we used LDA to classify movement type based on individual neurons, calling this prediction rate
    the neuron's 'separability index' (Figure 8E). We found that many neurons had an above chance
    separability index
- id: fig9-whole-arm-fits-better
  statement: In the active/passive experiment the whole-arm model again tended to out-perform
    the hand-only model, but for many more neurons than in the two-workspace experiment the
    difference was not significant.
  source: Figure 9
  quote: the whole-arm model again tended to out-perform the hand-only model (Filled circles above the
    dashed unity line in Figure 9). However, there were many more neurons (open circles) for which the
    difference between models was insignificant...
- id: fig10-inconsistent-across-conditions
  statement: Unlike in the two-workspace experiment, many neurons had no consistent relationship
    with arm kinematics across active and passive movements, shown by negative pseudo-R2 for
    the model trained on both conditions.
  source: Figure 10
  quote: Surprisingly however, unlike our results from the two-workspace experiment (see Figure 5), many
    neurons in the active/passive task did not have this consistent relationship, indicated by the many
    neurons with negative pR2 values for the model trained over both conditions.
- id: fig11-separability-vs-consistency
  statement: The consistency of the whole-arm model, its pseudo-R2 when trained on both
    conditions, correlated negatively with a neuron's separability index.
  source: Figure 11B
  quote: Interestingly, we found the opposite result—model consistency actually correlated negatively with
    the separability index.
