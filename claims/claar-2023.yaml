  criterion: Sessions with recovery stages; PCIst per stage with trials matched within session.
    Readings for the sample (a) all 13 sessions with a first recovery stage, the RM ANOVA on those
    with all four stages; (b) only sessions with all four stages. One-way RM ANOVA, post hoc paired
    t-tests with Benjamini-Hochberg FDR. "Reaching pre-anesthesia levels" is not judged; the paper gives
    no test of it, and the awake against recovery 0 to 30 min post hoc pair is reported. Reproduced when, under one reading, the
    four means are within tolerance, the state effect has p < 0.05, recovery 0 to 30 min exceeds
