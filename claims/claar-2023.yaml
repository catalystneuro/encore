# Claims for Claar, Rembado, Kuyat, Russo, Marks, Olsen & Koch (2023) on dandiset 000458.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23, protocol
# pilot-10 as stated in docs/protocol.md (Reader, steps 1 to 4).
#
# Text read: the version of record (eLife 12, RP84630, 2023), full text as served by Europe PMC
# (paper/10.7554-elife.84630.txt), with Results, Discussion, Methods, all figure legends including
# the figure supplement legends, the eLife assessment, the public reviews and the authors' response.
# eLife has no separate supplementary text; the figure supplements are figures whose legends are in
# the text. No PDF was supplied and none was needed. The bioRxiv preprint (10.1101/2022.07.22.501195,
# the paper the dandiset names) is also under paper/ and was not used; the version of record replaces it.
#
# Code read: the paper links only the PCIst code, https://github.com/renzocom/PCIst, cited at commit
# e495a0a (e495a0ae299e9d5056473659722e2258738e24ba, "fix default min_snr"), read at that commit. It
# holds calc_PCIst (pci_st.py) and a Matlab port. The paper sets baseline window, response window,
# min_snr, max_var and k; the other parameters are left at the function defaults (no average
# reference, no baseline correction, no resampling, no embedding, n_steps = 100). The paper links no
# analysis code of its own (spike sorting follows Siegle et al. 2021; modulated neurons follow McBride
# et al. 2023; neither repository is linked here).
#
# Data the paper used, as it reports them. C57BL/6J mice, 37 implanted, 23 included after EEG quality
# control (8 mice) and stimulation-artifact exclusion (8 sessions in 6 mice). Head-fixed on a running
# wheel, in darkness. A 30-electrode skull EEG array (2.5 kHz), and in 26 of 37 mice up to three
# Neuropixels probes (3a or 1.0; spike band 30 kHz, LFP band 2.5 kHz) in MO, ACA, SS, VIS and
# somatomotor-related thalamic nuclei (SM-TH: AV, CL, MD, PO, RT, VAL, VPL, VPM, VM). A bipolar
# stimulating electrode in MOs or SSp, layer 2/3 ("superficial") or layer 5/6 ("deep"); some mice
# were stimulated at more than one site. Single biphasic, cathodic-first pulses, 200 us per phase,
# 10 to 100 uA, 3.5 to 4.5 s apart; up to 120 pulses at each of three intensities per stage (360 in
# all). Stages: awake (trials split into quiet wakefulness, wheel speed 0 cm/s from -0.5 to +0.5 s,
# and running, speed above 0), isoflurane anesthesia (1 to 1.5% maintenance), and in 16 mice one or
# two recovery stages within 1 h. Measured variables: EEG, Neuropixels LFP and sorted units with
# CCFv3 area per channel, wheel position, stimulus times, isoflurane concentration. The dandiset
# (DANDI:000458, version 0.230317.0039 in the paper's Data availability) is named for these
# recordings.
#
# Details the paper leaves open that bear on most claims, with the readings it allows:
# - Stimulus intensity. Three intensities were delivered per stage, but no analysis says which
#   pulses it uses. The trial counts (anesthetized median 120 trials; quiet plus running about 118)
#   indicate one intensity's 120 pulses per state. Readings: (a) the highest intensity; (b) the
#   medium intensity, the one the Methods say was chosen to give visible evoked responses on most
#   electrodes; (c) where the dataset marks which pulses the paper analysed, those.
# - Awake trials for Figures 1 to 6 and 8B and 8C. Readings: (a) all awake trials (Figure 8C says
#   awake includes quiet wakefulness and running trials); (b) quiet wakefulness only (the
#   Discussion places the late ERP in quiet wakefulness).
# - Unit of N. Counts often exceed 23 mice (Figure 1E has 12 + 18 = 30; Figure 4 says 24 animals;
#   Figure 8B says 31 sessions across 24 mice), so N counts a mouse and stimulation site. Methods
#   give MOs L2/3 N=10, MOs L5/6 N=11, SSp L2/3 N=8, SSp L5/6 N=11 mice. A claim is tested on one
#   value per mouse and stimulation site unless its criterion says otherwise.
# - Good EEG electrodes were chosen by visual inspection (23 +/- 4 of 30 kept). Readings: (a) the
#   electrodes the dataset marks as good, if it does; (b) otherwise all electrodes not flagged, with
#   the selection reported as a deviation.
# - High-quality units follow "metrics described by Siegle et al., 2021", with no thresholds printed.
#   Readings: (a) units the dataset marks as passing quality control; (b) the thresholds of Siegle
#   et al. 2021, to be read from that paper. RS units have waveform duration > 0.4 ms, FS <= 0.4 ms.
# - Stimulated cortex is the area holding the stimulating electrode, recorded by the probe within
#   0.5 mm of it (MO for MOs stimulation, SS for SSp); non-stimulated regions are the other cortical
#   areas recorded (MO, ACA, SS, VIS), ipsilateral. Cortical analyses use RS units unless stated.
# - Paper statistics: Shapiro-Wilk normality test, then two-sided Student t-test (scipy ttest_ind)
#   or paired t-test (ttest_rel), else Mann-Whitney U or Wilcoxon signed-rank (scipy defaults);
#   ANOVA or Friedman for several groups, post hoc pairs corrected by Benjamini-Hochberg FDR. Text
#   values are mean +/- SEM (normal data) or median [IQR]. Tolerances below follow the protocol:
#   the SEM where the paper gives one, otherwise 10%.
