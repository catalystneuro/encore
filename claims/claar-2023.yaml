- id: fig1e-erp-duration
  statement: ERPs evoked by superficial stimulation were shorter than those evoked by deep
    stimulation (0.4 +/- 0.0 against 0.5 +/- 0.1 s), but the difference was not significant.
  source: Results, Global evoked responses are modulated by the depth of the cortical stimulation
    site, paragraph 3; Figure 1E
  quote: "The total duration of the ERP was shorter when stimulating superficial layers compared to
    deep layers although not significant (mean ERP duration for superficial stimulation: 0.4±0.0 s;
    deep stimulation: 0.5±0.1 s; Student’s two-tailed t-test, p=0.0843"
  statistics:
  - test: Student's two-tailed t-test
    p: 0.0843
    n: 12 superficial and 18 deep stimulation sessions
  expected:
  - quantity: mean ERP duration, superficial stimulation
    value: 0.4
    tolerance: 0.05
    unit: s
  - quantity: mean ERP duration, deep stimulation
    value: 0.5
    tolerance: 0.1
    unit: s
  criterion: The superficial SEM is printed as 0.0, so its tolerance is the printing precision
    (half of 0.1 s). Per session, GFP of the awake ERP (as in fig1d-two-erp-peaks), z-scored to the
    baseline -2 to 0 s; duration is the time the z-scored GFP exceeds z = 3 within 0 to +2 s
    (Methods, ERP magnitude and duration). Open, with readings; (a) the total time above z = 3; (b)
