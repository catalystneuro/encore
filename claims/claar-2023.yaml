  source: Results, Global evoked responses are modulated by the depth of the cortical stimulation
    site, paragraph 3
  quote: "in layer 2/3 (superficial: 0.41±0.04 mm below the brain surface) or in layer 5/6 (deep:
    1.06±0.05 mm below the brain surface"
  expected:
  - quantity: superficial stimulation depth, mean
    value: 0.41
    tolerance: 0.04
    unit: mm
  - quantity: deep stimulation depth, mean
    value: 1.06
    tolerance: 0.05
    unit: mm
  criterion: Mean over stimulation sites of the depth below the brain surface recorded for the
    stimulating electrode. The Methods give per-group depths too (MOs L2/3 0.37 +/- 0.04, MOs L5/6
    1.15 +/- 0.06, SSp L2/3 0.47 +/- 0.06, SSp L5/6 0.92 +/- 0.05 mm), which are reported as a
    variant. Reproduced when both means are within tolerance.
- id: eeg-good-electrodes
  statement: After artifact masking and visual inspection, an average of 23 +/- 4 of the 30 EEG
    electrodes per subject were kept as artifact-free.
  source: Methods, Data processing, EEG
  quote: leaving an average of 23±4 artifact-free electrodes out of 30 for each subject
  expected:
    quantity: artifact-free EEG electrodes per subject, mean
    value: 23
    tolerance: 4
  criterion: Tested only if the dataset marks good or bad EEG electrodes; the paper's selection is
    by eye and cannot be redone. The mean over subjects of the number marked good is compared with
    23, tolerance the stated spread of 4.
- id: fig1d-two-erp-peaks
  statement: Deep (layer 5/6) stimulation in the awake state usually evokes an ERP with two
    prominent peaks, near 25 ms and near 180 ms; the late component is not evident with
    superficial stimulation, in MOs or SSp.
  source: Results, Global evoked responses are modulated by the depth of the cortical stimulation
    site, paragraph 3; Figure 1C and 1D
  quote: "when we stimulated layer 5/6 during the awake period, we usually observed two prominent
    peaks in the ERP: an initial response around 25 ms and a secondary peak at around 180 ms
    post-stimulation ... The early component was preserved, whereas the second, late component was
    not evident when stimulating superficially in either area"
  criterion: The paper gives no peak detection method. ERP is the trial average of the
    average-referenced EEG (0.1 to 100 Hz, third-order Butterworth, epochs -2 to +2 s, -2 to +2 ms
    excluded; Methods, EEG and ERPs); global field power (GFP) is the SD across good electrodes at
    each time, z-scored to -2 to 0 s (Methods, ERP magnitude and duration). Readings of a peak, in
    windows taken from the paper's own phases (initial excitation 2 to 25 ms, rebound 150 to 300
    ms, chosen to align with the ERP peaks; Results, paragraph before Figure 4) and from the
    stated latencies; (a) a local maximum of the z-scored GFP above z = 3 within 2 to 50 ms and
    another within 150 to 300 ms; (b) the same with windows 2 to 25 ms and 100 to 300 ms (the late
    window of Figure 7G). Reproduced when, under one reading, more than half of deep sites show
    both peaks and more than half of superficial sites show no late peak.
- id: fig1-supp1-example
  statement: In the example deep MOs session, the ERP lasts 1.01 s and has a magnitude of 11.13
    SD.s.
  source: Figure 1, figure supplement 1B legend
  quote: The duration of this example is 1.01 s ... The magnitude of this example is 11.13 SD∙s
  expected:
  - quantity: ERP duration, example session
    value: 1.01
    tolerance: 0.101
    unit: s
  - quantity: ERP magnitude, example session
    value: 11.13
    tolerance: 1.113
    unit: SD.s
  criterion: Duration and magnitude as in fig1e-erp-duration. The paper names the example only as
    the deep MOs subject of Figure 1C and 1D (bottom left); a session is accepted as the example if
