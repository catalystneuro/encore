  criterion: Tolerances are the s.e.m. the fig. S1 legend gives. Per rat and condition, the
    mean train velocity over the travel (from tracked head position on the linearized
    track), the number of completed laps and the duration of the travel session. The
    paper does not say how velocity is averaged; readings are (a) over all position
    samples of the session, (b) over samples above 5 cm/s, the Methods' threshold for awake
