# Claims for Drieu, Todorova & Zugaro (2018), Science 362, 675-679, tested on CRCNS hc-18.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-11-10, protocol pilot-14 as stated in docs/protocol.md.
#
# Text read: the version of record (main text, figure legends of Figs. 1 to 3), and the
# author manuscript (HAL hal-02330673v1) for its Materials and Methods, the Fig. 4 legend and
# supplementary figures S1 to S13 with their legends. The extracted text of the version of
# record lacks its page 5 (Fig. 4 and the closing paragraphs), so the Fig. 4 legend is quoted
# from the author manuscript. Where the two versions print different bounds, the version of
# record is recorded: Fig. 1C peak rate P < 10^-3 (manuscript 10^-4); Fig. 1E V-test
# P < 10^-10 (manuscript 10^-11). The Methods' Data acquisition paragraph describes
# "three rats" with tetrodes and "three rats" with octrodes,
# while the paper reports five rats throughout; five is taken as the count.
#
# Data the paper used (Methods, Animal training, Behavioural task; Fig. 1A; fig. S1): five
# adult male Long-Evans rats, each tested on a single day in a novel room, so one session
# per rat. Each session is baseline sleep, Passive 1 travel (treadmill off), sleep, Active
# travel (treadmill on), sleep, Passive 2 travel, sleep. Each travel condition was 2 x ~15
# laps on a 2.20 m x 1.30 m obround track, always forward at ~45-50 cm/s; each sleep epoch
# ~90 min in a flower pot. Measured: sorted CA1 units (pyramidal cells and interneurons),
# LFP at 1250 Hz, and head position from one or two LEDs (30 Hz video, resampled at
# 39.0625 Hz). The data set's description (CRCNS hc-18) says it holds 5 sessions, one
# per rat, with spikes, LFP, positions and event files; it also says custom scripts are
# provided in the archive. Those are part of the dataset's files and were not read here.
#
# Code read: FMAToolbox (github.com/michael-zugaro/FMAToolbox, commit 6bbb366, 2018-03-27),
# the toolbox the Methods name for all analyses. It holds general functions (FiringCurve,
# MapStats, TestRemapping, FieldShift, PhasePrecession, ReconstructPosition, FindSubcycles,
# FindRipples, MTSpectrum and others) but not the paper's own scripts for trajectory
# scores, quadrant scores, z-proportions or pairwise bias correlations. Where the Methods
# and the toolbox defaults disagree (field threshold 30% in the Methods, 20% by default;
# ripple thresholds 1 and 3 s.d. and 20 to 110 ms in the Methods, 2 and 5 s.d. and 20 to
# 100 ms by default; decoding bins), the Methods are followed.
#
# Common methods, all from the Materials and Methods of the author manuscript; the criteria
# below refer to them by name.
# - Units: putative pyramidal cells by k-means on waveform width, trough-to-peak duration
#   and firing rate; only clusters with L-ratio < 0.05 (Data acquisition and preprocessing).
# - Awake spike analyses restricted to linear velocity > 5 cm/s (Firing fields).
# - Firing curves on the linearized track, kernel method, 2.4 cm bins, Gaussian kernel
#   4.5 cm. A field is the set of contiguous bins holding the peak (peak at least 1 Hz in
#   Active, 0.7 Hz in Passive) with rate above 30% of the peak; a place cell is a pyramidal
#   cell with at least one field (Firing fields). Open: a minimum field size. Readings: (a)
#   none, as the Methods give none; (b) FiringCurve's default of 10 bins.
# - Theta cycles: start at peaks of the theta-band (6-10 Hz) filtered LFP; cycles shorter
#   than 80 ms or longer than 200 ms dropped; only runs of at least three contiguous cycles
#   kept (Theta power, frequency and cycles). Peaks and troughs for asymmetry and phase
#   precession from the LFP filtered at 1-40 Hz (Theta asymmetry and phase precession).
#   Open: the LFP channel. Readings: (a) one CA1 pyramidal-layer channel per rat with the
#   largest theta power; (b) the mean of the pyramidal-layer channels, as for ripples.
#   Open: how spike phase is assigned. Readings: (a) linear interpolation between the
#   1-40 Hz peaks (0) and troughs (pi); (b) Hilbert phase of the theta-band filtered LFP.
# - Bayesian decoding (Bayesian trajectory decoding): occupancy prior, Poisson likelihood,
#   trained on each travel session and applied to that session (theta sequences, windows
#   of pi/3, six per cycle) and to the following sleep (replay, 20 ms windows). Baseline
#   sleep is decoded with the model of the travel session whose post-sleep it is compared
#   with. Only events with at least three units, and candidate events lasting > 60 ms.
#   Position bins 2.4 cm, as for firing curves; ReconstructPosition's default of 200 bins
#   is a variant.
# - Trajectory score and slope (Assessing trajectories): R(v, rho) is the mean probability
#   within d = 45 cm of a line, maximized over all v and rho whose total distance is under
#   the 6 m track length, the line wrapping around the track. Significance from 5000
#   shuffles, each circularly shifting the decoded probabilities within each window by a
#   random number of bins; Monte Carlo p is the proportion of shuffled scores above the
#   observed one; significant at p <= 0.05. Normalized score is (score - mean of shuffled
#   scores) / s.d. of shuffled scores. Open: how slopes per phase window become m/s.
#   Readings: (a) with each cycle's duration; (b) with the session's mean theta period.
# - Quadrant score (same section): the central zone of the decoded matrix, +/-1.5 m around
#   the current position and +/-2/3 cycle around the trough, split in four quadrants;
#   (bottom left + top right - top left - bottom right) / sum of all four.
# - Z-proportions (Assessing trajectories, Z-proportions): the score-slope matrix of event
#   proportions, each cell z-scored against the same cell of 5000 shuffled matrices. The
#   bin sizes are not given; a 0.05 score by 3 m/s slope grid is used as a standard choice,
#   and readings with half and double these sizes are shown.
# - SWS (Candidate replay events): k-means on the theta (6-10 Hz) / delta (1-4 Hz) ratio of
#   sleep spectrograms; epochs > 120 s, gaps < 1 s bridged. Candidate events: place-cell
#   spike count in 1 ms bins, Gaussian smoothing s.d. 10 ms, peak > 3 s.d., bounded where
#   it falls back to the mean, events > 500 ms excluded. Open: over what the mean and s.d.
#   are taken. Readings: (a) all SWS of the sleep session; (b) the whole sleep session.
# - Ripples (Ripple detection): pyramidal-layer channels filtered 100-250 Hz and averaged,
#   minus the averaged 300-500 Hz signal; negative values dropped, positive values z-scored;
#   above 1 s.d. with a peak above 3 s.d.; events <= 20 ms or >= 110 ms excluded.
# - Pairwise bias correlation (Pairwise bias correlations): bias matrix per sequence,
#   cosine between bias matrices over neurons that fired in both, sequences with at least
#   three common neurons, autocorrelations dropped; a pair is significant when it exceeds
#   95% of a surrogate built by shuffling spike order in the second sequence. For Figs. 3G
#   and 4G each condition is cut in 20 temporal bins; median over pairs within a session,
#   then median over sessions. Open: the number of surrogates (a standard 1000 is used; it
#   only sets the resolution of the 95% bound) and which theta cycles count as sequences.
#   Readings: (a) every analysed theta cycle with at least three active place cells; (b)
#   only cycles with a significant trajectory score.
# - Statistics (Data analysis and statistics): two-tailed throughout. Gaussian paired data,
#   repeated-measures ANOVA, post hoc paired t-tests with Bonferroni correction;
#   non-Gaussian independent data, Kruskal-Wallis, post hoc Wilcoxon rank-sum with
#   Bonferroni correction; non-Gaussian paired data, Friedman, post hoc signed-rank;
#   proportions, binomial proportion test; a median against a single value, Wilcoxon
#   signed-rank; distributions, Kolmogorov-Smirnov. Gaussianity by Jarque-Bera. With three
#   conditions the Bonferroni levels are 0.05/3 = 0.017, 0.01/3 = 0.0033 and
#   0.001/3 = 0.00033, as the legends print.
