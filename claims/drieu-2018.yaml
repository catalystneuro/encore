    shuffled scores and absolute slope above 3 m/s (replay runs in both directions), bounds
    chosen here as the paper gives none. The
    proportion ratio of fig. S13D (Methods, Z-proportions and proportion ratios) is shown
    as well. Reproduced when, under each bin-size reading, the summed positive
    z-proportion of that region is largest after Active and the proportion of events in it
    is higher after Active than after each passive travel by a binomial proportion test at
    P < 0.05.
- id: fig4e-replay-proportion-vs-baseline
  statement: Relative to baseline sleep, the proportion of significant replay events was
    not increased after Passive 1, was boosted after Active, and was intermediate but
    significantly increased after Passive 2.
  source: Fig. 4E and legend; Results, paragraph 13
  quote: We did not observe replay during sleep following Passive 1 (Fig. 4E) ... Trajectory
    replay was then boosted in sleep following Active (Fig. 4E) ... an intermediate but
    significant level of reactivation was observed following Passive 2 (Fig. 4E)
  statistics:
  - about: post-sleep against baseline proportions
    test: binomial proportion test
    p: 0.001
    p_relation: "<"
  - about: the weaker significant comparison
    test: binomial proportion test
    p: 0.01
    p_relation: "<"
  depends_on:
  - figs11-sleep-sessions-similar
  criterion: Proportion of candidate events with Monte Carlo p <= 0.05 in each post-travel
    sleep session and in baseline sleep decoded with the same travel model, pooled over
    rats; the ratio post / baseline as plotted, and binomial proportion tests of post
    against baseline (Methods, statistics). Whether a positive slope is also required, as
    for theta sequences, is open; readings (a) significant score only, (b) significant
    score and slope above 0. Which of the legend's two levels goes with which comparison
    is not printed; read as after Active against baseline at P < 0.001 and after Passive 2
    against baseline at P < 0.01, with the after-Active ratio largest. For Passive 1, a
    claim of absence on the paper's binomial test. Reproduced when, under one reading,
    after Passive 1 is not different from baseline (P >= 0.05), after Active is higher at
    P < 0.001, after Passive 2 is higher at P < 0.01, and the after-Active ratio is largest.
- id: fig4f-forward-replay-after-active
  statement: Forward and reverse replay events were equally common in sleep after passive
    travel, while sleep after Active held more forward than reverse events.
  source: Fig. 4F and legend; Results, paragraph 13
  quote: Although forward and backward trajectories were found in equal proportions during
    sleep after passive travel, only active travel resulted in a greater proportion of
    forward replay actually reflecting awake experience (Fig. 4F).
  statistics:
  - test: binomial proportion test
    p: 0.001
    p_relation: "<"
  depends_on:
  - fig4e-replay-proportion-vs-baseline
  criterion: Among significant replay events of each post-travel session, forward events
    have a positive slope (the train always moved forward along the linearized track;
    Methods, Animal training) and reverse events a negative one. The binomial proportion
    test compares the forward and reverse proportions; the comparison is open, readings
    (a) forward against reverse proportion within the session (equivalently against 0.5),
    (b) the session's forward proportion against baseline sleep's. Reproduced when, under
    one reading, after Active forward exceeds reverse at P < 0.001 and after both passive
    travels the test finds no difference (P >= 0.05, absence on the paper's test).
- id: fig4g-theta-replay-correlation-active
  statement: Theta sequences correlated selectively with candidate replay events in the
    sleep that followed them only for Active.
  source: Fig. 4G and legend; fig. S6B and S6C and legend; Results, paragraph 13
  quote: a direct comparison of theta and replay sequences (31) highlighted a selective ...
    correlation between theta sequences in Active and candidate replay events in
    subsequent sleep (Fig. 4G and fig. S6, B and C)
  statistics:
  - about: proportion of significantly correlated theta-replay pairs
    test: binomial proportion test
    p: 0.001
    p_relation: "<"
  depends_on:
  - fig3g-theta-self-consistency
  criterion: Pairwise bias correlations between theta sequences of each travel session and
    candidate events of its post-sleep, and of baseline sleep (Common methods, Pairwise
    bias correlation; fig. S6B and S6C). Reproduced when the proportion of significantly
    correlated pairs Active-post-Active exceeds Active-baseline at P < 0.001 by a binomial
    proportion test while neither passive session's pairs with its post-sleep exceed its
    pairs with baseline at P < 0.05; partially reproduced when the Active effect holds at
    0.05 only. Mean correlations, compared by Kruskal-Wallis as fig. S6 names, are
    reported.
- id: figs12-ripple-restricted
  statement: Restricting candidate events to ripples left the replay results unchanged;
    scores relative to baseline, slopes, the boost after Active and the forward bias after
    Active all held.
  source: fig. S12 and legend; Results, paragraph 11
  quote: results remained unchanged when candidate events were restricted to ripples (fig.
    S12)
  statistics:
  - about: scores relative to baseline
    test: Kruskal-Wallis
    p: 1.0e-15
    p_relation: "<"
  - about: slopes, sleep after Passive 1 against after Active
    test: Kolmogorov-Smirnov
    p: 1.0e-05
    p_relation: "<"
  - about: slopes, sleep after Active against after Passive 2
    test: Kolmogorov-Smirnov
    p: 1.0e-05
    p_relation: "<"
  - about: slopes, sleep after Passive 1 against after Passive 2
    test: Kolmogorov-Smirnov
    p: 0.05
    p_relation: ">"
  - about: absolute slopes
    test: Kruskal-Wallis
    p: 1.0e-27
    p_relation: "<"
  depends_on:
  - fig4b-replay-scores-vs-baseline
  - fig4c-replay-slopes-steeper-active
  - fig4e-replay-proportion-vs-baseline
  - fig4f-forward-replay-after-active
  criterion: Candidate events kept only when they overlap a detected ripple (Common methods,
    Ripples); the analyses of Fig. 4B, 4C, 4E and 4F repeated. Restricted to ripples is
    open; readings (a) any overlap with a ripple, (b) the event's peak inside a ripple.
    Reproduced when the four claims' criteria hold on the restricted events, with the
    p-value bounds of this legend in place of theirs; partially reproduced when two or
    three do.
