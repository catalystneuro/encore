    every recording session pair and observed statistically significant decoding for nearly the
    entire duration of the experiment
  criterion: Decoder as in the opening comment, on every ordered pair of sessions of the circular
    protocol, error per pair as the median over time bins, chance from time-reversed head direction
    in the test session (both median and mean error are run, as the Methods and legend differ).
    The paper does not name its test. OPEN, readings (a) per day difference, one-sided Wilcoxon
    signed-rank of data against chance over all session pairs of all mice, and (b) per day
    difference, one-sided Wilcoxon across the five mice of per-mouse means. Reproduced when, under
    one reading, the error is below chance at p < 0.05 for every day difference up to 20 days
    except at most one, read as "nearly the entire duration"; partially reproduced when that holds
    up to 10 days.
