- id: fig2h-coherent-remapping
  statement: While the internal structure of the HD system was largely kept across environments,
    its absolute orientation was specific to each environment, the HD cells of a mouse shifting
    together (coherent remapping) compared with shuffled cell identities.
  source: Results, Environmental modulation of the HD cell population, paragraph 2; Fig. 2c,d,h,i
  quote: Whereas the internal structure of the HD system was largely preserved across environments,
    with only minor... its absolute orientation was specific to each environment
  criterion: Per mouse and pair of environments, the mean vector length over HD cells of the shift
    in preferred direction, for each pair of recordings of the two environments (Methods,
    Orientation remapping), compared with 1,000 shuffles of cell identity within a day. The
    paper gives no threshold; the 95th percentile of the shuffle distribution, the bound Fig. 3e
    draws for its controls, is used. Per mouse and environment pair, coherent when the median over
    recording pairs of the mean vector length exceeds the median over recording pairs of the
    shuffle 95th percentile. The environment pairs are the three of Fig. 2i (circular to square,
    square to radial maze, radial maze to circular), the environments of one room whose alignment
    the paper measures in room coordinates; the open field, in another room, is shown as a
    variant. Reproduced when this holds for at least 80% of the mouse and environment pairs
    (mouse 2 included, as for remapping in the Methods), and the average remapping of at least
    one environment pair differs from 0 by more than 30 degrees in at least three mice, read as an
    orientation specific to each environment. The 80% and 30 degree thresholds are the reader's,
    not the paper's, and are recorded as a deviation.
