- id: fig1k-decoding-across-days
  statement: Decoders of head direction trained on one session and tested on another decoded
    significantly better than chance for nearly the whole four weeks of the experiment.
  source: Results, The tuning of HD cells is stable over time, paragraph 5; Fig. 1j,k
