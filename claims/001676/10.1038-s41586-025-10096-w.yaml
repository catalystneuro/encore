# Claims for Skromne Carrasco, Viejo & Peyrache (2026), "Months-long stability of the
# head-direction system", Nature 652, 167-173, on dandiset 001676.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record (Nature, 2026), from the PDF supplied by hand, as extracted to
# paper/10.1038-s41586-025-10096-w.txt: main text, Methods, and the legends of Extended Data
# Figs. 1 to 10. The Supplementary Information (Supplementary Table 1, recording details of the
# electrophysiology, and Supplementary Table 2, sessions and HD cells per animal) is not under
# paper/ and was not read; no claim rests on it. The Source Data files were not read. PDF pages
# 22 to 25 carry no extractable text (in Nature PDFs, the reporting summary) and could not be
# rendered. No figure was read from the PDF.
#
# Code. The paper's Code availability statement reads "Code will be made available upon
# request." No repository is linked, so no code was read. Every method detail below comes from
# the Methods or the figure legends; where they are silent the detail is named as open.
#
# Data the paper used, as it reports it.
# - Imaging. Mice 1 to 5 (adult male C57BL/6J), GRIN lens (1.0 mm) over the left
#   post-subiculum (PoSub), GCaMP6f, UCLA Miniscope V4, 20-min sessions of free foraging on
#   weekdays, head direction and position from an Optitrack multi-camera system. ROIs from
#   CNMF_E after NoRMCorre motion correction, registered across days with CellReg (each
#   registration has a CellReg confidence score). 388 sessions in all. Three experiments per mouse
#   (Methods, Statistics and reproducibility): (1) about 30 days, 20 sessions over 4 weeks, in the
#   circular environment (Fig. 1); (2) two weeks in each of four environments, in the order
#   circular, square, radial (8-arm) maze, open field, 40 sessions over 8 weeks (Fig. 2), then a
#   week of probe trials, one environment per day (Fig. 3); (3) four weeks with visits to the four
#   environments in random order (Extended Data Fig. 9). The circular, square and radial maze are in
#   one room, the open field in another room. For mouse 2 the Miniscope broke between the second
#   and third environment; for mouse 5 the field of view was lost before the probe trials.
# - Imaging, mice 6 to 10 (Fig. 4, Extended Data Fig. 10). Two novel environments (square and
#   circular in the figure) visited on one day 8 h apart, one of them then visited weekly for
#   three weeks, both revisited on week 5 (7 sessions over 5 weeks). The groups are named
#   "weekly" and "single" visits. The Methods say "Five adult male C57BL/6J mice were used in
#   all experiments" and also describe mice 6 to 10.
# - Electrophysiology (Extended Data Fig. 7). Four mice with silicon probes in PoSub, 15 to 20
#   min of free foraging in the circular, square and radial maze on one day, disoriented 2 to 5
#   min between environments, Kilosort 2.5 and manual curation; 125 HD cells and 129 non-HD
#   cells.
# - The dandiset (title as the paper, 14 subjects) is described as holding the longitudinal
#   Miniscope recordings of all four protocols and the electrophysiology of four animals.
#
# Methods shared by the claims (Methods, HD cell classification by Miniscope, and following).
# - Tuning curve. Average dF/F in 3 degree bins of head direction, divided by the time spent in
#   each bin, smoothed with a Gaussian kernel "(sigma = 12° bins)". OPEN: whether sigma is 12
#   degrees or 12 bins (36 degrees); both readings are run where a claim depends on tuning
#   curves.
# - HD cell (imaging). Split-half tuning curve correlation of at least 0.4 (ROIs below are
#   discarded); head-direction information (HDI, Skaggs et al. 1992, ref. 59) averaged across
#   sessions above 0.1; sessions where the cell's HDI is below 0.11 are discarded; tracked on
#   several days with CellReg score above 0.8 (above 0.6 for Fig. 3); detected in at least six
#   sessions for Figs. 1 and 2, at least two for Figs. 3, 4d-f and Extended Data Fig. 10. OPEN: the
#   HDI formula for dF/F (Skaggs information with dF/F in place of rate; log base 2 is the
#   standard choice and cannot change an outcome beyond the threshold scale, so log2 is used);
#   whether HDI is computed on the raw or the smoothed tuning curve (both readings).
# - HD cell (electrophysiology). Firing rate above 1 Hz and HDI above 0.3. OPEN: tuning curve
#   bins and smoothing for spikes are not given; the imaging values are the reading.
# - Change in preferred direction between two sessions. For each HD cell present in both, the
#   circular shift at the maximum of the cross-correlation of its two tuning curves; the circular
#   mean over cells is the session's change.
# - Change in pairwise angular offset. For each pair of HD cells, the offset is the shift at the
#   maximum of the cross-correlation of the two cells' tuning curves in one session; its change is
#   the minimum circular difference between two sessions. Shuffle, cell pair identity shuffled
#   within a day, 1,000 times.
# - Remapping between environments. Circular mean over cells of the shift in preferred direction
#   between two sessions; the average remapping is the circular mean over all session pairs of the
#   two environments; its mean vector length is the coherency. Shuffle, cell identity shuffled
#   within a day, 1,000 times.
# - HD decoding. XGBoost, multiclass, 32 head-direction bins. Training session cells with CellReg
#   score above 0.8, split-half correlation above 0.4 and HDI above 0.11, kept if present in the
#   test session; dF/F smoothed with a Gaussian of sigma 133 ms, normalized, averaged in 0.09 s
#   bins; the top 50% of population activity bins kept and z-scored; error is the minimum circular
#   difference between predicted and actual direction. Chance from time-reversed head direction
#   ("average error" in the Methods, "median error" in the Fig. 1k legend). "Same" values train on
#   the first half of a session and test on the second. OPEN: XGBoost hyperparameters (the library
#   defaults are the reading); how "population activity" is summed before taking the top 50% (sum
#   of normalized dF/F over cells is the reading); the error summary is the median per session pair
#   (Fig. 1k legend).
# - Environment decoding. XGBoost trained on the pairwise tuning curve correlations of all HD cell
#   pairs in a random half of the recordings of each of the four environments, tested on the
#   other half; shuffle of cell pair identity within each recording. OPEN: the number of random
#   splits and the seed; how cells absent in a recording enter the feature vector.
# - Drift rate (degrees per week, Figs. 1h, 1i, 2e, 3f, 3g, Extended Data Fig. 9b). The Methods
#   do not define it. OPEN, readings: (a) the slope of a least-squares line of the per session
#   pair values against day difference, times 7; (b) the same slope fitted to the values averaged
#   per day difference (the curve the figure shows); (c) as (a) with the line through the origin.
#   For Fig. 3 the delay is in weeks and the slope is taken per week.
# - Statistics named in the paper (V-test, Rayleigh test, Wilcoxon signed-rank, Wald test,
#   repeated-measures ANOVA) are run as named; pycircstat, listed in the Methods, is used for
#   the circular tests (its vtest returns V = n R cos(mean - 0) and a one-sided p, while the
#   legends say "two-tailed"; both p are reported).
