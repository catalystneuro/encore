    in total.
  source: Results, Recording from Merkel and unidentified afferents during whisking and active
    touch, paragraph 3; STAR Methods, Quantification and Statistical Analysis
  quote: For our initial dataset (of 33 afferents), we obtained 54,647,500 frames of high-speed
    video with simultaneous single neuron recordings for analysis ... We report analysis of
    high-speed video comprising 65,257,500 frames (2,175 min) total
  data: with_labels
  depends_on:
  - table-s1-link
  expected:
  - quantity: frames, 33 touch recordings
    value: 54647500
    tolerance: 5464750
  - quantity: frames, total
    value: 65257500
    tolerance: 6525750
  criterion: Frames are trials times 2,500. The first value is summed over the 33 touch
    recordings of Table S1. For the total, the text allows these readings, in order (a) the 53
    analysed afferents, (b) the 53 afferents and the 4 EMG sessions, (c) the 56 afferent
    recordings, (d) all 60 files. Reproduced when the first value and the total under one
    reading are within tolerance.
