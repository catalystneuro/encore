# Claims for Severson, Xu, Van de Loo, Bai, Ginty and O'Connor (2017) on dandiset 000226.
# Source: the accepted author manuscript in PubMed Central (PMC5528144), full text, read from
# its Results, STAR Methods, Glossary and figure legends, and the publisher's Supplemental
# Information (mmc1.pdf), whose Table S1 lists every recording with its type and analyses.
# The version of record is not open access. The paper's analysis code is not public (the
# Methods say it is available on request); no repository for this paper was found.
#
# When these criteria were written, the author had seen the data check only: the file list,
# the metadata and trial tables of every file, the units and ranges of every series, the
# trial and spike counts per file, per-file mean spike rates in crude categories (contact,
# whisking above 2.5 degrees, below 1 degree; without the distance-to-pole rule), per-file
# phase tuning in 30 equal-width bins, and the spike rate in fifths of each progressive
# cutting session. No claim's analysis had been run.
#
# The dandiset holds one NWB file per recording: 56 afferents and 4 EMG sessions, matching
# Table S1. It does not say which experiment a recording belongs to, which recordings the
# paper excluded, the afferent type (RA or SA), or which afferents were identified as Merkel.
# These come from Table S1. Group membership (touch recording, cut-whisker recording,
# whisking-only recording, progressive cutting, EMG) maps the dandiset's own recording ids to
# experiments and brings in no measurement, so claims that use only it are `with_labels`.
# Afferent type and Merkel identity are results of measurements not in the dandiset
# (manual classification and optogenetic tagging), so claims that use them are `with_inputs`.
#
# Method choices fixed here, from the Methods and Glossary where they are explicit:
# - Frames are the 2 ms video frames of each 5 s trial. Contact frames have contact = 1 and a
#   distance to the pole below 1 mm; whisking frames have amplitude above 2.5 degrees;
#   whisking-in-air frames are whisking frames with contact = 0 and distance to the pole
#   above 2 mm; non-whisking frames have amplitude below 1 degree, are not contact frames and
#   have distance to the pole above 2 mm. Where a file has no distance-to-pole series (no pole
#   was presented), the distance is taken as infinite. Contact without whisking is left out.
#   The `distanceToPoleCenter` series is taken to be the Methods' d_pole in mm (its unit is
#   "unknown" in the files).
# - Mean rates are spikes over time in a category. Their 95% confidence intervals are
#   bootstrap intervals over trials (1000 resamples), a choice the Methods leave open.
# - Outliers as in the Glossary: forces, moment and their rates of change outside the 0.5 to
#   99.5 percentiles, kinematic variables outside 0.25 to 99.75 percentiles, per recording.
# - Phase tuning curves: whisking-in-air frames, 30 phase bins with equal numbers of frames.
#   Preferred phase is the centre of the bin with the highest rate; non-preferred the lowest.
# - Statistical models: the paper fitted GAMs with mgcv (binomial, logit, 1 ms bins, UBRE
#   smoothing). Here each variable gets a cubic B-spline basis of 10 functions with a
#   second-difference penalty (lambda 1, fixed), fitted by penalized IRLS as a binomial model
#   with two trials per 2 ms frame (the paper interpolates to 1 ms bins), on at most 60,000
#   randomly chosen eligible frames per recording. Performance is the Pearson correlation of
#   the predicted spike probability with the spike counts smoothed by a Gaussian of
#   sigma 4 ms, over the frames fitted.
# - Tolerances: the paper's stated spread (SD or IQR) where it gives one, as the protocol asks;
#   otherwise 10% of the reported value.
# Quotes and statistics added 2026-10-19 from the full text (PMC5528144 author manuscript via NCBI
# E-utilities, and the publisher's Supplemental Information mmc1.pdf); the paper reports no tests.
schema_version: 1
dandiset: "000226"
paper: doi:10.1016/j.neuron.2017.03.045
claims:
- id: table-s1-link
  kind: link
  statement: The dandiset's recordings can be matched one to one to the recordings of Table S1,
    and the matched records agree on mouse, sex, mouse line and date.
  source: Table S1 (Supplemental Information)
  quote: Metadata for each afferent, including figure appearances.
  data: with_labels
  criterion: Records are matched by recording id, the NWB `identifier` without its "KS0"
    prefix (for example KS0240A to 240A); an identifier that ends in "_" is matched by its
    number alone when exactly one Table S1 recording has that number and mouse. Reproduced
    when all 60 files match a distinct Table S1 recording and at least 95% of matches agree
    on mouse id, sex, mouse line (ignoring spaces and case) and recording date; partially
    reproduced when at least 80% match and agree; otherwise not reproduced.
- id: video-frames
