- id: figs1-optotag-latency
  statement: Identified Merkel afferents spiked at short latency (4.9 plus or minus 1.3 ms) and
    low jitter (SD of first-spike latency 0.91 plus or minus 0.29 ms) after brief light pulses.
  source: STAR Methods, Optogenetic identification; Figure S1C, D
  quote: "However, we accepted only neurons that spiked at short latency (< 8 ms; 4.9 ± 1.3 ms; mean
    ± SD) and with low jitter (SD of first-spike latency: 0.91 ± 0.29 ms"
  expected:
  - quantity: mean latency to spike after light onset
    value: 4.9
    tolerance: 1.3
    unit: ms
  - quantity: SD of first-spike latency
    value: 0.91
    tolerance: 0.29
    unit: ms
- id: figs1-labelling-specificity
  statement: In TrkC-CreER;Rosa-Ai9 mice, 99.2% of classified labelled afferent endings in
    whisker follicles were Merkel cell-associated (1,045 of 1,053).
  source: STAR Methods, Histology quantification; Figure S1B
  quote: Merkel cell-associated afferents are specifically labeled in whisker follicles of
    TrkCCreER;RosaAi9 mice
  expected:
    quantity: percent of classified labelled endings that are Merkel
    value: 99.2
    tolerance: 9.92
    unit: percent
- id: contact-classifier
  statement: Automatic contact classification agreed with manual curation for 99.5 plus or minus
    0.2% of frames, with a false positive rate of 0.3 plus or minus 0.1%.
  source: STAR Methods, Video analysis, contact detection
  quote: The overall rate of correct classification was 99.5 ± 0.2% (mean ± SD across 33 sessions)
    with a false positive rate of 0.3 ± 0.1%.
  expected:
  - quantity: correct classification rate
    value: 99.5
    tolerance: 0.2
    unit: percent
  - quantity: false positive rate
    value: 0.3
    tolerance: 0.1
    unit: percent
