# Claims for Lee, Matthews, Lemieux et al. (2025), "Separable Dorsal Raphe Dopamine Projections
# Mimic the Facets of a Loneliness-like State", eLife doi:10.7554/eLife.105955, on dandiset 001195.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-22, protocol
# as stated in docs/protocol.md (version pilot-10).
#
# Text read: the eLife reviewed preprint, version 2 (8 July 2025), from paper/10.7554-elife.105955.txt
# (a PDF supplied by a person, extracted with PyMuPDF), with its Methods, figure legends and all figure
# supplements. The PDF was opened for Figures 6 and 7 only. The legend of Figure 7 runs off the page in
# the PDF itself and stops inside panel I; panels J to M have no legend, so their numbers (the
# percentages of Figure 7J and r = 0.679, p = 0.045 in Figure 7M) were read from the figure image. The
# eLife source data files listed under each figure are not in paper/, and the supplied text has no
# data or code availability statement. The paper links no analysis code, so no code was read and
# every method detail below comes from the Methods, the legends and the figure supplements. The
# earlier Research Square preprint (doi:10.21203/rs.3.rs-1025403/v1), which the dandiset says used
# the same patch-clamp data, was checked for the ex vivo Methods only: they match the eLife text, and
# it adds that the cells recorded at rest came from 19 mice.
#
# The dandiset (title and description on DANDI) holds in vivo calcium imaging with behaviour videos
# and ex vivo patch-clamp recordings, the data of Figure 6, Figure 6 supplement 1, Figure 7 and
# Figure 7 supplements 1 and 2. The behavioural optogenetics (Figures 2 to 4 and 8), the tracing
# (Figure 1) and the RNAscope (Figure 5) are covered below because they are the paper's main findings.
#
# Data the paper used, as it reports them:
# - Ex vivo patch clamp (Figure 6). Male DAT::Cre mice with ChR2 (AAV5-DIO-ChR2-eYFP) in the DRN,
#   at least 8 weeks of expression; whole-cell current clamp in coronal slices of the BNST, CeA and
#   BLP, in the region with eYFP terminals; 3 kHz filter, 10 kHz sampling. Light, 470 nm, 8 pulses of
#   5 ms at 30 Hz every 30 s. At rest, BNST n = 19, CeA n = 36, BLP n = 48 cells; with current
#   injected to make the cell fire, BNST n = 5, CeA n = 20, BLP n = 17. Baseline properties came from
#   a 5 mV, 250 ms hyperpolarizing step in voltage clamp at -70 mV (capacitance, membrane resistance)
#   and from 1 s current steps from -120 to 260 pA in 20 pA increments. Clustered cells: CeA 26 and
#   BLP 27 (from the t-test degrees of freedom, t24 and t25, in Figure 6 supplement 1H-I). A few cells
#   were recorded with TTX/4AP (EPSP n = 8, IPSP n = 3).
# - Ex vivo ChrimsonR validation (Figure 7 supplement 1B-I). DAT::Cre mice with ChrimsonR in the
#   DRN; CeA cells stimulated with 635 nm (10 mW) or 470 nm (0.3 and 0.2 mW) light, and with 635 nm
#   light during constant 470 nm light; 9 and 12 cells (from F2,16 and t11).
# - In vivo imaging (Figure 7). DAT::Cre mice, GCaMP7f in the CeA, ChrimsonR (or TdTomato in
#   controls) in the DRN, GRIN lens over the CeA, nVoke microscope at 20 frames/s. Three-chamber
#   sessions of 5 min habituation and 10 min test with a juvenile mouse under one cup and an object
#   under the other, in three conditions per mouse: group-housed without light (GH off), group-housed
#   with 620 nm light (8 pulses of 5 ms at 30 Hz every 1 s, 10 mW; GH on), order counterbalanced,
#   and 2-3 weeks later after 24 h of isolation without light (SI off). ChrimsonR cells: GH off 429,
#   GH on 441, SI off 484; the legend says N = 15 mice per condition, Figure 7E says N = 12 ChrimsonR
#   mice, and TdTomato controls are N = 2 (39, 61 and 76 cells). 202 cells were co-registered
#   between GH off and GH on. Measured variables: CNMF-E traces per cell, SLEAP pose (15 keypoints)
#   from the behaviour video, cup interactions derived from it, time in the social and object sides.
# - Behaviour with optogenetics (Figures 2-4, 8, supplements). Male DAT::Cre mice, ChR2, NpHR or
#   eYFP in the DRN, fibres over the BNST, CeA or BLP; tube test, RTPP, OFT, EPM, three-chamber,
#   juvenile intruder, ICSS. Group sizes are given in each claim.
#
# Method details the paper leaves open are named in the criteria with the readings its text allows.
# The SLEAP model (774 labelled frames) and the custom MATLAB code for passive properties (Q-method,
# by P. Namburi) are described but not published with the paper.
