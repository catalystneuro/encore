  source: Figure 7M (r and p read from the figure); Results, DRNDAT input enables a functional shift
    in CeA dynamics, paragraph 5
  quote: we did find a significant positive correlation between the proportion of socially-excited
    CeA neurons and social preference in the GH on condition, but not in the GH off or SI off
    conditions
  statistics:
