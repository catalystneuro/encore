    statistic: r = 0.679
    p: 0.045
  expected:
  - quantity: Pearson r, GH on
    value: 0.679
    tolerance: 0.0679
  depends_on:
  - fig7j-proportions-unchanged
  - fig7e-no-behavioural-change
  criterion: Per mouse and condition, the fraction of its cells significantly excited by the social
    cup (fig7j-proportions-unchanged) against its social:object ratio (fig7e-no-behavioural-change,
    labelled soc:obj zone ratio in the figure); Pearson correlation per condition (Statistical
    analyses). Which mice enter is not stated and the counts disagree (the Figure 7G legend says 15
    mice, Figure 7E 12 ChrimsonR mice, Figure 7 supplement 1N-O 9, 8 and 9 mice, while r = 0.679
    with p = 0.045 fits 9 mice in GH on and the supplement's p-values fit 10, 9 and 10); readings (a)
    ChrimsonR mice with that session, (b) all mice imaged in that session. Reproduced when, under
    one reading together with each auROC reading, GH on gives r > 0 with p < 0.05 and GH off and SI
    off give p >= 0.05; r is within tolerance for full agreement, else partially reproduced. If
    the readings disagree on the sign or significance, the claim is blocked as
