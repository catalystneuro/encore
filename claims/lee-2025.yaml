- id: fig7-s2-functional-clusters
  statement: Hierarchical clustering of trial-averaged CeA responses to social and object cup
    interactions gave 12 functional clusters.
  source: Figure 7 supplement 2A-B; Methods, In vivo microendoscopic calcium imaging, last paragraph
  quote: The dendrogram (left) reveals 12 functional clusters of neurons
  expected:
  - quantity: functional clusters
    value: 12
    tolerance: 1.2
    unit: clusters
  depends_on:
  - fig7gh-delta-auroc-trend
  criterion: Trials are interactions lasting at least 1 s, at least 5 s after the previous
    interaction, merging pauses under 1.5 s (Methods). Per neuron, the z-scored average trace from
    5 s before to 5 s after onset for the social and the object cup, concatenated; MATLAB-style
    agglomerative clustering cut at 0.770 times the largest linkage distance (Methods). Open
    details, readings all run. (1) Linkage, MATLAB's default (single) or Ward or average, since the
    Methods name the 'cluster' function but no method. (2) Z-scoring of the whole trace before
    averaging, or of the averaged trace. (3) Neurons, pooled across the three conditions (the
    figure gives percentages per condition from one dendrogram). Reproduced when one reading
    gives 11 to 13 clusters; the counts under all readings are reported.

- id: fig7-s1ef-red-vs-blue
  statement: Ex vivo, red light evoked ChrimsonR-mediated potentials in CeA cells with much larger
    peak amplitude and area than the blue light (0.3 or 0.2 mW) used for imaging.
  source: Figure 7 supplement 1D-F; Results, DRNDAT input enables a functional shift in CeA dynamics,
    paragraph 2
  quote: Red light evoked a PSP with a significantly greater peak amplitude
  statistics:
  - about: peak amplitude, 635 nm against 470 nm at 0.3 and 0.2 mW
    test: repeated measures ANOVA
    statistic: F(2,16) = 200.1
    p: 0.0001
    p_relation: "<"
  - about: area
    test: repeated measures ANOVA
    statistic: F(2,16) = 404.2
    p: 0.0001
    p_relation: "<"
  - about: peak amplitude, red against 0.3 mW blue
    test: post hoc comparison (test not named)
    p: 0.0001
    p_relation: "<"
  - about: peak amplitude, red against 0.2 mW blue
    test: post hoc comparison (test not named)
    p: 0.0001
    p_relation: "<"
  - about: area, red against 0.3 mW blue
    test: post hoc comparison (test not named)
    p: 0.0001
    p_relation: "<"
  - about: area, red against 0.2 mW blue
    test: post hoc comparison (test not named)
    p: 0.0001
    p_relation: "<"
  criterion: Per cell, the PSP peak amplitude and the area 0-5.5 s after light onset. The paper
    does not say how a PSP with both EPSP and IPSP (Figure 7 supplement 1D) gives one peak
    amplitude; the readings run are (a) the largest absolute deflection from the 5 s baseline,
    whichever sign, and (b) the EPSP peak, or the IPSP trough magnitude in cells with only an IPSP.
    Amplitude and area are measured for each light condition against the 5 s baseline (Methods, Ex
    vivo electrophysiology). Repeated measures one-way ANOVA across the three lights. Reproduced
    when both ANOVAs give p < 0.05 and red exceeds each blue power in most cells.

