# ---------------------------------------------------------------- Figure 7, in vivo imaging
- id: fig7e-no-behavioural-change
  statement: With the expression and illumination parameters used, social preference of ChrimsonR
    mice did not differ significantly across GH off, GH on and SI off.
  source: Figure 7E; Results, DRNDAT input enables a functional shift in CeA dynamics, paragraph 4
  quote: We successfully optimized viral expression and illumination parameters to minimize changes
    in social preference with DRNDAT-CeA with ChrimsonR
  statistics:
  - test: mixed-effects model
    statistic: F(1.897, 30.36) = 0.5767
    p: 0.5591
    n: 12 mice
  criterion: A claim of absence, judged on the paper's test. Social:object ratio per session, time
    in the social side over time in the object side during the 10 min test (Methods, Three chamber
    sociability assay; the imaging chamber has the same dimensions). Sides are the left and right
    compartments (23 cm each) of the 57.5 cm chamber, the 11.5 cm centre excluded. A mixed-effects
    model with condition as the repeated factor (Prism's mixed-effects analysis, restricted maximum
    likelihood, with the Geisser-Greenhouse correction that the fractional degrees of freedom
    F(1.897, 30.36) show) on the ChrimsonR mice. Reproduced when p >= 0.05; the condition means are reported
    either way. Total social time (Figure 7E right) is shown as a variant, under both readings the
    paper allows (social side time, as the axis label says, and social cup interaction time, as
    the legend says).

- id: fig7gh-delta-auroc-trend
  statement: CeA response strength to the social cup relative to the object cup (social minus object
    auROC) tended to be larger with DRN-DAT stimulation (GH on) than without (GH off), a trend with
    a significant Kruskal-Wallis test across conditions but a non-significant pairwise test.
  source: Figure 7G-H; Results, DRNDAT input enables a functional shift in CeA dynamics, paragraph 5
  quote: did find a trend indicating stronger responses toward social stimuli compared to object
    stimuli in the GH on condition compared to the GH off condition in mice expressing ChrimsonR
  statistics:
  - about: social minus object auROC across GH off, GH on, SI off
    test: Kruskal-Wallis
    statistic: K-W statistic = 6.172
    p: 0.0457
    n: 429, 441 and 484 cells
  - about: GH off against GH on
    test: Dunn's multiple comparisons
    p: 0.058
  - about: GH off against SI off
    test: Dunn's multiple comparisons
    p: 0.9999
    p_relation: ">"
  expected:
  - quantity: GH off cells
    value: 429
    tolerance: 42.9
    unit: cells
  - quantity: GH on cells
    value: 441
    tolerance: 44.1
    unit: cells
  - quantity: SI off cells
    value: 484
    tolerance: 48.4
    unit: cells
  criterion: auROC per cell and stimulus as in the Methods (In vivo microendoscopic calcium imaging).
    A binary vector of social (or object) cup interaction in 40 ms bins against the cell's raw CNMF-E
    trace z-scored and thresholded at 100 steps from its minimum to its maximum; area under the
    ROC curve. Interaction, from pose, when the nose is within 1.3 times the cup diameter and the
    cup lies in a 90 degree cone in front of the head (Methods). Open details, readings all run.
    (1) Distance, nose to cup centre below 0.65 cup diameters (inside a circle 1.3 times the cup)
    or below 1.3 cup diameters. (2) Head direction, from the neck or the head keypoint to the nose;
    the cone is 45 degrees either side. (3) Time base, traces and behaviour resampled to 40 ms bins
    as written, or the 50 ms imaging frames. (4) Period, the 10 min test only, or the whole session
    with habituation counted as no interaction. (5) Mice, ChrimsonR mice only (the panel is
    labelled DRNDAT-CeA:ChrimsonR) or all mice imaged. Kruskal-Wallis on social minus object auROC
    across the three conditions with cells as samples, then Dunn's test. Reproduced when, under the
    readings, Kruskal-Wallis gives p < 0.05 and the GH on median or mean exceeds that of GH off;
    the Dunn p-values are reported. If the readings disagree the claim is blocked as
    methods_underspecified.

