# ---------------------------------------------------------------- Figure 6, ex vivo patch clamp
- id: fig6df-epsp-ipsp-at-rest
  statement: At the resting membrane potential, photostimulation of DRN-DAT terminals evoked both
    excitatory and inhibitory post-synaptic potentials in downstream cells of the BNST, CeA and BLP
    (19, 36 and 48 cells recorded).
  source: Results, DRNDAT input has divergent effects on downstream cellular excitability, paragraph
    2; Figure 6D-F
  quote: Optical stimulation at the resting membrane potential evoked both excitatory and inhibitory
    post-synaptic potentials (EPSPs and IPSPs) in downstream cells
  expected:
  - quantity: BNST cells recorded at rest
    value: 19
    tolerance: 0
    unit: cells
  - quantity: CeA cells recorded at rest
    value: 36
    tolerance: 0
    unit: cells
  - quantity: BLP cells recorded at rest
    value: 48
    tolerance: 0
    unit: cells
  criterion: Counts are compared exactly (tolerance 0) because they are cell counts the dataset
    either holds or not; a count that differs is reported, and the claim is then judged on the
    cells present. Per cell, the average of the light sweeps at rest (Methods, Ex vivo
    electrophysiology); the EPSP peak and IPSP trough are measured against the 5 s before
    stimulation (Methods). A cell is 'excitation' with an EPSP only, 'inhibition' with an IPSP only,
    'mix' with both, 'none' otherwise (Methods; Figure 6D-F legend). The paper gives no threshold
    for calling a deflection an EPSP or an IPSP; the readings run are a peak (EPSP) or trough (IPSP)
    of the average trace within 0-5.5 s of light onset (the window the Methods use for total
    voltage area) beyond (a) 2 or (b) 3 standard deviations of the 5 s baseline of the average
    trace. Reproduced when, under the readings, each of the three regions has at least one cell with
    an EPSP and the pooled cells include cells with an IPSP; the proportions of the four classes
    per region are reported. If the readings disagree the claim is blocked as
    methods_underspecified.

- id: fig6gi-firing-responses
  statement: In cells made to fire by constant current, photostimulation increased firing in all
    BNST cells (5 of 5), while CeA (20 cells) and BLP (17 cells) cells showed either an increase or
    a decrease in firing.
  source: Results, DRNDAT input has divergent effects on downstream cellular excitability, paragraph
    2; Figure 6G-I
  quote: During spontaneous firing, BNST cells were universally excited whereas more diverse
    responses were observed with the BLP and CeA
  expected:
  - quantity: BNST firing cells
    value: 5
    tolerance: 0
    unit: cells
  - quantity: CeA firing cells
    value: 20
    tolerance: 0
    unit: cells
  - quantity: BLP firing cells
    value: 17
    tolerance: 0
    unit: cells
  criterion: Per cell, the action potential inter-event interval (IEI) in the 5 s before and the 5 s
    after the first light pulse; a decrease is 'excitation', an increase 'inhibition' (Methods, Ex
    vivo electrophysiology). The paper does not say how sweeps are combined or which summary of the
    IEIs is compared; readings (a) mean IEI over all intervals pooled across sweeps, (b) mean over
    sweeps of each sweep's mean IEI. The Figure 6 supplement 1G legend plots 5.5 s before the light,
    so a 5.5 s baseline is shown as a variant. Action potentials are detected as upward crossings of
    0 mV, a standard choice. Reproduced when every BNST cell is excited and both classes occur among
    CeA cells and among BLP cells, under each reading.

- id: fig6j-epsp-amplitude-region
  statement: The peak amplitude of the optically evoked EPSP differed between regions, larger in
    the CeA than in the BLP.
  source: Figure 6J, left
  quote: "peak amplitude (Kruskal-Wallis statistic = 6.790, p=0.0335; Dunn’s posts-hoc tests: CeA vs BLP
    p=0.0378)"
  statistics:
  - about: EPSP peak amplitude across BNST, CeA and BLP
    test: Kruskal-Wallis
    statistic: Kruskal-Wallis statistic = 6.790
    p: 0.0335
  - about: CeA against BLP
    test: Dunn's post hoc test
    p: 0.0378
    corrected: Dunn's multiple comparisons
  depends_on:
  - fig6df-epsp-ipsp-at-rest
  criterion: EPSP peak of the average trace at rest against the 5 s baseline (Methods), one value per
    cell with an EPSP. Which cells enter is open; readings (a) cells with an EPSP (excitation and
    mix), (b) excitation-only cells. Reproduced when, under the readings, a Kruskal-Wallis test across
    the three regions gives p < 0.05, Dunn's test gives CeA against BLP p < 0.05, and the CeA median
    exceeds the BLP median.

- id: fig6k-ipsp-amplitude-region
  statement: The trough amplitude of the optically evoked IPSP differed between regions, deeper in
    the CeA than in the BLP.
  source: Figure 6K, left
  quote: "trough amplitude (one-way ANOVA, F2,31=8.150, p=0.0014, CeA vs BLP: **p=0.0014)"
  statistics:
  - about: IPSP trough amplitude across BNST, CeA and BLP
    test: one-way ANOVA
    statistic: F(2,31) = 8.150
    p: 0.0014
    n: 34 cells with an IPSP (from the degrees of freedom)
  - about: CeA against BLP
    test: post hoc comparison (test not named)
    p: 0.0014
  depends_on:
  - fig6df-epsp-ipsp-at-rest
  expected:
  - quantity: cells with an IPSP in the test
    value: 34
    tolerance: 3.4
    unit: cells
  criterion: IPSP trough of the average trace at rest against the 5 s baseline (Methods), one value
    per cell. Readings for the cells (a) inhibition and mix cells, (b) inhibition-only cells; the
    single BNST point in Figure 6K beside the absence of BNST inhibition-only cells in Figure 6D
    favours (a), but both are run. The post hoc test is not named; Tukey's test (the Prism default
    after a one-way ANOVA) and Holm-Sidak are the readings. Reproduced when the one-way ANOVA gives
    p < 0.05, CeA against BLP p < 0.05 and the CeA mean trough is more negative than the BLP mean.

- id: fig6-s1de-monosynaptic
  statement: The optically evoked EPSP and the slow component of the IPSP persisted after TTX/4AP,
    so the responses were typically monosynaptic.
  source: Figure 6 supplement 1D-E; Results, DRNDAT input has divergent effects on downstream
    cellular excitability, paragraph 2
  quote: the optically-evoked EPSP (upper panels) and slow component of the IPSP (lower panels) was
    maintained following application of TTX/4AP
  expected:
  - quantity: EPSP cells tested with TTX/4AP
    value: 8
    tolerance: 0
    unit: cells
  - quantity: IPSP cells tested with TTX/4AP
    value: 3
    tolerance: 0
    unit: cells
  criterion: Per cell, the EPSP peak or IPSP trough after TTX/4AP divided by that before (normalized
    amplitude, Figure 6 supplement 1E). The paper gives no threshold for 'maintained'; the response
    is counted as maintained when it is still detected under the readings of fig6df-epsp-ipsp-at-rest.
    Reproduced when it is maintained in most cells of each group. The normalized amplitudes are
    reported.

- id: fig6no-cea-clusters
  statement: Hierarchical clustering of CeA cells on four baseline properties gave two clusters,
    late-firing cells (cluster 1) that were excited by DRN-DAT input and regular-firing cells
    (cluster 2) that were mostly inhibited.
  source: Results, DRNDAT input has divergent effects on downstream cellular excitability, paragraph
    3; Figure 6L, 6N-O
  quote: CeA cells in cluster 1 represented ‘late-firing’ neurons, whereas cluster 2 were typical of
    ‘regularfiring’ neurons ... with cluster 1 ‘late-firing’ neurons excited and cluster 2
    ‘regular-firing’ neurons mostly inhibited
  expected:
  - quantity: CeA cells clustered
    value: 26
    tolerance: 0
    unit: cells
  depends_on:
  - fig6df-epsp-ipsp-at-rest
  - fig6gi-firing-responses
  criterion: Features from the Methods (Ex vivo electrophysiology). Ramp ratio, mean Vm 900-1000 ms
    over mean Vm 100-200 ms after step onset at the largest subthreshold step; max instantaneous
    frequency, the highest firing frequency in the first 100 ms of the depolarizing steps; firing
    delay, step onset to first spike at rheobase; voltage sag, peak minus steady-state Vm in the
    -120 pA step. Each feature max-min normalized, Ward linkage on Euclidean distance (scipy
    linkage), two clusters at the top split. Response label per cell (Methods), from IEI when firing
    data exist, else EPSP only = excitation, IPSP only = inhibition, mix by the sign of the voltage
    area 0-5.5 s after light onset. Open details and their readings, all run. (1) Ramp ratio from
    absolute Vm (as written) or from the deflections from the pre-step baseline. (2) Steady state
    for the sag, the mean of the last 100 ms or of the last 200 ms of the step. (3) Normalization is
    max-min, as the Methods and legend say; Figure 6L shows the normalized values on a 0-100 scale,
    which accounts for the dendrogram's axis (to 200) and does not change the partition. (4) Cells,
    those with all four features (26 from t24). The cluster with the longer firing delay is the
    late-firing cluster. Proportions are over all cells of a cluster, as the Figure 6O pie charts
    include cells with no response. Reproduced when, under the readings, every cell of the
    late-firing cluster is excited and more than half of the cells of the other cluster are
    inhibited; blocked as methods_underspecified if the readings disagree.

