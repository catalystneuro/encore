    unit: percent of cells
  - quantity: object-excited, SI off
    value: 3.6
    tolerance: 0.36
    unit: percent of cells
  - quantity: object-inhibited, GH off
    value: 5.0
    tolerance: 0.5
    unit: percent of cells
  - quantity: object-inhibited, GH on
    value: 3.6
    tolerance: 0.36
    unit: percent of cells
  - quantity: object-inhibited, SI off
    value: 5.1
    tolerance: 0.51
    unit: percent of cells
  depends_on:
  - fig7gh-delta-auroc-trend
  criterion: A cell is significantly excited when its auROC exceeds the 97.5th percentile of 1,000
    auROCs from random circular shifts of the behaviour vector, inhibited when below the 2.5th
    (Methods); shifts drawn uniformly over the session length and the seed are standard choices.
    The auROC readings of fig7gh-delta-auroc-trend are all run. The expected percentages hold when
    within tolerance under one reading. The paper names no test for the proportions (the legend of
    7J-L is missing). Readings for the absence part are a chi-square test of the 3 by 2 table of
    responsive against other cells per stimulus and sign (pooled proportions, Figure 7J); for the
    per-mouse percentages (Figure 7K-L), a one-way repeated measures ANOVA, or Prism's
    mixed-effects model when a mouse lacks a session (Statistical analyses, three or more groups),
    and a Kruskal-Wallis test (the test the paper uses on the auROCs in Figure 7H). For response
    strength the paper reports no test on the auROCs of Figure 7G; a Kruskal-Wallis test across
    conditions on the social and on the object auROC is the reading, and the paper's own
    Kruskal-Wallis on social minus object auROC (fig7gh-delta-auroc-trend) gives p = 0.0457, so
    this part of the statement sits uneasily with Figure 7H; the results are reported. Reproduced
    when the percentages are within tolerance and no proportion test finds p < 0.05; partially
    reproduced when the tests find no difference but percentages fall outside tolerance.

- id: fig7i-little-overlap
  statement: Among 202 cells co-registered between GH off and GH on, 16 GH off and 18 GH on cells
    were excited by the social cup, and only 2 in both sessions, suggesting that stimulation may
    recruit separate CeA ensembles to represent social stimuli.
  source: Figure 7I; Results, DRNDAT input enables a functional shift in CeA dynamics, paragraph 5
  quote: in co-registered neurons, we found little overlap between CeA neurons excited by the social
    stimulus in both GH on and GH off conditions
  expected:
  - quantity: co-registered cells, GH off and GH on
    value: 202
    tolerance: 20.2
    unit: cells
  - quantity: co-registered cells social-excited in GH off
    value: 16
    tolerance: 1.6
    unit: cells
  - quantity: co-registered cells social-excited in GH on
    value: 18
    tolerance: 1.8
    unit: cells
  - quantity: co-registered cells social-excited in both
    value: 2
    tolerance: 1
    unit: cells
  depends_on:
  - fig7j-proportions-unchanged
  criterion: Co-registration with CellReg on the CNMF-E spatial footprints, with translation and
    rotation and its probabilistic model on spatial correlation and centroid distance (Methods);
    the paper gives no CellReg parameters, so its defaults are used, a stated choice. The tolerance
    on the 'both' count is one cell, since 10% of 2 is below a cell. Reproduced when the counts are
    within tolerance under one auROC reading. Whatever the counts, the overlap is reported against
    the number expected if the two sets were independent (16 x 18 / 202, about 1.4 in the paper).
    The figure's inhibitory overlap (12 GH off, 11 GH on, 2 both) is reported as well.

- id: fig7m-social-excited-predicts-preference
  statement: Across mice, the proportion of socially excited CeA neurons correlated positively with
