# Claims for Berg, Sorensen, Ting, Miller et al. (2020), "Human cortical expansion involves
# diversification and specialization of supragranular intratelencephalic-projecting neurons",
# bioRxiv doi:10.1101/2020.03.31.018820, on dandiset 000023.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-22,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the bioRxiv preprint, version 1 (the version the dandiset names), from the bioRxiv
# JATS XML flattened to text (paper/10.1101-2020.03.31.018820.txt): main text, Methods, figure
# legends, Extended Data figure legends and the legends of Extended Data Tables 1 and 2. Not in
# the text: the figures themselves (no PDF was supplied), the contents of Extended Data Table 1
# (per-feature cross-species p-values and Cohen's d) and Table 2 (donors), and Supplementary
# Data 1 (per-feature depth correlations and ANOVA results). Every claim below rests on numbers
# that the main text or a legend states; the per-feature values in those items are not used.
# A later version of record exists (Nature 598, 151-158, 2021) and was not read.
#
# Code read: https://github.com/AllenInstitute/patchseq_human_L23 at commit
# 3daf9f0803ea0c220a040ea523f23af5f93c56ac (2021-09-17). It holds R scripts for the
# transcriptomic analyses (Code1 to Code5) and soma size and density (Code6 to Code8); Python
# notebooks for pathology (pathology_analysis.ipynb, and pathology_analysis_updated.ipynb for
# the revision), the per-feature ANOVAs, depth regressions and boxplots
# (morpho_electro_feature_analysis.ipynb with hivscc_analysis.py and hivscc_data.py), the
# feature projections, and the random forest classifier and cross-species comparison
# (classifier_and_species_analysis.ipynb); and data tables. The tables are a per-cell table of
# the 385 human Patch-seq cells (data/human_IVSCC_excitatory_L23_consolidated_0131.csv, with
# specimen ID, donor, region, medical condition, depth from pia, normalized L2/3 depth and the
# Seurat t-type), the 18 electrophysiological features of human and mouse cells
# (data/human_mouse_ephys_all_0127.csv), a mouse cell table, morphological features, donor
# pathology scores (data/pathology_scoring.csv, 90 donors), FREM3 gene-depth results and the
# soma size images' measurements. The repository was last updated for the Nature revision.
# Several of its outputs differ from the preprint (316 human cells in the feature table against
# the preprint's 283; homologous-type ANOVAs run on superficial FREM3 only; 2 of 18 pathology
# comparisons significant in the updated notebook against 1 in the original). Where the
# preprint's Methods and the code disagree, the criteria follow the Methods and name the
# code's choice as a variant. Where the Methods are silent and the code settles a choice, the
# criteria cite "the code".
#
# The data the paper used. Human neurosurgical tissue resected to reach deeper pathology
# (mostly epilepsy and tumor cases; middle temporal gyrus for most cells, some frontal) from
# donors listed in Extended Data Table 2, 90 donors per the Discussion. Acute slices of 350 um
# were recorded at 32 to 34 degrees C in whole-cell current clamp (MIES, ITC-18, Bessel 10 kHz,
# 50 kHz digitization, liquid junction potential of -14 mV not corrected; bias current held the
# initial resting potential). Stimuli were short (3 ms) current pulses and long (1 s) current
# steps. Cell QC was a seal above 1 GOhm, initial access resistance below 20 MOhm and below 15%
# of input resistance; sweep QC was bridge balance below 20 MOhm and 15% of input resistance,
# bias current within 0 +/- 100 pA, and RMS noise below 0.07 mV (1.5 ms window) and 0.5 mV
# (500 ms window) (Methods, Patch-clamp recording). Each neuron was filled with biocytin and its
# nucleus extracted for RNA-seq. Measured variables per cell are the voltage responses, from
# which 18 features are computed with IPFX (Methods, Electrophysiology feature analysis); soma
# depth from pia and normalized L2/3 depth (0 at the L1/L2 border, 1 at the L3/L4 border); the
# transcriptome, from which each cell gets one of five t-types (LTK, GLP2R, FREM3, CARM1P1,
# COL22A1) by Seurat mapping; and for 109 cells a dendritic reconstruction. Cell counts are 385
# cells mapped to the five t-types, 283 with electrophysiological features, 109 reconstructed
# (Results, Patch-seq pipeline). The mouse comparison uses 120 VISp L2/3 neurons from the same
# platform (ref. 32), not in this dandiset. Histology (NeuN, Nissl, GFAP, IBA1, SMI-32, Ki-67)
# and mFISH are on other tissue.
#
# The 18 features, as named in the code (data/ephys_feature_names.csv), are adapt_mean
# (adaptation), avg_rate_hero (mean firing rate), downstroke_long_square (AP downstroke rate),
# fast_trough_v_long_square_rel (AP fast AHP), fi_fit_slope (f-I slope), first_isi_hero_inv
# (initial firing rate), input_resistance, latency_rheo (latency at rheobase),
# peak_v_long_square_rel (AP height), rheobase_i, sag, tau, threshold_v_long_square,
# trough_v_long_square_rel, upstroke_downstroke_ratio_long_square, upstroke_long_square,
# v_baseline (resting membrane potential, RMP) and width_long_square. The Methods define them
# (AP features from long steps, f-I slope and latency and initial rate at rheobase, mean rate
# and adaptation at about 50 pA above rheobase, sag at about -100 pA, tau from short pulses,
# input resistance from hyperpolarizing long steps). The code sets input resistance, f-I slope
# and sag to missing where they are not positive (hivscc_data.load_data). The IPFX version is
# not given; a current release is the standard choice, and the code's feature table is the
# check (link claim features-and-labels-link).
#
# What is where. The dandiset is described as Patch-seq recordings from human cortex (June
# 2020) and names this preprint; it is meant to hold the electrophysiology. The t-type and depth
# of each cell are part of the paper's record of the cell; whether the files carry them or they
# must come from the code's cell table by specimen ID is for the author to find, through the
# link claim, so the claims that need them are marked `with_labels`. Claims that also need the
# donor pathology scores or the mouse recordings are `with_inputs`. Transcriptomes,
# morphologies, histology and mFISH are not in the dandiset: the Methods name the Allen Brain Map
# RNA-seq portal for the reference data and the code's README names the Human Patch-seq L2/3
# project at the Allen Brain Map; those claims are `elsewhere`.
#
# Common method, used by several criteria. "The analysis cells" are the cells of the code's
# 385-cell table with the feature needed (a statsmodels formula drops missing values per
# feature, as the code does). "Deep FREM3" is FREM3 with normalized L2/3 depth above 0.575, the
# density minimum (Results, Deep L3 human glutamatergic t-types, paragraph 2; Methods,
# Quantification of soma size, which prints the boundary as -0.575 in its sign convention; the
# code uses depth > 0.575). "The t-type ANOVA" is, per feature, an ordinary least squares fit
# of the feature on t-type (statsmodels), with R2 its explained variance and p the
# heteroscedasticity-robust (HC3) F test, Benjamini-Hochberg corrected across the features of
# one modality (Methods, Analysis of features by t-type and species; code
# hivscc_analysis.run_cluster_anova). "The depth regression" is the same with normalized L2/3
# depth as the regressor (Methods, Analysis of features by depth for FREM3 t-type). "The
# pairwise test" is a two-sided Mann-Whitney test between pairs of t-types, Benjamini-Hochberg
# corrected across the pairs of one feature (figure legends; code hivscc_analysis.pairwise_mw
# and plot_mw_bars).
schema_version: 2
dataset:
  archive: dandi
  id: "000023"
paper: doi:10.1101/2020.03.31.018820
claims:
# --- Link and cohort -------------------------------------------------------------------------
- id: features-and-labels-link
  kind: link
  statement: The dandiset's recordings can be matched to the paper's per-cell table (t-type and
    depth) by specimen ID, and the 18 features computed from them agree with the paper's feature
    table.
  source: Methods, Electrophysiology feature analysis; code data/human_IVSCC_excitatory_L23_consolidated_0131.csv
    and data/human_mouse_ephys_all_0127.csv at commit 3daf9f0
  data: with_labels
  criterion: Cells are matched to the code's cell table by specimen ID (SpecimenID). The paper names
    no identifier (Methods), and the code joins its tables on SpecimenID only
    (hivscc_data.load_data). Where the files carry no SpecimenID, the paper allows two readings of
    the match, (M1) only by a SpecimenID stored in the files, and (M2) by a SpecimenID recovered
    from each file, the code's SpecimenID of the same donor next above the file's ephys session id,
    with agreement of the computed features with the code's table as the check. M2 is a
    reconstruction that neither the paper nor the code states. Both are run and reported, with the
    missing identifier recorded as a finding; the claims that depend on this link name the reading
    they use. The 18 features are computed from each matched recording with IPFX, after the sweep QC
    of the Methods. For each feature, the median over matched cells of the absolute difference from
    the code's table relative to the table's absolute value is taken (10%, the protocol's default
    tolerance, as the bound). Reproduced when at least 283 of the 385 cells match and all 18
    features are within 10%; partially reproduced when cells match and 9 to 17 features are within
    10%; not reproduced otherwise. The number of matched cells, and how many of them carry a t-type
    or depth in the files themselves, is reported. The code's table is from the revision (316 human
    cells), so cells beyond the preprint's 283 are expected.
- id: cohort-cells
  statement: 385 Patch-seq neurons passing transcriptomic QC mapped to the five supragranular
    glutamatergic t-types, and 283 of them had recordings complete enough to compute
    electrophysiological features.
  source: Results, Patch-seq pipeline for human neurosurgical tissue analysis, paragraph 2
  quote: A total of 385 neurons that passed transcriptomic data QC mapped with higher confidence to
    the five supragranular human glutamatergic t-types than to any other neuron type. ... Most
    neurons (283) also had sufficiently complete recordings to calculate electrophysiological
    features.
  data: with_labels
  depends_on:
  - features-and-labels-link
  expected:
  - quantity: neurons mapped to the five t-types
    value: 385
    tolerance: 0
  - quantity: neurons with electrophysiological features
    value: 283
    tolerance: 0
  criterion: Counts are records, so the tolerance is zero. The 385 is counted as the cells of
    the code's table that have a recording in the dandiset; the 283 as those whose recordings
    give the 18 features with IPFX (the paper does not say how many features may be missing;
    readings are (a) at least one feature, (b) all 18, (c) no more than 3 of 18 missing, the
    rule the Methods give for the projections). Reproduced when both counts match under one
    reading; partially reproduced when one does. The dandiset may hold other cells; they are
    counted and reported apart.
- id: cohort-donors
  statement: The neurons came from neurosurgical specimens of 90 tissue donors.
  source: Discussion, paragraph 2
  quote: across human neurosurgical specimens from 90 different tissue donors
  data: with_labels
  depends_on:
  - features-and-labels-link
  expected:
    quantity: donors
    value: 90
    tolerance: 0
  criterion: Donors are counted as distinct subjects. The paper allows two readings, (a) all
    subjects in the dandiset, or (b) the donors of the 385 cells of the code's table that are in
    the dandiset. Reproduced when either gives 90. The code's pathology table also lists 90
    donors, which is reported.
- id: cohort-type-counts
  statement: The electrophysiology figures show 66 LTK, 25 GLP2R and 136 FREM3 neurons, and 21
    deep FREM3, 17 CARM1P1 and 37 COL22A1 neurons.
  source: Figure 4a legend; Figure 6b legend
  quote: Bottom panels compare the intrinsic electrophysiological responses for 66 LTK, 25 GLP2R
    and 136 FREM3 neurons. ... Electrophysiological description of the intrinsic electrophysiology
    responses of 21 deep FREM3, 17 CARM1P1 and 37 COL22A1 neurons.
  data: with_labels
  depends_on:
  - features-and-labels-link
  expected:
  - quantity: LTK neurons with electrophysiology
    value: 66
    tolerance: 0
  - quantity: GLP2R neurons with electrophysiology
    value: 25
    tolerance: 0
  - quantity: FREM3 neurons with electrophysiology
    value: 136
    tolerance: 0
  - quantity: deep FREM3 neurons with electrophysiology
    value: 21
    tolerance: 0
  - quantity: CARM1P1 neurons with electrophysiology
    value: 17
    tolerance: 0
  - quantity: COL22A1 neurons with electrophysiology
    value: 37
    tolerance: 0
  criterion: Counts per t-type of the cells with features, under the readings of cohort-cells
    for which cells have features; deep FREM3 also needs a normalized depth above 0.575.
    Reproduced when all six match under one reading; partially reproduced when at least three
    do.
# --- Histology and transcriptomics (not in the dandiset) ----------------------------------
- id: fig1a-thickness
  statement: Human L2 and L3 together (1.23 +/- 0.15 mm) are on average 1.16 times thicker than
    the whole mouse cortex (1.06 +/- 0.01 mm).
  source: Results, Human supragranular cortex is more diverse than in mouse, paragraph 1; Figure 1a
  quote: The combined thickness of the relatively thin L2 and very thick L3 in human cortex (1.23 ±
    0.15 mm) is on average 1.16 times greater than the thickness of the entire mouse cortex (1.06 ±
    0.01 mm; Fig. 1a ).
  data: elsewhere
  where: NeuN section measurements in GitHub AllenInstitute/patchseq_human_L23 data/cell_sizes at
    commit 3daf9f0803ea0c220a040ea523f23af5f93c56ac (Code6 and Code7)
  expected:
  - quantity: human L2 plus L3 thickness
    value: 1.23
    tolerance: 0.15
    unit: mm
  - quantity: mouse cortical thickness
    value: 1.06
    tolerance: 0.01
    unit: mm
  criterion: Tolerances are the reported spreads (SD across donors). Not tested on the dandiset. The
    human value is the mean and SD over the 5 human sections of each section's mean L2 plus L3
    thickness, from the L1/L2 to the L3/L4 boundary line (Code6_cortical_depth_code_human.r,
    L23_depth; the code prints 1058, 1293, 1387, 1073 and 1344 um). The paper does not say where the
    mouse value of 1.06 mm comes from; the Methods (Quantification of soma size) describe only the
    L1/L2 and L3/L4 borders, and the code's mouse sections have no white matter line, so the mouse
    value and the ratio of 1.16 cannot be tested from the paper's materials and are not judged. The
    mouse L2/3 thickness the code computes (Code7, 281, 223 and 257 um) is reported, not compared.
    Reproduced when the human value is within tolerance; the outcome notes that the mouse value is
    untested.
- id: fig1b-density
  statement: Human supragranular neuron density is 27.7 +/- 4.5 thousand cells/mm3, highest in L2
    and halving to a minimum in mid L3, while mouse VISp L2/3 has about 6 times that density
    (165 +/- 24.9 thousand cells/mm3), uniform with depth.
  source: Results, Human supragranular cortex is more diverse than in mouse, paragraph 1; Figure 1b
  quote: the average density of human neurons was 27.7 ± 4.5 thousand cells/mm 3 ( Fig. 1b ; left).
    This distribution is not homogeneous, with higher density in L2 that decreases by half to reach a
    low point in mid L3 ( Fig. 1b ; right). In contrast, supragranular layers of mouse VISp show 6
    times the neuronal density of human (165 ± 24.9 thousand cells/mm 3 ) with a homogeneous
    distribution across cortical depth.
  data: elsewhere
  where: NeuN section measurements in GitHub AllenInstitute/patchseq_human_L23 data/cell_sizes at
    commit 3daf9f0803ea0c220a040ea523f23af5f93c56ac (Code6 and Code7)
  expected:
  - quantity: human neuron density
    value: 27.7
    tolerance: 4.5
    unit: thousand cells/mm3
  - quantity: mouse neuron density
    value: 165
    tolerance: 24.9
    unit: thousand cells/mm3
  criterion: Tolerances are the reported spreads. Method per the Methods (20 bins over L2/3,
    first and last dropped, one section per donor). Not tested on the dandiset.
- id: fig1c-soma-area
  statement: Mean soma area doubles from L2 to deep L3 in human but is uniform across mouse L2/3;
    the interquartile ranges are 44 to 96 um2 in mouse and 107 to 253 um2 in human, and the
    largest human somata exceed 850 um2.
  source: Results, Human supragranular cortex is more diverse than in mouse, paragraph 1; Figure 1c
  quote: the average cross-sectional area of neuron somata doubles from L2 to deep L3 in human
    supragranular cortex in a graded fashion but in mouse is remarkably uniform across the depth of
    supraganular cortex ( Fig. 1c , left). The interquartile range of mouse and human somata were 44
    - 96μm 2 and 107 - 253μm 2 , respectively, with the largest human somata exceeding 850μm 2 .
  data: elsewhere
  where: NeuN ROI measurements in GitHub AllenInstitute/patchseq_human_L23 data/cell_sizes at
    commit 3daf9f0803ea0c220a040ea523f23af5f93c56ac (Code6 and Code7)
  expected:
  - quantity: mouse soma area, first quartile
    value: 44
    tolerance: 4.4
    unit: um2
  - quantity: mouse soma area, third quartile
    value: 96
    tolerance: 9.6
    unit: um2
  - quantity: human soma area, first quartile
    value: 107
    tolerance: 10.7
    unit: um2
  - quantity: human soma area, third quartile
    value: 253
    tolerance: 25.3
    unit: um2
  criterion: Not tested on the dandiset. The quartiles are over all somata of a species pooled
    across its sections (3 mouse, 5 human), as the code computes the values the text gives
    (Code7_cortical_depth_code_mouse.r, quantile over the concatenated areas; it prints 44.7 and
    96.5 um2 for mouse, 107.5 and 252.6 um2 for human, and a largest human soma of 886 um2). The
    per-section quantiles the code also prints are reported, not judged. Reproduced when the four
    quartiles are within tolerance and the largest human soma exceeds 850 um2.
- id: fig1c-soma-variation
  statement: The variation of soma size in deep L3 is four times higher in human than in mouse.
  source: Results, Human supragranular cortex is more diverse than in mouse, paragraph 1; Figure 1c
    right
  quote: variation in deep L3 neuron soma size is four-fold higher in human compared to mouse ( Fig.
    1c , right)
  data: elsewhere
  where: NeuN ROI measurements in GitHub AllenInstitute/patchseq_human_L23 data/cell_sizes at
    commit 3daf9f0803ea0c220a040ea523f23af5f93c56ac (Code6 and Code7)
  expected:
    quantity: ratio of human to mouse SD of soma area in deep L3
    value: 4
    tolerance: 0.4
  criterion: Not tested on the dandiset. The Methods do not say which bins make up deep L3 for this
    ratio; the code settles it. Of the 20 bins of scaled depth (breaks every 0.05, Code6), deep L3
    is the five bins whose centres lie in scaled depth -0.95 to -0.7 (centres -0.925 to -0.725,
    normalized L2/3 depth 0.7 to 0.95). For each section and bin the SD of soma area is taken; these
    SDs are averaged over the deep L3 bins and sections of each species, and the human mean is
    divided by the mouse mean (Code7_cortical_depth_code_mouse.r, l3dex on het, printed as 4.0).
    Reproduced when this ratio is within tolerance. As a variant, deep L3 as the bins with centres
    deeper than the density minimum at normalized depth 0.575 (Methods, Quantification of soma
    size), without the deepest bin, which the Methods drop for boundary effects, is run and
    reported.
- id: fig1f-frem3-heterogeneity
  statement: The human FREM3 t-type has more within-type transcriptomic heterogeneity (variance
    explained by PC1 above permuted data) than any other human or mouse supragranular t-type,
    which are similar to one another.
  source: Results, Human supragranular cortex is more diverse than in mouse, paragraph 3; Figure 1f
  quote: This analysis confirms high heterogeneity in FREM3 , with lower, generally similar, values
    for all other human and mouse t-types ( Fig. 1f ).
  data: elsewhere
  where: Allen Brain Map RNA-seq data (https://portal.brain-map.org/atlases-and-data/rnaseq), human
    MTG nuclei and mouse VISp cells, as the Methods name them; not pinned
  criterion: Method per the Methods (80 cells per type, 80 most variable genes, 100 repeats
    against gene-shuffled data). Not tested on the dandiset.
- id: fig1g-deep-types-de-genes
  statement: The homologous types are similarly discrete from one another in mouse and in human,
    while CARM1P1 and COL22A1 have many more differentially expressed genes against the
    homologous types than the homologous types have against one another, in either species.
  source: Results, Human supragranular cortex is more diverse than in mouse, paragraph 3; Figure 1g
  quote: Homologous types are similarly discrete from one another in both mouse in human, whereas
    the deep L3 CARM1P1 and COL22A1 t-types had many more DE genes when compared to the homologous
    t-types ( Fig. 1g ).
  data: elsewhere
  where: Allen Brain Map RNA-seq data (https://portal.brain-map.org/atlases-and-data/rnaseq), as the
    Methods name them; not pinned
  criterion: Not tested on the dandiset.
- id: fig3a-platform-correlation
  statement: Human Patch-seq cells and dissociated nuclei of matched t-types are highly correlated
    in gene expression (R = 0.85), more than mouse cells and human nuclei (R = 0.57); 177 genes are
    enriched in nuclei and 2,670 at least four-fold in Patch-seq.
  source: Results, High-confidence Patch-seq neuron t-type mapping, paragraph 2; Figure 3a
  quote: Expression data from dissociated mouse whole cells and human nuclei were moderately
    correlated (R=0.57, p~0, Fig. 3a , left), ... dissociated nuclei and Patch-seq cells from matched
    human t-types were highly correlated (R=0.85, p~0, Fig. 3a , right). Relatively few genes (177
    genome-wide) showed enriched expression in dissociated nuclei relative to Patch-seq cells ... we
    identified 2,670 genes with at least four-fold enrichment in Patch-seq
  statistics:
  - about: mouse cells against human nuclei, printed p~0
    statistic: R = 0.57
    p: 0
  - about: human nuclei against human Patch-seq cells, printed p~0
    statistic: R = 0.85
    p: 0
  data: elsewhere
  where: Allen Brain Map RNA-seq data and the Human Patch-seq L2/3 project at the Allen Brain Map
    (https://knowledge.brain-map.org/data/0R94W5U07IHCMVJ4TVK/summary), as the code's README
    names them; not pinned
  expected:
  - quantity: correlation, nuclei against Patch-seq
    value: 0.85
    tolerance: 0.085
  - quantity: correlation, mouse cells against human nuclei
    value: 0.57
    tolerance: 0.057
  criterion: Not tested on the dandiset.
# --- Pathology ------------------------------------------------------------------------------
- id: fig2d-pathology-scores
  statement: Average pathology scores over six markers ranged from 0.06 to 1.83 across donors, and
    most cases had averages below 1.0, a range not considered overtly pathological.
  source: Results, Detailed histological assessment of human surgical tissue, paragraph 2; Figure
    2c and 2d
  quote: images from the case with the lowest average score (mean of 6 marker scores = 0.06) are
    contrasted with images from the case with the highest average score (mean of 6 marker scores =
    1.83) ( Fig. 2c ). ... However, this was rare, and most cases had average scores <1.0 ( Fig. 2d )
  data: elsewhere
  where: GitHub AllenInstitute/patchseq_human_L23 data/pathology_scoring.csv at commit
    3daf9f0803ea0c220a040ea523f23af5f93c56ac
  expected:
  - quantity: lowest donor average score
    value: 0.06
    tolerance: 0.006
  - quantity: highest donor average score
    value: 1.83
    tolerance: 0.183
  criterion: The average is of GFAP, IBA1, Ki-67, SMI-32, NeuN and Nissl (cellularity) scores, as
    the code's pathology_analysis.ipynb sums them. "Most" is read as more than half of the donors
    with all six scores. Not tested on the dandiset.
- id: edfig1-marker-correlation
  statement: The six pathology markers are very weakly correlated with one another across donors,
    with only Ki-67 and Nissl (cellularity) modestly correlated.
  source: Results, Detailed histological assessment of human surgical tissue, paragraph 2; Extended
    Data Figure 1
  quote: we found very low correlation of the 6 cellular markers with each other, with only Ki-67
    and Nissl (cellularity) being modestly correlated ( Extended Data Fig. 1 )
  data: elsewhere
  where: GitHub AllenInstitute/patchseq_human_L23 data/pathology_scoring.csv at commit
    3daf9f0803ea0c220a040ea523f23af5f93c56ac
  criterion: Pearson correlation across donors (Extended Data Fig. 1 legend). The paper gives no
    threshold for "modest"; reproduced when the Ki-67 and Nissl pair has the largest absolute
    correlation of the 15 pairs. Not tested on the dandiset.
- id: fig2ef-pathology-ephys
  statement: Of 18 electrophysiological features compared between neurons from donors with low
    (0 to 1) and high (1 to 3) GFAP or IBA1 scores, only resting membrane potential under IBA1
    differs, neurons from high-IBA1 donors being about 5 mV more hyperpolarized; the other 17 IBA1
    and all 18 GFAP comparisons do not differ.
  source: Results, Detailed histological assessment of human surgical tissue, paragraph 3; Figure 2e
    and 2f
  quote: Among the 18 electrophysiological features analyzed for GFAP and IBA1, only one feature
    (resting membrane potential, RMP) related to IBA1 was significantly different between low versus
    high groups. Neurons in the high IBA1 group were approximately 5 mV more hyperpolarized at rest
    than neurons in the low IBA1 group ( Fig. 2f ). The remaining 17/18 features for IBA1 and all 18
    features for GFAP were not statistically different between low and high groups
  statistics:
  - about: RMP, low against high IBA1
    test: Mann-Whitney (named in the code; the paper does not name the test)
    p: 0.05
    p_relation: "<"
    corrected: Bonferroni
    n: GFAP low 60 and high 125 neurons; IBA1 low 170 and high 15 neurons
  data: with_inputs
  depends_on:
  - features-and-labels-link
  expected:
  - quantity: RMP difference, high minus low IBA1
    value: -5
    tolerance: 0.5
    unit: mV
  - quantity: GFAP low neurons
    value: 60
    tolerance: 0
  - quantity: GFAP high neurons
    value: 125
    tolerance: 0
  - quantity: IBA1 low neurons
    value: 170
    tolerance: 0
  - quantity: IBA1 high neurons
    value: 15
    tolerance: 0
  criterion: Partly a claim of absence, judged on the paper's test. Cells are the supragranular
    glutamatergic neurons (the code's 385-cell table) with all 18 features defined (the code
    drops cells with any missing feature). The paper's text says "all supragranular glutamatergic
    neurons"; the original pathology notebook also keeps only temporal cortex cells of the
    hIVSCC-MET project, from a table not in the repository. So the readings are (a) temporal
    cells only (region temporal in the code's cell table), (b) all regions; the group counts
    above say which the paper used. Each donor's GFAP and IBA1 scores are the columns GFAP Cortex
    and Iba1 Cortex of the code's data/pathology_scoring.csv (the mean of three
    neuropathologists), low being at most 1 and high above 1 (the code; the text gives 0-1 and
    1-3). The test is the code's, scipy's Mann-Whitney U with its default of scipy 1.4 (the
    pinned version), whose p is half the two-sided p, at the Bonferroni level 0.05/18 per marker
    (Figure 2f legend and the code). The paper does not say whether the 5 mV is a difference of
    group medians or of group means; both are computed, and the size part of the outcome is the
    one both give (methods_underspecified for the size when they differ). Reproduced when, under
    one reading of the cells, RMP under IBA1 is the only significant comparison of the 36, with
    the high group more hyperpolarized and the difference within tolerance; partially reproduced
    when the significance pattern holds but the size is outside tolerance; not reproduced when
    any other comparison is significant or RMP under IBA1 is not.
    The two-sided Mann-Whitney test is shown as a variant, as is the updated notebook's result.
# --- Depth by t-type ------------------------------------------------------------------------
- id: fig3d-depth-by-type
  statement: LTK neurons lie mainly in L2 and at the L2/L3 border, GLP2R mainly in upper L3,
    FREM3 span L2 and L3 and continue into L4, and CARM1P1 and COL22A1 lie almost entirely in deep
    L3 and along the L3/L4 border.
  source: Results, High-confidence Patch-seq neuron t-type mapping, paragraph 4; Figure 3d
  quote: Human LTK neurons were found primarily in L2 and in the border region of L2 and L3. GLP2R
    neurons were found primarily in upper L3, with some neurons found in L2. FREM3 neurons spanned L2
    and L3, continuing into L4, consistent with their heterogeneous gene expression profile. CARM1P1
    and COL22A1 were found almost entirely in deep L3 and along the L3/L4 border.
  data: with_labels
  depends_on:
  - features-and-labels-link
  criterion: Normalized L2/3 depth per cell (0 at the L1/L2 border, 1 at the L3/L4 border; Figure
    3d legend and Figure 1 legend). The L2/L3 border is not recorded per cell, so L2 is judged
    by order. Deep L3 is depth above 0.575 (the paper's density minimum) and L4 depth above 1.
    Reproduced when all of these hold; the median depth of LTK is below that of GLP2R; the GLP2R
    median is below 0.575; FREM3 includes cells shallower than the LTK median and cells deeper
    than 1; and, for CARM1P1 and COL22A1 each, "almost entirely" holds. The paper gives no number
    for "almost entirely"; the readings are (a) at least 90% and (b) at least 80% of cells deeper
    than 0.575. They are thresholds, so the outcome is the one both give, and the claim is
    methods_underspecified when they differ. Partially reproduced when the order of medians
    holds but not the rest. All cells
    of the code's table with a depth are used, whether or not they have features.
