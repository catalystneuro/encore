- id: fig3s2-stg-control-variability
  statement: Pyloric frequency, PD spikes per burst and PD duty cycle vary widely between the 15
    STG preparations at control pH, as widely as the pooled distributions across pH.
  source: Results, The pyloric rhythm is surprisingly robust to extreme changes in pH, paragraph
    8; Figure 3, figure supplement 2
  quote: The pooled distributions for these three measures were highly variable for all pH
    conditions reflecting the animal-to-animal variability in the pyloric rhythm. We plotted the
    distributions for all 15 STG preparations at control pH 7.8 and found similarly variable
    activity at baseline conditions
  criterion: The 48 bin values of each preparation in the first control step ([EXT];
    pHCumulative.m takes condition 1 for this figure). The paper gives no test (its legend says
    "each CG preparation", which the Results and the code show is the STG). Open is how
    "similarly variable" is judged; readings (a) the range of the 15 preparation means at
    control spans at least half the range of the pooled bin values over all pH steps, for each
    measure; (b) a Kruskal-Wallis test of the bin values on preparation has p < 0.05 for each
    measure. Reproduced when one reading holds for all three measures.
- id: fig4a-ptx-example
  statement: In an example preparation with PTX, the PD neuron lost most of its slow wave at pH
    6.7, became silent and depolarized at 5.5, kept its burst at 8.8 and fired single-spike
    bursts at 10.4; the LP neuron fired tonically from 6.7 to 10.4 and lost activity at 5.5.
  source: Results, Semi-isolated pyloric neurons are sensitive to extreme pH, paragraph 1; Figure
    4A
  quote: At pH 6.7, the PD neuron of this preparation lost most of its slow wave activity. It
    then became silent and depolarized in pH 5.5 saline. At pH 8.8, the PD burst was largely
    intact, and at pH 10.4, the neuron showed single spike bursts. The LP neuron fired tonically
    from pH 6.7 to 10.4, again showing loss of activity at pH 5.5 similar to PD
  criterion: The example is not named in the paper or the code. Reproduced when at least one of
    the PTX preparations shows, in the last minute of each step ([INTRA]), a PD slow-wave
    amplitude at 6.7 below half its PTX control value, no PD spikes and a minimum membrane
    potential above control at 5.5, one spike per PD burst at 10.4, and LP spiking without
    slow-wave bursts from 6.7 to 10.4 with no LP spikes at 5.5. The thresholds (half,
    one spike) are readings of the words, named here because the paper gives none.
- id: fig4bc-membrane-potential
  statement: With PTX, the PD neuron depolarized significantly in extreme acid (pH 5.5 and 6.1)
    while LP stayed constant, and in base PD stayed constant while LP hyperpolarized
    significantly at pH 8.8, 9.3, 9.8 and 10.4.
  source: Results, Semi-isolated pyloric neurons are sensitive to extreme pH, paragraph 2; Figure
