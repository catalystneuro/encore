# Claims for Haley, Hampton & Marder (2018), "Two central pattern generators from the crab,
# Cancer borealis, respond robustly and differentially to extreme extracellular pH", eLife
# 7:e41877, doi:10.7554/elife.41877, tested on OSF:r7aes.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-11-26, protocol pilot-19 as stated in docs/protocol.md.
#
# Text read. paper/10.7554-elife.41877.txt, the version of record as served by Europe PMC
# (PMC6328273, open access JATS, flattened). It holds the main text, all figure legends, the
# legends of the figure supplements, Materials and methods, and the Data availability
# statement. No PDF was supplied. The four statistics tables (Figure 3, 4, 7 and 8, figure
# supplement 1) are images in the article; only their legends are in the text, so no F, t or
# exact p-value is available, and the statistics below record only the bounds the legends
# print (*p<0.05) and the words "significant" of the Results. The source data files of
# Figures 2, 3, 4, 6, 7 and 8 are not in the text read.
#
# Code read. github.com/jesshaley/haley_hampton_marder_2018 at commit 83f5904 (8 January
# 2019), the repository the Data availability statement names. It holds abfload.m and
# LoadAbf.m (read .abf), spikenburst.s2s and batchImp.s2s (Spike2 scripts for manual threshold
# spike and burst detection), readSpikeOutput.m and extracellularAnalysis.m (burst measures per
# experiment), analyzeWaveform.m and intracellularAnalysis.m (intracellular waveforms),
# pHCumulative.m and pHCumulativePTX.m (pooling, 10 s bins, figures, csv export),
# statistics.R (ANOVAs and t-tests) and plotting scripts. The manual state annotations it reads
# (stateData_STG.xlsx, stateData_CG.xlsx) are not in the repository.
#
# Data the paper used. Adult male Cancer borealis, 400 to 700 g, March 2016 to May 2018.
# Saline pH steps, measured at 11 C, of 5.5, 6.1, 6.7, 7.2, 7.8 (control), 8.3, 8.8, 9.3, 9.8,
# 10.4. Saline was changed every 15 min in steps of about 0.5 from control 7.8 to 5.5 (acid)
# or 10.4 (base), followed by at least 30 min recovery at 7.8, then the opposite protocol and a
# second recovery; acid-first and base-first orders were counterbalanced. Superfusion at 11 C,
# about 9 mL/min; bath temperature and bath pH (pH microelectrode) were recorded.
# - Stomatogastric ganglion (STG): 15 intact stomatogastric nervous system preparations.
#   Intracellular PD and LP recordings, extracellular lvn (PD, LP, PY units; LG axon) and in
#   some preparations mvn, dgn, lgn and ion. pHCumulative.m lists the 15 experiments
#   (877_093, 877_101, 877_121, 877_127, 877_141, 887_005, 887_049, 887_069, 887_097, 887_105,
#   887_137, 887_141, 887_145, 897_005, 897_037); the PD unit is analysed; the example STG #1
#   of Figure 2 is 897_037.
# - Cardiac ganglion (CG): 15 preparations, extracellular recordings of the trunk (Small Cell
#   and Large Cell units). pHCumulative.m lists them as experiment and unit pairs, 10 distinct
#   experiment numbers carrying 15 LC units (877_149 CG1L and CG2L; 887_005 CG2L; 887_011
#   CG3L; 887_017 CG3L; 887_061 CG1L; 887_065 CG2L; 887_073 CG2L; 887_093 CG2L; 887_127 CG1L;
#   887_149 CG1L and CG2L; 897_041 CG1L, CG3L and CG7L). The example CG #1 of Figure 6 is
#   877_149 CG2L. The paper counts 15 CG preparations.
# - Picrotoxin (PTX, 10^-5 M) experiments of Figure 4: intracellular PD and LP with PTX in
#   every pH solution. pHCumulativePTX.m lists 9 experiments (903_046, 903_048, 903_050,
#   903_052, 903_054, 903_056, 903_058, 903_060, 903_064); the text gives no n.
# - extracellularAnalysis.m and intracellularAnalysis.m assume one .abf file per pH condition,
#   12 files per experiment in protocol order. The OSF project is described as raw .abf files
#   ("Recordings of stomatogastric and cardiac ganglia of C. borealis at varying pH").
#
# Methods fixed here, cited in the criteria by their letters.
# [EXT] Extracellular measures (Methods, Data acquisition and analysis, paragraphs 2 and 4;
#   code as named). Spikes and bursts are found by thresholding the extracellular trace
#   (Methods); in spikenburst.s2s thresholds are set by hand and bursts are made by Spike2
#   BurstMake with 0.3 s as the starting maximum interspike interval and 2 as the starting
#   minimum spikes per burst, both adjustable per file. STG measures are from the PD unit
#   (pHCumulative.m), CG measures from the LC unit (Methods, Figures 6 and 7). Frequency is
#   1 / (onset of one burst to onset of the next); spikes per burst; duty cycle is burst
#   duration (first to last spike) over period (Methods; readSpikeOutput.m). Duty cycles above
#   0.4, and spike counts above 15 (STG) or 30 (CG), are discarded (extracellularAnalysis.m).
#   The last 8 min of each 15 min step are analysed (Methods). Means are taken in 10 s bins,
#   48 per preparation and condition (Methods); a bin with no burst counts as 0
#   (pHCumulative.m). The value a statistical test uses per preparation and condition is the
#   mean of its 48 bins (pHCumulative.m, csv export). Variant (code): as written,
#   pHCumulative.m compares fileLength in seconds with sampleFreq*480 in samples, so its window
#   is the 480 s after the first burst of each file; this is shown as a variant, the Methods'
#   last 8 min are the main reading.
# [STATE] States (Results, Figures 3B and 7A; Methods paragraph 3). Manual annotation; a
#   transition is noted when a new state lasts at least 10 s. STG states 1 normal triphasic
#   (PD, LP, PY, at least three spikes per burst each), 2 weak triphasic (all three units, some
#   with one or two spikes per cycle), 3 intermittent triphasic (rhythmic, some units active),
#   4 all silent, 5 atypical. CG states 1 SC and LC bursting (at least one LC spike per SC
#   burst), 2 SC bursting only, 3 all silent, 4 atypical. The state is taken per second over
#   the last 480 s of each step (pHCumulative.m). Fraction of time rhythmic is states 1 and 2
#   for the STG and state 1 for the CG (Results, Figure 8 section; pHCumulative.m). In the
#   code's STG annotation, a state x during a gastric rhythm is coded 8.x (pHCumulative.m). The
#   annotations (stateData_*.xlsx) are not in the code repository; if the dataset does not
#   hold them, states are annotated from the definitions above.
# [INTRA] Intracellular measures of PTX preparations (Methods, paragraph 5; analyzeWaveform.m,
#   intracellularAnalysis.m, pHCumulativePTX.m). Last minute of each step. Slow wave is Vm minus
#   its high-pass (2nd order Butterworth at 10 Hz, filtfilt). Slow-wave troughs and peaks by
#   findpeaks with prominence 1 mV and minimum distance 1/maxBurstFreq (starting values 2 Hz
#   for PD, 10 Hz for LP, set by hand). Minimum membrane potential is the slow-wave troughs; a
#   bin with no trough takes the mean of the per-second minima of the slow wave. Spikes are
#   peaks of the high-passed trace with prominence of at least minSpikeHeight (starting 10 mV
#   PD, 3 mV LP, set by hand); spike amplitude is peak minus trough. PD burst frequency is the
#   inverse of the trough-to-trough interval of the slow wave (Methods; analyzeWaveform.m uses
#   peak-to-peak, shown as a variant). LP firing rate is the inverse interspike interval. Means
#   in six 10 s bins; empty bins of frequency or amplitude count as 0; the per-preparation
#   value is the mean of the six bins.
# [RM] Effect of pH (Methods, Statistics; Figure 3, 4 and 7, figure supplement 1;
#   statistics.R). Separately for acid (5.5, 6.1, 6.7, 7.2 and the control 7.8 just before the
#   acid steps) and base (the control 7.8 just before the base steps, 8.3, 8.8, 9.3, 9.8,
#   10.4), a univariate Type III repeated-measures ANOVA (car::Anova, idesign ~pH, uncorrected
#   univariate p). Post hoc, for each step a paired t-test against that control, p multiplied
#   by 4 (acid) or 5 (base). T-tests are not run for a non-significant ANOVA. Alpha 0.05.
# [MIX] Ganglion comparison (Methods, Statistics; Figure 8, figure supplement 1). Per protocol,
#   a two-way mixed-measures Type III ANOVA, ganglion between preparations and pH within, on
#   per-preparation fraction of time rhythmic. statistics.R at this commit fits ~1 with no
#   ganglion term and then reads rows that model does not have, so it cannot be the code that
#   made the table; the model is taken from the Methods. Open: the contrast coding of
#   ganglion, which changes Type III main effects; readings (a) sum-to-zero contrasts, (b) R's
#   default treatment contrasts. Post hoc, per pH an independent samples t-test, Welch's form
#   (t.test default in statistics.R), p multiplied by 4 (acid) or 5 (base).
schema_version: 2
paper: doi:10.7554/elife.41877
claims:
- id: fig2a-stg1-traces
  statement: In the example acid-first STG preparation, the pyloric rhythm stayed triphasic
    down to pH 6.1 and changed at 5.5; in base it stayed triphasic up to 10.4 with fewer spikes
    per burst and smaller slow waves at 10.4, and it recovered in control saline after each
    protocol.
  source: Results, The pyloric rhythm is surprisingly robust to extreme changes in pH, paragraph
    2; Figure 2A
  quote: As the preparation was subjected to more acidic saline, the rhythm remained triphasic
    until the most acidic pH, 5.5 ... The bottom row shows the same preparation in basic
    conditions where it remained triphasic, although with fewer spikes per burst and lower
    amplitude slow waves at pH 10.4
  criterion: On experiment 897_037 (STG 1, pHCumulative.m). States as in [STATE] over the last
    8 min of each step. Reproduced when the preparation is in state 1 or 2 for most of each
    step from 7.2 to 6.1 and from 8.3 to 10.4, in each recovery, and at 10.4 has a lower mean
    PD spikes per burst ([EXT]) and a lower mean PD slow-wave amplitude (peak minus trough of
    the slow wave, [INTRA] filtering, last minute) than at the control just before the base
    steps. "Remained triphasic until 5.5" is open; readings (a) still triphasic at 5.5, (b)
    triphasic down to 6.1 and not at 5.5. The state at 5.5 is reported; the claim holds under
    either.
- id: fig2bcd-stg1-measures
  statement: In the example STG preparation, pyloric burst frequency increased in acid and
    decreased in base, PD spikes per burst decreased at pH 5.5, and PD duty cycle decreased
    slightly in base.
  source: Results, The pyloric rhythm is surprisingly robust to extreme changes in pH, paragraph
    3; Figure 2B to 2D
  quote: >-
    The pyloric burst frequency of STG #1 increased in acid and decreased in base ( Figure
    2B ). The number of PD spikes per burst decreased at pH 5.5 ( Figure 2C ). The duty cycle of
    the PD neurons in STG #1 decreased slightly in base
  criterion: On 897_037, the 48 bin means per step of [EXT]. The paper gives no test. Open is
    how "increased in acid" is judged; readings (a) the mean at the extreme step (5.5, or 10.4)
    against the control just before that protocol, (b) the sign of the Spearman correlation of
    the step means with pH over the control and the steps of that protocol. Reproduced when,
    under one reading, frequency is higher in acid and lower in base, spikes per burst at 5.5
    are below control, and duty cycle in base is below control.
- id: fig3a-stg-variability-examples
  statement: Two further STG preparations kept their activity from pH 6.1 to 10.4 but became
    weakly active or silent at pH 5.5; at 10.4 one was slow and weakly triphasic while the other
    kept a strong triphasic rhythm.
  source: Results, The pyloric rhythm is surprisingly robust to extreme changes in pH, paragraph
    4; Figure 3A
  quote: >-
    Both preparations displayed robust activity across a nearly 125-fold range of hydrogen
    ion concentration but became weakly active or silent at pH 5.5. At pH 10.4, STG #2 was slow
    and weakly triphasic while STG #3 retained a strong triphasic rhythm
  criterion: The two preparations are not named in the paper or the code. With [STATE], reproduced
    when among the other 14 STG preparations there are two that are in state 1 or 2 for most of
    every step from 6.1 to 9.8 and in state 2, 3 or 4 for most of pH 5.5, one of them in state 2
    at 10.4 with a pyloric frequency ([EXT]) below its control, and the other in state 1 at
    10.4.
- id: fig3c-stg-rhythmic-fraction
  statement: Both acid and base significantly decreased the fraction of time STG preparations
    were rhythmic (normal or weak triphasic), and the rhythm was significantly less triphasic at
    pH 5.5 and 10.4 than at control.
  source: Results, The pyloric rhythm is surprisingly robust to extreme changes in pH, paragraph
    6; Figure 3C; Figure 3, figure supplement 1
  quote: Both acid and base significantly decreased the fraction of time that preparations were
    rhythmic, a combined metric of states 1 (normal triphasic) and 2 (weak triphasic) ... Preparations
    were significantly less triphasically rhythmic at pH 5.5 and pH 10.4 compared to control pH 7.8
  statistics:
  - about: effect of pH, acid and base protocols separately
    test: Univariate Type III Repeated-Measures ANOVA
    p: 0.05
    p_relation: "<"
    n: 15 STG preparations
  - about: pH 5.5 and pH 10.4 against control 7.8
    test: paired samples t-tests
    p: 0.05
    p_relation: "<"
    corrected: Bonferroni
    n: 15 STG preparations
  expected:
    quantity: STG preparations
    value: 15
    tolerance: 0
  criterion: Per preparation fraction of time rhythmic in the last 8 min of each step ([STATE]),
    tested with [RM]. Reproduced when both ANOVAs have p < 0.05 and the corrected paired t-tests
    at 5.5 and at 10.4 have p < 0.05 with lower fractions than control. The steps where the
    paper reports no significant difference are reported.
- id: stg-state-transitions
  statement: Pyloric rhythms rarely moved back and forth between two states, and usually went
    from normal triphasic to weak triphasic to intermittent triphasic to silent, in the reverse
    order during recovery.
  source: Results, The pyloric rhythm is surprisingly robust to extreme changes in pH, paragraph
    6
  quote: Rhythms rarely transitioned intermittently between two states ... The pyloric rhythm
    often transitioned from normal triphasic to weak triphasic to intermittent triphasic to all
    silent. During recovery, this transition pattern was reversed
  criterion: From the [STATE] annotation of the whole recording of each of the 15 STG
    preparations (transitions need not fall in the last 8 min). The paper gives no count or
    test. A reversal is a transition, during an acid or base step protocol, from a state to a
    lower-numbered state among 1 to 4 (toward normal), or during a recovery, to a
    higher-numbered one. Open are "rarely" and "often"; readings (a) reversals under 10% of all
    transitions among states 1 to 4 and at least half of the transitions in step protocols go
    to the next state in the order 1, 2, 3, 4; (b) the same with 20% and with a plurality.
    Reproduced when one reading holds; the counts are reported.
- id: fig3d-stg-frequency
  statement: Mean pyloric burst frequency did not vary significantly across acid steps but did
    across base steps, being significantly slower than control at pH 9.3 and 10.4.
  source: Results, The pyloric rhythm is surprisingly robust to extreme changes in pH, paragraph
    7; Figure 3D; Figure 3, figure supplement 1
  quote: Mean pyloric burst frequency was relatively invariant across pH values in the presence
    of acid, but varied significantly across base steps ( Figure 3D ). Pyloric burst frequency at
    pH 9.3 and 10.4 was significantly slower than that at control
  statistics:
  - about: effect of pH, base protocol
    test: Univariate Type III Repeated-Measures ANOVA
    p: 0.05
    p_relation: "<"
    n: 15 STG preparations
  - about: pH 9.3 and pH 10.4 against control 7.8
    test: paired samples t-tests
    p: 0.05
    p_relation: "<"
    corrected: Bonferroni
  criterion: Per preparation PD burst frequency ([EXT]), tested with [RM]. The acid part is a
    claim of absence, judged on the acid ANOVA at alpha 0.05 as the paper ran it. Reproduced
    when the acid ANOVA has p >= 0.05, the base ANOVA p < 0.05, and the corrected paired t-tests
    at 9.3 and 10.4 have p < 0.05 with lower frequency than control. Effect sizes (mean
    differences) are given for every step.
