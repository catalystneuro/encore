  quote: At extreme acid, the mean PD neuron membrane potential depolarized significantly, while
    the mean LP neuron membrane potential remained relatively constant ... In contrast, the PD
    neuron's membrane potential in basic saline was relatively constant, even at extreme base,
    but the LP neuron's membrane potential significantly hyperpolarized. The depolarization of PD
    at pH 5.5 and 6.1 and the hyperpolarization of LP at pH 8.8, 9.3, 9.8, and 10.4 were
    significantly different from control saline
  statistics:
  - about: PD in acid and LP in base, effect of pH
    test: Univariate Type III Repeated-Measures ANOVA
    p: 0.05
    p_relation: "<"
    n: PTX preparations (9 in pHCumulativePTX.m)
  - about: PD at 5.5 and 6.1, LP at 8.8, 9.3, 9.8 and 10.4, against control 7.8
