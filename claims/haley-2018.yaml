    criterion; the code marks it as state 8.x in the manual STG annotation (pHCumulative.m).
    Open is the window searched; readings (a) the whole of each step and recovery, (b) the last
    8 min of each, as for states. Each count is made under both readings, from the 8.x codes if
    the dataset holds them, otherwise from rhythmic LG bursting (lgn or lvn) with alternating
    DG bursting (dgn) where recorded.
- id: gastric-conditions-co-occur
  statement: Preparations that showed gastric rhythms in one of the four conditions were likely
    to show gastric-like activity in the others.
  source: Results, Rhythmic gastric-like activity was elicited upon exposure to and recovery from
    extreme acid and base, paragraph 2
  quote: Preparations in which gastric rhythms were seen in one of these conditions were likely
    to display gastric-like activity in the other conditions
  depends_on:
  - gastric-like-rhythm-counts
  criterion: From the per-preparation presence of a gastric-like rhythm in the four conditions
    of gastric-like-rhythm-counts. The paper gives no test. Open is how "likely" is judged;
    readings (a) for each pair of conditions, the fraction of preparations with the rhythm in
    the second condition is higher among those with it in the first than among those without;
    (b) a Fisher exact test of each pair with p < 0.05. Reproduced when reading (a) holds for
    at least five of the six pairs; reading (b) is reported.
- id: fig5-gastric-recovery-example
  statement: In an example preparation recovering in control saline after silence at pH 5.5,
    gastric and pyloric activity grew over 20 min; LG bursts coincided with LP hyperpolarization,
    and strong MCN1 bursts on the ion went with LG and GM bursts that alternated with DG bursts,
    like the MCN1/CPN2 gastric mill rhythm.
  source: Results, Rhythmic gastric-like activity was elicited upon exposure to and recovery from
    extreme acid and base, paragraphs 3 to 5; Figure 5
  quote: Strong LG neuron bursts were timed with hyperpolarizations of the LP neuron ... We see
    similar activity here with strong MCN1 bursts on the ion corresponding to strong LG and GM
    bursts on the lgn and dgn , respectively, in alternation with DG bursts on the dgn
  criterion: The example is not named in the paper or the code. Reproduced when an STG
    preparation with lgn, dgn and ion recordings, silent at the end of pH 5.5, shows in the first
    20 min of the following control step LG bursts during which the LP membrane potential is
    lower than between them, MCN1 bursts on the ion overlapping LG and GM bursts, and DG bursts
    falling between GM bursts. The comparison of LP potential during and between LG bursts is a
    reading of "timed with", named here.
- id: fig6-cg1-measures
  statement: In the example cardiac ganglion, the rhythm persisted over the whole pH range;
    cardiac frequency decreased in acid and increased in base, LC spikes per burst increased in
    acid, and LC duty cycle decreased slightly in acid and in base.
  source: Results, The cardiac rhythm is robust to acute changes in pH, paragraphs 1 and 2; Figure
    6A to 6D
  quote: >-
    The cardiac frequency of CG #1 decreased in acid and increased in base ( Figure 6B ).
    Further, the number of LC spikes per burst increased in acid ( Figure 6C ) while the LC duty
    cycle for CG #1 decreased slightly in acid and base ( Figure 6D ). Similar to STG #1, CG #1
    retained robust activity throughout the entire range of pH tested
  criterion: On 877_149 unit CG2L (CG 1, pHCumulative.m), the 48 bin means per step of [EXT].
    The paper gives no test; the same readings as fig2bcd-stg1-measures, (a) extreme step
    against the control just before the protocol, (b) sign of the Spearman correlation of step
    means with pH. Reproduced when, under one reading, frequency is lower in acid and higher in
    base, LC spikes per burst higher in acid, duty cycle lower in both, and the preparation is
    in CG state 1 ([STATE]) for most of every step.
- id: fig6a-cg2-less-rhythmic
  statement: A second example cardiac ganglion became less rhythmic at pH 5.5 and at pH 9.8 and
    above, and recovered a normal bursting rhythm in control saline.
  source: Results, The cardiac rhythm is robust to acute changes in pH, paragraph 1; Figure 6A
  quote: >-
    In contrast, the cardiac rhythm in CG #2 became less rhythmic in pH 5.5 and in pH 9.8 and
    above. A normal bursting rhythm recovered after superfusion of control saline
  criterion: The example (acid-first) is not named in the paper or the code. Reproduced when among
    the acid-first CG preparations other than 877_149 CG2L one has a fraction of time in state 1
    ([STATE]) below its control at 5.5, 9.8 and 10.4, at or near its control from 6.1 to 9.3,
    and back to state 1 for most of the final recovery.
- id: fig7b-cg-rhythmic-fraction
  statement: Acid and base both significantly affected the fraction of time cardiac preparations
    were rhythmic (SC and LC bursting together), which was significantly lower at pH 5.5, 9.3, 9.8
    and 10.4 than at control.
  source: Results, The cardiac rhythm is robust to acute changes in pH, paragraph 3; Figure 7B;
    Figure 7, figure supplement 1
  quote: The mean fraction of time that preparations were rhythmic (state 1 - SC and LC bursting)
    was significantly affected by both acid and base ( Figure 7-figure supplement 1 ). Rhythmic
    activity was significantly decreased at pH 5.5, pH 9.3, pH 9.8, and pH 10.4 compared to
    control pH 7.8
  statistics:
  - about: effect of pH, acid and base protocols separately
    test: Univariate Type III Repeated-Measures ANOVA
    p: 0.05
    p_relation: "<"
    n: 15 CG preparations
  - about: pH 5.5, 9.3, 9.8 and 10.4 against control 7.8
    test: paired samples t-tests
    p: 0.05
    p_relation: "<"
    corrected: Bonferroni
  criterion: Per preparation fraction of time in CG state 1 ([STATE]), tested with [RM].
    Reproduced when both ANOVAs have p < 0.05 and the four named corrected t-tests have p < 0.05
    with lower fractions than control; partially reproduced when the ANOVAs hold and two or
    three of the t-tests do.
- id: cg-state-transitions
  statement: The cardiac rhythm usually went from SC and LC bursting to SC bursting only to
    silent, and in the reverse order during recovery.
  source: Results, The cardiac rhythm is robust to acute changes in pH, paragraph 3
  quote: The cardiac rhythm usually transitioned from SC and LC bursting to SC bursting only to
    all silent. This transition pattern was reversed during recovery
  criterion: From the [STATE] annotation of the whole recording of each CG preparation. The paper
    gives no count. Reproduced when, of the transitions among states 1 to 3 during step
    protocols, more go one step in the order 1, 2, 3 than any other way, and during recoveries
    more go one step in the order 3, 2, 1. Open is "usually"; readings (a) a plurality, (b) more
    than half. The counts are reported.
- id: fig7c-cg-frequency
  statement: Cardiac rhythm frequency declined in both acidic and basic saline and was
    significantly slower at pH 10.4.
  source: Results, The cardiac rhythm is robust to acute changes in pH, paragraph 4; Figure 7C;
    Figure 7, figure supplement 1
  quote: Cardiac rhythm frequency declined in both acidic and basic saline ( Figure 7C ; Figure
    7-figure supplement 1 ). At pH 10.4, the cardiac rhythm was significantly slower
  statistics:
  - about: pH 10.4 against control 7.8
    test: paired samples t-test
    p: 0.05
    p_relation: "<"
    corrected: Bonferroni
    n: 15 CG preparations
  criterion: Per preparation LC burst frequency ([EXT]), tested with [RM]. The text does not say
    whether the acid ANOVA was significant; it cites the table for the decline in both. Readings
    (a) both ANOVAs p < 0.05; (b) the base ANOVA p < 0.05 and the mean at 5.5 below the acid
    control. Reproduced when under one reading the corrected t-test at 10.4 has p < 0.05 with
    lower frequency than control.
- id: fig7d-cg-spikes-per-burst
  statement: Acid and base both significantly affected LC spikes per burst, which increased
    significantly at pH 5.5 and 6.1 and decreased at pH 9.8 and 10.4.
  source: Results, The cardiac rhythm is robust to acute changes in pH, paragraph 4; Figure 7D;
    Figure 7, figure supplement 1
  quote: The mean number of LC spikes per burst was significantly affected in both acid and base (
    Figure 7D ). The number of LC spikes per burst was significantly increased at pH 5.5 and pH
    6.1 and decreased at pH 9.8 and pH 10.4
  statistics:
  - about: effect of pH, acid and base protocols separately
    test: Univariate Type III Repeated-Measures ANOVA
    p: 0.05
    p_relation: "<"
    n: 15 CG preparations
  - about: pH 5.5, 6.1, 9.8 and 10.4 against control 7.8
    test: paired samples t-tests
    p: 0.05
    p_relation: "<"
    corrected: Bonferroni
  criterion: Per preparation LC spikes per burst ([EXT]), tested with [RM]. Reproduced when both
    ANOVAs have p < 0.05 and the four named corrected t-tests have p < 0.05 in the stated
    directions; partially reproduced when the ANOVAs hold and two or three t-tests do.
- id: fig7e-cg-duty-cycle
  statement: Base, but not acid, had a significant effect on LC duty cycle.
  source: Results, The cardiac rhythm is robust to acute changes in pH, paragraph 4; Figure 7E;
    Figure 7, figure supplement 1
  quote: There was a significant effect of base but not acid on mean LC duty cycle
  statistics:
  - about: effect of pH, base protocol
    test: Univariate Type III Repeated-Measures ANOVA
    p: 0.05
    p_relation: "<"
    n: 15 CG preparations
  criterion: Per preparation LC duty cycle ([EXT]), tested with [RM]. Reproduced when the base
    ANOVA has p < 0.05 and the acid ANOVA p >= 0.05 (absence, judged on that ANOVA); the effect
    sizes are reported.
- id: fig7s2-cg-control-variability
  statement: Cardiac frequency, LC spikes per burst and LC duty cycle vary widely between
    preparations at control pH, independent of pH.
  source: Results, The cardiac rhythm is robust to acute changes in pH, paragraph 5; Figure 7,
    figure supplement 2
  quote: We plotted the distributions for all CG preparations at baseline and noted highly
    variable cardiac rhythm activity independent of the pH perturbation
  criterion: As fig3s2-stg-control-variability, on the 15 CG preparations, with the same readings
    (a) and (b).
- id: fig8a-ganglion-difference
  statement: The fraction of time with a normal rhythm peaks near control in both ganglia, but the
    CG is more sensitive to extreme base and the STG to extreme acid; pH, ganglion and their
    interaction all had significant effects in both acid and base, and the pyloric rhythm was
    significantly less rhythmic than the cardiac at pH 5.5 and more rhythmic at pH 9.3 and 9.8.
  source: Results, The cardiac and pyloric rhythms are differentially sensitive to pH, paragraph
    1; Figure 8A; Figure 8, figure supplement 1
  quote: Interestingly, these distributions are asymmetrical, as the CG was more sensitive to
    extreme base whereas the STG was more sensitive to extreme acid. There were significant main
    effects of pH and ganglion as well as an interaction between pH and ganglion on rhythmicity in
    both acidic and basic solutions ... The pyloric rhythm was significantly less rhythmic at pH
    5.5, but significantly more rhythmic at pH 9.3 and 9.8 compared to the cardiac rhythm
  statistics:
  - about: main effects of pH and ganglion and their interaction, acid and base separately
    test: Type III Mixed-Measures ANOVA
    p: 0.05
    p_relation: "<"
    n: 15 STG and 15 CG preparations
  - about: STG against CG at pH 5.5, 9.3 and 9.8
    test: independent samples t-tests
    p: 0.05
    p_relation: "<"
    corrected: Bonferroni
  depends_on:
  - fig3c-stg-rhythmic-fraction
  - fig7b-cg-rhythmic-fraction
  criterion: Per preparation fraction of time rhythmic ([STATE]) for both ganglia, tested with
    [MIX] under readings (a) and (b) of its contrast coding. Reproduced when, under one reading,
    all six effects (pH, ganglion, interaction; acid and base) have p < 0.05 and the corrected
    t-tests show the STG lower at 5.5 and higher at 9.3 and 9.8 (p < 0.05 each). Partially
    reproduced when the three t-tests hold but some ANOVA effect does not.
- id: fig8b-individual-preparations
  statement: All preparations were rhythmic at control; 14 of 15 STG preparations stopped firing
    after 15 min at pH 5.5, only 6 of 15 CG preparations lost rhythmic activity at pH 5.5, and 3
    of 15 CG preparations kept a normal rhythm in every pH condition.
  source: Results, The cardiac and pyloric rhythms are differentially sensitive to pH, paragraph
    2; Figure 8B
  quote: All preparations were rhythmically bursting at control pH ... However, 14 of 15 STG
    preparations ceased firing after 15 min of exposure to pH 5.5. In contrast, only 6 of 15 CG
    preparations showed reductions in rhythmic activity at pH 5.5. Three of 15 CG preparations
    maintained a normal rhythm in every pH condition
  expected:
  - quantity: STG preparations that ceased firing at pH 5.5
    value: 14
    tolerance: 1.4
  - quantity: CG preparations with reduced rhythmic activity at pH 5.5
    value: 6
    tolerance: 0.6
  - quantity: CG preparations with a normal rhythm in every pH condition
    value: 3
    tolerance: 0.3
  criterion: Tolerances are 10% of each count. From [STATE] in the last 8 min of each step. Open
    readings, each count made under all of them. "Ceased firing" (a) STG state 4 at the end of
    the pH 5.5 step, (b) no PD bursts in the last minute of the step ([EXT]), (c) fraction
    rhythmic 0 over its last 8 min. "Reductions in rhythmic activity" (a) CG fraction in state 1
    at 5.5 below 1, (b) below the preparation's control value. "Every pH condition" (a) all 13
    conditions including recoveries, (b) the three conditions of Figure 8B (5.5, control,
    10.4). "Rhythmically bursting at control" (a) fraction rhythmic 1, (b) at least 0.5, in the
    control before the acid steps. Figure 8B's STG control column is the recovery from acid in
    pHCumulative.m (column 1) and the CG control column is the control before acid (column 6);
    both are shown. Reproduced when each count is within tolerance under one reading and the
    control condition holds.
- id: fig8b-cross-predictive
  statement: STG preparations with reduced activity in base were very susceptible to loss of
    activity in extreme acid, while in the CG it was the reverse, activity in acid predicting
    activity in base.
  source: Results, The cardiac and pyloric rhythms are differentially sensitive to pH, paragraph
    2; Figure 8B
  quote: Interestingly, STG preparations that showed decrements in activity during basic
    conditions were extremely susceptible to reductions in activity during extreme acid. The
    opposite is true in CG preparations suggesting that activity in base is a better predictor of
    acid activity in the STG and vice versa in the CG
  depends_on:
  - fig8b-individual-preparations
  criterion: Per preparation fraction rhythmic at pH 5.5 and 10.4 ([STATE]), as in Figure 8B.
    The paper gives no test. Readings of the claim (a) every STG preparation with a fraction
    below 1 at 10.4 has fraction 0 at 5.5, and every CG preparation with a fraction below 1 at
    5.5 has a fraction below 1 at 10.4, while the reverse implication fails in each ganglion for
    at least one preparation; (b) in each ganglion, a Fisher exact test of the 2 by 2 table
    (reduced at 5.5, reduced at 10.4; reduced meaning below 1) is reported with its counts.
    Reproduced when reading (a) holds; the tables of (b) are shown.
- id: baseline-frequency-correlations
  statement: Frequency at control correlates strongly with frequency in extreme acid and in
    extreme base for PD neurons, and LC frequency at control correlates strongly with LC frequency
    in extreme acid but not in extreme base.
  source: Results, The cardiac and pyloric rhythms are differentially sensitive to pH, paragraph 3
  quote: Furthermore, strong correlations are found between baseline frequency and frequency in
    extreme acid or base for PD neurons. Strong correlations are also found between baseline LC
    frequency and LC frequency in extreme acid, but not in extreme base
  criterion: No figure, test or coefficient is given. Per preparation frequency ([EXT]) at the
    control just before each protocol and at 5.5 and at 10.4. Open readings (a) the PD data are
    the 15 extracellular STG preparations, (b) the 9 PTX preparations (PD burst frequency of
    [INTRA]); correlation (a) Pearson, (b) Spearman; "strong" (a) positive with p < 0.05, (b) r
    of at least 0.7. Reproduced when, under one combination, both PD correlations and the LC
    acid correlation are strong and the LC base correlation is not. All combinations are shown.
- id: robust-6-1-to-8-8
  statement: Both the pyloric and cardiac rhythms remained robust from about pH 6.1 to pH 8.8.
  source: Discussion, paragraph 2 (also Abstract); Figures 3C and 7B
  quote: it is surprising that the central pattern generating rhythms of both the STG and the CG
    of the crab, C. borealis , are relatively insensitive to acute pH change from about pH 6.1 to
    pH 8.8
  depends_on:
  - fig3c-stg-rhythmic-fraction
  - fig7b-cg-rhythmic-fraction
  criterion: A claim of absence, judged on the paper's own tests. In [RM] of fraction of time
    rhythmic ([STATE]) for each ganglion, reproduced when no corrected paired t-test at 6.1, 6.7,
    7.2, 8.3 or 8.8 shows a significant decrease from control (p < 0.05), as in the Results
    (STG differs at 5.5 and 10.4 only; CG at 5.5, 9.3, 9.8 and 10.4); not reproduced when any
    does. The mean fractions at each step are reported.
- id: intact-depolarize-in-acid
  statement: In intact (no PTX) preparations both PD and LP neurons depolarized in acid, unlike
    the semi-isolated neurons where only PD did.
  source: Discussion, paragraph 5
  quote: In intact preparations, we observed depolarization in acid for both neurons, suggesting
    an important role of circuit connectivity in regulating network activity across pH
  criterion: No figure or test is given. On the intact STG preparations with intracellular PD and
    LP recordings, the minimum membrane potential of [INTRA] (last minute of each step), tested
    with [RM] on the acid protocol as for fig4bc-membrane-potential. Open is what "depolarized
    in acid" requires; readings (a) the acid ANOVA p < 0.05 and a higher mean at 5.5 than
    control for each neuron, (b) a higher mean at 5.5 than control in most preparations for each
    neuron. Reproduced when one reading holds for both PD and LP.
