- id: fig3f-stg-duty-cycle
  statement: Acid and base both significantly affected PD duty cycle, with a slight increase from
    control pH 7.8 to pH 6.1.
  source: Results, The pyloric rhythm is surprisingly robust to extreme changes in pH, paragraph
