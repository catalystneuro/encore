# Claims for Allen, Yan, Kuan et al. (2026), Communications Biology 9:229, "Neurometabolic
# rewiring in squid (Sepioteuthis lessoniana) optic lobes drives behavioral plasticity and visual
# integration under environmental acidification", on Dryad dataset doi:10.5061/dryad.rjdfn2zqz.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-25,
# protocol pilot-19 as stated in docs/protocol.md.
#
# Text read: the version of record (Communications Biology PDF, uploaded by Ben Dichter), its
# extracted text with the main text, Methods, figure legends and the one supplement PDF
# (Supplementary Figures 1 to 5 and Supplementary Tables 1 to 5). Figure pages 3, 7, 8, 9 and 10
# of the PDF were opened only to read the significance letters of Figures 1B to 1F, 2D and 2H and
# the axes of Figure 3C and 3D. The supplementary data files the Methods name ("Supplementary
# data: DET Results" and "GSEA results") are not under paper/; only the claim
# chronic-nachr-subunits-down rests on them.
#
# Code read: none. The paper links no code repository. Its Data availability says the
# bioinformatics code and "custom scripts, if any" are in the Dryad deposit itself, which the
# reader does not open; statistics were run in GraphPad Prism v10.2.3 and R v4.3.2 (logistic
# regression). Where the deposit's scripts fix a detail left open here, the author may take it
# from them, citing the file.
#
# The dataset. Dryad title "Physiological and behavioral dataset of squid exposed to ocean
# acidification". By the paper's Data availability it holds the raw physiological data
# (metabolic rates, ammonia excretion rates, blood acid-base parameters), the behavioral tracking
# data, the ERG recordings, the carbonate chemistry calculations and the bioinformatics code. The
# RNA-seq reads are in NCBI SRA BioProject PRJNA1204452 and the assembled transcriptome in NCBI
# TSA GLBY00000000 (version GLBY01000000), so the transcriptomic claims are data elsewhere.
#
# Data the paper used. Lab-reared bigfin reef squid (S. lessoniana), three groups: control (reared
# 90 days at pH 8.2), acute-OA (reared 90 days at pH 8.2, then 7 days at pH 7.8) and chronic-OA
# (reared 90 days from hatching at pH 7.8); four replicate tanks per condition, animals sampled
# across tanks (Methods). Measured, per squid:
# - Routine metabolic rate (closed respirometry, umol O2 per g fresh mass per h; n = 8 to 12 per
#   group, 29 in all by the ANOVA df) and ammonia excretion rate (separate squid; 30 and 60 min
#   water samples; n = 5 to 9, 21 in all), Fig. 1B and 1C, Supplementary Table 1.
# - Blood pH and total CO2, from which PCO2 and [HCO3-] are derived (Eqs. 1 and 2; n = 7, 6 and 9
#   in Supplementary Table 2, while the Fig. 1 legend says 7 to 9), Fig. 1D to 1F.
# - 3-D tracking (X, Y, Z every 0.1 s) of a 10 min exploration of a 60 x 20 x 22 cm arena (control
#   15, acute 8, chronic 11 squid by Fig. 2A, Supplementary Fig. 2 and the ANOVA df; the Fig. 2B
#   legend and Supplementary Fig. 1 give 9 acute squid), with mantle length, Fig. 2C to 2F.
# - Predator-prey assay after the partition is lifted (10 min max): attack or not (46 control, 36
#   acute, 22 chronic squid, from both 2-D and 3-D tracking runs), hunt duration and strike
#   attempts of those that attacked (29, 8 and 8), Fig. 2G to 2I; prey shrimp velocity at 10 and
#   20 min (control n = 8, CO2 n = 11), Supplementary Fig. 3.
# - ERG to flicker (white LED, 200 ms on and 200 ms off, 5 s per frequency, 4 kHz sampling),
#   maximum response frequency per stimulus frequency (Fig. 3C, n = 8, 8, 9) and critical flicker
#   fusion frequency (Fig. 3D, n = 3 to 6 per group).
# - Optic lobe RNA-seq (control 4, acute 5, chronic 3), Fig. 4 and Supplementary Fig. 5.
# - Seawater chemistry, weekly, per condition (Supplementary Table 5); body mass and mantle length.
#
# Notes on the text that bear on several claims.
# - The "±" after means in the Results is not named as SD or SEM. The Fig. 2 legend says mean ±
#   SEM for Fig. 2H and 2I, but 262.2 ± 193.0 s over 8 squid only fits an SD. The blood values of
#   Supplementary Table 2 differ slightly in their spread from those of the Results (PCO2 control
#   234.087 against 229.5). Tolerances below are 10% of each mean: the ± values are the spread over
#   squid, not an uncertainty of the mean, and the attempt recomputes the means from the same
#   squid. Both SD and SEM are to be reported.
# - Supplementary Table 3 labels the left-zone and front-zone ANOVAs "Y=log(Y)", but their sums of
#   squares (residual mean squares 793.5 and 918.6) are on the scale of raw percentages; the
#   ammonia and hunt-duration ANOVAs labelled log(Y) have sums of squares on a log10 scale.
# - The Results cite "Fig. 3E" and "Fig. 3F" for the left and front zone durations; these are Fig.
#   2E and 2F.
# - The Methods say the footage was recorded at five frames per second and that coordinates were
#   recorded every 0.1 s; the Fig. 2B legend counts 6,000 observations per squid (10 per s).
