# Claims for Nakagawa et al. (2026), "Early dopamine disruption in the entorhinal cortex of a
# knock-in model of Alzheimer's disease", Nature Neuroscience (doi:10.1038/s41593-026-02260-w),
# on dandiset 001968.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record (open access, CC BY), as served by Europe PMC (PMC13246448),
# in paper/10.1038-s41593-026-02260-w.txt: main text, figure legends, Methods, Extended Data
# Fig. 1 to 10 legends, and the supplement PDF (Supplementary Figs. 1 to 11 and Supplementary
# Tables 1 to 4) extracted to text. Supplementary Table 1 (statistics) is garbled in the text and
# its pages 14 to 18 were read from the supplement PDF. The main article PDF was not supplied, so
# the figures themselves were not seen; numbers shown only in figure panels are not available
# here. The reporting summary and source data were not supplied and were not read.
#
# Methods by reference. The Methods describe behavioral performance, spike sorting, PCA,
# shuffle, similarity index, bootstrapping and photometry as "previously described" in their
# ref. 16 (Lee et al. 2021, Nature 598, 321, doi:10.1038/s41586-021-03948-8). The Methods of
# that paper (author manuscript, PMC8744500, read through the PMC BioC service) were read for
# those steps only, and are cited below as "ref. 16".
#
# Code. The Code availability statement says "standard functions in MATLAB" were used and that
# analytical codes are at https://www.igarashilab.org/resource. That page (read 2026-10-21) links
# a Box folder "matlabCodes" with three files, analyze4LinearTracks.m, analyzePopulationVector.m
# (header dated 05/20/2021) and boxSpikeInfo3.m, and a zip of 110 hippocampal neurons
# (Igarashi_remapping_data.zip). These belong to the 2021 place cell remapping protocol (the
# paper's ref. 39) and compute spatial rate maps and population vector correlations on linear
# tracks. None of them covers the odor task, cue responses, PCA trajectories, similarity index,
# bootstrap, decoding or photometry of this paper; Box gives no commit or version. So no method
# detail below is settled by code.
#
# The dandiset. Its title is the paper's title; its description says only that it holds "data
# associated with" the paper. Its archive summary lists mouse, an electrophysiological approach,
# spike sorting, NWB, and 37 subjects. It is read here as meant to hold the tetrode recordings of
# LEC L2/3 units (Fig. 2, Extended Data Figs. 3 to 9, Fig. 6d to i), possibly with the task
# events of those sessions. Whether it also holds behavior of other mice, photometry or
# histology is the author's to find; claims on those data are written all the same.
#
# Data the paper used, as it reports them.
# - Mice. Homozygous APP NL-G-F knock-in mice (APP-KI) and APP WT/WT C57BL/6 controls (WT);
#   young 3 to 6 months, old 7 to 11 months; 12 to 13 months for histology. Photometry and
#   optogenetics used APP-KI x DAT-Cre mice and DAT-Cre controls; PS19 mice for one L-DOPA test.
#   Animal IDs, sex and procedure per mouse are in Supplementary Table 2.
# - Task. Head-fixed olfactory go/no-go task. Prelearned Odor-A (isoamyl acetate, lick for
#   sucrose) and Odor-B (alpha-pinene, withhold licking to avoid quinine). Each day an AB-only
#   session of about 20 trials, then an AB12 session of 160 trials with a novel rewarded Odor-1
#   (C, E or G) and a novel punished Odor-2 (D, F or H), in random order every 18 to 22 s; A and
#   B 20% each, 1 and 2 30% each. Delay of 2 s between odor and the response window; licking in
#   the delay aborts the trial. Timepoints T1 to T5 within the session; T1 first 10 trials, T3
#   middle 10, T5 last 10 (Fig. 2d legend); T1 also split into T1a (trials 1 to 3), T1b (4 to 6)
#   and T1c (7 to 9). Behavioral T5 is trials 121 to 160. A session is correct when percent
#   correct in T5 exceeds 80%, an error session otherwise.
# - Units. Tetrode drives (64 channels) in right LEC, layer 2/3 (+-200 um of putative L2).
#   Young: 479 neurons from 5 WT mice and 846 from 5 APP-KI mice; putative principal cells
#   (peak-trough width > 230 us, > 100 spikes in a session) 423 and 636; putative interneurons
#   56 and 210. Per mouse principal cells (Supplementary Fig. 2): WT #00364 95, #00375 48,
#   #00390 130, #01398 112, #01431 38; APP-KI #00789 125, #01199 52, #01253 271, #01254 89,
#   #01517 99 (97 in the Extended Data Fig. 3b legend). Correct and error sessions for young
#   WT 352 and 71 cells, young APP-KI 411 and 225 cells (Supplementary Table 1). Old: 671 cells
#   (WT) and 618 cells (APP-KI). L-DOPA: 144 cells from 4 L-DOPA mice and 132 from 4 saline
#   mice, all APP-KI (Supplementary Table 1 prints 132 for both). Tetrodes were moved 40 to
#   80 um between sessions, so each session holds new cells.
# - Behavior. Young 11 WT and 16 APP-KI mice, old 11 WT and 14 APP-KI. Optogenetics 11 young
#   APP-KI x DAT-Cre mice, stimulation on Odor-1 trials (473 nm, 5 s from Odor-1 onset then a
#   10 s taper), against no-laser sessions in the same mice. L-DOPA (50 mg/kg i.p., 30 min before
#   testing, 5 days) 9 mice, saline 8 mice; PS19 5 and 5; WT 4 and 4 (Supplementary Fig. 11
#   also says 5 L-DOPA WT mice).
# - Photometry. GCaMP6m in VTA/SNc dopamine neurons, fibers in LEC; 10 hemispheres from WT
#   (DAT-Cre) and 8 from APP-KI x DAT-Cre mice.
# - Histology. Abeta immunostaining by age (4 mice per group), TH+ fiber density in LEC and TH+
#   cells in VTA/SNc (8 young WT, 8 young APP-KI, 6 old WT, 6 old APP-KI).
#
# Shared method, from the Methods, the legends, Supplementary Table 1 and ref. 16.
# - Behavioral performance (Methods; ref. 16). Hits (licks to A or 1) plus correct rejections
#   (no lick to B or 2), in a sliding window of 20 trials for the curves; percent correct in T5
#   from trials 121 to 160; averaged over all sessions of a mouse; mice are the units. Open,
#   with readings (B1) the trials of each odor pair that fall in session trials 121 to 160,
#   (B2) the last 40 trials of each odor pair. Whether aborted trials count is open; the reading
#   is that they count as trials of their odor, with their exclusion as a variant.
# - Correct session. Methods say "> 80%", Results say ">= 80%". Both are run; they differ only
#   for sessions at exactly 80%.
# - Timepoints for units. T1 is read as the first 10 trials of each odor type, T5 the last 10,
#   T3 the middle 10, since T1a to T1c (trials 1 to 3, 4 to 6, 7 to 9) count trials within an odor
#   type and cells from different sessions are pooled. T2 and T4 are not defined. Open, with
#   readings (T-a) 10-trial blocks of each odor type centered midway between T1 and T3 and
#   between T3 and T5, (T-b) each odor type's trials split into five equal blocks, with the
#   first, middle and last 10 trials for T1, T3 and T5 and the whole second and fourth blocks
#   for T2 and T4.
# - Spike response (Methods). Firing rates in 50 ms bins, Gaussian filter sigma 100 ms, z-scored
#   to the -1 to 0 s pre-odor baseline. A cell responds to an odor when its spike count 0.5 to
#   1.5 s after odor onset differs from the 1 s pre-odor count over the timepoint's 10 trials,
#   Wilcoxon signed-rank p < 0.05 (Supplementary Table 1, "Significance of LEC cell firing in
#   odor period", p<0.05; Extended Data Fig. 5 and Supplementary Fig. 3 say classification used
#   0.5 to 1.5 s). The P < 0.01 of Fig. 2b is the example cell's result, not a threshold. Open,
#   with readings for the direction (D+) increases only ("fired to"), (D+-) any change. Shown
#   as a variant, not judged: a response in any of the odor (0.5 to 1.5 s), delay (2 to 3 s) and
#   choice (3 to 4 s) periods, which the Methods list.
# - PCA (Methods; ref. 16). For each timepoint separately (ref. 16 reports explained variance per
#   timepoint), each cell's mean firing rate in 50 ms bins from -1 to 4 s after odor onset for
#   each of the four odor types, concatenated; normalized per neuron by subtracting the minimum
#   and dividing by the maximum; MATLAB pca with neurons as variables; PC1 and PC2 kept;
#   Euclidean distance between the trajectories of two odor types, averaged over 0.5 to 1.5 s.
#   Cells of all sessions and mice of a group are pooled. Open, with readings (N1) (x - min) /
#   max, (N2) (x - min) / (max - min); and (F1) firing rates smoothed as in Spike response,
#   (F2) unsmoothed binned rates.
# - Shuffle (Methods; ref. 16). Odor labels shuffled across trials, keeping the count of each
#   type; 1000 shuffles; the 95th percentile of the shuffle distances of each odor pair, averaged
#   over pairs, is the significance threshold. Supplementary Table 1 calls it "trial shift".
#   Open, with readings (S1) one permutation per session applied to all its cells, (S2) an
#   independent permutation per cell.
# - Similarity index (Methods). SI = -(real distance - mean shuffle distance) / mean shuffle
#   distance, the mean shuffle distance averaged across T1 to T5. Open, with readings (M1) the
#   mean shuffle distance of the odor pair itself (A-1), (M2) averaged over all six pairs.
# - Bootstrap (Methods). Neurons resampled with replacement, PCA and SI recomputed, 1000 times;
#   the difference of SIs between groups, bootstrap by bootstrap, is tested against 0, p < 0.05.
#   The Results call the test "maximum likelihood estimation". Open, with readings (BS1) a normal
#   distribution fitted to the differences by maximum likelihood, two-sided p of 0 under it,
#   (BS2) the empirical two-sided fraction of differences on the other side of 0.
# - Photometry (ref. 16). dF/F from the mean of the 1 s before cue, Gaussian filter sigma 200 ms,
#   z-scored to the 1 s before cue; mean per odor type and timepoint per hemisphere. The paper
#   gives two windows: (G1) 1 to 4 s after cue onset for the mean signals compared between
#   strains (Fig. 4d legend, Supplementary Fig. 6c), (G2) 2 to 4 s for the significance of the
#   signal against the precue (Supplementary Table 1, Wilcoxon signed-rank, p<0.05). Where a
#   claim's window is not one of these uses, both are readings; (G3) 0.5 to 3 s (ref. 16) is
#   shown as a variant only, since this paper gives its own windows.
# - Statistics. The ANOVAs are ordinary (not repeated measures) on per mouse, per hemisphere or
#   per session values, as their degrees of freedom show; Tukey post hoc; two-sided tests.
# - Readings, how they combine (docs/protocol.md, Reader, step 3). Readings of what a reported
#   number counts (B1, B2; the 80% session cut off; T-a, T-b; D+, D+-; the 39% denominator;
#   which G window a reported mean uses) are alternatives: the claim matches if it matches under
#   any of them. Readings of a method detail the paper leaves open (N1, N2; F1, F2; S1, S2; M1,
#   M2; BS1, BS2; the decoding readings; the SD of figs6d) must all be run: the outcome is the
#   one they all give, and when they give different outcomes the claim is blocked as
#   methods_underspecified, with every result shown. "Under the readings" in a criterion below
#   means this rule.
