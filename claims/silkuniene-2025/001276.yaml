# Claims for Silkuniene, Silkunas, Pakhomova, Semenov & Pakhomov (2025) on dandiset 001276.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-22,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the accepted author manuscript in PubMed Central (PMC12331426, NIHMS2087238), full
# text with Methods and figure legends, as fetched to paper/. The version of record was not read.
# PMC lists no supplement for this paper and the text cites none. No PDF was available, so the
# figures were not seen; numbers are taken from the text and legends only. The paper links no
# code ("Data will be made available on request"), so no code was read.
#
# Data the paper describes. Confluent monolayers of CT26 mouse colon carcinoma cells and CHO-K1
# cells in 6-well plates, stained with Hoechst 33342 before exposure (uniformity check) and with
# 1 uM YO-PRO-1 (YP) present during exposure, imaged 30 min later as stitched whole-well images
# (4x objective, FITC cube for YP, DAPI cube for Hoechst). In cell-killing experiments wells were
# also stained with propidium (Pr) 2 h after exposure (Cy3 cube). Four hollow needle electrodes
# (2.8 mm outer diameter) form a square with 15.3 mm side-to-side diagonals (Methods 2.2); 6 and
# 7 mm from the center along a diagonal are 1.65 and 0.65 mm from an electrode (Results 3.1). The
# dandiset's description gives an inter-electrode distance of 10.0 mm, which agrees with this
# geometry if read as the edge-to-edge distance along a side (10.0 + 2.8 = 12.8 mm between
# centers, 12.8 x 1.414 - 2.8 = 15.3 mm along the diagonal). Pulses are 600 ns (300 and 900 ns in
# Fig. 6), packets of 16 pulses (4.8 us), 9 packets per burst, bursts at 1 Hz, applied from 4
# directions ("1 burst (x4)" means 4 bursts in all). Controls deliver only the first pulse of each
# packet. Experimental series as the paper reports them.
#   Fig. 3 and 4, CT26, 2 bursts (x4), packet rates from 1 Hz to 0.2 MHz (0.208333 MHz, no gap
#     between packets); n = 3 per CANCAN rate, n = 5 controls. The Fig. 4C fit has n = 15 over
#     the rates below 0.2 MHz, so five such rates (1 Hz, 1 kHz and 10 kHz are named).
#   Fig. 5, CT26, 0.2 MHz, 2 bursts (x4), electrodes touching the monolayer or raised 1 or 2 mm;
#     YP n = 6 to 7, Pr n = 4 to 5.
#   Fig. 6, CT26, 0.2 MHz, 2 bursts (x4), packets of 300, 600 or 900 ns pulses (18, 9 or 6
#     packets, 43.2 us bursts); n = 5 per duration.
#   Fig. 7, CT26 (n = 3 to 5) and CHO (n = 4), 0.2 MHz, 600 ns, 1, 2, 4 or 6 bursts (x4).
# Measured variables are background-subtracted fluorescence intensities in ROIs at distances from
# the array center, in a.u. or in % of the center value. The dandiset's title and description
# (burst number varied over 1, 2, 4 and 6 at 0.2 MHz, 600 ns pulses, Hoechst and YP) match the
# Fig. 7 series; whether it holds other series, and which cell lines, is for the author to find.
#
# Shared method, cited by the criteria as "the profile method" (Methods 2.5 unless noted).
#   ROIs of 325 x 406 um are placed along the diagonals of the square, connecting the electrodes'
#   footprints; intensity is averaged in each ROI. Background is the mean of 3 ROIs placed inside
#   an electrode footprint, subtracted from every ROI. Measurements from the two diagonals are
#   pooled and form one experiment (Methods 2.5, Fig. 3B legend). Distance x is signed, from the
#   geometrical center of the array. Profiles are given as mean and s.e. over experiments.
#   The Lorentzian is YP(x) = a (b/2)^2 / (x^2 + (b/2)^2) with b the FWHM in mm, fitted to each
#   experiment's profile, and the FWHM values averaged (Results 3.1, Fig. 4C and 6D legends).
#   Since both diagonals share the same distances, fitting their mean or their pooled points
#   gives the same fit. The Pr profile is fitted with a Gaussian a exp(-x^2 / (2 sigma^2)), FWHM
#   about 2.4 sigma. FWHM in % of the gap is FWHM / 15.3 mm (1.7 mm is 11.1%, Results 3.3).
#   "Near electrodes" is 6 and 7 mm from the center toward an electrode (Results 3.1, Fig. 4B).
#   Significance of differences is by two-sided Student's t-test, with Bonferroni correction when
#   several comparisons are made, or by ANOVA, at p < 0.05.
# Details of the profile method that the paper leaves open.
#   The fit range. Methods 2.5 says the fitted range "was limited to 4-6 mm distances from the
#   center"; Fig. 3 used -4 to 4 mm, Fig. 5 and 6 used -5 to 5 mm; Fig. 7 does not say. Where a
#   figure does not fix it, the readings are -4 to 4, -5 to 5 and -6 to 6 mm.
#   The spacing of ROIs along the diagonal is not given. Readings, ROI centers every 1 mm from 0
#   to 7 mm (which includes the named 6 and 7 mm points) and every 0.5 mm.
#   The orientation of the 325 x 406 um ROI is not given; a standard choice (long side across
#   the diagonal) is used, as it cannot change an outcome at these scales.
#   How the center is located in an image is not given beyond "the geometrical center of the
#   electrode array"; it is the center of the four electrode footprints.
