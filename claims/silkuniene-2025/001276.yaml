- id: fig7be-center-linear-with-bursts
  statement: In both CT26 and CHO cells, YP uptake at the array center increases linearly with the
    number of bursts (slopes different from zero at p < 0.001), except for saturation at 6 bursts
    (x4) in CT26 cells.
  source: Results 3.4, paragraph 1; Figure 7B and 7E and legend
  quote: The increase was linear in both cell lines, except when it reached saturation after 6
    bursts (x4) in CT26 cells
  statistics:
  - about: CT26, linear fit of center YP on burst number, 6 bursts (x4) excluded
    test: 2-sided one-sample t test of the slope
    p: 0.001
    p_relation: "<"
    n: CT26, n = 3 to 5 experiments per burst number
  - about: CHO, linear fit of center YP on burst number
    test: 2-sided one-sample t test of the slope
    p: 0.001
    p_relation: "<"
    n: CHO, n = 4 experiments per burst number
  criterion: Center YP is the background-subtracted intensity of the ROI at 0 mm, by the profile
    method, in a.u. A linear fit of center YP on burst number (1, 2, 4, 6 bursts (x4)), with the
    6-burst point excluded in CT26 as the Fig. 7 legend says, and its slope tested against zero by
    a 2-sided one-sample t test (Fig. 7 legend). The paper does not say whether the fit is to
    individual experiments or to group means; the readings are (a) individual experiments and
    (b) group means. Burst number counted as 1, 2, 4, 6 or as 4, 8, 16, 24 total bursts gives the
    same p. Reproduced when, under one reading, both slopes are positive with p < 0.001;
    partially reproduced when that holds in one cell line only. A cell line absent from the
    dataset is reported as untested and the claim judged on the other.
