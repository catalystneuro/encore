  source: Results 3.3, paragraph 2; Figure 6C
  quote: When the peak YP emission was taken as 100%, its decline sideways was similar for the
    three tested pulse durations
  criterion: A claim of absence of a difference, for which the paper gives no test. Profiles in % of
    each group's center value, by the profile method. Judged by the tests Methods 2.5 names, a
    one-way ANOVA over the three durations at each distance with Bonferroni correction over the
    distances. Reproduced when no distance shows a difference at corrected p < 0.05; not
    reproduced when any does, with the distances and effect sizes reported. The finer
    per-experiment FWHM analysis of fig6d-fwhm-sharper-longer-pulses is a separate claim.
