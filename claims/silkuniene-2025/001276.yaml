    different from zero at p = 0.003 (one sample, 2-sided t -test). 900-ns pulse packets reduced
    FWHM to 1.7 ± 0.08 mm, that was 11.1 ± 0.6% of the gap between electrodes
  statistics:
  - about: slope of the fit of FWHM on pulse duration
    test: 2-sided one-sample t test
    p: 0.003
    n: 5 experiments per duration
  - about: 600 ns against 300 ns (read as the single asterisk)
    test: 2-sided t-test with Bonferroni correction
    p: 0.028
    corrected: Bonferroni
  - about: 900 ns against 300 ns (read as the double asterisk)
    test: 2-sided t-test with Bonferroni correction
    p: 0.0072
    corrected: Bonferroni
  expected:
