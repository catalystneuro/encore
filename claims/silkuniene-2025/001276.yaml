    the diagonal (the paper places reversible electroporation from about 2 mm out, Results 3.2,
    paragraph 3), and Hoechst intensity inside the footprint is above background.
- id: fig6b-900ns-peak-not-significant
  statement: The central YP peak is higher for 900 ns pulses, but its difference from 300 and 600
    ns pulses is not statistically significant.
  source: Results 3.3, paragraph 2; Figure 6B
  quote: The central peak of YP uptake was higher for 900-ns pulses, but the difference from the
    other two pulse durations was not statistically significant
  criterion: A claim of absence. CT26, 0.2 MHz, 2 bursts (x4), center YP (ROI at 0 mm) by the profile
    method, n = 5 per duration. The paper does not name the test; Methods 2.5 names ANOVA and
    two-sided t-tests with Bonferroni correction, and Fig. 6D compares each duration with 300 ns.
    Tests run, (a) 900 ns against 300 ns and against 600 ns by two-sided t-tests with Bonferroni
    correction for two comparisons; (b) one-way ANOVA over the three durations. Reproduced when
    neither finds a difference at p < 0.05; not reproduced when both do; when they disagree,
    blocked as methods_underspecified with both shown. The 900 ns mean must be the highest for
    the first part of the statement; effect sizes are given.
- id: fig6c-normalized-decline-similar
  statement: Normalized to the central peak, the sideways decline of YP uptake looks similar for
