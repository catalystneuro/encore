- id: fig2-heating-below-44c
  statement: In the worst-case heating protocol (600-ns packets with no interval, 2 or 6
    bursts), temperature did not exceed 44 C even near the electrodes; it could exceed 30 C
    within about 2 mm of the electrodes after 2 bursts and even near the centre after 6
    bursts.
  source: Methods 2.3; Figure 2
  quote: Temperature could exceed 30 °C even near the center of the array, but did not exceed 44
    °C even near the electrodes
  criterion: Read from thermochromic film colour (black, red, green, blue, black at 25, 26, 30
