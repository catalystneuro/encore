- id: fig3-cancan-centre-enhancement
  statement: All CANCAN protocols enhance electroporation at the centre of the array, while in
    single-pulse controls YP uptake decreases gradually toward the centre.
  source: Results 3.1, paragraph 2; Figure 3A
  quote: All CANCAN protocols visibly enhanced electroporation at the center of the array, in
    contrast to its gradual decrease toward the center in the control
  criterion: Diagonal YP profiles per experiment (Fig. 3B; n=3 per CANCAN rate, n=5 controls).
    The statement is of a peak at the centre; the paper names no positions for this visual
    reading of Fig. 3A. Reproduced when, for every CANCAN packet rate, mean YP at 0 mm
    exceeds mean YP at 4 mm (the edge of the Lorentzian fit range, Fig. 3 legend and Results
    3.1), and in controls mean YP at 0 mm is below that at 4, 6 and 7 mm; each comparison read
    with the Methods' error-bar gap rule (a gap longer than the s.e. bars). Whether CANCAN YP
    at 0 mm also exceeds YP at 6 and 7 mm (the near-electrode positions of Fig. 4B) is shown
    per rate and not judged here, since the paper reports the near-electrode suppression as
    rate dependent (fig4b-suppression-near-electrodes).
- id: fig3-lorentzian-decline
  statement: Under CANCAN, the decline of YP emission from the centre is bell-shaped and well
    fitted by a Lorentzian within -4 to 4 mm (R > 0.9, p < 0.001).
  source: Results 3.1, paragraph 3; Figure 3B and 3C
  quote: The decline of YP emission sideways from the center was bell-shaped and followed
    Lorentzian distribution ... The fit correlation with data in the −4 to 4 mm radius was
    nearly perfect (R>0.9, p<0.001)
  statistics:
  - test: Lorentzian fit correlation
    statistic: R > 0.9
    p: 0.001
    p_relation: "<"
  criterion: The Methods' Lorentzian fitted to the mean diagonal and side-parallel profiles of
    each CANCAN rate over -4 to 4 mm. Reproduced when the correlation of fit with data
    exceeds 0.9 with p < 0.001 for every rate.
- id: fig4b-suppression-near-electrodes
  statement: Higher packet rates suppress YP uptake at 6 and 7 mm from the centre (near
    electrodes) in a rate-dependent way, so that at 0.2 MHz uptake in the centre is 40-fold
    larger than near electrodes despite a field of about 14 kV/cm there against 3.3 kV/cm in
    the centre.
  source: Results 3.1, paragraphs 2 and 4; Figure 4A and 4B
  quote: Now, by increasing the packet repetition rate to 0.2 MHz, we achieved a 40-fold
    difference
  expected:
  - quantity: ratio of centre YP to near-electrode YP at 0.2 MHz
    value: 40
    tolerance: 4
  criterion: Per experiment, background-subtracted YP at 0, 6 and 7 mm on the diagonals
    (Fig. 4B, n=3 per rate). The field values are the paper's simulation (Methods 2.2) and
    are not recomputed. The paper does not say which near-electrode distance or which ratio
    form gives 40; readings are 6 mm or 7 mm, and the ratio of means or the mean of
    per-experiment ratios. The rate dependence is judged as Fig. 4B shows it, a power
    function of packet rate fitted to the mean YP at 6 and at 7 mm, with a negative
    exponent, and 1 Hz above 0.2 MHz by the error-bar gap rule. Reproduced when both hold at
    6 and 7 mm and the ratio is within tolerance under one reading.
- id: fig4b-centre-no-rate-effect
  statement: YP intensity in the centre of the array shows no significant effect of packet
    rate.
  source: Results 3.1, paragraph 4; Figure 4B
  quote: YP intensity in the center showed no significant effect of the packet rate ( t -test
    with Bonferroni correction, Fig. 4B )
  criterion: A claim of absence, judged on the paper's test, two-sided t-tests with Bonferroni
    correction between packet rates of YP at 0 mm (n=3 per rate). The pairs compared are
    not stated; readings are each rate against 1 Hz (as in Fig. 4C) and all pairs.
    Reproduced when no corrected p is below 0.05 under either reading; not reproduced when
    some corrected p is below 0.05 under both; blocked as methods_underspecified when the
    readings differ. Effect sizes are reported.
