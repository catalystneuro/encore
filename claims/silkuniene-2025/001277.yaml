  - quantity: mean FWHM, 900-ns packets
    value: 1.7
    tolerance: 0.08
    unit: mm
  - quantity: mean FWHM as percent of the electrode gap, 900-ns packets
    value: 11.1
    tolerance: 0.6
    unit: "%"
  criterion: Mean over the n=5 experiments of per-experiment FWHM as in
    fig6d-longer-pulses-sharper-peak. The gap is the 15.3-mm diagonal (1.7/15.3 = 11.1%, and
