# Claims for Silkuniene, Silkunas, Pakhomova, Semenov & Pakhomov (2025) on dandiset 001277.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-22,
# protocol as stated in docs/protocol.md.
#
# Source: the accepted author manuscript in PubMed Central (PMC12331426, NIHMS2087238), full
# text as served by ncbi_pmc, read from its Methods, Results and figure legends. PMC lists no
# supplement and the text cites none. No PDF was stored, so the figures were not seen; numbers
# shown only in figures could not be read and are not claimed. The paper links no code (its
# Data availability says "Data will be made available on request"); analysis was done in
# MetaMorph 7.8.13, RStudio, Excel and Grapher 16, with no scripts given.
#
# Data the paper reports. Monolayers of CT26 mouse colon carcinoma cells (all experiments) and
# CHO-K1 cells (burst-number experiments only), in 6-well plates. Four hollow needle electrodes
# (2.8 mm outer diameter) in a square with 15.3-mm side-to-side diagonals, touching the dish
# bottom unless raised by 1 or 2 mm (Fig. 5). Each well was stained with Hoechst before
# exposure, exposed in 1 uM YO-PRO-1 (YP), incubated 30 min, rinsed and imaged as one stitched
# whole-well image (4x, FITC cube; Hoechst with DAPI cube). In cell-killing experiments the
# wells were also stained with propidium (Pr) 2 h later and imaged with a Cy3 cube, and
# re-imaged for Hoechst. Measured variable is the background-subtracted fluorescence in
# 325 x 406 um ROIs along the two diagonals (and in one set along lines through the centre
# parallel to the sides), with background from 3 ROIs inside an electrode footprint; one well
# (two diagonals pooled) is one experiment. Conditions are as follows. Packet repetition rate
# from 1 Hz to 0.208333 MHz, 600-ns pulses, 2 bursts (x4), with a single-pulse control (Figs 3
# and 4; n=3 per CANCAN group, n=5 controls; the text names 1 Hz, 1 kHz, 10 kHz and 0.2 MHz,
# and Fig. 4C counts 15 experiments over the rates below 0.2 MHz, so five rates, not all
# named). Electrode elevation 0, 1 and 2 mm with YP and Pr, 2 bursts (x4) at 0.2 MHz (Fig. 5;
# n=6-7 YP, n=4-5 Pr). Pulse duration 300, 600 and 900 ns, 18, 9 or 6 packets per 43.2-us
# burst with no interval, 2 bursts (x4) (Fig. 6; n=5 each). Number of bursts (x4) in CT26 and
# CHO cells (Fig. 7; n=3-5 and n=4; the text names 1, 2 and 6 bursts (x4)). First pulse in each
# packet 7.2 kV, later pulses 12.5% lower per phase. Thermometry with liquid crystal film
# (Fig. 2) and electric field simulation in Sim4Life (Fig. 1) are not cell data.
#
# The dandiset's archive title and description name the pulse-duration experiment (300, 600
# and 900 ns; 18, 9 or 6 packets; repeated twice at 1 Hz; Hoechst and YP), which is Fig. 6.
# Its description gives a 10 mm inter-electrode spacing where the paper gives a 15.3-mm
# diagonal; the author should check which geometry the files hold.
#
# Method details fixed by the paper and used in the criteria (Methods 2.5 unless stated). ROIs
# of 325 x 406 um on the diagonals; background is the mean of 3 ROIs in an electrode footprint,
# subtracted; the two diagonals pooled as one experiment; the Lorentzian
# YP(x) = a (b/2)^2 / (x^2 + (b/2)^2), centred at x = 0, with FWHM b; FWHM fitted per
# experiment and averaged (Results 3.1, 3.3); statistics by ANOVA and two-sided Student's
# t-test with Bonferroni correction when necessary, p < 0.05; error-bar gaps read as in
# Cumming et al. 2007 (a gap longer than the error bars means p < 0.05).
#
# Details the paper leaves open, with the readings named in the criteria. (1) The spacing of
# ROIs along a diagonal is not stated; the text names positions at 0, 6 and 7 mm. Readings
# are 1-mm steps from the centre, and contiguous ROIs (one ROI length per step). (2) Which side
# of the ROI lies along the diagonal (325 or 406 um), and which electrode footprint holds the
# background ROIs, are not stated; these are standard choices unlikely to change an outcome.
# (3) The fitted range differs by source; Methods say "limited to 4-6 mm", Results 3.1 and the
# Fig. 3 legend say -4 to 4 mm, the Fig. 5 and Fig. 6 legends say -5 to 5 mm. Readings are 4,
# 5 and 6 mm half-widths. (4) Whether the two diagonals are averaged at each signed distance
# before fitting, or all points fitted together. (5) The test for the Fig. 6B peak and the
# number of Bonferroni comparisons in Fig. 6D. (6) The trend in Fig. 6D is a "linear fit" in
# its legend and a "logarithmic fit" in Results 3.3.
schema_version: 2
dataset:
  archive: dandi
  id: "001277"
paper: doi:10.1016/j.bioelechem.2025.109016
claims:
- id: fig6b-peak-900ns-not-significant
  statement: The central peak of YP uptake is highest for 900-ns pulse packets, but its
    difference from 300- and 600-ns packets is not statistically significant.
  source: Results 3.3, paragraph 2; Figure 6B
  quote: The central peak of YP uptake was higher for 900-ns pulses, but the difference from the
    other two pulse durations was not statistically significant
  criterion: Per experiment (well, n=5 per pulse duration, Fig. 6B legend), the
    background-subtracted YP intensity at the centre ROI (0 mm), as in Methods 2.5. The paper
    does not name the test for this comparison; the Methods allow ANOVA or two-sided t-tests
    with Bonferroni correction, and the matching comparison at the array centre in Results
    3.1 (Fig. 4B) used t-tests with Bonferroni correction. Readings are (a) two-sided t-tests
    of 900 ns against 300 ns and against 600 ns, Bonferroni over the three pairwise
    comparisons, and (b) a one-way ANOVA over the three durations, each at p < 0.05. The
    claim of absence is reproduced when the test finds no significant difference and the
    900-ns mean is the highest; not reproduced when the test finds a difference. If (a) and (b)
    disagree the claim is blocked as methods_underspecified. The centre value from the
    Lorentzian fit (parameter a) is shown as a variant. Effect sizes are reported.
- id: fig6c-normalized-decline-similar
  statement: With the peak YP emission taken as 100%, the decline of YP emission away from the
    centre looks similar for 300-, 600- and 900-ns pulses.
  source: Results 3.3, paragraph 2; Figure 6C
  quote: When the peak YP emission was taken as 100%, its decline sideways was similar for the
    three tested pulse durations
  criterion: Per experiment, YP intensity along the diagonals divided by its value at 0 mm and
    expressed in percent; mean and s.e. over the n=5 experiments per duration at each
    distance, as in Fig. 6C. The paper reports no test; its Methods say significance in the
    graphs is read from the gap between error bars (a gap longer than the error bars means p
    < 0.05). Reproduced when at no compared distance do two durations' mean profiles show a
    gap between their s.e. bars longer than the bars; not reproduced otherwise. The text
    does not limit the distances; readings are -5 to 5 mm (the fit range of the Fig. 6
    legend) and every measured distance. ROI spacing readings are 1-mm steps and contiguous
    ROIs. The outcome is the one all readings give; blocked as methods_underspecified when
    they differ.
- id: fig6d-longer-pulses-sharper-peak
  statement: FWHM of the central YP peak, fitted per experiment, decreases with pulse duration
    from 300 to 900 ns, with a trend slope different from zero (p = 0.003).
  source: Results 3.3, paragraph 2; Figure 6D
  quote: revealed significant sharpening of the central peak when packets were built from 600-
    and 900-ns pulses ... The slope coefficient of the logarithmic fit of the data was different
    from zero at p = 0.003 (one sample, 2-sided t-test)
  statistics:
  - test: one-sample two-sided t-test on the fit slope
    p: 0.003
    n: 5 experiments per pulse duration
  criterion: For each experiment, the Lorentzian of Methods 2.5 (centre fixed at 0, a and b
    free, no offset) fitted by least squares to the background-subtracted YP intensity along
    the diagonals; FWHM is b. Then a regression of FWHM on pulse duration and a two-sided
    t-test of its slope. The Fig. 6D legend does not say whether the trend was fitted to the
    15 individual values or to the 3 means; readings are individual values (as Fig. 4C,
    whose legend gives n=15 for fitting) and the 3 means. Further readings are
    the fit half-range (4, 5 or 6 mm, from Methods, Results 3.1 and the Fig. 6 legend), the
    trend (linear in pulse duration, Fig. 6D legend, or linear in log pulse duration, Results
    3.3), the ROI spacing (1-mm steps or contiguous) and the pooling of diagonals (averaged
    at each signed distance, or all points fitted). Reproduced when the slope is negative
    with p < 0.05 under every reading; not reproduced when it is under none; blocked as
    methods_underspecified when readings differ. The p-value under each is reported.
- id: fig6d-600-900-differ-from-300
  statement: FWHM for 600-ns and for 900-ns packets is each significantly smaller than for
    300-ns packets (Bonferroni-corrected t-tests, p = 0.028 for one and p = 0.0072 for the
    other).
  source: Figure 6D legend
  quote: "*p=0.028, **p=0.0072 for the difference from 300-ns pulse exposure (2-sided t -test
    with Bonferroni correction)"
  statistics:
  - about: one of 600 ns and 900 ns against 300 ns (the legend does not say which)
    test: two-sided t-test
    p: 0.028
    corrected: Bonferroni
    n: 5 experiments per pulse duration
  - about: the other of 600 ns and 900 ns against 300 ns
    test: two-sided t-test
    p: 0.0072
    corrected: Bonferroni
    n: 5 experiments per pulse duration
  depends_on:
  - fig6d-longer-pulses-sharper-peak
  criterion: Per-experiment FWHM as in fig6d-longer-pulses-sharper-peak. Two-sided Student's
    t-tests of 600 against 300 ns and 900 against 300 ns, Bonferroni-corrected. The number of
    comparisons is not stated; readings are 2 (each against 300 ns, as the legend frames
    them) and 3 (all pairs). Reproduced when both corrected p-values are below 0.05 with
    smaller FWHM at the longer duration, under every reading of the fit range, ROI spacing,
    pooling and comparison count; partially reproduced when only one of the two comparisons
    is significant; blocked as methods_underspecified when readings differ. The legend's
    asterisks are not assigned to durations in the text, so the p-values are compared with
    0.028 and 0.0072 in either order and shown.
- id: fig6d-900ns-fwhm
  statement: Packets of 900-ns pulses reduce FWHM to 1.7 +/- 0.08 mm (mean +/- s.e.), 11.1 +/-
    0.6% of the 15.3-mm gap between electrodes.
  source: Results 3.3, paragraph 2; Figure 6D
  quote: 900-ns pulse packets reduced FWHM to 1.7 ± 0.08 mm, that was 11.1 ± 0.6% of the gap
    between electrodes
  depends_on:
  - fig6d-longer-pulses-sharper-peak
