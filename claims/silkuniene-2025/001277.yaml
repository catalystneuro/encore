  statistics:
  - about: 1 kHz against 1 Hz
    test: t-test
    p: 0.03
    corrected: Bonferroni
    n: 3 experiments per rate
  - about: 10 kHz against 1 Hz
    test: t-test
    p: 0.02
    corrected: Bonferroni
    n: 3 experiments per rate
  - about: 0.2 MHz against 1 Hz
    test: t-test
    p: 0.09
    corrected: Bonferroni
    n: 3 experiments per rate
  - about: logarithmic fit of FWHM on rate, 1 Hz to 10 kHz
    test: correlation
    statistic: R = 0.77
    p: 0.001
    p_relation: "<"
    n: 15 experiments
  - about: slope of the log fit
    test: 2-sided one-sample t test
    p: 0.0001
    p_relation: "<"
    n: 15 experiments
  expected:
  - quantity: mean FWHM at 1 Hz
    value: 4
    tolerance: 0.4
    unit: mm
  - quantity: mean FWHM at 1 kHz, 10 kHz and 0.2 MHz
    value: 2
    tolerance: 0.2
    unit: mm
  criterion: Per-experiment Lorentzian FWHM (fit range -4 to 4 mm, Results 3.1 and Fig. 3
