# Claims for Temmar et al. (2025), "Long-term Intracortical Neural activity and Kinematics
# (LINK)", NeurIPS 2025 Datasets and Benchmarks track, on dandiset 001201.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-11-12, protocol pilot-14 as stated in docs/protocol.md.
#
# Text read: the version of record (open-access PDF from the Curran Associates NeurIPS 2025
# proceedings, extracted to paper/10.52202-085713-4642.txt), main text, figure legends and
# checklist, and the supplement (Supplementary Materials and Appendices, from OpenReview):
# Appendix A (task, implants, feature extraction), B (curation, file format), C (analysis
# methods) and Figures S1 to S6. The paper reports no statistical test for any finding; its
# findings are slopes of linear fits, counts, R2 values and visual descriptions of figures.
#
# Code read: github.com/chesteklab/LINK_dataset at commit 5e1c36a1282f90abb8d96963920a8b1fdd27a6e7
# (2026-10-20). It holds the NWB-to-pickle converter (utils/), the signal-change analysis
# (data_processing/signal_changes: mean SBP per channel and day, active channels, participation
# ratio), single-channel tuning (data_processing/single_channel_tuning/tuning_utils.py), the
# population PCA analysis (data_processing/pop_level_analyses/population_level_analyses.py),
# single-day RR and LSTM decoders and their cross-day evaluation (data_processing/bci_decoding),
# the multi-day training (data_processing/stability/stability, which calls an outside library,
# "neuraldecoding", not in the repository) and the continual fine-tuning
# (data_processing/continual_learning/continual_learning_lstm.py), with the figure scripts in
# data_plotting/. Code facts used below are cited by file.
#
# Data the paper used: one male rhesus macaque, Monkey N (age 7 to 11), with two 64-channel Utah
# arrays in the hand area of right precentral gyrus (a third array in somatosensory cortex was
# not recorded). 96 of the 128 motor channels were recorded, in three 32-channel banks (A to C),
# one bank on the lateral array and two on the medial array (Figure 1C, Figure S1; channels
# numbered 0 to 95). Task: a 2-DOF finger task, index (IDX) and middle-ring-small (MRS) finger
# groups moved with the left hand in a manipulandum, positions 0 (full extension) to 1 (full
# flexion), 750 ms hold, juice reward; two target styles, center-out (CO, 8 directions at 20, 30
# or 40% of the arc, every other trial a return to [0.5, 0.5]) and random (RD). Only successful
# trials, the first 375 after filtering, per session. 312 sessions on 303 days spanning 1,242 days
# (days 349 to 1591 after implant, January 2020 to February 2024); on 9 days both a CO and an RD
# session. Measured variables per 20 ms bin: spiking-band power (SBP, 300 to 1000 Hz band, mean
# magnitude) and threshold crossing counts (TCR, -4.5 x RMS threshold) on 96 channels, and the
# position and velocity of both finger groups; per trial, start and stop times, target positions,
# target style and timeout; per channel, bank, array, row, column and impedance. One NWB file per
# session.
#
# Code choices that fix details the text leaves open, used below unless a criterion says
# otherwise: SBP values in the converted data are multiplied by 0.25 to give microvolts and TCR
# counts per bin by 50 to give Hz (tuning_utils.py, signal_changes.py, signal_utils.py); on days
# with two sessions the mean SBP and the tuning use both sessions concatenated, and the active
# channel count and participation ratio use the CO session (signal_utils.py); slopes are
# scipy linregress on days since the first session (signal_changes.py).
schema_version: 2
dataset:
  archive: dandi
  id: "001201"
paper: doi:10.52202/085713-4642
claims:
- id: dataset-sessions
  statement: The dataset holds 312 sessions recorded on 303 days spanning 1,242 days, two sessions
    (one CO, one RD) on 9 days, each session 375 successful trials, from days 349 to 1591 after
    implant.
  source: Section 3, The LINK Dataset, paragraph 1 (page 4); Appendix B.1 and B.2; Appendix A.2
  quote: on 303 days spanning 1,242 days. The dataset comprises 312 ’sessions’ of 375 (mostly)
    contiguous trial acquisitions. Each session contains one of two variations to the task,
    ‘center-out’ or ‘random’, described below. On 9 days, two sessions are available as both tasks
    were performed.
  expected:
  - quantity: number of sessions
    value: 312
    tolerance: 0
  - quantity: number of recording days
    value: 303
    tolerance: 0
  - quantity: span from first to last recording day
    value: 1242
    tolerance: 0
    unit: days
  - quantity: days with two sessions
    value: 9
    tolerance: 0
  - quantity: trials per session
    value: 375
    tolerance: 0
  criterion: These are counts of the deposit as the paper describes it, so the tolerance is zero
    and not 10%. Sessions are the NWB files; days are distinct session dates; the span is last
    date minus first date. Reproduced when all five match; partially reproduced when the session
    and trial counts match and one of the others differs. A session with a trial count other
    than 375 is listed. The dates are also compared with the stated range of days 349 to 1591
    after implant (Appendix A.2) only if the dataset gives the implant date.
- id: dataset-contents
  statement: Each session holds SBP and TCR for 96 motor-cortex channels and the position and
    velocity of the two finger groups in 20 ms bins, with per-trial target positions, start times,
    lengths and target style, and per-channel array locations and impedances.
  source: Section 3, The LINK Dataset, paragraph 1 (page 4); Section 3.3; Appendix B.3
  quote: In each session, we provide neural data preprocessed into two neural features in 20ms
    bins... spiking-band power (SBP) and threshold crossing rate (TCR). We also provide the position
    and velocity of the 2DOF at the same resolution.
  criterion: Reproduced when every session file holds 96-channel SpikingBandPower and
    ThresholdCrossings series and index and MRS position and velocity series, all at 20 ms
    sampling (timestamps spaced 0.02 s), a trials table with the columns Appendix B.3 lists, and
    an electrodes table with bank, row, column and impedance columns. Partially reproduced when
    a few files lack a part; each gap is listed. Velocity is checked against the difference of
    consecutive binned positions, as Appendix A.3 defines it.
- id: figs2-throughput-improves
  statement: The monkey's real-time task performance, measured as average Fitts' law throughput
    per day, appears to improve gradually over the dataset.
  source: Appendix A.1, paragraph 2; Figure S2
  quote: In S2, we show the average throughput across all trials for each day, and noted that
    Monkey N’s performance appears to gradually improve throughout the course of the dataset.
  criterion: Throughput per trial is computed "as described in [1]" (Nason et al. 2021), which is
    not part of this paper, and the code holds no throughput function, so its form is open. The
    readings named are (a) index of difficulty log2(1 + D/W) over acquisition time, with D the
    Euclidean distance in the 2-DOF position space from the previous targets to the current
    targets and W the target width of 0.15 (Appendix A.1), acquisition time being the trial
    length minus the 750 ms hold; (b) the same with the trial length including the hold; (c)
    the sum over the two finger groups of each group's log2(1 + D/W), over the time of (a).
    Per day, the mean over all trials of both sessions. Reproduced when, under one reading, a
    linear fit of daily mean throughput on date has a positive slope with p < 0.05 (two-sided
    linregress; the paper gives no test, so the threshold is a standard choice and not the
    paper's).
- id: fig2a-sbp-decline
  statement: Average SBP across channels decreased gradually by about 0.033 microvolts per month,
    as estimated by a linear model fit to every channel's mean SBP on every day.
  source: Section 4.1, paragraph 1; Figure 2A and legend
  quote: Average SBP across channels decreased gradually by approximately 0.033 μV per month, as
    estimated by a linear model.
  expected:
  - quantity: slope of mean SBP over time
    value: -0.033
    tolerance: 0.0033
    unit: microvolts per month
  criterion: As in signal_utils.calc_avg_sbps and signal_changes.create_avg_sbp_plot. Per day and
    channel the mean of SBP over all bins of the day (both sessions concatenated on two-session
    days), multiplied by 0.25 to give microvolts; one ordinary least-squares line (scipy
    linregress) fit to all channel-day points on days since the first day, with no outliers
    removed (the legend's outliers are only marked on the plot); the slope per day times 30.44
    days per month. The legend prints the slope as 0.033 without a sign while the text says
    decreased; the expected value is negative. Open detail, which could change the outcome by a
    factor of four, is the unit of SBP in the NWB files. The readings are (a) the NWB values
    multiplied by 0.25 as the code does to the converted data (when the NWB series stores the
    raw xPC units); (b) the NWB values in the unit their conversion attribute gives, when that is
    already microvolts. Reproduced when the slope is within tolerance under one reading; the
    supplement's overall slope of -1.11e-3 per day (Appendix C.2), which is the same number per
    day, is reported alongside.
- id: fig2a-irregular-shifts
  statement: Groups of channels show irregular SBP shifts in some periods, for example from about
    July to November 2022, and these shifts did not affect overall decoding performance.
  source: Section 4.1, paragraph 1; Figure 2A
  quote: There are periods where groups of channels exhibit irregular shifts (e.g. ~2022-07 to
    ~2022-11), but these did not affect overall decoding performance.
  depends_on:
  - fig4a-sameday-stable
  criterion: The paper gives no measure of a shift or of "did not affect"; both are fixed here as
    choices not in the paper. A shift is a channel whose mean SBP on a day differs from its median
    over the preceding 30 days of sessions by more than three times that window's median absolute
    deviation. The claim holds (reproduced) when in July to November 2022 at least five channels
    shift on the same day on at least one day, and the same-day LSTM and RR R2 of fig4a-sameday-stable
    for sessions in that window have medians within the 10th to 90th percentile range of all
    sessions' values. Partially reproduced when only one of the two parts holds.
- id: fig2b-active-channels-decrease
  statement: The number of active channels, those with mean TCR above 1 Hz on a day, appears to
    decrease over time.
  source: Section 4.1, paragraph 2; Figure 2B and legend
  quote: During iBMI experiments, we can roughly estimate the number of active channels by counting
    those with mean TCR > 1 Hz, shown in Figure 2B. Note that this appears to decrease over time.
  criterion: As in signal_utils.calc_pr_all_days. Per day, TCR counts per 20 ms bin times 50 give
    Hz; a channel is active when its mean over all bins of the session exceeds 1 Hz; the CO
    session is used on two-session days, the RD session otherwise. Reproduced when a linear fit
    of the daily count on days since the first day has a negative slope with p < 0.05 (two-sided
    linregress; the paper gives no test, so this is a standard choice). The counts in the first
    and last 30 sessions are reported.
- id: fig2c-pr-decline
  statement: The participation ratio of the active channels' SBP decreased by about 0.07 per month,
    as estimated by a linear model.
  source: Section 4.1, paragraph 2; Figure 2C and legend
  quote: a linear model estimated that PR decreased by ~0.07 PR per month
  expected:
  - quantity: slope of participation ratio over time
    value: -0.07
    tolerance: 0.007
    unit: PR per month
  depends_on:
  - fig2b-active-channels-decrease
  criterion: As in signal_utils.calc_pr_all_days and participation_ratio. Per day, the active
    channels of fig2b-active-channels-decrease (CO session on two-session days); the SBP of those
    channels over all bins of the session, mean-subtracted per channel and not z-scored; the
    eigenvalues of its covariance; PR = (sum of eigenvalues) squared over the sum of squared
    eigenvalues (Gao et al., cited as [68]). Days with no active channel are skipped. A linear fit
    (linregress) of PR on days since the first day; slope per day times 30.44. Reproduced when the
    slope is within tolerance. Using both sessions on two-session days is shown as a variant.
- id: fig2c-ten-dimensions
  statement: Generally, 10 dimensions were sufficient to capture the majority of the variance of
    the active channels.
  source: Section 4.1, paragraph 2; Figure 2C
  quote: Generally, 10 dimensions were sufficient to capture the majority of the variance in active
    channels
  depends_on:
  - fig2c-pr-decline
  criterion: The paper does not say how the sentence was measured. The readings are (a) the daily
    PR of fig2c-pr-decline is at most 10 (the paper says PR roughly corresponds to the number of
    dimensions explaining 80% of the variance); (b) the first 10 principal components of the
    active channels' mean-subtracted SBP explain more than 50% of its variance; (c) the same at
    more than 80%. Reproduced when, under one reading, it holds on more than half of the days
    ("generally"); the fraction of days is reported under each reading.
- id: figs4-bank-slopes
  statement: Mean SBP decreases over time in each 32-channel bank, with lower overall activity and
    a shallower slope on the lateral bank (-0.58e-3) than on the two medial banks (-1.34e-3 and
    -1.40e-3), against -1.11e-3 for all channels.
  source: Appendix C.2, paragraph after Figure S3; Figure S4; Section 4.1, paragraph 2
  quote: The slopes of the best-fit lines for the Lateral, Medial 1, and Medial 2 groups were −0.58
    × 10−3, −1.34 × 10−3, and −1.40 × 10−3 respectively. This is compared to −1.11 × 10−3 for the
    overall SBP. This is largely because the average SBP is generally higher on the medial arrays
  expected:
  - quantity: slope, lateral bank
    value: -0.00058
    tolerance: 0.000058
    unit: microvolts per day
  - quantity: slope, medial 1 bank
    value: -0.00134
    tolerance: 0.000134
    unit: microvolts per day
  - quantity: slope, medial 2 bank
    value: -0.0014
    tolerance: 0.00014
    unit: microvolts per day
  - quantity: slope, all channels
    value: -0.00111
    tolerance: 0.000111
    unit: microvolts per day
  depends_on:
  - fig2a-sbp-decline
  criterion: The unit of the slopes is not printed; microvolts per day is the reading consistent
    with the overall slope and the 0.033 microvolts per month of Figure 2A. The code for Figure S4
    is not in the repository. Bank membership and which bank is lateral, Medial 1 and Medial 2
    come from the electrodes table (bank and array columns) and Figure S1. Open detail, which
    could change the slopes, is what the line is fit to; the readings are (a) all channel-day mean
    SBP values of the bank, as the overall slope is computed in the code; (b) the per-day mean over
    the bank's channels (the Figure S4 legend says the mean SBP for each bank was calculated for
    each day). The SBP unit readings of fig2a-sbp-decline apply. Reproduced when, under one
    reading, all four slopes are within tolerance and the lateral bank's mean SBP over the dataset
    is below each medial bank's; partially reproduced when the ordering of slopes (lateral
    shallowest, all negative) holds but values fall outside tolerance.
- id: figs5-active-inactive-slopes
  statement: Grouped per session into active and inactive channels by TCR, mean SBP of active
    channels declines faster (-1.29e-3) than all channels, while the slope for inactive channels
    is near zero (0.54e-3), and inactive channels have lower SBP.
  source: Appendix C.2, paragraph after Figure S3; Figure S5; Section 4.1, paragraph 2
  quote: The slopes of the best-fit lines here were −1.29 × 10−3, and 0.54 × 10−3. As might be
    expected, the slope for the inactive channels was near 0
  expected:
  - quantity: slope, active channels
    value: -0.00129
    tolerance: 0.000129
    unit: microvolts per day
  - quantity: slope, inactive channels
    value: 0.00054
    tolerance: 0.000054
    unit: microvolts per day
  depends_on:
  - fig2b-active-channels-decrease
  criterion: Active means mean TCR above 1 Hz in the session, as in Section 4.1 and the code
    (the supplement's "average TCR < 1Hz" for active is read as a typo, since it calls the others
    inactive and the main text uses > 1 Hz). Classification is per session as the supplement says.
    The order of the two printed slopes is read as active then inactive, as the sentence that
    follows confirms. The fit readings (a) and (b) and the unit readings of figs4-bank-slopes
    apply; the code for Figure S5 is not in the repository. Reproduced when, under one reading,
    both slopes are within tolerance and inactive channels have the lower mean SBP. Section 4.1
    says all categories decreased, which the positive inactive slope contradicts; the sign found
    is reported.
- id: fig2d-population-drift
  statement: In a PCA fit to SBP z-scored per channel across the whole dataset, the per-day and
    per-quarter centroids of the top 3 PCs move through PC space over time, while the standard
    deviation of the top 3 PCs per quarter changes little except in two quarters.
  source: Section 4.1, paragraphs 3 and 4; Figure 2D and legend; Appendix C.3
  quote: Visually, these centroids appear to move throughout the PCA space over time, and except
    for two quarters, the standard deviation of the top 3 PCs does not exhibit large changes.
  criterion: Method from Appendix C.3 and population_level_analyses.normalize_data (method all).
    SBP of all sessions concatenated, z-scored per channel over the whole dataset, PCA
    (scikit-learn) to 3 components, scores grouped by day and by calendar quarter; centroid and
    standard deviation per group. The paper judges this visually; the decision rule is a choice
    not in the paper. Movement holds when the distance between the first and last quarter's
    centroids exceeds the mean within-quarter standard deviation (root mean square over the 3
    PCs). Stable spread holds when at most two quarters have a 3-PC standard deviation more than
    25% away from the median over quarters. Reproduced when both hold; partially reproduced when
    one does. The centroid path and the per-quarter standard deviations are shown.
- id: fig2e-trajectories-separable
  statement: Average neural trajectories in the top 3 PCs for the eight movement directions remain
    visually separable in both the first year (2020) and the last (2023) of the dataset.
  source: Section 4.1, paragraph 4; Figure 2E and legend; Appendix C.3
  quote: The trajectories shown remain visually separable at the beginning and end of the dataset.
  criterion: Method from Appendix C.3. Per day, SBP z-scored per channel and a PCA fit for that
    day, top 3 PCs; CO and RD trials both used; each trial labelled with one of eight directions
    by the angle of the vector from the previous trial's targets to its targets (IDX on x, MRS on
    y), in 45-degree sectors centred on the eight directions (Figure S6); movement onset as the
    first bin where the velocity of the dominant finger (MRS for MRS-dominant directions, IDX
    otherwise) leaves the mean plus or minus one standard deviation of the first 10% of the
    trial's velocities; alignment at the maximum absolute jerk (second difference of velocity)
    before onset; 37 bins from the alignment point; averaged per year and direction. The code
    uses 2 standard deviations and a window from 150 ms before to 600 ms after the alignment
    point (population_level_analyses.py); this is shown as a variant. The paper judges
    separability visually; the rule here is a choice not in the paper. For 2020 and 2023 each,
    trials' 37-bin trajectories in the 3 PCs are classified by direction with a nearest-centroid
    classifier under 5-fold cross-validation. Reproduced when accuracy exceeds chance (1/8) by a
    one-sided binomial test at p < 0.05 in both years; partially reproduced in one year.
- id: fig3b-two-channels
  statement: Channel 7 is strongly tuned to MRS flexion throughout the dataset, whereas channel 32
    shows large shifts in tuning angle; both are active, with average TCR above 1 Hz across the
    dataset.
  source: Section 4.2, paragraph 1; Figure 3B and legend
  quote: Channel 7 was strongly tuned to MRS flexion throughout the dataset, whereas channel 32
    exhibited large shifts in tuning angle.
  criterion: Tuning as in Appendix C.2 and tuning_utils.compute_channel_tuning. Per day (both
    sessions concatenated), each channel's SBP z-scored; for lags of 0 to 10 bins (behaviour at
    t plus lag), a linear regression with intercept of IDX and MRS position on the channel's SBP;
    the two coefficients form a vector; the lag with the largest vector norm is kept. Angle is
    atan2(MRS, IDX), so 0 degrees is IDX flexion and 90 degrees MRS flexion; strength is the norm.
    Appendix C.2 says position or velocity; the main text and the code use position, which is
    followed. Circular median and circular IQR per channel as in calc_medians_iqrs. Channels are
    numbered 0 to 95 as in Figure S1. The decision rule is a choice not in the paper. Reproduced
    when channel 7's circular median angle is within 45 degrees of 90, its circular IQR is below
    45 degrees and its median strength is above the median over channels; channel 32's circular
    IQR is larger than channel 7's and above the median circular IQR over channels; and both
    channels' mean TCR over the dataset exceeds 1 Hz.
- id: fig3cd-tuning-stable
  statement: Per-channel tuning angles and strengths generally appear consistent through the
    dataset, and in most channels the circular IQR of tuning angle is small, so their tunings did
    not change much.
  source: Section 4.2, paragraph 1; Figure 3C, 3D and 3E; Discussion, paragraph 3
  quote: In most channels, the circular IQR of tuning angles was small, suggesting their tunings
    did not change much throughout the dataset.
  depends_on:
  - fig3b-two-channels
  criterion: Tuning as in fig3b-two-channels. The paper does not fix what a small circular IQR
    is. The readings are (a) below 45 degrees (one of the eight 45-degree movement sectors of
    Appendix C.3); (b) below 90 degrees. The channels counted are (i) all 96, or (ii) the channels
    active (mean TCR above 1 Hz) over the dataset. Reproduced when, under one pair of readings,
    more than half of the channels have a small circular IQR; the distribution of circular IQRs
    is shown.
- id: fig3d-weak-channels-low-tcr
  statement: Many channels have very low tuning strength throughout the arrays' lifespan, and such
    channels typically have low average TCR per day.
  source: Section 4.2, paragraph 1; Figure 3D; Figure S3; Appendix C.2, paragraph after Figure S3
  quote: many channels have very low tuning strengths throughout the lifespan of the arrays. Such
    channels also typically showed low average TCRs per day, as shown in Figure S3.
  depends_on:
  - fig3b-two-channels
  criterion: Tuning strength as in fig3b-two-channels; mean TCR per channel and day in Hz, as
    tuning_utils.compute_tuning_data saves it. The test is a choice not in the paper. Across the
    96 channels, the Spearman correlation between median tuning strength and median daily TCR is
    positive with p < 0.05, and the channels in the lowest quartile of median strength have a
    lower median TCR than the others (Mann-Whitney, p < 0.05). Reproduced when both hold;
    partially reproduced when one does.
- id: fig3e-array-tuning
  statement: Channels on the medial array are mainly tuned to MRS flexion, with some to IDX
    flexion, while channels on the lateral array are more tuned to extension of both fingers, so
    channels on the same array tend to have similar tuning angles.
  source: Section 4.2, paragraph 1; Figure 3E; Discussion, paragraph 3
  quote: it appears that channels in the medial array (see Figure 1) are mainly tuned to MRS
    flexion, with some IDX flexion, while channels in the lateral array are more tuned to
    extension of both DOF.
  depends_on:
  - fig3b-two-channels
  criterion: Per channel, the circular median tuning angle of fig3b-two-channels; array from the
    electrodes table. In the code's convention MRS flexion is 90 degrees, IDX flexion 0, IDX
    extension 180 and MRS extension -90, so extension of both is -135. The sectors are a choice
    not in the paper; each is a quadrant widened by half a 45-degree sector. Reproduced when more
    than half of medial channels have a circular median angle between -22.5 and 112.5 degrees with
    more of them within 45 degrees of 90 than within 45 degrees of 0, and more than half of
    lateral channels have one between -202.5 and -67.5 degrees (centred on -135). The channels
    counted are all channels or only active ones (two readings); reproduced under either.
    Partially reproduced when one array holds.
- id: fig4a-sameday-stable
  statement: Same-day decoding accuracy (R2 averaged across the four outputs on the 75 hold-out
    trials) remains relatively stable over the dataset, with most shifts shared by RR and LSTM.
  source: Section 4.3, paragraph 1; Figure 4A and legend; Discussion, paragraphs 1 and 4
  quote: Within-day decoding accuracy remains relatively stable across time, and the majority of
    shifts in accuracy are reflected in both decoders
  criterion: Decoders as in Appendix C.1 and bci_decoding/train_models_singleday.py. Per session,
    the first 300 trials train and the last 75 test. SBP is z-scored per channel on the training
    trials (Appendix C.1 says for both decoders; the code fits no scaler for RR, shown as a
    variant). RR is sklearn Ridge, alpha 0.1, intercept, 8 bins of history (768 inputs). The LSTM
    has 96 inputs, hidden size 300, 1 layer, a linear readout of position and velocity of both
    fingers at the last of 20 bins; Adam, batch 64, 2000 iterations, learning rate decaying
    linearly from 2e-4 to 1e-5, weight decay 0.001, outputs z-scored on the training data, and
    Gaussian noise added to the inputs (standard deviation 0.1 per sample and 0.2 per sequence
    bias), as in the code and [6]. R2 per output (sklearn r2_score), averaged over the four.
    Sessions on two-session days are evaluated separately, as in the code. The code's test set
    stops at the start of the last trial (74 trials); the 75 trials of the Methods are used. The
    decision rules are choices not in the paper. Stable holds when the slope of a linear fit of
    same-day R2 on date is not negative with p < 0.05 (two-sided) for either decoder, the Discussion
    saying the decline in neural activity did not correspond to decreases in decoding
    performance. Shared shifts hold when the Pearson correlation across sessions between RR and
    LSTM same-day R2 is positive with p < 0.05. Reproduced when both hold; partially reproduced
    when one does.
- id: fig4a-lstm-beats-rr
  statement: The LSTM outperformed ridge regression in same-day decoding on every day.
  source: Discussion, paragraph 4; Figure 4A
  quote: While the LSTM outperformed RR on every day, we noted that there were baseline shifts in
    decoding performance that impacted both decoders
  depends_on:
  - fig4a-sameday-stable
  criterion: Same-day R2 averaged across outputs, as in fig4a-sameday-stable. Reproduced when LSTM
    R2 exceeds RR R2 on every session; partially reproduced when it does on at least 90% of
    sessions (a choice not in the paper); not reproduced otherwise. The sessions where RR is higher
    are listed, and the LSTM is retrained with two further seeds on those sessions to show whether
    the result rests on the seed (42 in the code).
- id: fig4bc-dof-accuracy
  statement: Decoding of finger positions is more accurate than of velocities, and MRS predictions
    are more accurate than IDX predictions.
  source: Section 4.3, paragraph 1; Figure 4B and 4C
  quote: In general, the position accuracies of the two finger groups outperformed velocities, and
    MRS predictions outperformed IDX predictions, suggesting there may be more information
    regarding the MRS finger group in the neural data than IDX.
  depends_on:
  - fig4a-sameday-stable
  criterion: Same-day R2 per output from fig4a-sameday-stable. For each decoder, the median over
    sessions of each of IDX position, MRS position, IDX velocity and MRS velocity. Reproduced when,
    for both decoders, both position medians exceed both velocity medians, and MRS exceeds IDX for
    position and for velocity; partially reproduced when the orderings hold for one decoder or
    only one of the two orderings holds for both. The fraction of sessions in which each ordering
    holds is reported ("in general").
- id: fig4d-cross-day-decay
  statement: Decoders tested on hold-out sets of other days within 100 days of training lose
    accuracy sharply in the short term, with the decay stabilising at longer offsets; neither RR
    nor LSTM generalises well, the LSTM is better at every offset, and both follow a similar decay.
  source: Section 4.3, paragraph 2; Figure 4D and legend; Discussion, paragraph 4
  quote: LSTM outperformed RR on all days, but both followed a similar decay curve.
  depends_on:
  - fig4a-sameday-stable
  criterion: Every single-day decoder of fig4a-sameday-stable is evaluated on the 75 hold-out
    trials of every session within 100 days of its training day, with no retraining; R2 averaged
    across outputs; evaluations grouped by day offset (test date minus training date) and
    averaged, with standard errors. Two details are open, and each reading is run. Day offset is
    (a) signed, from -100 to 100, as bci_decoding_plots.plot_performance_across_days plots it, or
    (b) its absolute value. Input normalization on the test day is (i) the training day's
    parameters, as Appendix C.1 states for Figure 5, or (ii) refit on the test day's first 300
    trials, as eval_singleday_models_multithread_updatenorm.py does (the plotting code draws both
    versions). The rules are choices not in the paper. Reproduced when, under one pair of
    readings, the LSTM mean exceeds the RR mean at every offset with data; the mean R2 at offsets
    of 1 to 5 days is below the offset-0 mean by more than the drop from offsets 1 to 5 to offsets
    90 to 100; and the two curves, each divided by its offset-0 value, correlate with Pearson r
    above 0.9 across offsets. Partially reproduced when the LSTM is better at 90% or more of
    offsets and the other two parts hold.
- id: suppc1-shuffle-baseline
  statement: With neural and behavioural hold-out data shuffled independently on one session, RR
    gives an average R2 of -0.166 and the LSTM of -0.156.
  source: Appendix C.1, Decoder Evaluation paragraph
  quote: RR had an average R2 of -0.166, and LSTM had an average R2 of -0.156.
  expected:
  - quantity: RR R2 on shuffled hold-out data
    value: -0.166
    tolerance: 0.0166
  - quantity: LSTM R2 on shuffled hold-out data
    value: -0.156
    tolerance: 0.0156
  depends_on:
  - fig4a-sameday-stable
  criterion: The session is not named and the shuffle is not described beyond "independently
    shuffled the neural and behavioral data of the holdout set". Read as permuting the time bins
    of the hold-out SBP and, separately, of the hold-out kinematics, then predicting with that
    day's decoders and scoring against the shuffled kinematics. Because one unnamed session could
    be any of 312, the claim is judged on the median over all sessions (one shuffle each, seed 0).
    Reproduced when both medians are within tolerance; partially reproduced when both are
    negative but one or both fall outside it. Shuffling trials as whole units is shown as a
    variant.
- id: fig5a-multiday-short-term
  statement: Training the LSTM on up to five consecutive past sessions reduces the initial drop in
    performance within about 5 days of training and improves performance over time, but slightly
    lowers day-0 performance.
  source: Section 4.3, paragraph 3; Figure 5A and legend
  quote: Multi-day training, reduced the initial decrease in performance (within ~5 days of
    training), improving performance over time, but did not seem to impact the longer term decay,
    and slightly decreases day 0 performance.
  criterion: Method from Section 4.3 and Appendix C.1. For each eligible day 0, LSTMs (the
    architecture and training of fig4a-sameday-stable) trained on the training trials of the
    latest 1 to 5 sessions up to and including day 0; each evaluated on the hold-out trials of
    every session within 180 days after day 0, input normalization held at the training
    parameters (Appendix C.1, Figure 5). Days with two sessions and the first 10 sessions are
    excluded (Section 4.3); the legend reports 283 days, and the count found is reported. The code
    (stability/trainer_multiday.py and config_LSTM) differs, skipping only the first 5 sessions,
    splitting each session 90/10, refitting input normalization on the test data and adding no
    noise; it is shown as a variant. R2 averaged over outputs, then over day 0s per relative day.
    Reproduced when, for 5 sessions against 1 session, the mean R2 over relative days 1 to 5 is
    higher, the drop from day 0 to that mean is smaller, and the day-0 R2 is lower; partially
    reproduced when the first two hold and day 0 is not lower.
- id: fig5a-long-term-decay
  statement: Double-exponential fits to the single-session and five-session conditions over 0 to
    180 days show steeper decay for single-session training; the initial decay decreases with
    more training sessions, but the long-term decay is not significantly affected.
  source: Section 4.3, paragraph 3; Figure 5A
  quote: A double-exponential fit (Fig. 5A) to the single-session and 5-session conditions over all
    evaluation sessions (within 180 days of day 0) show steeper decays in the single-session case,
    confirming our observations... the initial decay decreases with more training sessions, but the
    long-term decay is not significantly affected.
  depends_on:
  - fig5a-multiday-short-term
  criterion: As in stability_plotter.ipynb (plot_multiday_training). The mean R2 per relative day
    from 0 to 180 for 1 and 5 training sessions is fit with a*exp(b*x) + c*exp(d*x) by
    scipy curve_fit, initial values (0.374, 0.00365, 0.134, 0.140) and maxfev 10000 as in the
    notebook; the component with the larger absolute rate is the initial decay, the other the
    long-term decay. The paper names no test for "not significantly"; the test here is a choice
    not in the paper, approximate 95% intervals of the rates from the fit covariance. Reproduced
    when the initial-decay rate is more negative for 1 session than for 5, the predicted drop
    from day 0 to day 5 is larger for 1 session, and the 95% intervals of the two long-term rates
    overlap. Not reproduced when the long-term rates' intervals do not overlap, with the size of
    the difference given. A fit that does not converge is reported with the residuals.
- id: fig5b-finetune
  statement: Continual daily fine-tuning of an LSTM on 30 s to 5 min of each new session's data,
    over up to 200 days from 20 seed days, reduces both short- and long-term decay, and with 120 s
    or 300 s later decoders outperform the day-0 decode.
  source: Section 4.3, paragraphs 3 and 4; Figure 5B and legend
  quote: Fine-tuning with as little as 30 s of data helped reduce both the short and long-term
    decays in accuracy... In fact, fine-tuning on 120s or 300s led to later decoders outperforming
    the baseline day 0 decode.
  depends_on:
  - fig5a-multiday-short-term
  criterion: As in continual_learning_lstm.py. Seed days are the 20 listed in STARTING_DAYS (the
    paper says approximately evenly spaced); an LSTM is trained on the seed day as in
    fig4a-sameday-stable, then for each later session up to 200 days out it is fine-tuned on the
    last 30, 60, 120 or 300 s (1500, 3000, 6000 or 15000 bins) of that session's 300 training
    trials, with 50, 250, 250 or 500 iterations and learning rate from 2e-4 to 1e-5, the input
    normalizer refit on those samples and the output normalizer kept, and evaluated on that
    session's hold-out trials; CO is used on two-session days. R2 is averaged across the 20 seeds
    per relative day. The comparison without fine-tuning is open; the readings are (a) the
    single-session curve of fig5a-multiday-short-term and (b) the LSTM curve of
    fig4d-cross-day-decay at positive offsets. Reproduced when, under one reading, 30 s
    fine-tuning has higher mean R2 than the comparison both over relative days 1 to 10 and over
    days 100 to 200, and for 120 s and 300 s the mean R2 over days 100 to 200 exceeds the mean
    day-0 R2 of the seed decoders. Partially reproduced when only one of the two parts holds.
