- id: fig4i-rmp-hyperpolarization
  statement: In acute hippocampal slices, PAGER-Gi-expressing CA1 neurons show a greater
    hyperpolarizing shift in resting membrane potential with 100 nM DCZ plus 1 uM mCherry than with
    DCZ alone (mixed linear model, Z = 3.17, P = 0.0015).
  source: Results, Customized cell behaviours driven by PAGER G, paragraph 3; Fig. 4i and legend
  quote: Neurons displayed a greater hyperpolarizing shift in RMP when presented with DCZ plus
    mCherry than with DCZ alone
  statistics:
  - test: mixed linear model regression analysis
    statistic: Z = 3.17
    p: 0.0015
    n: 15 cells from 7 mice (DCZ) and 26 cells from 6 mice (DCZ plus mCherry)
  depends_on:
  - methods-slice-sample
  expected:
  - quantity: absolute Z of the treatment effect on the RMP change
    value: 3.17
    tolerance: 0.317
  criterion: Measures from the Methods (Slice electrophysiology). Per sweep, RMP is the mean
    membrane potential over the 500 ms before any current injection. Rin is the steady-state
    voltage change to the -100 pA, 200-ms step (step voltage minus that sweep's RMP) divided by
    -100 pA; the steady-state window is not given, and the readings are the last 50 ms and the
    last 100 ms of the step. Cells whose initial Rin (first sweep) exceeds 500 megaohms are
    excluded (the paper prints "mΩ"), and sweeps with RMP above -50 mV or with no action potential
    during the ramp. Action potential detection is not given; the readings are (A1) an upward
    crossing of 0 mV and (A2) dV/dt above 20 V/s. The change "upon 2-min DCZ addition" is not
    defined beyond "before, during and after" the application; the readings are (W1) mean over
    included sweeps from DCZ onset to 2 min after onset minus the mean over included sweeps
    before onset, and (W2) mean over included sweeps from onset to the end of the recording
    minus the same baseline. Onset is the application time the dataset records. The test is a
    mixed linear model (statsmodels, as the Methods name) with treatment as fixed effect and a
    random intercept per mouse (Methods, Statistical analysis); the unit is not given, and the
    readings are (M1) one change per cell and (M2) every included sweep's change from baseline,
    with cell as a variance component within mouse. Under each combination of readings, the
    result is reproduced when the DCZ plus mCherry change is more negative than the DCZ change,
    the treatment effect has p < 0.05, and |Z| is within tolerance; partially reproduced when
    direction and p < 0.05 hold but |Z| is outside tolerance; not reproduced otherwise. The
    outcome is the one all combinations give; if they differ, the claim is blocked as
    methods_underspecified with every result shown. Group means and s.e.m. of the change are
    reported, as the figure plots them.
