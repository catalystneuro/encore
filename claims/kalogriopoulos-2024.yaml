  source: Extended Data Fig. 12c,d,h legend; Results, Customized cell behaviours driven by PAGER
    G, paragraph 3
  quote: The degree of mEGFP expression, as an indicator of PAGER Gi expression levels in neurons,
    supports PAGER Gi alone having no impact on baseline rheobase (c) or input resistance (d)
