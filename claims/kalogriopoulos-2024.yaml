# Claims for Kalogriopoulos, Tei et al. (2024), "Synthetic GPCRs for programmable sensing and
# control of cell behaviour", Nature 637, 230-239, on dandiset 001354.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record as served by Europe PMC (PMC11666456, marked "corrected
# publication 2025"), with main text, Methods, figure and Extended Data legends, and the
# Supplementary Information PDF (41586_2024_8282_MOESM1_ESM: supplementary discussion, tables,
# supplementary figure and video legends). The second supplement (MOESM2, the Reporting Summary)
# yielded no text and was not read. The correction notice (doi:10.1038/s41586-025-08607-w) was
# not read separately. No PDF of the main article was supplied, so the figure panels themselves
# (for example the mean changes plotted in Fig. 4i,j and the table of Extended Data Fig. 12h)
# could not be read; claims rest on the text and legends.
#
# Code: the paper links none. Its Code availability says "All custom Python scripts used in this
# study are available upon request." No repository was read. Its Data availability says no
# separate datasets were generated; the paper does not cite the dandiset.
#
# The dandiset ("Hippocampal neuronal responses to programmable antigen-gated G-protein-coupled
# engineered receptor activation") is described as single-cell recordings of mouse CA1 neurons
# expressing AAV1/2-hSyn-a-mCherry-PAGER-Gi-P2A-mEGFP, recorded during DCZ (100 nM) or DCZ plus
# soluble mCherry (1 uM). This is the acute slice experiment of Fig. 4e-j and Extended Data
# Fig. 12a-h. All other claims below are on cell culture, imaging and biochemical data that the
# dandiset is not described as holding.
#
# The slice data as the paper reports them (Methods, Neuronal electrophysiology assay in brain
# slices): adult female C57BL/6 mice injected bilaterally into CA1 at 4-8 weeks with AAV1/2
# hSyn-alpha-mCherry-PAGER-Gi-P2A-mEGFP; 3-6 weeks later, coronal hippocampal slices (250 um);
# whole-cell current clamp of GFP-positive CA1 neurons in dorsal hippocampus at 33 C; holding
# current set so each cell began at -65 mV. Repeated 5-s sweeps, each with a 500-ms period
# before any current injection, a -100 pA step of 200 ms, then 300 ms later a ramp from -150 to
# +500 pA over 2 s. Low-pass filtered at 2 kHz, digitized at 10 kHz (pClamp, Multiclamp 700B).
# Conditions: a 2-min bath application of 100 nM DCZ alone (15 cells, 7 mice) or 100 nM DCZ with
# 1 uM mCherry after preincubation in 1 uM mCherry (30-150 min, mean 73.4 min; 26 cells, 6
# mice). Measured per sweep: resting membrane potential (RMP, mean of the 500 ms before any
# injection), input resistance (Rin, from the steady-state voltage change to the -100 pA step)
# and rheobase (the ramp current at the first action potential). mEGFP intensity per cell was
# measured from a widefield image taken before each recording (freehand soma ROI, ImageJ).
# Exclusions: cells with initial Rin above 500 (printed "mΩ", read as megaohms), and sweeps with
# RMP above -50 mV or with no action potential. Groups were compared by a mixed linear model
# (statsmodels) to account for several cells per animal.
#
# Method details the paper leaves open for the slice claims, named in the criteria with the
# readings the text allows: the windows that define a change "upon 2-min DCZ addition"; the unit
# of the mixed model (one change per cell, or every sweep); the action potential detection rule;
# the steady-state window of the Rin step.
