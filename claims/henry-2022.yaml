- id: fig2de-population-decoding-example
  statement: In one animal at the nearest spacing, V4 population decoding performance with
    distractors tends to be lower than for targets alone when performance is above chance (p <
    0.001), while in V1 the loss is not significant (p > 0.05).
  source: Results, Distractors limit target discriminability, paragraph 4; Figure 2D and 2E
  quote: In V4, when decoder performance was above chance (Figure 2E, abscissa values greater than
    0.5), performance for responses to targets with distractors tended to be lower (ordinate; p <
    0.001 for difference; addressed further below). In V1, performance loss was less evident (p >
    0.05 for difference
  statistics:
  - about: V4, target alone against with nearest distractors
    p: 0.001
    p_relation: "<"
    n: 84 cases (pairings of target stimuli across sessions), one animal
  - about: V1, target alone against with nearest distractors
    p: 0.05
    p_relation: ">"
    n: 84 cases, one animal
  criterion: Decoding from the STAR Methods. For each population, each pair of target
    orientations, and each condition (targets alone, or with distractors at 1.3 degrees), a
    logistic regression with Lasso penalty, the penalty set to the largest value that gives
    maximal cross-validated performance on held-out trials of the training set, evaluated on
    held-out test trials and averaged over folds; performance is fraction correct. Open details.
