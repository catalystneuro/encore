    and no restriction both shown for V1. Reproduced when, under one reading, V4 performance with
    distractors is lower at p < 0.001 and the V1 difference has p > 0.05.
- id: fig2f-v1-threshold-elevation
  statement: In V1, distractors elevate the estimated discrimination threshold of the populations
    by 1.31 +/- 0.10 at the closest spacing and 1.15 +/- 0.08 at the farthest, significant at all
    but the farthest spacing (permutation test, p < 0.05).
  source: Results, Distractors limit target discriminability, paragraph 6; Figure 2F
  quote: Distractors at the closest spacing yielded the largest threshold elevations, 1.31 ± 0.10;
    distractors at the farthest spacing yielded the smallest elevation, 1.15 ± 0.08. The estimated
    threshold elevation was statistically significant for all but the farthest target-distractor
    separation (permutation test, p < 0.05).
  statistics:
  - about: threshold elevation above 1 at 1.3, 1.6 and 2.1 degrees
    test: permutation test
    p: 0.05
    p_relation: "<"
  depends_on:
  - fig2de-population-decoding-example
  expected:
  - quantity: V1 threshold elevation, closest spacing
    value: 1.31
    tolerance: 0.10
  - quantity: V1 threshold elevation, farthest spacing
    value: 1.15
    tolerance: 0.08
  criterion: From the STAR Methods and Figure S2. Decoding performance pairs (target alone,
    crowded) as in fig2de-population-decoding-example, pooled over pairings and sessions per
    animal and spacing. Target-alone model, a cumulative normal adjusted for chance in 2AFC,
    P(x) = 0.5 + 0.5 * (2*Phi(x/sigma) - 1) for x >= 0; each target-alone performance is inverted to
    a stimulus value x, the crowded prediction is P(x / k) for threshold elevation k, and the
    likelihood of the observed crowded performance is binomial; k is the maximum of the product
    of likelihoods. Figure 2F points are the mean over the two animals' estimates, error bars
    SEM by bootstrap over data points. Open details. The binomial trial count is not given; the
    readings are (a) the number of held-out test trials of the pair and (b) all trials of the pair.
    The form of the chance adjustment is read as above, which equals Phi(x/sigma) for x >= 0 and
    gives 0.5 at no orientation difference, as the Figure S2 curves do; the paper's only
    parameter is sigma, and threshold elevation scales it (Figure S2 legend). Points with target-alone performance at or below 0.5, or at 1, cannot be
    inverted; they are dropped (a standard choice). The permutation test is not described; the
    reading is that the target-alone and crowded labels are swapped at random within each data
    point, 1000 times, and p is the fraction of permuted estimates at least as large as the
    observed one. Reproduced when, under one reading, both values are within tolerance, and p <
    0.05 at 1.3, 1.6 and 2.1 degrees but not at 2.6; partially reproduced when the values hold
    and the significance pattern differs at one spacing.
