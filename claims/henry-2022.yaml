# Claims for Henry & Kohn (2022), "Feature representation under crowding in macaque V1 and V4
# neuronal populations", Current Biology 32, 5126-5137, doi:10.1016/j.cub.2022.10.049, tested on
# CRCNS data set v4-2 (doi:10.6080/K0736P4H).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-10,
# protocol as stated in docs/protocol.md (Reader), version pilot-14.
#
# Text read: the version of record, as extracted from the PDF under paper/ (main text, STAR
# Methods pages e1 to e3, and the Supplemental Information with the legends of Figures S1 to S7).
# The PDF pages could not be rendered in this run, so no figure was read beyond its legend and the
# axis labels and counts the extraction keeps. The extraction garbles the degree sign and the
# formulas of the tuning model and its likelihood; they are read here as
# rTD = m*rT + a*mean(rT), and logL = sum log(rTD^r exp(-rTD) / r!), r the observed response with
# distractors. The data set's description (paper/v4-2.data-description.txt) was read only to know
# what it holds; no claim comes from it.
#
# Code: the paper links none. Data and code availability names only the CRCNS deposit, and says
# "Any additional information required to reanalyze the data in this paper is available from the
# lead contact upon request." Analysis was in Matlab 2014a (STAR Methods). So every method detail
# below is from the Methods, the legends or the supplement, and details none of them fixes are
# named as open in the criteria.
#
# Data the paper used. Two adult male cynomolgus macaques (Macaca fascicularis), monkeys AL and
# CA, with Utah arrays in V1 and V4 of the left hemisphere, fixating within a 1.3 degree window.
# Each trial showed two 0.25 s stimulus epochs separated by 0.35 s of blank. The target was a 1
# degree drifting grating (1.5 cycles/degree, 4 Hz, 50% contrast) at 2.8 or 3.6 degrees
# eccentricity in the lower visual field; target orientations spanned 18 degrees around a
# reference in steps of 4 to 6 degrees (four orientations, -9, -3, 3, 9, in the Figure 6A
# examples). On some presentations 4 distractors at +/-10 degrees from the reference surrounded the
# target, center-to-center spacing 1.3, 1.6, 2.1 or 2.6 degrees. The whole ensemble was also shown
# rotated by 90 degrees; each of the two orientation ranges of a session is a separate population.
# Main experiment: 11 sessions, 22 populations per area, 396 V1 and 691 V4 neurons driven by the
# targets (responses at least 1 SD above spontaneous). A separate set of 4 sessions with fixed
# spacing and two distractor configurations differing in distractor orientation (Figure 6E only).
# The measured variable is each neuron's total spike count 0 to 0.25 s after each stimulus onset.
# The data set's description lists two files matching these two experiments (distractor separation
# and distractor orientation) and 15 sessions.
#
# A "neuron" in the paper's counts is a unit within one population (one session and orientation
# range): 22 populations of mean size 19 (V1) and 31 (V4) give about 396 and 691. The criteria
# count neurons that way.
schema_version: 2
paper: doi:10.1016/j.cub.2022.10.049
