    tolerance: 2.3
    unit: percent
  - quantity: V1 neurons with significant facilitation, closest spacing
    value: 27
    tolerance: 2.7
    unit: percent
  - quantity: V1 significant facilitation, farther spacings
    value: 2.5
    tolerance: 0.25
    unit: percent
  - quantity: V1 significant suppression, farther spacings
    value: 13
    tolerance: 1.3
    unit: percent
