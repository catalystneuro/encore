  source: Results, paragraph 4 (before "Distractors limit target discriminability"); Results,
    Distractors limit target discriminability, paragraph 1; Figure 3D and 3E (n)
  quote: We recorded in 11 sessions, yielding 22 neuronal populations in each area. The size of V1
    populations was on average 19 ± 1.9 neurons, and the size of V4 populations was 31 ± 3.4
    neurons.
  expected:
  - quantity: sessions of the distractor-spacing experiment
    value: 11
    tolerance: 0
  - quantity: populations per area
    value: 22
    tolerance: 0
  - quantity: mean V1 population size
    value: 19
    tolerance: 1.9
    unit: neurons
  - quantity: mean V4 population size
    value: 31
    tolerance: 3.4
    unit: neurons
  - quantity: V1 neurons
    value: 396
    tolerance: 40
    unit: neurons
  - quantity: V4 neurons
    value: 691
    tolerance: 69
    unit: neurons
  criterion: Counts are exact for sessions and populations. The selection is the Methods' one,
    "responses ≥ 1 s.d. above spontaneous rate", to the targets in isolation. The Methods do not
    say which response is compared (the mean over all isolated targets, or the best target) nor
    how the spontaneous rate and its SD are measured; the readings are (a) the mean count to the
    isolated targets against the mean plus 1 SD of the spontaneous count, (b) the largest of the
    per-orientation means against the same. Population sizes are tolerated by the reported SEM
    and neuron totals by 10%; the claim is reproduced when every value holds under one reading.
    The per-animal neuron counts of Figure S7 (V1 264 and 132, V4 288 and 403; which animal is
    which could not be read) are reported too.
- id: fig1b-v4-rf-larger
  statement: V4 receptive fields are many-fold larger than V1 receptive fields, and the aggregate
    receptive field maps of the V1 and V4 populations overlap substantially in each animal.
  source: Results, paragraph 2; Figure 1B
  quote: As expected, individual V1 receptive fields were small, and the receptive fields of V4
    neurons were many-fold larger (Figure 1B, top). Aggregate receptive field maps showed
    substantial overlap in the visual field representation of recorded V1 and V4 populations in
    each animal
  criterion: The maps come from dedicated mapping sessions (small gratings on a 9 x 9 degree grid
    at 1 degree resolution, 4 orientations, STAR Methods, Visual stimuli). If those data are held,
    receptive field area per neuron is the count of grid locations whose mean response exceeds
    half the neuron's peak (a standard choice; the paper gives no size measure). The paper gives no
    number for "many-fold"; at least twice is the reading taken, not the paper's. Reproduced when
    the median V4 area is at least twice the median V1 area and the target location lies inside
    the aggregate maps of both areas in each animal.
