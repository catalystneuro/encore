- id: ext3-2-sensitivity
  data: with_labels
  depends_on:
  - session-link
  statement: The L2/3, AL and AM specificity of the unscrambled against scrambled ND difference
    holds for nearly all choices of distance metric, state length, frequency spacing and
    spectral window.
  source: Extended Data Figures 3-2, 3-3 and 3-4 legends; Results, Increased differentiation for
    unscrambled stimuli is specific to areas AL and AM, paragraph 2
  quote: For nearly all other combinations of parameters, we likewise find that unscrambled stimuli
    elicit increased ND specifically in L2/3 of AL and AM
  criterion: ND recomputed for the 108 parameter sets of the code (main.ipynb), with state length
    0.2, 0.5, 1, 2, 5 and 10 s; Euclidean, city block and Chebyshev distance; linear or
    log-spaced frequency bins (code to_log_spacing); rectangular window without overlap
    (Fig. 3-2), Tukey (alpha 0.25) with 12.5% overlap (Fig. 3-3) and Kaiser (beta 14) with 50%
    overlap (Fig. 3-4), the windowed ones by scipy.signal.spectrogram rescaled to the FFT
    power as in spectral_differentiation.py. Then the layer and area models and post hoc
    tests of fig3a-layer-specific and fig3b-area-specific for each. A set agrees when both
    interactions have p < 0.05, L2/3 is the only significant layer and AL and AM are the only
    significant areas. The paper does not quantify "nearly all"; readings are at least 90% and
    at least 80% of the 108 sets. Reproduced when the share of agreeing sets meets the reading;
    the outcome is the one both readings give, and blocked as methods_underspecified when they
    differ. The share is also reported per window type, and for the looser rule that L2/3, AL
    and AM are each significant.
