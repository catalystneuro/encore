# Claims for Mayner, Marshall, Billeh et al. (2022, eNeuro 9(1) ENEURO.0280-21.2021) on dandiset 000036.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-22,
# protocol as stated in docs/protocol.md (version pilot-10).
#
# Source: the version of record, full text as served by Europe PMC (PMC8856714), read from its
# Materials and Methods, Results, Discussion, figure legends, the legends of the Extended Data
# figures, Table 1 and Table 2. The Extended Data figures are image files (TIF) whose legends
# are in the text; the images were not seen and no PDF was stored. Extended Data 1 is the
# analysis code, the same as the GitHub repository below. Numbers shown only in a figure are
# not claimed, except the cell counts of Extended Data Figure 1-2, taken from the code's own
# output (see ext1-2-cell-counts).
#
# Code read: https://github.com/wmayner/openscope-differentiation at commit
# 2d959bd71b47055d2a3fd306091fe9254ceb86fb (2021-12-14), linked in Code accessibility. It
# holds load.py (loading and preprocessing of dF/F, L0 events, running and pupil data),
# spectral_differentiation.py (the ND measure), analysis.py (session and stimulus subsets,
# Cohen's d), main.ipynb (ND for every trial and every sensitivity parameter set, UMAP and
# mean centroid distance, decoding), stats.ipynb (LME models, post hoc tests, mediation),
# table-1.ipynb (permutation tests), stimulus_properties.ipynb (stimulus differentiation and
# low-level properties), one notebook per figure, umap-params.yml, and results/: the paper's
# own outputs, among them per-trial ND for all 44 sessions (main.parquet, with session ids,
# layer, area, ncells and stimulus names), per-session decoding scores, permutation-test
# results, the printed R outputs of every LME test (results/stats*), and cells per layer and
# area (table-s1.csv). The author may use these to link the dandiset's sessions and values to
# the paper's (a link claim is the author's to add).
#
# Data the paper used. Two-photon calcium imaging (GCaMP6f, Nikon A1R MP+, 30 Hz, 400-um field
# of view) of excitatory neurons in left visual cortex of head-fixed mice free to run on a
# disk, Allen Brain Observatory OpenScope pipeline. Nine mice, three per Cre line: Cux2-CreERT2
# (L2/3; two males), Rorb-IRES2-Cre (L4; three males), Rbp4-Cre (L5; one male), each crossed
# with Camk2a-tTA and Ai93. 45 sessions, one per layer and area pair three times (15 per line,
# 9 per area: V1, LM, AL, PM, AM, i.e. VISp, VISl, VISal, VISpm, VISam), 5 +/- 1 per mouse; one
# L5 AL session was excluded for recording problems, leaving 44 (the excluded one is the L5 AL
# session absent from the code's results/main.parquet). Each 70-min session: 60 s of
# mean-luminance gray, 60 s of sparse noise (neither analysed), then 10 randomized blocks of 12
# 30-s greyscale movies with 4 s of gray between movies. The 12 movies (stimulus names as in
# the code): natural are mouse montage 1, mouse montage 2, human montage, mousecam, snake
# (predator), crickets (prey), man writing, conspecifics; artificial are mouse montage 1,
# temporal phase scramble; mouse montage 1, spatial phase scramble; mousecam, spatial phase
# scramble; noise. The main contrast uses five: unscrambled (mouse montage 1, mousecam) and
# scrambled (the three phase scrambles), 10 trials each, so 2200 trials over 44 sessions.
# The five continuous natural clips are snake, crickets, man writing, mousecam and
# conspecifics. Measured variables: dF/F traces per cell (Allen pipeline, de Vries et al.
# 2020), L0 calcium events detected from dF/F, running wheel velocity, pupil from the right
# (ipsilateral) eye video, stimulus presentation times, and the stimulus movies (192 x 120
# pixels, 30 frames/s, uint8). The archive title and description of dandiset 000036 name this
# paper and give its abstract, so it should hold these sessions. Stimulus names may need
# a mapping from codes; the code's stimulus metadata gives it.
#
# Outside data. The code's README (not the paper's text) says the processed data the code
# reads are at Zenodo doi:10.5281/zenodo.4734580: dF/F per session (h5), L0 events per cell,
# pupil area, running speed, per-session artifact-removal parameters for running and pupil
# (preprocessing_params.yaml), stimulus tables, the stimulus movies, session metadata (with a
# "valid" flag for the excluded session) and time synchronization. The paper also relies on
# the median L2/3 V1 receptive field radius of de Vries et al. (2020), 8.92 degrees, for the
# stimulus blur (Fig. 8); the code takes it as a 250 deg^2 RF area and a screen of 120 x 95
# degrees spanning the 192 x 120 pixels. The L0 event detector is
# https://github.com/AllenInstitute/visual_coding_2p_analysis (l0_analysis.py), named in
# Methods, Event detection.
#
# Method fixed by the Methods and the code, used by every ND claim below (call it "ND"):
# for each trial, the dF/F of every cell of the session over the 2p frames from the
# presentation's start frame to its end frame (code load.py, load_aligned_stimulus), truncated
# to a whole number of 1-s windows (at most 23 frames dropped, spectral_differentiation.py),
# taken at the nominal 30 Hz; split into contiguous 1-s windows of 30 samples, no taper, no
# detrending; power spectrum of each window and cell as |rfft|^2 (16 linear frequency bins
# including DC); the state of a window is the concatenation of all cells' spectra; ND is the
# median of the 435 pairwise Euclidean distances among the 30 states, divided by the square
# root of the session's number of cells, then log10 (code main.ipynb, postprocess; Methods,
# Spectral differentiation and LME models). Stimulus category is unscrambled (natural) against
# scrambled (artificial). LME models are fitted by maximum likelihood (lme4 lmer, REML =
# FALSE) with a random intercept per session, on per-trial log10 ND, and the interaction is
# tested by a likelihood ratio test against the additive model. Post hoc tests are one-sided
# z-tests (alternative "greater") of the natural minus artificial contrast within each layer or
# area (multcomp glht), with single-step adjusted p-values and simultaneous 95% intervals
# (stats.ipynb). Cohen's d uses the pooled SD of per-trial log10 ND (analysis.py, cohens_d).
# The 95% CIs the paper prints for the post hoc tests are intervals of the contrast estimate on
# the log10 scale, not of Cohen's d (results/stats outputs). Running speed is aligned to 2p
# frames, cleaned, interpolated and low-pass filtered at 1 Hz (second-order Butterworth applied
# forward and backward, as in Methods, Locomotion); locomotion is |filtered velocity| >= 2.5
# cm/s; per-trial and per-session arousal values are means over frames (main.ipynb). Pupil
# diameter is normalized by its maximum within the 10 blocks.
#
# Details the paper leaves open, and the readings named in the criteria. (1) Artifact removal
# for running and pupil uses parameters chosen by hand per session (Methods, Locomotion and
# Pupillometry); they are not in the paper or the repository. Readings are (a) no artifact
# removal beyond interpolation of missing samples and the filter, (b) the per-session
# parameters of the Zenodo deposit. (2) Pupil diameter is twice the semi-major axis of the
# fitted ellipse in Methods and 2*sqrt(area/pi) in the code (load.py); the Methods reading is
# the main one and the code's is a variant. (3) Multivariate ND of events: Methods discard 1-s
# bins with no events before UMAP; the code's line that selects active bins is not assigned
# and keeps them. Methods reading main, code variant. (4) Isolated events for the indicator
# kinetics (Extended Data Fig. 1-3): the legend gives 50 ms before and 100 ms after; the code
# uses 50 samples before and 100 samples after (1.67 s and 3.33 s). Methods reading main,
# code variant. (5) The permutation test counts permutations "greater than" the observed
# difference (Methods) and the code counts "greater than or equal" and calls p <= 0.05
# significant; with 20,000 permutations these cannot differ by more than a session at the
# threshold, and both are shown. (6) Spectral energy removes "the DC component" (Extended
# Data Fig. 8-1 legend); the code subtracts the movie's global mean. Readings are per-pixel
# mean removal (legend) and global mean removal (code). (7) Wording read as thresholds: see
# the criteria of the decoding and sensitivity claims.
#
# Inconsistencies in the paper, recorded where they bear on a claim. The Extended Data Fig. 3-1
# legend gives the area interaction as chi2(2) = 16.343, p = 0.000283, the layer values
# repeated; the code's printed output gives chi2(4) = 22.213, p = 0.0001817. The Fig. 8
# scrambled-pairs correlation has p = 0.530 in Results and p = 0.523 in the legend. Stimuli
# says "four continuous stimuli" and lists five. Table 2 gives CI bounds 0.0180 and 0.00507
# where Results give 0.0181 and 0.00508 (Fig. 5). The Extended Data Fig. 3-8 and 3-9 legends
# call the contrast "naturalistic or artificial" for what is the unscrambled and scrambled
# subset (code stats.ipynb, stimulus_is_scrambled_pair).
schema_version: 2
dataset:
  archive: dandi
  id: "000036"
paper: doi:10.1523/eneuro.0280-21.2021
claims:
- id: session-link
  kind: link
  statement: The dandiset's sessions can be matched to the 44 sessions the paper analysed (the
    results/main.parquet of the paper's code), and matched sessions agree on mouse, Cre line,
    area, depth and number of cells, and give the paper's per-trial ND.
  source: Code accessibility; results/main.parquet of github.com/wmayner/openscope-differentiation
    at commit 2d959bd
  data: with_labels
  criterion: Added by the author of attempt 000036-mayner-2022-01. Sessions are matched on mouse id
    and start time, the NWB session_start_time minus 7 hours being equal to the start_time of
    main.parquet to the millisecond (the session identifiers differ; the offset was found while
    preparing the attempt). The link holds (reproduced) when all 44 paper sessions match one
    dandiset session each, every matched session agrees on Cre line, area, depth and the number of
    cells with a dF/F trace, and the dandiset's dF/F gives the paper's unnormalised per-trial ND to
    a relative 1e-6 for at least 90% of trials when the trial start may move by -8 to +3 frames
    from where the NWB stimulus times put it. Partially reproduced when all sessions match but an
    agreement holds for fewer sessions or fewer trials; not reproduced when fewer than 44 sessions
    match. The unmatched dandiset sessions are listed, and the one that fits the excluded L5 AL
    session is named.
- id: design-sessions
  data: with_labels
  depends_on:
  - session-link
  statement: Data come from 45 two-photon sessions in nine mice (three per Cre line for L2/3,
    L4 and L5), 15 sessions per line and 9 per area over V1, LM, AL, PM and AM, with one L5 AL
    session excluded for recording problems.
  source: Results, paragraph 1 and 2; Materials and Methods, paragraph 1
  quote: Data were collected from L2/3, L4, and L5 in each of five areas (V1, LM, AL, PM, and AM;
    Fig. 1 E ) across 45 experimental sessions (15 sessions per transgenic line; 9 sessions per
    area; 5 ± 1 sessions per mouse ... One imaging session in L5 of AL was excluded from our
    analyses because of technical problems with the two-photon recording
  expected:
  - quantity: experimental sessions
    value: 45
    tolerance: 0
  - quantity: mice
    value: 9
    tolerance: 0
  - quantity: sessions per Cre line (Cux2, Rorb, Rbp4)
    value: 15
    tolerance: 0
  - quantity: sessions per area
    value: 9
    tolerance: 0
  criterion: Counts of sessions, subjects, Cre lines and targeted areas in the dataset. Counts
    are exact (a tolerance of 10% is under one unit). Reproduced when the dataset holds 45
    sessions from 9 mice, 3 mice and 15 sessions per line, 3 sessions per layer and area pair;
    a dataset that holds only the 44 analysed sessions, the one missing being in L5 AL, also
    counts as reproduced, since the paper excluded that session (Results, paragraph 1);
    partially reproduced when it holds a subset of them that matches these counts in part.
    The sex of each mouse (L2/3 two males, L4 three, L5 one) and sessions per mouse (5 +/- 1)
    are reported. Whether the excluded L5 AL session can be identified (by its absence from
    the code's results/main.parquet) is reported.
- id: ext1-2-cell-counts
  data: with_labels
  depends_on:
  - session-link
  statement: 4018 cells were recorded over the 44 analysed sessions, 1683 in L2/3, 1781 in L4
    and 554 in L5, with per layer and area totals from 62 (L4 AM) to 649 (L4 V1).
  source: Extended Data Figure 1-2
  inferred: Extended Data Figure 1-2 shows the counts as an image not in the text; the numbers
    are the code's own output of that figure (results/table-s1.csv at the commit named in the
    opening comment), the sums of the session metadata's ncells per layer and area.
  expected:
  - quantity: cells, all 44 sessions
    value: 4018
    tolerance: 401.8
  - quantity: cells, L2/3
    value: 1683
    tolerance: 168.3
  - quantity: cells, L4
    value: 1781
    tolerance: 178.1
  - quantity: cells, L5
    value: 554
    tolerance: 55.4
  criterion: Per session, the number of cells (ROIs) whose dF/F traces the dataset holds,
    summed per layer, per layer and area pair, and overall, over the 44 analysed sessions.
    Reproduced when the totals are within tolerance; the 15 layer and area totals of
    table-s1.csv (L2/3 V1 451, LM 353, AL 336, PM 259, AM 284; L4 V1 649, LM 456, AL 479, PM
    135, AM 62; L5 V1 126, LM 185, AL 86, PM 76, AM 81) are compared and the number within
    10% reported. If the dataset holds more ROIs than the paper used (for example invalid
    ROIs), the count after any validity flag the dataset gives is shown too.
- id: ext1-3-kinetics-no-difference
  data: with_labels
  depends_on:
  - session-link
  statement: Calcium indicator kinetics, measured as the half-life of an exponential fit to each
    cell's mean isolated-event-locked dF/F, do not differ across layers, areas or their
    interaction.
  source: Extended Data Figure 1-3 legend
  quote: we found no layer × area interaction (likelihood ratio test; χ 2 (8) = 1.293, p = 0.996).
    We tested for main effects of layer and area in two further models and likewise found none
  statistics:
  - about: layer x area interaction
    test: likelihood ratio test, LME models
    statistic: chi2(8) = 1.293
    p: 0.996
  - about: layer main effect
    test: likelihood ratio test, LME models
    statistic: chi2(2) = 1.143
    p: 0.565
  - about: area main effect
    test: likelihood ratio test, LME models
    statistic: chi2(4) = 0.2288
    p: 0.994
  criterion: A claim of absence, judged on the paper's tests. Per cell, isolated L0 events (no
    other event in the window around it), the mean dF/F trace locked to them, an exponential
    a0 + a1 exp(-lambda t) fitted by least squares from the event to the end of the window,
    half-life ln 2 / lambda (legend; code fig_1-3.ipynb). LME models of half-life with session
    as random intercept, fitted by maximum likelihood, layer * area against layer + area; then
    layer + area against area alone, and against layer alone (code). Reproduced when none of
    the three likelihood ratio tests has p < 0.05; not reproduced when any does. The window
    has readings (a) 50 ms before and 100 ms after (legend, main) and (b) 50 and 100 samples
    (code, variant). Events come from the dataset if it holds L0 events; otherwise from the
    linked l0_analysis.py run on the dataset's dF/F. The median R2 of the fits and the lowest
    R2 (0.61 in the paper) are reported.
- id: fig3a-layer-specific
  data: with_labels
  depends_on:
  - session-link
  statement: Unscrambled stimuli evoke higher ND than their phase-scrambled versions in L2/3
    but not in L4 or L5, with a significant layer by stimulus category interaction.
  source: Results, Increased differentiation for unscrambled stimuli is specific to excitatory
