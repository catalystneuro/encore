  quote: We fitted an LME model with stimulus category (unscrambled or scrambled), layer, and their
    interaction as fixed effects and found a significant interaction (likelihood ratio test, χ 2
    (2) = 13.379, p = 0.00124). Post hoc tests showed that the unscrambled versus scrambled
    difference was specific to L2/3
  statistics:
  - about: layer x stimulus category interaction
    test: likelihood ratio test
    statistic: chi2(2) = 13.379
    p: 0.00124
    n: 2200 trials in 44 sessions
  - about: L2/3, unscrambled greater than scrambled
    test: post hoc one-sided z-test
    statistic: z = 3.866, Cohen's d = 0.164, 95% CI of the contrast [0.051, inf)
    p: 1.66e-4
    corrected: single-step (multcomp)
  - about: L4
    test: post hoc one-sided z-test
    statistic: z = 0.191, Cohen's d = 0.011
    p: 0.810
    corrected: single-step (multcomp)
  - about: L5
    test: post hoc one-sided z-test
    statistic: z = -1.168, Cohen's d = -0.067
    p: 0.998
    corrected: single-step (multcomp)
  expected:
  - quantity: likelihood ratio chi2, layer x category
    value: 13.379
    tolerance: 1.338
  - quantity: Cohen's d, L2/3, unscrambled against scrambled
    value: 0.164
    tolerance: 0.0164
  criterion: ND as in the opening comment for the 5 stimuli of the contrast over the 44
    sessions; the layer model and post hoc tests as in the opening comment (Methods, LME models
    and Post hoc tests; code stats.ipynb). Reproduced when the likelihood ratio test has p <
    0.05, the L2/3 post hoc test has adjusted p < 0.05, and the L4 and L5 tests do not;
    partially reproduced when L2/3 is significant and the interaction or the absence in L4 or
    L5 fails. Cohen's d per layer over pooled trials (code fig_3 notebook, effect_sizes) is
    compared with the expected value; the post hoc z values and CI bounds are reported.
