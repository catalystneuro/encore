# Holographic perturbation of groups of five neurons (Figure 2, Extended Data Figs 5 to 9)
- id: fig2d-x1-integration
  statement: Photostimulation of five x1 neurons with four pulses at 20 s ISI produces
    integration in the x1 dimension, with ISI activity rising with each pulse and not returning
    to baseline.
  source: Figure 2c and 2d; Results, Holographic activation shows integration, paragraph 2
  quote: optogenetic reactivation of cohorts of five individual x 1 neurons yielded robust
    integration of activity in the entire x 1 dimension-weighted population, as evidenced by
    progressively increasing peak activity during the 20 s ISI after each consecutive pulse
  statistics:
  - test: Kruskal-Wallis test with Dunn's correction
    p: 0.0363
    n: 8 mice
