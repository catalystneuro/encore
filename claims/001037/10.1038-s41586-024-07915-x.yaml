  statement: Stimulating single x2 neurons does not raise activity in non-targeted x2 neurons.
  source: Figure 3g and 3j; Results, Line-attractor neurons form ensembles, paragraph 3
  quote: Quantification of activity in non-targeted x 2 neurons after targeting of single x 2
