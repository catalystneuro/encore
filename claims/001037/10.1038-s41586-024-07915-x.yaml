# Claims for Vinograd, Nair, Kim, Linderman & Anderson (2024), "Causal evidence of a line
# attractor encoding an affective state", Nature 634, 910-918, on dandiset 001037.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-22,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record (open access, corrected publication 2025) as served by
# Europe PMC (PMC11499281): main text, Methods, the legends of Figures 1 to 5 and of Extended
# Data Figures 1 to 12. The supplementary information is a Reporting Summary only; no result
# rests on it. No PDF was supplied, so figure panels were not read; findings shown only in a
# panel are taken from its legend and the Results.
#
# Code read. The paper links only the rSLDS library, github.com/lindermanlab/ssm (read at
# commit eb6c8aa), which has no analysis of this paper. The dandiset's description links the
# authors' sample code, github.com/neuralcomputation/hypothalamic-dynamics (read at commit
# 28fee70; its example data files were not opened). It is ranked below the Methods. It fixes:
# the time constant of an rSLDS eigenvalue as abs(1/log(abs(lambda))) divided by the frame
# rate, in seconds (the Methods give 1/log(lambda) in frames); the projection of a session
# onto x1 or x2 as the stored rSLDS factor weights (rSLDS_factor_1, rSLDS_factor_2) times the
# z-scored activity, smoothed with a moving average and baseline-subtracted over the window
# stored per session in ProjectionMetadata (projection_factor names which factor is the
# integration (x1) and which the "novel" (x2) projection); photostimulation pulse onsets at
# frames 150, 360, 570 and 780 (10 Hz) for the 20 s ISI sessions and 140, 240, 340 and 440 for
# the 8 s ISI sessions; observation traces aligned so that BALB/c entry falls at 50 s and
# baseline-subtracted over their first 100 frames; and, for 2P observation fits, an rSLDS of
# 2 states and 2 latent dimensions (l2_penalty_A 820, l2_penalty 100, alpha 0.9, 150
# Laplace-EM iterations), and for miniscope fits 3 states and 2 dimensions (l2_penalty_A 10,
# l2_penalty 500, alpha 0.5, 100 iterations). The notebooks call these "representative"
# settings, so where a claim needs a new fit the number of states is also taken as the Methods
# give it (fivefold cross-validation), and both are readings.
#
# Data the paper used. Male Esr1-Cre mice expressing jGCaMP7s in VMHvl Esr1 neurons.
# (1) Microendoscope (miniscope) imaging at 30 Hz, downsampled to 10 Hz, CNMF-E traces, in 5
# freely behaving mice, each recorded engaging in aggression (a BALB/c intruder introduced
# twice into the home cage) and observing aggression (a Swiss Webster (SW) demonstrator
# attacking BALB/c intruders), in random order, with a 5 min solitary baseline at the start of
# each session; annotations of sniff and attack, observed attack, intruder entries and
# removals (Extended Data Figs 1 to 4). (2) Two-photon imaging at 10 Hz through a GRIN lens in
# 9 head-fixed mice on a treadmill observing aggression (SW resident and BALB/c intruders);
# rSLDS fits identify x1 (integration) and x2 neurons (Fig. 1). (3) After removal of the
# demonstrators, holographic photostimulation (ChRmine) in the same preparation: groups of 5
# x1 neurons (n = 8 mice) or 5 x2 neurons (n = 7) with four pulses at 20 s ISI, and 8 s ISI
# (n = 7); 1 mW against 5 mW per neuron; x1 stimulation followed by x2 stimulation; random
# non-weighted neurons (n = 5); unitary x1 neurons (25 neurons, 8 mice) and unitary x2
# neurons (18 neurons, 7 mice) with imaging of non-targeted neurons (Figs 2, 3 and 5,
# Extended Data Figs 6 to 10, 12). Also: motion SVDs from face video of the head-fixed mice
# (Extended Data Fig. 5) and a calibration of photostimulation spatial resolution on 17
# reference cells (Extended Data Fig. 6). Figure 4 is a simulation of a spiking network and
# uses no recorded data except the 36% connection density measured in Fig. 4a.
#
# Method details used by several criteria, from the paper unless said otherwise:
# - Tests. The Methods say all tests are two-tailed and nonparametric. The Mann-Whitney
#   p-values at n = 5 (0.0079) and n = 4 (0.0286) are the smallest exact two-sided values of
#   the unpaired test, which a paired signed-rank test cannot reach, so a Mann-Whitney test is
#   run unpaired even where the Methods say "binary paired samples". Some other printed values
#   are exact two-sided values of the paired Wilcoxon signed-rank test and of no exact
#   unpaired Mann-Whitney test: 0.125 and 0.1875 (printed 0.187, 0.188) at n = 5, 0.8125 at
#   n = 7 (Extended Data Figs 3e, 3f, 4h, 5e); 0.0078 at n = 9 (Fig. 1m) fits both. For those
#   claims both readings (unpaired Mann-Whitney, paired signed-rank over mice) are run. Kruskal-Wallis tests use
#   one value per mouse and condition, followed by Dunn's correction, as the legends name them.
# - Projections onto x1 and x2 follow the sample code (above).
# - ISI windows (W). The legends compare "the average z-scored activity ... during the
#   baseline or ISIs" without giving the windows. Baseline is the period before the first
#   pulse. The readings are (Wa) each ISI from the end of the 2 s pulse to the next onset (for
#   the last pulse, the same length after it), and (Wb) each ISI from one onset to the next.
# - Dunn comparisons (C). The legends print three or four p-values per panel without saying
#   which pairs they compare. The readings are (Ca) each ISI against baseline and (Cb) each
#   ISI against the one before it (the first against baseline).
# - Pulse parameters. The Results give "2 s, 20 Hz, 5 mW" and the Methods "10 Hz, 2 s, 10 ms
#   pulse width". The attempt takes the pulse timing from the stored stimulation frames.
schema_version: 2
dataset:
  archive: dandi
  id: "001037"
paper: doi:10.1038/s41586-024-07915-x
claims:
# ---------------------------------------------------------------------------------------
# Freely behaving mice, miniscope (Extended Data Figs 1 to 4)
- id: ed1n-engaging-x1-slower
  statement: In freely behaving mice engaging in aggression, rSLDS fits show an integration
    dimension x1 with a longer time constant than the orthogonal dimension x2, an approximate
    line attractor.
  source: Extended Data Fig. 1n and 1o; Results, Line attractor for observing aggression, paragraph 1
  quote: revealed an approximate line attractor under both conditions, exhibiting ramping and
    persistent activity aligned and maintained across both performed and observed attack sessions
  statistics:
  - test: two-tailed Mann-Whitney U-test
    p: 0.0079
    n: 5 mice
  criterion: For each mouse, an rSLDS with 2 latent dimensions fit to the engaging session
    (number of states by fivefold cross-validation, Methods, or 3 states with the sample
    code's settings; both readings run). The cvR2 of each fit is reported; no mouse is
    excluded by the Methods' 70% rule, since the paper reports n = 5 in both conditions while
    the mean observation cvR2 it gives (67.2%) is below 70%. Time constants from the eigenvalues of each state's dynamics matrix as the sample code
    computes them; x1 is the dimension with the larger time constant in the state that holds
    the slow dynamics (the state with the largest time constant). Reproduced when the x1 time
    constants exceed the x2 time constants across the 5 mice by a two-tailed unpaired
    Mann-Whitney test at p < 0.05. The line attractor score, log2 of the largest over the
    second largest time constant (Methods), is reported per mouse.
- id: ed1p-observing-x1-slower
  statement: In the same mice observing aggression, rSLDS fits also show an x1 dimension with a
    longer time constant than x2.
  source: Extended Data Fig. 1p and 1q; Results, Line attractor for observing aggression, paragraph 1
  quote: revealed an approximate line attractor under both conditions
  statistics:
  - test: two-tailed Mann-Whitney U-test
    p: 0.0079
    n: 5 mice
  criterion: As ed1n-engaging-x1-slower, on the observation sessions.
- id: ed1m-x1-observe-attack-vs-sniff
  statement: In freely behaving mice, average x1 activity differs between sniffing the SW mouse
    and observing the SW mouse attack a BALB/c intruder.
  source: Extended Data Fig. 1m
  quote: Average activity in the x 1 dimension during sniffing of the SW mouse, vs observing the SW
    mouse a BALB\c intruder (n = 4 mice, *p = 0.0286, Two-tailed Mann Whitney U -test
  statistics:
  - test: two-tailed Mann-Whitney U-test
    p: 0.0286
    n: 4 mice
  depends_on:
  - ed1p-observing-x1-slower
  criterion: The legend is garbled and the panel was not read, so the direction is not fixed
    from the text. Per mouse, the mean of the x1 projection of the observation session over
    frames annotated as sniffing the SW mouse and over frames annotated as observing attack.
    Reproduced when a two-tailed unpaired Mann-Whitney test over mice gives p < 0.05; the
    direction is reported. The legend's n of 4 (of 5 mice) is not explained; all mice with
    both annotations are used and the count is reported.
- id: ed3c-x1-activity-observe-vs-engage
  statement: The activity of x1 neurons during observed attack bouts does not differ from their
    activity during engaged attack.
  source: Extended Data Fig. 3c
  quote: comparison of the activity during observing attack bouts and engaging in attack (n = 5 mice,
    p = 0.42, Two-tailed Mann-Whitney U -test
  statistics:
  - test: two-tailed Mann-Whitney U-test
    p: 0.42
    n: 5 mice
  depends_on:
  - ed1n-engaging-x1-slower
  - ed1p-observing-x1-slower
  criterion: A claim of absence, judged on the paper's test. Per mouse, the mean activity of the
    x1 neurons of each condition during attack bouts (observed or engaged). Reproduced when a
    two-tailed Mann-Whitney test over mice gives p >= 0.05; not reproduced when p < 0.05. The
    difference is reported either way. Which neurons are x1 neurons is not fixed beyond the
    rSLDS weights; the readings are the five neurons with the largest absolute x1 weight (as
    in Fig. 1i) and the neurons the dataset marks as x1, if it does.
- id: ed3e-achw-full-session
  statement: Over the full interaction, autocorrelation half-widths of x1 neurons are similar
    when observing (25 +/- 0.8 s) and engaging in aggression (20 +/- 1.7 s).
  source: Extended Data Fig. 3e
  quote: "mean achw during observation: 25 ± 0.8s, mean achw during engagement: 20 ± 1.7s, n=5 mice,
    p = 0.125"
  statistics:
  - test: two-tailed Mann-Whitney U-test
    p: 0.125
    n: 5 mice
  expected:
  - quantity: mean ACHW of x1 neurons, observation
    value: 25
    tolerance: 0.8
    unit: s
  - quantity: mean ACHW of x1 neurons, engagement
    value: 20
    tolerance: 1.7
    unit: s
  depends_on:
  - ed1n-engaging-x1-slower
  - ed1p-observing-x1-slower
  criterion: Autocorrelation per neuron as in Methods equations 7 and 8 (the sample code's
    autocorr_matlab). The half-width is not defined beyond its name; the reading is the first
    lag at which the autocorrelation falls to 0.5 or below, in seconds at 10 Hz. Per mouse,
    the mean over x1 neurons (readings of x1 neurons as in ed3c). The "full interaction" is
    not bounded in the paper; readings are the whole session and the span from the first
    intruder entry to the last removal. Expected values within tolerance, and, as a claim of
    absence, a two-tailed test over mice with p >= 0.05, run as an unpaired Mann-Whitney test
    and as a paired signed-rank test (header, Tests; the printed 0.125 is an exact
    signed-rank value).
- id: ed3f-achw-after-removal
  statement: Aligned to removal of the last intruder, autocorrelation half-widths of x1 neurons
    are similar when observing (14 +/- 1 s) and engaging (11 +/- 1.6 s).
  source: Extended Data Fig. 3f
  quote: "mean achw during observation: 14 ± 1s, mean achw during engagement: 11 ± 1.6s, n = 5 mice,
    p = 0.187"
  statistics:
  - test: two-tailed Mann-Whitney U-test
    p: 0.187
    n: 5 mice
  expected:
  - quantity: mean ACHW of x1 neurons after last intruder removal, observation
    value: 14
    tolerance: 1
    unit: s
  - quantity: mean ACHW of x1 neurons after last intruder removal, engagement
    value: 11
    tolerance: 1.6
    unit: s
  depends_on:
  - ed3e-achw-full-session
  criterion: As ed3e-achw-full-session, on activity from the removal of the last intruder to the
    end of the session (the paper does not give the window's end; the session end is the only
    reading the legend allows), with both test readings (the printed 0.187 is the exact
    signed-rank value 0.1875 at n = 5).
- id: ed3g-decode-observed-attack
  statement: A decoder trained on x1 activity during observation separates observed attack bouts
    from non-attack bouts better than shuffled controls.
  source: Extended Data Fig. 3g
  quote: "A SVM decoder was trained on data from integration dimension activity to separate bouts of
    observing attack from non attack bouts. Right: Quantification of the decoder accuracy performance
    (n = 5 mice, p = 0.0079"
  statistics:
  - test: two-tailed Mann-Whitney U-test
    p: 0.0079
    n: 5 mice
  depends_on:
  - ed1p-observing-x1-slower
  criterion: As the Methods describe (Decoding behaviour from integration dimension). Attack
    bouts separated by less than 5 s merged into trials, classes balanced; a one-dimensional
    threshold on the normalized x1 signal fit by a linear SVM on training frames and scored on
    held-out frames; shuffles assign the behaviour labels randomly to bouts, 20 times, and
    1,000 times per mouse for the significance test (Methods). The Methods report accuracy
    "on data from all other trials for each mouse" without giving the split further; the
    readings are training on one trial and testing on all others, leave-one-trial-out, and
    fivefold over trials. Reproduced when decoder accuracy exceeds shuffled accuracy across mice by a
    two-tailed Mann-Whitney test at p < 0.05.
- id: ed3h-decode-engaged-from-observed
  statement: The decoder trained on observing attack decodes engaged attack from x1 activity
    better than shuffled data, so x1 encodes a similar variable in both conditions.
  source: Extended Data Fig. 3h; Results, Line attractor for observing aggression, paragraph 1
  quote: could be reliably used to decode from held-out data instances of both observation of and
    engagement in attack, suggesting that this dimension encodes a similar internal state variable
    under both conditions
  statistics:
  - test: two-tailed Mann-Whitney U-test
    p: 0.0079
    n: 5 mice
  depends_on:
  - ed3g-decode-observed-attack
  criterion: The decoder of ed3g-decode-observed-attack applied to the engaging session's x1
    signal (frames of attack against all others); the paper does not say whether the engaging
    session is projected with the observation model's weights or its own; both readings run.
    Reproduced when accuracy exceeds that of the shuffled decoder across mice by a two-tailed
    Mann-Whitney test at p < 0.05.
- id: ed4c-x1-neuron-overlap
  statement: Around 70% of the neurons that contribute to the line attractor overlap between
    observing and engaging in aggression.
  source: Extended Data Fig. 4c; Results, Line attractor for observing aggression, paragraph 1
  quote: suggesting that a highly overlapping set of neurons (70%) contributes to line-attractor
    dynamics during observing or engaging in attack
  expected:
    quantity: overlap of x1 neurons between conditions, mean over 5 mice
    value: 70
    tolerance: 7
    unit: percent
  depends_on:
  - ed1n-engaging-x1-slower
  - ed1p-observing-x1-slower
  criterion: The paper does not say how a neuron is counted as contributing, or the
    denominator. Readings for contributing are (a) the top five neurons by absolute weight, as
    in Fig. 1i, and (b) the neurons the dataset marks as x1 neurons, if it does. Readings for
    the overlap are the shared fraction of (i) the observation set and (ii) the engagement set.
    Reproduced when one reading gives a mean within tolerance.
- id: ed4d-weight-dot-product
  statement: The x1 weight vector during observation is more aligned with the x1 weight vector
    during engagement than with the x2 weight vector.
  source: Extended Data Fig. 4d
  quote: rSLDS weights of the x 1 dimension during observation were compared to model weights of the x
    1 and x 2 dimensions during engagement using a dot product of the two weight vectors. (n = 5
    mice, ***p = 0.0079
  statistics:
  - test: two-tailed Mann-Whitney U-test
    p: 0.0079
    n: 5 mice
  depends_on:
  - ed1n-engaging-x1-slower
  - ed1p-observing-x1-slower
  criterion: Per mouse, the dot product of the observation x1 weight vector with the engagement
    x1 vector and with the engagement x2 vector, over neurons present in both sessions. The
    paper does not say whether vectors are normalized or signs aligned; the readings are the
    raw dot product and the absolute dot product of unit vectors. Reproduced when x1-x1
    exceeds x1-x2 across mice by a two-tailed Mann-Whitney test at p < 0.05 under one reading.
- id: ed4g-x2-more-spontaneous
  statement: During the solitary baseline, x2 neurons show more frequent spontaneous calcium
    transients than x1 neurons (2.3 against 1.6 events).
  source: Extended Data Fig. 4g; Results, Line attractor for observing aggression, paragraph 2
  quote: we did see a slightly but significantly higher frequency of spontaneous calcium transients
    in x 2 neurons
  statistics:
  - test: two-tailed Mann-Whitney U-test
    p: 0.012
    n: 5 mice
  expected:
  - quantity: transient frequency of x1 neurons at baseline
    value: 1.6
    tolerance: 0.2
    unit: events
  - quantity: transient frequency of x2 neurons at baseline
    value: 2.3
    tolerance: 0.2
    unit: events
  depends_on:
  - ed1n-engaging-x1-slower
  - ed1p-observing-x1-slower
  criterion: A transient is a crossing above 1.5 standard deviations of the z-scored activity
    (legend) during the 5 min baseline at the start of the session (Methods, Behaviour
    annotations). The paper does not say per what time the frequency is, which session's
    baseline, or which model's x1 and x2 neurons are used; readings are events per baseline
    and per minute, and the engaging and observing sessions' baselines and models. Reproduced
    when x2 exceeds x1 across mice by a two-tailed Mann-Whitney test at p < 0.05; the values
