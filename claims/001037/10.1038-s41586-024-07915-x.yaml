    repeated activation of unitary x 2 neurons (Fig. 3f–h ), that increase was not statistically
    significant
  statistics:
  - test: Kruskal-Wallis test with Dunn's correction
    p: 0.999
    n: 7 mice (18 targeted neurons)
  - test: Kruskal-Wallis test with Dunn's correction
    p: 0.31
    n: 7 mice (18 targeted neurons)
  - test: Kruskal-Wallis test with Dunn's correction
    p: 0.09
    n: 7 mice (18 targeted neurons)
  - test: Kruskal-Wallis test with Dunn's correction
    p: 0.0316
    n: 7 mice (18 targeted neurons)
  criterion: A claim of absence, judged on the paper's test, as fig3d-single-x1-drives-x1 on
