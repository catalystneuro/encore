    values are within tolerance under one reading.
# ---------------------------------------------------------------------------------------
# Network model (Figure 4, Extended Data Fig. 11); a simulation, no recorded data
- id: fig4ce-excitatory-network
  statement: In purely excitatory spiking networks, only relatively sparse integration
    subnetworks (around 8 to 12%) with slow synaptic time constants (around 20 s) give network
    time constants of 50 to 200 s; fast glutamatergic networks fail over the same densities.
  source: Figure 4c-f; Results, Line-attractor neurons form ensembles, paragraph 5
  quote: we found that only artificial networks based on relatively sparse connectivity (around 8–12%)
    and slow synaptic time constants (around 20 s) could yield network time constants ( τ n ) in the
    experimentally observed range (~50–200 s; Fig. 4c,e (red shading)). By contrast, networks with
    fast glutamatergic connectivity failed to do so over the same range of connection densities
  criterion: A simulation as the Methods give it (Mechanistic modelling), 1,000 neurons, a
    200-neuron subnetwork, weights U(0, 1/N) and U(0, 1/Np), tau_n = tau_s / (1 - lambda_max).
    Reproduced when, at tau_s = 20 s, tau_n falls in 50 to 200 s (widened 10%, 45 to 220 s) for
    some density between 8% and 12% (widened, 7.2% to 13.2%), and at tau_s of 0.6 s or less no
    stable density in the simulated range of 0 to 20% (legend of Fig. 4c) gives tau_n of 45 s
    or more. Uses no recorded data.
- id: fig4hj-inhibition-slow-dense
  statement: With fast feedback inhibition, a network with slow transmission (20 s) and the
    measured 36% density integrates pulsed input like the data, while a fast glutamatergic
    network (100 ms) does not.
  source: Figure 4g-l; Results, Line-attractor neurons form ensembles, paragraph 6
  quote: networks simulated with a long τ s (20s) and dense σ (36%) could integrate digital
    optogenetic stimulation in a manner like that observed experimentally ... By contrast, purely
    glutamatergic networks ( τ s = 100 ms) were unable to integrate at the observed timescales given
    the measured connectivity density
  depends_on:
  - fig4a-dense-x1-connectivity
  criterion: The Methods network with inhibition (tau_I 50 ms, g = 1, g_inh 5 or 10, and 1 by
    the Methods or 1.25 by the legend of Fig. 4h, both run), four
    smoothed input pulses at 20 s ISI to a random 25% of neurons, Euler steps of 1 ms, noise
    N(0,1)/5. The pulse width and the calcium kernel are not given (readings 2 s, as in vivo,
    and an exponential kernel of 1 s decay as a standard choice that cannot change whether
    activity integrates). Reproduced when the subnetwork's mean rate at the end of each ISI
    rises from the first to the third ISI at tau_s 20 s and does not at tau_s 0.1 s, for one of
    the g_inh values. Uses no recorded data.
# ---------------------------------------------------------------------------------------
# Attractor stability and connectivity (Figure 5, Extended Data Fig. 12)
- id: fig5g-time-constant-vs-connectivity
  statement: Across mice, the x1 time constant during observation correlates strongly with the
    functional connectivity among x1 neurons measured as the AUC of non-targeted x1 neurons
    after the third pulse (R2 = 0.87).
  source: Figure 5g; Results, Attractor stability ties to connectivity, paragraph 2
  quote: The strength of this correlation was higher after the third stimulus ( r 2 = 0.87) compared
    with after the first stimulus ( r 2 = 0.59)
  statistics:
  - test: linear correlation
    statistic: R2 = 0.87
    p: 0.001
    p_relation: "<"
    n: 8 mice
  expected:
    quantity: R2 of x1 time constant against AUC after the third stimulus
    value: 0.87
    tolerance: 0.087
  depends_on:
  - fig1e-2p-x1-slower
  - fig3d-single-x1-drives-x1
  criterion: Per mouse, the x1 time constant of its observation fit (the "intrinsic leak rate"
    over the whole session, Methods; readings are the largest time constant over states and
    the x1 time constant of the state occupied after BALB/c removal) and the AUC of the
    average z-scored activity of non-targeted x1 neurons in its unitary x1 sessions after the
    third pulse (readings Wa and Wb for the window). Pearson R2 and its p-value over 8 mice.
    Reproduced when R2 is within tolerance and p < 0.001 under one reading; partially when p <
    0.05 with a positive slope.
- id: ed12-first-stimulus-weaker
  statement: The correlation is weaker after the first stimulus (R2 = 0.59) than after the third.
  source: Extended Data Fig. 12c and 12d; Results, Attractor stability ties to connectivity, paragraph 2
  quote: The strength of this correlation was higher after the third stimulus ( r 2 = 0.87) compared
    with after the first stimulus ( r 2 = 0.59)
  expected:
    quantity: R2 of x1 time constant against AUC after the first stimulus
    value: 0.59
    tolerance: 0.059
  depends_on:
  - fig5g-time-constant-vs-connectivity
  criterion: As fig5g-time-constant-vs-connectivity, after the first pulse. Reproduced when R2
    is within tolerance and below the third-pulse R2 under the same reading. The Extended Data
    Fig. 12b legend gives r2 0.87 for x2 neurons after the third stimulus, which conflicts with
    the Results and with Fig. 12e-h; it is not used.
- id: fig5f-ramp-not-correlated
  statement: The rate of ramp-up along x1 does not correlate with functional connectivity
    among x1 neurons (r2 = 0.01).
  source: Figure 5f; Extended Data Fig. 12b-d; Results, Attractor stability ties to connectivity, paragraph 2
  quote: By contrast, there was no correlation between functional connectivity and the rate of
    ramp-up, suggesting that the latter might be driven by extrinsic inputs to the VMHvl
  statistics:
  - test: linear correlation
    statistic: r2 = 0.01
    p: 0.05
    p_relation: ">"
    n: 8 mice
  depends_on:
  - fig5g-time-constant-vs-connectivity
  criterion: A claim of absence, judged on the paper's test, a linear correlation over 8 mice.
    The rate of ramp-up is not defined; readings are (a) the slope of a linear fit to x1 from
    BALB/c entry to the x1 maximum while the intruder is present and (b) the x1 rise over the
    first 10 s after entry divided by 10 s. AUC after the third pulse as in fig5g. Reproduced
    when p >= 0.05 under the reading used; r2 is reported.
- id: ed12eh-x1-to-x2-not-correlated
  statement: The time constant does not correlate with the influence of targeted x1 neurons on
    non-targeted x2 neurons, so the relation is specific to the x1 subnetwork.
  source: Extended Data Fig. 12e-h; Results, Attractor stability ties to connectivity, paragraph 2
  quote: the correlation between attractor stability and functional connectivity was specific to
    neurons in the integration ( x 1 ) subnetwork, and did not hold when rSLDS time constants were
    compared with the influence strength of targeted x 1 neurons on x 2 cells
  depends_on:
  - fig5g-time-constant-vs-connectivity
  criterion: A claim of absence. As fig5g-time-constant-vs-connectivity with non-targeted x2
    neurons, for AUC and average z-score after the first and the third pulse (the four panels
    e to h). The legend gives no test; the Pearson test of fig5g is used. Reproduced when none
    of the four correlations gives p < 0.05.
