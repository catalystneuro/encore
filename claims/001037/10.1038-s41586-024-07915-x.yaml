# ---------------------------------------------------------------------------------------
# Head-fixed 2P observation (Figure 1)
- id: fig1e-2p-x1-slower
  statement: In head-fixed mice observing aggression, rSLDS fits to 2P data show an x1
    dimension with longer time constants than x2.
  source: Figure 1e; Results, Line attractor for observing aggression, paragraph 4
  quote: during observation of aggression by the head-fixed mice, rSLDS analysis identified an
    integration dimension with slow dynamics ( x 1 ) aligned to an approximate line attractor, and an
    orthogonal dimension with faster dynamics ( x 2 )
  statistics:
  - test: two-tailed Mann-Whitney U-test
    p: 0.0001
    p_relation: "<"
    n: 9 mice
  criterion: As ed1n-engaging-x1-slower, on the 2P observation sessions, with the sample code's
    2P settings (2 states) as the second reading. Methods add that 2P flow fields were fit
    with an input term for the presence of the BALB/c intruder; fits with and without that
    input are both run. The legend's P is read from its star key (four stars, P < 0.0001), the
    only test in the figure besides panel m.
- id: fig1f-line-attractor-score
  statement: The line attractor score is positive across the 9 head-fixed mice.
  source: Figure 1f
  inferred: The legend shows the score across mice without a value or test; the statement reads
    it from the score's definition (Methods) and the Results calling the dynamics an
    approximate line attractor.
  depends_on:
  - fig1e-2p-x1-slower
  criterion: Score = log2 of the largest time constant over the second largest (Methods,
    Calculation of line attractor score) of each mouse's fit. The paper gives no threshold;
    the readings are (a) the mean over mice above 0 and (b) every mouse above 0. Reproduced
    when both hold; partially reproduced when only (a) holds.
- id: x1-time-constant-range
  statement: The experimentally observed network time constants of the integration dimension lie
    in a range of about 50 to 200 s.
  source: Results, Line-attractor neurons form ensembles, paragraph 5
  quote: could yield network time constants ( τ n ) in the experimentally observed range (~50–200 s
  depends_on:
  - fig1e-2p-x1-slower
  expected:
    quantity: x1 time constants of the 2P observation fits
    value: 125
    unit: s
  criterion: A reported range; reproduced when the x1 time constants of the 9 mice lie within
    50 to 200 s widened by 10% of each bound (45 to 220 s); partially reproduced when the
    median lies inside. The paper does not say which fits the range comes from; readings are
    the 2P observation fits (9 mice) and these together with the miniscope fits. The expected
    value is the midpoint and is not itself tested.
- id: methods-subspace-angle
  statement: The x1 and x2 dimensions are nearly orthogonal, with a subspace angle of 88.1 +/-
    0.87 degrees across 9 mice.
  source: Methods, Dynamical system models of neural data, paragraph 2
  quote: we initially confirmed the orthogonality of these dimensions by computing the subspace angle
    between them (88.1 ± 0.87°, n = 9 mice)
  expected:
    quantity: angle between the x1 and x2 columns of the emission matrix C, mean over mice
    value: 88.1
    tolerance: 0.87
    unit: degrees
  criterion: The angle between the two columns of C (the stored factor weights), per mouse,
    averaged over the 9 2P mice.
- id: methods-cvr2
  statement: rSLDS models of miniscope data explain 84.7% of variance during engagement and
    67.2% during observation of aggression (cross-validated R2).
  source: Methods, Dynamical system models of neural data, paragraph 2
  quote: Models fit to miniscope data during engagement of aggression obtained a cvR 2 = 84.7 ±
    0.03%, while the same model explains 67.2 ± 0.02% of variance in data obtained from
    observation of aggression
  expected:
  - quantity: cvR2, engagement, miniscope
    value: 84.7
    tolerance: 3
    unit: percent
  - quantity: cvR2, observation, miniscope
    value: 67.2
    tolerance: 2
    unit: percent
  criterion: Fivefold cross-validation, training on four portions and testing on the fifth
    (Methods). The printed spreads (0.03% and 0.02%) are read as fractions (3 and 2 percentage
    points), the only reading that fits a spread over 5 mice, and are used as tolerances. The
    paper does not say whether the portions are contiguous blocks or random frames, or how R2
    is taken (neural activity predicted from inferred latents); readings are contiguous
    blocks and random frames. The Methods also require 70% cvR2 before downstream use, which
    the observation value does not meet; this is reported.
- id: fig1m-achw-x1-longer
  statement: Neurons contributing to x1 have longer autocorrelation half-widths than those
    contributing to x2 in head-fixed observation.
  source: Figure 1l and 1m; Results, Line attractor for observing aggression, paragraph 4
  quote: Neurons contributing to the integration dimension displayed more persistence than those
    aligned with the faster dimension
  statistics:
  - test: two-tailed Mann-Whitney U-test
    p: 0.0078
    n: 9 mice (45 x1 and 45 x2 neurons)
  depends_on:
  - fig1e-2p-x1-slower
  criterion: Five neurons per dimension per mouse (45 each over 9 mice, legend of Fig. 1l), the
    five with the largest absolute weight on that dimension (Fig. 1i). ACHW as in
    ed3e-achw-full-session, on the observation session. Per-mouse means compared by a
    two-tailed test, unpaired Mann-Whitney and paired signed-rank (header, Tests; 0.0078 at
    n = 9 is an exact value of both); reproduced when x1 exceeds x2 at p < 0.05.
- id: ed5e-motion-explains-little
  statement: Only a small fraction of neural activity is explained by the head-fixed observer's
    movements, and the variance explained does not differ between x1 and x2 neurons.
  source: Extended Data Fig. 5a-e; Results, Line attractor for observing aggression, paragraph 4
  quote: Importantly, only a small fraction of the neural activity could be explained by movements of
    the observer mouse
  statistics:
  - test: two-tailed Mann-Whitney U-test
    p: 0.8125
    n: 7 mice
  criterion: GLM of each neuron on the first ten principal components of 500 motion SVDs at lags
    up to 10 s, ridge, tenfold cross-validation, cvR2 (Methods). The Methods call the ten
    features "binary" without saying how they are binarized; readings are the continuous
    components and components thresholded at their median. Reproduced when the median
    cvR2 over neurons is below 0.1 (the paper gives no value; "small fraction" read as under
    10% of variance, a reading named here and reported with the full distribution) and a
    two-tailed test of per-mouse x1 against x2 means gives p >= 0.05, run as an unpaired
    Mann-Whitney test and as a paired signed-rank test (header, Tests; the printed 0.8125 is
    an exact signed-rank value at n = 7). Needs the face videos or their SVDs.
