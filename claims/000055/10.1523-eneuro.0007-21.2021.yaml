- id: fig2-features-differ-across-subjects
  statement: All ten behavioural and environmental features differ significantly across
    subjects.
  source: Results, Behavior during naturalistic movements, paragraph 3; Figure 2
  quote: All 10 metadata features significantly differed across subjects ( p < 0.001 for every
    feature, one-way Kruskal–Wallis test).
  statistics:
  - test: one-way Kruskal-Wallis test, one per feature
    p: 0.001
    p_relation: "<"
    n: 12 subjects, events pooled within subject
  criterion: For each of the ten features, a one-way Kruskal-Wallis test of the event values
    grouped by subject, on the events of claim fig2-event-counts (reading b, with reading a as
    a variant), reach angle folded as in the opening comment and day of recording as a number.
    Reproduced when p < 0.001 for all ten features; not reproduced otherwise, with every p
    reported.
- id: fig2-reach-shape
  statement: Reach duration and reach magnitude vary little across subjects, with most reaches
    lasting under 2 s and covering under 200 pixels, and reach angle
    distributions tend to be bimodal with peaks near +90 and -90 degrees, with few side-to-side
    reaches.
  source: Results, Behavior during naturalistic movements, paragraph 3; Figure 2
  quote: Reach duration and reach magnitude show minimal intersubject variability, with most
    reaches lasting <2 s and covering <200 pixels ... For reach angle, the distributions tend to
    be bimodal, with peaks at ±90
  criterion: The paper gives no measure for these words, so they are read as follows. "Most"
    is more than half of the events, judged in every subject and in the events pooled over
    subjects; reach duration in seconds and reach magnitude in pixels. Reach angle (folded to
    -90 to 90 degrees) is judged on a Gaussian kernel density with Scott's bandwidth, the
    seaborn kdeplot default the Figure 2 code uses, evaluated on -90 to 90; a subject is bimodal
    with peaks at +-90 when the density's two highest local maxima lie within 15 degrees of -90
    and of +90 and the density at 0 degrees is below both. "Minimal intersubject variability" is
    read as the duration and magnitude parts holding in at least 10 of 12 subjects; the
    per-subject medians are reported. Reproduced when the duration and
    magnitude parts hold pooled and in at least 10 of 12 subjects, and the angle part holds
    pooled and in more than half of the subjects ("tend to"). Partially reproduced when one of
    the two parts holds.
- id: fig2-bimanual-skew
  statement: Bimanual ratio and bimanual overlap are skewed toward unimanual movement of the
    contralateral arm, less so for subjects 02, 04 and 05, while the bimanual class is mostly
    bimanual.
  source: Results, Behavior during naturalistic movements, paragraph 4; Figure 2
  quote: For bimanual ratio and overlap features, the distributions are skewed toward unimanual
    movements of the contralateral limb, as expected from Extended Data Fig. 2-1 c , with less
    skew for subjects 02, 04, and 05. In contrast, the bimanual class categorical feature is
    primarily skewed toward bimanual movements
  criterion: The paper gives no measure, so it is read as follows. Bimanual ratio (missing
    values 0.5, code) skewed toward unimanual when its median is below 0.5; bimanual overlap
    (seconds) skewed toward unimanual when its sample skewness (Fisher-Pearson) is positive;
    bimanual class mostly bimanual when more than half the events are bimanual. The paper's
    "less skew" for S02, S04 and S05 refers to both ratio and overlap, so it holds when each of
    the three is among the five subjects with the highest median bimanual ratio and among the five
    with the lowest overlap skewness; the two features are reported separately. Reproduced when the ratio and overlap parts hold pooled and in at least 9 of 12
    subjects, the class part holds pooled and in more than half the subjects, and the S02, S04,
    S05 part holds; partially reproduced when some but not all of these hold.
- id: extfig2-1c-contralateral-larger
  statement: Across all 12 subjects, the median displacement of the contralateral wrist after
    movement onset is substantially greater than that of the ipsilateral wrist, confirming that
    event detection mainly picked contralateral movements.
  source: Extended Data Figure 2-1c legend; Results, Behavior during naturalistic movements,
    paragraph 2
  quote: Because we selected movement initiation events of the wrist contralateral to the
    hemisphere with implanted electrodes, the median contralateral wrist displacements (orange
    lines) across all 12 subjects are substantially greater than ipsilateral wrist displacements
    (gray lines).
  criterion: Per subject, the median over events of each wrist's displacement in pixels from its
    rest position, with events aligned at movement onset (Extended Data Figure 2-1b and c
    legends). The current code holds no script for this panel. The rest position is open;
    readings are (a) the mean position over -1.5 to -1 s, the behavioural baseline of the code
    (config.baseline_vals_movement; compute_wrist_radial_distance, used by archived figure code,
    takes the absolute change of the radial distance from the image origin over that baseline),
    and (b) the position at movement onset (the Methods' reach definition). Displacement is the
    Euclidean distance from the rest position. The window is 0 to 1.5 s, the end of the time
    axis of the archived plotting code (plot_behavior_traces). "Substantially greater" has no
    measure; the part holds in a subject when the peak of the contralateral median exceeds the
    peak of the ipsilateral median, and the ratio is reported. Event set as in
    fig2-event-counts reading b. Reproduced when this holds in all 12 subjects under both
    readings; partially when it holds in 10 or 11. Blocked as methods_underspecified when the
    readings give different outcomes.
- id: extfig2-2-feature-correlations
  statement: Over all events, reach magnitude correlates with reach duration (r = 0.26) and
    onset speed (r = 0.56), reach duration with bimanual overlap (r = 0.48), and the bimanual
    features with one another (overlap and ratio 0.51, class and ratio 0.50, overlap and class
    0.61).
  source: Results, Behavior during naturalistic movements, paragraph 5; Extended Data Figure
    2-2
  quote: Reach magnitude positively correlates with reach duration ( r = 0.26) and onset speed (
    r = 0.56) ... Reach duration is also positively correlated with bimanual overlap ( r = 0.48)
    ... overlap vs ratio, r = 0.51; class vs ratio, r = 0.50; and overlap vs class, r = 0.61
  expected:
  - quantity: r, reach magnitude and reach duration
    value: 0.26
    tolerance: 0.026
  - quantity: r, reach magnitude and onset speed
    value: 0.56
    tolerance: 0.056
  - quantity: r, reach duration and bimanual overlap
    value: 0.48
    tolerance: 0.048
  - quantity: r, bimanual overlap and bimanual ratio
    value: 0.51
    tolerance: 0.051
  - quantity: r, bimanual class and bimanual ratio
    value: 0.5
    tolerance: 0.05
  - quantity: r, bimanual overlap and bimanual class
    value: 0.61
    tolerance: 0.061
  criterion: Pearson correlation over the events of all 12 subjects pooled ("group-level"),
    on untransformed features in the units of Figure 2 (duration and overlap in seconds,
    magnitude in pixels, speed in pixels per second, missing bimanual ratios 0.5), as
    plot_feature_scattermatrix in the code computes it (pandas DataFrame.corr). Event set as in
