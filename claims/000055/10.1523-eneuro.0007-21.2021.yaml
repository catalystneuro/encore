  criterion: The days per subject in Table 2 are S01 days 3, 4, 5 and 7; S02 and S03 days 3 to
    6; S05 days 3, 4 and 7; S04 and S06 to S12 days 3 to 7 (55 subject-days). The link holds
    (reproduced) when the dataset's subjects 01 to 12 have exactly these days in order. When it
    does not, the subjects are matched by their day sets where these are unique, and the
    mapping and any mismatch are reported; subjects whose day sets are identical cannot be told
    apart this way, so the event counts per subject (claim fig2-event-counts) are reported
    beside them.
