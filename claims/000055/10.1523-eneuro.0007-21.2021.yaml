  data: with_inputs
  criterion: 'Table 1 intervals (dB), LFB then HFB. S01 -1.87 to -1.29, 0.03 to 0.23; S02 -1.12
    to -0.31, 0.07 to 0.64; S03 -2.11 to -1.73, 1.39 to 1.67; S04 -0.17 to 0.01, 0.32 to 0.52;
    S05 -0.7 to -0.38, 0.2 to 0.48; S06 -1.63 to -1.11, 2.02 to 2.37; S07 -0.84 to -0.51, 1.14
    to 1.34; S08 -0.3 to 0.04, 0.36 to 0.63; S09 -0.57 to -0.08, -0.11 to 0.23; S10 -0.87 to
    -0.35, 0.01 to 0.3; S11 -2.3 to -1.86, 0.09 to 0.34; S12 -0.66 to -0.44, 0.06 to 0.2. The
    table does not say which statistic the interval is for. Readings are (a) the mean and (b)
    the median over the subject''s events of banded precentral power. Band power is taken as
    the band mean (Methods) or the band median (code), giving four readings in all. Reproduced
    when, under one reading, the point estimate lies inside the paper''s interval for all 24
    subject and band pairs. Partially reproduced when it does for at least 18. The attempt''s own
    5000-replicate bootstrap intervals are shown beside the paper''s.'
- id: fig5-recording-day-effects
  statement: Precentral band power differs significantly across recording days in LFB for
    subjects 03, 05, 06, 07, 08 and 11, and in HFB for subjects 03, 04, 07, 08 and 10, despite
    baseline subtraction.
  source: Results, Intracortical spectral power during naturalistic movements, paragraph 4;
    Figure 5; Table 2
  quote: We also found a significant effect of recording day in LFBs for subjects 03 ( p <
    0.001, Kruskal–Wallis test), 05 ( p = 0.013), 06 ( p < 0.001), 07 ( p = 0.041), 08 ( p =
    0.013), and 11 ( p < 0.001), as well as in HFBs for subjects 03 ( p = 0.002), 04 ( p <
    0.001), 07 ( p < 0.001), 08 ( p = 0.004), and 10 ( p = 0.006).
  statistics:
  - about: LFB, S03
    test: Kruskal-Wallis test
    p: 0.001
    p_relation: "<"
  - about: LFB, S05
    test: Kruskal-Wallis test
    p: 0.013
  - about: LFB, S06
    test: Kruskal-Wallis test
    p: 0.001
    p_relation: "<"
  - about: LFB, S07
    test: Kruskal-Wallis test
    p: 0.041
  - about: LFB, S08
    test: Kruskal-Wallis test
    p: 0.013
  - about: LFB, S11
    test: Kruskal-Wallis test
    p: 0.001
    p_relation: "<"
  - about: HFB, S03
    test: Kruskal-Wallis test
    p: 0.002
  - about: HFB, S04
    test: Kruskal-Wallis test
    p: 0.001
    p_relation: "<"
  - about: HFB, S07
    test: Kruskal-Wallis test
    p: 0.001
    p_relation: "<"
  - about: HFB, S08
    test: Kruskal-Wallis test
    p: 0.004
  - about: HFB, S10
    test: Kruskal-Wallis test
    p: 0.006
  data: with_inputs
  criterion: Per subject and band, a one-way Kruskal-Wallis test of banded precentral power
    across the subject's recording days, uncorrected, at p < 0.05 (Figure 5 legend; the notebook
    uses pingouin's uncorrected p). Band mean as the main result, band median (code) as a
    variant. The paper's pattern is the 11 significant pairs above and the 13 other subject and
    band pairs not significant. Reproduced when all 24 pairs agree; partially reproduced when at
    least 20 agree. Each p is reported, with the per-day 95% intervals of Table 2 for
    comparison.
- id: extfig5-1-baseline-reduces-day-variability
  statement: Subtracting the -1.5 to -1 s baseline reduces the variability of band power across
    recording days, though clear variability remains.
  source: Results, Intracortical spectral power during naturalistic movements, paragraph 4;
    Extended Data Figure 5-1 legend
  quote: Baseline subtraction reduces the variation across recording days, as expected, but clear
    variability remains.
  data: with_inputs
  depends_on:
  - fig5-recording-day-effects
  criterion: The legend gives the measure, the SD across recording days of the average LFB
    (8-32 Hz) and HFB (76-100 Hz) power, with and without baseline subtraction. The figure could
    not be read and no code for it is in the repository, so what is averaged is open. Readings
    are (a) precentral region power, per subject, the SD across days of the day means of event
    band power; (b) the same per good electrode, pooled over electrodes and subjects. Without
    baseline means the 10*log10 band power with no subtraction. Reproduced when, under both
    readings and in both bands, the SD with baseline is below the SD without it for more than
    half of the units (subjects or electrodes). The paper gives no measure for "clear variability
    remains"; the Results tie it to the recording-day effects that persist after baseline
    subtraction (paragraph 4), so that part is judged by claim fig5-recording-day-effects
    finding a significant day effect in at least one subject, and the SDs with baseline are
    reported. Blocked as methods_underspecified when the readings disagree.
- id: discussion-day-changes-small
  statement: Day-to-day changes in baseline-subtracted spectral power are small (about 1-2 dB)
    compared with spectral power without baseline subtraction (about 10-50 dB).
  source: Discussion, paragraph 3
  quote: It is also worth noting that these day-to-day changes in ECoG spectral power are small
    in magnitude (±1–2 dB) relative to spectral power without any baseline values subtracted
  data: with_inputs
  criterion: On precentral banded power, per subject and band, the day means of the event
    values. The day-to-day change is the largest absolute difference between a day mean and the
    subject's overall mean. It holds when every such change is at most 2.2 dB (2 dB widened by
    10%). The level without baseline is the mean 10*log10 band power without subtraction. It
    depends on the voltage unit, which the paper does not state; readings are microvolts and
    volts. That part holds when the levels lie in 9 to 55 dB (10-50 dB widened by 10% of each
    bound) under one unit reading. Reproduced when both parts hold; partially when only the
    first does.
- id: fig6b-best-models-sensorimotor
  statement: Regression models with the highest withheld R2 are mainly at electrodes over
    frontoparietal sensorimotor areas, for both bands.
  source: Figure 6b; Results, Modeling single-event spectral power with behavioral features,
    paragraph 2; Extended Data Figure 6-1
  quote: For both frequency bands, intracortical activity variability is best explained by the
    fit of our models to electrodes located in frontoparietal sensorimotor areas ( Fig. 6 b ,
    Extended Data Fig. 6-1 ).
  data: with_inputs
  criterion: Full-model withheld R2 per electrode and band (regression method of the opening
    comment). The paper shows this on brain maps and gives no measure. Each electrode is assigned
    to an area in one of two ways, (a) to the region of the eight with its largest projection
    weight, or (b) by projecting the electrode R2 values onto the eight regions with the
    projection weights, as for power, and averaging over subjects. Frontoparietal sensorimotor
    regions are precentral, postcentral and inferior parietal (the regions the Results call
    sensorimotor) with middle frontal and supramarginal. Under (a), the part holds when more
    than half of the electrodes with R2 > 0.05 are in these five regions and the median R2 of
    precentral, postcentral and inferior parietal electrodes exceeds that of temporal ones.
    Under (b), it holds when the three regions with the highest projected R2 are among the five
    frontoparietal ones. Reproduced when this holds in both bands under both readings. Blocked
    as methods_underspecified when the readings disagree.
- id: fig6-r2-at-most-025
  statement: All regression models explain at most 25% of the variance of withheld single-event
    power.
  source: Results, Modeling single-event spectral power with behavioral features, paragraph 2
  quote: However, all R 2 scores are at most 0.25, indicating that even the best models cannot
    explain >75% of the variance in the withheld data.
  expected:
  - quantity: largest full-model withheld R2 over electrodes, subjects and bands
    value: 0.25
    tolerance: 0.025
  criterion: The largest split-averaged full-model withheld R2 over all good electrodes of all
    subjects in both bands (regression method of the opening comment). Reproduced when it is at
    most 0.275 (0.25 plus 10%). The value is also reported for the code's 80/20 split and
    median band power.
- id: fig6c-angle-and-day-most-informative
  statement: Reach angle and day of recording are the most informative features for single-event
    power, especially for low-frequency power.
  source: Figure 6c and legend; Results, Modeling single-event spectral power with behavioral
    features, paragraph 2
  quote: Among individual features, we find that reach angle and day of recording are the most
    informative ( Fig. 6 c ).
  criterion: Delta R2 per feature, electrode and band (opening comment), over electrodes with
    withheld R2 > 0.05 in that band, across all subjects. The summary across electrodes is the
    median, as the box plots of Figure 6c show (code). Reproduced when reach angle and recording
    day have the two largest median Delta R2 of the ten features in the LFB. The HFB ranking is
    reported, and the claim is partially reproduced when only one of the two is in the LFB top
    two. Shown as variants are the code's Delta R2 (shuffling test events too), the code's
    selection by LFB R2, the code's 80/20 split, and the code's inclusion of bad electrodes.
- id: extfig6-2-angle-most-retained
  statement: Reach angle is the feature most often retained by forward selection in sensorimotor
    regions, followed by reach duration, reach magnitude, bimanual ratio and bimanual overlap.
  source: Extended Data Figure 6-2 legend; Results, Modeling single-event spectral power with
    behavioral features, paragraph 2
  quote: Reach angle is the feature most often retained, followed by reach duration, reach
    magnitude, bimanual ratio, and bimanual overlap.
  data: with_inputs
  criterion: Per electrode and band, whether each feature is kept by forward selection (code
    feat_select_prob; a day or time-of-day one-hot column counts as 1/number of columns of that
    feature). The legend projects the retention probability onto the eight regions and averages
    across subjects; the code of this step is not in the repository. It is read as the
    projection-weighted mean over the subject's good electrodes, then the mean over subjects, as
    for power. The angle part holds when reach angle has the highest retention probability
    among the ten features in precentral, postcentral and inferior parietal for both bands. The
    legend does not say over which regions and bands its order of the next four features holds.
    Readings are (a) the retention probability averaged over the three sensorimotor regions and
    both bands and (b) the same over all eight regions; the order part holds when the features
    ranked second to fifth are reach duration, reach magnitude, bimanual ratio and bimanual
    overlap in that order. Reproduced when the angle part holds and the order part holds under
    both readings; partially reproduced when only the angle part holds. Blocked as
    methods_underspecified when the readings give different outcomes for the order part.
- id: fig6d-upward-reaches-enhance-pattern
  statement: Upward reaches are associated with lower low-frequency power and higher
    high-frequency power, that is, a larger version of the average movement response.
  source: Figure 6d and legend; Results, Modeling single-event spectral power with behavioral
    features, paragraph 2
  quote: The coefficients for reach angle indicate that upward reaches are associated with
    decreased low-frequency power and increased high-frequency power compared with the average
    response.
  criterion: Reach angle coefficient (positive angle is upward, standardised feature), averaged
    over splits, over electrodes with withheld R2 > 0.05 in that band. Reproduced when the median
    coefficient is below 0 for LFB and above 0 for HFB; partially when it holds in one band. The
    code's selection by LFB R2 and its inclusion of bad electrodes are shown as variants.
- id: fig6d-angle-and-day-largest-coefficients
  statement: Reach angle and day of recording have the largest coefficient magnitudes among the
    features, and the SD of the recording-day coefficients is large.
  source: Figure 6d and legend; Results, Modeling single-event spectral power with behavioral
    features, paragraph 2
  quote: In addition, both reach angle and day of recording have the largest coefficient
    magnitudes among behavioral features in the regression models ( Fig. 6 c ).
  criterion: Per electrode with withheld R2 > 0.05 in the band, the split-averaged coefficient
    of each continuous or binary feature, and for day and time of day the SD of their one-hot
    coefficients (Figure 6 legend, code). The Results cite Fig. 6c for this sentence, but the
    coefficients are in Fig. 6d, whose box plots show the signed coefficients (code). The paper
    does not say how magnitude is summarised across electrodes. Readings are (a) the median of
    the absolute coefficients and (b) the absolute value of the median coefficient, the box-plot
    centre. Reproduced when, under both readings, reach angle and recording day have the two
    largest values in both bands; partially when in one band. Blocked as
    methods_underspecified when the readings give different outcomes. Variants as for
    fig6c-angle-and-day-most-informative.
checks:
- date: 2026-10-23
  kind: agent
  model: claude-opus-5-5
  ready: true
  changes:
  - Read the code at the cited commit (04c6faf) to check every criterion that cites it. The spectral, projection, masking, regression and plotting details in the header and criteria match the code, except as below.
  - Header. Added that the code fits models at bad electrodes and keeps them in the Figure 6c-d box plots; the Methods and the Figure 1 legend remove bad electrodes, so good electrodes stay the main result and the code's choice is a variant.
  - fig2-reach-shape. The statement left out the paper's "minimal intersubject variability" for duration and magnitude. Added it, and the criterion now says it is read through the 10 of 12 subject rule already there.
  - fig2-bimanual-skew. The paper's "less skew for subjects 02, 04, and 05" applies to both ratio and overlap; the criterion judged it on the ratio only. It now uses both features.
  - fig4-precentral-subject-variability. Added the code's second subtraction of the -1.5 to -1 s mean from each subject's median (plot_specs_single_region), and said where the 0 to 0.5 s window comes from (the Methods' banded window; Figure 4 fixes none).
  - extfig5-1-baseline-reduces-day-variability. The test for "clear variability remains" (median SD above 0) was always true. It is now judged through the day effects of fig5-recording-day-effects, which the Results give as the variability that remains; added depends_on.
  - fig6c-angle-and-day-most-informative and fig6d-upward-reaches-enhance-pattern. Added the code's inclusion of bad electrodes as a variant.
  - fig6d-angle-and-day-largest-coefficients. The criterion took the median of absolute coefficients as the only measure; the paper does not say how magnitude is summarised and its box plots show signed values. Named two readings (median of absolute values, absolute value of the median) with the blocking rule. Noted that the Results cite Fig. 6c for coefficients that are in Fig. 6d.
  - extfig6-2-angle-most-retained. The statement includes the legend's order of the next four features, but the criterion only reported it. The order is now judged, under two readings of the regions it covers, and failing it gives a partial outcome.
  - Added claim extfig2-1c-contralateral-larger (Extended Data Figure 2-1c, cited in the Results), a panel-level finding with no claim. No current code makes the panel; the criterion names the readings of the rest position and says the threshold for "substantially" is its own.
  - Open, not settled. Many criteria turn words the paper leaves unmeasured into thresholds of the file's own (for example "most" as more than half, 10 of 12 subjects, peaks within 15 degrees of +-90, waking hours as 08:00 to 24:00, the parts of fig4-precentral-subject-variability). They are readings, not the paper's methods.
  - Open, not settled. discussion-day-changes-small reads the "day-to-day changes" of +-1-2 dB as the largest deviation of a day mean from the subject mean; the paper does not define them, and the range of day means is another reading, about twice as large. The voltage unit for the 10-50 dB level is also not stated.
  - Open, not settled. cohort uses the stated SDs as tolerances on the means, as the protocol's "stated spread" allows; that is wide (for example 29.4 +- 7.9 years).
  - Open, not settled. Extended Data Figures 1-1, 2-3, 2-4, 3-1, 4-1 to 4-7, 5-1, 6-1 and 6-2 are EPS files not in the text, and no PDF was supplied, so their contents could not be checked; the claims that rest on them use their legends.
