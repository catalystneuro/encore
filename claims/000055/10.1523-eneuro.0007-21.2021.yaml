# Claims for Peterson, Singh, Wang, Rao & Brunton (2021), eNeuro 8(3), ENEURO.0007-21.2021,
# "Behavioral and Neural Variability of Naturalistic Arm Movements", on dandiset 000055.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read. The version of record as served by Europe PMC (PMC8225404), from
# paper/10.1523-eneuro.0007-21.2021.txt: main text, Materials and Methods, figure legends,
# Tables 1 and 2, the legends of the Extended Data figures, and the review history. No PDF was
# supplied. The Extended Data figures (1-1, 2-1 to 2-4, 3-1, 4-1 to 4-7, 5-1, 6-1, 6-2) are
# EPS downloads and are not in the text; only their legends are. Claims that rest on them are
# taken from their legends and from the Results sentences that cite them. The per-subject
# electrode table (Extended Data Figure 1-1) and the per-subject feature confidence intervals
# (Extended Data Figures 2-3 and 2-4) could not be read.
#
# Code read. github.com/BruntonUWBio/naturalistic_arm_movements_ecog at commit
# 04c6faf2f219586fa834d10c614ef48a694cec55 (17 March 2021), Python 3.6 (MNE 0.19) and MATLAB.
# It holds compute_spectral_power.py and tfr_utils.py (Morlet power, baseline, bootstrap
# masking, projection to regions), the MATLAB projection of electrodes onto AAL regions
# (project_ecog_to_rois.m, EEGLAB 13.5.4b, Measure Projection Toolbox 1.661),
# fit_regression_models.py and regression_utils.py (regression), and notebooks for Figures 2,
# 3 and 4, 5 and 6. It does not hold the ECoG preprocessing, the pose estimation, the event
# detection, the behavioural feature extraction, the Kruskal-Wallis tests of Figure 2, the
# bootstrap confidence intervals of Tables 1 and 2, or the code of Extended Data Figures 5-1
# and 6-2. It starts from the curated epochs and spectral power deposited on Figshare.
#
# Spectral method fixed here (Methods, with the code where the Methods are silent). Segments
# of 10 s centred on each movement onset; segments with power below 0 dB or with power at
# 115-125 Hz more than 3 SD above all segments are dropped (Methods), and so are events marked
# false positive (code). Morlet wavelet power at 1 to 121 Hz in 5 Hz steps (1, 6, ..., 121) with
# n_cycles = frequency/4, decimated by 50 (10 Hz time bins at 500 Hz), converted to
# 10*log10 (code). Each event's power has its own mean over -1.5 to -1 s subtracted, per
# electrode and frequency (Methods give the window; code takes the mean). Projection onto
# regions (Methods and code): electrodes in MNI space, right-hemisphere ones mirrored to the
# left; a 3D Gaussian of 20 mm FWHM, truncated at 10 SD, at each electrode, summed over AAL
# regions; regions kept when the electrode density averaged over the 12 subjects exceeds 3
# (the eight regions middle frontal, precentral, postcentral, inferior parietal,
# supramarginal, superior temporal, middle temporal, inferior temporal); bad electrodes get
# weight 0 and each region's weights are renormalised to sum to 1 per subject (code); region
# power is the weighted sum of electrode power. Banded power (Methods and Figure 5 legend) is
# power over the first 0.5 s after onset (0 to 0.5 s) in the LFB 8-32 Hz (bins 11 to 31 Hz) and
# HFB 76-100 Hz (bins 76 to 96 Hz). The Methods say this power is "averaged"; the code takes the
# median over time bins and then over frequency bins. The mean is the main result, the code's
# median a variant shown beside it.
#
# Regression method fixed here (Methods, with the code where the Methods are silent). One model
# per subject, good electrode and band (LFB, HFB), over all of the subject's analysed events.
# Ten features. Day of recording is one-hot by day; time of day is one-hot in three bins (0-8,
# 8-16, 16-24 h). Reach duration, reach magnitude, reach angle, onset speed, speech ratio,
# bimanual ratio, bimanual overlap and bimanual class are standardised (z-score over the
# subject's events). Reach duration and reach magnitude are log transformed (Methods); the code
# uses log(duration), log(magnitude + 1) and also log(onset speed + 1), shown as a variant.
# Reach angle is folded to -90 (down) to +90 degrees (up) (Methods; code negates the image angle
# and folds 90-270 degrees). Missing bimanual ratios are set to 0.5 and bimanual class is 1 when
# the ipsilateral lead/lag value exists (code). Forward selection by OLS adjusted R2 (code
# _forward_selected_new, run on all of the subject's events, as the code does where the
# Methods do not say); unselected features are set to 0. Huber-loss linear regression
# (sklearn HuberRegressor defaults, code). 200 random train/test splits per subject with days
# balanced in the test set (equal numbers of test events from each day). The Methods give 90%
# training and 10% test; the code uses 80/20 (train_test_split_day_balance, per_train=.8). The
# Methods' 90/10 is the main result and the code's 80/20 a variant. Full-model R2 is the
# coefficient of determination on the test events, averaged over splits. The Delta R2 of a
# feature is the full-model test R2 minus the test R2 of a model refit with that feature
# shuffled (all day columns shuffled together, and all time-of-day columns together, code),
# averaged over splits. Features dropped by forward selection get Delta R2 0 (code). The
# Methods score the shuffled model on the unshuffled withheld data, and the Results say the
# training labels were shuffled. The code shuffles the column in training and test events and
# scores on the shuffled test events. The Methods' version is the main result, the code's a
# variant. Coefficients are averaged over splits. Recording day and time of day are
# summarised by the SD of their one-hot coefficients (Figure 6 legend, code). Figure 6b-d
# show only models with withheld R2 > 0.05 (legend), judged per band; the code selects
# electrodes for both bands by the LFB R2, shown as a variant. The code also fits models at
# electrodes marked bad, and its Figure 6c-d box plots do not drop them (Regression_results_Fig6,
# pos_r2_inds); the Methods and the Figure 1 legend remove bad electrodes from further analysis,
# so good electrodes are the main result and the code's inclusion of bad ones a variant.
#
# Data the paper used. 12 subjects (8 male, 4 female, 29.4 +- 7.9 years) in clinical epilepsy
# monitoring at the University of Washington, with ECoG grids over motor cortex (87.0 +- 12.9
# surface electrodes; 5 subjects also had 23.2 +- 12.1 depth electrodes), seven implanted in the
# left and five in the right hemisphere. Days 3 to 7 after implantation, 3 to 5 days per subject
# (days per subject are listed in Table 2; 55 subject-days in all). ECoG at 1000 Hz, preprocessed
# (median removed, high-amplitude artifacts zeroed with 2 s margins, 1-200 Hz bandpass, 60 Hz
# notches, resampled to 500 Hz, common median reference per electrode group, bad electrodes by
# SD or kurtosis) and video at 30 fps. Measured variables are the pose (DeepLabCut, nine key
# points), contralateral wrist movement onset events (151 to 947 per subject, median 640), ten
# behavioural and environmental features per event (day of recording, time of day, reach
# duration, magnitude, angle, onset speed, speech ratio from the audio, bimanual ratio, overlap
# and class), electrode MNI positions and bad-electrode labels. The paper deposited its curated
# epochs, spectral power, event features and projection matrices on Figshare
# (figshare.com/projects/Behavioral_and_neural_variability_of_naturalistic_arm_movements/78666).
# The dandiset (AJILE12) describes ECoG at 500 Hz and pose for the same 12 participants over 55
# days, with the wrist movement events and their features. Outside data the paper uses: the AAL
# atlas (Tzourio-Mazoyer et al., 2002) through the Measure Projection Toolbox, for every claim on
# regions of interest. The Figshare projection matrices (roi_proj_matlab/aal_XX_elecs2ROI.csv)
# are the paper's own output of that step.
#
# Subjects S01 to S12 are assumed to be the dataset's subjects 01 to 12 in order; claim
# subject-days checks this.
#
# Claim extfig2-1c-contralateral-larger was added by the check of 2026-10-23.
schema_version: 2
dataset:
  archive: dandi
  id: "000055"
paper: doi:10.1523/eneuro.0007-21.2021
claims:
