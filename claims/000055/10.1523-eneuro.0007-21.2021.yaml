- id: fig2-days-and-waking
  statement: Reach counts were fairly even across recording days except for subjects 04, 05 and
    09, each with one day holding most events, and events occurred mostly during waking hours.
  source: Results, Behavior during naturalistic movements, paragraph 3; Figure 2
  quote: The number of reaches detected across days of recording was fairly consistent, with the
    exceptions of subjects 04, 05, and 09, who each had 1 d representing most of the total
    events. As expected, detected movement events often occurred mostly during waking hours.
  criterion: '"Most of the total events" is read as more than half. Reproduced when the
    subject''s busiest day holds more than half of its events for S04, S05 and S09 and for none
    of the other nine subjects. Waking hours are not defined; they are read as 08:00 to 24:00,
    the two daytime bins of the paper''s time-of-day feature, and the part holds when more than
    half of each subject''s events fall in them. Partially reproduced when the day part holds for
    the three named subjects but also for one or two others, or when only one of the two parts
    holds. Event set as in fig2-event-counts reading b.'
- id: fig3-group-lfb-decrease-hfb-increase
  statement: At the group level, low-frequency power decreases and high-frequency power increases
    at movement initiation in several cortical regions, as in controlled movement experiments.
  source: Figure 3; Results, Intracortical spectral power during naturalistic movements,
    paragraph 1
  quote: Generally, we find the expected pattern of low-frequency (∼4–30 Hz) spectral power
    decrease and high-frequency (∼50–120 Hz) power increases during movement initiation across
    multiple cortices ( Fig.
  statistics:
  - test: two-sided bootstrap against baseline time points, 2000 permutations
    p: 0.05
    p_relation: "<"
    corrected: FDR (Benjamini-Hochberg)
    n: 12 subjects
  data: with_inputs
  criterion: Group spectrogram per region as the Methods and the code (plot_specs_group) make
    it. Per subject, the median over events of region power (spectral method of the opening
    comment); the mean over the 12 subjects; the group median over -1.5 to -1 s subtracted
    again (code). Masking as in the code (tfr_boot_sig_mask). Each subject's baseline time bins
    are shuffled within frequency, the median over subjects is taken, repeated to about 2000
    values per frequency, two-sided percentile p, Benjamini-Hochberg over all frequency and time
    bins of the region at 0.05; non-significant values set to 0. "At movement initiation" is
    read two ways. (a) The mean of the masked values over 0 to 0.5 s, the window of the paper's
    banded analyses. (b) The time bin nearest 0 s. Reproduced when, under both readings, the
    masked mean over the 4-30 Hz bins is below 0 and over the 50-120 Hz bins above 0 in each of
    precentral, postcentral and inferior parietal. Partially reproduced when this holds in one
    or two of them. Blocked as methods_underspecified when the readings disagree.
- id: fig3-sensorimotor-largest
  statement: Spectral power changes are largest in precentral, postcentral and inferior parietal
    regions, and the three temporal regions show minimal movement-related changes.
  source: Results, Intracortical spectral power during naturalistic movements, paragraph 2;
    Figure 3
  quote: Spectral power deviations are largest in magnitude in precentral, postcentral, and
    inferior parietal regions, which are located in sensorimotor areas of the brain ... As
    expected, all three temporal cortical regions contain minimal movement-related spectral power
    fluctuations.
  data: with_inputs
  depends_on:
  - fig3-group-lfb-decrease-hfb-increase
  criterion: On the masked group spectrograms of claim fig3-group-lfb-decrease-hfb-increase. The
    paper does not say how magnitude is measured. Readings are (a) the mean absolute masked
    value over all frequency bins and 0 to 0.5 s; (b) the same over the 4-30 Hz bins and,
    separately, over the 50-120 Hz bins, a region ranking high when it does in both; (c) as (a)
    over -0.5 to 0.5 s. Reproduced when, under every reading, precentral, postcentral and
    inferior parietal are the three largest of the eight regions and each temporal region is
    below all three. Partially reproduced when two of the three named regions are in the top
    three and the temporal part holds. Blocked as methods_underspecified when the readings give
    different outcomes.
- id: fig3-lfb-more-widespread
  statement: Low-frequency power decreases are more spatially widespread than high-frequency
    increases and are also present in supramarginal and superior temporal regions.
  source: Results, Intracortical spectral power during naturalistic movements, paragraph 2;
    Figure 3
  quote: In addition, low-frequency power decreases appear more spatially widespread than
    high-frequency power increases and are also present in supramarginal and superior temporal
    regions.
  data: with_inputs
  depends_on:
  - fig3-group-lfb-decrease-hfb-increase
  criterion: On the masked group spectrograms, over 0 to 0.5 s. Readings for "widespread" are (a)
    the number of regions with any significant negative bin in 4-30 Hz against the number with
    any significant positive bin in 50-120 Hz; (b) the count of significant negative 4-30 Hz bins
    against significant positive 50-120 Hz bins, summed over the eight regions and divided by
    the number of frequency bins in each range. Reproduced when, under both readings, the
    low-frequency count is larger, and supramarginal and superior temporal each have
    significant negative 4-30 Hz bins. Blocked as methods_underspecified when the readings
    disagree.
- id: fig4-precentral-subject-variability
  statement: In the precentral region every subject shows the low/high-frequency pattern, but
    amplitudes and frequency bands vary; subjects 03, 06, 07, 08 and 11 have increases up to
    120 Hz, subjects 09 and 12 mainly at 60-80 Hz, and subjects 04 and 08 have narrower
    low-frequency decreases.
  source: Results, Intracortical spectral power during naturalistic movements, paragraph 3;
    Figure 4
  quote: For instance, the precentral region shows the same low/high-frequency power pattern for
    each subject ( Fig. 4 ), but the amplitudes and frequency bands of maximal power deviation
    differ widely across subjects. Subjects 03, 06, 07, 08, and 11 show increased power at high
    frequencies up to 120 Hz, while subjects 09 and 12 have increased power primarily between 60
    and 80 Hz. For subjects 04 and 08, low-frequency power decreases occur across narrower
    frequency bands compared with the other subjects.
  data: with_inputs
  criterion: Per subject, the unmasked median over events of precentral power (Figure 4 legend,
    no statistical masking), with the mean of that median over -1.5 to -1 s subtracted again, as
    plot_specs_single_region in the code does, averaged over 0 to 0.5 s (the window of the
    paper's banded analyses, Methods; Figure 4 itself shows whole spectrograms and fixes no
    window) to give a spectrum. The paper gives no
    measure, so the parts are read as follows. (1) Every subject has a negative mean over 8-32
    Hz and a positive mean over 76-100 Hz. (2) For S03, S06, S07, S08 and S11 the 116 and 121
    Hz bins are positive. (3) For S09 and S12 the largest value among the 56-121 Hz bins is at
    61 to 76 Hz (bins within 60-80 Hz), and the mean over 101-121 Hz is below half of it. (4)
    The width of the decrease is the number of 1-46 Hz bins below half of the subject's most
    negative value; S04 and S08 are among the three subjects with the fewest. Reproduced when
    all four hold; partially when two or three hold. Part (1) failing in a subject is reported
    by subject.
- id: fig5-band-power-differs-across-subjects
  statement: Precentral LFB and HFB power in the 0.5 s after movement onset differs
    significantly across subjects.
  source: Results, Intracortical spectral power during naturalistic movements, paragraph 4;
    Figure 5; Table 1
  quote: For both frequency bands, spectral power significantly differed across subjects ( p <
    0.001 for both bands, one-way Kruskal–Wallis test).
  statistics:
  - test: one-way Kruskal-Wallis test, one per band
    p: 0.001
    p_relation: "<"
    n: 12 subjects, events pooled within subject
  data: with_inputs
  criterion: Banded precentral power per event (opening comment; band mean as the main result,
