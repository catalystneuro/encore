- id: precentral-subjects-differ
  statement: Precentral LFB and HFB power from 0 to 0.5 s differ significantly across subjects
    (one-way Kruskal-Wallis test, p < 0.001 for both bands).
  source: Results (Intracortical spectral power); Figure 5; Table 1
  data: with_inputs
  criterion: Kruskal-Wallis test across the 12 subjects on the events' precentral band power.
    Reproduced when p < 0.001 in both bands; partially reproduced when in one; not reproduced
    otherwise.
  depends_on:
  - projection-link
- id: precentral-day-effects
  statement: Precentral power depends on the recording day in several subjects; the effect is
    significant (Kruskal-Wallis, p < 0.05) in LFB for subjects 03, 05, 06, 07, 08 and 11, and in
    HFB for subjects 03, 04, 07, 08 and 10.
  source: Results (Intracortical spectral power); Figure 5; Table 2
  data: with_inputs
  criterion: Kruskal-Wallis test across days within each subject and band, p < 0.05. Of the 24
    subject and band calls, count those that agree with the paper (significant where it is, not
    where it is not). Reproduced when at least 20 agree; partially reproduced when 14 to 19
    agree and at least three subjects are significant in each band; not reproduced otherwise.
  depends_on:
  - projection-link
- id: baseline-reduces-day-variability
  statement: Baseline subtraction reduces the variability of LFB and HFB power across recording
    days, but clear variability remains.
  source: Extended Data Figure 5-1 (legend); Results
  data: with_inputs
  criterion: The legend does not name the region; the precentral region of Figure 5 is used. Per
    subject and band, the SD across days of the day means of power from 0 to 0.5 s, with and
    without baseline subtraction. Reproduced when the SD with subtraction is lower in at least 9
    of 12 subjects in both bands and above 0 in all; partially reproduced when this holds in one
    band; not reproduced otherwise.
  depends_on:
  - projection-link
- id: regression-r2-max
  statement: Regression models of single-event power on the behavioural features explain at
    most 25% of the variance of withheld events (R2 at most 0.25).
  source: Results (Modeling single-event spectral power); Figure 6b; Discussion
  data: with_inputs
  expected:
    quantity: largest test R2 of any model
    value: 0.25
    tolerance: 0.025
  criterion: Recomputed for the tested electrodes (the eight good electrodes per subject with the
    largest precentral weight), LFB and HFB, as the mean test R2 over train and test splits. The
    claim is an upper bound, so it is reproduced when the largest mean R2 is at most 0.275 and
    not reproduced when it is above. The R2 values stored in the dandiset's electrode tables are
    shown as reference.
  depends_on:
  - projection-link
- id: regression-r2-sensorimotor
  statement: The models with the largest R2 on withheld data are in frontoparietal sensorimotor
    areas.
  source: Results (Modeling single-event spectral power); Figure 6b; Extended Data Figure 6-1
  data: with_inputs
  criterion: Tested on the R2 values stored in the dandiset's electrode tables (low_freq_R2,
    high_freq_R2), which cover every electrode; the recomputation covers precentral electrodes
    only. Per subject, the stored R2 of good electrodes is projected onto the eight regions; the
    regional values are averaged over subjects. Reproduced when, in both bands, the region with
    the highest value is one of the five frontoparietal regions (precentral, postcentral, middle
    frontal, inferior parietal, supramarginal) and the mean over these five is higher than the
    mean over the three temporal regions; partially reproduced when this holds in one band; not
    reproduced otherwise.
  depends_on:
  - projection-link
- id: regression-angle-day-top
  statement: Reach angle and recording day are the most explanatory features of single-event
    power, especially of low-frequency power.
  source: Results (Modeling single-event spectral power); Figure 6c
  data: with_inputs
  criterion: On the tested electrodes whose mean LFB test R2 is above 0.05 (the code selects
    models on LFB R2 for both bands), the mean Delta R2 of each of the ten features. Following the
    Methods, Delta R2 is the full model's test R2 minus that of a model fit with the feature
    shuffled, scored on the unshuffled withheld events. Reproduced when reach angle and day have
    the two largest mean Delta R2 in LFB; partially reproduced when one of them is among the two
    largest; not reproduced otherwise. Blocked (other) if fewer than five electrodes pass the R2
    threshold.
  depends_on:
  - regression-r2-max
- id: regression-angle-coefficient
  statement: Upward reaches are associated with decreased low-frequency power and increased
    high-frequency power, enhancing the average pattern.
  source: Results (Modeling single-event spectral power); Figure 6d
  data: with_inputs
  criterion: On the electrodes selected as in regression-angle-day-top, the mean over electrodes
    of the reach angle coefficient (mean over splits, standardised features). Reproduced when it
    is negative for LFB and positive for HFB; partially reproduced when one sign holds; not
    reproduced otherwise.
  depends_on:
  - regression-angle-day-top
- id: regression-angle-retained
  statement: Reach angle is the feature most often retained by forward selection in sensorimotor
    areas.
  source: Results (Modeling single-event spectral power); Extended Data Figure 6-2 (legend)
  data: with_inputs
  criterion: On all tested electrodes (both bands), the fraction of models in which forward
    selection retains each feature (day and time of day counted per one-hot column, as the code
    does). Reproduced when reach angle has the highest fraction; partially reproduced when it is
    second; not reproduced otherwise.
  depends_on:
  - regression-r2-max
