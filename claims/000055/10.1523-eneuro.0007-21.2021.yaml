- id: fig2-event-counts
  statement: Each subject contributed between 151 and 947 movement events (median 640 across
    subjects).
  source: Figure 2 legend
  quote: The total number of events for each subject was between 151 and 947 (median, 640
    across subjects).
  expected:
  - quantity: fewest events in a subject
    value: 151
    tolerance: 15.1
  - quantity: most events in a subject
    value: 947
    tolerance: 94.7
  - quantity: median events per subject
    value: 640
    tolerance: 64
  criterion: Which events are counted is not fixed by the text. Readings are (a) all
    contralateral wrist movement events the dataset holds for a subject; (b) those left after
