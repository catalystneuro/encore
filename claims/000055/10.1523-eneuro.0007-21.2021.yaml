    tolerance: 0
  - quantity: male subjects
    value: 8
    tolerance: 0
  - quantity: mean age
    value: 29.4
    tolerance: 7.9
    unit: years
  - quantity: mean surface electrodes per subject
    value: 87.0
    tolerance: 12.9
  - quantity: subjects with depth electrodes
    value: 5
    tolerance: 0
  - quantity: mean depth electrodes in those subjects
    value: 23.2
    tolerance: 12.1
  - quantity: subjects implanted in the right hemisphere
    value: 5
    tolerance: 0
  criterion: Tolerances on the means are the SDs the paper states, as the protocol allows; the
