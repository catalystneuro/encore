# Claims for Wong-Campos, Park, Davis, Qi, Fan, Marblestone, Grimm, Lavis, Cohen et al.,
# "Voltage dynamics of dendritic integration and back-propagation in vivo", on dandiset 001791.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21,
# protocol as stated in docs/protocol.md.
#
# Text read: the bioRxiv preprint, version 1 (doi:10.1101/2023.05.25.542363v1), from its JATS
# XML as stored under paper/: main text, figure legends, Methods, and the legends of the
# supplementary figures S1 to S14. No PDF was available, so values printed only inside figures
# (the p-values of Figs. 3i, 4d and 4h, the points of Figs. 2e, 2f, 3i, 4h and S13) could not be
# read. Movie S1 was not read. The paper links no analysis code of its own; the only code it
# names is NoRMCorre (github.com/flatironinstitute/NoRMCorre), used for xy motion correction,
# which fixes no criterion below. No repository was read.
#
# Data the paper describes. Layer 2/3 pyramidal neurons of mouse barrel cortex, expressing
# Optopatch (Voltron2 labelled with JFX608, and CheRiff-eYFP) after in utero electroporation of
# CD1 mice; cranial windows at 4 weeks, both sexes. One-photon dual-plane structured illumination
# voltage imaging, camera 1 on the soma and camera 2 on apical dendrites, at 500 or 1,000 Hz,
# with DMD-targeted blue light for optogenetic stimulation. Measured variables are fluorescence
# traces (dF/F) at the soma and at dendritic recording sites, contour distances from HiLo
# morphology reconstructions, and the timing of optogenetic and air-puff stimuli. Experiments:
#  - Fig. 1, one neuron, soma and four apical dendrites, 0.5 s widefield blue pulses of
#    increasing intensity.
#  - Fig. 2, bAP mapping in anesthetized mice (0.7 to 1% isoflurane), soma-targeted stimuli of
#    40 pulses, 8 ms, 5 Hz, per camera 2 field of view; 30 recording sites, 5 neurons, 5 mice.
#  - Fig. 3a-d and S8, S9, spontaneous activity in 3 to 5 simultaneously recorded dendrites,
#    anesthetized (1% isoflurane) and quietly awake; 23 branch pairs, 3 neurons, 3 mice.
#  - Fig. 3e-i and S10, round-robin dendrite-targeted stimulation (50 repeats, 10 ms, 5 Hz)
#    below the somatic spike threshold; 92 pairs, 5 neurons, 5 mice. Fig. S11, stronger
#    dendrite-targeted stimuli, 40 trials.
#  - Fig. 4a-d and S12, spontaneous activity at soma and dendrites in awake mice; 216 doublet
#    events and 186 spike triplets, 10 branches, 3 neurons, 3 mice.
#  - Fig. 4e-h and S13, sustained (400 ms) soma-targeted blue light; 16 trials, 25 branches,
#    7 neurons, 7 mice.
#  - Fig. 4i-l, 100 ms, 45 psi air puffs to the contralateral whiskers every 4 s in awake mice;
#    13 trials.
# The dandiset's description says it holds "the traces from our analysis pipeline", which the
# Methods describe as photobleaching-corrected, PCA-extracted per-branch traces. The background-
# robust dF/F of the Methods is computed from spike-triggered average movies; whether the
# dataset holds it, or the morphology distances, is the author's to find.
#
# Details the paper leaves open are named in each criterion with the readings its text allows.
# Where a criterion uses p < 0.05 as its threshold and the paper prints no alpha, that is the
# conventional reading of the paper's tests, and is said so.
schema_version: 2
dataset:
  archive: dandi
  id: "001791"
paper: doi:10.1101/2023.05.25.542363
claims:
- id: fig1d-light-intensity-spike-rate
  statement: In vivo, 0.5 s pulses of blue light of increasing intensity evoke somatic spiking
    at increasing rates, with corresponding bAPs in the dendrites.
  source: Figure 1d legend; Results, Dendritic voltage mapping, paragraph 1
  quote: Optogenetic stimulation with pulses of increasing blue light intensity evoked action
    potentials with increasing spike rates and corresponding bAPs in the dendrites.
  criterion: Shown for one neuron (Fig. 1c-d). Somatic spikes are counted in each blue light
    pulse of the intensity series; the paper gives no spike detection method, so spikes are
    detected under two readings, (a) peaks above 5 and (b) above 4 robust standard deviations
    (median absolute deviation) of the high-pass filtered soma trace, a standard choice that
    the paper does not fix. Reproduced when, under both readings, the spike rate rises with
    pulse order (Spearman rho > 0 and higher in the last pulse than in the first), and the
    dendritic traces show events within 5 ms after most somatic spikes.
- id: fig1fg-dendrite-peaks-after-soma
  statement: Spike-triggered averages of dendritic fluorescence, triggered off somatic spike
    times, peak after the somatic spike, as expected for back-propagation.
  source: Figure 1f-g legend; Results, Dendritic voltage mapping, paragraph 1
  quote: The dendritic events peaked after the somatic spike (dashed line), as expected for
    back-propagation.
  criterion: For the Fig. 1 neuron, the spike-triggered average of each dendritic trace,
    triggered off the somatic spike peaks. Reproduced when the dendritic STA peak follows the
    somatic peak (delay > 0) at all four dendrites; partially reproduced for two or three.
- id: fig2c-no-trial-variation
  statement: For optogenetically evoked single spikes in anesthetized mice, bAP amplitude did
    not vary from trial to trial beyond baseline noise at any recording site, so bAP failures
    were infrequent.
  source: Results, Mapping bAP propagation, paragraph 1; Figure 2c
  quote: For these optogenetically evoked single spikes, we did not observe trial-to-trial
    variation in the bAP amplitude beyond baseline noise fluctuations at any of the recording
    sites (see e.g., Fig 2c ), indicating that bAP failures were infrequent under these conditions.
  criterion: The paper reports no test. For each Fig. 2 recording site (40 pulses, 8 ms, 5 Hz),
    the single-spike dendritic bAP amplitudes are compared with the baseline noise. The paper
    does not define either quantity, so two readings are run, (a) the s.d. of single-trial bAP
    amplitudes against the s.d. of the same measure taken in pre-stimulus windows of the same
    length, and (b) the fraction of single bAPs smaller than 2 s.d. of baseline noise (a
    failure count). Reproduced when, under both readings, at least 90% of sites show amplitude
    variation no larger than 1.5 times the baseline variation and failures in under 10% of
    spikes; these bounds are not in the paper and the result is reported with the values.
- id: fig2e-half-amplitude-distance
  statement: In anesthetized mice, the bAP peak amplitude decays to 50% at a contour distance
    from the soma of 242 ± 30 μm (95% C.I., 30 sites, 5 neurons, 5 mice), with R2 = 0.49 for
    amplitude against distance.
  source: Results, Mapping bAP propagation, paragraph 2; Figure 2e legend
  quote: The bAP peak amplitude decayed to 50% at a contour distance from the soma of 242 ± 30 μm
    (95% C.I., n = 30 recording sites, 5 neurons, 5 mice, Fig. 2e ).
  statistics:
  - about: contour distance at which bAP amplitude falls to 50%, printed as 242 ± 30 μm
    ci:
      level: 0.95
      low: 212
      high: 272
      unit: μm
    n: 30 recording sites, 5 neurons, 5 mice
  expected:
  - quantity: contour distance at which bAP amplitude falls to 50%
    value: 242
    tolerance: 30
    unit: μm
  - quantity: R2 of amplitude against contour distance
    value: 0.49
    tolerance: 0.049
  criterion: The distance tolerance is the paper's 95% C.I. (± 30 μm, 30 sites); the R2
    tolerance is 10%. Amplitude is the peak of each site's mean bAP waveform (-dF/F), triggered off the
    soma spike peaks, using the background-robust dF/F of the Methods (Robust estimate of
    dF/F). The paper does not say what curve is fit or what the 50% is relative to. Readings,
    (a) a linear regression of amplitude on contour distance, distance where the fit falls to
    half its value at distance 0; (b) an exponential fit, distance ln(2) times the length
    constant; (c) amplitude normalized to the somatic spike amplitude of the same recording,
    distance where the linear fit reaches 0.5. Reproduced when, under one reading, the
    distance is within 212 to 272 μm and R2 within tolerance; the readings are all reported.
- id: fig2f-delay-range
  statement: Back-propagation delays range from 1.5 to 4 ms over contour distances from the soma
    of 50 to 280 μm.
  source: Results, Mapping bAP propagation, paragraph 2; Figure 2f
  quote: Back-propagation delays ranged from 1.5 to 4 ms, over contour distances from the soma of
    50-280 μm ( Fig. 2f ).
  expected:
  - quantity: smallest peak delay, sites 50 to 280 μm from the soma
    value: 1.5
    tolerance: 0.15
    unit: ms
  - quantity: largest peak delay, sites 50 to 280 μm from the soma
    value: 4
    tolerance: 0.4
    unit: ms
  criterion: Delay is the time of the peak of each site's mean bAP waveform minus the time of
    the somatic spike peak (Fig. 2f legend, "Peak delay"). At 500 or 1,000 Hz the paper does
    not say how the peak is timed below one frame; readings, (a) the sample of the maximum and
    (b) a parabolic fit through the maximum and its two neighbours, in both soma and dendrite.
    Reproduced when, under one reading, the delays of sites between 50 and 280 μm lie within
    1.35 to 4.4 ms.
- id: fig2f-conduction-speed
  statement: At distances over 50 μm from the soma, the bAP conduction speed is 0.09 ± 0.02 m/s
    (95% C.I., 30 sites, 5 neurons, 5 mice), with R2 = 0.43 for delay against distance.
  source: Results, Mapping bAP propagation, paragraph 2; Figure 2f legend
  quote: Conduction speeds were 0.09 ± 0.02 m/s (95% C.I., n = 30 recording sites, 5 neurons, 5
    mice), consistent with prior theoretical predictions
  statistics:
  - about: bAP conduction speed beyond 50 μm, printed as 0.09 ± 0.02 m/s
    ci:
      level: 0.95
      low: 0.07
      high: 0.11
      unit: m/s
    n: 30 recording sites, 5 neurons, 5 mice
  expected:
  - quantity: conduction speed beyond 50 μm
    value: 0.09
    tolerance: 0.02
    unit: m/s
  - quantity: R2 of delay against contour distance
    value: 0.43
    tolerance: 0.043
  depends_on:
