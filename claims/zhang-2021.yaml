# Claims for Zhang, Gao, Cukur & Gallant (2021), Frontiers in Neuroscience 14:565976,
# "Voxel-Based State Space Modeling Recovers Task-Related Cognitive States in Naturalistic fMRI
# Experiments", doi:10.3389/fnins.2020.565976, on CRCNS data set vim-4 (doi:10.6080/K0668BDF).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-10,
# protocol as stated in docs/protocol.md (Reader), version pilot-14.
#
# Text read: the version of record (PMC8145286, open access), as JATS XML flattened to text under
# paper/: main text, Materials and Methods, figure legends, Table 1, and the supplement
# (Data_Sheet_1.DOCX, legends of Supplementary Figures 1 to 5). No PDF was supplied. The
# per-subject CSI values of the attention task are printed only inside the images of
# Supplementary Figures 1 and 2; they were read from the images in the supplement file (S1
# 0.51, 0.79, 0.64; S3 0.70, 0.71, 0.05; S4 0.64, 0.69, 0.47; S5 0.66, 0.74, 0.59; S6 0.60, 0.71,
# 0.61, for attend-humans, attend-vehicles and passive). The images of Figures 1 to 4 of the main
# text were not available, so the pattern of Figure 3B is not known here. Two inconsistencies of
# the paper, noted where they matter. (1) The means of the six per-subject CSIs in Figure 1 and
# the supplement (0.64, 0.72, 0.51) are not exactly the means the Results give (0.66, 0.74, 0.53).
# (2) The Figure 1 legend says blue is "only humans present" and green "only vehicles present";
# the supplement legend and the plotted positions say the reverse (green humans, blue vehicles).
# The video game subjects are S1 and S7 in the text and C1 and C2 in the legends of Figure 3 and
# Supplementary Figure 4; C1 is S1 (CSI 0.72 in both) and C2 is S7.
# The data set's description (paper/vim-4.data-description.txt) was read only to know what it
# holds; no claim comes from it. It says subject S4 of the attention task is not in the data set
# (no consent for release), so attention-task claims over subjects are tested on S1, S2, S3, S5
# and S6.
#
# Code read: https://github.com/gallantlab/state-space, commit 6ffb3c30 (2020-09-12), linked from
# the paper's Data Availability Statement. StateSpace.py holds the HRF deconvolution
# (estimate_devonvolved_response, RidgeCV on delayed features, weights averaged over delays,
# z-scored), the state space (extract_state_space_positions), the passive-data subsampling, a
# Monte Carlo JSD between two multivariate normals, and plotting; Example.ipynb fits the state
# space of the attention task for S1 from the data set's deconvolved data. The code has no CSI
# averaging, no classifier, no permutation test and no video game analysis.
#
# Method choices the code settles where the Methods are silent, used in the criteria below:
# the OLS regression includes an intercept column (pinv of the normal equations); PCA is
# scikit-learn PCA (mean-centred) with 24 components fitted on the [TR x voxel] responses; the
# denoised weights are U U^T B^T for the task variables; the state directions are the first
# (number of variables) columns of Q from the QR of the denoised [voxel x variable] weights (a
# reduced QR gives the same columns; the code warns that QR can flip signs); positions are the
# responses times these directions, then z-scored per dimension over all TRs analysed. For the
# attention task the state space is fitted once per subject on the passive, attend-human and
# attend-vehicle TRs stacked (900 each in the data set's deconvolved files, passive already
# subsampled to the attentive movies), with the three columns of the data set's state labels as
# task variables. The JSD between two fitted normals is estimated from 1000 samples of each, in
# log base 2 (so bounded by 1). In plots the human and vehicle axes are sign-oriented so that the
# "both present" mean lies above the "neither" mean.
#
# Data the paper used. Visual attention task: six subjects (S1 to S6) watching natural movies
# while fixating, in attend-humans, attend-vehicles (three 10-min runs each) and passive viewing
# sessions; 3T, TR 2 s, 2.24 x 2.24 x 3.5 mm voxels, cortical voxels only (48,673 +/- 4,382 per
# subject); detrended (240-s third-order Savitzky-Golay), z-scored, then HRF-deconvolved with a
# WordNet-label voxelwise model (FIR delays 1 to 4 TRs, ridge with 10-fold CV, weights averaged
# over delays). Task variables per TR are human presence, vehicle presence and attention
# condition; the 12 classification labels are the four presence combinations by three
# conditions. Video game task (Counter Strike, Source): S1 and S7, one with six 15-min runs (90
# min) and the other with three (45 min); the paper says "one subject" and "the second subject"
# and does not name which is which, BOLD not deconvolved, nine non-exclusive behavioural states labelled per
# TR by two observers (dead, round start, safe explore, unsafe explore, kill, engage close,
# engage far, flash, run away); S7 had no flash events. The data set's description lists
# preprocessed and deconvolved attention data, semantic and state labels, video game data and
# per-TR state labels, and fsaverage mappers; it lists no functional localizer or ROI data.
#
# Details the paper and code leave open, named in the claims they touch: the number of
# permutations and how labels are permuted; how the 10 folds are formed; the distance used to
# assign a held-out TR to the nearest cluster; how z-scoring is applied to held-out TRs; how TRs
# with several or no video game states enter the clusters and the classifier; the clusters of
# the video game CSI; the form of the passive-against-attentive test; which weights are mapped
# onto the cortex; the ROI definitions; for the video game, the sign of each dimension and the
# order of the nine variables in the QR (the code has no video game analysis); the voxel
# thresholds of Figures 2 and 4.
schema_version: 2
paper: doi:10.3389/fnins.2020.565976
claims:
- id: fig1-csi-s2
  statement: In subject S2 the four presence states (neither, humans only, vehicles only, both)
    are significantly separated in the attention-task state space, with a cluster separation
    index of 0.75 for attend-humans, 0.69 for attend-vehicles and 0.67 for passive viewing.
  source: Figure 1 legend
  quote: The cluster separation index (CSI) is 0.75 for attend-humans, 0.69 for attend-vehicles,
    and 0.67 for passive ( p < 1e-5, permutation test), all indicating significant separation of
    the clusters
  statistics:
  - test: permutation test
    p: 1.0e-5
    p_relation: "<"
    n: subject S2, each attention condition
  expected:
  - quantity: CSI, S2, attend-humans
    value: 0.75
    tolerance: 0.075
  - quantity: CSI, S2, attend-vehicles
    value: 0.69
    tolerance: 0.069
  - quantity: CSI, S2, passive
    value: 0.67
    tolerance: 0.067
  criterion: State space as in the code (see the opening comment), fitted on S2's three
    conditions stacked. For each condition, the CSI as the Methods define it (Quantification of
    State Space Results, paragraph 1), a multivariate normal (sample mean and covariance) fitted
    to the TRs of each of the four presence states in the 3-dimensional state space, the JSD of
    every pair estimated as in the code's JSD function, and the CSI the mean of the six JSDs.
    Significance by permutation as in the Methods (paragraph 2), "permuting the state labels,
    and performing the full analysis using the permuted labels". The number of permutations is
    open (a p below 1e-5 needs at least 1e5); use at least 1000 and report p as (k+1)/(n+1).
    Which labels are permuted is open; the readings are (a) the human and vehicle presence labels
    shuffled together across TRs, the state space refitted each time, and (b) the same with the
    labels circularly shifted within each condition, which keeps their autocorrelation.
    Reproduced when all three CSIs are within tolerance and each exceeds every null value under
    a reading. The Monte Carlo JSD varies with the seed; report the mean over 10 seeds.
