- id: att-passive-lower
  statement: Attention increases state separation; the CSI under passive viewing is
    significantly lower than under the attentive conditions in five of the six subjects.
  source: Results, The Voxel-Based State Space Method Recovers a State Space for Variables in
    the Attention Task, paragraph 2; Figure 1 legend; Discussion, paragraph 2
  quote: Furthermore, we found that the CSI in the passive condition was significantly lower than
    the CSI in the attentive conditions for five out of the six subjects ( p < 1e-5; permutation
    test)
  depends_on:
  - att-csi-group
  expected:
  - quantity: subjects with passive CSI significantly lower, of six
    value: 5
    tolerance: 0
  criterion: CSIs as in fig1-csi-s2. The paper does not give the form of this test. The
    readings are (a) passive against each attentive condition, both differences significant;
    (b) passive against the mean of the two attentive CSIs. The null in either is formed by
    permuting the attention-condition labels between passive and attentive TRs (the presence
    labels kept), either (i) refitting the state space each time, as the Methods' "full analysis"
    says, or (ii) keeping the fitted positions and reassigning TRs to conditions; p is one-sided
    (passive lower). A subject counts at the paper's threshold, p < 1e-5, which needs at least
    1e5 permutations; where fewer can be run (at least 1000), a subject counts when its
    difference exceeds every null value, the bound reached is reported, and the count at p <
    0.05 is shown as a variant. The data set holds five of the six subjects. Reproduced when the
    passive CSI is significantly lower in at least 4 of the 5 under a reading, which is what five
    of six allows; not reproduced otherwise. From the
    figure values, S1 (passive 0.64 against attend-humans 0.51) and S6 (0.61 against 0.60) fail
    reading (a) on the raw values, so the per-reading counts are reported.
- id: att-classification
  statement: Held-out TRs of the attention task are classified into the 12 labels (four presence
    states by three attention conditions) from their position in the learned state space at
    48.4 +/- 7.6% across subjects, well above the chance of 8.3%.
  source: Results, The Voxel-Based State Space Method Recovers a State Space for Variables in
    the Attention Task, paragraph 3
  quote: Average performance across subjects is 48.4 ± 7.6% ( p < 1e-5, permutation test, chance =
    8.3%)
  statistics:
  - test: permutation test
    p: 1.0e-5
    p_relation: "<"
    n: 6 subjects, 10-fold cross-validation each
  expected:
  - quantity: mean classification accuracy across subjects, 12 labels
    value: 48.4
    tolerance: 7.6
    unit: percent
  criterion: Tolerance is the paper's stated spread across subjects. As in the Methods
    (Quantification of State Space Results, paragraph 2), per subject, 10-fold cross-validation
    over the stacked TRs of the three conditions; in each fold the state space (code's method)
    is fitted on the training 90%, the held-out TRs are projected onto its directions, and each
    is assigned to the nearest of the 12 training clusters; accuracy is averaged over folds and
    then over the five subjects in the data set. Open, with readings run each. Folds as (a)
    contiguous tenths of the stacked series, or (b) random TRs. Nearest cluster by (a) Euclidean
    distance to the cluster mean, or (b) the highest density under the multivariate normal
    fitted to the cluster, as for the CSI. Held-out positions are z-scored with the training
    means and standard deviations (the code z-scores the positions it fits; a standard choice for
    held-out data). The null permutes the 12 labels of the training TRs and repeats the
    full analysis, at least 1000 times. Reproduced when the mean is within tolerance and above
    every null mean under a reading; partially reproduced when it is significant but outside
    tolerance under all readings.
- id: att-weights-cortex
  statement: The human-presence dimension of the attention-task state space has its weights in
    face and body areas (FFA, OFA, EBA), MT+, LO, the frontal operculum and the inferior frontal
    sulcus; the vehicle-presence dimension in RSC, PPA, OPA, IPS, FEF and around the inferior
    frontal sulcus.
  source: Results, The Voxel-Based State Space Method Recovers a State Space for Variables in
    the Attention Task, paragraph 4; Figure 2; Supplementary Figure 3
  quote: The “human presence” dimension projects heavily onto FFA ( Kanwisher et al., 1997 ), OFA (
    Gauthier et al., 2000 ), and EBA ( Downing et al., 2001 ) ... In contrast, the “vehicle
    presence” dimension projects strongly onto RSC ( Maguire, 2001 ; Epstein, 2008 ), PPA (
    Epstein et al., 1999 ), and OPA ( Dilks et al., 2013 )
  data: with_inputs
  criterion: The ROIs were delineated per subject from functional localizer and retinotopic
    mapping data (Methods, Preprocessing and Visualization, paragraph 2), which the paper does
    not deposit and the data set's description does not list; the author decides whether an
    outside ROI source (for example an fsaverage atlas through the data set's mappers) can be
    used. Which weights are mapped is open; the readings are (a) the OLS weights B, (b) the
    denoised weights B_L, and (c) the state directions Q_S, each sign-oriented so that the
    dimension's own state has a positive mean position. Figure 2 and Supplementary Figure 3
    threshold voxels by the prediction performance of a semantic encoding model at uncorrected p
    < 0.05. The data set holds the semantic labels and the preprocessed BOLD, so the threshold
    has two readings, (i) no threshold and (ii) voxels whose cross-validated prediction by the
    WordNet model of the deconvolution (Methods, Deconvolution, FIR delays 1 to 4, ridge with
    10-fold CV) is significant at uncorrected p < 0.05; the test of the prediction is open
    (correlation of predicted and measured responses, against zero or by permutation). Per
    subject and ROI, the mean weight. Reproduced when, in at least 4 of the 5 subjects, the mean
    human-presence weight is positive and above the mean vehicle-presence weight in FFA, OFA and
    EBA, and the reverse holds in RSC, PPA and OPA, under a reading. The other named regions are
    reported, including those the Figure 2 legend adds (SEF for the human-presence dimension, FO
    for the vehicle-presence dimension).
- id: game-csi
  statement: In the video game task the behavioural states are distinctly and significantly
    separated in the 9-dimensional state space, with CSI 0.72 in subject S1 and 0.62 in S7.
  source: Results, The Voxel-Based State Space Method Recovers a Behavioral State Space for the
    Open-Ended Video Game Task, paragraph 2; Figure 3A
  quote: The states are distinctly separated with a CSI of 0.72 in subject S1 and 0.62 in subject
    S7 ( p < 1e-5, permutation test)
  statistics:
  - test: permutation test
    p: 1.0e-5
    p_relation: "<"
    n: subjects S1 and S7
  expected:
  - quantity: CSI, S1, video game
    value: 0.72
    tolerance: 0.072
  - quantity: CSI, S7, video game
    value: 0.62
    tolerance: 0.062
  criterion: State space by the code's method on each subject's BOLD data (no deconvolution, as
    the Methods say) with the nine state columns as task variables. CSI as in fig1-csi-s2, in
    the 9-dimensional space. The clusters are open, and the states are not exclusive. Readings
    are (a) one cluster per state, a TR entering the cluster of every state it has; (b) one
    cluster per state from TRs with exactly one state; (c) the three groups of Figure 3A (safe
    explore, engage close, all other TRs). A state with no TRs (flash in S7) or too few to fit
    a covariance is left out and the count reported. Permutations as in fig1-csi-s2, shuffling
    the rows of the state matrix. Reproduced when both CSIs are within tolerance and above every
    null value under a reading.
- id: game-mutual-negative-projection
  statement: The mutually exclusive states engage close and safe explore each project negatively
    onto the other's dimension of the video game state space.
  source: Results, The Voxel-Based State Space Method Recovers a Behavioral State Space for the
    Open-Ended Video Game Task, paragraph 3; Figure 3A legend
  quote: For example, “engaging close” and “safe explore” each project negatively to the dimension
    associated with the other state ( Figure 3A ) ( p < 1e-5, permutation test)
  statistics:
  - test: permutation test
    p: 1.0e-5
    p_relation: "<"
    n: subjects S1 and S7
  depends_on:
  - game-csi
  criterion: State space as in game-csi. The code has no video game analysis, and two details
    that change the dimensions are open. The sign of each dimension, with readings (a) its own
    state's TRs have a positive mean position (by analogy with the code's plotting, which flips
    an axis by cluster means), (b) the diagonal of R made positive, so that the dimension points
    along the state's denoised weight vector. The order of the nine variables entering the QR,
    since each column of Q is orthogonalized against the earlier ones, with readings (i) the
    order of Table 1 (dead, round start, safe explore, unsafe explore, kill, engage close, engage
    far, flash, run away) and (ii) the order of the columns of the data set's state matrix. The
    measure is the mean position of engage-close TRs on the safe-explore dimension and of
    safe-explore TRs on the engage-close dimension. The null permutes the rows of the state
    matrix and refits, at least 1000 times, one-sided for a negative mean. Reproduced when both
    means are negative and significant at p < 0.05 in both subjects; partially reproduced in one
    subject.
- id: fig3b-state-relations
  statement: States of the video game project at significant non-zero positions on other states'
    dimensions, an asymmetric pattern found in both subjects that differs between them.
  source: Figure 3B and its legend; Results, The Voxel-Based State Space Method Recovers a
    Behavioral State Space for the Open-Ended Video Game Task, paragraph 3
  quote: Relationships between states are reflected in non-zero projections of states on to other
    state dimensions ... Colors indicate Bonferroni-corrected significance ( p < 0.01, permutation
    test)
  statistics:
  - test: permutation test
    p: 0.01
    p_relation: "<"
    corrected: Bonferroni
    n: subjects S1 and S7
  depends_on:
  - game-mutual-negative-projection
  criterion: The figure's matrix was not available to this reader, so no per-pair result is
    fixed. For each ordered pair of different states, the mean position of the row state's TRs
    on the column state's dimension, with the sign and order readings of
    game-mutual-negative-projection, and a two-sided permutation test as there. The number of
    tests Bonferroni corrects for is open; readings are (a) the off-diagonal pairs the subject
    has (72, or 56 for S7, who has no flash) and (b) every cell of the matrix (81, or 64 for S7);
    corrected threshold 0.01. Reproduced when each subject has significant
    off-diagonal pairs, the matrix is asymmetric in at least one pair, and the two subjects'
    sets of significant pairs differ. The full matrices are reported for comparison with the
    figure.
- id: game-classification
  statement: Held-out TRs of the video game task are classified into the nine behavioural states
    from their position in the learned state space with balanced accuracy 32.8 +/- 3.8% in S1
    and 30.4 +/- 4.2% in S7, above the chance of 11%.
  source: Results, The Voxel-Based State Space Method Recovers a Behavioral State Space for the
    Open-Ended Video Game Task, paragraph 4
  quote: Average balanced accuracy across 10 cross-validation folds in the subject is 32.8 ± 3.8%
    in subject S1 and 30.4 ± 4.2% in subject S7 ( p < 1e-5, permutation test, chance = 11%)
  statistics:
  - test: permutation test
    p: 1.0e-5
    p_relation: "<"
    n: subjects S1 and S7, 10 folds each
  depends_on:
  - game-csi
  expected:
  - quantity: balanced accuracy, S1
    value: 32.8
    tolerance: 3.8
    unit: percent
  - quantity: balanced accuracy, S7
    value: 30.4
    tolerance: 4.2
    unit: percent
  criterion: Tolerances are the paper's stated spread across folds. Cross-validation as in
    att-classification, with the nine state clusters, and balanced accuracy (mean recall over
    classes, Brodersen et al. 2010) averaged over folds. Folds and nearest-cluster distance have
    the readings of att-classification. How a TR with several states or none is labelled is
    open; readings are (a) TRs with exactly one state only; (b) every labelled TR, a prediction
    counted correct for each of its states that it names and recall computed per state over the
    TRs that have it. Classes with no TRs (flash in S7) are left out. Null as in
    att-classification. Reproduced when both values are within tolerance and above every null
    value under a reading; partially reproduced when significant but outside tolerance.
- id: game-weights-two-groups
  statement: The video game state dimensions fall into two groups, dead, round start, safe
    explore, unsafe explore and flash in TPJ, precuneus and prefrontal cortex (default-mode
    areas), and kill, engage close, engage far and run away in motor, premotor and
    supplementary motor areas, IPS, FEF and SEF; the weights are largely consistent across the
    two subjects.
  source: Results, The Voxel-Based State Space Method Recovers a Behavioral State Space for the
    Open-Ended Video Game Task, paragraph 5; Figure 4; Supplementary Figures 4 and 5
  quote: They appear to fall into two general categories. The dimensions for “safe explore,”
    “round start,” “flash,” “dead,” and “unsafe explore” project on to the TPJ, precuneus, and
    prefrontal cortex. The dimensions for “run away,” “engage close,” “kill,” and “engage far”
    project on to the motor, pre-motor, and supplementary motors areas, and also in IPS, FEF, and
    SEF ... The weights for each dimension are largely consistent across the two subjects
  data: with_inputs
  depends_on:
  - game-csi
  criterion: The paper groups the dimensions by the regions their weights project onto, read
    from the maps (Figure 4, Supplementary Figures 4 and 5); it gives no quantitative grouping
    method. The regions need definitions the data set does not list (see att-weights-cortex);
    the author decides whether an outside source can be used (functional ROIs for IPS, FEF and
    SEF; an fsaverage atlas, through the data set's mappers, for TPJ, precuneus, prefrontal,
    motor, premotor and supplementary motor cortex). Weights with the readings of
    att-weights-cortex, the Q_S reading also under the order readings of
    game-mutual-negative-projection. Figure 4 thresholds voxels by "an encoding model" at
    Bonferroni-corrected p < 0.05, the model not named; readings are (i) no threshold and (ii)
    voxels whose cross-validated prediction by the nine-state OLS model is significant at that
    level. Per subject, dimension and region, the mean weight. Reproduced when, in both
    subjects, every dimension of the first group (dead, round start, safe explore, unsafe
    explore, flash; no flash in S7) has a positive mean weight in TPJ, precuneus and prefrontal
    cortex and a higher one there than in the second group's regions, and every dimension of the
    second group (kill, engage close, engage far, run away) the reverse in motor, premotor and
    supplementary motor cortex, IPS, FEF and SEF, allowing one dimension per subject to fail,
    under a reading; not reproduced otherwise. As a variant not taken from the paper and not
    deciding the outcome, the Pearson correlation across voxels between the weight maps of every
    pair of dimensions, with average-linkage clustering on one minus correlation cut into two
    groups, is reported. The paper gives no measure of "largely consistent across the two
    subjects"; the correlation of each dimension's map between subjects on fsaverage is
    reported, and the consistency part is said to hold when its median over shared dimensions is
    positive, a reading of the reader's, stated as such.
