  quote: 'While the presence of phage significantly reduced R. solanacearum densities at both temperatures
    (phage: F1,36 = 48.80, p < .001'
  statistics:
  - test: three-way repeated-measures ANOVA, phage effect
    statistic: F(1, 36) = 48.80
    p: 0.001
    p_relation: "<"
    n: 40 populations (10 per treatment), six time points
  criterion: The ANOVA of fig1b-temperature-density. Reproduced when the phage effect has p < 0.05
    and, at each temperature, the mean OD600 over populations and time points is lower with phage
    than without.
- id: fig1b-phage-effect-diminishes
  statement: The reduction of bacterial density by phage diminished over time, with a significant
    temperature by phage by time interaction.
  source: Results, Ralstonia solanacearum and phage population density dynamics, paragraph 1;
    Figure 1B; Supplementary Table S1a
  quote: 'the phage effect on bacteria gradually diminished over time, likely due to the emergence
    of phage-resistant mutants (temperature × phage × time: F5,180 = 3.870, p < .01'
  statistics:
  - test: three-way repeated-measures ANOVA, temperature by phage by time interaction
    statistic: F(5, 180) = 3.870
    p: 0.01
    p_relation: "<"
    n: 40 populations, six time points
  criterion: The ANOVA of fig1b-temperature-density. The paper gives no test of the decline itself.
