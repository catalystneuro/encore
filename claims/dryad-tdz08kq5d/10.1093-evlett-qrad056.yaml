- id: auc-phage-reduction-by-temperature
  statement: Over the whole experiment, phages reduced bacterial density (area under the density
    curve) more at 25 degrees C (66.8%) than at 35 degrees C (37.18%), with a significant phage
    effect at each temperature.
  source: Results, Ralstonia solanacearum and phage population density dynamics, paragraph 1
  quote: We found that phages reduced the bacterial growth more clearly at 25 °C compared with 35
    °C temperature treatment (66.8% vs. 37.18% density reductions; 25 °C... p < .001, 35 °C...
    p < .001, respectively)
  statistics:
  - about: phage effect on area under the density curve at 25 degrees C
    test: ANOVA
    statistic: F(1, 19) = 88.78
    p: 0.001
    p_relation: "<"
    n: 10 +P and 10 -P populations
  - about: phage effect on area under the density curve at 35 degrees C
    test: ANOVA
    statistic: F(1, 19) = 15.66
    p: 0.001
    p_relation: "<"
    n: 10 +P and 10 -P populations
  expected:
  - quantity: density reduction by phage at 25 degrees C
    value: 66.8
    tolerance: 6.68
    unit: percent
  - quantity: density reduction by phage at 35 degrees C
    value: 37.18
    tolerance: 3.72
    unit: percent
  criterion: Area under each population's OD600 curve over the transfers, compared between +P and -P
    by one-way ANOVA at each temperature (Methods, one-way ANOVA for data without time structure).
    The reduction is 1 minus the mean +P area over the mean -P area. The paper does not say how the
    area is taken. Readings are (a) trapezoidal area over all six time points, (b) trapezoidal area
    over the five time points after inoculation, (c) the sum of OD600 over all six time points.
    The reported df (1, 19) imply 21 values where 20 populations give (1, 18); the F values are
    not targets. Reproduced when, under every reading, both reductions are within tolerance, the
    25 degrees C reduction is the larger, and both ANOVAs give p < 0.05; when the readings give
    different outcomes, the claim is blocked as methods_underspecified.
