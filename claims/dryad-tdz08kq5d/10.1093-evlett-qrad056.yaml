# Claims for Wang, Wang, Yang, Lu, Fields, Xu, Shen, Wei & Friman (2024), Evolution Letters,
# doi:10.1093/evlett/qrad056, on Dryad dataset doi:10.5061/dryad.tdz08kq5d.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-10-27,
# protocol as stated in docs/protocol.md.
#
# Text read: the version of record, full text from Europe PMC (PMC10959482, full-text XML), with
# Methods, figure legends, Table 1, and the supplement (qrad056_suppl, Supplementary Figures
# S1 to S5 and Tables S1 to S6, including the ANOVA tables S1 to S3). The dataset's files were not
# opened. Its archive entry names one Excel workbook of the data for all figures and a README.
#
# Code read: the analysis code the Dryad entry links, Zenodo record 8420504
# (doi:10.5281/zenodo.8420504), one file all_r_scripts.R (md5 cff6a1c2e424a2f74ec289cd4888afa8).
# It holds plotting code for Figures 1B, 1C, 2 and 3, the growth-curve fits and a summarySE helper.
# It holds no ANOVA. What it settles: growth parameters are fitted with grofit gcFitModel at its
# default settings, which fit the logistic, Richards, Gompertz and exponential Gompertz models and
# keep the one with the lowest AIC (grofit 1.1.1-1 source, grofit.control and gcFitModel); the
# Methods say a logistic model, so logistic is the main reading here and the code's AIC choice is a
# variant. Failed fits are set to 0 in the code. The ancestral twitching diameter drawn as the
# dashed line of Figure 2D is 9.38 cm.
#
# Data the paper used, as it reports them.
# - Selection experiment: ancestral R. solanacearum RS-N grown with (+P) or without (-P) phage
#   NNP42 at 25 or 35 degrees C, 10 replicate populations per treatment (40 populations), five
#   2-day serial transfers (12 days). Bacterial OD600 at every transfer (six time points in the
#   ANOVA of Table S1a); phage density (PFU/ml, log10-transformed for analysis) at every second
#   transfer in the 20 +P populations (three time points in Table S1b).
# - Day 12: four randomly chosen replicates per treatment plated on TTC agar; counts of mucoid (M)
#   and small colony variant (SCV) colonies; eight clones per replicate, 128 clones in all.
# - Each of the 128 clones, at 30 degrees C: phage resistance R = OD600(+phage)/OD600(-phage) after
#   24 h, three technical replicates; growth curves (OD600 at 0, 4, 8, 12, 20, 24, 28, 36 and 48 h,
#   three technical replicates) giving maximum growth rate (mu) and carrying capacity (A).
# - A subset of 28 evolved clones and the ancestor (29 clones; four M and four SCV per treatment,
#   four SCV only at 35 degrees C +P): twitching motility (colony diameter, three technical
#   replicates, 72 h), biofilm (crystal violet OD570, three technical replicates) and disease
#   incidence in tomato (stem injection, three blocks of six plants, percentage wilted per block).
# - 28 evolved clones sequenced (Illumina), variants called against the RS-N reference.
# - Phage adsorption of the ancestor and of phcS, gspE, gspF and pilD mutants (Figure S3); growth
#   of pilB and pilM transposon mutants and their wild types with and without phage (Table S6).
# - RNA-seq of the ancestor with and without phage, 6 h, five replicates each.
# Statistics (Methods): repeated-measures ANOVA with populations as subjects for time series;
# one- and two-way ANOVA otherwise, Tukey for pairwise; p < .05; R 3.6.3.
#
# Data held elsewhere: the paper deposits the sequencing reads of the evolved clones and the
# transcriptomics raw data in NCBI SRA under PRJNA1028400 and PRJNA1032726, without saying which
# accession holds which. The Methods also say the transcriptomics raw data can be shared on request.
#
# Details the paper and code leave open, used below with the readings named in each criterion:
# the unit of the Figure 2A to 2C ANOVAs (Table S3a to S3c have residual df 15, so 22 units, which
# fits neither the 16 replicates nor the 128 clones); the type of sums of squares; how the area
# under the density curve is taken; which comparison gives F1,18 = 174.5 and F1,6 = 27.22; and
# what "0.24%" refers to.
schema_version: 2
