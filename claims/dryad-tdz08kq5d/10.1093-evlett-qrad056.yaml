    stated direction.
- id: rnaseq-virulence-genes-down
  statement: Phage exposure downregulated motility genes and type II (e.g. gspG, rcpA, tadC) and type
    III secretion system genes (several hrp and hrc genes).
  source: Results, Activation of restriction modification and abortive infection phage defense
