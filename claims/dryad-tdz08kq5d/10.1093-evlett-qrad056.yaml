- id: fig1b-temperature-density
  statement: R. solanacearum reached higher population densities at 35 degrees C than at 25 degrees
    C during the selection experiment.
  source: Results, Ralstonia solanacearum and phage population density dynamics, paragraph 1;
    Figure 1B; Supplementary Table S1a
  quote: In general, R. solanacearum reached higher population densities at 35 °C than at 25 °C
    (temperature, F1,36 = 73.989, p < .001
  statistics:
  - test: three-way repeated-measures ANOVA, temperature effect
    statistic: F(1, 36) = 73.989
    p: 0.001
    p_relation: "<"
    n: 40 populations (10 per treatment), six time points
  criterion: From the Methods and Table S1a, a repeated-measures ANOVA of OD600 with population as
    subject (Error term on population), temperature, phage and time (a factor, df 5) and all their
    interactions; OD600 untransformed, as the Methods name a transformation for phage density only.
    Reproduced when the temperature effect has p < 0.05 and the mean OD600 over populations and
    time points is higher at 35 than at 25 degrees C.
- id: fig1b-phage-reduces-density
  statement: Phage presence reduced R. solanacearum densities at both temperatures.
  source: Results, Ralstonia solanacearum and phage population density dynamics, paragraph 1;
