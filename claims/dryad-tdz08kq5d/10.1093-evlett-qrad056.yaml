    and phcS are up, pilD is down, and seven of the 13 meet the thresholds.
- id: rnaseq-defense-systems
  statement: Phage exposure upregulated type I restriction-modification genes (MTases, REases) and
    CBASS genes (SMODS cyclase, Gros effector) and downregulated the Wadjet gene JetC.
  source: Results, Activation of restriction modification and abortive infection phage defense
    systems..., paragraph 1; Figure 4C
  quote: Specifically, JetC gene belonging to Wadjet system, was downregulated, while genes linked to
    MTases and Reases belonging to Restriction-Modification type I system, and SMODS (cyclase) and Gros
