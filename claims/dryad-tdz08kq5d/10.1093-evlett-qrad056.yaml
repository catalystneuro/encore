- id: figs3-adsorption
  statement: pilD mutants showed reduced phage adsorption, while the phcS and the T2SS (gspE, gspF)
    mutants showed no reduction.
  source: Results, Genetic changes associated with SCVs and phage resistance, paragraphs 2 and 3;
    Supplementary Figure S3
  quote: However, either of the T2SS mutants or any of the tested phcS mutants showed no reduction in
    phage adsorption (Supplementary Figure S3), which suggests that these mutations were not associated
    with phage binding.
  criterion: Percentage adsorption is the loss of free phage after 30 min relative to the initial
    density (Figure S3 legend). Figure S3 marks differences at P < 0.05 with letters; the Methods
    name one-way ANOVA with Tukey for pairwise comparisons. Reproduced when, in a one-way ANOVA
    across strains with Tukey comparisons, every pilD mutant adsorbs less than the ancestor at
    p < 0.05 and no phcS, gspE or gspF mutant adsorbs significantly less than the ancestor. The
    paper's sentence for pilD is "We also confirmed that pilD mutants observed in our experiment
    showed reduced phage adsorption".
- id: rnaseq-differential-expression-count
  statement: After 6 h of phage exposure, 1477 R. solanacearum genes were differentially expressed,
    707 up and 770 down.
  source: Results, Activation of restriction modification and abortive infection phage defense
    systems..., paragraph 1; Figure 4A
  quote: We found that a total 1477 of R. solanacearum genes were differentially expressed after phage
    exposure (|log2foldchange| > 1, FDR < 0.05, Figure 4A). Of these, around half (707) were upregulated,
    and another half (770) downregulated in the presence of phage.
  data: elsewhere
  where: NCBI SRA PRJNA1028400 or PRJNA1032726 (the paper does not say which holds the RNA-seq)
  expected:
  - quantity: differentially expressed genes
    value: 1477
    tolerance: 147.7
  - quantity: upregulated genes
    value: 707
    tolerance: 70.7
  - quantity: downregulated genes
    value: 770
    tolerance: 77
  criterion: From the Methods, reads trimmed with cutadapt (error rate 0.1, overlap 5, minimum length
    15), mapped to the RS-N reference with Hisat, counted with HTSeq, and tested with DESeq2 between
    five phage and five control samples; differentially expressed means |log2 fold change| > 1 and
    FDR < 0.05. Tool versions and DESeq2 options are not given; DESeq2 defaults (Wald test,
    Benjamini-Hochberg adjusted p as the FDR, no fold-change shrinkage) are the standard choice.
    Reproduced when all three counts are within tolerance.
- id: rnaseq-kegg-enrichment
  statement: Five KEGG pathways were enriched in the phage compared to the control treatment, namely
