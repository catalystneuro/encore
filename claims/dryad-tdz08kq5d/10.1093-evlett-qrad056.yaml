    corrected p. Reproduced when the five named pathways are enriched at p < 0.05 under both
    readings; when the readings differ, the claim is blocked as methods_underspecified.
- id: rnaseq-mutated-genes-expression
  statement: Under phage exposure phcR and phcS were upregulated and pilD and other pilus and fimbrial
    genes downregulated; seven of the 13 genes mutated under phage selection were differentially
    expressed.
  source: Results, Activation of restriction modification and abortive infection phage defense
    systems..., paragraph 1; Figure 4B and 4C
  quote: For example, phcR and phcS virulence-associated genes that were significantly upregulated,
    while pilD and other pilus biogenesis and adherence (fimbriae) associated genes were significantly
    downregulated in the presence of phage (Figure 4B and C). Of 13 mutated genes that were selected
