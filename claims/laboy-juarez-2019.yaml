# Claims for Laboy-Juarez, Langberg, Ahn & Feldman (2019), "Elementary motion sequence detectors in
# whisker somatosensory cortex", Nature Neuroscience 22, 1438-1449, doi:10.1038/s41593-019-0448-6,
# tested on CRCNS ssc-9 (primary; doi:10.6080/K0FJ2F13, "Extracellular recordings in mouse barrel
# cortex during single- and 2-whisker stimulation", whose description names this paper as the
# basis of its three experiments).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-10,
# protocol pilot-14 as stated in docs/protocol.md (Reader).
#
# Text read. paper/10.1038-s41593-019-0448-6.txt, the version of record (PDF supplied by a person,
# extracted with PyMuPDF), with the main text, figure legends, Methods, Data and Code availability,
# the Nature Research reporting summary, and the supplement (41593_2019_448_MOESM1_ESM.pdf), which
# holds the legends of Supplementary Figures 1 to 8. The PDF was not opened: every number used
# below is printed in the text or a legend. The Methods' sparseness and supralinearity formulas
# are garbled by the extraction; they are read here as the standard lifetime sparseness of Vinje
# and Gallant (ref. 28), S = (1 - E(r)^2 / E(r^2)) / (1 - 1/n), and as
# z = (mu_CWSW - (mu_CW + mu_SW)) / sqrt(se_CW^2 + se_SW^2), which is what the legible parts say.
# The data set's description (paper/ssc-9.data-description.txt) was read only to know what it
# holds; no claim comes from it.
#
# Code. The paper links none; "The Matlab code for performing the statistical and data analyses
# are available upon request to the corresponding author" (Code availability). No code was read,
# so every method below is from the Methods, the legends and the supplement, and the details they
# leave open are named.
#
# Data the paper used. Male C57BL/6 mice. Experiments 1 and 2 under urethane anesthesia (P28 to
# 45), recordings in the C1 or D1 column with 32-channel silicon probes; experiment 3 in awake,
# head-fixed mice doing a visual lick task, recordings in L2/3 and L4 of the C1, D1 or D2 column.
# Whiskers of a 3 x 3 grid centred on the columnar whisker (CW) are deflected rostrocaudally with
# a 40 ms triphasic waveform. Layers by depth below pia, 100-417 um L2/3, 418-587 L4, 588-889 L5,
# 890-1154 L6 (Methods).
# - Experiment 1 (Fig. 1). 5 mice, 8 recording sites, 160 single units, 142 whisker-responsive.
#   261 stimuli, 9 single whiskers and all 36 two-whisker combinations at dt = 0, +-10, +-25 and
#   +-50 ms; 0.6 s inter-stimulus intervals; sham trials.
# - Experiment 2 (Figs. 2 to 7, Supplementary Figs. 3 to 8). 12 mice, 247 single units. 18
#   single-whisker stimuli (9 whiskers, peak rostral or caudal), 8 correlated and 8
#   anti-correlated CW-SW combinations and 7 + 7 SW-SW combinations (only those with the
#   rostral within-row SW), each at 100 dt values within +-50 ms at 1 ms steps; sham trials.
#   Correlated and anti-correlated stimuli are analysed apart; each such response set is a "unit"
#   (451 = 224 correlated + 227 anti-correlated; 187 combination-selective, 264 nonselective).
# - Experiment 3 (Fig. 8). 4 mice, 6 sessions, 81 single units, 74 whisker-responsive. 9 single
#   whiskers and all correlated CW-SW and SW-SW combinations at dt = -40, 0 and +40 ms, about
#   100 um amplitude, during 11.5 s trials; epochs within 200 ms of a lick excluded; Go trials
#   (about 40%) have a 2 ms blue LED flash at 10 s.
# Measured variables are spike times per trial relative to trial onset, the whiskers deflected,
# their deflection times and directions, and recording depth. Whether the data set holds sham
# trials and lick times for experiment 3 (needed for spontaneous rates, the lick exclusion and
# Fig. 8b) is the author's to find.
#
# Common method, used by every criterion unless it says otherwise (Methods, Analysis of neuronal
# data, dt smoothing, Combination selectivity, Neural decoders, Testing for statistically
# significant supralinearity).
# - Response. The spike count in 0 to 125 ms after the onset of the (first) deflected whisker,
#   averaged over trials, in spikes per stimulus.
# - Whisker-responsive. A Poisson likelihood ratio test of equal rates across the nine single
#   whiskers and sham, p < 0.05.
# - CW-tuned and SW-tuned. A unit is CW-tuned when its largest single-whisker response is to the
#   CW, SW-tuned otherwise (Results, Single-whisker receptive fields).
# - Linear prediction. The CW-alone response plus the SW-alone response (Fig. 2d, Methods).
# - Lifetime sparseness and CSI. The sparseness above over the n responses considered; the CSI
#   at a dt is the sparseness across the eight CW-SW combinations at that dt.
# - dt smoothing (experiment 2). Per combination, a 1 ms dt tuning curve of mean counts on 90% of
#   trials; Gaussian kernels with SD 0.5 to 30 ms in 0.2 ms steps; Poisson log likelihood of the
#   held-out 10%; tenfold cross-validation repeated 50 times; the SD with the highest
#   cross-validated likelihood smooths the curve built from all trials. A curve whose likelihood
#   rises monotonically with SD, or whose unsmoothed likelihood beats every smoothed one, is not
#   dt-modulated and is set to its mean over dt.
# - cwSTRF, best combination and best dt. The eight smoothed CW-SW curves of a unit; the best
#   combination and best dt are those of its maximum.
# - Combination-selective. Single-trial counts shuffled across combinations within each dt, 5000
#   times; each shuffle smoothed with the measured curves' kernels; the Mahalanobis distance of the
#   measured CSI trace (CSI across dt) from the shuffled mean, with a p-value from the 5000
#   shuffled distances; Benjamini-Hochberg false discovery rate control at 0.05 across units.
# - Decoders. Per unit, a one-versus-all logistic classifier of combination identity (eight
#   logistic functions) on the single-trial count, trials within +-5 ms of the unit's best dt,
#   trained on 90% of trials and tested on the rest, tenfold cross-validation; an ensemble of N
#   units sampled with replacement; the population answer is the combination with the largest
#   summed probability; 2500 ensembles per size (1000 for Fig. 7g; the Fig. 3e legend says 1,000,
#   a count that cannot change the means). Linear-prediction decoders
#   use counts made by adding a sampled single-trial CW count and a sampled SW count.
#
# Details the paper leaves open, used in several criteria; each criterion names the readings it
# runs.
# (O1) Sham window. Sham trials have no deflection time; the 125 ms window is placed (a) at the
#   time single deflections occur in that session's trials, or (b) over the whole sham trial,
#   scaled to 125 ms.
# (O2) Directions in experiment 2. The single-whisker responses used for responsiveness,
#   CW or SW tuning and the linear prediction of a CW-SW stimulus are (a) those in the directions
#   used in that stimulus (so the correlated and anti-correlated units of a cell can differ), or
#   (b) the mean over both directions.
# (O3) Response at the best dt (experiment 2). (a) The smoothed cwSTRF value at the best dt; (b) the
#   mean raw count over trials within +-5 ms of the best dt (as Fig. 2d is computed).
# (O4) FDR family. (a) All 451 units together; (b) correlated and anti-correlated units apart.
# (O5) Face positions. Combinations are pooled across C1 and D1 recordings by the SW's position
#   relative to the CW (row and arc), as Figs. 2g and 3f plot them.
# (O6) "Logistic functions were fit over 1,000 iterations" is read as the optimiser's iteration
#   limit; a reading as 1000 refits is a variant. Test trials for each ensemble are one held-out
#   trial per unit per combination, drawn independently for each unit (pseudo-population); the
#   number of test trials per combination is a standard choice that cannot change the means.
# (O7) "Nearly all" and "virtually all" are judged as at least 90% of units; no threshold is given.
