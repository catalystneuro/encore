# Claims for Mah, Schiereck, Bossio & Constantinople (2023), "Distinct value computations support
# rapid sequential decisions", Nature Communications 14, 7573, doi:10.1038/s41467-023-43250-x,
# tested on DANDI:001169 (primary; the dandiset's title is the paper's and its description is the
# paper's abstract, so it is meant to hold the behavioral data of the 291 rats).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-11-10, protocol pilot-14 as stated in docs/protocol.md.
#
# Text read. paper/10.1038-s41467-023-43250-x.txt, the version of record as served by Europe PMC
# (PMC10663503), with the main text, figure legends, Methods, Data and Code availability, and three
# supplement files extracted from their PDFs. Supplement 1 (MOESM1) is the Supplementary
# Information, Supplementary Figs 1 to 14 with legends; supplement 2 is the peer review file;
# supplement 3 is the reporting summary. No PDF of the main article was supplied; none was needed,
# as the text of every legend and table was legible. Source Data are not in the text read.
#
# Code read. github.com/constantinoplelab/published, folder rat_behavior, at commit b7b68ca8c107
# (HEAD, 2026-09-25; the folder was last changed in commit 87fd4a40b3, 2024-09-20, and its files
# were uploaded in f3cb954ef7, 2023-10-22). It holds MATLAB scripts that redraw each figure
# (Figures/Figure1.m to Figure5.m, FigureS1.m to FigureS14.m), the analyses they call (Analysis/:
# wtcurves, iticurves, waittime_20ul_by_previous_vol, latency_post20ul_by_previous_vol,
# regress_wt_vs_rew, regress_latency_vs_rew, block_dynamics_wt, block_dynamics_latency,
# myTauShuffleTest, myLambdaShuffleTest, model_comparison, macro_regress_overtraining_V2), the
# trial parser (utils/parse_data_from_mysql.m, getITI.m, screen_perf.m) and the generative models
# (BehavioralModel/). It does not hold the model-fitting code: Figure3.m and FigureS8.m load fitted
# parameters from ModelFits/<project>/BestFit.mat. The paper deposits "The rat behavioral data and
# model fits" on Zenodo, doi:10.5281/zenodo.10031483 (Data availability); those fits are outside
# data for the model claims (step 4).
#
# Data the paper used. 291 Long-Evans rats (184 male, 107 female, Methods, Subjects; the Methods
# section "Training for male and female rats" says 160 male and 114 female, and Supplementary Fig.
# 12 uses 184 and 107), 6 to 24 months old, trained in a temporal wagering task in stage 8 of
# shaping (the code codes the final stage as 9, Figure4.m). Median 33,493 trials and 71 sessions per
# rat. Each trial has an offered reward (5, 10, 20, 40, 80 uL for males; 4, 8, 16, 32, 64 uL for
# most females, treated as the male volumes, utils/convertreward.m), a cue tone (1 to 16 kHz), a
# block (mixed, high, low; the code codes 1 = mixed, 2 = high, 3 = low), whether it was a catch
# trial (15 to 25% of trials; RewardDelay 100 in the code), whether the rat opted out, whether it
# broke fixation (violation), whether it was rewarded (hit), the wait time (time before opting out)
# and the trial initiation time (time from opting out or consuming reward to the next center poke;
# getITI.m measures it from the last exit from the previous rewarded port, or from trial start,
# to CenterIn). Blocks of 40 completed trials; sessions start with a mixed block; high and low
# alternate around mixed blocks. Catch probability cohorts (Fig. 3c) of N = 3, 183, 61, 151 and 39
# rats for 0.1, 0.15, 0.2, 0.25 and 0.35. A further 16 rats ran a pre-initiation cue task (Fig. 5;
# 12 switched from the standard task, 4 trained only on it). Fig. 4 uses all stage 8 sessions,
# including sessions that fail the inclusion criterion. Whether the dandiset holds the pre-cue rats,
# the excluded sessions and the catch probabilities is the author's to find.
#
# Common method, used by every criterion unless it says otherwise (Methods, Criteria for including
# behavioral data and Statistical analyses, and the code).
# - Sessions. Stage 8 sessions that pass the inclusion criterion (regression of catch-trial wait
#   time on offered reward, after removing wait times above mean + 2 SD in that session, with a
#   positive slope on a session followed by another positive session; utils/screen_perf.m also
#   requires a 7-session moving mean of the slope at or above 0, more than 100 trials and at least
#   5 catch trials). If the dandiset holds only included sessions, they are used as given.
# - Wait times. Opt-out wait times on catch trials; wait times more than 1 SD above the mean
#   catch-trial wait time pooled over the rat's sessions are removed (Methods, Statistical
#   analyses; parse_data_from_mysql.m:204). Timed-out catch trials (no opt-out within 100 s) are not
#   catch trials (parse_data_from_mysql.m).
# - Trial initiation times. All trials; values above the 99th percentile of the rat's pooled
#   distribution are removed (Methods, Criteria for including behavioral data; iticurves.m).
# - z-scoring is within rat, over the trials each analysis names.
# - Volumes are the male volumes; female volumes map 4, 8, 16, 32, 64 to 5, 10, 20, 40, 80.
#
# Disagreements between the Methods and the code, and between the text and the legends, are named
# in the criteria they touch; the Methods come first, the code's choice is a variant.
schema_version: 2
paper: doi:10.1038/s41467-023-43250-x
claims:
- id: cohort-size
  statement: The dataset comes from 291 rats, with a median of 33,493 behavioral trials and 71
    sessions per rat.
  source: Results, Rats' deliberative and motivational decisions are sensitive to the value of the
    environment, paragraph 2
  quote: We used a high-throughput facility to train 291 rats using computerized, semi-automated
    procedures. The facility generated statistically powerful datasets (median = 33,493 behavioral
    trials, 71 sessions).
  expected:
  - quantity: rats
    value: 291
    tolerance: 0
  - quantity: median trials per rat
    value: 33493
    tolerance: 3349
  - quantity: median sessions per rat
    value: 71
    tolerance: 7
  criterion: Rats, sessions and trials counted in the data used for Figs 1 to 3 (included stage 8
    sessions; Figure1.m counts sessions as length(A.date) and trials as length(A.reward) per rat).
    The rat count must be exact; the medians within 10%. Rats of the pre-initiation cue task are not
    counted unless they are among the 291.

- id: fig1e-wait-time-increases-with-reward
  statement: In mixed blocks, rats wait longer for larger offered rewards; mean wait time on catch
    trials rises with offer across 5, 10, 20, 40 and 80 uL.
  source: Figure 1d,e; Results, Computational modeling reveals distinct value computations,
    paragraph 1 (Fig. 3b)
  quote: This model captured key features of the rats' behavior, including the monotonic
    relationship between wait time and reward offer in mixed blocks (Fig. 3b )
  criterion: Per rat, mean wait time on catch trials in mixed blocks for each offer (wtcurves.m);
    then the mean over the 291 rats. Reproduced when the population mean increases at each step from
    5 to 80 uL. The paper reports no test.

- id: fig1f-wait-time-block-effect
  statement: Rats wait about 10% less for 20 uL in high blocks than in low blocks, across the
    population.
  source: Figure 1d-f; Results, Rats' deliberative and motivational decisions are sensitive to the
    value of the environment, paragraph 3
  quote: rats adjusted how long they were willing to wait for rewards in each block, and on average
    waited ~10 percent less time for 20 μL in high blocks, when the opportunity cost was high,
    compared to in low blocks ( p ≪ 0.001, Wilcoxon signed-rank test, N = 291; Fig. 1d–f ).
  statistics:
  - test: two-tailed Wilcoxon signed-rank test
    p: 8.26e-49
    n: 291 rats
  expected:
  - quantity: population mean wait time ratio, 20 uL high block over low block
    value: 0.90
    tolerance: 0.025
  criterion: Per rat, mean wait time on 20 uL catch trials in high and in low blocks; the wait time
    ratio is high over low (Methods, Statistical analyses; Figure1.m). Reproduced when the mean
    ratio over rats is within tolerance and the signed-rank test across rats of high against low
    has p < 0.001. The tolerance is wider than 10% of the reduction because the paper gives the
    value as "~10 percent". Open detail with two readings for the population test, both run - (a)
    the Methods compare each rat's mean z-scored wait time (z-scored over all its catch trials);
    (b) Figure1.m compares the raw means in seconds. The per-rat one-tailed rank-sum test (high
    shorter than low, wtcurves.m) is reported as the count of rats with p < 0.05; the paper gives no
    count.

- id: fig1i-initiation-block-effect
  statement: Rats initiate trials more quickly in high blocks than in low blocks, across the
    population.
  source: Figure 1g-i; Supplementary Fig. 1; Results, Rats' deliberative and motivational decisions
    are sensitive to the value of the environment, paragraph 4
  quote: trial initiation times were modulated by blocks in a similar pattern as the wait times, with
    rats initiating trials more quickly in high compared to low blocks ( p ≪ 0.001, Wilcoxon
    signed-rank test, N = 291; Fig. 1g–i ; Supplementary Fig. 1 ).
  statistics:
  - test: two-tailed Wilcoxon signed-rank test
    p: 1.82e-49
    n: 291 rats
  criterion: Per rat, mean trial initiation time over all trials in high and in low blocks
    (iticurves.m). Reproduced when the signed-rank test across rats has p < 0.001 and the mean of
    the per-rat ratio (high over low) is below 1. Open detail with two readings, both run - (a) the
    Methods compare mean z-scored initiation times; (b) Figure1.m and Supplementary Fig. 1b
    compare raw means in seconds (the same p is printed for both).

- id: suppfig2-initiation-block-effect-after-unrewarded
  statement: The block sensitivity of trial initiation times comes from trials after unrewarded
    trials; after rewarded trials initiation times do not differ between high and low blocks in the
    same direction.
  source: Supplementary Fig. 2b; Results, Rats' deliberative and motivational decisions are
    sensitive to the value of the environment, paragraph 5; Methods, Statistical analyses,
    paragraph 3
  quote: sensitivity to the reward blocks was largely driven by initiation times following
    unrewarded trials (Supplementary Fig. 2 , Methods), which accounted for more variance in
    initiation times.
  statistics:
  - about: post-rewarded trials, high against low block
    test: Wilcoxon signed-rank test (two-tailed in the legend)
    p: 1
    n: 291 rats
  - about: post-unrewarded trials, high against low block
    test: Wilcoxon signed-rank test (two-tailed in the legend)
    p: 9.07e-50
    n: 291 rats
  - about: all trials, high against low block
    test: Wilcoxon signed-rank test (two-tailed in the legend)
    p: 9.17e-50
    n: 291 rats
  criterion: Per rat, mean z-scored trial initiation time in high and low blocks, split by whether
    the previous trial was rewarded (unrewarded includes opt-outs and violations; Methods,
    Statistical analyses, paragraph 3). Reproduced when the post-unrewarded test has p < 0.001 with
    shorter times in high blocks and the post-rewarded test does not reach p < 0.05 in that
    direction. Open detail - the legend says two-tailed, FigureS2.m runs one-tailed tests
    (tail 'right', low longer than high); both are run. The legend prints "Post-rewarded" twice; the
    third value is read as all trials.

- id: suppfig3-wait-time-not-affected-by-previous-outcome
  statement: Wait times show no major differences after rewarded and after unrewarded trials.
  source: Supplementary Fig. 3; Results, Rats' deliberative and motivational decisions are sensitive
    to the value of the environment, paragraph 5
  quote: There were no major differences in wait times following rewarded or unrewarded trials
    (Supplementary Fig. 3 ).
  criterion: Per rat, wait time ratio (20 uL high over low) computed separately for catch trials
    after rewarded and after unrewarded trials (Supplementary Fig. 3b). The paper reports no test.
    Reproduced when the population mean ratio is below 1 in both subsets. The size of the
    difference between subsets (and a signed-rank test of it, a variant) is reported.

- id: fig2a-wait-time-converges-in-mixed-blocks
  statement: After a transition into a mixed block, wait times converge to a common value whether
    the previous block was high or low, while trial initiation times in mixed blocks keep depending
    on the previous block (slower after high blocks, faster after low blocks).
  source: Figure 2a,b; Supplementary Figs 4 and 5; Results, Trial initiation and wait times
    exhibited distinct temporal dynamics, paragraph 1
  quote: In mixed blocks, the wait times following high and low blocks converged to a common value,
    regardless of the previous block type ... Trial initiation times, however, showed longer
    timescale effects such that initiation times in mixed blocks strongly depended on the previous
    block identity (Fig. 2b ; Supplementary Fig. 4 ).
  criterion: Block transition curves as in the Methods (Block transition dynamics) and the code
    (block_dynamics_wt.m, block_dynamics_latency.m, 20 trials either side, 10-point moving
    average per rat, then the mean over rats). Wait times are z-scored over catch trials, then
    z-scored again within each volume, non-violation catch trials only. Initiation times are
    z-scored and detrended against trial number (the Methods fit each session; the code fits one
    line over pooled sessions; both readings run). The paper gives no test. Reproduced when (1)
    the gap between the high-to-mixed and low-to-mixed wait time curves over trials 1 to 20 of the
    mixed block is smaller than the same gap for initiation times, relative to each measure's gap
    over trials -20 to -1, and (2) mean z-scored initiation time over the whole mixed block is
    higher after high blocks than after low blocks across rats (Supplementary Fig. 4) by a
    two-tailed signed-rank test at p < 0.05, the paper's population test for block effects
    (Methods, Statistical analyses). The window for (1) is open; trials 1 to 20 and trials 10 to
    20 are both run.

- id: suppfig5-mixed-to-adaptation-transitions
  statement: Longer timescale contrast effects also appear at transitions from mixed into high or
    low blocks for trial initiation times, but not for wait times.
  source: Supplementary Fig. 5; Results, Trial initiation and wait times exhibited distinct temporal
    dynamics, paragraph 1
  quote: These longer timescale dynamics, which are reminiscent of incentive contrast effects 29 ,
    were also evident in the transitions from mixed blocks into high/low blocks for trial initiation
    times, but not wait times (Supplementary Fig. 5 )
  depends_on:
  - fig2a-wait-time-converges-in-mixed-blocks
  criterion: Curves for mixed-to-high and mixed-to-low transitions computed as in
    fig2a-wait-time-converges-in-mixed-blocks. The mixed block before a low block follows a high
    block and vice versa (Supplementary Fig. 5 legend). Reproduced when, over trials -20 to -1
    (the mixed block), the initiation time curve before a low block lies above the one before a high
    block (the previous high block still slowing initiation), and the wait time curves differ by
    less than the initiation time curves in that window, as a fraction of their gap over trials 1 to
    20. The paper reports no test.

- id: fig2c-d-regression-on-previous-rewards
  statement: In mixed blocks, wait times are explained by the current offer and barely by previous
    offers, while trial initiation times reflect an exponentially decaying effect of previous
    rewards (larger recent rewards, faster initiation).
  source: Figure 2c,d; Results, Trial initiation and wait times exhibited distinct temporal
    dynamics, paragraph 2
  quote: Examination of the regression coefficients revealed qualitatively different dynamics, in
    which the wait times were explained by the reward offered on the current trial, but the trial
    initiation times reflected an exponentially weighted effect of previous rewards
  criterion: Regressions as in the Methods (Trial history effects) and the code
    (regress_wt_vs_rew.m, regress_latency_vs_rew.m), mixed blocks only, log2 rewards, rewards from
    another block set to NaN, ordinary least squares with a constant. Wait time - z-scored catch
    trial wait times on the current offer and 9 previous offers, violation trials included.
    Initiation time - z-scored initiation times on previous rewards, with unrewarded trials set to
    0 (the Methods say violation and catch trials; the code multiplies by hits, so all unrewarded
    trials). Open detail - the Methods give 9 previous rewards for initiation times, the code
    (nback = 10) uses 10; both are run. Reproduced when, in the mean over rats, the current offer
    coefficient for wait time is positive with a 95% interval across rats excluding 0 and larger in
    size than every previous trial coefficient, and the initiation time coefficients for 1, 2 and 3
    trials back are negative and decrease in size with lag.

- id: fig2e-tau-differ
  statement: The time constants of exponential fits to the previous trial coefficients differ
    between trial initiation times and wait times, with longer time constants for initiation times
    (wait time time constants are mostly 0).
  source: Figure 2e; Results, Trial initiation and wait times exhibited distinct temporal dynamics,
    paragraph 2; Methods, Trial history effects
  quote: We fit exponential curves to the previous trial coefficients for each rat, and found that
    the distributions of exponential decay time constant parameters ( τ ) were significantly
    different for the trial initiation and wait times ( p ≪ 0.01, Wilcoxon sign-rank test, N = 291;
    Fig. 2e ).
  statistics:
  - test: two-tailed Wilcoxon signed-rank test
    p: 1.3e-49
    n: 291 rats
  depends_on:
  - fig2c-d-regression-on-previous-rewards
  criterion: Per rat, from the regressions of fig2c-d-regression-on-previous-rewards, the first
    coefficient whose 95% interval contains 0 and all after it are set to 0; y = D exp(-x/tau) is
    fitted to the previous trial coefficients by least squares (fit_exp_decay.m, fmincon, 10
    random starts; bounds D in [-10, 10], tau in [0, 10] for wait time with coefficients scaled by
    10, D in [-10, 0], tau in [0, 10] for initiation time); tau is 0 when all previous coefficients
    are 0. Reproduced when the signed-rank test of the two taus across rats has p < 0.01 and the
    mean initiation time tau exceeds the mean wait time tau. The random starts are a standard
    choice (the seed cannot change the outcome beyond fit noise).

- id: fig2f-tau-uncorrelated
  statement: Across rats, the time constants for wait times and trial initiation times are not
    correlated.
  source: Figure 2f; Results, Trial initiation and wait times exhibited distinct temporal dynamics,
    paragraph 2
  quote: Moreover, τ parameters were not correlated across models ( r = 0.08, p = 0.18, Pearson
    linear correlation, N = 291, Fig. 2f ).
  statistics:
  - about: as printed in the Results
    test: Pearson linear correlation
    statistic: r = 0.08
    p: 0.18
    n: 291 rats
  - about: as printed in the Figure 2f legend
    test: Pearson linear correlation
    statistic: r = -0.03
    p: 0.53
    n: 291 rats
  depends_on:
  - fig2e-tau-differ
  criterion: Pearson correlation of the per-rat taus of fig2e-tau-differ (Methods, corr.m;
    Figure2.m, rows 'complete'). A claim of absence, judged on the paper's test - reproduced when
    p >= 0.05, not reproduced when p < 0.05. The r and p are reported against both printed pairs
    (the Results and the legend disagree).

- id: fig2g-h-fast-slow-tau-groups
  statement: Rats split by fast or slow temporal integration of initiation times (tau below the
    20th or above the 80th percentile) differ in their initiation time regression coefficients but
    not in their wait time coefficients.
  source: Figure 2g,h; Results, Trial initiation and wait times exhibited distinct temporal
    dynamics, paragraph 3
  quote: There were differences in temporal integration for trial initiation times, but not wait
    times, for these groups (Fig. 2g, h trial initiation time p < 0.05, wait time p = 0.1,
    permutation test, N = 116).
  statistics:
  - about: initiation time coefficients, fast against slow group
    test: one-tailed permutation test
    p: 0.02
    n: 116 rats
  - about: wait time coefficients, fast against slow group
    test: one-tailed permutation test
    p: 0.1
    n: 116 rats
  depends_on:
  - fig2e-tau-differ
  criterion: Groups from the initiation time taus of fig2e-tau-differ, below the 20th and above
    the 80th percentile (Figure2.m, N = 80). Test as myTauShuffleTest.m - the group labels are
    shuffled 500 times, the mean coefficients of each shuffled half are refitted with an
    exponential (coefficients times 10, D in [-3, 1], tau in [0, 50]), and p is the share of
    shuffles whose absolute tau difference exceeds the observed one, divided by 2 (the observed
    fits use D in [-10, 1], tau in [0, 10]). Reproduced when initiation time p < 0.05 and wait
    time p >= 0.05; the wait time part is a claim of absence judged on this test.

- id: fig2j-wait-time-not-sensitive-to-previous-offer
  statement: In mixed blocks, wait times for 20 uL do not depend on whether the previous offer was
    smaller or larger than 20 uL, for 87% of rats (253 of 291) and for the population.
  source: Figure 2j; Results, Trial initiation and wait times exhibited distinct temporal dynamics,
    paragraph 3
  quote: Indeed, for almost all rats (87%), wait times for 20 μL offers in mixed blocks were not
    significantly different if they were preceded by rewards that were smaller or larger than 20 μL
    ( p > 0.05, Wilcoxon rank-sum test, N = 253/291).
  statistics:
  - about: population
    test: two-tailed Wilcoxon rank-sum test (legend)
    p: 0.8
    n: 291 rats
  expected:
  - quantity: rats with p < 0.05 (per-rat rank-sum test)
    value: 38
    tolerance: 4
  criterion: Per rat, 20 uL catch trials in mixed blocks (not the first trial), wait times z-scored
    over these trials, split by previous offer below or above 20 uL (Methods, Trial history
    effects; waittime_20ul_by_previous_vol.m), compared with a two-tailed rank-sum test. The
    count of rats with p < 0.05 must be within tolerance. The population part is a claim of absence
    - per-rat means for the two conditions, compared across rats by the legend's two-tailed
    rank-sum test; reproduced when p >= 0.05. Figure2.m runs a paired signed-rank test; it is shown
    as a variant.

- id: fig2k-initiation-sensitive-to-previous-offer
  statement: In mixed blocks, trial initiation times are slower after offers smaller than 20 uL
    than after offers larger than 20 uL, significantly so for 89% of rats (256 of 291) and for the
    population.
  source: Figure 2k; Results, Trial initiation and wait times exhibited distinct temporal dynamics,
    paragraph 3
  quote: However, for 89% of rats, trial initiation times were significantly modulated by previous
    rewards, suggesting fixed and incrementally updated estimates of the value of the environment,
    respectively ( p < 0.05, Wilcoxon rank-sum test, N = 256/291, Fig. 2i–l ).
  statistics:
  - about: population
    test: two-tailed Wilcoxon rank-sum test (legend)
    p: 1.84e-49
    n: 291 rats
  expected:
  - quantity: rats with p < 0.05 (per-rat rank-sum test)
    value: 256
    tolerance: 26
  criterion: Per rat, z-scored initiation times in mixed blocks split by previous offer below or
    above 20 uL, compared with a two-tailed rank-sum test; the count with p < 0.05 within
    tolerance; population p < 0.001 with slower initiation after smaller offers. Open details, all
    readings run - which trials (the Methods use 20 uL trials in mixed blocks; the code,
    latency_post20ul_by_previous_vol.m, uses all mixed-block trials, z-scored over all the rat's
    trials); the population test (the legend's rank-sum on per-rat means, or Figure2.m's paired
    signed-rank).

- id: fig2l-sensitivity-greater-for-initiation
  statement: Sensitivity to the previous offer is larger for trial initiation times than for wait
    times across rats.
  source: Figure 2l; Methods, Trial history effects
  quote: We compared wait time and trial initiation time sensitivity to previous offers across rats
    using a paired Wilcoxon signed-rank test.
  statistics:
  - test: two-tailed Wilcoxon signed-rank test
    p: 6.21e-38
    n: 291 rats
  depends_on:
  - fig2j-wait-time-not-sensitive-to-previous-offer
  - fig2k-initiation-sensitive-to-previous-offer
  criterion: Sensitivity is the mean for previous offer below 20 uL minus the mean for previous offer
    above 20 uL, per rat and measure, from fig2j and fig2k (Methods, Trial history effects;
    Figure2.m). Reproduced when the paired signed-rank test has p < 0.001 and the mean initiation
    time sensitivity exceeds the mean wait time sensitivity. Run under each reading of fig2k.

- id: suppfig6-results-without-detrending
  statement: Satiety effects on trial initiation times are modest, and the results, including the
    dynamics at block transitions, do not change qualitatively without detrending.
  source: Supplementary Fig. 6; Results, Trial initiation and wait times exhibited distinct temporal
    dynamics, paragraph 4
  quote: However, there was no qualitative change in any of our results, including the dynamics at
    block transitions, if we did not detrend (Supplementary Fig. 6 ).
  depends_on:
  - fig2a-wait-time-converges-in-mixed-blocks
  criterion: The initiation time transition curves of fig2a-wait-time-converges-in-mixed-blocks
    recomputed without the trial number regression (block_dynamics_latency.m with detrending off).
    Reproduced when part (2) of that criterion and the ordering of the curves (above after high
    blocks, below after low blocks) still hold.

- id: fig3c-wait-time-by-catch-probability
  statement: Rats' wait times in mixed blocks depend in a graded way on the catch probability, as
    the wait time model predicts (shorter waits at higher catch probability).
  source: Figure 3c; Results, Computational modeling reveals distinct value computations,
    paragraph 1; Methods, Statistical analyses, paragraph 5
  quote: as well as a graded dependence of wait times on the catch probability (Fig. 3c )
  expected:
  - quantity: rats at catch probability 0.1
    value: 3
    tolerance: 0
  - quantity: rats at catch probability 0.15
    value: 183
    tolerance: 18
  - quantity: rats at catch probability 0.2
    value: 61
    tolerance: 6
  - quantity: rats at catch probability 0.25
    value: 151
    tolerance: 15
  - quantity: rats at catch probability 0.35
    value: 39
    tolerance: 4
  criterion: The direction is read from Equation 1 (wait time grows with C/(1-C), C = 1 - catch
    probability), which the figure compares with the rats. Per rat and catch probability, mean wait
    time on mixed block catch trials by offer, leaving out each rat's first 1000 stage 8 trials
    (Figure3.m, which drops them because the first trials of stage 8 have catch probability 0.35
    while rats learn); then the mean over rats with data at that probability. Reproduced when, for
    at least 4 of the 5 offers, the population mean wait time decreases from 0.15 to 0.2 to 0.25
    (the cohorts large enough to compare), with the 0.1 and 0.35 cohorts reported. Rats per cohort
    within 10% (exact for 3 rats). The ordering rule is a reading; the paper gives no test.

- id: fig3j-inferential-beats-retrospective-for-wait-times
  statement: Wait times are better fit by the inferential model, which uses hidden state inference to
    choose a block-specific value of the environment, than by the retrospective model, by BIC, AIC
    and cross-validated negative log-likelihood.
  source: Figure 3j; Supplementary Fig. 8a,c,e; Results, Computational modeling reveals distinct
    value computations, paragraph 5
  quote: By several model comparison metrics, wait times were better fit by the inferential model
    that used hidden state inference to select block-specific estimates of the value of the
    environment ( p ≪ 0.001, Wilcoxon signed-rank test, N = 291; Fig. 3j , Supplementary Fig. 8 )
  statistics:
  - about: delta BIC
    test: two-tailed Wilcoxon signed-rank test
    p: 1.07e-37
    n: 291 rats
  - about: cross-validated negative log-likelihood
    test: two-tailed Wilcoxon signed-rank test
    p: 6.58e-40
    n: 291 rats
  - about: AIC
    test: two-tailed Wilcoxon signed-rank test
    p: 1.89e-39
    n: 291 rats
  criterion: Both models fitted to each rat's wait times (Methods, Behavioral models, Inferential
    model, Retrospective model, Fitting and evaluating models) - wait time by Equation 1 with tau =
    2.5 s, C = 1 - catch probability, log-normal noise of variance 8; inferential kappa from the
    most likely block under Equations 3 to 6 with H0 = 1/40; retrospective kappa by Equation 9
    with the dynamic gain of Equation 10; fmincon, 100 random starts; BIC = log(n) k + 2 nLL on all
    data, AIC = 2k + 2 nLL, and 5-fold cross-validated nLL. Reproduced when all three signed-rank
    tests have p < 0.001 with the inferential model better on average. Open details - the paper's
    fitting code is not in the repository, so the free parameters of each model, their bounds and
    the folds are not fixed (the Methods name kappa_low, kappa_mixed, kappa_high and D for the
    inferential model, and alpha_0 and D with an initial kappa for the retrospective one; other sets
    may be named, with the parameter count k following them). The paper's fits are deposited on
    Zenodo (doi:10.5281/zenodo.10031483); using them in place of a refit is an input from outside
    the dataset.

- id: suppfig8-belief-state-not-distinguished
  statement: Model comparison does not distinguish the inferential model from the belief state model
    for wait times.
  source: Supplementary Fig. 8b,d,f; Results, Computational modeling reveals distinct value
    computations, paragraph 6
  quote: In fact, when the posterior beliefs are stable, which is often the case, the belief state
    and inferential models are identical, and model comparison did not favor one model over the
    other (Supplementary Fig. 8 ).
  statistics:
  - about: cross-validated negative log-likelihood
    test: two-tailed Wilcoxon signed-rank test
    p: 1
    n: 291 rats
  - about: AIC
    test: two-tailed Wilcoxon signed-rank test
    p: 1
    n: 291 rats
  - about: BIC
    test: two-tailed Wilcoxon signed-rank test
    p: 1
    n: 291 rats
  depends_on:
  - fig3j-inferential-beats-retrospective-for-wait-times
  criterion: The belief state model (Equation 7) fitted as in
    fig3j-inferential-beats-retrospective-for-wait-times, with the same open details. A claim of
    absence - reproduced when none of the three signed-rank tests reaches p < 0.05.

- id: suppfig9-wait-times-reflect-misinferences
  statement: Within mixed blocks, wait times for 20 uL differ between trials the inferential model
    labels as high and as low blocks, so wait times reflect mistaken inferences.
  source: Supplementary Fig. 9; Results, Computational modeling reveals distinct value computations,
    paragraph 5
  quote: The rats' wait times reflected these mistaken inferences, further indicating that their wait
    times were well-described by the inferential model ( p ≪ 0.001, Wilcoxon signed-rank test
    comparing wait times for 20μL in misinferred high vs. low blocks, N = 291; Supplementary Fig. 9
    ).
  statistics:
  - test: Wilcoxon signed-rank test
    p: 0.001
    p_relation: "<"
    n: 291 rats
  depends_on:
  - fig3j-inferential-beats-retrospective-for-wait-times
  criterion: The inferential model, fitted per rat, labels each mixed block trial with its most
    likely block; per rat, mean wait time on 20 uL catch trials labeled high and labeled low, in
    held-out test sets (Supplementary Fig. 9 legend; FigureS9.m compares column 3, 20 uL, with
    signrank). Reproduced when p < 0.001 with shorter waits on trials labeled high.

- id: fig3l-lambda-groups-wait-time-dynamics
  statement: Rats with optimal and poor inference (high or low lambda of the sub-optimal inferential
    model) differ in their wait time dynamics at transitions from mixed into low or high blocks, but
    not in their trial initiation time dynamics.
  source: Figure 3l; Supplementary Figs 10 and 11; Results, Computational modeling reveals distinct
    value computations, paragraph 7
  quote: Rats with optimal and poor inference exhibited significantly different dynamics at
    transitions from mixed into low or high blocks, indicated by different inverse temperature
    parameters (mix to low/high, p < 0.05, one-tailed permutation test, N = 180 Fig. 3l ). There was
    no difference in the dynamics of trial initiation times for those same groups of rats (mixed to
    low... p = 0.3, mixed to high... p = 0.2, one-tailed permutation test, N = 180; Fig. 3l ).
  statistics:
  - about: wait time, mixed to low, slope (legend)
    test: one-tailed non-parametric shuffle test
    p: 0.02
    n: 116 rats (legend; 180 in the Results)
  - about: wait time, mixed to high, right asymptote (legend)
    test: one-tailed non-parametric shuffle test
    p: 0.003
    n: 116 rats (legend; 180 in the Results)
  - about: trial initiation time, mixed to low, slope (legend; p = 0.3 in the Results)
    test: one-tailed non-parametric shuffle test
    p: 0.15
    n: 116 rats (legend; 180 in the Results)
  - about: trial initiation time, mixed to high, right asymptote (legend; p = 0.2 in the Results)
    test: one-tailed non-parametric shuffle test
    p: 0.21
    n: 116 rats (legend; 180 in the Results)
  criterion: Lambda per rat from the sub-optimal inferential model (Equation 8) fitted to wait times
    as in fig3j-inferential-beats-retrospective-for-wait-times. Mixed-to-low and mixed-to-high
    curves (block_dynamics_wt.m, block_dynamics_latency.m with 30 trials either side, trials -20
    to 20 kept) averaged per group; the 4-parameter logistic of Equation 11 fitted to each group
    mean (my_fit_sigmoid.m, 10 starts); 500 label shuffles; p is the share of shuffles whose
    absolute parameter difference exceeds the observed one, divided by 2 (myLambdaShuffleTest.m).
    Reproduced when the wait time test has p < 0.05 for the slope C at mixed to low and for at
    least one parameter at mixed to high (the right asymptote D per the legend, C per the Results),
    and the initiation time tests do not reach p < 0.05 for those same parameters (absence, judged
    on this test). Open detail - the groups are below the 20th and above the 80th percentile of
    lambda in the Methods and the Results (N = 116 in the legend fits this), while Figure3.m splits
    at the 40th and 60th (N = 60); both are run, the Methods' split first.

- id: fig3i-retrospective-model-captures-initiation
  statement: A retrospective model with a learning rate scaled by changes in the inferred block
    posterior captures the slow and fast dynamics of trial initiation times at block transitions and
    their dependence on previous rewards, while a static learning rate or an unsigned prediction
    error gain does not.
  source: Figure 3g-i; Supplementary Fig. 7; Results, Computational modeling reveals distinct value
    computations, paragraphs 3 and 4
  quote: We explored versions of the dynamic learning rate that did not reflect inference, including
    using the unsigned reward prediction error or a running average of reward prediction errors 38 .
    However, these models could not capture both short and long timescale dynamics at block
    transitions (Supplementary Fig. 7 ).
  criterion: Simulated initiation times TI = D/kappa (Equation 2) on the rats' reward sequences, with
    kappa from Equation 9 under three gains - G from Equation 10, G = 1, and G = |delta| (Methods,
    Retrospective model; GenerateLatencyData_AlphaPHModel.m, _VanillaAlpha.m, _RPEAlpha.m), alpha_0
    below 0.1 (Results, paragraph 4), log-normal noise of variance 4, 50 simulations (Supplementary
    Fig. 7 legend), curves as in fig2a-wait-time-converges-in-mixed-blocks. Reproduced when the
    Equation 10 model shows both an overshoot after the high-to-mixed transition (maximum within
    20 trials above the value at trial 20) and a persistent post-high above post-low gap in the
    mixed block, while each alternative lacks one of the two. The paper fits no initiation time
    model; the parameter values beyond alpha_0 below 0.1 are open and the ones set in the code's
    scripts are used.

- id: bayes-observer-offer-reduces-uncertainty
  statement: In simulations of a Bayes optimal observer, hearing the reward offer reduces the
    uncertainty of beliefs about the hidden block (posterior variance below prior variance).
  source: Results, Reducing state uncertainty did not change trial initiation times, paragraph 2
  quote: Model simulations of a Bayes' optimal observer did show that the reward offer reduced the
    uncertainty of subjective beliefs about the hidden state (comparing variance of prior to
    variance of posterior, p ≪ 0.001, Wilcoxon sign-rank test).
  statistics:
  - test: Wilcoxon signed-rank test
    p: 0.001
    p_relation: "<"
  criterion: Prior (Equation 5) and posterior (Equation 3) of the inferential model on the rats'
    reward sequences, with H0 = 1/40. Open details - "variance" of a distribution over three blocks
    is not defined, nor the unit of the test (trials or rats); readings run - the variance of the
    block probabilities, and the variance of block value with blocks coded 1 to 3 (low, mixed,
    high), tested over trials and over per-rat means. Reproduced when the posterior is less
    uncertain with p < 0.001 under the readings run.

- id: fig4a-wait-time-block-sensitivity-emerges
  statement: When the hidden blocks are introduced, wait times for 20 uL become sensitive to the
    block only gradually over training, while trial initiation times are block sensitive from the
    first session.
  source: Figure 4a,b; Results, Block sensitivity for wait times requires structure learning,
    paragraph 2
  quote: In the final stage of training, when rats were introduced to the hidden states, their wait
    times for 20μL gradually became sensitive to the reward block (Fig. 4a ) ... In contrast, trial
    initiation times exhibited block sensitivity on the first session in the final training stage
    (Fig. 4a ).
  criterion: All stage 8 sessions, including those that fail the inclusion criterion, grouped in
    consecutive pairs; per pair, wait time and initiation time ratios (high over low) as in
    fig1f-wait-time-block-effect and fig1i-initiation-block-effect; per session, wait time
    regressed on current reward and block (1 low, 2 mixed, 3 high), smoothed with a 5-session moving
    average, outliers 3 scaled MADs from a 5-point moving median set to NaN, then averaged over
    rats (Methods, Learning dynamics; macro_regress_overtraining_V2.m, first 50 sessions in
    Figure4.m). Reproduced when the mean initiation time ratio of the first session pair is below
    1 (signed-rank against 1, p < 0.05, a reading), the mean wait time ratio of the first pair is
    closer to 1 than its mean over the last 10 pairs of the first 50 sessions, and the block
    coefficient grows in size from the first to the last 10 sessions. The windows are readings;
    the paper gives no test.

- id: fig4c-initiation-previous-reward-stable
  statement: The effect of the previous reward on trial initiation times is comparable early and
    late in training.
  source: Figure 4c; Results, Block sensitivity for wait times requires structure learning,
    paragraph 2
  quote: This sensitivity was comparable early and late in training, consistent with animals using
    previous rewards to a similar extent at these timepoints (Fig. 4c ).
  depends_on:
  - fig4a-wait-time-block-sensitivity-emerges
  criterion: Per session, initiation time regressed on the previous reward, smoothed and cleaned as
    in fig4a-wait-time-block-sensitivity-emerges, averaged over rats over the first 50 sessions.
    The paper reports no test. Reproduced when the mean coefficient over the first 10 sessions has
    the same sign as over sessions 41 to 50 and differs from it by less than the change in the wait
    time block coefficient over the same sessions, in proportion to each coefficient's late value
    (a reading).

- id: fig4d-overshoot-grows-with-training
  statement: The overshoot of trial initiation times after transitions from high to mixed blocks
    becomes more prominent with training, on a timescale like that of block sensitivity for wait
    times.
  source: Figure 4d,e; Results, Block sensitivity for wait times requires structure learning,
    paragraph 3
  quote: The overshoot became more prominent with training (Fig. 4d ), on a similar timescale as
    block sensitivity for wait times (Fig. 4e ), suggesting a shared mechanism.
  depends_on:
  - fig4a-wait-time-block-sensitivity-emerges
  criterion: Overshoot is the maximum z-scored initiation time after a high-to-mixed transition
    minus its value 20 trials after the transition (Fig. 4d legend; Figure4.m), on the high-to-mixed
    curves of block_dynamics_latency.m averaged over rats. Reproduced when the overshoot of the
    last 10 stage 8 sessions exceeds that of the first 10 (Figure4.m, nsess = 10). For Fig. 4e, the
    overshoot per chunk of 5 sessions (Figure4.m), smoothed with a 10-point moving average, is
    reported beside the wait time ratio over sessions; it is shown, not judged, as the paper gives
    no measure of "similar timescale".

- id: fig5b-pre-cue-initiation-sensitive-to-offer
  statement: With the reward cue played before trial initiation, trial initiation times become
    sensitive to the offered reward.
  source: Figure 5b; Results, Reducing state uncertainty did not change trial initiation times,
    paragraph 3; Methods, Pre-initiation cue task
  quote: Their trial initiation times became sensitive to the offered reward (Fig. 5b ).
  criterion: The 16 pre-cue rats (Figure5.m names them); for the 12 that switched, sessions after 30
    pre-cue sessions (Methods; Figure5.m starts at a dated switch per rat and the 30-session offset
    is not visible in it, so both are run) and their original-task sessions; for the 4 others all
    stage 8 sessions; no session exclusion by the wait time criterion. Per rat, mean z-scored
    initiation time by offer in mixed blocks, leaving out trials after violations
    (iti_by_reward.m), with the code's one-way ANOVA over offers. Reproduced when the population
    mean on the pre-cue task decreases from 5 to 80 uL and more rats reach ANOVA p < 0.05 on the
    pre-cue task than on the original task (a reading; the paper gives no test).

- id: fig5c-pre-cue-initiation-still-sensitive-to-previous-reward
  statement: On the pre-initiation cue task, trial initiation times for 20 uL in mixed blocks are
    still modulated by the previous reward, for 13 of 16 rats and for the population.
  source: Figure 5c; Results, Reducing state uncertainty did not change trial initiation times,
    paragraph 3
  quote: However, trial initiation times for 20μL in mixed blocks were still modulated by the
    previous reward, consistent with the use of incrementally updated estimates of the value of the
    environment within a block ( p < 0.05 for 13/16 rats; Fig. 5c ).
  statistics:
  - about: population
    test: two-tailed Wilcoxon rank-sum test
    p: 1.03e-4
    n: 16 rats
  expected:
  - quantity: rats with p < 0.05
    value: 13
    tolerance: 1
  depends_on:
  - fig2k-initiation-sensitive-to-previous-offer
  - fig5b-pre-cue-initiation-sensitive-to-offer
  criterion: Pre-cue sessions as in fig5b-pre-cue-initiation-sensitive-to-offer; per rat and at
    population, the test of fig2k-initiation-sensitive-to-previous-offer under each of its
    readings. Reproduced when the count is within tolerance and the population p < 0.001 with
    slower initiation after smaller offers.

- id: fig5d-pre-cue-initiation-depends-on-previous-block
  statement: On the pre-initiation cue task, how quickly rats initiate trials in mixed blocks still
    depends on the previous block.
  source: Figure 5d; Results, Reducing state uncertainty did not change trial initiation times,
    paragraph 3
  quote: Moreover, how quickly they initiated trials in mixed blocks continued to depend on the
    previous block identity (Fig. 5d ).
  depends_on:
  - fig2a-wait-time-converges-in-mixed-blocks
  - fig5b-pre-cue-initiation-sensitive-to-offer
  criterion: Pre-cue sessions as in fig5b-pre-cue-initiation-sensitive-to-offer; initiation time
    transition curves as in fig2a-wait-time-converges-in-mixed-blocks. Reproduced when the
    population mean z-scored initiation time over trials 1 to 20 of mixed blocks is higher after
    high blocks than after low blocks, with a two-tailed signed-rank test across the 16 rats at
    p < 0.05 (a reading; the paper gives no test).

- id: suppfig12-no-sex-differences
  statement: Male and female rats do not differ in their wait time ratios or trial initiation time
    ratios.
  source: Supplementary Fig. 12; Methods, Training for male and female rats
  quote: We did not observe any significant differences between the male and female rats, in terms
    of contextual effects, or behavioral dynamics at block transitions (Supplementary Fig. 12 ).
  statistics:
  - about: wait time ratio
    test: Wilcoxon rank-sum test
    p: 0.23
    n: 184 males and 107 females
  - about: trial initiation time ratio
    test: Wilcoxon rank-sum test
    p: 0.59
    n: 184 males and 107 females
  depends_on:
  - fig1f-wait-time-block-effect
  - fig1i-initiation-block-effect
  criterion: Per-rat wait time and initiation time ratios of fig1f and fig1i compared between sexes
    with a rank-sum test (FigureS12.m). A claim of absence - reproduced when both p >= 0.05. Sex is
