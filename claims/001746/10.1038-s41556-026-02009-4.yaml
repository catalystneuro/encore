  criterion: Index (Psd - Pais)/(Psd + Pais), Psd and Pais the peaks of the SD and AIS phases of
    dV/dt against Vm; where a phase has no clear peak, "the point with the lowest derivative
    value" (Methods, Calculation of the phase peak index). The paper read the peaks by hand
    (calPhaseHeightIdx.m), so an automatic reading is fixed here and its open parts named. Sweep,
    the maximal-rate sweep (the code's). Peaks, Pais the first local maximum of smoothed dV/dt
    (5 samples) on the rising phase and Psd the largest maximum after it; with one maximum only,
    the point of the rising phase where d2V/dt2 is lowest (the shoulder) before the global
    maximum stands for the missing peak, which is how "lowest derivative" is read. Open, which
    APs, readings (a) the first AP of the sweep and (b) the median index over its APs. Test,
    Kruskal-Wallis over the six groups followed by Dunn's test (legend), with the correction not
    stated; readings Bonferroni and Sidak, at 0.05 (conventional). Reproduced when, under every
    AP reading and both corrections, the VEN median is the lowest and Dunn's test separates VENs
    from every PC group; partially reproduced when the median is lowest and some groups are
    separated; blocked as methods_underspecified when the AP or correction readings disagree.
