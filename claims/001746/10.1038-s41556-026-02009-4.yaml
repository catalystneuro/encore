# Claims for Liu, Huang, Shen, Shao, Jing et al. (2026), "An atlas of primate insular cortex
# reveals a signal-processing strategy in von Economo neurons", Nature Cell Biology 28,
# 1742-1757, doi:10.1038/s41556-026-02009-4 (named on the archive "Cell Atlas and Novel Signal
# Processing Strategy in Primate Insular Cortex"), on dandiset 001746.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21,
# protocol as stated in docs/protocol.md (version pilot-10).
#
# Text read: the version of record, open access, as served by Europe PMC (PMC13457102), stored
# under paper/: main text, figure legends, Extended Data figure legends, Methods, Data and Code
# availability. No PDF was available, so values printed only inside figures (box plots and
# their P values) could not be read. The Supplementary Information (Supplementary Figs. 1 to 17
# and Supplementary Tables 1 to 12) and the Source Data files were not in the text read. Several
# findings this dataset can test cite them for their values and P values (Supplementary Fig. 11,
# Supplementary Tables 1, 2, 8 and 9). Those claims rest on the sentences of the Results, the
# figure legends and the Methods, which were read, and on the paper's code, which shows how the
# supplementary tables were computed; each says so. The supplementary values themselves could
# not be used as expected values.
#
# Code read: github.com/RFLiu2021/AIC_proj at commit 44cd8a6dfbb1f1ce363d73742e4f3652086b0f9d
# (2026-07-05), and PatchAnaLab 1.0 (Zenodo doi:10.5281/zenodo.19995355), the paper's MATLAB
# package for feature extraction. AIC_proj holds MATLAB and Python scripts per figure (file
# names follow an older figure numbering) and small data tables; its processed data are in
# Zenodo doi:10.5281/zenodo.18814764 (not opened). For this dandiset it holds:
#  - ephysio/data_ephy/rawdata_ephysio/metaInfo_ephysio_patchSeq.csv, one row per cell, 462
#    rows: subject, cell ID, deposited NWB file name, expert cell type (PC, VEN, INTER) and
#    subtype (VEN_Long, VEN_Short, PC_L5 and others), mapping rate, sequencing batch, predicted
#    transcriptomic cluster number and label, correlation, and whether the morphology was
#    traced. Tallied here (the table only, not the dataset), 10 subjects; 68 rows typed VEN; 29
#    VENs fall in clusters 16 (Exc FEZF2 DSG2, 14) and 8 (Exc FEZF2 COL24A1, 15).
#  - ephysio/data_ephy/Ins_patchseq_ephs.xlsx, the per-cell feature table (276 cells, cell ID,
#    expert type, predicted cluster number and 39 features, among them Tau_ms, Sag_Ratio, Rm_MO,
#    Spike_Latency_ms, Threshold_mV, AP_Amplitute, Half_Width_ms, MaxFiringRate, ISI_CV and
#    ISI_FanoFactor). Fig2D_ephyFeatCmp.m, calFDR_ephsio.m and createEphysioDataSupplTable.m
#    read it.
#  - The subclass grouping all these scripts use, by predicted cluster number. L2/3 IT HPCAL1,
#    clusters 1, 15, 5 (Exc HPCAL1 MEPE, PENK, FREM3); IT RORB, 2, 0, 7, 13, 19 (Exc RORB
#    CDK2AP1, SCN7A, cluster 7, FAP, TRDN); L5 IT FEZF2, 3, 6, 9, 11, 14, 18 (Exc FEZF2 RSPO3,
#    LTBP3, Exc RORB DEPTOR, CHI3L1, NRG1, Exc FEZF2 MCUB); L5 ET, cluster 16 with an expert type
#    containing PC; VEN, clusters 16 and 8 with an expert type containing VEN; L6 PC, 4, 12, 17
#    (Exc FEZF2 SMYD1, cluster 12, Exc HPCAL1 KANK4). Cluster 8 cells typed PC (canonical L5/6
#    CT) are left out of the six Fig. 2 groups. For the VEN subtypes (calFDR_VENsubtype_ephysio.m,
#    calFDR_ephysCmp_VEN_vs_L56CT.m), VEN-L is a VEN in cluster 16, VEN-S a VEN in cluster 8, and
#    L5/6 CT a PC in cluster 8. Tallied here from the xlsx, the six groups hold 30, 22, 122, 29,
#    17 and 13 cells; the Fig. 2 legend gives 30, 17, 119, 22, 16 and 13.
#  - calFDR_ephsio.m (Supplementary Table 2), for each feature a two-sided Wilcoxon rank-sum test
#    (ranksum) of each subclass against the other five pooled and of each pair of subclasses,
#    with Benjamini-Hochberg FDR (mafdr BHFDR) over the 39 features within each comparison.
#    createEphysioDataSupplTable.m (Supplementary Table 1) gives the mean and s.d. per subclass.
#    Fig2D_ephyFeatCmp.m plots tau (excluding values of 1 ms or less), input resistance, and AP
#    half-width (excluding values outside 1 to 5 ms, as "unreasonable").
#  - Fig3e_plotBoxplot_PeakIdx_cellTypes.m plots per-cell phase peak indices from
#    PeakIdx_Fig5e.xlsx (30, 22, 122, 29, 17, 13 cells) and runs no test. In PatchAnaLab,
#    calPhaseHeightIdx.m takes the sweep with the maximal firing rate, overlays the phase plots of
#    its APs (dV/dt smoothed over 5 samples) and has the user click the AIS peak and the SD peak;
#    the index is (SD - AIS)/(SD + AIS). The index was therefore read by hand.
#  - Fig4itop_plot_PhasePeakIdx_vs_AISd.m loads 62 neurons' AIS distances and peak indices
#    (NeuronPeakIdx_summary.mat), averages the indices in 10 um bins of AIS distance (0 to 200
#    um) and fits a line to the bin means against the bins' left edges.
#  - extFig9ad_plotVENsubtypeAP_Cmp.m loads VENsubtype_APs.mat, AP half-widths and amplitudes of
#    85 VEN-L and 41 VEN-S identified by number only; nothing in the code links them to NWB files.
#  - PatchAnaLab createFeatures.m and anaAP.m. Traces low-pass filtered at 1 kHz; the step is
#    found from fixed sample indices per amplifier (HEKA 2300 to 17700, Axon 5600 to 36200).
#    Rheobase sweep is the first sweep with APs; AP threshold, amplitude (peak minus threshold),
#    half-width (width at half the threshold-to-peak height), rise time and latency come from the
#    first AP of that sweep. Threshold is the maximum of the third derivative of the rising
#    segment, from halfway between step onset and the peak. Maximal firing rate is the largest
#    spike count over the step duration. ISI CV is std/mean of the ISIs of the maximal-rate
#    sweep. Tau is fitted on the first sweep only (first third of the step, onset to minimum),
#    and Rm is the slope of mean voltage over the last two thirds of the step against current,
#    over sweeps 1 to 6 (HEKA) or 7 to 11 (Axon) without APs. A helper (helper_reCalTau.m) lets
#    tau be refitted by hand.
# Where the Methods and the code differ, the Methods give the main reading and the code a
# variant: tau is averaged over all hyperpolarizing traces in the Methods and taken from the
# first sweep in createFeatures.m; the Methods put the steady state in the last 100 ms of the
# step and the code in its last two thirds.
#
# Data the paper describes. Adult male macaques (Macaca fascicularis, 4 to 6 years); Patch-seq
# used 12 animals. Acute 300 um coronal slices of the VEN-enriched anterior insular cortex
# (AIC), recorded at room temperature. Patch-seq recordings one channel at a time on HEKA EPC 10
# (PatchMaster), and additional whole-cell recordings without RNA on MultiClamp 700B (pClamp).
# Pipettes 3 to 4 MOhm, potassium gluconate internal with biocytin and RNase inhibitor; seal
# above 1 GOhm, access below 30 MOhm. Each neuron received 600 ms current steps from -200 pA to
# 1,380 pA in 20 pA increments at 1.5 s intervals, usually repeated 3 to 5 times; traces taken
# about 5 min after break-in were analysed. Measured variable, membrane potential (mV) in
# current clamp. Of 578 profiled cells, 462 have intrinsic properties, 166 reconstructed
# morphologies and 307 transcriptomes that were mapped to the scRNA-seq atlas (273 excitatory,
# 34 inhibitory). Cell identity combines the transcriptomic type with the expert's morphological
# label (VEN or PC; VEN-L or VEN-S). The archive's description says the dandiset holds the
# Patch-seq electrophysiology annotated with transcriptomic types; its asset count (462) is that
# of the code's table. The paper does not say where the additional recordings of Fig. 4a-c (281
# VENs, 306 L5 PCs) and Extended Data Fig. 9c,d (85 VEN-L, 41 VEN-S) were deposited.
#  - Other data, deposited elsewhere: Na+ currents (DANDI:001750), multi-patch connectivity
#    (DANDI:001751), postsynaptic currents (DANDI:001752); scRNA-seq and Patch-seq reads (GEO
#    GSE319557 and GSE319369); metabolomics (MetaboLights MTBLS13927); morphologies
#    (NeuroMorpho.org, doi:10.13021/y4be-0p18).
#
# The paper cites no version of the dandiset. Cell types come from the dataset's metadata where
# it has them and otherwise from metaInfo_ephysio_patchSeq.csv, matched by NWB file name (claim
# patchseq-cell-table-link); claims that group cells by type are data with_labels and depend on
# it. Details the paper leaves open are named in each criterion with the readings its text
# allows. Where a criterion uses p < 0.05 or FDR < 0.05 and the paper prints no alpha in the
# text read, that is the conventional reading of "significantly" and is said so.
schema_version: 2
dataset:
  archive: dandi
  id: "001746"
paper: doi:10.1038/s41556-026-02009-4
claims:
- id: patchseq-cell-table-link
  kind: link
  statement: The dandiset's recordings are the Patch-seq cells of the paper's code table
    metaInfo_ephysio_patchSeq.csv, with the same subjects, expert cell types and predicted
    transcriptomic clusters, and the features computed from them agree with the paper's per-cell
    feature table.
  source: Data availability; github.com/RFLiu2021/AIC_proj at commit 44cd8a6,
    ephysio/data_ephy/rawdata_ephysio/metaInfo_ephysio_patchSeq.csv and
    ephysio/data_ephy/Ins_patchseq_ephs.xlsx
  quote: https://dandiarchive.org/dandiset/001746 (main dataset, Patch-seq)
  data: with_labels
  criterion: Recordings are matched to table rows by NWB file name (filename_nwb), and through
    the cell ID (cell_ID) to the rows of Ins_patchseq_ephs.xlsx. Where the dataset carries a
    subject, cell type or transcriptomic type, it is compared with the table's. For each matched
    cell in the xlsx, AP half-width, AP amplitude and maximal firing rate are computed as the
    Methods define them (Extraction of electrophysiological features; first AP of the rheobase
    sweep, maximal number of APs over 600 ms). The link holds (reproduced) when at least 95% of
    the 462 rows are found, every label the dataset gives agrees with the table, and at least
    80% of matched cells are within 10% of the xlsx value for each of the three features.
    Partially reproduced when files and labels match but fewer features agree; not reproduced
    when files are missing or labels disagree. The six Fig. 2 groups formed by the code's
    cluster lists (see the opening comment) are counted and set against the legend's 30, 17,
    119, 22, 16 and 13; the difference is reported and does not decide.
- id: patchseq-sample
  statement: Of 578 Patch-seq cells profiled across all layers of the AIC, 462 were characterized
    for their intrinsic membrane properties; the Patch-seq experiments used 12 male macaques.
  source: Results, Patch-seq revealed extensive cellular heterogeneity in the primate AIC,
    paragraph 1; Methods, Animals
  quote: profiled 578 cells across all layers of the macaque AIC. A total of 462 neurons were
    characterized in terms of their intrinsic membrane properties ... Patch-seq ( n = 12, all
    males)
  expected:
  - quantity: neurons with intrinsic membrane properties
    value: 462
    tolerance: 46
  - quantity: animals
    value: 12
    tolerance: 1.2
  criterion: Neurons are the recorded cells with a current-clamp step protocol; animals are the
    distinct subjects. Reproduced when both counts are within tolerance and every subject is
    male; partially reproduced when the neuron count holds but the animal count or sex does not.
- id: patchseq-mapping
  statement: Of the Patch-seq cells with transcriptomes, 307 were analysed; 273 excitatory neurons
    map to 18 of the 20 excitatory types and 34 inhibitory neurons to 17 of the 33 inhibitory
    types.
  source: Results, Patch-seq revealed extensive cellular heterogeneity in the primate AIC,
    paragraph 1; Figure 1e; Extended Data Figure 6a
  quote: Among them, 307 cells had their transcriptomes recovered and were used for downstream
    analysis ... 273 excitatory neurons mapped to 18 of the 20 excitatory types, while 34
    inhibitory neurons mapped to 17 of the 33 inhibitory types
  data: with_labels
  depends_on:
  - patchseq-cell-table-link
  expected:
  - quantity: Patch-seq cells with a transcriptomic type
    value: 307
    tolerance: 31
  - quantity: excitatory Patch-seq neurons
    value: 273
    tolerance: 27
  - quantity: inhibitory Patch-seq neurons
    value: 34
    tolerance: 3.4
  - quantity: excitatory types with mapped neurons
    value: 18
    tolerance: 1.8
  - quantity: inhibitory types with mapped neurons
    value: 17
    tolerance: 1.7
  criterion: Counted from the transcriptomic type of each recording (the dataset's metadata, or
    predictCluster_label of metaInfo_ephysio_patchSeq.csv), Exc types against Inh types. Cells
    whose mapping rate is below 30% are excluded (Methods, Mapping of Patch-seq cells). The
    mapping itself (GEO GSE319369 reads) is not redone. Reproduced when every count is within
    tolerance.
- id: fig2a-subclass-counts
  statement: The 273 excitatory Patch-seq neurons fall in seven of the eight subclasses, L2/3 IT
    HPCAL1 (33), IT RORB (23), L5 IT FEZF2 (143), L5 ET (20), L5/6 CT (11), L6 IT (5) and L6b (9).
  source: Results, Patch-seq revealed extensive cellular heterogeneity in the primate AIC,
    paragraph 2; Figure 2a,b
  quote: 'The 273 Patch-seq excitatory neurons were assigned into seven of the eight major
    subclasses (Fig. 2a,b ): L2/3 IT HPCAL1 ( n = 33), IT RORB ( n = 23), L5 IT FEZF2 ( n = 143),
    L5 ET ( n = 20), L5/6 CT ( n = 11), L6 IT ( n = 5) and L6b ( n = 9)'
  data: with_labels
  depends_on:
  - patchseq-cell-table-link
  expected:
  - quantity: L2/3 IT HPCAL1
    value: 33
    tolerance: 3.3
  - quantity: IT RORB
    value: 23
    tolerance: 2.3
  - quantity: L5 IT FEZF2
    value: 143
    tolerance: 14.3
  - quantity: L5 ET
    value: 20
    tolerance: 2
  - quantity: L5/6 CT
    value: 11
    tolerance: 1.1
  - quantity: L6 IT
    value: 5
    tolerance: 0.5
  - quantity: L6b
    value: 9
    tolerance: 0.9
  criterion: Subclass of each excitatory cell from its transcriptomic type. The paper names the
    types of each subclass only through its code. Readings, (a) the code's cluster lists of the
    opening comment; (b) the subclass the dataset's metadata gives, where it gives one. The seven
    stated counts sum to 244, and 244 plus the 29 VENs of ven-map-et-ct is 273, so the stated
    counts leave the VENs out; under both readings the VENs (expert type VEN) are counted apart
    and not in L5 ET or L5/6 CT. The code merges L6 IT and L6b into L6 PC (clusters 4, 12 and 17;
    the Results give L6 PC n = 14); the Methods' rule (HPCAL1 clusters in L6 are L6b, OPRK1
    clusters L6 IT) puts Exc HPCAL1 KANK4 in L6b, and the marker of clusters 4 and 12 is not
    given, so under (a) L6 IT and L6b are judged together against 5 + 9 = 14. The counts with
    the VENs included are shown as a variant that does not decide. Reproduced when every count
    is within tolerance under one reading; partially reproduced when at least five of the seven
    are.
- id: ven-map-et-ct
  statement: The 29 morphologically identified VENs do not map to one transcriptomic cluster; 14
    map to L5 ET and 15 to L5/6 CT.
  source: Results, Patch-seq revealed extensive cellular heterogeneity in the primate AIC,
    paragraph 2; Figure 2a
  quote: 29 neurons that were morphologically identified as VENs did not map to a unique molecular
    cluster; instead, they mapped to either L5 ET ( n = 14) or L5/6 CT ( n = 15)
  data: with_labels
  depends_on:
  - patchseq-cell-table-link
  expected:
  - quantity: VENs mapped to L5 ET (Exc FEZF2 DSG2)
    value: 14
    tolerance: 1.4
  - quantity: VENs mapped to L5/6 CT (Exc FEZF2 COL24A1)
    value: 15
    tolerance: 1.5
  criterion: VENs are recordings whose expert type is VEN and that have a transcriptomic type
    (Patch-seq cells with mapping rate of 30% or more). Reproduced when both counts are within
    tolerance and no such VEN maps to another cluster; partially reproduced when the counts hold
    but other clusters also hold VENs (their number is reported).
- id: fig6f-ven-subtype-mapping
  statement: VENs mapped to L5 ET (Exc FEZF2 DSG2) are VEN-Ls (n = 10) and those mapped to L5/6 CT
    (Exc FEZF2 COL24A1) are VEN-Ss (n = 11).
  source: Results, Multimodal profiling of two VEN subtypes, paragraph 2; Figure 6f
  quote: the morphologically defined VENs mapped to L5 ET (Exc FEZF2 DSG2) were VEN-Ls ( n = 10),
    while those VENs mapped to L5/6 CT (Exc FEZF2 COL24A1) were VEN-Ss ( n = 11)
  data: with_labels
  depends_on:
  - patchseq-cell-table-link
  expected:
  - quantity: VEN-L in Exc FEZF2 DSG2
    value: 10
    tolerance: 1
  - quantity: VEN-S in Exc FEZF2 COL24A1
    value: 11
    tolerance: 1.1
  criterion: VEN subtype from the expert label (VEN_Long, VEN_Short) of the dataset or of
    metaInfo_ephysio_patchSeq.csv, crossed with the transcriptomic type. Reproduced when both
    counts are within tolerance and no VEN-L maps to Exc FEZF2 COL24A1 or VEN-S to Exc FEZF2 DSG2.
    The 14 and 15 VENs of ven-map-et-ct exceed 10 and 11; the paper does not say whether the
    rest lack a traced morphology or a subtype label, and the cross-table is reported.
- id: fig2d-l23it-small-tau
  statement: Among the six projection neuron groups, L2/3 IT HPCAL1 neurons stand out with a small
    membrane time constant.
  source: Results, Patch-seq revealed extensive cellular heterogeneity in the primate AIC,
    paragraph 3; Figure 2d
  quote: L2/3 IT HPCAL1 neurons stood out with a small membrane time constant (tau) and narrow
    action potential (AP) width (Fig. 2d–f )
  data: with_labels
  depends_on:
  - patchseq-cell-table-link
  criterion: Groups as in the code (opening comment); the legend counts 30 L2/3 IT HPCAL1, 17 IT
    RORB, 119 L5 IT FEZF2, 22 VEN, 16 L5 ET and 13 L6 PC neurons. Tau as in the Methods, an exponential
    f(t) = a exp(-t/tau) + C fitted from step onset to the sag minimum, averaged over all
    hyperpolarizing traces; the code's first-sweep tau is a variant. Test, two-tailed Wilcoxon
    rank-sum with Benjamini-Hochberg FDR over the features of the comparison, as calFDR_ephsio.m
    does (the legend names the test; the paper's FDR values are in Supplementary Table 2, not
    read). The Methods do not list every feature ("The adaptation indices ... For instance"), so
    the code settles the FDR family, the 39 features of Ins_patchseq_ephs.xlsx that
    calFDR_ephsio.m takes, those the Methods define computed as defined there and the others as
    createFeatures.m computes them. The family of the 20 features the Methods name (rheobase,
    threshold, amplitude, rise and decay time, half-width, latency, AHP, maximal firing rate,
    sag value, sag ratio, sag time, sag area, RMP, input resistance, tau, rebound, ISI and
    amplitude adaptation indices and the latency slope) is a variant. "Stood out" allows two readings, as the code computes both, (a) L2/3 IT
    HPCAL1 against the other five pooled, and (b) against each other group. Reproduced when its
    median tau is the lowest of the six groups and the comparison has FDR < 0.05 (conventional)
    under (a) or every comparison does under (b); partially reproduced when the median is lowest
    but neither reading is significant. The code's plot exclusion (tau of 1 ms or less) is a
    variant.
- id: fig2f-l23it-narrow-ap
  statement: L2/3 IT HPCAL1 neurons have a narrow AP width compared with the other projection
    neuron groups.
  source: Results, Patch-seq revealed extensive cellular heterogeneity in the primate AIC,
    paragraph 3; Figure 2f
  quote: L2/3 IT HPCAL1 neurons stood out with a small membrane time constant (tau) and narrow
    action potential (AP) width (Fig. 2d–f )
  data: with_labels
  depends_on:
  - patchseq-cell-table-link
  criterion: AP width is the half-width of the first AP of the rheobase sweep, at half the
    threshold-to-peak amplitude, threshold at the maximum third derivative in the 20 ms before
    the peak (Methods; the code plots Half_Width_ms as "AP width"). Tests and readings (a) and (b)
    as in fig2d-l23it-small-tau. Reproduced when its median half-width is the lowest of the six
    groups and the comparison is significant at FDR < 0.05 (conventional) under (a), or every
    comparison is under (b); partially reproduced when the median is lowest but neither reading
    is significant. The code table gives a lower median for IT RORB than for L2/3 IT HPCAL1, so
    "lowest" may fail with the claim still holding against the pooled groups; the rank and both
    readings are reported. The code's plot exclusion (widths outside 1 to 5 ms) is a variant.
- id: supp11-rm-itrorb-l6pc
  statement: IT RORB and L6 PC neurons have a distinctive input resistance among projection neuron
    groups.
  source: Results, Patch-seq revealed extensive cellular heterogeneity in the primate AIC,
    paragraph 3; Figure 2e; Supplementary Figure 11
  quote: Other types exhibit specific characteristics including distinctive membrane resistance in
    IT RORB and L6 PC neurons
  data: with_labels
  depends_on:
  - patchseq-cell-table-link
  criterion: Input resistance as in the Methods, the slope of steady-state voltage (last 100 ms of
    the step) minus RMP against injected current over the steps without APs; the code takes HEKA
    sweeps 1 to 6 (-200 to -100 pA) and the last two thirds of the step, a variant. The text does
    not give the direction; "distinctive" is read as differing from the other groups, and the
    direction is reported. Test and readings (a), each against the other five pooled, and (b),
    against each other group, as in fig2d-l23it-small-tau (Supplementary Fig. 11 and Table 2 not
    read). Reproduced when both IT RORB and L6 PC differ at FDR < 0.05 (conventional) under one
    reading; partially reproduced when one of them does.
- id: supp11-l5it-threshold-latency
  statement: L5 IT FEZF2 neurons have a higher AP threshold and a longer spike latency than the
    other projection neuron groups.
  source: Results, Patch-seq revealed extensive cellular heterogeneity in the primate AIC,
    paragraph 3; Supplementary Figure 11
  quote: Other types exhibit specific characteristics including ... a higher AP threshold and
    longer spike latency in L5 IT FEZF2 neurons
  data: with_labels
  depends_on:
  - patchseq-cell-table-link
  criterion: Threshold as in fig2f-l23it-narrow-ap; latency from step onset to the AP threshold
    of the first AP (Methods), in the rheobase sweep as the code takes it. Test and readings (a)
    and (b) as in fig2d-l23it-small-tau (Supplementary Fig. 11 not read). Reproduced when, under
    one reading, L5 IT FEZF2 has the higher median and FDR < 0.05 (conventional) for both
    features; partially reproduced when for one.
- id: supp11-ven-broad-ap
  statement: VENs have a broader AP than the other Patch-seq projection neuron groups.
  source: Results, Patch-seq revealed extensive cellular heterogeneity in the primate AIC,
    paragraph 3; Figure 2f; Supplementary Figure 11
  quote: Other types exhibit specific characteristics including ... a broader AP width in VENs
  data: with_labels
  depends_on:
  - patchseq-cell-table-link
  criterion: Half-width as in fig2f-l23it-narrow-ap. Test and readings (a) and (b) as in
    fig2d-l23it-small-tau. Reproduced when, under one reading, VENs have the highest median and
    FDR < 0.05 (conventional); partially reproduced when the median is highest without
    significance.
- id: supp11-l5et-deep-sag
  statement: L5 ET neurons have a deeper sag than the other projection neuron groups.
  source: Results, Patch-seq revealed extensive cellular heterogeneity in the primate AIC,
    paragraph 3; Supplementary Figure 11
  quote: Other types exhibit specific characteristics including ... and a deeper sag in L5 ET
    neurons
  data: with_labels
  depends_on:
  - patchseq-cell-table-link
  criterion: The Methods define sag value (RMP minus steady state at the largest hyperpolarizing
    step), sag ratio, sag time and sag area; "deeper" names none, and the code table holds
    Sag_Ratio. Readings of the measure, (i) sag ratio and (ii) sag value. Test and readings (a)
    and (b) of the comparison as in fig2d-l23it-small-tau. Reproduced when, under every measure
    reading and one comparison reading, L5 ET has the deepest sag with FDR < 0.05
    (conventional); blocked as methods_underspecified when the measure readings disagree.
- id: ven-firing-rate-variability
  statement: VENs have lower firing rates and greater variability in spike timing than PCs.
  source: Results, Patch-seq revealed extensive cellular heterogeneity in the primate AIC,
    paragraph 3; Supplementary Tables 1 and 2
  quote: Notably, VENs exhibit lower firing rate and greater variability in spike timing than PCs
  data: with_labels
  depends_on:
  - patchseq-cell-table-link
  criterion: Firing rate is the maximal firing rate, the largest AP count over the 600 ms step
    (Methods). The text names no measure of spike-timing variability; readings from the code's
    feature table, (i) ISI CV (std/mean of the ISIs of the maximal-rate sweep, createFeatures.m)
    and (ii) ISI Fano factor of that sweep. "PCs" is read as (a) the five PC groups pooled, as
    calFDR_ephsio.m compares VEN against the others, (b) each PC group, and (c) the layer 5
    PC groups pooled (L5 IT FEZF2 and L5 ET), as the Discussion says "Compared with neighbouring
    PCs". Test, two-tailed
    Wilcoxon rank-sum with Benjamini-Hochberg FDR as in fig2d-l23it-small-tau (Supplementary
    Tables 1 and 2 not read). Reproduced when, under one comparison reading, VENs have a lower
    median firing rate and a higher median variability under both measure readings, each at FDR
    < 0.05 (conventional); partially reproduced when only the firing rate holds; blocked as
    methods_underspecified when the measure readings disagree.
- id: l5et-vs-l5it-sag-rm-rate
  statement: L5 ET neurons have a deeper sag, a lower input resistance and a higher firing rate
    than L5 IT neurons.
  source: Discussion, paragraph 1
  quote: Specifically, L5 ET neurons in macaque AIC consistently exhibit deeper sag, lower input
    resistance and higher firing rates than L5 IT neurons.
  data: with_labels
  depends_on:
