  depends_on:
  - quiescent-window-link
  statement: The percentage of neurons not participating in any event cluster rises from P11 to P21,
    in both layers and sexes.
  source: Figure 3B; Results, Changes in subnetwork configuration
  quote: accompanied by a rise in the percentage of non-cluster neurons
  criterion: As fig3a-single-cluster-decline, with P21 above P11. The repository output printed P11
    minus P21 -18.6 percentage points (95% CI -26.5 to -10.9, p < 0.001).
- id: fig3c-multiple-cluster-unchanged
  depends_on:
  - quiescent-window-link
  statement: The percentage of neurons participating in multiple event clusters is similar at P11 and
    P21.
  source: Figure 3C; Results, Changes in subnetwork configuration
  quote: The percentages of multiple-cluster neurons remained similar between P11 and P21
  criterion: A claim of absence, judged on test T1's P11 minus P21 contrast in each sex and layer
