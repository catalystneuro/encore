# Claims for Huang, Hess, Bajpai, Li, Hobson, Xu, Barton & Lu (2025), iScience 28, 112104, on
# DANDI:001349.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-10,
# protocol pilot-14 as stated in docs/protocol.md.
#
# Text read. The version of record as served by Europe PMC (PMC11930745), full text with Results,
# Discussion, figure legends and STAR Methods, and the supplement (Document S1, Figures S1 to S9,
# text of the PDF appended to the same file). There is no PDF of the main article, so no main
# figure image was read; Videos S1 to S3 were not read. The dataset's archive title is the paper's
# title; its description says it holds two-photon awake imaging of the somatosensory cortex of
# developing mice from P11 to P21 with synchronized behavioral video.
#
# Code read. github.com/EdnaHuang/SubnetworkAssembley2024, commit 28e1b6d79c830b77831ceb97738ab423f9fc333f
# (the repository the paper links for code, statistics and post-analyzed files). It holds the MATLAB
# preprocessing (Calcium_Image_PreProcess_EventActivity, Steps 0 to 8, and calculate_mi_matrix_trace.m),
# the k-means clustering adapted from Modol et al. 2020 (Clustering_Analysis_Kmean/Modol_script.m and
# Cossart_Lab helpers), the Louvain and DBSCAN variants, the tetrachoric correlation and distance
# code (Post_Clustering_Analysis), the R statistics (Statistical_Script_Data) with knitted HTML
# outputs for Figures 1, 2, 3, 5, S2, S3, S6, S7, S8 and S9 (none for Figure 4 or S4; those panels
# use the same fitted models as Figures 1 to 3), and per-dataset summary tables (xlsx) with one row
# per imaging field. The Methods say "detailed statistical comparisons for all figures" are in this
# repository, so the contrast estimates and p-values its outputs print are cited in the criteria
# as the paper's own test results. The paper's text prints almost no p-values, so the
# `statistics` fields record only what the text prints.
#
# Data the paper used. Mice injected at P1 to P2 with AAV9-Syn.NES-jRGECO1a into S1, cranial window
# at P8 to P9, head-fixed awake two-photon imaging (505 x 505 um field, 512 x 512 pixels, 65.6 ms
# per frame, about 15.2 Hz) of L2/3 (120 to 150 um below pia) and L4 (200 to 350 um) at P11, P13,
# P15, P18 and P21, the same fields relocated by vasculature. Body and whisker movement filmed
# (30 Hz USB cameras; 100 Hz Flea3 for whiskers), limbs tracked with DeepLabCut and face with
# Facemap. Mice per age (Figure 4 legend) P11 14 F and 20 M; P13 13 F and 18 M; P15 11 F and 17 M;
# P18 5 F and 11 M; P21 6 F and 11 M. Some developmental animals carry R26-LSL-hM4Di, R26-LSL-Gq
# DREADD or FGF9 cKO alleles (STAR Methods). DREADD experiment (Figure 5, S6) with AAV9-Syn.NES-jRGECO1a
# plus AAV9-hDlx-hM3Dq-dTomato, imaged at P15 to P16 before and 30 to 60 min after CNO (1 mg/kg i.p.),
# 6 F and 4 M C57BL/6J mice; dTomato-positive (GABAergic) ROIs were excluded. Histology (Figures S5
# and S9) on fixed sections. The unit of every imaging statistic is a dataset, one imaging field
# (Location) in one layer of one session; the repository's developmental table has 455 rows and the
# DREADD table 96, and its R scripts drop Location 4 from the developmental analysis. Raw data were
# also deposited on Mendeley (data.mendeley.com/preview/nztp6242zk, a preview link).
#
# Measures, as fixed by the Methods and the code (cited as "the paper's measures" in the criteria).
# Quiescent window, a per-dataset period with minimal body movement and whisking (Methods, Data
# analysis for calcium imaging); every measure is computed inside it (Step2 to Step8, Modol_script.m
# all cut frames floor(start/0.0656) to floor(end/0.0656) - 1). dF/F with F0 the median of the bottom
# 10th percentile of the FISSA-corrected trace; Z score against the 10 s period of lowest SD of dF/F
# (Methods). Events (Step2, which settles the Methods' "four times the noise level") are peaks of the Z
# trace found by findpeaks whose height above the mean of the 5 s (77-frame) window of lowest RMS is
# at least 4 times that window's mean absolute peak-to-valley difference (read literally, the
# Methods' threshold, four times the mean Z score of the quietest window, is near zero for a Z-scored
# trace, so the code's reading is taken as the one the Methods mean). Event frequency is events per
# second per neuron over the window (Step4). Synchrony: percent of active cells per frame against a
# shuffle threshold (Methods; see open detail O2); synchrony frequency is synchrony events per second.
# Pearson correlation is the mean over all neuron pairs of the correlation of Z-scored traces;
# mutual information (MI) is the mean over pairs of the MI of Z-scored traces with 256-bin histograms
# (calculate_mi_matrix_trace.m). k-means (Methods; Modol_script.m, kmeansopt.m) clusters the frame by
# frame normalized covariance matrix of the binary event raster of all frames in the window, for 2 to
# 19 clusters, keeping the run with the best mean silhouette; the plotted silhouette value
# (silhs_mean_beforeStat) is the mean over clusters of each cluster's median silhouette, before the
# cluster significance test. A neuron participates in an event cluster when the number of that
# cluster's frames in which it fires exceeds the shuffle threshold (O4); neurons in one cluster are
# single-cluster, in two or more multiple-cluster (reassigned to the cluster of highest participation
# for subnetwork membership), in none non-cluster; a subnetwork is a cluster with more than 2 neurons,
# and the subnetwork number counts them (Modol_script.m). tCC is the tetrachoric correlation of the
# binary event rasters (tetrac.m), its within-subnetwork value the mean over all within-subnetwork
# pairs pooled over subnetworks (Calculate_Correlation_in_out_Cluster.mlx); the "outside" value pairs
# each subnetwork neuron with the neurons of the other subnetworks. Distances use Suite2p ROI centres
# (pixels, about 0.99 um each) per subnetwork, centroid the mean position (Calcuate_Subnetwork_Distances.m).
#
# The paper's test, T1 (developmental), from the Methods (Statistical analysis) and
# Develop_Function_20230219.R with Develop_Function_posthoc_20240411.R. Per-dataset values of all five
# ages in one linear mixed model, fixed effects age (factor), sex, layer and the interactions kept by
# the scripts' selection (the lowest-AIC of the eight nested models, then Kenward-Roger comparisons with
# the simplest and the full model), random intercepts for subject and for subject by location (the
# second, then the first, dropped when the fit is singular, and a linear model used when still
# singular); case bootstrap resampling subjects, 10,000 replicates (lm.boot with 10,000 for linear
# models); emmeans contrasts on the replicates, p = 2(1 - pd), no correction across contrasts;
# significant at p < 0.05. Post hoc contrasts are age pairs within each sex and layer, sex within each
# layer and age, layer within each sex and age. T2 (CNO) is the same with fixed effects CNO (before or
# after), sex and layer and no age (WT_Dlx_GsDREADD_Function_20230211_caseboot.R). The Figure S9
# histology model is layer by sex with random intercepts for animal and image (VGAT_Syt2_Function_20230319.R).
#
# Details the paper leaves open, with the readings each claim that uses them must run.
# O1 the quiescent window. The paper gives no movement threshold. Readings (a) the window the paper
# used, from the repository tables (Time_start and Time_end, seconds, per dataset name); (b) a window
# found from the dataset's behavioral video with a stated movement threshold (an assumption).
# O2 the synchrony threshold. The Methods fix it as the 95th percentile, over 100 shuffles that keep
# each cell's event rate, of each shuffle's peak percent of active cells, an event lasting from the
# upward to the downward crossing; Step7 instead circularly shifts each cell, takes the 95th percentile
# of all shuffled frames pooled, counts findpeaks peaks above it and first drops cells with no event.
# The Methods are the main reading, Step7 the variant.
# O3 k-means runs per cluster number, 100 in the Methods, 10 in kmeansopt as called. Methods main,
# code variant.
# O4 the participation threshold, the 95th percentile of reshuffled data in the Methods, the
# 1 - 0.05/(number of clusters) quantile of 5,000 shuffles in Modol_script.m. Methods main, code variant.
# O5 the denominator of the neuron percentages, (a) all ROIs (the code counts silent ROIs as
# non-cluster) or (b) ROIs with at least one event in the window.
# O6 the dataset event frequency, the mean over neurons (a) with at least one event (Step4 sets zero
# to NaN) or (b) over all ROIs; the averaging step is not in the repository.
# Conflicts between the paper's sentences and its own outputs are named in the claims concerned
# (figs4b-mi-sex-p21, figs6ab-cno-correlation-unchanged, fig4fgh-configuration-trajectory,
# figs7-subnetwork-number-stable, figs9-layer-differences).
schema_version: 2
paper: doi:10.1016/j.isci.2025.112104
claims:
- id: quiescent-window-link
  kind: link
  statement: The rows of the paper's per-dataset summary tables, which give the quiescent window of each
    imaging field, can be matched to the dandiset's files, and the values the tables give agree with
    those computed from the matched files.
  source: Code repository github.com/EdnaHuang/SubnetworkAssembley2024 at commit 28e1b6d,
    Statistical_Script_Data, Kmean_CovM_SummaryDevAll_CorrDistanceArea.xlsx and
    Kmean_CovM_SummaryDlxGsDREADD_CorrDistanceArea.xlsx
  data: with_inputs
  criterion: Added by the author (protocol, author step 4), since the dandiset holds no behavioural
    video and the windows (O1 reading a) come from these tables. Records are matched by subject
    (the tables' SubjectID against the files' subject_id, a difference of spelling only), layer,
    field number (Location), the CNO condition for the DREADD table and the number of ROIs
    (total_cell_number), with the age to break ties. The link holds (reproduced) when at least 95% of
    each table's rows match a file and, on the matched records, the age and sex agree and the
    Pearson correlation of Z-scored traces recomputed in the window agrees with the table's
    ZF_R_allpair_mean (r above 0.95); a window shifted by 30 s must agree worse. It is partially
    reproduced when the matched records agree but fewer rows match, and not reproduced when the
    matched records do not agree.
- id: fig1d-event-frequency-decline
  depends_on:
  - quiescent-window-link
  statement: Spontaneous event frequency during quiescence declines from P11 to P21 in both L2/3 and
    L4 neurons and in both sexes.
  source: Figure 1D; Results, Spontaneous neuronal activity decreased and desynchronized
  quote: We observed a notable developmental decline in event frequency from P11 to P21 in L2/3 and
    L4, a consistent trend in both sexes
  criterion: The paper's measures (event frequency, O1 and O6 readings) and test T1. Reproduced when
    the P11 minus P21 contrast is positive with p < 0.05 in each of the four sex and layer groups;
    partially reproduced when it holds in two or three. The repository output (Figure_1_supp2.html)
    printed a main-effect model with P11 minus P21 0.605 events/s (95% CI 0.352 to 0.822, p < 0.001)
    in every group.
- id: fig1f-synchrony-decline
  depends_on:
  - quiescent-window-link
  statement: The frequency of synchronous network events falls significantly by P21, in both layers
    and both sexes.
  source: Figure 1E and 1F; Results, Spontaneous neuronal activity decreased and desynchronized
  quote: The results showed a significant decrease in synchrony frequency by P21, regardless of
    cortical layer or sex
  criterion: The paper's measures (synchrony frequency, O1 and O2 readings) and test T1. Reproduced
    when P11 minus P21 is positive with p < 0.05 in each sex and layer group; partially reproduced in
    two or three. The repository output printed 0.491 synchrony events/s (95% CI 0.315 to 0.658,
    p < 0.001), the same in all groups.
- id: figs2f-pearson-decline-females
  depends_on:
  - quiescent-window-link
  statement: The mean pairwise Pearson correlation falls from P11 to P21 in females but not in males.
  source: Figure S2F; Results, Spontaneous neuronal activity decreased and desynchronized
  quote: Our analysis revealed a significant decrease in the mean correlation coefficient from P11 to
    P21 in females, but not in males
  criterion: The paper's measures (Pearson correlation of Z-scored traces, all pairs, O1 reading) and
    test T1. The female part holds when P11 minus P21 is positive with p < 0.05 in both layers of
    females. The male part is a claim of absence, judged on the same contrast in males of each layer;
    it holds when p >= 0.05 in both. Reproduced when both parts hold, partially reproduced when one
    does. The repository output printed females L2/3 0.153 (p < 0.001) and L4 0.096 (p = 0.017),
    males L2/3 0.076 (p = 0.096) and L4 -0.004 (p = 0.85).
- id: figs2f-pearson-l23-above-l4-p11
  depends_on:
  - quiescent-window-link
  statement: At P11, L2/3 neurons have higher pairwise Pearson correlation than L4 neurons, in both
    sexes.
  source: Figure S2F; Results, Spontaneous neuronal activity decreased and desynchronized
  quote: Furthermore, L2/3 neurons showed higher correlated activity compared to L4 neurons at P11,
    regardless of sex
  criterion: Test T1, the layer contrast at P11 within each sex. Reproduced when L2/3 exceeds L4 with
    p < 0.05 in both sexes, partially reproduced in one. The repository output printed L4 minus L2/3
    -0.033 (p = 0.025) in females and -0.051 (p < 0.001) in males.
- id: figs2g-mi-decline
  depends_on:
  - quiescent-window-link
  statement: Mutual information between neuron pairs is significantly lower at P21 than at P11 in
    both sexes and both layers.
  source: Figure S2G; Results, Spontaneous neuronal activity decreased and desynchronized
  quote: MI analysis shows a significant decrease in MI at P21 compared to younger ages in both sexes
    and cortical layers
  criterion: The paper's measures (MI, O1 reading) and test T1. Figure S2G shows P11 and P21 only, so
    "younger ages" is read as P11. Reproduced when P11 minus P21 is positive with p < 0.05 in all four
    sex and layer groups; partially in two or three. The repository output printed 0.190 (p < 0.001)
    in females and 0.107 (p = 0.001) in males, the same in both layers.
- id: figs2g-mi-male-above-female-p21
  depends_on:
  - quiescent-window-link
  statement: At P21, male neurons have significantly higher MI than female neurons, in both layers.
  source: Figure S2G; Results, Spontaneous neuronal activity decreased and desynchronized
  quote: Notably, at P21, male neurons displayed significantly higher MI values than female neurons,
    regardless of cortical layer
  criterion: Test T1, the sex contrast at P21 in each layer. Reproduced when male exceeds female with
    p < 0.05 in both layers, partially in one. The repository output printed male minus female 0.087
    (p = 0.015) in both layers.
- id: figs2g-mi-l4-below-l23
  depends_on:
  - quiescent-window-link
  statement: L4 neurons have lower MI than L2/3 neurons at both P11 and P21, in both sexes.
  source: Figure S2G; Results, Spontaneous neuronal activity decreased and desynchronized
  quote: Additionally, L4 neurons exhibited lower MI values compared to L2/3 neurons at both P11 and
    P21, independent of sex
  criterion: Test T1, the layer contrast at P11 and at P21 within each sex. Reproduced when L4 is
    below L2/3 with p < 0.05 in all four age and sex groups, partially in two or three. The
    repository output printed L4 minus L2/3 -0.022 (p < 0.001) throughout.
- id: fig2e-subnetworks-present-same-number
  depends_on:
  - quiescent-window-link
  statement: Neuronal subnetworks are already present at P11, and a similar number of subnetworks is
    found at P21.
  source: Figure 2E; Results, Subnetworks are formed by P11
  quote: we found that neuronal subnetworks were already present at P11 and that a similar number of
    subnetworks was found at P21
  criterion: The paper's measures (k-means subnetworks, O1, O3, O4 readings). Two parts. Presence holds
    when more than half of the P11 datasets have at least one subnetwork (the paper shows five in its
    example, Figure 2B); the bound is this file's choice, since the paper gives none and the Figure 4
    legend says some datasets had no subnetwork. The equal number is a claim of absence, judged on test T1's P11 minus P21 contrast of
    subnetwork number; it holds when p >= 0.05 in every sex and layer group. Reproduced when both
    hold; the contrast is reported either way. The repository output printed 0.575 subnetworks (95%
    CI -0.443 to 1.763, p = 0.29).
- id: fig2d-silhouette-increase
  depends_on:
  - quiescent-window-link
  statement: The silhouette value of event clusters increases substantially from P11 to P21 in both
    layers and both sexes.
  source: Figure 2D; Results, Subnetworks are formed by P11
  quote: Interestingly, our data analysis revealed a substantial increase in silhouette value from P11
    to P21, spanning both cortical layers and sexes
  criterion: The paper's measures (silhouette value before the cluster test, O1 and O3 readings) and
    test T1. Reproduced when P21 exceeds P11 with p < 0.05 in all four sex and layer groups; partially
    in two or three. The repository output printed P11 minus P21 from -0.188 to -0.215 (p < 0.001) in
    every group.
- id: figs3c-tcc-inside-above-outside
  statement: At P11 and P21 the tetrachoric correlation of neuron pairs within the same subnetwork is
    consistently higher than that of pairs from different subnetworks.
  source: Figure S3C; Results, Subnetworks are formed by P11
  quote: Notably, the tCC of neuronal pairs within the same subnetworks at P11 and P21 was consistently
    higher than that of pairwise comparisons between neurons from different subnetworks
  depends_on:
  - fig2e-subnetworks-present-same-number
  - quiescent-window-link
  criterion: The paper's tCC inside and outside measures (O1, O3, O4 readings), on datasets with at
    least two subnetworks. The paper shows paired values per dataset and reports no test. Reproduced
    when the mean inside value exceeds the mean outside value in each of the eight age, sex and layer
    groups and a paired Wilcoxon signed-rank test over datasets (a standard choice; the paper names
    none) gives p < 0.05 at each age; partially reproduced when the means hold and the test fails at
    one age. The fraction of datasets with inside above outside is reported.
- id: fig2f-tcc-increase-l23
  depends_on:
  - quiescent-window-link
  statement: Within-subnetwork tCC is significantly higher at P21 than P11 in L2/3 in both sexes,
    while L4 shows a similar trend that is not significant (p = 0.051).
  source: Figure 2F; Results, Subnetworks are formed by P11
  quote: L2/3 neurons had a significantly heightened tCC at P21 compared to P11, regardless of sex ...
    while a similar trend was observed in L4 neurons, without reaching statistically significance
  statistics:
  - about: L4, P21 against P11
    test: linear mixed-effects model, bootstrapped post hoc comparison
    p: 0.051
  criterion: The paper's tCC within subnetworks (O1, O3, O4 readings) and test T1. Reproduced when the
    L2/3 P21 minus P11 contrast is positive with p < 0.05 in both sexes and the L4 contrast is
    positive with p >= 0.05; partially reproduced when L2/3 holds and L4 is positive with p < 0.05.
    The repository output printed L2/3 0.084 (p = 0.004) and L4 0.064 (p = 0.051).
- id: figs3d-neuron-number-not-related
  depends_on:
  - quiescent-window-link
  statement: The number of subnetworks found is barely related to the number of neurons in the
    analysis (Spearman rho = -0.063).
  source: Figure S3D; Results, Subnetworks are formed by P11
  quote: The Spearman correlation coefficient for the number of neurons included in the clustering
    analysis was ρ = −0.063
  expected:
  - quantity: Spearman rho, subnetwork number against neuron number, P11 and P21 datasets
    value: -0.063
    tolerance: 0.08
  criterion: Over the P11 and P21 datasets pooled (Figure_2_supp3.Rmd keeps only those ages; its test
    has n = 162), Spearman correlation of subnetwork number with the number of ROIs. The tolerance is
    one sampling standard error of rho at that n (about 1/sqrt(161)), since 10% of a value near zero
    is far below its sampling error. Reproduced when rho is within tolerance.
- id: figs3e-time-interval-not-related
  depends_on:
  - quiescent-window-link
  statement: The length of the analysed time interval has little effect on the number of subnetworks
    (Spearman rho = 0.233).
  source: Figure S3E; Results, Subnetworks are formed by P11
  quote: and for the time intervals used, ρ = 0.233 ... These results indicate that both the number of
    neurons and time intervals had minimal impact on subnetwork identification
  expected:
  - quantity: Spearman rho, subnetwork number against quiescent interval length, P11 and P21 datasets
    value: 0.233
    tolerance: 0.08
  criterion: As figs3d-neuron-number-not-related, with the length of the quiescent window (O1). The
    tolerance has the same reason. Reproduced when rho is within tolerance. The repository output
    gives this rho a p-value of 0.0028, which is reported.
- id: fig3a-single-cluster-decline
  depends_on:
  - quiescent-window-link
  statement: The percentage of neurons participating in a single event cluster decreases from P11 to
    P21, in both layers and sexes.
  source: Figure 3A; Results, Changes in subnetwork configuration
  quote: Our findings revealed a decrease in the percentage of single-cluster neurons with age
  criterion: The paper's measures (O1, O3, O4, O5 readings) and test T1. Reproduced when P11 minus P21
    is positive with p < 0.05 in all four sex and layer groups; partially in two or three. The
    repository output printed 15.1 percentage points (95% CI 6.1 to 23.5, p = 0.001).
