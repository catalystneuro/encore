- id: figs4a-pearson-trajectory
  depends_on:
  - quiescent-window-link
  statement: In females the Pearson correlation decreases gradually from P11 to P21 in L2/3 and from
    P11 to P18 in L4; in males it decreases from P11 to P15 and then rises transiently at P18.
  source: Figure S4A; Results, The refinement of S1 neuronal subnetworks
  quote: Pearson correlation coefficients revealed that, in females, L2/3 and L4 neurons showed a
    gradual decrease in their correlation coefficients from P11 to P21 and P11 to P18, respectively ...
    In males, correlation coefficients decreased from P11 to P15, followed by a transient increase at
    P18
  criterion: Test T1 (Pearson correlation, O1 reading). Three parts, each from the post hoc age
    contrasts. Female L2/3 holds when P11 minus P21 is positive with p < 0.05; female L4 when P11 minus
    P18 is positive with p < 0.05 and is the largest female L4 contrast from P11; males when P11 minus
