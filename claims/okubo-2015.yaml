    once in a syllable; reading, the burst nearest the histogram peak latency. Reproduced when
    both counts are within tolerance and the rank-sum test finds no difference at P < 0.05 (the
    paper's test, judged as a claim of absence).
  depends_on:
  - all-birds-shared-specific
- id: ed5-shared-ra-x-proportion
  statement: Shared neurons are found in similar proportions among HVCRA and HVCX neurons (19% and
    28%; P = 0.08).
  source: Extended Data Fig. 5 legend, Summary of properties of HVCRA and HVCX shared neurons
  quote: Shared neurons were found in similar proportion across both HVCRA and HVCX neurons (19% and
    28%, respectively; P = 0.08; averaged over all developmental stages)
  statistics:
  - test: not named; chi-square test by the Methods' Statistics section
    p: 0.08
  expected:
  - quantity: shared fraction, HVCRA
    value: 19
    tolerance: 1.9
    unit: '%'
  - quantity: shared fraction, HVCX
    value: 28
    tolerance: 2.8
    unit: '%'
  criterion: A claim of absence. OPEN, the denominator; readings (a) the shared and specific neurons
    of the 8 pairs, by cell type (24 HVCRA and 120 HVCX shared neurons, Methods, acoustic
    analysis), (b) all juvenile neurons of the cell type in birds 1 to 6. Chi-square 2 x 2 (cell
    type, shared or not) without continuity correction (header). Reproduced when the test finds
