- id: ed2mo-ra-x-similar
  statement: HVCRA and HVCX neurons develop alike; of 14 comparisons of locking, rhythmicity and
    period across stages, only the motif-stage period differs between cell types.
  source: Extended Data Fig. 2m-o
  quote: Of the 14 comparisons between HVCRA and HVCX neurons shown in panels m–o, only the period of
    HVC rhythm (panel o) during the motif stage showed significant difference between the cell
    types (P < 0.05 with Bonferroni correction)
  statistics:
  - about: motif-stage period, HVCRA against HVCX
    test: chi-square test (Methods, Statistics, Extended Data Fig. 2m-o)
    p: 0.05
    p_relation: <
    corrected: Bonferroni
  data: with_inputs
  criterion: Locking, rhythmicity and period as in the header, per stage (subsong to adult) and cell
    type (HVCp left out); 14 comparisons (no HVCRA period in subsong). The Methods name the
    chi-square test for all three panels, which fits the fractions; for the period, readings (a)
    rank-sum test, as periods are continuous, (b) chi-square on periods binned at the median of
    the stage. Bonferroni over 14. Reproduced when the motif-stage period differs and no other
    comparison does; partially reproduced when the motif-stage period differs and one other does.
    Without adult neurons, 12 comparisons are made.
- id: model-fig5a-subsong-decay
  statement: In the model before learning, activating the seed neurons produces a briefly
    propagating sequence of activity that decays within tens of milliseconds.
  source: Results, Mechanistic model and discussion, paragraph 3; Figure 5a
  quote: Before learning, activation of these seed neurons produced a transiently propagating
    sequence of network activity that decayed rapidly (within tens of milliseconds; Fig. 5a)
  data: elsewhere
  where: Supplementary Information of the article (HVCModelCode, MATLAB, supplied as
    paper/10.1038-nature15741.code.m); no recorded data
  criterion: Run the subsong stage of HVCModelCode (1,000 steps of 10 ms, seed neurons driven
    together with probability 0.1 per step, no learning, beta 0.115, alpha 30, gamma 0.01, seed
    9038). Reproduced when the mean number of non-seed neurons active at each step after a seed
    activation returns to the level of steps not preceded by a seed activation within 100 ms
    (10 steps), so that activity does not last a protosyllable period. Ten further seeds are run
    as a variant, as MATLAB's generator may not be reproduced elsewhere.
- id: model-fig5b-chain
  statement: Rhythmic activation of the seed neurons with learning grows a feedforward chain that
    supports stable propagation of activity through the protosyllable.
  source: Results, Mechanistic model and discussion, paragraph 4; Figure 5b
  quote: As a result, connections were strengthened along the population of neurons sequentially
    activated after syllable onsets, resulting in the growth of a feedforward synaptically
    connected chain that supported stable propagation of activity (Fig. 5b)
  data: elsewhere
  where: Supplementary Information of the article (HVCModelCode, MATLAB, supplied as
    paper/10.1038-nature15741.code.m); no recorded data
  criterion: Run 500 protosyllable iterations (1 s each, seeds every 100 ms; eta 0.025, epsilon
    0.2, wmax 1, m 10) after subsong. Participating neurons as the code defines them (firing at
    their most common latency more than 4 times in the 10 cycles of the iteration). Reproduced
    when, at iteration 500, participating non-seed neurons have most common latencies covering
    every 10 ms step of the cycle, and there are more of them than participate in subsong.
- id: model-fig5cd-split
  statement: Activating two halves of the seed neurons on alternate cycles splits the chain into
    two daughter chains; during splitting there are neurons specific to each syllable and shared
    neurons active at the same latency in both, and the fraction of shared neurons decreases.
  source: Results, Mechanistic model and discussion, paragraphs 5 and 6; Figure 5c, d
  quote: We found that this single chain could be induced to split into two daughter chains by
    dividing the seed neurons into two groups that were activated on alternate cycles of the
    rhythm (Fig. 5c, d and Supplementary Video 1) ... During the splitting process, we observed
    neurons specific to each of the emerging syllable types, as well as shared neurons that were
    active at the same latencies in both syllable types (Fig. 5c) ... and the fraction of shared
    neurons decreased (Fig. 5c, d)
  data: elsewhere
  where: Supplementary Information of the article (HVCModelCode, MATLAB, supplied as
    paper/10.1038-nature15741.code.m); no recorded data
  criterion: Continue with 2,000 splitting iterations (5 pulses per seed group per iteration;
    wmax 2, m 5, gamma rising to 0.18 on a sigmoid with time constant 200 and inflection 500
    iterations). Participation per type as the code defines it for this stage (more than 2
    firings at the most common latency). Reproduced when at iteration 992 there are specific
    neurons of both types and shared neurons, most shared neurons (over half) have the same
    most common latency in both types, and at iteration 2,500 the shared fraction of
    participating neurons is lower than at 992. Ten further seeds as a variant.
  depends_on:
  - model-fig5b-chain
- id: model-fig5e-latency-broadens
  statement: In the model, the distribution of burst latencies broadens from subsong through the
    protosyllable stage to chain splitting.
  source: Results, Mechanistic model and discussion, paragraph 6; Figure 5e
  quote: over the course of development the distribution of burst latencies in the model continued
    to broaden (Fig. 5e)
  data: elsewhere
  where: Supplementary Information of the article (HVCModelCode, MATLAB, supplied as
    paper/10.1038-nature15741.code.m); no recorded data
  criterion: Latencies are the most common latency of each participating non-seed neuron
    (findLatency in the code), at subsong, iteration 500, and splitting (992 and 2,500
    combined, as the Fig. 5e legend says). OPEN, the measure of breadth; readings (a)
    interquartile range, (b) standard deviation. Reproduced when, under one reading, breadth
    increases from subsong to the protosyllable stage and from there to splitting.
  depends_on:
  - model-fig5cd-split
- id: model-ed10gh-period
  statement: In the model, the average period of rhythmic bursting increases during chain splitting
    as specific neurons burst only on alternate cycles of the protosyllable rhythm.
  source: Results, Mechanistic model and discussion, paragraph 6; Figure 5d; Extended Data Fig.
    10g, h
  quote: The average period of rhythmic bursting in model neurons increased during chain splitting
    as neurons became ‘specific’ for one emerging syllable type and began to participate only on
    alternate cycles of the protosyllable rhythm
  data: elsewhere
  where: Supplementary Information of the article (HVCModelCode, MATLAB, supplied as
    paper/10.1038-nature15741.code.m); no recorded data
  criterion: OPEN, how the model period is measured; readings (a) per participating neuron, the
    lag of the largest autocorrelation peak of its activity between 80 and 1,000 ms (the data
    method), (b) its most common inter-burst interval. Reproduced when, under one reading, the
    mean period at iteration 2,500 exceeds that at iteration 500 and specific neurons' periods
    are near 200 ms (within 10%).
  depends_on:
  - model-fig5cd-split
- id: model-ed10ad-bout-onset
  statement: Adding bout-onset seed neurons makes the protosyllable chain split into one daughter
    chain active only at bout onset and another active only on later syllables.
  source: Results, Mechanistic model and discussion, paragraph 7; Extended Data Fig. 10a-d
  quote: This caused the protosyllable chain to split in such a way that one daughter chain was
    reliably activated only at bout onsets, while the other daughter chain was active only on
    subsequent syllables (Extended Data Fig. 10a–d and Supplementary Video 2)
  data: elsewhere
  where: Supplementary Information of the article (HVCModelCode, MATLAB, supplied as
    paper/10.1038-nature15741.code.m); no recorded data
  criterion: Run the bout-onset section of HVCModelCode (5 bout-onset and 5 protosyllable seeds;
    100 protosyllable and 500 splitting iterations of 10 bouts; beta 0.13, eta 0.05, epsilon
    0.14; wmax 1 to 2, m 5 to 2.5, gamma 0.01 to 0.04, inflection 250). Participation as the code
    defines it (thresholds 4 and 6). Reproduced when at iteration 600 there are neurons specific
    to the bout-onset syllable and to later syllables, and the shared fraction is lower than at
    iteration 130.
- id: model-ed10eh-motif
  statement: Dividing the seed neurons into three groups activated in turn splits the protosequence
    into three non-overlapping daughter sequences, simulating the motif strategy.
  source: Results, Mechanistic model and discussion, paragraph 7; Extended Data Fig. 10e-h
  quote: Our model was also able to simulate the simultaneous emergence of a three-syllable motif
    ... by dividing the seed neurons into three subpopulations ... After learning, the population of
    neurons was active sequentially throughout the entire ‘motif,’ but individual neurons were
    active during only one of the resulting syllables, forming three distinct non-overlapping
    sequences
  data: elsewhere
  where: github.com/emackev/HVCModelCode (named in the Supplementary Information code; not read,
    no commit pinned); the supplied code does not hold this simulation
  criterion: Parameters from the Methods (9 seeds, 3 groups of 3 each driven every third cycle;
    beta 0.115, alpha 30, eta 0.025, epsilon 0.2; wmax 1 to 2, m 9 to 3, gamma 0.01 to 0.18 with
    time constant 200 and inflection 500). OPEN, the number of iterations and the participation
    threshold, which the Methods do not give for this strategy; readings (a) as alternating
    differentiation (500 and 2,000 iterations; more than 2 firings at the most common latency),
    (b) the values in the GitHub code, if the author pins it. Reproduced when after learning no
    participating non-seed neuron is shared among the three types and each type has specific
    neurons.
  depends_on:
  - model-fig5b-chain
- id: model-ed10ik-new-chain
  statement: With stronger seed input, bout-onset seed neurons grow a new syllable chain at bout
    onset while the protosyllable chain stays intact, without bout-onset differentiation.
  source: Results, Mechanistic model and discussion, paragraph 8; Extended Data Fig. 10i-k
  quote: We found that, by using different learning parameters, our model allows bout-onset seed
    neurons to induce the formation of a new syllable chain at bout onset
  data: elsewhere
  where: github.com/emackev/HVCModelCode (named in the Supplementary Information code; not read,
    no commit pinned); the supplied code holds only the bout-onset differentiation run
  criterion: As model-ed10ad-bout-onset with the Methods' parameters for this case (seed input 2.5
    Wmax throughout; beta 0.13, eta 0.05, epsilon 0.15; m 5 to 2.5; gamma 0.01 to 0.05). Reproduced
    when at the end there are neurons specific to the bout-onset element and neurons specific to
    the protosyllable, and the protosyllable seed neurons are still active on every protosyllable
    input.
