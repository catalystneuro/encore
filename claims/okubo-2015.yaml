# Claims for Okubo, Mackevicius, Payne, Lynch & Fee (2015), "Growth and splitting of neural
# sequences in songbird vocal development", Nature 528, 352-357, doi:10.1038/nature15741, tested on
# CRCNS am-3 ("Single-unit extracellular recordings of projection neurons in the premotor cortical
# area HVC of juvenile male zebra finches during singing").
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-09,
# protocol pilot-14 as stated in docs/protocol.md.
#
# Text read. The version of record (paper/10.1038-nature15741.txt, extracted from the publisher's
# PDF): main text, figure legends, Methods and the legends of Extended Data Figures 1 to 10. The
# Supplementary Information is the model code (read, below) and Supplementary Videos 1 and 2
# (not supplied; no claim rests on them alone). The PDF could not be rendered in this run (no PDF
# renderer installed), so figures were read only from their legends and the Results sentences
# that cite them. In Fig. 1f, Fig. 1g and Extended Data Fig. 1c the extracted text shows the
# significance stars but not which stage each belongs to; the claims that use them say so.
#
# Code. The paper's Supplementary Information holds HVCModelCode (MATLAB, by E. Mackevicius,
# 2015-07-18), supplied as paper/10.1038-nature15741.code.m. It reproduces Fig. 5a-d and
# Extended Data Fig. 10a-d: the binary network (HVCIter), the alternating and bout-onset training
# schedules, and the plotting, with seed 9038. Its comment points to github.com/emackev/HVCModelCode
# for the other figures (motif strategy, Extended Data Fig. 10e-k); that repository was not read
# and no commit is pinned. The code agrees with the Methods' parameters. It settles what the
# Methods leave open for the model: a neuron participates in a syllable type when it fires at its
# most common latency more than a fixed number of times per iteration (12 in subsong, 4 in the
# protosyllable stage, 2 per type in the splitting stage; 4 and 6 for the bout-onset and
# protosyllable types in bout-onset differentiation); Fig. 5c is iteration 992 (492 splitting
# iterations) and Fig. 5d iteration 2,500. The Methods describe the threshold as 90% of surrogate
# peaks; the code's comments say its fixed values came from that test, so the code's values are
# used. No analysis code for the recordings is linked; every data method below is from the Methods
# and legends.
#
# Data the paper describes. Male zebra finches singing undirected song: 32 juvenile birds, 44 to
# 112 days post-hatch (dph), plus 3 adult birds (over 120 dph). 1,149 HVC projection neurons in
# all (35 birds), single units recorded with a motorized microdrive during singing; cell type
# HVCRA or HVCX by antidromic stimulation from RA or Area X, or HVCp (putative projection neuron,
# 211 of 1,149). Each day of singing is assigned a song stage: subsong, protosyllable,
# multi-syllable, motif, or adult (over 120 dph). Measured variables: spike times, the song audio,
# syllable onsets and offsets (segmented on 1 to 4 kHz power; phase segmentation for bird 3 and
# for bird 4's protosyllable stage), syllable labels (Greek letters for juvenile syllables, Latin
# capitals for adult ones), and the bird's age. Paper bird numbers to archive names (Methods,
# Animals): bird 1 to3965, bird 2 to3779, bird 3 to3017, bird 4 to5640, bird 5 to3396, bird 6
# to2309, bird 7 to3412, bird 8 to3567, bird 9 to2462, bird 10 to2331, bird 11 to2427, bird 12
# to3352. Birds 1 to 6 were recorded during the emergence of several syllable types (769
# neurons); bird 1 has 375 neurons and bird 2 has 125. The dataset's title and data descriptor
# say it holds the juvenile recordings (32 birds, 44 to 112 dph) with per-neuron spike times,
# syllable segments and labels, sound files, song stage, age and cell type; its files were not
# looked at.
#
# Data from outside the recordings (step 4). The adult stage (3 birds, 32 neurons) "included a
# reanalysis of previously published HVC recordings" (Methods, Animals; ref. 20, Kozhevnikov &
# Fee 2007, J. Neurophysiol. 97, 4271-4283). The data descriptor lists only juvenile birds, so
# claims that use the adult stage are marked with_inputs. The model claims use the simulation
# code, not the recordings, and are marked elsewhere.
#
# Definitions used by several criteria, from the Methods unless marked.
# - Bouts. Continuous sequences of syllables separated by gaps no longer than 300 ms; bout onset
#   is the first syllable's onset, bout offset the last syllable's offset. Introductory notes are
#   excluded. Only spikes during singing (first syllable onset to last syllable offset of a bout)
#   are used for rhythmicity. Neurons with less than 5 s of singing are excluded.
# - Bursts. Spikes separated by 30 ms or less form a burst (a lone spike is a burst); burst time is
#   the mean time of its spikes.
# - Syllable locking (Methods, Syllable-related neural activity). Spikes aligned to syllable onset,
#   rate histogram with 1 ms bins smoothed over 20 bins, range plus or minus 0.5 s; the peak
#   between 50 ms before and 200 ms after onset; surrogates add a random shift, uniform over plus
#   or minus 0.5 s, to each trial's spikes; 1,000 surrogates; P is the fraction of surrogate
#   peaks larger than the real one; locked when P < 0.05. OPEN: (i) the smoothing kernel; a
#   20-bin moving average is the plain reading and the standard choice, used throughout; (ii)
#   whether shifted spikes wrap around the window; readings (a) circular shift within the
#   window, (b) spikes taken from a wider window and shifted, then binned within plus or minus
#   0.5 s; (iii) which syllables, in stages with several syllable types; readings (a) all
#   selected syllables pooled, (b) each labelled type separately, locked when any type is
#   significant (Bonferroni over types as a sub-variant).
# - Rhythmic neurons (Methods, Quantification of the rhythmic neural activity). Four measures,
#   each with its peak: inter-burst interval distribution, peak between 80 and 1,000 ms;
#   spike-train autocorrelation as a conditional firing rate, peak between 80 and 1,000 ms;
#   multitaper spectrum (Chronux, point process, non-overlapping 1.5 s windows of singing,
#   NW = 3/2, K = 2 tapers, averaged over windows), peak in 2 to 15 Hz; cepstrum (inverse
#   Fourier transform of the log spectrum), peak between 80 and 1,000 ms. Surrogates place the
#   bout's bursts at random within an interval of the bout's duration, keeping their spikes and
#   at least 30 ms between bursts; 1,000 surrogates for the IBI and autocorrelation, 100 for the
#   spectrum and cepstrum; P is the fraction of surrogate peaks larger than the real one, and a
#   peak is significant at P < 0.05 (Methods, Statistics). Rhythmic when at least two of the four
#   are significant. Period is the lag of the largest autocorrelation peak between 80 and 1,000
#   ms. OPEN: the bin widths of the IBI histogram and of the autocorrelation; readings (a) 1 ms
#   bins smoothed over 20 bins, as for the paper's other spike histograms, (b) 10 ms bins; and
#   which spectrum the cepstrum is taken from; readings (a) the neuron's mean multitaper
#   spectrum, (b) the spectrum of each 1.5 s window, cepstra then averaged. Windows shorter than
#   1.5 s at the end of a bout are dropped (standard choice).
# - Shared and specific neurons (Methods, Shared and specific neurons). Per syllable type, spikes
#   linearly time-warped to the type's mean duration and a syllable-aligned histogram (1 ms bins,
#   smoothed over 20 bins); its peak between 30 ms before onset and 10 ms after offset; the peak
#   tested as for syllable locking. Specific when significant for one of the pair's two types,
#   shared when significant for both. The paper adjusted the interval by visual inspection where
#   one burst would otherwise be detected for two adjacent syllables; this cannot be repeated
#   exactly, and the author records each adjustment. OPEN: alignment to onset or offset; Fig. 3
#   uses onsets and Fig. 4 offsets ("Time from syllable offset"), and the Methods allow both
#   ("syllable onset- or offset-aligned histograms"); each pair uses the alignment its figure
#   shows, the other as a variant.
# - Statistics. All tests two-sided, P < 0.05 significant; Fisher's exact test replaces chi-square
#   when an expected count is below 5 (Methods, Statistics). For the 2 x 2 shared/specific tests
#   the printed P values (0.03 for bird 1, 5 x 10-4 for bird 2) are those of Pearson's
#   chi-square without continuity correction on the counts the paper gives (0.031 and 0.0005;
#   with Yates' correction 0.049 and 0.0012), so that variant is used.
