# Claims for Pelot, Goldhagen, Cariello, Musselman, Clissold, Ezzell & Grill (2020), "Quantified
# Morphology of the Cervical and Subdiaphragmatic Vagus Nerves of Human, Pig, and Rat", Front.
# Neurosci. 14, 601479, on SPARC:60, SPARC:64, SPARC:65, SPARC:89, SPARC:16, SPARC:61 and
# SPARC:82.
#
# Provenance: written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub
# Actions"), 2026-11-20, protocol pilot-18 as stated in docs/protocol.md (Reader, steps 1 to 4).
# It revises the file of 2026-11-18 (protocol pilot-16), which was read for SPARC:60 alone.
#
# Text read: the version of record, from Europe PMC (PMC7672126, JATS XML flattened;
# paper/10.3389-fnins.2020.601479.txt), the abstract, Introduction, Materials and Methods,
# Results, figure legends and Discussion. No PDF was supplied, so no figure was read; Figures
# 6, 7 and 9 are known here only from their legends and the Results. Three parts are missing
# from the text read. (1) Eqs. 1 to 4, the perineurium thickness fits, were dropped in the
# flattening; only their R2 values and fascicle counts survive, so the fit form and
# coefficients are open. (2) The supplement (Supplements 1 to 6, Supplementary Tables 1 to 6
# and Supplementary Figures 13 to 18) is not under paper/. The paper's own numbers are all in
# the main text; Supplement 4 (literature values) and Supplement 6 (age trends) are what three
# claims rest on. (3) The reference list is empty, so the dataset identifiers of Pelot et al.
# (2020a to g) are not in the text read; the mapping below is read from the dataset titles
# and the legends that cite each one.
#
# Code read: none. The paper links no code repository. The Methods name the tools:
# NIS-Elements Ar v5.02.01 for segmentation, MATLAB R2018b (bwboundaries, polyarea, fit with
# linear least squares) for morphometry and fits, JMP Pro 14.3.0 for the mixed model ANOVAs
# and Tukey's HSD. Where a criterion takes a JMP default, it says so as the software's choice.
#
# The datasets (titles and descriptions on the SPARC Portal), with the citation each most
# likely is.
# - sparc-60, "Quantified morphology of the rat vagus nerve": binary traces of the MT cross
#   sections of cervical and subdiaphragmatic rat VNs, with nerve and fascicle diameters,
#   fascicle numbers and perineurium thickness. Pelot et al. (2020g), cited with the rat
#   segmentations (Figures 5, 6 and 9 legends).
# - sparc-16, "Rat vagus nerve stained with Masson's trichrome": micrographs of cervical and
#   abdominal rat VN. Pelot et al. (2020e), cited with the rat micrographs (Figure 5 legend;
#   Results, paragraph 7).
# - sparc-65, "Quantified morphology of the human vagus nerve with anti-claudin-1": IHC
#   micrographs and traces. Pelot et al. (2020a) (Figure 2 legend).
# - sparc-61, "Human vagus nerve stained with Masson's trichrome": micrographs. By elimination,
#   Pelot et al. (2020c), which no legend cites; Supplement 3 shows these sections.
# - sparc-64, "Quantified morphology of the pig vagus nerve": traces of the MT cross sections
#   (nerve and inner perineurium, no perineurium). Pelot et al. (2020f) (Figures 3 and 6).
# - sparc-82, "Pig vagus nerve stained with Masson's trichrome": micrographs. Pelot et al.
#   (2020d) (Figure 3 legend).
# - sparc-89, "Quantified morphology of the pig vagus nerve with anti-fibronectin": IF
#   micrographs and traces with perineurium. Pelot et al. (2020b) (Figures 4, 6 and 9).
# Every claim lists under `datasets` those it rests on. Claims needing the literature values of
# Supplement 4 are `with_inputs`; the Sunderland and Bradley (1952) reanalysis rests on none of
# the datasets and is `elsewhere`.
#
# Data the paper used (Materials and Methods).
# - Collected. Human: 37 cervical and 32 subdiaphragmatic samples from 30 embalmed cadavers
#   (15M/15F, 54 to 90+ years, 63 +/- 12 kg, 168 +/- 10 cm). Pig: 21 cervical and 24
#   subdiaphragmatic samples from 12 Yorkshire pigs (3M/9F, 10.5 to 15 weeks, 33 +/- 8 kg),
#   fresh. Rat: 18 cervical and 9 subdiaphragmatic samples from 10 Sprague-Dawley rats (5M/5F,
#   75 to 268 days, 381 +/- 118 g), perfused with PBS and 4% paraformaldehyde; each rat
#   subdiaphragmatic sample is the esophagus with both trunks; R18's was unusual and R26 was
#   collected in its place. All post-fixed 2 to 8 days in 4% paraformaldehyde, paraffin, 5 um
#   sections, MT stain for all (Supplement 3). Subject and sample metadata are in Supplement 1
#   and Supplementary Tables 4 to 6 (not read).
# - Analysed. Nine left cervical and nine anterior subdiaphragmatic samples per species. Human,
#   anti-claudin-1 IHC, 4F/5M at each level, chosen at random within sex after excluding known
#   neuropathies. Pig, MT, all left cervical (6F/3M), all male anterior subdiaphragmatic (3M)
#   and six of nine female ones at random (6F); also four cervical (2F/2M) and four
#   subdiaphragmatic (2F/2M) pig samples with anti-fibronectin IF, chosen for contrast. Rat,
#   MT, all left cervical (4F/5M) and anterior subdiaphragmatic (4F/5M) samples.
# - Segmentation. Rat by hand: cervical, the vagus is the largest nerve in the carotid sheath;
#   subdiaphragmatic, the largest fascicle on the anterior esophagus, plus smaller fascicles
#   within about twice its diameter from its edge and a nerve boundary at the dense to loose
#   connective tissue transition; all statistics use the largest fascicle only, its outer
#   perineurium boundary as the nerve boundary. Human IHC, pig MT and pig IF by NIS-Elements
#   General Analysis, then hand edits; pig MT gives the inner perineurium boundary only.
# - Measures (Methods, Imaging and Image Analysis, last paragraph). Boundaries by bwboundaries;
#   area by polyarea; effective diameter, that of the circle of equal area, for nerve and
#   fascicles; fascicle diameter from the inner perineurium boundary; perineurium thickness,
#   half the difference of the effective diameters of the outer and inner perineurium
#   boundaries. Epineurium area is nerve area minus endoneurium and perineurium areas (Figure 7
#   legend). Fascicle counts count inner perineurium traces (Figure 6 legend). Perineurium fits
#   leave out peanut fascicles (Figure 9 legend).
# - Statistics (Methods, Statistics and Data Analyses). SDs throughout. Mixed model ANOVAs in
#   JMP with fixed effects species and level and a random effect of subject; for fascicle
#   diameter, log10 of the data and a further random effect of sample; Tukey's HSD post hoc.
#   Number of fascicles excludes rats. Perineurium fits by MATLAB fit, linear least squares.
#
# Inconsistencies in the paper, noted for the author. The Discussion gives the rat ratio of
# mean subdiaphragmatic to cervical nerve diameter as 0.68, but the Results' means (0.135 and
# 0.260 mm) give 0.52; the human (0.89 against 0.87) and pig (0.73 against 0.75) ratios agree
# with their means. The Discussion gives the rat weight as 381 +/- 38 g (SEM), the Methods 381
# +/- 118 g (SD); these agree for n = 10. Twelve pigs, with one cervical side missing in two,
# would give 22 cervical samples; the Methods say 21.
#
# Details the paper leaves open, each named in the criteria with the readings it allows. The
# JMP mixed model settings: REML is JMP's method for random effects and Kenward-Roger its
# denominator degrees of freedom; whether variance components are bounded at zero is read both
# ways (JMP's Fit Model default is unbounded). Whether Tukey contrasts with one printed p for
# both levels are main-effect or per-level contrasts. The form of the perineurium fits (Eqs. 1
# to 3 missing) and which rat fascicles enter them. How "for a given fascicle diameter",
# "approximately ten times", "clearest", "more consistent", "oblong", "many" and "similar" are
# measured. Which rat subdiaphragmatic tissue enters the Discussion's ratios. The test, if any,
# behind "did not suggest a difference" between levels and behind the absence of age trends.
#
# Changes from the file of 2026-11-18. The paper is now tested on seven datasets, so claims on
# human and pig data rest on SPARC:64, 65 and 89 (`data: dataset` with `datasets`), no longer
# `elsewhere` or `with_inputs`; the literature comparisons stay `with_inputs` (Supplement 4)
# and the Sunderland reanalysis `elsewhere`. Link claims are added for the human, pig MT and
# pig IF sample sets and for the three MT micrograph collections (SPARC:16, 61, 82). Claims
# are added for the shape and epineurium of pig and human nerves, the pig cervical fascicles
# with cell bodies, and the lower pig IF endoneurial proportion. The JMP settings are named as
# readings in the mixed model criteria. rat-carotid-sheath-bundles no longer contradicts
# itself: it is tested on the cervical micrographs of SPARC:16, with the counting rule named
# as open. The check of 2026-11-18 applied to the earlier file and is not carried over; its
# changes are kept.
schema_version: 2
paper: doi:10.3389/fnins.2020.601479
claims:
- id: rat-sample-set
  kind: link
  statement: The rat traces hold the rat samples the paper analysed, segmentations of nine left
    cervical and nine anterior subdiaphragmatic vagus nerve samples from Sprague-Dawley rats, 4F
    and 5M at each level, from 10 rats (5M/5F).
  source: Materials and Methods, Sample Collections, paragraph 1, and Imaging and Image Analysis,
    paragraph 2
  quote: We analyzed all left cervical (4F/5M) and anterior subdiaphragmatic (4F/5M) rat VN
    samples.
  datasets:
  - sparc-60
  criterion: Reproduced when the dataset holds segmentations of nine cervical and nine
    subdiaphragmatic rat samples whose subjects are 4F and 5M at each level, drawn from no more
    than 10 rats, with subject metadata consistent with the Methods (Sprague-Dawley, 75 to 268
    days, 381 +/- 118 g over the 10 rats). Partially reproduced when the sample counts match
    but the metadata differ; not reproduced when the sample counts differ. Extra samples (the
    right cervical and posterior samples, R18) are reported, not counted against the link.
- id: human-sample-set
  kind: link
  statement: The human anti-claudin-1 data hold the human samples the paper analysed, nine left
    cervical and nine anterior subdiaphragmatic samples, 4F and 5M at each level.
  source: Materials and Methods, Imaging and Image Analysis, paragraph 2
  quote: After excluding human subjects with known neuropathies ( Supplementary Table 1 ), within
    each sex, we randomly selected left cervical (4F/5M) and anterior subdiaphragmatic (4F/5M)
    human samples for further analysis.
  datasets:
  - sparc-65
  criterion: Reproduced when the dataset holds anti-claudin-1 micrographs and segmentations
    (nerve, outer and inner perineurium) of nine cervical and nine subdiaphragmatic human
    samples, 4F and 5M at each level, including the samples Figure 2 names (C47-2, C54-3,
    C55-3, C56-3, C63-1, and C57-3 of Figure 8). Partially reproduced when the counts match but
    the sexes or named samples do not; not reproduced when the counts differ.
- id: pig-mt-sample-set
  kind: link
  statement: The pig MT traces hold the pig samples the paper analysed, nine left cervical
    (6F/3M) and nine anterior subdiaphragmatic (6F/3M) samples, segmented for nerve and inner
    perineurium boundaries.
  source: Materials and Methods, Imaging and Image Analysis, paragraphs 2 and 5
  quote: We analyzed all left cervical VN samples from pigs (6F/3M), as well as all anterior
    subdiaphragmatic samples from male pigs (3M); we randomly chose six of the nine anterior
    subdiaphragmatic samples from female pigs (6F).
  datasets:
  - sparc-64
  criterion: Reproduced when the dataset holds segmentations of nine cervical and nine
    subdiaphragmatic pig samples, 6F and 3M at each level, from no more than 12 pigs, including
    P11-1 and P13-1 (Figure 3 legend). Partially reproduced when the counts match but the sexes
    do not; not reproduced when the counts differ.
- id: pig-if-sample-set
  kind: link
  statement: The pig anti-fibronectin data hold four cervical (2F/2M) and four subdiaphragmatic
    (2F/2M) pig samples segmented for nerve, outer and inner perineurium boundaries.
  source: Materials and Methods, Imaging and Image Analysis, paragraph 2
  quote: We also quantified the morphology for four cervical (2F/2M) and four subdiaphragmatic
    (2F/2M) pig samples using anti-fibronectin IF
  datasets:
  - sparc-89
  criterion: Reproduced when the dataset holds IF micrographs and segmentations of four
    cervical and four subdiaphragmatic pig samples, 2F and 2M at each level, each among the 18
    pig MT samples (Methods; P12-1 is named in Figure 8). Partially reproduced when the counts
    match but the sexes or the overlap with the MT samples do not.
- id: mt-micrograph-collections
  kind: link
  statement: The MT micrograph collections hold cross sections of the samples collected, 37
    cervical and 32 subdiaphragmatic human samples from 30 subjects, 21 cervical and 24
    subdiaphragmatic pig samples from 12 pigs, and 18 cervical and 9 subdiaphragmatic rat
    samples from 10 rats.
  source: Materials and Methods, Sample Collections, paragraph 1; Results, paragraph 1
  quote: we collected 37 cervical and 32 subdiaphragmatic human samples ( n = 30 subjects, 15M/15F
    ... 21 cervical and 24 subdiaphragmatic pig samples ( n = 12 pigs, 3M/9F ... and 18 cervical
    and 9 subdiaphragmatic rat samples ( n = 10 rats, 5M/5F
  datasets:
  - sparc-61
  - sparc-82
  - sparc-16
  criterion: Per species, the number of MT micrographs (one per sample, Methods, "we selected
    the best of the stained sections") by level and the number of subjects. Reproduced when
    every count matches; partially reproduced when the counts of one species differ (the pig
    cervical count is 21 in the Methods but 22 by its own description of missing sides, so 21
    and 22 both match). Each collection includes the analysed samples of its species.
- id: nerve-diameter-anova
  statement: Effective nerve diameter differs across species and across nerve levels, with no
    detected interaction of species and level.
  source: Results, paragraph 3
  quote: The nerve diameter differed across species ( p < 0.0001; F = 577.1) and nerve levels ( p
    = 0.0030; F = 11.01), but we did not detect an interaction of species and level ( p = 0.1085;
    F = 2.445).
  statistics:
  - about: species
    test: mixed model ANOVA
    statistic: F = 577.1
    p: 0.0001
    p_relation: "<"
    n: 9 cervical and 9 subdiaphragmatic samples per species (human, pig MT, rat)
  - about: nerve level
    test: mixed model ANOVA
    statistic: F = 11.01
    p: 0.003
  - about: species by level interaction
    test: mixed model ANOVA
    statistic: F = 2.445
    p: 0.1085
  datasets:
  - sparc-60
  - sparc-65
  - sparc-64
  depends_on:
  - rat-nerve-diameter
  criterion: As in the Methods (Statistics and Data Analyses), a mixed model ANOVA of effective
    nerve diameter with fixed effects species, level and their interaction (the Results report
    the interaction) and a random effect of subject, on the 54 samples (rat sparc-60, human
    sparc-65, pig MT sparc-64). The JMP settings the paper does not state are taken from JMP,
    the software it names, REML with Kenward-Roger degrees of freedom; whether the variance
    component is bounded at zero is open and could change the interaction test, so both
    readings are run, (a) unbounded (JMP Fit Model default), (b) bounded at zero. Reproduced
    when species and level have p < 0.05 and the interaction has p >= 0.05 (the absence judged
    on this test) under a reading; partially reproduced when species and level hold but the
    interaction is significant. The F values are reported against the paper's.
- id: human-pig-nerve-diameter-similar
  statement: Human and pig vagus nerves have similar effective diameters, 1.9 +/- 0.5 against
    2.2 +/- 0.2 mm cervically and 1.7 +/- 0.3 against 1.6 +/- 0.2 mm subdiaphragmatically, with
    no significant difference by Tukey's test.
  source: Results, paragraph 3
  quote: The human and pig nerves had similar effective diameters (1.9 ± 0.5 vs. 2.2 ± 0.2 mm at
    the cervical level and 1.7 ± 0.3 vs. 1.6 ± 0.2 mm at the subdiaphragmatic level; p = 0.1830,
    Tukey's test)
  statistics:
  - test: Tukey's test
    p: 0.183
    n: 9 human and 9 pig samples per level
  datasets:
  - sparc-65
  - sparc-64
  depends_on:
  - nerve-diameter-anova
  expected:
  - quantity: human cervical effective nerve diameter, mean
    value: 1.9
    tolerance: 0.5
    unit: mm
  - quantity: pig cervical effective nerve diameter, mean
    value: 2.2
    tolerance: 0.2
    unit: mm
  - quantity: human subdiaphragmatic effective nerve diameter, mean
    value: 1.7
    tolerance: 0.3
    unit: mm
  - quantity: pig subdiaphragmatic effective nerve diameter, mean
    value: 1.6
    tolerance: 0.2
    unit: mm
  criterion: A claim of absence, judged on the paper's test, Tukey's HSD after the model of
    nerve-diameter-anova. Human nerve diameter from the inner nerve trace where Figure 2 shows
    two (C47-2, C54-3, C55-3, C63-1; Figure 2 legend). Reproduced when the means are within the
    stated SDs and the human against pig comparison has p >= 0.05. The paper prints one p for
    both levels and the model has no detected interaction, so the test is read as the species
    main-effect contrast human against pig; human against pig at each level in the species by
    level Tukey is shown as a variant. The effect size is reported either way.
- id: rat-nerve-diameter
  statement: Rat vagus nerves have effective diameters of 0.260 +/- 0.025 mm at the cervical
    level and 0.135 +/- 0.015 mm at the subdiaphragmatic level.
  source: Results, paragraph 3
  quote: the rat nerves were approximately ten times smaller (0.260 ± 0.025 mm at the cervical
    level and 0.135 ± 0.015 mm at the subdiaphragmatic level
  datasets:
  - sparc-60
  expected:
  - quantity: rat cervical effective nerve diameter, mean over 9 samples
    value: 0.26
    tolerance: 0.025
    unit: mm
  - quantity: rat cervical effective nerve diameter, SD
    value: 0.025
    tolerance: 0.0025
    unit: mm
  - quantity: rat subdiaphragmatic effective nerve diameter, mean over 9 samples
    value: 0.135
    tolerance: 0.015
    unit: mm
  - quantity: rat subdiaphragmatic effective nerve diameter, SD
    value: 0.015
    tolerance: 0.0015
    unit: mm
  criterion: Effective diameter is the diameter of the circle of the area within the traced
    boundary (bwboundaries and polyarea, Methods). Cervical, the nerve boundary of the vagus;
    subdiaphragmatic, the outer perineurium boundary of the largest fascicle, as the Methods fix
    for all statistics ("largest" read as the largest outer perineurium area, the boundary used;
    the inner area is shown if it picks another fascicle). Mean tolerances are the paper's SDs;
    SD tolerances are 10%. Reproduced when both means are within tolerance; the SDs are judged
    too (partially reproduced when only the means hold). The connective tissue boundary of the
    three multifascicular samples is shown as a variant.
- id: rat-ten-times-smaller
  statement: Rat vagus nerves are about ten times smaller in diameter than human and pig nerves,
    significantly smaller than each of the two larger species.
  source: Results, paragraph 3; Discussion, paragraph 3
  quote: while the rat nerves were approximately ten times smaller (0.260 ± 0.025 mm at the
    cervical level and 0.135 ± 0.015 mm at the subdiaphragmatic level; p < 0.0001, for both
    comparisons of rat to larger species)
  statistics:
  - test: Tukey's test
    p: 0.0001
    p_relation: "<"
    n: 9 samples per species and level
  datasets:
  - sparc-60
  - sparc-65
  - sparc-64
  depends_on:
  - nerve-diameter-anova
  criterion: Tukey's HSD after the model of nerve-diameter-anova. The paper's "both comparisons
    of rat to larger species" are rat against human and rat against pig, one p for both
    levels, read as the species main-effect contrasts; the same contrasts at each level are
    shown as a variant. The paper gives no bound for "approximately ten times"; its own means
    give larger-species over rat ratios of 7.3 to 12.6, and the claim reads it as a ratio
    between 5 and 20 at each level (a choice of this file, on which that part rests).
    Reproduced when rat against human and rat against pig both have p < 0.0001 with rat
    smaller and the ratios fall in that range; partially reproduced when p < 0.05 but not
    below 0.0001.
- id: nerve-cervical-larger
  statement: Cervical vagus nerves are larger than subdiaphragmatic nerves, a trend clearest in
    pigs and rats.
  source: Results, paragraph 3
  quote: The cervical nerves were significantly larger than the subdiaphragmatic nerves;
    qualitatively, this trend was clearest for the pig and rat nerves.
  statistics:
  - test: mixed model ANOVA, level effect
    statistic: F = 11.01
    p: 0.003
  datasets:
  - sparc-60
  - sparc-65
  - sparc-64
  depends_on:
  - nerve-diameter-anova
  criterion: Reproduced when the level effect of nerve-diameter-anova has p < 0.05 with the
    cervical least squares mean larger, and the pig and rat level differences are clearer than
    the human one. The paper judges "clearest" qualitatively and names no measure; readings
    (a) the relative difference of means (cervical minus subdiaphragmatic over cervical) is
    larger for pig and for rat than for human; (b) the per-species difference of means over
    the pooled SD is larger for pig and for rat than for human. That part holds under either
    reading and rests on an assumption. The rat part alone is reported apart.
