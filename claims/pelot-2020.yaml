    (as MATLAB fit, the paper's tool, reports them) overlap between levels; (b) an F-test of a
    level term (intercept and slope by level) in the pooled linear model at p < 0.05. Reproduced
    when no species shows a difference under reading (a); reading (b) is shown as a variant,
    and any species where the two disagree is recorded. Both tests are choices of this file,
    as the paper's "did not suggest" names none, so the outcome rests on an assumption.
- id: sunderland-reanalysis
  statement: Refitting all 777 fascicles of Sunderland and Bradley (1952) gives a zero-intercept
    slope of 2.75% of fascicle diameter for perineurium thickness, with R2 = 0.51.
  source: Results, paragraphs 13 and 14 (Eq. 4); Discussion, paragraph 7; Figure 9C and 9D
  quote: We re-analyzed the original ( Sunderland and Bradley, 1952 ) data, including all 777
    fascicles ... and identified the slope of the best-fit line with zero intercept as 2.75% ( R 2
    = 0.51)
  data: elsewhere
  where: Sunderland and Bradley (1952), the published human somatic nerve fascicle measurements;
    no archive identifier
  expected:
  - quantity: slope of zero-intercept fit, perineurium thickness over fascicle diameter
    value: 2.75
    tolerance: 0.275
    unit: "%"
  - quantity: R2 of the fit
    value: 0.51
    tolerance: 0.051
  - quantity: fascicles fitted
    value: 777
    tolerance: 0
  criterion: Linear least squares with forced zero intercept (Results, before Eq. 4) on all 777
    fascicles. How R2 is computed for a zero-intercept fit is open; readings (a) about the mean
    of the data (MATLAB fit's R2), (b) uncentred. The claim holds under either.
- id: rat-perineurium-near-3-percent
  statement: Rat perineurium thickness is close to the published 3% of fascicle diameter,
    slightly thicker for smaller fascicles and thinner for larger ones.
  source: Discussion, paragraph 7; Figure 9A and 9B
  quote: While we found that the rat perineurium thickness was similar to this published
    relationship, albeit slightly thicker for smaller fascicle diameters and thinner for larger
    fascicle diameters
  datasets:
  - sparc-60
  depends_on:
  - rat-perineurium-fit
  criterion: The comparison line is thickness = 3% of fascicle diameter (Figure 9 legend,
    Grinberg et al., 2008); "this published relationship" can also be read as the 2.75% slope
    of the re-analysis, so both are run. With the rat fit of rat-perineurium-fit, reproduced
    when the fitted thickness over thickness of the reference line is between 0.5 and 2 across
    the rat diameter range (similar, read as within a factor of two, a choice of this file on
    which the outcome rests), and the fit lies above the line at the smallest rat diameter and
    below it at the largest (one crossing). Partially reproduced when the rat data are within
    the factor but do not cross the line.
- id: human-pig-perineurium-thicker
  statement: Human and pig vagal perineurium is substantially thicker than the 3% of fascicle
    diameter found for human somatic nerves, especially for smaller fascicles.
  source: Discussion, paragraph 7; Figure 9B
  quote: the human and pig perineurium was substantially thicker, especially for smaller fascicles
    ( Figure 9B )
  datasets:
  - sparc-65
  - sparc-89
  criterion: For non-peanut fascicles (Figure 9 legend), the ratio of thickness to diameter
    against the 3% line of Figure 9. The paper judges this from Figure 9B and names no
    measure; this file reads it as follows, and the outcome rests on that reading. Reproduced
    when, for both species, the median ratio exceeds 0.03 and the median excess over 0.03 is
    larger for fascicles below the species' median diameter than above it.
- id: pig-if-mt-consistent
  statement: Pig fascicle diameters from anti-fibronectin IF (14 to 303 um, mean 123, median 123,
    interquartile range 91 to 155 um) are consistent with those from MT (5 to 399 um, mean 135,
    median 130, interquartile range 96 to 168 um).
  source: Results, paragraph 12
  quote: Note that the fascicle diameters for the pig anti-fibronectin IF ( Figures 9A,B ; 14 to
    303 μm, mean = 123 μm, median = 123 μm, interquartile range = 91 to 155 μm) are consistent
    with the MT data ( Figure 6 ; 5 to 399 μm, mean = 135 μm, median = 130 μm, interquartile
    range = 96 to 168 μm).
  datasets:
  - sparc-89
  - sparc-64
  expected:
  - quantity: pig IF fascicle diameter, mean
    value: 123
    tolerance: 12.3
    unit: um
  - quantity: pig IF fascicle diameter, median
    value: 123
    tolerance: 12.3
    unit: um
  - quantity: pig MT fascicle diameter, mean
    value: 135
    tolerance: 13.5
    unit: um
  - quantity: pig MT fascicle diameter, median
    value: 130
    tolerance: 13
    unit: um
  criterion: The IF values are over the 284 non-peanut fascicles of Figure 9A and B; the MT
    values over all inner perineurium traces of the 18 pig MT samples (Figure 6). Reproduced
    when the four values are within 10% and the ranges and interquartile ranges are within the
    reported ones widened by 10% of each bound. The quartile method is open and cannot move the
    values beyond the tolerance for samples of this size; MATLAB's prctile, the paper's tool,
    is used.
- id: peanut-fascicle-counts
  statement: Human IHC micrographs have 60 cervical inner perineurium traces (27 bundles in 10
    peanut fascicles) and 44 subdiaphragmatic (4 in 2); pig IF micrographs have 210 cervical (57
    in 25) and 179 subdiaphragmatic (48 in 19).
  source: Figure 9 legend
  quote: For the human anti-claudin-1 IHC micrographs, the cervical level had 60 fascicles total
    (inner perineurium traces) of which 27 were intrafascicular bundles in 10 peanut fascicles;
    the subdiaphragmatic level had 44 fascicles total (inner perineurium traces) of which 4 were
    intrafascicular bundles in 2 peanut fascicles.
  datasets:
  - sparc-65
  - sparc-89
  expected:
  - quantity: human cervical inner perineurium traces
    value: 60
    tolerance: 0
  - quantity: human subdiaphragmatic inner perineurium traces
    value: 44
    tolerance: 0
  - quantity: pig IF cervical inner perineurium traces
    value: 210
    tolerance: 0
  - quantity: pig IF subdiaphragmatic inner perineurium traces
    value: 179
    tolerance: 0
  criterion: Counts of traces, tolerance 0. A peanut fascicle is an outer perineurium trace
    holding more than one inner trace (Figure 2 legend). Reproduced when the four totals and
    the peanut counts (27 in 10, 4 in 2, 57 in 25, 48 in 19) match; partially reproduced when
    the totals match and a peanut count does not. Whether the non-peanut counts (60 - 27 + 44 -
    4 = 73 human; 210 - 57 + 179 - 48 = 284 pig) match the fit counts is reported.
- id: no-age-trend
  statement: The morphology metrics show no trend with age in any species.
  source: Discussion, paragraph 5 (Supplement 6)
  quote: Our morphology metrics did not show trends with age for any species ( Supplement 6 )
  datasets:
  - sparc-60
  - sparc-65
  - sparc-64
  criterion: A claim of absence whose test, if any, is in Supplement 6, which was not supplied.
    Ages are the subject metadata (Supplement 1; human ages above 89 recorded as 90+). Until
    Supplement 6 is read, the readings are (a) Pearson correlation of each per-sample metric
    (nerve diameter, number of fascicles, mean fascicle diameter, tissue proportions) with
    subject age at p < 0.05 per species and level; (b) the same with Spearman correlation.
    Reproduced when no metric shows a trend under reading (a), (b) shown as a variant; the
    claim rests on an assumption until Supplement 6 fixes the method and the metrics.
- id: rat-carotid-sheath-bundles
  statement: The rat cervical carotid sheath holds up to six fascicles, of which the largest,
    taken as the vagus, was segmented.
  source: Discussion, paragraph 6 (Supplementary Figure 16); Materials and Methods, Imaging and
    Image Analysis, paragraph 3
  quote: The rat cervical VN was identified as monofascicular in prior studies ( Fazan and Lachat,
    1997 ; Licursi de Alcântara et al., 2008 ), but we observed up to six fascicles within the
    carotid sheath ( Supplementary Figure 16 ).
  datasets:
  - sparc-16
  - sparc-60
  criterion: Tested on the rat cervical MT micrographs, which hold the whole carotid sheath
    (Methods, the rat cervical VN was excised with the common carotid artery), whether or not
    the other bundles are traced. The paper gives no rule for counting bundles and
    Supplementary Figure 16 was not read; a bundle is read as a nerve profile bounded by its
    own perineurium within the sheath, counted by eye, and the outcome rests on that reading.
    Readings of the sample set, (a) the nine analysed left cervical samples, (b) all 18
    cervical samples. Reproduced when, under a reading, the largest count is six, at least one
    sample has more than one bundle, and in each analysed sample the bundle traced as the vagus
    in sparc-60 is the largest. Partially reproduced when the largest count is five or seven.
