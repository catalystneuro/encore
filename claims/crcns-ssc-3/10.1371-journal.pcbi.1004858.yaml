# Claims for Timme, Ito, Myroshnychenko, Nigam, Shimono, Yeh, Hottowy, Litke & Beggs (2016),
# "High-Degree Neurons Feed Cortical Computations", PLoS Comput Biol 12(5), e1004858, on CRCNS ssc-3.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-06,
# protocol as stated in docs/protocol.md (version pilot-13), Reader steps 1 to 4.
#
# Text read: the version of record, PMC4861348 (Europe PMC full-text XML, flattened), with its
# Materials and Methods, Results, Discussion, the legends of Figures 1 to 7, Table 1 and the legend
# of S1 Fig (the only supplement; it is a figure, so only its legend is text). No PDF was supplied,
# so no figure could be read. The flattened text has lost every displayed equation (Eqs 1 to 24).
# The information measures (Eqs 1 to 12) are described in words well enough to be rebuilt, and
# each criterion says how it reads them. The feedforward model is not: the binary-signal currents
# (Eqs 16 to 19), the form of the rewiring score (Eq 20) and the fitted score equations (Eqs 22 to
# 24) are given only as equations. The model claims below need these equations read from the
# version of record before they can be tested. Values shown only in figures (the binomial skew
# probabilities of Fig 5A and 5B, the fitted exponents and their 95% ranges in Fig 6, the means in
# Fig 7C and 7D) could not be read and are not claimed as numbers.
#
# Code read: none. The paper links no analysis or model code. Its Data Availability names the
# deposit "http://dx.doi.org/10.6080/K07D2S2F" at CRCNS, which is ssc-3. The data descriptor
# (ssc-3 data description, version 0.8) was read only to know what the dataset holds; no claim
# comes from it.
#
# The data the paper used, as it reports them (Materials and Methods, Experimental System).
# Cortico-hippocampal organotypic slice cultures from postnatal day 6 C57BL/6 mouse pups, recorded
# after 2 to 4 weeks in vitro, spontaneous activity, no stimulation. A 512-electrode array (5 um
# flat electrodes, 60 um spacing, about 0.9 by 1.9 mm). Only cortical recordings were used: 25
# recordings of somatosensory cortex, about 60 min each. Spikes sorted by PCA over seven adjacent
# electrodes; duplicates and neurons with many refractory violations removed; neurons with fewer
# than 100 spikes in the 60 min removed. 7735 neurons in total, 309.4 per recording on average,
# mean rate 2.10 Hz, spike times at 50 us resolution. The measured variable is spike times only.
# The descriptor lists 25 recordings with spike times in ms (20 kHz), neuron positions and a
# recording ID; it matches the paper's description.
#
# Methods the analysis rests on, with what is open. Criteria below refer to these by label.
# M-TE. Transfer entropy from J to I, TE = MI(I_F; J_P | I_P), with spike trains binarized (each
#   bin spiking or not) and probabilities counted over the whole recording (Methods, Effective
#   Connectivity Detection, paragraphs 2 and 3). Normalized TE is TE divided by the entropy of the
#   receiver's future state, H(I_F) (same section, paragraph 3, and Multivariate Transfer Entropy
#   and Computation, paragraph 4). The paper used the TE networks of its reference [44] (Timme et
#   al. 2014, PLoS One 9, e115764) at two time scales, "1.6 to 6.4 ms and 3.5 to 14 ms" (paragraph
#   4), and says the complete TE procedure is in [44]. Open in this paper, with readings: the bin
#   and delays of each time scale, (a) bins of 1.6 ms and 3.5 ms with delays of 1 to 4 bins, the
#   reading the stated ranges imply, or (b) the bin sizes and delays [44] gives; how TE over the
#   delays of one time scale is combined, (c) the maximum over delays, (d) the sum over delays, or
#   the rule [44] gives. Past states are one bin, as the four-variable PID (past of three neurons,
#   future of one) implies.
# M-SIG. A connection is significant when fewer than 5 of 5000 jittered surrogates give a TE larger
#   than the real one (p < 0.001) (Effective Connectivity Detection, paragraph 5). Open, the jitter
#   width; readings, the width [44] gives, or, failing that, two widths an order of magnitude apart
#   around the time scale's longest delay, both reported.
# M-SUB. For each recording, 500 sub-networks of 50 neurons with average total degree 3 (so 75
#   connections) drawn from the full network (same paragraph, citing [44, 83]). Open, how they are
#   drawn; readings, (a) 50 neurons at random, then the 75 strongest significant connections among
#   them, (b) 50 neurons at random, then 75 of their significant connections at random; draws with
#   fewer than 75 significant connections among the 50 neurons are redrawn. Also open, whether the
#   degree and synergy analyses use these sub-networks or the full networks; readings, (s) the
#   sub-networks, degrees counted within each and the 500 pooled per recording, which the paper's
#   stated purpose (to reduce bias from degree and network size) supports, (f) the full network of
#   significant connections.
# M-PID. For every triple in which two neurons J and K both send significant connections to I, the
#   synergy of the multivariate TE {J,K} to I, by the Williams and Beer decomposition: redundancy is
#   I_min of J_P and K_P about I_F, conditioned on I_P, the unique terms are each bivariate TE minus
#   the redundancy, and synergy is TE({J,K} to I) minus the redundancy and both unique terms (Eqs 5
#   to 10, described in Multivariate Transfer Entropy and Computation, paragraphs 3 to 4), with the
#   same bins and delays as the TE, normalized by H(I_F). The conditioning of I_min on I_P is stated
#   in words; the form taken is the specific information of each source about each state of I_F
#   within each state of I_P, the minimum over sources, weighted by p(i_F, i_P).
# M-CORR. Per recording and time scale, the correlation between the synergy of each triple and
#   either the receiver's in-degree, or the out-degree of one transmitter, each of the two
#   transmitters of a triple being a separate data point (Results, Degree and Computation,
#   paragraph 1). Open, the correlation coefficient; readings, (p) Pearson, (r) Spearman. The
#   Fig 5 legend gives N data = 40 correlations per panel; with 25 recordings and two time scales
#   the paper does not say which 40. The count is reported, not tested.
schema_version: 2
dataset:
  archive: crcns
  id: ssc-3
  doi: 10.6080/K07D2S2F
paper: doi:10.1371/journal.pcbi.1004858
claims:
- id: data-recordings
  statement: The analysis used 25 recordings of somatosensory cortex cultures, with 7735 neurons in
    total after removing neurons with fewer than 100 spikes in the 60 min recording, an average of
    309.4 neurons per recording and an average firing rate of 2.10 Hz.
  source: Materials and Methods, Experimental System, paragraph 1
  quote: "only recordings from cortex were used in this analysis (number of recordings: 25 ... neurons
    with less than 100 spikes in the 60 minute recording (firing rate < 0.028 Hz) were removed from
    the analysis. Spike sorting yielded spike times for each neuron (7735 total neurons) with a
    resolution of 50 μs. The average firing rate for each neuron was 2.10 Hz and each recording had
    an average of 309.4 neurons"
  expected:
  - quantity: number of recordings
    value: 25
    tolerance: 2.5
  - quantity: neurons in total
    value: 7735
    tolerance: 773.5
  - quantity: neurons per recording, mean
    value: 309.4
    tolerance: 30.9
  - quantity: firing rate per neuron, mean over neurons
    value: 2.10
    tolerance: 0.21
    unit: Hz
  criterion: Counted from the dataset's spike times. The paper says the 100-spike threshold was
    applied; whether the deposited neurons already passed it is for the author to find, and the
    counts are reported both as deposited and after applying it. Open, how the rate is taken;
    readings (a) spikes over the recording length of each recording, (b) spikes over 60 min.
    Reproduced when all four values are within tolerance under one reading.
- id: fig4ac-te-lognormal
  statement: The significant TE connection weights, raw and normalized, are roughly log-normally
    distributed at both time scales and vary over several orders of magnitude.
  source: Results, Connection Weight and Degree Distributions, paragraphs 2 and 3; Figure 4A and 4C
  quote: Similar to these studies, we found a roughly log-normal distribution of significant TE
    weights ... both TE and normalized TE values varied broadly over several orders of magnitude
  criterion: TE and significance as in M-TE and M-SIG, on the full network of significant
    connections of each recording. Per time scale, raw and normalized TE binned into 100
    logarithmically spaced bins (Results, paragraph 3) and fit with a log-normal probability mass
    function with an extra normalization factor (Eq 21, not in the text read; the reading is a
    Gaussian in log TE times a factor alpha), by nonlinear least squares, per recording and on the
    average over recordings. The paper gives no goodness-of-fit threshold. Reading fixed here,
    reproduced when, for both time scales and both raw and normalized TE, the fit on the average
    distribution has R2 of at least 0.9 and the 1st and 99th percentiles of the significant TE
    values differ by at least a factor of 100 (two orders of magnitude); R2 and the spread are
    reported for every recording.
  depends_on:
  - data-recordings
- id: fig4bd-heavy-tailed-degree
  statement: The total degree distributions are heavy-tailed, with many more high-degree neurons
    than in random networks with the same numbers of neurons and connections.
  source: Results, Connection Weight and Degree Distributions, paragraph 4; Figure 4B and 4D
  quote: the degree distributions indicate that the real data contained many more high-degree neurons
    than would be expected in a random network
  criterion: Networks as in M-TE, M-SIG and M-SUB. Random networks made by placing binary
    connections with uniform probability among the same number of neurons with the same number of
    connections (paragraph 4), with the same sampling as the real data (Fig 4 legend), so under
    reading (s) one random network per sub-network. Distributions of total degree averaged over
    recordings, per time scale. The paper gives no measure of the tail. Reading fixed here,
    reproduced when, at both time scales, the fraction of neurons whose total degree exceeds the
    99.9th percentile of the random networks' total degree is at least 10 times 0.001 (and the
    largest real degree exceeds the largest random one). The fraction is reported for every
    reading of M-TE and M-SUB.
  depends_on:
  - data-recordings
- id: fig4bd-out-tail-longer
  statement: The in-degree distribution has a shorter tail than the out-degree distribution, so
    there are more high out-degree neurons than high in-degree neurons.
  source: Figure 4B and 4D legend
  quote: note that the in-degree distribution had a shorter tail than the out-degree distribution,
    indicating that there were more high out-degree neurons than there were high in-degree neurons
  criterion: Networks as in fig4bd-heavy-tailed-degree. The paper gives no measure of the tail.
    Reading fixed here, reproduced when, at both time scales, the 99th percentile of out-degree is
    larger than that of in-degree and the largest out-degree is larger than the largest in-degree,
    pooled over recordings; a one-sided Wilcoxon signed-rank test over recordings of the 99th
    percentiles is reported as well.
  depends_on:
  - fig4bd-heavy-tailed-degree
- id: fig5a-in-degree-uncorrelated
  statement: The correlation between a receiver's in-degree and the synergy (computation) it
    performs is centered near zero across recordings, with a slight negative skew; computation is
    independent of in-degree.
  source: Results, Degree and Computation, paragraph 1; Figure 5A
  quote: though significant positive and negative correlations between receiver in-degree and
    computation were found, the distribution of these correlation values for each recording was
    centered near zero with a slight negative skew
  criterion: Synergy as in M-PID on the networks of M-TE, M-SIG and M-SUB; correlations as in
    M-CORR, one per recording and time scale. A claim of absence, judged on the paper's test, the
    count of positive against negative correlations under a binomial with p = 0.5, as the
    probability of a skew of that size or larger (Fig 5A legend). The paper names no alpha; 0.05
    is the reading. Reproduced when that test is not significant; partially reproduced when the
    skew is significantly negative (the paper's slight negative skew, but not independence); not
    reproduced when it is significantly positive. The median correlation and the counts are
    reported under every reading.
  depends_on:
  - data-recordings
- id: fig5b-out-degree-positive
  statement: Most recordings show a positive correlation between a transmitter's out-degree and the
    synergy computed by its receivers.
  source: Results, Degree and Computation, paragraph 1; Figure 5B
  quote: the majority of recordings exhibited positive correlations between transmitter out-degree
    and computation
  criterion: As fig5a-in-degree-uncorrelated, with the transmitter's out-degree. Reproduced when
    more than half of the correlations are positive and the binomial probability of that many
    positives or more under p = 0.5 is below 0.05 (alpha a reading; the paper names none), at
    each time scale separately and over both pooled. Partially reproduced when a majority is
    positive but not significant.
  depends_on:
  - data-recordings
- id: fig5ab-correlations-beyond-null
  statement: Nearly all the per-recording degree and synergy correlations lie beyond a null of
    randomized degree and computation pairings, whose correlations sit near zero.
  source: Figure 5A and 5B legend
  quote: Nearly all correlations were likely to be significant given the proximity of the null model
    correlations (no correlation) to zero (null model consisted of randomized degree/computation
    pairings) (N null = 400)
  criterion: For each correlation of fig5a-in-degree-uncorrelated and fig5b-out-degree-positive,
    null correlations from random permutations of degree against synergy within the same
    recording and time scale. N null = 400 against N data = 40 gives 10 permutations per
    correlation, the reading taken. The paper gives no rule for significance. Reading fixed here,
    a correlation is beyond the null when its absolute value exceeds the 99th percentile of the
    absolute null correlations pooled over all 400; reproduced when at least 90% of correlations
    in each panel are beyond the null.
  depends_on:
  - fig5a-in-degree-uncorrelated
  - fig5b-out-degree-positive
- id: fig5cd-pooled-trends
  statement: Pooled over all neuron groups and recordings, synergy shows no trend with receiver
    in-degree and rises with transmitter out-degree, at both time scales.
  source: Results, Degree and Computation, paragraph 1; Figure 5C and 5D
  quote: These trends were also observed in distributions of all neuron groups combined across all
    recordings for the two time scales of interest
  criterion: Synergy values of all triples pooled over recordings, grouped by degree, with only
    degrees having 20 or more neuron groups kept (Fig 5 legend), the median per degree. The
    paper gives no test. Reading fixed here, Spearman correlation of the per-degree medians with
    degree; reproduced when, at both time scales, it is positive with p < 0.05 for out-degree and
    is not significantly positive for in-degree.
  depends_on:
  - fig5a-in-degree-uncorrelated
  - fig5b-out-degree-positive
- id: fig6-information-gain-not-rising
  statement: The information gained by adding inputs to a neuron, a bound on its highest-order
    synergy, stays constant or decreases with the number of inputs at both time scales; exponential
    fits to the medians give small negative exponents, one with a 95% range overlapping zero.
  source: Results, Degree and Computation, paragraph 2; Figure 6
  quote: we found that the information gain remained constant or decreased with added number of
    inputs ... Both fits produced small negative exponent values, one of which had an error
    overlapping zero
  criterion: Information gain (Eq 12, not in the text read) read from Methods, Multivariate Transfer
    Entropy and Computation, last two paragraphs, as the TE from all n inputs jointly to I minus
    the TE from n - 1 of them, averaged over the n choices of the input left out, normalized by
    H(I_F) as the other terms are. For each receiver and n, all combinations of n of its inputs or
    100 sampled combinations, whichever is smaller, averaged per neuron; n up to 6. Open, the
    first n; readings (a) n from 2 to 6, (b) n from 1 to 6. Network readings as in M-TE, M-SIG and
    M-SUB. Medians over neurons, pooled over recordings, fit with A exp(k n) by nonlinear least
    squares with a 95% confidence interval for k (Fig 6 legend). Reproduced when, at both time
    scales, the interval for k does not lie wholly above zero and k is negative at at least one;
    not reproduced when either time scale has an interval wholly above zero.
  depends_on:
  - data-recordings
- id: table1-pid-examples
  statement: On the example distributions of Table 1, the PID multivariate TE finds synergy only in
    the synergistic and the synergistic and redundant examples; mutual information misses the
    hidden self interaction, and interaction information misses simultaneous synergy and
    redundancy and unique information.
  source: Materials and Methods, Multivariate Transfer Entropy and Computation, paragraphs 5 and 6;
    Figure 2 and Table 1
  quote: Synergy is only found in the Synergistic Interaction example and the Synergistic and
    Redundant Interaction example
  criterion: A computation on the joint distributions printed in Table 1, using no recorded data.
    PID terms as in M-PID, MI as Eq 1 and interaction information II(J_P; K_P; I_F) as the
    standard difference of conditional and unconditional mutual informations (Eq 11, not in the
    text read). Reproduced when synergy is above 1e-6 bits in exactly those two examples, MI(J_P;
    I_F) is zero for the hidden self interaction, and II is zero for the synergistic and redundant
    and for the single and redundant examples while their synergy, respectively unique
    information, is not.
- id: fig7c-degree-modified-rule-matches
  statement: In a two-layer feedforward model, degree-modified and firing-rate-modified Hebbian
    rewiring rules qualitatively reproduce the degree and synergy correlations of the real data,
    the degree-modified rule more closely, while a pure Hebbian rule and random wiring do not.
  source: Results, Feedforward Network Model, paragraph 3; Figure 7C
  quote: Both the degree-modified and firing rate modified Hebbian rules qualitatively matched the
    degree vs. computation correlation results seen in the real data ... The degree-modified rule
    was closer than the firing rate modified rule ... the purely Hebbian rule and the random network
    produced correlation results that were qualitatively very different from the real data
  criterion: A simulation with the parameters of Materials and Methods, Feedforward Network Model
    (20 binary neurons per layer; firing probability a sigmoid of input current with alpha about
    0.023 and beta about 4.6, read as p = 1 / (1 + exp(beta - alpha I)), which gives rare firing
    at I = 0 and p = 0.5 at I = I_con N_Neurons = 200; I_con = 10; 80 connections; rewiring by
    500 runs of statistics then one swap, repeated 80 times; 100 models per type). The currents
    from the binary signal (Eqs 16 to 19), the form of the score (Eq 20) and the fitted scores
    (Eqs 22 and 23) are not in the text read and must be taken from the version of record's
    equations before analysis. Degree and synergy correlations of the models computed as in
    M-PID and M-CORR on the model's states. Fig 7C shows means and standard deviations; reading
    fixed here, a model type matches when its mean in-degree and mean out-degree correlations
    both lie within the real data's mean plus or minus one standard deviation. Reproduced when the
    degree-modified and firing-rate-modified types match, the degree-modified mean is nearer the
    real means (Euclidean distance over the two correlations), and the Hebbian and random types
    do not match.
  depends_on:
  - fig5a-in-degree-uncorrelated
  - fig5b-out-degree-positive
- id: fig7b-connectivity-patterns
  statement: The pure Hebbian rule pools connections among the input neurons most correlated with
    the network-wide signal, the firing-rate-modified rule spreads them to less correlated input
    neurons, and the degree-modified rule spreads them almost uniformly across the input layer.
  source: Results, Feedforward Network Model, paragraph 2; Figure 7B
  quote: As expected, the purely Hebbian rule pooled connections between the most strongly correlated
    neurons ... The firing rate modified rule spread connections more broadly to input layer neurons
    less well correlated with the binary network-wide signal. Finally, the degree-modified rule ...
    spread connectivity almost uniformly across the input layer
  criterion: The models of fig7c-degree-modified-rule-matches, connection probabilities averaged
    over 100 models. The paper gives no measure. Reading fixed here, the fraction of connections
    leaving the upper half of input-layer indices (the neurons more correlated with the binary
    signal); reproduced when it is ordered Hebbian above firing-rate-modified above
    degree-modified, and the degree-modified fraction is within 0.5 plus or minus 0.1.
  depends_on:
  - fig7c-degree-modified-rule-matches
- id: fig7d-degree-rule-highest-conditioned-mi
  statement: The pure Hebbian rule gives the highest mutual information between connected neurons,
    but conditioned on the network-wide binary signal the degree-modified rule gives the highest;
    it alone raises neuron-to-neuron communication while also reinforcing network-wide
    correlation.
  source: Results, Feedforward Network Model, paragraph 4; Figure 7D and 7E
  quote: Unsurprisingly, we found the largest mutual information in the purely Hebbian rule ...
    when we conditioned the mutual information on the binary network-wide correlation signal, we
    found that the degree-modified Hebbian rule produced the highest mutual information
  statistics:
  - test: Mann-Whitney rank-sum test
    p: 0.001
    p_relation: "<"
    corrected: False Discovery Rate
    n: 100 models per rule
  criterion: The models of fig7c-degree-modified-rule-matches. Per model, the mean over connections
    of MI between the input and output neuron's states (Eq 1) and of MI conditioned on b(t). Open,
    the number of runs MI is estimated from; reading, a fresh set of runs at least as large as
    the 500 used for rewiring, with the count reported. Pairs of rules compared by two-sided
    Mann-Whitney tests across the 100 models with Benjamini-Hochberg FDR control (Fig 7D legend).
    Reproduced when the Hebbian rule has the highest unconditioned MI and the degree-modified rule
    the highest conditioned MI, each significant against every other rule at corrected p < 0.001,
    and the degree-modified rule's conditioned MI is above the random model's while the Hebbian
    and firing-rate-modified rules are not significantly above it.
  depends_on:
  - fig7c-degree-modified-rule-matches
- id: figs1-larger-model
  statement: With 40 neurons per layer the model gives the same qualitative results, the
    degree-modified rule again raising neuron-to-neuron communication, though the Hebbian and
    firing-rate-modified rules give larger conditioned mutual information than in the small model.
  source: Results, Feedforward Network Model, paragraph 6; S1 Fig
  quote: As with the smaller model, the larger model produced computation correlation results
    similar to the results seem in the data for the degree-modified and firing-rate modified Hebbian
    rewiring rules, but not the pure Hebbian rewiring rule ... As in the smaller model, the
    degree-modified Hebbian rewiring rule reinforced network-wide activity and increased
    neuron-to-neuron communication
  criterion: As fig7c-degree-modified-rule-matches, fig7b-connectivity-patterns and
    fig7d-degree-rule-highest-conditioned-mi with N_Neurons = 40 (so 320 connections and 320
    rewirings) and the larger model's score equations (Eq 23 and Eq 24, not in the text read).
    Reproduced when the correlation match of fig7c holds for the degree-modified and
    firing-rate-modified rules and not for the Hebbian rule, and the degree-modified rule's
    conditioned MI is above the random model's (Mann-Whitney, FDR, p < 0.001).
  depends_on:
  - fig7c-degree-modified-rule-matches
