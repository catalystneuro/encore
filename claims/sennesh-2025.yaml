- id: suppfig2-alphabeta-peaks
  statement: In the oscillatory spectra the deviance-detection control has greater ⍺/β power than
    the oddball in all six areas; the global-oddball control has greater ⍺/β power in V1, LM, RL,
    AL and PM; for stimulus-specific adaptation the oddball has greater ⍺/β power in LM and AL.
  source: Supplementary Figure 2 legend; Results, ɣ oscillations responded to global oddballs,
    paragraph 3
  quote: DD shows significant difference in heights of the ⍺/β (10-30 Hz) peaks, with the control
    condition showing greater ⍺/β power than the oddball condition, in V1, LM, RL, AL, PM, and AM;
    in LM and AL the SSA contrast shows higher ⍺/β power in the oddball condition ... In V1, LM, RL, AL, and PM the GO contrast shows higher ⍺/β power in the
    control condition
  depends_on:
  - dd-gamma-peak-frequency-v1
  criterion: Per-mouse oscillatory spectra as in dd-gamma-peak-frequency-v1; the legend's test is
    a difference of more than 2 SEM (over mice). Open, where in the band. Readings (a) at the
    frequency of the larger condition's mean maximum between 10 and 30 Hz, (b) the per-mouse
    maximum between 10 and 30 Hz. A difference is significant when the two means differ by more
    than twice the larger of the two SEMs (the legend's ">2 SEM"; also open, the pooled SEM of the
    difference is a variant). Reproduced when, under one reading, at least 11 of the 13 named
    area and contrast cases hold in the stated direction; partially reproduced for 7 to 10.
- id: suppfig2-gamma-height-differences
  statement: DD and SSA show significant differences in the height of the ɣ oscillatory peak in V1,
    LM, RL, AL and AM, and DD in PM as well.
  source: Supplementary Figure 2 legend
  quote: DD and SSA consistently show significant (>2 SEM) differences in the heights (power above
    aperiodic baseline) of the ɣ (30-90 Hz) oscillatory peaks in V1, LM, RL, AL, and AM, with DD
    showing such a significant peak in PM as well
  depends_on:
  - suppfig2-alphabeta-peaks
  criterion: As in suppfig2-alphabeta-peaks, with the band 30-90 Hz; the legend gives no direction.
    Reproduced when, under one reading, at least 9 of the 11 named cases (DD in six areas, SSA in
    five) differ by more than 2 SEM; partially reproduced for 6 to 8.
- id: go-theta-peaks
  statement: Oscillatory spectra with finer frequency resolution have peaks at 5-9 Hz, within the θ
    band, supporting the reading of the global oddball's low-frequency increase as θ.
  source: Results, ɣ oscillations responded to global oddballs, paragraph 2; Supplementary Figure
    2
  quote: We interpret the low-frequency synchronization shown in Figure 3(c) as θ synchronization
    in light of a further spectral analysis with higher frequency resolution, shown in
    Supplemental Figure 2, finding oscillatory peaks at 5-9 Hz, within the <10 Hz θ band
  depends_on:
  - dd-gamma-peak-frequency-v1
  criterion: Per-mouse spectra and per-channel FOOOF fits of dd-gamma-peak-frequency-v1 for
    go_gloexp and go_seqctl in V1. Reproduced when the channel-averaged oscillatory spectrum (mean
    over mice) of each condition has a local maximum above 0 dB between 4.5 and 9.9 Hz (5-9 Hz
    widened by 10%); partially reproduced for one condition. The FOOOF peak centres in that range
    are reported.
- id: fig3ab-go-condition-spectra
  statement: In V1, the P4 response to the unpredicted repetition "xxxX" shows a fast 2-4 dB ⍺/β
    increase that returns to baseline and long-lasting increases under 2 dB in 40-55 Hz and 80-90
    Hz ɣ; the predictable "xxxx" shows a 4-6 dB ⍺/β increase and a smaller ɣ increase, both lasting
    through the first 200 ms.
  source: Figure 3 legend, panels a and b; Results, ɣ oscillations responded to global oddballs,
    paragraph 2
  quote: However, in the global oddball condition the ⍺/β band quickly returns to baseline, while
    the ɣ oscillations increase more in power (2 dB vs <2 dB) compared to the control block
  expected:
  - quantity: xxxX fast ⍺/β maximum, V1
    value: 3.1
    tolerance: 1.3
    unit: dB
  - quantity: xxxx fast ⍺/β maximum, V1
    value: 5.1
    tolerance: 1.5
    unit: dB
  criterion: Condition spectrograms as in the opening comment, S6, in V1. Ranges 2-4 and 4-6 dB
    widened by 10% (1.8 to 4.4 and 3.6 to 6.6 dB). Reproduced when both ⍺/β maxima in the first
    150 ms are in range, the xxxX ⍺/β power falls below 1 dB before 250 ms while the xxxx ⍺/β
    power stays above 1 dB through 200 ms, and the mean 40-55 Hz power over 150-500 ms is higher in
    xxxX than in xxxx. The 150 ms, 250 ms and 1 dB bounds and the 150-500 ms window are choices
    made here; the 200 ms is the legend's. Partially reproduced when the ⍺/β time courses hold but
    a value does not.
- id: fig3c-go-v1-contrast
  statement: In V1 the global oddball ("xxxX" against "xxxx") gives a significant fast increase in
    high ɣ (55-90 Hz) trailing into a sustained 40-55 Hz ɣ increase, an immediate rise in θ power,
    and a fall in ⍺/β power over time.
  source: Figure 3c and legend; Results, ɣ oscillations responded to global oddballs, paragraph 2
  quote: the contrast response consists of a fast increase (>=0.3 dB) in high-ɣ (55-90 Hz)
    synchronization, which trails off into sustained increases (<= 0.2 dB) in 40-55 Hz ɣ power,
    alongside an immediate rise (0.2-0.3 dB) in θ power and a fall (<0.2 dB) in ⍺/β power over time
  statistics:
  - test: channel-time-frequency nonparametric cluster-based permutation test
    p: 0.01
    p_relation: "<"
    n: 2041 xxxX and 1355 xxxx trials pooled over 14 mice
  depends_on:
  - trial-counts
  criterion: Common method (opening comment, S1 to S5), V1, panel c as S5 says. The text's sizes
    (high ɣ at least 0.3 dB, 40-55 Hz at most 0.2 dB, θ 0.2-0.3 dB, ⍺/β under 0.2 dB) and the
    legend's (⍺/β decrease 0.2 dB after 200 ms, θ and ɣ increases 0.4-0.5 dB) differ; the signs
    and timing are judged, and the sizes are reported against both. Reproduced when the masked,
    channel-averaged contrast has significant positive values at 55-90 Hz in the first 150 ms,
    positive 40-55 Hz values persisting past 300 ms, positive θ (2-10 Hz) values starting before
    150 ms, and negative ⍺/β values; partially reproduced when the ɣ and θ increases hold but the
    ⍺/β decrease is absent. The 150 ms ("fast", "immediate") and 300 ms ("sustained") bounds are
    choices made here. Run under both S3 readings.
- id: fig3d-go-gamma-laminar
  statement: In V1 the global oddball raises ɣ power by 0.2-0.4 dB in L2/3, L4 and L5/6 at onset,
    strengthening to about 0.6 dB by the end of the stimulus, while ɣ power falls in L1.
  source: Figure 3d and legend; Results, ɣ oscillations responded to global oddballs, paragraph 2
  quote: ɣ power increases by 0.2-0.4 dB in L5/6, L4, and L2/3 immediately upon onset of the global
    oddball, persisting and even strengthening to 0.6 dB by the end of stimulus presentation, while
    ɣ power decreased by 0.4-0.6 in L1
  depends_on:
  - fig3c-go-v1-contrast
  criterion: Laminar ɣ panel of the GO contrast in V1 (opening comment, S5), under both ɣ band
    readings. The Results text places the onset increase in "the supragranular laminar layers"
    (0.4-0.6 dB) and the legend in L5/6, L4 and L2/3; the legend is followed and the text reported.
    Reproduced when L2/3, L4 and L5/6 channels have significant positive values in the first 100
    ms, the largest positive value in the last 100 ms of the stimulus is 0.54 to 0.66 dB (0.6,
    10%), and L1 channels have significant negative values; partially reproduced when the
    increases hold without the L1 decrease or the late value is out of range. The first and last
    100 ms windows ("immediately upon onset", "by the end") are choices made here.
- id: fig3e-go-alphabeta-laminar
  statement: In V1 the global oddball gives an ⍺/β decrease in L1 (upper supragranular layers) and
    an ⍺/β increase starting in L5/6 that spreads up to L4 and L2/3 while weakening.
  source: Figure 3e and legend; Results, ɣ oscillations responded to global oddballs, paragraph 2
  quote: ⍺/β power increase begins (0.5-1 dB) in L5/6 <100ms after global oddball onset, while ⍺/β
    power decreases (0.5-0.75 dB) in L1. The increase in infragranular layers spreads out to L4 and
    then to L2/3 while weakening to 0.25-0.5 dB
  depends_on:
  - fig3c-go-v1-contrast
  criterion: Laminar ⍺/β panel of the GO contrast in V1 (opening comment, S5). The legend dates
    the L5/6 increase before 100 ms, the text after about 120 ms ("a weak increase in ⍺/β power
    spread from infragranular layers upwards after approximately 120 ms"); both onsets are
    readings. Reproduced when L5/6 has a significant positive ⍺/β cluster whose first positive bin
    in L5/6 precedes those in L4 and L2/3, and L1 has significant negative values; partially
    reproduced when one of the two holds. The onset time and sizes (legend 0.5-1, 0.5-0.75,
    0.25-0.5 dB) are reported.
- id: fig3f-go-theta-laminar
  statement: In V1 the global oddball increases θ power, beginning in L5/6 (about 0.5 dB) within
    100 ms of onset and spreading through the column while strengthening to 1-1.5 dB.
  source: Figure 3f and legend; Results, ɣ oscillations responded to global oddballs, paragraph 2
  quote: Figure 3(f) shows that within less than 100 ms after oddball onset, an increase in θ power
    (< 0.5 dB) begins in infragranular layers before intensifying to 1.0-1.5 dB as it spreads
    throughout V1
  depends_on:
  - fig3c-go-v1-contrast
  expected:
  - quantity: largest θ increase, V1, GO
    value: 1.275
    tolerance: 0.375
    unit: dB
  criterion: Laminar θ panel of the GO contrast in V1 (opening comment, S5). 1-1.5 dB widened by 10%
