- id: fig4ab-ssa-condition-spectra
  statement: In V1, the response to "xxxY" shows a 2.5-5 dB ⍺/β increase at onset (returning to
    baseline, then rising again) with fast and long-lasting 2.5-5 dB increases in 40-55 Hz and
    80-90 Hz ɣ; "yyyy" shows a 2-4 dB ⍺/β increase followed by smaller (under 2 dB) ɣ increases.
  source: Figure 4 legend, panels a and b
  quote: Spectral responses to P4 in a relatively predictable (80% probability) “xxxY” sequence
    conform to stereotyped “oddball” responses, with stimulus onset leading to an increase (2.5-5
    dB) in ⍺/β power
  expected:
  - quantity: xxxY 40-55 Hz ɣ maximum, V1
    value: 3.875
    tolerance: 1.625
    unit: dB
  - quantity: yyyy fast ⍺/β maximum, V1
    value: 3.1
    tolerance: 1.3
    unit: dB
  criterion: Condition spectrograms as in the opening comment, S6, in V1. Ranges widened by 10%
    (2.25 to 5.5 dB; 1.8 to 4.4 dB). Reproduced when both values are in range, the xxxY ⍺/β maximum
    in the first 150 ms is 2.25 to 5.5 dB, and the yyyy 40-55 Hz maximum after 150 ms is below 2.2
    dB and below the xxxY value; partially reproduced when the ordering holds but a value does not.
- id: fig4c-ssa-v1-contrast
  statement: In V1 stimulus-specific adaptation ("xxxY" against "yyyy") gives a broad,
    non-frequency-specific decrease of power (0.5-1.5 dB) at onset, followed by a ɣ increase (1-1.5
    dB) throughout the stimulus.
  source: Figure 4c and legend; Results, Stimulus change induces ɣ vs ⍺/β push-pull, paragraph 2
  quote: The contrast in Figure 4(c) shows non-frequency-specific desynchronization (0.5-1.5 dB) at
    the onset of the local oddball, followed by enhanced ɣ power (1-1.5 dB) throughout the stimulus
    presentation
  statistics:
  - test: channel-time-frequency nonparametric cluster-based permutation test
    p: 0.01
    p_relation: "<"
    n: 8462 xxxY and 1352 yyyy trials pooled over 14 mice
  depends_on:
  - trial-counts
  expected:
  - quantity: largest early (0-150 ms) decrease, all bands, V1
    value: -1.05
    tolerance: 0.6
    unit: dB
  - quantity: largest later ɣ increase, V1
    value: 1.275
    tolerance: 0.375
    unit: dB
  criterion: Common method (opening comment, S1 to S5), V1, panel c as S5 says. Ranges widened by
