    power effects, paragraph 1), with FOOOF fitted over 2 to 90 Hz (Methods); (b) the code's, 20 ms
    before onset to 20 ms after offset, FOOOF over 2 to 150 Hz. Both are run; the claim is judged
    under either.
- id: dd-gamma-peak-frequency-lm
  statement: In LM the deviance-detection oddball's ɣ peak frequency is significantly higher than
    the control's (control 35 Hz, oddball 41 Hz, p < 0.01).
  source: Supplementary Figure 2 legend
  quote: In DD, the oddball’s ɣ-band peak frequency significantly (in a permutation-based t-test
    with 1000 permutations) shifted higher than that of the control condition V1 (35-38 Hz, ⍺ < 0.
    05) and LM (35-41 Hz, ⍺ < 0. 01)
  statistics:
  - test: permutation-based t-test, 1000 permutations
    p: 0.01
    p_relation: "<"
    n: 14 mice
  expected:
  - quantity: ɣ peak frequency, xxxy (control), LM
    value: 35
    tolerance: 3.5
    unit: Hz
  - quantity: ɣ peak frequency, XXXY (oddball), LM
    value: 41
    tolerance: 4.1
    unit: Hz
  depends_on:
  - dd-gamma-peak-frequency-v1
  criterion: Method of dd-gamma-peak-frequency-v1, in LM. The pair "35-41 Hz" is read as control
    then oddball, as the V1 pair (35-38 Hz) matches the text's 35 Hz habituation and 38 Hz XXXY.
    Reproduced when XXXY is higher with p < 0.01 and both means are within 10%; partially
    reproduced when p < 0.05 only or a mean is out of tolerance.
- id: dd-gamma-power-and-peak-only-v1-lm
  statement: After removing the aperiodic component, only V1 (p < 0.05) and LM (p < 0.01) show
    significant increases in both the power and the peak frequency of ɣ oscillations for
    deviance detection.
  source: Results, Narrowband ɣ oscillations reflect deviance detection, paragraph 4
  quote: After removal of the aperiodic component, however, only V1 (𝑝 < 0. 05) and LM (𝑝 < 0. 01)
    displayed significant increases in both the power and peak frequency of ɣ oscillations,
    derived from a permutation-based t-test (with 𝑛 = 1000 permutations) for difference of means
    between conditions on per-subject, channel- and trial-averaged frequency spectra
  statistics:
  - about: V1
    test: permutation-based t-test, 1000 permutations
    p: 0.05
    p_relation: "<"
    n: 14 mice
  - about: LM
    test: permutation-based t-test, 1000 permutations
    p: 0.01
    p_relation: "<"
    n: 14 mice
  depends_on:
  - dd-gamma-peak-frequency-v1
  criterion: Per-mouse oscillatory spectra as in dd-gamma-peak-frequency-v1. For ɣ power, the
    code (aligned_subject_spectra) runs the Welch permutation t-test at every frequency of the
    per-mouse FOOOF model spectra and reports significance when any frequency passes; open, which
    bins count as ɣ power. Readings (a) any bin from 30 to 90 Hz passes with the oddball higher,
    (b) the per-mouse maximum between 30 and 90 Hz compared. Peak frequency as in
    dd-gamma-peak-frequency-v1. Reproduced when, under one reading, V1 and LM pass both tests (V1
    at 0.05, LM at 0.01) with the oddball higher and no other area passes both at 0.05; partially
    reproduced when V1 and LM pass but another area does too.
