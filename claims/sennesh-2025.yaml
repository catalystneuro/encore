- id: fig3h-go-alphabeta-csd-feedback
  statement: ⍺/β oscillations in "xxxx" in V1 show a weak feedback CSD pattern, starting in L1 and
    continuing down to L2/3 and L4, with later contributions from L5/6.
  source: Figure 3h and legend; Results, ɣ oscillations responded to global oddballs, paragraph 2
  quote: ⍺/β show a weakly feedback-driven laminar activation pattern, starting in L1 before
    continuing down to L2/3 and L4, with later contributions coming from L5/6. CSD was calculated
    over the average of n=300 complete oscillatory windows over 1355 trials
  depends_on:
  - trial-counts
  expected:
  - quantity: ⍺/β trough-locked windows, xxxx, V1
    value: 300
    tolerance: 30
  criterion: Trough-locked CSD as in the opening comment, S7, for go_seqctl in V1 (the legend's
    trial count, 1355, is that of "xxxx"), under both band readings. Reproduced when the L1 sink
    comes before the L2/3 and L4 sinks. The window count is compared (10%) and reported.
- id: fig3i-go-theta-csd
  statement: θ oscillations under global oddballs in V1 show sinks beginning in L5 and L4 and
    spreading to L2/3.
  source: Figure 3i and legend; Results, ɣ oscillations responded to global oddballs, paragraph 2
  quote: θ oscillations show a feedforward laminar activation pattern under global oddballs, with
    activation beginning in L5 and L4 before spreading to L2/3 as it strengthens with the phase
    cycle. CSD was calculated over the average of n=335 complete oscillatory windows over 2041
    trials
  depends_on:
  - trial-counts
  expected:
  - quantity: θ trough-locked windows, xxxX, V1
    value: 335
    tolerance: 33.5
  criterion: Trough-locked CSD as in the opening comment, S7, for go_gloexp in V1, under both band
