# Claims for Sennesh, Westerberg, Spencer-Smith & Bastos (2025), "Ubiquitous predictive
# processing in the spectral domain of sensory cortex", bioRxiv doi:10.1101/2025.07.31.667946,
# tested on dandiset 000253 (Allen Institute OpenScope Global/Local Oddball project), which the
# paper reuses.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-20,
# protocol pilot-18 as stated in docs/protocol.md.
#
# Text read: the bioRxiv preprint full-text HTML as stored in paper/10.1101-2025.07.31.667946.txt
# (header "Version: preprint"; the version number is not given). It holds the main text, the
# Results, the legends of Figures 1 to 5, Materials and Methods, Data and Code Availability, and
# the legends of Supplementary Figures 1 to 4. No PDF was available, so no figure was seen; values
# shown only in figures could not be read. There is no separate supplement beyond those four
# figures. The paper is not peer reviewed in this version.
#
# Code read: github.com/BastosLab/epych, branch develop, notebooks/passiveglo and the epych
# package, at commit cee2e6f (2025-07-29), the last commit before the preprint was posted on
# 2025-07-31. The branch head, e53ccf5 (2026-10-21), changed the analysis after the preprint (from
# 2026-03 the oddball clusters must exceed a cluster size from a pre-oddball window; a pupil GLM
# was added in 2026-10); those changes are not the preprint's method and are not used here.
# Notebooks used: epoching, lonaive_epoching, laminar_alignment, aligned_grandcat,
# grand_spectrogram, oscillatory_contrasts (Figures 2 to 5 contrasts, laminar panels and Figure 5
# bars), grand_oscillatory_csds (CSD panels), aligned_subject_spectra (Supplementary Figures 1 and
# 2), grand_fastsweep_spectra (Supplementary Figure 3). The code holds no pupil analysis at that
# commit (Supplementary Figure 4). The stimulus code (github.com/AllenInstitute/openscope-glo-stim)
# was not needed. The epoching notebook reads each subject's condition intervals from a file
# passiveglo_task_data.mat kept beside the NWB files; the paper does not say where that file comes
# from. Whether the dandiset's own stimulus tables give the same conditions is the author's to find.
#
# Data the paper used. 16 SST;Ai32 and PV;Ai32 mice (6 male, 10 female, 95 to 128 days old); one
# had no usable units after a destabilizing event and one was dropped for stimulus timing
# problems, leaving 14 mice (Data Analysis). Six Neuropixels probes per mouse targeted V1, LM,
# RL, AL, PM and AM; LFP band at 2.5 kHz; cortical channels labelled by histology into L1, L2/3,
# L4, L5 and L6. Two cohorts of 7 were habituated over 5 sessions (2000 trials) to "xxxY" or
# "yyyX" (drifting gratings at 45 and 135 degrees, 500 ms on, 500 ms ISI, 1 s between
# sequences). Each recording session had, in order, 50 habituation trials ("xxxy"), the main
# block (local oddball "xxxY" 80%, global oddball "xxxX" 20%), a random control block (each
# stimulus random, "XXXY" one sequence among them), and a sequence control block ("xxxx" and
# "yyyy", 50% each). Every analysis uses the fourth stimulus, P4. Pupil size from eye video (60 Hz)
# is used in Supplementary Figure 4. The code drops a subject with fewer than six probe files or
# with LFP timestamps whose mean step exceeds 1 s (epoching notebook); the paper names the two
# exclusions only by reason.
#
# Conditions and contrasts, as in the code (oscillatory_contrasts CONTRASTS). Deviance detection
# (DD) is lo_rndctl ("XXXY", random block) against lonaive ("xxxy", the first 50 trials of
# lo_gloexp, trial index below 50; lonaive_epoching). Global oddball (GO) is go_gloexp ("xxxX",
# main block) against go_seqctl ("xxxx", sequence control). Stimulus-specific adaptation (SSA) is
# lo_gloexp ("xxxY", main block) against igo_seqctl ("yyyy", sequence control). Epochs run from
# 0.5 s before to 0.5 s after each condition interval, with time 0 at P4 onset (epoching notebook).
#
# The common spectral method (S1 to S7), cited to the Methods (M) and the code (C) as each is
# fixed. Criteria below refer to it.
# S1 Channels. Visual-cortex channels only (location containing "VIS"), median filtered over 3
#    adjacent channels (C, aligned_grandcat visual_align). Per area, channels are aligned across
#    probes at the median L4 channel, cropped to the smallest extent above and below L4 across
#    probes, labelled by majority vote, trials appended across mice (M, Data Analysis), and every
#    fourth channel kept (M; C, downsample(4)). Layers are read from the labels; a channel is L2/3
#    when its label has "2/3", L4 with "4", L5/6 with "5" or "6", L1 with "1" (C, LAMINAE).
# S2 Spectrograms. Syncopy freqanalysis, mtmconvol, Hann taper, 200 ms window, toi 0.95, padding to
#    next power of two, frequencies in 5 Hz steps (1 / 0.2 s) up to 150 Hz, per trial (M names
#    Syncopy; C, grand_spectrogram and spectrum.Spectrogram). Cropped to 10 ms before P4 onset to
#    10 ms after P4 offset (C, oscillatory_oddball).
# S3 Aperiodic removal. For each condition, area and channel, FOOOF 1.1.0 (settings of M, which are
#    the FOOOF defaults: peak width 0.5 to 12, no peak limit, minimum height 0, threshold 2,
#    aperiodic mode fixed) is fitted to the spectrogram averaged over trials and time, and the
#    spectrogram is divided by the fitted aperiodic power and expressed in dB, 10 log10 (C,
#    tfr.oscillatory, then decibels). Open, the fitting range. M says spectra were "parameterized
#    across the frequency range 2 to 90 Hz with a frequency resolution of 2 Hz"; the code fits all
#    spectrogram frequencies (5 to 150 Hz). Readings (a) the code's range, (b) 5 to 90 Hz on the
#    spectrogram grid. No pre-stimulus baseline is subtracted (C uses oscillatory_oddball, not
#    baselined_oscillatory).
# S4 Contrast test. Per area, the two conditions' dB spectrograms, trials pooled across mice as
#    observations, go to mne.stats.spatio_temporal_cluster_test with arrays (trials, time,
#    frequency, channel), F statistic, cluster-forming threshold the F quantile at 0.99 with 1 and
#    n1 + n2 - 1 degrees of freedom, tail 1 (equivalent to a two-tailed t), 1000 permutations,
#    default lattice adjacency; clusters with p < 0.01 form the mask (M, "nonparametric,
#    cluster-based permutation testing ... two-tailed ... 0.01"; C, GrandNonparametricClusterTest).
#    The contrast is the difference of the trial means of the dB spectrograms, set to 0 outside
#    the mask.
# S5 Panels. A contrast panel (c) is the masked contrast averaged over channels (C, heatmap uses
#    channel_mean). A laminar panel (d to f) is the masked contrast averaged over a band's
#    frequency bins, per channel and time (C, band_power, bins from the one nearest the lower edge
#    up to, not including, the one nearest the upper edge). Bands θ 2-10 Hz, ⍺/β 10-30 Hz, ɣ
#    30-90 Hz (M and Figure 2 text). Open, the ɣ band of the laminar panels and Figure 5. The text
#    gives 30-90 Hz; the code's BANDS uses 30-50 Hz (LOW_GAMMA_BAND). Readings (a) 30-90 Hz, (b)
#    30-50 Hz.
# S6 Condition panels (a, b). The dB spectrogram of S3 for one condition, averaged over trials and
#    channels.
# S7 Trough-locked CSD (M, CSD paragraph; C, grand_oscillatory_csds). The pooled LFP of S1 (before
#    downsampling) from 50 ms before P4 onset to 50 ms after offset is band-passed (Syncopy firws)
#    and its Hilbert phase taken on the middle channel of the chosen layers; troughs are samples
#    where |phase| is within 0.001 of π; the LFP, minus its trial-averaged evoked potential, is cut
#    into windows of 1.5 periods of the band centre around each trough; windows are averaged, every
#    fourth channel kept, and the CSD computed with Elephant StandardCSD on the probe's vertical
#    positions; CSD values are shown only where the second-difference CSD's mean over windows
#    exceeds 2 standard deviations over windows divided by their number. Open, the bands. M gives
#    2-10, 10-30 and 30-90 Hz; the code uses 4-8 Hz (phase on all channels), 12-24 Hz (phase on
#    L5/6) and 30-50 Hz (phase on L2/3 and L4). Readings (a) M's bands with the phase on the code's
#    channels, (b) the code's bands. Open, how a pattern is judged; the paper reads it by eye. Fixed
#    here, in each layer group (L1, L2/3, L4, L5/6) the time of the first sink (negative CSD, the
#    usual sign; the paper does not state it) above the display threshold. Feedforward means the
#    L4 (or the L4 and L5 boundary, as Figure 4g allows) sink comes before the L2/3 and L5/6 sinks;
#    feedback means an L1 or L5/6 (L6) sink comes before the L4 sink. The full CSD image is shown.
