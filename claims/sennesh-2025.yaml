  depends_on:
  - trial-counts
  expected:
  - quantity: ɣ trough-locked windows, xxxY, V1
    value: 1910
    tolerance: 191
  criterion: Trough-locked CSD as in the opening comment, S7, for lo_gloexp in V1, under both band
