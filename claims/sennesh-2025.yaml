  source: Figure 4d, 4e and 4f and legend; Results, Stimulus change induces ɣ vs ⍺/β push-pull,
    paragraphs 2 and 4
  quote: This confirms that the desynchronization is present in all frequency ranges and layers
  depends_on:
  - fig4c-ssa-v1-contrast
  criterion: Laminar panels of the SSA contrast in V1 (opening comment, S5), under both ɣ band
