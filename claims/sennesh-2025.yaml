  criterion: From the masked L2/3 ɣ values of fig5-l23-gamma-by-area. Reproduced when, under one
    reading, the set of areas with a masked L2/3 ɣ point is exactly the stated set for each
    contrast and the GO value in RL is negative; partially reproduced when the sets differ by one
    area in total.
- id: suppfig3-fastsweep-aperiodic
  statement: In the first 150 ms after onset the aperiodic component differs between oddball and
    control at p < 0.05 in DD-LM, GO-AL, GO-PM and SSA-AM, and at p < 0.01 in GO-V1, SSA-V1 and
    SSA-PM.
  source: Supplementary Figure 3 legend; Results, Spectral power effects come from oscillations and
    aperiodic tilt, paragraph 1
  quote: Contrasts and areas marked with an asterisk (DD-LM, GO-AL, GO-PM, SSA-AM) displayed at
    least one cross-condition difference in the two parameters of the aperiodic component with
    significance level ⍺ < 5%, while those marked with two asterisks (GO-V1, SSA-V1, SSA-PM)
    displayed at least one cross-condition difference with significance level ⍺ < 1%
  statistics:
  - about: DD-LM, GO-AL, GO-PM, SSA-AM
    test: permutation-based t-test on the two aperiodic parameters, 1000 permutations
    p: 0.05
    p_relation: "<"
  - about: GO-V1, SSA-V1, SSA-PM
    test: permutation-based t-test on the two aperiodic parameters, 1000 permutations
    p: 0.01
    p_relation: "<"
  criterion: FOOOF (fixed mode, defaults) on the power spectrum of the first 150 ms after P4 onset;
    a Welch t-test with 1000 permutations on offset and exponent, oddball against control; an area
    is starred when either parameter passes. Open, the samples. Readings (a) the legend's,
    per-mouse trial-averaged spectra (N = 14), from per-mouse spectrograms of S2 cropped to 0-150
    ms and averaged over time, trials and channels; (b) the code's (grand_fastsweep_spectra), the
    pooled spectrogram of S2 cropped to 0-150 ms and averaged over time and trials, one FOOOF fit
    per channel, channels as samples. The Results text agrees with the legend (areas V1, LM, AL,
    PM and AM; GO in V1, AL and PM; SSA in V1, PM and AM) except one sentence of the SSA section
    (Stimulus change induces ɣ vs ⍺/β push-pull, paragraph 4), which gives SSA tilt in "V1, AL,
    and PM"; the legend is judged. Reproduced when, under one reading, at least 5 of the 7
    starred cases pass at their level and at most 2 of the 11 unstarred cases pass at 0.05;
    partially reproduced for 3 or 4 starred cases.
- id: suppfig4-pupil-dd-no-difference
  statement: Pupil size, z-scored, does not differ significantly between P4 of the random "XXXY"
    sequences and P4 of the habituation "xxxy" sequences.
  source: Supplementary Figure 4 legend; Discussion, paragraph 5
  quote: Taking the z-scores of pupil sizes across P4 of the “XXXY” random control sequences and
    “xxxy” habituation sequences did not show significant differences
  criterion: A claim of absence. The paper names no test for this figure and the code at cee2e6f
    has none; the Results state that "the entire paper uses this significance level and testing
    procedure for its statistical tests", so the test is a cluster-based permutation test over
    time (MNE, 1000 permutations, two-tailed, cluster-forming and cluster p threshold 0.01) on
    per-trial pupil-size traces z-scored over the P4 epochs of both conditions, trials pooled
    across mice, from P4 onset to offset (the window is not given; P4 itself is a choice made
    here). Reproduced when no cluster has p < 0.01; not reproduced
    when one does; the largest mean difference is reported. Open, the z-scoring (over all P4 trials
    of both conditions pooled, as the legend's "across P4" reads, or within each mouse); both are
    run, and the claim stands on the pooled one, with the per-mouse one and the legend's 2-SEM
    band overlap shown as variants.
