    LM (37-43 Hz, ⍺ < 0. 05), RL (37-45 Hz, ⍺ < 0. 01), AL (36-44 Hz, ⍺ < 0. 05), and AM (38-47 Hz,
    ⍺ < 0. 05)
  statistics:
  - about: LM
    test: permutation-based t-test, 1000 permutations
    p: 0.05
    p_relation: "<"
  - about: RL
    test: permutation-based t-test, 1000 permutations
    p: 0.01
    p_relation: "<"
  - about: AL
    test: permutation-based t-test, 1000 permutations
    p: 0.05
    p_relation: "<"
  - about: AM
    test: permutation-based t-test, 1000 permutations
    p: 0.05
    p_relation: "<"
  expected:
  - quantity: ɣ peak, xxxY, LM
    value: 37
    tolerance: 3.7
    unit: Hz
  - quantity: ɣ peak, yyyy, LM
    value: 43
    tolerance: 4.3
    unit: Hz
  - quantity: ɣ peak, xxxY, RL
