    the end of the oscillation carries them into L1 and L6. CSD was calculated over the average of
    n=319 complete oscillatory windows over 1352 trials
  depends_on:
  - trial-counts
  expected:
  - quantity: ⍺/β trough-locked windows, yyyy, V1
    value: 319
    tolerance: 31.9
  criterion: Trough-locked CSD as in the opening comment, S7, for igo_seqctl in V1, under both band
