- id: fig5-hierarchy-restriction
  statement: Deviance-detection and global-oddball ɣ modulations in L2/3 are restricted to early
    areas (V1, LM, RL and AL for deviance detection; V1, LM and RL for the global oddball), while
    stimulus-specific adaptation effects appear in all six areas; RL is the one area with a ɣ
    decrease for global oddballs.
  source: Results, Spectral power effects come from oscillations and aperiodic tilt, paragraph 2;
    Figure 5
  quote: Deviance detection and global oddball modulations were restricted to the early part of the
    hierarchy (areas V1, LM, RL, and AL for deviance detection and areas V1, LM, and RL for global
    oddball). Stimulus specific adaptation responses could be seen throughout the entire hierarchy
    of areas
  depends_on:
