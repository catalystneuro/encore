    aperiodic components of the spectral response to its oddball and its control stimulus in any
    of the recorded cortical areas
  depends_on:
  - trial-counts
  criterion: A claim of absence. The test is the code's (aligned_subject_spectra), which the
    Supplementary Figure 1 legend describes only by overlapping 2-SEM bands. Per mouse, area and
    condition, the LFP of S1 (aligned, not downsampled) from 50 ms before P4 onset to 50 ms after
    offset (Results, Spectral power effects, paragraph 1); Syncopy mtmfft power spectrum, Hann
    taper, 500 ms window, 2 Hz steps (code; the Methods' 2 Hz resolution); averaged over trials
