- id: fig4i-ssa-theta-csd
  statement: θ oscillations in P4 of "xxxY" in V1 show sinks starting in L1 and L6, then activity
    in L2/3 at the trough spreading down through L4 and L5 into L6.
  source: Figure 4i and legend; Results, Stimulus change induces ɣ vs ⍺/β push-pull, paragraph 4
  quote: θ oscillations in P4 of the mostly predictable “xxxY” sequence show a mixed feedback and
    then feedforward pattern of laminar activity, with current sinks starting in L1 and L6 before
    activity in L2/3 at the θ trough spreads downward through L4 and L5 into L6 towards the cycle’s
    end. CSD was calculated over the average of n=1266 complete oscillatory windows over 8462
