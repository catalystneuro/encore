    ms, significant positive θ later reaches L4, L2/3 and L1, and the largest value is in range;
    partially reproduced when the θ increase holds but its laminar onset or size does not.
- id: fig3g-go-gamma-csd-feedforward
  statement: ɣ oscillations under global oddballs in V1 show a feedforward laminar CSD pattern,
    starting in L4 and spreading toward L2/3 and L5/6.
  source: Figure 3g and legend; Results, ɣ oscillations responded to global oddballs, paragraph 2
  quote: ɣ oscillations induced by global oddballs show a canonically feedforward laminar
    activation pattern, starting in L4 at phase 0 and spreading out towards L2/3 and L5/6 as the
    phase cycle continues. CSD was calculated over the average of n=496 complete oscillatory
    windows over 2041 trials
  depends_on:
  - trial-counts
  expected:
  - quantity: ɣ trough-locked windows, xxxX, V1
    value: 496
    tolerance: 49.6
  criterion: Trough-locked CSD as in the opening comment, S7, for go_gloexp in V1, under both band
    readings. Reproduced when feedforward by S7's rule. The window count is compared (10%) and
