    0.05 but not both within tolerance or at p < 0.001; not reproduced otherwise. The neuron
    counts and the S1 and S2 values are reported.
- id: fig3b-rule-decoding
  statement: The rule can be decoded from pre-stimulus population activity (-100 to 0 ms) in each
    area; median LDA accuracy over sessions, true against shuffled, S1 0.61 against 0.5, S2 0.62
    against 0.53, MM 0.7 against 0.52, ALM 0.68 against 0.55.
  source: Results, Pre-stimulus states of neuronal populations reflect task rules, paragraph 2;
    Figure 3B
  quote: Pre-stimulus states in S1, S2, MM and ALM could each be used to decode the block type
  expected:
  - {quantity: S1 median accuracy, value: 0.61, tolerance: 0.061}
  - {quantity: S2 median accuracy, value: 0.62, tolerance: 0.062}
  - {quantity: MM median accuracy, value: 0.70, tolerance: 0.07}
  - {quantity: ALM median accuracy, value: 0.68, tolerance: 0.068}
  criterion: Per session, correct trials, spike counts of the 100 ms bin before the stimulus,
    LDA with a diagonal covariance (the code's fitcdiscr 'diaglinear'; diagonal LDA gives the
    same predictions under any per-neuron scaling, so the Methods' soft normalization and the
    code's z-score are equivalent), ten-fold stratified cross-validation, accuracy over all
