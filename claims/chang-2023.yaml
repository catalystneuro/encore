  - about: ALM true accuracy
    test: hierarchical bootstrap
    ci:
      level: 0.95
      low: 0.56
      high: 0.66
  - about: ALM shuffled accuracy
    test: hierarchical bootstrap
    ci:
      level: 0.95
      low: 0.49
      high: 0.54
  - about: S1 true accuracy
    test: hierarchical bootstrap
    ci:
      level: 0.95
      low: 0.52
      high: 0.61
  - about: S1 shuffled accuracy
    test: hierarchical bootstrap
    ci:
      level: 0.95
      low: 0.49
      high: 0.55
  - about: S2 true accuracy
