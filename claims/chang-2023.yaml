- id: fig1d-performance
  statement: Performance was about 75% correct under both rules (respond-to-touch 74 plus or minus
    1%, respond-to-light 75 plus or minus 1%, mean and SEM over 12 mice), with no difference
    between them (paired t-test, p = 0.56).
  source: Results, Task rules modulate touch-evoked activity of individual neurons in the tactile
    processing stream, paragraph 2; Figure 1D
  quote: "We used stimulus strengths ... that yielded performance of approximately 75% correct for
    both respond-to-touch and respond-to-light blocks (Fig. 1d; touch: 74 ± 1%, light: 75 ± 1% (mean
    ± sem), p = 0.56, paired sample t-test, n = 12 mice)"
  statistics:
  - test: paired sample t-test
    p: 0.56
    n: 12 mice
  expected:
  - {quantity: respond-to-touch percent correct, value: 74, tolerance: 1, unit: percent}
  - {quantity: respond-to-light percent correct, value: 75, tolerance: 1, unit: percent}
  criterion: As the code (CM_behavioral_performance.m), per session the fraction of hits plus
    correct rejections among all trials of each block type, using the 40 recording sessions of
    S1, S2, MM and ALM; per mouse the mean over sessions; then mean and SEM over mice. The
    tolerance is the paper's SEM. The Methods remove the last 20 trials of each session, the
    code does not, and the files may already lack them, so two readings are allowed, (a) the
    trials as deposited and (b) the last 20 trials of each session removed. Reproduced when,
    under one reading, both values are within tolerance and a paired t-test over mice finds no
    difference (p at least 0.05); partially reproduced when the test finds no difference but a
    value is outside tolerance; not reproduced when the test finds a difference.
- id: fig1d-outcome-fractions
  statement: The fractions of trial outcomes were similar under the two rules (touch against
    light; hit 36 against 35%, correct rejection 38 against 40%, miss 13 against 14%, false
    alarm 13 against 12%).
  source: Figure 1D legend
  quote: "The fractions of trial outcomes were similar between the respond-to-touch and
    respond-to-light rules (touch vs light: hit (36±1% vs 35±2%); correct rejection (38±1% vs
    40±1%); miss (13±1% vs 14±1%); false alarm (13±1% vs 12±1%))"
  expected:
  - {quantity: touch hit, value: 36, tolerance: 1, unit: percent}
  - {quantity: light hit, value: 35, tolerance: 2, unit: percent}
  - {quantity: touch correct rejection, value: 38, tolerance: 1, unit: percent}
  - {quantity: light correct rejection, value: 40, tolerance: 1, unit: percent}
  - {quantity: touch miss, value: 13, tolerance: 1, unit: percent}
  - {quantity: light miss, value: 14, tolerance: 1, unit: percent}
  - {quantity: touch false alarm, value: 13, tolerance: 1, unit: percent}
  - {quantity: light false alarm, value: 12, tolerance: 1, unit: percent}
  criterion: Fractions of all trials of the block type, as the code's GetBehavPerf (false alarms
    include licks to the wrong port), mean over mice of the mean over sessions; tolerance the
    paper's SEM; readings (a) and (b) as in fig1d-performance. Reproduced when, under one
    reading, all eight are within tolerance; partially reproduced when at least five are.
- id: fig1h-thit-tcr-selective
  statement: 18 to 33% of neurons discriminate tactile hits from tactile correct rejections in the
    first 150 ms after the stimulus (S1 28.8%, S2 17.9%, MM 32.9%, ALM 23.4%), and most of these
    respond more in tactile hits (AUC above 0.5).
  source: Results, Task rules modulate touch-evoked activity of individual neurons in the tactile
    processing stream, paragraph 4; Figure 1H
  quote: We found that 18-33% of neurons in these cortical areas had area under the
    receiver-operating curve (AUC) values significantly different from 0.5 ... the majority had
    enhanced responses (AUC > 0.5) to tactile stimuli that were behaviorally relevant
  expected:
  - {quantity: S1 percent selective, value: 28.8, tolerance: 2.88}
  - {quantity: S2 percent selective, value: 17.9, tolerance: 1.79}
  - {quantity: MM percent selective, value: 32.9, tolerance: 3.29}
  - {quantity: ALM percent selective, value: 23.4, tolerance: 2.34}
  criterion: Per neuron, AUC of tactile hits against tactile correct rejections in each 10 ms bin
    from 0 to 150 ms (smoothed rates), 1000 bootstrap resamples of each class; a bin is
    significant when the Bonferroni-corrected interval (alpha 0.05 divided by the neurons of
    the area, read as the code reads it) excludes 0.5, and a neuron is selective with 3
    consecutive significant bins. Reproduced when all four percentages are within tolerance
    and more than half of the selective neurons, pooled over areas, have mean AUC above 0.5;
    partially reproduced when two or three are within tolerance, or all four lie in the stated
    range 18 to 33% widened by 10% of each bound (16.2 to 36.3%), with the AUC condition met;
    not reproduced otherwise.
- id: fig2c-rule-prestim-units
  statement: Before the stimulus (-100 to 0 ms), fewer than 5% of neurons in S1 and S2 discriminate
    the rule, while about 10 to 20% do in MM and ALM (S1 4.5%, S2 2.5%, MM 21.4%, ALM 10.2%).
  source: Results, Pre-stimulus activity of single neurons signals task rules, paragraph 1; Figure
    2C
  quote: "Less than 5% of neurons in S1 and S2 showed significant rule discriminability, while MM
    and ALM had around 10-20% significant neurons (Fig. 2c; S1: 4.5%, 177 neurons; S2: 2.5%, 162
    neurons; MM: 21.4%, 140 neurons; ALM: 10.2%, 256 neurons"
  expected:
  - {quantity: S1 percent, value: 4.5, tolerance: 0.56}
  - {quantity: S2 percent, value: 2.5, tolerance: 0.62}
  - {quantity: MM percent, value: 21.4, tolerance: 2.14}
  - {quantity: ALM percent, value: 10.2, tolerance: 1.02}
  criterion: AUC of correct trials of respond-to-touch blocks (tactile hits and visual correct
    rejections) against those of respond-to-light blocks (tactile correct rejections and
    visual hits), from the spike count of the 100 ms bin before the stimulus, 1000 bootstrap
    resamples, Bonferroni-corrected interval as in fig1h. The tolerance is 10% of the value or
    one neuron of the area, whichever is larger, as 10% is less than one neuron in S1 and S2.
    Reproduced when all four are within tolerance; partially reproduced when not, but MM and
    ALM each have a higher percentage than both S1 and S2; not reproduced otherwise.
- id: fig2d-stimulus-prestim-units
  statement: As a negative control, almost no neuron discriminates tactile from visual trials
