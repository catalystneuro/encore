- id: fig2f-prestim-predicts-touch-response
  statement: Among neurons with significant rule discrimination before the stimulus, the
    pre-stimulus rule preference predicts the rule modulation of the early touch response (0 to
    50 ms); Pearson r = 0.93 in MM (30 neurons) and 0.83 in ALM (26 neurons), both p < 0.001
    (S1 r = 0.69, 8 neurons, p = 0.056; S2 r = 0.91, 4 neurons, p = 0.093).
  source: Results, Pre-stimulus activity of single neurons signals task rules, paragraph 3; Figure
    2F
  quote: We found that neurons with stronger preference for the respond-to-touch rule before
    stimulus onset showed larger touch-evoked activity in the respond-to-touch blocks, whereas
    neurons with a preference for the respond-to-light rule showed larger touch-evoked activity in
    the respond-to-light blocks
  statistics:
  - about: MM
    test: Pearson correlation
    statistic: r = 0.93
    p: 0.001
    p_relation: "<"
    n: 30 neurons
  - about: ALM
    test: Pearson correlation
    statistic: r = 0.83
    p: 0.001
    p_relation: "<"
    n: 26 neurons
  - about: S1
    test: Pearson correlation
    statistic: r = 0.69
    p: 0.056
    n: 8 neurons
  - about: S2
    test: Pearson correlation
    statistic: r = 0.91
    p: 0.093
    n: 4 neurons
  depends_on:
