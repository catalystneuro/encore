  expected:
  - {quantity: MM Pearson r, value: 0.93, tolerance: 0.093}
  - {quantity: ALM Pearson r, value: 0.83, tolerance: 0.083}
  criterion: As the code, x is the mean bootstrap AUC of the rule (fig2c) and y the mean
