# Claims for Chang, Finkel, Xu & O'Connor, "Rule-based modulation of a sensorimotor transformation
# across cortical areas", bioRxiv preprint doi:10.1101/2023.08.21.554194, on dandiset 000232.
# Source: the full text of preprint version 2 (posted 2024-03-09, CC-BY), read from the copy
# eLife serves for its reviewed preprint 92620v2, whose source is bioRxiv version 2; bioRxiv
# itself refused the download. Results, figure legends and Methods were read. Table 1 and the
# table of coding-dimension trial types are images in that copy and were not read.
#
# When these criteria were written, the author had seen the data check only: the file list and
# metadata, the contents of one ephys file and one file of each optogenetic task, and per file
# the area, subject, number of units, number of trials, block and trial types, the coding of
# the response column against lick times, and the absence of trials with licks between -1 and
# 0.1 s of the stimulus. The counts of sessions, mice and units per area and of optogenetic
# sessions per condition had been seen (claims fig1e-recording-counts and fig6-session-counts).
# No other claim's analysis had been run. The author had read the paper's analysis code
# (github.com/YitingChang/cross_modal_task, commit 227631e), and the method choices below follow
# it where the Methods are silent.
#
# Common choices: a session's trials are those in the file, without cue ("Change") trials;
# a correct trial is a tactile hit (respond-to-touch block, tactile stimulus, right lick),
# visual correct rejection (touch block, visual stimulus, no lick), tactile correct rejection
# (respond-to-light block, tactile, no lick) or visual hit (light block, visual, left lick).
# Stimulus-evoked analyses use 10 ms bins smoothed by a 50 ms Gaussian; pre-stimulus analyses
# use 100 ms bins without smoothing. Population analyses use the Methods' soft normalization
# (x - mean) / (range + 5). Where the code differs (see each claim), its choice is a variant.
# Quotes and statistics added 2026-10-19 from the full text (eLife reviewed preprint 92620v2,
# the same bioRxiv version 2 text, read through the eLife preprint API).
schema_version: 2
dataset:
  archive: dandi
  id: "000232"
paper: doi:10.1101/2023.08.21.554194
claims:
- id: fig1e-recording-counts
  statement: Single units were recorded with 64-channel probes in S1 (6 mice, 10 sessions, 177
    neurons), S2 (5 mice, 8 sessions, 162 neurons), MM (7 mice, 9 sessions, 140 neurons) and ALM
    (8 mice, 13 sessions, 256 neurons), one area per session, and in AMM (110 neurons).
  source: Results, Task rules modulate touch-evoked activity of individual neurons in the tactile
    processing stream, paragraph 3; Figure 1E and 1G; Figure S1K
  quote: "we performed single-unit recordings from sensory and motor cortical areas including S1,
    S2, MM and ALM ... S1: 6 mice, 10 sessions, 177 neurons, S2: 5 mice, 8 sessions, 162 neurons,
    MM: 7 mice, 9 sessions, 140 neurons, ALM: 8 mice, 13 sessions, 256 neurons). We recorded from
    one of these cortical areas per session"
  expected:
  - {quantity: S1 sessions, value: 10, tolerance: 0}
  - {quantity: S1 neurons, value: 177, tolerance: 0}
  - {quantity: S2 sessions, value: 8, tolerance: 0}
  - {quantity: S2 neurons, value: 162, tolerance: 0}
  - {quantity: MM sessions, value: 9, tolerance: 0}
  - {quantity: MM neurons, value: 140, tolerance: 0}
  - {quantity: ALM sessions, value: 13, tolerance: 0}
  - {quantity: ALM neurons, value: 256, tolerance: 0}
  - {quantity: AMM neurons, value: 110, tolerance: 0}
  criterion: Counts of a deposited dataset are expected to match exactly (tolerance 0). The mice
    per area (6, 5, 7, 8) are compared as well. Reproduced when all counts match; partially
    reproduced when the units match but sessions or mice do not.
- id: fig6-session-counts
  statement: The optogenetic experiments in the cross-modal task comprise S1/S2 (4 mice, 10
    sessions), MM (4, 11), ALM (4, 10), sham (7, 28), AMM (7, 21) and PPC (7, 21); in the
    tactile detection task sham (5, 9), S1/S2 (3, 3), MM (3, 5), ALM (3, 4), AMM (3, 4) and
    PPC (3, 4).
  source: Figure 6 legend
  quote: "S1/S2: 4 mice, 10 sessions; MM: 4 mice, 11 sessions; ALM: 4 mice, 10 sessions. Sham: 7
    mice, 28 sessions ... Sham: 5 mice, 9 sessions; S1/S2: 3 mice, 3 sessions; MM: 3 mice, 5
    sessions"
  criterion: Sessions and mice per condition are counted from the files' descriptions and
    subjects, and must match exactly. Reproduced when all 24 counts match; partially reproduced
