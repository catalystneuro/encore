  quote: "After stimulus onset, more than 35% of neurons in the sensory cortical areas and
    approximately 15% of neurons in the motor cortical areas showed significant stimulus
    discriminability (Fig. 2e; S1: 37.3%, 177 neurons; S2: 35.2%, 162 neurons; MM: 15%, 140 neurons;
