  - {quantity: S2 percent, value: 35.2, tolerance: 3.52}
  - {quantity: MM percent, value: 15.0, tolerance: 1.5}
  - {quantity: ALM percent, value: 14.1, tolerance: 1.41}
  criterion: As fig2d, in the 100 ms bin after the stimulus. Reproduced when all four are within
