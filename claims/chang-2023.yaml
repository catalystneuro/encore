  - {quantity: S2 percent, value: 0, tolerance: 0.62}
  - {quantity: MM percent, value: 0, tolerance: 0.71}
  - {quantity: ALM percent, value: 0.8, tolerance: 0.39}
  criterion: As fig2c, comparing correct tactile trials (tactile hits and tactile correct
