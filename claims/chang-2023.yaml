- id: fig3de-stimulus-decoding-controls
  statement: Population activity discriminates tactile from visual trials after the stimulus (0 to
    100 ms) but not before it (-100 to 0 ms).
  source: Results, Pre-stimulus states of neuronal populations reflect task rules, paragraph 3;
    Figure 3D and 3E; Figure S3C and S3D
  quote: we found that neural population activity could be used to discriminate between stimulus
    types (tactile vs visual) after stimulus onset (Fig. 3e and Fig. S3d; 0 to 100 ms relative to
    stimulus onset) but not before stimulus onset
  criterion: As fig3c with stimulus type as the class. Reproduced when, in all four areas, the
    true and shuffled CIs overlap before the stimulus and do not overlap after it; partially
    reproduced when this holds in two or three areas; not reproduced otherwise.
- id: figs3-svm-rf-decoding
  statement: Support vector machines and random forests decode the rule from pre-stimulus
    activity about as well as LDA (median accuracy true against shuffled; SVM S1 0.6 against
    0.53, S2 0.61 against 0.51, MM 0.71 against 0.51, ALM 0.65 against 0.52; random forests S1
    0.59 against 0.52, S2 0.6 against 0.52, MM 0.65 against 0.49, ALM 0.7 against 0.5).
  source: Results, Pre-stimulus states of neuronal populations reflect task rules, paragraph 2;
    Figure S3A and S3B
  quote: Support vector machine (SVM) and Random Forest classifiers showed similar decoding
    abilities
  expected:
  - {quantity: SVM S1, value: 0.60, tolerance: 0.06}
  - {quantity: SVM S2, value: 0.61, tolerance: 0.061}
  - {quantity: SVM MM, value: 0.71, tolerance: 0.071}
  - {quantity: SVM ALM, value: 0.65, tolerance: 0.065}
  - {quantity: RF S1, value: 0.59, tolerance: 0.059}
  - {quantity: RF S2, value: 0.60, tolerance: 0.06}
  - {quantity: RF MM, value: 0.65, tolerance: 0.065}
  - {quantity: RF ALM, value: 0.70, tolerance: 0.07}
  criterion: SVM with a linear kernel and box constraint 1 (MATLAB fitcsvm defaults) with ten-fold
    cross-validation; random forest of 500 trees with the square root of the number of neurons
    tried at each split (TreeBagger defaults), accuracy from out-of-bag predictions; inputs soft
    normalized (Methods), with the code's z-score as a variant for the SVM. Reproduced when at
    least seven of the eight true medians are within tolerance and all exceed their shuffled
    medians; partially reproduced when all exceed their shuffled medians; not reproduced
    otherwise.
- id: fig4c-prestim-distance-predicts-divergence
  statement: Sessions with a larger pre-stimulus distance between tactile hit and correct rejection
    trajectories (top 50% of 40 sessions) show a larger distance after the stimulus than the
    bottom 50% (permutation test, p < 0.001).
  source: Results, Separation of pre-stimulus states predicts subsequent divergent processing,
    paragraph 1; Figure 4B and 4C
  quote: The top 50% group showed a larger mean distance between tHit and tCR trajectories after
    stimulus onset compared with the bottom 50% group
  statistics:
  - test: permutation test
    p: 0.001
    p_relation: "<"
    n: 40 sessions
  criterion: Per session, PCA of the soft-normalized trial-averaged tactile hit and correct
    rejection activity from -100 to 150 ms (10 ms bins, smoothed), single trials projected on
    the top three components, Euclidean distance at each bin averaged over all hit and
    correct-rejection trial pairs. Sessions split at the median of the mean distance from -100
    to 0 ms; statistic the Euclidean norm of the difference between the groups' mean distance
    time courses from 0 to 150 ms; 1000 permutations of the group labels, one-tailed, as the
    code. Reproduced when the top group's mean post-stimulus distance is larger and p < 0.001;
    partially reproduced when it is larger with p < 0.05; not reproduced otherwise. The code
    normalizes by the range without the offset of 5; that is a variant.
- id: fig4e-subspace-overlap
  statement: In all four areas the subspace overlap of tactile correct rejections with tactile hits
    (0 to 150 ms) is lower than that of held-out tactile hits (tCR minus control tHit; S1 -0.23,
    8 sessions, p = 0.0016; S2 -0.23, 7 sessions, p = 0.0086; MM -0.36, 5 sessions, p < 0.001;
    ALM -0.35, 11 sessions, p < 0.001; paired t-test).
  source: Results, Neural subspaces for tactile processing are rule-dependent, paragraph 1; Figure
    4E
  quote: For S1, S2, MM and ALM, subspace overlaps for tCR trials were significantly lower than the
    corresponding subspace overlaps for the control tHit trials
  statistics:
  - about: S1
    test: paired t-test
    p: 0.0016
    n: 8 sessions
  - about: S2
    test: paired t-test
    p: 0.0086
    n: 7 sessions
  - about: MM
    test: paired t-test
    p: 0.001
    p_relation: "<"
    n: 5 sessions
  - about: ALM
    test: paired t-test
    p: 0.001
    p_relation: "<"
    n: 11 sessions
  expected:
  - {quantity: S1 difference, value: -0.23, tolerance: 0.023}
  - {quantity: S2 difference, value: -0.23, tolerance: 0.023}
  - {quantity: MM difference, value: -0.36, tolerance: 0.036}
  - {quantity: ALM difference, value: -0.35, tolerance: 0.035}
  criterion: Per session with at least ten units (Methods; the code keeps sessions with more than
    ten, which is shown as a variant), tactile hit trials split at random into equal reference
    and control halves; PCA (uncentred SVD, as the code) of the soft-normalized reference
    average from 0 to 150 ms; overlap is the variance of a soft-normalized trial average in the
    reference's top three components over its variance in its own top three. The split is
    repeated 100 times with fixed seeds and the overlaps averaged per session; the code's single
    split drawn separately for each neuron, and its normalization with offsets 5 and 0.01, are
    variants. Reproduced when the difference is negative with paired t-test p < 0.05 in all four
    areas and at least three differences are within tolerance; partially reproduced when it is
    negative in all four but fewer are significant or within tolerance; not reproduced when it
    is negative in fewer than three areas.
- id: fig4f-prestim-overlap-predicts-poststim
  statement: Across sessions, the tCR subspace overlap before the stimulus (-100 to 0 ms) correlates
    with that after it (Pearson r = 0.68, p < 0.001, 31 sessions).
  source: Results, Neural subspaces for tactile processing are rule-dependent, paragraph 2; Figure
    4F
  quote: We found that, across the cortical areas, the subspace overlaps for tCR trials calculated
    from periods before and after the tactile stimulus onset were correlated
  statistics:
  - test: Pearson correlation
    statistic: r = 0.68
    p: 0.001
    p_relation: "<"
    n: 31 sessions
  depends_on:
  - fig4e-subspace-overlap
  expected:
  - {quantity: Pearson r, value: 0.68, tolerance: 0.068}
  criterion: Sessions and overlaps as fig4e, the pre-stimulus average of tactile correct rejections
    projected on the reference tactile hit components. Reproduced when r is within tolerance
    with p < 0.001; partially reproduced when r is positive with p < 0.05; not reproduced
    otherwise.
- id: figs4ef-coding-dimensions
  statement: Stimulus coding dimensions are aligned between the two rules in S1, S2 and MM but not
