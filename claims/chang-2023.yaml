- id: fig3c-rule-decoding-motor-stronger
  statement: Rule decoding is robust in the motor areas, whose bootstrap 95% CIs of mean accuracy
    do not overlap those of shuffled data (MM 0.60 to 0.73 against 0.48 to 0.53; ALM 0.56 to
    0.66 against 0.49 to 0.54), and limited in the sensory areas, whose true CIs are above 0.5
    but overlap the shuffled ones (S1 0.52 to 0.61 against 0.49 to 0.55; S2 0.53 to 0.63
