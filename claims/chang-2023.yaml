- id: fig5b-first-hit-switches
  statement: Mice switched before or immediately after the cue on the 9th trial; there were 88
    switches into respond-to-touch blocks and 91 into respond-to-light blocks.
  source: Results, Pre-stimulus states in motor cortex track behavioral rule switches, paragraph 1;
    Figure 5B
  quote: "We used the first hit trial as the mark of a successful behavioral switch and found that
    mice switched before or immediately after the cue (Fig. 5b, total number of block switches:
    respond-to-touch: 88 switches, respond-to-light: 91 switches)"
  expected:
  - {quantity: switches into touch blocks, value: 88, tolerance: 8.8}
  - {quantity: switches into light blocks, value: 91, tolerance: 9.1}
  criterion: Over the 40 recording sessions, blocks other than the first of a session that contain
    a hit, as the code's GetFirstHitInfo. The code numbers trials by the behavioural system,
    including trials the dandiset does not hold, so the first hit is placed relative to the
    cue trial, which the files keep. Reproduced when both counts are within tolerance and, in
    each block type, more than half of the first hits come before the cue trial or on the trial
    after it; partially reproduced when one of the three conditions fails.
