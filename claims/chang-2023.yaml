  quote: In ALM, the dot product magnitudes calculated between stimulus CDs for the two block types
    were not significantly different from those calculated after shuffling ... S1, S2 and MM had
    stimulus CDs that were significantly aligned ... the choice CDs for the two block types were not
    aligned well in S1, S2, MM, or ALM
  statistics:
  - about: S1 stimulus CD, true
    test: bootstrap
    ci:
