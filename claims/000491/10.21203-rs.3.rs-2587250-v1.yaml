claims:
- id: cross-section-counts
  statement: After excluding cross sections near the edge of the imaging volume, each of the 14
    PVS segments yields between 54 and 451 normal cross sections, about 0.8 um apart.
  source: Methods, Creating normal cross sections
  quote: This resulted in between 54 and 451 different cross sections for each of the 14 PVS
    segments that were included in the subsequent analysis. The average distance between normal
    planes was approximately 0.8 μ m.
  expected:
  - quantity: fewest cross sections in a segment
    value: 54
    tolerance: 5.4
  - quantity: most cross sections in a segment
    value: 451
    tolerance: 45.1
  - quantity: mean distance between normal planes
    value: 0.8
    tolerance: 0.08
    unit: um
  criterion: Pipeline P1 to P4 of the opening comment, one slice per centerline point. The
    claim holds under a reading when the fewest and most cross sections per segment lie in
    the range 54 to 451 widened by 10% of each bound, and the mean spacing is within
    tolerance. Every combination of readings of P1, P2 and P4 is run.
- id: segmentation-validation-overlap
  statement: Where a high signal-to-noise 2D time-averaged image was acquired, the 3D
    segmentation at the matching depth overlaps the 2D segmentation by at least 70% of the
    union area, for both PVS and vessel.
  source: Methods, Image Segmentation, last paragraph; Figure 2 legend
  quote: To consider the segmentation successful, at least 70% of the area had to overlap in
    both PVS and vessel ... The 3D segmentation and 2D segmentation match over 70% which gives
    confidence that 3D segmentation is accurate.
  expected:
    quantity: smallest overlap, intersection over union of 2D and 3D segmentations
    value: 0.7
    tolerance: 0
  criterion: Overlap as Equation 1, the area of the intersection over the area of the union of
    the 2D and 3D segmentations at the depth that minimizes their difference, after aligning the
    fields of view (the registration of Boster et al., reference 31, is not described here). The
    2D segmentations must come with the data, since the paper's thresholds for them are not
    given. Reproduced when every validated segment has overlap of at least 0.70 for both PVS and
    vessel. The 70% is the paper's acceptance threshold, so no tolerance applies.
