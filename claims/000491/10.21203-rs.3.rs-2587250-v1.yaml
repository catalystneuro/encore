# Claims for Raicevic, Forer, Ladron-de-Guevara, Du, Nedergaard, Kelley & Boster (2023), "Sizes
# and Shapes of Perivascular Spaces Surrounding Murine Pial Arteries", on dandiset 000491.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read. The Research Square preprint, version 1 (doi:10.21203/rs.3.rs-2587250/v1), full text
# as served by PubMed Central (PMC9949243): Background, Methods, Results, Discussion, figure
# legends and Tables 1 to 3. The version of record (Fluids and Barriers of the CNS 20, 56, 2023,
# doi:10.1186/s12987-023-00454-z) was not read. Additional Files 1 to 6 were not in the text:
# File 1 is the full description of the segmentation (the main Methods give the approach used),
# Files 2 to 6 are figures (average images, fits, and per-location distributions of area ratio
# and resistance). The per-location numbers the claims use are stated in the main Results. The
# Results cite "Additional File 3" for per-location area ratios, which the file list names
# Additional File 4. No PDF was supplied. The paper links no code (data "available from the
# corresponding author upon reasonable request"; the authors' contributions say the code is
# MATLAB, written by KASB and JF), so no repository was read and no detail is settled by code.
#
# Data the paper used. 14 pial periarterial PVS segments (locations A to N) in 9 wild-type mice
# (BPN/3J or beta-actin-GFP on C57BL/6, male and female, 8 to 12 weeks), ketamine/xylazine
# anesthesia, cranial window over the MCA territory, intracisternal BSA-647 or BSA-594 CSF tracer,
# intravascular FITC-dextran. 3D two-photon stacks, 512 by 512 pixels, 0.648 um per pixel in the
# transverse plane and 1 um per step in depth, 16 bit. The PVS and vessel were segmented with a
# depth-varying threshold (Edge Finder, with manual refinement; Mean + Standard Deviation for
# locations G, I and J, J for the PVS only), small regions removed, the largest vessel region and
# two largest PVS regions kept, holes filled, branching vessels removed by hand, overlaps resolved
# by hand. Between 54 and 451 cross sections normal to the vessel centerline per segment, about
# 0.8 um apart. Measured per cross section: segmented PVS and vessel areas, PVS-to-vessel area
# ratio, hydraulic resistance per unit length of the segmented PVS and of three fits (ellipse,
# spline, polynomial) and of the optimal elliptical annulus, and the fit parameters (ellipse R1,
# R2, R3, Oh, Ov; polynomial R1, H1, H2, H3, HC, WS, WL).
# The dandiset description says it holds, for the 14 datasets of 9 subjects, the 3D stacks in
# three channels and the final binary segmentation of PVS and vessel used for the paper, and maps
# subjects to the paper's mice and locations: sub-BPN-OLD-M2 (mouse 1, A and B), sub-BPN-OLD-M3
# (mouse 2, C and D), sub-BPN-M4 (mouse 3, E and F), sub-BPN-M6 (mouse 4, G and H), sub-BPN-M7
# (mouse 5, I and J), sub-21-07-19-b-act (mouse 6, K), sub-21-10-08-b-act (mouse 7, L),
# sub-21-09-01-b-act (mouse 8, M), sub-21-09-20-b-act (mouse 9, N). The 2D time series used to
# validate the segmentation are not named in the description.
#
# The common pipeline, from the Methods, with the details they leave open and the readings
# each claim runs where the detail could change its outcome. Start from the deposited final
# segmentations (the paper's segmentation step includes manual work that cannot be redone).
# (P1) Resample the masks to isotropic resolution. Open, the target voxel size. Readings
#   (a) 0.648 um (depth upsampled), (b) 1 um (transverse downsampled).
# (P2) Vessel centerline from MATLAB bwskel (or an equivalent 3D skeleton), erroneous points
#   removed by hand. Open, which points were removed. Readings (a) the longest path through the
#   skeleton, side branches dropped, (b) all skeleton points.
# (P3) Second-order polynomials fit to the centerline points in the transverse plane and in the
#   axial plane (XZ or YZ, by vessel orientation); the normal at each center point from the cross
#   product of vectors perpendicular to the two fits; slices taken with obliqueslice (or an
#   equivalent oblique resampling) and shifted so the vessel center is at the image center.
#   Orientation within the slice. "Top" in the paper is the brain surface side (the vessel bottom
#   is the deep side where red blood cells attenuate the signal, Methods, Idealized geometries),
#   so the slice's vertical axis is the projection of the depth axis, top toward the surface;
#   left and right follow from a fixed direction along the centerline. This is a reading of the
#   Methods and Figures 3 and 4; the paper does not state it.
# (P4) Exclude a cross section when the distance from the vessel center to the edge of the
#   imaging plane is less than the median width of the PVS divided by 2.5. Open, how the PVS
#   width is measured and over what the median is taken. Readings (a) the horizontal extent of
#   the PVS segmentation in each slice, median over the segment's slices, (b) the polynomial-fit
#   width W (vessel edge to PVS end, Figure 4), median over the segment's slices and both sides.
#   Open also whether the distance is measured in the slice or in the 3D volume; the slice
#   reading is used, as the criterion is stated for the imaging plane.
# (P5) Areas from the segmentation in each slice. The area ratio is PVS area over vessel area.
#   Open, for the segmentation's ratio, the vessel area. Readings (a) the segmented vessel area
#   (Figure 5A plots segmented areas), (b) the area of the fitted circle, pi R1^2 (the vessel fit
#   is used for all fits). For the fits, open also, the vessel area. Readings (a) the fitted
#   circle, pi R1^2 (the Methods use the same vessel fit for all three fits), (b) the segmented
#   vessel area. The spline shape is fixed by R1 alone, so under (a) its ratio would be constant
#   up to pixelation, yet Table 2 gives it an IQR of 0.3 (1.45 to 1.75); the paper does not
#   say which it used.
# (P6) Vessel circle fit to edge points of the vessel segmentation, excluding edge points inside
#   the eroded convex hull of the segmentation. Open, the erosion size and the circle-fitting
#   method. Readings, erosion by 1, 3 and 5 pixels; algebraic least-squares circle fit (a
#   standard choice; the paper names none).
# (P7) Distribution peak (Methods, Defining the distribution peak), the center of the bin of
#   largest probability density among 20 evenly spaced bins. Open, the range binned. Readings
#   (a) minimum to maximum of all values, (b) the values left after removing outliers as the
#   Methods define them (more than 1.5 IQR above the 75th or below the 25th percentile), as the
#   plotted distributions do. Percentiles from all values.
# (P8) Hydraulic resistance per unit length, Poiseuille flow, Poisson's equation solved by finite
#   elements on a triangular mesh (MATLAB solvepde), with no-slip on the PVS boundary, after the
#   PVS region is eroded by one pixel; mesh refined until the resistance of a circle of the same
#   area is within 1% of the exact value; viscosity 7.058e-4 Pa s; R = (dP/dn)/Q. Both PVS
#   lobes form one cross section, Q summed over them (a reading; the paper treats the cross
#   section as one channel). The pixel size follows P1.
# (P9) Fits (Methods, Idealized geometries; Figure 4; Table 1). Ellipse, the ellipse with the
#   centroid and second central moments of the PVS segmentation in the slice (both lobes
#   together), R2 and R3 its semi-major and semi-minor axes, Oh and Ov the horizontal and
#   vertical offsets of the vessel center from the ellipse center. Open, the PVS region of the
#   ellipse fit. Readings (a) the ellipse minus its overlap with the circle, (b) ellipse area
#   minus circle area. Spline, six control points at horizontal 0, R1, 2R1, 3R1, 4R1, 5R1 from the
#   vessel center and vertical 1.1111, 0.85, 0.2667, 0.1111, 0.1111, 0.1111 R1 above the PVS
#   midline, joined by a spline and mirrored about both axes, the vessel center 0.0667 R1 below
#   the midline (Table 1 and Methods); open, the spline type, reading an interpolating cubic
#   spline (a standard choice). Polynomial, a line fit by least squares to points on the top
#   edge of the PVS, and on each side of the vessel a second-order polynomial fit by least squares
#   to points on the bottom edge. Open, which pixels are edge points and where each side ends.
#   Reading, per image column crossing the PVS, the topmost PVS pixel for the line and the
#   bottommost for the polynomial of that side, columns outside the vessel's horizontal extent
#   for the bottom; each side ends at the outermost PVS column on it. The parameters as the
#   Figure 4 legend defines them, W from the vessel edge to the end of the PVS (WS and WL the
#   shorter and longer side), HC from the top of the vessel to the line, H1 the height next to
#   the vessel, H2 midway, H3 at the end, each height between the line and the polynomial.
#   The polynomial PVS region is bounded by the line above, the polynomials below, the PVS ends
#   and the circle.
# Table 2's 25th and 75th percentiles and IQRs of resistance are garbled in the text (the 75th
# percentile is printed below the median, exponents appear lost); they are not used. The
# spline column is doubtful as a whole (its printed median 2.58e15 and 75th percentile 7.07e15
# lie below its peak 1.07e16), so its median is not used either. Table 3's
# dimensional values (R1 peak 64.9 um, median 139 um) disagree with the vessel radius peak of
# 28 um that the Results and Discussion give and are not used; its ratios are.
