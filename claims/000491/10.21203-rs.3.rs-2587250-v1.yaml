    resistance to segmented resistance is below 1, (b) the peak and the median of the fit's (or
    annulus's) resistance distribution are below the segmentation's (Table 2 has ellipse 7.06e14
    and 1.55e15, annulus 1.32e15 and 2.49e15, segmentation 1.73e15 and 3.84e15). "Very similar"
    has no measure either, and the paper's own Table 2 values are not within 10% of each other
    (annulus over ellipse, 1.87 for the peaks and 1.61 for the medians), so a 10% closeness test
    would fail the paper's own numbers; the Optimal model section also says the annulus is more
    similar to the segmentation than the ellipse fit is. Similarity is therefore judged against
    the paper's numbers, the annulus-over-ellipse ratios of peak and median within 10% of 1.87
    and 1.61. Reproduced when, under one reading, both underestimate and the two ratios are
    within tolerance; partially reproduced when only the underestimation holds.
- id: spline-resistance-five-times
  statement: The spline fit's resistance is considerably larger than the segmentation's, its
    distribution peak about 5 times larger, despite a larger area ratio, because the spline PVS
    narrows rapidly away from the vessel.
  source: Results, Hydraulic Resistance, paragraph 3; Figure 6B inset
  quote: The resistance for the spline fit is considerably larger than that of the segmentation
    (distribution peak is 5 times larger)
  expected:
    quantity: ratio of spline peak resistance to segmentation peak resistance
    value: 5
    tolerance: 0.5
  depends_on:
  - fig6b-resistance-segmentation-peak
  - fig5b-polynomial-closest-resistance
  criterion: Peaks as in the claims it depends on. Table 2 gives 1.07e16 over 1.73e15, a ratio
    of 6.2, which the text calls 5; readings (a) the text's 5 with 10% tolerance, (b) Table 2's
    6.2 with 10% tolerance. Reproduced when the ratio is within tolerance under one reading and
    the median spline resistance exceeds the median segmented resistance.
- id: fig7-velocity-profiles
  statement: In a representative cross section, the polynomial fit's velocity profile resembles
    the segmentation's, the ellipse fit gives much higher velocities and the spline fit much
    lower; these trends are generally consistent across cross sections.
  source: Results, Hydraulic Resistance, paragraph 4; Figure 7 legend
  quote: In this example case, the velocity profile for the polynomial fit is similar to the
    velocity profile in the segmentation, whereas the ellipse fit results in much higher
    velocities, and the spline fit results in much lower velocities.
  criterion: Pipeline P1 to P9, velocity from the Poisson solution at a pressure gradient of
    500 Pa/m (Methods). The representative cross section is not identified, so the claim is
    tested over all cross sections, as the text's "generally consistent in all cross sections"
    allows. Open, the velocity measure. Readings (a) maximum velocity, (b) mean velocity (flow
    rate over area). Reproduced when, under one reading, in more than half the cross sections
    the ellipse fit is faster than the segmentation, the spline fit slower, and the polynomial
    fit closer to the segmentation than either.
- id: vessel-radius-peak
  statement: The fitted vessel radius distribution peaks at 28 um.
  source: Discussion, paragraph 2; Results, Characteristics of the typical PVS shape, paragraph
    2; Figure 8A and 9C
  quote: We approximated the cross-sectional shape of the vessel as a circle and found that the
    peak of the vessel radius distribution is 28 μ m
  expected:
    quantity: peak of vessel radius R1
    value: 28
    tolerance: 2.8
    unit: um
  criterion: Pipeline P1 to P4, P6 and P7. Reproduced when, under one combination of readings,
    the peak is within tolerance. Table 3 gives an R1 peak of 64.9 um, which disagrees; it is
    not used (opening comment).
- id: fig8-ellipse-parameters
  statement: The ellipse fit shows an elongated, eccentric PVS with the vessel slightly below its
    center; R1 peaks at 28 um and R3 at 35 um, R3/R1 at 0.80, R2/R1 at 2.89, R3/R2 at 0.398, the
    vertical offset Ov at 0.24, and the horizontal offset Oh is centered near zero with a much
    wider distribution than Ov.
  source: Results, Characteristics of the typical PVS shape, paragraphs 2 to 5; Figure 8A, 8C,
    8D, 8E and 8F
  quote: the distribution of R 1 , the vessel radius, is similar to that of R 3 , the minor axis
    length (distribution peaks at 28 μ m and 35 μ m, respectively, see Figure 8A ), and the ratio
    between them ( R 3 / R 1 ) is generally close to 1 (distribution peaks at 0.80, Figure 8E )
  expected:
  - quantity: peak of R3
    value: 35
    tolerance: 3.5
    unit: um
  - quantity: peak of R3/R1
    value: 0.8
    tolerance: 0.08
  - quantity: peak of R2/R1
    value: 2.89
    tolerance: 0.289
  - quantity: peak of R3/R2
    value: 0.398
    tolerance: 0.0398
  - quantity: peak of Ov
    value: 0.24
    tolerance: 0.024
  depends_on:
  - vessel-radius-peak
  criterion: Pipeline P1 to P4, P6, P7 and P9 (ellipse). Open, the units of Ov and Oh, printed
    without units. Readings (a) offsets over R1, (b) over R3, (c) in um. Ov positive when the
    vessel is below the ellipse center, as the text reads it. Oh "centered around zero" and
    "much wider" are read as the median of Oh within one Ov peak value of zero and the IQR of Oh
    at least twice the IQR of Ov. Reproduced when, under one combination of readings, all
    values are within tolerance and the Oh conditions hold; partially reproduced when the
    ratios R3/R1, R2/R1 and R3/R2 are within tolerance and the rest is not.
- id: fig9c-pvs-two-lobes
  statement: The PVS usually consists of two mostly or entirely disconnected lobes on either side
    of the vessel; the polynomial fit's HC (top of PVS above top of vessel) peaks at zero, and
    when the lobes connect the channel is narrow, usually less than 0.5 R1.
  source: Results, Characteristics of the typical PVS shape, paragraph 2; Figure 9C; Table 3
  quote: The distribution peaks at zero ( Figure 9C ), suggesting that the top of the vessel is
    most often very nearly aligned with the top of the PVS and that the PVS is often separated
    into two lobes. Even when the two sides are connected, the channel connecting them is quite
    narrow, usually less than 0.5 R 1 .
  expected:
    quantity: peak of HC/R1 (Table 3)
    value: 0.000689
    tolerance: 0.1
  criterion: Pipeline P1 to P4, P6, P7 and P9 (polynomial). A 10% tolerance on a value near zero
    is meaningless; the tolerance is one tenth of R1 (0.1 in HC/R1), the scale of the paper's
    0.5 R1 statement; this is a choice and is recorded as a deviation. Reproduced when, under
    one combination of readings, the peak of HC/R1 is within 0.1 of zero and, among cross
    sections with HC greater than zero, more than half have HC below 0.5 R1.
- id: fig9e-pvs-width-asymmetry
  statement: The PVS is about twice as wide as the vessel radius and asymmetric about the vessel;
    the short-side width WS/R1 peaks near 1.1, the long-side width WL/R1 near 1.9, and WS/WL near
    0.5.
  source: Results, Characteristics of the typical PVS shape, paragraphs 3 and 5; Figure 9E;
    Table 3
  quote: The short side is significantly shorter than the long side (distribution peaks of 1.1
    and 1.9, respectively, Figure 9E ) and for the ratio between them, W S / W L , the
    distribution peaks at approximately 0.5, indicating that the two PVS sides are typically
    asymmetric
  expected:
  - quantity: peak of WS/R1 (Table 3)
    value: 1.08
    tolerance: 0.108
  - quantity: peak of WL/R1 (Table 3)
    value: 1.85
    tolerance: 0.185
  - quantity: peak of WS/WL (Table 3)
    value: 0.502
    tolerance: 0.0502
  criterion: Pipeline P1 to P4, P6, P7 and P9 (polynomial). The Results also say WS/R1 peaks at
    1.85, which Table 3 and the sentence quoted give for WL/R1; Table 3 is followed. The paper
    reports no test for "significantly shorter", and WS is by definition no longer than WL.
    Reproduced when, under one combination of readings, the three peaks are within tolerance.
- id: left-right-no-difference
  statement: The PVS widths on the left and right sides of the vessel do not differ
    significantly.
  source: Results, Characteristics of the typical PVS shape, paragraph 5
  quote: Since there was no statistically significant difference between the left and right
    sides, we report the distribution of the short ( W S ) and long ( W L ) sides of each cross
    section.
  criterion: A claim of absence whose test the paper does not name. Widths W of the polynomial
    fit on each side (P9), left and right fixed by the direction along the centerline (P3).
    Readings (a) Wilcoxon signed-rank test on paired left and right widths over all cross
    sections, (b) two-sample Kolmogorov-Smirnov test of the two distributions, (c) Wilcoxon
    signed-rank test on the per-segment median left and right widths (14 pairs); alpha 0.05.
    Reproduced when no reading finds a difference, not reproduced when all do, otherwise
    methods_underspecified. The median difference and its sign are shown for each.
- id: fig9a-heights-taper
  statement: The PVS is tallest next to the vessel and narrows far from it; the heights H1/R1,
    H2/R1 and H3/R1 peak at 1.34, 0.792 and 0.307, so H1 is about 4 times H3.
  source: Results, Characteristics of the typical PVS shape, paragraph 6; Figure 9A; Table 3
  quote: the distributions of heights of the PVS, H 1 , H 2 , and H 3 , peak at 1.34, 0.792, and
    0.307, respectively, indicating that the PVS is larger closer to the vessel and smaller at
    the ends of the PVS. H 1 , the height of the PVS close to the vessel, is 4 times larger than
    H 3
  expected:
  - quantity: peak of H1/R1
    value: 1.34
    tolerance: 0.134
  - quantity: peak of H2/R1
    value: 0.792
    tolerance: 0.0792
  - quantity: peak of H3/R1
    value: 0.307
    tolerance: 0.0307
  criterion: Pipeline P1 to P4, P6, P7 and P9 (polynomial), heights per side; open, whether each
    cross section contributes both sides or their mean. Readings (a) both sides pooled, (b)
    mean of the two sides. Reproduced when, under one combination of readings, the three peaks
    are within tolerance; partially reproduced when the order H1 above H2 above H3 holds for
    the peaks and medians but the values are not within tolerance.
- id: fig9f-pvs-concave
  statement: The bottom edge of the PVS is most often concave; the distribution of (H2 - H3)/(H1
    - H2) peaks at 0.108, below the value of 1 that separates concave from convex.
  source: Results, Characteristics of the typical PVS shape, paragraph 7; Figure 9F
  quote: The peak of the curvature distribution is 0.108, showing that the PVS is most often
    concave
  expected:
    quantity: peak of (H2 - H3)/(H1 - H2)
    value: 0.108
    tolerance: 0.0108
  depends_on:
  - fig9a-heights-taper
  criterion: As fig9a-heights-taper, with the same readings. Reproduced when, under one
    combination of readings, the peak is within tolerance and more than half the values are
    below 1; partially reproduced when only the second holds.
