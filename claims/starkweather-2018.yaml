  source: Results, KORD Inactivates mPFC Neurons, paragraph 1; Figure S1D and S1E legend
  quote: Wilcoxon rank-sum test revealed the distribution was significantly shifted post-injection in
    the SalB condition (z = 3.93, p = 8.6 × 10-5) but not the Saline condition (z = 1.72, p = 0.084)
  statistics:
  - about: time bin of maximal auROC, before against after SalB
    test: Wilcoxon rank-sum test
    statistic: z = 3.93
    p: 8.6e-5
  - about: time bin of maximal auROC, before against after saline
    test: Wilcoxon rank-sum test
    statistic: z = 1.72
    p: 0.084
  data: dataset
