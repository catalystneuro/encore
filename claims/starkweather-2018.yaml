# Claims for Starkweather, Gershman & Uchida (2018), Neuron 98, 616-629, tested on CRCNS vta-1.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-11-10, protocol pilot-14 as stated in docs/protocol.md.
#
# Text read: the version of record (paper/10.1016-j.neuron.2018.03.036.txt, supplied by a
# person), with its STAR Methods and the Supplemental Information (legends of Figures S1 to
# S8). The PDF could not be rendered here, so numbers printed only inside figures were read
# from the extracted text; the claims that rest on them say so.
#
# Code read: https://github.com/cstarkweather/Starkweather2018 at commit d667730 (the
# "GitHub link" of Code Availability points to the account; this is its repository for the
# paper). It holds only the belief state TD model (training, simulation, plotting, MATLAB).
# No analysis code for the recordings is linked, so every method for the recorded data comes
# from the Methods and legends. The code differs from the Methods in two settings of the
# simulation script (allSimulations_Saline_SalB.m) as committed, 10 simulations where the
# legends say 50, and every simulation intact (belief_impaired_dist all zeros) where the text
# says 60% impaired; the Methods are followed and the code's settings are variants.
#
# Data the paper used. 12 male DAT-Cre mice. Dopamine recordings in the left VTA of 8
# KORD-expressing mice, 4 trained on task 1 (odors A to C rewarded in 100% of trials) and 4 on
# task 2 (90%); 2 more task 2 mice without KORD, injected with SalB (Figure S6F to S6H); 2
# mice with tetrodes in the mPFC to test KORD (Figure 2), and one task 1 mouse with an mPFC
# tetrode as well (Figure S6A to S6E). Each recording day began with a subcutaneous injection
# of saline (control) or SalB (mPFC inactivation); recording began 15 min after SalB and the
# first 40 min after recording onset are analysed. Trials. Odor A (1 s odor, reward 1.2 to 2.8
# s after odor onset in 9 steps of 0.2 s, Gaussian, mean 2 s, SD 0.5 s), odor B (1.2 s), odor
# C (2.8 s), odor D (unrewarded); omission trials of A to C in task 2; free water deliveries
# outside cued trials. ITI exponential, mean 12 s; 150 to 300 trials per session. Units are
# light-identified dopamine neurons (SALT p < 0.05 within 10 ms, waveform correlation > 0.9,
# latency below 10 ms with jitter < 3 ms). Neuron counts by group, odor A analyses (Figure 4),
# task 1 saline 42, task 1 SalB 42, task 2 saline 41, task 2 SalB 47; 26 neurons in the no-KORD
# controls. Measured variables are spike times, odor and reward times, trial types, and licks
# (infrared beam). The CRCNS description of vta-1 lists one file per light-identified dopamine
# neuron with odor onsets, reward onsets, spike times and trial types, named by task and drug;
# it lists no licks, no mPFC units and no unidentified VTA neurons. Whether the dataset holds
# what each claim needs is the author's to find.
#
# Method details fixed here from the paper (Methods, Data analysis, unless said otherwise).
# Post-reward response, spikes 50 to 200 ms after reward onset. Pre-reward response, spikes
# before reward onset, 0 to 400 ms in the Methods and 0 to 200 ms in the Figure 4A legend; the
# two are readings of the pre-reward claims. Both baseline-subtracted, baseline 0 to 1 s
# before odor onset; responses as firing rates (spikes/s; figures). Omission response, spikes
# 0 to 1000 ms after the usual reward time. Free water response, spikes 0 to 300 ms after
# reward onset, counted only when 4 or more licks follow within 1 s. The two-way ANOVAs
# (factors ISI and neuron, Statistics) are taken on one value per neuron and ISI, the mean
# over trials, without interaction, as their degrees of freedom imply (F(8, 328) for 42
# neurons is 8 and 8 x 41). Slopes of individual neurons, a straight line fit of post-reward
# response on ISI over that neuron's rewarded odor A trials (Results, Individual neurons;
# Statistics); a slope is significant when its p < 0.05 or its 95% confidence interval
# excludes 0 (Figure 5 legend). Tests are two-tailed with alpha 0.05 (Data analysis).
# Open, and named where it bears on a claim. Whether baseline is subtracted trial by trial or
# as a neuron's mean; whether the free water lick criterion can be applied when licks are not
# in the data (readings, with the criterion where licks exist, or all free water deliveries);
# the observation unit of the ANOVAs that mix tasks and drug, whose degrees of freedom do not
# follow from the neuron counts.
