- id: fig2-kord-suppresses-mpfc
  statement: After SalB injection in KORD-expressing mice, more than 60% of recorded mPFC
    neurons fell below half their pre-injection firing rate, and these suppressed neurons fell
    to less than 20% of their pre-injection rate within 15 min.
  source: Results, KORD Inactivates mPFC Neurons, paragraph 1; Figure 2F to 2H
  quote: More than 60% of recorded neurons suppressed their averaged firing rates to below half of
    their pre-injection rates (Figures 2F-2H). On average, these suppressed neurons decreased their
    firing rates to less than 20% of their pre-injection rates within 15 min post-SalB injection
  data: dataset
  expected:
  - quantity: fraction of mPFC neurons suppressed below half of baseline after SalB
    value: 0.6
    tolerance: 0.06
  criterion: mPFC units of the two mPFC-implanted mice. A neuron is inhibited when its firing
    rate more than 15 min after SalB injection is below half its pre-injection rate (Figure 2F
    and 2G legends). Reproduced when the inhibited fraction among SalB-session neurons exceeds
    0.54 (the reported bound less 10%) and the mean normalized rate of inhibited neurons is
    below 0.2 by 15 min after injection. These recordings are not described in vta-1.
