- id: fig3dfh-projections-and-rhythm-site
  statement: ALM and latSC axons targeted the contralateral brainstem and engulfed the
    tongue-jaw premotor regions; constant photostimulation of Phox2b+ neurons in the
    posterior-dorsal IRN/PARN elicited rhythmic licking, while anterior sites locked the jaw.
  source: Results, A licking premotor network with autonomous rhythm-generation properties,
    paragraphs 4 and 5; Figure 3d, 3f, 3g and 3h
