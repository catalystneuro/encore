- id: ed8bc-prebotc-inspiration-phase
  statement: Breathing-related units in the preBotzinger complex preferentially fired at the
    inspiration phase of breathing.
  source: Results, Brainstem activity maps of orofacial rhythms, paragraph 5; Extended Data
    Figure 8a-c
  quote: units in the preBötzinger complex preferentially fired at inspiration phase of breathing
  depends_on:
  - fig2-licking-breathing-tuned-counts
  criterion: Preferred phases of the fitted tuning curves (header), breathing units by O1 (b)
