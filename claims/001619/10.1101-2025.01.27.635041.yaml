  source: Results, Brainstem activity maps of orofacial rhythms, paragraph 6; Extended Data
    Figure 7g-h
  quote: the only exceptions were units in the preBötzinger complex where activity prediction
    using CAE led to worse predictions (CAE vs. features, P<0.001, Wilcoxon signed rank test
  statistics:
  - test: Wilcoxon signed rank test
    p: 0.001
    p_relation: "<"
  depends_on:
  - ed7g-cae-better-than-features
  criterion: As ed7g-cae-better-than-features, for units near the preBotzinger complex (O3 (a)
