  source: Results, A licking premotor network with autonomous rhythm-generation properties,
    paragraph 3; Figure 3b
  quote: Units inside these regions showed significantly higher licking modulation compared to
    position-shuffled populations (P < 0.001 Wilcoxon rank sum test)
  statistics:
  - test: Wilcoxon rank sum test
    p: 0.001
    p_relation: "<"
  data: with_inputs
