  quote: Units with licking-related activity were mostly active when the tongue was in the fully
    protruded state
  depends_on:
  - fig2-licking-breathing-tuned-counts
  criterion: Licking units by O1 (b). For each session, the jaw phase at the frame of maximal
    tongue protrusion in each lick (the frame of largest 3D tongue distance from its onset
    position; the paper does not define full protrusion, a standard choice named here) gives
    the protrusion phase; a unit's preferred phase is compared with its session's circular
    median protrusion phase. Reproduced when more than half of licking units prefer a phase
    within pi/2 of it (a standard choice, named here).
- id: ed8i-ipsilateral-lick-selectivity
  statement: Licking-related neurons showed selectivity for ipsilateral licking, while
    individual units within each hemisphere had diverse direction preferences, including the
    center direction.
  source: Results, Brainstem activity maps of orofacial rhythms, paragraph 7; Extended Data
    Figure 8g-i
  quote: Overall, licking-related neurons showed selectivity for ipsilateral licking (Extended Data
    Figure 8i)
  depends_on:
  - fig2-licking-breathing-tuned-counts
