    given. The three classes sum to 33 of the 46 sites of Figure 3h; the paper does not say how
    the other 13 were classed, or whether the 4 transient sites are among the 11. Reproduced
    when the counts are within tolerance and the peak of the mean spectrum of rhythmic sites is
