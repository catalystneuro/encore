- id: fig3ce-descending-stimulation-rhythmic-licking
  statement: Photostimulation of ALM (n = 11 mice) or latSC (n = 3 mice) elicited sustained
    rhythmic licking at the naturalistic 7 Hz frequency.
  source: Results, A licking premotor network with autonomous rhythm-generation properties,
    paragraph 4; Figure 3c and 3e
  quote: Photostimulation of ALM or latSC (20 or 40 Hz pulse trains for 2 or 1.3 s) elicited
    sustained rhythmic licking at the naturalistic 7 Hz frequency (Figure 3c and e)
  expected:
    quantity: lick rate during photostimulation
    value: 7
    tolerance: 0.7
    unit: Hz
  criterion: Photostimulation trials of the ALM mice (cued licking task) and latSC mice. Lick
