# Claims for Kaku, Liu et al. (2025), "A brainstem map of orofacial rhythms", bioRxiv
# doi:10.1101/2025.01.27.635041, on dandiset 001619.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the bioRxiv preprint, version 1 (posted January 27, 2025), as served on its web
# page, stored in paper/10.1101-2025.01.27.635041.txt: main text, legends of Figures 1 to 5,
# Methods and references, and the supplement "Extended Data Figures" (the legends of Extended
# Data Figures 1 to 12, from the supplement PDF, extracted to text). The display equations of
# the Methods (the circular Gaussian tuning curve and the VAF) are missing from the text; the
# words around them name every term. The Figure 5 legend stops at panel f, although the
# Results cite a Figure 5g. No later version was read. Data the dandiset description names: its
# title and description only (no data or file was looked at).
#
# Code read: github.com/NuoLiLabBCM/KakuEtAl2025 at commit fbc0abe (2026-06-18). The preprint
# says "Code used for analyses will be deposited upon publication"; this repository is the one
# the dandiset description names as "the corresponding analysis code", and its README points
# at the preprint v1 and at dandiset 001619. It holds process_mat.py (unit quality filter,
# trial filter, tongue and inspiration onsets, lick bouts, licking and breathing phase tuning
# and modulation index, the lick-to-breath and breath-to-lick timing analyses of Figs 1f-i and
# 4e-f, the swallow detector, swallow-aligned licks and breaths, swallow modulation index),
# generate_figures.py (plots of Figs 1, 2 and 4; no statistical test), generate_activity_maps.m
# (the activity maps of Fig 2f-h) and Kuramoto_model_simulations/ (coupled-oscillator
# simulations that the preprint v1 does not describe; not used here). The code does not hold
# the Fig 1d frequency statistics, the GLM and CAE, lick direction tuning, the cross-correlation
# analysis, the analyses of the cued licking task (Figs 3c-h, 4a-c, 5), the rat analysis, the
# simulations of Extended Data Fig 1d-i, or any statistical test.
#
# Data the paper used, as it reports them (Methods, Mice and following sections).
#  - Electrophysiology: 31 VGAT-ChR2-EYFP mice (22 male, 9 female), 339 insertions of one or two
#    Neuropixels 1.0 probes (bank 0, 384 sites), Kilosort 2.5, 20,300 single units after quality
#    control (5,700 cerebellum, 3,700 pons, 10,900 medulla), each localized in Allen CCFv3. Mice
#    performed a multi-directional licking task: a 2 uL drop on a spout at one of nine targets,
#    4 s to lick, 40 trials per target, 2 s intertrial interval. Airflow (breathing) at 25 kHz in
#    SpikeGLX; side (400 x 480) and bottom (720 x 540) videos at 3.4 ms per frame, DeepLabCut
#    tracking of jaw, tongue and lickport tips in both views, combined into 3D.
#  - Simultaneous licking- and breathing-oscillator recordings (Fig 4d-h): 43 recordings in 21
#    mice, two probes, posterior-dorsal IRN/PARN and preBotzinger complex; Extended Data Fig 12c
#    places them in the cued licking task.
#  - ALM photostimulation: 11 mice (9 Sim1_KJ18-Cre and 2 Tlx_PL56-Cre, crossed to Ai32), cued
#    licking task (3.4 kHz Go cue, 0.1 s; 25-50% of trials replaced by 2 s of 20 Hz light, no
#    reward), with breathing and video. latSC photostimulation: 3 mice, no task. Brainstem
#    photostimulation: 27 Phox2b-Cre mice (16 crossed to Ai32, 11 with ChR2 or ChRmine virus),
#    46 fibre sites, constant light for 2 s.
#  - Rats: 7 Long-Evans females, freely moving, lickometer contacts and nasal thermocouple.
#  - Outside data: premotor neurons of the masseter and genioglossus from reference 43 (Takatoh
#    et al. 2021, eLife 10:e67291) mapped into CCF; ALM and latSC anterograde projections
#    contributed by co-authors (no source given).
# The dandiset (title and description) is meant to hold the Neuropixels recordings of the
# brainstem map, the DeepLabCut tracking and the CCF localization; 31 subjects.
#
# Methods fixed by the paper and its code, used by the criteria below.
#  - Units (Methods, Preprocessing): amplitude > 150 uV, ISI violation < 10, rate > 0.2 Hz,
#    presence ratio > 0.9, amplitude cutoff < 0.15, drift metric < 0.5. The code
#    (get_good_units) applies the first five and not the drift metric: variant V1.
#  - Trials (code, get_good_trials): trials tracked in both cameras with no negative jaw
#    likelihood.
#  - Tongue onset (Methods; code get_movement_timing): first frame with the tongue detected,
#    tongue likelihood > 0.95 in both views. Lick bouts as in get_movement_timing (licks at 3 to
#    9 Hz, runs of at least three). Inspiration onset: z-scored airflow, 3.4 ms bins, 5th-order
#    Butterworth 1-15 Hz, Hilbert phase crossing 0, kept only when the trace crosses -0.5
#    within the cycle (code); the Methods say only "phase was equal to 0".
#  - Lick-to-breath timing, Fig 1f-g (code get_peak_diff_lick_behv): inspirations inside lick
#    bouts (0.2 s after bout onset to 0.2 s before offset), with licks between this inspiration
#    and the next; breath cycles longer than the session's longest inter-breath interval
#    dropped; the code's two exclusions of licks within 50 ms of an inspiration; cycles with
#    exactly two licks split at the median inter-breath interval into fast and slow halves;
#    lick PSTHs from -0.4 to 1 s in 20 ms bins; the second-lick peak (find_peaks, threshold
#    mean + SD of the PSTH, at least 5 per s, 140 ms apart) taken in 0.12-0.32 s (fast) and
#    0.16-0.36 s (slow); the session value is slow minus fast; sessions with fewer than 40
#    cycles in either half dropped.
#  - Breath-to-lick timing, Fig 1h-i (code get_peak_diff_breath_behv): licks inside bouts with
#    an inspiration before the next lick, split at the median inter-lick interval; inspiration
#    PSTHs -0.1 to 0.6 s in 20 ms bins; peak (threshold mean + SD, at least 7 per s, 240 ms
#    apart) in 0-0.22 s (fast) and 0-0.24 s (slow); slow minus fast; at least 100 per half.
#  - Unit versions, Fig 4e-f (code get_peak_diff_lick_unit, get_peak_diff_breath_unit): the
#    same splits with spikes in place of licks or breaths; for licking units the 40 fastest and
#    40 slowest two-lick cycles; peaks above max(mean + SD, 10 spikes/s), in 0.1-0.3 s and
#    0.16-0.36 s (licking units) or 0-0.24 s and 0.02-0.26 s (breathing units).
#  - Swallows (Methods; code detect_swallows): negated z-scored airflow at 3.4 ms, 5-sample
#    moving average, peaks (find_peaks, distance 10) with Hilbert phase between 1.2 and 1.7 rad;
#    at least 5 licks in the 1.5 s before and 1 in the 0.25 s after, last lick within 0.5 s, the
#    last four lick frequencies between 3.5 and 13 Hz; inside a pause where the trace velocity
#    stays within +-0.07 for at least 50 ms; swallow onset is the pause start.
#  - Swallow-aligned intervals, Fig 1k-n (code plot_licking_swallow_summary,
#    plot_breath_swallow_summary): events with at least 4 licks (breaths) before and 2 after;
#    the interval spanning the swallow, cycle 0, between 1/15 and 1/3 s for licks (1/2 s for
#    breaths); Delta(0,-1) and Delta(1,-1) as in the Fig 1l legend; the code ranks events by
#    cycle 0, longest first, and keeps the first third ("bottom 1/3").
#  - Phase tuning (Methods; code get_unit_jaw_tuning, get_unit_breath_tuning): jaw (side-camera
#    jaw_y) bandpassed 3-15 Hz, airflow 1-10 Hz, Butterworth forwards and backwards, Hilbert
#    phase; the first 5 s of each trial; spike phases in 20 bins divided by the occupancy of each
#    phase bin; a circular Gaussian (amplitude, preferred phase, width, baseline; distance is the
#    shortest circular distance) fitted with scipy curve_fit from two starting phases, the
#    better r2 kept; MI = (r(phi) - r(phi - pi)) / r(phi). Tuned unit, Results and Methods,
#    P < 0.001 and MI > 0.6.
#  - Swallow modulation (Methods; code get_swallow_tuning, generate_activity_maps.m): rates in
#    -0.3 to -0.1 s, -0.05 to 0.05 s and 0.1 to 0.3 s around swallow onset; an MI against the
#    window before and one against the window after, averaged; 1000 bootstrap resamples of
#    swallow events, p the fraction of resamples where the difference changes sign; a unit is
#    swallow-modulated when both p <= 0.01, mean MI > 0.3 and it has at least 20 swallows.
#
# Variants (the Methods come first; the code's choice is shown beside it).
#  - V1, quality filter with or without the drift metric (above).
#  - V2, phase-tuning filter. The Methods say "4-pole Butterworth"; the code uses
#    scipy.signal.butter(5, band). Readings of the Methods (a) butter(4, band); (b) butter(2,
#    band), four poles in all. The code's order 5 is shown as a variant.
#  - V3, significance of the licking and breathing MI. The Methods resample phases 1000 times
#    and use a Wilcoxon rank-sum test against the resampled distribution; the code makes 100
#    MIs from resampled spike phases and 100 from random session phases and tests them with a
#    one-sided Mann-Whitney U. Readings (a) the code's scheme with 1000 resamples of each;
#    (b) the measured MI ranked against 1000 MIs from random session phases, p the fraction at
#    least as large. The code's scheme with 100 resamples is shown as a variant.
#  - V4, swallow MI normalization. The Methods normalize "to the peak spike rate during
#    swallowing"; the code divides each difference by the larger of the two window rates. For
#    positive MIs the two agree when the peak is read as the mean rate in the swallow window;
#    reading (b), the peak of the 50 ms-smoothed swallow PSTH within +-50 ms, is also run.
#
# Details the paper and the code leave open (each criterion names those it needs).
#  - O1, the units of a "breathing unit" and "licking unit" in Fig 4 and Extended Data Fig 8.
#    The Results use MI > 0.6; Extended Data Fig 8b and e use MI > 0.9; the code's Fig 4e-f
#    summary uses MI > 0.9 with no p threshold. Readings (a) MI > 0.6 and P < 0.001; (b) MI > 0.9
#    and P < 0.001; (c) MI > 0.9 alone (code).
#  - O2, which recordings Fig 4e-f use. Readings (a) every session with tuned units (the code's
#    plot_summary loops over all files); (b) the 43 simultaneous recordings, units in the
#    posterior-dorsal IRN/PARN (licking) and near the preBotzinger complex (breathing), as
#    defined in O3.
#  - O3, regions the CCF does not label. The preBotzinger complex is not an Allen CCF region;
#    Extended Data Figs 7c and 8c place it below the nucleus ambiguus (AMB). Readings: units
#    within (a) 300 um or (b) 500 um ventral of AMB, inside AMB's anterior-posterior and
#    medial-lateral extent. "Posterior-dorsal IRN/PARN" is units labelled IRN or PARN posterior
#    to the AP midpoint of IRN and dorsal to its DV midpoint, with (a) and (b) the same as for
#    "posterior ventral IRN" (posterior and ventral halves). The paper gives no numbers.
#  - O4, the statistical unit of Fig 1g and 1i. The text says "In all mice"; the legend says
#    "for all sessions"; the code gives one value per session. Readings (a) sessions; (b) the
#    mean over each mouse's sessions.
#  - O5, the ranking of swallow events for Fig 1l and 1n. The code ranks by cycle 0 (the
#    interval spanning the swallow); the Results say "ordered by their frequencies before the
#    swallow". Readings (a) the code's ranking, the third with the longest cycle 0; (b) ranking
#    by cycle -1, the third with the longest cycle -1; (c) all events. The t-tests are over
#    swallow events pooled across sessions, as the code pools them; (d) is (a) with session
#    means as the unit.
#  - O6, cross-correlation (Fig 4g-h, Extended Data Fig 12). The Results refer to Methods that
#    have no such section. Readings for the bin (a) 5 ms, (b) 10 ms; window +-250 ms; trial
#    shuffle as pairing unit 1 on trial i with unit 2 on trial i+1 (all shifts pooled), the 95%
#    interval pointwise from the shuffled correlograms; a pair is significant when the
#    measured correlogram leaves the interval at (i) any bin within +-100 ms, or (ii) any bin
#    within +-100 ms after Bonferroni over the bins of the window; positive or anticorrelated
#    by the sign of the largest excursion; the lag is the bin of that excursion.
#  - O7, the Kuiper test of Fig 5c and 5f, "two sample" against a "random distribution".
#    Readings for the second sample (a) phases at random times in the same session;
#    (b) phases at -500 ms from lick onset. Time steps on the 3.4 ms video grid from -500 ms to
#    lick onset; Bonferroni over the steps; the latency is the earliest step from which every
#    later step is significant at p < 0.0001; the s.e.m. by 1000 bootstrap resamples of trials.
#  - O8, the GLM (Extended Data Fig 7). The L1 weight is not given. Readings (a) no penalty;
#    (b) the weight per unit with the highest validation VAF from 1e-4 to 1 in decades. The
#    VAF is (i) the best of the 11 lags; (ii) lag 0. The link is (i) log (Poisson canonical);
#    (ii) logit, as the text says. The CAE follows reference 40 and needs the raw videos.
#  - O9, the lick angle. Methods: tongue tip at full protraction against the jaw's resting
#    position; Extended Data Fig 8g: against the midline. Both are run.
#  - Readings and outcomes. Readings of a method (V2 to V4, O1, O3, O6 to O9, and the readings
#    of a test, region, selection or shuffle named in a criterion) must all give the outcome;
#    when they give different outcomes the claim is blocked as methods_underspecified, with
#    every result shown. "Under one reading" applies only to readings of what a reported
#    number counts or which subset the paper used (O4, O5, denominators, inclusive or
#    exclusive counts, the unit of a test); with both kinds, the claim holds when, for one
#    reading of the second kind, every reading of the first gives the outcome.
#  - Tolerances. A mean +- SD of pooled single intervals or units describes the spread of the
#    sample, not the uncertainty of the mean; such means get 10%. Means given +- s.e.m. use the
#    s.e.m.
schema_version: 2
dataset:
  archive: dandi
  id: "001619"
paper: doi:10.1101/2025.01.27.635041
claims:
- id: code-dataset-link
  kind: link
  statement: The dandiset is the data the paper's analysis code reads, so that the code's
    choices fixed in this file apply to it.
  source: Code availability; the dandiset description; README of NuoLiLabBCM/KakuEtAl2025 at
    commit fbc0abe
  data: dataset
  criterion: Reproduced when process_mat.py's inputs can be built from the NWB files (spike
    times per trial, unit quality metrics, CCF coordinates, airflow at 25 kHz with its
    timestamps, side and bottom DeepLabCut jaw and tongue traces and likelihoods, 3D jaw and
    tongue tracks) and the count of units passing get_good_units over all files is within 10%
    of 20,300 (with or without the drift metric, V1). Partially reproduced when the inputs
    exist but the count is outside 10%.
- id: fig1d-lick-breath-frequencies
  statement: Mice licked at 6.23 +- 2 Hz (95% range 3.59 to 8.91 Hz) and breathed at lower
    frequencies, 4.02 +- 1.24 Hz (95% range 2.12 to 7.17 Hz).
  source: Results, Coordination of breathing, licking, and swallowing, paragraph 2; Figure 1d
  quote: "Licking occurred at 6.23 ± 2 Hz (mean ± std, 95% range: 3.59 - 8.91 Hz) while breathing
    occurred at lower frequencies (4.02 ± 1.24 Hz, 95% range: 2.12 - 7.17 Hz; Figure 1d)"
  expected:
  - quantity: mean licking frequency
    value: 6.23
    tolerance: 0.62
    unit: Hz
  - quantity: mean breathing frequency
    value: 4.02
    tolerance: 0.4
    unit: Hz
  - quantity: licking 95% range, lower bound
    value: 3.59
    tolerance: 0.36
    unit: Hz
  - quantity: licking 95% range, upper bound
    value: 8.91
    tolerance: 0.89
    unit: Hz
  - quantity: breathing 95% range, lower bound
    value: 2.12
    tolerance: 0.21
    unit: Hz
  - quantity: breathing 95% range, upper bound
    value: 7.17
    tolerance: 0.72
    unit: Hz
  criterion: Neither the Methods nor the code say how the frequencies are taken. Readings
    (a) the inverse of every interval between consecutive tongue onsets, and between
    consecutive inspiration onsets, within trials, pooled over all sessions; (b) the same
    within lick bouts only (code bouts). Onsets as in the header. The 95% range is the 2.5th to
    97.5th percentile. Reproduced when, under one reading, all six values are within tolerance;
    partially reproduced when the two means are and a bound is not.
- id: fig1f-inspiration-between-licks
  statement: Inspiration always occurred between licks and never coincided with licking;
    licking preceded inspiration at a fixed latency.
  source: Results, Coordination of breathing, licking, and swallowing, paragraph 2; Figure 1f
  quote: Inspiration always occurred between licks and thus never coincided with licking. Licking
    preceded inspiration at a fixed latency
  criterion: The paper shows this in raster plots and gives no measure. Measure, from the
    paper's definitions, the fraction of inspiration onsets inside lick bouts that fall within
    a tongue protrusion (tongue onset to tongue offset, code get_movement_timing), per session.
    "Never" is read (a) literally, no such inspiration in any session, and (b) as a rounded
    statement, under 5% of inspirations in pooled data (a standard choice, named here).
    Reproduced when (b) holds; the result under (a) is reported. The latency from the last
    lick to the next inspiration is reported per number of licks in the cycle.
- id: fig1g-lick-delayed-before-slow-breath
  statement: For breath cycles with two licks, the second lick was delayed preceding a slower
    breath compared to a fast breath, in all mice (one-sample t-test, two-tailed, p < 0.001),
    so breathing influences the licking rhythm.
  source: Results, Coordination of breathing, licking, and swallowing, paragraph 2; Figure 1g
  quote: In all mice, the lick timing was significantly delayed preceding a slower breath compared
    to a fast breath (Figure 1g, p<0.001, one sample t-test, two-tailed)
  statistics:
  - test: one sample t-test, two-tailed
    p: 0.001
    p_relation: "<"
    n: all sessions (legend) or all mice (text)
  criterion: The per-session peak difference of the header (Lick-to-breath timing, code
    get_peak_diff_lick_behv), slow minus fast. One-sample two-tailed t-test against 0 under
    O4 (a) sessions and (b) mice. Reproduced when the mean is positive with p < 0.001 under a
    reading and every mouse's mean difference is positive; partially reproduced when p < 0.001
    with a positive mean but one or more mice are not positive.
- id: fig1f-licking-mode-switch
  statement: During slow breathing, licking frequency increased abruptly to add licks within
    the breathing cycle (1, 2, 3 or 4 licks between breaths), keeping the fixed lick latency
    before the next inspiration, so licking shifted between modes of oscillation with
    breathing frequency.
  source: Results, Coordination of breathing, licking, and swallowing, paragraph 3; Figure 1f
  quote: During slow breathing, when the next lick could not be delayed further to accommodate the
    next breath, licking frequency abruptly increased to add additional licks within the
    breathing cycle to maintain the fixed lick latency preceding the next inspiration
  criterion: The paper shows this in a raster grouped by the number of licks in the cycle
    (code volcano_plot_licking). With the breath cycles of the header, pooled per session,
    reproduced when the median inter-breath interval rises strictly from 1 to 2 to 3 licks per
    cycle (and to 4 where a session has at least 20 such cycles) in most sessions (more than
    half), and the median latency from the last lick to the next inspiration differs by less
    than 20% between the groups (a standard choice, named here).
- id: fig1i-breath-delayed-before-slow-lick
  statement: Inspirations following licking were significantly delayed for slower licking
    frequencies, anticipating the next lick (one-sample t-test, two-tailed, p < 0.001), so
    licking influences breathing.
  source: Results, Coordination of breathing, licking, and swallowing, paragraph 4; Figure 1i
  quote: inspirations following licking were significantly delayed for slower licking frequencies
    to anticipate the next lick (Figure 1i, p<0.001, one sample t-test, two-tailed)
  statistics:
  - test: one sample t-test, two-tailed
    p: 0.001
    p_relation: "<"
    n: all sessions
  criterion: The per-session peak difference of the header (Breath-to-lick timing, code
    get_peak_diff_breath_behv), slow minus fast; one-sample two-tailed t-test against 0 under
    O4 (a) and (b). Reproduced when the mean is positive with p < 0.001 under a reading.
- id: ed1-unidirectional-models-fail
  statement: Neither a free-running breathing oscillator that sets lick timing nor a
    free-running licking oscillator that sets breath timing reproduces the observed lick-breath
    relationship, suggesting that the two oscillators are bidirectionally coupled.
  source: Results, Coordination of breathing, licking, and swallowing, paragraph 4; Extended
    Data Figure 1d-i; Methods, Simulation of licking-breathing coupling
  quote: This pattern of lick-breath temporal relationship also cannot be produced by a
    free-running licking oscillator unidirectionally setting the timing of breathing rhythm
  depends_on:
  - fig1g-lick-delayed-before-slow-breath
  - fig1i-breath-delayed-before-slow-lick
  criterion: Simulate as the Methods say, drawing intervals from the empirical frequency
    distributions of fig1d-lick-breath-frequencies, Gaussian timing noise SD 10 ms. The paper
    gives no value for the fixed latency or the number of simulated cycles; standard choices,
    named here, are the median latency from the last lick to the next inspiration (breathing
    model) and from the last inspiration to the next lick (licking model) in the data, and as
    many simulated cycles as the pooled data. Apply the two peak-difference measures of the
    header to each simulation. Reproduced when the breathing-driven model gives a Fig 1i
    difference whose mean is not positive or not significant (two-tailed t-test over simulated
    sessions of the data's sizes, p >= 0.05, a standard choice named here since the paper
    reports no test) and the licking-driven model fails likewise on the Fig 1g measure, while
    the data give both differences positive.
- id: ed2-rats-similar
  statement: Licking and breathing in freely moving rats showed a similar lick-breath temporal
    relationship.
  source: Results, Coordination of breathing, licking, and swallowing, paragraph 4; Extended
    Data Figure 2
  quote: Independent analysis of breathing and licking in freely moving rats yielded similar
    temporal relationship (Extended Data Figure 2)
  criterion: Rat data (7 rats, lickometer contacts, thermocouple inspiration onsets at 10% of
    onset amplitude after 1-20 Hz filtering, Methods). Licks from bouts shorter than 1.75 s
    left out as the Methods say. The two peak-difference measures of the header computed per
    rat with tongue contacts as licks. Reproduced when both differences are positive in a
    majority of rats and positive on average (one-sample t-test over rats, two-tailed,
    p < 0.05, a standard choice named here since the paper reports no test).
- id: ed1bc-licks-pause-at-swallows
  statement: Licking was paused during detected swallows but not during ordinary expirations,
    so the detected events are genuine swallows.
  source: Extended Data Figure 1b-c; Results, Coordination of breathing, licking, and
    swallowing, paragraph 1
  quote: Licking was paused during swallowing. Bottom, lick timing aligned to all expirations as a
    control. Lick was not paused during expiration.
  criterion: Swallows detected as in the header. Per session, the probability of a tongue onset
    in 3.4 ms bins from -0.3 to 0.3 s around swallow onsets and around all expiration onsets
    inside lick bouts. The paper does not define expiration onset; it is taken as the Hilbert
    phase crossing pi (a standard choice, named here), and the bins and window are plotting
    choices. Reproduced when the mean lick probability from 0 to
    100 ms after onset is lower around swallows than around expirations in most sessions with
    at least 20 swallows, by a paired Wilcoxon signed-rank test, p < 0.05 (a standard choice,
    named here).
- id: fig1k-rhythms-follow-swallow-at-fixed-latency
  statement: Inspirations and licks followed swallowing at relatively fixed latencies despite
    different breath and lick timing before the swallow, suggesting that swallowing interrupted
    the ongoing rhythms.
  source: Results, Coordination of breathing, licking, and swallowing, paragraph 5; Figure 1k and
    1m
  quote: Inspirations and licks followed swallowing at relatively fixed latencies despite
    different breath and lick timing before the swallow (Figure 1k and m)
  criterion: Swallow events and ranking as in O5 (a) and (b). For licks and for breaths
    separately, reproduced when the difference in median latency from swallow onset to the
    first following lick (inspiration) between the top and bottom thirds is smaller than the
    difference in their median cycle -1 (as Figure 1k right compares the two thirds) under a
    reading.
- id: fig1l-lick-interval-preserved
  statement: The inter-lick interval before and after swallowing was preserved (one-sample
    t-test, two-tailed, P = 0.649).
  source: Results, Coordination of breathing, licking, and swallowing, paragraph 5; Figure 1l
  quote: The inter-lick-interval before and after swallowing was preserved (Figure 1l, P=0.649,
    one-sampled t-test, two-tailed)
  statistics:
  - about: Delta(1,-1), cycle 1 minus cycle -1
    test: one-sampled t-test, two-tailed
    p: 0.649
  criterion: A claim of absence, judged on the paper's test. Delta(1,-1) per swallow event as
    in the header, bottom third by O5 (a), the code's selection, pooled across sessions.
    Reproduced when the one-sample two-tailed t-test against 0 gives p >= 0.05; not reproduced
    when p < 0.05. The mean Delta(1,-1) is reported, and O5 (b), (c) and (d) are shown as
    variants.
- id: fig1l-lick-cycle-prolonged
  statement: The lick cycle in which swallowing occurred was significantly prolonged, by 33.3 ms
    (one-sample t-test, two-tailed, P < 0.001).
  source: Results, Coordination of breathing, licking, and swallowing, paragraph 5; Figure 1l
  quote: whereas the lick cycle in which swallowing occurred was significantly prolonged by 33.3 ms
    (Figure 1l, P<0.001, one-sampled t-test, two-tailed)
  statistics:
  - about: Delta(0,-1), cycle 0 minus cycle -1
    test: one-sampled t-test, two-tailed
    p: 0.001
    p_relation: "<"
  expected:
    quantity: mean Delta(0,-1) for licks
    value: 33.3
    tolerance: 3.3
    unit: ms
  criterion: Delta(0,-1) per swallow event, readings O5 (a) to (d). Reproduced when, under one
    reading, the mean is within tolerance and the one-sample two-tailed t-test gives p < 0.001;
    partially reproduced when the test holds and the mean is outside tolerance under every
    reading. Under O5 (a) the selection of the longest cycles 0 favours a positive Delta(0,-1);
    the result under (b) and (c) is reported beside it.
