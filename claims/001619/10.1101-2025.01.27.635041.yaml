    lateral position against the midline) by a one-sided Mann-Whitney test at p < 0.05 (a
    standard choice, named here) and each hemisphere's median favours the ipsilateral side,
    under both readings of O9.
- id: ed4c-licking-map-insensitive-to-sorting
  statement: The licking activity map was insensitive to spike-sorting quality; raising the
