- id: ed10-site-classes
  statement: Of the brainstem photostimulation sites, 18 evoked rhythmic jaw movement with a
    peak at 7 Hz and rhythmic tongue protrusions, 11 evoked no rhythmic jaw movement and 4
    evoked only a transient tongue protrusion.
  source: Extended Data Figure 10b, 10e and 10h
  inferred: The counts 18, 11 and 4 are in three legends; no sentence gives them together.
  expected:
  - quantity: sites with rhythmic jaw movement
    value: 18
    tolerance: 2
  - quantity: sites without rhythmic jaw movement
    value: 11
    tolerance: 1
  - quantity: sites with transient tongue protrusion
    value: 4
    tolerance: 0
  - quantity: jaw movement frequency peak at rhythmic sites
    value: 7
    tolerance: 0.7
    unit: Hz
  criterion: Jaw position Fourier spectrum during the 2 s of light (Extended Data Fig 10b).
