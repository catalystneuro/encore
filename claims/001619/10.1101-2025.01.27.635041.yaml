    test of Fig 1g; one-sample two-tailed t-test over units at p < 0.05 (threshold a standard
    choice, named here). Reproduced when the mean is positive and significant under all
    readings; blocked as methods_underspecified when the readings disagree.
- id: fig4f-breathing-units-anticipate-lick
