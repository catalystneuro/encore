  criterion: As fig2f-breathing-units-location, with swallow-modulated units. Regions are CCF
    V, IC and NLL; "lateral to NTS" is units within (a) 300 um or (b) 500 um lateral of NTS at
    its AP extent; "above 10N" is units within the same distances dorsal of AMB. Reproduced
    when the fraction exceeds that of all units of the same sessions in all five regions under
    both distance readings; partially reproduced in three or four under both.
- id: ed6e-swallow-latencies
  statement: Swallow-related activity in 5N and IRN leads swallowing, while activity in the
    inferior colliculus and nucleus of the lateral lemniscus follows it.
  source: Extended Data Figure 6e; Results, Brainstem activity maps of orofacial rhythms,
    paragraph 4
  quote: Activities in 5N and IRN lead swallowing while activities in the IC and NLL follow
    swallowing.
  depends_on:
  - fig2-swallow-modulated-counts
  criterion: Swallow PSTHs as in the code (1 ms bins, 50 ms boxcar, -1 to 1 s). Per
    swallow-modulated unit, the time of the PSTH peak within -0.15 to 0.15 s (the paper gives no
    window or latency measure; a standard choice, named here). Reproduced when the median peak
    time is negative for units in V and IRN and positive for units in IC and NLL, and the two
    groups differ by a two-sided Mann-Whitney test at p < 0.05 (a standard choice, named here).
- id: ed7-glm-separate-clusters
  statement: A GLM on the tracked features found separate clusters of units predicted by
    licking or by breathing movements.
  source: Results, Brainstem activity maps of orofacial rhythms, paragraph 5; Extended Data
    Figure 7c-d
  quote: The GLM found separate clusters of units predicted by either licking or breathing
    movement (Extended Data Figure 7c-d)
  criterion: The GLM of the Methods (17 ms bins, jaw and tongue x, y, z and airflow, z-scored,
    tongue set to 0 when its likelihood is below 0.05 in both views, every 5th trial held out,
    lags of +-5 bins), readings O8. The paper shows maps of the weights (Extended Data Fig 7c,
    airflow weights around and below 10N; 7d, jaw and tongue weights in the premotor regions)
    and gives no measure. Among units with validation VAF > 0.05, each unit is assigned to
    airflow or to jaw and tongue by its largest absolute weight (threshold and assignment are
    standard choices, named here). Reproduced when airflow units lie ventral of jaw and tongue
    units (CCF DV, one-sided Mann-Whitney test, p < 0.05) and the fraction of airflow units
    near the preBotzinger complex exceeds that of jaw and tongue units (one-sided Fisher exact
    test, p < 0.05), under every reading of O3 and O8; both tests are standard choices, named
    here.
- id: ed7g-cae-better-than-features
  statement: The autoencoder embedding predicted a larger fraction of activity variance than the
    tracked features for most units across the brainstem (Wilcoxon signed-rank test, P <
    0.001).
  source: Results, Brainstem activity maps of orofacial rhythms, paragraph 6; Extended Data
    Figure 7g
  quote: The CAE predicted a larger fraction of activity variance than the tracked features for
    most units across the brainstem (Extended Data Figure 7g; CAE vs. features, P<0.001,
