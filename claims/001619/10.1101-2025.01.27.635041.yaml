- id: fig2h-swallow-units-location
  statement: Swallowing-related units clustered in the trigeminal nucleus (5N), lateral to the
    nucleus of the solitary tract (NTS) and above the nucleus ambiguus (10N), with further
    clusters in the inferior colliculus and the nucleus of the lateral lemniscus.
  source: Results, Brainstem activity maps of orofacial rhythms, paragraph 4; Figure 2h; Extended
    Data Figure 6a-d
  quote: Units with swallowing-related activity were clustered in the trigeminal nucleus (5N),
    lateral to the nucleus of the solitary tract (NTS), and above the nucleus ambiguus (10N)
  depends_on:
