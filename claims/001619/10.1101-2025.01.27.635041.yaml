    trained on 80% of trials for 20,000 iterations with L2 regularization), which needs the
    raw videos; GLM readings O8. Reproduced when, over all units, CAE VAF exceeds feature VAF
    in more than half of the units and the paired Wilcoxon signed-rank test gives P < 0.001.
- id: ed7h-prebotc-exception
  statement: Units in the preBotzinger complex were the exception, where the autoencoder gave
