- id: fig4b-artificial-licking-keeps-lick-timing
  statement: During ALM-induced licking the lick-breath relationship of voluntary licking was
    recapitulated; lick timing anticipated the next breath at a fixed latency across breathing
    frequencies.
  source: Results, Coupled brainstem oscillators autonomously coordinate licking and breathing,
    paragraph 2; Figure 4b
  quote: Notably, the same lick-breath temporal relationship was recapitulated during artificially
    induced licking. Lick timing anticipated the next breath and proceeded inspiration at a fixed
    latency across different breathing frequencies (Figure 4b)
  criterion: Cued licking task of the ALM mice. The Fig 1g measure (header) on photostimulation
    trials (licks during the 2 s light) and on Go-cue trials separately, pooled per mouse
    (Figure 4b, "across all mice"); session pooling as needed for the minimum of 40 cycles per
    half. Reproduced when the photostimulation difference is positive on average across mice by
    a one-sample two-tailed t-test at p < 0.05 (the paper's test of Fig 1g; the threshold is a
    standard choice, named here).
- id: fig4c-artificial-licking-breath-timing
  statement: During ALM-induced licking, inspiration timing was still influenced by future lick
    timing.
  source: Results, Coupled brainstem oscillators autonomously coordinate licking and breathing,
    paragraph 2; Figure 4c
  quote: Conversely, inspiration timing was influenced by future lick timing (Figure 4c)
  criterion: As fig4b-artificial-licking-keeps-lick-timing, with the Fig 1i measure of the
    header.
- id: ed11b-alm-breathing-rate
  statement: In a subset of mice, ALM photostimulation also increased breathing rate.
  source: Results, Coupled brainstem oscillators autonomously coordinate licking and breathing,
    paragraph 2; Extended Data Figure 11b
  quote: In a subset of mice, ALM photostimulation also induced an increase in breathing rate
    (Extended Data Figure 11b)
  criterion: Breathing rate (inspiration onsets per second) in the 2 s of light against the 1 s
    before, per photostimulation trial. Reproduced when at least one and fewer than all 11 mice
    show an increase by a paired two-sided Wilcoxon signed-rank test over trials at p < 0.05
    (a standard choice, named here).
- id: fig4e-licking-units-anticipate-breath
  statement: Preceding a slower breath, the activity of licking neurons was slowed in
    anticipation of the next inspiration.
  source: Results, Coupled brainstem oscillators autonomously coordinate licking and breathing,
    paragraph 3; Figure 4e
  quote: Preceding a slower breath, the activity of licking neurons was slowed in anticipation of
    the next inspiration (Figure 4e)
  depends_on:
  - fig2-licking-breathing-tuned-counts
  criterion: The unit peak difference of the header (code get_peak_diff_lick_unit), slow minus
