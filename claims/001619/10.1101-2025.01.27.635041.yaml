    cycle starting at inspiration onset (phase 0 to pi in the convention where inspiration
    onset is 0). Reproduced when more than half of those units prefer that half cycle and their
    phases are non-uniform by a Rayleigh test at p < 0.05 (a standard choice, named here), under
    both readings of O3.
- id: ed8e-licking-units-protrusion
  statement: Licking-related units were mostly active when the tongue was fully protruded.
  source: Results, Brainstem activity maps of orofacial rhythms, paragraph 5; Extended Data
