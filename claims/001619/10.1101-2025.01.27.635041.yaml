- id: fig4d-simultaneous-recordings
  statement: Licking and breathing oscillators were recorded simultaneously in 43 recordings from
    21 mice, with 1 to 28 licking-related and 1 to 12 breathing-related units per recording.
  source: Results, Coupled brainstem oscillators autonomously coordinate licking and breathing,
    paragraph 3; Figure 4d
  quote: 43 recordings in 21 mice; 1-28 licking-related units and 1-12 breathing-related units per
    recording
  expected:
  - quantity: simultaneous recordings
    value: 43
    tolerance: 4
  - quantity: mice with simultaneous recordings
    value: 21
    tolerance: 2
  criterion: Recordings with two probes, one with licking units (O1) in the posterior-dorsal
    IRN/PARN and one with breathing units near the preBotzinger complex (O3). Reproduced when
    the counts are within tolerance and the unit ranges per recording are within 1 to 28 and 1
    to 12 widened by 10%, under every reading of O1 and O3.
- id: fig4g-licking-breathing-pairs-correlated
  statement: Activity of simultaneously recorded breathing and licking units was significantly
    correlated for most pairs compared to trial-shuffled controls (103 of 119 pairs; 43
    positively correlated, 60 anticorrelated).
  source: Results, Coupled brainstem oscillators autonomously coordinate licking and breathing,
    paragraph 4; Figure 4g
  quote: Activity was significantly correlated for most pairs compared to trial-shuffled controls
    (Figure 4g; 103/119 pairs with significant cross-correlation relative to shuffled control, 43
    positively correlated, 60 anticorrelated
  depends_on:
  - fig4d-simultaneous-recordings
  expected:
  - quantity: pairs
    value: 119
    tolerance: 12
  - quantity: significant pairs
    value: 103
    tolerance: 10
  - quantity: positively correlated pairs
    value: 43
    tolerance: 4
  - quantity: anticorrelated pairs
    value: 60
    tolerance: 6
  criterion: Pairs from fig4d-simultaneous-recordings; correlograms by O6. Reproduced when, under
    every reading of O6, the four counts are within tolerance; partially reproduced when, under
    every reading, more than three quarters of pairs are significant with anticorrelated pairs
    outnumbering positive ones.
- id: fig4g-symmetric-lags
  statement: The cross-correlation was temporally symmetric; breathing units lagged licking units
    for 57 pairs, licking units lagged breathing units for 34 pairs, and 12 pairs peaked at zero.
  source: Results, Coupled brainstem oscillators autonomously coordinate licking and breathing,
    paragraph 4
  quote: breathing units lagged licking units for 57 pairs, while other licking units lagged
    breathing units for 34 pairs, (the remaining 12 pairs had cross-correlation peak at 0)
  depends_on:
  - fig4g-licking-breathing-pairs-correlated
  expected:
  - quantity: pairs with breathing unit lagging
    value: 57
    tolerance: 6
  - quantity: pairs with licking unit lagging
    value: 34
    tolerance: 3
  - quantity: pairs peaking at 0
    value: 12
    tolerance: 1
  criterion: Significant pairs and lags by O6. Reproduced when the three counts are within
    tolerance under every reading of O6; partially reproduced when, under every reading, both
    lag directions each hold at least a quarter of significant pairs.
- id: ed12c-correlation-without-licking
  statement: Significant cross-correlation between licking and breathing unit pairs was observed
    even when mice were not licking.
  source: Results, Coupled brainstem oscillators autonomously coordinate licking and breathing,
    paragraph 4; Extended Data Figure 12c
  quote: Notably, significant cross-correlation between the unit pairs was observed even when mice
    were not licking, i.e. when the licking oscillator was inactive (Extended Data Figure 12c)
  depends_on:
  - fig4g-licking-breathing-pairs-correlated
  criterion: As fig4g-licking-breathing-pairs-correlated, on the baseline of the cued licking
    task (trial start to Go cue, no tongue detected; Extended Data Fig 12c). Reproduced when
    more than half of the pairs are significant under every reading of O6.
- id: fig4h-fewer-correlations-outside-oscillator
  statement: Units outside the licking oscillator were less often cross-correlated with breathing
    units (54 of 110 pairs), a significantly lower proportion than licking-breathing oscillator
    pairs (Chi-square test, p < 0.0001).
  source: Results, Coupled brainstem oscillators autonomously coordinate licking and breathing,
    paragraph 4; Figure 4h
  quote: units outside of the licking oscillator exhibited less cross correlation with the
    breathing units (Figure 4h; 54/110 pairs with significant cross correlation; a significantly
    lower proportion compared to licking-breathing oscillator unit pairs, p<0.0001, Chi-square
    test)
  statistics:
  - test: Chi-square test
    p: 0.0001
    p_relation: "<"
    n: 110 and 119 pairs
  depends_on:
  - fig4g-licking-breathing-pairs-correlated
  expected:
  - quantity: pairs with a non-licking unit
    value: 110
    tolerance: 11
  - quantity: significant pairs with a non-licking unit
    value: 54
    tolerance: 5
  criterion: Non-licking units are not defined; readings (a) units of the licking-oscillator
    probe not licking-tuned (O1); (b) units of that probe outside the posterior-dorsal IRN/PARN
    (O3). Correlograms by O6. Chi-square test on the 2 x 2 table of significant and not
    significant pairs, without continuity correction (i) and with it (ii). Reproduced when the
    proportion is lower with p < 0.0001 under (a) or (b), for every reading of O6 and of the
    continuity correction; the counts are reported against the
    expected values.
- id: fig5b-voluntary-lick-latency
  statement: Mice initiated licking 127.6 +- 29.6 ms after the Go cue (mean +- std across mice,
    n = 11).
  source: Results, Descending control patterns oscillators at movement initiation, paragraph 2;
    Figure 5a-b
  quote: Mice initiated licking 127.6 ± 29.6 ms after the Go cue onset (defined as the onset of
    tongue appearance in the video, mean ± std across mice, n=11 mice
  expected:
    quantity: lick latency after Go cue, mean across mice
    value: 127.6
    tolerance: 12.8
    unit: ms
  criterion: Cued licking task, Go-cue trials, first tongue onset after the cue within the 0.5 s
    response window; mean per mouse, then mean across the 11 mice.
- id: fig5c-preemptive-breath-adjustment
  statement: Before voluntary licking, breathing phase deviated from random 115 +- 19 ms before
    lick onset and became entrained to a phase that put expiration at the first lick (two-sample
    Kuiper test with Bonferroni correction, p < 0.0001).
  source: Results, Descending control patterns oscillators at movement initiation, paragraph 2;
    Figure 5c
  quote: 115 ± 19 ms before licking onset (mean ± s.e.m., bootstrap), breathing phase began to
    deviate significantly from random distribution and became entrained to a specific phase
    (Figure 5c; p<0.0001, two sample Kuiper test with Bonferroni correction)
  statistics:
  - test: two sample Kuiper test
    p: 0.0001
    p_relation: "<"
    corrected: Bonferroni
  expected:
    quantity: onset of breathing-phase entrainment before voluntary lick onset
    value: 115
    tolerance: 19
    unit: ms
  criterion: Go-cue trials of the cued licking task; breathing phase (Hilbert, header) aligned to
    the first lick; test and latency by O7 (a) and (b). Reproduced when, under both readings of O7,
    the latency is within tolerance and the phase at lick onset lies in expiration (phase pi to 2
    pi).
- id: fig5e-photostim-lick-latency-longer
  statement: ALM photostimulation evoked licking with a latency of 230.7 +- 31.5 ms, significantly
    longer than voluntary licking (paired t-test, two-tailed, p < 0.001).
  source: Results, Descending control patterns oscillators at movement initiation, paragraph 3;
    Figure 5e
  quote: Photostimulation evoked licking with a latency of 230.7 ± 31.5 ms (Figure 5e), which was
    significantly longer than voluntarily initiated licking (p<0.001, paired t-test, two-tailed)
  statistics:
  - test: paired t-test, two-tailed
    p: 0.001
    p_relation: "<"
    n: not stated; the 11 mice of the voluntary latency, or sessions
  expected:
    quantity: lick latency after photostimulation onset, mean across mice
    value: 230.7
    tolerance: 23.1
    unit: ms
  depends_on:
  - fig5b-voluntary-lick-latency
  criterion: First tongue onset after light onset on photostimulation trials, mean per mouse.
    The paper does not give the unit of the paired test; readings (a) the 11 mice, against the
    Go-cue latencies of fig5b-voluntary-lick-latency; (b) sessions, Go-cue and photostimulation
    means of the same session. Reproduced when the mean across mice is within tolerance and
    the paired two-tailed t-test gives p < 0.001 under one reading.
- id: fig5f-artificial-licking-late-breath-adjustment
  statement: Artificially induced licking did not recapitulate the pre-emptive breath adjustment;
    breathing phase changed only 47.6 +- 10 ms before lick onset, a significantly shorter latency
    than before voluntary licking (bootstrap, P < 0.0001).
  source: Results, Descending control patterns oscillators at movement initiation, paragraph 3;
    Figure 5f (the Results also cite a Figure 5g that the legend does not describe)
  quote: Breathing phase was altered only shortly before licking onset (Figure 5f; 47.6 ± 10 ms),
    a significantly shorter latency than the pre-emptive adjustment before voluntary licking
    (Figure 5g; P<0.0001, bootstrap)
  statistics:
  - test: bootstrap
    p: 0.0001
    p_relation: "<"
  expected:
    quantity: onset of breathing-phase change before induced lick onset
    value: 47.6
    tolerance: 10
    unit: ms
  depends_on:
  - fig5c-preemptive-breath-adjustment
  criterion: As fig5c-preemptive-breath-adjustment on photostimulation trials, aligned to the
    first tongue protrusion after light onset. The bootstrap comparison is not described; the
    reading used is 10,000 resamples of trials with replacement, drawn within each condition,
    p the fraction where the induced latency is at least the voluntary one (a standard choice,
    named here; P < 0.0001 needs at least 10,000 resamples). Reproduced when, under both
    readings of O7, the latency is within tolerance and the comparison gives P < 0.0001.
checks:
- date: 2026-10-21
  kind: agent
  model: claude-opus-5-5
  ready: true
  changes:
  - Opening comment. Added the rule for readings. Readings of a method (V2 to V4, O1, O3, O6 to O9, named tests, regions, shuffles) must all give the outcome, else methods_underspecified (protocol, Reader step 3). "Under one reading" is kept only for readings of what a number counts (O4, O5, denominators, units of a test).
  - fig2-licking-breathing-tuned-counts, fig2-swallow-modulated-counts, fig2f-breathing-units-location, fig2h-swallow-units-location, ed7h-prebotc-exception, ed8bc-prebotc-inspiration-phase, ed8i-ipsilateral-lick-selectivity, fig3b-licking-units-in-premotor-regions, fig4d-simultaneous-recordings, fig4g-licking-breathing-pairs-correlated, fig4g-symmetric-lags, ed12c-correlation-without-licking, fig4h-fewer-correlations-outside-oscillator, fig5c-preemptive-breath-adjustment and fig5f-artificial-licking-late-breath-adjustment. Changed "under one reading" of method readings to "under every reading", by the rule above.
  - fig2-licking-breathing-tuned-counts. The 10% and 25% partial thresholds were attributed to the Methods, which say only that the proportions were robust; now named as a standard choice. Added readings (i) and (ii), since the text does not say whether 3551 and 1015 include the 182 units tuned to both.
  - ed1-unidirectional-models-fail and fig1k-rhythms-follow-swallow-at-fixed-latency. The statements said "so" where the paper says "suggest"; now "suggesting". ed1 also now names the fixed latency, the cycle count and the p >= 0.05 test as choices, since the paper gives none.
  - ed7-glm-separate-clusters. The criterion asked whether two sets assigned by largest weight "overlap", but such sets cannot overlap, and it set a posterior position the paper does not give. Rewritten from Extended Data Fig 7c-d (airflow weights around and below 10N), with each choice named.
  - ed1bc-licks-pause-at-swallows, ed6e-swallow-latencies, ed8e-licking-units-protrusion, fig3a-premotor-regions and fig3ce-descending-stimulation-rhythmic-licking. Choices the paper does not give (expiration onset, peak window, full protrusion frame, pi/2 margin, contour overlap rule, lick rate window, last 300 ms) are now named as standard choices.
  - fig2g-licking-units-location. "in XII, V and IRN" was ambiguous; now "in each of", following the statement, which names each region.
  - ed10-site-classes. Noted that the three classes sum to 33 of the 46 sites, and that the paper does not say whether the 4 transient sites are among the 11.
  - fig5e-photostim-lick-latency-longer. The paper does not give n for the paired t-test; the recorded "11 mice" was an inference. n now says so, and the criterion gives readings (a) mice and (b) sessions.
  - fig5f-artificial-licking-late-breath-adjustment. The bootstrap reading said "paired resamples of trials", but voluntary and induced trials are not paired. Now resamples within each condition, named as a choice.
  - Open. The cross-correlation analysis (O6) cites Methods that do not exist, so its readings are reconstructed; fig4g, fig4h and ed12c are likely to be blocked as methods_underspecified if the readings disagree.
  - Open. fig1f-inspiration-between-licks judges "never" by a 5% standard choice and only reports the literal reading.
  - Open. The header's code details (process_mat.py functions, bins, windows) were not checked against the repository in this check; they were taken as the first reader recorded them.
