  statement: After 6 weeks of SCC-DBS, monkeys N and T spent more time moving and more time
    foraging in the home cage than before, in the same direction in both animals.
  source: Results, SCC-DBS induces selective macroscale remodeling in the CB, paragraph 1;
    Extended Data Fig. 1
  quote: Time spent moving and foraging both increased after SCC-DBS, with concordant effects
    observed across subjects
  statistics:
  - about: movement, pre against post
    test: one-way ANOVA, monkey as fixed effect
    statistic: F(1,236) = 34.61
    p: 1.37e-08
    n: 120 pre and 120 post 10-s bins, monkeys N and T
  - about: foraging, pre against post
    test: one-way ANOVA, monkey as fixed effect
    statistic: F(1,236) = 17.35
    p: 4.37e-05
    n: 120 pre and 120 post 10-s bins, monkeys N and T
  expected:
  - quantity: F, movement
    value: 34.61
    tolerance: 3.46
  - quantity: F, foraging
    value: 17.35
    tolerance: 1.74
  - quantity: partial eta squared, movement
    value: 0.13
    tolerance: 0.013
  - quantity: partial eta squared, foraging
    value: 0.068
    tolerance: 0.0068
  criterion: From Methods (Behavior analysis) and the Extended Data Fig. 1 legend. For N and T,
    the 60 binary 10-s bins of each pre and post session, for movement and for foraging
    separately (240 values each). ANOVA of the binary values on condition (pre, post) with
    monkey as a fixed effect, under readings (a) condition, monkey and their interaction (the
    reported df) and (b) condition and monkey. Reproduced when, under both readings, the
    condition effect has P < 0.05 with the post probability higher, for both behaviors, and the
    post probability is higher than the pre in each monkey for both behaviors; the F values and
    partial eta squared are compared with the expected values under reading (a).
