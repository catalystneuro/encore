  quote: First, there was no change in the amount of movement or foraging in naturalistic
    behavior
  criterion: A claim of absence. The paper shows monkey D's probabilities (Extended Data Fig. 1)
    but reports no test for monkey D; the legend says only N and T were analysed. The test the
