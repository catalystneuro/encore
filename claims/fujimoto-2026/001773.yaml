  quote: When the functional connectivity was sorted based on cortical networks membership, it
    was clear that connectivity within and across networks was reduced
  depends_on:
  - fig4a-cortical-down-subcortical-up
  criterion: The paper does not give which network each of the 122 ROIs belongs to for Fig. 4c,
    nor a test (the circular plot draws changes with |Z| > 0.1). If the paper's code deposited
    in the dandiset assigns the ROIs to networks, use it; reproduced when, in the DBS group's
    difference connectome, the mean change over all within-network ROI pairs and the mean
    change over all between-network ROI pairs are both negative (the sentence's "within and
    across networks"). The sign of each network block and pair of networks is reported. Without
    that assignment the claim is blocked as methods_underspecified.
