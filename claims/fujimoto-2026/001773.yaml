- id: fig4b-roi-changes-counts
  statement: Per ROI, functional connectivity changed significantly between pre and post scans
    in 69 of the 122 CHARM and SARM ROIs in the DBS group and in 44 of 122 in the nonsurgical
    control group.
  source: Fig. 4b and legend; Supplementary Tables 1 and 2
  inferred: The counts are the number of ROIs listed in Supplementary Tables 1 (DBS group) and 2
    (nonsurgical control group), the ROIs significant in Fig. 4b; no sentence states them.
  expected:
  - quantity: ROIs significant, DBS group
    value: 69
    tolerance: 6.9
  - quantity: ROIs significant, nonsurgical control group
    value: 44
    tolerance: 4.4
  criterion: From Methods (EPI data analysis) and the Fig. 4b legend. For each of the 122 ROIs,
    its 122 connectivity values (Fisher Z, group mean) pre against post with a two-sided
    Wilcoxon rank-sum test. Open, and run under each reading. The test's pairing of values
    (a) rank-sum of the 122 pre values against the 122 post values, as the Methods name;
    (b) the 122 change values against zero (signed-rank), as the legend's "changes ... from
    zero". The threshold (a') P < 0.01/122, Bonferroni over ROIs; (b') the Bonferroni-adjusted
    P (P x 122) < 0.01, which is the same, so the open part is whether the listed P values are
    adjusted (see the opening comment); a third reading takes the listed P values as raw and the
    threshold P < 0.01, uncorrected. Whether the 122 values include the ROI's own diagonal is not
    stated (121 or 122 values are both run). Reproduced when both counts are within tolerance
    under one reading.
- id: fig4c-network-sorted-reduction
  statement: Sorted by cortical network membership, functional connectivity within and across
    networks was reduced after SCC-DBS.
  source: Results, Whole-brain functional connectivity changes following SCC-DBS, paragraph 1;
