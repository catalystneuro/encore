# Claims for Fujimoto, Fujimoto, Elorette et al. (2026), "Deep brain stimulation induces white
# matter remodeling and functional changes to brain-wide networks", Nature Neuroscience,
# doi:10.1038/s41593-026-02301-4, on dandiset 001773.
#
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21, as
# the reader of docs/protocol.md (version pilot-10).
#
# Text read: the version of record (open access, PMC13337501, as served by Europe PMC), main
# text, figure legends, Methods and Extended Data legends 1 to 10, together with the
# Supplementary Information PDF (Supplementary Methods 1 to 7 and Supplementary Tables 1 to 11),
# all in paper/10.1038-s41593-026-02301-4.txt. No PDF of the main article was available; no
# figure needed to be read from one. The Nature "Source Data" files (statistical source data for
# Figs. 2 to 6 and Extended Data Figs. 1, 4, 5, 6, 9 and 10) are cited by the paper but were not
# under paper/ and no claim relies on them.
#
# Code: the paper says its custom MATLAB scripts for the functional MRI analysis are deposited in
# the dandiset itself (Code availability, doi 10.48324/dandi.001773/0.260416.1939). A reader may
# not open the dataset's files, so this code was NOT read. Every criterion below rests on the
# Methods, legends and supplement. Where a detail is named open, the author should check whether
# that code settles it and ask a reader (protocol, author step 6).
#
# Dataset: the archive gives the title of the paper and the description "Data and code (fMRI,
# DWI IF, EM, behavior)", BIDS, 54 files, about 3.2 MB. The Data availability statement names
# only the functional MRI data. At that size the dandiset can hold derived values (voxel FA,
# cell counts, g-ratios, behavior bins, connectivity values) but hardly raw images; which is
# the author's to find. All claims are data: dataset.
#
# Data the paper used, as it reports them:
# - Monkeys N and T (male rhesus macaques, 7 to 9 years): SCC-DBS lead in the left (N) or right
#   (T) hemisphere at the confluence of the cingulum bundle (CB), uncinate fasciculus (UF) and
#   forceps minor (FM); 4 weeks without stimulation, then 6 weeks at 130 Hz, 5 mA, 90 us. The
#   other hemisphere is the control hemisphere.
# - Monkey D: lead implanted in the left hemisphere, never stimulated ("sham" hemisphere);
#   same timeline.
# - Nonsurgical controls B, W and H (male, 7 to 8 years): rs-fMRI and T1w only, two sessions
#   6 to 7 weeks apart; the seed is the right SCC.
# - Two MRI sessions per animal (pre-DBS and post-DBS, the lead removed about 20 min before the
#   post scan), under isoflurane. DWI b = 1000, 72 directions, 1.5 mm, six runs (3 AP, 3 PA).
#   rs-fMRI six runs of 300 volumes, TR 2.12 s, 1.6 mm, with MION; first three TRs removed.
# - Behavior: one 10-min home-cage video per animal before and after, cut into 60 bins of 10 s,
#   each scored 1 or 0 for movement and separately for foraging.
# - Histology (MCC-CB, dACC-CB): CC1-positive and DAPI-positive counts in 7 fields x 4 coronal
#   sections per hemisphere per animal (28 fields); UF/FM overlap 5 fields x 4 sections.
# - Electron microscopy (N and T, MCC-CB): about 175 myelinated axons per hemisphere per animal
#   (350 per hemisphere pooled), g-ratio = mean axon diameter / (mean axon diameter + 2 x mean
#   myelin width), from the longest and shortest diameters and widths; axons with an aspect
#   ratio above 2 excluded.
#
# Method details fixed here from the paper, used by several criteria:
# - All ANOVAs and Tukey-Kramer tests were run in MATLAB R2023a (Methods, FA analysis). The
#   "three-way ANOVA" models are full factorial in their three factors, plus a main effect of
#   monkey when two monkeys are pooled (Methods: "Monkeys were included in the model as a fixed
#   effect"). The reported error df confirm this: FA tracts 3200 values less 12 cells less 1
#   = 3187; CB subregions 1374 - 17 = 1357; SCC target ROIs 20348 - 69 = 20279; networks
#   21992 - 25 = 21967; monkey D (no monkey term) tracts 1250 - 12 = 1238, subregions 508 - 16
#   = 492, networks 10996 - 24 = 10972, target ROIs 10174 - 68 = 10106. The sum of squares type
#   is not stated; MATLAB anovan's default (type III) is the reading, and type II is run as a
#   variant (cell sizes are unequal, so the two can differ).
# - Tukey-Kramer post hoc tests: the paper says only "followed by a post hoc Tukey-Kramer test";
#   which family it covers is not stated. The reading is all pairwise comparisons among the
#   cells of the three named factors (MATLAB multcompare on the three factor dimensions), with
#   the pre against post pair of each side and tract/ROI read off; the author should check
#   whether the deposited code settles it. Exact P values printed as 0 in Supplementary Table 9
#   are below MATLAB's precision (the legends write P < 1.00 x 10^-300).
# - Where a criterion says "under both readings" (or "all readings") and the readings give
#   different outcomes, the claim is blocked as methods_underspecified with every result shown
#   (protocol, reader step 3).
# - Effect sizes: partial eta squared = SS_effect / (SS_effect + SS_error) (Supplementary
#   Methods 7).
# - The "one-way ANOVA" with monkey as a fixed effect (behavior, CC1/DAPI, g-ratio) is open:
#   (a) condition, monkey and condition x monkey (4 cells; the reported df 1,236, 1,108, 1,696
#   and 1,76 match this: 240, 112, 700 and 80 values less 4); (b) condition and monkey only
#   (df one larger). Both are run.
# - Seed-based fMRI: seed = area 25 of the D99 atlas in the stimulated (N, T) or sham (D)
#   hemisphere, right SCC for the nonsurgical controls. Fisher Z of the Pearson correlation
#   between the seed's mean time series and every voxel (AFNI 3dTcorr1D), each voxel's Z then
#   divided by the session's maximum Z. Whether runs are correlated one by one and averaged
#   (as the connectome analysis does, "For each run ... averaged within condition") or
#   concatenated is not stated: both are readings. Values are voxels in NMT space; "stimulation
#   side" pools each monkey's own stimulated hemisphere. The voxel counts confirm this: the
#   pooled N and T count per side (e.g. DMN 857) equals monkey D's left plus right count
#   (453 + 404). Target ROIs are those of Supplementary Methods 4 with the voxel counts of
#   Supplementary Table 8; where an atlas label is ambiguous (STG, dorsal insula, HIP, AMY, V1,
#   MT), the definition whose pooled voxel count matches Table 8 is the one meant.
# - Network hubs (Methods): DMN = PCC, vmFC, STG; SAN = anterior-dorsal insula, dACC; CEN =
#   DLPFC, PPC; LIM = area 32, dACC, MCC, PCC, HIP, AMY; SMN = motor cortex, somatosensory
#   cortex, SMA; VIS = V1, MT. Voxels of a hub ROI used in two networks are counted in both.
#   The LIM count in Fig. 5c (821) equals the Methods list (803) plus area 25 (18), and the
#   Extended Data Fig. 9 legend counts SCC as a LIM hub; so LIM is open, (a) with area 25 (the
#   reported n) and (b) without (the Methods).
# - Whole-brain connectome (Fig. 4): AFNI 3dNetCorr on CHARM and SARM level 4 ROIs, 122 ROIs as
#   listed in Supplementary Tables 3 and 4 (hemispheres not separated in those lists; whether
#   left and right ROIs are merged is not stated), Fisher Z per run, averaged per condition, post
#   minus pre per subject, averaged across subjects.
#
# Paper inconsistencies found while reading (for the author's notes, not claims):
# - Supplementary Tables 3, 4 and 11 (rank-biserial effect sizes for the DBS group, the
#   nonsurgical controls and monkey D) are identical value for value, and their values (for
#   example area_25 r_rb = -0.164) are far too small for the P values of Supplementary Table 1
#   (3.7e-14 for area_25 with 122 against 122 values). No claim uses them.
# - Supplementary Tables 1, 2 and 10 list P values up to 3.9e-4 as significant at "P < 0.01 with
#   Bonferroni correction"; over 122 ROIs the uncorrected threshold would be 8.2e-5. The listed
#   values are therefore either Bonferroni-adjusted or the threshold is not 0.01/122.
# - Fig. 6a legend gives the PrePost x side x tract interaction as F 1,1238 = 6.02, P = 0.0025.
#   With three tracts that interaction has 2 numerator df; F(2,1238) = 6.02 gives P = 0.0025 and
#   F(1,1238) = 6.02 gives P = 0.014.
# - Supplementary Methods 4 lists "area 25 on the unstimulated side" as a target, while Table 8
#   lists area 25 on both sides (18 voxels each).
# - Supplementary Table 9 gives MT on the control side P = 7.85e-7, while the Results say there
#   was no change in "areas within the VIS".
# - Extended Data Fig. 10d legend says the post scan was 10 weeks after implantation; the Methods
#   say 6 weeks of implantation without stimulation.
