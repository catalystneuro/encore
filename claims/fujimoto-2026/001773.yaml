- id: fig4a-cortical-down-subcortical-up
  statement: After SCC-DBS, whole-brain functional connectivity between cortical areas
    decreased and connectivity between subcortical areas increased.
  source: Results, Whole-brain functional connectivity changes following SCC-DBS, paragraph 1;
    Fig. 4a top right, Fig. 4b top
  quote: Broadly, we observed a reduction in cortico–cortical functional connectivity and a
    concurrent increase in subcortico–subcortical functional connectivity
  criterion: The paper reports no test of the blocks; the pattern is read from the difference
    connectome (Fig. 4a) and the per-ROI changes (Fig. 4b). Connectome as in the opening
    comment, DBS group (N and T). Readings (a) the mean of the off-diagonal entries of the
    group difference connectome within the cortical (CHARM) block and within the subcortical
    (SARM) block; (b) each ROI's mean change to all other ROIs (the Fig. 4b measure), with the
    median over cortical ROIs and over subcortical ROIs. Reproduced when, under both readings,
