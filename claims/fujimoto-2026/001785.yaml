# Claims for Fujimoto, Fujimoto, Elorette et al. (2026), Nature Neuroscience,
# doi:10.1038/s41593-026-02301-4, on dandiset 001785.
#
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21,
# protocol as stated in docs/protocol.md.
#
# Text read: the version of record as served by Europe PMC (PMC13337501), with main text,
# Methods, figure legends and Extended Data legends, and the Supplementary Information PDF
# (41593_2026_2301_MOESM1_ESM.pdf; Supplementary Methods 1 to 7 and Supplementary Tables 1 to
# 11), extracted as text into paper/10.1038-s41593-026-02301-4.txt. The PDF of the article was
# not available; no figure had to be read from it.
#
# Code read: the paper's Code availability points to DANDI:001773 version 0.260416.1939
# (doi:10.48324/dandi.001773/0.260416.1939). It holds a README, 17 MATLAB scripts under code/
# (one per figure; two pairs are duplicates under two names) and the paper's source-data
# spreadsheets under source_data/. The scripts start from the spreadsheets (voxel-wise FA,
# voxel-wise normalized seed FC, per-field CC1 and DAPI counts, per-axon g-ratios, behavior
# bins), not from images; the FC matrix script starts from AFNI residual files. Read:
# Fig2A_dbs_FA_wholetract_analysisscript_a.m, Fig2B_dbs_FA_CB_part_analysisscript_a.m,
# Fig3CandE5_dbs_IF_CC1_MCC_CB_analysisscript_a.m, FigE6A_..., FigE6B_...,
# Fig3F_dbs_EMgratio_analysisscript_a.m, Fig4andE10C_Fujimoto_NatNeuro_2026_FCmatrix.m,
# Fig5BCandE9_dbs_FC_25norm_mkNT_analysisscript_a.m, Fig6A_..., Fig6B_..., Fig6C_...,
# Fig6DandE10D_dbs_FC_25norm_mkD_analysisscript_a.m, FigE1_dbs_behavior_analysisscript_a.m.
#
# Data the paper used (Methods, Subjects; Acquisition and processing of neuroimaging data):
# - Monkeys N and T (male rhesus, 7 to 9 years), SCC-DBS lead implanted unilaterally (left in
#   N, right in T), 4 weeks of recovery, then 6 weeks of chronic stimulation (130 Hz, 90 us,
#   5 mA) through the contact nearest the confluence of CB, UF and FM.
# - Monkey D, nonstimulation control: lead implanted on the left, no stimulation.
# - Monkeys B, W and H, nonsurgical controls: rs-fMRI and T1w only, two sessions 6 to 7 weeks
#   apart.
# - MRI (3 T Siemens Skyra, isoflurane anesthesia), one session before implantation and one
#   after the 6 weeks (lead removed about 20 min before): T1w (0.5 mm); DWI (b = 1000, 72
#   directions, 1.5 mm, six runs, three AP and three PA); rs-fMRI (MION contrast, 1.6 mm, TR
#   2.12 s, six runs of 300 volumes).
# - Histology after the post scan: CC1 and DAPI immunofluorescence, four coronal sections per
#   animal and region, 7 fields per hemisphere per section (MCC-CB, dACC-CB) or 5 (UF and FM
#   overlap); electron microscopy of the MCC-CB in N and T, about 175 axons per hemisphere per
#   animal, four measurements per axon.
# - Home-cage behavior videos, 10 min, 60 bins of 10 s binarized for movement and foraging,
#   before implantation and after 6 weeks of stimulation (N, T, D).
# The archive's description of 001785 lists DWI (FA) and T1w for N, T, D; EPI for N, T, D and
# B, W, H; CC1 immunofluorescence (MCC-CB, dACC-CB, UF-FM overlap for N and T, MCC-CB for D);
# and EM for N and T. It does not list behavior.
#
# Outside data (Reader, step 4):
# - DANDI:001773 version 0.260416.1939, the paper's own deposit: source-data spreadsheets and
#   the scripts. The behavior bins are there (source_data/dbs_behavior_data_a.xlsx), so the
#   behavior claims are data elsewhere. The other spreadsheets hold the paper's per-voxel,
#   per-field and per-axon values; an author may use them to link the dataset to the paper's
#   values (kind link), not to replace the dataset's measurements.
# - Atlases in NMT v2.0 space (Methods, EPI data analysis and FA analysis): the NMT v2.0
#   template, the D99 atlas, CHARM and SARM, distributed with AFNI and listed on PRIME-DRE
#   (https://prime-re.github.io/). The paper gives no version beyond NMT 2.0. Claims whose ROIs
#   or CB subregions come from these atlases are data with_inputs.
#
# Shared methods, from the Methods, the Supplementary Methods and the code. Each criterion
# below refers to these blocks by name.
#
# [FA] FA from DTIFIT after the preprocessing of Supplementary Methods 1 (MP-PCA denoising,
#   AP/PA merge, susceptibility, eddy and bias correction, b0 brain extraction, linear
#   alignment to the session T1w). Each session's FA map registered to its own T1w with
#   epi_reg; post-DBS T1w registered nonlinearly to pre-DBS T1w with ANTs; post FA brought to
#   pre-DBS T1w space. FA taken voxel-wise (1.5 mm) inside each tract mask, each hemisphere
#   apart; voxels on the DBS lead track excluded. Tract masks (Methods, Identification of white
#   matter tracts; Supplementary Methods 2): ProbtrackX in native diffusion space (3200 steps,
#   10000 samples, step 0.1 mm, curvature 0.2) from seed, waypoint and exclusion masks drawn by
#   hand; each tract log-transformed, divided by its maximum and thresholded at 0.7 to 1. The
#   seed masks were drawn by hand and are not given; a mask drawn by an agent would be an
#   agent's choice, so these claims need the paper's masks (or tracts) from the dataset. The
#   reported voxel counts check them. Open, how lead-track voxels were found; readings (a)
#   voxels on the CT-defined lead location aligned to pre-DBS T1w (Methods, SCC-DBS
#   implantation surgery), (b) voxels on the visible track in the post-DBS images.
#   "Stimulated side" is the left hemisphere for N and D and the right for T; n pools the two
#   animals' voxels.
# [FA-ANOVA] As the code does it (anovan, MATLAB default type III sums of squares): for N and T,
#   FA on monkey (main effect only), PrePost, side and tract (or CB subregion), with the
#   PrePost x side, PrePost x tract, side x tract and PrePost x side x tract terms; the
#   resulting error df match the paper's (3187, 1357). Post hoc, multcompare with
#   Tukey-Kramer (MATLAB's default) over all pairs of the PrePost x side x tract cells, on
#   population marginal means; the pre-post pair of each side and tract is read. For monkey D,
#   the full three-way factorial without a monkey term (error df 1238 and 492, as reported).
# [CB-PARTS] CB subregions from D99 (Methods, FA analysis): SCC part next to areas 25 and 32,
#   dACC part next to area 24, MCC part next to area 24', PCC part next to area 23. Open, how
#   "adjacent" assigns a CB voxel; readings (a) the D99 label nearest to the voxel, (b) the
#   anterior-posterior extent of each area applied to the CB mask. The voxel counts in the
#   Fig. 2b legend check the reading.
# [IF] Per field (x20, nonoverlapping), CC1-positive and DAPI-positive counts and their ratio in
#   percent. Counts were made in FIJI with section-specific intensity thresholds, checked
#   against manual counts; the thresholds are not reported. If the dataset holds counts they
#   are used; if it holds images only, the threshold is open, readings (a) an automatic
#   per-section, per-channel threshold (FIJI default IsoData), (b) Otsu. For N and T, anovan
#   with the full model monkey x side (the code; error df 108 or 76 as reported), the side main
#   effect read. For D, a two-sided paired t-test of sham against control fields, pairs as
#   rows of the paper's sheet (Fig6C_dbs_IF_CC1_mkD_MCC_CB_analysisscript_a.m). The Methods do
#   not say how fields are paired; the reading the text allows is by section and field index
#   within section, the order in which the fields were taken.
# [EM] Per axon, longest and shortest axon diameters and myelin widths; g-ratio = mean axon
#   diameter / (mean axon diameter + 2 x mean myelin width); axons with aspect ratio above 2
#   excluded, regions with fixation artifacts or noncompaction excluded. anovan full model
#   monkey x side (the code; error df 696), the side main effect read.
# [EPI] Custom AFNI pipeline (Methods, EPI data analysis): slice-timing correction, first three
#   TRs removed, motion correction, alignment to the session T1w and warp to NMT v2.0, 3 mm
#   FWHM blur, percent signal change, regression of motion derivatives and CSF and white
#   matter signals (the code reads errts.<subject>.fanaticor files, AFNI's fast ANATICOR).
# [MATRIX] 3dNetCorr Fisher z between ROIs of CHARM and SARM level 4 (122 ROIs in the Fig. 4b
#   legend). The Methods compute one matrix per run, Fisher z, averaged within condition; the
#   code runs 3dNetCorr once per session on the residual file (all runs together), kept as a
#   variant. Difference post minus pre per subject, then the mean over subjects of the group
#   (N and T; B, W and H; D alone). Cortical ROIs are the CHARM ones (54, the first 54 in the
#   code's order), subcortical the SARM ones. Per ROI, the post minus pre changes from that ROI
#   to the 121 others (group mean). Test (code and legend, "changes ... from zero") is a
#   Wilcoxon rank-sum test of these 121 values against 121 zeros; the Methods' wording "between
#   pre and post conditions" leaves the test open and the legend and code settle it, so a
#   rank-sum of the ROI's 121 pre values against its 121 post values is shown as a variant
#   only. Threshold, open between the Methods and legend ("P < 0.01
#   with Bonferroni correction", read as p < 0.01/122) and the code (p < 0.05/122); the ROIs of
#   Supplementary Tables 1, 2 and 10 all have p below 0.05/122 and include seven, eight and
#   seven ROIs above 0.01/122, so the tables follow the code. The code's circular plots use
#   the 54 cortical ROIs only. Circular plots draw pairs with a
#   change beyond 0.1 (legend); the code uses 0.15, a variant.
# [SEED] Seed is D99 area 25 in the stimulated (for D, implanted) hemisphere; for the
#   nonsurgical controls the right area 25 (Fig. 5a legend). Fisher z of the Pearson
#   correlation between the seed's mean time series and every voxel (3dTcorr1D); each voxel's
#   z divided by the session's maximum z. Open, two details. Runs, readings (a) per run then
#   averaged, as the Methods do for the matrix, (b) the session's residual series. Maximum,
#   readings (a) over all brain voxels, the seed included, (b) over voxels outside the seed.
#   Target ROIs from Supplementary Methods 4, in the order and with the voxel counts of
#   Supplementary Table 8 (1 PCC, 2 vmFC, 3 STG, 4 anterior-dorsal insula, 5 dACC, 6 DLPFC,
#   7 PPC, 8 area 25 of the other hemisphere, 9 area 32, 10 MCC, 11 HIP, 12 AMY, 13 sensory
#   cortex, 14 motor cortex, 15 SMA, 16 visual cortex V1, 17 MT), each taken in the stimulated
#   and in the control hemisphere. Each monkey contributes the voxels of the ROI in the
#   hemisphere concerned, which is why the stimulated and control n are equal. Open, the voxel
#   grid; readings 1.5 mm (the atlas file name in the matrix code) and 1.6 mm (EPI); the
#   Supplementary Table 8 counts decide.
# [SEED-ANOVA] As the code does it: normalized z on monkey (main effect), PrePost, side and
#   ROI with the same terms as [FA-ANOVA] (error df 20279, as reported); multcompare
#   Tukey-Kramer over the PrePost x side x ROI cells. Networks (code; Methods, EPI data
#   analysis; Extended Data Fig. 9a): DMN = PCC, vmFC, STG; SAN = anterior-dorsal insula,
#   dACC; CEN = DLPFC, PPC; LIM = PCC, dACC, area 25, area 32, MCC, HIP, AMY; SMN = sensory
#   cortex, motor cortex, SMA; VIS = V1, MT. Voxels of shared ROIs are counted in each network.
#   The Methods' LIM list leaves out area 25; the code, Extended Data Fig. 9a ("SCC, dACC and
#   PCC were counted as hubs for the LIM") and the reported n (821 = 249 + 162 + 18 + 48 + 101
#   + 132 + 111) include it, so it is included. The same model on network in place of ROI
#   (error df 21967). For D, the full three-way factorial without monkey (error df 10106 and
#   10972).
#
# Open method details (the lead-track exclusion of [FA], the adjacency rule of [CB-PARTS], the
# runs and maximum of [SEED], the summary statistic of the matrix claims): each is run under every
# reading named; the outcome is the one they all give, and the claim is blocked as
# methods_underspecified when they differ (docs/protocol.md, Reader, step 3).
#
# Discrepancies in the text, recorded for the author: Fig. 6a prints "F 1,1238 = 6.02,
# P = 0.0025" for the PrePost x side x tract interaction; F(1, 1238) = 6.02 gives P near 0.014
# and F(2, 1238) gives 0.0025, and the three-way term has 2 df, so the 1 is taken as a misprint.
# Supplementary Tables 3, 4 and 11 (effect sizes) hold identical values, so they are not used.
# Extended Data Fig. 10d calls the post scan of D "10 weeks after implantation"; the Methods say
# 6 weeks of implantation without stimulation (after the 4-week recovery, 10 weeks in all).
