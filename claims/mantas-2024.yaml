- id: figs2-evoked-da-dcp-ccp
  statement: Optogenetic activation of Anxa1+ DANs evokes DA release in the dCP at varying
    intensities, and the evoked release in the cCP has a lower amplitude.
  source: Results, Specialized organization of Anxa1+ DANs, paragraph 2; Figure S2
  quote: Optogenetic activation of Anxa1+ DANs at varying intensities elicited DA release in the dCP
    ... optogenetically evoked DA release in the cCP exhibited a lower amplitude compared to the dCP
    signal
  criterion: dLight1.3b z-scored signal aligned to ChRmine stimulation (1 s at 40 Hz, Methods). The
    intensities, window, test and n are in Figure S2, which was not read; all are open. Reproduced
    when the peak of the mean evoked response after stimulation onset exceeds the pre-stimulus
    baseline in dCP and is lower in cCP than in dCP, per recording, by a two-sided unpaired t-test
    (the Methods' two-group test) at p < 0.05. Peak within 0 to 1 s and within 0 to 2 s of onset are
    both run. These windows are set here (the train lasts 1 s, Methods); whether dCP and cCP were
    recorded in the same or in different mice is not given, and a paired t-test is run as well
    where the same mice hold both. The main text says only "at varying intensities"; which powers
    enter the comparison, the unit (session or mouse) and the pre-stimulus baseline window are not
    given (Figure S2 not read). The readings are (a) each session's mean over all trains, all powers
    pooled, the session as unit; (b) each power alone, the session as unit. A per-mouse summary is
    reported, not judged (two mice per site). The baseline is the mean z-score over (i) 1 s and
    (ii) 2 s before train onset; both are run.
- id: fig2i-striosomal-features
  statement: Anxa1+ DAN axons in dorsolateral CP are enriched in MOR+ striosomes and the
