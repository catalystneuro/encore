- id: fig3d-anxa1-ramp-to-touch
  statement: Anxa1+ and DAT+ axons in dCP ramp up before a water drop, peak at contact with it, and
    return quickly to baseline during water consumption.
  source: Results, Anxa1+ DANs do not encode motivational value, paragraph 1; Figure 3D
  quote: Recordings showed that the Anxa1+ as well as the DAT+ axons in dCP exhibited a ramping
    activity that peaked upon contact with the water droplet, followed by a rapid return to baseline
    during water consumption
  statistics:
  - about: Anxa1 GCaMP-dCP, AUC across the three windows
    test: RM one-way ANOVA
    statistic: F(1.725, 15.52) = 13.26
    p: 0.0006
    n: 7 mice, 10 recordings
  - about: Anxa1 GCaMP-dCP, second against third window
    test: Sidak's post-hoc test
    p: 0.0003
  - about: DAT GCaMP-dCP, AUC across the three windows
    test: RM one-way ANOVA
    statistic: F(1.093, 3.278) = 10.39
    p: 0.0421
    n: 3 mice, 4 recordings
  - about: DAT GCaMP-dCP, first against second window
    test: Sidak's post-hoc test
    p: 0.0228
  criterion: Z-scored signals aligned to the water drop touch; per recording, the mean over touches
    of the AUC in three windows; RM one-way ANOVA (Geisser-Greenhouse corrected, as the fractional
    degrees of freedom show) with Sidak's post hoc, the recording as unit (legend). The first window
    is the baseline (legend of 3F-G). The window edges are drawn only in Figure 3D, which was not
    seen; they are open. Readings are (a) 1 s windows, -2 to -1, -1 to 0 and 0 to 1 s from touch,
    the width the paper uses for motif AUC in Figure 4, and (b) 2 s windows, -4 to -2, -2 to 0 and 0
    to 2 s. Reproduced when, under a reading, the Anxa1 ANOVA has p < 0.05 and AUC is larger in the
    second window than the third at Sidak p < 0.05, and the DAT ANOVA has p < 0.05 with the second
    window larger than the first. A reader may be asked for the edges from the figure. The event
    is "the water drop touch" (legend) and "contact with the water droplet" (Results); the paper
    names no event types. Readings are (i) correct (drop retrieved) touches only and (ii) every
    contact with a drop (correct, drop and semidrop); empty-spout events are not touches of a drop
    and are excluded in both. Each window reading is run with both. The paper gives no rule for
    which recordings enter (legend n of 10, 4, 13 and 11) and does not say whether "Artifacts and
    instances of signal intensity loss were excluded" (Methods) drops whole recordings or stretches
    of signal. Every recording of the group and site with at least one event is used; the n used
    is reported against the legend's, and a per-mouse summary is reported, not judged.
