# Claims for Mantas, Contestabile, Skara et al. (2024), bioRxiv preprint 10.1101/2024.12.22.629963
# (version 1, posted 22 December 2024), on dandiset 001828.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21, under
# docs/protocol.md (version pilot-10), Reader section.
#
# Text read. The preprint's full text as served by bioRxiv, in paper/10.1101-2024.12.22.629963.txt:
# Summary, Introduction, Results, the legends of Figures 1 to 6, Discussion, Methods, and Code and
# data availability. No PDF was supplied, so no figure was seen and no group value, spread or
# window edge drawn only in a panel is known here. The supplementary material (Figures S1 to S6
# and their legends, Supplementary Videos 1 to 3) is not in the text read. The main findings rest
# on the main figures and the Methods, which are present. Claims that cite a supplementary figure
# rest on the sentence of the Results that cites it, and no number, test or n from those figures
# is known here.
#
# Code read. None. The paper lists its code in "a Key Resource Table ... at Zenodo
# (http://doi.org/10.5281/zenodo.14138011)"; on 2026-10-21 that DOI did not resolve (doi.org and
# the Zenodo API both answer 404, "not registered"). The dandiset links the conversion code
# github.com/catalystneuro/meletis-lab-to-nwb, which is not the paper's analysis code and was not
# read. Every method detail below is therefore from the Methods and the figure legends.
#
# Data the paper used (male and female C57BL/6N background mice, 2 to 6 months old).
# - Histology (Figure 1, Figure 2). RNAscope ISH and immunofluorescence of Anxa1, Aldh1a1 and Th in
#   SNc and VTA, counted in Imaris: MitoPark (MP-early, 10 to 12 weeks, n = 5) and controls (n = 5);
#   unilateral low-dose 6-OHDA into the right medial forebrain bundle (n = 4, intact against
#   lesioned side); 24 week old cAtg7KO (n = 5) and controls (n = 5). eYFP labeling of Anxa1+ DANs
#   in Anxa1-Flp mice (fDIO-eYFP into SNc), with 6-OHDA in n = 5 mice.
# - Bulk RNA-seq of FACS-sorted DANs, MP-early (n = 5) and cMfn2KO-early (n = 5, 3 weeks after
#   tamoxifen) with controls; deposited at NCBI GEO, GSE282753 ("available upon publication").
# - RT-qPCR of iPSC-derived DANs, healthy donors against SNCA triplication, normalized to B2M.
# - Fiber photometry (60 fps, 470 nm signal, 405 nm isosbestic, processed in DoricStudio V5,
#   z-scored), fibers in CP at AP +0.74, ML 1.5, DV -2.2. Groups: Anxa1 GCaMP-dCP (Anxa1-Flp,
#   Flp-dependent GCaMP8m), DAT GCaMP-dCP (DAT-Cre, FLEX-GCaMP8m), dLight-dCP and dLight-cCP
#   (dLight1.3b in C57BL6). Recorded (a) during licking of a water drop from a spout in water
#   deprived, freely moving mice, aligned to the drop touch tracked by a high-speed camera
#   (Figure 3D to 3G: 7 Anxa1 mice, 10 recordings; 3 DAT mice, 4; 6 dLight-dCP mice, 13; 6
#   dLight-cCP mice, 11) and (b) during 20 min of open field exploration (Figure 4: 9 Anxa1 mice, 9
#   recordings; 5 DAT mice, 7; 6 dLight-dCP mice, 8; 6 dLight-cCP mice, 7). Optogenetically
#   evoked dLight release with Flp-dependent ChRmine (Figure S2).
# - Open field video from below (40 x 40 box, 30 fps, 800 x 800 px), DeepLabCut pose of snout, four
#   paws and tail base; linear and angular speed, acceleration, immobility; VAME motifs (37 motifs,
#   grouped into action categories). Groups of Figure 5: Ctrl-Tdtomato n = 18, Anxa1-TeTx n = 14;
#   Ctrl-Asc Acid n = 9, 6OHDA-low n = 11; Ctrl-early n = 14, MP-early (10 to 12 weeks) n = 13;
#   Ctrl-middle n = 15, MP-middle (15 to 18 weeks) n = 14.
# - Optogenetic self-stimulation (ChRmine in SNc of Anxa1-Flp or DAT-Cre; 1 s, 40 Hz, 5 mW, 640
#   nm per poke): two 15 min sessions with the right port active, then four with the left port
#   active (Ctrl-Tdtomato n = 6, Anxa1-ChRmine n = 10, DAT-ChRmine n = 9).
# - Fixed and progressive ratio nosepoking for 2 ul water, 15 min sessions: FR1, FR2, FR3, two
#   days FR5, two days PR (1-2-2-4-4-8...), Anxa1-TeTx against controls (n not given in the text).
# - Arrow maze (40 x 40 cm, central and two lateral corridors, 3 ul drops, left corridor rewarded,
#   10 min per day, four days; Bonsai end-zone entries, 30 fps video), Ctrl-Tdtomato n = 18,
#   Anxa1-TeTx n = 10.
# - Forelimb reaching for a water drop (spout 1 cm from the wall, 5.5 cm high, every 5 to 7 s),
#   four daily 15 min sessions after habituation, lateral video at 60 fps, distances of each grasp
#   from the spout measured by hand in Kinovea; Ctrl n = 8, Anxa1-TeTx n = 4, Anxa1-Arch n = 6
#   (continuous 532 nm, 5 mW, during the last three sessions).
# Dandiset 001828 has the paper's title and summary as its description; the archive does not say
# which of these experiments it holds. Which it holds is for the author to find.
#
# Methods common to several criteria (Methods, Statistical analysis and graphs, and legends).
# Tests were run in GraphPad Prism 10. Two-sided unpaired and paired t-tests; one-sample two-tailed
# t-tests with Bonferroni correction; multiple unpaired t-tests with Holm-Sidak adjustment (alpha
# 0.05); Kruskal-Wallis and Friedman tests with Dunn's post hoc; RM one-way, two-way and RM two-way
# ANOVA with Sidak's post hoc. R is the Pearson correlation coefficient (Figures 4 and 5). Alpha
# 0.05 throughout.
# Details the text does not fix, used by several criteria, each named again where it matters:
# - The DoricStudio normalization, filtering and subtraction parameters, and the period over which
#   the signal is z-scored. If the dataset holds the processed z-scored traces, they are used;
#   otherwise the readings are (a) z-score over the whole session and (b) z-score against a
#   pre-event baseline, and the claim is judged under both.
# - Which DeepLabCut point (or their mean) gives linear speed, the smoothing, and the immobility
#   threshold. Speed and immobility values in the dataset, if present, are used; otherwise the
#   readings are (a) the tail base, (b) the mean of the six points; the immobility threshold is
#   open, and claims on immobility are judged only where a value from the dataset or the paper
#   exists.
# - The VAME motif labels cannot be recomputed as the paper made them (training on 195 videos with
#   random initialization). The motif claims use the paper's motif label per frame, if the
#   dataset holds it; a new VAME fit is not a basis for an outcome.
