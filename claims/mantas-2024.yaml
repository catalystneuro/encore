  quote: we found that the Anxa1+ DANs were localized in the ventral part of the SNc, and a small
    fraction was found in the VTA region ... Anxa1+ DANs were localized laterally in the anterior
    portions of the SNc, with their distribution becoming progressively more medial towards more
    posterior coronal planes
  criterion: From cell coordinates (X-Y per section, Methods, Anatomical tracing) with the medial
    lemniscus as the SNc-VTA border. Reproduced when the median dorsoventral position of Anxa1+
    DANs is ventral to that of Aldh1a1+/Anxa1- and Th-only DANs, most Anxa1+ DANs lie in SNc, and
    their median mediolateral distance from the midline decreases from the most anterior to the
