    p: 0.0228
  depends_on:
  - fig3d-anxa1-ramp-to-touch
  criterion: As in fig3d-anxa1-ramp-to-touch, with the same window, event and recording readings. Reproduced when, under a
    reading, dLight-dCP has ANOVA p < 0.05 and the second window larger than the third at Sidak p <
    0.05, and dLight-cCP has ANOVA p < 0.05 with both the second and third windows larger than the
    first at Sidak p < 0.05.
- id: fig3fg-auc-change-from-baseline
  statement: Against the baseline window, the legend lists three AUC changes, the second window of
    DAT GCaMP-dCP (p = 0.0308) and of dLight-cCP (p = 0.0028) and the third window of dLight-cCP (p
    = 0.0148), with only the dLight-cCP second window marked significant; the other groups and
    windows are not listed.
  source: Figure 3F and 3G
  inferred: Read from the legend of Figure 3F-G, which lists the significant comparisons; no
    sentence of the Results states them.
  statistics:
  - about: DAT GCaMP-dCP, second window against baseline
    test: one-sample two-tailed t-test
    p: 0.0308
    corrected: Bonferroni
  - about: dLight-cCP, second window against baseline
    test: one-sample two-tailed t-test
    p: 0.0028
    corrected: Bonferroni
  - about: dLight-cCP, third window against baseline
    test: one-sample two-tailed t-test
    p: 0.0148
    corrected: Bonferroni
  depends_on:
  - fig3d-anxa1-ramp-to-touch
  criterion: Per recording, the AUC of the second and of the third window minus that of the first;
    one-sample two-tailed t-test against 0, Bonferroni corrected over the eight tests (four groups,
    two windows), window, event and recording readings as in fig3d-anxa1-ramp-to-touch. Only dLight-cCP second carries
    an asterisk in the legend; whether the printed p are corrected, and over how many tests, is
    open. The single asterisk fits printed raw p with Bonferroni over eight tests (all groups and
    windows) or over four (the groups, per window); both families are run. Reproduced when, under a
    window reading, the dLight-cCP second-window change is positive and significant after
    Bonferroni under a family, and the other two listed changes are positive; their raw and
    corrected p and the other five tests are reported.
- id: fig3i-dat-not-anxa1-self-stimulation
  statement: Optogenetic activation of DAT+ neurons strongly reinforces self-stimulation in the first
    two days, while activation of Anxa1+ DANs does not.
  source: Results, Anxa1+ DANs do not encode motivational value, paragraph 2; Figure 3I and 3J
  quote: We found that optogenetic activation of DAT+ neurons strongly reinforced self-stimulation
    during the first two days of the task ... In contrast, optogenetic activation of the Anxa1+ DANs
    did not support self-stimulation behavior
  statistics:
  - about: active pokes, three groups
    test: Kruskal-Wallis test
    p: 0.0007
    n: 6 Ctrl-Tdtomato, 10 Anxa1-ChRmine and 9 DAT-ChRmine mice
  - about: active pokes, Ctrl-Tdtomato against DAT-ChRmine
    test: Dunn's post-hoc test
    p: 0.004
  - about: active pokes, Anxa1-ChRmine against DAT-ChRmine
    test: Dunn's post-hoc test
    p: 0.0029
  - about: preference for the stimulated poke, three groups
    test: Kruskal-Wallis test
    p: 0.0003
  - about: preference, Ctrl-Tdtomato against DAT-ChRmine
    test: Dunn's post-hoc test
    p: 0.0131
  - about: preference, Anxa1-ChRmine against DAT-ChRmine
    test: Dunn's post-hoc test
    p: 0.0003
  criterion: Days 1 and 2 (right port active). Active pokes per mouse over the two days (sum or mean
    give the same ranks, so the choice cannot change the outcome). Preference is not defined in the
    text; readings are (a) active over total pokes and (b) active minus inactive pokes. Kruskal-
    Wallis over the three groups with Dunn's post hoc. Reproduced when, under a reading of
    preference, both Kruskal-Wallis tests have p < 0.05, DAT-ChRmine exceeds both other groups at
    Dunn p < 0.05 for active pokes and for preference against Anxa1-ChRmine, and Anxa1-ChRmine does
    not differ from Ctrl-Tdtomato.
- id: fig3kl-reversal-dat-only
  statement: When the active port is reversed, DAT-ChRmine mice quickly switch to the newly active
    left port, while Anxa1-ChRmine mice develop no significant preference for the active port in the
    last reversal days.
  source: Results, Anxa1+ DANs do not encode motivational value, paragraph 2; Figure 3K and 3L
  quote: When active and inactive port assignment was reversed, DAT-Cre mice quickly reversed their
    responding from the inactive (right) to the active (left) port ... mice did not develop any
    significant preference for the active port during the last days of the reversal
  statistics:
  - about: side by days, pokes before and after reversal
    test: RM two-way ANOVA
    statistic: F(4, 32) = 15.70
    p: 0.0001
    p_relation: "<"
  - about: right against left pokes
    test: Sidak's post-hoc test
    p: 0.001
    p_relation: "<"
  - about: preference across days
    test: Friedman test
    p: 0.0004
  - about: preference, day -1 against day 1
    test: Dunn's post-hoc test
    p: 0.008
  - about: preference, day 1 against day 4
    test: Dunn's post-hoc test
    p: 0.0011
  depends_on:
  - fig3i-dat-not-anxa1-self-stimulation
  criterion: The legend does not say which group the RM two-way ANOVA and Friedman test belong to;
    F(4, 32) fits 9 mice over five days, so the reading is DAT-ChRmine, days -1 and 1 to 4 (the
    other reading, all six days, is run as well). Per group, RM two-way ANOVA side by day on left
    and right pokes with Sidak's post hoc, and Friedman test on preference over days with Dunn's post
    hoc, preference read as in fig3i. Reproduced when for DAT-ChRmine the interaction has p < 0.05
    and the Friedman test has p < 0.05 with preference changed from day -1 to day 1, and, as a
    claim of absence, Anxa1-ChRmine shows no left against right difference at Sidak p < 0.05 on
    reversal days 3 and 4.
- id: fig3o-tetx-no-motivation-deficit
  statement: Mice with silenced Anxa1+ DANs show no significant change in total nosepokes in the
    FR5 or PR stages.
  source: Results, Anxa1+ DANs do not encode motivational value, paragraph 2; Figure 3M to 3O
  quote: Mice with genetic silencing of Anxa1+ DANs exhibited no significant changes in the total
    number of nosepokes during FR5 or PR tasks
  criterion: A claim of absence. The legend names no test and no n; the Methods' test for two groups
    is the two-sided unpaired t-test, used here. Total pokes per mouse over the two FR5 days and
    over the two PR days, Anxa1-TeTx against control. Reproduced when neither comparison reaches p <
    0.05; the difference and its size are reported.
- id: fig4b-speed-correlation-dcp
  statement: Anxa1+ axonal activity in the dCP correlates positively with linear speed during open
    field exploration, above a shuffled control, and DA release in dCP shows a similar correlation.
  source: Results, Anxa1+ DAN projections are activated during vigorous actions, paragraph 1; Figure
    4B
  quote: We found a significant positive correlation between Anxa1+ axonal activity in the dCP and
    linear speed, and this correlation was similar when we recorded DA release in the dCP
  statistics:
  - about: Anxa1 GCaMP-dCP, signal against shuffled correlation
    test: two-sided paired t-test
    p: 0.0039
    n: 9 mice, 9 recordings
  - about: dLight-dCP, signal against shuffled correlation
    test: two-sided paired t-test
    p: 0.0078
    n: 6 mice, 8 recordings
  criterion: Per recording, the correlation over the 20 min session of the z-scored FP signal with
    linear speed, against the same with the signal shuffled; two-sided paired t-test over
    recordings (legend). Pearson's r, the paper's R. Open, (1) the shuffle, read as (a) a random
    permutation of samples and (b) a circular shift by a random lag; (2) the time base, the FP
    signal at 60 fps averaged onto the 30 fps video frames, a standard choice; (3) speed as in the
    header. Reproduced when, under a reading, both groups have a mean correlation above 0 and above
    the shuffle at p < 0.05. The printed p equal the exact two-sided Wilcoxon signed-rank p when all
    9 (or 8) recordings lie on one side (2/512 and 2/256); the Wilcoxon test is run as a variant.
    DAT GCaMP-dCP (5 mice, 7 recordings) has no p in the legend and is reported.
- id: fig4b-speed-correlation-ccp-negative
  statement: DA release in the cCP correlates negatively with locomotion speed.
  source: Results, Anxa1+ DAN projections are activated during vigorous actions, paragraph 1; Figure
    4B
  quote: The recorded DA release in cCP instead showed a negative correlation with locomotion speed
  statistics:
  - about: dLight-cCP, signal against shuffled correlation
    test: two-sided paired t-test
    p: 0.016
    n: 6 mice, 7 recordings
  depends_on:
  - fig4b-speed-correlation-dcp
  criterion: As in fig4b-speed-correlation-dcp. Reproduced when the mean dLight-cCP correlation is
    below 0 and below the shuffle at p < 0.05 under a reading (p = 0.016 equals the exact Wilcoxon p
    2/128 for 7 recordings on one side; Wilcoxon as a variant).
- id: fig4c-vame-motifs
  statement: Unsupervised VAME analysis of open field pose identifies 37 kinematic motifs, grouped
    into action categories.
  source: Results, Anxa1+ DAN projections are activated during vigorous actions, paragraph 2; Figure
    4C; Methods, Behavioral analysis
  quote: This unsupervised analysis of postural dynamics identified 37 kinematic motifs, which we
    categorized into seven communities of actions
  expected:
    quantity: number of motifs
    value: 37
    tolerance: 0
  criterion: A count of the distinct motif labels in the paper's motif labelling (header). The
    tolerance is 0, as a label set is counted exactly. The text names seven communities while the
    legend of Figure 4C names six categories (Stationary/Sniffing, Turn, Rear, Groom, Walk,
    Sniff/Walk) and Figure 5G five; the category of each motif is drawn only in Figure 4C and is
    taken from the dataset if it holds it, otherwise it is open.
- id: fig4e-anxa1-high-speed-motifs
  statement: Anxa1+ axon activity is associated with the onset of high-speed motifs regardless of
    action type, as is DA in dCP, while DA in cCP rises strongly after the onset of low-speed
    motifs.
  source: Results, Anxa1+ DAN projections are activated during vigorous actions, paragraph 2; Figure
    4D and 4E; Figure S3
  quote: This analysis demonstrated that the activity of Anxa1+ projections was associated with
    high-speed motifs independently of the action type, and this profile was also observed in DA
    signals recorded in the dCP ... However, DA signals recorded in the cCP demonstrated a different
    pattern with strong activation after the onset of low-speed motifs
  depends_on:
  - fig4c-vame-motifs
  criterion: Mean z-scored signal aligned to each motif onset (first frame of a run of that label),
    motifs ranked by mean linear speed. Judged by fig4f-auc-correlations and fig4h-auc-motif-speed;
    in addition, reproduced for "independently of the action type" when, within at least two action
    categories, the Spearman correlation of Anxa1 AUC (0 to 1 s) with motif speed is positive, and
    for cCP when its AUC correlates negatively with motif speed. Spearman within categories is set
    here, as the paper gives no test for this sentence.
- id: fig4f-auc-correlations
  statement: Across motifs, the onset AUC of Anxa1+ terminal activity correlates positively with
    that of dLight in dCP (R = 0.70) and negatively with that of dLight in cCP (R = -0.52).
  source: Results, Anxa1+ DAN projections are activated during vigorous actions, paragraph 2; Figure
    4F and 4G
  quote: the area under the curve (AUC, 0 to 1 sec) calculated for each motif from Anxa1-terminal
    activity showed a positive correlation with the AUC of dLight signals recorded in the dCP
    (Figure 4F) and a negative correlation with the AUC of dLight signals recorded in the cCP
  statistics:
  - about: Anxa1-GCaMP-dCP against dLight-dCP motif AUC
    test: Pearson correlation
    statistic: R = 0.70
    p: 0.01
    p_relation: "<"
    n: 37 motifs
  - about: Anxa1-GCaMP-dCP against dLight-cCP motif AUC
    test: Pearson correlation
    statistic: R = -0.52
    p: 0.01
    p_relation: "<"
    n: 37 motifs
  expected:
  - quantity: R, Anxa1 against dLight-dCP motif AUC
    value: 0.70
    tolerance: 0.07
  - quantity: R, Anxa1 against dLight-cCP motif AUC
    value: -0.52
    tolerance: 0.052
  depends_on:
  - fig4c-vame-motifs
  criterion: Per motif, the AUC from 0 to 1 s after onset of the z-scored signal (legend), then
    Pearson's R over motifs between groups. Open, how traces are averaged; readings are (a) all
    onsets of all recordings of a group pooled, then the mean trace, and (b) the mean per recording,
    then the mean over recordings. Whether a pre-onset baseline is subtracted is open; readings are
    (i) the AUC of the z-scored trace as is and (ii) minus its mean over -1 to 0 s. Reproduced when,
    under a reading, both R are within tolerance and p < 0.01.
- id: fig4h-auc-motif-speed
  statement: The onset AUC of Anxa1+ terminal activity is highly correlated with mean motif linear
    speed across motifs (R = 0.83).
  source: Results, Anxa1+ DAN projections are activated during vigorous actions, paragraph 2; Figure
    4H
  quote: Furthermore, the AUC from Anxa1-terminal activity was highly positively correlated with
    motif speed
  statistics:
  - test: Pearson correlation
    statistic: R = 0.83
    p: 0.01
    p_relation: "<"
    n: 37 motifs
  expected:
    quantity: R, Anxa1 motif AUC against mean motif linear speed
    value: 0.83
    tolerance: 0.083
  depends_on:
  - fig4f-auc-correlations
  criterion: AUC readings as in fig4f-auc-correlations; motif speed is the mean linear speed over
    the frames of the motif (legend of 4H), over the Anxa1 recordings or over all mice of the
    motif set, both run. Reproduced when R is within tolerance and p < 0.01 under a reading.
- id: fig5c-tetx-locomotion
  statement: Anxa1-TeTx mice show moderate reductions in linear and angular speed in the open field,
    with a slight increase in immobility time.
  source: Results, Anxa1+ DAN silencing produces a prodromal PD bradykinetic profile, paragraph 1;
    Figure 5B to 5E
  quote: we found that Anxa1-tetanus mice showed moderate reductions in linear and angular speed,
    accompanied by a slight increase in immobility time
  criterion: Per mouse, mean linear speed, mean angular speed and immobility time over the open
    field session; two-sided unpaired t-test against Ctrl-Tdtomato (legend). Speed and immobility as
    in the header. Reproduced when linear and angular speed are lower at p < 0.05 and immobility is
    higher; partially reproduced when one speed is lower at p < 0.05. Which panels carry asterisks
    is in the figure, not seen (the legend gives only the key *p < 0.05, **p < 0.01, ***p < 0.001,
    with n = 18 Ctrl-Tdtomato and 14 Anxa1-TeTx); the p of immobility is reported.
- id: fig5e-early-models-locomotion
  statement: The mild locomotor phenotype and acceleration distribution of Anxa1-silenced mice
    resemble the early-stage PD models (mild 6-OHDA, MP-early), consistent with a bradykinetic and
    not an akinetic/rigid profile.
  source: Results, Anxa1+ DAN silencing produces a prodromal PD bradykinetic profile, paragraph 1;
    Figure 5C to 5F; Figure S4
  quote: The mild locomotor phenotype and acceleration distribution pattern in Axna1-silenced mice
    was similar to the early-stage PD models suggesting that loss of Anxa1+ DANs is linked primarily
    to a bradykinetic
  depends_on:
  - fig5c-tetx-locomotion
  criterion: No test of similarity is given. For each experimental group, the change of mean
    linear speed, mean angular speed and immobility against its own control (in percent of the
    control mean), and the acceleration density (legend of 5F). Reproduced when the changes of
    Anxa1-TeTx lie within the range spanned by 6OHDA-low and MP-early, or closer to theirs than to
    MP-middle's, for at least two of the three measures. The rule is set here; the values,
    including those of MP-middle, are reported.
- id: fig5g-pc1-stage
  statement: In a PCA of motif usage, PC1 separates the groups by PD stage, with Anxa1-TeTx mice
    between the early and middle PD models, and PC2 separates middle-stage MitoPark mice from the
    others.
  source: Results, Anxa1+ DAN silencing produces a prodromal PD bradykinetic profile, paragraph 2;
    Figure 5G
  quote: We found that the first principal component (PC1) effectively separated the groups
    according to PD stage (Figure 5G). The motif usage profile of Anxa1-tetanus mice positioned them
    between early and middle PD models along the PC1 axis ... PC2 separated middle-stage MitoPark
    mice from the other groups
  depends_on:
  - fig4c-vame-motifs
  criterion: PCA of per-mouse motif usage time (37 motifs) over all mice of the eight groups. Open,
    the scaling; readings are (a) standardized usage (Prism's default) and (b) centred only; usage
    as fraction of session time (equal sessions make seconds equivalent). The sign of a PC is
    arbitrary and is set so that MP-middle has the largest group mean. Reproduced when, under a
    reading, the group mean PC1 of Anxa1-TeTx lies between the means of the early models (6OHDA-
    low, MP-early) and MP-middle, controls lie on the low side, and the MP-middle mean on PC2 lies
    farther from the mean of all other groups than any other group's mean.
- id: fig5h-walk-stationary-loadings
  statement: Walk and stationary motifs lie at opposite extremes of PC1 in the loading plot.
  source: Results, Anxa1+ DAN silencing produces a prodromal PD bradykinetic profile, paragraph 2;
    Figure 5H
  quote: “Walk” and “stationary” motifs were prominently represented at the opposite extremes of the
    PC1 axis
  depends_on:
  - fig5g-pc1-stage
  criterion: Loadings of PC1 per motif, readings of fig5g. Reproduced when, under a reading, the
    five highest-loading motifs on one end are mostly walk motifs and the five on the other end
    are mostly stationary motifs. Motif categories from the dataset, else open (fig4c-vame-motifs).
- id: fig5i-pc1-motif-speed
  statement: Motif PC1 values correlate negatively with mean motif speed (R = -0.762), while PC2
    shows no significant correlation (R = -0.1494, p = 0.3772), nor do PC3 and PC4.
  source: Results, Anxa1+ DAN silencing produces a prodromal PD bradykinetic profile, paragraph 2;
    Figure 5I; Figure S5
  quote: linear regression analysis between motif speed and PC1 eigenvalues revealed a significant
    negative correlation (Figure 5I). In contrast, we did not observe any significant correlation
    between the eigenvalues of PC2 (Figure 5I), PC3, PC4 and motif speed
  statistics:
  - about: PC1 against motif speed
    test: linear regression
    statistic: R = -0.762
    p: 0.0001
    p_relation: "<"
    n: 37 motifs
  - about: PC2 against motif speed
    test: linear regression
    statistic: R = -0.1494
    p: 0.3772
    n: 37 motifs
  expected:
    quantity: R, PC1 value against mean motif speed
    value: -0.762
    tolerance: 0.0762
  depends_on:
  - fig5g-pc1-stage
  criterion: Per motif, the PC1 (and PC2 to PC4) loading, called eigenvalue in the paper, against
    mean motif linear speed over all mice; Pearson R. The printed p = 0.3772 for R = -0.1494 fits
    37 motifs. A PC's sign is arbitrary, so the magnitude is judged and the sign reported, with PC1
    oriented as in fig5g. Reproduced when, under a reading of fig5g, |R| for PC1 is within tolerance
    with p < 0.0001, and PC2, PC3 and PC4 each have p >= 0.05.
- id: fig5j-tetx-five-motifs
  statement: Anxa1-silenced mice show significant downregulation of five high-speed motifs (42, 34,
    16, 0 and 25), not of all vigorous high-speed motifs.
  source: Results, Anxa1+ DAN silencing produces a prodromal PD bradykinetic profile, paragraph 3;
    Figure 5J
  quote: Specifically, we found that Anxa1-silenced mice displayed significant downregulation of
    five high-speed motifs (42, 34, 16, 0 and 25)
  statistics:
  - test: multiple two-sided unpaired t-tests
    p: 0.05
    p_relation: "<"
    corrected: Holm-Sidak
    n: 18 Ctrl-Tdtomato and 14 Anxa1-TeTx mice
  depends_on:
  - fig4c-vame-motifs
  criterion: Per mouse, usage time of each of the 37 motifs; Anxa1-TeTx against Ctrl-Tdtomato,
    two-sided unpaired t-test per motif, Holm-Sidak adjusted over the 37 motifs at alpha 0.05
    (legend). Motif numbers are the paper's labels. Reproduced when exactly these five motifs are
    reduced at adjusted p < 0.05; partially reproduced when at least three of them are and no more
    than one other motif is changed.
- id: fig5j-shared-and-stage-motifs
  statement: Motifs 42 and 34 are reduced in all PD models; motifs 0 and 25 are reduced among the
    models only in middle-stage MitoPark mice; stationary motifs 3, 39, 27 and 28 are increased only
    in middle-stage MitoPark mice.
  source: Results, Anxa1+ DAN silencing produces a prodromal PD bradykinetic profile, paragraph 3;
    Figure 5J
  quote: we found a subset of motifs that were significantly reduced across all the PD models
    (motifs 42 and 34), while another subset was reduced only in the middle-staged MitoPark group
    (motif 0 and 25 ... the stationary-related motifs (3, 39, 27, and 28) were significantly
    increased only in the middle-stage MitoPark group
  statistics:
  - test: multiple two-sided unpaired t-tests
    p: 0.05
    p_relation: "<"
    corrected: Holm-Sidak
  depends_on:
  - fig5j-tetx-five-motifs
  criterion: As in fig5j-tetx-five-motifs, each model against its own control (6OHDA-low against
    Ctrl-Asc Acid, MP-early against Ctrl-early, MP-middle against Ctrl-middle). "All the PD models"
