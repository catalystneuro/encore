    Anxa1.
  source: Results, Anxa1 is a marker of an early PD vulnerable SNc DAN subpopulation, paragraph 2;
    Figure 1C; Figure S1
  quote: We found that ∼99% of Anxa1+ DANs co-expressed Aldh1a1, while ∼40% of the Aldh1a1+ DANs
    expressed Anxa1
  expected:
  - quantity: fraction of Anxa1+ DANs that are Aldh1a1+
    value: 99
    tolerance: 9.9
    unit: percent
  - quantity: fraction of Aldh1a1+ DANs that are Anxa1+
    value: 40
    tolerance: 4
    unit: percent
  criterion: Counts of Th+ cells by Anxa1 and Aldh1a1 status, pooled over the sections and mice of
