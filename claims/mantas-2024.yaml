    reading, 42 and 34 are reduced in each, 0 and 25 are reduced in MP-middle and in no other
    disease model, and 3, 39, 27 and 28 are increased in MP-middle and in no other group. Partially
    reproduced when two of the three parts hold.
- id: fig5m-walk-motif-network
  statement: Anxa1+ DAN silencing has no major effect on the overall structure of motif sequences,
    but the reduced high-speed walk motifs form a small network of high-probability transitions
    (motif 0 to 16 to 34).
  source: Results, Anxa1+ DAN silencing produces a prodromal PD bradykinetic profile, paragraph 4;
    Figure 5K to 5M; Figure S5
  quote: We did not observe any major effects in the overall structure of motif sequences after
    Anxa1+ DANs silencing (Figure S5); however, we identified that the significantly reduced
    high-speed “walk” motifs formed a small network with high-probability transition connections
    (motif 0 -> motif 16 -> motif 34
  statistics:
  - about: transitions, Anxa1-TeTx against control
    test: Fisher's Exact Test
    p: 0.05
    p_relation: "<"
    corrected: Benjamini-Hochberg
    n: 3 mice
  depends_on:
  - fig5j-tetx-five-motifs
  criterion: Transition probability from one motif to the next different motif, from the motif label
    sequence (self-transitions excluded, as in VAME's transition matrix; including them is a
    variant), pooled over control mice (Ctrl-Tdtomato). Reproduced when the probability from 0 to 16
    is the highest from motif 0 among walk motifs, and that from 16 to 34 the highest from motif 16
    among walk motifs. The legend's n = 3 mice for Figure 5M does not match n = 14 in Figure 5C, and
    the "overall structure" test is in Figure S5, not read; the Fisher's exact tests per transition
    on pooled transition counts, Benjamini-Hochberg adjusted, are run on all mice and reported.
- id: fig6c-maze-locomotion
  statement: In the arrow maze, Anxa1-silenced mice show only a small decrease in linear speed on the
    fourth day and no change in immobility time.
  source: Results, Anxa1+ DANs are necessary for procedural motor learning, paragraph 1; Figure 6C;
    Figure S6
  quote: we found that Anxa1-silenced mice displayed only minor changes in locomotion, showing a
    small decrease in linear speed on the fourth day of the test without any changes in immobility
    time
  statistics:
  - about: mean linear speed, group effect
    test: RM two-way ANOVA
    statistic: F(1,26) = 6.198
    p: 0.0195
    n: 18 Ctrl-Tdtomato and 10 Anxa1-TeTx mice
  - about: mean linear speed, Ctrl-Tdtomato against Anxa1-TeTx
    test: Sidak's post-hoc test
    p: 0.0473
  criterion: Per mouse and day (days 1 and 4), mean linear speed and immobility time over the 10 min
