  statistics:
  - about: rewarded minus error transitions, group by day interaction
    test: RM two-way ANOVA
    statistic: F(1,26) = 6.563
    p: 0.0166
    n: 18 Ctrl-Tdtomato and 10 Anxa1-TeTx mice
  - about: controls, day 1 against day 4 (printed "Day 2")
    test: Sidak's post-hoc test
    p: 0.0009
  - about: Ctrl-Tdtomato against Anxa1-TeTx
    test: Sidak's post-hoc test
    p: 0.0001
    p_relation: "<"
  criterion: Per mouse and day, the number of rewarded transitions (centre to the left, rewarded,
