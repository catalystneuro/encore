- id: fig2n-6ohda-axon-ablation
  statement: After low-dose 6-OHDA, degeneration of eYFP+ Anxa1+ SNc neurons is accompanied by
    near-complete loss of their eYFP+ axons in the dCP across the anteroposterior axis.
  source: Results, Specialized organization of Anxa1+ DANs, paragraph 4; Figure 2J to 2N
  quote: Degeneration of the eYFP+ SNc neurons was accompanied by near-complete ablation of the
    corresponding eYFP+ axons in the dCP across the anteroposterior axis
  criterion: eYFP optical density in dCP, lesioned against intact side, per section (Figure 2N, n
