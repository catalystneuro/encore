- id: fig6d-maze-efficiency
  statement: Control mice improve task efficiency (reward relative to distance traveled) over the
    four days, while Anxa1-silenced mice do not.
  source: Results, Anxa1+ DANs are necessary for procedural motor learning, paragraph 1; Figure 6D
    right; Figure S6
  quote: a significant increase in task efficiency quantified as the received reward relative to the
    traveled distance ... and did not improve their motor efficiency in the task
  statistics:
  - about: locomotor efficacy, group by day interaction
    test: RM two-way ANOVA
    statistic: F(1,26) = 6.065
    p: 0.0207
    n: 18 Ctrl-Tdtomato and 10 Anxa1-TeTx mice
  - about: controls, day 1 against day 4 (printed "Day 2")
    test: Sidak's post-hoc test
    p: 0.0001
    p_relation: "<"
  - about: Ctrl-Tdtomato against Anxa1-TeTx, one day
    test: Sidak's post-hoc test
    p: 0.0027
  - about: Ctrl-Tdtomato against Anxa1-TeTx, the other day
    test: Sidak's post-hoc test
    p: 0.0001
    p_relation: "<"
  criterion: Per mouse and day, rewards received divided by distance traveled (Results), days 1 and
    4; whether the central initiation drops count as rewards is open, readings (a) lateral rewards
    only and (b) all drops. RM two-way ANOVA group by day with Sidak's post hoc. Reproduced when,
    under a reading, the interaction has p < 0.05, controls rise from day 1 to day 4 at Sidak p <
    0.05, Anxa1-TeTx do not, and Ctrl exceeds Anxa1-TeTx on day 4 at Sidak p < 0.05. The legend's
    two group differences (p = 0.0027 and p < 0.0001) imply a difference on day 1 as well; it is
    reported.
- id: fig6j-reaching-accuracy
  statement: Control mice improve reaching accuracy over four sessions; Anxa1-TeTx mice have normal
    accuracy in the first session but fail to improve, and Anxa1-Arch mice show reduced accuracy
    during the last three sessions with optogenetic inhibition.
  source: Results, Anxa1+ DANs are necessary for procedural motor learning, paragraph 2; Figure 6H
    to 6J; Figure S6
  quote: As expected, control mice improved their reaching accuracy over the four training sessions
    ... In contrast, Anxa1-tetanus mice exhibited normal accuracy during the first session but
    failed to refine their grasping movements in subsequent sessions ... as Anxa1-Arch mice showed a
    significant reduction in reaching accuracy during the last three sessions
  statistics:
  - about: target accuracy fraction, group by day interaction
    test: RM two-way ANOVA
    statistic: F(2,14) = 5.301
    p: 0.0181
    n: 8 Ctrl, 4 Anxa1-TeTx and 6 Anxa1-Arch mice
  - about: day 1 against day 4 (printed "Day 2")
    test: Sidak's post-hoc test
    p: 0.0123
  - about: Ctrl against Anxa1-TeTx
    test: Sidak's post-hoc test
    p: 0.0063
  - about: Ctrl against Anxa1-Arch
    test: Sidak's post-hoc test
    p: 0.0268
  criterion: Per mouse and session, the fraction of grasp attempts with the preferred forelimb whose
    measured distance from the target is within a threshold (Results; distances measured by hand in
    Kinovea). The threshold is given as < 0.2 cm in the Results and < 0.1 cm in the legend of 6J;
    both are run. RM two-way ANOVA group by day on days 1 and 4 with Sidak's post hoc. Reproduced
    when, under a reading, the interaction has p < 0.05, controls improve from day 1 to day 4 at
    Sidak p < 0.05, controls exceed both Anxa1-TeTx and Anxa1-Arch on day 4 at Sidak p < 0.05, and
    Anxa1-TeTx does not differ from controls on day 1. The residual df of 14 fits 17 mice with both
    days, one fewer than 8 + 4 + 6; which mouse was left out is not given, so all 18 are used and
    each single exclusion is shown as a variant. The paper does not define a grasp attempt by event
    type. It describes a reaching attempt as start, "grasping upon contact with the water droplet"
    and retraction (Results), and Figure 6F shows on- and off-target efforts. The readings are (a) every
    labelled reach with a distance, and (b) all but empty-spout and unknown events. The preferred
    forelimb is not defined; readings are (i) per mouse over all its sessions, (ii) per session.
    Day 1 and day 4 are the first and fourth of four consecutive training sessions after
    habituation (Methods); the paper does not map these to session labels, so the first and
    fourth training sessions of each mouse are used. For Arch, the laser is off on day 1 and on
    during days 2 to 4 (Methods, Results); a session labelled otherwise is reported as departing
    from the paper. The legend has one control group (Ctrl, n = 8) in a single ANOVA with both
    silenced groups, so the controls are one pooled group; the paper does not say from which
    cohort they come, and controls of both cohorts are pooled. Mice recorded after the preprint
    (22 December 2024) cannot be in the figure; the main run uses mice recorded before it, all
    mice with both days are a variant.
