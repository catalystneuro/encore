- id: fig6d-maze-preference-learning
  statement: Control mice learn to prefer the rewarded arm over four days, while Anxa1-silenced mice
    show no increase in preference for the rewarded arm.
  source: Results, Anxa1+ DANs are necessary for procedural motor learning, paragraph 1; Figure 6B
    and 6D left
  quote: Control mice successfully learned the basic task strategy over the four days, as evidenced
    by a significant increase in the preference for the rewarded arm ... However, mice with silenced
