- id: fig4c-photoidentification
  statement: BLA-NAc and BLA-CeA neurons are identified by short-latency responses to light at the
    end of each session.
  source: Results, NT inputs from the PVT amplify BLA representation, paragraph 1; Figure 4c
  quote: At the end of each session, we optogenetically photoidentified BLA-NAc and BLA-CeA neurons
    based on previously reported photoresponse latencies
  criterion: The Methods' rule (Analysis for in vivo recordings). PSTHs of 1 ms bins 50 ms around
    light onset, z-scored against the 50 ms before it; a unit is photo-responsive when it has a
    significant excitation (z above 1.98) within 6 ms of onset, no significant response 7 to 50
    ms after onset with a 6 ms moving average, and no significant response in the fake session.
    Its projection (BLA-NAc or BLA-CeA) is that of the mouse's Cav2-Cre injection. Which light
    pulses enter the PSTH is not fixed; readings are (a) all pulse onsets of the 1, 10 and 100 Hz
    trains and the onset of the 1 s light, (b) the 1 Hz pulses only. When the dataset holds the
    authors' tag labels they are used and the recomputed labels are compared with them. Reproduced
    when the identified counts are within 10% of 39 BLA-NAc and 32 BLA-CeA neurons (counts read
    from the degrees of freedom of Extended Data Figure 8d and 8j) under one reading.
- id: ed8fg-fewer-responsive-neurons
  statement: The CRISPR group has smaller proportions of neurons excited or inhibited by each of
    the three CSs, but the response magnitude of the responsive neurons does not differ from
    controls.
  source: Results, NT inputs from the PVT amplify BLA representation, paragraph 1; Extended Data
    Figure 8f-g
  quote: CRISPR mice showed overall reduced proportions, but not responsive amplitudes of excited
    and inhibited neurons to all three cues relative to the control group
  criterion: PSTHs of 20 ms bins for 1 s before and after CS onset, z-scored against the 1 s
    before onset; a response is significant at a z-score of plus or minus 1.98 (Methods). How the
    threshold is applied is not fixed; readings are (a) the mean z-score over 0 to 1 s, (b) any
    20 ms bin in 0 to 1 s. The paper gives no test for the proportions; reproduced when, under
    every reading, the CRISPR proportion of excited and of inhibited neurons is lower for all three
    CSs, and the amplitude comparison (two-tailed unpaired t-test, the paper's default) finds no
    difference at p < 0.05 for any of the six cue and direction groups.
- id: fig4d-seven-clusters
  statement: Unsupervised hierarchical clustering of BLA responses to the sucrose, neutral and
    shock CSs gives seven functional clusters.
  source: Results, NT inputs from the PVT amplify BLA representation, paragraph 1; Figure 4d
  quote: we clustered BLA neurons into seven functional groups based on their responses across all
    task events using unsupervised hierarchical clustering
  expected:
    quantity: number of clusters
    value: 7
    tolerance: 0
  criterion: As the Methods give it (Functional hierarchical clustering). Per neuron, 20 ms PSTHs
    from 1 s before to 1 s after CS onset, z-scored with the mean and SD of the 1 s baseline,
    smoothed in time with a Gaussian-weighted moving average of smoothing factor 0.85 (MATLAB
    smoothdata), the sucrose, neutral and shock CS traces concatenated; all neurons of both groups
    clustered together. Ward linkage with correlation distance; cut at 35% of the maximum linkage
    distance. Ward on a correlation distance is not standard, so the readings are (a) Ward linkage
    on the correlation distance matrix, (b) Ward linkage with Euclidean distance on rows centred
    and scaled to unit norm (equivalent to correlation). Reproduced when one reading gives seven
    clusters.
- id: fig4e-cluster-responses-attenuated
  statement: Within the task-relevant clusters, the CRISPR group has smaller responses to the
    sucrose and shock CSs than controls, while neutral-CS responses are largely unchanged.
  source: Results, NT inputs from the PVT amplify BLA representation, paragraph 1; Figure 4e
  quote: the CRISPR-cKO decreased the proportions of CS-responsive neurons and attenuated the
    magnitude of neural responses to Sucrose and Shock CSs within each task-relevant cluster
  statistics:
  - about: cluster 1, sucrose CS
    test: unpaired t-test, two-tailed
    statistic: t(78) = 2.203
    p: 0.0303
  - about: cluster 2, shock CS
    test: unpaired t-test, two-tailed
    statistic: t(73) = 2.365
    p: 0.02
  - about: cluster 3, sucrose CS
    test: unpaired t-test, two-tailed
    statistic: t(50) = 2.071
    p: 0.0435
  - about: cluster 3, shock CS
    test: unpaired t-test, two-tailed
    statistic: t(50) = 2.076
    p: 0.043
  - about: cluster 4, sucrose CS
    test: unpaired t-test, two-tailed
    statistic: t(52) = 2.219
    p: 0.031
  - about: cluster 4, shock CS
    test: unpaired t-test, two-tailed
    statistic: t(52) = 2.225
    p: 0.03
  - about: cluster 6, shock CS
    test: unpaired t-test, two-tailed
    statistic: t(140) = 2.228
    p: 0.0276
  - about: cluster 7, neutral CS
    test: unpaired t-test, two-tailed
    statistic: t(167) = 2.924
    p: 0.003
  depends_on:
  - fig4d-seven-clusters
  criterion: Clusters from fig4d-seven-clusters. Per neuron the response is the mean z-score in a
    window after CS onset; the window is the shaded region of Figure 4e, not given in the text,
    and the readings are (a) 0 to 1 s, (b) 0 to 0.5 s. Per cluster and CS, a two-tailed unpaired
    t-test of CRISPR against control neurons. The paper's cluster numbering cannot be recovered
    from the text, so clusters are judged as a set. The paper found 7 of the 14 sucrose and shock
    tests significant, each with a smaller absolute response in CRISPR, and 1 of 7 neutral tests.
    Reproduced when, under every reading, at least 5 of 14 sucrose and shock tests have p < 0.05
    with a smaller absolute response in CRISPR and at most 2 of 7 neutral tests do; partially
    reproduced when 3 or 4 do.
- id: ed8i-projector-cluster-proportions
  statement: In the CRISPR group, smaller proportions of BLA-NAc neurons fall in the clusters that
    preferentially encode positive valence (clusters 1 and 3), and smaller proportions of BLA-CeA
    neurons in those that preferentially encode negative valence (clusters 2 and 4), than in
    controls.
  source: Extended Data Figure 8i
  quote: The proportion of BLA-NAc neurons in cluster 1 and 3 which preferentially encode positive
    valence was less in the CRISPR group compared to the control group
  depends_on:
  - fig4d-seven-clusters
  - fig4c-photoidentification
  criterion: The paper reports no test. Clusters from fig4d-seven-clusters; the paper's numbering
    cannot be recovered from the text, and the legend names which clusters encode positive or
    negative valence without defining it. Reading, a cluster encodes positive valence when its
    mean z-scored response over 0 to 1 s after CS onset (as in fig4e-cluster-responses-attenuated)
    is higher to the sucrose CS than to the shock CS, and negative valence when the reverse.
    Reproduced when the fraction of BLA-NAc neurons in positive-valence clusters and the fraction
    of BLA-CeA neurons in negative-valence clusters are both lower in CRISPR than in control.
- id: fig4fg-projector-sucrose-responses
  statement: In controls BLA-NAc neurons are excited and BLA-CeA neurons inhibited by the sucrose
