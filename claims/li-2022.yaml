    The neutral and shock CS comparisons are reported.
- id: fig4fg-control-projector-valence
  statement: In control mice BLA-NAc neurons are predominantly excited by the sucrose CS and BLA-CeA
    neurons by the shock CS.
  source: Results, NT inputs from the PVT amplify BLA representation, paragraph 1; Figure 4f-g
  quote: we replicated our previous reports in control mice showing that BLA-NAc and BLA-CeA
    neurons are predominantly excited by Sucrose CS and Shock CS, respectively
  depends_on:
  - fig4c-photoidentification
  criterion: The paper reports no test. Control mice only, responses as in
    fig4fg-projector-sucrose-responses. "Predominantly excited" is read as (a) the population mean
    response to that CS is positive and larger than to the other CS, (b) the proportion of neurons
    significantly excited (z above 1.98, as in ed8fg-fewer-responsive-neurons) is larger for that
    CS than for the other. Reproduced when both hold for both populations under every reading.
- id: fig5a-trajectories-reduced
  statement: Population trajectories of the CRISPR group are shorter for all three CSs, and the
    distance between sucrose and shock trajectories is smaller, than in controls.
  source: Results, NT inputs from the PVT amplify BLA representation, paragraph 2; Figure 5a
  quote: trajectories in the CRISPR group showed significant decreases in total trajectory length
    and trajectory distance between sucrose and shock trials compared to the controls
  statistics:
  - about: trajectory length, sucrose CS
    test: unpaired t-test, two-tailed
    statistic: t(11) = 4.786
    p: 0.0001
    p_relation: "<"
    ci: {level: 0.95, low: -9.963, high: -4.284}
    n: 12 control and 14 CRISPR leave-one-mouse-out iterations
  - about: trajectory length, neutral CS (printed t = 1.224 with P = 0.0002)
    test: unpaired t-test, two-tailed
    statistic: t(11) = 1.224
    p: 0.0002
    ci: {level: 0.95, low: -10.37, high: -3.736}
    n: 12 control and 14 CRISPR leave-one-mouse-out iterations
  - about: trajectory length, shock CS
    test: unpaired t-test, two-tailed
    statistic: t(11) = 14.99
    p: 0.0001
    p_relation: "<"
    ci: {level: 0.95, low: -13.15, high: -7.113}
    n: 12 control and 14 CRISPR leave-one-mouse-out iterations
  criterion: As the Methods give it (Neural trajectory analysis). Per neuron, mean firing rates in
    20 ms bins from -1 to 1 s around each CS onset (raw rates, as the legend says). Control neurons
    randomly subsampled to the number of CRISPR neurons. One PCA for both groups, with the same
    coefficients for every projection. The text does not say how a single PCA spans two sets of
    neurons; readings are (a) the two groups' neuron-by-time matrices, of equal neuron count, are
    stacked along time, so each component weights neuron slots shared by the groups (the reading
    that lets the same coefficients serve both groups and the cross-group decoder of Figure 5b-c),
    (b) all neurons of both groups are variables and each group's trajectory uses its own
    neurons with the other group's entries set to zero. Components explaining 95% of variance;
    length as the sum of Euclidean distances between adjacent bins; distance between the sucrose
    and shock trajectories as the bin-by-bin Euclidean distance summed over bins (a mean gives the
    same comparison). Statistics over leave-one-mouse-out iterations with the PCA coefficients
    fixed, two-tailed unpaired t-test. The random subsample and the neuron pairing are not fixed
    and could change the outcome, so each reading is run over 20 random subsamples and the
    fraction of them reaching p < 0.05 reported. Reproduced when, under every reading, the median
    subsample gives a shorter CRISPR length for all three CSs and a smaller CRISPR sucrose to shock
    distance, each with p < 0.05.
- id: fig5b-within-group-decoding
  statement: A linear SVM decodes sucrose against shock trials from BLA population activity above
    label-shuffled chance in both control and CRISPR groups, with no significant difference
    between the groups.
  source: Results, NT inputs from the PVT to the BLA mediates passive-active behavioral strategies,
    paragraph 2; Figure 5b
  quote: We found that BLA neurons from both control and CRISPR groups could decode the trial type
    compared to label-shuffled trials, when the SVM classifier was trained and tested within-group
  statistics:
  - about: ANOVA over the four conditions
    test: one-way ANOVA with Holm-Sidak's multiple comparisons test
    statistic: F(3, 16) = 668.6
    p: 0.0001
    p_relation: "<"
  - about: control against control shuffled
    test: Holm-Sidak's multiple comparisons
    statistic: t(16) = 33.45
    p: 0.0001
    p_relation: "<"
  - about: CRISPR against CRISPR shuffled
    test: Holm-Sidak's multiple comparisons
    statistic: t(16) = 29.78
    p: 0.0001
    p_relation: "<"
  - about: control against CRISPR (statistics section; the legend gives P = 0.2122)
    test: Holm-Sidak's multiple comparisons
    statistic: t(16) = 1.592
    p: 0.1309
  expected:
    quantity: AUC, within-group minus shuffled
    value: 0.5025
    tolerance: 0.05
  depends_on:
  - fig5a-trajectories-reduced
  criterion: As the Methods give it (Support Vector Machine classifier). Single-trial activity
    projected on the global PCA coefficients of fig5a-trajectories-reduced, first 10 PCs as
    features, linear SVM, 5-fold cross-validation (80% train, 20% test), sucrose trials subsampled
    to the shock count 50 times per fold, AUC of the ROC; the same with training labels shuffled.
    Open details, each run. The neurons were not recorded together, so a single "trial" of the
    population is a pseudo-trial; readings are (a) trial k of a type for every neuron, up to the
    smallest trial count, (b) one trial drawn at random per neuron for each pseudo-trial. Time,
    (i) features from activity averaged over 0 to 1 s after CS onset (the legend's "averaged
    neural activity of each trial"), (ii) AUC per 20 ms bin, averaged over 0 to 1 s (the Methods'
    "as a function of time"). Statistics on the 5 fold AUCs by one-way ANOVA with Holm-Sidak
    comparisons. Reproduced when, under every reading, both within-group AUCs exceed their
    shuffled AUCs at p < 0.05 and control against CRISPR has p >= 0.05.
- id: fig5c-cross-group-decoding
  statement: A decoder trained on CRISPR data decodes control data, but a decoder trained on control
    data performs significantly worse on CRISPR data.
  source: Results, NT inputs from the PVT to the BLA mediates passive-active behavioral strategies,
    paragraph 2; Figure 5c
  quote: SVM decoder performance significantly dropped when the model was trained on the control
    data and tested on the CRISPR data, compared to trained on the CRISPR data and tested on the
    control data
  statistics:
  - about: ANOVA over the conditions
    test: one-way ANOVA with Holm-Sidak's multiple comparisons test
    statistic: F(3, 16) = 34196
    p: 0.0001
    p_relation: "<"
  - about: trained on CRISPR tested on control, against trained on control tested on CRISPR
      (printed effect size -0.3114)
    test: Holm-Sidak's multiple comparisons
    statistic: t(16) = 181.0
    p: 0.0001
    p_relation: "<"
  - about: trained on CRISPR tested on control, against shuffled (printed effect size 0.1662)
    test: Holm-Sidak's multiple comparisons
    statistic: t(16) = 96.57
    p: 0.0001
    p_relation: "<"
  - about: trained on control tested on CRISPR, against shuffled (printed effect size 0.4769)
    test: Holm-Sidak's multiple comparisons
    statistic: t(16) = 277.1
    p: 0.0001
    p_relation: "<"
  expected:
    quantity: AUC, trained on CRISPR tested on control minus trained on control tested on CRISPR,
      in the direction the text states
    value: 0.3114
    tolerance: 0.031
  depends_on:
  - fig5b-within-group-decoding
  criterion: As fig5b-within-group-decoding, training on one group's pseudo-trials and testing on
    the other's, in the shared PC space of reading (a) of fig5a-trajectories-reduced (reading (b)
    gives disjoint features for the two groups, so cross-group decoding is run under (a) only).
    Reproduced when, under every remaining reading, trained-on-CRISPR AUC exceeds trained-on-control
    AUC at p < 0.05 and both exceed shuffled. The statistics section's effect sizes, read as the
    first condition minus the second, run the other way (trained on control tested on CRISPR is
    0.4769 above shuffled, trained on CRISPR tested on control 0.1662 above, a gap of 0.31), so its
    labels and the text disagree. The direction of the Results and the legend is judged; the
    opposite result is reported and the disagreement recorded as a deviation.
