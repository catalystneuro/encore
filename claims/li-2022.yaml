- id: fig5dh-behavior-clusters
  statement: Unsupervised trial-by-trial clustering of pose-derived behavior gives seven clusters
    for sucrose trials and five for shock trials, which separate passive and active strategies.
  source: Results, NT inputs from the PVT to the BLA mediates passive-active behavioral strategies,
    paragraph 3; Figure 5d-e and 5g-h; Methods, Unsupervised trial-based classification of
    behaviors
  quote: Following watershed segmentation, we obtained seven clusters for sucrose trials and five
    clusters for shock trials
  expected:
  - quantity: sucrose-trial clusters
    value: 7
    tolerance: 0
  - quantity: shock-trial clusters
    value: 5
    tolerance: 0
  criterion: As the Methods give it. Pose of head, electrode, ears and tail from DeepLabCut; eight
    measures (velocity, distance to port, direction, direction relative to port, and the change of
    each) for 300 frames (20 s at 15 fps) after CS onset; tsfresh 0.16.0 features (about 6000);
    PCA, t-SNE on the top 30 PCs (Extended Data Figure 8k), a kernel density over the t-SNE map
    (seaborn kdeplot), local maxima as markers for a watershed; sucrose and shock trials separately.
    The paper's pose estimates or its trained network are needed; if the dataset holds neither, a
    new network would be the agent's choice and the claim is blocked. t-SNE perplexity, the kernel
    bandwidth and the random seed are not given; they change the cluster count, so the defaults of
    scikit-learn and seaborn are used with several seeds and the counts reported. Reproduced when
    the default settings give 7 and 5 clusters for most seeds.
- id: fig5fi-active-strategy-preference
  statement: Control mice show more active-strategy trials than CRISPR mice in both sucrose and
    shock trials.
  source: Results, NT inputs from the PVT to the BLA mediates passive-active behavioral strategies,
    paragraph 3; Figure 5f and 5i
