# Claims for Li, Namburi, Olson et al. (2022), "Neurotensin orchestrates valence assignment in the
# amygdala", Nature 608, 586-592, on dandiset 000689.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23, protocol
# pilot-10 as stated in docs/protocol.md.
#
# Text read: the accepted author manuscript in PubMed Central (PMC9583860, NIHMS1840566), as served
# by ncbi_pmc: main text, Materials and Methods (with the "Additional statistical information"
# section giving t, P, effect sizes and 95% CIs per panel), the legends of Figures 1 to 5 and of
# Extended Data Figures 1 to 10. The version of record was not read. The manuscript lists
# supplementary files (1840566_SD_Fig_1 to 5, SD_ED_1 to 7, the Reporting Summary); these are source
# data and were not in the text read. No PDF was available, so figure panels (analysis-window
# shading, cluster numbering, axis values) could not be looked at; where a claim needs them it is
# said below.
#
# Code read: none. The paper links no code ("All the custom code used to process data shown in this
# manuscript is available upon request"). Every method detail below is from the Methods and legends.
#
# Dataset, from its title and description on DANDI (version 0.240530.1923): in vivo
# electrophysiology recordings in the amygdala, the corresponding behavioral videos during the
# Pavlovian discrimination task, histology, and "a second cohort" with fiber photometry data. Which
# photometry experiment that cohort is (Figure 3d-f, 3j-l or Extended Data Figure 6) is not said.
#
# Data the paper used, as it reports them.
# In vivo electrophysiology (Figures 4, 5, Extended Data Figure 8). Male mice. PVT-BLA Nt
# CRISPR-cKO: AAV9-pMeCP2-Cas9 into the PVT; into the BLA a cocktail of AAV5-Ef1a-DIO-ChR2-mCherry
# with two retrograde AAV Nt guide RNAs (CRISPR group) or one scrambled control guide (control
# group); Cav2-Cre into the CeA or the NAc on the same side, so that ChR2 tags BLA-CeA or BLA-NAc
# neurons. A 32-micron nichrome wire optrode with a 200-micron fiber in the BLA; Open Ephys at 30 kHz,
# 300 Hz to 6 kHz; units sorted in Offline Sorter. 685 BLA neurons from 30 mice; units with baseline
# rate below 0.3 Hz excluded; only the last day of the discrimination task analysed. Task: after 4
# days of tone-sucrose (120 trials, 2 or 20 kHz, 60 dB, sucrose 15 ul of 30% delivered 2 s after CS
# onset, tone up to 20 s ending on port entry), 2 days with a 9 kHz neutral tone, one day of
# tone-shock conditioning (30 trials, 20 s tone, 2 s 0.4 mA shock at tone offset from trial 21) and
# one recall day, mice ran the three-cue task: sucrose, neutral and shock CS at 50, 25 and 25%,
# 120 trials, shock now 100 ms of 0.6 mA, for 4 to 5 days. A phototagging session followed a "fake"
# session with the patch cord disconnected: 1 s constant 473 nm light, 10 s of 1 Hz (5 or 10 ms
# pulses), 2 s of 10 Hz and 100 ms of 100 Hz (5 ms pulses), at least 5 of each. Videos at 15 frames
# per second, labelled with DeepLabCut at the head, electrode, right ear, left ear and tail.
# Freely moving behavior of the PVT-BLA cKO cohort (Figure 2c-d, N=17 CRISPR and 19 control for
# sucrose, 14 and 14 for freezing) and of PVT-BLA:NT photostimulation (Figure 2g-h, NT::Cre mice,
# ChR2 N=7, mCherry N=8). Port entries by beam break; freezing scored by hand for Figure 2.
# Head-fixed photometry (Figure 3, Extended Data Figures 6 and 7). Tone-sucrose over 5 to 7
# sessions (about 60 pairings, CS 4 s, 1 or 8 kHz, about 4 ul of 30% sucrose 2 s after CS onset);
# tone-airpuff over 2 sessions (about 30 pairings, CS 4 s, 20 psi airpuff of 100 ms 2 s after CS
# onset); half the CSs unpaired (not analysed). Licks from an infra-red beam digitized at 40 kHz;
# eye closure from video. PVT-BLA:NT axon-terminal GCaMP6m in NT::Cre mice, fiber in the BLA
# (N=13 sucrose, 12 airpuff), on a multi-site camera system with 405 and 470 nm excitation; somatic
# GCaMP6m in MGN, vHPC and PVT NT neurons (Extended Data Figure 6); GRAB-NTS1.0 NT sensor in the BLA
# of wild-type mice (N=5), Neurophotometrics V2, 470 and 415 nm at 20 Hz each.
# Other experiments (anatomy, ex vivo patch clamp, sensor validation in HEK cells and neurons,
# global Nt cKO and Ntsr1 cKO behavior, NTSR1 antagonist pharmacology) are described in the Methods;
# the dataset description does not name them.
#
# Inconsistencies in the text, recorded here and in the claims concerned. Figure 5a reports t(11)
# for groups of 12 and 14 leave-one-out iterations, and t = 1.224 with P = 0.0002 for the neutral
# CS. Figure 5b's legend gives P = 0.2122 for control against CRISPR, its statistics section
# P = 0.1309. The statistics for Figure 2h are printed under "2f". Mouse counts differ between
# panels from the same cohort (30 mice recorded; 12 and 14 leave-one-out iterations; t(28) with
# N=15 per group in Figure 5f; t(33) in Extended Data Figure 8e; 36 mice in Figure 2c).
