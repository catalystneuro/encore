    shock trials ... CRISPR-cKO abolished this behavioral preference to active strategies
  statistics:
  - about: sucrose trials
    test: unpaired t-test, two-tailed
    statistic: t(28) = 2.25
    p: 0.0325
    ci: {level: 0.95, low: -0.3141, high: -0.01474}
    n: 15 mice per group
  - about: shock trials
    test: unpaired t-test, two-tailed
    statistic: t(28) = 2.366
    p: 0.0251
    ci: {level: 0.95, low: -0.6799, high: -0.04895}
    n: 15 mice per group
  depends_on:
  - fig5dh-behavior-clusters
  criterion: Clusters from fig5dh-behavior-clusters labelled passive or active as the Figure 5
    legend defines them, sucrose clusters by low or high change in distance moved toward the port
    after CS onset, shock clusters by high freezing with low darting or low freezing with high
    darting. The split is not given; readings are (a) clusters above or below the median of the
    cluster means, (b) above or below the mean over all trials. Shock clusters matching neither
    pattern are left out. Darting is not defined in the text and freezing in this task is read by
    the Methods' 0.3 cm/s rule. Per mouse the fraction of active trials; two-tailed unpaired
    t-test. Reproduced when, under every reading, control mice have a higher fraction for both
