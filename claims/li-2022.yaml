  source: Results, NT inputs from the PVT amplify BLA representation, paragraph 1; Figure 4f-g;
    Extended Data Figure 8j
  quote: BLA-NAc and BLA-CeA population in the CRISPR group showed significantly reduced excitation
    and inhibition to the sucrose CS compared to the control group, respectively
  statistics:
  - about: BLA-NAc, sucrose CS, CRISPR against control
    test: unpaired t-test, two-tailed
    statistic: t(37) = 2.06
    p: 0.0465
    ci: {level: 0.95, low: -4.596, high: -0.0376}
  - about: BLA-CeA, sucrose CS, CRISPR against control
    test: unpaired t-test, two-tailed
    statistic: t(30) = 2.06
    p: 0.0481
    ci: {level: 0.95, low: 0.0009, high: 2.042}
  - about: BLA-NAc, Extended Data Figure 8j
    test: unpaired t-test, two-tailed
    statistic: t(37) = 2.043
    p: 0.0483
    ci: {level: 0.95, low: -3.209, high: -0.01291}
  - about: BLA-CeA, Extended Data Figure 8j
    test: unpaired t-test, two-tailed
    statistic: t(30) = 2.46
    p: 0.0199
    ci: {level: 0.95, low: 0.453, high: 4.882}
  depends_on:
  - fig4c-photoidentification
  criterion: Response per neuron as in fig4e-cluster-responses-attenuated (z-scored 20 ms PSTH,
    windows (a) 0 to 1 s, (b) 0 to 0.5 s). Extended Data Figure 8j measures a "valence encoding
    pattern" the text does not define; its tests are recorded but not run. Reproduced when, under
    every reading, the BLA-NAc sucrose response is lower and the BLA-CeA sucrose response higher
    (less negative) in CRISPR than in control, each with p < 0.05 by a two-tailed unpaired
