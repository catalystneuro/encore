- id: fig4-recording-count
  statement: 685 BLA neurons were recorded from 30 mice during the three-cue discrimination task,
    with sucrose, shock and neutral CSs at a 2 to 1 to 1 ratio.
  source: Results, NT inputs from the PVT amplify BLA representation of learned valences,
    paragraph 1; Figure 4b
  quote: We recorded a total of 685 BLA neurons from 30 mice while they were performing a
    discrimination task
  expected:
  - quantity: BLA neurons
    value: 685
    tolerance: 68.5
  - quantity: mice
    value: 30
    tolerance: 3
  criterion: Units from the last discrimination-task session of each mouse, with baseline firing
    of at least 0.3 Hz (Methods, Analysis for in vivo recordings). Whether 685 is counted before or
    after that exclusion is not said; both counts are shown and either may match. The degrees of
    freedom of the Figure 4e cluster tests (78, 73, 50, 52, 111, 140, 167) imply 80, 75, 52, 54,
    113, 142 and 169 neurons, 685 in total. Those of Extended Data Figure 8d imply 613 untagged,
    39 BLA-NAc and 32 BLA-CeA neurons, 684 in total; the Methods exclude one BLA-CeA neuron from
    every analysis except basal firing, so that exclusion does not explain the gap of one. These
    counts are reported.
- id: ed8d-reduced-basal-firing
  statement: In the CRISPR group, untagged BLA neurons and BLA-CeA neurons have lower basal firing
    rates than in controls, while BLA-NAc neurons do not differ.
  source: Results, NT inputs from the PVT amplify BLA representation, paragraph 1; Extended Data
    Figure 8d
  quote: Both non-tagged BLA neurons and the BLA-CeA neurons showed significantly lower basal
    firing rates (in Hz) in the CRISPR group compared to the control group
  statistics:
  - about: untagged neurons
    test: unpaired t-test, two-tailed
    statistic: t(611) = 3.132
    p: 0.0018
    ci: {level: 0.95, low: -2.108, high: -0.4834}
  - about: BLA-CeA neurons
    test: unpaired t-test, two-tailed
    statistic: t(30) = 2.429
    p: 0.021
    ci: {level: 0.95, low: -6.961, high: -0.6071}
  - about: BLA-NAc neurons
    test: unpaired t-test, two-tailed
    statistic: t(37) = 0.4665
    p: 0.6436
    ci: {level: 0.95, low: -6.226, high: 3.896}
  depends_on:
  - fig4c-photoidentification
  criterion: Basal rate per unit, as mean firing rate in a baseline period the text does not
    define; readings (a) the 1 s before each CS onset averaged over all trials (the PSTH baseline
    of the Methods), (b) the whole session. Reproduced when, under every reading, untagged and
    BLA-CeA neurons have p < 0.05 with CRISPR lower and BLA-NAc has p >= 0.05 (two-tailed unpaired
