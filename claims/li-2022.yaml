- id: ed8os-active-trial-responses
  statement: BLA responses to the CSs are larger in active trials, and the CRISPR-cKO reduces the
    responses of untagged BLA neurons in active trials for both sucrose and shock CSs.
  source: Results, NT inputs from the PVT to the BLA mediates passive-active behavioral strategies,
