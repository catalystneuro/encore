- id: fig1g-pvt-global-cko-reward
  statement: Global Nt CRISPR-cKO in the PVT, but not in the MGN or vHPC, increases port entry
    probability in the last tone-sucrose session.
  source: Results, Global Nt gene knockout in the PVT promotes reward learning, paragraph 2; Figure
    1g
  quote: We found that the CRISPR-Cas9 mediated conditional knockout (CRISPR-cKO) of Nt gene in the
    PVT, but not the MGN nor the vHPC, enhanced tone-sucrose association
  statistics:
  - about: PVT, CRISPR against control
    test: unpaired t-test, two-tailed
    statistic: t(26) = 2.611
    p: 0.0148
    ci: {level: 0.95, low: 4.363, high: 36.67}
    n: 15 CRISPR and 13 control mice
  - about: MGN, CRISPR against control
    test: unpaired t-test, two-tailed
    statistic: t(33) = 0.1019
    p: 0.9195
    ci: {level: 0.95, low: -16.10, high: 17.80}
    n: 18 CRISPR and 17 control mice
  - about: vHPC, CRISPR against control
    test: unpaired t-test, two-tailed
    statistic: t(18) = 0.8666
    p: 0.3976
    ci: {level: 0.95, low: -9.054, high: 21.77}
    n: 11 CRISPR and 9 control mice
  criterion: Port entry probability from the last of 4 days, computed across all trials with 500
    ms bins for 25 s around CS onset and z-transformed against the 25 s before CS onset (Methods,
    Pavlovian sucrose association, Data analysis). The analysis window is the shaded region of
    Figure 1g, which the text does not give; readings are (a) the CS period up to 10 s after
    onset (the CS lasts up to 10 s in this experiment) and (b) 0 to 25 s after onset. The measure
