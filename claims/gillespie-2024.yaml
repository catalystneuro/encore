# Claims for Gillespie, Astudillo Maya, Denovellis, Desse & Frank (2024), "Neurofeedback training
# can modulate task-relevant memory replay rate in rats", eLife 12, RP90944, tested on dandiset
# 000115.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-26,
# protocol pilot-19 as stated in docs/protocol.md.
#
# Text read: the version of record (eLife RP90944, PMC11221834), in paper/10.7554-elife.90944.txt:
# Introduction, Results, Discussion, Methods, the legends of Figures 1 to 5 and of the figure
# supplements (Figure 1-figure supplement 1, Figure 2-figure supplement 1, Figure 4-figure
# supplement 1, Figure 5-figure supplement 1), which are inline in the text, the eLife assessment,
# the public reviews and the author response. The PDF was not opened; no claim needed a figure
# value that the text does not give. The author response is not used for claims.
#
# Data the paper used. Eight male Long-Evans rats in two cohorts, each implanted with 30 tetrodes
# in dorsal CA1, performing the same spatial memory task: a trial starts with a nosepoke at the
# home port, then a nosepoke held at whichever of two center ports lights until a tone and small
# reward (the "pre-reward" period, reward delivery, then the "post-reward" period until the rat
# leaves the port), then a visit to one of eight arms, one of which (the goal) gives a large
# reward; the goal changes after a number of rewards.
#   - Control cohort (rats jaq, roquefort, despereaux and montague, in that order in every legend
#     according to the code): both center ports impose a random delay. These are the rats of
#     Gillespie et al. 2021 and are the data of dandiset 000115. The paper uses "trials from all
#     days of reliable post-implant task performance".
#   - Manipulation (neurofeedback) cohort (remy, gus, bernard and fievel, rat1 to rat4): one center
#     port is the neurofeedback (NF) port, where reward follows the first online-detected
#     suprathreshold SWR; the other is a delay port whose delay is drawn from the 8 previous NF
#     latencies. Only the stable ("plateau") period of training is analysed, except Figure 2-figure
#     supplement 1A and B. These data are in dandiset 000629, which the paper deposited and which
#     is not the dataset of this record; every claim that needs them is data elsewhere.
# Measured variables: CA1 LFP and spike marks (30 kHz), online SWR trigger times, port beam breaks,
# reward delivery, head LED position. Processed outputs are on figshare
# (doi:10.6084/m9.figshare.24919590.v1); no claim relies on them.
#
# Code read: github.com/LorenFrankLab/Gillespie_eLife_2024, commit
# ad5801a28a0cf2a0ea97a1e25328db1c8376086c (the head, and the revision archived at Software
# Heritage that the paper cites). MATLAB scripts in the Frank lab filter framework. The README maps
# figure panels to script parts; for Figure 2-figure supplement 1F to H it is out of date
# (dfs_rips_vsctrlrats.m part 11 makes 1F, part 9 makes 1G, part 10 makes 1H). The SWR detector,
# the position processing, the trial parser, label_trial_interval.m and the clusterless decoder
# are not in the repository (filterframework_shared, trodes2ff_shared, Gillespie_Neuron_2021 and
# replay_trajectory_classification).
#
# Shared methods, settled by the code where the Methods are silent, used by the criteria below:
#   - Epochs (dfs_rips_vsctrlrats.m). Control cohort, Figures 2 and 3 and their supplements:
#     run epochs with ripthresh 0, environment "goal" and forageassist 0. Figures 4 and 5: the same
#     with gooddecode 1 (dfs_ripcontent_vsctrlrats.m). Manipulation cohort: cond_phase "plateau",
#     environment "goal".
#   - Trials (dfa_ripquantpertrial_allphase_NF.m): trials with no lockout and leavehome > 0, or with
#     a successful center port visit followed by a lockout. Pre-reward period from center port
#     entry (RWstart) to reward delivery (RWend); post-reward period from RWend to leaving the port
#     (leaveRW). Control trials are all trial types (type >= 1); manipulation type 1 is NF, type 2
#     delay.
#   - SWRs: offline consensus detection as in the Methods (150 to 250 Hz, squared, summed over CA1
#     cell layer tetrodes, 4 ms gaussian, square root, 2 sd above the behavioral epoch mean,
#     at least 15 ms). The code keeps only SWRs whose start and end both fall in immobility (head
#     speed below 4 cm/s, ag_get2dstate, no buffer), all sizes (maxthresh > 2). An SWR belongs to a
#     period when its start time falls inside it. Rate per trial is count over period duration.
#   - Speed: the per-trial mean of the position structure's smoothed velocity (column 9) over the
#     period. The smoothing is in the position processing, not in the repository.
#   - Within-subject NF against delay: Wilcoxon rank-sum per rat, Benjamini-Hochberg over the four
#     rats (fdr_bh). Cohort comparisons (allrat_lmeplot.m): two separate models, control trials
#     against NF trials and control trials against delay trials, Variable ~ Cohort + (1|Indiv),
#     linear (fitglme/fitlme) for rates, durations, sizes and fractions, Poisson for counts; the
#     p-value is that of the Cohort fixed effect. The bar inset is the mean over rats of each rat's
#     median, and the code prints the ratios control/NF, control/delay and NF/delay of those means.
#   - Replay (dfa_ripcontent_nf.m, dfs_ripcontent_vsctrlrats.m): an SWR is replay when its
#     decode is classed continuous and its largest maze-segment share (arm_prop, box plus 8 arms)
#     exceeds 0.3; remote when that segment is an arm (the rat is in the box at the center ports).
#     The Methods state the class as "the probability of the continuous movement model exceed a 0.8
#     threshold"; the code uses max_state == 1, computed upstream. Both readings are named where a
#     claim depends on them.
#   - Task phase of a trial: label_trial_interval.m of Gillespie et al. 2021 (search trials have
#     phase <= 1, repeat trials > 1, error trials a fractional phase below 0.85), as described in
#     claims/gillespie-2021.yaml.
# Details none of the sources fix are named in the criteria.
#
# A discrepancy the claims do not rest on: the trigger delay is 75, 100, 50 and 50 ms for rat1 to
# rat4 in the Methods and in the code (ratoffset), and 100, 50, 75 and 75 ms in the Figure 1-figure
# supplement 1B legend.
