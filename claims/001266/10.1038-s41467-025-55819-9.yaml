- id: fig3i-distance-dependence
  statement: The probability that the first bAP evokes a dSpike rises sigmoidally with the distance
    of the stimulus from the soma, reaching a plateau of about 80% beyond 300 µm, and is near zero
    for stimuli within 200 µm.
  source: Results, Distal dendritic depolarization favors dendritic spikes, paragraph 5; Figure 3i
  quote: Proximal stimuli ( < 200 μm from the soma) almost never evoked dSpikes on the first bAP ...
