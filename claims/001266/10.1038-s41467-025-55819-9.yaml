- id: figs1-no-perturbation
  statement: Optopatch-V expression did not change resting potential, rheobase, capacitance, input
    resistance or spike rates relative to neighboring non-expressing neurons.
  source: Results, paragraph 2; Figure S1
  quote: No significant difference was found between the groups (p > 0.05, two-sided paired
    Student’s t-test).
  statistics:
  - test: two-sided paired Student's t-test
    p: 0.05
    p_relation: ">"
    n: 16 cells from 6 animals for each group
  data: dataset
  criterion: A claim of absence, judged on the paper's two-sided paired t-test at 0.05 for each
    property (16 pairs of an expressing and a neighboring non-expressing cell). Rheobase is the
    smallest 500 ms step that evokes a spike (Methods). Reproduced when no property gives p <
    0.05; the differences are reported.
- id: figs2-imaging-fidelity
  statement: Optical recording at 1 kHz detected every spike up to 90 Hz with no false positives or
    negatives (7 cells, 2212 spikes), with a single-trial noise-equivalent voltage of 1.2 ± 0.5 mV
    (2.5 ± 0.8 mV at 2 kHz) and sensitivity of about 12% dF/F per 100 mV.
  source: Results, paragraph 2; Figure S2
  quote: The single-trial optical noise-equivalent voltage was 1.2 ± 0.5 mV at 1 kHz and 2.5 ± 0.8 mV
    at 2 kHz (mean ± s.d., n = 7 neurons, 4 animals) ... with zero false-positives or false-negatives
    up to the maximum observed spike rate of 90 Hz (n = 7 cells, 2212 spikes)
  data: with_labels
  depends_on:
