# Claims for Park, Wong-Campos et al. (2025), "Dendritic excitations govern back-propagation via a
# spike-rate accelerometer", Nat Commun 16, 1333, on dandiset 001266.
#
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-22, protocol
# version pilot-10 as stated in docs/protocol.md (Reader).
#
# Text read: the version of record (PMC11794848, Europe PMC full text) with its Supplementary
# Information (Figs. S1 to S25, MOESM1), the Peer Review File (MOESM2), the Description of Additional
# Supplementary Files (MOESM3) and the Reporting Summary (MOESM9, no text extracted). The file
# paper/10.1101-2023.06.02.543490.txt is an earlier bioRxiv preprint with a different title and was
# not used.
#
# Code read: the paper links no analysis code ("All analysis was performed in MATLAB"; the analysis
# scripts are not published). It links simulation code only, as Supplementary Software, read from
# the journal's static content (no repository or commit exists):
#   Supplementary Software 1, 41467_2025_55819_MOESM7_ESM.zip (sha256 9eab52ac...7049249): the
#     NEURON conductance-based CA1 model (main.py, run_simulation.py, parameters_list.py, mod files,
#     MATLAB plotting of Figs. S19 and S20 phase diagrams).
#   Supplementary Software 2, 41467_2025_55819_MOESM8_ESM.zip (sha256 a5a1b593...0c6b6): the
#     two-compartment Izhikevich model, Two_compartment_Izhikevich.m. It differs from the Methods
#     and Fig. S21 in two details: somatic reset -65 (Fig. S21a gives vrs = -55) and initial
#     dendritic u = -18 (Methods give -13). The Methods' values are the main reading; the code's are
#     a variant.
# Neither holds any method for the analysis of the recordings.
#
# Outside material the dataset needs: the Source Data file, 41467_2025_55819_MOESM10_ESM.xlsx
# (https://static-content.springer.com/esm/art%3A10.1038%2Fs41467-025-55819-9/MediaObjects/
# 41467_2025_55819_MOESM10_ESM.xlsx, sha256 142a0621e8581da59891f5a9e0b9f86983b5c2f080d6fba617eb02130044774d).
# The dandiset's description names it as "an index mapping files on DANDI to paper figure panels".
# Its sheet "Raw data in Dandi_Archive" maps each DANDI file name (sub-...) to a figure panel; its
# other sheets give per-cell values for Figs. 5b, 5f, 5h, 6b, S1c, S2d, S3f, S12c, S16d, S16g, S17d,
# S18e, S18h, S24 and S25f, g. The index lists example recordings for Figs. 1c-f, 2, 3, 4a, 4c-d,
# 5a, 5c, 5e, 5g, 6a, S2, S3b, S4a, S4e, S5a, S13a, S14a-c, S15, S16-S18, S22 and S25. Only the
# index sheet was read here, for its panel names; no recording was opened.
#
# The data the paper reports: acute coronal hippocampal slices (300 µm) from CD1 mice of either sex,
# 2 to 4 postnatal weeks, after in utero electroporation of Optopatch-V (LR-Voltron2 with
# LR-CheRiff-eYFP), dye JFX608. CA1 pyramidal neurons were imaged at 34 °C on a custom 1-photon
# microscope with micromirror-patterned 594 nm voltage imaging, at 1 kHz unless stated (2 kHz in
# Fig. S2), and patterned 488 nm optogenetic stimulation; with 2-photon or HiLo structural images;
# in some cells whole-cell patch clamp at the soma (100 kHz). The experiments and their samples:
# branch, soma and soma plus dendrite stimulation (20 ms, 5 Hz, 54 trials; 17 neurons, 15 animals;
# Figs. 2, 3, S8 to S12); dendrite stimulation distance series (35 dendrites, 13 cells, 11 animals,
# Fig. 3i); ramps (188 ramps, 56 cells, 44 animals, Fig. S13); steps (43 stimulated branches, 16
# cells, 13 animals, Fig. 4b); wide-field stimulation (9 cells, 9 animals, Fig. 4c-e); patch current
# pulses 3 to 100 Hz (29 recordings, 14 cells, 11 animals, Fig. S14); drugs on dSpikes (BaCl2 9
# cells, 4-AP 4 cells, TTX 4 cells, Ni2+ 5 and 6 cells; Figs. S16 to S18); plateau experiments with
# electric field stimulation (EFS) of the temporoammonic path with picrotoxin and 1 mM Mg2+ (28
# cells, 12 animals, Fig. 5b; timing 8 and 5 cells, Fig. 5d; ramps and steps 7 or 8 cells, 5 animals,
# Fig. 5e-h; drugs D-AP5 6, TTX 4, Ni2+ 4, vehicle 11 cells, Fig. 6); temperature 34 against 24 °C
# (6 cells, 4 animals, Fig. S25); validation (Figs. S1 to S5). The measured variables are the
# camera movies (Voltron2 fluorescence, which falls with depolarization), the stimulus timing and
# patterns, eYFP images, structural images, and patch clamp current and voltage. The dandiset's
# description gives the patch clamp channel scalings.
#
# Shared method, from the Methods unless marked; criteria refer to it.
#   Fluorescence is taken from regions of the raw movie (not the PCA-denoised or 3D-reconstructed
#   maps, Results paragraph 3), either by the maximum-likelihood pixel weighting of ref. 33 or by
#   the unweighted mean of a user-drawn region ("These two approaches gave similar results"), and
#   photobleaching is corrected by dividing by a regression fit to the mean fluorescence.
#   Depolarization is -dF (Voltron2 fluorescence falls with voltage).
#   Every somatic spike is a bAP. Spikes are found by high-pass filtering and a threshold with a
#   maximum; the threshold was set by hand. dSpikes are found the same way in a distal region,
#   typically > 300 µm from the soma, as large narrow events, typically < 5 ms full width at half
#   maximum. Distances are measured in the image plane, ignoring z.
#   Open, none of the paper, its legends, its supplement or its code fixes them:
#   (1) The high-pass filter. Readings run: (a) subtraction of a 20 ms moving median; (b) a
#       zero-phase Butterworth high-pass at 20 Hz. Both are standard choices that keep events
#       shorter than 5 ms.
#   (2) The dSpike threshold. The paper's reading, shown in Figs. 2b and S10c, is a threshold
#       between the two modes of the distal amplitude histogram; it is placed at the histogram's
#       trough for each recording, and the FWHM < 5 ms rule is applied.
#   (3) Which distal event belongs to which bAP. Standard choice that cannot change a count by more
#       than chance overlaps: the distal peak within 5 ms after the somatic peak.
#   (4) The somatic spike threshold. Standard choice: 5 times the robust s.d. of the filtered
#       trace; the paper reports zero false positives and negatives at the soma (Fig. S2), so this
#       cannot change the outcome.
#   Area under the curve (AUC) is the time integral of -dF in a distal dendrite > 200 µm from the
#   soma (Methods; Figs. 5c, 6a, S24). The integration window is open. Readings: (a) from stimulus
#   onset until the cumulative area stops rising (the cumulative curve of Fig. S22a); (b) from
#   stimulus onset to the end of the stimulus epoch before the next stimulus.
#   Statistics: two-tailed paired or unpaired Student's t-tests, or one-way ANOVA with Bonferroni's
#   post hoc test (Methods, Statistics).
#   Readings (protocol, Reader, step 3). Where a criterion lists readings of a reported number
#   (which trials, cells or spikes it counts), the claim is reproduced if it matches under any of
#   them. Where it lists readings of an open method detail (the filter, the dSpike threshold, an
#   integration window, a fit's form, how a time or distance is taken), every reading is run and
#   the outcome is the one they all give; when they give different outcomes the claim is
#   methods_underspecified, with every result shown. This holds for every criterion below, also
#   where it says "under both".
#
# Data: claims on one example recording use the dataset with the Source Data index as labels
# (with_labels, depending on source-data-index). Claims on pooled recordings use the dataset; the
# paper gives no list of the pooled recordings, and finding them is the author's. Simulation claims
# use the paper's Supplementary Software (with_inputs).
schema_version: 2
dataset:
  archive: dandi
  id: "001266"
paper: doi:10.1038/s41467-025-55819-9
claims:
- id: source-data-index
  kind: link
  statement: The dandiset's files are the recordings the paper's Source Data index assigns to
    figure panels, so that example panels can be found by file name.
  source: Data availability; Source Data file, sheet "Raw data in Dandi_Archive"; dandiset description
  quote: The voltage imaging data generated in this study are on the DANDI archive under accession
    code 001266
  data: with_labels
  criterion: Files are matched by the name in the index's column "File name on DandiArchive"
    against the dandiset's subject and session names. Reproduced when every file the index names
    is found; partially reproduced when at least half are; not reproduced otherwise. Where the
    index's file name and the legend's label differ (Fig. 2 "D1 stim" is listed as file ..._D3;
    Fig. 3 lists files D1, D2, D4, soma and D4+soma for the legend's D2, soma and Soma + D2), the
    file for each panel is the one whose trial and event counts match the legend (54 trials each;
    Fig. 2, 8 dSpikes; Fig. 3 D2, 49 -dSpikes and 35 +dSpikes; soma, 161 and 6; Soma + D2, 116 and
    54; Fig. S8a, 80 and 12; Fig. S8c-d D4, 85 and 11). The readings for the legend's D2 are (a)
    file D2 and (b) file D4 (the combined file is named D4+soma); both are reported.
- id: fig2a-dspike-dichotomy
  statement: In the Fig. 2 neuron, stimulation of proximal oblique dendrites evoked two somatic
    spikes per trial; in most trials the distal dendrites showed only an attenuated copy, and in 8
    of 54 trials a single rapid dSpike, always on the second somatic spike.
  source: Results, Distal dendritic depolarization favors dendritic spikes, paragraph 1; Figure 2a, 2c
  quote: Each stimulus evoked two spikes at the soma ... in some cases (8 of 54 trials), the dendrites
    produced a single rapid spike ... the dendritic excitations always emerged from the second
    somatic spike, never the first
  data: with_labels
  depends_on:
  - source-data-index
  expected:
  - quantity: trials with a dSpike, of 54
    value: 8
    tolerance: 0.8
  criterion: In the Fig. 2 recording (index entry "branch_stim (Fig.2)"), bAPs and dSpikes are
    counted per trial as in the shared method, distal region > 300 µm (legend). Reproduced when
    the count is within tolerance under both filter readings and no dSpike follows the first
    somatic spike of a trial.
- id: fig2b-bimodal-distal-amplitudes
  statement: Spike amplitudes have a unimodal distribution at the soma and a bimodal one in the
    distal dendrite.
  source: Results, Distal dendritic depolarization favors dendritic spikes, paragraph 1; Figure 2b
  quote: A histogram of event amplitudes in the soma and dendrites showed a unimodal distribution at
    the soma and a clearly bimodal distribution in the distal dendrites
  data: with_labels
  depends_on:
  - source-data-index
  criterion: The paper names no test of modality. For the Fig. 2 recording, the amplitude (-dF/F at
    the bAP's peak) of every bAP at the soma and in the distal region (> 300 µm). Readings, from
    the figure (a histogram with a threshold between two groups) and two standard tests, (a)
    Hartigan's dip test, p < 0.05 for the distal amplitudes and p >= 0.05 for the soma; (b) a
    two-component Gaussian mixture preferred over one component by BIC in the distal amplitudes
    and not at the soma. Reproduced when both readings agree that the distal distribution is
    bimodal and the somatic one is not; when they differ, methods_underspecified.
- id: fig2e-f-dspike-maps
  statement: bAPs without a dSpike are confined to the soma and proximal dendrites, while bAPs with
    a dSpike are amplified in the distal dendrites.
  source: Results, Distal dendritic depolarization favors dendritic spikes, paragraph 2; Figure 2e, 2f
  quote: In the -dSpike trials the bAP was primarily confined to the soma and proximal apical and
    basal dendrites ... In the +dSpike trials, the depolarization was amplified in the distal
    dendrites
  data: with_labels
  depends_on:
  - source-data-index
  criterion: For the Fig. 2 recording, spike-triggered averages of -dF normalized by dF_ref (the
    fluorescence change during the passive return to baseline, Methods; Fig. 1d legend, mean from
    10 to 20 ms after the spike) along the apical trunk in 10-pixel segments (Methods,
    Kymographs). Reproduced when the -dSpike average at > 300 µm is below half its value at the
    soma and the +dSpike average at > 300 µm is at least its value at the soma. The paper gives
    no number; half and equal are the readings of "confined" and "amplified" used here, and the
    ratios are reported.
- id: fig2h-length-constant
  statement: The peak amplitude of bAPs without a dSpike decays exponentially along the apical trunk
    with a length constant of 255 ± 10 µm (mean ± s.e.m., 93 spikes).
  source: Results, Distal dendritic depolarization favors dendritic spikes, paragraph 2; Figure 2h
  quote: Plots of the peak spike amplitude along the apical trunk showed exponential decay of the
    -dSpike events (length constant 255 ± 10 μm, mean ± s.e.m., n = 93 spikes)
  data: with_labels
  depends_on:
  - source-data-index
  expected:
  - quantity: length constant of -dSpike bAP amplitude along the apical trunk
    value: 255
    tolerance: 10
    unit: µm
  criterion: Tolerance is the paper's s.e.m. The amplitude (-dF/F_ref) of each -dSpike bAP in
    10-pixel segments along the trunk is fitted with an exponential in distance from the soma, one
    fit per spike, and the length constants are averaged. Open, as the paper does not say, (1)
    which 93 spikes; readings (a) the -dSpike bAPs of the Fig. 2 recording, (b) the -dSpike bAPs of
    all Fig. 2 and Fig. 3 recordings of that neuron; (2) the fit; readings (a) A exp(-x/lambda),
    (b) A exp(-x/lambda) + c. Reproduced when the mean is within tolerance under one reading of
    (1) for both readings of (2), and each reading is shown.
- id: fig3-subthreshold-no-dendritic-initiation
  statement: Subthreshold depolarization follows the stimulus location and decays smoothly outside
    it; dSpikes never initiated in the dendrites.
  source: Results, Distal dendritic depolarization favors dendritic spikes, paragraph 3; Figure 3d-f, S10, S11
  quote: We only observed diffusive-like propagation of the subthreshold voltages, never dSpikes that
    initiated in the dendrites.
  data: dataset
  criterion: In the branch, soma and soma plus dendrite recordings, every dSpike is checked for a
    somatic spike whose peak precedes the distal peak (shared method, item 3). Reproduced when no
    dSpike lacks a preceding somatic spike.
- id: fig3-two-motifs-location-independent
  statement: Neurons produced only two kinds of excitation, perisomatic bAPs and distal dSpikes,
    and neither spatial profile depended on which dendrite was stimulated.
  source: Results, Distal dendritic depolarization favors dendritic spikes, paragraph 4; Figures S9 to S11
  quote: the neurons produced precisely two kinds of excitations ... neither spatial profile depended
    on the location of the driving stimulus
  data: with_labels
  depends_on:
  - source-data-index
  criterion: The paper names no measure. For the neuron of Figs. 2, 3 and S8 (index entries
    branch_stim), the -dSpike and the +dSpike spike-triggered amplitude profiles along the trunk
    (-dF/F_ref, 10-pixel segments) for each stimulus location. Reproduced when, for each class,
    every pair of locations' profiles has Pearson r >= 0.9 and the +dSpike profiles all exceed the
    -dSpike profiles beyond 300 µm. The threshold 0.9 is a reading of "precisely two kinds", not
    the paper's; the correlations are reported.
- id: fig3h-dspike-peak-distance
  statement: The amplitude of dSpikes relative to the first bAP peaks in the distal trunk, 313 ±
    41 µm from the soma (mean ± s.d., 22 stimulated regions, 17 neurons).
  source: Results, Distal dendritic depolarization favors dendritic spikes, paragraph 4; Figure 3g, 3h
  quote: was maximum in the distal dendritic trunk (313 ± 41 µm from the soma, mean ± s.d., n = 22
    stimulated regions (soma or proximal branch), 17 neurons, 15 animals
  data: dataset
  expected:
  - quantity: distance of peak dF_max/dF_1 from the soma
    value: 313
    tolerance: 41
    unit: µm
  criterion: Tolerance is the paper's s.d. For each recording with soma or proximal (< 200 µm)
    stimulation, dF_1 is the amplitude of the first bAP after stimulus onset and dF_max the
    amplitude of a later dSpike (Fig. 3h legend) in each trunk segment; the distance of the
    segment with the largest ratio is taken, and the mean over stimulated regions is compared.
    Open, the paper does not say whether ratios are of trial averages or averaged over trials;
    readings (a) ratio of the averages, (b) average of single-trial ratios. Reproduced when the mean
    is within tolerance under both.
- id: fig3g-later-bap-ratio
  statement: Later bAPs that carry a dSpike have a larger amplitude ratio to the first bAP than
    later bAPs without one.
  source: Figure 3g
  quote: g Amplitude ratio of later bAPs to the first bAP (∆F max /∆F 1 ). Data sorted by the
    presence ( + dSpike) vs. absence (-dSpike) of dSpike.
  data: dataset
  criterion: Per stimulated region (soma or proximal < 200 µm, 22 regions), the mean ratio at the
    distal region for later bAPs with and without dSpikes. The paper reports no test; the
    Methods' paired two-tailed t-test across regions is applied. Reproduced when the +dSpike ratio
    is higher with p < 0.05.
- id: figs12-bap-velocity
  statement: bAPs propagate along the apical trunk at 141 ± 30 µm/ms (mean ± s.d., 17 neurons).
  source: Results, Distal dendritic depolarization favors dendritic spikes, paragraph 4; Figure S12
  quote: Mean propagation velocity of bAPs along the apical trunk was 141 ± 30 µm/ms (mean ± s.d., n
    = 17 neurons, 15 animals
  data: dataset
  expected:
  - quantity: mean bAP propagation velocity along the apical trunk
    value: 141
    tolerance: 30
    unit: µm/ms
  criterion: Tolerance is the paper's s.d. Per neuron, with soma stimulation (Fig. S12a), the time
