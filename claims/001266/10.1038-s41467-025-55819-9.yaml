  criterion: The Fig. S24 legend does not say which response its p-values compare; the readings are
    (a) the combined response, (b) each response. Per cell and drug, AUC after over AUC before for
    optical alone, EFS alone and combined. Reproduced when for every drug the mean fall of the
    combined AUC exceeds the mean fall of each single-stimulus AUC, and the combined comparison
    has p < 0.05 in a two-sided paired t-test.
- id: figs23-dendrite-drives-soma
  statement: Subtracting the somatic signal from the dendritic signal reveals a slowly rising and
    falling dendritic depolarization lasting up to about 300 ms after the optogenetic stimulus,
    which drives the high-frequency somatic firing.
  source: Results, Plateau potentials are evoked by collision of synaptic inputs and dSpikes, paragraph 9; Figure S23
  quote: This procedure revealed the slowly rising and falling dendritic depolarization (presumably
    dominated by VGCC and NMDAR currents) which persisted for up to ~300 ms after the end of the
    optogenetic stimulus to the soma
  data: dataset
  expected:
  - quantity: longest persistence of dendrite minus soma depolarization after stimulus end
    value: 300
    tolerance: 30
    unit: ms
  criterion: In the combined-stimulus recordings (Fig. S23, 9 neurons), -dF/F at the dendritic
    region with the largest plateau minus that at the soma. Persistence is the time after the 30
    ms stimulus ends until the difference returns within 2 s.d. of its pre-stimulus baseline
    (a standard choice). Reproduced when the longest persistence over cells is within tolerance
    and the difference is positive in most cells.
- id: figs25-temperature
  statement: Cooling from 34 to 24 °C increased the dSpike probability (first bAP 0% against 29 ±
