    tolerance: 0.0084
  - quantity: variance of normalized slope, laser power dosimetry
    value: 0.66
    tolerance: 0.066
  criterion: Per cell, slopes of charge against blue intensity and against cumulative eYFP in the
    linear regime (I < 1 mW/mm2), each normalized to its group mean (legend). Reproduced when both
    variances are within tolerance and an F-test of equal variances gives p < 0.05.
- id: figs4-stimulus-localization
  statement: Patterned optogenetic stimuli are localized; somatic photocurrent fell to half when
    stimuli were offset by 11 ± 4 µm and to 20% at 23 ± 7 µm (10 cells), and dendritic responses
    fell to half at 11 ± 5 µm and to 20% at 34 ± 14 µm (29 branches) (mean ± s.d.).
  source: Results, paragraph 2; Figure S4d, S4h
  quote: The induced photocurrent fell to half maximum when stimuli were offset by 11 ± 4 μm and to
    20% of maximum at 23 ± 7 μm ... Evoked responses, |∆F|, fell to half maximum for stimuli at 11 ±
    5 μm offset and to 20% of maximum at 34 ± 14 μm offset
  data: dataset
  expected:
  - quantity: soma photocurrent half-maximum offset
    value: 11
    tolerance: 4
    unit: µm
  - quantity: soma photocurrent 20% offset
    value: 23
    tolerance: 7
    unit: µm
  - quantity: dendritic response half-maximum offset
    value: 11
    tolerance: 5
    unit: µm
  - quantity: dendritic response 20% offset
    value: 34
    tolerance: 14
    unit: µm
  criterion: Tolerances are the paper's s.d. Per cell or branch, responses normalized to 0 µm offset
    and the offsets of half and 20% found by linear interpolation (a standard choice). Reproduced
    when all four means are within tolerance.
- id: figs5-focal-selectivity
  statement: Voltage signals fall to half at 4 µm transverse offset from an in-focus branch and
    plateau at 11% (IQR 7 to 24%) beyond 20 µm.
  source: Results, paragraph 2; Figure S5b
  quote: 'The |∆F| signal fell to half maximum at transverse offsets of 4 μm (n = 49 branches, 21 cells,
    median). At offsets > 20 μm, the fluorescence signal plateaued at 11% (median, IQR: 7 - 24%) of
    maximum'
  data: dataset
  expected:
  - quantity: median half-maximum offset
    value: 4
    tolerance: 0.4
    unit: µm
  - quantity: median plateau beyond 20 µm
    value: 11
    tolerance: 4
    unit: "%"
  criterion: Rectangular ROIs shifted in 5 µm steps up to 25 µm from the branch centre; -dF during
    bAPs normalized to 0 µm (legend). Half offset by linear interpolation (a standard choice).
    Open, the plateau; "offsets > 20 μm" with 5 µm steps up to 25 µm allows (a) the 25 µm point,
    (b) the mean of the 20 and 25 µm points. Reproduced when both medians are within tolerance.
    The 5 µm step makes the half offset coarse; the tolerance of 0.4 µm is the protocol's 10%. The
    plateau's tolerance is the paper's spread, the narrower side of its IQR (11 - 7; the IQR runs
    to 24%).
- id: fig1-denoising-variance
  statement: The first principal components of the pixel waveforms hold more than 96% of their
    variance (the first five, Fig. S7b; the first three, Methods).
  source: Methods, PCA-based filtering; Figure S7b
  quote: The first 5 PCA eigenvectors account for > 96% of the pixel-to-pixel waveform variance
  data: with_labels
  depends_on:
  - source-data-index
  expected:
  - quantity: variance of raw data explained by the first five components
    value: 96
    tolerance: 9.6
    unit: "%"
  criterion: For the stimulus-triggered average movie of Fig. S7a (distal stimulus, 11 trials, the
