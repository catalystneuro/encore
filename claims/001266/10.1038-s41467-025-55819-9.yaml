- id: figs3-eyfp-dosimetry
  statement: Dosimetry by eYFP fluorescence had 7.8-fold lower variance than dosimetry by blue laser
    power (0.084 against 0.66).
  source: Figure S3f
  quote: Dosimetry via eYFP fluorescence had 7.8-fold lower variance than did dosimetry via raw blue
    laser power (0.084 vs. 0.66, n = 18 cells and 6 animals; p = 9.9 x 10-5, F-test)
  statistics:
  - test: F-test
    p: 9.9e-5
    n: 18 cells and 6 animals
  data: dataset
  expected:
