    five components (Fig. S7b legend) and for the first three (Methods); readings (a) five, (b)
    three. Reproduced when under one reading the share is at least 86.4% (the bound less the 10%
    tolerance); both shares are reported. The Results' > 93% is of the 2D and 3D voltage maps from
    the whole reconstruction (Figs. S6, S7), which this claim does not test.
- id: fig3-cheriff-current
  statement: From cumulative eYFP fluorescence, dendrite-targeted optogenetic stimulation drives
    dendritic CheRiff currents of about 130 pA.
  source: Results, Distal dendritic depolarization favors dendritic spikes, paragraph 3
  quote: Based on the cumulative eYFP fluorescence evoked by our dendrite-targeted optogenetic
    stimulation, we estimate dendritic CheRiff currents of ~130 pA
  data: with_labels
  depends_on:
  - source-data-index
  expected:
  - quantity: estimated dendritic CheRiff current
    value: 130
    tolerance: 13
    unit: pA
  - quantity: eYFP counts of the Fig. 3a distal stimulus
    value: 69
    tolerance: 6.9
  criterion: The Peer Review File (response to Reviewer 2, page 5 of the manuscript) gives the
    method; the Fig. 3a distal stimulus (the legend's D2, file as in source-data-index) "generated
    ~69 eYFP counts. Using the calibration in Fig. S3e, this corresponds to ~130 pA". The
    calibration is a fit of charge against cumulative eYFP over the soma recordings of Fig. S3e
    (0.5 s pulses, Fig. S3b). Open, how charge becomes current; readings (a) charge over the 0.5 s
    calibration pulse, (b) charge over the 20 ms stimulus (the eYFP image may be cumulative over
