  statistics:
  - test: two-sided paired Student's t-test
    p: 0.05
    p_relation: ">"
    n: 7 cells from 4 animals
  data: with_labels
  depends_on:
  - source-data-index
  criterion: A claim of absence, judged on the paper's two-sided paired t-test at 0.05, on dF/F at
