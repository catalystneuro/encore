- id: fig3-predepolarization-rule
  statement: dSpikes arise if and only if the distal dendrites have been depolarized for at least
    15 ms before the bAP arrives.
  source: Results, Distal dendritic depolarization favors dendritic spikes, paragraph 6
  quote: dSpikes arose if and only if the distal dendrites had been depolarized for at least 15 ms
