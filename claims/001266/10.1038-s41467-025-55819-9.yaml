  source: Methods, Slice preparation, paragraph 2; Figure S25f, g
  quote: We observed a significant increase in dSpike probability at 24 °C (0% vs. 29 ± 16% by the
    first bAP, p = 0.09; 16 ± 3% vs. 50 ± 12% by any bAP, p = 0.02; mean ± s.e.m., n = 6 cells from
    4 animals, paired t-test)
  statistics:
  - about: first bAP, 34 against 24 °C
    test: paired t-test
    p: 0.09
    n: 6 cells from 4 animals
  - about: any bAP, 34 against 24 °C
    test: paired t-test
    p: 0.02
    n: 6 cells from 4 animals
  - about: any bAP, as the Fig. S25g legend gives it
    test: two-sided paired Student's t-test
    p: 0.03
    n: 6 cells from 4 animals
  data: dataset
  expected:
  - quantity: dSpike probability by the first bAP, 34 °C
    value: 0
    tolerance: 0
    unit: "%"
  - quantity: dSpike probability by the first bAP, 24 °C
    value: 29
    tolerance: 16
    unit: "%"
  - quantity: dSpike probability by any bAP, 34 °C
    value: 16
    tolerance: 3
    unit: "%"
  - quantity: dSpike probability by any bAP, 24 °C
    value: 50
    tolerance: 12
    unit: "%"
  criterion: Tolerances are the paper's s.e.m.; a reported 0% needs a count of 0. Soma stimulation
