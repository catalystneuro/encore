    puff responses assigns recordings to clusters that match the genetic subtypes with 91%
    accuracy (14/16 Vglut2, 10/11 Calb1, 15/16 Anxa1).
  source: Figure 6c; Results, Dopamine neuron functions differentially map onto genetic subtypes,
    paragraph 1
  quote: Unsupervised k-means classification distinguished subtypes based on locomotion (PC1 and PC2
    scores), reward and air puff responses, with total accuracy of 91% ... 14/16 Vglut2, 10/11 Calb1
    and 15/16 Anxa1 recordings correctly classified
  depends_on:
  - fig2jk-pca-variance
  - recording-counts-locomotion
  - recording-counts-stimuli
  expected:
  - quantity: k-means accuracy over Vglut2, Calb1 and Anxa1 recordings
    value: 91
    tolerance: 9.1
    unit: percent
  criterion: Recordings that pass both the locomotion and the stimulus selection with reward
    and air puff responses; the four features z-scored; k-means with 3 clusters, k-means++
    starts and one start, as MATLAB's default; each subtype is matched to the median cluster
    label of its recordings, as the code does. The code's random seed cannot be repeated, so
    the result is the median accuracy over 100 seeds. Reproduced when it is within tolerance,
    partially reproduced when it is above 66% (twice chance), not reproduced otherwise.
- id: fig7f-soma-axon-correlation
  statement: Within genetic subtypes, simultaneously recorded SNc somas and striatal axons are
    highly correlated (mean peak cross-correlation 0.65 Vglut2, 0.67 Calb1, 0.58 Anxa1), more
    than in DAT recordings (0.37); P = 3e-4, 3e-3, 3e-4.
  source: Figure 7e,f; Results, Axons track somatic signaling within subtypes, paragraph 4
  quote: On average, the cross-correlation between soma and axon ΔF/F recordings was significantly
    higher compared to DAT+ recordings (Fig. 7e,f; mean = 0.65 for Vglut2+, 0.67 for Calb1+ and 0.58
    for Anxa1+, compared to 0.37 for DAT
  statistics:
  - about: Vglut2 against DAT
    test: two-sided Mann-Whitney U-test
    p: 3.0e-4
    corrected: Bonferroni
    n: 11 Vglut2 and 35 DAT paired recordings
  - about: Calb1 against DAT
    test: two-sided Mann-Whitney U-test
    p: 0.003
    corrected: Bonferroni
    n: 5 Calb1 and 35 DAT paired recordings
  - about: Anxa1 against DAT
    test: two-sided Mann-Whitney U-test
    p: 3.0e-4
    corrected: Bonferroni
    n: 43 Anxa1 and 35 DAT paired recordings
  expected:
  - quantity: Mean peak soma-axon cross-correlation, Vglut2
    value: 0.65
    tolerance: 0.065
  - quantity: Mean peak soma-axon cross-correlation, Calb1
    value: 0.67
    tolerance: 0.067
  - quantity: Mean peak soma-axon cross-correlation, Anxa1
    value: 0.58
    tolerance: 0.058
  - quantity: Mean peak soma-axon cross-correlation, DAT
    value: 0.37
    tolerance: 0.037
  criterion: Dual recordings with one SNc and one striatal fiber, both with signal-to-noise
    ratio above 10, 405/470 cross-correlation peak below 0.12 and no artifact exclusion, as the
    code selects them. Peak of the smoothed cross-correlation over 1 s of lags. Two-sided
    rank-sum tests of each subtype against DAT, multiplied by 3 (the legend states Bonferroni;
    the code prints uncorrected values, also shown). Reproduced when the four means are within
    tolerance and each subtype exceeds DAT with p < 0.05; partially reproduced when each
    subtype mean exceeds DAT but a test or a tolerance fails.
- id: ed9c-snc-stimulus-responses
  statement: Like their axons, Vglut2 and Calb1 somas in SNc respond to rewards and air puffs,
    while reward responses are largely undetectable in Anxa1 somas.
  source: Extended Data Figure 9a-c; Results, Axons track somatic signaling within subtypes,
    paragraph 2
  quote: Indeed, just as in the axonal recordings, Calb1+ and Vglut2+ somas responded to rewards and
    air puffs, whereas reward responses were largely undetectable in Anxa1+ somas (Extended Data
    Fig. 9a–f).
  statistics:
  - about: Vglut2 soma reward response against 0
    test: two-sided Wilcoxon sign-rank test
    p: 5.0e-5
    corrected: Bonferroni
    n: 25 recordings
  - about: Calb1 soma reward response against 0
    test: two-sided Wilcoxon sign-rank test
    p: 0.007
    corrected: Bonferroni
    n: 10 recordings
  - about: Anxa1 soma reward response against 0
    test: two-sided Wilcoxon sign-rank test
    p: 1
    corrected: Bonferroni
    n: 23 recordings
  - about: Vglut2 soma air puff response against 0
    test: two-sided Wilcoxon sign-rank test
    p: 5.0e-5
    corrected: Bonferroni
    n: 25 recordings
  - about: Calb1 soma air puff response against 0
    test: two-sided Wilcoxon sign-rank test
    p: 0.008
    corrected: Bonferroni
    n: 10 recordings
  criterion: SNc recordings selected as for the striatum (stimulus selection with SNc fibers);
    responses and tests as in fig4g-reward-response. Reproduced when Vglut2 and Calb1 reward and
    air puff responses are positive with p < 0.05 (x4) and the Anxa1 reward test gives
    p >= 0.05; partially reproduced when three of these five parts hold. Counts are reported
    against the legend (reward 25, 10, 23, 39; air puff 25, 10, 25, 47 for Vglut2, Calb1,
    Anxa1, DAT).
- id: ed9k-snc-variance-explained
  statement: The striatal PCs explain most of the variance of the SNc cross-correlations,
    77.6% (PC1 52.4%, PC2 25.2%).
  source: Extended Data Figure 9k legend; Methods, Analysis of signaling during locomotion,
    paragraph 16
  quote: Striatal PCs explain 77.6% of SNc variance (52.4% PC1, 25.2% PC2).
  depends_on:
  - fig2jk-pca-variance
  expected:
  - quantity: Variance of SNc cross-correlations explained by striatal PC1 and PC2
    value: 77.6
    tolerance: 7.76
    unit: percent
  criterion: SNc recordings selected by the locomotion criteria; their cross-correlations
    projected on the striatal PCs, with the uncentered variance as the code computes it. The
    legend gives PC1 52.4% and PC2 25.2%, the Methods 53.2% and 24.3%; both readings are
    listed, and the claim is reproduced when the total and both components are within 10% of
    one reading, partially reproduced when only the total is.
- id: ed1h-aldh1a1-depth
  statement: Aldh1a1 axons are heterogeneous; dorsal recordings are acceleration-correlated
    (Type 1) and more ventral ones deceleration-correlated (Type 2).
  source: Extended Data Figure 1h; Results, opening paragraph 2 (before the first subsection)
  quote: Distribution of locomotion response (integral of the cross-correlation at positive lags)
    along the dorso-ventral axis of the striatum ... showing how in Aldh1a1 dorsal recordings show
    acceleration correlation (Type 1) while more ventral recordings show deceleration correlation
    (Type 2).
  depends_on:
  - recording-counts-locomotion
  criterion: For Aldh1a1 recordings in the locomotion selection, the integral of the
    cross-correlation over lags 0 to 1 s against fiber depth. The paper gives no test; chosen
    here, a Spearman correlation below 0 with p < 0.05. Reproduced when it holds, and the
    mean integral is positive above 2.5 mm depth and negative below 3 mm; partially
    reproduced when only the correlation holds.
- id: ed1i-aldh1a1-reward-locomotion
  statement: In Aldh1a1 recordings, larger reward responses go with deceleration-correlated
    signaling, and small or negative reward responses with acceleration-correlated signaling.
  source: Extended Data Figure 1i; Results, opening paragraph 2 (before the first subsection)
  quote: Relationship between reward response and locomotion response for each recording of each
    subtype, showing how in Aldh1a1 larger reward responses correspond with deceleration correlation
    (Type 2), while small or negative reward responses correspond with acceleration correlation
    (Type 1).
  depends_on:
  - recording-counts-locomotion
  - recording-counts-stimuli
  criterion: Aldh1a1 recordings with a reward response and a cross-correlation (both
    selections), reward response against the cross-correlation integral over 0 to 1 s. The
    paper gives no test; chosen here, a Spearman correlation below 0 with p < 0.05.
- id: fig3a-overlap-locomotion
  statement: Where Calb1 and Anxa1 axons overlap in striatum, Calb1 recordings remain
    deceleration-correlated and Anxa1 recordings acceleration-correlated (Calb1 4 mice, 5
    recordings; Anxa1 5 mice, 16 recordings).
  source: Figure 3a; Results, Genetic subtypes show different signaling patterns during locomotion,
    paragraph 2
  quote: Comparison of locomotion response (cross-correlation between ΔF/F and acceleration) for
    Calb1 and Anxa1 recordings only from a region of striatum where their axons overlap ... Calb1
    mice = 4, n = 5 recordings; Anxa1 mice = 5, n = 16 recordings.
  depends_on:
  - recording-counts-locomotion
  criterion: Recordings of the locomotion selection within 0.5 mm (in the coronal plane) of
    the code's two circle centres, converted from its image pixels to mm with its own scale
    and offsets; (ML 1.51, DV 3.50) at AP +0.86 and (ML 1.84, DV 3.51) at AP +0.50. The paper
    gives no test; chosen here, the cross-correlation integral over 0 to 1 s is negative on
    average for Calb1 and positive for Anxa1, and a two-sided rank-sum test between them gives
    p < 0.05. Counts are reported against the legend.
- id: fig4l-overlap-stimuli
  statement: Where Calb1 and Anxa1 axons overlap, Calb1 recordings respond to rewards and Anxa1
    recordings do not, and Anxa1 recordings decrease to air puffs (Calb1 4 mice, 9 recordings;
    Anxa1 5 mice, 13 for rewards, 17 for air puffs).
  source: Figure 4l; Results, Subtypes show different responses to rewards and aversive stimuli,
    paragraph 2
  quote: Notably, these differences persist even in regions where axons from different subtypes may
    overlap (Fig. 4l), indicating that they were intrinsic to each subtype and not simply defined by
    striatal projection location.
  depends_on:
  - recording-counts-stimuli
  criterion: The same region as fig3a-overlap-locomotion, recordings of the stimulus
    selection. The paper gives no test; chosen here, Calb1 reward responses exceed Anxa1
    ones by a two-sided rank-sum test at p < 0.05, the Calb1 mean reward response is positive
    and the Anxa1 mean air puff response negative. Partially reproduced when the test holds
    but a sign does not.
- id: snrna-nuclei-qc
  statement: Single-nucleus RNA-seq of dopamine neurons from five DAT-Cre, Sun1-GFP mice
    yields 12,065 nuclei after quality control, with a mean of 3,435 UMIs and 1,683 genes per
    nucleus.
  source: Methods, Analysis of snRNA-seq data, paragraph 1; Figure 1a,b
  quote: nuclei with fewer than 500 unique features were removed from each dataset ... In total, the
    integration resulted in a final dataset of 12,065 nuclei, with a mean UMI count of 3,435 and a
    mean of 1,683 features.
  data: elsewhere
  where: GEO GSE222558 (samples GSM6926026 and GSM6926027)
  expected:
  - quantity: Nuclei after quality control
    value: 12065
    tolerance: 1206.5
  - quantity: Mean UMI count per nucleus
    value: 3435
    tolerance: 343.5
  - quantity: Mean number of detected genes per nucleus
    value: 1683
    tolerance: 168.3
  criterion: Nuclei with 500 or more detected genes, as the Methods filter, from the two
    samples' count matrices. Reproduced when the three values are within tolerance, partially
    reproduced when the count is and a mean is not.
- id: snrna-anxa1-within-aldh1a1
  statement: Anxa1 expression is limited to a subset of Aldh1a1-expressing dopamine neurons.
  source: Figure 1c; Extended Data Figure 2b; Results, Anxa1+, a new subtype within Aldh1a1+,
    paragraph 1
  quote: Expression of Aldh1a1 and Anxa1, the latter of which is expressed only within a subset of
    Aldh1a1-expressing neurons.
  data: elsewhere
  where: GEO GSE222558 (samples GSM6926026 and GSM6926027)
  depends_on:
  - snrna-nuclei-qc
  criterion: Without clustering, from raw counts of the nuclei that pass quality control, a
    gene is detected with one or more UMI. Reproduced when (i) Anxa1 and Aldh1a1 detection
    are associated (Fisher exact test, odds ratio above 1, p < 0.05), (ii) more than half of
    the Anxa1-detected nuclei have Aldh1a1 detected and (iii) fewer than half of the
    Aldh1a1-detected nuclei have Anxa1 detected; partially reproduced when (i) and (iii) hold
    but not (ii).
- id: snrna-clusters
  statement: Clustering of the snRNA-seq nuclei gives 15 clusters; cluster 4 is enriched for
    Anxa1 (FDR-adjusted P = 9.4e-118) within the Aldh1a1 clusters, and clusters 9 and 11 are
    the Vglut2 and Calb1 subtypes.
  source: Figure 1b-d; Extended Data Figures 3 and 4; Results, Anxa1+, a new subtype within
    Aldh1a1+, paragraph 2
  quote: This approach resulted in the unbiased identification of 15 clusters ... we infer that
    clusters 9 and 11 represent the SNc Vglut2+ and Calb1+ subtypes ... Cluster 4 was, again,
    significantly enriched for Anxa1 expression
  statistics:
  - about: Anxa1 enrichment in cluster 4
    test: Wilcoxon rank-sum test
    p: 9.4e-118
    corrected: FDR
  data: elsewhere
  where: GEO GSE222558 (samples GSM6926026 and GSM6926027)
- id: scrna-meta-integration
  statement: Integrating four published single-cell datasets gives eight clusters, one of them
    defined by co-expression of Aldh1a1 and Anxa1.
  source: Extended Data Figure 2; Results, Anxa1+, a new subtype within Aldh1a1+, paragraph 1
  quote: We observed eight clusters, one of which was defined by co-expression of Aldh1a1 and Anxa1
    (Extended Data Fig. 2a).
  data: elsewhere
  where: GEO GSE116138 and GSE115070, dropviz.org (Saunders et al.), Bioconductor scRNAseq
    LaMannoBrainData
