- id: fig4a-group-gc-reversal
  statement: Across the 15 participants, GC between hippocampal LFP and auditory cortex EEG
    sources showed net flow from auditory cortex to hippocampus during encoding ([6 10] Hz) and
    from hippocampus to auditory cortex during maintenance ([6 9] Hz and [13 15] Hz).
  source: Results, Directed functional coupling between hippocampus and averaged EEG sources,
    paragraph 1; Figure 4a
  quote: During encoding, the net information flow was from auditory cortex to hippocampus (light
    blue curve – dark blue curve, blue bar, p<0.05, group cluster-based permutation test). During
