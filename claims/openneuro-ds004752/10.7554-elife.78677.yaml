- id: balanced-correct-subset
  statement: With correct trials subsampled to the number of incorrect trials (10%), the reversal
    was equally present (p < 0.0005).
  source: Results, Directed functional coupling and the participants' performance, paragraph 2;
    Figure 4d legend
  quote: We calculated the GC in a subset of correct trials (median of 200 permutations of a
    number of correct trials that equals the mean percentage of incorrect trials=10%); the effect
    was equally present for the subset of correct trials (p<0.0005)
  statistics:
  - test: paired permutation test
    p: 0.0005
    p_relation: <
    n: 15 participants
  depends_on:
  - fig4d-reversal-all
  criterion: As fig4d-reversal-all with reading t2 - per participant, 10% of the correct trials
    drawn at random, GC recomputed, 200 draws (Methods, Statistics, paragraph 4), the median
    over draws (Results) with the mean (Methods) as a variant. Reproduced when the paired
    permutation test of encoding against maintenance has p < 0.05 and encoding ΔGranger is
    negative and maintenance ΔGranger positive in at least 13 of 15 participants. The paper's
    p < 0.0005 is below what 200 permutations resolve, so the smallest attainable p and the
    exact sign-flip p are reported.
