- id: fig2bc-gamma-encoding-p1
  statement: In Participant 1, gamma power (above 40 Hz) rose by more than 100% over fixation
    during encoding in an occipital contact (H3) and a temporal contact over auditory cortex
    (C2), and gamma increased significantly only in temporal and occipital-parietal contacts.
  source: Results, Power spectral density in cortical and hippocampal recordings, paragraph 1;
    Figure 2a to 2c
  quote: In an occipital recording of Participant 1 (grid contact H3), strong gamma activity (>40
    Hz) in the relative PSD occurred while the participant viewed the letters during encoding
    (increase >100% with respect to fixation, Figure 2b). Similarly, encoding elicited gamma
    activity in a temporal recording over auditory cortex (increase >100%, grid contact C2, Figure
    2c)
  statistics:
  - about: gamma increase on grid contacts during encoding
    test: permutation test
    statistic: z-score > 1.96
    p: 0.05
    p_relation: <
  criterion: Relative PSD as the Methods give it (Power spectral density) - multitaper
    time-frequency analysis with 3 tapers, windows of 10 cycles, smoothing 0.2 x frequency,
    4 to 100 Hz, 0.1 s steps, all trials averaged, baseline (PSD - PSD fixation) / PSD fixation
    with fixation [-6 -5] s. Gamma is [60 80] Hz and encoding [-3.5 -3] s for the grid map
    (Figure 2a legend); for C2 the last second of encoding [-4 -3] s (Figure 2c legend). The
    trials are those of the GC method; whether the PSD used correct trials only is open, and
    readings (a) correct trials and (b) all trials of set sizes 6 and 8 are both run. The z-score
    test is a permutation of trials between fixation and encoding (Methods, Statistics,
    paragraph 2 describes this null for the spatial test; the PSD test is not described
    further). Reproduced when the relative gamma increase exceeds 100% in H3 and C2 and the
    contacts with z > 1.96 lie in the temporal and occipital-parietal parts of the grid only.
    Needs the ECoG grid of Participant 1.
