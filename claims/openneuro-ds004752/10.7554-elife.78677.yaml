  - quantity: auditory cortex ΔGranger [4 8] Hz, encoding
    value: -0.049
    tolerance: 0.0049
  - quantity: auditory cortex ΔGranger [4 8] Hz, maintenance
    value: 0.034
    tolerance: 0.0034
  criterion: Per participant and area, ΔGranger in [4 8] Hz by the GC method with the readings
    h, d and t of the opening comment. The group value is called a mean in the Results and a
    median in the Figure 4b legend; readings (g1) mean and (g2) median over the 15 participants.
    Areas are the left-hemisphere sources the dataset holds as virtual sensors (AC, DLPFC, OFC,
    PPC, V1); the code's set is AC, LPFC, PPC, V1 and Broca. A Kruskal-Wallis test across areas
    of the participant values, followed by Dunn's test with Bonferroni correction. Reproduced
    when, under one reading, both values are within tolerance, the Kruskal-Wallis test has
    p < 0.05 in each period, and auditory cortex has the most negative value in encoding and
    the most positive in maintenance; the values of other areas are reported against [-0.03 0]
    in encoding and below 0.02 in maintenance.
- id: fig4d-reversal-all
  statement: The reversal of theta net flow between hippocampus and auditory cortex appeared in
    each of the 15 participants, negative in encoding (median -0.049) and positive in
    maintenance (median 0.034), p = 4.1e-10 by a paired permutation test, correct trials only.
  source: Results, Directed functional coupling and the participants' performance, paragraph 1;
    Figure 4d
  quote: The reversal of ΔGranger appeared in all 15 participants individually (Figure 4d). We
    averaged ΔGranger for each participant in the [4 8] Hz theta frequency range. The ΔGranger
    between hippocampus and auditory cortex, was negative during encoding and was positive during
    maintenance in the theta frequency range (p=4.1e-10, paired permutation test)
  statistics:
  - test: paired permutation test
    p: 4.1e-10
    n: 15 participants
  expected:
  - quantity: median ΔGranger [4 8] Hz, encoding
    value: -0.049
    tolerance: 0.0049
  - quantity: median ΔGranger [4 8] Hz, maintenance
    value: 0.034
    tolerance: 0.0034
  criterion: Per participant ΔGranger between the hippocampal channel and the auditory cortex
    source by the GC method, readings h, a, d and t of the opening comment. The median is over
    the 15 participants; the figure code also pools the three ECoG values (DeltaGranger_EEG.m),
    shown as a variant. Paired permutation test of encoding against maintenance values (Methods,
    Statistics, paragraph 5, N = 200 permutations). A p of 4.1e-10 cannot come from 200
    permutations, nor from the 32768 sign flips of 15 pairs, so the p is judged at 0.05 and the
    smallest p the test can give is reported with the exact sign-flip p. Reproduced when, under
    one reading, encoding ΔGranger is negative and maintenance ΔGranger positive in all 15
    participants, both medians are within tolerance, and the paired test has p < 0.05;
    partially reproduced when the test and the medians hold and the sign pattern holds in 12 to
    14 participants.
