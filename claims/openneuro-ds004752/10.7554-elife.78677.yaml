  statistics:
  - about: encoding, [6 10] Hz
    test: group cluster-based permutation t-test
    p: 0.05
    p_relation: <
    corrected: FDR
    n: 15 participants
  - about: maintenance, [6 9] Hz and [13 15] Hz
    test: group cluster-based permutation t-test
    p: 0.05
    p_relation: <
    corrected: FDR
    n: 15 participants
  criterion: The GC method between the hippocampal channel (h1 to h3) and the auditory cortex
    source (a1 to a3), per participant, all correct trials. Group test as the Methods give it
