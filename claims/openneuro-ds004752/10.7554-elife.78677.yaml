# Claims for Dimakopoulos, Megevand, Stieglitz, Imbach & Sarnthein (2022), eLife 11:e78677,
# on OpenNeuro ds004752.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-10-28, protocol pilot-12 as stated in docs/protocol.md.
#
# Text read: the version of record, full text from Europe PMC (PMC9374435, full-text XML converted
# to text): main text, figure legends, Table 1 and Materials and methods. The supplement is
# given by its descriptions only: Supplementary file 1 (coordinates of the hippocampal electrode
# tips, and the ECoG locations of Participants 1 to 4) and the legends of Figure 1, figure
# supplement 1 and Figure 4, figure supplement 1 are not in the text. No claim below rests on
# their content beyond what the main text states.
#
# Code read: https://github.com/vdimakopoulos/verbal_working_memory at commit 395ae13 (MATLAB,
# FieldTrip). It holds the preprocessing helpers (trial selection, bipolar montage, task-period
# windows), the beamforming and Granger script (Source Localization/MainSourceAnalysisConnectivity.m),
# the 10% trial subsampling (calculateGranger_random_trial_sampling.m), the per-participant
# ΔGranger and figure scripts (MeanSourceGranger.m, DeltaGranger_EEG.m,
# Delta_Granger_EEG_incorrectTrials.m), the group spectrum statistics (statistics_fr.m) and a
# single-participant behaviour script (BehaviourAnalysis.m). It does not hold the calls of the
# paired permutation test of Figure 4d to 4f, nor of the Kruskal-Wallis and Dunn's tests of
# Figure 4b and 4c. Its README describes GC over [4 30] Hz at 60 Hz; the script and the Methods
# use 40 Hz and [4 20] Hz, which are followed here.
#
# Data the paper used: 15 participants with drug-resistant focal epilepsy (numbered 1 to 15 in
# Table 1, with pathology), 71 sessions of 50 trials of a modified Sternberg task. Each trial:
# fixation [-6 -5] s, encoding (8 letters on screen, the middle 4, 6 or 8 being the items, heard
# at the same time) [-5 -3] s, maintenance [-3 0] s, probe at 0 s; the response is IN or OUT and
# correct or incorrect, with a response time. Recordings: hippocampal depth LFP in all 15
# (re-referenced to a white matter contact), scalp EEG of the 10-20 system (median 17 sites,
# re-referenced to the averaged mastoids), and in Participants 1 to 4 subdural ECoG grids or
# strips (Participant 1 a grid of columns A to H and rows 1 to 8 over left temporal and parietal
# cortex; Participants 2 and 3 left strips; Participant 4 right parietal). Neuralynx ATLAS at
# 4000 Hz, downsampled to 500 Hz. LCMV beamforming sources of the scalp EEG on AAL parcels, of
# which the dataset description says derivative virtual sensors are deposited (DLPFC, OFC, PPC,
# AC, V1). Nine participants (5 to 14) were in Boran et al. (2019). The paper does not give the
# mapping of its participant numbers to the dataset's subject labels; Table 1 (pathology) and
# the ECoG participants are the only keys.
#
# Method fixed here for every Granger causality (GC) criterion, from the Methods and the code,
# referred to below as "the GC method":
# - Trials: correct trials of set sizes 6 and 8, without scalp EEG artifacts (Methods, Recording
#   setup, paragraph 1; code Get_Only_Correct_Trials_FieldTrip, Set_Sizes {[6 8]},
#   Get_Only_Clean_Trials_FieldTrip). Incorrect trials where a claim says so.
# - Windows: encoding [-5 -3) s and maintenance [-2 0) s (Methods, Task; Figure 2h legend; code
#   Extract_task_period_Data.m).
# - Signals downsampled to 40 Hz ("the Nyquist frequency=40 Hz" in the Methods, read with the
#   code's resamplefs = 40, so that GC is resolved over [4 20] Hz).
# - Fourier transform by FieldTrip mtmfft with a Hann taper and 20 s padding (Methods, Spectral
#   Granger causality; code calculateGranger_random_trial_sampling.m). The Methods say "two Hann
#   tapers", which mtmfft does not produce; the code's main script uses dpss tapers with 1 Hz
#   smoothing, run as a variant.
# - Nonparametric spectral factorization, bivariate, unconditional (code grangercfg in
#   MainSourceAnalysisConnectivity.m), between one hippocampal channel and one cortical channel.
# - ΔGranger = GC hippocampus to cortex minus GC cortex to hippocampus; negative means flow from
#   cortex to hippocampus (Results, Directed functional coupling between hippocampus and ECoG,
#   paragraph 1; Figure 2 legend). Values are fractions (the code multiplies by 100 for plots).
# - EEG sources: LCMV beamformer on the scalp EEG, fixed orientation, 5% regularisation, the
#   parcel's virtual channels averaged (code MainSourceAnalysisConnectivity.m). The dataset's
#   derivative virtual sensors are described as these sources and are used when present;
#   recomputing them needs a head model template the paper does not name.
# Open in the GC method, with the readings the paper allows, each run:
# - Hippocampal channel: the paper does not say which contact. Readings (h1) the most distal
#   hippocampal contact, the one Figure 1d localises, re-referenced to a white matter contact
#   (Methods, Electrode localization and Recording setup); (h2) the bipolar derivation of
#   adjacent hippocampal contacts, as the code's GetDataInBipolar does; (h3) the mean of the GC
#   spectra over all hippocampal channels.
# - Auditory cortex source: the Results name the "auditory cortex", Table 1 "Heschl", Figure 4b
#   the "temporal superior gyrus", and the code averages the left parcels whose AAL label holds
#   "Temporal". Readings (a1) the dataset's AC virtual sensor; (a2) left Heschl gyrus; (a3) left
#   superior temporal gyrus.
# - Per-participant ΔGranger in [4 8] Hz: (d1) the mean over the 4 to 8 Hz bins ("We averaged
#   ΔGranger for each participant", Results, Directed functional coupling and the participants'
#   performance, paragraph 1); (d2) the extreme value over 4 to 8 Hz, the minimum in encoding
#   and the maximum in maintenance ("maximal ΔGranger", Figure 4d legend; code MeanSourceGranger.m
#   and DeltaGranger_EEG.m). The code uses (d2) for correct trials and (d1) for incorrect ones.
# - Trials entering the per-participant value of Figure 4d: (t1) all correct trials; (t2) 10% of
#   the correct trials drawn at random, repeated 200 times (Methods, Statistics, paragraph 4),
#   the mean (Methods) or the median (Results; code, which draws 20 times) over draws.
