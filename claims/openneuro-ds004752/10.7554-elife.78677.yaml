    test: Kruskal-Wallis test, Dunn's test
    p: 0.0009
    corrected: Bonferroni
    n: 15 participants
  - about: maintenance, across cortical areas
    test: Kruskal-Wallis test, Dunn's test
    p: 0.001
    corrected: Bonferroni
    n: 15 participants
