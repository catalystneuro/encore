- id: fig4e-lpfc-no-reversal
  statement: The directionality and its reversal were absent for other areas such as lateral
    prefrontal cortex, whose net flow had a lower median and higher variability (p = 0.16,
    paired permutation test, correct trials).
  source: Results, Directed functional coupling and the participants' performance, paragraph 1;
    Figure 4e
  quote: The directionality and its reversal was missing for all other areas, e.g., lateral
    prefrontal cortex (p=0.16, paired permutation test, Figure 4e)
  statistics:
  - test: paired permutation test
    p: 0.16
    n: 15 participants
  criterion: A claim of absence, judged on the paper's test. Per participant ΔGranger in [4 8]
    Hz between the hippocampal channel and the lateral prefrontal source (the dataset's DLPFC
    virtual sensor; the code's LPFC parcel uses the mean over 4 to 8 Hz, reading d1), correct
    trials, then the paired permutation test of encoding against maintenance values (200
    permutations). Reproduced when p >= 0.05; not reproduced when p < 0.05 with maintenance
    above encoding. The median difference is reported. The same test on the other areas
    (OFC, PPC, V1) is shown as a variant, since the Results say "all other areas".
