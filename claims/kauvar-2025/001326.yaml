    two with peaks in the first 250 ms and one later.
- id: figs31b-cluster-overrepresentation
  statement: Clusters overrepresented in the periaqueductal gray and VPM thalamus had fast, sharp
    responses, while clusters overrepresented in frontal cortex and limbic regions responded more
    slowly and persistently.
  source: Figure 4G; fig. S31A and S31B; table S3, fig. S31 B
  quote: Indeed, clusters overrepresented in midbrain (PAG) and thalamus (VPM) exhibited fast and
    sharp response dynamics, whereas clusters overrepresented in frontal cortex and limbic regions
    responded more slowly and persistently following the eyepuff
  depends_on:
  - fig4de-response-clusters
  criterion: As in table S3, fig. S31 B and analysis.py get_cluster_null_distribution. Regions
    with more than 30 clustered cells; for each region and cluster, the fraction of the region's
    cells in the cluster against 20,000 draws of uniformly random labels, two-sided, FDR across
    regions. The threshold is 0.05 in the Methods and the code and 0.01 in table S3; both are
    shown. Clusters are ranked by the time their mean falls to 25% of its post-puff peak.
    Reproduced when PAG and VPM are each significantly overrepresented in a cluster from the
    faster half, and at least one frontal cortical or limbic region (ORB, ACA, PL, ILA, MOs, AI,
    as Supplemental Note 1 maps them) in a cluster from the slower half.
- id: fig4g-ketamine-alters-slow-clusters
  statement: Ketamine substantially changed the responses of clusters with slow, persistent
    preinfusion dynamics but left fast clusters little changed.
  source: Figure 4G; fig. S31C; table S3, Fig 4G
  quote: Clusters with more rapid preinfusion dynamics were minimally altered or unaltered by
    ketamine, whereas clusters with slower and more persistent preinfusion dynamics were
    substantially altered
  depends_on:
  - fig4de-response-clusters
  criterion: Cluster means as in table S3 (all cells of the cluster pooled, baseline-subtracted
    with the 1 s before the puff, z-scored over the peri-puff window within cluster and condition),
    Pre series 1 to 20 against Ketamine series 23 to 32 (code plot_avg_psth_prepost_ket, 10 series).
    Table S3 gives 64 Ketamine puffs per cluster (8 series), which the code does not reproduce and
    the paper does not place; the code is followed and the conflict is a deviation. The paper gives no
    measure of change. The
    readings are (a) the cosine distance between the Pre and Ketamine mean traces from -1 to 2 s,
    the similarity measure of the Methods (Analysis of similarity); (b) the absolute difference of
    the means over 1 to 2 s. Reproduced when, under both, the change correlates positively with
    the Pre decay time (to 25% of peak) across clusters by Spearman correlation at p < 0.05.
