- id: fig5g-tau-persist-model
  statement: A two-phase first-order model in which only the persistence timescale differs between
    preinfusion and ketamine closely matched the emotion-like population activity.
  source: Figure 5F and 5G; table S3, Fig. 5G
  quote: Despite only varying the single parameter τ PERSIST across preinfusion and ketamine
    conditions, we observed a close match between the model and the experimental data
  depends_on:
  - fig5d-emotion-dimension-accumulates
  criterion: Model and fit from the Methods (Theoretical model) and analysis.py (model_system,
    theoretical_persist, compare_model). Inputs are eight 250 ms steps 3 s apart; broadcast phase
    x = (S - x0)(1 - exp(-t/tauB)) + x0, persistence phase x = x0 exp(-t/tauP). Fitted with
    scipy curve_fit to the across-session mean of Pre and Ketamine traces concatenated, from
    -0.25 to 23 s and 25 to 70 s after the first puff (the dimension's training window left out),
    S and tauB shared, tauP times a factor in [0, 1] per condition (null factor in [0.99999, 1]),
    bounds [0, 100]. Variance explained is 1 - MSE_model/MSE_null. The paper gives no value for
    "close match". Reproduced when the variance explained is positive and the fitted Ketamine
    persistence timescale is shorter than the Pre one, under each reading of the dimension.
- id: figs33-alternative-models
  statement: Alternative models in which ketamine changes the input scale S or the broadcast rate,
    or a symmetric single-timescale model, fit the ketamine puff-series activity worse than the
    model in which ketamine changes the persistence timescale.
  source: Figure S33A to S33D; Results, Brain-wide activity screen during emergence of affect in
    mice
  quote: other alternative models in which ketamine modulated the input scale S or the broadcast
    rate τ BROADCAST instead of τ PERSIST also did not fit the data well
  depends_on:
  - fig5g-tau-persist-model
  criterion: The same fit with the factor on S (theoretical_saturation), on tauB
    (theoretical_broadcast), or a single timescale (theoretical_symmetric). Variance explained on
    the Ketamine puff-series segment (fig. S33D). Reproduced when the tauP model has the highest
    variance explained there of the four.
- id: figs32c-regional-emotion-dimension
  statement: Emotion-like dimensions computed within each high-level brain area all showed
    accumulating persistent dynamics before ketamine that ketamine abolished.
  source: Figure S32C
  quote: All high-level brain areas ... exhibit some ... degree of accumulating persistent
    dynamics during preinfusion that is abolished by ketamine
  depends_on:
  - fig5d-emotion-dimension-accumulates
  criterion: As fig5d-emotion-dimension-accumulates, with units restricted per session to one
    high-level area (Methods, emotion-like dimension, last sentences); areas and sessions with at
    least 20 simultaneously recorded puff-modulated units (code min_cells). High-level areas are
    the Allen top-level divisions; the paper does not list them. Reproduced when every area that
    has at least two qualifying sessions meets the Pre and Ketamine conditions of that criterion
    for the value before puff 8; partially reproduced when most do.
- id: fig6b-persistent-dimension-distributed
  statement: The neurons carrying the persistent peri-puff dimension were not focally localized
    but distributed over much of the brain.
  source: Figure 6B; fig. S36A
  quote: We found that the persistent dimension was not focally localized in either mice or humans;
    instead, a distribution spanning much of the brain was observed across both species
  depends_on:
  - fig6d-mouse-persistent
  criterion: Persistent-dimension weights as in fig6d-mouse-persistent. The paper gives no measure.
    Reproduced when the units with the top 10% of absolute weight in each session (the paper's
    "persistent neurons", table S3, Fig. 6J) are found in every Allen top-level division that
    holds at least 30 included units (the Methods' regional minimum) and no single division holds
    more than half of them.
- id: fig6d-mouse-persistent
  statement: In mice, activity along the persistent (0.5 to 1 s) coding dimension 1 to 2 s after
    the puff fell during ketamine (0.86 to 0.02) and partly recovered afterwards (0.52).
  source: Figure 6D; table S3, Fig. 6D
  quote: Across species we observed a decrease, caused by ketamine, in eyepuff-triggered
    persistence that recovered post infusion
  statistics:
  - about: Pre against Ketamine
    test: Paired t-test with fdr-bh correction
    statistic: "t = 5.662"
    p: 0.0004
    corrected: FDR (Benjamini-Hochberg)
    n: 11 sessions from 9 mice
  - about: Post against Ketamine
    test: Paired t-test with fdr-bh correction
    statistic: "t = 2.657"
    p: 0.024
    corrected: FDR (Benjamini-Hochberg)
    n: 11 sessions from 9 mice
  expected:
  - quantity: persistent projection 1 to 2 s, Pre
    value: 0.86
    tolerance: 0.1
  - quantity: persistent projection 1 to 2 s, Ketamine
    value: 0.02
    tolerance: 0.25
  - quantity: persistent projection 1 to 2 s, Post
    value: 0.52
    tolerance: 0.41
  criterion: Method from the Methods (Coding dimension, mouse peri-puff), table S3 and analysis.py
    plot_coding_dimension_early_late. Per session (sessions as in fig5d-emotion-dimension-accumulates),
    weights from Pre puffs of puff-modulated units, mean over 0.5 to 1 s against the 1 s before the
    puff, normalized by variance (per unit, Methods; pooled, code variant). The projection is
    averaged over series, z-scored over -1 to 2 s within session and condition and baseline-
    subtracted over -1 to 0 s (code); quantified as its mean over 1 to 2 s. The code projects the
    first puff of each series only; all eight puffs is a variant. Pre series 1 to 20, Ketamine 23
    to 32, Post 35 to 40. Two paired t-tests, FDR over the two. Reproduced when both corrected
    p < 0.05 with Ketamine lowest and the means are within tolerance; partially reproduced when
    only Pre against Ketamine holds.
- id: fig6f-mouse-fast-unchanged
  statement: In mice, activity along the fast (0 to 70 ms) coding dimension was not changed by
    ketamine.
  source: Figure 6F; table S3, Fig. 6F
  quote: whereas similar analysis of a dimension encoding fast eyepuff-triggered activity exhibited
    no decrease during infusion
  statistics:
  - about: Pre against Ketamine
    test: Paired t-test with fdr-bh correction
    statistic: "t = -0.548"
    p: 0.595
    corrected: FDR (Benjamini-Hochberg)
    n: 11 sessions from 9 mice
  - about: Post against Ketamine
    test: Paired t-test with fdr-bh correction
    statistic: "t = 2.468"
    p: 0.066
    corrected: FDR (Benjamini-Hochberg)
    n: 11 sessions from 9 mice
  expected:
  - quantity: fast projection 0 to 70 ms, Pre
    value: 4.48
    tolerance: 0.25
  - quantity: fast projection 0 to 70 ms, Ketamine
    value: 4.59
    tolerance: 0.36
  - quantity: fast projection 0 to 70 ms, Post
    value: 4.32
    tolerance: 0.36
  criterion: A claim of absence, judged on the paper's test, two-sided paired t-tests with FDR over
    the two comparisons. Target window 0 to 70 ms after onset; the Methods compare it with the 1 s
    before the puff, the code (cd_end 107) with the 70 ms before, and the Methods are followed with
    the code as a variant. Projection over all series and all eight puffs, z-scored over -1 to 2 s
    within session and condition, quantified over 0 to 70 ms (code). Reproduced when the Pre
    against Ketamine corrected p >= 0.05; the differences are reported either way.
- id: fig6h-mouse-timescale
  statement: In mice, the intrinsic timescale of the persistent dimension in the 30 s before each
    series was shorter during ketamine (0.14 s) than before (0.45 s).
  source: Figure 6H; fig. S34B; table S3, Fig. 6H
  quote: In both humans and mice, we observed that ketamine robustly accelerated the baseline
    intrinsic timescale of the population
  depends_on:
  - fig6d-mouse-persistent
  statistics:
  - test: Paired t-test
    statistic: "t = 3.357"
    p: 0.0073
    n: 11 sessions from 9 mice, 10 series per condition
  expected:
  - quantity: intrinsic timescale, Pre
    value: 0.45
    tolerance: 0.14
    unit: s
  - quantity: intrinsic timescale, Ketamine
    value: 0.14
    tolerance: 0.12
    unit: s
  criterion: Method from the Methods (Intrinsic timescale analysis, mouse) and analysis.py
    stimulus_timescales and extract_timescale. Rates in the 30 s before the first puff of each
    series projected on the persistent weights of fig6d-mouse-persistent; autocorrelation
    (scipy.signal.correlate) normalized to its maximum, a*exp(-x/b) + c fitted over the 2.5 s after
    the peak, initial a=1, b=0.2, c=0; b is the timescale. Series used are Pre 11 to 20 and
    Ketamine 23 to 32 (code, ten each as table S3). Two readings of how series are combined
    (a) per series fits averaged within session (Methods and table S3); (b) one fit to the
    series concatenated (code). Reproduced when, under both, the paired t-test gives p < 0.05
    with Ketamine shorter and both means are within tolerance; partially reproduced when the test
    holds but the means do not.
- id: fig6j-mouse-coupling
  statement: In mice, correlations among the most persistent neurons in the 30 s before each series
    fell during ketamine to 0.49 of their preinfusion value.
  source: Figure 6J; table S3, Fig. 6J
  quote: in both mice and humans, we discovered that ketamine decreased coupling among these sites
  depends_on:
  - fig6d-mouse-persistent
  statistics:
  - test: Paired t-test
    statistic: "t = 7.463"
    p: 2.2e-05
    n: 11 sessions from 9 mice, 10 series per condition
  expected:
    quantity: pairwise correlation among persistent neurons, Ketamine, normalized to Pre
    value: 0.49
    tolerance: 0.14
  criterion: Persistent neurons and coupling. The Methods take edges between neurons in the top 10%
    of absolute persistent weight, Pearson correlation averaged within session; the code
    (plot_coding_dimension_early_late) takes neurons whose signed weight exceeds the 90th
    percentile of absolute weights and the median absolute correlation of z-scored rates over the
    concatenated 30 s windows of Pre series 1 to 10 and Ketamine series 23 to 32. Readings are (a)
    the Methods, per-series 30 s windows, mean r over edges, averaged over series (table S3), on
    the code's series (Pre 1 to 10, Ketamine 23 to 32), since table S3 gives ten series per
    condition without naming them; (b) the code. Ketamine values divided by Pre within session; paired t-test across sessions.
    Reproduced when, under both, p < 0.05 with Ketamine lower; the expected value is met under
    either.
- id: figs34c-tone-no-eye-closure
  statement: Mice did not close their eyes appreciably to a series of auditory tones, before or
    during ketamine.
  source: Figure S34C; table S3, fig. S34 C
  quote: mice do not increase eye closure during tone presentation
  criterion: Eye closure across the tone series, 7 sessions from 7 mice, Pre 10 series, Ketamine 5
    (table S3). Reproduced when the 95% interval across sessions (1.96 s.e.m.) of the mean closure
    from 0.3 to 0.8 s after each tone, averaged over the eight tones, lies below the corresponding
    eyepuff value of the same sessions and below 0.1 of full closure. The 0.1 bound is a reading of
    "not substantial"; the paper reports no test.
- id: figs34d-tone-fast-unchanged
  statement: Fast tone-related population activity (0 to 70 ms) was not changed by ketamine.
  source: Figure S34D; table S3, fig. S34 D
  quote: Whereas fast tone-related neural activity was unchanged on ketamine
  statistics:
  - about: Pre against Ketamine
    test: Paired t-test with fdr-bh correction
    statistic: "t = 1.088"
    p: 0.318
    corrected: FDR (Benjamini-Hochberg)
    n: 7 sessions from 7 mice
  - about: Post against Ketamine
    test: Paired t-test with fdr-bh correction
    statistic: "t = 1.438"
    p: 0.318
    corrected: FDR (Benjamini-Hochberg)
    n: 7 sessions from 7 mice
  expected:
  - quantity: fast tone projection, Pre
    value: 2.49
    tolerance: 0.48
  - quantity: fast tone projection, Ketamine
    value: 1.83
    tolerance: 0.78
  - quantity: fast tone projection, Post
    value: 1.56
    tolerance: 0.54
  criterion: A claim of absence, judged on the paper's test, as fig6f-mouse-fast-unchanged with tone
    onsets, puff-modulated units (code selects units by their puff responses), tone series Pre
    (first 10 before infusion), Ketamine and Post. Table S3 gives 5 Ketamine and 3 Post series and
    the code takes post-infusion tone series 2 to 6 and 8 to 10 (1-based); the code is followed.
    Reproduced when the Pre against Ketamine corrected p >= 0.05.
- id: figs34e-tone-persistent
  statement: Persistent tone-related activity (350 to 500 ms) fell during ketamine (1.531 to 0.392)
    and recovered (1.385).
  source: Figure S34E; table S3, fig. S34 E
  quote: persistent tone-related activity decreased on ketamine and then recovered
  statistics:
  - about: Pre against Ketamine
    test: Paired t-test with fdr-bh correction
    statistic: "t = 6.942"
    p: 0.0009
    corrected: FDR (Benjamini-Hochberg)
    n: 7 sessions from 7 mice
  - about: Post against Ketamine
    test: Paired t-test with fdr-bh correction
    statistic: "t = -3.753"
    p: 0.009
    corrected: FDR (Benjamini-Hochberg)
    n: 7 sessions from 7 mice
  expected:
  - quantity: persistent tone projection, Pre
    value: 1.531
    tolerance: 0.16
  - quantity: persistent tone projection, Ketamine
    value: 0.392
    tolerance: 0.35
  - quantity: persistent tone projection, Post
    value: 1.385
    tolerance: 0.66
  criterion: As fig6d-mouse-persistent with tone onsets. Weights from 150 to 350 ms (Methods and
    table S3) against the 1 s before the tone; the code uses bins 115 to 135 (150 to 350 ms after
    onset), the same. Quantified over 350 to 500 ms (Methods and table S3); the code's window is
    bins 135 to 150, the same. The code averages the projection over all eight tones (limit 8).
    Reproduced when both corrected p < 0.05, with Ketamine lowest.
- id: figs34f-tone-shorter-than-puff
  statement: Persistent responses to the neutral tone were shorter than those to the eyepuff.
  source: Figure S34F; table S3, fig. S34 F
  quote: The affectively salient eyepuff elicits substantially longer persistent dynamics than the
    neutral tone
  depends_on:
  - fig6d-mouse-persistent
  - figs34e-tone-persistent
  criterion: As analysis.py compare_tone_puff_late_proj. Per session, the Pre projection on each
    stimulus's persistent dimension averaged over the eight stimuli of a series, turned into d'
    against the 1 s before onset. Reproduced when the time at which the across-session mean d'
    falls back below half its peak is later for the puff than for the tone, and the puff mean d'
    over 1 to 2 s lies above the tone's with non-overlapping 95% intervals. The half-peak measure is
    a reading of "longer"; the paper reports no test.
- id: figs34g-tone-timescale
  statement: The baseline intrinsic timescale of the persistent tone population was shorter during
    ketamine (0.089 s) than before (0.268 s).
  source: Figure S34G; table S3, fig. S34 G
  quote: we still could detect a ketamine-mediated acceleration in the intrinsic timescale of
    populations that (prior to ketamine) exhibited modestly persistent responses to the tone
  depends_on:
  - figs34e-tone-persistent
  statistics:
  - test: Paired t-test
    statistic: "t = 5.479"
    p: 0.0015
    n: 7 sessions from 7 mice
  expected:
  - quantity: tone intrinsic timescale, Pre
    value: 0.268
    tolerance: 0.073
    unit: s
  - quantity: tone intrinsic timescale, Ketamine
    value: 0.089
    tolerance: 0.024
    unit: s
  criterion: As fig6h-mouse-timescale with the tone dimension and the 30 s before each tone series.
    The code takes Pre tone series 5 to 10 and Ketamine 2 to 6 (1-based); table S3 gives 10 and 5;
    both are shown, as are the two readings of how series are combined.
- id: figs34h-tone-coupling
  statement: Correlations among the persistent tone neurons before the tone series fell during
    ketamine to 0.460 of their preinfusion value.
  source: Figure S34H; table S3, fig. S34 H
  quote: under ketamine these populations exhibited reduced functional coupling even before tone
    presentation
  depends_on:
  - figs34e-tone-persistent
  statistics:
  - test: Paired t-test
    statistic: "t = 6.217"
    p: 0.0008
    n: 7 sessions from 7 mice
  expected:
    quantity: pairwise correlation among persistent tone neurons, Ketamine, normalized to Pre
    value: 0.46
    tolerance: 0.16
  criterion: As fig6j-mouse-coupling, with the tone dimension and the 30 s before each tone series,
    under both readings.
- id: figs30-correlation-structure
  statement: Ketamine changed the correlation structure of single units at rest, increasing
    correlations within regions such as retrosplenial/posteromedial and orbitofrontal cortex while
    reducing correlations between regions.
  source: Figure S30A; Results, Brain-wide activity screen during emergence of affect in mice
  quote: ketamine altered single-unit correlation structure at rest by increasing within-region
    correlations such as within PMC and ORB (while also reducing correlations between regions
  criterion: Method from the Methods (Regional correlation analysis). Pearson correlations between
    all units of a session over the whole preinfusion period and over the 10 minutes from
    ketamine onset (taken as 30 s after the last puff of series 20, as the code's ket_start). The
    paper shows one example session and no test. Per session, the mean within-region and the mean
    between-region change (Ketamine minus Pre), regions at the finest Allen level. Reproduced when,
    across the 13 sessions, the within-region change is above zero and the between-region change
    below zero by paired t-tests at p < 0.05 (the paper's test for session-level comparisons in
    table S3, Fig. 6J), and RSP and ORB within-region changes are positive in most sessions that
    record them.
- id: figs29-rsp-oscillations
  statement: Ketamine brought low-frequency oscillations into the population activity, especially
    strong in retrosplenial cortex.
  source: Figure S29C and S29D; Results, Brain-wide activity screen during emergence of affect in
    mice
  quote: noted the prominent appearance of low frequency oscillations as we previously reported (
    28 ), with especially strong low frequency oscillations in PMC/retrosplenial cortex (RSP)
  criterion: Method from the Methods (Example-session unsupervised clustering and spectral
    analysis) and analysis.py plot_session_rastermap. Welch power spectra (nperseg 2048, 100 Hz)
    of each unit's z-scored rate, z-scored across frequency, over 0 to 7.5 Hz (the plotted range).
    The paper gives the windows only as "the given 1 minute windows" of an example; the readings
    are the minute before infusion against (a) the minute starting 5 min after it and (b) the
    minute starting 10 min after it. The peak of the z-scored spectrum below 7.5 Hz, averaged per
    region. Reproduced when, under both, it rises after ketamine in RSP units in most sessions
    that record RSP and RSP has the largest rise of all regions with at least 30 units in the
    pooled data. The paper reports no test.
