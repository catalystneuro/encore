    under ketamine it did not accumulate.
  source: Figure 5C and 5D; table S3, Fig. 5D
  quote: Measuring neural activity along this dimension revealed emotion-like properties of
    scalability through a saturating rise across the series of eyepuffs and of persistence through
    a decay lasting tens of seconds following each eyepuff series before returning to baseline
  criterion: Sessions. 11 sessions from 9 mice; the paper does not name the excluded animal, so
