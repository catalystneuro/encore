# Claims for Kauvar, Richman, Liu et al. (2025), Science 388, eadt3971, on dandiset 001326.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21, protocol
# pilot-10 (docs/protocol.md), Reader section.
#
# Text read: the accepted author manuscript as served by Europe PMC (PMC12286656, NIHMS2090574),
# main text and Materials and Methods, with its two supplements from the PMC Open Access set: the
# Supplementary Materials PDF (Supplemental Note 1, figs. S1 to S38, tables S1 to S3, the last being
# the summary of statistical analyses) and the MDAR checklist. Not the version of record. Figures
# were not opened; every number below is from the text, the legends or table S3.
#
# Code read:
# - Mouse electrophysiology and recorded-session behavior, the paper's ref. 103 at Zenodo
#   doi:10.5281/zenodo.14876694 (published 2025-02-15), a single file analysis.py (md5
#   6cc7aa5059737c3bd753aad1f116019d). It holds the analysis functions (unit selection, Leiden
#   clustering, regional rise and decay, emotion-like and coding dimensions, timescales, coupling,
#   the first-order model) but not the driver that calls them, so the list of excluded sessions,
#   the loading of z-scored rates and some window alignments are not in it.
# - brainwide-npix (refs. 17, 94), github.com/erichamc/brainwide-npix at commit 97cdf58 (tag v0.1,
#   Zenodo doi:10.5281/zenodo.14768678): loading, unit quality masks, binned firing rates with a
#   causal moving average.
# - Human electrophysiology, human behavior and mouse behavior, ref. 101 at Zenodo
#   doi:10.5281/zenodo.14920570 (git commit b873ca5 inside the archive), read only for the windows
#   of the eye-closure and human coding-dimension analyses.
#
# Where the data are. The paper deposits the mouse electrophysiology (ref. 104) in DANDI 001326,
# "Brain-wide mouse electrophysiology during aversive stimuli and ketamine" (13 files, 10 subjects
# on the archive). Human iEEG, human behavior and mouse behavior-only experiments (ref. 102) are in
# DANDI 001347, so those claims are `data: elsewhere`. The eye closure of the recorded mice (Fig. 4B,
# Fig. 5B, figs. S28 and S34C) is read by the electrophysiology code (ref. 103) but the data
# statement puts "mouse behavior" in ref. 102; whether 001326 holds it is for the author to find.
#
# Data the paper describes for this dataset (Methods, Neuropixels recording and processing; table S3):
# - Subjects. C57BL/6J mice, 8 to 20 weeks old, predominantly female; 13 sessions from 10 mice
#   (Fig. 4). For cross-puff and population analyses (Figs. 5 and 6) one animal with a stress
#   response (Harderian gland secretion) is excluded, leaving 11 sessions from 9 mice; the paper
#   does not name it. Tone series were recorded in 7 sessions from 7 mice (fig. S34).
# - Recording. Three to four Neuropixels 1.0 probes per session; Kilosort3; BombCell "somatic"
#   units with ISI violations below 0.1, SNR above 2 and more than 500 spikes (brainwide-npix's
#   mask uses SNR >= 1.5); units placed in Allen CCFv3 regions. Firing rates binned at 10 ms and
#   smoothed with a causal 50 ms moving average; the code works on session z-scored rates.
# - Task. Head-fixed eyepuff series: 8 puffs of 250 ms at 3 s intervals (onsets 0 to 21 s), trials
#   45 to 90 s apart; 20 series before ketamine (100 mg/kg through a subcutaneous cannula, given
#   after series 20) and at least 20 after. Tone series in some sessions (16 kHz, 250 ms on, 2750 ms
#   off, 8 times). Eye closure from video by DeepLabCut.
# - Epochs (Methods, "Comparison of rates"). Pre is series 1 to 20; the Methods name the Ketamine
#   epoch "trials 22 to 32" and Post "trials 34 to 40". The code takes, counting series from 1,
#   series 23 to 32 (10 series) as Ketamine and 35 to 40 (6 series) as Post, which matches the
#   trial counts of table S3 (Pre 20, Ketamine 10, Post 6); these are the main reading below and
#   the literal 1-based reading of the Methods (22 to 32, 34 to 40) is a variant.
# - Unit selection used by most analyses ("puff-modulated"). Methods, Significant modulation, and
#   analysis.py selective(): over the 20 Pre series, a paired t-test across puffs with p <= 0.01 in
#   any of 1 s pre-puff against 0 to 200 ms, against 300 to 800 ms, against 1 to 2 s after the puff;
#   1 s before the first against 1 s before the last puff of a series; 0 to 1 s after the first
#   against 0 to 1 s after the last puff. The code also requires a summed Pre activity above 250
#   (has_min_spikes, on all_fr, whose units the released code does not fix: 250 spikes, or a
#   summed 10 ms rate of 250 Hz, i.e. 2.5 spikes). Figs. 5 and 6 keep sessions with at least 20
#   such units (get_affective_projections, min_cells=20).
#
# Tolerances. Where table S3 gives mean +- s.e.m., the tolerance is 1.96 x s.e.m., the paper's own
# 95% interval of the mean (its figures plot mean +- 1.96 s.e.m.). Otherwise 10% of the value.
# Projections onto the emotion-like dimension (Fig. 5E) depend on how the weights are scaled
# (unit vector in the Methods, sum of absolute values in the code), so their expected values are
# checked under each scaling.
