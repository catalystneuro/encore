- id: fig3b-cluster-test-networks
  statement: Permutation cluster tests found ketamine-altered spectrotemporal clusters in the
    limbic, ventral attention and somatomotor networks, and in regions including insula, cingulate,
    orbitofrontal and posteromedial cortex, supramarginal gyrus, motor cortex, hippocampus, basal
    ganglia and thalamus, while many other regions were not changed.
  source: Figure 3B and 3C; Results, Brain-wide activity screen during emergence of affect in
    human beings
  quote: Permutation cluster testing resolved ketamine-altered spectrotemporal clusters which
    reached statistical significance in the limbic, ventral attention, and somatomotor Yeo7
    resting-state networks
  data: elsewhere
  where: DANDI 001347
  criterion: As in the Methods (Permutation cluster test) and table S3, Fig. 3B and 3C. Regional
    (or network) spectrograms per trial, trials paired by position in the puff sequence, a
    one-sample t-test of infusion minus preinfusion with mne permutation_cluster_1samp_test,
