# Claims for Dias, Lemoine, Yanco, Zimova, Bay & Weeks (2025), Proc. R. Soc. B, on Dryad
# dataset doi:10.5061/dryad.bvq83bkk9.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-10-27,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record, from Europe PMC (PMC11750374, full-text XML), with the
# electronic supplementary material (rspb20242556_si_001.pdf, Tables S1 to S11 and Fig. S1). The
# extracted text drops the model equations and priors of the Methods ("Testing whether climate
# drives changes in wing length allometry", paragraphs 3 to 5); the paper's code gives them.
#
# Code read: Zenodo doi:10.5281/zenodo.14226724, Code.zip (SHA-256 cc9f58b9855aec4e3aca09be41387
# 07d07fc34739ec5762e54e1f5bca48ddbc8). It holds lm_mod.stan (the hierarchical model),
# Script01_MainAnalyses.R (Tables 1 to 3 and S1 to S3) and Script02_SupplementAnalyses.R (Tables
# S4 to S11). Its inputs are morphdata.csv, ed_FHY.csv, ed_AHYspring.csv, ed_AHYfall.csv and
# chitree.rds; the Table S8 code also reads an object envdata3 that no script defines. The
# Dryad description says the deposit holds the morphological data from the Field Museum and the
# environmental data, already scaled within species to mean 0 and s.d. 1.
#
# Data the paper used. 27 366 specimens of five migratory passerines (Junco hyemalis, Melospiza
# georgiana, Melospiza melodia, Seiurus aurocapilla, Zonotrichia albicollis), killed in building
# collisions in Chicago during autumn and spring migration, 1981 to 2016 (Field Museum). Per
# specimen: species, year, season (autumn or spring), age (HY, hatch-year, or AHY, after
# hatch-year; all spring birds are AHY), sex, tarsus length and relaxed wing length. Per species
# and year: temperature and precipitation for the pre-breeding period, breeding season (June),
# wintering season (December), and the minimum temperature of the spring and autumn migration
# periods, over the cropped ranges, 1980 to 2017, plus the same variables over two expanded
# breeding ranges (the code's B1 and B2 columns, Tables S9 to S11). Three classes are modelled
# apart: HY (autumn), spring AHY and autumn AHY.
#
# Main-model method, used by every claim on Tables 1 to 3 (Methods, and as settled by
# Script01_MainAnalyses.R and lm_mod.stan where the text lost the equations):
# - Tarsus and wing length log-transformed, then scaled to mean 0 and s.d. 1 within each species
#   over all specimens before the split into classes (code, ave(..., Taxon, FUN = scale)).
# - Classes as in the code. HY is Season Fall and NewAge HY; spring AHY is every Season Spring
#   specimen; autumn AHY is Season Fall and NewAge AHY.
# - Predictors per class, from the code. HY has PrevTempWinMo, PrevPrecipWinMo,
#   AvgTempPreBreedBase, PrecipPreBreedBase, TempBreedMoBase, PrecipBreedMoBase and year. Spring
#   AHY has PrevPrecipWinMo, PrecipPreBreedBase, TempBreedMoBase, PrecipBreedMoBase,
#   MinTempFallMig, PrecipWinMo and year. Autumn AHY has PrevPrevPrecipWinMo, PrevTempBreedBase,
#   PrevPrecipBreedBase, PrevMinTempFallMig, MinTempFallMig and year. Each with an intercept
#   column. The rows of Tables 1 to 3 are these, in this order.
# - Year coded per decade, (Year - 1998)/10 for HY and autumn AHY and (y_id - 1999)/10 for spring
#   AHY, whose y_id the environmental file shifts by one (code comments). Climate used as
#   deposited (already scaled, Dryad description).
# - Species-years with a missing value in any column the code selects from the environmental file
#   (G1, G2 and G3 in Script01, chosen by column number; these hold more climate columns than the
#   model's predictors) are dropped, with their specimens. The code lists the missing values and
#   then drops hard-coded row indices (3 and 75 for HY; 1, 37, 73, 109, 115 and 145 for spring
#   AHY; 1, 36, 106, 111, 112 and 142 for autumn AHY).
# - Model (lm_mod.stan). Scaled wing ~ Normal(B0[species-year] + B1[species-year] * tarsus +
#   A1[species] * sex + A2[species] * sex * tarsus, sd_y), sex 1 for female and 0 for male;
#   (B0, B1)[species-year] ~ Normal((G I[species], G S[species]), sd_b), where G is the
#   species-year row of predictors; I and S per species ~ Normal(mu_i, sd_i) and Normal(mu_s,
#   sd_s); A per species ~ Normal(mu_stl, sd_stl); mu priors Normal(0, 2); every sd half
#   Cauchy(0, 5). NUTS, adapt_delta 0.85, 4 chains of 4000 iterations, 2000 warm-up, seeds 9
#   (HY), 5 (spring AHY) and 9 (autumn AHY) as in the code.
# - Reported per effect, from the pooled post-warm-up draws, the posterior mean and s.d. of mu_i
#   (effects on the allometric intercept) and mu_s (on the allometric slope), and the probability
#   of direction (pd). An effect counts as significant when pd is at least 90% (Tables 1 to 3
#   captions; the Results call pd = 90.0% significant).
# - The paper's statistics are Bayesian probabilities of direction, which the schema's
#   statistics field (p or interval) cannot hold; they are given in the statements and the
#   criteria, and the posterior means, with the reported s.d. as tolerance, under expected.
#
# Details the paper and code leave open, for all claims on the models:
# - Outlier filter. The Methods remove specimens with tarsus or wing more than five median
#   absolute deviations (MAD) from the median; the code applies no filter, so morphdata.csv may
#   already be filtered. Readings, each run (a) the data as deposited, no further filter;
#   (b) the filter applied per species on raw tarsus and wing, with R's mad() and its default
#   constant 1.4826; (c) as (b) per species and sex; (d) as (b) with the unscaled MAD. If no
#   reading removes a specimen they coincide.
# - The pd formula is not given. Standard choice, the share of draws with the sign of the
#   posterior median (bayestestR p_direction); it cannot change the outcome.
# - Stan seeds are the code's; the MCMCglmm runs set no seed ("results will vary each run"), so a
#   seed is a standard choice, recorded.
# - Preliminary models (Tables S4 to S7, MCMCglmm, Script02): the 95% interval printed in Tables
#   S4 to S6 is either (i) the 2.5 to 97.5% quantiles of the four pooled chains
#   (summary(mcmc.list)) or (ii) the 95% HPD interval of chain 4 (summary of model 4); the code
#   prints both. Both are run. VIFs and lambda are from chain 4, as the code computes them.
#
# Outside data. The preliminary models and Table S8 use a phylogeny, chitree.rds, built as a 50%
# majority-rule consensus of 1000 trees from BirdTree (Jetz et al. 2012, Hackett backbone). If the
# deposit lacks it, it must be rebuilt from birdtree.org, and those claims use outside inputs.
