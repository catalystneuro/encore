    three models; blocked as methods_underspecified when they disagree.
- id: s9-s11-expanded-ranges
  statement: Refitting the three main models with climate taken over two expanded breeding ranges
    changes the sign of no parameter.
  source: Methods, Climate data, paragraph 1; Supplement, Fig. S1 and Tables S9 to S11
  quote: We find that none of the parameters in the models based on expanded potential breeding
