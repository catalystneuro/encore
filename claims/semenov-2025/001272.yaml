# Claims for Semenov, Kim, Silkuniene & Pakhomov (2025), Cell Reports Physical Science 6, 102660,
# on dandiset 001272.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-22, under
# docs/protocol.md version pilot-10, as the reader.
#
# Text read. The NIH author manuscript (NIHMS2098259, PMC12320893) as served by Europe PMC, with its
# main text, figure legends and STAR Methods, and the supplement (NIHMS2098259-supplement-1.pdf,
# Figures S1 to S4 and Table S1, the Key Resource Table), all in
# paper/10.1016-j.xcrp.2025.102660.txt. The version of record was not read. No main-text PDF was
# available; the supplement's figures were read from their legends only. Values shown only in
# figures (the traces of Figure S1, the n per group of Figure 2D) are not used.
#
# Code. The paper states "This paper does not report original code". It names the software used:
# Fiji ImageJ 1.53C or MetaMorph 7.7 for soma emission, Grapher 16 for traces and linear
# regression, Origin 8.0 for fits, Sim4Life 5.2 for the field, and RStudio in Table S1. No
# repository was read, so no method detail below is settled by code.
#
# Data the paper used. E18 Sprague-Dawley rat hippocampal neurons (BrainBits), cultured about one
# week on 12-mm coverslips. A single neuron with no apparent somatic contact is centred in the
# field, with a bipolar tungsten electrode (two 100-um rods, 120-um gap, 45 degrees, tips 50 um
# above the coverslip) and the neuron centred in the gap. Fast imaging of the optical membrane
# potential, 64 x 64 pixels after 4 x 4 binning, at 3,130 or 3,086.4 frames/s, 1,200 images per
# session (50 ms before, 250 ms during and about 90 ms after the stimulus), sessions 20 to 60 s
# apart. F is the emission over the entire soma, F0 its mean before the stimulus, and
# dF = 100% (F - F0)/F0. Most neurons were stained with FluoVolt and recorded with 250-ms
# unmodulated or 20-Hz modulated sine waves at 2 and 20 kHz (Figures 1, 2), in NaCl (16.4 mS/cm) or
# sodium gluconate (8.4 mS/cm) solution (Figure 3A, 3B), with 2-s ramped 2-kHz sine waves (Figure
# 3C) and with 1 uM tetrodotoxin (Figure S2). Strobe imaging with 2-us pulses and single sine wave
# beats measured membrane charging (Figures 4 to 6, S3).
#
# This dandiset. Its title and description (DANDI:001272, "The Use of Di8-ANEPPS to Evaluate
# Neuronal Sensitivity to Unmodulated Sine Waves"; control experiments with Di8-ANEPPS to make sure
# that APs recorded with FluoVolt "published in other DANDIsets" were not influenced by the dye)
# match the Figure S1 experiment. That experiment, as the paper reports it, is eight neurons loaded
# with 5 uM Di-8-ANEPPS for 30 min in the dark, imaged with a TRITC cube, stimulated with 250-ms,
# 2-kHz unmodulated sine waves at field strengths (V/cm) in a random sequence. Depolarization
# reduces Di-8-ANEPPS emission, so the paper inverts its traces. The measured variable is the soma
# emission per frame; the per-session variables are the field strength and the session order. The
# paper spells the dye "Di-8-ANEPSS" in the Results and "Di-8-ANEPPS" elsewhere; it is one dye.
# The claims on the Figure S1 experiment are data dataset. The paper deposited its raw images in
# ten dandisets (Data and code availability) without saying which figure is in which. From their
# titles only, 001030 (2-kHz sine waves, effect of the field) and 001032 to 001035 (sine wave
# stimulation at varying frequencies) hold the FluoVolt experiments of Figures 1 to 3, 001271
# tetrodotoxin (Figure S2), 001273 the 2-us pulse kinetics (Figure 4), 001274 sine wave
# polarization (Figures 5, 6, S3); 001031 (100-kHz bipolar pulses) matches no figure. Claims on
# those are data elsewhere, and the comparisons of Di-8-ANEPPS with FluoVolt are data with_inputs,
# their FluoVolt side taken from 001030 and 001032 to 001035.
#
# Method details fixed from the paper, used by the Figure S1 criteria.
# (F1) F is the mean emission over the entire cell soma per frame, F0 the mean over an interval
# before the stimulus, dF = 100% (F - F0)/F0 (Methods, Recording of the optical APs). For
# Di-8-ANEPPS the trace is inverted, -dF, so that depolarization is upward (Methods; Figure S1
# legend; Results, "APs were identified by the reduction instead of the increase of emission").
# The Methods say the scale of "Figure S2" was inverted; that set is the Di-8-ANEPPS one of
# Figure S1, whose legend says its traces were inverted, so S2 there is read as S1.
# (F2) Traces are not filtered or modified in any way (Methods); no detrending or smoothing.
# (F3) The stimulus is a 250-ms, 2-kHz unmodulated sine wave (Figure S1 legend), starting 50 ms
# into the session (Methods); the onset and the field strength of each session are taken from the
# dataset, and the 50 ms is used when the onset is not given there.
# (F4) A neuron's excitation threshold is the lowest field strength of a session with at least one
# AP during the 250-ms stimulus (Figure 2D legend).
# (F5) The maximum firing rate of a session is the inverse of the peak-to-peak interval between its
# first two APs (Methods).
# (F6) The two-sided Student's t test, paired or unpaired as appropriate, at p < 0.05, is the
# paper's test where a criterion needs one and the paper names none for that finding (Methods,
# Quantification and statistical analysis).
#
# Details the paper leaves open, with the readings named. Every Figure S1 criterion runs every
# combination of the readings below; a claim is decided when all give its outcome, and blocked as
# methods_underspecified when they give different outcomes.
# (O1) The soma outline is not given. ROIs are taken from the dataset when it holds them. When it
# does not, readings (a) the connected component nearest the image centre (the Methods centre the
# neuron) of an Otsu threshold of the mean pre-stimulus frame, (b) that mask eroded by 2 pixels, to
# leave out the neurite bases at its edge. Otsu and the 2 pixels are standard choices.
# (O2) The length of the F0 interval is not given ("a time interval preceding the electrical
# stimulation"); readings (a) all frames before the onset (about 50 ms), (b) the last 20 ms before
# the onset. This is unlikely to change an outcome.
# (O3) AP detection is given only as "brief emission upticks", with the FluoVolt neurons selected for
# APs above 5% dF lasting about 10 ms (typical 11.3% and 8 ms). The paper says Di-8-ANEPPS has a
# lower voltage sensitivity and gives no level for it. An AP is a local maximum of the inverted
# trace, with width at half height between 1 and 20 ms, and at least 5 ms from a larger maximum
# (standard choice; the paper's highest rates, 60 to 90 Hz, give intervals over 11 ms). The paper's
# "about 10 ms" (8 +/- 0.7 ms) is the AP's whole duration excluding afterhyperpolarization, which
# bounds the width at half height from above but not from below; the 1-ms lower bound (about 3
# frames at the Methods' 3,086.4 or 3,130 frames/s) only excludes single-frame noise, and the
# 20-ms upper bound is a standard choice. Readings of the height (a) above 5% (the Methods' FluoVolt
# level), (b) above 5 SD of the inverted trace before the onset. Under (a) a neuron may show no APs
# because the dye is less sensitive; the notebook reports it.
# (O4) "Near the threshold" is not defined; readings (a) the sessions at the threshold field (F4),
# (b) the sessions at fields up to 10% above it (the upper end of the 5% to 10% steps of the
# Methods).
# (O5) "Delayed" is not quantified for Figure S1. The Results give 100 to 200 ms after onset near
# threshold for FluoVolt (Stimulation by 2- and 20-kHz unmodulated sine waves, paragraph 1), and say
# the Di-8-ANEPPS effects were not different; readings (a) first AP at least 100 ms after onset,
# (b) first AP later than the median first-AP latency of the neuron's sessions at higher fields.
# (O6) "Sustained firing" and "sustained depolarization" are not defined by a measure. Sustained
# firing is, as a standard choice, at least three APs with one in the last 50 ms of the stimulus.
# Sustained depolarization is no AP in the last 100 ms of the stimulus while the mean inverted dF
# over that window is above, reading (a) 5 SD of the inverted trace before the onset, (b) half the
# median AP height of the neuron. The windows are standard choices.
schema_version: 2
dataset:
