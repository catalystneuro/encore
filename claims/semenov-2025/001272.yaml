- id: fig4-orientation-and-poles
  statement: Aligning elongated cells with the field doubled the time constants; the maximum optical
    TMP and the time constants did not differ between the cathode- and anode-facing poles; and
    discharging was slower than charging except in elongated cells aligned with the field.
  source: Results, Kinetics of membrane charging by pulsed electric fields, the paragraph after the
    Figure 4 legend; Figures 4D and 4E
  quote: Δ F max did not differ at the cathodic and anodic cell poles, indicating the lack of
    rectification of the applied electric field ... Aligning elongated cells with the electric
    field doubled the time constants ... discharging time constants were always larger than the
    charging ones in the same cell ( p < 0.001, paired t test)
  statistics:
  - about: elongated cells, parallel against perpendicular
    test: paired t test
    p: 0.001
    p_relation: "<"
  - about: elongated parallel against random cells
    test: unpaired t test
    p: 0.01
    p_relation: "<"
  - about: discharging against charging tau
    test: paired t test
    p: 0.001
    p_relation: "<"
  data: elsewhere
  where: DANDI:001273 (assigned from its title)
  criterion: As in the claims file for DANDI:001273 (fig4-orientation-time-constants,
    fig4-no-pole-difference and fig4-discharging-slower), which tests each part on its own data;
    reproduced when all three are reproduced there. The Figure 4 legend reports these tests
    differently from the Results (p < 0.01, paired two-tailed, charging against discharging;
    p < 0.01, unpaired two-tailed, between the orthogonal orientations, with n = 3 parallel and
    n = 6 perpendicular); the statistics above are the Results', and the legend's are a reading the
    paper also allows.
- id: fig6-sine-less-than-pulse
  statement: FluoVolt sensitivity to 2-kHz sine waves (11.8% per 1 kV/cm) was 42% of that to 2-us
    pulses (28% per 1 kV/cm) and smaller in every ROI, with sine waves polarizing the two poles more
    asymmetrically than pulses.
  source: Results, Asymmetric and less-efficient membrane charging by sine waves compared to pulses,
    paragraphs 2 to 5; Figures 5, 6B to 6D and S3
  quote: All numbers were invariably smaller than those measured for the same ROIs with the pulse (
    Figure 6D ). The electric field sensitivity averaged across all ROIs in all the cells was 11.8% ±
    1.7% per 1 kV/cm, just 42% of the value for the 2-μs pulses
  data: elsewhere
  where: DANDI:001274 (assigned from its title)
  expected:
  - quantity: mean pulse sensitivity over the 18 ROIs
    value: 28
    tolerance: 2.5
    unit: percent per kV/cm
  - quantity: mean sine wave sensitivity over the 18 ROIs
    value: 11.8
    tolerance: 1.7
    unit: percent per kV/cm
  - quantity: mean sine over mean pulse sensitivity
    value: 42
    tolerance: 4.2
    unit: percent
  criterion: Measures and readings as in the claims file for DANDI:001274 (fig6b-pulse-sensitivity,
    fig6c-sine-sensitivity, fig6d-sine-less-than-pulse, fig5-sine-asymmetry-c7 and
    figs3-sine-asymmetry-c8), which tests this finding on its own data; tolerances are the paper's SEMs, and 10% for the ratio.
- id: threshold-depolarization-estimate
  statement: The 2-kHz AP threshold of 57.7 V/cm times the sine wave sensitivity gives a 0.68%
    emission change, about 6.8 mV, so the threshold depolarization is 5 to 15 mV, as with
    intracellular current injection.
  source: Results, Asymmetric and less-efficient membrane charging by sine waves compared to pulses,
    last paragraph
  quote: This threshold corresponds to a 0.68% ± 0.11% FluoVolt emission change (11.8 × 57.7/1,000)
    ... a 0.68% emission change corresponds to a 6.8-mV depolarization at the AP threshold
  data: elsewhere
  where: DANDI:001032 to 001035 for the threshold and DANDI:001274 for the sensitivity (assigned from
    their titles)
  depends_on:
  - fig1-20khz-needs-twice-the-field
  - fig6-sine-less-than-pulse
  expected:
  - quantity: mean unmodulated 2-kHz 1-AP threshold
    value: 57.7
    tolerance: 3.6
    unit: V/cm
  - quantity: emission change at the 2-kHz AP threshold
    value: 0.68
    tolerance: 0.11
    unit: percent
  - quantity: depolarization at the 2-kHz AP threshold
    value: 6.8
    tolerance: 1.1
    unit: mV
  criterion: Mean sine sensitivity of fig6-sine-less-than-pulse times the mean unmodulated 2-kHz 1-AP
    threshold (F4), divided by 1,000, and that times 10 mV per 1% (the calibration of reference 47 as
    the paper uses it). Tolerances are the paper's SEMs, the last being 0.11% times 10 mV per 1%.
    Reproduced when all three are within tolerance.
checks:
