paper: doi:10.1016/j.xcrp.2025.102660
claims:
- id: figs1-eight-neurons
  statement: The Di-8-ANEPPS control experiments were made on eight neurons, at field strengths tested
    in a random sequence.
  source: Results, Sensitivity to unmodulated sine waves was not caused by FluoVolt dye, paragraph 1;
    Figure S1
  quote: Experiments were performed on eight neurons using different electric field strengths tested
    in a random sequence
  expected:
  - quantity: neurons recorded with Di-8-ANEPPS
    value: 8
    tolerance: 0
    unit: neurons
  criterion: Neurons are counted from the dataset's subjects, sessions or cell identifiers, each
    recording counted once (author, step 1). The tolerance is 0, as a count of neurons is whole and
    10% of 8 admits no other value. The order of fields over each neuron's sessions is reported
    (the number of neurons whose fields rise monotonically with session order), not judged, since
    the Methods also allow escalating sequences.
- id: figs1-aps-as-emission-decrease
  statement: With Di-8-ANEPPS, APs appear as brief reductions of emission, opposite in sign to
    FluoVolt.
  source: Results, Sensitivity to unmodulated sine waves was not caused by FluoVolt dye, paragraph 1;
    Methods, Recording of the optical APs and data analyses; Figure S1 legend
  quote: APs were identified by the reduction instead of the increase of emission
  criterion: F1 and F2, under the readings O1 and O2. Per neuron, over the sessions at fields above
    its threshold (F4, under O3), the largest brief deflections of dF during the stimulus are
    negative. Detection under O3 is run on the trace as recorded (not inverted) and on the inverted
    trace; reproduced when in every neuron with APs the inverted trace yields more APs than the
    trace as recorded, in more than 75% of its sessions with APs (a standard choice). The counts
    each way are reported.
- id: figs1-near-threshold-delayed-aps
  statement: Near threshold, 2-kHz sine waves elicited one or a few delayed APs in Di-8-ANEPPS
    neurons.
  source: Results, Sensitivity to unmodulated sine waves was not caused by FluoVolt dye, paragraph 1;
    Figure S1
  quote: Stimulation near the threshold elicited one or a few delayed APs
  depends_on:
  - figs1-aps-as-emission-decrease
  criterion: F1 to F4, under O1 to O5. Per neuron, the near-threshold sessions (O4); their AP count
    and first-AP latency from the onset (F3). The paper gives no count for "a few"; at most 3 APs
    is a standard choice. Reproduced when, in more than half of the neurons with APs (a standard
    choice), the median near-threshold session has 1 to 3 APs and its first AP is delayed (O5).
    Counts and latencies per neuron are reported.
- id: figs1-stronger-field-shorter-delay-sustained-firing
  statement: In Di-8-ANEPPS neurons, increasing the field strength reduced the delay to the first AP
    and induced sustained firing.
  source: Results, Sensitivity to unmodulated sine waves was not caused by FluoVolt dye, paragraph 1;
    Figure S1
  quote: Increasing the electric field strength reduced the delay and induced sustained firing
  depends_on:
  - figs1-aps-as-emission-decrease
  criterion: F1 to F4, under O1 to O3 and O6. Per neuron with sessions with APs at 3 or more fields,
    the Spearman correlation of first-AP latency with field over those sessions. The paper reports
    no test; reproduced when the correlation is negative in more than half of those neurons and
    more than half of all neurons show sustained firing (O6) in some session. The majority and the
    Spearman correlation are standard choices. The maximum firing rate (F5) against field is
    reported per neuron.
- id: figs1-culminates-in-sustained-depolarization
  statement: In Di-8-ANEPPS neurons, the strongest fields replaced firing with sustained
    depolarization (excitation followed by inhibition of firing).
  source: Results, Sensitivity to unmodulated sine waves was not caused by FluoVolt dye, paragraph 1;
    Figure S1 legend
  quote: induced sustained firing that culminated in sustained depolarization
  depends_on:
  - figs1-stronger-field-shorter-delay-sustained-firing
  criterion: F1 to F4, under O1 to O3 and O6. Per neuron, its sessions at its highest field. The
    paper gives no fraction of neurons; reproduced when more than half of the neurons (a standard
    choice) show sustained depolarization (O6) at their highest field and sustained firing or
    more APs at some lower field. The Figure S1 legend's "Excitation and inhibition of firing"
    describes one neuron; the number of neurons with each is reported.
- id: figs1-noisier-than-fluovolt
  statement: Di-8-ANEPPS traces were noisier than FluoVolt traces, as the dye has a lower voltage
    sensitivity.
  source: Results, Sensitivity to unmodulated sine waves was not caused by FluoVolt dye, paragraph 1
  quote: Compared to FluoVolt recordings, the traces were expectedly noisier (Di-8-ANEPSS has a lower
    voltage sensitivity)
  data: with_inputs
  depends_on:
  - figs1-aps-as-emission-decrease
  criterion: F1 to F3, under O1 to O3, for the Di-8-ANEPPS neurons of this dataset and for the FluoVolt
    neurons stimulated with 250-ms unmodulated 2-kHz sine waves in NaCl solution in DANDI:001030 and
    001032 to 001035 (assigned from their titles; FluoVolt traces not inverted). Per neuron, the
    signal to noise ratio is the median AP height over the SD of dF before the onset. "Noisier" is
    not defined; readings (a) that ratio, (b) the SD of dF before the onset. Reproduced when the
    Di-8-ANEPPS median is worse (lower ratio, larger SD) than the FluoVolt median under both. A
    two-sided unpaired t test (F6) is reported. As a variant on this dataset alone, the median
    Di-8-ANEPPS AP height is compared with the 11.3% typical of FluoVolt (Methods).
- id: figs1-effects-same-as-fluovolt
  statement: Overall, the effects of 2-kHz sine waves in Di-8-ANEPPS neurons did not differ from those
    with FluoVolt, so the excitation by unmodulated sine waves is not a sensitization by FluoVolt.
  source: Results, Sensitivity to unmodulated sine waves was not caused by FluoVolt dye, paragraph 1;
    Discussion, paragraph 2
  quote: Overall, stimulation effects were not different from those observed with FluoVolt dye
  data: with_inputs
  depends_on:
  - figs1-near-threshold-delayed-aps
  - figs1-stronger-field-shorter-delay-sustained-firing
  - figs1-culminates-in-sustained-depolarization
  criterion: A claim of absence, for which the paper names no test, and the paper does not say which
    effects were compared; the threshold comparison below is a reading of "not different", not a
    measure the paper names. The response pattern holds when
    figs1-near-threshold-delayed-aps, figs1-stronger-field-shorter-delay-sustained-firing and
    figs1-culminates-in-sustained-depolarization are reproduced. The paper's own concern is a
    sensitization by FluoVolt (Discussion, "we ruled out possible sensitization"), which would
    show as lower thresholds with FluoVolt; so the 1-AP threshold (F4) of the Di-8-ANEPPS neurons is
    compared with that of the FluoVolt neurons of figs1-noisier-than-fluovolt by a two-sided
    unpaired t test at p < 0.05 (F6). Reproduced when the pattern holds and the test finds no
    difference; not reproduced when the test finds a difference in either direction. The mean
    FluoVolt threshold of the neurons used is reported beside the paper's 57.7 ± 3.6 V/cm
    (Results, Asymmetric and less-efficient membrane charging, last paragraph, from Figure 2D) as
    a check on the reference group, not judged. A one-sample t test of the Di-8-ANEPPS thresholds against 57.7 V/cm is shown
    as a variant on this dataset alone. The difference of means and its 95% interval are reported.
    The Di-8-ANEPPS sessions may not have been a threshold search (fields in a random sequence), so
    the threshold is the lowest exciting field tested, which is an upper bound; the notebook
    reports the gap to the next lower field tested.
