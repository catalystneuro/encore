    stimulus. The 5% is the Methods' AP selection level, used here as a standard choice.
- id: figs1-di8-anepps-control
  statement: With Di-8-ANEPPS instead of FluoVolt, in eight neurons, near-threshold stimulation
    elicited one or a few delayed APs and stronger fields induced sustained firing ending in
    sustained depolarization, as with FluoVolt.
  source: Results, Sensitivity to unmodulated sine waves was not caused by FluoVolt dye, paragraph 1;
