  expected:
  - quantity: ratio of NaCl to NaGlu mean 1-AP threshold, each frequency
    value: 2
    tolerance: 0.2
  criterion: 1-AP thresholds for 250-ms unmodulated sine waves (Figure 3B legend) as in
