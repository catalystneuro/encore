# Claims for Semenov, Kim, Silkuniene & Pakhomov (2025), Cell Reports Physical Science 6, 102660,
# on dandiset 001273.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-22, under
# docs/protocol.md version pilot-10, as the reader.
#
# Text read. The NIH author manuscript (NIHMS2098259, PMC12320893) as served by Europe PMC, with its
# main text, figure legends and STAR Methods, and the supplement (NIHMS2098259-supplement-1.pdf,
# Figures S1 to S4 and Table S1, the Key Resource Table), all in
# paper/10.1016-j.xcrp.2025.102660.txt. The version of record was not read. No main-text PDF was
# available, so Figures 1 to 6 could not be looked at; values shown only in figures (the group
# means of Figures 4D and 4E, the n per group of Figure 2D) are not used.
#
# Code. The paper states that it does not report original code. Exponential fits and the standard
# errors of fitted constants were made with Origin 8.0; ROI intensities with MetaMorph; linear
# regression with Grapher 16 (STAR Methods, Quantification and statistical analysis).
#
# Data the paper used. E18 Sprague-Dawley rat hippocampal neurons (BrainBits), cultured about one
# week on coverslips, stained with FluoVolt (Di-8-ANEPPS in Figure S1). Two kinds of recording:
# (1) Fast imaging of the optical membrane potential (64 x 64 pixels, 3,130 or 3,086.4 frames/s,
# 1,200 images per session: 50 ms before, 250 ms during and about 90 ms after the stimulus) with
# 250-ms unmodulated or 20-Hz modulated sine waves at 2 and 20 kHz (Figures 1, 2), NaCl (16.4
# mS/cm) or sodium gluconate (8.4 mS/cm) solution (Figure 3), 2-s ramped 2-kHz sine waves
# (Figure 3C), Di-8-ANEPPS on eight neurons (Figure S1) and 1 uM tetrodotoxin (Figure S2).
# (2) Pulsed laser strobe imaging (6-ns flashes at 440 nm, full sensor, no binning, 6 images/s).
# Figure 4, the experiment of this dandiset: 2-us square pulses at 140 V/cm (10-fold below the AP
# threshold for 2-us pulses), from a three-electrode array of 0.5-mm tungsten rods 1.4 mm apart,
# applied in one direction and then the orthogonal one; images at 50-ns steps from 1 us before the
# pulse, eight replicates per experiment. Per experiment, ROIs over the most de- (cathode-facing)
# and hyperpolarized (anode-facing) membrane regions, plus a "debris" ROI used to scale out
# laser-flash fluctuations. dF = 100% (F - F0)/F0, F0 the mean before the pulse. 19 experiments
# grouped by cell shape and orientation: elongated cells parallel to the field (n = 3) and
# perpendicular to it (n = 6), and "random" shapes (n = 10, both field orientations pooled). The
# paper counts experiments and does not say how many cells they come from. Figures 5, 6 and S3:
# nine cells (C1 to C9) imaged with a 2-us, 257 V/cm pulse at 50-ns steps and then with one beat of
# a 2-kHz sine wave modulated at 100 or 154 Hz at 20-us steps, from a bipolar electrode.
#
# This dandiset. Its title (DANDI:001273, "Kinetics of Membrane Charging and Its Dependence on
# Neuron Shape and Alignment with the Electric Field") matches the Figure 4 experiment, so the
# Figure 4 claims are data dataset. The paper deposited its raw images in ten dandisets (Data and
# code availability) without saying which figure is in which. From their titles only: 001271 holds
# tetrodotoxin (Figure S2), 001272 Di-8-ANEPPS (Figure S1), 001274 sine wave polarization (Figures
# 5, 6, S3), 001030 and 001032 to 001035 the 250-ms and 2-s sine wave stimulation (Figures 1 to 3).
# The paper also lists 001031, which no claim here is assigned to.
# Claims on those are data elsewhere, as read from the titles. The 2-us, 257 V/cm pulse recordings
# of the nine cells of Figures 5 and 6 may be in 001274 or here; the author finds where.
#
# A discrepancy in the paper. The Results say images ran "from 1 μs before the pulse to 6 μs after
# it" with "1,440 images per experiment" over eight replicates (180 per replicate); the Methods say
# "starting 1 μs before the pulse and continuing for 5 μs after it (8 μs total, 160 images)". The
# frames in the dataset decide; this is not a method choice.
#
# Method details fixed from the paper, used by the Figure 4 criteria. (F1) dF per frame in each ROI,
# F0 the mean of the frames before the pulse (Methods, Pulsed laser fluorescence microscopy). (F2)
# The ROI data are scaled to the debris ROI and also processed without scaling; the paper did both
# ("with and without scaling"), so both are run where the debris ROI is available and the outcome
# is the one both give; where it is not, unscaled only, recorded as a deviation. (F3) The fitted
# trace is the mean over the eight replicates (Figure 4 legend, "averaged across eight trials").
# (F4) Charging: dF = dFmax (1 - exp(-t/tau)), t the time into the pulse; discharging: dF = dFmax
# exp(-t/tau), t the time after the pulse (Methods). dFmax is the asymptote of the charging fit
# (Figure 4D and 4E legend). The cathode-facing pole is the depolarized ROI, the anode-facing pole
# the hyperpolarized one (Results, Kinetics paragraph 1); anodic dF is negative and magnitudes are
# compared. (F5) Groups, n and tests are those of the Figure 4D and 4E legend and the text, as each
# criterion cites.
#
# Details the paper leaves open, with the readings named. (O1) ROI size and position are not given,
# only that they were "selected over the most polarized membrane regions" of the RATIO image
# (last 0.5 us of the pulse over the CONTROL image, both low-pass filtered at 12 x 12 pixels). The
# ROIs are taken from the dataset when it holds them. When it does not, they are rebuilt from the
# RATIO image as the Methods describe, under readings (a) a 12 x 12 pixel square (the Methods'
# filter size) centred on the extreme pixel of each sign within the cell, (b) the pixels within the
# cell beyond half the extreme of each sign; the outcome is the one both give, and the rebuild is
# recorded as a deviation. (O2) Fit weighting is not given (Origin 8.0); readings (a) unweighted,
# (b) weighted by 1/SEM^2 of the replicate mean. (O3) Whether the discharge amplitude is a free
# parameter is not given; the Methods write the same dFmax in both equations; readings (a) free
# discharge amplitude, (b) discharge amplitude fixed at the charging fit's dFmax. The tau readings
# are all combinations of O1 to O3 and of F2; a claim on tau is reproduced when all give its
# outcome, and blocked as methods_underspecified when they give different outcomes. (O4) Cell
# shape (elongated or random) and orientation (parallel or perpendicular) were judged by eye; the
# paper gives no rule beyond "random" when long and short cross-sections could not be identified.
# The labels must come from the dataset; claims that need the groups are blocked as
# metadata_insufficient without them. (O5) What the 19 experiments are (cells, or cell and field
# orientation pairs) is not given; parallel n = 3 and perpendicular n = 6 cannot all be paired.
schema_version: 2
dataset:
  archive: dandi
  id: "001273"
paper: doi:10.1016/j.xcrp.2025.102660
claims:
- id: fig4-polarized-poles-face-electrodes
  statement: A 2-us pulse polarizes mainly the membrane facing the electrodes, depolarized at the
    cathode-facing pole and hyperpolarized at the anode-facing one, while even large neurites show
    little or no polarization.
  source: Results, Kinetics of membrane charging by pulsed electric fields, the paragraph after the
    Figure 4 legend; Figures 4A to 4C
  quote: In neurons of all shapes, the electric field primarily polarized membrane portions facing the
    electrodes ... Unexpectedly, even large neurites showed little to no polarization and did not
    seem to impact the charging of cell soma
  criterion: Per experiment, the filtered RATIO image of the Methods (mean of the frames in the last
    0.5 us of the pulse over the mean of the frames before the pulse and late after it, each low-pass
    filtered over 12 x 12 pixels). The field direction per experiment is taken from the dataset. The
    paper gives no measure; reproduced when, in more than half of the experiments of each shape
    group of the Figure 4D and 4E legend (or of all 19 when the labels are missing, O4), the extreme
    depolarized and extreme hyperpolarized pixels of the cell lie on opposite sides of its centroid
    along the field axis (the angle between their separation and the field axis below 45 degrees).
    The majority, the centroid and the 45 degrees are standard choices. The part on neurites needs
    a neurite mask that the paper does not give and is reported, not judged.
- id: fig4-orientation-time-constants
  statement: In elongated neurons, charging was about 2-fold faster with the field orthogonal to the
    long axis; aligning elongated cells with the field doubled the time constants compared with the
    same cells perpendicular to it or with randomly shaped cells.
  source: Results, Kinetics of membrane charging by pulsed electric fields, the paragraph after the
    Figure 4 legend; Figures 4A, 4D and 4E
  quote: Aligning elongated cells with the electric field doubled the time constants, as compared to
    either the same cells oriented perpendicular to the field ( p < 0.001, paired t test) or to
    randomly shaped cells ( p < 0.01, unpaired t test)
  statistics:
  - about: elongated cells, parallel against perpendicular (text)
    test: paired t test
    p: 0.001
    p_relation: "<"
  - about: elongated cells, between the orthogonal orientations (Figure 4D and 4E legend)
    test: unpaired two-tailed t test
    p: 0.01
    p_relation: "<"
    n: parallel n = 3, perpendicular n = 6
  - about: elongated parallel against random cells
    test: unpaired t test
    p: 0.01
    p_relation: "<"
    n: parallel n = 3, random n = 10
  expected:
  - quantity: ratio of mean tau, elongated parallel to elongated perpendicular
    value: 2
    tolerance: 0.2
  - quantity: ratio of mean tau, elongated parallel to random
    value: 2
    tolerance: 0.2
  criterion: Fits as in the header (F1 to F4), groups from the dataset's labels (O4), as in the
    Figure 4D and 4E legend (parallel n = 3, perpendicular n = 6, random n = 10, random cells with
    both orientations pooled). The tau compared are charging and discharging, at each pole. The text
    names a paired t test (p < 0.001) for parallel against perpendicular; the legend marks p < 0.01
    between orientations with an unpaired two-tailed t test (O5). Readings of that test (a) paired,
    on elongated cells imaged in both orientations, (b) unpaired, on the legend's groups. Which time
    constants "the time constants" means is not given, and the text's first sentence names charging
    only; readings of the subset (i) charging tau, (ii) charging and discharging tau, each at both
    poles. Reproduced when, under one subset reading, the parallel mean is within tolerance of twice
    the perpendicular mean and of twice the random mean, and parallel against random reaches
    p < 0.01 and the orientation test its stated p (0.001 paired, 0.01 unpaired) at one pole at
    least, under every reading of the header (O1 to O3, F2) and both readings of the test; blocked
    as methods_underspecified when they disagree. The ratios at each pole are reported.
- id: fig4-no-pole-difference
  statement: The maximum optical TMP and the charging and discharging time constants did not differ
    between the cathode- and anode-facing poles, indicating no rectification of the field.
  source: Results, Kinetics of membrane charging by pulsed electric fields, the paragraph after the
    Figure 4 legend; Figures 4D and 4E
  quote: Δ F max did not differ at the cathodic and anodic cell poles, indicating the lack of
    rectification of the applied electric field. Charging and discharging time constants did not
    differ between the two poles either
  criterion: A claim of absence. The text names no test for it; the Methods' test is a two-sided
    Student's t test, paired or unpaired as appropriate, at p < 0.05, and the two poles are in the
    same experiment, so a two-sided paired t test over the 19 experiments of |dFmax|, charging tau
    and discharging tau, cathodic against anodic. Fits as in the header. Reproduced when none of the
    three is significant at p < 0.05 under every reading of the header; not reproduced when any is
    under every reading; blocked as methods_underspecified when the readings disagree. The mean
    differences and their 95% intervals are reported either way.
- id: fig4-discharging-slower
  statement: Discharging time constants were larger than charging ones in the same cell, except in
    elongated cells aligned with the field.
  source: Results, Kinetics of membrane charging by pulsed electric fields, the paragraph after the
    Figure 4 legend; Figures 4D and 4E
  quote: discharging time constants were always larger than the charging ones in the same cell ( p <
    0.001, paired t test), with the exception of elongated cells aligned with the field
  statistics:
  - about: discharging against charging tau (text)
    test: paired t test
    p: 0.001
    p_relation: "<"
  - about: discharging against charging tau, per group and pole (Figure 4D and 4E legend, hash sign)
    test: paired two-tailed t test
    p: 0.01
    p_relation: "<"
  criterion: Fits as in the header. Two-sided paired t test of discharging against charging tau.
    The pooling behind the text's p < 0.001 is not given; readings (a) all 19 experiments, both
    poles, (b) the experiments other than elongated parallel, both poles, (c) as (b), each pole
    alone, and per group and pole for the legend's marks. Reproduced when, under one of (a) to (c),
    discharging tau is larger with p < 0.001, and the elongated parallel group shows no difference
    at p < 0.05 at either pole (which needs the labels, O4), with every reading of the header giving
    that outcome; blocked as methods_underspecified when the header's readings disagree.
- id: fig4-pooled-time-constants
  statement: Pooled over all 19 experiments, charging and discharging time constants averaged 0.7
    and 0.91 us at the cathodic pole and 0.65 and 0.8 us at the anodic pole.
  source: Results, Kinetics of membrane charging by pulsed electric fields, the paragraph after the
    Figure 4 legend; Figures 4D and 4E (ALL)
  quote: The time constants pooled together for all cells averaged 0.7 ± 0.08 (charging) and 0.91 ±
    0.08 (discharging) μs for the cathodic cell pole and 0.65 ± 0.05 and 0.8 ± 0.07 μs for the
    anodic pole, respectively (mean ± SEM, n = 19)
  expected:
  - quantity: charging tau, cathodic pole
    value: 0.7
    tolerance: 0.08
    unit: us
  - quantity: discharging tau, cathodic pole
    value: 0.91
    tolerance: 0.08
    unit: us
  - quantity: charging tau, anodic pole
    value: 0.65
    tolerance: 0.05
    unit: us
  - quantity: discharging tau, anodic pole
    value: 0.8
    tolerance: 0.07
    unit: us
  criterion: Fits as in the header. The mean over all 19 experiment fits, as the text (n = 19) and
    the Figure 4D and 4E legend (ALL, n = 19, all cells and all orientations) give it. Tolerances
    are the SEMs the paper gives. Reproduced when all four are within tolerance, with every reading
    of the header (O1 to O3, F2) giving that outcome; blocked as methods_underspecified when the
    header's readings disagree. The SEMs are reported.
- id: fig4-full-charge-within-3us
  statement: Membranes exceed 95% of full charge in under 3 us, even in the largest neurons and with
    the least efficient alignment with the field, so each cycle of a sine wave fully polarizes the
    membrane even at 100 to 200 kHz.
  source: Results, Kinetics of membrane charging by pulsed electric fields, the paragraph after the
    Figure 4 legend
  quote: It will take <3 μs to exceed 95% of the full charge, even in the largest neurons and with the
    least efficient cell alignment with the field
  depends_on:
  - fig4-pooled-time-constants
  criterion: Under the paper's exponential model (Methods), 95% of full charge is reached at 3 tau
    (ln 20 = 3.0). Charging tau from the fits of the header. The paper does not say whether the
    bound holds for every cell or for the least efficient group; readings (a) 3 times the mean
    charging tau of the elongated parallel group (the least efficient alignment, Figure 4D and 4E)
    is below 3 us at both poles, (b) 3 times the largest charging tau of any experiment is below 3
    us. Reproduced when (a) holds under every reading of the header; partially reproduced when (a)
    holds and (b) does not. The 100 to 200 kHz part is an inference and is not tested.
- id: fig1-pure-sine-excites-all
  statement: Unmodulated 250-ms sine waves at 2 and 20 kHz excited every neuron tested, with APs
    100 to 200 ms after onset near threshold, firing rate rising to a ceiling of 60 to 90 Hz, and
    an excitation block with sustained depolarization at the highest fields.
  source: Results, Stimulation by 2- and 20-kHz unmodulated sine waves, paragraph 1; Figures 1A to 1C
    and inset
  quote: Pure sine waves at 2 and even 20 kHz excited 100% of neurons ... The maximum firing rate
    increased linearly until reaching a ceiling of 60-90 Hz
  data: elsewhere
  where: DANDI:001032, 001033, 001034 and 001035 (assigned from their titles; the paper does not map
    figures to dandisets)
  expected:
  - quantity: fraction of neurons excited
    value: 100
    tolerance: 10
    unit: percent
  - quantity: median over neurons of the highest maximum firing rate
    value: 76.5
    tolerance: 22.5
    unit: Hz
  - quantity: first-AP latency at each neuron's lowest exciting field, median over neurons
    value: 155
    tolerance: 65
    unit: ms
  criterion: AP detection is given only as "brief emission upticks" in neurons whose APs peak above
    5% dF and last about 10 ms (Methods, Recording of the optical APs); readings (a) a peak above 5%
    dF over F0, (b) a rise of at least 5% dF within 5 ms. The maximum firing rate of a session is
    the inverse of the interval between its first two AP peaks (Methods). Reproduced when, under
    both readings, at least 90% of neurons are excited at each frequency and the median ceiling lies
    within 54 to 99 Hz (the reported 60 to 90 Hz widened by 10% of each bound, written above as
    its midpoint and half-width), and the median first-AP latency at threshold lies within 90 to
    220 ms (the reported 100 to 200 ms widened the same way); blocked as methods_underspecified
    when the readings disagree. The median over neurons is a standard choice. The block is
    reported, not judged.
- id: fig2d-modulated-thresholds-higher
  statement: Thresholds for 1 and 5 APs at 20 kHz were about 2-fold those at 2 kHz, and thresholds
    for sine waves modulated at 20 Hz were significantly higher than for pure sine waves for 5 APs
    at 2 kHz and for 1 and 5 APs at 20 kHz.
  source: Results, Excitation thresholds are similar or lower for pure 2- and 20-kHz sine waves than
    those for modulated sine waves, paragraph 1; Figure 2D
  quote: All thresholds at 20 kHz were about 2-fold higher than at 2 kHz ( p < 0.0001, two-tailed
    unpaired t test) ... thresholds for modulated sine waves, which emulate the TI stimulus at the
    target, were significantly higher than those for pure sine waves at the same frequency
  statistics:
  - about: 20 kHz against 2 kHz, all thresholds
    test: two-tailed unpaired t test
    p: 0.0001
    p_relation: "<"
  - about: modulated against unmodulated, 2 kHz, 5 APs
    test: two-tailed unpaired t test
    p: 0.0079
  - about: modulated against unmodulated, 20 kHz, 1 AP
    test: two-tailed unpaired t test
    p: 0.0142
  - about: modulated against unmodulated, 20 kHz, 5 APs
    test: two-tailed unpaired t test
    p: 0.0037
  data: elsewhere
  where: DANDI:001032, 001033, 001034 and 001035 (assigned from their titles)
  depends_on:
  - fig1-pure-sine-excites-all
  expected:
  - quantity: ratio of mean 20-kHz to mean 2-kHz threshold, each stimulus and AP count
    value: 2
    tolerance: 0.2
  criterion: The threshold of a neuron for a stimulus is the lowest field of a session with at least
    1 (or 5) APs during the 250-ms stimulus (Figure 2D legend), AP detection as in
    fig1-pure-sine-excites-all, both readings. Two-tailed unpaired t tests as the text names them.
