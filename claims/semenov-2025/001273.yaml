- id: fig3c-sustained-firing-2s
  statement: In the low-conductivity solution, a 2-s unmodulated 2-kHz sine wave ramped over 250 ms
    evoked firing for its whole duration, rising with field until replaced by a firing block with
    sustained depolarization.
  source: Results, Decreased extracellular conductivity lowers excitation thresholds, paragraph 3;
    Figure 3C
  quote: we observed sustained firing for the entire duration of the sine wave ( Figure 3C ). The rate
    of firing increased with the electric field strength until it was replaced by a firing block
    and sustained depolarization
  data: elsewhere
  where: DANDI:001030 (assigned from its title)
  criterion: Traces corrected for bleaching by subtracting a trace without APs (Methods); AP detection
