- id: fig5-sine-asymmetry
  statement: Sine waves polarized the two poles of a cell more asymmetrically than 2-us pulses; in the
    Figure 5 cell the depolarized ROI 2 was 30% smaller than the hyperpolarized ROI 1 with the pulse
