- id: fig4-orientation-and-poles
  statement: Aligning elongated cells with the field doubled the time constants compared with the same
    cells perpendicular to it or with randomly shaped cells; dFmax and the time constants did not
    differ between the cathode- and anode-facing poles; and discharging was slower than charging
    except in elongated cells aligned with the field.
  source: Results, Kinetics of membrane charging by pulsed electric fields, the two paragraphs after
    the Figure 4 legend; Figures 4D and 4E and legend
  quote: Δ F max did not differ at the cathodic and anodic cell poles, indicating the lack of
    rectification of the applied electric field. Charging and discharging time constants did not
    differ between the two poles either. Aligning elongated cells with the electric field doubled the
    time constants, as compared to either the same cells oriented perpendicular to the field ( p <
    0.001, paired t test) or to randomly shaped cells ( p < 0.01, unpaired t test). Interestingly,
    discharging time constants were always larger than the charging ones in the same cell ( p <
    0.001, paired t test), with the exception of elongated cells aligned with the field
  statistics:
  - about: elongated cells, parallel against perpendicular time constants
