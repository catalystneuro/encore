- id: fig3-not-heating
  statement: Excitation by pure sine waves was not caused by heating; the adiabatic temperature rise
    was 2.5 C after 250 ms at 63 V/cm in NaCl, at most 1.24 C for the same stimulus in the
    low-conductivity solution, where it evoked sustained firing, and 4.1 C at 81 V/cm in NaCl.
  source: Results, Decreased extracellular conductivity lowers excitation thresholds, paragraph 3;
    Figure 3A
  quote: the maximum theoretical temperature rise (assuming no heat dissipation 43 ) was 2.5°C after
    250 ms of near-threshold stimulation at 2 kHz, 63 V/cm, in the NaCl-based solution ( Figure 3A ).
    The same stimulation in the low-conductance solution elicited sustained neuron firing while the
    temperature rise would not exceed 1.24°C ... 81 V/cm in the NaCl solution, which would heat by
    4.1°C in the adiabatic conditions. These observations prove that excitation by pure sine waves
    was not caused by heating
  data: elsewhere
