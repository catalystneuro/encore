# Claims for Semenov, Kim, Silkuniene & Pakhomov (2025), Cell Reports Physical Science 6, 102660,
# on dandiset 001048.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-22, under
# docs/protocol.md version pilot-10, as the reader.
#
# Text read. The NIH author manuscript (NIHMS2098259, PMC12320893) as served by Europe PMC: main
# text, figure legends and STAR Methods, with the supplement (NIHMS2098259-supplement-1.pdf, Figures
# S1 to S4 and Table S1, the Key Resource Table), all in paper/10.1016-j.xcrp.2025.102660.txt. The
# version of record was not read. There is no PDF of the main text, so Figures 1 to 6 were not seen;
# no claim needed a figure the text does not describe.
#
# Code. The paper states "This paper does not report original code". It names the software used:
# Fiji ImageJ 1.53C or MetaMorph 7.7 for soma emission, Grapher 16 for traces and linear regression,
# Origin 8.0 for exponential fits and their standard errors, Sim4Life 5.2 for the field, and RStudio
# in Table S1. No repository was read, so no method detail below is settled by code.
#
# This dandiset does not hold the paper's data. Its title and description on DANDI (version
# 0.250701.1624) are "Plasma membrane conductance changes in response to supraphysiological
# hyperpolarization", a study of membrane lesions made by hyperpolarization in HEK cells ("diffuse
# zonal electropermeabilization, focal pores, and high-conductance pores"), species Homo sapiens. The
# paper has no HEK cells and no hyperpolarization lesion experiment, and its Data and code
# availability lists ten dandisets (001030 to 001035 and 001271 to 001274), not 001048. The two share
# authors and NIH grants (R21EY034258, R21EY034803), which may be why the dandiset names the paper.
# Every claim below is therefore data elsewhere. The paper does not say which figure is in which
# dandiset; from their titles on DANDI only, 001030 (2-kHz sine waves, the effect of the field) and
# 001032 to 001035 (action potential triggering by sine waves at varying frequencies, parts 1 to 4)
# hold the FluoVolt experiments of Figures 1 to 3, 001271 tetrodotoxin (Figure S2), 001272
# Di-8-ANEPPS (Figure S1), 001273 the 2-us pulse charging kinetics (Figure 4) and 001274 sine wave
# polarization (Figures 5, 6 and S3). 001031 (100-kHz bipolar pulses) matches no figure. Versions
# are those published on DANDI on 2026-10-22.
#
# Data the paper used. E18 Sprague-Dawley rat hippocampal neurons (BrainBits), cultured about one
# week on 12-mm coverslips. One neuron, its soma touching no other cell, centred between the tips of
# a bipolar tungsten electrode (two 100-um rods, 120-um gap, 45 degrees, 50 um above the coverslip).
# Optical membrane potential by fast imaging (64 x 64 pixels after 4 x 4 binning, 3,130 or 3,086.4
# frames/s), 1,200 images per session, 50 ms before, 250 ms during and about 90 ms after the
# stimulus, sessions 20 to 60 s apart, fields escalated or in a random order. Measured variable is
# the emission over the entire soma, as dF = 100% (F - F0)/F0. Most neurons were stained with
# FluoVolt and stimulated with 250-ms unmodulated or 20-Hz modulated sine waves at 2 and 20 kHz
# (Figures 1, 2), in NaCl (16.4 mS/cm) or sodium gluconate (NaGlu, 8.4 mS/cm) solution at 2 to 20
# kHz (Figures 3A, 3B), or with a 2-s, 2-kHz wave ramped over 250 ms in NaGlu (Figure 3C); eight
# neurons with Di-8-ANEPPS (Figure S1); neurons before and about 5 min after 1 uM tetrodotoxin or
# vehicle (Figure S2). Strobe imaging (6-ns laser flashes, 50-ns steps) of 2-us, 140 V/cm pulses
# from two orthogonal directions in 19 experiments (Figure 4, three-electrode array 1.4 mm apart),
# and of 2-us, 257 V/cm pulses and single beats of 2-kHz sine waves modulated at 100 or 154 Hz in
# 20-us steps in 9 cells (Figures 5, 6, S3), with ROIs over the most de- and hyperpolarized regions.
#
# Method details fixed from the paper, used by the criteria.
# (F1) F is the mean emission over the entire cell soma per frame, F0 its mean over an interval
# before the stimulus, dF = 100% (F - F0)/F0 (Methods, Recording of the optical APs). FluoVolt
# emission rises with depolarization; Di-8-ANEPPS traces are inverted (Methods; Figure S1 legend).
# (F2) Traces are not filtered or modified, except the 2-s recordings of Figure 3C, corrected for
# bleaching by subtracting a trace without APs (Methods).
# (F3) The stimulus starts 50 ms into the session and lasts 250 ms (Results; Methods), 2 s for
# Figure 3C; the dataset's own stimulus record is used where it has one.
# (F4) The maximum firing rate of a session is the inverse of the peak-to-peak interval between its
# first two APs (Methods).
# (F5) A threshold is the minimum field eliciting at least 1 or at least 5 APs during the 250-ms
# stimulus (Figure 2D and 3B legends), found by 5% to 10% steps (Methods).
# (F6) The test, where the paper names none, is a two-sided Student's t test, paired or unpaired as
# appropriate, at p < 0.05 (Methods, Quantification and statistical analysis); error bars are SEM.
# (F7) Strobe data (Methods, Pulsed laser fluorescence microscopy). F per frame in the de- and
# hyperpolarized ROIs, scaled to a debris ROI; F0 the mean before the pulse, or for sine waves the
# mean over the first and last cycles; charging fit dF = dFmax (1 - exp(-t/tau)) over time into the
# pulse, discharging fit dF = dFmax exp(-t/tau) over time after it. The pulse sensitivity is dF
# averaged from 1 to 2 us into the pulse, normalized to 1 kV/cm (Results; Figure 6B legend); the sine
# sensitivity is the regression coefficient of the oscillation, after subtraction of a LOESS fit of
# the whole-cell response, on the field (Results; Figure 6C legend).
#
# Details the paper leaves open, with the readings named. Each criterion that uses one runs every
# reading; a claim is decided when all readings give its outcome, and blocked as
# methods_underspecified when they give different outcomes.
# (O1) The soma outline is not given. ROIs are taken from the dataset when it holds them; otherwise
# readings (a) the connected component nearest the image centre (the Methods centre the neuron) of
# an Otsu threshold of the mean pre-stimulus frame, (b) that mask eroded by 2 pixels. Otsu and the 2
# pixels are standard choices.
# (O2) The F0 interval is "a time interval preceding the electrical stimulation"; readings (a) all
# frames before the onset, (b) the last 20 ms before it.
# (O3) AP detection is given only as "brief emission upticks", in neurons selected for APs above 5%
# dF lasting about 10 ms. An AP is a local maximum with width at half height of 2 to 20 ms and at
# least 5 ms from a larger maximum (standard choices; 60 to 90 Hz gives intervals over 11 ms), with
# height readings (a) above 5% dF, (b) above 5 SD of dF before the onset.
# (O4) "Sustained depolarization" has no measure. It is no AP in the last 100 ms of the stimulus
# while the mean dF there is above, reading (a) 5 SD of dF before the onset, (b) half the median AP
# height of the neuron. The 100-ms window is a standard choice.
# (O5) Scaling to the debris ROI. The paper processed data with and without it (Methods); readings
# (a) scaled, (b) unscaled.
# (O6) The LOESS span of Figure 5 is not given; readings (a) a span of 2 ms, (b) 4 ms (about 4 and 8
# carrier cycles at 2 kHz), standard choices that follow the envelope but not the carrier.
