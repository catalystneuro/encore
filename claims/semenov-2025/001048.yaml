- id: fig6-sine-less-than-pulse
  statement: Across 9 cells FluoVolt sensitivity to 2-us pulses was 15% to 47% per 1 kV/cm (mean 28%);
    sensitivity to 2-kHz sine waves, linearly correlated with the field, was 1.5% to 28.4% (mean
    11.8%), smaller in every ROI, and 42% of the pulse value.
  source: Results, Asymmetric and less-efficient membrane charging by sine waves compared to pulses,
    paragraphs 5 and 6; Figures 6B to 6D
  quote: The electric field sensitivity of FluoVolt ranged between a 15% and 47% change per 1 kV/cm,
    with an average value of 28% ± 2.5% across all ROIs in all the cells ... The regression
    coefficient, which was the FluoVolt sensitivity to sine waves, varied from 1.5% to 28.4% (
    Figure 6C ). All numbers were invariably smaller than those measured for the same ROIs with the
    pulse ( Figure 6D ). The electric field sensitivity averaged across all ROIs in all the cells was
    11.8% ± 1.7% per 1 kV/cm, just 42% of the value for the 2-μs pulses
  data: elsewhere
  where: DANDI:001274 (0.250805.1401), assigned from its title
