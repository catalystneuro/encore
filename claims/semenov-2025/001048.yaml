    value: 28
    tolerance: 2.5
    unit: percent per kV/cm
  - quantity: range of pulse sensitivity
    value: 15
    tolerance: 1.5
    unit: percent per kV/cm, lower bound (upper bound 47, tolerance 4.7)
  - quantity: mean sine sensitivity over the 18 ROIs
    value: 11.8
    tolerance: 1.7
