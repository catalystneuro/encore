- id: threshold-depolarization-estimate
  statement: The 2-kHz AP threshold of 57.7 V/cm times the sine wave sensitivity gives a 0.68%
    emission change, about 6.8 mV with FluoVolt's calibration, so the threshold depolarization is 5
    to 15 mV, as with intracellular current injection.
  source: Results, Asymmetric and less-efficient membrane charging by sine waves compared to pulses,
    last paragraph
  quote: This threshold corresponds to a 0.68% ± 0.11% FluoVolt emission change (11.8 × 57.7/1,000)
    ... Then, a 0.68% emission change corresponds to a 6.8-mV depolarization at the AP threshold.
    Considering the calibration factor variability, the threshold TMP depolarization can be
    conservatively estimated in the range from 5 to 15 mV
  data: elsewhere
  where: DANDI:001032 to 001035 (0.240527.1431 or 0.240527.1432) for the threshold and DANDI:001274
    (0.250805.1401) for the sensitivity, assigned from their titles
  depends_on:
  - fig2d-modulated-thresholds-higher
  - fig6-sine-less-than-pulse
  expected:
  - quantity: emission change at the 2-kHz AP threshold
    value: 0.68
    tolerance: 0.11
    unit: percent
  - quantity: depolarization at the 2-kHz AP threshold
    value: 6.8
    tolerance: 1.1
    unit: mV
  criterion: The mean sine sensitivity of fig6-sine-less-than-pulse times the mean unmodulated 2-kHz
    threshold of fig2d-modulated-thresholds-higher, divided by 1,000, under the two readings of
    57.7 V/cm given there (1-AP or 5-AP threshold), matching under either, and that times 10 mV per
    1% (the calibration of reference 47, about 10% per 100 mV, as the paper uses it). Tolerances are
