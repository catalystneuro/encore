  source: Results, Excitation thresholds are similar or lower for pure 2- and 20-kHz sine waves than
    those for modulated sine waves, paragraph 1; Figure 2D; Results, Asymmetric and less-efficient
    membrane charging, last paragraph
  quote: thresholds for modulated sine waves, which emulate the TI stimulus at the target, were
    significantly higher than those for pure sine waves at the same frequency ... p = 0.0079 ...
    p = 0.0142 and p = 0.0037
  statistics:
  - about: modulated against unmodulated, 2 kHz, 5 APs
    test: two-tailed unpaired t test
    p: 0.0079
  - about: modulated against unmodulated, 20 kHz, 1 AP
    test: two-tailed unpaired t test
    p: 0.0142
  - about: modulated against unmodulated, 20 kHz, 5 APs
    test: two-tailed unpaired t test
    p: 0.0037
  data: elsewhere
  where: DANDI:001032 to 001035 (assigned from their titles)
  expected:
  - quantity: mean unmodulated 2-kHz 1-AP threshold
