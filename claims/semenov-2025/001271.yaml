# Claims for Semenov, Kim, Silkuniene & Pakhomov (2025), Cell Reports Physical Science 6, 102660,
# on dandiset 001271.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-22, under
# docs/protocol.md version pilot-10, as the reader.
#
# Text read. The NIH author manuscript (NIHMS2098259, PMC12320893) as served by Europe PMC, with its
# main text, figure legends and STAR Methods, and the supplement (NIHMS2098259-supplement-1.pdf,
# Figures S1 to S4 and Table S1, the Key Resource Table), all in
# paper/10.1016-j.xcrp.2025.102660.txt. The version of record was not read. No main-text PDF was
# available, so Figures 1 to 6 could not be looked at. Page 3 of the supplement PDF (Figure S2) was
# looked at to read its layout, as its legend does not give it: three neurons, one vehicle
# control tested at 45, 63 and 72 V/cm and two TTX neurons tested at 90, 108 and 117 V/cm and at
# 54, 72 and 81 V/cm, each at the same fields before and after the solution change, with APs at
# the lower fields and a depolarization with small oscillations at the highest before the change.
# These values orient the author only; no claim rests on them.
#
# Code. The paper states "This paper does not report original code". It names the software used:
# Fiji ImageJ 1.53C or MetaMorph 7.7 for soma emission, Grapher 16 for traces and linear
# regression, Origin 8.0 for fits, Sim4Life 5.2 for the field, and RStudio in Table S1. No
# repository was read, so no method detail below is settled by code.
#
# Data the paper used. E18 Sprague-Dawley rat hippocampal neurons (BrainBits), cultured about one
# week on 12-mm coverslips. A single neuron with no apparent somatic contact is centred in the
# field, with a bipolar tungsten electrode (two 100-um rods, 120-um gap, 45 degrees, tips 50 um
# above the coverslip) and the neuron centred in the gap. Fast imaging of the optical membrane
# potential, 64 x 64 pixels after 4 x 4 binning, at 3,130 or 3,086.4 frames/s, 1,200 images per
# session (50 ms before, 250 ms during and about 90 ms after the stimulus), sessions 20 to 60 s
# apart, fields escalated or in a random order. F is the emission over the entire soma, F0 its mean
# before the stimulus, and dF = 100% (F - F0)/F0. Most neurons were stained with FluoVolt and
# recorded with 250-ms unmodulated or 20-Hz modulated sine waves at 2 and 20 kHz (Figures 1, 2), in
# NaCl (16.4 mS/cm) or sodium gluconate (8.4 mS/cm) solution (Figure 3A, 3B), with 2-s ramped 2-kHz
# sine waves (Figure 3C), with Di-8-ANEPPS on eight neurons (Figure S1) and with 1 uM tetrodotoxin
# (Figure S2). Strobe imaging with 2-us pulses and single sine wave beats measured membrane charging
# (Figures 4 to 6, S3).
#
# This dandiset. Its title and description on DANDI ("Tetrodotoxin Blockade of Sodium Channels
# Abolishes Action Potential Formation During Intense Sinewave Stimulation"; 1 uM TTX "suppressed
# action potentials, as expected, and completely prevented sustained depolarization") match the
# Figure S2 experiment. As the paper reports it, FluoVolt-stained neurons were stimulated by
# unmodulated 250-ms, 2-kHz sine waves at several field strengths (V/cm) in the standard NaCl
# solution, and again about 5 min after the solution was replaced by the same solution with 1 uM
# TTX (Tocris) or without it (vehicle control). The measured variable is the soma emission per
# frame; per session, the field strength, the solution (before, TTX, vehicle) and the session
# order. The paper gives no count of TTX or vehicle neurons; the Methods say representative traces
# come from at least 4, usually 8 to 15, replications in different cells. The claims on the Figure
# S2 experiment are data dataset. The paper deposited its raw images in ten dandisets (Data and
# code availability) without saying which figure is in which. From their titles only, 001030
# (2-kHz sine waves, effect of the field) and 001032 to 001035 (sine wave stimulation at varying
# frequencies) hold the FluoVolt experiments of Figures 1 to 3, 001272 Di-8-ANEPPS (Figure S1),
# 001273 the 2-us pulse kinetics (Figure 4), 001274 sine wave polarization (Figures 5, 6, S3);
# 001031 (100-kHz bipolar pulses) matches no figure. Claims on those are data elsewhere, and the
# claims files of 001272, 001273 and 001274 hold fuller criteria for theirs.
#
# Method details fixed from the paper, used by the Figure S2 criteria.
# (F1) F is the mean emission over the entire cell soma per frame, F0 the mean over an interval
# before the stimulus, dF = 100% (F - F0)/F0 (Methods, Recording of the optical APs). FluoVolt
# emission rises with depolarization, so traces are not inverted.
# (F2) Traces are not filtered or modified in any way (Methods); no detrending or smoothing.
# (F3) The stimulus is a 250-ms, 2-kHz unmodulated sine wave (Figure S2 legend), starting 50 ms into
# the session (Methods); the onset, the field and the solution of each session are taken from the
# dataset, and the 50 ms is used when the onset is not given there.
# (F4) Sessions after the change are those about 5 min after the solution was replaced by TTX or
# vehicle (Figure S2 legend); the solution of each session is taken from the dataset.
# (F5) The maximum firing rate of a session is the inverse of the peak-to-peak interval between its
# first two APs (Methods).
# (F6) The two-sided Student's t test, paired or unpaired as appropriate, at p < 0.05, is the paper's
# test where a criterion needs one (Methods, Quantification and statistical analysis). The paper
# reports no test for Figure S2.
#
# Details the paper leaves open, with the readings named. Every Figure S2 criterion runs every
# combination of the readings below; a claim is decided when all give its outcome, and blocked as
# methods_underspecified when they give different outcomes.
# (O1) The soma outline is not given. ROIs are taken from the dataset when it holds them. When it
# does not, readings (a) the connected component nearest the image centre (the Methods centre the
# neuron) of an Otsu threshold of the mean pre-stimulus frame, (b) that mask eroded by 2 pixels, to
# leave out the neurite bases at its edge. Otsu and the 2 pixels are standard choices.
# (O2) The length of the F0 interval is not given ("a time interval preceding the electrical
# stimulation"); readings (a) all frames before the onset (about 50 ms), (b) the last 20 ms before
# the onset. This is unlikely to change an outcome.
# (O3) AP detection is given only as "brief emission upticks", in neurons selected for APs above 5%
# dF lasting about 10 ms (typical 11.3% and 8 ms). An AP is a local maximum of dF with width at half
# height between 2 and 20 ms ("about 10 ms"; the bounds are a standard choice) and at least 5 ms
# from a larger maximum (standard choice; the paper's highest rates, 60 to 90 Hz, give intervals
# over 11 ms). Readings of the height (a) above 5% dF (the Methods' selection level), (b) above 5 SD
# of dF before the onset. After TTX, (a) and (b) are applied with the level of the same neuron's
# sessions before the change, so that a drop of the baseline noise cannot create APs.
# (O4) "Sustained depolarization" is not defined by a measure. It is no AP in the last 100 ms of the
# stimulus while the mean dF over that window is above, reading (a) 5 SD of dF before the onset,
# (b) half the median AP height of the neuron before the change. The 100-ms window is a standard
# choice. "Sustained firing" is, as a standard choice, at least three APs with one in the last 50 ms
# of the stimulus.
# (O5) Which session pairs are compared before and after the change is not stated beyond the
# legend's "recorded first ... and again"; readings (a) every field tested both before and after,
# (b) only the highest field tested both before and after.
schema_version: 2
dataset:
  archive: dandi
  id: "001271"
paper: doi:10.1016/j.xcrp.2025.102660
claims:
- id: figs2-neurons-tested
  statement: The tetrodotoxin experiment was replicated in several neurons, with vehicle controls; the
    representative traces of Figure S2 come from at least 4 independent replications in different
    cells.
  source: Figure S2 legend; Methods, Quantification and statistical analysis
  quote: Representative traces of the optical membrane potentials were selected from at least 4 and
    usually 8-15 independent replications in different cells
  expected:
  - quantity: neurons in the TTX experiment, TTX alone or TTX and vehicle (readings in the criterion)
    value: 4
    tolerance: 0
    unit: neurons, at least
  criterion: Neurons are counted from the dataset's subjects, sessions or cell identifiers, each
    recording counted once (author, step 1), and split into TTX and vehicle by the dataset's
    session metadata. The paper does not say whether the 4 replications count TTX neurons alone;
    readings (a) at least 4 TTX neurons, (b) at least 4 neurons over TTX and vehicle together.
    As a reported number read two ways, reproduced when either reading holds (protocol, step 3).
    The tolerance is 0 on a lower bound. The number of vehicle neurons is reported; the legend
    gives no count and the figure shows one, so at least one vehicle neuron is expected and its absence is reported as a
    finding.
- id: figs2-before-firing-then-depolarization
  statement: Before the drug, unmodulated 2-kHz sine waves evoked repetitive APs at lower fields and,
    at the most intense fields, a sustained depolarization in which APs merged into small
    oscillations.
  source: Results, Tetrodotoxin blocks sustained depolarization, paragraph 1; Results, Stimulation by
    2- and 20-kHz unmodulated sine waves, paragraph 1; Figure S2
  inferred: The paper states this pattern for Figures 1 and 3 ("At the highest field strengths,
    multiple APs coalesced into low-amplitude oscillations on top of a continuous depolarization");
    for the Figure S2 neurons it is shown
    only in the traces before the change, and the legend's "abolishes both firing and sustained
    depolarization" implies both were present before.
  criterion: F1 to F3, under O1 to O4, sessions before the change only. Per neuron, the session at its
    highest field and its sessions at lower fields. Reproduced when every neuron (TTX and vehicle)
    has APs in some session, and more than half of them (a standard choice; the paper gives no
    fraction) show sustained depolarization (O4) at their highest field and APs without sustained
    depolarization at a lower field. The AP count and the maximum firing rate (F5) per session are
    reported against field.
- id: figs2-depolarization-reversible
  statement: The sustained depolarization induced by intense unmodulated sine waves reversed
    immediately when the stimulus ended, so it was not membrane electroporation, which would take
    seconds or longer to repair.
  source: Results, Tetrodotoxin blocks sustained depolarization, paragraph 1
  quote: The sustained depolarization induced by intense unmodulated sine waves ( Figures 1 and 3 )
    was immediately reversible upon stimulus cessation. It was not related to membrane
    electroporation, which would take seconds or longer to repair
  depends_on:
  - figs2-before-firing-then-depolarization
  criterion: F1 to F3, under O1 to O4, all sessions with sustained depolarization (O4), before the
    change and in vehicle neurons. "Immediately" is not quantified; readings of the window after
    the stimulus (a) 10 to 40 ms after its end, (b) the last 40 ms of the recording (the Methods
    give about 90 ms after the stimulus). Reproduced when, in every such session, the mean dF in
    the window is below the O4 level of that reading. A further check, from the paper's "seconds or
    longer", is that F0 of the next session of the same neuron (20 to 60 s later) is within 10%
    (a standard choice) of the F0 of the session before; it is reported, not judged. Windows are
    standard choices; the claim is tested on the Figure S2 neurons, while the paper's sentence
    cites Figures 1 and 3.
- id: figs2-ttx-abolishes-aps
  statement: 1 uM tetrodotoxin abolished the APs evoked by unmodulated 250-ms, 2-kHz sine waves.
  source: Results, Tetrodotoxin blocks sustained depolarization, paragraph 1; Figure S2 legend
  quote: the inhibition of sodium channels with 1 μM tetrodotoxin not only abolished the APs
  depends_on:
  - figs2-before-firing-then-depolarization
  criterion: F1 to F4, under O1 to O3 and O5. Per TTX neuron, session pairs at the same field before
    and after TTX. Reproduced when, in every TTX neuron, no AP is detected in any session after
    TTX at a field where APs were detected before; not reproduced when any such session has an
    AP. The AP counts before and after per pair are reported.
- id: figs2-ttx-blocks-sustained-depolarization
  statement: Tetrodotoxin also fully blocked the sustained depolarization caused by intense sine
    waves, consistent with the depolarization arising from repeated activation of voltage-gated
    sodium channels by the cycling de- and hyperpolarization of the membrane.
  source: Results, Tetrodotoxin blocks sustained depolarization, paragraph 1; Figure S2 legend
  quote: Consistent with this hypothesis, the inhibition of sodium channels with 1 μM tetrodotoxin not
    only abolished the APs but also fully blocked the sustained depolarization
  depends_on:
  - figs2-before-firing-then-depolarization
  criterion: F1 to F4, under O1, O2, O4 and O5. Per TTX neuron, the session pairs at the same field
    where sustained depolarization (O4) was present before TTX. Reproduced when, in every such pair,
    sustained depolarization is absent after TTX, and the mean dF over the last 100 ms of the
    stimulus after TTX is below the O4 level. "Fully" is read as that level; the mean dF over the
    window before and after is reported per pair, with a two-sided paired t test (F6) over pairs
    shown as a variant, not judged. Blocked (other) when no TTX neuron has sustained depolarization
    before TTX.
- id: figs2-vehicle-keeps-response
  statement: In vehicle controls, recorded about 5 min after the solution was replaced by the same
    solution without TTX, the firing and sustained depolarization persisted.
  source: Figure S2 legend; Methods, Quantification and statistical analysis
  inferred: No sentence states the vehicle result. The Figure S2 legend says the neurons were recorded
    again after replacement by the same solution "with 1 μM TTX or without it (vehicle control)",
    the Methods list "vehicle controls in experiments with tetrodotoxin", and the legend's title
    attributes the loss of firing and depolarization to TTX, which implies the vehicle neurons kept
    them; Figure S2 shows this in one neuron.
  depends_on:
  - figs2-before-firing-then-depolarization
  criterion: F1 to F4, under O1 to O5. Per vehicle neuron, session pairs at the same field before and
    after the change. Reproduced when, in every vehicle neuron, every pair with APs before has APs
    after, and every pair with sustained depolarization (O4) before has it after. AP counts and
    the maximum firing rate (F5) per pair are reported; the paper does not say whether the response
    must be unchanged, so a decline is reported, not judged. Blocked (other) when the dataset holds
    no vehicle neuron.
- id: ap-amplitude-duration
  statement: Neurons were selected for APs peaking above 5% dF and lasting about 10 ms; typical APs
    were 11.3% dF high and 8 ms long, excluding the afterhyperpolarization.
  source: Methods, Recording of the optical APs and data analyses
  quote: we selected neurons whose APs peaked at a more than 5% Δ F and lasted about 10 ms (typical
    values ... 11.3% ± 0.9% Δ F and 8 ± 0.7 ms duration, excluding afterhyperpolarization ... mean ±
    SEM, n = 22)
  expected:
  - quantity: mean AP peak over neurons
    value: 11.3
    tolerance: 0.9
    unit: percent dF
  - quantity: mean AP duration over neurons
    value: 8
    tolerance: 0.7
    unit: ms
  criterion: F1 and F2, under O1 to O3, sessions before the change. The paper does not say which 22
    neurons these are or which experiments they come from; the neurons of this dataset are tested
    as neurons the same selection was applied to, and a mismatch may come from that. Per neuron,
    the mean peak dF and duration of its APs. Which APs are measured is not given; readings (a) all
    APs before the change, (b) the first AP of each session, which is not merged with others. The
    duration measure is not given; readings (a) width at half height, (b) time from the rise to
    the return to F0 on the decay, ending at the first crossing of F0 (so the afterhyperpolarization
    is left out). These readings are method details that can change the outcome, so the header's
    rule applies. Reproduced when the means over neurons are within the paper's SEM under every
    reading; partially reproduced when, under every reading, every neuron has APs above 5% dF and
    lasting 2 to 20 ms (O3) but a mean falls outside; blocked as methods_underspecified when the
    readings give different outcomes. The number of neurons with APs above 5% is reported.
- id: fig1-pure-sine-excites-all
  statement: Unmodulated 250-ms sine waves at 2 and 20 kHz excited every neuron tested, with APs
    100 to 200 ms after onset near threshold, firing rate rising to a ceiling of 60 to 90 Hz, and
    sustained depolarization at the highest fields.
  source: Results, Stimulation by 2- and 20-kHz unmodulated sine waves, paragraph 1; Figures 1A to 1C
    and inset
  quote: Pure sine waves at 2 and even 20 kHz excited 100% of neurons ... at near-threshold electric
    field strengths, isolated APs emerged with a delay of 100-200 ms after the sine wave onset ...
    The maximum firing rate increased linearly until reaching a ceiling of 60-90 Hz
  data: elsewhere
  where: DANDI:001030 and 001032 to 001035 (assigned from their titles; the paper does not map
    figures to dandisets)
  expected:
  - quantity: fraction of neurons excited
    value: 100
    tolerance: 10
    unit: percent
  criterion: F1 to F3, F5, O1 to O4 of the header, for FluoVolt sessions of unmodulated sine waves.
    A neuron's threshold is the lowest field of a session with at least one AP during the
    stimulus (Figure 2D legend). Reproduced when, under every reading, at least 90% of neurons
    are excited at each frequency, the median over neurons of the highest maximum firing rate lies
    within 54 to 99 Hz (60 to 90 Hz widened by 10% of each bound) and the median first-AP latency
    at threshold lies within 90 to 220 ms (100 to 200 ms widened the same way). Whether the
    ceiling is meant for the median neuron or every neuron is open (the inset shows three); both
    are reported and the median decides. Sustained depolarization (O4) at the highest field is
    reported, not judged, as the paper gives no fraction of neurons.
- id: fig1-20khz-needs-twice-the-field
  statement: All excitation thresholds at 20 kHz were about 2-fold higher than at 2 kHz.
  source: Results, Excitation thresholds are similar or lower for pure 2- and 20-kHz sine waves than
