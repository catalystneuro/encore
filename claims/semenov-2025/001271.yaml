    blocked as methods_underspecified when they disagree.
- id: fig2-modulated-locks-to-beats
  statement: With 20-Hz modulation, firing above threshold locked to the beats, one AP near the peak
    of each of the five beats and at most two per beat (ten in all), and modulated sine waves
    triggered no sustained firing or sustained depolarization.
  source: Results, Stimulation by 2- and 20-kHz sinusoids modulated at 20 Hz, paragraph 1; Figures 2A
    and 2B
  quote: single APs emerged near the peak of each beat, so the firing rate equaled the modulation
    rate ... the maximum number of APs evoked by five beats was limited to ten. Unlike pure sine
    waves, modulated stimuli did not trigger sustained firing or sustained depolarization
  data: elsewhere
  where: DANDI:001032 to 001035 (assigned from their titles)
  criterion: AP readings of the header, modulated sessions only. The 250-ms wave holds five 50-ms
    beats (Results), and modulated waves begin and end at minimal amplitude (Methods, Pulsed laser
    fluorescence microscopy), so each beat peaks 25 ms into it; the dataset's stimulus record is
    used instead when it gives the envelope. The paper does not quantify "near the peak"; as
    standard choices, reproduced when no session has more than 10 APs, in sessions with 5 APs or
    more most APs fall within 12.5 to 37.5 ms of each 50-ms beat, and no session shows sustained
    firing or sustained depolarization (O4).
- id: fig2c-pure-more-aps
  statement: In the same neuron at the same field strength, pure sine waves triggered more APs than
    modulated ones, and the threshold was typically lower for unmodulated signals.
  source: Results, Stimulation by 2- and 20-kHz sinusoids modulated at 20 Hz, paragraph 2; Figures 2A
    to 2C
  quote: the threshold was typically lower for unmodulated signals ( Figures 2A - 2C ). At the same
    field strengths, pure sine waves triggered a larger number of APs
  data: elsewhere
  where: DANDI:001032 to 001035 (assigned from their titles)
  criterion: AP readings of the header. Pairs are a neuron's modulated and unmodulated sessions at the
    same carrier and field. The paper reports no test; reproduced when the unmodulated count is
    larger in more pairs than the reverse, and the unmodulated threshold lower in more neurons than
    the reverse, under every reading. A two-sided paired t test (F6) of the counts is reported.
- id: fig3b-low-conductivity-halves-threshold
  statement: Lowering solution conductivity from 16.4 to 8.4 mS/cm with sodium gluconate reversibly
    lowered excitation thresholds about 2-fold at all sine wave frequencies from 2 to 20 kHz.
  source: Results, Decreased extracellular conductivity lowers excitation thresholds, paragraph 1;
    Figures 3A and 3B
  quote: Switching to the NaGlu-based solution reversibly and reproducibly decreased excitation
    thresholds ~2-fold across all sine wave frequencies tested
  data: elsewhere
  where: DANDI:001030 and 001032 to 001035 (assigned from their titles)
  expected:
  - quantity: ratio of NaCl to NaGlu mean 1-AP threshold, each frequency
    value: 2
    tolerance: 0.2
  criterion: 1-AP thresholds for 250-ms unmodulated sine waves per frequency and solution, 4 to 8
