- id: fig2d-modulated-thresholds-higher
  statement: Thresholds for sine waves modulated at 20 Hz were significantly higher than for pure
    sine waves at the same carrier, for 5 APs at 2 kHz and for 1 and 5 APs at 20 kHz, so modulation
