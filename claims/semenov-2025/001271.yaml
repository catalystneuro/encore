- id: fig3-not-heating
  statement: Excitation by pure sine waves was not caused by heating; the adiabatic temperature rise
    was 2.5 C after 250 ms at 63 V/cm in NaCl solution, at most 1.24 C for the same stimulus in
    the low-conductivity solution, and 4.1 C at 81 V/cm in NaCl.
  source: Results, Decreased extracellular conductivity lowers excitation thresholds, paragraph 2;
    Figure 3A
  quote: the maximum theoretical temperature rise (assuming no heat dissipation 43 ) was 2.5°C after
    250 ms of near-threshold stimulation at 2 kHz, 63 V/cm, in the NaCl-based solution ... These
    observations prove that excitation by pure sine waves was not caused by heating
  data: elsewhere
  where: DANDI:001030 or 001032 to 001035 for the Figure 3A responses (assigned from their titles);
    the temperatures are calculated from the field, duration and conductivity, not measured
  expected:
  - quantity: adiabatic rise, 63 V/cm, 250 ms, 16.4 mS/cm
    value: 2.5
    tolerance: 0.25
    unit: degrees C
  - quantity: adiabatic rise, 63 V/cm, 250 ms, 8.4 mS/cm
    value: 1.24
    tolerance: 0.124
    unit: degrees C
  - quantity: adiabatic rise, 81 V/cm, 250 ms, 16.4 mS/cm
    value: 4.1
    tolerance: 0.41
    unit: degrees C
  criterion: The rise is sigma E^2 t over the volumetric heat capacity (reference 43, cited for the
    adiabatic assumption). The paper does not give the heat capacity or whether E is the peak or
    the RMS field; readings (a) peak, (b) RMS, each with the heat capacity of water (4.18 J per
    cm3 per K, a standard choice). Reproduced when all three are within tolerance under a reading;
    since these are calculated numbers read two ways, that reading is reported. Computed from the
    paper's own values (1.64 S/m, 63 V/cm, 0.25 s), neither reading gives 2.5 C (peak about 3.9 C,
    RMS about 1.95 C), while the ratios 4.1/2.5 and 1.24/2.5 follow the formula's scaling with E^2
    and with conductivity. The heat capacity or field definition the paper used is therefore not
    known; when no reading matches the absolute values but the two ratios are within 10%, the claim
    is blocked as methods_underspecified, and it is not reproduced only when the ratios fail as
    well. That the Figure 3A
    neuron fired at 63 V/cm in NaGlu as at 81 V/cm in NaCl is tested as in
    fig3b-low-conductivity-halves-threshold.
- id: fig3c-sustained-firing-2s
  statement: In the low-conductivity solution, a 2-s unmodulated 2-kHz sine wave ramped over 250 ms
    evoked firing for its whole duration, rising with field until replaced by a firing block with
    sustained depolarization.
  source: Results, Decreased extracellular conductivity lowers excitation thresholds, paragraph 3;
    Figure 3C
  quote: we observed sustained firing for the entire duration of the sine wave ( Figure 3C ). The rate
    of firing increased with the electric field strength until it was replaced by a firing block
    and sustained depolarization
  data: elsewhere
  where: DANDI:001030 (assigned from its title)
  criterion: Traces corrected for bleaching by subtracting a trace without APs (Methods); AP readings
    of the header. Reproduced when an intermediate field has APs in the last 250 ms of the stimulus,
    the AP count rises with field up to some field, and the highest field shows sustained
    depolarization (O4, over the last 250 ms of the stimulus). The windows are standard choices.
- id: figs1-di8-same-as-fluovolt
  statement: With Di-8-ANEPPS in place of FluoVolt, in eight neurons, the effects of 2-kHz sine waves
    were not different, so the excitation by unmodulated sine waves is not a sensitization by
    FluoVolt.
  source: Results, Sensitivity to unmodulated sine waves was not caused by FluoVolt dye, paragraph 1;
    Figure S1
  quote: Experiments were performed on eight neurons using different electric field strengths tested
    in a random sequence ... Overall, stimulation effects were not different from those observed
    with FluoVolt dye
  data: elsewhere
  where: DANDI:001272 (assigned from its title)
  criterion: As in the claims file for DANDI:001272 (figs1-eight-neurons and
    figs1-effects-same-as-fluovolt), which tests this finding on its own data.
- id: fig4-pooled-time-constants
  statement: Membrane charging by 2-us pulses is fast; pooled over 19 experiments, charging and
    discharging time constants averaged 0.7 and 0.91 us at the cathodic pole and 0.65 and 0.8 us at
    the anodic pole, so membranes charge fully within each sine wave cycle up to 100 to 200 kHz.
  source: Results, Kinetics of membrane charging by pulsed electric fields, the paragraph after the
    Figure 4 legend; Figures 4D and 4E
  quote: The time constants pooled together for all cells averaged 0.7 ± 0.08 (charging) and 0.91 ±
    0.08 (discharging) μs for the cathodic cell pole and 0.65 ± 0.05 and 0.8 ± 0.07 μs for the
    anodic pole, respectively (mean ± SEM, n = 19)
  data: elsewhere
  where: DANDI:001273 (assigned from its title)
  expected:
  - quantity: charging tau, cathodic pole
    value: 0.7
    tolerance: 0.08
    unit: us
  - quantity: discharging tau, cathodic pole
    value: 0.91
    tolerance: 0.08
    unit: us
  - quantity: charging tau, anodic pole
    value: 0.65
    tolerance: 0.05
    unit: us
  - quantity: discharging tau, anodic pole
    value: 0.8
    tolerance: 0.07
    unit: us
  criterion: Fits and readings as in the claims file for DANDI:001273 (fig4-pooled-time-constants),
    which tests this claim on its own data; tolerances are the paper's SEMs.
- id: fig4-orientation-and-poles
  statement: Aligning elongated cells with the field doubled the time constants; the maximum optical
    TMP and the time constants did not differ between the cathode- and anode-facing poles; and
    discharging was slower than charging except in elongated cells aligned with the field.
  source: Results, Kinetics of membrane charging by pulsed electric fields, the paragraph after the
    Figure 4 legend; Figures 4D and 4E
  quote: Δ F max did not differ at the cathodic and anodic cell poles, indicating the lack of
    rectification of the applied electric field ... Aligning elongated cells with the electric
    field doubled the time constants ... discharging time constants were always larger than the
    charging ones in the same cell ( p < 0.001, paired t test)
  statistics:
  - about: elongated cells, parallel against perpendicular
    test: paired t test
    p: 0.001
    p_relation: "<"
  - about: elongated parallel against random cells
    test: unpaired t test
    p: 0.01
    p_relation: "<"
  - about: discharging against charging tau
    test: paired t test
    p: 0.001
    p_relation: "<"
  data: elsewhere
  where: DANDI:001273 (assigned from its title)
  criterion: As in the claims file for DANDI:001273 (fig4-orientation-time-constants,
    fig4-no-pole-difference and fig4-discharging-slower), which tests each part on its own data;
    reproduced when all three are reproduced there. The Figure 4 legend gives other bounds and
    test types for these comparisons (p < 0.01, paired two-tailed, charging against
    discharging; p < 0.01, unpaired two-tailed, between orthogonal orientations); the statistics
    above are the Results'.
- id: fig6-sine-less-than-pulse
  statement: FluoVolt sensitivity to 2-kHz sine waves (11.8% per 1 kV/cm) was 42% of that to 2-us
    pulses (28% per 1 kV/cm) and smaller in every ROI, with sine waves polarizing the two poles more
    asymmetrically than pulses.
  source: Results, Asymmetric and less-efficient membrane charging by sine waves compared to pulses,
    paragraphs 2 to 5; Figures 5, 6B to 6D and S3
  quote: All numbers were invariably smaller than those measured for the same ROIs with the pulse (
    Figure 6D ). The electric field sensitivity averaged across all ROIs in all the cells was 11.8% ±
    1.7% per 1 kV/cm, just 42% of the value for the 2-μs pulses
  data: elsewhere
  where: DANDI:001274 (assigned from its title)
  expected:
  - quantity: mean pulse sensitivity over the 18 ROIs
    value: 28
    tolerance: 2.5
    unit: percent per kV/cm
  - quantity: mean sine wave sensitivity over the 18 ROIs
    value: 11.8
    tolerance: 1.7
    unit: percent per kV/cm
  - quantity: mean sine over mean pulse sensitivity
    value: 42
    tolerance: 4.2
    unit: percent
  criterion: Measures and readings as in the claims file for DANDI:001274 (fig6b-pulse-sensitivity,
    fig6c-sine-sensitivity, fig6d-sine-less-than-pulse, fig5-sine-asymmetry-c7 and
    figs3-sine-asymmetry-c8), which tests this finding on its own data; tolerances are the paper's
    SEMs, and 10% for the ratio.
- id: threshold-depolarization-estimate
  statement: The 2-kHz AP threshold of 57.7 V/cm times the sine wave sensitivity gives a 0.68%
    emission change, about 6.8 mV, so the threshold depolarization is 5 to 15 mV, as with
    intracellular current injection.
  source: Results, Asymmetric and less-efficient membrane charging by sine waves compared to pulses,
    last paragraph
  quote: This threshold corresponds to a 0.68% ± 0.11% FluoVolt emission change (11.8 × 57.7/1,000)
    ... a 0.68% emission change corresponds to a 6.8-mV depolarization at the AP threshold
  data: elsewhere
  where: DANDI:001032 to 001035 for the threshold and DANDI:001274 for the sensitivity (assigned from
    their titles)
  depends_on:
  - fig2d-modulated-thresholds-higher
  - fig6-sine-less-than-pulse
  expected:
  - quantity: emission change at the 2-kHz AP threshold
    value: 0.68
    tolerance: 0.11
    unit: percent
  - quantity: depolarization at the 2-kHz AP threshold
    value: 6.8
    tolerance: 1.1
    unit: mV
  criterion: Mean sine sensitivity of fig6-sine-less-than-pulse times the mean unmodulated 2-kHz 1-AP
    threshold of fig2d-modulated-thresholds-higher, divided by 1,000, and that times 10 mV per 1%
    (the calibration of reference 47 as the paper uses it). Tolerances are the paper's, the last
    being 0.11% times 10 mV per 1%. Reproduced when both are within tolerance.
