  statistics:
  - about: 20 kHz against 2 kHz, all thresholds
    test: two-tailed unpaired t test
    p: 0.0001
    p_relation: "<"
  data: elsewhere
  where: DANDI:001032 to 001035 (assigned from their titles)
  expected:
  - quantity: ratio of mean 20-kHz to mean 2-kHz threshold, each stimulus and AP count
