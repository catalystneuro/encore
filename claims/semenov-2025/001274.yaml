claims:
- id: fig1-pure-sine-excites-all
  statement: Unmodulated 250-ms sine waves at 2 kHz and at 20 kHz excited every neuron tested,
    never as an on-off response.
  source: Results, Stimulation by 2- and 20-kHz unmodulated sine waves, paragraph 1; Figure 1A to 1C
  quote: Pure sine waves at 2 and even 20 kHz excited 100% of neurons. It was never an "on-off"
    response
  data: elsewhere
  where: DANDI:001032, 001033, 001034 and 001035 (assigned from their titles; the paper does not
    map figures to dandisets)
  expected:
  - quantity: fraction of neurons excited by unmodulated 2- or 20-kHz sine waves
    value: 100
    tolerance: 10
    unit: percent
  criterion: Per neuron, excited when at least one session with an unmodulated 2- or 20-kHz sine
    wave has an AP during the 250-ms stimulus. The Methods give no detection rule beyond "brief
    emission upticks" in neurons whose APs peak above 5% dF and last about 10 ms (Recording of the
    optical APs); readings (a) a peak of dF above 5% over F0, (b) a rise of at least 5% dF within
    5 ms, which also counts APs riding on a depolarization. Reproduced when, under each reading,
    at least 90% of neurons tested with each frequency are excited; blocked as
    methods_underspecified when the readings disagree.
- id: fig1-onset-delay
  statement: Near threshold, isolated APs appear 100 to 200 ms after the sine wave onset, and
    stronger fields shorten this delay and evoke sustained firing.
  source: Results, Stimulation by 2- and 20-kHz unmodulated sine waves, paragraph 1; Figure 1A to 1C
  quote: at near-threshold electric field strengths, isolated APs emerged with a delay of 100-200 ms
    after the sine wave onset ... Increasing the field strength reduced this delay and evoked
    sustained firing
  data: elsewhere
  where: DANDI:001032, 001033, 001034 and 001035 (assigned from their titles)
  depends_on:
  - fig1-pure-sine-excites-all
  criterion: AP detection as in fig1-pure-sine-excites-all, both readings. Per neuron and
    frequency, the near-threshold session is the session of lowest field with at least one AP.
    Reproduced when the median first-AP latency of those sessions lies within 90 to 220 ms (the
    range widened by 10% of each bound) and, per neuron, the first-AP latency falls with field
    (Spearman correlation below zero in more than half of the neurons with at least three
    sessions with APs). The paper gives no test for either part; the median, the Spearman sign and
    the majority are standard choices.
- id: fig1-max-rate-ceiling
  statement: The maximum firing rate increases linearly with field strength until it reaches a
    ceiling of 60 to 90 Hz.
  source: Results, Stimulation by 2- and 20-kHz unmodulated sine waves, paragraph 1; Figure 1 inset
  quote: The maximum firing rate increased linearly until reaching a ceiling of 60-90 Hz
  data: elsewhere
  where: DANDI:001032, 001033, 001034 and 001035 (assigned from their titles)
  depends_on:
  - fig1-pure-sine-excites-all
  criterion: The maximum firing rate of a session is the inverse of the interval between the
    peaks of its first two APs (Methods, Recording of the optical APs); AP detection as in
    fig1-pure-sine-excites-all, both readings. The ceiling of a neuron is its highest maximum
    firing rate over sessions with unmodulated sine waves. Reproduced when the median ceiling
    over neurons lies within 54 to 99 Hz (60 to 90 Hz widened by 10% of each bound). The rise
    below the ceiling is reported as the slope of a linear fit of rate on field over the
    sessions before the ceiling; the inset shows three neurons only.
- id: fig1-excitation-block
  statement: At the highest field strengths, APs coalesce into low-amplitude oscillations on a
    continuous depolarization, which can flatten and leave the membrane depolarized for the rest
    of the sine wave (an excitation block).
  source: Results, Stimulation by 2- and 20-kHz unmodulated sine waves, paragraph 1; Figure 1A to 1C
  quote: At the highest field strengths, multiple APs coalesced into low-amplitude oscillations on top
    of a continuous depolarization. These oscillations could flatten after several cycles, leaving
    the membrane depolarized for the rest of the sine wave
  data: elsewhere
  where: DANDI:001032, 001033, 001034 and 001035 (assigned from their titles)
  criterion: The paper gives no measure. Per neuron, the session of highest field with an
    unmodulated sine wave is compared with the near-threshold session (as in fig1-onset-delay).
    Reproduced when, in more than half of the neurons, the mean dF over the last 100 ms of the
    stimulus in the highest-field session exceeds the pre-stimulus F0 by more than 5% dF (the
    Methods' AP selection level) and exceeds that of the near-threshold session. The windows are
    a standard choice; the mean over the whole second half of the stimulus is shown as a variant.
- id: fig2d-20khz-twofold-threshold
  statement: All excitation thresholds at 20 kHz were about twice those at 2 kHz, for modulated and
    unmodulated sine waves and for 1 and 5 APs.
  source: Results, Excitation thresholds are similar or lower for pure 2- and 20-kHz sine waves than
    those for modulated sine waves, paragraph 1; Figure 2D
  quote: All thresholds at 20 kHz were about 2-fold higher than at 2 kHz ( p < 0.0001, two-tailed
    unpaired t test)
  statistics:
  - test: two-tailed unpaired t test
    p: 0.0001
    p_relation: "<"
    n: n individual neurons per group (numbers in Figure 2D only)
  data: elsewhere
  where: DANDI:001032, 001033, 001034 and 001035 (assigned from their titles)
  expected:
  - quantity: ratio of 20-kHz to 2-kHz threshold, each of the four stimulus and AP-count pairs
    value: 2
    tolerance: 0.2
  criterion: The threshold of a neuron for a stimulus is the lowest field of a session that
    evoked at least 1 (or at least 5) APs during the 250-ms stimulus (Figure 2D legend; Methods,
    5% to 10% amplitude steps); AP detection as in fig1-pure-sine-excites-all, both readings. For
    each of the four groups (unmodulated and modulated, 1 and 5 APs) the ratio of mean 20-kHz to
    mean 2-kHz threshold, and a two-tailed unpaired t test of the two (Methods, Quantification
    and statistical analysis). The paper gives one p for "all thresholds", so which comparison it
    is open; readings (a) one test per group, each p < 0.0001, (b) one test pooling the four
    groups, 20 kHz against 2 kHz. Reproduced when each ratio is within tolerance and the test
