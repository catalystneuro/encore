# Claims for Semenov, Kim, Silkuniene & Pakhomov (2025), Cell Reports Physical Science 6, 102660,
# on dandiset 001274.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-22, under
# docs/protocol.md version pilot-10, as the reader.
#
# Text read. The NIH author manuscript (NIHMS2098259, PMC12320893) as served by Europe PMC, with
# its main text, figure legends and STAR Methods, and the supplement (NIHMS2098259-supplement-1.pdf,
# Figures S1 to S4 and Table S1, the Key Resource Table), all in
# paper/10.1016-j.xcrp.2025.102660.txt. The version of record was not read. No main-text PDF was
# available, so Figures 1 to 6 could not be looked at; numbers shown only in figures are not used.
#
# Code. The paper states that it does not report original code. Analyses were done with Fiji or
# MetaMorph (ROI intensities), Origin 8.0 (exponential fits), Grapher 16 (linear regression) and,
# per Table S1, RStudio 2024.04.2 (the LOESS fits are read here as R's loess, see below).
#
# Data the paper used. E18 Sprague-Dawley rat hippocampal neurons (BrainBits), cultured about one
# week on coverslips, stained with FluoVolt (Di-8-ANEPPS in Figure S1). Two kinds of recording:
# (1) Fast imaging of the optical membrane potential (64 x 64 pixels, 3,130 or 3,086.4 frames/s,
# 1,200 images per session, 50 ms before, 250 ms during and about 90 ms after the stimulus), with
# 250-ms unmodulated or 20-Hz amplitude-modulated sine waves at 2 and 20 kHz (Figures 1, 2), in
# NaCl (16.4 mS/cm) or sodium gluconate (8.4 mS/cm) solution (Figure 3), 2-s ramped 2-kHz sine
# waves (Figure 3C), Di-8-ANEPPS controls on eight neurons (Figure S1) and 1 uM tetrodotoxin
# (Figure S2). Measured variables are whole-soma emission F and dF = 100% (F - F0)/F0, with F0 the
# pre-stimulus mean; the field per session in V/cm.
# (2) Pulsed laser strobe imaging (6-ns flashes, full sensor, no binning). Figure 4 has 2-us,
# 140 V/cm pulses applied from two orthogonal directions with a three-electrode array, 160 images
# at 50-ns steps, eight replicates, 19 experiments (3 elongated parallel, 6 elongated
# perpendicular, 10 random with both orientations pooled; the paper counts experiments, not cells,
# and does not say how many cells they come from). Figures 5, 6 and S3 have 9 neurons (C1 to C9; C7 is the cell of Figure 5, C8 the
# cell of Figure S3), each imaged first with a subthreshold 2-us, 257 V/cm pulse at 50-ns steps,
# then with a single beat of a 2-kHz sine wave modulated at 100 Hz (10 ms) or 154 Hz (6.5 ms),
# imaged at 20-us steps, peak field 136 V/cm in Figure 5, repeated 4 to 12 times (12 in Figure 5).
# Per cell, ROI 1 and ROI 2 over the most hyper- and depolarized regions, and one "debris" ROI
# used to scale out laser-flash fluctuations; 16 further ROIs in Figure 5E to 5G.
#
# This dandiset. Its title and description (DANDI:001274, "Characterization of Plasma Membrane
# Polarization in Hippocampal Neurons During Sine Wave and Modulated Sine Wave Stimulation"; 2 kHz
# sine waves, or modulated at 100 or 154 Hz, FluoVolt) say it holds the strobe recordings of sine
# wave polarization, that is the sine wave part of Figures 5, 6 and S3. The paper deposited its
# raw images in ten dandisets (Data and code availability) without saying which figure is in
# which. From the dandisets' titles only: 001030 holds the 2-s ramped 2-kHz stimulation (Figure
# 3C); 001032 to 001035 the sine and modulated sine wave stimulation at varying frequencies
# (Figures 1, 2, 3A and 3B); 001271 tetrodotoxin (Figure S2); 001272 Di-8-ANEPPS (Figure S1);
# 001273 the 2-us pulse kinetics (Figure 4); 001031 (100-kHz bipolar pulses) matches no figure.
# Claims on those data are marked data elsewhere with that dandiset, as read from its title.
# The 2-us pulse recordings of the nine cells of Figures 5 and 6 are needed by several claims
# here (data dataset); the description of 001274 names sine waves only, so they may be in 001274
# or in 001273. The author finds where they are; if only in 001273, those claims use it as an
# outside input of the same paper (author, step 4).
#
# Method details fixed from the paper, used by several criteria (STAR Methods, Pulsed laser
# fluorescence microscopy, unless said otherwise). ROIs are the paper's, placed by hand over the
# most polarized membrane regions of the pulse RATIO image; ROI intensity is the mean emission in
# the ROI per frame, scaled to the debris ROI. The paper processed data "with and without
# scaling", so both are run; the outcome is the one both give. For pulses F0 is the mean before
# the pulse; for sine waves F0 is the mean of the frames of the first and last sine wave cycles.
# Pulse sensitivity is the dF averaged from 1 to 2 us into the pulse (21 frames), divided by the
# field in kV/cm (Results, paragraph on Figure 6; Figure 6B legend). Sine wave sensitivity is the
# regression coefficient of the emission change on the electric field after subtracting the LOESS
# fit of the whole-cell response (Figure 5H and 6C legends). Magnitudes are compared, as the text
# reports the sensitivities of both the hyper- and the depolarized ROIs as positive numbers (15% to
# 47% for pulses, 1.5% to 28.4% for sine waves).
#
# Details the paper leaves open, with the readings named. (O1) The ROIs' size and position are
# not given; the ROIs must come from the dataset, and when it holds none the claim is blocked as
# metadata_insufficient, with an ROI rebuilt from the RATIO image (Methods) shown as a variant
# only. (O2) The LOESS span and degree are not given; Table S1 lists RStudio, so the readings are
# R's loess defaults (span 0.75, degree 2), and spans 0.5 and 0.25 (degree 2), all of which keep
# the 2-kHz carrier (25 frames per cycle) out of the fit; the outcome is the one all give. (O3)
# How "the electric field strength" enters the regression is not given; readings (a) frame by
# frame, the dF after LOESS subtraction on the signed instantaneous field of the stimulus at that
# frame (from the stimulus waveform or timing stored in the dataset), slope in % per kV/cm;
# (b) per carrier cycle, half the peak-to-peak dF after subtraction on the peak field of that
# cycle, with and without an intercept. (O4) Which recording is cell C7 or C8 is to be found
# from the dataset (pulse 257 V/cm, peak sine field 136 V/cm and 12 sessions for C7); when no
# recording can be matched the claims on those cells are blocked as metadata_insufficient.
