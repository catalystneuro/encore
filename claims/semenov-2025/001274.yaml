- id: fig5-carrier-antiphasic
  statement: During a single beat of a 2-kHz sine wave, the optical TMP in ROIs 1 and 2 oscillates
    with the carrier in opposite phases, with amplitude proportional to the sine wave amplitude,
    on top of a gradual whole-cell depolarization.
  source: Results, Asymmetric and less-efficient membrane charging by sine waves compared to pulses,
    paragraph 2; Figures 5C, 5D and 5H
  quote: Optical TMP oscillated in synchrony with the carrier sine wave in the opposite phases ...
    These oscillations, proportional to the sine wave amplitude, were superimposed on the gradual
    depolarization of the entire cell
  criterion: Cell C7 (O4), both modulation rates (100 and 154 Hz), dF per frame averaged over its
    sessions, LOESS-subtracted (O2, all readings). Reproduced when, under every reading, (i) the
    largest peak of the power spectrum of each subtracted trace above 500 Hz is at 2 kHz within one
    frequency bin, (ii) the Pearson correlation of the ROI 1 and ROI 2 subtracted traces is below
    zero with p < 0.05 (the Methods' level), and (iii) the regression of fig6c-sine-sensitivity
    (O3, reading a) has opposite signs in the two ROIs. The paper gives no test; the spectral
    peak, the Pearson correlation and the sign of the regression are standard choices, with the
    Methods' p < 0.05. The whole-cell depolarization is tested in fig5-whole-cell-depolarization.
- id: fig5-whole-cell-depolarization
  statement: During the sine wave beat the whole cell gradually depolarizes as the sine wave
    amplitude grows, then repolarizes.
  source: Figure 5C and 5D legend; Figures 5C and 5D
  quote: These high-frequency oscillations superimpose a gradual whole-cell depolarization that
    develops as the sine wave amplitude increases
  criterion: Cell C7 (O4), each modulation rate and ROI. The whole-cell response is the LOESS fit
    of the raw dF (Figure 5 legend; O2, all readings), fitted per session. The paper gives no test;
    its general test is the two-sided t test at p < 0.05 (Methods). The measure is open; readings
    (a) the mean of the LOESS fit over the beat, (b) the LOESS fit at the beat's peak (half the
    beat), each tested against zero over sessions with a one-sample two-sided t test. Reproduced
    when, under every reading, both ROIs are depolarized (positive, FluoVolt emission rising with
    depolarization) with p < 0.05 at both rates; partially reproduced when that holds at one rate.
    The same measure in the other eight cells is reported.
- id: fig5-sine-asymmetry-c7
  statement: In the cell of Figure 5, the 2-us pulse depolarized ROI 2 about 30% less than it
    hyperpolarized ROI 1, while the sine wave oscillations in ROI 2 were up to 90% smaller than
    in ROI 1.
  source: Results, Asymmetric and less-efficient membrane charging by sine waves compared to pulses,
    paragraphs 1 and 2; Figures 5B to 5D
  quote: Unexpectedly, in this cell, the oscillations in ROI 2 were up to 90% smaller than those in
    ROI 1 (compared to just 30% smaller when the same cell was polarized with the 2-μs pulse)
  depends_on:
  - fig6c-sine-sensitivity
  expected:
  - quantity: pulse, 1 - |dF ROI 2| / |dF ROI 1|
    value: 30
    tolerance: 3
    unit: percent
  - quantity: sine wave, largest 1 - (ROI 2 oscillation / ROI 1 oscillation)
    value: 90
    tolerance: 9
    unit: percent
  criterion: Cell C7 (O4). Pulse, readings (p1) the dF averaged 1 to 2 us into the pulse (Figure 6B
    measure), (p2) the largest |dF| of the 5-point running average during the pulse (Figure 5B
    legend). Sine wave, at 100 and 154 Hz, the larger of the two reductions, under readings (s1)
    the ratio of the ROIs' sensitivities as in fig6c-sine-sensitivity (O3 a and b), (s2) per
    carrier cycle half the peak-to-peak of the subtracted dF, taking the largest reduction over
    cycles whose ROI 1 amplitude is at least half its maximum ("up to"). Each with all O2
    readings. Reproduced when both values are within tolerance under one pulse and one sine
    reading for every O2 reading.
- id: figs3-sine-asymmetry-c8
  statement: In a second neuron (Figure S3), polarization in ROI 1 was 20% smaller than in ROI 2
    with the 2-us pulse and 40% smaller with sine waves, and the antiphasic oscillations did not
    move to a new area.
  source: Results, Asymmetric and less-efficient membrane charging by sine waves compared to pulses,
    paragraph 3; Figure S3
  quote: With the 2-μs pulse, polarization in ROI 1 was 20% smaller than in ROI 2 ( Figure S3B );
    however, with sine waves, it became 40% smaller
  depends_on:
  - fig5-sine-asymmetry-c7
  expected:
  - quantity: pulse, 1 - |dF ROI 1| / |dF ROI 2|
    value: 20
    tolerance: 2
    unit: percent
  - quantity: sine wave, 1 - (ROI 1 oscillation / ROI 2 oscillation)
    value: 40
    tolerance: 4
    unit: percent
  criterion: Cell C8 (O4), measures and readings as in fig5-sine-asymmetry-c7, except that the
    sine wave value is not qualified by "up to", so reading (s2) uses the median over cycles whose
    ROI 2 amplitude is at least half its maximum. Reproduced when both values are within tolerance
    under one pulse and one sine reading for every O2 reading. The part on migration needs the
    ROIs of Figure S3E and S3F and is reported, not judged, as their positions are only in the
    figure.
- id: fig5fg-no-migration
  statement: Over 16 further ROIs around the cell of Figure 5, strong oscillations were found on one
    side only, and the relatively large oscillations of ROIs 12 to 14 on the other side were not
    antiphasic to them, so the small ROI 2 oscillations did not come from migration of the
    polarized area.
  source: Results, Asymmetric and less-efficient membrane charging by sine waves compared to pulses,
    paragraph 2; Figures 5E to 5G
  quote: strong oscillations were observed on one side only ( Figure 5F ), and the relatively large
    oscillations in ROIs 12-14 in Figure 5G were not antiphasic to those in Figure 5F
  depends_on:
  - fig6c-sine-sensitivity
  criterion: Needs the 16 ROIs of Figure 5E with the paper's numbering (O1); blocked as
    metadata_insufficient if the dataset lacks them. Cell C7, the 154-Hz beat (Figures 5F and 5G
    are "same as (D)"), sensitivity per ROI as in fig6c-sine-sensitivity with its sign (O2 and O3
    readings). Reproduced when, under every reading, the signed sensitivities of ROIs 12, 13 and
    14 have the sign of the Figure 5F ROIs' median, and the largest |sensitivity| among the
    Figure 5G ROIs is below the largest among the Figure 5F ROIs. Which of the 16 ROIs belong to
    Figure 5F and which to 5G is shown only in the figure (the text says only that they lie on
    opposite sides of the cell, with 12 to 14 in 5G); without that split from the dataset the
    claim is blocked as metadata_insufficient.
- id: fig6b-pulse-sensitivity
  statement: The FluoVolt response to 2-us pulses, averaged 1 to 2 us into the pulse, ranged from
    15% to 47% per 1 kV/cm, averaging 28% plus or minus 2.5% over all ROIs in the nine cells.
  source: Results, Asymmetric and less-efficient membrane charging by sine waves compared to pulses,
    paragraph 4; Figure 6B
  quote: The electric field sensitivity of FluoVolt ranged between a 15% and 47% change per 1 kV/cm,
    with an average value of 28% ± 2.5% across all ROIs in all the cells
  expected:
    quantity: mean pulse sensitivity over the 18 ROIs
    value: 28
    tolerance: 2.5
    unit: percent per kV/cm
  criterion: Per cell C1 to C9 and ROI 1 and 2 (O1), |dF| averaged over the 21 frames from 1 to 2 us
    into the 257 V/cm pulse, divided by 0.257 kV/cm (or the field recorded for the cell), with and
    without debris scaling. Reproduced when, under both, the mean over the 18 ROIs is within
    tolerance (the SEM the paper gives) and every ROI lies within 13.5% to 51.7% (15% to 47%
    widened by 10% of each bound); blocked as methods_underspecified when the two disagree.
- id: fig6c-sine-sensitivity
  statement: The sine-wave-induced TMP oscillations were linearly correlated with the electric field
    (p below 0.01% for both ROIs in eight of the nine cells), with sensitivities from 1.5% to
    28.4% per 1 kV/cm.
  source: Results, Asymmetric and less-efficient membrane charging by sine waves compared to pulses,
    paragraph 5; Figure 6C
  quote: The oscillations displayed a robust linear correlation with the electric field ... <0.01% for
    both ROIs in eight cells. The regression coefficient, which was the FluoVolt sensitivity to sine
    waves, varied from 1.5% to 28.4%
  statistics:
  - test: linear regression of emission change on electric field strength
    p: 0.0001
    p_relation: "<"
    n: both ROIs in eight of the nine cells
  criterion: Per cell C1 to C9 and ROI 1 and 2 (O1), the 2-kHz beat modulated at 100 Hz (Figure 6C
    legend), dF from the sine wave F0, averaged over sessions, LOESS-subtracted (O2), regressed on
    the field (O3, readings a and b, with and without debris scaling); sensitivity is |slope| in %
    per kV/cm. Reproduced when, under every O2 and O3 reading, both ROIs have p < 0.0001 in at least
    eight cells and every sensitivity lies within 1.35% to 31.2% (1.5% to 28.4% widened by 10% of
    each bound); blocked as methods_underspecified when the readings disagree.
- id: fig6d-sine-less-than-pulse
  statement: Every ROI's sensitivity to sine waves was smaller than to the pulse; averaged over all
    ROIs it was 11.8% plus or minus 1.7% per 1 kV/cm, 42% of the pulse value.
  source: Results, Asymmetric and less-efficient membrane charging by sine waves compared to pulses,
    paragraph 5; Figures 6C and 6D
  quote: All numbers were invariably smaller than those measured for the same ROIs with the pulse (
    Figure 6D ). The electric field sensitivity averaged across all ROIs in all the cells was 11.8% ±
    1.7% per 1 kV/cm, just 42% of the value for the 2-μs pulses
  depends_on:
  - fig6b-pulse-sensitivity
  - fig6c-sine-sensitivity
  expected:
  - quantity: mean sine wave sensitivity over the 18 ROIs
    value: 11.8
    tolerance: 1.7
    unit: percent per kV/cm
  - quantity: mean sine sensitivity over mean pulse sensitivity
    value: 42
    tolerance: 4.2
    unit: percent
  criterion: Sensitivities as in fig6b-pulse-sensitivity and fig6c-sine-sensitivity, with the same
    scaling in both. The Figure 6D legend's "ratio of values in (D) and (C)" is read as sine (C) over
    pulse (B). Reproduced when, under every O2 and O3 reading, the sine to pulse ratio is below 1 in
    all 18 ROIs and both expected values are within tolerance; blocked as methods_underspecified
    when the readings disagree.
- id: threshold-depolarization-estimate
  statement: Combining the sine wave sensitivity (11.8% per kV/cm) with the 2-kHz AP threshold
    (57.7 V/cm) gives a 0.68% emission change, about 6.8 mV at FluoVolt's calibration of about 10%
    per 100 mV, so the threshold depolarization is 5 to 15 mV.
  source: Results, Asymmetric and less-efficient membrane charging by sine waves compared to pulses,
    paragraph 6
  quote: This threshold corresponds to a 0.68% ± 0.11% FluoVolt emission change (11.8 × 57.7/1,000)
    ... a 0.68% emission change corresponds to a 6.8-mV depolarization at the AP threshold
  data: elsewhere
  where: DANDI:001032, 001033, 001034 and 001035 for the threshold (assigned from their titles); the
    sensitivity from this dataset
  depends_on:
  - fig6d-sine-less-than-pulse
  - threshold-2khz-unmodulated
  expected:
  - quantity: emission change at the 2-kHz AP threshold
    value: 0.68
    tolerance: 0.11
    unit: percent
  - quantity: depolarization at the 2-kHz AP threshold
    value: 6.8
    tolerance: 0.68
    unit: mV
  criterion: The product of the mean sine wave sensitivity of fig6d-sine-less-than-pulse and the
    mean threshold of threshold-2khz-unmodulated, divided by 1,000, and that times 10 mV per 1%
    (the calibration of reference 47, as the paper uses it). Reproduced when both are within
    tolerance under one reading of each claim it depends on.
