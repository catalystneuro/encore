# Claims for Knierim, McNaughton & Poe (2000) on dandiset 001754.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-20, as
# the reader of docs/protocol.md (version pilot-10, Reader, steps 1 to 4). The reader has not
# seen the dandiset's data; it read only its title and description on the archive.
#
# Text read. The version of record (Nature Neuroscience 3(3), 211-212), from a PDF supplied by a
# person, as extracted to paper/10.1038-72910.txt. It is a two-page brief communication. It has
# no separate Methods section and no supplement; its methods are stated in the main text and the
# figure legends, and the spatial information measure is cited to Skaggs et al. 1996 (its ref.
# 13). The paper links no code. Its acknowledgements credit analysis software written by
# W. Skaggs and M. Wilson, which is not published with the paper and was not read. The
# dandiset's conversion code (catalystneuro/mcnaughton2000-to-nwb) is not the paper's code and
# fixes no method here. The paper has no section headings, so sources name a body paragraph by
# its opening words; the unheaded first paragraph is called the standfirst.
#
# Data the paper used, as it reports them. Three rats (rats 1, 2 and 3) implanted with a
# multi-electrode recording array (refs. 11, 12), recorded during the Neurolab Space Shuttle
# mission (STS-90, April 1998). In flight the rats ran a three-dimensional track, the Escher
# staircase (three 90 degree yaw turns interleaved with three 90 degree pitch turns), for medial
# forebrain bundle stimulation as reward, mostly clockwise with short counterclockwise runs.
# Preflight, rat 2 ran clockwise on a flat rectangular track (the session of Fig. 2b, 4 days
# before launch); the paper does not say on which track, or when, rats 1 and 3 were recorded
# preflight.
# Flight day 4 (FD4) was the first in-flight exposure to the staircase; rat 3's first session
# that day was lost, and its sessions 2 and 3 followed one another. Flight day 9 (FD9) was the
# second day on the staircase; rats 1 and 2 were recorded. Measured variables are the spikes of
# isolated units, the rat's tracked position (including positions where the head moved off the
# track, which all statistical analyses kept), and hippocampal EEG during baseline sessions in a
# sleeping pouch and during behaviour on FD4 and FD9. Active cells have a mean rate above 0.05 Hz
# on the track. Cell counts are 19 (rat 2), 28 (rat 1) and 24 (rat 3) preflight; 16 (rat 2) and
# 21 (rat 1) on FD9; 7 (rat 3) on FD4. The dandiset's description says it holds preflight and
# FD4 and FD9 recordings, divided into Escher staircase (ES) and Magic Carpet (MC) epochs with
# rate maps, and that the EEG is not included. All claims use the paper's own recordings
# (`data` dataset); none relies on outside data.
#
# What changed from the deprecated file, and why. That file was written from the abstract and
# figure titles only, and its method choices were the agent's. This one is written from the full
# text. flight-spatial-code keeps its id and finding, but is now judged as the paper judges it,
# by comparing spatial information per spike of active cells in flight with the same rat's
# preflight cells (Mann-Whitney), and no longer by a shuffle test the paper does not use. The
# four claims the earlier file dropped are stated in the paper and are restored with their ids
# (si-comparable-to-preflight, fd4-abnormal-selectivity, theta-normal, ripples-normal).
# fig3-stability-across-sessions and three-orthogonal-surfaces keep their ids and findings, with
# criteria rewritten from the paper. New claims are si-rat1-fd9-vs-preflight,
# si-rat3-fd4-vs-preflight and direction-selectivity. The deprecated file's own choices (32 x 32
# bins, 50 spikes, 5 occupancy counts) are not kept, as no source fixes them.
#
# Details the paper leaves open, for the spatial information claims. The measure is Skaggs'
# information per spike (ref. 13), I = sum over bins of p_i (r_i / r) log2(r_i / r), with p_i the
# occupancy probability of bin i, r_i its rate and r the mean rate. The paper gives no bin size,
# smoothing, minimum occupancy, speed filter or minimum spike count, and does not say which
# preflight session gave the preflight values of each rat, or which FD9 session when there was
# more than one. These can change the outcome, so the criteria name readings, and every reading
# is run. Readings of the map (M): (M-a) the rate and occupancy maps the dandiset deposits for
# each epoch, when they are the authors' maps; (M-b) maps recomputed from spikes and position on
# the grid of those deposited maps, without smoothing, with every visited bin kept; where the
# data give no time base, spike counts are divided by the epoch's deposited occupancy map
# (answer of 2026-10-20). Off-track
# positions are kept in both, as the Fig. 1 legend says. Readings of the session (S): (S-a) each
# candidate session on its own; (S-b) for preflight, the session closest before launch (for
# rat 2, the rectangular-track session of Fig. 2b, 4 days before launch). The test's level is
# not printed; the Mann-Whitney test is read as two-sided at p < 0.05, the conventional level,
# and this is named as open. The paper reports means with standard errors but no p-values, so
# its tests are recorded in the criteria and no `statistics` entry is given (the schema needs a
# p-value or an interval).
schema_version: 2
dataset:
  archive: dandi
  id: "001754"
paper: doi:10.1038/72910
claims:
- id: flight-spatial-code
  statement: In flight, after an initial period, hippocampal place cells on the Escher staircase
    showed normal, spatially specific firing, with spatial information per spike not different
    from the same rats' preflight cells.
  source: Main text, paragraph beginning "During the Neurolab Space Shuttle mission", last
    sentence; supported by the paragraphs beginning "Spatial firing patterns of 16 active place
    cells" and "The mean spatial-information content for all 7" and Figures 2a, 2c and 3a; also
    the standfirst
  quote: Nonetheless, place cells eventually demonstrated normal, spatially specific firing
    properties.
  depends_on:
  - si-comparable-to-preflight
  - si-rat1-fd9-vs-preflight
  - si-rat3-fd4-vs-preflight
  criterion: The paper supports this finding by its three comparisons of spatial information per
    spike in flight with the same rat's preflight cells (main text, paragraphs beginning "Spatial
    firing patterns of 16 active place cells" and "The mean spatial-information content for all
    7"), which are the claims this one depends on.
    Reproduced when all three are reproduced; partially reproduced when the two FD9 comparisons
    (rats 1 and 2, the sessions the word "eventually" points to) are reproduced and the FD4
    comparison is not, or when no FD9 comparison is not reproduced and one or more of the three
    is partially reproduced; not reproduced when either FD9 comparison is not reproduced. When a
    dependency is blocked as methods_underspecified, so is this claim, unless the others already
    decide it.
- id: si-comparable-to-preflight
  statement: For rat 2, the spatial information per spike of the 16 active cells recorded on the
    Escher staircase on flight day 9 (1.13 +/- 0.09 bits) did not differ significantly from that
    of its 19 active preflight cells (1.12 +/- 0.08 bits), by Mann-Whitney test.
  source: Main text, paragraph beginning "Spatial firing patterns of 16 active place cells",
    sentences 1 and 3; Figure 2a,b
  quote: An index of spatial tuning specificity ... did not significantly differ between cells
    recorded preflight and those recorded on FD9 (for active cells, defined as having a mean
    firing rate > 0.05 Hz on the track; mean information per spike ± s.e. preflight, 1.12 ± 0.08
    bits, n = 19; FD9, 1.13 ± 0.09 bits, n = 16; not significant by Mann-Whitney)
  expected:
  - quantity: rat 2 FD9 mean spatial information per spike, active cells
    value: 1.13
    tolerance: 0.09
    unit: bits/spike
  - quantity: rat 2 preflight mean spatial information per spike, active cells
    value: 1.12
    tolerance: 0.08
    unit: bits/spike
  - quantity: rat 2 FD9 active cells
    value: 16
    tolerance: 1.6
  - quantity: rat 2 preflight active cells
    value: 19
    tolerance: 1.9
  criterion: From the paper's text. Cells are the active cells of each session, mean firing rate
    above 0.05 Hz over the session on the track (main text), the FD9 cells from the Escher
    staircase session and the preflight cells from the rectangular track (Fig. 2b). The measure is Skaggs'
    information per spike (ref. 13), computed with off-track positions kept (Fig. 1 legend). The
    test is the paper's, a Mann-Whitney test of FD9 against preflight values; the level is not
    printed and is read as two-sided p < 0.05. Tolerances are the paper's standard errors, and
    10% for the counts. Bin size, smoothing, minimum occupancy and which sessions are open; the
    readings M-a and M-b and S-a and S-b of the opening comment are each run. Answers of
    2026-10-20, the paper gives none of these details. The paper compares one index computed the
    same way for both groups, so each comparison with preflight uses the same map reading on both
    sides; a reading that cannot be computed for one side is not run for that comparison, the
    outcome rests on the readings that can be run, and a test of M-b flight values against M-a
    preflight values is a variant, not judged. The paper names no preflight epoch (it does not
    mention ES or MC epochs), so under S-a each preflight epoch is a candidate session; under
    S-b each epoch of the recording day closest before launch is run on its own, the paper
    describing rat 2's preflight cells as recorded on one track, and neither epoch is preferred.
    A claim of absence,
    judged on the paper's test. Reproduced when, under every reading, the test does not find a
    difference and, under at least one reading, both means fall within tolerance; partially
    reproduced when the test finds no difference under every reading but no reading puts both
    means within tolerance; not reproduced when the test finds a difference under every reading;
    blocked as methods_underspecified when the readings disagree on the test. The difference of
    the means and the test's p-value are given under every reading.
- id: si-rat1-fd9-vs-preflight
  statement: For rat 1, the mean spatial information of its 21 active cells on flight day 9
    (1.19 +/- 0.09 bits) did not differ significantly from its preflight cells (1.37 +/- 0.10
    bits, n = 28).
  source: Main text, paragraph beginning "Spatial firing patterns of 16 active place cells",
    sentences 4 and 5; Figure 2c
  quote: We also determined the spatial tuning of 21 active cells from rat 1 on FD9 (Fig. 2c).
    ... did not significantly differ from that rat's preflight data (1.37 ± 0.10; n = 28).
  expected:
  - quantity: rat 1 FD9 mean spatial information per spike, active cells
    value: 1.19
    tolerance: 0.09
    unit: bits/spike
  - quantity: rat 1 preflight mean spatial information per spike, active cells
    value: 1.37
    tolerance: 0.10
    unit: bits/spike
  - quantity: rat 1 FD9 active cells
    value: 21
    tolerance: 2.1
  - quantity: rat 1 preflight active cells
    value: 28
    tolerance: 2.8
  criterion: As for si-comparable-to-preflight, for rat 1. The sentence names no test; it is read
    as the Mann-Whitney test named for rat 2 in the sentence before, the only test the paper
    names. Units are not printed for these means; they are read as bits per spike, as for rat 2.
    The paper says "that rat's preflight data" and does not say these are active cells; the
    0.05 Hz definition given for rat 2 is applied. The paper does not say on which track the
    preflight cells were recorded, so any preflight session is a candidate (S-a), and S-b takes
    the one closest before launch. The same readings are run and the same rule decides the
    outcome.
- id: si-rat3-fd4-vs-preflight
  statement: For rat 3, the mean spatial information of all 7 active place cells on flight day 4
    (1.12 +/- 0.27 bits, session 2) was not different from its preflight cells (1.48 +/- 0.11
    bits, n = 24).
  source: Main text, paragraph beginning "The mean spatial-information content for all 7",
    sentence 1; Figure 3a
  quote: The mean spatial-information content for all 7 active place cells from rat 3 on the
    fourth day of flight (FD4) was 1.12 ± 0.27 bits (Fig. 3a), which was not different from the
    information content measured for this rat's place cells before the flight (1.48 ± 0.11 bits;
    n = 24).
  expected:
  - quantity: rat 3 FD4 mean spatial information per spike, active cells
    value: 1.12
    tolerance: 0.27
    unit: bits/spike
  - quantity: rat 3 preflight mean spatial information per spike, active cells
    value: 1.48
    tolerance: 0.11
    unit: bits/spike
  - quantity: rat 3 FD4 active cells
    value: 7
    tolerance: 0.7
  - quantity: rat 3 preflight active cells
    value: 24
    tolerance: 2.4
  criterion: As for si-comparable-to-preflight, for rat 3. The FD4 cells are from the session of
    Fig. 3a, the second exposure to the staircase that day (the first was lost, Fig. 3 legend).
    The sentence names no test; it is read as the Mann-Whitney test named for rat 2, the only
    test the paper names. The paper says "this rat's place cells" for the preflight value; the
    0.05 Hz definition of active cells given for rat 2 is applied. The paper does not say on
    which track the preflight cells were recorded, so any preflight session is a candidate
    (S-a), and S-b takes the one closest before launch. The same readings are run and the same
    rule decides the outcome.
- id: fig3-stability-across-sessions
  statement: For rat 3 on flight day 4, most of the 7 cells kept the same firing fields in a third
    session that followed the second immediately; the fourth cell lost its field, and a few other
    cells gained a field in session 3.
  source: Main text, paragraph beginning "The mean spatial-information content for all 7",
    sentence 2; Figure 3a,b and legend
  quote: Another recording session followed immediately, and most cells maintained the same firing
    fields in both sessions (Fig. 3b), demonstrating that the spatial tuning was stable across
    different exposures to the track.
  expected:
  - quantity: cells compared across sessions 2 and 3
    value: 7
    tolerance: 0.7
  criterion: The cells are the 7 active cells of session 2 (si-rat3-fd4-vs-preflight), followed
    into session 3 on the same track. The paper judges "the same firing fields" from the maps of
    Fig. 3 and gives no measure, so the measure is open; "most" is read as at least 4 of the 7.
    Readings of keeping a field, each run on the maps of reading M-a and of M-b (opening comment)
    (a) the Pearson correlation of a cell's session 2 and session 3 rate maps, over bins visited
    in both, exceeds the 95th percentile of the correlations between different cells across the
    two sessions; (b) the bin of peak rate in session 3 lies in the session 2 field, taken as the
    bins with at least 20% of the session 2 peak rate (a common field definition, not the
    paper's). "Most" means more than half of the cells shown, the active cells of session 2
    (answer of 2026-10-20); with the paper's 7 cells this is at least 4, and with another count
    of active cells it is more than half of that count, not a count of 4. Cells are paired
    across sessions as the same unit ("the same seven cells", Fig. 3 legend); the paper says
    nothing on how the deposited maps are tied to units, so a pairing through the unit whose
    spike-count map a deposited map best matches is allowed for M-a when each map is tied to one
    unit and no unit to two maps, and is reported with the match; otherwise M-a is not run for
    this claim. Reproduced when more than half of the cells keep their field under every
    reading; not reproduced when half or fewer do under every reading; blocked as
    methods_underspecified when the readings disagree. Which cell lost its field, and the cells silent in session 2
    that gained a field in session 3, are reported but not judged, as the figure's cell order is
    not given in the text.
  depends_on:
  - si-rat3-fd4-vs-preflight
- id: direction-selectivity
  statement: Some cells had place fields only when the rat moved counterclockwise through a
    location, showing the direction selectivity seen on such tracks on Earth.
  source: Main text, paragraph beginning "The rats occasionally turned around on the track",
    sentences 1 and 2
  quote: Some cells demonstrated place fields when the rat was moving only counterclockwise
    through a single location, thus demonstrating the direction selectivity that is seen on such
    tracks under normal terrestrial conditions
  criterion: The paper names no session, cells or measure. Sessions are the in-flight Escher
    staircase sessions with position (FD4 and FD9), active cells as in si-comparable-to-preflight.
    Direction of travel is open; it is read as the sign of the rat's movement along the track's
    circuit, from successive positions, clockwise being the trained direction (main text).
    For each cell and position bin of the maps of reading M-b, rates are computed separately for
    clockwise and counterclockwise samples. A cell has a counterclockwise-only field when, at
    some bin with counterclockwise occupancy, its counterclockwise rate is at least 1 Hz and
    its clockwise spike count there is lower than expected from the counterclockwise rate by a
    one-sided Poisson test at p < 0.05 (the thresholds are standard choices, not the paper's).
    "Some cells" is read as at least two cells over all sessions. Reproduced when at least two
    cells have such a field; partially reproduced when one does; not reproduced when none does.
    The paper gives no method, no time base by direction and no track layout (answer of
    2026-10-20); it allows no reading without time spent per bin in each direction and the
    direction of travel, so when the data lack these the claim is blocked as
    methods_underspecified.
- id: theta-normal
  statement: Hippocampal EEG showed normal theta rhythm during active locomotion, in all rats on
    flight days 4 and 9.
  source: Main text, paragraph beginning "The rats occasionally turned around on the track",
    sentences 3 and 4
  quote: Hippocampal EEG activity was also ... recorded during baseline and behavioral sessions in
    all rats on FD4 and FD9. Although the small number of subjects precluded a statistical
    analysis, they showed normal theta rhythm during active locomotion
  criterion: Needs the hippocampal EEG of the FD4 and FD9 behavioral sessions. The paper reports
    no statistical analysis and no measure of "normal". Read as a peak in the EEG power spectrum
    within the theta band during locomotion that is absent or smaller during immobility.
    Locomotion is read as speed above the session median and the band as 6 to 10 Hz; both are
    standard choices, not given in the paper. Reproduced when every rat and flight day with EEG shows this;
    partially reproduced when some do; not reproduced when none does.
- id: ripples-normal
  statement: Hippocampal EEG showed normal sharp waves and ripples during quiet inactivity in the
    sleeping pouch, on both flight days.
  source: Main text, paragraph beginning "The rats occasionally turned around on the track",
    sentence 4
  quote: they showed normal theta rhythm during active locomotion and normal sharp waves and
    ripples15 during quiet inactivity in the sleeping pouch on both flight days.
  criterion: Needs the hippocampal EEG of the sleeping pouch baseline sessions on FD4 and FD9. The
    paper reports no statistical analysis and no detection method; it cites Buzsaki 1986 (ref. 15)
    for the events. Read as ripple events in the 100 to 250 Hz band, detected where the band
    envelope exceeds its mean by 3 standard deviations during immobility, coinciding with a
    large negative sharp wave in the filtered 0.5 to 30 Hz signal. The band, the threshold and
    the sharp wave filter are standard choices, not given in the paper or by ref. 15 as cited. Reproduced when every rat and flight day with pouch EEG shows such
    events; partially reproduced when some do; not reproduced when none does.
- id: fd4-abnormal-selectivity
  statement: On the first experience of the Escher staircase on flight day 4, place cells of rats
    1 and 2 showed abnormal patterns of spatial selectivity, which differed between the two rats.
  source: Main text, paragraph beginning "It is interesting to note", sentence 1 (given as
    unpublished observations)
  quote: on the first experience on the Escher staircase on FD4, firing of place cells showed
    abnormal patterns of spatial selectivity that differed between rats 1 and 2
  criterion: The paper gives no measure or test for "abnormal"; its only measure of normal
    spatial selectivity is spatial information per spike compared with the same rat's preflight
    cells by Mann-Whitney. Read so (one reading for the comparison, with the map and session
    readings of the opening comment) abnormal is a spatial information of active cells on FD4
    significantly lower than preflight for that rat (two-sided p < 0.05), in each of rats 1 and
    2. As in si-comparable-to-preflight (answers of 2026-10-20), both sides of a comparison use
    the same map reading, and each preflight epoch is a candidate session. Reproduced when this
    holds for both rats under every reading; partially reproduced when it
    holds for one rat; not reproduced when it holds for neither; blocked as
    methods_underspecified when readings disagree. That the patterns differed between the rats
    has no measure in the paper and is reported, not judged.
- id: three-orthogonal-surfaces
  statement: Hippocampal cells formed distinct, reliable representations of position on the
    three orthogonal surfaces of the Escher staircase in microgravity.
  source: Main text, paragraph beginning "It is interesting to note", sentence 2; also the
    standfirst
  quote: Thus hippocampal cells can form unique, reliable representations of position on three
    orthogonal surfaces in microgravity
  depends_on:
  - flight-spatial-code
  - fig3-stability-across-sessions
  criterion: The paper reports no analysis per surface; the finding rests on the spatial
    information and stability results. Read as (i) flight-spatial-code and
    fig3-stability-across-sessions reproduced, and (ii) in each FD9 session (rats 1 and 2), the
    peak-rate bins of the active cells, on maps of readings M-a and M-b, fall on each of the
    track's three surfaces (at least one cell per surface), the surfaces drawn from the track
    outline in the position frame. Reproduced when both hold under every reading; not
    reproduced when (i) fails, that is when either dependency is not reproduced; partially
    reproduced otherwise (a dependency partially reproduced, or (ii) failing for a rat or a
    reading). Whether the code is one three-dimensional map or separate two-dimensional maps is
    left open by the paper and is not judged.
checks:
- date: 2026-10-20
  kind: agent
  model: claude-opus-5-5
  ready: true
  changes:
  - Opening comment, the rectangular preflight track is stated only for rat 2 (Fig. 2b), so the comment no longer says all rats ran it, and reading S-b no longer requires a rectangular-track session.
  - si-rat3-fd4-vs-preflight and fig3-stability-across-sessions, source moved to the paragraph beginning "The mean spatial-information content for all 7" (sentences 1 and 2); the text shows a paragraph break before it, so it is not sentence 6 or the last sentence of the paragraph on rats 1 and 2.
  - flight-spatial-code, source and criterion cite both paragraphs of the comparisons; the outcome rule now covers dependencies that are partially reproduced, which it left undecided.
  - si-rat1-fd9-vs-preflight and si-rat3-fd4-vs-preflight, criterion says the paper does not call the preflight cells of rats 1 and 3 active, nor name their track, and how the criterion reads both.
  - theta-normal, the speed split and the 6 to 10 Hz band are labelled as standard choices, not the paper's.
  - ripples-normal, removed the unsupported statement that 100 to 250 Hz is the band of ref. 15's era; band, threshold and sharp wave filter are labelled as standard choices.
  - three-orthogonal-surfaces, the outcome rule left cases undecided ((ii) failing for both rats, partial dependencies); it now decides every case.
  - Open, direction-selectivity, fig3-stability-across-sessions, fd4-abnormal-selectivity, theta-normal, ripples-normal and three-orthogonal-surfaces rest on measures and thresholds the paper does not give; their criteria name one or two standard readings, and a different reasonable choice could change the outcome.
  - Open, fd4-abnormal-selectivity is given only as unpublished observations; reading "abnormal" as lower spatial information than preflight is one reading of several the text allows (unstable or misplaced fields are others).
  - Open, the Mann-Whitney level and sidedness are not printed; the two-sided p < 0.05 reading stays.
