- id: figs5-arena-excursions
  statement: During about 20 min of arena exploration, BF gamma made on average eight brief
    excursions into the home-cage range, lasting 8 to 44 s (16 +/- 8 s), with a clear rise in
    gamma power (0.56 +/- 0.27) and no change in theta power (-0.01 +/- 0.82) relative to 4 to 8 s
    before the peak.
  source: SI, Analysis of Excursions to DMN Brain State During Arena Exploration, paragraph 2;
    Fig. S5
  quote: We found on average eight excursions during the 20 min spent in the arena, corresponding
    to about one excursion every 2–3 min. Excursions lasted between 8 and 44 s, with an average
    duration of 16 ± 8 s. Based on a comparison of LFP power at the gamma peak to the average
    values 4–8 s before the peak, gamma transitions were associated with clear increases in gamma
    power (0.56 ± 0.27, paired t tests... but no concomitant significant modulations in theta
    power (−0.01 ± 0.82, paired t tests... P > 0.1) were found.
  statistics:
  - about: gamma power at the peak against 4 to 8 s before
    test: paired t tests
    p: 0.001
    p_relation: "<"
    n: six rats
  - about: theta power at the peak against 4 to 8 s before
    test: paired t tests
    p: 0.1
    p_relation: ">"
    n: six rats
  expected:
  - quantity: excursions per arena session (about 20 min)
    value: 8
    tolerance: 0.8
  - quantity: mean excursion duration
    value: 16
    tolerance: 8
    unit: s
  - quantity: gamma power increase at the excursion peak
    value: 0.56
    tolerance: 0.27
  - quantity: theta power change at the excursion peak
    value: -0.01
    tolerance: 0.82
  criterion: From the SI. Gamma power of 2-s epochs smoothed with a boxcar of length 3; threshold
    at the intersection of the home-cage and arena gamma histograms (Fig. S3; 2.6 in the example);
    an excursion is a run of smoothed gamma above threshold, its duration the time above
    threshold; peak values taken from the unsmoothed data, compared with the mean of the epochs 4
    to 8 s before the peak. Open, (1) the histogram bins that set the intersection, with readings 20
    equal bins over the pooled range as a standard choice, and a kernel density crossing as the
    variant; (2) the power scale, as the paper's units are not stated and 2.6 and 0.56 cannot be
    placed on a scale without them, with readings raw power, log10 power, and power normalized to the
    rat's mean; (3) which arena data, as the SI gives about 20 min while a session lasts 10 min
    and the Fig. S4 legend calls its sample a 10-min recording, with readings the two sessions
    taken together (counts summed, about 20 min) and each session on its own (count doubled to
    20 min). The paired test "P << 0.001" is
    recorded as p < 0.001. Reproduced when, under one reading, the mean count and duration are
    within tolerance (10% for the count, the reported spread for the duration), durations fall
    within 8 to 44 s widened by 10%, the gamma increase is significant at p < 0.05 and the theta
    change is not (p > 0.1, absence judged on the paired t test). The 0.56 and -0.01 values are
    compared only under a reading whose scale puts the threshold near 2.6; otherwise they are
    reported and not judged. Partially reproduced when the gamma and theta tests hold and the count or duration
    does not.
