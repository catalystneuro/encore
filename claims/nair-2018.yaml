  source: Results, BF Gamma Deactivation During Exploration, paragraph 1; Figure 3A
  quote: The main finding of the present study is a striking (35 ± 3%) and highly significant
    (paired t test, P < 10−5) reduction of this BF gamma activity when rats were transferred from
    their home cage to a novel, empty arena which they explored during a 10-min interval (Fig. 3A).
  statistics:
  - test: paired t test
    p: 0.00001
    p_relation: "<"
    n: 22 hemispheres
  expected:
  - quantity: reduction of BF gamma power, arena relative to home cage
    value: 35
    tolerance: 3
    unit: percent
  criterion: Gamma power is the mean of the epoch power spectrum from 30 to 80 Hz (SI Materials
    and Methods), per epoch, averaged over the epochs of a recording. The paper does not say how
    the percentage is formed. Readings, (a) the mean over recordings of 100 x (1 - arena / home
    cage); (b) 100 x (1 - mean arena / mean home cage) over the group means. Tolerance is the
    reported spread (35 +/- 3%; the paper does not name it, SEM by its usage in Behavioral
