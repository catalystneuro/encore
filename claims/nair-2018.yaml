- id: figs3-unimodal-states
  statement: Within each condition, the distributions of BF theta and gamma power over 2-s epochs
    were unimodal, with no evidence of substates, in each of six rats.
  source: SI, Distributions of Theta and Gamma Power Within Each State Are Unimodal, paragraph 1;
    Fig. S3
  quote: These results were confirmed (at P > 0.1) in a total of six animals, in total yielding no
    evidence for multimodality in either behavioral state or frequency band.
  statistics:
  - test: Hartigan dip test
    p: 0.1
    p_relation: ">"
    n: six rats
  criterion: A claim of absence, judged on the Hartigan dip test of the 2-s epoch theta (6 to 10
    Hz) and gamma (30 to 80 Hz) powers, per rat, condition and band, about 20 min of data each.
    Reproduced when every test gives p > 0.1; not reproduced when any gives p < 0.05; the dip
    statistics are reported either way. Which data per rat is open. The SI gives about 20 min per
    condition, while an arena session lasts 10 min (SI Materials and Methods) and the Fig. S4
    legend calls its sample a 10-min recording. Readings, (a) the two sessions of a condition
