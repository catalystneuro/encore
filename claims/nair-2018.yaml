  source: SI, Low-Frequency Power Modulations in Home Cage and Arena, paragraph 2; Fig. S2
  quote: A similar pattern is observed in ACC, where gamma, beta, and delta power are enhanced in
    the home cage but theta power is not significantly different in the two environments. In the
    VC the strongest effect is related to enhanced theta power in the arena; the only other
