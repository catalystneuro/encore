# Claims for Nair, Klaassen, Arato, Vyssotski, Harvey & Rainer (2018), PNAS 115:1352-1357, on
# CRCNS data set bf-1.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-06,
# protocol as stated in docs/protocol.md (Reader, version pilot-13).
#
# Text read: the version of record, as supplied under paper/ (PyMuPDF text of the journal PDF),
# with its Results, figure legends and short Materials and Methods, and the supplement
# (pnas.201712431si.pdf: SI results on low-frequency power, unimodality, excursions and
# locomotion, SI Materials and Methods, and the legends of Figs. S1 to S7). The Methods that
# fix the analyses are in the SI Materials and Methods. The paper links no analysis code, so none
# was read; it names the toolboxes used (Wave_clus, CircStat, Chronux, BSMART, MVGC, SPSS). No PDF
# renderer was available, so figures were read from their legends and the Results only. The
# extracted text prints one p-value as "P < 0.0" (ACC gamma, Results, Gamma Oscillations in BF
# Cortical Projection Targets); it is recorded as printed.
#
# Data the paper used. Adult male Long Evans rats, 80 to 120 days old. 16 rats implanted with
# tungsten microelectrodes in the BF (AP -0.8, ML 2.8, DV -8.2 mm from bregma), 14 of them also in
# the VC and 8 in the ACC; 22 BF hemispheres in the group analyses; 4 more rats with bipolar BF
# electrodes. LFPs were recorded with a head-mounted Neurologger 2A (four LFP channels at 1.6 kHz,
# and a 3D accelerometer for movement), and in tethered recordings (TDT RZ5) LFP at 1.6 kHz with
# single units at 24 kHz (49 BF neurons in six rats). Conditions: home cage; exploration of a novel
# empty 70 x 70 cm arena in two 10-min sessions a day for 3 days, 45 min apart, with the rat back
# in the home cage between them; on day 4, arena exploration with two identical objects. Behavior
# (exploration, grooming, quiet wakefulness) was scored from video in seven rats. Measured
# variables: LFP power spectra, gamma power (30 to 80 Hz), movement-sensor values, BF-cortex
# coherence and Granger causality, spike phase locking.
#
# The CRCNS data set, by its title and data description, holds BF LFP from six rats at 400 Hz,
# in consecutive 2-s segments of 800 samples with artifact segments removed, a movement-sensor
# value per segment (mean acceleration), and two sessions each of the 'Hcage' and 'Arena'
# conditions per rat. It is described as the data of this paper. By that description it holds
# no ACC or VC channels, no spikes, no object sessions and no behavior scoring; the claims that
# need those are kept, as the paper's findings, and the author finds whether the data set holds
# their data. The six rats match the six-rat SI analyses of excursions and unimodality (Figs.
# S3 to S5, about 20 min each of arena and home cage).
#
# Method details from the SI Materials and Methods, used by every LFP claim below unless it says
# otherwise: LFPs down-sampled to 400 Hz and cut into 2- or 10-s epochs; epochs rejected when
# their peak-to-peak amplitude exceeds the median plus 1 SD (1 to 4% rejected); power spectrum of
# each epoch by fast Fourier transform; gamma power is the mean of the power spectrum between 30
# and 80 Hz; for the movement analysis the accelerometer data are split into quartiles and the
# mean gamma power of each quartile is averaged across animals.
#
# Details the paper leaves open that apply to many claims, with the readings it allows:
# - Epoch length: 2-s or 10-s epochs, as the Methods name both. The data set's segments are 2 s,
#   so 2-s epochs are the main reading and 10-s epochs (five consecutive segments) the variant.
# - Artifact rejection: the data set's segments are already cleaned. Readings: (a) the segments
#   as delivered; (b) the paper's rule (peak-to-peak above median plus 1 SD, per file) applied
#   again.
# - FFT details (window, detrending, scaling) are not given. A plain periodogram of each epoch
#   (squared magnitude of the FFT, no taper) is used as a standard choice; it cannot change a
#   ratio or a paired comparison of the same measure. Whether the 30 and 80 Hz bins are included
#   is a standard choice (both included).
# - The unit of pairing: the paper pairs hemispheres (n = 22) or animals; the data set gives one
#   BF signal per rat and session, so tests run over rats (n = 6), with the two sessions of a
#   condition (a) averaged per rat, or (b) kept as separate pairs (session 1 with session 1).
