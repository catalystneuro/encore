- id: fig6d-trivariate-granger
  statement: Trivariate Granger causality analyses in rats with BF, VC and ACC electrodes showed
    BF-to-cortex directionality, stronger to the ACC than to the VC and in the home cage than in
    the arena.
  source: Results, Gamma Oscillations in BF Cortical Projection Targets, paragraph 2; Figure 6D
  quote: These findings illustrate BF→cortex directionality of interactions and the specificities
    in terms of cortical region, i.e., ACC over VC, as well as behavioral state, i.e., home cage
