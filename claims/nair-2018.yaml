    test: paired t test
    p: 0.00000001
    p_relation: "<"
  criterion: Needs VC recordings, which the data set's description does not list. The absence is
    judged on the paper's paired t test of 40 to 60 Hz power (p > 0.1 reproduced, p < 0.05 not);
    the high-gamma part holds when the paired t test of 60 to 100 Hz power gives p < 0.05 with
    arena higher. The absence of rapid switching rests on the Figure 6A insets alone and the paper
    gives no measure or test for it; the reading used is that of fig3d-rapid-switch-to-home-cage
    (a), VC gamma in the first minute after transfer against the last minute before it, and this
    part holds when that paired t test gives p > 0.05.
- id: fig6b-coherence
  statement: Gamma coherence with the BF was greater for the ACC than for the VC, and for both
    areas it was higher in the home cage than in the arena.
  source: Results, Gamma Oscillations in BF Cortical Projection Targets, paragraph 1; Figure 6B
  quote: We found that coherence at gamma frequencies was greater between the BF and ACC than
    between the BF and VC across behavioral conditions (two-way ANOVA... Additionally, for both
    cortical areas, coherence with the BF was elevated in the home cage compared with the arena
    (two-way ANOVA
  statistics:
  - about: BF-ACC against BF-VC
    test: two-way ANOVA
    p: 0.01
    p_relation: "<"
    n: four animals
  - about: home cage against arena
    test: two-way ANOVA
    p: 0.01
    p_relation: "<"
    n: four animals
  criterion: Needs ACC and VC recordings. Coherence from an autoregressive model of order 15 on
    normalized, detrended 2-s epochs (BSMART), area under the curve from 40 to 60 Hz,
    repeated-measures ANOVA (SI Materials and Methods). Reproduced when both main effects give
    p < 0.05 in the stated direction.
- id: fig6c-granger-bf-to-acc
  statement: During BF gamma bursts, gamma-band Granger causality was stronger from the BF to the
    cortex than in reverse, stronger to the ACC than to the VC, and stronger in the home cage
    than in the arena.
  source: Results, Gamma Oscillations in BF Cortical Projection Targets, paragraph 2; Figure 6C
  quote: directional interactions were stronger in the corticopetal than in the corticofugal
    direction for both the ACC and VC (two-way ANOVAs, main effects of direction... However,
    directional interactions to the ACC were significantly larger than to the VC (two-way ANOVA,
    main effect of pathway... as well as being more pronounced in the home cage than in the arena
    (two-way ANOVAs, main effect of location
  statistics:
  - about: corticopetal against corticofugal
    test: two-way ANOVAs, main effect of direction
    p: 0.01
    p_relation: "<"
    n: seven animals (bivariate)
  - about: to ACC against to VC
    test: two-way ANOVA, main effect of pathway
    p: 0.05
    p_relation: "<"
    n: seven animals (bivariate)
  - about: home cage against arena
    test: two-way ANOVAs, main effect of location
    p: 0.016
    p_relation: "<"
    n: seven animals (bivariate)
