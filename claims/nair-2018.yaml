- id: figs2-bf-low-frequency-bands
  statement: In the BF, delta and beta power, like gamma, were higher in the home cage than in the
    arena, while theta power was strongly suppressed in the home cage.
  source: SI, Low-Frequency Power Modulations in Home Cage and Arena, paragraph 2; Fig. S2
  quote: In the BF, in addition to the gamma enhancement in the home cage, beta and delta
