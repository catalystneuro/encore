- id: fig3bc-psd-peaks
  statement: >-
    ON and OFF cells show clear low-frequency spectral peaks, often with harmonics, at a period
    of about five minutes (ON 286.86 s, FWHM 16.92 s; OFF 298.33 s, FWHM 16.12 s).
  source: Results, RVM ON- and OFF-cells exhibit slow quasi-periodic structure during ongoing activity, paragraph 2; Figure 3b and 3c
  quote: >-
    Both ON- and OFF-cells exhibited clear ... low-frequency spectral peaks, often accompanied by
    har ... istic period of approximately five minutes (TON ... peak = 286.86 ... s, full width at
    half maximum (FWHM) = 16.92 s; TOFF ... 298.33 s, FWHM = 16.12 s)
  depends_on:
  - ongoing-cell-counts
  expected:
  - quantity: ON peak period
    value: 286.86
    tolerance: 28.686
    unit: s
  - quantity: ON FWHM
    value: 16.92
    tolerance: 1.692
    unit: s
  - quantity: OFF peak period
    value: 298.33
    tolerance: 29.833
    unit: s
  - quantity: OFF FWHM
    value: 16.12
    tolerance: 1.612
    unit: s
  criterion: >-
    As Panel_3.ipynb and the supplement ("Spike train power spectra"): each cell's 1500 s segment
    (ongoing-cell-counts) binned at 5 ms, its periodogram with a Hann window over one segment,
    zero-padded (the code's FFT length is 50 times the spike count of the first ON cell, a
    resolution of 1.65e-4 Hz), DC removed, normalized to unit area
    (get_auto_correlation_freqs_with_rate); the class PSD is the mean over cells; the peak is
    the highest local maximum of the mean PSD between 0.0001 and 0.1 Hz
    (get_summary_psd_stats), and the period its inverse. The FWHM is computed per cell with
    scipy peak_widths at half height on the highest peak between 0.5 and 1.95 times the class
    peak frequency, and averaged over cells, in Hz. The paper reports the FWHM in seconds
    without saying how it was converted; the readings are (a) FWHM_Hz / f_peak squared, (b)
    1/(f_peak - FWHM_Hz/2) - 1/(f_peak + FWHM_Hz/2), (c) the same as (b) from the half-height
    width of the mean PSD. The code's stored results (fwhm_results_ON.pkl, fwhm_results_OFF.pkl)
    give peaks at 288.9 s and 303.3 s and FWHMs of 2.13e-4 and 1.23e-4 Hz (about 17.8 and 11.4 s
    under reading b), which do not all match the text. The supplement ("Spike train power
    spectra", paragraph 3) describes a further estimate, which is also a reading: hierarchical
    bootstrapping at the rat level, N rats (the number in the class) resampled with replacement
    with all their cells, the mean PSD per iteration, its highest peak and that peak's FWHM
    taken per iteration, 1000 iterations; the period and FWHM are then the mean over iterations,
    with the FWHM in seconds under readings (a) and (b). Reproduced when both periods are within
    tolerance and the FWHMs match, under one reading; partially reproduced when only the periods
    do. Whether peaks near 600 s and 150 s (harmonics) are present is reported.
- id: fig3d-neutral-psd
  statement: >-
    NEUTRAL cells lack consistent low-frequency spectral peaks and instead show broad
    low-frequency components and prominent power above 10 Hz, reflecting regular tonic firing.
  source: Results, RVM ON- and OFF-cells exhibit slow quasi-periodic structure during ongoing activity, paragraph 2; Figure 3d
  quote: >-
    lacked consistent spectral peaks, instead showing broad low ... frequency components and
    prominent high-frequency power ... (> 10 Hz), reflecting regular, tonic firing
  depends_on:
  - fig3bc-psd-peaks
  criterion: >-
    As fig3bc-psd-peaks, for the 32 NEUTRAL cells over their whole recordings (Panel_3.ipynb
    uses all NEUTRAL spike trains uncut; the supplement gives their lengths as 960 s and about
    3000 s, zero-padded for a common grid). The paper does not define "consistent"; the reading
    used is the code's: the peak search of fig3bc-psd-peaks on the NEUTRAL mean PSD, and the
    per-cell peak frequencies between 0.5 and 1.95 times the ON peak frequency. Reproduced when
    the NEUTRAL mean PSD has no local maximum between 0.0025 and 0.0045 Hz (periods 220 to 400 s)
    that exceeds the median of the mean PSD over 0.001 to 0.01 Hz by more than its ON-cell
    counterpart's ratio divided by 2, and the NEUTRAL mean PSD has local maxima above 10 Hz that
    the ON and OFF mean PSDs lack. The bounds 220 to 400 s and the factor 2 are not in the paper
    and are named as open; the NEUTRAL peak the code finds (stored at 3.05e-4 Hz, beyond the
    window) and the spectra above 10 Hz are reported.
