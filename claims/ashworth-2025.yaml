- id: figs8-null-model-worse
  statement: >-
    A null model with a constant mean spike count fits significantly worse than every piecewise model, for ON
    and for OFF cells, so both an evoked departure and a recovery are needed.
  source: Results, Evoked ON/OFF activity unfolds over multiple timescales, paragraph 2; Supplementary Figure S8
  quote: Both null models clearly performed worse than either of the parametric fits.
  depends_on:
  - fig2-trial-counts
  criterion: >-
    The null model is build_mean_model of bayesian_cell_models.py (notebooks 20 and 27), fitted to
    the same summed counts. Each model is sampled as the Methods give it (NUTS in PyMC, 4 chains,
    1000 tuning steps, 1000 draws; target_accept 0.8 from sample_model) and compared by the
    expected log predictive density. The paper names ELPD without fixing the estimator: the
    model comparison plots use PSIS-LOO (plot_loo_comparison; notebook 23 prints LOO and WAIC,
    notebook 17 WAIC), so both are readings. Its word "significantly" is not defined; the
    readings are that the null model's ELPD is below each piecewise model's by more than (a) one
    or (b) two standard errors of the difference (dse of arviz.compare). Reproduced when, for
    each cell type, the null model is below every piecewise model of that type under one reading
    of each. The paper's notebooks print ELPD-LOO -11683 for the ON null against -7215 and -7454,
    and -9237 for the OFF null against about -6265 (difference 2972, dse 124).
