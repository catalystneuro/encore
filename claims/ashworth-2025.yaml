# Claims for Ashworth, Martenson, Shi, De Preter, Heinricher & Mancini, "Multi-timescale dynamics
# organize descending pain modulation" (bioRxiv doi:10.64898/2025.12.15.693905; the task names it
# "Multi-timescale Rhythmic Dynamics in Rostral Ventromedial Medulla Neurons", the title of its code
# repository), on dandiset 001708.
#
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21, protocol
# as stated in docs/protocol.md (version pilot-10).
#
# Text read: the bioRxiv preprint, version 4 (posted June 4, 2026), from a PDF supplied by a person,
# with its Supplementary Information (one supplement PDF, 13 pages: Tables S1 to S11, Figures S1
# to S11, and the notes "Spike train power spectra", "Technicalities of GP fitting", "Gaussian CDF
# Fits" and "Coherence vs correlation"). All in paper/10.64898-2025.12.15.693905.txt. The main text
# carries line numbers inside its sentences, so quotes are cut with "..." where a line number falls.
#
# Code read: github.com/nox-lab/multi-timescale-rhythmic-dynamics-in-rvm-neurons at commit
# e12f3ee771f4b5506e5db0bac09762ba6044a4d6 (2026-10-11; the paper cites the Zenodo deposit
# doi:10.5281/zenodo.20528906 of this repository). It holds the package rvm_analysis (data loading
# from the NWB files by their "protocol" field, trial cutting in Spike2Tools.py, the PyMC models in
# bayesian_cell_models.py, the GPyTorch models in non_poisson_gpytorch_model.py, multitaper
# coherence, bootstrapping), the package spike2neo, and notebooks with their outputs:
# notebooks/Bayesian_trial_function_fits (18, 18a, 19, 20, 21, 21a, 22, 24, 27, 28, 29 fit the
# models; 17 and 23 compare them), notebooks/gpytorch_models (GP_period_scoping,
# Poisson_GP_main_fit_notebook, bootstrap_R2_across_animals, results/gen_pois_no_exp with the
# fitted per-cell parameters in combined_data.csv), notebooks/Panels (Panel_1 PSTHs, Panel_3 power
# spectra and CV/ISI, Panel_4 Table 1, ongoing_CV_isi_table, 07_mt_sig_test_phase_shifts coherence)
# and notebooks/Supplementary_Analyses (phase_analysis for Figure S2). No code for the heart-rate
# power spectrum of Figure 6d was found. Notebook outputs are cited below where they bear on a
# criterion; they are the paper's outputs, not results of this attempt.
#
# Data the paper describes. Sprague-Dawley rats (Methods: 77 male and 6 female, 191 to 348 g),
# lightly anesthetized with methohexital, single-unit extracellular recordings in the RVM, each
# unit classed as ON, OFF or NEUTRAL from its response at paw withdrawal. Events: heat onset
# (ramp from 36 to 53 C over 11 s, at about 5 min intervals, ended at withdrawal), paw
# withdrawal, a noxious pinch in some recordings, and EKG beats. Two protocols (Methods,
# Experiments): "evoked", 104 cells in 53 animals (45 ON, 35 OFF, 24 NEUTRAL), heat trials every
# 5 min over 16 to 18 min; and "ongoing", 62 cells in 30 animals (25 ON, 25 OFF, 12 NEUTRAL), about
# 30 min of unstimulated activity after an initial classifying trial, with at least two trials at
# the end. Table S11 groups the same cells in three sets, as the code reads them from the NWB
# "protocol" field: "Evoked" (45 ON, 35 OFF, 4 NEUTRAL), "Evoked/Ongoing" (20 NEUTRAL, 960 s
# recordings with trials every 5 min, used both for trial and ongoing analyses) and "Ongoing" (25
# ON, 25 OFF, 12 NEUTRAL); its animal counts (35, 18, 50; total 103) disagree with the Methods (53
# and 30; 83 rats), and the code's outputs report 101 NWB files. All evoked analyses pool cells
# and trials from all three sets (70 ON, 60 OFF, 36 NEUTRAL cells); the ongoing analyses use the
# Ongoing and Evoked/Ongoing sets (25 ON, 25 OFF, 32 NEUTRAL). Measured variables: spike times,
# heat-onset, withdrawal and pinch times, EKG beat times.
#
# Method choices fixed from the code where the paper is silent are given in each criterion, with
# the file they come from. Where the Methods and the code disagree the Methods are the main
# reading and the code a variant, except where the Methods' value cannot produce the reported
# result, which is said where it applies.
