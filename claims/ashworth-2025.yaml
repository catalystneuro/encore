- id: fig5c-dispersion
  statement: >-
    ON and OFF cells have positive dispersion parameters (ON 0.63 ± 0.25, p = 0.0011; OFF 0.36 ±
    0.53, p = 0.0105), consistent with bursty over-dispersed firing, while NEUTRAL cells have
    negative dispersion (-0.9 ± 0.63, p < 0.001), firing more regularly than Poisson.
  source: Results, A Poisson Gaussian process predicts slow quasi-periodic fluctuations in ongoing RVM firing, paragraph 5; Table 1; Figure 5c; Supplementary Figure S5
  quote: >-
    ON- and OFF-cells exhibited positive dispersion parameters ... (α > 0; pON = 0.0011, pOFF =
    0.0105), consistent with ... showed negative dispersion (pNEUTRAL < 0.001)
  statistics:
  - about: ON dispersion alpha
    test: two-sided sign-flipping permutation test within animals
    p: 0.0011
    n: 25 ON cells
  - about: OFF dispersion alpha
    test: two-sided sign-flipping permutation test within animals
    p: 0.0105
    n: 25 OFF cells
  - about: NEUTRAL dispersion alpha
    test: two-sided sign-flipping permutation test within animals
    p: 0.001
    p_relation: "<"
    n: 32 NEUTRAL cells
  depends_on:
  - fig5b-train-r2
  expected:
  - quantity: ON alpha, mean over cells
    value: 0.63
    tolerance: 0.25
  - quantity: OFF alpha, mean over cells
    value: 0.36
    tolerance: 0.53
  - quantity: NEUTRAL alpha, mean over cells
    value: -0.9
    tolerance: 0.63
  criterion: >-
    The fitted dispersion alpha of fig5b-train-r2 per cell; the sign-flip permutation test of
    fig5b-train-r2 on alpha (10000 permutations, Figure S5; the notebook seeds 1). Reproduced
    when ON and OFF have p < 0.05 with positive medians, NEUTRAL has p < 0.05 with a negative
    median, and the three means are within the stated spread.
- id: table1-latent-variance-order
  statement: >-
    The latent GP variance separates the classes; ON cells have the largest modulation amplitude
    (outputscale 17 ± 26), OFF cells intermediate (3.1 ± 4) and NEUTRAL cells a near-flat latent
    structure (0.1 ± 0.2).
  source: Results, A Poisson Gaussian process predicts slow quasi-periodic fluctuations in ongoing RVM firing, paragraph 5; Table 1
  quote: >-
    cells showed the largest modulation amplitude, OFF-cells ... intermediate variance, and
    NEUTRAL-cells near-flat latent
  depends_on:
  - fig5b-train-r2
  expected:
  - quantity: ON outputscale, mean over cells
    value: 17
    tolerance: 26
  - quantity: OFF outputscale, mean over cells
    value: 3.1
    tolerance: 4
  - quantity: NEUTRAL outputscale, mean over cells
    value: 0.1
    tolerance: 0.2
  criterion: >-
    The fitted kernel outputscale of fig5b-train-r2 per cell. The paper states the ordering of
    the class means and no test. Reproduced when the class means order ON > OFF > NEUTRAL and are
    within the stated spread; the class medians, whose order may differ given the spread, are
    reported.
- id: fig5d-phase-profiles
  statement: >-
    Single-cycle phase-normalized reconstructions of the GP fits show cell-specific oscillatory
    signatures in ON and OFF cells, while NEUTRAL cells have near-constant phase profiles.
  source: Results, A Poisson Gaussian process predicts slow quasi-periodic fluctuations in ongoing RVM firing, paragraph 6; Figure 5d
  quote: >-
    revealed cell-specific oscillatory signatures in ON ... and OFF-cells, whereas NEUTRAL-cells
    showed near ... constant phase profiles
  depends_on:
  - fig5b-train-r2
  criterion: >-
    The Figure 5 legend says the panel shows the GP rates "phase aligned" and "adjusted for found
    period length"; the paper gives no further method and no test, and the code for the panel
    was not checked here. Reading, named as open: for each cell, the predicted rate of its GP fit
    of fig5b-train-r2 over one fitted period, on a phase grid from 0 to 1 with zero phase at the
    fit's maximum (as get_phase of figs2-phase-latency); the modulation depth is (maximum minus
    minimum) over the mean of that cycle. Reproduced when the median depth of NEUTRAL cells is
    below the medians of both ON and OFF cells; the per-cell depths and profiles are reported.
    The comparison and the depth measure are not in the paper.
- id: fig6c-coherence-counts
  statement: >-
    A subset of cells of every class shows significant low-frequency coherence with heart rate
    (5 of 32 NEUTRAL, 4 of 25 OFF, 8 of 25 ON).
  source: Results, Low-frequency coherence between RVM activity and heart rate, paragraph 3; Figure 6b and 6c
  quote: >-
    A subset of cells (5/32 NEUTRAL, 4/25 OFF, 8/25 ON) ... showed significant low-frequency
    coherence with heart rate
  depends_on:
  - ongoing-cell-counts
  expected:
  - quantity: NEUTRAL cells with significant coherence
    value: 5
    tolerance: 0.5
  - quantity: OFF cells with significant coherence
    value: 4
    tolerance: 0.4
  - quantity: ON cells with significant coherence
    value: 8
    tolerance: 0.8
  criterion: >-
    As the Methods (Coherence estimation) and 07_mt_sig_test_phase_shifts.ipynb: for each cell,
    its spikes and the EKG beats of its recording over the cell's ongoing segment (ON, OFF and
    ongoing NEUTRAL 1500 s segments of ongoing-cell-counts; evoked/ongoing NEUTRAL whole 960 s;
    the Methods say only "the recording", so each cell's whole recording is a second reading),
    each binned at 2 s; 500 s segments with 50% overlap, each demeaned; multitaper spectra with
    DPSS tapers, NW 3.5, K 6, and the magnitude-squared coherence averaged over segments; 1000
    surrogates with the heart-rate segments phase-randomized (seed 1); the threshold is the 99.9th
    percentile of the surrogates' maximum coherence over all frequencies (max-statistic, alpha
    0.001). A cell is coherent when its coherence exceeds the threshold at any frequency, as the
    code counts (the code does not restrict the frequency; the Results say "low-frequency"; the
    count restricted to below 0.01 Hz is shown as a variant). Tolerance 10% of each count, so the
    counts must match exactly; reproduced when all three do under one reading, partially reproduced when each is
    within 2 of the paper's. Because the surrogates are random, the counts at three other seeds
    are reported.
- id: fig6d-heart-rate-peaks
  statement: >-
    Peak coherence frequencies do not match the ~300 s period exactly, but the heart-rate power
    spectrum has peaks at multiples of this period.
  source: Results, Low-frequency coherence between RVM activity and heart rate, paragraph 3; Figure 6d
  quote: >-
    spectral peaks in heart rate were observed at ... multiples of this period (Figure 6d)
  depends_on:
  - fig3bc-psd-peaks
  criterion: >-
    The heart-rate spectrum is described in the supplement ("Spike train power spectra", last
    paragraph: computed by bootstrapping "in the same manner as for the cells", one heart rate
    per animal) and the Figure 6 legend ("Combined averaged heart rate power spectrum over all
    animals"); no code for it was found in the repository, and the paper does not say whether
    the EKG beats are treated as a point process or converted to a rate, which segments are used,
    or what "multiples" means (periods of 600 and 900 s, or frequencies of 2 and 3 times 1/300
    Hz). Readings: the EKG beat train of each ongoing and evoked/ongoing recording (one per
    animal), (a) as a spike train over the same 1500 s segment and (b) over the whole recording,
    with the PSD method of fig3bc-psd-peaks; the mean over animals; a "peak at a multiple" is a
    local maximum within 10% of 600 or 900 s (subharmonics) or of 150 or 100 s (harmonics).
    Reproduced when, under one reading, at least one such peak is the highest peak below 0.01
    Hz; the lowest-frequency peak (marked in Figure 6d) is reported. The rule "highest peak
    below 0.01 Hz" is not in the paper and is named as open. The first part of the statement is
    reported, not judged: the frequency of peak coherence of each coherent cell of
    fig6c-coherence-counts, against 1/300 Hz.
- id: figs2-phase-latency
  statement: >-
    Withdrawal latency shows no systematic relation to the predicted firing rate or oscillatory
    phase of the ON and OFF GP fits at stimulus onset.
  source: Supplementary Information, Ongoing activity phase did not affect withdrawal latency, paragraph 4; Supplementary Figure S2d to S2f; Discussion, paragraph 4
  quote: >-
    As shown in Supplementary Figure S2d,e,f, there was no systematic relationship between
    normalized withdrawal latency and either predicted firing rate or oscillatory phase at
    stimulus onset.
  depends_on:
  - fig5b-train-r2
  criterion: >-
    As phase_analysis.ipynb: for each ON and OFF cell of the ongoing files, its GP fit of
    fig5b-train-r2 extrapolated to the heat onsets of its whole recording; the predicted count
    per bin normalized between the minimum and maximum of that fit; the phase from the fitted
    period with zero phase at the fit's maximum (get_phase); latencies (withdrawal minus heat
    onset) z-scored per cell. A claim of absence, but the paper only inspects the plots and
    states no test, so the test is named as open: Spearman correlation of normalized latency
    with normalized predicted rate, and a circular-linear correlation of latency with phase,
    each for ON and OFF trials pooled within class, two-sided at p < 0.05. Reproduced when none
    of the four is significant; not reproduced when any is. The correlations and the number of
    trials are reported.
- id: methods-withdrawal-latency
  statement: >-
    The heat ramp was ended at paw withdrawal, with mean withdrawal latency 8.7 ± 1.1 s (mean ±
    SD) and withdrawal temperature 49.0 ± 2.0 C.
  source: Methods, Experiments, paragraph 2
  quote: >-
    temperature: 49.0 ± 2.0 °C, latency: 8.7 ± 1.1 s)
  expected:
  - quantity: withdrawal latency, mean
    value: 8.7
    tolerance: 1.1
    unit: s
  criterion: >-
    Latency is the time from each heat onset to the next withdrawal, when the withdrawal comes
    before the next heat onset (the pairing of Spike2Tools.get_tail_to_heat_lengths). The paper
    does not say over which trials the mean is taken; the readings are (a) all paired trials of
    all files, (b) the mean of per-animal means. Reproduced when, under one reading, the mean is
    within the stated SD. The temperature is tested only if the dataset holds it; otherwise that
    part is reported as not tested.
- id: methods-heart-rate
  statement: >-
    Heart rate, from the EKG, was 391.1 ± 34.4 bpm (mean ± SD across animals).
  source: Methods, Experiments, paragraph 1
  quote: >-
    was 391.1 ± 34.4 bpm, with mean range over the protocol
  expected:
  - quantity: heart rate, mean
    value: 391.1
    tolerance: 34.4
    unit: bpm
  criterion: >-
    Heart rate from the EKG beat times of each recording as 60 over the mean inter-beat interval.
    The paper does not fix the averaging; the readings are (a) per recording, then mean and SD
    over recordings, (b) per animal (recordings of one subject pooled), then over animals.
    Reproduced when, under one reading, the mean is within the stated SD; the SD is reported.
