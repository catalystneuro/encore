    the paper's is reported.
- id: fig4-nlml-minima
  statement: >-
    Scans of a periodic Gaussian process over the period show clear minima of the negative log
    marginal likelihood near 300 s for ON and OFF cells, with further minima at 600 and 900 s,
    while NEUTRAL cells, with one exception, have flat profiles without consistent minima.
  source: Results, A periodic Gaussian process reveals dominant slow oscillations in ON- and OFF-cell activity, paragraph 1; Figure 4
  quote: >-
    ON- and OFF-cells showed clear minima in the ... negative log marginal likelihood (NLML) near
    300 s, with ... additional subharmonic peaks at 600 and 900 s ... contrast, NEUTRAL-cells (with
    one exception) displayed flat
  depends_on:
  - ongoing-cell-counts
  criterion: >-
    As GP_period_scoping.ipynb and the Methods (Gaussian process modeling, paragraph 1): each
    cell's rate from its spikes with a Gaussian kernel of 2 s sampled every 2 s
    (elephant.instantaneous_rate), edges removed, and a GPy GPRegression with a StdPeriodic
    kernel of fixed lengthscale 1.0 and variance 5.0 (GPy's default noise variance 1.0), its NLML
    evaluated at 200 periods evenly spaced. The Methods give 0.1 to 500 s; the Results and the
    code give 0.1 to 1500 s, which is used, since minima at 600 and 900 s cannot appear in a scan
    to 500 s (the 500 s scan is run as a variant for the 300 s minimum). The Methods remove the
    first and last 2 s; the code removes two samples (4 s), a variant. ON and OFF segments as in
    ongoing-cell-counts; NEUTRAL recordings whole. The paper does not define a "clear minimum";
    the reading used is the code's display, each cell's NLML divided by its maximum: a cell has
    a minimum near p when its profile has a local minimum within 10% of p. Reproduced when a
    majority of ON and of OFF cells have a minimum near 300 s and the class means of the
    normalized profiles have local minima near 300, 600 and 900 s, and at most 4 of the 32
    NEUTRAL cells (one, with 10% of 32 as tolerance) have a minimum near 300 s; partially
    reproduced when the ON and OFF part holds and more NEUTRAL cells have one. Counts per class
    are reported, and the stored scan PERIOD_SCOPE_RESULTS_200.npz is compared.
- id: fig5b-train-r2
  statement: >-
    A Poisson-type periodic Gaussian process fits the training data of all three cell classes
    with significant accuracy (pseudo-R2 different from 0; ON p = 0.0047, OFF p = 0.0004, NEUTRAL p
    < 0.0001).
  source: Results, A Poisson Gaussian process predicts slow quasi-periodic fluctuations in ongoing RVM firing, paragraph 2; Figure 5b; Supplementary Figure S4
  quote: >-
    All three cell classes achieved significant training accuracy ... (pON = 0.0047, pOFF =
    0.0004, pNEUTRAL < 0.0001)
  statistics:
  - about: ON, training pseudo-R2
    test: two-sided sign-flipping permutation test within animals
    p: 0.0047
    n: 25 ON cells
  - about: OFF, training pseudo-R2
    test: two-sided sign-flipping permutation test within animals
    p: 0.0004
    n: 25 OFF cells
  - about: NEUTRAL, training pseudo-R2
    test: two-sided sign-flipping permutation test within animals
    p: 0.0001
    p_relation: "<"
    n: 32 NEUTRAL cells
  depends_on:
  - ongoing-cell-counts
  criterion: >-
    The GP fit, from the Methods (Gaussian process modeling, paragraph 2) and
    Poisson_GP_main_fit_notebook.ipynb with non_poisson_gpytorch_model.py: spikes in 5 s bins;
    each cell trained on all but its last 300 s (ON and OFF 1500 s segments split at 1200 s;
    evoked/ongoing NEUTRAL cells, 960 s, at 660 s as the notebook has it, with params.json's 700
    s as a variant; ongoing NEUTRAL cells over their whole recording, the Methods' "full
    recording period" (Data processing, paragraph 2), less its last 300 s, with the code's split
    at 1200 s of a 1500 s segment as a variant); a
    sparse variational GP (GPyTorch ApproximateGP, fixed inducing points evenly spaced over the
    training span; the Methods give 200 inducing points, the code 100, a variant), constant
    mean, scaled periodic kernel, lengthscale prior N(0.1, 0.1) on the raw lengthscale, period
    initialized at 300 s and lengthscale at 0.1, mean and outputscale initialized by
    set_mean_and_scale; rate 10 softplus(x); generalized Poisson likelihood with theta = mu(1 -
    alpha), alpha < 1, prior N(0, 0.5); uniform contamination on 0 to 200 counts with p_noise
    0.001 (Methods; the code fixes 0.01, a variant); Adam, learning rate 0.05, for 10000
    iterations (params.json; the notebook's last call uses 100, a variant); seeds 0 (torch and
    pyro). Pseudo-R2, which the paper does not define, is the code's (compare_log_liks): 1 minus
    the summed expected log likelihood of the periodic GP over that of a constant-mean GP with a
    diagonal kernel and the same likelihood, on the training and the test bins. The test, as
    bootstrap_R2_across_animals.ipynb: the observed median pseudo-R2 of a class against the
    medians of 10000 permutations that flip the sign of all cells of one animal together (the
    Results, paragraph 2, "all cells per animal"; animals are dandiset subjects); the code
    groups by recording file, run as a variant, which is the same when each file is one
    animal. p is the fraction with absolute null median at least the absolute observed median.
    Reproduced when all three classes have p < 0.05 with positive medians; the median per class
    is reported, and the paper's stored values (combined_data.csv) are compared.
- id: fig5b-train-no-difference
  statement: >-
    Training pseudo-R2 does not differ between the three classes (permuted, Bonferroni-corrected
    Mann-Whitney U tests; Kruskal-Wallis p = 0.117).
  source: Results, A Poisson Gaussian process predicts slow quasi-periodic fluctuations in ongoing RVM firing, paragraphs 2 and 3; Supplementary Figures S6 and S7
  quote: >-
    paring R2 values using a similarly permuted and Bonferroni ... corrected Mann Whitney U test
    revealed no significant differ ... ences between training R2 for the three groups
  statistics:
  - about: training pseudo-R2 across the three classes
    test: Kruskal-Wallis test, permutation within animals
    p: 0.117
    n: 25 ON, 25 OFF and 32 NEUTRAL cells
  depends_on:
  - fig5b-train-r2
  criterion: >-
    A claim of absence, judged on the paper's tests as bootstrap_R2_across_animals.ipynb runs
    them on the training pseudo-R2 of fig5b-train-r2: for each pair of classes, the
    Mann-Whitney U statistic against 1000 permutations that relabel the cell classes of each
    recording file as a block (mannwhitney_blockwise, seed 42; Figures S6 and S7 say the
    permutation is within animals, so blocks by subject are run as a variant), two-sided by distance from the
    null median, Bonferroni-corrected over the three pairs; and the Kruskal-Wallis H against 1000
    such permutations over the three labels (kruskal_blockwise, seed 42). Reproduced when no
    corrected pair p and not the Kruskal-Wallis p is below 0.05; not reproduced when any is. The
    statistics and p-values are reported either way.
