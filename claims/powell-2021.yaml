# Claims for Powell, Haddad, Gorur-Shandilya & Marder (2021), eLife 10, e60454,
# doi:10.7554/elife.60454, tested on ZENODO:3924718.
#
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-11-25, following docs/protocol.md (Reader, protocol version pilot-18). No data of the
# dataset were seen; only its title and description on the archive (the paper's title and
# abstract: evoked gastric mill and pyloric rhythms of Cancer borealis recorded from 7 to 23 C).
#
# Text read: the version of record as served by Europe PMC (PMC7889077, open access JATS,
# flattened to paper/10.7554-elife.60454.txt), with Results, Discussion, Materials and methods,
# the figure legends of Figures 1 to 6 and the legends of the four figure supplements (Figure 2,
# figure supplement 1; Figure 3, figure supplement 1; Figure 4, figure supplements 1 and 2).
# The paper has no other supplementary text. The legend of Figure 5f is garbled in the text
# ("Ratios of LG to PD cycle period were n across temperature"); the Results sentence that
# reports the same test is quoted instead.
#
# Code read: https://github.com/marderlab/gastric at commit
# fa07d36a7e57fc7787a9a8e2fed72300b1a8e6e2 (2020-11-17), the commit the paper cites as archived
# at Software Heritage, and the later head 7a82b1f9a2239f46d73ae86d2cc70de8226d89be
# (2021-09-09), which differs in fig_phase_relationships.m (a prep-by-prep Rayleigh test on the
# first 50 burst starts), plotIntegerCoupling.m (the null c.d.f. line commented out) and labels.
# It holds MATLAB figure scripts (paper-figures/fig_burst_period.m for Figure 4,
# fig_integer_coupling.m with +gastric/plotIntegerCoupling.m and +gastric/integerCoupling.m for
# Figure 5, fig_phase_relationships.m with +gastric/measurePhase.m for Figure 6,
# fig_evoked_slowdown.m with +gastric/BurstPeriodsVsTime.m for Figure 4 supplement 1, PD_hyp.m
# for Figure 4 supplement 2, fig_spont_rhythms.m for Figure 2, and
# fig_within_prep_spont_evoked_comparison.m for Figure 3 supplement 1). It relies on the
# crabsort and srinivas.gs_mtools repositories (burst detection is crabsort.computePeriods),
# which were not read. The list of the ten evoked preparations is in +gastric/getEvokedData.m
# (901_005, 901_046, 901_049, 901_052, 901_062, 901_080, 901_086, 901_095, 901_098, 932_151).
#
# Data the paper used (Materials and methods). Isolated stomatogastric nervous systems of adult
# male Cancer borealis, extracellular recordings of lgn, dgn, mvn, lvn and pdn at 10 kHz, with
# saline temperature recorded on a channel; PD, LG and DG spikes sorted with crabsort. Three
# sets: (1) nine preparations from crabs caught in July 2013 with spontaneous gastric mill
# rhythms, temperature raised from 11 to 33 C in 2 C steps held at least 2 min (recordings of
# Haddad and Marder 2018; the code reads them from a separate "haddad" folder); (2) ten
# preparations from 2017 in which gastric mill rhythms were evoked by bilateral dpon
# stimulation (ten 6-s trains at 0.6 Hz, 15 Hz within train) at temperature steps of 2 or 4 C
# from 7 C until no rhythm could be evoked (typically 21 or 23 C); (3) nine preparations from
# 2020 in which rhythms were evoked twice at 11, 15, 19 and 21 C with the two PD neurons
# hyperpolarized and not. The dataset description names the evoked experiments; whether it
# holds sets (1) and (3) is the author's to find.
#
# Method details fixed here from the paper's code where the Methods are silent: PD bursts
# split at inter-spike intervals above 0.18 s with at least 2 spikes (LG and DG at 1 s with
# at least 5, as the Methods say); the temperature of an event is the temperature channel at
# the event's time (sampled at 1 kHz in the code); temperature steps are grouped in bins
# centred on 7, 9, ..., 23 C, an event belonging to a bin when its temperature lies within
# 1 C of the centre.
schema_version: 2
