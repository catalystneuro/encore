  statement: DG and PD burst periods are not significantly integer-coupled at any temperature
    (p > 0.02, D < 0.16).
  source: Results, Integer coupling is maintained across a physiological temperature range,
    paragraphs 4 and 5; Figure 5c, 5d and 5e
  quote: while DG and PD were not significantly coupled at any temperature (p > 0.02, D < 0.16)
  statistics:
  - test: two-sample Kolmogorov-Smirnoff test, observed against shuffled significands, per
      temperature
    statistic: D < 0.16
    p: 0.02
    p_relation: ">"
    corrected: Bonferroni over 9 temperature steps (threshold 0.05/9 = 0.0056)
  depends_on:
  - fig5d-lg-pd-integer-coupled
  criterion: A claim of absence, judged on the paper's test, the same KS test as
    fig5d-lg-pd-integer-coupled with DG in place of LG (code's shuffle, reading a, median over
    the repetitions), at the Bonferroni threshold 0.05/9. Reproduced when no temperature bin
    reaches p < 0.0056; not reproduced when any does. The D and p of every bin are reported
    against D < 0.16 and p > 0.02, and the permutation shuffle is shown as a variant.
- id: fig5e-lg-area-exceeds-dg
  statement: The area between the significand c.d.f. and the diagonal, a measure of integer
    coupling, is larger for LG/PD than for DG/PD at every temperature, and the DG/PD areas
    overlap those of shuffled periods.
  source: Results, Integer coupling is maintained across a physiological temperature range,
    paragraph 5; Figure 5e
  quote: Areas for LG/PD significands were larger than areas for DG/PD significands at every
    temperature ( Figure 5e ), suggesting greater integer coupling. Areas for DG/PD significands
    overlapped with areas computed after shuffling
  depends_on:
  - fig5d-lg-pd-integer-coupled
  criterion: As plotIntegerCoupling.m computes it. For each preparation and temperature bin with
    at least 30 significands, the area is the mean absolute difference between the empirical
    c.d.f. (interpolated at 100 points on 0 to 1) and the diagonal, averaged over 100 bootstrap
    resamples; the shuffled area uses as many significands drawn from the pool of shuffled
    ratios over all temperatures. Each bin's value is the mean over preparations, with SEM
    across preparations. Reproduced when the LG mean exceeds the DG mean in every bin where
    both exist, and the DG mean plus or minus SEM overlaps the shuffled mean plus or minus SEM
    in most bins. The overlap rule is a reading of "overlapped" (the paper gives none).
