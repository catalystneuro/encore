    11 and 30 C, in nine preparations in total.
  source: Results, Spontaneous gastric mill rhythms span a physiological range of temperatures,
    paragraphs 1 and 3; Figure 2 and Figure 2, figure supplement 1
  quote: We inspected a dataset of extracellular recordings of dgn and lgn during temperature
    ramps ( Haddad and Marder, 2018 ) and found spontaneous gastric mill activity at temperatures
    between 11°C and 30°C ... there were a total of nine preparations in which spontaneous
    rhythms were observed at a variety of different temperatures
  expected:
  - quantity: preparations with spontaneous gastric mill rhythms
    value: 9
    tolerance: 0
  - quantity: highest temperature with spontaneous LG bursting
    value: 30
    tolerance: 1
    unit: C
  criterion: LG bursts detected as the Methods define them (inter-spike interval above 1 s
    starts a burst, at least 5 spikes). Reproduced when nine preparations of the spontaneous
    set show LG bursts and, pooled over them, LG bursting occurs at temperature steps from 11 C
    up to 30 C (the steps are 2 C apart, so 1 C tolerance on the top step; the count is exact
    because it is a count of recordings). The paper gives no minimum number of bursts that
    makes activity "spontaneous gastric mill activity"; the readings are (a) at least one LG
    burst at the step, (b) at least two consecutive LG bursts, so that a period exists.
- id: fig2a-less-regular-at-high-temperature
  statement: In the example preparation of Figure 2a, spontaneous gastric mill rhythms were
    relatively regular at lower temperatures and less regular at higher temperatures.
  source: Results, Spontaneous gastric mill rhythms span a physiological range of temperatures,
    paragraph 2; Figure 2a
  quote: While these recordings show relatively regular gastric mill rhythms at lower
    temperatures, they were less regular at higher temperatures
  criterion: The example preparation is 830_116_2 in fig_spont_rhythms.m (the traces of Figure 2a
    and the rasters of preparation 2 in Figure 2b are from the same animal, legend of Figure 2).
    The paper gives no measure of regularity. Regularity is read as the coefficient of
    variation of LG burst periods (bursts as in the Methods) at each temperature step with at
    least three periods. Reproduced when the mean coefficient of variation over the steps above
    20 C exceeds that over the steps at or below 20 C. The split at 20 C is a choice made here
    (the paper names no boundary); the Spearman correlation of coefficient of variation with
    temperature is shown as a variant.
