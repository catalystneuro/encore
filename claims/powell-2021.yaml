- id: fig5d-lg-pd-integer-coupled
  statement: LG and PD burst periods are significantly integer-coupled at every temperature
    from 7 to 21 C (two-sample Kolmogorov-Smirnov test against shuffled periods, p < 1e-5, D >
    0.24).
  source: Results, Integer coupling is maintained across a physiological temperature range,
    paragraphs 4 and 5; Figure 5b, 5d and 5e
  quote: LG and PD were significantly integer-coupled, at temperatures from 7°C to 21°C (p < 10
    –5 , D > 0.24)
  statistics:
  - test: two-sample Kolmogorov-Smirnoff test, observed against shuffled significands, per
      temperature
    statistic: D > 0.24
    p: 0.00001
    p_relation: "<"
    corrected: Bonferroni over 9 temperature steps (threshold 0.05/9 = 0.0056)
    n: LG bursts pooled across all 10 preparations at each temperature
  criterion: Per LG burst, the mean PD period over that LG cycle, as integerCoupling.m computes
    it (PD burst start nearest the next LG start minus the PD burst start nearest this LG start,
    over the number of PD cycles between them); mean PD periods above 2 s and LG periods above
    30 s removed (plotIntegerCoupling.m); significand = fractional part of LG period over mean
    PD period (Methods). Per temperature bin, pooled over preparations (Methods), a
    two-sample KS test of the significands against significands from shuffled pairings
    (Methods). How the shuffle is formed is open; readings (a) as the code, 100 LG periods and
    100 mean PD periods drawn independently with replacement from the bin; (b) a random
    permutation of the bin's mean PD periods against its LG periods, same size. Because the
    shuffle is random, each is repeated 1000 times with a fixed seed and the median p and D
    reported (a standard choice; the paper used one draw). Reproduced when, under one reading,
    every bin from 7 to 21 C has p < 0.05/9 with D > 0.24 (10% tolerance, D > 0.216); partially
    reproduced when every bin is significant but some D or p miss the reported bounds.
