- id: fig4c-q10-about-2
  statement: Most preparations (8 of 10) had a cycle period Q10 of about 2 for both the
    pyloric and the gastric mill rhythm.
  source: Results, Gastric mill and pyloric cycle periods are similarly temperature-sensitive,
    paragraph 3; Figure 4c
  quote: Figure 4c shows that most preparations (8 of 10) exhibited a cycle period Q 10 of ~2
    for both the pyloric and gastric mill rhythms
  expected:
    quantity: preparations with Q10 near 2 for both PD and LG
    value: 8
    tolerance: 0.8
  criterion: Q10 = (f_T / f_11)^(10 / (T - 11)), f the mean burst frequency, 11 C the reference
