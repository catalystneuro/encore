  - fig6b-lg-phase-locked
  criterion: Phases as in fig6b-lg-phase-locked. As fig_phase_relationships.m, the circular mean
    phase per preparation and temperature bin, then the circular mean over preparations per bin
    (gastric.groupAndPlotErrorBars with circular means); Spearman correlation of these bin means
    with temperature over the bins 7 to 21 C. The trend is a claim of absence judged on this
    test (reproduced when p >= 0.05, rho reported against -0.31). The phase holds when every
    bin mean from 7 to 21 C lies within 0.5 plus or minus 0.05. Whether all LG burst starts or
    the first 40 per preparation and temperature (Methods, Figure 6b, e) enter is open; both
    are run, and the claim holds when both parts hold under one.
- id: fig6c-lg-spiking-drops-near-pd-end
  statement: LG spike probability in the PD cycle shows a pronounced decrease at higher
    temperatures, occurring close to PD burst termination.
  source: Results, LG preserves phase locking to PD across physiological temperatures, paragraph
    3; Figure 6c
  quote: We measured the spike probability of LG conditional on PD phase across this temperature
    range and found a pronounced decrease in the probability of spiking in LG at higher
    temperatures ( Figure 6c ). This decrease in LG spike probability occurred close to PD burst
    termination
  criterion: As fig_phase_relationships.m, the PD phase of every LG spike (measurePhase.m),
    grouped by rounded temperature, temperatures with at least 1000 spikes, histogram of 30
    bins on 0 to 1 normalized as a p.d.f.; the mean PD burst-end phase per temperature. The
    paper gives no measure of the decrease. It is read here as the p.d.f. in the bin that holds
    the mean PD burst-end phase (readings (a) that bin, (b) the lowest bin within 0.1 phase of
    it). Reproduced when, under one reading, this value is below 1 (the uniform level) at the
    warmest temperature included and its Spearman correlation with temperature across the
    included temperatures is negative.
- id: fig6e-dg-not-phase-locked
  statement: DG bursts are not phase-locked to PD; DG burst starts are not sharply peaked in PD
    phase, not significantly non-uniform in every preparation and temperature, and the effect
    is much smaller than for LG (p from 0.001 to 0.85, 0.15 < z < 13).
  source: Results, LG preserves phase locking to PD across physiological temperatures, paragraph
    4; Figure 6d and 6e
  quote: DG burst starts are not sharply peaked in PD phase, and they are not significantly
    different from a uniform distribution for all preparations at all temperatures ( Figure 6e ,
    p ∈ [0.001, 0.85], 0.15 < z < 13, Rayleigh test)
  statistics:
  - test: Rayleigh test for non-uniformity, per preparation and temperature
    statistic: 0.15 < z < 13
    p: 0.001
    p_relation: ">"
  depends_on:
  - fig6b-lg-phase-locked
  criterion: The same test and sample readings as fig6b-lg-phase-locked, with DG burst starts.
    Reproduced when, under the reading that reproduced the LG claim (or any reading if none
    did), at least one combination has p >= 0.05 and the largest DG z is below the smallest LG
    z of fig6b-lg-phase-locked. The p and z ranges are reported against 0.001 to 0.85 and 0.15
    to 13.
- id: fig6f-dg-spiking-no-drop
  statement: DG spike probability does not show a noticeable decrease close to the end of PD
    bursting.
  source: Results, LG preserves phase locking to PD across physiological temperatures, paragraph
    4; Figure 6f
  quote: DG spike probability also does not show a noticeable decrease close to the end of PD
    bursting
  depends_on:
  - fig6c-lg-spiking-drops-near-pd-end
  criterion: The measure of fig6c-lg-spiking-drops-near-pd-end, applied to DG spikes. The paper
