- id: fig6b-lg-phase-locked
  statement: LG burst starts are phase-locked to the PD cycle, their distribution in PD phase
    sharply peaked and significantly non-uniform (Rayleigh test, p < 4e-4, 7.5 < z < 45).
  source: Results, LG preserves phase locking to PD across physiological temperatures, paragraph
    2; Figure 6a and 6b
  quote: LG burst start probabilities were sharply peaked ( Figure 6b ) and were significantly
    different from a uniform distribution ( Figure 6b , dashed line, p < 4×10 –4 , 7.5<z<45,
    Rayleigh test for non-uniformity; see Methods for details)
  statistics:
  - test: Rayleigh test for non-uniformity, per preparation and temperature
    statistic: 7.5 < z < 45
    p: 0.0004
    p_relation: "<"
  criterion: PD phase of each LG burst start = time since the start of the preceding PD burst
    over that PD burst's period (Methods; measurePhase.m, which skips the first and last LG
    burst of each preparation); temperature that at the PD burst start, rounded to a whole
    degree. The Rayleigh test (circ_rtest of Berens 2009, z = n R^2). Which sample is tested
    is open, as the Methods, the archived code and the later code differ. Readings (a) Methods,
    the first 40 LG burst starts of each preparation and temperature, combinations with fewer
    than 40 excluded; (b) the later code (commit 7a82b1f), the first 50, combinations with
    fewer than 50 excluded; (c) the archived code, all burst starts of a temperature pooled over
    preparations, temperatures with fewer than 100 excluded. Under (a) z cannot exceed 40, so
    the reported z of 45 fits (b) or (c) better. Reproduced when, under one reading, every
    tested combination has p < 0.05 and the largest p and the range of z agree with p < 4e-4
    and 7.5 to 45 (widened by 10%, 6.75 to 49.5); partially reproduced when every combination
    is significant but the p or z bounds are not met.
