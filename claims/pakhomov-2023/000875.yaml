- id: fig4-bipolar-cancellation
  statement: A single 600-ns unipolar pulse at 15 kV/cm caused by far the strongest YP uptake in
    single CHO cells (126 +/- 14 a.u. at the end of recording, n = 25), while bipolar signals
    starting with the same pulse caused significantly weaker uptake (4-phase 20.8 +/- 2.0,
    8-phase 6.9 +/- 1.6, 8-phase with 5-us delays 25.4 +/- 2.8 a.u.; p < 0.001); sham caused no
    gain.
  source: Results, 3.1, paragraph 1; Figure 4
  quote: Sham-exposed cells showed no gain in YP fluorescence during the 10 min of observation ...
    A single 600-ns pulse at 15 kV/cm caused by far the strongest YP uptake, reaching 126±14 a.u.
    (n=25) by the end of recording. Bipolar signals started with exactly the same pulse (600 ns,
    15 kV/cm) but caused significantly weaker effects (p<0.001). By the end of recording, YP signal
    reached only 20.8±2.0 a.u. for the 4-phasic signal; 6.9±1.6 a.u. for the 8-phasic signal; and
    25.4±2.8 a.u. for the 8-phasic signal with 5-μs delays between phases
  statistics:
  - about: each bipolar signal against the single unipolar pulse, end of recording
    test: not named for single cells (Methods 2.2 names none; Methods 2.4 names a two-sided Student's
      t-test for the monolayer data)
    p: 0.001
    p_relation: "<"
    n: 21 to 30 cells per group (25 for the unipolar pulse)
  expected:
  - quantity: YP uptake at end of recording, single unipolar pulse
    value: 126
    tolerance: 14
    unit: a.u.
  - quantity: YP uptake at end of recording, 4-phase bipolar
    value: 20.8
    tolerance: 2.0
    unit: a.u.
  - quantity: YP uptake at end of recording, 8-phase bipolar
    value: 6.9
    tolerance: 1.6
    unit: a.u.
  - quantity: YP uptake at end of recording, 8-phase bipolar with 5-us delays
    value: 25.4
    tolerance: 2.8
    unit: a.u.
  criterion: Per cell, F-F0 at the last image (600 s), F the mean intensity in a ROI drawn
    around the cell and F0 the mean of the six images before the pulse; F-F0 is what Methods 2.2
    calls the background-corrected emission, and no other subtraction is named. Tolerances are the paper's s.e. Reproduced when the four group means are
    within tolerance and each bipolar group is below the unipolar group by a two-sided
    Student's t-test at p < 0.001; partially reproduced when the order and the tests hold but
    some means fall outside tolerance. The sham group is reported and not judged, as the paper
    gives no value or test for it. Whether the t-test is the
    test used for single cells is open (Methods 2.2 names none); a Welch t-test is shown as a
    variant.
