# Claims for Pakhomov, Gudvangen, Mangalanathan, Kondratiev, Redondo & Semenov (2023),
# Bioelectrochemistry 152, 108437, on dandiset 000875.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the accepted author manuscript in PubMed Central (PMC10247516, NIHMS1891360), as
# served by ncbi_pmc, full text with Methods, Results, Discussion and figure legends. It is not
# the version of record. PMC lists no supplement, and the text cites none. No PDF was available
# and none was opened. The paper links no analysis code and no data repository; images were
# measured in MetaMorph 7.8.13 and Fiji, and graphs made in Grapher 16, so no code was read.
#
# Dandiset 000875 (title "Influence of unipolar pulse packet quantity on centering the
# electroporation effect within a quadrupole electrode array") is described as images of
# YO-PRO-1 uptake after different numbers of nsEP packets in a four-electrode array. That is the
# experiment of Fig. 6 (Section 3.3, paragraph 1). The other experiments are claimed too; whether
# the dandiset holds them is the author's to find.
#
# Data the paper used. All cells are CHO-K1. (1) Fig. 4 (Methods 2.2, Results 3.1): single cells
# on coverslips imaged by confocal microscopy every 10 s for 600 s in 1 uM YO-PRO-1 (YP), pulsed
# at 57 s by two tungsten electrodes, with a single 600-ns unipolar pulse at 15 kV/cm, a 4-phase
# bipolar signal, an 8-phase bipolar signal, an 8-phase signal with 5-us delays, or sham; 21 to
# 30 cells per group; measure F-F0 per cell, F0 the mean of the six images before the pulse.
# (2) Figs. 5 to 9 (Methods 2.3 and 2.4): CHO monolayers in 35-mm dishes, one dish per
# experiment, exposed through a quadrupole array of four 1.5-mm needles (small array, and a
# large one of 8.4-mm diagonal) to packets 1, 2 or 3 of 600-ns unipolar pulses (Fig. 2), with
# packet number and rotation as named in the legends ("1Px4", "10Px4", "1Px40"), the first-pulse
# voltage, and for Fig. 9 the gap between electrode tips and monolayer (0 to 3 mm). YP for
# 10 min, rinsed, then stitched 10x images of the array area; YP intensity measured in 92 or
# 224 ROIs along one or both diagonals, over +/- 1.65 mm (small array) or +/- 3.65 mm (large
# array) from the array center, with areas within 5% of the diagonal length next to the
# electrodes left out; 3 to 5 independent experiments (dishes) per treatment. (3) Fig. 3:
# Sim4Life electric field simulations, not recorded data.
#
# Profile method used by the monolayer criteria, from Methods 2.4 unless said otherwise. The
# intensity profile is the mean YP intensity per ROI as a function of distance from the array
# center; a treatment's profile is the mean +/- s.e. over its independent experiments (dishes);
# "normalized" is in percent of the most peripheral ROI, the one closest to the electrode
# (Methods 2.4; legends of Figs. 5C, 6B, 7B, 7D, 8B, 9B). Comparisons between treatments use a
# two-sided Student's t-test (equal variances, as "Student's" names it) on per-dish values at
# p < 0.05, the only test the Methods name. Details the paper leaves open, with the readings
# the criteria allow (a claim holds when it holds under any combination of them, and every
# combination is shown):
#   ROI layout. 92 and 224 ROIs "along one or both diagonals". Readings (r1) all ROIs on one
#     diagonal, about 36 um (small) or 33 um (large) apart; (r2) half on each diagonal, about
#     72 um or 65 um apart. ROI width equal to the spacing is a standard choice. Fig. 5A uses
#     the e1-e3 diagonal only; Fig. 5B averages both (legend). Elsewhere the number of
#     diagonals is not given; both diagonals averaged is the reading where electrodes rotate.
#   Background. The Methods name no background subtraction for monolayer images. Readings
#     (b1) raw intensity; (b2) intensity minus a cell-free or dark offset, where the data hold
#     one.
#   Center. Readings (c1) the ROI nearest the geometric center; (c2) the highest ROI between
#     the two minima of the profile on either side of the center (the central peak).
#   Periphery. The most peripheral ROI at each end of the measured diagonal(s). Readings (e1)
#     the mean of the ends; (e2) each end on its own.
#   Normalization order. Readings (n1) each dish normalized, then averaged; (n2) the mean
#     profile normalized.
#   The array used in Figs. 6 and 8 is not stated, nor the first-pulse voltage of Fig. 6; Fig. 5
#     is read as the large array from its reference to Fig. 3C (Section 3.2). Section 3.3 paragraph 2 says measurements "above" were made
#     with the smaller array, which may or may not include Fig. 6; the author takes the array
#     from the images, and the readings above apply to either.
#   LOESS regression is used to draw fits (Methods 2.4); its span is not given. The criteria
#     use ROI values; LOESS fits with spans 0.25 and 0.5 are standard choices shown as variants
#     where a peak or width is taken.
