- id: fig9c-restricted-to-center
  statement: With the electrodes above the monolayer, electroporation is restricted almost
    exclusively to the center of the array.
  source: Results, 3.5, paragraph 1; Figure 9C
  quote: YP fluorescence images in Fig. 9C show that electroporation is restricted almost
