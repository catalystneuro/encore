- id: fig7b-targeting-independent-of-amplitude
  statement: Normalized to the most peripheral ROI, the profiles for different first pulse
    amplitudes fully overlap, so the spatial distribution of electroporation, and NG-CANCAN
    targeting, does not depend on amplitude within the studied range.
  source: Results, 3.3, paragraph 2; Figure 7B
  quote: In contrast, changing nsEP amplitude affected the degree of electroporation but not its
    spatial distribution ( Fig. 7 ). ... When the YP emission was normalized to the most peripheral
    ROI, the data for different nsEP amplitudes fully overlapped ( Fig. 7B ).
  criterion: A claim of absence. The paper names one test, the two-sided Student's t-test at p <
    0.05 (Section 2.4), and reads significance from the error bar gap. Small array, 1Px4, every
    voltage of Fig. 7A and 7B (n = 3 dishes each). The normalized values at the center ROI and at
    the half-way ROI, the positions the paper reports in this paragraph, are compared between
    every pair of voltages, with no correction, as the paper applies none. Reproduced when no
    pair differs at p < 0.05; not reproduced when any does. The differences and their p-values
