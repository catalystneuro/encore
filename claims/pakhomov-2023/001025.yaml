  source: Results, 3.3, paragraph 2; Figure 7A
  quote: when the first pulse amplitude was increased from 2.4 to 5.6 kV (and the amplitude of the
    other pulses in the packet was increased proportionally, see Fig. 2C ), YP fluorescence
    increased 15.5 times at the most peripheral point; 16.2 times half-way to the center; and 16.8
