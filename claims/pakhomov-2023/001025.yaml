- id: fig9-gap-boosts-targeting
  statement: Raising the large array 1, 2 and 3 mm above the monolayer reduces YP emission near the
    electrodes 2.4, 6.4 and 9 times but in the center only 1.02, 1.4 and 3.8 times, raising the
    targeting efficiency (center over periphery) to as much as 600% at 2 mm.
