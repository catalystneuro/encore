  expected:
  - quantity: normalized center fluorescence, 1Px4
    value: 200
    tolerance: 20
    unit: percent of most peripheral ROI
  - quantity: normalized center fluorescence, 5Px4
    value: 100
    tolerance: 10
    unit: percent of most peripheral ROI
  - quantity: normalized center fluorescence, 10Px4
    value: 100
    tolerance: 10
    unit: percent of most peripheral ROI
  - quantity: center over trough fluorescence ratio, each treatment
    value: 2
    tolerance: 0.2
  criterion: Values from dish means, under the readings of the opening comment. "Almost twofold" is
    taken as 200% with the 10% tolerance, so it holds from 180% to 220%. The paper does not define the width of the central peak. Readings, (a) the full width
    of the normalized mean profile at half the height of the peak above the trough, (b) the
