# Claims for Pakhomov, Gudvangen, Mangalanathan, Kondratiev, Redondo & Semenov (2023) on dandiset 001025.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-22, protocol as
# stated in docs/protocol.md.
#
# Source: the accepted author manuscript in PubMed Central (PMC10247516, NIHMS1891360), full text
# as served by NCBI PMC: Introduction, Materials and methods, Results, Discussion and figure legends.
# The paper has no supplement (PMC lists none) and links no code, so every method below is taken
# from the Methods (Sections 2.2 to 2.4) and the figure legends. No PDF was available, so the
# voltages printed next to the curves of Fig. 7 and the axis values of the figures were not read;
# where a claim needs them, the criterion says so.
#
# The dandiset's title is "The impact of voltage on CANCAN focusing of electroporation using
# four-electrode arrays of varying sizes", which matches Fig. 7 (Section 3.3, paragraph 2). The
# other claims cover the paper's remaining findings, which the dataset may not hold.
#
# Data the paper reports. All experiments used CHO-K1 cells. Electroporation was measured as uptake
# of YO-PRO-1 dye (YP), as fluorescence intensity.
#   - Fig. 4 (Section 2.2): small groups of cells on coverslips, two tungsten electrodes, confocal
#     time-lapse images every 10 s for 600 s, pulses at 57 s. Five groups: sham, one unipolar 600-ns
#     pulse at 15 kV/cm, and three bipolar signals (4-phase; 8-phase; 8-phase with 5-us delays).
#     21 to 30 cells per group (25 for the unipolar pulse). The measure is per cell, F minus F0,
#     with F0 the mean of six images before the pulses, in a manually drawn ROI.
#   - Figs. 5 to 9 (Sections 2.3 and 2.4): cell monolayers in 35-mm dishes, one dish per experiment,
#     a quadrupole array of four 1.5-mm needles (a small array and a large one with an 8.4-mm
#     diagonal), packets of 600-ns pulses from a 4-channel generator at 1 Hz. YP images (10x,
#     stitched) taken after 10 min of dye. Fluorescence measured in 92 (small array) or 224 (large
#     array) ROIs along one or both diagonals, over +/- 1.65 mm or +/- 3.65 mm from the center;
#     areas within 5% of the diagonal length of the electrodes excluded. Shown in a.u. or in
#     percent of the most peripheral ROI, mean +/- s.e. over 3 to 5 dishes, with LOESS fits.
#     Conditions: Fig. 5, Packet 2 or a unipolar train, 40 times from e1 or rotated (1Px40, 1Tx40),
#     6.4 kV, n = 4 to 5; Fig. 6, Packet 2, 1Px4, 5Px4, 10Px4, n = 3 to 4; Fig. 7, Packet 2 at
#     several first-pulse voltages (2.4 to 5.6 kV on the small array, 1Px4; the large array, 10Px4),
#     n = 3; Fig. 8, Packets 1, 2 and 3, 1Px4, 4 kV, n = 3 to 4; Fig. 9, large array, Packet 2,
#     10Px4, 6.4 kV, electrodes 0, 1, 2 or 3 mm above the monolayer, n = 3 to 4.
#   - Statistics (Section 2.4): two-sided Student's t-test, p < 0.05; in the figures, significance
#     is read from the gap between error bars (no symbols are drawn).
#
# Details the paper leaves open, used by several criteria below; each criterion names its readings.
#   - ROI size and spacing. 92 or 224 ROIs "along one or both diagonals" can mean that number per
#     diagonal or over both. Readings: (a) the count over both diagonals, (b) per diagonal. ROI
#     width is not given; the ROIs are taken as contiguous along the diagonal, which is the standard
#     choice and fixes their size once the count is fixed.
#   - Which diagonals. Fig. 5B says the data were averaged across both diagonals and Fig. 5A uses
#     the e1 to e3 diagonal; other legends do not say. Readings: (a) both diagonals averaged, (b) one
#     diagonal (e1 to e3).
#   - The "most peripheral ROI" used for normalization, when both ends of a diagonal are measured.
#     Readings: (a) the mean of the end ROIs, (b) each half-diagonal normalized to its own end ROI
#     and the halves then averaged.
#   - The center ROI. The geometrical center of the array; readings (a) the single ROI nearest the
#     center, (b) the mean of the ROIs on either side of it when no ROI is centered.
#   - Raw ROI means or LOESS fits. Numbers in the text may have been read from either. Readings:
#     (a) dish means of raw ROI values, (b) the LOESS fit; the LOESS span is not given, so (b) uses
#     the standard span of 0.75 and says that it is a standard choice.
#   - Ratios of conditions are taken as ratios of the means over dishes, since dishes are not
#     paired across conditions (Section 2.1, each dish was used in one experiment).
schema_version: 2
dataset:
  archive: dandi
  id: "001025"
paper: doi:10.1016/j.bioelechem.2023.108437
claims:
- id: fig4-unipolar-strongest
  statement: A single unipolar 600-ns pulse at 15 kV/cm causes by far the strongest YP uptake in
    individual CHO cells, 126 +/- 14 a.u. at the end of the 10-min recording (n = 25), and sham
    exposure causes no gain in YP fluorescence.
  source: Results, 3.1, paragraph 2; Figure 4
  quote: Sham-exposed cells showed no gain in YP fluorescence during the 10 min of observation. ...
    A single 600-ns pulse at 15 kV/cm caused by far the strongest YP uptake, reaching 126±14 a.u.
    (n=25) by the end of recording.
  expected:
  - quantity: YP fluorescence (F minus F0) at end of recording, single unipolar pulse, mean
    value: 126
    tolerance: 14
    unit: a.u.
  criterion: Per cell, F minus F0 as Section 2.2 defines it (F0 the mean of the six images before
    the pulses), at the last image of the 600-s series (the paper's "end of recording"). The value
    holds when the mean over cells is within the paper's s.e. (14 a.u.) of 126. The sham claim
    holds when the sham group's mean F minus F0 at the end of recording does not differ from zero
    by a two-sided one-sample Student's t-test at p < 0.05 (the Methods' test, Section 2.4,
    applied to the one group), and is reported with its size.
- id: fig4-bipolar-cancellation
  statement: Bipolar signals that start with the same pulse cause significantly weaker YP uptake
    than the single unipolar pulse (p < 0.001), reaching 20.8 +/- 2.0 a.u. for the 4-phase signal,
    6.9 +/- 1.6 a.u. for the 8-phase signal and 25.4 +/- 2.8 a.u. for the 8-phase signal with 5-us
    delays; the 8-phase signal gives about 20-fold cancellation.
  source: Results, 3.1, paragraph 2; Figure 4 legend
  quote: Bipolar signals started with exactly the same pulse (600 ns, 15 kV/cm) but caused
    significantly weaker effects (p<0.001). By the end of recording, YP signal reached only 20.8±2.0
    a.u. for the 4-phasic signal; 6.9±1.6 a.u. for the 8-phasic signal; and 25.4±2.8 a.u. for the
    8-phasic signal with 5-μs delays between phases. The impressive 20-fold bipolar cancellation
    achieved with the 8-phasic signal
  statistics:
  - about: each bipolar signal against the single unipolar pulse, end of recording
    p: 0.001
    p_relation: "<"
    n: 21 to 30 cells per group
  expected:
  - quantity: YP fluorescence at end of recording, 4-phase bipolar, mean
    value: 20.8
    tolerance: 2.0
    unit: a.u.
  - quantity: YP fluorescence at end of recording, 8-phase bipolar, mean
    value: 6.9
    tolerance: 1.6
    unit: a.u.
  - quantity: YP fluorescence at end of recording, 8-phase bipolar with 5-us delays, mean
    value: 25.4
    tolerance: 2.8
    unit: a.u.
  - quantity: unipolar over 8-phase bipolar fluorescence ratio
    value: 20
    tolerance: 2
  criterion: Values as in fig4-unipolar-strongest, each within the paper's s.e. The test is not
    named in Section 2.2 or the Fig. 4 legend; the only test the Methods name is the two-sided
    Student's t-test (Section 2.4), which is used here, comparing each bipolar group with the
    unipolar group at the last image (Welch's t-test is shown as a variant only). Reproduced when
    all three bipolar groups are below the unipolar group with p < 0.001 and the values are within
    tolerance. The ratio uses the group means.
    The "4-5-fold" cancellation of the other two signals (Section 3.4) is reported alongside.
- id: fig5a-center-enhanced-without-rotation
  statement: Packet 2 applied 40 times from e1 enhances electroporation in the center of the array
    despite the weakening field, while the unipolar train control electroporates more strongly
    throughout and follows the field distribution; without rotation the region near e1 stays
    stronger than the center.
  source: Results, 3.2, paragraph 1; Figure 5A
  quote: The lack of cancellation caused a much stronger electroporation throughout the array, and
    the distribution of YP uptake expectedly followed the electric field strength distribution in
    Fig. 3C . In contrast, Packet 2 enhanced electroporation in the center of the array, despite
    gradual weakening of the electric field with distance from e1. However, the bipolar
    cancellation only partially offset the electric field weakening, and electroporation near e1
    remained stronger than in the center.
  criterion: Along the e1 to e3 diagonal (Fig. 5A legend), dish means of ROI values. Three parts,
    each tested with the Methods' two-sided Student's t-test at p < 0.05 over dishes (n = 4 to 5).
    (1) "40 Trains" above "40 Packets" at the most peripheral ROI next to e1, at the center ROI and
    at the trough. (2) For "40 Packets", the center ROI above the trough, the trough being the
    ROI with the lowest mean between the center and e1 (the paper's "least affected area ...
    between the center and the electrodes", Section 3.3). (3) For "40 Packets", the ROI next to e1
    above the center ROI. Reproduced when all three hold under the readings of the opening
    comment that apply (ROI count, center ROI, raw or LOESS); partially when two hold.
- id: fig5bc-rotation-focuses-center
  statement: Rotating the first-energized electrode with Packet 2 (1Px40) smears the effect at the
    perimeter and emphasizes a remote effect in the center, while the same rotation of the unipolar
    train (1Tx40) leaves a void of electroporation in the center; the difference is clearest in
    fluorescence normalized to the most peripheral ROI.
  source: Results, 3.2, paragraph 1; Figure 5B and 5C
  quote: Rotation with Packet 2 “smeared” the electroporation effect at the perimeter and emphasized
    the remote effect in the center. This remote effect contrasted with a void of electroporation
    in the center when the pulse train was applied in the same manner instead of the packet.
  criterion: Both diagonals averaged (Fig. 5B legend), normalized to the most peripheral ROI (Fig.
    5C). Reproduced when (1) the normalized center value of 1Px40 exceeds that of 1Tx40 and (2) for
    1Px40 the center ROI exceeds the trough (the lowest ROI between center and periphery), each by
    the Methods' two-sided Student's t-test at p < 0.05 over dishes, and (3) for 1Tx40 the center
    shows a void. The paper does not define a void; readings, (a) the normalized center value of
    1Tx40 is below 100% by the same test, (b) the center ROI is the lowest point of the 1Tx40 mean
    profile. Part (3) is judged under both, and blocked as methods_underspecified if they disagree. The paper gives no number for
    Fig. 5C, so no value is expected; the normalized center values of both treatments are reported.
    The readings of the opening comment for normalization and center ROI are each run.
- id: fig6a-more-packets-more-uptake
  statement: Increasing the total number of rotated Packet 2 packets from 4 to 20 and 40 strongly
    increases YP uptake throughout the array, and the central peak is discernible for all three.
  source: Results, 3.3, paragraph 1; Figure 6A
  quote: Increasing the total number of applied packets from 4 to 20 and 40 profoundly enhanced the
    electroporative YP dye uptake throughout the electrode array ( Fig. 6A ). The peak of
    electroporation in the center was clearly discernable for all tested treatments.
  criterion: Dish means (n = 3 to 4) at the most peripheral ROI, the trough and the center ROI.
    Reproduced when, at all three positions, the means increase from 1Px4 to 5Px4 to 10Px4 and 10Px4
    exceeds 1Px4 by the Methods' two-sided Student's t-test at p < 0.05, and for each treatment the
    center ROI exceeds the trough. Partially reproduced when the increase holds at one or two of
    the positions.
- id: fig6b-normalized-center-by-packets
  statement: Normalized to the periphery, the central peak is almost twofold for 1Px4 and about the
    same as the periphery for 5Px4 and 10Px4; the trough between center and electrodes is about
    twofold lower than the center for all treatments; the central peak becomes narrower with more
    packets.
  source: Results, 3.3, paragraph 1; Figure 6B
  quote: Its brightness was almost twofold higher than at the periphery for a single packet was
    applied 4 times from different directions, or about the same as at the periphery for the
    rotation of 5 and 10 packets ( Fig. 6B ). Interestingly, the least affected area of the cell
    monolayer (between the center and the electrodes) showed about 2-fold lower fluorescence
    intensity than in the center for all the treatments. Also, the central peak appeared narrower
