# Claims for Guo, Inagaki, Daie, Druckmann, Gerfen & Svoboda (2017) on dandiset 000009.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-20, protocol
# as stated in docs/protocol.md (pilot-10), Reader steps 1 to 4.
#
# Text read: the HHMI author manuscript in PubMed Central (PMC6431254, NIHMS865428), as served by
# Europe PMC (paper/10.1038-nature22324.txt): main text, Methods, the legends of Figures 1 to 6 and
# of Extended Data Figures 1 to 10. It is the accepted manuscript, not the version of record. No PDF
# was supplied, so no figure could be read. Not in the text: the Supplementary Information
# (supp_info: further whole-cell methods, the model of the latency T3 and the network models of
# Extended Data Fig. 7c-e, lick-early, no-response and lick-latency rates under photoinhibition) and
# Supplementary Tables 1 and 2 (animals, coordinates, photostimulus powers, viruses). The claims
# latency-model-t3 and network-models rest on the Supplementary Information and are written from
# the main text and Extended Data legends only; no other claim needs it. The claims
# selectivity-time-course and alm-gabaergic-no-thalamic-projection were added by the check of
# 2026-10-20.
#
# Code read: none. The paper links no analysis code. It names the data deposit "CRCNS.ORG in the NWB
# format (https://doi.org/10.6080/K03F4MH2)". The dandiset's archive title is the paper's title, and
# its description (the abstract) says it holds spikes from ALM and thalamus during the task with
# photoinhibition; its metadata list Units, BehavioralTimeSeries, CurrentClampStimulusSeries and
# OptogeneticSeries, 31 subjects. Which of the experiments below it holds is for the author to find.
#
# The data the paper used, as it reports them (Methods). 71 mice, adult (> P60), male and female.
# Lines: PV-IRES-Cre x Ai32 (ALM photoinhibition, Fig. 1c, 6, Extended Data Figs 8, 10), VGAT-ChR2-EYFP
# (thalamus photoinhibition during ALM and thalamic recordings, Fig. 3, 4, 5), Gad2-IRES-Cre with
# AAV2/10 CAG-flex-ChR2 injected in TRN (thalamus photoinhibition in behaviour, Fig. 1d, and in
# Extended Data Figs 2c, 5c-h), Olig3-cre x Ai32 (thalamus photoactivation, Extended Data Fig. 6c).
# Task: a pole in one of two positions (8.58 mm apart, anterior-posterior); sample epoch 1.3 s from
# the onset of pole movement to 0.1 s after the pole starts to retract; delay epoch 1.2 or 1.3 s; a
# go cue (3.4 kHz, 0.1 s); then the mouse licks left or right. Trials with licks before the go cue
# ('lick early') and with no lick within 1.5 s of the go cue ('no response') are excluded from all
# analyses (Methods, Behavior). Recordings are from the left hemisphere, so 'contra' trials are
# those whose instructed (correct) lick is to the right, and 'ipsi' trials to the left; for
# behaviour, contra and ipsi are relative to the manipulated side (Fig. 1a legend; Methods,
# Behavioral data analysis). Photoinhibition: on 25% of trials (Fig. 1, 3a-f, 6) or 25-50%
# (Fig. 3g, 4); in cortex 40 Hz sinusoid, 1.5 mW average, 1.3 s including a 100 ms ramp from the
# start of the delay epoch; in thalamus continuous light through a 200 um fibre, 1.2 to 1.3 s from
# the start of the delay epoch, 10 mW (Extended Data Fig. 2), or 0.5 mW for the weak photoinhibition
# of Fig. 5. Units: ALM 1214 units in 57 sessions (10 mice in Results), split by trough-to-peak
# spike width into putative fast-spiking (< 0.4 ms, 166), putative pyramidal (> 0.6 ms, 1006) and
# unclassified (42); thalamus 790 units in 73 sessions (11 mice), putative thalamic neurons with
# width > 0.5 ms (672), VM/VAL units within 0.4 mm of the VM/VAL centre (313 of 790; 295 in the
# Results); SNr 227 units in 23 sessions, putative GABAergic with width < 0.45 ms (181). Whole-cell
# recordings in ALM (and M1), Vm sampled at 20 kHz, 350 to 850 um below the pia. Measured
# variables: spike times, unit position, spike waveform, trial type, licks and outcome,
# photostimulus timing, membrane potential.
#
# Conventions used by the criteria below (all from the Methods unless marked open).
# E (epochs). Sample: 1.3 s from the onset of pole movement. Delay: from the end of the sample
#   epoch to the go cue. Response: from the go cue; its length is not given. Open, with readings
#   (R1) 1.3 s after the go cue, the length of the other epochs, (R2) 1.5 s after the go cue, the
#   response window that defines 'no response'.
# S (selectivity, Methods, Electrophysiology data analysis). A unit is selective in an epoch when
#   its spike counts in the epoch differ between correct contra and correct ipsi trials (two-sided
#   t-test, P < 0.05); 'selective' means selective in any of the three epochs; 'preparatory
#   activity' means selective in the sample or delay epoch; 'peri-movement selectivity' means
#   selective in the response epoch. Contra- or ipsi-preferring is decided by the total spike count
#   over the three epochs. Selectivity is contra minus ipsi firing rate, correct trials only.
#   Whether the t-test assumes equal variances is not stated (Student's in the behavioural
#   analysis); open, readings (a) Student's, (b) Welch's. Which outcomes enter the test is also
#   open: the Methods restrict to correct trials the sentence on computing selectivity, and the
#   sentence on the test says only "contra- and ipsi- trials"; readings (c1) correct trials only,
#   (c2) correct and incorrect trials.
# P (photoinhibition effect). Units with at least 5 photoinhibition trials (Fig. 3, 6) or 25
#   (Fig. 5). Rate in the window 20 to 120 ms after photostimulus onset (the delay onset), in
#   photoinhibition trials against control trials in the same window, contra and ipsi trials
#   pooled. Which outcomes enter is open: the Methods include correct and incorrect trials for
#   PSTHs "as photoinhibition reduced neural activity irrespective of the response outcomes" and
#   say nothing for the scatter plots; readings (T1) correct and incorrect, (T2) correct only. A
#   unit is inhibited or activated by the sign of the change, and significantly so by a two-sided
#   t-test, P < 0.05, on single-trial rates (t-test readings (a) and (b) of convention S). "To X% of control" has readings (Q1) mean over units
#   of the photoinhibition rate over mean over units of the control rate, (Q2) mean over units of
#   each unit's ratio, (Q3) median of each unit's ratio.
# O (onset of inhibition in spikes; Methods, last paragraph of Electrophysiology data analysis).
#   Population PSTH in 1 ms bins; onset is the time after photostimulus onset when the
#   photoinhibition PSTH falls more than 3 standard deviations below control, the standard
#   deviation taken from the control condition during the delay epoch; SEM by resampling units with
#   replacement, 1000 times. Open: the level the 3 SD are counted from, readings (O1) the control
#   PSTH in the same bin, (O2) the mean of the control PSTH over the delay epoch. The Methods'
#   wording ("the membrane potential passed") is read as the PSTH, as the paragraph is about
#   extracellular units.
# V (membrane potential; Methods, In vivo whole-cell recording). Spikes clipped by the 'kink'
#   rule (derivative above 3 SD of its value 2.5 to 1.5 ms before the spike peak; -0.5 to 5 ms
#   around the kink interpolated). Onset of a Vm change is when Vm changes by more than 3 SD from
#   the baseline, mean and SD taken from 20 ms before to 2 ms after photostimulus onset in
#   photoinhibition trials; SEM of means and onsets by bootstrapping. Open: onset of the cell-mean
#   trace with bootstrap SEM over cells (V1), or the mean of per-cell onsets (V2).
# L (location). VM/VAL units are those within 0.4 mm of the VM/VAL centre, "determined from
#   retrograde labeling experiments, Extended Data Fig. 1" (cells labelled from ALM). The text
#   gives no coordinate for the centre. Open, readings (L1) the dataset's own location label for
#   VM/VAL, if it has one; (L2) within 0.4 mm of AP -1.5, ML 0.85, DV 4.0 mm, the RetroBeads
#   injection site "mainly in VM" of a different experiment (Extended Data Fig. 9 legend), a
#   proxy and not the centre the Methods cite. Units are overlaid on one coronal section (bregma
#   -1.76, Methods), so distance may be taken in ML and DV only. The counts 313 and 295 check the
#   reading.
