    times per trial at a proximal location (4,147 trials) and 0.9 +- 3.4 times at a distal location
    (4,173 trials), and licked 286 +- 329 ms after the first touch.
  source: Online Methods, Behavior, paragraph 2
  quote: Mice touched the pole at a proximal location multiple times ... 5.7 ± 5.3, mean ± s.d.,
    4,147 trials) ... Average performance (proportion of correct trials) was 0.72 ±
    0.11 (mean ± s.d., during the recordings of 111 cells) for cortical recordings and 0.71 ± 0.07
    for VPM recordings
  expected:
