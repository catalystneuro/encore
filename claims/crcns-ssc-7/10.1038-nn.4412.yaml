- id: fs-phase-coupling
  statement: L4 FS spikes are coupled to whisking phase; the phase relation is fit by a single
    sinusoid in 18 neurons and needs a second harmonic in 7 (n = 25).
  source: Results, Dynamics of L4 fast-spiking interneurons, paragraph 2; Supplementary Fig. 7g
  quote: Coupling between the spikes of L4 FS interneurons and the whisking phase was either fit with
    a single sinusoidal function (left, n=18) or a sum of a single sinusoidal function (black) and a
    sinusoidal function of twice the frequency (purple) (right, n=7) if the fitting quality (r2)
    was 50% higher than with only a single sinusoidal function
  expected:
  - quantity: FS neurons fit by a single sinusoid
    value: 18
    tolerance: 1.8
  - quantity: FS neurons fit by a sum with the second harmonic
    value: 7
    tolerance: 1
  criterion: By M-PHASE on whisking-epoch spikes. Reproduced when both counts are within tolerance
    under one binning.
- id: fs-hf-fluctuations
  statement: In L4 FS interneurons, membrane potential fluctuations at high frequencies (above 10
    Hz) increase with whisking in some cells but not in others (n = 7 whole-cell).
  source: Results, Dynamics of L4 fast-spiking interneurons, paragraph 2; Supplementary Fig. 8
  quote: Membrane potential fluctuations increased at high frequencies (>10 Hz) for some cells but
    not others (Supplementary Fig. 8)
  criterion: Spectra by M-SPEC per neuron in nonwhisking and whisking epochs for the 7 whole-cell FS
    neurons (Supplementary Fig. 8b shows per-neuron spectra with 95% confidence intervals). The
    paper gives no count or band; fixed here, a neuron shows the increase when whisking power lies
    above the nonwhisking jackknife 95% interval over most of the band, with the band readings of
    l4e-hf-fluctuations ((a) 10 to 100 Hz, (b) 10 to 500 Hz). Reproduced when, under one reading,
    at least one and at most six of the 7 neurons show the increase.
