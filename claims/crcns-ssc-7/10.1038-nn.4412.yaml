    value: 0.72
    tolerance: 0.072
  - quantity: proportion correct, VPM recordings, mean over 29 cells' sessions
    value: 0.71
    tolerance: 0.071
  - quantity: touches per trial, proximal (lick) pole, mean
    value: 5.7
    tolerance: 0.57
  - quantity: touches per trial, distal (no-lick) pole, mean
    value: 0.9
    tolerance: 0.09
  - quantity: reaction time from first touch, mean
    value: 286
    tolerance: 28.6
    unit: ms
  criterion: Performance per recorded cell is the proportion of correct trials in that cell's
