    GABAergic activation.
  source: Results, Inhibition is driven by thalamus, paragraph 1; Supplementary Fig. 9b to f
  quote: photoinhibition of thalamus hyperpolarized excitatory neurons and reduced the amplitudes of
    their membrane voltage fluctuations (Supplementary Fig. 9a–e). Onset latency of Vm
    hyperpolarization induced by thalamus inactivation was 4.2 ms. This was longer than the 2.8-ms
    latency measured with direct cortical GABAergic activation
  expected:
  - quantity: onset latency of hyperpolarization, thalamic photoinhibition
    value: 4.2
    tolerance: 0.42
    unit: ms
  - quantity: onset latency of hyperpolarization, direct cortical GABAergic activation
    value: 2.8
    tolerance: 0.28
    unit: ms
  criterion: For the 12 L4 E neurons of Supplementary Fig. 9c to e, resting Vm outside touch and
    the variance of Vm high-pass filtered at 10 Hz, outside touch, in laser and control trials
    (Supplementary Fig. 9d,e legend). The paper names no test; one is fixed from M-STAT, a
    two-sided signed-rank test at p < 0.05 for lower Vm and lower variance. Latency on the grand
    average Vm aligned to laser onset (Supplementary Fig. 9c, and 9f for the 7 neurons with direct
