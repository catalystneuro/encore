  source: Results, Dynamics of L4 fast-spiking interneurons, paragraph 1; Figs. 4b,c and 5
  quote: FS interneurons were active during baseline conditions, even in the absence of whisker
    movements (mean ± s.d., 9.3 ± 8.5 spikes per s; median, 6.4 spikes per s; n = 26 neurons
  expected:
