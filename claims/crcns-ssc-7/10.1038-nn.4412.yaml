    between laser power (control as zero) and rate per neuron, and a two-sided signed-rank test
    over neurons of the correlations against zero. Reproduced when the test gives p < 0.05 with
    negative correlations for FS neurons in at least two of the three epochs. The same test on
    the VPM multiunits (Supplementary Fig. 9i) is reported as a variant.
- id: rabies-vpm-input
