- id: thalamus-inhibition-dose
  statement: The reduction of L4 FS spiking by thalamic photoinhibition is dose dependent.
  source: Results, Inhibition is driven by thalamus, paragraph 2; Supplementary Fig. 9i,j
  quote: in a dose-dependent manner (Supplementary Fig. 9i,j)
  criterion: Rates by laser power, per behavioral epoch for FS neurons and unsplit for multiunits
