    is reported beside the control value of l4e-touch-psp.
- id: ion-cut-l4e-whisking
  statement: After ION transection whisking-related depolarization of L4 excitatory neurons is
    reduced (0.62 +- 0.50 mV, n = 9, against 1.54 +- 0.79 mV in 15 control neurons with matched
