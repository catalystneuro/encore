- id: enphr-pv-latency
  statement: eNpHR stimulation strongly inhibits 3 of 4 recorded L4 PV interneurons; their spike
    rate falls 3 ms after laser onset and L4 excitatory activity rises only 2 ms later.
  source: Results, Layer 4 FS interneurons suppress reafference in L4, paragraph 6; Supplementary
