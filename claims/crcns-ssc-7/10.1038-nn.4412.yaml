    3e-4, n = 17 multiunit recordings).
  source: Results, Inhibition is driven by thalamus, paragraph 1; Fig. 6b,c
  quote: Photoactivation of TRN axons reduced activity in the thalamus (to 17% of control, P = 3 ×
    10−4, n = 17 multiunit recordings
  statistics:
  - test: not named; paired comparison, Wilcoxon signed-rank by the Statistical analysis paragraph
    p: 3.0e-4
