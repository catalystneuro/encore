    +- 0.8 ms, median 4.7; amplitude 6.0 +- 2.9 mV, median 5.7; n = 37).
  source: Results, Membrane-potential dynamics of L4 excitatory neurons, paragraph 2; Fig. 2f;
    Supplementary Fig. 3a
  quote: Touches evoked short-latency depolarizations ... mean ± s.d., 4.8 ± 0.8 ms; median, 4.7 ms
    ... mean ± s.d., 6.0 ± 2.9 mV; median, 5.7 mV; n = 37 neurons) for all neurons
  expected:
  - quantity: touch PSP latency, mean
    value: 4.8
    tolerance: 0.48
    unit: ms
  - quantity: touch PSP latency, median
    value: 4.7
    tolerance: 0.47
    unit: ms
  - quantity: touch PSP amplitude, mean
    value: 6.0
    tolerance: 0.6
    unit: mV
  - quantity: touch PSP amplitude, median
    value: 5.7
    tolerance: 0.57
    unit: mV
  criterion: Latency by M-LAT and amplitude by M-VM on each neuron's average touch-aligned Vm
    (M-TOUCH). Reproduced when the four values are within tolerance under one reading and every
    neuron's amplitude is positive.
- id: l4e-whisking-vm
  statement: Whisking induces only a small depolarization or hyperpolarization in L4 excitatory
    neurons (1.2 +- 2.1 mV, median 1.2 mV).
  source: Results, Membrane-potential dynamics of L4 excitatory neurons, paragraph 2; Fig. 2f
  quote: Whisking induced small depolarization or hyperpolarization (mean ± s.d., 1.2 ± 2.1 mV;
    median, 1.2 mV; Fig. 2f)
  expected:
  - quantity: whisking Vm change, mean over 37 neurons
    value: 1.2
    tolerance: 0.35
    unit: mV
  - quantity: whisking Vm change, median
    value: 1.2
    tolerance: 0.12
    unit: mV
  criterion: Whisking depolarization by M-VM over the 37 neurons. Reproduced when both values are
    within tolerance under one reading.
- id: l4e-distance-threshold
  statement: Touch moves the membrane potential of L4 excitatory neurons much closer to spike
    threshold than whisking does (shift 6.1 +- 3.2 mV against 1.1 +- 2.0 mV, P = 1e-7, Wilcoxon
    signed-rank).
  source: Results, Membrane-potential dynamics of L4 excitatory neurons, paragraph 2; Fig. 2g,h
  quote: Compared to whisking, touch caused a larger shift of membrane potential toward spike
    threshold (whisking, 1.1 ± 2.0 mV; touch, 6.1 ± 3.2 mV; P = 1 × 10−7, Wilcoxon signed-rank test
  statistics:
  - test: Wilcoxon signed-rank test
    p: 1.0e-7
    n: 37 L4 excitatory neurons
  expected:
  - quantity: whisking shift of 10th-percentile distance to threshold, mean
    value: 1.1
    tolerance: 0.33
    unit: mV
  - quantity: touch shift of 10th-percentile distance to threshold, mean
    value: 6.1
    tolerance: 0.61
    unit: mV
  criterion: Shifts by M-DTT, threshold by M-VM. Reproduced when both means are within tolerance
    and a two-sided signed-rank test of touch against whisking shifts over the 37 neurons gives p
    < 0.05 with touch larger.
- id: l4e-reversal-potential
  statement: The effective reversal potential of the touch response in L4 excitatory neurons is
    more depolarized than resting Vm, while that of the whisking response is close to resting Vm
    and more hyperpolarized than that of touch.
  source: Results, Membrane-potential dynamics of L4 excitatory neurons, paragraph 2;
    Supplementary Fig. 4
  quote: The effective reversal potential29 of the touch response was more depolarized than the
    resting Vm and sometimes crossed the spike threshold (Supplementary Fig. 4). In contrast, the
    effective reversal potential for whisker movement was close to the resting Vm, below the spike
    threshold and more hyperpolarized than that for touch
  criterion: From the Supplementary Fig. 4 legend. Per touch, pre-Vm the mean 0 to 5 ms before
    onset and post-Vm at the time of the neuron's peak average PSP; per whisking onset, pre-Vm the
    mean 0 to 200 ms before and post-Vm the mean 100 to 300 ms after. A line fitted to delta Vm
    against pre-Vm per neuron and event type; the reversal potential is where it crosses zero. Open
    whether one line is fitted per neuron or one over all neurons (Supplementary Fig. 4b shows
    "all neurons"); readings, (a) per neuron, (b) pooled, both reported. The paper names no test,
    so one is fixed from M-STAT. Reproduced when, per neuron, the touch reversal exceeds the
    whisking reversal by a two-sided signed-rank test at p < 0.05, the touch reversal exceeds
    resting Vm in most neurons, and the median whisking reversal lies within 5 mV of the median
    resting Vm (a margin fixed here, as the paper gives none). Neurons whose fit has a
    non-negative slope have no crossing and are counted and left out.
- id: l4e-hf-fluctuations
  statement: Whisking enhances membrane potential fluctuations of L4 excitatory neurons at high
    frequencies (above 10 Hz).
  source: Results, Membrane-potential dynamics of L4 excitatory neurons, paragraph 2; Supplementary
    Fig. 5
  quote: and enhanced membrane potential fluctuations at high frequencies (>10 Hz; Supplementary
    Fig. 5)
  criterion: Spectra by M-SPEC per neuron in nonwhisking and whisking epochs. The paper names no
    test or upper frequency, so these are fixed here; readings, mean power (a) 10 to 100 Hz, (b) 10
    to 500 Hz. Reproduced when, under one reading, whisking power exceeds nonwhisking power by a
    two-sided signed-rank test over the 37 neurons at p < 0.05. The number of neurons whose
    jackknife 95% intervals separate above 10 Hz is reported.
- id: l4e-inhibition-window
  statement: In L4 excitatory neurons depolarized near the excitatory reversal potential, touch
    evokes strong transient inhibition that follows excitation with a short delay (0.4 +- 0.8 ms at
    half max, range -0.8 to 1.6 ms, n = 6).
  source: Results, Membrane-potential dynamics of L4 excitatory neurons, paragraph 3; Fig. 3b to d;
    Discussion, paragraph 3
  quote: Touch elicited strong and transient inhibitory input (Fig. 3b,c), which followed excitation
    with a short delay (mean ± s.d., 0.4 ± 0.8 ms at half max; n = 6 neurons; Fig. 3d)
  expected:
  - quantity: delay of inhibition after excitation at half max, mean over 6 neurons
    value: 0.4
    tolerance: 0.33
    unit: ms
  - quantity: smallest delay
    value: -0.8
    tolerance: 0.1
    unit: ms
  - quantity: largest delay
    value: 1.6
    tolerance: 0.16
    unit: ms
  criterion: For each of the 6 neurons, touch-aligned averages (M-TOUCH) at rest and during
    depolarizing current injection (Online Methods, Barrel cortex recordings, paragraph 3, for the
    depolarized state near 0 mV). Each average is normalized to its peak (Fig. 3d); the delay is
    the time the depolarized average reaches half its negative peak minus the time the resting
    average reaches half its positive peak. Reproduced when the mean is within tolerance and the
    smallest and largest delays over the 6 neurons each match the bounds of the range (from the
    Discussion, paragraph 3) within their tolerances. The tolerance on -0.8 ms is one sample at
    10 kHz (0.1 ms), since 10% (0.08 ms) is below the sampling interval.
- id: l4e-whisking-inhibition
  statement: Without touch, inhibitory input in L4 excitatory neurons is more prevalent at the
    onset of whisker movement, and after onset excitation and inhibition increase gradually with
    indistinguishable time courses over about 100 ms.
  source: Results, Membrane-potential dynamics of L4 excitatory neurons, paragraph 3; Fig. 3e to g
  quote: In the absence of touch, inhibitory inputs occurred spontaneously but were more prevalent
    at onset of whisker movement (Fig. 3e,f) ... After the onset of whisker movement, excitation
    and inhibition increased gradually, with indistinguishable time courses, over approximately 100
    ms (Fig. 3g)
  criterion: For the 6 neurons, whisking-onset averages (M-EPOCH) at rest and depolarized. The
    paper names no test or window; the test is fixed here from M-STAT, the 0 to 200 ms before onset
    and 100 to 300 ms after are the Supplementary Fig. 4 windows, and the 0 to 200 ms after onset
    and the 150 ms bound are fixed here from "approximately 100 ms". Inhibition at onset, the depolarized
    average 0 to 200 ms after onset falls below its mean 0 to 200 ms before, by a two-sided
    signed-rank test over the 6 neurons or in at least 5 of 6. Time course, each average
    normalized to its mean 100 to 300 ms after onset; the time to half of that level lies between
    0 and 150 ms for both, and the two times do not differ by a two-sided signed-rank test (p >=
    0.05). Reproduced when both parts hold.
- id: fs-baseline-rate
  statement: L4 FS interneurons are active at baseline, even without whisker movement (9.3 +- 8.5
