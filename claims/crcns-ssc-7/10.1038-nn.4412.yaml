  expected:
  - quantity: latency of PV rate decrease after laser onset
    value: 3
    tolerance: 1
    unit: ms
  - quantity: delay of L4 E increase after the PV decrease
    value: 2
    tolerance: 1
    unit: ms
  - quantity: PV interneurons strongly inhibited by eNpHR, of 4
    value: 3
    tolerance: 1
  criterion: Grand-average spike rate of the L4 PV (FS) neurons and of the L4 E neurons aligned to
