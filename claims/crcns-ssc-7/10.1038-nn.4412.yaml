- id: ion-cut-l4e-touch
  statement: After ION transection L4 excitatory neurons do not depolarize after touch.
  source: Results, Inhibition is driven by sensory input, paragraph 2; Fig. 7b
  quote: As expected, L4 excitatory neurons did not depolarize after touch (Fig. 7b)
  criterion: A claim of absence. Touch PSP amplitude by M-VM and M-TOUCH for the ION-cut L4 E
