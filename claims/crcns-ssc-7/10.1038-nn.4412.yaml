# Claims for Yu, Gutnisky, Hires & Svoboda (2016), "Layer 4 fast-spiking interneurons filter
# thalamocortical signals during active somatosensation", Nat Neurosci 19(12), 1647-1657,
# doi:10.1038/nn.4412, on CRCNS ssc-7 (doi:10.6080/K0T43R01).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-06,
# protocol as stated in docs/protocol.md (version pilot-13), Reader steps 1 to 4.
#
# Text read: the version of record (PDF supplied by a person, extracted to text), its main text,
# figure legends and Online Methods, with the supplement (41593_2016_BFnn4412_MOESM61_ESM.pdf), the
# legends of Supplementary Figures 1 to 14 and Supplementary Tables 1 (mice) and 2 (mouse lines and
# cell counts by recording method). The supplementary videos are not text and were not used. The
# PDF pages could not be rendered here (no renderer installed), so no figure was read as an image;
# values printed only inside figure panels were not claimed, except where the text extraction
# keeps them and says which comparison they label.
#
# Code read: none. The paper's only code statement is "Data and code related to this study are
# available at http://crcns.org/ at http://doi.org/10.6080/K0T43R01", which is this dataset. The
# data descriptor says the code is the dataset's folder "example_analysis_code". That folder is one
# of the dataset's files, which a reader does not open, so every method below is taken from the
# paper alone; the author may read that code and cite it for a detail the claims file leaves open.
# The data descriptor (ssc-7, version 0.6, and unit_names.txt) was read only to know what the
# dataset holds; no claim comes from it.
#
# The data the paper used, as it reports them. Head-fixed mice performing a lick/no-lick pole
# localization task with 1 to 3 whiskers of one row (Results, paragraph 1; Online Methods,
# Behavior). Pole in an anterior (no-lick) or one of several posterior (lick) locations; a sample
# epoch of at least 1.1 s; whisker video at 1,000 fps for 5 s per trial, tracked with the Janelia
# Whisker Tracker (whisker angle, curvature change, touch onsets and offsets); licks. Only
# touches by the principal whisker are analysed. Recordings, by cell type (Results; Supplementary
# Table 2):
#   VPM. 29 single units from chronic 32-channel silicon probes in 6 VGAT-ChR2-EYFP mice, sampled
#   at 19,531.25 Hz, spike sorted (Figs. 1, 5; Supplementary Figs. 1, 2). Example units 14.3.244,
#   8.2.99 and 2.3.95. 17 thalamic multiunit recordings with patch pipettes during TRN
#   photostimulation (Fig. 6b,c).
#   L4 excitatory (E) neurons. 37 whole-cell recordings in control mice (Figs. 2, 3, 5;
#   Supplementary Figs. 3 to 5), 6 of them with depolarizing current injection (Fig. 3); 48
#   loose-seal cell-attached recordings; 85 in all for spiking (Fig. 5). 40 neurons (cell-attached
#   and whole-cell) in PV-IRES-Cre mice expressing eNpHR3.0 in PV cells, with and without yellow
#   light (Fig. 8). Whole-cell recordings during thalamic photoinhibition (Supplementary Fig. 9,
#   n = 12). After infraorbital nerve (ION) transection, 8 to 10 whole-cell L4 E neurons (Fig. 7b
#   to e, Supplementary Fig. 11). Example neurons E No. 1, 24 and 32 (whole-cell) and cell-attached
#   No. 1 to 3.
#   L4 fast-spiking (FS) interneurons. 26 neurons, 7 whole-cell (Fig. 4) and the rest
#   cell-attached, identified by ChR2 tagging in VGAT-ChR2-EYFP mice, by eNpHR inactivation in
#   PV-IRES-Cre mice (4) or by spike waveform (Online Methods, Barrel cortex recordings; Figs. 4, 5;
#   Supplementary Figs. 6, 7). FS neurons during thalamic photoinhibition (13 to 15, Fig. 6d,e). 10
#   FS neurons after ION transection (Fig. 7f to i).
#   Whole-cell Vm sampled at 10 or 20 kHz. Laser trials (ChR2 tagging pulses; 100 Hz 5 ms pulses
#   to TRN axons in VPM, 25 to 50% of trials; constant 594 nm light for eNpHR).
#   Behavior across sessions (Online Methods, Behavior, paragraph 2) and PV suppression in 8 mice
#   (Supplementary Fig. 14). Rabies tracing (Supplementary Fig. 10) is histology.
#   The paper disagrees with itself on two counts. L4 FS neurons are 26 in the Results and in the
#   Online Methods (19 + 4 + 1 + 2), but 25 in the Supplementary Fig. 7 legend and in the sum of
#   Supplementary Table 2 (5 + 1 + 1 whole-cell, 14 + 4 cell-attached). L4 E neurons after ION
#   transection are 8 (Fig. 7b), 9 (Results, Fig. 7c,d; Supplementary Table 2) or 10
#   (Supplementary Fig. 11). Each claim keeps the n of its own passage.
#
# Tolerances. A mean reported as mean +- s.d. over n neurons, trials or sessions takes as
# tolerance the standard error derived from the paper's spread, s.d./sqrt(n), or 10% of the value
# when that is larger: the s.d. describes the spread of neurons, not the precision of the mean, and
# the standard error is the paper's own uncertainty on the mean. A mean +- s.e.m. takes the s.e.m.
# Medians, single neurons' values, percentages and correlation coefficients take 10%. A count of
# neurons or mice takes 10%, and at least 1. A reported range holds inside the range widened by 10%
# of each bound. All tolerances are computed this way unless the claim says otherwise.
#
# Methods the analysis rests on, with what is open. Criteria below refer to these by label. Every
# part is from the Online Methods (Data analysis, Statistical analysis) unless said otherwise.
# M-STAT. "Statistical comparisons used the Wilcoxon rank sum test (unpaired), Wilcoxon signed-rank
#   test (paired) and Kruskal-Wallis one-way analysis of variance." Where a passage gives a P value
#   without naming its test, the test is the signed-rank test for paired comparisons (the same
#   neurons in two conditions) and the rank-sum test for unpaired ones, two-sided, as this sentence
#   implies. Where the paper reports a finding with no test at all, a criterion fixes one from this
#   list and says so.
# M-TOUCH. Touches by the principal whisker only, pooled across pole locations. Intertouch interval
#   (offset of the previous touch to onset of the next) at least 25 ms for Figs. 1 to 7 and at least
#   10 ms for Fig. 8e. Touch PSTHs in 1 ms bins. Spikes per touch, for cortical neurons, the mean
#   spike count 0 to 50 ms after touch onset minus 2 times the mean count 0 to 25 ms before (Fig. 5),
#   or 4 to 20 ms after minus 0 to 16 ms before (Fig. 8e); for VPM, 0 to 25 ms after minus 0 to
#   25 ms before. Open, whether touches with a short interval are dropped or only their windows
#   shortened; reading, touches whose interval to the previous touch is below the minimum are
#   dropped.
# M-LAT. Spike latency, from touch onset to the time dPSTH/dt crosses 3 s.d. of dPSTH/dt 0 to 25 ms
#   before touch; cells excluded whose touch PSTH never reaches 10 spikes/s in any 1 ms bin 0 to
#   100 ms after touch, or whose dPSTH/dt never crosses. Vm latency, from touch onset to the time
#   dVm/dt crosses 3 s.d. of dVm/dt 0 to 25 ms before touch. Open, the duration of the VPM touch
#   response "(25% of spike rate increase from baseline to peak)"; reading, the time between the
#   rising and falling crossings of baseline + 25% of (peak - baseline) on the touch PSTH, baseline
#   the mean rate 0 to 25 ms before touch.
# M-EPOCH. Whisker angle bandpass filtered 6 to 60 Hz (4th order Butterworth), Hilbert transform
#   for amplitude and phase (0 most protracted, +-pi most retracted). Whisking epochs are whisking
#   cycles whose amplitude at phase 0 exceeds 2.5 degrees, excluding +-100 ms around licks and -10
#   to 100 ms around touches. Nonwhisking epochs are periods of at least 100 ms with amplitude
#   below 1.25 degrees, without touch or licking. Whisking onsets (transitions) are the end of a
#   nonwhisking epoch followed by a rise of mean amplitude of at least 2 degrees, with no touch
#   within 250 ms; data after a later touch are set to NaN; PSTHs in 10 ms bins. Open, with
#   readings. A cycle runs from one phase crossing of -pi to the next (the reading the phase
#   convention implies). The margin around touches and licks for nonwhisking epochs is (a) the
#   same as for whisking epochs, or (b) none beyond their absence. The rise of 2 degrees is
#   measured (a) over the 250 ms after onset, the window the touch rule uses, or (b) over 100 ms,
#   the shortest nonwhisking epoch. If the dataset holds the paper's own epoch or event times,
#   those are used and the rebuild is a variant.
# M-RATE. Spike rate in nonwhisking and whisking is estimated from the extracted epochs, with a
#   bootstrap (1,000 iterations) for its 95% confidence interval. Open, how epochs are combined;
#   readings, (a) total spikes over total epoch time, (b) the mean of per-epoch rates. In
#   experiments with laser trials, the Fig. 5 measures use control (no laser) trials only, the
#   reading the comparisons with photostimulation imply.
# M-SIG. A neuron "significantly increased" or decreased its rate with whisking by a Wilcoxon
#   rank-sum test (Results, paragraphs 3 and 9), at p < 0.05 (the largest P the paper lists is
#   0.046). Open, the samples compared; readings, (a) per-epoch spike rates of whisking against
#   nonwhisking epochs, (b) per-trial rates in whisking against nonwhisking periods.
# M-VM. Spikes removed by interpolating Vm from 1 ms before to 4 ms after each spike threshold;
#   threshold where dVm/dt exceeds 3 s.d. of the trial's dVm/dt. Spike threshold per trial from a
#   line fitted to thresholds against trial number; -42 mV for silent neurons. Open, with readings.
#   Resting Vm, (a) mean Vm in nonwhisking epochs, spikes removed, (b) median Vm outside touch
#   (Supplementary Fig. 9d computes resting Vm "from Vm outside touch"). Touch PSP amplitude, the
#   peak of the average touch-aligned Vm (Supplementary Fig. 4 legend, "the time of peak average
#   touch-evoked PSP") minus the mean 0 to 5 ms before touch, the peak sought (a) 0 to 50 ms after
#   touch, the window of Figs. 2d and 4d, or (b) 0 to 25 ms. Whisking depolarization, from the
#   Supplementary Fig. 4 legend, (a) mean Vm 100 to 300 ms after whisking onset minus mean 0 to
#   200 ms before, per transition, averaged per neuron; or (b) mean Vm in whisking epochs minus
#   mean Vm in nonwhisking epochs. The s.d. given for a single example neuron is read as the s.d.
#   across that neuron's touches or transitions.
# M-DTT. Distance to threshold is spike threshold minus Vm over all time, in nonwhisking, whisking
#   and touch (4 to 50 ms after touch onset) epochs, with its 10th percentile per neuron and epoch.
#   The "shift toward spike threshold" of the Results is the nonwhisking 10th percentile minus the
#   whisking or touch 10th percentile (Fig. 2g,h). Open, whether spikes are removed first; readings,
#   (a) removed, as M-VM does for every Vm measure, (b) not removed (the axes of Fig. 4h run below
#   0 mV, which suggests Vm above threshold is kept).
# M-PHASE. Spike rate or Vm binned by whisking phase and fit with a sinusoid (Supplementary Figs.
#   2, 3, 7) or a sum of a sinusoid and one of twice the frequency (Supplementary Fig. 7g, used when
#   its r2 is 50% higher); coupling strength is half the peak-to-trough of the fit; r2 > 0.25 marks
#   a good fit (Supplementary Figs. 2e, 3f, 12). Open, the number of phase bins; readings, 8 and 16
#   equal bins over -pi to pi, both reported.
# M-SPEC. Multitaper spectra (Chronux) of 500 ms Vm segments from nonwhisking and whisking epochs,
#   mean removed, spikes removed, resampled to 4,096 Hz, 3 Slepian tapers (4 Hz resolution),
#   jackknife confidence intervals.
# M-ROC. For each trial, spikes around the first touch, or, without touch, in the sample epoch;
#   spike counts in 250 ms before and after; the count difference as the detection variable; an ROC
#   curve over thresholds and its AUC, touch against no-touch, computed separately for control and
#   eNpHR trials; "We resampled the touch or no-touch periods 5,000 times". Open, with readings,
#   the reference time in a no-touch trial and the resampling, (a) 5,000 reference times drawn at
#   random within the sample epochs of no-touch trials, each giving a count difference, (b) the
#   reference at the median first-touch time of the session's touch trials, with 5,000 bootstrap
#   resamples of trials and the mean AUC. The touch-evoked rate of Fig. 8g,h is the mean rate 0 to
#   250 ms after touch onset minus the mean 0 to 250 ms before (Fig. 8 legend).
# M-LIGHT. Photostimulation measures compare laser trials with control trials. Open, the period
#   used; readings, (a) the epochs (nonwhisking, whisking, touches) that fall within the laser-on
#   period of laser trials, against the same epochs within the same period of control trials, (b)
#   the epochs of whole trials. For thalamic photoinhibition, laser power varied (Supplementary
#   Fig. 9i,j); readings, (c) all laser trials pooled, (d) the highest power only. "To x% of
#   control" is read as (e) the ratio of population mean rates, laser over control, or (f) the
#   median over neurons of the per-neuron ratio.
#
# Data. Every claim's test uses the paper's own recordings (data: dataset). The paper relies on no
# outside data. Whether the dataset holds each recording type (for example the rabies histology,
# the ION-cut L5 recordings or the behavioral sessions of Supplementary Fig. 14) is for the author
# to find.
