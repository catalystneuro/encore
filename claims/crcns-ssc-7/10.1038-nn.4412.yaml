  - quantity: FS nonwhisking rate, median
    value: 6.4
    tolerance: 0.64
    unit: spikes/s
  criterion: Nonwhisking rate (M-EPOCH, M-RATE) for the L4 FS neurons of control mice. Reproduced
    when both values are within tolerance under one reading. The paper gives 26 neurons and 25 (see
    the opening comment); the notebook uses the neurons the dataset marks as L4 FS in control mice
    and reports their number.
