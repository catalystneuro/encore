    (0.4 +- 0.6 spikes/s, median 0.1) and whisking (0.6 +- 0.9 spikes/s, median 0.2; P = 0.20).
  source: Results, Dynamics of L4 fast-spiking interneurons, paragraph 3; Fig. 5b,d,e; Fig. 1f to j
  quote: Excitatory neurons responded mostly to touch (mean ± s.d., 0.3 ± 0.4 spikes per touch;
    median, 0.1 spikes per touch; n = 85 neurons; Fig. 5b,d) and showed weak response to whisker
    movement ... mean ± s.d., 0.4 ± 0.6 spikes per s; median, 0.1 spikes per s ... mean ± s.d., 0.6 ± 0.9 spikes per s; median, 0.2 spikes per s; n = 85, P = 0.20
  statistics:
  - test: not named; paired comparison, Wilcoxon signed-rank by the Statistical analysis paragraph
    p: 0.2
    n: 85 L4 excitatory neurons
  expected:
  - quantity: L4 E spikes per touch, mean
    value: 0.3
    tolerance: 0.043
  - quantity: L4 E spikes per touch, median
    value: 0.1
    tolerance: 0.01
  - quantity: L4 E nonwhisking rate, mean
    value: 0.4
    tolerance: 0.065
    unit: spikes/s
  - quantity: L4 E nonwhisking rate, median
    value: 0.1
    tolerance: 0.01
    unit: spikes/s
  - quantity: L4 E whisking rate, mean
    value: 0.6
    tolerance: 0.098
    unit: spikes/s
  - quantity: L4 E whisking rate, median
    value: 0.2
    tolerance: 0.02
    unit: spikes/s
  criterion: The 85 L4 E neurons of Fig. 5 (37 whole-cell and 48 cell-attached in Supplementary
