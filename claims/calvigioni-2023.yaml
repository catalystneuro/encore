- id: fig4e-opto-modulation-genotypes
  statement: Optogenetic activation strongly modulates mPFC units in Vglut2-cre and Esr1-cre mice but
    not in Npy-cre mice, while the auditory stimuli and air puffs modulate mPFC units in all four
    groups.
  source: Results, Pathway-specific aversive signals in the PFC, paragraph 2; Figure 4e and Extended
    Data Figure 7a
  quote: We found strong modulation of mPFC units in response to optogenetic activation only in
    Vglut2-cre and Esr1-cre and not in Npy-cre mice, while air puffs and auditory stimuli modulated
    mPFC activity in all four mouse groups
  depends_on:
  - ed7a-unit-counts
  criterion: The paper shows this as PSTHs and heatmaps and reports no test. The measure is the
    paper's own unit-level test, the GLM tuning of the Methods (Generalized linear model, Tuning
    scores; regressors of 200 ms for each sound, 500 ms after light onset and 500 ms after air puff
    onset, 100 ms bins, Poisson glmfit, 1,000 circular shifts of the session, a unit tuned when its
    beta exceeds the 99.9th or falls below the 0.01th percentile of the shifted betas). For each
    genotype, the fraction of GLM-fitted units tuned (either sign) to the optogenetic regressor is
    compared with that of Ctl by Fisher's exact test, and the fraction tuned to sound 1 and to air
    puff is compared with the chance rate of 0.11% (0.1% + 0.01%) by a one-sided binomial test.
    Fisher's and the binomial test are choices here, not the paper's. Reproduced when Vglut2 and Esr1
    have a higher opto-tuned fraction than Ctl at p < 0.05, Npy does not, and all four genotypes
    exceed chance for both sound 1 and air puff at p < 0.05. As a second reading, the block-2
    population PSTH of all units (10 ms bins, z-scored to the 1 s pre-tone baseline, Methods) averaged
    over 0.7 to 1.2 s after trial start, compared with baseline per genotype by a Wilcoxon signed-rank
    test over units at p < 0.05, is shown.
