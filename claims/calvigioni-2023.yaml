- id: code-outputs-link
  kind: link
  statement: The dandiset's 25 sessions are the 25 NWB files of the paper's session table, and the
    units selected from them by the paper's rules are the units listed in the code's per-session GLM
    outputs.
  source: Code availability; Esr1_NPX_code at commit 85187f3, utilities/Aversion_session_description.tsv
    and analysis/GLM_fitted/*_tmu.mat
  quote: The code generated during this study to analyze the Neuropixels dataset is available at
    https://github.com/PierreLeMerre/Esr1_NPX_code
  data: with_inputs
  criterion: Sessions are matched by subject and date in the file name (for example
    258412_20200915). Per session, units are selected as in Fig4g_GLM_tuning.m, which follows the
    Methods (In vivo electrophysiological data analysis) and adds one rule, units in ACAd, PL, ILA or
    ORBm by the location of their main channel (units electrodes, 0-indexed), ISI violation count over
    spike count < 0.01, mean session firing rate > 0.1 Hz, and mean spike count per 100 ms bin divided
    by 0.2 greater than 1. The link holds (reproduced) when all 25 sessions are present with the
    genotypes of the session table and the selected unit indices equal the tmu indices for at least
    22 of the 25 sessions; partially reproduced when the per-genotype counts are within 10% of those
    of the tmu files (406, 738, 482, 311) but fewer sessions match index for index; not reproduced
    otherwise. The mean session firing rate is computed from the dataset (spike count over recording
    duration) and compared with analysis/Mean_FR; the per-unit tuning scores in GLM_fitted may be
    used as an outside check of the tuning claims below.
