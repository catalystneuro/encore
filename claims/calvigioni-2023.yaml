  criterion: The paper does not say how the onset latency was detected (Extended Data Fig. 7b-d,
    10 ms bins, average population firing per subregion). Readings, both run, per genotype and per
    subregion on the population PSTH of block 1 (tone) and block 4 (air puff) in 10 ms bins, the
    first bin after the event onset where the population rate exceeds the pre-event baseline mean by
    (a) 3 or (b) 2 baseline standard deviations for two consecutive bins. Reproduced when, under a
    reading, the latencies of the four genotypes lie within 20 ms (two bins) of one another for the
    tone and for the air puff in at least three of the four subregions. The 20 ms bound is a choice
    here, as the paper gives no numbers.
