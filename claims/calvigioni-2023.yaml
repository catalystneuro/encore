# Claims for Calvigioni, Fuzik, Le Merre et al. (2023), "Esr1+ hypothalamic-habenula neurons shape
# aversive states", Nature Neuroscience 26, 1245-1255, on dandiset 000473.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-08,
# protocol as stated in docs/protocol.md.
#
# Text read: the version of record (open access, CC BY 4.0), full text with Methods, figure legends
# and Extended Data legends, as extracted in paper/10.1038-s41593-023-01367-8.txt, and the
# Supplementary Information PDF (41593_2023_1367_MOESM1_ESM.pdf: Supplementary Methods for the
# behavioral tests and the head-fixed protocol, and Supplementary Tables 1 to 10). The text of the
# supplement holds only the table captions; Supplementary Tables 4 to 10 were read from the rendered
# PDF pages (pages 8 to 11), as they are images. The source data files and the supplementary videos
# were not available and are not needed by any claim below.
#
# Code read: https://github.com/PierreLeMerre/Esr1_NPX_code at commit 85187f3 (2023-04-17), the
# Neuropixels analysis the paper links. It holds MATLAB scripts for the PSTHs and heatmaps (Fig. 4e,
# Extended Data Fig. 7a), the GLM and tuning scores (Fig. 4g, Extended Data Fig. 8), the hierarchical
# clustering (Fig. 4h, Extended Data Figs. 8r and 9b-g), the activity modes (Fig. 4i,j,l, Extended
# Data Fig. 9), Python scripts for the PCA (Extended Data Fig. 9a) and the decoding (Fig. 4k,
# Extended Data Fig. 9n,o), Julia scripts for the pupil and eye-closing statistics (Fig. 4f, Extended
# Data Fig. 7g, j) that read intermediate CSV files not in the repository, a session table
# (utilities/Aversion_session_description.tsv: 25 NWB files, 5 NPY-Cre, 5 Vglut2-cre, 5 C57BL-6J,
# 5 Esr1-Cre-retro and 5 Esr1-Cre-antero, with an Analyze flag that is 0 only for
# 128515_20191216-probe0.nwb), per-session mean firing rates (analysis/Mean_FR) and per-session GLM
# outputs (analysis/GLM_fitted: indices of GLM-fitted units, tuning scores, tuned flags, RS and FS
# flags). The scripts read the NWB files directly: trials with a 'Block' column, units with a
# 'quality' column whose first row is the ISI violation count, 'FS' and 'RS' unit flags, electrode
# 'location' labels from the Allen CCF, and 'spike saturation start' and 'stop' in analysis.
# The GLM_fitted outputs list 1,937 GLM-fitted units: 406 NPY, 738 Vglut2, 482 C57BL-6J (as in
# Extended Data Fig. 8b) and 311 Esr1 (319 in Extended Data Fig. 8b), with zero units for
# 128515 (NPY) and for the Esr1 sessions 258412, 259112 and 273853.
#
# Where the Methods and the code disagree, the Methods are followed for the main result and the code
# is named as a variant: the GLM fit includes only units with mean(count per 100 ms bin)/0.2 > 1 in
# the code (commented "mean FR > 0.2Hz"), which the Methods do not mention; the code takes the
# primary tuning as the signed maximum of the tuning scores, the Methods the absolute maximum; the
# code tests cluster baselines with a rank-sum test times 6, the Methods and legend with a Wilcoxon
# signed-rank test; the code's activity-mode windows are a 2 s baseline and a 1 s window starting
# 0.7 s after trial start, the Methods give a 1 s baseline and 500 ms after stimulus onset; the
# code's clustering smooths with a 5-point gausswin, the Methods with a Gaussian of sigma 0.8.
#
# Data the paper used, as it reports them. Most of the paper is ex vivo patch-clamp, Patch-seq,
# anatomy and freely moving behavior (Figs. 1 to 3 and 5, Extended Data Figs. 1 to 6 and 10); the
# Patch-seq data are in BioStudies S-BSST1069. The dandiset (DANDI:000473, version 0.230417.1502
# cited in the paper) holds the Neuropixels recordings of Fig. 4 and Extended Data Figs. 7 to 9:
# acute recordings in the left mPFC of 25 head-fixed male mice, one Neuropixels 1.0 (Phase 3B)
# probe per mouse, 30 kHz, Kilosort 2.0 and manual curation in phy, probe tracks registered to the
# Allen CCFv3 with SHARP-Track. Groups: Esr1-cre (10 mice, 5 with retrograde and 5 with anterograde
# ChR2 targeting of LHA-LHb neurons), Vglut2-cre (5), Npy-cre (5) and C57BL/6J controls (5), with
# bilateral optic fibers over the LHb or LHA. Task, in blocks separated by at least 1 min:
# block 1, 50 trials of a 10 kHz pure tone (200 ms, 80 dB), ITI 3 to 9 s; block 2, 100 trials of
# the tone followed 500 ms after tone offset by a 500 ms 40 Hz light train (5 ms pulses, 6 mW),
# ITI 6 to 12 s; block 3, as block 1; block 4, 50 trials of blue noise (200 ms) followed 500 ms
# after its offset by a 50 ms air puff to the eye; blocks 5 to 8 (Supplementary Methods), 50 trials
# each of light alone at 0.3, 2, 6 and 10 mW, which no figure analyses. Pupil and eye were filmed at
# 50 Hz and tracked with DeepLabCut (4 pupil and 4 eye points, ellipse areas). Unit selection
# (Methods): 'good' units in ACAd, PL, ILA or ORBm with firing rate > 0.1 Hz and ISI violations
# < 1%, spikes within 1 s of LFP saturation removed; 4,152 units (Ctl 1,147, Vglut2 1,413, Npy 981,
# Esr1 611), of which 1,945 were fitted with the GLM. Extended Data Fig. 1e-j reports a separate
# optotagging experiment with probes in the LHA of Vglut2-cre mice, which the dandiset description
# does not mention.
schema_version: 2
