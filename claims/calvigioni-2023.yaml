- id: ed8h-waveform-classes
  statement: Waveform classification gives 564 narrow-spiking putative interneurons and 3,418
    wide-spiking putative pyramidal units, and both classes include units significantly tuned to
    the optogenetic stimulation.
  source: Results, Pathway-specific aversive signals in the PFC, paragraph 3; Extended Data Figure
    8h-m and Supplementary Tables 7 and 8
  quote: spike waveform classification showed significant tuning of both narrow-spiking putative
    inhibitory interneurons (nunit = 564) and wide-spiking putative pyramidal neuron units (nunit =
    3,418
  depends_on:
  - ed7a-unit-counts
  - fig4g-glm-units
  expected:
  - quantity: narrow-spiking units
    value: 564
    tolerance: 56.4
    unit: units
  - quantity: wide-spiking units
    value: 3418
    tolerance: 341.8
    unit: units
  criterion: Narrow-spiking when the peak-to-trough duration is below 0.38 ms and wide-spiking when it
    is above 0.44 ms (Extended Data Fig. 8h), among the 4,152 units; the code reads these classes from
    the units table's FS and RS flags, which are used if present, with the peak-to-trough rule as a
    check. Reproduced when both counts are within tolerance and, in Vglut2 and Esr1 mice, both
    classes contain GLM-fitted units tuned to the optogenetic regressor (Supplementary Table 7 gives
    253 WS and 33 NS positive in Vglut2, 77 WS and 13 NS in Esr1).
- id: ed8o-conditioned-units
  statement: Opto-modulated mPFC units in Vglut2-cre and Esr1-cre mice include conditioned units, whose
    response to the tone and the light changes over the trials of block 2.
  source: Results, Pathway-specific aversive signals in the PFC, paragraph 4; Extended Data Figure
    8n-q
  quote: We found that opto-modulated mPFC units in block 2 trials showed a number of conditioned units
    ... in Vglut2-cre and Esr1-cre mice
  depends_on:
  - ed7a-unit-counts
  criterion: The Methods (Conditioned units) run four Wilcoxon signed-rank tests per unit, comparing
    the mean rate 500 ms before the sound with the mean rate 500 ms after the selected event (the
    tone of block 2, the light, the blue noise and the air puff), over 50 trials, at Bonferroni alpha
    0.001/4, and call a unit conditioned when its response to the sound and to the light in block 2
    increased or decreased over the trials. How the change over trials is tested is open; readings,
    both run, (a) a unit whose tone response and light response are both significant in block 2;
    (b) a unit with a significant light response whose tone response differs between the first and
    last 10 trials of block 2 (Extended Data Fig. 8p,q) by a Wilcoxon rank-sum test at 0.001/4. For
    block 2, the 50 trials are every other trial, as in the Methods for heatmaps (the first 50 trials
    are shown as a variant). The paper states only that conditioned units were found in Vglut2-cre
    and Esr1-cre mice; comparing their fraction with Ctl is a choice here. Reproduced when, under a
    reading, Vglut2 and Esr1 mice each have conditioned units in block 2 at a fraction above that of
    Ctl; the fractions per genotype and block are reported.
- id: ed8r-comodulated-units
  statement: Vglut2-cre and Esr1-cre mice have more units comodulated by the optogenetic stimulation
    and the air puff than expected by chance.
  source: Results, Pathway-specific aversive signals in the PFC, paragraph 4; Extended Data Figure 8r
  quote: found that Vglut2-cre and Esr1-cre mice showed substantially comodulated aversion units
  depends_on:
  - fig4g-glm-units
  criterion: As in the Methods (Tuning scores), a unit is comodulated when its primary and secondary
    tunings are the optogenetic and the air puff regressors, in either order, and both are
    significant; the primary tuning is the regressor with the largest absolute tuning score (Methods;
    the code's signed maximum is a variant). The chance count is the product of the marginal
    probabilities of opto and air puff as primary and secondary tuning over the whole population of
    1,945 units, times the genotype's unit count (Methods; Extended Data Fig. 8r red bar). The paper
    gives no test; a one-sided binomial test of the observed count against the chance rate at
    p < 0.05 is used here as a choice. Reproduced when Vglut2 and Esr1 each exceed chance by that
    test; the Ctl and Npy results are reported.
- id: ed9a-pca-divergent-block2
  statement: Population trajectories are similar across the four groups in blocks 1, 3 and 4, and
    diverge in block 2 for Esr1-cre and Vglut2-cre mice compared with Npy-cre and control mice.
  source: Results, Pathway-specific aversive signals in the PFC, paragraph 5; Extended Data Figure 9a
  quote: We found similar activity trajectories during blocks with auditory stimuli (blocks 1 and 3)
    and in the block with air puffs across all four mouse groups ... In contrast, optogenetic drive
    of the Esr1+ and Vglut2+ LHA–LHb pathways resulted in dramatically divergent trajectories compared
    to Npy-cre and control mice
  depends_on:
  - ed7a-unit-counts
  criterion: As in the Methods (PC analysis) and Extended_Data_Fig9a_PCA.py, spikes in 10 ms bins from
    -0.1 to 3 s around trial onset, averaged over the trials of each block, z-scored, convolved with a
    Gaussian of sigma 2 bins, 550 units drawn at random per genotype, PCA with three components on
    the pooled 4 x 550 units for each block, and each genotype projected on its own loadings. The
    paper judged the trajectories by eye; the measure fixed here is, per block, the mean Euclidean
    distance in the three-component space between each genotype's trajectory and the Ctl trajectory,
    over 0.7 to 1.2 s after trial onset (the light window in block 2, the same window in other
    blocks), averaged over 20 random draws of 550 units. Reproduced when, in block 2, the Esr1 and
    Vglut2 distances both exceed the Npy distance and exceed their own distances in blocks 1, 3 and
    4 in at least 18 of the 20 draws.
- id: fig4h-opto-clusters
  statement: Hierarchical clustering of the activity of GLM-fitted units gives clusters of
    opto-modulated units, time-locked or sustained, whose units come from Vglut2-cre and Esr1-cre
    mice.
  source: Results, Pathway-specific aversive signals in the PFC, paragraph 5; Figure 4h
  quote: This unbiased classification identified two distinct clusters containing opto-modulated units
    (‘opto’ clusters), showing time-locked or sustained opto-modulation, and these units belonged to
    Vglut2-cre and Esr1-cre mice
  depends_on:
  - fig4g-glm-units
  expected:
  - quantity: units clustered after quality control
    value: 1770
    tolerance: 177
    unit: units
  criterion: As in the Methods (Hierarchical clustering) and the code, trial-averaged rates of the
    GLM-fitted units in 10 ms bins from -1 to 3 s around trial onset in each of the four blocks (1,600
    bins), smoothed (Gaussian of sigma 0.8 bins, Methods; 5-point gausswin, code, as a variant),
    z-scored across the four blocks, units with fewer than 200 bins above 0.5 Hz dropped, PCA, the
    first 20 component loadings as features, Ward linkage, 15 clusters. The number of units kept is
    1,770 in the Results and Fig. 4h, 1,788 in the Methods; either is accepted. A cluster is an
    opto cluster when the most common primary tuning of its units is the optogenetic regressor.
    Reproduced when two clusters are opto clusters and at least 90% of the units in each come from
    Vglut2 and Esr1 mice; partially reproduced when one cluster meets this.
- id: ed9bg-state-clusters
  statement: Five of the clusters ('state' clusters) contain units whose baseline firing rate rises in
    one block or ramps across blocks.
  source: Results, Pathway-specific aversive signals in the PFC, paragraph 5; Extended Data Figure
    9b-g and Supplementary Table 9
  quote: Interestingly, we observed five clusters (‘state’ clusters) with units showing a significant
    increase in baseline firing rate in one block or ramping baseline activity across blocks
  depends_on:
  - fig4h-opto-clusters
  criterion: Baseline is the mean rate over the 1 s before the sound onset, per unit and block
    (Methods; Extended Data Fig. 9b-g). Per cluster, the six block pairs are compared by a two-sided
    Wilcoxon signed-rank test over the cluster's units with Bonferroni correction for six comparisons
    (Methods and Supplementary Table 9; the code's rank-sum test is a variant). The Methods call the
    cluster names subjective, and neither they nor the code give a rule that yields the five state
    clusters; every cluster has a most common primary tuning, and in Supplementary Table 9 the
    clusters 'Air puff' 1, 'Sound' 2 and 'Sound' 6 also have significant baseline pairs (eight of the
    15 clusters in all). The claim is therefore judged on what the sentence states, clusters whose
    baseline shows at least one significant block pair with block means that rise in one block or
    change monotonically across blocks 1 to 4. Reproduced when at least five of the 15 clusters meet
    this; the count, and which of them are opto clusters by fig4h-opto-clusters, are reported.
- id: fig4i-activity-modes
  statement: Projection onto the 'opto OR air puff' mode separates block 2 from block 1 only in
    Esr1-cre and Vglut2-cre mice, and the 'state' mode separates the four blocks completely across
    time.
  source: Results, Pathway-specific aversive signals in the PFC, paragraph 7; Figure 4i
  quote: we found that the modulation along the activity mode capturing the optogenetic effect (‘opto
    OR air puff’) was specific to the activation of Esr1+ or Vglut2+ LHA–LHb neurons in block 2 ...
    the ‘state’ mode (baseline activity in block 4 versus block 1) captured distinct population
    activity modes in each of the four blocks, with complete separation of the block projections
    across time
  depends_on:
  - ed7a-unit-counts
  criterion: As in the Methods (Activity modes), trial-averaged rates in 50 ms bins over the four
    blocks, the per-unit mean rate subtracted, Gaussian smoothing (sigma 0.8 bins); modes are the
    weights of linear SVMs (MATLAB fitclinear, uniform prior, as in the code) trained on the data of
    all genotypes, the 'state' mode on the 1 s baseline before sound onset in block 1 against block
    4, the 'sound' mode on 200 ms before against after sound onset, and the 'opto OR air puff' mode
    on the 500 ms after light onset against the 500 ms after air puff onset; QR decomposition gives
    the orthogonal axes, and each genotype's units are projected on them. The code's windows (2 s
    baseline, 1 s from 0.7 s after trial start) are a variant. Which units are task-modulated is open;
    readings, all run, (a) GLM-fitted units significantly tuned to at least one regressor, (b) all
    GLM-fitted units, (c) all 4,152 units (the code's PFC units). Reproduced when, under a reading,
    (i) the mean absolute difference between the block 2 and block 1 projections on the 'opto OR air
    puff' mode over 0.7 to 1.2 s after trial start is larger in Esr1 and in Vglut2 than in Ctl and in
    Npy, and (ii) for all genotypes pooled, the ranges over time of the four blocks' projections on
    the 'state' mode do not overlap. Partially reproduced when one of (i) and (ii) holds.
- id: fig4jl-pl-esr1
  statement: In Esr1-cre mice the opto-modulation, the state-mode shift and the block decoding are
    concentrated in the prelimbic area, whereas in Vglut2-cre mice they are spread across the mPFC.
  source: Results, Pathway-specific aversive signals in the PFC, paragraphs 7 and 8; Figure 4j,l and
    Extended Data Figure 9p-v
  quote: we found that they were detected primarily in the PL in Esr1-cre mice, whereas they were
    widely distributed in the mPFC in Vglut2-cre mice
  depends_on:
  - fig4g-glm-units
  - fig4i-activity-modes
  - fig4k-decoding-pl
  criterion: Three measures per subregion (ACAd, PL, ILA, ORBm), as in Fig. 4l and
    Fig4jl_Extended_Data_Fig9lmpqr_Activity_modes_per_region.m, (1) the fraction of GLM-fitted units
    significantly tuned to the optogenetic regressor, (2) the mean over time of the block 2 minus
    block 1 projection on the 'state' mode with W and X restricted to the genotype's units in the
    subregion (from -2 to 5 s around trial start in the code), (3) the decoding accuracy of block 1
    against block 2 in Esr1 minus that in Ctl, from fig4k-decoding-pl. The paper gives no test or
    threshold for "primarily" or "widely distributed"; the rule that follows is a choice here.
    Reproduced when PL ranks first
    among the four subregions in Esr1 for at least two of the three measures, and in Vglut2 at least
    three subregions show measure (1) above the Ctl maximum over subregions; partially reproduced
    when only the Esr1 part holds.
- id: fig4k-decoding-pl
  statement: Baseline activity in PL decodes block 1 against block 2 more accurately in Esr1-cre and
    Vglut2-cre mice than in control and Npy-cre mice.
  source: Results, Pathway-specific aversive signals in the PFC, paragraph 8; Figure 4k
  quote: We found that baseline activity in PL allowed for increased accuracy in decoding block 1
    versus block 2 identity in Esr1-cre and Vglut2-cre mice
  depends_on:
  - ed7a-unit-counts
  criterion: As in the Methods (Decoding) and the code (Fig4k_Extended_Data_Fig9n-o_binning_100ms.py,
    Fig4k_Extended_Data_Fig9n_Decoding.py), spikes from -2.1 to -0.1 s before trial onset in 100 ms
    bins, for the first 49 trials of blocks 1, 3 and 4 and the first 49 of every other trial of
    block 2; the activity concatenated over the four blocks and z-scored per unit, units with no
    baseline spikes dropped; session 128515 left out as in the code's session table; per genotype
    and subregion with more than 20 units, logistic regression (lbfgs, max_iter 1000) on 5 to 150
    randomly drawn units in steps of 5, twofold cross-validation over time bins repeated 25 times
    (50 splits, a new unit draw per split). The paper reports no test. Readings, both run, the
    accuracy compared (a) at the largest unit number available in PL for all four genotypes, (b)
    averaged over the unit numbers available for all four. Reproduced when, under a reading, the PL
    accuracies of Esr1 and of Vglut2 each exceed those of Ctl and of Npy by more than the larger
    standard deviation over the 50 splits; partially reproduced when one of Esr1 and Vglut2 does.
- id: ed9no-decoding-other-regions
  statement: Decoding block identity (1 against 2, 1 against 3, 1 against 4) from the baseline
    activity of ACAd, ILA and ORBm shows no difference between genotypes.
  source: Results, Pathway-specific aversive signals in the PFC, paragraph 8; Extended Data Figure
    9n,o
  quote: No differences in accuracy between the genotypes were found when repeating the decoding of
    block identity (block 1 versus 2, 1 versus 3 and 1 versus 4) using the baseline activity of the
    other mPFC subregions
  depends_on:
  - fig4k-decoding-pl
  criterion: A claim of absence. The paper names no test, so the rule of fig4k-decoding-pl is used in
    reverse, with the same pipeline and readings. Reproduced when, in ACAd, ILA and ORBm for block 1
    against 2, and in all four subregions for block 1 against 3 and 1 against 4 (Extended Data Fig.
    9o), no genotype exceeds another by more than the larger standard deviation over the 50 splits;
    not reproduced when any does. The differences are reported either way.
- id: ed10-female-mild-aversive
  statement: Esr1+ LHA-LHb neurons are needed for fear conditioning in both sexes, but for milder
    aversive stimuli (a novel tone, looming) their silencing reduces aversive responses mainly in
    females.
  source: Results, Sexually dimorphic stress state is encoded in Esr1+ LHA-LHb subtype neurons,
    paragraph 1; Extended Data Figure 10b-d
  quote: We found that Esr1+ LHA–LHb neurons were necessary for fear conditioning in male and female
    mice; however, in the case of milder aversive stimuli (new auditory stimulus and looming
    stimulus), we found that silencing Esr1+ LHA–LHb neurons primarily reduced aversive responses in
    female mice
  statistics:
  - about: fear conditioning extinction freezing, Esr1:TeLC against Ctl, males
    test: one-way ANOVA with Tukey's multiple comparisons test
    p: 0.0163
    n: 6 Ctl and 14 Esr1:TeLC male mice
  - about: fear conditioning extinction freezing, Esr1:TeLC against Ctl, females
    test: one-way ANOVA with Tukey's multiple comparisons test
    p: 0.0028
    n: 6 Ctl and 13 Esr1:TeLC female mice
  - about: acoustic startle immobility, Esr1:TeLC female against Ctl female
    test: one-way ANOVA with Tukey's multiple comparisons test
    p: 2.3e-4
    n: 6 Ctl and 13 Esr1:TeLC female mice
  - about: looming aversive behavior, Ctl female against Esr1:TeLC female
    test: one-way ANOVA with Tukey's multiple comparisons test
    p: 0.0013
    n: 16 Ctl and 13 Esr1:TeLC female mice
- id: fig5f-stress-index-female
  statement: Unpredictable mild shocks raise the stress index only in female mice, and TeLC silencing
    of Esr1+ LHA-LHb neurons reduces it.
  source: Results, Sexually dimorphic stress state is encoded in Esr1+ LHA-LHb subtype neurons,
    paragraph 1; Figure 5f
  quote: This quantification showed that only female mice developed a significant and persistent
    stress state and that this state required the activity of Esr1+ LHA–LHb neurons
  statistics:
  - about: Ctl against Ctl stress, females
    test: one-way ANOVA with Tukey's multiple comparisons test
    p: 2.39e-8
    n: 16 Ctl and 12 Ctl stress female mice
  - about: Ctl stress against Esr1:TeLC stress, females
    test: one-way ANOVA with Tukey's multiple comparisons test
    p: 0.0016
    n: 12 Ctl stress and 13 Esr1:TeLC stress female mice
- id: fig5g-firing-shift
  statement: After the stress paradigm, Burst-type Esr1+ LHA-LHb neurons fire more and RS-N-type
    neurons fire less, in both sexes.
  source: Results, Sexually dimorphic stress state is encoded in Esr1+ LHA-LHb subtype neurons,
    paragraph 2; Figure 5g,h
  quote: we found that Burst and RS-N types were inversely affected by the stress state as Burst-type
    neurons increased and RS-N-type neurons decreased their firing in both sexes
  statistics:
  - about: Burst, Ctl stress female against Ctl female
    test: two-sided DABEST test
    p: 0
    n: 15 and 14 neurons
  - about: Burst, Ctl stress male against Ctl male
    test: two-sided DABEST test
    p: 0.0044
    n: 15 and 18 neurons
  - about: RS-N, Ctl stress female against Ctl female
    test: two-sided DABEST test
    p: 0
    n: 17 and 16 neurons
  - about: RS-N, Ctl stress male against Ctl male
    test: two-sided DABEST test
    p: 0.0002
    n: 17 and 20 neurons
- id: fig5kl-burst-female-intrinsic
  statement: In stressed females only, Burst-type Esr1+ neurons have shorter action potentials and a
    higher maximal firing frequency.
  source: Results, Sexually dimorphic stress state is encoded in Esr1+ LHA-LHb subtype neurons,
    paragraph 2; Figure 5i-l
  quote: We found a significant decrease in the AP duration and a significant increase in the maximum
    firing frequency specifically in Burst-type Esr1+ neurons from stressed female mice
  statistics:
  - about: AP duration, Ctl stress female against Ctl female
    test: two-sided DABEST test
    p: 0
    n: 15 and 18 neurons
  - about: maximal firing frequency, Ctl stress female against Ctl female
    test: two-sided DABEST test
    p: 0
    n: 15 and 18 neurons
