- id: ed7g-eye-closing-airpuff
  statement: Air puffs in block 4 increase the number of eye-closing events compared with block 1 in
    all four groups.
  source: Extended Data Figure 7g
  quote: (g) Quantification of the number of eye closing events (two-sided Wilcoxon signed ranked test
    with Bonferoni correction (alpha corrected= 0.0083)
  statistics:
  - about: Esr1:ChR2
    test: two-sided Wilcoxon signed-rank test
    p: 0.0059
    corrected: Bonferroni (alpha 0.0083)
    n: 10 mice
  - about: Vglut2:ChR2
    test: two-sided Wilcoxon signed-rank test
    p: 0.0078
    corrected: Bonferroni (alpha 0.0083)
    n: 5 mice
  - about: Ctl
    test: two-sided Wilcoxon signed-rank test
    p: 0.002
    corrected: Bonferroni (alpha 0.0083)
    n: 5 mice
  - about: Npy:ChR2
    test: two-sided Wilcoxon signed-rank test
    p: 0.002
    corrected: Bonferroni (alpha 0.0083)
    n: 5 mice
  criterion: The comparison is block 1 against block 4, as in Extended_Data_Fig7g_boxplots.jl. The
    paper does not define an eye-closing event; Extended Data Fig. 7f shows the normalized eye area
    trace from which events are presumably counted. Readings, both run, an event is a downward
    crossing of the eye area (normalized to its block-1 median) below (a) 50% or (b) 75%; these
    thresholds are choices here. The code settles the unit of observation, one event count per mouse
    and block (the 5-mouse columns are padded with 5 NaN to the 10 rows of Esr1), paired block 1
    against block 4 by SignedRankTest. An exact signed-rank test on 5 mice cannot go below p =
    0.0625, so the printed p-values of the 5-mouse groups (0.002, 0.0078) are consistent with a test
    over 10 pairs in which the NaN padding entered as data; this is open. Esr1 (10 mice) is judged by
    the two-sided signed-rank test at p < 0.0083. Ctl, Vglut2 and Npy are judged by block 4 exceeding
    block 1 in every mouse (p = 0.0625, the strongest result 5 pairs allow), a choice here; the
    code's NaN-padded computation is shown as a variant. Reproduced when, under a threshold reading,
    all four genotypes pass; partially reproduced when the direction of the genotype means holds in
    all four and at least two pass.
