    exceeds 1. Readings, both run, (a) as coded, a mean count per 100 ms bin above 0.2 (a rate above
    2 Hz); (b) as the code's comment states, a mean rate above 0.2 Hz. Reproduced when, under a
    reading, all five counts are within tolerance.
