# Claims for Daume, Kaminski, Salimpour, Gomez Palacio Schjetnan, Anderson, Valiante, Mamelak and
# Rutishauser (2024), Neuron 112, 3957-3968, on dandiset 001187.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-22, under
# docs/protocol.md, version pilot-10.
#
# Text read. The accepted author manuscript in PubMed Central (PMC11624075, NIHMS2025394), full text
# with Results, figure legends and STAR Methods (paper/10.1016-j.neuron.2024.09.013.txt), and its
# supplement (NIHMS2025394-supplement-1.pdf, extracted into the same file: Figures S1 to S4 and Table
# S1). The bioRxiv preprint (10.1101/2024.07.15.603630 v1) was searched for method details only; it
# adds none. The main-text figures were not viewed (no main-text PDF was supplied), so numbers printed
# only inside panels are not used, and units of axes the text does not name are left open.
#
# Code read. https://github.com/rutishauserlab/SBCAT-NO-release-NWB, commit 6d07204 (2024-09-04,
# "final main"), the repository the paper links (also Zenodo 10.5281/zenodo.13621888). It holds a
# MATLAB script (NWB_SBCAT_NO_analysis_main.m) that loads the dandiset and computes the behaviour
# plots of Fig. 1c-g (plot_behavior.m, no statistics), the 0.1 Hz rate filter (rateFilter_units.m),
# the category-neuron selection (NWB_calcCatSelective_SB.m), the memory-selective selection
# (NWB_calcMemSelective_SB.m), the mixed-effects GLM of Fig. 3a (NWB_computeGLM.m), and the example
# neurons of Fig. 2a and 4a. It has no code for Fig. 2b,c,e,f, 3b-h or Fig. 4b-g; those analyses
# rest on the Methods and legends alone, with the Fig. 3a code as the nearest implementation where
# said.
#
# Which dataset. The dandiset's title and description say it holds the source data of this paper
# (46 NWB files, 39 subjects on the archive), with the code above as the example analysis. The
# Methods (Data and Code Availability) say it holds spike times and waveforms of the sorted neurons,
# electrode coordinates, behaviour, stimuli, triggers and patient metadata of each session.
#
# Data the paper used (Results, paragraphs 1 to 3; STAR Methods; Table S1).
# - Subjects. 41 epilepsy patients, 48 sessions, with Behnke-Fried hybrid depth electrodes in the
#   hippocampus and amygdala, at Cedars-Sinai, Toronto Western and Johns Hopkins. Two sessions of two
#   patients (P87cs, P1901jh in Table S1) were excluded for accuracy below 55% in one task, leaving 46
#   sessions (t(45) in the behaviour tests). One patient gave no confidence ratings and is left out of
#   every confidence analysis (t(44)).
# - Tasks. A Sternberg WM task, 140 trials (70 load 1, 70 load 3), each encoding picture shown 2 s,
#   maintenance 2.55 to 2.85 s, then a probe that was always a familiar picture (match or non-match),
#   pictures from five categories (faces, animals, cars or tools, fruits, landscapes), one per
#   category in load 3. Then, after 10 to 30 min, an LTM recognition task of 400 pictures (200 old
#   from the WM task, 200 new), each judged old or new with confidence sure, unsure or guessing.
# - Neurons. Spikes sorted with OSort jointly for both tasks; 950 isolated, 67 removed for a rate
#   below 0.1 Hz in either task, leaving 883 (351 hippocampus, 532 amygdala). Table S1 gives per
#   session the category-selective, memory-selective and recorded counts per area; its recorded
#   counts sum to 386 and 587 (973), which matches neither 950 nor 883.
#
# Shared method. Criteria refer to these by letter. Each detail is taken from the place cited; a
# detail none of the sources fixes is named as open with the readings the text allows, and the notebook
# runs each. A claim's outcome is the one all its readings give; when they differ, it is blocked as
# methods_underspecified with every result shown.
# S, sessions. The 46 sessions with accuracy of at least 55% in both tasks (Results, paragraph 2;
#   Table S1). For confidence analyses, sessions with confidence ratings only (the code drops trials
#   whose confidence is NaN, NWB_computeGLM.m).
# U, units. A unit is kept when its global rate is at least 0.1 Hz in both tasks (Methods, Spike
#   sorting). The code computes the WM rate as the spikes up to the last WM event divided by the time
#   from the first to the last WM event, and the LTM rate likewise from the first LTM event
#   (rateFilter_units.m). Area is from the electrode location; the code calls amygdala_left and
#   amygdala_right amygdala and every other location hippocampus (NWB_computeGLM.m).
# L, LTM confidence. As the code reads the dataset's confidence field (plot_behavior.m,
#   NWB_computeGLM.m), 1 to 3 are new responses and 4 to 6 old responses, 1 being sure new and 6 sure
#   old; high confidence is 1 or 6 (sure), low confidence is 2 to 5 (unsure and guessing pooled). The
#   author checks this coding in the dataset. Remembered is an old picture answered old; forgotten an
#   old picture answered new.
# C, category neurons. Per unit, the firing rate 0.2 to 1.2 s after the onset of every encoding
#   picture (1 to 3) and of the probe, in all WM trials (the code does not restrict to correct
#   trials); the category is the leading digit of the picture ID (NWB_calcCatSelective_SB.m;
#   floor(ID/100) in NWB_computeGLM.m). A 1x5 permutation ANOVA over categories (statcond, unpaired,
#   'perm', 10,000 permutations) at p < 0.05, then a permutation t-test of the category with the
#   highest mean rate against all others pooled, right-sided at p < 0.05, which the code implements
#   as the two-sided statcond p < 0.1 (Methods, Selection of neurons; code). The preferred category is
#   the one with the highest mean. Counts vary slightly between runs of the permutations (code
#   comment); the seed is a standard choice.
# M, memory-selective (MS) neurons. Per unit, spike counts 0.2 to 1.2 s after picture onset in the
#   correct LTM trials, old against new, by a two-sided permutation t-test (statcond, unpaired, 10,000
#   permutations) at p < 0.05; familiarity-selective (FS) when the old mean is higher, novelty-selective
#   (NS) otherwise (Methods, Selection of neurons; NWB_calcMemSelective_SB.m).
# B, baseline normalization. Rates are spike counts divided by window length. Per neuron, the
#   percent change (rate / mean baseline rate - 1) x 100, the baseline being -0.9 to -0.3 s before the
#   onset of the first encoding picture (Fig. 2b and 3 legends; NWB_computeGLM.m). In the code the
#   mean baseline is taken over every row of the neuron's table before any trial selection (one row
#   per WM picture later shown in the LTM test, correct or not, preferred or not), and neurons with a
#   zero baseline (infinite values) are removed. Where the code does not reach (Fig. 2), open, the
#   baseline mean over (B1) all WM trials of the neuron or (B2) the rows of the code's table.
# O, outlier neurons. Methods (Statistics), applied before each test: neurons with no spikes in a
#   tested condition (the baseline included) are removed, and so are neurons whose value differs by
#   more than 3 SD from the mean across all neurons and tested conditions (O-M: per neuron and
#   condition value, removed when outside mean +- 3 SD of all such values). For the GLMs the code
#   instead removes neurons whose mean normalized maintenance rate (over all their rows) exceeds 3 SD
#   of the neuron means, without centring and on the upper side only (O-C). The Methods rule is the
#   main reading and the code's a variant shown beside it, as protocol step 2 asks.
# G, mixed-effects GLM. fitglme with a normal distribution, identity link and Laplace fit (maximum
#   likelihood), random intercepts for patient and for neuron nested in patient, the formula
#   FR ~ fixed effects + (1 | patientID) + (1 | patientID:neuronID) (Results, Category neurons
#   paragraph 2, "these random intercept terms were used for all GLMs"; NWB_computeGLM.m). P-values as
#   fitglme reports them (t statistics on residual degrees of freedom). Categorical factors take the
#   level the paper's betas imply as reference (incorrect, load 3, forgotten, amygdala, non-preferred,
#   new, weak), so that the signs compare with the paper's.
# P, permutation t-tests. statcond with 'perm', 10,000 permutations, two-sided unless stated; paired
#   across the units of the test (sessions, neurons or neuron pairs) where each unit gives both
#   conditions (Results, paragraph 2, "permutation-based paired t-tests were used throughout the
#   manuscript unless stated otherwise"; Methods, Statistics).
#
# Data. Every claim uses the dataset alone. The paper uses no outside data except the online study of
# 100 healthy participants (Figure S1), whose data the paper does not deposit or locate; it is not
# a main finding and no claim is made for it.
schema_version: 2
dataset:
  archive: dandi
  id: "001187"
paper: doi:10.1016/j.neuron.2024.09.013
claims:
- id: sessions-and-neurons
  statement: After excluding two sessions, 46 sessions are analysed, in which 883 single units pass
    the 0.1 Hz rate filter, 351 in the hippocampus and 532 in the amygdala, of 950 isolated.
  source: Results, paragraph 3; STAR Methods, Spike sorting
  quote: In total, we isolated 950 neurons across both areas of the MTL. Neurons with a firing rate
    lower than 0.1 Hz in either the WM or the LTM tasks were excluded from analysis (67 neurons (7.1%)).
    Analyses are based on 351 isolated neurons in the hippocampus and 532 in the amygdala
  expected:
  - {quantity: analysed sessions, value: 46, tolerance: 0}
  - {quantity: isolated units, value: 950, tolerance: 0}
  - {quantity: hippocampal units after the rate filter, value: 351, tolerance: 0}
  - {quantity: amygdala units after the rate filter, value: 532, tolerance: 0}
  criterion: Counts of sessions and of units by area, before and after the rate filter of U, in the
    sessions of S. Tolerance zero, as these are counts of the deposited units. Reproduced when all
    four match; partially reproduced when the counts after the filter match but the isolated count
    does not (Table S1 sums to 973 recorded units, so the paper itself gives two totals). The Table S1
    total is reported beside them.
- id: table-s1-counts
  statement: Per session, the numbers of recorded units in the hippocampus and the amygdala are those
    of Table S1.
  source: Table S1
  inferred: Numbers from Table S1 (third number of each area column); no sentence of the text states
    them. Their sums (386 hippocampus, 587 amygdala) differ from the 950 and 883 of the Methods.
  criterion: Per session, matched by the session labels of Table S1 to the dataset's subject and
    session through the patient metadata, the count of units per area in the dataset (before and
    after the rate filter of U) against the table's recorded count. Reproduced when every one of the
    46 sessions matches under one of the two counts; partially reproduced when some do and others do
    not, the sessions that differ being listed.
    The category-selective and memory-selective counts per session of the table are compared with
    those of claims category-neuron-counts and ms-neuron-counts, as a report, not a test.
- id: behaviour-overall-accuracy
  statement: Patients answered 93.3% of WM trials and 70.3% of LTM trials correctly (d' 1.19), both
    above the 50% chance level.
  source: Results, paragraph 2
  quote: Patients performed well in both parts of the task, with an average accuracy of 93.3 ± 7.6 %
    (mean ± SD) in the WM task and 70.3 ± 9.8 % (d’ = 1.19 ± 0.62) in the LTM task, respectively
    (both p < 0.0001 as compared to 50 % chance; permutation-based t-test
  statistics:
  - test: permutation-based t-test against 50% chance
    p: 0.0001
    p_relation: "<"
    n: 46 sessions
  expected:
  - {quantity: mean WM accuracy across sessions, value: 93.3, tolerance: 1.1, unit: "%"}
  - {quantity: mean LTM accuracy across sessions, value: 70.3, tolerance: 1.4, unit: "%"}
  - {quantity: mean LTM d prime across sessions, value: 1.19, tolerance: 0.09}
  criterion: Per session of S, the proportion of correct WM trials and of correct LTM trials (all 400),
    and d' as z(hit rate) - z(false-alarm rate) of old and new pictures; means across sessions. The
    tolerances are the standard errors of the mean (the stated SD over the square root of 46), since
    the paper's stated spread is the SD across sessions and these are means of the same sessions; the
    10% default would be looser. The correction for hit or false-alarm rates of 0 or 1 is not given;
    none is applied unless a rate is 0 or 1, in which case the 1/(2N) rule, a standard choice, is used
    and said. Reproduced when the three means are within tolerance and each accuracy exceeds 50% by
    a one-sample permutation test (P) at p < 0.0001.
