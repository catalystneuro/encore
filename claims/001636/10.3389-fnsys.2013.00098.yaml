    were PTNs and 31 and 48 CSNs; three neurons in all were activated from both the peduncle and
    the putamen.
  source: Supplementary table (monkey V); Results, Database; Table 1
  expected:
  - quantity: monkey V cells pre-MPTP
    value: 112
    tolerance: 11.2
  - quantity: monkey V cells post-MPTP
    value: 159
    tolerance: 15.9
  - quantity: monkey V PTNs pre-MPTP
    value: 49
    tolerance: 4.9
  - quantity: monkey V PTNs post-MPTP
    value: 54
    tolerance: 5.4
  - quantity: monkey V CSNs pre-MPTP
    value: 31
    tolerance: 3.1
  - quantity: monkey V CSNs post-MPTP
    value: 48
    tolerance: 4.8
  - quantity: cells activated from both sites (both monkeys)
    value: 3
    tolerance: 0.3
  criterion: Counts of monkey V units with at least 5 perturbations per direction, by MPTP state
    and projection type; dual-projecting units counted over all files. Reproduced when every
    count is within tolerance.
- id: monkey-l-perturbations
  statement: In monkey L, 57 of 115 neurons before MPTP and 35 of 73 after responded to torque
    perturbations of the wrist, and the monkey L responses enter all pooled results.
  source: Supplementary table (monkey L); Table 1
  criterion: Needs the torque perturbation trials of monkey L (direction and onset). Blocked if no
    monkey L file marks them.
- id: baseline-rate
  statement: Before torque onset, the firing rate of M1 neurons was lower after MPTP, because PTN
    rates fell (Mann-Whitney p < 0.001) while CSN rates did not change (p = 0.5). In monkey V the
    rates were 12.6 and 8.9 spikes/s for all cells, 20.3 and 14.8 for PTNs, and 3.5 and 3.4 for
    CSNs, before and after MPTP.
  source: Supplementary table; Table 1; Results, Database
  expected:
  - quantity: M1 baseline rate pre-MPTP
    value: 12.6
    tolerance: 1.98
    unit: spikes/s
  - quantity: M1 baseline rate post-MPTP
    value: 8.9
    tolerance: 1.33
    unit: spikes/s
  - quantity: PTN baseline rate pre-MPTP
    value: 20.3
    tolerance: 2.46
    unit: spikes/s
  - quantity: PTN baseline rate post-MPTP
    value: 14.8
    tolerance: 2.72
    unit: spikes/s
  - quantity: CSN baseline rate pre-MPTP
    value: 3.5
    tolerance: 1.47
    unit: spikes/s
  - quantity: CSN baseline rate post-MPTP
    value: 3.4
    tolerance: 1.01
    unit: spikes/s
  depends_on:
  - cell-counts
  criterion: Mean baseline rate per group of cells studied. Reproduced when all six means are
    within tolerance, the PTN rate is lower after MPTP (Mann-Whitney p < 0.05) and the CSN rate
    does not differ (p >= 0.05). Partially reproduced when the two tests hold and some means are
    outside tolerance, or the means hold and a test does not. The M1 test (p < 0.05/2 in the
    paper) is reported.
- id: ptn-faster-than-csn
  statement: Before MPTP, PTNs fired much faster than CSNs at rest (Mann-Whitney p < 0.001).
  source: Results, Database; Table 1
  depends_on:
  - cell-counts
  criterion: Pre-MPTP baseline rates of monkey V PTNs and CSNs. Reproduced when PTNs are higher
    with Mann-Whitney p < 0.001; partially when p < 0.05; not reproduced otherwise. The text
    gives means of 16.3 and 3.6 spikes/s and Table 1 gives 18.3 and 3.2; these pooled values are
    reported, not judged.
