  - quantity: PTN antidromic latency post-MPTP
    value: 1.9
    tolerance: 0.2
    unit: ms
  - quantity: CSN antidromic latency pre-MPTP
    value: 5.1
    tolerance: 0.61
    unit: ms
  - quantity: CSN antidromic latency post-MPTP
    value: 6.1
    tolerance: 0.89
    unit: ms
  depends_on:
  - cell-counts
