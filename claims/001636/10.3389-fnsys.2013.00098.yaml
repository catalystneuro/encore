    not reproduced otherwise.
- id: velocity-matched-magnitude
  statement: In sessions with equivalent torque-induced velocities (130 to 200 deg/s), MPTP did
    not change the magnitude of responses (Mann-Whitney, p = 0.19 for flexion and 0.46 for
    extension, with 24 and 33 flexion and 22 and 31 extension responses).
  source: Results, Torque-evoked neuronal responses, pre- vs. post-MPTP; Supplementary Figure 1
  expected:
  - quantity: flexion responses pre-MPTP
    value: 24
    tolerance: 2.4
  - quantity: flexion responses post-MPTP
    value: 33
    tolerance: 3.3
  - quantity: extension responses pre-MPTP
    value: 22
    tolerance: 2.2
  - quantity: extension responses post-MPTP
    value: 31
    tolerance: 3.1
  depends_on:
  - torque-related-fractions
  - kinematics-slower
  criterion: Absence claim. Responses (monkey V) from sessions whose mean peak velocity for that
    direction is 130 to 200 deg/s; maximum change from baseline compared pre against post with a
    Mann-Whitney test per direction. Reproduced when neither direction has p < 0.05; not
    reproduced when either does. The counts are reported against the expected values but do not
    decide the outcome; the other magnitude measures are a variant.
- id: session-correlations
  statement: Across sessions, the mean PTN response latency did not correlate with the peak
    velocity of the torque-induced movement (|rho| < 0.18) or with the m2 EMG response (|rho| <
    0.26; Spearman, p > 0.05 with threshold 0.05/4).
  source: Results, Analysis of neural-behavioral correlations
  depends_on:
  - torque-related-fractions
  - kinematics-slower
  - emg-m2-larger
  criterion: Absence claim. Monkey V sessions with at least one torque-related PTN; the session's
    mean PTN latency (earliest response per cell) against the session's mean peak velocity (both
    directions) and its triceps longus channel 1 m2 for flexion torques. Spearman, threshold
    p < 0.0125. Reproduced when neither correlation reaches it; not reproduced when either
    does.
- id: trial-correlations
  statement: Trial by trial, PTN response latencies did not correlate with the peak velocity or
    the m2 EMG response (Spearman |rho| < 0.34, p > 0.05).
  source: Results, Analysis of neural-behavioral correlations
  criterion: Needs a single-trial response latency, which the Methods do not define. Blocked
    unless one is defined by the paper.
