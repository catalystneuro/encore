  criterion: The same detection at a pseudo onset 600 ms before the torque, on the monkey V cells
    studied, both directions. Reproduced when the fraction of cell-directions with any threshold
    crossing over 0 to 200 ms is between 0.0033 and 0.03 (the factor-of-3 rule above; the
    tolerance field gives the upper bound). The rate for a response with onset in 20 to 60 ms is
    also reported.
