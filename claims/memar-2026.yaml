# Claims for Ostadsharif Memar & Dehghani (2026), "Spatially Masked Regression Reveals Local and
# Distributed Predictability in Electrophysiological Recordings", doi:10.48550/arxiv.2606.11415.
#
# Provenance. Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-11-21, protocol as stated in docs/protocol.md (pilot-18), Reader role.
#
# Text read. The arXiv preprint, version 1 (arXiv:2606.11415v1, dated 11 June 2026), full text as
# stored under paper/ (paper/10.48550-arxiv.2606.11415.txt, "Version: preprint"): main text,
# Material and Methods (sections II A to II H, Algorithms 1 to 4), Results, Discussion, and the
# appendix Tables II (iEEG) and III (EEG) and Figure 6. The paper has no separate supplement and
# cites none. No version of record was available. The PDF was not needed; the table values were
# read from the text, row by row in the column order the headers give.
#
# Code read. GitHub neurovium/SpatiallyMaskedRegression (linked in the paper's footnote and Code
# Availability), commit 244dcdbd67f217873c2a52b77485d97c6fa9bf0e (2026-06-24, after the preprint's
# date). It holds the model (ReconModel.py, model.py), intra-subject training and the EEG
# cross-subject path (train.py, main.py), the iEEG cross-subject path (similarity.py,
# generate_adj_matrix_ieeg_unseen.py, Test_new_subject_iEEG.py), the coverage experiment
# (run_coverage_experiment.py), surrogates (Load_preprocess_data.py), the neighborhood and mask
# (neighborhood.py), settings (configs/settings.yaml), a METHODS.md map from the paper to the code,
# and the figure notebooks (notebooks/). Its module docstrings call it a "fixed" version that
# changes earlier code in places (the mask sweep, the CBEM similarity), so it may not be the code
# that produced the reported numbers. It does not build the iEEG trials used for training; it loads
# them from pickled per-subject arrays ("patient_<n>_reformat.pkl", coordinates in
# "elec_coor_all_move_rest.pkl") made by a pipeline that is not in the repository.
# utils.extract_data_dandi is a separate DANDI path (one session, sub-01 ses-3, reach events,
# 0.5 to 100 Hz, Hilbert envelope, decimation to 10 Hz) that does not match the Methods and is
# not used by the reported runs.
#
# Data the paper used.
# - iEEG. AJILE12 (Peterson et al. 2022), DANDI:000055, which is the dataset for this file.
#   12 subjects (8 male, 4 female, mean age 29 ± 7 years) under clinical epilepsy monitoring,
#   electrodes in one hemisphere each (5 right, 7 left), placement varying across subjects
#   (Figure 6 shows each subject's electrodes and their AAL regions). Video-identified
#   upper-limb movement events annotate the recordings. Signals were preprocessed (DC removal and
#   linear detrending, 0.5 to 150 Hz Butterworth band-pass, 60 Hz notch, 120 Hz low-pass, |z| > 5
#   samples replaced by the channel median, common average reference, per-channel z-scoring
#   across time) and cut into 2 s trials centred on movement events (Methods II A a). The dataset
#   description gives 500 Hz recordings from at least 64 electrodes per participant and wrist
#   movement events. Measured variables used here are the iEEG voltage per electrode, the
#   electrodes' MNI coordinates (for the neighborhood), and the movement event times.
# - EEG. Upper Limb Movements EEG (Ofner et al. 2017, PLoS ONE 12 e0182578), from the BNCI
#   Horizon 2020 database. 15 healthy subjects, 61 scalp electrodes, six right-arm movements and
#   rest, one session of execution and one of kinesthetic imagery on different days; band-pass and
#   notch filtered and z-scored per channel, then cut into trials (Methods II A b). It is not in
#   DANDI:000055. Its claims are data elsewhere; the paper names the database only, with no
#   accession or version, and does not say which session (execution, imagery or both) or which
#   trial window was used.
#
# Common iEEG pipeline, with its sources. Claims below refer to it.
# - Model. For each target electrode i, a linear map (weights and a bias) from the unmasked
#   electrodes to electrode i at each time sample (Eq. 1; ReconModel.py). Loss is the mean absolute
#   error plus lambda1 = 1e-5 times the L1 norm and lambda2 = 1e-4 times the squared L2 norm of all
#   trainable parameters, bias included (Eq. 2, Methods II F; train.py). Adam; mini-batches of
#   trials; no dropout (Methods II C, II F). Learning rate 0.01, batch size 32, patience 200 epochs,
#   at most 10000 epochs (configs/settings.yaml; the paper says only that these came from a coarse
#   validation search). Seeds 42 (utils.configure_environment).
# - Data split. Each subject's trial array is z-scored across trials, then split 64/16/20 into
#   train, validation and test trials by two nested 80/20 random splits with a fixed seed (Methods
#   II D 1). The code z-scores each channel and time sample across trials (scipy zscore, axis 0)
#   and uses random_state 42. Early stopping on the epoch-averaged validation loss; the lowest
#   validation-loss checkpoint is evaluated on the test trials.
# - Score. Distance correlation (Eqs. 8 to 14, the standard biased V-statistic, 0 when the
#   denominator is 0) between the original and reconstructed test trial of electrode i, per trial,
#   averaged over test trials. A subject's value is the mean over electrodes (Table II legend,
#   "mean ± SD across electrodes"); an average is the mean over subjects of the subject values,
#   and its ± is the population SD across subjects (the Average rows of Tables II and III equal
#   these to the printed precision, checked here by arithmetic on the table).
# - Neighborhood N(i). The 9 electrodes nearest to i in the (x, z) projection of the MNI
#   coordinates, i itself excluded (Methods II B). Variant from the code: its default and the
#   notebooks use method 'atlas', N(i) = electrodes with the same AAL label as i
#   (neighborhood.py, configs/settings.yaml, README calling it "manuscript-matching"). Methods
#   first; the atlas neighborhood is to be shown as a variant.
# - Mask intensity m. ceil(m |N(i)|) electrodes drawn at random from N(i) are masked with i
#   (Results D). The code masks round(m |N(i)|) (neighborhood.find_index_mask), which differs at
#   m = 0.25 (2 against 3 of 9) and m = 0.5 (4 against 5). Methods first; round is a variant.
# - The mask intensity behind the intra-subject, lagged and surrogate columns of Table II and
#   Figure 2 is not stated in the Results. The model as defined in Methods II B and II C (Eqs. 1,
#   2 and 7, w_ij = 0 for every j in N(i)) masks the whole neighborhood, which is m = 1.0, and the
#   EEG cross-subject transfer uses m = 1.0 checkpoints (Results III B). The code settles it as m = 1.0, the full neighborhood
#   masked (notebooks/visualization.ipynb, Figure 2 cell, "mask_intensity=1.0 (full local mask,
#   matching the paper)"; donor matrices for cross-subject transfer come from intensity 100). This
#   file follows the code; m = 0 (only the target masked) is to be shown as a variant.
#
# Details the paper and code leave open for the iEEG trials, with the readings the text allows.
# Each analysis is to be run under each reading; outcomes resting on one are marked so.
# - Which movement events. The paper says "2-second trials centered on movement events" and
#   "upper-limb movement" annotations. Readings: (a) the dataset's wrist movement (reach) events,
#   2 s centred on each event's start time (the event and alignment extract_data_dandi uses);
#   (b) movement trials together with rest trials, as the code's coordinate file name
#   ("all_move_rest") suggests.
# - Which recording days. Not stated. Reading: all sessions of each subject, pooled per subject.
# - Where preprocessing is applied. Not stated. Readings: (a) on each session's continuous
#   recording before epoching; (b) on each 2 s epoch. The steps are those of the Methods; the
#   code's preprocess_iEEG adds a median filter, a Hilbert envelope and optional decimation that
#   the Methods do not list, so they are left out, and the envelope may be shown as a variant.
# - Trial and electrode exclusion. The paper names none beyond the |z| > 5 replacement. Standard
#   choice, no trial or electrode is excluded; the code's PSD-based trial rejection
#   (utils.rem_bad_trials_PSD, on the unused DANDI path) may be shown as a variant.
# - Subject order. Tables II and III list subjects in rows without identifiers. Reading: row n is
#   AJILE12 participant n (sub-01 to sub-12), checked against the hemisphere and electrode layout
#   Figure 6 shows for each subject.
schema_version: 2
