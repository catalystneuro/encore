- id: cross-ieeg-mean
  statement: Transferring learned inter-electrode matrices from other subjects, through
    correlation-based electrode mapping and per-electrode donor selection, reconstructs a target
    subject's trial-averaged iEEG with a mean DistCorr of 0.389 ± 0.064, without fitting weights
    on the target.
  source: Results, III B, paragraph 3; Table II, Average row, Cross-Subject column
  quote: In this setting, the model achieved an ... DistCorr of 0.389±0.064
  data: dataset
  depends_on:
  - intra-ieeg-mean
  expected:
  - quantity: mean over 12 subjects of cross-subject DistCorr, iEEG
    value: 0.389
    tolerance: 0.064
  criterion: Method from Methods II D 2 and Algorithm 2, with the code where they are silent.
    Donor matrices M_learn are the intra-subject weight matrices at m = 1.0 (code, donor directory
    intesity_100). For each target and donor, C(i, j) is the Pearson correlation of target
    electrode i and donor electrode j averaged over paired trials 1 to min(R_s, R_s') with NaN
    trials left out (Eq. 3); the code instead correlates the trial-concatenated series truncated
    to a common length (similarity.cross_subject_pearson), to be shown as a variant. A one-to-one
    assignment maximising summed correlation (Hungarian, scipy linear_sum_assignment); unmatched
    target electrodes get no row from that donor. M_est = P M_learn P^T. The target's trials are
    split 50/50 into validation and test (random_state 42). Which of the target's trials enter C
    is not stated (Algorithm 2 splits before computing C but does not say which part is used);
    readings (a) all of the target's trials, as the code does; (b) the validation trials only.
    For each electrode, the donor whose
    row gives the highest DistCorr on the z-scored trial-averaged validation signals is chosen,
    and DistCorr on the z-scored trial-averaged test signals is its score (Methods II D 2).
    Electrodes with no matched donor are left out of the mean (the code's nanmean). Reproduced
    when the average is within tolerance under one reading.
