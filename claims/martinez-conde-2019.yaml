- id: s4-baseline-no-difference
  statement: Absolute baseline activity did not differ significantly across the three visual
    stimuli (Square and Edge, Star, Corners).
  source: Results, Strength of neuronal responses to corner-folds varies parametrically with
    fold angle, paragraph 1; S4 Fig
  quote: Importantly, we found no significant differences in absolute baseline activity across the
    different visual stimuli presented ( S4 Fig ).
  criterion: A claim of absence. Absolute baseline per neuron and condition is the mean of the
    spike rate map in the four (Square and Edge, Star) or two (Corners) 16 x 16 DU 0% luminance
    squares (Methods, Visual stimuli). The paper does not name the test or threshold. Readings,
    each at alpha 0.05 (the alpha the paper states for Fig 6); (a) pairwise Wilcoxon rank sum
    tests between the three conditions corrected with Benjamini and Hochberg, the test of Fig
    4B; (b) a Kruskal-Wallis test across the three conditions; (c) a one-way ANOVA. Reproduced
    when the readings find no difference; not reproduced when they find one. If they disagree,
    the author adopts reading (a) as the paper's own test elsewhere, as an assumption. The
    medians and quartiles of each condition (the S4 Fig box plots) are reported either way.
