    dentate photo-activation trials, in the last 400 ms of the delay (the window of Extended Data
    Fig. 10c, Methods) and averaged from photostimulus offset to the go cue. "Collapse" is open
    (readings (a) fastigial separation not distinguishable from zero; (b) fastigial separation
    lower than control, the bootstrap interval of the difference over sessions excluding zero).
    Reproduced when under one reading and one window the fastigial separation collapses and, in
    the same window, the dentate separation does not differ from its control (interval of the
    difference includes zero).
- id: cd-captures-selectivity
  statement: The projection along the coding direction captures 64.1% of ALM population
    selectivity over the sample and delay epochs and 27.0% of the total variance in task-related
    activity.
  source: Methods, Analysis of ALM population dynamics in the activity space, paragraph 2
  quote: The projection along the cd captured 64.1±3.4% of the population selectivity for "lick
    left" and "lick right" trials over the sample and delay epochs (root mean square, RMS, of the
    spike rate difference between "lick right" and "lick left" trials), and 27.0±4.2% of the total
    variance in ALM task-related activity
  expected:
  - quantity: fraction of population selectivity captured by the cd
    value: 64.1
    tolerance: 3.4
    unit: "%"
  - quantity: fraction of task-related variance captured by the cd
    value: 27.0
    tolerance: 4.2
    unit: "%"
  datasets:
  - "000007"
  - crcns-alm-4
  criterion: Per session (E6), on control trials over the sample and delay epochs. Selectivity is
    the RMS of the "lick right" minus "lick left" rate difference; variance is the RMS of the
    baseline-subtracted activity. How the captured fraction is formed is open (readings (a) the
    ratio of the RMS along the unit cd to the RMS over all neurons; (b) the ratio of their squares,
    a fraction of variance); the baseline window is not given (reading the 500 ms before sample
    onset, a standard choice). The paper does not name the spread as s.e.m. or s.d.; it is used
    as the tolerance as stated. Reproduced when under one reading both means are within
    tolerance.
- id: ed10b-fastigial-activation-errors-during-recording
  statement: In the ALM recording sessions, contralateral fastigial photo-activation lowers
    behavioral performance, with "lick left" and "lick right" trials pooled, in the 6 mice.
  source: Extended Data Figure 10a and 10b
  quote: Performance in control (grey) and photostimulation trials (cyan). "Lick left" and "lick
    right" trials are pooled. Chance is 50% (dashed line). Lines, individual mice (ALM
    photo-inhibition, n=7; fastigial photo-activation, n=6). ***, p<0.001, one-sided test,
    bootstrap (Methods).
  statistics:
  - test: one-sided bootstrap
    p: 0.001
    p_relation: "<"
    n: 6 mice
  datasets:
  - "000007"
  - crcns-alm-4
  criterion: ALM recording sessions with contralateral fastigial photo-activation (Extended Data
    Fig. 10a; the 6 mice of Supplemental Table 1), early delay photo-activation (0.455 s from
    delay onset, main text paragraph 16), all powers pooled. Pooled performance (B1), control
    against photo-activation trials. Reproduced when performance drops with a one-sided
    hierarchical bootstrap (B1) p < 0.001.
- id: ed10c-alm-inhibition-endpoints-predict
  statement: After bilateral ALM photo-inhibition in the early delay, the distance of ALM
    trajectories to the endpoints along the coding direction still predicts the future movement,
    though performance is near chance.
  source: Supplementary Information, page 1, paragraph 1; Extended Data Figure 10b and 10c
  quote: But in a trial-by-trial analysis movement direction could still be predicted based on the
    distance of the perturbed activity trajectories to the endpoints on the cd
  statistics:
  - about: performance drop with bilateral ALM photo-inhibition
    test: one-sided bootstrap
    p: 0.001
    p_relation: "<"
    n: 7 mice
  datasets:
  - "000007"
  - crcns-alm-4
  criterion: The paper does not say which mice or sessions carried bilateral ALM photo-inhibition
    during ALM recording (n = 690 trials; ALM photo-inhibition needs VGAT-ChR2 mice, which
    Supplemental Table 1 does not list for ALM recordings, and the CRCNS descriptor lists no ALM
    photo-inhibition code). The supplement introduces this result with "Previously, we found" and
    cites its refs. 1 and 2 (Li et al. 2016; Inagaki et al. 2017), so these trials may come from
    those studies and not from this paper's recordings. Where the datasets hold such trials, the
    projection cd'x in the last 400 ms of the delay (E6, cd from independent correct control
    trials; Methods) is binned and the probability of licking right is computed per bin, pooled
    over sessions. Reproduced when that probability rises with the projection, by a logistic
    regression of lick direction on the projection with slope p < 0.05 (a standard test named
    here, the paper gives none), and pooled performance drops with a one-sided bootstrap p <
    0.001 (B1).
- id: ed10d-fastigial-endpoints-no-prediction
  statement: After fastigial photo-activation, the distance of ALM trajectories to the endpoints
    along the coding direction no longer predicts future movements.
  source: Supplementary Information, page 1, paragraph 1; Extended Data Figure 10d
  quote: After fastigial photo-activation, the distance of the perturbed trajectories to these
    endpoints no longer predicted future movements
  depends_on:
  - fig4i-cd-control-separation
  datasets:
  - "000007"
  - crcns-alm-4
  criterion: A claim of absence; the paper shows a binned curve (n = 337 fastigial photo-activation
    trials, Extended Data Fig. 10d) and names no test. As ed10c-alm-inhibition-endpoints-predict
    on the fastigial photo-activation trials of the ALM recording sessions, with the logistic
    regression named there at p < 0.05. Reproduced when the slope is not significant; the slope
    and its interval are reported, with the slope on control trials for comparison.
- id: ed10ef-alm-drives-licking-after-fastigial
  statement: Unilateral ALM photo-inhibition before the go cue biases licking ipsilaterally
    whether or not a fastigial perturbation preceded it, and bilateral ALM photo-inhibition
    during movement initiation raises the no-lick rate even after a fastigial perturbation.
  source: Supplementary Information, page 1, paragraph 2; Extended Data Figure 10e to 10g
  quote: Unilateral ALM photo-inhibition before movement initiation biased upcoming movements to the
    ipsilateral direction regardless of a preceding fastigial perturbation (Extended Data Fig
    10e-f). Bilateral ALM photo-inhibition during movement initiation led to an increased no lick
    rate even after a preceding fastigial perturbation
  statistics:
