# Claims for Gao, Davis, Thomas, Economo, Abrego, Svoboda, De Zeeuw and Li (2018), "A
# cortico-cerebellar loop for motor planning", Nature 563, 113-116, doi:10.1038/s41586-018-0633-x,
# tested on DANDI:000007 and CRCNS:alm-4.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-14,
# protocol pilot-15 as stated in docs/protocol.md. It updates the file written 2026-11-10 under
# pilot-14 (and checked that day) for DANDI:000007 alone; ids are kept where the finding is the
# same, and the changes of that check are carried over.
#
# Text read: the version of record (PMC6212318, open access), Europe PMC JATS XML flattened, in
# paper/10.1038-s41586-018-0633-x.txt: main text, Methods, the legends of Extended Data Figs. 1 to
# 10, and the Supplementary Information (41586_2018_633_MOESM1_ESM.pdf, from the publisher; also
# paper/...supp1.pdf), whose text is appended: the Extended Data Fig. 10 discussion, the cerebellar
# circuitry discussion and Supplemental Table 1 (mice and hemispheres per experiment). supp2.pdf is
# the Nature reporting summary. The legends of the main Figs. 1 to 4 are not in the stored text,
# and there is no PDF of the main paper; values, significance marks and neuron counts given only in
# those legends or inside the figures are not used here (see the report of this run). Sources cite
# main-text paragraphs counting the opening summary paragraph as paragraph 1.
# Code: the paper links none. Its Code availability says "Software used for data analysis is
# available from the corresponding author upon reasonable request"; the reporting summary says
# "Custom analysis scripts and data will be deposited on CRCNS.org" and gives no identifier. The
# CRCNS:alm-4 descriptor names two demo files of the dataset (Demo_get_performance,
# Demo_get_trial_aligned_raster_PSTH); they are not the paper's analysis code and were not read.
# So every method detail below is from the Methods, the Extended Data legends or the supplement,
# or is named as open.
#
# The datasets, from their titles and descriptions on the archives.
#  - 000007 (DANDI), titled as the paper; description "Extracellular recording in ALM".
#  - crcns-alm-4 (CRCNS), "Extracellular recordings from anterior lateral motor cortex (ALM) and
#    cerebellar nucleus neurons of adult mice performing a tactile decision behavior". Its
#    descriptor lists 34 sessions (9 mice) of ALM recording during fastigial or dentate
#    photo-activation and 20 sessions (4 mice) of ALM recording during CN photo-inhibition, with
#    photostimulation codes for fastigial or dentate photo-activation in the sample or delay (500
#    ms) and CN photo-inhibition in the delay (500 ms or 1.3 s). It lists no CN recordings.
#  Both are described as the ALM recordings of Figs. 2 to 4 and Extended Data Figs. 4, 5e, 9 and
#  10, and every claim on those lists both. Supplemental Table 1 shows that the 6 mice of the 0.5 s
#  fastigial photo-activation behavior (Fig. 1g, h) are the 6 mice of ALM recording during fastigial
#  photo-activation, and that the 4 mice of ALM recording during CN photo-inhibition are among the 7
#  mice of 0.5 s CN photo-inhibition (Fig. 1k), so their recording sessions may hold part of those
#  behavioral data (photostimulation was on 33% of trials during recordings and 25% in behavior
#  sessions, Methods). No description names the lesion experiments, the 1.3 s photostimulation
#  experiments, the CN recordings, the photo-inhibition characterization, the movement tests, the
#  VGAT-ChR2-EYFP behavior or the anatomy. Those claims list both datasets, as the paper's only
#  deposits; the author checks each and blocks the claim as data_missing when neither holds the
#  data. They are kept because they are the paper's findings.
#
# Data the paper used, as it reports them (Methods; Supplemental Table 1):
#  - Task. Head-fixed mice report the location of a pole (anterior or posterior) by licking left or
#    right. Sample epoch 1.3 s (pole movement onset to 0.1 s after retraction onset), delay epoch
#    1.3 s, auditory go cue (3.4 kHz, 0.1 s), then the response. Lick early trials (alarm, timeout)
#    and no-lick trials (no lick within 1.5 s of the go cue) are excluded from performance.
#    Reaction time is from go cue onset to the first lickport contact.
#  - Mice. 70 in all (Supplemental Table 1). ALM recordings: 1309 single units in 10 mice over 39
#    sessions during behavior with CN ChR2 photo-activation (Fig. 2, Fig. 4); 1194 putative
#    pyramidal (trough-to-peak spike width > 0.45 ms), 82 fast-spiking (< 0.35 ms), 33
#    intermediate excluded. 9 of these 10 mice received CN photo-activation during the recordings
#    (912 putative pyramidal neurons); one mouse was excluded because the virus missed the CN. The
#    split of the 912 between fastigial and dentate sessions is not in the text read. Supplemental
#    Table 1 lists 6 mice for fastigial (CD06, NL15, AN105, AN107, AN108, AN109) and 3 for dentate
#    (NL12, NL14, AN106) photo-activation during ALM recording. ALM recordings during CN
#    photo-inhibition in L7-cre x Ai32 mice: 490 units in 4 mice (CD08, CD12, CD13, CD14) over 19
#    sessions, 454 pyramidal. The Methods say recordings were from left ALM in 10 mice and right
#    ALM in 2; the table lists 13 ALM-recorded mice, 2 of them in right ALM (AN107, CD14). ALM was
#    always recorded contralateral to the manipulated CN.
#  - CN recordings: 878 units in 18 mice over 169 sessions (10 wild-type, 8 VGAT-ChR2-EYFP with
#    ALM photo-inhibition); 268 fastigial, 139 interposed, 157 dentate, 314 outside the CN.
#  - Photostimuli. CN photo-activation (AAV ChR2): 5 ms pulses at 20 Hz, average 0.5, 1 or 1.5 mW,
#    from the start of an epoch for 0.455 s (10 pulses) or 1.255 s (26 pulses), on 25% of
#    behavioral trials and 33% during ALM recordings. CN photo-inhibition (Purkinje cell ChR2): 40
#    Hz sinusoid, 0.5, 1.5 or 4.5 mW, 0.5 or 1.3 s with a 100 to 200 ms offset ramp; during ALM
#    recordings it starts at delay onset and lasts 1.3 s (1.5 or 4.5 mW). ALM photo-inhibition
#    (VGAT-ChR2): bilateral, 1.3 s from delay onset, 1.5 mW per site; unilateral, a 40 Hz
#    sinusoid at 1.5 mW (Extended Data Figs. 6, 10).
#  - Measured variables. Spike times of sorted units, trial events (pole, go cue, licks),
#    instructed trial type, lick direction and outcome, photostimulation condition.
#
# Shared methods, cited by the criteria below.
#  B1 Behavioral performance (Methods, Behavioral data analysis). Fraction of correct choices,
#     excluding lick early and no lick trials; also computed separately for "lick left" and
#     "lick right" trials, grouped by instructed direction relative to the manipulated hemisphere
#     (Extended Data Fig. 1e legend). Significance by a hierarchical bootstrap, resampling with
#     replacement mice, then sessions of each mouse, then trials of each session, 10,000 times; the
#     one-tailed p-value is the fraction of resamples whose performance change has the sign
#     opposite to the observed one. Where the paper gives no threshold for a behavioral effect,
#     p < 0.05 is used, the lowest significance mark of its bootstrap legends (Extended Data Figs.
#     1e, 2g), and named as a choice.
#  E1 Units (Methods, Electrophysiology data analysis). ALM analyses use putative pyramidal
#     neurons (spike width > 0.45 ms); CN units are not classified by spike shape.
#  E2 Trial-type selectivity. A two-tailed t-test (p < 0.05) on spike counts of "lick left"
#     against "lick right" trials in the sample, delay or response epoch; selective when any
#     epoch is significant. The response epoch's window is not given (open; readings (a) 1.3 s
#     from go cue onset, the length of the other epochs and of the response epoch photostimulus;
#     (b) 0 to 1.5 s after the go cue, the answer window). Which trials form "lick left" and
#     "lick right" here is not stated (open; readings (a) correct trials, as in the PSTHs of
#     Extended Data Fig. 4b; (b) all trials with a lick, grouped by instructed direction).
#  E3 Population selectivity (Methods; Extended Data Fig. 4f legend). Each neuron's preferred
#     trial type is fixed from a subset of trials (10 for ALM, 20 for CN) and selectivity is the
#     spike rate difference between preferred and non-preferred trial types on the remaining
#     trials, averaged over neurons with mean and s.e.m. by bootstrap over neurons. The averaging
#     window is not in the text read (a standard choice, 200 ms, used). Whether the subset is 10
#     trials in all or per trial type, and which epoch fixes the preference, are open; the paper
#     says the epoch choice gave qualitatively similar results. For photostimulation effects, all
#     trials (correct and incorrect) grouped by instructed type are used, and only selective
#     neurons tested on > 3 trials in all conditions (Extended Data Figs. 5b, 6c, 9c legends).
#  E4 Photostimulation effect on a neuron (Methods). "Lick left" and "lick right" trials pooled;
#     two-tailed t-test on spike counts, control against photostimulation trials, at p < 0.01
#     (Extended Data Figs. 2d, 5b, 9a legends), in the whole delay epoch (Fig. 3, Extended Data
#     Fig. 5) or in 400 ms bins in 50 ms steps (Fig. 4f). Whether correct trials only or all trials
#     enter is not stated (open; readings all trials and correct trials only).
#  E5 Latency (Extended Data Fig. 9a legend). Among significantly modulated neurons, firing rate
#     change (photostimulation minus control) with the sign flipped for suppressed neurons, in 10
#     ms bins in 1 ms steps; onset is the first bin where the population change differs from 0 by
#     a two-tailed t-test at p < 0.01; neurons resampled with replacement 10,000 times and the
#     mean onset reported. The window that decides "significantly modulated" for this analysis is
#     not given (open; readings (a) the photostimulation period, (b) the whole delay epoch). The
#     paper describes this method only for CN photo-activation (Extended Data Fig. 9a); its use
#     for the latencies of Fig. 3 (ALM and CN photo-inhibition) is assumed, as it gives no other.
#  E6 Coding direction (Methods, Analysis of ALM population dynamics). Sessions with > 5
#     simultaneously recorded neurons and > 5 trials per condition (28 of 39). Spike counts in
#     400 ms windows in 10 ms steps; cd_t is the mean "lick right" minus mean "lick left" response
#     vector, averaged over the delay epoch to one cd, from correct control trials only. Projections
#     cd'x use control and photostimulation trials independent of those that estimated the cd,
#     correct and incorrect, grouped by instructed type; each session is offset by its mean
#     projection over all trials and times (from the cd-estimating trials); s.e.m. by bootstrap
#     over sessions. How trials are split into the cd-estimating and the independent sets is not
#     given; a random half split of control trials is used, a standard choice.
schema_version: 2
paper: doi:10.1038/s41586-018-0633-x
claims:
- id: fig1d-fastigial-lesion-contra-choice
  statement: Fastigial nucleus lesions impair contralesional licking choices, measured as lower
    performance on trials instructing contralesional licking after the lesion than before.
  source: Main text, paragraph 4; Figure 1d
  quote: Fastigial lesions impaired initiation of contralesional licking ( Fig 1d )
  datasets:
  - "000007"
  - crcns-alm-4
  criterion: Performance as in B1 for contralesional and ipsilesional trials, before against
    after the lesion, in the 4 fastigial lesion mice (Supplemental Table 1). The main text gives
    no test and the Fig. 1 legend is not in the text read, so the one-sided bootstrap of B1 at p <
    0.05 is used (B1). Whether mice are pooled or tested one by one is open (readings (a) the
    hierarchical bootstrap of B1 over the 4 mice; (b) per mouse, the bootstrap over that mouse's
    sessions and trials). Reproduced when, under one reading, contralesional performance drops
    after the lesion at p < 0.05 (in every fastigial mouse, under reading (b)). The per-mouse
    drops are reported under both readings.
- id: fig1e-fastigial-lesion-slow-initiation
  statement: After fastigial lesion, the first lick to the contralesional side comes later after
    the go cue than the first lick to the ipsilesional side, while lick rate within bouts and
    bout duration are unchanged.
  source: Main text, paragraph 4; Figure 1e; Extended Data Figure 1b and 1c
  quote: slowed initiation of contralesional licking following the 'go' cue ( Fig 1e ). After
    movement initiation licking was unaffected
  datasets:
  - "000007"
  - crcns-alm-4
  criterion: Time of the first lick after go cue onset (Methods, reaction time), per trial,
    contralesional against ipsilesional licking, in the fastigial lesion mice after the lesion;
    one-sided hierarchical bootstrap as in B1 at p < 0.05 (the Fig. 1e legend, not in the text
    read, would give the paper's test). Reproduced when contralesional first licks are later. For
    the second part, a lick bout is a sequence of licks with inter-lick intervals under 500 ms
    (Extended Data Fig. 1c legend), in the fastigial lesion mice. The legend says lick rate and
    bout duration are "not affected by fastigial lesion" with data grouped by contra- and
    ipsilesional licking, so the comparison is open (readings (a) before against after the
    lesion, for each direction; (b) contra- against ipsilesional bouts after the lesion). The
    paper reports no test for this absence; the bootstrap of B1, two-sided at p < 0.05, is used
    and named as a choice, and the second part holds when under one reading neither measure
    differs.
- id: fig1d-dentate-lesion-no-effect
  statement: Dentate nucleus lesions do not change behavioral choice or movement execution.
  source: Main text, paragraph 4; Figure 1d
  quote: Dentate lesions (~1.5 mm away) did not change behavioral choice and movement execution
  datasets:
  - "000007"
  - crcns-alm-4
  criterion: A claim of absence. Performance as in B1 for contralesional and ipsilesional trials,
    pre against post lesion, in the 4 dentate lesion mice, tested with the one-sided bootstrap of
    B1, pooled and per mouse as the readings of fig1d-fastigial-lesion-contra-choice, at p <
    0.05, the threshold of the paper's other absence statements ("p>0.05 for either trial type").
    Reproduced when neither trial type changes at p < 0.05; the size of each change is reported.
    For movement execution the paper shows no dentate data in the text read (Extended Data Fig.
    1c is fastigial mice only); lick rate within bouts and bout duration, pre against post
    lesion, are tested as in the second part of fig1e-fastigial-lesion-slow-initiation and
    reported, the outcome noting that this part rests on a test the paper does not show.
