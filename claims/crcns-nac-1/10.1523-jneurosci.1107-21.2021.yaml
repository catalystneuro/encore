- id: fig2-five-clusters
  statement: K-means clustering of the 193 cue-responsive units on six firing epochs (onset and
    late cue firing to each cue) gave five functional populations; Threat Excited (5), Threat
    Inhibited (26), Danger Excited (55), Bidirectional Valence (91) and Non-Selective (16).
  source: Results, NAcc neurons show heterogeneous cue firing, paragraphs 1 and 2; Figure 2 legend
  quote: We applied k-means clustering to the matrix and found that five clusters grouped similar
    functional types
  depends_on:
  - cue-responsive-193
  expected:
  - quantity: Threat Excited units
    value: 5
    tolerance: 0.5
  - quantity: Threat Inhibited units
    value: 26
    tolerance: 2.6
  - quantity: Danger Excited units
    value: 55
    tolerance: 5.5
  - quantity: Bidirectional Valence units
    value: 91
    tolerance: 9.1
  - quantity: Non-Selective units
    value: 16
    tolerance: 1.6
  criterion: The 193 x 6 matrix of the Methods (K-means clustering), MATLAB kmeans with its
    defaults (squared Euclidean distance, k-means++ starts), k = 5 as the paper reports choosing
    it. The matrix entries are open; (a) mean normalized firing, as the Results say; (b) mean
    firing in Hz, as the Methods say. The start is random and the paper gives no seed or number
    of replicates; (i) the solution with the lowest summed distance over 100 starts; (ii) the
    most frequent partition over 100 starts. Clusters are named from their centroids by the
    Results' descriptions (Results, NAcc neurons show heterogeneous cue firing, paragraph 2).
    Threat Excited and Threat Inhibited change equally to danger and uncertainty, less to
    safety (up and down); Danger Excited increase most to danger; Bidirectional Valence
    decrease most to danger; Non-Selective increase without differing between cues. Reproduced
    when, under one reading, all five counts are within tolerance; partially reproduced when
    the five named patterns appear but a count is out of tolerance. The cluster number rule
    (fewest clusters with smallest mean distance, k from 1 to 7) is shown as a variant, with
    the mean distance at each k.
