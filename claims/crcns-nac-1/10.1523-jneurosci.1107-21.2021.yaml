# Claims for Ray, Moaddab & McDannald (2022), J Neurosci 42:817-833, on CRCNS data set nac-1.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-06,
# protocol as stated in docs/protocol.md (Reader, version pilot-13).
#
# Text read: the version of record, as supplied under paper/ (PyMuPDF text of the journal PDF):
# Introduction, Materials and Methods, Results, figure legends and Discussion. The Extended Data
# (Figures 1-1, 1-2 and 2-1: per-rat suppression ratios, session by session suppression ratios,
# and the alternative clustering heat plots) are not under paper/ and were not read. No claim
# below rests on them alone; the Results state the numbers the claims use. No PDF renderer was
# available, so figures were read from their legends and the Results only; the value of the
# narrow/wide waveform boundary (dashed line, Figure 3C) could not be read. The extracted text
# prints minus signs and the "x 10^" of p-values as a replacement character; values below are
# recorded as the paper prints them (for example "p = 6.00 x 10^-5" as 6.0e-5).
#
# Code: the paper links no analysis code for the neural analyses. It says the Med Associates
# programs and the MATLAB programs for behavioral analyses are at http://mcdannaldlab.org/resources;
# that page returned 404 on 2026-11-06 (and https://www.mcdannaldlab.org/resources as well), so no
# code was read. The data set's own sample scripts are part of the data set and were not read.
#
# Data the paper used. Seven adult female Long-Evans rats, food restricted to 85% of free-feeding
# weight, nose poking on a VI-60 schedule for food pellets throughout. Pavlovian fear
# discrimination: three 10-s auditory cues, each with a footshock probability (0.5 mA, 0.5 s, 2 s
# after cue offset): danger p = 1.00, uncertainty p = 0.25, safety p = 0.00. Sessions of 16 trials
# (4 danger, 2 uncertainty shock, 6 uncertainty omission, 4 safety), mean ITI 3.5 min, each trial
# a 20-s baseline then the 10-s cue. Eight sessions before surgery (Figure 1C), then single-unit
# recording from 16-wire drivable bundles in the nucleus accumbens core (Plexon OmniPlex, units
# sorted offline in Offline Sorter). 368 NAcc units from 95 recording sessions; 193 cue-responsive
# units from 82 sessions; the three main populations (172 units) from 79 sessions. Measured
# variables: spike times, nose pokes, pellet feeder advances (rewards), cue and shock times, mean
# waveforms. The fear measure is the suppression ratio of nose poking.
#
# The CRCNS data set, by its title and data description, holds the NAcc recordings of this paper:
# 368 single units from 95 behavior sessions of 7 female rats, one MATLAB file per unit, with
# nose poke, suppression ratio, firing and waveform data organized by the 16 trials of a session.
# Whether it holds the eight pre-surgery sessions (Figure 1C), pellet and nose poke times in the
# ITI (Figures 9 and 10), and the paper's own population labels is for the author to find.
#
# Method details from the Methods, used by every claim below unless it says otherwise:
# - Suppression ratio per trial: (baseline poke rate - cue poke rate) / (baseline poke rate + cue
#   poke rate), baseline the 20 s before cue onset, cue the 10-s cue, using that trial's baseline.
# - Cue-responsive screen: per unit, mean firing (Hz) in the 10 s before cue onset against the
#   first 1 s and against the last 5 s of each cue, paired two-tailed t-test, p < 0.05, no
#   correction; a unit is cue responsive if any cue in either window differs.
# - Normalized firing: per unit and trial type, firing in 250-ms bins from 20 s before cue onset to
#   20 s after cue offset (200 bins), averaged over the trials of the type; the mean of the 10 s
#   before cue onset of that trial type subtracted from each bin; then z-scored across all trial
#   types of the unit together (mean 0, SD 1 over all bins).
# - Cue firing ANOVA: cue (danger, uncertainty, safety) by interval (48 bins of 250 ms, 2 s before
#   cue onset to cue offset), within units; uncertainty shock and omission trials collapsed.
#   Onset is the first 1 s of the cue, late cue the last 5 s.
# - 95% bootstrap CIs: MATLAB bootci, studentized, 1000 resamples of the mean over units (or
#   rats); a difference is found when the CI excludes zero, and absent when it contains zero.
#
# Details the paper leaves open that apply to many claims, with the readings it allows:
# - Trial types in the z-score: (a) four (danger, uncertainty shock, uncertainty omission,
#   safety), as the session design has; (b) three, with uncertainty collapsed.
# - Collapsing uncertainty: (a) the mean over all eight uncertainty trials; (b) the mean of the
#   shock and omission trial-type traces.
# - Population labels: the paper's labels come from its k-means clustering (fig2-five-clusters).
#   (a) If the data set holds the paper's population labels, the population claims use them;
#   (b) the populations of the reproduced clustering are run as a variant, or as the only
#   reading when no labels are held.
# - Per-trial normalized firing (tuning curve, fear output regression): the Methods give the
#   normalization only for trial-type means. (a) Each trial's firing minus that trial's 10-s
#   pre-cue mean, divided by the unit's SD from the normalization above; (b) the same, with the
#   trial-type baseline subtracted; (c) each trial's binned firing z-scored over all trials and
#   bins of the unit.
# - Suppression ratio when a trial has no pokes in baseline or cue (0/0): (a) the trial is left
#   out; (b) the ratio is set to 0.
# - The data set's units are rows of one structure; session-level behavior is repeated for every
#   unit of a session. Behavior claims count each session once.
