    Sidak-adjusted over the three pairs, which the legend's numbers imply; two pairs is a
    variant. Four comparisons decide the outcome, GS above WT and GS above GS with MLi-2 for
    each protein, each at adjusted p < 0.05. Reproduced when all four hold; partially
    reproduced when two or three hold; not reproduced otherwise. Whether GS with MLi-2 differs
    from WT is reported. The uncropped blots are not re-quantified.
