# Claims for Doherty, Chen, Smith, Wichmann, Chu & Lytton (2025), npj Parkinson's Disease 11, 230,
# "Enhanced beta power emerges from simulated parkinsonian primary motor cortex", on dandiset 001444.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21, protocol
# pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record as served by Europe PMC (PMC12325672), main text, figure legends
# and Methods. The supplement (Supplementary Tables 1 to 3, Supplementary Figs. 1 to 5) was not in
# the text supplied and was not read. The main text reports every result below from one set of
# simulations; the supplement holds the analyses of the three other sets (Supplementary Table 2),
# the PT5B current-frequency curves (Supplementary Fig. 1) and the conductance changes
# (Supplementary Table 3). The bioRxiv preprint (doi:10.1101/2024.05.23.595566) was also supplied;
# it is an earlier version with another title and was not used for claims.
#
# Code read: github.com/suny-downstate-medical-center/pd_m1_6ohda at commit 0a1f0e8 (2025-08-20, the
# head of main; the paper cites Zenodo 10.5281/zenodo.12399983). It holds the NetPyNE simulation
# (sim/cfg.py, sim/netParams.py, cells, mechanisms) and four notebooks that stream one file each
# from dandiset 001444 and plot the LFP, a raster and five PT5B voltage traces. It holds no code for
# rates, statistics, CV, duty cycle, spectrograms, coincidences or unitary events. The README gives
# the four parameter settings (control or parkinsonian PT5B BK and NaT conductances; rest or
# activated Ih factor and thalamic rates).
#
# The data the paper used. A simulation of a 300 um diameter, 1350 um deep cylinder of mouse M1 with
# 10,073 neurons in 15 populations (IT2, PV2, SOM2, IT4, IT5A, PV5A, SOM5A, IT5B, PT5B, PV5B, SOM5B,
# IT6, CT6, PV6, SOM6; cfg.py), driven by Poisson spike generators standing for thalamic and
# cortical inputs. Four sets of four simulations, each 4.3 s long; each set holds the control and
# parkinsonian conditions in the rest (quiet wakefulness) and activated (movement) states, and each
# set used its own random seeds (Methods, paragraph 2). The paper's results come from set
# sM1_12-12-2023. The paper's notebooks name its files sub-001/sub-001_ses-sM1-12-12-2023-01.nwb
# (control rest), -02 (parkinsonian rest), -03 (control activated) and -04 (parkinsonian
# activated). Measured variables: spike times of every neuron (units named "<population> <index>",
# including the input generators), somatic membrane potential of some PT5B neurons (the notebooks
# plot "Segment 0 PT5B 5401 5" and four others), and the LFP at 11 electrodes at depths 200 to
# 1200 um in 100 um steps (cfg.recordLFP), sampled every 0.025 ms (40 samples per ms; cfg.recordStep
# and the notebooks). The dandiset description says it holds the main and supplemental data.
#
# Definitions used by several criteria, each from the paper or its code as cited:
# - Analysis window W. Rates are "calculated from the last 2.3 s of 4.3 s simulation to avoid
#   initialization transients" (Fig. 2C and 5C legends), so 2.0 to 4.3 s. The spectrograms show
#   "2.3 s of activity starting 2 s after simulation initiation" (Fig. 3 and 6 legends), the same
#   window. The 250 ms panels of Figs. 2A,B and 5A,B are 2.0 to 2.25 s (the notebooks).
# - Rate of a neuron is its spike count in W divided by 2.3 s; a population is given as mean and
#   standard deviation over its neurons (legends of Figs. 2C and 5C, "mean, std dev"). Open is
#   whether neurons silent in W are counted. Readings R1, all neurons of the population; R2, only
#   neurons with at least one spike in W. The IT5A and IT5B rates of 0 spikes/s in the activated
#   state suggest R1, but the text does not say.
# - The paper names no test for any firing-rate p-value. The same network (same seeds) is run in
#   all four simulations of a set, so the neurons can be paired. Readings T1, Wilcoxon signed-rank
#   on paired neurons; T2, paired t-test; T3, Mann-Whitney U on the two groups; T4, Welch's t-test.
#   Two-sided, at the p bound the paper prints.
# - Spectra. The Methods say the LFP was computed with the method built into NetPyNE; they name no
#   spectral method or electrode. Readings S1, the spectrogram of NetPyNE 1.0.5 (the version the
#   Methods name; netpyne.analysis plotLFP, Morlet wavelets, its default parameters); S2, a
#   short-time Fourier transform (NetPyNE's fft option). Electrode readings E1, electrode 0
#   (y = 200 um), the one the paper's notebooks plot as the LFP of Figs. 2 and 5; E2, the mean
#   over the 11 electrodes (NetPyNE's "avg" electrode). Time-averaged power spectra for peak
#   frequencies are taken by Welch's method with 1 s segments, a standard choice that sets only
#   the frequency resolution (1 Hz), well inside every tolerance below.
# - PT5B spike count histogram (SCH): spikes of all PT5B neurons in 2 ms bins (Fig. 2 and 5
#   legends).
# Where the readings of a claim give different outcomes, the claim is blocked as
# methods_underspecified, with every result shown (docs/protocol.md, Reader, step 3).
schema_version: 2
dataset:
  archive: dandi
  id: "001444"
paper: doi:10.1038/s41531-025-01070-4
claims:
- id: fig1-network-size
  statement: The simulated M1 network is composed of 10,073 neurons of seven excitatory pyramidal
    cell types (IT, PT5B, CT) and two interneuron cell types (PV, SOM).
  source: Figure 1 legend; Methods, Microcircuit composition, paragraph 1
  quote: Simulated primary motor cortex (M1) is composed of 10,073 neurons.
  expected:
  - quantity: number of M1 neurons (input generators excluded)
    value: 10073
    tolerance: 0
    unit: neurons
  criterion: In each of the four files of set sM1_12-12-2023, count the units whose population is
    one of the 15 M1 populations of sim/cfg.py (allpops), leaving out the input spike generators.
    Reproduced when the count is 10,073 in each file. The tolerance is zero because the number is
    a count of a fixed model, not a measurement.
- id: model-pt5b-excitability-decrease
  statement: In the parkinsonian condition the PT5B neuron model was changed (BK and NaT
    conductances) so that its spike count across current injections fell by 64%, as in 6-OHDA
    mouse slices.
  source: Methods, paragraph 2 and Morphology and physiology of neuron classes, paragraph 3;
    Supplementary Fig. 1 (not read)
  quote: In the simulated parkinsonian mouse M1 PT5B currents (BK and NaT) were modified so that
    they showed a 64% decrease in excitability as reported by Chen et al.
  expected:
  - quantity: PT5B spike count decrease across current injections, parkinsonian against control
    value: 64
    tolerance: 6.4
    unit: percent
  criterion: Needs single-neuron current-injection simulations of the control and parkinsonian
    PT5B model (README parameter settings; cfg.gpeak and cfg.gnafbar). The current amplitudes,
    step duration and averaging behind the 64% are those of Fig. 1D of Chen et al. 2021 (J.
    Neurosci. 41, 5553) and Supplementary Fig. 1, which was not available to this reader. The
    claim can be tested only if the dataset holds these current-injection simulations and the
    supplement or the question process supplies the protocol; otherwise the detail is open and
    the claim is blocked as methods_underspecified.
- id: robustness-four-sets
  statement: The results hold across four sets of four simulations with different random seeds;
    set sM1_12-12-2023 is a typical example and the other three sets are analysed in
    Supplementary Table 2.
  source: Methods, paragraph 2; Supplementary Table 2 and Supplementary Figs. 2 to 5 (not read)
  quote: To demonstrate robustness, we ran 4 sets of 4 simulations (Supplementary Table 2 ), each
    set including the control and parkinsonian conditions in rest state and in the activated
    (movement) state.
  criterion: Supplementary Table 2, which gives the measures and values for the other three sets,
    was not in the text supplied, so this reader cannot fix the measures, the expected values or
    what counts as holding. The claim is blocked as methods_underspecified until a reader with the
    supplement completes it. The author may report, for each set the dataset holds, the measures
    of the claims below, without an outcome.
