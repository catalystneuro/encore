- id: fig4-control-unitary-events
  statement: In the control condition, PT5B coincident firing above that expected from
    rate-matched Poisson processes occurs at rest in 100 to 275 ms clusters with 15 to 24 Hz
    periodicity (mean 19 Hz), totalling 0.7 of 4.0 s (17.5%), and in the activated state in more
    frequent 125 to 250 ms clusters totalling 1.1 of 4.0 s (27.5%).
  source: Figure 4B,D legends; Results, Control simulations, paragraph 7
  quote: The total duration of significant synchronous activity increased from 0.7 s out of 4.0 s
    (17.5%) at rest to 1.1 s out of 4.0 s (27.5%).
  expected:
  - quantity: duration of significant synchrony, control rest
    value: 0.7
    tolerance: 0.07
    unit: s
  - quantity: duration of significant synchrony, control activated
    value: 1.1
    tolerance: 0.11
    unit: s
  - quantity: mean periodicity within significant periods, control rest
    value: 19
    tolerance: 1.9
    unit: Hz
  criterion: Files -01 and -03, all PT5B spikes. Unitary event analysis (Methods, Identifying
