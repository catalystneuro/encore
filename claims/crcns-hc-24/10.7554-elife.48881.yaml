# Claims for Varela & Wilson (2020), eLife 9, e48881, on CRCNS hc-24.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-06,
# protocol as stated in docs/protocol.md.
#
# Text read: the version of record, PMC7319772 (Europe PMC full-text XML, flattened), with its
# Results, figure legends, figure supplements (Figure 1 to 7 supplements), Table 1 and Materials
# and methods. The figure supplements are legends only; no separate supplementary file exists.
# The PDF was not opened. The data descriptor (hc-24 data description, version 0.6) was read
# only to know what the dataset is meant to hold; no claim comes from it.
#
# Code. The paper links no analysis code. Its only software link is Xclust, the manual spike
# sorting program (github.com/wilsonlab/mwsoft64, src/xclust), which fixes no analysis choice
# and was not read. The Data availability statement says the CRCNS deposit holds Matlab scripts
# that illustrate the main findings; they are files of the dataset and were not read here. No
# detail below comes from code.
#
# Data the paper used, as it reports them. Eight male Long-Evans rats (units from seven); 333
# units in total; 63 thalamic units (Table 1: RE 25, VM 18, MD 7, Rh/CM 4, PT/AM 7, no histology
# 2). Tetrodes in mPFC (prelimbic, infralimbic), midline thalamus (RE, VM, MD, PT, Rh, CM) and
# dorsal CA1. Sessions of 1 to 5 h in a quiet 50 x 50 cm enclosure where the rat cycled between
# sleep and waking; 32 sessions with thalamic units, 23 sessions from six rats for the LFP event
# analyses. In six sessions (three rats, two each) the rat explored a 4-arm or 8-arm radial maze
# for 30 min between sleep before (about 52 min) and sleep after (about 78 min); four long
# sessions without the maze from two of these rats served as a control. Measured variables: unit
# and multi-unit spike times (32 kHz, peak amplitudes on 4 wires), LFP at 600 Hz, head position
# from two LEDs at 30 Hz. The CRCNS description lists three sessions from three rats (52, 69 and
# 93 min) of rest in the enclosure, with units, multi-unit spikes and LFP per region and derived
# data (sleep periods, K-complex, spindle trough and SWR timestamps). It mentions no maze
# sessions. Whether the dataset holds the maze sessions is for the author to find.
#
# Shared methods, cited from the paper. Criteria below refer to them by label.
# M-filter. One wire of one tetrode per region, chosen by visual inspection (Methods, LFP state
#   and event detection, paragraph 1). Zero-phase FIR band-pass, Blackman window, order six times
#   sampling rate over bandwidth; delta 1-4 Hz, spindle 6-14 Hz, ripple 100-275 Hz (same place).
#   Open, which wire; readings (a) the wire the deposited derived events were detected on, when
#   the dataset says which, (b) each candidate wire in the region, reporting all.
# M-sleep. Non-REM sleep is time when mPFC delta power and CA1 ripple power are both above the
#   session mean for at least 2 min (Methods, paragraph 2), power being the moving average of
#   the squared filtered LFP (Figure 1C legend); periods confirmed by visual inspection and by
#   velocity (Gaussian smoothing 250 ms sd, gaps under 300 ms interpolated). Open, the moving
#   average window and the inspection. Readings (a) the sleep periods deposited as derived data,
#   (b) the rule as written with a 1 s window, (c) the same with a 10 s window (1 s and 10 s are
#   choices the paper does not make).
# M-KC. Delta-filtered mPFC LFP with positive values set to 0, squared, local maxima above mean
#   plus 4 sd (Methods, paragraph 3; Results, opening section, paragraph 1). Open, where mean and
#   sd come from; the Methods say "the LFP in quiet states", the Results "the average LFP voltage
#   across sleep periods". Readings (a) sleep periods, (b) all immobile time. A further reading is
#   the deposited K-complex timestamps.
# M-spindle. Spindle troughs; the Methods say local minima three sd below the mean of the
#   spindle-filtered LFP, the Results an amplitude threshold of 3 sd on the squared filtered trace.
#   Readings (a) minima of the filtered trace below mean minus 3 sd (Methods, followed first),
#   (b) troughs where the squared trace exceeds mean plus 3 sd of the squared trace (Results),
#   (c) the deposited spindle trough timestamps. A spindle cycle runs from the peak before to the
#   peak after a detected trough (Results, Sparse thalamic firing, paragraph 5; Figure 6, figure
#   supplement 1 legend). Detection is limited to sleep (Figure 1, figure supplement 3 legend).
# M-SWR. Squared ripple-filtered CA1 LFP above mean plus k sd for at least 20 ms, events closer
#   than 20 ms merged, timestamp at the largest absolute filtered value (Methods, paragraph 3).
#   The Methods give k = 3, the Results k = 4 (Results, opening section, paragraph 1); readings
#   (a) k = 3 (Methods, first), (b) k = 4, (c) the deposited SWR timestamps. Mean and sd "when
#   the animal was quiet"; readings as in M-KC.
# M-PETH. Peri-event histograms in 15 ms bins smoothed with a Gaussian of 15 ms sd; a null from
#   100 shifts of all event times by a uniform random 1.5 to 2.5 s; each bin expressed in sd from
#   the null (Methods, Correlation quantifications, paragraph 1; Figure 1, figure supplement 4).
#   Reference times are KC and spindle troughs and SWR peaks. The plotted extent is not given; a
#   window of plus or minus 1 s is used, a standard choice that cannot change any windowed value
#   below. Open, whether the shift is forward only or of random sign; readings (a) forward,
#   (b) random sign, a choice that is not expected to change the outcome.
# M-burst. Burst spikes are groups of spikes with inter-spike intervals under 5 ms whose first
#   spike follows at least 70 ms of silence (Results, Thalamic cells decrease, paragraph 4). The
#   paper does not say whether the leading spike counts; following the criterion it cites (Lu et
#   al., 1992) it does, and a burst has at least two spikes.
# M-phase. Instantaneous phase from the Hilbert transform of the delta or spindle-filtered mPFC
#   LFP; spike phase histograms normalized by the phase distribution of the whole filtered LFP in
#   non-REM sleep; Rayleigh test for non-uniformity; von Mises fit for mean phase and kappa
#   (Methods, Phase-locking analyses, paragraph 1). Phase 0 is the LFP peak, plus or minus pi the
#   trough, positive values the descending phase (Results, Phase-locking, paragraph 1; Figure 5C
#   legend). Open, how the normalization enters the Rayleigh test and the bin count; readings
#   (a) Rayleigh test on the normalized histogram as binned weighted angles, 36 bins (a standard
#   choice), (b) Rayleigh test on raw spike phases, the normalized histogram used only for the
#   mean and kappa.
# M-stats. Unpaired data, Mann-Whitney U; paired, Wilcoxon signed rank; Kruskal-Wallis for
#   one-way, two-way ANOVA for two factors, F-test for variances, Tukey-Kramer for multiple
#   pairwise comparisons (Methods, Phase-locking analyses, paragraph 2). Two-sided, alpha 0.05,
#   unless the claim says otherwise.
#
# Unit samples. The paper's n changes between analyses (40 thalamic units for waking against
# sleep, 47 for SWR histograms and autocorrelations, 31 for KC and phase analyses, 39 pairs) and
# it does not give the rule behind each subset, beyond units on tetrodes moved at least 80 um or
# with changed cluster profiles (Methods, Selection of electrodes and sessions). Every criterion
# runs on all thalamic (or CA1, mPFC) units the dataset holds that meet the analysis's own stated
# condition, and reports n. The dataset is expected to hold a subset of the paper's sessions, so
# proportions and means are compared with the paper's values, with their tolerances, and the
# direction of each effect is judged on the subset.
#
# Outside data. The paper uses none. Part of its data is the CRCNS deposit itself (hc-24,
# doi:10.6080/K0K35RVG); the Data availability statement also names CRCNS hc-19, without
# saying what it holds for this paper. No claim needs it.
