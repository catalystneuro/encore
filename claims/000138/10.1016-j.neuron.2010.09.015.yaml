- id: fig4e-correlation-time-course
  statement: The correlation of preparatory tuning with peri-movement tuning measured at single
    time points starts to fall about 200 ms before movement onset and is near zero by movement
    onset.
  source: Results, Correlations between preparatory and peri-movement tuning, paragraph 2; Figure
    4E
  quote: The correlation with preparatory activity began to decline ∼200 ms prior to movement
    onset, and reached values near zero by movement onset ( Figure 4E )
  criterion: Per neuron (same selection as Figure 4A-D), the preparatory epoch rates correlated
    with the rates at each single time point of the trace smoothed with a 20 ms Gaussian (Figure
    4 legend), the trace spliced from the target-, go- and movement-locked averages
    (Supplemental Experimental Procedures, Computing the mean firing rate versus time); the
    correlation averaged over neurons. The paper fixes no number for "near zero", so it is fixed
    here, from the dataset means of Figure 4 (0.06 to 0.21). Reproduced when the mean
    correlation at movement onset is below 0.1 in absolute value and below half of its value
    250 ms before movement onset, and the curve has not fallen by more than a quarter of its
    early value before 300 ms before movement onset.
  depends_on:
  - fig4d-tuning-correlation-j-array
