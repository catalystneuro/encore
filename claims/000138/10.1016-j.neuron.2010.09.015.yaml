- id: supp-preparatory-dimensionality
  statement: Depending on the dataset, 7 to 10 dimensions capture 90% of the variance of
    preparatory activity across conditions.
  source: Supplemental Experimental Procedures, Estimating the upper limit of PD performance
  quote: depending on the dataset, 7-10 dimensions were required to capture 90% of the data variance
  expected:
    quantity: number of principal components for 90% of variance
    value: 8.65
    tolerance: 2.35
  criterion: PCA of the c x n matrix of mean preparatory epoch rates, one row per condition, one
    column per neuron (Supplemental Experimental Procedures), rates not normalized. The claim
    holds when the number of components needed for 90% of the variance is within the range 7 to
    10 widened by 10% of each bound, 6.3 to 11 (the expected entry gives its midpoint). Open
    which neurons enter, (a) all recorded units, (b) those passing the inclusion criterion; both
    are run. For monkey J the value is per 27-condition set.
- id: fig6-peri-movement-space-best
  statement: For every dataset, preferred directions capture preparatory tuning best (highest
    cross-validated performance) when expressed in the peri-movement space, usually at middle
    dimensionalities.
  source: Results, PD performance in a variety of spaces, paragraph 2; Figure 6A-D
  quote: For every dataset, the highest level of performance was achieved ... when PDs were
    expressed in the peri-movement space
  criterion: Per dataset, mean performance across included neurons (shared methods above) for the
    peri-movement space at each k, the kinematic space at each k, the EMG space where EMG was
    recorded (not J-array), and each task space defined for the task. Reproduced when the
    peri-movement space's best mean performance over k is higher than that of every other space,
    under one combination of the named readings; the result of every reading is shown.
- id: fig6-each-dimensionality
  statement: At each dimensionality taken alone the peri-movement space almost always performs
    best; the exception is the speed task at three dimensions, where two task spaces perform very
    well, while endpoints + maximum speed does not perform well for the maze task.
  source: Results, PD performance in a variety of spaces, paragraph 2; Figure 6A-D
  quote: Even if we consider each dimensionality individually, performance was almost always higher
    for the peri-movement space. An exception was that, among 3-dimensional spaces, the
    ‘targs+instr. spd.’ and ‘endpoints + max. spd.’ performed very well for the datasets collected
    using the speed task. The former is undefined for the maze task, but the latter did not
    perform well.
  criterion: For each space other than peri-movement and each of its dimensionalities k (each k
    for PCA spaces, the fixed k of a task space), compare mean performance with that of the
    peri-movement space at the same k. "Almost always" is not quantified in the paper; it is
    fixed here as at least 80% of such comparisons in the dataset won by the peri-movement
    space. For maze data, reproduced when that holds and the peri-movement space beats
    endpoints + maximum speed at k = 3. The share of comparisons won is reported.
  depends_on:
  - fig6-peri-movement-space-best
- id: fig6-dimensionality-trend
  statement: Performance of the PCA-based spaces typically rises with dimensionality and falls
    beyond about 10 dimensions, a sign of overfitting.
  source: Results, PD performance in a variety of spaces, paragraph 1; Figure 6A-D
  quote: Performance typically improved with dimensionality. ... Performance typically declined at
    dimensionalities >10, an indication of over-fitting.
  criterion: For the peri-movement and kinematic spaces of fig6-peri-movement-space-best,
    reproduced when, for the peri-movement space, mean performance at its best k exceeds that at
    k = 1 and the best k is 10 or less with performance at the largest tested k below the best;
    the same is reported for the kinematic space.
  depends_on:
  - fig6-peri-movement-space-best
- id: fig6-pd-adequate-all-spaces
  statement: The PD performs adequately (above chance, performance above zero) in most spaces,
    as expected from correlations among movement parameters.
  source: Results, Testing preparatory tuning in PCA-based spaces, paragraph 3; Figure 6
  quote: In fact, the PD generally performed adequately regardless of the space in which it was
    expressed.
  criterion: From the results of fig6-peri-movement-space-best. Figure 6 legend and Results define
    zero as the level of predicting every condition by the mean rate, with points above zero
    "considerably better than chance". Reproduced when the mean performance is above zero for
    the peri-movement and kinematic spaces at their best k and for more than half of the task
    spaces.
  depends_on:
  - fig6-peri-movement-space-best
- id: fig6e-summary-rank
  statement: Combined across monkeys A, B and J, mean performance is highest for the peri-movement
    space at every maximum dimensionality (3, 6, 12), the advantage grows with dimensionality,
    and task spaces are outcompeted by the kinematic and EMG spaces, which are outperformed by
    the peri-movement space; other spaces are significantly worse than the best (p < 0.001).
  source: Results, PD performance in a variety of spaces, paragraph 3; Figure 6E and legend
  quote: Performance (averaged across neurons) was highest when the PD employed the space based on
    peri-movement neural activity. This performance differential increased at higher
    dimensionalities ... the task spaces were largely outcompeted by the PCA-based kinematic and
    EMG spaces, which were in turn outperformed by the peri-movement space
  statistics:
  - about: spaces marked significantly worse than the best space
    test: not named
    p: 0.001
    p_relation: "<"
    n: neurons of monkeys A, B and J
  criterion: Over the neurons of datasets A, B and J (J-array excluded, Results), for spaces
    defined in all three datasets, the performance of each space with dimensionality up to 3, 6
    and 12 (for PCA spaces the best k up to the limit), averaged across neurons with SEs.
    Reproduced when the peri-movement space has the highest mean in all three sub-panels, its
    lead over the next space grows from 3 to 12, and the kinematic and EMG spaces at the 12
    limit exceed every task space. The test behind the asterisks is not named; readings are (a)
    a paired t-test across neurons, (b) a Wilcoxon signed-rank test, each against the best
    space; spaces below the best at p < 0.001 are reported.
  depends_on:
  - fig6-peri-movement-space-best
- id: fig7a-shuffled-space-poor
  statement: A control peri-movement space in which each neuron's peri-movement pattern is
    inverted on a random half of conditions performs poorly.
  source: Results, Controls, paragraph 1; Figure 7A and legend
  quote: The PCA-based ‘shuffled-space’ performed poorly ( Figure 7A )
  criterion: As in the Figure 7A legend, for each neuron and condition, with probability 0.5 the
    peri-movement response is kept, otherwise activity up to 150 ms before movement onset is
    kept and all later activity is reflected vertically about the rate at that time; the PCA
    space is then built as for the peri-movement space. The draw is repeated (a standard choice,
    20 draws) and averaged. "Poorly" is not quantified; fixed here as the shuffled space's mean
    performance below the peri-movement space's at every k and its best over k below the best of
    the kinematic space.
  depends_on:
  - fig6-peri-movement-space-best
- id: fig7b-window-start-onset
  statement: Sliding the start of the peri-movement window from 150 ms before movement onset to
    movement onset barely lowers performance, which stays at 97% (monkey J) and 94% (monkeys A,
    B) of its original value.
  source: Results, Controls, paragraph 1; Figure 7B and legend
  quote: Even when the window began at movement onset ... performance was still at 97% (monkey J),
    and 94% (monkeys A, B) of its original value.
  expected:
  - quantity: performance with window start at movement onset over original, monkey J
    value: 0.97
    tolerance: 0.097
  - quantity: performance with window start at movement onset over original, monkeys A and B
    value: 0.94
    tolerance: 0.094
  criterion: Per dataset, mean performance of the peri-movement space at its best k (Figure 7B
    legend) with the window starting at movement onset, divided by that with the window starting
    150 ms before. The window end is not said to move; it stays at 800 ms (maze) or 400 ms
    (speed) after onset. Whether "monkey J" includes the J-array dataset is open; readings are
    (a) J-array judged against 0.97, (b) the mean of J and J-array against 0.97.
  depends_on:
  - fig6-peri-movement-space-best
- id: fig7c-anterior-posterior
  statement: The peri-movement space captures preparatory tuning at both anterior and posterior
    sites, with normalized performance only slightly different from that of random halves of the
    data, slightly better at anterior sites.
  source: Results, Comparison of anterior versus posterior sites, paragraph 1; Figure 7C and legend
  quote: The ability of the peri-movement space to capture tuning also held for both anterior and
    posterior sites ( Figure 7C ). ... Normalized performance was only slightly different than if
    we down-selected the data randomly.
  criterion: As in the Figure 7C legend, neurons split at the median AP location (anterior at or
    above, posterior at or below), and randomly into halves; for each subset the peri-movement
    space is built from that subset's neurons only and performance computed in six dimensions,
    normalized by the estimated upper limit (the PCA space of preparatory activity, Supplemental
    Experimental Procedures) for that subset. Open whether that upper limit is taken at k = 6 or
    at its best k; both are run. Reproduced when the normalized performances of the anterior and
    posterior subsets are each above zero and within 10% of that of the random halves; whether
    anterior exceeds posterior is reported. AP location for array units as in
    results-ap-location-no-effect.
  depends_on:
  - fig6-peri-movement-space-best
  - results-ap-location-no-effect
- id: fig7d-pd-consistency
  statement: In all four datasets and for every comparison, the PD is more stable across random
    subsets of conditions when measured in the peri-movement space than in task, kinematic or EMG
    spaces.
  source: Results, Stability of the PD, paragraph 1; Figure 7D and legend
  quote: Yet for every comparison, and for all four datasets, the PD was most stable when measured
    in the peri-movement space.
  criterion: Per neuron, 25 conditions drawn with replacement, the PD (unit-length b) fitted, a
    second 25 drawn and the PD refitted; consistency is the dot product of the two PDs (Results,
    Stability of the PD), averaged over draws (number of draws a standard choice, 100) and
    neurons. Compared spaces (Figure 7D legend) are endpoints + maximum speed (maze; targets +
    instructed speed for the speed task), segment directions, the kinematic space and, where
    recorded, the EMG space at their best k from Figure 6; each against the peri-movement space
    of the same dimensionality. Reproduced when the peri-movement space has the higher mean
    consistency in every comparison of the dataset.
  depends_on:
  - fig6-peri-movement-space-best
- id: fig8-oscillator-model
  statement: In a simulated two-unit linear oscillator held at 25 initial states and then
    released, preparatory and peri-movement activity of a unit are nearly uncorrelated (r =
    0.08), yet a PD in the two-dimensional peri-movement space captures the preparatory tuning
    perfectly.
  source: Results, Tuning from a dynamical systems perspective, paragraphs 1 and 2; Figure 8 and
    legend
  quote: The correlation of preparatory activity with peri-movement activity (averaged over the
    gray interval) was 0.08. ... The PD points towards the pattern recruited by the activity of
    unit one (panel A ), and perfectly captures preparatory ‘tuning’.
  data: with_inputs
  expected:
    quantity: correlation of unit 1 preparatory and peri-movement activity
    value: 0.08
    tolerance: 0.008
  criterion: A simulation with no recorded data, from the Figure 8 legend, x(t+1) = W x(t) with W
    = [1 -2pi/360; 2pi/360 1], 25 random initial states held and then released. Open, the
    distribution of initial states ((a) uniform in a square centred on zero, (b) a standard 2-D
    Gaussian) and the gray interval ((a) one full cycle, 360 steps, (b) half a cycle, 180
    steps). The value 0.08 comes from one random draw, so a 10% tolerance cannot be met by
    design; the claim's number is judged as holding when 0.08 lies within the central 95% of r
    over 1000 draws under one reading, with the median r reported. The PD part holds when the
    leave-one-out performance of a PD in the 2-D PCA space of the released activity is at least
    0.99.
