paper: doi:10.1016/j.neuron.2010.09.015
claims:
- id: fig4abc-tuning-correlation-single-electrode
  statement: In the three single-electrode datasets (monkeys A, B, J) the correlation across
    conditions between a neuron's preparatory and peri-movement firing rates is positive on
    average but small (mean r 0.21, 0.19 and 0.06; mean Spearman r 0.20, 0.20 and 0.06).
  source: Results, Correlations between preparatory and peri-movement tuning, paragraph 1; Figure
    4A-C
  quote: Across the four datasets the mean correlation was positive (p=0.01, p=0.01, p=0.12, p=0.03)
    but only very modestly so (mean r = 0.21, 0.19, 0.06 and 0.13). Non-parametric correlations
    were similarly modest (mean Spearman's r = 0.20, 0.20, 0.06 and 0.11)
  statistics:
  - about: mean correlation above zero, monkey A
    test: not named
    p: 0.01
  - about: mean correlation above zero, monkey B
    test: not named
    p: 0.01
  - about: mean correlation above zero, monkey J
    test: not named
    p: 0.12
  expected:
  - quantity: mean Pearson r, monkey A
    value: 0.21
    tolerance: 0.021
  - quantity: mean Pearson r, monkey B
    value: 0.19
    tolerance: 0.019
  - quantity: mean Pearson r, monkey J
    value: 0.06
    tolerance: 0.006
  - quantity: mean Spearman r, monkey A
    value: 0.20
    tolerance: 0.02
  - quantity: mean Spearman r, monkey B
    value: 0.20
    tolerance: 0.02
  - quantity: mean Spearman r, monkey J
    value: 0.06
    tolerance: 0.006
  criterion: Per neuron, the Pearson and Spearman correlations between the vector of preparatory
    epoch rates and the vector of peri-movement epoch rates, one entry per condition (Methods,
    Correlations), over neurons passing both the preparatory criterion and the 1.5 times
    peri-movement criterion (shared methods above). For monkey J each neuron uses its own
    27-condition set. Each dataset is judged on its own; it is reproduced when its mean
    correlations are within tolerance. The test of the mean against zero is not named; readings
    are (a) a two-sided one-sample t-test on r, (b) the same on Fisher z, (c) a Wilcoxon
    signed-rank test; the p-values are reported for each.
- id: fig4d-tuning-correlation-j-array
  statement: In the J-array dataset the mean correlation between preparatory and peri-movement
    tuning is positive but small (mean r 0.13, p = 0.03; mean Spearman r 0.11).
  source: Results, Correlations between preparatory and peri-movement tuning, paragraph 1; Figure
    4D
  quote: Across the four datasets the mean correlation was positive (p=0.01, p=0.01, p=0.12, p=0.03)
    but only very modestly so (mean r = 0.21, 0.19, 0.06 and 0.13)
  statistics:
  - about: mean correlation above zero, J-array
    test: not named
    p: 0.03
  expected:
  - quantity: mean Pearson r, J-array
    value: 0.13
    tolerance: 0.013
  - quantity: mean Spearman r, J-array
    value: 0.11
    tolerance: 0.011
  criterion: As for fig4abc-tuning-correlation-single-electrode, with the array inclusion
    criterion (more than 5 spikes/s of preparatory tuning) and the 1.5 times peri-movement
    criterion, over all maze conditions present. Reproduced when both means are within
    tolerance and the mean r is above zero at p < 0.05 under one of the named tests (a) to (c);
    partially reproduced when the mean r is positive at p < 0.05 but a mean falls outside
