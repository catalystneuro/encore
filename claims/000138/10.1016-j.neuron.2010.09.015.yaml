# Claims for Churchland, Cunningham, Kaufman, Ryu & Shenoy (2010), Neuron 68, 387-400, on dandiset 000138.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-10-28,
# protocol pilot-12 as stated in docs/protocol.md.
#
# Text read: the NIH author manuscript in PubMed Central (PMC2991102, NIHMS240235), main text,
# Methods and figure legends, with its one supplement file (NIHMS240235-supplement-01.pdf:
# Supplemental Figures 1 to 5, Supplemental Text, Supplemental Experimental Procedures). This is
# the accepted manuscript, not the copyedited version of record. The main-text PDF was not
# available, so Figure 6A-D, the range of dimensionalities plotted there and the per-dataset
# values in Figures 6 and 7 could not be read. The paper links no analysis code, so no code was
# read.
#
# Data the paper used (Results, Behavior and recordings; Methods; Supplemental Experimental
# Procedures). Three adult male rhesus monkeys (A, B, J) made delayed reaches on a fronto-parallel
# screen. Speed task (monkeys A, B): 7 directions, 2 distances, 2 instructed speeds, 28 conditions.
# Maze task (monkey J): straight reaches, or reaches curving around virtual barriers, with or
# without distractor targets, 108 conditions in all. Four datasets: A (64 single units), B (74), J
# (172 single units by single electrode, in four sets of 27 conditions, about 53 neurons each,
# analysed per set and then averaged), and J-array (two 96-electrode arrays, one in caudal PMd and
# one in surface M1, 146 single- and multi-unit isolations, all 108 conditions interleaved). Mean
# trials per neuron 311, 492, 388 and 2166 (the Methods give 2155 for the array). Delays 0 to
# 1000 ms; only trials with delays over 400 ms were analysed. Fixation was enforced for monkey J.
# Hand position was tracked at 60 Hz, eye position at 240 Hz. EMG (6, 11 and 8 recordings for
# A, B and J) was recorded for the single-electrode datasets only, not for J-array. Recordings are
# from caudal PMd and surface and sulcal M1.
#
# The archive describes dandiset 000138 (MC_Maze_Large, Neural Latents Benchmark) as sorted units
# from M1 and PMd arrays in one macaque performing the maze task, with hand, cursor and eye
# position, limited to 500 train and 100 test trials. So it can hold at most a part of the
# J-array dataset, with far fewer trials than the paper's. Claims on monkeys A, B and on the J
# single-electrode dataset are listed because they are main findings.
#
# Methods shared by the criteria below, from the paper:
# - Firing rates: spike trains smoothed with a 20 ms Gaussian before averaging over the trials of
#   a condition (Supplemental Experimental Procedures, Computing the mean firing rate versus
#   time). Whether 20 ms is the SD is not said; SD 20 ms is a standard choice and cannot change
#   epoch means appreciably.
# - Trials: delay over 400 ms (Methods, Task design and behavior). For the maze task, only trials
#   whose horizontal and vertical velocity profiles correlate with a reference proto-trial at
#   r > 0.9 (Supplemental Experimental Procedures, Task design). The proto-trial is not defined;
#   readings are (a) the mean velocity profile of the condition's trials, (b) its median trial.
# - Movement onset is used throughout but its detection is not given here (the paper refers to
#   Churchland et al. 2006c). Readings are (a) the movement onset the data provide, (b) a hand
#   speed threshold crossing; the threshold is open.
# - Preparatory epoch, 200 ms before the go cue to 100 ms after; peri-movement epoch, 100 ms
#   before movement onset to 350 ms after (Methods, Correlations between preparatory and
#   peri-movement tuning). The PD section uses "the preparatory epoch" without redefining it,
#   so the same window is used for the PD analyses.
# - Neuron inclusion: at least 10 spikes/s of preparatory tuning for single-electrode data, more
#   than 5 spikes/s for the array (Methods, Neural recordings and datasets). "Tuning" in spikes/s
#   is not defined; readings are (a) the range (maximum minus minimum) of the condition means in
#   the epoch, (b) their SD across conditions. Figure 4 analyses further require peri-movement
#   tuning at least 1.5 times the preparatory tuning; Figures 5 to 7 do not.
# - PD model: x_n = b_o + S b by linear regression with offset (Methods, Using a PD). Performance:
#   leave-one-condition-out cross-validation, one minus the mean squared error of the left-out
#   predictions normalized by the variance of the data, averaged across neurons (Methods, PD
#   performance). Open: (a) the space S is computed once from all conditions and only the
#   regression leaves a condition out, or (b) S is recomputed without the left-out condition.
#   Also open whether the variance is that of the neuron's c preparatory rates (reading a,
#   per-neuron normalization then mean across neurons) or a pooled ratio (reading b).
# - Peri-movement space: PCA (columns mean-centred across conditions, Supplemental Text) of a
#   c x nt matrix T, each row one condition, holding every neuron's rate except the neuron being
#   fit, from 150 ms before movement onset to 400 ms (speed task) or 800 ms (maze task) after;
#   rates not normalized (Methods, PCA-based spaces). The k leading PC scores give S. Which
#   neurons enter T is open: (a) all recorded units, (b) only those passing the inclusion
#   criterion. The time step of T is a standard choice (1 or 10 ms).
# - Kinematic space: PCA of a T matrix of horizontal and vertical hand position, velocity and
#   acceleration from 150 ms before movement onset "until after the reach", each variable
#   normalized to unity range across times and conditions; "each neuron contributed one
#   kinematic variable" (Methods). Open: the end of the window, (a) the same end as for neural
#   data, (b) the end of the reach by a speed threshold; and how variables are replicated, (a)
#   the six variables repeated equally to the number of neurons, which gives the same PCs as the
#   six alone, (b) the six alone.
# - Task spaces for the maze task (Methods, Task spaces): initial velocity (2-D, mean velocity in
#   the first 150 ms of the reach); endpoints + maximum speed (3-D); endpoints + orthogonal
#   excursion (3-D, signed, positive counterclockwise); endpoints + viapoint (4-D); endpoints +
#   maximum velocity (4-D); endpoints + halfpoint (4-D); segment directions (6-D, three
#   segments); kitchen sink (11-D, adding barrier and distractor presence). Open: the reach end
#   (speed threshold or fixed time), whether the halfpoint and segments split the path by length
#   or by time; readings by length and by time.
# - Range of dimensionalities k: the Results give "k in the range of 3-14" and Figure 6E allows
#   up to 12. Readings: k = 1 to 14, and k = 1 to 12.
schema_version: 2
dataset:
  archive: dandi
