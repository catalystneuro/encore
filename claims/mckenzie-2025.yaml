  quote: Similar results were found when representational similarity was not conditioned on the mouse's location
    (Figure S7 G,H)
  statistics:
  - about: novel environment
    test: t-test
    statistic: t(7) = 5.23
    p: 0.001
    n: 8 sessions
  - about: familiar environment
    test: t-test
    statistic: t(7) = 5.60
    p: 0.0008
    n: 8 sessions
  criterion: As fig7e-novel-settling, with the 3 most similar vectors taken from all bins of the run regardless
    of location. Reproduced when minute 1 is lower than minute 10 at p < 0.05 in both environments.
  depends_on:
  - fig7e-novel-settling
- id: fig8b-late-moments-reactivated
  statement: Moments 10 to 11 minutes after a novel context transition are more likely to be reactivated in
    post-experience ripples than moments 0 to 1 minutes after it.
  source: Results, No preferential reactivation of moments following transition, paragraph 1; Figure 8A and
    8B
  quote: Contrary to expectations, the pattern of activity observed towards the end of the session was more
    likely to be reactivated in the ripples that followed the experience (Figure 8 A,B)
  statistics:
  - test: t-test
    statistic: t(7) = 2.46
    p: 0.04
    n: 8 sessions
  criterion: 'Methods, Ripple detection and Reactivation analysis, with E1 to E4, E7, E9 and E10. Per session,
    for each 100 ms moment the percentage of post ripples that reactivate it; the mean over moments in 600
    to 660 s and in 0 to 60 s after transfer. Reproduced when the late value is higher by the paired t-test
    over sessions at p < 0.05, under one combination of the readings of E1 and E10.'
  depends_on:
  - ephys-ensemble-size
- id: fig8d-familiar-no-difference
  statement: In the familiar environment, early and late moments do not differ in reactivation rate.
  source: Results, No preferential reactivation of moments following transition, paragraph 1; Figure 8C and
    8D
  quote: There is no difference in reactivation rate for early vs late moment in a familiar environment (t(7)
    = 0.40, p = 0.70)
  statistics:
  - test: t-test
    statistic: t(7) = 0.40
    p: 0.7
    n: 8 sessions
  criterion: A claim of absence, judged on the paper's t-test over 8 sessions (E7) at p < 0.05, as fig8b-late-moments-reactivated
    on the familiar figure-eight run, with pre and post ripples taken around that run (E10 applied to it).
    Reproduced when the early against late difference is not significant; not reproduced when it is. Effect
    size reported either way; absence is judged under readings E10 (a) with z-scored track vectors, the others
    shown.
  depends_on:
  - fig8b-late-moments-reactivated
- id: fig8-no-pre-reactivation
  statement: Track activity patterns show no evidence of being present in ripples recorded before the experience.
  source: Results, No preferential reactivation of moments following transition, paragraph 1; Figure 8A
  quote: nor any evidence that the pattern of activity observed on the track was present in ripples recorded
    prior to the experience
  criterion: The paper gives no test; Figure 8A compares the pre-ripple percentages with the false positive
    rate of 0.1% (Methods, Reactivation analysis). As a standard choice, per session the mean over moments
    of the percentage of pre ripples that reactivate each moment; reproduced when its mean over sessions is
    not above 0.1% by a one-sided one-sample t-test at p < 0.05, in novel and familiar runs. Values reported
    either way.
  depends_on:
  - fig8b-late-moments-reactivated
- id: ne-and-settling-time-course
  statement: The time course of hippocampal representational stabilization qualitatively matches that of
    NE decay, in novel and familiar environments.
  source: Results, CA1 spatial code takes minutes to settle after context transition, paragraph 2 (last
    sentence); Discussion, The LC contribution to long-term changes in neural coding
  quote: The time course of representational stabilization qualitatively matched that of NE decay in both
    novel and familiar environments suggesting a potential link between NE release and atypical spiking behavior
  criterion: Not testable on DANDI:000552 alone, as the NE half is in the undeposited photometry recordings,
    and the paper compares the two only by eye. The settling half is tested by fig7e-novel-settling, fig7f-familiar-settling
    and fig7g-familiar-more-similar-early.
  depends_on:
  - fig7g-familiar-more-similar-early
