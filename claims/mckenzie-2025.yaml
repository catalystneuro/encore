# Claims for McKenzie, Sommer, Donaldson, Pimentel, Kakani, Choi, Newman & English (2025), eLife
# 14:RP105183, "Event boundaries drive norepinephrine release and distinctive neural
# representations of space in the rodent hippocampus", tested on DANDI:000552.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-26,
# protocol pilot-19 as stated in docs/protocol.md (Reader, steps 1 to 4).
#
# Text read. paper/10.7554-elife.105183.txt, the eLife page of Reviewed Preprint version 1
# (January 31, 2025, marked "Not revised"; the file header calls it the version of record).
# It holds the Abstract, Introduction, Results with the legends of Figures 1 to 8, Discussion,
# Methods, and the legends of Supplemental Figures S1 to S7. There is no separate supplement
# beyond those figures, and no PDF was supplied; no figure was opened.
#
# Code read. None. The paper links no analysis code and has no code or data availability
# statement. The photometry models were fit in MATLAB R2021b with fmincon (Methods).
#
# Data the paper used, as it reports them.
# Fiber photometry (Figures 1 to 6, S1 to S5). C57BL/6J mice (N = 8, 3 female), GRAB-NE
# (AAV9-hSyn-NE2h) in left dorsal CA1 with a fiber over it; 465 nm and 405 nm excitation,
# sampled at 1017.3 Hz; SignalNE in baseline standard deviations, smoothed with a 1 s Gaussian.
# Paradigms: novel arenas over 10 days (HC-A-HC, with B and C on days 1 and 10), five novel
# objects for 5 min each (6 mice in the tests), a water-rewarded 1.2 m linear track (110
# sessions), the track with a novel object (5 or 6 mice), desipramine and yohimbine injections.
# Behavior from DeepLabCut ear positions. These recordings are not in DANDI:000552 and the paper
# deposits them nowhere. Their claims are kept; they cannot be tested on this dandiset.
# Electrophysiology (Figures 7, 8, S6, S7). Reanalysis of the Huszar et al. (2022) data,
# DANDI:000552 version 0.230630.2304 (Methods, Electrophysiology subjects), which the archive
# titles "Preconfigured dynamics in the hippocampus are guided by embryonic birthdate and rate of
# neurogenesis". Three mice (e13_26m1, e15_13f1, e16_3m2), silicon probes in right dorsal CA1,
# 30 kHz. Each analyzed session (N = 8) is about 120 min home cage, running on the familiar
# figure-eight maze, about 60 min home cage, running in a novel environment, about 120 min home
# cage; one novel transition per session. Novel environments are listed as 3 linear tracks, 3
# figure-eight mazes and 1 arena, which sums to 7, not 8 (see E1). Variables used: pyramidal unit
# spike times, LED head position, broadband LFP for ripples, and the epoch times of the home cage
# and maze periods.
#
# Method for the claims on DANDI:000552, from the Methods (Spiking analysis, ACG slope analysis,
# Reset analysis, Place field detection, Ripple detection, Reactivation analysis) and the figure
# legends. Cited in the criteria as E1 to E10.
# E1 Sessions. The 8 sessions of the three mice named above with a familiar figure-eight run
#    followed by a novel environment (Methods, Behavioral testing). The listed environment types
#    sum to 7; the df of 7 in every test implies 8 sessions. Open: the author takes the sessions
#    of those mice that fit the description, reports how many there are and of which type, and
#    runs the tests on all of them. Where a session has two novel environments, which one was
#    chosen is open: (a) the first, (b) the second; both are run.
# E2 Transition. The time the mouse is placed in the maze, read as the start of the maze epoch.
#    Transfer and settling are measured from it.
# E3 Units. Pyramidal cells only, separated "based on waveform shape and bursting statistics"
#    (Methods, Spiking analysis), as in Huszar et al. (2022). No thresholds are given. The
#    dataset's own putative cell type labels are used; if it has none, the separation is open
#    and is recorded as a deviation.
# E4 Population vectors. Spike counts of each unit in 100 ms bins, each unit z-scored over the
#    first 1000 s after transfer (Methods, ACG slope analysis). The similarity matrix is the
#    Pearson correlation of every pair of vectors in the maze epoch.
# E5 Nearest neighbors. For each 100 ms bin, the 3 most correlated vectors among bins recorded in
#    the same location (minimum occupancy 1 s), averaged, then smoothed with a 1 s Gaussian
#    kernel (Methods, Reset analysis). Location bins are 1 x 1 cm, the only bin size the Methods
#    give (Place field detection), read as applying here. The Methods compare each moment with
#    "any other moment", so only the bin itself is excluded; a variant that also excludes the
#    contiguous run of bins in the same location is shown, not judged. Whether a speed filter
#    applies is open: (a) all bins, (b) only bins above 5 cm/s, the threshold of Place field
#    detection; both are run.
# E6 Windows. "First minute" is 0 to 60 s after transfer. "10 minutes into the session" is read
#    as 600 to 660 s, as Figure 8B states ("10-11 minutes"); Figure S6 says "Minute 10", which
#    can also be read as 540 to 600 s, run as a second reading for Figure S6 and Figure 7E, 7F
#    and S7G, S7H.
# E7 Statistics. Each test reports t(7) over 8 sessions; with one value per session and
#    condition this is a paired (one-sample on differences) Student t-test, two-sided, p < 0.05.
#    The paper does not name sidedness; two-sided is a standard choice.
# E8 Speed and acceleration. The Methods give the Kalman filter only for the photometry mice;
#    for the electrophysiology they do not say. Readings: (a) a second-order Kalman filter on
#    the LED position, as in the photometry Methods; (b) finite differences of position
#    smoothed with a 1 s Gaussian.
# E9 Ripples. Broadband LFP bandpassed at 130 to 200 Hz (fourth-order Chebyshev), normalized
#    squared signal, peaks above 5 SD, edges at 2 SD, duration 20 to 200 ms (Methods, Ripple
#    detection). The channel is not named; a channel in the CA1 pyramidal layer is used. If the
#    dataset holds the ripple events of Huszar et al. (2022), they are used as a variant.
# E10 Reactivation. For each ripple, each unit's spike count over the ripple divided by its
#    duration; Pearson correlation with each 100 ms track vector; null by moving each unit's
#    value on a ripple to a random other ripple, 1000 times; a ripple reactivates a moment when
#    its R exceeds 99.9% of shuffles (Methods, Reactivation analysis). Pre and post windows are
#    open: the Methods say ripples "within 30 minutes of the beginning of the session and within
#    30 minutes after the session". Readings: (a) the 30 min of home cage before the novel run
#    and the 30 min after it; (b) the first 30 min of the recording day and the 30 min after the
#    novel run. Whether the track vectors are z-scored (E4) or raw counts is open; both are run.
#    The shuffle is done within each of the pre and post sets of ripples, a standard choice.
#
# Tolerances. 10% of the reported value, or a reported range widened by 10% of each bound.
