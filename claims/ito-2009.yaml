# Claims for Ito & Doya (2009), J Neurosci 29(31):9861-9874, on dandiset 001641.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record, open access, as served by PMC (PMC6666589), stored in
# paper/10.1523-jneurosci.6157-08.2009.txt: abstract, Introduction, Materials and Methods,
# Results, Discussion, figure legends and Tables 1 to 3. Supplement read: the supplemental
# Methods (Supplemental_Material.pdf, 4 pages, the particle filter), extracted in the same
# file; its equations are garbled in the extraction and were read only for what the words say.
# Not available: supplemental Data 1 (left-choice probability against QL - QR), Data 2 (rasters
# of the Fig. 7 neurons and tone responses) and Data 3 (NAc core against shell). The main
# findings do not rest on them; the claims that cite them (suppdata1-choice-vs-q-difference,
# core-shell-no-difference) say so. No PDF of the main text was available, so the figure panels
# could not be read. The display equations of the Methods (conditional probability, Markov
# prediction, Q update, choice rule, likelihood, normalized likelihood, parameter drift,
# regression models, class borders and mutual information) are images on PMC and are missing
# from the text; only the words around them were read. The paper links no code, so no code was
# read.
#
# Data the paper used, as it reports them. Six male Long-Evans rats; 70 recording sessions;
# 60,221 trials: 39,175 choice trials (tone A, 4700 Hz), 12,707 no-choice trials (tone B,
# 2000 Hz) and 8329 error trials. A trial starts with a start tone (2300 Hz, 1 s); a center-hole
# poke of 500-1000 ms brings tone A (75%) or tone B (25%), 1000-2000 ms, which must be held
# through. After tone A the rat pokes the left or right hole within 1 min and hears a reward
# tone (500 Hz, 1 s, then a sucrose pellet) or a no-reward tone (500 Hz, 250 ms). After tone B
# it must not poke L or R; a reward tone and pellet follow 1 s after center-hole exit. Error
# trials end with an error tone (9500 Hz). Reward probabilities (left, right) per block are one
# of (90, 50), (50, 90), (50, 10), (10, 50) %, all four in every four blocks, never the same
# twice running; a block lasts at least 20 choice trials and ends when the more advantageous
# side was chosen in 80% of the last 20 choice trials. Units: spike-sorted single units from
# bundles of eight microwires, two bundles in the right NAc and one or two in the right VP,
# advanced 125 um per session; 148 NAc and 66 VP neurons. Measured variables used: event times
# (center-hole entry and exit, cue onset and type, L/R entry, reward or no-reward tone, pellet
# pick-up), choices, outcomes, block reward probabilities, spike times, recording region (NAc
# core or shell, VP).
#
# Methods fixed by the paper and used throughout (Materials and Methods unless named):
#  - Behavioural sequences: no-choice and error trials removed; the remaining choice trials
#    form the sequence; e(t) is one of L1, L0, R1, R0. Conditional left-choice probability is
#    NL / (NL + NR) after a given experience sequence, with a 99% interval from
#    betainv([0.005 0.995], NL, NR) (Model-free behavioral analysis).
#  - Fig. 2C to 2E plot, for a four-trial sequence, the left-choice probability after each of
#    its prefixes in time order (P(L|R0), P(L|R0 L1), ... ; Fig. 2B and 2C legends and Results,
#    History dependence, paragraph 2).
#  - Markov model of order d: P(a | last d experiences) = (Na + 1) / (NL + NR + 2), counts from
#    the training data.
#  - Q models: Qi(1) = 0 for fixed parameters; F-Q has alpha1 = alpha2, standard Q has
#    alpha2 = kappa2 = 0; the local matching law is alpha1 = alpha2, kappa1 = 1, kappa2 = 0 with
#    P(L) = QL / (QL + QR). Time-varying models: alpha1, alpha2, kappa1, kappa2 drift by
#    Gaussian noise of SD sigma_alpha and sigma_kappa per trial; particle filter with 5000
#    particles (supplemental Methods), initial QL, QR, alpha1, alpha2 uniform on [0, 1] and
#    kappa1, kappa2 uniform on [0, 4]; the prediction is the mean of P(L) over the predictive
#    distribution. Free parameters fitted by maximum likelihood on 35 training sessions, scored
#    by the normalized likelihood of 35 test sessions.
#  - Neural time bins (Fig. 8A legend): phase 1, 1 s before center-hole entry; phase 2, 1 s
#    after cue onset; phase 3, 1 s before center-hole exit; phase 4, 1 s after center-hole
#    exit; phase 5, 1 s after reward or no-reward tone onset. Spike counts in these bins.
#  - Coding neurons by PETH comparison: two-sided Mann-Whitney U test at p < 0.01 of per-trial
#    spike counts. State, phase 2, choice against no-choice trials. Action command, phase 3,
#    and action, phase 4, left against right choice trials. Reward, phase 5, rewarded against
#    unrewarded choice trials. Action value (phases 1 to 3, last 20 choice trials of each
#    block) QL-coding when (90, 50) differs from (10, 50) and (50, 90) does not differ from
#    (50, 10); QR-coding the converse.
#  - Regression (Fig. 8C, 8D): spike count in phases 1 to 3 of the last 20 choice trials of each
#    block, on the block's reward probabilities QL and QR, or on QL + QR and QL - QR; a
#    coefficient is significant at p < 0.01 (t test); a neuron codes one regressor when that one
#    is significant and the other is not.
#  - Mutual information (Fig. 9): spike count in a 500 ms window, step 100 ms, aligned to cue
#    onset or center-hole exit; four firing classes whose borders are chosen per neuron by
#    exhaustive search to minimize the variance of the class counts; binary event; plug-in
#    estimate minus the first-order bias term (Panzeri and Treves, 1996) built from M and the
#    numbers of nonzero cells UFX, UF, UX; divided by the window length for per-second values;
#    averaged over all neurons of a region. Action and reward use choice trials, state uses
#    choice and no-choice trials, QL and QR are the F-Q (time-varying) estimates binarized at
#    the median. Threshold (p < 0.01) is the second largest of 100 region averages with random
#    binary events.
#
# Details the paper leaves open and that bear on several claims (each criterion names those
# it needs):
#  - O1, Q update. The equation is missing. Its words (alpha1 learning rate of the chosen
#    action, alpha2 forgetting rate of the unchosen one, kappa1 strength of reinforcement by
#    reward, kappa2 strength of aversion from no reward; equivalence with Barraclough et al.
#    (2004) when alpha1 = alpha2) allow (a) chosen Q <- (1 - alpha1) Q + alpha1 kappa1 after
#    reward, (1 - alpha1) Q - alpha1 kappa2 after no reward, unchosen Q <- (1 - alpha2) Q;
#    (b) as (a) with kappa1 and -kappa2 added without the factor alpha1. Choice rule P(L) =
#    1 / (1 + exp(-(QL - QR))), as the supplemental Methods, equation (1), writes it for the
#    first two components of h. The readings give the same fits under a reparameterization
#    with fixed parameters but different parameter values, and different fits when parameters
#    drift.
#  - O2, normalized likelihood. The equation is missing; read as the geometric mean of the
#    per-trial likelihood of the observed choice over all trials of the sessions scored (0.5 at
#    chance, 1 for exact deterministic prediction, as the Methods state). Per session for the
#    paired Wilcoxon tests.
#  - O3, training and test split. Not given. Readings are (a) alternate sessions in recording
#    order over all rats; (b) alternate sessions in recording order within each rat; (c) a
#    seeded random half. The reading whose choice-trial counts give 19,986 training and
#    19,186 test trials, if any, is reported; the outcomes are judged under every reading.
#  - O4, parameter search. Not given. Table 2 values lie on steps of 0.05 (alpha, kappa) and
#    0.005 or 0.01 (sigma), so readings are (a) a grid on those steps; (b) a continuous
#    optimizer started from the grid optimum.
#  - O5, drift bounds. Whether alpha is kept in [0, 1] (and kappa in any range) during the
#    random walk is not given. Readings are (a) no bounds; (b) alpha clipped to [0, 1].
#  - O6, Markov predictions for the first d trials of a session, whose history is incomplete.
#    Readings are (a) predicted with P(L) = 0.5; (b) left out of the score of every model.
#  - O7, histories. The Methods count conditional probabilities "during a block of choice
#    trials". Readings are (a) histories lying within one block; (b) histories within one
#    session, across block borders.
#  - O8, Mann-Whitney tests of conditional probabilities (Fig. 2B, 2C). What is ranked is not
#    given. Readings are (a) the 0/1 left-choice indicators of the trials that follow each of
#    the two histories, pooled over sessions; (b) per-session conditional probabilities.
#    Two-sided.
#  - O9, Mann-Whitney tests of percentages of coding neurons between regions (and between core
#    and shell). Read as a two-sided Mann-Whitney U test on per-neuron 0/1 coding indicators,
#    normal approximation with tie correction. This is the only reading the words give, and it
#    gives the paper's p-values from the paper's counts (two-sided: 12 of 148 against 12 of 66,
#    p = 0.03; 11 of 148 against 14 of 66, p = 0.004; 80 of 148 against 33 of 66, p = 0.58).
#  - O10, binomial test against chance (Fig. 8). The chance level is not given. Readings are
#    (a) 0.01, the test level; (b) 0.01 x 0.99, a significant result in one comparison and none
#    in the other, for action-value, state-value and policy neurons. One-sided.
#  - O11, Wilcoxon signed-rank test of preferences against 50%. What is tested is not given.
#    Readings are (a) the signed-rank test, across the coding neurons of a type, of each
#    neuron's difference of mean spike counts between the two conditions in the coding bin;
#    (b) the same test on the signs alone (+1 or -1), which is a sign test. Two-sided.
#  - O12, MI window placement. Windows are "set based on" the alignment time. Readings are
#    (a) a window centred on each time point; (b) a window ending at it; (c) a window starting
#    at it. Random events for the threshold are drawn (a) with probability 0.5; (b) with the
#    frequency of the real event in the session.
#  - O13, QL and QR for MI and Table 3. Readings are (a) the predictive mean at trial t, given
#    e(1:t-1); (b) the posterior mean after e(t). Medians for binarization are taken (a) per
#    session; (b) over all sessions.
#  - O14, error trials in the state-coding test. Readings are (a) successful choice and
#    no-choice trials only; (b) all trials in which tone A or tone B was presented, counting
#    the 1 s after cue onset.
#  - O15, firing rate "during the task". Readings are (a) spikes over the whole recording of
#    the session; (b) spikes from the first trial start to the last trial end.
#
# Readings and outcomes. Where a criterion lists readings of what a reported number counts
# (trial-counts, block-structure, tone-discrimination-errors, fig2c-sequence-frequencies), the
# claim holds when it matches under any of them. Where the readings are of a method (any O
# above, a window), the notebook runs each, the outcome is the one they all give, and when
# they disagree the claim is blocked as methods_underspecified. Claims of absence are judged on
# the paper's test as written.
#
# Tolerances. The default is 10% of the reported value, or the reported SD for a mean. For the
# normalized likelihoods (Fig. 5) the tolerance is 0.005: the values lie between 0.508 and
# 0.5375, close to chance (0.5), and 10% of the value (about 0.05) would accept any model at
# chance; 0.005 is about a sixth of the reported span. Their order is judged by the criteria.
#
# Paper inconsistencies noted: the Results say the constant-parameter Q models are "poorer than
# that of the first- or second-order Markov models", but F-Q and DF-Q (constant), 0.531, exceed
# the first-order Markov model, 0.528; the Results cite "previous reward shown in Fig. 8C,D"
# for Fig. 9; training and test choice trials (19,986 + 19,186 = 39,172) are three fewer than
# the 39,175 choice trials; "44/2 = 128" is 4^4/2 garbled.
#
# All claims use the dataset's own recordings and behaviour (data: dataset, the default). The
# paper relies on no outside data.
