- id: fig4-strategy-tracking
  statement: With time-varying parameters, F-Q and DF-Q capture win-stay-lose-switch behaviour by
    raising kappa2 close to kappa1, and persevering behaviour by a negative kappa2, which the
    standard Q model cannot.
  source: Results, Prediction of choices by models, paragraphs beginning "Figure 4A–F" and
    "Figure 4, B, D, and F"; Figure 4
  quote: This behavior was captured by the F-Q- and DF-Q-learning models, with both models showing
    an increase in the nonreward aversion parameter κ2 close to the reward reinforcement
    parameter κ1 ... The F-Q and DF-Q models captured this behavior by exhibiting a negative
    value for the aversion parameter κ2 (Fig. 4H)
  depends_on:
  - fig5-variable-models-best
  criterion: The paper shows representative sessions and does not identify them, so the claim is
    tested as existence of such episodes. Win-stay-lose-switch episode, a run of at least 10
    choice trials in which the rat repeated every rewarded choice and switched after every
    unrewarded one, as Results describe it. Persevering episode, a run of consecutive choices
    of the less advantageous side, rewarded or not, in a (10, 50) or (50, 10) block, as the
    Results describe Fig. 4B, D, F ("continued to choose the less advantageous left action").
    The paper gives no run length; 5, 10 and 15 trials are readings for both kinds of episode,
    and the outcome is the one they all give. Reproduced when, under every reading of O1, O5
    and O13, some
    win-stay-lose-switch episode has F-Q (variable) kappa2 within 25% of kappa1 at its end, some
    persevering episode has F-Q (variable) kappa2 below 0, and over all such episodes the F-Q
    (variable) mean per-trial likelihood exceeds that of standard Q (variable). The 25% reads
    "close to"; the paper gives no bound.
