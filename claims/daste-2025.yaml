    p: 0.398
  criterion: A claim of absence for OB-p against mPFC-p, on the paper's test. Linear SVM, 8
    odors, mean normalized fluorescence per cell in the window, 5-fold cross-validation, 75-
    cell pseudo-populations, 200 train/test repeats (Figure 2H legend, right). The window is
    0 to 5 s in the legend and 1 to 5 s in the Methods; both are run, (a) 0 to 5 s and (b) 1 to
    5 s. Reproduced when the two-sided Mann-Whitney U test of the 200 OB-p against the 200
    mPFC-p accuracies has p >= 0.05; not reproduced when p < 0.05. The mean accuracies are
    reported against chance (12.5%) and against untagged. If the two windows disagree the
    claim is methods_underspecified.
- id: fig2i-identity-decoding-early
  statement: In an early window (0 to 2 s) OB-p pseudo-populations decode odor identity better
    than mPFC-p pseudo-populations.
  source: Results, OB-p and mPFC-p neurons exhibit broadly similar odor response properties,
    but differ in dynamics, paragraph 5; Figure 2I
  quote: we found that OB-p pseudo-populations outperformed mPFC-p pseudo-populations ( Figure
    2I , two-sided Mann-Whitney U test with p = 2.15 × 10⁻ 30 )
  statistics:
  - test: two-sided Mann-Whitney U test
    p: 2.15e-30
    n: 200 train/test repeats per group, 75 cells
  criterion: As fig2h-identity-decoding-5s with a 0 to 2 s window. Reproduced when OB-p
    accuracy exceeds mPFC-p with two-sided Mann-Whitney U p < 0.05 over the 200 repeats.
- id: fig2j-identity-decoding-peaks-earlier
  statement: With a sliding window, odor identity decoding accuracy peaks earlier for OB-p
    than for mPFC-p pseudo-populations.
  source: Results, OB-p and mPFC-p neurons exhibit broadly similar odor response properties,
    but differ in dynamics, paragraph 5; Figure 2J
  quote: SVM classification using a sliding window for odor responses revealed that decoding
    accuracy for OB-p neurons peaked earlier than for mPFC-p neurons
  criterion: Linear SVM on mean normalized fluorescence in consecutive windows across the
    trial, trained and tested on the same window, 75-cell pseudo-populations, 100 repeats. The
    window is 250 ms in the Figure 2J legend and 500 ms in the Methods; at 4.53 Hz a 250 ms
    window holds one or two frames. Both are run, (a) 250 ms and (b) 500 ms. No test is
    given. Reproduced when the time of the peak of the mean accuracy curve is earlier for OB-p
    than for mPFC-p under both readings; the times and the 95% intervals of the peak time over
    repeats are reported.
- id: fig2k-mpfc-late-identity
  statement: Late in the trial, mPFC-p pseudo-populations keep low but above-chance identity
    decoding that exceeds OB-p decoding.
  source: Results, OB-p and mPFC-p neurons exhibit broadly similar odor response properties,
    but differ in dynamics, paragraph 5; Figure 2K
  quote: mPFC-p pseudo-populations maintained low but above-chance identity decoding that
    exceeded OB-p decoding later in the trial
  criterion: From the same-window accuracies of fig2j-identity-decoding-peaks-earlier (the
    diagonal of Figure 2K). "Later in the trial" is not bounded; it is read as after odor
    offset, (a) 2 to 15 s and (b) 5 to 15 s after onset. Reproduced when, under both readings,
    the mPFC-p mean accuracy over the window exceeds 12.5% and exceeds the OB-p mean, with
    repeats as samples (one-sample one-sided t-test against 12.5% and two-sided Mann-Whitney U,
    p < 0.05, the tests the paper uses for decoding elsewhere).
- id: fig3bc-concentration-tuning
  statement: Similar fractions of OB-p and mPFC-p neurons are tuned to odor identity, but OB-p
    neurons more often show significant effects of concentration and identity by
    concentration interactions, which are rare in mPFC-p neurons.
  source: Results, Odor concentration is robustly encoded in OB-p but not mPFC-p neurons,
    paragraph 2; Figure 3B and 3C
  quote: Across time, similar fractions of OB-p and mPFC-p neurons were significantly tuned to
    odor identity ( Figure 3B ) ... By contrast, OB-p neurons were more likely to show
    significant main effects of concentration, as well as identity × concentration interactions
  criterion: Concentration dataset. Per neuron, a two-way ANOVA (identity, 3 odors, by
    concentration, 3 levels, with interaction) on mean normalized fluorescence in the first 5 s
    of odor presentation over trials (Figure 3B legend), p < 0.05 per term; the fraction of
    neurons significant per term per group. The time-resolved version (Figure 3C) uses
    sliding windows of unstated width, read as (a) 500 ms and (b) 1 s steps of the same width.
    The paper gives no test of the fractions. Reproduced when, in the 0 to 5 s analysis, the
    OB-p fractions for concentration and for interaction both exceed the mPFC-p fractions, and
    the OB-p minus mPFC-p difference for identity is smaller in absolute size than that for
    concentration; the time courses are reported.
- id: fig3de-concentration-decoding
  statement: OB-p pseudo-populations decode odor concentration more accurately and earlier
    than mPFC-p and untagged pseudo-populations, while mPFC-p decoding stays close to chance.
  source: Results, Odor concentration is robustly encoded in OB-p but not mPFC-p neurons,
    paragraph 3; Figure 3D and 3E
  quote: OB-p pseudo-populations reached higher concentration classification accuracy and did
    so earlier in the trial than both mPFC-p and untagged pseudo-populations, whereas mPFC-p
    ensembles supported only weak concentration decoding that remained close to chance
  criterion: Per odor, a linear SVM decoding the 3 concentrations from mean normalized
    fluorescence in sliding windows (250 ms in the Figure 3D legend, 500 ms in Figure 3E and
    the Methods; both run), 75-cell pseudo-populations, 100 repeats, accuracies averaged over
    the 3 odors; chance 33.3%. No test is given. Reproduced when the peak mean accuracy of OB-p
    exceeds those of mPFC-p and untagged, the OB-p peak time is earlier than both, and the
    mPFC-p peak mean accuracy is below the midpoint between chance and the OB-p peak, under
    both window readings. The midpoint is a reading of "close to chance", recorded as such;
    the paper gives no bound.
- id: figs5g-pairwise-concentration
  statement: Pairwise concentration decoding (low against medium, medium against high, low
    against high) is strongest and most sustained in OB-p ensembles, intermediate in untagged
    neurons and weakest in mPFC-p neurons.
  source: Results, Odor concentration is robustly encoded in OB-p but not mPFC-p neurons,
    paragraph 3; Figure S5G
  quote: concentration decoding was again strongest and most sustained in OB-p ensembles,
    intermediate in untagged neurons, and weakest in mPFC-p neurons
  criterion: As fig3de-concentration-decoding, with binary SVMs for each pair of
    concentrations per odor (chance 50%), averaged over odors, same-window accuracies. Read
    as the mean same-window accuracy over 0 to 15 s after onset per group. Reproduced when the
    order OB-p > untagged > mPFC-p holds for all three pairs under both window readings.
- id: figs5-sparseness-concentration
  statement: Across the three concentrations, response sparseness and the fraction of active
    cells change only modestly in all three populations.
  source: Results, Odor concentration is robustly encoded in OB-p but not mPFC-p neurons,
    paragraph 2; Figure S5A to S5D
  quote: overall response sparseness and the fraction of active cells changed only modestly in
    all three populations ( Figure S5 )
  criterion: Per concentration (0.1%, 1%, 10% in the Figure S5 legend), the percentage of
    active cells (binarized, 0 to 5 s) and lifetime sparseness per neuron over the 3 odors,
    population sparseness per subject (Figure S5D). The paper gives no test and no bound for
    "modestly"; the values per population and concentration are reported and the claim is
    judged only on whether no population shows a monotonic change of more than half its value
    at 0.1% across the range, a reading of "only modestly" recorded as such.
