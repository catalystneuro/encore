# Claims for Daste, Pierré et al., "Projection-specific Routing of Odor Information in the
# Olfactory Cortex" (bioRxiv preprint doi:10.64898/2025.12.12.694045) on dandiset 000785.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read. The bioRxiv preprint, version 1, flattened from its JATS XML (paper/
# 10.64898-2025.12.12.694045.txt). It holds the main text, the Methods and the legends of the
# supplementary figures S1 to S13. No PDF was supplied. The contents of Tables 2 to 8 are
# missing from the text (only their titles remain): the odorants and concentrations of each
# dataset (Tables 2, 3, 4), the transformer hyperparameters (Table 5), the animal pairs held
# out for across-animal evaluation (Table 6) and the MLP search space and final
# hyperparameters (Tables 7, 8). The equations for normalized fluorescence, lifetime
# sparseness, population sparseness and mutual information are also lost in the flattening
# (the text keeps the words around them).
#
# Code read. The paper links https://gitlab.com/fleischmann-lab/calcium-imaging/projection-difference
# (commit f478b34c79606c3109f259d24add0256fb0b3b67, 2025-06-25). It holds the loading and
# preprocessing of the dandiset's NWB files (src/nwb_processor.py, notebooks process-passive-
# dataset, process-GNG-dataset, construct-metadata-database) and a demo notebook that decodes
# projection target with an SVM. The figure analyses are not in it; the paper says the
# analysis code "will be made available ... upon publication". Choices the code settles, and
# that are used below, are (1) normalized fluorescence is the code's "percdFF", F median-
# filtered over 1 s, F0 the running 10th percentile of that over 30 s, and (F - F0) divided by
# the standard deviation of (F - F0) over the session, per cell, no neuropil correction
# (k_neu 0), suite2p iscell cells only; (2) bad trials are those flagged in the NWB trials
# column is_bad_trial, and are removed with control trials (mineral oil, air) before
# pseudo-populations are built; (3) for tracked Go/NoGo neurons a cell is OB-p or mPFC-p when
# it is tracked across all four sessions (day 0 passive and task days 1 to 3) and red in at
# least 3 of them (code criterion min_3_sessions, matching the Methods' "at least 3 out of 4
# days"); (4) the linear SVM is sklearn.svm.SVC(kernel='linear') with default parameters, as
# in the demo notebook (the Methods say "a linear SVM with all default parameters as given by
# sklearn"; sklearn.svm.LinearSVC is shown as a variant). In the GNG_2023b dataset the code
# ignores task day 4, to match the 3 task days of GNG_2021.
#
# Data the paper used. Ai14 mice with jGCaMP7f in anterior piriform cortex (aPCx) and
# retrograde AAV-Cre in the olfactory bulb (OB-p mice) or infralimbic/prelimbic mPFC (mPFC-p
# mice), two-photon imaging through a GRIN lens. tdTomato-positive cells are OB-p or mPFC-p
# by the mouse's injection; GCaMP-only cells are untagged. Four experiments, which the code
# names identity_dataset, concentration_dataset, fast_hz_sniff_trig_dataset and the Go/NoGo
# datasets GNG_2021_dataset and GNG_2023b_dataset.
#   - Identity (passive): 10 mice, 8 monomolecular odorants at one concentration plus 2
#     controls, 8 to 10 presentations each, 22 s trials (5 s baseline, 2 s odor, 15 s after),
#     3 planes at 4.53 Hz per plane; 81 OB-p, 84 mPFC-p and 1978 untagged neurons.
#   - Concentration (passive): 10 mice, 3 odorants (acetophenone, butyl acetate, ethyl
#     hexanoate) at 3 concentrations plus a control; 87 OB-p, 102 mPFC-p, 2232 untagged.
#   - Fast (passive, 30 Hz, one plane, odor aligned to the first sniff): 5 mice, 24 OB-p, 27
#     mPFC-p, 424 untagged. The code's README marks this dataset "may need revisiting, don't
#     use for now".
#   - Go/NoGo: 7 mice (4 OB-p, 3 mPFC-p), a passive day 0 then task days 1 to 3, 4 odors (CS+1,
#     CS+2 rewarded, CS-1, CS-2 not), trials of 5 s baseline, 2 s odor, 3 s delay, then the
#     reward window; licks, reward times and trial outcomes (hit, miss, false alarm, correct
#     rejection). Per session 95 +/- 2 OB-p, 87 +/- 8 mPFC-p and 1690 +/- 35 untagged neurons.
#     Tracked across days with ROICaT and manual refinement (the NWB field
#     subject_global_roi_muse, renamed muse_cell_id in the code); 46 OB-p and 41 mPFC-p
#     tracked projection neurons.
# The Methods count 18 mice (9 OB-p, 8 mPFC-p, which sum to 17) and 16 in passive sessions,
# while Figure S2B has N = 9 OB-p and 10 mPFC-p mice; the counts are not consistent.
#
# Methods shared by many claims, from the Methods unless said otherwise.
#   - Active (binarized) response on a trial. Null distribution of 1000 values sampled from
#     the normalized trace in the 4 s before odor onset, across all trials. A forward sliding
#     one-sided Mann-Whitney U test (window 0.7 s) of the response window against it; active if
#     p < 0.01 for at least 8 consecutive forward frames and (for windows starting at odor
#     onset) not backward-active (p < 0.01 for any of 4 consecutive backward frames). Response
#     window 0 to 5 s after odor onset for the passive datasets, each task phase for Go/NoGo.
#     Open details, which could change the outcome. Whether the 0.7 s window is anchored at
#     its start or centred on each frame, and whether the backward test slides into the
#     baseline from odor onset; the readings are (a) windows starting at each frame and
#     extending 0.7 s forward (backward windows ending at each of the 4 frames before onset)
#     and (b) windows centred on each frame. The 1000-point sample is random (a seed; a
#     standard choice).
#   - Lifetime sparseness, population sparseness and mutual information. The formulas are
#     lost from the text. Readings: lifetime sparseness as in Vinje and Gallant (2000),
#     S = (1 - (sum r / k)^2 / (sum r^2 / k)) / (1 - 1/k) over the k stimuli of a cell's trial-
#     averaged binarized activity r; population sparseness the same over the N cells of a
#     group for one stimulus or one trial; mutual information I(X; S) = H(X) - H(X | S)
#     between a cell's binary activity and the stimulus, in bits, from empirical frequencies.
#   - Pseudo-populations. Cells pooled across mice within a group; trials matched across mice
#     by stimulus and by the order of presentation of that stimulus. Trials per stimulus are
#     truncated to the smallest count across mice (implied by the matching; the 64 trials of
#     Figure 2D are 8 odors by 8 trials). Size-matched subsamples drawn without replacement
#     (75 cells for the passive data, 85 for Go/NoGo) and repeated (100 or 200 times). The
#     response of a cell in a window is "either the average or maximum" of normalized
#     fluorescence; the Methods name the mean for the identity and concentration decoders,
#     and give no aggregate for Go/NoGo, so Go/NoGo decoding is run with the mean (a) and the
#     maximum (b). Folds are 5-fold cross-validation for the passive datasets; no fold scheme
#     is given for Go/NoGo, read as 5-fold stratified cross-validation as for the passive data,
#     with train and test never on the same trial (Methods, Decoding analysis).
#   - Go/NoGo task phases, relative to odor onset. Odor 0 to 2 s, delay 2 to 5 s, act-early 5
#     to 10 s, act-late 10 to 15 s. Go trials count as hits only if the reward came within 10 s
#     after the delay. Decoding is done per task day; expert means day 3.
#   - Statistics. Bonferroni correction for most analyses, Benjamini-Hochberg for single-cell
#     properties of tracked neurons; the significance level is 0.05.
