    significantly different between the two types of sessions."
  statistics:
  - about: spatial correlation, NO-O against CON1-CON2
    test: Wilcoxon rank-sum test
    p: 5.13e-8
  - about: rate overlap, NO-O against CON1-CON2
    test: Wilcoxon rank-sum test
    statistic: z = 1.43
    p: 0.154
  - about: spatial correlation, O-OM against CON2-CON3
    test: Wilcoxon rank-sum test
    p: 2.87e-8
  - about: rate overlap, O-OM against CON2-CON3
    test: Wilcoxon rank-sum test
    p: 0.727
  - about: spatial correlation, OM-NO' against CON3-CON4
    test: Wilcoxon rank-sum test
    p: 6.64e-7
  - about: rate overlap, OM-NO' against CON3-CON4
    test: Wilcoxon rank-sum test
    p: 0.159
  - about: spatial correlation, NO-NO' against CON1-CON4
    test: Wilcoxon rank-sum test
    p: 1.52e-6
  - about: rate overlap, NO-NO' against CON1-CON4
    test: Wilcoxon rank-sum test
    p: 0.325
  criterion: 313 CA3 cells against the 59 CA3 control cells, measures as for CA1. Reproduced when all
    four spatial-correlation tests give p < 0.05 and all four rate-overlap tests give p >= 0.05 (the
    absence part judged on the paper's test); partially reproduced when the spatial part holds and one
    or more rate-overlap tests is significant.
- id: figs4-object-traces
  statement: 18.3% of CA1 cells (218 of 1,189) had object-trace fields, firing in NO' where they had
    fired in OM, well above the 1% chance level.
  source: Supplementary Figure 4B to 4D legend; Methods, Region-of-interest analysis for object traces
  quote: "We found that 18.3% of CA1 cells had trace responses ... (n = 218/1189 cells in total,
    significantly above chance level of 1%"
  statistics:
  - test: binomial test
    p: 5.73e-141
    p_relation: "<"
    n: 1,189 CA1 cells
  expected:
  - quantity: fraction of CA1 cells with trace fields
    value: 0.183
    tolerance: 0.0183
  - quantity: cells changing between NO and NO'
    value: 919
    tolerance: 91.9
    unit: cells
  criterion: The Methods' procedure. Cells changing between NO and NO' as in
    fig2-fraction-changed-no-o; fields in NO' (opening comment); a circular ROI per field moved to the
    same place in OM; rate overlap between the NO' ROI and the OM ROI against 1,000 shuffles placing
    the ROI at random in OM with wrap-around; a trace field above the 99th percentile. The ROI's size
    is open, as the Methods refer to a section that is not in the paper. Readings (a) a circle of the
    field's area centred on its centroid; (b) the smallest circle centred on the centroid containing
    the field. Reproduced when, under one reading, both values are within tolerance and a one-sided
    binomial test against 1% gives p < 0.05.
- id: figs2d-traces-no-interference
  statement: Removing object traces from the OM trial did not significantly change the number of
    object-tuned cells (256 of 1,189 after removal, against the expected 19.9%).
  source: Supplementary Figure 2D
  quote: "The number object tuned cells was not significantly different after removing traces (using
    expected percentage 19.9% from Fig. 1c and observed count of 256/1189"
  statistics:
  - test: binomial test
    p: 0.0905
    n: 1,189 CA1 cells
  depends_on:
  - fig1c-object-tuned-fraction
  - figs4-object-traces
  criterion: A claim of absence, judged on the paper's test, a two-sided binomial test of the count of
    object-tuned cells after removal against 19.9% at alpha 0.05. The paper does not say how traces
    were removed; the one reading its text allows is to leave the OM rate-map bins inside the trace
    ROIs of figs4-object-traces out of the template correlations. Reproduced when p >= 0.05, not
    reproduced when p < 0.05; the count is given either way.
- id: ovs-method-extra-cells
  statement: The object-vector score method of earlier studies classified 40 cells (3.4%) that the
    template matching did not, mostly false positives on inspection.
  source: Methods, Object-vector score and object-vector cell criteria, last paragraph
  quote: "40 out of 1189 cells (3.4%) were classified by this method but not by the template matching
    procedure."
  depends_on:
  - fig1c-object-tuned-fraction
  expected:
    quantity: cells classified by the object-vector criteria and not by template matching
    value: 40
    tolerance: 4
    unit: cells
  criterion: The Methods' four criteria, after excluding cells whose fields would fall outside the
    arena in OM. The vector map's distance and direction bins and its smoothing are not given; the
    paper directs to the method of its references 11 and 12 (Hoydal et al. 2019; Andersson et al.
    2021), and those papers' bins and smoothing are used. Reproduced when the count is within tolerance. The manual
    inspection is not repeated.
- id: fig3b-decode-presence
  statement: A Bayesian decoder using 1 s population spike counts told the NO trial from the O trial
    above chance (50%) in every session.
  source: Results, Decoding the presence of an object from neural-population activity, paragraph 1;
    Figure 3B
  quote: "The decoding accuracy was above chance (50%) in all experimental sessions (Figure 3B)"
  criterion: The whole-arena decoder (opening comment), on each decoding session. The paper reports no
    test per session; its chance level is the label-shuffling procedure (Methods, Shuffling trial
    labels). Reproduced when, under both speed readings, every session's accuracy exceeds 0.5 and
    exceeds the 99th percentile of 50 label shuffles of that session (the 50 shuffles of
    Supplementary Figure 5E).
- id: fig3c-bin-size
  statement: Decoding accuracy grew roughly logarithmically with the testing bin size, rising quickly
    up to 1 s and saturating beyond.
  source: Results, Decoding the presence of an object from neural-population activity, paragraph 1;
    Figure 3C; Methods, Performance of decoder
  quote: "The decoder’s performance increased approximately logarithmically with the bin size of the
    testing data vector (Figure 3C)"
  criterion: The whole-arena decoder with testing bins of 10, 50, 100, 500, 1000, 5000 and 10000 ms
    (Methods). The paper gives no test. Reproduced when the median accuracy over sessions rises from
    10 to 1000 ms at each step, and its gain from 1000 to 10000 ms is smaller than its gain from 100
    to 1000 ms.
- id: fig3d-number-of-cells
  statement: Decoding accuracy increased with the number of cells used.
  source: Results, Decoding the presence of an object from neural-population activity, paragraph 1;
    Figure 3D; Methods, Effect of number of cells
  quote: "the success of decoding increased with the number of cells included (Figure 3D)"
  criterion: Random subsets of k cells, 100 per k, whole-arena decoder (Methods). The data are open;
    readings (a) the Methods', the 620-cell Neuropixels session, k = 1, 5, 10, 20, 30, 50, 100, 200,
    300, 400 and 500; (b) the legend's, the four datasets pooled (two tetrode, two Neuropixels), k up
    to each dataset's size. The paper gives no test. Reproduced when, under one reading, mean
    accuracy is higher at the largest k than at k = 1 by more than the SD across subsets, and no step
    in k lowers the mean by more than that SD.
- id: fig4b-distance-decline
  statement: Decoding accuracy fell gradually with the animal's distance from the object, over 5
    equal-sample distance bins, with significant steps between bins 1 and 2, 2 and 3, and 4 and 5.
  source: Results, Decoding the presence of an object from neural-population activity, paragraph 2;
    Figure 4B
  quote: "we found that decoding performance decreased gradually with increasing distance from the
    object (Figure 4B)"
  statistics:
  - about: accuracy across the 5 distance bins
    test: Kruskal-Wallis test
    statistic: H = 44.559
    p: 4.91e-9
    n: 16 sessions
  - about: bins 1 vs 2, 2 vs 3 and 4 vs 5, each (printed as W >= 111, p <= 0.0049)
    test: Wilcoxon signed-rank tests
    statistic: W >= 111
    p: 0.0049
    p_relation: "<"
    n: 16 sessions
  criterion: The distance decoder (opening comment), on the decoding sessions. Reproduced when, under
    every reading of speed and sessions, the Kruskal-Wallis test across the 5 bins gives p < 0.05 with
    median accuracy falling from bin 1 to bin 5, and signed-rank tests of bins 1 vs 2, 2 vs 3 and
    4 vs 5 each give p < 0.05 with the nearer bin higher. Partially reproduced when the Kruskal-Wallis
    part holds and one or two of the pairs do not. The population mean of bin 1 minus bin 5 (0.19 in
    the paper, Results, Distance-specific reorganization, paragraph 2) is reported.
- id: fig4c-each-session-decreasing
  statement: Every session showed decoding accuracy decreasing with distance from the object.
  source: Figure 4C legend
  quote: "Note that all experimental sessions have decreasing curves."
  depends_on:
  - fig4b-distance-decline
  criterion: The paper's two measures of the decrease (Methods, Measuring strength of distance-specific
    reorganization) give the readings (a) the least-squares slope of accuracy on distance-bin index is
    negative; (b) accuracy in bin 1 minus bin 5 is positive. Reproduced when every session meets one
    reading; partially reproduced when more than half do; not reproduced otherwise.
- id: fig4e-angle-flat
  statement: Decoding accuracy did not differ between 5 angular sectors around the object, so the
    distance effect is not specific to compass directions.
  source: Results, Decoding the presence of an object from neural-population activity, paragraph 3;
    Figure 4E and 4F
  quote: "The decoding accuracy was the same in different angular bins (Figures 4E and 4F)"
  statistics:
  - test: Kruskal-Wallis test
    statistic: H = 3.75
    p: 0.4416
    n: 16 sessions
  criterion: A claim of absence, judged on the paper's test, a Kruskal-Wallis test across the 5 angular
    bins at alpha 0.05. Distance decoder with 72 degree sectors of allocentric angle from the object in
    place of distance rings (Figure 4D legend, Methods). The sectors' starting angle is not given;
    readings (a) sectors starting at 0 degrees (the positive x axis, the code's angle origin in
    templateMatchingScore.m); (b) sectors starting at 36 degrees. Reproduced when p >= 0.05 under the
    readings, not reproduced when p < 0.05; H is given either way.
- id: fig4h-population-vector-correlation
  statement: Correlations between NO and O population vectors were lowest near the object and rose
    stepwise with distance before saturating, with significant steps between bins 1 and 2, 2 and 3,
    and 3 and 4.
  source: Results, Decoding the presence of an object from neural-population activity, paragraph 5;
    Figure 4G and 4H
  quote: "This showed a stepwise linear increase in correlation values as a function of distance from
    object, with saturation at larger distances (Figure 4H)"
  statistics:
  - about: correlation across the 5 distance bins
    test: Kruskal-Wallis test
    statistic: H = 30.1
    p: 4.67e-6
    n: 16 sessions
  - about: bins 1 vs 2, 2 vs 3 and 3 vs 4, each (printed as W <= 19, p <= 0.0113)
    test: Wilcoxon signed-rank tests
    statistic: W <= 19
    p: 0.0113
    p_relation: "<"
    n: 16 sessions
  criterion: Methods, Population vector correlation. Per session, rate maps of the whole NO and O
    trials (3 cm bins, 50 x 50, as the Methods give m = n = 50), the Pearson correlation across cells
    at each spatial bin, and the mean correlation in each of 5 distance bins. The bins are open;
    readings (a) the Methods' fixed 20 cm rings (0 to 100 cm); (b) 5 bins with equal numbers of
    spatial bins, which the reported 489 values per bin implies. Reproduced when, under one reading,
    the Kruskal-Wallis test gives p < 0.05 with correlation rising from bin 1 to bin 5 and the three
    signed-rank tests give p < 0.05 with the farther bin higher.
- id: figs5a-decode-no-from-no-prime
  statement: The NO trial could also be decoded from the NO' trial, above chance, consistent with
    trace fields.
  source: Results, Decoding the presence of an object from neural-population activity, paragraph 1;
    Supplementary Figure 5A
  quote: "we were also able to decode the NO trial from the NO0 trial using population activity
    (Figure S5A)"
  criterion: As fig3b-decode-presence, with NO' in place of O, on sessions with a NO' trial.
    Reproduced when the accuracy exceeds 0.5 and the 99th percentile of label shuffles in every
    session; partially reproduced when in more than half.
- id: figs5b-fixed-distance-bins
  statement: With fixed distance bins (0-20 to 80-100 cm) decoding accuracy still fell with distance.
  source: Supplementary Figure 5B; Methods, Fixed distance bins
  quote: "Decoding accuracy as a function of distance from object when using fixed distance bins ...
    Decoding accuracy decreases as a function of distance from object"
  statistics:
  - test: Kruskal-Wallis test
    statistic: H = 39.69
    p: 5.02e-8
    n: 16 sessions
  criterion: The distance decoder with bin edges 0, 20, 40, 60, 80 and 100 cm (Methods). Samples
    beyond 100 cm are left out, as the Methods' bins stop there. Reproduced when the Kruskal-Wallis
    test gives p < 0.05 with median accuracy highest in bin 1 and lowest in bin 4 or 5.
- id: figs5c-half-trial-control
  statement: Decoding the first from the second half of the NO trial showed no decrease of accuracy
    with distance.
  source: Results, Decoding the presence of an object from neural-population activity, paragraph 4;
    Supplementary Figure 5C
  quote: "we observed no decrease in decoding accuracy across the same distance bins when attempting
    to decode the first half of the NO trial from the second half of the NO trial (Figure S5C)"
  statistics:
  - test: Kruskal-Wallis test
    statistic: H = 1.46
    p: 0.834
    n: 16 sessions
  criterion: A claim of absence, judged on the paper's test. The NO trial is split at its midpoint and
    each half split again into training and testing quarters (Methods, Decoding 1st half vs. 2nd half);
    distances from the O trial's object position (the Methods give no other). Reproduced when the
    Kruskal-Wallis test across the 5 bins gives p >= 0.05, not reproduced when p < 0.05.
- id: figs5d-control-sessions
  statement: In control sessions without an object (CON1 against CON2), decoding accuracy did not fall
    with distance.
  source: Results, Decoding the presence of an object from neural-population activity, paragraph 4;
    Supplementary Figure 5D
  quote: "attempting to perform the decoding in control experiments without the object (Control trial
    1 vs. Control trial 2). We observed no decrease in accuracy as a function of distance"
  statistics:
  - test: Kruskal-Wallis test
    statistic: H = 6.32
    p: 0.1768
  criterion: A claim of absence, judged on the paper's test. Distance decoder on CON1 against CON2.
    The object position used for distances in control sessions is not given for this analysis;
    readings (a) the arena centre (75, 75) cm, the pseudo-object position the Methods use for the
    control chance level; (b) (35, 120) cm, the other one. The control sessions used are not stated;
    those with at least 25 simultaneously recorded cells are used (the rule for population analyses).
    Reproduced when p >= 0.05 under the readings, not reproduced when p < 0.05.
- id: figs5e-shuffled-labels
  statement: With shuffled trial labels the decoder performed at 50% in every distance bin.
  source: Results, Decoding the presence of an object from neural-population activity, paragraph 4;
    Supplementary Figure 5E
  quote: "On the shuffled data, the decoder performed with a mean accuracy of 50% in all distance bins
    (Figure S5E)"
  statistics:
  - about: each bin's accuracy against 0.5 (printed as t <= 2.1254, p >= 0.0518)
    test: t tests
    p: 0.0518
    p_relation: ">"
    n: 16 sessions, each the mean of 50 shuffles
  expected:
  - quantity: mean accuracy, distance bin 1
    value: 0.498
    tolerance: 0.01
  - quantity: mean accuracy, distance bin 5
    value: 0.502
    tolerance: 0.01
  criterion: Labels of the testing samples shuffled 50 times per session (Methods, Shuffling trial
    labels); session values are the means over shuffles. Tolerances are the SDs the legend gives.
    Reproduced when every bin's mean is within 0.49 to 0.51 and no one-sample t test against 0.5 gives
    p < 0.05.
- id: figs5f-random-partition
  statement: Partitioning training and testing samples at random gave the same decline of accuracy
    with distance.
  source: Results, Decoding the presence of an object from neural-population activity, paragraph 4;
    Supplementary Figure 5F
  quote: "The results from this decoder showed the same decline in decoding accuracy as a function of
    distance from the object (Figure S5F)"
  statistics:
  - test: Kruskal-Wallis test
    statistic: H = 39.71
    p: 4.98e-8
    n: 16 sessions
  criterion: The distance decoder with training and testing timepoints drawn by a random permutation
    (Methods, Random partitioning). Which timepoints are permuted is open; readings (a) 1 s bins;
    (b) position samples. Reproduced when, under one reading, the Kruskal-Wallis test gives p < 0.05
    with accuracy highest in bin 1 and lowest in bin 5.
- id: figs5ghi-fields-and-rates
  statement: Firing fields were spread across the arena, not concentrated at the object, and firing
    rates were similar between NO and O and highest at middle distances (bin 3).
  source: Results, Decoding the presence of an object from neural-population activity, paragraph 4;
    Supplementary Figure 5G to 5I
  quote: "across all cells, firing fields were widely distributed across the environment and not
    concentrated at the object location (Figures S5G and S5H), whereas firing rates were similar
    between trials, being largest at middle distances from the object (peaking in distance bin 3;
    Figure S5I)"
  criterion: The paper gives no test. Field centroids in NO and O relative to the object (Supplementary
    Figure 5G); per session, the mean firing rate of each cell in each of the 5 equal-sample distance
    bins of the whole trial, averaged over cells, then over sessions. Reproduced when (i) the
    proportion of fields per unit area within 20 cm of the object is not higher in O than in NO by a
    two-sided rank-sum test over sessions at p < 0.05 (the paper's test for unpaired data);
    (ii) the mean rate peaks in bin 2, 3 or 4 in both trials, and in bin 3 in at least one; (iii) no
    bin shows a NO against O difference by signed-rank test at p < 0.05. Partially reproduced when
    two of the three hold.
- id: figs6-behaviour-decoders-flat
  statement: Decoders of trial type based on speed, head direction or occupancy performed only slightly
    above 50% and their accuracy did not depend on distance from the object.
  source: Results, Behavioral analyses, paragraph 1; Supplementary Figure 6A, 6C and 6E
  quote: "Decoders for speed, head direction, and occupancy performed only slightly above 50% correct,
    with accuracies independent of object distance (Figures S6A, S6C, and S6E)"
  statistics:
  - about: speed decoder across distance bins
    test: Kruskal-Wallis test
    statistic: H = 6.85
    p: 0.1441
  - about: head direction decoder across distance bins
    test: Kruskal-Wallis test
    statistic: H = 2.13
    p: 0.711
  - about: occupancy decoder across distance bins
    test: Kruskal-Wallis test
    statistic: H = 3.53
    p: 0.4735
  criterion: A claim of absence, judged on the paper's tests. Behavioural decoders as in the Methods
    (Behavioral analyses I), with gamma likelihoods for speed (Lowess-smoothed, 25 Hz, all speeds),
    two-Gaussian mixtures for head direction, and occupancy ratios, 50 x 50 spatial bins, same
    training and testing split and distance bins. The Lowess span is not given; it cannot change the
    absence much, and a span of 0.5 s is used as a standard choice. Reproduced when all three
    Kruskal-Wallis tests give p >= 0.05 and the median accuracy over sessions is below 0.6 for each;
    not reproduced when any test gives p < 0.05.
- id: figs6hij-behaviour-matched
  statement: After matching the distributions of speed, head direction or occupancy between NO and O
    within each distance bin, decoding accuracy on neural data still fell with distance.
  source: Results, Behavioral analyses, paragraph 2; Supplementary Figure 6H to 6J
  quote: "We still observed a graded decrease in decoding accuracy for the neural activity decoder
    after matching distributions for speed (Figure S6H), head direction (Figure S6I) and occupancy
    (Figure S6J)"
  statistics:
  - about: speed matched
    test: Kruskal-Wallis test
    statistic: H = 45.4
    p: 3.28e-9
  - about: head direction matched
    test: Kruskal-Wallis test
    statistic: H = 38.23
    p: 1.01e-7
  - about: occupancy matched
    test: Kruskal-Wallis test
    statistic: H = 45.8
    p: 2.71e-9
  criterion: Matching as in the Methods (Behavioral analyses II), speed bins of 5 cm/s to 100 cm/s,
    head direction bins of pi/10, occupancy bins of 30 cm, random removal of the excess samples from
    the trial with more. The samples matched are the 1 s testing samples (the decoder's samples),
    with the behaviour averaged over the second; the Methods do not say, so a second reading matches
    25 Hz position samples and keeps the 1 s bins whose samples all survive. Reproduced when, under
    one reading, each of the three Kruskal-Wallis tests gives p < 0.05 with bin 1 highest.
- id: figs6k-uniform-prior
  statement: Replacing the occupancy prior by a uniform prior did not change the decline of decoding
    accuracy with distance.
  source: Results, Behavioral analyses, paragraph 2; Supplementary Figure 6K
  quote: "removal of this prior had no effect on our results (Figure S6K)"
  statistics:
  - test: Kruskal-Wallis test
    statistic: H = 42.92
    p: 1.07e-8
  criterion: Distance decoder with a uniform prior over the spatial bins of each distance bin (Methods,
    Removing effects of prior). Reproduced when the Kruskal-Wallis test gives p < 0.05 with bin 1
    highest.
- id: figs6l-sampling-thresholds
  statement: Using only spatial bins visited for at least 100, 500, 1000 or 2000 ms in both trials, the
    decline of accuracy with distance remained.
  source: Results, Behavioral analyses, paragraph 3; Supplementary Figure 6L
  quote: "Regardless of the threshold value, the result was the same as before, with accuracy declining
    along with object distance (Figure S6L"
  statistics:
  - about: each of the four thresholds (printed as H >= 34.08, p <= 7.18e-7)
    test: Kruskal-Wallis test
    statistic: H >= 34.08
    p: 7.18e-7
    p_relation: "<"
  criterion: Distance decoder with rate-map bins of 10 cm (the Methods' "10 cm2" read as 10 cm sides,
    as 3 cm2 is used for the 3 cm bins), spatial bins below the threshold in either trial left out
    of both. Reproduced when all four Kruskal-Wallis tests give p < 0.05 with bin 1 highest.
- id: tables1-without-bin-1
  statement: The effect of distance on decoding accuracy held when the bin nearest the object was left
    out.
  source: Supplementary Figure 6L legend, last sentence; Supplementary Table 1, first row
  quote: "all the main statistics hold even after excluding distance bin 1"
  expected:
    quantity: Kruskal-Wallis H across distance bins 2 to 5
    value: 25.06
    tolerance: 2.506
  criterion: The distance decoder results of fig4b-distance-decline, bins 2 to 5 only. The table's
    p-value has lost its exponent in the text. Reproduced when the Kruskal-Wallis test gives p < 0.05
    with bin 2 highest; H is compared with the expected value.
  depends_on:
  - fig4b-distance-decline
- id: fig5b-words-more-informative
  statement: Population words (patterns of spiking and silence in 10 ms bins) carried much more
    information about the trial than population spike counts.
  source: Results, Objects are encoded by distinct patterns of joint activity, paragraph 1; Figure 5B
  quote: "Words were much more informative than counts (Figure 5B)"
  statistics:
  - about: words against counts (printed as U >= 439, p <= 1.19e-6)
    test: Wilcoxon rank-sum tests
    statistic: U >= 439
    p: 1.19e-6
    p_relation: "<"
  criterion: Methods, Definition of words and counts, and Mutual information. Spike counts in 10 ms
    bins; tetrode sessions with all cells, Neuropixels sessions subsampled to 30 cells; the all-zero
    word and zero count left out; mutual information with trial, from frequency distributions, minus
    the mean over 50 label shuffles. Distance bins as in Figure 4B (Figure 5B legend), each 10 ms bin
    taking the distance of the nearest position sample, 5 equal-sample bins per trial. Open readings
    (a) one random subset of 30 Neuropixels cells; (b) the mean over 20 subsets (the number the
    Methods use for subsampling the decoder). Which samples are compared is open; readings (c) per
    distance bin, 16 against 16 sessions; (d) all bins pooled. Reproduced when, under one
    combination, every rank-sum test gives p < 0.05 with words higher.
- id: fig5bc-words-information-falls-with-distance
  statement: The information from words decreased with distance from the object, as decoding did.
  source: Results, Objects are encoded by distinct patterns of joint activity, paragraph 1; Figures 5B
    and 5C
  quote: "Importantly, the amount of information gained from words decreased as a function of distance
    from the object (Figures 5B and 5C)"
  statistics:
  - test: Kruskal-Wallis test
    statistic: H = 24.29
    p: 6.98e-5
    n: 16 sessions
  criterion: Mutual information of words as in fig5b-words-more-informative, under its subset readings.
    Reproduced when, under one reading, the Kruskal-Wallis test across the 5 bins gives p < 0.05 with
    bin 1 highest.
- id: fig5b-counts-uninformative
  statement: The information from counts did not depend on distance and was not significantly above
    zero.
  source: Results, Objects are encoded by distinct patterns of joint activity, paragraph 1; Figure 5B
  quote: "In contrast, the amount of information from counts did not depend on object distance ...
    and was not significantly above zero"
  statistics:
  - about: counts across distance bins
    test: Kruskal-Wallis test
    statistic: H = 4.08
    p: 0.3947
  - about: counts against zero, each bin (printed as t <= 1.46, p >= 0.1636)
    test: t tests
    statistic: t <= 1.46
    p: 0.1636
    p_relation: ">"
  criterion: A claim of absence, judged on the paper's tests. Bias-subtracted mutual information of
    counts as in fig5b-words-more-informative. Reproduced when the Kruskal-Wallis test gives
    p >= 0.05 and no per-bin two-sided one-sample t test against zero gives p < 0.05; not reproduced
    otherwise. Values given either way.
- id: fig5e-kl-divergence
  statement: The KL divergence between the word distributions of NO and O fell with distance from the
    object, from bin 1 to bin 5, while shuffled data showed no decrease.
  source: Results, Objects are encoded by distinct patterns of joint activity, paragraph 3; Figure 5E
  quote: "divergence between the NO and O distributions became smaller with increasing object distance
    (Figure 5E, blue curve) ... No decrease in the KL divergence was present in shuffled data"
  statistics:
  - about: across the 5 distance bins
    test: Kruskal-Wallis test
    statistic: H = 16.22
    p: 0.0027
  - about: bin 1 against bin 5
    test: Wilcoxon signed-rank test
    statistic: W = 102
    p: 6.10e-4
  criterion: Methods, Kullback-Leibler divergence, words and distance bins as in
    fig5b-words-more-informative, D(NO||O) over all words, probabilities as counts over all
    timepoints. Words seen in NO and never in O make the sum infinite, and the paper does not say how
    that was handled; the one finite reading its text allows is to sum over words seen in both
    trials, recorded as a deviation. Shuffled data assign trial labels to words at random (Figure 5E
    legend). Reproduced when the Kruskal-Wallis test and the bin 1 against bin 5 signed-rank test give
    p < 0.05 with bin 1 higher, and the shuffled divergences show no Kruskal-Wallis effect at 0.05.
- id: fig5-entropy
  statement: The entropy of words was higher than that of counts (1.65 against 0.84 bits).
  source: Results, Objects are encoded by distinct patterns of joint activity, paragraph 4
  quote: "the entropy was higher for words than counts (entropy of words: 1.65 bits ± 0.06; entropy of
    counts: 0.84 bits ± 0.02; mean ± SEM)"
  expected:
  - quantity: entropy of words
    value: 1.65
    tolerance: 0.165
    unit: bits
  - quantity: entropy of counts
    value: 0.84
    tolerance: 0.084
    unit: bits
  criterion: Entropy as in the Methods, words and counts as in fig5b-words-more-informative. The SEM is
    over an unstated unit, so the tolerance is 10%. The unit and whether the all-zero word is in are
    open; readings (a) per session and trial over the whole trial, all-zero word left out (as in the
    mutual information); (b) as (a) with it included; (c) per session, trial and distance bin.
    Reproduced when, under one reading, both means are within tolerance.
- id: figs7cd-number-of-words
  statement: The number of distinct words did not differ between trial types or across distance bins.
  source: Results, Objects are encoded by distinct patterns of joint activity, paragraph 3;
    Supplementary Figure 7C and 7D
  quote: "In contrast to the identity of words, the number of words was independent of trial type and
    distance from the object (Figures S7C and S7D)"
  statistics:
  - about: across distance bins, NO trial
    test: Kruskal-Wallis test
    statistic: H = 1.58
    p: 0.8117
  - about: across distance bins, O trial
    test: Kruskal-Wallis test
    statistic: H = 2.62
    p: 0.6227
  - about: NO against O
    test: Wilcoxon rank-sum test
    statistic: z = 0.221
    p: 0.8252
    n: 16 sessions
  criterion: A claim of absence, judged on the paper's tests (from the Supplementary Figure 7 legend,
    an image on PDF page 46, not in the text). Distinct words per session, trial and distance bin as in
    fig5b-words-more-informative. Reproduced when all three tests give p >= 0.05, not reproduced when
    any gives p < 0.05.
- id: figs7e-downsampled-words
  statement: After downsampling words to as many states as counts, words still carried more information
    than counts.
  source: Results, Objects are encoded by distinct patterns of joint activity, paragraph 4;
    Supplementary Figure 7E
  quote: "after downsampling the number of states to be equal for words and counts, words were still
    much more informative (Figure S7E)"
  statistics:
  - test: Wilcoxon signed-rank test
    statistic: W = 2480
    p: 4.42e-13
    n: 16 sessions x 5 distance bins (80 pairs)
  criterion: Methods, Downsampling words. Per session and distance bin, keep the c most frequent words,
    c the number of distinct counts, and renormalise. Whether the bias subtraction is applied is not
    said; readings (a) with, (b) without. Reproduced when, under one reading, a signed-rank test over
    the 80 pairs gives p < 0.05 with words higher.
- id: fig6ab-single-cell-distance-tuning
  statement: Single cells decoded with almost flat accuracy across distance; their distance tuning
    (bin 1 minus bin 5 accuracy) averaged 0.02, 98.7% lay between -0.2 and 0.2, 12.2% (145) had
    significant positive and 3.8% (45) significant negative tuning.
  source: Results, Distance-specific reorganization of the hippocampal map is widely distributed,
    paragraph 2; Figure 6A and 6B
  quote: "CA1 cells had a slight positive bias in distance tuning (mean: 0.02; for reference, the same
    mean calculated from populations is 0.19; Figure 4C) and nearly all cells were contained between
    the bounds ... and 0.2 (98.7% of cells) ... some cells had significant positive distance tuning
    (12.2%, n = 145/1,189 cells) ... and some cells had significant negative distance tuning (3.8%,
    n = 45/1,189 cells)"
  expected:
  - quantity: mean distance tuning of single cells
    value: 0.02
    tolerance: 0.005
  - quantity: fraction of cells with distance tuning within -0.2 to 0.2
    value: 0.987
    tolerance: 0.013
  - quantity: fraction with significant positive tuning
    value: 0.122
    tolerance: 0.0122
  - quantity: fraction with significant negative tuning
    value: 0.038
    tolerance: 0.0038
  criterion: The distance decoder run with one cell at a time; distance tuning is accuracy in bin 1
    minus bin 5 (Equation 1). Significance from 100 circular shifts of the spike train by 20 s to the
    trial length less 20 s, above the 99th or below the 1st percentile (Methods). The tolerance on the
    within-bounds fraction stops at 1. The mean of 0.02 is printed to one significant figure, so the
    tolerance on it is 0.005 (half the last digit) in place of 10%. Which cells are open; readings (a)
    all 1,189 unique cells, each in its session; (b) the cells of the decoding sessions (Figure 6A
    legend). Reproduced when, under one reading, all four values are within tolerance; partially
    reproduced when the mean and within-bounds fraction are and a significant fraction is not.
- id: figs5l-without-positively-tuned
  statement: After removing the cells with significant positive distance tuning, decoding accuracy
    still fell gradually with distance.
  source: Results, Distance-specific reorganization of the hippocampal map is widely distributed,
    paragraph 2; Supplementary Figure 5L
  quote: "after removing cells with significant positive distance tuning (12.2%), we still observed a
    gradual drop in decoding accuracy ... obtained with population data as a function of object
    distance (Figure S5L)"
  statistics:
  - test: Kruskal-Wallis test
    statistic: H = 28.88
    p: 8.27e-6
  depends_on:
  - fig6ab-single-cell-distance-tuning
  criterion: Distance decoder on the decoding sessions without the cells found in
    fig6ab-single-cell-distance-tuning. Reproduced when the Kruskal-Wallis test gives p < 0.05 with
    bin 1 highest.
- id: figs5m-without-object-tuned
  statement: After removing all object-tuned cells, decoding accuracy still fell gradually with distance.
  source: Results, Distance-specific reorganization of the hippocampal map is widely distributed,
    paragraph 5; Supplementary Figure 5M
  quote: "After removing all object-tuned cells (19.9%) from the data and re-running the decoder, we
    observed the same gradual fall in decoding accuracy as a function of distance (Figure S5M)"
  statistics:
  - test: Kruskal-Wallis test
    statistic: H = 38.89
    p: 7.34e-8
  depends_on:
  - fig1c-object-tuned-fraction
  criterion: Distance decoder on the decoding sessions without the object-tuned cells of
    fig1c-object-tuned-fraction (each template-width reading). Reproduced when, under one reading, the
    Kruskal-Wallis test gives p < 0.05 with bin 1 highest.
- id: fig6c-subsets-decline
  statement: In the 620-cell session, random subsets of every size except a single cell showed decoding
    accuracy falling with distance.
  source: Results, Distance-specific reorganization of the hippocampal map is widely distributed,
    paragraph 3; Figure 6C
  quote: "All curves showed reduced decoding accuracy as a function of distance, except the curve
    constructed using only a single cell (Figure 6C)"
  statistics:
  - about: n = 1 curve
    test: Wilcoxon signed-rank test
    statistic: W = 2.48
    p: 0.6489
  - about: all other curves (printed as W >= 11.89, p <= 0.0182)
    test: Wilcoxon signed-rank tests
    statistic: W >= 11.89
    p: 0.0182
    p_relation: "<"
  criterion: Distance decoder on 20 random subsets per size of the 620 cells (Methods, Subsampling for
    decoder). The sizes are open, as three lists are given; readings (a) Results, 1, 5, 10, 30, 50,
    100, 200, 300, 400, 500; (b) legend, 1, 5, 20, 30, 50 to 500; (c) Methods, 1, 5, 10, 30, 100 to
    500. The test is open, as the printed W values are not integers; readings (d) signed-rank of bin 1
    against bin 5 over the 20 subsets; (e) Kruskal-Wallis across the 5 bins over the 20 subsets.
    Reproduced when, under one reading of the test, the single-cell curve gives p >= 0.05 and every
    other size gives p < 0.05 with bin 1 higher.
- id: fig6d-reorganization-grows-with-cells
  statement: The difference between bins 1 and 5 grew, and the slope of accuracy over distance became
    more negative, as more cells were used, both reaching their extremes at 500 cells.
  source: Results, Distance-specific reorganization of the hippocampal map is widely distributed,
    paragraph 3; Figure 6D
  quote: "The difference between bins #1 and #5 grew systematically with the number of cells (Figure
    6D; left y axis, blue)"
  statistics:
  - about: distance difference across subset sizes
    test: Kruskal-Wallis test
    statistic: H = 174.57
    p: 3.14e-32
  - about: slope across subset sizes
    test: Kruskal-Wallis test
    statistic: H = 157.6
    p: 1.011e-28
  depends_on:
  - fig6c-subsets-decline
  criterion: The 20 subsets per size of fig6c-subsets-decline; per subset, accuracy in bin 1 minus bin 5
    and the least-squares slope over bin indices 1 to 5 (Methods, Measuring strength). Reproduced when,
    under one size reading, both Kruskal-Wallis tests across sizes give p < 0.05 and the largest mean
    difference and most negative mean slope are at 400 or 500 cells.
- id: figs8-smaller-datasets
  statement: The growth of distance reorganization with the number of cells held in the tetrode
    sessions and in the 135-cell Neuropixels session.
  source: Results, Distance-specific reorganization of the hippocampal map is widely distributed,
    paragraph 3; Supplementary Figure 8A to 8D
  quote: "The finding was upheld in data from animals with smaller numbers of cells (135 cells in a
    Neuropixels recording; 25–39 cells in tetrode recordings)"
  statistics:
  - about: tetrode sessions, distance difference
    test: Kruskal-Wallis test
    statistic: H = 349.13
    p: 2.70e-74
    n: 14 sessions x 20 subsets
  - about: tetrode sessions, slope
    test: Kruskal-Wallis test
    statistic: H = 352.35
    p: 5.46e-75
  - about: 135-cell session, distance difference
    test: Kruskal-Wallis test
    statistic: H = 62.87
    p: 4.03e-11
  - about: 135-cell session, slope
    test: Kruskal-Wallis test
    statistic: H = 55.76
    p: 1.06e-9
  criterion: As fig6d-reorganization-grows-with-cells, on the tetrode decoding sessions pooled (sizes up
    to each session's count) and on the 135-cell session. Subset sizes for the tetrode sessions are not
    given beyond n = max (29 to 35 cells); sizes from reading (a) of fig6c-subsets-decline up to each
    session's count, then the session's full count, are used. Reproduced when all four Kruskal-Wallis
    tests give p < 0.05 with the difference rising and the slope falling with size.
- id: fig6ef-least-tuned-cells
  statement: Even the 20% of cells with the lowest distance tuning showed distance reorganization, with
    a bin 1 minus bin 5 difference of 0.121 and a slope of -0.0267.
  source: Results, Distance-specific reorganization of the hippocampal map is widely distributed,
    paragraph 4; Figure 6E and 6F
  quote: "even the 20% of cells with lowest tuning was sufficient to demonstrate the distance
    modulation, in the form of positive distance tuning as well as a negative slope (Figures 6E and
    6F; rightmost point on blue curve: 0.121; on orange curve"
  depends_on:
  - fig6ab-single-cell-distance-tuning
  expected:
  - quantity: bin 1 minus bin 5 accuracy, 20% least-tuned cells of the 620-cell session
    value: 0.121
    tolerance: 0.0121
  - quantity: slope of accuracy on distance bin, same cells
    value: -0.0267
    tolerance: 0.00267
  criterion: Cells of the 620-cell session sorted by single-cell distance tuning
    (fig6ab-single-cell-distance-tuning), the lowest 100, 80, 60, 40 and 20% kept, distance decoder
    run on each. Reproduced when both 20% values are within tolerance; partially reproduced when the
    difference is positive and the slope negative but outside tolerance.
- id: fig7-single-cell-properties
  statement: Single-cell properties barely predicted distance tuning; correlations with object-tuning
    score (r = 0.12), spatial information (r = -0.13), spatial correlation (r = -0.08) and rate overlap
    (r = -0.18) were significant but weak.
  source: Results, Distance-specific reorganization of the hippocampal map is widely distributed,
    paragraph 5; Figure 7A to 7D
  quote: "The object-tuning score had a significant positive correlation with distance tuning, but very
    weakly so (r = 0.12 ... Spatial information had a significant negative correlation, but also this
    was very weak ... spatial correlation and rate overlap were also negatively but weakly correlated
    with distance tuning"
  statistics:
  - about: object-tuning score
    test: Pearson correlation
    statistic: r = 0.12
    p: 1.95e-5
    n: 1,189 cells
  - about: spatial information
    test: Pearson correlation
    statistic: r = -0.13
    p: 3.70e-7
  - about: spatial correlation
    test: Pearson correlation
    statistic: r = -0.08
    p: 7.61e-4
  - about: rate overlap
    test: Pearson correlation
    statistic: r = -0.18
    p: 1.57e-9
  depends_on:
  - fig1c-object-tuned-fraction
  - fig6ab-single-cell-distance-tuning
  expected:
  - quantity: r, object-tuning score
    value: 0.12
    tolerance: 0.05
  - quantity: r, spatial information
    value: -0.13
    tolerance: 0.05
  - quantity: r, spatial correlation
    value: -0.08
    tolerance: 0.05
  - quantity: r, rate overlap
    value: -0.18
    tolerance: 0.05
  criterion: Pearson correlations over cells of distance tuning with the object-tuning score (opening
    comment), spatial information in bits per spike in the O trial (Methods), and NO-O spatial
    correlation and rate overlap. The r values are printed to two digits, so a tolerance of 0.05 is
    used in place of 10%, being half a unit in the first digit at the scale the claim calls weak.
    Reproduced when, under one cell reading of fig6ab-single-cell-distance-tuning, all four r are
    within 0.05 of the printed values with the same sign, and each |r| is below 0.3.
- id: fig7-slope-variant
  statement: Using the slope of accuracy against distance in place of distance tuning gave similar weak
    correlations with the same four properties.
  source: Results, Distance-specific reorganization of the hippocampal map is widely distributed,
    paragraph 5
  quote: "We obtained similar results when, instead of distance tuning, we used the slope of the
    regression line fitted to decoding accuracy vs. distance as a measure of reorganization"
  statistics:
  - about: object-tuning score
    test: Pearson correlation
    statistic: r = -0.12
    p: 3.05e-5
  - about: spatial information
    test: Pearson correlation
    statistic: r = 0.10
    p: 3.58e-5
  - about: spatial correlation
    test: Pearson correlation
    statistic: r = -0.08
    p: 7.98e-4
  - about: rate overlap
    test: Pearson correlation
    statistic: r = 0.19
    p: 1.13e-12
  depends_on:
  - fig7-single-cell-properties
  criterion: As fig7-single-cell-properties with the single-cell least-squares slope. Reproduced when
    all four r are within 0.05 of the printed values with the same sign. The printed sign for spatial
    correlation (negative for both measures, while the others flip) is noted.
