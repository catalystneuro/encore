# Claims for Nagelhus, Andersson, Gonzalo Cogno, Moser & Moser (2023), "Object-centered population
# coding in CA1 of the hippocampus", Neuron 111, 2091-2104, on EBRAINS dataset 10.25493/Q0FG-1X8.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-20, protocol
# as stated in docs/protocol.md (pilot-10).
#
# Text read: the version of record (open access, CC BY), from the PDF supplied by a person, as
# extracted to paper/10.1016-j.neuron.2023.04.008.txt: main text, figure legends, STAR Methods and
# the Supplemental information (Supplementary Figures 1 to 8 and Supplementary Table 1). The legend
# of Supplementary Figure 7 is an image in the PDF and is missing from the text; it was read from
# PDF page 46. The CA3 p-values of Supplementary Figure 3F were read from PDF page 35. Supplementary
# Table 1 is garbled in the text (exponents of some p-values are lost) and is used only where legible.
#
# Code read: the paper's code on Zenodo (doi:10.5281/zenodo.7797252, "v1.0"), a snapshot of GitHub
# sebasoa/Object-centered-population-coding at tag v1.0, commit 4e4f5ac. It holds MATLAB functions
# for the object-tuning score (objectTuningScore.m, templateMatchingScore.m,
# shuffledTemplateMatchingScore.m, rateMapData.m, compareThreshold.m) and for the distance decoder
# (distanceDecoder.m, divideTrainingTesting.m, binningSpikeMatrix.m, equalDistanceEdges.m,
# calculateDistanceMap.m, calculateDecodingAccuracy.m), with a rate-map function (calculateRateMap.m,
# from the Behavioural Neurology Toolbox). Two functions they call are not in the repository:
# objectScore (the template and its correlation with a rate map) and PoissonDecoder_distance (the
# Poisson likelihood). Those steps are taken from the Methods. No code is given for the single-cell
# change analyses, object traces, words and counts, mutual information, KL divergence, behavioural
# decoders or population vector correlations.
#
# Data the paper used (as it reports them). 10 male Long-Evans rats; 7 implanted with tetrodes
# (CA1/CA3) and 3 with Neuropixels 2.0 probes (CA1/CA3 and MEC; MEC data not used). Each session had
# four trials of free foraging in a 150 cm x 150 cm open field, each typically 20 to 30 min (the
# Methods assume 1800 s): No Object (NO), Object (O, a 52 x 10 x 10 cm Duplo tower at or near the
# middle), Object Moved (OM, the tower moved towards a corner, 35 to 55 cm from it), and No Object'
# (NO', omitted in some sessions, 8.5% of cells). Control sessions had four trials without an object
# (CON1 to CON4). Position from two LEDs at 25 Hz (tetrodes) or OptiTrack at about 120 Hz
# (Neuropixels). Cells were kept when no more than 1% of inter-spike intervals were under 2 ms and
# the mean rate over the session was 0.05 to 10 Hz; cells in cortex or dentate gyrus were excluded.
# Samples: 1,189 unique CA1 principal cells from 9 rats in object sessions; 219 CA1 cells from 3
# rats in control sessions; 313 CA3 cells and 59 CA3 control cells from 2 rats. Population analyses
# use the sessions with at least 25 simultaneously recorded cells: the Methods say 15 tetrode
# sessions (25 to 39 cells) and 2 Neuropixels sessions (620 cells from two probes in rat 27207, and
# 135 cells from one probe), 4 rats in all; the figure legends count 16 sessions, and the Figure 5B
# and Supplementary Figure 8A legends say 14 tetrode sessions (2 rats). Measured variables: spike
# times, position, head direction, object position per trial, cell identity across days (tetrodes),
# recording region (CA1 or CA3) and the proximodistal implant site.
#
# The dataset is described on EBRAINS as "Extracellular unit recordings from CA1/CA3 pyramidal cells
# in rats exploring an open arena with object landmarks" (v1, MATLAB files). Whether it holds the
# control sessions, the CA3 cells, cell identities across days and the implant sites is the
# author's to find.
#
# Methods shared by many claims, with their sources.
#
# Rate maps for single cells (Fig 1 to 2, 7, S2 to S4). Methods, Firing rate maps: 2.5 cm bins,
# spikes over time per bin, Gaussian smoothing with SD 2 bins, only epochs with speed above 2.5 cm/s.
# Spatial correlation (Methods, Spatial correlation and rate overlap): Pearson correlation over bins
# with a value in both maps. Rate overlap: mean rate in the less active trial over that in the more
# active trial. Firing fields (Methods): contours from the peak down to 3 x MAD of all bins, fields
# at least 225 cm2 with a rate of at least 1 Hz. Open: whether the mean rate for rate overlap uses
# all of the trial or only the speed-filtered epochs; readings (a) speed-filtered, (b) whole trial.
#
# Template matching (object-tuning score). Methods, Template matching procedure, and the code
# (rateMapData.m, templateMatchingScore.m, shuffledTemplateMatchingScore.m, compareThreshold.m):
# rate maps of the O and OM trials with 3 cm bins over 0 to 150 cm (50 x 50), smoothing 2 bins,
# unvisited bins not blanked (code); Gaussian templates centred at the object or offset by 5, 10,
# 15, 20, 30, 40, 50 or 60 cm in 8 directions (0 to 7 pi/4), 8 widths, 520 scores per cell; score =
# minimum over O and OM of the Pearson correlation of template and rate map; per width, 500
# shuffles drawing one location uniformly in the arena (0 to 150 cm in x and y) used in both trials
# (code), threshold the 99th percentile of the shuffled minimum; a cell is object-tuned when any
# score exceeds its width's threshold. A cell's single object-tuning score (Fig 7) is the score with
# the largest margin over its threshold (compareThreshold.m). Open, could change the outcome: the
# template width. Readings (a) the code's, standard deviations of 5, 10, 25, 50, 75, 100, 150 and
# 200 cm; (b) the Methods', variances of those values (standard deviation the square root, in cm).
# Open: the template's form and the bins correlated (objectScore is not in the repository); the
# reading used is an isotropic Gaussian evaluated at bin centres, correlated with all 2,500 bins.
# Open: the speed filter, applied to these maps per the Methods (the code takes the positions it
# is given).
#
# Distance decoder. Methods, Bayesian decoding algorithm and Calculation of decoding accuracy, and
# the code distanceDecoder.m with its helpers. Trials NO and O. Each trial is split at the midpoint
# of its position time span; one iteration tests on the first half and trains on the second, the
# other the reverse (divideTrainingTesting.m). Rate maps and occupancy from the training half with
# 3 cm bins, smoothing 2 bins, unvisited bins not blanked (distanceDecoder.m). Testing samples are
# spike counts in consecutive 1 s bins from the start of the testing half (binningSpikeMatrix.m).
# A sample's distance is that of the position sample nearest in time to the bin centre from the
# object (equalDistanceEdges.m). Within each trial and iteration, testing samples are sorted by
# distance and split into 5 equal groups, the remainder going to bin 5; the bin edges are 0 and each
# group's largest distance (equalDistanceEdges.m). For a sample in distance bin b, the likelihood
# under each trial is the product over cells of Poisson probabilities with mean the training rate in
# a spatial bin (Methods), times a prior equal to that trial's training occupancy restricted to the
# spatial bins whose centre lies strictly between bin b's edges of that trial and normalised, summed
# over those spatial bins (distanceDecoder.m). The sample is assigned to NO when the ratio exceeds 1.
# Accuracy per distance bin is correct over correct plus wrong, pooled over both trials and both
# iterations, ties left out (calculateDecodingAccuracy.m). The whole-arena decoder (Fig 3) is the
# same without distance bins: all spatial bins and the full occupancy prior (Methods). Open, could
# change the outcome: the speed filter. Readings (a) the Methods' rule, rate maps and occupancy from
# epochs above 2.5 cm/s, all testing samples kept; (b) the code as written, no speed filter.
#
# Decoding sessions. Methods: tetrode sessions with at least 25 simultaneously recorded CA1 cells
# and the two Neuropixels CA1 sessions. The text gives 15 tetrode sessions (17 in all), the legends
# 16 sessions (14 tetrode). Readings (S-methods) every session meeting the Methods' rule;
# (S-legends) when that rule gives one session more than 16, the claim is also run on each set of 16
# that drops one tetrode session, and the outcome is the one all of them give. The session count
# found is reported. Statistics over sessions (Methods, Statistical tests): Kruskal-Wallis across
# distance bins, Wilcoxon signed-rank for paired comparisons, rank-sum for unpaired, Pearson for
# correlations, two-sided, alpha 0.05.
#
# Unique cells. The paper counts 1,189 unique CA1 cells; tetrode cells recorded on several days are
# counted once. The paper does not say which day's session stands for such a cell in the single-cell
# analyses. Readings (a) the first day the cell was recorded (Fig 1H calls it day 0); (b) every
# session, counting cell-sessions. Each count-based claim is judged under both.
#
# Inconsistencies in the paper noted for the attempt: 13 (text) against 11 (Fig 1H legend) of 35
# cells stable on more than one day, with 31.4% printed for both (11/35 = 31.4%); identical statistics
# for OM-NO' and NO-NO' spatial correlation (z = 11.85, p = 2.11e-32); 12.2% (text) against 12.3%
# (Fig S5L legend) of cells with positive distance tuning; three different lists of subset sizes for
# Figure 6C; the Figure 3D legend pools four datasets while the Methods use the 620-cell session; the
# Figure 6A legend gives 1,189 cells from the 17 decoding sessions, while 1,189 is the count over
# all 9 rats; the Methods refer to a section "Region-of-interest analysis for object responses" that
# is not in the paper.
schema_version: 2
dataset:
  archive: ebrains
  id: Q0FG-1X8
  doi: 10.25493/Q0FG-1X8
paper: doi:10.1016/j.neuron.2023.04.008
claims:
- id: cell-counts
  statement: The object sessions yielded 1,189 unique CA1 principal cells from 9 rats, the control
    sessions 219 CA1 principal cells from 3 rats, and up to 620 CA1 cells were recorded simultaneously.
  source: Figure 2D legend; Introduction, paragraph 3; Results, Decoding the presence of an object, paragraph 1
  quote: "n = 1,189 principal cells recorded from 9 rats) and the corresponding pair of control trials
    (as in Figure 2B; brown lines; n = 219 principal cells recorded from 3 rats)"
  expected:
  - quantity: unique CA1 cells in object sessions
    value: 1189
    tolerance: 118.9
    unit: cells
  - quantity: CA1 cells in control sessions
    value: 219
    tolerance: 21.9
    unit: cells
  - quantity: largest number of CA1 cells recorded simultaneously
    value: 620
    tolerance: 62
    unit: cells
  criterion: Cells are counted after the paper's inclusion rules (Methods, Spike sorting and
    cell-inclusion criteria, and Histology), CA1 only. Unique cells under both readings of the opening
    comment. Reproduced when the three counts are within tolerance.
- id: fig1c-object-tuned-fraction
  statement: 19.9% of CA1 cells (237 of 1,189) were object-tuned by the template matching
    procedure, significantly more than the 5.03% (11 of 219) found by the same procedure in control
    trials without objects.
  source: Results, Object cells and object-vector cells in the hippocampus, paragraph 3; Figure 1C
  quote: "Using the template matching procedure, 19.9% of CA1 cells were classified as object-tuned
    (237/1,189 cells) ... This fraction was significantly higher than a chance level determined by
    running the same template matching procedure on control trials without objects (11/219 cells,
    5.03%"
  statistics:
  - test: binomial test
    p: 5.73e-141
    p_relation: "<"
    n: 1,189 CA1 cells against a chance level from 219 control cells
  expected:
  - quantity: fraction of CA1 cells object-tuned
    value: 0.199
    tolerance: 0.0199
  - quantity: fraction of control cells object-tuned (chance level)
    value: 0.0503
    tolerance: 0.00503
  criterion: Template matching as in the opening comment, under each template-width reading, on the
    O and OM trials of every CA1 cell. Chance level as in the Methods (Template matching, Chance level),
    on the 219 control cells with the object placed at (75, 75) cm in the trial standing for O and at
    (35, 120) cm in the trial standing for OM. The paper does not say which control trials stand for
    O and OM; readings (a) CON2 and CON3, the trials in the same place in the session; (b) CON1 and
    CON2. Reproduced when, under one reading, both fractions are within tolerance and a one-sided
    binomial test of the object-tuned count against the chance fraction gives p < 0.05.
- id: fig1d-field-distances
  statement: Firing fields of object-tuned cells lay at a wide range of distances from the object
    (4.8 to 80.7 cm, mean 37.7 cm, SD 16.0 cm) and covered all directions around it.
  source: Results, Object cells and object-vector cells in the hippocampus, paragraph 3; Figure 1D
  quote: "The firing fields of the object-tuned cells covered a wide range of distances from the
    object (range: 4.8–80.7 cm; mean ± SD: 37.7 ± 16.0 cm) and the entire azimuthal range"
  depends_on:
  - fig1c-object-tuned-fraction
  expected:
  - quantity: mean distance of object-tuned cells' fields from the object
    value: 37.7
    tolerance: 3.77
    unit: cm
  - quantity: smallest field distance
    value: 4.8
    tolerance: 0.48
    unit: cm
  - quantity: largest field distance
    value: 80.7
    tolerance: 8.07
    unit: cm
  criterion: The tolerance on the mean is 10% of it, as the SD of 16.0 cm is the spread over cells,
    not an uncertainty of the mean. Fields detected as in the opening comment. The paper does not say
    which point of a field gives its distance, in which trial, or which field of a cell with several.
    Readings (a) the centroid of the field (the point Supplementary Figure 5G plots) in the O trial,
    nearest field; (b) as (a) averaged over the O and OM trials; (c) the field's peak bin in the O
    trial. Reproduced when, under one reading, the mean is within tolerance, the range lies within
    4.8 to 80.7 cm widened by 10% of each bound, and every 45 degree sector around the object holds
    at least one field.
- id: fig1e-object-cells-and-object-vector-cells
  statement: About 4.1% of all recorded CA1 cells (49 of 1,189) were object cells, object-tuned with
    fields under 15 cm from the object, and 13.3% (158) were object-vector cells, with fields 15 cm or
    more away; 30 object-tuned cells had no detectable field.
  source: Results, Object cells and object-vector cells in the hippocampus, paragraph 4; Figure 1E;
    Methods, Template matching procedure
  quote: "we estimated that 4.1% of all recorded cells were object cells (49/1,189 cells, object-tuned
    cells with firing fields <15 cm from the object ... and 13.3% were object-vector cells (158/1,189
    cells"
  depends_on:
  - fig1c-object-tuned-fraction
  expected:
  - quantity: fraction of cells that are object cells
    value: 0.041
    tolerance: 0.0041
  - quantity: fraction of cells that are object-vector cells
    value: 0.133
    tolerance: 0.0133
  - quantity: object-tuned cells without a detectable field
    value: 30
    tolerance: 3
    unit: cells
  criterion: Field distance under the readings of fig1d-field-distances. Reproduced when, under one
    reading, the three values are within tolerance.
- id: fig1f-orientation-coverage
  statement: The nearer an object-tuned cell's firing field is to the object, the larger the range of
    orientations around the object that its fields cover.
  source: Figure 1F legend
  quote: "The nearer the cell’s firing field is to the object, the larger is the orientation coverage."
  depends_on:
  - fig1c-object-tuned-fraction
  criterion: Orientation coverage is the fraction of 0 to 360 degrees around the object covered by the
    cell's firing fields (Supplementary Figure 3C legend), taken as the angular span, seen from the
    object centre, of the field bins; distance as in fig1d-field-distances. The paper reports no test;
    its stated test for correlations is Pearson's (Methods, Statistical tests). Reproduced when, under
    one distance reading, the Pearson correlation of coverage with distance over object-tuned cells
    is negative with p < 0.05.
- id: fig1g-no-experience-effect
  statement: The object-tuning score did not change with the number of days the animal had been
    exposed to the object (r = -0.080, p = 0.574, 62 cells).
  source: Results, Object cells and object-vector cells in the hippocampus, paragraph 4; Figure 1G
  quote: "We observed no significant effect of day of exposure to the object on the object-tuning
    score (Figure 1G)"
  statistics:
  - test: Pearson correlation
    statistic: r = -0.080
    p: 0.57369
    n: 62 cells recorded on several days and object-tuned on at least one
  depends_on:
  - fig1c-object-tuned-fraction
  criterion: A claim of absence, judged on the paper's test. For every cell recorded on more than one
    day and object-tuned on at least one, each day's object-tuning score (opening comment) against the
    number of days the rat had been exposed to the object; Pearson correlation over all cell-days.
    Reproduced when p >= 0.05; not reproduced when p < 0.05. The r and the number of cells are given
    either way. Needs cell identities across days.
- id: fig1h-cross-day-stability
  statement: Of 35 object-tuned cells recorded on more than one day, few passed the object-tuning
    criteria on more than one day, yet object-tuned cells passed again on later days more often than
    other cells (13/35 against 36/370, p = 3.35e-4).
  source: Results, Object cells and object-vector cells in the hippocampus, paragraph 5; Figure 1H
  quote: "Only 13 of these cells (31.4%) had significant object-tuning scores on more than 1 day
    (Figure 1H). However, object-tuned cells were more stable than expected by chance, with higher
    probability of passing the classification on later days compared to other cells (13/35
    object-tuned cells vs. 36/370 other cells"
  statistics:
  - test: binomial test
    p: 3.35e-4
    n: 35 object-tuned cells and 370 other cells recorded on more than one day
  depends_on:
  - fig1c-object-tuned-fraction
  expected:
  - quantity: object-tuned cells recorded on more than one day
    value: 35
    tolerance: 3.5
    unit: cells
  - quantity: other cells recorded on more than one day that passed on a later day
    value: 36
    tolerance: 3.6
    unit: cells
  criterion: The paper gives 13 in the text and 11 in the Figure 1H legend, with 31.4% for both;
    the readings are 13 (text) and 11 (legend, which matches 31.4%). Day 0 is the first day a cell
    was recorded (Figure 1H legend). Reproduced when the counts are within tolerance, the number of
    object-tuned cells passing on more than one day is within 10% of 13 or of 11, and a one-sided
    binomial test of that count among the 35 against the fraction of other cells passing on a later
    day gives p < 0.05. Needs cell identities across days.
- id: figs2e-within-trial-stability
  statement: Within a single trial, object-tuned cells with larger object-tuning scores were more
    stable (r = 0.45 between within-trial stability and score).
  source: Results, Object cells and object-vector cells in the hippocampus, paragraph 5; Supplementary
    Figure 2E
  quote: "cells with larger object-tuning scores tended to be more stable than cells with lower scores
    (Figure S2E) (Pearson correlation between within-trial stability and object-tuning score, r = 0.45"
  statistics:
  - test: Pearson correlation
    statistic: r = 0.45
    p: 3.65e-13
    n: 237 object-tuned cells
  depends_on:
  - fig1c-object-tuned-fraction
  expected:
    quantity: Pearson r, within-trial stability against object-tuning score
    value: 0.45
    tolerance: 0.045
  criterion: Within-trial stability is the Pearson correlation of rate maps from the first and second
    halves of the O trial (Supplementary Figure 2E legend), rate maps as in the opening comment.
    Reproduced when r is within tolerance and p < 0.05.
- id: figs2c-no-proximodistal-effect
  statement: The percentage of object-tuned cells did not depend on the proximodistal location of the
    recording site (r = 0.42, p = 0.22).
  source: Results, Object cells and object-vector cells in the hippocampus, paragraph 3; Supplementary
    Figure 2C
  quote: "There was no significant linear correlation between the proximodistal site and the percentage
    of object related cells (r = 0.42, p = 0.2216"
  statistics:
  - test: Pearson correlation
    statistic: r = 0.42
    p: 0.2216
    n: 10 implants (9 rats, two Neuropixels probes in rat 27207)
  depends_on:
  - fig1c-object-tuned-fraction
  criterion: A claim of absence, judged on the paper's test. Per implant (rat, with the two probes of
    rat 27207 apart), the percentage of object-tuned cells against the proximodistal order of the
    implant site; Pearson correlation. Reproduced when p >= 0.05, not reproduced when p < 0.05; r is
    given either way. Needs the implant sites, which the paper shows in Supplementary Figure 1.
- id: figs3a-ca3-object-tuned
  statement: Object-related activity was present also in CA3, where 23% of cells (72 of 313) were
    object-tuned.
  source: Supplementary Figure 3A
  quote: "In CA3, 23% of the cells were object tuned (72/313 cells; 7 object cells and 58 object vector
    cells)"
  expected:
    quantity: fraction of CA3 cells object-tuned
    value: 0.23
    tolerance: 0.023
  criterion: Template matching as for CA1 (opening comment), on the CA3 cells. Reproduced when, under
    one template-width reading, the fraction is within tolerance.
- id: fig2d-spatial-change-no-o
  statement: Introducing the object changed spatial firing more than the passage of time did, with
    lower NO-O rate-map correlations than CON1-CON2 correlations in control sessions.
  source: Results, The majority of hippocampal cells change spatial firing patterns, paragraph 1;
    Figure 2D, top left
  quote: "introducing the object led to larger changes in spatial firing patterns (i.e., smaller
    Pearson correlations of rate maps) than in pairs of control trials with no object"
  statistics:
  - test: Wilcoxon rank-sum test
    statistic: z = 12.17
    p: 4.75e-34
    n: 1,189 CA1 cells against 219 control CA1 cells
  criterion: Spatial correlation as in the opening comment. Reproduced when the NO-O correlations are
    lower than the CON1-CON2 correlations (lower median) with a two-sided rank-sum p < 0.05.
- id: fig2d-rate-overlap-no-o-unchanged
  statement: The overall rate change between NO and O, measured by rate overlap, did not differ from
    that between control trials.
  source: Results, The majority of hippocampal cells change spatial firing patterns, paragraph 1;
    Figure 2D, top right
  quote: "the overall rate change, estimated as the mean firing rate in the less active trial divided
    by mean firing rate in the more active trial (rate overlap), was not different between trial pairs
    with objects (NO-O) and control trials (CON1-CON2)"
  statistics:
  - test: Wilcoxon rank-sum test
    statistic: z = 0.57
    p: 0.57
    n: 1,189 CA1 cells against 219 control CA1 cells
  criterion: A claim of absence, judged on the paper's test, a two-sided Wilcoxon rank-sum test of NO-O
    against CON1-CON2 rate overlaps at alpha 0.05. Reproduced when p >= 0.05, not reproduced when
    p < 0.05; the difference in medians is given either way, under both rate-overlap readings of the
    opening comment.
- id: fig2-fraction-changed-no-o
  statement: About two thirds of CA1 cells (67.5%, 803 of 1,189) changed their spatial firing, their
    rate, or both between NO and O.
  source: Results, The majority of hippocampal cells change spatial firing patterns, paragraph 1
  quote: "we estimated that 67.5% of the cells (n = 803/1,189 cells) expressed either spatial change,
    rate change, or both between NO and O"
  expected:
    quantity: fraction of CA1 cells changing between NO and O
    value: 0.675
    tolerance: 0.0675
  criterion: The Methods' classification (Spatial correlation and rate overlap). Within-trial
    distributions from the NO trial, split 500 times at random into two groups of 1 s bins; between-
    trial distributions from a random half of each trial's 1 s bins, 500 times. A cell changes on a
    measure when the mean between-trial value is below the 1st percentile of the within-trial
    distribution and a Wilcoxon signed-rank test of the two distributions gives p < 0.05 (alpha from
    Methods, Statistical tests; the 500 values are paired by repetition, as the signed-rank test needs
    pairs and the paper does not say how they are paired). A cell counts when it changes on spatial
    correlation, rate overlap or both. Reproduced when the fraction is within tolerance.
- id: fig2d-o-om-change
  statement: Moving the object also changed spatial firing and rate more than in control trials, and
