    p: 5.87e-40
  - about: rate overlap, O-OM against CON2-CON3
    test: Wilcoxon rank-sum test
    statistic: z = 3.43
    p: 0.001
  expected:
    quantity: fraction of CA1 cells changing between O and OM
    value: 0.697
    tolerance: 0.0697
  criterion: As fig2d-spatial-change-no-o and fig2-fraction-changed-no-o, for O-OM against CON2-CON3.
