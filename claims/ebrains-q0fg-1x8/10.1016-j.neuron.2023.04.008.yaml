- id: figs3f-ca3-changes
  statement: In CA3 too, spatial correlations between trials differed between object and control
    sessions for every trial pair, while rate overlaps did not.
  source: Supplementary Figure 3F
  quote: "As for CA1, we found that spatial correlation values between pairs of trials was always
