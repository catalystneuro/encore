- id: fig7a-cf-matches-bf
  statement: Characteristic frequency from the CF recordings correlates strongly with best
    frequency from the BF recordings, with no systematic deviation towards higher or lower
    frequencies.
  source: Technical Validation, Sampling across best frequency for the different recording
    types, paragraph 1; Figure 7a
  quote: these figures confirm that the characteristic frequency derived from the CF recordings
