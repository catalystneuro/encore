# Claims for Heeringa (2024), Scientific Data 11, 411, on dandiset 001262.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-22,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record (open access, PMC11035566), as served by Europe PMC, in
# paper/10.1038-s41597-024-03259-3.txt: Background & Summary, Methods, Data Records, Technical
# Validation, Usage Notes, Code availability, Table 1 and the figure legends. The paper is a
# Data Descriptor and has no supplement. The PDF was not needed.
#
# Code read: the software toolbox the paper links, Zenodo record 10370064
# (doi:10.5281/zenodo.10370064, the only version, published 2024-04-15), 21 MATLAB files:
# check_dataset_metadata.m (Table 1, Fig. 3, metadata.csv), check_dataset_units.m (all panels
# of Figs. 6 and 7), check_dataset_animal.m, checkAN.m (Fig. 4), makePSTH.m (Fig. 5b),
# call_extract_func.m and the analysis functions BFextract_func.m, RLFextract_func.m,
# getDrivenRatesRLF.m, PHextract_func.m, TytoView_calcVS.m, CFextract_func.m, getQ10dB.m,
# Clickextract_func.m, getFSL2bins.m, getFSLpoisson.m, SRextract_func.m, getSpikeCounts.m,
# and bandwidthBF.m, getQ10dB_withCF.m, getRasterData3.m, which no criterion uses.
# Details the code settles, used in the criteria below:
#   - Age groups (both scripts): young adult age <= 365 days, middle aged > 365 and <= 1095
#     days, old > 1095 days; months are days / (365/12). Table 1 statistics are over animals.
#   - Unit outcomes are the analysed values stored with the data (exp.data.[type].analysis):
#     BF from BF.analysis.bf, threshold from RLF.analysis.threshold, CF from CF.analysis.cf.
#     The Figs. 6 and 7 scripts read these stored values; they do not recompute them.
#   - Spontaneous rate, best estimate: the SR recording, else PH, else RLF, else BF
#     (check_dataset_units.m), as the Methods advise. Low-SR is SR < 18 spikes/s.
#   - Maximum vector strength (Fig. 6d): the largest PH.analysis.vs over levels whose
#     PH.analysis.prob is not NaN and < 0.001.
#   - Click latency (Fig. 7b): CLICK.analysis.latency_2bins, only for units with exactly one
#     CLICK recording.
#   - Fig. 6b histogram: 24 logarithmic bins from 200 Hz to 20 kHz (edges
#     logspace(log10(200), log10(20000), 25)), young adults with a BF recording.
#   - Fig. 6a moving average: mean RLF threshold in 24 logarithmic BF bins from 0.3 to 20 kHz
#     (bin includes its upper edge), each plotted at the bin's upper edge.
#   - Within-trial inter-spike intervals for the 0.6 ms check (checkAN.m).
#
# Data the paper used: 104 Mongolian gerbils of either sex (60 young adult, 13 middle aged,
# 31 old), 1160 single auditory nerve fibres (759, 87 and 314). Per animal: age, sex, weight,
# ABR threshold to chirps, anaesthesia (oxygen), sound system. Per fibre, recordings of any
# of these types: BF (frequency-response curve), RLF (rate-level function at BF), CF
# (frequency by level response area), PH (tones at BF with many repetitions, vector
# strength), CLICK, SR (silence), and complex stimuli NOISE, SPS (Schroeder phase) and CVC
# (logatomes). Each holds spike times per trial, raw voltage traces, stimulus settings and the
# analysed outcomes. The paper deposited the data on Dryad (doi:10.5061/dryad.qv9s4mwn4) as
# MATLAB files, one per animal; dandiset 001262 says it holds the same recordings as NWB files,
# one per single unit, and lists the Dryad deposit as a variant form. All claims use the
# dataset (data: dataset).
#
# Not claimed: "Phase locking did not change in the aged animals" cites an earlier study
# (ref. 17) and its test is not in this paper; the outcomes of refs. 14, 15, 17 to 20 are
# not findings of this paper.
