- id: isi-exclusion
  statement: Units with multiple inter-spike intervals below 0.6 ms, the absolute
    refractoriness of auditory nerve fibres, were excluded from the dataset.
  source: Technical Validation, Verification of single-unit recording and specificity to the
    auditory nerve bundle, paragraph 1; Figure 4b
  quote: Units with multiple inter-spike intervals <0.6 ms, which is the absolute refractoriness
    of auditory nerve fibres ... were excluded from the dataset
  criterion: Inter-spike intervals are taken within trials, between successive spike times of
    a trial, as checkAN.m does. The paper does not say over which recordings a unit's ISIs are
    counted, nor fix "multiple"; the readings are (a) any single recording of the unit with two
    or more ISIs < 0.6 ms, (b) two or more ISIs < 0.6 ms pooled over all the unit's recordings,
    (c) as (a) for the BF recording only, the one shown in Fig. 4. checkAN.m counts the ISIs
    < 0.6 ms of one recording, which is closest to (a) and (c). These readings concern a method
    detail, so the outcome is the one they all give - reproduced when no unit fails under any
    of them, not reproduced when units fail under all of them, otherwise blocked as
    methods_underspecified. The number of failing units under each reading and the
    distribution of their counts of short ISIs are reported.
