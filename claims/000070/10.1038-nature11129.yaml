# Claims for Churchland, Cunningham, Kaufman, Foster, Nuyujukian, Ryu & Shenoy (2012) on
# dandiset 000070.
# Source: the NIH author manuscript in PubMed Central (PMC3393826), full text, read from its
# Results, Methods and figure legends, and the Supplementary Information PDF from the
# publisher's site. Values marked "read from the figure" are readings of Figure 6, which the
# text does not give in numbers.
#
# When these criteria were written, the author had seen the data check only: the file list,
# metadata, trial tables, unit counts and firing rates, trial counts per condition after the
# Methods' selection, hand speed around movement onset, and the faults of the files (the
# wrapped first entry of spike_times_index, and the clock resets of the 2010 file). No jPCA
# or other claim analysis had been run on any file.
#
# The dandiset holds the paper's two array datasets, J-array (sub-Jenkins ses-20090918) and
# N-array (sub-Nitschke ses-20100923), each with 108 maze conditions. It does not hold the
# seven single-electrode datasets (monkeys A, B, J1 to J4 and N), the EMG, the leech or the
# walking-monkey data. It also holds eight further array sessions the paper does not use,
# one of which (sub-Nitschke ses-20090910, 108 conditions) is consistent with the
# "N-9-10-2010" dataset of Supplementary Figure 5 (see the notebook).
#
# Method choices fixed here, from the Methods and the jPCA codepack (Python port
# bantin/jPCA at commit 3f8be9f) where the Methods are silent: successful, consistent trials
# (`correct_reach`) with delay above 400 ms, conditions 1 to 108; condition-averaged rates
# aligned on movement onset, Gaussian of 20 ms SD; soft normalisation by range + 5 spikes/s;
# cross-condition mean subtracted; PCA and jPCA on -50 to +150 ms from movement onset every
# 10 ms; 6 PCs; derivative as the difference of adjacent samples; R2 of the fits as one minus
# residual over total sum of squares of the derivative. Each claim is judged on the units the
# dandiset holds (192 per session; see array-dataset-composition). Variants (24 ms smoothing,
# other windows, all successful trials, 10 PCs) are shown but do not decide outcomes.
# Quotes added 2026-10-19 from the full text (Europe PMC PMC3393826) and the Supplementary
# Information PDF from nature.com; the paper reports no test or interval for these claims'
# findings, so no statistics were added.
schema_version: 1
dandiset: "000070"
paper: doi:10.1038/nature11129
claims:
- id: array-dataset-composition
  statement: The two array datasets, monkey J-array recorded 2009-09-18 and monkey N-array
    recorded 2010-09-23, each present 108 reach conditions and comprise 146 and 218 isolations
    (a mix of single and multi-unit isolations).
  source: Methods, Recordings and task design, paragraphs 2 and 3; Figure 3e and 3f legend
  quote: For the monkey J-array and N-array datasets, 108 conditions were presented in the same
    recording session ... These array-based datasets involved, respectively, 146 and 218 single
    isolations (each a mix of single and multi-unit isolations)
  expected:
  - quantity: J-array conditions
    value: 108
    tolerance: 0
  - quantity: N-array conditions
    value: 108
    tolerance: 0
  - quantity: J-array isolations
    value: 146
    tolerance: 14.6
  - quantity: N-array isolations
    value: 218
    tolerance: 21.8
  criterion: Conditions are the distinct maze_condition values above 0 among the trials the
    Methods select; isolations are the rows of the Units table. Reproduced when both sessions
    are in the dandiset with all four values within tolerance; partially reproduced when the
    sessions and condition counts match but a unit count does not; not reproduced otherwise.
- id: fig3ef-same-direction
  statement: In the first jPCA plane the neural state rotates in the same direction for all
    conditions of the J-array and N-array datasets, including reaches in opposite directions.
  source: Results, Quasi-rhythmic responses during reaching, paragraph 4; Figure 3e and 3f
  quote: Second, the neural state rotates in the same direction across conditions (different traces)
    ... Yet for each dataset the neural state rotates in the same direction across conditions
  criterion: For each condition, the net change of the polar angle of its state in the
    oriented jPC plane from -50 to +150 ms. Reproduced when at least 90% of the 108
    conditions rotate counter-clockwise (positive) in each dataset; partially reproduced when
    at least 75% do in each, or 90% in one only; not reproduced otherwise. The values under
    the shuffle controls of suppfig3-shuffle-controls are shown as reference.
- id: fig3-independent-of-curvature
  statement: The rotations do not relate directly to reach curvature; the neural state rotates
    the same way for clockwise-curving, counter-clockwise-curving and straight reaches.
  source: Results, Quasi-rhythmic responses during reaching, paragraph 4; Figure 3e and 3f
  quote: Finally, state-space rotations do not relate directly to reach curvature ... Yet for each
    dataset the neural state rotates in the same direction across conditions
  criterion: Each condition's reach is classed by the net change of heading of its mean hand
    path from movement onset to the end of the window (+500 ms) as clockwise (below -20
    degrees), counter-clockwise (above +20 degrees) or straight. Reproduced when, in each
    dataset, at least 90% of the conditions in each class with at least five conditions rotate
    counter-clockwise in the jPC plane; partially reproduced when this holds for every class
    at 75%; not reproduced otherwise. A logistic fit of rotation direction on curvature is
    reported as well.
  depends_on:
  - fig3ef-same-direction
- id: fig3-phase-from-prep-state
  statement: The rotation phase follows from the preparatory state; knowing the initial state
    in the jPC plane, the subsequent states are reasonably predictable.
  source: Results, Quasi-rhythmic responses during reaching, paragraphs 4 and 5; Figure 3
  quote: Third, the rotation phase follows naturally from the preparatory state ... If one knows the
    initial population-level preparatory state (fig. 3, circles) subsequent states are reasonably
    predictable
  criterion: Writing each condition's state in the plane as a complex number, the state at
    +150 ms is predicted from the state at -50 ms by one complex gain (a rotation and a
    scaling) shared by all conditions, fitted leaving one condition out. Reproduced when the
    cross-validated R2 is at least 0.5 in each dataset and above the median R2 of shuffle 3
    of suppfig3-shuffle-controls (which keeps preparatory states and reassigns the movement
    activity); partially reproduced when this holds in one dataset; not reproduced otherwise.
- id: var-captured-jpc-plane
  statement: The first jPCA plane captures an average of 28% of the total data variance
    (typically 20 to 35%).
  source: Results, Controls regarding rotational structure, paragraph 1; Supplementary Figure 5
    legend
  quote: Those projections captured an average of 28% of the total data variance ... This was
    typically 20-35%
  expected:
  - quantity: Variance captured by the first jPCA plane, mean of the datasets
    value: 28
    tolerance: 2.8
    unit: percent
  criterion: The paper's average is over nine datasets, of which the dandiset holds two. The
    readings are (a) the mean of J-array and N-array within 28 +- 2.8%, (b) each of the two
    within the stated typical range 20 to 35%, widened by 10% of each bound to 18 to 38.5%.
    Reproduced when (a) or (b) holds.
- id: pc23-variance
  statement: The plane of PC2 and PC3 captures 29% of the total variance on average, about as
    much as the first jPCA plane, so the jPCA plane captures patterns already present in the top
    PCs.
  source: Results, Controls regarding rotational structure, paragraph 2
  quote: As a comparison, the dimensions defined by PC2 and PC3 (which by definition capture the
    second- and third-most data variance possible) together capture 29% of the total variance. Thus,
    the jPCA projection simply captures response patterns that were always present in the top PCs
  expected:
  - quantity: Variance captured by PC2 and PC3 together, mean of the datasets
    value: 29
    tolerance: 2.9
    unit: percent
  criterion: Readings (a) the mean of J-array and N-array within 29 +- 2.9%, (b) each dataset
    within it. Reproduced when (a) or (b) holds and, in each dataset, the jPCA plane captures
    at least 80% as much variance as PC2 and PC3 together; partially reproduced when only one
    of these two parts holds.
- id: suppfig4-j-array-planes
  statement: In J-array the first three jPCA planes found within the top 10 PCs capture 22%,
    19% and 12% of the variance (54% together), against 64% for the top six PCs, and each
    plane holds rotations coherent across conditions.
  source: Supplementary Figure 4
  quote: All three planes contained rotational structure that was coherent (in the same direction
    and at a similar angular velocity) across conditions ... The top three jPCA planes (spanning six
    dimensions) captured 60% (monkey B) and 54% ... the top six PCs ... captured 72% and 64% of the
    variance
  expected:
  - quantity: J-array jPCA plane 1 variance (10 PCs)
    value: 22
    tolerance: 2.2
    unit: percent
  - quantity: J-array jPCA plane 2 variance
    value: 19
    tolerance: 1.9
    unit: percent
  - quantity: J-array jPCA plane 3 variance
    value: 12
    tolerance: 1.2
    unit: percent
  - quantity: J-array three planes together
    value: 54
    tolerance: 5.4
    unit: percent
  - quantity: J-array top six PCs
    value: 64
    tolerance: 6.4
    unit: percent
  criterion: Reproduced when all five values are within tolerance and at least 75% of the
    conditions rotate in the plane's direction in each of the three planes; partially
    reproduced when the three-plane total and the top-six-PC value are within tolerance;
    not reproduced otherwise.
- id: suppfig4-planes-range
  statement: Every dataset contains two, and usually three, planes with rotations, together
    capturing 50 to 70% of the variance.
  source: Supplementary Figure 4 legend; Results, Controls regarding rotational structure,
    paragraph 2
  quote: Together these captured 50–70% of the total data variance ... all datasets contained two,
    and usually three, planes that captured rotations
  criterion: jPCA on the top 10 PCs of J-array and N-array. Reproduced when in each dataset the
    first three planes together capture 45 to 77% (the stated range widened by 10% of each
    bound) and at least the first two planes have 75% or more of the conditions rotating in
    the plane's direction; partially reproduced when this holds in one dataset; not
    reproduced otherwise.
- id: fig6a-angle-peak
  statement: The distribution of the angle between the neural state and its derivative in the
    first jPCA plane, over all conditions and times, peaks near pi/2 (rotation), not near 0.
  source: Figure 6a
  quote: The neural data and the generator model have distributions with peaks near π/2
  criterion: Peak of a 36-bin histogram over -pi to pi. The figure shows the peaks of the nine
    neural datasets between about 0.35 pi and 0.6 pi (read from the figure), against 0 to 0.3 pi
    for the kinematic models and EMG. Reproduced when the peak lies between 0.3 pi and 0.7 pi in
    each dataset; partially reproduced in one; not reproduced otherwise.
- id: fig6b-skew-fit
  statement: For the neural data the rotational (skew-symmetric) dynamics matrix fits the data
    nearly as well as the best unconstrained linear dynamics matrix, both in the 6-D space and
    in the first jPCA plane.
  source: Results, Population-level quantification, paragraph 2; Figure 6b
  quote: For the neural data and generator model, the fit provided by Mskew was nearly as good as
    the fit provided by the best unconstrained M (fig. 6b) ... Results were similar whether we
    considered all six dimensions or just the plane with the strongest rotations
  criterion: The ratio R2(M_skew) / R2(M). Figure 6b shows the nine neural datasets at about
    0.75 to 0.9 in 6-D and about 0.8 to 0.97 for the best plane, and the kinematic models at
    or below about 0.45 (6-D) and 0.75 (plane) (read from the figure). Reproduced when the 6-D
    ratio is at least 0.7 and the plane ratio at least 0.75 in each dataset; partially
    reproduced when both hold in one dataset, or one of the two holds in both; not reproduced
    otherwise.
- id: rotation-frequency
  statement: The rotations are brief and fast, up to about 2.5 Hz; the largest eigenvalues of
    M_skew in the monkey A and B datasets are 8.8 to 13.5 radians/s.
  source: Results, Quasi-rhythmic responses during reaching, paragraph 5, and Population-level
    quantification, paragraph 3
  quote: Their brevity and high frequency (up to ~2.5 Hz) makes them easy to miss ... the largest
    eigenvalues of Mskew were actually slightly smaller for fast reaches (8.8 versus 9.8 radians/s
    for monkey A, 12.2 versus 13.5 radians/s for monkey B)
  expected:
  - quantity: Frequency of the first jPCA plane, upper bound
    value: 2.5
    tolerance: 0.25
    unit: Hz
  criterion: Frequency is the magnitude of the largest eigenvalue of M_skew (radians/s) over
    2 pi. Reproduced when it lies within 1.26 to 2.75 Hz in each dataset (the range of the
    reported eigenvalues, 1.40 to 2.15 Hz, and the stated maximum of 2.5 Hz, widened by 10% of
    the bounds); partially reproduced when in one; not reproduced otherwise.
- id: suppfig3-shuffle-controls
  statement: Three shuffle controls that keep preparatory activity and invert or reassign the
    peri-movement activity largely remove the rotational structure found by jPCA, so jPCA does
    not find rotations that are not there.
  source: Supplementary Figures 2 and 3; Results, Controls regarding rotational structure,
    paragraph 1
  quote: Multiple ‘shuffle’ controls demonstrate that jPCA does not find rotational structure when
    such structure is not present ... largely lost following shuffling
  criterion: The dividing point is 50 ms after the go cue, taken per dataset as the median
    go-cue time relative to movement onset plus 50 ms. Shuffle 1 (half the conditions inverted
    per unit) and 3 (movement activity reassigned) are run 20 times with fixed seeds, shuffle 2
    once. Rotation strength is R2(M_skew) in 6-D. Reproduced when, in each dataset and for each
    shuffle, every run is below the original and the median is at most 75% of it; partially
    reproduced when this holds for at least two shuffles in each dataset or all three in one;
    not reproduced otherwise. The fraction of conditions rotating counter-clockwise and the
    R2 ratio are shown as well.
- id: suppfig5-areas-variance
  statement: Analysed separately, the PMd and M1 arrays each show clear rotations; the jPCA
    plane captures 29% (PMd) and 29% (M1) in J-array and 32% and 28% in N-array.
  source: Supplementary Figure 5
  quote: Both PMd and M1 exhibited clear rotations of the neural state
  expected:
  - quantity: J-array PMd variance captured
    value: 29
    tolerance: 2.9
    unit: percent
  - quantity: J-array M1 variance captured
    value: 29
    tolerance: 2.9
    unit: percent
  - quantity: N-array PMd variance captured
    value: 32
    tolerance: 3.2
    unit: percent
  - quantity: N-array M1 variance captured
    value: 28
    tolerance: 2.8
    unit: percent
  criterion: Units split by the electrode group of their array (PMd group 1, M1 group 2).
    Reproduced when all four values are within tolerance and at least 75% of conditions
    rotate counter-clockwise in each; partially reproduced when all four lie in the stated
    typical range widened to 18 to 38.5% with 75% rotating; not reproduced otherwise. The
    sub-Nitschke ses-20090910 session is shown against the N-9-10-2010 values (26% and 24%)
    as a variant.
- id: suppfig5-m1-faster
  statement: The angular velocity of the rotations is slightly higher for M1 than for PMd in
    each dataset.
  source: Supplementary Figure 5 legend
  quote: Second, the angular velocity of the rotations was in each case slightly higher for M1
  criterion: Frequency of the first jPCA plane (largest eigenvalue of M_skew) per array.
    Reproduced when M1 is higher than PMd in both J-array and N-array; partially reproduced
    in one; not reproduced in neither. The sub-Nitschke ses-20090910 session is a variant.
- id: fig6-velocity-model
  statement: A simulated population of units tuned to hand velocity and speed, with
    preparatory activity tuned to reach endpoint, matched to the recorded data, shows no
    robust or consistent rotations; M_skew fits it poorly and its angle distribution peaks
    slightly above zero.
  source: Results, Rotations, kinematics and EMG, paragraph 1; Results, Population-level
    quantification, paragraphs 1 and 2; Figure 4d and 4h; Figure 6a and 6b
  quote: For velocity-model populations, jPCA found no robust or consistent rotations (fig. 4a,d,h)
    ... the velocity-tuned model, the complex-kinematic model, and EMG all had distributions that
    peaked slightly above zero ... For the velocity-tuned and complex kinematic models, Mskew
    performed poorly
  criterion: One simulated dataset per array dataset from that session's condition-mean hand
    kinematics (`simulate_population`, fixed seed), analysed as the data. Reproduced when, in
    each dataset, its 6-D R2 ratio is below 0.6 and below the neural ratio and its angle peak
    is below pi/4; partially reproduced when this holds in one dataset; not reproduced
    otherwise.
- id: fig6-complex-kinematic-model
  statement: A simulated population tuned to hand position, velocity, acceleration and jerk
    (with the Methods' sensitivities) produces multiphasic responses but no consistent
    rotations; M_skew fits it poorly.
  source: Results, Rotations, kinematics and EMG, paragraph 1; Results, Population-level
    quantification, paragraph 2; Figure 4e and 4i; Figure 6a and 6b
  quote: This model produced multiphasic responses but not consistent rotations (fig. 4b,e,i) ...
    For the velocity-tuned and complex kinematic models, Mskew performed poorly
  criterion: As for fig6-velocity-model, with the complex kinematic model.
- id: fig1-leech-and-walking
  statement: The population responses of the swimming leech and of premotor cortex in a
    walking monkey rotate in the jPCA plane, as expected for rhythmic movement.
  source: Results, Rhythmic responses in different systems, paragraph 1; Figure 1a, 1b, 1d and 1e
  quote: We projected the population response onto a two-dimensional state space and found rotations
    of the neural state for both the swimming leech (fig. 1d; projection of 164 simultaneously
    recorded neurons) and the walking monkey
- id: fig2-single-neuron-responses
  statement: Single neurons recorded with single electrodes show multiphasic, quasi-oscillatory
    responses lasting about 1 to 1.5 cycles, from 469 isolations in four monkeys averaging 810
    trials per neuron.
  source: Results, Quasi-rhythmic responses during reaching, paragraphs 1 and 2; Figure 1c and
    Figure 2
  quote: We analyzed 469 single-neuron recordings from motor and premotor cortex of four monkeys
    (A,B,J,N) ... Yet there appear to be oscillations in many single-neuron responses, beginning
    just before movement onset and lasting for ~1–1.5 cycles
- id: fig3abcd-single-electrode-datasets
  statement: The rotations are seen in the seven single-electrode datasets (monkeys A, B, J1 to
    J4 and N), for example monkey B, A, J3 and N in Figure 3a to 3d.
  source: Figure 3a to 3d; Results, Quasi-rhythmic responses during reaching, paragraph 4
  quote: The resulting projections (fig. 3a-f) show four striking features. First, rotations of the
    neural state are prevalent during reaching
- id: fig4-emg-no-rotation
  statement: The recorded muscle populations (6 to 12 EMG recordings per dataset) show weak,
    inconsistent rotations, also when the neural population is down-sampled to their size.
  source: Results, Rotations, kinematics and EMG, paragraph 1; Figure 4c, 4f and 4j; Figure 6a and
    6b; Supplementary Figure 6
  quote: Although EMG is strongly multiphasic, the population of muscles did not show consistent
    rotations (fig. 4c,f,j, summary data below). This was not due to the smaller size of the muscle
    population (supplementary fig. 6)
- id: fig5-generator-model
  statement: A generator model of two rotations of fixed frequency fits deltoid EMG with
    correlations of 0.97 to 0.99, and its simulated units resemble real neurons.
  source: Results, Rotations, kinematics and EMG, paragraphs 3 and 5; Figure 5; Supplementary
    Figures 7 to 9
  quote: This ‘generator model’ provided excellent EMG fits (fig. 5b,c; supplementary fig. 7,8). The
    fit/EMG correlation ranged from 0.97–0.99 across datasets ... Simulated units displayed
    multiphasic response patterns resembling those of real neurons
- id: fig6cd-speed-independent-frequency
  statement: Rotations have similar angular velocity for instructed fast and slow reaches; the
    largest M_skew eigenvalues are 8.8 against 9.8 radians/s (monkey A) and 12.2 against 13.5
    (monkey B), with larger amplitude for fast reaches.
  source: Results, Population-level quantification, paragraph 3; Figure 6c and 6d
  quote: the neural data exhibited rotations that were of similar angular velocity for fast and slow
    reaches (fig. 6c,d) ... the largest eigenvalues of Mskew were actually slightly smaller for fast
    reaches (8.8 versus 9.8 radians/s for monkey A, 12.2 versus 13.5 radians/s for monkey B).
    Rotation amplitude, rather than frequency, differed between speeds
