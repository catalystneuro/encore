    EV without the pair minus global EV (negative is a positive contribution). A BLA cell's
    contribution is the mean over its pairs; BLA cells are split at the quartiles, the highest
    contribution quartile being the most negative. Gain (AllRippleCCGs_2.m, RippleMod_PrePost.m)
    is the cell's peri-ripple firing in 10-ms bins over -2 to +2 s around ripple peaks of
    pre-NREM, and of post-NREM, divided by the baseline rate of the same sleep epoch (NREM minus
