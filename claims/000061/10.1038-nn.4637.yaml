    statistic: t(52) = 3.45
    p: 0.0011
    corrected: Bonferroni
  - about: previous against current danger zone speed, run
    test: post hoc paired t-test
    statistic: t(51) = -6.84
    p: 9.70e-9
    corrected: Bonferroni
  - about: previous against current danger zone speed, post-run
    test: post hoc paired t-test
    statistic: t(51) = -3.10
    p: 0.00307
    corrected: Bonferroni
  - about: current danger zone speed, pre-run against post-run
    test: post hoc paired t-test
    statistic: t(53) = 5.47
    p: 1.21e-6
    corrected: Bonferroni
  depends_on:
  - rats-learn-puff-location
  criterion: The danger-zone speeds of rats-learn-puff-location. A two-way repeated-measures
    ANOVA (epoch by danger zone) over sessions with all six speeds, then paired t-tests
