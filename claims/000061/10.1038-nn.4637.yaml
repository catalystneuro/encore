# Claims for Girardeau, Inema & Buzsaki (2017), Nat. Neurosci. 20, 1634-1642, on dandiset 000061.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-20, protocol
# pilot-10 as stated in docs/protocol.md (Reader, steps 1 to 4). The reader did not look at the
# dandiset's data or files; only its archive title and description, which name this paper.
#
# Why this file was rewritten. The earlier file was written from the abstract alone (the full text
# was not open then) and its methods were fixed by an agent. Read against the full text and the
# supplement on 2026-10-20, two of its claims were tested with measures the paper does not use:
# aversive-direction-stronger (the paper compares peri-ripple reactivation strength R of a run
# correlation template, Fig. 6b, not singular-vector patterns over all sleep bins) and
# reactivation-involves-ripple-up-cells (the paper compares post-NREM minus pre-NREM pair
# correlations across nine pair groups with a one-way ANOVA, Fig. 5a, not BLA pattern weights). The
# other claims of that file also used agent-chosen methods (SVD patterns, shuffled ripple windows)
# in place of the paper's EV/REV, Poisson ripple-modulation test and reactivation strength R, and
# many findings had no claim. Every criterion is now taken from the Online Methods, the legends,
# the supplement and the paper's code. Ids are kept where the finding is the same:
# hpc-bla-reactivation-post-sleep (EV against REV, Fig. 3c), reactivation-peaks-at-ripples
# (Supplementary Fig. 11a), bla-ripple-up-subgroup (Fig. 4), reactivation-involves-ripple-up-cells
# (Fig. 5a), aversive-direction-stronger (Fig. 6b) and rats-learn-puff-location (Fig. 1b). The
# other 25 claims are new.
#
# Text read. The version of record (PDF supplied by a person, text extracted 2026-10-20), with the
# main text, figure legends, Online Methods, Life Sciences Reporting Summary, and the
# Supplementary Information PDF (41593_2017_BFnn4637_MOESM1_ESM.pdf; Supplementary Figs. 1 to 11
# and Supplementary Tables 1 and 2). Supplementary Table 1 is an image whose numbers the text
# does not carry.
#
# Code read. The code the paper links (Code availability), github.com/buzsakilab/papers, folder
# GGirardeau-BLAHpcInteractions-Package, commit cdcec89f8d1f5cf11f407f82827f9af44405c5b7: Matlab
# scripts for behavior (BehavioralMeasures, ClassifyLaps, LapType, Performance,
# AirpuffPositionDistribution), cell classification (MonoSynConvClick, CellClassifkmeans,
# FinalType), physiology (PoissonRippleMod, PoissonRippleModPercent, StatesFiringRates,
# AllRippleCCGs_2, RippleMod_PrePost, RippleRatePrePost, AirpuffRewardMod_Structures_2) and
# reactivations (ExplainedVariance_Ultimate, ExplainedVarianceMean_Ultimate,
# ExplainedVariance_PrePostCorr_Ultimate, ExplainedVariance_PooledCorr,
# ExplainedVariance_PooledCorr_Groups, ReplayInTime, ReplayInTime_LapTypes and their _All and
# _Plot scripts). They call FMAToolbox (fmatoolbox.sourceforge.net, read at
# github.com/michael-zugaro/FMAToolbox commit 6bbb3662f7ed1ccf09c5ff4b4d233e27e17c71a6 for
# SyncHist) and a poissonTest function that is not in the repository.
#
# The data the paper used. Four male Long-Evans rats (rats 1 to 4), 61 sessions, 7,390 units.
# Silicon probes in both amygdalae (two 8-shank probes, lowered 140 um after each session) and in
# dorsal CA1 (one 4-shank probe); the hippocampal probe of one rat (rat 2) failed, so
# hippocampus-BLA analyses use 3 rats (29 sessions with simultaneous BLA and hippocampus units).
# Each daily session is pre-sleep, pre-run (track, no air puff), run (training; air puff at one
# location in one running direction, location changed daily, water rewards at both ends),
# post-sleep, post-run (no air puff). Measured variables used here: sorted spike times with unit
# location (BLA, central nuclei, piriform cortex, hippocampus, from histology maps) and putative
# type (pyramidal or interneuron); the epochs; scored brain states (wake, NREM, REM); hippocampal
# ripple events (start, peak, stop); head position on the track; air puff times and locations, and
# the previous day's air puff location and direction (for the danger zones); reward times. 55
# sessions in 4 rats enter the behavioral analysis. Data were to be deposited at CRCNS; the
# dandiset is described as this paper's data.
#
# Methods shared by the criteria (each from the paper or its code, as cited):
# M1 Units. Hippocampal units are those on hippocampal CA1 shanks; BLA units those the paper's
#   histology maps place in the BLA (Online Methods, Histology; Supplementary Fig. 2). Putative
#   pyramidal cells and interneurons are the paper's types (monosynaptic identification, then
#   k-means on spike width and peak-to-trough for the rest; Online Methods, Preprocessing;
#   FinalType.m, type 1 pyramidal, type 2 interneuron). "Pyramidal pairs" means both cells
#   pyramidal.
# M2 Epochs. Pre-sleep and post-sleep are the sleep epochs before and after the run (training)
#   epoch; pre-NREM and post-NREM are the scored NREM intervals inside them; the template epoch
#   is the whole run epoch, including reward platforms (Supplementary Fig. 11a legend;
#   ExplainedVariance_Ultimate.m and ReplayInTime.m use the second run interval whole).
# M3 Binning. Spike counts in 50-ms bins (Online Methods), spikes after the end of the last run
#   epoch dropped (ReplayInTime.m).
# M4 EV and REV. For each hippocampus-BLA pair, the Pearson correlation of binned counts in the
#   pre-NREM bins, the run bins and the post-NREM bins; the three pair-correlation matrices are
#   correlated with one another over pairs, pairs with an undefined correlation left out
#   (corrcoef with 'rows','complete'), giving r(run,post), r(run,pre), r(pre,post).
#   EV = ((r(run,post) - r(run,pre) r(pre,post)) / sqrt((1 - r(run,pre)^2)(1 - r(pre,post)^2)))^2,
#   REV the same with pre and post swapped (Online Methods; ExplainedVariance_Ultimate.m). Shown
#   as percent. A session enters when it has at least 6 hippocampal and 6 BLA cells of the cell
#   type used (Online Methods says "a minimum of 1 shank and 6 cells in each structure";
#   ExplainedVarianceMean_Ultimate.m tests more than 5 cells in each structure).
#   For REM, sessions need more than 3 min (180 s) of REM in both pre- and post-sleep.
# M5 Ripples. The paper's ripple events (detection in Online Methods), kept when inside NREM.
# M6 Ripple modulation of a unit (Online Methods; PoissonRippleMod.m; ExplainedVariance_Ultimate.m).
#   Over all NREM of the session: baseline is NREM minus every ripple widened by 100 ms on each
#   side; the unit's spike count inside ripples (start to stop) is compared with a Poisson
#   distribution of mean (baseline rate x total ripple time). Upmodulated when the upper tail
#   probability is below 0.0005, downmodulated when the lower tail probability is below 0.0005
#   (the code's 0.001/2, the Methods' "P < 0.001"); units with no spike in ripples or in baseline
#   are untested. Otherwise not modulated.
# M7 Reactivation strength R (Online Methods; Supplementary Fig. 10; ReplayInTime.m,
#   ReplayInTime_LapTypes.m). Binned counts of the pyramidal cells (or all cells, where stated)
#   are z-scored per cell within the template bins, and within the NREM bins of each sleep epoch.
#   Template C = Z_hpc' Z_bla / nBins over the template bins. R(t) = z_hpc(t) C z_bla(t)' for each
#   NREM bin t of pre- and post-sleep; R is z-scored over the NREM bins of each epoch. Around each
#   ripple peak of that epoch's NREM, R is averaged in 100 bins of 40 ms over -2 to +2 s
#   (FMAToolbox SyncHist, mode mean, its default 100 bins) with Gaussian smoothing of SD 2 bins
#   ('smooth', 2), giving one peri-ripple curve per session and epoch. The ripple-peak value of a
#   session is the mean of that curve over bin centres strictly between -0.25 and +0.25 s (12
#   bins; ReplayInTime_All.m). A session enters with at least 6 hippocampal and 6 BLA cells of
#   the type used (ReplayInTime_All.m, ReplayInTime_LapTypes_All.m).
# M8 Air puff and safe laps (ClassifyLaps.m, LapType.m). In the run epoch, laps are the intervals
#   during which position stays inside a 150-cm window of the track; a lap goes left to right or
#   right to left when its end lies more than 10 cm from its start in that direction. Air puff
#   laps are those in the air puff direction of the day, safe laps the others.
#
# Details the paper and its code leave open, with the readings the text allows (each criterion
# that uses one says so; the notebook runs every reading):
# O1 The 150-cm lap window of M8 starts at a left limit picked by hand on a plot (ClassifyLaps.m).
#   Readings (a) lap intervals the dataset holds, if any; (b) the M8 rule with the window's left
#   edge at the smallest run-epoch position; (c) laps as the intervals between consecutive
#   rewards at opposite ends of the track.
# O2 poissonTest (M6) is not in the repository. Readings (a) upper tail P(X >= n) and lower tail
#   P(X <= n); (b) upper tail P(X > n) and lower tail P(X < n).
# O3 Bin time stamps (bin start or centre) when aligning R to ripple peaks. A standard choice (bin
#   centre); it cannot change an outcome at 40-ms resolution.
# O4 Fig. 2c uses monosynaptically identified pyramidal cells and interneurons (675 and 175). If
#   the dataset does not mark which cells were identified monosynaptically, the readings are
#   (a) the identified cells where marked; (b) all putative cells of each type.
# O5 The family size of the Bonferroni corrections in Fig. 1b is not given. Readings (a) all post
#   hoc tests of the panel (four for speeds, three for ratios); (b) uncorrected 0.05.
# O6 The post hoc correction of Fig. 5a. The Online Methods say Bonferroni; the legend says
#   Tukey-Kramer, as the code does (multcompare default, alpha 0.01). Main reading Bonferroni
#   (Methods first, protocol step 2), variant Tukey-Kramer.
# O7 How the BLA firing rate of safe and air puff trajectories is taken is not in the text or the
#   code read. Readings (a) spike count over time on safe laps and on air puff laps of the run;
#   (b) the mean of the cell's position firing-rate curve on each lap type.
