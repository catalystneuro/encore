- id: rats-learn-puff-location
  statement: Rats learned the daily location of the air puff. The speed ratio between the previous
    and the current danger zone rises from pre-run to run and post-run, reversing between pre-run
    and post-run.
  source: Results, Rats learn the daily location of an aversive air puff on a linear track,
    paragraph 1; Figure 1b, right; Supplementary Fig. 1b
  quote: Therefore, the systematic reversal in the speed ratio (previous/current danger zone)
    between pre- and ... post-run indicates learning of the new air puff location (Fig. 1b and
    Supplementary Fig. 1b).
  statistics:
  - about: speed ratio over pre-run, run and post-run
    test: one-way repeated measure ANOVA
    statistic: F = 40.48, d.f. = 2
    p: 1.31e-13
    n: 55 sessions in 4 animals
  - about: speed ratio, pre-run against run
    test: post hoc t-test
    statistic: t(51) = -8.49
    p: 2.5e-11
    corrected: Bonferroni (on the significance thresholds; the P shown is uncorrected)
  - about: speed ratio, pre-run against post-run
    test: post hoc t-test
    statistic: t(51) = -5.08
    p: 5.3e-6
    corrected: Bonferroni (on the significance thresholds; the P shown is uncorrected)
  - about: speed ratio, run against post-run
    test: post hoc t-test
    statistic: t(50) = 4.43
    p: 5.1e-5
    corrected: Bonferroni (on the significance thresholds; the P shown is uncorrected)
  criterion: Per session and run epoch (pre-run, run, post-run), the mean speed in the current
    danger zone (the 20 cm before the day's air puff location, on laps of the day's air puff
    direction) and in the previous danger zone (the 20 cm before the previous day's location, on
    laps of the previous day's direction); speed from positions smoothed over 5 samples
    (LinearVelocity(pos,5)); ratio = (previous - current)/(previous + current) (Online Methods;
    BehavioralMeasures.m). Laps per M8 under each reading of O1. Sessions with all three ratios
    defined enter (the first session of a rat has no previous day). A one-way repeated-measures
    ANOVA over the three epochs, then paired t-tests (BehavioralMeasures_Stats.m). Reproduced
    when the ANOVA has p < 0.05 and the post-run ratio exceeds the pre-run ratio by paired t-test
    at p < 0.05/3 (O5 reading a) or p < 0.05 (reading b); the run against pre-run and run against
    post-run tests are reported.
- id: each-rat-learns-puff-location
  statement: The speed ratio changes across pre-run, run and post-run in each of the four rats
    taken alone, indicating that every rat learned the new air puff location.
  source: Supplementary Fig. 1b legend
  quote: The reversal of ratio between pre and post RUN indicates that all animals learned the new
    location during RUN and remembered it during post-RUN
  statistics:
  - about: speed ratio over pre-run, run and post-run, rat 1
    test: one-way repeated measure ANOVA
    statistic: F = 13.26, d.f. = 2
    p: 0.000214
    n: 11 sessions
  - about: the same, rat 2
    test: one-way repeated measure ANOVA
    statistic: F = 7.02, d.f. = 2
    p: 0.00556
    n: 10 sessions
  - about: the same, rat 3
    test: one-way repeated measure ANOVA
    statistic: F = 27.41, d.f. = 2
    p: 3.9469e-7
    n: 14 sessions
  - about: the same, rat 4
    test: one-way repeated measure ANOVA
    statistic: F = 4.36, d.f. = 2
    p: 0.021754
    n: 16 sessions
  depends_on:
  - rats-learn-puff-location
  criterion: The per-session speed ratios of rats-learn-puff-location (each O1 reading), split by
    rat. Per rat, a one-way repeated-measures ANOVA over the three epochs (Supplementary Fig. 1b
    legend). Reproduced when every rat has p < 0.05; partially reproduced when three of the four
    rats do. The legend's
    Bonferroni-corrected post hoc tests are shown but give no P values to match.
