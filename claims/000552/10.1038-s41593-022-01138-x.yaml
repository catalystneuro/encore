# Claims for Huszar, Zhang, Blockus & Buzsaki (2022) on dandiset 000552.
# Source: the author manuscript in PubMed Central (PMC10807234), full text, read from its
# Results, Methods, figure legends and Extended Data legends. Supplementary Tables 1 to 5 are not
# in the manuscript text and were not read. The version of record is not open access.
#
# When these criteria were written, the author had seen the data check only: the file list and
# metadata of the archive, the contents of every kind of file, per file the number of units,
# sleep states and ripples, the trials table and position segments, the session length (end of
# the last sleep-state or ripple interval; shortest 113.7 min, longest 494.2 min), per-file
# median ripple durations (29.6 to 42.4 ms, all durations from 20 to 199.2 ms), the number of
# trials per visited arm in each file, the total number of units (8,201 in 65 files) and the
# distribution of unit mean firing rates (87.8% at or below 5 Hz), and, on three files, that
# spatial information of the units peaks at zero time shift between spikes and position. No
# claim's analysis (population vectors, ratemap correlations, spatial information or firing
# rates on familiar and novel mazes) had been run. The author had also read the paper's code at
# https://github.com/rhuszar/optotagCA1_final (commit 51320d4) and the summary values in its
# result files.
#
# The dandiset holds spike times, sleep states, ripples and position, but no label of which
# units are light-responsive (birthdated), no optogenetic pulse times, no putative cell types and
# no waveforms. Every claim that compares same-birthdate with different-birthdate neurons, or
# light-responsive neurons across birthdates, is blocked. The claims tested here are the
# descriptions of the dataset and the findings that use all pyramidal neurons.
#
# Method choices fixed here, from the Methods where they say, from the paper's code where they
# do not (see huszar.py), and otherwise common choices: putative pyramidal cells are units whose
# session mean rate is at most 5 Hz; speed is the derivative of linearized position smoothed with
# a 0.2 s Gaussian; rate maps in 1 cm bins at speed above 1.5 cm/s, smoothed 9 cm FWHM, left and
# right trials apart; the familiar figure-eight is the first maze recording of a session; the
# "theta-related" firing rate is the rate while running at 5 cm/s or faster inside maze trials.
# Quotes and statistics added 2026-10-19 from the full text (author manuscript, NCBI PMC10807234).
schema_version: 1
dandiset: "000552"
paper: doi:10.1038/s41593-022-01138-x
claims:
- id: cohort-birthdates
  statement: Chronic recordings were made from 17 adult mice (12 males, 5 females) electroporated
    at E13.5 (n = 4), E14.5 (n = 3), E15.5 (n = 6) and E16.5 (n = 4).
  source: Results, In vivo recordings from birthdated CA1 pyramidal neurons, paragraph 1; Methods,
    Implantation and recording, paragraph 1
  quote: "Chronic recordings were performed from n = 17 freely moving adult mice (12 males, 5
    females; age 3–6 months; electroporated at: E13.5, n = 4; E14.5, n = 3; E15.5, n = 6; E16.5, n =
    4)"
  expected:
  - quantity: mice
    value: 17
    tolerance: 0
  - quantity: males
    value: 12
    tolerance: 0
  - quantity: females
    value: 5
    tolerance: 0
  criterion: Mice are the distinct subject ids of the dandiset; sex from the files' subject
    metadata; birthdate from the subject id prefix (e13 is E13.5), the only place the files hold
    it. Reproduced when the counts of mice, of each sex and of each birthdate all match exactly
    (counts of animals carry no measurement error, so the tolerance is zero). Not reproduced
    otherwise.
- id: sessions-durations
  statement: The recordings comprise 92 sessions lasting 113.7 to 475.6 min (median 309.1 min),
    each including a homecage period of sleep and wake.
  source: Methods, Implantation and recording, paragraph 2
  quote: All recordings (92 sessions ranging in duration from 113.7 min to 475.6 min; median
    duration = 309.1 min) included a homecage period of sleep and wake.
  expected:
  - quantity: number of sessions
    value: 92
    tolerance: 9.2
  - quantity: median session duration
    value: 309.1
    tolerance: 30.9
    unit: min
  criterion: A session is a processed (behavior+ecephys) file; its duration is the end of its
    last sleep-state or ripple interval (the files' clocks start at 0). The paper gives two
    session counts, 92 (Methods) and 96 (the per-birthdate session counts of Figure 1e, and the
    Figure 7f legend); the count is judged under either reading, within 10%. The range holds when
    every duration lies within 113.7 to 475.6 min widened by 10% of each bound (102.3 to 523.2
    min). Reproduced when the count (either reading), the median and the range all hold. Partially
    reproduced when the durations hold and the count does not. Not reproduced when the durations
    do not hold. Each session must also hold sleep states including non-REM sleep.
- id: spwr-duration
  statement: SPW-Rs were detected with duration limits of 20 to 200 ms, and their median duration
    across all recordings was 36.4 ms.
  source: Figure 2b legend; Methods, SPW-R detection
  quote: SPW-R duration limits were set to be between 20 and 200 ms. ... White dotted lines indicate
    the median duration of SPW-Rs across all recordings (36.4 ms).
  expected:
    quantity: median SPW-R duration
    value: 36.4
    tolerance: 3.64
    unit: ms
  criterion: Durations from the Ripples tables of all processed files. Readings for "median
    across all recordings", listed before the analysis; (a) the median over all ripples pooled;
    (b) the median of the per-session medians. Reproduced when the median is within tolerance
    under one reading and every ripple lies within 20 to 200 ms. Partially reproduced when only
    one of the two holds. Not reproduced when neither does.
- id: unit-count
  statement: The dataset includes 9,471 well-isolated units, 7,411 putative pyramidal cells and
    2,060 putative interneurons.
  source: Methods, Unit isolation and classification; Extended Data Figure 2a
  quote: The dataset includes a total of 7,411 well-isolated putative pyramidal cells and 2,060
    putative interneurons ... for isolated units (n = 9,471)
  expected:
  - quantity: well-isolated units
    value: 9471
    tolerance: 947
  - quantity: fraction putative pyramidal
    value: 0.7825
    tolerance: 0.078
  criterion: Units are the rows of the units tables of all processed files. The fraction of
    putative pyramidal cells uses this attempt's rule (session mean rate at most 5 Hz), as the
    files hold no cell type; it is reported as a check of the rule, and the outcome rests on the
    count. Reproduced when the count is within tolerance. Not reproduced otherwise.
- id: maze-cohort
  statement: Nine mice (E13.5 n = 2, E14.5 n = 2, E15.5 n = 2, E16.5 n = 3) ran a spatial
    alternation task on a familiar figure-eight maze, and a cohort of three mice also explored
    novel environments.
  source: Results, SBD pyramidal neurons exhibit overlapping place tuning, paragraphs 1 and 3;
    Methods, Behavior, paragraphs 1 and 2
  quote: A subset of n = 9 mice (E13.5, n = 2; E14.5, n = 2; E15.5, n = 2; E16.5, n = 3) was trained
    on a spatial alternation task in a figure-eight maze ... a subset of n = 3 mice (Supplementary
    Table 1) that underwent in utero electroporation was exposed to novel environments
  criterion: Mice with figure-eight trials and mice with a second maze recording are counted from
    the trials tables. The paper calls the novel-environment cohort separate; its code
    (ratemap_remap.m) leaves out two mice, e15_13f1 and e16_3m2, from the familiar-maze analysis,
    so the third novel mouse is also in the nine. Readings; (a) disjoint cohorts, 12 mice with
    maze data, 9 of them at the stated birthdates and 3 with novel recordings; (b) the code's
    reading, the maze mice without e15_13f1 and e16_3m2 are the nine at the stated birthdates, and
    3 mice have novel recordings. Reproduced when one reading matches exactly. Not reproduced
    otherwise.
- id: maze-task
  statement: On the figure-eight maze each trial was 205 cm long, position was tracked at 30 Hz,
    and animals ran at least ten trials along each arm in every session.
  source: Methods, Behavior, paragraph 1
  quote: The length of each trial was 205 cm. ... at a frame rate of 30 Hz ... Animals were required
    to run at least ten trials along each arm (at least twenty trials total) within each session.
  expected:
  - quantity: trial length (linearized)
    value: 205
    tolerance: 20.5
    unit: cm
  - quantity: tracking rate
    value: 30
    tolerance: 3
    unit: Hz
  criterion: Trial length is the median over familiar figure-eight trials of the largest
    linearized position inside the trial; tracking rate is 1 over the median interval of the
    position timestamps. Trials per arm are counted in every familiar figure-eight recording under
    two readings of "along each arm"; (a) the visited arm; (b) the expected arm. Reproduced when
    both values are within tolerance and every session has at least ten trials per arm under one
    reading. Partially reproduced when the values hold and every session has at least 20 trials
    but some session has fewer than ten on one arm. Not reproduced otherwise.
- id: novel-explorations
  statement: The novel-environment cohort of three mice made 16 novel environment explorations in
    six distinct environments (two linear tracks, three open fields and one figure-eight maze).
  source: Results, SBD pyramidal neurons exhibit overlapping place tuning, paragraph 3; Methods,
    Behavior, paragraph 2
  quote: "Altogether, we obtained n = 16 novel environment explorations across animals. Six distinct
    novel environments were employed: two linear tracks, three open fields and one figure-eight
    maze."
  expected:
    quantity: novel environment explorations
    value: 16
    tolerance: 1.6
  criterion: A novel exploration is a maze recording other than the first of its session, with
    trials and position. Reproduced when 3 mice and 16 (within tolerance) explorations are found.
    Partially reproduced when 3 mice are found with fewer explorations. Not reproduced otherwise.
    The kinds of environment are read from the track length and the x-y extent, and reported.
- id: fig5e-pv-decorrelation
  statement: Population firing-rate vectors at the same linearized position decorrelate between
    left and right trials once the animal leaves the common stem of the figure-eight maze
    (median correlations stem 0.93, turn 1 0.412, arm 0.372, turn 2 0.394).
  source: Figure 5e
  quote: Population firing rate vectors at linearized positions along the maze decorrelated between
    left and right trial types as soon as animals exited the common stem segment of the maze (Fig.
    5e).
  statistics:
  - test: Kruskal–Wallis
    statistic: H = 7,278.3, d.f. = 3
    p: 0
    n: 4,218, 2,109, 4,218 and 1,140 population vector pairs
  expected:
  - quantity: median PV correlation, stem
    value: 0.93
    tolerance: 0.093
  - quantity: median PV correlation, turn 1
    value: 0.412
    tolerance: 0.0412
  - quantity: median PV correlation, arm
    value: 0.372
    tolerance: 0.0372
  - quantity: median PV correlation, turn 2
    value: 0.3944
    tolerance: 0.0394
  criterion: Sessions are the familiar figure-eight recordings of the nine maze mice (all maze
    mice except e15_13f1 and e16_3m2, as in ratemap_remap.m). In each session and each 1 cm bin of
    the 205, the Pearson correlation across putative pyramidal cells of their left-trial and
    right-trial rates; bins pooled over sessions by segment (stem bins 1-74, turn 1 75-111, arm
    112-185, turn 2 186-205). Kruskal-Wallis test across the four segments. Reproduced when all
    four medians are within tolerance and the test gives p < 0.05 with the stem highest.
    Partially reproduced when the stem median exceeds each of the other three and the test gives
    p < 0.05, but a median is outside tolerance. Not reproduced otherwise.
- id: fig6c-theta-rate-preserved
  statement: Individual pyramidal neurons preserve their theta-related firing rates between the
    familiar and novel environments (Spearman rho = 0.7378, n = 2,544 neurons).
  source: Figure 6c, top
  quote: Individual pyramidal neurons preserved their theta-related firing rates across environments
  statistics:
  - test: Spearman's correlation
    statistic: ρ = 0.7378
    p: 0
    n: 2,544 neurons
  expected:
    quantity: Spearman correlation of theta-related rates, familiar and novel
    value: 0.7378
    tolerance: 0.0738
  criterion: Putative pyramidal cells of the sessions with a novel exploration; for each, the
