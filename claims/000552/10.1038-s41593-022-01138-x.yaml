    Not reproduced otherwise.
- id: fig6c-novel-ratemap-corr-higher
  statement: Pairwise spatial ratemap correlations between pyramidal neurons are higher in novel
    environments (median 0.048) than in the familiar environment (median -0.045).
  source: Figure 6c, bottom
  quote: pairwise analysis revealed systematically higher spatial ratemap correlations in novel
    environments (Fig. 6c)
  statistics:
  - test: two-sided Wilcoxon
    p: 3.2e-283
    n: 31,067 familiar and 41,991 novel pairs
  expected:
  - quantity: median ratemap correlation, familiar
    value: -0.045
    tolerance: 0.03
  - quantity: median ratemap correlation, novel
    value: 0.048
    tolerance: 0.03
  criterion: All pairs of putative pyramidal cells in the sessions of the three novel-environment
    mice (the paper's pairs each include one light-responsive neuron, which cannot be identified
