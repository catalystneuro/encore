    stated ("varying combination of PRFs and DCs"); the reading is the 200 us PD series of Fig. 6, and
    any other PRF series the AC sessions hold is shown as a variant. Reproduced when both
    Kruskal-Wallis tests are significant, exactly 1,500 and 3,000 Hz are significant during sonication,
