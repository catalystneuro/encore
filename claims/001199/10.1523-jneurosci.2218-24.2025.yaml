- id: fig11c-ac-to-s1-30hz
  statement: During 30 Hz PRF sonication the directional correlation from AC neurons to S1 RSUs increases
    and lasts about 150 to 200 ms, while the correlation of AC neurons to S1 FSUs changes during and right
    after sonication.
  source: Figure 11 legend (second panel C); Results, Auditory confound on CTC pathway modulation using
    tFUS, paragraph 2
  quote: During tFUS sonication with 30 Hz PRF, the correlation from 878 paired AC neurons to S1 RSUs
    significantly increased (p = 0.0014) which lasting for ∼150 ms (left). The correlation of AC neurons to
    S1 FSUs decreased during and right after sonication.
  statistics:
  - about: AC to S1 RSU, during against prestimulus
    test: one-tail two-sample Wilcoxon test
    p: 0.0014
    n: 878 pairs
  expected:
  - {quantity: AC to S1 RSU pairs at 30 Hz, value: 878, tolerance: 87.8}
  criterion: Pairs of AC neurons and S1 units (U) in the 30 Hz/200 us sessions of the AC rats, normalized
