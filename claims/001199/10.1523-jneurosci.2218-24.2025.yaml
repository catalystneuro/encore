- id: fig10a-dsttc-3000-post
  statement: After 3,000 Hz PRF sonication, the directional correlation from S1 RSUs to POm FSUs and from
    POm RSUs to S1 RSUs decreases.
  source: Results, tFUS elicited correlation change in CTC pathway, paragraph 1; Figure 10A
  quote: Postsonication, we found the correlation from S1 RSUs to POm FSUs and POm RSUs to S1 RSUs
    significantly decreased, representing the desynchronization of spikes.
  criterion: As fig10a-dsttc-3000-during, one-tailed for a decrease, in the postsonication windows of
    D1 or D2 (the paper does not say which postsonication window; 201 to 268 ms is the window of the
