- id: fig11d-ac-to-s1-3000
  statement: With 3,000 Hz PRF, AC neurons show no directional correlation change with S1 RSUs, while the
    correlation of AC neurons to S1 FSUs changes in both directions after sonication, at about 200 to 300
    ms.
  source: Figure 11 legend (panel D); Results, Auditory confound on CTC pathway modulation using tFUS,
    paragraph 2
  quote: The 1,714 paired neurons recorded from 3,000 Hz PRF sessions were compared. There was no
    correlation change of AC neurons to S1 RSUs. While there were postsonication bidirectional correlation
    change from 1,016 paired AC neurons to S1 FSUs.
  expected:
  - {quantity: AC to S1 FSU pairs at 3000 Hz, value: 1016, tolerance: 101.6}
  criterion: As fig11c-ac-to-s1-30hz, for the 3,000 Hz/200 us sessions. The absence for AC to S1 RSUs is
    judged on the paper's test, one-tailed rank-sum against the prestimulus window at p < 0.05, in
    each window of D, in either direction; reproduced for that part when none is significant. The AC to
