    by 30 Hz (n = 83, p = 1.77 × 10−20), 1,500 Hz, (n = 107, p = 1.36 × 10−5), 3,000 Hz (n = 104, p = 4.47
    × 10−13), and 4,500 Hz (n = 100, p = 1.66 × 10−40).
