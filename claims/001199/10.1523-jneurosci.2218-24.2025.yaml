  criterion: S1 FSUs (U) of the five 60% DC sessions, R and T as in fig9a-s1-rsu-60dc. Reproduced when
    both Kruskal-Wallis tests are significant, 1,500 Hz is significantly above baseline during
    sonication, and 4,500 Hz is significantly above baseline postsonication with the highest mean;
    partially reproduced when two of these three parts hold.
  depends_on:
  - fig7-9-unit-counts
- id: fig10a-dsttc-3000-during
  statement: During 3,000 Hz PRF, 60% DC sonication, the directional correlation from S1 RSUs to POm RSUs
    and from POm RSUs to S1 FSUs increases, while S1 RSU to POm FSU and POm RSU to S1 RSU do not change.
  source: Results, tFUS elicited correlation change in CTC pathway, paragraph 1; Figure 10A legend
  quote: When 3,000 Hz PRF was applied, S1 RSUs showed an increased correlation to POm RSUs during
    sonication (p = 0.01). At the same period, POm RSUs showed enhanced correlation to S1 FSUs (p = 0.02).
    The other directional correlation did not show significant change during sonication.
  statistics:
  - about: S1 RSU to POm RSU, during against prestimulus
    test: one-tail two-sample Wilcoxon test
    p: 0.01
  - about: POm RSU to S1 FSU, during against prestimulus
    test: one-tail two-sample Wilcoxon test
    p: 0.02
  criterion: Pairs from the 3,000 Hz/200 us sessions, types as in U, normalized dSTTC as in D in 0 to 67
    ms against the prestimulus window, one-tailed rank-sum at p < 0.05, after Kruskal-Wallis across the
    windows. Reproduced when S1 RSU to POm RSU and POm RSU to S1 FSU increase significantly and S1 RSU to
    POm FSU and POm RSU to S1 RSU do not change (tested in either direction, the paper's "no significant
