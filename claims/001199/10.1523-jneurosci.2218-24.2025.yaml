- id: fig10d-sttc-60dc
  statement: At constant 60% DC, the S1 RSU to POm RSU correlation change depends on PRF, with a
    preference for 1,500 and 3,000 Hz.
  source: Results, tFUS elicited correlation change in CTC pathway, paragraph 2; Figure 10D legend
  quote: Then we fixed the DC to 60% and varied PRF. Unlike the neuronal responses (Fig. 9), the
    correlation showed the preference to 1,500 and 3,000 Hz (Fig. 10D).
  statistics:
  - test: Kruskal-Wallis
    p: 0.0012
  criterion: As fig10c-sttc-constant-pd, for the five 60% DC sessions. Reproduced when the Kruskal-Wallis
    test is significant at p < 0.05 and 1,500 and 3,000 Hz have the two highest changes; partially
    reproduced when it is significant and one of them is among the two highest. The paper does not say
    whether the preference is read from means or medians; both are read.
  depends_on:
  - fig7-9-unit-counts
- id: fig10e-sttc-30hz-dc
  statement: At 30 Hz PRF, the S1 RSU to POm RSU correlation change depends on DC, changing most at the
    middle DCs (6, 30, 60%) and less at 0.6% and 90%.
  source: Results, tFUS elicited correlation change in CTC pathway, paragraph 2; Figure 10E
  quote: For 30 Hz PRF (Fig. 10E), the correlation tended to change most at a middle range (6, 30, 60%)
    and respond less to lower (e.g., 0.6%) and higher DC (e.g., 90%).
  statistics:
  - test: Kruskal-Wallis
    p: 0.0054
  criterion: As fig10c-sttc-constant-pd, for the five 30 Hz sessions. "Tended to" is judged on the means, and
