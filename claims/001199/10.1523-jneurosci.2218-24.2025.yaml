- id: fig10c-sttc-constant-pd
  statement: With constant 200 us PD, the change in S1 RSU to POm RSU correlation during sonication does
    not depend on PRF, though 1,500 Hz gives a larger change than 30 Hz.
  source: Results, tFUS elicited correlation change in CTC pathway, paragraph 2; Figure 10C
  quote: When applying tFUS with constant 200 μs PD, varying the DC and PRF, the correlation did not show
    PRF-dependent change. A total of 1,500 Hz PRF did show a higher correlation change compared with 30
    Hz PRF (Fig. 10C; p = 0.02).
  statistics:
  - about: 1,500 against 30 Hz
    test: one-tail two-sample Wilcoxon test
    p: 0.02
  criterion: S1 RSU and POm RSU pairs of the five 200 us PD sessions, STTC change from prestimulus to 0 to
    67 ms as in D (D3 or D4). The absence is judged on the paper's test, Kruskal-Wallis across the five
    PRFs at p < 0.05, not significant; the 1,500 against 30 Hz one-tailed rank-sum at p < 0.05. Reproduced
    when the Kruskal-Wallis test is not significant and 1,500 Hz exceeds 30 Hz significantly; not
    reproduced when the Kruskal-Wallis test is significant; partially reproduced when it is not and the
