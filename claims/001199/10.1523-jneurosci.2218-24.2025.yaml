  source: Results, tFUS elicited correlation change in CTC pathway, paragraph 1; Figure 10B legend
  quote: When delivering 30 Hz ultrasound, S1 RSUs to POm FSUs higher correlated (p = 0.0058), while POm
    RSUs showed decreased correlation to S1 FSUs during sonication (p = 0.0058).
  statistics:
  - about: S1 RSU to POm FSU, increase
    test: one-tail two-sample Wilcoxon test
