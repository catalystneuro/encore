    corrected: Bonferroni
    n: 83 AC neurons
  - about: 1,500 Hz postsonication
    test: post hoc one-tail two-sample Wilcoxon test
    p: 1.36e-5
    corrected: Bonferroni
    n: 107 AC neurons
  - about: 3,000 Hz postsonication
    test: post hoc one-tail two-sample Wilcoxon test
    p: 4.47e-13
    corrected: Bonferroni
    n: 104 AC neurons
  - about: 4,500 Hz postsonication
    test: post hoc one-tail two-sample Wilcoxon test
    p: 1.66e-40
    corrected: Bonferroni
    n: 100 AC neurons
