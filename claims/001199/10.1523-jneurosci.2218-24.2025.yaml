# Claims for Gao, Ramachandran, Yu & He (2025), J Neurosci 45(23) e2218242025, on dandiset 001199.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-22, under
# docs/protocol.md, version pilot-10.
#
# Text read: the version of record as served by PubMed Central (paper/10.1523-jneurosci.2218-24.2025.txt,
# fetched by paper-text-fetcher), with Abstract, Significance Statement, Introduction, Materials and
# Methods, Results, all eleven figure legends and Discussion. The paper has no supplement and no PDF
# was supplied. The text lost the equation of the directional STTC (Methods, Directional spike time
# tiling coefficient); only its verbal definition survives (see D below). The Fig. 6 legend prints the
# postsonication window as "201–28 ms" (201–268 ms in the Results), and the Fig. 11 legend labels two
# panels "C" (the second is Fig. 11B in the Results).
#
# Code. The paper links no analysis code and names none; it says the analysis was done in MATLAB
# R2022a after spike sorting in Offline Sorter (Plexon). No repository was read.
#
# Which dataset. The paper's Methods name dandiset 000946 as the repository of all its data. Dandiset
# 001199 has the same title and cites this paper, but its description differs from the paper. It
# describes S1 recordings with 64-channel Cambridge or NeuroNexus electrodes, tFUS delivered "either at
# S1 or PoM", and varied pressure levels (input voltage in the session identifier), none of which the
# paper reports, and it does not mention the auditory cortex recordings. Dandiset 000946's description
# matches the paper (32-channel NeuroNexus, S1 targeting, AC recordings, about 90 kPa). So 001199 may
# hold part of the paper's data, the same data again, or other recordings; the author must find which
# sessions match the paper's conditions below. Sessions with POm targeting or a pressure other than the
# paper's are not described by the paper and are not used for these claims.
#
# Data the paper used (Methods, Animal surgery; Transcranial focused ultrasound stimulation).
# - Subjects. Male Wistar rats (Hsd WI, Envigo), 250 to 350 g, 3 to 6 months, isoflurane anesthesia
#   (2% during recordings). 16 rats with simultaneous S1 and POm recordings; a second group of 12 rats
#   with S1 and auditory cortex (AC) recordings, to check the auditory confound.
# - Electrodes. Two 32-channel NeuroNexus probes (A1x32-Poly3-10mm-50-177) per session. S1 (AP -2, ML
#   2.5) at 40 degrees, 1 to 1.3 mm deep (layers III to V); POm (AP -4.5, ML 2.6) at 20 degrees, 5.8 mm
#   deep; AC (AP -4.5, ML 6.5) at 40 degrees, 1 to 1.3 mm deep. TDT acquisition, 300 Hz to 5 kHz
#   bandpass, Offline Sorter with a -3.5 SD threshold and k-means clustering.
# - Stimulation. 128-element random array H276, 1.5 MHz, Verasonics Vantage, beam steered to S1.
#   Ultrasound duration (UD) 67 ms, intersonication interval 2.5 s with 10% jitter, 500 trials per
#   condition, conditions in random order. In situ pressure 88 kPa peak to peak (5 V input at 1,500 Hz
#   PRF, 200 us PD). PRFs 30, 300, 1,500, 3,000, 4,500 Hz; DCs 0.6, 6, 30, 60, 90%; DC = PRF x PD.
#   The 001199 description encodes a session as rat_PRF_PD_UD_voltage (e.g. BH596_3000_200_67_10).
#   The paper's condition series, as PRF and PD:
#   * constant PD 200 us (Fig. 4, 6, 10C, 11B): 30 Hz (0.6% DC), 300 (6%), 1,500 (30%), 3,000 (60%),
#     4,500 Hz (90%). Fig. 4's "3,000 Hz PRF, 60% DC" and "30 Hz PRF, 0.6% DC" are 3,000/200 and 30/200.
#   * constant 3,000 Hz PRF (Fig. 7, 10F): PD 2, 20, 100, 200, 300 us for 0.6, 6, 30, 60, 90% DC.
#   * constant 30 Hz PRF (Fig. 8, 10E): PD 200, 2,000, 10,000, 20,000, 30,000 us.
#   * constant 60% DC (Fig. 9, 10D): 30 Hz/20,000 us, 300/2,000, 1,500/400, 3,000/200, 4,500/133 us.
#   * sham, sessions with no tFUS (Fig. 5A); control, tFUS steered to cingulate cortex CG1 (AP 3, ML 0)
#     at 3,000 Hz PRF (Fig. 5B).
#   Target determination used 10 to 20 trials at about 170 kPa and 1,500 Hz PRF before each recording.
# - Measured variables. Sorted single units of S1, POm and AC with spike times and waveforms; trial
#   (sonication) onset times.
#
# Shared method, from the Methods, Statistical analysis and the figure legends. Criteria refer to these
# by letter. A detail the paper does not fix is named, with the readings its text allows.
# U, units. Units that fire more than 2,000 spikes in the session (Methods, Neuronal type
#   classification). Each unit is counted once per session it passes in; the paper's n per condition
#   are units per condition pooled over rats. Type, RSU or FSU, by k-means on the initial phase (IP,
#   onset to recrossing of baseline) and afterhyperpolarization period (AHP, end of IP to its
#   recrossing of baseline), FSUs being the cluster with the shorter, narrower waveforms (Methods,
#   citing Bartho et al. 2004). Open, (U1) the number of clusters, two by the paper's wording (RSUs and
#   FSUs), with no other reading in the text; (U2) whether IP and AHP are taken from the mean waveform or
#   averaged over each unit's spikes ("For each identified spike"), and whether k-means runs on all
#   units pooled or per area. If the dataset holds the authors' RSU and FSU labels, those are the
#   paper's classification and are used, with the re-clustering under each reading of U2 as a variant.
#   AC neurons are not split by type in the paper (Fig. 11A, 11B).
# R, normalized spiking rate. Rate in a window divided by the rate in the 67 ms before sonication onset,
#   in percent (Methods; Statistical analysis). Open, (R1) per unit, the trial-averaged rate in the
#   window over the trial-averaged prestimulus rate; (R2) per trial, window over prestimulus rate, then
#   averaged over trials, trials with no prestimulus spike left out. Units with no prestimulus spike in
#   any trial are left out under both. Group values are mean +/- SEM over units (Fig. 4, 5 legends).
# W, windows. During sonication 0 to 67 ms; postsonication 201 to 268 ms (Results, tFUS parameters,
#   paragraph 1; Fig. 6 to 9 legends). Fig. 4 reports windows of 67 ms after onset (67–134 ms, 134–268
#   ms, "from 134 ms"); the readings for Fig. 4 are consecutive 67 ms windows from 0 ms, the claim
#   holding when the effect is found in at least one window inside the range the paper names. PSTH bins
#   of 50 ms are for display only (Fig. 3).
# T, response test. Kruskal-Wallis H test across the groups of a panel, then post hoc one-tailed
#   two-sample Wilcoxon (rank-sum) tests with Bonferroni correction, significance at 0.01 for spiking
#   (Methods, Statistical analysis; Fig. 4 and 5 legends). A response "compared with baseline" is a
#   one-tailed rank-sum test of the window against the prestimulus window, in the direction stated
#   (above baseline for an activation, below for an inhibition). Open, (T1) the two samples are the
#   units' window rates and prestimulus rates in spikes/s; (T2) the two samples are the units'
#   normalized window values and their normalized prestimulus values (100% for every unit under R1, so
#   under R1 T2 is a one-sample comparison with 100%, run as a rank-sum against a vector of 100s);
#   (B) the Bonferroni factor, (B1) the number of windows or conditions compared with baseline in the
#   panel, (B2) the number of all pairwise comparisons among the panel's groups. A comparison between
#   two conditions in the same window is a one-tailed rank-sum on the units' normalized values, under
#   the same B readings. Whether a printed p is before or after correction is not said; the criteria
#   compare corrected p with 0.01.
# D, directional STTC. Delta t = 20 ms (Methods). The equation is missing from the text; its verbal
#   definition is that P_A is the fraction of spikes of A within Delta t before a spike of B, T_B the
#   fraction of time covered by Delta t before each spike of B, P_B the fraction of spikes of B within
#   Delta t after a spike of A, T_A the fraction of time covered by Delta t after each spike of A. The
#   reading taken, by the cited STTC of Cutts and Eglen (2014) that the paper says it modified, is
#   dSTTC = 1/2 [(P_A - T_B)/(1 - P_A T_B) + (P_B - T_A)/(1 - P_B T_A)]; no other combination is named
#   in the text. dSTTC is computed trial by trial for each cross-area pair recorded in the same session
#   (Methods), the recording time being the window. Open, (D1) the windows, 67 ms windows tiled from -67
#   ms (prestimulus, during, and 67 ms steps after) as for the spiking rate, or (D2) the same windows in
#   the 0 to 268 ms range only; (D3) the normalization, the window's dSTTC minus the prestimulus dSTTC,
#   or (D4) divided by it and minus one; per pair the mean over trials with spikes from both units in the
#   window. The window length is not given for dSTTC; 67 ms is taken from the spiking analysis (67 ms
#   prestimulus and sonication windows), a reading the text allows and no other is named. Tests as T
#   with significance at 0.05 (Methods), pairs as samples, normalized dSTTC compared with the
#   prestimulus value (Fig. 10 legend, "compared with prestimulation correlation"), one-tailed in the
#   stated direction. The Methods name Bonferroni's correction for the spiking post hoc tests only; for
#   dSTTC they say "Post hoc one-tail two-sample Wilcoxon tests were employed". Open, (C1) uncorrected,
#   as the dSTTC sentence reads, or (C2) Bonferroni under B1 or B2 as for spiking; the outcome is the
#   one they all give. Fig. 10C to 10F use the undirected STTC of Cutts and Eglen with the same
#   Delta t (the text gives no other), between S1 RSUs and POm RSUs, as the change from prestimulus to
#   during sonication under D3 or D4, compared across conditions by Kruskal-Wallis at 0.05.
#
# Every claim's data are the paper's own recordings (data dataset). The paper uses no outside data.
