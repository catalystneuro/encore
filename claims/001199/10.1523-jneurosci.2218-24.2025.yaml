    of the three middle DCs exceed both ends.
  depends_on:
  - fig7-9-unit-counts
- id: fig10f-sttc-3000-dc
  statement: At 3,000 Hz PRF, the S1 RSU to POm RSU correlation change does not depend on DC.
  source: Results, tFUS elicited correlation change in CTC pathway, paragraph 2; Figure 10F
  quote: For 3,000 Hz PRF, the pathway correlation showed DC independence (Fig. 10F).
  criterion: A claim of absence, judged on the paper's test, Kruskal-Wallis across the five 3,000 Hz DC
