  statement: At the example paradigm 1 site, stimulus-driven temporal correlations are fast for
    crowd, water and fire (3.0, 3.0 and 3.9 ms wide at 50% of maximum; 5.9, 6.9 and 11.8 ms at
    10%), the bird chorus has a sharp peak (5.9 ms half width) and a slow component (161.2 ms at
    10%), and the snake has a 7.9 ms half width, 20.6 ms at 10%, and a periodic pattern of about
    50 ms period at high-frequency sites.
  source: Results, Decoding neural ensemble correlation statistics to recognize sounds, paragraph
    4; Figure 1K
  quote: The temporal correlations for the crowd, water, and fire sounds are relatively fast (3.0
    ms, 3.0 ms, and 3.9 ms width at 50% of the maximum; 5.9 ms, 6.9 ms, and 11.8 ms width at 10% of
    the maximum). The bird chorus has a similar sharp temporal correlation (5.9 ms half width), but
    it also contains a broader and substantially slower component (161.2 ms, 10% width)
