  statement: Across the 13 paradigm 1 sites, noise correlations are more restricted in frequency
    and time and more consistent across sounds than stimulus-driven correlations, which are
    broader and stimulus dependent (a slow component for the bird chorus and a 20 Hz periodic
    component for the snake).
