    6; Figure 2
  quote: The spectral noise correlations (collapsed along the diagonal) are consistent across
    sounds and more restricted in frequency ( Fig 2B ) than the corresponding stimulus-driven
    spectral correlations ( Fig 2A )
  criterion: As in the Fig 2 legend, for each site and sound the spectral matrices are collapsed
    over channel offset (mean over entries at each |k - l|) and the temporal correlations over
    channels (mean c_kk(tau) at each lag), then averaged over the 13 sites, each normalized by its
    value at offset 0 or lag 0 (an open step; the shape is compared). Width is measured at 50% of
