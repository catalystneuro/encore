# Claims for Sadeghi, Zhai, Stevenson & Escabi (2019), "A neural ensemble correlation code for
# sound category identification", PLoS Biol 17(10):e3000449, on CRCNS data set bst-2.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-11,
# protocol as stated in docs/protocol.md (Reader). The writer did not look at the data set's data or
# files; only its description (paper/bst-2.data-description.txt) was read, to know what it holds.
#
# Text read: the version of record (PMC6788721, Europe PMC full-text XML, flattened), with its
# Results, Discussion, Materials and methods, all figure legends (Figs 1 to 10, S1 to S10 Figs),
# and the supplement files S1 Text (s001, proofs on signal and noise correlations, and notes on
# S2 to S4 and S6 Figs), S1 Table (s026, the 195 model sounds) and S2 Table (s027, the 18 sounds
# of paradigm 3). No PDF was supplied. The extraction dropped every displayed equation (the
# shuffled and unshuffled correlograms, their normalization, the noise correlation, the MAP
# rule, the spectro-temporal model average, the 1/f filter, the SI and CDI formulas); the prose
# around each was read and the criteria below name where an equation would have settled a
# detail. The movies and sound files listed as supporting information were not read; no claim
# rests on them.
#
# Code: the paper links only the CRCNS deposit (doi:10.6080/K03X84V3), which holds MATLAB code
# (Code/MUACorrAnalysis, with rastermuashuffledxcovwinfastN.m; Code/AuditoryModelCorr, with
# Cochleogram.m and cochleogramdyncorr.m; Code/Examples, with NeuralExample.m for Fig 1 and
# ModelExample.m for Fig 7), as its description says. Those are part of the data set's files
# and were not read here. Where the Methods leave a detail open that this code may settle, the
# criterion says so; the author may follow the code and record it, with the readings named here
# kept as variants.
#
# Data the paper used (Materials and methods). Unanesthetized female Dutch Belted rabbits (N = 4),
# acute 16-channel linear probes (150 um spacing) or 64-channel polytrodes of which 16 equally
# spaced channels were kept (paradigms 2 and 3), in the central nucleus of the IC; 33 penetration
# sites recorded, 24 kept (13 for paradigm 1; 11 for paradigms 2 and 3). The measured variable is
# analog multiunit activity (aMUA) per channel, the envelope of the 325 to 3000 Hz band, rectified,
# low-passed at 475 Hz and downsampled to 2 kHz, as trials by samples rasters. Frequency response
# areas from tone pips (0.1 to 16 kHz, 5 to 75 dB SPL) give each channel's best frequency.
# - Paradigm 1, 13 sites (4 and 9 from two animals), five 3 s sounds (fire, bird chorus, crowd,
#   water, rattling snake) at 65 dB SPL, block randomized, 18 to 39 trials each.
# - Paradigm 2, 11 sites (3 and 8 from two animals), the same five sounds, original and 1/f
#   spectrum-equalized, 20 trials (14 at one site).
# - Paradigm 3, 11 sites (3 and 8), three categories (fire, water, speech), 6 exemplars each,
#   10 to 20 trials.
# - Model, 195 sounds, 13 categories of 15 sounds of 10 s at 44.1 kHz (S1 Table), and white noise
#   as a control. Vocalizations are single bird songs, cat meowing, dog barking and human speech
#   (one male speaker); environmental sounds are bird chorus, speech babble, fire, thunder and
#   rain, flowing water, waves and wind; man-made are bells and automobile engines.
# The data set's description says it holds P1_Site01 to P1_Site13, P2_Site01 to P2_Site11 and
# P3_Site01 to P3_Site11 (aMUA rasters per sound and channel), the sounds of all three paradigms,
# and the model sounds by category. Its figure list names the example sites as P1_Site04 (Figs 1,
# 3A), P2_Site11 (Fig 4A to 4F) and P3_Site04 (Fig 8A to 8E), and Sound_1 of Human Speech and of
# Flowing Water for Figs 5 and 7; this is a finding aid, not a method. It does not list tone-pip
# recordings or white noise.
#
# Methods common to the neural claims (Materials and methods, sections named):
# - Stimulus-driven correlation (Neural ensemble stimulus-driven correlation): windowed shuffled
#   cross-correlation between channels k and l, the mean of correlations between different trials
#   of mean-removed aMUA, square window of duration T (62.5 to 1000 ms) around time t, delay tau,
#   computed through PSTHs (fast shuffled algorithm), normalized as a correlation coefficient by
#   the localized short-term response variances. Noise correlation (Neural ensemble noise
#   correlation) is the unshuffled (same-trial) minus the shuffled correlogram, normalized by the
#   total response power, so that stimulus plus noise is 1 on the zero-lag diagonal. The exact
#   normalization is in equations lost from the text; the S1 Text prose is the guide.
# - Spectral correlation is c_kl(t, 0); temporal correlation is c_kk(t, tau) for tau from -100 to
#   100 ms (Noiseless neural classifier, paragraph 6).
# - Classifiers (Noiseless neural classifier; Single-trial neural classifier). Model data are the
#   first 1.5 s of each response and validation data the second half, then swapped. Features are
#   correlations about randomly selected time points, 500 ms windows for the noiseless model and
#   1000 ms windows for the single-trial model; validation windows of 62.5 to 1000 ms in half
#   octave steps ("sound duration"); 100 random time samples; PCA fitted on the model half; naive
#   Bayes with axis-aligned Gaussian likelihoods; equal priors; MAP. The highest-ranked PCs that
#   maximize performance are used. The noiseless classifier uses shuffled correlations (trials
#   averaged); the single-trial classifier uses unshuffled correlations of single trials, trials
#   randomized along with the time points. Spectro-temporal is a model average of the spectral
#   and temporal log-likelihoods with a mixing coefficient a in [0, 1] chosen to maximize the
#   log-likelihood. "Without tonotopy" reorders the channels of the validation data at random.
#   Paradigm 2 models are built from responses to the original sounds and validated on the 1/f
#   (or, as a control, the original) responses. Paradigm 3 models are per category; five
#   exemplars train and the sixth is tested (leave one out, Results, Decoding neural correlation
#   statistics in a three-category identification task, paragraph 3).
# - Open in all neural classifier claims, with readings to be run:
#   (1) how the 100 random time samples enter a decision; (a) each sample is one decision and
#   accuracy is the fraction correct over them; (b) the log-posterior is summed over the 100
#   samples for one decision ("features at each time sample are conditionally independent").
#   (2) how many PCs, chosen to maximize performance; (a) chosen on the validation performance as
#   the text reads; (b) chosen within the model half by an inner split. (3) for paradigm 2,
#   whether the half split also applies; (a) first and second halves as in paradigm 1, original
#   for the model and 1/f for validation; (b) whole original responses for the model and whole
#   1/f responses for validation. (4) the spectrum (rate code) classifier of Figs 4 and 8 is not
#   described for the neural data; read as the mean aMUA of each channel in each window, through
#   the same PCA and naive Bayes pipeline, by analogy with the model's spectrum classifier
#   (Spectrum-based classifier). (5) the grid for a; a standard grid of 0 to 1 in steps of 0.1.
#   The random seeds are standard choices.
# - "Above chance" tests are t tests across sites against chance (20% for five sounds, 33.3% for
#   three categories); whether one-sided or two-sided is not said, and both are reported.
#
# Methods common to the model claims (Auditory model; Nonstationary spectro-temporal correlation
# statistics; Dimensionality reduction; Bayesian classifier; Cross validation): 58 gammatone
# channels (order 3) from 100 Hz to 16 kHz in 1/8 octave steps, bandwidths 25 + 75(1 + 1.4 f^2)^0.69
# (f in kHz), Hilbert envelope low-passed at 500 Hz and downsampled to 1 kHz; short-term
# correlations with a Kaiser window (beta 3.4), resolution tau_W (two SDs of the window) from 25
# to 566 ms in half octave steps, delays up to half the window, normalized by the local powers.
# Spectral features are c_kl(t, 0) (diagonal removed, S8 Fig), temporal features c_kk(t, tau) for
# tau from 0 to half the window with channels as observations (zero lag removed); PCs explaining
# 90% of the variance (the paper reports 26 spectral, 8 temporal, 87 spectro-temporal); one GMM
# per category with diagonal covariances and N_c chosen by cross-validated likelihood (the paper reports 5, 8 and 13 for temporal, spectral and
# spectro-temporal); leave-one-sound-out over 195 sounds; N consecutive non-overlapping windows
# from the start of the test sound, N in half octave steps; log-likelihoods summed; equal priors.
# Open for all model claims: (6) the spacing of the non-overlapping windows; (a) tau_W; (b) the full
# Kaiser window length. (7) the tau_W at which N_c and the PCs are fixed; (a) refitted at each
# tau_W; (b) the reported counts used at every tau_W.
