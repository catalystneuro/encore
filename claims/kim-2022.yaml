- id: fig3d-cancellation-independent-of-number
  statement: The relative efficiency of 50% bipolar pulses was the same for 5, 10 and 15 pulses and
    did not depend on the field strength.
  source: Results 3.2, paragraph 2; Figure 3D and its legend
  quote: The plots for 5, 10, and 15 pulses nearly overlapped, showing that within the studied
    limits cancellation of electroporation by adding a 50% opposite polarity phase did not depend
    on the pulse number or the electric field strength.
  datasets:
  - "000489"
  criterion: A claim of absence, for which the paper reports no test; it is judged on the paper's
    test, the two-sided Student's t-test at p < 0.05 (Methods 2.5), unpaired. The measure, as the
    Fig. 3 legend and Results 3.2 say, is bipolar over unipolar YP over fields above the
    background cutoff (8 kV/cm, the upper end of "<7-8 kV/cm", so that every included ROI is above
    background; 7 kV/cm is a variant). For the test, each bipolar dish value is divided by the
    unipolar mean at the same ROI and pulse number. Pulse number, (i) at each included ROI the
    three pairs of pulse numbers are compared. Field, (ii) for each pulse number the lowest and
    highest included ROI are compared. Reproduced when no comparison differs; not reproduced when
    any does. The ratio of the 2nd degree polynomial fits (the curves of Fig. 3D) is reported for
    each pulse number, with its range.
