# Claims for Kim, Semenov, Kiester, Keppler, Ibey, Bixler & Pakhomov (2022), tested on dandisets
# 000489 and 000448.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-10,
# protocol pilot-14 as stated in docs/protocol.md. It replaces the file written 2026-10-23 under
# pilot-10 for dandiset 000489 alone; ids are kept where the finding is the same.
#
# Text read. The accepted author manuscript in PubMed Central (PMC9729435, NIHMS1849847), as
# served by ncbi_pmc, in paper/10.1016-j.bioelechem.2022.108319.txt. It holds the main text, the
# Methods (sections 2.1 to 2.6), the Results (3.1 to 3.5), the Discussion and the legends of Figs.
# 1 to 7. It is not the version of record. The paper has no supplement (PMC marks
# "has-supplement no", and the text cites none). No PDF was supplied, so figures were not read and
# values shown only in a figure are not used. The paper links no code and no data deposit, so no
# repository was read.
#
# The datasets, from their titles on DANDI.
# - 000489, "The impact of the second phase amplitude (% to the first phase) on the electroporation
#   efficiency (measured as YP emission)", bovine cells. This is the title of Fig. 2A, so it is
#   meant to hold the experiment of Fig. 2 (Results 3.1). The claims on Fig. 2 rest on it.
# - 000448, "Time kinetics of the membrane potential at the cathode- and anode-facing poles of a
#   cell induced by a train of 5 pulses at 833 kHz", Chinese hamster. This is the title of Fig. 7,
#   the strobe imaging of CHO cells (Methods 2.6, Results 3.5). The claims on Fig. 7 rest on it.
# - Neither title names the experiments of Figs. 3 to 6 (pulse number, duration, the aa' line,
#   repetition rate) or the thermometry of Fig. 1E, and the paper gives no other data location.
#   These claims are listed under 000489, the YO-PRO-1 uptake dataset of the same preparation and
#   measure; whether it holds them is the author's to find, and they are blocked as data_missing
#   if it does not. They are kept because they are the paper's main findings.
#
# Data the paper used, as it reports them.
# - Electroporation experiments (Figs. 2 to 6). Monolayers of bovine pulmonary artery endothelial
#   (BPAE) cells in 35 mm glass bottom dishes, in a physiological solution with 1 uM YO-PRO-1 (YP),
#   pre-treated with propidium iodide and labeled with MemBrite Fix 405/430. Pulses were delivered
#   by two hollow stainless-steel needles (1.5 mm, 3 mm apart) touching the glass. After 10 min the
#   whole dish was imaged (216 tiles, 10x 0.38 NA, DAPI cube for MemBrite and FITC cube for YP) and
#   stitched. Fluorescence was averaged in 200 um square ROI along the bb' line (equidistant from
#   both electrodes; strongest field at the centre, falling towards the edges) or, for Fig. 5,
#   along the aa' line (anode to cathode; weakest field at the centre). The measure is
#   YP = YP_ROI x MB_0 / MB_ROI - YP_0, YP_0 and MB_0 measured within the electrode footprints.
#   Each exposure protocol was tested 3 to 8 times (one dish per exposure); graphs show mean and
#   s.e.m. Fig. 2, 5 pulses at 1 Hz, 600 ns phases, first phase 5.75 kV, second phase 0, 25, 50,
#   75 or 100%. Fig. 3, 5, 10 or 15 pulses (600 ns, 600+600 ns at 50%), n = 3. Fig. 4, 5 pulses at
#   1 Hz with phases of 300, 600 and 1200 ns (5.75 kV) and 50, 100 and 500 us (425, 350 and 250 V),
#   second phase 50%. Fig. 5 re-analyzes the Fig. 4 dishes along aa'. Fig. 6, 5 pulses of 600 ns
#   or 600+600 ns (50%) at 1 Hz, 10 to 500 kHz and 833 kHz.
# - Strobe imaging (Fig. 7). CHO-K1 cells loaded with FluoVolt, tungsten rod electrodes (0.5 mm,
#   1 mm apart, 50 um above the dish bottom), 37 V giving 0.3 kV/cm, trains of 5 pulses at 833 kHz,
#   unipolar 600 ns (18 cells) or bipolar 600+600 ns with a 50% second phase (17 cells). The laser
#   flash delay was stepped by 25 ns over 12.5 us (500 exposures at 6 per second). Each cell was
#   recorded in two trials (ascending and descending delays) that were averaged. Pole signals were
#   scaled to the whole-cell signal, the mean of the 40 points before the pulse taken as 100%, and
#   expressed as percent difference from it.
#
# Inputs the paper relies on (step 4). The field strength of each ROI is not measured; it comes
# from the paper's finite element model (Sim4Life V5.2, Methods 2.3, Fig. 1B and C), computed for
# 1 V and scaled by the applied voltage. The model output is not deposited. Its geometry is given
# in Methods 2.3 (two stainless-steel cylinders 1.5 mm in diameter, 3 mm apart, touching the glass
# of a 35 mm dish filled to 3.5 mm with a 1.6 S/m solution, field taken 1 um above the glass), so
# the author can recompute it if the dataset does not hold the field per ROI. For bipolar pulses
# the field quoted is that of the first phase (Fig. 2 and Fig. 6 legends). The 15.1 kV/cm cited
# for Fig. 2C at 5.75 kV is a check on the result.
#
# Details the paper leaves open, used by several criteria below.
# - ROI placement. The paper gives the ROI size (200 um square) and the lines, not the spacing or
#   the number of ROI. Readings are (a) contiguous ROI tiled outward from the centre along the line
#   on both sides, and (b) the same on one side only. A named field strength (6.7, 8.7, 15.1
#   kV/cm) is taken at the ROI whose mean field is closest to it. If the dataset holds the paper's
#   own ROI values, those are used and the readings are not needed.
# - The t-test. Methods 2.5 names a two-sided Student's t-test at p < 0.05 and does not say
#   whether it is paired. Exposures with different pulse parameters are different dishes (or
#   cells), so those comparisons are unpaired. Comparisons between ROI of the same dishes, or
#   pulses of the same cells, can be read (a) unpaired, the two-sample test the name denotes, or
#   (b) paired. For a claim of absence the protocol takes the paper's test as written, so (a) is
#   the test and (b) is shown as a variant; for other claims both are run.
# - Fits. Grapher 16 was used for fitting (Methods 2.5). Whether fits were made to mean values or
#   to dish values, and whether exponential fits were least squares on linear values or linear
#   regression on log values, is not given. Readings are named where an outcome depends on them.
# - Where readings that are method choices give different outcomes, the author adopts the one the
#   paper best supports, as an assumption, or blocks the claim as methods_underspecified (author,
#   step 1.6). Where readings are of what a reported number means, a match under any suffices.
schema_version: 2
paper: doi:10.1016/j.bioelechem.2022.108319
claims:
- id: fig2a-uptake-rises-with-field
  statement: For unipolar 600 ns pulses and for bipolar 600+600 ns pulses with every second phase
    amplitude, a train of 5 pulses at 1 Hz evoked YP uptake that increased with the local electric
    field strength.
  source: Results 3.1, paragraph 1; Figure 2A
  quote: A train of 5 pulses applied at 1 Hz evoked YP uptake proportionally to the local electric
    field strength ( Fig. 2A ), along with a strong dependence on the 2 nd phase amplitude.
  datasets:
  - "000489"
  criterion: YP per ROI along bb' as defined in Methods 2.5, with the field of each ROI from the
    model (opening comment). The paper reports no test for this finding. For each of the five
    second phase amplitudes (0, 25, 50, 75, 100%), the dish values at the ROI with the strongest
    field are compared with those at the ROI with the weakest field by the paper's two-sided
    Student's t-test (Methods 2.5), run unpaired and paired (opening comment). Reproduced when YP
    is higher at the strongest field with p < 0.05 for all five amplitudes; partially reproduced
    for three or four; not reproduced otherwise. The strongest against weakest comparison is this
    file's reading of "proportionally". The Spearman correlation of mean YP with field across ROI
    is reported for each amplitude as a description.
- id: fig2a-vertical-scales
  statement: The vertical scale of the Fig. 2A panels goes from 1200 a.u. for unipolar pulses down
    to only 250 a.u. for bipolar pulses with a 75% second phase.
  source: Results 3.1, paragraph 1; Figure 2A and its legend
  quote: note the difference in the vertical scale, which is varied from 1200 a.u. for unipolar
    pulses to only 250 a.u. for 75% bipolar pulses
  datasets:
  - "000489"
  criterion: The numbers are axis limits, not measured values, so they bound the data. With YP in
    the units of the dataset's fluorescence images, reproduced when the largest mean plus s.e.m.
    over ROI is at most 1200 a.u. for unipolar pulses and at most 250 a.u. for 75% bipolar pulses,
    and the largest unipolar mean exceeds 250 a.u. If the images are not in the units the paper
    measured (for example rescaled on export), only the ratio of the two largest means is reported
    and the claim is blocked on the absolute values.
- id: fig2b-exponential-same-slope
  statement: YP uptake increased exponentially with the field strength, and the second phase did
    not change the slope of the exponential fits on a semi-log scale.
  source: Results 3.1, paragraph 1; Figure 2B and its legend
  quote: YP uptake increased exponentially with the electric field, and the presence of the 2nd
    phase did not change the apparent slope of exponential fits when plotted on a semi-log scale
  datasets:
  - "000489"
  criterion: As the Fig. 2B legend says, YP is fitted with an exponential function of field,
    YP = A exp(kE), leaving out the low-signal ROI "at less than 6-8 kV/cm". The legend gives a
    range, not one cutoff; 8 kV/cm is used, as it excludes what every amplitude excludes, and 6
    and 7 kV/cm are shown as variants. Grapher's fitting method is open; nonlinear least squares
    on linear YP is used (a standard choice) and linear regression of log YP on field is shown as
    a variant. Exponential growth is judged from the fits to the mean values, which the legend
    plots; it holds when the exponential fits with a lower residual sum of squares than a straight
    line for at least four of five amplitudes (this rule is the file's; the paper gives none). The
    slope part is a claim of absence for which the paper reports no test; it is judged by the
    paper's test, a two-sided Student's t-test at p < 0.05 (Methods 2.5), comparing the slope k of
    per-dish fits for each bipolar amplitude with the unipolar slopes (unpaired, as they are
    different dishes). Reproduced when exponential growth holds and no bipolar slope differs from
    the unipolar slope; not reproduced when any differs. Slopes and their ratios to the unipolar
    slope are reported, with the slopes of the fits to the means and their standard errors.
- id: fig2c-max-inhibition-50-75
  statement: The strongest inhibition of YP uptake, to about 20% of the uptake after unipolar
    pulses, was reached with a second phase of 50 to 75% of the first (p < 0.01).
  source: Results 3.1, paragraph 2; Figure 2C and its legend
  quote: The maximum inhibition of YP uptake, down to ~20% of the unipolar pulses, was achieved with
    the 2 nd phase set to 50-75% of the first one (p<0.01, Fig. 2C ).
  datasets:
  - "000489"
  statistics:
  - test: two-sided Student's t-test
    p: 0.01
    p_relation: "<"
    n: 3 to 8 exposures per protocol
  expected:
  - quantity: YP after bipolar pulses with the most effective second phase, as percent of unipolar
    value: 20
    tolerance: 2
    unit: "%"
  criterion: As the Fig. 2C legend says, for each selected field strength the YP for each
    amplitude is expressed as percent of the unipolar YP at that field. The paper names 6.7, 8.7
    and 15.1 kV/cm and does not list the other selected values; the ROI with fields from 8.7 to
    15.1 kV/cm are used, the range where the text says inhibition did not depend on field.
    Reproduced when the lower of the 50% and 75% values is below the 25% and 100% values at every
    such field, the percent is within tolerance, and the p < 0.01 test holds. Which "~20%" is meant
    is a reading of the number, and either suffices, (a) the mean percent over the fields from 8.7
    to 15.1 kV/cm for the better of 50 and 75%, or (b) the lowest percent at any of those fields.
    Which comparison carries p < 0.01 is not given; readings are (i) 50% and 75% dish YP against
    unipolar dish YP, and (ii) 50% and 75% against 25% and 100%, each by an unpaired two-sided
    Student's t-test (different dishes) at each field; either suffices. Partially reproduced when
    the ordering and the test hold but the percent is outside tolerance under both readings.
- id: fig2c-inhibition-flat-above-8-7
  statement: Between 8.7 and 15.1 kV/cm the degree of inhibition by the second phase did not depend
    on the field strength.
  source: Results 3.1, paragraph 2; Figure 2C
  quote: The degree of inhibition showed no dependence on the electric field strength between 8.7
    and 15.1 kV/cm.
  datasets:
  - "000489"
  criterion: A claim of absence, judged on the paper's test as written, the two-sided Student's
    t-test at p < 0.05 (Methods 2.5), unpaired (opening comment). Each bipolar dish value is
    divided by the unipolar mean at the same ROI (Fig. 2C legend, unipolar as 100%). For each
    bipolar amplitude, the values at 8.7 kV/cm are compared with those at 15.1 kV/cm. Reproduced
    when no amplitude shows a difference; not reproduced when any does. The size of each
    difference is given; the paired test and the comparisons of every pair of ROI in the range are
    shown as variants.
  depends_on:
  - fig2c-max-inhibition-50-75
- id: fig2c-weaker-at-6-7
  statement: Inhibition was weaker at 6.7 kV/cm than at the higher field strengths, with p < 0.01
    for the 50% bipolar pulses and p < 0.05 for the 100% bipolar pulses.
  source: Results 3.1, paragraph 2; Figure 2C
  quote: However, inhibition was weaker at 6.7 kV/cm (p<0.01 compared to the higher electric field
    strengths for 50% bipolar pulses, and p<0.05 for 100% bipolar pulses).
  datasets:
  - "000489"
  statistics:
  - about: 50% bipolar, 6.7 kV/cm against higher field strengths
    test: two-sided Student's t-test
    p: 0.01
    p_relation: "<"
  - about: 100% bipolar, 6.7 kV/cm against higher field strengths
    test: two-sided Student's t-test
    p: 0.05
    p_relation: "<"
  criterion: Bipolar dish YP as percent of the unipolar mean at the same ROI, as in
    fig2c-inhibition-flat-above-8-7. For 50% and for 100% bipolar pulses, the value at the ROI
    closest to 6.7 kV/cm is compared with the higher fields (ROI from 8.7 to 15.1 kV/cm) by a
    two-sided Student's t-test (Methods 2.5). "Compared to the higher electric field strengths" is
    read (i) against each higher field ROI and (ii) against the dish values of all higher field
