- id: fig3-uptake-linear-in-pulse-number
  statement: Uptake rose with field strength and with pulse number for both uni- and bipolar
    pulses, almost linearly with the number of pulses, so that plots for 5, 10 and 15 pulses look
    alike when the y-axis is scaled to 800, 1600 and 2400 a.u.
  source: Results 3.2, paragraph 1; Figure 3A to C and legend
  quote: Increasing the pulse number increased YP uptake almost linearly [ 15 ]. Therefore, YP
    uptake plots for 5, 10, and 15 pulses appeared almost identical when plotted with the y-axis
    scaled proportionally (to 800, 1600, and 2400 a.u., respectively).
  datasets:
  - "000489"
  expected:
  - quantity: YP for 10 pulses over YP for 5 pulses
    value: 2
    tolerance: 0.2
  - quantity: YP for 15 pulses over YP for 5 pulses
    value: 3
    tolerance: 0.3
  criterion: The expected 2 and 3 are read from the proportional axis limits and "almost
    linearly"; the paper prints no ratio. Mean YP per ROI along bb' for each pulse type and number,
    leaving out the ROI below the background cutoff the text gives for Fig. 3 ("<7-8 kV/cm",
