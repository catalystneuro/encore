- id: exc-touch-spikes-enphr
  statement: PV interneuron suppression does not change mean touch-evoked spiking of L4
    excitatory neurons significantly (0.27 to 0.32 spikes per touch, P = 0.09); its effect is
    heterogeneous, with weakly responding neurons responding more and strongly responding
    neurons unchanged or less.
  source: Results, Layer 4 FS interneurons suppress reafference in L4, paragraph 2; Figure 8e;
    Supplementary Figure 13b
  quote: PV interneuron suppression also modulated touch-evoked spiking in L4 excitatory neurons,
    but they did so in a heterogeneous manner (mean ± s.e.m., from 0.27 ± 0.06 spikes per touch to
    0.32 ± 0.06 spikes per touch, n = 40 neurons, P = 0.09, Wilcoxon signed-rank test; Fig. 8e and
    Supplementary Fig. 13). Neurons that responded weakly to touch tended to respond more strongly
    with PV interneuron suppression.
  statistics:
  - test: Wilcoxon signed-rank test
    p: 0.09
    n: 40 neurons
  expected:
  - quantity: spikes per touch, control
    value: 0.27
    tolerance: 0.06
  - quantity: spikes per touch, eNpHR
    value: 0.32
    tolerance: 0.06
  depends_on:
  - fs-suppress-movement-spiking
  criterion: >-
    Same 40 neurons. Spikes per touch by the Fig. 8e definition (4 to 20 ms after minus 0 to 16
    ms before onset; intertouch interval at least 10 ms), light against control trials. The
    absence of a mean change is judged on the paper's test, a Wilcoxon signed-rank test at
    0.05. Reproduced when it gives p >= 0.05 and both means are within tolerance; partially
    reproduced when p >= 0.05 and a mean is not within tolerance; not reproduced when it finds
    a change. The heterogeneity is described, not tested, in the paper; the change against the
    control value is shown per neuron (Fig. 8e) and reported.
- id: auc-weak-strong
  statement: Suppressing PV interneurons improves touch detection (AUC) for L4 excitatory neurons
    with weak touch responses and diminishes it for neurons with robust touch responses.
  source: Results, Layer 4 FS interneurons suppress reafference in L4, paragraph 3; Figure 8f,g
  quote: Consistent with the heterogeneous changes in spikes per touch, suppression of PV
    interneurons improved AUC for neurons with weak responses to touch and diminished AUC for
    neurons with robust responses to touch (Fig. 8f,g).
  depends_on:
  - fs-suppress-movement-spiking
  criterion: >-
    Same 40 neurons. ROC per neuron and condition (Online Methods): per trial, spike counts in
    250 ms before and after the first touch, or in the sample epoch for trials without touch;
    touch and no-touch periods resampled 5,000 times; AUC from the threshold sweep of the count
    difference. Which 250 ms windows of the sample epoch serve in no-touch trials is not given;
    readings (a) two adjacent 250 ms windows at a random time in the sample epoch; (b) the 250
    ms before and after the median first-touch time of touch trials. The touch-evoked rate is
    the mean rate 0 to 250 ms after minus 0 to 250 ms before touch, control trials (Fig. 8g
    legend). The paper gives no test; it groups neurons by the sign of the AUC change (Fig. 8h,
    19 increased, 21 reduced). Reproduced when the neurons whose AUC rises have a lower mean
    control touch-evoked rate (the Fig. 8g measure, after minus before) than those whose AUC
    falls, under both readings; not reproduced otherwise. The 3.4 and 7.3 spikes/s of Fig. 8h
    are rates 0 to 250 ms after touch without the baseline subtracted (auc-groups), a
    different measure, and are not the comparison here.
- id: auc-groups
  statement: Neurons whose AUC rose with PV suppression gained touch-evoked spiking (3.4 to 8.7
    spikes/s); neurons whose AUC fell kept their touch-evoked response (7.3 to 7.0 spikes/s) but
    had higher baseline rates (0.9 to 2.6 spikes/s).
  source: Results, Layer 4 FS interneurons suppress reafference in L4, paragraph 4; Figure 8h
  quote: L4 excitatory neurons with increased AUCs showed a population increase in touch-evoked
    responses on average (from 3.4 ± 0.8 spikes per s to 8.7 ± 1.9 spikes per s, P = 0.0001).
    Neurons with reduced AUC showed unchanged touchevoked responses as a population (from 7.3 ±
    1.5 spikes per s to 7.0 ± 1.4 spikes per s, P = 0.98, average 0–250 ms after touch onset) ...
    but elevated baseline spike rates (from 0.9 ± 0.2 spikes per s to 2.6 ± 0.6 spikes per s, mean
    ± s.e.m., P = 0.0002; Fig. 8f–h).
  statistics:
  - about: touch-evoked rate, control against eNpHR, neurons with increased AUC
    p: 0.0001
    n: 19 neurons (Fig. 8h)
  - about: touch-evoked rate, control against eNpHR, neurons with reduced AUC
    p: 0.98
    n: 21 neurons (Fig. 8h)
  - about: baseline rate, control against eNpHR, neurons with reduced AUC
    p: 0.0002
    n: 21 neurons (Fig. 8h)
  expected:
  - quantity: touch-evoked rate, increased-AUC group, control
    value: 3.4
    tolerance: 0.8
    unit: spikes/s
  - quantity: touch-evoked rate, increased-AUC group, eNpHR
    value: 8.7
    tolerance: 1.9
    unit: spikes/s
  - quantity: touch-evoked rate, reduced-AUC group, control
    value: 7.3
    tolerance: 1.5
    unit: spikes/s
  - quantity: touch-evoked rate, reduced-AUC group, eNpHR
    value: 7.0
    tolerance: 1.4
    unit: spikes/s
  - quantity: baseline rate, reduced-AUC group, control
    value: 0.9
    tolerance: 0.2
    unit: spikes/s
  - quantity: baseline rate, reduced-AUC group, eNpHR
    value: 2.6
    tolerance: 0.6
    unit: spikes/s
  - quantity: neurons whose AUC increased with eNpHR (Fig. 8h)
    value: 19
    tolerance: 1.9
    unit: of 40 neurons
  - quantity: neurons whose AUC was reduced with eNpHR (Fig. 8h)
    value: 21
    tolerance: 2.1
    unit: of 40 neurons
  depends_on:
  - auc-weak-strong
  criterion: >-
    Groups by the sign of the AUC change (auc-weak-strong, both readings). The touch-evoked
    response is the mean rate 0 to 250 ms after touch onset (as the sentence says); the baseline
    is the mean rate 0 to 250 ms before onset (Fig. 8g legend). Paired tests are Wilcoxon
    signed-rank (Online Methods). Reproduced when the increased-AUC group's rise and the
    reduced-AUC group's baseline rise give p < 0.05, the reduced-AUC group's touch response
    shows no change at 0.05, and the means and group sizes are within tolerance; partially
    reproduced when the three tests hold and a mean or a group size is not within tolerance;
    not reproduced otherwise.
- id: behavior-false-alarms
  statement: With PV interneurons suppressed, most mice (6 of 8) are more likely to report touch
    with the pole out of reach (false alarms on no-lick trials).
  source: Results, Layer 4 FS interneurons suppress reafference in L4, paragraph 6;
    Supplementary Figure 14b,c
  quote: with PV interneuron suppressed, most mice (6 of 8) were more likely to report touches with
    the pole out of reach (Supplementary Fig. 14). ... In 8 mice tested, 6 showed a significant
    decrease of performance during Nolick trials with PV interneuron inactivation
  expected:
    quantity: mice with a significant decrease of no-lick performance with light
    value: 6
    unit: of 8 mice
  criterion: >-
    For each of the 8 PV-IRES-Cre eNpHR mice, correct responses on no-lick (anterior pole)
    trials with and without light, compared by a chi-squared test at p < 0.05 (Supplementary
    Fig. 14c). Whether sessions of a mouse are pooled is not stated; readings (a) all of a
    mouse's trials pooled; (b) per session, a mouse counting when any session is significant.
    Nor is a continuity correction stated (answer of 2026-10-20); readings, each run with the
    others: (i) the Pearson chi-squared test without correction (what Matlab's crosstab, the
    paper's stated software, returns); (ii) with Yates's correction.
    Reproduced when 6 of 8 mice show a significant decrease under a reading (5 to 7 partially
    reproduced); not reproduced when fewer than 5 do.
- id: exc-inhibition-whisking
  statement: In L4 excitatory neurons held near 0 mV, inhibitory inputs occur spontaneously but
    are more prevalent at the onset of whisker movement; after whisking onset, excitation and
    inhibition increase gradually, with indistinguishable time courses, over about 100 ms.
  source: Results, Membrane-potential dynamics of L4 excitatory neurons, paragraph 3; Figure
    3e-g
  quote: In the absence of touch, inhibitory inputs occurred spontaneously but were more prevalent
    at onset of whisker movement (Fig. 3e,f). ... After the onset of whisker movement, excitation
    and inhibition increased gradually, with indistinguishable time courses, over approximately
    100 ms (Fig. 3g).
  depends_on:
  - exc-inhibition-timing
  criterion: >-
    The 6 L4 E neurons of exc-inhibition-timing. Whisking-onset-aligned average Vm at rest
    (excitation) and with current (inhibition, sign inverted), over the transitions of the
    Online Methods (Fig. 3e-g legend, "same as b-d" for whisking onset), each normalized to its
    peak after onset (Fig. 3g). The paper gives no test and no window for "more prevalent at
    onset"; it is read with the paper's whisking-onset windows (Supplementary Fig. 4 legend):
    with current, the mean Vm 100 to 300 ms after onset below the mean 0 to 200 ms before, in
    the grand average (Fig. 3f) and by a Wilcoxon signed-rank test over the 6 neurons at 0.05
    (the Methods' paired test). "Indistinguishable time courses" is a claim of absence with no
    test in the paper; it is judged by a Wilcoxon signed-rank test at 0.05 of the per-neuron
    times at which the normalized excitation and inhibition averages first reach half their
    peak. Reproduced when the inhibition increase holds and the half-maximum times do not
    differ; partially reproduced when only one part holds. The times to half and full peak of
    the normalized grand averages are reported against the paper's "approximately 100 ms". With
    6 neurons the smallest two-sided signed-rank p is 0.03, so the test has little power; this
    is reported.
- id: ion-cut-behavior
  statement: After infraorbital nerve transection, mice still search for the pole by whisking but,
    unable to sense it, perform the task at chance (48% correct).
  source: Results, Inhibition is driven by sensory input, paragraph 2
  quote: however, as they were unable to sense the object, ... they performed at chance level (48%
    correct).
  expected:
    quantity: proportion of correct trials in ION-cut mice
    value: 0.48
    tolerance: 0.048
  criterion: >-
    Trial outcomes of the behavioral sessions of the ION-cut mice (9 mice; Online Methods,
    Infraorbital nerve transection). The paper does not say how the 48% is averaged. Readings,
    each run: (a) all ION-cut trials pooled; (b) the mean over recorded cells of the proportion
    correct during each recording, as the Methods average control performance (Online Methods,
    Behavior). Reproduced when the proportion is within tolerance under a reading; not
    reproduced otherwise. The whisking part ("similar whisking amplitudes", data not shown) is
    not tested; whisking amplitudes in ION-cut and control sessions are reported.
