# Claims for Yu, Gutnisky, Hires & Svoboda (2016), Nat. Neurosci. 19, 1647-1657, on dandiset
# 000005 ("Electrophysiology data from thalamic and cortical neurons during somatosensation").
#
# Provenance. Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions),
# 2026-10-20, protocol as stated in docs/protocol.md (version pilot-10), Reader steps 1 to 4.
#
# What changed. This file replaces a deprecated version whose claims were written from the
# abstract only, with cell types and every measure chosen by the earlier author (proxy FS and
# excitatory classes, a 6 to 30 Hz whisking band, a touch-selectivity index, Rayleigh and
# harmonic phase tests). Read against the full text on 2026-10-20, the criteria of
# exc-mainly-touch and fs-enhance-touch-selectivity tested measures the paper does not use, and
# seven or more of the paper's findings on these data had no claim. Every claim is written again
# here from the full text: statements, sources, quotes, statistics, expected values and criteria
# all come from the paper. The ids of the eight earlier claims are kept where the finding is the
# same (vpm-touch, vpm-whisking, fs-touch-and-whisking, exc-mainly-touch,
# fs-suppress-movement-spiking, fs-enhance-touch-selectivity, thalamus-drives-fs,
# sensory-input-drives-fs), so the outcomes can be compared; their criteria are new. The
# earlier file's amendments and its proxy cell classes no longer apply. The new claims are
# vpm-whisking-phase, exc-vm-touch-whisking, exc-threshold-touch-vs-whisking,
# exc-effective-reversal, exc-inhibition-timing, fs-touch-response, fs-vm-touch-whisking,
# fs-whisking-rate, fs-whisking-phase, vpm-photoinhibition, exc-thalamus-photoinhibition,
# rabies-vpm-input, ion-cut-exc-no-touch, ion-cut-exc-whisking, ion-cut-exc-phase,
# ion-cut-fs-no-touch, ion-cut-fs-phase, pv-enphr-suppression, exc-touch-spikes-enphr,
# auc-weak-strong, auc-groups, behavior-false-alarms and behavior-touches. The check of
# 2026-10-20 added exc-inhibition-whisking and ion-cut-behavior (see checks, at the end).
# This reader did not see the dandiset's data. It did read the deprecated file, whose opening
# comment reports some outputs of the earlier attempt's first run under its own proxy measures;
# no criterion below was set from them.
#
# Text read. The version of record (PDF supplied by a person, text extracted 2026-10-20, under
# paper/), with its Online Methods and its one supplement PDF (Supplementary Figures 1 to 14 and
# Supplementary Tables 1 and 2). PDF pages were opened only to read Supplementary Table 2, the
# boundary drawn in Supplementary Figure 6, the number of phase bins in Supplementary Figure 2d,
# and the P values printed in Figure 8d, which the text garbles or does not give.
#
# Code. The paper's data and code statement points to CRCNS ssc-7 (doi:10.6080/K0T43R01). Its
# public pages (read 2026-10-20) describe NWB 1.0.6 data files and a data-description document;
# no analysis code is listed and the download needs an account, so no code was read. Every
# method below comes from the Online Methods, the figure legends or the supplement.
#
# The data the paper used (Online Methods; Supplementary Table 2).
# - Head-fixed mice performing a lick/no-lick object localization task with 1 to 3 spared
#   whiskers of one row; a pole in an anterior (no-lick) or one of several posterior (lick)
#   locations; whisker angle and curvature from 1,000 fps video (Janelia Whisker Tracker); touch
#   onsets and offsets of the principal whisker; licks; trial outcome. Videos are 5 s per trial.
# - VPM: 29 single units from chronic silicon probes (4 x 8 sites, 19,531.25 Hz) in 6
#   VGAT-ChR2-EYFP mice, each with a mapped principal whisker (Figs. 1, 5).
# - L4 excitatory (E) neurons, 85 in control mice (Fig. 5): 37 whole-cell (Vm, 10 or 20 kHz)
#   and 48 loose-seal cell-attached recordings, in VGAT-ChR2-EYFP, PV-IRES-Cre (eNpHR3.0),
#   PV-IRES-Cre x Ai32, C57BL/6 and SOM-IRES-Cre x Ai32 mice (Supplementary Table 2).
# - L4 FS interneurons, 26 in control mice per the Results and Methods (19 ChR2-tagged in
#   VGAT-ChR2-EYFP mice, 5 whole-cell and 14 cell-attached; 4 eNpHR-inactivated in PV-IRES-Cre
#   mice; 3 by waveform); Supplementary Figure 7 and Table 2 list 25. 7 were whole-cell.
# - Thalamic photoinhibition: optic fiber in VPM of VGAT-ChR2-EYFP mice (10 mice), 5 ms pulses at
#   100 Hz (Supplementary Fig. 9i), light in 25 to 50% of trials; 17 VPM multiunits recorded by
#   pipette; L4 FS (13 to 15) and E neurons (12 whole-cell) recorded with and without light.
# - ION transection (9 mice): 9 or 10 L4 E neurons whole-cell and 10 L4 FS neurons cell-attached.
# - PV suppression: eNpHR3.0 in PV neurons of PV-IRES-Cre mice (9 injected), constant 594 nm
#   light at the cortex on a subset of trials; 40 L4 E neurons and 4 L4 PV neurons; behavior of
#   8 mice (Supplementary Fig. 14).
# - Rabies tracing from L4 PV neurons (PV-IRES-Cre x Ai9; histology, Supplementary Fig. 10).
#
# Cell types. Recordings at manipulator depth 420 to 620 um count as L4 when unlabeled (Online
# Methods, Barrel cortex recordings). FS interneurons are cells driven by 5 ms light pulses within
# 5 ms of onset in VGAT-ChR2-EYFP mice and inside the waveform boundary of Supplementary Figure 6,
# or PV cells inactivated by eNpHR, or the few identified by waveform and rate (Online Methods).
# The boundary of Supplementary Figure 6 is drawn, not given in numbers; read from the figure it
# lies near spike duration 0.27 ms and peak-to-trough ratio 2.8 (an approximate reading). Other
# L4 cells are excitatory (Fig. 8e legend, "putative excitatory neurons"). Where the dandiset
# labels cell types, the author uses its labels and reports how they map onto these rules.
#
# Measures used by the criteria, each from the paper.
# - Touch. Touches of the principal whisker only; onsets pooled across pole locations;
#   intertouch interval (offset of the previous touch to onset of the next) at least 25 ms for
#   Figs. 1 to 7 and at least 10 ms for Fig. 8e (Online Methods, Data analysis; Behavior).
# - Spikes per touch. Cortical neurons (Fig. 5) spikes 0 to 50 ms after touch onset minus 2 x the
#   spikes 0 to 25 ms before; cortical neurons (Fig. 8e) spikes 4 to 20 ms after minus spikes 0
#   to 16 ms before; VPM spikes 0 to 25 ms after minus 0 to 25 ms before; averaged over touches
#   (Online Methods, Data analysis). 95% confidence interval by bootstrap (Fig. 5b legend), 1,000
#   iterations (the number the Methods give for rate intervals).
# - Spike latency. Touch PSTH in 1 ms bins; latency is the time from touch onset to the crossing
#   by dPSTH/dt of 3 x the s.d. of dPSTH/dt 0 to 25 ms before onset; cells with no 1 ms bin of
#   at least 10 spikes/s within 0 to 100 ms, or with no crossing, are left out (Online Methods).
# - Whisking. Whisker angle band-passed 6 to 60 Hz (4th-order Butterworth), Hilbert transform
#   for amplitude and phase (phase 0 most protracted, +-pi most retracted). Whisking epochs are
#   whisking cycles whose amplitude at phase 0 exceeds 2.5 degrees, leaving out +-100 ms around
#   licks and -10 to 100 ms around touches. Nonwhisking periods are periods of at least 100 ms
#   with amplitude below 1.25 degrees and no touch or lick. Whisking onsets (transitions) are ends
#   of nonwhisking periods followed by a rise of mean amplitude of at least 2 degrees with no touch
#   within 250 ms (Online Methods, Data analysis). The windows of that rise and the touches that
#   bound epochs and onsets are open (O10, O11).
# - Rates. Spike rate in nonwhisking and in whisking periods from the extracted epochs, with a
#   1,000-iteration bootstrap interval (Online Methods; Fig. 5d legend).
# - Phase coupling. Spike rate (or Vm) in phase bins during whisking epochs, fitted by a sinusoid;
#   r2 > 0.25 marks coupling (Supplementary Figs. 2e,f, 3f,g and 12a); coupling strength is half
#   the peak-to-trough of the fit (Online Methods). For FS cells a sum of a sinusoid and one of
#   twice the frequency is used when its r2 is 50% higher (Supplementary Fig. 7g). Supplementary
#   Figure 2d shows 12 phase bins over -pi to pi (read from the figure; the text gives none).
# - Vm. Spikes removed by interpolating Vm from 1 ms before to 4 ms after each spike; spike
#   threshold where dVm/dt exceeds 3 s.d. of the trial's dVm/dt; each trial's threshold from a
#   linear fit of threshold against trial number; -42 mV for silent neurons. Distance to
#   threshold is threshold minus Vm over all time, its 10th percentile taken separately in
#   nonwhisking, whisking and touch epochs (4 to 50 ms after touch onset). Touch PSP latency is
#   where dVm/dt of the touch-aligned average crosses 3 x the s.d. of dVm/dt 0 to 25 ms before
#   onset (Online Methods, Data analysis). Pre-touch Vm is the mean 0 to 5 ms before onset and the
#   post-touch Vm is at the peak of the average PSP; pre-whisking Vm is the mean 0 to 200 ms
#   before whisking onset and post-whisking Vm the mean 100 to 300 ms after (Supplementary Fig.
#   4 legend).
# - Tests. Wilcoxon rank-sum (unpaired), Wilcoxon signed-rank (paired), Kruskal-Wallis (Online
#   Methods, Statistical analysis). Where a P is printed without a test, the test is the one the
#   Methods give for that design. The paper states no significance level; it calls P = 0.046
#   significant and P = 0.09 and 0.20 not significant, so 0.05 is used.
#
# Tolerances. Where the paper gives mean +- s.e.m., the s.e.m. Where it gives mean +- s.d. over n
# cells, the larger of 10% of the value and s.d./sqrt(n): the s.d. is the spread across cells,
# not the uncertainty of the mean, and s.d./sqrt(n) is the standard error those numbers imply.
# Otherwise 10% of the value; counts get 10% of the count.
#
# Details the paper leaves open, with the readings each criterion runs (all are run; the outcome
# is the one they all give, or the claim is methods_underspecified).
# - O1 Filter direction of the 6 to 60 Hz band-pass. (a) zero-phase (forward and backward);
#   (b) single forward pass.
# - O2 Samples of the per-neuron rank-sum test of whisking against nonwhisking rate. (a) the rate
#   in each whisking epoch against the rate in each nonwhisking period; (b) per trial, the rate
#   in whisking epochs against that in nonwhisking periods.
# - O3 The spike-threshold rule "exceeded 3x s.d. of mean dVm/dt". (a) dVm/dt above its trial
#   mean by 3 s.d.; (b) dVm/dt above 3 s.d.
# - O4 Resting Vm. (a) mean Vm in nonwhisking periods, spikes removed; (b) median of the same.
# - O5 Light comparison windows. (a) epochs of light trials inside the light, against epochs of
#   control trials inside the same span of trial time; (b) against epochs anywhere in control
#   trials.
# - O6 "% of control". (a) the population mean with light over the population mean without;
#   (b) the median over cells of each cell's ratio.
# - O7 Laser powers of the thalamic photoinhibition (dose-dependent, Supplementary Fig. 9i,j).
#   (a) all powers pooled; (b) the highest power only.
# - O8 Phase of the derivative-based latencies. The text fixes 1 ms bins for spike PSTHs only and
#   gives no smoothing; dPSTH/dt is the first difference of the unsmoothed 1 ms PSTH. dVm/dt is
#   the first difference of the unsmoothed Vm average at the recording's sampling rate, not in
#   1 ms bins: the paper's Vm latencies (median 4.7 ms of 37 cells and 4.2 ms of 7 cells, each
#   one cell's value; laser-onset latencies 4.2 and 2.8 ms) are not on a 1 ms grid (answer of
#   2026-10-20).
# - O9 Time given to a crossing found in 1 ms PSTH bins (not stated). (a) the left edge of the
#   bin; (b) its centre, 0.5 ms later.
# - O10 Whisking onsets, the windows over which the rise of mean amplitude by 2 degrees is judged
#   (not stated). (a) 100 to 300 ms after the end of the nonwhisking period against 0 to 200 ms
#   before it (the whisking-onset windows of the Supplementary Fig. 4 legend); (b) 0 to 250 ms
#   after it (the touch-free span of the same rule) against the whole nonwhisking period.
# - O11 Touches that bound whisking epochs and onsets (not stated). Whiskers (a) every tracked
#   whisker, (b) the principal whisker; span (i) 10 ms before touch onset to 100 ms after touch
#   offset, (ii) 10 ms before to 100 ms after touch onset.
# Which cells enter each n (40 of the 43 E cells in PV-IRES-Cre mice; 13 to 15 FS cells in the
# thalamic experiment) the paper does not say beyond the counts; cells enter a comparison when
# they have epochs of each kind compared, and the counts are reported against the paper's.
schema_version: 2
dataset:
  archive: dandi
  id: "000005"
paper: doi:10.1038/nn.4412
claims:
- id: behavior-touches
  statement: Mice touched the pole often when it was within reach (lick trials, 5.7 +- 5.3
    touches per trial over 4,147 trials) and rarely when it was distal (0.9 +- 3.4 over 4,173
    trials); performance was 0.72 +- 0.11 in cortical and 0.71 +- 0.07 in VPM recordings.
  source: Online Methods, Behavior, paragraph 2
  quote: Mice touched the pole at a proximal location multiple times (number of touches ... Mice
    touched the pole at a distal location less often (number of touches, 0.9 ± 3.4, mean ± s.d.,
    4,173 trials) and withheld licking. Average performance (proportion of correct trials) was 0.72
    ± 0.11 (mean ± s.d., during the recordings of 111 cells) for cortical recordings and 0.71 ±
    0.07 for VPM recordings (during the recordings of 29 cells).
  expected:
  - quantity: touches per trial, pole within reach (posterior, lick trials)
    value: 5.7
    tolerance: 0.57
  - quantity: touches per trial, pole distal (anterior, no-lick trials)
    value: 0.9
    tolerance: 0.09
  - quantity: proportion correct during cortical recordings (111 cells)
    value: 0.72
    tolerance: 0.072
  - quantity: proportion correct during VPM recordings (29 cells)
    value: 0.71
    tolerance: 0.071
  criterion: >-
    Touches counted per trial and split by pole position (Online Methods, Behavior).
    Performance is the proportion of correct trials per recording, averaged over the 111
    control cortical cells (85 E and 26 FS, Fig. 5) and separately over the 29 VPM units. The
    paper does not say which recordings the touch counts and their trial counts (4,147 and
    4,173) come from, nor whether they count touches of the principal whisker only (the
    Methods restrict touch responses to it, not touch counts). Readings, each run: recordings
    (a) the trials of the 111 control cortical cells, (b) all behavioral sessions of the
    dandiset (cortical, VPM, ION-cut and eNpHR control trials); whiskers (i) principal whisker
    only, (ii) any tracked whisker. Nor does it say whether trials with light (thalamic or
    eNpHR) enter the touch counts or the performance (answer of 2026-10-20); light readings,
    each run with the others: (x) every trial, (y) trials without light only. The trial counts
    under each reading are reported against 4,147 and 4,173. Reproduced when every expected value is within tolerance under a reading;
    partially reproduced when the touch counts are and a performance value is not, or the
    reverse.
- id: vpm-touch
  statement: VPM neurons respond to active touch with a sharp, short-latency increase in spike
    rate (0.6 +- 0.5 spikes per touch, median 0.4; latency 3.2 +- 1.0 ms, median 2.5 ms).
  source: Results, Chronic extracellular recordings from somatosensory thalamus, paragraph 1;
    Figure 1b,d; Figure 5b,c
  quote: Neurons responded to active touch during behavior with an increase in spike rate (Fig. 1b).
    The peristimulus time ... histogram aligned to touch onset showed a sharp peak in spike rate
    (mean ± s.d., 0.6 ± 0.5 spikes per touch; median, 0.4 spikes per touch), with short latency
    after touch onset (mean ± s.d., 3.2 ± 1.0 ms; median, 2.5 ms)
  expected:
  - quantity: mean VPM spikes per touch (29 neurons)
    value: 0.6
    tolerance: 0.093
  - quantity: median VPM spikes per touch
    value: 0.4
    tolerance: 0.04
  - quantity: mean VPM touch latency
    value: 3.2
    tolerance: 0.32
    unit: ms
  - quantity: median VPM touch latency
    value: 2.5
    tolerance: 0.25
    unit: ms
  criterion: >-
    Over the 29 VPM units, spikes per touch by the VPM definition (0 to 25 ms after minus 0 to
    25 ms before onset) and spike latency by the dPSTH/dt rule, on principal-whisker touches with
    intertouch interval at least 25 ms (Online Methods, Data analysis; header, Measures). The
    latency n is the units that pass the Methods' exclusion; the paper does not print it. Filter
    readings O1 do not enter (no whisking measure); latency readings O8 and O9 (a) left edge and
    (b) centre of the crossing bin, which the paper does not fix. Reproduced when all four
    values are within tolerance; partially reproduced when the spikes-per-touch values are and a
    latency value is not.
- id: vpm-whisking
  statement: VPM neurons fire at 5.1 +- 5.5 spikes/s without whisker movement or touch; most
    (25 of 29) increase their rate during whisking without touch, and the mean rate rises from
    5.1 to 13.5 spikes/s. Three of 29 do not increase with whisking but still respond to touch.
  source: Results, Chronic extracellular recordings from somatosensory thalamus, paragraphs 1 and
    2; Figure 1c,e; Figure 5d,e; Supplementary Figure 2b,c
  quote: Typical VPM neurons showed significant spike rates (mean ± s.d., 5.1 ± 5.5 spikes per s;
    median, 3.3 spikes per s; n = 29 neurons), even in the absence of whisker movement and touch.
    ... Most VPM neurons increased their spike rate during whisking in the absence of touch (25 out
    of 29 neurons ... The average spike rate increased severalfold after onset of whisker movement
    (from 5.1 ± 5.5 spikes per s to 13.5 ± 12.7 spikes per s; P = 4 × 10−6; n = 29 neurons,
    Wilcoxon signed-rank test
  statistics:
  - about: nonwhisking against whisking spike rate over VPM neurons
    test: Wilcoxon signed-rank test
    p: 4.0e-6
    n: 29 neurons
  expected:
  - quantity: VPM neurons with a significant increase of rate during whisking
    value: 25
    tolerance: 2.5
    unit: of 29 neurons
  - quantity: mean nonwhisking rate
    value: 5.1
    tolerance: 1.02
    unit: spikes/s
  - quantity: median nonwhisking rate
    value: 3.3
    tolerance: 0.33
    unit: spikes/s
  - quantity: mean whisking rate
    value: 13.5
    tolerance: 2.36
    unit: spikes/s
  criterion: >-
    Over the 29 VPM units, the rate in nonwhisking periods and in whisking epochs (Online
    Methods; header, Measures). A unit increases when a Wilcoxon rank-sum test of whisking
    against nonwhisking rate gives p < 0.05 with the whisking rate higher (Results, the test
    named for the 25 of 29), under samples O2 (a) and (b) and filters O1 (a) and (b). The
    population test is a Wilcoxon signed-rank test of per-unit nonwhisking against whisking rate.
    The text gives the 13.5 spikes/s as the rate "after onset of whisker movement"; it is read
    as the whisking-epoch rate, the quantity Fig. 5d plots for these units, since the paper
    defines no spike-rate window after whisking onset.
    Reproduced when the signed-rank test gives p < 0.05 with whisking higher and the expected
    values are within tolerance; partially reproduced when the test holds and a value is not
    within tolerance; not reproduced when the test fails.
- id: vpm-whisking-phase
  statement: The spike rate of VPM neurons is modulated by the phase of whisker movement.
  source: Results, Chronic extracellular recordings from somatosensory thalamus, paragraph 2;
    Supplementary Figure 2d-f
  quote: The spike rate was modulated by the phase of the movement (Supplementary Fig. 2d).
  depends_on:
  - vpm-whisking
  criterion: >-
    For each VPM unit, spike rate in 12 phase bins during whisking epochs (Supplementary Fig.
    2d, bins read from the figure), fitted with a sinusoid; a unit is phase modulated when r2 >
    0.25 (Supplementary Fig. 2e,f). The paper gives no count; its histogram (Supplementary Fig.
    2e) has most of the 29 units above 0.25 (about 23 to 26, read from the bars). Reproduced
    when more than half of the 29 units have r2 > 0.25 under both filter readings O1; not
    reproduced otherwise. The number above 0.25 and the coupling strengths are reported.
- id: exc-vm-touch-whisking
  statement: In L4 excitatory neurons (37 whole-cell), resting Vm spans -76 to -45 mV (-63 +- 8
    mV); every neuron depolarizes after touch (latency 4.8 +- 0.8 ms, amplitude 6.0 +- 2.9 mV),
    while whisking causes only a small depolarization or hyperpolarization (1.2 +- 2.1 mV).
  source: Results, Membrane-potential dynamics of L4 excitatory neurons, paragraph 2; Figure 2f
  quote: >-
    Across the excitatory population, the resting membrane potential (Vm) spanned a large range
    (−76 to −45 mV, mean ± s.d., −63 ± 8 mV; median, −64 mV, n = 37 neurons ... Touches evoked
    short-latency depolarizations (latency: mean ± s.d., 4.8 ± 0.8 ms; median, 4.7 ms; amplitude:
    mean ± s.d., 6.0 ± 2.9 mV; median, 5.7 mV; n = 37 neurons) for all neurons (Fig. 2f) ...
    Whisking induced small depolarization or hyperpolarization (mean ± s.d., 1.2 ± 2.1 mV; median,
    1.2 mV; Fig. 2f)
  expected:
  - quantity: mean resting Vm
    value: -63
    tolerance: 6.3
    unit: mV
  - quantity: mean touch PSP latency
    value: 4.8
    tolerance: 0.48
    unit: ms
  - quantity: mean touch PSP amplitude
    value: 6.0
    tolerance: 0.6
    unit: mV
  - quantity: mean whisking-evoked Vm change
    value: 1.2
    tolerance: 0.35
    unit: mV
  criterion: >-
    The 37 whole-cell L4 E neurons of control mice. Touch-aligned average Vm (spikes removed)
    over principal-whisker touches with intertouch interval at least 25 ms; latency by the
    dVm/dt rule, with dVm/dt at the recording's sampling rate (10 or 20 kHz), not in 1 ms bins
    (reading O8; the paper's median latency, 4.7 ms over 37 cells, is one cell's value and not a
    whole millisecond; answer of 2026-10-20); amplitude is the peak of the average minus the mean 0 to 5 ms
    before onset (Supplementary Fig. 4 legend). The paper does not say how the whisking change
    (1.2 +- 2.1 mV) is measured. Readings, each run: (a) the mean Vm 100 to 300 ms after
    whisking onset minus the mean 0 to 200 ms before, averaged over onsets (Supplementary Fig.
    4 legend windows; Fig. 2f shows whisking-onset-aligned averages); (b) the mean Vm in
    whisking epochs minus the mean Vm in nonwhisking periods (Online Methods epochs), spikes
    removed. Resting Vm by O4 (a) and (b). Whisking onsets and epochs by readings O10 and O11,
    which the paper leaves open (answer of 2026-10-20). Reproduced when a touch latency is found in
    every neuron with a positive amplitude and the four values are within tolerance; partially
    reproduced when every neuron depolarizes and a value is out of tolerance.
- id: exc-threshold-touch-vs-whisking
  statement: Touch moves the membrane potential of L4 excitatory neurons much closer to spike
    threshold than whisking does (shift 6.1 +- 3.2 mV against 1.1 +- 2.0 mV).
  source: Results, Membrane-potential dynamics of L4 excitatory neurons, paragraph 2; Figure 2g,h
  quote: Compared to whisking, touch caused a larger shift of membrane potential toward spike
    threshold (whisking, 1.1 ± 2.0 mV; touch, 6.1 ± 3.2 mV; P = 1 × 10−7, Wilcoxon signed-rank test;
    Fig. 2g,h)
  statistics:
  - about: touch against whisking shift toward threshold
    test: Wilcoxon signed-rank test
    p: 1.0e-7
    n: 37 neurons
  expected:
  - quantity: mean whisking shift toward threshold
    value: 1.1
    tolerance: 0.33
    unit: mV
  - quantity: mean touch shift toward threshold
    value: 6.1
    tolerance: 0.61
    unit: mV
  criterion: >-
    For each of the 37 whole-cell L4 E neurons, the 10th percentile of distance to threshold in
    nonwhisking, whisking and touch epochs (Online Methods; header, Measures), with threshold
    readings O3 (a) and (b) and filters O1. The shift is the nonwhisking value minus the
    whisking (or touch) value (Fig. 2h compares these percentiles across periods; the baseline
    period is the paper's nonwhisking period). Reproduced when the touch shift exceeds the
    whisking shift by a Wilcoxon signed-rank test at p < 0.05 and both means are within
    tolerance; partially reproduced when only the test holds.
- id: exc-effective-reversal
  statement: The effective reversal potential of the touch response of L4 excitatory neurons is
    more depolarized than resting Vm, while that of whisking is close to rest and more
    hyperpolarized than that of touch.
  source: Results, Membrane-potential dynamics of L4 excitatory neurons, paragraph 2;
    Supplementary Figure 4
  quote: of the touch response was more depolarized than the resting Vm and sometimes crossed the
    spike threshold ... In contrast, the effective reversal potential for whisker movement was
    close to the resting Vm, below the spike threshold and more hyperpolarized than that for touch
  criterion: >-
    Per Supplementary Fig. 4 legend. For each touch, pre-Vm is the mean 0 to 5 ms before onset
    and post-Vm the Vm at the peak time of the neuron's average PSP; for each whisking onset,
    pre-Vm the mean 0 to 200 ms before and post-Vm the mean 100 to 300 ms after. dVm = post minus
    pre, fitted linearly against pre-Vm; the reversal is where the line crosses zero. The legend
    leaves open whether one line is fitted per neuron or over all neurons (panel b shows all
    neurons, panel c compares reversals). Readings (a) per neuron, compared across the 37
    neurons; (b) one pooled fit per event type. The paper reports no test. Reproduced when, under
    the reading, the touch reversal lies above the whisking reversal (in more than half of the
    neurons and in the medians for a) and above the median resting Vm; not reproduced otherwise.
- id: exc-inhibition-timing
  statement: With L4 excitatory neurons depolarized near 0 mV to reveal inhibition, touch evokes
    strong, transient inhibition that follows excitation by 0.4 +- 0.8 ms at half maximum.
  source: Results, Membrane-potential dynamics of L4 excitatory neurons, paragraph 3; Figure
    3b-d
  quote: Touch elicited strong and transient inhibitory input (Fig. 3b,c), which followed excitation
    with a short delay (mean ± s.d., 0.4 ± 0.8 ms at half max; n = 6 neurons; Fig. 3d).
  expected:
    quantity: mean delay of inhibition after excitation at half maximum
    value: 0.4
    tolerance: 0.33
    unit: ms
  criterion: >-
    The 6 L4 E neurons recorded both at rest and with steady depolarizing current (about 1 nA,
    baseline near 0 mV; Online Methods, Barrel cortex recordings). For each, the touch-aligned
    average Vm at rest (excitation) and with current (inhibition, sign inverted), each
    normalized to its peak (Fig. 3d); the time at which each first reaches half its peak after
    onset; the delay is inhibition minus excitation. Trials at depolarized potential are those
