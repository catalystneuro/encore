  statistics:
  - about: nonwhisking against whisking rate in eNpHR trials (Fig. 8d)
    p: 0.02
    n: 40 neurons
  - about: nonwhisking against whisking rate in control trials (Fig. 8d, printed in the figure)
    p: 0.55
    n: 40 neurons
