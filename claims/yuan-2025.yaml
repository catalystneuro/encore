  statement: In IMPG2, p.Cys1019Tyr replaces the polar bond of Cys1019 with Ser1023 and its
    hydrogen bond with Cys1036 by new bonds with Ser1023, Gln1017 and Cys1025; p.Leu249Phe loses
    the hydrogen bonds of Leu249 with Val305, Lys252, Leu373 and Val307; p.Arg131Cys loses the
    hydrogen bond with Tyr134 and a van der Waals interaction.
  source: Results, 3.5, paragraphs 3 to 5; Figure 4C to 4E
  quote: In the reference protein, Cysteine 1019 interacts with Serine 1023 through polar bonds and
    with Cysteine 1036 via hydrogen bonds ( Figure 4 C). In the mutant protein, Tyrosine 1019
    replaces Cysteine 1019, disrupting these original interactions. Instead, Tyrosine 1019
    forms new bonds with Serine 1023, Glutamine 1017, and Cysteine 1025.
  data: with_inputs
  criterion: Uses outside tools (DynaMut on re-predicted I-TASSER models, as for
