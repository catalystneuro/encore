# Claims for Yuan, Chatterjee, Leys, Odom & Salido (2025), Genes 16(1):43, on dandiset 001882.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record (MDPI Genes, open access), full text as served by Europe PMC
# (PMC11764596): Introduction, Methods, Results, Discussion, the legends of Figures 1 to 4 and
# Tables 1 to 4 inline. No PDF was supplied; the tables were read from the text, where they
# are flattened but legible. The paper names no supplementary material, and none was used. It
# links no analysis code; no code was read. Its Data Availability Statement says "No new data
# were created or analyzed in this study", although the dandiset is described by the paper.
#
# The dataset (title "SalidoLab 2024.Genes paper. WVU humans with IMPG1/2 mutations") is
# meant to hold the patient data of this paper. Its data were not looked at.
#
# Data the paper used, as it reports them:
# - Cohort. 480 patients with inherited retinal diseases (IRDs) seen at the IRDs Clinic,
#   Department of Ophthalmology and Visual Sciences, West Virginia University, March 2015 to
#   June 2024. All had next-generation sequencing panels from various laboratories; the seven
#   patients described were tested by INVITAE (248 to 330 retinal dystrophy genes).
# - Seven patients with IMPG1 or IMPG2 variants, named by sex and age: F32, M83 (retinitis
#   pigmentosa, RP), M75, M82, M73, F57, M34 (vitelliform macular dystrophy, VMD). Table 1 gives
#   for each the gene, cDNA and protein change, zygosity and inheritance, mutation type,
#   diagnosis and best corrected visual acuity (BCVA, Snellen) of each eye (OD right, OS left).
# - Measures per patient and eye. BCVA (Snellen charts); color fundus photography (FF) and
#   fundus autofluorescence (FAF) on an Optos system; fluorescein angiography (FA, also written
#   FFA) and spectral domain optical coherence tomography (SD-OCT) on a Heidelberg Spectralis;
#   Goldmann visual fields (GVF) for the RP patients. The Discussion also cites an
#   electro-oculogram (EOG) for M73. Figure 2 shows the RP patients, Figure 3 the VMD patients,
#   right eye above and left eye below.
# - In silico analyses of the variants, which use no patient recordings: pathogenicity scores
#   (SIFT, PolyPhen-2, MutationTaster, CADD, FATHMM; Table 2), stability changes (mCSM, SDM,
#   DUET, iMutant, MuPRO; Table 3), interatomic interactions (DynaMut on I-TASSER models;
#   Figure 4) and physicochemical properties of IMPG1 (ExPASy ProtParam; Table 4). Population
#   frequencies come from gnomAD. None of the models or tool outputs is said to be deposited.
#
# The paper reports no statistical test or interval for any finding; no claim has statistics.
schema_version: 2
dataset:
  archive: dandi
  id: "001882"
paper: doi:10.3390/genes16010043
claims:
- id: cohort-prevalence
  statement: Of 480 IRD patients in the cohort, 7 (1.45%) carried IMPG1 or IMPG2 mutations; 2
    (0.41%) were diagnosed with RP and 5 (1.04%) with VMD.
  source: Results, opening paragraph (before 3.1)
  quote: In our study, 7 out of 480 patients with IRDs (1.45%) were found to have mutations in IMPG
    genes. Of these, two patients (0.41%) were diagnosed with RP, while five patients (1.04%)
    exhibited characteristics of VMD.
  expected:
  - quantity: patients with IMPG1 or IMPG2 mutations
    value: 7
    tolerance: 0
  - quantity: cohort size
    value: 480
    tolerance: 0
  - quantity: patients with IMPG mutations among IRD patients
    value: 1.45
    tolerance: 0.145
    unit: percent
  - quantity: patients with RP among IRD patients
    value: 0.41
    tolerance: 0.041
    unit: percent
  - quantity: patients with VMD among IRD patients
    value: 1.04
    tolerance: 0.104
    unit: percent
  criterion: Counts are of patients and must match exactly (tolerance 0, as a count of people
    has no measurement error); percentages take the default 10%. The carriers and their
    diagnoses are counted from the dataset; the denominator of 480 is the cohort of Methods 2.1
    (IRDs Clinic, March 2015 to June 2024). If the dataset holds only the seven carriers, the
    numerators are tested and the denominator is recorded as taken from the paper. The paper
    prints 1.45% and 0.41% where 7/480 and 2/480 give 1.458% and 0.417%; both truncation and
    rounding fall within tolerance, so this does not change the outcome. The Discussion's "1 in
    68" is 480/7 and is tested with the same counts.
- id: all-caucasian
  statement: All seven patients with IMPG mutations were Caucasian.
  source: Results, opening paragraph (before 3.1)
  quote: All seven patients with IMPG mutations were Caucasian.
  criterion: Reproduced when the dataset records race or ancestry as Caucasian (white,
    European) for all seven patients; not reproduced when any is recorded otherwise; blocked
    when the dataset does not record it.
- id: table1-genotypes
  statement: The seven patients carry the variants of Table 1 (F32 IMPG1 c.2218C>T p.Leu740Phe
    heterozygous; M83 IMPG2 c.3056G>A p.Cys1019Tyr and c.391C>T p.Arg131Cys, compound
    heterozygous; M75 IMPG1 c.1269C>A p.Asp423Glu heterozygous; M82 IMPG2 c.745C>T p.Leu249Phe
    heterozygous; M73 and F57 IMPG2 c.2890C>T p.Arg964* heterozygous; M34 IMPG2 c.3262C>T
    p.Arg1088* heterozygous).
  source: Table 1; Results, opening paragraph (before 3.1)
  quote: All the patients are represented in Table 1.
  criterion: For each of the seven patients, the gene, cDNA change, protein change and
    zygosity in the dataset are compared with Table 1. Table 1 writes the gene of F32 as "IMGP1";
    the text (3.1, Figure 1) makes it IMPG1, and IMPG1 is the reading used. Reproduced when all
    seven patients match in every field; partially reproduced when some but not all do; not
    reproduced when none does. Reference transcripts are not named in the paper, so a cDNA
    position that differs only by a transcript offset, with the same protein change, is
    reported and counted as a match.
- id: table1-diagnosis-sex-age
  statement: F32 (female, 32 years) has sectoral RP and M83 (male, 83) RP; M75 (male, 75), M82
    (male, 82), M73 (male, 73), F57 (female, 57) and M34 (male, 34) have VMD.
  source: Table 1
  inferred: Sex, age and diagnosis per patient are read from Table 1 and the patient
    identifiers; no single sentence states them all.
  criterion: Diagnosis and sex must match exactly for each patient. Age is the number in the
    identifier and the "N-year-old" of section 3; the paper does not say at which date it was
    taken. Readings allowed by the text are (a) age at the most recent visit, the visit whose
    BCVA is reported for M83 and M75, and (b) age at data collection for the study (2024). Age
    takes the default tolerance of 10%. Reproduced when diagnoses and sexes all match and ages
    match under one reading; partially reproduced when diagnoses match but sex or age does not
    for some patient.
- id: inheritance-by-disease
  statement: The RP mutations are all missense, dominant in IMPG1 and recessive (compound
    heterozygous) in IMPG2; all VMD mutations are dominant (heterozygous), either missense or
    nonsense.
  source: Results, opening paragraph (before 3.1); Figure 1; Table 1
  quote: Our findings show all missense mutations for the RP phenotype with dominant inheritance in
    IMPG1 and recessive in IMPG2 ... all patients expressing VMD harvest dominant mutations,
    which can be either mis- or non-sense
  depends_on:
  - table1-genotypes
  - table1-diagnosis-sex-age
  criterion: Read from the genotypes and diagnoses of the two claims it depends on. Dominant
    and recessive are the paper's reading of zygosity (one heterozygous variant is dominant,
    two variants on different alleles recessive); family segregation is not reported. Reproduced
    when the dataset's genotypes and diagnoses give the pattern stated.
- id: table1-bcva
  statement: BCVA (OD and OS) is F32 20/25 and 20/25; M83 20/70 and 20/30; M75 20/40 and 20/40;
    M82 20/30 and 20/25; M73 20/100 and 20/50; F57 20/20 and 20/20; M34 20/20 and 20/20.
  source: Table 1; Results, 3.1 and 3.2, the paragraph on each patient
  inferred: The values of all seven patients are in Table 1; the text of 3.1 and 3.2 repeats
    each patient's values in separate paragraphs.
  criterion: Snellen fractions must match exactly, eye by eye (no tolerance, as Snellen acuity
    is read in discrete lines). The paper says for M83 and M75 that the value is from the most
    recent visit and does not say so for the others. Readings are (a) the most recent visit
    recorded and (b) any visit recorded. Reproduced when all 14 eyes match under one reading;
    partially reproduced when some do; not reproduced when none does.
- id: f32-sector-rp-phenotype
  statement: Patient F32 has sector RP of the inferior retina; FF shows inferior sectoral bone
    spicule pigmentation, FAF reduced autofluorescence, SD-OCT a normal foveal architecture
    without significant thinning, and GVF a superior depression in both eyes.
  source: Results, 3.1 RP Patients, paragraph on Patient F32; Figure 2A,B
  quote: Clinically, Patient F32 presented with sector RP primarily affecting the inferior retina (
    Figure 2 A,B). ... The FF examination revealed dystrophy of the inferior retina,
    characterized by sectorial bone spicule pigmentation (yellow arrows). The FAF imaging
    showed reduced autofluorescence corresponding to a superior visual field defect in both
    eyes
  criterion: The paper grades its images by clinical inspection and gives no quantitative
    measure; the arrows in Figure 2A,B mark the features. Each feature (inferior bone spicule
    pigmentation on FF, reduced FAF, foveal architecture without significant thinning on
    SD-OCT, superior depression on GVF) is judged by viewing the patient's image of that
    modality and eye against the place the Figure 2 legend marks. Reproduced when the
    dataset holds the four modalities for both eyes and each feature is visible; partially
    reproduced when some are; blocked for a modality the dataset lacks. This visual reading is
    the only method the paper allows and is recorded as a deviation.
- id: m83-rp-phenotype
  statement: Patient M83 has bilateral outer retinal atrophy sparing the central fovea with a
    bull's eye pattern, 360 degree bone spicules, pale discs and attenuated vessels on FF;
    reduced FAF; an inferior residual crescent and small central field on GVF; and diffuse
    ellipsoid zone and outer nuclear layer loss on SD-OCT, sparing part of the central fovea in
    the left eye.
  source: Results, 3.1 RP Patients, paragraph on Patient M83; Figure 2C,D
  quote: The FF revealed bilateral outer retinal atrophy sparing the central fovea, with a bull's
    eye pattern surrounding the fovea ( Figure 2 C,D). ... The GVF demonstrated an inferior
    residual crescent in both eyes and a small central visual field. The SD-OCT shows diffuse
    loss of the ellipsoid zone and outer nuclear layer, sparing part of the central fovea in
    the left eye.
  criterion: As for f32-sector-rp-phenotype, by visual inspection of each modality and eye
    against the features the text and the Figure 2C,D legend name (atrophy, bull's eye pattern,
    bone spicules, reduced FAF, GVF crescent and central field, ellipsoid loss). Reproduced
    when every named feature is visible; partially reproduced when some are; blocked for a
    modality the dataset lacks.
- id: m75-vmd-phenotype
  statement: Patient M75 has bilateral subretinal vitelliform material in the macula on SD-OCT,
    macular hypopigmentation on FF, FAF hypo-autofluorescence in the right macula and
    hyper-autofluorescence in the left, early blockage and late window defects on FA, and a
    superior macular nevus.
  source: Results, 3.2 VMD Patients, paragraph on Patient M75; Figure 3A,B
  quote: Subretinal vitelliform material was detected bilaterally in the macula by SD-OCT ( Figure 3
    A,B). The FF shows hypopigmentation in the macula of both eyes. Hypo-autofluorescence,
    suggesting retinal atrophy, was observed in the right macula, while hyper-autofluorescence,
    indicative of vitelliform deposits, was noted in the left macula using FAF.
  criterion: By visual inspection of each modality and eye, as for f32-sector-rp-phenotype. The
    text and the legend disagree on the left eye's FAF; the legend says "FAF shows
    hypo-autofluorescence in the right and left macula". Both readings are named; the FAF
    feature holds when the left macula is hyper-autofluorescent (text) or hypo-autofluorescent
    (legend), and the notebook says which. The nevus is looked for on FF and, where the dataset
    holds it, the infrared image, where the text says it was seen. Reproduced when the SD-OCT,
    FF, FAF and FA features and the nevus are visible; partially reproduced when some are.
- id: m82-vmd-phenotype
  statement: Patient M82 has late-stage VMD with foveal atrophy; SD-OCT shows an attenuated
    ellipsoid and retinal thinning in the right eye and a vitelliform lesion with small
    ellipsoid disruption in the left; FF shows foveal hypopigmentation and FA window defects in
    both eyes.
  source: Results, 3.2 VMD Patients, paragraph on Patient M82; Figure 3C,D
  quote: SD-OCT of the right eye showed attenuated ellipsoid and retinal thinning, while the left eye
    displayed a vitelliform lesion with a small ellipsoid zone disruption. The FF shows
    hypopigmentation of the fovea in both eyes. The FFA demonstrates a bilateral window defect.
  criterion: By visual inspection of each modality and eye, as for f32-sector-rp-phenotype,
    against the features of the text and the Figure 3C,D legend. Reproduced when every named
    feature is visible; partially reproduced when some are.
- id: m73-vmd-phenotype
  statement: Patient M73 has bilateral macular subretinal hyporeflective spaces and ellipsoid
    disruption on SD-OCT, foveal hypopigmentation, dot-blot hemorrhages and peripheral
    cobblestone degeneration on FF, and bilateral hyper-autofluorescence on FAF.
  source: Results, 3.2 VMD Patients, paragraph on Patient M73; Figure 3E,F
  quote: Patient M73, a 73-year-old male, presented with bilaterally macular subretinal
    hyporeflective spaces on SD-OCT, suggesting the reabsorption of vitelliform material (
    Figure 3 E,F). Additional findings included ellipsoid disruption.
  criterion: By visual inspection of each modality and eye, as for f32-sector-rp-phenotype.
    The text does not say which eye has the ellipsoid disruption; the Figure 3E,F legend says
    the right eye, and either eye satisfies the feature. Reproduced when every named feature is
    visible; partially reproduced when some are.
- id: f57-vmd-phenotype
  statement: Patient F57 has subretinal vitelliform lesions in the macula of both eyes on
    SD-OCT, foveal hypopigmentation on FF, and bilateral hypo-autofluorescence on FAF, more
    pronounced in the left eye.
  source: Results, 3.2 VMD Patients, paragraph on Patient F57; Figure 3G,H
  quote: exhibiting subretinal vitelliform lesions in the macula of both eyes on SD-OCT ( Figure 3
    G,H). ... FAF showed hypo-autofluorescence bilaterally, which was more pronounced in the left
    eye.
  criterion: By visual inspection of each modality and eye, as for f32-sector-rp-phenotype.
    "More pronounced" is judged by comparing the extent of the hypo-autofluorescent area in the
    two eyes' FAF images; the paper gives no measure. Reproduced when every named feature is
    visible; partially reproduced when some are.
- id: m34-vmd-phenotype
  statement: Patient M34 has bilateral subretinal vitelliform lesions on SD-OCT, glaucomatous
    optic nerves and mild macular hypopigmentation on FF, and faint hyper-autofluorescence on
    FAF.
  source: Results, 3.2 VMD Patients, paragraph on Patient M34; Figure 3I,J
  quote: The SD-OCT shows subretinal vitelliform lesions on both eyes. The FF is primarily indicative
    of glaucomatous optic nerves and mild macular hypopigmentation. FAF showed faint
    hyper-autofluorescence.
  criterion: By visual inspection of each modality and eye, as for f32-sector-rp-phenotype.
    The text and the legend disagree on FAF; the Figure 3I,J legend says "The FF and FAF reveal
    bilateral hypopigmentation and hypo-autofluorescence". Both readings are named; the FAF
    feature holds under either, and the notebook says which. Reproduced when every named
    feature is visible; partially reproduced when some are.
- id: rp-superior-field-no-cme
  statement: Both RP patients have superior visual field limitation (inferior retina affected
    first), and neither has cystoid maculopathy.
  source: Discussion, paragraph 3 (on Patient M83 and the RP patients)
  quote: Both RP patients experienced visual field limitations in the superior visual field. ...
    Cystoid maculopathy did not occur in either young or old patients.
  depends_on:
  - f32-sector-rp-phenotype
  - m83-rp-phenotype
  criterion: The superior limitation is read from the GVF of F32 and M83 by visual inspection;
    the absence of cystoid maculopathy from their SD-OCT, where cystoid spaces are looked for in
    the macula of each eye (Methods 2.1 names cystoid macular edema as an OCT indicator for RP).
    The paper gives no test. Reproduced when both GVFs show the superior limitation and no
    macular SD-OCT shows cystoid spaces; not reproduced when either fails.
- id: vmd-acuity-preserved
  statement: In most VMD patients visual acuity was not significantly reduced; the only
    exception is M73 (20/100 OD, 20/50 OS).
  source: Discussion, paragraph 5
  quote: Interestingly, in most VMD patients, visual acuity was not significantly reduced. The only
    exception is patient M73, who has a BCVA of 20/100 OD and 20/50 OS.
  depends_on:
  - table1-bcva
  criterion: The paper gives no threshold for a significant reduction and does not say whether
    it is judged on the worse or the better eye. Its text counts M75 (20/40 in both eyes) as not
    reduced and M73 (20/100 OD, 20/50 OS) as reduced, so the readings it allows are a threshold
    of worse than 20/40 applied to the worse eye, or to the better eye, and, on the worse eye,
    any threshold up to 20/100 (worse than 20/40, 20/50 or 20/70). Each reading is run on the
    five VMD patients. Reproduced when under every reading M73 is the only one reduced; not
    reproduced when under every reading he is not; blocked as methods_underspecified when the
    readings differ.
- id: m73-f57-similar-lesions
  statement: The two unrelated carriers of IMPG2 p.Arg964* (M73 and F57) have similar
    vitelliform macular lesions, but the older (M73) has peripheral cobblestone lesions and
    macular lesions with increased autofluorescence.
  source: Discussion, paragraph 6
  quote: Both patients have similar vitelliform macular lesions. However, the oldest patient (M73)
    presents with peripheral cobblestone lesions, and the macular lesions have increased
    autofluorescence.
  depends_on:
  - m73-vmd-phenotype
  - f57-vmd-phenotype
  criterion: The paper gives no measure of similarity. Judged by visual inspection of the two
    patients' SD-OCT and FAF images; reproduced when both show macular vitelliform lesions on
    SD-OCT, M73's FAF is hyper-autofluorescent where F57's is hypo-autofluorescent, and M73's FF
    shows peripheral cobblestone degeneration that F57's does not.
- id: m73-eog-normal
  statement: Patient M73, who also carries a BEST1 variant, had a normal EOG, which the authors
    read as against Best disease.
  source: Discussion, paragraph 5 (on Patient M73)
  quote: However, the patient's EOG results were normal, a finding inconsistent with Best disease
    but more indicative of IMPG2-associated retinal dystrophy.
  criterion: The paper reports no EOG values, no Arden ratio and no normal range, and its Methods
    do not describe the EOG. Reproduced when the dataset holds M73's EOG and it is reported as
    normal there, or when its light-peak to dark-trough (Arden) ratio is in the normal range the
    recording gives; blocked when the dataset holds no EOG. The normal range is not fixed by
    the paper and is recorded as open.
- id: other-gene-variants
  statement: Besides their IMPG variants, F32 carries a JAG1 variant, M73 a BEST1 variant, and
    M83 heterozygous variants of uncertain significance in ALMS1, CEP164, COL11A1, CPLANE1,
    EYS, KIF7, NPHP4 and PHYH.
  source: Discussion, paragraphs 2, 3 and 5
  quote: It is also important to note that this patient had two diseased gene variants ... IMPG1
    and JAG1 .
  criterion: Reproduced when the dataset's genetic reports list each of the named genes for
    the named patient; partially reproduced when some are listed; blocked when the dataset
    holds no genetic report beyond the IMPG variants. The quote states the JAG1 variant of F32;
    the BEST1 variant of M73 and the M83 gene list are stated in Discussion paragraphs 5 and 3.
- id: variant-domains
  statement: The variants lie in or near named protein domains. In IMPG1, p.Leu740Phe is near
    (3.1) or in (3.5, Discussion) the EGF-like domain next to SEA2, and p.Asp423Glu is between
    SEA1 and SEA2. In IMPG2, p.Arg131Cys is near SEA-1, p.Leu249Phe in SEA1, p.Arg964* in SEA2,
    p.Cys1019Tyr in the EGF-1-like domain and p.Arg1088* in the EGF-like 2 domain.
  source: Figure 1; Results, 3.1 and 3.2, the paragraph on each patient; Results, 3.5
  quote: He is heterozygous for the p.Cys1019Tyr mutation in one allele, which affects the
    EGF-1-like domain, and the p.Arg131Cys mutation in the other allele, which is located near
    the non-proteolytic SEA-1 domain.
  data: with_inputs
  depends_on:
  - table1-genotypes
  criterion: Uses outside domain annotations, not the dataset. The paper names no source for
    the domain boundaries of Figure 1. Readings are the UniProt feature annotations of the
    canonical entries (IMPG1 Q17R60, IMPG2 Q9BZV3) and the InterPro (Pfam, SMART) domain
    annotations of the same sequences. "Near" is not defined by the paper and is recorded as
    open; the distance in residues to the named domain is reported, and a "near" placement
    matches when the residue lies in no other named domain and the named domain is the closest.
    For p.Leu740Phe the paper says both "near" and "in"; either matches. Reproduced when every
    variant is placed as stated under one reading; partially reproduced when some are.
