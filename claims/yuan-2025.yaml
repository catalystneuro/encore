    (DynaMut, Methods 2.5, on the I-TASSER models of Methods 2.3, not deposited). Reproduced
    when DynaMut lists the same hydrogen bonds, van der Waals and polar contacts of residue 423
    and residue 740 in the reference and mutant models, as Figure 4A,B shows; the contacts
    gained or lost are reported either way. The model is re-predicted, which is recorded as a
    deviation.
