    p.Leu740Phe) is matched; partially reproduced when the predictions match but some scores
    do not.
- id: asp423glu-novel
  statement: IMPG1 p.Asp423Glu, found in M75, is a novel variant with no ClinVar entry, and its
    association with VMD is reported here for the first time.
  source: Table 2 (Existing Variant ID column); Discussion, paragraph 4
