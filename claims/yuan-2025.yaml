    seven entries, with "-" for a missing score, so the FATHMM and MutationTaster columns are
    read by column order. The paper does not say which MutationTaster output its "score" is,
    nor which FATHMM model gives the coding scores; the attempt reports the outputs each tool
    gives and says which, if any, matches. The paper gives no rule for turning scores into
