claims:
- id: fig1b-faster-novel-learning
  statement: All five rats acquired the task faster in the novel environment than during de novo
    learning; proportion correct over the first 50 trials is higher in novel learning.
  source: Figure 1B; Results, Rats generalize learned rules across contexts, paragraph 2
  quote: Compared with de novo learning, all animals acquired the inbound and outbound task rules
    faster in the novel environment
  criterion: Proportion correct is the state-space estimate of the probability of a correct trial
    (Smith et al. 2004, ref 84; Methods), with background probability 1/3 for inbound and
    outbound trials combined, as cal_behavperform.m sets it. As behavperform_gather.m does, the
    novel curve is trials 1 to 50 of the novel sessions (N and N' run together) and the de novo
    curve is trials 1 to 50 of de novo learning. Reproduced when, for every one of the five rats,
    the mean of the novel curve over the 50 trials exceeds the mean of the de novo curve. Needs
    the de novo learning sessions.
