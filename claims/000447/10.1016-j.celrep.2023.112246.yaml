- id: fig2d-pv-similarity
  statement: PFC population-vector similarity across environments (F-N') is as high as across
    repeated exposures to the novel environment (N-N'), while CA1 PV similarity is lower across
    environments than within the novel environment, where the CA1 map is reinstated.
  source: Figure 2C and 2D; Results, PFC spatial map generalizes, while CA1 completely remaps,
    across contexts, paragraphs 1 and 2
  quote: the PFC spatial-representation similarity between two different environments was just as
    large as with repeated testing in the same environment
  statistics:
  - about: PFC, F-N' against N-N' (the n.s. pair)
    test: Tukey's post hoc
    p: 0.41
    n: 5 rats
  - about: CA1, F-N' against N-N'
    test: Tukey's post hoc
    p: 0.01
    n: 5 rats
  criterion: As cal_PVsimilarity.m computes it, per animal and region. Cells pass the Methods'
    rules for either session of the pair (more than 100 spikes, interneurons excluded) and are
    spatially tuned (linearized peak rate of at least 3 Hz in either session, Methods; the code's
    "above 3 Hz" is a variant). Each trajectory's
    linearized rate map is interpolated to 101 bins of normalized length (about 2 cm, as the
    Methods' 2-cm bins), NaN runs filled linearly, the four trajectories concatenated. PV
    similarity is the Pearson correlation, bin by bin, of the PVs of two sessions; per animal,
    the mean over bins. Pairs are N-N' (epochs 2 and 6) and F-N' (epochs 4 and 6). The 1D
    smoothing width is garbled in the text; the readings are (a) 8 cm, the σ given for the 2D
    maps in the sentence before, and (b) no width the text fixes, so 4 cm and 2 cm are run as
    variants; the outcome is the one (a) gives if (a) and the variants agree, and is otherwise
    methods_underspecified. Rate maps use run periods above 5 cm/s with SWR times excluded and
    occupancy above 20 ms (Methods). The legend gives F = 83.24 and no p for the ANOVA.
    Reproduced when a repeated-measures ANOVA over the four
    groups (CA1 N-N', CA1 F-N', PFC N-N', PFC F-N') has p < 0.05, Tukey's test finds CA1 F-N'
    below CA1 N-N' (p < 0.05), and PFC F-N' does not differ from PFC N-N' (p > 0.05, a claim of
    absence on the paper's test).
- id: fig2e-ca1-error-familiar
  statement: Decoding with N' rate maps, CA1 position error is higher in F than in N, and in F no
    better than with cell-ID shuffled templates.
  source: Figure 2E; Results, PFC spatial map generalizes, while CA1 completely remaps, across
    contexts, paragraph 4
  quote: the error between actual and reconstructed positions in the familiar environment was
    significantly higher than that in the novel environment and no better than chance for CA1
  statistics:
  - about: CA1, F against N
    test: Kruskal-Wallis test with Dunn's post hoc
    p: 0.0001
    p_relation: "<"
  - about: CA1 in F against its cell-ID shuffle (the n.s. comparison)
    test: Wilcoxon paired test
    p: 0.14
  criterion: Decoder as the Methods give it. A memoryless Bayesian decoder with Poisson spiking
    and a uniform prior over position and trajectory type; templates are the N' linearized rate
    maps of cells with peak rate at least 3 Hz; spikes in N and F in 200-ms windows; run periods
    above 5 cm/s; positions within 15 cm of a reward well excluded; the decoded position is the
    maximum of the posterior, the error the linear distance from the actual position. The Methods
    say the window moves "with 50 ms overlap", a 150-ms step; the code
    (decoding_position_*_novelfamiliar_cross.m) steps by 50 ms and keeps only bins in its theta
    periods, which are variants. As the code does, a bin is decoded when its positions lie on one
    trajectory and at least one cell fires, and the error is measured along the four
    trajectories laid end to end, so a decode onto the wrong trajectory is far. Time bins pooled
    over the five rats. Kruskal-Wallis with Dunn's post hoc; the legend does not say which
    groups enter one test, so the readings are (a) CA1 N, CA1 F, PFC N and PFC F together, (b)
    N and F per region. The shuffle permutes cell identities of the N' rate maps (Methods). The paper does not say
    how many shuffles or what the Wilcoxon test pairs; readings are (a) each bin's error against
    its error under one shuffle, (b) against its median error over 100 shuffles (a standard
    number; the paper gives none). Reproduced when, under each grouping reading, Dunn's test puts
    CA1 F above CA1 N at p < 0.05 and, under each shuffle reading, the CA1 F
    errors do not differ from the shuffle at p < 0.05 (a claim of absence on the Wilcoxon paired
    test).
  depends_on:
  - fig2d-pv-similarity
- id: fig2e-pfc-error-stable
  statement: Decoding with N' rate maps, PFC position error is similar in N and F, and in both
    well above chance (below the cell-ID shuffles).
  source: Figure 2E; Results, PFC spatial map generalizes, while CA1 completely remaps, across
    contexts, paragraph 4
  quote: whereas PFC decoding was well above chance and similar across environments
  statistics:
  - about: PFC, N against F
    test: Kruskal-Wallis test with Dunn's post hoc
    p: 0.99
    p_relation: ">"
  - about: a comparison with cell-ID shuffles (not named)
    test: Wilcoxon paired test
    p: 0.0023
  - about: comparisons with cell-ID shuffles (not named)
    test: Wilcoxon paired test
    p: 0.0001
    p_relation: "<"
  criterion: Decoding, groups, test and shuffle readings as in fig2e-ca1-error-familiar.
    Reproduced when, under each grouping reading, Dunn's test finds no difference between PFC N
    and PFC F (p > 0.05, a claim of absence on the paper's test) and, under each shuffle reading, PFC errors in N and in F are
    below their shuffles by the Wilcoxon paired test at p < 0.05.
  depends_on:
  - fig2e-ca1-error-familiar
- id: fig2f-switch-dynamics
  statement: After the switch from N to F, CA1 decoding error rises within the first trial, while
    PFC decoding error stays stable.
  source: Figure 2F; Results, PFC spatial map generalizes, while CA1 completely remaps, across
    contexts, paragraph 4
  quote: Interestingly, the decoding error rapidly increased during the first trial after
    environment switching for CA1 but remained stable for PFC
  statistics:
  - about: CA1, trial -1 against trial 1
    test: Kruskal-Wallis test with Dunn's post hoc
    p: 0.038
  - about: PFC, trial -1 against trial 1
    test: Kruskal-Wallis test with Dunn's post hoc
    p: 0.99
    p_relation: ">"
  criterion: Decoding with N' templates as in fig2e-ca1-error-familiar, per trial, errors pooled
    over the five rats. Methods' decoder settings are the main reading; the code's
    (decoding_position_*_novelfamiliar_trial.m) are a variant (non-overlapping 200-ms bins, no
    speed or theta filter, more than one active cell, the decode restricted to the current
    trajectory, absolute error). The paper does not define trial -1. Readings are (a) the last N
    trial before the switch; (b) the code's, which takes the first 10 trials of N and of F and
    labels the N trials -10 to -1, so trial -1 is the tenth N trial. Kruskal-Wallis over the
    trials from -10 to 10 with Dunn's post hoc, per region. Reproduced when, under each reading,
    CA1 trial 1 exceeds trial -1 at p < 0.05 and PFC trial 1 does not differ from trial -1
    (p > 0.05, a claim of absence on the paper's test).
  depends_on:
  - fig2e-ca1-error-familiar
- id: figs3c-pfc-assimilation
