# Claims for Tang, Shin & Jadhav (2023), Cell Reports 42, 112246, on dandiset 000447.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read. The NIH author manuscript in PubMed Central (PMC10124109, NIHMS1887302) as served by
# Europe PMC, with its STAR Methods and figure legends, and the supplement
# (NIHMS1887302-supplement-1.pdf, Figures S1 to S7 and their legends), all from
# paper/10.1016-j.celrep.2023.112246.txt. The version of record was not read. The PDF of the
# supplement was not opened; its text was enough. One value of the Methods is garbled in the
# text. The 1D Gaussian that smooths the linearized rate maps reads "(s = σ cm" with the
# number lost (Methods, Spatial fields and linearization). Criteria that use it name it as open.
#
# Code read. github.com/JadhavLab/GeometricTransformation at commit
# 5e55e69f2f089adcfd65bbfae42ec80e60e9903d (16 March 2023), MATLAB. It holds the scripts behind
# Figures 1 to 4 and S3, S5, S6, S7C-D. They are the behavioural summary, PV similarity, Bayesian
# decoding, selectivity index, path equivalence, UMAP embedding and distances, CCGP and the 35
# dichotomies. It does not hold the code that computes rate maps (the Frank/Jadhav lab
# "time-filter framework" in Src_Matlab and usrlocal, not public in this repository). It also
# lacks the code for the rate-overlap and single-cell spatial correlation of Figure S3A, the
# ramping cells of Figure S4, the cell-ID shuffles of Figure 2E and the geometric random model
# of Figure S7A-B. The UMAP templates it loads (all_PFCumap_trials_ep6.mat,
# all_CA1umap_trials_ep6.mat), its saved performance files, rate maps and single-trial rate maps
# are not in the repository. The statistical tests were run in GraphPad Prism (Methods), not in
# the code.
#
# Choices the code settles where the Methods are silent, followed below. Epochs 2, 4 and 6 of day 1
# are N, F and N'. Well 1 is the center, well 2 the left and well 3 the right well, so linearized
# trajectories 1 to 4 are OUT_L (center to left), IN_L, OUT_R and IN_R. Linear positions are
# distance from the center well, so inbound trajectories run backwards in that coordinate and
# phase (distance from the start) is the reversed index for them. CA1 putative principal cells
# have a mean rate below 7 Hz. PFC cells carry the label PFC. Both need more than 100 spikes in an
# epoch. Each animal also has a hard-coded list of putative interneurons, given as tetrode and
# cell pairs (AM2 [6,9]; JS21 [6,3; 6,6; 6,7; 6,8; 7,1; 21,1; 22,1; 25,1]; JS17 [6,1; 7,1]; ZT2
# [31,1; 31,5; 32,2; 27,1; 14,10]; JS34 none). The cells used for the manifolds, the selectivity
# index and path equivalence are those found in all three epochs (matchidx_acrossep.m). Animals
# are AM2, JS17, JS21, ZT2 and JS34.
#
# Data the paper used. Five adult male Long-Evans rats with 32 to 64 tetrodes in dorsal CA1 and
# medial PFC (mainly prelimbic), recorded with SpikeGadgets (spikes 30 kHz, 600 Hz to 6 kHz; LFP
# 1.5 kHz; overhead camera 30 fps with headstage LEDs). Each learned the W-maze continuous
# alternation task de novo in a familiar room (8 sessions in a day), then on a later day ran one
# session in a novel room (N), one in the familiar room (F) and one more in the novel room (N'),
# each 15 to 20 min, interleaved with rest in a sleep box. Measured variables are spike times of
# clustered single units, position and speed, linearized position and trajectory type (IN_R,
# OUT_L, IN_L, OUT_R), reward-well visits and whether each trial was correct, and LFP. A second
# group of three rats from earlier studies (refs 23 and 85) ran F-N-F'-N' on two days after 5
# days of training; only their behaviour is used (Figure 1C, S1C). The dandiset's description
# says each file holds three epochs, novel, familiar and novel again, with spikes, LFP, position
# and trajectory information. The de novo learning sessions and the F-N-F'-N' rats are data the
# paper names; the paper says its raw data are on Brandeis servers, available on request, so they
# are not public anywhere else. No claim uses outside data. Cell counts the attempt can check its
# selection against are 98 CA1 and 171 PFC cells for the pseudo-population (claim
# manifold-cell-counts).
