    p: 0.05
  - about: comparisons not named
    test: Kruskal-Wallis test with Dunn's post hoc
    p: 0.0001
    p_relation: "<"
  criterion: PV similarity per bin as in fig2d-pv-similarity, computed separately for ramping cells
    (identified in N', figs4-ramping-fraction) and other cells, for N-N' and F-N', bins pooled
    over rats. Kruskal-Wallis over the eight groups (region, ramping or other, environment pair)
    with Dunn's post hoc. Reproduced when (1) CA1 ramping F-N' is below CA1 ramping N-N' at
    p < 0.05; (2) PFC ramping F-N' does not differ from PFC ramping N-N' (p > 0.05); (3) ramping
    and other cells do not differ (p > 0.05) for the same region and environment pair. Parts (2)
    and (3) are claims of absence on Dunn's test. Partially reproduced when (1) and (2) hold but
    not (3).
  depends_on:
  - figs4-ramping-fraction
- id: figs4d-reward-location-similarity
  statement: PV similarity between the environments at the reward wells is the same as at other
    locations, in both regions.
  source: Results, PFC spatial map generalizes, while CA1 completely remaps, across contexts,
    paragraph 3; Figure S4D
  quote: Finally, in both regions, the similarity of population activity across different
    environments at reward wells was the same as other locations
  statistics:
  - about: PV similarity over locations, all tests
    test: Grubbs' test for outliers
    p: 0.05
    p_relation: ">"
  criterion: A claim of absence on the paper's test. PV similarity between the novel and
    familiar environments per linear bin over the four trajectories, mean over the five rats
    (fig2d-pv-similarity; the legend shows SEM shading), per region. The legend does not name
    the novel session; readings are F-N' (the pair of the other panels) and F-N. Grubbs' test
    (two-sided, alpha 0.05) on the bin values. The legend says "PV similarity was consistent
    across locations (all p’s > 0.05...)", so the test finds no outlier at any location, not
    only at the wells. It does not say what one test covers; readings are (a) all bins of a
    region, (b) the bins of each trajectory in a region. Reproduced when Grubbs' test finds no
    outlier (p > 0.05) in every test; whether the bins at the reward wells (the trajectory ends)
    are extreme is reported.
  depends_on:
  - fig2d-pv-similarity
- id: figs5d-path-equivalence
  statement: PFC cells show stronger path equivalence (similar firing at the same trajectory phase
    across trajectory types) than CA1 cells.
  source: Figure S5D; Results, Distinct geometries of CA1 and PFC representations, paragraph 1
  quote: Stronger path equivalence in PFC than CA1 (***p = 0.0004, ****p < 0.0001, F = 25.37,
    one-way ANOVA with Tukey’s post hoc)
  statistics:
  - about: a PFC against CA1 pair (not named)
    test: Tukey's post hoc
    statistic: F = 25.37 (the one-way ANOVA; the legend gives no p for it)
    p: 0.0004
  - about: PFC against CA1 pairs (not named)
    test: Tukey's post hoc
    p: 0.0001
    p_relation: "<"
  criterion: The path-equivalent coefficient R of a cell is the median, over the six pairs of the
    four trajectory types, of the Pearson correlation of rate maps aligned from trajectory start
    to end (Methods; cal_path_equivalence.m, which reverses the inbound maps, interpolates to the
    first trajectory's bins and drops NaN bins). Cells are those found in all three sessions.
    Groups are the six region by session groups (N, F, N'), as the code plots them. One-way
    ANOVA with Tukey's post hoc. Reproduced when, in each session, PFC R exceeds CA1 R at
    p < 0.05; partially reproduced when it holds in one or two sessions.
- id: figs5e-path-equivalence-stable
  statement: The path-equivalent coefficient of PFC cells is strongly correlated between
    environments (r = 0.64), more so than that of CA1 cells (r = 0.21).
  source: Figure S5E
  quote: Path-equivalent coefficient is more strongly correlated between environments for PFC than
    CA1 (****p < 0.0001, Z = 4.25, comparing correlation coefficients; PFC, r = 0.64, p = 8.43e-21;
    CA1, r = 0.21, p = 0.035; Pearson correlation)
  statistics:
  - about: PFC against CA1 correlation coefficients
    test: comparison of correlation coefficients
    statistic: Z = 4.25
    p: 0.0001
    p_relation: "<"
  - about: PFC, between environments
    test: Pearson correlation
    statistic: r = 0.64
    p: 8.43e-21
  - about: CA1, between environments
    test: Pearson correlation
    statistic: r = 0.21
    p: 0.035
  expected:
  - quantity: PFC Pearson r of R between environments
    value: 0.64
    tolerance: 0.064
  - quantity: CA1 Pearson r of R between environments
    value: 0.21
    tolerance: 0.021
  criterion: R as in figs5d-path-equivalence. The legend does not say which novel session; readings
    are F against N', F against N. The test comparing the two r values is taken as Fisher's z for
    independent correlations, the usual test of that name. Reproduced when under one reading both
    r values are within tolerance and Fisher's z gives p < 0.05 with PFC higher; partially
    reproduced when PFC r is significantly above CA1 r but a value is out of tolerance.
  depends_on:
  - figs5d-path-equivalence
- id: figs5f-path-equivalence-vs-selectivity
  statement: Path equivalence and task-sequence selectivity are uncorrelated across cells.
  source: Figure S5F
  quote: Path equivalence and task-sequence selectivity are two uncorrelated measures (n.s., all p’s
    > 0.05; Pearson correlation)
  statistics:
  - test: Pearson correlation
    p: 0.05
    p_relation: ">"
  criterion: A claim of absence on the paper's test, Pearson correlation per region of R
    (figs5d-path-equivalence) against SI(IN) and against SI(OUT) (fig3d-selectivity-index), cell
    samples per session. The paper does not say whether the signed or absolute SI is used; both
    are run. Reproduced when no correlation has p < 0.05 under the signed reading and under the
    absolute one; when only one reading finds a correlation the claim is methods_underspecified.
  depends_on:
  - figs5d-path-equivalence
  - fig3d-selectivity-index
- id: fig3d-selectivity-index
  statement: Inbound and outbound trajectory selectivity indices are negatively correlated in PFC
    (r = -0.5), reflecting task-sequence selectivity, and positively correlated in CA1 (r = 0.56),
    reflecting spatial coverage.
  source: Figure 3D; Results, Distinct geometries of CA1 and PFC representations, paragraph 1
  quote: As a result, the selectivity indices of IN (IN L vs. IN R ) and OUT (OUT L vs. OUT R )
    trajectories exhibited a positive correlation for CA1 and an opposite, negative correlation
    for PFC
  statistics:
  - about: PFC, SI(IN) against SI(OUT)
    test: Pearson correlation
    statistic: r = -0.5
    p: 1.35e-16
  - about: CA1, SI(IN) against SI(OUT)
    test: Pearson correlation
    statistic: r = 0.56
    p: 1.39e-11
  expected:
  - quantity: PFC Pearson r, SI(IN) against SI(OUT)
    value: -0.5
    tolerance: 0.05
  - quantity: CA1 Pearson r, SI(IN) against SI(OUT)
    value: 0.56
    tolerance: 0.056
  criterion: SI = (FR_L - FR_R)/(FR_L + FR_R) with FR the mean rate of the linearized rate map on
    the left or right trajectory, for IN (IN_L, IN_R) and OUT (OUT_L, OUT_R) (Methods). As cal_SI.m
    does, the right map is interpolated to the left map's bins, means over bins valid on both, and
    a cell sample counts when the peak rate is at least 3 Hz on the IN pair and on the OUT pair
    (Methods; cal_SI.m's "> 3" is a variant). Cells
    found in all three sessions. Each dot is a cell sample in one session (legend; Methods,
    "rate maps in different sessions were analyzed separately"); the paper does not say which
    sessions enter the panel. Readings are (a) N, F and N' pooled, (b) N' alone, (c) F alone.
    Reproduced when, under one reading, both r are within tolerance and p < 0.05 with the signs
    given; when no reading puts both in tolerance but every reading gives PFC r < 0 and CA1 r > 0
    at p < 0.05, partially reproduced. The p-values printed "1.35e16" and "1.39e11" have lost
    their minus signs in the text; they are read as 1.35e-16 and 1.39e-11.
- id: fig3e-selectivity-stable
  statement: Trajectory selectivity is stable across environments for PFC cells (r = 0.49 between
    familiar and novel) but not for CA1 cells (r = 0.12, not significant).
  source: Figure 3E; Results, Distinct geometries of CA1 and PFC representations, paragraph 1
  quote: Finally, consistent with spatial remapping results, these properties were stable across
    environments for PFC neurons but not CA1
  statistics:
  - about: PFC, SI in F against SI in the novel environment
    test: Pearson correlation
    statistic: r = 0.49
    p: 2.77e-14
  - about: CA1, SI in F against SI in the novel environment
    test: Pearson correlation
    statistic: r = 0.12
    p: 0.22
  expected:
  - quantity: PFC Pearson r, SI in F against novel
    value: 0.49
    tolerance: 0.049
  - quantity: CA1 Pearson r, SI in F against novel
    value: 0.12
    tolerance: 0.012
  criterion: SI as in fig3d-selectivity-index, with SI(IN) and SI(OUT) pooled in one correlation
    per region (both shown in the panel, one r given). The legend says "novel environment"
    without naming the session; readings are N' and N. Reproduced when, under one reading, both
    r are within tolerance, PFC r has p < 0.05 and CA1 r is not significant (p > 0.05, Pearson,
    the paper's test). Partially reproduced when the PFC correlation is significant and the CA1 one is
    not but a value is out of tolerance.
  depends_on:
  - fig3d-selectivity-index
- id: manifold-cell-counts
  statement: The pseudo-populations pooled across animals for the manifold analyses hold 98 CA1 and
    171 PFC cells.
  source: STAR Methods, Characterization of neural manifold, paragraph 1; Figure 3F and 3G legend
  quote: all spatially-tuned units that were active in both environments were pooled across
    animals to build a pseudo-population of neurons ( n = 98 CA1 and 171 PFC cells, respectively)
  expected:
  - quantity: CA1 cells in the pseudo-population
    value: 98
    tolerance: 9.8
  - quantity: PFC cells in the pseudo-population
    value: 171
    tolerance: 17.1
  criterion: The Methods select spatially tuned units active in both environments; the code
    (cal_UMAP.m with matchidx_acrossep.m) takes every unit found in all three sessions that passes
    the inclusion rules, with no tuning threshold. Readings are (a) the Methods' (units active in
    N, F and N' with a linearized peak rate of at least 3 Hz in at least one session), (b) the
    code's. Reproduced when both counts are within tolerance under one reading; the reading that
    matches is used for the manifold claims, and if both match, (a).
- id: fig3fg-manifold-shapes
  statement: UMAP embeddings show that PFC population activity lies on a ring-shaped manifold,
    whereas the CA1 manifold has a double V shape resembling the W-maze.
  source: Figure 3F and 3G; Results, Distinct geometries of CA1 and PFC representations,
    paragraph 2
  quote: This unsupervised algorithm revealed that the population activity of PFC cells resides on
    a ring-shaped manifold, making it distinct from the CA1 neural manifold with a double “V”
    shape that topologically resembles the physical spatial structure of the W-maze
  criterion: Embedding as the Methods give it. Single-trial linearized rate maps of the
    pseudo-population cells (manifold-cell-counts) in N', with the minimum number of trials per
    trajectory type across animals from the first trial, binned at 1 cm. Bins with fewer than 5
    active cells are dropped. UMAP with 3 dimensions, cosine metric, 50 neighbours, min_dist 0.6.
    The code bins each trajectory at 1/200 of its normalized length (201 bins), a variant. The
    random seed and the UMAP implementation are standard choices (the paper's fitted templates
    are not public; the code notes that a new fit gives a quantitatively similar result). The
    paper gives no measure of the ring or V shapes; it validates the embedding by the distance
    tests of Figure 3H to 3J. The embedding is shown, and the outcome is that of
    fig3h-inseq-outseq-distance and fig3i-phase-location-distance (reproduced when both are,
    partially when one is).
  depends_on:
  - manifold-cell-counts
  - fig3h-inseq-outseq-distance
  - fig3i-phase-location-distance
- id: fig3h-inseq-outseq-distance
  statement: In the PFC manifold, trajectories of the same task sequence (InSeq) are closer than
    trajectories out of sequence (OutSeq); in the CA1 manifold, OutSeq pairs with the same spatial
    coverage are closer than InSeq pairs.
  source: Figure 3H; Results, Distinct geometries of CA1 and PFC representations, paragraph 3
  quote: we found that the distance between two InSeq trajectories was significantly smaller than
    two OutSeq ones in the PFC manifold, whereas OutSeq pairs with same spatial coverages had
    smaller distances than InSeq pairs in the CA1 manifold
  statistics:
  - test: rank-sum test
    p: 0.0001
    p_relation: "<"
  criterion: Embedding as in fig3fg-manifold-shapes. InSeq pairs are OUT_L with IN_R and OUT_R
    with IN_L; OutSeq pairs are OUT_L with IN_L and OUT_R with IN_R. For every pair of single
    trials of the two types, the mean Euclidean distance over matched bins in the 3D embedding
    (cal_UMAP_INSeq_distance.m). The Methods do not say how bins are matched for this panel;
    the code matches by spatial location for CA1 and by trajectory phase for PFC, which is
    followed. Matching both regions the same way (by phase, by location) is shown as a variant.
    Rank-sum test of InSeq against OutSeq trial-pair distances per region. Reproduced when PFC
    InSeq < OutSeq and CA1 OutSeq < InSeq, each at p < 0.05.
  depends_on:
  - manifold-cell-counts
- id: fig3i-phase-location-distance
  statement: PFC neural states at the same trajectory phase are closer than those at the same
    spatial location, while CA1 shows the opposite.
  source: Figure 3I; Results, Distinct geometries of CA1 and PFC representations, paragraph 3
  quote: As a result, the distances between PFC neural states for the same trajectory phases were
    significantly smaller than those for the same spatial locations, while the opposite is true
    for CA1
  statistics:
  - test: rank-sum test
    p: 0.0001
    p_relation: "<"
  criterion: Embedding as in fig3fg-manifold-shapes. The Methods take same-phase distances from
    pairs of the same task sequence and same-location distances from pairs on the same side of
    the maze, which is the main reading. The code (cal_UMAP_TrajPhase_vs_Spatial_distance.m)
    takes both from the same-side pairs (OUT_L with IN_L, OUT_R with IN_R), aligned by phase or by
    location, a variant. Distances are Euclidean in the 3D embedding between all states at the
    matched bins of the two types, pooled. Rank-sum test of phase against location distances per
    region. Reproduced when PFC phase < location and CA1 location < phase, each at p < 0.05.
  depends_on:
  - manifold-cell-counts
- id: fig3j-familiar-novel-manifold
  statement: The PFC manifold is preserved across environments (F states lie closer to N' states
    than cell-ID shuffles do), while the distortion of the CA1 manifold is similar to that of
    random shuffles.
  source: Figure 3J; Results, Distinct geometries of CA1 and PFC representations, paragraph 3
  quote: We found that the geometric structure of the PFC manifold was largely preserved across
    environments, whereas the distortion of the CA1 manifold was similar to that from random
    shuffles
  statistics:
  - about: CA1, F-N' against shuffle (the n.s. test of the panels)
    test: rank-sum test
    p: 0.16
  - about: PFC, F-N' against shuffle
    test: rank-sum test
    p: 0.0001
    p_relation: "<"
  criterion: F single-trial activity embedded with the UMAP fitted on N' (template transform,
    Methods). For each N' state, the mean Euclidean distance to all F states of the same
    trajectory type and location (Methods; cal_UMAP_FNdistance.m). The chance level shuffles
    cell identities of the N' activity and embeds it with the same fit; the code draws a new
    permutation for each trial and runs it once (cal_UMAP_FNdistance_shuffle.m), which is
    followed. Rank-sum of real against shuffle distances per region. Reproduced when PFC F-N'
    distances are below the shuffle at p < 0.05 and CA1 F-N' distances do not differ from the
    shuffle (p > 0.05, a claim of absence on the paper's test).
  depends_on:
  - manifold-cell-counts
- id: figs6-high-dimensional-distances
  statement: The distance relationships of Figure 3H to 3J hold in the original high-dimensional
    neural space.
  source: Figure S6; Results, Distinct geometries of CA1 and PFC representations, paragraph 3
  quote: In all the cases above, the distance relationship of neural states, which determines the
    representational geometry, was preserved between the low-dimensional manifold space and the
    original high-dimensional neural space
  statistics:
  - about: the n.s. comparison (not named)
    test: rank-sum test
    p: 0.75
  - about: the other comparisons
    test: rank-sum test
    p: 0.0001
    p_relation: "<"
  criterion: As fig3h-inseq-outseq-distance, fig3i-phase-location-distance and
    fig3j-familiar-novel-manifold, with Euclidean distances between population vectors of the
    pseudo-population (Methods, "distance was computed identically, except for the number of
    dimensions"; Figure3/Supplemental/cal_PV_*.m). Reproduced when all three reproduce in the
    neural space; partially reproduced when one or two do.
  depends_on:
  - fig3h-inseq-outseq-distance
  - fig3i-phase-location-distance
  - fig3j-familiar-novel-manifold
- id: fig4d-pfc-ccgp
  statement: In PFC, the cross-condition generalization performance (CCGP) for trajectory phase,
    task sequence and environment is high and above trial-label shuffles for every decoder.
  source: Figure 4D; Results, Distinct abstraction in CA1 and PFC, paragraph 2
  quote: We found that the CCGP for all three task variables showed high accuracy for PFC
  statistics:
  - test: trial-label permutation test
    p: 0.001
    p_relation: "<"
    n: 1,000 shuffles
  criterion: Clusters are the N' (and for the environment, F) embedded states at 20% to 30% and
    70% to 80% of trajectory length from the start of each of the 4 trajectory types, 8 clusters
    (Methods; cal_all_dichotomies.m); features are the 3 UMAP coordinates. Linear C-SVM (libsvm,
    linear kernel, default cost 1), accuracy balanced over the two classes
    (decoding_CCGP_linearSVM_simple.m). Trajectory phase is trained on 3 trajectory types and
    tested on the fourth (4 decoders). Task sequence (IN_R and OUT_L against IN_L and OUT_R)
    follows CCGP_taskSeq.m. Each decoder is tested on the two outbound clusters (OUT_L, OUT_R) or
    the two inbound clusters (IN_L, IN_R) at one phase, and trained on the four clusters of the
    other direction (4 decoders); the Methods' "holding out two clusters belonging to the same
    trajectory phase of two different OutSeq trajectories" allows this reading, and training on
    all six clusters left is a variant. Environment applies the decoders trained in N'
    to F (8 decoders, CCGP_environment.m). Significance permutes the labels of training and test
    sets 1,000 times; p is the fraction of shuffles above the real CCGP. Reproduced when every one
    of the 16 PFC decoders has p < 0.001 (no shuffle above it).
  depends_on:
  - manifold-cell-counts
- id: fig4d-ca1-ccgp-chance
  statement: In CA1, CCGP for trajectory phase, task sequence and environment is at or below chance
    by the trial-label permutation test.
  source: Figure 4D; Results, Distinct abstraction in CA1 and PFC, paragraph 2
  quote: Note that all dichotomies can be accurately decoded in PFC (****p < 0.001) but not in CA1
    (n.s., p > 0.05 , trial-label permutation test)
  statistics:
  - test: trial-label permutation test
    p: 0.05
    p_relation: ">"
    n: 1,000 shuffles
  criterion: A claim of absence on the paper's test. CCGP as in fig4d-pfc-ccgp for the 16 CA1
    decoders. Reproduced when no CA1 decoder has p < 0.05; the CCGP values are reported either
    way.
  depends_on:
  - fig4d-pfc-ccgp
- id: figs7b-geometric-null
  statement: Against a geometric random model that keeps within-condition noise but destroys the
    geometry, PFC CCGP is significant while CA1 CCGP is not.
  source: Figure S7B; Results, Distinct abstraction in CA1 and PFC, paragraph 2
  quote: CCGP for trajectory phases (circles), task sequences (triangles), and environments
    (diamonds; horizontal lines, median) against the null-distributions of the geometric random
    model (red horizontal line shown the 95th percentile; n.s., p > 0.05, **p = 0.0026, ****p
    <0.0001)
  statistics:
  - about: CA1 (n.s.)
    test: geometric random model
    p: 0.05
    p_relation: ">"
  - about: a comparison not named
    test: geometric random model
    p: 0.0026
  - about: comparisons not named
    test: geometric random model
    p: 0.0001
    p_relation: "<"
  criterion: Each cluster's noise cloud (trial-by-trial values of the condition) is rotated by
    permuting the axes of the firing rate space, separately per cluster, and CCGP is recomputed
    (fig4d-pfc-ccgp), 100 times (Methods). No code for this model is in the repository. The
    paper does not say in which space the axes are permuted or what is done with the cluster
    centres (the legend of S7A says "rotation-translation"). Readings are (a) permute the 3 UMAP
    coordinates of each cluster's points about its centroid; (b) permute the neuron axes of each
    cluster's population vectors and embed them with the N' fit. Reproduced when, under each
    reading, the PFC CCGP of each variable exceeds the 95th percentile of its null and no CA1
    CCGP does.
  depends_on:
  - fig4d-pfc-ccgp
- id: figs7d-dichotomies-decodable
  statement: With traditional cross-validated decoders, most of the 35 dichotomies of the 8
    clusters are decoded accurately in both CA1 and PFC, with similar accuracy in the two regions.
  source: Figure S7D; Results, Distinct abstraction in CA1 and PFC, paragraph 2
  quote: we found that most of the dichotomies were accurately separated in both CA1 and PFC,
    suggesting that both regions contain a similar amount of decodable variables
  statistics:
  - about: PFC against CA1 decoding accuracy over 35 dichotomies
    test: rank-sum test
    p: 0.17
    n: 35 dichotomies per region
  criterion: The 35 balanced dichotomies of the 8 clusters of fig4d-pfc-ccgp (4 against 4), each
    decoded by a linear C-SVM with 4-fold cross-validation (libsvm -v 4; decoding_dichotomy_*.m)
    on the 3 UMAP coordinates; significance by 1,000 trial-label shuffles, p the fraction of
    shuffles above. Reproduced when more than half of the 35 dichotomies have p < 0.05 in each
    region ("most") and the rank-sum test of PFC against CA1 accuracies does not find a
    difference (p > 0.05, a claim of absence on the paper's test).
  depends_on:
  - fig4d-pfc-ccgp
checks:
- date: 2026-10-23
  kind: agent
  model: claude-opus-5-5
  ready: true
  changes:
  - fig1c-session-performance, fig2d-pv-similarity, figs5d-path-equivalence. Removed the ANOVA entries recorded as p < 0.05; the legends give only F (40.48, 83.24, 25.37) and no p for the ANOVA, so the bound was not the paper's. The F values are kept in the criteria or the statistic text.
  - fig1-denovo-final-performance. The criterion took "the last de novo session" as if it were fixed; three of the five rats trained 2 more days before the N-F-N' day (Methods). Named it open, with readings (a) the last session before the N-F-N' day (Figure 1C legend) and (b) the eighth session of the de novo day. fig1c-session-performance uses the same readings.
