- id: figs4-ramping-fraction
  statement: Ramping cells make up 16.4% of CA1 cell samples (81 of 495) and 18.1% of PFC cell
    samples (115 of 636), a cell sample being one cell on one trajectory type.
  source: Figure S4A and S4B legend
  quote: ramping cells identified here (CA1 ... 81/495 = 16.4% cell samples; PFC ... 115/636 = 18.1%
    cell samples across all sessions
  expected:
  - quantity: CA1 ramping cell samples, fraction
    value: 16.4
    tolerance: 1.64
    unit: percent
  - quantity: PFC ramping cell samples, fraction
    value: 18.1
    tolerance: 1.81
    unit: percent
  - quantity: CA1 cell samples
    value: 495
    tolerance: 49.5
  - quantity: PFC cell samples
    value: 636
    tolerance: 63.6
  criterion: A session-averaged linearized rate map on one trajectory is ramping when the linear
    regression of rate on traversed position toward the reward has Pearson r > 0.5 and p < 0.05,
    its peak rate is at least 3 Hz, and its peak lies within 20 cm of the reward location
    (Methods). The paper does not say which positions enter the regression or which cells form
    the denominator. Readings for the denominator are (a) cell samples of all three sessions
    pooled ("across all sessions"), (b) N' only ("identified in N'"), each over cells with a
    valid rate map on the trajectory. The regression runs over the whole trajectory up to the
    reward well. Reproduced when the two fractions are within tolerance under one reading.
