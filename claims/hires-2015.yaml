    replacement, as for C2). Reproduced when, under every reading, performance with 15 neurons is
    below that of C2 and its 95% bound excludes 95% detection; the Methods' note of "several-fold
    more information about touch in C2" is shown as the ratio of the population sizes needed for
    equal performance.
- id: fig4b-touch-time-precision
  statement: A naive Bayes decoder reading 200 L4 C2 neurons integrated over 10 ms decodes the time
    elapsed since touch with high precision, a minimum uncertainty of 0.55 ms (95% confidence) at
    10 ms after touch onset.
  source: Results, Decoding touch, paragraph 1; Figure 4B; Figure 4, figure supplement 1
  quote: a group of 200 neurons in C2, integrating in 10 ms windows after touch, also allowed
    decoding of elapsed time from touch with high precision (minimum 0.55 ms uncertainty with 95%
    confidence at 10 ms post-touch onset using a naïve Bayes decoder
  expected:
    quantity: minimum decoding uncertainty of time since touch, 200 neurons
    value: 0.55
    tolerance: 0.055
    unit: ms
  criterion: Methods, Population decoding. Responses sampled as fig4a-touch-detection-c2, each
    neuron's spike train integrated in a 10 ms sliding window; a multinomial naive Bayes
    classifier reports the most likely time since onset at each 1 ms time point, with the RMS
    time error from 100 bootstrap runs (Figure 4, figure supplement 1). Open details, (1) the
    uncertainty, read as (a) the RMS error, (b) the half width of the 95% bound of decoded time
    or (c) 1.96 times the RMS error; (2) train and test split, read as (a) half and half as for
    touch detection or (b) independent resampled sets for training and testing; (3) the times the
    decoder chooses among, which the paper does not give ("for every time point what was the most
    likely time elapsed from touch onset"), read as (c-all) every 1 ms over the sampled -30 to +50
    ms response where a full window fits or (c-post) every 1 ms from onset on (the Results'
    "integrating in 10 ms windows after touch"); (4) the smoothing of zero counts in the
    likelihood, not given, read as add-one (Laplace) smoothing, a smaller pseudocount shown as a
    variant. Reproduced when the minimum over time points, at or near 10 ms after onset, is within
    tolerance under one reading of (1) for both readings of (2) and both of (3); the readings that
    match are said. Also shown, that
    the error falls with population size (Figure 4B inset).
