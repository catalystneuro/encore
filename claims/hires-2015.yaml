- id: fig4a-touch-detection-c2
  statement: Pooling the activity of only 15 L4 C2 neurons, integrated over 10 ms, is enough to
    detect 95% of touches.
  source: Results, Decoding touch, paragraph 1; Figure 4A
  quote: Pooling activity from only fifteen L4 neurons (out of approximately 1600 [ Lefort et al.,
    2009 ]) in C2 was sufficient to detect 95% of touches (integration time, 10 ms)
  expected:
    quantity: L4 C2 population size reaching 95% touch detection
    value: 15
    tolerance: 1.5
    unit: neurons
  criterion: Methods, Population decoding. Per neuron, touch-aligned responses from 30 ms before
    to 50 ms after each touch, leaving out touches with a second touch within 50 ms. For a
    population of N neurons drawn at random, 1000 responses per neuron drawn with replacement,
    each spike train causally integrated over 10 ms and pooled across neurons; at each time point
    a one-dimensional threshold decoder separates the pooled response from that in epochs without
    touch, the threshold chosen on half the data and performance measured on the other half;
    repeated to give 95% bounds. Open details, (1) the non-touch epochs, read as (a) the 30 ms
    before touch in the same responses or (b) 10 ms windows drawn from exploration time away from
    touch, under (a) with the sample taken, as the paper does not say which, as (a1) the 10 ms
    window ending at onset, (a2) the earliest full window (-30 to -20 ms) or (a3) all pre-touch
    windows; (2) the performance measure, read as (a) the fraction of touches detected at the best
    post-touch time point or (b) the percent correct over touch and non-touch samples, at the
    best post-touch time point, in both cases with the threshold that maximizes percent correct
    on the training half (the Methods' "optimal threshold", which they do not define further; no
    other criterion for it is in the paper); (3) whether the 1000 draws pair across neurons by touch
    (they cannot, as neurons were recorded apart; independent draws are used, as the Methods
    imply). The number of neurons where the mean performance first reaches 95% is found for each
    reading of (1) and (2); reproduced when it is within tolerance under all, else
    methods_underspecified with every result shown.
- id: fig4a-touch-detection-outside
