- id: fig3c-touch-spikes-l4c2
  statement: In L4 C2 neurons 70.6 +- 20.9% (mean +- s.d.) of spikes during exploration are coupled
    to touch, within an average of 14.9% of exploration time.
  source: Results, L4 responses are temporally precise, paragraph 8; Figure 3C
  quote: Over the L4 C2 population, 70.6% ± 20.9% (mean, s.d.) of spikes were coupled to touch in
    an average of 14.9% of exploration time
  expected:
  - quantity: touch-coupled fraction of exploration spikes, mean over 31 cells
    value: 70.6
    tolerance: 20.9
    unit: '%'
  - quantity: fraction of exploration time in touch windows, mean
    value: 14.9
    tolerance: 1.49
    unit: '%'
  criterion: Methods, Spikes accounted by active sensation. Exploration time is whisking epochs
    with touch epochs, leaving out touches >100 ms, within the sample epoch (Results, paragraph
    7, "during whisking or touch in the sample epoch (exploration time)"). Each spike in exploration time is indexed by
    the time since the closest touch onset, less the cell's latency; y_ton(t_i) is the number of
    spikes within t_i of onset; the cutoff t_on is the first t_i where the increment falls below
    the 95th percentile of the increments of 1000 surrogate curves from shuffled spike times,
    curves smoothed by a degree-11 polynomial before differencing. The cutoff is the point where
    the curve levels off after its rise (Results, paragraph 7, "At some window size, the curve
    levels off ... This transition point defines the proportion of touch-coupled spikes"; Methods,
    "these curves rise steeply and then plateau"; the example cell's window is 8 to 40 ms), so
    t_on is the first t_i at which the smoothed increment, having been above the surrogates' 95th
    percentile at an earlier t_i, falls below it. A dip of the polynomial before the rise is not
    the cutoff; the literal search from t_i = 1 ms is shown as a variant only. The touch-coupled fraction is
    y_ton(t_on) over all exploration spikes; the time fraction is the time within [latency,
    latency + t_on] after touch onsets over exploration time. Open details, (1) the step of t_i,
    taken as 1 ms (the paper's bin for touch analyses); (2) the shuffle, read as (a) spike times
    drawn uniformly over exploration time or (b) the cell's spike times circularly shifted within
    each trial's exploration time; (3) "closest touch onset", read as (a) the nearest onset before
    the spike or (b) the nearest onset either side; (4) the range of t_i over which y_ton is built
    and fitted, which the paper does not give, read as (r100) 0 to 100 ms (the limit for prolonged
    touches) or (r200) 0 to 200 ms. All combinations of (2), (3) and (4) are run; reproduced when
    both values are within tolerance under all, methods_underspecified when they disagree.
