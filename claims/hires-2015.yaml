  source: Results, Decoding touch, paragraph 2; Figure 4C
  quote: a large population of neurons (1000) was required to provide even a rough estimate of
    whisking phase (24° in C2, 33° outside at d′ = 1 performance, equivalent to 76% correct
    discrimination)
  expected:
  - quantity: phase resolution at 76% correct, 1000 L4 C2 neurons
    value: 24
    tolerance: 2.4
    unit: deg
  - quantity: phase resolution at 76% correct, 1000 L4 outside C2 neurons
    value: 33
    tolerance: 3.3
    unit: deg
  criterion: Methods, Population decoding. Per neuron, spikes aligned to the phase of each whisk
    cycle with peak amplitude >2.5 deg, binned in 120 bins over -pi to pi; the cycles are the
    whisking cycles of Methods, Whisker analysis, as for phase tuning (whisking epochs lie outside
    touch epochs, "Whisking cycles during licking or within 70 ms after touch were excluded", and
    "Whisking epochs used for phase analysis had monotonic phase for a complete whisking cycle"); neurons drawn with
    replacement and their responses circularly shifted to give uniformly distributed preferred
    phases; a naive Bayes classifier discriminates the population response at two phases; the
    phase difference reaching 76% correct is found, median over 100 runs (Figure 4C legend).
    Open details, (1) the response per cycle, read as (a) the spike count in each phase bin of one
    cycle (Poisson or multinomial likelihood over cycles) or (b) the cycle-averaged rate per bin
    used as a Poisson mean; (2) the shifts, read as (a) random uniform shifts or (b) shifts that
    place preferred phases evenly; (3) bins with no spikes in the likelihood, which the paper
    does not treat, read as add-one (Laplace) smoothing of counts or a floor rate under (1)(b), the
    paper giving no value for either. Reproduced when both values are within tolerance and C2 is
    better than outside under all readings, else methods_underspecified.
- id: fig5c-modulation-index
  statement: Touch response magnitude of L4 C2 neurons is strongly modulated by touch order,
    whisker velocity before touch and maximum curvature during touch, with mean modulation indices
    of 0.71 +- 0.25, 0.71 +- 0.27 and 0.72 +- 0.23.
  source: Results, Low spike count variability, paragraph 2; Figure 5A-C
  quote: Touch response magnitude was highly modulated by each of the three variables (mean
    modulation index ... touch order, 0.71 ± 0.25; velocity, 0.71 ± 0.27; max curvature, 0.72 ±
    0.23; mean ± std
  expected:
  - quantity: modulation index by touch order, mean over 31 cells
    value: 0.71
    tolerance: 0.25
  - quantity: modulation index by pre-touch velocity, mean
    value: 0.71
    tolerance: 0.27
  - quantity: modulation index by maximum curvature, mean
    value: 0.72
    tolerance: 0.23
  criterion: Figure 5 legend. Per L4 C2 cell, touches sorted by the property and split into 10
    bins with equal numbers of touches; the mean spikes per touch in the cell's spike integration
    window (touch spike window) per bin; modulation index (max bin - min bin)/(max bin + min bin).
    Properties, order of the touch in its trial; whisker velocity at touch onset (d theta/dt);
    maximum curvature change during the touch. Open details, (1) velocity, read as (a) the
    velocity at the onset frame ("at touch onset", Figure 5A legend) or (b) the velocity in the
    frame before onset ("just before touch", Results; "pretouch velocity", Methods); (2) curvature,
    read as (a) max |Delta kappa| over the whole touch or (b) over 0 to 20 ms after onset (the
    window of the Methods for clustering); (3) touch order, where ties make equal bins
    impossible, read as (a) ranks with ties broken at random or (b) bins of whole order values
    as near equal as they can be. Reproduced when all three means are within tolerance under all
    readings, else methods_underspecified.
- id: fig5-modulation-correlations
  statement: Across cells, responsiveness to pre-touch velocity and to maximum curvature covary
    strongly (r = 0.80), and responsiveness to touch order is somewhat less correlated with both
    (r = 0.70 and 0.65).
  source: Results, Low spike count variability, paragraph 2; Figure 5B-C
  quote: Responsiveness to pretouch velocity and max curvature covaried strongly (pairwise
    correlation coefficient 0.80, p = 4.3e-8), whereas touch order response was somewhat less
    correlated with velocity and curvature (correlation coefficients 0.70, 0.65, p = 1.0e-5, p =
    8.2e-5)
  statistics:
  - about: velocity against curvature
    test: correlation
    statistic: r = 0.80
    p: 4.3e-8
  - about: touch order against velocity
    test: correlation
    statistic: r = 0.70
    p: 1.0e-5
  - about: touch order against curvature
    test: correlation
    statistic: r = 0.65
    p: 8.2e-5
  expected:
  - quantity: correlation, velocity and curvature responsiveness
    value: 0.80
    tolerance: 0.08
  - quantity: correlation, touch order and velocity responsiveness
    value: 0.70
    tolerance: 0.07
  - quantity: correlation, touch order and curvature responsiveness
    value: 0.65
    tolerance: 0.065
  depends_on:
  - fig5c-modulation-index
  criterion: The paper does not say what is correlated. Readings, (a) Pearson correlation across
    the 31 L4 C2 cells of the modulation indices of fig5c-modulation-index (the reported p values
    are those of Pearson r with 29 degrees of freedom, e.g. r = 0.70 gives p near 1e-5); (b)
    Pearson correlation of the peak-normalized 10-bin tuning curves (Figure 5B) pooled over cells
    and bins. Reproduced when all three r are within tolerance with p < 0.05 under one reading,
    with velocity-curvature the largest; the readings that match are said.
- id: fig6s1b-clusters-less-variable
  statement: The clustering of touches into five groups finds subsets with significantly less
    variability in touch properties than random samples of touches.
  source: Figure 6, figure supplement 1B legend
  quote: The procedure finds subset of points with significantly less behavioral variability than
    in the full dataset
  criterion: Methods, Analysis of spike count variance. Per L4 C2 cell, touches with inter-contact
    interval >250 ms; z-scored pre-touch velocity and maximum curvature change 0 to 20 ms after
    touch; OPTICS ordering; the run of N consecutive ordered touches with the smallest sum of
    pairwise distances is the first group, removed, and repeated for five groups, N being 20% of
    the touches (Figure 6, figure supplement 1A) and at least 20. Open details, (1) OPTICS
    parameters (minimum points, maximum radius), not given, read as (a) minimum points 5 with
    unbounded radius (the scikit-learn default) or (b) minimum points N; (2) inter-contact
    interval, read as (a) time since the previous touch offset or (b) since the previous onset;
    (3) N, read as 20% of the selected touches at the start, fixed for all five groups. The
    standard deviation of z-scored velocity in each group is compared with that of 1000 random
    samples of N touches; reproduced when, under all readings, the group standard deviation is
    below the 5th percentile of the random ones for the first group in most (>50%) cells.
- id: fig6cd-ff-near-binomial
  statement: Across L4 C2 neurons, the Fano factor following touch drops below one, lying close to
    the binomial limit (the theoretical minimum) for most cells.
  source: Results, Low spike count variability, paragraph 4; Figure 6C-D
  quote: Across the population of neurons within C2 the FF following touch dropped below one, with
    the FF lying close to the binomial limit for most cells
  depends_on:
  - fig6s1b-clusters-less-variable
  criterion: Figure 6C legend and Methods. Per cell and per touch group (fig6s1b, same readings),
    FF of spike counts in 10 ms windows starting 0 to 20 ms after touch in 1 ms steps; the
    minimum over windows per group, and the minimum across the five groups. Open details, (1)
    which minimum, read as (a) per group (Figure 6C red circles) or (b) across groups (blue
    circles); (2) "close", which the paper does not define, read as (a) the binomial limit 1 - m
    lies inside the cell's 95% resampling interval of the FF (1000 resamples, Methods) or (b) the
    FF lies nearer the binomial limit than the Poisson value 1. Reproduced when the population mean
    of the minimum FF is below 1 and, for more than half of the cells, the FF is close under the
    reading in force; every combination is run, the outcome being the one they all give, else
    methods_underspecified.
- id: fig6d-not-refractory
  statement: The low Fano factor after touch cannot be explained by a Poisson process with a 2.3
    ms refractory period and rates matched to each neuron.
  source: Results, Low spike count variability, paragraph 6; Figure 6D
  quote: Comparing the simulations with actual spike trains revealed that L4 neuron response
    precision could not be explained by the refractory period alone
  depends_on:
  - fig6cd-ff-near-binomial
  criterion: Methods, last paragraph, and Figure 6D. Per L4 C2 cell, spike trains simulated as a
    Poisson process with an absolute refractory period of 2.3 ms (the median minimum ISI) whose
    average touch response is matched to the data (Methods, "with average touch response matched
    to the data"), so the output PSTH, not the input rate, equals the cell's touch PSTH (1 ms bins),
    so the rate is raised to make up for the spikes the refractory period removes, as the free
    rate lambda(t) = r(t) / (1 - integral of r over [t - 2.3 ms, t)) of Berry and Meister (1998),
    the paper's cited method, or by adjusting the rate until the simulated PSTH matches; using
    the PSTH directly as the rate is not the paper's model and is shown as a variant only. One
    simulated train per real touch; FF computed as for the data in 10 ms sliding windows. Open details, (1) which touches,
    read as all >250 ms touches pooled, or per group as fig6cd; (2) the comparison, which the
    paper gives only as a figure, read as (a) the population mean data FF below the model's at
    the window of the data minimum, by more than the sum of the two s.e.m. (Figure 6D error
    bars), or (b) the per-cell data FF below the model's in more than half of the cells by a
    sign test at p < 0.05. Every combination is run; the outcome is the one they all give, else
    methods_underspecified.
- id: fig6e-sample-epoch-ff
  statement: Counting spikes over the whole sample epoch, ignoring the millisecond structure of
    behavior, gives a very large Fano factor of 6.57 +- 5.41 (mean +- s.d. over L4 C2 cells).
  source: Results, Low spike count variability, paragraph 7; Figure 6E, condition 1
  quote: Response variability was very large (FF = 6.57 mean ± 5.41 s.d.) when we ignored the
    millisecond time scale of behavior
  expected:
    quantity: sample-epoch FF, mean over L4 C2 cells
    value: 6.57
    tolerance: 5.41
  criterion: Figure 6E legend, condition 1. Per L4 C2 cell, FF across trials of the spike count
    while the pole is within reach; mean and s.d. over the 31 cells. Reproduced when the mean is
    within tolerance and above 1.
- id: fig6e-random-38ms-ff
  statement: Counting spikes in random 38 ms windows, as many per trial as there are touches, gives
    a Fano factor of 1.59 +- 0.49.
  source: Results, Low spike count variability, paragraph 7; Figure 6E, condition 2
  quote: Integrating activity in time windows as wide as average touch response periods (38 ms)
    gave a FF of 1.59 ± 0.49
  expected:
    quantity: random 38 ms window FF, mean over L4 C2 cells
    value: 1.59
    tolerance: 0.49
  criterion: Figure 6E legend, condition 2. Per cell, in each trial as many 38 ms windows at random
    times as the trial has touches; FF across all windows of the cell; mean over the 31 cells.
    Open detail, where windows are drawn, read as (a) within the sample epoch or (b) anywhere in
    the trial ("randomly sampling from the trial"); both are run with 100 random draws, the mean
    reported. Reproduced when the mean is within tolerance under both, else
    methods_underspecified.
- id: fig6e-touch-38ms-ff
  statement: Counting spikes in 38 ms windows aligned to touch onset (after a 6 ms latency) gives
    a Fano factor of 1.37 +- 0.74.
  source: Results, Low spike count variability, paragraph 7; Figure 6E, condition 3
  quote: and FF of 1.37 ± 0.74 ( Figures 6E, 3 ) when aligned to touch onset
  expected:
    quantity: touch-aligned 38 ms window FF, mean over L4 C2 cells
    value: 1.37
    tolerance: 0.74
  criterion: Figure 6E legend, condition 3. Per cell, spike counts in the window 6 to 44 ms after
    each touch onset; FF across touches; mean over the 31 cells. Open detail, the touches, read
    as (a) all touches or (b) touches with inter-contact interval >250 ms; both are run, and the
    outcome is the one both give, else methods_underspecified.
- id: fig6e-touch-10ms-ff
  statement: A narrower 10 ms window after touch reduces the Fano factor to 0.73 +- 0.19.
  source: Results, Low spike count variability, paragraph 7; Figure 6E, condition 4
  quote: Using a narrower touch window of 10 ms reduced the FF to 0.73 ± 0.19
  expected:
    quantity: minimum 10 ms window FF after touch, mean over L4 C2 cells
    value: 0.73
    tolerance: 0.19
  criterion: Figure 6E legend, condition 4. Per cell, the minimum over 10 ms windows starting 0 to
    20 ms after touch onset (1 ms steps) of the FF across touches; mean over the 31 cells. Open
    details, (1) the touches, as fig6e-touch-38ms-ff; (2) the window starts, read as (a) 0 to 20
    ms or (b) 0 to 10 ms so that windows lie within 0 to 20 ms. Every combination is run; the
    outcome is the one they all give, else methods_underspecified.
- id: fig6e-similar-touch-ff
  statement: Computed only across similar touches, the 10 ms Fano factor falls further to 0.54 +-
    0.27, so that L4 responses to touch are almost noiseless.
  source: Results, Low spike count variability, paragraph 7; Figure 6E, condition 5
  quote: The FF was further reduced to 0.54 ± 0.27 when calculated only across similar touches
  depends_on:
  - fig6s1b-clusters-less-variable
  expected:
    quantity: minimum 10 ms window FF within touch groups, mean over L4 C2 cells
    value: 0.54
    tolerance: 0.27
  criterion: Figure 6E legend, condition 5. As fig6e-touch-10ms-ff, within each of the five touch
    groups of fig6s1b-clusters-less-variable (same readings). Open detail, the per-cell value,
    read as (a) the minimum across the five groups (Figure 6C blue circles) or (b) the mean over
    groups of each group's minimum. Every combination is run; reproduced when the mean is within
    tolerance under all and, as the paragraph states, the five conditions of Figure 6E fall in
    order (1 > 2 > 3 > 4 > 5) under the same readings; else methods_underspecified.
- id: whisk-cycle-spikes
  statement: L4 neurons fire few spikes during whisker movements, on average fewer than 0.15 spikes
    per whisk cycle, which hinders decoding of whisking phase.
  source: Discussion, paragraph 7; Figure 4
  quote: their low spike rates during whisker movements (mean <0.15 spikes/whisk cycle) hinders
    efficient decoding of whisking phase from population activity
  criterion: Per L4 cell (inside and outside C2), spikes per whisk cycle over the whisking cycles
    used for phase analysis (amplitude >2.5 deg, monotonic phase, not during licking or within 70
    ms after touch). Open detail, the population, read as (a) L4 C2 cells or (b) all 41 L4 cells,
    and the mean as (a) over cells or (b) over all cycles pooled. Reproduced when the mean is
    below 0.15 under all readings, else methods_underspecified.
