# Claims for Hires, Gutnisky, Yu, O'Connor & Svoboda (2015), eLife 4, e06619, "Low-noise encoding
# of active touch by layer 4 in the somatosensory cortex", on dandiset 000013.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21, protocol
# pilot-10 as stated in docs/protocol.md (Reader).
#
# Text read: the version of record (PMC4525079) as served by Europe PMC
# (paper/10.7554-elife.06619.txt): Introduction, Results, Discussion, Materials and methods, Table 1,
# the legends of Figures 1 to 6 and of their figure supplements (Figure 1, supplements 1 and 2;
# Figure 2, supplement 1; Figure 3, supplements 1 and 2; Figure 4, supplement 1; Figure 6,
# supplement 1), the decision letter and the author response. eLife has no supplement beyond
# these figure supplements, whose legends are in the text. No PDF was supplied, so the figure
# images were not read. Table 1 came through as one run of text; its columns were read in order
# (9 measures, rows of mean +- s.d., median and range for each of three populations). One cell of
# it is garbled, the L5 "Spikes evoked (touch)" mean printed "24.0-18.6%", read as 24.0 +- 18.6%
# from Results, paragraph on Figure 3C.
#
# Code read: the paper links the Janelia Whisker Tracker (openwiki.janelia.org, not code for the
# analyses) and https://github.com/hireslab/HLab_Whiskers for the detection of contact periods.
# Read at HEAD, commit cdbc9148da6c505ba940b971fbe419b11cb80049 (2020-12-11); the last commit
# before publication is 0eb360a (2014-11-19). It holds MATLAB classes for behaviour trials (+Solo),
# whisker tracking output and curvature (+Whisker), ephys sweeps and trial arrays (+LCA) and the
# semi-automatic contact detector and curation GUI (Contacts/autoContactAnalyzerSi.m,
# trialContactBrowser). It holds none of the paper's analyses (no whisking-phase decomposition with
# a 6 to 60 Hz filter and Hilbert transform, no touch windows, Fano factors, OPTICS clustering or
# decoders). It therefore settles no criterion below; touch onsets and offsets are taken as given
# by the contact detection. Its WhiskerSignalTrial.get_whisk_peaks uses a 10 to 25 Hz filter; the
# paper does not use it, and the Methods' 6 to 60 Hz filter is followed.
#
# The dandiset's archive description: data from a study of the precision of cortical spike trains
# during active tactile behaviour in mice performing whisker-based object localization, with
# recordings from excitatory neurons of layer 4 of barrel cortex (this paper).
#
# The data the paper used, as it reports them:
#   - 21 mice (7 C57BL/6, 3 VGAT-ChR2(H134R), 8 PV-ires-cre, 3 PV-ires-cre x Ai32), trimmed to the
#     C2 whisker, performing a go/no-go pole localization task (lick for the posterior pole).
#   - 52 loose-seal cell-attached (juxtacellular) single-unit recordings, one per session (52
#     sessions), 10 kHz: 31 L4 cells in C2, 10 L4 cells outside C2 (>200 um from the C2 centre,
#     in the barrel field), 11 L5 cells near C2 (98 to 324 um from the C2 centre). 115 +- 60 trials
#     per neuron. Layer is assigned from manipulator depth and pipette shape; barrel from a DiI
#     track. 7 of the recordings were reported in O'Connor et al. 2013.
#   - Per trial, whisker video at 1000 fps for 4 to 5 s, tracked for azimuthal angle (theta) and
#     curvature (kappa, change Delta kappa); contact (touch) periods detected and curated to 1 ms;
#     pole timing (sample epoch, pole in reach), licks, trial outcome.
#
# Definitions used throughout, from the Methods (Whisker analysis; Spike analysis; Spikes
# accounted by active sensation; Analysis of spike count variance) and legends:
#   - Touch epochs are periods of contact. For other epochs theta is band-passed 6 to 60 Hz
#     (fourth-order Butterworth) and Hilbert transformed; whisking epochs have amplitude >2.5 deg;
#     whisking cycles during licking or within 70 ms after touch are excluded, and phase analyses
#     use cycles with monotonic phase over a full cycle. Non-whisking periods are contiguous
#     periods of at least 100 ms with no touch or licking and amplitude <1.25 deg.
#   - Exploration time is whisking epochs including touch epochs, excluding touches >100 ms.
#   - The touch spike window of a cell runs from its onset latency to its touch response cutoff
#     t_on. Latency is where the 1 ms PCTH rises above the pre-touch mean (-50 to 0 ms) by two
#     standard deviations. t_on is the first window size, after the curve's rise, at which the
#     increase of the cumulative count of spikes indexed to the closest touch onset falls below the 95th percentile of the
#     slopes of 1000 spike-time shuffles, the curves smoothed by a degree-11 polynomial.
#   - Phase tuning is a 12-bin histogram fitted by A[1 + cos(theta - phi_pref)] + B, A, B > 0;
#     modulation depth A / (A + B).
#   - The Fano factor (FF) is the variance of the spike count over its mean, across trials or
#     touches; the binomial limit for a mean count m < 1 is 1 - m.
# Unless a criterion says otherwise, a population value is the mean (or median) across the cells
# of that population, each cell contributing one value, as Table 1 is laid out.
#
# Tolerances. Where the paper gives mean +- s.d., the tolerance is the s.d., the paper's stated
# spread (protocol, Reader, step 3); otherwise 10% of the value. Counts of animals, sessions and
# cells are given tolerance 0, as they are counts the dataset either holds or does not.
