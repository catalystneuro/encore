  source: Results, Behavioral learning enhances ICMS-evoked population activation over time,
    paragraph 2; Figure 2B
  quote: In one representative animal at a fixed stimulation current of 4 µA, the number of
    ICMS-activated neurons increased over time within the same field of view (FOV), with
    progressively more cells recruited from week 0 (71 neurons) to week 1 (114 neurons) and to
    week 2 (220 neurons)
  expected:
  - quantity: activated neurons, week 0, 4 uA
    value: 71
    tolerance: 7.1
  - quantity: activated neurons, week 1, 4 uA
    value: 114
    tolerance: 11.4
  - quantity: activated neurons, week 2, 4 uA
    value: 220
    tolerance: 22
  criterion: Activated volumetric ROIs counted as in the Methods (Detection and quantification
