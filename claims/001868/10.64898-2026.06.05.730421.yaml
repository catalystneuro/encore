    quantity: conduction velocity range over currents
    value: 0.235
    tolerance: 0.062
    unit: m/s
  criterion: The range rule applies, so the claim holds for velocities within 0.18 to 0.297 m/s
    (the range widened by 10% of each bound); the expected value is the range's centre with that
    span. As fig_s4 plot_latency_jitter, pulse-locked modulated responses (z-score below 100) per
    current; distance = |stimulation contact depth - unit depth| in um; latency = the response's
    interpulse spike latency (bootstrap mean of the peak time of the spike-probability curve,
    pulse_locked_response_metrics.py) and jitter its trial-to-trial spread (the table's jitter
    column, built outside the repository; read as the bootstrap SD of latency, with its square as a
    variant since the code labels the axis ms^2). The "monotonically increasing segment" is the
    code's 120 to 840 um range - responses there binned in 120 um bins (edges 60, 180, ..., 780),
    median latency per bin, OLS of bin medians on bin centres, velocity = 1e-3 / slope m/s
    (slope in ms/um). Reproduced when the velocity at each of 4, 5 and 6 uA is within range and
    an OLS of jitter on distance over all PL responses has a slope not different from 0 at p <
    0.05; partially reproduced when the velocities hold at one or two currents, or all hold but
    the jitter slope is significant.
- id: fig5-tracked-units
  statement: UnitMatch tracking yielded 34 units spanning early and late phases across 6 animals,
    with between-session waveform distances of tracked units 6.8-fold smaller than distances to
    nearby non-matched units; in these units PL modulation increased over training while NPL
    modulation did not, and PL time to maximum firing rate decreased.
  source: Results, Millisecond pulse-locking dynamics differentiate learning-induced plasticity,
    paragraph 5; Figure 5I to 5M (fig. S8, not available)
  quote: This yielded 34 tracked units spanning both early and late learning phases across 6
    animals (fig. S8A, B). ... Waveform distances between sessions of the same tracked unit were
    6.8-fold smaller than distances to nearby (within 2 channels) non-matched units in the same
    session (p = 6.6e-83, Mann-Whitney U; fig. S8C) ... Analyses of the 34 tracked units support
    the main findings ... PL modulation increased significantly over training while NPL modulation
    did not, and PL time to maximum firing rate decreased (fig. S8D).
  statistics:
  - about: within-track against nearby non-matched waveform distances
    test: Mann-Whitney U test
    p: 6.6e-83
  expected:
  - quantity: tracked units spanning early and late phases
    value: 34
    tolerance: 3.4
  - quantity: ratio of non-matched to within-track waveform distance
    value: 6.8
    tolerance: 0.68
  criterion: Tracks as in the Methods (Unit tracking via electrophysiological recording)
    with UnitMatchPy - match probability above 0.75 linked by connected components, best match
    kept per session, consecutive-session probability at least 0.5, at least 3 sessions, tracks
    with median pairwise waveform distance above 3 times the global median dropped, sessions
    above 5 times the track median dropped, kept when spanning weeks 0 to 1 and 2 to 4. If the
    dataset gives cross-session unit identities, those are used instead and the difference is
    reported. Distance comparison as fig_s8 plot_panel_c, one-sided Mann-Whitney U (within less
    than cross). Modulation and latency trends as fig_s8 plot_panel_d - PL and NPL filtered
    responses of tracked units, per current, two-sided Mann-Whitney U early against late.
    Reproduced when the count and ratio are within tolerance, the distance test gives p < 0.05,
    PL modulation increases at p < 0.05 at one current or more, NPL modulation is significant at
    none, and PL latency decreases at one current or more; partially reproduced when tracks and
    distances hold but a trend part fails.
- id: figs5-movement-onset
  statement: Wheel-movement onset, in 5 animals with reliable encoder recordings, decreased with
    training; median onsets were 122 ms in the fastest animal (Mouse 1), 135 ms across all hit
    trials and 129 ms in the late phase.
  source: Results, Millisecond pulse-locking dynamics differentiate learning-induced plasticity,
    paragraph 4 (fig. S5A to D, not available)
  quote: We evaluated three candidate cutoffs from stimulation onset ... the median wheel-movement
    onset in the fastest animal (Mouse 1, 122 ms; fig. S5D), the median onset across all hit
    trials (135 ms), and the median onset during the late training phase (129 ms), which was
    faster than in the early phase (fig. S5D).
  expected:
  - quantity: median movement onset, Mouse 1
    value: 122
    tolerance: 12.2
    unit: ms
  - quantity: median movement onset, all hit trials
    value: 135
    tolerance: 13.5
    unit: ms
  - quantity: median movement onset, late phase
    value: 129
    tolerance: 12.9
    unit: ms
  criterion: Movement onset per hit trial from the rotary encoder; the onset definition is in the
    code that built the onset table (fig_s5 build_movement_onset_df reads precomputed source
    files) and not in the Methods, so it is open; the author takes it from the dandiset's own
    movement annotation if there is one and otherwise names the readings. Early against late as
    fig_s5 generate_onset_early_late_panel, two-sided Mann-Whitney U on trial onsets, weeks 0 to
    1 against 2 to 4. Reproduced when the three medians are within tolerance and late is faster
    at p < 0.05; partially reproduced when late is faster but a median falls outside tolerance.
- id: figs5-120ms-window
  statement: Restricting the analysis to the first 120 ms after stimulation onset, before movement,
    gave results consistent with the 700 ms window for the distinct longitudinal changes of PL and
    NPL cells.
  source: Results, Millisecond pulse-locking dynamics differentiate learning-induced plasticity,
    paragraph 4 (fig. S5E to H, not available)
  quote: This analysis yielded results consistent with those obtained using the longer 700 ms window
    (fig. S5E-H), supporting that the distinct longitudinal changes of PL and NPL cells arise from
    responses to ICMS
  depends_on:
  - fig5fg-pl-modulation-latency
  - figs4-npl-no-change
  criterion: As fig_s5 (raw_df_sym120ms), responses recomputed with a symmetric window, baseline
    -120 to 0 ms and stimulation 0 to 120 ms (window_config.py symmetric_120ms), modulated, PL
    and NPL filters with z-score below 100; per current, two-sided Mann-Whitney U early against
    late on z-score for PL and NPL. "Consistent" is read as - PL modulation higher late at p <
    0.05 at 2 or more of the 3 currents, and NPL modulation not significant at 2 or more.
    Reproduced when both hold; partially reproduced when one does.
- id: figs6-imaging-short-window
  statement: Using only the first five imaging frames after ICMS onset, both recruitment of tracked
    neurons and the response amplitude of the increasing subset rose significantly from early to
    late training.
  source: Results, Millisecond pulse-locking dynamics differentiate learning-induced plasticity,
    paragraph 4 (fig. S6, not available)
  quote: Both recruitment of tracked neurons and the response amplitude of the increasing subset (
    Fig. 3J ) increased significantly from early to late training (fig. S6B, C), consistent with
    the findings from the full response window.
  depends_on:
  - fig3j-subgroup-increase
  criterion: Planar ROIs whose response crosses the activation threshold after the first five
    frames following ICMS onset (about 132 to 165 ms) are excluded (Results). The measures and
    tests are those of processing/imaging/movement_control/export_recruitment_for_python.m (read
    by python/fig_s6). Recruitment (fig. S6B) - among tracked ROI, channel and current
    conditions of a session that are activated under the full-window rule (more than 5
    consecutive stimulation frames above threshold, onset before 700 ms; export_recruited_traces.m
    keeps only these), the trial-averaged dF/F (smoothed over 5 frames) counts as recruited when
    its maximum over the first 5 frames from onset exceeds the ROI's threshold of 2 x (SD / mean)
    of its full trace; a tracked ROI is recruited at a channel and
    session when it is recruited at any of 4, 5 and 6 uA; the value is the number recruited per
    animal, session and channel. Amplitude (fig. S6C) - for the Fig. 3J subgroup's conditions
    (fig3j-subgroup-increase), the maximum trial-averaged dF/F over the first 5 frames, averaged
    over the subgroup conditions of each animal, session and channel. Each compared weeks 0 to 1
    against weeks 2 to 4 by a two-sided Mann-Whitney U (MATLAB ranksum). Reproduced when both
    increase at p < 0.05; partially reproduced when one does.
- id: figs7-control-no-change
  statement: In control animals without behavioural learning, neither PL nor NPL cells showed
    significant changes in modulation, time to maximum firing rate or peak spike probability.
  source: Results, Millisecond pulse-locking dynamics differentiate learning-induced plasticity,
    paragraph 4 (fig. S7, not available)
  quote: Furthermore, in the control group without behavioral learning, neither PL nor NPL cells
    showed significant changes in any of these metrics (fig. S7), further supporting that the
    longitudinal changes observed in the learning group are associated with behavioral learning.
  criterion: A claim of absence, judged on the test of the paper's code (fig_s7), since the
    supplement is not available. Control mice at 5 uA; responses with modulated, p < 0.05,
    z-score > 0, week below 5, baseline at least 0.5 Hz, more than 5 trials and more than 15
    spikes (the code's control threshold, lower than the 50 of the Methods; 50 is shown as a
    variant). Weeks from each control animal's first session. Two-sided Mann-Whitney U, weeks 0
    to 1 against 2 to 4, on PL z-score, NPL z-score, PL and NPL time to maximum firing rate, and
    PL peak spike probability, at alpha 0.05. Reproduced when none of the five is significant;
    not reproduced when any is. Blocked if the dandiset holds no control mice.
- id: fig6c-kl-divergence
  statement: Hit-miss separation of per-trial spike changes, measured by KL divergence, increased
    over time for both PL and NPL responses, and NPL responses separated hit from miss trials more
    than PL responses in both early and late phases.
  source: Results, Differential behavioral correlates of pulse-locked and non-pulse-locked neurons,
    paragraph 2; Figure 6B and 6C
  quote: While both PL and NPL separation between hit and miss trials increased over time (PL ...
    p FDR = 7.2e-26, r = 0.18; NPL ... p FDR = 6.1e-3, r = 0.05), NPL responses showed greater separation
    between hit and miss trials than PL responses in both early (p FDR = 7.3e-116, r = 1.00) and
    late (p FDR = 7.3e-116, r = 0.34) phases.
  statistics:
  - about: PL, early against late
    test: two-sided Mann-Whitney U test
    statistic: r = 0.18
    p: 7.2e-26
    corrected: FDR (Benjamini-Hochberg)
  - about: NPL, early against late
    test: two-sided Mann-Whitney U test
    statistic: r = 0.05
    p: 6.1e-3
    corrected: FDR (Benjamini-Hochberg)
  - about: NPL against PL, early
    test: two-sided Mann-Whitney U test
    statistic: r = 1.00
    p: 7.3e-116
    corrected: FDR (Benjamini-Hochberg)
  - about: NPL against PL, late
    test: two-sided Mann-Whitney U test
    statistic: r = 0.34
    p: 7.3e-116
    corrected: FDR (Benjamini-Hochberg)
  criterion: Per trial, delta spikes = spikes in the 700 ms train minus spikes in the preceding
    700 ms (Results), for every trial of every modulated response, labelled by its response's PL
    status and by outcome (hit or miss). As hit_miss_histograms.py, per week 0 to 4 and per PL
    class, hit and miss values winsorized at 1% on each side; 1000 bootstrap draws (with
    replacement) of 40% of the smaller group's size from each; KL divergence (scipy entropy) of
    hit from miss histograms on 25 bins over -30 to 50, with 1e-8 added. Early = draws from weeks
    0 and 1 pooled, late = weeks 2 to 4. Four two-sided Mann-Whitney U tests on the bootstrap
    values (PL early against late, NPL early against late, PL against NPL early and late), FDR
    Benjamini-Hochberg. The p-values depend on the number of draws, so the outcome rests on
    direction and significance. Reproduced when PL and NPL each increase and NPL exceeds PL in
    both phases, all at corrected p < 0.05; partially reproduced when NPL exceeds PL in both
    phases but an increase fails. The per-trial table (df_merged.pkl) was built outside the
    repository; which trials it holds (all currents 4 to 6 uA, modulated responses) is taken as
    the paper's text implies.
- id: fig6d-hit-miss-divergence-onset
  statement: PL responses showed no significant hit-miss divergence in firing rate at any time,
    while NPL responses diverged from 65 ms after ICMS onset in the early phase and from 35 ms in
    the late phase, both before movement onset.
  source: Results, Differential behavioral correlates of pulse-locked and non-pulse-locked neurons,
    paragraph 3; Figure 6D
  quote: Despite an increase in KL divergence from early to late learning, PL responses did not show
    any significant hit-miss divergence at any time point. In contrast, NPL responses diverged
    significantly beginning at 65 ms post-ICMS onset during the early period. With training, the
    onset of divergence in NPL neurons shifted earlier to 35 ms.
  expected:
  - quantity: NPL divergence onset, early phase
    value: 65
    tolerance: 6.5
    unit: ms
  - quantity: NPL divergence onset, late phase
    value: 35
    tolerance: 3.5
    unit: ms
  criterion: As hit_miss_psth.py, per group (PL or NPL, early or late) a hit and a miss array of
    firing-rate traces, one row per unit; per time bin a two-sided Mann-Whitney U, signed -log10
    p, clusters of contiguous bins with |value| > -log10(0.05), cluster mass = sum; 1000
    label permutations of rows (seed 42) give the null of the maximum cluster mass; clusters with
    p < 0.05 are significant and the onset is the start bin centre of a significant cluster. The
    traces were precomputed (hit_miss_psth.npz) outside the repository, so the bin width and
    smoothing are open; the legend says "Trial median responses". Readings are 10 ms bins
    smoothed with a Gaussian of sigma 20 ms (the code's train-response rate) and 2 ms bins
    smoothed with sigma 5 ms (the code's fine rate), each the median over a unit's hit or miss
    trials. The code takes the last significant cluster's onset; the first is also reported.
    The tolerances on 65 and 35 ms are 10%, finer than either bin width allows, so an onset
    within one bin width of the paper's value also counts. Reproduced when, under a reading, PL
    has no significant cluster in either phase, NPL has one in both, and the onsets match;
    partially reproduced when the PL-against-NPL pattern holds but an onset does not match.
- id: fig6f-population-coupling
  statement: PL population coupling increased from early to late phases while NPL coupling stayed
    stable, and NPL units had higher population coupling than PL units in both phases.
  source: Results, Differential behavioral correlates of pulse-locked and non-pulse-locked neurons,
    paragraph 4; Figure 6F
  quote: PL coupling increased over time ( Fig. 6F , n early = 494, n late = 899, p FDR = 1.95e-6,
    r = 0.16) while NPL coupling remained stable (n early = 263, n late = 553, p FDR = 0.33, r =
    -0.04). ... In both early and late learning phases, NPL units exhibited significantly higher
    population coupling than PL units (early ... p FDR = 3.4e-25, r = 0.46; late ... p FDR =
    1.7e-22, r = 0.31)
  statistics:
  - about: PL, early against late
    test: two-sided Mann-Whitney U test
    statistic: r = 0.16
    p: 1.95e-6
    corrected: FDR (Benjamini-Hochberg)
    n: 494 early and 899 late
  - about: NPL, early against late
    test: two-sided Mann-Whitney U test
    statistic: r = -0.04
    p: 0.33
    corrected: FDR (Benjamini-Hochberg)
    n: 263 early and 553 late
  - about: NPL against PL, early
    test: two-sided Mann-Whitney U test
    statistic: r = 0.46
    p: 3.4e-25
    corrected: FDR (Benjamini-Hochberg)
  - about: NPL against PL, late
    test: two-sided Mann-Whitney U test
    statistic: r = 0.31
    p: 1.7e-22
    corrected: FDR (Benjamini-Hochberg)
  criterion: Population coupling as the Methods (Population coupling) - per stimulation condition,
    spikes within stimulation trains concatenated; population rate of all other modulated units
    in 1 ms bins, Gaussian sigma 10 ms, mean-centred; coupling = spike-triggered population rate
    at zero lag; normalized by the median of 200 absolute circular-shift values; units with
    fewer than 50 stimulation spikes excluded. As pop_coupling.py, PL and NPL values from 4, 5
    and 6 uA pooled, a session early when its week is below 2, all 6 animals; four two-sided
    Mann-Whitney U tests with FDR Benjamini-Hochberg. Reproduced when PL increases (corrected p
    < 0.05), NPL early against late is not significant at corrected alpha 0.05, and NPL exceeds
    PL in both phases; partially reproduced when the NPL-over-PL difference holds in both phases
    but one of the longitudinal parts fails.
- id: figs9-coupling-robust-and-control
  statement: The higher population coupling of NPL than PL units held within the 120 ms pre-motion
    window and was absent in control animals without behavioural learning.
  source: Results, Differential behavioral correlates of pulse-locked and non-pulse-locked neurons,
    paragraph 4 (fig. S9B, C, not available)
  quote: This difference remained robust when computed within the 120 ms pre-motion time window
    (fig. S9B) and was absent in control animals without behavioral learning (fig. S9C)
  depends_on:
  - fig6f-population-coupling
  criterion: As fig_s9, coupling from the first 120 ms of each train for the behavioural mice and
    from the full train for the control mice (Methods), with the tests of fig6f-population-
    coupling. Holds for the 120 ms window when NPL exceeds PL in both phases at corrected p <
    0.05. The control part is a claim of absence, judged on the same tests in the controls at
    corrected alpha 0.05 (NPL against PL in each phase not significant). Reproduced when both
    parts hold; partially reproduced when one does; blocked in its control part if the dandiset
    holds no control mice.
checks:
- date: 2026-10-21
  kind: agent
  model: "claude-opus-5-5"
  ready: true
  changes:
  - Code read for this check at github.com/XieLuanLab/icms-activation-plasticity commit d1922d16913b50bf6338ff4e0c2953cb8ef43d15, the commit the header names; the criteria's other code references were confirmed against it (filters, animal order, sidedness, effect sizes, the 15-spike control threshold, the week below 2 split of pop_coupling.py, the subgroup rule ascendEnd).
  - fig4i-pyramidal-modulation-increase. The checker reports p 2.0e-4 as not found; the paper prints "p = 2.0e-4" and the checker only looks for "2e-4", so the value is right and was left as it is. The statement now says "driven primarily by", as the paper does.
  - fig2e-density-and-radius-increase. The criterion now says the script drops sessions with no activated ROI within 200 um (its mask on density and radius above 0), a selection step it had left out.
  - figs2-density-peak-200um. The criterion used shells out to 500 um at 4, 5 and 6 uA, pooled over weeks, and a partial outcome at one or two currents; figs2abc_density_lines_rings.m, the script for fig. S2A to C, uses 8 shells to 800 um at 4 and 5 uA with medians per current, week and shell. Rewritten from that script, with the pooled and per-week profiles as readings that must agree.
  - fig3b-tracked-counts. Added that fig3_pipeline_counts.m counts longevity over 5 weekly bins, with the literal one-session count as a variant.
  - fig3i-more-high-intensity-cells. The rule "in at least 2 of the 3 animals" was made up, and the legend's weeks 0 and 4 had been replaced by the script's pooled weeks 0 to 1 and 3 to 4. Both period readings and count or fraction are now named, and the outcome is the one they all give, judged on the pooled animals as the script does.
  - fig3n-late-recruited. The p-values 3.09e-19 and 3.29e-17 were labelled as three-group tests; the text attaches them to the newly recruited against subgroup comparison, and does not say whether they are the Kruskal-Wallis omnibus or the post-hoc p. The labels now say so; the criterion already judges the pairwise comparisons.
  - fig4d-waveform-separation. stim_nonstim_pca.py runs the test one-sided (alternative less) while the legend says two-sided; the code's test is now named as a variant.
  - fig4g-modulated-count-mouse1. The group-level test (pooled counts at each current) was the agent's own choice; the paper, legend and code give none. It is now named as open with two readings (4 uA only, each of 4 to 6 uA) that must agree, else methods_underspecified.
  - fig5e-pyramidal-fraction. Added that generate_figure5.py uses filter_modulated defaults (z-score below 50), which differ from the Fig. 4 filter (below 100).
  - figs6-imaging-short-window. The criterion said the export scripts only export data and so read the measures on its own; export_recruitment_for_python.m and export_recruited_traces.m compute both measures and their rank-sum tests. Rewritten from them (recruitment counts per animal, session and channel among full-window activated tracked conditions; mean first-5-frame maximum dF/F of the subgroup per animal, session and channel).
  - figs3-all-cells-modulation-latency. New claim; the increase in modulation and mild latency decrease across all modulated units (fig. S3B, C) is stated in the Results and had no claim. Its method is from fig_s3 (one-sided tests, as the code runs them).
  - Open. The supplement (figs. S1 to S9) is not in the text, so claims on supplementary panels rest on the Results sentence and the code; the version of record was not read.
  - Open. fig2a-steepest-early judges "steepest decline during weeks 0-1" by comparing the fall over weeks 0 to 2 with weeks 2 to 4, under two fit forms; the paper gives neither the fit form nor a test, so this remains a reading of the text.
  - Open. figs3-all-cells-modulation-latency has no threshold for "decreased mildly"; the latency part is judged on the direction of the medians only.
  - Open. Whether the dandiset holds the control mice (figs2-control-recruitment-stable, figs7-control-no-change, figs9-coupling-robust-and-control) and per-spike waveforms (fig4d-waveform-separation) is for the author to find.
