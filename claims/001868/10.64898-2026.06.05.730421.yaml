# Claims for Kim, Lycke, Zolotavin, Montes, Xie & Luan (2026), "Learning induces
# activation-mechanism-dependent neural plasticity in an intracortical microstimulation task",
# on dandiset 001868.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the bioRxiv preprint, version 1 (doi:10.64898/2026.06.05.730421v1), from its JATS
# XML (paper/10.64898-2026.06.05.730421.txt): main text, figure legends of Figures 1 to 7 and
# Materials and Methods. No PDF was supplied. The supplementary materials (figs. S1 to S9 and
# their legends) were not available: the "Supporting information" section of the text is empty.
# The main findings rest on Figures 2 to 6, which are in the text. Claims about findings shown
# only in the supplement are written from the main-text sentence that states them, and their
# methods are taken from the paper's code for that supplementary figure; the figure itself was
# not read. The code's README calls the paper accepted at Science Advances; the version of
# record was not read.
#
# Code read: github.com/XieLuanLab/icms-activation-plasticity at commit d1922d16913b50bf6338ff4e
# 0c2953cb8ef43d15 (2026-07-15), archived as Zenodo doi:10.5281/zenodo.19561006 (v1.0). It holds
# python/ (figure scripts for Figs. 4 to 6 and figs. S1, S3 to S9, reading processed tables from
# a data/ folder on Zenodo), matlab/ (figure scripts for Figs. 2, 3 and fig. S2) and processing/
# (the upstream pipeline from raw recordings: artifact removal and Mountainsort5 sorting,
# per-response metrics in processing/batch_process/postprocessing/, pulse-locking in
# responses_v2/pulse_locked_response_metrics.py, psychometric thresholds in processing/
# dataloader.py, population coupling in processing/pop_coupling/, imaging ROI analysis in
# processing/imaging/). Where the Methods leave a choice open, the criteria below follow the
# code and say so.
#
# Data the paper used. 12 Thy1-GCaMP6s mice (C57BL/6J-Tg(Thy1-GCaMP6s)GP4.3Dkim/J): 6 behavioural
# mice (4 male, 2 female; the code calls them ICMS92, ICMS93, ICMS98, ICMS100, ICMS101 and
# ICMS83, shown as Mouse 1 to Mouse 6) and 6 control mice from an earlier study (ref. 22) that
# were stimulated, imaged and recorded without behavioural training (the code's control
# coupling uses ICMS43, ICMS45, ICMS48, ICMS54 and ICMS56). Each mouse carries a 32-channel
# ultraflexible NET in S1 under a cranial window. Behavioural mice did an ICMS detection task
# (turn a wheel within the 700 ms, 100 Hz train; 3 uL water), in sessions of four 100-trial
# blocks (10 catch trials at 0 uA and 90 stimulation trials, 3 channels x 3 currents x 10),
# plus a fifth block for planar imaging, over about four weeks. Measured variables: trial
# outcomes (hit, miss, catch responses), response times and wheel movement onset (rotary
# encoder, 5 animals); 30 kHz electrophysiology from the NET, spike sorted (973 units, 6
# animals); volumetric two-photon imaging (25 um steps, 300 um depth, 30 fps, 1 x 1 mm) and
# planar imaging at 100 um depth (ROIs, dF/F, OASIS-deconvolved spikes), with longitudinal
# tracking of planar ROIs in 3 animals (Mouse1 to Mouse3). Only 4, 5 and 6 uA are analysed.
# Weeks of training: in the code, week = ceil(days since the animal's first session / 7), with
# the first session as week 0; early phase = weeks 0 and 1, late phase = weeks 2 to 4; later
# sessions are left out. The dandiset title ("Chronic electrophysiology and two-photon calcium
# imaging of mouse primary somatosensory cortex during intracortical microstimulation learning")
# says it holds these data; whether it holds the control mice is for the author to find.
#
# Outside data (step 4). The paper deposits "processed imaging and electrophysiological
# datasets" at Zenodo doi:10.5281/zenodo.17727762; the code's README instead points to figure
# source data at Zenodo doi:10.5281/zenodo.21382755 and to this dandiset (version 0.260715.2016)
# for the processed recordings. Raw recordings are available on request only. No claim below
# needs outside data: every test is meant to run on the dandiset's own recordings, so all are
# data: dataset. The Zenodo tables may help the author check the dandiset against the paper's
# per-response tables.
#
# Conventions used in the criteria, all from the code unless marked:
# - Electrophysiology "responses" are one unit in one stimulation channel and current
#   condition (Methods). Modulated responses pass the code's filter_modulated (python/utils/
#   filters.py): two-sided paired t-test of per-trial spike counts during the train against
#   the 700 ms before it, p < 0.05, with z-score > 0 (an increase); more than 50 spikes; more
#   than 5 trials; pre-stimulus rate at least 0.5 Hz; current 4 to 6 uA; week below 5;
#   stimulation channels seen on fewer than 5 distinct days dropped; z-score below 100 (Fig. 4)
#   or below 50 (filter_pl and filter_npl defaults, Fig. 5). The Methods give the t-test, 50
#   spikes and 0.5 Hz; the rest is the code's.
# - Modulation score = (mean rate during the train - mean pre-stimulus rate) / SD across trials
#   of the pre-stimulus rate (Methods; stim_response_util.py). Time to maximum firing rate =
#   argmax, between 0 and 700 ms, of the trial-averaged rate in 10 ms bins smoothed with a
#   Gaussian of sigma 20 ms (column t_to_max_10ms_smoothed).
# - Pulse-locking: spikes in each 10 ms interpulse interval in 0.5 ms bins, first 1.5 ms and last
#   0.5 ms blanked (Methods); PLI = mean of the 3 bins around the peak minus the median bin, on
#   the spike-probability curve averaged over 500 bootstrap draws of 20% of trials; pulse-locked
#   when PLI exceeds the 99th percentile of 100 PLIs from uniformly placed spikes of the same
#   count (pulse_locked_response_metrics.py). Peak spike probability = max of that mean curve.
# - Putative pyramidal cells have trough-to-peak at or above 0.45 ms, interneurons below (Fig. 4H
#   legend; cell_type_histogram.py).
# - Early-against-late tests on responses pool all animals, per current, with two-sided
#   Mann-Whitney U tests (legends; utils/longitudinal.py). The ephys effect size r is the
#   rank-biserial 1 - 2U/(n_early n_late), positive when late is higher; the imaging r is
#   |Z|/sqrt(N) (matlab/report_stat.m).
schema_version: 2
dataset:
  archive: dandi
  id: "001868"
paper: doi:10.64898/2026.06.05.730421
claims:
- id: fig2a-threshold-decrease
  statement: Behavioural detection thresholds were lower in the late phase (weeks 2 to 4) than in
    the early phase (weeks 0 to 1), falling from a median of 5.5 uA to 4.2 uA.
  source: Results, Behavioral learning enhances ICMS-evoked population activation over time,
    paragraph 1; Figure 2A
  quote: The detection thresholds in the late phase were significantly lower than those in the
    early phase ( Fig. 2A ), decreasing from a median of 5.5 µA to 4.2 µA (n early = 43, n late =
    80, p = 7.68e-6, r = 0.40).
  statistics:
  - test: two-sided Mann-Whitney U test
    statistic: r = 0.40
    p: 7.68e-6
    n: 43 early and 80 late channel-session thresholds, 6 animals, 18 channels
  expected:
  - quantity: median early-phase detection threshold
    value: 5.5
    tolerance: 0.55
    unit: uA
  - quantity: median late-phase detection threshold
    value: 4.2
    tolerance: 0.42
    unit: uA
  criterion: One threshold per stimulation channel and session, the mean of its four block
    thresholds (Methods, Analysis of behavioral data). Each block threshold is fitted as in
    processing/dataloader.py, with python-psignifit 4 (sigmoid "norm", experiment type "YesNo"),
    on the channel's hits per current with the block's 10 catch trials added as a 0 uA point, and
    read as the current at 0.5 of the fitted sigmoid (getThreshold 0.5). Weeks as in the header;
    thresholds of 0 and weeks above 4 dropped (fig2a_thresholds.m). Two-sided Mann-Whitney U,
    weeks 0 to 1 against weeks 2 to 4. Open, could change the outcome - which sessions count
    (Methods, "Only data that included 4, 5, and 6 μA stimulation amplitudes were analyzed"),
    read as (a) every session with a threshold for that channel (as fig2a_thresholds.m does, on
    a precomputed table), or (b) only sessions in which 4, 5 and 6 uA were all presented on that
    channel. Reproduced when, under a reading, p < 0.05 with the late median lower and both
    medians within tolerance; partially reproduced when the test holds but a median falls
    outside tolerance.
- id: fig2a-steepest-early
  statement: Thresholds fell most steeply in weeks 0 to 1 and changed more gradually, with
    relative stability, in weeks 2 to 4; an exponential fit describes the decline.
  source: Results, Behavioral learning enhances ICMS-evoked population activation over time,
    paragraph 1; Figure 2A legend
  quote: Over the weeks of behavioral learning, detection thresholds decreased ( Fig. 2A and fig.
    S1D), with the steepest decline occurring during weeks 0–1, followed by more gradual changes
    and relative stability in weeks 2–4.
  depends_on:
  - fig2a-threshold-decrease
  criterion: On the channel-session thresholds of fig2a-threshold-decrease (under the reading
    that claim matched), plotted against week, the legend's exponential fit. Its form is not
    given (the fit is not in the code); readings are (a) a exp(-b week) + c and (b) a exp(-b
    week), by least squares. Reproduced when, under both forms, the fitted curve decreases and
    falls more between weeks 0 and 2 than between weeks 2 and 4, and the drop in the weekly
    median between weeks 0 and 2 also exceeds that between weeks 2 and 4.
- id: fig2b-example-recruitment
