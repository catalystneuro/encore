  statistics:
  - about: density within 200 um, early against late, 5 uA
    test: two-sided Mann-Whitney U test
    statistic: r = 0.31
    p: 0.015
    n: 22 early and 40 late channel-session values
  - about: activation radius, early against late, 5 uA
    test: two-sided Mann-Whitney U test
    statistic: r = 0.56
    p: 1.1e-5
