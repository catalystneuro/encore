- id: fig2e-density-and-radius-increase
  statement: At 5 uA, the density of activated neurons within 200 um of the stimulation site and
    the activation radius (the distance enclosing 50% of activated neurons) both increased from
    the early to the late phase.
  source: Results, Behavioral learning enhances ICMS-evoked population activation over time,
