- id: figs2-density-peak-200um
  statement: Activation density, in concentric 100 um shells around the stimulation site, peaked
    at around 200 um.
  source: Results, Behavioral learning enhances ICMS-evoked population activation over time,
    paragraph 3 (fig. S2A, B, not available)
  quote: The activation density peaked at around 200 μm (fig. S2A, B), consistent with previous
