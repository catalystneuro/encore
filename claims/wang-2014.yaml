    reported; fewer under muscimol in most recordings is shown as support, not as the test.
- id: fig3c-model-theta-builds-fields
  statement: In a recurrent network model with asymmetric connections, short-term depression and
    facilitation, and theta input but no sensory cues, a bump of activity travels in each theta
    cycle (theta sequences) and neurons fire over several cycles (firing fields); removing the
    theta input disrupts both.
  source: Results, Network model reproduced the effect of MS inactivation, paragraphs 1 and 3;
    Figure 3c; Supplementary Modeling
  quote: As a result, individual neurons fire during several subsequent theta cycles, forming theta
    modulated firing fields (Fig. 3c and Supplementary Fig. 9e–g), despite complete absence of
    sensory cues. ... This manipulation resulted in the disruption of firing fields and theta
    sequences in the model (Fig. 3c)
  criterion: A simulation; it uses no recorded data. The rate model of Supplementary Modeling
    (equations 1-3) with N = 100, tau = 10 ms, J1 = 15, J0 = 30, tau_R = 0.1 s, tau_F = 0.3 s,
    U = 0.05, g = 1.5, k = 2.5, delta = 0.2 rad, Ornstein-Uhlenbeck noise (10 ms, s.d. 5), and the
    external currents of Supplementary Table 1 (theta/no cues - I = 2, I_theta = 30, I_L = 0,
    f = 7 Hz; no theta/no cues - I = 2, I_theta = 0). Open - the duration, integration step,
    initial state and seed; standard choices (10 s, 0.1 ms Euler, uniform low rates, several
    seeds). Theta sequences measured as the bump's displacement within each cycle; fields as the
    duration over which a unit's rate, smoothed over a cycle, stays above half its peak.
    Reproduced when, with theta, the bump moves within each cycle and units fire over several
    consecutive cycles (fields longer than three cycles), and without theta neither holds.
- id: fig3d-model-cues-keep-fields
  statement: With a slowly moving familiar cue input added to the model, removing theta still
    disrupts theta sequences, but firing fields are maintained when the cue input is strong
    enough.
  source: Results, Network model reproduced the effect of MS inactivation, paragraph 4; Figure 3d
  quote: Once we removed the theta input, the theta sequences were disrupted despite the presence
    of sensory cues, similar to the effect observed in the absence of the cues. However, firing
    fields were maintained with a sufficiently strong cue input (Fig. 3d)
  depends_on:
  - fig3c-model-theta-builds-fields
  criterion: A simulation; it uses no recorded data. As fig3c-model-theta-builds-fields, with the
    cue currents of Supplementary Table 1 (theta/cues - I = 2, I_theta = 30, I_L = 5, f = 8 Hz;
    no theta/cues - I = 2, I_theta = 0, I_L = 5). The speed of the cue location theta_ext(t) is
    not given for Figure 3d (the 2D case uses 2 pi/5 rad/s); readings - that speed, and the
    "slow" and "fast" cue speeds of the Figure 3d legend read as half and twice it. Reproduced when,
    under a cue speed reading, without theta the within-cycle sequences are gone but units keep
    fields that follow the cue.
- id: figs10-model-dc-no-fields
  statement: Without theta, raising the nonspecific input of the model produces fast sequential
    activity, not firing fields.
  source: Results, Network model reproduced the effect of MS inactivation, paragraph 3;
    Supplementary Figure 10b,c
  quote: We tested whether an increase of the nonspecific input to the network would be able to
    support firing fields in the absence of theta, but the model generated fast sequential
    activity (Supplementary Fig. 10b,c) instead of firing fields.
  depends_on:
  - fig3c-model-theta-builds-fields
  criterion: A simulation; it uses no recorded data. As fig3c-model-theta-builds-fields without
    theta, with I raised; the high value is not given (Supplementary Fig. 10b says "high
    amplitude of DC input"); readings I = 4, 6 and 10. Reproduced when, at the raised input, the
    bump moves through the network faster than the field sequence speed with theta and units
    do not fire over durations as long as the fields with theta.
- id: fig4b-linear-track-info
  statement: On a novel linear track, many neurons had firing fields with high information under
    muscimol (0.95 +/- 0.04 bits) as in the post-muscimol recording (0.81 +/- 0.03 bits), with no
    significant difference.
  source: Results, Place fields on a novel linear track after MS inactivation; Figure 4a,b
  quote: 'We observed many firing fields with high firing field information on the novel linear
    track during both muscimol and post-muscimol recordings (firing field information, muscimol:
    0.95 ± 0.04 bits, post-muscimol: 0.81 ± 0.03 bits; WSR, P = 0.23'
  statistics:
  - test: Wilcoxon signed-rank test
    p: 0.23
    n: 290 neurons from 2 animals
  expected:
  - quantity: firing field information on the novel linear track, muscimol
    value: 0.95
    tolerance: 0.04
    unit: bits
  - quantity: firing field information on the novel linear track, post-muscimol
    value: 0.81
    tolerance: 0.03
    unit: bits
  criterion: All units passing the open-field unit criteria (the Figure 4b count, 290, includes
    neurons with no field). Map readings, run each - the open-field adaptive-binning map, and
    the maze map (Gaussian s.d. 17.5 pixels) over distance along the track. A claim of absence
    on the paper's test, a paired WSR over neurons - reproduced when it does not find muscimol
    lower than post at 0.05 (one-sided, the direction of a loss of fields), not reproduced when
    it does; the two-sided p is shown. Figure 4b prints P = 0.022 against P = 0.23 in the text;
    both are reported. The means must also be within tolerance.
- id: fig4b-linear-track-theta-modulation
  statement: Theta modulation of spiking on the novel linear track was lower under muscimol (0.15
    +/- 0.002) than after recovery (0.22 +/- 0.004), confirming the injection was effective.
  source: Results, Place fields on a novel linear track after MS inactivation; Figure 4b
  quote: 'we compared theta modulation of the cell firing between the conditions and found a
    significant reduction of theta modulation during the muscimol recordings (theta modulation,
    muscimol: 0.15 ± 0.002, post-muscimol: 0.22 ± 0.004; WSR, P = 1.2 × 10−25'
  statistics:
  - test: Wilcoxon signed-rank test
    p: 1.2e-25
    n: 290 neurons from 2 animals
  expected:
  - quantity: theta modulation, muscimol
    value: 0.15
    tolerance: 0.002
  - quantity: theta modulation, post-muscimol
    value: 0.22
    tolerance: 0.004
  criterion: Theta modulation of the opening comment for the units of fig4b-linear-track-info.
    Reproduced when both means are within tolerance (the paper's s.e.m.) and a one-sided paired
    WSR finds muscimol lower at p < 0.0001 (the panel's bound); the p-value is reported against
    1.2e-25. Partially reproduced when the test holds and the means are within 10% of the
    paper's values. Readings - the autocorrelogram span of the opening comment.
- id: fig4a-linear-track-remap
  statement: Although the sensory cues were the same, firing fields completely remapped between
    the muscimol and post-muscimol recordings on the novel linear track.
  source: Results, Place fields on a novel linear track after MS inactivation; Figure 4a
  quote: Notably, despite the fact that the sensory cues were the same during the muscimol and
    post-muscimol recordings, firing fields between the muscimol and post-muscimol recordings
    completely remapped (Fig. 4)
  depends_on:
  - fig4b-linear-track-info
  criterion: The paper gives no measure of remapping. Readings, run each - (a) per neuron, the
    Pearson correlation of its muscimol and post-muscimol rate maps, against the correlations of
    mismatched neuron pairs of the same recording; (b) the distance between its muscimol and
    post-muscimol map peaks, against mismatched pairs. "Completely" is read as the matched values
    being no closer than the mismatched ones by a one-sided K-S test at 0.05 (a test the
    Methods list). Reproduced when both readings find no difference; the medians are reported.
    Neurons with information of at least 1.1 bits in either session (the Supplementary Fig. 12f
    threshold for a good field) and all neurons are shown.
- id: figs11-control-fields-stable
  statement: Firing fields formed on a novel linear track under control conditions are more
    stable over two subsequent visits than those formed under muscimol.
  source: Results, Place fields on a novel linear track after MS inactivation; Supplementary Figure
    11a,b
  quote: suggesting that firing fields formed in the absence of MS inputs are less stable than
    firing fields formed under controlled conditions (Supplementary Fig. 11a,b)
  depends_on:
  - fig4a-linear-track-remap
  criterion: The control recordings (136 neurons from 2 animals, two visits Control 1 and Control
    2). The remapping measures of fig4a-linear-track-remap between the two control visits.
    Reproduced when, under each reading, the control matched values are closer than their
    mismatched pairs (one-sided K-S, p < 0.05) and closer than the muscimol against post values
    (one-sided K-S, p < 0.05). Supplementary Fig. 11b also compares information and theta
    modulation between visits by a Wilcoxon rank-sum test; those are reported.
- id: fig5c-platform-info
  statement: On a large novel platform, firing field information after muscimol was much lower
    (0.62 +/- 0.04 bits) than in controls (1.1 +/- 0.04 bits); neurons fired almost independently
    of position.
  source: Results, No place fields on a novel platform after MS inactivation, paragraph 2; Figure
    5b,c and Supplementary Figures 12a,b and 13
  quote: After the injection, the firing field information was significantly lower (0.62 ± 0.04
    bits) than in the control group (1.1 ± 0.04 bits; K-W, H = 81.35, P = 1.6 × 10−17
  statistics:
  - test: Kruskal-Wallis test
    statistic: H = 81.35
    p: 1.6e-17
    n: 145 muscimol neurons from 5 animals and 247 control neurons from 4 animals (text); the
      Figure 5c legend gives 223 neurons from 5 recordings and 372 neurons from 7 recordings
  expected:
  - quantity: firing field information, large novel platform, muscimol
    value: 0.62
    tolerance: 0.04
    unit: bits
  - quantity: firing field information, large novel platform, control
    value: 1.1
    tolerance: 0.04
    unit: bits
  criterion: Open-field maps and unit criteria of the opening comment, first exposure to the
    large novel platform, muscimol against saline control recordings. Readings, run each - the
    neuron sets of the text (145 and 247, also in Supplementary Fig. 12) and of the legend (223
    and 372); bin and smoothing readings of the opening comment. Reproduced when, under one
    reading, both means are within tolerance and a Kruskal-Wallis test of muscimol against
    control gives p < 0.001 with muscimol lower; H and p are reported against 81.35 and 1.6e-17.
    The data set holds one rat; if it lacks a control or muscimol group, the comparison its
    sessions allow (muscimol against post-muscimol on the platform) is shown as a variant.
- id: fig5b-platform-wall-fields
  statement: Under muscimol on the novel platform, the few neurons that formed firing fields did so
    close to the walls and corners.
  source: Results, No place fields on a novel platform after MS inactivation, paragraph 2;
    Supplementary Figures 12f,g and 13
  quote: We found that hippocampal neurons were active almost independently of animals’ position
    ... In some recordings, a few neurons formed firing fields in close proximity of walls and
    corners of the platform
  depends_on:
  - fig5c-platform-info
  criterion: Neurons of fig5c-platform-info with information above 1.1 bits (Supplementary Fig.
    12f legend), muscimol recordings. Each field peak is assigned to the periphery or the middle;
    the border is a dashed line in Supplementary Fig. 12f whose position the text does not give;
    readings 15 cm and 25 cm from the walls. Reproduced when, under each reading, more of these
    peaks lie at the periphery than its share of the platform area predicts (one-sided binomial
    test at 0.05, as a test is not given), and the number of such neurons is a minority of all
    muscimol neurons; counts reported.
- id: figs14-no-stable-fields
  statement: Over an hour on the novel platform under muscimol, no stable firing fields formed;
    firing field information did not differ between four 15-min segments.
  source: Results, No place fields on a novel platform after MS inactivation, paragraph 2;
    Supplementary Figure 14
  quote: However, we did not observe any stable firing fields (K-W, firing field information
    between four 15-min segments, df = 3, χ2 = 6.22, P = 0.1
  statistics:
  - test: Kruskal-Wallis test
    statistic: chi2(3) = 6.22
    p: 0.1
  depends_on:
  - fig5c-platform-info
  criterion: A claim of absence on the paper's test. The muscimol platform recordings cut into
    four 15-min segments (0-15, 15-30, 30-45, 45-60 min); information per neuron and segment;
    Kruskal-Wallis across the four segments (df = 3). Reproduced when p >= 0.05 and the segment
    means stay low (below the control mean of fig5c-platform-info); not reproduced when p < 0.05
    with a rising trend. Chi-squared and p are reported against 6.22 and 0.1.
- id: figs15-higher-speed
  statement: After the injection animals ran faster on the platform, but this change was not
    specific to the novel environment.
  source: Results, No place fields on a novel platform after MS inactivation, paragraph 2;
    Supplementary Figure 15a-c
  quote: We observed several changes in the behavior of animals after the injection, such as higher
    running speed (Supplementary Fig. 15a–c) and stereotyped patterns of exploration, but none of
    these changes could explain these results because they were not specific to the novel
    environment.
  criterion: Mean running speed per recording from the tracked position, muscimol against post
    (or control) recordings, on the novel and the familiar platform, by a one-sided Wilcoxon
    rank-sum test at 0.05 (the test of the Supplementary Fig. 15 legend). Reproduced when speed is
    higher after muscimol on the novel platform and also on the familiar platform. Open - the
    speed smoothing; standard choice, positions smoothed over 0.5 s.
- id: figs16-small-platform
  statement: On a smaller novel platform under muscimol, one animal formed place fields and the
    other did not.
  source: Results, No place fields on a novel platform after MS inactivation, paragraph 3;
    Supplementary Figure 16a,b
  quote: in that one animal formed and one animal did not form place fields on a small novel
    platform
  criterion: The smaller platform recordings (223 neurons from 2 animals), information per neuron
    in the muscimol and post-muscimol sessions. "Formed place fields" is not defined; readings,
    run each - (a) the muscimol information is not lower than post by a one-sided WSR at 0.05;
    (b) the share of neurons above 1.1 bits under muscimol is at least half that of post.
    Reproduced when, under a reading, one animal meets it and the other does not. The data set
    holds one rat; it can show one of the two outcomes only.
- id: fig6-repeated-muscimol-low
  statement: On days 1 to 3 of muscimol visits to the same novel platform, firing field information
    stayed low (0.63 +/- 0.07, 0.69 +/- 0.06 and 0.9 +/- 0.08 bits).
  source: Results, Multiple visits are required to form compound place fields; Figure 6
  quote: 'Firing field information remained low during all three muscimol recordings (day 1: 0.63 ±
    0.07 bits, day 2: 0.69 ± 0.06 bits, day 3: 0.9 ± 0.08 bits'
  expected:
  - quantity: firing field information, muscimol, day 1
    value: 0.63
    tolerance: 0.07
    unit: bits
  - quantity: firing field information, muscimol, day 2
    value: 0.69
    tolerance: 0.06
    unit: bits
  - quantity: firing field information, muscimol, day 3
    value: 0.9
    tolerance: 0.08
    unit: bits
  criterion: Open-field maps and unit criteria of the opening comment; the recordings on three
    consecutive days in the same platform (39 to 75 neurons from 3 animals). Reproduced when each
    day's mean is within tolerance and below the same day's post-muscimol mean
    (fig6-repeated-post-normal).
- id: fig6-repeated-post-normal
  statement: After recovery on each of days 1 to 3, firing fields on the same platform were normal,
    with high information (1.1 +/- 0.08, 1.5 +/- 0.07 and 1.3 +/- 0.08 bits).
  source: Results, Multiple visits are required to form compound place fields; Figure 6
  quote: 'we observed normal firing fields with high firing field information (day 1: 1.1 ± 0.08
    bits, day 2: 1.5 ± 0.07 bits, day 3: 1.3 ± 0.08 bits'
  expected:
  - quantity: firing field information, post-muscimol, day 1
    value: 1.1
    tolerance: 0.08
    unit: bits
  - quantity: firing field information, post-muscimol, day 2
    value: 1.5
    tolerance: 0.07
    unit: bits
  - quantity: firing field information, post-muscimol, day 3
    value: 1.3
    tolerance: 0.08
    unit: bits
  criterion: As fig6-repeated-muscimol-low, the post-muscimol visits. Reproduced when each day's
    mean is within tolerance.
- id: fig6-familiar-impervious
  statement: Only after 3 days of familiarization without injections did firing fields on the
    platform become impervious to MS inactivation (1.24 +/- 0.1 bits under muscimol).
  source: Results, Multiple visits are required to form compound place fields; Figure 6
  quote: Only after a 3-d familiarization without any injection did firing fields became impervious
    to the effect of the inactivation (1.24 ± 0.1 bits
  expected:
    quantity: firing field information, muscimol, familiar platform
    value: 1.24
    tolerance: 0.1
    unit: bits
  depends_on:
  - fig6-repeated-muscimol-low
  criterion: As fig6-repeated-muscimol-low, the muscimol visit after familiarization. Reproduced
    when the mean is within tolerance and higher than each day 1-3 muscimol mean (one-sided
    Wilcoxon rank-sum, the test of the Supplementary Fig. 15 legend for these data, p < 0.05).
