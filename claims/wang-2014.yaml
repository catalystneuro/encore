  - quantity: episode cells per recording, rat 2
    value: 15
    tolerance: 1.5
  - quantity: episode cells per recording, rat 3
    value: 16.38
    tolerance: 1.64
  - quantity: place cells per recording, rat 1
    value: 19.6
    tolerance: 1.96
  - quantity: place cells per recording, rat 2
    value: 11
    tolerance: 1.1
  - quantity: place cells per recording, rat 3
    value: 10.33
    tolerance: 1.03
