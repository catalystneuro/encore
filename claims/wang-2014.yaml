# Claims for Wang, Romani, Lustig, Leonardo & Pastalkova (2015), Nature Neuroscience 18, 282-288,
# "Theta sequences are essential for internally generated hippocampal firing fields",
# doi:10.1038/nn.3904, on CRCNS data set hc-5.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-09,
# protocol as stated in docs/protocol.md (Reader), version pilot-14.
#
# Text read: the version of record (paper/10.1038-nn.3904.txt, extracted from the publisher PDF),
# with its main text, figure legends, Online Methods, and the Supplementary Information PDF
# (Supplementary Modeling, Supplementary Table 1, legends of Supplementary Figures 1 to 17). The
# figures were not rendered (no PDF renderer in this run); the figure text the extraction keeps
# (axis labels, P values printed on panels) was read from the text file. Where a panel's printed P
# differs from the Results, the claim says so. The paper links no analysis or model code, so no
# code was read. The data set's description (paper/hc-5.data-description.txt) was read only to
# know what it holds: one rat (i01) recorded with silicon probes in left and right CA1 and right
# entorhinal cortex, in sessions of the left/right alternation task with wheel runs, home-cage
# wheel running and large 2D platform exploration; it names this paper among three that used
# these data. It does not mention injections. Whether its sessions are the paper's pre, muscimol
# and post sessions is the author's to find. No claim comes from it.
#
# Data the paper used (Online Methods; Results). Male Long-Evans rats, two 64-channel silicon
# probes in dorsal CA1 of both hemispheres, a guide cannula above the medial septum (MS); 20 kHz
# wideband, LED tracked by an overhead camera at 30 Hz. (1) Alternation task: 3 rats in a
# two-arm maze (arms 150 cm long, 25 cm wide) with a running wheel in the delay area behind two
# doors; doors open after 9 (rat 1) or 10 s (rats 2, 3) of running, the counter resetting if speed
# falls below 18.5 cm/s; reward for left-right alternation. A muscimol recording has a pre session
# (25-30 trials), a muscimol session (from about 20 min after 500 nl muscimol 0.125 mg/ml into
# MS, over 40 trials) and a post session (about 4 h after, 25-30 trials); saline controls. The text
# gives 15 muscimol and 7 control recordings; Figure 1 and most legends give 13 muscimol
# recordings from 3 animals, Supplementary Figure 1 7 saline recordings from 2 animals. 158 wheel
# neurons and 160 maze neurons with firing fields. (2) Novel linear track (150 x 150 cm, 25-30 cm
# wide): muscimol 290 neurons from 2 animals, control 136 neurons from 2 animals. (3) Large novel
# platform (150 x 150 cm, walls), muscimol or saline, about 1 h, post session about 6 h after;
# counts differ between text and legends (claim fig5c-platform-info). (4) Smaller platform, 223
# neurons from 2 animals. (5) Repeated visits of the same large platform on days 1 to 3 under
# muscimol, each followed by a post-muscimol visit, then 3 days of familiarization and a
# muscimol visit (39 to 75 neurons from 3 animals). Spikes sorted with KlustaKwik on the merged
# pre, muscimol and post sessions, so a unit is the same across sessions of a day.
#
# Methods common to the claims, from the Online Methods unless said otherwise; each criterion
# refers to these by name.
# - Wheel runs: each aligned to the start of the 9 or 10 s of running before the doors open;
#   runs before left and before right arm choices analysed separately. Maze runs: from entering
#   the straight part of an arm to arrival at the water port; outbound and inbound separately.
# - Episode fields (Episode cell firing fields; Supplementary Fig. 17a): spikes at 1,250 Hz
#   referenced to run onset, smoothed with a Gaussian (s.d. 75 ms), averaged over trials. Keep
#   neurons with mean rate FRm >= 0.1 Hz and a peak-to-mean ratio against Thp2m = 3; segments at
#   or above FRm*Thp2m; edges where the rate falls below Thh = 0.9 FRm and Thl = 0.3 FRm; a field
#   spans the two Thl crossings when the margin between the Thh and Thl crossings is small; it
#   needs at least two spikes per trial on average, a size of at most 4 s and spikes in at least
#   40% of trials. Place fields in the maze use the same detection on the rate profile in time.
#   Open: (i) the Methods print "FRp2m <= Thp2m"; with that sign no rate could exceed FRm*Thp2m
#   (except at equality), so the ratio is read as FRp2m >= 3; (ii) "small" for the margin is not
#   given; readings at most 0.5 s and at most 1 s; (iii) the paper adjusted some parameters by
#   visual inspection, which cannot be repeated; the default values are used and this is a
#   deviation. A field sequence orders neurons by the latency Tc of the field centre, from the
#   pre session (the largest-peak field when several), else from the post session.
#   "Excitatory neurons" are not defined; readings: the data set's own cell-type labels if it
#   has them, otherwise all units (the paper's selection rests on firing fields).
# - Maze spatial maps: position at each spike, Gaussian smoothing (s.d. 17.5 camera pixels),
#   divided by occupancy.
# - Open-field maps (platform and, as one reading, the linear track): spike and occupancy maps,
#   smoothed by adaptive binning (ref. 54, Markus et al. 1995). Units kept with mean rate > 0.4
#   and < 5 Hz, refractory violation < 0.3, Mahalanobis distance from the noise cluster > 10 and
#   minimal spike amplitude 200 uV, with or without a clear field. Open: the spatial bin and the
#   adaptive-binning constant; readings 2.5 cm and 5 cm bins, the constant of ref. 54 and half and
#   double it. The units of "refractory violation < 0.3" are not given; readings: 0.3% and a
#   fraction 0.3 of interspike intervals under 2 ms.
# - Firing field information: I = sum over bins of lambda(x)/lambda log2(lambda(x)/lambda) p(x)
#   (ref. 55), on the episode profile over time or the place map over distance. The time bin of
#   the wheel profile is open; readings: the smoothed profile at 1,250 Hz samples, and 75 ms bins.
# - Theta modulation: spikes convolved with a Gaussian (s.d. 1 ms), autocorrelogram, Thomson
#   multitaper spectrum (NW = 4), power 6-9 Hz over power 5-40 Hz. The autocorrelogram's span is
#   not given; readings +/-0.5 s and +/-1 s.
# - Theta phase: one CA1 pyramidal-layer LFP channel, second-order Chebyshev type II filter 4-25
#   Hz, peaks 0 deg, troughs 180 deg, zero crossings 90 or 270 deg, linear interpolation between.
# - Theta sequence detection (Fig. 2e,j; Supplementary Fig. 17b): recordings with more than eight
#   episode or place cells; windows of the session's mean theta cycle length, stepped by 25 ms;
#   windows with mean speed above 18.5 cm/s (wheel) or 30 cm/s (maze) and at least two active
#   field neurons. Score: over all pairs of spikes in the window, +1 when their order matches the
#   field sequence, -1 otherwise. Shuffle: reassign each spike to a neuron active in the window,
#   keeping spike times and the number of active neurons, 10,000 times; a window is significant
#   when its score exceeds 95% of its shuffles; it is qualified when the best ordering of its
#   spikes could reach that level. Percentage of significant sequences = significant / qualified.
#   Chance: the same percentage per shuffle across windows; the figure's chance level is the 95th
#   percentile over all recordings. Recordings kept when a control session (pre or post) beats
#   chance, each session has more than 100 qualified windows, and the ratio of qualified fractions
#   between sessions of a day is at most 7. Open: pairs of spikes from the same neuron and pairs
#   at equal times; standard choice, scored 0.
# - Statistics: the Methods name the Wilcoxon signed-rank test (WSR), Spearman correlation and the
#   Kolmogorov-Smirnov test, and say "All of our tests were one sided." The Results also use
#   Kruskal-Wallis tests, and Supplementary Figures 11, 12 and 15 the Wilcoxon rank-sum test.
#   Every test below is one-sided in the stated direction unless said otherwise.
# - The muscimol period: Fig. 2a counts trials "during the effect", and Supplementary Fig. 3b
#   excluded trials before a late onset of the effect, without a rule. Readings: (a) all trials of
#   the muscimol session; (b) muscimol-session trials from the first one whose normalized theta
#   power (fig1d-theta-power) is below the lowest pre-session trial, a rule fixed here because the
#   paper gives none.
#
# Not made into claims: Supplementary Figure 2 (relation of firing to time, distance and theta
# cycles on the wheel), which the Results cite only for the cell count and state no finding from;
# the saline controls of Supplementary Figures 1c, 4b,c and 7, of which the Results state no
# finding; the 2D model of Supplementary Figure 10a and the depression-model comparison of
# Supplementary Figure 10d-g.
