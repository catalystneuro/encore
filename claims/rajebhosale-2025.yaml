- id: figs2g-lda-classifier-accuracy
  statement: An LDA classifier trained on WT electrophysiology classifies held-out WT cells with 78%
    accuracy (Cohen's kappa 0.57) but V321L cells with only 52% accuracy (kappa 0.08).
  source: Figure S2G; Results, V321L mutation in Nrg1 results in altered composition of the DG
    granule cell population, paragraph 5
  quote: The LDA classifier, trained on 80% of the WT data, achieved 78% accuracy in cell-type
    classification of the remainder 20% WT cells (Cohen’s κ = 0.57) ( Fig S2G , top). Using this
    classifier on the recordings obtained from V 321 L mice resulted in 52% classification accuracy
    (Cohen’s κ = 0.08)
  expected:
  - quantity: accuracy on held-out WT cells
    value: 78
    tolerance: 7.8
    unit: percent
  - quantity: Cohen's kappa on held-out WT cells
    value: 0.57
    tolerance: 0.1
  - quantity: accuracy on V321L cells
    value: 52
    tolerance: 5.2
    unit: percent
  - quantity: Cohen's kappa on V321L cells
    value: 0.08
    tolerance: 0.1
  criterion: As the Methods (LDA) describe. The 18 features of Fig S2C, z-scored with scale(); PCA
    with prcomp on WT; the top 9 PCs; caret train with method lda and trainControl(method cv, number
    5); the WT PCA and LDA applied to the V321L data. Kappa tolerances are 0.1, not 10%, because with
    about 21 to 23 cells one reclassified cell moves kappa by about 0.08. Open details, with readings
    run. (1) Whether V321L data are scaled with their own mean and SD or the WT ones ("applied to the
    scaled V321L data"). (2) Whether 78% is caret's mean accuracy over the five folds or the pooled
    out-of-fold accuracy; the WT confusion matrix in Fig S2G counts 21 cells (16 correct, 76%), so it
    pools all folds. (3) The fold seed, not given; each value is the median over 100 random fold
    assignments (a standard choice), with the range shown. Reproduced when under one reading all four
    values are within tolerance; partially reproduced when the two accuracies are, or when WT accuracy
    exceeds V321L accuracy by at least 15 points. The V321L matrix in Fig S2G (8, 5, 7, 3; 11 of 23
    correct, 48%, kappa near -0.09) does not match the text's 52% and 0.08; both are compared and the
    mismatch is recorded.
