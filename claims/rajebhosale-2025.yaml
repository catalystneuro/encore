    the DG granule cell population, paragraph 2
  quote: LDA resulted in successful capture of cell-type differences between GCs and SGCs (along the
    primary classifier ... LD1) but not between genotypes
  criterion: Features z-scored with scale(), then LDA (MASS lda), as the Methods (LDA) describe.
