    downstroke as in fig1l-sgc-faster-downstroke (Kim et al definition). Reproduced when p >= 0.05;
    the code's window is shown as a variant.
- id: fig2m-ephys-lda-wt-gc-apart
  statement: LDA of electrical properties separates WT GCs from all other groups (WT SGCs, V321L GCs,
    V321L SGCs) along LD1, driven mainly by spike width and downstroke.
  source: Figure 2M and Figure S2C; Results, V321L mutation in Nrg1 results in altered composition of
    the DG granule cell population, paragraph 3
  quote: LDA resulted in separation of WT GCs and all other groups (WT SGCs, V 321 L GCs, and V 321 L
    SGCs) along LD1 driven strongly by spike width
  criterion: The 18 features of Fig S2C, z-scored with scale() (Methods, LDA), LDA (MASS lda) with
    four classes (genotype by cell type; Fig 2M shows LD1 and LD2). Whether PCA precedes this LDA as it
    does for the classifier is not stated; readings are (a) LDA on the z-scored features and (b) LDA
    on their top 9 PCs. Cells with a missing feature are dropped. Reproduced when, under every
    reading, the WT GC mean LD1 lies on one side and the means of the other three groups on the
    other, and spike width or downstroke has the largest absolute LD1 coefficient; blocked as
    methods_underspecified when the readings disagree.
- id: figs2d-ephys-kmeans-v321l-like-wt-sgc
  statement: k-means clustering (k = 3) of electrophysiological data places V321L GCs and SGCs in
    clusters in nearly the same proportions as WT SGCs, while WT GCs spread across all three clusters.
  source: Figure S2D; Results, V321L mutation in Nrg1 results in altered composition of the DG
    granule cell population, paragraph 3
  quote: WT GCs are evenly distributed across all clusters, whereas SGCs largely occupy k3 with a
    minority in k1. All V 321 L GC and SGC cluster occupancy was virtually identical to WT SGCs
  criterion: k-means with k = 3 on the 18 features of Fig S2C. The scaling, number of PCs and seed are
    not given; readings are (a) z-scored features and (b) the first two PCs of the z-scored features,
    100 random starts each. Reproduced when, under every reading, WT GCs occupy all three clusters with
    none holding more than half of them, and WT SGCs, V321L GCs and V321L SGCs each have most cells
