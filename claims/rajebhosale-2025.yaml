- id: v321l-multiple-regression-wt-only
  statement: Controlling for soma position, spike amplitude and upstroke covary with cell type in WT
    mice, while no electrophysiological property shows a cell-type effect in V321L mice.
  source: Results, V321L mutation in Nrg1 results in altered composition of the DG granule cell
    population, paragraph 4
  quote: "In WT mice, we found that two electrophysiological properties, spike amplitude ( P = 0.042, β1 = −46.2) and upstroke ( P = 0.038, β1 = −117.88), significantly covaried with cell type when controlling for soma position. However, this model did not detect significant cell-type effects for any electrophysiological properties in V 321 L mice"
  statistics:
  - about: spike amplitude, cell type coefficient, WT
    test: multiple linear regression
    statistic: beta1 = -46.2
    p: 0.042
  - about: upstroke, cell type coefficient, WT
    test: multiple linear regression
    statistic: beta1 = -117.88
    p: 0.038
  expected:
  - quantity: cell type coefficient beta1 for spike amplitude, WT
    value: -46.2
    tolerance: 4.62
    unit: mV
  - quantity: cell type coefficient beta1 for upstroke, WT
    value: -117.88
    tolerance: 11.79
    unit: mV/ms
  criterion: Per property and genotype, lm(property ~ CellType + SomaPosition + CellType x
    SomaPosition) in R (Methods, Statistical analysis), soma position in micrometres from the GCL-MOL
    boundary. The coding of cell type is not stated; readings are SGC = 1 and GC = 1 (the sign of beta1
    flips between them, so a beta1 matches when its magnitude is within tolerance and its sign fits
    one coding used for both properties). Reproduced when in WT the beta1 p-values for spike amplitude
    and upstroke are below 0.05 with beta1 within tolerance, and in V321L no property's beta1 has p <
    0.05 (the absence half judged on this test). The property set for the V321L half is open
    (opening comment); readings are the 18 features of Fig S2C and the 21 outputs of the code. The
    WT properties other than these two are shown.
- id: figs2e-pca-separation-lost
  statement: PCA of the electrophysiological features separates WT GCs from WT SGCs on the first two
    components, while V321L GCs and SGCs overlap.
  source: Figure S2E; Results, V321L mutation in Nrg1 results in altered composition of the DG
    granule cell population, paragraph 5
  quote: Principal component analysis (PCA) revealed a clear separation between GCs and SGCs in WT
    mice along the first two principal components, whereas cells in V 321 L mice showed substantial
    overlap
  criterion: PCA (prcomp) of the 18 z-scored features of Fig S2C over all cells, with 95% ellipses per
    group as in the legend. The ellipse type is not stated; readings are (a) the 95% normal data
    ellipse (ggplot2 stat_ellipse default) and (b) the 95% confidence ellipse of the group mean.
    Reproduced when, under every reading, the WT GC and WT SGC centroids each lie outside the other
    group's ellipse and the V321L GC and SGC centroids each lie inside the other's; blocked as
    methods_underspecified when the readings disagree. The centroid distances are shown.
- id: figs2f-centroid-separation-reduced
  statement: In the WT-trained LDA, the distance between GC and SGC centroids along LD1 is much
    smaller in V321L than in WT, with both V321L centroids on the WT SGC side of the boundary.
  source: Figure S2F; Results, V321L mutation in Nrg1 results in altered composition of the DG
