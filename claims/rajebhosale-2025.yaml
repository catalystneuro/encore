- id: fig2a-v321l-more-multiple-dendrite-gcs
  statement: Golgi staining labels the same total number of GCs in WT and V321L DG, but V321L DG has
    a higher percentage of GCs with multiple primary dendrites and a lower percentage with a single
    one.
  source: Figure 2A; Results, V321L mutation in Nrg1 results in altered composition of the DG granule
    cell population, paragraph 1
  quote: "There was no difference in the total number of cells labeled by the Golgi stain between genotypes ( Fig 2A , left; P = 0.68). However, V 321 L mice had a significantly higher number of Golgi-stained GCs with multiple primary dendrites compared with WT mice and a significantly lower number of GCs with single primary dendrites compared with WT mice"
  statistics:
  - about: total Golgi-labeled GCs, WT against V321L
    test: Welch's t test, two-tailed
    statistic: t = 0.4338, df = 6.972
    p: 0.7
    n: 5 mice per genotype
  - about: genotype by number of primary dendrites interaction
    test: two-way ANOVA
    statistic: F(1,7) = 11.81
    p: 0.011
  - about: WT multiple against V321L multiple
    test: post hoc comparison
    p: 0.008
  - about: WT single against V321L single
    test: post hoc comparison
    p: 0.008
  - about: V321L single against V321L multiple
    test: post hoc comparison
    p: 0.013
  criterion: Per mouse, the percentage of Golgi-stained GCs with one and with several primary
    dendrites. Two-way ANOVA (genotype by dendrite class) with Bonferroni post hoc comparisons (the
