# Claims for Rajebhosale, Jiang, Ressa, Johnson, Desai, Jone, Role & Talmage (2025), Life Sci
# Alliance 8(7) e202403169, on dandiset 001545.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21, under
# docs/protocol.md (version pilot-10), Reader section.
#
# Text read. The version of record as served by Europe PMC (PMC12032840), full text with Results,
# Materials and Methods and every figure legend, including the supplementary figure legends (Figs S1
# to S10), in paper/10.26508-lsa.202403169.txt. The Key Resources Table (Supplemental Data 1, a docx)
# was not in paper/; it was read from the Europe PMC supplementary files bundle for PMC12032840. It
# gives the GEO accession of the snMultiome data (GSE280167) and the two code repositories below.
# Tables S1 to S6 (gene lists from the sequencing) were not needed for any criterion here. Figure 2,
# Figure S2 and the confusion matrices were read from the figure images in the same bundle (Fig S2C
# lists the electrophysiological features used in the LDA).
#
# Code read.
# - https://github.com/nsdesai/patch_clamp_analysis at commit 5d756c2 (MATLAB, "Code for
#   electrophysiology data analysis" in the KRT). It extracts the features from current-step
#   recordings (analysis_of_neurophysiology_data.m and the functions it calls). It holds no
#   statistics, no LDA, PCA, k-means or regression; the Methods say statistics were run in Prism and
#   the regression and LDA in R.
# - https://github.com/RajNINDS/V321L-snMultiome at commit c124726 (R, snRNA-Seq and snATAC-Seq).
#   A nucleus is Penk+ when its raw Penk count is above 0 (Rcode_20230522.txt, line 2353).
#
# Data the paper used.
# - Whole-cell current clamp recordings with biocytin fills of dentate granule cells in acute coronal
#   slices from P24 to P34 mice, recorded at 30 C from the middle of the suprapyramidal (dorsal) blade
#   and the top cell body layer. Cells are classed by their fill as GCs (one primary dendrite) or SGCs
#   (several primary dendrites). WT, 24 positioned cells (14 GC, 10 SGC) from 5 mice and 20 slices, of
#   which 14 GC and 9 SGC enter the electrophysiology; V321L (Nrg1 V321L knock-in), 10 GC and 15 SGC
#   from 5 mice and 17 slices. Measured variables are the voltage responses to current steps and, per
#   cell, the soma position (vertical distance from the cell body centre to the GCL-MOL boundary, in
#   micrometres) and morphology from Imaris reconstructions (splay angle, branch points and dendritic
#   length per primary dendrite, 15 parameters). These are the data dandiset 001545 is described as
#   holding (48 NWB files of electrophysiology).
# - Golgi-stained cell counts (5 mice per genotype), RNAScope FISH counts and positions in the
#   suprapyramidal blade (3 mice per genotype or age group, ages 1, 2, 3 and 9 to 12 months), and
#   10x Multiome snRNA-Seq and snATAC-Seq of microdissected DG (4 mice per genotype, 2 male and 2
#   female), deposited in GEO as GSE280167.
#
# Electrophysiological features. The Methods say "Twenty features were extracted from the responses
# to current steps as reported in Kim et al (2024)" (Cell Rep 43:114009). Kim et al define eighteen,
# and Fig S2C of this paper lists the same eighteen (spike width, downstroke, spike threshold,
# rheobase, AHP width, spike latency, CV, tau, upstroke, input resistance, max firing rate, spike
# amplitude, sag, RMP, AHP latency, f-I slope, AHP amplitude, adaptation index). The Results also use an
# upstroke-downstroke ratio, which neither Kim et al nor the code define. The code returns 21 outputs
# (the 18, plus sag ratio, spike peak and the AHP after the maximal step). Which 20 the paper means is
# open. Definitions used here, from Kim et al as the Methods' reference, with the code where Kim et al
# are silent (the analysis is restricted to the first 500 ms of each step, as in the code).
# - RMP, the membrane potential without current injection; in the code the mean voltage from 10 to 1 ms
#   before step onset, averaged over all sweeps.
# - Rheobase, the smallest positive step that elicits an action potential; in the code an overshooting
#   peak (above 0 mV, prominence at least 30 mV, width under 5 ms) within the first 500 ms.
# - Spike threshold, the voltage at which dV/dt first crosses 20 mV/ms on the first spike at rheobase
#   (Kim et al). The code uses 10 mV/ms after 10-fold interpolation; this is a variant.
# - Spike width, the width at half the height between threshold and peak of the first spike at rheobase.
# - Upstroke and downstroke, the maximum and the minimum of dV/dt on the first spike at rheobase (Kim et
#   al). The code takes the minimum from 5 ms before the first peak to the end of the 500 ms window
#   (its downIdx line resolves to the window's end), which can include later spikes; this is a variant.
#   A "faster" downstroke is a more negative minimum.
# - Sag, from the -60 pA step, the steady-state potential minus the minimum potential (the code takes
#   the maximum of the second half of the step minus the minimum of the first half, after a 20 ms
#   median filter).
# - Input resistance, from the -20 pA step (Kim et al); the code fits steady-state deflections of steps
#   from -50 to 0 pA (a variant).
# - Upstroke-downstroke ratio, not defined; taken here as upstroke divided by the magnitude of
#   downstroke (the sign convention does not change any test the paper reports on it).
