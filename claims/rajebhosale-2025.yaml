- id: fig1f-sgc-soma-superficial
  statement: In WT mice SGC somata lie closer to the GCL-MOL boundary than GC somata (SGCs in the
    top cell body layers, under 20 micrometres from the surface).
  source: Figure 1F; Results, SGCs have unique morphological and electrical properties, paragraph 2
  quote: "SGC cell body locations were significantly different from those of GCs (**** P < 0.0001, Welch’s t test [two-tailed]; t = 8.471, df = 19.16)"
  statistics:
  - test: Welch's t test, two-tailed
    statistic: t = 8.471, df = 19.16
    p: 0.0001
    p_relation: "<"
    n: 14 GCs and 10 SGCs from 5 WT mice
  criterion: Soma position is the vertical distance from the cell body centre to the GCL-MOL boundary
    (Methods, Imaging and image analysis). Two-tailed Welch's t test of WT SGC against WT GC
    positions, as in the legend. Reproduced when p < 0.0001 with SGCs nearer the boundary; partially
    reproduced when p < 0.05 with SGCs nearer the boundary.
- id: fig1g-sgc-wider-splay
