  criterion: A claim of absence, judged on a Mann-Whitney test at p < 0.05 of per-mouse percentages of
    GCs with nonzero Penk gene activity. Reproduced when p >= 0.05.
- id: tables4-suz12-enrichment
  statement: Genes enriched in Penk+ GCs and correlated with maximal pseudotime are strongly enriched
    for regulation by Suz12, a core PRC2 component.
  source: Results, Non-SGCs harbor the potential to express an SGC-like transcriptomic state,
    paragraph 4; Table S4
  quote: We found strong enrichment for regulation of these genes by Suz12, a core component of the
    polycomb repressive complex 2 (PRC2)
  data: elsewhere
  where: GEO GSE280167
  criterion: The 60 genes (fig s10 intersection) submitted to ChEA and ENCODE. The paper names the
    databases, not the tool or library versions; the Methods use the enrichR package for GO terms,
    so the readings are the enrichR libraries ENCODE_and_ChEA_Consensus_TFs_from_ChIP-X, ChEA_2022
    and ENCODE_TF_ChIP-seq_2015, and the claim is blocked as methods_underspecified when they
    disagree. Within a reading that gives ChEA and ENCODE separately, reproduced when SUZ12 is the top
    term by adjusted p in at least one of them; within the consensus library, when it is the top
    term.
- id: fig6a-penk-increases-with-age
  statement: The number of Penk+ cells in the suprapyramidal GCL of WT mice increases with age, from
    between 2 and 3 months.
  source: Figure 6a'; Results, SGC numbers in the DG increase during the adolescence-adulthood
    transition in WT mice, paragraph 1
  quote: We confirmed that WT mice indeed show an increase in Penk expression starting between 2 and 3
    mo of age
  statistics:
  - about: age effect
    test: Brown-Forsythe ANOVA
    statistic: F = 33.4 [3, 4.2]
    p: 0.0032
  - about: 1 against 3 months
    test: Dunnett's T3 multiple comparisons
    p: 0.008
  - about: 1 against 12 months
    test: Dunnett's T3 multiple comparisons
    p: 0.03
  - about: 2 against 3 months
    test: Dunnett's T3 multiple comparisons
    p: 0.008
  criterion: Per mouse, the total count of Penk+ cells in the suprapyramidal GCL at 1, 2, 3 and 9 to
    12 months. Brown-Forsythe ANOVA with Dunnett's T3 comparisons. The Results print P = 0.0032 and
    the legend P = 0.002. Reproduced when the age effect and the 2 against 3 month comparison have p <
    0.05 with the count higher at 3 months.
- id: fig6b-sgc-count-increases-with-age
  statement: The number of Penk+Nptx2+Sorcs3+ cells (SGCs) in the suprapyramidal GCL of WT mice
    increases with age.
  source: Figure 6b'; Results, SGC numbers in the DG increase during the adolescence-adulthood
    transition in WT mice, paragraph 1
  quote: We found that the numbers of Penk+Nptx2+Sorcs3+ GCs also increased with age
  statistics:
  - about: age effect
    test: Kruskal-Wallis test
    statistic: KW = 9.5
    p: 0.0012
  - about: 1 against 12 months
    test: Dunn's multiple comparisons
    p: 0.039
    corrected: Dunn
  criterion: Per mouse counts at 1, 2, 3 and 9 to 12 months; Kruskal-Wallis test with Dunn's
    comparisons. The Results print P = 0.0012 and the legend P = 0.001. Reproduced when both have p <
    0.05 with 12 months higher than 1 month.
- id: figs9a-age-dynamics-lost-v321l
  statement: The age-dependent increase in SGC number seen in WT mice is lost in V321L mice.
  source: Figure S9A; Results, SGC numbers in the DG increase during the adolescence-adulthood
    transition in WT mice, paragraph 1
  quote: These dynamics of SGC abundance over adolescence were lost in the V 321 L DG
  statistics:
  - about: effect of time
    test: two-way ANOVA
    p: 0.008
  - about: WT 1 against 12 months
    test: Bonferroni corrected comparison
    p: 0.008
    corrected: Bonferroni
  criterion: Two-way ANOVA (genotype by age) of per-mouse Penk+Nptx2+Sorcs3+ counts with Bonferroni
    comparisons between ages within genotype (legend). Reproduced when the WT 1 against 12 month
    comparison has p < 0.05 and no V321L comparison does (the absence half judged on these
    comparisons).
- id: figs9b-marker-fraction-stable
  statement: The percentage of Penk+ cells that are Nptx2+Sorcs3+ does not change with age in either
    genotype.
  source: Figure S9B; Results, SGC numbers in the DG increase during the adolescence-adulthood
    transition in WT mice, paragraph 1
  quote: There were no significant differences in the overall percentage of Nptx2 - or Sorcs3
    -expressing Penk + GCs at any of the ages
  statistics:
  - about: WT
    test: Brown-Forsythe ANOVA
    statistic: F = 2.1 [3, 4.75]
    p: 0.2
    n: 3 mice per age group
  - about: V321L
    test: Brown-Forsythe ANOVA
    statistic: F = 0.99 [2.0, 4.3]
    p: 0.44
    n: 3 mice per age group
  criterion: A claim of absence, judged on Brown-Forsythe ANOVA per genotype at p < 0.05. Reproduced
    when neither genotype shows an age effect.
- id: figs9d-penk-not-immature
  statement: At 3 months, Penk+ cells in the GCL of WT mice do not express the immature neuron marker
    Dcx.
  source: Figure S9D; Results, SGC numbers in the DG increase during the adolescence-adulthood
    transition in WT mice, paragraph 2
  quote: we did not find any Penk + cells that expressed the immature neuron marker doublecortin ( Dcx )
    at 3 mo of age
  criterion: Count of Penk+Dcx+ cells in the GCL in FISH (cells with at least 5 puncta of each).
    Reproduced when the count is zero.
- id: figs10d-go-resting-membrane-potential
  statement: The 60 genes both enriched in Penk+ GCs and in the cluster 18 end-trajectory modules are
    enriched for gene ontology terms whose top term by odds ratio is regulation of resting membrane
    potential, driven by Kcnk1 and Kcnj2.
  source: Figure S10C and S10D; Results, SGC numbers in the DG increase during the
    adolescence-adulthood transition in WT mice, paragraph 2
  quote: we identified 60 genes that met this criterion ... the feature of highest odds ratio being
    regulation of RMP, in line with our results showing a more hyperpolarized RMP in morphologically
    identified SGCs ( Fig 1J ). This enrichment was driven by two potassium channel genes ... Kcnk1 and
    Kcnj2
  expected:
  - quantity: genes in the intersection
    value: 60
    tolerance: 6
  data: elsewhere
  where: GEO GSE280167
  criterion: Monocle3 find_gene_modules on WT GCs, modules correlated with the cluster 18 end
    trajectories, intersected with the Penk+ enriched genes; enrichR GO_Biological_Process_2023, terms
    with adjusted p < 0.05 ranked by odds ratio (legend and Methods). Reproduced when the count is
    within tolerance and the top term is regulation of resting membrane potential with Kcnk1 and
    Kcnj2 as its genes.
- id: fig7a-type3-nrg1-declines
  statement: Type III Nrg1 expression in the suprapyramidal DG of WT mice declines from 1 to 12 months
    of age; the decline from 1 to 3 months is not significant.
  source: Figure 7A; Results, Natural decline in capacity for Nrg1 nuclear back-signaling corresponds
    to the SGC fate, paragraph 1
  quote: We found that Type III Nrg1 expression declined from 1 to 12 mo of age in WT mice; however,
    the reduction between 1 and 3 mo of age was not significant
  statistics:
  - about: age effect
    test: Kruskal-Wallis test
    statistic: KW = 6.25
    p: 0.01
    n: 3 mice per age group
  - about: 1 against 12 months
    test: Dunn's multiple comparisons
    p: 0.04
    corrected: Dunn
  criterion: Per mouse, Type III Nrg1 FISH fluorescence intensity density normalized to the area of the
    suprapyramidal blade (Methods). Kruskal-Wallis with Dunn's comparisons. Reproduced when the age
    effect and 1 against 12 months have p < 0.05 with lower values at 12 months, and 1 against 3
    months has p >= 0.05.
- id: fig7bc-bace1-low-in-sgcs
  statement: Bace1 expression peaks at intermediate pseudotime and drops at maximal pseudotime while
    Nrg1 rises along pseudotime; fewer than 10 WT cells co-express Penk, Nrg1 and Bace1, so most
    Penk+Nrg1+ GCs lack detectable Bace1.
  source: Figure 7B and 7C; Results, Natural decline in capacity for Nrg1 nuclear back-signaling
    corresponds to the SGC fate, paragraph 2
  quote: Bace1 expression was found to be higher in cells at intermediate pseudotime compared with the
    beginning or end of the trajectories ... examination of cells expressing Penk, Nrg1 , and Bace1 in
    WT DG resulted in <10 cells showing co-expression of all three markers
  data: elsewhere
  where: GEO GSE280167
  criterion: WT GC pseudotime from fig5b-pseudotime-sorcs3-top, split into thirds. Reproduced when mean
    Bace1 expression is highest in the middle third and lower in the last third than the middle,
    mean Nrg1 is highest in the last third, and fewer than 10 WT GCs have raw counts above 0 for all
    of Penk, Nrg1 and Bace1. The thirds are not from the paper.
  depends_on:
  - fig5b-pseudotime-sorcs3-top
- id: figs5bc-penk-sorcs3-neg-outside-cluster18
  statement: Penk+Sorcs3- GCs are excluded from cluster 18 in both WT and V321L mice.
  source: Figure S5B and S5C; Results, V321L mice have a higher number and altered positioning of
    Penk+ GCs compared with WT mice, paragraph 3
  quote: we found that Penk + Sorcs3 - cells were excluded from cluster 18 in both WT and V 321 L mice
  data: elsewhere
  where: GEO GSE280167
  criterion: GCs with a raw Penk count above 0 and a raw Sorcs3 count of 0 (as in
    figs5a-penk-sorcs3-subsets), counted per cluster and genotype. Reproduced when cluster 18 holds
    none of them in either genotype, as the legend of Fig S5C says ("Note the absence of cells in
    cluster 18 in both genotypes").
- id: figs7-downsampled-pseudotime-robust
  statement: With WT GCs downsampled to the V321L number, the pseudotime ordering is preserved and
    Sorcs3 still marks the cells with maximal pseudotime.
  source: Figure S7A and S7B; Results, Non-SGCs harbor the potential to express an SGC-like
    transcriptomic state, paragraph 1
  quote: We found that the pseudotime ordering of GCs and associated gene expression states were robust
    to differences in sampling frequency, with Sorcs3 still representing cells with the maximal
    pseudotime
  data: elsewhere
  where: GEO GSE280167
  depends_on:
  - fig5b-pseudotime-sorcs3-top
  criterion: WT GCs downsampled at random to the number of V321L GCs, then Monocle3 and graph_test as in
    fig5b-pseudotime-sorcs3-top. The seed is not given; 20 draws, as in
    trajectory-geometry-directionality. Reproduced when in most draws Sorcs3 is among the top ten genes
    by Moran's I with q < 0.05 (the legend says "some of the top pseudotime-associated genes") and the
    Spearman correlation of each downsampled cell's pseudotime with its pseudotime in the full WT
    analysis is positive. The top-ten bound and the correlation are readings, not the paper's.
- id: figs8a-atac-pseudotime-cluster9
  statement: In ATAC space the Penk+ GCs (cluster 9) have the maximal pseudotime; WT GC trajectories
    have three end points and V321L GC trajectories one, ending at cluster 9.
  source: Figure S8A; Results, Non-SGCs harbor the potential to express an SGC-like transcriptomic
    state, paragraph 3
  quote: Once again, we found that the Penk + GCs (now located in ATAC cluster 9) had the maximum
    pseudotime values based on chromatin accessibility ... However, in the V 321 L GCs, there was only
    one end point terminating at cluster 9
  data: elsewhere
  where: GEO GSE280167
  criterion: Monocle3 on the ATAC GC subset, run separately on WT (LL) and V321L (VV) cells (Methods,
    Single-nucleus ATAC-Seq analysis), root chosen from Camk4 and the other markers the Methods list.
    Reproduced when cluster 9 has the highest median pseudotime in each genotype and the learned
    principal graph has three leaf end points (other than the root) in WT and one in V321L. Monocle3
    graph learning depends on its settings, which the Methods do not give beyond the workflow; the
    snMultiome code's settings are used.
- id: figs9c-embryonic-sgc-genes
  statement: At E18.5, cells expressing SGC-enriched genes (Penk, Scg2, Nrg1, Cit) lie at the dorsal
    border of the developing GCL, so marker expression is unlikely to reflect cellular age alone.
  source: Figure S9C; Results, SGC numbers in the DG increase during the adolescence-adulthood
    transition in WT mice, paragraph 1
  quote: We found cells expressing SGC-enriched genes such as Penk , Scg2 , Nrg1 , and Cit in the
    dorsal border of the developing GCL at E18.5
  data: elsewhere
  where: Allen Brain Atlas, developing mouse brain ISH at E18.5 (the paper names no experiment IDs)
  criterion: A qualitative reading of public ISH images, with no statistic. Reproduced when the Allen
    E18.5 ISH images for each of the four genes show labelled cells at the dorsal border of the
    developing GCL. The image series are not given; any E18.5 series for the gene is a reading.
