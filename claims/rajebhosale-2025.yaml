    statistic: t = 2.754, df = 12.59
    p: 0.0168
    n: 13 GCs and 6 SGCs from 4 WT mice
  criterion: Splay angle as the Methods define it (FIJI angle tool, from the most laterally displaced
    dendritic termination through the soma centre to the opposite one). Two-tailed Welch's t test.
    Reproduced when p < 0.05 with SGCs wider.
