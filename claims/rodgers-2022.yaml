# Claims for Rodgers (2022, Sci Data 9, 620) on dandiset 000231.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23,
# protocol as stated in docs/protocol.md (version pilot-10).
#
# Source: the version of record, full text as served by Europe PMC
# (paper/10.1038-s41597-022-01728-1.txt), read from its Background & Summary, Methods, Data
# Records, Technical Validation, Usage Notes, Code availability, Tables 1 to 6 and the legends of
# Figs. 1 to 3. No PDF was stored, so no figure was seen; Fig. 2c (error rates per training set)
# is known only from its legend and the Technical Validation text. The paper is a data
# descriptor with no supplement and reports no statistical tests, so no claim has statistics.
# The bioRxiv preprint (10.1101/2022.05.10.491259, version 1) is also under paper/; it was
# compared for the reported counts (15 mice, 115 sessions, 18,514 trials, 63,979,800 frames,
# 88.9 h, 33.8 h, 44/115, 7433 frames, 2.8 pixels, 90 trials, 95%), which are the same, and
# was not otherwise used.
#
# Code read: https://github.com/cxrodgers/NwbDandiData2022 at commit
# 33d610b63e8f43594d380443bf70ac1e4e6a48d0 (2022-04-30), linked in Usage Notes. It holds only
# UsageNotes.ipynb, which loads sub-231CR/sub-231CR_ses-20190921T144923_behavior+ecephys+image.nwb
# from dandiset 000231 and prints the trials table, the C2 angle, the C2 contacts, raw neural
# data and the units table. Its printed outputs disagree with the paper's NWB names. It reads
# the whisker data from nwbfile.processing['behavior']['processed_position_whisker_C2'] and the
# contacts from nwbfile.processing['behavior']['contacts_by_whisker_C2'], where the Data Records
# sections name processing groups "processed_whisker_position", "identified_whisker_contacts",
# "raw_whisker_position" and "behavioral_events"; Table 1 itself says processing holds one
# ProcessingModule named "behavior". Both namings are given as readings (claim nwb-structure).
# The notebook also shows the electrode group named "all_channels" and the subject strain
# "C57BL6/J". The tracking software the paper lists (github.com/cxrodgers/PoseTF,
# github.com/cxrodgers/whisk) was not read: no criterion here rests on it. The analysis code of
# the original study (ref. 8, Rodgers et al. 2021, Neuron) is not linked by this paper.
#
# Data the paper describes. 15 C57BL/6J mice, bred in-house, males and females in roughly
# equal proportion, behavioral training begun between postnatal days 90 and 180, recorded at
# Columbia University. Two groups: shape discrimination (convex, lick right; concave, lick left)
# and shape detection (either shape, lick right; no shape, "nothing", lick left); no mouse did
# both. Head-fixed, all whiskers but the C row trimmed; whiskers C0 (a straddler), C1, C2, C3
# tracked. On each trial a servo moves a curved shape to one of three positions (close, medium,
# far); the response window opens 2 s after the motor starts; the first lick in it decides the
# outcome. 115 sessions, 18,514 trials, 88.9 h of 200 frames/s video (63,979,800 frames, most at
# 640 x 550). In 44 of the sessions, a 64-channel linear silicon probe (Cambridge Neurotech H3,
# 20 um pitch) in an identified column (typically C1, C2 or C3) of left barrel cortex, recorded
# with Open Ephys at 30 kHz, 33.8 h in all, spike sorted with Kilosort and curated in Phy. One NWB
# file per session (sub-<mouse>_ses-<session>_behavior+image[+ecephys].nwb), with a trials table
# (start_time, stop_time, direct_delivery, stim_is_random, optogenetic, outcome, choice,
# rewarded_side, servo_position, stimulus, ignore_trial, choice_time, response_window_open_time,
# trial), lick and reward times, pose tracking of 8 markers on each of 4 whiskers, processed
# whisker angle, bend, base and tip with an interpolated flag, whisker contacts per whisker, raw
# neural data with timestamps, an electrodes table and a units table (inhibitory, depth, layer,
# neuron_channel, spike_times, obs_intervals). All times are in the "common video timebase"
# (frame F at F/200 s). Raw video (mkv, nominal 30 frames/s) is in a folder named as the NWB
# file; raw Open Ephys files and Kilosort/Phy outputs are under sourcedata/. The paper cites the
# dataset as DANDI 000231, version 0.220904.1554 (doi:10.48324/dandi.000231/0.220904.1554).
#
# Outside data. An earlier release of the same study's data is on Zenodo
# (doi:10.5281/zenodo.4743837, ref. 13); no claim uses it. The curated whisker training sets
# (curated datasets 1 to 5) and their cross-validated predictions, on which the tracking
# accuracy claims rest, are not among the deposits the Data Records list; the paper does not
# say where they are.
#
# Trials to analyse. Where a criterion counts trials "to analyse" it means trials with
# ignore_trial False, as Table 6 and the trials-table section direct, unless it names readings.
schema_version: 2
dataset:
  archive: dandi
  id: "000231"
paper: doi:10.1038/s41597-022-01728-1
claims:
- id: dataset-size
  statement: The dataset holds 15 mice, 115 sessions, 18,514 trials and 63,979,800 video frames,
    which is 88.9 hours of video.
  source: Methods, High-speed videography and whisker tracking, paragraph 2; Background &
    Summary, paragraph 5
  quote: The size of the dataset ... 15 mice, 88.9 hours, 115 sessions, 18,514 trials, 63,979,800
    frames
  expected:
  - quantity: mice
    value: 15
    tolerance: 0
  - quantity: sessions
    value: 115
    tolerance: 0
  - quantity: trials
    value: 18514
    tolerance: 0
  - quantity: video frames
    value: 63979800
    tolerance: 0
  - quantity: hours of video
    value: 88.9
    tolerance: 0.05
    unit: h
  criterion: Mice are subject folders and sessions are NWB files. Tolerance 0 for the counts,
    as they are counts of deposited records, and 0.05 h for the hours, the rounding of the
    printed value. The paper does not define which trials and frames are counted. Readings for
    trials are (a) all rows of all trials tables, (b) rows with ignore_trial False. Readings for
    frames are (a) the frame counts of the raw video files, (b) the number of frames of the
    raw_whisker_position series (N_frames, Data Records), summed over sessions; hours are
    frames divided by 200 and by 3600 under each. Reproduced when mice and sessions match and
    trials and frames match exactly under one reading each; partially reproduced when mice and
    sessions match and trials and frames are within 10% under some reading; not reproduced
    otherwise.
- id: neural-sessions
  statement: Neural recordings from barrel cortex were made in 44 of the 115 sessions.
  source: Methods, Neural recordings during behavior, paragraph 1
  quote: For a subset (44/115) of the behavioral sessions that we report here, we also recorded
    neuronal activity in identified columns of the barrel cortex
  expected:
    quantity: sessions with neural recordings
    value: 44
    tolerance: 0
  criterion: Count of NWB files whose name includes "ecephys" (Data Records, Directory
    structure) and, as a check, of files holding an "extracellular array recording"
    ElectricalSeries and a units table. Tolerance 0 because it is a count of deposited
    sessions. Reproduced when both counts are 44.
- id: neural-hours
  statement: The dataset includes 33.8 hours of 64-channel neural recording at 30 kHz.
  source: Background & Summary, paragraph 5
  quote: includes 88.9 hours of behavioral video at 200 frames per second and 33.8 hours of
    64-channel neural recording at 30 kHz
  expected:
    quantity: hours of neural recording
    value: 33.8
    tolerance: 0.05
    unit: h
  criterion: The paper does not say which recording is timed. Readings are (a) the summed
    duration of the "extracellular array recording" timestamps in the NWB files (last minus
    first), (b) the summed duration of the main Open Ephys recordings under sourcedata/
    (test recordings of a few seconds left out, Data Records, Raw data, neural acquisition
    files). Tolerance 0.05 h, the rounding of the printed value. Reproduced when one reading is
    within it; partially reproduced when one is within 10%. The channel count of the raw files
    (64) is checked; the NWB files exclude broken channels and may hold fewer.
- id: task-rules
  statement: In discrimination sessions convex shapes are rewarded on the right and concave
    on the left; in detection sessions either shape is rewarded on the right and catch trials
    with no shape on the left.
  source: Methods, Two behavioral tasks, paragraph 1
  quote: Shape discrimination mice were trained to lick right for convex shapes and left for
    concave shapes. Shape detection mice were trained to lick right for either shape (concave
    or convex) and to lick left on catch trials when no shape was presented at all
  criterion: From the trials table, rewarded_side against stimulus. A session is a detection
    session when any trial has stimulus "nothing" (Table 6, stimulus) or when its metadata
    names the task; otherwise discrimination, with the session metadata (experiment
    description) checked where it names the task. Reproduced when, over trials to analyse in
    every session, rewarded_side follows the rule of the session's task on every trial;
    partially reproduced when it does on at least 95% of trials in every session. All trials,
    including ignored ones, are shown as a variant.
- id: nothing-detection-only
  statement: The stimulus "nothing" occurs only in the detection task.
  source: Data Records, NWB file, trials table, Table 6 (stimulus)
  quote: "'nothing' was only used in the detection task, not in the discrimination task"
  depends_on:
  - task-rules
  criterion: Using the session metadata's task where it is given (experiment description or
    keywords), reproduced when no discrimination session holds a trial with stimulus
    "nothing". When the metadata do not name the task, the claim cannot be tested apart from
    task-rules (which uses "nothing" to assign the task) and is reported as such.
- id: one-task-per-mouse
  statement: No mouse was trained on both tasks.
  source: Methods, Two behavioral tasks, paragraph 1
  quote: No mice were trained on both tasks
  depends_on:
  - task-rules
  criterion: Each session's task as assigned in task-rules. Reproduced when every mouse's
    sessions are all of one task.
- id: servo-positions
  statement: The shape stops at one of three positions, close, medium or far.
  source: Methods, Two behavioral tasks, paragraph 2; Table 6 (servo_position)
  quote: The shape stopped at one of three different positions (close, medium, or far)
  criterion: Reproduced when the servo_position values over all trials with a shape (stimulus
    not "nothing") are exactly the set close, medium, far; not reproduced otherwise. The paper
    does not say that every session used all three, so the positions present in each session
    are reported and do not enter the outcome.
- id: response-window-timing
  statement: The response window opens 2 s after the servo motor starts moving the shape, which
    reaches its final position 0.8 to 0.4 s before the window opens, depending on the position.
  source: Methods, Two behavioral tasks, paragraph 3
  quote: which began exactly 2 seconds after the linear servo motor started moving the shape
    toward the mouse ... reached its final position between −0.8 s and −0.4 s, depending on
    whether the final position was close, medium, or far
  criterion: Testable only if the dataset records the time the motor starts or stops. The
    trial start_time is the synchronization pulse (Methods, Alignment of multiple data
    streams), which the paper does not place relative to motor onset, so it is not used as
    motor onset. When motor times exist, reproduced when the window opens 2 s (within one frame,
    5 ms) after motor onset on at least 95% of trials and the motor stops between 0.8 and 0.4
    s before it. The paper does not say which position arrives first, so the stop time per
    position is reported and its order is not judged. Otherwise blocked; the
    distribution of response_window_open_time minus start_time is reported for information.
- id: choice-time-first-lick
  statement: The choice time is the first lick after the response window opens, and on spoiled
    trials with no lick it is set 45 s after the window opens.
  source: Data Records, NWB file, trials table, Table 6 (choice_time)
  quote: choice_time (float) The time of the choice lick, which is the first lick after the
    response window opened. On spoiled trials with no lick, this value is 45 seconds after the
    response window opened
  criterion: Lick times from the left, right and (where present) both lick series. For each
    non-spoiled trial, the first lick at or after response_window_open_time, compared with
    choice_time; its side compared with choice. For spoiled trials, choice_time minus
    response_window_open_time compared with 45 s. Licks and trial times are both aligned
    trial by trial, so a match within 5 ms (one frame, Methods, Alignment) counts. Reproduced
    when all of these hold on at least 99% of trials of each kind; partially reproduced at
    95%. All trials are used, as the definition does not depend on ignore_trial.
- id: outcome-consistency
  statement: The first lick in the response window decides the outcome; a choice on the
    rewarded side is correct, any other choice is an error, and a trial with no choice is
    spoiled.
  source: Methods, Two behavioral tasks, paragraph 4; Table 6 (outcome, choice)
  quote: Only the first lick (left or right) during the response window determined the trial
    outcome (correct or incorrect)
  criterion: From the trials table. Reproduced when on every trial outcome is "correct"
    exactly when choice equals rewarded_side, "error" when choice is the other side, and
    "spoil" exactly when choice is "nogo" (Table 6, choice); direct-delivery trials are shown
    apart, as their water does not depend on the choice. Partially reproduced when this holds
    on at least 99% of trials.
- id: reward-and-timeout
  statement: Correct licks were rewarded with water, and incorrect licks were punished with a
    timeout, typically 9 s long.
  source: Methods, Two behavioral tasks, paragraph 4
  quote: Correct licks were rewarded with water and incorrect licks were punished with a
    timeout, typically 9 seconds long
  expected:
    quantity: timeout after an error
    value: 9
    tolerance: 0.9
    unit: s
  depends_on:
  - outcome-consistency
  criterion: Over trials to analyse. Reward is a reward time on the rewarded side between
    choice_time and stop_time; reproduced for this part when it occurs on every correct trial
    and on no error trial (partially when on at least 95% and at most 5%). The paper does not
    say how the timeout appears in the trial times. Readings are (a) the median over error
    trials of stop_time minus choice_time, (b) that median on error trials minus the same median
    on correct trials. The timeout part holds when the reading is within 0.9 s of 9 s. The
    claim is reproduced when the reward part holds and both readings hold, not reproduced when
    neither does, and blocked as methods_underspecified when they disagree, with both shown.
- id: forced-alternation-start
  statement: Every session began with 45 trials of Forced Alternation, which are non-random
    trials, before random trials.
  source: Methods, Session control and trial types to be dropped from analysis, paragraph 2
  quote: Even in fully trained mice, we found it best to begin every session with 45 trials of
    Forced Alternation, before switching to random trials
  criterion: By the trial field (trial number), since trials before the video began are left
    out of the table (Data Records, trials table). Reproduced when, in every session, every
    present trial numbered 0 to 44 has stim_is_random False; partially reproduced when that
    holds in more than half the sessions. The number of the first random trial in each session
    is reported.
- id: ignore-trial-definition
  statement: A trial is marked ignore_trial when it is direct delivery, non-random, spoiled,
    optogenetic or otherwise munged.
  source: Data Records, NWB file, trials table, Table 6 (ignore_trial)
  quote: "ignore_trial (bool) This is True if 'direct_delivery' is True, or 'stim_is_random' is
    False, or outcome is 'spoil', or 'optogenetic' is True, or the trial was otherwise munged"
  criterion: Munged trials carry no flag of their own, so only one direction is tested.
    Reproduced when every trial with direct_delivery True, stim_is_random False, outcome
    "spoil" or optogenetic True has ignore_trial True. The number of trials with ignore_trial
    True and none of the four flags (the munged trials) is reported.
- id: trials-table-structure
  statement: Each trial's stop time equals the next trial's start time, and the table's index
    is the trial number.
  source: Data Records, NWB file, trials table, Table 6 and the paragraph after it
  quote: stop_time (float) Stop time of the trial. (Equal to the start time of the next trial.)
    ... The index of this DataFrame is called "id" and is identical to the field "trial"
  criterion: Within each session, for consecutive rows, stop_time compared with the next
    start_time, and id with trial. Reproduced when both are equal (times within 1 ms) for every
    row; the last trial of a session is not compared.
- id: video-timebase
  statement: Times in the NWB file are in a common video timebase in which frame F falls at
    exactly F/200 s.
  source: Methods, Alignment of multiple data streams, paragraph 4
  quote: Since the camera ran at 200 frames per second, frame F in the video is defined as
    occurring at exactly time F/200 in the common video timebase
  criterion: Reproduced when the timestamps of every processed whisker series and every pose
    series are integer multiples of 0.005 s (within 1e-6 s) and their spacing is 0.005 s except
    at gaps. Contact start and stop times are also checked against the 0.005 s grid.
- id: sync-gap-and-interpolation
  statement: Processed whisker timestamps have gaps, for instance during the 133 ms blackout at
    each trial start, because gaps longer than 4 frames (20 ms) were not interpolated.
  source: Data Records, NWB file, processing group processed_whisker_position, last paragraph
  quote: these timestamps will in general contain gaps, for instance during the 133 ms blackout
    synchronization pulse at the start of each trial. This is because we did not interpolate
    over gaps longer than 4 frames (20 ms)
  expected:
    quantity: blackout gap duration at trial start
    value: 0.133
    tolerance: 0.0133
    unit: s
  depends_on:
  - video-timebase
  criterion: Two parts, per whisker and session. (1) Runs of consecutive frames with
    interpolated True are at most 4 frames long. (2) For each trial, the longest gap in the
    angle timestamps that begins within 0.2 s of start_time (missing time, gap minus one
    frame) is within 10% of 133 ms. The paper says "in general", so (2) is read as holding on
    more than half of trials for C1, C2 and C3. Reproduced when (1) holds everywhere and (2)
    holds; partially reproduced when one of them holds. C0 is reported apart, as it may be
    missing for long stretches.
- id: bend-null-interpolated
  statement: Whisker bend is null on interpolated frames.
  source: Data Records, processed_whisker_position, Table 3 (bend)
  quote: This is null on interpolated frames
  criterion: Reproduced when, for every whisker and session, bend is NaN (or missing) on every
    frame with interpolated True. Bend values on non-interpolated frames that are NaN are
    counted and reported.
- id: neural-timestamps
  statement: The neural data timestamps are regularly spaced in the common video timebase, at
    a rate near but not exactly 30 kHz.
  source: Data Records, NWB file, acquisition group extracellular array recording, last
    paragraph
  quote: The sampling rate is nearly 30 kHz, but not exactly, because it has been converted to
    the common video timebase used throughout the NWB file
  criterion: Per ecephys session, the rate is (number of samples minus one) over the span of
    the timestamps, and regular spacing is the spread of successive differences. Reproduced
    when every session's spacing is constant to within 1e-9 s (a linear map, Methods, continuous
    alignment), its rate differs from 30000 Hz by less than 1%, and it is not exactly 30000 Hz
    in at least one session.
- id: neural-video-alignment
  statement: The neural and video timebases are related by a linear fit whose residuals at the
    trial synchronization pulses are never more than one frame (5 ms).
  source: Technical Validation, Alignment data
  quote: In contrast the neural and video timebase were synchronized very well by a linear fit.
    Residuals were never more than a single frame (5 ms)
  expected:
    quantity: largest residual of the neural to video linear fit
    value: 0.005
    tolerance: 0
    unit: s
  criterion: Needs the pulse times in both streams, the neural from the analog input of the
    raw Open Ephys files under sourcedata/ (the sample at which it goes low), the video from the
    frame on which the raw video goes dark (Methods, Alignment). The paper gives no threshold
    for either detection. The input is read as low below half its range, and a frame as dark
    when its mean brightness is below half the session median; these are standard choices, not
    the paper's, and cannot change the outcome, as the paper says the video goes completely
    black and the input is a digital line. Detections are matched to trials by the intervals
    between trial starts (Methods, Alignment). A line is fit from neural to video pulse times per session. Reproduced when
    the largest absolute residual is at most 5 ms in every session; partially reproduced in
    more than 90% of sessions. When the raw files cannot give pulse times, blocked.
- id: behavior-clock-drift
  statement: The behavioral (Arduino) timebase fit the other two timebases poorly, with
    residuals that varied slowly but predictably over the session, so behavioral events were
    aligned trial by trial.
  source: Technical Validation, Alignment data
  quote: We observed that the behavioral timebase was a poor fit to the other two timebases and
    that its residuals varied slowly but predictably over the session
  criterion: Needs trial start times in the behavioral (Arduino) timebase, which the Data
    Records do not list among the raw deposits (only video and Open Ephys files). If the dataset
    holds them, a line is fit from behavioral to video trial starts per session; reproduced
    when the largest residual exceeds one frame (5 ms), the bound the neural fit meets, in
    more than half the sessions. The paper gives no measure of "slowly but predictably"; the
    residuals are plotted against trial for every session and that part does not enter the
    outcome. Otherwise blocked.
- id: unit-quality-isi
  statement: Every unit in the dataset passed the objective quality criteria, among them at most
    5% of inter-spike intervals below 3 ms and at most 20% of the recording below 5% of the
    mean firing rate.
  source: Technical Validation, Spike sorting
  quote: single units had to pass all of the following objective criteria ... ≤5% of the
    inter-spike intervals less than 3 ms; ≤1.5% change per minute in spike amplitude; ≤20% of
    the recording at <5% of the mean firing rate
  criterion: From the units table, as the NWB file holds only well-sorted single units (Data
    Records, Raw data, neural acquisition files). ISI part, the fraction of a unit's
    inter-spike intervals below 3 ms; holds when it is at most 5% for every unit. Firing-rate
    part, the fraction of time bins within obs_intervals whose rate is below 5% of the unit's
    mean rate; the paper gives no bin. Readings are (a) 60 s bins, the time unit of the
    amplitude criterion beside it, (b) one bin per trial (start_time to stop_time). It holds
    when the fraction is at most 20% for every unit. Reproduced when both parts hold under the
    readings run; not reproduced when the ISI part fails or the firing-rate part fails under
    both readings; blocked as methods_underspecified when the readings of the firing-rate part
    disagree. The amplitude criteria need Kilosort
    amplitudes in microvolts and the detection threshold, which the paper does not give; they
    are reported where sourcedata/ allows and do not enter the outcome.
- id: unit-depth-layer
  statement: Each unit's depth is the depth of the electrode its neuron_channel indexes, and its
    layer is assigned from that depth.
  source: Data Records, NWB file, units table, Table 5
  quote: This is calculated by taking the depth of the electrode in the electrodes table which
    is indexed by the field "neuron_channel" for this unit ... This specifies the laminar
    location of the unit, based on its depth
  criterion: Per ecephys session. (1) A unit's depth equals the y of the electrodes row at
    index neuron_channel. (2) Layers are assigned by fixed boundaries (the paper uses ref. 26
    and does not print them), so over all units of all sessions the depth ranges of the
    layers do not overlap and run from superficial to deep in the order L1, L2/3, L4, L5, L6
    (whichever occur). Reproduced when both hold for every unit.
- id: electrodes-order
  statement: The NWB electrodes are ordered from superficial to deep, broken channels are
    excluded, the raw data columns follow the electrodes table, and the sites are 20 um apart
    over 1280 um.
  source: Methods, Ordering of neural data channels; Methods, Neural recordings during
    behavior, paragraph 4; Data Records, electrodes table
  quote: we ordered the channels in the Neurodata Without Borders (NWB) file in order of the
    anatomical location of the corresponding recording site, from superficial to deepest. We
    excluded broken channels from the NWB file
  expected:
    quantity: spacing between adjacent sites
    value: 20
    tolerance: 0
    unit: um
  criterion: Per ecephys session. Reproduced when electrodes y increases strictly down the
    table, successive differences are multiples of 20 um (a larger step marks a broken
    channel), the number of rows is at most 64 and equals the number of data columns of the
    extracellular array recording, and the span of a full 64-site probe would be 63 steps of 20
    um (1260 um between end site centres, which the paper's 1280 um, 64 x 20 um, includes).
    The location string of each electrode is checked to hold the five items Data Records
    lists.
- id: recording-columns
  statement: Each recording session names the barrel column the probe was in, sampling
    typically C1, C2 and C3.
  source: Data Records, electrodes table, Table 4 (electrode_group); Methods, Neural
    recordings during behavior, paragraphs 2 and 3
  quote: Its "location" field specifies the barrel-related cortical column in which the
    recording device was inserted during this session
  criterion: Reproduced when every ecephys session's electrode group location names a barrel
    column (a row letter and arc number, or a straddler). The count of sessions per column is
    reported; the paper gives only a goal of sampling C1, C2 and C3 equally often, which is
    not judged.
- id: units-obs-intervals
  statement: Each unit has one observation interval, the start and stop of the neural recording,
    with its spike times in the common video timebase.
  source: Data Records, NWB file, units table, Table 5 (obs_intervals, spike_times)
  quote: In this dataset, there is only one contiguous chunk of data included per session, so the
    length of this list is one
  criterion: Reproduced when every unit has exactly one interval, all its spikes fall inside
    it, and the interval's start and stop equal the first and last raw neural timestamps of the
    session (within one sample), as Table 5 says it gives the start and stop of the neural
    recording; partially reproduced when the interval lies within that span but does not match
    its ends.
- id: pose-structure
  statement: Each session holds pose tracking of four whiskers with eight markers each, whose
    pixel to millimetre conversion is the same for all markers within a session.
  source: Data Records, NWB file, processing group raw_whisker_position
  quote: It comprises four data interfaces, each of which is an ndx_pose.pose.PoseEstimation
    containing pose tracking data for one of the four whiskers that we tracked. In turn, each
    PoseEstimation comprises eight PoseEstimationSeries ... which is the same for all markers
    within a session but can vary across sessions
  depends_on:
  - nwb-structure
  criterion: Reproduced when every session has four PoseEstimation objects (C0 to C3) of eight
    series each, each series of shape (N_frames, 2), and one conversion value per session.
    Whether the conversion varies across sessions is reported.
- id: c0-rare-contacts
  statement: The straddler whisker C0 rarely made contact with the shapes in most mice.
  source: Methods, Two behavioral tasks, paragraph 5
  quote: but this whisker rarely made contact with the shapes in most mice
  criterion: Per mouse, contact counts of each whisker over its sessions' trials to analyse.
    The paper gives no threshold for "rarely"; it is read as C0 making fewer contacts than each
    of C1, C2 and C3. Reproduced when this holds in more than half the mice. Each mouse's
    fraction of contacts made by C0 is reported.
- id: session-min-trials
  statement: Sessions with fewer than 90 trials to analyse were excluded.
  source: Technical Validation, Inclusion criteria
  quote: We also excluded sessions with fewer than 90 trials to analyze
  criterion: Readings for "trials to analyse" are (a) trials with ignore_trial False, (b)
    trials with stim_is_random True and outcome not spoil (the "random trials" of Methods,
    Session control). Reproduced when every session has at least 90 under both readings; not
    reproduced when a session has fewer under both; blocked as methods_underspecified when they
    disagree. The smallest count is reported.
- id: session-labeling-quality
  statement: Each included session has every whisker labeled in at least 95% of frames, and at
    most 2% of its contact events contain a frame with a missing label.
  source: Technical Validation, Inclusion criteria
  quote: we required that every whisker be labeled in ≥95% of the frames, that ≤2% of the
    contact events contained even a single frame with a missing label
  expected:
  - quantity: smallest fraction of frames labeled, any whisker and session
    value: 0.95
    tolerance: 0
  - quantity: largest fraction of contacts with a missing frame, any whisker and session
    value: 0.02
    tolerance: 0
  criterion: A frame is labeled for a whisker when it was not interpolated. The paper does not
    give the denominator or whether C0 counts. Readings for the frame fraction are (a) frames
    with interpolated False over the frames of the processed series, (b) frames with all
    eight markers in the raw pose series over the frames of the video. For contacts, a contact
    of a whisker has a missing label when any frame from start_time to stop_time is
    interpolated or absent from that whisker's processed series. Whiskers are (i) C0 to C3,
    (ii) C1 to C3, C0 "rarely made contact" and may not have been held to this. Reproduced when
    both thresholds hold in every session under every reading of each; not reproduced when
    they fail under all; blocked as methods_underspecified otherwise.
- id: contacts-structure
  statement: Contacts are stored per whisker as time intervals with start, stop, location in
    the frame and whisker angle.
  source: Data Records, NWB file, processing group identified_whisker_contacts
  quote: We have also added optional fields containing the location of each contact, expressed
    both as a Cartesian location within the frame and also as the angle of the whisker at the
    time of the contact
  depends_on:
  - nwb-structure
  criterion: Reproduced when every session has a contacts table for each tracked whisker that
    made contacts, with start_time not after stop_time on every row, a location (x and y) and
    an angle column.
- id: nwb-structure
  statement: Each NWB file holds the groups Table 1 lists, acquisition (neural recording and
    behavioral video), electrodes, processing, trials and units, with licks, rewards, raw and
    processed whisker position and whisker contacts under processing.
  source: Data Records, Annotated data in the NWB file, Table 1 and the sections after it
  quote: processing A group containing a ProcessingModule named "behavior". This includes
    processed data about behavioral events, whisker position, and whisker contacts
  criterion: The text names the processing data in two ways, as separate groups
    ("behavioral_events", "raw_whisker_position", "processed_whisker_position",
    "identified_whisker_contacts", each holding interfaces such as "whisker_C2") and, in Table 1,
    as one module "behavior". The paper's UsageNotes.ipynb (commit 33d610b) reads
    processing['behavior']['processed_position_whisker_C2'] and
    processing['behavior']['contacts_by_whisker_C2']. Reproduced when every file holds the
    contents of each section (licks left and right, rewards left and right, pose per whisker,
    angle, base, tip, bend and interpolated per whisker, contacts per whisker, the Table 6
    columns of trials) under either naming, which is reported; ecephys files also the
    extracellular array recording, electrodes (Table 4) and units (Table 5 columns). Partially
    reproduced when a section's data are present under other names. The acquisition
    "behavioral video" holds a relative path to an existing video file.
- id: file-layout
  statement: The dataset has one folder per mouse with one NWB file per session, named
    sub-<mouse>_ses-<session>_behavior+image.nwb with "ecephys" added when neural data are
    present, the video of each session in a folder of the same name, and raw neural data under
    sourcedata.
  source: Data Records, Directory structure of the entire dataset
  quote: At the top level, there is one folder per subject ... Video files are stored in a
    directory with the same name as the corresponding NWB file. Finally, we also provide the
    raw neural data files in a directory called "sourcedata"
  criterion: From the dataset's file list. Reproduced when every NWB file is in its subject's
    folder and named as described, every session has a video in a folder named as its NWB
    file, and sourcedata/ holds Open Ephys files and Kilosort/Phy outputs for the ecephys
    sessions under sub-<mouse> folders; partially reproduced when one part fails for some
    sessions.
- id: video-format
  statement: The raw videos are mkv files whose frame rate is set to 30 frames/s though the true
    rate is 200 frames/s, and most sessions are 640 x 550 pixels.
  source: Data Records, Raw data, video files; Methods, High-speed videography and whisker
    tracking, paragraph 1
  quote: Importantly, the frame rate of this video file is spuriously set to 30 frames per
    second, even though the true frame rate is 200 frames per second
  depends_on:
  - file-layout
  criterion: From the video file headers. Reproduced when every video is mkv (x264) with a
    nominal rate of 30 frames/s, and more than half the sessions are 640 x 550 (in either axis
    order); the frame count over 200 is compared with the span of the session's whisker
    timestamps and reported.
- id: subjects-sex-age-strain
  statement: The mice were C57BL/6J, males and females in roughly equal proportion, and began
    training between postnatal days 90 and 180.
  source: Methods, Two behavioral tasks, paragraph 7
  quote: We purchased breeder mice from the C57BL/6 J strain ... Mice began behavioral training
    between postnatal days 90 and 180 ... We used males and females arbitrarily and in roughly
    equal proportion
  criterion: From subject metadata (sex, strain, date of birth) and session start times.
    Strain holds when every subject is C57BL/6J (any spelling). Age holds when every mouse's
    first session is at 90 days or older, as sessions came after training (the training start
    itself is not recorded). The paper sets no threshold for "roughly equal"; readings are (a)
    a two-sided binomial test of the sex counts against one half does not reject at p 0.05,
    (b) the minority sex is at least one third of the mice. Reproduced when strain, age and
    both sex readings hold; blocked as methods_underspecified when the two sex readings
    disagree; not reproduced otherwise. The counts are reported.
- id: tracking-mean-error
  statement: The mean distance between true and predicted marker labels is 2.8 pixels.
  source: Technical Validation, Validation of pose tracking data, paragraph 1
  quote: The simplest metric of tracking accuracy is the mean distance between the true label
    and the predicted label, which is 2.8 pixels in our case
  expected:
    quantity: mean distance between true and predicted marker positions
    value: 2.8
    tolerance: 0.28
    unit: pixels
  criterion: Needs the human-curated labels and the held-out predictions of the network
    (Technical Validation, doubly held-out cross validation), which the Data Records do not
    list among the deposits. The paper does not say over which curated datasets the mean is
    taken; readings are (a) curated dataset 1, (b) all five pooled. Reproduced when a reading
    is within tolerance; blocked when the labels are not in the dataset.
- id: tracking-error-dataset1
  statement: On curated dataset 1, 7433 randomly chosen typical frames, each type of tracking
    error (poorly traced, incorrectly classified, false positive, false negative) is below
    0.2%.
  source: Technical Validation, Validation of pose tracking data, paragraphs 3 and 4; Fig. 2c
  quote: each type of error is nearly zero (<0.2%) on dataset 1, which is the only dataset
    representative of typical frames
  expected:
  - quantity: frames in curated dataset 1
    value: 7433
    tolerance: 0
  - quantity: largest error rate of any type, curated dataset 1
    value: 0.002
    tolerance: 0
  criterion: Error types as Technical Validation defines them (poorly traced, a tip or mean
    marker distance above 20 pixels; incorrectly classified; false positive; false negative),
    per whisker, on held-out predictions from the three-fold doubly held-out cross validation.
    Needs curated dataset 1 and the predictions, not among the listed deposits. Reproduced
    when all four rates are below 0.2%; blocked when the data are absent.
- id: tracking-error-challenge
  statement: Error rates rise with each later set of challenge frames (curated datasets 2 to 5),
    and the most common error is the false negative.
  source: Technical Validation, Validation of pose tracking data, paragraph 4; Fig. 2c
  quote: Paradoxically, error rates increase with each subsequent set of challenge frames ...
    The most common type of error is the false negative
  depends_on:
  - tracking-error-dataset1
  criterion: As in tracking-error-dataset1, on curated datasets 1 to 5. The paper does not say
    whether "error rates" means each type or their total; readings are (a) the total of the
    four types, (b) each type. Reproduced when the rate rises from each set to the next and the
    false negative is the largest type in each set, under both readings; blocked as
    methods_underspecified when they disagree; blocked when the data are absent.
- id: prior-task-strategies
  statement: In the original study, shape discrimination mice compared the prevalence of
    contacts across whiskers, a computation enabled by tuning changes in barrel cortex, while
    shape detection mice responded to the total number of contacts across all whiskers and
    barrel cortex neurons kept their expected tuning.
  source: Background & Summary, paragraph 4 (findings of ref. 8)
  quote: We found that shape discrimination mice compared the prevalence of contacts across
    whiskers, a comparison computation enabled by tuning changes in the barrel cortex. In
    contrast, shape detection mice simply responded to the total number of contacts across all
    whiskers, and in that case barrel cortex neurons maintained their expected tuning
  criterion: A finding of ref. 8 (Rodgers et al. 2021, Neuron 109, 2308), restated here
    without any method; this paper gives no model, selection or test for it. Blocked as
    methods_underspecified under this claims file; a test needs the methods of ref. 8.
- id: prior-orthogonal-subspaces
  statement: In earlier work on these data, barrel cortex represented sensory and motor
    variables in approximately orthogonal subspaces.
  source: Background & Summary, paragraph 4 (finding of ref. 10)
  quote: We have also reported that barrel cortex represents sensory and motor variables in
    approximately orthogonal subspaces, which could be useful for generalization to novel
    conditions
  criterion: A finding of ref. 10, restated here without any method; this paper gives no
    variables, model or measure of orthogonality for it. Blocked as methods_underspecified under
    this claims file; a test needs the methods of ref. 10.
