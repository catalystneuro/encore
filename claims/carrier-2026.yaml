# Claims for Carrier, Romano, Scaria, Palmer, O'Leary, Marder & Powell (2026), "The combined
# effects of temperature and salinity on the stomatogastric nervous system of two species of
# decapod crustacea", J Neurophysiol 135: 797-814, doi:10.1152/jn.00294.2025, tested on
# Zenodo:17624449 (Part I, folder zenodo-17624449) and Zenodo:17794764 (Part II, folder
# zenodo-17794764).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-25,
# protocol as stated in docs/protocol.md (version pilot-19, Reader).
#
# Text read. The version of record (J Neurophysiol PDF, CC-BY 4.0), full text in
# paper/10.1152-jn.00294.2025.txt: main text, Methods, figure legends 1 to 9, Table 1, Data
# availability. The paper has no supplement and cites none. The PDF could not be rendered in this
# run, so the bar heights of Figures 1E, 4E and 9 (percentages) were not read; only the numbers
# the text states are used.
#
# Code read. None. The paper links no code repository; Data availability says "All data and
# custom analysis scripts" are in the two Zenodo records. The archives' file lists show no
# separate script files, so any scripts sit inside the data archives, which a reader does not
# open. Burst detection, frequency and phase were computed with "custom Spike2 (CED) or MATLAB
# (MathWorks) scripts" (Methods, Data Analysis and Statistics); regressions and two-sample tests
# in GraphPad Prism; mixed-effects models of frequency in R (lme4, lmerTest); in vivo spectrograms
# with MATLAB scripts by Ekaterina Morozova (ref. 56). The paper gives none of these scripts.
#
# The datasets, from their archive descriptions. Part I (zenodo-17624449) holds the raw data from
# all dissected lobster (H. americanus) nervous systems and half of the crab (C. borealis)
# nervous systems, with "meta data used to create the plots and graphs" (Excel, Prism, MATLAB and
# CSV files). Part II (zenodo-17794764) holds the other half of the crab nervous systems and all
# in vivo recordings of both species. So claims on isolated crab STNS rest on both folders, claims
# on isolated lobster STNS on zenodo-17624449, claims comparing the two species on both, and in
# vivo claims on zenodo-17794764.
#
# Data the paper used, as it reports them.
# - Animals. Adult male C. borealis (Jonah crab), August 2022 to February 2024, kept at about
#   11 C. Adult male and female H. americanus (American lobster), Summer 2021 to April 2024, kept
#   at about 10 C. n is one animal or one nervous system.
# - Isolated STNS, extracellular recordings of the lvn (PD, LP, PY), pdn (PD) and pyn (PY),
#   digitised at 10 kHz (Micro 1401 with Spike2, or Digidata 1440 with pClamp).
# - Salinity series at 10 C. 30 min baseline in 1x saline, then sequential 15-min applications of
#   1.25x, 1.5x, 1.75x (increasing) or 0.75x, 0.5x, 0.25x (decreasing), stopping at the first
#   crash. 0.25x only in initial experiments (n = 3). Crab preparations received both series
#   (with 1 h of 1x between); lobster preparations one series each (separate sets).
# - Temperature ramps. From 10 C in 2 C steps every 2 min until crash, then cooled. Combined
#   experiments: 15 min at 10 C in 1x, 15 min in 0.75x or 1.25x, ramp; 15 min recovery at 10 C,
#   then the other altered saline; order counterbalanced. Within-preparation 1x ramps serve as
#   controls.
# - Measured variables. PD burst frequency (pyloric frequency) from the final 30 s of each saline
#   application or each 2-min temperature step; crash temperature of the rhythm and of each
#   neuron; phases of PD off, LP on and off, PY on and off over ten cycles per step (lobster
#   only).
# - In vivo. PPG sensor (AMP03) over the pylorus, digitised at 5 kHz (Digidata 1440, pClamp).
#   Animals moved from 1x artificial seawater (30 to 34 ppt, 10 to 12 C) to 0.75x, 0.5x, 0.25x,
#   1.25x, 1.5x or 1.75x for 1 h; also 2.5 h (n = 6, not shown) and 15 h (n = 5) exposures, with
#   deaths counted after 15 h.
#
# Method details used throughout, from the Methods.
# - Q10. Pyloric frequency F against temperature T on a semi-log plot, m = dlogF/dT from a
#   "nonlinear regression" in Prism, Q10 = 10^(10m), with a 95% CI. Slopes of two groups compared
#   with Fisher's extra-sum-of-squares F test; a single group compared with zero slope. Open, and
#   named in each Q10 claim: (Q-a) a least-squares fit of the semi-log model F = 10^(mT + b) on
#   untransformed frequency, as Prism's semi-log nonlinear model does, or (Q-b) a linear fit of
#   log10 F on T. The F test compares a model with one shared slope (separate intercepts) against
#   separate slopes; the paper says it compares slopes, so the intercepts are left free. The
#   degrees of freedom printed (for example F(1,171) with n = 11 over 10 to 24 C) fit a regression
#   on every preparation's value at every step, not on step means; Fig. 3B (F(1,8)) is the
#   exception, named in its claim.
# - Crash. "the point at which two of the three pyloric motor neurons failed to rhythmically
#   burst" (Methods); a neuron's crash is the loss of its bursts in the extracellular recording.
#   The crash temperature is the ramp step at which this is seen (Fig. 2A, "At 26 C, this
#   preparation crashed"). The burst detection criteria are not given (open); the analysis files
#   the Part I description lists may hold the authors' per-preparation values, which are the
#   paper's own reading of the recordings.
# - Frequency. PD burst frequency over the final 30 s of the step. Whether it is the mean of
#   1/period over the cycles or the number of PD bursts over 30 s is not given (open; it cannot
#   change a mean by much, so mean of 1/period is the standard choice and the count is shown).
# - Two-sample tests as each claim names (Shapiro-Wilk first, then paired or Welch t test,
#   Wilcoxon signed-rank or Mann-Whitney U, alpha 0.05).
# - Tolerances. Means are printed as mean plus or minus SD across preparations. The SD is the
#   spread of preparations, not the uncertainty of the mean, so tolerances on means are the SEM
#   computed from the stated SD and n, rounded up to two decimals. Q10 tolerances are half the
#   width of the paper's 95% CI, and a Q10 also holds when it falls inside the printed CI.
#
# Inconsistencies in the text, named in the claims they touch: Fig. 4B legend n = 8, Results
# n = 9; Fig. 4D legend labels the 1.25x comparison "1x and 0.75x" and gives P = 0.8, Results
# P = 0.9; Fig. 3C legend says the PY-off phase changed with temperature, Results and Table 1 say
# PY-on; the Fig. 9 legend puts crabs in panel A, the Results put lobsters in 9A; the Fig. 2
# summary paragraph says 1.25x saline decreased pyloric frequency (Fig. 2F), the paragraph that
# presents Fig. 2F says frequency rose similarly; crab crash temperatures in 1x are given as 29.3
# (n = 11), 31.3 (n = 9) and 30.21 C (n = 21), for different sets of preparations; lobster 0.75x
# ramps are n = 10 in Fig. 5C and n = 14 in Fig. 7A and 7D.
