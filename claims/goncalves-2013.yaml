# Claims for Goncalves, Anstey, Golshani & Portera-Cailliau (2013), Nature Neuroscience 16:903-909,
# on CRCNS data set ssc-8 (doi:10.6080/K0X63K3X).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-08,
# protocol as stated in docs/protocol.md (Reader, version pilot-13).
#
# Text read: the version of record, PMC3695061 (open access), Europe PMC full-text XML flattened
# to text: abstract, Introduction, Results, Discussion and Online Methods. The text holds no
# figure legends and no supplement (Supplementary Figures 1 to 4 are cited but not supplied), and
# no PDF was supplied. Every claim below rests on numbers printed in the Results text; details
# that the legends or the supplement may have given (the correlation measure of Fig. 1, how
# Fig. 1d was binned, the panels of Suppl. Figs. 1 to 4) are treated as open. The paper links no
# analysis code. It names outside software only (ScanImage, the iPeak package, Chronux); none
# was read, and none of it settles a detail used here.
#
# Data the paper used. Male and female C57Bl/6 wild-type (WT) and Fmr1 -/- (KO) mice, P9 to P40,
# head-fixed and unanesthetized unless stated. Layer 2/3 barrel cortex, right hemisphere, bulk
# loaded with Oregon Green BAPTA-1 AM; two-photon imaging at 3.9 Hz (512 x 128 pixels), or
# 15.6 Hz in one control experiment. Several 3-min movies concatenated per mouse; contours of
# cells drawn on the mean image, astrocytes (sulforhodamine-101) excluded; dF/F per cell, low-pass
# filtered and deconvolved; firing rates extrapolated from the deconvolved traces. Ages P9-11,
# P14-16 and P30-40; mice per group 12, 9 and 8 WT, 9, 10 and 8 KO (Fig. 1e). Other experiments,
# not in the CRCNS description: whole-cell current-clamp recordings of L2/3 neurons at P14-16
# (7 WT and 12 KO mice; Up/Down state and fast oscillatory activity segments), EEG recorded with
# calcium imaging in a subset of mice (3-min recordings; L/H power, 0.5-4 Hz over 20-60 Hz), and
# imaging under isoflurane at P14-16. The CRCNS description of ssc-8 lists, for the two
# genotypes and three age groups, raw TIFF movies of unanesthetized mice at 3.9 Hz (one per
# animal, 6 to 13 animals per group, 40 to 149 neurons, about 7 to 8 min each), the estimated
# firing rates of each neuron (frames by neurons) and the cell-to-cell distances in microns. It
# names no EEG, whole-cell or isoflurane data.
#
# Shared method, from the Online Methods and Results unless stated.
# - Traces. The Methods compute firing rates and "pair-wise continuous-trace cross-correlations"
#   from the deconvolved dF/F traces, citing their earlier study (ref. 15) for the detail. Which
#   trace enters the correlation is open: reading T-a, the deconvolved traces (the data set's
#   estimated firing rates); reading T-b, the low-pass filtered dF/F traces, which would need the
#   cells to be segmented anew from the raw movies, as no contours are deposited.
# - Correlation measure. The Results report "Similar results ... using the Pearson method", so
#   the main measure is not Pearson, and the text does not name it beyond "continuous-trace
#   cross-correlations" (Methods). Reading C-b, the zero-lag normalised cross-correlation of the
#   traces without mean subtraction (sum of x times y over the square root of the product of the
#   sums of squares), is the one that wording supports. C-a, Spearman rank correlation at zero
#   lag, is not supported by the text (it names cross-correlations, not ranks) and is shown as a
#   variant only, not as a reading that can decide a claim. Whether the cross-correlation is
#   taken at zero lag or at its peak over lags is open; the text gives no lag window, so zero lag
#   is used. Pearson is the paper's own variant (claim pearson-genotype).
# - Pairs and units. "Cells within 100 um" is read as pairs whose distance in the data set's
#   distance matrix is below 100 um. The n in every calcium imaging comparison is mice (or
#   recordings for the EEG subset), so each mouse's value is the mean over its pairs (or cells),
#   and tests are run on mouse values. Errors are s.e.m. over mice (Statistical Analyses).
# - Tests. Unpaired two-tailed Student's t-test unless stated; alpha 0.05; post hoc p-values
#   Bonferroni adjusted. The genotype by age comparison is an unequal-variance 2 x 3 fixed-effects
#   ANOVA with Satterthwaite error degrees of freedom (Statistical Analyses). How it is fitted is
#   not given; a standard choice is weighted least squares with each of the six groups weighted by
#   the inverse of its variance and Satterthwaite degrees of freedom for each contrast, which
#   should not change the outcome against other fits of the same model.
# - Firing rate per mouse. The mean over cells of each cell's mean estimated rate over the
#   recording. The data descriptor does not give the unit of the estimated rates; if they are per
#   frame they are multiplied by 3.9 to give Hz (the author decides from the data which holds).
