- id: fig4c-log-trend
  statement: FWHM fell logarithmically with packet rate from 1 Hz to 10 kHz (R = 0.77, p < 0.001; n =
    15), with no further narrowing from 10 kHz to 0.2 MHz.
  source: Results 3.1, paragraph 5; Figure 4C legend
  quote: FWHM decrease followed the logarithmic dependence from 1 Hz to 10 kHz (correlation
    coefficient R = 0.77, p<0.001), but there was no further focality increase when the packet rate
    increased from 10 kHz to 0.2 MHz.
  datasets:
  - "001047"
  statistics:
  - about: log fit of FWHM against packet rate, 1 Hz to 10 kHz
    test: correlation
    statistic: R = 0.77
    p: 0.001
    p_relation: "<"
    n: 15 experiments (0.2 MHz excluded)
  - about: slope of the log fit (Fig. 4C legend)
    test: 2-sided, one-sample t test
    p: 0.0001
    p_relation: "<"
    n: 15 experiments
  expected:
    quantity: correlation of FWHM with log packet rate, 1 Hz to 10 kHz
    value: 0.77
    tolerance: 0.077
  depends_on:
  - fig4c-fwhm-falls-with-rate
  criterion: Per-experiment FWHM from fig4c-fwhm-falls-with-rate, rates 1 Hz to 10 kHz, 0.2 MHz left
    out (Fig. 4C legend, n = 15 for fitting). FWHM = m log(rate) + c by least squares; R is the
    absolute Pearson correlation of FWHM with log rate; the slope is tested by the two-sided
    one-sample t test (legend). Reproduced when R is within tolerance, the slope is negative with p <
    0.001, and mean FWHM at 0.2 MHz is not below that at 10 kHz by a gap larger than the error bars
