- id: fig5-raised-electrodes-weaken-centre
  statement: Since with MHz-CANCAN there was practically no YP staining near electrodes (a finding the
    text cites to Figure 4), the only clear effect of raising the electrodes 1 or 2 mm above the
    monolayer was a weakening of electroporation in the central spot.
  source: Results 3.2, paragraph 1; Figure 5A, 5B
  quote: With MHz-CANCAN (CT26 cells, 2 bursts (x4), Fig. 4 ), there was practically no YP staining
    near electrodes to start with, so the only clear effect of raising electrodes was the weakening
    of electroporation in the central spot.
  datasets:
  - "001284"
  criterion: Set S2, F1 to F3, F8, O1, O2. YP in percent of the mean 0-mm peak (Fig. 5B legend); the
    centre is x = 0. The paper gives no test. Reproduced when mean centre YP at 1 mm and at 2 mm
    elevation are each below that at 0 mm by a gap larger than the error bars (F8); two-sided t-tests
    with Bonferroni over the two comparisons (F7) are reported. The near-electrode part is the Figure
    4 finding, judged in fig4b-40-fold-ratio; mean YP at 6 and 7 mm at each elevation, in % of the
    0-mm centre, is reported.
- id: fig5ab-yp-spot-slightly-larger-than-pr
  statement: The central spot of YP staining (electroporation) was only slightly larger than the spot
    of Pr staining (cell killing).
  source: Results 3.2, paragraph 1; Figure 5A, 5B
  quote: Somewhat unexpectedly, the central spot of YP staining (electroporation) was just slightly
    larger than the spot of Pr staining (cell killing; Fig 5A and B ).
  datasets:
  - "001284"
  - "001047"
  criterion: Set S2, F1 to F4, F6, O1, O2. Spot size is the FWHM, the paper's measure of spot size
    (Results 3.1). FWHM of the Lorentzian fit to mean YP and of the Gaussian fit to mean Pr over -5 to
    5 mm (Fig. 5B legend); the Gaussian FWHM is 2.4 sigma as the Methods give it, and 2.355 sigma as
    a variant. The paper bounds "slightly" by no number; readings (a) YP FWHM / Pr FWHM between 1 and
    1.25, (b) between 1 and 1.5. Reproduced when the ratio falls in the range under every reading at
    0 mm elevation (Fig. 5A shows all three; the text gives no elevation); the 1 and 2 mm elevations
    are reported.
- id: fig5b-gaussian-pr-lorentzian-yp
  statement: Pr intensity declined from the peak as a Gaussian and YP as a Lorentzian; in the left
    panel of Figure 5B the R2 was 0.92 (Lorentzian) against 0.96 (Gaussian) for Pr, and 0.98 against
    0.95 for YP, fitted from -5 to 5 mm with p < 0.0001.
  source: Results 3.2, paragraph 2; Figure 5B
  quote: For Pr data in the left panel of Fig. 5B , the coefficient of determination increased from
    0.92 for Lorentzian fit to 0.96 for Gaussian fit. YP data showed the opposite trend, with the
    coefficients of 0.98 and 0.95 for Lorentzian and Gaussian fits, respectively (for all these
    fits, the fitted region was from −5 to 5 mm, p<0.0001).
  datasets:
  - "001284"
  - "001047"
  statistics:
  - about: each of the four fits
    p: 0.0001
    p_relation: "<"
  expected:
  - quantity: R2 of Lorentzian fit to Pr
    value: 0.92
    tolerance: 0.092
  - quantity: R2 of Gaussian fit to Pr
    value: 0.96
    tolerance: 0.096
  - quantity: R2 of Lorentzian fit to YP
    value: 0.98
    tolerance: 0.098
  - quantity: R2 of Gaussian fit to YP
    value: 0.95
    tolerance: 0.095
  criterion: Set S2. The left panel of Figure 5B is not named; it is read as the 0-mm panel, the one
    whose peak is 100% (legend). Mean profiles in percent, F4 fits over -5 to 5 mm, O1, O2. R2 is 1 -
    SSres / SStot over the fitted points. As 10% tolerances on R2 near 1 are loose, the orderings are
    part of the claim. Reproduced when every R2 is within tolerance and the ordering holds (Gaussian
    above Lorentzian for Pr, Lorentzian above Gaussian for YP) under every reading; partially when
    the values are within tolerance but an ordering fails. The other elevations are reported.
- id: fig5b-reversible-beyond-2mm
  statement: The Lorentzian YP profile and the Gaussian Pr profile differ mainly in the tails, where
    YP is broader, marking an area of predominantly reversible electroporation that starts about 2
    mm from the centre.
  source: Results 3.2, paragraph 2; Figure 5B
  quote: The difference between the fits is primarily in the tails, which are broader in Lorentzian
    distribution compared to Gaussian. This difference highlights the area of predominantly
    reversible electroporation, which extends outwards starting at about 2 mm from the center.
  datasets:
  - "001284"
  - "001047"
  depends_on:
  - fig5b-gaussian-pr-lorentzian-yp
  expected:
    quantity: distance from the centre where YP first exceeds Pr, both in % of their peaks, 0 mm
      elevation
    value: 2
    tolerance: 0.2
    unit: mm
  criterion: Set S2 at 0 mm elevation, F1 to F4, O1, O2. YP and Pr each in % of their own 0-mm peak
    (Fig. 5B legend). The paper does not say how 2 mm was found; readings (a) the smallest distance at
    which mean YP% exceeds mean Pr% by a gap larger than the error bars (F8); (b) the smallest
    distance at which the fitted Lorentzian, in % of its a, exceeds the fitted Gaussian, in % of its
    a, by more than the mean s.e. of YP% over the fitted points. Each side of the centre is taken
    separately and averaged. Reproduced when the distance is within 1.8 to 2.2 mm under one reading;
    where the ROIs are more than 0.4 mm apart (O1), when it is the ROI nearest 2 mm.
- id: fig5c-nuclear-yp-centre
  statement: In the central spot cells showed bright nuclear YP staining, indicating irreversible
    damage, while farther out reversibly electroporated cells were weakly stained with less contrast
    between nucleus and cytoplasm; cells inside the electrode footprint were unstained though present
    (Hoechst).
  source: Results 3.2, paragraph 1; Figure 5C
  quote: Indeed, a closer examination of the central spot confirmed bright YP staining of cell nuclei
    ( Fig. 5C , zone 1), which is indicative of the irreversible membrane damage and cell death.
    Reversible electroporation is distinguished by a much weaker YP staining and smaller difference
    in staining of the nucleus and cytoplasm, such as in zones 2 and 3 in Fig. 5C .
  datasets:
  - "001284"
  - "001047"
  criterion: Set S2 at 0 mm. The zones are marked only in Figure 5A, not seen. Zone 1 is in the
    central spot; zone 3 straddles an electrode wall (its right portion lies inside the footprint,
    Results 3.2; the Fig. 5C legend marks the wall), so its outside part is the band within 0.5 mm
    outside a wall; zone 2 is not placed by the text, readings (a) 2 to 4 mm, (b) 3 to 5 mm from the
    centre along a diagonal; zone 1 is within 1 mm of the centre. Intensity part, on the whole-well
    images. Background-subtracted YP (F2) in zone 1 exceeds that in zones 2 and 3, footprint YP is
    below zones 2 and 3, and the footprint holds Hoechst-positive cells in the Hoechst image taken
    after the Pr image (Methods 2.4, re-imaged "to check for possible cell loss"), judged against
    the same footprint's cell-free lumen or, without one, against the camera offset (a standard
    choice; the paper names no reference level). Nuclear part, on the high-resolution images of Fig.
    5C. Nuclei are Hoechst-positive objects (Otsu threshold, a standard choice) and the cytoplasm a
    ring around each, readings (a) 2 to 4 um, (b) 4 to 8 um; the median nucleus to cytoplasm YP
    ratio is higher in zone 1 than in zones 2 and 3. Reproduced when both parts hold under every
    reading; partially when the intensity part holds and the nuclear part is blocked because no
    dataset holds high-resolution images. Blocked as data_missing for the footprint part when no
    post-exposure Hoechst image is held.
- id: fig6b-peak-900ns-not-significant
  statement: The central YP peak was highest for 900-ns pulses, but not significantly different from
    300- or 600-ns pulses.
  source: Results 3.3, paragraph 2; Figure 6B
  quote: The central peak of YP uptake was higher for 900-ns pulses, but the difference from the
    other two pulse durations was not statistically significant (CT26 cells, 2 bursts (x4), Fig. 6B ).
  datasets:
  - "001277"
  criterion: A claim of absence. Set S3, F1 to F3, O2; per experiment the background-subtracted YP at
    x = 0, n = 5 per duration. The paper does not name the test here; the sentence frames two
    comparisons ("the difference from the other two"), and Fig. 6D tests durations by two-sided
    t-tests with Bonferroni correction, so the test is 900 ns against 300 ns and against 600 ns,
    two-sided Student's t-tests with Bonferroni over the two (F7). Reproduced when the 900-ns mean is
    the highest and no corrected p is below 0.05; not reproduced when one is. A one-way ANOVA over
    the three durations (Methods 2.5) and Bonferroni over all three pairs are shown as variants;
    effect sizes are reported.
- id: fig6c-normalized-decline-similar
  statement: Normalized to the central peak, the sideways decline of YP was similar for the three
    pulse durations.
  source: Results 3.3, paragraph 2; Figure 6C
  quote: When the peak YP emission was taken as 100%, its decline sideways was similar for the three
    tested pulse durations ( Fig. 6C ).
  datasets:
  - "001277"
  criterion: A claim of absence, for which the paper reports no test; it is judged by the paper's own
    rule for its graphs (F8). Set S3, F1 to F3, O1, O2; each experiment's profile in percent of its
    value at x = 0, then mean +/- s.e. per duration (Fig. 6C, "same data as in B, but normalized to
    the peak"; per-experiment normalization is the one that gives per-experiment error bars).
    Reproduced when at no measured distance do two durations' means differ by a gap larger than the
    error bars; not reproduced when any does, with the distances and gaps reported. Normalizing the
    mean profile and limiting the range to -5 to 5 mm (the Fig. 6B fit range) are shown as variants.
- id: fig6d-longer-pulses-sharper-peak
  statement: Fitted per experiment, the FWHM of the central YP peak decreases with pulse duration from
    300 to 900 ns, with a trend slope different from zero (p = 0.003).
  source: Results 3.3, paragraph 2; Figure 6D legend
  quote: However, a more detailed analysis based on fitting of individual experiments (as described
    in 3.1 ) revealed significant sharpening of the central peak when packets were built from 600-
    and 900-ns pulses ( Fig. 6D ). The slope coefficient of the logarithmic fit of the data was
    different from zero at p = 0.003 (one sample, 2-sided t -test).
  datasets:
  - "001277"
  statistics:
  - about: slope of FWHM against pulse duration
    test: one sample, 2-sided t-test
    p: 0.003
    n: 5 experiments per duration
  criterion: Set S3, F1 to F5, F7, O1 to O4. Per-experiment Lorentzian FWHM (centre fixed at 0, a and
    b free, no offset, as F4 writes it). The form of the trend is open, as the text says "logarithmic
    fit" and the legend "best linear fit"; readings (a) FWHM against duration, (b) FWHM against log
    duration, each slope tested by the two-sided one-sample t test. Reproduced when the slope is
    negative with p < 0.05 under every reading; the p under each is reported and compared with
    0.003.
- id: fig6d-600-900-differ-from-300
  statement: FWHM for 600-ns and for 900-ns packets is each significantly smaller than for 300-ns
    packets (Bonferroni-corrected t-tests, p = 0.028 for one and p = 0.0072 for the other).
  source: Figure 6D legend
  quote: "*p=0.028, **p=0.0072 for the difference from 300-ns pulse exposure (2-sided t -test with
    Bonferroni correction)"
  datasets:
  - "001277"
  statistics:
  - about: one of 600 ns and 900 ns against 300 ns (the legend does not say which)
    test: 2-sided t-test with Bonferroni correction
    p: 0.028
    corrected: Bonferroni
    n: 5 experiments per duration
  - about: the other of 600 ns and 900 ns against 300 ns
    test: 2-sided t-test with Bonferroni correction
    p: 0.0072
    corrected: Bonferroni
    n: 5 experiments per duration
  depends_on:
  - fig6d-longer-pulses-sharper-peak
  criterion: Per-experiment FWHM as in fig6d-longer-pulses-sharper-peak. Two-sided Student's t-tests
    of 600 against 300 ns and of 900 against 300 ns (legend), Bonferroni-corrected; the number of
    comparisons is not stated, readings (a) 2, each against 300 ns as the legend frames them, (b) 3,
    all pairs. Reproduced when both corrected p are below 0.05 with the smaller FWHM at the longer
    duration under every reading of O1 to O3 and the comparison count; partially when only one of
    the two is. The legend's asterisks are not assigned to durations in the text, so the p-values
    are compared with 0.028 and 0.0072 in either order and shown.
- id: fig6d-900ns-fwhm
  statement: Packets of 900-ns pulses reduced FWHM to 1.7 +/- 0.08 mm, 11.1 +/- 0.6% of the gap between
    electrodes.
  source: Results 3.3, paragraph 2; Figure 6D
  quote: 900-ns pulse packets reduced FWHM to 1.7 ± 0.08 mm, that was 11.1 ± 0.6% of the gap between
    electrodes.
  datasets:
  - "001277"
  depends_on:
  - fig6d-longer-pulses-sharper-peak
  expected:
  - quantity: mean FWHM, 900-ns packets
    value: 1.7
    tolerance: 0.08
    unit: mm
  - quantity: mean FWHM, 900-ns packets, in % of 15.3 mm
    value: 11.1
    tolerance: 0.6
    unit: "%"
  criterion: Mean over the 5 experiments of the per-experiment FWHM of
    fig6d-longer-pulses-sharper-peak, in mm and in % of 15.3 mm (F5). Tolerances are the paper's
    stated spread, read as the s.e. (Methods 2.5). Reproduced when both values are within tolerance
    under one combination of O1 to O3; the result under each is shown.
- id: fig7be-center-linear-with-bursts
  statement: The central YP peak grew linearly with the number of bursts in both CT26 and CHO cells
    (slopes different from zero at p < 0.001), except that it saturated after 6 bursts (x4) in CT26
    cells.
  source: Results 3.4, paragraph 1; Figure 7B, 7E and legend
  quote: Increasing the number of bursts increased the amplitude of the central peak of YP uptake in
    both CT26 and CHO cells ( Fig 7A and D ). The increase was linear in both cell lines, except
    when it reached saturation after 6 bursts (x4) in CT26 cells ( Fig. 7B and E ).
  datasets:
  - "001276"
  statistics:
  - about: slope of centre YP against bursts, CT26, 6 bursts (x4) excluded
    test: 2-sided one-sample t test
    p: 0.001
    p_relation: "<"
    n: 3 to 5 experiments per burst number
  - about: slope of centre YP against bursts, CHO
    test: 2-sided one-sample t test
    p: 0.001
    p_relation: "<"
    n: 4 experiments per burst number
  criterion: Set S4, F1 to F3, F7, O1, O2, O4. Per experiment the background-subtracted YP at x = 0,
    regressed linearly on the number of bursts (x4) by least squares, the CT26 6-burst point left
    out (Fig. 7B legend), all CHO points in; slopes tested by the two-sided one-sample t test.
    Counting bursts as 1, 2, 4, 6 or as 4, 8, 16, 24 gives the same p. Reproduced when both slopes
    are positive with p < 0.001 under every reading; partially when a slope is positive with p <
    0.05 only, or when it holds in one cell line only. The saturation is fig7b-ct26-saturation.
- id: fig7b-ct26-saturation
  statement: In CT26 cells the central YP uptake saturated at 6 bursts (x4), falling below the linear
    increase seen at fewer bursts, as expected when all central cells are already killed.
  source: Results 3.4, paragraph 1; Figure 7B legend
  quote: Considering that even 2 bursts (x4) caused strong cell death in the center ( Fig. 5 ),
    saturation was expected and indicated that all cells were already killed and YP staining
    reached its maximum.
  datasets:
  - "001276"
  depends_on:
  - fig7be-center-linear-with-bursts
  criterion: The paper gives no test of saturation; it shows it by leaving the 6-burst point out of
    the CT26 fit and drawing the fit's 95% confidence band (Fig. 7 legend). Readings (a) the CT26
    mean centre YP at 6 bursts (x4) lies below the lower edge of the 95% confidence band of the
    linear fit of fig7be-center-linear-with-bursts, extrapolated to 6 bursts; (b) the 6-burst mean
    is not above the mean at the next lower burst number by a gap larger than the error bars (F8).
    Reproduced when both hold under every reading of O4; partially when the 6-burst mean lies below
    the fitted line but inside the band. The CHO 6-burst mean against the CHO fit through the lower
    burst numbers is reported.
- id: fig7cf-fwhm-with-bursts
  statement: The FWHM of the central peak increased in proportion to the number of bursts in CT26
    cells (slope p < 0.001) but not in CHO cells (p = 0.44).
  source: Results 3.4, paragraph 2; Figure 7C, 7F legend
  quote: Concurrently, FWHM of the central peak increased proportionally to the burst number in CT26
    cells, but not in CHO cells ( Fig. 7C and F ).
  datasets:
  - "001276"
  statistics:
  - about: slope of FWHM against bursts, CT26
    test: 2-sided one-sample t test
    p: 0.001
    p_relation: "<"
  - about: slope of FWHM against bursts, CHO
    test: 2-sided one-sample t test
    p: 0.44
  criterion: Set S4, F1 to F5, F7, O1 to O4. Per-experiment Lorentzian FWHM against burst number,
    linear least squares, slope tested by the two-sided one-sample t test. CHO 1-burst wells are left
    out (Fig. 7 legend, too small to measure FWHM). The CT26 6-burst point is kept, as the legend
    leaves it out of panel B only; leaving it out is a variant. The CHO part is a claim of absence
    judged on the paper's test, the slope t test at p < 0.05. Reproduced when, under every reading,
    the CT26 slope is positive with p < 0.001 and the CHO slope has p >= 0.05. Partially when the
    CT26 slope is positive with p < 0.05 only; not reproduced when the CHO slope has p < 0.05.
- id: fig7-sharpest-peak-one-burst
  statement: One burst (x4) in CT26 cells gave the sharpest peak of the study, FWHM 1.1 +/- 0.1 mm,
    7.3% of the inter-electrode gap and 2.3% of the electrode array area.
  source: Results 3.4, paragraph 3; Figure 7A, 7C; Abstract
  quote: That being said, 1 burst (x4) in CT26 cells produced the sharpest peak of electroporation
    seen in this study ... at FWHM of 1.1 ± 0.1 mm, it occupied just 7.3% of the inter-electrode gap
    and 2.3% of the electrode array area.
  datasets:
  - "001276"
  - "001047"
  - "001277"
  - "001284"
  depends_on:
  - fig7cf-fwhm-with-bursts
  expected:
  - quantity: mean FWHM, CT26, 1 burst (x4)
    value: 1.1
    tolerance: 0.1
    unit: mm
  - quantity: FWHM in % of 15.3 mm
    value: 7.3
    tolerance: 0.73
    unit: "%"
  - quantity: spot area in % of the electrode array area
    value: 2.3
    tolerance: 0.23
    unit: "%"
  criterion: Set S4, CT26 1-burst wells, FWHM as in fig7cf-fwhm-with-bursts under every reading of O3;
    the FWHM tolerance is the paper's spread (s.e.). The paper does not say how the area percentage
    is computed; readings (a) a disk of diameter FWHM over the square with 15.3-mm diagonals (117
    mm2); (b) a disk of radius FWHM over the square of the electrode centres (12.8-mm sides, 164 mm2,
    from Methods 2.2), the reading that gives 2.3% from 1.1 mm; (c) a disk of diameter FWHM over the
    square of the electrode centres. Sharpest in the study means the smallest mean FWHM of any group
    fitted per experiment in S1, S3 and S4 (Figs. 4C, 6D, 7C, 7F), with S2 as reported. Reproduced
    when the three values are within tolerance under one reading and the 1-burst CT26 FWHM is the
    smallest; partially when the FWHM alone is within tolerance. Groups held in datasets other than
    001276 enter the comparison where they are held; a missing series is reported.
- id: fig7-offtarget-40-50-fold
  statement: With MHz-CANCAN in CT26 cells, YP emission near the electrodes was 40 to 50 times smaller
    than at the remote target in the centre.
  source: Results 3.4, paragraph 3
  quote: Off-target effects, characterized by YP emission near electrodes, were 40–50 times smaller
    than at the remote target.
  datasets:
  - "001276"
  expected:
    quantity: ratio of centre YP to near-electrode YP, CT26
    value: 45.5
    tolerance: 9.5
  criterion: Set S4, F1 to F3, F9, O2, O5. The reported range 40 to 50, widened by 10% of each bound,
    is 36 to 55, which the value and tolerance give. The group is not named; readings (A) 1 burst
    (x4) only, as the sentence follows the 1-burst result; (B) every CT26 burst number below
    saturation (1, 2 and 4 bursts (x4)), as the sentence closes a paragraph on all of them and a
    range can be the span over groups. Reproduced when the ratio lies in 36 to 55 under one
    combination of readings (for B, for each of those groups); every combination is shown.
- id: fig7-cho-replicates-ct26
  statement: Remote focusing of electroporation was consistent across the two cell types; in CHO cells
    as in CT26 cells the YP uptake peaked at the centre of the array.
  source: Conclusion; Results 3.4, paragraph 1; Figure 7D
  quote: The improved focusing was consistent across two cell types and extended to both
    electroporation and cell killing.
  datasets:
  - "001276"
  criterion: Set S4, CHO diagonal profiles by F1 to F3, O1, O2. Reproduced when, for each burst number
    from 2 bursts (x4) up (after one burst CHO uptake was too small to measure FWHM, Fig. 7 legend;
    the 1-burst profile is reported), mean centre YP exceeds mean YP at 6 and at 7 mm (the paper's
    measure of focusing, centre against near electrodes, Results 3.1) by a gap larger than the error
    bars (F8), and the same holds for CT26 at the same burst numbers. The growth of the CHO peak
    with bursts is judged in fig7be-center-linear-with-bursts; the cell-killing part rests on CT26
    only (Fig. 5) and is not tested here.
