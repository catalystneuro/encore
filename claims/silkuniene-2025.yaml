# Claims for Silkuniene, Silkunas, Pakhomova, Semenov & Pakhomov (2025), "MHz compression of pulse
# packets facilitates remote focusing of electroporation", Bioelectrochemistry 166, 109016, tested on
# dandisets 001047, 001276, 001277 and 001284.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-10,
# protocol pilot-14 as stated in docs/protocol.md. It replaces the three files written 2026-10-22
# under pilot-10, one per dataset (claims/silkuniene-2025/001047.yaml, 001276.yaml, 001277.yaml);
# ids are kept where the finding is the same, taken from the file of the dataset that holds the
# figure (Figs. 3 to 5 from 001047, Fig. 6 from 001277, Fig. 7 from 001276).
#
# Text read. The accepted author manuscript in PubMed Central (PMC12331426, NIHMS2087238), as served
# by ncbi_pmc, in paper/10.1016-j.bioelechem.2025.109016.txt: abstract, Introduction, Materials and
# methods 2.1 to 2.5, Results 3.1 to 3.4, Discussion, Conclusion and the legends of Figs. 1 to 7.
# It is not the version of record. The paper has no supplement (PMC marks "has-supplement no" and
# the text cites none). No PDF was supplied, so no figure was seen; values printed only in a figure
# (the packet rates other than 1 Hz, 1 kHz, 10 kHz and 0.2 MHz, the ROI positions, the zones of Fig.
# 5C, axis values) are not used.
#
# Code. The paper links no code and no data deposit ("Data will be made available on request").
# It names the software only: MetaMorph 7.8.13 for intensities, RStudio, Excel and Grapher 16 for
# processing, fits and graphs, Sim4Life Lite 7.0.1.8169 for the field. No repository was read, so no
# method detail below is settled by code.
#
# The datasets, from their titles and descriptions on DANDI (draft metadata, read 2026-11-10).
# - 001047, "Optimizing NG-CanCan Protocol Delivery with MHz Compression to Minimize Near-Electrode
#   Ablation"; packets at 0.2 MHz against 1 Hz, YP and propidium. The packet-rate series of Figs. 3
#   and 4 rest on it. Its description also names propidium two hours after delivery, which in the
#   paper is measured only in the Fig. 5 series, so the 0-mm Fig. 5 claims list it as well.
# - 001276, "... Impact of Burst Number Variation ..."; 0.2 MHz, 600 ns, 1, 2, 4 or 6 bursts,
#   Hoechst and YP. The Fig. 7 series.
# - 001277, "... Impact of Pulse Duration and Protocol Delivery Frequency"; 300, 600 and 900 ns, 18,
#   9 or 6 packets, repeated twice, Hoechst and YP. The Fig. 6 series.
# - 001284, "... Focused Cell Electroporation and Ablation in a Pseudo-3D Model"; electrodes 0, 1 or
#   2 mm above the monolayer, YP and propidium. The Fig. 5 series.
# - No description names the thermochromic film images (Fig. 2) or the field simulation (Fig. 1).
#   Those claims list all four datasets; the author checks each and blocks the claim as data_missing
#   when none holds the data. The descriptions give a 10-mm inter-electrode spacing; with the
#   paper's geometry this is the edge-to-edge distance along a side (12.8 mm between centres minus
#   2.8 mm), and the paper's 15.3-mm diagonal is used throughout.
#
# Data the paper used, as it reports them. Confluent monolayers of CT26 mouse colon carcinoma cells
# (all series) and CHO-K1 cells (Fig. 7 only) in 6-well plates. Four hollow needle electrodes, 2.8 mm
# outer diameter, in a square with 15.3-mm side-to-side diagonals (Methods 2.2), touching the
# monolayer unless raised 1 or 2 mm (Fig. 5); 6 and 7 mm from the centre along a diagonal are 1.65
# and 0.65 mm from an electrode (Results 3.1). Packets of 16 pulses (Fig. 1B), first pulse 7.2 kV,
# later pairs 12.5% lower per phase; 9 packets per burst, bursts at 1 Hz, rotated over 4 directions
# ("2 bursts (x4)" is 8 bursts). Controls deliver only the first pulse of each packet. Each well is
# imaged as one stitched image (4x, 0.16 NA): Hoechst 33342 (DAPI cube) before exposure, YO-PRO-1
# (YP, 1 uM, FITC cube) 30 min after exposure, and in killing experiments propidium (Pr, Cy3 cube) 2
# h after, with Hoechst re-imaged (Methods 2.4). Series:
# - (S1) Figs. 3 and 4. CT26, 600 ns, 2 bursts (x4), packet rates from 1 Hz to 0.208333 MHz
#   ("0.2 MHz", no interval between packets) and control; n = 3 per CANCAN rate, n = 5 controls.
#   The text names 1 Hz, 1 kHz, 10 kHz and 0.2 MHz; the Fig. 4C fit has n = 15 at n = 3 per rate
#   below 0.2 MHz, so five rates below 0.2 MHz. One set also has ROIs parallel to the sides (Fig. 3C).
# - (S2) Fig. 5. CT26, 0.2 MHz, 2 bursts (x4), electrodes at 0, 1 or 2 mm; YP n = 6 to 7, Pr n = 4
#   to 5; high-resolution images of three zones (Fig. 5C).
# - (S3) Fig. 6. CT26, packets of 300-, 600- or 900-ns pulses with no interval, 18, 9 or 6 packets
#   per 43.2-us burst, 2 bursts (x4); n = 5 each.
# - (S4) Fig. 7. CT26 (n = 3 to 5) and CHO (n = 4), 0.2 MHz, 600 ns; the text names 1, 2 and 6
#   bursts (x4), and the 001276 description gives 1, 2, 4 and 6.
# - (S5) Fig. 2. Thermochromic film after 2 and 6 bursts at 0.2 MHz without rotation.
# - (S6) Fig. 1. Sim4Life field maps; model outputs, not recordings.
#
# Method fixed by the paper, cited by the criteria (Methods 2.5 unless noted).
# (F1) Intensity is the mean fluorescence in 325 x 406 um ROIs placed along the diagonals of the
#      square, connecting the electrode footprints, at signed distances x (mm) from the geometrical
#      centre of the array; in one S1 set also along lines through the centre parallel to the sides.
# (F2) Background is the mean of 3 ROIs inside an electrode footprint, subtracted from every ROI.
# (F3) The two diagonals of a well are pooled as one experiment; n counts wells (also Fig. 3B and 4B
#      legends). Data are mean +/- s.e. over experiments, in a.u. or in % of the centre value.
# (F4) YP profiles are fitted with YP(x) = a (b/2)^2 / (x^2 + (b/2)^2), a the value at x = 0 and b
#      the FWHM in mm. Pr profiles are fitted with Pr(x) = a exp(-x^2 / (2 sigma^2)), FWHM about
#      2.4 sigma (Methods 2.5, which says Fig. 6 where the Gaussian appears in Fig. 5; the Fig. 5B
#      legend fixes it for Pr). Fits are least squares in Grapher, the standard reading of "fitted".
# (F5) FWHM per condition is the mean of the FWHM of Lorentzian fits to each experiment (Results 3.1;
#      Fig. 4C and 6D legends). FWHM in % of the gap is FWHM / 15.3 mm (Fig. 4C legend, "% of the
#      diagonal distance between electrodes"; Results 3.3 gives 1.7 mm as 11.1%).
# (F6) Fitted ranges. -4 to 4 mm for Fig. 3 and the per-experiment fits of Fig. 4C (Results 3.1, Fig.
#      3B legend); -5 to 5 mm for the mean profiles of Figs. 5B and 6B (legends, Results 3.2).
# (F7) Tests. Two-sided Student's t-tests, with Bonferroni correction where several comparisons are
#      made, or ANOVA, at p < 0.05. Groups are different wells, so t-tests are unpaired and
#      equal-variance (Student's); Welch's form is a variant only. Slopes are tested by the
#      two-sided one-sample t test of the regression slope (Fig. 4C, 6D and 7 legends).
# (F8) The paper's reading of its graphs. "A gap exceeding the length of the error bars indicates a
#      significant difference at p<0.05" (Methods 2.5, citing Cumming et al. 2007). Where the paper
#      states a difference from a graph without a test, it is judged by this rule on mean +/- s.e.,
#      and the t-test of F7 is reported.
# (F9) Near electrodes is 6 and 7 mm from the centre toward an electrode (Results 3.1, Fig. 4B).
# (F10) Fields from the paper's simulation, not from the data. 7.2 kV on one electrode gives 3.3
#      kV/cm at the centre, 9.4 and 13.5 kV/cm at 6 and 7 mm toward it (Methods 2.2).
#
# Details the paper leaves open, with the readings it allows. A criterion that uses one says so. For
# an expected value, the claim holds when it matches under any combination of readings (the paper
# reports one number for a choice it leaves open). For a test, the outcome is the one all readings
# give; when they differ, the author adopts the reading the paper best supports, as an assumption,
# or blocks the claim as methods_underspecified, with every result shown. Claims of absence are
# judged on the one test each names.
# (O1) ROI positions along a diagonal are not given; the text names only whole-mm distances (0, 2,
#      4, 5, 6, 7 mm). Positions are taken from the dataset when it holds them; otherwise readings
#      (a) ROIs centred at whole-mm distances, 0 to 7 mm each way; (b) contiguous ROIs from the
#      centre outward, one ROI length per step. Which side of the ROI (325 or 406 um) lies along the
#      diagonal is not given; 406 um along the diagonal is a standard choice that moves a centre by
#      under 0.05 mm. Which footprint holds the background ROIs is not given; any one, a standard
#      choice.
# (O2) Pooling of diagonals. Readings (a) the two diagonals averaged at each signed distance (the
#      profiles run from -x to x in Figs. 3B, 5B, 6B); (b) all four half-diagonals averaged at each
#      distance (Fig. 4A legend, "measurements in 4 diagonal directions from the center were pooled"),
#      mirrored to -x for fitting.
# (O3) Fit range of per-experiment fits where no figure fixes it. Methods say "limited to 4-6 mm".
#      For Fig. 6D ("as described in 3.1") readings (a) -4 to 4 mm, (b) -5 to 5 mm (Fig. 6B
#      legend); for Fig. 7 readings (a) 4, (b) 5, (c) 6 mm half-widths.
# (O4) Points of a regression. Fig. 4C fits individual experiments (n = 15 for fitting). Figs. 6D
#      and 7 do not say; readings (a) individual experiments, the one Fig. 4C supports, (b) group
#      means.
# (O5) Which near-electrode distance and which ratio give the reported centre to near-electrode
#      ratios. Readings (a) 6 mm, (b) 7 mm (F9); (i) the ratio of group means, (ii) the mean of
#      per-experiment ratios.
schema_version: 2
paper: doi:10.1016/j.bioelechem.2025.109016
claims:
- id: fig1e-field-simulation
  statement: In the simulation, 7.2 kV on one electrode gives 3.3 kV/cm in the centre of the array and
    9.4 and 13.5 kV/cm at 6 and 7 mm from the centre toward the active electrode.
  source: Methods 2.2, paragraph 4; Figure 1E
  quote: Specifically, 7.2 kV applied to one electrode produced the electric field of 3.3 kV/cm in the
    center, and 9.4 and 13.5 kV/cm at 6 and 7 mm from the center towards the active electrode,
    respectively
  datasets:
  - "001047"
  - "001276"
  - "001277"
  - "001284"
  expected:
  - quantity: field at the centre, 7.2 kV on one electrode
    value: 3.3
    tolerance: 0.33
    unit: kV/cm
  - quantity: field at 6 mm toward the active electrode
    value: 9.4
    tolerance: 0.94
    unit: kV/cm
  - quantity: field at 7 mm toward the active electrode
    value: 13.5
    tolerance: 1.35
    unit: kV/cm
  criterion: The values are outputs of the paper's Sim4Life Lite model (Methods 2.2, built as in its
    references 16 and 18), which the paper does not deposit. The claim is tested only if a dataset
    holds the simulated field maps; a field model built by the author is not the paper's and is not
    a test. With the maps (1 kV on one electrode, scaled linearly to 7.2 kV as Methods 2.2 says),
    reproduced when the three values are within tolerance along the diagonal from the active
    electrode. Without them, blocked as data_missing.
- id: fig2-heating-below-44c
  statement: With packets at the maximum rate, heating followed the field and was largest near the
    electrodes; after 2 bursts it was confined to about 2 mm next to the electrodes and could exceed
    30 C but not 44 C; after 6 bursts it spread further, exceeding 30 C even near the centre, yet
    never exceeded 44 C.
  source: Methods 2.3, paragraph 1; Figure 2
  quote: With 2 bursts ( Fig. 2A ), heating was restricted to an approximately 2-mm zone next to
    electrodes, where it could reach over 30 °C but did not exceed 44 °C. With 6 bursts ( Fig. 2B ),
    heating was more widespread ... Temperature could exceed 30 °C even near the center of the
    array, but did not exceed 44 °C even near the electrodes.
  datasets:
  - "001047"
  - "001276"
  - "001277"
  - "001284"
  criterion: Set S5, film frames at the end of the 2nd and 6th burst (Methods 2.3). Temperature classes
    from the calibrated colour transitions, black to red, green, blue and back to black at 25, 26, 30
    and 44 C (Methods 2.3). The hue limits of the colours are not given; readings (a) red below 45,
    green 75 to 165, blue 180 to 270 degrees of hue, (b) red below 30, green 90 to 150, blue 195 to
    255 degrees, with black any pixel of HSV value below 0.2 (standard choices). Above 30 C is blue;
    above 44 C is black after blue, a dark pixel enclosed by a blue region outside the electrode
    footprints (dashed circles, Fig. 2 legend). "Near the center" is not given as a distance;
    readings (a) within 1 mm, (b) within 2 mm of the centre. Reproduced when, under every reading,
    the 2-burst image has blue pixels only within 2.2 mm of an electrode edge ("approximately 2-mm",
    widened by 10%), the 6-burst image has blue pixels near the centre, and neither image has a dark
    pixel enclosed by blue. Blocked as data_missing when no dataset holds the film images.
- id: fig3a-centre-enhanced
  statement: Every CANCAN protocol enhanced electroporation at the array centre, while in the control
    (a single unipolar pulse per packet) YP uptake decreased gradually toward the centre.
  source: Results 3.1, paragraph 2; Figure 3A
  quote: All CANCAN protocols visibly enhanced electroporation at the center of the array, in
    contrast to its gradual decrease toward the center in the control ( Fig. 3A ).
  datasets:
  - "001047"
  criterion: Set S1, diagonal profiles by F1 to F3, under O1 and O2. The field at the centre is the
    same in CANCAN and control (Methods 2.2), so enhanced at the centre is read as a central peak.
    For each CANCAN rate, mean YP at x = 0 exceeds mean YP at 4 mm (the edge of the Fig. 3B fit
    range) by a gap larger than the error bars (F8). For the control, mean YP at x = 0 is below the
    means at 4, 6 and 7 mm by such a gap. Reproduced when both hold for every rate under every
    reading; YP at 6 and 7 mm against x = 0 for each CANCAN rate is reported and judged in
    fig4b-near-electrode-decline. The t-tests of F7 are reported.
- id: fig3bc-rate-suppresses-off-target
  statement: Raising the packet rate from 1 Hz to 0.2 MHz suppressed electroporation better both near
    the electrodes (diagonal profile) and at the perimeter between electrodes (profile parallel to
    the sides).
  source: Results 3.1, paragraph 2; Figure 3B, 3C
  quote: The most conspicuous effect of increasing the packet rate from 1 Hz to 0.208333 MHz
    (abbreviated to 0.2 MHz below and in figure legends) was better suppression of electroporation
    both near electrodes ( Fig. 3B ) and at the perimeter between electrodes ( Fig. 3C ).
  datasets:
  - "001047"
  criterion: Set S1, F1 to F3, F8, F9, O1, O2. Near electrodes is YP at 6 and 7 mm on the diagonals.
    The perimeter between electrodes is the end of the parallel profile, which meets the side of the
    square about 6.4 mm from the centre (half the 12.8-mm side between electrode centres, from the
    15.3-mm diagonal and 2.8-mm needles of Methods 2.2); readings (a) the outermost parallel ROIs,
    (b) the parallel ROIs at 6 mm. Reproduced when, under every reading, mean YP at 0.2 MHz is below
    that at 1 Hz by a gap larger than the error bars (F8) at 6 mm, at 7 mm and at the perimeter; the
    two-sided t-tests (F7) are reported. The perimeter part is blocked as data_missing when the
    dataset has no parallel measurements.
- id: fig3-lorentzian-profile
  statement: The decline of YP emission from the centre was bell-shaped and fitted a Lorentzian
    function over -4 to 4 mm nearly perfectly (R > 0.9, p < 0.001) for every packet rate.
  source: Results 3.1, paragraph 3; Figure 3B, 3C legend; Methods 2.5
  quote: The fit correlation with data in the −4 to 4 mm radius was nearly perfect (R>0.9, p<0.001).
  datasets:
  - "001047"
  statistics:
  - about: correlation of the Lorentzian fit with the data, -4 to 4 mm
    statistic: R > 0.9
    p: 0.001
    p_relation: "<"
  - about: significance of each YP fit in Figures 3, 5 and 6 (Methods 2.5)
    p: 0.0001
    p_relation: "<"
  expected:
    quantity: correlation of fitted and measured mean YP, -4 to 4 mm, each rate and direction
    value: 0.9
    tolerance: 0
  criterion: Set S1, CANCAN rates, F1 to F4, F6, O1, O2. The Lorentzian is fitted to the mean
    diagonal profile over -4 to 4 mm (the dotted fits of Fig. 3B, drawn on mean +/- s.e.), and to the
    mean parallel profile where present (Fig. 3C). How R is computed is not given; readings (a) the
    Pearson correlation of fitted and measured values over the fitted points, with its t test; (b)
    the square root of R2 = 1 - SSres/SStot, with the F test of the fit. Reproduced when R exceeds
    0.9 with p < 0.001 for every rate and direction under every reading; 0.9 is the paper's bound,
    so the tolerance is zero.
- id: fig3-tail-deviation-falls-with-rate
  statement: Beyond the fitted range, the data deviated from the Lorentzian fit less as the packet
    rate increased.
  source: Results 3.1, paragraph 3; Figure 3B, 3C
  quote: The deviation of experimental data from the fits at larger distances from the center
    diminished with increasing the packet repetition rate, highlighting better suppression of the
    off-target electroporation.
  datasets:
  - "001047"
  depends_on:
  - fig3-lorentzian-profile
  criterion: Set S1, the fits of fig3-lorentzian-profile extended to all distances (Fig. 3B legend,
    the plots were extended to the x-axis limits). The paper gives no measure or test of the
    deviation. The measure is the mean of (data - fit) over the ROIs beyond 4 mm; its units are not
    given, readings (a) a.u., (b) percent of the fitted peak a. Reproduced when, under every
    reading and in both directions, the deviation is largest at 1 Hz and smallest at 0.2 MHz, and
    its Spearman correlation with rate over the tested rates is negative (a standard measure of a
    monotone trend, as the paper names none). The value for every rate is reported.
- id: fig4b-40-fold-ratio
  statement: At 0.2 MHz, YP uptake at the centre was 40 times that near the electrodes, despite the
    field there being about 4 times weaker (3.3 against about 14 kV/cm).
  source: Results 3.1, paragraph 2; Figure 4A, 4B; Abstract
  quote: Now, by increasing the packet repetition rate to 0.2 MHz, we achieved a 40-fold difference (
    Fig. 4B ), despite using a bigger array with larger reduction of the electric field from
    electrodes to the center.
  datasets:
  - "001047"
  expected:
    quantity: ratio of centre YP to near-electrode YP, CT26, 2 bursts (x4), 0.2 MHz
    value: 40
    tolerance: 4
  criterion: Set S1 at 0.2 MHz, F1 to F3, F9, O2, O5. Background-subtracted YP at x = 0 over YP at
    the near-electrode distance. Reproduced when the ratio is within 36 to 44 under one combination
    of the readings of O2 and O5; every combination is shown. The fields are from the simulation
    (F10) and are not tested here.
- id: fig4b-centre-no-rate-effect
  statement: YP uptake at the array centre showed no significant effect of packet rate.
  source: Results 3.1, paragraph 4; Figure 4B
  quote: YP intensity in the center showed no significant effect of the packet rate ( t -test with
    Bonferroni correction, Fig. 4B ).
  datasets:
  - "001047"
  criterion: A claim of absence, judged on the paper's test. Set S1, CANCAN rates, F1 to F3, O2;
    per experiment the background-subtracted YP at x = 0. Two-sided Student's t-tests with
    Bonferroni correction (F7). The comparisons are not named here; the test is each rate against 1
    Hz, the family the Fig. 4C legend uses on the same experiments, with Bonferroni over the number
    of rates compared with 1 Hz. Reproduced when no corrected comparison has p < 0.05; not
    reproduced when any does. Group means and the largest ratio between rates are reported either
    way; all pairs of rates are shown as a variant.
- id: fig4b-near-electrode-decline
  statement: In contrast to the centre, YP uptake at 6 and 7 mm from the centre (1.65 and 0.65 mm from
    the electrodes) declined steeply as the packet rate increased.
  source: Results 3.1, paragraph 4; Figure 4B
  quote: It contrasted with a steep, packet rate-dependent decline of YP uptake at 6 and 7 mm from
    the center (i.e., 1.65 and 0.65 mm from electrodes).
  datasets:
  - "001047"
  criterion: Set S1, CANCAN rates, F1 to F3, O2. At 6 mm and at 7 mm, a power function YP = c rate^k
    is fitted to YP against packet rate by least squares (Fig. 4B legend, "best fits using power
    function"; Methods 2.5). Whether the fit uses the plotted means or the individual experiments is
    not given; readings (a) group means, (b) per-experiment values. Reproduced when, under every
    reading, k < 0 at both distances and mean YP at 0.2 MHz is below that at 1 Hz by a gap larger
    than the error bars (F8) at both; the two-sided t-tests (F7) are reported.
- id: fig4c-fwhm-falls-with-rate
  statement: Higher packet rates focused electroporation into a smaller spot; the FWHM fell from about
    4 mm at 1 Hz to about 2 mm at 1 kHz, 10 kHz and 0.2 MHz (p = 0.03, 0.02 and 0.09 against 1 Hz),
    and could be under 15% of the gap between electrodes.
  source: Results 3.1, paragraphs 5 and 6; Figure 4C
  quote: FWHM decreased from ~4 mm at 1 Hz to ~2 mm at 1 kHz, 10 kHz, and 0.2 MHz packet rates (p =
    0.03; 0.02, and 0.09, respectively; t -test with Bonferroni correction).
  datasets:
  - "001047"
  statistics:
  - about: 1 kHz against 1 Hz
    test: t-test with Bonferroni correction
    p: 0.03
    corrected: Bonferroni
    n: 3 experiments per rate
  - about: 10 kHz against 1 Hz
    test: t-test with Bonferroni correction
    p: 0.02
    corrected: Bonferroni
    n: 3 experiments per rate
  - about: 0.2 MHz against 1 Hz
    test: t-test with Bonferroni correction
    p: 0.09
    corrected: Bonferroni
    n: 3 experiments per rate
  expected:
  - quantity: mean FWHM at 1 Hz
    value: 4
    tolerance: 0.4
    unit: mm
  - quantity: mean FWHM at 1 kHz
    value: 2
    tolerance: 0.2
    unit: mm
  - quantity: mean FWHM at 10 kHz
    value: 2
    tolerance: 0.2
    unit: mm
  - quantity: mean FWHM at 0.2 MHz
    value: 2
    tolerance: 0.2
    unit: mm
  criterion: Set S1, CANCAN rates, F1 to F7, O1, O2. Per experiment, the Lorentzian fitted over -4 to
