  criterion: >-
    From the Methods, the Figure 4D and S4E legends, S1_Gaze_Time_Epoch.m and
    S3_Gaze_Correlation_by_Epoch.m. The real statistic is the median over days of the late minus
    early slope (S3_Gaze_Correlation_by_Epoch.m). Null, from the Methods: within each day the
    90 stimulation trials are permuted 1,000 times and split into the first 45 and the next 45,
    slopes refitted, and for each permutation the median over days of the slope difference is
    taken. The repository does not build this null: S3_Gaze_Correlation_by_Epoch.m loads a
    precomputed Decomp_Temporal_shuffled file whose causal strength field is named
    causal_m1m2_eyes_null, so whether the null also uses causal strengths from a null
    decomposition is open; the Methods construction above, with the real causal strengths
    carried with their trials, is used. The p-value computation is not in the repository; the readings are (a) one-sided in
    the direction of the real median, the fraction of null medians beyond it, as the code
    computes the permutation p of Fig. 5G (S6_Gaze_Saccade_Kinematics_Combined.m), (b)
    two-sided, twice that fraction. Reproduced when dmPFC contralateral gives p < 0.05 with a
    positive real median and the both-hemifields and ipsilateral tests give p >= 0.05; the
    outcome follows the rule for several readings, and per-monkey values are reported. (The
    Figure S4F legend prints a "* p < 0.05" key while the Results give p = 0.455; the Results
    value is used.)
