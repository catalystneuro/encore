- id: fig2a-density-map-ofc
  statement: After OFC microstimulations, compared with shams, the stimulated monkey's fixations in
    the 1.5 s post-gaze epoch were more clustered around the partner monkey.
  source: Results, Closed-loop microstimulations of OFC facilitate momentary social attention in
    the spatial dimension, paragraph 2; Figure 2A
  quote: Specifically, microstimulations of OFC led to more clustered subsequent gaze fixations
    around the partner monkey (Fig. 2A
  criterion: >-
    From the Methods (Fixation density map): fixations of the post-gaze epoch assigned to 1-degree
    squares of a 40 by 40 degree grid centred on the partner's Eyes ROI, counts summed per day for
    stimulation and for sham trials, the stimulation minus sham difference averaged over days
    per area, monkey T's maps flipped horizontally. The normalisation is given two ways, and
    both are run: (1) the Methods, each day's maps z-scored over grid squares before the
    difference; (2) the code (S1_Gaze_Fixation_Heatmap.m), the difference divided by the day's
    total count of stimulation and sham fixations. The paper reads the map by eye and gives no
    measure of "more clustered"; the readings named are (a) the averaged difference summed over
    squares inside the whole Face ROI is positive, and (b) the same inside the Eyes ROI. The
    claim is reproduced when the OFC map is positive under every reading and normalisation, not
    reproduced when it is negative under all, and blocked as methods_underspecified when they
    differ. dmPFC and ACCg values are reported alongside.
