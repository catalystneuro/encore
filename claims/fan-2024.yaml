# Claims for Fan, Dal Monte, Nair, Fagan & Chang (2024) on dandiset 000959.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-22,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the accepted author manuscript in PubMed Central (PMC11309918, NIHMS1994226),
# main text, figure legends and STAR Methods, with its one supplement
# (NIHMS1994226-supplement-1.pdf, Table S1 and the legends of Figures S1 to S4). The version of
# record (Neuron 112(15) 2631-2644.e6) was not read. The Results point to "Supplementary
# Results" for the Mouth stimulation experiments and the post-gaze window; the supplement holds
# no such section, and these results are given in the STAR Methods of the manuscript
# ("Gaze distance analyses" and "Gaze distance analyses (Mouth stimulation)"), which were read.
#
# Code read: github.com/changlabneuro/microstim-ofc-social-attention, commit cc0bf994 (2024-10-15),
# the analysis code named in Data and code availability (also Zenodo doi:10.5281/zenodo.11110139).
# It holds MATLAB scripts for every analysis of the paper ("Scripts for social attention":
# Get data, Overall gaze behavior and number of stims, Heatmap, Spatial dimension, Temporal
# dimension, Inter-individual dynamics, Saccade kinematics) and older scripts (stim/, script/).
# It starts from intermediate files (fixation events, ROIs, positions, stimulation and sham
# times) made by an upstream pipeline that is not in the repository, and it calls functions
# of outside packages (bfw, shared_utils, dsp3). The causal decomposition itself was run
# outside the repository; only its output folder name is given
# (cd_output_null_02_1000_150_100_10). The repository also holds zipped processed data folders;
# these were not opened.
#
# Data the paper used. Two male rhesus macaques were stimulated (M1, monkey L, "Lynch" in the
# code, chamber on the left; monkey T, "Tarantino", chamber on the right); one female, monkey E,
# was the partner (M2) of both. Eyes stimulation experiments: 27 days per stimulated area (OFC,
# dmPFC, ACCg), 15 per area from monkey L and 12 from monkey T, 81 days in all; the code lists
# the days by date. Each day alternated live social gaze sessions (about 10 for L, 9 to 11; about
# 15 for T, 14 to 15) and non-social control sessions with a random dot motion (RDM) stimulus in
# front of M2's face (about 5; 4 to 8 for L, 5 for T), 300 s each with 180 s breaks. Mouth
# stimulation control experiments: 5 days per area from monkey T. Gaze positions and pupil
# size of both monkeys at 1000 Hz (EyeLink 1000); in control sessions M2's gaze is not usable.
# Each trial is a microstimulation (75 uA, 100 Hz, 200 ms) or a sham, triggered with
# probability 0.5 by an online fixation (150 ms window, dispersion below 1 degree) in the Eyes
# ROI (or the RDM ROI, or the Mouth ROI), trials at least 5 s apart, two stimulations and two
# shams in every four. Variables used: stimulation and sham times and labels, M1 and M2 gaze
# positions, fixations (EyeMMV, t1 = 1.18 and t2 = 0.59 degrees, minimum 70 ms), the Eyes,
# Face, Mouth and RDM ROIs per day, gaze events labelled M1-only, M2-only or mutual, pupil
# size, saccades. Raw neural signals and multi-unit activity were recorded (Fig. 1D) but no
# finding below rests on them.
#
# Method choices fixed here from the code where the Methods are silent, for every claim that
# uses trials. A trial is kept when its time lies within the run and more than 5 s before the
# run's last sample; the first trial of each run is dropped (the code labels each trial by the
# one before it). Trials are grouped by their own type (stimulation or sham). The post-gaze
# epoch takes the fixations whose start time lies in [0, 1.5) s after the trial time. A
# fixation's position is the mean of its gaze samples; its social gaze distance is the
# Euclidean distance from that position to the centre of the partner's Eyes ROI (the RDM ROI in
# control sessions). A trial's distance is the mean over its fixations; a day's value is the
# mean over its trials of a type, ignoring trials with no fixation. Which fixations enter the
# distance: the Methods say "all M1's fixations"; the code (S3_Basic_Gaze_Matrices_Combined.m,
# m1_all, built in S1_Get_data_gaze_Lynch.m) takes only events labelled looks_by m1, which
# it calls "exclusive m1 events", and leaves out M1 fixations labelled mutual. The Methods
# reading (M1-only and mutual events) is the main one and the code's (M1-only events) is a
# variant, shown for every distance claim. A fixation is contralateral
# or ipsilateral by the side of the mean horizontal gaze position of its event relative to the
# centre of the whole Face ROI of M2's calibration (center_roi_m2_face in S1_Get_data_gaze_Lynch.m
# and _Tarantino.m: M2's Face ROI, which is M1's own face, mirrored into M1's coordinates with
# the m2_to_m1 offset; this is not the centre of the partner's face, center_roi_m1_face):
# for monkey L (left chamber) left of centre is
# ipsilateral, for monkey T (right chamber) right of centre is ipsilateral. Day-level
# comparisons are two-sided Wilcoxon signed-rank tests over days; trial-level comparisons are
# two-sided Wilcoxon rank-sum tests over the trials of all days of an area pooled. "Both
# monkeys combined" is all 27 days of an area. Distances in the code are in pixels, converted
# to degrees for plots with h = 27 cm, d = 50 cm and 768 pixels (the Methods give 36 cm to the
# middle monitor); rank tests do not depend on that scale.
#
# Details open in the paper and the code, named in the claims that need them: the padding of
# the Eyes ROI (the Methods text reads "adding a padding of to the center of each eye", the
# number is missing), the smoothing used to fill gaps before the causal decomposition and the
# decomposition's settings, the side of the permutation test for the slope difference, the
# bootstrap p-value of the Mouth comparison, and how the "diff" values and the 41% and 86%
# figures are averaged.
