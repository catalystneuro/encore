  criterion: Human induction recordings only. RA-APs are the APs of the continuous recording after
    induction, classed by readings (a) to (c) of the header. Per the Methods, an RAF epoch's
    duration runs from its first to its last RA-AP, its frequency is RA-APs over duration, and an
