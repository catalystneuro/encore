    window ends is not given; readings are at the threshold and at the AP peak. APs are pooled
    across cells (the paper gives no n, and P < 0.001 is not reachable with 6 or 7 cells); per-cell
    medians are a variant. Reproduced when AIS-APs are higher with Mann-Whitney P < 0.001 and both
    medians are within tolerance under one reading; partially reproduced when the test holds alone.
- id: fig3i-rat-lfp-rhythm
  statement: In active rat slices, layer 5 LFP shows rhythmic low-frequency deflections at 1.1 Hz,
    synchronized to up states of the layer 1 interneurons.
  source: Results, paragraph 3; Figure 3H and 3I
  quote: In rat slices, somatic recordings in layer 1 interneurons ( n = 40) were accompanied by
    layer 5 local field potential (LFP) recordings revealing rhythmic low-frequency (1.1 ± 0.55 Hz)
    LFP deflections synchronized to single-cell up states
  expected:
    quantity: median LFP deflection frequency
    value: 1.1
    tolerance: 0.11
    unit: Hz
  criterion: How the deflection frequency is measured is not given. Readings are (i) the peak of the
    LFP power spectrum in 0.5 to 4 Hz per recording; (ii) the rate of LFP troughs found on the 0.5
    to 4 Hz Butterworth-filtered trace (the Methods' filter). The median over recordings is
    compared. Reproduced when one reading is within tolerance.
- id: fig3l-rat-spontaneous-ra-proportion
  statement: In active rat slices, 13 of 40 layer 1 interneurons fire spontaneous RA-APs, and all
    recovered ones (n = 5) are NGFCs.
  source: Results, paragraph 3; Figure 3L
  quote: Spontaneous RA-APs were observed in 13 interneurons (all recovered cells were NGFCs, n = 5).
  expected:
    quantity: rat active-slice cells with spontaneous RA-APs
    value: 13
    tolerance: 1.3
  criterion: Rat active-slice recordings with LFP, APs classed by readings (a) or (b) of the header.
    The morphology of the recovered cells is reported if the dandiset records it.
- id: fig3k-rat-pre-ap-fluctuation
  statement: In active rat slices, AIS-APs occur during up states with larger membrane potential
    fluctuations before them, and RA-APs during down states with smaller ones.
  source: Results, paragraph 3; Figure 3J and 3K
  quote: AIS-APs and RA-APs of rat interneurons were detected with different threshold potentials
    and pre-AP slopes and occurred during up and down states with higher and lower membrane
    potential fluctuations, respectively
  statistics:
  - test: Mann-Whitney test
    p: 0.001
    p_relation: <
  depends_on:
  - fig3l-rat-spontaneous-ra-proportion
  criterion: As in fig3f-human-pre-ap-fluctuation, on the rat active-slice recordings. Reproduced
    when the AIS-AP SD is higher with Mann-Whitney P < 0.001 under one reading.
- id: fig3m-rat-ais-phase-coupling
  statement: In active rat slices, AIS-APs are coupled near the trough of the slow LFP oscillation
    (mean vector length 0.093, angle 314 degrees).
  source: Results, paragraph 3; Figure 3M
  quote: 'we found temporal coupling of AIS-APs to near the trough of slow oscillation (average
    vector length: 0.093, angle: 314°, P < 0.001, Rayleigh test)'
  statistics:
  - test: Rayleigh test
    p: 0.001
    p_relation: <
    n: 534 AIS-APs from 22 cells
  expected:
  - quantity: mean vector length, AIS-APs
    value: 0.093
    tolerance: 0.0093
  - quantity: mean phase, AIS-APs
    value: 314
    tolerance: 31.4
    unit: degrees
  criterion: The phase method of the header, on the rat active-slice recordings with LFP; APs
    pooled across cells. Which 22 cells form the population (all with both AP types, or all with
    usable LFP) and whether 534 counts the APs before or after the delta power selection is not
    said; the counts are reported under each. A 10% tolerance on an angle has no meaning near 0, so
    the angle is within tolerance when it is within 31.4 degrees of 314 on the circle. Reproduced
    when the Rayleigh test gives P < 0.001 and the mean phase is within tolerance; the vector
    length is reported and judged within tolerance as well.
- id: fig3m-rat-ra-no-phase
  statement: In active rat slices, RA-APs show no phase preference to the slow LFP oscillation.
  source: Results, paragraph 3; Figure 3M
  quote: RA-APs showed no phase preference to network oscillations ( P = 0.07, Rayleigh test; Fig.
    3M )
  statistics:
  - test: Rayleigh test
    p: 0.071
    n: 76 RA-APs from 22 cells
  depends_on:
  - fig3m-rat-ais-phase-coupling
  criterion: A claim of absence, judged on the paper's Rayleigh test at P < 0.05 on the RA-APs
    pooled, phases as in fig3m-rat-ais-phase-coupling. Reproduced when P >= 0.05; not reproduced
    when P < 0.05. The mean vector length, angle and count of RA-APs are reported either way.
- id: figs3-no-modulators
  statement: In rat slices in in vivo-like ACSF without carbachol and SCH23390 (n = 90), elevated
    network activity with low-frequency up states (0.11 Hz) appears and layer 1 interneurons fire
    spontaneous RA-APs (4 NGFCs and 5 non-NGFCs).
  source: Results, paragraph 3; Figure S3A to S3C
  quote: Recordings from interneurons ( n = 90) in slices maintained without external cholinergic
    and dopaminergic modulators provided similar results (fig. S3).
  expected:
  - quantity: up state frequency on the LFP
    value: 0.11
    tolerance: 0.011
    unit: Hz
  - quantity: cells with spontaneous RA-APs
    value: 9
    tolerance: 0.9
  criterion: Rat slices without modulators. Up state frequency by the readings of
    fig3i-rat-lfp-rhythm, in 0.05 to 4 Hz since 0.11 Hz is below the Methods' delta band (an
    extension made here, the legend giving no method). Cells with RA-APs by readings (a) or (b) of
    the header; 9 is the sum of the NGFC and non-NGFC counts of Figure S3C, which may count only
    recovered cells, so the total count is reported as well. Reproduced when both values are within
    tolerance under one reading; partially reproduced when RA-APs occur but a value is outside.
- id: fig4b-invivo-ra-proportion
  statement: In vivo, 75 of 242 (31%) mouse layer 1 interneurons fire spontaneous APs from
    relatively hyperpolarized potentials, identified as RA-APs.
  source: Results, paragraph 4; Figure 4B
  quote: However, in 75 (31%) of the 242 recorded cells, we detected spontaneously occurring APs
    rising from relatively hyperpolarized membrane potential
  expected:
    quantity: fraction of in vivo cells with RA-APs
    value: 0.31
    tolerance: 0.031
  criterion: In vivo recordings, APs classed by readings (a) or (b) of the header; a cell has RAF
    when it has at least one RA-AP. The counts are reported.
- id: fig4i-invivo-frequencies
  statement: In vivo layer 1 interneurons fire sporadically, with AIS-APs at 0.65 Hz and RA-APs at
    0.004 Hz, AIS-APs being more frequent.
  source: Results, paragraph 4; Figure 4I
  quote: Overall, layer 1 interneurons fired sporadically (frequency of AIS-APs, 0.65 ± 2.4 Hz;
    RA-APs, 0.004 ± 0.4 Hz; Mann-Whitney U test, P < 0.001)
  statistics:
  - test: Mann-Whitney U test
    p: 0.001
    p_relation: <
    n: 242 cells
  expected:
  - quantity: median AIS-AP frequency
    value: 0.65
    tolerance: 0.065
    unit: Hz
  - quantity: median RA-AP frequency
    value: 0.004
    tolerance: 0.0004
    unit: Hz
  depends_on:
  - fig4b-invivo-ra-proportion
  criterion: Per cell, APs of each class over the recording duration. A median RA-AP frequency
    above 0 means the median is not taken over all 242 cells (162 have none); readings are (i) all
    242 cells; (ii) cells with RA-APs for the RA-AP value and all cells for the AIS-AP value; (iii)
    cells with any APs. Reproduced when, under one reading, both medians are within tolerance and
    AIS-APs are higher with Mann-Whitney P < 0.001; partially reproduced when the test holds alone.
- id: fig4g-invivo-ra-share
  statement: RA-APs make up 3.4% of all APs recorded in vivo; the RA-AP share ranges from 0 (162
    cells) to 100% (6 cells), and averages 17% in the 75 cells with RAF.
  source: Results, paragraph 4; Figure 4G and 4H
  quote: the proportion of RA-APs represented 3.4% of all in vivo recorded APs in layer 1
    interneurons. The ratio of RA-APs varied considerably in individual cells from 0 ( n = 162
    cells) to 100% ( n = 6 cells), and the average contribution of RA-APs in interneurons with RAF
    ( n = 75) was 17 ± 30%.
  expected:
  - quantity: RA-APs as a share of all in vivo APs
    value: 3.4
    tolerance: 0.34
    unit: '%'
  - quantity: cells with no RA-APs
    value: 162
    tolerance: 16.2
  - quantity: cells with only RA-APs
    value: 6
    tolerance: 0.6
  - quantity: average RA-AP share in cells with RAF
    value: 17
    tolerance: 1.7
    unit: '%'
  depends_on:
  - fig4b-invivo-ra-proportion
  criterion: Classes as in fig4b-invivo-ra-proportion. 242 minus 75 is 167, not 162; one reading is
    that 5 cells fired no APs and have no ratio, the other that the counts come from different
    selections; the count of cells with no APs is reported. "Average" may be the mean or the median
    (the Statistics section); both are shown. Reproduced when, under one reading, at least three of
    the four values are within tolerance.
- id: fig4f-invivo-pre-ap-fluctuation
  statement: In vivo, membrane potential fluctuations (SD) 0 to 50 ms before AIS-APs are larger than
    before RA-APs.
  source: Figure 4F
  quote: ( F ) SD of membrane potential 0 to 50 ms before APs (Mann-Whitney test, P < 0.001).
  statistics:
  - test: Mann-Whitney test
    p: 0.001
    p_relation: <
  depends_on:
  - fig4b-invivo-ra-proportion
  criterion: As in fig3f-human-pre-ap-fluctuation, on the in vivo recordings. The direction is read
    from the Results, which say AIS-APs fire from up states with barrages of inputs. Reproduced
    when the AIS-AP SD is higher with Mann-Whitney P < 0.001 under one reading.
- id: fig4j-invivo-ais-phase-coupling
  statement: In vivo, AIS-APs are coupled to the trough of the slow (0.5 to 4 Hz) LFP oscillation
    (mean vector length 0.019, angle 330 degrees).
  source: Results, paragraph 4; Figure 4J
  quote: in vivo recorded AIS-APs were coupled to the trough (average vector length = 0.019, angle =
    330°; P < 0.001, Rayleigh test) of population LFP
  statistics:
  - test: Rayleigh test
    p: 0.001
    p_relation: <
  expected:
  - quantity: mean vector length, AIS-APs
    value: 0.019
    tolerance: 0.0019
  - quantity: mean phase, AIS-APs
    value: 330
    tolerance: 33
    unit: degrees
  depends_on:
  - fig4b-invivo-ra-proportion
  criterion: As in fig3m-rat-ais-phase-coupling, on the in vivo recordings, all cells with LFP and
    all states (awake and anesthetized) pooled, as the paper reports one population. Reproduced
    when the Rayleigh test gives P < 0.001 and the mean phase is within 33 degrees of 330 on the
    circle; the vector length is reported and judged within tolerance as well.
- id: fig4j-invivo-ra-no-phase
  statement: In vivo, RA-APs are not significantly coupled to any phase of the slow oscillation.
  source: Results, paragraph 4; Figure 4J
  quote: as opposed to RA-APs, which were not significantly coupled to any phase of the slow
    oscillation ( P = 0.15, Rayleigh test; Fig. 4J )
  statistics:
  - test: Rayleigh test
    p: 0.15
  depends_on:
  - fig4j-invivo-ais-phase-coupling
  criterion: A claim of absence, judged on the paper's Rayleigh test at P < 0.05 on the RA-APs
    pooled. Reproduced when P >= 0.05; not reproduced when P < 0.05. The mean vector, the angle and
    the count of RA-APs are reported either way.
- id: fig4-invivo-up-down-balance
  statement: In vivo, AIS-APs dominate during up states and RA-APs during down states, so the ratio
    of the two swings over the slow oscillation.
  source: Results, paragraph 4; Figure 4D and 4J
  quote: The ratio of AIS-APs and RA-APs swings during slow population oscillations with dominating
    AIS-APs and RA-APs in up states and down states, respectively.
  depends_on:
  - fig4j-invivo-ais-phase-coupling
  criterion: The paper reports no measure or test for this sentence. With the Methods' phase
    convention (trough 0 degrees is the up state, peak 180 degrees the down state), APs are split
    by phase; readings are (i) halves of the cycle, up from 270 to 90 degrees and down from 90 to
    270; (ii) quarters centred on 0 and 180 degrees. Reproduced when, under one reading, the share
    of RA-APs among the APs in the down part exceeds that in the up part and AIS-APs outnumber
    RA-APs in the up part. The paper's own test for two groups, here a Fisher exact test of the two
    shares, is reported as support, not judged, as the paper does not name one for this.
- id: figs4i-ais-ra-frequency-correlation
  statement: Across in vivo cells, AIS-AP and RA-AP frequencies are weakly positively correlated (R
    = 0.29).
  source: Figure S4I and S4J
  quote: (I) Frequency of AIS-APs and RA-APs (R=0.29, p<0.001)
  statistics:
  - test: correlation (type not named)
    statistic: R = 0.29
    p: 0.001
    p_relation: <
  expected:
    quantity: correlation of AIS-AP and RA-AP frequency
    value: 0.29
    tolerance: 0.029
  depends_on:
  - fig4i-invivo-frequencies
  criterion: Per-cell frequencies as in fig4i-invivo-frequencies. The correlation type and the cells
    used are not named; readings are Pearson and Spearman, over all 242 cells and over the 75 cells
    with RA-APs. Reproduced when, under one reading, R is within tolerance with P < 0.001;
    partially reproduced when R is positive with P < 0.05.
- id: figs5-not-genotype-or-anesthesia
  statement: RA-AP occurrence in vivo cannot be explained by mouse genotype or by anesthesia
    condition.
  source: Figure S5A to S5D
  quote: Fig. S5. RA-AP occurrence cannot be explained by genotype or anesthesia.
  depends_on:
  - fig4i-invivo-frequencies
  criterion: A claim of absence for which the paper names no test; it shows per-cell RA-AP and
    AIS-AP frequencies by genotype (GAD67-GFP, Ai9, C57BL/6J, vGAT-Ai9) and by condition (awake
    after isoflurane, awake after ketamine-xylazine, under chloral hydrate, under
    ketamine-xylazine). The paper's general rule names only two-group tests, so readings are (i)
    Mann-Whitney U tests between every pair of groups, Bonferroni corrected; (ii) a Kruskal-Wallis
    test across groups. Reproduced when neither reading finds a difference in RA-AP frequency at
    P < 0.05 for genotype or for condition; not reproduced when both do; otherwise the outcome
    rests on the reading. Group medians and the fraction of cells with RA-APs per group are
    reported. Needs genotype and condition per cell from the dandiset's metadata.
