# Claims for Rozsa, Toth, Olah, Baka, Lakovics, Barzo & Tamas (2023), Sci. Adv. 9, eade4511, on
# dandiset 000341.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-19,
# protocol pilot-16 as stated in docs/protocol.md. The writer did not look at the dandiset's data or
# files; only its title and the species it lists (human, rat, mouse) were read.
#
# Text read: the version of record (open access), full text as served by Europe PMC (PMC10569705,
# JATS XML flattened), with its one supplement, sciadv.ade4511_sm.pdf (Figures S1 to S6 with legends,
# Table S1). The main figures were not available as images; their values were read from the Results
# and the legends. The reference list is not in the text read, so the cited sources for the sag
# fraction (ref. 28) and for the cellular state definition (ref. 38) could not be read.
#
# Code read: none. The paper links no code; the Methods say the data were analysed with Fitmaster
# (HEKA) and custom MATLAB scripts, and phases with the MATLAB Circular Statistics Toolbox (ref. 49).
#
# Data the paper used. All recordings are somatic whole-cell current clamp of layer 1 interneurons,
# filtered at 10 kHz (Bessel) and sampled at 50 kHz in Patchmaster.
# - Human slices: neocortex resected from 71 patients (41 female, 30 male, 50 +- 20 years; Table S1),
#   frontal, temporal, occipital and parietal. Rat slices: somatosensory cortex of Wistar rats, P18
#   to P44. About 36 degrees C, conventional or dual-superfusion chamber.
# - RAF induction (Figures 1, S1): 100 ms suprathreshold square pulses (50 to 500 pA, at least four
#   APs per pulse) every 300 ms, stopped when APs appear between pulses, then continuous recording.
#   Human 385 cells (87 with RAF), rat 259 cells (102 with RAF). Post hoc biocytin morphology: NGFC,
#   non-NGFC, rosehip.
# - Dual soma and axonal bleb recordings (Figures 1H-K, 2F-H, S6): human 2 NGFCs and 3 unidentified,
#   rat 3 NGFCs and 3 unidentified; hyperpolarizing steps alternately in soma and bleb, depolarizing
#   steps in soma only.
# - ZD7288 30 uM (Figures 2A-C, S2): human 4 and rat 3 cells. Sag fraction (Figure 2E): human 358,
#   rat 254 cells. Local puff of ACSF with 5 mM KCl (Figure 2I-L): human 4, rat 7 cells.
# - Active slices (Figure 3): in vivo-like ACSF (1.2 mM Ca, 1 mM Mg), dual superfusion, 2 uM
#   carbachol and 10 uM SCH23390. Human 26 cells without LFP; rat 40 cells with a layer 5 LFP. Rat
#   without carbachol and SCH23390, 90 cells (Figure S3).
# - In vivo (Figure 4, S4, S5): head-fixed mice, P35 to P180, GAD67-GFP (37), Ai9 (5), C57BL/6J (3)
#   and vGAT-Ai9 (75), awake or under chloral hydrate or ketamine-xylazine; 242 layer 1 interneurons
#   at 20 to 120 um depth with a deep layer LFP within about 1000 um.
#
# Method shared by the claims, from the Methods ("Analysis of RAF patterns", "Analysis of AP timing
# related to network oscillations", "Statistics"):
# - APs detected on unfiltered traces; the threshold is the point where dV/dt first exceeds 5 mV/ms;
#   the pre-AP ramp slope is the slope of a linear fit to the last 1 ms before threshold. Threshold
#   and slope separate AIS-APs (higher threshold, steeper ramp) from RA-APs.
# - An RAF epoch is sporadic when its RAF frequency is below 5 Hz and persistent (tonic) above;
#   number of RA-APs, RAF duration (first to last RA-AP in the continuous recording), RAF frequency
#   (RA-APs over duration).
# - Phase: a 4 s AP-triggered LFP segment per AP, FFT power multiplied by frequency; an AP is kept
#   when the corrected power in 0.5 to 4 Hz over that in 0.5 to 45 Hz exceeds 0.1. The LFP is
#   Butterworth band-passed 0.5 to 4 Hz, Hilbert phase on 0 to 360 degrees with the LFP trough at 0
#   and 360 degrees (up state) and the peak at 180 degrees (down state); the phase at the AP peak is
#   used. Mean vector direction and length, Rayleigh test, on the APs pooled across cells.
# - Values are median +- SD unless stated. Each comparison is preceded by a Kolmogorov-Smirnov test
#   of normality; normal data get a paired or two-sample t test, others a Mann-Whitney U test.
#   Significance at P < 0.05.
#
# Details these sources leave open, with the readings allowed, used by several claims:
# - AP detection apart from the 5 mV/ms threshold. A standard choice is used, an upstroke crossing
#   5 mV/ms followed by a peak above 0 mV; a peak at least 30 mV above threshold is the variant. It
#   is shown both ways where a claim counts APs.
# - The boundary between AIS-APs and RA-APs. No numbers are given. Readings: (a) labels the
#   dandiset carries, when it has them; (b) a two-component Gaussian mixture on threshold and pre-AP
#   slope fitted to the APs of each preparation pooled (human slice, rat slice, mouse in vivo), RA-APs
#   the component with the lower threshold; (c) in induction recordings only, APs during the current
#   pulses are AIS-APs and APs in the interstimulus intervals and the continuous recording are
#   RA-APs. Every claim that classifies APs states which readings apply.
# - Tolerances. The paper gives medians with the SD of the cells or APs. The SD is the spread of the
#   sample, not an uncertainty of the median (88 +- 1828 RA-APs), so it is not used as a tolerance;
#   medians and means get 10% of the value, and the SDs are reported beside them, not judged.
# - Counts that disagree inside the paper. Human RAF cells are 87 of 385 in the Results and 83 of
#   358 in the sag analysis; rat RAF cells are 102 of 259 in Figure S1B and 97 of 254 in the sag
#   analysis. Each claim uses the counts its own passage gives.
# - Phase method. Butterworth order and whether the filter is zero phase are not given; MATLAB
#   filtfilt with order 2 is the standard choice, order 4 the variant. Whether the 4 s segment is
#   centred on the AP is not given; centred (2 s each side) is the standard choice.
