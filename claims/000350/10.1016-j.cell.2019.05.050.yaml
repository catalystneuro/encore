# Claims for Mu, Bennett, Rubinov et al. (2019), Cell 178, 27-43, on dandiset 000350.
# Source: the full text (open access, CC BY-NC-ND), main text and STAR Methods, read from the PDF
# posted on the first author's lab site. The Supplemental Information (Figures S1 to S6, Tables S1
# to S3, videos) was not read.
#
# When these criteria were written, the author had seen the data check only: the file list and
# metadata, the groups and table columns of every file, the imaging plane metadata, the shapes and
# timestamps of the imaging series, the counts of rows in each ActivityStates table and the first
# 15 rows of one, percentiles of swim duration and power in one file, the values of the DfOverF
# series in 200 to 3724 ROIs of one file, and the time each fish spends in each stimulus condition
# (gain above or at zero, grating moving or stationary). No claim's analysis had been run.
#
# The dandiset holds 12 light-sheet sessions with fictive swimming in virtual reality: 4 with
# neurons and radial astrocytes imaged together (two colours), 4 with neurons only and processed
# cell traces, 1 with neurons only and raw images only, and 3 with radial astrocytes only and raw
# images only. All 12 hold the swim signals, swim bouts and stimulus signals. None of the
# perturbation experiments (Figures 4 to 7) is in it.
#
# Choices fixed here for all claims, where the Methods leave them open:
# - Closed loop is time when the stimulus gain signal is above 0 and the grating moves (baseline
#   velocity signal above 0); open loop is time when the gain is 0 and the grating moves (Methods:
#   "In open loop, the gain was zero"). Periods of stationary grating are left out of both.
# - Swim bouts are the rows of SwimIntervals. A passive epoch is a gap of 5 s or more between the
#   end of one bout and the start of the next; an active epoch is a chain of bouts separated by
#   gaps under 5 s whose first start and last end are more than 5 s apart (Methods). Epochs are
#   taken within one continuous closed- or open-loop period, and those cut by its edges are left
#   out. Passivity onset is the end of the last bout of an active epoch that is followed by a
#   passive epoch in open loop.
# - The whole-brain signal of a cell type is the mean over ROIs of the DfOverF series, from a
#   fixed, evenly spaced subset of ROI blocks (the full tables are 6 to 10 GB each). The series
#   is each ROI's trace divided by its mean (see the data check), so changes are in units of that
#   mean.
# - Each fish's value is the mean over its epochs or events; group statistics are over fish.
# - Tolerances for values given as mean and SEM are 1.96 times the SEM (the 95% interval of the
#   mean); the paper states "Error bars, SEM in all figures".
# Quotes and statistics added 2026-10-20 from the full text (PDF of the version of record, and its
# supplement).
schema_version: 1
dandiset: "000350"
paper: doi:10.1016/j.cell.2019.05.050
claims:
- id: fig1h-epoch-durations
  statement: In prolonged open loop, fish cycle between passive epochs lasting 24.4 +/- 2.5 s and
    active epochs lasting 36.1 +/- 4.2 s (mean +/- SEM, n = 74 fish), swimming 29 +/- 6 times per
    active epoch.
  source: Figure 1H; Results, Withholding Visual Feedback during Swimming Induces Passivity,
    paragraph 3; STAR Methods, Futility-induced passivity behavioral analysis
  quote: Passive states (epochs when the animal did not swim for at least 5 s; Figures S1A and S1B)
    lasted 24.4 ± 2.5 s (mean ± SEM), and active states lasted 36.1 ± 4.2 s (n = 74; Figure 1H). ...
    the fish swam 29 ± 6 times (n = 74) during each epoch.
  expected:
  - quantity: Mean duration of passive epochs
    value: 24.4
    tolerance: 4.9
    unit: s
  - quantity: Mean duration of active epochs
    value: 36.1
    tolerance: 8.2
    unit: s
  - quantity: Swim bouts per active epoch
    value: 29
    tolerance: 11.8
    unit: bouts
  criterion: The mean over fish of each fish's mean, in open loop. Readings, listed before the
    analysis; (a) epochs built from SwimIntervals by the Methods' rule; (b) the active and passive
    rows of the dandiset's ActivityStates table, over the whole recording, as the table does not
    say which condition they belong to; (c) as (a), with all epochs pooled over fish. Reproduced
    when, under one reading, all three values are within tolerance; partially reproduced when
    two are. The 12 fish here are a subset of the paper's 74.
- id: methods-isi
  statement: In closed loop fish swim in discrete bouts about once per second (inter-swim interval
    1.2 +/- 0.05 s, n = 74), and within active epochs of open loop the interval is 1.19 +/- 0.047 s
    against 24.4 s in passive epochs.
  source: STAR Methods, Futility-induced passivity behavioral analysis
  quote: Paralyzed fish in closed loop in our VR setup typically swam in discrete bouts, about once
    per second (1.2 ± 0.05 s, n = 74). ... (1.19 ± 0.047 s inter-swim-interval in active epochs
    versus 24.4 ± 2.5 s in passive epochs, n = 74, Figure S1B).
  expected:
  - quantity: Inter-swim interval in closed loop
    value: 1.2
    tolerance: 0.098
    unit: s
  - quantity: Inter-swim interval in active epochs of open loop
    value: 1.19
    tolerance: 0.092
    unit: s
  criterion: Per fish the mean interval between successive bouts, then the mean over fish. The
    interval can be read as (a) start to start of successive bouts, or (b) end of one bout to the
    start of the next; and in closed loop as (i) intervals under 5 s, or (ii) all intervals.
    Reproduced when both values are within tolerance under one reading; partially reproduced
    when one is.
- id: fig1j-open-loop-passivity
  statement: Fish spend much more time in the passive state when swimming produces no visual
    feedback (open loop) than in closed loop with a naturalistic gain, where passivity is rare.
  source: Figure 1J; Figure 1C to E; Results, Withholding Visual Feedback during Swimming Induces
    Passivity, paragraphs 3 and 4
  quote: Prevalence of the passive behavioral state depended on the motosensory gain ... As the gain
    approached 0 (i.e., open loop), fish gradually spent more and more time in the passive state.
  criterion: Per fish, the fraction of time in passive epochs (gaps of 5 s or more between bouts)
    in closed loop and in open loop. Reproduced when the open-loop fraction is higher by a
    one-sided Wilcoxon signed-rank test over fish at p < 0.05 and the median closed-loop fraction
    is below 10%; partially reproduced when only the test holds.
- id: fig1c-vigor-open-loop-onset
  statement: When switched from closed to open loop, fish first swim with higher vigor, then
    stop swimming.
  source: Figure 1C; Results, Withholding Visual Feedback during Swimming Induces Passivity,
    paragraph 3
  quote: In open loop, fish first swam with higher vigor, then stopped swimming for several to tens
    of seconds.
  criterion: For each switch from closed to open loop, the mean power (SwimIntervals) of the bouts
    from the switch to the first passive epoch, over the mean power of the bouts in the 30 s of
    closed loop before the switch. Per fish the median log ratio over switches. Reproduced when
    the log ratio is above 0 by a one-sided Wilcoxon signed-rank test over fish at p < 0.05.
    Switches with fewer than 3 bouts on either side are left out.
- id: fig1i-isi-before-passivity
  statement: Before the switch to passivity the inter-swim interval increases progressively, and
    fish swim more vigorously and less frequently in the seconds before passivity.
  source: Figure 1I (n = 61 fish); Results, Withholding Visual Feedback during Swimming Induces
    Passivity, paragraph 4
  quote: Several seconds prior to passivity, fish swam more vigorously and less frequently and
    attempted to make larger amplitude turns (Figures 1I and S1C). ... Before the switch to
    passivity, inter-swim interval progressively increased, n = 61 fish
  criterion: For each passivity onset whose active epoch holds at least 10 bouts, the start-to-start
    intervals numbered back from the last one (k = 1 is the interval ending at the last bout) and
    the power of the bouts numbered back from the last. Per fish the mean at each k. Reproduced
    when the interval at k = 1 is longer than at k = 7 (one-sided Wilcoxon over fish, p < 0.05),
    the Spearman correlation between k and the mean over fish for k = 1 to 7 is negative, and the
    mean power of the last 3 bouts is higher than that of bouts 8 to 10 before onset (one-sided
    Wilcoxon over fish, p < 0.05). Partially reproduced when the interval part holds and the
    power part does not, or the reverse.
- id: fig2bc-neurons-lower-in-passivity
  statement: Whole-brain average neuronal activity is higher during active behavior than during
    passivity, and decays after passivity onset.
  source: Figure 2B and 2C; Results, Correlates of Passivity in Neuronal and Astrocytic Activity,
    paragraph 2
  quote: When animals switched from the active to the passive behavioral state, whole-brain average
    neuronal activity decreased ... Average neuronal Ca2+ decayed after passivity onset
  criterion: In the 8 files with processed neuronal traces, per fish the mean of the whole-brain
    neuronal signal over open-loop passive epochs minus that over open-loop active epochs.
    Reproduced when it is below 0 by a one-sided Wilcoxon signed-rank test over fish at p < 0.05.
    The change after onset (5 to 10 s after, minus 10 to 5 s before) is reported per fish.
- id: fig2c-glia-rise-at-passivity
  statement: Whole-brain average radial astrocyte calcium increases before passivity onset and
    peaks soon after it.
  source: Figure 2B and 2C (one example fish, 64 events); Figure 2G and 2I; Results, Correlates of
    Passivity in Neuronal and Astrocytic Activity, paragraph 2
  quote: Average neuronal Ca2+ decayed after passivity onset, while average glial Ca2+ increased
    before passivity onset and peaked soon after. ... This increase in glial Ca2+ started seconds
    before passivity onset
  criterion: In the 4 files with processed glial traces, per passivity onset the glial signal
    averaged over 1 to 4 s after onset minus its mean over 10 to 5 s before (the paper's
    reliability windows), and the mean over 2 to 0 s before onset minus the same baseline. Per
    fish, one-tailed Wilcoxon signed-rank tests over onsets. Reproduced when, in at least 3 of the
    4 fish, both the after-onset increase and the before-onset increase have p < 0.05 and the
    peak of the onset-triggered average lies between 0 and 10 s after onset. Partially
    reproduced when only the after-onset increase holds in at least 3 fish. The number of onsets
    per fish is compared with the 64 events of the paper's example.
- id: figs2a-open-loop-higher
  statement: Whole-brain average neuronal and glial calcium are higher and fluctuate more strongly
    in open loop than in closed loop.
  source: Results, Correlates of Passivity in Neuronal and Astrocytic Activity, paragraph 2; Figure
    S2A
  quote: Both neuronal and glial Ca2+, averaged across the brain, were higher and fluctuated more
    strongly in open loop than in closed loop (Figure S2A).
  criterion: Per fish, the mean and the standard deviation of the whole-brain signal over open-loop
    time and over closed-loop time, leaving out the first 30 s after each switch. Neurons (8 fish);
    one-sided Wilcoxon signed-rank tests over fish for open above closed at p < 0.05. Glia (4
    fish); open above closed in all 4 (a Wilcoxon test over 4 fish cannot reach p < 0.05).
    Reproduced when both measures hold for both cell types; partially reproduced when at least
    one measure holds for one cell type.
- id: fig2h-glia-weaker-closed-loop-pauses
  statement: When fish in closed loop stop swimming because the stimulus stops moving, glial
    calcium signals are weaker than during futility-induced passivity.
  source: Figure 2H and 2M; Results, Correlates of Passivity in Neuronal and Astrocytic Activity,
    paragraph 3
  quote: When fish in a closed-loop protocol stopped swimming because the stimulus stopped moving,
    glial Ca2+ signals were weaker than during futility-induced passivity (Figure 2H).
  criterion: In the 4 files with processed glial traces, closed-loop pauses are gaps of 5 s or more
    between bouts that start in closed-loop time or in stationary-grating time with gain above 0.
    Response as in fig2c-glia-rise-at-passivity (1 to 4 s after onset minus 10 to 5 s before).
    Per fish, a one-sided Mann-Whitney test of closed-loop pause responses against open-loop
    passivity responses. Fish with fewer than 3 closed-loop pauses are left out; the claim is
    blocked (other) when fewer than 2 fish remain. Reproduced when the pause responses are smaller
    with p < 0.05 in every remaining fish; partially reproduced when they are smaller in median in
    every remaining fish.
- id: fig2dg-nmf-components
  statement: Non-negative matrix factorization of neurons and radial astrocytes gives components
    consistent across fish; glial component 1, in the lateral medulla oblongata (L-MO), is the most
    reliable, rising before and peaking after passivity onset (n = 5 neuron fish, 6 glia fish).
  source: Figure 2D to 2G; Results, Correlates of Passivity in Neuronal and Astrocytic Activity,
    paragraph 3
  quote: We clustered the components into a set that occurred consistently across all fish ...
    identified a consistent subset of glial signals (Figure 2G, component 1). Calcium in astrocyte
    component 1 increased before and peaked after passivity onset
- id: fig2kl-lmo-glia-most-consistent
  statement: Of all brain regions, radial astrocytes in L-MO show the most consistent increases at
    passivity onset, with ramping signals before it.
  source: Figure 2K, 2L and 2M; Results, Correlates of Passivity in Neuronal and Astrocytic
    Activity, paragraph 4
  quote: Of all brain regions, L-MO radial astrocytes showed the most consistent increases in
    activity during passivity (Figure 2L) and showed ramping Ca2+ signals before passivity onset
- id: fig1k-passive-unresponsive
  statement: Passive fish are less responsive to visual motion than active fish (p = 4.2e-7, n = 11).
  source: Figure 1K
  quote: Passive fish were less responsive to visual stimuli. ... In passive fish, response to
    motion was reduced.
  statistics:
  - test: Two-tailed paired t test
    p: 4.2e-7
    n: 11 fish
- id: fig1f-replay
  statement: Replaying in open loop the visual motion recorded in closed loop also induces
    passivity.
  source: Figure 1F
  quote: Futility-induced passivity also occurred when the stimulus seen in closed loop was replayed
    in open loop
- id: fig4-glia-necessary
  statement: Ablating radial astrocytes, or blocking their IP3 receptors, halves futility-induced
    passivity, while random neuronal ablation does not change it.
  source: Figure 4C, 4E and 4H; Results, Radial Astrocyte Activation Increases Passivity; Silencing
    Decreases Passivity, paragraphs 1 and 3
  quote: Ablated animals spent half as much time in the passive state as they did before ablation
    ... ablation of either a matched number of neurons in random locations ... did not affect
    futility-induced passivity ... This inactivation method also reduced futility-induced passivity
  statistics:
  - about: Glial ablation
    test: Two-tailed paired t test
    p: 1.3e-5
    n: "16"
  - about: Random neuronal ablation
    test: Two-tailed paired t test
    p: 0.34
    n: 15 fish
  - about: IP3R block with XeC
    test: Two-tailed paired t test
    p: 0.033
    n: 11 fish
- id: fig5-glia-sufficient
  statement: Activating radial astrocytes with TRPV1, CoChR or Opto-alpha1-AR suppresses swimming,
    and astrocyte activation drives GABAergic neurons at the edge of L-MO.
  source: Figure 5D, 5L, 5M and 5R; Results, Radial Astrocyte Activation Increases Passivity;
    Silencing Decreases Passivity, paragraphs 5 and 6; Results, Radial Astrocytes Drive Activity in
    GABAergic Neurons that Inhibit Swimming, paragraph 1
  quote: Thus, surges in Ca2+ in L-MO radial astrocytes alone appear sufficient to stop swimming.
    ... Both CoChR and Opto-a1-AR (Figure 5J) activation ... induced a drop in swim power ... L-MO
    radial astrocytes activate GABAergic neurons at the edge of L-MO
  statistics:
  - about: TRPV1, passivity
    test: Two-tailed paired t test
    p: 0.0029
    n: 7 fish
  - about: CoChR, swimming
    test: Two-tailed paired t test
    p: 0.00012
    n: 9 fish
  - about: Opto-alpha1-AR, swimming
    test: Two-tailed paired t test
    p: 0.0065
    n: 10 fish
- id: fig6a-ne-ramp
  statement: The neuronal population whose activity rises fastest before passivity overlaps the
    noradrenergic neurons of the medulla oblongata (NE-MO).
  source: Figure 6A
  quote: Population with the highest rate of increase overlaps with NE neurons
- id: fig6-ne-drives-glia
  statement: NE-MO activity precedes astrocyte activity at passivity, NE-MO ablation reduces
    passivity, and NE-MO stimulation activates radial astrocytes through alpha1B receptors.
  source: Figure 6B to 6N; Results, The Noradrenergic System Conveys Swim Failures to Radial
    Astrocytes, paragraphs 1 to 5
  quote: During futility-induced passivity, signals from NE neurons and glia were temporally
    coupled, with NE cell responses preceding astrocytic responses ... Ablating NE-MO with a
    two-photon laser greatly reduced time spent in passivity ... mediated by the a1B adrenergic
    receptor.
  statistics:
  - about: NE-MO ablation, time in passivity
    test: Two-tailed paired t test
    p: 0.0070
    n: 5 fish
  - about: NE-MO stimulation, L-MO glial Ca2+
    test: Two-tailed paired t test
    p: 0.025
    n: 5 fish
  - about: Prazosin, glial response to NE-MO stimulation
    test: Two-tailed paired t test
    p: 4.6e-5
    n: 9 fish
  - about: Cyclazosin, glial response to NE-MO stimulation
    test: Two-tailed paired t test
    p: 0.0042
    n: 5 fish
- id: fig7-ne-mismatch
  statement: NE-MO neurons respond to swims without visual feedback, encoding sensory-motor
    mismatch.
  source: Figure 7A to 7G; Results, The Noradrenergic System Conveys Swim Failures to Radial
    Astrocytes, paragraphs 7 and 8
  quote: NE-MO responses were small or absent when fish swam with naturalistic feedback but large
    when they swam without feedback. ... Thus, NE-MO signals swim failures by encoding sensory-motor
    mismatch.
- id: fig7-glia-accumulate
  statement: Radial astrocyte calcium grows with the number of consecutive failed swims and with
    the probability that a swim fails.
  source: Figure 7H to 7K; Results, Radial Astrocytes Integrate Evidence that Actions Are Futile,
    paragraph 1
  quote: Glial Ca2+ rose fastest when P = 0 (always futile), did not rise when P = 1 (always
    effective), and increased at intermediate rates for intermediate P ... Glial signals increased
    with number of failed bouts
