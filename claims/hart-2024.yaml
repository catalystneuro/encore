# Claims for Hart, Lopes, Frank & Kronauer (2024), Curr Biol 34, 3233, on dandiset 000773.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23,
# protocol as stated in docs/protocol.md (pilot-10).
#
# Text read: the accepted author manuscript (NIHMS1997610, PMC11265976) as served by Europe PMC,
# main text, figure legends and STAR Methods, with the supplement MMC1 (Figures S1 to S4 and
# Table S1), from paper/10.1016-j.cub.2024.05.031.txt. The supplement PDF was opened to read the
# p-values and sample sizes printed inside Figures S1 to S4 and to check Table S1. The images of
# main Figures 1 to 4 are not part of the text, so p-values printed only inside those panels
# (Figures 2D, 2E, 3B, 3D and 4) are not known here; where the text says "significant" they are
# recorded as p < 0.05. Data S1 (behavior) and Data S2 (calcium imaging quantifications) are
# spreadsheets of the paper's supplement and were not read.
#
# Code read: the paper's two Zenodo records. doi:10.5281/zenodo.11151724 is GitHub
# Social-Evolution-and-Behavior/Hart_Kronauer2023 v1.0.0 (commit 72d041a), from Hart et al. 2023
# and named by this paper for processing calcium imaging: generate_tif_files.py (NWB to TIFF) and
# macro_calcium_imaging.txt (ImageJ: image stabilization, fold change, peak maps, max
# Z-projections). doi:10.5281/zenodo.11151756 is Hart_Kronauer2024 v1.0.0 (commit 1aef6bc):
# Python that computes the proportions of ants outside the nest from Data S1 and plots the curves
# fitted in GraphPad Prism. No code for the glomerulus ROI quantification, the AUC, the counts of
# responding ROIs or the statistics (done in R and Prism) is published.
#
# Data the paper used.
# Behavior (Figure 1, Figure S1, Table S1; Data S1, not in the dandiset): wild type clonal line B
# ants, young 13 to 19 days and old 55 to 60 days post eclosion, in mixed-age colonies of 16 to 24
# ants (12 of each age set up). Stimuli: 4-methyl-3-heptanone (6 trials), 4-methyl-3-heptanol (7),
# the 9:1 blend (7) and pentane vehicle; per trial the number of young and old ants outside the
# nest counted every 10 s; analysis from -10 to 60 s (8 time points per trial, which matches the
# residual degrees of freedom of Table S1).
# Confocal (Figure 2A and 2B): anti-SYNORF1 stained brains of young and old GCaMP6s ants, in the
# Brain Image Library (doi:10.35077/g.1153), not in the dandiset.
# Calcium imaging (Figures 2C to 4, S2 to S4; this dandiset): GCaMP6s ants (Orco-QF2,
# 15xQUAS-GCaMP6s, OSN axons), young 15 to 20 days and old 60 to 61 days post eclosion; right AL;
# 33 planes of 512 x 512 at 5 um steps; 40 volumes per trial; odor valve after a 3 s delay for
# 5 s. Seven odors (alarm pheromones 4-methyl-3-heptanone and 4-methyl-3-heptanol; general
# odorants 3-hexanone, isopropanol, ethylpyrazine, ethanol, propionic acid), each ant at one
# concentration (3% or 48% v/v in paraffin oil), the seven in a randomized order repeated three
# times (21 trials). Ants (Figure S3B legend): 48%, 7 young and 7 old; 3%, 3 young and 4 old
# (21 in all, as the dandiset's subject count). Per-glomerulus n (young/old), Figures S2 and S4:
# PGb 7/7, PGa 7/6, G1 7/7, G2 7/7, G3 7/6 in Figure S2 but 7/5 in Figure S4, G4 7/6.
# The 90-day-old ants of Figure 3C and 3D are Hart et al. 2023, DANDI 000467, not this dandiset.
#
# Shared methods, from the STAR Methods (Image processing) and macro_calcium_imaging.txt.
# Frames are volumes, numbered from 1 as in ImageJ. Per Z-plane, the time series is stabilized
# (Image Stabilizer plugin; the macro uses Translation, 1 pyramid level, template update
# coefficient 0.90, 200 iterations, error tolerance 1e-7); fold change = (F - F0)/F0 with F0 the
# mean of frames 1 to 5. Peak response map = mean fold change over frames 9 to 14, a 2-pixel
# minimum filter, a maximum projection through the Z-planes, values clipped to -1 and 4 (clipping
# commutes with the minimum filter and the projection, so the macro's order and the Methods'
# order agree). The macro skips the plane named 0 um when projecting (slice_num < 1); the Methods
# say all Z-planes. The Methods are followed, and the macro's 32-plane projection is a variant.
# Glomerulus AUC: on the Z-plane through the glomerulus centre, an ROI around it; a maximum
# projection of that plane and the planes above and below; fold change as above; AUC = sum of
# fold change over frames 6 to 40. Statistics in R: Welch's t tests (two-sided, R's t.test
# default) and Wilcoxon tests (R's wilcox.test default, rank-sum between cohorts); no correction
# for multiple comparisons is stated. Each ant gives one value per odor (the figures plot one
# point per ant); the paper does not say how its three trials are combined. Figure S4C averages
# the three trials per ant, so the per-ant value is the mean over its trials.
# Open details, shared by the claims that use them:
# - The volume period. The Methods say the volume is scanned every 0.83 s; the macro sets 1.2 s
#   (periodVal), and 33 planes at 27.5 frames per second take 1.2 s. All windows are in frames,
#   so this does not change any measure.
# - ROIs. The whole-AL ROI, the responding-ROI sets and the six focal glomeruli (PGb, PGa,
#   G1 to G4) were drawn by hand from the images; the paper gives no coordinates, and the focal
#   glomeruli were matched across ants "by examining the same region of the AL" (Figure 3A shows
#   one young and one old ant). Data S2 holds the paper's per-ant quantifications; matching the
#   dataset's ants and values to them is the author's link check.
# - Glomerulus fold change. "a max Z-projection was generated ... and the fluorescence fold
#   change was calculated" allows (a) the ROI mean of the projected raw signal turned into fold
#   change, or (b) fold change per pixel then the ROI mean. Both are run.
# - Motion artifacts. "A small number of trials were excluded" from the responding-ROI counts,
#   by eye. Readings: (a) all trials kept; (b) the trials Data S2 leaves out, if it marks them.
