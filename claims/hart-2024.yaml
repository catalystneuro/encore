- id: fig1c-old-faster-alarm
  statement: For the pooled alarm pheromone stimuli, separate logistic curves for young and old
    ants fit better than a single curve, and old ants leave the nest faster.
  source: Results, paragraph 1; Figure 1C; Table S1, row "Pooled alarm pheromone stimuli"
  quote: For the pooled alarm pheromone stimuli, the preferred model incorporated separate curves
    for young and old ants, with old ants responding faster
  statistics:
  - test: extra sum-of-squares F test, single against separate logistic curves
    statistic: F(3, 314) = 8.006
    p: 0.0001
    p_relation: "<"
    n: 20 trials (6 with 4-methyl-3-heptanone, 7 with 4-methyl-3-heptanol, 7 with the blend)
  expected:
  - quantity: YM, young (Table S1; tolerance the wider side of its 95% CI, 0.808 to 0.939)
    value: 0.858
    tolerance: 0.081
  - quantity: YM, old (95% CI 0.883 to 0.947)
    value: 0.914
    tolerance: 0.033
  - quantity: Y0, young (95% CI 0.527 to 0.617)
    value: 0.571
    tolerance: 0.046
  - quantity: Y0, old (95% CI 0.626 to 0.703)
    value: 0.663
    tolerance: 0.040
  - quantity: K, young (95% CI 0.042 to 0.106)
    value: 0.070
    tolerance: 0.036
    unit: 1/s
  - quantity: K, old (95% CI 0.074 to 0.128)
    value: 0.099
    tolerance: 0.029
    unit: 1/s
  data: elsewhere
  where: Data S1, supplemental information of doi:10.1016/j.cub.2024.05.031 (PMC11265976)
  criterion: From the Methods, Table S1 and alarm_behavior_calculations.py (commit 1aef6bc). For
    each trial of the three alarm stimuli and each time point from -10 to 60 s in 10 s steps, the
    proportion of young ants outside the nest (young outside over the colony's young, as the code
    computes it; the Methods' "by the total number within the arena" is settled by the code) and
    the same for old ants. The logistic Y = YM*Y0/((YM-Y0)*exp(-K*x)+Y0) of Table S1 is fit by
    least squares to all per-trial points, once shared (3 parameters) and once per age (6), and
    compared by the extra sum-of-squares F test; the residual degrees of freedom should be 314.
    Prism's starting values are not given; any start that converges is a standard choice.
    Reproduced when separate curves are preferred at p < 0.05, old ants are faster, and the six
    parameters are within tolerance. "Faster" is not defined; readings (a) K old above K young,
    (b) the old curve above the young curve at every time from 0 to 60 s. Partially reproduced
    when the test and direction hold but a parameter is out of tolerance.
