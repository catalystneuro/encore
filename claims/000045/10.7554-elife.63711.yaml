  depends_on:
  - fig4f-threshold-unchanged-by-block
  - fig3f-classifier-chance-basic
  criterion: >-
    Lab classifier with GaussianNB on the eight per-block values of fig4fi-no-lab-difference
    from S2 (code figure4i_classifier_lab_membership_full.py); same rule as
