- id: fig3s2a-trial-duration
  statement: >-
    At basic task proficiency the median trial duration (stimulus onset to feedback) was
    468 +- 221 ms, with some differences across laboratories.
  source: Results, Performance in the basic task was indistinguishable across laboratories,
    paragraph 4; Figure 3, figure supplement 2a
  quote: >-
    The median time from stimulus onset to feedback (trial duration, a coarse measure of reaction
    time) was 468 ± 221 ms, showing some differences across laboratories ( Figure 3—figure
    supplement 2a , p=0.004, Kruskal-Wallis nonparametric test)
  statistics:
  - test: Kruskal-Wallis nonparametric test
    p: 0.004
    n: 140 mice in 7 laboratories
  expected:
  - quantity: median over mice of per-mouse median trial duration
    value: 468
    tolerance: 46.8
    unit: ms
  - quantity: s.d. over mice
    value: 221
    tolerance: 22.1
    unit: ms
  criterion: >-
    Per mouse, the median of response time minus stimulus onset time over the pooled S1 trials,
    no-response trials left out (code figure3cde, reaction_time); the median and s.d. over mice
    (code rt_median, rt_std). Kruskal-Wallis across labs; the code FDR-corrects this p with the
    other five variables, the text does not say; readings uncorrected and corrected. Reproduced
    when the values are within tolerance and p < 0.05 under one reading.

- id: fig3s2b-trials-per-session
  statement: >-
    At basic task proficiency mice performed 719 +- 223 trials per session; the difference across
    laboratories was significant but only in one laboratory relative to the rest.
  source: Results, Performance in the basic task was indistinguishable across laboratories,
    paragraph 4; Figure 3, figure supplement 2b
  quote: >-
    Mice on average performed 719 ± 223 trials per session ( Figure 3—figure supplement 2b ). This
    difference was significant (p<10 −6 , one-way ANOVA) but only in one laboratory relative to the
    rest.
  statistics:
  - test: one-way ANOVA
    p: 1.0e-6
    p_relation: "<"
    n: 140 mice in 7 laboratories
  expected:
  - quantity: mean trials per session, S1
    value: 719
    tolerance: 71.9
    unit: trials
  - quantity: s.d. over mice
    value: 223
    tolerance: 22.3
    unit: trials
  criterion: >-
    Per mouse, the mean number of trials over its S1 sessions (code figure3cde, n_trials); mean
    and s.d. over mice. One-way ANOVA across labs (code; the FDR correction it applies is a
    variant), then Tukey post hoc tests as in the code. Reproduced when the values are within
    tolerance, the ANOVA gives p < 1e-6, and the significant Tukey pairs all involve one lab.
    Partially reproduced when p < 0.05 but not below 1e-6, or the pairs involve more than one lab.

- id: fig3f-classifier-chance-basic
  statement: >-
    A Naive Bayes classifier could not identify a mouse's laboratory from its basic-task
    performance, threshold and bias; its accuracy was 0.12 +- 0.051 against a chance level of 0.11,
    and the 95% range of its distribution included chance.
  source: Results, Performance in the basic task was indistinguishable across laboratories,
    paragraph 5; Figure 3f
  quote: >-
    Its mean accuracy was 0.12 ± 0.051, and a 95th percentile of its distribution included the
    chance level of 0.11 (mean of the null distribution).
  expected:
  - quantity: mean decoding accuracy, mouse behavior
    value: 0.12
    tolerance: 0.051
  - quantity: chance level, mean of shuffled-label accuracy
    value: 0.11
    tolerance: 0.011
  depends_on:
  - fig3c-easy-errors-basic
  - fig3de-threshold-bias-basic
  criterion: >-
    Lab classifier (shared definition) with scikit-learn GaussianNB on per-mouse easy-trial
    performance, threshold and bias from S1 (code figure3f_classifier_lab_membership_basic.py).
    The paper's test, from the code (figure3f_plot_classifier_basic.py), is that the classifier is
    not above chance when the 2.5th percentile of its 2000 accuracies is at or below the mean
    shuffled accuracy. Reproduced when that holds, not reproduced when the 2.5th percentile is
    above chance. The accuracy tolerance is the paper's stated s.d. of the subsample distribution.

- id: fig3f-positive-control
  statement: >-
    With the laboratory's time zone added as a feature, the classifier performed above chance and
    confused labs in the same time zone.
  source: Results, Performance in the basic task was indistinguishable across laboratories,
    paragraph 5; Figure 3f; Figure 3, figure supplement 3b
  quote: >-
    If the classifier was given this variable during training and testing it performed above
    chance ( Figure 3f , Positive control ) and the confusion matrix showed clusters of labs
    located in the same time zone
  data: with_labels
  depends_on:
  - fig3f-classifier-chance-basic
  - lab-link
  criterion: >-
    As fig3f-classifier-chance-basic with the lab's time zone as a fourth feature (the code's
    offsets, Europe 0, New York -5, Los Angeles -7, from the lab's location). Reproduced when the
    2.5th percentile of the control accuracies is above the mean shuffled accuracy (the code also
    computes a 0.001th percentile, sig_control, shown as a variant) and the mean confusion matrix
    puts more off-diagonal mass on labs in the same time zone than on labs in others.

- id: fig3s3-other-classifiers
  statement: >-
    Random Forest and Logistic Regression classifiers also failed to predict laboratory membership
    from basic-task behavior.
  source: Results, Performance in the basic task was indistinguishable across laboratories,
    paragraph 5; Figure 3, figure supplement 3d-i
  quote: >-
    Similar results were obtained with two other classifier algorithms ( Figure 3—figure
    supplement 3d–i ).
  depends_on:
  - fig3f-classifier-chance-basic
  criterion: >-
    As fig3f-classifier-chance-basic with scikit-learn RandomForestClassifier (100 trees,
    random_state 424242) and LogisticRegression (solver liblinear), as in the code. Reproduced when
    neither is above chance by the same rule.

- id: lab-link
  kind: link
  statement: >-
    The institutions named in the dandiset's files are the paper's seven laboratories, so that the
    code's lab numbers (Lab 1 to 7) and time zones can be given to the dataset's mice.
  source: Claims file header, code lab numbers and time zones (paper-behavior at commit edc4531)
  data: with_labels
  criterion: >-
    Each session's institution in the files is matched by name to the code's laboratories. Reproduced
    when the seven institutions match the seven laboratories one to one. Whether the session start
    times bear out the time zones (start hours shifted by the labs' offsets if they are in UTC, as
    stated) is reported. Added by the author of attempt 000045-ibl-2021-01 (protocol, Author, step
    4) for fig3f-positive-control, whose time-zone feature comes from the paper's code by
    laboratory.

- id: fig3s1a-choice-consistency-basic
  statement: >-
    In the basic task, mouse choices were no more consistent within laboratories than across
    laboratories.
  source: Figure 3, figure supplement 1a legend
  quote: >-
    This averaged consistency was not significantly higher (p=0.73) than a null distribution
    generated by randomly shuffling lab assignments between mice and computing the average
    within-lab choice variability 10,000 times ( violin plot ). Therefore, choices were no more
    consistent within labs than across labs.
  statistics:
  - test: permutation test against 10,000 shuffles of lab labels
    p: 0.73
    n: 140 mice in 7 laboratories
  criterion: >-
    Per mouse, the fraction of rightward choices at each signed contrast; per lab, the variance
    across mice at each contrast, its mean over contrasts, and the inverse (consistency); the mean
    over labs compared with 10,000 shuffles of lab labels across mice; p = fraction of shuffles
    above the data (legend; code suppfig_choicevariability_withinacrosslabs.py, where 50% contrast
    trials are dropped). Sessions per the legend, S1 ("same data as in Figure 3"); the code instead
    uses the P1 day and the two days after (days_from_criterion [0, 2]), shown as a variant.
    Reproduced when p >= 0.05.

- id: fig3s1bc-choice-consistency-full
  statement: >-
    In the full task, neither choice fractions nor the bias shift between blocks were more
    consistent within laboratories than expected by chance.
  source: Figure 3, figure supplement 1b,c legend; Results, Performance in the full task was
    indistinguishable across laboratories, paragraph 4
  quote: >-
    Within-lab choice consistency on the full task was not higher than expected by chance,
    p=0.25. ... Within-lab consistency in bias shift was not higher than expected by chance
    (p=0.31).
  statistics:
  - about: choice consistency, full task
    test: permutation test against 10,000 shuffles of lab labels
    p: 0.25
    n: 98 mice in 7 laboratories
  - about: bias shift consistency
    test: permutation test against 10,000 shuffles of lab labels
    p: 0.31
    n: 98 mice in 7 laboratories
  depends_on:
  - fig3s1a-choice-consistency-basic
  criterion: >-
    As fig3s1a-choice-consistency-basic on S2 trials (legend "same data as in Figure 4"; code),
    with consistency computed per signed contrast and block before averaging (b), and for the bias
    shift (c) per mouse and contrast the fraction rightward in 20:80 blocks minus 80:20 blocks.
    Reproduced when both p >= 0.05.

- id: fig3s4-looser-criterion
  statement: >-
    With a looser proficiency criterion (80% correct on easy trials over three sessions, n = 150
    mice), behavior was again consistent across laboratories; only the number of trials per
    session differed slightly, and a classifier failed to identify a mouse's laboratory.
  source: Results, Performance in the basic task was indistinguishable across laboratories,
    paragraph 6; Figure 3, figure supplement 4
  quote: >-
    there was a small but significant difference in the number of trials per session across
    laboratories. All other measured parameters were similar.
  expected:
    quantity: mice meeting the looser criterion
    value: 150
    tolerance: 15
  depends_on:
  - fig3cde-no-lab-difference-medians
  - fig3f-classifier-chance-basic
  criterion: >-
    Sessions per the code (query_session_around_performance, suppfig_3-4a-f.py): for each mouse,
    the first three consecutive basic sessions each with more than 80% correct on easy trials;
    sessions with five or more signed contrasts kept; mice with three such sessions. Lab tests and
    FDR as in fig3cde-no-lab-difference-medians on the same six variables; Naive Bayes classifier
    on performance, threshold and bias as in fig3f-classifier-chance-basic
    (suppfig_classifier_lab_membership_perf.py). Reproduced when trials per session has corrected
    p < 0.05, the other five have p >= 0.05, and the classifier is not above chance.

- id: fig3s5-first-full-sessions
  statement: >-
    In the first three sessions of the full task, bias in each block, contrast threshold in each
    block and performance on 100% contrast trials did not vary significantly across
    laboratories, and a classifier could not predict lab membership.
  source: Figure 3, figure supplement 5 legend; Results, Performance in the basic task was
    indistinguishable across laboratories, paragraph 6
  quote: >-
    Bias for each block prior did not vary significantly over labs (Kruskal-Wallis test, 20:80
    blocks; p=0.96, 50:50 block; p=0.96, 80:20 block; p=0.89). ( b ) The contrast thresholds also
    did not vary systematically over labs (Kruskal-Wallis test, 20:80 block; p=0.078, 50:50 block;
    p=0.12, 80:20 block; p=0.17). ( c ) Performance on 100% contrast trials neither
    (Kruskal-Wallis test, p=0.15).
  statistics:
  - about: bias, 20:80 blocks
    test: Kruskal-Wallis test
    p: 0.96
  - about: bias, 50:50 block
    test: Kruskal-Wallis test
    p: 0.96
  - about: bias, 80:20 block
    test: Kruskal-Wallis test
    p: 0.89
  - about: contrast threshold, 20:80 block
    test: Kruskal-Wallis test
    p: 0.078
  - about: contrast threshold, 50:50 block
    test: Kruskal-Wallis test
    p: 0.12
  - about: contrast threshold, 80:20 block
    test: Kruskal-Wallis test
    p: 0.17
  - about: performance on 100% contrast trials
    test: Kruskal-Wallis test
    p: 0.15
  criterion: >-
    Per mouse and block, psychometric fits to the pooled trials of the first three full-task
    sessions, and performance on 100% contrast trials (legend; the code's correct_easy, which also
    counts any 50% contrast trials, is a variant). Sessions per the legend, the first three biased sessions;
    the code (suppfig_variability_over_labs_first_biased.py) takes the biased sessions on training
    days 1 to 3 after P1b, and its classifier script days -1 to 3; both shown as variants.
    Kruskal-Wallis across labs for each of the seven variables, as the legend names it (the code
    corrects the seven p values with statsmodels' default Holm-Sidak method; variant). Naive Bayes
    classifier on the seven variables as in fig3f-classifier-chance-basic. Reproduced when all
    seven p >= 0.05 and the classifier is not above chance.

- id: fig3s5a-prior-used-from-first-sessions
  statement: >-
    Mice incorporated the block priors into their choices from the first sessions of the full
    task.
  source: Results, Performance in the full task was indistinguishable across laboratories,
    paragraph 2; Figure 3, figure supplement 5a
  quote: >-
    Mice incorporated block priors into their choices already from the first sessions in which they
    were exposed to this full task
  depends_on:
  - fig3s5-first-full-sessions
  criterion: >-
    Per-mouse bias in 80:20 and 20:80 blocks from the sessions of fig3s5-first-full-sessions
    (both readings). The paper reports no test for this; the test is the one the paper uses for
    the block effect on bias in Figure 4i (fig4i-bias-shifts-with-block), a Wilcoxon signed-rank
    test of bias in 80:20 against 20:80 blocks. Reproduced when bias is higher in 80:20 than in
    20:80 blocks (median of paired differences) with p < 0.05. The median difference is also
    reported against the full-task proficiency threshold bias[80:20] - bias[20:80] > 5 (Appendix
    1, table 1d), a criterion for counting mice and not a test, as a variant.

