    biased 82.1 + 5.8%) ( Figure 5—figure supplement 2 ) were similar across laboratories,
    suggesting an overall common strategy.
  expected:
  - quantity: mean cross-validated accuracy, basic task
    value: 81.03
    tolerance: 8.1
    unit: "%"
  - quantity: mean cross-validated accuracy, full task
    value: 82.1
    tolerance: 8.2
    unit: "%"
  - quantity: mean condition number, basic model
    value: 2.4
    tolerance: 0.24
  - quantity: mean condition number, full model
    value: 3.2
    tolerance: 0.32
  depends_on:
  - fig5cf-glm-weights
  criterion: >-
    Fits as in fig5cf-glm-weights with 5-fold cross-validation, folds shuffled (the code sets no
    seed; a standard seed is used and the spread over seeds shown). Accuracy readings: (1) the
    Figure 5, figure supplement 2c legend, the fraction of test trials where the predicted
    probability of the actual choice exceeds 50%; (2) the code, the mean predicted probability of
    the actual choice. Condition number of the design matrix (numpy cond), as in the code.
    "Similar across laboratories" is fig5s2-weights-similar-across-labs.

- id: fig5s2-weights-similar-across-labs
  statement: >-
    Fitted model weights and predictive accuracy were similar across laboratories.
  source: Results, A probabilistic model reveals common strategies across mice and laboratories,
    paragraph 2; Figure 5, figure supplement 2
  quote: >-
    The model fit the mouse choices well and captured the relative importance of sensory and
    non-sensory information across mice and laboratories
  depends_on:
  - fig5s2-glm-accuracy
  criterion: >-
    The paper reports no test; the code (figure5_GLM_plot.py) runs the lab test (shared
    definition, uncorrected) on each weight (6.25, 12.5, 25, 100, rewarded, unrewarded, bias, and
    block in the full task), pseudo-R2 and accuracy, per task. Reproduced when no test gives
    p < 0.05; partially reproduced when one or two of the up to 20 tests do; the p values are
    reported.

- id: fig5s1b-win-stay-lose-switch
  statement: >-
    After correcting for slow fluctuations in decision bound, most mice used a win-stay
    lose-switch strategy, in both the basic and full tasks.
  source: Figure 5, figure supplement 1b legend; Results, A probabilistic model reveals common
    strategies across mice and laboratories, paragraph 3
  quote: >-
    When taking these slow state-changes into account, the majority of animals use a win-stay
    lose-switch strategy.
  criterion: >-
    Code suppfig_history_strategy.py: trials from training days P1b-2 to P1b+3, split by task;
    signed contrasts with fewer than 100 trials over all mice dropped; per mouse, task, previous
    choice and previous outcome a psychometric fit; the history shift = fitted rightward % at 0%
    contrast after a right choice minus after a left choice, separately after rewarded and
    unrewarded trials, from fits with more than 50 trials; the same with the next trial's choice
    and outcome; corrected shift = history shift minus next-trial shift (Lak et al., 2020a).
    Reproduced when, in each task, more than half the mice have a positive corrected post-reward
    shift and a negative corrected post-error shift.

- id: fig5s1c-updating-by-contrast
  statement: >-
    After rewarded trials, choice updating was largest when the previous stimulus had low contrast
    and much smaller after high-contrast rewarded trials.
  source: Figure 5, figure supplement 1c legend
  quote: >-
    After rewarded trials, choice updating is largest when the visual stimulus was highly uncertain
    (i.e. had low contrast) but strongly diminished after more certain, rewarded trials.
  depends_on:
  - fig5s1b-win-stay-lose-switch
  criterion: >-
    Corrected updating as in fig5s1b-win-stay-lose-switch, computed separately by the previous
    trial's absolute contrast (code suppfig_history_bycontrast.py; read only in outline here).
    The paper reports no test. Reproduced when, after rewarded trials, the mean corrected updating
    after 0% and 6.25% contrast exceeds that after 100% contrast in both tasks.

- id: session-end-criteria
  statement: >-
    The session-ending criterion was not mandatory; 5,316 of 10,903 sessions ended earlier and
    5,587 later, the latter continuing for a median of 19 +- 16 extra trials (m.a.d.).
  source: Results, Training progression in the basic task, paragraph 2; Figure 1, figure
    supplement 2
  quote: >-
    The criterion to end a session was not mandatory: some sessions were ended earlier
    (5,316/10,903 sessions) and others ended later (5,587/10,903 sessions). The latter sessions
    typically continued for an extra 19 ± 16 trials (median ±m.a.d., 5,587 sessions) longer.
  expected:
  - quantity: sessions in total
    value: 10903
    tolerance: 1090
  - quantity: sessions that met an end criterion
    value: 5587
    tolerance: 559
  - quantity: median extra trials after the end criterion
    value: 19
    tolerance: 1.9
    unit: trials
  - quantity: m.a.d. of extra trials
    value: 16
    tolerance: 1.6
    unit: trials
  criterion: >-
    Code supp_queries.py: all mice that started training; per training day, an end criterion is
    met when a session that day has an end status (from the pipeline's
    SessionEndCriteriaImplemented table) or the day's summed session durations reach 90 minutes;
    extra trials = trials after the end-status trial. Without an end status in the dataset, it is
    recomputed from the three criteria of the Figure 1, figure supplement 2 legend (fewer than 400
    trials in 45 min; over 400 trials and 90 min; over 400 trials and median reaction time over
    the last 20 trials above 5 times the session median), taking the first trial at which one is
    met.
