# Claims for The International Brain Laboratory (2021), "Standardized and reproducible measurement
# of decision-making in mice", eLife 10:e63711, on dandiset 000045 ("IBL behavioral data").
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-22, under
# docs/protocol.md version pilot-10.
#
# Text read: the version of record (eLife, PMC8137147, as served by Europe PMC), full text with
# Results, figure legends and figure supplement legends, Materials and methods, Appendix 1 (table 1,
# standardization and proficiency criteria), the decision letter and author response. The only
# supplementary file is eLife's transparent reporting form; it holds no results. The Methods refer
# the psychometric fitting procedure and the full training criteria to "Protocol 2" (IBL Protocol
# for Mice Training, figshare doi:10.6084/m9.figshare.11634729.v3), which is not in paper/ and was
# not read; the code below settles the fitting procedure.
#
# Code read: github.com/int-brain-lab/paper-behavior at commit
# edc453189104a1f76f4b2ab230cd86f2140e3f63 (the commit the paper archives at Software Heritage).
# One script per figure panel; each queries the IBL DataJoint pipeline (or CSV extracts of it) and
# uses paper_behavior_functions.py for the shared selection, trial coding and psychometric fit. The
# psychometric fit itself is brainbox.behavior.pyschofit (ibllib), which the repository imports.
# The code for the Random Forest prediction of slow learners (Results, Training succeeded,
# paragraph 4) and for Figure 5, figure supplement 1c statistics is not in the repository.
#
# Data the paper used. Female and male C57BL6/J mice, 3 to 7 months old, trained in seven
# laboratories in three countries (code lab numbers: UCL Lab 1, CCU/Champalimaud Lab 2, CSHL Lab 3,
# NYU Lab 4, Princeton Lab 5, SWC Lab 6, Berkeley Lab 7; time zones Europe 0, New York -5,
# Los Angeles -7 hours in the code). 210 mice entered, 4 were excluded for adverse effects, 206
# started training, 140 reached basic task proficiency and 98 full task proficiency. Mice are those
# of project ibl_neuropixel_brainwide_01 that reached the criterion by 2020-03-23, and only
# sessions up to that date are used (code CUTOFF_DATE); one session
# (a9fb578a-9d7d-42b4-8dbc-3b419ce9f424) is excluded in the code. One session a day, trials with:
# signed contrast (left or right, 100, 50, 25, 12.5, 6.25, 0%), the wheel choice (left, right or
# no response within 60 s), feedback (reward or noise burst), stimulus onset and response times,
# the block's probability of a left stimulus (50, 20 or 80%; full task only) and the session's
# start and end times and task protocol (basic "training" or full "biased"). The dandiset's
# archive description says its NWB files hold wheel movement, camera footage and trial-by-trial
# stimulus information for this task, and names the bioRxiv version of this paper.
#
# Shared definitions, used by name in the criteria below. All are from the paper's Methods,
# legends and Appendix 1 unless the code is cited.
# - Trial coding (code dj2pandas). Signed contrast = right minus left contrast, in %. A no-response
#   trial counts as incorrect for performance (Results: "no-response trials ... were labeled as
#   incorrect trials") and is left out of the fraction of rightward choices. Performance on easy
#   trials = % correct on trials with contrast of 50% or more. Trial duration (reaction time) =
#   response time minus stimulus onset time, no-response trials left out.
# - Psychometric fit (Methods, Psychometric curves; code fit_psychfunc). P = gamma + (1 - gamma -
#   lambda) (erf((c - mu)/sigma) + 1)/2, fitted by maximum likelihood to the fraction of rightward
#   choices per signed contrast; bias mu bounded by the smallest and largest contrast, threshold
#   sigma in [5, 40], lapses gamma (left) and lambda (right) in [0, 1], start [0, 20, 0.05, 0.05];
#   no fit (NaN) with fewer than four signed contrasts. The number of random restarts is
#   psychofit's default (a standard choice, as is the seed).
# - Basic proficiency (P1). The session at which a mouse first meets the Appendix 1, table 1d
#   'Trained 1a/1b' criteria over its last three sessions; the code reads it as the first session
#   with training status trained_1a or trained_1b in the IBL pipeline. Readings: the status the
#   dataset carries, if any; otherwise recomputed from the trials with the 1a criteria, and with
#   the 1b criteria from their introduction (Methods: September 2019, no day given).
# - Basic sessions (S1). The basic (training protocol) sessions of the P1 training day and the two
#   training days before it (Figure 3 legend "the three sessions at which mice achieved
#   proficiency"; code days_from_criterion [2, 0]). One value per mouse from the pooled trials.
# - Full proficiency (P2). The first session meeting the Appendix 1, table 1d 'Full task
#   proficiency' criteria; the code reads it as the first status ready4ephysrig, ready4delay or
#   ready4recording. Readings as for P1.
# - Full sessions (S2). The full task (biased protocol) sessions of the P2 training day and the two
#   days before (code days_from_criterion [2, 0]); n = 98 mice.
# - First full-task session (P1b). The code's "biased" criterion: the first biased-protocol
#   session with status trained_1b.
# - Lab test (code figure3cde and others). Each variable is first tested for normality over all
#   mice (scipy normaltest); the code runs a Kruskal-Wallis test across labs when p < 0.05 and a
#   one-way ANOVA otherwise. Where the paper names the test, the named test is the main reading and
#   the code's switch a variant.
# - Lab classifier (Methods, Classification of laboratory membership; code figure3f). scikit-learn
#   classifier with default settings, 8 mice drawn at random from each lab without replacement,
#   2000 times; leave-one-out cross-validation over the 56 mice; accuracy = fraction correctly
#   classified; a null from shuffling the lab labels in each subsample; positive control adds the
#   lab's time zone as a feature. Code seed 424242; Random Forest with 100 trees and
#   random_state 424242; Logistic Regression with solver liblinear.
#
# Tolerances. Where the paper gives mean +- s.d. over mice, the s.d. describes the spread across
# mice and not the uncertainty of the mean, so the mean gets 10% of its value and the s.d. its own
# 10% entry; other tolerances are 10% unless a claim says why.
schema_version: 2
dataset:
  archive: dandi
  id: "000045"
paper: doi:10.7554/elife.63711
claims:
- id: cohort-counts
  statement: >-
    Of 206 mice that started training, 140 reached proficiency in the basic task and 98 in the
    full task.
  source: Results, opening section, paragraph 3
  quote: >-
    Out of 206 mice that started training, 140 achieved proficiency in the basic task, and 98 in
    the full task
  expected:
  - quantity: mice that started training
    value: 206
    tolerance: 20.6
  - quantity: mice reaching basic task proficiency (P1)
    value: 140
    tolerance: 14
  - quantity: mice reaching full task proficiency (P2)
    value: 98
    tolerance: 9.8
  criterion: >-
    Counts of distinct mice under the paper's selection (project mice, criterion reached by
    2020-03-23, code query_subjects), proficiency as P1 and P2 under each reading. A dataset that
    holds fewer mice is reported with the counts it holds; the claim is judged on the counts.

- id: fig2g-days-to-proficiency
  statement: >-
    Basic task training took 18.4 +- 13.0 days (s.d., n = 140 mice), from 3 days for the fastest
    mouse to 59 days for the slowest.
  source: Results, Training succeeded but with different rates across mice and laboratories,
    paragraph 1; Figure 2g
  quote: >-
    The average training took 18.4 ± 13.0 days (s.d., n = 140, Figure 2g )
  expected:
  - quantity: mean days to basic proficiency
    value: 18.4
    tolerance: 1.84
    unit: days
  - quantity: s.d. of days to basic proficiency
    value: 13.0
    tolerance: 1.3
    unit: days
  - quantity: fastest mouse
    value: 3
    tolerance: 0.3
    unit: days
  - quantity: slowest mouse
    value: 59
    tolerance: 5.9
    unit: days
  criterion: >-
    Per mouse, the number of training days (days with a session in the per-day summary the code
    reads) up to P1 (code figure2g_time_to_trained.py). The code's query branch counts days up to
    and including the P1 day, its CSV branch days before it; both readings are run. Mean and s.d.
    over the 140 mice (or those the dataset holds), and the minimum and maximum.

- id: fig2g-days-differ-across-labs
  statement: >-
    The number of days to basic task proficiency differed across laboratories; within-lab
    interquartile ranges ranged from 8 days (Lab 2) to 22 days (Lab 6).
  source: Results, Training succeeded but with different rates across mice and laboratories,
    paragraph 1; Figure 2g
  quote: >-
    The number of days needed to achieve basic task proficiency was different across
    laboratories ( Figure 2g , p<0.001, Kruskal-Wallis nonparametric test followed by a post-hoc
    Dunn's multiple comparisons test)
  statistics:
  - test: Kruskal-Wallis nonparametric test, then post-hoc Dunn's multiple comparisons test
    p: 0.001
    p_relation: "<"
    n: 140 mice in 7 laboratories
  expected:
  - quantity: Lab 2 interquartile range of days to proficiency
    value: 8
    tolerance: 0.8
    unit: days
  - quantity: Lab 6 interquartile range of days to proficiency
    value: 22
    tolerance: 2.2
    unit: days
  depends_on:
  - fig2g-days-to-proficiency
  criterion: >-
    Days per mouse as in fig2g-days-to-proficiency, under both of its readings. Kruskal-Wallis test
    across the seven labs (the code switches to a one-way ANOVA when the days pass scipy's
    normality test; shown as a variant). Reproduced when p < 0.001. Interquartile ranges per lab
    are pandas' default (linear) quantiles, as in the code.

- id: fig2s1-trials-to-proficiency
  statement: >-
    Measured in trials, basic task training took 10.8 +- 8.6 thousand trials (s.d., n = 140), from
    one thousand for the fastest mouse to 43 thousand for the slowest; reaching 80% correct on easy
    trials took on average about 7.4 thousand trials.
  source: Results, Training succeeded but with different rates across mice and laboratories,
    paragraph 2; Figure 2, figure supplement 1
  quote: >-
    For mice that learned the task, the average training took 10.8 ± 8.6 thousands of trials
    (s.d., n = 140) ... The fastest learner met training criteria in one thousand trials, the
    slowest 43 thousand trials. To reach 80% on easy trials took on average ~7.4 thousand trials.
  expected:
  - quantity: mean trials to basic proficiency
    value: 10800
    tolerance: 1080
    unit: trials
  - quantity: s.d. of trials to basic proficiency
    value: 8600
    tolerance: 860
    unit: trials
  - quantity: fastest mouse
    value: 1000
    tolerance: 100
    unit: trials
  - quantity: slowest mouse
    value: 43000
    tolerance: 4300
    unit: trials
  - quantity: trials to reach 80% correct on easy trials
    value: 7400
    tolerance: 740
    unit: trials
  depends_on:
  - fig2g-days-to-proficiency
  criterion: >-
    Per mouse, the summed trial counts of the training days counted in fig2g-days-to-proficiency
    (code figure2g_time_to_trained.py), under both of its readings. The 7.4 thousand trials is
    printed by supp_figure2_performance_trials.py, and its method is followed. The 140 proficient
    mice, sessions (training days) with more than 100 trials, each mouse's easy-trial performance
    median-filtered over 3 sessions, training day counted from 0 at the mouse's first kept session,
    cumulative trials per mouse summed over its kept sessions; per training day, the mean over
    mice of performance and of cumulative trials; the value is the smallest mean cumulative trial
    count among training days whose mean performance exceeds 80%. Variant, shown only: the mean
    over mice of each mouse's cumulative trials at its first session above 80% correct on easy
    trials.

- id: fig2h-proportion-learned-40-days
  statement: >-
    About 80% of mice that started training would learn the basic task within the 40 days usually
    allotted (Kaplan-Meier estimate over all 206 mice).
  source: Results, Training succeeded but with different rates across mice and laboratories,
    paragraph 4; Figure 2h
  quote: >-
    there was a 80% probability that mice would learn the task within the 40 days that were
    usually allotted, and when mice were trained for a longer duration, the success rate rose even
    further ( Figure 2h )
  expected:
    quantity: Kaplan-Meier cumulative proportion proficient at training day 40
    value: 0.8
    tolerance: 0.08
  criterion: >-
    Kaplan-Meier estimate (code figure2d_training_probability.py, lifelines) over all 206 mice
    that started training (Figure 2 legend, "Data in h is for all mice that started training
    (n = 206)"): time = number of sessions with status in_training or untrainable; event = the
    mouse's last status is neither, so mice still in training at the cutoff date are censored.
    The code leaves out mice still in training after the cutoff date; that is a variant. Without
    status labels in the dataset, time = training days to P1 for proficient mice and their total
    training days otherwise. Reproduced when the cumulative proportion at day 40 is within the
    tolerance and higher at the last day than at day 40.

- id: fig2bc-threshold-bias-iqr
  statement: >-
    Contrast threshold and bias varied little during training; the threshold interquartile range
    slightly decreased from 12-29% in the first 10 training days to 11-23% thereafter, and the bias
    interquartile range went from -5.2 to 7.1% to -5.6 to 6.5%.
  source: Results, Training succeeded but with different rates across mice and laboratories,
    paragraph 1; Figure 2b,c
  quote: >-
    Estimates of contrast threshold did not vary much during training ( Figure 2b ), with an
    interquartile range that slightly decreased from 12–29% during the first 10 training days, and
    11–23% thereafter. Likewise, bias did not vary much, with an interquartile range of −5.2% to
    7.1% during the first 10 days to −5.6% to 6.5% thereafter ( Figure 2c ).
  expected:
  - quantity: threshold 25th percentile, days 1-10
    value: 12
    tolerance: 1.2
    unit: "%"
  - quantity: threshold 75th percentile, days 1-10
    value: 29
    tolerance: 2.9
    unit: "%"
  - quantity: threshold 25th percentile, after day 10
    value: 11
    tolerance: 1.1
    unit: "%"
  - quantity: threshold 75th percentile, after day 10
    value: 23
    tolerance: 2.3
    unit: "%"
  - quantity: bias 25th percentile, days 1-10
    value: -5.2
    tolerance: 0.52
    unit: "%"
  - quantity: bias 75th percentile, days 1-10
    value: 7.1
    tolerance: 0.71
    unit: "%"
  - quantity: bias 25th percentile, after day 10
    value: -5.6
    tolerance: 0.56
    unit: "%"
  - quantity: bias 75th percentile, after day 10
    value: 6.5
    tolerance: 0.65
    unit: "%"
  criterion: >-
    Per-session psychometric threshold and bias of the 140 proficient mice, as plotted in Figure
    2b,c (code figure2af_learning_curves_all_parameters.py): 50:50 sessions with more than 100
    trials, threshold and bias only from sessions with six or more signed contrasts (legend: from
    the first session with 12% contrast), each mouse's series median-filtered over 3 sessions,
    training day counted from 0 at the mouse's first session (the code), so the first 10 training
    days are code days 0 to 9. The code does not print the
    interquartile ranges, so the pooling is open; readings (1) all session values pooled over mice
    within days 1-10 and after day 10, (2) as (1) without the median filter, each with "thereafter"
    as (a) days 11 to 40 (the plotted range) and (b) all later days. Reproduced when all eight
    bounds are within tolerance under one reading and the threshold range after day 10 is
    narrower than in days 1-10.

- id: fig2-abs-bias-threshold-during-training
  statement: >-
    During training mice were not systematically biased to one side; absolute bias averaged
    9.8 +- 12.1 (s.d.), and contrast threshold, which stabilized after about 10 sessions, averaged
    17.8 +- 11.7%.
  source: Results, Training succeeded but with different rates across mice and laboratories,
    paragraph 2; Figure 2b,c
  quote: >-
    Mice across laboratories were not systematically biased towards a particular side and the
    absolute bias was similar across laboratories (9.8 ± 12.1 [s.d.] on average). Likewise,
    measures of contrast threshold stabilized after the first ~10 sessions, which was on average
    17.8 ± 11.7% on average across institutions.
  expected:
  - quantity: mean absolute bias during training
    value: 9.8
    tolerance: 0.98
    unit: "%"
  - quantity: s.d. of absolute bias
    value: 12.1
    tolerance: 1.21
    unit: "%"
  - quantity: mean contrast threshold after about 10 sessions
    value: 17.8
    tolerance: 1.78
    unit: "%"
  - quantity: s.d. of contrast threshold
    value: 11.7
    tolerance: 1.17
    unit: "%"
