- id: fig3cde-no-lab-difference-medians
  statement: >-
    At basic task proficiency, easy-trial performance, contrast threshold and bias did not differ
    in median across laboratories.
  source: Results, Performance in the basic task was indistinguishable across laboratories,
    paragraph 1; Figure 3c-e
  quote: >-
    None of these measures showed a significant difference across laboratories, either in median
    (performance: p=0.63, threshold: p=0.81, bias: p=0.81, FDR corrected Kruskal-Wallis test)
  statistics:
  - about: performance on easy trials
    test: Kruskal-Wallis test
    p: 0.63
    corrected: FDR
    n: 140 mice in 7 laboratories
  - about: contrast threshold
    test: Kruskal-Wallis test
    p: 0.81
    corrected: FDR
    n: 140 mice in 7 laboratories
  - about: bias
    test: Kruskal-Wallis test
    p: 0.81
    corrected: FDR
    n: 140 mice in 7 laboratories
  depends_on:
