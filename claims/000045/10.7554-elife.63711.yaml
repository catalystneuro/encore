  - fig3de-threshold-bias-basic
  criterion: >-
    Per-mouse values from S1 as in fig3c-easy-errors-basic and fig3de-threshold-bias-basic.
    Kruskal-Wallis test across the seven labs for each variable, then Benjamini-Hochberg FDR over
