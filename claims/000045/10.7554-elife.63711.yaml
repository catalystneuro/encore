    means ("on average across institutions") with the s.d. over pooled values. Reproduced when the
    two means are within tolerance under one reading.

- id: fig2s2-variability-decreases
  statement: >-
    Variability in performance across mice decreased with training but did not disappear; between
    training days 15 and 40, mean easy-trial performance rose from 80.7% to 91.1% while its s.d.
    across mice fell from 19.1% to 10.1%.
  source: Results, Training succeeded but with different rates across mice and laboratories,
    paragraph 3; Figure 2, figure supplement 2
  quote: >-
    For example, between training days 15 and 40, when the average performance on easy trials of
    the mice increased from 80.7% to 91.1%, the variation across mice (s.d.) of performance on
    easy trials decreased from 19.1% to 10.1%.
  expected:
  - quantity: mean easy-trial performance, day 15
    value: 80.7
    tolerance: 8.07
    unit: "%"
  - quantity: mean easy-trial performance, day 40
    value: 91.1
    tolerance: 9.11
    unit: "%"
  - quantity: s.d. across mice of easy-trial performance, day 15
    value: 19.1
    tolerance: 1.91
    unit: "%"
  - quantity: s.d. across mice of easy-trial performance, day 40
    value: 10.1
    tolerance: 1.01
    unit: "%"
  criterion: >-
    Easy-trial performance per mouse and training day for the 140 proficient mice. No code prints
    these four numbers. Readings (1) supp_figure2_performance_trials.py, which computes the mean
    and s.d. over mice per training day (behav_summary, behav_summary_std) from sessions with more
    than 100 trials, median-filtered over 3 sessions, training day counted from 0 at the first
    kept session, at training days 15 and 40 of that count (and at 14 and 39, if the text counts
    from 1); (2) the Figure 2a,d data (code figure2af: as (1) and only 50:50 sessions) at the same
    days; (3) the unfiltered per-day performance binned as in suppfig_variability_over_time.py
    (training_day strictly within 2 days of the bin centre) at days 15 and 39, the nearest bin to
    40. Reproduced when the mean rises and the s.d. falls, with all four values within tolerance
    under one reading.

- id: early-sessions-predict-slow-learners
  statement: >-
    A Random Forests decoder applied to the change in easy-trial performance over the first five
    sessions predicted whether a mouse would be in the bottom quartile of learning speed with 53%
    accuracy (chance 25%), and misclassified a top-quartile mouse as bottom-quartile only 7% of the
    time.
  source: Results, Training succeeded but with different rates across mice and laboratories,
    paragraph 3
  quote: >-
    A Random Forests decoder applied to change in performance (% correct with easy, high-contrast
    stimuli) in the first five sessions was able to predict whether a mouse would end up in the
    bottom quartile of learning speed (the slowest learners) with accuracy of 53% (where chance is
    25%). Conversely, the chance of misclassifying a fast-learning, top quartile mouse as a
    slow-learning, bottom quartile mouse, was only 7%.
  expected:
  - quantity: accuracy for bottom-quartile mice
    value: 0.53
    tolerance: 0.053
  - quantity: top-quartile mice classified as bottom quartile
    value: 0.07
    tolerance: 0.007
  depends_on:
  - fig2g-days-to-proficiency
  criterion: >-
    The repository at the cited commit holds no code for this analysis and the Methods do not
    describe it. Learning-speed quartiles from days to P1 (fig2g-days-to-proficiency; trials to
    P1, as in Figure 2, figure supplement 1c, is a further reading). Open details and the readings
    the text allows: features (a) the four session-to-session differences in easy-trial
    performance over sessions 1-5, (b) the five performances; labels (A) the four quartiles,
    (B) bottom quartile against the rest (chance 25% then the base rate); scikit-learn Random
    Forest with default settings and leave-one-out cross-validation, as for the lab classifiers
    in the Methods; accuracy read as (i) recall of the bottom-quartile class, (ii) overall
    four-class accuracy under (A), and (iii) precision of the bottom-quartile class. If the
    readings disagree on whether accuracy is near 53% and well above 25%, the claim is
    methods_underspecified.

- id: fig3c-easy-errors-basic
  statement: >-
    At basic task proficiency, errors on easy (50% and 100%) contrasts were low, 9.5 +- 3.6%, with
    no significant difference across laboratories.
  source: Results, Performance in the basic task was indistinguishable across laboratories,
    paragraph 1; Figure 3c
  quote: >-
    The lapse rates (i.e., the errors made in response to easy contrasts of 50% and 100%) were low
    (9.5 ± 3.6%, Figure 3c ) with no significant difference across laboratories.
  expected:
  - quantity: mean error rate on easy trials, S1
    value: 9.5
    tolerance: 0.95
    unit: "%"
  - quantity: s.d. over mice
    value: 3.6
    tolerance: 0.36
    unit: "%"
  criterion: >-
    Per mouse, 100 minus the easy-trial performance over the pooled S1 trials (code figure3cde,
    perf_easy); mice with no valid trial duration are dropped, as in the code. Mean and s.d. over
    mice. The lab comparison is claim fig3cde-no-lab-difference-medians.

- id: fig3de-threshold-bias-basic
  statement: >-
    At basic task proficiency the contrast threshold was similar across laboratories at
    14.3 +- 3.8 (s.d., n = 7 laboratories) and the response bias was small at 0.3 +- 8.4.
  source: Results, Performance in the basic task was indistinguishable across laboratories,
    paragraph 1; Figure 3d,e
  quote: >-
    The slope of the curves, which measures contrast sensitivity, was also similar across
    laboratories, at 14.3 ± 3.8 (s.d., n = 7 laboratories, Figure 3d ). Finally, the horizontal
    displacement of the curve, which measures response bias, was small at 0.3 ± 8.4 (s.d., n = 7,
    Figure 3e ).
  expected:
  - quantity: mean contrast threshold, S1
    value: 14.3
    tolerance: 1.43
    unit: "%"
  - quantity: mean bias, S1
    value: 0.3
    tolerance: 3.2
    unit: "%"
  - quantity: s.d. of contrast threshold, S1
    value: 3.8
    tolerance: 0.38
    unit: "%"
  - quantity: s.d. of bias, S1
    value: 8.4
    tolerance: 0.84
    unit: "%"
  criterion: >-
    Per mouse, psychometric threshold and bias fitted to the pooled S1 trials (code figure3cde).
    The code prints the mean and s.d. over mice (thres_mean, thres_std) while the text says
    n = 7 laboratories; readings (1) mean and s.d. over mice, (2) mean and s.d. over the seven lab
    means. The bias tolerance is 8.4/sqrt(7), the paper's s.d. over n = 7, because 10% of a value
