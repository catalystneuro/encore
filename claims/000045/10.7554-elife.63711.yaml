- id: fig4cd-biasshift-largest-at-zero
  statement: >-
    Block structure had the greatest effect on choices when sensory evidence was absent; the shift
    in rightward choices between 20:80 and 80:20 blocks was highest at 0% contrast in every
    laboratory, averaging 28.5%.
  source: Results, Performance in the full task was indistinguishable across laboratories,
    paragraph 2; Figure 4c-e
  quote: >-
    The average shift in rightward choices was invariably highest at 0% contrast, where rightward
    choices in the two blocks differed by an average of 28.5%.
  expected:
    quantity: mean over mice of the bias shift at 0% contrast
    value: 28.5
    tolerance: 2.85
    unit: "%"
  criterion: >-
    Per mouse, psychometric fits to the pooled S2 trials of the 20:80 and 80:20 blocks; the bias
    shift at each signed contrast is the fitted rightward choice percentage in 20:80 minus 80:20
    (code figure4de_psychfuncs_biased.py; the Figure 4c legend reads it from the curves). Mean over
    mice at 0%. Reproduced when the mean is within tolerance and, in each of the seven labs, the
    lab mean is highest at 0% contrast.

- id: fig4de-biasshift-no-lab-difference
  statement: >-
    The bias shift at 0% contrast did not differ across laboratories more than within them.
  source: Results, Performance in the full task was indistinguishable across laboratories,
    paragraph 2; Figure 4d,e
  quote: >-
    This value did not significantly differ across laboratories any more than it differed within
