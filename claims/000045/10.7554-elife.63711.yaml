- id: fig5cf-glm-weights
  statement: >-
    In a logistic choice model fitted to each mouse, visual weights grew with contrast to above 3
    at 100% contrast, while weights for past choices were much smaller and positive after both
    rewarded (basic 0.19, full 0.42) and unrewarded (basic 0.33, full 0.46) trials, indicating
    perseverance.
  source: Results, A probabilistic model reveals common strategies across mice and laboratories,
    paragraph 2; Figure 5c,d,f,g
  quote: >-
    As expected, visual terms had large weights, which grew with contrast to reach values above 3
    at 100% contrast. Weights for non-sensory factors were much lower ( Figure 5c,f , note
    different scale). Weights for past choices were positive for both rewarded (basic 0.19, full
    0.42) and unrewarded previous trials (basic 0.33, full 0.46)
  expected:
  - quantity: mean rewarded past-choice weight, basic task
    value: 0.19
    tolerance: 0.019
  - quantity: mean rewarded past-choice weight, full task
    value: 0.42
    tolerance: 0.042
  - quantity: mean unrewarded past-choice weight, basic task
    value: 0.33
    tolerance: 0.033
  - quantity: mean unrewarded past-choice weight, full task
    value: 0.46
    tolerance: 0.046
  criterion: >-
    Model per Methods (Probabilistic choice model, equations 2-4): logistic regression of choice
    (no-response trials left out) on signed indicators per nonzero contrast, the previous choice
    split by its outcome (r and u), a constant, and in the full task the block (+1 for 20:80, -1
    for 80:20, 0 for 50:50); design matrix by patsy, fit by statsmodels Logit.fit_regularized with
    its defaults (code figure5_GLM_modelfit.py), per mouse and task. Sessions per the code:
    training days P1b-2 to P1b+3, split into basic and full by protocol; the Methods say three
    sessions per mouse, read as (b) the last three basic sessions before P1b and the first three
    full sessions. Contrasts per the Methods include 50%; the code drops 50% trials (variant).
    Means over mice of each weight. Reproduced when the 100% weight's mean exceeds 3 in both tasks,
    the visual weights increase with contrast, and the four history weights are within tolerance
    under one reading.

- id: fig5dg-history-weights-higher-full
  statement: >-
    Previous choices influenced behavior more strongly in the full task than in the basic task,
    after both rewarded and unrewarded trials.
  source: Results, A probabilistic model reveals common strategies across mice and laboratories,
    paragraph 2; Figure 5d,g
  quote: >-
    Indeed, previous choices more strongly influenced behavior in the full task, both after
    rewarded (t(125) = 10.736, p<10 −6 ) and unrewarded trials (t(125) = 4.817, p<10 −6 ).
  statistics:
  - about: rewarded past-choice weight, full against basic
    test: paired t-test
    statistic: t(125) = 10.736
    p: 1.0e-6
    p_relation: "<"
    n: 126 mice with both fits
  - about: unrewarded past-choice weight, full against basic
    test: paired t-test
    statistic: t(125) = 4.817
    p: 1.0e-6
    p_relation: "<"
    n: 126 mice with both fits
  depends_on:
  - fig5cf-glm-weights
  criterion: >-
    Per-mouse weights from fig5cf-glm-weights, mice with both fits; scipy ttest_rel of full
    against basic, NaN omitted (code figure5_GLM_plot.py). Reproduced when both t are positive
    with p < 0.05 (the code's num_star significance level). Note that t(125) = 4.817 gives a
    two-sided p of about 4e-6, above the printed bound of 1e-6; the t value, not the bound, is the
    reference.

