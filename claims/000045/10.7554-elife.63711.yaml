  statement: >-
    Block type changed the overall bias consistently, with curves shifting left in 20:80 blocks
    and right in 80:20 blocks.
  source: Results, Performance in the full task was indistinguishable across laboratories,
    paragraph 3; Figure 4i
  quote: >-
    Finally, as expected there was a highly consistent change in overall bias, with curves shifting
    to the left in 20:80 trials and to the right in 80:20 trials
  statistics:
  - test: Wilcoxon Signed-Rank test
    p: 1.0e-16
    p_relation: "<"
    n: 98 mice
  depends_on:
  - fig4f-threshold-unchanged-by-block
  criterion: >-
    Fits as in fig4f-threshold-unchanged-by-block; Wilcoxon signed-rank test of bias mu between
    blocks. Reproduced when mu is lower in 20:80 than in 80:20 blocks (median of paired
    differences) with p < 1e-16; partially reproduced when the direction holds with p < 0.05 only.

- id: fig4fi-no-lab-difference
  statement: >-
    Threshold, lapses and bias in each block type showed no significant differences across
    laboratories.
  source: Results, Performance in the full task was indistinguishable across laboratories,
    paragraph 2; Figure 4f-i
  quote: >-
    An analysis of the psychometric curves showed highly consistent effects of block type, with no
