  statistics:
  - test: one-way ANOVA
    statistic: F(6) = 1.345
    p: 0.2455
    n: 98 mice in 7 laboratories
  depends_on:
  - fig4cd-biasshift-largest-at-zero
  criterion: >-
    Per-mouse bias shift at 0% from fig4cd-biasshift-largest-at-zero; one-way ANOVA on lab (code,
    statsmodels ols and type 2 anova_lm). Reproduced when p >= 0.05.

- id: fig4f-threshold-unchanged-by-block
  statement: >-
    Block type did not significantly affect the contrast threshold.
  source: Results, Performance in the full task was indistinguishable across laboratories,
    paragraph 3; Figure 4f
  quote: >-
    Changes in block type did not significantly affect the contrast threshold (Wilcoxon
    Signed-Rank test, p=0.85, n = 98 mice, Figure 4f ).
  statistics:
  - test: Wilcoxon Signed-Rank test
    p: 0.85
    n: 98 mice
  criterion: >-
    Per mouse, psychometric fits to the pooled S2 trials of 80:20 and of 20:80 blocks (code
    figure4fghi_variability_over_labs_full.py); scipy Wilcoxon signed-rank test of threshold in
    the two blocks. Reproduced when p >= 0.05.

- id: fig4gh-lapses-change-with-block
  statement: >-
    Block type changed lapse rates, which were higher on the left in 20:80 blocks and higher on
    the right in 80:20 blocks.
  source: Results, Performance in the full task was indistinguishable across laboratories,
    paragraph 3; Figure 4g,h
  quote: >-
    However, it did change the lapse rates, which were consistently higher on the left in the
    20:80 blocks and on the right in the 80:20 blocks
  statistics:
  - about: left lapse, 20:80 against 80:20 blocks
    test: Wilcoxon Signed-Rank test
    p: 1.0e-6
    p_relation: "<"
    n: 98 mice
  - about: right lapse, 20:80 against 80:20 blocks
    test: Wilcoxon Signed-Rank test
    p: 1.0e-7
    p_relation: "<"
    n: 98 mice
  depends_on:
  - fig4f-threshold-unchanged-by-block
  criterion: >-
    Fits as in fig4f-threshold-unchanged-by-block; left lapse gamma and right lapse lambda per
