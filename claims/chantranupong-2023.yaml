  source: Results, Striatal DA dynamics do not require CINs, paragraph 2; Extended Data Fig. 8g
  quote: or with rDAh, in which we simultaneously validated the suppression of Ach release
  criterion: The paper does not say how the suppression was validated; Extended Data Fig. 8g shows
    z-scored traces, and z-scoring can hide a loss of amplitude. The readings are (a) the header's
    delta-Ach in the post window (W1, W2) of the z-scored Ach, TelC against mCherry hemisphere,
    T1 per mouse; (b) the peak-to-trough range of the trial-averaged Ach ∆F/F0 within 2 s of side
    entry, as in fig3d-telc-abolishes-ach. Reproduced when, under each reading, Ach is lower in
    the TelC hemisphere in every one of the 4 mice (with T1 p < 0.05 under (a)); the "every mouse"
    rule is a reading of "validated" named here.
- id: ed9jm-vls-telc-behaviour-normal
  statement: Mice with VLS-selective TelC in CINs show no behavioural deficits.
  source: Results, Striatal DA dynamics do not require CINs, paragraph 2; Extended Data Fig. 9j-m
  quote: Mice did not exhibit behavioural deficits (Extended Data Fig. 9j–m )
  criterion: A claim of absence, judged on the paper's tests (Supplementary Methods, Behavior
