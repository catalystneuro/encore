- id: fig3f-vls-telc-da-unchanged
  statement: Blocking Ach release from VLS CINs in one hemisphere does not change DA dynamics there
    compared with the control hemisphere, in any trial type or history up to three trials back.
  source: Results, Striatal DA dynamics do not require CINs, paragraphs 2-3; Fig. 3f; Extended Data
    Fig. 8d-k
  quote: VLS-specific loss of Ach release did not affect DA dynamics in trials recorded with dLight1.1
    (Fig. 3f ) or with rDAh ... but we did not observe any significant changes in DA dynamics or in
    the underlying GLM kernels of DA for each input feature after loss of Ach
  statistics:
  - test: two-sided t-test, per mouse
    p: 0.05
    p_relation: "<"
    n: 4 dLight1.1 mice and 4 rDAh mice
  criterion: A claim of absence, judged on the paper's test, T1 per mouse at p < 0.05, TelC
    hemisphere against mCherry hemisphere, mean DA in the pre and post windows (W1, W2) for
    rewarded, unrewarded and history-parsed trials one, two and three back, as in
    aa_processStats_Fig3_DA_Ach_mCh_tet_FINAL.m. The paper does not say how per-mouse results are
    combined into "no significant changes"; the reading used here is that no comparison is
    significant in a consistent direction across mice (significant differences, if any, do not
    share a sign in more than half of the mice). Reproduced when that holds; not reproduced
    otherwise. All per-mouse effects are reported, and the count of mice with any significant
    comparison is reported as the strict reading.
- id: ed8g-vls-telc-ach-suppressed
  statement: In the simultaneous rDAh and Ach3.0 recordings, the TelC hemisphere has suppressed Ach
