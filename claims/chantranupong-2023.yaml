    Reproduced when the sign of the TelC minus mCherry difference is not the same in all 4 mice
    (a reading of "did not reveal consistent effects" named here).
- id: fig3g-dan-inhibition-lowers-da
  statement: Optogenetic inhibition of DANs with stGtACR2 during rewarded trials significantly
    reduces DA in the VLS.
  source: Results, Striatal DA dynamics do not require CINs, paragraph 3; Fig. 3g
  quote: inhibition of DAN activity robustly alters DA release, as evidenced by a significant
    reduction in the levels of DA after optogenetic inhibition of DANs with stGtACR2
  criterion: Laser (463 nm, 0.7 mW, 5 s) triggered at side entry (Methods, Optogenetic
