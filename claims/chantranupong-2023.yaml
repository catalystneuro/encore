# Claims for Chantranupong, Beron, Zimmer, Wen, Wang & Sabatini (2023), Nature 621, 577-585,
# "Dopamine and glutamate regulate striatal acetylcholine in decision-making", on dandiset 001767.
#
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21, protocol
# as stated in docs/protocol.md.
#
# Text read: the version of record as served by Europe PMC (PMC10511323), with the main text, the
# Methods, the figure legends and the Extended Data legends, and the Supplementary Information PDF
# (41586_2023_6492_MOESM1_ESM.pdf: Supplementary Results, Discussion, Methods), all in
# paper/10.1038-s41586-023-06492-9.txt. No PDF of the article itself was available, so the figures
# were not seen; panels are described from their legends and the Results. Missing: Supplementary
# Data 1, the statistical-tests spreadsheet that holds the P-values for Fig. 1e, Extended Data
# Figs. 3e,f, 4c-e, 6d, 8i-k and 11d,e. The claims on those panels record only the threshold the
# legends give (two-sided t-test, P < 0.05); their exact P-values are not recorded.
#
# Code read: the Supplementary Information links two repositories.
#  - github.com/lchantran/AchDA_manuscript_photometry, commit cd8caf0e4a1b533e65ad3a2e3ec448516ee56871
#    (MATLAB). It holds the photometry processing (rollingZ, spectrogram demodulation), the per-mouse
#    statistics and LDA (processStats_SIMPLE.m, driven by the aa_processStats_final_*.m scripts, one per
#    figure), the cross-correlations and two-dimensional covariance (anaCrossCor.m) and plotting.
#    It does not hold the GLM code (the Methods name scikit-learn) nor the across-genotype ANOVA of
#    Extended Data Fig. 11d.
#  - github.com/lchantran/AchDA_manuscript_behavior, commit 20c0edb0d64466e2376f8a1f84ab97f055b13b44
#    (Python notebooks). It holds the behaviour preprocessing, the block-transition statistics
#    (p(high port) time constant, maximum p(switch), Wilcoxon rank-sum tests, bootstrapped
#    conditional switch probabilities) and the RFLR model.
#  The paper also links github.com/HMS-RIC/TwoArmedBandit, the behaviour-box hardware and software.
#
# Data the paper used (as the paper reports them). Male mice, 6-8 weeks old at the start of behaviour,
# trained on a two-armed bandit task (2ABT) in a three-port box with barriers; P(high) = 95%, blocks
# switch after 30 rewards; 3-uL water rewards; a 1-s ITI. Fibre photometry in the ventrolateral
# striatum (VLS), frequency-modulated excitation (470 nm at 167 Hz, 565 nm at 223 Hz), sampled at
# 2 kHz by a LabJack together with behaviour events (centre-port entry and exit, side-port entry and
# exit, lick onset and offset, LED onset and offset). Demodulated signals have a 54-ms sample period
# (18 ms for Fig. 2d). Sensors and cohorts:
#  - dLight1.1 (DA, n = 13 mice) and GRAB-Ach3.0 (Ach, n = 14 mice) in separate hemispheres (Fig. 1);
#    ligand-binding mutants (4 mice); cue-omission sessions with the LEDs off (4 mice);
#  - dLight1.1 and rDAh in opposite hemispheres (3 mice); rDAh with Ach3.0 in the same hemisphere
#    (6 mice, Fig. 2); dLight1.1 in both hemispheres (4 mice);
#  - TelC or mCherry in CINs of ChAT-IRES-Cre mice: VLS Ach (3 mice), striatum-wide (5 mice per
#    group), VLS-selective one hemisphere each (4 mice, dLight1.1; plus rDAh with Ach3.0, 4 mice);
#    Chrimson in VLS CINs with dLight1.1 (7 mice); stGtACR2 in DANs with rDAh (3 mice);
#  - head-fixed mice on a wheel with Chrimson or stGtACR2 in DANs, dLight1.1 and Ach3.0, saline or
#    eticlopride i.p. (3 mice each);
#  - ChAT-IRES-Cre (WT, 12 mice), Drd2 f/f (7 mice) and ChAT-IRES-Cre; Drd2 f/f (Drd2-cKO, 8 mice)
#    with rDAh and Ach3.0 (Fig. 4g);
#  - iGluSnFR (glutamate, 4 mice), jRCaMP1b in thalamic terminals (6 mice), GCaMP8 in cortical
#    terminals (5 mice); TelC or mCherry in cortex (Vglut1-Cre, retrograde; 5 and 4 mice) or thalamus
#    (Vglut2-Cre; 5 and 3 mice) with Ach3.0 in the VLS;
#  - slice recordings (amperometry, cell-attached CIN firing, 9 WT and 9 Drd2-cKO cells), retrograde
#    Ctb tracing (3 mice) and histology.
# Behaviour sessions per cohort are given in the Extended Data legends (n = 7 or 8 mice in Extended
# Data Fig. 1). The dandiset (title "Photometry data underlying the analyses in Chantranupong PMID
# 37557915") is described as photometry and behaviour from the 2ABT, with Ach, DA and GCaMP
# recordings; whether it holds each cohort is the author's to find.
#
# Shared method, cited once here and named in the criteria.
#  Signal (Supplementary Methods, Signal demodulation). Rolling z-score (1 min) of the modulated
#  signal; spectrogram demodulation with 216-sample windows and 108-sample overlap (54 ms); power
#  averaged over an 8-Hz band about the carrier; a second rolling z-score (1 min) for z-scored
#  traces. Trials are aligned to side-port entry (SE) unless said otherwise.
#  Windows (Supplementary Methods, Quantitative analyses of signals). The Methods fix a 0.918-s
#  window of 17 samples before ("pre") or after ("post") side entry (0.756 s, 14 samples, for the
#  ITI comparisons), but not whether the side-entry sample is in it. Readings W1, post = samples +1
#  to +17 and pre = -17 to -1; W2, post = 0 to +16 and pre = -16 to 0. The code's windows are
#  variants, shown but not deciding: in aa_processStats_final_Fig1_AllDA.m and _Fig1_Ach_Words.m,
#  post = 0 to +18 and pre = -18 to 0 (19 samples); in the Fig. 1f, Fig. 3 and Drd2 scripts with
#  startDrop = -1, post = +1 to +18 and pre = -18 to -1; in aa_processStats_final_Fig1_AllAch.m,
#  0 to +10 and -10 to 0.
#  Measures (same section, and processStats_SIMPLE.m). Per trial, mean DA = the mean of the z-scored
#  DA trace in the window; delta-Ach = the maximum minus the minimum of the z-scored Ach trace in the
#  window. The code computes both per trial; Extended Data Fig. 3b could also be read as max minus
#  min of the trial-averaged trace, but that reading gives no per-mouse test, so it is shown only.
#  Per-mouse test. The legends say "two-sided t-test (P < 0.05)" per mouse; the Supplementary
#  Methods say "Paired t-tests were used ... unless otherwise noted". Trials of two conditions in
#  one mouse are not matched, so a paired test within a mouse is not defined; the code
#  (processStats_SIMPLE.m) uses ttest2, a two-sample t-test with pooled variance on the per-trial
#  values of each mouse, trials pooled across that mouse's sessions. This is test T1. Across mice,
#  test T2 is a paired two-sided t-test of the per-mouse means of the two conditions (the reading
#  of "paired" that the data allow). Claims on per-mouse panels are judged with T1 per mouse; T2 is
#  reported.
#  LDA (Supplementary Methods, last paragraph, and processStats_SIMPLE.m). Per mouse, trials of the
#  two conditions, each trial's window trace as features; classes balanced to the smaller count;
#  70% training and 30% test; MATLAB fitcdiscr with automatic hyperparameter optimisation; the
#  test-set accuracy is reported.
#  Trial histories (Fig. 1g,h; the code's words, Beron et al. 2022). "Stay" trials repeat the
#  previous port; "switch" trials change port. Win-win = AA (stay) or AB (switch), lose-win = aA
#  or aB, win-lose = Aa or Ab, lose-lose = aa or ab, previous trial first.
#  Cross-correlation (Supplementary Methods, Cross-variance analyses). MATLAB xcorr with the
#  "normalized" option on z-scored signals. A positive lag means changes in DA precede changes in
#  Ach. Trial-segregated signals take 40 samples before and 100 after centre-port entry per trial,
#  concatenated; noise = each trial minus the trial-averaged signal. The code (anaCrossCor.m) aligns
#  to side entry and divides the residuals by the across-trial s.d.; these are variants.
schema_version: 2
dataset:
  archive: dandi
  id: "001767"
paper: doi:10.1038/s41586-023-06492-9
claims:
- id: ed1b-switch-after-block-transition
  statement: After a block transition, mice transiently increase their probability of switching
    ports, which brings them to the new high-reward-probability port.
  source: Results, Adaptive switching in decision-making, paragraph 2; Extended Data Fig. 1b,c
  quote: After successive unrewarded trials resulting from reversals of the reward probability at
    block transitions, the mice transiently increase their probability of switching ports between
    trials
  criterion: From the behaviour code (block_transition_stats.ipynb), P(switch) and P(high port) by
    trial position from the block transition, per mouse, over the n = 8 mice of Extended Data Fig. 1.
    Reproduced when, in the mean over mice (the panels show mean ± s.e.m.), P(switch) over the
    first 10 trials after the transition exceeds the mean over the 10 trials before it, P(switch)
    returns towards the pre-transition level later in the block, and P(high port) rises after the
    transition (the exponential time constant tau_highport, fitted over block positions 0 to 30 as
    in the code, is positive). The per-mouse values are reported. The 10-trial span is a standard
    choice for a plotting range; the paper does not fix it.
- id: ed1hj-rflr-predicts-switching
  statement: The three-parameter RFLR model (alpha, beta, tau) predicts the switching dynamics at
    block transitions and the conditional switch probabilities given the past two trials.
  source: Results, Adaptive switching in decision-making, paragraph 3; Extended Data Fig. 1f-j
  quote: the RFLR model accurately predicts the switching dynamics at block transitions as well as
    the probability of switching on the current trial, which depends on the choice and reward
    history of previous trials
  criterion: RFLR fitted by maximum likelihood with stochastic gradient descent (Supplementary
    Methods, Behavior performance analysis; bandit_models.py). The paper does not say how train and
    test sessions are split; the readings are (a) fit and evaluate on held-out sessions per mouse,
    (b) on all sessions pooled. Reproduced when, under both, the model's conditional switch
    probabilities for the two-trial histories of Extended Data Fig. 1j fall within the binomial
    standard error bars of the mice's for most histories, and the predicted P(switch) and P(high
    port) around block transitions follow the observed curves (correlation above 0.9 across block
    positions; a standard threshold for "accurately", named as such).
- id: fig1e-reward-outcome-post
  statement: After side-port entry, unrewarded trials show a lower mean DA and a larger delta-Ach
    than rewarded trials, in DA (13 mice) and Ach (14 mice) recordings.
  source: Results, Ach and DA are dynamically regulated, paragraph 2; Fig. 1d,e
  quote: Reward outcome greatly alters DA and Ach transients, with unrewarded trials resulting in a
    robust decrease in mean DA and a consistent increase in ∆Ach (Fig. 1e )
  statistics:
  - test: two-sided t-test, per mouse
    p: 0.05
    p_relation: "<"
    n: 13 DA mice and 14 Ach mice, trials within each mouse
  criterion: Shared method in the header (signal, windows W1 and W2, per-trial measures, T1 per
    mouse, T2 across mice), rewarded against unrewarded trials, post window, as in
    aa_processStats_final_Fig1_AllDA.m and _Fig1_Ach_Words.m. Reproduced when, under each window
    reading, mean DA is lower and delta-Ach higher in unrewarded trials in more than half of the
    mice with T1 p < 0.05. "Robust" and "consistent" are read as this count, a reading named here;
    the paper does not give one. T2 across mice is reported, as the header says, and does not
    decide.
- id: fig1e-reward-outcome-not-pre
  statement: Before side-port entry, mean DA and delta-Ach do not differ significantly between
    rewarded and unrewarded trials.
  source: Results, Ach and DA are dynamically regulated, paragraph 2; Fig. 1e
  quote: Notably, the changes are significant after ('post'), but not before ('pre') side entry
  criterion: A claim of absence, judged on the paper's test, T1 per mouse (two-sided t-test,
    p < 0.05) on the pre window, readings W1 and W2 (header). Reproduced when fewer than half of the
    DA mice and fewer than half of the Ach mice show a significant pre difference (the count
    mirrors that of fig1e-reward-outcome-post; the paper gives none); not reproduced otherwise. The per-mouse differences and T2 across mice are reported either way.
- id: fig1e-lda-accuracy
  statement: An LDA classifier separates rewarded from unrewarded trials with accuracy above 80%
    when trained on post-side-entry signals and around 50% (chance) when trained on pre-side-entry
    signals.
  source: Results, Ach and DA are dynamically regulated, paragraph 3; Fig. 1e
  quote: the LDA classification accuracy is very high when trained on the signals post-side entry
    (higher than 80%), but not when trained on those pre-side entry (around 50%) (Fig. 1e )
  expected:
  - quantity: LDA test accuracy, pre-side entry
    value: 50
    tolerance: 5
    unit: percent
  criterion: LDA as in the header, windows W1 and W2, DA and Ach separately. The post value is a
    bound, met when accuracy exceeds 80%. The paper prints a percentage per mouse and does not say
    whether "higher than 80%" means every mouse or the mean; the readings are (a) the mean over
    mice, (b) every mouse. Reproduced when post accuracy exceeds 80% and pre accuracy is within
    the expected value under one reading, for both DA and Ach.
- id: ed3-not-lateralized
  statement: DA and Ach transients do not differ between trials to the port ipsilateral and
    contralateral to the fibre; DA shows no significant difference and Ach differences are
    inconsistent in direction with poor LDA accuracy.
  source: Supplementary Results, Analysis of lateralization of DA and Ach signals; Extended Data
    Fig. 3d-f
  quote: Differences between these trials were not statistically different for DA (Extended Data
    Fig. 3e). Any significant differences for Ach were inconsistent in directionality, and the LDA
    classification accuracy was poor
  statistics:
  - about: DA, ipsilateral against contralateral trials, per mouse
    test: two-sided t-test, per mouse
    p: 0.05
    p_relation: ">"
    n: 7 DA mice
  criterion: A claim of absence, judged on the paper's test, T1 per mouse at p < 0.05, ipsilateral
    against contralateral trials, rewarded and unrewarded separately, post window (W1, W2), as in
    processStats_Fig1_DA_RL_RewNR.m (right against left port). Which side is ipsilateral needs the
    hemisphere of each fibre. Reproduced for DA when no DA mouse shows a significant difference;
    for Ach when the significant differences do not share one direction across mice and the LDA
    accuracy is below 65% on average ("poor", a threshold named here). The effect sizes are
    reported either way.
- id: fig1f-cue-omission
  statement: In rewarded trials with the LED cues omitted, DA after side entry is larger and DA
    before side entry smaller than with cues, while Ach changes in the opposite direction.
  source: Results, Ach and DA are dynamically regulated, paragraph 4; Fig. 1f; Extended Data Fig. 4a
  quote: the DA transient in cue-omission rewarded trials is significantly increased after
    side-port entry and decreased before side entry, whereas Ach transients are modulated in the
    opposite direction
  statistics:
  - test: two-sided t-test, per mouse
    p: 0.05
    p_relation: "<"
    n: 4 mice
  criterion: Header method, cue-omission session against a cued session of the same mouse, as
    paired in aa_processStats_Fig1_DA_Ach_LED.m (which cued session is compared is fixed there by
    date). The Extended Data Fig. 4a legend measures Ach as the mean minimum z-scored signal, not
    delta-Ach; both are shown and the legend's minimum decides. Reproduced when, under each of W1
    and W2, in more than half of the 4 mice (at least 3, the count of fig1e-reward-outcome-post; the
    paper gives none) mean DA post is higher and pre lower without cues with T1 p < 0.05, and the
    Ach minimum moves the other way.
- id: fig1g-history-stay
  statement: In trials that repeat the previous port, lose-win trials have a larger mean DA and
    delta-Ach after side entry than win-win trials, and win-lose trials have a deeper DA dip and a
    larger delta-Ach than lose-lose trials.
  source: Results, Ach and DA are dynamically regulated, paragraph 5; Fig. 1g; Extended Data Fig. 4d,e
  quote: Indeed, mean DA and ∆Ach signals increase post-side entry in the 'lose–win' scenario ...
    Conversely, for an unrewarded trial, mean DA dips more and ∆Ach rises more if this trial was
    preceded by a rewarded trial ('win–lose')
  statistics:
  - test: two-sided t-test, per mouse
    p: 0.05
    p_relation: "<"
    n: 13 DA mice and 14 Ach mice
  criterion: Header method, stay trials, aA against AA and Aa against aa (the code's w_aA/w_AA and
    w_aa/w_Aa in aa_processStats_final_Fig1_DA_Words.m and _Fig1_Ach_Words.m), post window W1 and
    W2. Reproduced when, under each window reading, each of the four comparisons (two signals, two
    contrasts) goes in the stated direction in more than half of the mice with T1 p < 0.05 (the
    count of fig1e-reward-outcome-post). T2 across mice is reported and does not decide.
- id: fig1h-switch-no-history-post
  statement: When the mouse switches ports, the previous outcome does not change DA or Ach after
    side-port entry.
  source: Results, Ach and DA are dynamically regulated, paragraph 5; Fig. 1h; Extended Data Fig. 4d,e
  quote: Notably, these effects of expectation on DA and Ach are absent if the mouse switches ports
    between trials ... the signals after side-port entry are similar
  statistics:
  - test: two-sided t-test, per mouse
    p: 0.05
    p_relation: "<"
    n: 13 DA mice and 14 Ach mice
  criterion: A claim of absence, judged on the paper's test, T1 per mouse at p < 0.05, switch
    trials, aB against AB and Ab against ab (w_aB/w_AB, w_ab/w_Ab in the Fig. 1 scripts), post
    window W1 and W2. Reproduced when, for each comparison and signal, fewer than half of the mice
    show a significant difference; not reproduced otherwise. Effect sizes and T2 are reported.
- id: fig1h-switch-da-approach
  statement: In switch trials, DA during the move from centre to side port is larger when the
    previous trial was unrewarded.
  source: Results, Ach and DA are dynamically regulated, paragraph 5; Fig. 1h
  quote: Instead, the DA signals during the transition from centre to side port are greater when
    the previous trial was unrewarded (Fig. 1h )
  criterion: Header method, mean DA in the pre window (W1, W2), switch trials with a previous loss
    (aB and ab) against a previous win (AB and Ab), as in the code's (pre Sw)aX/AX condition
    (FNoRewSw against FRewSw). Reproduced when, under each window reading, the previous-loss mean is
    higher in more than half of the 13 DA mice with T1 p < 0.05 (the count of
    fig1e-reward-outcome-post). T2 across mice is reported and does not decide.
- id: ed4bc-iti-port-entries
  statement: DA and Ach are modulated more around port entries in unrewarded trials than around the
    same port entries during the ITI; after side entry DA dips more and Ach rises more in
    unrewarded trials, with the opposite before side entry.
  source: Supplementary Results, ITI analysis of signals; Extended Data Fig. 4b,c
  quote: DA and Ach signals are modulated to a greater extent during unrewarded trials than during
    the ITI ... DA signals dip more while Ach signals rise more after side port entry, and the opposite
    changes occur prior to side port entry
  statistics:
  - test: two-sided t-test, per mouse
    p: 0.05
    p_relation: "<"
    n: 13 DA mice and 14 Ach mice
  criterion: ITI events as the Supplementary Methods define them, centre and side entries between
    one trial's side exit and the next centre entry, separated by at least 15 samples (0.81 s)
    from other port entries and exits; windows of 14 samples (0.756 s) before and after side
    entry, readings as W1 and W2 shortened to 14 samples; Extended Data Fig. 4a,c use mean DA and
    the mean minimum of Ach. Unrewarded trial side entries against ITI side entries. Reproduced
    when, under each window reading, post DA is lower and post Ach higher in unrewarded trials, and
    pre the reverse, each in more than half of the mice with T1 p < 0.05.
- id: ed5-base-glm-r2
  statement: A base GLM of behavioural events explains about a fifth of the variance of
    trial-associated DA and Ach signals (test R2 0.206 for each).
  source: Results, Action-outcome history shapes DA and Ach, paragraph 1; Extended Data Fig. 5c,d
  quote: We find that it captures substantial variance across the trial-associated data (DA GLM R 2
    = 0.206; Ach GLM R 2 = 0.206)
  expected:
  - quantity: DA base GLM test R2
    value: 0.206
    tolerance: 0.0206
  - quantity: Ach base GLM test R2
    value: 0.206
    tolerance: 0.0206
  criterion: GLM as in Methods, GLM. Binary event predictors at 54-ms bins; design matrix of 20
    shifts forward and backward (41 coefficients per predictor); ITI data excluded, data from shortly
    before centre entry to after side exit kept, with overlapping boundary samples duplicated; trials
    split 50/50 into training and test; OLS (the Supplementary GLM section says OLS suffices); R2 on
    the test set averaged over runs. DA n = 8 mice, Ach n = 9 mice. Open, as the GLM code is not
    published. (1) The predictor set; the leave-out text names centre entry, centre exit, side
    entry, side exit, lick and reward; reading P1 uses these six, P2 adds the other recorded events
    (lick offset, LED onset and offset). (2) Pooling; G1 one model over all sessions of all mice;
    G2 one model per mouse, R2 averaged; G3 one per session, averaged. (3) Runs; Y = 10 or Y = 3.
    "Shortly before" and "after" are open; a standard choice of the 20-shift span (1.08 s) is used.
    Reproduced when both R2 fall within tolerance under every reading; blocked as
    methods_underspecified when readings disagree.
- id: ed5f-leave-out
  statement: Leaving out side entry or reward raises the GLM's MSE for both DA and Ach, leaving out
    side exit or lick raises it for Ach, and leaving out centre entry or centre exit alone does not
    change it.
  source: Results, Action-outcome history shapes DA and Ach, paragraph 1; Extended Data Fig. 5f
  quote: For both DA and Ach models, the closely timed centre entry and centre exit are redundant
    because loss of either alone does not affect the model fit ... DA and Ach signals are more
    accurately reconstructed with the addition of side entry and reward predictors, and,
    additionally, side exit and lick enable better reconstructions of the Ach signal
  depends_on:
  - ed5-base-glm-r2
  criterion: GLM as in ed5-base-glm-r2, with its open readings; Y = 10 runs, each with a 50/50
    trial split held for all models, and within training a 10-fold group shuffle split by trial
    (80/20) for validation MSE (Methods, GLM). The paper reports no test; reproduced when, under
    each reading, the median validation MSE over runs rises when side entry or reward is left out
    (DA and Ach) and when side exit or lick is left out (Ach), with the 10 runs' ranges not
    overlapping the full model's, while leaving out centre entry or centre exit alone leaves the
    median within the full model's range. The range rules are a reading of "greatly increased" and
    "does not affect" named here; the paper gives no rule.
- id: ed5-history-glm-r2
  statement: Adding side entries split by the eight action-outcome histories improves the GLM, to a
    test R2 of 0.213 for DA and 0.214 for Ach, with a lower MSE and no overfitting.
  source: Results, Action-outcome history shapes DA and Ach, paragraph 2; Extended Data Fig. 5f-i
  quote: This reflects an improvement in the ability of the history GLMs to capture the variance of
    the trial-associated data (DA GLM R 2 = 0.213; Ach GLM R 2 = 0.214) without overfitting
  expected:
  - quantity: DA history GLM test R2
    value: 0.213
    tolerance: 0.0213
  - quantity: Ach history GLM test R2
    value: 0.214
    tolerance: 0.0214
  depends_on:
  - ed5-base-glm-r2
  criterion: As ed5-base-glm-r2, with side entry replaced by eight side-entry predictors, one per
    two-trial action-outcome combination (the paper does not list them; the reading is the eight
    combinations of stay or switch, previous outcome and current outcome). Reproduced when both R2
    are within tolerance and the history model's test MSE is below the base model's in every run
    ("reduced the MSE", read as every run, a reading named here), under each reading.
- id: fig2a-rdah-smaller-than-dlight
  statement: DA signals recorded with rDAh and dLight1.1 in opposite hemispheres of the same mice
    are comparable in shape, with consistently smaller amplitudes for rDAh.
  source: Results, Ach and DA release are anticorrelated, paragraph 1; Fig. 2a; Extended Data Fig. 6d
  quote: Both sensors yield comparable signals, but with consistently reduced amplitudes for rDAh
  statistics:
  - test: two-sided t-test, per mouse
    p: 0.05
    p_relation: "<"
    n: 3 mice
  criterion: Extended Data Fig. 6d compares the maximum or minimum z-scored signal in the indicated
    periods; the periods are not given in the text. The readings are the pre and post windows W1
    and W2 (header), rewarded and unrewarded trials. Reproduced when, under each reading, the
    absolute peak (maximum post in rewarded, minimum post in unrewarded) is smaller for rDAh than
    for dLight1.1 in all 3 mice, and the trial-averaged traces of the two sensors correlate above
    0.8 ("comparable", a threshold named here).
- id: ed6c-da-bilateral
  statement: DA release is highly correlated across the two hemispheres of the same mouse.
  source: Results, Ach and DA release are anticorrelated, paragraph 1; Extended Data Fig. 6c
  quote: we exploited the fact that the release of DA is highly correlated across hemispheres within
    the same mouse
  criterion: Cross-correlation of trial-segregated dLight1.1 signals from the two hemispheres, as
    in the header (n = 4 mice). Reproduced when the peak normalized cross-correlation is positive and
    above 0.7 ("highly", a threshold named here) in every mouse. The lag of the peak is reported;
    the paper says nothing of it.
- id: fig2d-anticorrelated-lag
  statement: Simultaneously recorded DA and Ach in the same hemisphere are highly anticorrelated over
    whole sessions, with the minimum at a positive lag (Ach changes follow DA changes after a short
    delay).
  source: Results, Ach and DA release are anticorrelated, paragraph 2; Fig. 2d
  quote: reveal that DA and Ach responses are highly anticorrelated with a positive time lag, which
    indicates that increases in DA might suppress Ach with a short delay (Fig. 2d )
  criterion: Supplementary Methods, Cross-variance analyses, and Signal demodulation (72-sample
    windows, 18-ms samples for Fig. 2d). Whole-session normalized cross-correlation of rDAh and
    Ach3.0 (n = 6 mice); controls are Ach against DA from another session of the same mouse, and DA
    circularly shifted by a random 1 to 10000 samples. The Fig. 2d legend says "DA lags Ach"; the
    sign is taken from the Methods (a positive lag means DA changes precede Ach changes). Reproduced
    when the mean over mice has its minimum at a positive lag below 0.3 s ("short delay", a bound
    named here), with a value below the minima of both controls (the comparison the controls are
    drawn for; the paper states no result for them). The controls' values at that lag are reported.
- id: fig2e-trial-and-noise-correlation
  statement: Trial-segregated DA and Ach signals are anticorrelated with an offset of about 100 ms
    in rewarded and unrewarded trials, and their noise components show a similar structure.
  source: Results, Ach and DA release are anticorrelated, paragraph 2; Fig. 2e; Extended Data Fig. 6f
  quote: We observed that the trial-segregated DA and Ach signals are anticorrelated with a time
    offset of around 100 ms across rewarded and unrewarded trials ... This revealed a similar
    correlation structure (Fig. 2e )
  expected:
  - quantity: lag of the minimum cross-correlation, DA leading Ach
    value: 0.1
    tolerance: 0.054
    unit: s
  criterion: Header cross-correlation, 40 samples before and 100 after centre-port entry, rewarded
    and unrewarded trials separately, signal and noise, n = 6 mice. The tolerance is one 54-ms
    sample, the resolution of the signal; "around 100 ms" is two samples. The code's alignment to
    side entry and s.d.-scaled residuals are variants. Reproduced when, for both trial types, the
    signal and the noise cross-correlations have a negative minimum at a lag within tolerance in
    the mean over mice.
- id: fig2fg-off-diagonal
  statement: The two-dimensional covariance of DA and Ach fluctuations has a negative off-diagonal
    at which DA changes precede Ach changes by about 100 ms at most times, and it nearly disappears
    when the mouse enters the side port.
  source: Results, Ach and DA release are anticorrelated, paragraph 3; Fig. 2f,g
  quote: This revealed a strong time-lagged negative covariance (Fig. 2f ), which we call the
    off-diagonal (Fig. 2g ), showing that, at most time points, changes in DA precede changes in
    Ach by approximately 100 ms ... Notably, the negative, off-diagonal covariance nearly disappears
    when the mouse enters the side port
  depends_on:
  - fig2e-trial-and-noise-correlation
  criterion: K(t1, t2) as the Supplementary Methods equation gives it, the trial mean of the
    product of residuals (each trial minus the trial-averaged signal) of DA at t1 and Ach at t2,
    per mouse and trial type, 40 samples before and 100 after centre entry; the code's division of
    residuals by the across-trial s.d. (anaCrossCor.m) is a variant. The off-diagonal is
    K(t, t + lag) at the lag of the minimum found in fig2e. Reproduced when, in the mean over the
    6 mice, the off-diagonal is negative at more than half of the time points and its magnitude in
    the samples within one sample of side entry is below a quarter of its median magnitude
    ("nearly disappears", a threshold named here). The side-entry time in centre-aligned trials
    varies by trial; the readings are (a) side-aligned windows, (b) centre-aligned windows with the
    median side-entry time.
- id: fig2h-photometry-glm
  statement: Kernels of a GLM that predicts one neuromodulator from the other show a negative
    interaction at about 100 ms; photometry alone predicts weakly (R2 0.116 for DA, 0.171 for Ach),
    and adding the photometry kernels to the history GLMs raises R2 to 0.336 for DA and 0.388 for Ach.
  source: Supplementary Results, GLM with photometry variable; Fig. 2h; Extended Data Fig. 6h
  quote: Although the DA or Ach photometry signal alone is insufficient to robustly predict the other
    (Extended Data Fig. 6h) (DA GLM R2 = 0.116; Ach GLM R2 = 0.171), incorporation of these photometry
    kernels into history GLMs for DA and Ach improves model performance without overfitting (DA GLM
    R2 = 0.336; Ach GLM R2 = 0.388)
  expected:
  - quantity: DA GLM test R2, Ach photometry only
    value: 0.116
    tolerance: 0.0116
  - quantity: Ach GLM test R2, DA photometry only
    value: 0.171
    tolerance: 0.0171
  - quantity: DA history GLM with photometry, test R2
    value: 0.336
    tolerance: 0.0336
  - quantity: Ach history GLM with photometry, test R2
    value: 0.388
    tolerance: 0.0388
  depends_on:
  - ed5-history-glm-r2
  criterion: GLM as in ed5-base-glm-r2 and ed5-history-glm-r2, with all their open readings, on
    the 6 simultaneous rDAh and Ach3.0 mice, with the other channel's z-scored signal as a
    continuous predictor with the same 41 shifts. Reproduced when the four R2 are within tolerance
    and the mean kernel has its most negative coefficient at a shift of 54 to 162 ms with the
    predicted signal following the predictor, under every reading.
- id: ed6b-separate-hemispheres
  statement: DA and Ach recorded in separate hemispheres are also anticorrelated at a positive lag,
    with a smaller positive correlation at a negative lag.
  source: Supplementary Results, Cross correlation analysis of DA and Ach transients recorded from
    independent hemispheres; Extended Data Fig. 6a,b
  quote: Cross correlation analysis of these trial-segregated signals in which DA lags Ach reveals
    an anticorrelation with a positive time lag ... In addition, there is a smaller positive
    correlation at a negative time lag
  criterion: Header cross-correlation of trial-segregated dLight1.1 and Ach3.0 signals from opposite
    hemispheres (n = 3 mice in the legend). Reproduced when the mean has a negative minimum at a
    positive lag and a positive maximum of smaller magnitude at a negative lag.
- id: fig3d-telc-abolishes-ach
  statement: TelC expressed in VLS CINs suppresses Ach release measured in vivo during rewarded
    trials.
  source: Results, Striatal DA dynamics do not require CINs, paragraph 1; Fig. 3d
  quote: potently inhibits the release of Ach from CINs in vitro (Fig. 3c ) and in vivo (Fig. 3d
  criterion: The legend gives ∆F/F0 averages (n = 3 mice); the paper reports no test and does not
    give the baseline F0. The readings for F0 are (a) the session median of the demodulated signal,
    (b) a rolling 1-min baseline. Reproduced when, under both, the peak-to-trough range of the
    trial-averaged Ach ∆F/F0 within 2 s of side entry in TelC mice is below half that of mCherry
    mice for every TelC mouse ("potently", a threshold named here).
- id: fig3c-telc-blocks-cin-evoked-da-in-vitro
  statement: In acute striatal slices, optogenetic activation of Chrimson-expressing CINs evokes DA
    release (carbon-fibre amperometry) when the CINs coexpress mCherry, and this is blocked when they
    coexpress TelC, showing that TelC inhibits Ach release from CINs in vitro.
  source: Results, Striatal DA dynamics do not require CINs, paragraph 1; Fig. 3c
  quote: potently inhibits the release of Ach from CINs in vitro (Fig. 3c )
  criterion: Methods, Amperometry recordings and Preparation of acute brain slices; 593-nm light,
    5.86 mW, 2 ms, at 180-s intervals; +600 mV constant potential, current converted to DA
    concentration by calibration. The paper gives no n, test or window for this panel. Per sweep,
    the peak DA after the light pulse minus the mean over the 1 s before it (a standard choice
    named here), averaged per slice. Reproduced when the mCherry slices show a DA rise and the
    TelC slices' mean peak is below a quarter of the mCherry mean ("potently", a threshold named
    here). A two-sample two-sided t-test across slices is reported.
- id: fig3e-striatum-wide-telc
  statement: Striatum-wide TelC in CINs causes severe behavioural defects (changed mean ITI, decision
    time and RFLR alpha), yet DA still has opposite polarity after side entry for rewarded and
    unrewarded trials.
  source: Results, Striatal DA dynamics do not require CINs, paragraph 1; Fig. 3e; Extended Data
    Figs. 7k and 9f-i
  quote: This widespread loss of Ach induced severe behavioural defects and greatly altered
    behaviourally evoked DA signals ... Nevertheless, DA retained its capacity to encode for reward,
    such that DA signals (Fig. 3e ) and their associated GLM kernels (Extended Data Fig. 7k ) maintain
    opposing polarity with reward outcome
  statistics:
  - about: mean ITI, TelC against mCherry
    test: two-sided t-test
    p: 0.023
    n: 5 mice per group
  - about: decision time, TelC against mCherry
    test: two-sided t-test
    p: 0.0001
    n: 5 mice per group
  - about: RFLR alpha, TelC against mCherry
    test: two-sided Wilcoxon rank-sum test
    p: 0.047
    n: 5 mice per group
  criterion: Behaviour metrics per mouse (behaviour code, block_transition_stats.ipynb) compared
    with the tests named. Reproduced when mean ITI and decision time differ with p < 0.05
