    coefficients; bootstrapped 95% CI of the difference (1000 resamples) for conditional switch
    probabilities, against controls, at p < 0.05. The legend's groups are TelC and mCherry mice;
    since each mouse has one hemisphere of each, the paper does not say what the control group is;
    the readings are (a) the cohort against the striatum-wide mCherry mice of Fig. 3e, (b) the
    cohort before and after expression, (c) the same mice's sessions split by the hemisphere
    recorded (TelC or mCherry). Each reading the data allow is run. Reproduced when no test is
    significant under any of them; when they disagree the claim is blocked as
    methods_underspecified.
- id: ed8f-amplitude-no-consistent-effect
  statement: Loss of local Ach release does not consistently change the amplitude of DA sensor
    transients (∆F/F0).
  source: Results, Striatal DA dynamics do not require CINs, paragraph 3; Extended Data Fig. 8f
  quote: we analysed the amplitudes of DA sensor fluorescence transients (∆ F / F 0 ), but this
    analysis did not reveal consistent effects
  criterion: The paper names no test. Per mouse, the peak ∆F/F0 of the trial-averaged DA after side
