    Drd2-cKO than both Drd2 f/f and WT, significant against both.
- id: fig5a-inputs-to-vls
  statement: Retrograde tracing from the VLS labels cells across many cortical regions and, in the
    thalamus, mainly in the parafascicular nucleus.
  source: Results, The cortex and thalamus drive Ach release, paragraph 2; Fig. 5a
  quote: We find that a broad distribution of cells from multiple cortical regions send afferents
    into the VLS (Fig. 5a ). Meanwhile, thalamic inputs into this striatal region originate
    predominantly from the parafascicular nucleus
  criterion: Histology (Ctb in the VLS, n = 3 mice). The paper gives no counts. Reproduced when
    labelled cells are found in at least three cortical areas ("multiple", a threshold named here)
    and the parafascicular nucleus holds more labelled thalamic cells than any other thalamic
    nucleus ("predominantly"), in every mouse.
- id: fig5b-glutamate-not-lateralized
  statement: Striatal glutamate varies during the task and does not differ between ipsiversive and
    contraversive trials.
  source: Results, The cortex and thalamus drive Ach release, paragraph 3; Fig. 5b
  quote: we find that striatal glutamate levels vary during the task but are not lateralized (Fig. 5b
  criterion: A claim of absence. The paper names no test for this panel; the test of its other
    lateralization claim (ed3-not-lateralized), T1 per mouse at p < 0.05 on the mean z-scored
    iGluSnFR signal in the pre and post windows (W1, W2), ipsiversive against contraversive trials,
    is used. Reproduced when fewer than half of the 4 mice show a significant difference.
- id: fig5c-glutamate-like-ach
  statement: Glutamate is suppressed before the choice and rises at side-port entry like Ach, and in
    rewarded trials shows a sustained rise during consumption that is absent in unrewarded trials.
  source: Results, The cortex and thalamus drive Ach release, paragraph 3; Fig. 5c
  quote: Glutamate signals are suppressed before the choice and increase during side-port entry in
    an analogous manner to Ach (Fig. 5c ). In rewarded trials, glutamate exhibits an extra phase of
    sustained increase during consumption, which is absent in unrewarded trials
  criterion: Trial-averaged z-scored iGluSnFR (n = 4 mice) and Ach3.0 (n = 9 mice), aligned to side
    entry. The paper gives no test. Reproduced when, in the mean over mice, glutamate in the pre
    window is below its value at centre entry, glutamate rises within 0.5 s of side entry, the
    correlation of the mean glutamate and Ach traces from -1 to +1 s about side entry is positive,
    and mean glutamate from 1 to 3 s after side entry is higher in rewarded than unrewarded trials
    with T1 p < 0.05 in at least 3 of 4 mice. The time spans are standard choices named here; the
    paper does not fix them.
- id: fig5d-terminal-calcium-coincides
  statement: Calcium activity in cortical and thalamic terminals in the VLS coincides with glutamate
    release in rewarded and unrewarded trials.
  source: Results, The cortex and thalamus drive Ach release, paragraph 3; Fig. 5d
  quote: The activities of cortical and thalamic terminals in the VLS, measured with genetically
    encoded calcium sensors, coincide with glutamate release across both trial types
  criterion: Trial-averaged z-scored jRCaMP1b (thalamic terminals, 6 mice) and GCaMP8 (cortical
    terminals, 5 mice) against iGluSnFR (4 mice), separate mice. The paper gives no test.
    Reproduced when, for each trial type, the mean calcium trace of each input correlates
    positively with the mean glutamate trace over -2 to +3 s about side entry (r above 0.5, a
    threshold named here).
- id: fig5ef-input-telc-dampens-ach
  statement: Silencing cortical or thalamic glutamatergic inputs with TelC robustly lowers Ach
    sensor ∆F/F0 across all trials, consistently across mice.
  source: Results, The cortex and thalamus drive Ach release, paragraph 4; Fig. 5e,f; Extended Data
    Fig. 13e
  quote: Loss of neurotransmission from each region robustly dampened Ach transients across all
    trials, as seen in the lowered ∆ F / F 0 of the Ach sensor signal ... The degree of suppression
    of ∆ F / F 0 was strong and consistent across mice
  criterion: Ach3.0 ∆F/F0 (F0 readings as in fig3d-telc-abolishes-ach), cortex TelC 5 mice against
    mCherry 4, thalamus TelC 5 against mCherry 3. The paper names no test. Reproduced when, under
    each F0 reading, the peak-to-trough range of every TelC mouse's trial-averaged ∆F/F0 within 2 s
    of side entry is below the smallest range among its mCherry group, for both inputs ("strong and
    consistent across mice", a threshold named here).
- id: fig5ef-input-specific-ach
  statement: In unrewarded trials, loss of cortical but not thalamic input perturbs Ach after
    side-port entry, and loss of thalamic input shifts the timing of Ach transients more than loss
    of cortical input.
  source: Results, The cortex and thalamus drive Ach release, paragraph 5; Fig. 5e,f
  quote: In unrewarded trials, loss of cortical but not thalamic inputs perturbs Ach transients after
    side-port entry, suggesting that the cortex has a specific role in driving this signal. In
    addition, loss of the thalamic input shifts the timing of Ach transients more than does loss of
    the cortical input
  criterion: Z-scored Ach (Fig. 5e,f, bottom), TelC against mCherry per input, unrewarded trials.
    The paper names no test or measure. Delta-Ach in the post window (W1, W2), the paper's Ach
    measure elsewhere, compared between the TelC and mCherry groups with a two-sample two-sided
    t-test across mice (a standard choice named here); timing as the latency of the
    trial-averaged Ach peak after side entry (likewise a choice named here). Reproduced when the cortex comparison gives p < 0.05
    and the thalamus comparison does not, and the absolute peak-latency shift from mCherry is
    larger for thalamic than cortical TelC, under each window reading.
- id: ed13-input-telc-behaviour
  statement: Cortical or thalamic TelC impairs performance, with lower reward rate and win-switch
    differences, and the RFLR shows a smaller beta and a larger tau.
  source: Results, The cortex and thalamus drive Ach release, paragraph 4; Extended Data Fig. 13f-m
  quote: Consistent with this impairment, the RFLR model description revealed a reduction in β and
    an increase in τ
  statistics:
  - about: reward rate, cortical TelC against mCherry
    test: two-sided t-test
    p: 0.022
  - about: win-switch, cortical TelC against mCherry
    test: two-sided t-test
    p: 0.025
  - about: RFLR beta, cortical TelC
    test: two-sided Wilcoxon rank-sum test
    p: 0.05
  - about: RFLR tau, cortical TelC
    test: two-sided Wilcoxon rank-sum test
    p: 0.014
  - about: reward rate, thalamic TelC against mCherry
    test: two-sided t-test
    p: 0.008
  - about: win-switch, thalamic TelC against mCherry
    test: two-sided t-test
    p: 0.0003
  - about: RFLR beta, thalamic TelC
    test: two-sided Wilcoxon rank-sum test
    p: 0.034
  - about: RFLR tau, thalamic TelC
    test: two-sided Wilcoxon rank-sum test
    p: 0.034
  criterion: Behaviour code (block_transition_stats.ipynb, bandit_models.py) with the tests the
    legends name, TelC against mCherry per input. Reproduced when, for each input, beta is lower
    and tau higher in TelC mice with p < 0.05 (two-sided Wilcoxon rank-sum), and reward rate is
    lower with p < 0.05 (two-sided t-test). The win-switch direction is not stated and is reported.
    The legend prints p = 0.05 for cortical beta; a value at or just above 0.05 is recorded as a
    match to the paper.
- id: ed2op-mutant-sensors-flat
  statement: The DA and Ach transients depend on neuromodulator binding, being absent with the
    ligand-binding-site mutant sensors.
  source: Results, Ach and DA are dynamically regulated, paragraph 1; Extended Data Fig. 2k-p
  quote: and that depended on neuromodulator binding, because they were absent in ligand-binding-site
    mutants of the sensors
  criterion: Rewarded-trial ∆F/F0 of dLight1.1 against its D103A mutant and Ach3.0 against its
    mutant (n = 4 mice each; F0 readings as in fig3d-telc-abolishes-ach). The paper gives no test.
    Reproduced when the peak-to-trough range of the trial-averaged mutant trace within 2 s of side
    entry is below a quarter of the wild-type sensor's in every mouse ("absent", a threshold named
    here).
