# Claims for Bittner, Williamson, Snyder, Litwin-Kumar, Doiron, Chase, Smith & Yu (2017),
# "Population activity structure of excitatory and inhibitory neurons", PLoS ONE 12(8),
# e0181773, tested on CRCNS pvc-11.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-11-10, protocol as stated in docs/protocol.md.
#
# Text read: the version of record, PMC5560553 (open access), from the Europe PMC full-text
# XML: main text, Materials and methods, figure legends, and the legends of the supplement
# (S1 to S6 Fig, figures only; the supplement holds no text or tables beyond its legends).
# No PDF was available, so no figure was read; the claims rest on the text and legends.
# The Fig 7 legend in the text names panels A to D while the Results cite Fig 7A to 7F; the
# Results' lettering is used here (A, D for V1; B, E for the clustered network; C, F for the
# non-clustered network). The Methods ("Fig 6A") and the Discussion ("cf. Fig 6") cite Fig 6
# for the V1 analysis; Fig 7 is meant.
#
# Code read. (1) github.com/sbittner12/litwin-kumar_doiron_cluster_2012 at commit
# 438289358d0367047cc578dcd519ad0f7948808e: sim.jl and runsim.jl (Julia), the clustered
# balanced network of Litwin-Kumar & Doiron (2012): 4,000 E and 1,000 I leaky
# integrate-and-fire neurons, 50 clusters of 80, dt 0.1 ms, biases uniform in 1.1 to 1.2 (E)
# and 1 to 1.05 (I), T = 2,000 ms, and a stimulus to neurons 1 to 399 in the last 500 ms.
# Its weights agree with the Methods except the same-cluster E-E weight (code 1.9 x
# 10/(15 sqrt(800)) = 0.0448; Methods 0.0456). The code holds no non-clustered network, no
# spike counting and no factor analysis. (2) github.com/adam-neuro/waveformClassification at
# commit 062762678299198f61e5d8b2042bdccba695d72f (MATLAB): average waveforms from NEV files,
# a two-Gaussian fit of each average waveform and of its derivative (first 1 ms), and a
# two-component Gaussian mixture (10 replicates, random starts) on three fitted parameters
# (coefVals 5, 6 and 7+10, documented as time of the after-hyperpolarization, its width, and
# rise plus fall rate), trained on units above the 25th percentile of SNR in each file and
# with mean waveform correlation to the other units above 0.5; the component with the smaller
# mean of the first parameter is the narrow (fast) class. Its SNR is the waveform's
# peak-to-trough amplitude over twice the standard deviation of the residuals. The factor
# analysis code is not linked.
#
# Data the paper used. Models: two balanced networks (clustered and non-clustered), spontaneous
# activity (zero input), spike counts in one-second windows ("trials"), up to 20,000 trials
# per sampling, with five non-overlapping sets of trials. These simulations are not deposited;
# the model claims are data elsewhere, to be rerun from the network code. V1: spontaneous
# activity (gray screen, 20 to 30 min) from Utah arrays in four V1 hemispheres of three
# anesthetized macaques (sufentanil 6 to 18 ug/kg/hr, vecuronium), sorted off line, kept when
# the firing rate exceeds 1 spike/s and the SNR exceeds 1.33 (median SNR per array 2.96, 2.75,
# 2.50 and 2.31), cut into one-second trials (at least 1,200 per array), classified by
# waveform as broad-spiking (putative E) or narrow-spiking (putative I) at 85% posterior
# probability, giving 24/39, 41/72, 23/60 and 47/25 broad/narrow neurons per array; 23 of each
# type, chosen at random, enter the analysis of each array. The recordings are those of Smith &
# Kohn (2008) and Kelly et al. (2010). CRCNS pvc-11 describes six spontaneous arrays from four
# monkeys, so the four arrays used are to be identified (claim v1-array-link). The data
# description lists spike times, channels, the array map and an SNR per unit, and no
# waveforms; the waveform classification needs average waveforms, which is for the author to
# check.
#
# Method details fixed by the paper, used in every factor analysis (FA) criterion below
# (Materials and methods, Factor analysis): FA fit by EM; the number of latent dimensions m
# chosen by maximum cross-validated data likelihood with four folds; FA then refit with that m
# on all the sampled trials (stated for Fig 4, read as the rule throughout); d_shared is the
# number of eigenvalues of LL^T needed to explain 95% of shared variance; percent shared
# variance of neuron k is L_k L_k^T / (L_k L_k^T + Psi_k), averaged over the neurons of a type.
# Open details, used in every FA criterion: the grid of candidate m (reading used, every m from
# 0 to n-1, which holds any narrower grid's peak), the EM convergence rule and initialisation
# (standard choices, cannot change the outcome beyond run-to-run noise), and the assignment of
# trials to the four folds (contiguous blocks or random; both run).
#
# Model simulation details, used in every model claim: the network of sim.jl, without its
# stimulus (the Discussion says the model activity is spontaneous, zero input), with the
# Methods' weights (same-cluster J 0.0456; the code's 0.0448 as a variant); the non-clustered
# network as the Methods give it (p_EE 0.2, J_EE 0.024, the rest unchanged), which the code
# allows by setting ratiopee and ratioejee to 1. Open: the simulated duration (at least five
# non-overlapping sets of 20,000 one-second trials for Fig 5C, if its sets do not overlap; one
# reading uses five sets of 10,000 for Fig 3 and 5B and the same 50,000 trials, overlapping,
# for 20,000-trial sets), the initial transient discarded (a standard choice of 1 s), the
# network seed (one network per type, as the paper analysed one representative network).
schema_version: 2
paper: doi:10.1371/journal.pone.0181773
claims:
- id: v1-array-link
  kind: link
  statement: The four V1 arrays the paper analysed can be identified among the spontaneous
    recordings of CRCNS pvc-11, from four hemispheres of three monkeys, by their kept neurons'
    median SNRs of 2.96, 2.75, 2.50 and 2.31.
  source: Materials and methods, Neural recordings, paragraph 2; Data Availability
  quote: For our analysis, we only used neurons which had average firing rate greater than one
    spike per second, and signal-to-noise ratio (SNR), computed as the average waveform amplitude
    divided by the standard deviation across waveforms, greater than 1.33. Median SNR values were
    2.96, 2.75, 2.50, and 2.31 for each of the four arrays.
  expected:
  - quantity: median SNR of kept neurons, first array
    value: 2.96
    tolerance: 0.296
  - quantity: median SNR of kept neurons, second array
    value: 2.75
    tolerance: 0.275
  - quantity: median SNR of kept neurons, third array
    value: 2.50
    tolerance: 0.25
  - quantity: median SNR of kept neurons, fourth array
    value: 2.31
    tolerance: 0.231
  criterion: For each spontaneous array, keep units with mean firing rate over the whole
    recording above 1 spike/s and SNR above 1.33, and take the median SNR of those kept. The
    SNR is open between (a) the dataset's SNR field, which its description defines as the
    Methods do, and (b) the waveform code's getSNR (amplitude over twice the residual standard
    deviation), when waveforms are available. Reproduced when four arrays, from four
    hemispheres of three monkeys, match the four medians within tolerance one to one under
    one reading, and no other set of four does as well; the matched arrays are the ones the V1
    claims use. When no set matches, the four arrays from three monkeys whose broad/narrow
    counts (claim v1-classification-counts) come closest are used, as a recorded assumption.
