- id: fig4a-mode-structure
  statement: In the clustered network the dominant modes of the excitatory population give
    same-cluster neurons similar values, describing co-variation between clusters, while the
    modes of the non-clustered excitatory population and of both inhibitory populations show no
    obvious structure.
  source: Results, Excitatory clustering affects modes of shared activity in both the excitatory
    and inhibitory populations, paragraph 1; Figure 4A
  quote: Same-cluster neurons had similar values within each mode for the excitatory population of
    the clustered network, indicating that the dominant modes describe co-varying activity between
    clusters. In contrast, the excitatory population of the non-clustered network ( Fig 4A ,
    top-right) and both inhibitory populations ( Fig 4A , bottom) did not exhibit any obvious
