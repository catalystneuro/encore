- id: fig2f-medulla-heat-rise-then-fall
  statement: In embedded heat-ramp larvae, medulla activity more than doubles with warming, to
    3.6 ± 0.4 peaks/min, then falls sharply below control levels before the brain-wide
    depolarization (significant time by heat ramp and time squared by heat ramp interactions).
  source: Results, Warming Causes Neural Dysfunctions Near the Upper Thermal Limit, paragraph 2;
    Figure 2F; Table S4
  quote: in heat-ramp fish, the medullar activity more than doubled with temperature, and reached
    3.6 ± 0.4 peaks/min prior to a sharp decline below control levels before a large seizure-like
    brain-wide depolarization occurred
  statistics:
  - about: time by heat ramp
    test: linear mixed-effects model, fish as random factor
    statistic: β = 0.23, SE 0.03, t = 8.00
    p: 0.001
    p_relation: "<"
    n: 11 heat-ramp and 8 control fish, 266 observations
  - about: time squared by heat ramp
    test: linear mixed-effects model, fish as random factor
    statistic: β = -0.01, SE 0.00, t = -8.81
    p: 0.001
    p_relation: "<"
  expected:
  - quantity: peak medulla calcium peak frequency, heat-ramp fish
    value: 3.6
    tolerance: 0.4
    unit: peaks/min
  depends_on:
  - fig2f-medulla-control-stable
  criterion: The Table S4 model as in fig2f-medulla-control-stable. Reproduced when both
