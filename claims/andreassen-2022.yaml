  statistics:
  - about: 37 °C against 34 °C
    test: linear mixed-effects model, releveled, fish as random factor
    p: 0.001
    p_relation: "<"
    n: 9 fish, 50 observations
  - about: depolarization category against 37 °C
    test: linear mixed-effects model, releveled, fish as random factor
    p: 0.6
  expected:
  - quantity: mean heart rate, 37 °C category
    value: 4.7
    tolerance: 0.2
    unit: Hz
  - quantity: Q10, 34 to 37 °C
    value: 0.6
    tolerance: 0.06
