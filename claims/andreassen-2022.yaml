- id: fig2f-medulla-control-stable
  statement: In embedded control larvae held at 28 °C, medulla activity stays stable at 1.6 ± 0.1
    calcium peaks/min, with no effect of time.
  source: Results, Warming Causes Neural Dysfunctions Near the Upper Thermal Limit, paragraph 2;
    Figure 2F; Table S4
  quote: Medullar activity remained stable at 1.6 ± 0.1 peaks/min in the control fish
  statistics:
  - about: linear time effect in controls
    test: linear mixed-effects model, fish as random factor
    p: 0.4
    n: 8 control and 11 heat-ramp fish, 266 observations
  - about: quadratic time effect in controls
    test: linear mixed-effects model, fish as random factor
    p: 0.3
  expected:
  - quantity: mean medulla calcium peak frequency, control fish
    value: 1.6
    tolerance: 0.1
    unit: peaks/min
  criterion: Model as SI Statistical Analyses and Table S4 give it. Peak frequency (mean of the
    two medullae) on treatment, time (minutes from the start of the measuring period), time
    squared and their interactions with treatment, random intercept per fish, 19 fish. A claim
    of absence for the control time terms. Reproduced when the control time and time squared
    terms both have p >= 0.05 and the control mean frequency is within tolerance. Open, with
    readings shown, is the 1.6 itself (a) the mean over all control time bins and fish, (b) the
    mean of per-fish means; and how p-values were obtained for lmer (Satterthwaite via lmerTest
