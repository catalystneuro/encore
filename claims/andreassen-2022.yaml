# Claims for Andreassen, Hall, Khatibzadeh, Jutfelt & Kermen (2022), "Brain dysfunction during
# warming is linked to oxygen limitation in larval zebrafish", PNAS 119, e2207052119, on Figshare
# item 19640805.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-26,
# protocol as stated in docs/protocol.md (version pilot-19).
#
# Text read: the version of record (open access, PMC9522358), as served by Europe PMC from its
# JATS XML, in paper/10.1073-pnas.2207052119.txt: Significance, introduction, Results, figure
# legends of Figs. 1 to 6, Discussion, Methods and Data availability; and the SI Appendix
# (pnas.2207052119.sapp.pdf), appended to the same file: legends of Figs. S1 to S4, Movies S1 to
# S3, SI Statistical Analyses and the captions of Tables S1 to S10. The bodies of Tables S1 to
# S10 are images and are not in the text; they were read from the rendered pages 6 to 11 of
# paper/10.1073-pnas.2207052119.supp-sapp.pdf. Values quoted from those tables have no sentence
# in the text and are marked as read from the table. The quote checker cannot find three
# p-values printed only in those images (0.233 in Table S1; 0.008 and 0.030 in Table S10); they
# were confirmed by reading the rendered pages.
#
# Code read: none. The R code for the statistical analyses and figures is deposited in the same
# Figshare item as the data (doi:10.6084/m9.figshare.19640805, "Data and R script for ..."), and
# the reader does not open the dataset's files. It may settle details named as open below
# (outlier handling, temperature binning, the p-value method of the mixed models, the Q10
# endpoints); the author should read it and record what it fixes.
#
# Data the paper used. All fish are Tg(elavl3:GCaMP6s) zebrafish in the nacre background
# (Methods, Animals and Housing). Five experiments on different fish (Methods, Experimental
# Design), heat ramp 0.3 °C/min from 28 °C:
#   Experiment 1. CTmax (temperature at loss of response, first of three consecutive touches
#     without escape) in freely swimming larvae: 5 dpf heat-ramp fish n = 12, 5 dpf controls
#     held at 28 °C n = 14, 9 dpf n = 12; adults (7 to 10 months, loss of equilibrium for 2 s)
#     n = 16 tested, 15 in Fig. 1C after one extreme outlier. Behaviour (manually tracked
#     position, average speed at 28 to 29, 31 to 32, 34 to 35, 37 to 38 °C and the 1 °C before
#     CTmax; spiral swimming and loss of equilibrium in the 12 min before CTmax).
#   Experiment 2. Agar-embedded 5 dpf larvae, epifluorescence at 5 Hz: heat-ramp n = 11,
#     control n = 8. Medulla calcium peak frequency (peaks/min, mean of left and right medulla),
#     depolarization onset temperature (whole-brain fluorescence, low-pass 0.01 Hz, derivative
#     above baseline mean + 5 SD).
#   Experiment 3. Freely swimming larvae imaged at 5 Hz, n = 7: CTmax and depolarization onset
#     (onset picked by two investigators, averaged) in the same fish.
#   Experiment 4. Laterally embedded larvae, 20 Hz, n = 9 (1 of 10 excluded): heart rate by
#     continuous wavelet transform in temperature categories 28, 31, 34, 37 °C, depolarization
#     (60 s before to 30 s after peak) and after return to 28 °C; medulla peaks counted by eye.
#   Experiment 5. Oxygen at 60% (hypoxia), 100% (normoxia), 150% (hyperoxia) air saturation,
#     collected in two periods (July 2020, January 2021; "Experiment" factor). CTmax in freely
#     swimming larvae (n = 24, 28, 21 after outliers; 76 before). Embedded larvae: depolarization
#     onset, amplitude and recovery time (n = 14, 12, 14; recovery 14, 12, 13), medulla peak
#     frequency (n = 12, 10, 11), optic tectum responses to 2 s red light flashes every 30 s,
#     scored response or no response (n = 14, 11, 13).
# The Figshare item's title and description say it holds the data and the R script for the
# statistics and figures (CSV, R script and text; 12 files, about 0.1 MB), so it holds derived
# per-fish values and no imaging. Which measures it holds is the author's to find.
#
# Statistics (Methods, Statistical Analyses; SI Statistical Analyses): R 4.1.1; ANOVAs (linear
# models) on independent measures; linear mixed models with fish identity as a random intercept
# (lme4 lmer, v1.1-27.1) on repeated measures; experiment period as a fixed factor for
# experiment 5; models shown with and without extreme outliers (< Q1 - 3 IQR or > Q3 + 3 IQR);
# alpha 0.05, and 0.001 for the releveled heart rate model. How p-values were obtained for the
# mixed models is not said (lme4 gives none); see the claims concerned.
#
# Inconsistencies in the text, noted for the author: Fig. S1C's legend gives n = 14 heat-ramp
# and 12 control fish, Table S2 and Fig. S1A give 12 heat-ramp and 14 control. Fig. 2F's legend
# says 50 min before depolarization, SI Statistical Analyses says the trial start is 42 min
# before. Methods, In freely moving fish, says experiment 2 where the freely swimming imaging is
# experiment 3. Fig. S3D gives n = 14, 12, 14 for medulla frequency, Fig. 5D gives 12, 10, 11.
#
# Not claimed: the introduction and Discussion's literature comparisons (spreading depolarization
# speeds, other species), the temperature homogeneity of the arena (a method check), and the
# mortality of 6 of 92 larvae after CTmax (a method).
schema_version: 2
paper: doi:10.1073/pnas.2207052119
claims:
- id: fig1c-ctmax-5dpf
  statement: Using loss of response as the end point, 5-day-old heat-ramp larvae reach CTmax at
    41.4 ± 0.1 °C (mean ± SE, n = 12).
  source: Results, CTmax Is Similar in Larval and Adult Zebrafish, paragraph 3; Figure 1C
  quote: Using the loss of response as the end point for CT max , we found that 5-d-old heat-ramp
    fish reached CT max at 41.4 ± 0.1 °C
  expected:
  - quantity: mean CTmax, 5 dpf heat-ramp larvae
    value: 41.4
    tolerance: 0.1
    unit: °C
  criterion: Mean over the 12 heat-ramp 5 dpf fish of experiment 1. The tolerance is the
    reported SE.
- id: fig1c-ctmax-similar-across-ages
  statement: CTmax is similar in 5 dpf larvae, 9 dpf larvae (41.3 ± 0.2 °C, n = 12) and adults
    tested by loss of equilibrium (41.0 ± 0.1 °C, n = 15), with no significant difference between
    the ages.
  source: Results, CTmax Is Similar in Larval and Adult Zebrafish, paragraph 3; Figure 1C; Table S3
  quote: We repeated the experiment with 9-d-old fish ( n = 12) and found that they reached CT max
    at similar temperatures (41.3 ± 0.2 °C ... adult zebrafish ( n = 15) tested using the
    loss-of-equilibrium protocol ( 8 ) reached CT max at similar temperatures (41.0 ± 0.1 °C) as
    those of larvae
  statistics:
  - about: 5 dpf against 9 dpf
    test: linear model (ANOVA) of CTmax on age, extreme outlier removed (Table S3, Model 2)
    p: 0.7
    n: 12 5 dpf, 12 9 dpf and 15 adult fish
  - about: 5 dpf against adult
    test: linear model (ANOVA) of CTmax on age, extreme outlier removed (Table S3, Model 2)
    p: 0.07
  - about: 9 dpf against adult
    test: linear model (ANOVA) of CTmax on age, extreme outlier removed
    p: 0.2
  - about: overall effect of age, outlier removed (Table S3, Model 2)
    test: ANOVA
    statistic: F(2,36) = 1.89
    p: 0.17
  expected:
  - quantity: mean CTmax, 9 dpf larvae
    value: 41.3
    tolerance: 0.2
    unit: °C
  - quantity: mean CTmax, adults (outlier removed)
    value: 41.0
    tolerance: 0.1
    unit: °C
  criterion: A claim of absence, judged on the paper's test. As SI Statistical Analyses and Table
    S3 describe, a linear model of CTmax on age (5 dpf, 9 dpf, adult) after removing the one adult
    outside Q1 - 3 IQR (Model 2, 39 fish); the pairwise p-values the text gives (0.7, 0.07) are
    those of Model 2, and the 9 dpf against adult p is from the model releveled to 9 dpf.
    Reproduced when no pairwise contrast has p < 0.05; the contrasts and the overall F are
    reported. Model 1, with all 16 adults (adult against 5 dpf p = 0.038 in Table S3), is shown
    as a variant. Whether the adult mean of 41.0 °C is over 15 fish (outlier removed, as the
    n = 15 of Fig. 1C implies) or over 16 is open; both are reported, and the expected value is
    judged on the 15.
- id: figs1a-swim-speed-no-treatment-difference
  statement: Swimming speed falls during the assay (from 2.9 ± 0.4 to 1.7 ± 0.4 mm/s), with no
    difference between control and heat-ramp larvae.
  source: Results, CTmax Is Similar in Larval and Adult Zebrafish, paragraph 2; Figure S1A; Table S1
  quote: There was no difference in swimming speed between control and heat-ramp fish throughout
    the assay
  statistics:
  - about: treatment (heat ramp against control), Table S1 model including treatment
    test: linear mixed-effects model, fish as random factor
    statistic: β = 0.76, SE 0.62, t = 1.22
    p: 0.233
    n: 26 fish (14 control, 12 heat ramp), 130 observations
  - about: time interval 5 against time interval 1
    test: linear mixed-effects model, fish as random factor
    statistic: b = -1.2 ± 0.4 mm/s, t(100) = -2.4
    p: 0.015
  expected:
  - quantity: mean speed, time interval 1 (Table S1 intercept)
    value: 2.9
    tolerance: 0.4
    unit: mm/s
  - quantity: mean speed, time interval 5
    value: 1.7
    tolerance: 0.4
    unit: mm/s
  criterion: A claim of absence, judged on the paper's test (SI Statistical Analyses, Table S1).
    A linear mixed model of speed on time interval (five levels, categorical, interval 1 in the
    intercept) plus treatment, random intercept per fish, 26 fish. Reproduced when the treatment
    effect has p >= 0.05; its estimate is reported either way. The legend's "no difference in
    the change" would need a time by treatment interaction, which Table S1 does not fit; that
    model is shown as a variant. How the mixed model's p-values were obtained is not stated
    (Satterthwaite t-tests via lmerTest are the reading the reported t(100) fits); the
    expected values are the speed model's intercept and intercept plus time 5 estimate. The
    Table S1 p for time 5 (0.017) and the legend's (0.015) differ; both are reported.
- id: figs1bc-spiral-swimming
  statement: Spiral swimming occurs in the 12 min before CTmax in 10 of 12 heat-ramp larvae and in
    none of 14 controls, a significant difference.
  source: Results, CTmax Is Similar in Larval and Adult Zebrafish, paragraph 2; Figure S1B and C;
    Table S2
  quote: Spiral swimming, loss of equilibrium and loss of response occurred toward the end of the
    assay in heat-ramp fish ( SI Appendix , Fig. S1 C ) and were significantly more prevalent than
    in control fish
  statistics:
  - test: Chi-squared test
    statistic: X2(df=1,N=26) = 15.6
    p: 0.001
    p_relation: "<"
    n: 14 control and 12 heat-ramp fish
  expected:
  - quantity: heat-ramp fish with spiral swimming
    value: 10
    tolerance: 0
  - quantity: control fish with spiral swimming
    value: 0
    tolerance: 0
  - quantity: chi-squared statistic
    value: 15.6
    tolerance: 1.56
  criterion: Counts from Table S2's caption (0 of 14 control, 10 of 12 heat ramp); counts take
    tolerance 0. A chi-squared test on the 2 by 2 table of fish with and without spiral swimming
    by treatment. Whether the continuity correction was used is not said; R's chisq.test uses it
    by default for a 2 by 2 table and the reported 15.6 equals the corrected statistic for these
    counts (the uncorrected one is about 19.0), so the corrected test is the main reading and
    the uncorrected one is shown. Reproduced when the counts match, the statistic is within
    tolerance and p < 0.001.
- id: figs1d-loss-of-equilibrium
  statement: Heat-ramp larvae spend more of the 12 min before CTmax in loss of equilibrium than
    controls do over the matching period.
  source: Figure S1D; Table S2
  quote: Loss of equilibrium (% time, see Methods and Movie S2) in heat ramp and control fish
    during the same period as in C (Wilcoxon Rank Sum test
  statistics:
  - test: Wilcoxon rank sum test
    statistic: W = 27, r = 0.58
    p: 0.004
    n: 14 control and 12 heat-ramp fish
  expected:
  - quantity: effect size r
    value: 0.58
    tolerance: 0.058
  criterion: Per fish, the percentage of time in loss of equilibrium (tilted to the side for at
    least 1 s, Methods, CTmax assay data analysis) over the 12 min before CTmax or the matching
    control period; a two-sided Wilcoxon rank sum test of heat ramp against control. Reproduced
    when p < 0.05 with the heat-ramp median higher, and r within tolerance. How r was computed is
    not said; the reading named is r = |Z| / sqrt(N) with N = 26, the usual definition. W depends
    on which group is first (27 fits control first with control lower), and is reported with
    the order stated.
