- id: fig4c-heart-rate-rises-to-34
  statement: Heart rate of embedded larvae rises from 4.4 ± 0.1 Hz at 28 °C to 5.7 ± 0.1 Hz at 34
    °C (Q10 1.5).
  source: Results, Cardiac Function Is Reduced Prior to the Brain-Wide Depolarization, paragraph
    1; Figure 4C; Table S6
  quote: The heart rate increased with a Q 10 value (i.e., the rate of change with a 10 °C
    increase in temperature) of 1.5 (from 4.4 ± 0.1 Hz to 5.7 ± 0.1 Hz) between 28 and 34 °C ( P <
    0.001)
  statistics:
  - about: 34 °C against 28 °C
    test: linear mixed-effects model, fish as random factor
    statistic: β = 1.27, SE 0.19, t = 6.88
    p: 0.001
    p_relation: "<"
    n: 9 fish, 50 observations
  expected:
  - quantity: mean heart rate, 28 °C category
    value: 4.4
    tolerance: 0.1
    unit: Hz
  - quantity: mean heart rate, 34 °C category
    value: 5.7
    tolerance: 0.1
    unit: Hz
  - quantity: Q10, 28 to 34 °C
    value: 1.5
    tolerance: 0.15
  criterion: Model from SI Statistical Analyses and Table S6, heart rate on temperature category
    (28, 31, 34, 37 °C, depolarization, after), random intercept per fish, 9 fish; alpha 0.001
