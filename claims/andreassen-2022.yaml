  source: Results, CTmax Precedes the Brain-Wide Depolarization, paragraph 1; Figure 3D; Table S5
  quote: CT max (40.9 ± 0.2 °C) preceded the brain-wide depolarization (41.4 ± 0.2 °C) ( Fig. 3 C
    ) in all individuals, by 0.5 °C on average ( P = 0.004)
  statistics:
  - test: mixed-effects model, response type as fixed effect, fish as random factor
    statistic: β = 0.50, SE 0.11, t = 4.49
    p: 0.004
    n: 7 fish, 14 observations
  expected:
  - quantity: mean CTmax, experiment 3
    value: 40.9
    tolerance: 0.2
    unit: °C
  - quantity: mean depolarization onset, experiment 3
    value: 41.4
    tolerance: 0.2
    unit: °C
  - quantity: mean difference, depolarization minus CTmax
