- id: fig5a-ctmax-oxygen
  statement: Oxygen level sets CTmax in freely swimming larvae. CTmax is 39.1 ± 0.1 °C in hypoxia
    (n = 24), 0.5 °C below normoxia (39.6 ± 0.1 °C, n = 28), and 40.1 ± 0.2 °C in hyperoxia (n =
    21), 0.5 °C above normoxia.
  source: Results, Oxygen Availability Affects Neural Function and CTmax, paragraph 1; Figure 5A;
    Table S7
  quote: CT max occurred at 39.1 ± 0.1 °C in the hypoxia treatment ( n = 24), 0.5 °C lower than in
    normoxia (39.6 ± 0.1 °C; n = 28; P = 0.007) ... CT max occurred at 40.1 ± 0.2 °C in the
    hyperoxia treatment ( n = 21), 0.5 °C higher than in normoxia ( P = 0.025)
  statistics:
  - about: hypoxia against normoxia
    test: ANOVA (linear model), outliers removed, without Experiment (Table S7, Model 2.2)
    statistic: β = -0.58, SE 0.21, t = -2.79
    p: 0.007
    n: 24 hypoxia, 28 normoxia, 21 hyperoxia fish (73 of 76)
  - about: hyperoxia against normoxia
    test: ANOVA (linear model), outliers removed, without Experiment (Table S7, Model 2.2)
    statistic: β = 0.49, SE 0.21, t = 2.29
    p: 0.025
  - about: overall model, Model 2.2
    test: ANOVA
    statistic: F(2,70) = 11.67
    p: 0.001
    p_relation: "<"
  expected:
  - quantity: mean CTmax, hypoxia
    value: 39.1
    tolerance: 0.1
    unit: °C
  - quantity: mean CTmax, normoxia
    value: 39.6
    tolerance: 0.1
    unit: °C
  - quantity: mean CTmax, hyperoxia
    value: 40.1
    tolerance: 0.2
    unit: °C
  criterion: As SI Statistical Analyses and Table S7 give it. Extreme outliers (< Q1 - 3 IQR) are
    removed, two from hyperoxia and one from hypoxia, leaving 73 fish; a linear model of CTmax on
    treatment (normoxia in the intercept) without the Experiment factor (Model 2.2), as
    Experiment was not significant in Model 2.1. Reproduced when hypoxia is lower and hyperoxia
    higher than normoxia, each at p < 0.05, and the means are within tolerance (the reported
    SEs). Open is whether the quartiles for outliers are taken within each treatment (as "two
    from the hyperoxia group" suggests) or over all fish; both are shown, and whether the same
    three fish are removed is reported. Model 1 (all 76 fish, with Experiment), in which neither
    contrast is significant (Table S7), is shown as a variant; the outcome rests on the outlier
    removal the paper made.
- id: fig5b-depolarization-oxygen
  statement: Oxygen level sets the depolarization onset in embedded larvae. It occurs at 40.2 ±
    0.3 °C in normoxia (n = 12), 2.5 °C lower in hypoxia (37.7 ± 0.5 °C, n = 14) and 1.3 °C higher
    in hyperoxia (41.5 ± 0.2 °C, n = 14).
  source: Results, Oxygen Availability Affects Neural Function and CTmax, paragraph 2; Figure 5B;
    Table S8
  quote: The brain-wide depolarization occurred at 40.2 ± 0.3 °C in normoxia ( n = 12) and occurred
    at 2.5 °C lower in hypoxia (37.7 ± 0.5 °C; n = 14; P < 0.001) ... the hyperoxia treatment ( n =
    14) increased the depolarization temperature by 1.3 °C compared with normoxia (41.5 ± 0.2 °C;
    P = 0.003)
  statistics:
  - about: hypoxia against normoxia
    test: ANOVA (linear model) with Experiment as fixed factor (Table S8)
    statistic: β = -2.69, SE 0.39, t = -6.90
    p: 0.001
    p_relation: "<"
    n: 14 hypoxia, 12 normoxia, 14 hyperoxia fish
  - about: hyperoxia against normoxia
    test: ANOVA (linear model) with Experiment as fixed factor (Table S8)
    statistic: β = 1.22, SE 0.39, t = 3.13
    p: 0.003
  - about: overall model
    test: ANOVA
    statistic: F(3,36) = 45.5
    p: 0.001
    p_relation: "<"
  expected:
  - quantity: mean depolarization onset, normoxia
    value: 40.2
    tolerance: 0.3
    unit: °C
  - quantity: mean depolarization onset, hypoxia
    value: 37.7
    tolerance: 0.5
    unit: °C
  - quantity: mean depolarization onset, hyperoxia
    value: 41.5
    tolerance: 0.2
    unit: °C
  criterion: A linear model of onset temperature on treatment (normoxia in the intercept) and
    Experiment (period 1 or 2), 40 fish, as Table S8. Reproduced when hypoxia is lower and
    hyperoxia higher than normoxia, each at p < 0.05, and the means are within tolerance (the
    reported SEs). The text's differences (2.5, 1.3 °C) are differences of raw means and the
    model estimates (-2.69, 1.22) are adjusted for Experiment; both are reported.
- id: figs3b-amplitude-no-oxygen-effect
  statement: Oxygen level does not change the amplitude of the brain-wide depolarization.
  source: Results, Oxygen Availability Affects Neural Function and CTmax, paragraph 2; Figure S3B;
    Table S8
  quote: Oxygen level did not change the amplitude of the brain-wide depolarization
  statistics:
  - about: hypoxia against normoxia
    test: ANOVA (linear model) with Experiment as fixed factor (Table S8)
    statistic: β = 14.88, SE 14.80, t = 1.00
    p: 0.3
    n: 14 hypoxia, 12 normoxia, 14 hyperoxia fish
  - about: hyperoxia against normoxia
    test: ANOVA (linear model) with Experiment as fixed factor (Table S8)
    statistic: β = -10.60, SE 14.73, t = -0.72
    p: 0.5
  criterion: A claim of absence, judged on the paper's test. Amplitude is the maximum %ΔF/F0
    returned by findpeaks after onset (Methods). A linear model of amplitude on treatment and
    Experiment, 40 fish, as Table S8. Reproduced when neither contrast with normoxia has p < 0.05;
    the contrasts are reported either way.
- id: figs3c-recovery-longer-in-hypoxia
  statement: Hypoxia prolongs the recovery time after the depolarization compared with normoxia;
    hyperoxia does not shorten it significantly.
  source: Results, Oxygen Availability Affects Neural Function and CTmax, paragraph 2; Figure S3C;
    Table S8
  quote: the oxygen limitation significantly prolonged the recovery time after the depolarization
  statistics:
  - about: hypoxia against normoxia
    test: ANOVA (linear model) with Experiment as fixed factor (Table S8)
    statistic: β = 2.57, SE 0.44, t = 5.86
    p: 0.001
    p_relation: "<"
    n: 14 hypoxia, 12 normoxia, 13 hyperoxia fish
  - about: hyperoxia against normoxia
    test: ANOVA (linear model) with Experiment as fixed factor (Table S8)
    statistic: β = -0.71, SE 0.44, t = -1.60
    p: 0.1
  expected:
  - quantity: hypoxia minus normoxia recovery time (model estimate)
    value: 2.57
    tolerance: 0.44
    unit: min
  criterion: Recovery time from peak depolarization to the return to 0% ΔF/F0, F0 the mean over
    the 5 min before onset (Methods); one hyperoxic fish excluded as its recording ended before
    baseline. A linear model of recovery time on treatment and Experiment, 39 fish, as Table S8.
    Reproduced when hypoxia is longer than normoxia at p < 0.05 with the estimate within the
    Table S8 SE, and the hyperoxia contrast has p >= 0.05.
- id: figs3d-medulla-drops-before-depolarization
  statement: In all three oxygen treatments, medulla activity drops sharply in the minutes before
    the brain-wide depolarization.
  source: Results, Oxygen Availability Affects Neural Function and CTmax, paragraph 3; Figure S3D
  quote: In all groups, the medullar activity sharply decreased in the minutes prior to the
    brain-wide depolarization
  criterion: No test is reported. Frequencies aligned to depolarization onset over the 30 min
    before it (Fig. S3D). The paper gives no window for "the minutes prior"; the readings are the
    group mean over the last 2 min and over the last 5 min before onset. Reproduced when, under
    one reading, that mean is below half the group's maximum mean in the 30 min window in each
    of the three treatments. The half is a threshold set here for "sharply", which the paper
    does not quantify; the ratios are reported.
- id: fig5d-medulla-normoxia
  statement: In normoxia, medulla activity rises with warming until 36 °C (Q10 1.8), to a maximum
    of 2.5 ± 0.4 peaks/min.
  source: Results, Oxygen Availability Affects Neural Function and CTmax, paragraph 3; Figure 5D;
    Table S9
  quote: Neural activity in the medulla increased until 36 °C (Q 10 = 1.8) in the normoxia
    treatment ( n = 10), reaching a maximum frequency of 2.5 ± 0.4 peaks/min
  expected:
  - quantity: maximum medulla peak frequency, normoxia
    value: 2.5
    tolerance: 0.4
    unit: peaks/min
  - quantity: temperature of the maximum, normoxia
    value: 36
    tolerance: 1
    unit: °C
  - quantity: Q10 of medulla frequency, normoxia
    value: 1.8
    tolerance: 0.18
  criterion: Frequencies binned by temperature, normoxia fish (n = 10). The bin width is not
    given; 1 °C bins are used, the resolution of the reported temperatures, and the temperature
    of the maximum takes a tolerance of one bin. The maximum is read as (a) the peak of the group
    mean curve or (b) the mean of per-fish maxima. Q10 as (R2 / R1) ^ (10 / (T2 - T1)) on group
    means, with endpoints read as 28 °C and the temperature of the maximum (36 °C), the span the
    sentence names. Reproduced when, under one reading, all three values are within tolerance.
- id: fig5d-medulla-hyperoxia
  statement: In hyperoxia, medulla activity rises faster with warming (Q10 1.9) and reaches a
    higher maximum, 3.3 ± 0.3 peaks/min at 37 °C.
  source: Results, Oxygen Availability Affects Neural Function and CTmax, paragraph 3; Figure 5D;
    Table S9
  quote: The frequency of calcium peaks increased at a higher rate in the hyperoxia treatment (Q 10
    = 1.9; n = 11) and reached a higher maximum frequency of 3.3 ± 0.3 peaks/min at 37 °C
  statistics:
  - about: hyperoxia by temperature against normoxia (Table S9)
    test: linear mixed-effects model, cubic temperature, fish as random factor
    statistic: β = 0.09, SE 0.02, t = 3.75
    p: 0.001
    p_relation: "<"
    n: 33 fish (12 hypoxia, 10 normoxia, 11 hyperoxia), 391 observations
  expected:
  - quantity: maximum medulla peak frequency, hyperoxia
    value: 3.3
    tolerance: 0.3
    unit: peaks/min
  - quantity: temperature of the maximum, hyperoxia
    value: 37
    tolerance: 1
    unit: °C
  - quantity: Q10 of medulla frequency, hyperoxia
    value: 1.9
    tolerance: 0.19
  depends_on:
  - fig5d-medulla-normoxia
  criterion: Binning, maximum readings and Q10 as in fig5d-medulla-normoxia, with Q10 endpoints
    28 and 37 °C (the temperature of the hyperoxic maximum). The model from SI Statistical
    Analyses and Table S9, frequency on treatment by temperature (standardized so that 28 °C is
    zero) plus temperature squared and cubed, random intercept per fish; the text does not say
    whether temperature is in °C or bins, and the deposited data's form is used. Reproduced when
    the values are within tolerance under one reading and the hyperoxia by temperature term is
    positive with p < 0.05.
- id: fig5d-medulla-hypoxia
  statement: In hypoxia, medulla activity falls with temperature from the start of the ramp, at an
    accelerating rate (Q10 0.8 from 28 to 34 °C, 0.02 from 34 to 38 °C).
  source: Results, Oxygen Availability Affects Neural Function and CTmax, paragraph 3; Figure 5D;
    Table S9
  quote: In the hypoxia treatment ( n = 12), contrarily, the frequency decreased with temperature
    from the start of the trial at an accelerating rate (Q 10 at 28 to 34 °C = 0.8; Q 10 at 34 to
    38 °C = 0.02)
  statistics:
  - about: hypoxia by temperature against normoxia (Table S9)
    test: linear mixed-effects model, cubic temperature, fish as random factor
    statistic: β = -0.16, SE 0.03, t = -5.66
    p: 0.001
    p_relation: "<"
    n: 33 fish (12 hypoxia, 10 normoxia, 11 hyperoxia), 391 observations
  expected:
  - quantity: Q10 of medulla frequency, hypoxia, 28 to 34 °C
    value: 0.8
    tolerance: 0.08
  - quantity: Q10 of medulla frequency, hypoxia, 34 to 38 °C
    value: 0.02
    tolerance: 0.002
  depends_on:
  - fig5d-medulla-normoxia
  criterion: Binning and Q10 formula as in fig5d-medulla-normoxia, with the endpoints the text
    gives. The 0.02 rests on a near-zero rate at 38 °C and is very sensitive to that bin; it is
    judged as reproduced when the computed Q10 is below 0.1 (the 10% tolerance on so small a
    value would decide on bin noise; reason for the wider tolerance), and the value is
    reported. The Table S9 model as in fig5d-medulla-hyperoxia. Reproduced when the first Q10 is
    within tolerance, the second below 0.1, and the hypoxia by temperature term is negative with
    p < 0.05.
- id: figs4ab-light-response-amplitude-falls
  statement: The amplitude of optic tectum responses to light flashes falls with increasing
    temperature in all three oxygen treatments.
  source: Results, Oxygen Availability Affects Neural Function and CTmax, paragraph 5; Figure S4A
    and B
  quote: The amplitude of light-evoked responses decreased with increasing temperature in all
    treatments
  criterion: No test is reported. Amplitude is the mean %ΔF/F0 over the 4 s after flash onset, F0
    the mean over the 2 s before (Methods). Per treatment, a Spearman correlation of amplitude
    with temperature over all flashes of all fish, a standard choice the paper does not make.
    Reproduced when it is negative with p < 0.05 in each treatment; a mixed model with a fish
    intercept is shown as a variant.
- id: fig6c-light-responsiveness-by-oxygen
  statement: Optic tectum responsiveness to light declines with heating, and its resilience
    depends on oxygen. In normoxia about 31% of flashes evoke a response until 31 °C, then fewer;
    in hypoxia responses decline from 33% from the start; in hyperoxia 36% is kept up to 36 °C,
    a gain in resilience of 5 °C.
  source: Results, Oxygen Availability Affects Neural Function and CTmax, paragraph 5; Figure 6C
  quote: In normoxia ( n = 11), the optic tectum responses were initially recorded to 31% of the
    light flashes until 31 °C, after which the responsiveness gradually decreased with further
    heating ... In hypoxia ( n = 14), the proportion of neural responses decreased from 33% from
    the start of the heat ramp. The hyperoxic treatment ( n = 13) increased the resilience of
    sensory response to heating by 5 °C, as a responsiveness of 36% was maintained up to 36 °C
  expected:
  - quantity: initial response percentage, normoxia
    value: 31
    tolerance: 3.1
    unit: "%"
  - quantity: initial response percentage, hypoxia
    value: 33
    tolerance: 3.3
    unit: "%"
  - quantity: maintained response percentage, hyperoxia
    value: 36
    tolerance: 3.6
    unit: "%"
  - quantity: temperature up to which responsiveness is kept, normoxia
    value: 31
    tolerance: 1
    unit: °C
  - quantity: temperature up to which responsiveness is kept, hyperoxia
    value: 36
    tolerance: 1
    unit: °C
  criterion: A flash is a response when the mean %ΔF/F0 over the 4 s after onset exceeds 2 SD
    above F0 (Methods); which SD is open, read as the SD of the 2 s pre-flash signal, and the
    deposited binary outcomes are used if present. Percentages are of flashes, pooled over fish,
    in 1 °C bins (the bin width is not given; a standard choice). The initial percentage is the
    mean over bins from 28 °C up to the stated temperature (normoxia 28 to 31, hyperoxia 28 to
    36, hypoxia the first bin); a mean of per-fish percentages is shown as a variant. The
    temperature of decline is the last bin before the percentage falls below the initial level
    minus its tolerance. Reproduced when the percentages and temperatures are within tolerance
    under one reading and the hypoxic percentage falls from its first bin.
- id: tables10-light-response-model
  statement: In a binomial mixed model, responsiveness at mean temperature is lower in hypoxia
    (13%) and higher in hyperoxia (37%) than in normoxia (26%), falls with temperature, and
    hyperoxia slows its decline with temperature.
  source: Table S10 and its caption; SI Statistical Analyses, Effect of oxygen level on neural
    activity
  quote: At mean temperature control group had 26 % probability of responding, high had 37 % and
    low had half of control (13%)
  statistics:
  - about: hypoxia against normoxia, logit scale
    test: binomial mixed-effects model, logit link, fish as random factor
    statistic: β = -0.85, SE 0.22
    p: 0.001
    p_relation: "<"
    n: 38 fish, 2763 flashes
  - about: hyperoxia against normoxia, logit scale
    test: binomial mixed-effects model, logit link, fish as random factor
    statistic: β = 0.49, SE 0.18
    p: 0.008
  - about: temperature (centered), normoxia
    test: binomial mixed-effects model, logit link, fish as random factor
    statistic: β = -0.13, SE 0.02
    p: 0.001
    p_relation: "<"
  - about: hyperoxia by temperature
    test: binomial mixed-effects model, logit link, fish as random factor
    statistic: β = 0.07, SE 0.03
    p: 0.03
  expected:
  - quantity: probability of response at mean temperature, normoxia
    value: 26
    tolerance: 2.6
    unit: "%"
  - quantity: probability of response at mean temperature, hyperoxia
    value: 37
    tolerance: 3.7
    unit: "%"
  - quantity: probability of response at mean temperature, hypoxia
    value: 13
    tolerance: 1.3
    unit: "%"
  depends_on:
  - fig6c-light-responsiveness-by-oxygen
  criterion: Model as SI Statistical Analyses and Table S10 give it. Response (1 or 0) per flash
    on treatment, temperature centered on its mean, temperature squared, and their interactions
    with treatment; logit link; random intercept per fish (lme4 glmer); 38 fish. Probabilities
    are the inverse logit of the intercept and intercept plus treatment terms. Whether the mean
    temperature is over all flashes or per treatment is open; both are shown. Reproduced when
    the hypoxia term is negative and the hyperoxia term positive, each at p < 0.05, the
    temperature term negative at p < 0.05, the hyperoxia by temperature term positive at p <
    0.05, and the probabilities within tolerance.
- id: discussion-depolarization-magnitude
  statement: The brain-wide depolarizations are four to five times the magnitude of medulla
    locomotor calcium peaks and last much longer.
  source: Discussion, paragraph 1; Figure 2
  quote: These brain depolarizations were four to five times the magnitude of medulla locomotor
    calcium peaks and lasted considerably longer
  expected:
  - quantity: ratio of depolarization amplitude to medulla calcium peak amplitude
    value: 4.5
    tolerance: 1
  criterion: The paper gives no method. Per fish of experiment 2, the depolarization's peak
    %ΔF/F0 (findpeaks maximum after onset, Methods) over the mean amplitude of that fish's
    medulla calcium peaks; open is whether both are taken in the medulla or the depolarization
    on the whole brain, and both readings are shown. Reproduced when the median ratio lies in the
    reported range widened by 10% of each bound (3.6 to 5.5). Likely untestable from derived
    data if peak amplitudes are not deposited.
