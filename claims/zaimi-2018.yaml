# Claims for Zaimi, Wabartha, Herman, Antonsanti, Perone & Cohen-Adad (2018), AxonDeepSeg,
# Scientific Reports 8, 3816, on dandiset 001436.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record as served by Europe PMC (PMC5830647), full text with Methods,
# Results, Discussion, figure legends and Tables 1 to 3. The paper has no supplement. No PDF was
# supplied; Table 3 is legible in the text as a flat row of numbers per sample.
#
# Code read: https://github.com/neuropoly/axondeepseg at commit
# 7f6013221b2a862e107a7e23f3c8662eba3ba64b (2018-02-28, the last commit before publication on
# 2018-02-28 and before tag v0.4). It holds the network (network_construction.py), training
# (train_network.py, data_management/), inference (segment.py, apply_model.py,
# patch_management_tools.py), the two released models (models/default_SEM_model_v1 and
# models/default_TEM_model_v1, unchanged since commit a5172af of 2017-09-06, before submission
# on 2017-11-07), the test metrics (testing/segmentation_scoring.py,
# testing/launch_performance_metrics.py) and per-axon morphometrics (morphometrics/). It holds
# no script that produced Table 3 or Figure 7 and no list of the test images. The Figure 7
# morphometrics were computed with AxonSeg (ref. 16), a separate MATLAB package, not read here.
# Later versions of AxonDeepSeg (v1.0 on, and the v4 and v5 models) are not the paper's models.
#
# Data the paper used (Methods, Dataset; Table 1).
# - SEM. Training/validation on 9 rat cervical spinal cord images (pixel sizes 0.05 to 0.18 um).
#   Test on 3 images, rat 1 (0.13 um, 150 x 97 um2), rat 2 (0.07 um, 108 x 77 um2) and one human
#   cervical spinal cord image (0.13 um, 715 x 735 um2). One full rat cervical spinal cord slice
#   (Figures 6 and 7).
# - TEM. Mouse brain, splenium of the corpus callosum, from Jelescu et al. 2016 (ref. 27,
#   doi:10.1016/j.neuroimage.2016.02.004), 8 images per mouse, pixel size 0.002 um, field of view
#   6 x 9 um2, fixation 2% paraformaldehyde and 2.5% glutaraldehyde. Training/validation on
#   "8 x 17 mice", test on "8 x 3 mice" (24 images). One macaque corpus callosum test image
#   (0.009 um, 27 x 21 um2) from Stikov et al. 2015 (ref. 7).
# - Ground truth, one png per image with background 0, myelin 127, axon 255. For TEM, myelin was
#   thresholded and corrected by hand, and axons filled inside it (Methods, Ground truth
#   labelling).
# - Measured variables, per test image, axon Dice, myelin Dice, three-class pixel-wise accuracy,
#   and axon detection sensitivity and precision (Methods, Evaluation method).
#
# The dandiset (title "TEM Images of Corpus Callosum in Control and Cuprizone-Intoxicated Mice
# with Axon and Myelin Segmentations") is meant to hold the mouse TEM images and their
# segmentations, so only the mouse TEM claims can be tested on it. The test of those needs the
# paper's trained TEM model, which is outside data (data with_inputs), pinned at the commit above.
# The paper does not say which 3 mice formed the test set, nor whether they were controls or
# cuprizone mice; its Discussion says the models were trained and tested on healthy tissues,
# while ref. 27 is a cuprizone study and the dandiset holds both groups. Which images form the
# test set is therefore open, and the mouse claims name the readings.
#
# The SEM, human and macaque data are not in the dandiset. The Data availability statement says
# "A part of the datasets" is in the White Matter Microscopy Database (https://osf.io/yp4qg/,
# doi:10.17605/OSF.IO/YP4QG) without saying which part, and the rest is on request. Those claims
# keep data dataset; the author decides whether the OSF deposit holds any of them.
#
# Method choices fixed here from the code, where the Methods leave them open. Inference with
# segment.py and the default_TEM_model_v1 model, which resamples each image (bilinear) to
# 0.01 um per pixel (rescale with skimage defaults), inverts the 8-bit contrast of the input
# (255 minus the image, done once for default_TEM_model_v1 in segment_folders and for png input in
# segment_image; segment_image inverts a non-png input twice, which cancels the inversion and is a
# bug, so the single inversion is the code's intent), cuts it into 512 x 512 patches with an overlap of 25 pixels, applies
# histogram equalization and standardization per patch, takes the argmax of the three-class
# softmax, stitches the patches and resamples the mask back to the native pixel size. Masks are
# read as in launch_performance_metrics.py, axon where the value is above 200 and myelin where it
# is from 50 to 200. Dice is computed per image over all pixels (pw_dice). Detection uses
# score_analysis in segmentation_scoring.py, a ground-truth axon object is a true positive when
# it contains the centroid of a predicted axon object of area above 2 pixels, predicted centroids
# inside no ground-truth axon are false positives, sensitivity is TP over the number of
# ground-truth axon objects and precision TP over (TP + FP); objects are connected components as
# skimage.measure.label gives them (8-connectivity in 2D).
schema_version: 2
dataset:
  archive: dandi
  id: "001436"
paper: doi:10.1038/s41598-018-22181-4
claims:
- id: table3-tem-mice-accuracy
  statement: The TEM model trained on mouse images segments the mouse test images with a mean
    three-class pixel-wise accuracy of 95% (0.9451 in Table 3, mean over 24 test images).
  source: Results, Segmentation, paragraph 1; Table 3, row TEM, Mice
  quote: The TEM model trained on mice microscopy achieved a pixel-wise accuracy of 95% on mice samples
  data: with_inputs
  expected:
  - quantity: mean pixel-wise accuracy over the mouse test images
    value: 0.9451
    tolerance: 0.0945
  criterion: >-
    Segment each mouse TEM image of the dandiset with default_TEM_model_v1 at commit 7f60132,
    by segment.py with its defaults (0.01 um working pixel size, overlap 25, the input contrast
    inverted once as segment.py does for this model, see the opening comment), using the pixel
    size the dandiset gives for each image (Table 1 gives 0.002 um). The result without the
    inversion is shown as a variant. Pixel-wise accuracy is,
    per image, the fraction of pixels whose class (background, myelin, axon) in the prediction
    equals the class in the dandiset's segmentation, at the native pixel size (Methods,
    Pipeline overview and Pixel-wise accuracy); the value is the mean over images (Table 3
    legend). The test set is open, as the paper names neither the mice nor their group. The
    readings are (a) every mouse image in the dandiset, which also holds the model's training
    images; (b) the images of the control mice only, following the Discussion's statement that
    the models were trained and tested on healthy tissues. Neither reading is the paper's test
    set (3 of the 20 mice, disjoint from the 17 training mice, Table 1), so both may hold
    training images and a match is weaker evidence than a test on held-out mice. When a mouse has more than 8 images,
    all its images are used (the paper does not say which 8 it took). Reproduced when the mean
    is within tolerance under both readings; when the readings differ in outcome the claim is
    blocked as methods_underspecified. The per-mouse means, and the cuprizone mice apart, are
    reported.
- id: table3-tem-mice-dice-detection
  statement: On the mouse test images the TEM model reaches a mean axon Dice of 0.9493, a mean
    myelin Dice of 0.8552, a mean axon detection sensitivity of 0.9597 and a mean precision of
    0.9647.
  source: Table 3, row TEM, Mice
  inferred: Numbers from Table 3, row TEM, Mice; the text states only the accuracy. The legend
    says that for the mice, 24 samples of the same size were used and the values are means over
    all samples.
  data: with_inputs
  depends_on:
  - table3-tem-mice-accuracy
  expected:
  - quantity: mean axon Dice over the mouse test images
    value: 0.9493
    tolerance: 0.0949
  - quantity: mean myelin Dice over the mouse test images
    value: 0.8552
    tolerance: 0.0855
  - quantity: mean axon detection sensitivity over the mouse test images
    value: 0.9597
    tolerance: 0.0960
  - quantity: mean axon detection precision over the mouse test images
    value: 0.9647
    tolerance: 0.0965
  criterion: >-
    Segmentations and test-set readings as in table3-tem-mice-accuracy. Dice per image is
    2|A and B| / (|A| + |B|) between the predicted and the ground-truth masks, for axon and for
    myelin apart (Methods, Equation 1; pw_dice in segmentation_scoring.py). Sensitivity and
    precision per image are TP / (TP + FN) and TP / (TP + FP) over axon objects matched by
    centroids (Methods, Detection metrics), computed with score_analysis as the opening comment
    states. Each value is the mean over images. Reproduced when all four means are within
    tolerance under both readings; partially reproduced when two or three are under both.
- id: myelin-dice-below-axon-dice
  statement: In both models and every test sample the myelin Dice is lower than the axon Dice,
    which the authors attribute to myelin having two boundaries (with the axon and with the
    background).
  source: Discussion, Performance metrics, paragraph 1; Table 3
  quote: In both models and all test samples, computed myelin Dice was lower than axon Dice.
  data: with_inputs
  depends_on:
  - table3-tem-mice-dice-detection
  criterion: >-
    Tested on the mouse TEM images only, with the values of table3-tem-mice-dice-detection.
    Which units "all test samples" covers is open. The readings are (i) the rows of Table 3,
    so that for the mice the means over images are compared, and (ii) every single test image,
    as the Table 3 legend calls each of the 24 mouse images a sample. Reproduced when the
    myelin Dice is below the axon Dice under either of (i) and (ii), for both test-set
    readings; the result under each, and the fraction of single images with myelin Dice below
    axon Dice, are reported. The SEM rows and the macaque row cannot be tested on this
    dandiset; the paper's values (Table 3) hold the order in all five rows.
- id: sensitivity-above-93
  statement: Axon detection sensitivity is above 93% in every test set (Table 3 gives 0.9300 for
    the human sample, so there the bound is met only with rounding).
  source: Discussion, Performance metrics, paragraph 1; Table 3
  quote: In all test sets, sensitivity was high (>93%, see Table 3 ), indicating good capability to detect true positive axons.
  data: with_inputs
  depends_on:
  - table3-tem-mice-dice-detection
  criterion: >-
    Tested on the mouse TEM images only, with the mean sensitivity of
    table3-tem-mice-dice-detection. Reproduced when the mean is above 0.93 under both test-set
    readings. The other test sets (rat 1, rat 2, human, macaque) are not in the dandiset.
- id: table3-sem-rat-accuracy
  statement: The SEM model trained on rat spinal cord reaches a pixel-wise accuracy between 85%
    and 88% on the two rat test images (0.8510 and 0.8822 in Table 3).
  source: Results, Segmentation, paragraph 1; Table 3, rows SEM, Rat 1 and Rat 2
  quote: The SEM model trained on rat microscopy was able to achieve a pixel-wise accuracy between 85% and 88% on the rat test samples
  expected:
  - quantity: pixel-wise accuracy, rat 1 SEM test image
    value: 0.8510
    tolerance: 0.0851
  - quantity: pixel-wise accuracy, rat 2 SEM test image
    value: 0.8822
    tolerance: 0.0882
  criterion: >-
    Not testable on this dandiset, which holds no SEM images. If the two rat test images and
    their ground truth were found, segment with default_SEM_model_v1 at commit 7f60132 by
    segment.py with its defaults (0.1 um working pixel size, overlap 25) and compute the
    accuracy as in table3-tem-mice-accuracy.
- id: table3-sem-human-accuracy
  statement: On the human spinal cord SEM test image the rat-trained SEM model reaches a
    pixel-wise accuracy of 81% (0.8114), the lowest of all test samples, which the authors
    attribute to the human sample's different contrast, quality and noise.
  source: Results, Segmentation, paragraph 1; Table 3, row SEM, Human; Discussion, Performance metrics, paragraph 1
  quote: while the pixel-wise accuracy on human test sample was 81%
  expected:
  - quantity: pixel-wise accuracy, human SEM test image
    value: 0.8114
    tolerance: 0.0811
  criterion: >-
    Not testable on this dandiset, which holds no SEM images. Method as in
    table3-sem-rat-accuracy.
- id: table3-tem-macaque-accuracy
  statement: On the macaque corpus callosum TEM test image the mouse-trained TEM model reaches a
    pixel-wise accuracy of 84% (0.8438).
  source: Results, Segmentation, paragraph 1; Table 3, row TEM, Macaque
  quote: and a pixel-wise accuracy of 84% on macaque samples
  expected:
  - quantity: pixel-wise accuracy, macaque TEM test image
    value: 0.8438
    tolerance: 0.0844
  criterion: >-
    Not testable on this dandiset, which holds mouse images only. Method as in
    table3-tem-mice-accuracy, on the single macaque image of ref. 7.
- id: table3-other-samples-dice-detection
  statement: For the SEM test images and the macaque TEM image the axon Dice, myelin Dice,
