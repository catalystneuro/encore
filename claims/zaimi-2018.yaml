- id: full-slice-processing-time
  statement: Segmenting a full rat cervical spinal cord SEM slice took 5 hours on a Mac laptop
    (2.9 GHz).
  source: Results, Segmentation, paragraph 2
  quote: Processing time was 5 hours in a Mac laptop (2.9 GHz).
  expected:
    quantity: processing time for the full rat spinal cord slice
    value: 5
    tolerance: 0.5
    unit: hours
  criterion: >-
    Not testable on this dandiset, which holds no SEM slice; the time also depends on the
    machine.
- id: fig7-corticospinal-tract
  statement: In the corticospinal tract of the rat cervical spinal cord the segmentation gives
    small axon diameters (around 1 um), very high axon density (around 200,000 axons per mm2)
    and g-ratios around 0.6.
  source: Results, Morphometrics extraction, paragraph 1; Figure 7
  quote: In the corticospinal tract (tract #12 of the reference), we observe smaller axon diameters (around 1 µm), very high axon density (around 200,000 axons per mm 2 ) and g-ratio values around 0.6.
  expected:
  - quantity: mean axon diameter in the corticospinal tract
    value: 1
    tolerance: 0.1
    unit: um
  - quantity: axon density in the corticospinal tract
    value: 200000
    tolerance: 20000
    unit: axons per mm2
  - quantity: g-ratio in the corticospinal tract
    value: 0.6
    tolerance: 0.06
  criterion: >-
    Not testable on this dandiset, which holds no rat spinal cord. Per the Methods
    (Morphometrics extraction), with AxonSeg (ref. 16) as the paper used, the segmentation of the full slice is aggregated into
    50 x 50 um2 cells, within a white matter mask; axon diameter is the equivalent diameter
    sqrt(4 Area / pi) of each axon object, density is axons per mm2, and g-ratio is
    sqrt(1 / (1 + MVF / AVF)). The paper gives the tract only as a schematic diagram (Figure 7,
    refs. 34 to 36), so the cells that form the tract are open.
- id: fig7-larger-axons-periphery
  statement: Larger axons are found close to the periphery of the rat spinal cord.
  source: Results, Morphometrics extraction, paragraph 1; Figure 7
  quote: Larger axons are found close to the spinal cord periphery.
  criterion: >-
    Not testable on this dandiset. Method as in fig7-corticospinal-tract; the paper gives no
    measure of distance to the periphery.
- id: fig7-tract-diameters
  statement: The diameter map agrees with the literature in that the ventral spinothalamic tract
    has the largest axons and the spinocerebellar tracts are mostly large-diameter fibres (both
    stated with citations, as known anatomy the map is consistent with), and axons of the
    cuneate fasciculus are observed to be larger than those of the gracile fasciculus.
  source: Discussion, Morphometrics extraction, paragraph 1; Figure 7
  quote: The ventral spinothalamic tract (#3 in tract reference of Fig. 7 ) contains the largest axons ... We also observe that axons in the cuneate fasciculus (#7 in tract reference) are larger than those found in the gracile fasciculus
  criterion: >-
    Not testable on this dandiset. Method as in fig7-corticospinal-tract, comparing the mean
    axon diameter between tracts; the tract boundaries are open.
- id: fig7-gratio-range
  statement: Across the rat spinal cord white matter the g-ratio ranges between 0.5 and 0.75,
    in agreement with other rat studies.
  source: Discussion, Morphometrics extraction, paragraph 1; Figure 7
  quote: G-ratio ranges between 0.5 and 0.75, which is in agreement with other rat microstructure studies
  expected:
  - quantity: lowest g-ratio over the white matter cells
    value: 0.5
    tolerance: 0.05
  - quantity: highest g-ratio over the white matter cells
    value: 0.75
    tolerance: 0.075
  criterion: >-
    Not testable on this dandiset. Method as in fig7-corticospinal-tract, over all
    50 x 50 um2 white matter cells; the claim holds when the g-ratios lie within 0.45 to 0.825
    (the range widened by 10% of each bound). Whether isolated cells at the edge of the mask
    count is open.
checks:
- date: 2026-10-21
  kind: agent
  model: claude-opus-5-5
  ready: true
  changes:
  - Opening comment and table3-tem-mice-accuracy criterion, added the contrast inversion that segment.py applies to the input for default_TEM_model_v1 at commit 7f60132 (segment_folders, and segment_image for png input), noted that segment_image inverts non-png input twice, and kept no inversion as a variant; the earlier description of the inference omitted this step, which changes the model's input.
  - table3-tem-mice-accuracy criterion, said that neither test-set reading is the paper's held-out set of 3 mice, so both may include training images (Table 1, 8 x 17 training and 8 x 3 test mice).
  - myelin-dice-below-axon-dice criterion, named as open whether "all test samples" means the Table 3 rows or every single image, since the Table 3 legend calls each of the 24 mouse images a sample; both readings are now listed.
  - sensitivity-above-93 statement, noted that Table 3 gives 0.9300 for the human sample, which meets ">93%" only with rounding.
  - fig7-corticospinal-tract criterion, named AxonSeg (ref. 16) as the tool the paper used for the morphometrics (Results, Morphometrics extraction).
  - fig7-tract-diameters statement, separated the two tract findings the Discussion states with literature citations as known anatomy from the cuneate versus gracile comparison it states as observed.
  - Open, the 3 test mice and their group (control or cuprizone) are not named by the paper or its code, so the mouse claims rest on proxy test sets.
  - Open, which 8 images per mouse the paper used when a mouse has more; the criterion uses all of them, a choice the paper does not fix.
  - Open, fig7-gratio-range has expected values for the lowest and highest g-ratio while its criterion asks only that all values lie inside the widened range; the paper's sentence allows both readings and the file keeps the containment rule of the protocol.
