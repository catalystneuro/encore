- id: macaque-myelin-underestimated
  statement: The TEM model slightly underestimates the myelin sheaths of the macaque sample
    compared with its ground truth.
  source: Discussion, Performance metrics, paragraph 1
  quote: Note that myelin sheaths of the macaque TEM sample are slightly underestimated when compared to the ground truth segmentation.
  criterion: >-
