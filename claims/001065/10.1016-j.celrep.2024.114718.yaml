# Claims for Dembrow, Sawchuk et al. (2024), "Areal specializations in the morpho-electric and
# transcriptomic properties of primate layer 5 extratelencephalic projection neurons", Cell
# Reports 43:114718, on dandiset 001065.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-22,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the accepted author manuscript (NIHMS2025370, PMC11488157) as served by Europe PMC,
# CC BY-NC-ND: main text, STAR Methods, figure legends, key resources table, and the
# supplemental PDF (NIHMS2025370-supplement-1.pdf, legends of Figures S1 to S7). Not in the
# text: Tables S1 to S5 (gene lists, gene statistics, means and SE of the 40 physiology
# features, the projection-type ANOVA of Figure 4A and the L5 ET area ANOVA of Figure 6A) and
# the figures themselves. Where a claim needs a number that only those tables hold, the paper's
# analysis code supplies it where it printed one, and the criterion says so; the code's
# deposited ET_cross_p.csv, ET_cross_effect.csv and ETmean_sem.csv are the area ANOVA and the
# area means of Table S5's analysis. The projection-type ANOVA of physiology (Table S4) was
# not deposited (the deposited ETvIT_pval.csv and ETvIT_eta.csv hold the Patch-seq gene ANOVA).
#
# Code read: Zenodo record 13749343 (doi:10.5281/zenodo.13749343, published 2024-09-11, one
# version), cited in the key resources table. It holds Jupyter notebooks and their inputs:
# UMAPprojections_020724.ipynb (physiology UMAP, classifier prediction of subclass, three-way
# ANOVA of the 40 features on projection class, preparation and area: Figures 3 and 4),
# classifier_features_070523.ipynb (logistic regression classifier on features and on sparse
# PCs: Figure 3E to 3G, S3B, S3E, S3F), L5ET.ipynb (two-way ANOVA of L5 ET features on area
# and preparation, FI curves: Figure 6A to 6H, S6A, S6B), ExtendedFI.ipynb (4 nA protocol,
# Welch t-tests: Figure 6I to 6K, S6C, S6D, from MCx.pkl and TCx.pkl), morphology.ipynb
# (Welch t-tests and classifier on dendritic features: Figure 5), cell_counts.ipynb (Patch-seq
# QC and CS mapping: Figure 2, S2), the snRNA-seq and Patch-seq gene notebooks (Figure 1, S1,
# 4H, S4, S6E), integratePS_71123.R (Seurat integration), and per-cell tables:
# lockdown_physiology_072623.csv (per-cell features, metadata, Brain_Region, Prep, Virus,
# Reporter_positive), cell_list_L5.csv (Patch-seq QC and mapped subclass and t-type per
# sample), L5_physiology_121223.csv and L5ET_121223.csv (with predicted_subclass and
# Cortical_area), RawFeatureWide.csv (dendritic features). Not deposited: the helper modules
# data_processing.py and HCTanalysis_utils.py (feature imputation and scaling, UMAP, the
# classifier function predict_subclass and Logistic_reg_classifier, the gain computation), the
# feature extraction from raw traces, and the R code of the subthreshold oscillation analysis
# (Figure 7, S7). So the code does not fix how features are computed from the recordings.
#
# Choices the code settles, used below: MCx is Brain_Region M1, M1-trunk, M1-Hand-wrist or SFG,
# every other region is TCx; a cell is L5 ET when tdTomato-positive after the AAV-retro spinal
# injection (CS), else its MTG-mapped subclass for Patch-seq samples passing QC, else the
# subclass the classifier predicts; projection class is L5 ET against all other predicted
# subclasses; ANOVAs are statsmodels OLS with all interactions, type II sums of squares, and
# Benjamini-Hochberg correction across the 40 features, separately for each main effect (and,
# in the two-way ANOVA, the interaction); the t-tests are Welch's (scipy ttest_ind with
# equal_var False), and Cohen's d uses the pooled SD; up/down ratio is -(max dV/dt)/(min dV/dt).
# Code against Methods: the code's "partial eta" is SS_a/(SS_total - (SS_b - SS_ab)) in the
# two-way and an analogous sign-mixed formula in the three-way ANOVA, not the standard partial
# eta squared SS_effect/(SS_effect + SS_residual) the Methods name. The Methods' measure is
# the main reading below and the code's formula a variant.
#
# Data the paper used (Methods; Results): 58 macaques (23 male, 35 female; 48 Macaca nemestrina,
# 10 Macaca mulatta; 2 to 19 years). Whole-cell current clamp recordings in acute or cultured
# slices of MCx (M1, including hand-wrist and trunk areas) and TCx (MTG), 32 to 34 C, sampled
# at 20 or 50 kHz; 300 new recordings plus 20 cells from Bakken et al. 2021 and 13 from Lee et
# al. 2021, 333 recordings in the physiology analysis; 177 Patch-seq samples passed
# transcriptomic QC; corticospinal (CS) neurons were labelled by AAV-retro-tdTomato in the
# cervical cord in 3 animals (16 CS samples). Protocols: a chirp (0.2 to 40 Hz in 20 s,
# about 10 mV peak to peak); 1 s hyperpolarizing steps (typically -200 to +50 pA by 50 pA,
# scaled by input resistance); 1 s depolarizing steps (+50 pA per step up to 1 nA or spike
# failure); 3 ms steps from +500 pA by +100 pA to spiking; for Figures 6I to 6K, 1 s steps by
# 200 pA up to 4 nA (MCx n = 42, TCx n = 26 L5 ET neurons); for Figure 7, 10 s steps near
# rheobase, some with synaptic blockers (DNQX, d-APV and gabazine or picrotoxin). Measured
# variables: membrane voltage and injected current per sweep. Dendritic reconstructions (12 MCx,
# 11 TCx L5 ET neurons) are in the Brain Image Library (doi:10.35077/g.1160), Patch-seq reads in
# SRA PRJNA1088539, the snRNA-seq references in NeMO (dat-net1412, dat-ek5dbmu). The dandiset
# (title and description) holds the current clamp NWB files of the deep layer neurons of
# temporal and motor cortex, so the physiology claims are the ones it can test.
#
# Labels from outside the dataset: the physiology claims need, per cell, the area, the
# preparation and the subclass (Patch-seq mapping, CS label or classifier prediction). The
# paper's code gives them in L5_physiology_121223.csv, L5ET_121223.csv, cell_list_L5.csv and
# lockdown_physiology_072623.csv (Zenodo record 13749343), keyed by cell_name or sample_id. Those
# claims are marked with_labels; the labels are used and the tables' feature values are not.
#
# Feature definitions (STAR Methods, Neurophysiology features), referred to by the criteria:
# resonant frequency fR is the frequency of the maximum of the impedance amplitude profile
# |FFT(V)/FFT(I)| of the chirp response; the 3 dB cutoff is the frequency where the profile
# falls to sqrt(0.5) Zmax; maximum and steady-state input resistance are slopes of the linear
# portion of the voltage-current relation of the 1 s hyperpolarizing steps; single spike
# properties come from the first spike at the lowest 1 s step that evokes a spike: threshold
# where dV/dt exceeds 20 V/s, half-width at half the threshold-to-peak amplitude, fAHP the
# minimum voltage after the spike relative to threshold, max and min dV/dt; maximum
# instantaneous rate is 1/ISI(min) per step; gain is the slope of the FI relation, maximum gain
# its largest step-to-step slope and initial gain the slope where the neuron starts firing
# (the code divides spike-count differences by the current step). Details none of the paper,
# legends or code fix, and which are standard choices that should not change the direction of
# the large effects tested: the window of the peak and of the steady state of the
# hyperpolarizing steps (standard choice: the most negative voltage in the step, and the mean
# of its last 100 ms), which steps form the "linear portion" (standard choice: all steps from
# -200 pA to 0), whether several chirp sweeps are averaged (standard choice: the mean of the
# impedance profiles of all chirp sweeps), and the window after a spike for the fAHP
# (standard choice: from the spike peak to the next spike or 10 ms, whichever comes first).
# The author may compare the features computed here with the paper's per-cell table as a
# link claim of its own.
schema_version: 2
dataset:
  archive: dandi
  id: "001065"
paper: doi:10.1016/j.celrep.2024.114718
claims:
# --- Link (added by the author of attempt 001065-dembrow-2024-01, protocol Author step 1.4) --
- id: link-cells
  kind: link
  statement: The dandiset's files are the cells of the paper's per-cell tables, which supply the
    area, preparation and subclass labels, and the features computed here from the recordings
    agree with the values in those tables.
  source: The paper's code, Zenodo record 13749343 (L5_physiology_121223.csv,
    lockdown_physiology_072623.csv, MCx.pkl, TCx.pkl)
  data: with_labels
  criterion: Records are matched by the file's electrode cell_id against the tables' cell_name.
    The link holds (reproduced) when every file matches a table row, the file's subject and
    species agree with the table's Donor and Species for at least 99% of matched cells, and the
    median over the 39 features computed here of the Spearman correlation with the table's value
    is at least 0.9; it holds in part (partially reproduced) when every file matches but either
    agreement is lower, and fails when files cannot be matched. The fraction of table rows
    absent from the dataset is reported, and for the cells of MCx.pkl and TCx.pkl the spike
    counts of the 200 pA series are compared with the pickles'.
