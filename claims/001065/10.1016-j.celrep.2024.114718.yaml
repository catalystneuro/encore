# --- Irregular firing and subthreshold oscillations (Figure 7, S7) ---------------------------
- id: figs7-cv-isi-higher-mcx
  statement: During 10 s near-rheobase steps, MCx L5 ET neurons fire more irregularly (higher CV
    of ISIs) than TCx L5 ET neurons across a wide range of firing rates.
  source: Results, Functional specializations of MCx L5 ET neurons, paragraph 3; Figure S7F, S7G
  quote: which revealed more variable ISIs in MCx L5 ET neurons across a wide range of average
    firing rates during the 10-s current step
  statistics:
  - test: two-way ANOVA, area effect
    p: 0.001
    p_relation: "<"
    n: MCx 273 observations from 64 cells, TCx 131 observations from 65 cells
  data: with_labels
  depends_on:
  - link-cells
  criterion: >-
    Sweeps of the 10 s steps with at least 10 spikes; spikes in the first 100 ms excluded; CV
    = SD/mean of the ISIs (STAR Methods); each sweep is an observation. The second factor of
    the two-way ANOVA is not named; Figure S7G bins CV by the number of spikes in the sweep,
    so the reading is area by spike-count bin. The bin edges are not given; readings, both
    run: (a) bins of 10 spikes; (b) bins of 25 spikes. The code was not deposited. Reproduced
    when the area effect has p < 0.001 with MCx higher under both readings; partially when p <
    0.05; observation and cell counts are reported against the legend's.
- id: fig7-oscillation-frequency-vm
  statement: The peak frequency of subthreshold oscillations between spikes increases with
    membrane potential in MCx L5 ET neurons but not in TCx, by autocorrelation and by Fourier
    analysis.
  source: Results, Functional specializations of MCx L5 ET neurons, paragraph 3; Figure 7I, 7J
  quote: However, the peak frequency of these oscillations increased with membrane potential only
    in the MCx, whether measured from autocorrelation
  statistics:
  - about: autocorrelation frequency against Vm, MCx
    test: Pearson correlation
    statistic: r2 = 0.31
    p: 0.001
    p_relation: "<"
    n: 79 observations from 52 neurons
  - about: autocorrelation frequency against Vm, TCx
    test: Pearson correlation
    statistic: r2 = 0.002
    p: 0.75
    n: 66 observations from 49 neurons
  - about: FFT peak frequency against Vm, MCx
    test: Pearson correlation
    statistic: r2 = 0.32
    p: 0.001
    p_relation: "<"
    n: 91 observations from 59 neurons
  - about: FFT peak frequency against Vm, TCx
    test: Pearson correlation
    statistic: r2 < 0.001
    p: 0.146
    n: 82 observations from 53 neurons
  expected:
  - quantity: r2, autocorrelation frequency against Vm, MCx
    value: 0.31
    tolerance: 0.031
  - quantity: r2, FFT peak frequency against Vm, MCx
    value: 0.32
    tolerance: 0.032
  data: with_labels
  depends_on:
  - link-cells
  criterion: >-
    Method from STAR Methods (the R code was not deposited): sweeps of the 10 s steps with at
    least one spike and at most 200; interspike segments from the return to baseline after
    the AHP (found by fitting a curve) to 50 ms before the next spike; filtered 3 to 50 Hz;
    segments longer than 650 ms analysed by FFT (peak frequency and strength per segment) and
    a smoothing spline over segments for the sweep's peak frequency and strength;
    autocorrelogram over the last 1 s of segments longer than 1 s, frequency from its peaks and
    troughs; segments aggregated into 5 mV bins of membrane potential per cell, each cell-bin
    an observation; Pearson correlation over observations. Open, with standard choices: the
    curve fitted to find the return to baseline (standard: an exponential fit to the AHP
    decay, baseline reached within 1 mV of its asymptote), the filter (standard: zero-phase
    4th-order Butterworth band-pass), the spline (standard: R smooth.spline defaults), and the
    autocorrelogram frequency (standard: 1 over the lag of the first peak after zero lag).
    These could change the values; the readings are run as stated and the counts of
    observations reported against the legend's. Reproduced when the MCx correlations are
    positive with p < 0.001 and the TCx correlations have p at least 0.05, for both measures;
    the r2 values are compared with tolerance. TCx r2 below 0.001 with p 0.146 on 82
    observations is not self-consistent (such an r2 gives p near 0.8), so only p is used for
    TCx.
- id: fig7k-oscillation-power-vm
  statement: Oscillation strength increases modestly with membrane potential, significantly in
    MCx L5 ET neurons and not significantly in TCx.
  source: Results, Functional specializations of MCx L5 ET neurons, paragraph 3; Figure 7K
  quote: increased in power modestly as a function of membrane potential
  statistics:
  - about: FFT strength against Vm, MCx
    test: Pearson correlation
    statistic: r2 = 0.08
    p: 0.001
    p_relation: "<"
    n: 91 observations from 59 neurons
  - about: FFT strength against Vm, TCx
    test: Pearson correlation
    statistic: r2 = 0.04
    p: 0.078
    n: 82 observations from 53 neurons
  expected:
  - quantity: r2, FFT strength against Vm, MCx
    value: 0.08
    tolerance: 0.008
  - quantity: r2, FFT strength against Vm, TCx
    value: 0.04
    tolerance: 0.004
  data: with_labels
  depends_on:
  - link-cells
  - fig7-oscillation-frequency-vm
  criterion: Method as fig7-oscillation-frequency-vm, with the spline-fitted FFT peak strength.
    Reproduced when the MCx correlation is positive with p < 0.001 and the TCx correlation is
    positive with p at least 0.05; partially when the MCx part holds only; the r2 values are
    compared with tolerance.
- id: figs7-oscillations-with-blockers
  statement: Subthreshold oscillations persist with fast synaptic transmission blocked, at a
    slightly reduced frequency, so they are intrinsic to the neuron.
  source: Results, Functional specializations of MCx L5 ET neurons, paragraph 3; Figure S7D, S7E
  quote: Oscillations occurred in the presence of blockers of fast synaptic transmission, albeit
    at a slightly reduced frequency
  statistics:
  - test: two-way ANOVA
    p: 0.0496
    n: 55 neurons with and 64 without blockers
  data: with_labels
  depends_on:
  - link-cells
  - fig7-oscillation-frequency-vm
  criterion: Blockers (DNQX with d-APV and gabazine or picrotoxin) per cell from the recording
    metadata. Oscillation frequency as in fig7-oscillation-frequency-vm. The legend bins by
    number of spikes in the sweep; the two-way ANOVA is read as blocker by spike-count bin,
    with the bin edges open (bins of 10 and of 25 spikes, both run). Reproduced when
    oscillations are detected in cells with blockers and the blocker effect has p < 0.05 with
    lower frequency under both readings; partially when oscillations are present but the
    effect is not significant.
- id: fig7l-firing-tracks-oscillation
  statement: In MCx L5 ET neurons the modal instantaneous firing rate during spiking epochs is
    well correlated with the subthreshold oscillation frequency; in TCx it is not.
  source: Results, Functional specializations of MCx L5 ET neurons, paragraph 4; Figure 7L
  quote: Consequently, the instantaneous firing rate during spiking epochs was well correlated
    with the prominent subthreshold oscillatory frequency in L5 ET neurons in the MCx
  statistics:
  - about: MCx
    test: Pearson correlation
    statistic: r2 = 0.63
    p: 0.001
    p_relation: "<"
    n: 122 observations from 42 neurons
  - about: TCx
    test: Pearson correlation
    statistic: r2 < 0.001
    p: 0.683
    n: 42 observations from 29 neurons
  expected:
    quantity: r2, modal firing rate against FFT peak frequency, MCx
    value: 0.63
    tolerance: 0.063
  data: with_labels
  depends_on:
  - link-cells
  - fig7-oscillation-frequency-vm
  criterion: Modal firing rate is the most common value of 1/ISI over the 10 s step (STAR
    Methods); the binning of instantaneous rates to find a mode is not given (readings, both
    run, 1 Hz and 2 Hz bins). Observations as in Figure 7L, each a sweep with an FFT peak
    frequency. Reproduced when the MCx correlation is positive with p < 0.001 and r2 within
    tolerance and the TCx p is at least 0.05; partially when the MCx correlation holds with r2
    outside tolerance.
- id: figs7g-modal-rates-long-isis
  statement: MCx L5 ET neurons reach modal firing rates near 30 Hz while still having ISIs longer
    than 650 ms, whereas no TCx neuron with such ISIs has a modal rate above about 8 Hz.
  source: Results, Functional specializations of MCx L5 ET neurons, paragraph 4; Figure S7G
  quote: In the MCx, L5 ET modal firing rates were as high as ~30 Hz, accompanied with ISIs
    longer than 650 ms
  expected:
  - quantity: highest modal rate with an ISI over 650 ms, MCx
    value: 30
    tolerance: 3
    unit: Hz
  - quantity: highest modal rate with an ISI over 650 ms, TCx
    value: 8
    tolerance: 0.8
    unit: Hz
  data: with_labels
  depends_on:
  - link-cells
  - fig7l-firing-tracks-oscillation
  criterion: Over the 10 s sweeps that contain at least one ISI longer than 650 ms, the largest
    modal firing rate per area, modal rate as in fig7l. The TCx value is a bound in the paper
    ("no TCx neurons had modal firing rates greater than ~8 Hz"), so reproduced when, under
    one binning reading, the MCx maximum is within tolerance of 30 Hz and the TCx maximum is
    at most 8.8 Hz (8 Hz plus its tolerance).
