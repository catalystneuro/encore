# --- Physiology across subclasses (Figures 3 and 4) -----------------------------------------
- id: fig3a-cs-with-l5et
  statement: In the UMAP of the physiology features, CS neurons lie only among the transcriptomic
    L5 ET neurons and overlap little with non-ET neurons, regardless of preparation, area and
    species.
  source: Results, Patch-seq reveals subclass and areal distinctions, paragraph 3; Figure 3A to
    3C; Figure S3A
  quote: CS neurons (triangles) exclusively distributed with the transcriptomically defined L5 ET
    neurons ( Figure 3A ) and had little overlap with non-L5 ET neurons. This separation did not
    depend upon slice preparation type
  data: with_labels
  depends_on:
  - link-cells
  criterion: >-
    The embedding as in STAR Methods, Physiology UMAP and classification, and
    UMAPprojections_020724.ipynb: the 40 features of the code's list; cells with more than 75%
    of features missing excluded; missing values imputed as the mean of the 2 nearest
    neighbours (KNNImputer) and features z-scored, separately for acute and cultured cells;
    PCA, keeping components that explain at least 1% of variance; UMAP with 25 neighbours,
    min_dist 0.1, Euclidean metric, random_state 20. The paper gives no measure of
    "exclusively distributed with". Two readings, both the reader's, both run: (a) in the
    two-dimensional embedding, the nearest transcriptomically labelled non-CS neighbour of
    every CS neuron is an L5 ET neuron; (b) in the space of the retained PCs, at least 9 of the
    10 nearest labelled non-CS neighbours of each CS neuron are L5 ET, for at least 90% of CS
    neurons. Reproduced when both hold; partially when one does. The same rule is reported
    within each preparation, area and species.
- id: fig3e-classifier-accuracy
  statement: A logistic regression classifier trained on physiology predicts transcriptomic
    subclass (L5 ET, L5 IT, L5/6 NP, L6 IT) with 92.8% accuracy weighted across subclasses on the
    whole dataset, 87.9% holding out 50% and 82.2% holding out 75%; for L5 ET it is 98.6% and
    93.8% (75% held out).
  source: Results, Patch-seq reveals subclass and areal distinctions, paragraph 4; Figure 3E to 3G
  quote: Classifiers trained and tested on 100% of the dataset had an average accuracy of 92.8%
    weighted across subclasses ... Classification was especially robust for the L5 ET subclass,
    where accuracy was 98.6% when trained on 100% of the dataset and dropped to 93.8% when
    holding out 75% of the dataset for cross-validation.
  expected:
  - quantity: weighted score, trained and tested on all cells
    value: 92.8
    tolerance: 9.28
    unit: percent
  - quantity: weighted score, 50% held out
    value: 87.9
    tolerance: 8.79
    unit: percent
  - quantity: weighted score, 75% held out
    value: 82.2
    tolerance: 8.22
    unit: percent
  - quantity: L5 ET score, all cells
    value: 98.6
    tolerance: 9.86
    unit: percent
  - quantity: L5 ET score, 75% held out
    value: 93.8
    tolerance: 9.38
    unit: percent
  data: with_labels
  depends_on:
  - link-cells
  criterion: >-
    Training cells are QC-passing Patch-seq samples and CS neurons (labelled L5 ET); subclasses
    with 5 or fewer cells are dropped (classifier_features_070523.ipynb), leaving L5 ET, L5 IT,
    L5/6 NP and L6 IT. Features preprocessed as in fig3a-cs-with-l5et. Multiclass logistic
    regression on the feature z-scores; 100 repeats each of training on 100%, a random 50% and
    a random 25% of cells, testing on the held-out cells (on all cells for 100%), predictions
    aggregated. Open, as predict_subclass was not deposited: the regularization and solver
    (standard choice: scikit-learn defaults, L2 with C = 1, lbfgs, max_iter raised until
    convergence) and whether the random split is stratified (both run). The score: the
    Results say "average accuracy weighted across subclasses", the Methods "average f1
    scores", and the code prints per-class f1 (0.986 for L5 ET at 100%, matching the 98.6%).
    Readings, all run: (a) support-weighted mean of per-class f1; (b) per-class recall
    (diagonal of the row-normalized confusion matrix) averaged with class weights. Reproduced
    when, under one reading, every value is within tolerance.
- id: fig3-spc-classifier
  statement: Classifiers built on sparse principal components of the physiology features perform
    similarly to those built on the features.
  source: Results, Patch-seq reveals subclass and areal distinctions, paragraph 4; Figure S3B
  quote: Similar results were obtained by building classifiers using sparse principal components
    (sPC) of physiology features
  data: with_labels
  depends_on:
  - link-cells
  - fig3e-classifier-accuracy
  criterion: Sparse PCA with 8 components, alpha 7, random_state 0 on the preprocessed features
    (classifier_features_070523.ipynb), then the procedure of fig3e-classifier-accuracy on
    the 8 component scores. "Similar" has no measure in the paper; the reader's reading is
    that each of the five scores of fig3e is within 10 percentage points of the
    feature-based score computed here. Reproduced when all five are; partially when three or
    four are.
- id: fig3h-projection-largest-effect
  statement: In three-way ANOVAs of each physiological feature on projection type, preparation
    and cortical area, effect sizes are on average largest for projection type.
  source: Results, Patch-seq reveals subclass and areal distinctions, paragraph 5; Figure 3H
  quote: While preparation type and cortical area contributed to some variance, effect sizes, on
