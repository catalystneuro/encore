# --- Morphology (Brain Image Library) -------------------------------------------------------
- id: fig5-tap-root-dendrites
  statement: Several MCx L5 ET neurons, including CS neurons, have long "tap root" basal dendrites
    reaching about 1.4 mm from the soma; TCx L5 ET neurons have none but have more complex
    apical tufts.
  source: Results, Regional morpho-electric specializations in the L5 ET subclass, paragraph 2;
    Figure 5A; Figure S5A, S5B
  quote: possessed prominent ... basal dendrites that, in the most extreme cases, extended ~1.4
    mm from the soma
  expected:
    quantity: largest basal dendrite extent from the soma, MCx
    value: 1.4
    tolerance: 0.14
    unit: mm
  data: elsewhere
  where: Brain Image Library doi:10.35077/g.1160 (dendritic reconstructions)
  criterion: On the 12 MCx and 11 TCx reconstructions. The paper defines no measure of a tap
    root, and "extended ~1.4 mm from the soma" can be read as (a) the maximum Euclidean
    distance of a basal dendrite tip from the soma or (b) the maximum basal path distance
    (basal_dendrite_max_path_distance, a feature of the morphology code); both are run.
    Reproduced when, under one reading, the MCx maximum is within tolerance of 1.4 mm and
    every TCx value is below the MCx median (the reader's measure of "lacked tap root
    dendrites altogether"; the paper gives none).
- id: fig5b-dendrite-depth
  statement: L5 ET neurons in TCx have more dendrite in L1, those in MCx more dendrite in deeper
    layers.
  source: Results, Regional morpho-electric specializations in the L5 ET subclass, paragraph 2;
    Figure 5B
  quote: The total length of dendrites in each layer differed between neocortical areas, with L5
    ET neurons in the TCx having more dendrites in L1 and L5 ET neurons in the MCx having more
    dendrites in deeper layers
  data: elsewhere
  where: Brain Image Library doi:10.35077/g.1160
  criterion: Dendrite length per layer from the reconstructions aligned to the pia-white matter
    axis (skeleton_keys). Layer boundaries are not given for these slices; the paper's own
    layer-aligned features are the reading. The paper reports no test; reproduced when the
    mean L1 dendrite length is larger in TCx and the mean length in L5 and L6 is larger in MCx.
