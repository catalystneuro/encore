# --- L5 ET physiology between areas (Figure 6, S6) ------------------------------------------
- id: fig6a-area-variation
  statement: Two-way ANOVAs (preparation and area) show substantial cross-areal variation in
    subthreshold and suprathreshold properties of L5 ET neurons.
  source: Results, Regional morpho-electric specializations in the L5 ET subclass, paragraph 4;
    Figure 6A
  quote: This analysis revealed substantial cross-areal variation in subthreshold and
    suprathreshold properties
  data: with_labels
  depends_on:
  - link-cells
  criterion: >-
    L5 ET neurons as in the code (predicted_subclass L5 ET, L5ET_121223.csv; Figure 6 has 77
    or 78 MCx and 70 TCx cells). For each of the 40 features, OLS on area, preparation and
    their interaction, type II, BH correction across features per term (L5ET.ipynb; its
    feature list now also holds three AHP features, AHP_area, AHP_duration and AHP, which the
    deposited ET_cross_p.csv does not hold, so the 40 are the reading). The code's corrected
    area p values (ET_cross_p.csv) are below 0.05 for 19 of the 40 features, among them Fr, cutoff, zap_tau,
    initial_ifreq_gain, max_ifreq_gain, up_down_ratio, f_AHP, MaxRn, SSRn, MaxZ, AP_HW,
    min_dvdt and threshold_current. "Substantial" has no measure; reproduced when at least one
    subthreshold (chirp or input resistance) and one suprathreshold (spike or firing) feature
    have corrected area p < 0.05, and the count of such features is reported against 19.
- id: fig6b-mcx-higher-resonance
  statement: L5 ET neurons in the MCx have a higher resonant frequency and a higher 3 dB cutoff
    than those in the TCx.
  source: Results, Regional morpho-electric specializations in the L5 ET subclass, paragraph 4;
    Figure 6B
  quote: Resonant frequency and the 3dB cutoff in response to the chirp stimulus were higher in
    L5 ET neurons in the MCx compared to the TCx
  data: with_labels
  depends_on:
  - link-cells
  - fig6a-area-variation
  criterion: From the two-way ANOVAs of fig6a, the area effects for resonant frequency (77 MCx, 70
    TCx in Figure 6B) and 3 dB cutoff. Reproduced when both have BH-corrected p < 0.05 with
    the MCx mean higher; partially when one does. The paper's code obtained means of 5.16
    and 3.30 Hz (fR) and 10.99 and 8.10 Hz (cutoff), MCx and TCx, corrected p 5.7e-5 and
    3.1e-4 (ETmean_sem.csv, ET_cross_p.csv); these are reported alongside, not as targets.
- id: fig6d-mcx-deeper-fahp-symmetric
  statement: L5 ET neurons in the MCx have a more pronounced fast AHP and faster, more symmetrical
    action potentials (lower ratio of max to min dV/dt) than those in the TCx.
  source: Results, Regional morpho-electric specializations in the L5 ET subclass, paragraph 4;
    Figure 6C to 6E
  quote: L5 ET neurons in the MCx had a more pronounced fast afterhyperpolarization (fAHP) and
    exhibited faster, more symmetrical ... action potentials compared to those in the TCx
  data: with_labels
  depends_on:
  - link-cells
  - fig6a-area-variation
  criterion: >-
    The Figure 6D and 6E legend says the opposite for the fAHP and for symmetry ("TCx ... have
    a deeper fast AHP ... than ... MCx ... and are more symmetrical"); the Results and the
    code's means (fAHP -14.18 mV MCx, -10.74 mV TCx; up/down ratio 2.84 and 3.57) agree with
    each other, so the Results are tested and the legend is recorded as a paper inconsistency.
    From the ANOVAs of fig6a: fAHP (more negative relative to threshold in MCx), up/down ratio
    (lower in MCx), and "faster" read as (a) shorter half-width and (b) more negative min
    dV/dt (the code finds max dV/dt not different, corrected p 0.13). Reproduced when fAHP, the
    up/down ratio and one reading of "faster" have corrected area p < 0.05 in the stated
    direction; partially when two of the three do.
- id: figs6b-mcx-lower-rin
  statement: The input resistance of L5 ET neurons is lower in MCx than in TCx, in both acute and
    cultured slices.
  source: Figure S6B legend, left
  quote: the input resistance of L5 ET neurons is lower in MCx (n = 76) compared with TCx (n =
    68) in both acute and culture preparations (FDR corrected p = 0.003, area effect, 2-way
    ANOVA)
  statistics:
  - test: two-way ANOVA, area effect
    p: 0.003
    corrected: FDR
    n: 76 MCx and 68 TCx L5 ET neurons
  data: with_labels
  depends_on:
  - link-cells
  - fig6a-area-variation
  criterion: The legend does not say which input resistance; the code's corrected area p is
    0.0033 for steady-state (SSRn) and 0.0081 for maximum input resistance (MaxRn), so SSRn
    matches the printed p. Both are run. Reproduced when the area effect has corrected p <
    0.05 with MCx lower, and MCx is lower within each preparation, for SSRn; MaxRn is shown as
    a variant.
- id: figs6b-mcx-higher-rheobase
  statement: MCx L5 ET neurons need more current to start spiking than TCx L5 ET neurons.
  source: Figure S6B legend, middle; Results, Regional morpho-electric specializations, paragraph 5
  quote: the current required to generate spiking in L5 ET neurons is higher in MCx (n = 78)
    compared to TCx (n = 70; FDR corrected p = 0.0496, area effect 2-way ANOVA)
  statistics:
  - test: two-way ANOVA, area effect
    p: 0.0496
    corrected: FDR
    n: 78 MCx and 70 TCx L5 ET neurons
  data: with_labels
  depends_on:
  - link-cells
  - fig6a-area-variation
  criterion: Rheobase as the lowest 1 s step amplitude that evokes a spike (the code's
    threshold_current; its corrected area p is 0.049). Reproduced when the area effect has
    corrected p < 0.05 with MCx higher. As p is near 0.05, the uncorrected p and the effect
    size are reported.
- id: figs6b-avg-gain-no-difference
  statement: The slope of the average-rate FI curve (maximum gain) does not differ between MCx and
    TCx L5 ET neurons.
  source: Figure S6B legend, right; Results, Regional morpho-electric specializations, paragraph 5
  quote: the slope of the average firing rate FI curve (max gain) is not different between areas
    (MCx, n = 78; TCx, n = 70; FDR corrected p = 0.869, area effect 2-way ANOVA)
  statistics:
  - test: two-way ANOVA, area effect
    p: 0.869
    corrected: FDR
    n: 78 MCx and 70 TCx L5 ET neurons
  data: with_labels
  depends_on:
  - link-cells
  - fig6a-area-variation
  criterion: A claim of absence on the paper's test, the area effect of the two-way ANOVA with BH
    correction across features. Maximum gain as in the code, the largest step-to-step
    increase in spike count of the 1 s steps divided by the current step (Hz/pA). The code's
    corrected p is 0.850, not the printed 0.869. Reproduced when corrected p is at least 0.05;
    the means and partial eta squared are reported either way.
- id: fig6h-tcx-steeper-instantaneous-fi
  statement: TCx L5 ET neurons fire onset doublets or bursts, so both the initial and the maximum
    slope of the maximum instantaneous FI curve are higher in TCx than in MCx.
  source: Results, Regional morpho-electric specializations in the L5 ET subclass, paragraph 5;
    Figure 6F to 6H
  quote: In the TCx, L5 ET neurons exhibited doublets or high-frequency bursts of action
    potentials at the onset of the current that were rarely observed elsewhere in the sweep or
    in MCx L5 ET neurons
  data: with_labels
  depends_on:
  - link-cells
  - fig6a-area-variation
  criterion: >-
    The paper quantifies the bursts through the slopes of the maximum instantaneous rate
    (1/ISI min) against current on the 1 s steps: initial gain is the slope where the neuron
    begins firing (the first suprathreshold step and the step before it) and maximum gain
    the largest step-to-step slope, each divided by the current step (Figure 6H has 69 TCx and
    78 MCx). From the ANOVAs of fig6a, reproduced when both have corrected area p < 0.05 with
    TCx higher; partially when only the initial slope does. The code obtained corrected p
    5.7e-5 and 4.7e-4 and initial-slope means of 0.28 (TCx) and 0.10 (MCx) Hz/pA.
# --- Extended FI to 4 nA (Figure 6I to 6K, S6C, S6D) ----------------------------------------
- id: figs6c-mcx-higher-max-rate
  statement: At maximal current injections MCx L5 ET neurons sustain higher average firing rates
    than TCx L5 ET neurons.
  source: Results, Functional specializations of MCx L5 ET neurons, paragraph 2; Figure S6C
  quote: L5 ET neurons in the MCx sustained higher average spike counts compared to L5 ET
    neurons in the TCx at maximal current injections ... maximal average firing rate, p =
    0.0002, two-sided t test, d = 1.0
  statistics:
  - test: two-sided t test
    p: 0.0002
    n: 42 MCx and 26 TCx L5 ET neurons
  expected:
    quantity: Cohen's d, maximal average firing rate
    value: 1.0
    tolerance: 0.1
  data: with_labels
  depends_on:
  - link-cells
  criterion: >-
    Cells: the L5 ET neurons recorded with 1 s steps increasing by 200 pA up to 4 nA (STAR
    Methods), 42 MCx and 26 TCx (keys of MCx.pkl and TCx.pkl). Per cell the maximum over
    steps of the spike count in the 1 s step; Welch t-test and pooled-SD Cohen's d
    (ExtendedFI.ipynb, which printed means 101.6 MCx and 76.0 TCx, p 0.00024, d 1.00).
    Reproduced when p < 0.05 with MCx higher and d within tolerance; partially when only the
    test holds.
- id: figs6d-equal-max-instantaneous
  statement: TCx L5 ET neurons reach higher instantaneous rates below 1 nA, but at up to 4 nA MCx
    L5 ET neurons fire at equivalent maximal instantaneous rates.
  source: Results, Functional specializations of MCx L5 ET neurons, paragraph 2; Figure S6D
  quote: MCx neurons were capable of firing equivalently at higher current injection amplitudes
    ... maximal instantaneous firing rate, p = 0.99, two-sided t test, d = 0.003
  statistics:
  - test: two-sided t test
    p: 0.99
    n: 42 MCx and 26 TCx L5 ET neurons
  data: with_labels
  depends_on:
  - link-cells
  - figs6c-mcx-higher-max-rate
  criterion: A claim of absence on the paper's test. Per cell the maximum over all steps of the
    maximum instantaneous rate 1/ISI(min); Welch t-test (ExtendedFI.ipynb printed 243.8 Hz TCx
    and 244.1 Hz MCx, p 0.99). Reproduced when p is at least 0.05; Cohen's d is reported. The
    first clause (TCx higher below 1 nA) rests on Figure S6D alone with no test; the mean
    maximum instantaneous rate per area at each step below 1 nA is shown and does not decide
    the outcome.
- id: fig6-depolarization-block
  statement: At high current amplitudes, TCx L5 ET neurons undergo depolarization block far more
    often than MCx L5 ET neurons (14 of 26 against 1 of 42).
  source: Results, Functional specializations of MCx L5 ET neurons, paragraph 2; Figure 6J, 6K
    and S6C, S6D (arrows)
  quote: L5 ET neurons in the TCx were more likely to undergo depolarization-induced block of
    action potential generation in response to these higher current injection amplitudes (MCx =
    1 of 42 neurons; TCx = 14 of 26 neurons)
  expected:
  - quantity: MCx neurons with depolarization block
    value: 1
    tolerance: 0.1
  - quantity: TCx neurons with depolarization block
    value: 14
    tolerance: 1.4
  data: with_labels
  depends_on:
  - link-cells
  - figs6c-mcx-higher-max-rate
  criterion: Block is "a negative slope in the average rate FI curves" (STAR Methods). The readings
