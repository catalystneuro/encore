    largest step below the maximum of the curve. Reproduced when, under one reading, both
    counts are within tolerance (1 of 42 exactly, 13 to 15 of 26); partially when, under one
    reading, the TCx proportion exceeds the MCx proportion but a count is outside tolerance.
    The paper reports no test; a Fisher exact test is shown as a variant and does not decide
    the outcome.
- id: fig6j-spike-width-ratio
  statement: At the maximal average firing rate, spike width more than doubles from first to last
    spike in TCx L5 ET neurons but increases only 1.5 times in MCx L5 ET neurons.
  source: Results, Functional specializations of MCx L5 ET neurons, paragraph 2; Figure 6J
  quote: At the maximal average firing rates, the spike width in TCx L5 ET neurons more than
    doubled, whereas MCx L5 ET neuron spike widths only increased 1.5 times ... p = 1.7e−09,
    two-sided t test, d = 2.02
  statistics:
