    test: two-sided t test
    p: 0.009
    corrected: FDR
    n: 12 MCx and 11 TCx reconstructions
  - about: apical dendrite maximum branch order
    test: two-sided t test
    p: 0.009
    corrected: FDR
    n: 12 MCx and 11 TCx reconstructions
  expected:
  - quantity: Cohen's d, basal length
    value: 2.22
    tolerance: 0.222
  - quantity: Cohen's d, basal horizontal extent
    value: 2.65
