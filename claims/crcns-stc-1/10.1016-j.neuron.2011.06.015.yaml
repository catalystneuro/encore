    the mean deviation of naive animals lies within the range of the trained animals.
- id: discussion-stimulus-reduces-correlation
  statement: Noise correlations decrease in the presence of the stimulus compared with
    prestimulus baseline activity.
  source: Discussion, Properties of Noise Correlations in MSTd, paragraph 2
  quote: we observed that noise correlations decrease in the presence of a stimulus as compared
    with prestimulus baseline activity
  criterion: The paper shows no figure or test. Needs spike times. rnoise as for the main
    measure in a prestimulus window against the middle 1 s of the stimulus; the prestimulus
    window is not stated, and the reading is the fixation period before motion onset (100 to
    200 ms, Experimental Procedures), with 500 ms before onset as a variant. The paper names no
    test; a paired t test over pairs is a standard choice, not the paper's. Reproduced when
    the mean prestimulus rnoise exceeds the stimulus rnoise by that test at p < 0.05.
