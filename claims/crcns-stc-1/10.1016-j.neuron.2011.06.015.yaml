  source: Discussion, Possible Explanations for the Effect of Training on Correlated Noise,
    paragraph 2; Figures S8A and S8B
  quote: we found that naive animals fixate as accurately as trained animals (Figure S8A).
    Indeed, naive monkeys as a group made significantly fewer microsaccades than trained
    animals (Figure S8B)
  statistics:
  - test: t-test
    p: 0.001
    p_relation: "<"
  criterion: Needs eye position records. Deviation from initial fixation position, averaged
    over trials per animal in the middle 1 s; microsaccades as eye velocity peaks above 10
    deg/s after smoothing with a 5 ms Gaussian (Figure S8 legend). The unit of the t test
    (trials or time bins per animal) is not stated; the readings are per trial and per animal.
