# Claims for Gu, Liu, Fetsch, Yang, Fok, Sunkara, DeAngelis & Angelaki (2011), Neuron 71:750-761,
# "Perceptual Learning Reduces Interneuronal Correlations in Macaque Visual Cortex", on CRCNS data
# set stc-1 (doi:10.6080/K07P8WKF).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-06,
# protocol as stated in docs/protocol.md (Reader).
#
# Text read: the version of record, as supplied under paper/ (PyMuPDF text of the journal PDF),
# with its Results, Discussion, Experimental Procedures and the legends of Figures 1 to 8, and
# the Supplemental Information PDF (legends of Figures S1 to S8). The article says the
# Supplemental Information "includes Experimental Procedures and eight figures"; the supplement
# as supplied, whose own contents page lists only the eight figures, holds no further
# procedures, so the Experimental Procedures of the article are taken as the whole Methods.
# The PDF could not be rendered here; the extracted text prints degree signs, minus signs and
# "approximately" as a replacement character, and quotes avoid those places. The paper links no
# analysis code, so none was read.
#
# Data the paper used. Eight male rhesus monkeys (Macaca mulatta): three "naive" animals trained
# only to fixate, and five "trained" animals extensively trained in a vestibular and visual
# heading discrimination task (left or right of straight ahead) before recording. Pairs of
# single units recorded simultaneously in area MSTd while the animals fixated passively and
# experienced headings of 0, +-22.5, +-45, +-90, +-135 and 180 degrees relative to straight
# ahead, in the horizontal and/or vertical plane, in two interleaved conditions: vestibular
# (motion platform, Gaussian velocity profile, 2 s, peak acceleration about 1 m/s2) and visual
# (optic flow, 3D star cloud). Each stimulus typically repeated five times, at least three for
# inclusion. Spike counts in the middle 1 s of the 2 s stimulus. 179 pairs from 270 neurons:
# 57 pairs on electrodes in separate guide tubes (0.8 to 25 mm apart), 55 pairs on electrodes
# in one guide tube, 67 pairs from single-electrode recordings sorted offline (distance set to
# 50 um). The main analyses use the 127 pairs separated by less than 1 mm: 89 in trained and
# 38 in naive animals; per animal 35, 26, 18, 8 and 2 pairs (trained) and 22, 11 and 5
# (naive). 41 pairs in trained animals were also recorded during the discrimination task.
# Measured variables per pair: noise correlation (per condition and pooled), signal
# correlation per condition, preferred headings, interneuronal distance, and the spike times
# behind the time courses of Figures 2C and 3. Figure 4, Figure S4 and Figures 8A and 8B use a
# larger database of single-electrode recordings from earlier studies (Gu et al. 2006, 2007,
# 2008a, 2010; visual n = 992, vestibular n = 556 tuned neurons; choice probabilities n = 311).
# Figure 2A uses behavioral thresholds over training (Fetsch et al. 2009; Gu et al. 2007,
# 2008a). Figure S8 uses eye position records. Figures 6, 7A and 7C are simulations built on
# the regression of noise on signal correlation fitted here.
#
# By its title and description, CRCNS stc-1 holds derived data (MATLAB files) from MSTd and
# VIP; its experiment 3 is described as 127 MSTd pairs with signal and noise correlations for
# the vestibular and visual conditions and the preferred headings of each pair, and lists this
# paper. Experiments 1 and 2 (single neurons) and the VIP pairs are described as coming from
# other papers. Whether the dataset holds spike times, distances, training group labels,
# pooled noise correlations or tuning curves is for the author to find.
#
# Method details fixed by the Experimental Procedures: spike counts in the middle 1 s of the
# stimulus; per heading, responses z-scored (minus the mean, divided by the SD); points with
# z-scores larger than 3 removed; z-scores pooled across headings, then across the visual and
# vestibular conditions, and rnoise is the Pearson correlation of the pooled z-scores. Signal
# correlation is the Pearson correlation of the two tuning curves (mean firing rate in the
# middle 1 s per heading), per condition. Time courses in 500 ms windows stepped by 50 ms (31
# windows). Permutation tests on the sum of squared differences between group time courses,
# 10,000 permutations, p the proportion of permuted values above the observed one. Fano factor
# from a type II regression of log variance on log mean with the slope fixed at 1, as
# 10^intercept, values below 0.1 set to 0.1 (Figure S3). Population thresholds from Fisher
# information (equations 2 to 5), with the covariance Q = r sqrt(f_i f_j) and r given by the
# regression on the two signal correlations.
#
# Details the paper leaves open that bear on several claims, each with the readings named in
# the claims that use it: (1) whether the reported rnoise values include the renormalization
# in blocks of 20 trials described in the Methods (readings: without it, with it); (2) whether
# the outlier rule removes z > 3 or |z| > 3, and whether a trial removed for one neuron is
# removed for both (readings: |z| > 3 removing the trial for both neurons, z > 3 removing it
# for both); (3) the form of the t tests (two-sample, two-sided Student or Welch).
