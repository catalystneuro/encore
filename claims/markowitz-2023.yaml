  statistics:
  - test: two-sided Wilcoxon signed-rank test
    statistic: z = 3, effect size r = 0.8
    p: 0.0006
    n: 14 averages
- id: fig2k-dlight-predicts-sequence-variability
  statement: A higher-amplitude dopamine transient at a syllable instance is followed by less
    predictable syllable choices over the next several seconds.
  source: Results, Dopamine predicts future syllable use and sequencing, paragraph 3; Figure 2j-l
  quote: if a given instance of a syllable was associated with a relatively high amplitude dopamine
    transient, the mouse tended to make less predictable syllable choices over the next several
    seconds
- id: fig3i-optoda-entropy
  statement: Behavioural sequences right after Opto-DA stimulation are less predictable than after
    catch trials.
  source: Results, Syllable-associated Opto-DA influences behaviour, paragraph 3; Figure 3i
  quote: behavioural sequences observed immediately after Opto-DA stimulation were more
    unpredictable than the those observed on catch trials
- id: ed10d-optoda-vigour
  statement: Opto-DA delivered on the fastest (slowest) quartile of target instances makes later
    instances faster (slower).
  source: Results, Syllable-associated Opto-DA influences behaviour, paragraph 4; Extended Data
    Figure 10d
  quote: this manipulation systematically increased the velocity with which the target syllable was
    later expressed ... Opto-DA during the slowest quartile of the syllable velocity distribution
    caused future instances of the targeted syllable to slow down
  statistics:
  - test: two-sided Mann-Whitney U test
    statistic: u = 167, f = 0.77
    p: 0.013
    n: 18 up experiments and 12 down experiments
- id: fig4b-endo-da-influence-consistent
  statement: Per mouse, the influence of endogenous dopamine on syllable counts and on sequence
    entropy are correlated (r = 0.69, P = 0.001).
  source: Figure 4b
  quote: scatter plot (including linear regression model fit) of per mouse average Endo-DA count
    influence and Endo-DA entropy influence
  statistics:
  - test: one-sided shuffle test
    statistic: Pearson r = 0.69
    p: 0.001
- id: fig4c-endo-da-predicts-learning
  statement: Mice whose syllable use is more influenced by endogenous dopamine learn more from
