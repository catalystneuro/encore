# Claims for Markowitz, Gillis, Jay et al. (2023), "Spontaneous behaviour is structured by
# reinforcement without explicit reward", Nature 614, 108-117, doi:10.1038/s41586-022-05611-2,
# on dandiset 000559.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-19,
# protocol pilot-16 as stated in docs/protocol.md.
#
# Text read. The version of record, open access under CC BY 4.0, as served by Europe PMC
# (PMC9892006): main text, figure legends, Methods and Extended Data figure and table legends. The
# supplementary information is a Reporting Summary and a Peer Review File; no result rests on them
# and they were not read. Numbers drawn only inside figures (the r values printed in Fig. 2b, 2i
# and 5b, for example) could not be read, as no PDF was supplied; claims rest only on numbers in
# the text. The dataset's data were not looked at.
#
# Code. github.com/dattalab/dopamine-reinforces-spontaneous-behavior at commit 14ed714 (25 January
# 2023). It holds the library rl_analysis (photometry helpers in photometry/signal.py,
# photometry/util.py and io/df.py, lagged analyses in photometry/lagged.py, the decoding model in
# photometry/decoding, the RL models in models_rl), preprocessing notebooks (dlight_00 to dlight_14,
# behavior_00 to behavior_03) and one notebook per figure panel (notebooks_panels). It starts from
# processed tables on Zenodo (10.5281/zenodo.7274803): the raw-to-dF/F photometry pipeline, the
# movement-initiation labels, the peak detection of Fig. 2a and 3c, the Fig. 1l classifier, the Fig.
# 2g cross-correlation and the catch-trial dLight of Fig. 4f are computed outside the repository.
# Where the Methods are silent and the code settles a detail, the criteria follow the code and say
# so; where the two disagree, the Methods give the main reading and the code a variant.
#
# Data the paper describes.
# - Photometry in DLS. dLight1.1 in DLS, fibre 200 um above (Methods). 14 mice in all (Fig. 1b, 216
#   experiments): C57BL/6J dLight-only mice and DAT-IRES-cre mice with dLight in DLS and ChrimsonR in
#   SNc ("dLight+ChrimsonR", 10 mice, 2 for calibration and 8 also run through closed-loop
#   experiments). Two dLight-only mice failed photometry quality control and appear only in Extended
#   Data Fig. 2a,b,d. Baseline photometry is the day before a stimulation day, or the day after with
#   the targeted syllable left out (378 experiments); where the target could not be left out the day
#   after was dropped. Open field, circular, dark, 30-min experiments, two per day.
# - Photometry in DMS. 8 C57BL/6J mice, 64 experiments, same methods.
# - Food reward. 6 dLight mice, food and water restricted, chocolate chip pieces placed at random
#   (about one per 4 min) for 30 min; consumption onsets marked by a human observer.
# - Keypoints. 5 mice in a six-camera arena (Azure Kinect, 30 Hz), 15 keypoints, GIMBAL.
# - Opto-DA. 20 DAT-IRES-cre::Ai32 mice (ChR2 in dopamine neurons, bilateral fibres over DLS) and 12
#   no-opsin DAT-IRES-cre controls (6 of them implanted over nucleus accumbens). For each of six
#   target syllables a three-day schedule: day 1 two 30-min baseline experiments, day 2 two 30-min
#   stimulation experiments (470 nm, 10 mW, one 250-ms pulse on 75% of online target detections, the
#   other 25% being catch trials), day 3 two baseline experiments; the post day of one target can be
#   the baseline day of the next. Repeated with 3-s pulsed stimulation (25 Hz, 5 ms) in 3 Ai32 mice
#   and 2 controls. Velocity-modulation experiments in 5 Ai32 mice, 90 min (30 min to estimate the
#   target's velocity distribution, then stimulation on detections above its 75th or below its 25th
#   percentile). The 8 dLight+ChrimsonR mice ran the closed loop with 250-ms continuous, 2-s continuous
#   and 3-s pulsed (25 Hz, 5 ms) red-light stimulation. Calibration in 2 dLight+ChrimsonR mice,
#   open-loop 250-ms pulses at random 6 to 17 s intervals.
# - Measured variables. Depth video at 30 Hz; MoSeq syllables from the offline variant (Viterbi) for
#   all data except the Opto-DA experiments of Fig. 3 and 4, which use the online variant (Methods,
#   Offline variant); 2D velocity, angular velocity, height velocity, acceleration and jerk;
#   470-nm dLight and 405-nm reference photometry, demodulated and downsampled to 30 Hz; stimulation
#   times; HEK cell imaging (Extended Data Fig. 1a-d).
#
# Definitions used by several criteria.
# - dLight (Methods, Photometry pre-processing and Photometry active referencing). dF/F0 with F0 the
#   10th percentile in a 5-s sliding window, for dLight and reference; the reference low-passed with
#   a second-order Butterworth at 3 Hz and fitted to dLight by RANSAC with slope and bias, then
#   subtracted; the result z-scored in a 20-s sliding window with a one-sample step. The code's only
#   worked example (fig_s03 notebook, cell 15) uses the same steps with a centred window and a RANSAC
#   fit without intercept (photometry/signal.py, rereference); the no-intercept fit is a variant.
# - Quality control. Methods keep experiments whose maximum percentage dF/F0 exceeds 1.5 and whose
#   dLight-to-reference correlation is below 0.6. The code (signal.py,
#   compute_photometry_quality_metrics; io/df.py, dlight_exclude) uses the 90th percentile of an
#   exponentially smoothed dF/F (window 50, tau 10) in percent above 1.5, the correlation of the
#   smoothed dF/F traces below 0.6, and drops any session with a raw dF/F value above 1.0. Readings
#   are (a) the Methods' maximum, (b) the code's rule; an outcome that differs between them is
#   reported under both.
# - Syllable-associated dLight. The maximum z-scored dLight from syllable onset to 300 ms after
#   (Methods, Analysing the relationship between dLight and syllable statistics within an experiment
#   across syllables; code feature signal_reref_dff_z_max_(0.0, 0.3), window inclusive).
# - Syllables. The 37 syllables used more than 1% of the time (Extended Data Fig. 2f); the code
#   keeps syllables whose mean usage over mice exceeds 1% (all_behavior_00, cells 12 to 14).
# - Photometry experiments are those without stimulation. In dLight+ChrimsonR mice the day after a
#   stimulation day is used with the target syllable's instances removed (Methods), or dropped where
#   the code drops it (code session numbers 3 and 4, commented "remove post-stim sessions").
# - Shuffle test (Methods, Statistics). An observed correlation against 1,000 shuffled ones; when it
#   exceeds all of them P is given as < 0.001. Holm-Bonferroni correction "where appropriate".
# - Opto-DA sessions. Code session numbers -1 and 0 are baseline, 1 and 2 stimulation, 3 and 4 post
#   (behavior_01, cell 23). Catch trials are online target detections without light.
#
# Revision of 2026-11-19. The earlier file was written after the data check had been seen and took
# some choices from the data (group and site names in the files, a 0.17-s stimulation latency,
# label ranges); these are removed and every method below is from the paper or its code. Criteria
# that misread the code (100 shuffles in Fig. 1e, the measure behind Fig. 1h, a 1,800-s count window
# in Fig. 3e) are corrected, criteria are added to the claims that had none, and claims are added
# for further panels with numbers in the text.
schema_version: 2
paper: doi:10.1038/s41586-022-05611-2
claims:
- id: ed2a-syllable-repertoire
  statement: MoSeq identifies 37 commonly used syllables, with median duration 400 ms (mean 566 ms,
    s.d. 636 ms).
  source: Results, Relating DLS dopamine to spontaneous behavior, paragraph 1; Extended Data Figure 2a
  quote: MoSeq identified 37 commonly used behavioural syllables, whose median duration was 400 ± 636
    ms ... The mean/median syllable duration was 566/400 ms +/− 636 ms SD
  expected:
  - quantity: number of syllables used more than 1% of the time
    value: 37
    tolerance: 3.7
  - quantity: median syllable duration
    value: 400
    tolerance: 40
    unit: ms
  - quantity: mean syllable duration
    value: 566
    tolerance: 56.6
    unit: ms
  criterion: Offline labels of the photometry experiments. A syllable's duration is the time from its
    onset to the next onset. Extended Data Fig. 2a,b,d include the two dLight-only mice that failed
    photometry quality control (Methods; Extended Data Fig. 2b gives n = 16 mice), so their
    experiments are included. The paper does not say over which experiments the durations are pooled;
    readings are (a) all DLS photometry experiments of the 16 mice, (b) all open-field experiments of
    the dandiset with offline labels. Usage above 1% is read as in all_behavior_00 (mean over mice of each
    mouse's usage fraction).
- id: fig1e-velocity-timescales
  statement: DLS dopamine fluctuations are significantly negatively correlated with translational
    velocity at short timescales (under 10 s), and the correlation reverses and becomes positive at
    longer timescales, for both dLight transient rates and binned amplitudes.
  source: Results, Relating DLS dopamine to spontaneous behavior, paragraph 2; Figure 1e
  quote: These dopamine fluctuations (measured as both dLight transient rates and average binned
    amplitudes) were only weakly correlated with many aspects of movement kinematics ... but were
    significantly negatively correlated with translational velocity at short timescales (<10 s);
    this correlation reversed and became positive at longer timescales
  criterion: As in dlight_00_compute_binned_scalar_correlation and the fig_1e panel. DLS photometry
    experiments (216); dLight re-z-scored per experiment; 2D velocity. Non-overlapping bins of 0.25
    to 59.75 s in 0.5-s steps, keeping only bins with the modal number of samples; per bin the mean
    dLight (amplitude) and the transient rate. The transient threshold is open; readings are (a) the
    code's upward crossings of 1.96, (b) crossings of 1 s.d., the transient definition of Extended
    Data Fig. 1h and 7a. Pearson r per experiment and bin size, averaged per mouse, then over mice.
    Null of 1,000 permutations of the binned dLight within experiment (Methods, Statistics; code
    cells 28 and 29). Significance is open between (a) the legend's shuffle test at P < 0.05 per bin
    size against the 2.5 and 97.5 percentiles of the shuffled means, and (b) the code's two-sided
    test with Holm correction over bin sizes, marked only for 5 or more consecutive significant bin
    sizes. The code casts bin size to an integer before correlating, pooling pairs of bin sizes; that
    is shown as a variant. For one measure the claim holds when, under a reading, the mean r is
    significantly negative at bin sizes below 10 s and significantly positive at some bin size of
    10 s or more. Reproduced when it holds for both measures; partially reproduced for one.
- id: ed3c-keypoint-velocity
  statement: In keypoint-tracked mice, 2D velocity is negatively correlated with dLight in 400-ms
    bins (r = -0.16), and forelimb velocity, with other kinematics partialled out, correlates only
    negligibly (r = -0.02).
  source: Extended Data Figure 3c; Results, Relating DLS dopamine to spontaneous behavior, paragraph 2
  quote: correlation between 2D velocity and dLight fluorescence after binning the data into 400ms
    time points (Pearson r = −0.16, p < .001 one-sided shuffle test) ... (see Methods , Pearson r =
    −0.02, p < .001 one-sided shuffle test)
  statistics:
  - about: 2D velocity against dLight
    test: one-sided shuffle test
    statistic: Pearson r = -0.16
    p: 0.001
    p_relation: "<"
    n: 5 mice
  - about: 3D forelimb velocity against partialled dLight
    test: one-sided shuffle test
    statistic: Pearson r = -0.02
    p: 0.001
    p_relation: "<"
  expected:
  - quantity: Pearson r, 2D velocity and dLight in 400-ms bins
    value: -0.16
    tolerance: 0.016
  - quantity: Pearson r, 3D forelimb velocity and partialled dLight
    value: -0.02
    tolerance: 0.002
  criterion: The 5 keypoint mice. 2D velocity from the x-y centroid of the spine keypoints, the
    difference over 2 frames divided by 2 (Methods, Computing 2D and 3D velocity); forelimb velocity
    the mean 3D velocity of the forepaw keypoints. dLight processed as in the fig_s03 notebook (cell
    15). Forelimb r after regressing 2D velocity, 3D velocity and height out of dLight (Methods,
    Partialing kinematic parameters). Bins of 400 ms, non-overlapping; whether r is pooled over all
    bins of all mice (the legend's single scatter) or averaged per mouse is open, both readings
    shown. Shuffle test with 1,000 shuffles. The 10% tolerance on -0.02 is below the precision the
    paper prints; a value that rounds to -0.02 also counts.
- id: fig1f-syllable-vs-movement-onset
  statement: The average syllable-associated dLight transient exceeds that associated with movement
    initiation (P = 0.0006, n = 14 mice).
  source: Figure 1f legend
  quote: The average syllable-associated dLight transient exceeds that associated with movement
    initiation
  statistics:
  - test: two-sided Wilcoxon signed-rank test
    statistic: z = 3, effect size r = 0.8
    p: 0.0006
    n: 14 averages
  criterion: Movement initiations as in Methods, Movement initiation analyses (centroid velocity
    z-scored per experiment, 50-point boxcar, derivative cubed, scipy find_peaks with height,
    width and prominence 1); syllable onsets from offline labels. Onset-aligned dLight z-scored over
    -10 to +10 s around each onset, averaged per mouse and z-scored to circularly shuffled averages
    (Methods give 1,000 shuffles, the legend 100; both shown). The compared quantity is open; readings
    are (a) the per-mouse mean absolute z over -1 to +1 s, as the fig_1f, s5f notebook (cells 60
    and 64), which also high-passes each snippet at 1 Hz, (b) the per-mouse peak from 0 to 0.3 s.
    Reproduced when, under a reading, the syllable value exceeds the movement value with a two-sided
    Wilcoxon signed-rank P < 0.05 over the 14 mice.
- id: fig1f-dip-then-peak
  statement: DLS dopamine fluctuates at syllable transitions with a dip followed by a peak.
  source: Results, Relating DLS dopamine to spontaneous behavior, paragraph 3; Figure 1f,g
  quote: These fluctuations exhibited a characteristic dip-then-peak pattern surrounding each syllable
    transition
  depends_on:
  - fig1f-syllable-vs-movement-onset
  criterion: Syllable-onset-aligned dLight of the 14 DLS mice (offline labels), z-scored over -10 to
    +10 s around each onset and then against circularly shuffled averages (Methods, dLight average
    waveform z-scoring; 1,000 shuffles in the Methods, 100 in the Fig. 1f legend, both shown),
    averaged per mouse and then over mice, with the 95% shuffle interval of the legend. The paper
    fixes no window for the dip and the peak; as an assumption, the claim holds when within -1 to +1
    s of onset the average falls below the shuffle interval and afterwards rises above it, the
    minimum preceding the maximum.
- id: fig1h-syllable-dlight-differs
  statement: Average syllable-associated dLight amplitudes differ across syllables (Kruskal-Wallis
    H = 209.29, P < 1e-25, n = 518 mouse-syllable pairs).
  source: Figure 1h legend
  quote: Right, z-scored average syllable-associated waveforms, sorted by peak fluorescence ...
    Kruskal–Wallis H test on average syllable-associated fluorescence amplitudes
  statistics:
  - test: Kruskal–Wallis H test
    statistic: H = 209.29
    p: 1.0e-25
    p_relation: "<"
    n: 518 mouse–syllable pairs
  expected:
  - quantity: Kruskal-Wallis H across syllables of mouse-syllable averages
    value: 209.29
    tolerance: 20.93
  - quantity: number of mouse-syllable pairs
    value: 518
    tolerance: 0
  criterion: The 37 syllables in the 14 DLS mice (518 = 14 x 37), baseline experiments. The amplitude
    per mouse and syllable is open; readings are (a) the mean over instances of the
    syllable-associated dLight, (b) as the fig_1h-right notebook (cell 18), each instance's dLight
    z-scored over -10 to +10 s around onset, averaged per mouse and syllable, and the average's
    mean over 0 to 0.3 s, (c) the same average's maximum over 0 to 0.3 s (cell 19), (d) the peak
    from 0 to 0.3 s of each mouse-syllable average waveform after the second normalisation against
    1,000 circularly shuffled averages (Methods, dLight average waveform z-scoring; Extended Data
    Fig. 4f right gives this peak for the same 518 rows). A Kruskal-Wallis test across syllables. Reproduced when, under a reading, P < 1e-25 and H is within
    tolerance; partially reproduced when P < 0.05 but not both; not reproduced when P >= 0.05. The
    count of pairs has no tolerance, being 14 times 37.
- id: fig1j-weak-kinematic-correlation
  statement: Syllable-associated dopamine transient amplitudes correlate only weakly with the
    velocity and angular velocity of the syllable instance.
  source: Results, DLS dopamine does not predict syllable identity, paragraph 1; Figure 1j
  quote: Furthermore, syllable-associated dopamine transient amplitudes only weakly correlated with
    the movements actually expressed during a given syllable
  criterion: Per syllable instance in DLS experiments, the instance's dLight and its mean 2D velocity
    or angular velocity; 2,000 instances drawn at random per mouse (28,000 points, as the legend's n).
    The dLight measure has two readings, (a) the syllable-associated dLight the Methods define and
    the legend names (maximum z-scored dLight from onset to 0.3 s), (b) the mean experiment-z-scored
    dLight over the instance, as the fig_1j notebook takes it (feature signal_reref_dff_z, aggregate
    mean). Huber regression
    (epsilon 1.05) with fivefold cross-validation repeated 100 times; r is the Pearson correlation of
    the pooled held-out predictions with the data. The paper gives no bound for weak, so one is
    fixed here as an assumption, a held-out |r| below 0.3; the correlation is reported with its
    one-sided shuffle P (1,000 shuffles). Reproduced when, under a reading, |r| < 0.3 for both
    velocity and angular velocity.
- id: fig1l-identity-not-decodable
  statement: Random forest classifiers cannot predict which syllable is being expressed from the
    coincident dLight peak amplitude or waveform.
  source: Results, DLS dopamine does not predict syllable identity, paragraph 2; Figure 1l
  quote: Indeed, random forest classifiers were unable to predict which syllable was being expressed
    by the mouse at any moment based on the coincident dLight waveform amplitudes or shapes
  criterion: A claim of absence, judged on the paper's test (Methods, Decoding syllable identity from
    dLight waveforms). A random forest (1,000 trees, maximum depth 1,000, 128 bins, as cuRF) with
    fivefold cross-validation, on (1) the syllable-associated dLight of each instance, and (2) the
    dLight waveform and its derivative from onset to 300 ms; labels are the 37 syllables. Held-out
    accuracy is compared with 100 shuffles of syllable identity; P is the fraction of shuffled
    accuracies at or above the observed one, as the fig_1l notebook does. Reproduced when neither
    input gives P < 0.05; not reproduced when either does, with the accuracies and chance shown.
    The classifier code is not in the repository; any random-forest implementation with these
    settings is used. Syllable groups from the MoSeq-distance dendrogram (cut-offs in steps of 0.2)
    are shown as a variant, with Bonferroni correction across cut-offs as the notebook applies.
- id: fig2a-food-reward-transients
  statement: Spontaneous syllable-associated dopamine transients roughly match those during
    consumption of an unexpected chocolate chip (mean spontaneous peak 2.12 +- 0.80 z, n = 5,247;
    reward 2.36 +- 0.92 z, n = 10).
  source: Figure 2a; Methods, Food reward experiments
  quote: Mean spontaneous transient peak had observed magnitudes of 2.12 ± 0.80 ΔF/F0 (z) (n = 5,247
    transients). By comparison, mean reward consumption-associated transients had an approximate
    magnitude of 2.36 ± 0.92 ΔF/F0 (z) (n = 10 transients)
  expected:
  - quantity: mean spontaneous transient peak
    value: 2.12
    tolerance: 0.8
    unit: z
  - quantity: mean reward consumption transient peak
    value: 2.36
    tolerance: 0.92
    unit: z
  - quantity: number of spontaneous transients
    value: 5247
    tolerance: 524.7
  - quantity: number of reward transients
    value: 10
    tolerance: 1
  criterion: The tolerances on the means are the spreads the paper reports. Reward peaks are the
    z-scored dLight at the marked consumption onsets (Methods). Spontaneous peaks are open (the
    detection is done outside the code); readings are peaks of the z-scored dLight above the dotted
    detection threshold of Fig. 2a, drawn at 1.5 z in the fig_2a notebook, (a) in the food-reward
    experiments outside consumption, (b) in all DLS baseline experiments. Reproduced when both means
    are within tolerance under a reading.
- id: fig2b-dlight-usage-across-syllables
  statement: Syllables associated on average with more DLS dopamine in an experiment tend to be
    used more.
  source: Results, Dopamine predicts future syllable use and sequencing, paragraph 2; Figure 2b
  quote: those syllables that were on average associated with more DLS dopamine during a given
    experiment tended to be used more during that experiment
  criterion: Methods, Analysing the relationship between dLight and syllable statistics within an
    experiment across syllables. Syllable-associated dLight averaged per syllable and experiment,
    z-scored across syllables within the experiment, then dLight and syllable counts averaged over
    experiments per mouse and syllable; pairs kept when the syllable occurs at least 100 times in
    the mouse. Huber regression (epsilon 1.05, from the fig_2b, 2i notebook) predicting counts from
    dLight, fivefold cross-validation repeated 100 times; r is the Pearson correlation of the pooled
    held-out predictions with the data. Null of 1,000 fits with dLight permuted across pairs (fivefold
    repeated 5 times, as the code); one-sided P. Reproduced when r > 0 with P < 0.05. The code's
    variants (dLight z-scored within mouse across experiment-syllable rows, instances shorter than
    0.3 s left out of the dLight average) are shown.
- id: fig2i-dlight-entropy-across-syllables
  statement: Mice string together more deterministic sequences after syllables associated with less
    dopamine; average syllable-associated dLight correlates positively with the entropy of the
    syllable's outgoing transitions.
  source: Results, Dopamine predicts future syllable use and sequencing, paragraph 3; Figure 2i
  quote: Examining the transition patterns between syllables revealed that mice tended to string
    together more deterministic behavioural sequences when average syllable-associated dopamine was
    relatively low rather than high
  depends_on:
  - fig2b-dlight-usage-across-syllables
  criterion: As for fig2b-dlight-usage-across-syllables, with the Shannon entropy of each syllable's
    outgoing transition probabilities per experiment (Methods) in place of the count. The code adds
    1/36 to each of the first 37 destinations before normalising and uses log base 2
    (dm_entropy, fig_2b, 2i notebook); this is followed, the base not changing r. Reproduced when r >
    0 with one-sided shuffle P < 0.05.
- id: fig2b-across-experiments
  statement: Across experiments, variation in the average dLight associated with a syllable predicts
    variation in that syllable's use relative to others.
  source: Results, Dopamine predicts future syllable use and sequencing, paragraph 2; Figure 2b,
    bottom; Methods, Analysing the relationship between dLight and syllable statistics across
    experiments for each syllable
  quote: variation in the average level of DLS dopamine associated with a given syllable across
    experiments predicted variation in the use of that same syllable (relative to others) across
    experiments
  criterion: Methods, Analysing the relationship between dLight and syllable statistics across
    experiments for each syllable (379 experiments). Syllable-associated dLight (maximum z-scored
    dLight from onset to 0.3 s) averaged per experiment and syllable, then z-scored per syllable and
    mouse across experiments; syllable frequency z-scored the same way. Only syllables occurring at
    least 50 times per session on average. Values pooled across syllables per experiment, leaving one
    value per experiment and mouse. Huber regression predicting frequency from dLight, evaluated as
    for fig2b-dlight-usage-across-syllables (fivefold cross-validation repeated 100 times, held-out
    Pearson r, one-sided P against fits to shuffled data, 1,000 shuffles per Methods, Statistics).
    Reproduced when r > 0 with P < 0.05. The paper prints the r and P only inside the figure.
- id: fig2e-dlight-predicts-future-usage
  statement: When an instance of a syllable coincides with a higher-amplitude dopamine transient,
    that syllable is used more over the following minutes.
  source: Results, Dopamine predicts future syllable use and sequencing, paragraph 2; Figure 2c-g
  quote: if a given instance of a syllable coincided with a relatively high amplitude dopamine
    transient, that syllable was then used more over the next several minutes
  statistics:
  - test: one-sided shuffle test
    p: 0.05
    p_relation: "<"
  criterion: Methods, Analysing the moment-to-moment relationship between dLight and syllable
    statistics within an experiment, with the details the code fixes (dlight_03, dlight_04, fig_2e,
    2f). DLS baseline experiments, offline labels. Each experiment is cut into the five segments of
    Extended Data Fig. 2e, at 0, 360, 660, 900, 1680 and 1800 s as dlight_03 computes them. For each
    instance, its syllable-associated dLight and the count of the same syllable among the following
    n - 1 syllables, n = 10 to 390 in steps of 20 (the Methods give 5 to 400). Pearson r per mouse,
    syllable, segment and n over the instances pooled across the mouse's experiments; averaged over
    mouse-syllable pairs, z-scored against 1,000 shuffles of dLight within experiment and segment,
    then averaged over segments. Significance as the legend states, one-sided P < 0.05 per n; the
    code's two-sided test with Holm correction is a variant. "The next several minutes" is read as
    (a) every n up to 390 syllables, about 3.7 min at the mean syllable duration of 566 ms, or (b)
    every n up to 210 syllables, about 2 min. Reproduced when the correlation is significantly
    positive under a reading; partially reproduced when it is so only at shorter n; not reproduced
    when it is not significant at n = 10.
- id: fig2e-not-autocorrelation
  statement: The dLight autocorrelation and the dLight-velocity correlation decline sharply within a
    few hundred milliseconds, so they do not explain the dLight-usage relationship.
  source: Results, Dopamine predicts future syllable use and sequencing, paragraph 2; Figure 2e
  quote: The relationship between dopamine transient amplitudes and syllable usage was not due to
    autocorrelation in the dLight signal or to correlations between dopamine and velocity, both of
    which declined sharply after a few hundred milliseconds
  depends_on:
  - fig2e-dlight-predicts-future-usage
  criterion: As in dlight_04 and the fig_2e panel, with the same instances, segments, n and
    shuffles as fig2e-dlight-predicts-future-usage. Autocorrelation is the correlation of an
    instance's dLight with the mean dLight of the following n - 1 instances; the velocity curve uses
    the mean 2D velocity over instances 0 to n - 1. Reproduced when both z-scored curves fall inside
    the shuffle band (95th percentile of shuffled |z|) at some n at which the usage correlation is
    still significant; not reproduced when either stays as high as the usage correlation over the
    range where that one is significant.
- id: fig2g-usage-crosscorrelation
  statement: Binned syllable counts and syllable-associated dLight are cross-correlated across lags,
    above shuffles (P < 0.001).
  source: Figure 2g legend; Methods, Analysing the cross-correlation between syllable-associated dLight
    and syllable usage
  quote: Average cross-correlation between binned syllable counts and syllable-associated dLight
    fluorescence (from all mice and experiments) across lags
  statistics:
  - test: one-sided shuffle test
    p: 0.001
    p_relation: "<"
  criterion: Per syllable and experiment, syllable-associated dLight averaged and syllable counts
    summed in 3-min windows, correlated with the windows shifted by lags up to 7.5 min either way
    (the axis limits of the fig_2g notebook; the figure itself was not read), averaged over syllables and experiments, and z-scored against shuffles (Methods). Window
    step and shuffle scheme are open, the code being outside the repository; readings are (a)
    non-overlapping 3-min windows, (b) windows sliding by 30 s, each with 1,000 permutations of dLight
    across windows within experiment and syllable. Reproduced when, under a reading, the peak
    correlation exceeds all shuffles (P < 0.001); partially reproduced when P < 0.05.
- id: fig2h-specific-to-syllable
  statement: A dopamine transient's size does not substantially correlate with the later use of
    syllables neighbouring the index syllable in time; the relationship is specific to the
    associated syllable.
  source: Results, Dopamine predicts future syllable use and sequencing, paragraph 2; Figure 2h
  quote: the possible consequences of dopamine transients were largely restricted to the specific
    syllable with which they were associated, as the size of a given dopamine transient did not
    substantially correlate with the use of syllables neighbouring in time
  statistics:
  - test: one-sided shuffle test
    p: 0.05
    p_relation: "<"
  depends_on:
  - fig2e-dlight-predicts-future-usage
  criterion: As in dlight_08 and the fig_2h panel. For each instance, the syllable at offsets -5 to
    +5 from it, and that syllable's count in the 10 syllables from that offset on, correlated with the
    index instance's dLight per mouse, syllable, segment and offset; z-scored against 1,000 shuffles
    of dLight within experiment, offset and segment, and averaged over segments. One-sided P < 0.05
    with Holm correction over offsets. Reproduced when offset 0 is significant and no other offset is.
    Partially reproduced when offset 0 is significant and the z of every other offset is below half of
    offset 0's.
- id: fig2k-dlight-predicts-sequence-variability
  statement: A higher-amplitude dopamine transient at a syllable instance is followed by less
    predictable syllable choices over the next several seconds.
  source: Results, Dopamine predicts future syllable use and sequencing, paragraph 3; Figure 2j-l
  quote: if a given instance of a syllable was associated with a relatively high amplitude dopamine
    transient, the mouse tended to make less predictable syllable choices over the next several
    seconds
  statistics:
  - test: one-sided shuffle test
    p: 0.05
    p_relation: "<"
  criterion: Methods, Analysing the moment-to-moment relationship, sequence randomness. For each
    instance, the transitions among the next n syllables, n = 5 to 50 in steps of 5 (dlight_06).
    The instances are binned by their dLight into 20 bins, and the transition counts are summed per
    bin, mouse, segment and n (cells with at least 100 transitions, as the code). Entropy of the
    row-normalised summed matrix with a Perks prior (dm_entropy). The binning is open; readings are
    (a) the Methods' 20 equally spaced bins per syllable, (b) the code's 20 equal-count bins per
    mouse pooled over syllables. Correlation of dLight bin with entropy per segment and n (Pearson as
    the Methods say, Spearman as dlight_06; both shown), z-scored against 1,000 shuffles that permute
    destinations within each row of the transition counts, averaged over segments. Reproduced when,
    under a reading, the correlation is significantly positive (one-sided P < 0.05) at n = 5 and at
    every n up to at least 10 syllables (about 6 s at the mean syllable duration).
- id: ed6b-encoding-model-average
  statement: An encoding model predicts average syllable-associated dLight from future behaviour on
    held-out mouse-syllable pairs (r = 0.46); kinematics alone give r = 0.39, counts and entropy alone
    r = 0.22, so usage and sequence variability contribute independently.
  source: Extended Data Figure 6b; Results, Dopamine predicts future syllable use and sequencing,
    paragraph 4
  quote: average Pearson correlation of held-out mouse/syllable pairs r = 0.46, p < .001 ...
    Performance using kinematic parameters only, r = 0.39, counts and entropy only r = 0.22, both
    models p < .001 one-sided shuffle test
  statistics:
  - about: all features
    test: one-sided shuffle test
    statistic: Pearson r = 0.46
    p: 0.001
    p_relation: "<"
    n: 760 syllable/mouse pairs
  - about: kinematics only, and counts and entropy only
    test: one-sided shuffle test
    statistic: r = 0.39 and r = 0.22
    p: 0.001
    p_relation: "<"
  expected:
  - quantity: held-out r, all features
    value: 0.46
    tolerance: 0.046
  - quantity: held-out r, kinematic features
    value: 0.39
    tolerance: 0.039
  - quantity: held-out r, counts and entropy
    value: 0.22
    tolerance: 0.022
  criterion: Methods, Encoding model predicting average dLight from behaviour, with the code's
    choices (dlight_09, fig_s06b, s06c). Per DLS mouse and syllable (usage above 100, instances longer
    than 0.3 s), features count at 100 syllables, entropy at 10 and 2D velocity at 10 (the Methods
    and the Extended Data Fig. 6b legend; the fig_s06b, s06c notebook uses
    velocity_2d_mm_global_bin_5, shown as a variant), z-scored per
    mouse, ZCA-whitened; Bayesian linear regression (normal prior on weights, exponential on s.d.,
    NUTS 1,000 warm-up and 3,000 samples) with fivefold cross-validation repeated 50 times. r is the
    held-out correlation, averaged over mice as the code does or pooled (both shown). Shuffle test
    with 1,000 permutations. Reproduced when all three r are within tolerance and the full model has
    P < 0.05.
- id: ed6e-encoding-model-instantaneous
  statement: A convolutional encoding model predicts instantaneous dLight in held-out experiments
    (median r = 0.28 with all features; 0.23 with kinematics; 0.16 with syllable measures; n = 211).
  source: Extended Data Figure 6e
  quote: median correlation over all held-out experiments using all features r = 0.28 ... median r
    over held-out experiments for kinematic parameters 0.23; syllable-related measures 0.16; all
    correlations p < .001, one-sided shuffle test
  statistics:
  - test: one-sided shuffle test
    p: 0.001
    p_relation: "<"
    n: 211 experiments
  expected:
  - quantity: median held-out r, all features
    value: 0.28
    tolerance: 0.028
  - quantity: median held-out r, kinematic features
    value: 0.23
    tolerance: 0.023
  - quantity: median held-out r, syllable features
    value: 0.16
    tolerance: 0.016
  criterion: Methods, Encoding model predicting instantaneous dLight from behaviour, with the code's
    choices (fig_s06e, s06f, s06g notebook). Features syllable counts, transition entropy, a
    transition indicator, 2D, angular and height velocity and acceleration; kernels from -2 to 2 s
    (the code builds them from 25 cubic B-splines over 1,200 samples); Huber loss; dLight smoothed by
    a 60-sample boxcar; experiments of at least 23 min; twofold cross-validation over experiments
    within mouse; r per held-out experiment, median over experiments. The null is dLight traces
    permuted across experiments. Reproduced when the three medians are within tolerance and the full
    model exceeds the permuted null with P < 0.05.
- id: ed7-dms-fewer-transients
  statement: dLight recordings in dorsomedial striatum (DMS) show less frequent dopamine
    transients than in DLS.
  source: Results, Dopamine predicts future syllable use and sequencing, paragraph 4; Extended Data
    Figure 7a,b
  quote: dLight recordings in dorsomedial striatum (DMS) revealed less frequent dopamine transients
  statistics:
  - test: two-sided Mann-Whitney U test
    statistic: U = 97, f = .87
    p: 0.017
    n: 8 DMS and 14 DLS mice
  expected:
  - quantity: Mann-Whitney U, DLS against DMS transient rate
    value: 97
    tolerance: 9.7
  criterion: A transient is an upward crossing of 1 s.d. by the experiment's z-scored dLight (Extended
    Data Fig. 7a), with the code's persistence rule (get_ncrossings, threshold 1, the next 3 samples
    not below 0.25; fig_s07 notebook, cells 10 to 12). Rate per second in 300-s bins per experiment;
    per mouse the mean (legend) or the median (code; shown as a variant). Two-sided Mann-Whitney U
    test of 14 DLS against 8 DMS mice, Holm-corrected over the four statistics of Extended Data Fig.
    7b as the code does. Reproduced when DMS is lower with P < 0.05 and U is within tolerance;
    partially reproduced when P < 0.05 but U misses.
- id: ed7b-dms-transient-shape
  statement: DMS and DLS dopamine transients differ in time to peak and in full width at half maximum,
    but not significantly in area under the curve.
  source: Extended Data Figure 7b legend
  quote: Area under the curve, p = .052, U = 27, f=.24.; time to peak, p = .0001, U = 4, f = .036;
    Full-width at half-maximum p = .017, U = 16, f = .14
  statistics:
  - about: area under the curve
    test: two-sided Mann-Whitney U test
    statistic: U = 27, f = .24
    p: 0.052
  - about: time to peak
    test: two-sided Mann-Whitney U test
    statistic: U = 4, f = .036
    p: 0.0001
  - about: full width at half maximum
    test: two-sided Mann-Whitney U test
    statistic: U = 16, f = .14
    p: 0.017
  expected:
  - quantity: U, time to peak
    value: 4
    tolerance: 1
  - quantity: U, full width at half maximum
    value: 16
    tolerance: 1.6
  - quantity: U, area under the curve
    value: 27
    tolerance: 2.7
  depends_on:
  - ed7-dms-fewer-transients
  criterion: As in the fig_s07 notebook. Transients as in ed7-dms-fewer-transients; transient-aligned
    averages of +-90 samples per experiment, averaged per mouse, re-aligned where the slope first
    exceeds 0.035; over 0 to 2 s, area by trapezoid, time to peak at the maximum, and full width at
    half maximum after cubic interpolation to 500 Hz. Two-sided Mann-Whitney U tests, 14 DLS against
    8 DMS mice, Holm-corrected over the four statistics. Reproduced when time to peak and width have
    P < 0.05, area has P >= 0.05, and the three U values are within tolerance; partially reproduced
    when the pattern of significance holds but a U misses. The tolerance on the time-to-peak U is one
    rank, as 10% of 4 is finer than U can move.
- id: ed7d-dms-smaller-peaks
  statement: Peak dLight at syllable transitions and at movement initiations is lower in DMS than in
