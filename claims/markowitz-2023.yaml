    velocity after stimulation exceeds catch trials in Opto-DA mice with P < 0.05 in at least one
    bin and controls show no such bin; partially reproduced when Opto-DA is significant and a
    control bin is too; not reproduced otherwise.
- id: fig4b-endo-da-influence-consistent
  statement: Per mouse, the influence of endogenous dopamine on syllable counts and on sequence
    entropy are correlated (r = 0.69, P = 0.001).
  source: Figure 4b legend; Results, Dopamine-behaviour relationships predict learning, paragraph 1
  quote: scatter plot (including linear regression model fit) of per mouse average Endo-DA count
    influence and Endo-DA entropy influence (Pearson r = 0.69 computed from model predictions on
    leave-two-out held-out data; P = 0.001
  statistics:
  - test: one-sided shuffle test
    statistic: Pearson r = 0.69
    p: 0.001
    n: 8 dLight+ChrimsonR mice
  expected:
  - quantity: held-out Pearson r, Endo-DA count against entropy influence
    value: 0.69
    tolerance: 0.069
  depends_on:
  - fig2e-dlight-predicts-future-usage
  - fig2k-dlight-predicts-sequence-variability
  criterion: Methods, Using the influence of endogenous dopamine to predict Opto-DA reinforcement, with
    the code's choices (dlight_10, dlight_11, fig_4b-4e notebook). The 8 dLight+ChrimsonR mice.
    Count influence per mouse and syllable is the s.d. across bin sizes (10 to 390 syllables) of the
    Fig. 2e correlation z-scored against 1,000 shuffles, averaged over segments and smoothed by a
    3-bin rolling mean; entropy influence the same for the Fig. 2k correlation per mouse and syllable
    (bins of 5 to 60 syllables, 100 shuffles). Per mouse the mean over syllables (Methods) or the
    median as the code (variant). Bayesian linear regression (normal prior on the weight,
    exponential on the variance, NUTS) with leave-two-out cross-validation; r is the Pearson
    correlation of the pooled held-out predictions with the data; one-sided P from 1,000 shuffles.
    Reproduced when r is within tolerance and P < 0.05; partially reproduced when P < 0.05 but r
    misses.
- id: fig4c-endo-da-predicts-learning
  statement: Mice whose syllable use is more influenced by endogenous dopamine learn more from
    Opto-DA (r = 0.51, P = 0.001).
  source: Figure 4c legend; Results, Dopamine-behaviour relationships predict learning, paragraph 1
  quote: Scatter plot (including regression line) of per mouse average Opto-DA learning versus
    Endo-DA count influence (Pearson r = 0.51 (computed from model predictions on leave-two-out
    held-out data); P = 0.001
  statistics:
  - test: one-sided shuffle test
    statistic: Pearson r = 0.51
    p: 0.001
    n: 8 dLight+ChrimsonR mice
  expected:
  - quantity: held-out Pearson r, Opto-DA learning against Endo-DA count influence
    value: 0.51
    tolerance: 0.051
  depends_on:
  - fig4b-endo-da-influence-consistent
  criterion: Count influence as in fig4b-endo-da-influence-consistent. Opto-DA learning is the log2
    fold change of target counts on the 250-ms ChrimsonR stimulation day against baseline, z-scored
    against the log2 fold changes between all pairs of non-stimulation days of the mouse (Methods),
    averaged per mouse. Same regression, cross-validation and shuffle test. Reproduced when r is
    within tolerance and P < 0.05; partially reproduced when P < 0.05 but r misses.
- id: fig4f-catch-dlight-predicts-learning
  statement: Syllables with higher endogenous dLight on catch trials are more reinforced by Opto-DA
    (r = 0.32, P < 0.001).
  source: Figure 4f legend; Results, Dopamine-behaviour relationships predict learning, paragraph 2
  quote: scatter plot (including regression line) of catch trial syllable-associated dLight and
    Opto-DA learning for each mouse–syllable pair ( r = 0.32 over held-out data; P < 0.001
  statistics:
  - test: one-sided shuffle test
    statistic: r = 0.32
    p: 0.001
    p_relation: "<"
  expected:
  - quantity: held-out Pearson r, catch-trial dLight against Opto-DA learning
    value: 0.32
    tolerance: 0.032
  depends_on:
  - fig4c-endo-da-predicts-learning
  criterion: Mouse-target pairs of the 8 dLight+ChrimsonR mice, 250-ms stimulation. Catch-trial dLight
    is the mean syllable-associated dLight of the target on catch trials of the stimulation
    experiments; the code takes it from a precomputed table and the window is open between 0 to 0.3 s
    (the paper's syllable-associated dLight) and 0 to 0.6 s (the table's other column). Opto-DA
    learning as in fig4c-endo-da-predicts-learning, per pair. Standardised, Huber regression without
    intercept, fivefold cross-validation repeated five times (Methods); r of pooled held-out
    predictions; one-sided P from 1,000 shuffles. Reproduced when, under a reading, r is within
    tolerance and P < 0.05; partially reproduced when P < 0.05 but r misses.
- id: fig4h-decoding-model
  statement: A decoding model in which syllable-associated dopamine scales future usage and choice
    randomness predicts held-out syllable counts better than phase-shift and noise controls (median r
    0.20 against 0.04).
  source: Methods, Decoding model predicting behaviour from dLight, the sentences on the baseline model
    and its controls
  quote: "Median Pearson correlation between held-out predictions and observed data: actual model r =
    0.20, phase shift control r = 0.04, noise model r = 0.04. Comparison between actual model and
    controls, P = 7 × 10 −18 , U = 2,500, f = 1, Mann–Whitney U test, n = 50 model restarts"
  statistics:
  - test: two-sided Mann–Whitney U test
    statistic: U = 2,500, f = 1
    p: 7.0e-18
    n: 50 model restarts
  expected:
  - quantity: median held-out r, dLight model
    value: 0.2
    tolerance: 0.02
  - quantity: median held-out r, phase-shift control
    value: 0.04
    tolerance: 0.004
  - quantity: median held-out r, noise control
    value: 0.04
    tolerance: 0.004
  criterion: Methods, Decoding model, with the code's choices (fig_4h, 4i notebook,
    photometry/decoding). DLS baseline experiments with at least 2,500 syllables, their first 2,500;
    tau_a 100 and tau_b 10 syllables, alpha_b fixed, alpha_a fitted on training folds; the top 10
    syllables; Pearson r between simulated and actual counts after a 50-point rolling mean; fivefold
    cross-validation repeated 50 times (the legend's n; the Methods say 100). Phase-shift control
    rolls dLight by 1 to 1,000; noise control draws unit-variance normal values. Two-sided Mann-Whitney
    U test over repeats. Reproduced when the model's r and the controls' r are within tolerance (for
    the controls, values that round to 0.04 also count) and the model is higher with P < 0.05;
    partially reproduced when the model is higher with P < 0.05 but a value misses. The Fig. 4h
    legend prints the same P, U, f and n for the Opto-DA stimulation version of the model, which is
    fig4h-additive-model-optoda.
- id: fig4h-additive-model-optoda
  statement: In Opto-DA stimulation experiments, the additive decoding model (catch-trial dLight plus
    extra dopamine on stimulated instances) predicts held-out syllable use better than control models
    with no offset, time-shifted dLight or noise (P = 7e-18, U = 2,500, f = 1, n = 50 model restarts).
  source: Results, Dopamine-behaviour relationships predict learning, paragraph 2; Figure 4h legend
  quote: This additive model could reliably predict moment-to-moment syllable choices during the
    Opto-DA experiment (which included stimulation trials), but made less effective predictions when
    dopamine transients were shuffled in time relative to syllables
  statistics:
  - test: two-sided Mann–Whitney U test
    statistic: U = 2,500, f = 1
    p: 7.0e-18
    n: 50 model restarts
  depends_on:
  - fig4h-decoding-model
  criterion: Methods, Decoding model predicting behaviour from dLight, the part on extra DA, and Predicting the
    amount of exogenously added dopamine during Opto-DA experiments using the decoding model, with the
    code's choices (fig_4h, 4i notebook). The 250-ms ChrimsonR stimulation experiments of the 8
    dLight+ChrimsonR mice with at least 5 catch trials. Stimulated target instances get the target's
    mean catch-trial dLight plus an extra-DA offset (0 to 10 z in steps of 0.5) chosen on training
    folds; the model of fig4h-decoding-model otherwise. Fivefold cross-validation over stimulation
    experiments, 50 repeats (the legend's n; the Methods say 100, shown as a variant). Performance is
    the held-out correlation of simulated with actual syllable counts, as the notebook plots it (the
    legend says model-based likelihood; held-out log likelihood is shown as a variant). Controls are
    no offset, dLight circularly shifted by 1 to 1,000 syllables, and normal noise with the dLight's
    mean and s.d. Two-sided Mann-Whitney U test of the dLight model against each control over
    repeats. Reproduced when the dLight model is higher than every control with P < 0.05.
- id: fig4i-extra-da-matches-calibration
  statement: The extra dopamine the additive decoding model needs to predict syllable use in Opto-DA
    experiments matches the dLight evoked by Opto-DA in the calibration experiments.
  source: Results, Dopamine-behaviour relationships predict learning, paragraph 2; Figure 4i
  quote: the amount of extra dopamine required for the model to accurately predict actual syllable
    usage patterns closely matched the amount of dopamine elicited by Opto-DA in our calibration
    experiments
  depends_on:
  - fig4h-decoding-model
  - fig4h-additive-model-optoda
  - fig3c-calibration
  criterion: As in the fig_4h, 4i notebook. 250-ms ChrimsonR stimulation experiments with at least 5
    catch trials; stimulated instances get the mean catch-trial dLight of the target plus an offset
    of 0 to 10 z in steps of 0.5; fivefold cross-validation over stimulation experiments (the Methods
    say repeated 100 times, the notebook 50; both shown); the offset maximising held-out r is taken. The comparison
    distribution is the evoked dLight peaks of stimulated trials (0 to 0.6 s, as the notebook). The
    paper gives no bound for "closely matched"; readings are (a) the best offset lies within the
    interquartile range of evoked peaks, (b) within their central 95%. Reproduced under (a);
    partially reproduced under (b) only.
- id: fig5-rl-model
  statement: A Q-learning agent rewarded by syllable-associated dLight learns a transition matrix
    similar to the observed one, best when dopamine also transiently raises choice variability.
  source: Results, An RL model reproduces spontaneous behaviour, paragraph 3; Figure 5b-d
  quote: after training the model converged on a syllable transition matrix similar to that emitted
    by actual mice exploring an open field; comparing alternative formulations of this model
    revealed that maximal model performance depended on dopamine both reinforcing specific syllable
    transitions and briefly increasing the variability of syllable choices
  statistics:
  - test: shuffle test, model fits exceeding 95% of shuffle correlation values
    p: 0.05
    p_relation: "<"
    n: 100 shuffles
  criterion: Methods, Applying RL models, with the code's choices (dlight_13, dlight_14, models_rl, the
    fig_5b-5d notebook). DLS baseline experiments with at least 2,500 syllables, their first 2,500;
    top 10 syllables; reward the syllable-associated dLight; Q-table initialised uniform with zero
    diagonal; softmax policy; the full model raises temperature when reward crosses a threshold, the
    reinforcement-only model sets that rise to 0. Parameters by grid search on training folds of
    twofold cross-validation over experiments. Performance is the Pearson correlation of the
    row-z-scored mean Q-table with the held-out row-z-scored empirical transition matrix, diagonal
    excluded. Null of 100 circular shifts of each experiment's dLight. Reproduced when both models
    exceed the 95th percentile of the shuffles and the full model's correlation exceeds the
    reinforcement-only model's; partially reproduced when both are significant but the full model is
    not higher.
