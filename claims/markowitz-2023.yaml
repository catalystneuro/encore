  source: Methods, dLight calibration experiments; Figure 3c
  quote: The mean Opto-DA peak was measured at 2.18 ± 0.85 Δ F / F 0 ( z ), mean spontaneous peak =
    2.23 ± 0.62 Δ F / F 0 ( z ) and 99th percentile spontaneous peak = 3.40 Δ F / F 0 ( z )
  expected:
  - quantity: mean evoked dLight peak
    value: 2.18
    tolerance: 0.85
    unit: z
  - quantity: mean spontaneous dLight peak
    value: 2.23
    tolerance: 0.62
    unit: z
  - quantity: 99th percentile spontaneous peak
    value: 3.4
    tolerance: 0.34
