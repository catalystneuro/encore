  statistics:
  - test: one-sided shuffle test
    statistic: Pearson r = 0.51
    p: 0.001
- id: fig4f-catch-dlight-predicts-learning
  statement: Syllables with higher endogenous dLight on catch trials are more reinforced by Opto-DA
    (r = 0.32, P < 0.001).
  source: Figure 4f
  quote: scatter plot (including regression line) of catch trial syllable-associated dLight and
    Opto-DA learning for each mouse–syllable pair
  statistics:
  - test: one-sided shuffle test
    statistic: r = 0.32
    p: 0.001
    p_relation: "<"
- id: fig4h-decoding-model
  statement: A model in which endogenous and exogenous dopamine add predicts held-out syllable
    choices better than shuffled and noise controls (median r 0.20 against 0.04).
  source: Figure 4h; Methods, "Decoding model predicting behaviour from dLight"
  quote: Model-based likelihood of predicting held-out syllable choices on Opto-DA stim experiments
    (blue) relative to control models
  statistics:
  - test: two-sided Mann–Whitney U test
    statistic: U = 2,500, f = 1
    p: 7.0e-18
    n: 50 model restarts
- id: fig5-rl-model
  statement: A Q-learning agent rewarded by syllable-associated dLight learns a transition matrix
    similar to the observed one, best when dopamine also transiently raises choice variability.
  source: Results, An RL model reproduces spontaneous behaviour, paragraph 3; Figure 5b-d
  quote: after training the model converged on a syllable transition matrix similar to that emitted
    by actual mice exploring an open field; comparing alternative formulations of this model
    revealed that maximal model performance depended on dopamine both reinforcing specific syllable
    transitions and briefly increasing the variability of syllable choices
