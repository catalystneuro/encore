    stimulation experiments of Ai32 and control mice. 2D velocity, angular velocity, height velocity
    and acceleration averaged over five-syllable non-overlapping bins from stimulation onset, the
    same pre-onset values subtracted, then z-scored with the mean and s.d. of catch trials (Methods);
    stimulation against catch trials; per bin a one-sided Mann-Whitney U test (stimulation greater)
