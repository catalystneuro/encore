    responses in both phases.
  source: Results, Differential behavioral correlates of pulse-locked and non-pulse-locked neurons,
    paragraph 2; Figure 6B, 6C
  quote: "While both PL and NPL separation between hit and miss trials increased over time (PL: p FDR
    = 7.2e-26, r = 0.18; NPL: p FDR = 6.1e-3, r = 0.05), NPL responses showed greater separation
    between hit and miss trials than PL responses in both early (p FDR = 7.3e-116, r = 1.00) and late
    (p FDR = 7.3e-116, r = 0.34) phases"
  statistics:
  - about: PL, early against late
    test: two-sided Mann-Whitney U test
    statistic: r = 0.18
    p: 7.2e-26
    corrected: FDR (Benjamini-Hochberg)
  - about: NPL, early against late
    test: two-sided Mann-Whitney U test
    statistic: r = 0.05
    p: 6.1e-3
    corrected: FDR (Benjamini-Hochberg)
  - about: NPL against PL, early
    test: two-sided Mann-Whitney U test
    statistic: r = 1.00
    p: 7.3e-116
    corrected: FDR (Benjamini-Hochberg)
  - about: NPL against PL, late
    test: two-sided Mann-Whitney U test
    statistic: r = 0.34
    p: 7.3e-116
    corrected: FDR (Benjamini-Hochberg)
  criterion: Delta spikes per trial = spikes in the 700 ms train minus spikes in the preceding 700
    ms, each trial labelled by its response's PL class (Results). From the code
    (python/fig6/hit_miss_histograms.py, python/fig6/stats_table.py), per week and class, all
    trials pooled across mice; winsorized; 1000 bootstrap resamples of hit and of miss trials of
    size proportion times the smaller count; 25-bin histograms over -30 to 50; KL(hit || miss) with
    natural log; the bootstrap KL values of weeks 0 and 1 against weeks 2 to 4 (and NPL against PL
    per phase) by two-sided Mann-Whitney U, BH-FDR over the four tests. The code's two scripts
    differ, giving readings (a) winsorizing 1% and proportion 0.4, (b) 2.5% and 0.8. As the p-values
    scale with the number of bootstrap replicates, only directions and p_FDR < 0.05 are judged.
    Reproduced when, under one reading, all four comparisons hold in the paper's direction;
    partially reproduced when the NPL above PL comparisons hold and an early-late one does not. The
    per-trial delta spikes need trial outcomes and spike times, which the dataset is said to hold.
- id: fig6d-npl-hit-miss-divergence
  statement: PL responses showed no significant hit-miss divergence at any time, while NPL responses
    diverged significantly from 65 ms after ICMS onset in the early phase and from 35 ms in the late
    phase, both before movement onset.
  source: Results, Differential behavioral correlates of pulse-locked and non-pulse-locked neurons,
    paragraph 3; Figure 6D
  quote: Despite an increase in KL divergence from early to late learning, PL responses did not show
    any significant hit-miss divergence at any time point. In contrast, NPL responses diverged
    significantly beginning at 65 ms post-ICMS onset during the early period. With training, the
    onset of divergence in NPL neurons shifted earlier to 35 ms
  expected:
  - quantity: NPL divergence onset, early phase
    value: 65
    tolerance: 10
    unit: ms
  - quantity: NPL divergence onset, late phase
    value: 35
    tolerance: 10
    unit: ms
  criterion: Per unit (legend, "trial median responses of all PL and NPL units"), hit and miss
    trial-median firing-rate traces; per time bin, two-sided Mann-Whitney U of hit against miss
    units, signed -log10 p, clusters of contiguous bins over -log10 0.05, cluster mass the sum, 1000
    label permutations, cluster p the fraction of maximal null masses at least as large
    (python/fig6/hit_miss_psth.py:25-76). The bin width is in a missing data file; the readings are
    5 ms and 10 ms bins. The tolerance is one 10 ms bin, as onsets are quantised by the bin and 10%
    of 35 ms is below one bin. The code marks the last significant cluster (lines 148-150), while the
    text says "beginning at"; the onset is read as the start of the first significant cluster, the
    code's choice shown as a variant. Reproduced when, under one bin reading, PL has no significant
    cluster in either phase and NPL onsets are within tolerance, later in the early phase; partially
    reproduced when PL has none and NPL has significant clusters with onsets out of tolerance.
