    tolerance: 7.1
  - quantity: activated neurons, week 1
    value: 114
    tolerance: 11.4
  - quantity: activated neurons, week 2
    value: 220
    tolerance: 22
  criterion: The paper does not name the mouse or the channel. Volumetric activation counts at 4 uA,
