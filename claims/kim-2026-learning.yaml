  criterion: UnitMatchPy as in the Methods (match probability above 0.75, consecutive-session match
    at least 0.5, tracks of 3 or more sessions, waveform-distance exclusions at 3 and 5 times the
    medians) and python/fig_s8/generate_figure.py:374-501; the ratio is the median nearby-unit
    distance over the median within-track distance, nearby being within two contacts (lines
    340-373); that test one-sided, less (line 352), as the paper does not give its side. Tracked
    responses, PL and NPL, max z 50, per current two-sided Mann-Whitney U, early against late.
    Reproduced when the two numbers are within tolerance and PL modulation increases at p < 0.05 at
    one or more currents while NPL modulation is not significant at any; partially reproduced when
    the tracking numbers or the PL and NPL result, but not both, hold. UnitMatch needs the raw
    waveforms it reads from sorting analyzers; mean waveforms per session may limit it.
- id: fig6c-kl-divergence
  statement: Hit-miss separation of delta-spike distributions, by KL divergence, increased over
