- id: fig2d-density-peak-200um
  statement: Activation density peaked at around 200 um from the stimulation site, and most of the
    learning-related change in density occurred close to the site.
  source: Results, Behavioral learning enhances ICMS-evoked population activation over time,
    paragraph 3; Figure 2D; fig. S2A to S2C (not supplied)
  quote: The activation density peaked at around 200 μm (fig. S2A, B), consistent with previous
    studies in the absence of behavioral learning( 5 ). Most of the learning-related change in
    activation density also occurred in the close vicinity of the stimulation site
  criterion: Densities in concentric 100 um shells (activated neurons over shell volume) around the
    stimulation site at 5 uA (Methods; matlab/fig2/fig2e_density_r50_5uA.m:73-80), median over
    channel-sessions per shell. "Around 200 um" is read as the peak lying in the 100 to 200 um or
    the 200 to 300 um shell. The change is the late median minus the early median per shell;
    "close vicinity" is read as the largest change lying in one of the first two shells (0 to 200
    um). Reproduced when both hold; partially reproduced when one does.
