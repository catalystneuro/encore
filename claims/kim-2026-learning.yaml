# Claims for Kim, Lycke, Zolotavin, Montes, Xie & Luan (2026), "Learning induces
# activation-mechanism-dependent neural plasticity in an intracortical microstimulation task".
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-25,
# protocol pilot-18 as stated in docs/protocol.md.
#
# Text read. The bioRxiv preprint, version 1 (doi:10.64898/2026.06.05.730421), flattened from its
# JATS XML: main text, figure legends of Figures 1 to 7, Discussion and Materials and Methods. No
# PDF was supplied. The supplementary materials (figs. S1 to S9, with their legends) are cited by
# the text but were not supplied. Every main finding is stated, with its statistics, in the main
# text, so the claims rest on the main text; claims on supplementary panels use the sentence of the
# Results that cites them, and their measures come from the Methods and the code. The code's README
# says the paper was accepted at Science Advances; the version of record was not read.
#
# Code read. github.com/XieLuanLab/icms-activation-plasticity at commit d1922d1 (2026-07-15),
# also archived as Zenodo doi:10.5281/zenodo.19561006. It holds MATLAB figure scripts for the
# imaging (matlab/fig2, fig3, fig_s2, report_stat.m), Python figure scripts for the ephys and
# behaviour (python/fig4 to fig6, fig_s1, fig_s3 to fig_s9, utils), and the upstream pipelines
# (processing/: spike sorting with artifact removal, response metrics, pulse-locking, UnitMatch,
# population coupling, the volumetric and planar imaging extraction). The figure scripts read
# processed tables from a Zenodo deposit not read here. The file timing_params.json that the
# response pipeline loads, and the code that builds the per-trial delta-spike table and the hit and
# miss PSTH arrays of Figure 6, are not in the repository.
#
# Data the paper used. 12 Thy1-GCaMP6s mice, each implanted in S1 with a 32-channel ultraflexible
# nanoelectronic thread (NET) and a cranial window: 6 behavioural mice (4 male, 2 female; the code
# calls them ICMS83, ICMS92, ICMS93, ICMS98, ICMS100, ICMS101, shown as Mouse 6, 1, 2, 3, 4, 5) and
# 6 passive controls from an earlier study, stimulated and imaged on a similar timeline without a
# task. Behavioural mice did an ICMS detection task (turn a wheel within the 700 ms, 100 Hz, 70
# pulse train for a water reward), three stimulation contacts per mouse used throughout, sessions of
# four 100-trial blocks (10 catch trials, 3 channels by 3 currents by 10 trials) plus a fifth block
# for planar imaging, over about four weeks; weeks 0 and 1 are the early phase and weeks 2 to 4 the
# late phase. Measured: hit and miss per trial, wheel position, response time; sorted units from
# the NET at 30 kHz (973 units in 6 mice), with spike times, waveforms, depths; volumetric two-photon
# imaging (300 um z span, 25 um steps) and planar imaging at 100 um depth, 30 fps, giving per-ROI
# activation, 3-D distance to the stimulation site, dF/F traces and deconvolved spikes. Analyses use
# 4, 5 and 6 uA only. The dandiset (DANDI:001868, "Chronic electrophysiology and two-photon calcium
# imaging of mouse primary somatosensory cortex during intracortical microstimulation learning")
# says it holds the 12 mice in 85 sessions, sorted-unit spike times and mean waveforms, behavioural
# trials, ICMS events, wheel signals, dF/F traces and ROI segmentations for the trained mice, and
# per-neuron activation measurements for the controls.
#
# Outside data (step 4). The paper deposits "processed imaging and electrophysiological datasets"
# at Zenodo doi:10.5281/zenodo.17727762; the code's README names the figure source data as Zenodo
# doi:10.5281/zenodo.21382755 and raw recordings as available on request. No claim needs data from
# outside the paper's own recordings.
#
# Method choices common to many claims, from the Methods and, where they are silent, from the code.
# - Week. The Methods do not say how weeks are counted. The code counts days since the mouse's first
#   session and takes week = ceil(days / 7), so week 0 is the first session day only
#   (processing/batch_process/util/file_util.py:133-142, longitudinal_data_utils.py:180, and the
#   MATLAB fig2 and fig3 scripts). Early is weeks 0 and 1, late weeks 2 to 4, later weeks dropped
#   (python/utils/config.py:36-37). A floor(days / 7) count is a variant.
# - Early against late. "The Mann-Whitney U-test was performed to compare metrics between early
#   and late phases" (Methods, Statistics), two-sided unless a legend says one-sided. Effect size r
#   is |Z| / sqrt(n1 + n2) in the MATLAB imaging scripts (matlab/report_stat.m:19-21) and the
#   rank-biserial 1 - 2U/(n1 n2) in the Python ephys scripts (python/utils/plotting.py:50-52); r is
#   reported, not judged.
# - Ephys responses. A response is one unit at one stimulation channel and current in one session
#   (Methods, Quantifying neuromodulation metrics). Modulated when a paired t-test of spike counts in
#   the stimulation against the pre-stimulus window across trials gives a significant increase (p <
#   0.05), with at least 50 spikes and a baseline rate of at least 0.5 Hz (Methods); the code also
#   requires more than 5 trials, 0 < z below 50 or 100 depending on the figure, and drops
#   stimulation channels with fewer than 5 session days (python/utils/filters.py:8-26), which the
#   Methods do not state and are followed here. Modulation score = (mean stimulation rate - mean
#   pre-stimulation rate) / SD of pre-stimulation rates across trials (Methods). Time to maximum
#   firing rate uses 10 ms bins smoothed with a Gaussian of sigma 20 ms
#   (processing/.../responses_v3/stim_condition_response.py:365-369). Pyramidal when the waveform
#   trough-to-peak interval is at least 0.45 ms, interneuron below (Figure 4H legend;
#   longitudinal_data_utils.py:99-108).
# - Pulse-locking. Spikes in each 10 ms interpulse interval binned at 0.5 ms, first 1.5 ms and last
#   0.5 ms blanked, spike probability = spikes per bin over trials; pulse-locked when the
#   pulse-locked index exceeds the 99th percentile of a null distribution (Methods). The Methods
#   point to ref. 9 for the index and call the null "shuffled data"; the code computes the index as
#   the mean of the 3 bins around the peak minus the median of the valid bins, on the mean of 500
#   bootstrap draws of 20% of pulses, and its null as 100 sets of spike times drawn uniformly over the
#   valid window (responses_v2/pulse_locked_response_metrics.py:102-197). The code's null is
#   followed as the reading of "shuffled"; a null from spike times shuffled within the window
#   across pulses is a variant.
# - Imaging activation. Volumetric (Figure 2): an ROI is activated on a trial when at least 50% of
#   its voxels exceed two times their baseline STD (Methods). The code sets the multiplier per
#   channel from the data (processing/imaging/volumetric/
#   NeuroAnalysis_BehavioralParametricSweepBlockExtractTest.m:677-681, 781, 1926); the Methods'
#   fixed factor of 2 is the main reading and the code's is a variant. Counts keep neurons within
#   800 um of the site (matlab/fig2/*.m). Planar (Figure 3): activated when the trial-averaged trace
#   in the stimulation window exceeds mean + 2 SD of the ROI's full trace for a continuous run of
#   more than 5 frames with onset before 700 ms (Methods); the code's test passes only when every
#   suprathreshold run exceeds 5 frames (processing/imaging/planar/roiPLotter2Miss.m:1013-1026),
#   a variant.
schema_version: 2
