claims:
- id: fig2a-threshold-decrease
  statement: Behavioural detection thresholds decreased with learning; late-phase thresholds
    were significantly lower than early-phase thresholds, from a median of 5.5 uA to 4.2 uA.
  source: Results, Behavioral learning enhances ICMS-evoked population activation over time,
    paragraph 1; Figure 2A
  quote: The detection thresholds in the late phase were significantly lower than those in the early
    phase ( Fig. 2A ), decreasing from a median of 5.5 µA to 4.2 µA (n early = 43, n late = 80, p =
    7.68e-6, r = 0.40)
  statistics:
  - test: two-sided Mann-Whitney U test
    statistic: r = 0.40
    p: 7.68e-6
    n: 43 early and 80 late channel-session thresholds
  expected:
  - quantity: median detection threshold, early phase
    value: 5.5
    tolerance: 0.55
    unit: uA
  - quantity: median detection threshold, late phase
    value: 4.2
    tolerance: 0.42
    unit: uA
  criterion: One threshold per stimulation channel and session, pooled over the 6 mice. Each block's
    threshold is the 50% point of a cumulative Gaussian psychometric function fitted to the hit
    proportions at each amplitude with psignifit 4, with the block's catch-trial false-positive rate
    applied to the curves; the session threshold is the mean of the four block thresholds (Methods,
    Analysis of behavioral data). The Methods do not say how the false-positive rate enters the fit;
    the readings are (a) the guess rate fixed at the catch-trial rate, (b) hit proportions corrected
    for false alarms, (p - fa) / (1 - fa), before a fit with zero guess rate. Early weeks 0 and 1
    against late weeks 2 to 4, two-sided Mann-Whitney U (matlab/fig2/fig2a_thresholds.m:13-48).
    Reproduced when, under one reading, both medians are within tolerance and p < 0.05 with the late
    median lower. The exponential fit drawn in the panel is not in the code and is not judged.
- id: figs1e-response-time
  statement: Response times decreased over training with a time course like that of the detection
    thresholds.
  source: Results, Behavioral learning enhances ICMS-evoked population activation over time,
    paragraph 1; fig. S1E (not supplied)
  quote: Response times followed a similar time course (fig. S1E)
  criterion: The supplement was not supplied and the code computes no test for fig. S1
    (python/fig_s1/generate_figure.py). Response time is the wheel response time of hit trials at 4
    to 6 uA. Following the paper's general rule for early against late (Methods, Statistics), a
    two-sided Mann-Whitney U test of hit-trial response times, early weeks 0 and 1 against late
    weeks 2 to 4. The unit is open, with readings (a) per-trial times pooled, (b) one median per
    channel and session. Reproduced when, under one reading, late times are lower at p < 0.05.
