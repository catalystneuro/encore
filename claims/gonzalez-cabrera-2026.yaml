- id: fig1e-spike-duration
  statement: Spikes of TH− neurons, both LP and PO, are shorter in duration than those of TH+
    (dopaminergic) neurons.
  source: Figure 1e legend; Results, VTA outputs previewed by bulk labeling, paragraph 1
  quote: 'Spike duration was shorter in TH − than in TH + neurons (TH + vs. LP: p = 0.0023; TH +
    vs. PO: p = 0.0185; one-way ANOVA, FDR-corrected post hoc tests)'
  statistics:
  - about: TH+ against LP
    test: one-way ANOVA, post hoc test
    p: 0.0023
    corrected: FDR
    n: 10 TH+ and 20 LP neurons
  - about: TH+ against PO
    test: one-way ANOVA, post hoc test
    p: 0.0185
    corrected: FDR
    n: 10 TH+ and 12 PO neurons
  criterion: The paper does not define spike duration or the post hoc test. Readings for the
    measure are (a) the full action-potential width from onset to return to baseline of the
    average juxtacellular waveform, (b) peak-to-trough width. Post hoc tests are pairwise
    t-tests (Welch or pooled) with Benjamini-Hochberg FDR over the three pairs. Reproduced when
    under one reading both TH+ against LP and TH+ against PO give corrected p < 0.05 with TH+
