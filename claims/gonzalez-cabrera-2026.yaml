- id: supp1d-cv2-lp-po
  statement: LP TH− neurons fire more irregularly than PO TH− neurons (CV2 0.871 ± 0.069 against
    0.609 ± 0.116).
  source: Supplementary Figure 1d, left; Results, VTA outputs previewed by bulk labeling,
    paragraph 1
  quote: 'Left: spike-time variability (CV2) across juxtacellularly labeled TH − cells: LP (0.871
    ± 0.069) vs. PO (0.609 ± 0.116) ( p = 0.0468, unpaired t -test)'
  statistics:
  - test: unpaired t-test
    p: 0.0468
    n: 20 LP and 12 PO neurons (Figure 1 legend; Supplementary Fig. 1d right has 19 LP)
  expected:
  - quantity: CV2, LP
    value: 0.871
    tolerance: 0.069
  - quantity: CV2, PO
    value: 0.609
    tolerance: 0.116
  criterion: Tolerances are the reported s.e.m. (Methods, data are mean ± s.e.m.). CV2 is not
    defined in the Methods; the standard definition, the mean over consecutive interspike
    intervals of 2|ISI(n+1) − ISI(n)|/(ISI(n+1) + ISI(n)), is used, on the 200-s baseline
    (Methods, Juxtacellular recordings). Whether the baseline or the whole recording is used is
    open; both are run. Reproduced when both means are within tolerance and the unpaired t-test
    gives p < 0.05 with LP higher, under one reading.
