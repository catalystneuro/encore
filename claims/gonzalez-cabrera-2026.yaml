# Claims for Gonzalez-Cabrera et al. (2026), "A VTA-pontine GABA pathway biases locomotor
# direction via local and distal inhibition", doi:10.64898/2026.02.17.706301, tested on
# DANDI:001955.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-11-10, protocol pilot-14 as stated in docs/protocol.md.
#
# Text read. paper/10.64898-2026.02.17.706301.txt, the bioRxiv preprint, version 1, flattened
# from bioRxiv's JATS XML. Its title line reads "biases backward locomotion"; the registry title
# reads "biases locomotor direction". It holds the main text, the figure legends of Figures 1
# to 4, the Methods, and the legends of Supplementary Figures 1 to 4. No PDF was supplied, so
# figure panels were not seen; the reference list is empty in the text. Every claim rests on a
# sentence of the main text, a legend or the Methods.
#
# Code. The paper links github.com/CGonzC/VTAPnO_Locomotion_Analysis, release
# "v1.0_manuscript_submission", read at that tag, commit
# 1ff5196e20fdaa86dd1b6d1efc26a981fb1e09ab. It holds three files: notebooks/Backward_Loc_min.ipynb
# (open-field DLC frame classification, 200-ms peri-stimulus bins, a linear mixed model
# Proportion ~ Time_bin * MovementType with mouse as group), notebooks/Fiber_Photometry_PSTH.ipynb
# (405-to-470 robust linear fit, dF/F, per-trial baseline-subtracted dF/F, mean/SD z-score and
# median/MAD robust z-score, AUC per 1-s bin) and matlab/optoTag_classification_unifiedCriteria_v2.m
# (opto-tag shuffle test, 6-ms fixed window and fidelity). The branch main (b3b3628) adds example
# inputs and reformats the same code; no parameter changes. No code for the per-bin statistics,
# the frequency-screen mixed model, the auROC activation criterion, the temporal classes, the
# direction analysis, the waveform metrics or the 2-ms DA analysis is in the repository.
# Where the code and the Methods differ (named in the claims concerned):
# - Photometry z-score baseline. Methods, −1.0 to −0.1 s; code, pre_time −3.0 to −0.1 s. The
#   Methods reading is primary, the code's a variant.
# - Open-field tracking. Methods, likelihood filter p ≥ 0.9 and gap filling; the code applies
#   neither (it smooths raw DLC positions with a 6-frame moving average, np.convolve mode
#   "same"). The Methods reading is primary, the code's a variant.
# - Opto-tagging. Methods add a third, waveform-stability criterion (pre/post Pearson r ≥ 0.90);
#   the MATLAB script has only the shuffle test and fidelity. The Methods are followed.
#
# Data the paper used, as it reports them.
# - Juxtacellular recordings and Neurobiotin fills in urethane-anaesthetised mice (Fig. 1,
#   Supplementary Fig. 1): 42 neurons; 32 recovered TH− neurons (20 local-and-projection, LP;
#   12 projection-only, PO) and 10 TH+ neurons; 200-s baseline and three 15-s hindpaw pinches.
#   Gad2-Cre bulk tracing with AAV-DIO-mNeon (Fig. 1a).
# - Ex vivo slices (Fig. 2a-c, Supplementary Fig. 2a-c): C57BL/6 mice (n = 5), retroAAV-Cre in
#   PnO and DIO-ChR2-mCherry in VTA; whole-cell recordings of light-evoked IPSCs in putative DA
#   and putative GABA VTA neurons (control n = 14, cocktail n = 9 for latency).
# - Open-field optogenetics (Fig. 2d-i, Supplementary Fig. 2d-f): somatic stimulation of VTA-PnO
#   neurons (retroAAV-Flp in PnO, Flp-dependent Chrimson in VTA; 3 s of 635-nm light every 10 s
#   in 5-min sessions; n = 8; the Fig. 2d legend says retroAAV-Flp, the Methods describe it in
#   DAT-Cre mice, and Supplementary Fig. 2d calls the group DAT-Cre); terminal stimulation of
#   Gad2-Cre VTA GABA axons in PnO (DIO-ChR2, 3 s of 60-Hz 470-nm light; n = 5); a frequency
#   screen at 20 to 60 Hz and continuous light. DeepLabCut tracking at 30 fps (nose, back, tail
#   base).
# - Fiber photometry (Fig. 3a-c, Supplementary Fig. 3a): DAT-Cre mice with retroAAV-FlpO in PnO,
#   Flp-dependent Chrimson and DIO-GCaMP8f in VTA (opsin n = 5) and controls with a DIO-mCherry
#   virus in place of the GCaMP-plus-opsin pair (n = 3; the control virus list is as written in
#   the Methods); freely moving; 470-nm and 405-nm channels; Chrimson driven at 568 nm; 5, 10, 20
#   Hz trains and continuous light, 3 s.
# - Acute silicon-probe recordings (Fig. 3d-k, Supplementary Fig. 3b-d): isoflurane-anaesthetised
#   DAT-Cre mice (n = 7), ChR2 in DA neurons and Chrimson in VTA-PnO neurons; 64-channel optrodes,
#   3-4 penetrations per mouse; tagging with 1-ms pulses at 5 Hz (3 s on, 10 s off, 210 pulses),
#   470 nm for DA and 635 nm for VTA-PnO; then 1-s continuous 635-nm light every 10 s for 3 min.
#   173 tagged VTA-PnO and 30 tagged DA units. Kilosort and Phy curation; 30 kHz.
# - Chronic silicon-probe recordings (Fig. 4, Supplementary Fig. 4): DAT-Cre mice (n = 3) with the
#   same two opsins and a 32-channel optrode; tagging as above; then a rotarod turned for 2 s at
#   2 rad/s, in reverse (backward stepping) and, in separate blocks, forward. 40 tagged VTA-PnO
#   units; 17 units in one bidirectional session per mouse.
#
# The dandiset's description lists acute electrophysiology, chronic electrophysiology during
# forward and reverse rotarod locomotion, and fiber photometry at 5, 10, 20 Hz and continuous
# stimulation. Claims on the juxtacellular, slice, tracing and open-field experiments are listed
# because they are main findings; the author finds whether the dandiset holds their data. The
# paper's Links section names Zenodo doi:10.5281/zenodo.18661700 for "Figures and KRT"; the
# dandiset description names Zenodo doi:10.5281/zenodo.21390830 for figure-level source data and
# behavioral source data. Neither is said by the paper to hold raw recordings.
#
# Method details fixed by the paper for the recorded data in the dandiset. Opto-tagging (Methods,
# Acute silicon-probe recordings): spikes summed in 0-6 ms after each 1-ms pulse; null from
# 10,000 circular shuffles of each trial's 0-100 ms spike train, taking the maximum 6-ms count;
# pass when the real count exceeds the 99.9th percentile; fidelity ≥ 0.1; pre (−180 to 0 ms) and
# post (0-6 ms) mean waveforms correlated at r ≥ 0.90. The MATLAB script fixes 1-ms bins, shifts
# drawn uniformly from 1 to 100 bins, a sliding 6-bin maximum for the null, and a strict ">".
# Acute activation (Methods, Acute recordings): 0.5-s bins, baseline −1.25 to −0.25 s, auROC per
# bin, paired two-tailed tests against time-matched baseline, FDR across bins, activated when
# significant with auROC > 0.5. Chronic activation (Methods, Chronic silicon-probe recordings):
# 100-ms bins, pooled baseline −1.25 to −0.25 s, six 0.5-s windows W1-W6 over 0-3 s, FDR across
# windows (and directions), class rules as quoted in the claims. Photometry: Pre −1.0 to −0.1 s,
# Stim 0-3 s, trials averaged within animal. Details left open are named in each criterion.
schema_version: 2
