  source: Supplementary Figure 1e, left and centre; Results, VTA outputs previewed by bulk
    labeling, paragraph 1
  quote: 'TH+ cells showed predominant decreases in firing rate, whereas TH − neurons exhibited
    heterogeneous rate changes (both increases and decreases)'
  criterion: Classification as in Methods, Juxtacellular pinch, 1-s bins over −20 to +20 s
