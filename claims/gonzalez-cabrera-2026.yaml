    and brainstem regions, including nucleus accumbens, lateral hypothalamus and PnO.
  source: Results, VTA outputs previewed by bulk labeling, paragraph 1; Figure 1a
  quote: we observed widespread axonal labeling across forebrain and brainstem regions, including
    nucleus accumbens, lateral hypothalamus and PnO
  criterion: Histology (Methods, Axonal projection quantification; ABBA registration, QuPath mean
    mNeon intensity minus a local background ROI, averaged per animal and region). Reproduced
    when the background-corrected mean intensity is above zero in nucleus accumbens, lateral
    hypothalamus and PnO in every animal. The paper gives no values or animal count.
- id: fig1-th-neg-all-project
  statement: All 32 recovered juxtacellularly labelled TH− VTA neurons sent axons outside the
