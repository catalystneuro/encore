- id: fig1-pno-subset
  statement: Four of the 32 TH− neurons (12%), all in the LP group, projected to the PnO.
  source: Results, VTA outputs previewed by bulk labeling, paragraph 1; Figure 1c
  quote: Among the LP neurons, a subset projected to the PnO (12%, 4/32 TH − ), identifying a VTA
