- id: fig1e-firing-rate-no-difference
  statement: Baseline firing rate does not differ between LP, PO and TH+ neurons.
  source: Figure 1e legend; Results, VTA outputs previewed by bulk labeling, paragraph 1
  quote: Mean firing rate did not differ between cell groups (Kruskal–Wallis test, FDR-corrected
    post hoc tests)
  criterion: A claim of absence, judged on the paper's test, a Kruskal-Wallis test across LP (n
