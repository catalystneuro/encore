    rate of spikes in bursts in 0-15 s, read as in supp1e-pinch-rate-th-pos-lower (raw, minus
    baseline, or z-scored). Neurons with no bursts are left out (n = 8 and 18 of 9 and 31).
    Reproduced when under one reading the Mann-Whitney test gives p < 0.05 with TH+ lower.
