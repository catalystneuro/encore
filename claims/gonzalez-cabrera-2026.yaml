- id: supp1e-pinch-rate-th-pos-lower
  statement: The firing rate in response to hindpaw pinch is lower in TH+ neurons than in TH−
    neurons.
  source: Supplementary Figure 1e, right
  quote: 'Right: mean firing rate in response to paw pinch is lower for TH + ( n = 9) than TH − (
