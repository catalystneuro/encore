- id: supp1f-pinch-burst-th-pos-lower
  statement: Pinch-evoked bursting is lower in TH+ neurons than in TH− neurons.
  source: Supplementary Figure 1f; Results, VTA outputs previewed by bulk labeling, paragraph 1
  quote: 'Right: mean firing rate of bursting activity in response to paw pinch is lower for TH +
    ( n = 8) than TH − ( n = 18) cells ( p = 0.047, Mann–Whitney test)'
  statistics:
  - test: Mann-Whitney
    p: 0.047
    n: 8 TH+ and 18 TH− neurons
  criterion: The paper gives no burst definition. Readings are (a) for TH+ neurons the standard
    dopamine-neuron rule (burst onset at an ISI ≤ 80 ms, end at an ISI > 160 ms) and the same
