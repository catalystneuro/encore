  statement: During recording sessions both groups showed high fear to danger, less to
    uncertainty and least to safety, with a main effect of cue, no group by cue interaction, and
    each cue pair differing in each group.
  source: Results, Higher proportion of EAA cue-responsive neurons, paragraph 1; Figure 2C
  quote: ANOVA for mean suppression ratios [factors ... found a main effect of cue (F 2,36 =
    199.47, p = 3.33 × 10 –20 ... but no group × cue interaction (F 2,36 = 0.24, p = 0.79 ...
