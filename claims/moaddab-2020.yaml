  source: Results, Higher proportion of EAA cue-responsive neurons, paragraph 1; Figure 2B
  quote: Control and EAA rats showed equivalent baseline nose poke rates (t 18 = 1.24, p = 0.23
  statistics:
  - test: independent samples t test
