    test: independent samples t test
    statistic: all t < 1.10
    p: 0.25
    p_relation: ">"
  - about: functional type, groups pooled
    test: one-way ANOVA
    statistic: F(2, 346) = 7.35
    p: 0.001
  depends_on:
