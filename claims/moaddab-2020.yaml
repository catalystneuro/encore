    functional type, while across groups baseline firing differed by functional type and was
    lowest for cue-excited neurons.
  source: Results, Higher proportion of EAA cue-responsive neurons, paragraph 3; Figure 2E and 2F
  quote: Independent samples t tests found no differences in baseline firing between Control and
    EAA cue-excited, cue-inhibited and neurons outside the selection criteria (all t < 1.10, all p
    > 0.25). By contrast, one-way ANOVA for the three functional neuron types, collapsing across
    Control and EAA groups found a main effect of functional type (F 2,346 = 7.35, p = 0.001).
    Baseline firing rates were lowest for cue-excited neurons.
  statistics:
