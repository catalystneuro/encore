    statistic: F(2, 36) = 199.47
    p: 3.33e-20
  - about: group by cue
    test: ANOVA, factors group and cue
    statistic: F(2, 36) = 0.24
    p: 0.79
  - about: danger against uncertainty and uncertainty against safety, each group
    test: paired samples t test
    statistic: all t > 3.00
    p: 0.01
    p_relation: "<"
