- id: fig1bc-adversity-slows-weight-gain
  statement: Early adolescent adversity slowed body weight gain. Body weight showed a group by
    day interaction, and Control rats gained more weight from P24 to P35 (P35/P24) than EAA rats;
    weights were equivalent before adversity and in adulthood.
  source: Results, first paragraph (before the heading Higher proportion of EAA cue-responsive
    neurons); Figure 1B and 1C
  quote: Body weights were equivalent prior to adversity, weight gain slowed in EAA rats, but body
    weights were equivalent between groups in adulthood. ... found a significant group × day
    interaction (F 13,234 = 4.20, p = 3.00 × 10 –6 ... Independent samples t test for body weight
    change found a significant difference between groups (t 18 = 6.11, p = 9.00 × 10 –6
  statistics:
  - about: body weight, group by day interaction, 14 days from P24 to P55
    test: repeated-measures ANOVA
    statistic: F(13, 234) = 4.20
    p: 3.0e-06
    n: 8 Con and 12 EAA rats
  - about: body weight change P35/P24, Con against EAA
    test: independent samples t test
    statistic: t(18) = 6.11
    p: 9.0e-06
    n: 8 Con and 12 EAA rats
  criterion: As the Methods (Body weight) say. A repeated-measures ANOVA of body weight on day (14
    weighing days, P24 to P55) by group, and an independent samples t test of P35 weight divided by
    P24 weight between groups. Reproduced when the interaction has p < 0.05 and the t test has p <
    0.05 with the Control ratio higher. The sign of the difference is as Fig. 1C shows it (Control
    gained more).
