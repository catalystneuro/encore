# Claims for Moaddab, Wright & McDannald (2020), Sci Rep 10, 18035, on CRCNS data set pag-2.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-06,
# protocol as stated in docs/protocol.md (Reader, version pilot-13).
#
# Text read: the version of record, PMC7582948 (open access), as supplied under paper/ (Europe PMC
# JATS XML, flattened), with its Introduction, Materials and methods, Results, figure legends and
# Discussion. The supplement (Supplementary Figures S1 to S6 and a Supplementary Information file)
# is listed in the text, but its content is not in the text supplied, and no PDF was supplied.
# The main results are stated, with their statistics, in the main text, so they do not rest on the
# supplement; the claims that are shown only in Figs. S4 to S6 are kept from the sentences of the
# Results that cite them, and have no expected values. The paper links no analysis code for the
# neural analyses. It says Med Associates programs and Matlab programs for the behavioral
# analyses are at https://mcdannaldlab.org/resources; on 2026-11-06 that address returned a 404
# page, so no code was read and no repository or commit can be recorded. The two web calculators
# the Methods name (socscistatistics.com chi-square; vassarstats.net r-to-z) were not run. Two
# facts about them were checked arithmetically from the paper's own numbers (see the claims on
# Fig. 2D and Figs. 6 and 7).
#
# Data the paper used. 20 female Long Evans rats born in the laboratory: 12 given early adolescent
# adversity (EAA; P26 to P35, twice daily, tail pinch, restraint, forced cold swim, cat hair, five
# times each) and 8 Controls (Con), handled but not stressed. Body weight taken Monday, Wednesday
# and Friday from P24 to P55 (14 days). Eight pre-surgery fear discrimination sessions (P64 to
# P71), then 16-wire drivable bundles implanted dorsal to the vlPAG (P77 to P87), then recording
# sessions (about P90 to P143). Each session has 32 trials: 6 danger (shock p = 1.00), 6
# uncertainty shock and 10 uncertainty no-shock (p = 0.375), and 10 safety (p = 0.00); 10 s
# auditory cues; 0.5 mA, 0.5 s shock 2 s after cue offset; mean inter-trial interval 3.5 min.
# Fear is the suppression of rewarded nose poking (VI-60). Recorded: 151 single units in 8 Con rats
# over 72 sessions and 203 units in 12 EAA rats over 107 sessions, in vlPAG/DR; spike times, cue,
# shock and nose poke times; mean waveforms. Bregma recording level per rat.
#
# The CRCNS data set, by its title and data description, holds these recordings: the 354 sorted
# units (151 Con, 203 EAA) from the 179 recording sessions, one file per unit, with trial-aligned
# firing, nose poke and suppression ratio data, waveforms and unit names that carry the rat and
# session date. By that description it holds no body weights and no pre-surgery discrimination
# sessions; the claims that need those are kept as the paper's findings, and the author finds
# whether the data set holds their data. The data description also says the electrode bundle was
# centered at -7.68, -7.92, -8.16 or -8.40 mm from bregma (6, 7, 5 and 2 rats).
#
# Method details from the Methods, used by the claims below unless a claim says otherwise.
# - Trial types: danger, uncertainty (shock and no-shock trials pooled, 16 trials, as the Methods
#   say uncertainty trial types were collapsed for the cue analyses) and safety.
# - Suppression ratio per trial: (baseline poke rate - cue poke rate) / (baseline + cue), baseline
#   from the 20 s before cue onset, cue rate from the 10 s cue, each trial with its own baseline.
# - Normalized firing: per neuron and trial type, firing rate in 250 ms bins from 20 s before cue
#   onset to 20 s after cue offset (200 bins), averaged over trials; the mean of the 2 s before cue
#   onset for that trial type subtracted from each bin; the result Z scored across all trial types
#   of the neuron (all bins together). Population ANOVAs use bins from 2 s before cue onset to 2 s
#   after cue offset (56 bins).
# - Cue-responsive selection (Methods, Identifying cue-responsive neurons; Results, Higher
#   proportion, paragraph 2): raw firing rate in the 10 s before cue onset against cue epochs,
#   dependent samples t test across trials, per cue, at p < 0.0083 (six comparisons).
# - Single-unit regression: per neuron, all 32 trials of its session; the response is the Z score
#   normalized firing in the interval; regressors are the trial's suppression ratio for the whole
#   cue (fear output) and the cue's shock probability, 1.00, 0.375 or 0.00 (threat probability),
#   with a constant, by ordinary least squares (Matlab regress). The betas are analyzed per
#   neuron; 1 s intervals over the 10 s cue.
#
# Details the paper leaves open that apply to many claims, with the readings it allows.
# - Trial-wise normalized firing for the regression. The Z score of the Methods is defined on
#   trial-averaged firing. Readings: (a) each trial's firing in the interval, minus the 2 s
#   pre-cue mean of its trial type, Z scored with the mean and SD of that neuron's normalization;
#   (b) the same, with the trial's own 2 s baseline subtracted; (c) each trial's binned firing Z
#   scored over all trials and bins of the neuron. Reading (a) follows the Methods most closely.
# - Trials with no pokes in the baseline and the cue make the suppression ratio 0/0. The paper
#   does not say how they are treated. Readings: (a) ratio set to 0; (b) trial left out.
# - Beta for a multi-second window (whole cue, last 5 s). Readings: (a) the mean of the 1 s
#   interval betas over the window, as the Results say for Fig. 5C ("mean beta coefficient for
#   the entirety of cue presentation"); (b) one regression on the firing averaged over the window.
# - Error degrees of freedom. Several reported tests have fewer degrees of freedom than the
#   neuron counts give (Fig. 5A to C, t 66 and F 1,65 for 81 cue-excited neurons; Fig. 5D, F 1,78;
#   Fig. 4A,B, F 110,8360; Fig. 4D,E, F 110,14190 for 132 cue-inhibited neurons; Fig. 2E,F, F 2,346 for 354 neurons). The paper does not say which
#   neurons were left out. The author runs the tests on all selected neurons, reports the degrees
#   of freedom obtained, and treats a mismatch as a deviation, not as a failure of the claim.
# - ANOVA. The paper reports partial eta squared and observed power (SPSS style) but does not name
#   the software or the sphericity correction. Readings: uncorrected repeated-measures ANOVA with
#   neurons (or rats) as subjects; the reported degrees of freedom are uncorrected.
