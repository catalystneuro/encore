    value: 32
    tolerance: 3.2
  - quantity: EAA cue-excited neurons
    value: 49
    tolerance: 4.9
  - quantity: Control cue-inhibited neurons
    value: 48
    tolerance: 4.8
  - quantity: EAA cue-inhibited neurons
    value: 84
    tolerance: 8.4
  - quantity: total units, Control
    value: 151
    tolerance: 0
  - quantity: total units, EAA
    value: 203
    tolerance: 0
  criterion: Selection as the Methods (Identifying cue-responsive neurons) and Results give it. Per
