    > uncertainty > safety). EAA rats acquired it faster, giving a group by cue by session
    interaction, but in the final session there was a main effect of cue and no group by cue
    interaction.
  source: Results, paragraph 3 (Control and EAA rats acquired discrimination); Figure 1E and 1F
  quote: EAA rats acquired discrimination faster than Controls, but discrimination levels were
    equivalent between groups by the final discrimination session ... found a group × cue ×
    session interaction (F 14,252 = 1.99, p = 0.02 ... ANOVA restricted to the final
    discrimination session found a main effect of cue (F 2,36 = 151.45, p = 2.97 × 10 –18 ... but
    no group × cue interaction (F 2,36 = 1.55, p = 0.23
  statistics:
  - about: group by cue by session, sessions 1 to 8
    test: ANOVA, repeated measures on session, factors group and cue
    statistic: F(14, 252) = 1.99
    p: 0.02
  - about: final session, main effect of cue
    test: ANOVA
    statistic: F(2, 36) = 151.45
    p: 2.97e-18
  - about: final session, group by cue
    test: ANOVA
    statistic: F(2, 36) = 1.55
    p: 0.23
  criterion: Per rat, the mean suppression ratio per cue and session (Methods, Calculating
    suppression ratios), uncertainty shock and no-shock trials pooled. Reproduced when the
    three-way interaction has p < 0.05, the final-session cue effect has p < 0.05 with danger >
    uncertainty > safety in both groups, and the final-session group by cue interaction has p >=
    0.05 (the absence part is judged on that ANOVA). Needs the eight pre-surgery sessions, which
    the data description does not list.
