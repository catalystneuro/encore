  statement: 32 of 151 Control neurons (21.2%) and 49 of 203 EAA neurons (24.1%) were cue-excited;
    48 of 151 Control neurons (31.8%) and 84 of 203 EAA neurons (41.4%) were cue-inhibited.
  source: Results, Higher proportion of EAA cue-responsive neurons, paragraph 2; Figure 2D
  quote: We identified 32/151 Control neurons (21.2%) and 49/203 EAA neurons (24.1%) that were
    cue-excited ... We identified 48/151 Control neurons (31.8%) and 84/203 EAA neurons (41.4%)
    that were cue-inhibited
  expected:
