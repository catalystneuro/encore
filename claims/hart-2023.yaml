    ventral/medial AL
  data: dataset
  criterion: The paper gives no measure; one is fixed here. Breadth is the area of pixels of at
    least 0.2 (the Methods threshold) in each ant's trial-averaged M1 map. Reproduced when
    3-hexanone has the largest area of the five odorants in every ant where it was tested, and
    its median area across ants is at least twice that of each other odorant.
- id: figs4a-bilateral-symmetry
  statement: Responses to 4-methyl-3-hexanol are bilaterally symmetrical in the two ALs imaged
    together, so later experiments imaged only the right AL.
  source: Results, Pheromone representation is sparse, paragraph 1; Figure S4A
  quote: we first imaged responses to 4-methyl-3-hexanol in both ALs simultaneously (n=3 ants) and
    found that response patterns were bilaterally symmetrical
  data: dataset
  criterion: The paper gives no measure; one is fixed here. In each of the three bilateral ants
    (1X zoom, 4-methyl-3-hexanol 48%), M1 maps split at the midline between the ALs, the left
    mirrored. Reproduced when in every ant both ALs have responding ROIs (M2) and their counts
    differ by at most one, and the mirrored-left and right maps of responding pixels correlate
    better than the right map does with itself shifted by half its width.
- id: fig4b-vehicle-no-response
  statement: Sparse, unique subsets of glomeruli respond to each alarm pheromone, while the
    paraffin oil vehicle generates no responses.
  source: Results, Pheromone representation is sparse, paragraph 1; Figure 4B-C
  quote: Sparse, unique subsets of AL glomeruli responded to all pheromones, while the paraffin oil
    vehicle did not generate responses
  data: dataset
  criterion: A claim of absence for the vehicle, on the paper's rule (M2, peak fold change at least
    0.2). Reproduced when no ROI responds in any ant's vehicle trials, and each pheromone has at
    least one responding ROI in most ants at their higher concentration, under every M2 reading;
    the largest vehicle ROI value is reported.
- id: fig4-no-decreases
  statement: Odors cause no fluorescence decreases; only small non-specific decreases from shifts
    in AL position and photobleaching occur.
  source: Results, Pheromone representation is sparse, paragraph 1
  quote: We did not observe any fluorescence decreases in response to odor, although we did detect
    small, non-specific decreases in fluorescence due to minor shifts in AL position and
    photobleaching
  data: dataset
  criterion: A claim of absence. The Methods judged it ("We determined that all responses were
    positive") from the per-plane peak fold change maps of the first look, so those are used.
    Per plane, Image Stabilizer, 1-sigma Gaussian blur, F0 the mean of frames 1 to 5, peak fold
    change the mean of dF/F0 over frames 9 to 14, all 33 planes examined. The paper's only
    threshold is 0.2; it is applied with the sign reversed, a choice of the reader. Reproduced when no glomerulus-sized region (10 to 20 um) reaches -0.2 or below in
    at least two trials of the same odor and concentration without doing so in that ant's vehicle
    trials; the most negative such region is reported.
- id: fig4-large-lasting-responses
  statement: Fluorescence increases to alarm pheromones are often large (1 to 2-fold change) and
    outlast the 5 s odor pulse.
  source: Results, Pheromone representation is sparse, paragraph 1
  quote: Fluorescence increases were frequently large (1–2-fold change) and lasted longer than the
    5s odor presentation
  data: dataset
  criterion: Over responding ROI-trials (M2) at each ant's higher concentration, the ROI peak fold
    change. The paper reports a range, 1 to 2, and no single value. "Frequently large" is read as
    the median lying in 1 to 2 widened by 10% of each bound (0.9 to 2.2), a reading of the
    reader, under each ROI value reading (i) and (ii). "Lasted longer" is read with the paper's
    onset rule (Methods, temporal dynamics); reproduced when, in more than half of those
    ROI-trials, dF/F0 at the first volume after the pulse ends (8 s) is still above the baseline
    mean plus 3 SD.
- id: figs5a-sparse-median-6
  statement: Each alarm pheromone activates few of the roughly 500 glomeruli; even at the highest
    concentration the median number of responding glomeruli is at most 6.
  source: Results, Pheromone representation is sparse, paragraph 2; Figure S5A; Figure 6 legend
  quote: Even at the highest concentration tested, the four pheromones activated a median of at most
    6 glomeruli
  data: dataset
  expected:
    quantity: largest median number of responding glomeruli over the four pheromones at 48%
    value: 6
    tolerance: 0.6
  criterion: Counts per ant from M2 (each reading). "The highest concentration tested" is read as
    (a) 48%, the 8 ants of Figure 6, or (b) each ant's higher concentration (13 ants).
    Reproduced when, under a reading, the median over ants is at most 6.6 for every pheromone.
- id: figs5a-concentration-more-glomeruli
  statement: Higher concentrations give more robust responses and a few more glomeruli passing the
    threshold, while the overall spatial pattern stays similar across concentrations.
  source: Results, Pheromone representation is sparse, paragraph 2; Figure S5A; Figure S6
  quote: Higher concentrations produced more robust responses, with a few more glomeruli passing the
    threshold, but overall spatial response patterns were similar across concentrations
  data: dataset
  criterion: The paper shows box plots and no test; a rule is fixed here. Within each ant and
    pheromone, M2 counts at the higher minus the lower concentration. Reproduced when, pooled over
    pheromones, positive differences outnumber negative ones by a two-sided sign test at p < 0.05,
    and in more than half of ant and pheromone pairs every ROI that responds at the lower
    concentration also responds at the higher one. Shown under every M2 reading.
- id: figs5b-shared-glomerulus
  statement: The three compounds that elicit panic alarm (4-methyl-3-heptanone, 4-methyl-3-heptanol,
    4-methyl-3-hexanol) activate partly overlapping sets of glomeruli, with a single glomerulus,
    PGb, activated by all three.
  source: Results, Pheromone representation is sparse, paragraph 2; Figure S5B
  quote: we observed consistent partial overlap in the response patterns activated by the three
    compounds eliciting panic alarm responses ... with a single glomerulus activated by all three
  data: dataset
  criterion: Per ant, the number of M2 ROIs responding to all three, at (a) each ant's higher
    concentration (13 ants) or (b) 48% (the 8 ants of Figure 6, whose medians are at 48%); Figure
    S5B plots each concentration and the text names none. Reproduced when, under each M2 reading
    and under (a) or (b), the median over ants is 1 and more than half of the
    ants have exactly one such ROI.
- id: figs5c-mho-rarely-overlaps
  statement: 6MHO only rarely and inconsistently activates glomeruli shared with 4-methyl-3-heptanone
    or 4-methyl-3-hexanol.
  source: Results, Pheromone representation is sparse, paragraph 2; Figure S5C
  quote: while we sometimes observed responses to 6-methyl-5-hepten-2-one and either
    4-methyl-3-heptanone or 4-methyl-3-hexanol in an overlapping region, those occurrences were
    rare and inconsistent
  data: dataset
  criterion: Per ant, at (a) its higher concentration or (b) 48% (as in figs5b-shared-glomerulus),
    the number of M2 ROIs responding to 6MHO and to any other pheromone (overlaps at different
    depths excluded, as in the Methods). Reproduced when, under each M2 reading and under (a) or
    (b), the median over ants is 0 and the count is non-zero in fewer than
    half of the ants.
- id: fig5ab-focal-glomeruli
  statement: PGb lies in the anterior ventral hemi-lobe next to a gap without glomeruli, about
    halfway between the dorsal and ventral AL surfaces, with two neighbouring alarm-responsive
    glomeruli in the same plane; PGb and 6G were found in 13 of 13 ants and PGa in 11 of 13.
  source: Results, Alarm pheromone-responsive glomeruli are spatially stereotyped, paragraph 1;
    Figure 5A-B
  quote: PG b is located approximately halfway between the dorsal and ventral AL surfaces, and is
    neighbored by two additional glomeruli that respond to alarm pheromones, with all three visible
    in the same optical plane ... Both glomeruli were identified in 13/13 individuals. In 11/13
    individuals, we identified a third neighboring glomerulus
  data: dataset
  expected:
  - quantity: ants with PGb identified, of 13
    value: 13
    tolerance: 1.3
  - quantity: ants with 6G identified, of 13
    value: 13
    tolerance: 1.3
  - quantity: ants with PGa identified, of 13
    value: 11
    tolerance: 1.1
  criterion: Identification by M4 on each ant's higher-concentration ROIs (M2, each reading).
    Reproduced when the counts are within tolerance (12 or 13, 12 or 13, 10 to 12) and, in most
    ants with PGb, its centre plane lies in the middle third of the AL depth (from the top plane,
    the dorsal surface, to the deepest plane with AL fluorescence, Methods).
- id: fig5c-s6-tuning
  statement: PGb, PGa and 6G each respond to a unique combination of pheromones, with several
    pheromone and glomerulus pairs giving no response; PGb responds to 4-methyl-3-heptanone,
    4-methyl-3-heptanol and 4-methyl-3-hexanol and not to 6MHO, PGa to 4-methyl-3-heptanol and
    4-methyl-3-hexanol, and 6G to 6MHO.
  source: Results, Alarm pheromone-responsive glomeruli are spatially stereotyped, paragraph 2;
    Figure 5C; Figure S6
  quote: while PG b , PG a , and 6G are spatially adjacent, they each reliably respond to unique
    combinations of odorants, with several pheromone/glomerulus combinations producing no
    detectable responses ... PG b did not respond to 6-methyl-5-hepten-2-one
  data: dataset
  depends_on:
  - fig5ab-focal-glomeruli
  criterion: Peak fold change per trial from M3 (each reading), all concentrations, 13 ants (11
    for PGa). The Methods model, peak response on concentration with a random effect for
    individual, fitted with "the glm function", which has no random effects; readings (a) a
    linear model with individual as a fixed factor, (b) a linear mixed model with a random
    intercept per ant. Concentration log-transformed (Figure S6 legend; the base is a standard
    choice that cannot change the outcome). A combination responds when the model's prediction at
    48% is at least 0.2 (the Methods threshold) with its 95% CI above 0, and gives no response
    when the 95% CI at 48% includes 0. Reproduced when the six named combinations respond, PGb
    to 6MHO does not, and the three glomeruli's sets of responding pheromones all differ.
- id: fig5c-6g-slow
  statement: Responses in PGb and PGa peak and then decline close to baseline by the end of the
    48 s recording, while 6G responses to 6MHO are very slow, with a plateau of tens of seconds.
  source: Results, Alarm pheromone-responsive glomeruli are spatially stereotyped, paragraph 2;
    Figure 5C
  quote: while responses in PG b and PG a peaked and then declined close to baseline by the end of
    the recording, responses in 6G were extremely slow, with a fluorescence plateau of tens of
    seconds
  data: dataset
  depends_on:
  - fig5ab-focal-glomeruli
  criterion: Mean M3 traces for the robust combinations of the Methods (heptanone in PGb; heptanol
    and hexanol in PGb and PGa; 6MHO in 6G). The concentration of Figure 5C is not stated;
    readings (a) 48% (8 ants, as Figure S7C), (b) all concentrations pooled. Thresholds are
    fixed here. Reproduced when the PGb and PGa mean traces over the last five volumes are below
    0.2 (the Methods threshold) and below a quarter of their peak, while the 6G trace stays at or
    above half its peak for at least 20 s.
- id: figs7a-6g-extended
  statement: In 144 s recordings, 6G responses to 6MHO plateau for about 30 s and return to
    baseline about 80 s after odor presentation, sometimes taking more than 100 s.
  source: Results, Alarm pheromone-responsive glomeruli are spatially stereotyped, paragraph 2;
    Figure S7A
  quote: Fluorescence plateaued for ~30s before declining and returning to baseline ~80s after odor
    presentation
  data: dataset
  depends_on:
  - fig5ab-focal-glomeruli
  expected:
  - quantity: plateau duration of the mean 6G trace
    value: 30
    tolerance: 3
    unit: s
  - quantity: time from odor presentation to return to baseline, mean trace
    value: 80
    tolerance: 8
    unit: s
  criterion: Single 144 s trials from five ants at 48%, M3 traces of 6G, and their mean. Plateau
    and return are not defined in the paper. Readings, return to baseline as the first volume
    after the peak where the mean trace falls (a) below baseline mean plus 3 SD (the Methods onset
    rule) or (b) below 0.2; plateau as the time the mean trace stays at or above (c) 90% or (d)
    80% of its peak; the 90% and 80% levels are the reader's, not the paper's. Odor presentation
    read as (e) odor onset at 3 s or (f) odor offset at 8 s. Reproduced when, under one reading,
    both values are within tolerance and at least one trial takes more than 100 s.
- id: figs7c-temporal-lme
  statement: Onset and peak times differ by pheromone and glomerulus; for PGb and PGa responses to
    4-methyl-3-heptanol and 4-methyl-3-hexanol, onset time depends on pheromone, glomerulus and
    their interaction, and time to maximum on pheromone and glomerulus but not their interaction.
  source: Results, Alarm pheromone-responsive glomeruli are spatially stereotyped, paragraph 2;
    Figure S7C legend
  quote: 'Time to response onset: significant effects of pheromone (p=0.0034), glomerulus (p<0.0001),
    and the interaction (p=0.0030). Time to response maximum: significant effects of pheromone
    (p<0.0001) and glomerulus (p=0.047), but not the interaction (p=0.88)'
  statistics:
  - about: onset, pheromone
    test: linear mixed effects model (lme)
    p: 0.0034
    n: 8 ants, three trials per condition per ant, 48%
  - about: onset, glomerulus
    test: linear mixed effects model (lme)
    p: 0.0001
    p_relation: "<"
    n: 8 ants, three trials per condition per ant, 48%
  - about: onset, pheromone by glomerulus interaction
    test: linear mixed effects model (lme)
    p: 0.0030
    n: 8 ants, three trials per condition per ant, 48%
  - about: time to maximum, pheromone
    test: linear mixed effects model (lme)
    p: 0.0001
    p_relation: "<"
    n: 8 ants, three trials per condition per ant, 48%
  - about: time to maximum, glomerulus
    test: linear mixed effects model (lme)
    p: 0.047
    n: 8 ants, three trials per condition per ant, 48%
  - about: time to maximum, interaction
    test: linear mixed effects model (lme)
    p: 0.88
    n: 8 ants, three trials per condition per ant, 48%
  data: dataset
  depends_on:
  - fig5ab-focal-glomeruli
  criterion: M3 traces at 48%; baseline the first five frames; onset the latency from stimulus
    start (3 s) to the first volume where dF/F0 exceeds baseline mean plus 3 SD; time to maximum
    the latency to the largest dF/F0; traces that never exceed the bound excluded (Methods).
    Volume times taken as (index - 1) x 1.2 s, a standard choice that shifts all latencies alike.
    Model per parameter, pheromone, glomerulus and their interaction, random effect for trial
    nested in ant (lme). How the p-values were taken is not stated; readings (a) anova of the lme
    fit, sequential F-tests in the order the Methods list, (b) marginal F-tests, (c) the t-tests
    of the coefficients in its summary. Reproduced when, under every reading, the five effects
    have p < 0.05 and the time-to-maximum interaction has p of 0.05 or more (a claim of absence on
    the paper's test); partially reproduced when three or four of the five hold.
- id: fig5d-stereotyped-positions
  statement: PGa is always anterior (12.9 +/- 1.9 SD um) and slightly lateral (5.1 +/- 2.9 um) to
    PGb, and 6G always lateral to PGb (13.1 +/- 2.6 um) at a similar anterior-posterior position
    (0.6 +/- 2.2 um); the SDs are much smaller than a glomerulus diameter, so the three occupy
    stereotyped positions.
  source: Results, Alarm pheromone-responsive glomeruli are spatially stereotyped, paragraph 3;
    Figure 5D
  quote: 'PG a was always located anterior (mean distance between centers: 12.9±1.9SD μm), and
    slightly lateral (mean distance: 5.1±2.9SD μm) to PG b ( Fig. 5D ). In comparison, 6G was always
    lateral to PG b (mean distance: 13.1±2.6SD μm), and in a similar position along the
    anterior-posterior axis (mean distance: 0.6±2.2SD μm)'
  data: dataset
  depends_on:
  - fig5ab-focal-glomeruli
  expected:
  - quantity: PGa anterior offset from PGb
    value: 12.9
    tolerance: 1.9
    unit: um
  - quantity: PGa lateral offset from PGb
    value: 5.1
    tolerance: 2.9
    unit: um
  - quantity: 6G lateral offset from PGb
    value: 13.1
    tolerance: 2.6
    unit: um
  - quantity: 6G anterior offset from PGb
    value: 0.6
    tolerance: 2.2
    unit: um
  criterion: Tolerances are the paper's SDs. One plane per ant where all three are visible
    (n=11 for PGa, 13 for 6G), PGb at (0,0), 0.289 um per pixel. The centres were placed by hand;
    readings (a) the centroid of each glomerulus's responding pixels (at least 0.2) to its defining
    odor (M4) in that plane, (b) its peak pixel; and the plane from (c) one higher-concentration
    trial or (d) the mean over that ant's higher-concentration trials. These are method details
    the paper leaves open (markers placed by hand). Reproduced when, under every reading, the four
    means are within tolerance, PGa is anterior in every ant and 6G lateral in every ant, and each
    SD is below 10 um (the lower bound of the 10 to 20 um glomerulus diameter); when the readings
    give different outcomes, the claim is blocked as methods_underspecified. If the files give no orientation, only distances are
    tested and the claim is at most partially reproduced.
- id: fig6-shared-panic-pathway
  statement: The three pheromones with overlapping AL responses all elicit panic alarm, while 6MHO
    does not elicit panic and gives a non-overlapping response, pointing to a shared pathway for
    panic alarm centred on PGb.
  source: Results, Alarm pheromone-responsive glomeruli are spatially stereotyped, paragraph 4;
    Figure 6
  quote: The three pheromones with overlapping calcium response patterns all robustly elicited panic
    alarm behavior, while 6-methyl-5-hepten-2-one did not elicit panic alarm behavior and generated
    a non-overlapping response
  data: dataset
  depends_on:
  - figs5b-shared-glomerulus
  - figs5c-mho-rarely-overlaps
  - fig1e-categorical-response
  criterion: The synthesis of the claims it depends on. The imaging half is tested here; the
    behaviour half rests on fig1e-categorical-response, whose data are not in the dataset.
    Reproduced in its imaging half when figs5b-shared-glomerulus and figs5c-mho-rarely-overlaps
    are reproduced; the claim is reported as partially tested.
checks:
- date: 2026-10-23
  kind: agent
  model: claude-opus-5-5
  ready: true
  changes:
  - Opening comment, M4. PGa was required not to respond to 4-methyl-3-heptanone; the Results define PGa only by its heptanol and hexanol responses. A heptanone response now only breaks a tie between candidates.
  - fig1cd-new-pheromones-leave-nest. Named the spacing of the scored timepoints as open; this paper defers it to Lopes et al. 2023.
  - fig1e-categorical-response. The trial counts are Table S2's n for Figure 1F; marked as taken from the same bioassays, since Figure 1E gives no counts in the text.
  - fig1f-hexanol-like-native (and the two Figure 1F claims that refer to it). The Sidak family was given as the six new-against-native comparisons; Table S2 has nine, including the vehicle, and the adjusted p depends on the family.
  - table1-transgenesis. The statement called the last treatment's line stable; Table 1 gives only a minimum of one line there, and the text says only the line from the first four rows gave a stable population.
  - fig2cd-gcamp-in-osns. Said that more than half is the reader's weakest reading of "great majority" and that the fraction is reported.
  - ablation-al-volume-trend. Removed the p < 0.1 upper bound, which the paper does not give; now a claim of absence on the paper's test at 0.05, with sidedness named as open.
  - fig3f-general-odorants-unique. Pairs of odorants are now those each ant was given (each odorant was tested in 2 to 6 ants, not all five in every ant); said the rule is the reader's.
  - fig4-no-decreases. The criterion used a minimum projection the paper never uses; the Methods judged that all responses were positive from the per-plane peak fold change maps, which are now the measure.
  - fig4-large-lasting-responses. Removed the expected value 1.5, a midpoint the paper does not report (it gives a range, 1 to 2); the range stays in the criterion. ROI value readings now must each hold, as the M2 rule says.
  - figs5b-shared-glomerulus, figs5c-mho-rarely-overlaps. Added the 48% reading (Figure 6, n=8) next to each ant's higher concentration, since the text names no concentration.
  - fig5c-s6-tuning. The criterion said seven named combinations; the statement names six (three in PGb, two in PGa, one in 6G).
  - figs7a-6g-extended. Added odor offset (8 s) as a reading of "after odor presentation"; marked the 90% and 80% plateau levels as the reader's.
  - fig5d-stereotyped-positions. Marker placement and plane choice are method details, so the rule now needs every reading to agree and blocks the claim otherwise; it had needed only one.
  - Open, not settled. Several criteria rest on rules the reader chose because the paper judged the finding by eye or gives no measure. These are fig3f-general-odorants-unique, fig3fg-hexanone-broad, figs4a-bilateral-symmetry, fig4-no-decreases (the -0.2 level), fig4-large-lasting-responses, figs5a-concentration-more-glomeruli, fig5ab-focal-glomeruli (middle third of the depth) and fig5c-6g-slow. Each says so; the paper gives nothing to replace them with.
  - Open, not settled. ROI drawing (M2) and single-glomerulus planes (M3) were done by eye in the paper; the readings listed are the reader's and could change the counts.
  - Open, not settled. The across-individual similarity for alarm pheromones (Figure 4D) and the stability of responses over a session (Figure S4B-C) have no claim of their own. They are covered in part by fig5ab-focal-glomeruli and fig5d-stereotyped-positions.
