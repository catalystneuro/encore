# Claims for Hart, Frank, Lopes et al. (2023), Cell, on dandiset 000467.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23,
# under protocol pilot-10 (docs/protocol.md, Reader).
#
# Text read. The accepted author manuscript in PubMed Central (PMC10334690, NIHMS1904919), not
# the version of record: the Results, Discussion, STAR Methods, Key Resources Table and the
# legends of Figures 1 to 6, Table 1 and Figures S1 to S7, as served by PMC. The supplement read
# is NIHMS1904919-supplement-1.pdf (Tables S1 to S4 and the supplemental references). The two
# supplemental videos were not read. No PDF of the main text was supplied, so values shown only
# in figures (the medians written on Figure 6, the boxes of Figure S5, the vectors of Figure 5D)
# could not be read; every claim below rests on numbers printed in the text.
#
# Code read. The Key Resources Table links https://github.com/Social-Evolution-and-Behavior/
# HartKronauer2023, which returns 404. The same lab's repository Hart_Kronauer2023 (README
# "Processing code for calcium imaging data from" this paper, pointing to dandiset 000467) was
# read at commit 72d041a85dcec7c1429351a00a210d2353d0c6db (2023-05-09). It holds two files.
# generate_tif_files.py reads each NWB file (one z-plane of one trial, acquisition
# "TwoPhotonSeries1") and writes a TIFF; it keeps only trials t288, t293, t284 and t290, a
# hard-coded filter that no Methods text explains and that an attempt should not copy.
# macro_calcium_imaging.txt is the ImageJ macro for the whole-AL peak maps (below). The ROI
# drawing, the single-glomerulus traces, the R models (glm, lme) and the GraphPad analyses are
# not in the repository.
#
# Data the paper used. Subjects are adult female transgenic O. biroi workers (clonal line B,
# "GCaMP6s ants", GCaMP6s in olfactory sensory neurons under ObirOrco-QF2/15xQUAS), aged 55 to
# 60 days (general odorants) and 90 to 104 days (alarm pheromones) after eclosion. Two-photon
# volumes of the right antennal lobe (AL), 512 x 512 pixels x 33 planes at 5 um steps, 148 um
# square at 2X zoom (0.289 um per pixel), 27.5 frames/s, one volume every 1.2 s (0.83
# volumes/s); each trial is 48 s with a 3 s lead and a 5 s odor pulse. Three experiments.
# (1) General odorants, n=6 ants, 7 to 9 odorants at 48% in random order, three repeats; five
# odorants (3-hexanone, ethylpyrazine, ethanol, isopropanol, propionic acid) gave robust
# responses and are analysed, each tested in 2 to 6 ants. (2) Bilateral imaging, n=3 ants, 1X
# zoom (296 um square), paraffin oil and 4-methyl-3-hexanol at 48%. (3) Alarm pheromones, n=13
# ants, paraffin oil vehicle then isopropanol positive control, then 4-methyl-3-heptanone,
# 4-methyl-3-heptanol, 4-methyl-3-hexanol and 6-methyl-5-hepten-2-one (abbreviated 6MHO here)
# in random order, three trials at the lower then three at the higher of two concentrations (24
# presentations); 3 ants at 0.75% and 12%, 2 at 3% and 12%, 3 at 12% and 48%, 5 at 3% and 48%
# (so n=8 at 48%). Undecane trials were also run and not analysed. Separately, 144 s recordings
# of 6MHO at 48% in five ants (Figure S7A). The dandiset's description lists the same 6, 3 and
# 13 subjects. Behaviour videos (Figures 1, S2C-F), confocal stacks (Brain Image Library) and
# the genome sequence (NCBI BioProject) are not in the dandiset.
#
# Shared methods, from the STAR Methods (Image processing and analysis) and the macro.
# (M1) Whole-AL peak map. Per plane, Image Stabilizer (translation, pyramid level 1, template
# update 0.90, 200 iterations, tolerance 1e-7, from the macro); F0 the mean of frames 1 to 5
# (frames are volumes, counted from 1 as ImageJ does); dF/F0; peak fold change the mean of
# dF/F0 over frames 9 to 14; a 2-pixel Minimum filter; the maximum over the 33 planes; values
# clipped to [-1, 4]. The Methods put the Minimum filter before the clipping; the macro clips
# each plane, then filters, then clips the projection. The Methods order is the main reading,
# the macro's a variant. The 1-sigma Gaussian blur the Methods name is for the first
# per-plane look only, and the macro has none.
# (M2) ROIs and responding glomeruli. The paper drew ROIs by eye on the M2 maps at each ant's
# higher concentration around "every glomerular region that responded to any odor in at least
# two trials", and called an ROI responding when its peak fold change, quantified "across all
# trials for a particular odor and concentration", was at least 0.2. Open details, with the
# readings the paper allows. Drawing ROIs: (a) connected regions of at least 0.2 in a trial's
# map, kept when they recur in at least two trials of one odor; (b) as (a), keeping only
# regions of glomerulus size (10 to 20 um diameter, Results) and splitting wider ones at local
# maxima. The ROI value: (i) the mean over its pixels (ImageJ's default measure) or (ii) its
# maximum. Counting: (x) an ROI responds when its value averaged over the trials of an
# odor/concentration is at least 0.2 (Methods); (y) count per trial and average the counts
# over trials (Figure S5 legend, "the mean number of responding glomeruli for a given ant
# across all trials"). Overlapping ROIs of two odors at different depths count as different
# glomeruli (Methods). Every claim built on M2 is judged under each reading.
# (M3) Single glomeruli. For each trial, the plane holding the glomerulus centre, the maximum
# over that plane and its two neighbours, then dF/F0 with F0 frames 1 to 5 and peak fold change
# the mean over frames 9 to 14. The centre plane was chosen by eye, and the ROI within the plane
# is not described. Readings: centre plane (a) where the glomerulus's area of at least 0.2 is
# largest, (b) where its peak fold change is highest; ROI a disc of 15 um diameter (the typical
# glomerulus of Figure 5D) on the centre, or the region of at least 0.2 there. Stabilization as
# in M1 is assumed, as the Methods apply it to every plane.
# (M4) Identifying PGb, PGa and 6G, from their definitions in the Results. PGb is the ROI that
# responds (M2) to 4-methyl-3-heptanone, 4-methyl-3-heptanol and 4-methyl-3-hexanol; 6G the
# adjacent ROI, lateral to PGb, that responds to 6MHO; PGa the adjacent ROI, anterior to PGb,
# that responds to 4-methyl-3-heptanol and 4-methyl-3-hexanol. The Results do not say that PGa
# fails to respond to 4-methyl-3-heptanone; the Methods' list of typically robust combinations
# leaves heptanone in PGa out, so a heptanone response is used only to choose between two
# candidates, never to reject one. All three lie in one optical plane, in the anterior ventral hemi-lobe next to a gap without
# glomeruli. Image axes are taken as the anatomical axes, as the figures' L and A labels imply;
# if the files give an orientation, it is used.
