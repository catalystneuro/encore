# Claims for Watson, Levenstein, Greene, Gelinas & Buzsaki (2016), Neuron 90, 839-852, "Network
# homeostasis and state dynamics of neocortical sleep", doi:10.1016/j.neuron.2016.03.036, tested on
# DANDI:000041 and CRCNS:fcx-1.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-15,
# protocol as stated in docs/protocol.md (Reader). It replaces the two per-dataset files
# claims/watson-2016/000041.yaml and claims/watson-2016/crcns-fcx-1.yaml; ids are reused where the
# finding is the same (see "Ids" below).
#
# Text read: the accepted author manuscript in PubMed Central (PMC4873379, NIHMS776601), in
# paper/10.1016-j.neuron.2016.03.036.txt: Introduction, Results, Discussion, Experimental Procedures,
# the legends of Figures 1 to 6 and the Highlights; with supplement 1 (NIHMS776601-supplement-1:
# Table S1, the legends of Figures S1 to S5, the Supplemental Experimental Procedures, and the figure
# pages as extracted text) and supplement 2 (artwork of Figure 1 only, as extracted text). The version
# of record was not read. There is no PDF of the main paper, so values printed only inside Figures 2
# to 5 (the per-sextile R and p of Fig. 3B and 4A-B iv, the n of each triplet class and the asterisks
# of Fig. 5B, the significance marks of Fig. 2F) were not read; claims on those figures rest on the
# Results and legends. Page 7 of the supplement PDF (Figure S5) was rendered to read its panel titles
# and printed R and p, which the text extraction separates from their panels.
#
# Code. The paper links no analysis code. Its methods name MATLAB, KlustaKwik, Klusters, the
# process_multi_start shell script and a modification of FindRipples.m from FMAToolbox
# (http://fmatoolbox.sourceforge.net/) for spindle detection. The CRCNS descriptor ships data readers
# (LoadBinary_bw.m, TStoolbox.zip); these are not the paper's analysis code and were not read. Every
# method below is from the paper's text, its legends or its supplement, or is named as open.
#
# The datasets, from their titles and descriptions on the archives.
#  - 000041 (DANDI), titled as the paper. Its description: silicon probe recordings in the frontal
#    cortices of male Long Evans rats, home cage, no task; LFP and spikes; 11 animals, 27 recording
#    sessions, 1360 units, 1121 stable, 995 putative excitatory and 126 putative inhibitory; only
#    recordings with a WAKE-SLEEP episode (7 min of wake followed by 20 min of sleep), about 2 per
#    session.
#  - crcns-fcx-1 (CRCNS, doi:10.6080/K02N506Q), "Multi-unit spiking activity recorded from rat frontal
#    cortex (brain regions mPFC, OFC, ACC, and M2) during wake-sleep episode ...". Its descriptor
#    (paper/fcx-1.data-description.txt, read for this alone) gives the same summary and names the
#    paper as the source; one folder per session with LFP, spike trains and their classification,
#    and the state intervals, as the paper's Table S1 defines them.
#  Both describe the same 27 sessions, the paper's whole data set. Every claim on recorded data lists
#  both; the author tests each claim on each dataset that holds what it needs.
#
# Data the paper used, as it reports them (Results; Experimental Procedures; Table S1; Supplemental
# Experimental Procedures). Eleven male Long Evans rats, 3 to 7 months old, one or two 64-site
# silicon probes in deep layers of frontal cortex (medial prefrontal, orbitofrontal, anterior
# cingulate and secondary motor cortex; Table S1 gives the area, sessions and units per rat: BWRat17
# to BWRat21, Dino, B22, Bogey, Splinter, Rizzo, Templeton), recorded in the home cage in the light
# cycle; 27 sessions (294 +- 137 min). Wideband at 20 kHz; LFP at 1250 Hz; spikes sorted with
# KlustaKwik and Klusters; 1360 clustered units, 1121 stable, 995 putative pyramidal (pE) and 126
# putative interneurons (pI), classified by waveform and verified by monosynaptic interactions. EMG
# from the correlation of 300 to 600 Hz signals across shanks; motion from video, accelerometer or
# induction coil. States scored per second (Table S1, Supplemental Experimental Procedures, Brain
# state scoring): nonREM (packets, 20+ s of uninterrupted nonREM), REM, microarousals (MA, < 40 s
# between nonREM packets), nonREM episodes, REM episodes, WAKE (7+ min, interruptions < 2 min), SLEEP
# (20+ min of nonREM, REM and MA with no interruption > 2 min), WAKE-SLEEP cycles (54). Detected
# events, UP and DOWN states (43230 and 86839) and spindles (5203). LFP bands delta 0.5 to 4 Hz,
# sigma 9 to 25 Hz, gamma 40 to 100 Hz; theta ratio 5-10 Hz over 2-16 Hz.
#
# Shared method details, used by the criteria below.
# M1. Cells and sessions. Statistics are per cell on pE cells unless stated (Results, Assessment of
#   firing patterns). Analyses are confined to WAKE-SLEEP cycles (Supplemental Experimental
#   Procedures, Brain state scoring). A cell's rate in a state is its spike count over the summed
#   duration of that state's intervals (a standard choice). The paper does not say whether a cell
#   recorded across two WAKE-SLEEP cycles enters a per-episode comparison once per episode or once
#   with its episodes averaged; readings (a) one entry per cell and episode, (b) one per cell,
#   averaged over episodes.
# M2. Sextiles. pE cells from the whole data set are split into six equal groups by WAKE firing
#   rate (Results, Firing pattern and LFP changes across the course of sleep; Fig. 2A legend;
#   Experimental Procedures), kept for all later analyses. "General WAKE firing rate" is read as the
#   rate over all WAKE intervals of the cell's session; reading (b) is the rate over the WAKE of
#   each cycle. The Fig. 2F groups are "based on mean rate"; readings the same WAKE sextiles, or
#   sextiles of the nonREM rate. Sextile numbers differ between figures; Figure S2 numbers 1 as the
#   lowest rate (1 pE Low FR, 6 pE High FR), the Figure S5 legend says sextile 1 is the highest.
#   Criteria name sextiles by rate (top, bottom), or say which numbering they use.
# M3. Time-normalized correlations. SLEEP, nonREM episodes and packets are time-normalized to 0 to 1
#   and, for SLEEP, only nonREM time is used (Results, Firing pattern and LFP changes across the
#   course of sleep; Fig. 3B legend). Correlations are Pearson (Fig. 3B legend). The unit of a sample
#   in these correlations is not stated. Readings, (a) one point per nonREM packet (its mean value at
#   its normalized mid-time); (b) one point per 10 s bin of nonREM (the bin the Supplemental
#   Experimental Procedures use for the CV and burst ratio); (c) 50 equal bins of normalized time,
#   values averaged over episodes per bin. Every R and p printed in Figure S5A and S5B equals a
#   Pearson test on exactly 50 points (checked here, for example R = 0.651633 with n = 50 gives p =
#   2.97e-07 as printed), so the paper used 50 bins there. The Figure S3C R and p (-0.19849,
#   3.3168e-09) equal a Pearson test on about 873 points, about the number of nonREM packets in 54
#   SLEEP periods, which agrees with reading (a) but does not settle it. Values are normalized by the
#   recording's mean before pooling, as the Supplemental Experimental Procedures do for CV and burst
#   ratio.
# M4. Judging correlations and tests. Where the paper reports an R and a p bound, the claim is
#   reproduced when R has the reported sign and p is below the reported bound under one reading,
#   partially reproduced when the sign holds and p < 0.05 but not below the bound, and not
#   reproduced otherwise; the R obtained is reported beside the paper's. Reported R values are test
#   statistics whose size depends on the sampling unit the paper does not fix (M3), so they are not
#   targets with a tolerance. Where the paper prints an exact p (Figures S3C, S5C to S5G), the bound
#   is the next power of ten above it.
# M5. Rate-rate slopes (Fig. 2B, 3D, S2D, S3A). The figures plot log rates and the S2D legend speaks
#   of log firing rates, so the slope is an ordinary least-squares fit of log10 later (or nonREM)
#   rate on log10 earlier (or WAKE) rate, with a 95% interval; cells with a zero rate in either
#   state are left out (a standard choice the paper does not state). Reading (b) fits linear rates.
#   The expected slope is the midpoint of the paper's interval, with half its width as tolerance,
#   the paper's own uncertainty.
# M6. Triplets (Results, Sleep sub-states induce differential lasting firing rate changes;
#   Supplemental Experimental Procedures, Spiking metrics). State A n, state B, state A n+1, with the
#   change from A n to A n+1 attributed to B; nonREM-REM-nonREM triplets are kept unless a WAKE (>
#   120 s) follows the REM before the second packet. The change is per cell rate(A n+1) minus rate(A
#   n) (Fig. 5B legend); the S5 correlations use log(rate n+1) minus log(rate n). The per-sextile
#   test for Fig. 5B is not named; readings (a) Wilcoxon signed-rank against zero, the test the
#   paper uses for paired rate comparisons elsewhere; (b) one-sample t-test against zero; at p <
#   0.05 unless the claim gives a bound. The R and p printed in Figures S5C to S5G equal Pearson
#   tests on about 947 (S5C), 136 (S5D), 576 (S5E), 952 (S5F) and 972 (S5G) points, counts of
#   cells, so those correlations have one point per cell, its changes averaged over its triplets (M1
#   reading b).
# M7. Tolerances. 10% of the reported value unless a claim gives another. Where the paper gives a
#   median or mean +- SD (Table S1, Results), the SD is the spread of values over cells, events or
#   sessions, not an uncertainty of the median or mean, and is often larger than the value (pE WAKE
#   median 0.76 +- 1.53 Hz), so it is not used as the tolerance.
#
# Ids. Where the two earlier files named the same finding differently, one id is kept and the other
# is listed here (000041 id / crcns-fcx-1 id -> id kept).
#   dataset-composition / table1-dataset-counts -> table1-dataset-counts
#   wake-sleep-cycles (000041; crcns had it in table1-dataset-counts) -> wake-sleep-cycles
#   ma-statistics and ma-fraction-over-nrem-episodes / ma-statistics -> both kept, split as in 000041
#   fig2a-median-rates and fig2a-skewed-wide-distribution / fig2a-pe-rate-distribution -> the two
#     000041 ids
#   fig2-burst-index-by-state / burst-index-by-state -> burst-index-by-state
#   fig2c-acg-peaks and fig2c-acg-decay / fig2c-autocorrelogram -> the two 000041 ids
#   fig2de-up-state-sequences / fig2de-fast-before-slow -> fig2de-fast-before-slow
#   fig3b-population-decline / fig3ab-population-rate-declines -> fig3ab-population-rate-declines
#   fig3-first-last-packet / first-last-packet-mean-rate -> first-last-packet-mean-rate
#   fig3d-first-last-slope / fig3d-first-last-packet-slope -> fig3d-first-last-packet-slope
#   fig3e-wake-before-after / post-sleep-wake-lower and fig3e-wake-before-after-sextiles -> the two
#     crcns-fcx-1 ids
#   fig3b-sextiles-over-sleep / fig3b-sextile-changes -> fig3b-sextile-changes
#   fig3b-cv-over-sleep / cv-decreases-over-sleep -> cv-decreases-over-sleep
#   fig3c-slow-oscillation-spindles-over-sleep / fig3c-spindles-over-sleep and fig3c-updown-over-sleep
#     -> the two crcns-fcx-1 ids
#   fig3f-4e-within-up-rates / fig3f-within-up-changes and fig4e-within-up-sextiles -> the two
#     crcns-fcx-1 ids
#   fig4i-band-power-within-nrem and fig4-delta-packet-length / fig4-lfp-within-nrem -> the two
#     000041 ids
#   fig4ii-iii-updown-spindles-within-packets / fig4-updown-within-packets and
#     fig4-spindles-within-nrem -> the two crcns-fcx-1 ids
#   fig4iv-sextiles-within-nrem, fig4v-cv-within-nrem and fig4vi-burst-within-nrem /
#     fig4-sextiles-within-nrem -> the three 000041 ids
#   fig4cd-packet-rate-lfp / fig4cd-packet-rate-lfp-correlations -> fig4cd-packet-rate-lfp-correlations
#   fig5b-nrem-between-ma / fig5b-ma-nrem-ma -> fig5b-ma-nrem-ma
#   fig5c-sigma-ma / fig5c-sigma-ma-change -> fig5c-sigma-ma-change
#   fig5c-wake-movement / part of fig5b-wake-between-packets -> fig5c-wake-movement split out
#   fig5c-rem-duration / part of fig5b-rem-between-packets -> fig5c-rem-duration split out, with the
#     REM theta part as fig5c-rem-theta
#   fig5c-delta-change / fig5c-delta-change-slow-cells -> fig5c-delta-change-slow-cells
#   New here, tables1-state-durations and fig4-late-packet-sigma-delta.
schema_version: 2
paper: doi:10.1016/j.neuron.2016.03.036
claims:
- id: table1-dataset-counts
  statement: The data comprise 11 rats and 27 sessions, with 1360 clustered units of which 1121 are
    stable, 995 putative pyramidal cells (mean 36.9 per session, range 10 to 104) and 126 putative
    interneurons (4.67 per session, range 0 to 13).
  source: Results, Identification of brain states, sentence 1; Results, Assessment of firing patterns
    in different brain states, paragraph 1; Table S1, top
  quote: This resulted in 995 putative pyramidal (pE) cells (mean of 36.9 cells/session; range ...
    10–104) and 126 putative interneurons (pI) (4.67 cells/session; range ... 0–13)
  datasets:
  - "000041"
  - crcns-fcx-1
  expected:
  - quantity: rats
    value: 11
    tolerance: 0
  - quantity: sessions
    value: 27
    tolerance: 0
  - quantity: putative pyramidal cells
    value: 995
    tolerance: 0
  - quantity: putative interneurons
    value: 126
    tolerance: 0
  - quantity: stable units
    value: 1121
    tolerance: 0
  - quantity: mean pE cells per session
    value: 36.9
    tolerance: 0.1
  criterion: Counts of the subjects, sessions and classified cells, which every later claim uses.
    They are integers of a fixed selection, so the tolerance is zero (0.1 for the mean, its printed
    precision). Reproduced when all counts match; partially reproduced when the pE and pI counts
    are within 10% and the rest are not exact. The per-rat sessions and units of Table S1 are
    compared and reported. The 1360 clustered units are reported if the dataset holds unstable
    units too.
- id: wake-sleep-cycles
  statement: The data hold 54 WAKE-SLEEP episodes (WAKE of at least 7 min followed by SLEEP of at
    least 20 min), an average of 2.0 per session, and sessions without one were discarded.
  source: Results, Identification of brain states, paragraph 1; Results, Firing pattern and LFP
    changes across the course of sleep, sentence 1; Table S1
  quote: We identified 54 WAKE-SLEEP episodes in our dataset, or an average of 2.0 episodes per
    neuron recorded (27 sessions)
  datasets:
  - "000041"
  - crcns-fcx-1
  expected:
  - quantity: WAKE-SLEEP episodes
    value: 54
    tolerance: 5.4
  - quantity: WAKE-SLEEP episodes per session
    value: 2.0
    tolerance: 0.2
  criterion: Cycles as Table S1 and the Supplemental Experimental Procedures define them, a WAKE
    (7+ min of not REM and not nonREM, interruptions < 2 min) immediately followed by a SLEEP (20+
    min of nonREM, REM and MA with no interruption > 2 min). Readings (a) deposited cycle
    intervals where a dataset holds them; (b) cycles built from the deposited state intervals by
    these rules. Reproduced when under one reading both values are within tolerance and every
    session has at least one cycle.
- id: tables1-state-durations
  statement: Median durations are 1192 s for WAKE episodes, 2421 s for SLEEP episodes, 297 s for
    nonREM episodes, 98 s for REM episodes, and REM latency from SLEEP start is 647 s.
  source: Table S1, top
  inferred: Values read from Table S1 (median +- SD); no sentence of the text states them.
  datasets:
  - "000041"
  - crcns-fcx-1
  expected:
  - quantity: WAKE episode duration
    value: 1192
    tolerance: 119.2
    unit: s
  - quantity: SLEEP episode duration
    value: 2421
    tolerance: 242.1
    unit: s
  - quantity: nonREM episode duration
    value: 297
    tolerance: 29.7
    unit: s
  - quantity: REM episode duration
    value: 98
    tolerance: 9.8
    unit: s
  - quantity: REM latency (start REM minus start SLEEP)
    value: 647
    tolerance: 64.7
    unit: s
  depends_on:
  - wake-sleep-cycles
  criterion: Medians over the intervals of WAKE-SLEEP cycles (Supplemental Experimental Procedures,
    analyses confined to those cycles); REM latency per SLEEP, from its start to the start of its
    first REM episode. Table S1 also gives a WAKE-SLEEP episode duration of 5918 +- 125 s, which is
    not judged, as it lies far above the sum of the WAKE and SLEEP medians (3613 s) and its SD is
    implausibly small beside theirs (899 and 1731 s), so it is likely misprinted; it is reported. Reproduced when all five are within tolerance; partially reproduced
    when three or four are.
- id: ma-statistics
  statement: There are 790 microarousals, with median duration 15.9 s, 0.32 per minute, taking 9.1%
    of SLEEP time.
  source: Results, Identification of brain states, paragraph 2; Table S1
  quote: There were a total of 790 MAs in our dataset (median duration = 15.9±3.3sec; frequency =
    0.32±0.12 per minute; 9.1±3.5% of time in SLEEP)
  datasets:
  - "000041"
  - crcns-fcx-1
  expected:
  - quantity: number of MAs
    value: 790
    tolerance: 79
  - quantity: median MA duration
    value: 15.9
    tolerance: 1.59
    unit: s
  - quantity: MA incidence
    value: 0.32
    tolerance: 0.032
    unit: per minute
  - quantity: MA percent of SLEEP time
    value: 9.1
    tolerance: 0.91
    unit: percent
  criterion: MAs are arousals < 40 s between nonREM packets (Results; Table S1; Supplemental
    Experimental Procedures), within SLEEP. Table S1 gives median +- SD, with incidence and percent
    "on a per-session basis"; readings for the duration, (a) median over all MAs, (b) median over
    sessions of session medians; incidence and percent are per session, then the median over
    sessions (Table S1 header "Median ± SD"). Reproduced when under one reading the four values
    are within tolerance; partially reproduced when three are.
- id: ma-fraction-over-nrem-episodes
  statement: The fraction of time occupied by MAs decreases over the course of nonREM episodes (R =
    -0.85), with no statistical change over the course of SLEEP.
  source: Results, Identification of brain states, paragraph 2
  quote: Over nonREM episodes the fraction of time occupied by MAs decreased (correlation versus
    normalized nonREM episode time ... R = −0.85, p < 10 −10 ), with no statistical change over the
    course of SLEEP
  statistics:
  - about: MA time fraction against normalized nonREM episode time
    test: correlation
    statistic: R = -0.85
    p: 1.0e-10
    p_relation: "<"
  datasets:
  - "000041"
  - crcns-fcx-1
  depends_on:
  - ma-statistics
  criterion: Per nonREM episode, the fraction of each normalized-time bin spent in MA, Pearson
    against normalized time (M3). An R of -0.85 implies values averaged over episodes, and with p <
    1e-10 it needs at least about 36 points, so the reading is M3 (c), 50 bins averaged over
    episodes (the bin count the paper used for Figure S5; it is not given here); M3 (a) and (b) are
    shown as variants. Judged by M4. The absence over
    SLEEP is judged by the same correlation over normalized SLEEP time at p < 0.05; reproduced
    when the episode decrease holds and the SLEEP correlation is not significant.
