    autocorrelograms normalized in amplitude). The nonREM peak is the maximum of the mean; the
    theta peak is the largest local maximum between 60 and 250 ms (a standard window around 8 Hz).
    Reproduced when the nonREM peak lag is within tolerance (7 to 9 ms in whole bins) and REM and
    WAKE each show a local maximum within tolerance of 125 ms; partially reproduced when one part
