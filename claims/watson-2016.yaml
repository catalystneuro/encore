- id: fig2a-skewed-wide-distribution
  statement: The distribution of pE firing rates is strongly positively skewed, with a lognormal
    tail toward high rates and a supra-lognormal tail toward low rates, and spans three orders of
    magnitude, from 0.05 to 5 Hz.
  source: Results, Assessment of firing patterns in different brain states, paragraph 2; Figure 2A;
    Figure S2C
  quote: the distribution of per-cell mean firing rates for putative pyramidal neurons was strongly
    positively skewed, with a lognormal tail toward higher frequencies, and a supra-lognormal tail
    toward lower frequencies ( Figure S2C ), spanning three orders of magnitude range from 0.05 Hz to
    5 Hz ( Figure 2A )
  datasets:
  - "000041"
  - crcns-fcx-1
  depends_on:
  - fig2a-median-rates
  criterion: On the per-cell rates over all states pooled ("Across all states", Results; Figure
    S2C, the "pE total" distribution of firing rates "across all states"), each state shown as a
    variant. The paper does not say what range "spanning" means, and 0.05 to
    5 Hz is two orders of magnitude, not the three it states. The shape holds when the pE rate
