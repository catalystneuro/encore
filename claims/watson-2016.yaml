    choice); mean pE and pI rates, synchrony (fraction of pE cells spiking in 50 ms bins) and E/(E+I)
    (fraction of pE cells over the fraction of pE and pI cells spiking in 50 ms bins) per bin,
    averaged over all UP states (Fig. 1E legend). The paper reports no test; Pearson R against
    normalized time over the 10 bin means is used (a standard choice). Reproduced when the pE rate,
    pI rate, synchrony and E/(E+I) each have negative R and are lower in the last bin than in the
    first, and in the UP-onset-triggered spectrogram (Fig. 1E top; Fig. S4C, UP states of at least
    1 s) the gamma (40 to 100 Hz) power peak precedes the sigma (9 to 25 Hz) peak. Partially
    reproduced when three of the four decrease, or the four decrease and the spectral order fails.
- id: fig2de-fast-before-slow
  statement: In the early UP state pE cells fire in sequences stable across the first and second
    halves of SLEEP, and a cell's onset latency is negatively correlated with its firing rate.
  source: Results, Assessment of firing patterns in different brain states, paragraph 5; Figure 2D
    and 2E and legends
  quote: pyramidal neurons fired in reliable spatiotemporal sequences during the early part of the UP
    state (<200 msec) and these stereotypical sequences remained stable across the entirety of sleep
    ( Figure 2D ). Additionally, the spike onset times of individual neurons in the sequences were
    negatively correlated with their firing rates
  datasets:
  - "000041"
  - crcns-fcx-1
  depends_on:
