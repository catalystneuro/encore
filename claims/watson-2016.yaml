- id: fig1e-up-state-dynamics
  statement: Within UP states, firing rates of pyramidal cells and interneurons decrease over the
    course of the UP state, with decreasing E/(E+I) ratio and decreasing pE population synchrony;
    UP states begin with a surge of gamma power followed by increased sigma power.
  source: Results, Assessment of firing patterns in different brain states, paragraph 4; Figure 1E
    and legend; Figure S4C
  quote: UP states were characterized by an initial surge of gamma power, followed by increased sigma
    power ( Figure 1E ), corresponding to UP state-related sleep spindles. Firing rates of both
    pyramidal cells and interneurons decreased over the time course of the UP state, accompanied by
    a decreasing gain of excitation (excitatory-inhibitory, E-I, ratio) and decreasing population
    synchrony of pyramidal neurons
  datasets:
  - "000041"
  - crcns-fcx-1
  depends_on:
  - updown-durations
