  quote: Burst index was highest during nonREM (median in nonREM = 11.8%) and lowest during WAKE (4.0
    %), with REM (5.5 %) slightly higher than WAKE (p < 0.05; Kruskal-Wallis test)
  statistics:
  - test: Kruskal-Wallis test
    p: 0.05
    p_relation: "<"
  datasets:
  - "000041"
  - crcns-fcx-1
  expected:
  - quantity: median burst index, nonREM
    value: 11.8
    tolerance: 1.18
    unit: percent
  - quantity: median burst index, WAKE
    value: 4.0
    tolerance: 0.4
    unit: percent
  - quantity: median burst index, REM
    value: 5.5
    tolerance: 0.55
    unit: percent
  criterion: The Results define the index as the fraction of spikes with ISIs below 15 ms; the
    Supplemental Experimental Procedures compute it per neuron in 10 s bins as the proportion of ISIs
    of 15 ms or less. Readings, (a) per cell and state, the fraction of ISIs <= 15 ms over all the
    state's time; (b) the mean over the cell's 10 s bins in that state; (c) the fraction of spikes
    with an ISI under 15 ms to the previous or next spike. ISIs spanning two intervals of a state
    are dropped (a standard choice). Median over pE cells. Kruskal-Wallis across the three states
    on per-cell values; the post hoc test for REM against WAKE is not named (readings Dunn's test,
    or a Wilcoxon rank-sum test, at p < 0.05). Reproduced when under one reading the medians are
    within tolerance, the Kruskal-Wallis p < 0.05 and REM exceeds WAKE at p < 0.05; partially
    reproduced when the order nonREM > REM > WAKE and the Kruskal-Wallis test hold but a median
    misses.
- id: fig2c-acg-peaks
  statement: The average spike autocorrelogram of pE cells peaks near 8 ms in nonREM, with smaller
    peaks near 125 ms (theta) in REM and WAKE.
  source: Results, Assessment of firing patterns in different brain states, paragraph 3; Figure 2C
    and legend
  quote: a large peak occurred at approximately 8ms inter-spike interval during nonREM, whereas
    smaller peaks were present at ~125 ms (i.e., theta frequency) during REM and WAKE ( Figure 2C )
  datasets:
  - "000041"
  - crcns-fcx-1
  expected:
  - quantity: autocorrelogram peak lag, nonREM
    value: 8
    tolerance: 0.8
    unit: ms
  - quantity: autocorrelogram theta peak lag, REM and WAKE
    value: 125
    tolerance: 12.5
    unit: ms
  criterion: The paper does not give the autocorrelogram bin, range or normalization. Per pE cell
