    legend and the Results say halves of SLEEP, the Fig. 2E legend halves of the recording session;
    readings (a) halves of each SLEEP, (b) halves of the session. The rate used is not named;
    readings the cell's WAKE rate (M2) or its nonREM rate. The paper names no test; Pearson at p <
    0.05, with log10 rate, is a standard choice. Reproduced when under one reading the first-half
    and second-half latencies are positively correlated and latency is negatively correlated with
    rate; partially reproduced when one of the two holds.
- id: fig2f-rate-group-correlations
  statement: In nonREM, pairwise spike-count correlations depend on firing rate group; pairs within
    the fastest group and within the slowest group are positively correlated, fast-firing pairs most
    highly, and fast and slow cells are negatively correlated with each other.
  source: Results, Assessment of firing patterns in different brain states, paragraph 5; Figure 2F
    and legend
  quote: the fastest and slowest firing neurons tended to be positively correlated within groups, but
    were actually negatively correlated across groups ( Figure 2F )
  datasets:
  - "000041"
  - crcns-fcx-1
