    methods_underspecified.
- id: fig2c-ahv-shapes
  statement: Of 67 cells encoding azimuthal head velocity (both cohorts), 64 had tuning curves fit
    by a 5th or lower order polynomial; 10 of 67 were linear asymmetric, and of the 64 nonlinear
    ones (as counted) 28 were nonlinear asymmetric and 26 nonlinear symmetric; most symmetric cells
    increased firing with head speed (20 of 26, P = 0.009).
  source: Results, first section; Figure 2c
  depends_on:
  - fig1c-cohort1-fractions
  - fig1c-ahv-cohort2
  criterion: Shapes of the model tuning curves of all cells selected for Ha-dot, over the range of
    the Methods (2.5th to 97.5th percentile, within -100 to 100 deg/s), classified when that
    range covers at least half of -100 to 100. The denominators are cells chosen by the
    selection, whose number differs here, so each fraction is compared with the 95%
    Clopper-Pearson interval of the fraction here (reason for this tolerance). The five fractions
    are well fit 64/67, Las 10/67, NLas 28/64, NLs 26/64, NLs-pos 20/26. Reproduced when all five
    paper fractions lie inside the intervals and the NLs-pos majority is significant (two-sided
    binomial test, p < 0.05); partially reproduced when three or four fractions do; not
    reproduced otherwise.
- id: fig2c-ahv-direction
  statement: Similar proportions of asymmetric head velocity cells preferred ipsiversive and
    contraversive head rotation (contraversive 23 of 38).
  source: Results, first section
- id: fig2ab-pitch-roll-shapes
  statement: Nearly all pitch and roll tuning curves were fit by a 5th or lower order polynomial
    (44 of 46, 52 of 53); most pitch cells were linear (17 of 46) or quadratic (16 of 46), most
    roll cells quadratic (28 of 53, linear 10 of 53); cells preferred both tilt directions in
    similar proportions (pitch 26 of 44 upward, P = 0.29; roll 30 of 52 leftward, P = 0.41).
  source: Results, first section; Figure 2a, b
  depends_on:
  - fig1c-pitch-roll-fractions
  criterion: Model tuning curves of the cells selected for Hp and Hr over the Methods' range
    (2.5th to 97.5th percentile within -50 to 50 degrees), smoothed with a 20-point Gaussian
    window as the Methods (smoothdata, width 20) and classified when that range covers at least
    half of -50 to 50. Order fractions are compared with the 95% Clopper-Pearson intervals here
    (six fractions, well fit, linear and quadratic for each). The direction preference (side of
    zero of the peak; the files do not say which sign is up or left) is an absence claim on a
    two-sided binomial test at 0.05. Reproduced when at least five of the six fractions lie
    inside the intervals and neither variable shows a preference; partially reproduced when
    three or four lie inside, or a preference is found; not reproduced otherwise.
- id: fig2ab-pitch-roll-stability
  statement: The stability of tuning to pitch (median 0.67, IQR 0.35 to 0.80) and roll (0.54, IQR
    0.23 to 0.74) was comparable to that of azimuthal head direction (0.65, IQR 0.47 to 0.81;
    Kruskal-Wallis P = 0.12).
  source: Results, first section; Figure 2av, bv
  depends_on:
  - fig1c-pitch-roll-fractions
  - fig1c-cohort1-fractions
  expected:
  - {quantity: median stability of pitch tuning, value: 0.67, tolerance: 0.32}
  - {quantity: median stability of roll tuning, value: 0.54, tolerance: 0.31}
  - {quantity: median stability of Ha tuning, value: 0.65, tolerance: 0.18}
  criterion: Tolerances are the distance to the farther quartile. Stability as for
    fig2cv-ahv-stability, in Cohort 1; Ha over 0 to 360 degrees. The comparability is an absence
    claim judged on the paper's test, a Kruskal-Wallis test across the three at 0.05. Reproduced
    when the three medians are within tolerance and the test finds no difference; partially
    reproduced when one part fails; not reproduced otherwise.
- id: fig2cv-ahv-stability
  statement: Tuning to azimuthal head velocity was highly stable between the two halves of the
    session (median 0.91, IQR 0.74 to 0.96, n = 64), comparable to the stability of tuning to body
    speed (0.86, IQR 0.63 to 0.95, n = 52; Wilcoxon rank-sum P = 0.097).
  source: Results, first section; Figure 2cv
  depends_on:
  - fig1c-cohort1-fractions
  - fig1c-ahv-cohort2
  expected:
  - quantity: median stability of Ha-dot tuning
    value: 0.91
    tolerance: 0.17
  - quantity: median stability of Bs tuning
    value: 0.86
    tolerance: 0.23
  criterion: Tolerances are the distance from the median to the farther quartile the paper
    gives. Stability is the Pearson correlation of the model tuning curves fitted on the first
    and the second half of the kept bins, over the overlap of the halves' ranges. Body speed
    stability is taken over the Cohort 1 cells selected for Bs (the paper's n = 52 matches the
    Cohort 1 count in Supplementary Figure 3b); all cohorts are shown as a variant. The claim of
    comparability is an absence claim judged on the paper's test, a two-sided Wilcoxon rank-sum
    test at 0.05. Reproduced when both medians are within tolerance and the test does not find
    a difference; partially reproduced when one of the three parts fails; not reproduced
    otherwise.
- id: fig3ab-contributions-of
  statement: In the freely moving data body position was the strongest predictor of MEC spiking
    (contribution median 0.64), followed by azimuthal head direction (0.32), with body speed lower
    (0.15) and azimuthal head velocity contributing least (0.06).
  source: Results, second section; Figure 3a, b
  depends_on:
  - fig1c-cohort1-fractions
  - fig1c-ahv-cohort2
  expected:
  - quantity: median contribution of B
    value: 0.64
    tolerance: 0.26
  - quantity: median contribution of Ha
    value: 0.32
    tolerance: 0.26
  - quantity: median contribution of Bs
    value: 0.15
    tolerance: 0.19
  - quantity: median contribution of Ha-dot
    value: 0.06
    tolerance: 0.07
  criterion: Contribution of a variable, for cells encoding it and at least one other, from the
    ten-fold log-likelihood of the selected model and of the model refit without it. Readings of
    the Methods' formula, (a) 1 - LLH(reduced) / LLH(selected); (b) LLH(reduced) / LLH(selected).
    Both cohorts are pooled, as in the paper. The tolerance is the distance from the median to
    the farther quartile the paper gives (its stated spread). Reproduced when, under one reading,
    all four medians are within tolerance, the order of the medians is B > Ha > Bs > Ha-dot and B
    exceeds Ha by a two-sided rank-sum test at 0.0033; partially reproduced when the order holds
    but a median is outside tolerance; not reproduced otherwise.
- id: fig3c-llh-of
  statement: Of the 1200 freely moving cells, 869 significantly encoded at least one variable,
    with a spike-normalised log-likelihood increase of median 0.11 (IQR 0.04 to 0.26).
  source: Figure 3c
  depends_on:
  - of-cohorts-by-count
  expected:
