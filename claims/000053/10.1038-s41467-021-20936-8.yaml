  - quantity: cells encoding Eh
    value: 343
    tolerance: 34.3
  - quantity: cells encoding Ev
    value: 234
    tolerance: 23.4
  - quantity: cells encoding Eh-dot
    value: 244
    tolerance: 24.4
  - quantity: cells encoding Ev-dot
    value: 135
    tolerance: 13.5
  criterion: The LN forward search with B, Bs, Eh, Ev, Eh-dot and Ev-dot on every cell of the 11
    sessions. Reproduced when all five counts are within tolerance; partially reproduced when the
    any-eye count is at least half of 711 and every eye variable is encoded by at least three
    times the number of cells the false-positive estimate implies, but not all counts are within
    tolerance; not reproduced otherwise. The code's variant of the final test is shown.
- id: fig4j-body-fractions
  statement: Of the 2861 head-fixed cells, 1958 encoded virtual body position and 1321 body speed.
  source: Supplementary Figure 3c; Figure 5 (n = 1968 for body position); Figure 6
  depends_on:
  - vr-dataset-size
  expected:
  - quantity: cells encoding B
    value: 1958
    tolerance: 195.8
  - quantity: cells encoding Bs
    value: 1321
    tolerance: 132.1
- id: figs3c-false-positives-vr
  statement: In the head-fixed data, shuffling an eye variable in time and re-running the
    selection falsely detected it in few cells (Eh 5, Ev 5, Eh-dot 8, Ev-dot 13 of 2861).
  source: Supplementary Figure 3c
  depends_on:
  - vr-dataset-size
  expected:
  - {quantity: false Eh, value: 5, tolerance: 0}
  - {quantity: false Ev, value: 5, tolerance: 0}
  - {quantity: false Eh-dot, value: 8, tolerance: 0}
  - {quantity: false Ev-dot, value: 13, tolerance: 0}
  criterion: On a random 15% of the cells of each session (seeded), each eye variable is
    shuffled in time and the selection re-run. The procedures agree for a variable when the
    paper's rate (count of 2861) lies inside the 95% Clopper-Pearson interval of the rate here.
    Reproduced when it does for all four; partially reproduced for two or three; not reproduced
    otherwise. The expected values are the paper's counts of 2861; the measured values are rates
    scaled to 2861. When the rate here is far from the paper's (outside the interval) for an eye
    variable, the selection claims that rest on it are blocked as methods_underspecified.
- id: fig4k-conjunctive-eye
  statement: The majority of eye-encoding cells also encoded body position or speed (96%), and a
    subset encoded more than one eye movement parameter (28%).
  source: Results, third section; Figure 4j, k
  depends_on:
  - fig4j-eye-fractions
  expected:
  - quantity: fraction of eye cells also encoding B or Bs
    value: 0.96
    tolerance: 0.04
  - quantity: fraction of eye cells encoding two or more eye variables
    value: 0.28
    tolerance: 0.028
  criterion: Among cells selected for any eye variable. The first tolerance is 10% capped at 1.
    Reproduced when both are within tolerance; partially reproduced when one is.
- id: fig5-eye-position-preference
  statement: Cells encoding horizontal eye position preferred nasal and temporal positions in
    similar proportions (170 of 343 nasal, P = 0.91), and cells encoding vertical eye position
    preferred upward and downward positions in similar proportions (88 of 177, P = 1); all 343
    horizontal and 177 of 234 vertical tuning curves were classified.
  source: Results, third section; Figure 5a, b
  depends_on:
  - fig4j-eye-fractions
  criterion: A claim of absence, judged on the paper's test, a two-sided binomial test at 0.05 of
    the number of classified cells peaking on one side of zero. The dandiset does not say which
    sign is nasal or upward; the test does not depend on it. Reproduced when neither Eh nor Ev
    shows a preference; not reproduced when either does. The classified fractions (paper 343 of
    343 and 177 of 234) are reported.
- id: fig5-eye-position-stability
  statement: Eye position tuning was stable across the session (Eh median 0.87, IQR 0.67 to
    0.95; Ev 0.72, IQR 0.21 to 0.91), horizontal eye position tuning more stable than body
    position tuning (0.71, IQR 0.52 to 0.85, n = 1968; P = 8.6e-25) and vertical eye position
    tuning similar to it (P = 0.91).
  source: Results, third section; Figure 5av, bv
  depends_on:
  - fig4j-eye-fractions
  - fig4j-body-fractions
  expected:
  - quantity: median stability Eh
    value: 0.87
    tolerance: 0.20
  - quantity: median stability Ev
    value: 0.72
    tolerance: 0.51
  - quantity: median stability B
    value: 0.71
    tolerance: 0.19
  criterion: Stability as for fig2cv-ahv-stability, over classified cells for Eh and Ev and all
    cells encoding B. Tolerances are the distance to the farther quartile. Reproduced when the
    three medians are within tolerance, Eh exceeds B by a two-sided rank-sum test at 0.0167, and
    the same test does not find Ev and B different at 0.05; partially reproduced when the Eh and
    B comparison holds but another part fails; not reproduced otherwise.
- id: fig6-eye-velocity-shapes
  statement: Eye velocity tuning curves were well fit by polynomials (244 of 244 horizontal, 131
    of 135 vertical); horizontal eye velocity cells were 43 linear asymmetric, 147 nonlinear
    asymmetric and 54 nonlinear symmetric, vertical 29, 68 and 34.
  source: Results, third section; Figure 6a, b
  depends_on:
  - fig4j-eye-fractions
  criterion: Classification as for fig2c-ahv-shapes, over the Methods' range (1st to 99th
    percentile, within -3 to 3 for Eh-dot and -2 to 2 for Ev-dot), classified when that covers at
    least 80% of the preset range. The six paper fractions (Las, NLas, NLs of the well-fit cells
    for each axis) are compared with the 95% Clopper-Pearson intervals here. Reproduced when all
    six lie inside; partially reproduced when four or five do; not reproduced otherwise.
- id: fig6-eye-velocity-direction
  statement: Linear asymmetric horizontal eye velocity cells preferred nasal movements (30 of 43,
    P = 0.014) while nonlinear asymmetric ones preferred temporal movements (87 of 147, P = 0.026);
    vertical eye velocity cells showed no preference (Las 16 of 29, NLas 31 of 68).
  source: Results, third section; Figure 6
  depends_on:
  - fig6-eye-velocity-shapes
  criterion: The sign convention of the files is not documented, so the test is of the sides,
    not their names. Reproduced when Las Eh-dot cells show a majority side by a two-sided binomial
    test at 0.05, NLas Eh-dot cells show a significant majority on the other side, and neither
    vertical group shows a preference at 0.05; partially reproduced when the two horizontal
    majorities are on opposite sides but one is not significant, or a vertical group shows a
    preference; not reproduced otherwise.
- id: fig6-velocity-stability
  statement: Tuning to horizontal eye velocity was more stable than tuning to body speed (0.93,
    IQR 0.82 to 0.98, against 0.84, IQR 0.60 to 0.94, n = 1321; P = 6.5e-18), and tuning to
    vertical eye velocity less stable (0.74, IQR 0.21 to 0.92; P = 0.00061).
  source: Results, third section; Figure 6av, bv
  depends_on:
  - fig4j-eye-fractions
  - fig4j-body-fractions
  expected:
  - quantity: median stability Eh-dot
    value: 0.93
    tolerance: 0.11
  - quantity: median stability Ev-dot
    value: 0.74
    tolerance: 0.53
  - quantity: median stability Bs
    value: 0.84
    tolerance: 0.24
  criterion: As for fig5-eye-position-stability. Reproduced when the three medians are within
    tolerance, Eh-dot exceeds Bs and Ev-dot is below Bs, each by a two-sided rank-sum test at
    0.05; partially reproduced when one comparison fails or a median is outside; not reproduced
    when both comparisons fail.
- id: fig7ab-contributions-vr
  statement: Body position and speed influenced head-fixed MEC spiking more strongly than eye
    movement signals (contribution medians B 0.65, Bs 0.26, Eh 0.10, Ev 0.14, Eh-dot 0.05, Ev-dot
    0.04), and eye position contributed more than eye velocity (P = 1.9e-10).
  source: Results, third section; Figure 7a, b
  depends_on:
  - fig4j-eye-fractions
  expected:
  - {quantity: median contribution B, value: 0.65, tolerance: 0.27}
  - {quantity: median contribution Bs, value: 0.26, tolerance: 0.29}
  - {quantity: median contribution Eh, value: 0.10, tolerance: 0.12}
  - {quantity: median contribution Ev, value: 0.14, tolerance: 0.16}
  - {quantity: median contribution Eh-dot, value: 0.05, tolerance: 0.07}
  - {quantity: median contribution Ev-dot, value: 0.04, tolerance: 0.07}
  criterion: Contributions as for fig3ab-contributions-of, with its two readings; tolerances are
    the distance to the farther quartile. Reproduced when, under one reading, at least five of
    the six medians are within tolerance, the B and Bs medians both exceed every eye median, and
    pooled eye position contributions exceed pooled eye velocity contributions by a two-sided
    rank-sum test at 0.0033; partially reproduced when the order holds but another part fails;
    not reproduced otherwise.
- id: fig7c-llh-vr
  statement: Of the 2861 head-fixed cells, 2191 significantly encoded at least one variable, with
    a spike-normalised log-likelihood increase of median 0.05 (IQR 0.02 to 0.11).
  source: Figure 7c
  depends_on:
  - vr-dataset-size
  expected:
  - quantity: cells encoding at least one variable
    value: 2191
    tolerance: 219.1
  - quantity: median log-likelihood increase
    value: 0.05
    tolerance: 0.06
  criterion: As for fig3c-llh-of, with its three readings of the unit.
- id: fig7e-no-clustering
  statement: Cells with similar tuning to an eye movement variable did not tend to encode similar
    additional variables.
  source: Results, third section; Figure 7e, f; Supplementary Figure 11
  depends_on:
  - fig4j-eye-fractions
  criterion: A claim of absence, judged on the paper's test. For each eye variable, the model
    tuning curves of its cells (50 points over the Methods' range) are mean-subtracted, scaled to
    unit range and projected on their first two principal components; for each other variable
    and k from 1 to 10, the mean distance of each labelled cell (also encoding that variable) to
    its k nearest labelled neighbours is compared with 1000 label permutations, P being the
    fraction of permuted distances smaller than observed. Reproduced when no combination has
    P < 0.005 (0.05 / 10, as the Methods); not reproduced otherwise. Combinations with fewer than
    two labelled cells are skipped and counted.
- id: fig8-landmarks
  statement: When the virtual track had no visual landmarks, body position tuning degenerated or
    remapped (correlation 0.02), while tuning to eye position, eye velocity and body speed was
    preserved (0.40 to 0.82), in 1621 cells from 6 sessions in 6 mice.
  source: Results, fourth section; Figure 8
- id: vr-hemispheres
  statement: Recordings were made in the left (4 recordings from 3 mice) or right MEC (7 from 7
    mice); proportions of eye-movement cells did not differ between hemispheres, and preferences
    held in each hemisphere.
  source: Methods, Data collection; Results, third section
