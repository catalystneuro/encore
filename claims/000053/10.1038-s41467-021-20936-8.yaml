# Claims for Mallory, Hardcastle et al. (2021), Nature Communications 12, 671, on dandiset 000053.
# Source: the full text (open access, CC BY), read from Europe PMC (PMC7844029), with the
# Supplementary Information PDF from the publisher.
#
# When these criteria were written, the author had seen only the data check: the file list and
# sizes, the series, units and identifiers of every file, the unit counts per file and subject,
# the trial tables of the large head-fixed files, the ranges of the variables in two head-fixed
# sessions (eye position 1st and 99th percentiles about -3 and 2.6 to 4.7), and the timing of a
# model fit (no selection result was looked at). A first version of this file marked the pitch and
# roll claims blocked; the data check then found pitch and roll in the Cohort 1 files (the
# `head_direction` series has three columns, described as "azimuth, pitch, roll"), and those
# claims were given criteria before their analysis was run, having seen only the first rows and
# the extremes of one file's columns. The code the paper names
# (khardcastle/spline-lnp-model at 34b470f, GiocomoLab/ln-model-of-mec-neurons at 643386b) had
# been read.
#
# Method choices fixed here, where the Methods leave them open:
# - The head-fixed dataset is the 11 sessions whose identifier contains "baseline" (10 files
#   without raw data, and npI1 0413 from its behavior+ecephys file); every bin of them is used,
#   including the gain and contrast trials their trial tables list, which the paper does not
#   mention.
# - The freely moving cohorts are assigned by subject, matching unit counts to the counts the
#   Methods give per study (claim of-cohorts-by-count); the files carry no cohort label.
# - The LN model follows the Methods and the spline code (see mec.py): splines with s = 0.5,
#   L2 penalty 1, ten folds of every tenth 10 s section (Methods; the code uses 3 s), forward
#   search with one-sided signed-rank tests at 0.05, and the final model tested against the mean
#   rate model. Cohort 1 is fitted with the paper's eight variables (B, Bs, Ha, Hp, Hr, Ha-dot,
#   Hp-dot, Hr-dot); pitch and roll velocities are not stored, and are the change of the stored
#   angles over time (8 bins each, as pitch, roll and Ha-dot). Cohort 2 is fitted with B, Bs, Ha
#   and Ha-dot, the variables it was recorded with.
# - Classification of velocity tuning curves (not fixed by the Methods): order 1 is linear
#   asymmetric (Las). For order 2 and higher, lines are fit to the curve on each side of zero; the
#   curve is nonlinear symmetric (NLs) when the two slopes have opposite signs and the smaller
#   absolute slope is at least half the larger, and nonlinear asymmetric (NLas) otherwise. NLs-pos
#   when firing rises away from zero (V shape), NLs-neg otherwise. A variant with opposite signs
#   alone is shown.
# - Preferred side: for position variables, the side of zero (the mean eye position) where the
#   model tuning curve peaks; for Las velocity cells, the side where firing is higher; for NLas,
#   the side with the larger absolute slope (variant, the side of the curve's maximum).
# - False-positive rates (Supplementary Figure 3) are estimated by shuffling one variable in
#   time (a random permutation of the kept bins, fixed seed) and re-running the selection:
#   head-fixed, the four eye variables on a random 15% of the cells of each session (the full set
#   does not fit the run time); freely moving, Ha, Hp, Hr and Ha-dot on all Cohort 1 cells.
# - Log-likelihood increase is reported in bits per spike, with the spline code's scale (nats
#   times log 2) and nats as readings.
schema_version: 1
dandiset: "000053"
paper: doi:10.1038/s41467-021-20936-8
claims:
- id: vr-dataset-size
  statement: The head-fixed dataset comprises 2861 MEC units recorded with Neuropixels probes in
    11 sessions from 8 mice.
  source: Results, third section; Methods, Neuropixels probes
  expected:
  - quantity: units
    value: 2861
    tolerance: 0
  - quantity: sessions
    value: 11
    tolerance: 0
  - quantity: mice
    value: 8
    tolerance: 0
  criterion: Reproduced when a set of head-fixed sessions that the files' identifiers or
    descriptions single out (not one chosen by trying sums) holds exactly these counts, each
    recording counted once. Partially reproduced when the counts are met only by a set chosen by
    its sum.
- id: of-cohorts-by-count
  statement: The freely moving dataset comprises 1200 MEC cells; Cohort 1 (6 mice, IMU and LEDs)
    contributed 179 and Cohort 2 (20 mice, LEDs only) 1021, of which 228 unpublished (5 mice), 122
    from Campbell et al. (2 mice), 389 from Eggink et al. (7 mice) and 282 from Munn et al. (6
    mice).
  source: Methods, Freely moving dataset, Animals
  expected:
  - quantity: freely moving cells
    value: 1200
    tolerance: 0
  - quantity: Cohort 1 cells
    value: 179
    tolerance: 0
  - quantity: freely moving mice
    value: 26
    tolerance: 0
  criterion: The files carry no cohort or study label. Subjects are grouped by what the files
    show (subject naming, identifiers, recording dates, arena sizes) and each group's unit total
    is compared with the Methods' count per study. Reproduced when every group matches the
    Methods in cells and mice; partially reproduced when the cells match for every group but a
    mouse count differs, or when only some groups match; not reproduced otherwise. Claims that
    use Cohort 1 or Cohort 2 depend on this assignment.
