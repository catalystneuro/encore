    value: -389.9
    tolerance: 34.7
    unit: deg/s
  - quantity: 25th percentile
    value: -37.7
    tolerance: 3.9
    unit: deg/s
  - quantity: median
    value: -0.1
    tolerance: 0.3
    unit: deg/s
  - quantity: 75th percentile
    value: 36.4
    tolerance: 3.8
    unit: deg/s
  - quantity: 97.5th percentile
    value: 385.1
    tolerance: 34.7
    unit: deg/s
  criterion: Tolerances are the stated sem across mice. Percentiles of each session's azimuthal
    head velocity (the file's series, read as deg/s; it is labelled rad/s, but the data check
