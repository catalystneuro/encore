- id: fig6e-motor-single-trial
  statement: In the motor task, thalamic activity on a trial is better predicted by cortical activity
    from the same trial than by shuffled trials, and corticothalamic weights fit to single trials are
    better aligned with the readout than those fit to trial averages, suggesting the motor thalamus
    receives an efference copy.
  source: Results, Data are consistent with model predictions, paragraph 6; Figure 6E
  quote: We found that thalamic activity on any given trial was substantially better predicted by
    cortical activity in the same trial ... corticothalamic weights that capture trial-by-trial
    activity in thalamic neurons were better aligned with the readout weights than those that
    capture only trial-averaged thalamic activity
  criterion: Not testable on DANDI:000009; the Sauerbrei et al. 2020 simultaneous recordings are not
    deposited in any archive the paper names.
- id: figs6f-ct-alignment-not-significant
  statement: For individual thalamic neurons, the difference between the alignment of corticothalamic
    weights with the leading cortical PC and with the readout direction is not significant in either
    dataset (one-sided paired t tests, p = 0.09 and p = 0.17).
  source: Figure S6F
  inferred: The legend says only that statistics of a one-sided paired t-test are shown; the values
    P=0.09 and P=0.17 are figure labels in the supplement text, and the figure could not be rendered
    to see which task each belongs to (the label order suggests 0.09 for motor control and 0.17 for
    working memory).
  statistics:
  - about: one task (label order suggests motor control)
    test: one-sided paired t test
    p: 0.09
  - about: the other task (label order suggests working memory)
    test: one-sided paired t test
    p: 0.17
  criterion: A claim of absence, judged on the paper's test for the working memory data. Methods W1
    to W10; corticothalamic weights of each thalamic unit from the regression on all 16 PCs, mapped
    back to unit space (w U_1:16^T); alignment with PC 1 and with the readout direction (W7)
    estimated on the same cortical population, as |cos| (Methods, Alignment between weights). The paper does not state the direction
    of the one-sided test; it is taken as PC greater than readout, the model's prediction for working
    memory (Results). Reproduced when the one-sided paired t test over the 72 units gives p >= 0.05;
    the p-value and the mean difference are reported, and compared with 0.17 and 0.09.
  depends_on:
  - wm-sessions-link
