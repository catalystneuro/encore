# Claims for Lakshminarasimhan, Xie, Cohen, Sauerbrei, Hantman, Litwin-Kumar & Escola (2024), Cell
# Reports 43, 114059, "Specific connectivity optimizes learning in thalamocortical loops", on
# dandiset 000009.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-21,
# protocol pilot-18 as stated in docs/protocol.md (Reader, steps 1 to 4).
#
# Text read. paper/10.1016-j.celrep.2024.114059.txt. Its header says "version of record", but the
# body is the NIH author manuscript in PubMed Central (PMC11104520, NIHMS1988710): Summary,
# Introduction, Results, Discussion, STAR Methods, the legends of Figures 1 to 6 and the key
# resources table. The supplement (mmc2.pdf, pages 22 to 32) is appended to the same file: the
# legends of Figures S1 to S6 and Table S1, with the figure labels as loose text. The PDF
# (paper/...supp-mmc2.pdf) could not be rendered here (no PDF renderer in the environment), so no
# figure was read; numbers shown only in figures are taken from the text labels where noted. The
# p-values of fig2e-alignment-task-dependent are printed with garbled glyphs ("1.6 √ó 10 ‚àí4" and
# "2.8 √ó 10 ‚àí3"), so the quote checker does not find them; they were confirmed by reading.
#
# Code read. github.com/kaushik-l/tc-learning, commit 2aa94dd5fb381ffb30a56962a3be20b96f63868b
# (2024-10-06), the repository the key resources table names. It holds simulation code only:
# thalamocortical__motor.py (the motor control task with RFLO and corticothalamic weights
# 'random', 'readout' or 'pc', one run, seed 1), thalamocortical__reaching.py with model.py,
# train_bptt.py and bptt__reaching.pt (the reaching task of Figure 5), rflo.py, plot.py. It has no
# working memory task, no meta-learning, and no analysis of the neural data. Where the code and
# the Methods differ, the Methods are followed and the code is a variant: the code's readout-
# aligned update uses rate 0.01 (Methods beta = 1), its PC-aligned update uses rate 0.01/i^2 for
# the i-th thalamic unit (Methods beta = 0.01), its feedback weights B are N(0, 1/R) (Methods
# U(0, 2/N)) and its corticothalamic weights start at g N(0, 1/N) (Methods N(0, 1/N)).
#
# Data the paper used, as it reports them (STAR Methods, Neural datasets; Figure 6; Figure S6).
# The paper records no data ("The study did not generate any new data").
# (1) Motor control: Sauerbrei et al. 2020 (ref. 14), simultaneous recordings in motor cortex and
# motor thalamus while mice reach to grasp a food pellet after an acoustic cue; one session each
# from 3 mice; 53 +/- 9 cortical and 33 +/- 5 thalamic units per session (101 thalamic neurons in
# Figure 6E); hand position in three axes. The paper names no deposit for these data (the key
# resources table lists only DANDI:000009), and DANDI:000009 does not hold them. Their claims are
# kept and cannot be tested on this dandiset.
# (2) Working memory: Guo et al. 2017 (ref. 10), DANDI:000009 (key resources table, "ALM and
# thalamus data"). Recordings "in separate sessions" in ALM and in thalamus (VM and VAL) while a
# mouse reports the anterior or posterior pole location by licking left or right after a delay of
# about 1.3 s. "The dataset includes 5 behavioral sessions from one mouse. The total number of
# cortical and thalamic units was 151 and 72 respectively." Variables used: spike times of ALM and
# thalamic units, trial epochs (delay onset), the choice (lick direction) and its correctness.
# The dandiset's archive title is the Guo et al. 2017 title; its description says it holds ALM and
# thalamus spikes during the delayed response task with photoinhibition. Which mouse and sessions
# the paper used is for the author to find (claim wm-sessions-link).
# (3) Model simulations (Figures 1 to 5, S1 to S5): generated by the paper's models, not deposited;
# data elsewhere, where names the code.
#
# Method for the claims on DANDI:000009, from STAR Methods (Neural datasets, Estimation of readout
# weights, Analysis of corticothalamic communication, Alignment between weights), the Results
# (Data are consistent with model predictions) and the legends of Figures 6 and S6. The paper's
# code holds none of it. Cited in the criteria as W1 to W10.
# W1 Sessions and units. Five sessions from one mouse with 151 ALM and 72 thalamic (VM/VAL) units
#    in total (Methods). Which units count (all sorted units, or the single units Guo et al.
#    label as well isolated) is open; the reading that gives 151 and 72 in the five sessions is
#    used, and if none does, the closest is used and the difference reported.
# W2 Trials. Correct trials only, grouped by choice, left and right (Methods). The paper does not
#    say whether photoinhibition trials are left out; readings (T1) correct trials without
#    photostimulation; (T2) all correct trials.
# W3 Alignment and window. Spike trains aligned to the onset of the delay epoch (Methods, Figure 6B
#    legend); analyses restricted to the delay period (Results), from delay onset to the go cue.
#    The time bin is not given; 10 ms (the model's dt) is a standard choice and cannot change the
#    outcome beyond the smoothing.
# W4 Smoothing. Spike trains convolved with a Gaussian of width sigma chosen by cross-validation on
#    the validation trials (Methods). The grid of sigma is not given; 10, 25, 50, 100 and 200 ms is
#    a standard choice, and the chosen sigma is reported.
# W5 Split. Trials split at random into 80% training, 10% validation and 10% test (Methods),
#    within each choice. Variance explained is computed on the test-set averages. The seed is a
#    standard choice; results are reported as the mean over 10 random splits as well as for one.
# W6 Activity. Per choice, the trial-averaged smoothed rates over the window, left and right
#    concatenated in time, h(t) = [h_l(t) h_r(t)] for ALM and r(t) likewise for each thalamic unit
#    (Methods; Figure S6B legend).
# W7 Readout. Ordinary least squares of c(t), -1 for every bin of left trials and +1 for right,
#    on h(t) (Methods). An intercept is included (standard). Figure 6C gives n = 5 sessions, so the
#    readout and its PC alignment are computed per session from that session's ALM units, and
#    averaged over sessions.
# W8 PCs. Eigendecomposition of the covariance of the training-set h(t) (mean-subtracted), top
#    k = 16 eigenvectors (Methods). Readout in the PC basis w_PC = w U_1:16, taken in absolute
#    value as for the motor task (Methods, Estimation of readout weights); the alignment of the
#    readout with PC i is |w . u_i| / ||w|| (Methods, Alignment between weights).
# W9 Cortical population for the thalamic analyses. The Methods regress each thalamic unit on
#    cortical activity, and the Figure S6 legend says "in all analysis, the ALM cortical population
#    (n=151) was subsampled to match the dataset from motor cortex (n=53 +/- 9)". Readings
#    (P1) the 151 ALM units pooled over the five sessions as one trial-averaged population,
#    subsampled at random to 53 units, the result averaged over 20 subsamples; (P2) the same
#    without subsampling; (P3) each thalamic unit with the ALM units of its own session.
# W10 Thalamic regression. For each thalamic unit, OLS of r(t) on the projections h_k(t) =
#    h(t) U_1:k, k = 1 to 16, and on all cortical units; R2 on the test set, R2(k) = 1 -
#    Var[r - w_k h_k] / Var[r] (Methods). Normalization of R2(k), open between the Methods and the
#    Results: (N1) R2(k)/R2(16) (Methods); (N2) R2(k)/R2 with R2 from all cortical units
#    (Results); (N3) each unit's curve rescaled to run from 0 to 1 (Figure 6D legend). Summary
#    over the 72 units, mean +/- SEM (Figure 6E legend, "standard errors in mean").
schema_version: 2
paper: doi:10.1016/j.celrep.2024.114059
claims:
- id: wm-sessions-link
  kind: link
  statement: The dandiset holds the working memory data the paper reanalyzed, five sessions from one
    mouse with 151 ALM units and 72 thalamic units in total.
  source: STAR Methods, Neural datasets; key resources table
  quote: The dataset includes 5 behavioral sessions from one mouse. The total number of cortical and
    thalamic units was 151 and 72 respectively
  expected:
  - quantity: sessions from one mouse
    value: 5
    tolerance: 0
  - quantity: ALM units over the five sessions
    value: 151
    tolerance: 15
  - quantity: thalamic (VM/VAL) units over the five sessions
    value: 72
    tolerance: 7
  criterion: Among the mice of DANDI:000009 with ALM and thalamic (VM or VAL) units, find one with
    five sessions whose unit totals, under a reading of W1, are within tolerance of 151 ALM and 72
    thalamic units. Reproduced when exactly one mouse fits; when several fit, the one with the
    closest counts is used and the others are reported; not reproduced when none does. The
    session list found is used by every claim on DANDI:000009.
- id: fig1c-tc-learning-improves-with-thalamus
  statement: With RFLO plasticity in thalamocortical synapses, task performance (1 - R2 on the motor
    control target) improves with the number of thalamic neurons.
  source: Results, Thalamocortical learning rule, paragraph 2; Figure 1C (green)
  quote: We found that the performance improves with the number of thalamic neurons, suggesting that
    local plasticity at thalamo-cortical synapses ( W C T ) facilitates learning
  data: elsewhere
  where: Not deposited; generated by the paper's model, github.com/kaushik-l/tc-learning at commit
    2aa94dd (thalamocortical__motor.py with tc_type 'random')
  criterion: The model of STAR Methods (N = 256, g = 1.5, dt = 0.1 tau, RFLO with eta = 0.1 on
    thalamocortical and readout weights, random fixed corticothalamic weights, 10,000 trials), on
    the basic motor control task, for M = 1, 2, 4, ..., 128 (Figure 1 legend), 40 initializations
    each (Quantification). Reproduced when the median 1 - R2 decreases from M = 1 to M = 128 and
    the Spearman correlation between M and the medians is negative.
- id: fig1d-cortical-feedback-alignment
  statement: The alignment between feedback weights B and readout weights W_O in cortical neurons
    rises as learning performance improves, a sign of credit assignment in thalamocortical synapses.
  source: Results, Thalamocortical learning rule, paragraph 2; Figure 1D (green)
  quote: This improvement in learning performance is accompanied by an increase in the alignment
    between weights in the feedback pathway B (which communicate error signals to post-synaptic
    neurons) and readout weights W O
  data: elsewhere
  where: Not deposited; generated by the paper's model, github.com/kaushik-l/tc-learning at commit
    2aa94dd (thalamocortical__motor.py)
  criterion: Same simulations as fig1c-tc-learning-improves-with-thalamus. Alignment is the
    normalized dot product of B and W_O (STAR Methods, Alignment between weights), normalized as
    (beta - beta_0)/(1 - beta_0) with beta_0 the alignment with a random direction (Figure 1
    legend). Reproduced when the median normalized alignment at the end of learning increases with
    M (Spearman correlation positive).
  depends_on:
  - fig1c-tc-learning-improves-with-thalamus
- id: fig1cd-corticothalamic-plasticity-fails
  statement: Local plasticity at corticothalamic as well as thalamocortical synapses gives no gain
    over thalamocortical learning with fixed random corticothalamic weights, and feedback alignment
    in thalamic neurons is no greater than chance.
  source: Results, Thalamocortical learning rule, paragraphs 3 and 4; Figure 1C (gray) and 1D
    (black); Figure S1B and S1C
  quote: local plasticity operating simultaneously at thalamocortical and corticothalamic synapses
    does not yield any improvement in learning performance over what is obtained from learning only
    thalamocortical synapses with fixed random corticothalamic connections ... the alignment is no
    greater than chance in thalamic neurons
  data: elsewhere
  where: Not deposited; the paper's code at commit 2aa94dd has no corticothalamic RFLO; written from
    STAR Methods, Equation 6
  criterion: The model of fig1c-tc-learning-improves-with-thalamus with corticothalamic weights also
    updated by Equation 6 (B' from U(0, 2/M)); the corticothalamic learning rate was set by
    hyperparameter optimization (Methods), whose search the paper does not give, so the rate with
    the lowest median error over 1e-4, 1e-3, 1e-2 and 1e-1 is used. The paper gives no test. For
    each M, the median 1 - R2 of the two-site model is compared with the thalamocortical-only model
    by a two-sided Wilcoxon rank-sum test over the 40 runs. Reproduced when for no M the two-site
    model is better at p < 0.05, and the median normalized thalamic alignment (B' against
    W_CT phi'(u) W_O) is within its bootstrap standard error of 0 for every M.
- id: figs1d-small-initial-weights
  statement: Corticothalamic plasticity can be made to work when thalamocortical weights start small,
    of order 1/N variance, so that the thalamus barely affects the cortex before learning.
  source: Results, Thalamocortical learning rule, paragraph 4; Figure S1D
  quote: One way to overcome this challenge is to initialize thalamocortical weights to have small (
    ~ O ( 1 / N ) variance such that thalamic influence on cortical activity is minimal prior to
    learning
  data: elsewhere
  where: Not deposited; written from STAR Methods and the Figure S1D legend
  criterion: As fig1cd-corticothalamic-plasticity-fails, with initial weights of variance 1/N (the
    paper says "~O(1/N)" and gives no constant). Reproduced when the median normalized thalamic
    feedback alignment exceeds its bootstrap standard error above 0 for most M and the two-site
    model has lower median 1 - R2 than the thalamocortical-only model for most M.
- id: fig2d-metalearned-error-reduction
  statement: Meta-learned corticothalamic weights reduce the error of thalamocortical learning
    severalfold compared with random corticothalamic weights, by a median factor of 5.8 in motor
    control and 5.1 in working memory.
  source: Results, Optimal corticothalamic connectivity improves learning performance, paragraph 3;
    Figure 2D
  quote: The error dropped severalfold across both tasks when thalamocortical learning was performed
    using optimized corticothalamic weights as opposed to random corticothalamic weights ( Figure 2D
    ; median factor of reduction in error ... motor control, 5.8; working memory, 5.1)
  data: elsewhere
  where: Not deposited; the paper's code at commit 2aa94dd has no meta-learning; written from STAR
    Methods, Meta-learning
  expected:
  - quantity: median error reduction factor, motor control
    value: 5.8
    tolerance: 0.58
  - quantity: median error reduction factor, working memory
    value: 5.1
    tolerance: 0.51
  criterion: Meta-learning as in STAR Methods (N = 256, M = 32, corticothalamic weights onto one
    thalamic unit optimized by BPTT with Adam, rate 1e-4, 10,000 epochs of 200 RFLO trials,
    thalamocortical weights reset each epoch, B^T = W_O, other weights fixed), then thalamocortical
    learning with the optimized and with random corticothalamic weights over 40 initializations.
    The factor is read as (R1) the median over runs of the ratio of errors, run by run, or (R2) the
    ratio of the median errors. Reproduced when both factors are within tolerance under one
    reading.
- id: figs2a-random-feedback
  statement: The gain from meta-learned corticothalamic weights holds when learning uses random
    error-feedback weights B and readout weights are learned.
  source: Results, Optimal corticothalamic connectivity improves learning performance, paragraph 3;
    Figure S2A
  quote: We found qualitatively similar results when learning in the presence of random
    error-feedback weights, B ( STAR Methods ; Figure S2A ), showing that the improvement in
    learning performance cannot be attributed to feedback alignment used in the meta-learning
    procedure
  data: elsewhere
  where: Not deposited; written from STAR Methods, Meta-learning, and the Figure S2A legend
  criterion: As fig2d-metalearned-error-reduction, with random B and readout weights updated by the
    delta rule (Table S1, S2A). Reproduced when the median error with optimized weights is lower
    than with random weights in both tasks by a two-sided Wilcoxon rank-sum test at p < 0.05 over
    the 40 runs (the paper names no test).
  depends_on:
  - fig2d-metalearned-error-reduction
- id: fig2e-alignment-task-dependent
  statement: Meta-learned corticothalamic weights align more with the readout direction than with the
    leading PC in the motor control task, and more with the leading PC in the working memory task.
  source: Results, Optimal corticothalamic connectivity improves learning performance, paragraph 4;
    Figure 2E
  quote: Whereas alignment with the readout direction was significantly greater than the alignment
    with the leading PC in the motor control task ... this pattern was inverted for the working
    memory task where in fact the corticothalamic weights were more strongly aligned with the
    direction of the leading PC
  statistics:
  - about: motor control, readout against leading PC alignment
    test: paired t test
    p: 0.00016
  - about: working memory, leading PC against readout alignment
    test: paired t test
    p: 0.0028
  data: elsewhere
  where: Not deposited; written from STAR Methods, Meta-learning and Alignment between weights
  criterion: The meta-learned weights of fig2d-metalearned-error-reduction, one per initialization
    (40); alignment of the optimized weight vector with W_O and with the leading eigenvector of the
    cortical covariance, normalized by beta_0 (Results). Two-sided paired t test over runs in each
    task. Reproduced when readout alignment exceeds PC alignment in motor control and PC exceeds
    readout in working memory, each at p < 0.05.
  depends_on:
  - fig2d-metalearned-error-reduction
- id: fig3ab-single-thalamic-neuron
  statement: With one thalamic neuron, readout-aligned corticothalamic weights give the best learning
    of motor control and PC-aligned weights the best learning of working memory.
  source: Results, Subspace-aligned corticothalamic connectivity outperforms random corticothalamic
    projection, paragraph 2; Figure 3A and 3B
  quote: For autonomous control, aligning corticothalamic connectivity with the readout direction
    yielded a substantial improvement over other strategies ( Figure 3A ). In contrast, the working
    memory task benefited from aligning corticothalamic connectivity to the leading PC of cortical
    activity
  data: elsewhere
  where: Not deposited; generated by the paper's model, github.com/kaushik-l/tc-learning at commit
    2aa94dd (thalamocortical__motor.py, tc_type 'random', 'readout', 'pc', M = 1); the working memory
    task written from STAR Methods
  criterion: Models of STAR Methods, Subspace aligned models (random, PC with beta = 0.01, readout
    with beta = 1), M = 1, N = 256, 40 initializations, basic tasks (motor c = 2, T = 20 tau;
    working memory P = 8). Reproduced when the median 1 - R2 is lowest for readout in motor control
    and lowest for PC in working memory. The code's update rates are run as a variant.
- id: fig3cd-advantage-persists-with-m
  statement: Performance improves with the number of thalamic neurons for all structures, and the
    advantage of readout alignment (motor control) or PC alignment (working memory) persists for
    relatively large M.
  source: Results, Subspace-aligned corticothalamic connectivity outperforms random corticothalamic
    projection, paragraph 3; Figure 3C and 3D
  quote: Nonetheless, the advantage of aligning corticothalamic projections with the readout
    direction (for autonomous control; Figure 3C ) or PC directions (for working memory; Figure 3D )
    persists even when M is relatively large
  data: elsewhere
  where: Not deposited; generated by the paper's model (code at commit 2aa94dd for motor control);
    the working memory task written from STAR Methods
  criterion: As fig3ab-single-thalamic-neuron for M = 1, 2, 4, ..., 256 (Methods). "Relatively large"
    is not defined; readings (a) up to M = 32 (the meta-learning model), (b) up to M = 128.
    Reproduced when, under one reading, the predicted structure has the lowest median 1 - R2 at
    every M up to the bound in both tasks, and the median of every structure falls with M.
  depends_on:
  - fig3ab-single-thalamic-neuron
- id: fig3ef-task-type-not-complexity
  statement: The best corticothalamic structure depends on the type of task and not on its
    complexity; for the simplest tasks both structured models beat random by large factors (motor
    2.6 PC, 2.7 readout; working memory 3.8 x 10^3 PC, 6.1 x 10^4 readout).
  source: Results, Subspace-aligned corticothalamic connectivity outperforms random corticothalamic
    projection, paragraph 4; Figure 3E and 3F
  quote: We found that the choice of corticothalamic structure that maximized learning depends only
    on the type of task being learned and not on task complexity ... median factor of reduction in
    error relative to random connectivity
  data: elsewhere
  where: Not deposited; generated by the paper's model; written from STAR Methods, Task description
  expected:
  - quantity: simplest motor task, PC-aligned reduction factor
    value: 2.6
    tolerance: 0.26
  - quantity: simplest motor task, readout-aligned reduction factor
    value: 2.7
    tolerance: 0.27
  - quantity: simplest working memory task, PC-aligned reduction factor
    value: 3800
    tolerance: 380
  - quantity: simplest working memory task, readout-aligned reduction factor
    value: 61000
    tolerance: 6100
  criterion: Complexity varied as in STAR Methods (motor c = 1 to 5; working memory P = 1 to 16 on a
    log scale, read as 1, 2, 4, 8, 16), M as in Figure 3A and 3B (M = 1, an assumption, as the
    legend gives none), 40 runs. The simplest task is c = 1 and P = 1. Reproduced when the predicted
    structure is best at every level above the simplest and the four factors (read as in
    fig2d-metalearned-error-reduction) are within tolerance; partially reproduced when the ordering
    holds but the factors do not.
- id: fig4ab-network-size-compression
  statement: The benefit of aligned corticothalamic weights is stable across cortical sizes up to
    N = 2,048, and lowering the compression ratio from 100 to 10 gives only a modest drop in the
    benefit.
  source: Results, Subspace-aligned corticothalamic connectivity outperforms random corticothalamic
    projection, paragraph 6; Figure 4A and 4B
  quote: We found that the performance benefit of learning by preferentially aligning the
    corticothalamic projections with the directions identified above was stable across different
    sizes of the cortical network
  data: elsewhere
  where: Not deposited; written from STAR Methods, Models of distributed thalamic representation
  criterion: N = 64 to 2,048 (powers of two), M = ceil(N/100) and ceil(N/10), rho = 1, readout
    alignment for motor control and PC alignment for working memory, 40 runs; benefit (1 -
    R0^2)/(1 - R2) (Figure 4 legend). Reproduced when the median benefit exceeds 1 at every N for
    both ratios and both tasks.
- id: fig4cd-partial-alignment
  statement: Corticothalamic weights that carry only a fraction of the variance in the readout
    direction or the leading PC still improve learning.
  source: Results, Subspace-aligned corticothalamic connectivity outperforms random corticothalamic
    projection, paragraph 6; Figure 4C and 4D
  quote: we found that corticothalamic connectivity that communicates a fraction of variance in the
    activity from the cortical subspaces identified above was sufficient to produce an improvement
    in learning performance
  data: elsewhere
  where: Not deposited; written from STAR Methods, Models of distributed thalamic representation
  criterion: N = 2,048, rho^2 varied from 0 to 1 (the grid is not given; 0, 0.1, 0.25, 0.5, 0.75, 1
    used as a standard choice), compression ratio as in Figure 4C and 4D (not stated; 100 and 10
    both run). Reproduced when the median 1 - R2 at some rho^2 below 1 is lower than at rho^2 = 0
    in both tasks.
- id: fig4ef-model-pcs-and-thalamus
  statement: In the model the leading cortical PCs align with the readout in working memory, while in
    motor control the readout aligns with low-variance PCs, so fewer cortical PCs explain thalamic
    activity in working memory than in motor control.
  source: Results, Subspace-aligned corticothalamic connectivity outperforms random corticothalamic
    projection, paragraph 7; Figure 4E and 4F
  quote: Accordingly, the leading PCs are substantially aligned with the readout direction in the
    model trained on this task ( Figure 4E , blue). In contrast, the readout direction in the model
    trained on motor control is mostly aligned with cortical PCs characterized by high frequency
    fluctuations, which have low variance
  data: elsewhere
  where: Not deposited; written from STAR Methods and the Figure 4 legend
  criterion: The trained models of fig4ab-network-size-compression at compression 100 (Figure 4
    legend; N not stated, 2,048 used as in Figure 4C and 4D). Reproduced when the PC with the
    largest alignment to the readout has a lower index in working memory than in motor control, and
    the cumulative variance of thalamic activity explained by the top 5 PCs is higher in working
    memory.
  depends_on:
  - fig4ab-network-size-compression
- id: figs4ab-needs-thalamocortical-learning
  statement: Structured corticothalamic weights give no benefit unless thalamocortical synapses are
    learned.
  source: Results, Subspace-aligned corticothalamic connectivity outperforms random corticothalamic
    projection, paragraph 8; Figure S4A and S4B
  quote: The benefits of optimized corticothalamic connectivity are not observed unless
    thalamocortical synapses are learned
  data: elsewhere
  where: Not deposited; written from STAR Methods and the Figure S4 legend
  criterion: A claim of absence with no test named. Models of fig3ab-single-thalamic-neuron with
    thalamocortical weights fixed and readout weights learned (Figure S4 legend). Reproduced when
    the structured and random models do not differ by a two-sided Wilcoxon rank-sum test at
    p < 0.05 over the 40 runs, while with thalamocortical learning they do; the effect size is
    reported.
- id: figs4ef-noise-robustness
  statement: The model with thalamocortical learning is more robust to noise in the initial cortical
    state than a reservoir network that learns only readout weights.
  source: Results, Subspace-aligned corticothalamic connectivity outperforms random corticothalamic
    projection, paragraph 8; Figure S4E and S4F
  quote: in contrast to a reservoir network where learning is limited to readout weights, the model
    with thalamocortical learning is more robust to noise in the initial activity state of the
    cortex
  data: elsewhere
  where: Not deposited; written from the Figure S4E and S4F legend
  criterion: Initial state noise from U[-eps, +eps] (Figure S4 legend; the eps values are not given,
    0.01, 0.1, 0.5 and 1 used). Reproduced when the median 1 - R2 of the thalamocortical model is
    lower than that of the readout-only model at the largest eps in both tasks.
- id: figs5ab-bptt-structure-irrelevant
  statement: When thalamocortical synapses learn by BPTT instead of RFLO, the structure of
    corticothalamic weights does not change performance much.
  source: Results, Subspace-aligned corticothalamic connectivity outperforms random corticothalamic
    projection, paragraph 9; Figure S5A and S5B
  quote: when plasticity in thalamocortical synapses is implemented by BPTT instead of a three-factor
    rule (RFLO), the structure of corticothalamic weights does not influence the learning
    performance substantially
  data: elsewhere
  where: Not deposited; written from STAR Methods and the Figure S5 legend
  criterion: The paper gives no threshold for "substantially". Reproduced when, with BPTT, the ratio
    of median 1 - R2 between random and best structured weights is smaller than the same ratio with
    RFLO, in both tasks.
- id: figs5cd-thalamic-recurrence
  statement: Recurrent excitation between thalamic neurons dampens the benefit of corticothalamic
    structure.
  source: Results, Subspace-aligned corticothalamic connectivity outperforms random corticothalamic
    projection, paragraph 9; Figure S5C and S5D
  quote: the benefit of corticothalamic structure is dampened in the presence of recurrent excitatory
    connections between thalamic neurons
  data: elsewhere
  where: Not deposited; the paper does not give the model with thalamic recurrence beyond the Figure
    S5 legend (f_thal, the fraction of thalamic neurons without recurrent input)
  criterion: The recurrent thalamic weights are not specified in the paper; this claim cannot be
    tested without choosing them, which the author records as methods_underspecified unless a
    choice is defensible. If run, reproduced when the benefit (random over structured median error)
    falls as f_thal decreases.
- id: figs5ef-bptt-corticothalamic
  statement: Models whose corticothalamic weights are updated by BPTT outperform models with fixed
    corticothalamic weights of any structure.
  source: Results, Subspace-aligned corticothalamic connectivity outperforms random corticothalamic
