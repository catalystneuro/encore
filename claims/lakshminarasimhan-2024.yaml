- id: fig6c-wm-leading-pcs-drive-choice
  statement: In the working memory task, the leading PCs of ALM activity have a large influence on the
    readout of choice.
  source: Results, Data are consistent with model predictions, paragraph 3; Figure 6C (blue)
  quote: In mice performing the working memory task, leading PCs of the frontal cortex activity had a
    large influence on the animal ... behavioral choice
  criterion: Methods W1 to W8; alignment of the readout with each of PCs 1 to 16 per session, mean
