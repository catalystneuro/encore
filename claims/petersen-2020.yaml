    p: 8.0e-5
    n: 10 sessions, 4 rats
  - about: post against cooling
    test: sign rank test
    p: 0.00032
    n: 10 sessions, 4 rats
  - about: pre against post
    test: sign rank test
    p: 0.79
    n: 10 sessions, 4 rats
  depends_on:
  - fig5d-ccg-period
  criterion: The legend prints "P = 8.0 −5", read as 8.0e-5. The time lag tau of a pair is its
    theta-scale lag, the peak of the smoothed cross-correlogram of fig5d. Which peak is open;
    readings, (a) the largest peak within half the LFP theta period of zero lag in that state;
    (b) the peak nearest zero lag. Lags are compared as absolute values. A P below 0.002 cannot
    come from an exact signed-rank test over 10 sessions, so the test is over pairs. Test,
    Wilcoxon signed-rank over pairs measured in both states, for pre against cooling, post
    against cooling and pre against post. Reproduced when, under one reading, cooling lags are
    longer than pre and post at P < 0.05 and pre against post gives P >= 0.05. Partially
    reproduced when one of the cooling comparisons holds. A rank-sum over all pairs of each
    state is a variant.
- id: fig5i-phase-lags-unchanged
  statement: Theta phase lags between place cell pairs were not affected by MS cooling (P > 0.24
    between all conditions).
  source: Results, MS temperature effects on theta time/phase compression of place cells
    sequences, paragraph 3; Figure 5I
  quote: In contrast, phase lags between spikes of place cell pairs were not affected by MS cooling
    ( Fig. 5i ; P > 0.24 between all conditions).
  statistics:
  - test: Wilcoxon signed rank test
    p: 0.24
    p_relation: ">"
  depends_on:
  - fig5h-time-lags-increase
  criterion: A claim of absence, on the paper's test ("P > 0.24 for all pairs; Wilcoxon signed rank
    test", Results paragraph 2). Phase lag of a pair as the time lag of fig5h on the phase axis
    (within pi of zero for reading (a)), as absolute values. Wilcoxon signed-rank over pairs
    measured in both states, for pre against cooling, cooling against post and pre against post,
    at 0.05. Reproduced when all give P >= 0.05; not reproduced when any gives P < 0.05.
- id: fig5j-fraction-active-unchanged
  statement: The fraction of place cells active in a given theta cycle was not significantly
    affected by MS cooling (P = 0.2).
  source: Results, MS temperature effects on theta time/phase compression of place cells
    sequences, paragraph 4; Figure 5J
  quote: we found that the fraction of place cells active in a given theta cycle was not
    significantly affected by MS cooling ( Fig. 5j ; P = 0.2).
  statistics:
  - about: as given in the Results
    p: 0.2
  - about: pre against cooling (legend)
    p: 0.28
  - about: post against cooling (legend)
    p: 0.006
  - about: pre against post (legend)
    p: 0.0005
  criterion: A claim of absence, judged on pre against cooling, the comparison the text and
    legend agree is not significant (the legend's post against cooling is significant and is
    reported). Theta cycles as suppl3-theta-cycle-duration, during trials of the Figure 5
    sessions; per cycle, the fraction of the session's place cells (the Results) with at least
    one spike; the legend's "all simultaneously recorded neurons" is a variant. The test is not
    named; the panel shows cumulative distributions over cycles, so the default unpaired test,
    Wilcoxon rank-sum over cycles pooled across sessions, at 0.05. Reproduced when P >= 0.05,
    not reproduced when P < 0.05. The other two comparisons are reported.
- id: fig5k-spikes-per-cycle-unchanged
  statement: The number of spikes emitted by all neurons per theta cycle was preserved during MS
    cooling (P > 0.058 between all conditions).
  source: Results, MS temperature effects on theta time/phase compression of place cells
    sequences, paragraph 4; Figure 5K
  quote: The number of spikes emitted by all neurons per theta cycle was also preserved after MS
    cooling ( Fig. 5k )
  statistics:
  - p: 0.058
    p_relation: ">"
  depends_on:
  - fig5j-fraction-active-unchanged
  criterion: A claim of absence. Cycles as fig5j-fraction-active-unchanged; per cycle, the spikes
    of all units of the session. Wilcoxon rank-sum over cycles pooled across sessions (as fig5j)
    for pre against cooling, cooling against post and pre against post, at 0.05. Reproduced when
    all give P >= 0.05, not reproduced when any gives P < 0.05.
- id: suppl1g-waveforms-unchanged
  statement: The waveforms of hippocampal action potentials were not affected by MS cooling.
  source: Results, MS cooling decreases hippocampal theta frequency and power, paragraph 3; Figure
    S1G
  quote: Finally, the waveforms of action potentials in the hippocampus ... were not affected by MS
    cooling ( Suppl. Fig. 1g ).
  criterion: A claim of absence. Figure S1G compares "unit waveforms before/after (red) and during
    (blue) MS cooling" and its inset "shows that MS cooling did not significantly affect unit
    waveforms"; the measure and test are not named. Per unit, the mean waveform on its largest
    channel in pre and post trials together and in cooling trials. Measures, trough-to-peak
    latency and peak-to-peak amplitude; default Wilcoxon signed-rank over units, at 0.05 each.
    Reproduced when neither differs; not reproduced when either does. Effect sizes are given.
- id: suppl2d-interneuron-oscillation-slows
  statement: The theta oscillation frequency of putative fast spiking interneurons decreased with
    MS cooling, as did that of pyramidal cells, by about 14% on average, and pyramidal cells
    oscillated faster than interneurons.
  source: Results, Effects of MS cooling on single neuron properties, paragraph 1; Figure S2D
  quote: Note that pyramidal neurons oscillate faster than interneurons and the theta frequency
    oscillation of both interneurons and pyramidal cells decreases with MS cooling by
    approximately 14% on average.
  expected:
  - quantity: decrease of the oscillation frequency of interneurons and pyramidal cells during
      cooling
    value: 14
    tolerance: 1.4
    unit: percent
  criterion: Oscillation frequency of the opening comment, from "all spikes occurring within
    place fields during running for pyramical cells, and across the whole maze for interneurons"
    (Figure S2D), cooling against pre. Interneuron readings as disc-interneuron-rates-decrease.
    The 14% is read (a) for each class; (b) for both classes pooled; fig4b gives about 10% for
    fp, so (a) may hold for interneurons only. Reproduced when interneuron frequency is lower
    during cooling by a Wilcoxon signed-rank over units at P < 0.05, the decrease is within
    tolerance under one reading, and median pyramidal frequency exceeds median interneuron
    frequency in pre. Partially reproduced when the decrease is significant and the rest fails.
- id: suppl1-hippocampal-temperature
  statement: In a control experiment, hippocampal temperature fell by less than 1.5 C at the
    largest MS temperature decrease (16 C), and later than the MS (MS maximum at about 45 s, time
    constant 11 s; hippocampus peak at 115 s, time constants 48 s right and 72 s left).
  source: Results, MS cooling decreases hippocampal theta frequency and power, paragraph 3;
    Figure S1H to K
  quote: "found < 1.5° C decrease in the hippocampus at the time of the largest MS temperature
    decrease (16° C) ... (maximum effect at approximately 45 s; time constant: 11 s), the mild
    temperature decrease in the hippocampus was considerably delayed (peak at 115 s; time constant
    48 s for the right hippocampus, and 72 s for the left)"
  expected:
  - quantity: largest MS temperature decrease
    value: 16
    tolerance: 1.6
    unit: C
  - quantity: time of the maximum MS cooling effect
    value: 45
    tolerance: 4.5
    unit: s
  - quantity: MS time constant
    value: 11
    tolerance: 1.1
    unit: s
  - quantity: time of the hippocampal temperature peak
    value: 115
    tolerance: 11.5
    unit: s
  - quantity: right hippocampus time constant
    value: 48
    tolerance: 4.8
    unit: s
  - quantity: left hippocampus time constant
    value: 72
    tolerance: 7.2
    unit: s
  criterion: Needs the sessions with simultaneous MS and hippocampal temperature (Figure S1H to
    K, "successive cooling sessions in a rat"). Per cooling epoch, times from cooling onset; the
    time constant is open, read as the time constant of a single exponential fitted to the fall
    from onset to the minimum (standard). Values are medians over epochs. Reproduced when the
    hippocampal decrease at the time of the MS minimum is below 1.65 C (1.5 widened by 10%), the
    hippocampal peak is later than the MS peak by more than 50 s (Figure S1J, "> 50 s delay"),
    and at least four of the six values are within tolerance. Partially reproduced when the
    first two hold.
