# Claims for Petersen & Buzsaki (2020), Cooling of medial septum reveals theta phase lag
# coordination of hippocampal cell assemblies, Neuron 107, 731-744.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-11-15, protocol pilot-15 (docs/protocol.md, Reader).
#
# Text read: the accepted author manuscript in PubMed Central (PMC7442698), full text with the
# figure legends and STAR Methods, and the Supplemental Information (Figures S1 to S6 and Table
# S1, pages 19 to 24 of the Cell Press article-plus-supplement PDF), as stored under paper/.
# Not the version of record. The text of the surface equation of the Methods (Spatial temporal
# compression) has lost its fraction bars in extraction; the readings it allows are named in
# fig5cg-compression.
#
# Code. The paper links no analysis code ("The code that support the findings of this study
# will be made available from the corresponding author upon reasonable request"). It links only
# tools (KiloSort, KilosortWrapper, phy and phy-plugins, CellExplorer, buzcode, FMA Toolbox),
# which concern spike sorting and cell classification, not the analyses below. No code was read
# for these criteria. An earlier version of this file took choices from a repository on the
# first author's GitHub that the paper does not link, and from one pilot session of the data;
# both are dropped here.
#
# Data the paper used. Adult male Long-Evans rats; five rats with cryoprobes in the medial
# septum (MS) and 64-site silicon probes in CA1 of dorsal hippocampus ran a spontaneous
# alternation task in a figure-8 ('theta') maze, 110 cm across (central arm 0 to 75 cm, then
# the left or right arm, Figure S3A). Table S1 lists MS6 to MS22, of which MS9, MS10, MS12, MS13,
# MS21 and MS22 ran in the theta maze (MS9 with a Peltier device, the others with the dry ice
# cryoprobe, which was used "in all physiological and behavioral experiments", Figure S1). A
# session is about 40 control trials, then dry ice is placed in the reservoir (cooling onset),
# then cooling trials and recovery trials; 80 to 200 trials. Measured variables: wideband
# signals at 20 kHz (Intan), spikes sorted with KiloSort and phy, units classed with CellExplorer
# as putative pyramidal cells, narrow and wide waveform interneurons; head position at 120 Hz
# (OptiTrack); MS temperature from a thermocouple on the cryoprobe; hippocampal temperature in a
# control experiment (Figure S1H to K); trial outcome (correct or error). Samples the paper
# reports: 53 sessions in 5 rats (Figures 2G to J, 4E), 21 sessions (Figures 3I, S3D), 365 place
# fields (Figure 4B), 2948 pairs in 18 sessions of 5 rats before cooling (Figure 5C), 10
# sessions of 4 rats (Figure 5H), 19 sessions with 319 interneurons and 1104 pyramidal cells
# (Figure S5G, H). The paper does not name the sessions in each set.
#
# Shared method, from the paper, used by the criteria below.
# - Trial: one run from the reward location along the central arm and one side arm (STAR
#   Methods, Memory-demanding alternation task). An error is a choice of the arm visited on the
#   previous trial.
# - States: pre (control trials before cooling onset), cooling, post (recovery). The paper fixes
#   cooling onset (dry ice placed after the control block) and its length only roughly
#   ("approximately 15 min (or corresponding to about 20 to 60 'cooling' trials)", Results; "10-12
#   minutes, corresponding to approximately 50 trials", Methods). It gives no temperature rule
#   for the end of the cooling state. Readings, (a) the trial state labels the dataset carries,
#   if any, as the authors' own split; (b) cooling is the trials that start within 12 min of
#   cooling onset; (c) the same within 10 min. Post is the trials after cooling. Every claim
#   that compares states is run under each reading available.
# - Theta: an LFP channel in CA1 filtered 4 to 10 Hz (third order Butterworth, zero phase) and
#   the Hilbert phase (Methods, Theta phase and phase precession). Which channel is open; a
#   channel in the pyramidal layer with the largest theta power is a standard choice. How trial
#   theta frequency and power are computed is open; readings, (a) the mean instantaneous
#   frequency from the Hilbert phase and the mean squared Hilbert amplitude over the trial; (b)
#   the frequency and power of the peak of the 4 to 10 Hz spectrum (spectrogram) of the trial
#   (Figure 2D, E).
# - Running: the paper restricts some measures to running ("during running", Figure S2D) but
#   gives no speed threshold. Readings, (a) all frames of the trials; (b) frames above 10 cm/s,
#   a common threshold the paper does not state.
# - MS temperature of a trial: the mean of the thermocouple trace over the trial (standard).
# - Oscillation frequency of a neuron: a 1 ms spike raster convolved with an 80-point Gaussian
#   window, its autocorrelogram, the peak between 50 and 150 ms, and the reciprocal of its lag
#   (Methods, Oscillation Frequency of Neurons). The window's width is open; MATLAB's gausswin(80)
#   default (alpha 2.5, SD about 16 ms) is the standard choice, as the analyses were run in
#   MATLAB. For place fields only spikes as the animal passed through the field (Methods).
# - Place fields of Figures 3 and 4 were "manually defined" (spatially tuned firing, phase
#   precession, peak rate above 10 Hz); this cannot be repeated exactly. Readings, (a) field
#   boundaries the dataset holds, if any; (b) the automatic rule of Figure 5 (at least 4 bins
#   above 10% of the peak rate in the maze, peak rate above 8 Hz, spatial coherence above 0.6)
#   with a peak rate above 10 Hz. Maps on the linearized maze, bins of 3 to 5 cm (Methods,
#   Place cell analysis; 3 and 5 cm are both run), left and right runs apart (Figure 3A, B).
# - fLFP of a field: the LFP theta frequency while the animal is in the field; readings, (a) the
#   mean instantaneous theta frequency at the field's spikes; (b) the same over the time in the
#   field.
# - Correlations are reported as R with regression slopes (Figure 4A); Pearson's R (MATLAB's
#   corr default) is reading (a) and Spearman's (b).
# - Tests, unless the paper names one: "non-parametric two-tailed Wilcoxon rank-sum ...,
#   Wilcoxon signed-rank or Kruskal-Wallis" (Methods, Statistical Analyses); signed-rank for
#   paired values, rank-sum for unpaired.
#
# Not given claims: Figure S1B and S1F (single sessions illustrating the Peltier device and the
# physiological range of brain temperature), Figure S4 (place field skewness and phase measures,
# no finding stated) and Figure S6 (a model).
#
# Changes from the previous version (2026-10-19). Rewritten to the current protocol from the
# full text with the supplement, which the previous version lacked. Session sets, thresholds
# and windows chosen from the data or from unlinked code are removed; every method is now from
# the paper or named as open with readings. Ids kept where the finding is the same. The Figure 5
# criteria now use the surface fit of the Methods for compression and period. New claims are
# suppl2ab-rates-correlated,
# fig4f-speed-theta-power, suppl2e-trial-speed-theta-frequency, suppl3-theta-cycle-duration,
# suppl3e-precession-temperature, fig5e-phase-period-below-2pi, suppl5gh-rates-follow-temperature
# and suppl5j-errors-best-theta-frequency. fig6e-errors-recover gains the P < 1e-7 of Figure
# 6E; fig5j-fraction-active-unchanged gains the legend's three P values; suppl2d now carries the
# 14% of Figure S2D; suppl1-hippocampal-temperature gains the time constants. The dataset key is
# dropped, as a paper's own claims file leaves it out.
schema_version: 2
paper: doi:10.1016/j.neuron.2020.05.023
claims:
- id: session-structure
  statement: A session holds about 40 control trials, then about 20 to 60 cooling trials and 20
    to 80 recovery trials, 80 to 200 trials in all with a mean of 150.
  source: Results, MS cooling decreases hippocampal theta frequency and power, paragraph 2; STAR
    Methods, Electrophysiological Recordings
  quote: After a block of control trials (~ 40 trials), dry ice was placed into the reservoir ...
    about 20 to 60 'cooling' trials), followed by recovery trials (20 to 80).
  expected:
  - quantity: mean number of trials per session
    value: 150
    tolerance: 15
  - quantity: typical number of control trials before cooling onset
    value: 40
    tolerance: 4
  criterion: Over the sessions of the theta maze with cooling; the Methods give the range of
    80 to 200 trials and the mean of 150. Reproduced when the
    mean number of trials is within tolerance, every session has 72 to 220 trials (80 to 200
    widened by 10%), the median number of pre trials is within tolerance of 40, and, under one
    state reading, the median numbers of cooling and post trials are within 18 to 66 and 18 to
    88. Partially reproduced when the mean holds and one other part fails.
- id: cooling-time-course
  statement: MS cooling typically peaked about 60 s after its onset and lasted about 10 to 12
    minutes, about 50 trials.
  source: STAR Methods, Electrophysiological Recordings
  quote: The cooling typically peaked after about 60 sec after the cooling onset ( suppl. fig. 1G )
    and lasted for about 10–12 minutes, corresponding to approximately 50 trials
  expected:
  - quantity: time from cooling onset to the minimum MS temperature
    value: 60
    tolerance: 6
    unit: s
  - quantity: number of trials during cooling
    value: 50
    tolerance: 5
  criterion: Per session with an MS temperature trace. Cooling onset is the placement of dry ice;
    the paper gives no rule to find it in the trace, so it is the time stamp of onset if the
    dataset holds one, else the first time after the control block that the temperature falls
    1 C below the median of the pre trials (a standard choice). The peak is the minimum of the
    trace in the 5 minutes after onset (standard; Figure 2D shows the trough within minutes). The
    paper does not define the end of cooling; readings for the duration, (a) the time until the
    temperature is again within 1 C of the pre median; (b) the length of the cooling state as
    labelled in the dataset. The Results give "maximum effect at approximately 45 s" for the
    control experiment (see suppl1-hippocampal-temperature), so a median time to minimum within
    40.5 to 66 s (45 and 60 widened by 10%) also counts. Reproduced when the median time to
    minimum is within that range and, under one reading, the median duration is within 9 to
    13.2 minutes and the median number of cooling trials within tolerance. Partially reproduced
    when one or two of the three hold.
- id: fig2g-theta-freq-temperature
  statement: Theta frequency decreased linearly with MS temperature, down to 20 C (R = 0.81, P =
    5.4e-48).
  source: Results, MS cooling decreases hippocampal theta frequency and power, paragraph 2;
    Figure 2G
  quote: Theta frequency decreased linearly with MS temperature ( Figure 2g ; down to 20° C; R =
    0.81; P = 5.4 × 10 −48 )
  statistics:
  - statistic: R = 0.81
    p: 5.4e-48
    n: 53 sessions in 5 rats
  expected:
  - quantity: R of theta frequency and MS temperature
    value: 0.81
    tolerance: 0.081
  criterion: Figure 2G shows "Group data for all sessions and subjects (mean values with SE)"
    over 53 sessions in 5 rats; the unit of the correlation is not stated. A Pearson R of 0.81
    with P = 5.4e-48 implies about 170 points, so the points are not single trials pooled over
    53 sessions (several thousand). Readings, (a) trials aligned on cooling onset (as Figure 6A
    and C) and averaged over sessions at each aligned trial, R between the mean temperature and
    the mean theta frequency over aligned trials; (b) the same with temperature binned (1 C
    bins, standard) and R over all trials pooled with bin means as a variant; (c) all trials
    pooled. Each theta reading of the opening comment is run. Reproduced when, under one reading,
    R is within tolerance with P < 1e-10. Partially reproduced when R is positive with P < 0.05
    under every reading but within tolerance under none. The number of points of the matching
    reading is given.
- id: fig2h-theta-power-temperature
  statement: Theta power also decreased with MS temperature, less tightly than frequency (R =
    0.54, P = 1.2e-16).
  source: Results, MS cooling decreases hippocampal theta frequency and power, paragraph 2;
    Figure 2H
  quote: this relationship was more consistent across animals than the effect on theta power (R =
    0.54; P = 1.2 × 10 −16 ; Fig. 2g , h )
  statistics:
  - statistic: R = 0.54
    p: 1.2e-16
    n: 53 sessions in 5 rats
  expected:
  - quantity: R of theta power and MS temperature
    value: 0.54
    tolerance: 0.054
  criterion: As fig2g-theta-freq-temperature, with trial theta power, and the same readings
    (this P implies about 190 points). Whether power is normalised per session before averaging
    is open; readings, raw power and power divided by the session's mean pre power (Figure 2D
    "Color scale is normalized"). Reproduced when, under one reading, R is within tolerance
    with P < 1e-5 and below the frequency R of fig2g under the same reading. Partially
    reproduced when R is positive with P < 0.05 but outside tolerance.
- id: fig2j-frequency-consistent-across-animals
  statement: The relationship of theta frequency with MS temperature was more consistent across
    animals than that of theta power.
  source: Results, MS cooling decreases hippocampal theta frequency and power, paragraph 2;
    Figure 2J
  quote: Theta frequency decreased linearly with MS temperature ... and this relationship was more
    consistent across animals than the effect on theta power
  depends_on:
  - fig2g-theta-freq-temperature
  - fig2h-theta-power-temperature
  criterion: Figure 2J gives "R and P values for theta frequency and power in individual rats".
    Per rat, R of frequency and of power with MS temperature computed as in fig2g under the
    reading that matched there, over that rat's sessions. The paper does not say how consistency
    is measured; readings, (a) the range of R over rats; (b) the standard deviation of R over
    rats; (c) the number of rats with P < 0.05. Reproduced when every rat has a positive
    frequency R with P < 0.05 and, under one reading, frequency is more consistent than power.
    Partially reproduced when only one of the two holds.
- id: fig2i-theta-pre-cooling-post
  statement: MS cooling induced a fast and reversible decrease of hippocampal theta frequency and
    power, lower during cooling than before and after it.
  source: Results, MS cooling decreases hippocampal theta frequency and power, paragraph 2; Figure
    2I
  quote: MS cooling induced fast and reversible change in the frequency and power of hippocampal
    theta oscillations
  criterion: Figure 2I, "Group data for theta frequency and power before, during and after MS
    cooling", 53 sessions in 5 rats; no test is printed. Per session, the mean over trials of
    theta frequency and power in each state; the paper's default paired test, Wilcoxon
    signed-rank over sessions, of cooling against pre and cooling against post. Reproduced
    when, under one state and theta reading, all four tests show cooling lower at P < 0.05;
    partially reproduced when the two frequency tests do and a power test does not.
- id: disc-theta-frequency-12-percent
  statement: During MS cooling LFP theta frequency decreased by about 12%.
  source: Discussion, Theta phase organization of hippocampal cell assemblies, paragraph 5;
    Results, MS temperature effects on theta time/phase compression, paragraph 4
  quote: During MS cooling, LFP theta frequency decreased by 12 %
  expected:
  - quantity: decrease of theta frequency during cooling
    value: 12
    tolerance: 1.2
    unit: percent
  criterion: The paper does not say how the 12% is computed. Readings, (a) the mean over
    sessions of 100 (1 - cooling / pre) of the session means of trial theta frequency; (b) the
    same with the mean of pre and post as the reference; (c) the largest decrease of the
    aligned mean series of Figure 6C (trials aligned on cooling onset, averaged over sessions)
    relative to its pre mean. Under each state and theta reading. Reproduced when one reading
    is within tolerance; partially reproduced when every reading shows a decrease but none is
    within tolerance. The decrease of fLFP within place fields is in fig4b-fp-flfp-decrease
    (8.4 to 7.7 Hz, about 8%).
- id: fig6d-errors-increase
  statement: MS cooling increased choice errors about 3-fold, within each rat (P < 0.05 for all
    animals) and across all animals (P = 1e-6).
  source: Results, MS cooling increases behavioral errors, paragraph 1; Figure 6D and 6E
  quote: Overall, the number of memory errors increased approximately 3-fold, assessed either
    within rats (P < 0.05 for all animals) or across all animals (P = 10 −6
  statistics:
  - about: within each rat
    p: 0.05
    p_relation: "<"
  - about: across all animals
    p: 1.0e-6
  - about: boxplots over all sessions (Figure 6E, marked **)
    p: 1.0e-7
    p_relation: "<"
  expected:
  - quantity: ratio of the error rate during cooling to the control error rate
    value: 3.0
    tolerance: 0.3
  criterion: Error rate is the percentage of error trials in a state, per session. The control
    for the ratio is open; readings, (a) pre; (b) pre and post combined. The ratio is open as
    well; readings, (i) the mean cooling rate over the mean control rate; (ii) the median over
    sessions of the per-session ratio (sessions with a control rate above 0). Tests are not
    named; the default paired test, Wilcoxon signed-rank over sessions of cooling against
    control. Within a rat, an exact signed-rank test over fewer than 6 sessions cannot reach P <
    0.05, so a rat with fewer sessions is tested with a Wilcoxon rank-sum over its trials of
    the 0 or 1 error outcome, cooling against control. Reproduced when, under one reading, the
    ratio is within tolerance, the test over sessions gives P < 1e-5, and every rat gives P <
    0.05. Partially reproduced when the increase is significant over sessions but the ratio or a
    rat fails.
- id: fig6e-errors-recover
  statement: The error rate after cooling did not differ from the error rate before it.
  source: Figure 6E (marked ns)
  quote: Choice errors shown as boxplots constructed from all sessions. ** P < 10 −7 ns =
    nonsignificant.
  criterion: A claim of absence. Figure 6E marks one comparison ns; with pre, cooling and post
    shown and cooling marked ** against control, the ns is read as pre against post. The test is
    not named; the default paired test, Wilcoxon signed-rank over sessions of post against pre
    error rates, at 0.05. Reproduced when P >= 0.05, not reproduced when P < 0.05; the median
    difference is given either way.
- id: fig6c-worst-trials-4-to-8
  statement: The worst memory performance occurred between trials 4 and 8 after the onset of
    cooling, when MS temperature reached its minimum, together with the largest decreases of
    theta frequency and power.
  source: Results, MS cooling increases behavioral errors, paragraph 1; Figure 6C
  quote: The worst memory performance occurred between trials 4 and 8 after MS cooling, when the MS
    temperature reached its minimum, accompanied by the largest decreases of theta frequency and
    power
  criterion: Trials aligned on cooling onset (Figure 6A, "Vertical line marks the onset of
    cooling"), the first trial after onset is trial 1. Per aligned trial, the error incidence
    (fraction of sessions with an error) and the means of MS temperature, theta frequency and
    power over sessions (Figure 6C, "mean of all sessions"). Whether the error series is
    smoothed is open; readings, (a) no smoothing; (b) a 5-trial moving mean (standard).
    Reproduced when, under one reading, the maximum of the error series over trials 1 to 40 is
    at trials 4 to 8 and the minima of temperature, frequency and power fall within trials 2 to
    10. Partially reproduced when the error maximum holds and one minimum is outside.
- id: fig6f-errors-temperature
  statement: The incidence of errors correlated negatively with MS temperature (R = -0.35, P <
    0.01, all animals).
  source: Results, MS cooling increases behavioral errors, paragraph 1; Figure 6F and 6J
  quote: The incidence of errors negatively and significantly correlated with temperature change
    (R = − 0.35; P < 0.01; all animals)
  statistics:
  - statistic: R = − 0.35
    p: 0.01
    p_relation: "<"
    n: all animals
  expected:
  - quantity: R of error incidence and MS temperature
    value: -0.35
    tolerance: 0.035
  criterion: The unit of the correlation is not stated (Figure 6F, "Relationship between memory
    errors and temperature", with standard errors). Readings, (a) over aligned trials, the error
    incidence and the mean temperature across sessions (as fig6c, unsmoothed and smoothed); (b)
    over all trials pooled, the 0 or 1 error outcome and the trial temperature; (c) per rat, as
    (a) over that rat's sessions (Figure 6J). "All animals" is read as pooled for (a) and (b);
    for (c) every rat must show it. Reproduced when, under one reading, R is within tolerance
    and P < 0.01. Partially reproduced when R is negative with P < 0.01 under one reading and
    none is within tolerance. Per-rat R and P are given.
- id: fig6g-errors-theta-frequency
  statement: The incidence of errors correlated negatively with theta frequency (R = -0.35, P <
    0.01, all animals).
  source: Results, MS cooling increases behavioral errors, paragraph 1; Figure 6G and 6J
  quote: The incidence of errors negatively and significantly correlated with ... theta frequency
    (R = − 0.35; P < 0.01; all animals)
  statistics:
  - statistic: R = − 0.35
    p: 0.01
    p_relation: "<"
    n: all animals
  expected:
  - quantity: R of error incidence and theta frequency
    value: -0.35
    tolerance: 0.035
  depends_on:
  - fig6f-errors-temperature
  criterion: The readings of fig6f-errors-temperature with trial theta frequency (the theta
    shift of Figure 6A, a difference from pre, gives the same R over aligned trials). Same
    rule.
- id: fig6h-errors-theta-power
  statement: The incidence of errors correlated less with theta power; only 2 of 5 animals had a
    significant correlation.
  source: Results, MS cooling increases behavioral errors, paragraph 1; Figure 6H and 6J
  quote: and less so with theta power (only 2 of 5 animals had significant R > − 0.3; P < 0.01)
  expected:
  - quantity: animals with a significant correlation of errors and theta power
    value: 2
    tolerance: 0
  depends_on:
  - fig6f-errors-temperature
  criterion: Per rat, R of error incidence and theta power as reading (c) of
    fig6f-errors-temperature. "R > -0.3" is read as R beyond -0.3 in magnitude (R < -0.3), the
    sign the other correlations take; the other reading, R above -0.3, is shown. An animal
    counts when R < -0.3 and P < 0.01. Reproduced when 2 animals count; partially reproduced
    when 1 or 3 do.
- id: fig6i-errors-not-speed
  statement: The incidence of errors did not correlate with the running speed of the rat (R
    about 0.1, P > 0.05 for all animals).
  source: Results, MS cooling increases behavioral errors, paragraph 1; Figure 6I and 6J
  quote: and not with the running speed of the rat (R ~ 0.1; P > 0.05 for all animals
  statistics:
  - statistic: R ~ 0.1
    p: 0.05
    p_relation: ">"
    n: all animals
  depends_on:
  - fig6f-errors-temperature
  criterion: A claim of absence, judged per animal as the paper reports it. Per rat, R of error
    incidence and mean trial speed as reading (c) of fig6f-errors-temperature, at 0.05.
    Reproduced when no rat has P < 0.05; not reproduced when any does. R and P are given for
    every rat, and the pooled R.
- id: suppl5j-errors-best-theta-frequency
  statement: Error rates correlated best with theta frequency, in correlations and partial
    correlations, and had no significant relationship to running speed.
  source: Figure S5J
  quote: Partial correlation values (top) and P values (bottom) for each comparison (right panels).
    Note error rates correlate best with theta frequency and have no significant relationship to
    running speed.
  depends_on:
  - fig6f-errors-temperature
  criterion: Over aligned trials as reading (a) of fig6f-errors-temperature (Figure S5C, F, I
    are group means), R of error incidence with MS temperature, theta frequency, theta power and
    speed, and the partial correlation of errors with each controlling for the other three (the
    set controlled for is not stated; this is the reading the panel's four comparisons allow).
    Reproduced when theta frequency has the largest magnitude of partial correlation and speed
    has P >= 0.05 in both; partially reproduced when theta frequency is largest in one of the two.
- id: fig4e-speed-decreases-within-session
  statement: Running speed decreased relatively monotonically within a session, from the start to
    the end, independent of cooling.
  source: Results, Effects of MS cooling on single neuron properties, paragraph 3; Figure 6C;
    Figure S5D, E
  quote: Running speed decreased relatively monotonically within session ( Fig. 4e ; see also Fig.
    5c ).
  criterion: Figure S5E notes "monotonic deceleration of running speed over the entire session".
    Over aligned trials, the mean trial speed across sessions (Figure 6C); and per session the
    Spearman correlation of trial speed with trial number. No test is given; the default
    one-sample signed-rank of the per-session correlations against 0. Reproduced when the
    aligned mean has a negative Spearman correlation with trial number at P < 0.05, more than
    half of the sessions are negative, and the signed-rank test gives P < 0.05. Partially
    reproduced when two of the three hold.
- id: fig5-speed-control-cooling
  statement: In the sessions of Figure 5, mean running speed was 87.3 +- 8.0 in control trials
    (pre and post combined) and 86.2 +- 9.9 during MS cooling.
  source: Results, MS temperature effects on theta time/phase compression of place cells
    sequences, paragraph 2
  quote: we combined trials before and after cooling into a single control group (mean running
    speed = 87.3±8.0). During MS cooling (mean running speed = 86.2±9.9)
  expected:
  - quantity: mean running speed, control (pre and post)
    value: 87.3
    tolerance: 8.0
    unit: cm/s
  - quantity: mean running speed, cooling
    value: 86.2
    tolerance: 9.9
    unit: cm/s
  criterion: The unit is not printed; cm/s is the unit of speed throughout the paper. The
    tolerances are the paper's stated spreads. Mean over the Figure 5 sessions of the session
    mean speed, under each running reading of the opening comment; sessions are those with
    place cell pairs as in fig5d-ccg-period, readings the 18 sessions of Figure 5C and the 10
    of Figure 5H when they can be told apart. Reproduced when both values are within tolerance
    under one reading.
- id: suppl2-place-cell-rates-decrease
  statement: Within-field and peak firing rates of place cells decreased moderately during MS
    cooling (11% and 12%; P < 1e-9 and P < 1e-11).
  source: Results, Effects of MS cooling on single neuron properties, paragraph 2; Figure S2A, B
  quote: Both within-field and peak firing rates of place cells decreased moderately during MS
    cooling ( Suppl. Fig. 2 ; 11% and 12%; P < 10 −9 and P < 10 −11 , respectively
  statistics:
  - about: within-field firing rate
    p: 1.0e-9
    p_relation: "<"
  - about: peak firing rate
    p: 1.0e-11
    p_relation: "<"
  expected:
  - quantity: decrease of within-field firing rate
    value: 11
    tolerance: 1.1
    unit: percent
  - quantity: decrease of peak firing rate
    value: 12
    tolerance: 1.2
    unit: percent
  criterion: Place fields of putative pyramidal cells (place field readings of the opening
    comment). Within-field rate is the spike count in the field over the time spent in it; peak
    rate the maximum of the state's rate map in the field. Cooling against pre (Figure S2,
    "before and during MS cooling"). The percentage is open; readings, (a) the median over fields
    of the per-field decrease; (b) the decrease of the mean over fields; (c) the mean of the
    per-field decreases. The Discussion gives 12% for the within-field rate ("decreased by a
    similar proportion (12%"), so a within-field value within 10% of 12 also counts. Tests not
    named; the default Wilcoxon signed-rank over fields. Reproduced when, under one reading,
    both decreases are within tolerance and both tests give P < 1e-6; partially reproduced when
    both decreases are significant but no reading puts both within tolerance.
- id: suppl2ab-rates-correlated
  statement: Firing rates of pyramidal cells before and during MS cooling were strongly correlated
    (R = 0.7, P < 1e-58).
  source: Figure S2A, B
  quote: Firing rates of pyramidal neurons within their place fields (A) and their peak firing
    rates (B) (top) and illustration of the rate changes before and during MS cooling. R = 0.7, P
    < 10-58.
  statistics:
