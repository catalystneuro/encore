    position parts do not.
- id: fig5d-ccg-period
  statement: The theta-repeated cross-correlograms of place cell pairs had a period of about 85 ms
    before cooling, shorter than the LFP theta period (about 110 ms), and the period lengthened
    during MS cooling in each session (P = 0.002), while the period of the phase
    cross-correlograms was unaffected (P = 0.32).
  source: Figure 5D and 5F; Results, MS temperature effects on theta time/phase compression of
    place cells sequences, paragraph 2
  quote: Duration of the theta-repeated spike cross-correlograms (as in d ), calculated for each
    session, significantly increased during MS cooling ... whereas the spike phase-lag
    correlations remained unaffected (n.s., P = 0.32).
  statistics:
  - about: period of the time cross-correlograms, cooling against control (pre and post)
    test: two-sided signed rank test
    p: 0.002
  - about: period of the phase cross-correlograms, cooling against control
    p: 0.32
  expected:
  - quantity: period of the summed pair cross-correlogram before cooling
    value: 85
    tolerance: 8.5
    unit: ms
  criterion: 'Fields by the Figure 5 rule of the opening comment. Pairs are overlapping fields of
    different cells (Methods, "individual overlapping fields"). Spikes as the animal passes
    through the fields; readings, (a) each cell''s spikes within its own field; (b) both cells''
    spikes within the union of the two fields. Per pair, a cross-correlogram with 1 ms bins
    convolved with a 60-bin Gaussian window, over lags of plus and minus 400 ms (the "0.8-s
    period" of the Results); on the phase axis, 0.01 pi bins with a 60-bin window on unwrapped
    (cumulative) theta phase (standard; phase lags over several cycles need it). The period is
    taken two ways the paper gives, (i) the spacing of the peaks of the summed cross-correlogram
    of all pairs (Figure 5D, "Sum of the theta repeated spike cross-correlograms"); (ii) the
    parameter b of the surface fit of fig5cg-compression (Methods, "The compression and
    oscillation period were determined by fitting the surface equation"). Per session for
    Figure 5F; control is pre and post combined (legend). The 85 ms is read on pre ("NoCooling",
    the pairs of Figure 5C, which are pre); pre and post combined is the other reading. Session
    sets, (a) all sessions with pairs; (b) sessions with pairs in every state; the paper has 18
    and 10, and P = 0.002 is the smallest two-sided exact signed-rank P for 10 sessions, so with
    "f p decreased in each examined session" it points at 10 sessions all in one direction.
    Test, two-sided Wilcoxon signed-rank over sessions. Reproduced when, under one reading, the
    pre period is within tolerance and below 1/fLFP of the same trials, the cooling period is
    longer at P < 0.05, and the phase period does not differ (P >= 0.05). Partially reproduced
    when the lengthening holds and one other part fails.'
- id: fig5e-phase-period-below-2pi
  statement: The period of the summed phase cross-correlograms of place cell pairs was shorter
    than one theta cycle (2 pi), as place cells oscillate faster than LFP theta.
  source: Figure 5E
  quote: Similar to d but instead of time lags, within-theta phase lags between spikes were
    calculated. Vertical dashed line indicates that the oscillation frequency of the spike
    cross-correlation is faster than that of f LFP (2π).
  depends_on:
  - fig5d-ccg-period
  criterion: The summed phase cross-correlogram of fig5d-ccg-period, before cooling and during
    cooling. Reproduced when, under one reading of fig5d, the peak spacing is below 2 pi in both;
    partially reproduced when it is below 2 pi in one.
- id: fig5cg-compression
  statement: Distance-time compression of place cell pairs (0.54 cm/ms before cooling) decreased
    during MS cooling (P = 0.02), while distance-phase compression was unchanged (P = 0.92).
  source: Figure 5C and 5G; Results, MS temperature effects on theta time/phase compression of
    place cells sequences, paragraph 2
  quote: Compression index, c (cm/ms; i.e., the slope in c ), significantly decreased during MS
    cooling (* P = 0.02) but the distance/phase lag compression (cm/radian) remained unaffected (P
    = 0.92).
  statistics:
  - about: distance-time compression, cooling against control
    p: 0.02
  - about: distance-phase compression, cooling against control
    p: 0.92
  expected:
  - quantity: distance-time compression before cooling, all pairs pooled
    value: 0.54
    tolerance: 0.054
    unit: cm/ms
  depends_on:
  - fig5d-ccg-period
  criterion: 'Pairs, cross-correlograms and session readings of fig5d-ccg-period. Ltr is the
    signed distance between the two fields'' rate peaks (Methods). Per the Methods, the
    compression a and period b come from fitting a surface to "the density of points" of Figure
    5C, the pairs'' smoothed cross-correlograms placed at their Ltr. The extracted equation reads
    Z = cos(x 2 pi a b + y 2 pi b + 1) exp(-(x + f y)^2 / 2c^2) exp(-(y - g)^2 / 2d^2) e, with
    its fraction bars lost. Readings, (a) Z = e (cos(2 pi x / (a b) + 2 pi y / b) + 1)
    exp(-(x + f y)^2 / 2c^2) exp(-(y - g)^2 / 2d^2), with x the distance Ltr (cm) and y the lag
    (ms), whose ridges have slope a cm/ms and spacing b ms; (b) the same with the +1 inside the
    cosine as printed. The grid of the density (bins of lag and distance) and the start values
    of the fit are open; standard choices are 1 ms by 5 cm, with a started at the least-squares
    slope of Ltr on the pairs'' main lags and b at the period of the summed cross-correlogram.
    Phase compression is the same fit on the phase axis (cm/rad). Fit on all pre pairs pooled
    for the 0.54 (Figure 5C, 2948 pairs); per session and condition, control being pre and post
    combined, for Figure 5G. The test is not named; the default Wilcoxon signed-rank over
    sessions. Reproduced when, under one reading, the pooled pre compression is within
    tolerance, the per-session compression is lower during cooling at P < 0.05, and the phase
    compression does not differ (P >= 0.05). Partially reproduced when the decrease holds and
    one other part fails. The least-squares slope of Ltr on each pair''s main lag (fig5h) is a
    variant.'
