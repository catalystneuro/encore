    (Wilcoxon signed-rank, p < 0.05) and above CA1 slopes (Mann-Whitney, p < 0.05); partially
    reproduced when one of the two holds.
- id: fig6d-cfc-stronger-ca3
  statement: Coupling between hippocampal theta phase and LS gamma amplitude increases along the
    run for both CA1 and CA3, and is stronger for CA3-LS than for CA1-LS.
  source: Results, paragraph 9; Figure 6D
  quote: Although the strength of coupling increased in both cases, it was significantly stronger
    for CA3-LS than for CA1-LS comparisons (Figure 6D).
  criterion: Per session and position segment, the circular-linear correlation between the 4 to
    12 Hz phase of the hippocampal channel and the 50 ms RMS of the 40 to 200 Hz LS signal, with
