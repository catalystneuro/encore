  statistics:
  - test: two sample t test (the Figure 5G legend names a two-way KS test)
    p: 1.0e-20
    p_relation: "<"
  depends_on:
  - fig5-assemblies
- id: fig6c-ca3-coherence-increases
  statement: Theta phase coherence between LS and the CA3 pyramidal layer increases from the
    beginning to the end of the run, while coherence between LS and CA1 stays relatively flat.
  source: Results, paragraph 9; Figure 6C
  quote: LFP theta phase coherence between LS and CA1 pyramidal layer sites was relatively flat
    during the entire span of the tracks. In contrast, theta phase coherence between LS and CA3
    pyramidal layer increased significantly from the beginning to the end of run (Figure 6C).
  criterion: Sessions with units labelled ca3 are CA3 sessions and sessions with units labelled
    hpc are CA1 sessions; the hippocampal channel is the theta channel. Coherence is the phase
    locking of the 4 to 12 Hz phase difference between the hippocampal and the LS channel in 150 ms
    windows moved in 50 ms steps, averaged in ten position segments per session over all trials.
