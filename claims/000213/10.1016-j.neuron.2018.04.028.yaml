- id: figs7-ensemble-ls-phase-best
  statement: The firing phases of ensembles of simultaneously recorded LS neurons read out position
    better than the firing phases or rates of an equal number of hippocampal neurons (p < 0.001 at
    15 to 25 neurons).
  source: Results, paragraph 4; Figure S7; STAR Methods, ensemble position prediction
  quote: "the firing phases of ensembles of simultaneously recorded LS neurons (range: 1–53)
    provided a better readout of spatial position than either the firing phases or rates of an
    equivalent number of HPC neurons (Figure S7; two-sample t test; p < 0.001 at ensemble sizes of
    15–25 neurons)"
  statistics:
  - test: two-sample t test
    p: 0.001
    p_relation: "<"
    n: ensemble sizes of 15–25 neurons
  criterion: Per session and condition with at least 15 included LS and 15 included hippocampal
    units, for ensembles of 15, 20 and 25 (as many as available), 10 random ensembles per region;
