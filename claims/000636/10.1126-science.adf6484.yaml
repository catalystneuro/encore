  where: GitHub AllenInstitute/human_patchseq_gaba commit 5eb357a, data/LeeDalley_manuscript_metadata_v2.csv
    (Genes_Detected, Days_In_culture, condition)
  depends_on:
  - fig1b-more-genes-in-culture
  criterion: No test is reported (the fig. S1 legend is missing; the preprint shows a scatter
    plot). The consistency part is a claim of absence, judged on the test the Methods give for
    days in culture, Pearson's correlation of genes detected with Days_In_culture over culture
    cells; it holds when p >= 0.05. The elevation part holds when the median genes detected at
    every day in culture sampled exceeds the acute median. Reproduced when both hold; the
    correlation and the per-day medians are reported.
- id: fig1e-wfdc2-transcriptome-overlap
  statement: Acute and culture PVALB WFDC2 neurons overlap in transcriptomic UMAP space.
  source: Results, Morphological, electrophysiological, and transcriptomic features in the slice
    culture paradigm, paragraph 2; Figure 1E
  quote: For this transcriptomic type, the acute and culture datasets exhibited overlap in
    transcriptomic UMAP space
  data: elsewhere
  where: GitHub AllenInstitute/human_patchseq_gaba commit 5eb357a, data/complete_patchseq_data_sets1.RData
    and complete_patchseq_data_sets2.RData
  criterion: The space is the integrated transcriptomic space of the Methods (Visualization of
    integrated transcriptomic space; four groups, anchors on the tree-mapping markers, 30 PCs),
    restricted to the PVALB subclass (Fig. 1E legend). The paper gives no overlap measure, so
    the measure of fig1i-wfdc2-ephys-umap-overlap is used, on the 30 PCs and on the 2D UMAP.
    Reproduced when it holds in both.
- id: fig1h-wfdc2-morph-umap-overlap
  statement: In morphological UMAP space, culture and acute PVALB WFDC2 neurons occupy similar
    space in the PVALB-rich portion.
  source: Results, Morphological, electrophysiological, and transcriptomic features in the slice
    culture paradigm, paragraph 2; Figure 1H
  quote: dimensionality reduction of the morphological features showed that PVALB WFDC2 neurons
    from the culture and acute paradigms occupied similar space in the PVALB-rich portion of
    morphological UMAP
  data: elsewhere
  where: Brain Image Library doi:10.35077/g.892; GitHub AllenInstitute/human_patchseq_gaba commit
    5eb357a, data/LeeDalley_morpho_features.csv
  criterion: No UMAP parameters or overlap measure are given, so the measure of
    fig1i-wfdc2-ephys-umap-overlap is used on the morphology features of all reconstructed
    neurons (z-scored, missing values set to the median), with 5 neighbours as the groups are
    small (9 and 10 depth-matched cells, or all PVALB WFDC2 reconstructions as a second
    reading). The PVALB-rich part holds when most of each PVALB WFDC2 cell's 5 nearest
    neighbours among all cells are PVALB subclass cells, for most cells of each group. Both
    neighbour count and thresholds are choices. Reproduced when both parts hold in feature space
    and in a default umap-learn embedding.
- id: figs1de-mapping-unaffected
  statement: Microglial signatures do not impair mapping, as neurons of the same tree-mapped
    subclass colocalize in transcriptomic UMAP space, whether integrating by paradigm and
    microglial signature or using marker genes only.
  source: Results, Morphological, electrophysiological, and transcriptomic features in the slice
    culture paradigm, paragraph 1; fig. S1D and S1E (preprint Supplementary Figure 1D)
  quote: Microglial gene signatures did not impact the ability to accurately map transcriptomic
    types, as neurons of the same subclass defined from tree mapping colocalized when visualizing
    the transcriptome through a uniform manifold approximation projection (UMAP)
  data: elsewhere
  where: GitHub AllenInstitute/human_patchseq_gaba commit 5eb357a, data/complete_patchseq_data_sets1.RData
    and complete_patchseq_data_sets2.RData
  depends_on:
  - figs1-microglial-signature
  criterion: Two spaces, the integrated space of the Methods (Visualization of integrated
    transcriptomic space) and a space built on the tree-mapping marker genes only without
    integration (the notebook's chunk "no data integration", read at 5eb357a). No measure is
    given, so the same-subclass neighbour measure of fig2b-ephys-umap-subclasses is used, within
    each of the four groups (acute, acute microglial, culture, culture microglial). Reproduced
    when every subclass's mean same-subclass fraction exceeds its share of cells by at least 0.2
    in every group and both spaces; thresholds as in fig2b-ephys-umap-subclasses, choices.
- id: fig2a-patchseq-overlaps-snrnaseq
  statement: In Seurat-aligned transcriptomic UMAP space, the Patch-seq GABAergic neurons overlap
    with the human MTG snRNA-seq data.
  source: Results, Comparison of features across human GABAergic subclasses, paragraph 1; Figure 2A
  quote: When visualized in Seurat-aligned transcriptomic space through UMAP, the Patch-seq dataset
    overlapped with single-nucleus RNA sequencing (snRNA-seq) human MTG dataset
  data: elsewhere
  where: GitHub AllenInstitute/human_patchseq_gaba commit 5eb357a, data/complete_patchseq_data_sets1.RData
    and complete_patchseq_data_sets2.RData; Allen Brain Map human MTG snRNA-seq
    (portal.brain-map.org/atlases-and-data/rnaseq)
  criterion: The integrated space of the Methods (Visualization of integrated transcriptomic
    space). No overlap measure is given, so one is fixed here, a choice. For each Patch-seq cell,
    the subclass held by most of its 15 nearest snRNA-seq nuclei (30 PCs). Reproduced when this
    equals the tree-mapped subclass for at least 80% of Patch-seq cells; the fraction is reported
    by subclass.
- id: fig5d-dbc-morph-umap
  statement: In morphological UMAP space, DBCs of the SST CALB1 and SST ADGRG6 types cluster near
    each other.
  source: Results, Double bouquet cells, paragraph 3; Figure 5D, right
  quote: In morphological UMAP space, we saw DBCs from these two transcriptomic types cluster near
    each other with perhaps some separation at the transcriptomic-type level
  data: elsewhere
  where: Brain Image Library doi:10.35077/g.892; GitHub AllenInstitute/human_patchseq_gaba commit
    5eb357a, data/LeeDalley_morpho_features.csv and dbc_calb1_ADGRG6.csv
  criterion: No UMAP parameters are given, so a measure is fixed here, a choice. SST subclass
    reconstructions, morphology features z-scored; for each DBC, the fraction of its 5 nearest
    SST neighbours (feature space and a default umap-learn embedding) that are DBCs. Reproduced
    when the mean fraction is at least twice the DBC share of SST reconstructions in both
    spaces. The hedged separation by t-type is not judged; the fraction of each DBC's DBC
    neighbours of its own t-type is reported.
