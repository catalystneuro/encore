# Claims for Lee, Dalley et al. (2023), Science 382, eadf6484, on dandiset 000636.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23,
# protocol pilot-10 as stated in docs/protocol.md (Reader).
#
# Text read. The author manuscript of the version of record in PubMed Central (PMC12229143,
# NIHMS2006139), as text (paper/10.1126-science.adf6484.txt). It has the structured summary,
# the Results, the Discussion, the Materials and Methods and the legends of Figures 1 to 6. It
# does not have the supplementary materials: the legends of figs. S1 to S9 and Data S1 and S2
# are missing, and no PDF was supplied, so no figure could be read. The bioRxiv preprint
# (doi:10.1101/2022.11.08.515739, paper/10.1101-2022.11.08.515739.txt) was read as well. Its
# Results and legends of Supplementary Figures 1 to 5 (an earlier numbering) give some test
# names that the version of record moves to its supplement; where a quote or a method is taken
# from the preprint the claim says so. The preprint has no human versus mouse section. Claims
# that cite figs. S1 to S9 of the version of record rest on the main text sentence that cites
# them, and the features shown in Figure 2H and fig. S8B are not named in any text read.
#
# Code read. github.com/AllenInstitute/human_patchseq_gaba at commit 5eb357a (2023-11-28),
# linked under Data and materials availability. It holds one R notebook
# (scripts_gene_expression/acute_vs_culture_comparisons_update.Rmd; gene-expression analyses,
# the microglial ("immune") signature, the ion-channel gene test, DBC gene tests and the SST
# CALB1 morphology-type gene analysis), an R environment (rang) and a data folder. The data
# folder holds the per-cell metadata (LeeDalley_manuscript_metadata_v2.csv, with columns
# specimen_id_x, cell_name, Donor, structure, lobe, Transcriptomic_type,
# M_H_Hodge_cross_species_types, condition, condition2, Days_In_culture, Has_morphology,
# Has_ephys, Qualitative_morphology_type, Cortical_layer, subclass_label,
# Revised_subclass_label, Virus, Genes_Detected, marker_sum_norm_label and nwb_id), the IPFX
# feature table (LeeDalley_ephys_fx.csv, 93 feature columns, 9 of them chirp features), the
# morphology feature table (LeeDalley_morpho_features.csv), the SST CALB1 ephys table, the DBC
# calls (dbc_calb1_ADGRG6.csv), the donor table (DataS1_Donor_table.csv), the microglial genes
# (Data S2), the curated voltage-gated ion-channel list (vgic_genes.csv) and the transcriptomes
# (complete_patchseq_data_sets1/2.RData). Only the column headers of these tables were read.
# The repository has no code for the electrophysiology or morphology statistics, which the
# Methods say were run in Prism or python (statsmodels, scipy). The data README says the raw
# NWB2 electrophysiology files are at DANDI 000636.
#
# Data the paper used. Neurosurgical resections from human donors (refractory temporal lobe
# epilepsy or deep tumour), mostly temporal and frontal cortex, processed at three sites
# (Seattle, Amsterdam, Szeged). 350 um slices recorded acutely or after 2 to 16 days in
# interface culture; culture slices were transduced with the pan-GABAergic enhancer AAV CN1390
# (DLX2.0, SYFP2), and some with the VIP enhancer AAV CN2039. Whole-cell current clamp at 34 C,
# Bessel 10 kHz, sampled at 50 kHz, bias current holding the initial resting potential,
# potentials not corrected for the -14 mV junction potential. Cells kept with a seal > 1 GOhm and
# access < 20 MOhm and < 15% of input resistance; sweeps kept with bridge balance < 20 MOhm and <
# 15% of Rinput, leak 0 +/- 100 pA, rms noise < 0.07 mV (1.5 ms) and < 0.5 mV (500 ms). Stimuli
# were 1 s long squares (hyperpolarizing -10 to -90 pA, rheobase, rheobase + 40 pA, + 80 pA), 3
# ms short squares, a slow ramp and, in a subset, a logarithmic chirp. Features were extracted
# with IPFX (AP threshold, height, width at half height, fast AHP, trough, upstroke, downstroke
# and their ratio; input resistance, sag at the response closest to -100 mV, rheobase, f-I
# slope; latency, firing rate, ISI statistics, adaptation; adaptation ratios between the first
# and third spike; chirp impedance). Transcriptomes were mapped to the human MTG taxonomy
# (Hodge et al. 2019) by tree mapping; only GABAergic cells with NMS > 0.4 were kept. 778
# neurons from L2 to L6, 44 of 45 GABAergic t-types; with electrophysiology, LAMP5/PAX6 75, VIP
# 99, SST 149 and PVALB 352. SST FRZB is counted in the PVALB subclass for subclass-level
# analyses. 140 neurons were reconstructed. Mouse comparison data are the VISp Patch-seq
# GABAergic cells of Gouwens et al. 2020 (ref. 16).
#
# Where the data are. The dandiset ("Human interneuron patch-seq electrophysiology",
# acute and slice culture preparations) holds the NWB electrophysiology only. Cell labels
# (t-type, subclass, condition, days in culture, layer, region, virus, morphology type, DBC
# call) come from the code repository's tables, matched by nwb_id (claim cell-metadata-link),
# so claims using them are data with_labels. Transcriptomes are in the code repository (and,
# the paper says, NeMO); reconstructions are at the Brain Image Library (doi:10.35077/g.892);
# the MERFISH data have no location in the paper; the mouse data are cited (ref. 16) with no
# location given. Claims needing these are elsewhere or with_inputs.
#
# Method choices common to the electrophysiology claims, unless a claim says otherwise.
# Features are computed from the NWB sweeps with IPFX, as the Methods say, with the sweep QC
# above. Subclass is Revised_subclass_label (SST FRZB in PVALB). Tests are those the legends
# name (Mann-Whitney, FDR-corrected by Benjamini-Hochberg across features; Kruskal-Wallis with
# FDR correction across features and Dunn's post hoc with FDR correction). Open throughout, as
# no text read fixes it: which sweep's value stands for "AP width", "upstroke/downstroke ratio",
# "peak" or "latency" (rheobase, rheobase + 40 pA, short square or ramp); each claim names the
# readings. The 84 features are (a) the 84 non-chirp feature columns of LeeDalley_ephys_fx.csv,
# the code's own table (93 feature columns besides specimen_id, 9 of them chirp, checked at
# 5eb357a). All 93 columns are shown as a variant only, as the paper counts 84. No UMAP
# parameters are given anywhere; claims about UMAP spaces use the nearest-neighbour measures
# fixed in their criteria, on z-scored features, and say so.
schema_version: 2
dataset:
  archive: dandi
  id: "000636"
paper: doi:10.1126/science.adf6484
claims:
- id: cell-metadata-link
  kind: link
  statement: The dandiset's NWB files can be matched to the paper's per-cell metadata and
    feature tables in its code repository, and features recomputed from the files agree with
    those tables.
  source: Data and materials availability; github.com/AllenInstitute/human_patchseq_gaba commit
    5eb357a, data/README.md, LeeDalley_manuscript_metadata_v2.csv and LeeDalley_ephys_fx.csv
  data: with_labels
  criterion: Files are matched to rows of LeeDalley_manuscript_metadata_v2.csv by its nwb_id
    column (or by specimen id where the NWB metadata carry it). The link holds (reproduced) when
    at least 90% of the rows with Has_ephys true are found in the dandiset, and, for the matched
    cells, rheobase_i, input_resistance, sag and width_rheo computed here with IPFX are within
    10% of the LeeDalley_ephys_fx.csv values for at least 90% of the cells with both values. It
    is partially reproduced when the matching holds and the features agree for 50 to 90% of
    cells, and not reproduced otherwise. The number of NWB files without a metadata row is
    reported.
- id: dataset-composition
  statement: The study characterized 778 human GABAergic neurons in layers 2 to 6, covering 44 of
    the 45 GABAergic t-types, with electrophysiology from 75 LAMP5/PAX6, 99 VIP, 149 SST and 352
    PVALB neurons.
  source: Results, Comparison of features across human GABAergic subclasses, paragraphs 1 and 3
  quote: properties of 778 neurons from the four canonical GABAergic subclasses in human cortex. We
    described neurons in cortical layers 2 to 6 (L2–6) across 44 transcriptomic types ...
    LAMP5/PAX6 ( n = 75), VIP ( n = 99), SST ( n = 149), and PVALB ( n = 352)
  data: with_labels
  depends_on:
  - cell-metadata-link
  expected:
  - quantity: neurons in the study
    value: 778
    tolerance: 77.8
  - quantity: GABAergic t-types sampled
    value: 44
    tolerance: 4.4
  - quantity: LAMP5/PAX6 neurons with electrophysiology
    value: 75
    tolerance: 7.5
  - quantity: VIP neurons with electrophysiology
    value: 99
    tolerance: 9.9
  - quantity: SST neurons with electrophysiology
    value: 149
    tolerance: 14.9
  - quantity: PVALB neurons with electrophysiology
    value: 352
    tolerance: 35.2
  criterion: Counted over the dandiset's NWB files that pass the cell inclusion criteria of the
    Methods and have at least one QC-passing long square sweep, labelled through
    cell-metadata-link. The subclass counts are read two ways, as the text does not say which
    is meant, (a) Revised_subclass_label (SST FRZB in PVALB, as for subclass-level analyses) or
    (b) subclass_label. The 778 and 44 are counted over all labelled cells, as they include
    cells without electrophysiology; that the dandiset holds fewer cells than 778 is expected
    and reported. Reproduced when the four subclass counts are within tolerance under one
    reading.
- id: fig1b-more-genes-in-culture
  statement: Patch-seq neurons from slices in culture (2 to 16 days) had more genes detected than
    neurons from acute slices.
  source: Results, Morphological, electrophysiological, and transcriptomic features in the slice
    culture paradigm, paragraph 1; Figure 1B
  quote: Patch-seq neurons from culture preparations recorded at 2 to 16 days in culture (DIC) had
    significantly ( P < 0.0001) higher genes detected as compared with the acute paradigm
  statistics:
  - test: FDR-corrected Mann-Whitney test
    p: 0.0001
    p_relation: "<"
    corrected: FDR
  data: elsewhere
  where: GitHub AllenInstitute/human_patchseq_gaba commit 5eb357a, data/complete_patchseq_data_sets1.RData
    and complete_patchseq_data_sets2.RData (Genes_Detected also in LeeDalley_manuscript_metadata_v2.csv)
  criterion: Genes detected per cell, culture against acute (condition column), two-sided
    Mann-Whitney test. Reproduced when the culture median is higher at p < 0.0001.
- id: figs1-microglial-signature
  statement: Culture neurons fall into two clusters, with and without a microglial gene signature,
    and the signature is also present, less strongly, in a subset of acute neurons.
  source: Results, Morphological, electrophysiological, and transcriptomic features in the slice
    culture paradigm, paragraph 1; fig. S1B and S1C
  quote: These neurons clustered into two domains, with or without microglial gene expression
    signatures ... This microglial signature ( data S2 ) was also observed in a subset of neurons
    collected with the acute paradigm, although the effect was less pronounced
  data: elsewhere
  where: GitHub AllenInstitute/human_patchseq_gaba commit 5eb357a, data/complete_patchseq_data_sets1.RData
    and complete_patchseq_data_sets2.RData
  criterion: As in Methods (Assigning cells a microglial signature) and the notebook (chunk
    "identify immune signature cells in culture and acute"), Seurat clustering of culture cells
    at resolution 0.001 into two clusters, then of culture and acute cells separately on the
    269 culture microglial genes at resolution 0.1. Reproduced when the culture cells form two
    clusters, one with high microglial gene expression, and some acute cells are called
    microglial, with the effect less pronounced in acute cells. "Less pronounced" is not
    defined; its readings are (a) a lower fraction of acute than of culture cells called
    microglial and (b) lower mean expression of the 269 genes in acute than in culture microglial
    cells. The outcome is the one both give; blocked as methods_underspecified when they differ.
- id: fig1c-marker-expression-correlated
  statement: For the top differentially expressed genes of each GABAergic subclass, average
    expression in acute and culture neurons is strongly correlated.
  source: Results, Morphological, electrophysiological, and transcriptomic features in the slice
    culture paradigm, paragraph 1; Figure 1C
  quote: Upon examination of key differentially expressed genes responsible for GABAergic subclass
    discrimination, average gene expression was strongly correlated ( P < 0.0001), demonstrating
    alignment between acute and culture paradigms
  statistics:
  - test: correlation, test not named (Fig. 1C legend gives a regression line)
    p: 0.0001
    p_relation: "<"
    n: top 25 differentially expressed genes per subclass
  data: elsewhere
  where: GitHub AllenInstitute/human_patchseq_gaba commit 5eb357a, data/complete_patchseq_data_sets1.RData
    and complete_patchseq_data_sets2.RData
  criterion: For each subclass, the top 25 genes differentially expressed for that subclass (Fig.
    1C legend), mean expression over acute cells against mean over culture cells. The text and
    legend name no test, no expression scale and no source of the 25 genes, so these are open.
    Readings are Pearson's correlation (the Methods' test for continuous variables, stated for
    feature relationships) or Spearman's, on log2(CPM + 1) or CPM, per subclass (the four panels)
    or pooled over the 100 genes; genes ranked by differential expression in the snRNA-seq
    reference or in the Patch-seq cells. Reproduced when p < 0.0001 and r > 0 in every subclass
    (or pooled, for that reading) under all readings; blocked as methods_underspecified when
    they differ.
- id: fig1d-nms-no-difference
  statement: The normalized marker sum score does not differ between acute and culture neurons.
  source: Results, Morphological, electrophysiological, and transcriptomic features in the slice
    culture paradigm, paragraph 1; Figure 1D
  quote: we found no difference between the acute and culture paradigms ( Fig. 1D )
  statistics:
  - test: FDR-corrected Mann-Whitney test
    p: 0.05
    p_relation: ">"
    corrected: FDR
  data: elsewhere
  where: GitHub AllenInstitute/human_patchseq_gaba commit 5eb357a, data/LeeDalley_manuscript_metadata_v2.csv
    (marker_sum_norm_label)
  criterion: A claim of absence, judged on the paper's test, a two-sided Mann-Whitney test of
    NMS, acute against culture (Fig. 1D legend). Reproduced when p >= 0.05; the medians and
    the effect size are reported either way.
- id: fig1g-wfdc2-morphology-unchanged
  statement: Fifty morphological features of depth-matched PVALB WFDC2 neurons do not differ
    between culture (n = 9) and acute (n = 10) slices.
  source: Results, Morphological, electrophysiological, and transcriptomic features in the slice
    culture paradigm, paragraph 2; Figure 1G; fig. S2A
  quote: We also evaluated 50 morphological features of cortical depth–matched PVALB WFDC2 neurons (
    Fig. 1F ) from culture ( n = 9) and acute paradigms ( n = 10) and didn’t find any difference
    among the two conditions
  statistics:
  - test: FDR-corrected Mann-Whitney test
    p: 0.05
    p_relation: ">"
    corrected: FDR
    n: 9 culture and 10 acute PVALB WFDC2 neurons
  data: elsewhere
  where: Brain Image Library doi:10.35077/g.892 (reconstructions); GitHub
    AllenInstitute/human_patchseq_gaba commit 5eb357a, data/LeeDalley_morpho_features.csv
  criterion: A claim of absence, judged on the paper's test, a Mann-Whitney U test per feature
    with Benjamini-Hochberg FDR correction across the 50 features (Methods, Statistical
    analysis of variability; preprint, P > 0.05). Reproduced when no feature has FDR-corrected
    p < 0.05. Which 9 and 10 cells were depth-matched is not given; readings are (a) the cells
    with a reconstruction in the culture and acute groups, if that gives 9 and 10, and (b)
    those cells after matching soma depth, the method of matching being open.
- id: figs2b-wfdc2-ephys-43-of-84
  statement: In PVALB WFDC2 neurons, 43 of 84 electrophysiological features differ between the
    acute and culture paradigms.
  source: Results, Morphological, electrophysiological, and transcriptomic features in the slice
    culture paradigm, paragraph 2; fig. S2B; preprint, same section
  quote: Analysis of electrophysiological responses from PVALB WFDC2 neurons revealed that 43 of 84
    features differed across the two paradigms
  data: with_labels
  depends_on:
  - cell-metadata-link
  expected:
    quantity: features differing between acute and culture
    value: 43
    tolerance: 4.3
  criterion: PVALB WFDC2 cells (Transcriptomic_type) with electrophysiology, acute against culture
    (condition). Per feature a two-sided Mann-Whitney test, Benjamini-Hochberg FDR across
    features, counted at FDR-corrected p < 0.05 (preprint, "P < 0.05, false discovery rate
    (FDR)-corrected Mann–Whitney test"). The feature set is reading (a), the 84 non-chirp
    columns of LeeDalley_ephys_fx.csv; the count over all 93 columns is shown as a variant and
    does not decide the outcome, as the paper counts 84 features. Whether the microglial groups are pooled is not said;
    they are pooled, as condition has only acute and culture, and the split by condition2 is
    shown as a variant.
- id: fig1l-width-sag-differ
  statement: In PVALB WFDC2 neurons AP width and sag differ between acute and culture slices (sag
    is higher in culture), while interspike interval and input resistance do not.
  source: Results, Morphological, electrophysiological, and transcriptomic features in the slice
    culture paradigm, paragraph 2; Figure 1L; preprint Discussion, paragraph 2 (direction of sag)
  quote: AP width and sag are two of the key features that were different between the two groups (
    Fig. 1L ); however, multiple other cardinal intrinsic membrane properties, such as interspike
    interval or input resistance, were not
  statistics:
  - about: AP width and sag, acute against culture
    test: FDR-corrected Mann-Whitney test
    p: 0.0001
    p_relation: "<"
    corrected: FDR
  data: with_labels
  depends_on:
  - cell-metadata-link
  criterion: PVALB WFDC2 cells, acute against culture, two-sided Mann-Whitney tests with
    Benjamini-Hochberg FDR across the features of figs2b-wfdc2-ephys-43-of-84 (reading a).
    Reproduced when sag and AP width each differ at FDR-corrected p < 0.0001 with sag higher in
    culture, and ISI and input resistance (the absence part, judged on the same test) have
    FDR-corrected p >= 0.05. AP width is read as width_rheo, width_hero, width_short_square or
    width_ramp, and ISI as mean_isi_rheo or mean_isi_hero; the outcome is the one all readings
    give, and the claim is blocked as methods_underspecified when they differ. The direction of
    the width change is reported.
- id: figs2c-no-change-with-days
  statement: The features that differ in culture already differ at 2 days in culture and do not
    change with further days in culture.
  source: Results, Morphological, electrophysiological, and transcriptomic features in the slice
    culture paradigm, paragraph 2; fig. S2C (preprint Supplementary Figure 2C, sag and AP width
    against days in culture)
  quote: The features that were different between the two paradigms were observed at the earliest
    time point (2 DIC) and did not change with additional days in culture
  data: with_labels
  depends_on:
  - cell-metadata-link
  - fig1l-width-sag-differ
  criterion: A claim of absence, judged on the test the Methods give for continuous variables,
    Pearson's correlation of sag and of AP width with Days_In_culture over culture PVALB WFDC2
    cells (the two features the preprint's Supplementary Figure 2C plots), FDR-corrected across
    the two. Reproduced when neither correlation is significant at FDR-corrected p < 0.05 and
    the 2 DIC cells already differ from the acute median in the direction of the culture group.
    The same test over all features found in figs2b-wfdc2-ephys-43-of-84 is shown as a variant.
    The AP width readings are those of fig1l-width-sag-differ.
- id: fig1i-wfdc2-ephys-umap-overlap
  statement: In electrophysiology UMAP space of all 84 features, acute and culture PVALB WFDC2
    neurons occupy a similar space.
  source: Results, Morphological, electrophysiological, and transcriptomic features in the slice
    culture paradigm, paragraph 2; Figure 1I
  quote: When projecting all 84 electrophysiological features through the UMAP, PVALB WFDC2 neurons
    from both paradigms occupied a similar space
  data: with_labels
  depends_on:
  - cell-metadata-link
  criterion: The paper gives no UMAP parameters and no overlap measure, so one is fixed here. All
    cells with electrophysiology, features of reading (a) z-scored with missing values set to
    the feature median; for each acute PVALB WFDC2 cell, the fraction of its 15 nearest
    neighbours (Euclidean, in feature space and in a umap-learn embedding with default
    parameters) among the PVALB WFDC2 cells that are culture cells, and the same for culture
    cells. Reproduced when both groups' mean cross-group fraction is at least half of what
    random labels with the same group sizes give (median of 1000 shuffles), in both spaces. The
    neighbour count and the one-half threshold are choices, not the paper's; the fractions are
    reported against the shuffle distribution and for 10 and 30 neighbours.
- id: figs2d-seven-channel-genes
  statement: Of 114 voltage-gated ion-channel genes, only seven differ in expression between
    culture and acute neurons.
  source: Results, Morphological, electrophysiological, and transcriptomic features in the slice
    culture paradigm, paragraph 3; fig. S2D; Discussion, paragraph 2
  quote: We examined 114 voltage-gated ion-channel genes and found only seven that were different in
    culture versus acute paradigm
  data: elsewhere
  where: GitHub AllenInstitute/human_patchseq_gaba commit 5eb357a, data/complete_patchseq_data_sets1.RData,
    complete_patchseq_data_sets2.RData and vgic_genes.csv
  expected:
    quantity: voltage-gated ion-channel genes differing
    value: 7
    tolerance: 0.7
  criterion: The Methods give no test; the notebook settles it (chunks "linear model gene
    expression WFDC2" and "fold change and ion channels WFDC2"). PVALB WFDC2 cells, genes kept by
    the notebook with mean expression > 0.01, a linear model expression ~ condition + isImmune
    + condition x isImmune per gene, p-values of the condition term adjusted with R's
    p.adjust default (Holm, though the code comment says FDR), channel genes from vgic_genes.csv,
    counted at adjusted p <= 0.01. Reproduced when the count is 7 and the channel genes tested
    number about 114 (within 10%). The notebook's all-subclass model is a variant.
- id: fig2b-ephys-umap-subclasses
  statement: The four GABAergic subclasses are separable in electrophysiology feature space, with
    PVALB neurons occupying the most distinct region.
  source: Results, Comparison of features across human GABAergic subclasses, paragraph 1; Figure 2B
  quote: PVALB, SST, VIP, and LAMP5/PAX6 interneurons were separable when visualized by
    electrophysiological ( Fig. 2B ) and morphological ( Fig. 2C ) features in UMAP space, with
    PVALB neurons occupying the most distinct subregions in both UMAPs
  data: with_labels
  depends_on:
  - cell-metadata-link
  criterion: No UMAP parameters or separability measure are given, so one is fixed here. Features
    of reading (a), z-scored, missing values set to the median; for each cell the fraction of
    its 15 nearest neighbours (in feature space and in a default umap-learn embedding) of its own
    subclass. Reproduced when every subclass's mean same-subclass fraction exceeds its share of
    all cells by at least 0.2, and PVALB has the highest mean same-subclass fraction, in both
    spaces.
- id: fig2c-morph-umap-subclasses
  statement: The four subclasses are separable in morphological feature space, PVALB the most
    distinct.
  source: Results, Comparison of features across human GABAergic subclasses, paragraph 1; Figure 2C
  quote: PVALB, SST, VIP, and LAMP5/PAX6 interneurons were separable when visualized by
    electrophysiological ( Fig. 2B ) and morphological ( Fig. 2C ) features in UMAP space
  data: elsewhere
  where: Brain Image Library doi:10.35077/g.892; GitHub AllenInstitute/human_patchseq_gaba commit
    5eb357a, data/LeeDalley_morpho_features.csv
  criterion: As for fig2b-ephys-umap-subclasses, on the morphology features of the 140
    reconstructed neurons.
- id: fig2e-lamp5-shortest-extent
  statement: LAMP5/PAX6 neurons have the shortest soma-to-branch-tip Euclidean distance for both
    axon and dendrite.
  source: Results, Comparison of features across human GABAergic subclasses, paragraph 2; Figure 2E
  quote: They also had the shortest soma–to–branch tip Euclidean distance for both axon and dendrite
  statistics:
  - test: Kruskal-Wallis ANOVA on ranks, post-hoc Dunn's test
    p: 0.05
    p_relation: "<"
    corrected: FDR
  data: elsewhere
  where: Brain Image Library doi:10.35077/g.892; GitHub AllenInstitute/human_patchseq_gaba commit
    5eb357a, data/LeeDalley_morpho_features.csv
  criterion: axon_max_euclidean_distance and basal_dendrite_max_euclidean_distance by subclass,
    Kruskal-Wallis with Dunn's post hoc, FDR-corrected (Fig. 2E legend). Reproduced when the
    LAMP5/PAX6 median is the lowest of the four for both and Kruskal-Wallis is significant at
    p < 0.05.
- id: fig2f-ap-kinetics
  statement: APs of the PVALB subclass have the fastest kinetics, and LAMP5/PAX6 APs have the
    highest peak amplitude of the four subclasses.
  source: Results, Comparison of features across human GABAergic subclasses, paragraph 3; Figure 2F
  quote: APs from PVALB subclass had the fastest kinetics, whereas LAMP5/PAX6 had the highest peak
    amplitude versus other subclasses
  data: with_labels
  depends_on:
  - cell-metadata-link
  criterion: Figure 2F shows APs to a current pulse, a 3 ms pulse in the preprint, so short square
    features are the first reading; rheobase-sweep features are the second. Kinetics is read as
    AP width (width_short_square or width_rheo) and as upstroke/downstroke ratio; peak as
    peak_deltav (peak relative to threshold) of the same sweep. Kruskal-Wallis across the four
    subclasses with Dunn's post hoc, FDR-corrected (the tests of Fig. 2H). The ratio is peak
    upstroke over peak downstroke (Methods), so faster repolarization gives a lower ratio.
    Reproduced when PVALB has the narrowest width and the lowest upstroke/downstroke ratio, and
    LAMP5/PAX6 the highest
    peak, each with Dunn's p < 0.05 against every other subclass, under all readings; blocked as
    methods_underspecified when readings disagree.
- id: fig2g-sag-by-subclass
  statement: LAMP5/PAX6 and VIP neurons have minimal sag compared with PVALB and SST neurons.
  source: Results, Comparison of features across human GABAergic subclasses, paragraph 3; Figure 2G
  quote: LAMP5/PAX6 and VIP subclasses had minimal sag compared with PVALB and SST subclasses
  data: with_labels
  depends_on:
  - cell-metadata-link
  criterion: Sag as IPFX computes it at the hyperpolarizing sweep closest to -100 mV (Methods), by
    subclass, Kruskal-Wallis with Dunn's post hoc, FDR-corrected. Reproduced when the LAMP5/PAX6
    and VIP medians are both below the PVALB and SST medians and all four of those pairs differ
    at Dunn's p < 0.05.
- id: fig2h-several-features-distinct
  statement: Several additional electrophysiological features differ between the subclasses.
  source: Results, Comparison of features across human GABAergic subclasses, paragraph 3; Figure 2H
  quote: Several additional features further demonstrated the electrophysiological distinctness of
    each subclass
  statistics:
  - test: Kruskal-Wallis ANOVA on ranks, post-hoc Dunn's test
    p: 0.05
    p_relation: "<"
    corrected: FDR
