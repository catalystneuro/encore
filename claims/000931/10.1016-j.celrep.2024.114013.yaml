- id: fig5gh-mechanosensitive-as-good
  statement: A population of mechanosensitive neurons carries at least as much sniff-invariant
    concentration information as a population of sniff-insensitive neurons.
  source: Results, The distributed representation of odor concentration is sniff invariant,
    paragraph 3; Figures 5G and 5H
  quote: This analysis revealed that a population of mechanosensitive neurons carries at least as
    much sniff-invariant information as a population of only sniff-insensitive neurons (Figure
