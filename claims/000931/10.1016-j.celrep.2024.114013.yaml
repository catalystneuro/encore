  depends_on:
  - inhalation-sorting
  criterion: As fig5_cis_and_trans_decoding_of_conc.m. Per odor and for 100 pseudo-population
    samples, linear SVM of concentration (three classes) trained on slow or fast inhalations,
    tested on held-out inhalations of the same speed (cis, 10-fold CV) or of the other (trans),
