- id: fig6-simulation-mechanosensory-rescues
  statement: In a population simulated from the fitted coefficients, an inhalation-driven
    concentration change makes concentration decoding across inhalation speeds worse than within
    speed as the change grows, and adding the mechanosensory input restores decoding of the true
    concentration for any change.
  source: Results, Airflow information affords tolerance to flow-dependent concentration
    fluctuations, paragraph 1; Figures 6B and 6C; STAR Methods, Simulation of sniff-induced
    concentration changes
  quote: Consistently, decoders trained on the responses during slow and fast inhalations
    classified the odor concentration worse than decoders trained using only one inhalation speed
    as the simulated influence of the airflow on the concentration increased (Figure 6C).
    However, supplementing this population with mechanosensory responses was sufficient to reduce
    ambiguity and retrieve the actual concentration for any DIC (Figures 6B and 6C).
  depends_on:
  - fig5ef-correlated-subpopulations
  criterion: Simulated per STAR Methods, R = Poisson(a I + b Cn) with Cn = log(Ce + k I Ce), Ce
    0.01, 0.1, 1%, k from 0 to 1, a and b the linear-model coefficients of
    fig5ef-correlated-subpopulations, a set to 0 for the population without mechanosensory
    input. The Methods do not say which neurons are simulated, how negative rates are handled
    or how many events are drawn; the code (simulation_effect_of_inh_on_con_lrModel_exponential.ipynb
    with coeff_for_simulation.m) settles these and is followed for them - it simulates only
    neurons whose a or b is significant (linear-model ANOVA p-value averaged over resamples,
    p <= 0.01), draws 100 events per speed and concentration, adds the fitted intercept, and
    when a neuron has negative rates shifts them up by the minimum plus 0.025; it uses 20 k
    values from 0 to 1, 500 simulations and a 10-fold linear SVC (C 1). The code also adds
    the change as k*b*C*I on the 0.33/0.66/1 scale in place of the Methods' log form; that
    form is a variant. A variant simulating all neurons is shown. Reproduced when,
    without mechanosensory input, the mixed-speed decoder's accuracy falls below the
    within-speed decoders' as k grows (lower at k = 0.7 by more than one SD), and with it the
    mixed-speed accuracy stays within one SD of within-speed accuracy at every k.
- id: figs6h-waveforms-homogeneous
  statement: Classifiers cannot decode the experimental condition from the spike waveform
    features of the recorded units, suggesting homogeneous sampling of cell types across
    conditions.
  source: Results, Sniffing causes unstable odor responses in the PCx, paragraph 2; Figures S6G
    and S6H
  quote: The distributions of the waveform features were comparable across experiments, and
    neither crossvalidated linear nor non-linear classifiers could discriminate an experimental
    condition based on the spike waveforms of the units recorded (see STAR Methods).
  criterion: Per STAR Methods, Spike sorting and inclusion criteria, trough-to-peak latency and
    asymmetry index of each unit; cross-validated Naive Bayes and linear SVM for each pair of
    experimental conditions (AUC and accuracy). Neither the folds nor the threshold for
    "could not" is given; 10-fold CV, a standard choice, and readings (a) mean AUC minus one SD
    at or below 0.5; (b) mean AUC below 0.6 for every pair. Reproduced when a reading holds for
    every pair and both classifiers.
