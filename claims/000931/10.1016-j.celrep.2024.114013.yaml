- id: fig5d-sniff-invariant-decoding
  statement: Concentration decoders trained on one inhalation speed generalize to the other
    (trans-decoding) with performance similar to cis-decoding, both on PCs 2 and 3 and on the
    full population, so the PCx representation of concentration is sniff invariant.
  source: Results, The distributed representation of odor concentration is sniff invariant,
    paragraph 1; Figures 5D and S5F
  quote: A decoder using PCx response projections on the second and third PCs exhibited similar
    cis- and trans-decoding performances, suggesting that PCx has sniffinvariant representations
