# Claims for Dehaqani, Michelon, Patella, Petrucco, Piasini & Iurilli (2024), Cell Reports 43,
# 114013, on dandiset 000931.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23, under
# docs/protocol.md (Reader), protocol version pilot-10.
#
# Text read: the version of record (paper/10.1016-j.celrep.2024.114013.txt, extracted from the
# publisher PDF supplied by a person): main text, figure legends, STAR Methods, and the
# supplemental information (legends of Figures S1 to S6). No supplementary table exists. The PDF
# was not opened; no figure value is needed beyond the legends and the text.
#
# Dataset: DANDI 000931, "A mechanosensory feedback that uncouples external and self-generated
# sensory responses in the olfactory cortex", described as the dataset for this paper. Its data
# were not looked at.
#
# Data the paper used (STAR Methods, Mice; Odor delivery; Artificial mechanical stimulation):
# C57BL/6J mice, 6 to 9 weeks old, both sexes, head-fixed, Neuropixels 1.0 recordings in the
# anterior piriform cortex (PCx, layers 2 and 3; 22 mice in all, Figure 1B) at 30 kHz. Groups:
#  - concentration series, 4 mice: alpha-pinene and eucalyptol at 0.01, 0.1 and 1% v/v, 8 blocks
#    (Figures 2, 5, 6; 464 neurons; the GLM and pseudo-population analyses);
#  - two-concentration experiment, 2 mice: four odors at 0.01 and 0.1% v/v, 16 blocks. Pooled
#    with the 4 mice above at 0.01 and 0.1% for Figure 1 (6 mice, 660 neurons, 205
#    odor-responsive, "five odors"). The Methods list the odors inconsistently (three odors at
#    "0.01 and 1%" in the odor panel), so the author takes the odors and concentrations from the
#    files;
#  - odor identity experiment, 4 mice: four odors at one concentration (0.01%) (Figure S5E);
#  - awake mice without odor for airflow tuning and first sniffs: 10 control mice, 955 PCx
#    neurons (Figures 3D to 3F, 4D to 4G); motor cortex (MCx) neurons, 548 (Figure S4C);
#  - artificial airflow, 3 tracheostomized mice under urethane: 150 ms suction pulses of
#    odorless air at 50, 100, 150, 200 and 250 ml/min, 252 neurons (Figures 3A to 3C, S3A, S3B);
#  - bulbectomy, 4 awake mice, 153 PCx neurons (Figures 4, S4);
#  - anterior ethmoidal nerve (AEN) neurectomy, 5 mice, 752 neurons (Figures S3C to S3E).
# Signals besides spikes: nasal airflow from a flow sensor in the nose cone, odor from a
# photo-ionization detector, a TTL at each odor trial and a TTL at each detected inhalation onset,
# all at 30 kHz; odor pulses of 5 s triggered at an inhalation onset. Single units from Kilosort3
# and Phy, kept above 0.5 Hz (0.1 Hz under urethane). Inhalations are sorted into slow and fast
# ("sniff") per mouse by the clustering pipeline of STAR Methods, Inhalation clustering.
#
# Code read: iurillilab/mechano-olfactory_code, tag v1.1, commit 3bec502, from the Zenodo
# deposit the key resources table gives (doi:10.5281/zenodo.10381293; zip md5
# 0e4e72b5a207513498369615b50a9253). It holds per-panel MATLAB scripts and three Python
# notebooks (encoding angle, Figure 6 simulation). Panel letters in file names follow the
# bioRxiv preprint (code fig5_D = paper Figure 5C, code fig5_E_F = 5D, code fig5_G/H_I = 5E/5F).
# The scripts load preprocessed .mat files and call helpers that are not in the repository
# (get_aSample, get_removal_variables, get_goodAndSafe_units, the per-neuron odor-response
# statistics, the CDI values, the first-sniff test tables), so some choices remain open.
# Nothing in the code covers Figure 5G to 5I, the inhalation clustering, the phase decoding,
# Figure S2C or Figure S6H.
#
# Choices fixed for all claims, with their sources:
#  - Inhalation response: spike count in the 180 ms (or 70 ms) after inhalation onset (STAR
#    Methods, Analysis of sniff-by-sniff responses).
#  - Odor inhalations: the Methods take inhalations in a window "starting at the odor onset and
#    lasting for 5 seconds"; the code (GLM_model.m, linear_model.m) takes those from 0.4 to 5 s
#    after odor onset. The Methods window is the main reading, the code's a variant, for every
#    claim on odor inhalations. The first two trials of each odor-concentration are dropped
#    (Methods; trialsToRemove = 2 in the code).
#  - Odorless inhalations: those 13 to 4 s before an odor onset (Methods).
#  - Slow and fast labels: as the dataset gives them, produced by the paper's clustering; if the
#    dataset lacks them, the clustering of STAR Methods, Inhalation clustering, is rerun and the
#    claims depend on inhalation-sorting.
#  - Concentration regressor in the GLM and the linear model: 0 for odorless inhalations, then
#    0.33, 0.66 and 1 for 0.01, 0.1 and 1% (code, GLM_model.m and linear_model.m), which the
#    Methods describe as the log concentration scaled from 0 to 1.
schema_version: 2
dataset:
  archive: dandi
  id: "000931"
paper: doi:10.1016/j.celrep.2024.114013
claims:
- id: inhalation-sorting
  statement: Inhalation durations appear bimodal, and a Gaussian-mixture and hierarchical
    clustering of inhalation waveforms sorts them into slow and fast inhalations; fast
    inhalations are shorter and have steeper airflow changes than slow ones.
  source: Results, Sniffing causes unstable odor responses in the PCx, paragraph 1; Figure 1C;
    STAR Methods, Inhalation clustering
  quote: Since the distribution of inhalation durations appeared bimodal, we developed a
    semi-unsupervised method that sorted inhalations into slow and fast depending on their airflow
    rate waveforms ... Fast inhalations had shorter duration and steeper changes in airflow rate
    than slow inhalations.
  expected:
  - quantity: accuracy of the clustering on held-out mice (leave-one-mouse-out, eight mice)
    value: 98
    tolerance: 9.8
    unit: percent
  criterion: Per STAR Methods, Analysis of the breathing signal and Inhalation clustering (the
    code does not hold this step). Breathing signal band-passed 0.5 to 50 Hz, smoothed with a
    Gaussian of SD 25 ms; peaks at local minima, peaks closer than 65 ms to the next dropped;
    onset and offset at the zero crossings around the peak. Waveforms of 100 ms centred on the
    peak, normalised by their 2-norm, PCA to the fewest PCs explaining 98% of variance, GMM
    (full covariance, regularisation 0.05, 15 replicates, 10,000 iterations) with the number of
    clusters by the Calinski-Harabasz index, centroids merged by a correlation-distance
    hierarchical dendrogram into two clusters, the one with shorter mean inhalation length
    named fast. Where the dataset gives slow and fast labels, they are compared with this
    output (fraction of agreement reported). Reproduced when, in every mouse, the fast class
    has a shorter median inhalation length and steeper negative and positive inhalation slopes
    (10% to 90% of peak amplitude, Methods) than the slow class, and the leave-one-mouse-out
    accuracy is within tolerance. Open, and named as readings, is how the dendrogram is cut
    when it gives three clusters ("two clusters were similar and stemmed from the same branch"
    was decided by visual inspection) - (a) merge the two clusters sharing the nearest parent;
    (b) cut the dendrogram at two clusters. Which eight mice formed the cross-validation is not
    stated; all awake mice with breathing are used, and the eight-mouse sets are a variant
    when the count differs.
- id: figs1a-phase-decoding
  statement: PCx population activity encodes the inhalation phase; a cross-validated support
    vector regression predicts the phase above a shuffle null in individual mice.
  source: Results, Sniffing causes unstable odor responses in the PCx, paragraph 3; Figures 1E
    and S1A
  quote: Hence, PCx activity encoded the phase and speed of each inhalation (Figures 1E and 1F;
    Figures S1A and S1B).
  depends_on:
  - inhalation-sorting
  criterion: Per STAR Methods, Inhalation phase decoding. Firing rates from spikes smoothed with
    a Gaussian of SD 20 ms, downsampled to 10 ms bins; mice with at least 20 PCx neurons; PCs up
    to a cumulative explained variance above 0.5 (at least two); phase in [0, 1] linearly from
    onset to offset of each sorted inhalation; non-overlapping epochs of 30 s of concatenated
    inhalation periods, all ordered pairs of epochs as train and test; SVR with scikit-learn
    defaults (RBF kernel); score the squared Pearson correlation, averaged over pairs; null from
    shuffling the phase array before prediction. Reproduced when in every mouse the R2 exceeds
    the 95th percentile of its null; partially reproduced when that holds in most mice. The
    number of shuffles is not given; 1000 is used, a standard choice that does not change the
    outcome.
- id: figs1b-speed-decoding-single-mice
  statement: The inhalation speed (fast against slow) can be decoded above chance from the mean
    firing rate in the first 180 ms of inhalation in individual mice.
  source: Figure S1B; Results, Sniffing causes unstable odor responses in the PCx, paragraph 3
  quote: Decoding the inhalation speed (fast versus slow) using the mean firing rate in the early
    180 ms of inhalation in individual mice.
  depends_on:
  - inhalation-sorting
  criterion: Per STAR Methods, Inhalation speed decoding, and decoding_of_inh_type_control.m and
    decoding_of_inh_type_control_single_mice.m. Odorless inhalations, 180 ms spike counts, a
    sample of 400 inhalations balanced between slow and fast, linear SVM (libsvm through the
    Neural Decoding Toolbox), 10-fold cross-validation, z-scoring with training-set statistics,
    100 resampling runs and 100 draws of inhalations. Whether 400 is the total or the count per
    class is open; readings (a) 200 slow and 200 fast, (b) 400 of each. Reproduced when in every
    mouse the mean accuracy minus one SD exceeds the 50% chance level (the panel shows mean and
    SD with the chance line).
- id: fig1-odor-responsive-fraction
  statement: Of 660 PCx neurons in six mice, 31.1% (205) reliably respond to at least one odor
    concentration.
  source: Results, Sniffing causes unstable odor responses in the PCx, paragraph 3; Figure 1H
    legend
  quote: Of the recorded neurons, 31.1% reliably responded to at least one odor concentration
    (205 of 660 neurons; six mice).
  expected:
  - quantity: odor-responsive neurons
    value: 205
    tolerance: 20.5
    unit: neurons
  - quantity: recorded neurons in the six mice
    value: 660
    tolerance: 66
    unit: neurons
  - quantity: fraction of neurons odor-responsive
    value: 31.1
    tolerance: 3.11
    unit: percent
  criterion: Neurons of the six mice with 0.01 and 0.1% concentrations, kept as in STAR Methods,
    Spike sorting and inclusion criteria (above 0.5 Hz). A neuron is odor-responsive when, for
    any odor at 0.01 or 0.1%, a Wilcoxon signed-rank test (Figure 1H legend) is significant at
    p < 0.05 after Benjamini-Hochberg adjustment; the code (fig1_H_I_mech_induced_change_olf_resp.m)
    adjusts across the odor-concentration tests of each neuron and calls the neuron responsive
    if any adjusted p < 0.05. The paired values of the signed-rank test are not stated, and the
    code loads them precomputed ("odorStatistics_wholeStimulus", a "greater" test). Readings
    (a) per trial, the spike count over the whole 5 s odor period against the same-length
    period before odor onset, one-sided (odor greater); (b) as (a), two-sided; (c) per trial,
    the mean 180 ms inhalation response during the odor against the mean over odorless
    inhalations of that trial, one-sided. Reproduced when one reading gives counts within
    tolerance.
- id: fig1hi-sniff-changes-responses
  statement: In 72.2% of odor-responsive neurons (148 of 205) the response amplitude during
    inhalation depends on how fast the animal inhales, more than expected by chance.
  source: Results, Sniffing causes unstable odor responses in the PCx, paragraph 3; Figures 1H
    and 1I
  quote: Strikingly, how fast an animal inhaled influenced the response amplitude during
    inhalation in 72.2% of those neurons (148 of 205 neurons; Figures 1G–1I).
  depends_on:
  - fig1-odor-responsive-fraction
  expected:
  - quantity: odor-responsive neurons with at least one response differing between fast and slow
      inhalations
    value: 148
    tolerance: 14.8
    unit: neurons
  - quantity: fraction of odor-responsive neurons
    value: 72.2
    tolerance: 7.22
    unit: percent
  - quantity: odor-concentration responses of odor-responsive neurons tested
    value: 750
    tolerance: 75
    unit: responses
  criterion: Per the Figure 1H legend and fig1_H_I_mech_induced_change_olf_resp.m. For every
    odor-responsive neuron and every odor and concentration (0.01, 0.1%) for which its adjusted
    p < 0.05, the mean firing rate in 180 ms after onset of each fast and each slow odor
    inhalation; two-sided Wilcoxon rank-sum test, fast against slow, at p <= 0.01. A neuron
    counts when any of its responses differs. Figure 1I compares the count of differing
    responses with a null from 1000 shuffles of the slow and fast labels; reproduced when the
    counts are within tolerance and the observed number of differing responses exceeds the
    95th percentile of the shuffle null (the paper gives no p-value for Figure 1I); whether it
    exceeds every shuffle is reported. The odor-inhalation window follows the Methods
    (0 to 5 s), with the code's 0.4 to 5 s as a variant.
- id: fig1h-direction-of-change
  statement: A faster inhalation increases 37.3% of odor responses and decreases 19.2% of them.
  source: Results, Sniffing causes unstable odor responses in the PCx, paragraph 3; Figure 1H
  quote: 'The impact of a faster inhalation was not uniform across odor responses: 37.3% of the
    odor responses increased with a rapid inhalation, whereas 19.2% decreased in amplitude.'
  depends_on:
  - fig1hi-sniff-changes-responses
  expected:
  - quantity: odor-concentration responses larger during fast inhalations
    value: 37.3
    tolerance: 3.73
    unit: percent
  - quantity: odor-concentration responses smaller during fast inhalations
    value: 19.2
    tolerance: 1.92
    unit: percent
  criterion: As in fig1_H_I_mech_induced_change_olf_resp.m, over the same responses as
    fig1hi-sniff-changes-responses, one-sided Wilcoxon rank-sum tests at p <= 0.005 each way
    (fast greater; fast smaller), as fractions of all tested responses. A variant takes the
    sign of the mean difference among the responses that differ in the two-sided test at p <=
    0.01.
- id: figs1c-early-70ms
  statement: The sniff-driven variability in odor responses is already significant in the first
    70 ms of an inhalation.
  source: Results, Sniffing causes unstable odor responses in the PCx, paragraph 3; Figure S1C
  quote: This sniffdriven variability in odor responses was already significant during the first
    70 ms of an inhalation (Figure S1C).
  depends_on:
  - fig1-odor-responsive-fraction
  criterion: As fig1hi-sniff-changes-responses with the 70 ms window after inhalation onset
    (Figure S1C legend; two-sided rank-sum at p < 0.01; null from 1000 label shuffles).
    "Significant" is read as the observed fraction of differing responses exceeding the 95th
    percentile of the shuffle null; reproduced when it does.
- id: figs1d-rs-fs-similar
  statement: Regular-spiking (putatively excitatory or feedforward inhibitory) and fast-spiking
    (putatively feedback inhibitory) neurons show similar effects of inhalation speed on their
    odor responses.
  source: Results, Sniffing causes unstable odor responses in the PCx, paragraph 3; Figure S1D
  quote: After sorting neurons into regular spiking (RS; putatively excitatory or feedforward
    inhibitory) and fast spiking (FS; putatively feedback inhibitory), we observed similar
    effects of the inhalation speed in both types (Figure S1D).
  depends_on:
  - fig1hi-sniff-changes-responses
  expected:
  - quantity: RS neurons among the odor-responsive neurons
    value: 127
    tolerance: 12.7
    unit: neurons
  - quantity: FS neurons among the odor-responsive neurons
    value: 78
    tolerance: 7.8
    unit: neurons
  - quantity: odor-concentration responses of RS neurons (Figure S1D legend)
    value: 440
    tolerance: 44
    unit: responses
  - quantity: odor-concentration responses of FS neurons (Figure S1D legend)
    value: 310
    tolerance: 31
    unit: responses
  criterion: RS and FS units per STAR Methods, Spike sorting and inclusion criteria, k-means
    (squared Euclidean, 10,000 iterations, 2,500 replicates) per mouse on trough-to-peak
    latency, waveform asymmetry (p2 - p1)/(p2 + p1) and mean firing rate, the cluster with
    higher rate, shorter latency and larger asymmetry named FS. Per mouse and type, the
    fraction of responses enhanced by a fast inhalation, by a slow inhalation, and sniff
    invariant (rank-sum, p < 0.01, as in the legend). The paper reports no test. Readings for
    "similar" (a) for each of the three fractions, a Wilcoxon signed-rank test of RS against
    FS over the six mice gives p >= 0.05; (b) the same with a Mann-Whitney test. Reproduced
    when all three fractions pass under a reading and both types have a nonzero fraction of
    responses changed by speed.
- id: fig1j-sniff-change-larger-than-concentration
  statement: Across odor-responsive neurons, the absolute response change caused by a
    slow-to-fast switch in inhalation (at 0.01%) is larger than that caused by a tenfold
    increase in concentration (0.01 to 0.1%, slow inhalations).
  source: Results, Sniffing causes unstable odor responses in the PCx, paragraph 4; Figure 1J
  quote: On average, sniffs caused a response amplitude change bigger than that caused by a
    10-fold increase in odor concentration in the odor-responsive neurons (Figure 1J).
  statistics:
  - test: Wilcoxon signed-rank test
    p: 0.0001
    p_relation: <
    n: 477 neuron-odor pairs of odor-responsive neurons
  depends_on:
  - fig1-odor-responsive-fraction
  expected:
  - quantity: neuron-odor pairs
    value: 477
    tolerance: 47.7
    unit: pairs
  criterion: As fig1_J_slow_to_fast_change_vs_01_to_1.m. Pairs are odor-responsive neurons with
    an odor for which either concentration is responsive (adjusted p < 0.05). Per pair, mean
    rate at 0.01% fast minus 0.01% slow, and 0.1% slow minus 0.01% slow, in 180 ms after
    inhalation onset; absolute values compared by a paired Wilcoxon signed-rank test (the
    legend). Reproduced when the sniff change is larger (higher median) at p < 0.0001;
    partially reproduced when p < 0.05 only. The code's tests (two-sided rank-sum and paired t
    test) are reported as variants.
- id: fig1l-cdi-mixed-lower
  statement: Concentration discriminability (CDI) of single neurons is lower when slow and fast
    inhalations are mixed than when computed within one inhalation speed.
  source: Results, Sniffing causes unstable odor responses in the PCx, paragraph 4; Figure 1L
  quote: Combining responses from slow and fast inhalations decreased the CDI compared with
    responses observed during uniform inhalation speeds (Figure 1L).
  statistics:
  - test: Wilcoxon signed-rank test
    p: 0.0001
    p_relation: <
    n: 477 neuron-odor pairs
  depends_on:
  - fig1j-sniff-change-larger-than-concentration
  criterion: Per STAR Methods, Concentration discrimination index. For each pair of
    fig1j-sniff-change-larger-than-concentration, CDI = abs(1 - 2*auROC) of 180 ms spike counts
    at 0.01% against 0.1%, from equal-size random samples of inhalations for the two
    concentrations, 100 draws averaged, for slow, fast and mixed inhalations. The within-speed
    value is the mean of the slow and fast CDI (fig1_L_CDI_svmAcc_typeSpecific_vs_mix.m).
    Paired Wilcoxon signed-rank test of within against mixed; reproduced when mixed is lower at
    p < 0.0001, partially when p < 0.05 only. The sample size per draw and the make-up of the
    mixed sample are not given (the code loads the CDI precomputed). Readings (a) the sample
    size is the smallest count over slow and fast at both concentrations, and the mixed sample
    is half slow and half fast; (b) the same size, mixed sample drawn at random from all
    inhalations; (c) per set, the smaller count of the two concentrations. The code's tests
    (rank-sum, Kolmogorov-Smirnov) are variants.
- id: fig2-glm-variance
  statement: A regularised Poisson GLM with inhalation speed, concentration and their interaction
