- id: fig2c-interaction-small
  statement: In the GLM, the interaction between inhalation speed and concentration has a small
    effect on the odor response, while the inhalation-speed (non-olfactory) term has a larger
    additive or subtractive effect.
  source: Results, PCx neurons randomly mix olfactory and non-olfactory inputs during
    inhalations, paragraph 3; Figure 2C
  quote: The GLM analysis revealed that the interaction between inhalation speed and
    concentration response had a small effect on the odor response amplitude during an inhalation
    (Figure 2C). Instead, the non-olfactory input had a more significant additive or subtractive
    effect (Figure 2C).
  expected:
  - quantity: neuron-odor pairs
    value: 928
    tolerance: 92.8
    unit: pairs
  - quantity: neurons in the four concentration-series mice
    value: 464
    tolerance: 46.4
    unit: neurons
