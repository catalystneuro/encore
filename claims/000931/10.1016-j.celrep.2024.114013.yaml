- id: figs5gh-other-windows-and-codes
  statement: Cis- and trans-decoding results are similar with spike counts over 70 ms or 180 ms
    windows and with population vectors of 10 ms bins or phase bins over a respiratory cycle.
  source: Results, The distributed representation of odor concentration is sniff invariant,
    paragraph 1; Figures S5G and S5H
  quote: We observed similar results when the decoders used spike counts summed over 70 or 180 ms
    windows and spike counts for concatenated 10 ms or 10
  depends_on:
  - fig5d-sniff-invariant-decoding
  criterion: Feature vectors per STAR Methods, Concentration decoding (one bin of 180 ms; 18
