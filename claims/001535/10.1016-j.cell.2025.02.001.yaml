# Claims for Natraj, Seko, Abiri, Miao, Yan, Graham, Tu-Chan, Chang & Ganguly (2025), Cell 188,
# 1208-1225, on dandiset 001535.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21, protocol
# pilot-10 as stated in docs/protocol.md (Reader).
#
# Text read: the accepted author manuscript in PubMed Central (PMC11932800, NIHMS2059472), full
# text as served by ncbi_pmc (paper/10.1016-j.cell.2025.02.001.txt): Results, Discussion, STAR
# Methods, the main figure legends and the supplementary legends (Figures S1 to S9, Videos S1 to
# S4, Supplementary Method S1). It is not the version of record. The supplement is present only as
# its legends; Supplementary Method S1 (a timeline schematic) and the supplementary figures
# themselves were not read, and no PDF was supplied. No claim needs a value that appears only in a
# figure image.
#
# Code read: the paper links "exemplar real-time BCI and neural signal processing code and
# decoders" at OSF (doi:10.17605/OSF.IO/TBDWG), one file BCI/bci.zip (17742715 bytes, modified
# 2025-02-26, sha256 575149d40829d135557d17cd5247c85a0d333033467f8c25df281bef8ddb091a). It holds the
# MATLAB real-time task modules (Robot3DArrow, RealRobotBatch, RobotR2GModeSwitch and others), the
# feature pipeline (neuro/), Kalman filter code, the PyBullet robot simulator, trained decoders
# (clicker/*.mat) and scripts that fine-tune the biLSTM (task_helpers/ToTrainDiscreteModel_7DoF_LSTM.m,
# get_lstm_features.m, extract_lstm_features.m) and run the mode filter (runningMode.m). It holds no
# offline analysis code: none of the statistics of Figures 1 to 7 (autoencoders, Mahalanobis
# distances, CKA, mixed models, robust regression) is implemented there. Details the code settles
# are cited as "OSF code" in the criteria. Where it disagrees with the Methods:
#   - The RNN fine-tuning script splits segments 80% training and 20% validation; the Methods give
#     85% and 15% for the initial RNN training.
#   - RealRobotBatch/RunTrial.m names targets 1 to 7 as Right Thumb, Left Leg, Left Thumb, Right
#     Wrist, Lips, Tongue, Both Middle Fingers, while Robot3DArrow/GetParams.m places targets 1 to 7
#     at +X, +Y, -X, -Y, +Z, -Z and the origin, and the Methods map X+ to right thumb, X- to left
#     thumb, Y+ to head, Y- to left leg, Z+ to tongue, Z- to lips and the origin to both middle
#     fingers. The Methods come first; the code's names are a variant the author must check
#     against whatever labels the dataset carries.
#   - The code computes the high-gamma feature as the mean of the squared output of eight
#     third-order Butterworth band-pass filters (70 to 150 Hz), low-pass filters the LFO with a
#     fourth-order IIR at 25 Hz, resamples both from 1 kHz to 100 Hz, cuts 1000 ms segments starting
#     every 500 ms plus a 0 to 100 ms jitter, replaces channels exceeding 15 (z units) with 1e-5
#     Gaussian noise, and L2-normalizes the 128 high-gamma and 128 LFO columns separately. The
#     Methods agree in substance (256-dimensional input, down-sampling by 10, artifact replacement,
#     L2 norm of each feature matrix, segments of 800 to 1000 ms overlapping by at most 50%).
#
# The data the paper used (as the paper reports them):
#   - Participants: B1 (male, 41, right-handed, 128-channel ECoG, 8x16 grid, 4 mm spacing, left
#     sensorimotor cortex) and B3 (female, 47, 253-channel ECoG, 23x11 grid, 3 mm spacing), both
#     with tetraparesis and anarthria from brainstem stroke. Signals at 1 kHz, common median
#     referenced, z-scored to a 2 min resting baseline at the start of each session.
#   - Figure 1 (imagined movement task, no BCI control): 30 actions in B1 (49 trials per action) and
#     32 in B3 (48 trials per action); trial of 4 s text cue, 2 s red square (get ready), 4 s green
#     square (imagine), 3 s ITI. Features delta (0.5 to 4 Hz), beta (13 to 30 Hz) and high gamma
#     (70 to 150 Hz).
#   - Figure 2 to 4 (daily initialized 7-action discrete control of a virtual Jaco arm): 10
#     sessions in B1 and 11 in B3, each with OL, then CL1 (decoder from OL), then CL2 (decoder from
#     OL and CL1). Actions: right thumb (X+), left thumb (X-), head (Y+), left leg (Y-), tongue (Z+),
#     lips (Z-), both middle fingers (origin). Decoder at 5 Hz on 200 ms bins of delta, beta and
#     high-gamma power; B1 features pooled 2x2 over the grid to 96 dimensions, B3 759 dimensions,
#     each bin L2-normalized. A 9-action variant (adding wrist rotations) on two days in B1 (Figure
#     S6). A ReFit Kalman filter comparison over five days in B1 (Figure S7).
#   - Figure 5 (plug-and-play, fixed MLP): two experiments in B1 (28 and 38 days long) and one in B3
#     (39 days); online trials only.
#   - Figures 6 and 7 (B1 only): IBID continuous control of a virtual arm (center-out, diagonal,
#     path tracing), a mode-switch reach-to-grasp virtual task, and real-world Kinova Jaco tasks
#     (reach and rotate, wall task) with a fixed biLSTM decoder over up to 210 PnP days, then a
#     recalibration.
#   - The biLSTM was trained on all collected open-loop and closed-loop data from the hDoF
#     experiments, about 14 h 48 min before augmentation and segmentation, as segments of
#     low-frequency (below 25 Hz) and high-gamma activity on all 128 channels of B1.
#
# The dandiset's own description (title and description on the archive only; its files were not
# opened): long-term ECoG training trials from the 128-channel grid of one tetraplegic participant
# trying to access 7 directional targets (6 axial directions and the origin), collated from
# several BCI contexts (virtual environment, physical robot, open and closed loop), with high-gamma
# amplitude (70 to 150 Hz) and low-frequency motor potentials (below 25 Hz) down-sampled to 100 Hz.
# That is the B1 RNN training set. The Figure 1 task, B3, the 200 ms band-power features (delta,
# beta, high gamma) that the MLP and autoencoder analyses use, the online decoder outputs and the
# robot task outcomes may not be in it; which claims it can test is the author's to establish.
#
# Statements of tolerance. Where the paper gives an interval for a value, the tolerance is the
# larger of the two distances from the value to the bounds of that interval; where it gives a
# spread (plus or minus), the tolerance is that spread; otherwise 10% of the value.
#
# A paper inconsistency to note: Results, Plug-and-play control, paragraph 3 reports the same
# robust regression slope, z and p (b = 0.258, z = 6.474, p = 1.847e-10) for B1 (Figure 4F) and
# B3 (Figure 4G); one of them is likely a copy. Both are recorded; the criterion holds the slope
# value to either participant, as the paper does not say which one it belongs to.
schema_version: 2
