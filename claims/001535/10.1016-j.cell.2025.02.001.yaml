- id: fig2e-above-chance
  statement: Decoding accuracy was above chance in every OL, CL1 and CL2 session in both
    participants.
  source: Results, Discriminability of representations with closed-loop control, paragraph 1;
    Figure 2E; Figure S4A-B
  quote: decoding accuracies across trials ( Fig. 2E ) were significantly above chance (binomial
    distribution, FDR corrected, α = 0.05 level, Fig. S4A – B ) for every single session in B1 and B3
  criterion: Methods (Action decoding in the perspective of a virtual 3D Jaco arm). OL accuracy is
    cross-validated, 10 random splits of the day's OL trials into 68% training, 12% validation and
    20% test, with an MLP of one hidden layer of 120 units (leaky ReLU, dropout 0.4, L2 0.0001,
    Adam, batch 32, early stopping after six epochs without improvement in validation loss); each
    test trial is classified by the most frequent decode over the bins of its active period
    (max vote), and accuracies are averaged over splits. CL1 and CL2 accuracy is the max vote of the
    online decodes per trial. The p-value follows the Methods, the binomial distribution "for a
    decoder given the total number of trials (N) and number of trials successfully decoded (K)",
    that is Binomial(N, K/N), and p is its area from 0 to N/m successes (chance or worse), with
    m = 7; FDR (Benjamini-Hochberg) at 0.05 over all decoders (63, from 21 sessions and three
    contexts). The usual upper tail P(X >= K) under success probability 1/7 is shown as a variant.
    Reproduced when every session's three decoders pass FDR at 0.05.
