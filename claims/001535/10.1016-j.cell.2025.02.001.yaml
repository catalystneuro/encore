    Mann Whitney z cannot exceed about 6.2, below the reported 6.967; the reported test therefore
    used more values (more trials or sessions, or per-time-point errors), which the paper does not
    say. The test is run on per-trial errors as the Methods define them, and the z and p are not
    expected to match. Reproduced when p < 0.05 with the ReFit-KF median higher.
- id: fig4b-day-differences
  statement: For right thumb OL trials in B1, the mean high-gamma map is preserved across three
    days (average pairwise r = 0.88), but channel-level high-gamma means over M1/S1 differ between
    days.
  source: Results, Plug-and-play control in presence of distributional drift, paragraph 1;
    Figure 4A-B
  quote: 'Even with a preserved neural map and somatotopy (average pairwise r = 0.88 ), there was little distributional overlap between days ( Fig. 4B , permutation t – tests show significant differences in γ H mean over trials, Day 1 vs. Day 4, t ( 11 ) = 17.87 , p = 1 × 10 – 4'
  statistics:
  - about: day 1 against day 4
    test: permutation t-test
    statistic: t(11) = 17.87
    p: 1.0e-4
  - about: day 1 against day 8
    test: permutation t-test
    statistic: t(11) = 28.6
    p: 1.0e-4
  - about: day 4 against day 8
    test: permutation t-test
    statistic: t(11) = 2.93
    p: 0.0138
  expected:
    quantity: average pairwise correlation of right thumb high-gamma maps across the three days
    value: 0.88
    tolerance: 0.088
  criterion: Open details, as the paper names neither which three days (called "three random
    days"; the tests name days 1, 4 and 8), nor which channels form the M1/S1 rectangle, nor what
    the 12 observations behind t(11) are. Readings (a) days 1, 4 and 8 of the daily sessions,
    channels the dataset marks as M1/S1 hand area, a paired permutation t-test over 12 channels of
    trial-mean high gamma; (b) the same days, a two-sample permutation t-test over trials of the
    mean over those channels. Reproduced when under one reading the mean pairwise map correlation
    is within tolerance and day 1 differs from days 4 and 8 with p < 0.05; partially reproduced
    when only the differences hold. The day 4 against day 8 result is reported.
- id: fig4cd-day-decodable
  statement: The recording day can be decoded from held-out OL samples on a common multi-day
    manifold (90.96% in B1, chance 10%; 98.4% in B3, chance 9.09%).
  source: Results, Plug-and-play control in presence of distributional drift, paragraph 1;
    Figure 4C-D
  quote: 'In general, the recording day could be classified from held-out samples on the common manifold ( Fig. 4C – D B1: cross-validated decoding accuracy of 90.96% [90.68% - 91.24%], chance = 10%, B3: cross-validated decoding accuracy of 98.4% [98.24% - 98.54%], chance = 9.09%)'
  statistics:
  - about: B1 accuracy
    ci:
      low: 90.68
      high: 91.24
      unit: percent
  - about: B3 accuracy
    ci:
      low: 98.24
      high: 98.54
      unit: percent
  expected:
  - quantity: B1 day decoding accuracy
    value: 90.96
    tolerance: 0.28
    unit: percent
  - quantity: B3 day decoding accuracy
    value: 98.4
    tolerance: 0.16
    unit: percent
  criterion: Methods (Across-day drifts in centroids). OL samples of all days (about 22k), 40
    random splits of 68% training, 12% validation and 20% test; an autoencoder as in
    fig2i-distance-cl-vs-ol trained with day labels as additional class memberships; accuracy of
    the classification layer for the day of recording on test samples, averaged over splits.
    Open details. (1) How day labels enter; readings (a) the classifier layer has one unit per day,
    (b) one unit per day and action combination, scored on day. (2) Whether samples are split by
    sample or by trial; the Methods say samples, so (a) by sample, with (b) by trial shown as a
    variant. The interval tolerances are the paper's own and very narrow; the claim is reproduced
    when both accuracies are within their tolerance, and partially reproduced when both are within
    10% of the reported values and far above chance. (1) is a method detail, so the outcome is the one
    both readings give; if they differ, the claim is blocked as methods_underspecified.
- id: fig4cd-demeaned-chance
  statement: After mean-centering each day's data, the recording day can no longer be decoded
    (B1 10.03%, B3 8.77%, not different from chance).
  source: Results, Plug-and-play control in presence of distributional drift, paragraph 1;
    Figure 4C-D
  quote: 'In contrast, centering and demeaning each day’ data before building a common manifold eliminated discernibility ( Fig. 4C , B1 decoding accuracy: 10.03% [9.71% - 10.37%], chance = 10%, WSR: p = 0.282 , Fig. 4D : decoding accuracy of 8.77% [8.617% - 9.138%], chance = 9.09%, WSR: p = 0.3 )'
  statistics:
  - about: B1, against chance 10%
    test: Wilcoxon signed rank
    p: 0.282
    ci:
      low: 9.71
      high: 10.37
      unit: percent
  - about: B3, against chance 9.09%
    test: Wilcoxon signed rank
    p: 0.3
    ci:
      low: 8.617
      high: 9.138
      unit: percent
  depends_on:
  - fig4cd-day-decodable
  criterion: A claim of absence, judged on the paper's test. As fig4cd-day-decodable after
    subtracting each day's mean from its samples; a Wilcoxon signed rank test of the 40 split
    accuracies against chance (10% in B1, 9.09% in B3). Reproduced when p >= 0.05 in both
    participants; not reproduced when p < 0.05 in either. The accuracies are reported.
- id: figs8ab-day-decodable-trials
  statement: A two-layer MLP on the full feature space also decodes the recording day from
    held-out trials, significantly above chance in both participants.
  source: Results, Plug-and-play control in presence of distributional drift, paragraph 1;
    Figure S8A-B
  quote: A MLP in high-dimensional channel-feature space revealed similar significant trial-level
    decoding accuracies ( Fig. S8A – B )
  criterion: Methods (Across-day drifts, paragraph on the MLP). Trials of all days split 70/15/15
    by trial, 10 random splits; MLP with two layers of 64 units, leaky ReLU, dropout 0.4, trained
    on samples; trial-level day accuracy averaged over splits; p from the binomial (as in
    fig2e-above-chance) with the number of held-out trials and chance 1/10 (B1) or 1/11 (B3).
    Open detail. How a trial's samples give its label is not stated for this decoder; readings
    (a) max vote over the trial's samples, as for the other trial-level decoders (Methods, Action
    decoding), (b) the fraction of the trial's samples decoded correctly, averaged over trials.
    The outcome is the one both readings give; if they differ, blocked as methods_underspecified.
    Reproduced when p < 0.05 in both participants.
- id: fig4fg-sampling-days-increases-distance
  statement: Distances between actions on held-out days increase linearly with the number of
    prior days used to build the common manifold, in both participants.
  source: Results, Plug-and-play control in presence of distributional drift, paragraph 2;
    Figure 4F-G
  quote: 'we found that the pairwise distances between actions on a given day linearly increased as a function of the number of prior days used to build the common manifold (robust linear regression on median Mahalanobis distances, B1: slope b = 0.258 , z = 6.474 , p = 1.847 × 10 – 10 , Fig. 4F'
  statistics:
  - about: B1
    test: robust linear regression
    statistic: b = 0.258, z = 6.474
    p: 1.847e-10
  - about: B3, as printed (identical to B1)
    test: robust linear regression
    statistic: b = 0.258, z = 6.474
    p: 1.847e-10
  expected:
    quantity: slope of median held-out distance on days used, in the participant the printed value
      belongs to (B1 or B3)
    value: 0.258
    tolerance: 0.0258
  criterion: Methods (Across-day drifts, paragraph on cumulative days). For k = 1 to n - 1 days,
    an OL autoencoder is built on days 1 to k (as in fig2i-distance-cl-vs-ol); each held-out day
    k+1 to n is projected and its mean pairwise latent distance taken; the median over held-out
    days is regressed robustly on k. Open details. (1) The robust weighting is not named; readings
    (a) bisquare (MATLAB robustfit default), (b) Huber. (2) The statistic is called z, which
    suggests a normal approximation on 9 or 10 points; the p is taken from the fit as reported by
    the software. (3) The printed slope is identical for B1 and B3, so it belongs to one of them
    and the paper does not say which; readings (a) it is B1's, (b) it is B3's. Reproduced when both
    slopes are positive with p < 0.05 and the slope of the participant named by reading (a) or (b)
    is within tolerance (either reading may match); partially reproduced when both are positive
    and significant only. (1) is a method detail, so the outcome is the one both weightings give; if
    they differ, the claim is blocked as methods_underspecified.
