    The held-out day is not identified ("a new day distinct from the 10 daily experimental days");
    the MLP width is not given; 64 units per layer, as for the day-decoding MLP, is a standard
    choice, not the paper's, and widths 32 and 128 are shown as variants. Reproduced when the slope
    is positive with p < 0.05 and within tolerance; if the widths give different outcomes, the
    claim is blocked as methods_underspecified.
