- id: fig1ij-within-effector-levels
  statement: Actions of one effector differ in activation level at a shared channel, with a
    hand-knob electrode showing different high-gamma responses to three hand actions and a ventral
    precentral channel showing different responses to orofacial actions.
  source: Results, Mesoscale representation of body parts, paragraph 2; Figure 1I-J
  quote: 'an electrode in the ‘hand-knob’ area had significantly different γ H between three hand actions ( Fig. 1I , Fig. S1C ). Similarly, a ventral channel along the precentral gyrus 29 showed differential γ H response levels to orofacial movements ( Fig. 1J )'
  criterion: Methods (Analyses to identify significant neural responses, paragraph on Fig. 1I-J).
    At each time point a repeated measures ANOVA over trials compares the within-effector actions'
    high-gamma ERPs at one channel; clusters of contiguous significant time points are summed in F
    and compared with 750 bootstrap samples of mean-centered data (maximum cluster mass), at 0.05.
    Open details. The two channels and the three hand and the orofacial actions are shown only in
    the figure; readings (a) the channel the paper identifies as hand knob (Figure S1C) and the
    channel in ventral precentral gyrus, if the dataset labels channels, (b) every channel
    significant for the effector in fig1g, reported as the fraction with a significant cluster.
    How an rmANOVA is formed over trials of different actions is not stated (trials are not paired
    across actions); readings (a) one-way ANOVA across actions with trials as observations, (b)
    trials paired by repetition index within block. Reproduced when under every reading at least
    one cluster for the hand actions and one for the orofacial actions is significant at the
    channels of reading (a), or a majority of channels under reading (b).
- id: figs2-pairwise-distances-significant
  statement: Almost all pairwise Mahalanobis distances between actions are greater than chance
    (99.7% of pairs in B1, 100% in B3, FDR corrected).
  source: Results, Mesoscale representation of body parts, paragraph 3; Figure S2E-F
  quote: 'almost all the pairwise neural distances between movements were significantly greater than chance ( Fig. S2 , B1: 99.7% of all pairwise comparisons; B3: 100% of all comparisons, α = 0.05 level, FDR corrected)'
  expected:
  - quantity: fraction of significant pairwise distances, B1
    value: 99.7
    tolerance: 0.3
    unit: percent
  - quantity: fraction of significant pairwise distances, B3
    value: 100
    tolerance: 0.3
    unit: percent
  criterion: Methods (Representational structure analyses). Data are 200 ms non-overlapping bins
    of delta, beta and high-gamma power from 600 to 3400 ms after the go cue on all channels
    (384 features in B1, 759 in B3), temporally smoothed, z-scored per feature across all trials of
    a session, and concatenated across sessions per action. The distance is (mu_a - mu_b)' ((C_a +
    C_b)/2)^-1 (mu_a - mu_b). The null for each pair (Figure S2) fits one Gaussian to the pooled
    samples of both actions, draws as many samples, splits them in two with k-means and takes the
    distance between the clusters; the pair is significant when its distance exceeds the 95th
    percentile, after FDR (Benjamini-Hochberg) over all pairs at 0.05. Open details. The number of
    null iterations and the temporal smoothing kernel are not given; a standard choice (1000
    iterations, no extra smoothing beyond binning) is used and reported. The tolerance of 0.3
    points is one pair in B1's 435 pairs (0.23 points) rounded up, since 10% of a value near 100%
    would admit 90%. Reproduced when both fractions are within tolerance; partially reproduced
    when both are at least 90%.
