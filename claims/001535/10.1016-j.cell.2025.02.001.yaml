- id: fig1g-somatotopy-b1
  statement: In B1, high-gamma spatial maps of right-hand actions are more similar to each other
    (Jaccard coefficient) than to maps of left-hand actions and than to maps of all other actions.
  source: Results, Mesoscale representation of body parts, paragraph 2; Figure 1G
  quote: 'maps of right-hand movements were somatotopically more similar to each other 20 , 27 , 28 than to left-handed or other whole-body movements (B1, Fig. 1G , Mann Whitney U tests between Jaccard similarity coefficients: within maps of Rt. Hand movements vs. between maps of Rt. and Lt. Hand movements, z = 3.724 , p = 1.964 × 10 – 4 , within maps of Rt. Hand movements vs. between maps of Rt. Hand and All other movements z = 4.435 , p = 9.2 × 10 – 6'
  statistics:
  - about: within right hand against right hand to left hand
    test: Mann Whitney U
    statistic: z = 3.724
    p: 1.964e-4
  - about: within right hand against right hand to all other actions
    test: Mann Whitney U
    statistic: z = 4.435
    p: 9.2e-6
  criterion: Methods (Analyses to identify significant neural responses; Representational
    structure analyses). Per action, high-gamma (70 to 150 Hz, Hilbert envelope averaged over the
    eight sub-bands, 4th order Butterworth filters) is z-scored per session to the first 2 min
    baseline, epoched from 1000 ms before the get-ready cue to the end of the go period, and
    z-scored per trial to the 1000 ms before the get-ready cue; time points whose z-scored value
    across trials exceeds 3 are removed. At every channel and time point a one-sample t-test
    (threshold 0.05) is cluster corrected with 750 bootstrap samples of mean-centered trials,
    cluster mass the sum of squared t within clusters contiguous in time and channel neighbours,
    tested at 0.05. A channel belongs to an action's map when it is part of any significant
    cluster. Maps are binary vectors; the Jaccard coefficient is taken for every pair of right-hand
    maps (within), every right-hand and left-hand pair, and every right-hand and other-action pair;
    Mann Whitney U tests compare the within set with each between set. Open details, named as
    readings. (1) Channel neighbourhood for clustering, which the paper does not define; readings
    (a) 4-connected grid neighbours, (b) 8-connected grid neighbours. (2) Which actions count as
    right hand, left hand and other; the paper names them only in Figure 1E-F, so the reading is
    the action names' effector, as the dataset labels them. Reproduced when both tests give
    p < 0.05 with the within-right-hand similarity higher. Reading (1) is a method detail, so the
    outcome is the one both readings give; if they differ, the claim is blocked as
    methods_underspecified.
