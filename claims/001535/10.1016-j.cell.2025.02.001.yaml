  source: Results, Plug-and-play control in presence of distributional drift, paragraph 2;
    Figure 4I
  quote: 'in B1 trends in decoding performance assessed via linear regression, slope, b = 5.541 ± 0.966 , t ( 8 ) = 5.735 , p = 4.365 × 10 – 4'
  statistics:
  - test: linear regression slope
    statistic: b = 5.541 ± 0.966, t(8) = 5.735
    p: 4.365e-4
  expected:
    quantity: slope of held-out-day accuracy on number of training days
    value: 5.541
    tolerance: 0.966
    unit: percentage points per day
  criterion: Methods (Across-day drifts, last paragraph). A two-layer MLP in the common latent
    space classifies left thumb against both middle fingers, trained on days 1 to k (k = 1 to 10)
