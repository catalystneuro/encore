# Claims for Mallory, Hardcastle, Campbell, Attinger, Low, Raymond & Giocomo (2021), Nat Commun
# 12, 671, tested on DANDI:000053.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-11-10, protocol as stated in docs/protocol.md.
#
# Text read. The version of record (paper/10.1038-s41467-021-20936-8.txt, Europe PMC full text
# of PMC7844029), with its Methods, figure legends and the three supplementary files from the
# PMC Open Access set, the Supplementary Information (legends of Supplementary Figures 1 to 12),
# the peer review file (an editorial note only) and the reporting summary. The PDFs of the
# supplement were not opened; no claim needed a number printed only inside a figure.
#
# Code read. The Code availability statement links two MATLAB repositories.
# https://github.com/khardcastle/spline-lnp-model at commit 34b470f (2018-05-10) holds the
# spline LN Poisson model (cardinal spline regressors, spline_1d.m, spline_1d_circ.m,
# spline_2d.m; Poisson likelihood with an L2 penalty of weight 1, glm_model.m; 10-fold
# cross-validation, fit_model_kfold.m and compute_test_train_ind.m; forward search with a
# one-sided signed-rank test at 0.05 and a final signed-rank test of the selected model against
# 0, forward_search_kfold.m; log-likelihood increase over a mean rate model in bits per spike,
# compute_llh.m; the reduced-model contribution, compute_llh_increase.m) and an example script
# for position, head direction and speed (create_glm.m). https://github.com/GiocomoLab/
# ln-model-of-mec-neurons at commit 643386b (2022-06-20) is the older one-hot model of Hardcastle
# et al. 2017 (fixed 15 models, roughness penalty), which this paper's Methods do not use; it was
# read and is not followed. Neither repository holds the pitch, roll or eye variables, the
# tuning curve classification, the stability measure or the PCA clustering; for those every
# method comes from the Methods and legends. Where the code and the Methods differ, the Methods
# are followed. create_glm.m uses 3-s chunks for the folds (the Methods say 10-s sections),
# position bins of box size x 10/100 (the Methods say 15/100) and 12 head direction control
# points (the Methods say 10 bins); these code settings are variants only.
#
# Data the paper used. Freely moving dataset, tetrodes in MEC layers II/III, 20 ms bins (50 Hz
# tracking), mice foraging for 20 to 60 min in square or rectangular arenas (100 x 100, 50 x 50,
# 70 x 70 or 70 x 35 cm), sessions kept when 70% or more of the arena was covered. Cohort 1,
# 6 C57BL/6 mice (4 female, 2 male), right MEC, 179 cells, two headstage LEDs (body position B,
# body speed Bs, azimuthal head direction Ha, azimuthal head velocity) and an IMU accelerometer
# (pitch Hp, roll Hr, pitch and roll velocity), calibrated each session by brief head fixation
# at pitch and roll 0. Cohort 2, 20 mice, 1021 cells, right (7) or left (13) MEC, LEDs only
# (B, Bs, Ha, azimuthal head velocity); it includes 228 unpublished cells and cells from three
# earlier papers (Campbell et al. 2018, 122 cells; Eggink et al. 2014, 389 cells; Munn et al.
# 2020, 282 cells). Head-fixed dataset, 8 female C57BL/6 mice in virtual reality on a 400 cm
# linear track with a checkered floor and five landmark towers, water reward at one tower;
# Neuropixels 1.0 recordings in left (4 recordings, 3 mice) or right (7 recordings, 7 mice)
# MEC, 11 recordings, 2861 units (Kilosort2 and Phy); VR position and running speed resampled
# to 50 Hz; right eye video, pupil centre minus corneal reflection, high-pass filtered,
# extreme 1% removed, projected on the eye's horizontal (nasal-temporal) and vertical axes and
# divided by eye width, giving horizontal and vertical eye position (Eh, Ev) and velocity (Eh
# dot, Ev dot), smoothed with Gaussians (about 10 ms for position, 140 ms for velocity). A second
# head-fixed dataset, 6 sessions in 6 mice, 1621 cells, alternates blocks of the landmark track
# and a track of the same length without landmarks (Figure 8); the paper does not say whether
# these sessions are among the 11. The raw data are said to be at
# https://figshare.com/authors/Lisa_Giocomo/9864194 (Data availability). The DANDI:000053
# description lists tetrode recordings in MEC during open field navigation with inertial head
# measurements, and Neuropixels recordings during a virtual linear track with eye measurements.
# Whether it holds Cohort 2 (no IMU), the no-landmark sessions, spike-sorted units, the
# calibrated pitch and roll, and the processed eye traces is the author's to find.
#
# Method details fixed here from the Methods (LN model framework) and the spline code, the
# "LN pipeline" the criteria refer to. Time bins 20 ms. Epochs kept only where behaviour lies
# in the inner 95% (2.5th to 97.5th percentile, freely moving) or inner 98% (1st to 99th,
# head-fixed) of the session's distribution. Variables as cardinal spline regressors
# (spline_1d.m), head direction circular (spline_1d_circ.m), position 2D in the open field
# (spline_2d.m); control points, open field position (arena side in cm) x 15/100 per axis, 10
# head direction bins, speed bins 5 cm/s wide, 8 bins for pitch, roll and the three head
# velocities; VR 20 position bins, speed bins 5 cm/s, 5 bins for each eye variable. Tension
# s = 0.5 (the code's value; the Methods give 0.5 to 0.7 and call results insensitive; 0.7 is a
# variant). Poisson log-likelihood with L2 penalty beta = 1, fitted with fminunc. Performance
# is the log-likelihood increase over a mean rate model on held-out data, 10-fold
# cross-validation. Forward search, as in forward_search_kfold.m, adds the best variable while
# a one-sided Wilcoxon signed-rank test over the 10 folds gives P < 0.05, and a cell encodes the
# variables of the selected model when that model's fold values exceed 0 by a one-sided
# signed-rank test (P < 0.05). Variables searched, Cohort 1 B, Bs, Ha, Hp, Hr and the azimuthal,
# pitch and roll head velocities; Cohort 2 B, Bs, Ha and azimuthal head velocity; head-fixed B,
# Bs, Eh, Ev, Eh dot, Ev dot. Model-derived tuning curves by Methods equation 10 (M = 200 bins),
# shown and compared over the ranges of "Visualizing tuning curves" (the larger of the 2.5th
# percentile and -50 deg for pitch and roll, -100 deg/s for azimuthal head velocity, and the
# matching upper bounds; eye variables the larger of the 1st percentile and -3 units for Eh and
# Eh dot, -2 for Ev and Ev dot, and the matching upper bounds). Stability is the Pearson
# correlation of model-derived tuning curves from LN models refitted on the first and second
# halves of the session with the full session's selected variables, on the overlapping range,
# the shorter curve up-sampled. Tuning curve class is the lowest polynomial order (1 to 5)
# whose fraction of error explained over a flat line exceeds 0.9, on range-normalized curves,
# pitch and roll curves first smoothed (smoothdata, width 20); classified only when the animal
# explored 50% (head) or 80% (eye) of the range. Binomial tests are against one half,
# two-sided. Kruskal-Wallis tests are followed by two-sided Wilcoxon rank-sum tests at the
# Bonferroni level given in each legend.
#
# Open, and named in the claims it bears on. (1) Fold construction. The Methods say each fold
# is 10% of the data "chosen from 10-s sections" with no overlap; readings, (a) consecutive 10-s
# sections assigned to folds 1 to 10 in turn (compute_test_train_ind.m with 10-s sections),
# (b) 10-s sections assigned to folds at random; create_glm.m's 3-s sections are a variant.
# (2) Range restriction. Readings, (a) only time bins where every variable lies within its
# inner range are kept, (b) each variable is clipped to its own inner range and all bins kept.
# (3) Contribution to model performance. The Methods say the difference between the selected
# and the reduced model's performance, "normalized by the model performance for the selected
# model and subtracted from 1"; readings, (a) (full - reduced) / full, the reading under which
# body position is the largest contributor as the paper reports, (b) 1 - (full - reduced) /
# full, the literal wording; performance is the mean over the 10 folds, or (c) one held-out
# section as in compute_llh_increase.m. (4) "Explored" for shape classification; readings, (a)
# the fraction of the preset range covered between the behavioural percentile limits, (b) the
# fraction of tuning curve bins with any occupancy. (5) Preference of a cell (upward or
# downward, nasal or temporal, ipsiversive or contraversive); readings, (a) the sign of the
# slope for linear cells and the side of the tuning curve maximum for the others, (b) the side
# with the larger absolute slope of lines fitted on either side of 0 (Methods, Quantifying head
# and eye velocity tuning curves). (6) Asymmetric against symmetric velocity cells. The paper
# compares slopes below and above 0 and gives no rule; readings, (a) symmetric when the two
# slopes have opposite signs (V or inverted V), asymmetric otherwise, (b) the rule of the
# Methods' shuffle comparison, symmetric when the correlation below 0 and the one above 0 fall
# beyond the 5th and 95th percentiles of a 500-shift shuffle in opposite directions. (7) Fig. 8
# tuning curves across tracks; readings, (a) model-derived curves from LN models fitted on each
# track with the variables selected on the landmark track, (b) raw tuning curves (20 bins,
# occupancy-normalized). (8) Which values a pairwise P stands for when one P is printed for
# several pairs ("H a versus remaining variables, P = 3.5e-4"); read as the largest P of those
# pairs. Eye units for the preset bounds are fixed as % of eye width, since the Results define
# 1 unit as 1/100 of the eye width and Fig. 4f-i use % of eye width; a fraction of eye width
# would put the bounds beyond the eye.
