  criterion: Cells are those encoding each variable on the landmark track (LN pipeline on the
    landmark blocks), the correlation between their tuning curves in the two tracks under open
    detail (7). The B tolerance is 0.1, as 10% of 0.02 is below any meaningful resolution of a
    correlation; 0.1 is a tenth of the scale. Reproduced when, under one reading, the
    Kruskal-Wallis test gives P < 0.05, B is lower than each other variable at alpha 0.0033, and
    at least four of the six medians are within tolerance; partially reproduced when the tests
    hold alone.
- id: fig8e-joint-cells-preserve-eye-tuning
  statement: Eye position tuning is preserved across tracks even in cells that jointly encode
    body position and eye position.
  source: Results, Encoding of eye position and eye velocity persists in the absence of visual
    landmark features, paragraph 1; Figure 8e
  quote: This effect was observed even in cells that jointly encoded body position and eye position
    (Fig. 8e ).
  depends_on:
  - fig8c-eye-tuning-without-landmarks
  criterion: The paper shows examples and no test. For cells encoding both B and Eh on the landmark
    track, the cross-track correlation of Eh tuning curves is compared with that of their B
    tuning curves by a two-sided Wilcoxon signed-rank test, a test chosen here (the paper names
    none, and this is an assumption). Reproduced when the median Eh correlation exceeds the
    median B correlation with P < 0.05 under one reading of open detail (7).
- id: methods-hemispheres-similar
  statement: The proportion of MEC neurons tuned to eye movement variables does not differ between
    left (mean 0.23) and right (0.43) hemisphere recordings.
  source: Methods, Head-fixed dataset, Data collection
  quote: We did not observe a difference in the proportions of MEC neurons encoding eye
    movement-related variables across the left and right hemispheres
  statistics:
  - test: Wilcoxon rank-sum test
    p: 0.23
    n: 4 left and 7 right recordings
  depends_on:
  - fig4j-eye-encoding-cells
  expected:
  - quantity: mean proportion, left hemisphere
    value: 0.23
    tolerance: 0.083
  - quantity: mean proportion, right hemisphere
    value: 0.43
    tolerance: 0.083
  criterion: A claim of absence. Per recording, the fraction of cells encoding one or more eye
    variable; reproduced when the rank-sum test over recordings gives P >= 0.05. Means compared
    with the sem the paper gives as tolerance.
- id: supp3-low-false-positives
  statement: Shuffling one variable in time and refitting yields few falsely detected cells for
    each variable, in both datasets (for example 0 of 46 for pitch, 1 of 12 for azimuthal head
    velocity, 5 of 343 for horizontal eye position, 13 of 135 for vertical eye velocity).
  source: Supplementary Figure 3b, c
  quote: Here, we observed a very low chance of false positives for each variable
  depends_on:
  - fig1c-head-direction-cells
  - fig4j-eye-encoding-cells
  expected:
  - quantity: falsely detected vertical eye velocity cells, head-fixed
    value: 13
    tolerance: 1.3
  - quantity: falsely detected horizontal eye velocity cells, head-fixed
    value: 8
    tolerance: 0.8
  criterion: As in the Methods (Identifying rate of falsely detected encoded variables), one
    variable at a time is shuffled across time bins in Cohort 1 and in the head-fixed data and the
    whole LN pipeline is rerun. One shuffle per variable, as the counts imply. Reproduced when for
    every variable the falsely detected count is at most 10% of the normally detected count
    (the largest the paper reports is 13 of 135), with the counts reported; the expected values
    are given for reference, a shuffle being random.
- id: supp4-ln-conservative
  statement: Shuffle-based significance tests (within-cell and pooled) identify far more cells
    than the LN model, and nearly all LN model cells are also found by shuffling, so the LN model
    is a conservative estimate.
  source: Supplementary Figure 4d
  quote: note that nearly all of the cells identified by the LN-model were also identified by
    shuffling
  depends_on:
  - fig1c-head-direction-cells
  - fig4j-eye-encoding-cells
  criterion: Shuffling as in the Methods (Comparison between LN and shuffling-based methods),
    Pearson correlation of instantaneous behaviour and firing rate against 500 spike train shifts
    of more than 20 s, 2.5th and 97.5th percentiles (5th and 95th for the symmetric velocity
    test). "Linearly encoding" cells are read as the LN cells of the variable, all classes.
    Reproduced when, for each of pitch, roll, azimuthal head velocity and the four eye variables,
    each shuffle method finds more cells than the LN model and at least 90% of LN cells are
    found by within-cell shuffling (a reading of "nearly all").
- id: supp5-model-raw-tuning-agree
  statement: Model-derived and raw tuning curves are highly correlated (median 0.85 to 0.94
    across the seven head and eye variables).
  source: Supplementary Figure 5b
  quote: Overall, we found the model-derived and firing rate-derived tuning curves for a given
    variable to be highly correlated
  depends_on:
  - fig1c-pitch-roll-cells
  - fig4j-eye-encoding-cells
  expected:
  - quantity: median correlation, pitch
    value: 0.94
    tolerance: 0.094
  - quantity: median correlation, roll
    value: 0.93
    tolerance: 0.093
  - quantity: median correlation, azimuthal head velocity
    value: 0.90
    tolerance: 0.090
  - quantity: median correlation, Eh
    value: 0.90
    tolerance: 0.090
  - quantity: median correlation, Ev
    value: 0.85
    tolerance: 0.085
  - quantity: median correlation, Eh dot
    value: 0.85
    tolerance: 0.085
  - quantity: median correlation, Ev dot
    value: 0.87
    tolerance: 0.087
  criterion: Raw tuning curves from 20 bins, spikes over occupancy, smoothed with rlowess over 7
    bins, on the visualizing ranges (Methods, Raw tuning curves); Pearson correlation with the
    model-derived curve resampled to the same 20 bins (the resampling is not stated; a standard
    choice). Reproduced when at least six of seven medians are within tolerance.
- id: supp7e-eye-velocity-extrema-near-zero
  statement: Peaks and valleys of nonlinear eye velocity tuning curves lie mostly near 0 (170 of
    224 horizontal, 82 of 138 vertical within half the range), although their medians differ
    from 0.
  source: Supplementary Figure 7e
  quote: Distribution of peaks/valleys for horizontal eye velocity (top) and vertical eye velocity
    (bottom) tuning curves are centered on 0 eye position units/sec
  statistics:
  - about: horizontal, within against outside half range
    test: binomial test
    statistic: Z = 7.68
    p: 1.0e-8
    n: 224 peaks or valleys
  - about: vertical, within against outside half range
    test: binomial test
    statistic: Z = 2.13
    p: 0.03
    n: 138 peaks or valleys
  - about: horizontal median against 0
    test: two-sided Wilcoxon signed rank test
    statistic: Z = 2.63
    p: 0.0080
  - about: vertical median against 0
    test: two-sided Wilcoxon signed rank test
    statistic: Z = 3.34
    p: 8.0e-4
  depends_on:
  - fig6-eye-velocity-nonlinear-temporal
  expected:
  - quantity: horizontal peaks or valleys within half range
    value: 170
    tolerance: 17
  - quantity: vertical peaks or valleys within half range
    value: 82
    tolerance: 8.2
  criterion: As fig2c-velocity-extrema-near-zero, the half range being halfway between 0 and the
    maximum or minimum velocity of the range. Reproduced when both binomial tests give P < 0.05
    with a majority within half range and both counts are within tolerance.
- id: supp9-correlation-contributions
  statement: Measured by correlation coefficients, contributions follow the same order; in freely
    moving mice body position contributes most (median 0.42) and azimuthal head velocity least
    (0.02), and in head-fixed mice body position and speed exceed the eye variables.
  source: Supplementary Figure 9
  quote: We report the contribution of each variable to the correlation coefficient between a
    cell’s smoothed spiketrain and the model-predicted firing rate
  statistics:
  - about: freely moving, six variables
    test: Kruskal-Wallis test
    statistic: chi2 = 488.5, df = 5
    p: 2.4e-103
  - about: head-fixed, six variables
    test: Kruskal-Wallis test
    statistic: chi2 = 1.4e3, df = 5
    p: 5.4e-292
  depends_on:
  - fig3ab-head-contributions
  - fig7ab-eye-contributions
  expected:
  - quantity: freely moving median contribution, B
    value: 0.42
    tolerance: 0.042
  - quantity: freely moving median contribution, Ha
    value: 0.17
    tolerance: 0.017
  - quantity: head-fixed median contribution, B
    value: 0.38
    tolerance: 0.038
  - quantity: head-fixed median contribution, Bs
    value: 0.13
    tolerance: 0.013
  criterion: Contribution as in fig3ab-head-contributions with the Pearson correlation of the
    spike train smoothed by gausswin over 20 bins and the model rate as performance (Methods,
    Computing contribution to model performance). Reproduced when both Kruskal-Wallis tests give
    P < 0.05, B is the largest contributor in both datasets, azimuthal head velocity the smallest
    in the freely moving one, B and Bs exceed every eye variable, and at least three of the four
    medians are within tolerance.
- id: supp12-no-false-eye-detection
  statement: Eye variables share information with body position and speed, yet when eye-related
    contributions are deleted from simulated spike trains, the LN model does not falsely detect
    eye tuning.
  source: Supplementary Figure 12e to g
  quote: Note that eye variables were not falsely detected.
  depends_on:
  - fig4j-eye-encoding-cells
  criterion: As in the Methods (Generating simulated data without eye-encoded information),
    spike trains are drawn from each cell's fitted model with eye terms removed and the LN
    pipeline rerun. Mutual information between each eye variable and B or Bs against 100
    shuffles (legend). Reproduced when the data mutual information exceeds all shuffles in most
    sessions and, for each eye variable, the cells detected in the simulated data are at most 10%
    of those in the original (a reading of "not falsely detected"; the Supplementary Fig. 3c
    false positive rates reach this level).
