    55.6 deg) and the median roll -0.8 deg (-50.9 to 43.6 deg); azimuthal head velocity has a
    median near 0 deg/s and an inner 95% from -389.9 to 385.1 deg/s across 25 mice of both
    cohorts.
  source: Figure 1b legend
  quote: pitch ... 2.5th percentile = −23.0 ± 4.5° ... median = 11.5 ± 4.1° ... 97.5th percentile =
    55.6 ± 4.1° ( n = 6 mice); roll ... 2.5th percentile = −50.9 ± 3.6° ... median = −0.8 ± 7.6°
  expected:
  - quantity: pitch median, mean over mice
    value: 11.5
    tolerance: 4.1
    unit: deg
  - quantity: pitch 2.5th percentile, mean over mice
    value: -23.0
    tolerance: 4.5
    unit: deg
  - quantity: pitch 97.5th percentile, mean over mice
    value: 55.6
    tolerance: 4.1
    unit: deg
  - quantity: roll median, mean over mice
    value: -0.8
    tolerance: 7.6
    unit: deg
  - quantity: roll 2.5th percentile, mean over mice
    value: -50.9
    tolerance: 3.6
    unit: deg
  - quantity: roll 97.5th percentile, mean over mice
    value: 43.6
    tolerance: 4.0
    unit: deg
  - quantity: azimuthal head velocity 2.5th percentile, mean over mice
    value: -389.9
    tolerance: 34.7
    unit: deg/s
  - quantity: azimuthal head velocity 97.5th percentile, mean over mice
    value: 385.1
    tolerance: 34.7
    unit: deg/s
  criterion: As the legend says, percentiles are taken per session, averaged over a mouse's
    sessions, then the mean over mice is compared, with the legend's sem across mice as the
    tolerance. Reproduced when at least seven of the eight values are within tolerance,
    partially reproduced for four to six.
