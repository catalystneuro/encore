  source: Results, Cortical synaptic zinc signaling is necessary for the increased evoked PD in high-
    versus low-contrast sound, paragraph 5; Figure 6b
  quote: following ACSF injection, unlike following ZX1 injection (Fig. 4a,c,e), we observed a significant
    effect of contrast on both the intercept and fitted slope coefficient of the first-order time polynomial
    (Fig. 6b; intercept, F(1,2558.3) = 46.22, p = 1.31 × 10−11; slope, F(1,2558)= 15.076, p = 1.10× 10−4)
  statistics:
