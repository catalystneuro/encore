- id: discussion-zx1-wt-like-ko
  statement: After ZX1, high-contrast PD responses of ZnT3-WT mice peak at about 110% of baseline, like the
    high-contrast responses of ZnT3-KO mice, and with zinc signaling blocked both contrasts resemble
    low-contrast responses.
  source: Discussion, paragraphs 6 and 7; Figure 4c, d
  quote: upon blockade, responses to both low and high contrast resembled low-contrast responses, which were
    of comparable magnitude in ZnT3-WT and ZnT3-KO mice (Fig. 4) ... the magnitude of PD responses to
    high-contrast sound after ZX1 infusion in ZnT3-WT mice (Fig. 4c; peak at ∼110% PD) is not different from
    the magnitude of high-contrast PD responses in ZnT3-KO mice (Fig. 4d; peak at ∼110% PD)
  expected:
  - quantity: peak rise of the mean high-contrast response, ZnT3-WT after ZX1, over 0 to 2 s
    value: 10
    tolerance: 2.5
    unit: percent of baseline
  - quantity: peak rise of the mean high-contrast response, ZnT3-KO, over 0 to 2 s
    value: 10
    tolerance: 2.5
    unit: percent of baseline
  criterion: The peaks are given as approximate ("∼110%"), read from Fig. 4c, d, and no test is named for
    "not different". The quantity is the maximum of the trial-mean trace (% baseline, baseline PD < 50%)
    within 0 to 2 s (the Fig. 4c, d window), minus 100. The tolerance is a quarter of the 10 point rise,
    as the paper gives the values only to the nearest few percent; 10% of the 110 would accept no rise at
    all. Which KO trials is open, (a) CTRL, (b) CTRL and ZX1 pooled; both run, and the claim holds when
    the WT value and the KO value under one reading are within tolerance.
  depends_on:
  - fig4c-wt-contrast-zx1-effects
