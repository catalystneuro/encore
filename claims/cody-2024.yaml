    test: LME growth curve analysis
    statistic: F(1,2558.3) = 46.22
    p: 1.31e-11
  - about: contrast, slope
    test: LME growth curve analysis
    statistic: F(1,2558) = 15.076
    p: 1.10e-4
  criterion: Group F, baseline PD < 50%. Open, run each - (a) trials after ACSF only, pupil ~ (tPoly1 +
    tPoly2) x contrast + (1 | subject); (b) trials before and after ACSF, the model of
    fig4c-wt-contrast-zx1-effects with ACSF as treatment, the contrast terms (and the contrast effect
