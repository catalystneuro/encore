# Claims for Cody, Kumar & Tzounopoulos (2024) on dandiset 001256.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-22, protocol
# as stated in docs/protocol.md (pilot-10), Reader steps 1 to 4.
#
# Text read: the version of record (J Neurosci 44(11) e0939232024, 2024), as the PDF supplied by a
# person and its text extraction (paper/10.1523-jneurosci.0939-23.2024.txt): main text, Materials and
# Methods, figure legends of Figures 1 to 6. The paper has no supplement and no Extended Data. It
# links no code and no data availability statement; no analysis code was read. The dandiset's
# title ("Cortical zinc dependent pupil changes to sound contrast") and description ("Data for
# analyses presented in Cody et. al. 2024") say it holds the data of this paper; its files were not
# looked at.
#
# The data the paper used (Materials and Methods, Animals). Awake head-fixed mice, right auditory
# cortex (ACtx) expressing GCaMP6f in CaMKII principal neurons, two-photon calcium imaging (2PCI,
# 145 x 145 um, 256 x 256 pixels, 5 Hz) of right A1 layer 2/3 with simultaneous video of the right
# pupil (10 Hz, synchronized to the 2P frames). Sound from a free-field speaker at the left ear.
# Groups, as the Methods list them:
# - A. 4 F and 4 M C57BL6/J mice, Figures 1, 2a-c and 3 (295 tone-responsive cells from 8 animals).
# - B. 6 F and 8 M C57BL6/J mice, "Figure 2a-e" (the Results give 520 tone-responsive cells from 14
#   mice for Fig. 2d, e, before and after ZX1). The Methods name Fig. 2a-c for both A and B; see
#   fig2b-evoked-pd-whole-drc for the readings.
# - C. 6 F and 4 M ZnT3-WT littermate mice, Fig. 4a, c (and the WT side of Fig. 6d).
# - D. 3 F and 3 M ZnT3-KO mice, Fig. 4b, d and 6d.
# - E. 1 F and 2 M C57BL6/J mice with a chronic cannula in left ACtx, widefield imaging of right A1,
#   Figure 5.
# - F. 3 M and 1 F C57BL6/J mice, ACSF control injections, Figure 6.
# Conditions: low-contrast dynamic random chords (DRC; 28 tones 5 to 51.874 kHz, 25 ms chords,
# levels uniform 50 to 60 dB SPL) and high-contrast DRC (40 to 70 dB SPL), same 55 dB mean, each
# trace with 4 s of silence before and after; for the contrast gain control (CGC) assay a 400 ms
# 70 dB SPL pure tone at 2 s into the DRC, at the frequency best for the field's average FRA; for
# the Fig. 4 and 6 pupil analyses DRCs without the tone. At least 8 repetitions per contrast,
# pseudorandom order, 25 to 35 s between traces. Treatment: CTRL before, then ZX1 (100 uM, with
# Alexa Fluor 594) or ACSF injected into right ACtx. Measured variables: cell fluorescence traces,
# pupil video or pupil diameter, trial times, contrast, treatment, genotype, recording time.
#
# Methods shared by the claims, with their source (all from Materials and Methods unless noted).
# - Pupil diameter (Pupillometry, analysis): least-squares circle fit to DeepLabCut points, at least
#   three points at likelihood > 0.9 or the frame is dropped; then remove frames that are > 6 SD
#   outliers of the first derivative, interpolate missing points linearly from the two before and
#   two after, and low-pass filter (third order Butterworth, 3 Hz). Needed only if the dandiset
#   holds points, not diameters. Open: whether the filter is zero-phase or causal (readings, (a)
#   zero-phase, (b) causal); it cannot change a sign of a 1 s average and is run as (a), a
#   standard choice.
# - Evoked pupil: each trace divided by its mean over -4 to 0 s before sound onset, times 100 (%
#   baseline). Baseline PD for binning: each trace as % of the animal's maximum PD in the
#   experiment, averaged over -4 to 0 s. Sound-evoked pupil analyses keep trials with baseline PD
#   < 50% of animal max (Methods, Pupillometry, analysis, paragraph 2); this applies to the claims
#   on Fig. 2a-c, 4 and 6b-d; analyses without it are variants.
# - Baseline PD bins (Fig. 1f-i): seven bins, the last > 76% and wider. The Methods give no other
#   edges. The Discussion names the fourth bin "43–54%", so bins 1 to 6 are read as 11% wide:
#   below 21, 21-32, 32-43, 43-54, 54-65, 65-76, above 76 (inferred; the lower edge of bin 1 is not
#   given and is taken as open below). Trials are binned by their own baseline PD (Methods). The
#   Fig. 1 legend says "Baseline PD is calculated by animal as the mean baseline PD percentage of
#   max animal PD across the entire experiment", which could mean one value per animal; that
#   reading is a variant, since the Fig. 1i error df (1871, 14 groups, so 1885 values from 295
#   cells) needs several bins per cell.
# - Cell fluorescence (2PCI processing and analysis): NoRMCorre motion correction, FISSA neuropil
#   removal scaled by 0.8, ellipse ROIs. dF/F = (F - F0_DRC)/F0_DRC with F0_DRC the mean over -1.2
#   to 0 s before DRC onset. Pure-tone response = F(t) - F0_PT, F0_PT the mean of F(t) over 1-2 s.
#   The window of the peak pure-tone response is not stated for the response measure itself. Open:
#   (a) the 800 ms after tone onset (2 to 2.8 s), the window of the responsiveness test, (b) 2 to
#   3.2 s, the window of the reliability measure; both are run. Open: whether a cell's "average
#   peak" is (a) the maximum of its trial-averaged trace or (b) the mean of its trial maxima; both
#   are run.
# - Cell inclusion: tone-responsive cells with d' >= 0 (Romero et al. 2019; the paper gives neither
#   the formula nor which measures it compares). Any d' of the form difference of means over a
#   spread is >= 0 exactly when the mean response is at least the mean baseline; which response and
#   baseline are compared is open, (a) the peak in the tone window (both window readings) against
#   the 1-2 s baseline of the CGC assay traces, (b) the FRA mapping responses, peak in the 800 ms
#   after tone onset against the 600 ms pre-tone baseline (Methods, Frequency response area
#   mapping, which also says only cells with significant pure-tone responses were included); the
#   counts 295 and 520 are checked under each. And significantly responsive, the average trace maximum in
#   the 800 ms after tone onset >= 2 SD above the average baseline (1-2 s). Open: the SD is (a) the
#   SD over time of the trial-averaged trace in 1-2 s or (b) the SD across trials of the trial
#   baseline means. For CGC analyses, cells responsive in both low and high contrast. Open: whether
#   the Fig. 1f, g and 2e cells are (a) those responsive in both contrasts or (b) responsive with
#   trials of both contrasts pooled; the reported counts (295, 520) are checked under each.
# - Contrast scaling factor: per cell, average peak in low contrast divided by average peak in high
#   contrast (Discussion, paragraph 3, "calculated from each cell's average peak response in low
#   contrast divided by its peak response in high contrast"), then the population mean, per
#   baseline PD bin, with both contrasts of a cell taken from the same bin ("grouped ... to
#   maintain pairing by contrast condition").
# - Growth curve analysis (GCA): pupil (% baseline) from sound onset to 2 s, orthogonal first and
#   second order time polynomials (as in Mirman 2016, which the Methods cite, R poly() with unit
#   norm columns over the time samples), LME pupil ~ (tPoly1 + tPoly2) x contrast + (tPoly1 +
#   tPoly2) x treatment + (1 | subject), fitted with MATLAB fitlme and checked with R lmer; Tukey
#   adjusted pairwise comparisons with emmeans and Satterthwaite df. Rows are trial by time sample:
#   the reported denominator df (7921.6 for the WT model, 4500.8 for KO, 2558 for ACSF, 3869 for
#   genotype) need thousands of rows, which per-animal mean traces cannot give. Samples with 0 <= t
#   <= 2 s are used (standard choice). Open, and run under each reading: the model the text reports
#   includes a contrast x treatment interaction (Fig. 4c, F(1,7921.6) = 24.2) that the written
#   formula lacks, so the model is (a) the written formula plus contrast:treatment, or (b) the full
#   factorial (tPoly1 + tPoly2) x contrast x treatment; and the factor coding is (a) reference
#   coding with LOW and CTRL as references (fitlme's default), or (b) effects (sum) coding. The
#   "F" values printed with negative signs for the KO model (for example F(1,4500.8) = -1.14) can
#   only be t statistics of coefficient tests; the p-values are compared.
