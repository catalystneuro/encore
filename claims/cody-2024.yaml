- id: fig5-contralateral-zx1-increases
  statement: ZX1 infused into the contralateral (left) ACtx increases sound-evoked responses of right A1
    principal neurons (one-way repeated measures ANOVA F = 33.44, p = 4.1e-5; control against
    contralateral ZX1 p = 0.016, Bonferroni; three mice).
  source: Results, Cortical synaptic zinc signaling is necessary for the increased evoked PD in high-
    versus low-contrast sound, paragraph 4; Figure 5c-e
  quote: infusion of ZX1 to the contralateral ACtx increased the sound-evoked responses of ipsilateral A1
    PNs (Fig. 5c–e; three mice, one-way repeated measure ANOVA, F = 33.44, p = 4.1 × 10−5; control vs ZX1
    in contralateral ACtx, p = 0.016, Bonferroni's multiple-comparisons test)
  statistics:
  - about: three conditions (control, contralateral ZX1, ipsilateral ZX1)
    test: one-way repeated measure ANOVA
    statistic: F = 33.44
    p: 4.1e-5
    n: three mice
  - about: control against contralateral ZX1
    test: Bonferroni's multiple-comparisons test
    p: 0.016
    corrected: Bonferroni
  criterion: Group E, widefield dF/F of right A1 to broadband noise (6 to 64 kHz, 100 ms, 30 to 80 dB SPL,
    Fig. 5b axis, d legend), F0 the 1 s mean before sound onset (carried over from Methods, Widefield
    imaging, which states it for the pure-tone mapping, not for Fig. 5). The paper does not give the
    A1 region, the response measure or window, or what the repeated measures are. Readings, run each -
    measure, (a) peak dF/F, (b) mean dF/F, in the 1 s after onset (standard window). Repeated units -
    with three conditions, F = 33.44 gives p = 0.0032 on (2,4) df (three mice), 9e-9 on (2,34) df
    (three mice by six levels), and 3.7e-5 on (2,10) df, close to the reported 4.1e-5; so the units
    are read as the sound levels (six on the Fig. 5b axis, 30 to 80 dB SPL), with values averaged over
    mice, and with and without a Greenhouse-Geisser correction. Units of mice, and of mouse by level,
    are variants shown. A1 is the region the dataset marks as A1, if it does; else this claim is
    blocked. Reproduced when the ANOVA has p < 0.05 and contralateral ZX1 exceeds control at
    Bonferroni p < 0.05 under every measure reading; methods_underspecified if they disagree.
- id: fig5-ipsilateral-zx1-reduces
  statement: Subsequent ZX1 infusion into the ipsilateral ACtx reduces sound-evoked A1 responses compared
    with contralateral ZX1 (p = 3.2e-5, Bonferroni).
  source: Results, Cortical synaptic zinc signaling is necessary for the increased evoked PD in high-
    versus low-contrast sound, paragraph 4; Figure 5d-f
  quote: subsequent infusion of ZX1 to ipsilateral ACtx reduced the sound-evoked responses of A1 PNs (Fig.
    5d–f; ZX1 in contralateral vs ipsilateral ACtx, p = 3.2 × 10−5, Bonferroni's multiple-comparisons test)
  statistics:
  - test: Bonferroni's multiple-comparisons test
    p: 3.2e-5
    corrected: Bonferroni
  criterion: As fig5-contralateral-zx1-increases. Reproduced when ipsilateral ZX1 is below contralateral
    ZX1 at Bonferroni p < 0.05 under every reading.
  depends_on:
  - fig5-contralateral-zx1-increases
- id: fig5c-no-dye-in-other-hemisphere
  statement: After infusion of ZX1 with Alexa Fluor 594 into the left ACtx, no Alexa Fluor 594 is seen in
    the right ACtx, suggesting ZX1 does not travel to the other hemisphere.
  source: Results, Cortical synaptic zinc signaling is necessary for the increased evoked PD in high-
    versus low-contrast sound, paragraph 3; Figure 5c
  quote: We found that the infusion of ZX1 + Alexa Fluor 594 to the left (contralateral) ACtx does not show
    the presence of Alexa Fluor 594 in the ipsilateral ACtx under the red channel (Fig. 5c)
  criterion: Shown with a representative red-channel image and no measure. Testable only if the dataset
    holds the red-channel images of the right ACtx before and after contralateral infusion; the paper
    gives no threshold for presence, so the claim is reported as methods_underspecified with the mean
    red intensities shown, unless the images make the answer plain both ways (no change at all, or a
    change of the order seen after the ipsilateral infusion).
- id: fig6a-baseline-pd-drift
  statement: Baseline PD increases with recording time in both ZX1 (slope 95% CI 0.0798 to 0.183, p =
    1.26e-6) and ACSF experiments (95% CI 0.0159 to 0.279, p = 0.0282), and the intervals overlap.
  source: Results, Cortical synaptic zinc signaling is necessary for the increased evoked PD in high-
    versus low-contrast sound, paragraph 5; Figure 6a
  quote: We observed a significant time-dependent increase in baseline PD across the recording duration of
    ZX1 experiments [Fig. 6a; slope 95% CI = (0.0798, 0.183), p = 1.26 × 10−6] ... we used ACSF as a control
    and found a similar time-dependent increase in baseline PD [Fig. 6a; slope 95% CI = (0.0159, 0.279), p =
    0.0282]
  statistics:
  - about: ZX1 experiments
    test: linear regression
    p: 1.26e-6
    ci:
      level: 0.95
      low: 0.0798
      high: 0.183
  - about: ACSF experiments
    test: linear regression
    p: 0.0282
    ci:
      level: 0.95
      low: 0.0159
      high: 0.279
  criterion: Per trial, baseline PD (% animal max, over -4 to 0 s) against recording time in minutes
    (Fig. 6a axes; the time origin, the first trial, changes no slope), all trials of the experiment,
    pooled over mice, ordinary least squares (Methods, Statistics). Which ZX1 experiments is open, run
    each - (a) groups C and D, (b) group C only, (c) groups B, C and D. ACSF is group F. Reproduced when
    both slopes are positive with p < 0.05 and their 95% CIs overlap, under every ZX1 reading; the slopes
    and intervals are compared with the reported ones.
- id: fig6b-acsf-contrast-effect
  statement: After ACSF injection the contrast effect on evoked PD remains, on both the GCA intercept
