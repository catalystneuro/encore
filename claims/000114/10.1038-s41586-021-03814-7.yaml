    and dam retrieval, and pairs including OT-PVN units were more correlated than PVN pairs
    during these behaviours.
  source: Fig. 2b, e, g-i; Fig. 3b-d; Extended Data Figs. 5, 6a, 7a, 7d, 7e
  quote: Virgin PVN and OT-PVN units were activated by shepherding or initial nest entry ... found
    that pairs containing OT-PVN cells were more correlated during shepherding, nest entry and dam
    retrieval
  statistics:
  - about: OT-PVN units activated during shepherding
    test: one-sided Fisher's exact test
    p: 0.02
    n: 21 OT-PVN units
  - about: OT-PVN units activated during nest entry
    test: one-sided Fisher's exact test
    p: 0.01
    n: 21 OT-PVN units
  - about: OT-PVN units activated during dam retrieval
    test: one-sided Fisher's exact test
    p: 0.02
    n: 17 OT-PVN units
  - about: pairs with OT-PVN units against PVN pairs, shepherding
    test: ANOVA and Tukey's multiple-comparison test
    p: 0.0001
    p_relation: "<"
    corrected: Tukey
    n: 530 pairs
  - about: pairs with OT-PVN units against PVN pairs, nest entry
    test: ANOVA and Tukey's multiple-comparison test
    p: 0.0001
    p_relation: "<"
    corrected: Tukey
    n: 776 pairs
  - about: pairs with OT-PVN units against PVN pairs, dam retrieval
    test: ANOVA and Tukey's multiple-comparison test
    p: 0.0001
    p_relation: "<"
    corrected: Tukey
    n: 278 pairs
  criterion: Needs the identity of the OT-PVN units, from the optical tagging recordings or the
    authors' list of identified units.
- id: fig2f-virgin-chasing
  statement: Units activated during shepherding fired less when the virgin chased the dam (6
    units, Wilcoxon p = 0.03).
  source: Fig. 2f; Source Data Fig. 2f
  quote: Units with significant rate changes during shepherding (red) fired less during virgin→dam
    chases (grey)
  criterion: Needs a label for virgin-to-dam chases. The files have "Virgin Agressing", which no
    source names.
- id: ed6-dam-vs-pup
  statement: During 5-minute interactions, more virgin PVN units were activated by the dam than by
    pups (25 of 248 against 7 of 248), and units barely responded to pup calls (1 of 71).
  source: Extended Data Figs. 6c-e, 7c
  quote: "interactions with dam activated more virgin PVN cells than interactions with pups (with
    dam: 25/248, with pup: 7/248, p=0.001, two-sided Fisher’s exact test) ... only 1/71 PVN units
    having significant responses to pup vocalizations"
  statistics:
  - test: two-sided Fisher's exact test
    p: 0.001
    n: 248 PVN neurons
  criterion: Needs the 5-minute interaction periods and the pup call playback times.
- id: fig1cd-retrieval-onset
  statement: Virgins co-housed with a dam and litter began retrieving pups earlier than virgins
    co-housed with pups alone (n = 14 and 10, P < 0.0001), and nest entry and shepherding on day
    1 correlated with retrieval at the end of day 1 (r = 0.66 and 0.75).
  source: Fig. 1c, d, f, k; Extended Data Fig. 2
  quote: Virgins co-housed with dams and litters (D+ virgins, n = 14) began reliably retrieving ...
    earlier than virgins co-housed with pups but without dams (D− virgins, n = 10) ... the more
    virgins entered the nest, the more likely it was that retrieval occurred on day 1
  statistics:
  - about: retrieval onset, D+ against D− virgins
    p: 0.0001
    p_relation: "<"
    n: 14 D+ and 10 D− virgins
  - about: nest entry on day 1 against retrieval at the end of day 1
    statistic: r = 0.66
    p: 0.009
  - about: shepherding on day 1 against retrieval at the end of day 1
    statistic: r = 0.75
    p: 0.001
  criterion: Needs the daily retrieval tests of each co-housed virgin.
- id: fig2a-dreadd
  statement: Chemogenetic silencing of OT-PVN neurons delayed the onset of retrieval in co-housed
    virgins.
  source: Fig. 2a; Extended Data Fig. 4
  quote: found that retrieval onset in naive co-housed virgins was delayed (Fig. 2a)
  criterion: Needs the retrieval scores of the DREADD and control cohorts.
- id: fig3fg-observational-learning
  statement: Non-co-housed virgins learned to retrieve after watching dams retrieve, with no
    barrier (11 of 15) or through a transparent barrier (12 of 19), but not through an opaque
    barrier (2 of 18) or when lacking the oxytocin receptor (3 of 10).
  source: Fig. 3e-g; Extended Data Fig. 8c, d
  quote: "No barrier: 11 out of 15 virgins retrieving after 40 maternal demonstrations ...
    transparent: 12 out of 19 virgins retrieving ... opaque: 2 out of 18 virgins retrieving ...
    OXTR-KO: 3 out of 10 virgins retrieving"
  statistics:
  - about: no barrier
    test: Fisher's exact test
    p: 0.0002
    n: 15 virgins
  - about: transparent barrier
    p: 0.0001
    p_relation: "<"
    n: 19 virgins
  - about: opaque barrier
    p: 0.2
    n: 18 virgins
  - about: OXTR-KO
    p: 0.1
    n: 10 virgins
  criterion: Needs the retrieval scores of the observation cohorts.
- id: fig3ij-observation-units
  statement: PVN units of non-co-housed virgins were activated while watching dam retrievals (15
    of 65), some also during the virgin's own retrievals (15 of 41), and only in virgins that went
    on to retrieve (learners against non-learners, P = 0.0001).
  source: Fig. 3h-j
  quote: 15 out of 65 PVN neurons increased activity during dam retrieval; right, 15 out of 41 of
    these units increased activity during self-performance) ... was elevated only in those
    non-co-housed virgins that eventually began retrieving
  statistics:
  - p: 0.0001
    n: 3 learners and 5 non-learners
  criterion: Needs unit recordings from the observation sessions.
- id: fig4c-ac-photometry
  statement: Auditory cortex photometry responses to pup calls increased over co-housing up to the
    day of retrieval onset (P = 0.003, n = 3).
  source: Fig. 4a-c; Extended Data Fig. 10a
  quote: We found a progressive increase in photometric signal before the day of retrieval onset
  statistics:
  - p: 0.003
    n: n = 3
  criterion: Needs auditory cortex photometry with pup call playback times.
- id: fig4f-pvn-ac-correlation
  statement: Single-trial PVN activity correlated with pup-call responses in auditory cortex
    during observation (r = 0.5, P = 0.00001, n = 4).
  source: Fig. 4d-f
  quote: Even before virgins began retrieving pups, single-trial PVN activity correlated with pup
    call-evoked responses in cortex
  statistics:
  - statistic: r = 0.5
    p: 1.0e-05
    n: n = 4
  criterion: Needs simultaneous PVN units and auditory cortex photometry.
- id: fig4i-projection-photometry
  statement: PVN to auditory cortex projections were activated during observation of dam
    retrieval in virgins that learned to retrieve (P = 0.02) but not in those that did not
    (P = 0.5), three animals per group.
  source: Fig. 4g-i; Source Data Fig. 4i
  quote: In virgins that began retrieving, PVN→auditory cortex projections were activated during
    observation of dam retrieval ... PVN→auditory cortex projections were not significantly
    activated in virgins that did not learn after observation
  statistics:
  - about: learners
    p: 0.02
  - about: non-learners
    p: 0.5
  criterion: Per-animal responses to the dam's retrievals in the observation sessions, tested
    with a one-sample t-test per group as in the Source Data. Needs which animals learned.
- id: fig4jk-oxytocin-in-ac
  statement: An oxytocin receptor antagonist in auditory cortex prevented learning by observation
    (2 of 10 against 7 of 9), and stimulating OT-PVN fibres in auditory cortex enhanced it (4 of
    4 against 2 of 4).
  source: Fig. 4j, k
  quote: Infusing a selective oxytocin receptor antagonist (OTA) into virgin left auditory cortex
    before transparent-barrier observational testing prevented virgins from learning to retrieve ...
    Optogenetic stimulation of OT-PVN→auditory cortex projections during observational testing with
    the opaque barrier enhanced retrieval learning
  statistics:
  - about: OTA against saline
    p: 0.03
    n: 9 saline and 10 OTA virgins
  - about: ChETA-EYFP against EYFP
    test: Mantel–Cox test
    p: 0.008
    n: 4 ChETA-EYFP and 4 EYFP virgins
  criterion: Needs the retrieval scores of the infusion and optogenetic cohorts.
- id: ed9-colliculus
  statement: Superficial superior colliculus projects to OT-PVN neurons, and stimulating this
    input replaced visual experience (4 of 5 against 1 of 6 virgins retrieving).
  source: Extended Data Fig. 9; Results, Social transmission of maternal behaviour, paragraph 4
  quote: found projections from medial superficial layers of ipsilateral superior colliculus ...
    Optogenetic sSC→PVN stimulation could replace visual experience in non-co-housed virgins exposed
    to maternal retrievals behind an opaque barrier
  statistics:
  - test: Mantel–Cox test
    p: 0.03
    n: 5 ChR2-Venus and 6 control virgins
  criterion: Needs tracing histology and the retrieval scores of the stimulation cohort.
