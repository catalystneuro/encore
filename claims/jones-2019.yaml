- id: fig1e-swr-abundance-genotype
  statement: In the aged screen cohort, apoE4-KI mice have lower SWR abundance than apoE3-KI mice.
  source: Results, Aged ApoE4-KI Mice Show SWR Deficits, paragraph 1; Figure 1E
  quote: apoE4-KI mice had reduced SWR abundance and associated SG power in CA1, CA3, and DG (Figures 1E
    and 1F)
  statistics:
  - test: unpaired t test
    statistic: t(27) = 8.42
    p: 0.0001
    p_relation: "<"
    n: 13 apoE3-KI and 16 apoE4-KI mice, aged 12-18 months
  criterion: SWR abundance by method (A) per mouse of Cohort 1; a two-tailed unpaired t test of E3
    against E4. Reproduced when E4 is lower with p < 0.0001; partially reproduced when E4 is lower
    with p < 0.05.
