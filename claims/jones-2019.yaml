# Claims for Jones, Gillespie, Yoon, Frank & Huang (2019), Cell Reports 29, 2123-2133, "Early
# Hippocampal Sharp-Wave Ripple Deficits Predict Later Learning and Memory Impairments in an
# Alzheimer's Disease Mouse Model", doi:10.1016/j.celrep.2019.10.056, on CRCNS data set hc-26
# (doi:10.6080/K0D798NB).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-09,
# protocol as stated in docs/protocol.md (Reader), version pilot-14.
#
# Text read: the version of record with its supplemental information, as text extracted from the
# PDF under paper/ (main text, STAR Methods, Figures S1 to S4 with legends, Tables S1, S3 and S4),
# and Table S2 (mmc2.xlsx, three sheets), appended to the same text. The PDF was opened only to
# read numbers printed inside figure panels (R and p of the scatter plots, Figures 2, 3, 4 and S1,
# and the directions in Figures S3 and S4); these are marked "read from the panel". The data set's
# description (paper/hc-26.data-description.txt) was read only to know what it holds.
#
# Code read: https://github.com/emilyasterjones/SWR-predictions, commit ca056a8 (2023-05-06),
# linked from the Key Resources Table and Data and Code Availability. MATLAB in the Frank lab
# filter framework (needs NeuroQuery, Trodes, Chronux; the framework functions get2dstate,
# createfilter, extracteventsnew's caller are not all in the repository). Preprocessing/ (ripple
# filtering ej_rippledayprocess.m, detection ag_extractripples.m, positions pos_trodes.m), SWR
# abundance/ (runcalcriprates.m, calcriprates2.m, getvalidrips.m), SG Power/ (runRTS.m,
# RTspecgram3.m, plotRTSstats.m), MUA/ (runRTMUA.m, RTMUA.m; the plotting part refers to fields
# RTMUA.m does not produce), Dentate Spikes/, loocv.m (leave-one-out check), fit_train_to_test.m
# (screen model applied to replication data), rainbow_plots.m, and pull_apa_metrics.py (APA
# distance per movement bout). The behavioral metrics other than distance per bout were taken from
# Ethovision, Tracker and Excel, which are not code.
#
# Data the paper used. Female apoE3-KI (E3) and apoE4-KI (E4) mice, two cohorts (Table S1).
# Screen cohort (Cohort 1): recordings at 12-18 months, 13 E3 and 16 E4 (CA3 SG power 11 and 13);
# MWM at 13-19 months, 20 E3 and 19 E4. Replication cohort (Cohort 2): recordings at 5-8 months
# (13 E3, 17 E4; CA3 12 and 16), 9-11 months (12, 17; CA3 11, 16) and 13-17 months (9, 15; CA3 9,
# 14); MWM at 6-9 months (13, 13); open field, elevated plus maze and MWM at 14-18 months (12, 15);
# APA and hot plate at 15-20 months (12, 13). Some behavior-only mice were added to Cohort 2.
# Each recording time point is 5 daily 60 min home-cage sessions, LFP from a 32-site probe in right
# dorsal hippocampus (CA1, CA3, DG), with 30 Hz position tracking; MUA in Cohort 1 only. Behavior
# results are in the data set's Behavior Excel file with MWM and APA tracking. The correlations use
# the E4 mice that have both measures: screen n = 16 (SWR abundance) and 13 (CA3); replication MWM
# n = 11 and 10; APA n = 10 and 9; Figure 4 n = 11 (MWM) and 10 (APA).
#
# Methods fixed for all claims, with their sources.
# (A) SWR detection and abundance. Methods (Analysis of Neural Data): LFP 0.1-300 Hz at 1 kHz
# (as deposited); equiripple band-pass 150-250 Hz (the code's agripplefilter.mat; 125-250 Hz is
# agripplefilter3.mat); detection on the CA1 site closest to the centre of stratum pyramidale (the
# code takes the chinfo site with area ca1 and layer containing "pyr 1"); an SWR is the envelope
# exceeding 5 SD above baseline for at least 15 ms. The code smooths the envelope with a 4 ms
# Gaussian and takes baseline and SD as the mean and SD of that envelope over the whole session
# (ag_extractripples.m); the Methods do not say, so the code settles it. The code detects events
# above 3 SD for 15 ms and keeps those whose peak reaches 5 SD (runcalcriprates.m, bins [5 50]);
# the Methods read as above 5 SD for 15 ms. The Methods reading is the main one, the code's the
# variant. The code also drops events within 0.4 s of the session's start or end and events that
# coincide with events on 16 or more channels (getvalidrips.m); the Methods are silent, so these
# follow the code. Immobility (Methods; code runcalcriprates.m) is Gaussian-smoothed velocity
# (the deposited pos.vel, 500 ms Gaussian) below 1 cm/s, counted only after it has lasted 30 s.
# Sessions with less than 10 min of such immobility are excluded (Methods). Abundance is SWRs per
# second of immobility in each session, averaged over the mouse's sessions (Methods, last
# paragraph; code calcriprates2.m and runcalcriprates.m figopt 1).
# (B) SWR-associated SG power. Methods: multitaper SWR-triggered spectrogram per site, 100 ms
# window, z-scored; the mean z-scored power over 30-50 Hz in the window 0-100 ms after detection,
# averaged over SWRs and over sites in the region; CA3 is its stratum pyramidale and radiatum
# sites, CA1-sr the stratum radiatum sites, DG the hilus and granule cell sites with confirmed
# dentate spikes. The code (runRTS.m, RTspecgram3.m, plotRTSstats.m) settles: 3 tapers (time-
# bandwidth 3), non-overlapping 100 ms windows from -0.4 to 0.4 s around the threshold crossing,
# the window centred at 50 ms; z-score per frequency against the mean and SD of the same
# spectrogram of the immobile LFP of the session. Two code choices differ from the Methods and are
# variants: the code triggers on all events above 3 SD (minstd 3), where the Methods and Table S2
# (the main CA3 values equal its 5 SD column) use the 5 SD SWRs; and the code's frequency bins 4
# to 7 of a 7.8 Hz grid (31.3, 39.1, 46.9, 54.7 Hz) include 54.7 Hz, where the Methods' 30-50 Hz
# holds 31.3, 39.1 and 46.9 Hz. Open, could change values: the Methods analyse per session and
# average over sessions, the code pools the SWRs of all sessions per site; both are to be run.
# (C) MWM metrics (Methods, Analysis of Behavioral Data): escape latency is the mean of the 4
# daily trials; slope over days 1 to k is the slope of a first-degree polynomial fitted to the
# daily means; overnight change ("Night 1 Learning") is latency on day 2 trial 1 minus day 1
# trial 4 (Figure S1C); probe area under the distance-to-platform curve over the first 5 s, by the
# trapezoid method; percent time in target quadrant and target crossings as exported.
# (D) APA metrics on training days 1-4 after the habituation day (Methods, Behavior): entrances,
# latency to first entrance, path length, percent time in the quadrant opposite the shock zone,
# and distance from the shock zone per movement bout (pull_apa_metrics.py: 1 s steps, a bout is
# movement of 2 cm/s or more; "Avg Travel Away from SZ (cm)").
# (E) Performance scores (Quantification and Statistical Analysis): z-score each metric, invert
# the sign where higher is worse (latencies, slopes, overnight change, probe area under the curve,
# entrances, distance per bout), average. MWM learning score: slope days 1-2 and 1-3, latency day
# 3, overnight change days 1-2; MWM memory precision: percent time in target quadrant probes 1
# and 2, crossings probe 1, area under the curve probes 1 and 2; APA learning: latency to first
# entrance, path length, percent time opposite, day 2; APA memory precision: entrances day 2,
# distance per bout days 2 and 3. Open, could change the scores: the population of the z-score
# ("Z scored across the population"): (i) the E4 mice in the correlation, (ii) all mice of the
# cohort of both genotypes; both are to be run.
# (F) Tests (Quantification and Statistical Analysis; figure legends): correlations are Pearson
# (Spearman where stated), reported as F(1, n-2) of the regression, two-sided, alpha 0.05. In the
# replication cohort p is adjusted with Holm-Sidak. The family is not stated; the printed adjusted
# p are reproduced, from the printed F, by step-down Sidak without enforced monotonicity (as
# Prism prints it) within the planned metrics of one SWR property: the 4 MWM learning metrics for
# SWR abundance, the 5 MWM probe metrics for CA3 SG power, and the 5 APA day 2 metrics for each
# property. The criteria use that family.
# (G) Predicted scores (Figures 2N, 2R, 3F, 3I, 4I, 4L): a linear regression of the screen
# cohort's score on its z-scored SWR property, applied to the replication cohort's z-scored
# property, correlated (Pearson) with the actual score. The printed F and percent of variance are
# those of this Pearson correlation (for example 0.56 = 11.4/(11.4+9)); they do not depend on the
# regression coefficients. fit_train_to_test.m also computes an out-of-sample F against the test
# mean; that is shown as a variant.
