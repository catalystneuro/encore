# Claims for Weible & Wehr (2022), J Alzheimers Dis 89(4) 1385-1402, on dandiset 002035.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-08,
# protocol pilot-13 as stated in docs/protocol.md.
#
# Text read: the author manuscript in PubMed Central (NIHMS1886685, PMC10097438), main text,
# Methods, figure legends and Tables 1 to 6, from paper/10.3233-jad-220538.txt. The figure
# panels of Figs. 1 to 7 were looked at in the PDF for their axis labels only. The version of
# record was not read. The paper has no supplement and links no code or data, so no code was read.
#
# The data the paper used (Methods, Mice, Sectioning, Immunohistochemistry, Imaging). 5XFAD
# heterozygous mice (n = 61) and wild-type littermates (n = 25) on a C57BL6/SJL background, at
# ages p14, p21, p30, p45, p60, p90, p120 and p150; 4 male and 4 female 5XFAD mice per age from
# p21 to p150, 3 male and 2 female at p14. (The Methods also give 31 females and 30 males, which
# the per-age numbers do not add up to; 30 females and 31 males would.) Six 30 um coronal sections
# per brain, 516 sections in all, labelled with anti-Abeta42 (Alexa 488, green) and DAPI (blue),
# imaged on a Zeiss Imager A.2 at 12.5X to 50X for atlas alignment, 200X for Abeta42 cells and
# plaques, 100X for DAPI cells, at several focal depths. Regions: primary auditory cortex (A1,
# eight laminar bins), subiculum, medial geniculate body (MGd, MGv, MGm), inferior colliculus
# (eIC, dIC, cIC), superior olivary complex (lateral, medial, periolivary), nucleus of the lateral
# lemniscus, cochlear nuclei, and the caudal pontine reticular nucleus (PRNc). A1, subiculum and
# MGB were counted in the same coronal section. Measured variables per mouse and region: the
# number of Abeta42+ cells over the number of DAPI cells (%Abeta42+ cells), plaques per mm2, and
# DAPI cells per mm2. The dandiset's title is the paper's title and it is a BIDS microscopy
# dataset, so it is taken to hold these section images.
#
# Methods fixed by the paper (Methods, Imaging, boundary determination, and quantification;
# Statistical analysis), used by every criterion below unless the claim says otherwise.
#  - Cells and plaques were counted by hand in Canvas X, blind to genotype, sex, age and
#    boundaries. A labelled cell has a well-defined membrane with processes and/or distinct
#    nuclear and cytoplasmic compartments, and is distinct from the autofluorescence of control
#    sections. Dense-core and diffuse plaques are counted together as plaques. Cell types are
#    not told apart. Any automated detection used in place of counting by eye is a deviation.
#  - Boundaries and subregions come from an affine alignment of each section to the Allen CCFv3
#    on DAPI and antibody landmarks. A1 layers by depth from the pia as fractions of cortical
#    thickness, L1, L2, L3, L4 12.5% each, L5 and L6 25% each, each split into A and B halves, so
#    eight bins of 12.5%. Areas from a stage-micrometer calibration.
#  - One value per mouse per region (or per layer or subregion). Non-parametric tests,
#    Kruskal-Wallis across ages, layers or subregions, Mann-Whitney for post hoc pairs and for
#    sex, Bonferroni correction where stated, alpha 0.05 (Tables 1 to 6).
#  - PRNc (Results, Caudal pontine reticular nucleus) counted in an 800 um diameter circle centred
#    on the region of highest apparent label density in ventrolateral PRNc; Abeta42+ cells over
#    40 um in diameter taken as putative giant reticulospinal neurons (RSNs).
#
# Details the paper leaves open, with the readings it allows (each claim's criterion repeats
# those that bear on it).
#  - How DAPI cells were counted in ImageJ. Readings (a) automatic threshold, watershed and
#    particle count; (b) counting by hand with a point tool. Either is a standard choice.
#  - How a mouse's value is formed from several images, fields or hemispheres. Readings (a) counts
#    and areas summed over all images of the region in that mouse, then the ratio; (b) the mean
#    of per-image values. Which hemisphere, or both, is not said.
#  - Whether the whole region was imaged at 200X or sampled fields were. Readings (a) the whole
#    region; (b) the fields available in the dataset for that region.
#  - Effect sizes are eta-squared computed as in the paper's reference [24] (Lenhard), which is
#    not given as a formula. The reported values agree with eta2 = (H - k + 1)/(n - k) for
#    Kruskal-Wallis and eta2 = z2/N for Mann-Whitney, with n near 61 mice for the age tests in
#    A1, subiculum, MGB, IC and SOC, about 38 mice for PRNc, and 24 mice (p90, p120, p150) for
#    the p90-p150 tests. This is a reading of the reported numbers, not a statement of the paper.
#  - The figure numbers in Tables 1 and 2 are off by one panel or one figure (Table 1 "Cells X
#    Age (Fig. 1B)" is Fig. 1C; Table 2 cites Fig. 2B and 2C for the subiculum, Fig. 3B and 3C).
#    The sources below cite the panels by their content.
