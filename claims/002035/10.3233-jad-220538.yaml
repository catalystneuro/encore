  quote: Aβ42+ cell density was very low but did vary as a function of age (Table 4), with the
    first cells appearing at p30, and roughly doubling in number between p90 and p150
  statistics:
  - about: all subregions
    test: Kruskal-Wallis
    statistic: chi2 = 28.9, df = 7, eta2 = 0.41
    p: 0.0002
  - about: external IC
    test: Kruskal-Wallis
    statistic: chi2 = 30.5, df = 7, eta2 = 0.47
    p: 0.0001
    p_relation: "<"
  expected:
    quantity: ratio of mean IC %Abeta42+ cells at p150 to p90
    value: 2
    tolerance: 0.2
  criterion: Per 5XFAD mouse, Abeta42+ cells over DAPI cells in the IC (eIC, dIC, cIC together),
    and in eIC alone; Kruskal-Wallis across ages for each. "Did not exceed 0.5% at any age" is
    read as (a) every age mean, or (b) every mouse. "Roughly doubling" is taken at the 10%
    tolerance. Reproduced when both tests have p < 0.05, no cells are found before p30, the
    p150 to p90 ratio is within tolerance and the 0.5% bound holds under one reading. Partially
    reproduced when the tests and the bound hold but the ratio does not.
- id: ic-cells-subregion
  statement: IC Abeta42+ cell density differs among subregions, higher in eIC than in dIC, and
    higher in eIC than in cIC though that difference does not pass the corrected threshold.
  source: Results, Inferior colliculus, paragraph 1; Table 4, Cells X Subregion
  quote: Cell density also varied among subregions (Table 4), with the external cortex (eIC)
    exhibiting a higher Aβ42+ cell density than both the dorsal cortex (dIC) and central nucleus
    (cIC; though the latter failed the significance threshold for multiple comparisons of p <
    0.017
  statistics:
  - test: Kruskal-Wallis
    statistic: chi2 = 14.5, df = 2, eta2 = 0.07
    p: 0.0007
  - about: eIC against dIC
    test: Mann-Whitney
    statistic: eta2 = 0.08
    p: 0.0002
    corrected: Bonferroni, threshold 0.017
  - about: eIC against cIC
    test: Mann-Whitney
    statistic: eta2 = 0.03
    p: 0.038
    corrected: Bonferroni, threshold 0.017, not significant
  criterion: Per 5XFAD mouse and subregion, Abeta42+ cells over DAPI cells, all ages (the
    reported eta2 fits about 61 mice times 3); Kruskal-Wallis, then Mann-Whitney pairs at 0.017
    (Table 4). Reproduced when the Kruskal-Wallis is significant, eIC is significantly higher
    than dIC, and eIC exceeds cIC in mean. The eIC against cIC p-value is reported; its passing
    0.017 does not count against the claim.
- id: fig5b-ic-plaques-age
  statement: IC plaques first appear around p90 and increase with age to 106.2 plaques/mm2 at
    p150, in each subregion.
  source: Results, Inferior colliculus, paragraph 1; Figure 5B; Table 4, Plaques X Age
  quote: Plaque density varied significantly with age, with plaques first appearing around p90 and
    reaching a peak mean density at p150 of 106.2 ± 16.2 S.E. plaques/mm2 (Fig. 5B, Table 4)
  statistics:
  - about: all subregions
    test: Kruskal-Wallis
    statistic: chi2 = 54.5, df = 7, eta2 = 0.90
    p: 0.0001
    p_relation: "<"
  - about: external IC
    test: Kruskal-Wallis
    statistic: chi2 = 51.1, df = 7, eta2 = 0.88
    p: 0.0001
    p_relation: "<"
  - about: central IC
    test: Kruskal-Wallis
    statistic: chi2 = 53.3, df = 7, eta2 = 0.93
    p: 0.0001
    p_relation: "<"
  - about: dorsal IC
    test: Kruskal-Wallis
    statistic: chi2 = 48.4, df = 7, eta2 = 0.83
    p: 0.0001
    p_relation: "<"
  expected:
    quantity: mean IC plaque density at p150
    value: 106.2
    tolerance: 16.2
    unit: plaques/mm2
  criterion: Per 5XFAD mouse, plaques per mm2 in the IC as a whole and in each subregion;
    Kruskal-Wallis across ages for each (Table 4). Reproduced when all four are significant at
    p < 0.05, the first age with plaques is p90 (Figure 5B shows none at p60), p150 is the
    highest age mean, and the p150 mean is within tolerance (the paper's S.E.).
- id: fig5c-ic-plaques-subregion
  statement: IC plaque density differs among subregions, highest in eIC, then dIC, lowest in cIC,
    with eIC significantly above cIC.
  source: Results, Inferior colliculus, paragraph 1; Figure 5C; Table 4, Plaques X Subregion;
    Discussion, paragraph 4
  quote: During the p90-p150 timeframe, plaque density also varied significantly among eIC, dIC,
    and cIC (Fig. 5C, Table 4) with the highest density observed in eIC, followed by dIC
  statistics:
  - test: Kruskal-Wallis
    statistic: chi2 = 6.1, df = 2, eta2 = 0.06
    p: 0.05
    p_relation: "<"
  - about: eIC against cIC
    test: Mann-Whitney
    statistic: eta2 = 0.12
    p: 0.016
    corrected: Bonferroni, threshold 0.017
  criterion: Per mouse and subregion, plaques per mm2; Kruskal-Wallis across eIC, dIC and cIC,
    then Mann-Whitney pairs at 0.017 (Table 4). The ages are read as (a) p90 to p150 (Results;
    the reported eta2 fits about 24 mice) or (b) all ages (Figure 5C is labelled all ages).
    Reproduced when, under one reading, the Kruskal-Wallis is significant, the means order eIC
    > dIC > cIC, and eIC against cIC passes 0.017. Partially reproduced when the order holds but
    a test does not. The Table 4 values for this test equal those of the MGB subregion test in
    Table 3 (chi2 6.1, eta2 0.06); this is noted, not judged.
- id: ic-no-sex
  statement: IC plaque density does not differ between the sexes.
  source: Results, Inferior colliculus, paragraph 1
  quote: No significant differences in plaque density were detected between the sexes
  criterion: A claim of absence. Mann-Whitney of females against males on per-mouse IC plaque
    density at alpha 0.05 (Methods), mice aged p90 to p150 as for the other sex tests on
    plaques. Reproduced when p >= 0.05; the means and p are reported either way.
- id: fig6b-soc-cells
  statement: Abeta42+ cells in the SOC vary in density with age but never exceed 0.5% of DAPI
    cells in males or females.
  source: Results, Superior olivary complex, nucleus of the lateral lemniscus, and cochlear nuclei,
    paragraph 1; Figure 6B; Table 5
  quote: We observed a sufficient number of Aβ42+ cells in SOC to determine that their density did
    vary as a function of age (Fig. 6B, Table 5). However, at no age did cell density exceed 0.5%
    in either males or females
  statistics:
  - test: Kruskal-Wallis
    statistic: chi2 = 14.9, df = 7, eta2 = 0.15
    p: 0.04
  criterion: Per 5XFAD mouse, Abeta42+ cells over DAPI cells in the SOC (lateral, medial and
    periolivary together); Kruskal-Wallis across ages. The 0.5% bound is read as (a) every mean
    by age and sex, or (b) every mouse. Reproduced when p < 0.05 and the bound holds under one
    reading. Partially reproduced when the bound holds and the test does not.
- id: soc-plaques-rare
  statement: Plaques in the SOC are exceptionally rare, 3 in total in 2 of 61 5XFAD mice, all in
    the lateral SOC.
  source: Results, Superior olivary complex, nucleus of the lateral lemniscus, and cochlear nuclei,
    paragraph 1; Figure 6A inset 1a
  quote: Plaques in the SOC were exceptionally rare, with only 3 plaques in total observed in 2 of
    61 mice, all in the lateral SOC
  expected:
  - quantity: plaques in the SOC over all 5XFAD mice
    value: 3
    tolerance: 0.3
  - quantity: 5XFAD mice with any SOC plaque
    value: 2
    tolerance: 0.2
  criterion: Plaque counts in the SOC of each 5XFAD mouse. Reproduced when the counts match and
    every plaque is in the lateral SOC. Partially reproduced when the counts are outside
    tolerance but every plaque found is in the lateral SOC.
- id: fig6cd-nll-cn-none
  statement: There are no Abeta42+ cells or plaques in the nucleus of the lateral lemniscus or the
    cochlear nuclei through p150.
  source: Results, Superior olivary complex, nucleus of the lateral lemniscus, and cochlear nuclei,
    paragraph 1; Figure 6C and 6D
  quote: We saw no evidence of Aβ42+ cells or plaques in either the nLL or the CN (Fig. 6C, D)
  criterion: Counts of Abeta42+ cells and plaques in the nLL and in the dorsal and ventral
    cochlear nuclei of every 5XFAD mouse. Reproduced when none is found, not reproduced when
    any is; the counts are reported either way.
- id: fig7b-prnc-cells
  statement: Intracellular Abeta42 appears in the PRNc, in putative giant reticulospinal neurons
    and smaller cells, as early as p14 and consistently by p21; the overall Abeta42+ cell density
    (below 2%) varies with age, with a trend for the RSNs alone.
  source: Results, Caudal pontine reticular nucleus, paragraph 1; Figure 7B; Table 6
  quote: We observed intracellular Aβ42 both in putative giant RSNs and other smaller cells in the
    PRNc as early as p14, and consistently by p21 (Fig. 7B) ... The density of the overall Aβ42+
    cell population varied with age, with a trend also seen specifically for RSNs (Fig. 7B,
    Table 6)
  statistics:
  - about: all Abeta42+ cells
    test: Kruskal-Wallis
    statistic: chi2 = 14.7, df = 7, eta2 = 0.26
    p: 0.04
  - about: putative giant RSNs
    test: Kruskal-Wallis
    statistic: chi2 = 11.8, df = 7, eta2 = 0.16
    p: 0.11
  criterion: Per 5XFAD mouse, in the 800 um circle of the Results, Abeta42+ cells over DAPI cells,
    and Abeta42+ cells over 40 um diameter over DAPI cells; Kruskal-Wallis across ages for
    each. The circle's centre ("region of highest apparent density") is placed by eye, as the
    paper did. The reported eta2 fits about 38 mice, so the mice with a PRNc section are used.
    Reproduced when the all-cell test has p < 0.05, at least one p14 mouse and more than half
    the p21 mice have Abeta42+ cells, and every age mean is below 2% (Figure 7B legend). The
    paper sets no threshold for a trend, so the RSN test's p is reported and not judged.
    Partially reproduced when the onset and bound hold but the all-cell test does not.
- id: fig7c-prnc-plaques
  statement: Plaques in the PRNc first appear at p90 and vary in density with age.
  source: Results, Caudal pontine reticular nucleus, paragraph 1; Figure 7C; Table 6
  quote: Plaques, first evident at p90, also varied in density with age (Fig. 7C, Table 6)
  statistics:
  - test: Kruskal-Wallis
    statistic: chi2 = 35.9, df = 7, eta2 = 0.96
    p: 0.0001
    p_relation: "<"
  criterion: Per 5XFAD mouse, plaques per mm2 in the 800 um circle; Kruskal-Wallis across ages.
    Reproduced when p < 0.05 and no plaques are found before p90.
- id: prnc-no-sex
  statement: PRNc pathology shows no sex differences.
  source: Results, Caudal pontine reticular nucleus, paragraph 1
  quote: No sex-linked differences were observed
  criterion: A claim of absence. Mann-Whitney of females against males (Methods) at alpha 0.05, on
    per-mouse %Abeta42+ cells (all ages with a PRNc section) and on plaque density (p90 to
    p150). Reproduced when neither is significant; the means and p-values are reported either
    way.
- id: cells-before-plaques
  statement: In A1, subiculum and IC, Abeta42+ cells are first seen about 2 months before plaques.
  source: Discussion, paragraph 3
  quote: In cortex, subiculum, and inferior colliculus, Aβ42+ cells were first observed roughly 2
    months prior to the appearance of plaques
  depends_on:
  - fig1a-a1-onset-p21
  - fig3a-subiculum-onset
  - ic-cells-low
  - fig2b-a1-plaques-age
  - fig5b-ic-plaques-age
  expected:
    quantity: lag from first Abeta42+ cells to first plaques, per region
    value: 60
    tolerance: 6
    unit: days
  criterion: The first ages of cells and of plaques from the claims named under depends_on. The
    sampled ages make the lag one of a few values (the paper's own lags are 46 days for
    subiculum, p14 to p60, 69 for A1, p21 to p90, and 60 for IC, p30 to p90), so the 10%
    tolerance cannot apply and "roughly 2 months" is taken as 45 to 70 days, the span of the
    paper's own lags. Reproduced when all three regions fall in it.
- id: l5-pyramidal-fraction
  statement: At least 24% of L5A and 11% of L5B pyramidal neurons in A1 are Abeta42+ at 5 months
    of age, an estimate from the Abeta42+ cell densities and the prevalence of pyramidal neurons
    in L5.
  source: Discussion, paragraph 3
  quote: Based on the prevalence of pyramidal ... neurons in L5 [30], we estimate that at least 24%
    of L5A (and 11% of L5B) pyramidal neurons are Aβ42+ at 5 months of age
  data: with_inputs
  depends_on:
  - fig1e-l5a-peak
  expected:
  - quantity: Abeta42+ fraction of L5A pyramidal neurons at p150
    value: 24
    tolerance: 2.4
    unit: "%"
  - quantity: Abeta42+ fraction of L5B pyramidal neurons at p150
    value: 11
    tolerance: 1.1
    unit: "%"
  criterion: The p150 mean %Abeta42+ cells of L5A and L5B divided by the fraction of L5 cells
    that are pyramidal neurons, taken from the paper's reference [30] (Ero et al. 2018, A cell
    atlas for the mouse brain, Front Neuroinform 12, 84); the paper does not state the fraction
    or which values of that atlas it used. Whether the
    fraction is of DAPI cells or of neurons is open; readings (a) pyramidal neurons as a
    fraction of all cells, (b) as a fraction of neurons, with neurons a fraction of DAPI cells
    from the same reference. Reproduced when both values are within tolerance under one reading.
