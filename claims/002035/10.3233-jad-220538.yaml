- id: a1-first-in-pathway
  statement: In 5XFAD mice amyloid pathology in the central auditory pathway appears first in A1,
    as intracellular Abeta42 in layer 5 neurons by p21, before any label in MGB, IC, SOC, nLL or
    CN.
  source: Results, Primary auditory cortex, paragraph 1; Discussion, paragraph 1; Figure 1A
  quote: Amyloid pathology in the central auditory pathway of Aβ42+ mice appeared first in A1
  criterion: For each auditory region (A1, MGB, IC, SOC, nLL, CN), the youngest age at which any
    5XFAD mouse shows an Abeta42+ cell or a plaque, counted as in the opening comment. The paper
    gives A1 cells at p21 (one cell at p14), IC cells at p30, MGB, IC and A1 plaques at p90, and
    no age for SOC cells. "Appeared first" can be read as (a) the first age with label in any
    mouse, or (b) the first age with label in most mice of that age. Reproduced when, under one
    reading, A1 is the earliest region and no other auditory region shows label at an age
    earlier than A1.
