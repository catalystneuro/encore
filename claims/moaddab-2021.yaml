  source: Results, Exaggerated threat probability signaling, paragraph 2; Figure 5A
  quote: 'Tuning curve peaks for each cluster were k4 = 0.875 and k6 = 0.625, now exceeding even fear
    output. K8 neurons were more tuned to the actual shock probability, with a peak of 0.250 that
    flattened toward 0.000.'
