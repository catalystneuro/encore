    tolerance: 0
  - quantity: k6 peak assignment
    value: 0.625
    tolerance: 0
  - quantity: k8 peak assignment
    value: 0.25
    tolerance: 0
  criterion: As fig5a-tuning-peaks-exaggerated, with the betas of k4, k6 and k8 multiplied by -1
    (Results). Reproduced when, under one reading, all three peaks match; partially reproduced when
    k4 and k6 peaks exceed 0.375 and k8 peaks at 0.375 or below.
  depends_on:
  - kmeans-clusters

