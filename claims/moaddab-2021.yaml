- id: cluster-firing-characteristics
  statement: Clusters differed in baseline firing rate, coefficient of variance and coefficient of
    skewness, but not in anterior-posterior location, waveform half-duration or waveform amplitude
    ratio.
  source: Results, Diverse cue firing patterns, paragraph 3; Figure 1F; Figure S3
  quote: found a main effect of cluster for baseline firing rate (F7,415 = 2.48, p = 0.017, hp2 =
    0.04, op = 0.88), coefficient of variance (F7,415 = 2.28, p = 0.027, hp2 = 0.04, op = 0.84),
    and coefficient of skewness (F7,415 = 2.65, p = 0.011
  statistics:
  - about: baseline firing rate
    test: multivariate analysis of variance, between-subjects factor cluster
    statistic: F(7, 415) = 2.48
    p: 0.017
  - about: coefficient of variance
    test: multivariate analysis of variance, between-subjects factor cluster
    statistic: F(7, 415) = 2.28
    p: 0.027
  - about: coefficient of skewness
    test: multivariate analysis of variance, between-subjects factor cluster
    statistic: F(7, 415) = 2.65
    p: 0.011
  criterion: Measures from STAR Methods, Firing and waveform characteristics. Baseline rate is the
    mean rate in the 10 s before cue onset; CV is SD/mean and skewness 3 x (mean - median)/SD of the
    inter-spike intervals in the 20 s before cue onset over the 16 trials; half duration and
    amplitude ratio from the mean waveform as defined there; anterior-posterior location the
    recording bregma level. A MANOVA with cluster as between-subjects factor and the six measures,
    with the univariate tests read for each. Open is whether the inter-spike intervals are pooled
    over the 16 trials (main reading) or the measure is averaged over trials (variant). Reproduced
    when baseline rate, CV and skewness have p < 0.05 and location, half duration and amplitude ratio
    do not; partially reproduced when at least two of the three effects hold and no other measure
    is significant. Effect sizes are given either way.
  depends_on:
  - kmeans-clusters

