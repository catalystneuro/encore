# Claims for Moaddab & McDannald (2021), Curr Biol 31:2099-2110, "Retrorubral field is a hub for
# diverse threat and aversive outcome signals", on CRCNS data set rrf-1 (doi:10.6080/K04B2ZJ5).
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"), 2026-11-06,
# protocol as stated in docs/protocol.md (Reader), version pilot-13.
#
# Text read: the version of record with its supplemental information, as supplied under paper/
# (PyMuPDF text of the journal PDF): Results, Discussion, figure legends, Table 1, STAR Methods,
# and the supplement (Figures S1 to S6, Tables S1 to S4). The text garbles powers of ten ("2.80 3
# 10�11" is 2.80 x 10^-11, "5.93E�38" is 5.93E-38); p-values below are read from them, and the
# quote checker cannot find these, so they were confirmed by reading (also Table S3's "1.50E-02",
# "1.16E-04", "2.39E-04", and the Figure S4 bound printed "1-.62"). The column layout of Tables
# S1 to S4 and the Figure 6 panels were read from the PDF pages rendered as images: Table S1 rows
# are danger vs. uncertainty then uncertainty vs. safety; Table S2 columns are peak threat
# probability, fear output, then their difference; Table S3 rows are the regressor x bin
# interaction then the main effect of regressor; Table S4 rows are danger, uncertainty shock,
# uncertainty omission, safety. The gray boxes of Figure 6 (the analysed outcome interval) span 0
# to 8 s after shock offset for k1, k3, k5 and k6, and the whole 17.5 s for k2, k4, k7 and k8.
#
# Code. The paper says its "MATLAB code will be uploaded to http://crcns.org/", which puts it inside
# the data set, which the reader may not open; the lab page it names for behavior programs
# (http://mcdannaldlab.org/resources) returned 404 on 2026-11-06. No code was read; every method
# below is from the STAR Methods, the Results, the figure legends or the supplement.
#
# Data the paper used. 11 male Long Evans rats (14 implanted, 3 excluded for placement), 16-wire
# drivable microelectrode bundles in the retrorubral field (RRF, bregma -6.36 to -7.08). 743 single
# units over 228 recording sessions; 423 cue-responsive units from 190 sessions. Each session has 16
# trials: 4 danger (shock p = 1.00), 2 uncertainty shock and 6 uncertainty omission (p = 0.25), and
# 4 safety (p = 0.00), in random order, mean inter-trial interval 3.5 min. Cues are 10 s; the foot
# shock (0.5 mA, 0.5 s) starts 2 s after cue offset. Measured variables are spike times and mean
# waveforms per unit, cue and shock times, and nose pokes (rewarded on VI-60) from which the
# per-trial suppression ratio is computed (baseline 20 s before cue onset, cue 10 s). The CRCNS data
# set, by its title and description, holds the 743 sorted units from 228 sessions of the 11 rats,
# with per-trial firing, nose-poke and suppression-ratio data and waveforms.
#
# Shared method (STAR Methods, Z-score normalization). Per unit and trial type, firing rate in 250-ms
# bins from 20 s before cue onset to 20 s after cue offset (200 bins), averaged over trials; the mean
# of the 2 s before cue onset of that trial type is subtracted; the result is z-scored across all
# trial types of the unit. Open, and named where it matters: (z-a) the z-score taken over four trial
# types (danger, uncertainty shock, uncertainty omission, safety; the Figure 2 heat plot shows four)
# or (z-b) over three (uncertainty trials pooled, as the cue analyses collapse them). For the cue
# period uncertainty is the mean over its 8 trials (Methods, Population and single-unit firing
# analyses; a standard choice where the two subtypes would otherwise be weighted). The outcome period
# is the 17.5 s after shock offset (12.5 to 30 s after cue onset; Figure 6 legend), the same time on
# trials without shock.
#
# Cluster identity. Claims after kmeans-clusters use the eight clusters k1 to k8. Open is which
# assignment is used: (c-a) the paper's own cluster labels, where the data set holds them; (c-b) the
# k-means clusters found here (kmeans-clusters), each matched to the paper's k1 to k8 by its cue
# firing pattern as described in Results, Diverse cue firing patterns, paragraph 3. Both are run
# where both exist; outcomes resting on (c-b) alone are marked as resting on that matching.
#
# Statistical conventions (STAR Methods). 95% bootstrap CIs are studentized intervals from MATLAB
# bootci with 1,000 resamples; an effect is observed when the CI excludes zero. ANOVAs report F, p,
# partial eta squared and observed power (SPSS). The reported effect sizes of Table 1 fit a
# repeated-measures design with units as subjects and trial type and interval within units (k1,
# F 4.00 on 110 and 3520 df gives partial eta squared 0.11, as printed), so the per-cluster ANOVAs
# are run that way; whether a sphericity correction was applied is not stated (uncorrected df are
# the main reading, Greenhouse-Geisser a variant).
schema_version: 2
dataset:
  archive: crcns
  id: rrf-1
  doi: 10.6080/K04B2ZJ5
paper: doi:10.1016/j.cub.2021.02.055
claims:
- id: units-and-sessions
  statement: The paper recorded 743 single units from 11 rats over 228 fear discrimination sessions.
  source: Results, Diverse cue firing patterns, paragraph 1
  quote: We recorded 743 single units from 11 rats over 228 fear discrimination sessions.
  expected:
  - quantity: single units
    value: 743
    tolerance: 74
  - quantity: recording sessions
    value: 228
    tolerance: 23
  - quantity: rats
    value: 11
    tolerance: 0
  criterion: Counts of units, distinct sessions and rats. Reproduced when all three are within
    tolerance; the rat count must match exactly.

- id: behavior-discrimination
  statement: In the sessions that yielded cue-responsive units, rats fully discriminated the cues
    by suppression ratio (danger > uncertainty > safety), with a main effect of cue and 95%
    bootstrap CIs of every differential suppression ratio excluding zero.
  source: Results, opening section, paragraph 2; Figure 1B
  quote: Analysis of variance (ANOVA) for suppression ratio revealed a main effect of cue ... 95%
    bootstrap CIs for differential suppression ratios did not contain zero for any cue comparison
  statistics:
  - about: main effect of cue
    test: ANOVA
    statistic: F(2, 20) = 103.57
    p: 2.80e-11
    n: 11 rats
  - about: danger minus uncertainty
    test: 95% bootstrap CI
    ci:
      level: 0.95
      low: 0.34
      high: 0.56
  - about: uncertainty minus safety
    test: 95% bootstrap CI
    ci:
      level: 0.95
      low: 0.06
      high: 0.53
  - about: danger minus safety
    test: 95% bootstrap CI
    ci:
      level: 0.95
      low: 0.75
      high: 0.94
  expected:
  - quantity: mean differential suppression ratio, danger minus uncertainty
    value: 0.42
    tolerance: 0.14
  - quantity: mean differential suppression ratio, uncertainty minus safety
    value: 0.40
    tolerance: 0.34
  - quantity: mean differential suppression ratio, danger minus safety
    value: 0.82
    tolerance: 0.12
  criterion: Suppression ratio per trial as (baseline poke rate - cue poke rate) / (baseline + cue),
    baseline the 20 s before cue onset, cue the 10 s cue (STAR Methods, Calculating suppression
    ratios). Sessions are those with at least one cue-responsive unit (Figure 1B legend; depends on
    cue-responsive-units), each counted once. Per rat, the mean over those sessions of each cue's
    mean ratio (uncertainty over its 8 trials); a repeated-measures ANOVA on cue over the 11 rats
    (the printed df, 2 and 20, fit this). Differences per rat with studentized bootstrap CIs.
    Tolerances are the distance from the paper's mean to the farther bound of its CI. Open is
    whether rat values are means over sessions (main reading) or over all pooled trials of those
    sessions (variant). Reproduced when the cue effect has p < 0.05, all three CIs exclude zero
    and the three means are within tolerance; partially reproduced when the ANOVA and the order hold
    but a CI or a mean does not.
  depends_on:
  - cue-responsive-units

- id: cue-responsive-units
  statement: 423 units, from 190 sessions, were cue responsive, with no fewer than 11 per rat.
  source: Results, Diverse cue firing patterns, paragraph 1; Figure S1
  quote: Four hundred and twenty-three cue-responsive single units were obtained from 190 sessions,
    and no fewer than 11 single units were identified per rat
  expected:
  - quantity: cue-responsive units
    value: 423
    tolerance: 42
  - quantity: sessions with cue-responsive units
    value: 190
    tolerance: 19
  - quantity: fewest cue-responsive units in one rat
    value: 11
    tolerance: 1.1
  criterion: Screen from STAR Methods, Identifying cue-responsive neurons. For each unit and each
    cue (danger 4 trials, uncertainty 8 trials pooled, safety 4 trials), the raw firing rate in the
    10 s before cue onset is compared per trial with the mean rate in the first 1 s and in the last
    5 s of the cue by a paired, two-tailed t test; a unit is cue responsive when any of the six
    tests has p < 0.05, uncorrected, as the paper states. Reproduced when the three counts are
    within tolerance. Figure S1 gives per-rat counts (RB01 35, RB03 53, RB04 24, RB06 59, RB07 29,
    RB09 33, RB10 18, RB11 11, RB12 47, RB13 69, RB14 45), which are reported alongside.

- id: kmeans-elbow
  statement: In k-means clustering of the 423 cue-responsive units, the mean squared Euclidean
    distance to the centroid falls as the cluster number rises from 1 to 15, and the decrease
    diminishes after eight clusters.
  source: Results, Diverse cue firing patterns, paragraph 2; Figure 1E
  quote: Euclidean distance from the centroid decreased as cluster number increased, with the
    amount of decrease diminishing after a cluster number of eight
  criterion: Matrix of 423 units x 54 epochs of normalized firing (Results; the Methods say "Firing
    rate", so raw rate is a variant), 1-s means of the 250-ms bins; epochs 1-30 the ten 1-s cue
    intervals for danger, uncertainty and safety, epochs 31-54 six 1-s intervals after shock or
    omission for danger, uncertainty shock, uncertainty omission and safety (STAR Methods, K-means
    clustering). MATLAB kmeans defaults (squared Euclidean, k-means++). Open are (e-a) whether the
    six outcome epochs start at shock onset (12 s after cue onset) or at shock offset (12.5 s, the
    start of the outcome period in Figure 6), and (e-b) whether "Clustering was performed 10 times"
    means ten replicates per k keeping the best, or ten runs averaged; all four combinations are
    run. The paper judges the elbow by eye; as a standard choice the claim is reproduced when the
    curve decreases from k = 1 to 15 and every drop from k to k + 1 for k >= 8 is smaller than the
    drop from 7 to 8, under the z-a and z-b normalizations alike or one of them.
  depends_on:
  - cue-responsive-units

