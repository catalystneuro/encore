- id: fig5a-tuning-peaks-exaggerated
  statement: Threat tuning curves of k1, k3 and k5 peak at an uncertainty assignment of 0.375 and k7
    at 0.500, above the actual shock probability of 0.250 (exaggerated threat probability
    signaling).
  source: Results, Exaggerated threat probability signaling, paragraphs 1 and 2; Figure 5A and 5B
  quote: 'In support, tuning curve peaks exceeded 0.250: k1, k3, and k5 = 0.375 and k7 = 0.500.'
  expected:
  - quantity: k1 peak assignment
    value: 0.375
    tolerance: 0
  - quantity: k3 peak assignment
    value: 0.375
    tolerance: 0
  - quantity: k5 peak assignment
    value: 0.375
    tolerance: 0
  - quantity: k7 peak assignment
    value: 0.5
    tolerance: 0
  criterion: Per unit, a regression (MATLAB regress, with a constant) of each trial's normalized
    firing on the trial's suppression ratio (fear output) and the cue's threat probability (danger
    1, safety 0, uncertainty set in turn to 0, 0.125 ... 1), over the 16 trials of the unit's
    session, run in each 1-s bin (STAR Methods, Single-unit linear regression and Threat probability
    tuning curve; the Methods print 0.025 for 0.375, a typo). The tuning curve is the cluster mean of
    the threat probability beta per assignment; the peak is the assignment of largest mean. Open
    are (t-a) which bins are averaged, the 10 cue bins (Methods) or the cluster-specific periods of
    Figure 3A and 3C (Results), which for k3, k5 and k7 include the 2-s delay; and (t-b) how a
    single trial's firing is normalized, either the trial's baseline-subtracted rate z-scored with
    the unit's mean and SD from the shared normalization, or the trial rates z-scored across the
    unit's 16 trials. All four combinations are run. The grid step (0.125) is larger than 10%, so
    each peak must match exactly. Reproduced when, under one reading, all four peaks match;
    partially reproduced when all four exceed 0.250 but not all match.
  depends_on:
  - kmeans-clusters

