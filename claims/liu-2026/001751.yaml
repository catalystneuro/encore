  source: Results, Altered connectivity profile of deep-layer AIC neurons, paragraph 2; Figure 5i;
    Supplementary Table 5
  quote: A breakdown of these connections by cell type revealed that PCs formed monosynaptic
    connections with other PCs in 24 out of 503 tested pairs (Supplementary Table 5 )
  expected:
  - quantity: PC-to-PC connections
    value: 24
    tolerance: 2.4
  - quantity: PC-to-PC pairs tested
    value: 503
    tolerance: 50
  - quantity: PC-to-PC connection rate
    value: 4.77
    tolerance: 0.48
    unit: percent
