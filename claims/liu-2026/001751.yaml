# Claims for Liu, Huang, Shen, Shao, Jing et al. (2026), "An atlas of primate insular cortex
# reveals a signal-processing strategy in von Economo neurons", Nature Cell Biology 28,
# 1742-1757, doi:10.1038/s41556-026-02009-4 (named on the archive "Cell Atlas and Novel Signal
# Processing Strategy in Primate Insular Cortex"), on dandiset 001751.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21,
# protocol as stated in docs/protocol.md (version pilot-10).
#
# Text read: the version of record, open access, as served by Europe PMC (PMC13457102), stored
# under paper/: main text, figure legends, Extended Data figure legends, Methods, Data and Code
# availability. No PDF was available, so values printed only inside figures could not be read.
# The Supplementary Information (Supplementary Figs. 1 to 17, Supplementary Tables 1 to 12) and
# the Source Data files were not in the text read. Supplementary Table 5 ("Number of neurons and
# tested neuron pairs of potential connectivities") bears on the claims this dataset can test,
# but every count those claims rest on is printed in the Results and the Fig. 5 legend, which
# were read; claims that cite other supplementary items rest on the main text and say so.
#
# Code read: github.com/RFLiu2021/AIC_proj at commit 44cd8a6dfbb1f1ce363d73742e4f3652086b0f9d
# (2026-07-05), and PatchAnaLab 1.0 (Zenodo doi:10.5281/zenodo.19995355), the paper's analysis
# package. AIC_proj holds MATLAB and Python scripts per figure (file names follow an older figure
# numbering) and small data tables; its processed data are in Zenodo doi:10.5281/zenodo.18814764
# (concept doi:10.5281/zenodo.17799559, 11 GB of RAR archives, not opened). For the multi-patch
# recordings of Fig. 5d-i it holds:
#  - ephysio/Fig5fg_plotConn.m, which plots the example of Fig. 5f,g from slice 20190315 s4
#    (files 20190315s4c2r1.dat and 20190315s4c6r1.dat): test round 2 of each file, cell 1 to 6
#    on HEKA channels 1, 2, 3, 6, 7 and 8, traces resampled from 25 kHz to 1 kHz, averaged over
#    sweeps and low-passed with filter_300Lowpass (PatchAnaLab helpers/, a 2nd-order Butterworth
#    at 300 Hz applied with filtfilt). It plots; it detects nothing.
#  - ephysio/Fig5e_plotConnexampleFPs.m, the firing patterns of Fig. 5e, cell types VEN, PC, PC,
#    VEN, VEN, PC for cells 1 to 6.
#  - ephysio/data_ephy/rawdata_ephysio/metadata_multiPatch.xlsx, one row per tested ordered pair,
#    naming the subject, slice, original file, deposited NWB file, presynaptic and postsynaptic
#    channel and cell type (PC, VEN, GABA), and for connected pairs ConnType (Ext or Inh),
#    connQuality (Excellent, Good, OK) and the projection ("2→8"). Tallied here (the table only,
#    not the dataset), it lists 1,416 ordered pairs among 298 cells (207 PC, 56 VEN, 40 GABA) in
#    55 slices of 6 subjects, and 26 annotated connections. Pairs by type (the paper's count in
#    brackets): PC-to-PC 749 (503), VEN-to-PC 146 (200), PC-to-VEN 145 (200), VEN-to-VEN 59
#    (110), PC-to-IN 84 (65), IN-to-PC 86 (65), VEN-to-IN 54 (55), IN-to-VEN 54 (55), IN-to-IN 39
#    (not stated; 1,292 minus the stated types is 39). Connections: PC-to-PC 18 (24; 11 Ext and
#    7 Inh), VEN-to-PC 1 (0; slice 190315s2, VEN 4 to PC 6, Ext, Excellent), PC-to-VEN 1 (1),
#    PC-to-IN 2 (2), IN-to-PC 4 (4). Its column Nr_Conn disagrees with its own annotations in 6
#    slices, and one row (20241105venHS16, channel 6 to 3) carries the projection label "8→5".
# No code in either source detects a connection; the rule is not given (see the criteria).
#
# Data the paper describes. Adult macaques (Macaca fascicularis, 4 to 6 years). scRNA-seq, 7
# animals (two females, five males), 22 samples, 122,663 cells; Patch-seq, 12 males, 578 neurons
# (462 with intrinsic properties, 166 reconstructed, 307 with transcriptomes kept); whole-cell
# recording and local connectivity, 20 animals (one female, 19 males). Acute 300 um coronal slices
# of the VEN-enriched anterior insular cortex (AIC), recordings at room temperature.
#  - Fig. 5d-i, the data of this dandiset (title "Electrophysiological Dataset of Local Neuronal
#    Microcircuits in the Primate Anterior Insular Cortex"; description, connectivity "assessed
#    using simultaneous multi-patch-clamp recordings in crab-eating monkeys"; the paper's Data
#    availability names it "multi-Patch recording"). Simultaneous whole-cell recordings of up to
#    eight layer 5b neurons (two Quadro EPC 10 amplifiers, HEKA), 377 neurons, 1,292 potential
#    connections tested. Presynaptic APs evoked by 2 nA, 2 ms current pulses at 0.01 to 0.1 Hz;
#    postsynaptic membrane potential held at -70 +/- 3 mV for uEPSPs and -60 +/- 3 mV for uIPSPs;
#    responses averaged over more than 20 sweeps. Firing patterns recorded with +10 pA steps every
#    second. Cells identified as VEN, PC or interneuron (IN) by firing pattern and post hoc
#    morphology. Measured variable, membrane potential (V) of every cell over time.
#  - Other recordings, deposited elsewhere: Patch-seq electrophysiology (DANDI:001746), somatic
#    Na+ currents (DANDI:001750), postsynaptic currents (DANDI:001752); scRNA-seq and Patch-seq
#    reads (GEO GSE319557 and GSE319369); metabolomics (MetaboLights MTBLS13927); morphologies
#    (NeuroMorpho.org, doi:10.13021/y4be-0p18).
#
# The paper cites no version of the dandiset. Cell types and connections: if the dataset does not
# carry them, the only source the paper's code gives is metadata_multiPatch.xlsx, matched through
# the NWB file names it lists; claims that use it are then data with_labels, and the attempt adds
# a link claim. Details the paper leaves open are named in each criterion with the readings its
# text allows. Where a criterion uses p < 0.05 and the paper prints no alpha in the text read,
# that is the conventional reading of "significantly", and is said so.
schema_version: 2
dataset:
  archive: dandi
  id: "001751"
paper: doi:10.1038/s41556-026-02009-4
claims:
- id: fig5d-connectivity-totals
  statement: Simultaneous recordings of up to eight layer 5b neurons tested 1,292 potential
    connections among 377 neurons and found 31 monosynaptic connections.
  source: Results, Altered connectivity profile of deep-layer AIC neurons, paragraph 2; Figure 5d
  quote: In total, we tested 1,292 potential connections from an additional set of 377 neurons in
    layer 5b and confirmed 31 monosynaptic connections.
  expected:
  - quantity: potential connections tested
    value: 1292
    tolerance: 129
  - quantity: neurons
    value: 377
    tolerance: 38
  - quantity: monosynaptic connections
    value: 31
    tolerance: 3.1
  criterion: A neuron is one recorded cell (one channel of one slice recording, counted once
    across the files of that slice). A potential connection is an ordered pair, a presynaptic cell
    stimulated while another cell of the same slice is recorded; the paper counts direction
    apart (VEN-to-PC and PC-to-VEN each 0 or 1 of 200, Results), so ordered pairs are the reading
    its text gives. A connection is a uEPSP or uIPSP evoked by single presynaptic spikes in the
    response averaged over more than 20 sweeps (Fig. 5f legend), uEPSPs at -70 mV and uIPSPs at
    -60 mV (Methods). The paper and its code give no amplitude, latency or noise rule for calling
    a connection, so the connections counted are those annotated, with two readings of the
    annotation, (a) the dataset's own connection labels and (b) the ConnType annotations of the
    code's metadata_multiPatch.xlsx, matched through file name and channels; each is run where it
    exists, and when neither exists the claim is blocked as methods_underspecified. Whether the
    code's "OK" quality connections count is not said; counted, with the count without them shown.
    A detection from the traces themselves would be the author's rule and is shown only as a
    variant that does not decide. Reproduced when all three counts are within tolerance under
    every reading run; blocked as methods_underspecified when the readings disagree.
