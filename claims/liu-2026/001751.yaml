  - fig5d-connectivity-totals
  criterion: Pairs, connections and their readings as in fig5d-connectivity-totals; cell types
    as the dataset labels them, or as metadata_multiPatch.xlsx labels them when the dataset does
    not (identified by firing pattern and post hoc morphology, Methods). The rate is connections
    over ordered pairs tested (24/503 = 4.77%, as in Fig. 5i). A connection is counted whatever
    its sign, the reading the Results give ("monosynaptic connections"); the code's table marks
    some PC-to-PC connections "Inh", and the count of excitatory ones alone is shown as a variant.
    Reproduced when the three values are within tolerance under every reading run.
