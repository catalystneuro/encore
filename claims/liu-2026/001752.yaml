  - about: ANCOVA, model against real neurons, intercept
    test: ANCOVA
    statistic: F(1, 93) = 1.07
    p: 0.5729
  - about: ANCOVA, slope
    test: ANCOVA
    p: 0.0031
  - about: slope in the simulated VEN model
    test: two-tailed Student's t-test
    p: 0.0015
  - about: slope in real neurons
    test: two-tailed Student's t-test
    p: 0.0001
    p_relation: "<"
    n: 62 neurons
  data: elsewhere
  where: github.com/RFLiu2021/AIC_proj at commit 44cd8a6 (model scripts and
    ephysio/data_ephy/NeuronPeakIdx_summary.mat); simulated traces in Zenodo
    doi:10.5281/zenodo.18814764
  criterion: Phase peak index as in the Methods (Calculation of the phase peak index), against
    AIS distance; real neurons binned by AIS distance as in the Fig. 4i legend (n = 62, each point
