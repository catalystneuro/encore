# Claims for Liu, Huang, Shen, Shao, Jing et al. (2026), "An atlas of primate insular cortex
# reveals a signal-processing strategy in von Economo neurons", Nature Cell Biology 28,
# 1742-1757, doi:10.1038/s41556-026-02009-4 (named on the archive "Cell Atlas and Novel Signal
# Processing Strategy in Primate Insular Cortex"), on dandiset 001752.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21,
# protocol as stated in docs/protocol.md (version pilot-10).
#
# Text read: the version of record, open access, as served by Europe PMC (PMC13457102), stored
# under paper/: main text, figure legends, Extended Data figure legends, Methods, Data and Code
# availability. No PDF was available, so values printed only inside figures (for example the
# p-values of Fig. 5b,c) could not be read. The Supplementary Information (Supplementary Figs.
# 1 to 17, Supplementary Tables 1 to 12) and the Source Data files were not in the text read;
# claims that cite them rest on the main text, and say so. The claims this dataset can test
# (Fig. 5a-c) rest on the main text, the Fig. 5 legend and the Methods, all of which were read.
#
# Code read: github.com/RFLiu2021/AIC_proj at commit 44cd8a6dfbb1f1ce363d73742e4f3652086b0f9d
# (2026-07-05). It holds MATLAB and Python scripts per figure (its file names follow an older
# figure numbering; ephysio/Fig5ab_ana_sPSC.m and Fig5ab_ana_mPSC.m make the paper's Fig. 5b,c),
# per-cell summary tables (ephysio/data_ephy/sPSCs_Fig7ab.xlsx and miniEPSCs_Fig7ab.xlsx give one
# frequency and one mean amplitude per cell, already detected with miniAnalysis), and a table
# naming the deposited NWB files (ephysio/data_ephy/rawdata_ephysio/metadata_PSC.csv, with subject,
# original file name, NWB file name, cell type and experiment). The event detection itself is
# not in the code; it was done in miniAnalysis (Synaptosoft) and Clampfit. What the code settles
# is said in each criterion. Three things in the code bear on the Fig. 5 claims:
#  - The mEPSC sheet (miniEPSCs_Fig7ab.xlsx, sheet mEPSC_sum) heads its first column "VENs" and
#    lists cells S02C05, S02C07, S02C08, S04C16, S04C18, S04C19, S04C22 and S05C26#; the script
#    reads that column as VEN. metadata_PSC.csv labels the same cells (20210403AS02C05 and so on)
#    PC, and labels the sheet's "PCs" (S020322, S02C11, S02C12, S04C15, S04C20, S05C25, S05C28)
#    VEN. The sheet's eighth "PC", S02C0321, is not in metadata_PSC.csv, which lists 7 VENs where
#    the paper reports 8. The cell-type labels for the mEPSCs thus differ between the paper's
#    analysis and the deposit's metadata.
#  - The sEPSC PC group of the sheet holds two traces of cell 20201126s1c2 as two cells
#    (1126s1c2trace14_70 and 1126s1c2_Trace_1_15), and metadata_PSC.csv lists that file twice, so
#    the paper's n = 11 PCs is 10 distinct cells.
#  - The sIPSC recordings are named "+20mV" in metadata_PSC.csv and in the sheet, where the
#    Methods say IPSCs were recorded at -60 mV; and the code's mIPSC table counts events over 30 s
#    per cell, where the Methods say each trace was recorded for at least 5 min with at least 200
#    events analysed.
#
# Data the paper describes. Adult macaques (Macaca fascicularis, 4 to 6 years). scRNA-seq, 7
# animals (two females, five males), 22 samples, 122,663 cells; Patch-seq, 12 males, 578 neurons
# (462 with intrinsic properties, 166 reconstructed, 307 with transcriptomes kept); whole-cell
# recording and local connectivity, 20 animals (one female, 19 males). Acute 300 um coronal slices
# of the VEN-enriched anterior insular cortex (AIC), recordings at room temperature.
#  - Fig. 5a-c, the data of this dandiset (its description, "miniature and spontaneous excitatory
#    and inhibitory postsynaptic currents (E/IPSCs) recorded from von Economo neurons (VENs) and
#    pyramidal cells (PCs)"). Voltage-clamp recordings from post hoc morphologically confirmed VENs
#    and PCs; EPSCs held at -70 mV with a Cs-gluconate internal and bicuculline (10 uM) in the bath;
#    IPSCs held at -60 mV with a CsCl internal and CNQX (20 uM) plus APV (100 uM); miniature
#    events with tetrodotoxin (1 uM). Cells per group, sEPSC 8 VEN and 11 PC, sIPSC 7 VEN and 8 PC,
#    mEPSC 8 VEN and 8 PC, mIPSC 15 VEN and 21 PC. Measured variable, membrane current (pA) over
#    time; per cell, event frequency (Hz) and amplitude (pA).
#  - Other recordings, deposited elsewhere: Patch-seq electrophysiology (DANDI:001746), somatic
#    Na+ currents from outside-out patches (DANDI:001750), simultaneous recordings of up to eight
#    neurons for connectivity (DANDI:001751); scRNA-seq and Patch-seq reads (GEO GSE319557 and
#    GSE319369); metabolomics (MetaboLights MTBLS13927); morphologies (NeuroMorpho.org); processed
#    data (Zenodo doi:10.5281/zenodo.18814764). The paper does not say which dandiset holds the
#    additional VEN and PC recordings of Fig. 4a-c (281 VENs, 306 PCs) or the evoked EPSPs of
#    Fig. 4j.
#
# Details the paper leaves open are named in each criterion with the readings its text allows.
# Where a criterion uses p < 0.05 and the paper prints no alpha in the text read, that is the
# conventional reading of "significantly", and is said so.
schema_version: 2
dataset:
  archive: dandi
  id: "001752"
paper: doi:10.1038/s41556-026-02009-4
claims:
- id: fig5b-sepsc-frequency
  statement: The frequency of spontaneous EPSCs is lower in VENs than in neighbouring PCs.
  source: Results, Altered connectivity profile of deep-layer AIC neurons, paragraph 1; Figure 5b
  quote: The frequencies of both excitatory and inhibitory events were significantly lower in VENs
    than in PCs (Fig. 5b )
  criterion: Per cell, sEPSCs are detected in the recording held at -70 mV (inward events), and
    the cell's frequency is the number of events over the duration analysed, in Hz (Methods,
    "Recordings of synaptic events were assessed for frequency (Hz)"; the code's tables give one
    frequency per cell as events over duration). The Methods fix the event threshold at "the
    maximus root mean squared noise level (5 pA)" and give no other detection parameter
    (miniAnalysis settings such as baseline window or area threshold are not given, and the code
    holds no detection step); a standard peak detector on the baseline-subtracted trace is used,
    and the threshold has two readings, (a) a fixed 5 pA amplitude and (b) the recording's own
    RMS noise level. The peak detector itself is a standard choice, not the paper's (miniAnalysis
    is not reproduced). The Methods say each trace was recorded for at least 5 min after the
    signal had stabilized (no shift beyond 4 s.d. of the baseline) and that at least 200 events
    were included for analysis, but not how long a stretch was analysed; the analysis uses the
    whole stable recording, and the code's 30 s per cell (its mIPSC table) is shown as a variant.
    Cell types are
    the dataset's labels; the paper's n is 8 VENs and 11 PCs (Fig. 5b legend), of which the code's
    11 PCs are 10 distinct cells (one cell's two traces counted twice), so the PC group is read
    (a) as the paper's 11 entries and (b) as 10 distinct cells. Test, as in the legend and in
    Fig5ab_ana_sPSC.m, a two-tailed Wilcoxon rank-sum test of VEN against PC per-cell
    frequencies, uncorrected, at p < 0.05 (conventional; the panel's p-value was not readable).
    Reproduced when, under every combination of the readings, the VEN median is below the PC
    median with p < 0.05; blocked as methods_underspecified when the readings disagree, with every
    result shown. Group medians and ranges are reported.
- id: fig5b-sipsc-frequency
  statement: The frequency of spontaneous IPSCs is lower in VENs than in neighbouring PCs.
  source: Results, Altered connectivity profile of deep-layer AIC neurons, paragraph 1; Figure 5b
  quote: The frequencies of both excitatory and inhibitory events were significantly lower in VENs
    than in PCs (Fig. 5b )
  criterion: As fig5b-sepsc-frequency, for sIPSCs, with n = 7 VENs and 8 PCs (Fig. 5b legend) and
    no duplicate reading. The Methods hold IPSCs at -60 mV with a CsCl internal (inward events);
    the code's metadata names the sIPSC recordings "+20mV", which would make the events outward.
    Events are detected in the direction implied by the holding potential the file records, and
    the notebook says which it is. Threshold readings (a) 5 pA and (b) the recording's RMS noise;
    whole stable recording, with the code's 30 s as a variant. Two-tailed Wilcoxon rank-sum,
    uncorrected, p < 0.05 (conventional). Reproduced when both readings give the VEN median below
    the PC median with p < 0.05; blocked as methods_underspecified when they disagree.
- id: fig5b-mepsc-frequency
  statement: The frequency of miniature EPSCs (in tetrodotoxin) is lower in VENs than in
    neighbouring PCs.
  source: Results, Altered connectivity profile of deep-layer AIC neurons, paragraph 1; Figure 5b
  quote: The frequencies of both excitatory and inhibitory events were significantly lower in VENs
    than in PCs (Fig. 5b )
  criterion: As fig5b-sepsc-frequency, for mEPSCs held at -70 mV in 1 uM tetrodotoxin, with n = 8
    VENs and 8 PCs (Fig. 5b legend). Threshold readings (a) 5 pA and (b) the recording's RMS
    noise; whole stable recording, with the code's 30 s as a variant. Two-tailed Wilcoxon
    rank-sum, uncorrected, p < 0.05 (conventional), as in Fig5ab_ana_mPSC.m. Reproduced when both
    readings give the VEN median below the PC median with p < 0.05; blocked as
    methods_underspecified when they disagree. The test uses the dataset's cell-type labels. The
    paper's analysis sheet labels these cells the other way from the code's deposit metadata (see
    the opening comment), so the notebook also reports the result with each cell's label taken
    from the sheet (matched through the original file names in metadata_PSC.csv), as a variant
    that does not decide the outcome, and records which labelling the dataset carries.
- id: fig5b-mipsc-frequency
  statement: The frequency of miniature IPSCs (in tetrodotoxin) is lower in VENs than in
    neighbouring PCs.
  source: Results, Altered connectivity profile of deep-layer AIC neurons, paragraph 1; Figure 5b
  quote: The frequencies of both excitatory and inhibitory events were significantly lower in VENs
    than in PCs (Fig. 5b )
  criterion: As fig5b-sipsc-frequency, for mIPSCs in 1 uM tetrodotoxin, with n = 15 VENs and 21 PCs
    (Fig. 5b legend). Threshold readings (a) 5 pA and (b) the recording's RMS noise; the duration
    analysed follows the Methods (whole stable recording); the code's mIPSC table counts events
    over 30 s per cell, and that is shown as a variant. Two-tailed Wilcoxon rank-sum, uncorrected,
    p < 0.05 (conventional). Reproduced when both readings give the VEN median below the PC
    median with p < 0.05; blocked as methods_underspecified when they disagree.
- id: fig5c-sepsc-amplitude
  statement: The amplitude of spontaneous EPSCs does not differ significantly between VENs and
    PCs.
  source: Results, Altered connectivity profile of deep-layer AIC neurons, paragraph 1; Figure 5c
  quote: whereas the amplitudes were not significantly different between VENs and PCs (Fig. 5c )
  criterion: A claim of absence, judged on the paper's test, a two-tailed Wilcoxon rank-sum test of
    VEN against PC per-cell amplitudes (Fig. 5c legend; Fig5ab_ana_sPSC.m), uncorrected, at
    alpha 0.05 (conventional). The cell's amplitude is the mean amplitude of its detected events,
    in pA (the code's tables give an average amplitude per cell). Events are detected as for
    fig5b-sepsc-frequency, with the 5 pA threshold the Methods print, over the whole stable
    recording, on the paper's 8 VENs and 11 PC entries. Reproduced when p >= 0.05, not reproduced
    when p < 0.05; the medians, their difference and p are reported either way, and the RMS-noise
    threshold, the 10 distinct PCs and the 30 s window are shown as variants.
