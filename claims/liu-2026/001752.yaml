- id: fig2d-f-l23-it-tau-width
  statement: Among projection neuron subclasses, L2/3 IT HPCAL1 neurons have a small membrane time
    constant and a narrow AP width.
  source: Results, Patch-seq revealed extensive cellular heterogeneity in the primate AIC,
    paragraph 3; Figure 2d-f
  quote: L2/3 IT HPCAL1 neurons stood out with a small membrane time constant (tau) and narrow
    action potential (AP) width (Fig. 2d–f )
  data: elsewhere
  where: DANDI:001746 (Patch-seq electrophysiology)
  criterion: Per cell, tau and AP half-width as defined in the Methods (Extraction of
    electrophysiological features). Two-tailed Wilcoxon rank-sum tests between subclasses with
    Benjamini-Hochberg FDR correction (Fig. 2 legend), n as in the legend (L2/3 IT HPCAL1 30, IT
    RORB 17, L5 IT FEZF2 119, VEN 22, L5 ET 16, L6 PC 13; the Results give L6 PC n = 14). The
    paper says only that the subclass "stood out", and its adjusted p-values are in
    Supplementary Table 2, not read, so how many pairwise differences must be significant is
    open. Readings, (a) the lowest median tau and the lowest median AP width of the six
    subclasses, each lower than every other subclass at FDR-adjusted p < 0.05 (conventional), and
    (b) the lowest median of each of the two, without a requirement on the pairwise tests.
    Reproduced when both readings hold; blocked as methods_underspecified when they disagree.
