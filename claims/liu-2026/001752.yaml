  source: Results, Altered connectivity profile of deep-layer AIC neurons, paragraph 1; Figure 5c
  quote: whereas the amplitudes were not significantly different between VENs and PCs (Fig. 5c )
  criterion: As fig5c-sepsc-amplitude, for sIPSCs (7 VENs, 8 PCs), with events detected as for
    fig5b-sipsc-frequency. Reproduced when the two-tailed Wilcoxon rank-sum test gives p >= 0.05,
    not reproduced when p < 0.05; effect size reported either way.
