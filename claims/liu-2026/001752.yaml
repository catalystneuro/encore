  source: Results, Altered connectivity profile of deep-layer AIC neurons, paragraph 1; Figure 5c
  quote: whereas the amplitudes were not significantly different between VENs and PCs (Fig. 5c )
  criterion: As fig5c-sepsc-amplitude, for mEPSCs (8 VENs, 8 PCs), using the dataset's cell-type
