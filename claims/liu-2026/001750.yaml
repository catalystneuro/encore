- id: fig3ab-ven-axon-from-basal-dendrite
  statement: The axons of VENs emanate from their basal dendrite, while those of PCs originate at
    the base of the soma.
  source: Results, The AIC evolved a neural signal-processing strategy, paragraph 1; Figure 3a,b
  quote: One of the most notable morphological features that distinguish VENs from other PC types
    is that the axons of the VENs emanate from its basal dendrite (Fig. 3a )
  data: elsewhere
  where: NeuroMorpho.org doi:10.13021/y4be-0p18 (morphologies, ASC)
  criterion: The paper shows examples (Fig. 3a, 20 replications; Fig. 3b, biocytin and Pan-Nav
    co-staining, 35 replications, axon origins "from prominent basal dendrites in VEN" and "from
    the base of the soma in PC") and reports no count or test. Measured on the reconstructed VENs
    and PCs whose axon was recovered (Fig. 6e counts 36 VEN-L, 20 VEN-S and 74 PCs with axonal
    information). The paper gives no fraction; readings, (a) every such VEN's axon leaves a basal
    dendrite and every PC's the soma, and (b) more than half do in each type. Reproduced when either reading holds, with the
    fractions reported and the reading that holds named.
- id: fig3c-ais-distance-length
  statement: In Pan-Nav stained sections the AIS of VENs lies farther from the soma than that of
    PCs, and VENs have a shorter AIS.
  source: Results, The AIC evolved a neural signal-processing strategy, paragraph 2; Figure 3c
  quote: showed that the AIS in VENs was, on average, located significantly farther from the soma
    than in PCs (Fig. 3c ). Additionally, VENs had a shorter AIS than PCs.
  data: elsewhere
  where: github.com/RFLiu2021/AIC_proj at commit 44cd8a6, morpho/dataMorph/AIScmp_PCvsVEN_Fig5c.xlsx
  criterion: The legend names a two-way ANOVA (n = 108 VENs and 430 PCs, 23 slices, five animals)
    without its factors; the readings are cell type with slice, and cell type with animal, as the
    second factor. Reproduced when, under both, the cell-type effect is significant at p < 0.05
    (conventional) for AIS distance (VEN larger) and AIS length (VEN shorter).
- id: fig3e-phase-peak-index
  statement: VENs have lower AP phase-plane peak indices than every PC type.
  source: Results, The AIC evolved a neural signal-processing strategy, paragraph 3; Figure 3e
  quote: The VENs had lower phase peak indices than any type of PCs (Fig. 3e )
  data: elsewhere
  where: DANDI:001746
  criterion: Phase peak index (Psd - Pais)/(Psd + Pais) (Methods, Calculation of the phase peak
