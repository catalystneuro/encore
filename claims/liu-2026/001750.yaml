# Claims for Liu, Huang, Shen, Shao, Jing et al. (2026), "An atlas of primate insular cortex
# reveals a signal-processing strategy in von Economo neurons", Nature Cell Biology 28,
# 1742-1757, doi:10.1038/s41556-026-02009-4 (named on the archive "Cell Atlas and Novel Signal
# Processing Strategy in Primate Insular Cortex"), on dandiset 001750.
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21,
# protocol as stated in docs/protocol.md (version pilot-10).
#
# Text read: the version of record, open access, as served by Europe PMC (PMC13457102), stored
# under paper/: main text, figure legends, Extended Data figure legends, Methods, Data and Code
# availability. No PDF was available, so values printed only inside figures (the Fig. 4d box
# plot and its P value) could not be read. The Supplementary Information (Supplementary Figs. 1
# to 17, Supplementary Tables 1 to 12) and the Source Data files were not in the text read. The
# claims this dataset can test (Fig. 4d) rest on the Results, the Fig. 4d legend and the Methods,
# which were read; no supplementary item is cited for them. Claims on other data that cite
# supplementary items rest on the main text and say so.
#
# Code read: github.com/RFLiu2021/AIC_proj at commit 44cd8a6dfbb1f1ce363d73742e4f3652086b0f9d
# (2026-07-05), and PatchAnaLab 1.0 (Zenodo doi:10.5281/zenodo.19995355), the paper's analysis
# package. AIC_proj holds MATLAB and Python scripts per figure (file names follow an older figure
# numbering) and small data tables; its processed data are in Zenodo doi:10.5281/zenodo.18814764
# (concept doi:10.5281/zenodo.17799559, not opened). For the Na+ currents of Fig. 4d it holds:
#  - ephysio/Fig4d_plotNaCurrent.m. It loads a per-cell table of maximal Na+ current, takes its
#    absolute value, and compares PCs and VENs with ranksum (the Wilcoxon rank-sum test of the
#    legend) and also ttest2; it plots the absolute values in pA as a box plot ("Na current
#    (pA)"). For the example traces it averages the repeated sweeps of each step, takes the first
#    17 steps ("test pulses from -80 to 0 mV"), cuts -2 to 20 ms around the step onset, and
#    subtracts the mean of the first 100 samples of the cut (2 ms at the VEN example's 50 kHz, 1
#    ms at the PC example's 100 kHz). The step onset is at 40 ms in the VEN example and 20 ms in
#    the PC example. The Methods give 100 kHz for all recordings.
#  - ephysio/data_ephy/NaCurrent_Fig6d.mat, the table the script loads (35 cells, cell type
#    1 = PC, 2 = VEN, and the maximal current) and the two example cells' traces (28 steps, 3 and
#    5 repeats; the Methods give 17 steps).
#  - ephysio/data_ephy/rawdata_ephysio/metadata_outSideOutSodiumCurrentRec.csv, one row per cell:
#    subject, cell ID, deposited NWB file name, cell type (VEN or PC) and max_Na_current (pA,
#    negative). Tallied here (the table only, not the dataset), 35 cells, 14 VEN and 21 PC,
#    all from subject Mfa221206 (sessions 221206AS and 221206HS); absolute values have median
#    14.9 pA (VEN) and 29.3 pA (PC). The .mat table holds the same values.
# Neither AIC_proj nor PatchAnaLab holds the code that computes the maximal current from the
# traces (PatchAnaLab has a HEKA importer and no voltage-clamp analysis). How the peak is taken
# is therefore open; the criteria name the readings.
#
# Data the paper describes. Adult macaques (Macaca fascicularis, 4 to 6 years). Whole-cell
# recording and local connectivity used 20 animals (one female, 19 males); the paper does not
# say how many gave the Na+ recordings. Acute 300 um coronal slices of the VEN-enriched anterior
# insular cortex (AIC), kept in ACSF at room temperature (about 26 C).
#  - Fig. 4d, the data of this dandiset (the paper's Data availability names it "sodium channel
#    currents"). Somatic outside-out patches from VENs (n = 14) and layer 5 PCs (n = 21), HEKA
#    setups, pipettes 2 to 3 MOhm, Cs-based internal solution (145 mM CsCl, 2 mM MgCl2, 2 mM
#    Na2ATP, 10 mM HEPES, 0.2 mM EGTA, 2 mM TEA, pH 7.2), seals 3 to 10 GOhm; CdCl2 (200 uM) and
#    3 mM 4-aminopyridine in the bath to isolate Na+ currents. Held at -80 mV, stepped from -80
#    to 0 mV in 5 mV steps of 25 ms; leak subtracted online in PatchMaster; sampled at 100 kHz.
#    Patch area about 5 um2, from a capacitance of about 50 fF at 1 uF/cm2. Measured variable,
#    membrane current (pA) over time for each step.
#  - Other recordings, deposited elsewhere: Patch-seq electrophysiology (DANDI:001746),
#    multi-patch connectivity (DANDI:001751), postsynaptic currents (DANDI:001752); scRNA-seq and
#    Patch-seq reads (GEO GSE319557 and GSE319369); metabolomics (MetaboLights MTBLS13927);
#    morphologies (NeuroMorpho.org, doi:10.13021/y4be-0p18).
#
# The paper cites no version of the dandiset. Cell types: if the dataset does not carry them,
# the only source the paper's code gives is metadata_outSideOutSodiumCurrentRec.csv, matched
# through the NWB file names it lists (claim na-cell-table-link); claims that use it are then
# data with_labels. Details the paper leaves open are named in each criterion with the readings
# its text allows. Where a criterion uses p < 0.05 and the paper prints no alpha in the text
# read, that is the conventional reading of "significantly", and is said so.
schema_version: 2
dataset:
  archive: dandi
  id: "001750"
paper: doi:10.1038/s41556-026-02009-4
claims:
- id: na-cell-table-link
  kind: link
  statement: The dandiset's recordings are the 35 outside-out patches of the paper's code table
    (14 VEN and 21 PC), and the maximal Na+ current computed from each recording agrees with the
    value the table gives for it.
  source: Data availability; github.com/RFLiu2021/AIC_proj at commit 44cd8a6,
    ephysio/data_ephy/rawdata_ephysio/metadata_outSideOutSodiumCurrentRec.csv
  quote: https://dandiarchive.org/dandiset/001750 (sodium channel currents)
  data: with_labels
  criterion: Recordings are matched to table rows by NWB file name (fileName_nwb), and the cell
    type is compared with the dataset's own label where it has one. For each cell, the maximal
    peak inward current is computed under each reading of fig4d-sodium-current-lower. The link
    holds (reproduced) when all 35 files are found, every cell type the dataset gives agrees with
    the table, and, under at least one reading, the absolute computed maximum is within 10% of
    the absolute max_Na_current for at least 28 of the 35 cells. Partially reproduced when the
    files and types match but fewer than 28 values agree under every reading; not reproduced
    when files are missing or types disagree. Which reading agrees best is reported; it does not
    choose the reading for the finding, which is judged under all of them.
- id: fig4d-sodium-current-lower
  statement: Somatic Na+ currents recorded in outside-out patches are significantly lower in VENs
    (n = 14) than in L5 PCs (n = 21).
  source: Results, The AIC evolved a neural signal-processing strategy, paragraph 3; Figure 4d
  quote: outside-out patch-clamp recording showed that the somatic Na + currents evoked in VENs ( n
    = 14) were significantly lower than those of L5 PCs ( n = 21) (Fig. 4d )
  expected:
  - quantity: VEN patches
    value: 14
    tolerance: 1.4
  - quantity: PC patches
    value: 21
    tolerance: 2.1
  depends_on:
  - na-cell-table-link
  criterion: Selection, every outside-out patch of a VEN or an L5 PC, typed as the dataset labels
    it or, when it does not, as metadata_outSideOutSodiumCurrentRec.csv does (through
    na-cell-table-link). Protocol, steps from -80 to 0 mV in 5 mV increments, 25 ms, leak
    subtracted online (Methods). Measure, per patch, the largest peak inward current over the
    steps, as an absolute value in pA; the code compares abs(maxNaCurrent) in pA
    (Fig4d_plotNaCurrent.m), and the Methods' model section speaks of "peak sodium current", so
    current, not current density, is compared. Repeated sweeps of a step are averaged before the
    peak is taken, as the code does for its example traces. Open and run as readings, (a)
    baseline, (a1) the trace as recorded, already leak subtracted (Methods), or (a2) a pre-step
    baseline subtracted as in the code's example traces, the mean of the first 100 samples of a cut
    starting 2 ms before the step onset (2 ms at 50 kHz, 1 ms at 100 kHz); (b) steps, (b1) the 17
    steps from -80 to 0 mV (Methods, and the code's nTraces = 17) or (b2) every step recorded
    (the code's example array holds 28); (c) window, (c1) 0 to 20 ms after the step onset (the
    code's plotted window) or (c2) the whole 25 ms step (Methods). The sampling rate and step
    onset are read from each file, as the code's examples differ (50 kHz and 40 ms against 100
    kHz and 20 ms). Test, two-tailed Wilcoxon rank-sum, VEN against PC (Fig. 4d legend; ranksum
    in the code), at p < 0.05 (conventional; the panel's P value was not readable). Reproduced
    when, under every reading, the VEN median is lower with p < 0.05 and the counts are within
    tolerance; not reproduced when the VEN median is not lower or p >= 0.05 under every reading;
    blocked as methods_underspecified when readings disagree. The two-sample t-test the code
    also runs, and the current density (current over the area from each patch's capacitance at
    1 uF/cm2, Methods), are shown as variants that do not decide.
- id: model-na-ratio
  statement: The VEN model's somatodendritic Na+ conductance (55 pS/um2, against 80 pS/um2 in the
    PC model) was set from the recorded ratio of peak Na+ current in VENs to PCs, which puts that
    ratio near 55/80, about 0.69.
  source: Methods, Computational model, paragraph 3
  quote: The VEN model's somatodendritic conductance (55 pS µm −2 ) was set based on the
    experimentally recorded ratio of peak sodium current in VENs relative to PCs. (Fig. 4d )
  expected:
    quantity: VEN to PC ratio of peak Na+ current
    value: 0.6875
    tolerance: 0.069
  depends_on:
  - fig4d-sodium-current-lower
  criterion: The ratio is not printed; 0.6875 is 55/80, both values from the Methods, and "set
    based on" may allow rounding, so the 10% tolerance stands. The Extended Data Fig. 7c legend
    says the range of somatic Na+ conductance "was defined by experimental data and previous
    publications", so 55 pS/um2 may not be the recorded ratio alone; this is reported with the
    result. The per-patch maxima of
    fig4d-sodium-current-lower, under each of its readings. Which group summary forms the ratio
    is not said; readings of the reported number, (i) mean VEN over mean PC and (ii) median VEN
    over median PC. Reproduced when the ratio is within tolerance under one summary reading for
    every reading of the measure; partially reproduced when it is within tolerance for some
    readings of the measure only; not reproduced otherwise.
- id: na-patch-capacitance
  statement: The outside-out patches have a capacitance of about 50 fF, a membrane area of about
    5 um2 at 1 uF/cm2, and similar membrane areas were sampled from both cell types.
  source: Methods, Electrophysiological recording, paragraph 2
  quote: No differences in the degree or time of suction applied to the back of pipettes were
    required to form high resistance (3–10 GΩ) seals at somatic sites, suggesting that similar
    membrane areas were sampled ... the membrane surface area (~5 µm 2 ) of outside-out patches was
    calculated from the capacitance (~50 fF) assuming a specific membrane capacitance of 1 µF cm
    −2
  expected:
  - quantity: patch capacitance
    value: 50
    tolerance: 5
    unit: fF
  - quantity: patch membrane area
    value: 5
    tolerance: 0.5
    unit: um2
  criterion: Per patch, the capacitance recorded with the patch (as the dataset stores it, for
    example the PatchMaster slow or fast capacitance compensation value), and the area as
    capacitance over 1 uF/cm2 (Methods). The "~" values are not said to be a mean or a median;
    readings of the reported number, the mean and the median over all 35 patches. Reproduced
    when both values are within tolerance under one reading. The paper reports no test of VEN
    against PC patch size (its "similar" rests on the suction applied); VEN and PC medians and a
    two-tailed Wilcoxon rank-sum test are shown as a description that does not decide. Blocked
    as data_missing when the dataset holds no patch capacitance.
- id: model-sd-na-density
  statement: In the PC model, lowering the somatodendritic Na+ conductance over the tested range
    (80 to 55 pS/um2, defined by experimental data and previous publications) only modestly changes the AP (slightly lower and broader)
    and does not produce the saddle-like phase-plane shape.
  source: Results, The AIC evolved a neural signal-processing strategy, paragraph 5; Extended
    Data Figure 7c
  quote: A reduction in somatodendritic Na + channel density in the PC model only produced modest
    changes in AP shape (slightly lower amplitude, broader width) but did not induce the
    saddle-like phase–plane pattern.
  statistics:
  - about: AP amplitude and half-width against somatodendritic Na+ conductance, PC model
    test: two-tailed Student's t-test
    p: 0.0001
    p_relation: "<"
  data: elsewhere
  where: github.com/RFLiu2021/AIC_proj at commit 44cd8a6 (VEN_modeling,
    FigPlot/extFig7c_plotVarySomaNaChannelDensity_PC.m); Zenodo doi:10.5281/zenodo.18814764
  criterion: Simulations of the PC model as in the Methods (Computational model) with
    somatodendritic Na+ conductance from 55 to 80 pS/um2. Reproduced when AP amplitude rises and
    half-width falls with the conductance, each slope with two-tailed t-test p < 0.05 (Extended
    Data Fig. 7c legend), and the phase-plane plot shows no decay of the AIS phase before the SD
    phase at any value.
- id: fig5d-connectivity-totals
  statement: Simultaneous recordings of up to eight layer 5b neurons tested 1,292 potential
    connections among 377 neurons and found 31 monosynaptic connections.
  source: Results, Altered connectivity profile of deep-layer AIC neurons, paragraph 2; Figure 5d
  quote: In total, we tested 1,292 potential connections from an additional set of 377 neurons in
    layer 5b and confirmed 31 monosynaptic connections.
  data: elsewhere
  where: DANDI:001751 (multi-Patch recording)
  expected:
  - quantity: potential connections tested
    value: 1292
    tolerance: 129
  - quantity: neurons
    value: 377
    tolerance: 38
  - quantity: monosynaptic connections
    value: 31
    tolerance: 3.1
  criterion: Tested in full under the claims file of DANDI:001751, with the readings named there.
- id: fig5-ven-sparse-connectivity
  statement: VENs form no connections with VENs (0 of 110), PCs (0 of 200) or interneurons (0 of
    55), receive none from interneurons (0 of 55) and one in 200 PC-to-VEN pairs, while PCs connect to PCs in 24 of 503
    pairs.
  source: Results, Altered connectivity profile of deep-layer AIC neurons, paragraph 2; Figure 5i
  quote: PCs formed monosynaptic connections with other PCs in 24 out of 503 tested pairs ...
    VENs did not form synaptic connections with adjacent VENs (VEN-to-VEN, 0 of 110, 135.7 ± 60.0
    μm) or with PCs (VEN-to-PC, 0 of 200, 119.3 ± 63.1 μm). Likewise, VENs received minimal local
    excitatory input, suggesting PCs rarely projected to VENs (PC-to-VEN, 1 of 200 ... no synaptic
    connections were found between VENs and INs (VEN-to-IN, 0 of 55 and IN-to-VEN, 0 of 55
  data: elsewhere
  where: DANDI:001751 (multi-Patch recording)
  criterion: Tested in full under the claims file of DANDI:001751 (fig5-pc-to-pc,
    fig5-ven-outputs-absent, fig5-pc-to-ven, fig5-pc-in, fig5-in-to-ven-absent and
    fig5i-ven-sparse-local-connectivity), with the readings named there.
- id: fig5b-psc-frequency
  statement: The frequencies of spontaneous and miniature EPSCs and IPSCs are lower in VENs than in
    neighbouring PCs.
  source: Results, Altered connectivity profile of deep-layer AIC neurons, paragraph 1; Figure 5b
  quote: The frequencies of both excitatory and inhibitory events were significantly lower in VENs
    than in PCs (Fig. 5b )
  data: elsewhere
  where: DANDI:001752 (postsynaptic currents)
  criterion: Per cell event frequency, sEPSC 8 VEN and 11 PC, sIPSC 7 and 8, mEPSC 8 and 8,
    mIPSC 15 and 21 (Fig. 5b legend); events detected at "the maximus root mean squared noise
    level (5 pA)" (Methods); two-tailed Wilcoxon rank-sum test per event type (legend), at
    p < 0.05 (conventional; the panel's p-values were not readable). Reproduced when the VEN
    median is lower with p < 0.05 for each type. Tested in full under the claims file of
    DANDI:001752.
- id: fig5c-psc-amplitude
  statement: The amplitudes of spontaneous and miniature EPSCs and IPSCs do not differ
    significantly between VENs and PCs.
  source: Results, Altered connectivity profile of deep-layer AIC neurons, paragraph 1; Figure 5c
  quote: whereas the amplitudes were not significantly different between VENs and PCs (Fig. 5c )
  data: elsewhere
  where: DANDI:001752
  criterion: A claim of absence, judged on the paper's test, a two-tailed Wilcoxon rank-sum test
    of per-cell amplitudes per event type (Fig. 5c legend; "The same data in b", so the cells of
    Fig. 5b), alpha 0.05 (conventional). The paper does not say how a cell's amplitude summarizes
    its events (Clampfit, Methods); readings, (a) the mean and (b) the median of the cell's event
    amplitudes. Reproduced when p >= 0.05 for each type, with the effect size reported.
