    proportions of such channels in the hippocampus, amygdala and vmPFC exceeded the
    trial-shuffled null, while pre-SMA and dACC had few such channels.
  source: Results, Hippocampal PAC is modulated by WM load, paragraphs 1 and 2; Figure 2b
  quote: For theta to high-gamma PAC, 137 out of 586 hippocampal channels showed significant PAC
    across all correct trials from both load conditions
  statistics:
  - test: right-sided permutation test against trial-shuffled surrogates
    p: 0.005
    n: channels per area; hippocampus, amygdala and vmPFC
  expected:
  - quantity: significant hippocampal channels
    value: 137
    tolerance: 13.7
  - quantity: significant amygdala channels
    value: 130
    tolerance: 13
  - quantity: significant vmPFC channels
    value: 40
    tolerance: 4
  - quantity: significant pre-SMA channels
    value: 5
    tolerance: 0.5
  - quantity: significant dACC channels
    value: 14
    tolerance: 1.4
  criterion: A channel has significant PAC when its mean z-scored MI over theta and high gamma
    (O3), from all subsampled trials of both loads, exceeds 1.64 (Methods, PAC). The amygdala,
