- id: tables1-slow-fast-theta
  statement: Split into slow (2-5 Hz) and fast (5-9 Hz) theta, PAC differed between loads only in
    the hippocampus and only with high gamma, most strongly for fast theta (t116 = -3.05, p =
    0.0015; slow theta, t147 = -2.31, p = 0.0163).
  source: Supplementary Table S1; Supplementary Discussion, Related work on role of theta
  quote: PAC differed significantly only in the hippocampus and only for high gamma power combined
    with either low or high theta frequency bands, with the strongest differences in the fast
    theta band
  statistics:
  - about: hippocampus, fast theta to high gamma
    test: two-sided permutation-based t-test, uncorrected
    statistic: t(116) = -3.05
    p: 0.0015
  - about: hippocampus, slow theta to high gamma
    test: two-sided permutation-based t-test, uncorrected
    statistic: t(147) = -2.3141
    p: 0.0163
  criterion: The phase bands are not mapped to centre frequencies in the text. Readings are (a)
    slow theta as phase centres 2 and 4 Hz and fast theta as 6 and 8 Hz of the comodulogram;
    (b) bands filtered directly at 2-5 Hz and 5-9 Hz. Channels are selected per band
    combination, as the differing n of Table S1 show. Reproduced when, under one reading, of the
