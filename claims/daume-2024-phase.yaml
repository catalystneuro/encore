  archive: dandi
  id: "000673"
paper: doi:10.1038/s41586-024-07309-z
claims:
- id: cohort-counts
  statement: The study recorded 36 patients in 44 sessions, with 1,454 single neurons (360
    hippocampus, 496 amygdala, 204 pre-SMA, 188 dACC, 206 vmPFC) and 1,922 microwire LFP channels
    (586, 421, 283, 325 and 307).
  source: Methods, Patients and Spike sorting; Results, Hippocampal PAC is modulated by WM load,
    paragraph 1
  quote: We isolated 360 neurons in the hippocampus, 496 in the amygdala, 204 in the pre-SMA, 188
    in the dACC and 206 in the vmPFC. Of the LFP channels, 586 channels were in the hippocampus,
    421 in the amygdala, 283 in the pre-SMA, 325 in the dACC and 307 in the vmPFC
  expected:
  - quantity: sessions
    value: 44
    tolerance: 0
  - quantity: patients
    value: 36
    tolerance: 0
  - quantity: single neurons, all areas
    value: 1454
    tolerance: 0
  - quantity: LFP channels, all areas
    value: 1922
    tolerance: 0
  criterion: Counts from the units and LFP electrode tables, with areas merged across hemispheres
    as condenseAreas.m does. Tolerance is 0 because these are counts of the recordings the dataset
    is said to hold, not estimates. Reproduced when every total and every per-area count matches exactly;
    partially reproduced when all are within 2%.
- id: fig1d-rt-load
  statement: Patients responded more slowly in load 3 than in load 1 trials (1.46 s against 1.33
    s).
  source: Results, Main, paragraph 3; Figure 1d
  quote: the participants responded slower (1.46 s versus 1.33 s; t 43 = 6.42, P < 0.001)
  statistics:
  - test: two-sided permutation-based t-test, 10,000 permutations
    statistic: t43 = 6.42
    p: 0.0001
    n: 44 sessions
  expected:
  - quantity: RT, load 3
    value: 1.46
    tolerance: 0.146
    unit: s
  - quantity: RT, load 1
    value: 1.33
    tolerance: 0.133
    unit: s
  criterion: RT is response time minus probe onset (Fig. 1d legend; code). Per session the median
    RT of correct trials in each load, as NWB_QA_graphs.m computes it; the values are the means
    over sessions; the paired permutation t-test over 44 sessions (G2). The per-session mean RT
    of correct trials is shown as a variant.
