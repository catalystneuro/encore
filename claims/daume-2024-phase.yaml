  statement: Theta-low-gamma (30-55 Hz) PAC did not differ between loads in any region.
  source: Results, Hippocampal PAC is modulated by WM load, paragraph 2; Extended Data Fig. 2c
  quote: For PAC involving the low gamma band (30–55 Hz), there were no significant differences
