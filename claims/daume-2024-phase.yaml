  - test: two-sided permutation-based t-test
    statistic: t(136) = -3.7453
    p: 0.0001
    n: 137 channels
  depends_on:
  - fig2b-pac-channel-proportions
  criterion: Kappa is the von Mises concentration estimated (circ_kappa) from the 18-bin
    distribution of high-gamma amplitude over theta phase, bins weighted by their normalized
    amplitude; the estimator is not named, and circ_kappa of the CircStat toolbox is the
    standard choice. Paired permutation t-test over channels.
