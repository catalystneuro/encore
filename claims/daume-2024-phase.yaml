- id: behaviour-overall-accuracy
  statement: Mean accuracy was 93.66 +/- 7.04% (s.d. over sessions), and 78.34 +/- 20.09% of
    errors were false negatives.
  source: Results, Main, paragraph 3
  quote: Mean accuracy was 93.66 ± 7.04% (mean ± s.d.; 78.34 ± 20.09% of all errors were false
    negatives)
  expected:
  - quantity: mean accuracy over sessions
    value: 93.66
    tolerance: 7.04
    unit: '%'
  - quantity: false negatives as a share of errors, mean over sessions
    value: 78.34
    tolerance: 20.09
    unit: '%'
