# Claims for Daume, Kaminski, Schjetnan, Salimpour, Khan, Kyzar, Reed, Anderson, Valiante,
# Mamelak & Rutishauser (2024), "Control of working memory by phase-amplitude coupling of human
# hippocampal neurons", Nature 629, 393-401, on dandiset 000673.
#
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-23,
# protocol pilot-10 as stated in docs/protocol.md.
#
# Text read: the version of record (open access, CC BY) as served by Europe PMC (PMC11078732),
# full text with Results, Methods, figure legends and Extended Data Fig. 1 to 9 legends, and the
# Supplementary Information PDF (41586_2024_7309_MOESM1_ESM: Supplementary Tables S1 to S5 and the
# Supplementary Discussion). The Peer Review File (MOESM3) is in the text too; the Reporting
# Summary (MOESM2) came through empty and nothing here rests on it. The text of Supplementary
# Table S4 is garbled (its model formula is lost); its rows (Intercept, SC, Load1, SC:Load1 for
# hippocampus and amygdala) were read from the text that survives.
#
# Code read: github.com/rutishauserlab/SBCAT-release-NWB at commit a25e8cc3 (2025-01-21), the
# repository the paper links (also Zenodo 10.5281/zenodo.10494533). It holds sample code only:
# loading the NWB files, behaviour metrics (NWB_QA_graphs.m), category cell selection
# (NWB_calcSelective_SB.m), the LFP PAC comodulogram with Tort's modulation index
# (cfc_tort_comodulogram.m, NWB_samplePAC_LFP.m), the PAC neuron GLMs for one example neuron
# (plot_PAC_neuron.m, NWB_samplePAC_SU.m), spike sorting metrics, and a simulation of signal and
# noise axes (helpers/internal/geometry). It holds no code for single-trial PAC, the mixed-effects
# GLMs, spike-field coherence, noise correlations on the data, population decoding, or the
# cluster statistics. Where the code settles a detail it is cited as "code" below.
#
# Data the paper used (as the paper reports it). 36 patients (21 female, 15 male, 40.47 +/- 13.76
# years), 44 sessions, with Behnke-Fried hybrid depth electrodes (8 microwires per bundle) in the
# hippocampus, amygdala, pre-SMA, dACC and vmPFC (left and right), recorded at Cedars-Sinai,
# Toronto Western and Johns Hopkins. 1,454 single neurons (360 hippocampus, 496 amygdala, 204
# pre-SMA, 188 dACC, 206 vmPFC) sorted with OSort, and 1,922 microwire LFP channels (586, 421, 283,
# 325, 307); the LFP was low-passed at 175 Hz and downsampled to 400 Hz after spike waveforms were
# interpolated out. Task: a Sternberg working memory task of 140 trials, 70 load 1 and 70 load 3,
# with pictures from five categories (faces, animals, cars or tools, fruits, landscapes); each
# picture 2 s on screen, then a 2.55 to 2.85 s maintenance period, then a probe (match or
# non-match) answered by button press. The code reads, from each session's trials table, the
# timestamps of fixation, encoding 1 to 3, maintenance, probe and response, the picture IDs of
# encoding 1 to 3 and the probe (the category is the first digit of the picture ID), the load,
# probe_in_out and response_accuracy. The data availability statement names DANDI 000673, which
# the dandiset's title and description match (44 sessions); it should hold every experiment of
# the paper.
#
# General rules for the criteria below.
# (G1) Unless a criterion says otherwise, a claim of an effect is reproduced when the paper's test,
#      run as described, gives p < 0.05 (after the correction the paper applied) in the direction
#      the paper reports, and every expected value is within tolerance; partially reproduced when
#      the test holds and an expected value is out of tolerance; not reproduced when the test does
#      not hold. A claim of absence follows the protocol: the paper's test, as written.
# (G2) Tests. "Two-sided permutation-based t-test" is statcond.m (EEGLAB) with method 'perm',
#      10,000 permutations, paired over neurons, channels, pairs or sessions unless the paper says
#      unpaired (Methods, Statistics). Cluster tests are FieldTrip cluster-based permutation over
#      frequencies, 10,000 permutations, alpha 0.025 per one-sided cluster, Bonferroni corrected
#      for the number of tests named in the legend. The cluster-forming threshold and cluster
#      statistic are not stated; FieldTrip's defaults (clusteralpha 0.05, maxsum) are the reading
#      the citation implies and are used.
# (G3) Windows. Maintenance is 0 to 2.5 s after maintenance onset (Methods, Task). Baseline is
#      -0.9 to -0.3 s before picture 1 onset (Fig. 3b legend). Only correct trials unless stated.
# (G4) Preferred trials of a category neuron are trials in which a picture of its preferred
#      category was among the encoded pictures (code, NWB_calcSelective_SB.m, maintenance raster);
#      in load 3 the three pictures are from three different categories (Methods, Task).
#
# Details the paper and code leave open, used in the criteria below. Where a detail could change
# the outcome the readings are named, and the notebook runs each.
# (O1) LFP artefact rejection. The Methods give the automated steps (amplitude z-scored per channel
#      across all trials after capping at 6 s.d.; a trial is removed for a wire when any sample
#      exceeds 4 s.d., or when the z-scored difference between every fourth sample exceeds 10
#      s.d.), then visual inspection that cannot be repeated. The span z-scored is not stated.
#      Readings are (a) the automated steps on the -0.5 to 3 s maintenance epochs; (b) the same on
#      whole trials (fixation to response). The visual step is left out under both, a deviation.
#      Whether the released LFP already excludes channels or trials is for the author to find.
# (O2) Equal trial counts. Correct load 1 and load 3 trials are randomly subsampled to equal
#      numbers per channel (Methods, PAC); the seed is a standard choice and cannot change the
#      outcome much.
# (O3) Band averages for LFP PAC. The code (NWB_samplePAC_LFP.m) takes theta as phase centre
#      frequencies 4 and 6 Hz (2 Hz bandwidth, so 3 to 7 Hz) and high gamma as amplitude centres
#      70 to 140 Hz in 5 Hz steps; low gamma is read the same way as centres 30 to 55 Hz. A
#      channel's value is the mean z-scored MI over those pairs.
# (O4) Surrogate null of the proportion of PAC channels (Fig. 2b). Not described beyond "trial-
#      shuffled surrogates". Reading is that for each of the 200 surrogates of each channel the
#      surrogate MI is z-scored with the normal fitted to all 200, and the null is the 200
#      proportions of channels whose surrogate exceeds z 1.64 (200 surrogates give the printed
#      minimum P of 0.005).
# (O5) Single-trial PAC. The Methods do not say how it is computed. Readings are (a) Tort's MI
#      (18 bins) computed on each trial's 0 to 2.5 s window, averaged over the theta and high-gamma
#      pairs of O3, raw; (b) the same, z-scored across trials within each channel. GLM forms are
#      from Supplementary Tables S2 and S3 (normal response; random intercepts for patient and
#      for channel, or neuron-channel pair, nested in patient).
# (O6) Firing rate units for comparisons with baseline and between conditions. Figures show the
#      percentage change from baseline, the tests do not say. Readings are (a) rate in Hz; (b)
#      percentage change from each neuron's baseline.
# (O7) "Insufficient data in the incorrect condition". No minimum is given. Readings are a
#      minimum of (a) one; (b) two; (c) three incorrect trials per neuron; the n each gives is
#      reported against the paper's n.
# (O8) SFC surrogates. The spike times are perturbed "by adding random noise" 500 times; the size
#      of the noise is not given. Readings are (a) each spike moved to a uniformly random time
#      within the same 0 to 2.5 s window; (b) each spike shifted by a uniform jitter of +/-250 ms
#      (half a cycle at 2 Hz, the lowest frequency analysed).
# (O9) PAC neuron FDR. "FDR corrected for all possible channel combinations". Readings are
#      Benjamini-Hochberg over (a) all neuron-to-channel combinations of an area and load; (b) the
#      channel combinations of each neuron.
# (O10) Noise correlation averaging (Fig. 6a). Readings are (a) the mean over all correct trials
#      of each pair; (b) the mean within each condition (preferred or not, by load), then across
#      conditions.
# (O11) Decoding. The Methods fix the decoder (linear SVM, fitcecoc one-versus-one, 80% train and
#      20% test, z-scored maintenance rates, load 1 correct trials, trials subsampled to the
#      smallest category, 500 repetitions, greedy ensembles) and the removal of noise correlations
#      (trials shuffled per neuron within category). They do not fix (i) whether the intact and
#      removed ensembles are built separately or the intact order is reused; (ii) the measure of
#      Fig. 6c. Readings for (i) are (a) separate greedy ensembles; (b) the intact ensemble order
#      used for both. For (ii) the measure is, per session, the mean accuracy gain at the steps
#      where a PAC neuron was added before peak accuracy, averaged over the PAC neurons of the
#      session, as Leavitt et al. (ref. 36) define it; the paper gives no other.
schema_version: 2
