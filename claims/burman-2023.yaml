- id: figs6-rate-regressed
  statement: The awake decrease in synchrony and increase in entropy remain after the effect of firing
    rate is regressed out.
  source: Results, Shunting inhibition promotes local network desynchronization and response flexibility,
    paragraph 1; Figure S6 (not read)
  quote: we also established that the differences in synchrony and entropy were still evident after regressing
    out the effect of firing rate
  depends_on:
  - fig4d-synchrony-lower-awake
  - fig4d-entropy-higher-awake
  criterion: 'The regression is described only in the Figure S6 legend, which is not in the text read,
    so it is open. Readings: (R1) across all neuron and condition values, a linear regression of the measure
    on evoked firing rate, and the residuals compared awake against anesthetized by the paired t test
    of N8; (R2) an ordinary least squares model of the measure on condition and firing rate, the condition
    coefficient tested; (R3) per neuron, the awake minus anesthetized difference of the measure regressed
    on the difference of firing rate, the intercept tested against zero. Method N1 to N8 of the opening
    comment (Methods and the analysis gist), under each of the readings A1F1, A1F2, A2F1 and A2F2. Reproduced
    when, for both synchrony and entropy, the awake difference keeps the sign of Figure 4D with p < 0.05
    under every reading; partially reproduced when it holds for one measure, or under some readings only
    (the outcome then rests on the reading adopted).'
- id: fig4f-model-hyperpolarizing-less-activity
  statement: In the network model, shunting E_GABAAR gives more variable input-evoked spike times, while
    hyperpolarizing E_GABAAR gives less activity and spiking more closely aligned across neurons.
  source: Figure 4E and 4F; Results, Shunting inhibition promotes local network desynchronization and
    response flexibility, paragraph 2
  quote: We observed that networks utilizing shunting E GABAAR exhibited more variable input-evoked spike
    times, whereas networks with hyperpolarizing E GABAAR exhibited less activity and the input-evoked
    spiking was more closely aligned to the spiking of other neurons in the network
  data: elsewhere
  where: Not deposited; generated by the paper's simulation code, gist.github.com/paulbrodersen/2ce61e4e790e2a351d52d921f848e122
    at revision f6a05661
  criterion: The paper's simulation gist at revision f6a05661, run 20 times (Methods, "Each simulation
    was repeated 20 times"), with its defaults (100 patterns, 100 repeats, 800 excitatory and 200 inhibitory
    neurons, E_GABA -60 mV then -80 mV in the excitatory neurons). Per run and condition, the gist's entropy
    and synchrony of each excitatory neuron, from spikes 0 to 12 ms after each input in the first stimulus
    set of the condition; the 20 runs pooled (16,000 neurons). Random seeds are not fixed by the paper
    and are taken as given by the gist (none set). The paper gives no number or test for the activity;
    the mean peri-stimulus firing rate of the excitatory neurons (the gist's firing_rates) is compared
    between conditions. Reproduced when it is lower under the hyperpolarizing condition in at least 18
    of the 20 runs (a standard choice); the alignment part is judged in fig4h-model-synchrony.
