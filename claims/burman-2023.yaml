# Claims for Burman, Brodersen, Raimondo, Sen & Akerman (2023), Neuron 111, 3531-3540,
# "Active cortical networks promote shunting fast synaptic inhibition in vivo", on dandiset 000458.
# Written by an agent (model "claude-opus-5-5", Claude Code, runner "GitHub Actions"),
# 2026-11-10, protocol pilot-14 as stated in docs/protocol.md (Reader, steps 1 to 4).
#
# Text read. The version of record (open access, CC BY), full text from Europe PMC (PMC11913778),
# in paper/10.1016-j.neuron.2023.08.005.txt: Summary, Introduction, Results, the legends of
# Figures 1 to 4, Discussion, STAR Methods with Tables 1 and 2, and Data and code availability.
# The supplement (Document S1, Figures S1 to S7 and their legends) is not in the text, and no PDF
# was supplied. No claim on the dandiset needs it except figs6-rate-regressed, whose method is
# only in the Figure S6 legend; that claim names readings. The claims on Figures S2 to S5 and S7
# rest on the main-text sentences that cite them, and their tests are not known here.
#
# Code read. (1) gist.github.com/paulbrodersen/a77bcf5e06ae27fa96923cb313a02ccf, revision
# 43a13d89441b7f56e835e84fa5811d9567917daf, burman_et_al_2023_neuropixel_data_analysis.py: reads
# the 17 NWB sessions of DANDI:000458 (version 0.230317.0039, named in its docstring) and writes,
# per unit, evoked firing rate, peri-stimulus histogram entropy and synchrony for the awake and
# isoflurane epochs. It does not hold the exclusion step, the statistics or the plots.
# (2) gist.github.com/paulbrodersen/2ce61e4e790e2a351d52d921f848e122, revision
# f6a05661c10051560aa381e334099efd8521617b, burman_et_al_2023_neuronal_network_simulation.py: the
# Brian 2 network of Figure 4E to 4H and Figure S7, one run per call. (3)
# github.com/richardjburman/burman-et-al-2022---Awake-EGABAAR, commit
# a404c3ec9e8ba6865500ec5e1138835df4398c08: the NEURON model of an L2/3 pyramidal neuron and the
# Matlab analysis of its simulated ramps (Figure S4; 90% series resistance correction). No code for
# the patch-clamp analysis is linked (the Methods say it was custom Python).
#
# Data the paper used, as it reports them.
# Patch clamp (Figures 1 to 3, S1 to S5). Gad2-IRES-Cre x Ai32 (ChR2(H134R)-YFP in Gad2 neurons)
# mice of both sexes, 6 to 8 weeks old. Gramicidin perforated patch recordings of L2/3 pyramidal
# neurons in V1, under urethane anesthesia or awake and head-fixed, with local VU0463271 (KCC2
# block, anesthetized) or NBQX (awake). 473 nm light through the pipette (Optopatcher) evokes
# GABA-A receptor responses; 20 kHz sampling. Measured: series and membrane resistance,
# spontaneous Vm in current clamp (5 min), light-evoked current-clamp responses (15 sweeps, 10 ms
# pulse), and voltage-clamp ramp (-130 to -30 mV, 150 ms, baseline and light ramps) and step
# protocols, from which RMP, E_GABAAR, DF_GABAAR and the GABA conductance are taken. None of
# these recordings is in DANDI:000458, and the paper deposits them nowhere ("Any additional
# materials required to reanalyze data are available on request to the lead contact"). Their
# claims are kept, as data the paper recorded; they cannot be tested on this dandiset.
# Neuropixels (Figures 4A to 4D, S6). The paper reanalyzes the Allen Institute dataset of Claar et
# al. (2023), DANDI:000458 (key resources table; claims/claar-2023.yaml describes it): head-fixed
# mice with up to three Neuropixels probes and a bipolar stimulating electrode in layer 2/3 or 5/6
# of SSp or MOs, single electrical pulses delivered awake and under isoflurane. The paper uses 17
# recordings in 16 mice (sub-569073 has two sessions); units are regular spiking units of the
# stimulated area, 662 after exclusion. Measured variables used: unit spike times, waveform
# duration and location; trial times, stimulus type, behavioral epoch, validity and stimulation
# target region.
# Network models (Figures 4E to 4H, S7) are generated by the paper's simulation code (data
# elsewhere, where names the code).
#
# Method for the claims on DANDI:000458, fixed from the Methods ("Pre-processing of Neuropixels
# dataset", "Characterization of stimulus-evoked spiking responses", "Statistical analyses") and
# the analysis gist (1). Cited in the criteria as N1 to N8.
# N1 Sessions. The 17 sessions listed in the gist (see dataset-sessions-link).
# N2 Units. Regular spiking units, waveform duration of 0.4 ms or more (Methods; the gist uses
#    strictly more than 0.4, which is shown as a variant). Area, open between two readings:
#    (A1) the Methods, units whose location annotation is "SSp-ll" or "SSp-tr", or "MOs",
#    whichever area was electrically stimulated in the session; (A2) the gist, units whose
#    location's first three characters are among the session's estim_target_region values of
#    its electrical trials.
# N3 Trials. Electrical stimulus trials with is_valid true, behavioral_epoch "awake" for awake
#    and "isoflurane" for anesthetized; all stimulus intensities and stimulation sites of a
#    session pooled; times taken from each trial's stop_time (gist; the Methods say only
#    "following an electrical stimulus").
# N4 Window. Spikes from 2 to 12 ms after the stimulus (Methods and gist), in 1 ms bins (10
#    bins). The Methods' "12 ms following stimulus onset" for the histograms is read as this
#    window, as the gist computes it.
# N5 Entropy. Per unit and condition, the histogram of its spikes over all trials, normalized
#    to sum to 1, entropy by scipy.stats.entropy (natural log, nats); undefined for fewer than
#    two spikes (gist).
# N6 Synchrony. Per trial, the histogram of the spikes of all the session's selected units (the
#    unit itself included), divided by its total spike count; for each spike of a unit, the
#    value of that histogram at the spike's bin; the unit's synchrony is the mean over all its
#    spikes in all trials (Methods and gist).
# N7 Evoked firing rate and exclusion. Units with an evoked rate below 0.1 Hz or above 200 Hz in
#    either condition are excluded (Methods). The rate is open between two readings: (F1) the
#    Methods, the unit's spike count in the window divided by the number of trials times 10 ms;
#    (F2) the gist's get_firing_rate, which sums the spikes' times in ms after the stimulus
#    (np.sum of spike_times) where a count would be expected, and divides by (the highest index
#    of a trial with any population spike, plus one) times 10 ms. The Methods come first; F2 is
#    the code that produced the paper's numbers. The gist does not apply the exclusion; it is
#    taken to act on the rate column it writes. Every claim on the dandiset is run under the four
#    readings A1F1, A1F2, A2F1 and A2F2.
# N8 Statistics. Values are mean +- SEM over neurons and awake against anesthetized is a paired
#    t test (scipy.stats.ttest_rel) over the neurons (Figure 4D legend; Methods). A unit with an
#    undefined value in either condition is left out of that measure's test, a standard choice.
#
# Tolerances. The paper's SEM where it gives one; otherwise 10% of the reported value.
