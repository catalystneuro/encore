# Claims for Bell Vila, Koletar, Dorr, Trevisiol, Goubran, Sled, Bazzigaluppi & Stefanovic,
# "Parametrizing alternating current stimulation for neuromodulation", Imaging Neuroscience
# (2025/2026), doi:10.1162/imag.a.1066, on dandiset 001678.
#
# Written by an agent (model "claude-opus-5-5", Claude Code in GitHub Actions), 2026-10-21,
# protocol as stated in docs/protocol.md. No data of the dandiset were looked at; only its title
# and description on the archive.
#
# Text read: the version of record, open access (CC BY), as served by Europe PMC (PMC12779756),
# main text with Methods, figure legends and Tables 1 to 4, and the supplementary material
# (imag.a.1066_supp.pdf: sections S1 1-min sACS, S2 20-min sACS, S3 sham; Tables S1.1 to S1.7,
# S2.1, S2.2, S3.1; Figures S1.1 to S1.6, S2.1 to S2.4), extracted to text by PyMuPDF.
#
# Data the paper used (Methods 2.1 to 2.4). 22 adult Sprague-Dawley rats under propofol, with a
# 4 x 4 multielectrode array (16 Pt-Ir shanks, 0.5 mm apart) 300 um deep in layer 3 of right
# sensorimotor cortex, subcutaneous stimulating pads on the skull medial and lateral to the
# window. TDT PZ5, sampled at 24 kHz (24414.0625 Hz in the code); LFP 0.3 to 300 Hz stored at
# 12 kHz, MUA 500 to 3000 Hz stored at 24 kHz; the stimulation monitor (two channels, MonA; the
# code takes their difference as the stimulating waveform).
#  - 1-min paradigm: 9 rats (4 male, 5 female, 3 months). 20 trials per rat, each 1 min baseline,
#    1 min sACS, 1 min post; frequencies 5, 10, 20, 40, 140 Hz by amplitudes 50, 100, 200,
#    400 uA, in randomized order. 140 Hz trials were dropped (incomplete artifact removal), so 16
#    combinations are analysed.
#  - 20-min paradigm: 13 rats (7 male, 6 female). 20 min baseline, 20 min of 40 Hz, 100 uA sACS,
#    and the 10 min after offset (the dandiset description adds further post-stimulation
#    recordings up to an hour, which the paper does not analyse).
#  - Sham: one F344 nTg female rat, same preparation, 80 min under propofol without sACS,
#    split into sixteen 3-min blocks assigned to the 16 parameter combinations. The dandiset
#    description names only the 9 and 13 rats; whether it holds the sham recording is the
#    author's to find.
#  Measured variables: spike times of sorted neurons; firing rate (FR) and entrainment, the
#  square root of the absolute pairwise phase consistency (sqrt|PPC|) of spike phases relative
#  to the stimulating waveform; per neuron significance by permutation; LFP log power in six
#  bands (delta 0.5-4, theta 4-8, alpha 8-12, beta 12-30, low gamma 30-80, high gamma 80-140 Hz)
#  and the Tort modulation index (MI) for eight band pairs; electric fields from the
#  stimulation artifact.
#
# Code read: github.com/m-bellvila/Parametrizing-alternating-current-stimulation-for-neuromodulation,
# commit 3b89bf2245c21c660427edcac3ecdf8cda5e7845 (2025-12-05). It holds MUAartrem.m (artifact
# removal), concatdataforspikesorting.py (concatenation for spike sorting), phaseextract.py
# (spike phases and neuron inclusion) and nulldistribution.py (permutation null distributions).
# Its README also names signeurons.py (the comparison of observed changes with the null), which
# the repository does not hold. No code is given for the linear mixed models, the regressions,
# the LFP power and PAC analysis, the electric field estimates or the FEM. The paper says data
# and scripts are also on Science Data Bank (doi:10.57760/sciencedb.32375); its file list could
# not be read here (the archive asks for a login).
#
# Pipeline, as the Methods give it, with the code where the Methods are silent:
#  - Artifact: during stimulation the MUA band is cleaned with the ARtACS causal comb filter
#    (Methods 2.5); MUAartrem.m runs artacs.dft.causal over the stimulation frequency +/- 1 Hz
#    (10 Hz and below) or +/- 4 Hz (above 10 Hz, below 100 Hz), 10 periods, per channel.
#  - Spike sorting: SpyKING CIRCUS, spatial whitening, detection threshold 6 MAD, templates
#    merged above 0.95 correlation (Methods 2.6). Other SpyKING CIRCUS settings are not given;
#    software defaults are the standard choice.
#  - Phase: Hilbert phase of the stimulating waveform (the difference of the two monitor
#    channels) over the stimulation period; spikes of the baseline, stimulation and post windows
#    take the phase at the same offset from the start of their window (phaseextract.py; the
#    "temporally extended" waveform of Fig. 3C). sqrt|PPC| as in Methods 2.6.
#  - Inclusion of a neuron in a trial: FR of at least 0.25 Hz in more than half of the 10-s
#    windows of baseline and stimulation (Methods 2.6); phaseextract.py adds at least one such
#    window in each of the two periods (1-min) or more than 2 spikes in each (20-min).
#  - Significance: permutation test, 10,000 shuffles, p <= 0.05 (Methods 2.6). FR from 100-ms
#    bins of both periods pooled, shuffled and split in two; sqrt|PPC| from spike phases pooled
#    and split. nulldistribution.py first truncates the larger phase group to the size of the
#    smaller. A neuron's change is an increase or a decrease by the sign of the observed change.
#    "Any change" is a significant FR or sqrt|PPC| change.
#  - 20-min windows: the full 20 min of stimulation against the 20 min of baseline before it;
#    the 10 min after offset against the 10 min before onset (Methods 2.6, nulldistribution.py).
#  - Grubbs' test (alpha 0.05) removes outliers from the Delta values of each
#    frequency/amplitude group before the mixed models and regressions (Methods 2.6).
#
# Details the paper and code leave open, with the readings each criterion runs (labels are
# used in the criteria):
#  [S] Sorting unit. Methods 2.6 say sorting was "performed on per trial MUA recordings";
#      concatdataforspikesorting.py concatenates all trials of a rat (and all segments of a
#      20-min experiment) into one sorting. Readings (S1) one sort per rat over the concatenated
#      recording, as in the code; (S2) one sort per trial.
#  [W] Analysis windows. The Methods compare the full 1 min (and the full 20 min) with the
#      baseline. nulldistribution.py drops the first 5 s of each period (1-min, 5 to 60 s of
#      baseline and stimulation; 20-min stimulation from 5 s after onset). Main reading (W1)
#      full periods, per the Methods; variant (W2) the code's 5-s clip. In the 20-min code the
#      FR null uses only bins from 5 to 60 s of each period (numbins is set from 55 s); that is
#      run as a further variant of the 20-min stimulation test only.
#  [P] Sidedness of the sqrt|PPC| test. For FR the Methods test the absolute Delta FR
#      (two-sided). For sqrt|PPC| they say only "occurring in <=5% of null distribution samples",
#      and the code that compares (signeurons.py) is missing. Readings (P1) two-sided on the
#      absolute Delta sqrt|PPC| as for FR; (P2) one-sided in the direction of the observed change.
#  [G] Grubbs' test, per frequency/amplitude group. Readings (G1) per category group (for
#      example the Delta sqrt|PPC| of neurons with significant increases), iterated until no
#      outlier remains; (G2) the same, a single pass; (G3) over the Delta values of all
#      significantly changed neurons of the combination together, iterated.
#  [R] Points of the linear regressions (scipy.stats; Figs. 6 to 10, Tables S1.2 to S1.5). For
#      the magnitude of change, (R1) one point per affected neuron and trial, (R2) one point per
#      rat and combination, the rat's median. The R2 and SE printed in Table S1.2 imply about 100
#      points for the 400 uA increase in sqrt|PPC| (about 98 residual df), which fits R1; both are
#      run. For the share of neurons affected, one point per rat and combination (Table S1.5 for
#      40 Hz implies about 35 points). Table S1.4 and S1.5 slopes and intercepts are in fractions
#      (intercepts near 0.6 for FR decrease); the main text converts them inconsistently (see the
#      claims).
#  [L] LFP channels and model (Methods 2.7). A channel is "proximal" to a neuron when the neuron
#      was detected on it (Results 3.7). Channels with mixed responses are excluded, read as (L1)
#      a channel with both a significant increase and a significant decrease in the same metric
#      (FR, or sqrt|PPC|), or (L2) a channel with any increase and any decrease across both
#      metrics. The model is log power (or order-normalized MI) on band, condition and channel
#      response with all their interactions (the pairwise pre against post comparisons per band
#      and response need the three-way interaction), random intercepts for channel within
#      subject, one row per window. Readings for the family of the Bonferroni correction (B1)
#      all pre against post comparisons of the model (bands times responses); (B2) none beyond
#      the single comparison per band and response (the emmeans default within groups). Log
#      base, (N1) natural, (N2) base 10. FFT window, (F1) rectangular (none named), (F2) Hann.
#  [M] MI (Methods 2.7). Tensorpac, Tort MI, wavelet decomposition, phase 1 to 29 Hz in 0.5 Hz
#      steps 2 Hz wide, amplitude 30 to 140 Hz in 1 Hz steps 5 Hz wide, 18 phase bins, 200
#      surrogates by shuffling the amplitude, 10-s windows over the 2 min before and after.
#      Open, (M1) MI values not significant against the surrogates set to zero before averaging
#      within a band pair, or (M2) all values averaged and significance only reported. Order
#      normalization (Peterson & Cavanaugh, bestNormalize orderNorm) over (O1) all MI values of
#      the model together, or (O2) each band pair apart.
#  A claim with several readings is reproduced when it holds under one of them; when the
#  readings give different outcomes the claim is blocked as methods_underspecified, with all
#  results shown. Absence claims are judged on the paper's own test as written.
#
# Data: every claim uses the recordings the paper describes (data dataset), except the FEM
# claims, which use the ViZOO Big Male Rat model (IT'IS Foundation) solved in Sim4Life, scaled
# to the measured fields (with_inputs).
schema_version: 2
