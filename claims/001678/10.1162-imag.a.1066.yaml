- id: efield-1min-medians
  statement: The electric fields estimated from the stimulation artifact in the 1-minute
    experiments had medians of 0.77, 1.42, 2.86 and 6.04 mV/mm for 50, 100, 200 and 400 uA.
  source: Results 3.1, paragraph 1; Figure 1C
  quote: The magnitude of electric fields was assessed from sACS artifacts in electrophysiological
    recordings, and had medians of 0.77 ± 0.29, 1.42 ± 0.60, 2.86 ± 1.20, and 6.04 ± 1.68 mV/mm for
    50, 100, 200, 400 μA sACS amplitudes, respectively
  data: dataset
  expected:
  - quantity: median electric field, 50 uA
    value: 0.77
    tolerance: 0.29
    unit: mV/mm
  - quantity: median electric field, 100 uA
    value: 1.42
    tolerance: 0.6
    unit: mV/mm
  - quantity: median electric field, 200 uA
    value: 2.86
    tolerance: 1.2
    unit: mV/mm
  - quantity: median electric field, 400 uA
    value: 6.04
    tolerance: 1.68
    unit: mV/mm
  criterion: Method from Methods 2.8. For each rat and amplitude, every channel of every trial
    of that amplitude is band-pass filtered at the stimulation frequency (5, 10, 20 or 40 Hz);
    the peak voltage of each stimulation cycle is averaged over the stimulation period per
    channel; differences between neighbouring electrodes along each array axis are divided by
    the 0.5 mm spacing (Methods 2.3), the two orthogonal fields combined by vector addition,
    outliers removed by Grubbs' test (alpha 0.05), and the field averaged over the frequency
    trials of the amplitude. Tolerances are the paper's stated spread. Open, with readings run
    (a) the median over rats of each rat's average field, (b) the median over all channel-pair
    estimates of all rats (Fig. 1C left shows these); "maximal" field per axis read as (i) each
    neighbour pair or (ii) the largest pair per axis and rat. The band-pass filter is not
    named; a zero-phase Butterworth band of +/- 1 Hz around the stimulation frequency on the
    LFP stream is the standard choice and is stated as one. Reproduced when all four medians are
    within tolerance under one reading and rise with amplitude.
