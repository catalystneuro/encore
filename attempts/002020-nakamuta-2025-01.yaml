findings:
- kind: metadata_insufficient
  statement: The files give no days in vitro and no plating date (each says that days in vitro are unknown
    and that the subject age is the donor's E18), only recording dates. No result can be placed on the
    paper's DIV axis, which blocks the claims whose result is a DIV (onset at 2 to 3 DIV, power law at
    about 15 DIV, the shift near 10 DIV, avalanches at about 15 DIV). The DIV of each dish's first recording
    would settle it.
- kind: metadata_insufficient
  statement: Spike times are given from the first detected spike, not from the recording start, whose
    frame is not stored. Time bins can only be aligned to the first spike.
- kind: selection_undocumented
  statement: The dataset holds 129 recordings, 17 of them with a mean rate at or below 0.03 Hz, the paper's
    exclusion rate, and does not mark which recordings the paper analysed. Near-silent recordings occur
    within series (23317 on days 3 and 4, 23312 on day 22, 23302 on days 7 and 8) and at the ends of 23282
    and 23302.
- kind: other
  statement: Six recordings of dish 23311 (days 8 to 13) hold 338 to 702 electrodes and one of 23280 (day
    6) holds 525, where the other recordings hold 956 to 1012; the dataset does not say why.
- kind: methods_unavailable
  statement: Question for the authors. How is the exponential decay rate b of the variance spectrum computed
    (the fitted formula, what x is, which ranks are fitted, and whether the error is on log or raw values)?
    With f(x) = a x^-c exp(-b x), x the PC rank and all positive eigenvalues, b is 0.001 to 0.03 in every
    active recording, so the 0.1 boundary between the Power-law and Exponential groups puts nearly every
    recording in the Power-law group; fits to the top 30 or 100 ranks, or with x as rank over the number
    of PCs, do not separate early from late recordings either, and independent Poisson counts at the recorded
    rates give the same b as the data. Fitting the rank as a function of the variance (the axes of the
    Figure 1D legend) puts b on the scale of 0.1 in early recordings; is that the fit?
- kind: methods_unavailable
  statement: Question for the authors. Is the local Moran's I normalized by the variance of the PC weights,
    does w_ii count, and is the locality slope fitted to locality against log PC index or to log locality
    against PC index? The readings give different outcomes for the locality claims, which are blocked for
    that reason; only the unnormalized form against log PC index gives a steeper spectrum with age.
- kind: methods_unavailable
  statement: Question for the authors. For the avalanches, are the spikes of all electrodes pooled into
    one train for the mean inter-spike interval, and is the cascade size the number of spikes or of electrodes?
    And what is the avalanche threshold for Figure S1 and the shuffle and measure of Figure S2 (the supplement
    was not in the text read)?
- kind: methods_unavailable
  statement: Question for the authors. The model of Figure 4 lacks the network size, the weight distributions
    as functions of g, the run length, initial state and inputs, and the binning of model activity for
    PCA, and no code is linked.
