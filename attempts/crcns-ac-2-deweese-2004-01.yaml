- claim: fig2-stereotyped-shape
  outcome: partially_reproduced
  notebook: reproduce_deweese_2004.ipynb
  output: claim:fig2-stereotyped-shape
  measured:
  - 26.5
  - 41.5
  - 1.19
  - 18.12
  notes: In 022801md01b (20 trials per tone) the 32 mean responses peak 26.5 to 41.5 ms after onset with
    heights 1.19 to 18.12 mV, within the widened ranges, under both peak windows. Normalized and aligned
    on their peaks they correlate with their average with median r 0.991 (minimum 0.933), above 0.9. The
    mean response to each neuron's largest tone peaks within 50 ms of onset in 19 of 33 neurons with the
    peak searched after onset (20.75 to 115.5 ms, median 45.25) or in the culling window (20.75 to 84.75
    ms), so the all-neurons part fails under the claims file's 50 ms bound. The responses begin 14.25
    to 38.5 ms after onset in 32 neurons (the mean over all tones first above 1 mV; 021401md02 never exceeds
    it).
  deviations:
  - Trials are each neuron's stable epoch, cycles first_cycle to last_cycle of the data set's cell_specific_parameters.m;
    the paper requires 10 consecutive stable repetitions, and these epochs give its repetition counts
    (mean 18.1, 10 to 63).
  - The alignment window is 100 ms placed around each peak as the culling window sits around the median
    latency, with edge values where it runs off the trace (a plotting choice).
