    of 4), with 14% to 68% of the differences between samples 0. Template matching at thresholds of 3
    to 5 finds up to 29 events per s and, on the inverted traces, 55% to 80% as many (mean over recordings),
    so most of its events are noise; its mean scale is 0.28 to 0.35 mV. The derivative detector with,
    per recording, the lowest threshold at which the inverted trace gives at most 10% as many events (k
    = 3 to 6) gives a mean size of 0.602 +- 0.164 mV over five recordings, outside 0.39 +- 0.08, and a
    mean CV of 0.354, within 0.36 +- 0.03. 050401md02 has one stable sweep (7.7 s) and no threshold meets
    the bound. The event-triggered averages rise within about 2 ms and peak at 0.15 to 0.99 mV; 6.7% to
    12.0% of events fall in the 50 ms after a tone, against 10% by chance. The result moves with the choices:
    fixed thresholds k = 3 and 4 give 0.370 mV (CV 0.421) and 0.487 mV (CV 0.350), each with one value
    holding; bounds of 5% and 20% give 0.702 and 0.549 mV (CV 0.314 and 0.376); the documentation''s file
    order gives 0.726 mV (CV 0.296). No reading with the false positives bounded gives both values. Question
    for the paper''s authors: how were mEPSPs detected and sized (detector, threshold, filtering, baseline),
    and which sweeps of each TTX recording were used? Under the main reading event rates range from 0.11
    Hz (030401md02h, 15 events, 1.04 mV) to 19 Hz (050801md01c, 0.20 mV, sizes down to 0.01 mV), so the
    mean rests on the threshold each recording gets. Without 030401md02h the four others give 0.492 mV
