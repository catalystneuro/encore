- kind: metadata_error
  statement: Anesthetized_cell_info.txt gives a junction potential of about 10 mV and says the true potentials
    are about 10 mV more depolarized than the recorded values. The paper corrects by 12 mV in the other
    direction (more hyperpolarized), and only that correction gives the paper's rest potentials (median
    -70.0 mV, -58.4 to -92.0) from the recorded baselines; the documented direction gives -33 to -66 mV.
- kind: selection_undocumented
  statement: Each anesthetized neuron's cell_specific_parameters.m gives first_cycle, last_cycle, spikethresh
    and sweeps_to_include_in_bumps_anl, which the documentation does not describe for these neurons. The
    cycles give the paper's stable epochs (repetitions 10 to 63, mean 18.1) and spikethresh its spike
    removal (with them the paper's population values follow), so they carry the paper's trial selection.
- kind: metadata_error
  statement: The documentation calls the prepulse height a voltage ("height (negative mV)"); the values
    (100 and 200) are currents in pA, as the cell table's note for 110900md05 (-200 pA to -100 pA) and
    the input resistances they give show.
- kind: data_missing
  statement: Sutter_diag_depth is missing (empty or NaN) for 8 of the 33 anesthetized neurons, so the
    paper's depth range and its depth comparison can be checked on 25.
- kind: other
  statement: The TTX recording 030401md02h, after the documented division by 4, sits near +2.6 mV (1st
    to 99th percentile -5.0 to 6.1 mV), which is not a membrane potential; the other TTX recordings sit
    at -54 to -71 mV. Its offset or gain may be wrong.
- kind: methods_unavailable
  statement: The paper does not say how spike trials were found. The claims file's rule (a fast rise to
    above -20 mV after the junction potential correction, with 10 mV/ms for the rise) and the data set's
    per-neuron spikethresh give different results (mean total variability 5.35 against 4.58 mV); without
    the rise criterion the -20 mV rule gives 4.43 mV. Spikethresh also removes slow depolarizations to
    about -10 mV, which may be regenerative events or large PSPs; keeping them gives 5.11 mV. Spikethresh
    was assumed. Question for the authors, were spikes removed with spikethresh, as a height above the
    15-ms baseline, and were the slow depolarizations removed as spikes?
- kind: methods_unavailable
  statement: 'The paper does not say whether input resistance had the access resistance subtracted; only
    with it subtracted do the prepulse responses give the paper''s 19 to 141 MOhm (median 64). Question
    for the authors: was input resistance the step response minus the access resistance, and over which
    part of the step?'
- kind: methods_unavailable
  statement: The paper gives no method for detecting and sizing mEPSPs. With fixed thresholds of 3 to
    5 noise SDs the mean size is 0.28 to 0.43 mV for template matching (CV 0.37 to 0.60) and 0.37 to 0.63
    mV for the derivative detector (CV 0.33 to 0.53); with the derivative detector and a false-positive
    bound of 5% to 20% it is 0.55 to 0.77 mV (CV 0.27 to 0.40), over the two sweep mappings of the stable
    epochs. Question for the authors, which detector, threshold, filter and baseline were used, and which
    sweeps?
- kind: methods_unavailable
  statement: 'Several details of the variability procedures are not given and move counts near their tolerances:
    the window searched for the mean PSP''s peak, the span of the culling threshold''s peak-to-trough
    height, whether the negative scale factor rule applies to PSP-based culling, whether the tone criteria
    use the mean before or after culling, whether heights are re-measured after culling, and whether the
    random culling controls apply the 10-trial criterion again. Question for the authors: how was each
    set?'
- kind: metadata_insufficient
  statement: Each TTX recording's cell_specific_parameters.m gives first_trial and last_trial, but the
    documentation does not say which ep_<n>.ibw file is trial k. Its Matlab example lists the files with
    dir('ep_*.ibw'), which orders them by name (ep_0, ep_1, ep_10, ...), and that order picks different
    sweeps from the numeric one in four of the six recordings (050301md01, 050501md01, 050501md04, 050801md01c).
    050401md02 has one stable sweep of 7.7 s.
