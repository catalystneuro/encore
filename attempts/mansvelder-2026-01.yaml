- claim: fig3eg-human-fres-sag-rin
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_mansvelder_2026.ipynb
  output: claim:fig3eg-human-fres-sag-rin
  notes: Under readings (a) of O1 to O3 (LMM, donor intercept, 85 cells from 31 donors), fres rises with
    sag in LAMP5 (b = 3.70, p = 0.0004, 67 cells from 26 donors) and VIP cells (b = 4.40, p = 0.024, 18
    cells from 15 donors) and falls with input resistance in LAMP5 cells (b = -0.0037, p = 0.023); VIP
    input resistance gives p = 0.14 (paper p = 0.088). The VIP sag slope is within tolerance (4.79 +/-
    0.479); the LAMP5 sag slope (3.31 +/- 0.331) and the LAMP5 input resistance slope (-0.002 +/-
    0.0002) are not. The interactions with subclass are not significant (sag p = 0.82, input resistance
    p = 0.33), but with LAMP5 and VIP only they are not the paper's four-subclass test; the PV slopes
    cannot be tested. The signs hold in all four combinations of readings and in GEE. Significance
    changes with the reading. The VIP sag slope gives p = 0.063 and 0.23 under sag and input resistance
    reading (b), and the LAMP5 input resistance slope p = 0.058 under chirp reading (b) with sag reading
    (a). GEE gave no estimate for the VIP model. No measured list is given, as the two PV values
    cannot be measured. The outcome follows the criterion's partial rule (signs and p-values hold, a slope does
    not) applied to the parts the dandiset can test.
  deviations:
  - Tested on the dandiset's 85 human layer 1 cells (LAMP5/PAX6/Other 67, VIP 18) where the paper uses
    287 human acute cells of four subclasses; the PV slopes and the four-subclass interactions cannot
    be tested, and the interaction terms here compare LAMP5 with VIP only.
  - Assumed chirp reading (a) of O1 (IPFX v2.0.0 chirp_amp_phase, 0.2 to 40 Hz, LOWESS frac 0.04, Z0 at
    the lowest frequency kept). The Methods say the recordings were "analysed using IPFX python package
    and custom-built Python scripts" (Patch-clamp ZD7288 experiments), and the resonant fractions under
    reading (a) (LAMP5 32.8%, VIP 22.2%) are near Table S3's human fractions (31.25%, 25.0%) while
    reading (b)'s are not (20.9%, 16.7%). Reading (b) is shown.
  - Assumed sag and input resistance readings (a) of O2 and O3 (IPFX v2.0.0 sag on the step whose peak
    is closest to -100 mV, input resistance as the slope over hyperpolarizing steps), as the Methods name
    IPFX for these measures; readings (b) are shown.
  - Mixed models fitted with statsmodels MixedLM (REML) with Wald tests (O5 reading b); the
    Satterthwaite F tests of reading (a) were not run, as they need SPSS or R (lmerTest), not in the
    entry's environment. GEE with exchangeable correlation within donor is shown.
  - Sweep exclusions not in the paper (standard choices); chirp sweeps that were stopped early
    (zero-filled, 50 sweeps), spiked above -20 mV (18) or were not 20 s chirps (162, the 10 s and 40 s
    chirps of the 2017 protocol), and long squares stopped early (211 in chirp cells), are dropped.
  - Subclass labels from the Chartrand et al. (2023) table, not the paper's own assignment, which is
    not published per cell.
