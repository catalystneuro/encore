- claim: fig3ik-human-q-sag-rin
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_mansvelder_2026.ipynb
  output: claim:fig3ik-human-q-sag-rin
  measured:
  - 0.15
  - -0.00005
  notes: Under readings (a) (85 cells, 31 donors), in the model without interactions Q rises with sag (b
    = 0.150, p = 0.0046) and is not related to input resistance (b = -0.00005, p = 0.24); the sag by
    subclass interaction gives p = 0.43. The criterion needs sag at p < 0.001 and input resistance
    negative at p < 0.05, so the tests fail; the sag slope is about a third of 0.47. The LMM without
    interactions did not converge under this reading; GEE on the same terms gives sag b = 0.138 (p =
    0.0006) and input resistance p = 0.11, and its sag by subclass interaction p = 0.034. Under chirp
    reading (b) with sag and input resistance reading (a) the three tests hold (sag b = 0.134, p =
    3e-05; input resistance b = -0.00006, p = 0.047; interaction p = 0.63), which would make it
    partially reproduced (slope outside tolerance); under the other two combinations input resistance
    gives p = 0.58 and 0.10. In no reading is the sag slope near 0.47. Only LAMP5 and VIP cells are
    in the dandiset.
  deviations:
  - Tested on the dandiset's 85 human layer 1 cells (LAMP5/PAX6/Other 67, VIP 18) where the paper uses
    287 human acute cells of four subclasses.
  - Assumed chirp reading (a) of O1 and readings (a) of O2 and O3, for the reasons given under
    fig3eg-human-fres-sag-rin; the readings give different outcomes (chirp reading (b) gives partially
    reproduced), and every combination is shown.
  - Mixed models with statsmodels Wald tests in place of Satterthwaite F tests (O5 reading b), GEE
    shown; the same sweep exclusions and labels as for fig3eg-human-fres-sag-rin.
