findings:
- kind: data_missing
  statement: Dandiset 000630 holds the electrophysiology of 210 human layer 1 interneurons from 53 donors, 85 of
    them with a usable chirp, where the paper's human acute sample has 542 cells from 170 donors (297 with a chirp)
    across all layers and four subclasses. It holds no mouse, cultured or ZD7288 recordings, no PV or SST cells,
    no transcriptomes and no morphologies, so most of the paper's findings cannot be tested on it alone; this attempt
    adds dandisets 000636 and 000020 for them. The dandiset was deposited for Chartrand et al. (2023) and is complete
    for that use; this describes its coverage of this paper.
  about: data
  severity: major
- kind: metadata_insufficient
  statement: The NWB files carry no subclass, t-type, donor name, brain structure, disease, layer or depth, and
    session_description is "PLACEHOLDER". These labels had to be taken from the Chartrand et al. repository (linked
    by the session id in its nwb_path column) and from the paper's Table S1. The dandiset's description names the
    repository, so the labels can be found. The Chartrand table's Depth_from_Pia_microns column is 0 for all 210
    dandiset cells, so no pia-soma distance is available for them.
  about: data
  severity: minor
- kind: other
  about: data
  statement: Many sweeps were stopped before their stimulus ended and are zero-filled to full length without a flag
    in the file; over all 210 files, 50 chirp sweeps and 1763 hyperpolarizing long squares end in zeros (in 000636,
    130 and 2561; in the 000020 files read, 73 and 201). No chirp sweep has zeros only before its chirp, so recordings
    with a leading zero are not what is dropped. An analysis that does not drop them reads 0 mV as data. The zeros
    are evident in the values.
  severity: minor
- kind: metadata_error
  statement: The species is spelled "Homo Sapiens" in 192 files and "Homo sapiens" in 18, and one file gives the
    donor's sex as "unknown" where the Chartrand table gives M.
  about: data
  severity: minor
- kind: other
  about: data
  statement: Checks that passed. Every file links to one row of the Chartrand table by its session id; subject ids
    and donor names map one to one; sex agrees for 209 of 210 files and age (days in the files, years in the table)
    within 0.06 years; all 53 donors are in the paper's Table S1; every one of the 1699 hyperpolarizing steps of
    the 210 files drives the voltage below its baseline inside the stimulus window; no two chirp cells share their
    measures or their first second of chirp response.
  severity: none
- kind: methods_unavailable
  statement: 'Questions for the paper''s authors. The paper''s code address (github.com/nsham2/Shamugia_et_al_2026)
    returned 404, and the Methods leave open (1) the frequency range of the impedance profile and so which frequency
    gives Z0 (0.2 Hz, IPFX''s default, or 0.4 Hz, the stimulus start), the LOWESS fraction for recordings, and the
    side of the peak where f3dB is taken; (2) how sag ratio and input resistance are computed (which step or steps);
    (3) whether the mixed models were fitted in SPSS or Python. This attempt assumed 0.4 to 40 Hz, as Table S3''s
    medians of exactly 0.40 Hz, the mouse LAMP5 medians and the Allen Institute''s own chirp features point to it;
    0.2 to 40 Hz gives resonant fractions nearer the paper''s and changes the outcomes of fig2c, fig2e-lamp5, fig3ik,
    fig5i and figs1. The LOWESS fraction matters as much: at 0.02 in place of 0.04 the human acute LAMP5 resonant
    fraction is 31.0% (paper 31.25%) in place of 19.5%, and at 0.08 it is 3.4%. Sag and input resistance were taken
    as IPFX v2.0.0 computes them.'
  about: paper
- kind: other
  about: paper
  statement: Table S1 lists 43 of the 53 donors of this dandiset (Chartrand et al. 2023) under the dataset "AcuteLDPublished"
    and only 10 under "Chartrand", so the paper's dataset column does not say which of its cells come from this
    dandiset, and cells deposited both here and with Lee, Dalley et al. (2023) may be counted under either. The
    paper cites this dandiset (reference 27) but does not say which of its cells are in it.
- kind: other
  about: data
  severity: minor
  statement: Four cells are deposited in both dandiset 000630 and dandiset 000636 (the same session ids, with identical
    measures), and 41 donors have cells in both. An analysis that combines the two counts these cells twice unless
    it matches session ids, which both dandisets carry.
- kind: other
  about: paper
  statement: The paper lists its mouse cells by Allen cell specimen id (Table S2b) and names no archive for them.
    461 of the 628 are in DANDI:000020, whose files carry the ephys session id but not the specimen id; the map
    between them is in an Allen metadata file that the Allen portal gives at no fixed address (a copy in a third-party
    repository was used). The other 167, among them all the mouse PV and SST cells, were not found (a search of
    the later Allen mouse Patch-seq dandisets by session id found 1 candidate), so the paper's species comparisons
    of PV and SST cells cannot be repeated.
- kind: other
  about: paper
  statement: The human recordings of Lee, Dalley et al. (2023), the paper's reference 2 and most of its human acute
    and cultured cells, are public as DANDI:000636 (version 0.241120.0510), with per-cell labels in github.com/AllenInstitute/human_patchseq_gaba;
    the paper cites the Science article but not this dandiset, and says only that most data are open source.
