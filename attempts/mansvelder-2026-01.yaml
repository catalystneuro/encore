findings:
- kind: data_missing
  statement: The dandiset holds the electrophysiology of 210 human layer 1 interneurons from 53 donors,
    85 of them with a usable chirp, where the paper's human acute sample has 542 cells from 170 donors
    (297 with a chirp) across all layers and four subclasses. It holds no mouse, cultured or ZD7288
    recordings, no PV or SST cells, no transcriptomes and no morphologies, so 40 of the paper's 44
    findings cannot be tested on it. The dandiset was deposited for Chartrand et al. (2023) and is
    complete for that use; this describes its coverage of this paper.
  about: data
  severity: major
- kind: metadata_insufficient
  statement: The NWB files carry no subclass, t-type, donor name, brain structure, disease, layer or
    depth, and session_description is "PLACEHOLDER". These labels had to be taken from the Chartrand
    et al. repository (linked by the session id in its nwb_path column) and from the paper's Table S1.
    The dandiset's description names the repository, so the labels can be found.
  about: data
  severity: minor
- kind: other
  about: data
  statement: Many sweeps were stopped before their stimulus ended and are zero-filled to full length
    without a flag in the file; among the 93 files with chirp sweeps, 50 chirp sweeps and 211
    hyperpolarizing long squares end in zeros. An analysis that does not drop them reads 0 mV as data.
    The zeros are evident in the values.
  severity: minor
- kind: metadata_error
  statement: The species is spelled "Homo Sapiens" in 192 files and "Homo sapiens" in 18, and one file
    gives the donor's sex as "unknown" where the Chartrand table gives M.
  about: data
  severity: minor
- kind: other
  about: data
  statement: Checks that passed. Every file links to one row of the Chartrand table by its session id;
    subject ids and donor names map one to one; sex agrees for 209 of 210 files and age (days in the
    files, years in the table) within 0.06 years; all 53 donors are in the paper's Table S1; every one
    of 579 hyperpolarizing steps drives the voltage below its baseline inside the stimulus window; no
    two chirp cells share their measures or their first second of chirp response.
  severity: none
- kind: methods_unavailable
  statement: Questions for the paper's authors. The paper's code address
    (github.com/nsham2/Shamugia_et_al_2026) returned 404, and the Methods leave open (1) the frequency
    range of the impedance profile and so which frequency gives Z0 (0.2 Hz, IPFX's default, or 0.4 Hz,
    the stimulus start), the LOWESS fraction for recordings, and the side of the peak where f3dB is
    taken; (2) how sag ratio and input resistance are computed (which step or steps); (3) whether the
    mixed models were fitted in SPSS or Python. This attempt assumed the IPFX v2.0.0 computations
    (0.2 to 40 Hz, LOWESS frac 0.04, f3dB above the peak, sag on the step nearest -100 mV, input
    resistance as the slope over hyperpolarizing steps) because the Methods name IPFX and because the
    resulting human LAMP5 and VIP resonant fractions (32.8%, 22.2%) are near Table S3's (31.25%,
    25.0%), while 0.4 to 40 Hz gives 20.9% and 16.7%. The outcome of fig3ik-human-q-sag-rin depends on
    the frequency range.
  about: paper
- kind: other
  about: paper
  statement: Table S1 lists 43 of the 53 donors of this dandiset (Chartrand et al. 2023) under the
    dataset "AcuteLDPublished" and only 10 under "Chartrand", so the paper's dataset column does not say
    which of its cells come from this dandiset, and cells deposited both here and with Lee, Dalley et al.
    (2023) may be counted under either. The paper cites this dandiset (reference 27) but does not say
    which of its cells are in it.
