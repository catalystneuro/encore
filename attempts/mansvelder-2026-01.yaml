- claim: figs1-region-pathology
  outcome: reproduced
  assumed: true
  notebook: reproduce_mansvelder_2026.ipynb
  output: claim:figs1-region-pathology
  notes: With Table S1's lobe and disease per donor (temporal 74, frontal 8, parietal 1 cell, 2 cells
    without a lobe; epilepsy 67 cells from 25 donors, tumour 18 from 6), under chirp reading (a) fres,
    Q, f3dB and input resistance differ neither between lobes (Kruskal-Wallis p = 0.37, 0.65, 0.76,
    0.23) nor between epilepsy and tumour (Mann-Whitney p = 0.097, 0.35, 1.00, 0.84). None reaches p <
    0.05 under chirp reading (b), input resistance reading (b), or with the Chartrand table's labels
    (47 cells with a disease). Sag, which the paper finds different by region and lower in epilepsy
    (both p < 0.001), differs between lobes (p = 0.044) but not between epilepsy and tumour (p = 0.94,
    medians 0.131 and 0.125); with the Chartrand table's labels it is lower in epilepsy (0.132 against
    0.214, p = 0.014) and not different between lobes (p = 0.067). Both readings of the criterion's cell
    set are the same here, as there are no cultured cells.
  deviations:
