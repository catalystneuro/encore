inputs:
- what: Per-cell labels of the human layer 1 cells (session id through nwb_path, donor name, subclass, t-type, structure,
    medical condition, donor sex and age), from data/human_l1_dataset_2023_02_06.csv of the analysis repository
    of Chartrand et al. (2023), which the dandiset's description names. Labels only; no measurements are taken from
    it.
  source: https://github.com/AllenInstitute/patchseq_human_L1 at commit 7777857c1b89b19735e45fd9c9bd7493cc1d805c
- what: Supplementary Table 1 of the paper (donor name, dataset, area, disease category, lobe), read from the preprint's
    supplement and written into resonance.py as TABLE_S1; donor labels only.
  source: doi:10.21203/rs.3.rs-11136357/v1 (Supplementary Information, Table 1)
- what: 'DANDI:000636 version 0.241120.0510, "Human interneuron patch-seq electrophysiology" (Lee, Dalley et al.
    2023, the paper''s reference 2): electrophysiology of human acute and slice-culture interneurons, 690 of its
    706 files read (those the Lee, Dalley et al. table lists). Used for the human acute cells beyond layer 1 and
    for the cultured cells.'
  source: doi:10.48324/dandi.000636/0.241120.0510
- what: Per-cell labels of Lee, Dalley et al. (2023) (subclass, acute or culture, donor, layer), data/LeeDalley_manuscript_metadata_v2.csv,
    matched to the 000636 files by nwb_id; and the Allen Institute's chirp features of the same cells (data/LeeDalley_ephys_fx.csv),
    used only as a check of the impedance computation.
  source: https://github.com/AllenInstitute/human_patchseq_gaba at commit 5eb357a1cea246c7c847b5608a8fc7e87ea95b58
- what: 'DANDI:000020 version 0.210913.1639, "Patch-seq recordings from mouse visual cortex" (Gouwens et al. 2020):
    the 461 files whose cells are among the paper''s mouse cells (Table S2b). Used for every mouse comparison.'
  source: doi:10.48324/dandi.000020/0.210913.1639
- what: 'The Allen Institute''s per-cell metadata of the mouse Patch-seq release (20200711_patchseq_metadata_mouse.csv:
    cell specimen id, ephys session id, T-type, Cre line, sex), copied in a third-party repository; the Allen portal
    gives the file at no fixed address. Labels and the specimen-to-file map only.'
  source: https://github.com/keon-arbabi/patch-seq-microglia at commit bb5c0e206c6f01a0a5639fa3ef843641ecf4cb7e
    (data/patchseq/20200711_patchseq_metadata_mouse.csv)
- what: 'Patch-seq expression of the human cells: data/ps_human.RData of the Chartrand et al. repository (CPM, layer
    1 cells) at the commit above, and data/complete_patchseq_data_sets1.RData and complete_patchseq_data_sets2.RData
    of the Lee, Dalley et al. repository (log2(CPM + 1)) at the commit above, read in memory and matched by specimen
    id. Used for fig6b, fig6c and figs4.'
  source: https://github.com/AllenInstitute/patchseq_human_L1 at commit 7777857c1b89b19735e45fd9c9bd7493cc1d805c;
    https://github.com/AllenInstitute/human_patchseq_gaba at commit 5eb357a1cea246c7c847b5608a8fc7e87ea95b58
- what: Supplementary Table 2b of the paper (cell specimen id and mouse of each mouse cell, 628 rows), read from
    the preprint's supplement (PDF text layer) and written into resonance.py as TABLE_S2B.
  source: doi:10.21203/rs.3.rs-11136357/v1 (Supplementary Information, Table 2b)
outcomes:
- claim: chartrand-label-link
  outcome: reproduced
  notebook: reproduce_mansvelder_2026.ipynb
  output: claim:chartrand-label-link
  notes: All 210 files match one row of the Chartrand table by session id. No NWB subject has more than one donor
    name and no donor name more than one subject. Sex agrees for 209 files (71 F, 138 M); one file gives "unknown"
    where the table gives M. Age in the files (days / 365.25) is 0.01 to 0.06 years below the table's whole years
    over 208 files. All 53 dandiset donors are in Table S1, 43 under the dataset "AcuteLDPublished" (Lee, Dalley
    et al. 2023) and 10 under "Chartrand"; of the 31 donors of chirp cells, 28 and 3. The 85 chirp cells are LAMP5/PAX6/Other
    67 and VIP 18 in the table (3 of the LAMP5/PAX6/Other cells have the t-type SST CHRNA4). The Chartrand table's
    Depth_from_Pia_microns is 0 for all 210 dandiset cells, so it gives no pia-soma distance.
- claim: sample-size
  outcome: not_reproduced
  notebook: reproduce_mansvelder_2026.ipynb
  output: claim:sample-size
  measured:
  - 440
  - 76
  notes: The data assembled hold 440 human acute interneurons (210 from 000630, 230 from 000636 after the 4 shared
    cells) from 76 donors, against 542 +/- 54.2 from 170 +/- 17. 212 have a usable chirp (LAMP5 87, PV 65, VIP 49,
    SST 11; paper 297, LAMP5 144, VIP 60, PV 78, SST 15). The dandiset alone holds 210 cells from 53 donors, 43
    of them under "AcuteLDPublished" in Table S1. There are 456 cultured cells from 54 donors (paper 543 from 89;
    181 with a chirp against 268) and 461 mouse cells from 221 mice (paper 619 from 293; 139 with a chirp against
    248). The criterion's premise that the dandiset holds the "Chartrand" donors is asked as a question (questions/mansvelder-2026.yaml).
- claim: fig2b-human-higher-fres-q
  outcome: reproduced
  notebook: reproduce_mansvelder_2026.ipynb
  output: claim:fig2b-human-higher-fres-q
  notes: 'Kolmogorov-Smirnov, human acute (212) against mouse (139) cells, chirp reading (b): fres D = 0.239, p
    = 1.0e-4; Q D = 0.244, p = 6.6e-5; human medians above mouse (fres 1.20 against 0.40 Hz, Q 1.010 against 1.000).
    Reading (a): p = 4.7e-7 and 1.5e-5, medians 1.08 against 0.20 Hz and 1.010 against 1.000. The paper''s mouse
    PV and SST cells are not in DANDI:000020 (mouse-specimen-link), so the PV and SST comparisons cannot be run.
    With LAMP5 and VIP cells only in both species, fres still differs (p = 2.8e-4, medians 0.401 and 0.400) but
    Q does not (p = 0.25, medians 1.000 and 1.000), so the Q difference rests on the human PV and SST cells, which
    have no mouse counterpart here.'
  deviations:
  - Tested on the human acute cells of 000630 and 000636 (212 with a usable chirp, LAMP5 87, PV 65, VIP 49, SST
    11; paper 297) and the Table S2b mouse cells in 000020 (139 with a chirp, LAMP5 100, VIP 39; paper 248 of four
    subclasses).
  - Assumed chirp reading (b) of O1, the profile kept from 0.4 Hz. Table S3 gives medians of exactly 0.40 Hz (human
    SST, mouse VIP and SST), which only a 0.4 Hz floor gives; reading (b) matches the mouse LAMP5 medians (fres
    1.15 Hz, f3dB 15.18 Hz against 1.15 and 15.20) where reading (a) gives 0.20 Hz; and the Allen Institute's own
    chirp features for the 000636 cells (LeeDalley_ephys_fx.csv) have 0.4 Hz as their lowest peak frequency, with
    medians and a resonant fraction (51.2% against 49.2%) close to reading (b)'s. Reading (a) is shown for every
    claim.
  - 'Sweep exclusions not in the paper (standard choices): chirp sweeps that were not 20 s, were stopped early (zero-filled)
    or spiked above -20 mV, and long squares stopped early, are dropped (counts in the data check).'
