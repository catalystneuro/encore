- claim: wtrack-learning
  outcome: reproduced
  notebook: reproduce_jadhav_2016.ipynb
  output: claim:wtrack-learning
  measured:
  - 0.88
  notes: Proportion correct on day 3 was 0.85, 0.80 and 0.75 (HPa, HPb, HPc; binomial p <= 0.0006 against 0.5) and
    on day 8 0.93, 0.88 and 0.92. The 10 and 20 cm well zones give the same conclusion. The binomial test puts HPa
    and HPb above chance from day 1 and HPc from day 2. 25 to 145 trials were scored per day.
  deviations:
  - A well visit is an entry into a 15 cm zone around a well (the claims file leaves the radius open); 10 and 20
    cm are shown. The first outbound run of each epoch has no previous side and is not scored.
  - Both W-track runs of each day are used, including the second run of days 6 to 8, which the task files place
    in an environment named wtr2; the paper pools all sessions within a day and says the rats ran 2 W-track sessions
    a day for 8 days (SEP, Behavioral Tasks). The linear-track run of day 1 is left out.
- claim: ytrack-learning
  outcome: blocked
  blocked_by: data_missing
  notes: 'The Y-track rats are not in CRCNS hc-28: the bucket holds HPa, HPb and HPc, all W-track rats, and the
    data descriptor describes only the W-track task. No other public copy is named by the paper.'
- claim: tables1-cell-counts
  outcome: partially_reproduced
  notebook: reproduce_jadhav_2016.ipynb
  output: claim:tables1-cell-counts
  measured:
  - 509
  - 81
  - 193
  - 167
  notes: Cell-days with spikes in the W-track runs, after the fast-spiking exclusion, are 509 CA1 (446 expected),
    81 iCA1 (69) and 193 PFC (172), all 12 to 17% above Table S1. After the 50-spike criterion 167 PFC cell-days
    remain against 165, within tolerance (173 with -1 to +1 s rasters). Per animal, CA1 213, 203 and 93 against
    195, 165 and 86, and PFC 45, 94 and 54 against 40, 80 and 51. 104 units have spikes only in the pre-rest and
    are not counted. Which units Table S1 counts is not documented.
  deviations:
  - SWR detection details that the paper leaves to Karlsson and Frank (2009), which is not under paper/, are assumptions
    (Frank-lab practice). A 4th-order Butterworth 150-250 Hz band-pass applied forward and back, the Hilbert envelope
    smoothed with a Gaussian of SD 4 ms, mean and SD over the epoch, at least 15 ms above 3 SD. An event on any
    one ripple tetrode is used (reading a; the SEP excludes from theta periods SWRs 'detected on any of the CA1
    tetrodes with a 3 s.d. criterion'). The onset is the time the envelope last rose above its mean before the threshold
    crossing (the Frank-lab event start; the paper's 96.7 ms mean duration is closer to durations measured from
    there than from the threshold crossing, 79 against 54 ms).
  - Both W-track runs of each day are used, including the second run of days 6 to 8, which the task files place
    in an environment named wtr2; the paper pools all sessions within a day and says the rats ran 2 W-track sessions
    a day for 8 days (SEP, Behavioral Tasks). The linear-track run of day 1 is left out.
  - Units are cell-days (reading a of the claims file). The data set has no identifier that links a unit across
    days, so reading (b), unique units, could not be run.
  - Only the three W-track rats are in the data set; pooled values are judged by the claims file's pooled-value
    rule.
  - SWR-aligned rasters span -500 to +500 ms, the shortest span holding the paper's background window; the -1 to
    +1 s reading is run for the PFC counts and fractions only.
  - Spike width is the spikes file's spikewidth divided by 30 (30 kHz samples); rate is spikes over the day's run
    time.
  assumed: true
