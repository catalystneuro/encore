findings:
- kind: methods_unavailable
  statement: 'Burst detection parameters for the murine organoids are not given. With the stated detection
    (4 x RMS of the 20 ms and 100 ms smoothed population rate) MO2, MO4, MO5 and MO6 have no burst and
    MO3 has four: their highest peaks reach only 3.0 to 3.7 times the RMS, because their rate between
    bursts is high (median smoothed population rate 0.47 to 1.07 spikes per ms), yet the paper''s code
    lists backbone units for all nine. MO3''s four bursts make 160 of its 234 units backbone units; without
    MO3 the murine organoid contrast of Fig. 7B holds and the murine organoid against slice lag contrast
    of Fig. 7D is not significant. Question for the authors, which threshold, peak distance and recording
    length were used for each murine organoid, and for which recordings the minimum peak distance was
    raised towards 2000 ms (35 overlapping bursts in 13 recordings here, a peak in the tail of a longer
    burst, are merged in its place).'
- kind: methods_unavailable
  statement: Question for the authors on the rank-order normalisation (Extended Data Fig. 4D and Supplementary
    Fig. 10B). The legend says z-scored and the Supplementary Methods say (A - B)/(A + B); per burst pair,
    shuffled Spearman correlations average near 0, so the ratio is unstable and the two give opposite
    conclusions here. Which was used, and was it applied per burst pair or per recording?
- kind: data_missing
  statement: The baseline sorted recording of murine organoid MO12 is not in the dandiset (its gabazine
    and NBQX with R-CPP sorted files are), and no longitudinal murine organoid recording (Supplementary
    Fig. 2) is in it; every MO file has age P45D.
- kind: identifier_missing
  statement: Units have positions but no identifier linking them across recordings of one organoid (0
    h and 4 h, Supplementary Fig. 8; drug conditions, Extended Data Fig. 4). The ordered unit positions
    are identical for HO2 at 0 h and 4 h (90 units), for HO3 once the 4 h file's unit 24 is left out (116
    units), and for MO10, MO11 and MO14 between baseline and gabazine, which is consistent with joint
    sorting, but not for MO13, nor between the NBQX with R-CPP recording and any other condition of an
    organoid (printed with ed4c-gabazine-participation). Positions alone are not unique (61 distinct positions
    for 90 HO2 units).
- kind: other
  statement: The HO2 and HO3 recordings at 6, 7, 8 months and 8 months plus 4 h are each deposited twice
    under different session names, and the 7-month ones a third time as HO2_sorted.mat and HO3_sorted.mat,
    with identical spike matrices.
- kind: metadata_error
  statement: The dandiset description says only spike-sorted data are included for the sourced human organoids,
    but raw ecephys files are present for HO1 to HO4 (sixteen files). The slice files say "Sorting/curation
    not specified".
- kind: paper_inconsistency
  statement: The n reported with several tests counts all sorted units or pairs (507 units and 34,056
    pairs in HO1 to HO4, 959 units and 125,607 pairs in the slices), while the Methods and legends restrict
    the tests to units with at least 30 spikes or units active in enough bursts. The Fig. 7A legend's
    unit counts (1048, 1179, 786, 1048) match neither all units (930, 1273, 959, 2001) nor units with
    at least 30 spikes here.
- kind: paper_inconsistency
  statement: Pr1 to Pr4 are cultures from E18 Wistar rat cortex (Methods; the files say Rattus norvegicus),
    while the paper calls all primary cultures murine.
- kind: methods_unavailable
  statement: Question for the authors on the AR fit check of the d2 analysis (Supplementary Methods, d2
    calculation; Supplementary Fig. 27). Preparations were excluded when the AR model's avalanche size
    and duration distributions or power spectrum deviated from the data's by more than one order of magnitude,
    but the comparison is not given (which bins, the largest or a typical deviation, the spectral window;
    the code's 200 s Welch window is longer than the 180 s recordings). Two readings here keep 0, 5, 0
    and 1 or 7, 9, 3 and 8 recordings of HO, MO, MS and PR, against the paper's 3, 7, 4 and 7.
