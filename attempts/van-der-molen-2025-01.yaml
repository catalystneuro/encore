outcomes:
- claim: methods-burst-count
  outcome: reproduced
  notebook: reproduce_van_der_molen_2025.ipynb
  output: claim:methods-burst-count
  measured: 34.8
  notes: Mean 34.8 bursts over the 31 recordings under the code's lengths (SE 6.3, range 0 to 156), within
    38 plus or minus 4. The mean matches but the recordings do not each hold about 40 bursts; four murine
    organoids (MO2, MO4, MO5, MO6) have none under the stated detection and MO1 and MO7 have 113 and 156,
    which offset them. With 800 ms minimum distance the mean is 34.7; with 2000 ms for every recording
    it is 29.5, outside, but the Methods raise the distance only for recordings with long bursts. 35 overlapping
    bursts in 13 recordings are dropped (none in HO1 to HO4).
  deviations:
  - Matlab smoothdata replaced by scipy filters (moving mean; Gaussian with standard deviation one fifth
    of the window, cut at the window), a standard choice.
  - Of overlapping bursts (a peak in the tail of a longer burst), only the one with the higher peak is
    kept, at 700 ms in every recording. The Methods raise min_dist "up to 2000 ms" for "recordings with
    long duration bursts ... to prevent peaks in the tail of the burst from being detected as separate
    burst instances" without naming the recordings; this applies the stated purpose to all (35 bursts
    in 13 recordings). 2000 ms for every recording is shown as a variant.
- claim: fig1c-example-burst-count
  outcome: reproduced
  notebook: reproduce_van_der_molen_2025.ipynb
  output: claim:fig1c-example-burst-count
  measured: 46
  notes: HO1 has 46 bursts in its first 180 s with 700 ms and with 800 ms minimum peak distance (HO2 to
    HO4 have 31, 42 and 28). HO1 is the example organoid for the dependent claims.
- claim: ed1c-lognormal-rates
  outcome: reproduced
  notebook: reproduce_van_der_molen_2025.ipynb
  output: claim:ed1c-lognormal-rates
  measured:
  - 0.949
  - 0.487
  notes: Under reading (a) with all sorted units (the code's choice) the mean R squared is 0.949 for all
    units and 0.487 for backbone units (seven organoids; HO7 has no backbone unit), both within tolerance.
    The code's form of the density gives 0.944 and 0.442. With units of at least 30 spikes the all-unit
    mean is 0.919, outside. Reading (b), the legend's normal fit to log rates, gives 0.60 and 0.36.
  deviations:
  - The fit follows plot_multi_rec_figs_backbone.m (two-parameter density, start values 1 and 0.25, bins
    up to the last non-empty one), read from the paper's code at e9a79c4.
- claim: fig1d-burst-duration
  outcome: reproduced
  notebook: reproduce_van_der_molen_2025.ipynb
  output: claim:fig1d-burst-duration
  notes: Median burst durations of HO1 to HO4 are 511, 628, 472 and 891.5 ms, all between 100 and 1000
    ms. Over the 27 recordings with bursts the medians run from 104 ms (Pr4) to 2681 ms (MO3); HO6, MO3
    and MO9 are above 1000 ms.
- claim: fig1e-peaks-near-burst-peak
  outcome: partially_reproduced
  notebook: reproduce_van_der_molen_2025.ipynb
  output: claim:fig1e-peaks-near-burst-peak
  notes: More than half of the values fall within the bound in 15 of 16 combinations of organoid, quantity
    and bound (fractions 0.53 to 0.89). The exception is HO4, pooled unit-burst peak times within 50 ms
    (0.481). The criterion names the readings and requires every one, and defines no partial outcome;
    the effect is present and falls short in one reading of one organoid, so the claim holds in part (the
    rule for partial outcomes is in the notebook's summary).
- claim: fig2-backbone-fraction
  outcome: reproduced
  notebook: reproduce_van_der_molen_2025.ipynb
  output: claim:fig2-backbone-fraction
  measured:
  - 0.331
  - 0.15
  notes: With units of at least 30 spikes as the denominator (reading b), mean 0.331 and SD 0.150, both
    within tolerance. With all sorted units, mean 0.258 (within) and SD 0.166 (outside 0.126 to 0.154).
    HO7 has no backbone unit here (no unit fires twice in all 21 bursts); HO1 to HO4 have 27, 26, 23 and
    15.
- claim: fig2e-b2b-correlation
  outcome: reproduced
  notebook: reproduce_van_der_molen_2025.ipynb
  output: claim:fig2e-b2b-correlation
  measured: 507
  notes: Backbone 0.796 against non-rigid 0.574 (effect 0.210, p 3e-27, 216 units) under the Methods'
    30% rule, and 0.796 against 0.629 (p 9e-16, 150 units) under the code's 70% rule; higher in each organoid.
    The measured value is the number of sorted units in HO1 to HO4, which equals the paper's n of 507;
    the units that pass the unit rules and enter the test are 216 or 150. Burst-to-burst correlations
    exist only for units active in bursts, so a test over all 507 units cannot be run.
  deviations:
  - Burst-only rates do not hold the inverse ISI across the gap between bursts (the code does, giving
    rates below 1 Hz between bursts).
  - Mixed models fitted by REML with a random intercept, tested with t on Satterthwaite degrees of freedom
    (sequences.lmm, checked against an exact balanced case), in place of the paper's R; the 30-spike rule
    counts spikes over the whole analysed recording.
- claim: fig2g-variance-latency
  outcome: reproduced
  notebook: reproduce_van_der_molen_2025.ipynb
  output: claim:fig2g-variance-latency
  notes: Over 91 backbone units the peak-time variance rises with relative position, p 6e-4 for the rank
    reading and 1e-4 for the rescaled median time (log variance, p 3e-6 and 1e-6); the rank correlation
    is positive in each organoid (0.11 to 0.68).
- claim: ed3f-burst-cluster-variability
  outcome: reproduced
  notebook: reproduce_van_der_molen_2025.ipynb
  output: claim:ed3f-burst-cluster-variability
  notes: Non-rigid units vary more between burst clusters than backbone units under both elbow readings
