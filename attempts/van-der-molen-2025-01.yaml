- claim: supp8-backbone-stable-4h
  outcome: reproduced
  assumed: true
  notebook: reproduce_van_der_molen_2025.ipynb
  output: claim:supp8-backbone-stable-4h
  notes: Units linked by position, walking both units tables in order. All 90 HO2 units and all 116 HO3
    units at 0 h are linked; the two ordered lists of positions are identical, apart from one extra 4
    h unit in HO3 (unit 24). Of the 0 h backbone units, 8 of 10 (HO2) and 13 of 13 (HO3) are backbone
    at 4 h; of the non-rigid units, 74 of 80 and 97 of 103 stay non-rigid. Across recordings, backbone
    units have higher burst-to-burst correlations than non-rigid units in both organoids (HO2 0.748 against
    0.627, Welch p 0.039; HO3 0.820 against 0.607, p 4e-8, 30% rule); with the 70% rule the means are
    still higher (HO2 0.738 against 0.699, p 0.62; HO3 p 0.001). Within each recording alone backbone
    units are above non-rigid units too.
  deviations:
  - Assumption. The dandiset has no unit identifier across the 0 h and 4 h recordings. Units are linked
    by their identical (x, y) positions in the same order, which joint sorting gives and two separate
    sortings would not; positions alone are not unique (61 distinct positions for 90 HO2 units). Results
    of each recording alone are also shown.
  - Cross-recording burst-to-burst correlation, every 0 h burst against every 4 h burst in which the unit
    fires at least twice in the -250 to 500 ms window (Methods' burst-to-burst correlation, bursts paired
    across recordings as Supplementary Fig. 8E), units passing the unit rules in both recordings.
