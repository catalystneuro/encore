- claim: data-recordings
  outcome: reproduced
  notebook: reproduce_timme_2016.ipynb
  output: claim:data-recordings
  measured:
  - 25
  - 7735
  - 309.4
  - 2.132
  notes: 25 recordings, 7735 neurons, 309.4 per recording, every neuron with at least 100 spikes, so the
    deposit already applies the 100-spike threshold. Mean rate 2.103 Hz with spikes over 60 min (reading
    b), 2.132 Hz over each recording's own length (reading a); both within tolerance. Rates range from
    0.028 to 77.5 Hz.
  deviations:
  - The rate can be read two ways (criterion), spikes over each recording's length (a, 2.132 Hz) or over
    60 min (b, 2.103 Hz); both match, and the measured value is (a), the first reading the criterion lists.
- claim: fig4ac-te-lognormal
  outcome: partially_reproduced
  notebook: reproduce_timme_2016.ipynb
  output: claim:fig4ac-te-lognormal
  notes: Significant TE values span several orders of magnitude at both time scales and under both readings;
    the 99th percentile is 8.0e4 to 2.93e5 times the 1st for raw TE and 1.84e3 to 5.43e3 times for normalized
    TE. Fits of Eq 21 to single recordings have a median R2 of 0.86 to 0.96, but fits to the distribution
    averaged over recordings have R2 of 0.08 to 0.61, below the criterion's 0.9 in all eight cases (two
    scales, raw and normalized, readings f and s). The averaged distribution is broad because the recordings'
    distributions sit at different places on the log axis. The spread part of the criterion holds; the
    log-normal fit on the average does not.
  deviations:
  - The TE networks are rebuilt from the deposited spike times; the paper reused the networks of its reference
    [44] (Timme et al. 2014, PLoS One 9 e115764), which are not deposited. Bins of 1.6 and 3.5 ms, past
    states the OR of two bins, a 7-bin uniform jitter, 5000 surrogates and fewer than 5 exceeding are
    taken from [44], Table 1 and Transfer Entropy Analysis, paragraphs 3 and 6, as the paper directs (Methods,
    Effective Connectivity Detection, paragraphs 1 and 4).
  - Assumed which two bins form the past state. [44]'s text writes bins t-d and t-d-1 (with d = 1, bins
    t-1 and t-2, delays of 0 to 2 bins), while its Table 1 and the paper give a delay window of 1 to 4
    bins (1.6 to 6.4 ms and 3.5 to 14 ms), which bins t-2 and t-3 give. Bins t-2 and t-3 are used, the
    version both papers state in numbers. The other reading was not run.
  - For pairs whose jitter moves more than 50 relevant sender spikes, the surrogate counts are drawn from
    a normal distribution with their exact mean and covariance (merged groups of close spikes from 50
    joint draws), not by jittering every spike, to fit the time limit. On DataSet1 and DataSet7 at 1.6
    ms, the full jitter finds 2937 and 3530 significant connections and the approximation 2946 and 3542,
    with 2930 and 3512 in common. The number of past states equal to 1 is held at its real value in each
    surrogate, as [44] states the jitter preserved it.
  - The fit starts from the moments of the binned distribution; the paper gives no starting values. 100
    log-spaced bins span the pooled range of each panel.
