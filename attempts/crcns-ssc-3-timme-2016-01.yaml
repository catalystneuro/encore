    N = 40, alpha = 0.0115; kept at 0.023); neither meets the criterion.
findings:
- kind: data_missing
  statement: The paper analysed the TE networks of its reference [44] (Timme et al. 2014), at time scales
    2 and 3 of that study. The networks, the TE values and the sub-networks are not in the data set, which
    holds spike times only, so the paper's networks cannot be checked; they have to be rebuilt, and a
    rebuilt network may differ from the paper's.
- kind: other
  statement: DataSet19 (2013-01-06-1) lasts 2887498 ms (48 min), where the paper describes 60 minute recordings;
    the data description says most recordings are 3600000 ms. The first ten recordings (2012) have no
    spike in their first 8 s.
- kind: methods_unavailable
  statement: 'Question for the paper''s authors: which bins form the past states of the TE? [44] writes
    the past as bins t-d and t-d-1 (d = 1), which gives delays of 0 to 2 bins, while its Table 1 and this
    paper give delay windows of 1.6 to 6.4 ms and 3.5 to 14 ms (1 to 4 bins), which bins t-2 and t-3 give.
    This attempt used t-2 and t-3.'
- kind: methods_unavailable
  statement: 'Question for the paper''s authors: were the weight distributions (Fig 4A, C), degree distributions
    (Fig 4B, D) and the degree and synergy correlations (Fig 5) computed on the 500 sub-networks per recording
    or on the full networks, and were the correlations Pearson or Spearman? The outcomes differ: the out-degree
    tail (Fig 4B, D) is longer than the in-degree tail on the sub-networks but not in every comparison
    on the full networks, and the out-degree correlations (Fig 5B) are significantly positive under three
    of four readings but not under full networks with Spearman. This attempt assumed sub-networks and
    Pearson.'
- kind: methods_unavailable
  statement: 'Question for the paper''s authors: Fig 5 gives N data = 40 correlations per panel; with
