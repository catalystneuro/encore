inputs:
- what: The paper's analysis code, followed where the claims file cites it (task.py for the task
    performance, imstats.py for the patch extraction, Gabor filter bank and radial-bias test). The
    notebook fetches task.py and imstats.py from the commit and prints the lines it follows.
  source: https://github.com/mannion-lab/ul_sens_fmri_analysis at commit
    571e9312c251ff2166be91a57201112036e5e80d
- what: The experiment code's config.py, for the aperture size and eccentricity of the patches and the
    task timing constants; fetched by the notebook, which prints the lines used.
  source: https://github.com/mannion-lab/ul_sens_fmri at commit 5e98dd81512fa3d226a971a6217426535b682d85
- what: Assumed monitor calibrations for the radial-bias variant only, in place of the unpublished
    measured one, the primaries of sRGB (ITU-R BT.709, D65) and of Adobe RGB (1998), with the Smith and
    Pokorny cone fundamentals as used by Brainard (1996), which the Methods cite; constants written in
    vim3.py. No outcome rests on them.
  source: Brainard DH (1996), Cone contrast and opponent modulation color spaces, in Kaiser and Boynton,
    Human Color Vision, 2nd edition, as cited by the paper; primaries from the published sRGB (IEC
    61966-2-1) and Adobe RGB (1998) specifications
findings:
- kind: data_missing
  statement: The data set holds the raw functional runs, event sequences, task records and stimulus
    screenshots, but not the anatomical images, cortical surfaces, retinotopic mapping or V1, V2 and V3
    definitions that every response measure of the paper uses. The descriptor says so and asks users to
    request them on the CRCNS forum. 15 of the 16 claims are blocked, 14 of them for this reason.
- kind: metadata_insufficient
  statement: The data set holds the 120 stimulus screenshots, but not the measured CIE coordinates of the
    monitor's primaries needed to convert their pixel values to DKL space, in which the image
    statistics of Figure 5 and the radial-bias test are computed; nor are they in the paper or its code
    (a local PsychoPy monitor profile and the unlinked package monitors.conversions). The patches are in
    colour (R, G and B differ in most pixels of 118 of the 120 patches), so the chromatic channels
    cannot be formed without them.
- kind: metadata_error
  statement: The data set's README.txt says it contains fMRI measurements in areas V1, V2 and V3. The
    files are whole volumes of a 35-slice occipital slab with no area labels, so no measurement in V1,
    V2 or V3 can be formed from the data set alone.
- kind: metadata_insufficient
  statement: The NIfTI files are named by scanner series number (for p1003 series 3, 4, 6 to 13, for
    p1010 series 4 to 13), while the sequence and task files are named by run, and the descriptor does
    not give the mapping. The participant configurations of the paper's code take the series in order
    as runs 1 to 10; a leave-one-run-out fit supports this for six participants, and for p1011 it could
    not be confirmed.
- kind: other
  statement: For p1011 the timing of the event sequences and the run order could not be confirmed from
    the data without motion correction; the held-out runs barely follow their own sequences (mean t 0.7
    and 1.1, against 2.6 to 4.9 in the others), and a coarse motion index reaches 3.6 mm by run 10,
    against at most 1.8 mm in the other participants. Its upper-field responsive voxels also lie above
    its lower-field ones, the reverse of the other six.
- kind: metadata_insufficient
  statement: For p1004 runs 1 to 5 the target column of the task lookup does not describe the task the
    participant performed; the paper's code redefines the targets as white 9 and black 5 for those runs
    (the participant misunderstood the instructions). The descriptor does not say so, and the four
    button keys used in the task files are not described.
- kind: code_mismatch
  statement: The Figure S2 legend describes task performance for target onsets near each condition, but
    task.py skips targets and button presses at or before 32 s, bins the others in absolute run time and
    assigns each target to the event starting within 2 s after the bin time plus 32 s (lines 53, 99 and
    141 to 145, printed in the notebook), so the condition labels come from events about 32 s after the
    target. It also puts every press and target after 300 s into one last bin. With the
    assignment by absolute time the conclusion of no difference is unchanged.
