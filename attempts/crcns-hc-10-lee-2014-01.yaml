findings:
- kind: data_missing
  statement: For Lee et al. (2014) the data set holds only the current-step sweeps of 17 PCs and 6
    PVBCs behind Figures S1E to S1H, S3F and Table S1. The paired recordings, optogenetics, imaging,
    anatomy and retrograde labelling behind the paper's main figures are not in it, and the paper
    names no other deposit; 26 of its 34 claims cannot be tested.
- kind: other
  statement: PV34 is deposited twice, as PVBC_PV34.atf and PV34_PVBC_mouse.atf, with identical
    bytes. The descriptor lists 36 cells; the zip holds 37 files.
- kind: metadata_insufficient
  statement: The ATF files record only the membrane voltage, with no injected current and no
    holding current. The step levels can be taken only from the descriptor's table, and the
    voltage responses are consistent with them in sweep order. Because the PCs were held at -70 mV
    with an unrecorded current, their resting potential (Figure S1G, Table S1) cannot be measured.
- kind: metadata_insufficient
  statement: No file or the descriptor gives the animal, slice, sex, hippocampal region (septal or
    temporal) or soma distance from the Pyr/Rad border of a cell, so the sublayer assignment rests
    on the file names alone and results cannot be grouped by animal.
- kind: other
  statement: In PVBC PV37 the sweep order breaks between the first three sweeps (steady-state
    deflection -13.1 mV at the first, -8.7 at the second and -9.1 at the third); its later sweeps
    rise with the step as in every other cell.
