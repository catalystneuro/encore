outcomes:
- claim: figs1e-if-curves
  outcome: reproduced
  notebook: reproduce_lee_2014.ipynb
  output: claim:figs1e-if-curves
  measured:
  - 31.62
  - 30.56
  notes: Two-way ANOVA of firing frequency on group and step (0 to +550 pA), reading (a) of the
    rate (spikes per second of the 1 s step), group F = 0.68, p = 0.411, eta squared 0.0005,
    interaction p = 0.997; reading (b) p = 0.866. The mixed ANOVA with step within cell gives p =
    0.759 and 0.951. At +550 pA, sPC 31.62 and dPC 30.56 Hz under reading (a), 33.63 and 31.24 Hz
    under reading (b), all within tolerance. Reading (a) also gives the paper's p > 0.4. Spike
    counts change by under 1% between thresholds of -20, 0 and +10 mV.
  deviations:
  - The files record no injected current; the step levels are those of the data descriptor's
    table (-400 to +550 pA in 50 pA steps), and the sweep order is checked against the voltage
    responses in the data check.
  - The paper says only "two-way ANOVA"; the model with the group by step interaction is the main
    test, and the additive model (group p = 0.400) and the mixed ANOVA are shown. All agree.
  - Under rate reading (b), a sweep with fewer than two spikes has no interval and is given 0 Hz,
    a standard choice that affects only sweeps at the rheobase.
  - The data set has no animal or slice identifiers, so the result is broken down by cell, not by
    animal.
- claim: figs1f-input-resistance
  outcome: reproduced
  notebook: reproduce_lee_2014.ipynb
  output: claim:figs1f-input-resistance
  measured:
  - 118.7
  - 124.9
  notes: Reading (a), slope over the -100 to +100 pA steps at steady state 0.8 to 1.0 s after
    onset, gives sPC 118.7 and dPC 124.9 MOhm, both within tolerance of 117 and 124. Shapiro-Wilk
    fails, and Mann-Whitney gives p = 1.000 (Cohen's d -0.13). Reading (b) gives 118.9 and 123.7
    MOhm, p = 1.000. Three cells (D1_25abf, D4_11abf, S1_47abf) fire on the +100 pA step; with the
    -100 to 0 pA steps only, sPC 107.2 and dPC 101.8 MOhm (p = 0.673), the dPC value then outside
    tolerance.
  deviations:
  - Step levels from the data descriptor, as for figs1e-if-curves. The pre-step baseline for
    reading (b) is the 0.2 s before onset, a standard choice.
- claim: figs1g-resting-potential
  outcome: blocked
  blocked_by: data_missing
  notebook: reproduce_lee_2014.ipynb
  output: claim:figs1g-resting-potential
  notes: By the criterion, sweeps with no current channel and a baseline at the holding level do
    not hold the resting potential. No PC file has a current channel, and every PC's pre-step
    baseline on the 0 pA sweep is within 2.6 mV of the -70 mV holding potential of the Methods
    (-72.2 to -67.4 mV; sPC -70.03, dPC -69.76 mV, t test p = 0.659). The Table S1 footnote says
    the tonic current that set this level was not recorded. The resting potential without that
    current is not in the data set, and no other public copy of these recordings was found.
- claim: figs1h-sag
  outcome: reproduced
  notebook: reproduce_lee_2014.ipynb
  output: claim:figs1h-sag
  measured:
  - 8.71
  - 5.69
  notes: Reading (a), the -400 pA step, gives sPC 8.71 and dPC 5.69 mV, both within tolerance of
    8.7 and 5.6, and sPC exceeds dPC (t test p = 0.0020, Cohen's d 1.81). Readings (b) -300 pA and
    (c) -200 pA give the same difference (p = 0.0011 and 0.0050) with smaller sags (7.04 and 4.48;
    5.25 and 3.56 mV), outside tolerance. Taking the peak of the voltage smoothed over 1 ms
    changes the means by at most 0.05 mV.
  deviations:
  - Step levels from the data descriptor, as for figs1e-if-curves.
- claim: tables1-rheobase
  outcome: partially_reproduced
  notebook: reproduce_lee_2014.ipynb
  output: claim:tables1-rheobase
  measured:
  - 200
  - 150
  notes: Per-cell rheobases are 100 to 250 pA for sPCs and 100 to 300 pA for dPCs. Reading (a), the
    median, gives sPC 200 and dPC 150 pA, so only dPC matches Table S1. Reading (b), the mean
    rounded to 50 pA, gives 200 pA for both (means 187.5 and 177.8 pA). By the criterion the
    groups share a step under (b) but it is not +150 pA, which is partial. The per-cell rheobases
    do not differ between groups (t test p = 0.732).
  deviations:
  - Step levels from the data descriptor; steps are added to the holding current, so the tonic
    current is excluded as the Table S1 footnote says.
- claim: figs3f-pvbc-firing
  outcome: reproduced
  notebook: reproduce_lee_2014.ipynb
  output: claim:figs3f-pvbc-firing
  measured:
  - 2
  - 17
  - 36
  - 52
  notes: Under reading (a), one PVBC, with the rate as spikes per second, PV34 is silent from 0 to
    +300 pA and fires at 2, 17, 36 and 52 Hz at +350, +400, +450 and +500 pA, the four expected
    values. With the rate's reading (b) PV34 gives 14.9 Hz at +350 pA (two spikes close together),
    outside tolerance. No other PVBC matches; PV37, PV38, PV72 and PV80 fire at or below +300 pA,
    and PV36 starts at +500 pA. The mean over all PVBCs (reading b of the cell) cannot be formed
    above +300 pA, since PV38 was recorded only to +300 pA. The model curve of the statement is not
    tested.
  deviations:
  - The 1 s step of 50 pA increments is assumed by the criterion; the data show a 1.000 s step and
    the descriptor gives 50 pA increments for the six PVBCs.
  - PV34 is deposited twice with identical bytes; it is counted once.
