- claim: ed10-localized-activity
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_scherrer_2023.ipynb
  output: claim:ed10-localized-activity
  notes: The paper selected footprints by eye and neither it nor the code sets a test for
    localized, as the criterion says. Shown as it asks, over 6411 frames above the 80th percentile
    of speed the entropy of mean activity over linear position runs from 3.40 to 6.54 bits (median
    6.24, largest possible 6.63 over the 99 occupied bins) and the peak of the smoothed map of the
    fraction of time active from 0.157 to 0.957 (median 0.567). The code's 12 examples index the
    curated set and cannot be identified. -01 found it reproduced under a shuffle test its author
    chose; the rewritten criterion has no test.
  deviations:
  - Entropy over the 99 occupied position bins; the code's formula would give 0 for every footprint
    when a bin is empty.
findings:
- kind: data_missing
  statement: Still present (finding of -01). The dandiset holds one of the paper's four mice and none
    of the songbird recordings. The bead and dye images of the optical tests are in the paper's code
    repository, but the USAF target images and ADC recordings are not public. The Academic Torrents
    deposit lists files of the same mouse session only.
- kind: metadata_error
  statement: Still present (finding of -01). The device description reads "Head-mounted microscope
    (Kiloscope) optimized for weight (1.0 mm FOV; 1.0 g)", and the dandiset description says the data
    come from the microscope optimized for weight; the data are from the large-FOV Kiloscope (4 mm
    window, 2948 footprints, 808 x 608 pixel frames).
- kind: metadata_error
  statement: Still present (finding of -01). The imaging is stored as a TwoPhotonSeries and the
    dandiset lists two-photon microscopy among its techniques, but the microscope is a one-photon
    head-mounted epifluorescence microscope.
- kind: metadata_error
  statement: Still present (finding of -01). The behaviour video is described as about 30 fps and its
    AVI header says 30 frames/s, but its 15521 timestamps run at a median 12.5 frames/s over 1234 s.
- kind: metadata_insufficient
  statement: Still present (finding of -01). The imaging plane gives no pixel size (no grid spacing),
    its indicator and location are "unknown" and its excitation wavelength is NaN, although
    general/virus says GCaMP7f.
- kind: selection_undocumented
  statement: Still present (finding of -01). The 2948 footprints are the EXTRACT output before
    curation; the paper analyses the 2,382 it kept, and nothing in the dandiset marks them or says
    the footprints are uncurated.
- kind: data_missing
  statement: Still present (finding of -01). The mouse's position, which the paper's decoding and place
    analyses use, is not in the dandiset (its only processing module is ophys), and the opening of
    the behaviour video that the paper's code skips is not marked.
- kind: code_mismatch
  statement: Still present for the number of footprints (finding of -01). The local decoding maps are
    described with the 32 closest footprints within 270 um (Fig. 2l and Extended Data Fig. 9c
    legends, Methods); both map scripts (subregion_map_quaddir.m, subregion_map_octant.m) use 64
    footprints within 50 pixels. The radius differs only at the 5.94 um per pixel of the
    illumination script (297 um); at the bead script's 5.35 um per pixel it is 267.5 um.
- kind: paper_inconsistency
  statement: Still present (finding of -01), now confirmed in the version of record's full text. The
    Extended Data Fig. 8 legend refers to "the Kiloscope dataset shown in Figure 3" and a "Ridgeline
    plot from Fig. 2d"; the paper has two figures and the ridgeline plot is Fig. 2h.
- kind: metadata_insufficient
  statement: New. The imaging movie is described only as "Calcium imaging data at ~30 fps in
    grayscale format", without saying whether it is the raw video or the motion-corrected one the
    paper extracted footprints from. Its frame-to-frame rigid shifts have an RMS of 0.037 pixels,
    about a quarter of the 0.13 pixels the paper reports for the raw video.
- kind: metadata_insufficient
  statement: New. ROICentroids are described as "The x, y, (z) centroids of each ROI", but they equal
    the mask's peak pixel (its first pixel of weight 1) for 84% of footprints and the rounded weighted
    centroid for only 43%; how they were computed is not said.
- kind: other
  statement: New. The paper's tracking code unwraps linear position with MATLAB's unwrap on
    centimetres with a tolerance of half the loop, which corrects each lap's jump by a multiple of
    2 pi cm; as the loop (147.1 cm) is not such a multiple, the position gains an error of up to pi
    cm at every lap. With it, about 1% of the running and direction labels differ from those of a
    position unwrapped by the loop length.
- kind: other
  statement: New. The paper's bead scripts (feather_analysis_secondorder.m, wf_analysis_secondorder.m)
    order the images of each stack by file date, which the repository does not keep, so the order
    that the region lists' slice numbers refer to is not recorded. The Featherscope's region labels
    name their image and confirm the file-number order; the Kiloscope's labels do not.
