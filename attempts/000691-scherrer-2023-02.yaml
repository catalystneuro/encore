- claim: ed8-coactive-distributed
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_scherrer_2023.ipynb
  output: claim:ed8-coactive-distributed
  notes: The two event readings give different outcomes. Under (a), each component's largest
    temporal weight, every event has active footprints in all four quarters (8 of 8, 192 to 326
    active). Under (b), the code's times assigned one to one, 7 of 8 do; component 1's event at
    1000 s has 151 active footprints and none in the lower-left quarter, which holds 85 of all 2948
    footprints. The code's times fall where this NMF's components have 0.04 to 0.68 of their largest
    weight. With weighted centroids as positions the counts are the same, and with the code's frame
    window (frames 30 times the times) component 1 again has none in the lower-left quarter. -01 found it reproduced
    under a criterion its author chose (spread of at least half that of all footprints); the
    rewritten criterion asks for all four quarters under both readings.
  deviations:
  - All 2948 footprints in place of the 2,382 curated ones (the claims file's variant).
  - MATLAB's nnmf replaced by scikit-learn's multiplicative-update NMF (100 iterations, 4 random
    starts).
