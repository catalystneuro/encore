- claim: fig1e-featherscope-psf
  outcome: reproduced
  notebook: reproduce_scherrer_2023.ipynb
  output: claim:fig1e-featherscope-psf
  measured: [3.919, 6.433]
  notes: Under reading (a) the median major-axis FWHM is 3.919 um at the centre (11 beads) and
    6.433 um in the 500 um group (19 beads), within 10% of 4 and 7 um; reading (c), the mean major
    axis, gives 3.887 and 6.884 um, also within. The minor axis (b, d) is 2.609 to 2.690 um at the
    centre and 5.202 to 5.244 um at the edge and fails at both. All 155 regions name their image in
    file-number order. With Jacobian scaling of the optimizer no bead's major FWHM moves by more than
    0.5 um. New claim.
  deviations:
  - MATLAB's lsqcurvefit is replaced by scipy's least_squares (trust-region-reflective, the code's
    start, bounds and tolerances).
- claim: fig1f-kiloscope-psf
  outcome: partially_reproduced
  notebook: reproduce_scherrer_2023.ipynb
  output: claim:fig1f-kiloscope-psf
  measured: [4.422, 5.441]
  notes: No reading puts both values within tolerance, which the criterion asks for. Under (a) the
    edge (1500 um group, 11 beads) is 5.441 um, within 5 +/- 0.5, and the centre (11 beads) is 4.422
    um, 0.022 um above the bound of 4.4. The mean major axis (c) is 4.416 um at the centre and 7.373
    um at the edge, where one bead is fitted at 27.77 um; the minor axis gives 2.722 and 3.306 um (b)
    and 2.671 and 3.094 um (d). The PSF is narrower than the 5.35 um pixel, and the fits depend on
    the optimizer; with Jacobian scaling 14 of 118 beads' major FWHM move by more than 0.5 um and (a)
    gives 3.578 um at the centre (0.022 um below the bound) and 5.892 um at the edge. Under every
    reading and both optimizers the FWHM is larger at the edge than at the centre. The outcome is
    partial because the edge value holds under (a) and the centre misses by 0.022 um. New claim.
  deviations:
  - MATLAB's lsqcurvefit is replaced by scipy's least_squares (trust-region-reflective, the code's
    start, bounds and tolerances); the fits of sub-pixel beads depend on the optimizer.
  - The code reads the 91 images in order of file date, which the repository does not keep; they
    are read in file-number order, which the Featherscope's region labels confirm for that stack,
    and for which each region's listed slice lies at the median of its brightest slice.
- claim: ed1cf-field-curvature
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_scherrer_2023.ipynb
  output: claim:ed1cf-field-curvature
  notes: The paper gives no bound on field curvature and no typical imaging depth, as the criterion
    says. Shown as it asks, the Featherscope's slice of best focus rises from a median of 6 at the
    centre to 89 in the 500 um group (of 161 slices; Spearman 0.96 with radius) and the Kiloscope's
    falls from 48 to 29 in the 1500 um group (of 91 slices; Spearman -0.66). If the slices are evenly
    spaced over the 100 um the Methods give, that is about 52 and 21 um of focal shift. New claim.
