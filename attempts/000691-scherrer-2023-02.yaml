- claim: abstract-kiloscope-fov
  outcome: reproduced
  notebook: reproduce_scherrer_2023.ipynb
  output: claim:abstract-kiloscope-fov
  measured: [4.8, 3.612]
  notes: The file stores no pixel size, so the criterion's two readings from the code apply. Frames
    of 808 x 608 pixels are 4.800 x 3.612 mm at 5.94 um per pixel and 4.323 x 3.253 mm at 5.35 um
