- claim: ed7-motion-small
  outcome: not_reproduced
  notebook: motion_scherrer_2023.ipynb
  output: claim:ed7-motion-small
  measured: [0.0367, 0.218]
  notes: Rigid registration of all 36596 frames gives an RMS displacement of 0.0367 px under reading
    (a), 0.0381 px under (b) and 0.0260 px under (c), against 0.13 +/- 0.013 px; under (a) 0.218 um at
    5.94 um per pixel and 0.196 um at 5.35, against 0.7 um. No frame moves more than 0.16 px along an
    axis, and the RMS in each 100 s window is 0.028 to 0.051 px. A variant with high-pass filtered
    frames (chosen here, first 2400 frames) gives 0.0188 px under (a) against 0.0328 px for the main
    run on the same frames, so a static background pulling the estimate toward zero does not explain
    the difference. Nothing in the dandiset says whether the movie is the raw video or the
    motion-corrected one the paper extracted footprints from; shifts this small would fit a
    corrected movie. New claim.
  deviations:
  - NoRMCorre (MATLAB) is replaced by a rigid registration written after its algorithm and defaults
    (dftregistration with 1/50 pixel upsampling, a template of the 100 middle frames, updated every
    200 frames); the paper's settings are not given.
- claim: fig2-quadrant-direction-decoding
  outcome: blocked
  blocked_by: not_runnable
  notebook: decoding_quadrant_direction.ipynb
  output: claim:fig2-quadrant-direction-decoding
  notes: The criterion judges p under two readings of a null decoder. Under (n1), one fit per
    shuffle, the claim holds. The average matrix of 200 fits has a median accuracy of 0.437 (3.49
    times chance), none of 1000 shuffled decoders reaches it (largest 0.227, p < 0.001), accuracy
    reading (a) holds and (b) does not (classes 2- and 3- at 0.294 and 0.239). Reading (n2), 200 fits
    per shuffle, needs 200,000 fits, measured at about 38 hours on this machine against a 30 minute
    limit per notebook; one (n2) null decoder gives 0.136. The claim was dropped from the claims file
    of -01, which had no outcome for it.
  deviations:
  - All 2948 footprints in place of the 2,382 curated ones (the claims file's variant); the curated
    set is not marked.
  - Position tracked from the behaviour video with the code's rule; linear position unwrapped by the
    loop length.
  - MATLAB's fitcecoc with templateLinear replaced by scikit-learn's SGDClassifier (hinge loss,
    alpha equal to lambda, 10 passes), as MATLAB's default for more than 100 predictors is 10 passes
    of dual SGD.
