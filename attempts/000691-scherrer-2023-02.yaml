- claim: ed2b-featherscope-flat-illumination
  outcome: reproduced
  notebook: reproduce_scherrer_2023.ipynb
  output: claim:ed2b-featherscope-flat-illumination
  notes: At both edge readings the corrected profile is higher than total vignetting and falls less
    from the centre. At 0.5 mm (the code's last bin, 499 um) 0.511 against 0.193, falling by 0.470
    against 0.814; at 0.45 mm 0.628 against 0.257, falling by 0.353 against 0.750. It holds for all
    six centres tried at both radii. -01 found it partially reproduced because its criterion, chosen
    by its author, asked for the corrected profile to stay above 0.8 out to 0.4 mm; the rewritten
    criterion compares it with total vignetting, as the legend does. The corrected profile still
    falls to about half its peak at 0.5 mm.
  deviations:
  - The 0.5 mm reading lies one bin beyond the code's profile (0 to 499 um) and is read at 499 um;
    the bin at 500 um of an extended profile differs by at most 0.005.
- claim: ed2c-kiloscope-flat-illumination
  outcome: reproduced
  notebook: reproduce_scherrer_2023.ipynb
  output: claim:ed2c-kiloscope-flat-illumination
  notes: At 1.8 mm the corrected profile is 0.557 against 0.180 for total vignetting (falling by
    0.437 against 0.843), and at 2.0 mm (the code's last bin, 1999 um) 0.420 against 0.148 (falling
    by 0.573 against 0.875). It holds at both radii for all six centres tried. -01 found it partially
