findings:
- kind: data_missing
  statement: The dandiset holds the head-fixed VR imaging of Ctrl-1 to Ctrl-9 and Cre-1 to Cre-7 on days
    1 to 6. The freely moving T-maze, open field and elevated plus maze data (Fig 1B-C, S1), the reward
    reversal days 7 and 8 (Fig 5E-I), the Cre-8 CA2/3 and Cre-7 dentate gyrus sessions (Fig S5) and the
    morph task (Fig S4) are not in it, so 9 of the paper's findings cannot be tested.
- kind: data_missing
  statement: The deconvolved activity rates that the preprint's Methods use for every imaging analysis
    are not deposited; the files hold dF/F, raw fluorescence and neuropil only, and the deconvolution
    kernel is not given.
- kind: metadata_error
  statement: The speed series ('Speed along Y maze', at imaging and full resolution) is labelled in 10
    cm/s, but its integral over a trial is about 288 for the 300 cm track (median trial 10 s), so it is
    in cm/s.
- kind: identifier_missing
  statement: The NWB files do not say which ROIs are the same cell across days. The authors' matches are
    on Figshare (doi 10.6084/m9.figshare.31286365.v5), indexed by a session order that is only in their
    code's mouse_metadata.py; with them, matched cells lie within 1 to 2 pixels after the field of view's
    shift.
- kind: metadata_insufficient
  statement: The reward zone positions are not in the files or the dandiset metadata; the paper names
    them only as the beginning of the left arm and the end of the right arm. They were estimated from
    where rewards were given.
- kind: other
  statement: The dandiset also holds seven SparseKO mice (multiplexed two-channel files, SparseKO-4 without
    day 3), which are not in the preprint; the dandiset's name gives 2026 and its linked code describes
    a later version of the paper. Two days (Ctrl-2 day 4, Ctrl-4 day 2) are split over two files.
- kind: other
  statement: Fig 2B gives 17 familiar trials for Cre-3 on day 5; the file has 82 familiar trials (11 novel,
    7 familiar in block 6). The other seven counts of Fig 2A-B match exactly.
- kind: code_mismatch
  statement: The authors' code at commit f2ab24d takes the anticipatory window as the 5 bins before the
    zone front plus the front bin (behavior.py, rzone_ledge=5), where the Methods say 30 cm, and normalizes
    block-6 activity over the first 5 trials (novel_activity_rate.py, max_trial=5), where the Methods
    use the whole block. The code describes the later version of the paper.
- kind: other
  statement: Imaging and VR traces are consistent with a shared clock. The split-half reliability of familiar-trial
    maps peaks at zero shift for Ctrl-1 day 3 (0.962) and at -0.52 s for Cre-1 day 3 (0.956 against 0.953
    at zero), falling at larger shifts in both directions; only these two days were checked.
- kind: other
  statement: The Methods give an imaging rate of 15.46 Hz; the 36 files of Ctrl-6 to Ctrl-9, Cre-6 and
    Cre-7 (the mice the Methods say were imaged at 920 nm) are at 15.51 Hz, the others at 15.46 Hz.
- kind: methods_unavailable
  statement: Question for the authors. Were the preprint's imaging figures made from deconvolved activity
    rates (which kernel and time constant) or from the dF/F deposited here, as the published code does?
    Every imaging outcome of this attempt uses the deposited dF/F.
- kind: methods_unavailable
  statement: Question for the authors. How is the population vector correlation defined (Fig 2G-H, S3B-C)?
    The flattened and the per-bin readings give different group results for the familiar to novel correlation
    (p=0.018 against p=0.31); the per-bin reading of the published code was adopted.
- kind: methods_unavailable
  statement: Question for the authors. In the HSE null, does the circular shift move a cell's whole activity
    series within the stopping period (so that transients that began before the stop can enter the null)
    or only the transients that began in the period? Which speed and smoothing define 'stationary (<2
    cm/s)'? And how were HSEs told apart from chance coincidences? Read from the Methods, the detector
    flags, on data with synchrony removed (each cell shifted in time), 0.43 of Cre and 0.16 of control
    trials under the onset reading against 0.46 and 0.20 in the real data, and 0.15 against 0.26 of Cre
    trials under the series reading. The HSE claims are blocked for this. The Figshare shuffles (shuffle_pkls.zip)
    hold no HSE results.
- kind: methods_unavailable
  statement: Question for the authors. Where are the reward zones in spline coordinates, and how is the
    animal's average running speed taken for normalized speed (time-weighted or over bins)? The day-6
    spatial pattern of vr-reward-location-learning holds for Cre mice only with the bin mean.
- kind: other
  statement: On the two days split over two files (Ctrl-2 day 4, Ctrl-4 day 2) the block numbers of the
    second file restart at 0, so the files alone give 5 and 4 blocks for those days; the authors' code
    continues them from the first file's last block, which gives 6 blocks with the novel trials in block
    6.
- kind: methods_unavailable
  statement: Question for the authors. How were the deposited place-cell masks (place_cell_info) computed?
    They equal shuffle p < 0.05 of the deposited spatial information, but that information is on another
    scale than the Skaggs information of the trial-averaged dF/F map (recomputed over deposited, median
    25 to 31), and a 1000-shuffle test recomputed here marks 0.1 to 49% more cells per mouse-day. The
    function that made them (two_photon_utils.spatial_analyses.place_cells_calc) is not in the linked
    repository.
