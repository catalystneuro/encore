- claim: figs3c-familiar-novel-remapping
  outcome: reproduced
  notebook: reproduce_plitt_2023.ipynb
  output: claim:figs3c-familiar-novel-remapping
  notes: The readings disagree, and reading (b), the per-bin correlation of the authors' code (`calc_pv_corr`),
    is adopted. Under (b) the virus effect has p=0.314 (cells i) and p=0.316 (ii). Under the flattened
    reading (a), Cre mice have a higher familiar-to-novel correlation (p=0.018 and 0.020; 0.32 against
    0.25). The familiar-to-novel correlation, 0.30 (control) and 0.33 (Cre) under (b,i), is lower than
    the within-type trial-by-trial correlation, 0.40 in both groups. It is not near zero, as the stem
    is shared. Like for like, single familiar trials against single novel trials, the correlation is 0.108
    (control) and 0.140 (Cre) under (a,i) and 0.116 and 0.140 under (b,i), virus p=0.174 and 0.303.
  deviations:
  - Activity is the deposited dF/F (processing/ophys/dF), not the deconvolved activity rates of the Methods
    (In vivo imaging, 'deconvolved with a canonical calcium kernel'), which the dataset does not hold.
    Assumed because the authors' code for these files (GiocomoLab/Plitt_Kaganovsky_Stx3_CA1 at commit
    f2ab24d, session.py and every analysis module, ts_key 'F_dff') uses this dF/F; the paper does not
    give the kernel.
  - Ctrl-2 day 4 and Ctrl-4 day 2 are split over two files; each is merged on the ROIs the authors matched
    between its two files (1048 and 1036 cells).
  - Place cells are the deposited per-arm masks (place_cell_info), which equal shuffle p < 0.05 of the
    deposited spatial information; masks recomputed from the attempt's 1000 shuffles are a variant.
  - The PV correlation readings disagree (flattened, virus p=0.018; per-bin, p=0.314). The per-bin correlation,
    reading (b), is adopted as an assumption because it is the authors' calc_pv_corr (spatial_analyses.py
    at commit f2ab24d). Reading (ii) uses the union of familiar and novel place cells (Methods, 'we considered
    the union of place cells in both conditions').
  assumed: true
