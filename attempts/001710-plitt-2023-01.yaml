  notebook: reproduce_plitt_2023.ipynb
  output: claim:figs9a-hse-trial-proportion-no-difference
  notes: 'As tested, Cre mice have more trials with HSEs under both shuffle readings: S, 0.26 against
    0.02, virus F(1,14)=13.1, p=0.003; O, 0.46 against 0.20, F(1,14)=9.3, p=0.009. On real minus null
    the virus effect is p=0.61 (O) and p=0.003 (S). The HSE detector was checked (notebook, Checks of
    the HSE detector). With each cell''s dF/F series circularly shifted in time by its own offset, which
    removes synchrony and keeps each cell''s transients, the detector flags 0.43 (Cre) and 0.16 (control)
    of trials under null reading O, against 0.46 and 0.20 in the real data, and 0.15 (Cre) and 0.003 (control)
    under reading S, against 0.26 and 0.02. On synthetic independent cells it flags 0.20 to 0.27 (S) and
    0.38 to 0.40 (O) of trials. The ANOVA of figs9a on the data with synchrony removed also finds Cre
    higher (O p=0.0014, S p=0.029); Cre stopping periods are longer (5.4 s against 1.5 s). By the rule
    fixed before the null was run on all sessions (more than half the real fraction in a group under both
    readings), the detector as read from the Methods does not pick out synchronous events. In the real
    data it finds 3.2 (S) and 36 (O) HSEs per control day, and in the data with synchrony removed 0.43
    (S) and 30 (O). The paper does not settle the null, so the claim is blocked. The two readings would
    give different outcomes if the null were settled: under S, the Methods'' words, real minus null still
    has Cre higher (p=0.003), and the claim would be not reproduced; under O, real minus null gives p=0.61.'
