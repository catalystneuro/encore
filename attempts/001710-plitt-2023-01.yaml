- claim: vr-reward-location-learning
  outcome: partially_reproduced
  notebook: reproduce_plitt_2023.ipynb
  output: claim:vr-reward-location-learning
  notes: Under speed reading (ii), the day-6 spatial pattern holds in both groups on both arms. Normalized
    lick rate in the 30 cm before the zone is 1.69 to 3.50, above every bin outside the zone, where the
    maximum is 0.84 to 1.65. Normalized speed there is 0.47 to 0.57. Under reading (i), the Cre speed
    ratio is 1.10, so the pattern holds for control only. The day effect of the familiar-trial licking
    ANOVA is significant (p=0.007 and p=0.0006). But the day-6 mean (2.67 and 2.38 licks/s) is below the
    day-1 mean (3.22 and 3.17), and the criterion asks for day 6 above day 1. So the day part fails.
  deviations:
  - Cre-8 is not in the dataset, so the claims file's reading (b), Cre-1 to Cre-8, cannot be run; every
    test uses Cre-1 to Cre-7.
  - The paper gives no coordinates for the reward zones; each arm's zone front is the 1st percentile of
    the positions where rewards were given (left 31.92, right 39.38 spline units), so the 30 cm before
    the zone are bins 16 to 18 (left) and 23 to 25 (right).
  - The Methods do not say how the animal's average running speed is taken; readings (i) time-weighted
    mean and (ii) mean of the binned speeds are both run, and the pattern holds in both groups only under
    (ii).
- claim: figs2f-novelty-slowing-familiar
  outcome: reproduced
  notebook: reproduce_plitt_2023.ipynb
  output: claim:figs2f-novelty-slowing-familiar
  notes: 'With the first two familiar trials of block 6 and the binned speed, control mice slow more than
    Cre mice: virus F(1,14)=4.89, p=0.044 (paper F(1,14)=4.82, p=0.045). Control means are -0.08 to -0.14
