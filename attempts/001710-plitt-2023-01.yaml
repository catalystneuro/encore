    s), as the speed series jitters by about 7 cm/s while the position is constant (a standard choice
    the paper does not state). The HSE null is run under two readings, shifting each cell's activity series
    in the period (S, the Methods' words) or only its onsets that began in the period (O); the paper does
    not say whether transients that began before the stop enter the null. Coactivity within 500 ms is
