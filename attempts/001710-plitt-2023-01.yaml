- claim: fig1f-anticipatory-licking-familiar
  outcome: reproduced
  notebook: reproduce_plitt_2023.ipynb
  output: claim:fig1f-anticipatory-licking-familiar
  notes: 'On familiar trials, control mice lick more in the 30 cm before the zone than Cre mice under
    both rate readings: virus F(1,14)=21.0, p=0.0004 for (i) and F(1,14)=21.2, p=0.0004 for (ii). Control
    means are 2.9 to 3.8 licks/s on each day, Cre means 1.2 to 2.7. Only Cre-1 to Cre-7 are in the dataset,
    so the paper''s 8-Cre reading (df 15) cannot be run.'
  deviations:
  - Cre-8 is not in the dataset, so the claims file's reading (b), Cre-1 to Cre-8, cannot be run; every
    test uses Cre-1 to Cre-7.
  - The paper gives no coordinates for the reward zones; each arm's zone front is the 1st percentile of
    the positions where rewards were given (left 31.92, right 39.38 spline units), so the 30 cm before
    the zone are bins 16 to 18 (left) and 23 to 25 (right).
  - Licks are the full-resolution non-consummatory lick series; the imaging-rate lick series says it must
    not be used for comparisons between groups.
