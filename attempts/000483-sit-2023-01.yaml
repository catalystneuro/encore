- claim: fig5-three-classes
  outcome: not_reproduced
  notebook: somata.ipynb
  output: claim:fig5-three-classes
  notes: The silhouette value is highest at k = 2 under both readings of the criterion. Selective cells (1419) give 0.272,
    0.019 and 0.032 for k = 2, 3 and 4, and all cells (11329) give 0.190, 0.120 and -0.052, so neither has a local maximum
