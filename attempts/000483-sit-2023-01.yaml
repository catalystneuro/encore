- claim: fig5e-alignment-peaks-coregistered
  outcome: partially_reproduced
  notebook: somata.ipynb
  output: claim:fig5e-alignment-peaks-coregistered
  notes: 'The criterion''s V-test passes for the 1150 alignment-like cells (V = 743.5, p < 1e-300), but taking the nearer
    of two peaks 180 degrees apart folds offsets into +-90 and gives a large V by itself: uniform light-off peaks give
    V = 669.5 on average (V/n 0.582 against 0.646), and light-off peaks paired at random with other alignment-like cells
    give 707.2 (95th percentile 728.4, 1000 draws). The real V exceeds the random pairing (share at or above it 0.002),
    a small coregistration. Only 29.2% of offsets lie within 18 degrees, against 26.2% under random pairing, with a median
    offset of 36 degrees, so "always" is not supported. In the heading-like and landmark-like classes the V does not
    exceed random pairing (shares at or above it 0.677 and 0.230). The class is not the paper''s alignment class (fig5-class-proportions).'
  deviations:
  - Tested on the classes found here, which differ from the paper's.
  - The V is compared with a random-pairing null and a uniform-peak null, which the criterion does not ask for, because
    the nearer-peak offset biases the V-test towards 0.
