findings:
- kind: data_missing
  statement: The free-chamber recordings of Figure 1D and E (4 recordings over 3 mice, 2665 neurons)
    are not in the dandiset. The files hold 20 mice where the paper used 26.
- kind: data_missing
  statement: The files hold the raw fluorescence of each ROI but no neuropil trace, dF/F or inferred
    spikes, so the paper's neuropil-corrected signals cannot be rebuilt without reprocessing the raw
    video (about 695 GB). The axon recordings lack the Suite2P traces the paper used.
- kind: metadata_insufficient
  statement: The experiment a file belongs to (single cue, dual cue, axons, head rotation, remapping,
    rotation direction, animal control, visual cue only) is given only inside its identifier string;
    the session description is "floating air cage experiment" for every file.
- kind: metadata_insufficient
  statement: Light-on and light-off periods, which most dual-cue analyses need, are not marked in any
    file; the paper's code hard-codes them by recording length.
- kind: metadata_insufficient
  statement: The heading is relative to "cage door dead north"; where the cue or cues sit in that
    frame is not given, so heading relative to the cue cannot be computed. In the head-rotation pairs
    the stored headings run in opposite directions in the two conditions in 5 of 7 pairs, and how
    each is defined is not stated.
- kind: metadata_insufficient
  statement: The visual-cue-only recordings of Figure 5K share no ROIs with any standard recording and
    no matching is given, so the matched neurons of Figure 5K cannot be found.
- kind: metadata_error
  statement: The heading and position series state a rate of 0.1 Hz; they have one sample per imaging
    frame, at 10 Hz. The two-photon series states about 20 Hz with the same number of frames.
- kind: metadata_error
  statement: Every file's imaging plane is described as "soma recording from retrosplenial cortex",
    including the 24 axon recordings.
- kind: metadata_error
  statement: Four files of mouse SKKS089 (2021-04-29 head rotation, 2021-05-18 remapping) carry
    identifiers naming SKKS088.
- kind: selection_undocumented
  statement: The dandiset holds 7 head-rotation pairs over 5 mice (paper 5 over 4), 35 dual-cue soma
    recordings (paper 36), 4 recordings in both rotation directions over 3 mice (paper 4 over 2) and
    5 animal-controlled recordings over 4 mice (paper 7 over 3); which recordings the paper used is
    not stated.
- kind: methods_unavailable
  statement: Question for the authors. The heading-selection code fits the Gaussian to the trial-mean
    curve without centring it (center_flag false) and bounds the peak location to pi/2 +- pi/6, which
    passes only cells whose peak lies near one heading (here 10.85% of single-cue cells, 93.6% of them
    in one quadrant). Was the curve centred on its peak before the fit, as the 'fit' preferred
    direction does? With centring, 15.26% pass and their preferred headings tile the circle.
- kind: methods_unavailable
  statement: Question for the authors. In the head-rotation experiment, how are the stored headings of
    the head-rotation and chamber-rotation files defined, and was one mirrored before comparing
    preferred headings? Which 5 of the 7 pairs in the dandiset were used?
- kind: methods_unavailable
  statement: The code that aligns light-off to light-on trials (leaveOneOutAligner), and the code for
    the clustering, V-tests, decoding and statistics, are not in the linked repository.
