      0.40) depends on the mouse: SKKS090 and SKKS091 peak about 180 away from it (B9).'
    response: No change of outcome. The notebook now shows that the code fit's clustering near -90 comes from its
      bounds on the Gaussian's peak (dataset headings -120 to -60), so it does not locate the cue, and prints the
      share near -90 (40.1%) as what the share would be were the cue there. No file or code gives the cue's position.
