inputs:
- what: Method details only, no data. The analysis classes the paper links (trial segmentation, heading-selection
    test, Gaussian fit bounds, light and dark segments, flip score), read and reimplemented in Python.
  source: https://github.com/ucsb-goard-lab/Neurotar-HD-Experiments at commit c6344f5
outcomes:
- claim: fig1-free-heading-fraction
  outcome: blocked
  blocked_by: data_missing
  notes: The dataset holds no free-chamber recording. All 16 single-cue files rotate at a steady 3.1 to 8.0 rpm
    (median heading step per frame) and hold 3179 ROIs over 5 mice, exactly the controlled-rotation experiment of
    Figure 1G. The only animal-controlled files are 5 dual-cue recordings of 2022 (Figure S6). The paper names a
    Dryad deposit (doi 10.25349/D91G8Q) of processed objects; it needs an account to download and was not checked.
- claim: fig1g-rotation-heading-fraction
  outcome: reproduced
  assumed: true
  notebook: single_cue.ipynb
  output: claim:fig1g-rotation-heading-fraction
  measured:
  - 15.29
  - 486
  notes: With the centred fit, 486 of 3179 ROIs (15.29%) pass, within 14.2 +- 1.42% and 452 +- 45; by mouse 8.9
    to 25.2%, by recording 2.2 to 33.0%. With the fit as the code calls it, without centring, 345 (10.85%), outside
    the tolerance. With stricter reliability thresholds (KS p < 0.01, d > 1.2) the centred count is 394 (12.39%).
    The test is liberal. Its reliability step runs a KS test on 1000 split-half correlations of the same trials,
    as the paper's code does (ControlledRotation.calculateHeadDirection), and synthetic untuned cells pass the whole
    test at 4.7% (centred) and 1.7% (uncentred); real cells with each trial shifted once pass at 5.22% (selection-shuffled-control).
    The count matches the paper's, but about a third of the selected cells could pass by chance. The numbers are
    from the re-run after verification round 1, which differ slightly from the first run (for example 486 against
    485 selected cells), as floating-point results differ between machines.
  deviations:
  - Inferred spikes are computed here from the raw ROI fluorescence (OASIS AR(1), Python port) without the neuropil
    correction of the Methods (eq. 1), as the files hold no neuropil trace, dF/F or spikes.
  - The selection test (code ControlledRotation.calculateHeadDirection) and its Gaussian fits are reimplemented
    in numpy (bounded Levenberg-Marquardt in place of MATLAB fit).
  - Assumption. The code fits the trial-mean curve as it is, with the peak location bounded to pi/2 +- pi/6, so
    only cells whose peak lies near one heading can pass; its center_flag option, used by its 'fit' preferred direction,
    first shifts the peak to bin 15. The Methods do not say. The centred fit is adopted because with the uncentred
    one 93.6% of the selected cells lie in one quadrant, which contradicts the tiling of Figure 1H; both readings
    are shown, and they give different outcomes.
- claim: selection-shuffled-control
  outcome: not_reproduced
  assumed: true
  notebook: single_cue.ipynb
  output: claim:selection-shuffled-control
  notes: With each trial shifted once by its own random amount before the whole test, as the Methods' "pre-shuffled
    data" and the criterion's "before the test" say, 166 of 3179 ROIs (5.22%) pass, above the criterion's 1% limit;
    481 pass the reliability step. Run as the commented calculateHeadDirection_shuff of Cue.m does it (the trials
    re-shifted in every iteration), 0 of 3179 pass under both fits, but under that reading the "real" and null split-half
    correlations come from the same distribution, so no cell can pass whatever the data. Synthetic untuned cells
    pass at 4.7% (fig1g). Which reading the claims file intends is asked in questions/000483.yaml.
  deviations:
  - Assumption. The trials are shifted once before the test (the variant of the first run). The criterion names
    both "before the test" and the commented code, which shifts them afresh in every iteration; only the first can
    show whether the count is due to chance. Both are shown.
  - Spikes computed without neuropil correction, and the test reimplemented, as for fig1g-rotation-heading-fraction.
- claim: fig1h-preferred-headings-tile
  outcome: partially_reproduced
  assumed: true
  notebook: single_cue.ipynb
  output: claim:fig1h-preferred-headings-tile
  notes: Tiling holds. The 486 cross-validated preferred headings (centred fit) fill all 60 bins of 6 degrees, and
    the four quadrants hold 18.1 to 40.1%. The overrepresentation cannot be judged. The files give heading relative
    to "cage door dead north" and do not say where the cue is. Within 45 degrees of the dataset's 0 lie 24.7% (not
    above 25%). The densest 90-degree window, centred at -102 degrees, holds 40.5% (Rayleigh p = 1.7e-05), and the
    densest heading differs between mice (SKKS090 and SKKS091 near +90 to +120). Were the cue at dataset heading
    -90, the share near it would be 40.1%; nothing in the files says so. The code's uncentred fit puts 93.6% of
    its cells near -90 because its bounds hold the Gaussian's peak at dataset headings -120 to -60, which says nothing
    about the cue.
  deviations:
  - Rests on the centred fit of fig1g-rotation-heading-fraction.
  - The position of the cue in the dataset's heading frame is not in the files, so heading 0 of the claim could
    not be located.
- claim: fig2f-head-chamber-same-preference
  outcome: partially_reproduced
  assumed: true
  notebook: rotation_remapping.ipynb
  output: claim:fig2f-head-chamber-same-preference
  measured: 34.6
  notes: 'The criterion''s test passes only under assumptions. Cells selective in both conditions, peak preference,
    chamber-rotation (CR) heading mirrored, the 5 pairs whose stored headings run in opposite directions, give V
    = 34.6, n = 228, p = 5.9e-04 (''fit'' preference V = 36.0, p = 3.8e-04; cells selective in CR V = 47.7, p =
    7.3e-05). 4 of 24 readings give p < 0.05 with V > 0. With all 7 pairs none does, and with the headings as stored
    every V is negative. The V is not the paper''s 14.1 (n = 32), and no reading has n near 32. Matched ROIs do
    not keep their preference better than random pairs: pairing ROIs at random over the 5 pairs gives a larger V
    (mean 46.2, 95th percentile 57.6), and within every pair the real V lies inside its own random-pairing null
    (share of 1000 random pairings at or above it 0.21 to 0.998; SKKS116, the one pair with a large V, 58.9 against
    a null mean of 56.8). Head-rotation files have more selective cells (53 to 83% against 8 to 65%) and more activity
    (0.095 to 3.19 spikes/s against 0.063 to 0.114) than their CR partners, so heading-locked artefacts of derotation
    are not excluded. A 6-frame clock offset would move preferences by 4 to 8 degrees (head rotation) or 12 degrees
    (CR).'
  deviations:
  - Assumption. The stored headings of 5 of the 7 pairs run in opposite directions in the two conditions, while
    the paper says the cue moves across the visual field in the same direction in both (Figure 2B legend), so the
    CR heading is mirrored to put both in the frame of the wall pattern. The files do not say how either heading
    is defined.
  - Assumption. The dataset holds 7 pairs over 5 mice; the paper reports 5 over 4, which matches the 5 opposite-direction
    pairs. Both sets are shown.
  - Cells selected with the centred fit of fig1g-rotation-heading-fraction; spikes without neuropil correction.
- claim: fig3c-coherent-remapping
  outcome: partially_reproduced
  assumed: true
  notebook: rotation_remapping.ipynb
  output: claim:fig3c-coherent-remapping
  measured: 47.0
  notes: All 8 readings give V > 0 with p < 0.05. Cells selective in both contexts, peak preference, expected offset
    (i), give V = 47.0, n = 85 over 9 recording pairs, p = 2.8e-13, against V = 25.6 with n = 66 in the paper; no
    reading gives a V within the tolerance (38.4 to 233.5). Pairing neurons at random gives a V of 36.2 on average
    (95th percentile 45.7, 1000 draws); 2.6% of random pairings reach the real V, so it lies only just above the
    null. 8 of the 9 pairs with 3 or more cells have V > 0. The SKKS091 2021-05-04 pair, whose files are both named
    context 1, has fewer than 3 cells selective in both and enters only the readings with cells selective in either.
  deviations:
  - Cells selected with the centred fit of fig1g-rotation-heading-fraction; spikes without neuropil correction.
  - The medians of the Methods are taken as circular medians (a standard choice for angles).
  - The 12 remapping pairs are the two files of each mouse and day; one pair (SKKS091, 2021-05-04) is named 1-001
    and 1-002 and is taken as a pair.
- claim: fig4-axons-light-on-shape
  outcome: reproduced
  notebook: axons.ipynb
  output: claim:fig4-axons-light-on-shape
  notes: Under reading (b), all 1084 ADN and 247 visual axons, the mean aligned light-on curve has a flip score
    of -0.206 (ADN) and 1.875 (visual), and single visual axons score higher (means 0.506 and -0.109, KS p = 1.6e-24).
    Under reading (a), selective axons, the visual mean curve is bimodal (1.814) and single axons differ (KS p =
    1.7e-21), but the ADN mean curve has a flip score of 0.277 with the centred fit and 1.132 with the code fit,
    above 0. One ADN mouse (SKKS092) has a mean flip score above 0 under reading (a) (0.48, 0.42) and about 0 under
    (b) (-0.001).
  deviations:
  - Axon traces are inferred spikes from the raw fluorescence, with no neuropil correction; the paper used Suite2P
    traces and excluded duplicate axons (r > 0.5), and the files give ROIs as they are.
  - Light and dark segments are the code's hard-coded ones (Separator.m); the files do not mark them.
- claim: fig4-axons-light-off
  outcome: partially_reproduced
  notebook: axons.ipynb
  output: claim:fig4-axons-light-off
  notes: Visual axons lose their tuning in light-off (mean light-off curve 5 to 11% of the light-on range, under
    half). The ADN part fails. Over all axons (reading b) the per-recording fraction selective in light-off is not
    significantly higher for ADN than for visual axons (medians 0.050 and 0.015, Mann-Whitney p = 0.3); pooled,
    94 of 1084 against 11 of 247 (Fisher p = 0.026, the variant). Among selective axons (reading a) the share also
    selective in light-off has medians 0.143 and 0.000 (Mann-Whitney p = 0.074, 14 and 7 recordings); pooled 40
    of 135 against 5 of 106 (Fisher p = 2.8e-07). The ADN mean light-off curve keeps 72 to 86% of the light-on range,
    but its peak lies 24 degrees (reading a) or 30 degrees (reading b) from the light-on peak, beyond 18 degrees
    (18 degrees with the code fit).
  deviations:
  - Light-off curves take the circular shift of the mean light-on curve; the code's aligner (leaveOneOutAligner)
    is not public.
  - As for fig4-axons-light-on-shape.
- claim: figs5-rotation-direction
  outcome: reproduced
  notebook: directions.ipynb
  output: claim:figs5-rotation-direction
  notes: Reading (b) passes. For the 407 cells selective in the four files that rotate both ways, each cell's clockwise
    and counterclockwise tuning curves correlate more (median 0.211) than randomly paired cells (0.122), bootstrapped
    KS p = 0.002. Reading (a), differences in preferred heading, gives p = 0.165 (median 24 against 30 degrees).
    By mouse, with random pairs from the same mouse, (b) passes for SKKS125 only (p = 0.046; SKKS126 0.114, SKKS127
    0.697); over all active cells neither reading passes (p = 0.512 and 0.543). The pooled random pairs cross files.
    The statement's light and dark responses are not separated, as the files do not mark the light condition, so
    the "diversity" part is not tested beyond tuning stability.
  deviations:
  - Figure S5 was not read; what is compared follows the claims file's readings.
  - The dataset's 4 recordings in both directions are over 3 mice, where the paper reports 2; all 4 are used.
  - In each bootstrap iteration both samples are drawn with replacement and the random pairing is drawn afresh (a
    standard choice); dual-cue preferred headings are compared modulo 180 degrees.
  - Spikes without neuropil correction; cells selected with the centred fit.
- claim: figs6-arena-control
  outcome: not_reproduced
  notebook: directions.ipynb
  output: claim:figs6-arena-control
  notes: 'Without the pair whose animal-controlled file visits 6 of 60 heading bins (SKKS125, 2022-07-21), neither
    reading passes: n = 270, (a) p = 0.969, (b) p = 0.903 (median correlation 0.090 against 0.104 at random), and
    no pair passes on its own (p 0.781 to 1). With it, reading (b) passes over all 5 pairs (n = 382, median 0.026
    against -0.031, p = 0.034; (a) p = 0.912), but its 112 cells (29% of n) have animal-controlled tuning curves
    that are 0 in 54 of 60 bins, and the pooled random pairs cross pairs of files.'
  deviations:
  - Figure S6 was not read; what is compared follows the claims file's readings.
  - The dataset holds 5 pairs over 4 mice, where the paper reports 7 recordings over 3; all 5 are used. Tuning in
    the animal-controlled file is built from all turning frames (more than 0.5 degree per frame), as these files
    have few full rotations.
  - As for figs5-rotation-direction.
  - Assumption. Pairs whose animal-controlled file visits fewer than half of the 60 heading bins are left out (one
    pair, 6 of 60 bins), as their tuning curves are mostly the 0 that bin_tuning gives an unvisited bin. The result
    with it is shown.
  assumed: true
- claim: fig5-three-classes
  outcome: not_reproduced
  notebook: somata.ipynb
  output: claim:fig5-three-classes
  notes: The silhouette value is highest at k = 2 under both readings. Selective cells (1419) give 0.274, 0.023
    and 0.039 for k = 2, 3 and 4, and all cells (11329) give 0.189, 0.143 and -0.054, so neither has a local maximum
    at 3. The reviewer-code variant, each curve centred on its own peak, has none either (selective 0.450, 0.036,
    0.007; all 0.254, -0.019, 0.017); in the first run it had one for selective cells. The numbers are from the
    re-run after verification round 1, which differ slightly from the first run (for example 486 against 485 selected
    cells), as floating-point results differ between machines.
  deviations:
  - Spikes without neuropil correction; cells selected with the centred fit; light-off curves aligned with the shift
    of the mean light-on curve (leaveOneOutAligner not public).
  - GaussianMixture of scikit-learn (full covariance, 20 initialisations, 1000 iterations) in place of MATLAB's
    fitgmdist; the silhouette is computed on the hard assignments.
  - One 1950-frame recording (2021-01-18, SKKS088 DualCue-002) has no light-on trial and is left out.
- claim: fig5-class-proportions
  outcome: not_reproduced
  notebook: somata.ipynb
  output: claim:fig5-class-proportions
  measured:
  - 12.1
  - 8.8
  - 78.9
  - 12.4
  notes: 12.10% of somata are tuned (mean over recordings, s.e.m. 1.44; pooled 12.53%, over mice 11.51%), within
    12.1 +- 1.1. The class shares do not match. Over recordings with no outlier step, landmark-like cells are 8.8%,
    alignment-like 78.9% and heading-like 12.4%; with the chi-square outlier step (58 cells to the null cluster)
    8.6, 75.3 and 12.2%. Every reading orders them alignment > heading > landmark. The counts are 75 landmark, 1150
    alignment and 194 heading, against 522, 409 and 332 from the paper's degrees of freedom. All three light-on
