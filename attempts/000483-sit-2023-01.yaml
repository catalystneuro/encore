  reviewed: 'Round 1. The executed notebooks of the first run with the conclusion cells and the summaries removed,
    the helper module and the claims file, with the paper. The verifier tested the selection test, the flip score
    and the peak-offset measure on synthetic inputs. fig5k and the seven Figure 6 claims had no notebook output
    then, so it gave no outcome for them. Its points that bear on no single claim are answered as follows. The clock
    check (B7) is now read in single_cue.ipynb: the lag peaks after 0 in three files and before 0 in one, so the
    clock is not established in general, and rotation_remapping.ipynb gives the size of a 6-frame offset in degrees.
    The trial rule (B11) matches the code, any(90 - abs(prctile(heading, [25, 75])) > 50), as rsc.py now quotes.
    The smoothdata window (B12) is stated in rsc.py as an assumption. The counts that differ from the paper''s (B15)
    stay recorded as selection_undocumented.'
  results:
  - claim: fig1-free-heading-fraction
    agrees: true
    outcome: blocked
    reason: Every one of the 128 assets is classified. All 16 single-cue files rotate at a steady 3 to 8 rpm (motor-driven).
      The only animal-controlled files are 2022 dual-cue recordings. The API listing (128 assets) agrees.
    response: No change needed.
  - claim: fig1g-rotation-heading-fraction
    agrees: true
    outcome: reproduced
    reason: 'With the centred fit, 485/3179 = 15.26%, inside 14.2 +- 1.42 and 452 +- 45. The code''s uncentred fit
      gives 10.85%, but it only passes cells whose peak is near -90, which contradicts Fig. 1H, so the centred reading
      is reasonable. Caveat: the test also passes untuned noise (B1).'
    response: Added the false-positive rate on synthetic untuned cells (4.7% centred, 1.7% uncentred) and quoted
      the code to show the KS test on 1000 overlapping split-halves is the paper's own procedure (ControlledRotation.m).
      The re-run gives 486 (15.29%); the outcome stands and the notes say about a third of the cells could pass
      by chance.
  - claim: selection-shuffled-control
    agrees: false
    outcome: not_reproduced
    reason: The paper says data were shuffled before running the procedure, and the criterion says "before the test".
      That reading (the "once" variant) passes 165/3179 = 5.19%, above the 1% limit. The 0% "each" reading cannot
      fail by construction (B2).
    response: Changed to not_reproduced, resting on the "once" reading as an assumption (166, 5.22% in the re-run).
      The code shows the commented function reshuffles in every iteration; the conflict within the criterion is
      asked of a reader in questions/000483.yaml, and a methods_unavailable finding asks the authors.
