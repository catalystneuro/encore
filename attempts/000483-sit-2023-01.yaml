  deviations:
  - Classes are named by a rule on the archetypes (heading, the least bimodal light-on archetype; landmark, the
    weaker light-off archetype of the other two), as the paper names them by their curves without a rule.
  - As for fig5-three-classes.
- claim: fig5e-alignment-peaks-coregistered
  outcome: partially_reproduced
  notebook: somata.ipynb
  output: claim:fig5e-alignment-peaks-coregistered
  notes: 'The criterion''s V-test passes for the 1150 alignment-like cells (V = 743.2, p < 1e-300), but taking the
    nearer of two peaks 180 degrees apart folds offsets into +-90 and gives a large V by itself: uniform light-off
    peaks give V = 669.4 on average (V/n 0.582 against 0.646), and light-off peaks paired at random with other alignment-like
    cells give 706.9 (95th percentile 727.7, 1000 draws). The real V exceeds the random pairing (share at or above
    it 0.002), a small coregistration. Only 29.1% of offsets lie within 18 degrees, against 26.2% under random pairing,
    with a median offset of 36 degrees, so "always" is not supported. In the heading-like and landmark-like classes
    the V does not exceed random pairing (shares 0.368 and 0.510). The class is not the paper''s alignment class
    (fig5-class-proportions).'
  deviations:
  - Tested on the classes found here, which differ from the paper's.
  - The V is compared with a random-pairing null and a uniform-peak null, which the criterion does not ask for,
    because the nearer-peak offset biases the V-test towards 0.
- claim: fig5f-heading-flip-unchanged
  outcome: partially_reproduced
  notebook: somata.ipynb
  output: claim:fig5f-heading-flip-unchanged
  notes: The criterion is met on a class that is not the paper's. The 194 heading-like cells have flip scores 0.374
    in light-on and 0.282 in light-off, F(1,386) = 1.8, p = 0.18 (mixed model with mouse as random intercept); with
    the outlier step p = 0.18, with a random intercept per cell p = 0.14. The class has 194 cells where the paper's
    degrees of freedom imply 332, and its light-on archetype is bimodal (a2/a1 0.70), so it is only the least bimodal
