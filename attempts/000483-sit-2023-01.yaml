findings:
- kind: data_missing
  statement: The free-chamber recordings of Figure 1D and E (4 recordings over 3 mice, 2665 neurons) are not in the dandiset.
    The files hold 20 mice where the paper used 26.
- kind: data_missing
  statement: The files hold the raw fluorescence of each ROI but no neuropil trace, dF/F or inferred spikes, so the paper's
    neuropil-corrected signals cannot be rebuilt without reprocessing the raw video (about 695 GB). The axon recordings
    lack the Suite2P traces the paper used.
- kind: metadata_insufficient
  statement: The experiment a file belongs to (single cue, dual cue, axons, head rotation, remapping, rotation direction,
    animal control, visual cue only) is given only inside its identifier string; the session description is "floating
    air cage experiment" for every file.
- kind: metadata_insufficient
  statement: Light-on and light-off periods, which most dual-cue analyses need, are not marked in any file; the paper's
    code hard-codes them by recording length.
- kind: metadata_insufficient
  statement: The heading is relative to "cage door dead north"; where the cue or cues sit in that frame is not given,
    so heading relative to the cue cannot be computed. In the head-rotation pairs the stored headings run in opposite
    directions in the two conditions in 5 of 7 pairs, and how each is defined is not stated.
- kind: metadata_insufficient
  statement: The visual-cue-only recordings of Figure 5K share no ROIs with any standard recording and no matching is
    given, and nothing in them marks standard and visual-only rotation, so the matched neurons of Figure 5K cannot be
    found.
- kind: metadata_error
  statement: The heading and position series state a rate of 0.1 Hz; they have one sample per imaging frame, at 10 Hz.
    The two-photon series states about 20 Hz with the same number of frames.
- kind: metadata_error
  statement: Every file's imaging plane is described as "soma recording from retrosplenial cortex", including the 24
    axon recordings.
- kind: metadata_error
  statement: Four files of mouse SKKS089 (2021-04-29 head rotation, 2021-05-18 remapping) carry identifiers naming SKKS088.
- kind: selection_undocumented
  statement: The dandiset holds 7 head-rotation pairs over 5 mice (paper 5 over 4), 35 dual-cue soma recordings (paper
    36), 4 recordings in both rotation directions over 3 mice (paper 4 over 2) and 5 animal-controlled recordings over
    4 mice (paper 7 over 3); which recordings the paper used is not stated.
- kind: methods_unavailable
  statement: Question for the authors. The heading-selection code fits the Gaussian to the trial-mean curve without centring
    it (center_flag false) and bounds the peak location to pi/2 +- pi/6, which passes only cells whose peak lies near
    one heading (here 10.85% of single-cue cells, 93.6% of them in one quadrant). Was the curve centred on its peak before
    the fit, as the 'fit' preferred direction does? With centring, 15.26% pass and their preferred headings tile the
    circle.
- kind: methods_unavailable
  statement: Question for the authors. In the head-rotation experiment, how are the stored headings of the head-rotation
    and chamber-rotation files defined, and was one mirrored before comparing preferred headings? Which 5 of the 7 pairs
    in the dandiset were used?
- kind: methods_unavailable
  statement: The code that aligns light-off to light-on trials (leaveOneOutAligner), and the code for the clustering,
    V-tests, decoding and statistics, are not in the linked repository.
- kind: methods_unavailable
  statement: Question for the authors. Were the pre-shuffled data of the selection control (Methods) shifted once before
    the test, or afresh in every iteration as in the commented calculateHeadDirection_shuff of Cue.m? The second passes
    no cell by construction. Shifted once, 5.19% of single-cue cells pass here, and synthetic untuned cells pass at 4.7%,
    as the KS test of the code compares 1000 split-half correlations of the same trials.
- kind: methods_unavailable
  statement: Question for the authors. Which decoder gave Figure 6, the Bayesian decoder of the Methods (Etter et al.
    2020) or the lab's HeadingDecoder, on dF/F or on spikes, and how was activity binarized? Neither the decoder code
    nor the trial selection for the pseudopopulations is in the linked repository.
- kind: other
  statement: 'The chamber-rotation file 210526 SKKS112-PlatformRotation-002 barely rotates: its median heading step is
    0.12 degree per frame, against about 2 in the other chamber-rotation files, and it yields 10 trials against 26 in
    the other 5100-frame files. It is paired with a head-rotation file in which 64% of the ROIs pass the selection test.'
- kind: other
  statement: The decoding procedure of the Methods resamples each trial to 200 bins and then splits even and odd time
    points for training and testing, so test bins share frames with training bins. Here, removing that sharing lowers
    the light-on accuracy of all tuned cells from 0.708 to 0.532 (dF/F) and from 0.712 to 0.296 (spikes) under the naive
    Bayes decoder; the paper's accuracies may be raised in the same way.
verifications:
- date: '2026-10-30'
  kind: agent
  by: Independent agent run by CatalystNeuro (same harness, separate context, did not write the notebooks)
  reviewed: 'Round 1. The executed notebooks of the first run with the conclusion cells and the summaries removed, the
    helper module and the claims file, with the paper. The verifier tested the selection test, the flip score and the
    peak-offset measure on synthetic inputs. fig5k and the seven Figure 6 claims had no notebook output then, so it gave
    no outcome for them. Its points that bear on no single claim are answered as follows. The clock check (B7) is now
    read in single_cue.ipynb: the lag peaks after 0 in three files and before 0 in one, so the clock is not established
    in general, and rotation_remapping.ipynb gives the size of a 6-frame offset in degrees. The trial rule (B11) matches
    the code, any(90 - abs(prctile(heading, [25, 75])) > 50), as rsc.py now quotes. The smoothdata window (B12) is stated
    in rsc.py as an assumption. The counts that differ from the paper''s (B15) stay recorded as selection_undocumented.'
  results:
  - claim: fig1-free-heading-fraction
    agrees: true
    outcome: blocked
    reason: Every one of the 128 assets is classified. All 16 single-cue files rotate at a steady 3 to 8 rpm (motor-driven).
      The only animal-controlled files are 2022 dual-cue recordings. The API listing (128 assets) agrees.
    response: No change needed.
  - claim: fig1g-rotation-heading-fraction
    agrees: true
    outcome: reproduced
    reason: 'With the centred fit, 485/3179 = 15.26%, inside 14.2 +- 1.42 and 452 +- 45. The code''s uncentred fit gives
      10.85%, but it only passes cells whose peak is near -90, which contradicts Fig. 1H, so the centred reading is reasonable.
      Caveat: the test also passes untuned noise (B1).'
    response: Added the false-positive rate on synthetic untuned cells (4.7% centred, 1.7% uncentred) and quoted the
      code to show the KS test on 1000 overlapping split-halves is the paper's own procedure (ControlledRotation.m).
      The outcome stands, and the notes say about a third of the cells could pass by chance.
  - claim: selection-shuffled-control
    agrees: false
    outcome: not_reproduced
    reason: The paper says data were shuffled before running the procedure, and the criterion says "before the test".
      That reading (the "once" variant) passes 165/3179 = 5.19%, above the 1% limit. The 0% "each" reading cannot fail
      by construction (B2).
    response: Changed to not_reproduced, resting on the "once" reading as an assumption (165, 5.19%). The code shows
      the commented function reshuffles in every iteration; the conflict within the criterion is asked of a reader in
      questions/000483.yaml, and a methods_unavailable finding asks the authors.
  - claim: fig1h-preferred-headings-tile
    agrees: true
    outcome: partially_reproduced
    reason: 'Tiling holds under both readings. The overrepresentation can''t be judged because where the cue sits in
      the heading frame is unknown. At dataset heading 0 the share is 0.247, below 0.25. The densest window (-102, 0.40)
      depends on the mouse: SKKS090 and SKKS091 peak about 180 away from it (B9).'
    response: No change of outcome. The notebook now shows that the code fit's clustering near -90 comes from its bounds
      on the Gaussian's peak (dataset headings -120 to -60), so it does not locate the cue, and prints the share near
      -90 (40.0%) as what the share would be were the cue there. No file or code gives the cue's position.
  - claim: fig2f-head-chamber-same-preference
    agrees: false
    outcome: partially_reproduced
    reason: 'p < 0.05 with V > 0 appears only when the chamber-rotation heading is mirrored and only 5 of 7 pairs are
      used: V = 34.6, n = 228. V is outside 14.1 +- 1.41. One pair (SKKS116) drives it. Randomly paired ROIs give a higher
      V (mean 46.2), so there is no evidence that matched ROIs keep their preference. Head-rotation files show implausibly
      many selective cells and heading-locked artefacts from derotation are not ruled out (B4).'
    response: Changed to partially_reproduced. Added the random-pairing null per pair (the real V lies within it in every
      pair, SKKS116 included), the selective share and activity of the two files of each pair, and the size of a clock
      offset in degrees. The notes say matched ROIs do not keep their preference better than random pairs here.
  - claim: fig3c-coherent-remapping
    agrees: false
    outcome: partially_reproduced
    reason: All 8 readings give p < 0.05 with V > 0. V (47.0 at n = 85, or 208.9 at n = 830) is outside 25.6 +- 2.56.
      The main reading is only just above the random-pairing null (95th percentile 44.6, from just 100 draws).
    response: Changed to partially_reproduced. The null now has 1000 draws (95th percentile 45.7; 2.6% of random pairings
      reach the real V). The SKKS091 210504 pair (B14) has fewer than 3 cells selective in both and enters only the "either"
      readings, as now said.
  - claim: fig4-axons-light-on-shape
    agrees: true
    outcome: reproduced
    reason: 'Under reading (b), all axons: mean-curve flip score ADN -0.207 and visual 1.875; single-axon means -0.109
      vs 0.506, KS p = 1.6e-24. Reading (a) fails: the ADN mean-curve flip score is 0.277 (centred) or 1.132 (code fit).'
    response: No change needed.
  - claim: fig4-axons-light-off
    agrees: true
    outcome: partially_reproduced
    reason: Visual axons lose tuning. The ADN fraction selective in light-off is higher, but the per-recording comparison
      is not significant (p = 0.35); only the Fisher variant is. The ADN light-off peak is 24 to 30 degrees from the
      light-on peak under readings (a) centred and (b). The light-off selective fraction is computed over all axons only,
      not for reading (a) (B8).
    response: 'Added reading (a): among selective axons the per-recording share also selective in light-off has medians
      0.134 and 0.000, Mann-Whitney p = 0.15; Fisher p = 5.4e-07. The outcome stands.'
  - claim: figs5-rotation-direction
    agrees: true
    outcome: reproduced
    reason: 'Reading (b), selective cells: bootstrapped KS p = 0.002, median correlation 0.210 real vs 0.118 random.
      Reading (a) gives p = 0.16. The data are 4 files over 3 mice, not 2.'
    response: No change needed; the notes now say the pooled random pairs cross files and that by mouse only SKKS125
      passes.
  - claim: figs6-arena-control
    agrees: true
    outcome: reproduced
    reason: Reproduced (fragile). Reading (b) gives p = 0.026, with median correlation 0.027 real vs -0.011 random. Reading
      (a) gives p = 0.89. It uses 5 pairs over 4 mice, and 112 of the 381 cells come from a file that visits 6 of 60
      heading bins, and no run without it is shown (B10).
    response: Added the run without that pair and each pair alone. Without it neither reading passes ((a) p = 0.973,
      (b) p = 0.9) and no pair passes alone, so the outcome is changed to not_reproduced, resting on leaving that pair
      out as an assumption. This differs from the verifier's outcome; round 2 reviews it.
  - claim: fig5-three-classes
    agrees: true
    outcome: not_reproduced
    reason: The silhouette at k = 3 is not a local maximum under either reading. Only the reviewer-code variant, (a)
      centred on each curve's own peak, peaks at 3 (0.393).
    response: No change of outcome.
  - claim: fig5-class-proportions
    agrees: true
    outcome: not_reproduced
    reason: 'Tuned cells match (12.10%). The classes do not: landmark 7.4%, alignment 75.3%, heading 13.3% (counts 67,
      1150, 202 against 522, 409, 332), and the order fails under every reading. All three GMM light-on archetypes are
      bimodal, so no component is a unimodal heading class; the names come from a heuristic the notebook makes up (B5).'
    response: No change of outcome. The notes now say all three archetypes are bimodal.
  - claim: fig5e-alignment-peaks-coregistered
    agrees: false
    outcome: not_reproduced
    reason: The V-test passes (V = 743.5), but this measure gives the same V/n under random light-off peaks (B3). Only
      29.2% of offsets are within 18 degrees, against about 0.21 to 0.23 by chance. This is far from "always", and lower
      than the heading and landmark classes.
    response: 'Added two nulls. Uniform peaks give V/n 0.582 against 0.646; light-off peaks paired at random within the
