  outcome: not_reproduced
  notebook: decoding.ipynb
  output: claim:fig6a-population-light-on
  measured: 0.708
  notes: No decoder reading gives a light-on mean within 0.82 +- 0.04. The naive Bayes decoder gives 0.708 [0.665,
