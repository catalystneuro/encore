findings:
- kind: metadata_insufficient
  statement: The behavioural files give no position of the stimulation contacts in the volumetric imaging
    volume (the electrode table gives positions along the probe only) and no activation calls, and they
    hold per-ROI dF/F, not the voxel-level responses the activation rule uses. The paper's counts, densities
    and radii of activated neurons (Fig. 2B to 2G, fig. S2) cannot be formed.
- kind: identifier_missing
  statement: Planar ROIs are segmented separately in each session and carry no identity across sessions,
    and no mean or reference images are stored for alignment, so the neurons tracked across weeks in Fig.
    3 and fig. S6 cannot be found.
- kind: data_missing
  statement: Each unit has one mean waveform of 90 samples on one channel. Waveforms of spikes in and
    out of stimulation (Fig. 4D) and the multi-channel templates UnitMatch needs (fig. S8) are not in
    the files, nor are labels of the tracked units.
- kind: paper_inconsistency
  statement: The Methods say the control animals had similar stimulation parameters to the behavioural
    group, but the control files describe and hold 3 bursts of 10 biphasic pulses at 50 Hz per trial (200
    ms bursts 0.5 s apart), where the behavioural trains are 70 pulses at 100 Hz over 700 ms.
- kind: metadata_insufficient
  statement: The control survey imaging gives no voxel size or plane spacing, and 2 to 9 of its 32 stimulation
    contact positions sit at the origin with no stated mapping from Ripple channel number to contact index,
    so distances of ROIs from the stimulation site cannot be formed.
- kind: other
  statement: The files hold 795 unit-sessions in the 46 sessions of weeks 0 to 4 (999 over all 55 behavioural
    sessions), where the paper reports 973 units; 24 control imaging sessions where the paper reports
    18; and units in 14 sessions of 4 control mice where fig. S7 reports 4 animals and 15 sessions.
- kind: metadata_insufficient
  statement: The trials table gives no response time for miss trials except 98, so the movement-onset
    threshold of fig. S5 (25th percentile over hit and miss trials) cannot be formed as stated; and response_time
    is measured from trial start, which precedes the train onset by 0 to 85 ms depending on the session
    (56 to 85 ms in ICMS101 2023-10-27).
- kind: data_missing
  statement: Mouse 6 (ICMS83) has no catch trials in its files (currents 2 to 10 uA only), though the
    Methods give each block 10 catch trials; its thresholds cannot use the false-alarm point.
- kind: metadata_error
  statement: The electrical_stimulation tables describe 700 ms, 70-pulse trains, but in sessions with
    planar imaging they also hold 37 to 90 trains of up to 242 pulses lasting seconds, after the end of
    the electrophysiology recording.
- kind: metadata_error
  statement: Cell types are spelled 'Pyramidal Cell', 'Narrow Interneuron' and 'unknown' in ICMS83 and
    'pyramidal' and 'interneuron' elsewhere; and the stored type disagrees with the 0.45 ms trough-to-peak
    rule applied to the stored mean waveform for 72 units (29 interneurons at 0.45 ms or more, 43 pyramidal
    below).
- kind: metadata_insufficient
  statement: stim_channel (Ripple stimulation channel number) and the electrode table's channel_name (Ripple
    channel number) are not stated to be the same numbering, and with them taken as the same, the fraction
    of modulated responses does not fall with distance from the stimulation contact, so the distances
    of fig. S4 cannot be confirmed.
- kind: methods_unavailable
  statement: Question for the authors (fig. 6D). What bin width and smoothing were used for the hit and
    miss PSTHs, and was the divergence onset the first significant cluster or the last? With 10 or 5 ms
    bins and no smoothing, PL responses show significant clusters in both phases and the early NPL onset
    is about 105 ms.
- kind: methods_unavailable
  statement: Question for the authors (fig. S5, E to H). Were the modulated set and the PL labels recomputed
    in the 120 ms window or kept from the 700 ms analysis? Kept, the NPL modulation does not change; recomputed,
    it rises at all three currents.
- kind: methods_unavailable
  statement: Question for the authors (fig. S7, fig. S9C). How were modulation, time to maximum and pulse-locking
    computed for the control animals, whose files hold 3 bursts of 10 pulses at 50 Hz per trial?
