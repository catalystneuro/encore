- claim: figs4b-pl-latency-distance
  outcome: not_reproduced
  notebook: reproduce_kim_2026.ipynb
  output: claim:figs4b-pl-latency-distance
  notes: Over 120 to 840 um the PL latency slope is -0.00108 ms/um at 4 uA on binned means (p = 0.0202)
