outcomes:
- claim: fig2a-threshold-decrease
  outcome: reproduced
  notebook: reproduce_kim_2026.ipynb
  output: claim:fig2a-threshold-decrease
  measured:
  - 5.41
  - 3.84
  - 46
  - 89
  notes: psignifit thresholds (mean of block thresholds per channel and session, weeks 0 to 4, six mice)
    have medians of 5.41 uA early (n = 46) and 3.84 uA late (n = 89), both within tolerance, and late
    is lower (two-sided Mann-Whitney p = 5.43e-06, r = 0.39; paper p = 7.68e-6, r = 0.40). The early n
    is within 43 +- 4; the late n of 89 is one above 80 +- 8, an expected value the criterion does not
    judge. The bounded maximum likelihood fit gives 5.36 and 3.68 uA (late outside tolerance, p = 8.51e-07).
    Without Mouse 6, 5.21 and 3.94 uA (p = 7.04e-05). Every mouse is lower late.
  deviations:
  - Thresholds are refitted with psignifit 4.3 (Python), sigmoid norm, yes/no, on a grid of 25 steps for
    threshold and width and 12 for guess, lapse and eta, coarser than psignifit's default; this is a standard
    choice of numerical precision. The paper's code calls the MATLAB toolbox. The dataset stores no thresholds.
  - Blocks are the 100-trial groups of the volumetric trials; the planar fifth block is left out as the
    Methods count four blocks (Methods, Analysis of behavioral data). 38 channel-sessions have two blocks
    and 4 have one or three.
  - Mouse 6 (ICMS83) has no catch trials in its files, so its fits have no 0 uA point.
- claim: fig2a-steepest-decline-early
  outcome: reproduced
  notebook: reproduce_kim_2026.ipynb
  output: claim:fig2a-steepest-decline-early
  notes: Median psignifit threshold per week is 6.409, 4.637, 3.785, 4.324 and 3.827 uA for weeks 0 to
    4. The fall from week 0 to 1 (1.772 uA) is larger than each later change (largest 0.853 uA). With
    the maximum likelihood fit the margin is narrow, 1.232 against 1.220 uA.
  deviations:
  - The criterion's reading of Fig. 2A (week medians) is the claims file's assumption.
  assumed: true
- claim: figs1e-response-times-decrease
  outcome: reproduced
  notebook: reproduce_kim_2026.ipynb
  output: claim:figs1e-response-times-decrease
  notes: Median over mice of the per-mouse median hit response time at 4 to 6 uA is 274.9 ms in week 0,
    199.2 in week 1 and 193.9 over the late phase; 93% of the fall (75.7 of 81.0 ms) is between weeks
    0 and 1. From the train onset, 265.4 and 186.8 ms (93%). Variant, hit trials early against late, 190.1
    against 173.8 ms, p = 7.19e-17, r = -0.14.
  deviations:
  - The dataset's response_time is from trial start, which precedes the train onset by 5.5 to 37 ms in
    most sessions, 0 in Mouse 6 and 56 to 85 ms in ICMS101 2023-10-27; the time from train onset is shown
    as a variant and gives the same result.
  - Currents 4 to 6 uA, as the common method of the claims file fixes.
- claim: figs5c-wheel-onset-decrease
  outcome: reproduced
  notebook: reproduce_kim_2026.ipynb
  output: claim:figs5c-wheel-onset-decrease
  notes: Per-animal thresholds (11.8 to 14.5 a.u.) give median onsets of 119.0 ms in Mouse 1, 133.0 ms
    over all hit trials and 128.0 ms in the late phase, all within tolerance; early 144.0 ms (n = 1307)
    against late 128.0 ms (n = 2897), p = 6.09e-32, r = -0.23 (paper n 1305 and 2922, r = -0.22). The
    pooled threshold gives 118.0, 134.0 and 129.0 ms and p = 1.94e-29. No onset is found in 568 of 4772
    hit trials.
  deviations:
  - The paper takes the response threshold from hit and miss trials; the dataset's miss trials have no
    response time except 98, so the threshold is taken from hit trials, with those 98 added as a variant
    (same thresholds).
  - The stored wheel_position_processed is already low-passed at 20 Hz forward and backward (its description),
    so no filter is applied again.
  - Onset is measured from the train onset of the electrical_stimulation table.
- claim: fig4-unit-counts
  outcome: partially_reproduced
  notebook: reproduce_kim_2026.ipynb
  output: claim:fig4-unit-counts
  notes: Weeks 0 to 4, reading (a) unit-sessions, 795 units (584 pyramidal, 204 interneurons, 7 unknown),
    488 modulated (339 pyramidal, 146 interneurons). The modulated total and the modulated pyramidal count
    are within tolerance; the totals of all, pyramidal and interneuron units and the modulated interneurons
    are below it (2 of 6, the criterion asks 5). Over all 55 sessions, 999 units (732, 260) and 585 modulated
    (405, 177), 3 of 6. With the Methods filters alone the counts are the same. Reading (b) cannot be
    formed, as no unit identity across sessions is stored. The trough-to-peak histogram has a dip at 0.45
    to 0.50 ms (22 units between 59 and 44), bimodal about 0.45 ms.
  deviations:
  - Cell type is the stored cell_type; Mouse 6 spells it 'Pyramidal Cell' and 'Narrow Interneuron', read
    as the same labels. By the trough-to-peak of the stored single-channel mean waveform, 72 units change
    class.
