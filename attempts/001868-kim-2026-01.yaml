- claim: figs7-control-no-change
  outcome: blocked
  blocked_by: methods_underspecified
  notes: The control files stimulate with 3 bursts of 10 pulses at 50 Hz per trial (200 ms each), not
    the 700 ms, 100 Hz trains the paper's modulation, time to maximum and pulse-locking measures are defined
