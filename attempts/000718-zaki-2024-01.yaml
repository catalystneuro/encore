findings:
- kind: data_missing
  statement: The dandiset holds two of the nine mice of the calcium imaging and EEG/EMG experiment
    (Ca_EEG2-1, high shock; Ca_EEG3-4, low shock) and, of each offline period, only the first 10 min recording
    of the 24 the Methods describe. Ca_EEG2-1 has no offline-day-1 recording and no neutral or novel recall
    session. The mice of the one-hour offline experiments (Figures 2 to 4 and 6, Extended Data Figures 3, 4
    and 7), the behaviour-only experiments, and the inhibitory tagging and no-shock experiments are not
    deposited. Twenty of the 26 claims cannot be tested for this reason.
- kind: data_missing
  statement: Ca_EEG3-4 has no cell registration in the dandiset, so its ensembles cannot be formed. The Week
    file of Ca_EEG2-1 holds 19 registration tables for offline-day-2 recordings, of which only the first
    recording is deposited, and none for offline day 1.
- kind: selection_undocumented
  statement: The dandiset does not say why these two mice, and only the first offline recording of each
    period, were deposited, nor that the paper analysed more.
- kind: metadata_error
  statement: The session start times of the Ca_EEG2-1 behaviour sessions (NeutralExposure, FC, Recall1), and
    the Week epochs built from them, are about 1 h later than the telemetry and Miniscope clock. As deposited,
    OfflineDay2Session1 starts 47 min before the FC session it follows. The telemetry is absent (mouse out of
    its home cage) in windows that contain each of these epochs moved 1 h earlier, and the offline file's EEG
    sits exactly at its own epoch in the week recording.
- kind: format_error
  statement: The OnePhotonSeries timestamps of three files (Ca_EEG2-1 NeutralExposure, Ca_EEG3-4
    OfflineDay1Session1, Ca_EEG3-4 Recall2) run at 16.7 ms and end at half the recording's length, while their
    frame counts fit 30 Hz over the full length given by the deconvolved timestamps.
- kind: metadata_insufficient
  statement: The sleep states include `quiet wake`, which the paper neither uses nor maps to its wake, NREM
    and REM states, so it is not known which state the paper assigned these epochs to. The three offline
    recordings hold no NREM (`sws`) or REM epochs.
- kind: metadata_error
  statement: The session description of the offline recordings says that mouse behaviour and calcium were
    recorded for an hour with a webcam above the home cage. The deposited offline recordings last 10 min, hold
    telemetry and no video, and the Methods describe this experiment's offline recordings as 10 min in the
    telemetry home cage.
- kind: metadata_insufficient
  statement: The fluorescence series carry placeholder descriptions ("description of deconvolved traces") and
    unit "n.a.", the FC session descriptions give the shock amplitude without a unit, and the Week file has an
    empty session description.
- kind: methods_unavailable
  statement: The analysis code repository the paper names
    (github.com/denisecailab/RetrospectiveMemoryLinkingAnalysis_2024) returns 404, so how bursts are counted,
    in the data and in shuffled surrogates, could not be checked; the surrogate burst rates here differ from
    the paper's chance level.
