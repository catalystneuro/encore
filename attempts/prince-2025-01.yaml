findings:
- kind: metadata_insufficient
  statement: The units tables of five sessions (S20-210517, S28-211114, S29-211104, S29-211105, S34-220617;
    633 units) hold only the phy columns, with no region, cell type, electrodes or electrode group column
    (61 of the 66 units tables have an electrode group). Their ch values (0 to 63) do not say which of
    the two 64-channel probes a unit is on, since ch runs from 0 to 63 on both probes in the labelled
    sessions, so they cannot be assigned to CA1 or PFC. With them, the unit count equals the paper's 6449;
    without them, CA1 has 3545 units and PFC 2271 against 3892 and 2557.
- kind: metadata_error
  statement: Position (processing/behavior/position) is labelled meters, but its values are in virtual
    track units (y from -117 to 286, the code's track ends at 285).
- kind: metadata_error
  statement: View angle is labelled degrees, but its values run from -1.047 to 1.047, radians (plus or
    minus 60 degrees).
- kind: metadata_error
  statement: The theta phase in processing/ecephys/decomposition_phase is labelled degrees, but its values
    run from -pi to pi, radians.
- kind: metadata_error
  statement: 'The trials column turn_type is described as {''right'': 1, ''left'': 2}. In the data, correct
    delay only trials with turn_type 1 all end at negative x (2521 of 2521) and have choice 1, and the
    paper''s code maps turn_type 1 to left and puts the left arm at negative x; the description has the
    two labels the other way round, or names sides by a convention the files do not state.'
- kind: paper_inconsistency
  statement: The Methods and the Figure 1b legend give rolling windows of 40 trials, but the reported
    window counts (6252 delay only, 1002 switch, 117 stay) are those of 15-trial windows, the code's default;
    40-trial windows give 4636, 239 and none.
- kind: paper_inconsistency
  statement: Supplementary Table 1 lists 8104 delay trials; the final-task delay only trials number 7172,
    the Results' count, and the 932 warm-up trials (maze_id 3) make up the difference. The trial-type
    fractions of the Results (65, 25 and 10%) are not those of the trials (0.737, 0.189, 0.074).
- kind: code_mismatch
  statement: The paper's code counts the encoder training trials (80% of delay only trials) for the 50-trial
    session rule, where the Methods count the trials of the session; on this dataset the Methods' count
    gives 55 CA1 and 46 PFC sessions, close to the 56 and 47 of Supplementary Table 2, and the code's
    count 47 and 37. A reader amended S1 to follow the Methods (answer of 2026-11-02), and the code's
    count changes two outcomes here (sfig3c-retrospective-unchanged, p = 0.14 against 0.036, and sfig12-delay-hpc-no-outcome-difference,
    p = 0.096 against 0.043).
- kind: code_mismatch
  statement: The paper's code reads the theta phase stored in the file (general/lfp.py), where the Methods
    describe a phase from peaks and troughs of the filtered LFP; the two agree closely at the decoding
    bins (mean cosine of their difference, median 0.975 over 59 sessions), and every theta outcome is
    the same with either. In the session where they agree least (S20-210511, mean cosine -0.49) the pyramidal
    spikes are barely locked to theta (0.085 and 0.086 of spikes in the peak 30-degree bin against 0.083
    for uniform firing), so the reference phase of maximal firing, and with it the referenced phase, is
    nearly arbitrary under either estimate.
- kind: code_mismatch
  statement: The Methods define the decoding spread of Supplementary Fig. 5f by "how far in front and
    behind of the peak value the decoding results dropped below this threshold" (peak minus one standard
    deviation), the first crossing on each side; the paper's code (plot_region_error_distribution) takes
    the outermost bins at or above the threshold anywhere before and after the peak. On this dataset the
    first crossing gives 0.14 and 0.37 bins (CA1, PFC) and the code's rule 4.07 and 4.37, against the
    paper's 2.4 and 3.13.
- kind: methods_unavailable
  statement: 'Question for the paper''s authors: which 0.2 s bins enter the windows after the update cue
    (0 to 0.5, 0 to 1 and 0 to 1.5 s)? The code samples the decoding at -2.5, -2.3, ..., -0.1, 0.1, ...,
    2.5 s and cuts windows with pd.cut, which this attempt follows; a grid with a bin centred on the cue,
    counted after it, shifts the windows by 0.1 s. On this dataset the shift changes three outcomes (sfig3c-retrospective-unchanged
    p = 0.036 against 0.12; fig5d-stay-hpc-below-switch new arm p = 0.0094 against 0.38; fig7c-hpc-commitment-initial-arm
    p = 0.29 against 0.040). It also changes one test of fig2g-pfc-no-goal-increase (reading b new arm
    p = 0.030 against 0.066), whose outcome it leaves unchanged, since reading a fails on both grids.'
