    does for large samples.
  - Decoding is a numpy implementation of pynapple decode_1d with a uniform prior, on tuning curves from
    within-trial locomotion samples (|rot| + |trans| of the acquisition series above 1000, S3) of 80%
    of delay only trials (train_test_split, random_state 21).
  - Sessions are included with at least 20 units in the region and at least 50 final-task trials of the
    session, warm-up trials left out (S1 as a reader amended it on 2026-11-02; Methods, Decoding analyses,
    "less than 50 trials for the behavioral session"), giving 55 CA1 and 46 PFC sessions against the paper's
    56 and 47. The paper's trial counts are higher (for CA1 1295 switch and 926 delay only correct trials
    against 1241 and 871 here), partly because the units of five sessions carry no region (finding). The
    code's count of encoder training trials (47 CA1 and 37 PFC sessions), the variant S1 names, is shown
    for every test.
  - 'Update-aligned decoding uses the code''s time grid (_align_by_times, samples at -2.5, -2.3, ...,
    -0.1, 0.1, ..., 2.5 s): 26 bins of 0.2 s from -2.6 to 2.6 s whose edges fall on the cue; the code
    decodes the session in 0.2 s bins and interpolates at those times, here each bin is decoded directly.
