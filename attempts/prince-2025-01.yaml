- claim: fig1d-heading-switch
  outcome: reproduced
  notebook: reproduce_prince_2025.ipynb
  output: claim:fig1d-heading-switch
  notes: 'Mean view angle by central-arm position bin, signed toward the initial side: on switch trials
    +0.198 and +0.183 rad at the update cue position and -0.318 and -0.154 rad in the last central bin
    (turn_type 1 and 2); on delay only trials +0.197 and +0.217 rad in the last bin. 12 of 14 animal and
    side means of switch trials point to the new side in the last bin.'
  deviations:
  - View angle is in radians (labelled degrees). Its sign convention (positive toward negative x, the
    left arm) is taken from the paper's code, which negates view angle on right trials; in the data view
    angle and sideways movement correlate negatively (median Spearman r -0.12 over sessions), consistent
    with it.
