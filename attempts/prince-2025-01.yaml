  output: claim:fig1b-above-chance
  measured:
  - 0.649
  - 0.745
  notes: 'Reading (a), one proportion per session and trial type: delay only mean 0.649 +/- 0.017 over
    66 sessions, Wilcoxon W = 125.5, p = 6.1e-10; switch 0.745 +/- 0.020, W = 48.5, p = 3.3e-11. The paper
    prints W = 125.5 and 48.5, so its test is on session proportions. Means over animals (reading d) are
    0.641 and 0.745. Reading (b), 40-trial windows, also gives p far below 0.05 (delay only mean 0.683,
    switch 0.810).'
