- claim: tuning-tiles-track
  outcome: reproduced
  notebook: reproduce_prince_2025.ipynb
  output: claim:tuning-tiles-track
  notes: 'Peaks of encoder tuning curves over all units with spikes in included sessions (CA1 3404, PFC
    2148): every track bin is some unit''s peak in both regions, and the only bins that are no unit''s
    peak are the four bins lying wholly in the gaps between track segments (34, 35, 42, 43). Peaks fall
    about equally on the central arm and the goal arms (CA1 1730 and 1674, PFC 1075 and 1073). Reading
    (b) holds with no empty track bin. The reader''s answer of 2026-11-02 (questions/001371.yaml) changed
    S1 to count the final-task trials of the session for the 50-trial rule, so this claim was re-run on
    55 CA1 and 46 PFC sessions in place of 47 and 37. Under the code''s count (CA1 2854, PFC 1790 units)
    the result is the same; the outcome is unchanged.'
  deviations:
  - Reading (a) asks that every one of the 50 bins be a peak. Four bins lie wholly in the artificial gaps
    between track segments (Methods, Behavioral analysis), where the animal never is, so no tuning curve
    can peak there; reading (a) is judged on the 46 track bins.
  - Decoding is a numpy implementation of pynapple decode_1d with a uniform prior, on tuning curves from
    within-trial locomotion samples (|rot| + |trans| of the acquisition series above 1000, S3) of 80%
    of delay only trials (train_test_split, random_state 21).
  - Sessions are included with at least 20 units in the region and at least 50 final-task trials of the
    session, warm-up trials left out (S1 as a reader amended it on 2026-11-02; Methods, Decoding analyses,
    "less than 50 trials for the behavioral session"), giving 55 CA1 and 46 PFC sessions against the paper's
    56 and 47. The paper's trial counts are higher (for CA1 1295 switch and 926 delay only correct trials
    against 1241 and 871 here), partly because the units of five sessions carry no region (finding). The
    code's count of encoder training trials (47 CA1 and 37 PFC sessions), the variant S1 names, is shown
    for every test.
