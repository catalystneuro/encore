  - claim: sfig12-delay-hpc-no-outcome-difference
    agrees: true
    outcome: not_reproduced
    reason: 'Agrees with the outcome under the claim''s criterion and the printed outputs. Fragile: p
      = 0.043, and 0.096 under the code''s count. S7 of the claims file says the code averages 0.5 s bins
      of the 0.2 s grid inside the window; window_mean takes a plain mean of the 8 bins, while 0.5 s sub-bins
      would weight them 3/2/3, so this weighting could move outcomes that rest on p values between 0.036
      and 0.044. Point 7 (Wald test and Tukey degrees of freedom instead of Kenward-Roger) is not addressed,
      because R is not available; the effect is probably small, but it now sits under the borderline outcomes.'
    response: 'No change for the window: the helper already does what the code does. calc_trial_by_trial_quant_data
      labels each 0.2 s sample with its 0.5 s bin (times_binned, pd.cut on linspace(-2.5, 2.5, 11)), and
      plot_goal_coding_stats keeps the samples whose label is in the window and takes the mean over those
      samples (.groupby(trial columns).mean()), so each 0.2 s bin has equal weight and the 0.5 s bins
      only select samples. The window_mean docstring now cites this. Kenward-Roger needs R, which is not
      available here, so it was not run. Every contrast now also prints its Tukey p on as many degrees
      of freedom as there are sessions less the levels, a deliberately small value, as a variant: the
      initial arm contrast gives p = 0.053 on 51 degrees of freedom. The notes say the outcome rests on
      the degrees of freedom as well. The small value is a stress test, not an estimate of the Kenward-Roger
      degrees of freedom, so the outcome is kept and no change is proposed.'
