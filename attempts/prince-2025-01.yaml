  notes: '7 animals and 66 sessions (8, 12, 10, 11, 12, 6 and 7 per animal) match. 3545 CA1 units (within
    389.2 of 3892) and 2271 PFC units (outside 255.7 of 2557). The units of five sessions (S20-210517,
