  outcome: reproduced
  notebook: reproduce_prince_2025.ipynb
  output: claim:fig1b-window-performance
  measured:
  - 0.678
  - 0.775
  - 0.667
  - 0.8
  notes: 'Reading (b), 15-trial windows: 6252 delay only and 1002 switch windows, the paper''s counts;
    means 0.678 and 0.775, medians 0.667 and 0.800, all within tolerance. Reading (a), 40-trial windows:
