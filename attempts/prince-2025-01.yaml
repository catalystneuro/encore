- claim: fig2e-hpc-goal-increase
  outcome: reproduced
  notebook: reproduce_prince_2025.ipynb
  output: claim:fig2e-hpc-goal-increase
  measured:
  - 0.1318
  - 0.135
  - 0.0934
  - 0.1004
  notes: 'Correct trials, reading (a): ANOVA F(3) = 33.6, p = 9.9e-22; switch minus delay only, initial
    +0.039 (z = 7.47, Tukey p = 2.4e-12), new +0.035 (z = 6.74, p = 1.1e-10). Reading (b) gives the same
    (p = 6.7e-13 and 8.1e-11). Trial means 0.132 (switch initial), 0.135 (switch new), 0.093 (delay only
    initial), 0.100 (delay only new), all within tolerance. 1241 switch and 871 delay only trials in 55
    sessions (paper 1295 and 926 in 56). The increase holds in 4 of 7 animals for the initial arm and
    5 of 7 for the new arm. The code''s count of trials gives p < 2e-10 for every contrast, and the round-1
    grid gave p = 2.7e-12 and 1.8e-7; the outcome is the same under each.'
  deviations:
  - The ANOVA is a Wald test of the combined predictor in a statsmodels MixedLM (random intercepts for
    animal and session within animal); lme4 with Kenward-Roger degrees of freedom is not used. Tukey p
    values use the studentized range over all levels with large degrees of freedom, as emmeans pairs()
    does for large samples.
  - Decoding is a numpy implementation of pynapple decode_1d with a uniform prior, on tuning curves from
    within-trial locomotion samples (|rot| + |trans| of the acquisition series above 1000, S3) of 80%
    of delay only trials (train_test_split, random_state 21).
  - Sessions are included with at least 20 units in the region and at least 50 final-task trials of the
    session, warm-up trials left out (S1 as a reader amended it on 2026-11-02; Methods, Decoding analyses,
    "less than 50 trials for the behavioral session"), giving 55 CA1 and 46 PFC sessions against the paper's
    56 and 47. The paper's trial counts are higher (for CA1 1295 switch and 926 delay only correct trials
    against 1241 and 871 here), partly because the units of five sessions carry no region (finding). The
    code's count of encoder training trials (47 CA1 and 37 PFC sessions), the variant S1 names, is shown
    for every test.
  - 'Update-aligned decoding uses the code''s time grid (_align_by_times, samples at -2.5, -2.3, ...,
    -0.1, 0.1, ..., 2.5 s): 26 bins of 0.2 s from -2.6 to 2.6 s whose edges fall on the cue; the code
    decodes the session in 0.2 s bins and interpolates at those times, here each bin is decoded directly.
    Windows take bins by centre as the code (calc_trial_by_trial_quant_data): (lo, hi] after the cue,
    [lo, hi) before it, so 0 to 1.5 s is the 8 bins centred 0.1 to 1.5 s. In round 1 the grid had one
    bin centred on the cue and counted after it; that grid is shown as a variant in the notebook.'
