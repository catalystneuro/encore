    only trial counts in one process; with one session per core on the machine''s 4 cores, at best 2.5
    h. Epoch times vary from run to run, so these figures change when the notebook is re-run. Both are over the notebook''s 60 min limit, so, as the protocol says for an estimate over that
    limit (Author, Develop on a subset), the claim is blocked as too_large and not run. No session was
    fitted; a subset of sessions would not test the claim, whose expected values are means over the 66
