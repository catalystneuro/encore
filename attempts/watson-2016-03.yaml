- claim: fig2c-acg-peaks
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_watson_2016.ipynb
  output: claim:fig2c-acg-peaks
  measured:
  - 9.5
  - 113.5
  notes: The mean normalized autocorrelogram of pE cells in nonREM peaks in the bin [9, 10) ms on both datasets, whose centre,
    9.5 ms, is outside 8 +- 0.8 ms; with bins centred on whole milliseconds the peak is at 10 ms on both. Only labelling
    the bin by its start (9 ms) puts it inside. The largest local maximum between 60 and 250 ms is at 113.5 ms in REM and
    134.5 ms in WAKE on both, within 125 +- 12.5 ms; with bins centred on whole ms it is at 114 ms in REM and 99 ms in WAKE
    on CRCNS (113 and 99 ms on DANDI). Taking the bin centre, the theta part holds and the nonREM part does not. Measured
    values are the CRCNS nonREM peak bin, by its centre, and the REM theta maximum (WAKE 134.5 ms).
  deviations:
  - The outcome is judged on CRCNS:fcx-1, which holds all 27 sessions, the lab's cell classification and its own state intervals
    and detections; the DANDI:000041 result is given in the notes. A choice of this attempt, the claims file sets no rule
    for two datasets.
  - On DANDI the paper's intervals are built from the Awake, Non-REM and REM epochs by the rules of Table S1 (packets are
    Non-REM epochs of 20 s or more, MAs Awake epochs under 40 s between Non-REM epochs, SLEEP 20+ min with no Awake epoch
    over 120 s, WAKE 7+ min); assumed that a WAKE ends where a SLEEP begins and that epochs less than 2 s apart are adjacent.
    CRCNS uses the deposited _WSRestrictedIntervals.
  - Assumed that a bin's lag is its centre, the usual reading of a histogram bin, so the [9, 10) ms bin is at 9.5 ms; the
    criterion's '7 to 9 ms in whole bins' does not say how a bin is named. Named by its start the nonREM peak (9 ms) is
    within tolerance and the claim would be reproduced; with bins centred on whole ms the peak is at 10 ms and the WAKE
    theta maximum at 99 ms, and it would not be reproduced. Asked of a reader (questions/watson-2016.yaml).
