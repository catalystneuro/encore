findings:
- kind: data_missing
  datasets:
  - '000041'
  statement: DANDI:000041 holds 22 of the paper's 27 sessions. The three sessions of rat B22 (CRCNS 20140526_277um,
    20140527_421um, 20140528_565um) and the ACC probes of Dino 061914 and 062014 (52 and 24 units) are not in it,
    so it holds 10 of 11 rats, 850 of 995 pE and 95 of 126 pI cells.
- kind: data_missing
  datasets:
  - '000041'
  statement: Dino-061914 in DANDI:000041 has no LFP; the release notes say the lab's source file does not divide
    into whole channels at 128. The CRCNS .eeg of both Dino 061914 folders divides into 142 channels, which the
    .xml gives and the stream's own autocorrelation confirms.
- kind: data_missing
  datasets:
  - '000041'
  statement: DANDI:000041 holds only Awake, Non-REM and REM epochs. The paper's analysis units (WAKE, SLEEP and
    WAKE-SLEEP cycles, packets, MAs, WAKE interruptions, nonREM and REM episodes), its UP/DOWN states and spindles,
    and the motion and EMG signals, all in CRCNS:fcx-1, are not in it. Built here from the epochs by Table S1's
    rules they differ from the lab's, 47 cycles against 51, one session without a cycle, 181 MAs in cycles against
    434, median packet 144 s against 111 s, median REM episode 64 s against 98 s.
- kind: metadata_error
  datasets:
  - '000041'
  statement: In 7 DANDI sessions whose spike trains are identical, train for train, to the CRCNS stable units, the
    cell_type labels differ from the lab's _CellIDs (EAll and IAll), for example BWRat20-101513 with 63 pE and 3
    pI against 60 and 6. The CRCNS labels give the paper's 995 and 126; the DANDI labels describe cells the paper
    classed otherwise.
- kind: metadata_insufficient
  datasets:
  - '000041'
  statement: The DANDI unit tables of Dino-072314 and Dino-072414 hold 10 and 15 units more than the CRCNS stable
    set (26 against 16, 61 against 46), Dino-061814 one more, and Dino-072114 16 units of which 13 match the 18
    CRCNS units. No column marks which units are the paper's stable units, so the paper's cell set cannot be selected
    from DANDI alone.
- kind: other
  about: data
  datasets:
  - crcns-fcx-1
  statement: The ACC and mPFC folders of Dino 061914 and of Dino 062014 each hold an .eeg of the same size (6219440250
    and 7938936000 bytes) with different good channels and no shared spike train, consistent with one recording
    of two probes deposited in both folders; the paper counts them as separate sessions (Table S1, 8 Dino sessions),
    and so does this attempt.
- kind: selection_undocumented
  about: paper
  statement: The paper reports 790 MAs (median 15.9 s, 0.32 per minute, 9.1% of SLEEP). The deposited _WSRestrictedIntervals
    hold 2130 MAs, 434 of them within the SLEEP of the 51 WAKE-SLEEP cycles or of any scored SLEEP (median 11.0
    s, 0.18 per minute, 3.7% of SLEEP). Which MAs the paper counted is not stated. Question for the paper's authors.
- kind: paper_inconsistency
  statement: Spindle incidence is 1.94 per minute in the Results and 0.049 Hz (2.94 per minute) in Table S1; the
    deposited spindles give 2.85 per minute of nonREM pooled and 2.95 as the median over sessions, which agrees
    with Table S1. The deposited spindles also match Table S1's count (5203), duration, frequency and amplitude.
- kind: paper_inconsistency
  statement: Table S1 gives a WAKE-SLEEP episode duration of 5918 +- 125 s; the deposited cycles give a median of
    4214 s, while every other duration in Table S1 (WAKE 1192, SLEEP 2421, nonREM episode 297, REM episode 98, REM
    latency 647 s) is matched exactly by the same intervals.
- kind: methods_unavailable
  statement: The UP/DOWN detection's LowGammaPower epochs are 'power in the 100 Hz+ range below 0.5 SD below the
    mean'. On the LFP's linear power that level is almost never reached (the 5th percentile is -0.40 SD in BWRat17-121912),
    so the band, smoothing and transform must differ from a plain reading. This attempt used log power of 100-400
    Hz, smoothed over 25 ms; with it the medians match (0.471 and 0.193 s) but the counts exceed Table S1 by 37%
    and 31%. Question for the paper's authors, the band, smoothing and scale of this rule.
- kind: methods_unavailable
  statement: The sampling unit of the correlations against normalized time (per packet, per 10 s bin, or bins averaged
    over episodes) is not stated, and outcomes depend on it, the CV over SLEEP decreases with p = 0.0022 per packet
    but p = 0.19 in 10 s bins on CRCNS, and spindle and UP/DOWN incidence trends differ between readings. Question
    for the paper's authors, which unit Figures 3 and 4 use.
