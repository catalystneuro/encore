    are Non-REM epochs of 20 s or more, MAs Awake epochs under 40 s between Non-REM epochs, SLEEP 20+ min with no
    Awake epoch over 120 s, WAKE 7+ min); assumed that a WAKE ends where a SLEEP begins and that epochs less than
    2 s apart are adjacent. CRCNS uses the deposited _WSRestrictedIntervals.
