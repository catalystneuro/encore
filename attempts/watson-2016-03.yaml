- claim: wake-sleep-cycles
  outcome: partially_reproduced
  notebook: reproduce_watson_2016.ipynb
  output: claim:wake-sleep-cycles
  measured:
  - 51
  - 1.89
  notes: CRCNS, reading a (deposited cycles), 51 cycles, 1.89 per session, every session has one; both within tolerance
    (54 +- 5.4, 2.0 +- 0.2). DANDI, reading b (cycles built from `sleep_states`), 47 cycles, 2.14 per session, and
    Dino-072114 has none, so the criterion fails there. On CRCNS, cycles built by the same rules from the deposited
    packets and REM give 47.
  deviations:
  - One outcome for both datasets, a choice of this attempt, reproduced when the criterion holds on CRCNS:fcx-1
    and DANDI:000041, partially reproduced when it holds on one or in part, not reproduced when it fails on both.
