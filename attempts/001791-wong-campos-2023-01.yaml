- claim: fig4bc-doublet-first-fails
  outcome: reproduced
  assumed: true
  notebook: reproduce_wong_campos_2023.ipynb
  output: claim:fig4bc-doublet-first-fails
  notes: With K = 4 the second bAP exceeds the first in 97% (isolated doublets) or 100% (any doublet)
    of 31 branches, median ratios 1.34 to 1.48, in both windows, and in both branches with an STA
    delay above 3 ms (ratios 1.58 to 1.71). The deposited spike times give 97% to 100% and 1.37 to
    1.59. With K = 5 isolated doublets pass (81% and 77%) and any doublet gives 68% in both windows,
    below the 70% bound. Measured from its own baseline the second bAP is smaller, median ratios
    1.07 to 1.15 with K = 4 (84% to 90% of branches), so part of the effect in the criterion's
    measure is the first bAP's tail. The second bAP is larger but the first is not absent. Question
    for the paper's authors, what threshold detected spikes?
  deviations:
  - Assumed the 4 robust s.d. detection threshold where the two readings disagree, because it
    recovers more of the spike times deposited with these recordings (mean recall 0.72 against
    0.41, precision 0.95 against 0.98).
  - Amplitudes are measured per doublet and averaged per branch, not read off an average waveform,
    since the second spike's time varies between doublets.
  - Branches are the 31 dendrite columns of 11 recordings, not the paper's 10 branches; the file
    does not say which columns are the same branch.
- claim: fig4d-accelerating-amplifies
  outcome: reproduced
  assumed: true
  notebook: reproduce_wong_campos_2023.ipynb
  output: claim:fig4d-accelerating-amplifies
  notes: With K = 4 (144 accelerating and 140 decelerating trios), the third bAP exceeds the second
    in accelerating trios (median +0.140, p = 8.5e-16) and falls below it in decelerating ones
    (-0.124, p = 7e-12); reading (b) gives +0.277 (p = 0.0062, 31 branches); reading (c) 1.083 and
    0.953 (p < 1.2e-05); both windows pass. The deposited spike times (238 accelerating trios, the
    dandiset's own count, against the paper's 186) and the deposited amplitudes pass every reading.
    With K = 5 (44 and 43 trios) the accelerating effect holds (p = 8.8e-05) and the decelerating one
    does not reach p < 0.05 (-0.043, p = 0.097; reading (c) 1.027). By mouse (K = 4) accelerating
    trios are amplified in all five mice and decelerating ones lower in four.
  deviations:
  - Assumed the 4 robust s.d. threshold, as for fig4bc-doublet-first-fails.
  - Each spike's bAP amplitude is measured from the 5 ms before that spike, in the criterion's
    windows, and normalized by the branch mean (Methods, Analysis of bAP failures during spontaneous
    activity).
  - 31 dendrite columns of 5 mice, not the paper's 10 branches of 3 neurons.
