findings:
- kind: data_missing
  statement: The dandiset holds the pipeline's per-branch traces and summary tables, not the imaging movies,
    so the background-robust dF/F and the shot-noise bound (Fig. S9) cannot be computed. It holds no recordings
    of dendrite-targeted stimulation (Figs. 3e-i, S11), no single-trial traces or baseline noise of the
    Fig. 2 mapping recordings (the Fig. 2h and 2i/2j files hold normalized amplitudes pooled over sites
    without site labels), no record of the Fig. 1 light pulses, and no morphology reconstructions (only
    HiLo z-stacks). Four claims are blocked for this.
- kind: other
  statement: Every one of the 44 assets is one of 22 pairs of byte-identical files (same SHA-256), deposited
    once under a figure name at the top level and once under a sub- folder. The figure3e file is also
    a third copy of recording 3 of the figure3i file.
- kind: paper_inconsistency
  statement: The files follow a later version of the paper than the one the dandiset names. They name
    panels the preprint does not have (Figs. 2h and 2i/2j) and count 12 neurons for Fig. 2, 7 for Fig.
    3d and 238 triplets in 5 neurons for Fig. 4d, where the preprint has 5, 3 and 186 in 3. No identifier
    marks the preprint's subsets.
- kind: metadata_error
  statement: In figure2g_bAP_propagation_delay.nwb the delay series are named LR_amplitude_vs_distance
    and ST_amplitude_vs_distance with the unit -dF/F, and branch_order_vs_amplitude holds delays; the
    values (-0.20 to 4.17) are delays in ms. Its all_amplitude_vs_distance series holds the 53 amplitudes
    of the amplitude file followed by 17 more rows repeated three times (104 rows).
- kind: format_error
  statement: The deposited Fig. 3d table (figure3d_voltage_correlation.nwb) holds 30 correlation values
    above 1 (up to 1.24), which a correlation cannot take.
- kind: metadata_error
  statement: Both files of the Fig. 3 neuron (barrel1_20220711) have the session description "Simultaneous
    voltage imaging ... in awake mouse", including the one named anesthetized at 1% isoflurane. The archive
    counts 19 subjects, which include pooled pseudo-subjects and one neuron under two spellings (Barrel500-2
    and barrel500_2).
- kind: metadata_insufficient
  statement: The figure3i recordings say "Column 1 = soma (if present)" without saying where a soma is
    present (in the anesthetized recordings column 1 has 0 to 3 events at 5 s.d. and does not lead the
    other columns), and the Fig. 4a-d file has 31 dendrite columns while its own tables list 19 dendrite
    distances and 19 STA dendrites, so which columns are the same branch is not stated. No file names
    the neuron each Fig. 2 site belongs to.
- kind: metadata_error
  statement: The Fig. 4a-d file notes say spike times are in frame indices; they are in seconds, and each
    sits one frame (2 ms) after the soma's peak in all 11 recordings. Its per-recording accelerating and
    decelerating tables repeat one value in every column (soma and dendrites), and its pooled summary
    tables have 6 rows for a stated 238 triplets.
- kind: format_error
  statement: The deposited spike times of recordings 2 and 3 of the Fig. 4i-l file are not sorted.
- kind: methods_unavailable
  statement: The paper gives no spike detection method and no definition of a doublet; these decide the
    doublet ISIs (Fig. 4a), and the thresholds of 5 and 4 robust s.d. disagree on Figs. 4b-d. The authors
    could say how spikes were detected and doublets defined.
- kind: methods_unavailable
  statement: The paper does not say which sites make its Fig. 2 n = 30, what curve gives the 50% distance,
    how peaks were timed below one frame, which branch pairs make the 23 pairs of Fig. 3d, or how the
    plateau duration of Fig. 4l was measured, or how the conduction delays that split distal dendrites
    at 3 ms (Methods, Fig. S13) were measured. The outcomes of fig2e, fig2f, fig1fg and fig3d rest on choices
    made here; the authors could confirm or correct them.
- kind: other
  statement: By the deposited delays no dendrite of the Fig. 4e-h recordings has the conduction delay
    above 3 ms that the Methods use to define distal dendrites (46 dendrites, at most 2.26 ms), nor by
    the STA (at most 1.95 ms), and no Fig. 4i-l dendrite does by its STA (at most 1.48 ms), so the distal
    analyses of Figs. 4e-h and S13 cannot be selected as the paper describes. The deposited Fig. 2 delays
    run about 1.9 ms below the paper's stated range, which suggests the deposited delays are measured
    differently from the paper's.
- kind: other
  statement: Recordings 14 and 15 of the Fig. 4e-h file are sampled at 1,000 Hz (stated in their rate
    and descriptions) and the other 15 at 500 Hz. Their stimulus of 259 frames lasts 259 ms against 518
    ms in the others, so only 200 to 259 ms of the 200 to 400 ms window the Methods use to normalize bAP
    amplitudes falls inside it, and neither length is the paper's 400 ms.
