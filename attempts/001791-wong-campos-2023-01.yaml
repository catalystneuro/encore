- claim: fig2f-conduction-speed
  outcome: reproduced
  assumed: true
  notebook: reproduce_wong_campos_2023.ipynb
  output: claim:fig2f-conduction-speed
  measured:
  - 0.088
  - 0.462
  notes: On the 32 LR sites beyond 50 μm the pooled linear fit gives 0.088 m/s (bootstrap 95%
