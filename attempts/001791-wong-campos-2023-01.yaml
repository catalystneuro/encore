- claim: fig3d-dendrite-cross-correlation
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_wong_campos_2023.ipynb
  output: claim:fig3d-dendrite-cross-correlation
  measured:
  - 0.903
  - 0.732
  notes: For the Fig. 3 neuron (10 pairs of five dendrites) the mean zero-lag correlation is 0.903 ± 0.013
    anesthetized and 0.732 ± 0.034 awake (peak within 10 ms 0.904 and 0.735; with spikes removed the same,
    as the neuron's files have no soma column); both are within tolerance under every measure and anesthetized
    exceeds awake. Over the three neurons recorded in both states, the paper's count, the means are 0.863
    (14 pairs) and 0.803 (21 pairs) with column 1 as soma, or 0.821 and 0.808 with it as a dendrite; anesthetized
    still exceeds awake but neither mean is within tolerance. Over every recording, 0.750 anesthetized
    and 0.804 awake. The deposited Fig. 3d table (peak within 2 s, 7 neurons) gives 0.792 and 0.583. Question
    for the paper's authors, which recordings and branch pairs make the 23 pairs of Fig. 3d? P1 is one
    of the paper's three neurons, so the match there covers only part of the claim. P2 takes the two other
    neurons from the mouse names of the figure3i recordings, and the column 1 check does not show that
    column 1 of their anesthetized recordings is a soma (0 to 3 events at 5 s.d. per anesthetized recording),
