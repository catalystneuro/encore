- claim: fig4ijk-sensory-first-fails
  outcome: partially_reproduced
  notebook: reproduce_wong_campos_2023.ipynb
  output: claim:fig4ijk-sensory-first-fails
  notes: The 13 air-puff trials match the paper's n = 13. No dendrite has a delay above 3 ms (0.34 to
    1.48 ms), so the distal reading is empty and the claim is tested on all dendrites. The first bAP of
    the burst is smaller than the later ones on average (4.32 against 6.31 with K = 5, 3.92 against 6.85
    with K = 4) and in 18 of 20 or 20 of 22 trial and dendrite pairs; per dendrite in 8 and 10 of 13 trials
    (K = 5) and 9 and 11 (K = 4); 3 (K = 5) and 2 (K = 4) trials have fewer than two somatic spikes. Not
    every dendritic spike follows a somatic spike, 5 of 40 (K = 5) and 8 or 9 of 76 (K = 4) have none
    in the bAP window before them. The same holds with bursts of 200 or 500 ms. None of the 14 dendritic
    spikes without a somatic spike (both thresholds) has a somatic spike within 1 frame after it; the
    nearest somatic spike is 3 to 119 frames away, and around 13 of the 14 the soma reaches 0.54 to 1.00
    of its threshold, so they are not frame-rounding artifacts but dendritic events whose somatic event
    is below or near the detection threshold.
  deviations:
  - The burst is taken as the somatic spikes in the 300 ms after puff onset, a window the paper does not
    give; 200 and 500 ms are shown.
- claim: fig4l-sensory-plateau
  outcome: not_reproduced
  notebook: reproduce_wong_campos_2023.ipynb
  output: claim:fig4l-sensory-plateau
  measured: 264
  notes: The average of the two dendrites reaches half its 50 to 150 ms plateau 46 ms after the puff and
    stays above it until 310 ms, a full width at half plateau of 264 ms (236 to 270 ms over dendrites
    and smoothing), outside 360 to 440 ms. It then stays above the 1 s.d. baseline band (mean -0.85, s.d.
    0.30) for the 2 s after onset, so reading (a) has no return time. The depolarization outlasts the
    100 ms stimulus under both readings. Question for the paper's authors, how was the duration of the
    plateau measured?
  deviations:
  - The average is smoothed over 10 ms and must stay within the band for 50 ms to count as returned; standard
    choices, shown with no smoothing and 20 ms.
  - The traces are the deposited Delta F, not dF/F.
