- claim: fig1d-light-intensity-spike-rate
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_wong_campos_2023.ipynb
  output: claim:fig1d-light-intensity-spike-rate
  notes: The Fig. 1 file has no record of the light pulses. Nine 0.5 s depolarizing steps recur
    every 1 s from 0.52 s, and their on-off contrast grows from 0.49 to 2.32 z. Somatic spikes per
    pulse rise with pulse order under both readings; with K = 5, 0 in the first pulse and 1 in the
    last (Spearman rho 0.56, p = 0.11; means of 1.00 in the first three pulses and 4.33 in the last
    three); with K = 4, 0 and 8 (rho 0.86, p = 0.003). Dendrites 1 to 3 show an event within 5 ms
    after 72% to 100% of somatic spikes, dendrite 4 after only 14% (K = 5) or 33% (K = 4). The rate
    part holds and the bAP part holds in three of four dendrites. Question for the paper's authors,
    when were the light pulses given and at what intensities? The file records neither.
  deviations:
  - The pulse windows are inferred from the light-evoked depolarization of the traces, as a 1 s
    period square wave with the paper's 0.5 s pulses (Results, Dendritic voltage mapping, "0.5 s
    pulses of widefield blue light at increasing intensity"); the period is read from the trace.
    This is an assumption, as the file records no stimulus.
  - The traces are the deposited z-scored PCA traces, not dF/F.
  - Spike and dendritic event detection use a 10 Hz high-pass filter and a 4 ms minimum separation,
    standard choices the paper does not give.
- claim: fig1fg-dendrite-peaks-after-soma
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_wong_campos_2023.ipynb
  output: claim:fig1fg-dendrite-peaks-after-soma
  notes: Timed by the sample of the maximum, all four dendritic STAs peak in the same frame as the
    soma (delay 0.0 ms, both K), so no delay is positive. Timed by a parabola through the maximum,
    three of four dendrites peak after the soma (0.03 to 0.66 ms) and dendrite 4 before it (-0.27
    to -0.28 ms); bootstrap intervals are above 0 for dendrites 2 and 3 only. The delays are far
    below the 1.5 to 4 ms of Fig. 2. Question for the paper's authors, how were STA peaks timed
    below one frame at 500 Hz?
  deviations:
  - Assumed sub-frame peak timing by a parabola (reading (b) of fig2f-delay-range), since the
    dandiset's own Fig. 2 delays are given to 0.01 ms at 2 ms frames; under the sample reading no
    dendrite qualifies.
