  - 3.92
  notes: Of the 32 LR sites between 50 and 280 μm, 23 have delays below 1.35 ms; delays there range from
    0.00 to 3.92 ms (median 0.96). Over all 61 sites in that range, 48 are below 1.35 ms (0.00 to 4.13
