- claim: fig2e-half-amplitude-distance
  outcome: reproduced
  assumed: true
  notebook: reproduce_wong_campos_2023.ipynb
  output: claim:fig2e-half-amplitude-distance
  measured:
  - 238.9
  - 0.491
  notes: On the 30 LR sites the linear fit of amplitude on contour distance falls to half its value at
    0 at 238.9 μm (bootstrap 95% interval 203 to 318) with R2 = 0.491, both within tolerance. The exponential
    reading gives 203.6 μm (R2 0.514), outside. On the other site sets the linear distance is within tolerance
    and R2 is not; all 53 sites of the amplitude file 226.4 μm and R2 0.631, 70 sites 216.2 μm and 0.558,
    ST alone 230.9 μm and 0.682. Reading (c) could not be run, as the somatic amplitudes are not deposited.
    Question for the paper's authors, were the preprint's 30 sites those of the Lucy-Rho (LR) construct,
    and was the 50% distance taken from a linear fit?
  deviations:
  - The amplitudes are the deposited per-site values (peak -dF/F of the STA), not recomputed from traces,
    which are not in the dandiset.
  - Assumed that the preprint's 30 sites are the 30 LR sites of the dandiset's 12-neuron table; the preprint
    describes only the Lucy-Rho CheRiff construct (Fig. 1a) and gives n = 30, which equals the LR count.
    No neuron identifiers allow selecting the paper's 5 neurons.
