- claim: fig4a-doublet-isi
  outcome: not_reproduced
  notebook: reproduce_wong_campos_2023.ipynb
  output: claim:fig4a-doublet-isi
  measured:
  - 36.6
  - 20.4
  - 36
  notes: Isolated doublets number 36 with K = 5 (36.6 ± 20.4 ms, given as measured), 107 with
    K = 4 (28.1 ± 15.6 ms) and 144 with the deposited spike times (25.2 ± 13.7 ms); with reading
    (b), 55, 210 and 427 (38.6 ± 20.8, 30.5 ± 17.3 and 25.9 ± 15.5 ms). Only K = 4, reading (b),
    gives a count within tolerance, with ISIs far from 18 ± 7 ms. The closest mouse is mouse 5 with
    the deposited times, reading (b), 18.5 ± 12.8 ms over 109 doublets, whose s.d. is outside
    tolerance. The dandiset has 11 recordings of 5 mice where the paper has 3 neurons. Question for
    the paper's authors, how were spikes detected and doublets defined?
  deviations:
  - The recordings are the 11 of the dandiset's Fig. 4a-d file (5 mice), which follows a later
    version of the paper; the paper's 3 neurons cannot be identified.
  - Spike detection by the claims' readings (5 and 4 robust s.d. of the 10 Hz high-pass soma
