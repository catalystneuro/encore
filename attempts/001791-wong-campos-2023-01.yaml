- claim: fig4bc-doublet-first-fails
  outcome: partially_reproduced
  notebook: reproduce_wong_campos_2023.ipynb
  output: claim:fig4bc-doublet-first-fails
  notes: The criterion asks for every reading. With K = 4 and with the deposited spike times every reading
    passes; the second bAP exceeds the first in 97% (isolated doublets) or 100% (any doublet) of 31 branches,
    median ratios 1.34 to 1.59, in both windows. With K = 5 isolated doublets pass (81% and 77%) and any
    doublet gives 68% in both windows, below the 70% bound, so one reading fails. The distal reading (STA
    delay above 3 ms) rests on 2 branches (3.58 and 3.26 ms) and passes under every reading (ratios 1.58
    to 1.95). Measured from its own baseline the second bAP is smaller, median ratios 1.07 to 1.15 with
    K = 4 (84% to 90% of branches), so part of the effect in the criterion's measure is the first bAP's
    tail. The second bAP is larger but the first is not absent. Question for the paper's authors, what
    threshold detected spikes?
  deviations:
  - Both detection thresholds of the criterion (5 and 4 robust s.d.) decide, as the criterion asks for
    every reading; 4 s.d. recovers more of the spike times deposited with these recordings (mean recall
    0.72 against 0.41, precision 0.95 against 0.98).
  - Amplitudes are measured per doublet and averaged per branch, not read off an average waveform, since
    the second spike's time varies between doublets.
  - Branches are the 31 dendrite columns of 11 recordings, not the paper's 10 branches; the file does
    not say which columns are the same branch.
- claim: fig4d-accelerating-amplifies
  outcome: partially_reproduced
  notebook: reproduce_wong_campos_2023.ipynb
  output: claim:fig4d-accelerating-amplifies
  notes: The criterion asks for every reading. With K = 4 (144 accelerating and 140 decelerating trios),
    the third bAP exceeds the second in accelerating trios (median +0.140, p = 8.5e-16) and falls below
    it in decelerating ones (-0.124, p = 7e-12); reading (b) gives +0.277 (p = 0.0062, 31 branches); reading
    (c) 1.083 and 0.953 (p < 1.2e-05); both windows pass. The deposited spike times (238 accelerating
    trios, the dandiset's own count) and the deposited amplitudes pass every reading. With K = 5 (44 and
    43 trios) the accelerating effect holds (p = 8.8e-05) and reading (b) passes, but the decelerating
    one does not reach p < 0.05 ((a) -0.043, p = 0.097; (c) 1.027 and 1.007, above 1), so readings (a)
    and (c) fail. Trios found number 87 (K = 5), 284 (K = 4) and 473 (deposited times) against the paper's
    186. Tested per branch over the 31 branches, reading (a) gives the same split (K = 5 decelerating
    p = 0.22 and 0.25). With the second and third bAPs measured from the 5 ms before the first spike of
    the trio, reading (a) still passes with K = 4 and the deposited times, but (b) and (c) fail with K
    = 4 (b, p = 0.05 and 0.053; c, decelerating 0.966 and 0.978, p = 0.24 and 0.37). By mouse (K = 4)
    accelerating trios are amplified in all five mice and decelerating ones lower in four.
  deviations:
  - Both detection thresholds of the criterion decide, as for fig4bc-doublet-first-fails.
  - Each spike's bAP amplitude is measured from the 5 ms before that spike, in the criterion's windows,
    and normalized by the branch mean (Methods, Analysis of bAP failures during spontaneous activity).
    The criterion gives the window of fig4bc and not its baseline; the fig4bc baseline (before the first
    spike of the trio) is shown as a variant.
  - 31 dendrite columns of 5 mice, not the paper's 10 branches of 3 neurons.
