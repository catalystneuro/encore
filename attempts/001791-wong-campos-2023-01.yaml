- claim: fig4ijk-sensory-first-fails
  outcome: partially_reproduced
  notebook: reproduce_wong_campos_2023.ipynb
  output: claim:fig4ijk-sensory-first-fails
  notes: The 13 air-puff trials match the paper's n = 13. No dendrite has a delay above 3 ms (0.34
    to 1.48 ms), so the distal reading is empty and the claim is tested on all dendrites. The first
    bAP of the burst is smaller than the later ones on average (4.32 against 6.31 with K = 5, 3.92
    against 6.85 with K = 4) and in 18 of 20 or 20 of 22 trial and dendrite pairs; per dendrite in
    8 and 10 of 13 trials (K = 5) and 9 and 11 (K = 4); 3 (K = 5) and 2 (K = 4) trials have fewer
    than two somatic spikes. Not every dendritic spike follows a somatic spike, 5 of 40 (K = 5) and
    8 or 9 of 76 (K = 4) have none in the bAP window before them. The same holds with bursts of
    200 or 500 ms.
  deviations:
  - The burst is taken as the somatic spikes in the 300 ms after puff onset, a window the paper
    does not give; 200 and 500 ms are shown.
- claim: fig4l-sensory-plateau
  outcome: not_reproduced
  notebook: reproduce_wong_campos_2023.ipynb
  output: claim:fig4l-sensory-plateau
  measured: 264
  notes: The average of the two dendrites reaches half its 50 to 150 ms plateau 46 ms after the puff
    and stays above it until 310 ms, a full width at half plateau of 264 ms (236 to 270 ms over
    dendrites and smoothing), outside 360 to 440 ms. It then stays above the 1 s.d. baseline band
    (mean -0.85, s.d. 0.30) for the 2 s after onset, so reading (a) has no return time. The
    depolarization outlasts the 100 ms stimulus under both readings. Question for the paper's
    authors, how was the duration of the plateau measured?
  deviations:
  - The average is smoothed over 10 ms and must stay within the band for 50 ms to count as
    returned; standard choices, shown with no smoothing and 20 ms.
  - The traces are the deposited Delta F, not dF/F.
- claim: figs12-spontaneous-failures-both-states
  outcome: reproduced
  notebook: reproduce_wong_campos_2023.ipynb
  output: claim:figs12-spontaneous-failures-both-states
  notes: Failures occur in both states under every reading; anesthetized, 10 of 26 spike and
    dendrite pairs in 3 recordings (K = 5) and 30 of 77 in 4 (K = 4); awake, 22 of 1187 in 7
    recordings (K = 5) and 83 to 88 of 2469 in 15 (K = 4). A variant against the 95th percentile of
    the measure at spike-free times gives 46% to 55% anesthetized and 4% to 8% awake. The
    anesthetized somatic spikes are few (26 at K = 5 over 6 recordings).
  deviations:
  - Column 1 of the figure3i recordings is taken as the soma, which the file leaves open ("soma (if
    present)"); the Fig. 4a-d recordings are counted as awake, as the Results record them.
  - The noise is the robust s.d. of the 10 Hz high-pass dendritic trace and the amplitude is
    measured on the same trace; the claims' rule does not say on which trace.
findings:
- kind: data_missing
  statement: The dandiset holds the pipeline's per-branch traces and summary tables, not the imaging
    movies, so the background-robust dF/F and the shot-noise bound (Fig. S9) cannot be computed. It
    holds no recordings of dendrite-targeted stimulation (Figs. 3e-i, S11), no traces of the Fig. 2
    mapping recordings, no record of the Fig. 1 light pulses, and no morphology reconstructions
    (only HiLo z-stacks). Four claims are blocked for this.
- kind: other
  statement: Every one of the 44 assets is one of 22 pairs of byte-identical files (same SHA-256),
    deposited once under a figure name at the top level and once under a sub- folder. The figure3e
    file is also a third copy of recording 3 of the figure3i file.
- kind: paper_inconsistency
  statement: The files follow a later version of the paper than the one the dandiset names. They name
    panels the preprint does not have (Figs. 2h and 2i/2j) and count 12 neurons for Fig. 2, 7 for
    Fig. 3d and 238 triplets in 5 neurons for Fig. 4d, where the preprint has 5, 3 and 186 in 3. No
    identifier marks the preprint's subsets.
- kind: metadata_error
  statement: In figure2g_bAP_propagation_delay.nwb the delay series are named LR_amplitude_vs_distance
    and ST_amplitude_vs_distance with the unit -dF/F, and branch_order_vs_amplitude holds delays; the
    values (-0.20 to 4.17) are delays in ms. Its all_amplitude_vs_distance series holds the 53
    amplitudes of the amplitude file followed by 17 more rows repeated three times (104 rows).
- kind: format_error
  statement: The deposited Fig. 3d table (figure3d_voltage_correlation.nwb) holds 30 correlation
    values above 1 (up to 1.24), which a correlation cannot take.
- kind: metadata_error
  statement: Both files of the Fig. 3 neuron (barrel1_20220711) have the session description
    "Simultaneous voltage imaging ... in awake mouse", including the one named anesthetized at 1%
    isoflurane. The archive counts 19 subjects, which include pooled pseudo-subjects and one neuron
    under two spellings (Barrel500-2 and barrel500_2).
- kind: metadata_insufficient
  statement: The figure3i recordings say "Column 1 = soma (if present)" without saying where a soma
    is present, and the Fig. 4a-d file has 31 dendrite columns while its own tables list 19 dendrite
    distances and 19 STA dendrites, so which columns are the same branch is not stated. No file names
    the neuron each Fig. 2 site belongs to.
- kind: metadata_error
  statement: The Fig. 4a-d file notes say spike times are in frame indices; they are in seconds, and
    each sits one frame (2 ms) after the soma's peak in all 11 recordings. Its per-recording
    accelerating and decelerating tables repeat one value in every column (soma and dendrites), and
    its pooled summary tables have 6 rows for a stated 238 triplets.
- kind: metadata_error
  statement: In the Fig. 4e-h file, recordings 14 and 15 list stimulus onsets 0.5 s apart for a stated
    stimulus length of 259 frames (518 ms), while the traces step every second.
- kind: format_error
  statement: The deposited spike times of recordings 2 and 3 of the Fig. 4i-l file are not sorted.
- kind: methods_unavailable
  statement: The paper gives no spike detection method and no definition of a doublet; these decide
    the doublet ISIs (Fig. 4a), and the thresholds of 5 and 4 robust s.d. disagree on Figs. 4b-d. The
    authors could say how spikes were detected and doublets defined.
- kind: methods_unavailable
  statement: The paper does not say which sites make its Fig. 2 n = 30, what curve gives the 50%
    distance, how peaks were timed below one frame, which branch pairs make the 23 pairs of Fig. 3d,
    or how the plateau duration of Fig. 4l was measured. The outcomes of fig2e, fig2f, fig1fg and
    fig3d rest on choices made here; the authors could confirm or correct them.
- kind: other
  statement: By the deposited delays no dendrite of the Fig. 4e-h recordings has the conduction delay
    above 3 ms that the Methods use to define distal dendrites (46 dendrites, at most 2.26 ms), and no
    Fig. 4i-l dendrite does by its STA (at most 1.48 ms), so the distal analyses of Figs. 4e-h and
    S13 cannot be selected as the paper describes.
