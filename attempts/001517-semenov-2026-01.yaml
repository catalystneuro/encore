inputs:
- what: The charging time constant of Eq. (1), tau = 44.5 ns per um of cell radius (the linear fit through the origin
    of Fig. 5C), and the background method for the strobe images (ROIs near the poles outside the cell, section 2.4),
    from reference [20] of the paper, Semenov et al. 2025, Bioelectrochemistry 168, 109143 (PMC12553484).
  source: doi:10.1016/j.bioelechem.2025.109143
outcomes:
- claim: fig1-pole-dimming
  outcome: reproduced
  notebook: reproduce_semenov_2026.ipynb
  output: claim:fig1-pole-dimming
  notes: Under every background reading the cathodic pole is lower at 780 than at 570 V/cm (far 38.6 against 41.7%; near
    65.0 against 67.9; none 15.2 against 16.0), and at 1400 V/cm the largest mean dF of the cathode-facing hemisphere
    lies 65 degrees from the pole (far 21.7% at -65 degrees against 7.5% at the pole; near and none also at -65). Both
    conditions hold at every band of the background sweep and with the local backgrounds. In each of the 8 cells the
    1400 V/cm maximum lies 43 to 76 degrees from the pole. Five-cell subsets passing 56 of 56 (far), 45 (near), 51 (none).
    The Fig. 1 cell is not identified; the test uses the Fig. 4B cells as the criterion says.
  deviations:
  - 'Field strengths are matched in order to the generator volts the files give (25 V as 43 V/cm, 50 as 150, 70 as 230,
    100 as 360, 150 as 570, 200 as 780, 250 as 1000, 300 as 1200, 350 as 1400), an assumption. The paper names nine field
    strengths for its 1-us escalations and the files nine amplitudes, but the two are not proportional, and below electroporation
    the data fit a proportional response about as well on the volts as on the paper''s V/cm. The first step supports
    the matching: from 25 to 50 V the mean pole |dF| triples (FluoVolt 3.05, Di-8-ANEPPS 2.90), against 3.49 for the
    paper''s 43 to 150 V/cm and 2.00 for proportional volts. A variant with the field proportional to the volts (4 V/cm
    per V) is shown for every claim that uses the field strength as a number.'
  - Background is subtracted from ROIs 30 to 36 pixels (8 to 10 um) outside the membrane, 20 degrees wide, near each
    pole (the far reading), an assumption. The paper does not state a background method for the laser images; its Methods
    follow reference [20] ('Most methods were identical to those described in detail recently [20]'), which places background
    ROIs 'near the poles outside of the cell' with no distance. The data check shows the membrane's glow is still a third
    of its excess 2 um out and a few percent 8 um out. The near (2 to 4 um) and no-background readings are shown and
    change dF by up to a factor of three. After verification round 1 every claim also shows a sweep of 6-pixel bands
    from 8 to 44 pixels out and a per-pole (local) background.
  - The perimeter trace (6 pixels wide, Methods 2.3) is found automatically as the peak of intensity on 360 rays of each
    set's baseline image, with polar angles from the cell centre; the paper drew it by hand in MetaMorph and resampled
    by perimeter length. Sets whose outline radius departs from the cell's median by more than 15% are traced again within
    8 pixels of the cell's median centre and 4 pixels of its median radius; this re-traced FluoVolt c2 at 300 V (outline
    on a neighbouring cell) and Di-8-ANEPPS c7 at 300 and 350 V (outline on a body inside the cell), found in the outline
    overlays added after verification round 1.
  - Frames without a laser flash, which the files do not flag (frame 0 of 137 of 141 sets and 290 others), are left out
    of every average; the paper does not mention them. Keeping them is shown as a variant.
  - The field direction is not stored. The cathode-facing pole is placed where dF is positive (Methods 2.3, emission
    increased in the cathode-facing hemisphere), on one axis for all sets estimated from the 50 to 100 V sets (per-set
    median deviation 1.6 degrees).
  - All eight Di-8-ANEPPS escalation cells (c7 to c14) are used where the paper reports n = 5 without naming them; the
    criterion is also run on each of the 56 five-cell subsets.
  - Di-8-ANEPPS c13 has two 150 V sets; the first, in escalation order, is used.
  assumed: true
