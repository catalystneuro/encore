  statement: The dandiset holds only the 1-us escalation strobe images (6 FluoVolt and 13 Di-8-ANEPPS cells). The alternating
    150/230 V/cm sets of Fig. 2C/D, the 0.3-us pulses of Fig. 4D, the Gd3+ cells and controls of Fig. 5A, the Ca2+ imaging
    of Fig. 6 and the two-pulse experiments of Fig. 7 are not in it; 15 of the paper's 31 claims cannot be tested.
- kind: metadata_insufficient
  statement: The pulse amplitude is given only as generator volts inside a free-text session description (25 to 350 V).
    The paper reports field strengths in V/cm from Sim4Life modelling (43 to 1400 V/cm), which are not proportional to
    the volts, and no file or dandiset field gives the conversion; the nine steps had to be matched in order.
- kind: metadata_insufficient
  statement: 'The files hold raw images only: each holds one ImageSeries with the frames, their rate and a general description,
    and no ImagingPlane, Device, field of view or grid spacing. The pixel size, the field direction, the cell outline
    or ROIs, and which frames are baseline and which carry the pulse are not stored; the 40/60 split is stated in the
    paper and is consistent with the data.'
- kind: metadata_error
  statement: Every session description gives an electrode distance of 1.00 mm; the paper (Methods 2.2) and its reference
    [20] give 1.6 mm.
- kind: metadata_error
  statement: The dandiset description says Di-8-ANEPPS was used, replacing FluoVolt, but 68 of the 220 sets (6 cells)
    are stated in their session descriptions to be FluoVolt.
- kind: other
  statement: Frame 0 of 137 of 141 sets examined and 290 further frames hold no laser flash (frame mean near the camera
    floor) and are not flagged. Apart from frame 0 they are five times as frequent among pulse frames (257 of 8460) as
    among baseline frames (33 of 5499). Averaging them in changes dF by several percent (the Di-8-ANEPPS 43 V/cm offset
    goes from -5.1 to -2.2%).
- kind: selection_undocumented
  statement: The dandiset has eight Di-8-ANEPPS cells with the nine-step escalation where Fig. 2B and 4B report n = 5,
    five FluoVolt cells with it (one with an extra 350 V set first) and a sixth with a finer escalation where Fig. 2A
    and 4A report n = 4, and five Di-8-ANEPPS cells recorded on 2025-01-22 with other steps that the paper does not describe.
    Which cells the paper used is not stated.
- kind: methods_unavailable
  statement: Question for the authors. Where were the background ROIs of the strobe images placed, and how far from the
    membrane? Reference [20] says near the poles outside the cell. Here a background 2 to 4 um out, 8 to 10 um out, or
    none changes the pole dF by up to a factor of three (FluoVolt cathodic at 360 V/cm 78.5, 49.4 and 23.7%), and the
    8 to 10 um reading was assumed. A sweep of 6-pixel bands from 8 to 44 pixels out shows the band 14 to 20 pixels (4
    to 5 um) out would bring the FluoVolt saturation values, both Fig. 3 slopes and the first-10 Di-8-ANEPPS maximum
    within the paper's values.
- kind: methods_unavailable
  statement: Question for the authors. What is the pixel size of the images, and how was the cell radius measured? With
    16-um camera pixels behind the 60x objective (0.267 um) the cells have mean radii of 7.8 to 15.1 um, larger than the 8
    um the paper gives as typical, and the dye slopes of Fig. 3 come out 21.6 and 7.4% per 100 mV; with 0.192 um (radius
    8 um) they come out 26.6 and 9.5, as in the paper.
- kind: methods_unavailable
  statement: Question for the authors. Which generator amplitude in the files corresponds to each field strength of the
    paper (is 25 V the 43 V/cm set, and so on), and which cells form the n = 4 FluoVolt and n = 5 Di-8-ANEPPS groups
    of Fig. 2 and 4? Both were assumed here (amplitudes matched in order; four FluoVolt cells with exactly nine sets;
    all eight Di-8-ANEPPS cells, with the 56 five-cell subsets shown).
- kind: paper_inconsistency
  statement: Results 3.5 says a 10-fold rise of the effective membrane conductivity reduces IMP by about 2%; Eq. (2)
