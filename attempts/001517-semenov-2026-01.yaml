  notes: Claim of absence, 2-tailed paired t-test over 4 cells, 24 tests per reading (6 pulse comparisons at 1000 to
    1400 V/cm and 18 baselines). Far background, reading (a) first and last image, 1 pulse set (1400 V/cm anodic, -3.2%
    dF, p = 0.043) and 1 baseline (1000 V/cm anodic, -7.0%, p = 0.005) change; reading (b) first and last 10 images,
    2 pulse sets (1200 V/cm cathodic +5.5%, p = 0.049; 1400 V/cm anodic +2.5%, p = 0.037) and 3 baselines (150 V/cm cathodic
    -3.9%, 360 V/cm anodic +3.7% and cathodic -4.2%, p 0.000 to 0.008). Both readings find changes, so not reproduced.
    Without background both readings also find changes; with the near background reading (a) finds none and (b) three,
    so under that background the claim would be blocked as methods_underspecified. In the sweep reading (b) finds 3 to
    6 changes at every distance. With 24 tests about 1.2 are expected below p = 0.05 by chance, and at least one in about
    70% of stable recordings; the changes are a few percent dF (largest 7.0%) against responses of 40 to 70%. Whether
    the criterion should correct for the number of tests is asked of a reader in questions/001517.yaml.
