- claim: cell-counts
  outcome: reproduced
  notebook: reproduce_pasquereau_2013.ipynb
  output: claim:cell-counts
  measured:
  - 115
  - 157
  - 51
  - 54
  - 32
  - 48
  - 3
  notes: Monkey V units with at least 5 observed perturbations per direction number 115 before and 157 after
    MPTP (112 and 159 expected), with 51 and 54 PTNs (49 and 54) and 32 and 48 CSNs (31 and 48). Three units
    in all files are pyramidal_tract_and_corticostriatal_neuron, all in monkey V and all studied; Leu has none.
    The studied cells also include 29 and 50 not activated, 1 and 1 not tested, and after MPTP one PTN-and-thalamic
    and two thalamic projection units. 79 pre and 5 post Venus units have fewer than 5 perturbations in a direction.
    No unit name repeats across files, and no trial spike train, angle or EMG window is shared between files.
    Counting all of a file's perturbations, or requiring observation only over -500 to +200 ms, gives the same
    counts, so the difference from the claims file's data check is not from the observation rule. Twelve files
    hold the trials of two lab source files (source_file), with units the dataset merged across them (for example
    v1601.1+v1601b.1); no trial is repeated between the two and no source file is in two NWB files, so each
    merged unit is counted once, as the dataset gives it.
- claim: monkey-l-perturbations
  outcome: blocked
  blocked_by: data_missing
  notebook: reproduce_pasquereau_2013.ipynb
  output: claim:monkey-l-perturbations
  notes: All 5952 Leu trials have torque_perturbation_type not_available and no onset time. The Leu torque
    command is NaN in 114 files; the other 34, all after MPTP, hold a 100 Hz trace with many jumps (329 to
    3643 steps of more than 20 units per file). In the file with the most, the 303 excursions above 100 units
    fall at the appearance of the centre target (120, one per trial, within 0.1 s) or 2.5 to 10 s after it,
    none 1 to 2.5 s after it where the Venus perturbations fall (1.7 s), and 55 within 0.15 s of a voluntary
    movement onset; they are timed to the task, not to perturbations. The criterion blocks the claim when no
    Leu file marks the perturbations, and the pre-MPTP command is NaN in every file. The Leu files hold 138
    and 72 units.
