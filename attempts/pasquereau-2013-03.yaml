    the claims file's.
- claim: kinematic-latency-unchanged
  outcome: not_reproduced
  notebook: reproduce_pasquereau_2013.ipynb
  output: claim:kinematic-latency-unchanged
  notes: 'Movement onset latency is shorter after MPTP (pre 9.7 and 10.9 ms, post 3.0 and 6.0 ms for flexion
    and extension), MPTP F = 709, p < 1e-100; the MPTP by direction interaction is F = 16.1 (the paper''s F
    > 94). The forwards-backwards filter moves onsets early after MPTP: 6.7% of post-MPTP onsets are at 0 ms
    with the velocity already above 5 deg/s (0.1% before). Variants that avoid this give the same outcome:
    with the velocity at or below threshold over the 20 ms before onset, pre 10.87 and 9.65, post 6.13 and
    3.38 ms (extension, flexion), F = 596.5; with a causal 25 Hz filter and the same requirement, pre 21.44
    and 20.33, post 18.18 and 15.62 ms, F = 422.5; at command pulses of 60 to 250 units F = 214.3 and 146.2.
    The unfiltered mean velocity at 10 and 12 ms is 1.7 and 4.0 deg/s before and 5.1 and 13.2 after MPTP. The
    torque pulse is about twice as large after MPTP even at matched commands, which may shorten the latency.'
  deviations:
  - The claims file's forwards-backwards filter and onset search are used; a below-threshold requirement and
    a causal 2nd-order Butterworth filter are run as variants (standard choices), since the paper says only
    that onset was detected with 'angle, velocity, and duration criteria' and a 5 deg/s threshold (Methods,
    Data analysis).
