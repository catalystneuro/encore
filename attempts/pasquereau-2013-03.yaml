findings:
- kind: data_missing
  severity: major
  notebook: reproduce_pasquereau_2013.ipynb
  output: finding-leu-no-perturbations
  statement: The monkey L (Leu) files mark no torque perturbation; all 5952 trials have torque_perturbation_type
    not_available. The torque command is NaN in 114 files; in the other 34, all after MPTP, it moves at task
    events (in the file shown, at the appearance of the centre target in every trial and near voluntary movement
    onsets), not 1 to 2 s after the centre target as perturbations would. The paper's monkey L torque results
    (57 of 115 and 35 of 73 responsive cells), which enter its pooled values, cannot be tested. The dandiset
    description says so.
- kind: other
  about: data
  severity: major
  notebook: reproduce_pasquereau_2013.ipynb
  output: finding-kinematics-vs-paper
  statement: 'The torque-evoked elbow displacements in the files differ from the paper''s. Averaged over sessions,
    the amplitude is 2.4 to 3.8 degrees per state and direction and 0.1% of perturbations reach 10 degrees,
    where the paper gives a mean of 10 degrees; the peak velocity 46 to 75 deg/s, and only 2 of 581 session-directions
    fall in the 130 to 200 deg/s range the paper uses for its velocity-matched sessions. After MPTP the displacements
    are faster (+28%) and larger (+15%), where the paper reports them slower (-16.2%) and smaller (-6.6%).
    The angle''s scale is not the cause: voluntary movements to 20 degree targets measure 19.9 and 18.1 degrees,
    and the files'' ElbowVelocity agrees with the derivative of the angle.'
- kind: other
  about: data
  severity: major
  notebook: reproduce_pasquereau_2013.ipynb
  output: finding-torque-command-levels
  statement: The torque command's pulse is larger after MPTP than before (mean 174.7 against 58.4 units, about
    three times; median 181.6 against 45.7, about four times; 125 of 137 post-MPTP sessions have a median
    pulse of 120 to 250 units, 3 of 151 before), where the paper describes one 0.1 Nm pulse throughout. The
    units have no conversion to newton-metres, so whether the applied torque changed cannot be told; the ElbowTorque
    description notes the varying levels. The two states share only two pulse sizes, near 90 units (483 pre-MPTP
    and 227 post-MPTP perturbations) and near 180 units (41 and 1540), so comparisons of evoked movements and
    EMG before and after MPTP over all perturbations cannot separate the torque from the effect of MPTP.
- kind: other
  about: data
  severity: none
  notebook: reproduce_pasquereau_2013.ipynb
  output: sanity
  statement: Checks that passed. The monkey V counts of cells studied by MPTP state and projection type match
    the paper's supplementary table within 3 cells; is_post_mptp agrees with every file name; no unit name
    repeats across files and no trial spike train, angle or EMG window is shared between files. The torque
    command leaves rest 4 ms after the marked onset and the joint moves in the torque's direction, and spikes
    cross the response threshold in 0.67 of cell-directions after the onset against 0.23 after a pseudo onset,
    so the analog series and spikes are consistent with the trials table's clock. Twelve files join the trials
    of two lab source files without repeating any, and the angle agrees with the 20 degree targets and the
    ElbowVelocity series.
- kind: methods_unavailable
  statement: Question for the authors. The Methods detect responses by a millisecond-by-millisecond two-tailed
    t-test of the SDF against the baseline rate at p < 0.002, and state that this holds the false-positive
    rate near 0.01 over 200 ms. How was the test computed (which variance, over trials or over baseline time,
    and of single-trial or trial-averaged SDFs)? On these data, a threshold from the SD of the trial-averaged
    SDF's baseline crosses after a pseudo onset in 23% of cell-directions, a single-trial t-test in 47%, and
    a threshold from the SD of all single-trial baseline values in 1.3% but finds responses in only 20% of
    real cell-directions; none gives both the stated false-positive rate and the reported 62 to 75% of cells
    responding. All claims on the response selection are blocked until this is known.
- kind: methods_unavailable
  statement: Question for the authors. The trial-by-trial correlations of PTN response latency with peak velocity
    and m2 need a single-trial response latency, which the Methods do not define (the response onset is defined
    on the trial-averaged SDF). How was it measured?
- kind: other
  about: data
  severity: minor
  notebook: reproduce_pasquereau_2013.ipynb
  output: finding-perturbation-timing
  statement: In the Venus files the torque onset follows center_target_appearance_time by a near-fixed delay,
    1.695 to 1.698 s in 88.4% of 5550 perturbations (1.696 s in 3010), and the median delay is in that range
    in 288 of 291 files. The paper says the torque came at an unpredictable time, 1 to 2 s from a uniform
    distribution. Either the files' centre target time is placed from the perturbation onset or the timing
    differs from the paper's; the spikes and analog series agree with the onset (data check), so the analyses
    aligned to the onset are not affected, but a delay from the centre target computed from the files would be.
