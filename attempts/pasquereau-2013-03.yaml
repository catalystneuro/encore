  notes: PTN latency 1.92 and 1.86 ms (n 49 and 48, Mann-Whitney p = 0.68); CSN 4.91 and 6.85 ms (n 32
    and 38, p = 0.019). All four means are within tolerance and the PTN test holds, but the CSN test does
