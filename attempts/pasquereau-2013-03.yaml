    48 CSNs after MPTP, have no antidromic latency in the files. With every Leu PTN and CSN added (variant)
    the means are 1.80, 1.83, 5.38 and 7.01 ms and the CSN test gives p = 0.0072.
  deviations:
  - The expected values pool both monkeys; the test uses monkey V's studied cells (criterion).
- claim: false-positive-rate
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_pasquereau_2013.ipynb
  output: claim:false-positive-rate
  measured: 0.23
  notes: With the claims file's detection at a pseudo onset 600 ms before the torque, 0.230 of 544 cell-directions
    cross the threshold over 0 to 200 ms (0.257 before and 0.210 after MPTP), and 0.051 have a response
    with onset in 20 to 60 ms. On trials without a perturbation, aligned where the file's perturbations
    fall, 0.196 of 255 cells cross. Both are far above 0.03, so by the claims file's rule and the protocol's
    the procedure is not the paper's. Other readings of the Methods' t-test give 0.465 (single-trial t-test,
    the claims file's variant), 0.347 (standard error of trial baselines) and 0.013 (SD of all single-trial
    baseline values); the last is near 0.01 but calls only 0.200 of real cell-directions responsive (0.673
    with the claims file's detection), far below the paper's 62 to 75% of cells. No reading gives both
    the paper's false-positive rate and its response rates. Question for the authors, in findings.
  deviations:
  - The t threshold uses 499 degrees of freedom (500 baseline values), a standard choice.
  - The kernel is truncated at 400 ms, a standard choice that cannot change a result.
