    excitation only that normalisation gives the same negative values. Mice 148 and 149 keep r near
    0.2 to 0.4 for the whole 50 s.
  deviations:
  - Correlation of the ON vector with 5-s bins, a summary of the paper's frame-by-frame matrix.
  - dF/F with F0 from the 2 s before onset.
- claim: fig7h-iti-knn-mouse
  outcome: partially_reproduced
  notebook: reproduce_ling_2023.ipynb
  output: claim:fig7h-iti-knn-mouse
  notes: In sub-148 ses-3 (318 glomeruli) accuracy is 45%, above the null's 99th percentile (37.5%,
    null mean 17.1%) but below 50%; by odor 0.9, 0.0, 0.3 and 0.6. The code's choice (cosine on the
    top three PCs) gives 12.5%. Across the seven sessions accuracy is 22.5% to 47.5%, above the
    null's 99th percentile in three. The null mean of this leave-one-out vote (16.7% to 17.4%) is
    below the nominal 25%, as with k = 20 only 9 of the 39 other trials share the own odor; the
    paper gives no chance value for this panel. With k at or below the class size accuracy is 90.0%
    (k = 5) and 82.5% (k = 9) in sub-148 ses-3 and 80.0% to 100% in every session (null 99th
    percentiles 42.5% to 45.0%). All trials of one odor lie in one block, so neither k separates the
    odor from slow differences between blocks (fig7j).
  deviations:
  - k = 20 from the legend; the Methods' k = 50 exceeds the 39 other vectors.
  - dF/F with F0 the session median of each ROI.
- claim: fig7j-iti-timebin-mouse
  outcome: reproduced
  notebook: reproduce_ling_2023.ipynb
  output: claim:fig7j-iti-timebin-mouse
  notes: In sub-148 ses-3 accuracy is 88.5% in the first 10 s after offset and 71.9% to 75.6% from 10
    to 50 s, above 50% and the null's 99th percentile (32.5% to 35.9%); the other sessions give
    72.2% to 99.4% in every segment. The statement's reading as odor memory is not supported by the
    outputs. The trial-label null does not keep the block structure; under the 24 relabellings of
    whole blocks, the only nulls that do, accuracy stays at 68.2% to 88.5% in sub-148 ses-3, close
    to the observed values. On pseudo-trials in the inter-block intervals, where no odor is given, the same
    classifier names the preceding block at 69.6% to 96.9% (sub-148 ses-3 69.6% to 71.2%), as high
    as in the ITIs, so slow differences between blocks are enough for this accuracy.
  deviations:
  - dF/F with F0 the session median of each ROI.
  - The shuffled-label control is a permutation of whole-trial labels with the neighbours kept.
- claim: figs7e-ibi-chance
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_ling_2023.ipynb
  output: claim:figs7e-ibi-chance
  notes: With the Methods' k = 50 on 60 one-minute bins the rate is 0.0% to 13.3% (mean 3.8%) in the
    four sessions with complete IBIs, and this procedure's permutation null averages 10.8%, not the
    25% chance of four odors, so the paper's 34.8% cannot come from it. With k = 20 the IBI bins are
    classified by the preceding block at 73.3% to 95.0% in those four sessions and 35.0% to 66.7% in
    the other three (permutation p <= 0.02), and with k at or below the 14 other bins of the own IBI
    at 69.4% to 98.3% (k = 10) and 90.0% to 98.3% (k = 5) in all seven (null means 21.8% to 25.5%,
    p < 0.001). These rates contradict the claim, but each odor has one IBI per session, so no
    validation can hold out a block, and slow drift between neighbouring minutes could give them.
  deviations:
  - The 318-glomerulus session has only three complete IBIs (54 bins), so k = 50 was run on the
    four sessions that have four.
- claim: figs8e-random-order-decline
  outcome: partially_reproduced
  notebook: reproduce_ling_2023.ipynb
  output: claim:figs8e-random-order-decline
  notes: In all five random-order sessions accuracy in the first 2 s after offset is above the null
