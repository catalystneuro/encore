findings:
- kind: metadata_insufficient
  statement: The fluorescence traces are raw F (unit "n.a.") with no description of how they were
    extracted or of the normalisation the paper applied. The paper's deposited arrays are close to F
    z-scored within each 57-s trial window, and the paper's ON/OFF anticorrelation, its persistence
    after offset and the contrast enhancement appear in these data with that normalisation and not
    with dF/F relative to the 2 s before each odor.
- kind: metadata_insufficient
  statement: The trials table has one row per second of valve opening, without a description; odor
    presentations, blocks and sequential pairs have to be rebuilt from timing. Five block sessions
    fill the gaps with "Empty" rows and two do not. The concentration column has no unit, gives 0.0
    to two odorants (2-ethylphenol, anisaldehyde) in three random-order sessions, and 0.1 to the
    Empty rows of sub-141 ses-5.
- kind: data_missing
  statement: In sub-134 ses-22, sub-141 ses-5 and sub-141 ses-8 the raw TwoPhotonSeries holds half
    the frames of the fluorescence traces (91000 against 182000 in sub-134 ses-22) at twice the frame
    interval; the conversion notes give 182000 frames for sub-134 ses-22.
- kind: data_missing
  statement: No sequential pair ends in acetophenone (Figure 6E right, S6) and no PID recordings are
    included (Figure S2). The random-order session of Figure S8D and S8E (286 glomeruli) is not in
    the dandiset.
- kind: selection_undocumented
  statement: The dandiset holds the paper's seven block-protocol sessions from four mice and five
    random-order sessions from five mice (four not in the block sessions) with odor-specific
    concentrations, apparently from a
    second study (the conference paper it also names, whose authors are the dandiset's
    contributors). Neither the metadata nor the description says which sessions belong to which
    paper, and the description is that of the second study.
- kind: identifier_missing
  statement: No identifier links the paper's datasets to the dandiset's sessions. They match by ROI
    count (198, 219, 318), but the session names in the paper's Figshare code (for example
    m149_3_1, m129_1_2) do not all exist in the dandiset (it has no mouse 129 and only session 1 of
    mouse 149).
- kind: other
  statement: The random-order odorant names differ from the paper's; the files have 2-ethylphenol
    and anisaldehyde where the Methods list 2-ethylpyrizine (2ep) and isoamyl acetate (asa). Names
    are spelled differently across sessions ("Anisole" and "anisole"), and "2-methypyrazine" is
    misspelled.
- kind: metadata_insufficient
  statement: The genotype (Thy1-GCaMP6f) and the ages are not stated, and every session starts at
    00:00, so the time of day is missing. In sub-124 ses-3 the last trial ends 8.9 s after the last
    imaging frame.
- kind: code_mismatch
  statement: The paper's code counts windows in frames at a nominal 16 per second, while the
    sessions are imaged at 13.7 to 17.8 Hz; in sub-141 ses-8 (15.5 Hz) the deposited trial windows
    match the dandiset only when counted in frames (r 0.968) and not in seconds (r 0.307).
- kind: paper_inconsistency
  statement: The Methods give k = 50 for the ITI-average classifier of Figure 7H, which has 40
    vectors, while the legend gives k = 20 and the code uses k = 20 on three PCs. For the IBI
    classifier (60 vectors, k = 50) the procedure's own null is 10.8%, not the 25% chance of four
    odors.
- kind: code_mismatch
  statement: The Figure 5E legend states a one-tailed t-test; Script_Fig4.m uses MATLAB's ttest,
    which is two-tailed (p = 0.011 against 0.0055 one-tailed here).
