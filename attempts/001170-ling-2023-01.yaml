- claim: fig7f-iti-knn-locust
  outcome: reproduced
  notebook: reproduce_ling_2023.ipynb
  output: claim:fig7f-iti-knn-locust
  notes: The 20-s ITI averages classify all 70 trials correctly (null 99th percentile 25.7%, chance
