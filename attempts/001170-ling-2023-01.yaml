- claim: fig6e-contrast-msc
  outcome: not_reproduced
  notebook: reproduce_ling_2023.ipynb
  output: claim:fig6e-contrast-msc
  notes: Over 21 session-odor pairs the solitary r (0.229) and the sequential r (0.219) do not
    differ (difference 0.009, positive in 10 of 21, one-tailed paired p = 0.39); per session p =
    0.40, per first odor p = 0.33 to 0.51. On the three sessions the published version's Table 1
    names (sub-148 ses-2, sub-148 ses-3, sub-149 ses-1) the solitary r is 0.133 and the sequential
    r 0.064 (p = 0.082). With F z-scored on the 2 s before the pair's onset there is no difference
    (0.251 against 0.258, p = 0.58). With per-trial z-scored traces the solitary r is 0.289 and the
    sequential r 0.118 (p = 5.6e-07; 0.0025 on the three sessions), as the claim states, but that
    normalisation can produce negative correlations with later activity by itself (fig2f).
  deviations:
  - All seven block sessions are used, as the preprint does not identify its three sessions from two
    mice; the three the published version names are shown as a variant.
  - dF/F with F0 from the 2 s before the pair's first onset.
- claim: fig6e-contrast-ace
  outcome: blocked
  blocked_by: data_missing
  notes: No sequential pair in the dandiset ends in acetophenone; in all seven block sessions the
    second odor is always methyl salicylate (ace, als or eug first). The Figshare code builds only
    (X)msc sequences too, so the (X)ace data of Figure 6E (right) and S6 were not found in public
    form. The published version's Table 1 assigns this panel to the 73-, 210-, 153- and
    198-glomerulus sessions, which in the dandiset hold only (X)msc pairs; in those sessions the
    first odor's response in the pairs correlates 0.94 to 0.99 with solitary acetophenone when the
    first odor is labelled acetophenone, and the second odor's response 0.76 to 0.95 with solitary
    methyl salicylate, consistent with the dandiset's labels.
- claim: fig7d-persistent-anticorrelation
  outcome: not_reproduced
  notebook: reproduce_ling_2023.ipynb
  output: claim:fig7d-persistent-anticorrelation
  notes: The median r with the ON vector over the 28 pairs is 0.481 at 0 to 5 s after offset, 0.312
    to 0.328 from 5 to 20 s and 0.094 at 45 to 50 s, above 0 in every bin (p <= 0.014), while the
    mean dF/F falls from 0.071 to 0.005. With F0 from before each block r is positive in every bin
