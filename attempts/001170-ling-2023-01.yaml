- claim: fig7i-iti-timebin-locust
  outcome: partially_reproduced
  notebook: reproduce_ling_2023.ipynb
  output: claim:fig7i-iti-timebin-locust
  measured: 29.0
  notes: Accuracy decays from 78.7% in the first 2 s after offset to 29.0% averaged over odors in the
