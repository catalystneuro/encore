inputs:
- what: The paper's Figshare record (version 2), read for method choices (Script_Fig1.m to
    Script_Fig6.m, metaData.mat, medAngles.mat, wrtTheta.mat, contrastCorr.mat). The deposited mouse
    array data1_mouse_glom198.mat is used by the link claim only. The locust files
    data2_locust_PN66.mat, data4_locust_PN85.mat and data5_locust_PN85.mat are used by the locust
    claims (data elsewhere). Each file is checked against the md5 the record gives.
  source: Figshare doi:10.6084/m9.figshare.31435543.v2
- what: The conversion code of the dandiset (DataJoint export, alignment of traces and trials on the
    odor clock, conversion notes), read to establish the clock and the frame counts.
  source: https://github.com/catalystneuro/reimer-arenkiel-lab-to-nwb at commit
    ac8f1208c990f44c59c58214c26a93965f5ff6c7
outcomes:
- claim: mouse-sessions
  outcome: reproduced
  notebook: reproduce_ling_2023.ipynb
  output: claim:mouse-sessions
  measured:
  - 7
  - 4
  - 210
  notes: The trials tables give seven block-protocol sessions from mice 134, 141, 148 and 149. The
    median ROI count over these is 210 (reading a); over all twelve sessions it is 296 (reading b).
    The ROI counts of sub-141 ses-8 (198), sub-149 ses-1 (219) and sub-148 ses-3 (318) equal the
    glomerulus counts the Methods give for Figures 2F and 4C, 6D and 7.
  deviations:
  - Sessions are matched to the paper's figures by ROI count; no identifier links them.
- claim: figshare-trace-link
  outcome: reproduced
  notebook: reproduce_ling_2023.ipynb
  output: claim:figshare-trace-link
  notes: Matched by ROI count (sub-141 ses-8, the only 198-ROI session) and ROI order. With the
    code's frame-counted windows the median within-trial r between the dandiset's raw F and the
    deposited array is 0.968 (5th percentile 0.834, 0.947 to 0.994 by block), and every deposited
    glomerulus correlates best with the dandiset ROI of the same index. With windows placed in
    seconds the median r is 0.307, as the code counts 16 frames per second in a session imaged at
    15.5 Hz. The deposited values are close to F z-scored within each trial window (r = 0.927).
    No other claim depends on this one.
- claim: fig2h-onoff-angle-mouse
  outcome: partially_reproduced
  notebook: reproduce_ling_2023.ipynb
  output: claim:fig2h-onoff-angle-mouse
  measured: 127.88
  notes: With the code's procedure (median subtraction, vectors centred over the 160 frames) the
    median ON-OFF angle exceeds 90 degrees in all 28 session-odor pairs (101.7 to 153.9) and in each
    odor's mean (111.0 to 140.0), but the mean is 127.9 (SEM 3.2), outside 121.8 +/- 2.98. After
    centring the mean ON vector is exactly opposite the mean OFF vector (cosine -1 in every case),
    and without centring the mean angle is 71.8 with 2 of 28 above 90. Without the median
    subtraction the mean is 124.2 and with per-trial z-scored traces 119.5, both within tolerance.
    By mouse the means are 136.3 (134), 136.3 (141), 116.0 (148) and 117.9 (149).
  deviations:
  - dF/F with F0 from the 2 s before onset; the paper's deposited arrays are close to per-trial
    z-scores. The z-scored result is shown as a variant.
  - Windows placed in seconds on a 16 Hz grid; the code counts frames at a nominal 16 per second.
- claim: fig2f-onoff-anticorrelated-mouse
  outcome: not_reproduced
  notebook: reproduce_ling_2023.ipynb
  output: claim:fig2f-onoff-anticorrelated-mouse
  notes: The time-averaged ON and OFF vectors are positively correlated in all 28 session-odor
    pairs (median r 0.481, Wilcoxon p = 7.5e-09), for every odor (0.391 to 0.535) and every mouse
    (0.245 to 0.596). The median subtraction does not change r. With per-trial z-scored traces the
    median r is 0.068 (12 of 28 below 0, p = 0.33). The angles of fig2h exceed 90 degrees only
    after centring, which makes the mean ON and OFF vectors opposite by construction.
  deviations:
  - dF/F with F0 from the 2 s before onset, not the paper's (undocumented) normalisation.
- claim: fig4b-reference-odor-mouse
  outcome: partially_reproduced
  notebook: reproduce_ling_2023.ipynb
  output: claim:fig4b-reference-odor-mouse
  notes: Reading (a) holds for acetophenone only (ON-ON 105.7, ON-OFF 127.5 degrees, paired p =
    0.018). Methyl salicylate and eugenol show no difference (p = 0.76 and 0.83), and allyl
    sulfide goes the other way (ON-ON 112.1, ON-OFF 59.6, p = 0.00035). Reading (b) holds in none of
    the seven sessions for any reference odor. Full-dimensional vectors give the same pattern.
  deviations:
  - The mouse code for this figure is not in the Figshare record (it loads precomputed angles); the
    locust code's procedure (top three PCs, mean vectors) was used.
- claim: fig4d-clustering-mouse
  outcome: not_reproduced
  notebook: reproduce_ling_2023.ipynb
  output: claim:fig4d-clustering-mouse
  notes: In 0 of 7 sessions, the 198-glomerulus session included, does the two-cluster cut put the
    four ON vectors apart from the four OFF vectors, with dF/F or with z-scored traces.
  deviations:
  - The paper shows one representative session without naming it; the 198-glomerulus session is
    taken as it, and all seven are reported.
- claim: fig6e-contrast-msc
  outcome: not_reproduced
  notebook: reproduce_ling_2023.ipynb
  output: claim:fig6e-contrast-msc
  notes: Over 21 session-odor pairs the solitary r (0.229) and the sequential r (0.219) do not
    differ (difference 0.009, positive in 10 of 21, one-tailed paired p = 0.39); per session p =
    0.40, per first odor p = 0.33 to 0.51. With per-trial z-scored traces the solitary r is 0.289
    and the sequential r 0.118 (p = 5.6e-07), as the claim states.
  deviations:
  - All seven block sessions are used, as the paper's three sessions from two mice are not
    identified.
  - dF/F with F0 from the 2 s before the pair's first onset.
- claim: fig6e-contrast-ace
  outcome: blocked
  blocked_by: data_missing
  notes: No sequential pair in the dandiset ends in acetophenone; in all seven block sessions the
    second odor is always methyl salicylate (ace, als or eug first). The Figshare code builds only
    (X)msc sequences too, so the (X)ace data of Figure 6E (right) and S6 were not found in public
    form.
- claim: fig7d-persistent-anticorrelation
  outcome: not_reproduced
  notebook: reproduce_ling_2023.ipynb
  output: claim:fig7d-persistent-anticorrelation
  notes: The median r with the ON vector over the 28 pairs is 0.481 at 0 to 5 s after offset, 0.312
    to 0.328 from 5 to 20 s and 0.094 at 45 to 50 s, above 0 in every bin (p <= 0.014), while the
    mean dF/F falls from 0.071 to 0.005. With F0 from before each block r is positive in every bin
    (0.304 to 0.600); for the first block of sub-134 and sub-141 that baseline is only 14 to 24 s.
    With per-trial z-scored traces r is negative from 5 s on (-0.344 to -0.480, 26 to 28 of 28),
    as the claim states. Mice 148 and 149 keep r near 0.2 to 0.4 for the whole 50 s.
  deviations:
  - Correlation of the ON vector with 5-s bins, a summary of the paper's frame-by-frame matrix.
  - dF/F with F0 from the 2 s before onset.
- claim: fig7h-iti-knn-mouse
  outcome: partially_reproduced
  notebook: reproduce_ling_2023.ipynb
  output: claim:fig7h-iti-knn-mouse
  notes: In sub-148 ses-3 (318 glomeruli) accuracy is 45%, above the null's 99th percentile (37.5%,
    null mean 17.1%) but below 50%; by odor 0.9, 0.0, 0.3 and 0.6. The code's choice (cosine on the
    top three PCs) gives 12.5%. Across the seven sessions accuracy is 22.5% to 47.5%, above the
    null's 99th percentile in three. The null mean of this leave-one-out vote (17.1%) is below the
    nominal 25%; the paper gives no chance value for this panel.
  deviations:
  - k = 20 from the legend; the Methods' k = 50 exceeds the 39 other vectors.
  - dF/F with F0 the session median of each ROI.
- claim: fig7j-iti-timebin-mouse
  outcome: reproduced
  notebook: reproduce_ling_2023.ipynb
  output: claim:fig7j-iti-timebin-mouse
  notes: In sub-148 ses-3 accuracy is 88.5% in the first 10 s after offset and 71.9% to 75.6% from 10
    to 50 s, above 50% and the null's 99th percentile (32.5% to 35.9%); the other sessions give
    72.2% to 99.4% in every segment. The statement's reading as odor memory is not supported by the
    outputs. On pseudo-trials in the inter-block intervals, where no odor is given, the same
    classifier names the preceding block at 69.6% to 96.9% (sub-148 ses-3 69.6% to 71.2%), as high
    as in the ITIs, so slow differences between blocks are enough for this accuracy.
  deviations:
  - dF/F with F0 the session median of each ROI.
  - The shuffled-label control is a permutation of whole-trial labels with the neighbours kept.
- claim: figs7e-ibi-chance
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_ling_2023.ipynb
  output: claim:figs7e-ibi-chance
  notes: With the Methods' k = 50 on 60 one-minute bins the rate is 0.0% to 13.3% (mean 3.8%) in the
    four sessions with complete IBIs, and this procedure's permutation null averages 10.8%, not the
    25% chance of four odors, so the paper's 34.8% cannot come from it. With k = 20 the IBI bins are
    classified by the preceding block at 73.3% to 95.0% in those four sessions and 35.0% to 66.7% in
    the other three (permutation p <= 0.02), far above chance, which is the opposite of the claim.
  deviations:
  - The 318-glomerulus session has only three complete IBIs (54 bins), so k = 50 was run on the
    four sessions that have four.
- claim: figs8e-random-order-decline
  outcome: partially_reproduced
  notebook: reproduce_ling_2023.ipynb
  output: claim:figs8e-random-order-decline
  notes: In all five random-order sessions accuracy in the first 2 s after offset is above the null
    (24.4% to 56.8% against 99th percentiles of 10.6% to 12.3%, chance 9.1%), with large
    differences between odors. In the last 5 s it is 9.6% to 15.3%, still above the null's 95th
    percentile in four of five sessions (not in sub-134 ses-6).
  deviations:
  - The paper's random-order session (286 glomeruli, mouse 129 in the Figshare code) is not in the
    dandiset; five sessions with the same paradigm, four of them from mice not in the block
    sessions, were used.
  - In three of these sessions odors have different concentration values; the first 10
    presentations of each odor were used regardless.
- claim: figs2-pid-decay
  outcome: blocked
  blocked_by: data_missing
  notes: The dandiset holds no photoionization detector recordings (acquisition holds the movies,
    treadmill and in one file respiration). No PID file is in the Figshare record's file list.
