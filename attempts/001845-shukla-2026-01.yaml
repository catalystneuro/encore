    the rest holds.
  deviations:
  - Mixed model by statsmodels MixedLM with sum coding and Wald tests (the paper's software is not stated);
    df 8,487 and 14,227 against the paper's 8,524 and 14,094.
  - Open details of the claims file (well centres, downsampling, returns after null, shuffle) were run
    as it lists them; the shuffle averages 20 circular shifts per session.
