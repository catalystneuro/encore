- claim: fig1j-partner-location-predicts-choice
  outcome: not_reproduced
  notebook: reproduce_shukla_2026.ipynb
  output: claim:fig1j-partner-location-predicts-choice
  notes: No reading gives the claim. At 100% WT real accuracy does not exceed Fmr1 under any reading (Mann-Whitney
    p 0.12 to 0.27) and Fmr1 real accuracy does not exceed its shuffled accuracy under any reading (p
    0.24 to 0.79). At 50% WT exceeds Fmr1 only under reading (b, p2) (U = 81, p = 0.021). WT real exceeds
    shuffled in 11 of 12 readings; at 50% Fmr1 does under readings (a) and (b) (p 0.007 to 0.031). Pooled
    accuracies at 100% (reading b) are 0.34 to 0.62 in Fmr1 and 0.40 to 0.71 in WT rats.
  deviations:
  - The null uses the class a one-hot multinomial logistic regression predicts for each partner well,
    taken as the most frequent next well in the training folds, with stratified folds that assign each
    class's samples in turn; it predicts the same class as scikit-learn in 98% of real folds. Real accuracies
    use scikit-learn with StratifiedKFold(5) as in the Methods. This shortcut keeps 1,000 shuffles per
    rat and session within the time limit.
  - The moment the partner's location is read and the pooling of sessions are not given; readings (a),
    (b), (c) and p1, p2 were all run as the criterion lists. In the per-session reading p2, sessions with
    fewer than 5 samples in every class are dropped.
  - Pokes within 0.5 s of a poke at another well by the same rat are dropped as sensor crosstalk before
    visits are formed; this is an assumption of the attempt (the paper describes no such step), made because
    wells 47 cm apart cannot be poked within 0.5 s.
  assumed: true
