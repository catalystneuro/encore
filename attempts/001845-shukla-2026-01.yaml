findings:
- kind: data_missing
  statement: The dandiset holds only the cooperative sessions of the 5 WT and 5 Fmr1 pairs. The mixed
    WT-Fmr1 pairs, the sensory-deprived (opaque barrier) sessions, the visual-cue association task and
    the virtual-agent task are not in it, though the paper says all data underlying its results will be
    uploaded to this dandiset. Seven of the paper's findings cannot be tested.
- kind: other
  statement: About 4.8% of pokes (82,245 of 1,716,630 in the analysed sessions) fall within 0.5 s of a
    poke by the same rat at another well, physically impossible for wells 47 cm apart, and they come in
    bursts (up to 128,979 pokes and 2,447 transitions in one rat session; 140 of 1,120 rat sessions affected,
    most in pairs FXM102-FXM103, FXM105-FXM107 and FXM108-FXM109). Used as recorded they inflate transition
    counts and change the performance of Eq. 1.
- kind: metadata_insufficient
  statement: The matched_poke events follow a rule the files do not describe. No match is at the well
    of the previous match (0 of 19,602 consecutive pairs), at 100% as at 50%, and matches cannot be recomputed
    from the poke events because only poke onsets are stored, not how long the nose is held.
- kind: selection_undocumented
  statement: Session numbers have gaps (FXM102 and FXM103 lack 100% session 18 and 50% session 61, FXM105
    and FXM107 lack 100% sessions 9 and 15 and 50% session 10, XFN2 and XFN4 lack 50% session 81), and
    the files hold up to 56 sessions at 100% and 88 at 50% where the paper analyses the first 21 and 35.
    Which sessions the paper used, and why some are missing, is not stated.
- kind: other
  statement: Session epochs last 10.7 to 57.2 min (median 21.7) against the paper's 20 to 30 min, and
    in 6.6% of rat sessions some pokes fall outside the session epoch.
- kind: other
  statement: The paper's code repository (JadhavLab/Social_CoOp_Behavior) holds only a README naming version
    0.260519.1308, an early partial upload with 1,007 of the 2,649 assets of the latest published version;
    no analysis code is published.
- kind: methods_unavailable
  statement: Questions for the authors. Was the two-way RM ANOVA fitted with sessions as replicates (the
    printed df, F(1,168) for 10 pairs over 21 sessions) or with pairs or rats as subjects? Under the latter
    most genotype effects in Figures 1, 3 and 4 are not significant here. What are the units of match
    and transition rates (Figure 1E to 1G)?
- kind: methods_unavailable
  statement: Questions for the authors on event definitions the Methods leave open. How were matches were
    recomputed for the circular-shift test of Figure 1H, which sessions are early and late there, and
    how were the arrival and departure times of Figure 4B and 4C, the downsampling and arrival rule of
    Figure 4E to 4I, the sample entropy parameters, the sets compared in the Jaccard analysis, and the
    moment the partner's location is read in Figure 1J defined?
- kind: methods_unavailable
  statement: Questions for the authors on trial definitions. How were synchronous and asynchronous matches
    (Figure 7B), asynchronous gaze trials (Figure 7D to 7H) and follower trials (Figure 8) built from
    the events? With follower trials built from the arrival sequence, every rat cooperates less after
    its partner cooperated, the reverse of Figure 8B; with only trials in which the leader waits, there
    is no effect.
- kind: methods_unavailable
  statement: Questions for the authors on the reinforcement learning model (Figure 6). What were the learning
    rate, discount factor, timesteps per episode, number of runs, state encoding and the definition of
    coordination efficiency? Without them the simulation cannot be repeated.
