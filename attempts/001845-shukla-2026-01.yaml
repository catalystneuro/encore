- claim: fig4eg-cross-correlation-wt-higher
  outcome: partially_reproduced
  notebook: reproduce_shukla_2026.ipynb
  output: claim:fig4eg-cross-correlation-wt-higher
  notes: WT coefficients exceed Fmr1 in every reading and contingency, including lags -1 to +1 s (frame
    sampling, returns counted, 0.078 against 0.055 at 100% and 0.086 against 0.070 at 50%), and the genotype
    x lag interaction is significant at 50% under every reading (p below 0.0001) and at 100% under three
    of four (p 0.0003 to 0.046; 0.064 for modal sampling with returns). The genotype main effect is not
    significant at 50% under any reading (p 0.30 to 0.35) and at 100% only when returns to the same well
