- claim: figs2-before-firing-then-depolarization
  outcome: partially_reproduced
  notebook: reproduce_semenov_2025.ipynb
  output: claim:figs2-before-firing-then-depolarization
  notes: Firing holds and sustained depolarization does not, under every combination of the claims file's readings
    (O1 to O4). With O1(a) every neuron fires before the change (20 of 20 with the 5% height, 18 or 19 with the
    5-SD height) and all have APs without sustained depolarization at a lower field. No neuron shows sustained depolarization
    (O4) at its highest field under any reading (0 of 20; 0 of 7 under O1(b)), where the criterion needs more than
    half. At the highest field the mean dF over the last 100 ms of the stimulus is above zero in 20 of 20 neurons
    (median 2.63%, range 0.55 to 5.41% with O1(a)), below both O4 levels (medians 7.29% and 4.93%), and 9 of the
    20 still have an AP in that window. The whole-frame variant finds 1 of 20. The depolarization the paper describes
    is present but weaker than the claims file's measure of a sustained one; the maximum firing rate rises with
    field in most neurons (tables in the notebook).
  deviations:
