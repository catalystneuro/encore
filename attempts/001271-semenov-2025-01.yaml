findings:
- kind: metadata_error
  statement: DANDI:001271 states in every file that 1 V translates to 36 V/cm, but its stated voltages give the
    fields marked in Figure S2 at 18 V/cm per V (45, 63, 72; 90, 108, 117; 54, 72, 81 V/cm match neurons tested
    at 2.5, 3.5, 4; 5, 6, 6.5; 3, 4, 4.5 V before and after the change) and at no voltages at 36 V/cm per V. The
    voltages are likely peak-to-peak, which the 001271 descriptions do not say (001032 to 001035 say peak-to-peak;
    001030 says one polarity).
- kind: metadata_error
  statement: The descriptions of the 71 TTX sessions of DANDI:001271 say TTX abolished the action potentials and
    "caused sustained depolarization during application of stimulating waves". The paper and the dandiset's own
    description say TTX prevented it, and the data agree with them (mean dF over the last 100 ms of the stimulus
    below zero after TTX at every voltage up to 10 V).
- kind: metadata_insufficient
  statement: DANDI:001271 does not mark the solution change. Sessions before it carry the same label, "without tetrodotoxin
    (vehicle control)", as vehicle sessions after it; the change of the 11 vehicle neurons was placed from gaps
    between session start times, and 3 vehicle-labelled neurons (13_20240731, 17_20240801, 4_20240730) show no such
    gap.
- kind: metadata_insufficient
  statement: The files of 001271, 001272 and 001032 to 001035 hold 16 x 16 frames, where the paper describes 64
    x 64 images after 4 x 4 binning, with no soma ROI, no stimulus record and no stimulus onset; the timing (50
    ms onset, 250 ms) is from the Methods and agrees with the aliased stimulus at 10 and 12 V (52 to 299 ms) and
    with the AP times.
- kind: other
  statement: In every file of 001271, 001030 and 001032 to 001035 the first frame is 1.5 to 24 times brighter than
    the rest and the last frame a few percent brighter than the one before, which no description mentions.
- kind: other
  statement: All 178 data arrays of DANDI:001034 are identical to those of DANDI:001032, with the same start times,
    under other subject identifiers (1_3 for 1_1 and so on); the same recordings are deposited twice as parts 1
    and 3.
- kind: metadata_error
  statement: Some subjects of DANDI:001032 hold sessions of more than one cell. The 20-kHz sessions of 13_1 show
    the same image as the sessions of 14_1 (correlation 0.997) and correlate 0.09 with 13_1's 2-kHz sessions; 9
    subjects of 001032, 001033 and 001035 have pairs of sessions whose mean frames correlate below 0.8.
- kind: identifier_missing
  statement: In DANDI:001030 each file is its own subject, named by cell and voltage (c7_1,0V is cell 7 at 1.0 V,
    not 0 V), so the four cells are identified only by the file names; two c5 recordings (1.5 and 2.0 V) end at
    1,914 ms, before the 2-s stimulus ends.
- kind: data_missing
  statement: DANDI:001272 holds 3 Di-8-ANEPPS neurons, where the paper reports experiments on eight.
- kind: data_missing
  statement: No 250-ms recordings in the low-conductivity NaGlu solution (Figures 3A and 3B) were found in the paper's
    dandisets read here (001030 to 001035, 001271, 001272).
- kind: metadata_insufficient
  statement: The descriptions of 001032 to 001035 say the actual amplitude is smaller than the stated voltage by
    frequency-dependent calibration factors "reported separately"; the factors are not in the dandisets, so fields
    at 2 and 20 kHz cannot be compared exactly. 001030 and 001032 to 001035 do not name the paper in their metadata,
    and the paper does not say which figure is in which dandiset.
- kind: methods_unavailable
  statement: Question for the paper's authors. How was the soma ROI drawn on the deposited 16 x 16 crops, which
    the soma nearly fills (the whole crop, or an outline), and by what rule were APs counted? The claims file's
    Otsu ROIs are often a few pixels of membrane, and the outcome of figs2-ttx-abolishes-aps, figs2-vehicle-keeps-response
    and ap-amplitude-duration depends on this choice; the whole frame gives no AP after TTX in any of 31 pairs.
    The AP height level matters too, for fig2-modulated-locks-to-beats through one noisy session (pre-onset SD
    9.8% dF), where a fixed 5% dF level counts three APs in one beat and a 5-SD level counts none.
- kind: methods_unavailable
  statement: Question for the paper's authors. How was sustained depolarization measured? The plateaus in 001271
    at the highest field are 0.6 to 5.4% dF (median 2.6%) with small oscillations, below the claims file's levels
    (5 pre-stimulus SD, or half the AP height, with no AP in the last 100 ms), so that no session qualifies and
    four claims are blocked or fail on it.
- kind: methods_unavailable
  statement: Question for the paper's authors. Which session pairs were compared before and after the vehicle change
    (every field, or the highest), which APs and which duration measure give 11.3% and 8 ms, and which heat capacity
    and field (peak or RMS) give 2.5 C at 63 V/cm? Each choice changes an outcome here.
