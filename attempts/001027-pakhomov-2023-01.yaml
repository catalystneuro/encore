findings:
- kind: data_missing
  statement: The dandiset holds only the Figure 8 experiment, ten monolayer images (Packet 1, 3
    dishes; Packet 2, 4; Packet 3, 3; first pulse 4 kV, one rotation, small array). The single-cell
    time-lapse of Figure 4 and the monolayer experiments of Figures 5, 6, 7 and 9 are not in it,
    and the paper names no other archive, so 15 of the 18 claims cannot be tested.
- kind: metadata_error
  statement: The packet labels of the files labelled Protocol 2 and Protocol 3 appear exchanged
    with respect to the paper. The files labelled Protocol 3 (8 phases with 5-us delays) show the
    strongest central focusing (center 125 to 137% of the most peripheral ROIs per dish, raw) and
    the least uptake next to the electrodes, which the paper reports for Packet 2 (8 phases without
    delays), and the files labelled Protocol 2 show 63 to 106%, as the paper reports for Packet 3.
    With the two labels exchanged the order of Figure 8B appears. The dandiset alone cannot say
    whether its labels or the paper's figure are exchanged; each file's description defines the
    protocols as the paper defines the packets, so the data were tested as labelled and the
    question is unresolved.
- kind: metadata_insufficient
  statement: The images have no pixel size (ImageSeries resolution is 96 in nine files and 1.0 in
    one, unit "n.a."), so distances, which the paper's ROIs are defined by (+/-1.65 mm), rest on the
    camera's pixel and the objective. The files do not record where the electrodes are or which is
    e1, so they were found in the images and a reading that needs e1 could not be run. Exposure and
    gain are not recorded; the three Packet 1 dishes, imaged on 24 March 2021, have about twice the
    background of the seven others (mean 308 a.u., against 162 and 150 on 17 and 18 March), so
    a.u. values may not be comparable
    between imaging days.
- kind: metadata_error
  statement: The dandiset's species summary is "Cricetulus griseus - Cricetulus aureus" for one
    cell line (CHO, Chinese hamster); each subject is a dish with age P1D, which does not apply to
    a cell line. The file of dish 10 names no microscope, camera or objective, where the other nine
    name the ORCA-Flash4.0 and a 10x objective, and its session starts on 18 March 2021 at 18:50,
    the evening after the other Packet 2 and 3 dishes.
