- claim: fig8a-equal-center-uptake
  outcome: not_reproduced
  notebook: reproduce_pakhomov_2023.ipynb
  output: claim:fig8a-equal-center-uptake
  measured:
  - 383.4
  - 648.7
  notes: Main reading (ROIs over +/-1.65 mm, 46 per diagonal, both diagonals, center the mean of the
    two ROIs flanking 0, raw intensities), center means 648.7 a.u. (Packet 1), 388.5 (Packet 2) and
    383.4 (Packet 3); measured gives the lowest and highest of the three. None is within 193.5 to
    258.5, and Packet 1 differs from Packets 2 and 3 by the two-sided t-test (p = 0.00044 and
    0.00093). All 48 readings give not reproduced; with the background subtracted Packet 1 is 332.5
    to 381.1 a.u. and its largest p-values against the others are 0.047 and 0.026. Packets 2 and 3
    do not differ in any reading (smallest p 0.174) and, with the background subtracted, are 213.4
    to 225.2 and 171.5 to 232.8 a.u. The Packet 1 dishes were imaged on another day with a
    background about twice as high (mean 308.1 a.u., against 161.8 on 17 March and 150.3 on 18
    March); as a ratio to each dish's own
    background the centers are 2.11, 2.37 and 2.50, and only Packet 1 against Packet 3 differs
    (p = 0.047). Exchanging the Protocol 2 and 3 labels does not change this claim's outcome. The
    failure rests largely on the Packet 1 dishes and so on a difference between imaging days; a gain
    or exposure difference would scale all values and would not be removed by subtracting a
    background, and the files record neither, so this is unresolved. Dish 10 (no device named,
    imaged the evening after) has a center of 382.7 a.u. raw, between the other two Protocol 3
    dishes (354.4 and 413.2).
  deviations:
  - ROIs were placed by code on images reduced to 8 x 8 pixel means, with electrodes found as the
    dark footprints in each image; the paper measured ROIs in MetaMorph on the full images
    (Section 2.4).
  - The files give no pixel size; 0.65 um per pixel is taken from the ORCA-Flash4 camera (6.5-um
    pixels) and 10x objective the Methods (Section 2.4) and the files name. A placement that needs
    no scale (to 5% of the edge-to-edge diagonal short of each electrode, Section 2.4) gives the
    same outcome.
  - The ROI count, "92 ... ROI, placed along one or both diagonals" (Section 2.4), was run as 46 and
    as 92 per diagonal; the ROI shape and size, which the paper does not give, is a square as wide
    as the spacing. The center was run as the mean of the two flanking ROIs and as one ROI at 0,
    and one diagonal (each) or both. Background subtraction, which the paper does not mention for
    monolayers, was run both ways, with the background inside the electrode footprints, the only
    region of the images where cells were not exposed (the files hold no cell-free region). Every
    reading gives the same outcome. With one ROI at 0 the ROI centers run to +/-1.65 mm, so the
    outermost ROIs reach about half a step past the stated span.
- claim: fig8a-more-uptake-near-electrodes
  outcome: not_reproduced
  notebook: reproduce_pakhomov_2023.ipynb
  output: claim:fig8a-more-uptake-near-electrodes
  measured:
  - 296.2
  - 806.9
  - 480.9
  notes: Main reading (mean of the ROIs closest to the four electrodes, raw), 806.9 a.u. (Packet 1),
    480.9 (Packet 2) and 296.2 (Packet 3); measured gives the lower and higher of Packets 1 and 3,
    then Packet 2. Packet 3 is below Packet 2 (t = -3.88, p = 0.012), where the claim has it above.
    Packet 3 is below Packet 2 in all 48 readings (t from -5.3 to -1.84), so every reading gives not
    reproduced. Packet 1 exceeds Packet 2 in every reading (t from 1.61 to 10.35, p from 0.00015 to
    0.168). Reading (b), the ROI next to e1, cannot be decided because the files do not identify e1.
    With the same image label as e1 in every dish, all 64 readings give not reproduced (main
    geometry, raw, Packet 3 against Packet 2 is 238.8 against 439.7, 317.6 against 579.6, 270.2
    against 446.7 and 358.1 against 457.4 a.u.). Taking in each dish the end most favourable to the
    claim, all 16 readings give not reproduced (Packet 2 166.6 to 377.5 a.u., t for Packet 3 over
    Packet 2 from -0.5 to 0.71). Over all 1,048,576 assignments of e1 to the four electrodes of the
    ten dishes, none gives reproduced or partially reproduced in any reading. With the Protocol 2
    and 3 labels exchanged, 43 of 48 readings still give not reproduced (with the background
    subtracted, Packet 1 is 498.8 a.u., above 385, and Packet 3 over Packet 2 has p = 0.029).
  deviations:
  - ROI placement, scale and readings as in fig8a-equal-center-uptake.
  - Reading (b) of the criterion, the ROI closest to e1, cannot be decided, as the files do not say
    which electrode is e1 and the electrodes were labelled by angle in each image; it was run with
    each label as e1 in every dish, with the end most favourable to the claim in each dish, and
    over every assignment of e1.
- claim: fig8b-packet2-best-targeting
  outcome: not_reproduced
  notebook: reproduce_pakhomov_2023.ipynb
  output: claim:fig8b-packet2-best-targeting
  measured:
  - 82.8
  - 129.4
  - 81.3
  notes: Main reading, each dish normalized to the mean of its four most peripheral ROIs, then
    averaged; 82.8% (Packet 2), 129.4% (Packet 3) and 81.3% (Packet 1), against 183, 83 and 74%.
    Packet 3, not Packet 2, has the highest normalized center in all 96 readings (both
    normalizations), and Packet 2 is 52.5 to 123.7%. Per dish the Protocol 3 files exceed the
    Protocol 2 files (t = 4.25, p = 0.008). With the Protocol 2 and 3 labels exchanged, the main
    geometry gives 162.3, 76.4 and 70.2% with the background subtracted (81.3, 129.4 and 82.8% raw),
    and the claim would be partially reproduced in 92 of 96 readings and reproduced in 2. Reading
    (b), normalizing to the ROI next to e1, cannot be decided because the files do not identify e1.
    With the same image label as e1 in every dish, all 256 readings give not reproduced. Choosing
    e1 in each dish to suit the claim (the lowest end in each Packet 2 dish, the highest in each
    Packet 1 and 3 dish) gives partially reproduced in 27 of 64 readings, all with 92 ROIs per
    diagonal. Over all 1,048,576 assignments of e1, none gives reproduced, none gives partially
    reproduced with 46 ROIs per diagonal, and at most 1.5% do with 92. The outcome is decided by
    reading (a), which can be run. Each dish's profile has its group's shape (every Protocol 3 dish
    peaks at the center, every Protocol 2 dish is highest at the electrode ends), so the
    difference does not come from one dish.
  deviations:
  - ROI placement, scale and readings as in fig8a-equal-center-uptake; the normalization was run
    per dish and on the mean profile, as the criterion names.
  - Reading (b) of the most peripheral ROI, next to e1, cannot be decided, as the files do not
    identify e1; it was run with each label as e1, with the most favourable end in each dish, and
    over every assignment of e1, and does not decide the outcome.
