findings:
- kind: metadata_insufficient
  about: data
  severity: major
  statement: The electrodes table gives no position for the recording sites, only each channel's
    place in its shank's list in the lab's .xml file, and does not say which place is which depth.
    The DS2 profile does not settle it either. On the 261 shanks where the DS2 reverses, its
    amplitude rises with the list place on some shanks and falls on others (Spearman below 0 on
    0.43), and the sign changes between days of one mouse. The probe description names 8 sites per
    shank, but some mice's shanks hold 10. The paper's GC to MC distance (Figure 3D) and the spike
    delay along the shank (Figure S3) cannot be computed.
- kind: metadata_error
  about: data
  severity: minor
  statement: The trials' arm_start is described as the time the mouse entered the central arm, but
    at that time the lab's central-arm position is 27.3 cm into the 65 cm arm (median over 1246
    light-free runs; 10th to 90th percentile 24.6 to 29.2 cm).
- kind: other
  about: data
  severity: minor
  statement: The stored spike waveforms span 1.6 ms (32 samples), and for 44% of granule cells and
    69% of mossy cells the waveform peak after the trough falls at the end of that window, so
    trough-to-peak latencies from them are lower bounds. With the wide-band waveform, in the 17
    files that hold it, the unfiltered waveform gives GC and MC latencies of 0.770 and 0.800 ms (P =
    0.175) to the largest later sample and 0.610 and 0.700 ms (P = 8e-10) to the first local peak,
    while the stored waveforms give 0.710 against 0.740 ms (P = 4e-14). The files do not say whether
    the stored waveforms (the lab's .spk files) were filtered; neither the units table's description
    nor the waveforms' attributes state a filter. One file (YutaMouse33-150218) has no stored
    waveforms, as its description says.
- kind: other
  about: data
  severity: minor
  statement: 13 of the 101 files have no monosynaptic_connections table, and the files do not say
    whether the authors found no pair in those sessions or did not analyse them.
- kind: other
  about: data
  severity: none
  statement: The files agree with the paper's counts. The labels give 583 GC and 503 MC (paper 586
    and 500) and 248 dentate narrow-waveform interneurons (paper 248; wide-waveform 258 against
    268). The DRD2-Cre::Ai35 files hold 106 MC, 198 GC, 62 wide- and 68 narrow-waveform dentate
    interneurons (paper 107, 202, 68, 69), and drd2_tagged marks 29 MC, as the paper, all of them
    suppressed by light in the data. The authors' monosynaptic table holds the paper's 32 GC to MC
    pairs and no MC to GC pair, 18 of them in T-maze files as in Figure 7A; its zero-lag table gives
    22.1% of MC with a same-type partner (paper 23%). The open-field files hold 246 GC, 182 MC and
    317 CA3 units (paper 247, 181, 317).
- kind: other
  about: data
  severity: none
  statement: Checks that passed. The seven same-day 'b' files are separate recordings (different
    spans, no shared spike counts, distinct global_ids), not duplicate files, and no global_id
    repeats (whether they hold the same neurons is the last finding). The hilus_reference channel
    has a positive DS2, as at a hilar site, in all 91 files with a DS2 profile, the largest of its
    shank in 61.
    The channel of the largest stored waveform, through the electrodes table, is the channel of the
    largest wide-band spike for 335 of 376 GC and MC (89%), with a median DS2 amplitude difference
    of 0 uV between the two. Spikes share the clock of the DS2 events (the GC and MC peak ratio
    falls with DS2 times shifted by 0.5 s in 80 of 81 files; in YutaMouse44-151130, with few GC
    and MC, it could not be shown), of the positions (spatial information falls from 0.100 and
    0.323 to 0.048 and 0.057 bits/s with spikes shifted 60 s, in two T-maze files) and of the light
    pulses (all 29 tagged MC suppressed at +2 to +15 ms).
- kind: methods_unavailable
  about: paper
  statement: The Methods define a T-maze place field as a region "above 50% of the local maximum
    firing rate" but not how local maxima are found when a map has several peaks. This attempt takes
    the highest remaining bin, its region, then the next; the count of fields per unit, and so
    tmaze-multiple-fields and inheritance-tmaze, depend on this. How were local maxima found?
- kind: methods_unavailable
  about: paper
  statement: For DRD2-Cre::Ai35 mice the Methods identify mossy cells by a decrease of at least 20%
    "in +2 to +15ms bins", and the Results say "suppressed significantly". A 20% decrease of the
    mean rate over the window, against either baseline, finds 68 of 106 MC suppressed (paper 29 of
    107), and a significance test does not lower this. A 20% decrease in every 1 ms bin against the
    20 ms before the pulse finds 28 of 106, and 28 of the 29 MC the files tag. Was the rule applied
    to each bin, and what baseline window and what significance test were used?
- kind: methods_unavailable
  about: paper
  statement: The automatic CCG test of the Methods finds 63 GC to MC and 8 MC to GC pairs; the
    authors' curated table holds 32 and 0. The manual inspection that "excluded the contamination
    from the long-time scale trend" changes the fraction (monosyn-gc-to-mc) and the state result
    (state-transmission, P = 0.52 on the 63 pairs, 0.018 on the 32). What criteria did the
    inspection apply?
- kind: methods_unavailable
  about: paper
  statement: The T-maze analysis window runs "from the gate opening to the arrival to the reward
    location", but the files mark no gate opening; this attempt starts each run at the mouse's
    entry into the central arm. Where does the gate opening fall relative to the files' trial
    times?
- kind: other
  about: data
  severity: minor
  statement: The files do not say whether the two files recorded on the same day (the seven 'b'
    files and their partners) hold the same neurons, which carry different global_ids. In
    YutaMouse51 on 16 May, 5 of the 9 GC, MC or CA3 units of the 'b' file (0.56) have a same-type
    unit on the same shank in the other file of the day whose mean waveform correlates above 0.95
    with theirs, against none of 9 in a file of another day. In the other six pairs at most 0.38 of
    the units do, no more often than with another day, so the data do not settle it. If the same
    neurons are in both files, a few units are counted twice.
