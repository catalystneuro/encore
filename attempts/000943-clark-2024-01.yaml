    (docs/protocol.md, Author, step 3); this is a lower bound, as sorting time comes on top and was not measured.
    The sort was not started. It also depends on grid-cell-count. The parts that need no units were compared in
    the data check, not as a test of the claim. The dandiset has 242 VR sessions on the 200 cm track with at least
    10 trials for the nine mice (paper 215), 27 more, outside the claim's tolerance of 21.5; per mouse M1 11 (11),
    M3 30 (26), M6 21 (21), M7 28 (23), M10 25 (16), M11 35 (35), M12 28 (21), M13 27 (25), M14 37 (37), so five of
    nine are within 10% of the table and M3, M7, M10 and M12 exceed it by 15%, 22%, 56% and 33%. The mean over the nine mice of each mouse's mean trials per session is 183.9 (paper 179.1). The paper
    counts only sessions with kept units, which the dandiset cannot show, so the excess sessions may be sessions
    without kept units. Cells and grid cells per mouse need the units.
