findings:
- kind: data_missing
  statement: The files hold only 600 s, 4-channel LFP epochs around seizures (one ElectricalSeries per seizure,
    starting_time 0). There are no seizure onset or end times, no stimulation times, no interictal recordings and
    no recording durations, so seizure frequency, seizure duration proportion and every interictal IIS and HFO measure
    of the paper cannot be computed, and seizure times and stimulation trains have to be inferred from the LFP.
- kind: metadata_insufficient
  statement: The epoch names carry the date only (in two formats, `R1_2023_7_16` and `R4_2023_9-11`) and the series
    start at 0 s, so the time of day and the order of seizures within a day are not recorded; how the 600 s windows
    were cut, and what the suffix `-small` on some epoch names means, is not described.
- kind: other
  statement: The order of the stimulation groups differs from Figure S2 for two rats. In the dandiset R5 is stimulated
    at CA1, ANT, DG, CA3 (Figure S2 ANT, DG, CA1, CA3) and R6 at ANT, DG, CA1, CA3 (Figure S2 CA1, ANT, DG, CA3).
    The epoch dates follow the dandiset's order. This changes which baseline group precedes each stimulation group
    in these rats.
- kind: other
  statement: 'No stimulation artifact is found in most seizures of some stimulation groups: trains are found in
    7 of 12, 3 of 13, 2 of 7 and 0 of 4 seizures of R7''s DG, ANT, CA1 and CA3 groups, against every seizure of
    the other 24 groups. Of the R7 seizures without a train, none in the CA1 and CA3 groups has a run of comb score
    of 2 s or more at R7''s pulse rates, while in the DG and ANT groups 3 of 5 and 3 of 10 have a run of 2 to 3.75
    s inside the seizure, shorter than the 5 s trains of Methods C. Whether stimulation was delivered in these seizures
    cannot be told from the files.'
- kind: metadata_error
  statement: The epochs of R3's CA1 stimulation group (07CA1-stim) are dated 2023-10-18 to 10-20, inside the dates
    of R3's DG stimulation group (05DG-stim, 10-18 to 10-22) and before R3's last baseline group (06base3, 10-22
    to 10-23), against the alternating order the paper describes; its trains have the pulse rate of 05DG-stim (131.75
    Hz), not that of R3's first two stimulation groups (125.25 and 125.75 Hz). Other groups share single dates with
    the next group (R1 2023-09-20, R3 09-09 and 09-25, R4 09-15 and 09-17, R7 2024-01-03).
- kind: other
  statement: 'Seven baseline epochs carry 4.25 to 5.5 s trains at the pulse rate of their rat''s own stimulator:
    R1-04 (R1_2023_8_29-ictal1, three trains; R1_2023_8_30-ictal1), R4-00 (R4_2023_9_6-ictal1, -ictal2 and -ictal3),
    R5-00 (R5_2023_10_25-ictal1) and R6-02 (R6_2023_9_17-ictal1), so these baseline seizures appear to have been
    stimulated.'
- kind: methods_unavailable
  statement: Questions for the paper's authors. (1) How were seizure onset and end marked offline, and are the times
    available? (2) The GC settings - VAR model order, any filtering or downsampling, and the test behind 'significantly
    high' cf_w - and whether cf_w is out minus in (as Figure 2 and the Discussion imply) or in minus out (as Methods
    B words it). (3) The formula of the normalized seizure duration. (4) The HFO App settings (detector parameters
    and the length of the epoch the threshold is computed over), and the pre and post windows used for ictal HFOs,
    in particular whether the post window stops at the next train. (5) How the 180 s IIS curves of Figure 5B were
    tested, and which baseline set the 5 SD threshold. This attempt assumed an LFP line-length rule for (1), BIC
    order and out minus in for (2), relative change for (3) and the HFO App dialog defaults over the 600 s file
    epoch, with the post window cut at the next train, for (4).
- kind: metadata_error
  found: on_prompt
  severity: minor
