findings:
- kind: data_missing
  statement: The files hold only 600 s, 4-channel LFP epochs around seizures (one ElectricalSeries
    per seizure, starting_time 0). There are no seizure onset or end times, no stimulation times, no
    interictal recordings and no recording durations, so seizure frequency, seizure duration
    proportion and every interictal IIS and HFO measure of the paper cannot be computed, and seizure
    times and stimulation trains have to be inferred from the LFP.
- kind: metadata_insufficient
  statement: The epoch names carry the date only (in two formats, `R1_2023_7_16` and `R4_2023_9-11`)
    and the series start at 0 s, so the time of day and the order of seizures within a day are not
    recorded; how the 600 s windows were cut, and what the suffix `-small` on some epoch names means,
    is not described.
- kind: other
  statement: The order of the stimulation groups differs from Figure S2 for two rats. In the
    dandiset R5 is stimulated at CA1, ANT, DG, CA3 (Figure S2 ANT, DG, CA1, CA3) and R6 at ANT, DG,
    CA1, CA3 (Figure S2 CA1, ANT, DG, CA3). The epoch dates follow the dandiset's order. This changes
    which baseline group precedes each stimulation group in these rats.
- kind: other
  statement: No stimulation artifact is found in most seizures of some stimulation groups. Trains
    are found in 1 of 12, 1 of 13, 0 of 7 and 0 of 4 seizures of R7's four stimulation groups, in 0 of
    8 of R3's CA1 group (R3-07) and in 3 of 8 of R5's CA3 group, against most seizures of the other
    groups. Whether stimulation was delivered in these seizures cannot be told from the files.
- kind: metadata_error
  statement: The epochs of R3's CA1 stimulation group (07CA1-stim) are dated 2023-10-18 to 10-20,
    inside the dates of R3's DG stimulation group (05DG-stim, 10-18 to 10-22) and before R3's last
    baseline group (06base3, 10-22 to 10-23), against the alternating order the paper describes; none
    of them shows a stimulation train. Other groups share single dates with the next group (R1
    2023-09-20, R3 09-09 and 09-25, R4 09-15 and 09-17, R7 2024-01-03).
- kind: other
  statement: Four baseline epochs carry 5 s trains at the pulse rate of the rat's own stimulator,
    R1-04 (R1_2023_8_29-ictal1, three trains; R1_2023_8_30-ictal1), R4-00 (R4_2023_9_6-ictal3, three
    trains) and R6-02 (R6_2023_9_17-ictal1, two trains), so these baseline seizures appear to have been
    stimulated.
- kind: methods_unavailable
  statement: Questions for the paper's authors. (1) How were seizure onset and end marked offline,
    and are the times available? (2) The GC settings - VAR model order, any filtering or
    downsampling, and the test behind 'significantly high' cf_w - and whether cf_w is out minus in
    (as Figure 2 and the Discussion imply) or in minus out (as Methods B words it). (3) The formula
    of the normalized seizure duration. (4) The HFO App parameters (window, threshold, filter) and the
    pre and post windows used for ictal HFOs. (5) How the 180 s IIS curves of Figure 5B were tested,
    and which baseline set the 5 SD threshold. This attempt assumed an LFP line-length rule for (1),
    BIC order and out minus in for (2), relative change for (3) and mean + 3 SD of the pre-seizure
    short line length for (4).
