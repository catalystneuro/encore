- claim: fig6e-ictal-ripples-no-difference
  outcome: reproduced
  assumed: true
  notebook: reproduce_yang_2025.ipynb
  output: claim:fig6e-ictal-ripples-no-difference
  notes: Paired t-test by rat (reading (a)), target against non-target normalized ictal ripple rate,
    p = 0.26 over 7 rats (target +2.29, non-target +3.48; unpaired over groups p = 0.45). In one of
    the 8 method readings (5 SD threshold, stimulated channel, pre-seizure reference) the test is
    significant (p = 0.019, target lower). Rates rise from the pre to the post window in every
    condition here, while Figure 6E shows small decreases; the measure is not the paper's.
  deviations:
  - HFO are automatic short line length detections without the paper's manual review. The paper
    gives no detector parameters; assumed a 5 ms window and a threshold of mean + 3 SD (5 SD shown)
    of the short line length over the 180 s before onset, with the seizure's own windows as an
    alternative reference. The HFO App's own defaults could not be read here (MATLAB).
  - Windows as Methods D (claims file); stimulation windows from the detected trains, so most of
    R7's stimulation seizures are left out.
  - The group value is its mean post rate over its mean pre rate minus 1, so that windows without a
    pre event do not divide by zero.
