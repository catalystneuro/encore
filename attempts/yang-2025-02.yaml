- claim: tables1-network-stable-short-term
  outcome: reproduced
  assumed: true
  notebook: reproduce_yang_2025.ipynb
  output: claim:tables1-network-stable-short-term
  measured: [0.698, 0.22, 0.262, -0.042, 0.657, 0.491, 0.555, 0.47, 0.511, 0.355, 0.7, 0.496, 0.596,
    0.513]
  notes: Reproduced under readings (a) and (d) of the criterion (each pair once, self pairs
    included), with 1 kHz GC and the main onset. Intra-group r exceeds inter-group r with
    Mann-Whitney p < 0.05 in all 7 rats, and 13 of 14 means lie within the Table S1 SDs (R5
    inter-group 0.355 against 0.71 +- 0.28 does not). The outcome depends on the self-pairs reading,
    which adds an r of 1 per seizure to the intra-group set. With self pairs excluded, the test holds
    in 4 rats (R1, R2, R3, R6; R4, R5 and R7 have intra and inter means within 0.02 to 0.03 of each
    other) with 11 of 14 means within tolerance, and in 6 rats with the onset thresholds 1.5 or 3
    (14 and 10 means within tolerance). With 250 Hz GC and self pairs excluded, 2 or 3 rats.
  deviations:
  - Seizure onset is not in the dandiset and the paper gives no rule for it. Assumed, as reading (b)
    of the claims file's opening comment, an onset found from the LFP (1-45 Hz line length in 1 s
    windows, largest over channels of the ratio to the channel's median, above 2, with hysteresis
    down to 1.5); thresholds 1.5 and 3 are shown.
  - Conditional GC is computed here from OLS VAR fits (full and reduced regressions), not with the
    MVGC toolbox (Methods B, ref. 37), which obtains the reduced model by spectral factorization.
    Model order by BIC up to 20 (a standard choice named in the claims file); the median order is
    11 at 1 kHz. Decimation to 250 Hz is shown as a variant.
  - The two readings of combining the 9 windows are the same number, as cf_w is linear in the GC
    matrix; the cf_w sign does not change Pearson r.
- claim: fig2-r1-target-shifts
  outcome: reproduced
  assumed: true
  notebook: reproduce_yang_2025.ipynb
  output: claim:fig2-r1-target-shifts
  notes: With cf_w as out-strength minus in-strength (reading (a)), 1 kHz GC and the main onset, the
    nodes with the highest mean cf_w in R1's four baseline groups are ANT, ANT, CA3 and DG, as
    named. The single-seizure top node agrees with its group's in 9 of 9, 8 of 10, 4 of 5 and 6 of
    11 seizures. The groups hold 9, 10, 5 and 11 seizures (Figure 2A shows 9, 9, 7, 9). Variants give
    3 of 4 (250 Hz), 4 of 4 (onset threshold 3) and 2 of 4 (onset threshold 1.5); with the sign as
    worded in Methods B (in minus out), 0 of 4.
  deviations:
  - Seizure onset found from the LFP, as for tables1-network-stable-short-term (an assumption).
  - GC computed here, not with MVGC, as for tables1-network-stable-short-term.
- claim: figs2-target-assignment
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_yang_2025.ipynb
  output: claim:figs2-target-assignment
  measured: [8, 20]
  notes: Under reading (a), the top node, with 1 kHz GC and cf_w as out minus in, 18 of 28 baseline
    groups give the Figure S2 target set (R1, R3, R4 and R7 four of four, R2 one, R5 none, R6 one).
