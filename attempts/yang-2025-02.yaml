- claim: fig3a-target-reduces-each-rat
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_yang_2025.ipynb
  output: claim:fig3a-target-reduces-each-rat
  notes: Mean normalized duration (relative change against the preceding baseline group's mean) is below zero in
    3 of the 8 target groups (R3 CA3 -0.026, R6 CA3 -0.172, R7 ANT -0.200); R1 DG +0.100, R2 DG +0.070, R2 CA1 +0.080,
    R4 CA3 +0.019, R5 ANT +0.014. The three normalizations share the sign. Under the variants (thresholds 1.5 and
    3, ending before a final train, stimulated seizures only, groups with trains in most seizures, baseline by epoch
    dates or in Figure S2's order, baseline seizures with trains left out) 2 to 4 of 8 are below zero.
  deviations:
  - Seizure onset and end found from the LFP (an assumption, as reading (b) of the claims file); in stimulation
    groups, detected stimulation trains count as ictal and the seizure is the run holding the first train. The paper's
    durations may come from visual marking. No stimulated seizure has a further train within 12 s after its detected
    end.
  - Target and non-target labels by rat and site from Figure S2, as the claims file says; the preceding baseline
    is the previous file of the dandiset. R3-07 (CA1) is dated before R3-06, its preceding file; taking the baseline
    by the epoch dates (R3-04) is shown as a variant.
  - Stimulation trains are found from the LFP (the files have no stimulation times) as runs of comb score of at
    least 4 s, at the pulse rate (120 to 145 Hz in 0.25 Hz steps, 125 Hz = fs / 8 left out) that gives the most
    train time in the epoch. Choosing the rate by the 99th percentile of the score alone, as in the first version,
    missed every train of R3-07 (trains in 0 of its 8 seizures, now 8) and most of R7-01 (1 of 12, now 7), and found
    false 125 Hz trains in baseline epochs.
