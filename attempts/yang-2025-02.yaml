- claim: fig4b-psd-target-bands
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_yang_2025.ipynb
  output: claim:fig4b-psd-target-bands
  notes: In none of the 36 readings (change measure, Welch segment, total range, channels, post hoc
    adjustment) do the three bands hold under either band reading, nor alpha and gamma together. Main
    reading (relative change, 1 s segments, 0.5-120 Hz, all channels; 266 sham, 66 target, 106
    non-target seizures) shows theta falling after target stimulation (median -0.45, sham -0.03,
    non-target -0.34; Kruskal-Wallis p = 2.3e-13), alpha not differing (p = 0.093), beta higher
    without significance (p = 0.068) and gamma differing (p = 0.045) with target below sham (Dunn
