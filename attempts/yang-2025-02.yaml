- claim: fig4b-psd-target-bands
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_yang_2025.ipynb
  output: claim:fig4b-psd-target-bands
  notes: 'In none of the 72 readings (window, change measure, Welch segment, total range, channels, post hoc adjustment)
    do the three bands hold under either band reading, nor alpha and gamma together. Relative change and log2 ratio
    give the same Kruskal-Wallis and Dunn p values, so 48 of the 72 readings are distinct tests. Main reading (main window,
    relative change, 1 s segments, 0.5-120 Hz, all channels; 266 sham, 75 target, 153 non-target seizures): theta
    falls after target stimulation (median -0.41, sham -0.04, non-target -0.33; Kruskal-Wallis p = 5.9e-12), alpha
    differs (p < 0.001) with the target median (0.48) between sham (0.62) and non-target (0.25), beta differs (p
    = 0.044) with target not above sham (Dunn p = 0.80), and gamma does not differ (p = 0.17). With the difference
    measure on the stimulated channel, beta is higher after target stimulation than after sham and non-target (Dunn
    p 0.0004 and 0.0013); alpha holds in no reading. Gamma holds in one reading, the difference measure on the stimulated
    channel with the 0-500 Hz total and unadjusted Dunn tests (Kruskal-Wallis p = 0.036, Dunn p 0.011 against sham
    and 0.022 against non-target), where alpha does not (p = 0.53). The window as worded, the same without the 48
    seizures whose next train falls in it, and a 5 s pre window give no reading that holds either, nor does the main
    reading with the 7 baseline seizures that carry trains left out of the sham set.'
  deviations:
  - Stimulation trains are found from the LFP (the files have no stimulation times) as runs of comb score of at
    least 4 s, at the pulse rate (120 to 145 Hz in 0.25 Hz steps, 125 Hz = fs / 8 left out) that gives the most
    train time in the epoch. Choosing the rate by the 99th percentile of the score alone, as in the first version,
    missed every train of R3-07 (trains in 0 of its 8 seizures, now 8) and most of R7-01 (1 of 12, now 7), and found
    false 125 Hz trains in baseline epochs.
  - Windows of Methods D ("the pre-stimulation period was from seizure onset to stimulation start, while the post-stimulation
    period was 5s after the first stimulation train"). Assumed for the main reading that the post window ends where
    the next train starts when that is within the 5 s (48 of 228 stimulation seizures), so that the next train's
    artifact stays out; the window as worded, the same leaving those seizures out, and a 5 s pre window are run
    as variants. Stimulation seizures with no train after onset (most of R7's ANT, CA1 and CA3 groups) are left
    out.
  - Seizure onset found from the LFP, as for tables1-network-stable-short-term (an assumption).
