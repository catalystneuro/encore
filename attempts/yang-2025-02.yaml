    target stimulation than after sham and non-target (p < 0.001 and 0.006), but alpha and gamma do
    not differ.
  deviations:
  - Stimulation windows from the trains found in the LFP (the files have no stimulation times);
    stimulation seizures with no train after onset (most of R7's and all of R3 CA1's) are left out.
  - Seizure onset found from the LFP, as for fig3a-target-reduces-each-rat.
