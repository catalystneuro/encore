- claim: tables1-network-stable-short-term
  outcome: reproduced
  assumed: true
  notebook: reproduce_yang_2025.ipynb
  output: claim:tables1-network-stable-short-term
  measured:
  - 0.698
  - 0.22
  - 0.272
  - -0.04
  - 0.663
  - 0.489
  - 0.555
  - 0.47
  - 0.531
  - 0.32
  - 0.706
  - 0.501
  - 0.596
  - 0.513
  notes: Reproduced under readings (a) and (d) of the criterion (each pair once, self pairs included), with 1 kHz
    GC and the main onset. Intra-group r exceeds inter-group r with Mann-Whitney p < 0.05 in all 7 rats, and 13
    of 14 means lie within the Table S1 SDs (R5 inter-group 0.32 against 0.71 +- 0.28 does not). The outcome depends
    on the self-pairs reading, which the criterion names but which adds an r of 1 per seizure to the intra-group
    set and so favours intra over inter. With self pairs excluded (reading (c)) the test holds in 5 rats (R1, R2,
    R3, R5, R6; R4 p = 0.88, R7 p = 0.66), which would be partially reproduced, with 13 of 14 means within tolerance;
    in 6 rats with the onset thresholds 1.5 or 3; and in 2 or 3 rats with 250 Hz GC. The VAR fits are stable in
    all but 2 of 266 seizures, but their residuals are not white at the BIC order (Ljung-Box p < 0.05 in 83% of
    channel-windows at the median seizure). At a fixed order of 40 the residuals are close to white (median share
    0.00, at most 0.33), though the largest modulus is 1.000 at the median seizure and 54 of 266 seizures have a
    window that is not stable; reading (d) again holds in 7 rats with 12 of 14 means within tolerance, and reading
    (c) in 4 (R1, R2, R3, R6). With the 7 baseline seizures that carry trains left out, the counts are those of
    the main reading.
  deviations:
  - Seizure onset is not in the dandiset and the paper gives no rule for it. Assumed, as reading (b) of the claims
    file's opening comment, an onset found from the LFP (1-45 Hz line length in 1 s windows, largest over channels
    of the ratio to the channel's median, above 2, with hysteresis down to 1.5); thresholds 1.5 and 3 are shown.
  - Conditional GC is computed here from OLS VAR fits (full and reduced regressions), not with the MVGC toolbox
    (Methods B, ref. 37), which obtains the reduced model by spectral factorization. Model order by BIC up to 20
    (a standard choice named in the claims file); the median order is 11 at 1 kHz. The residuals at that order are
    not white. Decimation to 250 Hz, and a fixed order of 40 at 1 kHz at which the residuals are close to white,
    are shown as variants.
  - The two readings of combining the 9 windows are the same number, as cf_w is linear in the GC matrix; the cf_w
    sign does not change Pearson r.
