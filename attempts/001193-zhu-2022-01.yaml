outcomes:
- claim: participants
  outcome: partially_reproduced
  notebook: reproduce_zhu_2022.ipynb
  output: claim:participants
  notes: The dataset holds 10 distinct subjects (TC5, TC6, TC7, TC9, TC12, TC16 to TC20), each
    with 256 electrodes in two groups of 128, so the counts of participants (10) and electrodes per
    participant (256) match. The sex field is U in every file, so 0 male and 0 female participants
    are found against 4 and 6; the numbers 4 and 6 appear only in the free-text subject description
    "chinese, 4 males and 6 females", copied into every file, which cannot be checked per subject.
    Ages are given only as the group range P19Y/P50Y, which matches the paper's 19 to 50 years but
    not the per-participant ages of Supplementary Table 1. No file says which task a participant
    did, so the 5 COM and 5 NL participants cannot be counted. No `measured` is given, as four of
    the six expected values cannot be measured.
- claim: task-structure
  outcome: blocked
  blocked_by: data_missing
  notes: The files hold no trials table, intervals, events or photodiode signal, and no condition
    labels, so neither the trials per condition nor the word timing can be read. The stimulus,
    analysis and processing groups are empty in all 40 files. Each participant has four files named
    block 1 to 4, which matches the four blocks of the Methods.
- claim: behaviour-response-time
  outcome: blocked
  blocked_by: data_missing
  notes: No button responses, response times or question onsets are in the dataset.
- claim: fig1b-high-gamma-best-band
  outcome: blocked
  blocked_by: data_missing
  notes: The dataset holds only the high-gamma activity (series description "High gamma data"),
    no broadband signal and no other band, and no condition labels or resting-state periods to
    classify.
- claim: fig1c-responsive-in-ifg
  outcome: blocked
  blocked_by: data_missing
  notes: The rest against stimulus test needs the fixation and word periods, and the IFG count
    needs anatomical labels; there are no event times, every electrode location is "unknown" and
    there are no coordinates.
- claim: fig1d-only-after-keyword
  outcome: blocked
  blocked_by: data_missing
  notes: Needs first-word and keyword onsets and condition labels, none of which is in the
    dataset; also depends on fig2b-violation-electrodes, blocked.
- claim: fig2b-violation-electrodes
  outcome: blocked
  blocked_by: data_missing
  notes: Needs keyword onsets and condition labels (CORR, SYN-P, SYN-C, SEM) for the test of V,
    the rest and stimulus periods for E, and pars opercularis and pars triangularis labels; the
