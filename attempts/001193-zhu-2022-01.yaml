    1.4) allows outside data only when pinned. The keyword list exists only in the paper's
    supplement, which the notebook cannot stream from the archive. Not run.
findings:
- kind: data_missing
  statement: No file holds trial, word or keyword event times, condition labels (CORR, SYN-P,
    SYN-C, SEM, COM, NL-CORR, NL-VIO), button responses or the photodiode signal the Methods
    describe. The stimulus, analysis and processing groups are empty and there is no trials table
    or intervals, so no analysis of the paper can be repeated, although the description says the
    dataset supports the paper's findings.
- kind: data_missing
  statement: The electrode table has no coordinates (MNI or native) and no anatomical labels; every
    electrode's location is "unknown", and the two electrode groups (Grid_1 and Grid_2, location
    "unknown") do not say which covers the IFG and which the MFG or STG. The paper's selection of
    IFG electrodes and its spatial analyses need these.
- kind: data_missing
  statement: Only the high-gamma activity is deposited. The broadband signal, or any other band,
    which the frequency analyses of Figure 1b and Supplementary Figures 3, 4 and 7c use, is not in
    the dataset.
- kind: metadata_insufficient
  statement: Every subject has sex U and age P19Y/P50Y (the range of the whole group), with the
    sentence "chinese, 4 males and 6 females" as the subject description in every file.
    Supplementary Table 1 gives each participant's sex, age and grid coverage, but nothing maps the
    subject ids TC5 to TC20 to its participants 1 to 10, and nothing says which participants did the
    COM task and which the NL task.
- kind: metadata_error
  statement: The ECoG series is stated in volts, but every channel of every file has mean 0 (within
    3e-6) and standard deviation 1 (within 1e-4); the values are z scores per channel and per block,
    as the Methods describe for the HGA.
- kind: metadata_error
  statement: The series' rate is stated as 400 Hz. At 400 Hz every block lasts 70 to 95 s, less
    than 3 s per trial for the at least 32 linguistic trials a block holds, while each trial lasts
    at least 4.3 s before the question; at 100 Hz, the rate the Methods give for the HGA, blocks
    last 282 to 381 s. The data are consistent with 100 Hz, not 400 Hz (400 Hz is the Methods' rate
    before the HGA was taken), unless each file holds under half of its block. A weak spectral check
    leans the same way (power at the 2 Hz word rate above its flanking band in 34 of 40 files under
    the 100 Hz reading, 19 of 40 under the 400 Hz reading). Without event times this cannot be
    shown directly.
- kind: metadata_insufficient
  statement: The Methods exclude bad channels and bad time intervals, but all 256 channels are
    present in every file and nothing marks which channels or intervals were excluded (filtering
    is "none" for every electrode); as each file is z scored on its own, bad channels cannot be told
    apart by scale.
