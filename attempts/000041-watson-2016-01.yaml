- claim: fig2c-acg-peaks
  outcome: partially_reproduced
  notebook: reproduce_watson_2016.ipynb
  output: claim:fig2c-acg-peaks
  notes: The nonREM autocorrelogram peaks at 7.5 ms. The smoothed REM and WAKE autocorrelograms are
    highest at the 60 ms edge of the 60 to 250 ms window, so the criterion finds no theta peak. In a
    variant that divides the 21 ms smoothing by a 101 ms one, WAKE has a maximum at 118.5 ms (ratio
    1.017) and REM at 149.5 ms (1.018). Per subject the REM maximum falls within 112.5 to 137.5 ms in
    two subjects (Bogey 135.5, Dino 125.5).
  deviations:
  - The peak location criteria (windows, 21 ms smoothing) were fixed here; the paper shows the peaks
    in a figure only.
