- claim: fig2a-median-rates
  outcome: partially_reproduced
  notebook: reproduce_watson_2016.ipynb
  output: claim:fig2a-median-rates
  measured:
  - 0.755
  - 0.662
  - 0.825
  - 3.917
  - 2.73
  - 3.062
  notes: Under reading (a) the three pE medians are within tolerance (0.755, 0.662 and 0.825 Hz)
    and the three pI medians are below it (3.92, 2.73 and 3.06 Hz, against 5.59, 4.69 and 4.25).
    Reading (b) gives the same counts (pE WAKE 0.748). The pI sample is 89 cells in 9 subjects,
