- claim: fig2a-skewed-wide-distribution
  outcome: partially_reproduced
  notebook: reproduce_watson_2016.ipynb
  output: claim:fig2a-skewed-wide-distribution
  notes: WAKE rates have skewness 4.57 and a 97.5th percentile of 7.17 Hz (within a factor of 2 of 5 Hz),
    but the 2.5th percentile is 0.0124 Hz, about four times below 0.05 Hz. 13 of 812 cells have a WAKE
    rate of zero. The log10 rates are skewed to the left (-0.74).
  deviations:
  - The paper's range is read from a log axis; the factor-of-2 tolerance was fixed in the criterion.
- claim: fig2a-fraction-above-2hz
  outcome: not_reproduced
  notebook: reproduce_watson_2016.ipynb
  output: claim:fig2a-fraction-above-2hz
  measured:
  - 17.0
  - 18.72
  - 9.11
  notes: REM (18.7%) and nonREM (9.1%) are within tolerance, WAKE (17.0%) is not. nonREM is lower than
    WAKE (chi-square 21.5, p = 3.5e-06) and REM (30.5, p = 3.4e-08), but neither test reaches p < 1e-10,
    which the criterion requires. The direction of the effect is as in the paper, with fewer cells than
    the paper had. Without the seven sessions whose LFP could not be checked against the spikes, WAKE
    is 20.2% (within tolerance) and both tests still miss p < 1e-10.
- claim: fig2b-wake-nrem-slope
  outcome: reproduced
  notebook: reproduce_watson_2016.ipynb
  output: claim:fig2b-wake-nrem-slope
  measured:
  - 0.862
  - 0.757
  notes: On log10 rates (799 cells, 13 with a zero rate left out), R = 0.862 and the slope of nonREM on
    WAKE is 0.757 (95% CI 0.727 to 0.788). In Hz the slope is 0.583 (0.560 to 0.607), outside the widened
    interval. The reverse regression on log10 rates gives 0.982 (0.942 to 1.022), so the slope below 1
    may in part be regression to the mean. Per subject the slope ranges from 0.41 to 0.91. A split-half
    control (alternate WAKE epochs of each cell) gives a slope of 0.936 between halves and a reliability
    of 0.961 for the log10 WAKE rate; corrected for this noise the slope is 0.788 (0.756 to 0.821), still
    below 1. The rest of the gap to 1 comes from the WAKE-nonREM correlation being below 1, which is also
    regression to the mean. The ratio of the SDs of log10 rates, nonREM over WAKE, is 0.878 (Pitman-Morgan
    p = 9.8e-13, 95% interval resampling sessions 0.777 to 0.971), so the spread of rates is narrower in
    nonREM.
  deviations:
  - The paper does not say whether the slope is on log or linear rates; both readings are shown and the
    log reading matches.
- claim: fig2-burst-index-by-state
  outcome: partially_reproduced
  notebook: reproduce_watson_2016.ipynb
  output: claim:fig2-burst-index-by-state
  measured:
  - 6.35
  - 2.64
  - 3.65
  notes: The order nonREM > REM > WAKE holds under both readings, with Kruskal-Wallis p = 5.7e-36 (a)
    and 7.3e-38 (b), and REM above WAKE (paired Wilcoxon p = 1e-32). Reading (a), the fraction of intervals
    under 15 ms, gives medians of 6.35, 2.64 and 3.65%, none within tolerance; reading (b), the fraction
    of spikes in such an interval, gives 11.67% in nonREM (within tolerance), 4.95% in WAKE and 6.71%
    in REM (above). The measured values are those of reading (a), the first listed. The paired Friedman
    test over the 753 cells with all three values gives p = 3.9e-151.
  deviations:
  - The definition "fraction of spikes with ISIs under 15 ms" can be read two ways; both are shown and
    neither matches all three medians.
- claim: fig2c-acg-peaks
  outcome: partially_reproduced
  notebook: reproduce_watson_2016.ipynb
  output: claim:fig2c-acg-peaks
  notes: The nonREM autocorrelogram peaks at 8.5 ms. The smoothed REM and WAKE autocorrelograms are highest
    at the 60 ms edge of the 60 to 250 ms window, so the criterion finds no theta peak. In a variant that
    divides the 21 ms smoothing by a 101 ms one, WAKE has a maximum at 118.5 ms (ratio 1.016) and REM
    at 142.5 ms (1.017). Per subject the REM maximum falls within 112.5 to 137.5 ms in two subjects (Bogey
    135.5, Dino 125.5). Without the seven sessions whose LFP could not be checked, the nonREM peak is
    at 6.5 ms, outside 7 to 9 ms, so the nonREM part rests on the sample as well as on the method. A fix
    to the binning (lags rounded to 1 ns, so that float error does not move a lag on a bin edge) moved
    the nonREM peak from 7.5 to 8.5 ms.
  deviations:
  - The peak location criteria (windows, 21 ms smoothing) were fixed here; the paper shows the peaks in
    a figure only.
- claim: fig2c-acg-decay
  outcome: blocked
  blocked_by: methods_underspecified
  notes: The main text gives decay fit exponents but not what is fitted (function, lag range); the Supplemental
    Experimental Procedures, which would say, could not be retrieved (PubMed Central and the publisher
    answer with a browser check). The autocorrelograms themselves are computed for fig2c-acg-peaks.
- claim: fig2f-rate-group-correlations
  outcome: partially_reproduced
  notebook: reproduce_watson_2016.ipynb
  output: claim:fig2f-rate-group-correlations
  notes: Over 20764 same-session pE pairs (169 without a defined correlation), the (6,6) mean correlation
    of 100 ms counts in nonREM is 0.0424, the largest of the 21 group combinations, and correlations rise
    with the rates of both cells. The (1,6) mean is 0.0089, above zero (t = 10.85, p = 8.7e-26); 22.8%
    of all pairs are negative, but no group combination has a negative mean. Reading (b) gives the same
    pattern ((6,6) 0.0401, (1,6) 0.0087).
  deviations:
  - The correlation measure is Pearson correlation of raw counts in 100 ms bins; the paper's measure and
    test are in the unavailable supplement and may differ (for example a correction for the shared UP/DOWN
    modulation).
- claim: ma-statistics
  outcome: not_reproduced
  notebook: reproduce_watson_2016.ipynb
  output: claim:ma-statistics
  measured:
  - 19.0
  - 0.096
  - 3.22
  notes: 'Under reading (a), median MA duration 19.0 s (within the spread), 0.096 MAs per minute of SLEEP
    and 3.22% of SLEEP time; reading (b) gives 19.0 s, 0.127 per min and 4.23%. The paper reports 0.32
    and 9.1%. 391 MAs in 21 sessions (262 inside SLEEP periods), against 790 in 27. Looser rules raise
    the counts but none reaches both values: Non-REM on at least one side and under 60 s gives 0.177 per
    min and 7.63% of SLEEP; every Awake epoch inside SLEEP gives 0.245 per min and 13.66%. Of the short
    Awake epochs left as WAKE, 186 lie between REM and Non-REM and 120 between two REM epochs.'
  deviations:
  - The dandiset has no microarousal label. MAs are derived from Awake epochs under 40 s between two Non-REM
    epochs, without the paper's EMG and theta criteria; 345 short Awake epochs elsewhere are left as WAKE.
  - The state table has 1 s resolution and may not be the scoring the paper used.
- claim: ma-fraction-over-nrem-episodes
  outcome: partially_reproduced
  notebook: reproduce_watson_2016.ipynb
  output: claim:ma-fraction-over-nrem-episodes
  measured: -0.451
  notes: Over 243 episodes with an MA, pooled episode bins give R = -0.087 (p = 1.7e-05); the bin means
    give R = -0.451 (p = 0.19). Neither reaches -0.85 or p < 1e-10. The mean fraction rises from 0.067
    to 0.157 over the first six bins and falls to 0.010 in the last. With a looser MA rule (Awake under
    60 s with Non-REM on at least one side, 757 MAs) the bin means give R = -0.602 (p = 0.066) and pooled
    bins R = -0.111 (p = 2.8e-08), the same judgment.
