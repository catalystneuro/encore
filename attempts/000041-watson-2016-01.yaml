- claim: fig3d-first-last-slope
  outcome: reproduced
  notebook: reproduce_watson_2016.ipynb
  output: claim:fig3d-first-last-slope
  measured: 0.801
  notes: On log10 rates (1021 pairs, 49 with a zero rate left out) the slope of last on first is 0.801
    (95% CI 0.768 to 0.834); in Hz 0.723. The reverse regression gives 0.864 (0.829 to 0.900), and the
    second half of the first packet regressed on its first half gives 0.855 (0.829 to 0.881), above the
    first-to-last slope. Corrected for the noise of the first-packet rate (reliability 0.946 from its halves),
    the slope is 0.846 (0.812 to 0.881), still below 1. The ratio of the SDs of log10 rates, last over
    first packet, is 0.963, a narrowing of about 4% that is significant over pairs (Pitman-Morgan p = 0.028)
    but not when cycles are resampled (95% interval 0.892 to 1.029). Most of the slope below 1 comes from
    the first-to-last correlation being below 1 (R = 0.832), so the claim's reading that fast cells slow
    down and slow cells speed up is weakly supported. The criterion, fixed before the analysis, judges
    the slope alone.
  deviations:
  - The paper does not say whether the regression is on log or linear rates; both are shown.
- claim: fig3e-wake-before-after
  outcome: partially_reproduced
  notebook: reproduce_watson_2016.ipynb
  output: claim:fig3e-wake-before-after
  notes: Reading (a), 1070 cell and cycle pairs, mean 1.341 Hz before and 1.180 Hz after, Wilcoxon p =
    4.1e-09. Sextiles 4, 5 and 6 decrease (one-tailed p = 0.03, 0.00063, 2.4e-05); sextile 1 does not
    increase (mean change -0.002 Hz, p = 0.3), and sextiles 2 and 3 decrease. Reading (b), 727 cells,
    gives the same pattern (population p = 1.4e-09, sextile 1 p = 0.36). In 23 of 30 cycles the WAKE after
    SLEEP is shorter than 300 s. With the pre-sleep window cut to the length of the post-sleep one, the
    result is the same (population p = 1.7e-09, sextile 1 p = 0.18, sextile 6 p = 1.8e-05). With one value
    per cycle the population decrease holds (20 of 30 cycles, p = 0.016) and sextile 6 decreases (p =
    0.048), but sextiles 4 and 5 do not (p = 0.87 and 0.12); the sextile part rests on pooling cells within
    cycles. With only the 7 cycles that have a full 300 s of WAKE after SLEEP, the population p is 0.055
    and sextile 6 p is 0.27 (sextile 5 p = 0.0034), so the result depends on the cycles with a shorter
    post-sleep window.
  deviations:
  - Where the WAKE after SLEEP is shorter than 5 min, all of it is used.
