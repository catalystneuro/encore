- claim: fig2f-rate-group-correlations
  outcome: partially_reproduced
  notebook: reproduce_watson_2016.ipynb
  output: claim:fig2f-rate-group-correlations
  notes: Over 20764 same-session pE pairs (169 without a defined correlation), the (6,6) mean
    correlation of 100 ms counts in nonREM is 0.0424, the largest of the 21 group combinations, and
    correlations rise with the rates of both cells. The (1,6) mean is 0.0089, above zero (t = 10.85,
