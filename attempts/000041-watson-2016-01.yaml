findings:
- kind: data_missing
  statement: The dandiset holds 22 sessions from 10 rats, where the paper and the dandiset's own description
    report 27 sessions from 11 rats; the files hold 945 units (826 excitatory, 96 inhibitory, 23 unknown)
    against the 995 putative pyramidal cells and 126 interneurons analysed. Which sessions and units were
    left out, and why, is not stated.
- kind: format_error
  statement: In sub-Dino_ses-Dino-072114 the spike times are whole seconds divided by 20000 (8451 distinct
    values from 0 to 0.4252 s, in a recording of 7959 s). The conversion read this session's spikes from
    a CellExplorer file with a hard-coded 20 kHz rate. The session's spikes cannot be used.
- kind: format_error
  statement: In sub-Dino_ses-Dino-061914 the LFP has 125 columns for 128 electrodes, lasts 331.7 min against
    291.9 min of states and spikes, and its samples are scrambled (lag-1 autocorrelation 0.28 on the reference
    channel, against 0.99 or more in every other session), consistent with a 128-channel file read as
    125 channels.
- kind: data_missing
  statement: The state table holds only Awake, Non-REM and REM. The paper scores microarousals as a state
    of their own and builds WAKE-SLEEP episodes, nonREM packets and episodes, UP/DOWN states and spindles,
    none of which is in the dandiset. MAs derived from short Awake epochs are fewer than the paper reports
    (391 in 21 sessions, against 790 in 27).
- kind: selection_undocumented
  statement: The dandiset does not say how the state table was scored. The conversion code takes it from
    each session's SleepState.states.mat; it yields 30 WAKE-SLEEP cycles in 21 sessions (3 sessions with
    none, though the paper kept only sessions with a full cycle), and only 49 of 534 REM epochs are followed
    directly by Non-REM, so it may not be the scoring the paper used.
- kind: metadata_error
  statement: The dandiset description gives 11 animals, 27 sessions and 1360 units, the paper's numbers,
    while the files hold 10 animals, 22 sessions and 945 units (the archive's summary counts 10 subjects).
    The description gives an age of 4-7 months, the files 3-7 months.
- kind: format_error
  statement: The LFP is stored as int16 with unit volts and conversion NaN, so it cannot be converted
    to volts.
- kind: metadata_insufficient
  statement: Every electrode's location is "unknown" and every unit's region is "CTX" or "unknown", although
    the paper records from medial prefrontal, orbitofrontal, anterior cingulate and secondary motor cortex;
    only the electrode groups carry a region.
- kind: metadata_insufficient
  statement: 23 units of sub-BWRat21_ses-BWRat21-121613 have cell type and region "unknown", with no description
    of what the label means.
- kind: data_missing
  statement: No movement, accelerometer or EMG data are in the dandiset, though the paper uses EMG to
    score states and movement to define WAKE and to relate WAKE to rate changes.
- kind: other
  statement: The state labels are consistent with the spikes in 20 of 21 sessions (not established for
    BWRat21-121813), but in 14 sessions the best agreement is with the table shifted 5 to 60 s earlier,
    so state boundaries may lag the activity. The LFP agrees with the spikes to within 50 ms in 14 of
    21 sessions. Of the other seven, three (BWRat21-121113, Bogey-012615, Dino-072414) have a clear
    cross-correlation extreme 56 to 64 ms from zero lag; in three (BWRat17-121912, BWRat21-121613, BWRat21-121813)
    the extreme is less than three times the value at plus or minus 1 s, so agreement is not established;
    and the LFP of Dino-061914 is scrambled.
