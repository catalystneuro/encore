  - WAKE excludes microarousals derived from the Awake label, not the paper's scored MAs.
- claim: fig2a-skewed-wide-distribution
  outcome: partially_reproduced
  notebook: reproduce_watson_2016.ipynb
  output: claim:fig2a-skewed-wide-distribution
  notes: WAKE rates have skewness 4.57 and a 97.5th percentile of 7.17 Hz (within a factor of 2 of 5
    Hz), but the 2.5th percentile is 0.0124 Hz, about four times below 0.05 Hz. 13 of 812 cells have
    a WAKE rate of zero. The log10 rates are skewed to the left (-0.74).
  deviations:
  - The paper's range is read from a log axis; the factor-of-2 tolerance was fixed in the
    criterion.
- claim: fig2a-fraction-above-2hz
  outcome: not_reproduced
  notebook: reproduce_watson_2016.ipynb
  output: claim:fig2a-fraction-above-2hz
  measured:
  - 17.0
  - 18.72
  - 9.11
  notes: REM (18.7%) and nonREM (9.1%) are within tolerance, WAKE (17.0%) is not. nonREM is lower
    than WAKE (chi-square 21.5, p = 3.5e-06) and REM (30.5, p = 3.4e-08), but neither test reaches
    p < 1e-10, which the criterion requires. The direction of the effect is as in the paper, with
    fewer cells than the paper had.
- claim: fig2b-wake-nrem-slope
  outcome: reproduced
  notebook: reproduce_watson_2016.ipynb
  output: claim:fig2b-wake-nrem-slope
  measured:
  - 0.862
  - 0.757
  notes: On log10 rates (799 cells, 13 with a zero rate left out), R = 0.862 and the slope of
    nonREM on WAKE is 0.757 (95% CI 0.727 to 0.788). In Hz the slope is 0.583 (0.560 to 0.607),
    outside the widened interval. The reverse regression on log10 rates gives 0.982 (0.942 to
    1.022), so the slope below 1 may in part be regression to the mean. Per subject the slope ranges
