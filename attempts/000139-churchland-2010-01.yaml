- claim: prep-activity-more-anterior
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_churchland_2010.ipynb
  output: claim:prep-activity-more-anterior
  notes: With the range measure 35 of 75 units on array 1 (0.467) and 41 of 77 on array 2 (0.532)
    pass the 5 spikes/s preparatory threshold (Fisher p = 0.517), and array 1 has the lower fraction
    in all 8 selection readings. With the SD measure array 1 is higher (4 of 75 against 1 of 77, p =
