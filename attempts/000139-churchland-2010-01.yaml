- claim: fig4-broad-unimodal
  outcome: reproduced
  assumed: true
  notebook: reproduce_churchland_2010.ipynb
  output: claim:fig4-broad-unimodal
  notes: In every selection reading the per-neuron correlations run from negative (-0.36 to -0.50)
    to positive (0.54 to 0.68) values, the mean is 0.141 to 0.207, no neuron has |r| > 0.8 while 13
    to 18 have |r| < 0.5, and Hartigan's dip test does not reject unimodality (p = 0.195 to 0.993).
    Main reading n = 17, SD 0.321, dip p = 0.788. With 15 to 20 neurons the test has little power.
  deviations:
  - Rests on the tuning measure and trial selection adopted in fig4d-mean-correlation-j-array.
- claim: fig4e-correlation-time-course
  outcome: reproduced
  assumed: true
  notebook: reproduce_churchland_2010.ipynb
  output: claim:fig4e-correlation-time-course
  notes: With the neurons of Figure 4D and the spliced trace, mean r is 0.703 at 400 ms before onset,
    0.492 at 200 ms before and 0.118 at onset (not above zero, t-test p = 0.127), and the decline
    begins at -263 ms. These two readings meet the criterion in 7 of 8 selection readings. The
    movement-locked trace alone puts the decline at -307 ms, just outside -300 to -100, and with all
    preparatory neurons the onset value (0.107, n = 76) is above zero (p = 0.0036) and above 0.1;
    22 of 32 combinations meet the criterion.
  deviations:
  - Assumed the neurons of Figure 4A to 4D (both thresholds) and the spliced trace. The legend of
    Figure 4 places E with A to D, and the Supplemental Experimental Procedures (Computing the mean
    firing rate) say the spliced trace "was also useful for the analysis in Figure 4E". The splice
    maps the go-locked trace (-200 to +100 ms) to movement time with the median RT (354 ms) and
    continues with the movement-locked trace; where the paper splices is not given.
- claim: suppfig1-population-psth-weak-movement-tuning
  outcome: reproduced
  assumed: true
  notebook: reproduce_churchland_2010.ipynb
  output: claim:suppfig1-population-psth-weak-movement-tuning
  notes: Under the main reading (17 neurons) the strongest-minus-weakest difference of normalized
    rate is 0.108 in the preparatory window and 0.101 at movement onset (ratio 0.942); it is smaller
    (criterion reading a) in all 8 selection readings but less than half (reading b) only under the
    separate-profile readings (0.184 to 0.357). The statement's "little relationship" by onset is
    supported under those readings and with all preparatory neurons (ratio 0.047 to 0.213), not
    under the concatenated-profile readings.
  deviations:
  - The two intermediate conditions are those at one third and two thirds of the rank order of
    preparatory rate, a standard choice (the legend says only "two intermediate conditions").
  - Rests on the tuning measure and trial selection adopted in fig4d-mean-correlation-j-array.
- claim: fig6d-perimovement-best-j-array
  outcome: reproduced
  assumed: true
  notebook: reproduce_churchland_2010.ipynb
  output: claim:fig6d-perimovement-best-j-array
  notes: 76 neurons fitted. Best peri-movement performance 0.117 (k = 6) with S fixed and 0.226 (k =
    13) with S recomputed in each fold, against the best kinematic space 0.016 to 0.024 and the best
    task space 0.030 (initial velocity), under all 8 combinations of S, kinematic window and
    replication. Over the selection readings the peri-movement space is highest under all
    combinations in 7 of 8 and under some in the eighth (onset a, medoid, separate). All levels are
    low; the split-half reliability of preparatory tuning is a median r of 0.374 and the estimated
    upper limit (0.068, S fixed) is below the peri-movement best. The array-1 neurons reach 0.291 and
    the array-2 neurons -0.006.
  deviations:
  - Rests on the tuning measure and trial selection adopted in fig4d-mean-correlation-j-array.
  - Reach end, used for endpoints and the trajectory-based task spaces, is where the condition-mean
    speed falls below 10% of its peak, a standard choice; acceleration is the derivative of the
    smoothed velocity; the T-matrices are sampled every 10 ms, a standard choice.
  - The EMG space cannot be built; the paper recorded no EMG for J-array.
- claim: fig6-perimovement-best-each-dimensionality
  outcome: reproduced
  assumed: true
  notebook: reproduce_churchland_2010.ipynb
  output: claim:fig6-perimovement-best-each-dimensionality
  notes: The peri-movement space wins 20 or 21 of 22 comparisons (14 kinematic dimensionalities and 8
    task spaces), 0.909 to 0.955, under every reading of S, kinematic window and replication, and
