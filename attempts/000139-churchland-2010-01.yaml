    response: No change.
  - claim: fig6-dimensionality-peak
    agrees: false
    outcome: partially_reproduced
    reason: It holds under S reading (a), best k = 6, k = 14 at -0.98. It fails under S (b), best k
      = 13, k = 14 equals the best, and best k is 11 to 14 in every selection reading. The result
      rests on an open reading. A random PCA space under S (b) gives about -0.1 flat across k,
      against -0.18 to -1.34 under S (a), so the missing decline above k = 10 under (b) partly
      reflects how out-of-sample projection shrinks the left-out condition's scores, and the two S
      readings are not on the same footing (problem 5).
    response: Outcome kept, reproduced resting on S fixed, with the disagreement recorded. S fixed
      is the reading adopted from the Methods (one matrix S per space, only the PD refitted), and
      the outcome is marked as resting on it. The chance curves the verifier asked for were added
      and agree with its point; the peri-movement chance curve falls by 2.292 from k = 6 to 14 with
      S fixed and by 0.094 with S recomputed, so the recomputed reading can show little decline even
      for noise. This is now in the conclusion and the notes.
