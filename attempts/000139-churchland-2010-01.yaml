findings:
- kind: metadata_error
  statement: Every unit's electrode reference points at a row of the PMd electrode group, although
    the unit ids (array x 1000 + channel x 10 + sort) put 77 of the 152 units on a second array. The
    references of those units (rows 14 to 94) match their channel numbers without the offset of 96
    that would place them on the M1 rows, so the M1 units are labelled as PMd.
- kind: metadata_insufficient
  statement: The electrode table's x, y, z and impedance columns are empty, so the anterior-posterior
    location of a unit cannot be read; the array is known only through the unit id convention, which
    the files do not describe.
- kind: data_missing
  statement: The dandiset holds one array session of monkey J on the maze task with 27 conditions and
    250 labelled trials. The paper's J-array dataset had 108 conditions and about 2166 trials per
    neuron, and the speed-task datasets of monkeys A and B, the single-electrode monkey J dataset and
    all EMG are not deposited, so 4 of the paper's main findings cannot be tested and the others rest
    on 6 to 10 trials per condition.
- kind: identifier_missing
  statement: Nothing in the files or the dandiset metadata says whether this session (2009-09-29) is
    the paper's J-array recording or a different one, or how its 27 conditions relate to the paper's
    108.
- kind: selection_undocumented
  statement: The files keep 250 successful trials split into train and val, and 100 test trials as
    700 ms segments without condition labels, go cue or behaviour. How the trials and the 9 mazes
    were chosen from the session is not described.
- kind: methods_unavailable
  statement: For the paper's authors. The supplement keeps trials whose velocity profiles correlate
    with a reference proto-trial at r > 0.9. Is the proto-trial the condition mean or one trial, and
    are the horizontal and vertical profiles correlated separately or together? Here separate
    comparison keeps 70 to 82% of trials and concatenation 93 to 96%, against the stated ~90%; the
    mean with concatenation was assumed, and the mean correlation of Figure 4D passes p < 0.05 under
    5 of 8 readings.
- kind: methods_unavailable
  statement: For the paper's authors. How is "spikes/s of preparatory tuning" measured (range or
    standard deviation of condition means)? The range was assumed; with the standard deviation almost
    no array unit passes 5 spikes/s.
- kind: methods_unavailable
  statement: For the paper's authors. In the leave-one-condition-out performance, is the PCA-based
    space S recomputed without the left-out condition? S fixed was assumed (one S per space, only the
    PD refitted). With S recomputed, peri-movement performance here does not decline at high
    dimensionality (best k = 13).
- kind: methods_unavailable
  statement: For the paper's authors. For the segment-directions and kitchen-sink spaces, is the
    reach divided into three segments of equal time or equal path length? Here segment directions
    perform above zero with time segments (0.008) and below with path segments (-0.027), which
    decides fig6-maze-task-spaces, blocked for this reason.
- kind: methods_unavailable
  statement: For the paper's authors. How was movement onset detected, where is the go-locked trace
    spliced to the movement-locked one in Figure 4E, and what is the gray interval of Figure 8? Here
    the dataset's onsets, a splice at the median RT and a full cycle were used, and the other readings
    shown.
