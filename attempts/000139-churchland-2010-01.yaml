- claim: j-array-recordings
  outcome: partially_reproduced
  notebook: reproduce_churchland_2010.ipynb
  output: claim:j-array-recordings
  measured:
  - 152
  - 27
  - 250
  notes: The dandiset holds 152 units (within 146 +/- 14.6), 75 and 77 on the two arrays by unit id,
    recorded over 27 conditions (9 mazes, each in the no-barrier, barrier and distractor versions)
    and 250 labelled trials per unit, 350 with the 100 unlabelled test segments, against the paper's
    108 conditions and 2166 trials per neuron. The trial count is reported only, as the criterion
    says. The criterion's partial outcome applies because the units match and the conditions are a
    27-condition maze set; that these 9 mazes are among the paper's 108 is consistent with the data
    (same monkey, task and three-version design) but cannot be shown, as nothing in the files links
    the session (2009-09-29) to the paper's J-array dataset.
  deviations:
  - The 100 test trials of the Neural Latents Benchmark carry no condition labels or go cue times,
    so only the 250 training and validation trials are used in every analysis.
- claim: fig4d-mean-correlation-j-array
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_churchland_2010.ipynb
  output: claim:fig4d-mean-correlation-j-array
  measured:
  - 0.172
  - 0.139
  notes: Under the adopted reading 17 neurons pass both thresholds; mean Pearson r = 0.172 and mean
    Spearman r = 0.139, both outside tolerance. The mean is above zero by the t-test (p = 0.042) and
    the Fisher-z t-test (p = 0.044), not by the Wilcoxon test (p = 0.071). Over the 8 trial-selection
    readings mean r is 0.141 to 0.207 (all inside 0.054 to 0.231) and p < 0.05 by some test in 5;
    in the other 3 (onset a with condition-mean proto and separate profiles, onset a with medoid
    and concatenated profiles, onset b with medoid and separate profiles) the smallest p is 0.052,
    0.056 and 0.080, and the outcome would be not reproduced. No reading puts both means in
    tolerance with p < 0.05 (onset b, medoid, separate has both in tolerance, 0.141 and 0.119, with
    p = 0.080). The SD tuning measure leaves no neuron passing both thresholds in any reading. The
    result moves with the thresholds (at 1.5 times, 3 to 30 neurons and mean r 0.114 to 0.210 for
    preparatory thresholds of 10 to 3 spikes/s; table in the notebook).
  deviations:
  - Assumed the tuning strength is the range across conditions. The Methods give the thresholds in
    spikes/s of tuning ("at least 10 spikes/s of preparatory tuning", Methods, Neural recordings and
    datasets) without the measure; the SD reading leaves 5 to 8 of 152 units above 5 spikes/s and
    none passing both thresholds, which cannot be the paper's array analysis, so the range is the
    reading the paper supports.
  - Assumed the proto-trial is the condition-mean velocity profile and that the horizontal and
    vertical profiles are concatenated. The Supplemental Experimental Procedures (Task design and
    behavioral control) keep "the subset of trials (typically ~90% of all trials)" that correlate
    with the proto-trial at r > 0.9; concatenation keeps 93 to 96% of trials, comparing the
    profiles separately keeps 70 to 82%. Mean against medoid is not settled by the paper; a template
    is usually a mean. All 8 readings are shown.
  - Movement onset is the dataset's move_onset_time (reading a); onset from hand speed (10% of
    peak, a standard choice, a median 12 ms later) is run as reading b.
  - 6 to 10 trials per condition, against about 20 in the paper's J-array dataset.
- claim: fig4abc-mean-correlation-other-datasets
  outcome: blocked
  blocked_by: data_missing
  notes: The dandiset holds one maze-task array session of monkey J. The speed-task datasets of
    monkeys A and B and the single-electrode monkey J dataset are not in it (assets and metadata
