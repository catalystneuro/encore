      the length-split variant fails.
    response: Outcome changed from blocked (methods_underspecified) to reproduced, resting on
      segments equal in time. The claims file names both segment divisions as readings, and a claim
      is reproduced when it holds under one of them. Chance levels were added (-0.429, -0.172,
