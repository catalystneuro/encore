- claim: fig8-linear-dynamics-simulation
  outcome: reproduced
  assumed: true
  notebook: reproduce_churchland_2010.ipynb
  output: claim:fig8-linear-dynamics-simulation
  notes: With the gray interval read as one full cycle (360 steps), the central 95% of the
    correlation over 1000 draws is -0.397 to 0.387 (uniform initial states) and -0.400 to 0.404
