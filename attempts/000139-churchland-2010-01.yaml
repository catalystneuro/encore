- claim: ap-location-no-effect-j-array
  outcome: reproduced
  assumed: true
  notebook: reproduce_churchland_2010.ipynb
  output: claim:ap-location-no-effect-j-array
  notes: Regressing each neuron's tuning correlation on its array (PMd 1, M1 0) gives r = 0.165, p =
    0.526 (17 neurons, 9 on array 1) under the main reading and p = 0.53 to 0.91 over the selection
    readings, so the paper's test finds no effect at p < 0.05. Mean r is 0.221 on array 1 and 0.117
    on array 2.
  deviations:
  - The electrode table has no positions, so AP location is read as the array (the claims file's
    reading b) and the median split of the paper cannot be made within an array.
  - Assumed unit id prefix 1 is the PMd array. The units' electrode references all point at PMd rows;
    those of prefix-1 units (rows 0 to 89) are consistent with PMd, those of prefix-2 units (rows 14
    to 94) with M1 channels missing the offset of 96 rows, and the electrode table lists PMd first.
    The regression's p does not depend on which array is coded 1.
