  results:
  - claim: j-array-recordings
    agrees: true
    outcome: partially_reproduced
    reason: 152 units, within 146 +/- 14.6. There are 27 conditions (9 mazes x 3 versions), not 108,
      and 250 trials. The criterion gives partial when units match and conditions are a subset.
      Caveat, the paper says J-array interleaved all 108 conditions, so this 27-condition session
      (2009-09-29) is almost certainly a different recording, and the unit match is a coincidence.
      The notebook never addresses identity, which the claims file left to the author (problem 7).
    response: Outcome kept. The notebook now prints the file's session description and the trial
      timeline (trials abut, so it is rebuilt and cannot show which other conditions the session
      held), and the conclusion and notes say that if the session ran only these 27 conditions it is
      a different recording and the unit match says nothing about the paper's dataset. Whether the
      criterion's partial clause should apply is asked of a reader in questions/000139.yaml.
  - claim: fig4d-mean-correlation-j-array
    agrees: true
    outcome: partially_reproduced
    reason: Mean r is 0.14 to 0.21 across the 8 selection readings (main reading 0.172, t-test p =
      0.042) with p < 0.05 in 5 of 8. That is inside 0.054 to 0.231 but outside 0.13 +/- 0.013. The
      one reading with both means in tolerance (b/medoid/separate, 0.141, 0.119) has p >= 0.08. The
      main reading passes only on the t-test (Wilcoxon p = 0.071; problem 10). Applying 5 spikes/s
      to the SD measure leaves 0 neurons, so that reading is degenerate rather than tested (problem
      9).
    response: No change of outcome. The notes already state that the main reading passes on the
      t-test and the Fisher-z test but not the Wilcoxon test, and that the SD reading leaves no
      neuron; the SD reading is one the claims file names, so it is shown, not dropped.
  - claim: fig4abc-mean-correlation-other-datasets
    agrees: true
    outcome: blocked
    reason: The archive API lists 2 assets, both one Jenkins array session. There are no speed-task
      or single-electrode data.
    response: No change.
  - claim: fig4-broad-unimodal
    agrees: true
    outcome: reproduced
    reason: In every reading r runs from about -0.5 to 0.68, mean 0.14 to 0.21, and the dip test p
      >= 0.195. No neuron has |r| > 0.8. With n = 15 to 20 the dip test has little power.
    response: No change; the notes already state the low power.
  - claim: fig4e-correlation-time-course
    agrees: true
    outcome: reproduced
    reason: Borderline. 22 of 32 readings meet the criterion. The value at onset is 0.02 to 0.15,
      and the decline starts at -257 to -325 ms, at the edge of the -300 to -100 window. In the main
      selection only splice reading (a) with both thresholds passes. Splice reading (a) maps the
      go-locked trace using the median RT (354 ms), an author choice not labelled an assumption; the
      decline times under (a) sit next to the splice at -254 ms, but reading (b) gives similar
      values (problem 8).
    response: No change of outcome. The median-RT splice is now stated as an assumption in the
      conclusion and the deviation, with the splice point (-254 ms) next to the decline (-263 ms).
  - claim: suppfig1-population-psth-weak-movement-tuning
    agrees: true
    outcome: reproduced
    reason: Nominal. The onset difference is smaller than the preparatory difference in 16/16
      readings and less than half in 12/16; with the main reading's Figure-4 neurons the ratio is
      0.94. Conditions are ranked by the same noisy preparatory rates used to measure the
      preparatory difference, so regression to the mean inflates that difference but not the onset
      difference, which favours the claim; ranking on odd trials and measuring on even trials would
      remove it (problem 6).
    response: Outcome kept, as the criterion follows the legend's method. The cross-validated
      variant was added. With conditions ranked on half the trials and measured on the other half,
      the 17 neurons give 0.040 (preparatory) against 0.045 (onset), ratio 1.115, so reading (a)
      fails; all 76 preparatory neurons give 0.055 against 0.030 (ratio 0.545). The conclusion and
      notes say the result for the claim's neurons does not survive cross-validation.
  - claim: fig6d-perimovement-best-j-array
    agrees: true
    outcome: reproduced
    reason: Under every S, kinematic-window and replication reading the peri-movement best (0.117
      for S a, 0.226 for S b) beats the kinematic best (<= 0.024) and the task best (0.030). One
      selection reading (a/medoid/separate) fails, and there all spaces are <= 0. The 5 spikes/s
      threshold, with about 9 trials per condition, lets most untuned units pass, which dilutes
      every Figure 6 and 7 magnitude (problem 1). Neither the paper's chance statement nor a null is
      checked (problem 5). Velocity enters the kinematic space unsmoothed while acceleration comes
      from smoothed velocity, a minor point (problem 11).
    response: No change of outcome. Added a label-shuffled reference for the threshold (59 of 152
      units pass on shuffled labels against 75 observed) and a per-unit permutation test (43 of 76
      PD neurons with p < 0.05); on those 43 the peri-movement best is 0.336 and 0.415 against 0.117
      kinematic and 0.143 task. Added a chance level for every space (conditions shuffled), all
      below zero, and every space is above its chance at every k. The paper's upper limit (including
      the fitted neuron) is now shown, 0.178 and 0.300. The kinematic velocity is left as the
      dataset's hand velocity; it is not changed because the kinematic best (<= 0.024) is far below
      the peri-movement best and smoothing a 1 kHz velocity trace with a 20 ms Gaussian cannot close
      that gap, though this was not run.
  - claim: fig6-perimovement-best-each-dimensionality
    agrees: true
    outcome: reproduced
    reason: The peri-movement space wins 90.9 to 95.5% of comparisons in every reading, above the
