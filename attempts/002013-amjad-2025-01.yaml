date: 2026-10-15
entry: 002013-amjad-2025
provenance:
  kind: agent
  accountable:
    name: CatalystNeuro
  agent:
    harness: Claude Code (GitHub Actions)
    model: claude-opus-5-5
    protocol: pilot-6
inputs:
- what: The paper's Zenodo data deposit, read only by the zenodo-link claim. The four lists of
    successful trial numbers of session 09/26/2024 (files "09262024_trialids_value object start_big
    rew and success_tr1-1501.mat" and its small rew, left and right counterparts) and the beta power
    of its example trial (09262024_c3bs-c3a_data_trial35bigrewardexample.mat), used as reference
    values.
  source: doi:10.5281/zenodo.14826579
outcomes:
- claim: insertion-yield
  outcome: blocked
  blocked_by: data_missing
  notes: The dandiset holds one or two sites per session and no list of the implanted sensors or of
    which kept working, in its files or its metadata. The paper's Zenodo deposit has none either.
- claim: chronic-duration
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: No implantation date is given in the files (subject, electrode or device fields) or the
    dandiset metadata, so days post-implant cannot be computed. The two Monkey T sessions are 13
    days apart, which matches the difference between the 483 and 496 days of the legends.
- claim: fscv-waveform
  outcome: partially_reproduced
  notebook: reproduce_amjad_2025.ipynb
  output: claim:fscv-waveform
  measured:
  - -0.347
  - 1.3395
  - 400.46
  - 10.0
  notes: The applied voltage runs from -0.347 to 1.340 V at 400.5 V/s, one scan every 0.1 s. Three
    of four values are within tolerance; the lowest potential is outside -0.4 +- 0.04 V. The
    dandiset's own description (-0.35 to 1.34 V) agrees with the data, so the Methods state the
    nominal waveform.
  deviations:
  - Measured on session 09/13/2024 only, the only FSCV session in the dandiset.
- claim: ephys-acquisition
  outcome: reproduced
  notebook: reproduce_amjad_2025.ipynb
  output: claim:ephys-acquisition
  measured:
  - 30000
  - 32000
  - 0.1
  - 8000
  notes: Monkey P's raw timestamps have a median interval of 33.333 µs (30 kHz) and Monkey T's
    series a rate of 32000 Hz. The Neuralynx settings of both Monkey T channels give a low cut of 0.1
    Hz and a high cut of 8000 Hz, inside the tolerance of 7500 Hz but not equal to it; the
    dandiset's description also says 7500 Hz. Monkey P's file stores no filter settings.
- claim: shape-task-structure
  outcome: reproduced
  notebook: reproduce_amjad_2025.ipynb
  output: claim:shape-task-structure
  measured: 24.4
  notes: Forced trials are 358 of 1468 (24.4%). The eight complete blocks of the cue-reward
    association are 71 to 273 trials long; the first and last blocks, cut by the file, are 61 and
    194 trials.
  deviations:
  - Blocks are found from the image codes of successful forced trials, as choice trials carry no
    feedback code; a reversal is placed after the last forced trial of the earlier association, so
    block edges are uncertain by the gap between forced trials.
- claim: zenodo-link
  outcome: reproduced
  notebook: reproduce_amjad_2025.ipynb
  output: claim:zenodo-link
  notes: Trials are matched by number. The decoded selections agree with the four Zenodo lists for
    569 of 570, 602 of 602, 594 of 594 and 577 of 578 trials; the only difference is trial 1501, the
    last of the session, absent from the Zenodo large-reward and right lists. The Zenodo example
    "trial35" is the 35th trial of the large-reward list (trial 84). Beta power computed here
    correlates with its trace at r = 0.943 at a lag of 6 ms, with a median amplitude ratio of 0.943,
    so the dandiset's LFP, its trial times and the beta pipeline used here agree with the paper's
    files. The Zenodo example's raw LFP variable is a copy of its time variable, so the LFP trace
    itself could not be compared.
  deviations:
  - The beta filter (4th-order Butterworth, forwards and backwards, squared Hilbert envelope) is a
    common choice; the paper's code is not public, and r = 0.943 suggests its filter differs
    somewhat.
- claim: fig3a-dual-channel
  outcome: blocked
  blocked_by: data_missing
  notes: The dandiset holds FSCV from site c8dg only. Site c8ds is not in it, and the Zenodo deposit
    holds processed FSCV of c8dg only. The conversion notes list raw FSCV files with ten channels,
    including c8ds, which were not deposited.
- claim: fig3a-redox-peaks
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: The raw FSCV current is in the dandiset, but its timing could not be linked to the trials.
    Its scan times are an exact 0.1 s grid starting at the first trial start and running 24120 s,
    past the last trial; at 0.6 V it does not match the stored oxidation current of any of six rows
    tested at the stored times (|r| below 0.06) or anywhere in the record (best r 0.16 to 0.20 at
    offsets that differ from row to row); and it shows no large-against-small contrast at the stored
    value cue times (p = 0.46). A colour plot of a forced large-reward trial therefore cannot be
    placed in the trial.
- claim: fig3b-beta-bursts
  outcome: reproduced
  notebook: reproduce_amjad_2025.ipynb
  output: claim:fig3b-beta-bursts
  notes: With the threshold at the 75th percentile (356 µV²) and bursts of at least 50 ms, the burst
    rate of 570 large-reward trials is 1.51 per s in the second before the value cue and 1.21 in
    the second after it (Wilcoxon p = 9.5e-10). The rate changes around the cue at the 50th and
    90th percentiles too (p below 1e-40), rising at the 50th and falling at the 90th, so its direction
    depends on the threshold while the change does not. The rate dips just after the cue (0.51 per
    s in 0 to 0.25 s) and falls again from 6 s after it, after the feedback.
  deviations:
  - The paper shows a single trial and does not define a burst; the threshold, minimum length and
    test were chosen here before the analysis.
- claim: fig4a-dopamine-reward
  outcome: reproduced
  notebook: reproduce_amjad_2025.ipynb
  output: claim:fig4a-dopamine-reward
  notes: Over 0 to 3 s after the value cue, the re-referenced dopamine has a median of 1.28 in 85
    large-reward trials and 0.19 in 80 small-reward trials (Mann-Whitney p = 0.023; 3 trials of 168
    have no valid samples in the window). The difference lies in 1.5 to 3 s (p = 0.0072), not 0 to
    1.5 s (p = 0.41). The effect is weak. Before the cue the groups differ the other way (p =
    0.064). Without re-referencing (the stored da) there is no difference (p = 0.3), nor in the
    re-referenced oxidation current (p = 0.41). It holds in trials 1 to 367 (p = 0.013) and not in
    trials 368 to 734 (p = 0.51).
  deviations:
  - Only the first 734 of 1468 trials of the session have trial-aligned FSCV in the dandiset, so
    168 successful forced trials are used.
  - The stored da is not referenced at the value cue; it is re-referenced here by subtracting its
    value at the cue, which equals background subtraction there only if the PCA projection was
    linear and the nulling (NaN) masks are ignored.
  - Small reward is inferred from the absence of the big-reward code, confirmed by the cue condition
    codes 35 and 36 in all 303 successful forced trials.
  - The paper gives no window or test; 0 to 3 s and the Mann-Whitney test were chosen before the
    analysis.
- claim: fig4b-beta-reward
  outcome: reproduced
  notebook: reproduce_amjad_2025.ipynb
  output: claim:fig4b-beta-reward
  notes: Over 0 to 0.5 s after the value cue, median beta power is 275 µV² in 570 large-reward
    trials and 327 µV² in 602 small-reward trials (ratio 0.84, Mann-Whitney p = 1e-08), with no
    difference before the cue (ratio 1.006, p = 0.82). It holds relative to pre-cue power (ratio
    0.82, p = 1.1e-06) and on each side (left p = 0.0016, right p = 1e-07). It is confined to a brief
    window, as the legend says; over 0 to 1 s large is slightly higher (ratio 1.04, p = 0.09) and
    over 0.25 to 0.75 s there is no difference (p = 0.66).
  deviations:
  - The paper does not give the window highlighted in Figure 4B or a test; 0 to 0.5 s and the
    Mann-Whitney test were chosen before the analysis.
- claim: fig4c-beta-side
  outcome: reproduced
  notebook: reproduce_amjad_2025.ipynb
  output: claim:fig4c-beta-side
  notes: Among large-reward trials, median beta power over 0 to 0.5 s is 245 µV² for left cues and
    301 µV² for right cues (282 and 288 trials, ratio 0.81, Mann-Whitney p = 1.6e-06). Before the
    cue left is slightly higher (ratio 1.095, p = 0.013), so relative to pre-cue power the
    difference is larger (ratio 0.71, p = 2.1e-09). It holds over 0 to 1 s (p = 0.019), not over
    0.25 to 0.75 s (p = 0.75), and also in small-reward trials (p = 1.5e-10).
  deviations:
  - Left is taken as contralateral, as the Methods state; the files do not say which hemisphere was
    implanted.
  - Window and test chosen before the analysis, as for fig4b-beta-reward.
- claim: fig5a-spike-reward
  outcome: blocked
  blocked_by: data_missing
  notes: Monkey P's file has no trials table and no events, so value cue times and reward sizes are
    not in the dandiset. The paper's Zenodo deposit has the session's raw Neuralynx events
    (session126_events.mat) as TTL values without names; their codes differ from those of the
    Monkey T sessions, so they could not be decoded (metadata insufficient).
- claim: fig5bc-unit-isolation
  outcome: reproduced
  notebook: reproduce_amjad_2025.ipynb
  output: claim:fig5bc-unit-isolation
  notes: Plexon unit 1 has 31247 spikes at 2.61 Hz. One of 31246 interspike intervals is under 1 ms
    (0.003%), and its mean waveform trough (-30.6 µV) is 5.66 times the raw noise level (5.41 µV, 300
    to 6000 Hz, 600 s). The units table's unit 0 (unsorted and poor-quality spikes merged) has 11.65%
    of intervals under 1 ms and is not a unit.
  deviations:
  - The noise level and the two thresholds are common choices; the paper shows the waveform and
    histogram without numbers.
  - The paper names the site c33; the file names it cl3. The session is taken as the paper's.
findings:
- kind: format_error
  statement: Each event is stored about five times in the events tables of both Monkey T sessions
    (85665 stored times, 17686 distinct, in 09/13/2024; 59702 and 12434 in 09/26/2024), once for every
    overlapping 60 s trial window that contains it.
- kind: metadata_insufficient
  statement: The trials tables hold only times, no trial conditions. Conditions must be decoded from
    the event codes. Session 09/13/2024 has no small-reward code, and the labels of codes 35 and 36
    ("right cue reward condition 1/2") do not say that they code large and small reward, which the
    data show in all 303 successful forced trials.
- kind: data_missing
  statement: The trial-aligned FSCV table of session 09/13/2024 has rows for only the first 734 of
    its 1468 trials (from a source file named "firsthalf"), and the dandiset has FSCV from c8dg only;
    the second site of Figure 3A (c8ds) is missing.
- kind: metadata_insufficient
  statement: The trial-aligned FSCV columns (da, ph, m, iox) carry no units, and da is not referenced
    at the value cue as the Methods describe; the reference point is not stated.
- kind: metadata_error
  statement: The raw FSCV current is labelled amperes, but its values range from -1527 to 1557; the
    unit is likely nA or the data are not current.
- kind: metadata_error
  statement: The raw FSCV scan times are an exact 0.1 s grid starting at the first trial start and
    running 24120 s, past the last trial, and the raw current cannot be matched to the trial-aligned
    oxidation current at any offset or to the task at the stored times. The conversion notes say the
    times were interpolated between trial-start codes; the data do not support that they are on the
    trial clock.
- kind: metadata_error
  statement: The bipolar LFP of session 09/26/2024 stores values already in volts (around 1e-4) with
    a conversion factor of 3.05e-8, so that read as NWB prescribes it is in picovolts.
- kind: metadata_error
  statement: The raw ephys of session 09/26/2024 has starting_time 0 and no timestamps, but it matches
    the stored LFP (r 0.92 to 0.98) only when read 9831.35 s later on the trial clock, consistently
    from the first trial to the last.
- kind: metadata_error
  statement: In Monkey P's file the spike times (6800 to 18785 s) are 6800.666 s later than the raw
    signal's timestamps (0 to 11985 s); the spike-triggered average of the raw signal shows the spike
    only with that shift. The file does not say the two use different clocks.
- kind: format_error
  statement: In Monkey P's units table, unit 0 merges the unsorted (0) and poor-quality (-1)
    thresholded spikes, including 7 spike times below 1 s and repeated times; the poor-quality spikes
    of the thresholded table are not in time order.
- kind: data_missing
  statement: Monkey P's file has no trials or events, so the reward-related firing of Figure 5A cannot
    be tested. The paper's Zenodo events for this session are raw TTL values without a code map.
- kind: metadata_insufficient
  statement: No implantation dates are given, so the days post-implant of each session cannot be
    checked.
- kind: metadata_error
  statement: Monkey P's site is named cl3 in the file and dandiset description, c33 in the Figure 5
    legend; the files' related_publications cite the bioRxiv preprint, not the article; the
    acquisition high cut is 8000 Hz in the Neuralynx settings, not the 7500 Hz the description
    states.
- kind: other
  statement: The applied FSCV waveform runs from -0.347 to 1.340 V, as the dandiset description says;
    the paper's Methods give -0.4 to 1.3 V.
