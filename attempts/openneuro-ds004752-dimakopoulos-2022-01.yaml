findings:
- kind: other
  statement: The dataset holds 68 sessions with 3353 trials (15 sessions with fewer than 50 trials),
    where the paper reports 71 sessions of 50 trials; the 3045 correct trials equal the paper's count.
    The README says each session includes about 50 trials and gives no session count.
- kind: metadata_error
  statement: In every channels.tsv, low_cutoff is 1000 and high_cutoff is 0.5, the reverse of the 0.5 to
    1000 Hz passband given in the ieeg.json and eeg.json sidecars and the paper.
- kind: metadata_insufficient
  statement: The EDF headers leave the physical dimension of every signal blank; only channels.tsv
    gives µV. The derivative virtual sensors carry no unit, and their sampling rate varies from 200 to
    4096 Hz across subjects without description.
- kind: metadata_error
  statement: In sub-11 the contacts named PHL lie at positive MNI x (right) and those named PHR at
    negative x, and the atlas labels follow the coordinates (PHL1 "Right Hippocampus"); 3 contacts of
    sub-12 have the same mismatch, and in sub-01 the atlas label names the hemisphere opposite to the
    x coordinate for 12 contacts (for example ECL1 at x = -24, "Right Amygdala").
- kind: metadata_error
  statement: participants.tsv gives a pathology different from Table 1 of the paper for eLife
    participants 5 (hippocampal sclerosis against brain contusion), 6 (brain contusion against
    hippocampal sclerosis) and 15 (dysembryoplastic neuroepithelial tumor against hippocampal
    sclerosis); 5 and 6 look swapped.
- kind: metadata_error
  statement: The README lists the virtual sensors as temporal superior lobe, lateral prefrontal
    cortex, occipital cortex, posterior parietal cortex and Broca, but the derivative files hold DLPFC,
    OFC, PPC, AC and V1 (no Broca), plus the scalp channels, which the README does not mention.
- kind: identifier_missing
  statement: The derivative LCMV files carry no trial numbers. Their trials are the correct trials of set
    sizes 6 and 8 in session order (shown here by correlating their scalp channels with the raw EEG),
    without the artifact-flagged trials in 13 subjects and with them in sub-13 and sub-14.
- kind: data_missing
  statement: The derivative files hold sources for correct trials only, and the beamformer filters,
    electrode alignment and head model are not deposited, so the paper's incorrect-trial analysis
    (Figure 4f) and its source statistics (Table 1) cannot be repeated from the dataset.
- kind: other
  statement: 17 trials (16 in sub-14, 1 in sub-12) have SetSize 0, no Match, ResponseTime 0 and the
    artifact flag, apparently placeholders; ProbeLetter is n/a for every trial of sub-10 to sub-15.
    Neither is described in the events sidecar.
- kind: code_mismatch
  statement: In calculateGranger_random_trial_sampling.m (and the group medians of MeanSourceGranger.m)
    the same row of FieldTrip's grangerspctrm is stored as cortex to hippocampus for encoding and as
    hippocampus to cortex for maintenance, although both periods use the same channel pair, so the
    sign of maintenance ΔGranger is flipped relative to encoding. Combined with the minimum (encoding)
    and maximum (maintenance) over 4 to 8 Hz taken in MeanSourceGranger.m and DeltaGranger_EEG.m, this
    yields negative encoding and positive maintenance values without a directed effect.
- kind: paper_inconsistency
  statement: The Results say ΔGranger was averaged over [4 8] Hz for each participant ("We averaged
    ΔGranger"), while the Figure 4d legend reports the "maximal ΔGranger" and the code takes the minimum
    in encoding and the maximum in maintenance. On this dataset the averaged value shows no effect and
    the extreme value shows the reported sign pattern, as it also does for every other area and for
    spectra with no direction.
- kind: methods_unavailable
  statement: Question for the authors. Which hippocampal contact (electrode, contact number, monopolar
    against which white-matter contact, or which bipolar pair) entered the GC, PSD and PLV analyses of
    each participant, and which contact was the ECoG reference? The Methods name a white-matter
    reference without saying which, and the code's bipolar pairs differ by participant. Readings tried
    here (contact 1 of the left anterior electrode against the first unlabelled contact, a bipolar pair,
    the mean over electrodes) disagree for Participants 1 and 3.
- kind: methods_unavailable
  statement: Question for the authors. Is the per-participant ΔGranger of Figure 4 and Table 1 the mean
    over 4 to 8 Hz or the minimum (encoding) and maximum (maintenance), and were the 10% subsampled
    spectra aggregated by the median (Results) or the mean (Methods) over 20 (code) or 200 (Methods)
    draws?
