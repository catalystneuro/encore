- claim: fig2h-gc-reversal-p1
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_dimakopoulos_2022.ipynb
  output: claim:fig2h-gc-reversal-p1
  notes: With clusters (c2) no reading shows the reversal between the hippocampus and C2. Under h1 encoding
    has significant clusters overlapping theta (7.55 to 9.05 Hz, p = 0.01) and maintenance none; under
    h2 and h3 neither period has a theta cluster. The per-frequency test (c1) shows the reversal under
    h1 only (encoding 6.75 to 7.2 and 7.55 to 9.05 Hz, maintenance 7.0 to 7.45 Hz). On mismatched trial
    pairs of this participant (cortical trials shifted by 1 to 10 positions) c1 flags the reversal in
    40% (h1) and 20% (h2) of shifts and theta in 30% to 70% of single tests, and c2 flags the reversal
    in 0% of shifts; the direction-swap null puts 8% to 16% of bins beyond its 5th or 95th percentile,
    against 5%. The code's variant (AHL2-AHL3, trial-shuffle null, 1st and 99th percentiles) finds encoding
    at 5.9 to 6.15 Hz and nothing in maintenance.
  deviations:
  - The outcome rests on the cluster reading (c2). The per-frequency reading (c1), which the Methods describe,
    flags the reversal in 20% to 90% of trial pairings with no coupling in Participants 1 to 3, far from
    the 5% of the paper's p < 0.05, so as run here it is not the paper's test; c2, which the Figure 2h
    legend names (cluster-based), flags it in 0% to 10%. The electrode (AHL) and the white-matter reference
    contact are chosen by rule, not given by the paper.
  - GC is computed in Python with a Wilson factorisation following FieldTrip, checked on an analytic autoregressive
    process; signals are resampled with scipy's polyphase filter.
- claim: fig2ijk-spatial-spread-p1
  outcome: not_reproduced
  notebook: reproduce_dimakopoulos_2022.ipynb
  output: claim:fig2ijk-spatial-spread-p1
  notes: In encoding the most negative theta ΔGranger is at G6, an occipital contact (h1 and h2; H5 under
    h3), not an auditory one; with h1, 22 contacts are significant in encoding, C1 and C3 among them.
    Of the 7 contacts with significant positive ΔGranger in maintenance (h1), none is auditory and H3
    is not among them. The spatial test (maintenance, h1) is not significant, the true scalar products
    having a median of -0.0041 against a null median of -0.0012 and a null 95th percentile of 0.013 (0%
    of true values above it).
  deviations:
  - For the notebook's time limit (each spatial test takes about 4 minutes), the per-contact tests ran
    with h1 only (h2 and h3 values are shown without a test), and the spatial test ran on maintenance
    with h1 only.
  - In the spatial null each trial's window is drawn at random from fixation (1 s) or maintenance (2 s),
    as the Methods describe; the fixation cross-spectra are scaled by 2 so that the two window lengths
    enter on one scale under the same 20 s padding (a standard choice).
