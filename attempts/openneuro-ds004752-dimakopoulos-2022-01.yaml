- claim: fig4f-incorrect-no-reversal
  outcome: reproduced
  notebook: reproduce_dimakopoulos_2022.ipynb
  output: claim:fig4f-incorrect-no-reversal
  notes: Each derivative virtual sensor is an exact linear combination of the file's scalp channels (R²
    = 1.000000 in all 150 fits), so each period's filter was recovered and applied to the raw EEG, re-referenced
    to the averaged mastoids. On the correct trials the recomputed AC source matches the deposited one
    (median correlation per participant 0.996 to 0.999, theta ΔGranger within 0.0001). On the 254 incorrect
    trials of set sizes 6 and 8 without the artifact flag (5 to 40 per participant), with d1 encoding
    and maintenance ΔGranger do not differ under any reading, p = 0.71 (h1), 0.19 (h2) and 1.00 (h3) with
    200 sign flips (exact 0.66, 0.17 and 1.00), median differences -0.0001 to 0.014. Encoding is negative
    in 6 or 7 of 15 participants and the full pattern appears in 3 to 5, so the direction is not the same
    in all. The signs match Table 1's incorrect-trial values in 9 to 11 of 29 cells. With d2 the test
    is significant (p = 0.005) under every reading, as d2 gives the pattern by construction.
  assumed: true
  deviations:
  - The auditory source of the incorrect trials is computed from the raw scalp EEG with the filters recovered
    from the correct-trial derivative files. The paper does not say whether it computed separate filters
    for the incorrect trials; an LCMV filter depends on the data covariance, so its own filters may differ.
    The outcome rests on this choice.
  - The derivative's sampling rates differ by subject; the recomputed source is formed at 500 Hz and downsampled
    to 40 Hz as the iEEG is.
