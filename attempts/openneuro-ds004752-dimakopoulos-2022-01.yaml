- claim: fig3-gc-reversal-p2-p3
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_dimakopoulos_2022.ipynb
  output: claim:fig3-gc-reversal-p2-p3
  notes: In Participant 3 (sub-12), with the right hippocampus as the criterion requires, reading h2
