- claim: fig3no-p4-right-no-gc
  outcome: blocked
  notebook: reproduce_dimakopoulos_2022.ipynb
  notes: The test as run here cannot show an absence at the paper's 5% level. On the real pairing the
    per-frequency test finds significant ΔGranger somewhere in [4 20] Hz in 24 of 24 contact and period
    tests with h1, 20 of 24 with h2 and 24 of 24 with h3 (in [4 8] Hz in 21, 13 and 23), and the cluster
    test in 16, 14 and 22 of 24; the largest absolute theta ΔGranger is 0.041, 0.101 and 0.039. On mismatched
    trial pairs of Participant 4 (4 contacts, 5 shifts), with no trial-by-trial coupling, the per-frequency
    test flags 90% to 100% of tests and the cluster test 10% to 40%, against the nominal 5%, so the criterion
    (no contact significant) fails under either test whether or not there is GC. The cluster test flags
    the real pairing more often than the mismatched one in three of four reading and period cells (h1
    encoding 58% against 40%, h1 maintenance 75% against 10%, h2 encoding 100% against 30%, h2 maintenance
    17% against 30%). The direction-swap null of the Methods is not described in enough detail to reach
    the paper's false-positive rate, and the code's significance script uses a different null (trial shuffling,
    1st and 99th percentiles).
  blocked_by: methods_underspecified
  output: claim:fig3no-p4-right-no-gc
- claim: table1-left-hemisphere-sources
  outcome: blocked
  blocked_by: not_runnable
  notebook: reproduce_dimakopoulos_2022.ipynb
  notes: The test needs LCMV beamforming of the scalp EEG on an AAL grid and FieldTrip's cluster-based
    source statistics. FieldTrip runs in MATLAB, which cannot be installed in the locked Python environment,
    and the code aligns each participant's electrodes to the template head by hand (ft_electroderealign
    with cfg.method interactive). The dataset holds five averaged virtual sensors per participant, not
    the source grid, so the hemisphere shares cannot be read from it. An approximation in MNE on a template
    head with template 10-20 positions and an AAL atlas from outside the dataset was not attempted; 4
    participants have 8 scalp channels in the derivative files (6 without the mastoids).
