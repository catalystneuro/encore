- claim: table1-left-hemisphere-sources
  outcome: blocked
  blocked_by: not_runnable
  notebook: reproduce_dimakopoulos_2022.ipynb
  notes: The test needs LCMV beamforming of the scalp EEG on an AAL grid and FieldTrip's cluster-based
    source statistics. The code aligns each participant's electrodes to a template head model by hand
    (ft_electroderealign with cfg.method interactive), which cannot be repeated, and FieldTrip runs in
    MATLAB, which cannot be installed in the locked environment. The dataset holds five averaged
    virtual sensors per participant, not the source grid, so the hemisphere shares cannot be read from
    it either.
