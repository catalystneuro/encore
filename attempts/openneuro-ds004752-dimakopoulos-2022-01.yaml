- claim: scalp-temporal-laplacian
  outcome: not_reproduced
  notebook: reproduce_dimakopoulos_2022.ipynb
  output: claim:scalp-temporal-laplacian
  notes: The derivative scalp channels are referenced to the averaged mastoids (A1 = -A2). With that
    reference the paired test finds encoding below maintenance under every d2 reading (18 of 18, p =
