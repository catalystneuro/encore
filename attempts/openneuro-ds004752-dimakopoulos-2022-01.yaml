  output: claim:fig4f-incorrect-no-reversal
  notes: 'Each derivative virtual sensor is an exact linear combination of the file''s scalp channels
    (R² = 1.000000 in all 150 fits), so each period''s filter was recovered and applied to the raw EEG,
    re-referenced to the averaged mastoids. On the correct trials the recomputed AC source matches the
