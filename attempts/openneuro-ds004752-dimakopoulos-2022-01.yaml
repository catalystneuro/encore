- claim: fig2bc-gamma-encoding-p1
  outcome: partially_reproduced
  notebook: reproduce_dimakopoulos_2022.ipynb
  output: claim:fig2bc-gamma-encoding-p1
  notes: Participant 1 is sub-10 (participants.tsv). Gamma at H3 rose by 179% over [40 100] Hz and [-5
    -3] s (183% with all set size 6 and 8 trials), above 100%. At C2 gamma [60 80] Hz in [-4 -3] s rose
    by 17% on average (14% with all trials; largest time-frequency point 61%), not above 100%. The code's
    z-score test marks 11 of 64 contacts (A2, B1, B2, E1 and H7 temporal; A3, C6 and D6 parietal; G4 occipital;
    H2 and H3 without an atlas label), all in temporal and occipital-parietal cortex. That statistic z-scores
    over frequency and takes the maximum; on one trial-permuted data set it exceeded 1.96 at 1 contact
    of 64. The outcome is partial because two of the criterion's three parts hold (H3 and the z-test)
    and C2 does not.
  deviations:
  - The ECoG is re-referenced to a white-matter depth contact chosen by rule (the paper names none); the
    contact used is printed in the data check.
  - The PSD baseline leaves out fixation times whose 10-cycle window would start before the epoch (the
    epochs begin at -6 s).
  - Contacts are assigned to regions by the dataset's atlas labels; H3 has none and is taken as occipital,
    as the paper names it.
- claim: fig2d-cortical-beta-maintenance-p1
  outcome: reproduced
  notebook: reproduce_dimakopoulos_2022.ipynb
  output: claim:fig2d-cortical-beta-maintenance-p1
  notes: The largest [11 14] Hz increases in [-2 0] s are at the posterior contacts H3 (35%), H4 (26%,
    temporal), H2, F8 (occipital), H5 and G3 (occipital). The 5 contacts with a significant increase over
    fixation (p < 0.05, 200 permutations) are F8 (occipital), H4 and H5 (temporal), and H2 and H3 (no
    atlas label; the paper calls H3 occipital); with all trials G3 is added (6 contacts). The 64 tests
    are uncorrected; 3.2 significant contacts are expected by chance (P of 5 or more = 0.22) and none
    survives a Benjamini-Hochberg correction, so the evidence is weak. The paper reports no magnitude.
  deviations:
  - The paper does not describe the permutation test of Figure 2d; maintenance and fixation are swapped
    in a random half of the trials, 200 times, one-sided.
