- claim: scalp-temporal-laplacian
  outcome: reproduced
  notebook: reproduce_dimakopoulos_2022.ipynb
  output: claim:scalp-temporal-laplacian
  notes: The derivative scalp channels are referenced to the averaged mastoids (A1 = -A2). Under h1, T5
    (e2), d1 and the paired test (s1), encoding ΔGranger is below maintenance with the mastoid reference
    (medians 0.0035 and 0.0109, p = 0.020, 10 participants) and not after the spline Laplacian (p = 0.29)
    or the Hjorth derivation (p = 0.89). This holds in 1 of 36 cells (18 h, e and d readings, two tests),
    1 of 9 d1 readings, at p = 0.02 without correction for the readings, and appeared only after the white-matter
    reference was moved (verifier round 1), and the encoding median is positive, so the flow toward the
    hippocampus in encoding is absent. Under h2 and h3 no d1 reading is significant with the mastoid reference.
    Under every d2 reading the test is significant with the mastoid reference (p = 0.005 to 0.015) and
    stays significant after both derivations (p = 0.005 to 0.025). The group test (s2) finds no reversal
    under any reading. 8 participants have T3 and 10 have T5 in the derivative files.
  deviations:
  - The scalp channels are those of the derivative files (the same trials as the sources); the spline
    Laplacian is MNE's on standard 10-20 positions, standing in for FieldTrip's.
  - The outcome rests on readings h1 and d1. h1 is adopted because the Methods describe the hippocampal
    LFP re-referenced to a white-matter contact, which h1 is (h2 is the code's bipolar derivation, and
    the Methods come first); d1 because the Results say ΔGranger was averaged over [4 8] Hz, while d2
    makes the pattern by construction (fig4d-reversal-all). The criterion lets the electrode and the test
    vary (one electrode and test reading) and leaves h and d open, so the adoption of h1 and d1 decides
    which cells count; whether the criterion should require the sign pattern is asked of a reader. Before
    the white-matter reference was moved to the hemisphere of the hippocampal contact (verifier round
    1), no reading met the criterion.
  assumed: true
