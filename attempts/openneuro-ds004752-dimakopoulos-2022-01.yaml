- claim: fig2fg-plv-theta-p1
  outcome: not_reproduced
  notebook: reproduce_dimakopoulos_2022.ipynb
  output: claim:fig2fg-plv-theta-p1
  measured: 0.24
  notes: Theta PLV between the hippocampus and C3 in maintenance is 0.240 (h1), 0.164 (h2) and 0.195
    (h3), below 0.36. It does not exceed fixation (p = 0.72, 0.49 and 0.35) and no contact shows a
    significant theta increase over fixation except 2 non-auditory contacts under h2. Against encoding,
    the variant, C3 is significant (p = 0.010 to 0.025) with 16 to 21 significant contacts, 4 to 6 of
    them auditory. The highest maintenance theta PLV is at A1 to A3, with C3 and B3 among the six highest.
  deviations:
  - The per-contact and per-frequency test is a trial-wise swap of the two periods' phasors, 200 times,
    against the 95th percentile; the cluster step of the code is reported as runs of significant
    frequencies.
- claim: fig2h-gc-reversal-p1
  outcome: reproduced
  assumed: true
  notebook: reproduce_dimakopoulos_2022.ipynb
  output: claim:fig2h-gc-reversal-p1
  notes: With h1 (AHL1 against the white-matter contact AHL3) and the per-frequency test, ΔGranger to C2
    is below the null's 5th percentile in encoding at 6.75 to 7.2 and 7.55 to 9.05 Hz and above its 95th
    percentile in maintenance at 7.0 to 7.45 Hz, overlapping theta in both. Under h2 only maintenance is
    significant (6.15 to 7.9 Hz), under h3 neither, and with clusters (c2) maintenance is not
    significant under any reading. The code's variant (AHL2-AHL3, trial-shuffle null, 1st and 99th
    percentiles) finds encoding at 5.9 to 6.15 Hz and nothing in maintenance. The direction-swap null
    is narrow; the same test flags significant frequencies in all 24 tests of h1 in Participant 4,
    whom the paper reports as showing no GC, so a significant band here is weak evidence.
  deviations:
  - The outcome rests on reading h1 with the per-frequency test (c1); the readings disagree, and h1 is
    adopted as the contact Figure 1d localises (the most distal hippocampal contact). The electrode
    (AHL) and the white-matter reference contact are chosen by rule, not given by the paper.
  - GC is computed in Python with a Wilson factorisation following FieldTrip, checked on an analytic
    autoregressive process; signals are resampled with scipy's polyphase filter.
- claim: fig2ijk-spatial-spread-p1
  outcome: not_reproduced
  notebook: reproduce_dimakopoulos_2022.ipynb
  output: claim:fig2ijk-spatial-spread-p1
  notes: In encoding the most negative theta ΔGranger is at G6, an occipital contact (h1 and h2; H5
    under h3), not an auditory one. Of the 7 contacts with significant positive ΔGranger in maintenance
    (h1), none is auditory and H3 is not among them. The spatial test is not significant, the true
    scalar products having a median of -0.0041 against a null median of -0.0012 and a null 95th
    percentile of 0.013 (0% of true values above it).
  deviations:
  - For the notebook's time limit, the per-contact tests ran with h1 only (h2 and h3 values are shown
    without a test), and the spatial test ran on maintenance with h1 only.
  - In the spatial null each trial's window is drawn at random from fixation (1 s) or maintenance
