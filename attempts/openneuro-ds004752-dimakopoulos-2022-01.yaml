- claim: fig2h-gc-reversal-p1
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_dimakopoulos_2022.ipynb
  output: claim:fig2h-gc-reversal-p1
  notes: With clusters (c2) no reading shows the reversal between the hippocampus and C2. Under h1 encoding
    has significant clusters overlapping theta (7.55 to 9.05 Hz, p = 0.01) and maintenance none; under
    h2 and h3 neither period has a theta cluster. The per-frequency test (c1) shows the reversal under
    h1 only (encoding 6.75 to 7.2 and 7.55 to 9.05 Hz, maintenance 7.0 to 7.45 Hz). On shifted trial pairs
    of this participant (cortical trials shifted by 1 to 10 positions) c1 flags the reversal in 40% (h1)
    and 20% (h2) of shifts and theta in 30% to 70% of single tests, and c2 flags the reversal in 0% of
    shifts; the direction-swap null puts 8% to 16% of bins beyond its 5th or 95th percentile, against
    5%. With each period's evoked response subtracted from both signals, c1 still flags the reversal in
    20% to 50% of shifts in Participants 1 to 4 and theta in 20% to 83% of single tests, and c2 the reversal
    in none, so c1's excess does not come from the evoked responses; with a scrambled-trial null c1 flags
    theta in 20% to 60% of single tests. The scrambled-trial cluster test of the Figure 2h legend, run
    beside the criterion, flags theta in 0% to 20% of single shifted tests and the reversal in none; on
    the real pairing it finds an encoding cluster overlapping theta under h1 (7.45 to 9.05 Hz) and no
    maintenance cluster under any reading. The rates rest on 5 to 10 shifts per cell. The code's variant
    (AHL2-AHL3, trial-shuffle null, 1st and 99th percentiles) finds encoding at 5.9 to 6.15 Hz and nothing
    in maintenance.
  deviations:
  - The outcome rests on the cluster reading (c2). The per-frequency reading (c1), which the Methods describe,
    flags the reversal in 20% to 90% of shifted trial pairings in Participants 1 to 3, which have no trial-by-trial
    coupling but keep the stimulus-locked responses, and in 20% to 50% with those responses subtracted,
    far from the 5% of the paper's p < 0.05, so as run here it is not the paper's test; c2, the cluster
    version of the same test, flags it in 0% to 10%. The Figure 2h legend names a cluster test against
    scrambled trials, which the criterion does not; it was run beside the criterion and agrees with c2
    (asked of a reader in questions/openneuro-ds004752.yaml). The electrode (AHL) and the white-matter
    reference contact are chosen by rule, not given by the paper.
  - GC is computed in Python with a Wilson factorisation following FieldTrip, checked on an analytic autoregressive
    process; signals are resampled with scipy's polyphase filter.
