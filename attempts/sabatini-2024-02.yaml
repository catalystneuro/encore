- claim: fig2c-condition-lds-variance
  outcome: reproduced
  notebook: reproduce_sabatini_2024.ipynb
  output: claim:fig2c-condition-lds-variance
  notes: Cross-validation chooses 5 dimensions for the J arrays and 7 for the N arrays under the Methods'
    projection score (the LDS score gives 5 for PMd-N), all inside 5 to 9, and the single-condition LDSs
    explain 83.2%, 90.5%, 92.8% and 94.1% (90.9% for PMd-N at 5), all above 63.9%. The choice is the same
    under the four other seeds. Units are unsorted threshold crossings (see data-composition).
  deviations:
  - The Methods describe the dimensionality cross-validation as projecting one partition's average on
    its top k singular vectors and scoring the other partition (Methods, Fitting dynamics to single conditions);
    the code's crossValidateDimensionalityConditions.m calls idDynamics, whose returned approximation
    is the training data itself, so its score does not depend on k. Both the Methods' projection score
    and a score of the simulated LDS were run; both choose 5 to 7.
  - Half-lives above 10 s are capped in the simulated dynamics too (Methods); the code caps only the reported
    eigenvalues.
  - The code's 3/4 split runs 20 folds and the seed check 10 folds per seed, for time.
  - Trials are aligned on the file's move_begins_time, its movement onset time; the paper says only aligned
    to movement onset (Methods, Subjects, behavior and data pre-processing). The offline onset in the
    file is 25 ms (J) and 52 ms (N) earlier in the median. Assumption, as the online onset is the one
    the file names movement onset.
  - The units are the dataset's unsorted threshold crossings, all 96 per array, where the paper used sorted
    single units and stable multi-units (Methods, Subjects, behavior and data pre-processing).
