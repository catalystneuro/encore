findings:
- kind: data_missing
  about: data
  severity: major
  notebook: reproduce_sabatini_2024.ipynb
  output: finding-unsorted-units
  statement: The units are unsorted threshold crossings, one per electrode (96 per array, Blackrock unit
    code 0, as the units table's description says), where the paper analysed sorted single units and stable
    multi-units, 79 to 118 per array. The sorting, and so the paper's unit counts and unit selection,
    are not in the dandiset; every population analysis here runs on the threshold crossings.
- kind: metadata_insufficient
  about: data
  severity: minor
  statement: The trials tables of two Nitschke sessions (2010-09-20 and 2010-09-22) have no maze_condition
    column, so their trials cannot be grouped by condition from the file. These sessions are not the ones
    the paper names, and were not analysed.
- kind: other
  about: data
  severity: none
  notebook: reproduce_sabatini_2024.ipynb
  output: sanity
  statement: 'Checks that passed. In both sessions the paper names, 72 conditions split 36 without and
    36 with barriers, and the trial counts (1595 and 2121 successful trials) are within 10% of the paper''s
    1469 and 2014. The trial table, spikes and hand share a clock: the condition-mean hand speed peaks
    120 to 140 ms after the table''s movement onset, and reach direction decodes from spikes 0 to 300
    ms after onset at 0.80 to 0.92 against 0.20 to 0.23 with shuffled labels. Hand positions are in mm
    with a conversion of 0.001 to meters. No two of the ten sessions share their trial and spike counts.'
- kind: code_mismatch
  about: paper
  statement: In the published code, idDynamics.m returns the training data itself as its approximation
    (approx(cond).matrix = data(cond).matrix), so crossValidateDimensionalityConditions.m scores every
    dimensionality the same and cannot choose the 5 to 9 dimensions the paper reports. The Methods describe
    a different score (projection of one partition on its top k singular vectors, variance explained in
    the other).
- kind: methods_unavailable
  about: paper
  statement: Questions for the authors. (1) Which movement onset were the data aligned on, the online
    or the offline estimate (they differ by 25 to 52 ms in the median)? (2) Were hand positions taken
    relative to the start of the reach before the reach parameters were fitted on the kinematic basis
    without an intercept? (3) Which version and parameters of the jPCA codepack were used (getRotations.m
    calls jPCA with defaults on data already soft-normalised)? This attempt assumed the online onset,
    start-relative positions and the codepack's defaults; the kinematic claims and fig7c-standard-encoding-worse
    are marked as resting on the second assumption.
- kind: methods_unavailable
  about: paper
  statement: The code for kinFuncEval (the kinematic basis functions), the regression of the state space
    location on the reach parameters (Figure 6e), GPFA and the 250 ms post-reach warp is not in the repository,
    and the preprocessed .mat files it loads are available only on request, so the order and selection
    of the 72 conditions and the units cannot be checked against the code.
