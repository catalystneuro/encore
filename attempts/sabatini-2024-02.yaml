  about: paper
  statement: In the published code, idDynamics.m returns the training data itself as its approximation (approx(cond).matrix
    = data(cond).matrix), so crossValidateDimensionalityConditions.m scores every dimensionality the same and cannot choose
    the 5 to 9 dimensions the paper reports. The Methods describe a different score (projection of one partition on its top
    k singular vectors, variance explained in the other).
