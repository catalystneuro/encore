  about: paper
  statement: Questions for the authors. (1) Which movement onset were the data aligned on, the online or the offline estimate
    (they differ by 25 to 52 ms in the median)? (2) Were hand positions taken relative to the start of the reach before the
    reach parameters were fitted on the kinematic basis without an intercept? (3) Which version and parameters of the jPCA
    codepack were used (getRotations.m calls jPCA with defaults on data already soft-normalised)? (4) How large was the subset
    of single-trial samples the kernel decoders of Figure 7f were trained on, and how were the velocity decoders' outputs
    turned into positions? This attempt assumed the online onset (and showed that the onset-dependent claims keep their outcomes
    on the offline onset), start-relative positions, the codepack's defaults, subsets of 4,000 and 12,000 samples and integration
