  - 2121
  notes: Under both trial readings each monkey has 72 conditions, 36 without barriers (straight) and 36
    with barriers (curved). Monkey J has 1595 successful trials (1381 with delay above 400 ms) and N has
    2121 (1884), all within 10% of 1469 and 2014. Each array has 96 units, but they are unsorted threshold
    crossings, one per electrode; the dataset marks no single or multi-units, so the paper's 79 to 118
    sorted units per array cannot be counted.
  deviations:
  - The units are the dataset's unsorted threshold crossings, all 96 per array, where the paper used sorted
    single units and stable multi-units (Methods, Subjects, behavior and data pre-processing). The dataset
    marks none as single or multi-unit, so the unit count of the criterion cannot be taken; 96 per array
    is inside 71 to 130.
  - Both trial readings were run (all successful trials; delay above 400 ms) and both match; the measured
    values are reading (a).
  - 'Condition selection: the maze conditions that are multiples of 3 are exactly the 3-target versions
    in both sessions (readings a and b agree). Condition 0 (203 and 419 trials) is not a maze condition
    and is left out.'
  - Trials are aligned on the file's move_begins_time, its movement onset time; the paper says only aligned
    to movement onset (Methods, Subjects, behavior and data pre-processing). The offline onset in the
    file is 25 ms (J) and 52 ms (N) earlier in the median. Assumption, as the online onset is the one
    the file names movement onset.
- claim: jpca-fit-r2
  outcome: partially_reproduced
  notebook: reproduce_sabatini_2024.ipynb
  output: claim:jpca-fit-r2
  notes: 'Under reading (b), the unconstrained fit, the R2 over all conditions is 0.831 (M1-J), 0.583
    (PMd-J), 0.656 (M1-N) and 0.475 (PMd-N): two of four inside 0.576 to 0.803 (reading a: one of four).
    Straight-only fits (0.748 to 0.882) and curved-only fits (0.575 to 0.770) are inside their ranges
    in all four datasets, and straight is above curved in all four. The per-condition signed-rank test
    gives p < 0.001 only for M1-J (p = 0.44 to 0.61 elsewhere). Reading (a), the skew-symmetric fit, gives
    0.777, 0.544, 0.550 and 0.446 (one of four in range). Units are unsorted threshold crossings (see
    data-composition).'
  deviations:
  - jPCA is implemented from the codepack's published description (6 PCs, its soft normalisation of range
    plus 10 and mean subtraction, skew-symmetric least squares) because the codepack is not in the paper's
    repository; the input follows getRotations.m.
  - The signed-rank test's pairing is the claims file's reading (per-condition R2 in the top plane, straight
    against curved conditions paired in code order).
  - Trials are aligned on the file's move_begins_time, its movement onset time; the paper says only aligned
