- claim: fig1b-phage-effect-diminishes
  outcome: reproduced
  notebook: reproduce_wang_2024.ipynb
  output: claim:fig1b-phage-effect-diminishes
  notes: Days 2 to 12, as the criterion now names them, temperature x phage x time F(5, 180) = 3.870, p = 0.0024, as
    in Table S1a; the -P minus +P
    difference at day 12 (0.3219 at 25 C, -0.0080 at 35 C) is below its largest earlier value (0.4362, 0.5046, day
    2). With days 0 to 10 the interaction is F = 1.464, p = 0.2039 (not significant), while the differences still
    decline; with all seven days p = 0.0025. The first run asked which six time points enter the ANOVA and decided
    this claim on days 2 to 12, noting that days 0 to 10 would make it partially reproduced. The reader's answer
    put days 2 to 12 in the criterion and ruled out days 0 to 10, so the outcome stands on the criterion's own time
    points and the other two sets are variants that decide nothing. The criterion compares only the last day with
    the largest earlier value; at 25 C the difference is not a steady decline, falling to 0.049 on day 8 and rising
    to 0.322 on day 12.
