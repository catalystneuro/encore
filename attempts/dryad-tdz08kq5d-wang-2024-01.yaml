    the dataset holds the authors' output of the pipeline the criterion names, which was not re-run (the tools are
    not installable in a locked Python environment; for the genomes the reads are not public).
findings:
- kind: metadata_error
  statement: The twitching sheet (Figure 2D) does not identify its clones. It has no morphotype column; its four
    35_1 rows carry the names of four 35_0 SCV clones (6b6s1, 6b6s2, 6b8s1, 6b8s2) with different values, where
    the biofilm and disease sheets name the 35_1 clones 6b1s1, 6b1s2, 6b2s3 and 6b2s4; and in 25_0 the four mucoid
    names 6d5a2 to 6d8a2 appear twice with different values, where the other sheets have four SCVs.
- kind: other
  statement: 'The deposited twitching values do not reproduce Table S3d: with the colony types of the design, the
    residual sum of squares is 28.32 against 35.78 and the temperature sum of squares 2.48 against 3.857; only colony
    type x phage (27.04) and temperature x colony type (0.081) agree. Every other ANOVA the paper prints (Tables
    S1a, S1b, S2, S3a to S3c, S3e, S3f) is reproduced from the deposited data.'
- kind: metadata_insufficient
  statement: The variant table (snp_indel) gives, per variant and group of four sequenced clones, the number of
    clones that carry it, not which clones. Per-clone mutation counts and co-occurrence (for example whether the
    gspE and gspF mutations of 35 C +P SCVs are in different clones) cannot be read, and the genome reads are not
    public.
- kind: data_missing
  statement: BioProject PRJNA1028400, named in the paper for the genomes of the evolved clones, has 28 BioSamples
    and 14 assemblies and no sequencing runs, so the reads the variant calls come from are not public. The RNA-seq
    reads are public in PRJNA1032726 (ten runs), though the Methods say they are shared on request.
- kind: data_missing
  statement: The growth curves the maximum growth rates and carrying capacities were fitted to are not deposited,
    only one fitted value per clone, so the fits cannot be repeated and the model behind them (logistic, as the
    Methods say, or the code's best of four by AIC) cannot be checked. The pilB and pilM data of Table S6 are not
    deposited either.
- kind: paper_inconsistency
  statement: 'The data disagree with statements of the text: SCVs form more biofilm than the ancestor in every clone
    (0.58 to 0.95 against 0.49 OD570), where the text says they retained ancestral-level biofilm; gspG is upregulated
    (log2FC 2.04) in the deposited DESeq2 table and Figure 4C list, where the text lists it as downregulated; phcS
    has log2FC 0.41, below the threshold under which the text calls it significantly upregulated; mucoid colonies
    are 15.3% at 25 C without phage, where the text says around 20%; and the 0.24% the text gives as an SCV frequency
    is the mucoid frequency of the 25 C +P treatment.'
- kind: paper_inconsistency
  statement: 'Small misprints in the paper''s statistics, against the data: the area-under-curve ANOVAs are printed
    with df (1, 19) for 20 populations (the data give the printed F at df (1, 18)); the phage density time effect
    is printed in the text as F1,18 = 84.88, which is its sum of squares (F(2, 36) = 86.963 in Table S1b); Table
    S3e prints the temperature sum of squares as 0.346 for 0.3646; Table 1 places the RSc3091 deletion at C-432461,
    the variant table at 431461.'
- kind: metadata_insufficient
  statement: The OD600 values of Figure 1B include day 0 and negative values (eight, down to -0.029, at 25 C with
    phage), so they are blank-corrected and include the inoculation, neither of which the README or Methods says;
    the paper's ANOVA uses days 2 to 12. The README does not give units for the growth rate (headed maxgrowthrate(OD600))
    or say that adsorption is a proportion.
- kind: metadata_error
  statement: In the carrying capacity sheet the ancestor's value (1.4355) is headed maxgrowthrate(OD600). The variant
    table's GENE column holds PROKKA names that differ from the paper's (phcS is sasA_8, pilD outO, gspE hxcR, gspF
    epsF_1); the gene_blast sheet gives the paper's names by locus tag. The Figure 4B list holds 11 genes where
    the paper speaks of 13.
