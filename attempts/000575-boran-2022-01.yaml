findings:
- kind: other
  statement: >-
    The spikes may be misaligned with the trial table. Workload information in the spikes
    (squared t of low against high workload, summed over units) is at chance in every session when
    the spikes of trial window i are paired with the label of trial i (p = 0.12 to 0.94 against
    shuffled labels). Pooled over the 7 sessions with all 192 trials it peaks when they are paired
    with the label of trial i + 3 (corrected p = 0.005), and decoding workload from all neurons
    gives 0.46 as deposited, below scrambled labels, against 0.60 with every session moved by three
    trials. Session by session the shift is supported less: of the 7 complete sessions only P03S1
    and P06S1 have p < .05 at a shift of three trials, P02S1 has p = 0.95 there and four others peak
    at other shifts, and the pooled peak is weighted toward P03S1 and P06S1 (52 and 96 units). In
    the 9 sessions with fewer trials no single shift carries the information, and the trial table
    holds no source numbering that would show where trials were left out. A single offset is
    therefore not established. Within trials, the spikes are consistent with the epochs.
- kind: metadata_error
  statement: >-
    The location of each unit is the atlas label of the macro contact whose number equals the
    unit's microwire number (for example the units on wire AHL6 get the label of contact AHL6, in
    the middle temporal gyrus). The microwires protrude from the tip of the electrode, so these are
    not the units' locations; 614 of 809 units get a label outside hippocampus, parahippocampal
    gyrus and amygdala.
- kind: metadata_insufficient
  statement: >-
    The dandiset does not hold the assignment of units to regions the paper used, nor the location
    of the microwire tips that Figure 1d shows. By electrode name the units are 361 hippocampal, 217
    entorhinal and 226 amygdala; by the atlas label of the tip contact 362 hippocampal, 168
    parahippocampal, 146 amygdala and 133 elsewhere; with those 133 placed by the nearest contact
    with an MTL label (or the electrode name where there is none) 467, 196 and 146; the paper
    reports 454, 209 and 146. Five units are on bundles (PCL, HL, HR) that the subject descriptions do not
    list as implanted.
- kind: metadata_error
  statement: >-
    Participant 12's two sessions are each deposited twice, in four files with the same session
    start time (2016-12-17 10:38); the pairs are identical, and only the identifiers (session01,
    session02) tell the sessions apart.
- kind: metadata_error
  statement: >-
    The response timestamps put 1385 of 3038 responses before the test array appears. The
    conversion adds the trial start and a 1.7 s event offset to the stored response time; read
    that way, the stored values are response times from test onset of 0.41 to 3.15 s. The response
    series does not say what its timestamps mean.
- kind: selection_undocumented
  statement: >-
    Sessions hold 174 to 192 trials (3038 in all), where the paper and the files' task description
    state 192 per session. Trial ids run without gaps, and which trials were left out, and why, is
    not documented.
- kind: other
