    outcome, which the criterion gives when only its first condition holds, carries little weight.
- claim: fig4d-decode-workload-all
  outcome: not_reproduced
  notebook: reproduce_boran_2022.ipynb
  output: claim:fig4d-decode-workload-all
  measured: [44.2, 44.2, 45.8]
  notes: >-
    Measured values are pseudo-trials (c), z-scored features (e) and the window centred at 1.2 s
    after memory onset (reading a). All 809 neurons give median accuracies of 0.442 (1.2 s), 0.458
    (1.3 s) and 0.452 (median over maintenance windows, reading b), p = 0.76 to 0.87 against 200
    scrambled runs; readings (d) and (f) give 0.440 to 0.487, p of 0.54 or more. Leaving out each
    participant gives quartiles 0.442 to 0.458 (1.2 s), 0.454 to 0.467 (1.3 s) and 0.454 to 0.462
    (reading b). With every session's spikes moved by three trials (variant) accuracy is 0.583 to
    0.587, p = 0.04 to 0.08, still far from 87.5%. The training sets hold 114 pseudo-trials per
    split under reading (c) and 190 under reading (d), where the paper gives 145 to 169 (95% of
    each session's 153 to 178 correct trials); neither reading uses each session's whole
    correct-trial set. Accuracy as deposited is below the scrambled runs (0.50), which fits the
    misalignment of spikes and labels suggested by the data check, so this failure may come from the
    deposited data; moving every session by three trials gives 0.585, far from 87.5%.
  deviations:
  - >-
    100 resampling runs and 200 scrambled runs for readings (c) and (e), 50 and 100 for the other
    readings, and 30 runs per left-out participant without a null, against 500 and 1000 in the
    paper, for time; the smallest p is 0.005 (0.0099), below the corrected threshold of .0125.
  - >-
    Window centres are on a 100 ms grid from memory array onset (0.9 to 1.6 s); the paper does not
    say where the grid starts.
  - >-
    The SVM is fitted on a precomputed linear kernel (sklearn SVC, C = 1), which is the linear
    libsvm classifier of the NDT toolbox.
