findings:
- kind: other
  statement: >-
    The spikes appear to be misaligned with the trial table in part of the sessions. Workload
    information in the spikes (squared t of low against high workload, summed over units) peaks
    when the spikes stored in trial window i are paired with the label of trial i + 3, not i, and
    decoding workload from all neurons gives 0.46 as deposited, below scrambled labels, against
    0.60 with every session moved by three trials. The best shift differs between sessions and the
    offset per session could not be established. Within trials, the spikes are consistent with the
    epochs.
- kind: metadata_error
  statement: >-
    The location of each unit is the atlas label of the macro contact whose number equals the
    unit's microwire number (for example the units on wire AHL6 get the label of contact AHL6, in
    the middle temporal gyrus). The microwires protrude from the tip of the electrode, so these are
    not the units' locations; 614 of 809 units get a label outside hippocampus, parahippocampal
    gyrus and amygdala.
- kind: metadata_insufficient
  statement: >-
    The dandiset does not hold the assignment of units to regions the paper used, nor the location
    of the microwire tips that Figure 1d shows. By electrode name the units are 361 hippocampal, 217
    entorhinal and 226 amygdala; by the atlas label of the tip contact 362 hippocampal, 168
    parahippocampal, 146 amygdala and 133 elsewhere; the paper reports 454, 209 and 146. Five units are on bundles (PCL, HL, HR) that the subject descriptions do not
    list as implanted.
- kind: metadata_error
  statement: >-
    Participant 12's two sessions are each deposited twice, in four files with the same session
    start time (2016-12-17 10:38); the pairs are identical, and only the identifiers (session01,
    session02) tell the sessions apart.
- kind: metadata_error
  statement: >-
    The response timestamps put 1385 of 3038 responses before the test array appears. The
    conversion adds the trial start and a 1.7 s event offset to the stored response time; read
    that way, the stored values are response times from test onset of 0.41 to 3.15 s. The response
    series does not say what its timestamps mean.
- kind: selection_undocumented
  statement: >-
    Sessions hold 174 to 192 trials (3038 in all), where the paper and the files' task description
    state 192 per session. Trial ids run without gaps, and which trials were left out, and why, is
    not documented.
- kind: other
  statement: >-
    Spikes are stored only inside trial windows (fixation onset to 2 s after test onset), so
    nothing between trials, including the inter-trial interval, can be analysed. The fixation
    period is a fixed 0.9 s in the epochs, where the task description has a jittered black dot.
- kind: paper_inconsistency
  statement: >-
    The Results give the response-time ANOVA (F = 48.47) on mean response time; on this dataset
    that F is obtained exactly from per-session median response times (mean gives 61.36), which
    Figure 1c plots. The 118 ms/item slope is not obtained by any of three readings (69 to 76).
