- claim: fig4a-dpca-separates-set-sizes
  outcome: not_reproduced
  notebook: reproduce_boran_2022.ipynb
  output: claim:fig4a-dpca-separates-set-sizes
  measured: [32.88, 81.41]
  notes: >-
    With no regularisation (reading c) and kernel (a), dPCs 2 to 4 explain 32.88% and the first 15
    dPCs 81.41%, both within tolerance (kernel b, 30.97% and 77.74%; the cross-validated lambda of
    reading d, 22.21% and 48.20% for kernel a). dPCs 2 to 4 are time components. With set-size
    labels shuffled within sessions and dPCA refit (99 times), the set-size variance in the first
    15 dPCs is 19.23% (median) against 19.50% observed, p = 0.35; dPCs 2 to 4 give p = 0.27 and the
    mean distance between set-size trajectories during maintenance p = 0.53. So the variance values
    reproduce, but the set sizes are not separated beyond chance, and the criterion's test fails.
    In all 99 shuffled fits dPCs 2 to 4 are time components too, so their variance cannot detect
    set-size information; the set-size variance of the first 15 dPCs is the test that can.
    With every session's spikes moved by three trials (variant) the values are 32.59% and 80.34%.
  deviations:
  - >-
    Spike counts are binned at 10 ms before smoothing, not 1 ms; with a 167 or 200 ms SD kernel this
    is a standard choice that changes the smoothed rates very little. The smoothing is renormalised
    at the trial edges, where no spikes are stored. Explained variance is computed as in the dPCA
    toolbox (Kobak et al. 2016), from the python package dPCA 1.0.5.
  - The null uses 99 shuffles, not 499, for time; its smallest p is 0.01.
- claim: fig4b-speed-lowest-in-maintenance
  outcome: reproduced
  notebook: reproduce_boran_2022.ipynb
