- claim: behavior-rt-set-size
  outcome: partially_reproduced
  notebook: reproduce_boran_2022.ipynb
  output: claim:behavior-rt-set-size
  measured: [2678, 68.8, 48.47]
  notes: >-
    Measured values are those of reading (b), per-session median RT, with slope reading (i); no
    reading matches every value. There are 2678 correct trials. RT rises with set size in all 16
    sessions. On per-session median RT the ANOVA gives F(3, 45) = 48.47, the paper's value, with
    permutation p = 0.0002; on mean RT (reading a) F = 61.36, outside tolerance. The slope is 75.8
    (i), 76.2 (ii) and 75.8 (iii) ms/item on mean RT and 68.8, 76.2 and 68.8 on median RT, all
    outside 118 +- 11.8. The effect and its test hold, the slope is about 60% of the reported one.
    The text says the ANOVA is on mean RT, and its F equals the one on median RT here (Figure 1c
    shows medians).
  deviations:
  - >-
    RT is the stored response timestamp minus trial start minus 1.7 s, read as the time from test
    onset (data check; the conversion adds 1.7 s to the stored response time). The slopes and F
    values do not depend on this offset.
- claim: neurons-recorded
  outcome: partially_reproduced
  notebook: reproduce_boran_2022.ipynb
  output: claim:neurons-recorded
  measured: [809, 361, 217, 226, 50.6, 25.4, 11, 96]
  notes: >-
    809 neurons, 50.6 +- 25.4 per session (range 11 to 96), all within tolerance. By the claims
    file's rule (bundle label) 361 are in hippocampus, 217 in entorhinal cortex and 226 in amygdala,
    and 5 on bundles the rule does not cover (PCL in participant 8, HL and HR in participant 11);
    the entorhinal count is within tolerance, the hippocampal (454) and amygdala (146) counts are
    not. By the atlas label of each bundle's tip contact (variant) the counts are 495, 168 and 146.
    The question whether the paper assigned regions by electrode name or by tip location is asked
    of a reader (questions/000575.yaml).
- claim: spike-sorting-quality
  outcome: not_reproduced
  notebook: reproduce_boran_2022.ipynb
  output: claim:spike-sorting-quality
  measured: [0.79, 1.77, 5.93, 2.31]
  notes: >-
    Over within-trial intervals 0.79 +- 1.77% of ISIs are under 3 ms (median 0.31%, maximum
    26.46%); the mean equals the paper's, the SD is outside 1.54 +- 0.154. 506 of 809 units (62.5%)
    are below 0.5%. The SNR, peak of the mean waveform over the mean waveform SD (reading a), is
    5.93 +- 2.31; with the SD at the peak sample 5.96 +- 1.43, with the SD of the first five samples
    5.92 +- 2.78, all against 3.81 +- 0.82. The criterion's partial condition needs both ISI values,
    so neither condition is met.
  deviations:
  - >-
    Reading (i) of the ISI, the whole recording, cannot be computed, as the files hold spikes only
    inside trial windows. Reading (b) of the SNR, a noise level stored by the spike sorter, cannot
    be computed, as the Units table has none.
