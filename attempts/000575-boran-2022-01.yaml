outcomes:
- claim: behavior-accuracy-by-set-size
  outcome: reproduced
  notebook: reproduce_boran_2022.ipynb
  output: claim:behavior-accuracy-by-set-size
  measured: [97.76, 97.90, 84.32, 72.60, 88.15, 89.78]
  notes: >-
    Trials pooled over sessions (reading a) give 97.76, 97.90, 84.32 and 72.60% correct at set sizes
    1, 2, 4 and 6 and 88.15% overall; the mean of session percentages (reading b) gives 97.73,
    97.90, 84.36, 72.54 and 88.15%. The repeated-measures ANOVA over 16 sessions gives F(3, 45) =
    89.78 (paper 89.79), permutation p = 0.0002 with set-size labels shuffled within sessions
    (4999 permutations, largest null F 10.81); permuting the four session values instead gives the
    same p.
  deviations:
  - >-
    The sessions hold 3038 trials (174 to 192 per session), where the paper states 192 per session;
    the 2678 correct trials equal the paper's count.
