- claim: decode-performance-not-significant
  outcome: reproduced
  notebook: reproduce_boran_2022.ipynb
  output: claim:decode-performance-not-significant
  measured: [46.2, 50.0, 50.0, 46.2]
  notes: >-
    Window 1.2 s for the measured values. With 13 trials per label (the fewest incorrect trials in a
