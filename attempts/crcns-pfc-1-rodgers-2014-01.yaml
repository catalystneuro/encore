findings:
- kind: metadata_insufficient
  statement: The spike files hold 2977 sorted clusters, good units and bad clusters alike, with nothing in the data
    set that says which are the 220 well-sorted units the paper analysed, or gives their auditory response class
    and window. These come only from metadata/unit_db.csv in the paper's code repository; the scripts that made
    the table are not published.
- kind: selection_undocumented
  statement: The auditory response classes of unit_db.csv apply rules the paper does not state (classes too brief,
    lasts to end, lasts too long). Recomputing responsiveness as the Supplement describes gives 46 mPFC and 61 A1
    responsive units in place of the paper's 31 and 49, and, of 67 units responsive under both, 17 whose window
    starts at a different time.
- kind: other
  statement: The spike files (*.kkp) and the miscellaneous pickles are pandas 0.10 pickles written under Python
    2. Current pandas cannot open them (module pandas.core.index no longer exists); the descriptor's pandas.load
    no longer exists either. They can be read with a custom unpickler.
- kind: metadata_error
  statement: Two sessions, CR21A_120503_004 and CR21A_120504_004, hold a second spike file at the session level
    besides klusters0/. It has the same spike times, but its column is named spike_time, tetrode groups run 0 to
    7 in place of 1 to 8, and the unit numbers differ, so the descriptor's unit-number rule may assign units differently.
    The descriptor does not mention these files.
- kind: metadata_error
  statement: The data descriptor names the stimulus column stimulus_name; the files call it stim_name. The descriptor
    numbers the stimuli starting with le_lc_go as 1; in the files le_lc_go is 3, ri_lc_no 4, lo_pc_go 1 and hi_pc_no
    2.
- kind: other
  statement: Three sessions (CR20B_120613, CR21A_120502, CR21A_120506) have no spike file; their klusters0/ holds
    a README.txt, where the descriptor says the directory is empty. The data set holds the 55 sessions the paper
    reports after its four discarded sessions; the discarded ones are not in it.
- kind: code_mismatch
  statement: 'metadata/figures_generated_by_each_script.csv names CR20B_120602_001_behaving-612 as Figure 4A and
    -712 as Figure 4B. The legends'' values fit the reverse: 712 prefers localization (8.01 against 4.76 Hz) and
    612 pitch discrimination (10.07 against 2.00 Hz).'
- kind: paper_inconsistency
  statement: The Figure 4B legend gives the trial counts of the simultaneously recorded pair with the blocks swapped
    (pitch discrimination 312, localization 253) relative to the 4A legend (localization 312, pitch discrimination
    253); the data have 312 localization and 253 pitch discrimination trials for both units.
- kind: code_mismatch
  statement: 3-5-vidtrack/main5.py says statsmodels' stand_mad does not subtract the median, but the paper's PRE
    values (0.471 and 0.318) are reproduced exactly by the MAD about the median; the uncentered MAD gives 0.327
    and 0.343.
