findings:
- kind: metadata_insufficient
  statement: The spike files hold 2977 sorted clusters, good units and bad clusters alike, with nothing in the data
    set that says which are the 220 well-sorted units the paper analysed, or gives their auditory response class
    and window. These come only from metadata/unit_db.csv in the paper's code repository; the scripts that made
    the table are not published.
- kind: selection_undocumented
  statement: The auditory response classes of unit_db.csv apply rules the paper does not state (classes too brief,
    lasts to end, lasts too long). Recomputing responsiveness as the Supplement describes gives 46 mPFC and 61 A1
    responsive units in place of the paper's 31 and 49, and, of 67 units responsive under both, 17 whose window
    starts at a different time. Part of the difference is the table's unstated classes (units classed too brief,
    lasts too long or lasts to end are responsive when recomputed), and part the threshold and trial choices of
    the recomputation (6 units classed nothing become responsive, 13 classed responsive do not).
- kind: other
  statement: The spike files (*.kkp) and the miscellaneous pickles are pandas 0.10 pickles written under Python
    2. Current pandas cannot open them (module pandas.core.index no longer exists); the descriptor's pandas.load
    no longer exists either. They can be read with a custom unpickler.
- kind: metadata_error
  statement: Two sessions, CR21A_120503_004 and CR21A_120504_004, hold a second spike file at the session level
    besides klusters0/. It has the same spike times, but its column is named spike_time, tetrode groups run 0 to
