- claim: fig5ab-single-unit-onset
  outcome: reproduced
  notebook: reproduce_rodgers_2014.ipynb
  output: claim:fig5ab-single-unit-onset
  measured:
  - 0.55
  - 0.625
  notes: With the code's smoother, median onset 0.550 s before stimulus in A1 (36 units) and 0.625 s in mPFC (76
    units), for W = 3 s and W = 5 s alike; both above 0.35 s. With exact spike times in place of the code's grid
    (variant) the medians are 0.575 s and 0.750 s, the mPFC value outside tolerance. 7 mPFC and 2 A1 units have
    an onset although their bin before onset is not significant (main3.py marks them invalid, main4.py keeps them);
    their onsets are 0.05 and 0.15 s in A1 and 0 to 1.35 s in mPFC. Counting them as having no preference before
    the stimulus (onset 0) gives 0.550 s in A1 and 0.600 s in mPFC, within tolerance; leaving them out gives 0.650
    s in both regions, outside tolerance in A1. The outcome rests on keeping them (see deviations).
  deviations:
  - 'Assumed: the median is taken over all rule-encoding units, including the 7 mPFC and 2 A1 units that have
    no significant interval containing the bin just before onset, each with the onset main4.py gives it. The criterion
    defines the interval as the run that contains the bin just before onset, which these units lack, but also takes
    the median over units as main4.py does. The paper speaks of "the median rule-encoding unit" (Results, Within-Trial
    Timescale of the Encoding of the Selection Rule, paragraph 2), and Figure 5C gives n = 76 and 36 rule-encoding
    neurons, which supports a median over all of them. Leaving the units out fails in A1 (0.650 s); a question
    for a reader is in questions/crcns-pfc-1.yaml.'
  - 'The smoothing follows kkpandas.base.GaussianSmoother as 5-2-timecourse_exemplars/main1.py and main2.py use
    it: each spike is moved to the nearest 50 ms sample point and a Gaussian of one sample s.d., truncated at 3
    s.d. and normalized to sum to one, is added there (modules/kkpandas/base.py, modules/DiscreteAnalyze/PointProc.py).
    The paper says only that spike trains were smoothed with a 50 ms Gaussian; the result in mPFC depends on this
    discretization.'
  - R's wilcox.test with fix_float=10000 (rounding of values) is not reproduced; scipy's test is applied to the
    smoothed values directly.
  assumed: true
