- claim: fig5b-sepsc-frequency
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_liu_2026.ipynb
  output: claim:fig5b-sepsc-frequency
  notes: The threshold readings the criterion names disagree, so the criterion blocks the claim. At 5 pA, VEN 2.06
    against PC 9.36 Hz (p = 0.026, 8 VEN and 11 PC entries; 10 distinct PCs p = 0.027). At the recording's RMS noise,
    VEN 32.1 against PC 23.0 Hz (p = 0.091; 10 PCs p = 0.146), VEN higher; the detector check shows this reading
    counts noise (opposite-polarity peaks as frequent as events, 31.6 against 30.0 Hz in the low-noise sEPSC files).
    The first 30 s split the same way. With three times the noise, a variant, VEN 2.82 against PC 3.57 Hz, p = 0.31.
    8 of the 11 PC rows come from the noisier subject Mfa201126; in the files with noise below 2 pA VENs are still
    lower (1.53 against 3.38 Hz, 6 and 4 cells, p = 0.038), and after subtracting the opposite-polarity rate p =
    0.062. The paper's own sheet values give VEN 1.21 against PC 3.25 Hz, p = 0.0068. A question to a reader asks
    whether reading (b) misreads the Methods; without it the claim would be judged on 5 pA alone. The question of
    the detection settings is for the paper's authors (finding).
  deviations:
  - Events are detected with a detector of miniAnalysis's scheme and standard parameters (helper docstring), not
    with miniAnalysis; the paper gives only the 5 pA threshold.
  - Cell types are the code's table metadata_PSC.csv; the files carry none.
  - Whole deposited recordings are analysed (120 to 480 s); 14 of the 18 files are shorter than the 5 min the Methods
    give as the minimum.
  - Two-tailed rank-sum p-values are computed as MATLAB's ranksum does by default (exact for these group sizes),
    as the code's Fig. 5 scripts call it.
- claim: fig5b-sipsc-frequency
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_liu_2026.ipynb
  output: claim:fig5b-sipsc-frequency
  notes: Blocked because the detection does not separate events from noise in these files and the paper gives no
    detection setting beyond the 5 pA threshold; as written, the criterion would give not reproduced, as under neither
    threshold reading is the VEN median below the PC median. At 5 pA, VEN 19.9 against PC 15.4
    Hz (p = 0.34 to 0.40 under the three assignments of file fwphyw). At the RMS noise, VEN 13.0 to 13.6 against
    PC 9.5 to 10.1 Hz (p = 0.0006 to 0.072). With three times the noise, a variant, VEN 1.88 against PC 2.27 to
    2.55 Hz (p = 0.23 to 0.54). Events are outward, as the files are described as held at +20 mV and their holding
    currents are positive. The detection here largely measures noise in these recordings. No sIPSC file has noise below 2 pA; in 13 of the 15 files opposite-polarity peaks
    are 0.87 to 1.54 times as frequent as events, and about half in the other two (subtracting them leaves medians
    below zero, p = 0.69 to 0.96); injected events are recovered at 44 to 83% per file; and the 5 pA frequencies
    are 1.9 to 24 times the code's sheet values (median 5.5). In the files of at least 5 min VENs are
    lower (9.9 to 10.6 against 18.5 Hz, 2 or 3 VENs and 4 or 5 PCs, p = 0.11 to 0.38). The code's own sheet values
    give VEN 1.77 against PC 3.25 Hz, p = 0.0093 (not used for the outcome).
  deviations:
  - Detector and labels as for fig5b-sepsc-frequency.
  - The table gives PC 20201126s5c11a and VEN 20201126s5c11b the same file; three readings are run (the table as
    it is, and fwphyw as either cell), and all give the same outcome.
  - The files are held at +20 mV, not at -60 mV as the Methods state.
  - Two-tailed rank-sum p-values are computed as MATLAB's ranksum does by default (exact for these group sizes),
    as the code's Fig. 5 scripts call it.
- claim: fig5b-mepsc-frequency
  outcome: not_reproduced
  notebook: reproduce_liu_2026.ipynb
  output: claim:fig5b-mepsc-frequency
  notes: With the table's labels, the dataset's, the VEN median is above the PC median under both readings (5 pA,
    0.92 against 0.69 Hz, p = 0.61; RMS, 28.4 against 24.9 Hz, p = 0.15), and over the first 30 s (p = 0.34). All
    mEPSC files have noise below 2 pA, where the detector recovers 94% of injected events and finds 0.06 Hz of opposite-polarity
    peaks. With the code sheet's labels, the variant, the order reverses (0.69 against 0.92 Hz) but is not significant
    (p = 0.61). The sheet's own frequencies give VEN 1.39 against PC 1.80 Hz (p = 0.028) with the sheet's labels
    and VEN 1.97 against PC 1.39 Hz (p = 0.029) with the table's, so the paper's result follows from its labelling
    and the dataset's labels reverse it. The two labellings are opposite for all 15 cells, which the dandiset cannot
    settle. 7 VENs and 8 PCs are in the dandiset, against 8 and 8.
  deviations:
  - Detector as for fig5b-sepsc-frequency.
  - One cell of the paper's sheet, S02C0321, is not in the dandiset. The sheet calls it a PC; it would be a VEN
    under the table's labels, which are the opposite of the sheet's for every mEPSC cell.
  - Two-tailed rank-sum p-values are computed as MATLAB's ranksum does by default (exact for these group sizes),
    as the code's Fig. 5 scripts call it.
