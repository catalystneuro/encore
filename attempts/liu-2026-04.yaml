  statement: In the code's table of deposited files, one sIPSC file (obj-1s3ysck) is given to two cells, PC 20201126s5c11a
    and VEN 20201126s5c11b, and the other file of that session's Cell_AS011 (obj-fwphyw) is named by no row.
