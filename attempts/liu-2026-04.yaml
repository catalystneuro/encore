  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_liu_2026.ipynb
  output: claim:fig5b-mipsc-frequency
  notes: The threshold readings disagree. At 5 pA, VEN 1.23 against PC 2.35 Hz (p = 0.0074, 15 and 21 cells); at
    the RMS noise, 19.0 against 28.9 Hz (p = 0.24), a reading the detector check shows counts noise. Over the first
