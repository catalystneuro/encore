    (sEPSC 14 of 18, sIPSC 8 of 15, mIPSC 22 of 36 after the padding); and the noise of 11 of 15 sIPSC and 2 of
    18 sEPSC recordings exceeds the 5 pA the Methods give as the largest RMS noise.
- kind: methods_unavailable
  statement: For the authors. Which miniAnalysis settings (amplitude and area thresholds, baseline and peak windows,
    filtering) detected the Fig. 5 events, and which stretch of each recording was analysed? The Methods give only
    a 5 pA threshold, and with it a standard detector finds 4.6 to 15 times the sheet's sEPSC and sIPSC events in
