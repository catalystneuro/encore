- claim: fig2d-f-l23-it-tau-width
  outcome: not_reproduced
  notebook: elsewhere_liu_2026.ipynb
  output: claim:fig2d-f-l23-it-tau-width
  notes: From DANDI:001746, the 461 files the code's table names read with no errors (the table names one file twice,
    whose second row is dropped, and one file of the dandiset not at all), features extracted as the Methods define them. L2/3
    IT HPCAL1 has the lowest median tau (31.8 ms, n = 30; others 38.2 to 54.1 ms), but no pairwise difference with
    it survives FDR (0.064 to 0.82). Its median AP half-width (2.10 ms) is not the lowest, IT RORB being lower (1.92
    ms); it is narrower than L5 IT FEZF2 and VEN (FDR below 1e-4 each) but not than IT RORB, L5 ET or L6 PC (FDR
    0.51 to 0.68). Both readings of the criterion fail on AP width. The AP threshold is now sought on the rising
    phase, which cuts implausible values (thresholds above -10 mV 36 to 12, amplitudes below 40 mV 28 to 3, half-widths
    below 0.3 ms 10 to 1); the first run's extraction gives the same order and FDR 0.62 to 0.78, so the outcome
    does not rest on the extraction failures. It may still differ from the paper's PatchElectroLab values.
  deviations:
  - Features are this attempt's extraction (AP found by a 0 mV crossing, its threshold sought on the rising phase
    up to the largest first derivative, tau fits outside 0 to 600 ms dropped, 30 sweeps in all), not the paper's
    PatchElectroLab values.
  - Subclasses follow the code's Fig. 2d script (ephysio/Fig2D_ephyFeatCmp.m) on the code's cell table, which gives
    30, 21, 125, 29, 18 and 14 cells where the legend gives 30, 17, 119, 22, 16 and 13; tau of 1 ms or less is dropped,
    as the script does.
  - Benjamini-Hochberg is applied over the 15 pairs of each feature; the family is not stated.
  - Each file is read into memory in one request (not to disk), as reading sweeps through remfile was about 100
    times slower.
