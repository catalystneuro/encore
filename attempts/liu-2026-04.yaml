- claim: psc-file-labels-link
  outcome: partially_reproduced
  notebook: reproduce_liu_2026.ipynb
  output: claim:psc-file-labels-link
  notes: All 85 rows of metadata_PSC.csv name a file of the dandiset, and the table's experiment and subject agree
    with every file's own metadata. Rows per experiment and cell type equal the Fig. 5b legend except mEPSC VENs
    (7 rows against 8; the sheet's PC S02C0321 has no row and no file). Three parts fail. File fwphyw (sIPSC, Cell_AS011
    of session 201126) is named by no row, while 1s3ysck is named twice, as PC 20201126s5c11a and as VEN 20201126s5c11b.
    For mEPSC the sheet's cell type is the opposite of the table's for all 15 matched cells; for the other experiments
    the types agree (19, 15 and 36 of 36). The frequencies measured here correlate with the sheet's for mIPSC (Spearman
    rho 0.73; 0.87 in the 34 files with noise below 2 pA) but not for mEPSC (0.51, p 0.054), sEPSC (0.34) or sIPSC
    (0.19). In the noisier sEPSC and sIPSC files the frequencies are 4.6 to 15 times the sheet's and the detector
    check finds opposite-polarity peaks at half the rate of the events or more (about half in the sEPSC files
    with noise of 2 to 4 pA, about as many in 13 of the 15 sIPSC files), so much of the disagreement is in detection;
    in the 10 sEPSC files with noise below 2 pA the correlation is still weak (rho 0.16).
  deviations:
