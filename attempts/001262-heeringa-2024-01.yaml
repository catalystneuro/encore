  notes: Five of six counts match under both readings (CF 119, SR 203, NOISE 143, SPS 22, CVC 135). CLICK
    does not; 275 units have one CLICK recording each, and 271 give a recomputed 2-bin latency (272 with
    a 5 ms click delay), against 261. The files hold no stored latency, so it cannot be told which 10
    units had none in the paper, or whether some had a second CLICK recording in the MATLAB files that
    the code would leave out. 1 CLICK unit has 75 spikes or fewer. The mismatch does not rest on
    the assumed click delay; reading 2 (275) uses no latency, and reading 1 gives 270 to 272 units
    for delays from 5 to 8.25 ms. The delay checks are consistent with 7.75 ms. The population PSTH
    of the CLICK trials is flat up to 8.25 ms and rises from 8.25 ms in the 20 ms trials and from
    8.75 ms in the 10 ms trials, whose units have lower BFs (median 2060 against 5570 Hz). Latencies
    of the 10 ms trials lie on the same latency-BF line as those of the 20 ms trials (median residual
    -0.032 against -0.027 ms) and span 0.71 to 1.84 ms. click_polarity is 'COND' in every CLICK
    trial. No 500-trial recording shows signs of two joined recordings (halves differ in latency
    by a median 0.026 ms, odd against even trials 0.020 ms).
  deviations:
  - The stored CF and click latency are not in the files; reading 1 uses the values recomputed with the
    paper's functions.
  - The click delay is not in the files (the trial table gives NaN for CLICK trials). The 2-bin latency
    of Clickextract_func.m and getFSL2bins.m needs it; 7.75 ms, the delay of every tone recording in the
    dataset, is assumed, and 5 ms is shown as a variant.
