- claim: isi-exclusion
  outcome: not_reproduced
  notebook: reproduce_heeringa_2024.ipynb
  output: claim:isi-exclusion
  notes: Units with two or more within-trial ISIs below 0.6 ms are in the dataset under every reading,
    370 of 1160 under (a), 391 under (b), 148 under (c), from 79 of 104 animals; 538 units have at least
    one. In failing units short ISIs are a median 0.13% of all ISIs (largest 22.3%), and 162 units have
    more than 10. Of 13,904 short ISIs, 10,192 are 0.3 to 0.6 ms and 1171 below 0.1 ms. With a 0.3 ms
    limit 140 units fail under (a), with 0.1 ms 5 do. Spike times are sorted within trials and no spike
    train is duplicated. The paper's check was visual (checkAN.m plots the count); it does not say how
    many short ISIs 'multiple' allows. Many short ISIs appear to be double detections of one spike. In the
    voltage trace, all ISIs below 0.1 ms (from 9 units), 91% of those from 0.1 to 0.3 ms and 39% of those
    from 0.3 to 0.6 ms lie on one waveform (the trace does not fall below half the smaller peak between
    the two spike times), against none of 300 pairs from 0.8 to 1.5 ms. Below 0.1 ms
    (median dip ratio 0.95) this shows a double detection; the rule was not checked at 0.3 to 0.6 ms,
    so there it is a plausible reading, not a demonstration. The outcome stands, since the
    paper's check counts ISIs from the same spike times; counting only pairs that are not one waveform,
    176 units still fail under (a) and 179 under (b).
  deviations:
  - A recording is taken as a recording type of the unit; each type occurs once per unit in the files.
