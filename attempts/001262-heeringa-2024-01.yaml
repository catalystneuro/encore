findings:
- kind: format_error
  statement: The ABR threshold in general/notes ('threshold (db SPL) ...') is written as a single character
    whose code point is the threshold, for example '#' for 35 and 'K' for 75, and control characters such
    as a line feed for 10; 11 animals have 'NaN'. Read as code points, the values give Table 1's means
    and SDs exactly, so the number appears to have been converted to a character in the conversion to
    NWB.
- kind: data_missing
  statement: The analysed outcomes the paper describes as stored with each recording (exp.data.[type].analysis)
    are in the NWB files only as best frequency, spontaneous rate and threshold per recording type. The
    characteristic frequency, Q10, vector strength with its p-value and levels, the click latencies and
    first-spike statistics, and the rate-level and frequency-response rates are not there. Most can be
    recomputed from the spike times with the paper's code, but the manual corrections the code allows
    (CF and response criterion, RLF threshold) cannot.
- kind: metadata_insufficient
  statement: The CLICK trials carry no delay (NaN in the trial table), so the click's onset within the
    trial, needed for click latencies, is not in the files. The SR, NOISE, SPS and CVC trials also have
    no delay. The click_polarity column holds 'COND' in every CLICK trial.
- kind: methods_unavailable
  statement: Question for the paper's author. What was the click delay (curvesettings.delay) of the CLICK
    recordings, and was it the same in all of them? This attempt assumed 7.75 ms, the delay of every tone
    recording, which gives latencies of 0.42 to 2.78 ms; the correlation with best frequency is negative
    under 7.75 or 5 ms. The data are consistent with 7.75 ms in both the 10 ms and the 20 ms CLICK trials
    (the population PSTH rises from 8.25 ms, and both trial lengths give latencies on one latency-BF line),
    but do not fix it.
- kind: other
  statement: 370 of 1160 units have two or more within-trial inter-spike intervals below 0.6 ms in one
    recording (391 pooled over recordings, 148 in the BF recording alone), although the paper says units
    with multiple such intervals were excluded. Most short intervals are 0.3 to 0.6 ms. About half of
    the 13,904 short intervals lie on one spike waveform in the voltage trace (all 1171 below 0.1 ms, 91%
    of those from 0.1 to 0.3 ms, 39% of those from 0.3 to 0.6 ms) by a dip-ratio rule. The intervals
    below 0.1 ms are double detections of single spikes; for those from 0.3 to 0.6 ms this is a plausible
    reading, as the rule was checked only against intervals of 0.8 to 1.5 ms. Counting only intervals between separate waveforms, 176 units still
    have two or more in one recording.
- kind: other
  statement: 275 units have a CLICK recording, one each, and 271 give a 2-bin latency with the paper's
    function, where the Fig. 7 legend counts 261 units with a CLICK recording. Without the stored latencies
    the difference cannot be traced.
- kind: metadata_error
  statement: The recordings are extracellular single-unit recordings with a glass electrode (as the file's
    own device description says), but they are stored as intracellular (icephys) VoltageClampStimulusSeries,
    and the archive's summary lists the measurement technique as 'voltage clamp technique'.
- kind: data_missing
  statement: The dataset holds only the 104 animals with recorded units. The animals operated on without
    a successful recording, which the paper's success rates (43% of old and 88% of young-adult gerbils)
    count, are not listed in the files or the metadata.
