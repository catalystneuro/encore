- claim: isi-exclusion
  outcome: not_reproduced
  notebook: reproduce_heeringa_2024.ipynb
  output: claim:isi-exclusion
  notes: Units with two or more within-trial ISIs below 0.6 ms are in the dataset under every reading,
    370 of 1160 under (a), 391 under (b), 148 under (c), from 79 of 104 animals; 538 units have at least
    one. In failing units short ISIs are a median 0.13% of all ISIs (largest 22.3%), and 162 units have
    more than 10. Of 13,904 short ISIs, 10,192 are 0.3 to 0.6 ms and 1171 below 0.1 ms. With a 0.3 ms
    limit 140 units fail under (a), with 0.1 ms 5 do. Spike times are sorted within trials and no spike
    train is duplicated. The paper's check was visual (checkAN.m plots the count); it does not say how
    many short ISIs 'multiple' allows.
  deviations:
  - A recording is taken as a recording type of the unit; each type occurs once per unit in the files.
