  - claim: table3-destabilizing
    agrees: true
    outcome: not_reproduced
    reason: Agrees, with a reservation that bears on the outcome. The claims file says 'iMutant and MuPRO run
      from sequence'; the paper does not say this. Methods 2.4 gives only the URL, its reference 46 is 'I-Mutant2.0,
      Predicting stability changes upon mutation from the protein sequence or structure', and the paper had
      built I-TASSER models 'for further analysis' (Methods 2.3), so the sequence-only reading may be a misreading
      by the claims file. Neither sequence-mode output gives the paper's IMPG1 iMutant values (-0.85, -0.76;
      the server gives +0.19 and +0.88), and the server's regression and classifier disagree in sign for p.Cys1019Tyr
      and p.Leu249Phe. The record does not state this dependence and does not mark the outcome assumed. Given
      the claims file as written, not reproduced follows; the failure rests on one tool, in one mode, from
      an unversioned server. Separately, the Summary's 'differs from Table 3 in four values' is not supported;
      cell 70 also shows DUET p.Leu249Phe differing (-1.777 against -1.77), marks SDM p.Cys1019Tyr and iMutant
      p.Arg131Cys as agreeing within 10%, and counts 3 values outside tolerance (20 of 23 agree).
    response: The dependence is stated in cell 71, the notes, a new assumption deviation, the notebook summary
      and the README, and the outcome is marked assumed (outcome unchanged, not_reproduced). The possible misreading
      is asked of a reader in questions/001882.yaml; the claim is not changed. The rerun shows the regression
      and the classifier disagree in sign for p.Leu740Phe as well (+0.19 against Decrease), so the text names
      three variants. The structure mode was not run, since the I-TASSER models are not deposited. The summary
      and the finding on the Word document now say it holds 23 of the 25 values, 3 differ by more than 10%
      (MuPRO p.Leu249Phe, mCSM and SDM p.Asp423Glu) and 3 more within 10% (SDM p.Cys1019Tyr, iMutant p.Arg131Cys,
      DUET p.Leu249Phe).
