- claim: variant-domains
  outcome: partially_reproduced
  notebook: reproduce_yuan_2025.ipynb
  output: claim:variant-domains
  notes: No reading places all 7; UniProt, InterPro and the PROSITE profiles place 6, Pfam and SMART 4.
    UniProt (Q17R60 v129, Q9BZV3 v146); IMPG1 has only SEA 1 (232-354) and SEA 2 (571-684), no EGF-like
    domain, so p.Leu740Phe cannot be near one; the other 6 hold. InterPro 110.0 and PROSITE profiles;
    IMPG1 has an EGF-like domain at 684-722, 18 residues before Leu740 (near, the closest domain, not
    in it), but IMPG2 has a single EGF-like domain (1010-1051), so p.Arg1088* lies in no EGF-like 2 domain;
    the other 6 hold. Pfam 38.2 and SMART 9.0 annotate only the two SEA domains of each protein, so p.Leu740Phe,
    p.Cys1019Tyr and p.Arg1088* fail. p.Arg131Cys is 108 residues from SEA1 and 109 from the end of the
    signal peptide (1-22), so 'near SEA-1' rests on one residue if the signal peptide counts as a domain.
    The paper's own 'in' for p.Leu740Phe holds under no reading. The spreadsheet's 'Location of Variant'
    column places p.Leu740Phe 'Post EGF-like 1', after the domain.
  deviations:
  - UniProt entries are pinned through UniSave at the versions current in November 2024 (Q17R60 v129
    and Q9BZV3 v146, both released 2 October 2024 and replaced on 27 November 2024, as cell 61 prints); InterPro is read
    from its current release (110.0), which cannot be pinned through its API.
- claim: table2-pathogenicity
  outcome: not_reproduced
  notebook: reproduce_yuan_2025.ipynb
  output: claim:table2-pathogenicity
  notes: SIFT and PolyPhen-2 HumVar (Ensembl VEP release 116, MANE Select transcripts) match Table 2 exactly
    for the three IMPG2 missense variants (SIFT 0, 0, 0; PolyPhen 0.996, 0.645, 0.998) but not for IMPG1;
    VEP gives SIFT 0.02 for p.Leu740Phe and 0.09 for p.Asp423Glu, the paper's two values exchanged, and
    PolyPhen 0.106 and 0.043 (paper 0.575 and 0.98). PolyPhen-2 HumDiv (dbNSFP 4.8a) gives 0.575 for p.Leu740Phe
    as the paper does, 3 of 5 values within tolerance, but 0.31 for p.Asp423Glu. VEP calls p.Asp423Glu
    tolerated (SIFT) and benign (PolyPhen), against the paper's Pathogenic, so the Prediction column is
    not matched. CADD PHRED matches at most 2 of 7 values under any of GRCh37 or GRCh38 and v1.6 or v1.7;
    the nonsense variants score 36 to 45 against 11.2 and 13.4. No FATHMM, FATHMM-MKL or FATHMM-XF coding
    score and no MutationTaster score in dbNSFP matches the paper's columns (0 of 5 and 0 of 7), under
    any value of dbNSFP's per-transcript or per-model lists; the FATHMM-MKL web server gives the same
    coding scores as dbNSFP (0.83 to 0.99 for the IMPG2 variants, against 0.0076 to 0.0577) and matches
    0 of 5, coding or non-coding. The MutationTaster2021 API redirects to the GeneCascade home page, even
    for its own documented example, so the paper's 0 to 100 MutationTaster score could not be recomputed.
    The paper's ids for p.Leu740Phe and p.Arg964* (rs15048636, rs267606975) differ from the variants'
    ids (rs150486366, rs267606875); the dandiset's Word document gives rs267606875.
  deviations:
  - The web tools of November 2024 cannot be called in a pinned version. SIFT and PolyPhen-2 HumVar come
    from Ensembl VEP (release 116); PolyPhen-2 HumDiv, FATHMM and MutationTaster from dbNSFP 4.8a (MyVariant.info
    build 20250624), whose MutationTaster score is a probability, not the paper's 0 to 100 score; FATHMM-MKL
    also from the FATHMM web server as it answers today; CADD from its versioned API.
  - dbNSFP's per-transcript lists (SIFT, FATHMM) cannot always be lined up with its transcript list, since
    MyVariant.info drops missing entries; every list value is shown and a match by any value counts.
  - MutationTaster2021, which gives a 0 to 100 tree vote, was tried through its API and does not answer.
  - SIFT and PolyPhen-2 were not run on GRCh37 in the notebook; VEP's GRCh37 service took 12 minutes while
    preparing (not run here).
