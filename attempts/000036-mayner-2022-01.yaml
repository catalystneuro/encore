- claim: ext1-3-kinetics-no-difference
  outcome: blocked
  blocked_by: not_runnable
  notes: The dandiset holds no L0 events. The criterion's detector, l0_analysis.py of
    github.com/AllenInstitute/visual_coding_2p_analysis (commit 3ceca10), is Python 2 code
    (cPickle) that imports allensdk and FastLZeroSpikeInference. That package is not on PyPI; its
    repository (github.com/jewellsean/FastLZeroSpikeInference, commit cdfaade) fails to build with
    pip from git because its setup.py expects the C++ sources copied into the python directory,
    and its current Python API has no arfpop, which l0_analysis.py calls. The detector also
    expects corrected fluorescence, which the dandiset does not hold. The paper's own events are in
    its Zenodo deposit (events/, 4.1 GB), which the criterion does not name.
- claim: fig3a-layer-specific
  outcome: reproduced
  notebook: reproduce_mayner_2022.ipynb
  output: claim:fig3a-layer-specific
  measured:
  - 14.09
  - 0.163
  notes: 2200 contrast trials of 44 sessions. Interaction chi2(2) = 14.09, p = 0.00087. Post hoc
    L2/3 z = 3.83, adjusted p = 0.0002, lower bound 0.050 (paper 0.051); L4 z = 0.10, p = 0.84; L5
    z = -1.35, p = 0.999. Cohen's d L2/3 0.163, L4 0.006, L5 -0.079 (paper 0.164, 0.011, -0.067).
    The L2/3 effect is positive in all three Cux2 mice (d 0.15, 0.43, 0.29). Variant on all 56
    complete dandiset sessions, chi2(2) = 8.74, p = 0.013, L2/3 the only significant layer.
  deviations:
  - Trials are cut where the NWB stimulus times put them, 0 to 6 frames later than the paper's
    stimulus table (the shift grows through the session).
  - ROIs with all-NaN dF/F are left out (none in the paper's counts).
  - LME, likelihood ratio and glht tests are run with statsmodels and scipy, not R; on the
    paper's own per-trial values they give its printed chi2, z, p and interval bounds.
