inputs:
- what: The paper's analysis outputs. results/main.parquet identifies the 44 analysed sessions
    (session-link) and gives the paper's per-trial ND, used to check the trial timing;
    results/sensitivity_analysis.parquet gives the paper's per-trial ND for the 108 parameter sets,
    used to check the spectra of ext3-2-sensitivity; the other files of results/ (table-s1.csv,
    permutation_tests_summary.csv, the decoding scores, mean_centroid_distance.parquet,
    stimulus_properties.parquet, stats.parquet, effect_size.parquet, behavior_by_session.parquet)
    are printed as reference values beside the results and decide no outcome.
  source: https://github.com/wmayner/openscope-differentiation at commit
    2d959bd71b47055d2a3fd306091fe9254ceb86fb
- what: The paper's processed data, streamed in memory from its single tar file in the arousal
    notebook (parallel byte-range requests, decompressed in order). Used are the running artifact parameters (run/preprocessing_params.yaml) for reading
    (b) of fig4-locomotion-effect-size, the sync files (vsync to 2p frame alignment), the pupil
    area and its parameters for the variant of fig4-pupil-effect-size, and run_speed to check the
    dandiset's running velocity.
  source: Zenodo doi:10.5281/zenodo.5781567 (record 5781567, the version of concept
    doi:10.5281/zenodo.4734580 that the code's README names)
- what: The sources of the L0 event detector the event criteria name, read (not built or run) to
    show why it cannot be installed. l0_analysis.py, and setup.py, make.sh, fast.py and
    FitSegmentModel.cpp of FastLZeroSpikeInference at its latest commit and at the latest commit
    that defines arfpop.
  source: https://github.com/AllenInstitute/visual_coding_2p_analysis at commit 3ceca10;
    https://github.com/jewellsean/FastLZeroSpikeInference at commits
    cdfaade68ceb6aa15ec5003c460de4e0575f1d5f and 7b80ccd8ea5e05354c4c73775b3faf645b87f37f
outcomes:
- claim: session-link
  outcome: reproduced
  notebook: reproduce_mayner_2022.ipynb
  output: claim:session-link
  notes: All 44 sessions of main.parquet match one dandiset session each on mouse id and start
    time (NWB session_start_time minus 7 hours, to the millisecond; no other whole-hour offset
    matches any session). All 44 agree on Cre line, layer, area and depth, and on the number of
    cells once the 14 ROIs whose dF/F is NaN at every frame are left out (37 of 44 agree with
    them counted). With the trial start moved by 0 to -6 frames, the dandiset's dF/F gives the
    paper's unnormalised per-trial ND to a relative 1e-6 in all 5280 trials (5279 at one shift,
    1 at two). With the trial windows the NWB times give, per-trial log10 ND correlates with the
    paper's at r = 0.9974 (difference SD 0.0465). Thirteen dandiset sessions are unmatched; the
    one in L5 AL (mouse 402796, 741889312) has 63586 frames at 15.08 Hz and fits the session the
    paper excluded, which the deposit's metadata.csv also marks invalid (seen while preparing,
    not in the notebook).
  deviations:
  - The 7 hour offset was found while preparing the attempt; the criterion was written after it.
