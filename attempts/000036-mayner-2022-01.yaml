- claim: ext1-3-kinetics-no-difference
  outcome: blocked
  blocked_by: not_runnable
  notes: The dandiset holds no L0 events. The criterion's detector, l0_analysis.py of
    github.com/AllenInstitute/visual_coding_2p_analysis (commit 3ceca10), is Python 2 code
    (cPickle) that imports allensdk and FastLZeroSpikeInference. That package is not on PyPI; its
    repository (github.com/jewellsean/FastLZeroSpikeInference, commit cdfaade) fails to build with
    pip from git because its setup.py expects the C++ sources copied into the python directory,
    and its current Python API has no arfpop, which l0_analysis.py calls. The latest commit that
    defines arfpop (7b80ccd) has a Python 2 fast.py (a SyntaxError under Python 3) and a
    FitSegmentModel.cpp that uses std::numeric_limits without including <limits>; the notebook's
    section on the L0 detector prints each of these from the published sources. Running the
    detector would mean patching the package and porting l0_analysis.py to Python 3. The NWB files
    hold no path naming events (listing of all 57 files in the notebook). The paper's own events
    are in its Zenodo deposit (events/, 4125 members, 4.1 GB), which the criterion does not name.
