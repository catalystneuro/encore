findings:
- kind: metadata_error
  statement: The data descriptor gives cellinfo spikewidth as peak to trough width in ms, but the values (0.98 to
    23.12, median 9.89) are 30 kHz samples, identical to the spikes files' spikewidth, which the descriptor gives
    in points. Read as ms, every cell would be excluded from the paper's fast-spiking rule.
- kind: metadata_error
  statement: The data descriptor says pos data is Nx7; the run-epoch position files have 9 columns (time x y dir
    vel x-sm y-sm dir-sm vel-sm) and the rest-epoch files 5 (time x y dir vel). In run epochs the unsmoothed columns
    start with NaN. The pixel size is stored as cmperpixel (0.50 to 0.70), where the descriptor says cmperpix, and
    the descriptor does not say that x and y are already in cm; the track geometry (centre arm 58 to 81) shows they
    are.
- kind: metadata_insufficient
  statement: 'On days 6 to 8 the second run of each rat is in an environment named wtr2, which the descriptor does
    not define; it says the rats ran the W-track for 8 days and then novel and familiar environments for the final
    3 days, while the files hold 8 days with wtr2 runs in the last 3. The wtr2 track is a different W-track: it
    sits elsewhere in the camera frame, and for HPa and HPb its centre arm points another way. Which epochs are
    novel, and whether the 2016 paper used them, is not stated.'
- kind: identifier_missing
  statement: Units are indexed by day, tetrode and cluster number only; no identifier links a unit across days,
    so the paper's unique-unit counts (Table S1) cannot be checked.
- kind: selection_undocumented
  about: data
  statement: The files hold 509 CA1, 81 iCA1 and 193 PFC non-fast-spiking cell-days with spikes in the W-track runs,
    against 446, 69 and 172 cells in Table S1; which units the table counts is not documented. After the paper's
    50-spike criterion 167 PFC cell-days remain, close to the 165 of Table S2.
- kind: methods_unavailable
  statement: 'Question for the paper''s authors on SWR detection: was an SWR an event on any one ripple tetrode,
    on the mean of tetrodes, or on several tetrodes at once; did the intermediate-CA1 tetrodes that tetinfo marks
    riptet take part; where was the onset set (threshold crossing or the earlier return to the mean); and what envelope
    smoothing and minimum duration were used? Here an event on any one ripple tetrode with the onset at the return
    to the mean gives 415 SWRs per W-track day but only 19 of 167 SWR-modulated PFC cell-days, against 56 of 165
    in the paper. The mean-envelope reading matches the paper''s duration and low-speed rate but finds 139 SWRs
    per day, and gives 17 excited and 3 inhibited of 136 PFC cell-days.'
- kind: methods_unavailable
  statement: 'Question for the paper''s authors on SWR modulation: what span did the SWR-aligned rasters and the
    circular jitter cover, and what PSTH bin or smoothing entered the squared-difference measure? With a -500 to
    +500 ms raster, 10 ms bins and jitter over the whole raster, 12 PFC cell-days are excited and 7 inhibited, against
    30 and 26 in Table S2; 50 ms bins and a -1 to +1 s raster do not close the gap.'
- kind: methods_unavailable
  statement: 'Question for the paper''s authors: did the W-track analyses include the second run of days 6 to 8
    (environment wtr2 in the task files)? This attempt includes it, following the SEP''s statement that data were
    pooled across all sessions within a day.'
