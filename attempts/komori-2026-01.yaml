findings:
- kind: metadata_error
  severity: minor
  statement: The imaging-plane metadata give 405 nm excitation for ImagingPlane_blue and 470 nm for ImagingPlane_UV.
    The values say the reverse; widefield_blue carries the calcium signal (dF/F SD 0.050 and 0.028 against
    0.012 and 0.014 in widefield_UV, two sessions), as the series descriptions and the dF/F descriptions
    (473 nm) say.
- kind: other
  about: data
  severity: minor
  statement: The deposited pupil diameter (processing/downsampled/pupil_tracking/diameter) holds unflagged
    failed detections. In VG1-GC#51 day0 and VG1-GC#53 day1 its maximum is 2.88e21 and 1.05e11 pixels,
    with 148 and 57 frames above three times the median, besides 768 and 269 missing values. A min-max
    normalisation of the raw trace leaves almost no dilation in those sessions.
- kind: other
  about: data
  severity: minor
  statement: Six of the 98 resting-state files (VG1-GC#73 day7; VG1-GC#99, 105, 109, 116 and 124 day0)
    are widefield-only and hold no pupil or other behaviour.
- kind: other
  about: data
  severity: none
  statement: Checks that passed. Every resting session read holds 18,000 frames per channel at 29.95 Hz
    over 600 s, as the paper describes; the pupil and the deposited dF/F are on the imaging timestamps;
    the pupil follows mean cortical activity by 1.1 to 2.3 s in seven of nine sessions, above a shifted
    control in all nine; no recording is deposited twice.
- kind: other
  about: paper
  statement: The paper's own recordings (somatosensory, visual pattern and visual oddball stimulation)
    are available only on request, so 18 of its 24 claims cannot be tested on public data.
- kind: methods_unavailable
  statement: Which resting sessions of DANDI:001425 did the paper use? The Methods say 'Experiments from
    three mice were used' and describe all 25 mice with '2-3 experiments per animal'; the dandiset holds
    3 or 4 resting sessions per mouse. This attempt assumed the first three mice recorded (VG1-GC#51,
    52, 53) with their first three sessions. Please name the mice and sessions.
- kind: methods_unavailable
  statement: How were the resting samples and labels formed? The Methods give 40 s epochs from 50 to 570
    s, a window from 3 s before to 0.5 s after the dilation peak, and global Z-scoring and min-max normalisation,
    but not whether the samples are only that window or every frame of the epoch with labels outside the
    window set to 0, nor whether any epoch selection applies. The two sample readings give different outcomes
    here (window, model 0.686 against null 0.708; every frame, 0.719 against 0.655, p = 0.004). Please
    give the rule, and whether the resting pipeline applied the hemodynamic correction and the 0.1 Hz
    high-pass of the Methods.
