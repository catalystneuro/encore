  outcome: not_reproduced
  assumed: true
  notebook: reproduce_komori_2026_decoding.ipynb
  output: claim:rest-loss-accuracy-vs-null
  measured:
  - 0.667
  - 0.65
  - 0.559
  - 0.575
  notes: 'Main combination with R5 (a): validation loss 0.667 against 0.650 for the null models (p = 0.053,
    the model''s loss the higher), accuracy 0.559 against 0.575 (p = 0.748). With R5 (b): loss 0.686 against
    0.688 (p = 0.645), accuracy 0.583 against 0.555 (p = 0.374). No seed gives either test significant
    (loss p = 0.053 to 0.74, accuracy p = 0.25 to 0.76, two R5 b seeds with equal accuracies); the five
    readings under R5 (a) give p >= 0.050 (the smallest, R3 b accuracy, with the model lower). Of the
    16 combinations under R5 (b) none gives both; one has the loss lower (R2 a, R3 b, R7 b, R8 b: 0.675
    against 0.687, p = 0.0091) with the accuracy not higher (p = 0.187). Under R4 (b) with R5 (b) the
    loss does not differ (p = 0.131; 0.171 with the keypoint pupil) and model and null have the same accuracy,
    the share of negative samples.'
  deviations: *id001
- claim: rest-needs-0-1-hz
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_komori_2026_decoding.ipynb
  output: claim:rest-needs-0-1-hz
  measured:
