- claim: rest-vif-below-10
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_komori_2026_features.ipynb
  output: claim:rest-vif-below-10
  measured: 60.1
  notes: With the VIF of the paper's code (no intercept), on the validation samples under R5 (a), the
    10-IC maximum is 60.1 over the five models (20.5 to 60.1; 35.8 under reading b, 8 ICs), above 10 and
    outside 9.0 +/- 0.9; no comparison with 7, 13 or 15 ICs is significant (Holm p >= 0.29). With an intercept
    it is 5.58 (reading a), below 10 but outside the tolerance; there 7 ICs are lower (p = 0.024) and
    13 and 15 do not differ (p = 0.62), as the paper finds, but the criterion's partial case needs the
    10-IC maximum to hold. On the training samples, as the code takes them, the maximum is 14.05 (reading
    b 11.79). Under R5 (b) the validation folds hold about 3 epochs each and the 10-IC maximum is 4.5e6
    to 3.7e8. No reading gives a 10-IC maximum within 9.0 +/- 0.9. Over all frames of the 13 epochs, the
    VIF used for selection, the 10 kept ICs reach 9.58.
  deviations: *id001
