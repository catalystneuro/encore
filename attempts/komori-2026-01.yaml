- claim: rest-vif-below-10
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_komori_2026_features.ipynb
  output: claim:rest-vif-below-10
  measured: 6.61
  notes: With 10 ICs the maximum VIF over features and validation frames is 6.61 over the five models
    (3.48 to 6.61); the bound VIF < 10 holds but the value is outside 9.0 +/- 0.9. 7 ICs are lower (median
    3.13 against 5.30) but not significantly (Mann-Whitney, Holm p = 0.064); 13 ICs do not differ (p =
    0.064) and 15 ICs are significantly higher (median 9.05, p = 0.024), where the paper finds no difference.
    The VIF depends on which ICs are kept, which the paper chose by eye.
  deviations: *id001
