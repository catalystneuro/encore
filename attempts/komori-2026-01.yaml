- claim: rest-decoding-above-null
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_komori_2026_features.ipynb
  output: claim:rest-decoding-above-null
  measured:
  - 0.5
  - 0.417
  notes: 'Partial under one combination, every frame of the epoch a sample (R4 b) with the epoch selection
    rule (R5 b): validation AUC 0.500 against 0.417 for the null models (paired t = 5.52, p = 0.0053),
    and with the keypoint pupil (R3 b) 0.629 against 0.480 (p = 0.042); the mean is far below 0.82 +/-
    0.082. The first holds at one seed of five (the others p = 0.19 to 0.31, model 0.496 to 0.574); its
    model is at chance and the difference comes from null models below 0.5 (3 to 5 of 5 folds at every
    seed). These are 2 of the 27 combinations run at the claim''s seed. Main combination, R5 (a): 0.669
    against 0.688 (p = 0.477), seeds p = 0.48 to 0.91; R5 (b): 0.556 against 0.468 (p = 0.209), above
    null at one seed of five (claim + 3000, p = 0.0475). One change at a time under R5 (a): p = 0.11 to
    0.77 (high-passed signal, keypoint pupil, centred-VIF ICs, folds of recordings, null shuffling validation
    labels). The 16 combinations of R2, R3, R7 and R8 under R5 (b): none significant (p = 0.11 to 0.94).
    Three ICA restarts under R5 (a): p = 0.07 to 0.60. Under R5 (a) the within-epoch shuffle changes only
    12.8% of the training labels (42 of 117 epoch windows hold no positive label, 37 only positive ones),
    so the null model is close to the model by construction. By mouse, under R5 (a), model and null AUC
    are 0.596 and 0.602 (VG1-GC#51), 0.574 and 0.551 (52), 0.761 and 0.792 (53). The training AUC of the
    models is 0.746 (R5 a) and 0.516 (R5 b), against 0.928 for the paper''s example model.'
  deviations: &id001
  - Three mice (VG1-GC#51, 52, 53) and their first three resting sessions (day0, day1, day7). The paper
    says 'Experiments from three mice were used' (Methods, Cross-validation) and '2-3 experiments per
    animal' (Methods, Resting state) without naming them. Assumed, as the claims file's reading R1 (a)
    with the mice recorded first. All 25 mice (R1 b, about 90 sessions with pupil, some three hours of
    streaming at the rate measured here) and the fourth session of each mouse were not run.
  - ICs kept by a repeatable rule in place of the paper's 'visual inspection' (Methods, ICA-based cortical
    features), the most compact spatial maps, then VIF pruning (claims file, R6). The VIF is the one the
    paper's code computes (#05_deep_learning/#07_vif_calc.ipynb at commit 405a720, statsmodels variance_inflation_factor
    on the features with no constant column, so without an intercept); it removes ICs 24 and 29 for 10
    ICs. Assumed. The VIF with an intercept, which removes none, is run as a variant.
  - Failed pupil detections in the deposited diameter (values up to 2.9e21 pixels) replaced by interpolation
    when above three times or below a third of the recording's median (148 and 57 frames in two sessions).
    Assumed; the paper's own outlier rule is for its DeepLabCut coordinates (Methods, Pupil diameter quantification).
    The cleaned traces still reach 3.00 and 2.88 times their median in those sessions, and VG1-GC#53 day1
    has no positive label.
  - Hemodynamic correction as in the Methods (dF/F to the mean of 5-15 s, 34-component SVD, OLS of F470
    on F405 after a 0.1 Hz high-pass); the SVD is of the 470 nm dF/F with both channels projected on it,
    and the fitted coefficients are applied to the unfiltered signals ('subtracted from the measured F480').
    Assumed; keeping the high-passed corrected signal is run as a variant. 54 of 306 slopes are negative;
    the corrected ROI signal correlates with the deposited corrected dF/F at a median r of 0.26 to 0.70
    per session (uncorrected 0.13 to 0.61).
  - Frames binned 2 x 2 (144 x 144) and the components warped to a common atlas grid (the file's atlas
    affine) before the joint SVD; pixels are Z-scored per recording; 'every fifth session' is read as
    every fifth 40 s epoch. The SVD keeps 306 components, the rank of the corrected data, in place of
    400.
  - The GRU (32 units, dense sigmoid output, Adam, binary cross-entropy with label smoothing 0.001, batch
    256, 10 epochs, best validation loss) is written in PyTorch with Keras' initialisers in place of Keras.
  - 'JADE ICA is a port of jadeR written in the helper. It reaches different solutions when its input
    differs in the last bits (with the number of linear-algebra threads), which is why the round-1 run
    kept other ICs than the run before it; it now runs on one thread on inputs rounded to float32, and
    the same data give the same ICs. Three restarts from random rotations are shown: two keep ICs matching
    the main ones, the third shares 4 of 10.'
  - Epoch selection (R5) is run under both readings. The paper says such sessions 'were therefore excluded
    from all datasets' (Results, somatosensory, paragraph 1) and 'Reliable prediction was achieved after
    excluding sessions...' (Discussion, Summary of Results), so where the readings differ R5 (b) is the
    better-supported reading (assumed); the claims file's statement that the paper gives no rule for resting
    data is asked of a reader (questions/komori-2026.yaml).
  - 'Reading combinations: under R5 (a) the main one and one change at a time (R2, R3, R6, R7, R8); under
    R5 (b) every combination of R2, R3, R7 and R8, and R4 (b) with R3 (a) and (b). R4 (b) with R5 (a)
    (about 10 minutes per run) was not run in this round.'
  seed_sensitive: true
