- claim: rest-decoding-above-null
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_komori_2026_features.ipynb
  output: claim:rest-decoding-above-null
  measured:
  - 0.719
  - 0.655
  notes: 'Partial under reading R4 (b), every frame of each epoch a sample (features notebook): validation
    AUC 0.719 against 0.655 for the null models, paired t = 5.90, p = 0.0041, higher in all five folds;
    the mean is below the expected 0.82 +/- 0.082. Under the main reading (samples in the window around
    the peak, decoding notebook) 0.686 against 0.708 (p = 0.364), and none of the five seeds is significant
    (p = 0.10 to 0.90). No other reading is significant (corrected signal kept high-passed p = 0.90, keypoint
    pupil p = 1.00, epoch selection p = 0.95, folds of recordings p = 0.55 over 4 folds, null shuffling
    validation labels p = 0.52). By mouse, under the main reading, model and null AUC are 0.641 and 0.626
    (VG1-GC#51), 0.409 and 0.428 (52), 0.780 and 0.847 (53). The five-seed check of the R4 (b) reading
    was not run (about 8.5 minutes per run), so whether this outcome is seed sensitive is not known. A
    run of the same code in another software environment, outside the notebook, gave other ICs and no
    significant R4 (b) result; it decides nothing here but says the result is fragile.'
  deviations:
  - Three mice (VG1-GC#51, 52, 53) and their first three resting sessions (day0, day1, day7). The paper
    says 'Experiments from three mice were used' (Methods, Cross-validation) and '2-3 experiments per
    animal' (Methods, Resting state) without naming them. Assumed, as the claims file's reading R1 (a)
    with the mice recorded first; all 25 mice (R1 b) would mean streaming about 400 GB and was not run.
  - ICs kept by a repeatable rule in place of the paper's 'visual inspection' (Methods, ICA-based cortical
    features), the most compact spatial maps, then VIF pruning (claims file, R6). Assumed; no IC was removed
    for VIF, so the two readings of the IC count coincide.
  - Failed pupil detections in the deposited diameter (values up to 2.9e21 pixels) replaced by interpolation
    when above three times or below a third of the recording's median (148 and 57 frames in two sessions).
    Assumed; the paper's own outlier rule is for its DeepLabCut coordinates (Methods, Pupil diameter quantification).
  - Hemodynamic correction as in the Methods (dF/F to the mean of 5-15 s, 34-component SVD, OLS of F470
    on F405 after a 0.1 Hz high-pass); the SVD is of the 470 nm dF/F with both channels projected on it,
    and the fitted coefficients are applied to the unfiltered signals ('subtracted from the measured F480').
    Assumed; keeping the high-passed corrected signal is run as a variant.
  - Frames binned 2 x 2 (144 x 144) and the components warped to a common atlas grid (the file's atlas
    affine) before the joint SVD; pixels are Z-scored per recording; 'every fifth session' is read as
    every fifth 40 s epoch. The SVD keeps 306 components, the rank of the corrected data, in place of
    400.
  - The GRU (32 units, dense sigmoid output, Adam, binary cross-entropy with label smoothing 0.001, batch
    256, 10 epochs, best validation loss) is written in PyTorch with Keras' initialisers in place of Keras.
  - JADE ICA is a port of jadeR written in the helper; the decomposition is not identical across software
    environments, and the numbers are those of the recorded run.
  - Of the reading combinations the claims file names, the main one and one change at a time were run,
    not every combination.
  - The outcome rests on reading R4 (b), at the claim's seed only; the protocol's check under four more
    seeds was not run for it for lack of time.
