    there against 0.494 in MOs, and no kept IC has more than 0.27 in the band. RSP is matched to IC 28
    (0.160) and MOs to IC 4 (0.574). The timing does not favour the medial anterior IC either: under R5
    (a) no window has the model''s SHAP significantly above the null''s for any of the three ICs, so reading
    (a) gives no onset (the RSP IC differs at -0.3 to 0.0 s, p = 0.018 to 0.043, with the model''s SHAP
    lower); under reading (b) all three peak at the last frame (0.0 s), except RSP under the code reading
    (-0.033 s), so the medial anterior IC precedes neither. Under R5 (b) the Methods reading explains
    a sample in one model only and the code reading 1 to 3 per model; no window differs from null, and
    the medial anterior and MOs ICs peak at 0.0 s, RSP at -0.17 and -0.20 s. Every medial anterior peak
    is at the window''s last frame.'
