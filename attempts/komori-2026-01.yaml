- claim: rest-decoding-above-null
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_komori_2026_decoding.ipynb
  output: claim:rest-decoding-above-null
  measured:
  - 0.696
  - 0.514
  notes: 'Partial under two of the 16 combinations of R2, R3, R7 and R8 run under the epoch selection
    rule (R5 b), both with folds of recordings (R7 b) and null models scored on shuffled validation labels
    (R8 b). With the measured-signal correction and the keypoint pupil (R2 a, R3 b) the validation AUC
    is 0.696 against 0.514 for the null models (p = 0.0014), above null at 4 of 5 seeds (p = 0.0014 to
    0.039; at claim + 2000 0.587 against 0.551, p = 0.59). With the high-passed correction and the deposited
    pupil (R2 hp, R3 a) it is 0.614 against 0.482 (p = 0.039), above null at 2 of 5 seeds (the others
    p = 0.14 to 0.91). The null AUCs in these two are 0.45 to 0.57. Every mean model AUC in the two notebooks
    is below 0.738, the lower end of 0.82 +/- 0.082 (highest 0.718). Main combination, R5 (a): 0.625 against
    0.648 (p = 0.259), never above null over five seeds (p = 0.071 to 0.57); R5 (b): 0.621 against 0.550
    (p = 0.430), above null at one seed of five (claim + 2000, 0.569 against 0.460, p = 0.011). One change
    at a time under R5 (a): p = 0.31 to 0.90. Every frame a sample (R4 b) with R5 (b): 0.660 against 0.634
    (p = 0.817), with the keypoint pupil 0.603 against 0.598 (p = 0.925), not above null at any of five
    seeds. Under R5 (a) the within-epoch shuffle changes 12.8% of the training labels (42 of 117 epoch
    windows hold no positive label, 37 only positive ones), so the null model is close to the model by
    construction. By mouse, under R5 (a), model and null AUC are 0.555 and 0.580 (VG1-GC#51), 0.633 and
    0.644 (52), 0.671 and 0.703 (53). The training AUC of the models is 0.684 (R5 a) and 0.561 (R5 b),
    against 0.928 for the paper''s example model. Two of three ICA restarts give the same ICs and models;
    the third keeps 9 ICs (5 matching) and its models are below null (0.583 against 0.665, p = 0.031).'
  deviations: &id001
  - Three mice (VG1-GC#51, 52, 53) and their first three resting sessions (day0, day1, day7). The paper
    says 'Experiments from three mice were used' (Methods, Cross-validation) and '2-3 experiments per
    animal' (Methods, Resting state) without naming them. Assumed, as the claims file's reading R1 (a)
    with the mice recorded first. All 25 mice (R1 b, about 90 sessions with pupil, some three hours of
    streaming at the rate measured here) and the fourth session of each mouse were not run.
  - ICs kept by a repeatable rule in place of the paper's 'visual inspection' (Methods, ICA-based cortical
    features), the most compact spatial maps, then VIF pruning (claims file, R6). The VIF is the one the
    paper's code computes (#05_deep_learning/#07_vif_calc.ipynb at commit 405a720, statsmodels variance_inflation_factor
    on the features with no constant column, so without an intercept); for 10 ICs it removes ICs 5, 23
    and 14 and no further IC can be added, so 7 ICs are kept where the paper keeps 10. Assumed. The VIF
    with an intercept, which removes none and keeps 10, is run as a variant.
  - Failed pupil detections in the deposited diameter (values up to 2.9e21 pixels) replaced by interpolation
    when above three times or below a third of the recording's median (148 and 57 frames in two sessions).
    Assumed; the paper's own outlier rule is for its DeepLabCut coordinates (Methods, Pupil diameter quantification).
    The cleaned traces still reach 3.00 and 2.88 times their median in those sessions, and VG1-GC#53 day1
    has no positive label.
  - Hemodynamic correction as in the Methods (dF/F to the mean of 5-15 s, 34-component SVD, OLS of F470
    on F405 after a 0.1 Hz high-pass); the SVD is of the 470 nm dF/F with both channels projected on it,
    and the fitted coefficients are applied to the unfiltered signals ('subtracted from the measured F480').
    Assumed; keeping the high-passed corrected signal is run as a variant. 54 of 306 slopes are negative;
    the corrected ROI signal correlates with the deposited corrected dF/F at a median r of 0.26 to 0.70
    per session (uncorrected 0.13 to 0.61).
  - Frames binned 2 x 2 (144 x 144) and the components warped to a common atlas grid (the file's atlas
    affine) before the joint SVD; pixels are Z-scored per recording; 'every fifth session' is read as
    every fifth 40 s epoch. The SVD keeps 306 components, the rank of the corrected data, in place of
    400.
  - The GRU (32 units, dense sigmoid output, Adam, binary cross-entropy with label smoothing 0.001, batch
    256, 10 epochs, best validation loss) is written in PyTorch with Keras' initialisers in place of Keras.
  - 'JADE ICA is a port of jadeR written in the helper. The SVD temporal components keep their singular
    values, as in the paper''s code (#03_ica/#01_svd.ipynb, normalize_svd, svt = frames @ VT.T @ inv(VT
    VT.T), commit 405a720); the Methods divide each component by its singular value, which on the frames
    the SVD is fitted to makes the covariance the identity (ratio of the 30th to the 31st eigenvalue 1.00000000,
    against 1.0188 with the code''s scaling), so the 30 of 200 dimensions jadeR keeps are then set by
    rounding. That is why earlier runs on different machines kept different ICs. JADE runs to convergence
    as jadeR does (101 sweeps; an earlier cap of 100 stopped it short), and numpy, scipy and torch are
    pinned to their AVX2 kernels; a re-run from a fresh download gave the same outputs as the development
    run. Three restarts from random rotations: two give the main ICs, the third keeps 9 ICs, 5 of them
    matching.'
  - Epoch selection (R5) is run under both readings. The paper says such sessions 'were therefore excluded
    from all datasets' (Results, somatosensory, paragraph 1) and 'Reliable prediction was achieved after
    excluding sessions...' (Discussion, Summary of Results), so where the readings differ R5 (b) is the
    better-supported reading (assumed); the claims file's statement that the paper gives no rule for resting
    data is asked of a reader (questions/komori-2026.yaml).
  - 'Reading combinations: under R5 (a) the main one and one change at a time (R2, R3, R6, R7, R8); under
    R5 (b) every combination of R2, R3, R7 and R8, the two above null also under five seeds and at the
    six cutoffs, and R4 (b) with R3 (a) and (b) under five seeds. R4 (b) with R5 (a) (about 10 minutes
    per run) was not run.'
  seed_sensitive: true
