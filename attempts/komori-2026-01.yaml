findings:
- kind: metadata_error
  severity: minor
  statement: The imaging-plane metadata give 405 nm excitation for ImagingPlane_blue and 470 nm for ImagingPlane_UV.
    The values say the reverse; widefield_blue carries the calcium signal (dF/F SD 0.050 and 0.028 against
    0.012 and 0.014 in widefield_UV, two sessions), as the series descriptions and the dF/F descriptions
    (473 nm) say.
- kind: other
  about: data
  severity: minor
  statement: The deposited pupil diameter (processing/downsampled/pupil_tracking/diameter) holds unflagged
    failed detections. In VG1-GC#51 day0 and VG1-GC#53 day1 its maximum is 2.88e21 and 1.05e11 pixels,
    with 148 and 57 frames above three times the median, besides 768 and 269 missing values. A min-max
    normalisation of the raw trace leaves almost no dilation in those sessions.
- kind: other
  about: data
  severity: minor
  statement: Six of the 98 resting-state files (VG1-GC#73 day7; VG1-GC#99, 105, 109, 116 and 124 day0)
    are widefield-only and hold no pupil or other behaviour.
- kind: other
  about: data
  severity: none
  statement: Checks that passed. Every resting session read holds 18,000 frames per channel at 29.95 Hz
    over 600 s, as the paper describes; the pupil and the deposited dF/F are on the imaging timestamps;
    the pupil follows mean cortical activity by 1.1 to 2.3 s in seven of nine sessions, above a shifted
    control in all nine; no recording is deposited twice.
- kind: other
  about: paper
  statement: The paper's own recordings (somatosensory, visual pattern and visual oddball stimulation)
    are available only on request, so 18 of its 24 claims cannot be tested on public data.
- kind: methods_unavailable
  statement: Which resting sessions of DANDI:001425 did the paper use? The Methods say 'Experiments from
    three mice were used' and describe all 25 mice with '2-3 experiments per animal'; the dandiset holds
    3 or 4 resting sessions per mouse. This attempt assumed the first three mice recorded (VG1-GC#51,
    52, 53) with their first three sessions. Please name the mice and sessions.
- kind: methods_unavailable
  statement: How were the resting samples and labels formed? The Methods give 40 s epochs from 50 to 570
    s, a window from 3 s before to 0.5 s after the dilation peak, and global Z-scoring and min-max normalisation,
    but not whether the samples are only that window or every frame of the epoch with labels outside the
    window set to 0, nor whether the exclusion of sessions with early or no threshold crossing applies
    to resting data, and with which window. The readings give different results here (window, no selection,
    model 0.669 against null 0.688; every frame with the selection rule, 0.500 against 0.417, p = 0.0053).
    Please give the rule, and whether the resting pipeline applied the hemodynamic correction and the
    0.1 Hz high-pass of the Methods.
- kind: methods_unavailable
  statement: Which ICs were kept for the resting model, and how was 'every fifth session' applied to 600
    s resting recordings? The ICs were chosen 'by visual inspection', which cannot be repeated; this attempt
    kept the most compact maps. Publishing the IC maps or indices kept (Supplementary Figure 5A) would
    let the decomposition be matched.
- kind: methods_unavailable
  statement: The published code (WF_deep-learning) covers the stimulation experiments only; no code loads
    DANDI:001425 or builds the resting labels, epochs or folds, so the resting analysis can be rebuilt
    only from the Methods.
- kind: code_mismatch
  statement: The Methods assess the VIF on validation data ('Feature importance was estimated using validation
    data only. Prior to analysis, multicollinearity ... was assessed using the variance inflation factor'),
    with R2 from 'regressing each feature on all others'. The code (#05_deep_learning/#07_vif_calc.ipynb,
    commit 405a720) computes it on the training features and with statsmodels variance_inflation_factor
    on the features without a constant column, so with no intercept. On the resting features here the
    10-IC maximum is 60.1 on validation samples without an intercept, 14.05 on training samples without
    an intercept and 5.58 with an intercept, so which VIF the reported 9.0 is decides the claim.
verifications:
- date: '2026-11-25'
  kind: agent
  by: Independent agent run by CatalystNeuro (same harness, separate context, did not write the notebooks)
  reviewed: The executed notebooks of the round-1 run with the conclusion cells and the summary removed,
    the helper module and the claims file, with the paper's full text. The verifier read the archive's
    file list and asset metadata and tested epoch_labels, shuffle_within, folds_by_mouse and vif on synthetic
    inputs. It had no attempt record.
  results:
  - claim: rest-decoding-above-null
    agrees: false
    outcome: not_reproduced
    reason: Main run model AUC 0.670 against null 0.667, paired t p = 0.867; over 5 seeds the model AUC
      is 0.65 to 0.70 and no p is below 0.05; none of the 5 one-at-a-time readings beats null, and the
      R4 b variant gives p = 0.454. The model AUC is outside 0.82 +/- 0.082. Under R5 b, the reading most
      likely the paper's, the verdict rests on one underpowered run (17 of 117 epochs), never combined
      with more seeds or with R1 b, and the readings were never combined although the criterion asks whether
      some combination reproduces. Under R4 a with R5 a the null is nearly the same model by construction.
    response: 'The round-1 conclusions had been written from an earlier run and did not match the executed
      numbers; the decomposition differed between runs because JADE reaches other solutions when its input
      changes in the last bits. It is now run on one thread on float32-rounded inputs and gives the same
      ICs each run, with three restarts shown. IC selection now uses the paper''s (uncentred) VIF. R5
      b is run as a main reading under five seeds with per-fold AUCs, every combination of R2, R3, R7
      and R8 under R5 b, and R4 b with R5 b under five seeds. The share of labels the null shuffle changes
      is printed (12.8% under R5 a). R1 b and the fourth session were not run (about three hours of streaming).
      The outcome is partially reproduced on the criterion''s ''some combination'': R4 b with R5 b, p
      = 0.0053 at the claim''s seed, model AUC 0.500; marked seed sensitive (one seed of five) and the
      notes give its weaknesses.'
  - claim: rest-loss-accuracy-vs-null
    agrees: true
    outcome: not_reproduced
    reason: Loss 0.642 against 0.640 (p = 0.757), accuracy 0.640 against 0.638 (p = 0.911); the only seed
      with p < 0.05 (+3000) goes the wrong way for both.
    response: Re-run with the new decomposition and under R5 a and b and all combinations named above;
      still not reproduced. Notes updated to the new numbers.
  - claim: rest-needs-0-1-hz
    agrees: true
    outcome: not_reproduced
    reason: 0.1 Hz is never above null (main p = 0.88, R5 b p = 0.18, 0 of 5 seeds). The 2 Hz model is
      also never above null, so that half holds, but the main 2 Hz AUC (0.718) is not below the 0.1 Hz
      AUC (0.668), against the paper's 0.51 and 0.86.
    response: Re-run; the five-seed check is now also run under R5 b. Still not reproduced; notes updated.
  - claim: rest-ic-count-and-window
    agrees: false
    outcome: not_reproduced
    reason: The highest median AUC is at 13 ICs (0.710 against 0.662 for 10) and at a 3.0 s window. The
      differences are tiny and come from models that are not above null, so this result says little either
      way.
    response: 'With the paper''s VIF the two IC-count readings now differ: under reading (b) with R5 a,
      10 ICs have the highest median AUC (0.591), so one of the two parts holds under one reading and
      the outcome is partially reproduced; the window part fails under every reading. The notes say the
      models are not above null and the result says little either way.'
  - claim: rest-vif-below-10
    agrees: true
    outcome: not_reproduced
    reason: 'The 10-IC maximum is 5.47, below 10 but outside 9.0 +/- 0.9; 7 ICs are lower (Holm p = 0.024),
      13 do not differ (0.15), but 15 do (p = 0.024). Strictly not reproduced, partially reproduced on
      a lenient reading. The value may rest on a VIF definition that differs from the paper''s: the helper''s
      centred VIF equals statsmodels only with a constant column, and the paper''s values fit the uncentred
      definition.'
    response: 'The paper''s code was read (#07_vif_calc.ipynb): it calls variance_inflation_factor with
      no constant and on training features. The helper''s VIF is now the uncentred one, used for IC selection
      too, with the centred VIF and training samples as variants. The 10-IC maximum is 60.1 (uncentred,
      validation), 14.05 (training) and 5.58 (centred); none is within 9.0 +/- 0.9, so not reproduced.
      Added a code_mismatch finding.'
  - claim: rest-shap-medial-anterior-first
    agrees: true
    outcome: not_reproduced
    reason: 'No IC has a window with p < 0.05 above null under either SHAP reading, and the ''medial anterior''
      IC peaks last. The match itself is doubtful: IC 16 is a bilateral anterior map, not the paper''s
      narrow midline band.'
    response: Re-run with the new ICs and under R5 b; the matched medial anterior IC (2) is a weak match
      (0.164 of its weight in the band), as the notes say. The 'first sample per experiment' read as per
      epoch is now stated as an assumption. Still not reproduced.
  - claim: fig1-ssp-then-pupil
    agrees: true
    outcome: blocked
    reason: 'The archive holds 1838 assets: task, resting-state and 33 sensory-stim files, described as
      anaesthetised mice given a left-eye flash, right whisker-pad vibration and white noise, with widefield
      only and no pupil. There is no hindpaw electrical stimulation, drifting grating or oddball task,
