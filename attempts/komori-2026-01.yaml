  proposed:
    outcome: not_reproduced
    reason: The verified partial outcome rested on 10 ICs being highest under R5 (a), reading (b), in
      the round-2 run, whose decomposition was set by rounding (SVD components divided by their singular
      values, JADE stopped at 100 sweeps). With the components scaled as in the paper's code and JADE
      run to convergence, the decomposition is the same on any machine, and 10 ICs are highest only under
      R5 (b), reading (a), tied with 7 ICs that form the same set, so the count makes no difference there;
      1.5 s is never highest. Neither part of the criterion holds (features notebook, rest-ic-count-and-window
      cells).
- claim: rest-vif-below-10
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_komori_2026_features.ipynb
  output: claim:rest-vif-below-10
  measured: 21.55
  notes: Only 7 ICs remain at the 10-IC count under either reading, so the 10-IC values are those of these
    7. With the paper's code's VIF (no intercept) on the validation samples under R5 (a) the maximum is
    21.55 over the five models (per model 9.99 to 21.55); with an intercept 2.97; on the training samples,
    which the code uses, 10.32 (8.85 to 10.32). None is within 9.0 +/- 0.9. Under R5 (b) (212 to 530 validation
    samples per fold) it reaches 1.3e6. On the validation samples the 7-IC count is not lower (reading
    b Holm p = 0.67; reading a the same set) and 13 and 15 ICs do not differ (Holm p >= 0.67). On the
    training samples, reading (b), the 7-IC count has a lower median (8.74 against 10.07), not significantly
    (Holm p = 0.095); under reading (a) 15 ICs are higher (Holm p = 0.024). The 7 kept ICs have a maximum
    VIF of 9.99 on the frames the selection uses.
  deviations: *id001
- claim: rest-shap-medial-anterior-first
  outcome: not_reproduced
