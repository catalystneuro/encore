  notes: 'No combination reproduces rest-decoding-above-null, so the cutoffs are judged in every combination
    run at them. Main combination: at 0.1 Hz the models are not above null under R5 (a) (0.660 against
    0.642, p = 0.425) or R5 (b) (0.555 against 0.459, p = 0.381), at any of five seeds (R5 a p = 0.27
    to 0.95, R5 b p = 0.15 to 0.84); at 2 Hz not either (R5 a 0.607 against 0.616, p = 0.872; R5 b 0.533
    against 0.555, p = 0.725), and no cutoff is above null (p >= 0.28). In the two combinations above
    null at the decoding claim''s seed, run at this claim''s seed: with R2 a, R3 b, R7 b, R8 b the claim''s
    pattern holds (0.1 Hz 0.718 against 0.504, p = 0.009; 2 Hz 0.534 against 0.492, p = 0.61; no other
    cutoff above null, p = 0.10 to 0.55); with R2 hp, R3 a, R7 b, R8 b it does not (0.1 Hz 0.479 against
    0.475, p = 0.97; 0.2, 0.5 and 1 Hz above null, p = 0.005 to 0.039; 2 Hz p = 0.13). The R4 (b) runs
    are not above null at the decoding claim''s seed, so their cutoffs are not run. The claim holds in
    one of four combinations and fails in three, where the 0.1 Hz model is not above null. The Holm-corrected
    rank-sum tests of 0.1 Hz against the other cutoffs are not significant in any combination (p >= 0.14),
    as in the paper.'
