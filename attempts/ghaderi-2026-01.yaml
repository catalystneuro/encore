findings:
- kind: code_mismatch
  statement: The Methods define quiet trials with the median absolute deviation; the code (nwb_findQuietTrial.m)
    calls MATLAB mad() with its default, the mean absolute deviation, which keeps more trials (60%
    against 45% of completed trials). With the code's rule the single-neuron fractions of Fig. 3c and
    5a, the layer values of Fig. 3d and the explained variances of Fig. 6a come out at the paper's
    values; with the Methods' rule they are lower. The paper's numbers appear to come from the code's
    rule.
- kind: metadata_insufficient
  statement: The dandiset gives each unit a probe location and an Allen CCF label but not which CCF
    labels make up the paper's five areas. Only with data_helpers/Area_list.mat from the Zenodo record
    do the unit counts match the paper (10,294); without it 12,066 units sit on the five areas' probes.
- kind: metadata_error
  statement: In 12 optogenetic sessions (11 of mouse PG061 and one of PG021) the subject genotype is
    C57BL/6JRj, which carries no ChR2, although the paper inactivates VGAT-ChR2 mice and light trials
    in these sessions reduce licking as in the others; the other sessions of PG021 give
    VGAT_ChR2-eYFP.
- kind: metadata_error
  statement: The units' spike_width is described as "Trough to peak in ms" but holds seconds (0.0001 to
    0.0012); times 1000 the RS and FS flags fit the Methods' thresholds (RS 0.467 to 1.200 ms, FS 0.100
    to 0.333 ms).
- kind: metadata_error
  statement: Several trial-table descriptions do not fit their columns, for example opto_area ("laser
    light duration", holds an area name), opto_stim_start_time ("Pulse duration in s"),
    opto_stim_stop_time ("Individual pulse timestamps") and context ("Boolean for sound", holds
    go_tone, nogo_tone or no_tone).
- kind: other
  statement: Eleven trials of sub-PG028_ses-20210318T163504 have trial_type 0, outside the five types,
    and sub-PG076_ses-20220502T140636 has no No-tone trials. 343 trials have no video frames in their
    -1 to 2 s window, at least one in every session and most in sub-PG061_ses-20220212T233813 (243)
    and sub-PG038_ses-20210316T152753 (29), so they cannot be classed as quiet. sub-PG038_ses-20210317T180556 has no unit that passes the CCF filter.
- kind: paper_inconsistency
  statement: The Fig. 2 legend gives mean +/- SD and 1,000 bootstrap iterations; the reported spreads
    match the SEM over sessions (A1 Auditory 4.1 against SD 16.9) and the reported p-values (0.0003,
    0.0004) are reached with the code's 10,000 iterations, not with 1,000 (smallest 0.002 before FDR).
- kind: paper_inconsistency
  statement: The Results and Fig. 1c give 35 recording sessions, which the dandiset holds; the Methods
    say 34. The Methods give 8 mice for ALM inactivation; the dandiset has ALM sessions from 7 mice.
- kind: methods_unavailable
  statement: Question for the authors on Fig. 4b. Does "mostly consisted of neurons in A1" for cluster 1
    mean more than half of its neurons or the largest share of any area? With the paper's labels
    cluster 1 is 30.5% A1, 21.4% wS2 and 20.3% wS1, so the claim holds under the second reading only.
- kind: methods_unavailable
  statement: Question for the authors on the population decoders (Fig. 5b to 5d, 7d). The Methods say SVM
    parameters were chosen by grid search with nested cross-validation but give no grid; the code
    trains libsvm nu-SVC with default parameters and no search. Which was used, and over which grid?
    With a C grid of 10^-3 to 10^3 the cluster-removal and post-whisker results differ from the code's
    decoder (Fig. 5c cluster 25 not significant; Fig. 7d wM2 onset after ALM).
- kind: methods_unavailable
  statement: Question for the authors on Fig. 1f. How is "time to 20% max" computed, on the
    session-mean trace or on each trial, and over which window is the maximum taken? None of the
    code computes it. With the maximum over the 1 s response window the session-mean reading gives
    54.4, 115.3 and 192.4 ms and the per-trial reading 94.6, 142.9 and 254.6 ms, against the reported
    58, 115 and 231 ms; with the maximum over the plotted 1.0 to 1.2 s the tongue latency cannot reach
    231 ms.
- kind: data_missing
  statement: The detected lick times and lick mask used for the lick coding direction (Fig. 8b,
    Supplementary Fig. 18) are only in the Zenodo record (Lick_times.mat); the dandiset holds the raw
    piezo lick trace and the jaw trace, and its BehavioralEvents hold only Valve_OpeningTime in all 35
    sessions (printed in reproduce_ghaderi_2026.ipynb, fig8b-lick-coding-direction).
