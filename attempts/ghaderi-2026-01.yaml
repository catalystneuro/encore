- claim: fig4-29-clusters
  outcome: not_reproduced
  notebook: decoding_clusters_whisker.ipynb
  output: claim:fig4-29-clusters
  assumed: true
  measured: 40
  notes: Following the Methods (10 ms PSTHs of the five correct types, 10,292 neurons with a nonzero
    range, 17 PCs, Gaussian similarity with sigma 0.0455 for a mean similarity of 0.5, eigenvectors 2
    to 17, diagonal GMM with the code's reg_covar 0) the BIC minimum is at k = 36, 40, 42 and 42 for
    four seeds of 5 initialisations and at k = 40 for the best of the 20, outside the 20 to 38 band;
    k = 29 is 741 units above the minimum and the BIC over k = 30 to 44 spans 784 units. One seed alone
    (k = 36) would give partial, so the outcome rests on the pooled initialisations and is not stable.
    The code's variant (100 ms bins, whisker-only quiet rule, exp(-d/0.07975), mean similarity 0.500)
    gives k = 33 and 35 by seed and 33 for the best of 10. The first run (reg_covar 1e-6, 5
    initialisations) gave k = 44 and 36.
  deviations:
  - 5 GMM initialisations per k and seed (4 seeds, 20 in all; code variant 2 seeds) in place of the
    code's 1,000 (time). This is an assumption, that the best of 20 initialisations stands for the
    best of 1,000; more initialisations can only lower the BIC at each k, so the minimum could move.
  - Row centring, unscaled left singular vectors, eigenvectors 2 to 17, the k grid, diagonal
    covariance and reg_covar 0 are the code's (Data_Clustering.ipynb, A4_spectral_embedding and
    A6_GMM_grid_search, lines printed in the notebook).
  - The shuffle rule for the number of PCs (1,000 shuffled PCAs) is not run; 17 PCs as the Methods.
  - Sessions with fewer than 3 quiet trials of a correct type would be skipped (code); none were.
