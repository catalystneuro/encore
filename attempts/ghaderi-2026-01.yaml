  - 14.64
  notes: Mean +/- SEM over 35 sessions (34 for No-tone Whisker, which one session lacks) of P(lick) on
    completed trials; Go-tone Whisker 78.18 +/- 2.08, Go-tone No-Whisker 9.90 +/- 1.49, Nogo-tone
