- claim: cells-tracked-18pct
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: Neither the dandiset nor the Zenodo table identifies a cell's later occurrences. The table
    lists each of 313 cells at its first session only; the code reads cross-session identity from
