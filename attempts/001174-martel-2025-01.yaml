outcomes:
- claim: zenodo-descriptors-link
  outcome: not_reproduced
  notebook: reproduce_martel_2025.ipynb
  output: claim:zenodo-descriptors-link
  notes: The cells link, the descriptors do not. 565 of 626 table rows match a dandiset cell by
    subject, site, date and accepted-cell index; the 61 unmatched rows are task rows of F, which has
    no task files. 93.8% of matched cells have both centroid coordinates within 3 pixels of the
    dandiset's footprint centroids (median differences -0.52 and -0.45 pixels), so the identity holds.
    86 of 313 cells (27.5%) have rate and amplitude within 1% in every condition, below the 50% the
    criterion asks. The table's rates exceed the dandiset's by a median factor of 1.042 (5th to 95th
    percentile 0.999 to 1.499); 40.9% of cell-conditions agree within 1% for the rate and 66.3% for
    the amplitude. Two U SMA sessions differ by large factors (2023-03-07 spontaneous 20.0,
    2023-03-14 task 0.042). One-frame inter-event intervals are rarer in the dandiset (median IEI of
    one frame in 3.9% of cell-conditions against 11.9% in the table). No unmatched dandiset cells
    are expected, as the table lists first occurrences only (313 of the 401 accepted cells). The two
    U SMA sessions are not a swap of conditions. In 2023-03-07 the table's task counts follow the
    dandiset's task counts (Spearman 0.975) and its spontaneous counts follow neither file (-0.354
    and 0.205); in 2023-03-14 each condition follows its own file best (0.829 and 0.786). In both the
    dandiset has fewer spontaneous events (4 against 133 and 78 against 246 over the first-occurrence
    cells) and a higher amplitude in every cell-condition (medians 3.702 against 3.080 and 3.488
    against 2.987), which points to a different event detection in those files.
  deviations:
  - Rates use each file's duration from its frames ((n - 1) / rate), as ReorganizedData_Final.m
    divides by the segment's last time; the paper's segments were parts of one concatenated
    recording, the dandiset's are separate files.
