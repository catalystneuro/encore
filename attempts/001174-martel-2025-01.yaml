- claim: fig2-q-sma-modulated-34pct
  outcome: blocked
  blocked_by: data_missing
  notes: The test needs the target-onset times, which the paper took from TTL pulses recorded on extra
    channels, and the raw traces. The dandiset's files hold neither (no trial table, no TTL or
