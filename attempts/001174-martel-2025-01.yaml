- claim: fig1d-rate-no-change
  outcome: reproduced
  notebook: reproduce_martel_2025.ipynb
  output: claim:fig1d-rate-no-change
  notes: No reading finds a difference. Over pooled SMA and M1 and over Q SMA, U SMA, U M1 and V M1,
    the smallest uncorrected signed-rank p is 0.0666 (V M1) and no q is below 0.05 in family (a) or
    (b). Pooled SMA medians 0.0149 and 0.0166 events/s (n = 192), pooled M1 0.0874 and 0.0865 (n = 60).
  deviations:
  - Only the claims file's reading D (i), a cell's value in its first session, could be run; reading
    D (ii), the median over the sessions a cell appears in, needs later occurrences that no source
    identifies.
  - Each cell counts once, in its first session (Methods, Cell identification, "We only report results
    for the first session in which cells were identified"), from the Zenodo table.
- claim: fig1e-ieicv-no-change
  outcome: reproduced
  notebook: reproduce_martel_2025.ipynb
  output: claim:fig1e-ieicv-no-change
  notes: No reading finds a difference; the smallest uncorrected p is 0.0841 (U SMA) and no q is below
