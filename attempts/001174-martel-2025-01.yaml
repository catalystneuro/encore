    paper's 0.07 and 0.22.
- claim: fig4a-example-sequences-q
  outcome: not_reproduced
  notebook: sequences_martel_2025.ipynb
  output: claim:fig4a-example-sequences-q
  measured:
  - 157
  - 211
  notes: The only Q SMA session with 40 accepted cells is 2022-09-15, and the paper's Figure 4D table
    gives 13 and 17 for it. Under every reading of method S the counts are far off. With the
    double-counting step as the code runs it, 157 to 196 (spontaneous) and 176 to 311 (task); with the
    code's more-than-4 rule, 113 to 155 and 156 to 260; with the double-counting step as documented,
    5 and 2 to 5. Every ordering of cells (reading a) gives 979 and 1856 significant patterns. The two
    conditions' sets of sequences differ under every reading (10 shared of 157 and 211 under reading
    a, task reading i). Across all slices the counts follow the paper's table in rank (Spearman 0.871)
    but are a median 3.12 times larger (0.40 times with the documented double-counting step), so the
    port, the parameters the paper used, or the dandiset's events differ from the paper's.
  deviations:
  - The detection is a Python port of identify_sequences.m (sequences.py), not the MATLAB code.
  - The parameter values the paper passed to identify_sequences.m are not recorded; the claims file's
    readings of the two 0.05 s rules and of the task slice were all run.
  - The code's double-counting step writes 2 into a logical array, so it removes nothing; the main
    count does what the code does, as the claims file asks, and the documented step is a variant.
