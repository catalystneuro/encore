    its second, while the dandiset's spontaneous file lasts 10 min. As run, the only Q SMA session with 40 accepted cells is 2022-09-15, and the paper's Figure 4D table
    gives 13 and 17 for it. Under every reading of method S the counts are far off. With the
    double-counting step as the code runs it, 157 to 196 (spontaneous) and 176 to 311 (task); with the
    code's more-than-4 rule, 113 to 155 and 156 to 260; with the double-counting step as documented,
