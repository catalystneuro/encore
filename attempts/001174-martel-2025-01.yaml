- claim: fig1f-amplitude-m1-above-sma-u-task
  outcome: not_reproduced
  notebook: reproduce_martel_2025.ipynb
  output: claim:fig1f-amplitude-m1-above-sma-u-task
  notes: The task amplitude is higher in U's M1 than in its SMA (medians 3.384 and 3.193, P(M1 > SMA)
