- claim: fig4c-sequence-cells-not-clustered
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: sequences_martel_2025.ipynb
  output: claim:fig4c-sequence-cells-not-clustered
  notes: The readings disagree, and the criterion blocks the claim then. Reading (i), centroids of
    cells in sequences against all cells (spontaneous, Q SMA and U M1), finds no difference under any
    0.05 s reading (smallest p 0.6776 over 24 tests). Reading (ii), distances between cells sharing a
    sequence against all pair distances, finds them shorter under every 0.05 s reading (medians 284
    to 296 against 320 um; KS p 0.0001 to 0.0020; Mann-Whitney p 0.0002 or below). The Results describe
    reading (ii) and the Figure 4C legend reading (i); Figure S2, which shows the comparison, is not in
    the text read. The paper gives no test. Pairs from overlapping sequences are not independent, and
    the detection behind both readings does not match the paper's counts. The question of which
    comparison and test the paper meant is put to its authors (findings).
