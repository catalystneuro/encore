- claim: fig3-synchronized-pairs-exist
  outcome: reproduced
  notebook: reproduce_martel_2025.ipynb
  output: claim:fig3-synchronized-pairs-exist
  notes: Every site and condition has sessions with pairs of |Z-Jaccard| > 1.96. M1 6 of 6 sessions in
    each condition, SMA 18 of 20 spontaneous and 12 of 12 task sessions; 542 of 6089 defined pairs in
    all. Median proportions per session are SMA 0.0776 and 0.0647, M1 0.1006 and 0.1802 (spontaneous,
    task), against 0.05 expected under the null at this threshold (reported, not used). The
    proportions correlate with the paper's Jaccard table at 0.950 over 43 session-conditions.
  deviations:
  - Each condition is a separate file, so each is binned on its own and its last four bins dropped;
    the code bins the joined recording and drops the bin that mixes the two.
- claim: fig3ab-synchrony-not-distance
  outcome: reproduced
  notebook: reproduce_martel_2025.ipynb
  output: claim:fig3ab-synchrony-not-distance
  notes: With Pearson, 4 U SMA sessions and all 4 U M1 sessions show no significant correlation of
    Z-Jaccard with centroid distance in either condition; with Spearman, 5 U SMA and 4 U M1 sessions.
    Over all 44 session-conditions of all monkeys, 5 Pearson and 3 Spearman correlations reach p < 0.05.
  deviations:
  - Centroids are footprint-weighted means of the dandiset's masks; they agree with the paper's IDPS
    centroids within 3 pixels for 93.8% of cells.
- claim: fig3c-sync-no-condition-change
  outcome: reproduced
  notebook: reproduce_martel_2025.ipynb
  output: claim:fig3c-sync-no-condition-change
  notes: Signed-rank tests over sessions with both conditions find no difference; SMA p = 0.1514
