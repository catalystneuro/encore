- claim: fig1f-amplitude-u-sma-spont-higher
  outcome: reproduced
  notebook: reproduce_martel_2025.ipynb
  output: claim:fig1f-amplitude-u-sma-spont-higher
  notes: In U's SMA (44 cells with events in both parts) the spontaneous amplitude is higher (medians
    3.409 and 3.166, 72.7% of cells higher at rest), p = 0.0017, q = 0.0204 in family (a) and 0.0068
