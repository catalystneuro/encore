  notes: Median RMS error over 110 sessions 9.36 cm (IQR 3.92) with correlations and 4.80 cm (IQR 1.73)
    shuffled; both medians and the ensemble IQR within tolerance, the shuffled IQR not. Ensemble larger
    in 109 of 110 sessions (Wilcoxon p = 9.0e-20). Without the six misaligned sessions 9.14 and 4.78 cm.
