- claim: fig3cd-signal-and-noise-growth
  outcome: reproduced
  notebook: reproduce_hazon_2022.ipynb
  output: claim:fig3cd-signal-and-noise-growth
  notes: Shuffling leaves the bin means unchanged (largest change 7e-16), so the signal and its slope
    are identical with and without shuffling. Median session, unshuffled noise slope 0.0154 with R squared
    0.983 at 100 neurons or more (slope positive in 110 of 110 sessions, R squared at least 0.9 in 109);
    shuffled noise slope 0.0012, a median 0.084 of the unshuffled slope (below 0.1 in 72 of 110 sessions).
  deviations:
  - Signal and noise use 20 random neuron subsets per ensemble size, each with its own trial split, where
