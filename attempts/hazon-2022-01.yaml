  notes: The signal slope is larger at the end of runs than at the beginning (pooled medians 0.208 and
    0.313, 220 values). The legend's one-tailed test (beginning greater) gives p = 1.00 under both readings
    (pooled and rightward only) and for 110 or 73 sessions. The code's test (beginning lower) gives p
