findings:
- kind: data_missing
  statement: The data set holds only the 110 working sessions of the 239 recorded, and no positions of
    the cells in the field of view, so the paper's test that noise correlations do not depend on the distance
    between cells cannot be run. There is no reward or trial record; trials and task performance are rebuilt
    from the position.
- kind: other
  statement: The traces array holds event onsets (single frames with the event amplitude), as the descriptor
    says, not the alpha-convolved and normalised event trace the paper decodes from; the trace must be
    rebuilt with the Methods' kernel. Rebuilt this way, the response variability matches the paper's 0.7263
    +/- 0.6117 exactly.
- kind: metadata_insufficient
  statement: No sampling rate, frame times or spatial scale are stored; position is in camera pixels.
    20 Hz and 118 cm over the 5th to 95th percentile of position are taken from the paper and its code.
- kind: metadata_error
  statement: The descriptor and the paper describe sessions of about 20 min; at 20 Hz the sessions last
    a median 30.1 min (20.1 to 46.0).
- kind: other
  statement: In six sessions the event trace does not track the position at lag 0 (a quick decoder gives
    14.7 to 44.0 cm mean error, against a median 5.6 cm). In Mouse2012 141832 and Mouse2011 142436 the
    events lead by 80 to 90 frames (best lag error 5.4 and 2.8 cm); Mouse2011 105556 and 104511 show no
    position information at any lag within 200 frames; Mouse2026 115639 and Mouse2021 132808 are weaker
    at lag 0 (14.7 and 15.3 cm). The paper's code trims the first 350 frames of Mouse2026 115639, which
    suggests a known offset there. Their IMSE curves are flat, so the IMSE fits give meaningless I0 and
    N (Mouse2011 105556 and 104511 give I0 about 240 against a median 1e-4), with 80 subsets as with 4.
- kind: format_error
  statement: Four sessions have position values far outside the track (Mouse2012 141832 down to -3.7e7
    pixels over 795 frames, Mouse2022 093722 down to -1.5e5, Mouse2024 090858&091446 a ramp from -12,628
    over the first 503 frames, Mouse2028 105610 down to -23); the first valid trial of Mouse2022 093722
    includes such frames.
- kind: metadata_insufficient
  statement: Two session IDs join two recordings (Mouse2024 090858&091446 with 55,247 frames, and 130536&130559)
    without saying how; the first has 77.6 events per neuron per minute against a median 12.0, with the
    rate rising about 2.5 times in its second part.
- kind: paper_inconsistency
  statement: The Figure 3f legend says the signal slope decreases over the run, while the code's test
    (signrank(begin, end, tail left)) and its printed p = 2.19e-18 test an increase; the data show an
    increase (medians 0.208 at the start and 0.313 at the end of runs).
- kind: paper_inconsistency
  statement: The synthetic place-field model has uniform half-width distributions in the Figure 5 legend
    and Supplementary Figure 16, and log-normal ones in the Methods; simulated, they give opposite results
    for which distribution has the higher NSV.
- kind: methods_unavailable
  statement: Questions for the paper's authors. (1) Which direction does the Figure 3f signal-slope test
    take, the legend's decrease or the code's increase? This attempt follows the code. (2) Which half-width
    distributions produced Figure 5a to 5d, the legend's uniform ones or the Methods' log-normal ones?
    This attempt follows the legend. (3) The decoder is fitted with Lambda 0 (no regularisation); was
    this the setting for all published results? This attempt uses an L2 SVM with C = 1, and C = 0.1 and
    10 change the median error by less than 0.4 cm. (4) How were the Supplementary Table 1 values computed
    (rates over running or all frames, the in-field definition, the cells averaged, the spatial information
    formula, and whether trial-by-trial variability uses counts or the event trace)? None of the readings
    tried gives more than two of the seven values. (5) How were the confidence intervals of the Supplementary
    Table 2 filter computed? With delta-method intervals here the filter decides whether the variance
    of PF widths reaches p < 0.05 (0.102 with it, 0.041 without).
