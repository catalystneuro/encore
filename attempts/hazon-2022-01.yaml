- claim: data-sessions-and-neurons
  outcome: reproduced
  notebook: reproduce_hazon_2022.ipynb
  output: claim:data-sessions-and-neurons
  measured:
  - 12
  - 110
  - 27898
  - 235
  - 151
  - 497
  - 73
  - 10
  notes: All 110 sessions in the file meet the working rule (more than 150 neurons, more than 30 valid
    trials each way), from 12 mice, 27,898 neurons, median 235, 151 to 497. More than 200 neurons (code)
    gives 73 large-data sessions from 10 mice; 200 or more (Methods) gives 74 from 10. The file holds
    only the 110 working sessions, so the selection from 239 cannot be checked.
  deviations:
  - The 239 recorded sessions are not in the dataset; the 110 count is checked as the number of sessions
    meeting the rule, as the criterion allows.
- claim: single-cell-variability
  outcome: reproduced
  notebook: reproduce_hazon_2022.ipynb
  output: claim:single-cell-variability
  measured:
  - 0.7263
  - 0.6117
  - 0.437
  - 0.464
  notes: Code reading (SD over trials per neuron and class, pooled over 1,115,920 session, class and neuron
    values) 0.7263 +/- 0.6117, equal to the paper to four decimals; variance reading 0.9016 +/- 1.5301.
    Single-cell SNR with the 40 classes together 0.437 +/- 0.464 over 27,898 neurons (5 with no response);
    per direction 0.295 +/- 0.294. Both means match under the first reading; the SNR spread (0.464) is
    larger than the paper's 0.34.
  deviations:
  - The file holds event onsets only; the event trace is rebuilt from them with the Methods' alpha kernel
    (tau 0.2 s, sampled at 20 Hz from 0.05 to 1.5 s, causal) and divided by its standard deviation (Methods,
    Event detection algorithm, last two steps; code DecodeTensor.tensor_loader, 'HD_gamma').
  - All valid trials of each direction are used (code variance_per_neuron.mlx works on the session tensor),
    not the equalised trials of the decoder.
- claim: suppl-table1-place-field-properties
  outcome: not_reproduced
  notebook: reproduce_hazon_2022.ipynb
  output: claim:suppl-table1-place-field-properties
  measured:
  - 0.362
  - 1.042
  - 0.153
  - 1.461
  - 18.464
  - 0.902
  - 0.163
  notes: Two of seven values are within 10% under some reading, the mean event rate over running frames
    in cells with more than 100 events per 10 min (0.362 Hz) and the maximum binned rate in those cells
    (1.461 Hz). Out of tolerance under every reading run are the in-field rate (1.04 to 1.34 Hz against
    0.88), the out-of-field rate (0.15 to 0.25 against 0.034), the fitted FWHM (16.4 to 18.5 cm against
    37.8), the trial-by-trial variability (0.036 to 0.043 in event counts, 0.88 to 0.90 in the event trace,
    against 1.2) and the spatial information (0.15 to 0.16 by the footnote's formula read literally, 1.06
    to 1.30 bits as log2(20) minus the entropy, against 0.24). The widths leave out 195 fits wider than
    1180 cm (ten times the track). With no cap the mean FWHM over both directions is 37.6 cm (n 52,838),
    within tolerance, which would give three values and a partial reproduction; that mean comes from the
    195 runaway fits, as the median is 11.5 cm and the mean of fits up to the track length 15.5 cm. The
    outcome rests on leaving those fits out. The minimal-modulation rule (maximum above 20% of the SD
    of the tuning curve) keeps 27,715 rightward and 27,770 leftward of 27,898 cells, against the paper's
    27,793, so it is the paper's rule and removes only silent cells; it does not move the width. Gaussian
    fits failed for 1536 rightward and 1422 leftward tuning curves.
  deviations:
  - Readings run for the open details (criterion) are rates over running frames or the whole session;
    in-field within the fitted half-amplitude width or above half the peak; per-direction fits and fits
    pooled over both directions; all cells and cells with more than 100 events per 10 min (Supplementary
    Figure 3 legend). The measured values listed are, per quantity, the reading closest to the paper.
  - Trial-by-trial variability was computed both on event counts per visit, as the footnote says (spike
    count), and on the event trace tensor, a reading added because the counts are far from the paper's
    scale.
  - The footnote formula for spatial information is garbled in the text; it was read literally ((1/N)
    sum p log2 p, sign dropped) and as log2(N) minus the entropy of the binned rate distribution.
  - Assumed, Gaussian fits with a FWHM above 1180 cm (ten times the track) are fit failures and are left
    out of the width; the paper names no cap. Without it the mean width is within tolerance (notes).
  - The log2(N) minus entropy reading of spatial information assumes uniform occupancy over the 20 bins;
    the literal footnote formula, H/20, cannot exceed log2(20)/20 = 0.216 and so cannot reach 0.24.
  assumed: true
- claim: fig1d-noise-correlation-by-field-distance
  outcome: reproduced
  notebook: reproduce_hazon_2022.ipynb
  output: claim:fig1d-noise-correlation-by-field-distance
  notes: Mean over 110 sessions, rightward, distance 0 0.0386 against 0.0064 at 10 or more bins; leftward
    0.0374 against 0.0058. Shuffled means at the printed distances are within 0.0002 of zero, and the
    95% intervals separate from the unshuffled ones at every distance 0 to 10, in both directions; pooling
    all pairs gives the same. 7,859,771 pairs over both directions against the legend's 3,941,140, about
    half, which fits counting each pair once over the two directions.
