- claim: fig2d-rms-error-ensemble-vs-shuffled
  outcome: reproduced
  notebook: reproduce_hazon_2022_decoding.ipynb
  output: claim:fig2d-rms-error-ensemble-vs-shuffled
  measured:
  - 9.36
