  notes: Shapiro-Wilk on log10 rates of Kilosort4 single units does not reject normality in M
    (layer 5 p = 0.84, n = 20; layer 6 p = 0.31, n = 74) but does in NS layer 6 (p = 0.014, n = 39)
    and E layer 5 (p = 0.00056, n = 300). NS layer 5 (p = 0.19) and E layer 6 (p = 0.93) pass, so
    each simulation fails in one deep layer, and neither the full nor the partial outcome holds.
