- claim: fig2r-power-law-spiking-band
  outcome: not_reproduced
  notebook: reproduce_laquitaine_2024.ipynb
  output: claim:fig2r-power-law-spiking-band
  notes: The log-log slope of the median normalised spectrum in 0.3 to 6 kHz is negative in all 30
    layer and experiment pairs, but R2 is 0.9 or more in only 7 (M layers 5 and 6, all five H
    layers). In the models R2 ranges from 0.05 (DS layer 1) to 0.89 (10-minute E, layer 5); NS
    ranges from 0.41 to 0.85. The R2 threshold is the claims file's reading of "followed a power
    law".
  deviations:
