findings:
- kind: metadata_error
  statement: The sortings in the sub-003-fitted folder (dense probe, depth 1) are identical, spike
    for spike, to those in sub-004-fitted (depth 2) for all six sorters, and they match the depth 2
    ground truth (78 of 131 Kilosort4 units with a best agreement of 0.5 or more) and not the depth 1
    ground truth (none). The depth 1 sortings are therefore missing, and the depth 1 folder holds a
    copy of depth 2's.
- kind: data_missing
  statement: The paper's results on Buccino's synthetic recording (S), on NS down-sampled by two
    (NS-2X) and on the 10-minute 40 kHz evoked recording rest on sortings that are not in the
    dandiset. S's traces and ground truth are deposited without sortings, NS-2X is absent, and the
    10-minute evoked recording has traces and ground truth but no sortings. Seven claims cannot be
    tested, or only in part, for this reason.
- kind: metadata_insufficient
  statement: The evoked recordings (sub-002, sub-002-fitted, sub-npx-evoked-sf-40Hz and their
    sortings) carry no stimulus table, trial intervals or stimulus description, so the stimulus
    direction and time of each presentation cannot be recovered from the dandiset. The paper's
    code rebuilds the schedule from parameters in its scripts. The five Figure 7 claims cannot be
    tested.
- kind: metadata_insufficient
  statement: The ground truth tables of the dense probe simulations (sub-003 to sub-005, raw and
    fitted) hold only spike times and neuron names, without the soma positions, layers, synapse
    classes and electrical types that the Neuropixels ground truth tables carry. Only 56 of the 287
    depth 1 neurons can be found by name in the Neuropixels tables.
- kind: metadata_error
  statement: The Horvath recordings (sub-vivo-horvath-depth-1 to 3) store int16 counts with an NWB
    conversion of 0.195, which declares 0.195 volts per count, and an electrode column gain_to_uV of
    195000; neither is plausible, and they disagree. At 0.195 uV per count the median noise is 5.6
    uV, while the dense probe model fitted to these data has 28.3 uV; in counts the noise is 28.7.
    The intended scale should be stated.
- kind: metadata_error
  statement: The Reyes probe traces of cell 3754013 (sub-biophy-isolated-traces-reyes and
    sub-biophy-summed-traces-reyes) both declare microvolts (conversion 1e-6), but the cell's
    spike-triggered peak-to-peak at the nearest electrode is 0.0424 in the isolated file and 37.9
    in the summed file; the paper's code plots the isolated values in mV. The isolated file appears
    to be in millivolts. The files also lack the soma position of the cell, which the code
    hard-codes.
- kind: other
  statement: 78 of the 1,388 NS ground truth units (sub-001) and 213 of the 1,836 units of the
    1-hour evoked recording (sub-002) have no spike in the first 10 minutes, though all fire later
    in their files, while the paper says that all model neurons fired at least once in the first
    10 minutes.
- kind: other
  statement: The depth 3 dense probe sortings (sub-005-fitted) barely agree with the depth 3 ground
    truth. 34.6% of Kilosort4 spikes fall within 0.65 ms of a ground truth spike, against 33.6% after
    a 50 ms shift (every sorter gives an excess of at most 1.1 points), no lag within 100 ms raises any sorter's
    coincidence rate more than 0.011 above its median over lags against the depth 1, 2 or 3 ground truth, no Kilosort4 unit reaches an agreement of 0.5,
    and one neuron in 1,123 is well sorted by any sorter. The deposit could not be shown to pair
    these sortings with any deposited ground truth.
- kind: code_mismatch
  statement: In the paper's code (notebooks/1_results/fig2_M_amplitude_npx_DONE.ipynb, commit
    6e9af03), the Marques-Smith recording is overwritten by the spontaneous model before the peak
    amplitudes are computed (`RecNV = preprocess(RecNS, FREQ_MIN)`), so the printed maximal amplitude
    and per-site amplitudes labelled Marques-Smith are the model's; the notebook then loads saved
    figure data, so whether the published panel is affected cannot be told from the code.
- kind: metadata_insufficient
  statement: The sorting tables' columns (KSLabel, KSLabel_repeat, layer, contact, ContamPct,
    Amplitude, firing_rates) have "No description", the contact column is a row index for the
    Neuropixels files and a 1-based channel name for the Horvath files, and the session
    descriptions of the Horvath and dense probe sortings contain an unformatted "{depth}"
    placeholder. Many raw files give related_publications as "doi:" with no identifier.
- kind: metadata_insufficient
  statement: The Kilosort2 sorting of the evoked recording labelled 10 minutes
    (sub-002-fitted_ses-ks2-10m) ends at 240 s, as the Methods say Kilosort2 sorted only 4 minutes
    of the evoked recording, but neither its file name nor its metadata says so. Rates computed
    over 600 s would be 2.5 times too low.
- kind: methods_unavailable
  statement: Which evoked recording enters Figures 4 and 5a is not stated. The Figure 6 legend names
    the 10-minute 40 kHz recording for panels a and b and the 1-hour 20 kHz recording for d, f, g and
    h; Figures 4 and 5 name none. The deposited evoked sortings are of the first 10 minutes of the
    1-hour recording (250 Kilosort4 units reach an agreement of 0.5 with its ground truth, none with
    the 40 kHz one), and they reproduce the code's printed median rate of 0.655 spikes/s. This
    attempt assumes that recording; could the authors confirm it?
