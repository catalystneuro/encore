- claim: fig2s-v-ap-power-and-scaling-increase-with-depth
  outcome: partially_reproduced
  notebook: reproduce_laquitaine_2024.ipynb
  output: claim:fig2s-v-ap-power-and-scaling-increase-with-depth
  notes: AP power in 0.3 to 2 kHz rises with depth in NS, E and DS under both readings, median PSD
    and summed power (Kruskal-Wallis p from 1.2e-41 to 3.0e-32, at most one inversion), so the AP
    power part holds without the methods_underspecified case. The slope alpha differs across layers
    in every model (p below 1e-8), but its layer medians do not rise in every model. Read as
    steepness (|alpha|) it holds for E and DS and fails for NS (two inversions); read as the
    signed slope it fails for all three. With H in counts, DS has weaker AP power (median summed
    power 257 against 1,723 uV2) and a shallower slope (-0.10 against -1.27) than H, but only 9.5%
    (summed power) and 3.3% (alpha) of DS sites lie within H's range; with H at 0.195 uV per count,
    88.5% of DS sites lie within H's summed power range. The 0.3 to 1 kHz variant gives the same
    for the models.
  deviations:
  - Traces are 60 s per recording, not 10 minutes.
  - The claims file does not say whether "the scaling slope increased" refers to the signed slope
    or its magnitude; both are shown, and the outcome is partial under both.
