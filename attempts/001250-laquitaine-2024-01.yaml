    margins (verifier round 1); the 60 s blocks are shown as a variant.
- claim: fig2m-peak-amplitude-increases-with-depth
  outcome: reproduced
  notebook: reproduce_laquitaine_2024.ipynb
  output: claim:fig2m-peak-amplitude-increases-with-depth
  notes: Kruskal-Wallis across layers gives p = 1.2e-25 (NS), 1.2e-23 (E), 2.2e-07 (DS), 2.0e-32 (M)
    and 3.6e-25 (H), and the layer medians rise from layer 1 to layer 6 with one inversion in each
    (layer 6 below layer 5, or for DS layer 4 below layer 2/3). Models differ from in vivo at p <
    0.01 in 12 of 15 layer comparisons with H in counts, as the statement's "most p < 0.01" says
    (1 of 5 for DS against H scaled to 0.195 uV per count).
  deviations:
  - Traces are six 10 s blocks of the first 10 minutes (60 s per recording), not 10 minutes.
  - E is the 1-hour evoked recording (sub-002-fitted), as in the code; the 10-minute recording is
    shown and gives the same.
  - The Horvath files' scale is inconsistent (finding); H in counts is used for DS against H, as
    the fitted dense model's noise matches H in counts (median 28.3 against 28.7) and not at 0.195
    uV per count (5.6). The comparison with H is reported and does not decide the outcome.
- claim: fig2np-noise-increases-with-depth
  outcome: reproduced
  notebook: reproduce_laquitaine_2024.ipynb
  output: claim:fig2np-noise-increases-with-depth
  notes: Noise (mean absolute deviation, minimum over 1 s segments) differs across layers in NS
    (p = 1.4e-35), E (2.9e-34), DS (p below 1e-300), M (1.9e-14) and H (2.0e-31), with medians rising
    from layer 1 to layer 5 and one inversion at layer 6 in every experiment. The median absolute
    deviation gives the same pattern.
  deviations:
  - Traces are 60 s per recording (six 10 s blocks of the first 10 minutes), not 10 minutes, so the
    minimum over 1 s segments is over 60 segments, not 600.
- claim: fig2q-anr-within-vivo-range
  outcome: not_reproduced
  notebook: reproduce_laquitaine_2024.ipynb
  output: claim:fig2q-anr-within-vivo-range
  notes: Over the whole first 600 s every experiment has ANR values beyond -10 and +10, but no
    model lies within its in vivo range widened by 10%. NS (-149.2 to 54.5), E (-158.5 to 58.3) and
    E40 (-152.7 to 53.5) extend beyond M's widened range (-112.6 to 41.1) at both ends, and DS
    (-207.7 to 89.8) beyond H's (-177.6 to 68.9) at both ends. On the 60 s blocks, DS lay within H's
    range and NS and E did not, so the outcome does not depend on the duration. More than 99.7% of
    the samples of the 60 s blocks have |ANR| below 10 in every experiment.
  deviations:
  - The ANR extremes use the minimum and maximum of the preprocessed traces over the whole first
