inputs:
- what: The motor control model of the paper's code (thalamocortical__motor.py), reimplemented in
    tcloop.rflo_motor only to time one learning trial for the estimates of the blocked simulation
    claims. No outcome rests on it.
  source: https://github.com/kaushik-l/tc-learning at commit 2aa94dd5fb381ffb30a56962a3be20b96f63868b
outcomes:
- claim: wm-sessions-link
  outcome: partially_reproduced
  notebook: reproduce_lakshminarasimhan_2024.ipynb
  output: claim:wm-sessions-link
  measured:
  - 11
  - 151
  - 72
  notes: Of the 24 mice in the dandiset, one has both ALM and thalamic units, anm00264943. Its five
    ALM sessions hold 151 units (30, 18, 39, 46 and 18) and its six thalamic sessions hold 72 units
    (11, 13, 18, 10, 10 and 10), the paper's totals exactly, counting every sorted unit (the files
    carry no isolation label). The mouse has eleven sessions, not the five the expected value gives
    with tolerance 0, and no session holds both regions (computed from the regions each file names),
    as the paper says ("in separate sessions"). The paper's five sessions match the ALM sessions
    (Figure 6C, n = 5). The mouse and the unit totals link; the session count does not. The only
    other mouse with ALM units next to another region (anm00261335) has SNr units, not thalamic ones.
    No spike train or trial table is deposited twice. The dependent claims are tested on the eleven
    sessions; the readout claims use only the five ALM sessions, and the thalamic claims pair the six
    thalamic sessions with them.
- claim: fig6-wm-choice-r2
  outcome: not_reproduced
  notebook: reproduce_lakshminarasimhan_2024.ipynb
  output: claim:fig6-wm-choice-r2
  measured: -1.705
  notes: Test-set R2 of the choice readout, mean over 10 splits, under the claim seed with every
    unit's trials as the files are (U1). R1 (per session, mean over the five sessions) gives -1.705
    for T1 and -0.732 for T2; R2 (151 pooled units subsampled to 53, 20 subsamples) gives -0.247 and
    -29.2 (median 0.168 and 0.340). No reading comes near 0.97. The measured value is that of R1
    with T1, the first reading the criterion lists; the largest of the four means is -0.247 (R2, T1).
    Over the five seeds the U1 means run from -30.6 to 0.105 and the medians from -1.08 to 0.39. The
    training-set R2 of the same fits is 0.95 to 1.00 under U1 (0.93 to 1.00 under U2), so the OLS readout on 18 to 53 units over 260 time points fits the training
    averages and does not generalize to the test averages of 4 to 9 trials per choice. The variant
    that averages each unit only over trials within its first-to-last-spike span (U2) gives means of at most
    0.506 and medians of at most 0.660 under the claim seed. Diagnostics (seed + 1, R2, T1) show that the 10% test sets are noisy. The readout's
    outputs on the two halves of a test set correlate at 0.145 (Spearman-Brown reliability of the
    whole test set 0.25). With 10%, 30% and 50% test sets the test R2 means are -0.089, 0.371 and
    -0.333 and the medians 0.268, 0.515 and 0.313, none near 0.97. The training-set values are close
    to the paper's 0.97; whether the paper's R2 is in-sample is asked of the paper's authors
    (findings). The partial link (eleven sessions, not five) does not bear on this claim, which uses
    the five ALM sessions.
  deviations:
  - The smoothing grid (10, 25, 50, 100 and 200 ms), the 10 ms bin and the padding before smoothing
    are standard choices; the paper gives none of them (claims W3, W4).
  - The delay window is a fixed 1.3 s from delay onset (pole_out_time); the go cue follows delay
    onset by 1.26 to 1.30 s in nearly every trial and by up to 4.7 s in a few.
  - Each unit is averaged over all selected trials (U1), as the files give no interval over which
    each unit was recorded; U2 is shown as a variant and gives the same outcome.
- claim: fig6c-wm-leading-pcs-drive-choice
  outcome: partially_reproduced
  notebook: reproduce_lakshminarasimhan_2024.ipynb
  output: claim:fig6c-wm-leading-pcs-drive-choice
  notes: The criterion names both readouts, per session (R1, Figure 6C, n = 5) and pooled and
    subsampled (R2), and lets only the trial reading vary. Under the claim seed with U1, both
    readings of "leading" hold under R2 for T1 and for T2. For T1 the largest alignment is with PC 2
    (0.110) and the mean over PCs 1 to 3 exceeds that over PCs 4 to 16 (0.081 against 0.063); for T2
    the largest is with PC 1 (0.097) and the means are 0.068 against 0.063. Both hold under some
    reading for all five seeds. Under R1, reading (a) fails for both trial readings, the largest
    alignment being with PC 16 (0.188 for T1, SEM 0.059), and (b) holds only for T1, by a margin of
    0.0003 (0.1069 against 0.1065); it fails under seed + 2000 (by 0.0015) and holds under the other
    three seeds. Were (b) to fail under R1, R1 would meet neither reading while R2 meets both, and the
    outcome would still be partial. Against chance the leading PCs carry less of the readout than a random direction would.
    Under R2 the mean squared alignment with PCs 1 to 3 is 0.0096 (T1) and 0.0076 (T2), against 1/53
    = 0.0189, and PCs 1 to 16 hold 0.116 and 0.113 of the readout's squared norm, against 16/53 =
    0.302; per session that share is below its chance level in all five sessions under both trial
    readings (0.045 to 0.593, against 0.348 to 0.889). The readout lies mostly in PCs 17 to 53 and
    does not predict test data (fig6-wm-choice-r2), so the statement's "large influence" of the
    leading PCs is not supported.
  deviations:
  - The criterion's readouts R1 and R2 give different results. Both are required, as the criterion
    lists them together and lets only the trial reading vary; (a) and (b) hold under R2, only (b)
    under R1 for T1. The chance levels of the alignments are diagnostics, not part of the criterion.
- claim: figs6d-wm-thalamic-r2
  outcome: not_reproduced
  notebook: reproduce_lakshminarasimhan_2024.ipynb
  output: claim:figs6d-wm-thalamic-r2
  measured: -2.068
  notes: Mean test-set R2 over the 72 thalamic units of the regression on all cortical units, under
    the claim seed. T1 with P1 (53 subsampled ALM units) gives -2.068 (median -1.879, SEM 0.090), T2
    with P1 -2.277, T1 with P2 (all 151 units) -4.613 and T2 with P2 -5.161; no unit has a positive
    test R2 under P1. The U2 variant gives -1.91 to -3.80. Over the five seeds the means run from
    -5.47 to -1.98. P3 does not apply, as no session holds both ALM and thalamic units. The
    training-set R2 of the same regressions is 0.73 to 0.77 under P1 and near 1 under P2, close to
    the paper's 0.70 under P1; see the question to the paper's authors (findings). Noise ceilings
    (seed + 1, T1) show that a mean test-set R2 near 0.70 is out of reach with 10% test sets. The
    averages of the two halves of a unit's test set correlate at 0.04 to 0.17 on average over the
    sigma grid (reliability of the whole test set 0.07 to 0.28), and a unit's own training-set
    average predicts its test-set average with a mean R2 of -0.05 to 0.06. With 30% and 50% test sets
    the mean test R2 of T1, P1, U1 is -1.57 and -1.72. The thalamic units come from six sessions
    beside the five ALM sessions (wm-sessions-link, partial), and are paired with the ALM sessions as
    the deviation says.
  deviations:
  - Thalamic units and ALM units come from different sessions, so each thalamic unit's trial
    averages (split 80/10/10 within its own session) are paired with the ALM averages of the
    corresponding sets of the ALM sessions. The paper does not say how its training and test sets
    were paired across sessions.
  - Sigma is chosen per thalamic unit on the validation R2 of the regression itself (Methods,
    "optimized the smoothing parameter by cross-validation"); the grid is a standard choice.
- claim: fig6d-wm-top5-pcs
  outcome: not_reproduced
  notebook: reproduce_lakshminarasimhan_2024.ipynb
  output: claim:fig6d-wm-top5-pcs
  measured: 0.040
  notes: Mean normalized R2(5) over the 72 thalamic units, claim seed, T1, P1, U1, N1 is 0.040;
    under N2 0.043 and under N3 0.836. No combination of T, P and N falls within 0.59 to 0.67 under
    any of the five seeds. With U1 over the five seeds, N1 gives at most 0.31 under P1 and -1.02 to
    2.01 under P2, where a few units with test R2(16) near 0 dominate the mean; N2 gives -0.09 to
    0.11; N3 gives 0.76 to 0.86. The test-set R2(k) is 0.005 at k = 1 and falls to -0.93 at k = 16
    (T1, P1). Under the claim seed no unit has a positive test R2(16) under P1 (6 under T1 and P2,
    10 under T2 and P2), and none has a positive test R2 from all units under any reading, so the
    denominators of N1 and N2 are not positive and these ratios are not fractions of explainable
    variance. N3 rescales each curve between its minimum and maximum; 48 of the 72 units have their
    largest test R2(k) at k = 1 (T1, P1), so N3 at k = 5 measures the fall of the curve. With 50% test
    sets (a diagnostic, seed + 1) the mean test R2(k) peaks at 0.043 (k = 3) and N1, N2 and N3 give
    3.89, -0.16 and 0.87. On the training set (a diagnostic) N2 gives 0.68 and N3 0.70 under T1 and
    P1. The partial link bears on this claim as on figs6d-wm-thalamic-r2.
  deviations:
  - Each normalization is applied to the unit's mean R2(k) curve over splits and subsamples, a
    choice the paper does not state.
- claim: figs6f-ct-alignment-not-significant
  outcome: not_reproduced
  notebook: reproduce_lakshminarasimhan_2024.ipynb
  output: claim:figs6f-ct-alignment-not-significant
  measured: 0.0000083
  notes: On the main reading (T1, P1, U1, corticothalamic weights from the 16-PC regression mapped
    back to units) the weights are more aligned with PC 1 than with the readout, 0.094 against 0.071
    (mean difference 0.023, Cohen's dz 0.54, t = 4.62, one-sided paired p = 8.3e-06, n = 72). The
    p-value is below 0.001 under all five seeds. Every 16-PC reading under the claim seed gives
    p < 0.05; T2 with P1 gives p >= 0.05 under two of the four other seeds (p 0.21 and 0.052). With
    the weights of the regression on all units, the variant, the readout alignment is the larger
    (one-sided p = 1, two-sided p below 0.001, dz -10.5), which meets the criterion's p >= 0.05 by an
    effect in the other direction; the main reading decides. The 16-PC weights lie in the span of
    PCs 1 to 16, where a random direction has mean alignment 0.203 with PC 1 and 0.059 with the
    readout, which has 0.29 of its norm in the span. Against these chance levels the order reverses
    (a diagnostic) as the PC 1 alignment is 0.46 of its chance level and the readout alignment 1.19
    times its own (chance-corrected dz -2.36, two-sided p below 0.001); with the readout taken at each
    thalamic unit's own sigma the ratio is 1.21 and the raw one-sided p stays below 0.001 on the main
    reading; on T2 with P1 and U1 that variant gives a raw one-sided p of 0.140, which does not bear
    on the main reading. The readout alignment of the all-units variant may be inflated by the factor
    (H^T H)^-1 that the readout and the corticothalamic weights share; that variant does not decide
    the outcome. The test
    the criterion gives thus compares two alignments with different chance levels. The regressions
    behind the weights do not predict test data (figs6d-wm-thalamic-r2). The paper's reported
    p = 0.17 for this dataset is not matched.
  deviations:
  - The main reading uses P1, as the Figure S6 legend says the ALM population was subsampled "in all
    analysis", and T1, which claims W2 lists first; all 16-PC readings give the same outcome under
    the claim seed.
