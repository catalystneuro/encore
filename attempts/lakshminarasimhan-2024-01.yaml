findings:
- kind: metadata_insufficient
  severity: major
  statement: The units tables give no interval over which each unit was recorded (no obs_intervals
    or trial list), though many units fire in only part of their session. In the paper's mouse only
    61% of the pairs of a unit and a correct trial without photostimulation fall between the unit's first and last spike, and in one
    thalamic session the median unit spans 56% of the trial period. Trial averages over all trials
    then include trials in which a unit may not have been recorded. The analysis here was run both
    ways.
- kind: metadata_error
  severity: minor
  statement: The electrode group location gives the same coordinates (AP 2.50, ML -1.50, DV 0.00
    from bregma) in all 137 extracellular files, including the 72 thalamic and 18 SNr recordings,
    where these are ALM coordinates. The brain_region field names the region correctly; unit_z is
    one constant per session.
- kind: metadata_insufficient
  severity: minor
  statement: The thalamic recordings are labelled "Thalamus" with brain_subregion N/A; the nuclei
    (VM and VAL in the paper and in Guo et al. 2017) are not given per file or unit.
- kind: metadata_insufficient
  severity: minor
  statement: The trial columns type, response, photo_stim_type and photo_stim_period have no
    description. photo_stim_type is "stimulation" on every trial, including those without
    photostimulation; stim_present and photo_stim_period carry the distinction. type holds the
    instructed lick direction or "non-performing"; for correct trials it is taken as the choice.
- kind: other
  about: data
  severity: minor
  statement: Eighteen files from three mice (anm00261334, anm00261335, anm00261336) are labelled SNr,
    a region the dandiset's description does not mention (it names ALM and thalamus).
- kind: other
  about: data
  severity: none
  statement: The dandiset holds the paper's working memory data. Mouse anm00264943 has 151 ALM units
    in five sessions and 72 thalamic units in six, the paper's totals exactly. No spike train or
    trial table among the 1,936 units and 137 files is deposited twice, spike trains are sorted, and
    choice decoding from spikes is at chance before the sample epoch and rises in the delay and
    after the go cue in all eleven sessions of the mouse, consistent with spikes and trials sharing
    a clock. The draft holds the same blobs as version 0.220126.1903.
- kind: methods_unavailable
  statement: Question for the paper's authors. Were the R2 values of the working memory analysis
    (0.97 for choice, 0.70 for thalamic units, and the fractions of Figure 6D) computed on held-out
    test trials, as the STAR Methods say, or on the trials used to fit? With OLS on trial averages as
    the Methods describe, test-set R2 is negative here (choice at most -0.25, thalamic units -2.1 on
    average), while training-set R2 is close to the paper's values (choice 0.95 to 1.00, thalamic
    0.74, top-5 fraction 0.68). With 10% test sets the thalamic test-set averages are mostly noise
    here (the two halves of a unit's test set correlate at 0.04 to 0.17 on average, a reliability of
    at most 0.28), so a test-set R2 of 0.70 is out of reach for any model of the unit's mean,
    regularized or not. In-sample R2, or R2 on averages over many more trials, would explain the
    difference.
- kind: paper_inconsistency
  statement: The STAR Methods say the working memory dataset "includes 5 behavioral sessions from one
    mouse", but the 72 thalamic units of that mouse come from six sessions besides the five ALM
    sessions, eleven in all, with no session holding both regions. How the thalamic units, recorded
    in other sessions, were paired with ALM activity for training and test sets is not stated.
- kind: methods_unavailable
  statement: Questions for the paper's authors. Which trials was each unit averaged over, given that
    the files do not say when each unit was recorded? What grid was searched for the smoothing width,
    and was it chosen per thalamic unit? How was the normalization of Figure 6D applied (the Methods
    divide by R2(16), the Results by the R2 from all units, the legend rescales each curve to 0 to 1)?
    What recurrent thalamic weights were used for Figure S5C and S5D?
- kind: other
  about: paper
  statement: The motor control recordings of Sauerbrei et al. (2020), used for half of Figure 6 and
    Figure S6, are not deposited in any archive the paper names; six claims cannot be tested.
