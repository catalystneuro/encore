  - claim: fig6d-wm-top5-pcs
    agrees: true
    outcome: not_reproduced
    reason: No combination of T, P and N falls within 0.59 to 0.67 at any seed. The underlying test R2(k)
      is negative for every unit at k = 16, so the N1, N2 and N3 ratios are undefined, not merely off.
      N1 and N2 are ratios of negative R2 values, and N3 min-max rescales curves that decrease with k,
      so its 0.84 at k = 5 only reflects that decline; these are printed as if they were explainable-variance
      fractions.
    response: Outcome kept. The notebook now prints, per reading, how many units have a positive denominator
      for N1 and N2 (none under P1) and how many units have their largest R2(k) at k = 1 (48 of 72), and
      the conclusion and notes say that none of the ratios is a fraction of explainable variance. Added
      the main reading with 50% test sets as a diagnostic.
  - claim: figs6f-ct-alignment-not-significant
    agrees: true
    outcome: not_reproduced
    reason: This is a claim of absence, and at the claim seed every 16-PC reading gives p < 0.05; the
      main reading gives p = 8.3e-6, and only T2/P1 at seeds +2000 and +4000 reach p >= 0.05. The all-units
      variant gives p = 1.0, a large effect in the opposite direction, which does not fit "difference
      not significant" either. w_tc is confined to the top-16 PC span, which holds about 27% of the readout's
      norm, so a random vector in it would align about 0.20 with PC1 and about 0.055 with the readout;
      the observed 0.094 and 0.071 put PC1 below its chance level and the readout above its own, so the
      test, as the criterion specifies it, does not compare like with like. The criterion's p >= 0.05
      is satisfied trivially by a strong effect in the opposite direction. The all-units readout alignment
      is inflated by the shared (H^T H)^-1 factor, and w_ro is taken at the readout's best sigma while
      w_tc and U come from each thalamic unit's best sigma.
    response: Outcome kept. Added the chance levels per fit in the 16-PC span (0.203 with PC 1, 0.059
      with the readout, which has 0.29 of its norm in the span) and the comparison against them (PC 1
      at 0.46 of chance, readout at 1.19, dz -2.36), a two-sided p for every reading, and the readout
      taken at each thalamic unit's own sigma (same outcome, raw one-sided p below 0.001). The notes say
      the all-units variant meets p >= 0.05 by an effect in the other direction and that the main reading
      decides. The criterion's one-sided rule follows the Figure S6F legend ("Statistics of a one-sided
      paired t-test are shown"), so it is not a misreading of the paper and no question was added.
