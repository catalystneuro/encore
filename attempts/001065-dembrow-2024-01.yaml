- claim: species-no-effect
  outcome: reproduced
  notebook: reproduce_dembrow_2024.ipynb
  output: claim:species-no-effect
  notes: Species from the files' NCBI taxon (35 M. mulatta cells from 9 subjects, 259 M. nemestrina).
    No M. mulatta cell comes from acute MCx slices, and under reading (b) several subclasses have 0 to
    2 M. mulatta cells, so the four-way model with all interactions is rank deficient (rank 14 of 16 columns
    under reading a, 29 of 56 under reading b). With type II sums of squares computed from nested least-squares
    fits, valid on such a design, no feature has a species effect at BH-corrected p < 0.05 under either
    reading (smallest uncorrected p 0.054, Fr, reading a; 0.041, max_ifreq_gain, reading b; uncorrected
    p < 0.05 for 0 and 2 features). The additive model (variant) agrees (smallest p 0.067 and 0.11). statsmodels'
    type II table on the rank-deficient design gives 13 features under reading (a) and 2 under reading
    (b) (round 1, before the feature checks, 11 and 1); those sums of squares come from aliased columns.
