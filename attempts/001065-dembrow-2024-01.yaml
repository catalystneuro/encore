    claims (data elsewhere).
  source: doi:10.5281/zenodo.13749343
outcomes:
- claim: link-cells
  outcome: reproduced
  notebook: reproduce_dembrow_2024.ipynb
  output: claim:link-cells
  notes: All 294 files match a row of L5_physiology_121223.csv by cell name; 47 of its 341 rows are not
    in the dataset. Donor agrees for 293 of 294 cells and species for 292 of 294 (99.3%). The median Spearman
    correlation over the 39 features computed here against the table's values is 0.957, with 28 of 39
    features at 0.9 or more; the lowest are i_max_gain (0.33), initial_ifreq_gain (0.47) and initial_gain
    (0.63), and SFA correlates at -0.989 as the table holds the inverse ratio. After the sweep check,
    maximum and steady-state input resistance agree with the table at Pearson r 0.993 and 0.990. All 68
    cells of MCx.pkl and TCx.pkl have a 200 pA series in the files; 7 have exactly the pickle's steps,
    and the maximum spike counts of 67 of 68 are within 10% of the pickle's (Spearman 0.996). The link
    holds for the cells in the dataset; 47 cells of the paper's table cannot be linked as they are absent.
  deviations:
  - All features are computed here from the traces, as the paper's extraction code was not deposited,
    with the definitions of STAR Methods and the standard choices named in the claims file and the helper
    (peak and steady-state windows, linear range of the V-I relation, averaged chirp profiles, fAHP window,
    spike detection, filtering). Added after verification round 1, a sweep check of the 1 s hyperpolarizing
    steps (a sweep must hyperpolarize, from a baseline below -40 mV, with the voltage below -20 mV in
    the step; 13 sweeps of 10 cells rejected) and a chirp check (a profile with no 3 dB cutoff after its
    maximum is left out; 1 cell), standard choices of this attempt.
  - Files hold several runs of each protocol; the paper does not say which it used. The first run is used
    (for the 1 s steps, the first series reaching 1 nA), a standard choice of this attempt; the link check
    finds the features close to the paper's table (median Spearman 0.957).
  - The criterion of this link claim was written by the author after the first comparison of features
    with the table had been seen during development.
