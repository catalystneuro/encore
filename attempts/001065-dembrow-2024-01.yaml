inputs:
- what: Per-cell labels (area, brain region, preparation, transcriptomic, retrograde and predicted subclass,
    t-type, drug, donor, species) and, for the link check only, the paper's feature values, from L5_physiology_121223.csv
    and lockdown_physiology_072623.csv of the paper's code.
  source: doi:10.5281/zenodo.13749343
- what: The cells of the 4 nA protocol and their areas (keys of MCx.pkl and TCx.pkl), and, for the link
    check, their spike counts.
  source: doi:10.5281/zenodo.13749343
