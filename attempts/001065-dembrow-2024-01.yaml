- kind: metadata_insufficient
  statement: The files carry no cortical area, brain region, slice preparation (acute or culture), transcriptomic
    or predicted subclass, retrograde label or drug condition, and session_description is a placeholder.
    These come only from the per-cell tables of the paper's code on Zenodo, matched by the electrode cell_id,
    which every file has.
- kind: data_missing
  statement: 47 of the 341 cells of the code's L5 physiology table (35 of them recorded by one user) are
    not in the dandiset, which holds 294; the paper reports 333 cells in its physiology analysis, 33 of
    them from earlier studies.
- kind: metadata_error
  statement: File sub-Q19-26-009 (cell Q19.26.009.2A.04.02) names subject Q19.26.009 where the paper's
    table gives donor Q19.26.012, and the two files of subject Q19.01.001 give Macaca mulatta (NCBITaxon
    9544) where the table gives M. nemestrina.
- kind: metadata_error
  statement: One subject has sex U and subject Q19.01.001 has age P1Y/ (1 year, in a malformed ISO duration),
    where the paper reports animals of 2 to 19 years; the files hold 57 subjects, 22 male, 34 female,
    against the paper's 58, 23 and 35.
- kind: other
  statement: Five files hold 1 s current command steps above 4 nA (up to 16 nA) in their 200 pA series,
    beyond the 4 nA that STAR Methods give as the headstage limit; whether these currents were delivered
    is not stated.
- kind: selection_undocumented
  statement: Files hold several runs of each protocol (repeats, series stopped early, a 50 pA and a 200
    pA series, runs before and after drug application) and nothing marks which sweeps the paper's features
    use. For 61 of the 68 cells of the 4 nA analysis the steps in the files differ from those of the code's
    pickles.
- kind: methods_unavailable
  statement: Question for the authors. Were the random training splits of the logistic regression classifiers
    (Figure 3E to 3G and 5E) stratified by class, and with what regularization? predict_subclass was not
    deposited. With stratified splits the scores reproduce here; unstratified, the 50% held-out score
    is 78.3% against 87.9%.
- kind: methods_unavailable
  statement: Question for the authors. How were the subthreshold oscillations of Figure 7 and S7 computed
    (the curve fitted to find the return to baseline after the AHP, the filter, the spline over segments,
    the measure of strength, and which sweeps enter Figure S7G)? The R code was not deposited. Rebuilt
    from the Methods, the MCx frequency rises with membrane potential as reported, but oscillation strength
    does not, and the TCx autocorrelation frequency falls with membrane potential.
- kind: methods_unavailable
  statement: Question for the authors. Which sweeps of each protocol were used for the features, and how
    was the half-width of late spikes in the 4 nA trains measured? The extraction code was not deposited.
    The last-to-first half-width ratio is 1.55 in TCx here against 2.27 in the code's pickle.
- kind: code_mismatch
  statement: The paper's table holds SFA as the last ISI over the second, the inverse of the STAR Methods'
    ratio of the second ISI to the last (Spearman -0.989 with the Methods' ratio computed here).
- kind: paper_inconsistency
  statement: The Figure 6D and 6E legend says TCx L5 ET neurons have a deeper fast AHP and more symmetrical
    spikes than MCx ones; the Results and the code's means say the opposite, and the data here agree with
    the Results (fAHP -15.9 against -11.4 mV, up/down ratio 2.69 against 3.31, MCx against TCx).
- kind: other
  statement: The paper's deposited morphology features (RawFeatureWide.csv) cover 19 reconstructions,
    10 MCx and 9 TCx, where the paper reports 12 and 11.
