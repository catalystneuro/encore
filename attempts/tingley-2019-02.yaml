- claim: fig1h-no-amplitude-frequency-correlation
  outcome: reproduced
  notebook: reproduce_tingley_2019.ipynb
  output: claim:fig1h-no-amplitude-frequency-correlation
  assumed: true
  notes: 'Over 27014 LS HFOs, peak_amplitude against peak_frequency: Pearson r = 0.006 (p = 0.3); Spearman rho =
    0.020 (p = 0.00095). With peak_normed_power, r = -0.000 (p = 0.96) and rho = 0.006 (p = 0.36). Within animals
    both correlations are significant in 5 of 6 animals, r from -0.107 to 0.169, with signs that differ between
    animals.'
  deviations:
  - 'Assumed: the Pearson correlation. The paper names no test; the claims file names Pearson and Spearman, which
    differ in outcome (Spearman finds a negligible but significant rho of 0.020). Pearson is the usual test of the
    linear relation a scatter like Figure 1H shows.'
  - Amplitude is the deposited peak_amplitude; peak_normed_power is shown as a variant.
- claim: fig2-confined-to-ls
  outcome: not_reproduced
  notebook: lfp_tingley_2019.ipynb
  output: claim:fig2-confined-to-ls
  notes: Eight recordings (all DT7) have LS sites and sites of another non-hippocampal structure (acg, cc, ms, sfi).
    The criterion holds in none. The LS median power ratio exceeds the acg median in all 6 recordings with acg sites,
    but medial septal sites exceed the LS median in 3 recordings (12.32 against 4.97 in 20170320), and in every
    recording some site outside LS has a ratio above 1.5 (the largest per recording 3.49 to 44.33). Each recording's
    ratios rest on 17 to 113 LS HFOs.
  deviations:
  - Power ratios are computed in the two storage chunks (about 14 min each) of each recording with the most LS HFOs,
    to bound the data streamed.
  - Sites are placed by the electrodes' region labels; the dataset holds no depth estimate.
- claim: fig2ef-intermediate-ls
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: The criterion needs each recording's estimated relative depth in LS (STAR Methods, Relative anatomical
    depth within LS). The dandiset does not store it; its release notes say the relative depth is not in the source
    files. Session names carry drive depths in um, which are not the paper's depth estimate (implantation depth,
    daily turns and histology). The per-recording phase-locking percentages it would use are computed in the LFP
    notebook.
