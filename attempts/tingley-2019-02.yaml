- claim: fig4b-pre-post-unchanged
  outcome: partially_reproduced
  notebook: reproduce_tingley_2019.ipynb
  output: claim:fig4b-pre-post-unchanged
  measured: 462
  assumed: true
  notes: Under the 8 normalized readings, the rank-sum test of PRE against POST finds no difference (p 0.50 to 0.89;
    effect r -0.013 to 0.025). Under the 8 raw-count readings it does (p 0.0036 to 0.0065, POST higher; r -0.10
    to -0.12). Only 361 to 503 pairs in 21 to 23 sessions pass the inclusion rule (462 under inclusion a with BEHAV
    in trials), against 7172 pairs in 53 sessions; no DT8 pair passes. The absence holds under the adopted reading,
    on 6% of the paper's pairs.
  deviations:
  - 'Assumed: the CCG divided by the square root of the product of the two neurons'' spike counts in the epoch (claims
    reading iii). The paper does not say how the CCG is normalized; the normalized reading is adopted because the
    paper compares excess correlations across epochs with very different spike counts (BEHAV and HFO epochs), which
    raw counts do not allow. The raw-count readings are shown.'
  - The dataset does not mark PRE, BEHAV and POST. PRE is taken as the recording before the first trial's start,
    BEHAV from the first trial's start to the last trial's stop, and POST after the last trial's stop (an assumption;
    the STAR Methods say each recording has the three periods in that order).
  - Events are the lab's deposited detections (claims file, open detail i, reading a), LSRipples and CA1Ripples,
    whose stored parameters differ from the Methods (LS 120-180 Hz, durations up to 100 ms, peak thresholds of 4
    to 6 SD in some files; CA1 130-200 Hz).
  - The inclusion rule is applied to the spikes of each epoch (claims reading i); spikes during HFOs are those between
    each LS HFO's start and stop.
