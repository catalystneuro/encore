findings:
- kind: data_missing
  statement: The two rats of the optogenetic experiments (Figure 6, Figure S4), with their light stimulation times and waveforms,
    are not in the dandiset; its 98 files hold six rats (DT1, DT2, DT5, DT7, DT8, DT9) and no stimulus or optogenetic series.
- kind: metadata_insufficient
  statement: Electrode positions are not stored, nor the probe model of each recording, so distances between sites, travelling-wave
    speeds (Figure 3) and CA1 neuron depths (Figure 7D, E) cannot be computed.
- kind: metadata_insufficient
  statement: The estimated relative depth of each recording within LS (STAR Methods), on which Figure 2E, F and Figure S1C,
    D rest, is not stored; session names carry drive depths only.
- kind: metadata_insufficient
  statement: The pre-behavior home cage, maze and post-behavior home cage periods of each recording are not marked; they can
    be inferred only from the first and last trials.
- kind: metadata_insufficient
  statement: 'Most hippocampal units are labelled hpc, not CA1 or CA3, so CA1 and CA3 populations cannot be told apart reliably:
    10 recordings have units labelled ca3 and 19 have a ca3_channel flag, against the paper''s 25 CA3 recordings.'
- kind: metadata_error
  statement: The 36 units of sub-DT7 session 20170407-936um-1152um-merge have an empty region label.
- kind: other
  about: data
  statement: In three files less than half of the trial time is scored WAKE (DT2 3540um-1288um 20160227, 12.5%; DT5 20161014-1296um-1476um,
    20.3%; DT8 20170201-72um-432um, 31.6%), against 100% in the median file; either the sleep scoring or the trial times of
    these files are doubtful.
- kind: data_missing
  statement: The DT9 CA3 recordings (20170518, 20170519, 20170521, 20170525, 20170526) have no CA1 ripple table, although
    the paper detected SPW-Rs on a CA1 reference electrode for CA3 recordings; DT7 20170410 has 61 LS units but no LS HFO
    table, and DT2 20160215-122710 has 37 LS units and no event table at all.
- kind: other
  about: data
  statement: The deposited LS HFO detections (LSRipples) were made with parameters that differ from the paper's Methods (120-180
    Hz, durations up to 100 ms, peak thresholds of 4 to 6 SD in some files, against 120-200 Hz, 15-250 ms and 5 SD), and CA1Ripples
    with 130-200 Hz; the files' descriptions say so. Their event counts, durations and frequencies match the paper's (27014
    LS HFOs, 27.8 ms, 147.6 Hz).
- kind: methods_unavailable
  statement: 'Excess correlation (Figure 4B): how is each CCG normalized before smoothing? Raw counts make POST differ from
    PRE (rank-sum p 0.004); counts divided by the square root of the two spike counts do not (p 0.5 to 0.9). The normalized
    CCG was assumed. Which pairs passed inclusion (7172), given that the dataset yields 361 to 503 under the stated rule applied
    to HFO spikes, and 10159 to 15732 when it is applied to all spikes of each epoch?'
- kind: methods_unavailable
  statement: Which test and window show the suppression of LS firing after the HFO population burst (Figures 1C, 5F)? From
    the event stop to 50 ms no suppression is found; from 20 to 50 ms a marginal one depending on the random baseline. The
    window from the stop was assumed.
- kind: methods_unavailable
  statement: How was the absence of LS spike locking to individual SPW-R waves tested (no figure or method is given)? Inside
    CA1 ripples 7.2% of LS neurons are locked (binomial p = 0.012 against 5%); in the CA1 channel's high-power epochs 5.0%.
    Spikes inside ripples were assumed.
- kind: methods_unavailable
  statement: Where do the pre-behavior, behavior and post-behavior periods begin and end in each recording? The first trial's
    start and the last trial's stop were assumed as the boundaries.
- kind: methods_unavailable
  statement: Which amplitude does Figure 1H use? The deposited maximum NSS (peak_normed_power) shows no correlation with peak
    frequency (Pearson p = 0.96, Spearman p = 0.36); the maximum NSS recomputed with the Methods' filter shows a weak one
    (r = 0.081, p = 1.3e-38). The deposited value was assumed.
- kind: methods_unavailable
  statement: Is the Figure 5E inset fraction, and its P < 6.6e-6, taken over all HFOs pooled or over recordings? Pooled, NREM
    0.302 against WAKE 0.091 (p = 3.1e-171); over recordings 0.213 against 0.118 (p = 0.0025). The pooled reading was assumed.
- kind: metadata_insufficient
  statement: The electrode table holds no site positions, and the units table at most one waveform per unit (raw_waveform,
    32 samples, with max_waveform_channel, in the DT1, DT2 and DT8 files listed; no waveform in the DT5, DT7 and DT9 files).
    On the septal shank of the DT7 recordings the sites' region labels (ls, ms, acg, cc) alternate along the LFP's channel
    order, so the labels cannot be checked against the sites' geometry.
