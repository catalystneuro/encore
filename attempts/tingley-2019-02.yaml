- claim: fig1c-hfo-each-animal
  outcome: partially_reproduced
  notebook: reproduce_tingley_2019.ipynb
  output: claim:fig1c-hfo-each-animal
  notes: Median LS HFO frequency 142.9 to 149.2 Hz, inside 120-180 Hz in all 6 animals. The HFO-triggered LS spike
    probability exceeds the random-time mean by more than 3 SEM at the event bin in 4 of 6 animals (DT1, DT2, DT8,
    DT9) and over +-5 ms in 5 of 6 (all but DT5). Under the five seeds of the random times, 4, 4, 5, 4 and 5 animals
    at the event bin; the outcome is partial under all. Pooled over 2327 neurons, 0.0072 against 0.0016 spikes per
    ms per event.
  deviations:
  - Events are the lab's deposited detections (claims file, open detail i, reading a), LSRipples and CA1Ripples,
    whose stored parameters differ from the Methods (LS 120-180 Hz, durations up to 100 ms, peak thresholds of 4
    to 6 SD in some files; CA1 130-200 Hz).
  - The triggered histogram's 1 ms bins over +-100 ms and the comparison windows are those set in the claims file;
    the random times are uniform over each recording.
- claim: fig1c-post-burst-suppression
  outcome: not_reproduced
  notebook: reproduce_tingley_2019.ipynb
  output: claim:fig1c-post-burst-suppression
  assumed: true
  notes: From each event's stop to 50 ms after its time, the pooled probability is 0.001517 against 0.001593 at
    random times, a difference of 0.000076, less than 3 SEM (0.000201). From 20 to 50 ms after the event time it
    is 0.001399, below random by 0.000200, more than 3 SEM (0.000178) under the claim's seed; over the five seeds
    this reading gives suppression under 3 and none under 2, while the window from the stop gives none under all
    five. Per animal, only DT5 shows suppression, under both windows.
  deviations:
  - 'Assumed: the window from each event''s stop to 50 ms after its time, as the reading of the Results'' ''immediately
    following the population burst''. The paper gives no window or test; the claims file names this window and one
    from 20 to 50 ms, which differ in outcome.'
