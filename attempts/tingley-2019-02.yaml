- claim: fig1d-phase-locking
  outcome: partially_reproduced
  notebook: lfp_tingley_2019.ipynb
  output: claim:fig1d-phase-locking
  measured: 0.606
  notes: 'Detection channel, 120-200 Hz: 1209 of 1996 LS neurons with more than 50 spikes in high-power epochs are
    locked (60.6%; 52.0% of all 2327). Own shank''s channel: 883 of 1129 (78.2%). 120-180 Hz: 61.3%. All outside
    92.5% +- 9.25%. The null of 10 circular shifts gives 5.2%. Significant neurons prefer -167.0 degrees, 13.0 from
    the trough, Rayleigh over neurons p < 1e-300, so the trough preference holds. Per animal 39.3% (DT9) to 76.8%
    (DT1).'
  deviations:
  - The own-shank reading uses the middle site of the neuron's shank, and only for shanks whose sites share the
    detection channel's 16-channel storage block (1299 of 2327 neurons); reading other blocks would have multiplied
    the data streamed.
  - Filtering is zero-phase (forward and backward), a standard choice; the Rayleigh p-value is the CircStat approximation.
