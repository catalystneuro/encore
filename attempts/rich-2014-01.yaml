    question for the paper's authors (see findings).
  deviations:
  - Assumed reading P-a of a pass, as for figs6-few-field-cells-uniform; the readings give different
    outcomes.
  - Under K-b each surrogate draws rates from the fitted gamma, Poisson counts over 48 m and uniform
