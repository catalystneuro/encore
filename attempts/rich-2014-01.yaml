- claim: figs12-pairs-uncorrelated
  outcome: not_reproduced
  notebook: reproduce_rich_2014.ipynb
  output: claim:figs12-pairs-uncorrelated
  notes: Under P-a the mean correlation over 2556 to 2870 pairs is 0.0065, 0.0088 and 0.0281 at 48, 24
    and 6 bins, above the upper ends of the null's 95% interval (0.0056, 0.0078 and 0.0182), and the
    two-sample KS test differs there (p 0.0003, 0.0100 and 0.0008); at 12 bins neither test differs,
    and at 3 bins the mean is inside the interval but the KS test differs. P-b differs under both tests
    at 48, 24, 12 and 6 bins (means 0.0088 to 0.0307). The effect is small. Variants, not the paper's
    test. Pairs on different tetrodes give the same pattern (P-a outside the interval at 48, 24 and 6
    bins). Against a null that keeps each animal's field locations and reassigns its fields to cells,
    the observed mean lies inside the 95% interval at every scale under both readings, so the small
    positive correlation is consistent with what the uneven field density within each animal would
    give; this null does not show that the density causes it. The data
    set's fields differ at 48 and 6 bins under both readings.
  deviations:
  - The pooled null sample for the KS test (U-a) uses the first 200 of the 2000 shuffles of each
    animal, a standard subsample; U-b uses all 2000. U-a treats the overlapping pairs as independent,
    which overstates its significance; U-b does not, and it also differs.
