findings:
- kind: data_missing
  statement: The L-ratio and isolation distance fields of every unit's cluster metadata are NaN, in the
    unit's overall cluster info and in each epoch's own (PRE, RUN1, RUN2 and RUN3), and the data set
    holds only the spikes of the sorted units (no unclustered threshold crossings and no waveforms; the
    width and wave fields are empty), so the cluster quality analysis of Fig. S3 cannot be repeated and
    the waveform criterion for excluding interneurons cannot be checked.
- kind: data_missing
  statement: The scale model of the track (its vertices), which the paper uses for the track angle and
    corners of Fig. S10, is not in the data set; only the animal's room position is, from which the
    track can be reconstructed approximately.
- kind: metadata_insufficient
  statement: The readme gives no units. Linearized and room positions are in inches, open-field
    positions in camera pixels with a per-animal unitsPerCm, the speed column in inches per microsecond,
    and spike times in microseconds; the direction column is 180 for outbound travel. The direction code
    of the fields in fieldInfoC (1 inbound, 2 outbound, 3 both) is not described.
- kind: metadata_insufficient
  statement: The region of every unit of ANM228899 is N/A, so the localization of its tetrodes to CA1
    cannot be checked from the file.
- kind: other
  statement: The data set's rate maps and fields (rateMapInfoC, fieldInfoC) use 1 inch bins, where the
    Methods give 1 cm bins; its field edges and sizes are whole inches (sizes from 15.24 cm).
- kind: other
  statement: The section extents in sectExt give sections of about 3.7, 6.1, 11.5 and 26.9 m (track ends
    3.5, 9.6, 21.2 and 48.0 m), where the Methods give sections of 3, 7, 12 and 26 m (3, 10, 22 and 48
    m).
- kind: other
  statement: With the file's unitsPerCm the open-field positions span about 100 to 119 cm by 72 to 97 cm
    (1st to 99th percentile), where the Methods describe an oval of about 40 x 100 cm; either the scale
    or the description is off. One open-field session lasts 9.2 min, against 10 to 25 min in the
    Methods.
- kind: methods_unavailable
  statement: Question for the paper's authors. What counts as a pass through a field in the rule "at
    least 1 spike in at least 50% of passes through the field" (Methods, Place field determination)? A
    traversal that crosses the whole field in the direction considered (P-a), or any entry into the
    field while moving in that direction (P-b)? The data set's own pass counts lie between the two (mean
    6.03 passes per field against 4.97 and 8.28) and 23% of its fields have a pass starting inside the
    field. The readings give different outcomes for three claims (figs6-few-field-cells-uniform,
    fig3c-lomax-recruitment, figs11-no-boundary-remapping); P-a was assumed, as it recovers 842 of the
    data set's 887 fields against 787 for P-b.
- kind: metadata_insufficient
  statement: The data set's in-field rate (fieldInfoC inFieldRate) is not described. On the same field
    extents it averages 5.45 Hz, against 4.94 Hz for the mean of a recomputed smoothed rate map and
    5.39 Hz for spikes over occupancy in the field; for fields of both directions it is 6.45 Hz against
    5.18 and 5.25 Hz, so it is computed some other way there.
- kind: methods_unavailable
  statement: Question for the paper's authors. How were the corners of Fig. S10B defined (which vertices
    of the track model, and what change of direction counts as a corner)? The panel was tested with
    corners at 45 and 90 degrees of a reconstructed centreline, which give the same result.
- kind: methods_unavailable
  statement: Question for the paper's authors. How were the 300 environment sizes from 0.1 to 50 m of
    the active subset simulation (Fig. 4C, Methods, Active subset simulation) spaced, logarithmically or
    linearly, and what proportion of cells counts as distinguishing two environments? With the fitted
    parameters the gamma-Poisson model distinguishes a larger share of pairs than the fitted equal rate
    with linear spacing (0.923 against 0.780 above 0.2) and a smaller one with logarithmic spacing (0.679
    against 0.714), so the outcome of fig4c-active-subsets rests on the spacing. Logarithmic spacing was
    assumed; Fig. S18 draws the sizes on linear axes from 0 to 50 m, which supports linear spacing, and
    a change of outcome on that basis is proposed.
