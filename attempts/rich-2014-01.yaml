- claim: figs3-cluster-quality
  outcome: blocked
  blocked_by: data_missing
  notebook: reproduce_rich_2014.ipynb
  output: claim:figs3-cluster-quality
  notes: The L-ratio and isolation distance fields of the cluster metadata (clustInf.Lratio,
    clustInf.IsoD) are NaN for all 253 units, and the file holds only the spikes assigned to the
    sorted units, so the other threshold crossings of each tetrode that both measures compare a
    cluster with are not in the data set; csc_files.tar.gz holds one LFP channel per rat, not the
    tetrode channels. A proxy computed against the other sorted units of the same tetrode is shown in
    the notebook (Spearman with the number of fields, rho -0.157 for the L-ratio proxy, 213 units, and
    0.416 for the isolation distance proxy, 195 units, under F-a/P-a). It is not the paper's measure
    and decides nothing.
- claim: fig1-recruitment-by-section
  outcome: reproduced
  notebook: reproduce_rich_2014.ipynb
  output: claim:fig1-recruitment-by-section
  notes: Pooled over animals, cells with an earlier field formed a field in the new section in epochs 2,
    3 and 4 (28, 53 and 104 under P-a; 31, 55 and 97 under P-b), and cells without an earlier field
    formed their first (39, 34 and 38 under P-a; 31, 31 and 43 under P-b). Every animal has at least two
    cells of each kind in every epoch. The data set's fields give 38, 62 and 106, and 37, 31 and 39.
  deviations:
  - Fields are recomputed from spikes and position by the Methods (field set F-a); the paper's own
    detection code is not public. They number 791 (P-a) and 793 (P-b), against 887 in the data set's
    fieldInfoC, and match 81% of the data set's fields within 15 cm.
- claim: fig2-individual-poisson
  outcome: reproduced
  notebook: reproduce_rich_2014.ipynb
  output: claim:fig2-individual-poisson
  measured:
  - 57
  - 0
  notes: 57 cells (P-a) and 56 (P-b) have at least six fields, within 61 +/- 6.1 (per animal 16, 10, 3,
    11 and 17 under P-a). After Benjamini-Hochberg adjustment no cell is significant for locations or
    intervals under any of E-a, E-b, S-a and S-b. Before adjustment 5 (P-a) and 7 (P-b) location tests
    and at most 4 interval tests have p < 0.05. The data set's fields give 61 cells and none significant.
  deviations:
  - Anderson-Darling p-values come from Monte Carlo null distributions (20000 samples per test) of the
    A2 statistic, a standard choice; field locations are clipped to 0 to 48 m (the track starts at
    -0.25 to -0.10 m in the data).
