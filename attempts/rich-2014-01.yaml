- claim: fig3c-lomax-recruitment
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_rich_2014.ipynb
  output: claim:fig3c-lomax-recruitment
  measured: 0.060
  notes: Under P-a the KS statistic is 0.0600, outside 0.05 +/- 0.005, with p 0.271 (K-a) and 0.062
    (K-b). Under P-b it is 0.0537 with p 0.394 and 0.121, which the criterion counts as reproduced. The
    equal-rate Poisson curve lies far above the observed one at 48 m (0.966 against 0.640 under P-a),
    KS distance 0.336. The data set's fields give 0.0486, p 0.518 and 0.248. The tolerance of 0.005 is
    narrow against the spread of the statistic under the model (the verifier found a null median of
    0.049 and 95th percentile of 0.083), so the side of the tolerance a reading falls on carries
    little weight. The statistic also depends on the end allowance of P-a, 0.0532 (within tolerance,
    p 0.365 and 0.144) at 10 cm, 0.0598 to 0.0600 from 15 to 30 cm, and 0.0402 and 0.0396 at 0 cm and
