- claim: figs6-few-field-cells-uniform
  outcome: reproduced
  assumed: true
  notebook: reproduce_rich_2014.ipynb
  output: claim:figs6-few-field-cells-uniform
  notes: Under P-a no group of cells with 1 to 5 fields differs from uniform after adjustment (adjusted
    p 0.374 to 0.467). Under P-b the group with four fields has an adjusted p of 0.044 (22 cells,
    unadjusted 0.009), which the criterion counts as partially reproduced. The data set's fields give
    none (smallest adjusted p 0.188). No group has an adjusted p below 0.05 under any end allowance of
    P-a from none to 30 cm (smallest 0.152). The pass definition is a question for the paper's authors
    (see findings).
  deviations:
  - Assumed reading P-a of a pass (a run in one direction that crosses the whole field), as the
    readings P-a and P-b give different outcomes. The Methods say "passes through the field"
    (Materials and Methods, Place field determination). P-a recovers 842 of the data set's 887 fields
    against 787 for P-b, gives all five per-animal means of Fig. S7A within 10% against three for
    P-b, and its pass counts are closer to the data set's own (exact for 0.503 of 720
    single-direction fields against 0.392, mean absolute difference 1.16 against 2.25). The data
    set's rule matches neither reading exactly (0.232 of its fields have a pass starting inside the
    field).
