- claim: cell-counts
  outcome: reproduced
  notebook: reproduce_rich_2014.ipynb
  output: claim:cell-counts
  measured: 253
  notes: Keeping the units whose ID is at most 2 in every epoch (the readme's rule) leaves 63, 58, 24,
    57 and 51 cells in ANM00190422, ANM204878, ANM212379, ANM228899 and ANM228900, 253 in all, each
    equal to the paper's count in the paper's order. The 7 excluded units have ID NaN in every epoch.
- claim: figs3-cluster-quality
  outcome: blocked
  blocked_by: data_missing
  notebook: reproduce_rich_2014.ipynb
  output: claim:figs3-cluster-quality
  notes: The L-ratio and isolation distance fields of the cluster metadata (clustInf.Lratio,
    clustInf.IsoD) are NaN for all 253 units, both in each unit's overall cluster info (spAll) and in
    each epoch's own (spEpochSep, columns PRE, RUN1, RUN2 and RUN3, 0 of 253 units finite in every
    column). The file holds only the spikes assigned to the sorted units, so the other threshold
    crossings of each tetrode that both measures compare a cluster with are not in the data set;
    csc_files.tar.gz holds one LFP channel per rat, not the tetrode channels. A proxy computed
    against the other sorted units of the same tetrode is shown in the notebook (Spearman with the
    number of fields, rho -0.176 for the L-ratio proxy, 213 units, and 0.437 for the isolation
    distance proxy, 195 units, under F-a/P-a). It is not the paper's measure and decides nothing.
- claim: fig1-recruitment-by-section
  outcome: reproduced
  notebook: reproduce_rich_2014.ipynb
  output: claim:fig1-recruitment-by-section
  notes: Pooled over animals, cells with an earlier field formed a field in the new section in epochs 2,
    3 and 4 (36, 63 and 107 under P-a; 31, 55 and 97 under P-b), and cells without an earlier field
    formed their first (38, 29 and 36 under P-a; 31, 31 and 43 under P-b). Every animal has at least one
    cell of each kind in every epoch. The data set's fields give 38, 62 and 106, and 37, 31 and 39.
  deviations:
  - Fields are recomputed from spikes and position by the Methods (field set F-a); the paper's own
    detection code is not public. They number 852 (P-a) and 793 (P-b), against 887 in the data set's
    fieldInfoC, and a recomputed field overlaps 842 (P-a) and 787 (P-b) of the data set's fields. The
    45 data set fields that P-a misses fail its pass rule (29) or its 15 cm width (16); 1 inch bins,
    as the data set's maps use, give the same count (852 fields, 840 overlapped).
  - Under P-a an edge of a field within 20 cm of either end of the positions visited in its novel
    section counts as reached when the run gets within 20 cm of that end, a standard choice (two
    smoothing SDs). A run cannot cross beyond the end of a section, so without it P-a dropped every
    field at a section end (791 fields, none at an end, against 852 with 72 at an end).
- claim: fig2-individual-poisson
  outcome: reproduced
  notebook: reproduce_rich_2014.ipynb
  output: claim:fig2-individual-poisson
  measured:
  - 62
  - 0
  notes: 62 cells (P-a) and 56 (P-b) have at least six fields, within 61 +/- 6.1 (per animal 17, 11, 3,
    13 and 18 under P-a). After Benjamini-Hochberg adjustment no cell is significant for locations or
    intervals under any of E-a, E-b, S-a and S-b. Before adjustment 7 location tests (both readings)
    and at most 7 interval tests have p < 0.05. The data set's fields give 61 cells, one significant
    under S-a and none under S-b.
  deviations:
  - Anderson-Darling p-values come from Monte Carlo null distributions (20000 samples per test) of the
    A2 statistic, a standard choice; field locations are clipped to 0 to 48 m (the track starts at
    -0.25 to -0.10 m in the data).
