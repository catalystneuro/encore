outcomes:
- claim: link-somatic-cells
  outcome: partially_reproduced
  notes: All 12 groups hold the paper's n (123 cells). Over 20 to 300 pA, 73.2% of cells match a row of the paper's
    table exactly and 85.4% within 3 spikes in total (criterion 80% and 95%; partial at 50% exact). 97.8% of exact
    matches fall on the row at the cell's position in date and cell order. Exact matches are lowest in dSPN on-state
    (40%) and on-state with sulpiride (57%); the largest misses are 20 and 24 spikes. The rheobase equals the first
    step with a spike in the matched row for 97.8% of exact matches and 87.8% of all cells.
  notebook: reproduce_zhai_2025.ipynb
  output: claim:link-somatic-cells
  deviations:
  - Groups come from the files' condition column; the claims file names a condition_subfolder column, which this
    version of the dandiset does not have.
  - A step recorded twice keeps its first sweep (the paper's script does not say); 14 of 123 cells have a repeated
    step.
- claim: link-dendritic-cells
  outcome: reproduced
  notes: The count of cells with an index equals the paper's n in 8 of 10 groups; iSPN on-state (9 against 10) and
    CDGI KO off-state (10 against 11) each lack a cell imaged at one dendritic site only, at two spots. Over 90
    matched cells the index differs from the paper's by a median of 2.8% of its value; 83.7% are within 10%. The
    Figure 6D identifiers line up with the files' cell numbers (letter c is cell 3), with median differences of
    3.5% and 6.4%.
  notebook: reproduce_zhai_2025.ipynb
  output: claim:link-dendritic-cells
  deviations:
  - Groups come from the files' condition column; the claims file names a condition_subfolder column, which this
    version of the dandiset does not have.
  - The claims file's 'letter a, b, c for the first, second and third cell of the day' is read as cell number 1,
    2, 3; the 6D identifiers include c for days with cells 1 and 3 only.
  - Rows outside Figure 6D are aligned with every cell that has line scans, in date and cell order, so that a cell
    without a pair keeps its place.
- claim: link-sr-cells
  outcome: partially_reproduced
  notes: All 33 dandiset cells match a paper identifier (date and letter, the letter read as cell number) and all
    33 paper cells are in the dandiset. At 5 SD the per-cell mean amplitude is within 25% of the paper's for 90.9%
    of cells, the event count for 42.4%, both for 39.4% (criterion 75%); the detector finds a median 1.33 times
    the paper's events (1.50 at 4 SD, 2.14 at 3 SD). The paper's per-cell amplitude equals the median of its own
    event list for all 33 cells, and its event lists hold frequency x 3.6 s events (10 sweeps of 360 ms), while
    two dandiset cells have 11 and 12 sweeps, all of which are used here.
  notebook: reproduce_zhai_2025.ipynb
  output: claim:link-sr-cells
  deviations:
  - Sr2+-oEPSC events come from a stand-in for TaroTools (lid.detect_events), with a 1 ms running mean, the noise
    SD before the flash, and events whose threshold crossing falls 40 to 400 ms after the flash at more than 5 SD
    (Methods, Data acquisition and statistical analysis); the smoothing, noise window, local baseline and 3 ms event
    separation are assumptions, as the paper used TaroTools with visual verification and gives no parameters.
  - The paper's event count is taken as its frequency times 3.6 s, which equals the length of its event lists.
  assumed: true
- claim: link-grab-rois
  outcome: not_reproduced
  notes: The counts per group are the paper's (13 unlesioned, 10 6-OHDA, 11 off-state regions). 16 of 34 dandiset
    regions match a paper region within 0.05 for every treatment, short of half, and 10 paper regions are the best
    match of more than one dandiset region; the median of the largest per-treatment difference is 0.052. No identifier
    links regions, the ROI here is the Methods' 50 um circle on the stored movies where the paper used the region
    Prairie View saved, and one region takes Fmax from the other region of its slice; these may explain the gaps.
    The group comparisons of the Figure 5F claims do not use the match.
  notebook: reproduce_zhai_2025.ipynb
  output: claim:link-grab-rois
  deviations:
  - The criterion matches 'each mouse'; this version holds several regions per mouse, so each region, the unit of
    the paper's table, is matched.
  - One region (2024-04-02 Slice1Roi2) has no acetylcholine trial; its Fmax is the mean of the other region of its
    slice, an assumption the paper does not cover. One region (2024-05-24 Slice1Roi1) has no TTX trial; its Fmin
    is the quinpirole baseline, as the Methods allow.
