  about: data
  statement: The somatic spike counts of 33 of 123 cells, computed from the files with the paper's rule (upward crossings
    of 0 mV), do not equal any row of the paper's per-cell table over 20 to 300 pA; 18 differ by more than 3 spikes,
    up to 24. Exact agreement is lowest in dSPN on-state (6 of 15) and iSPN on-state with sulpiride (4 of 7).
