  about: data
  statement: The AIM sheets of the Figure 8 mice differ from the paper's table in most sessions (session totals equal
    in 6% of control and 16% of CDGI knockout sessions), mice 4123, 4124 and 5871 are not in the paper, and 7741, 7742,
    7744, 2346 and 2347 of the paper are missing, as the dandiset description states. The Figure 10 sheets match the
    paper in 103 of 105 sessions.
