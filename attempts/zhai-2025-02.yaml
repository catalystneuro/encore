findings:
- kind: data_missing
  statement: The confocal images of sparsely labelled iSPNs behind Figure 4I to 4K are not in the dandiset, and
    its description, which lists what is not included, does not mention them. The paper's raw-data archive on Zenodo
    (doi:10.5281/zenodo.17260198) lists them.
- kind: data_missing
  statement: 'Two cells with dendritic line scans were imaged at one dendritic site only, at two spots: 2016-05-26
    cell 3 (CDGI knockout, off-state, Distal1 Spot1 and Spot2) and 2016-06-08 cell 1 (on-state, Proximal1 Spot1
    and Spot2). They have no proximal-distal pair and no index, while the paper counts them in Figures 3F and 7F
    (10 and 11 cells).'
- kind: other
  about: data
  statement: The somatic spike counts of 33 of 123 cells, computed from the files with the paper's rule (upward
    crossings of 0 mV), do not equal any row of the paper's per-cell table over 20 to 300 pA; 18 differ by more
    than 3 spikes, up to 24. Exact agreement is lowest in dSPN on-state (6 of 15) and iSPN on-state with sulpiride
    (4 of 7).
- kind: other
  about: data
  statement: The AIM sheets of the Figure 8 mice differ from the paper's table in most sessions (session totals
    equal in 6% of control and 16% of CDGI knockout sessions), mice 4123, 4124 and 5871 are not in the paper, and
    7741, 7742, 7744, 2346 and 2347 of the paper are missing, as the dandiset description states. The Figure 10
    sheets match the paper in 103 of 105 sessions.
- kind: other
  about: data
  statement: Mouse 7830 (Figure 10, control) has identical AIM sheets for sessions 4 and 5; the paper's table has
    the same values for both sessions.
- kind: metadata_insufficient
  statement: Subjects are defined per recording day. Mouse counts differ from the paper's legends in four groups
    (Sr2+-oEPSC dSPN and iSPN off-state, 3 subjects against 4 mice; M1R CRISPR control and deletion somatic cells,
    2 and 3 against 3 and 4), which mice sharing a recording day would explain; the files do not say which mouse
    each cell came from.
- kind: metadata_insufficient
  statement: The GRAB-ACh3.0 regions and the paper's ROIs share no identifier, so the per-region areas cannot be
    linked one by one; matching by values pairs 16 of 34 regions within 0.05. One region (2024-04-02 Slice1Roi2)
    has no acetylcholine trial for Fmax and one (2024-05-24 Slice1Roi1) has no TTX trial.
- kind: other
  about: data
  statement: Two Sr2+-oEPSC cells hold more sweeps than the paper's frequencies imply (2023-02-22 cell 1, 12 sweeps;
    2023-04-06 cell 1, 11 sweeps; the paper's event lists equal frequency x 10 sweeps of 360 ms), and the files
    do not say which sweeps the paper used.
- kind: other
  about: paper
  statement: The per-cell Sr2+-oEPSC amplitudes of Figures 2H and 4G, labelled average amplitude in the paper's
    tables, equal the median of each cell's event list in the Figure 2G and 4F sheets for all 33 cells and the mean
    for none.
- kind: methods_unavailable
  statement: The Sr2+-oEPSC events were detected with TaroTools in Igor Pro, followed by visual verification, with
    a threshold of five SD above the noise; the paper gives no filter, noise window, baseline or event separation,
    and does not say whether events were removed at verification. Which settings were used? A stand-in detector
    finds a median 1.33 times the paper's events at 5 SD, though the state comparisons agree.
- kind: selection_undocumented
  about: data
  statement: The control and 6-OHDA patch-clamp recordings of Figures 1 and 3, the rotation counts and the open-field
    data are not in the dandiset, as its description says; the claims on them can be tested only on the paper's
    tables.
