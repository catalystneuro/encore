  statement: Subjects are defined per recording day. Mouse counts differ from the paper's legends in four groups (Sr2+-oEPSC
    dSPN and iSPN off-state, 3 subjects against 4 mice; M1R CRISPR control and deletion somatic cells, 2 and 3 against
    3 and 4), which mice sharing a recording day would explain; the files do not say which mouse each cell came from.
