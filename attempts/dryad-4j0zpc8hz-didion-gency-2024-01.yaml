  measured:
  - -1.078
  - -2.296
  notes: Slopes of bud swelling on Tspring, monoculture trees 2020 and 2021, -1.078 days per degree in
    beech and -2.296 in oak, both within tolerance; P1 p = 0.00011 and 1.2e-08, P2 (8 treatment-year means)
    p = 0.033 and 0.010. The slopes are equal under P1 and P2 because every treatment-year has six trees.
  deviations:
