findings:
- kind: metadata_error
  statement: Metadata.csv and the README sheet give the treatment codes as C, W, MR and WMR; the Treatment
    column holds C, D, H and HD. The Warming and Soil moisture reduction columns map them one to one (H
    is W, D is MR, HD is WMR).
- kind: other
  statement: The 'Total Data' sheet has 35 rows that repeat another row exactly (trees 17, 35, 45 and
    144; tree 35 has 24 rows in place of 9), and tree 144 has two rows for campaign 5 of 2020 with different
    sugar (7.71 and 6.69 %) and starch (4.99 and 9.99 %) values.
- kind: other
  statement: Starch (77 tree-campaign rows, down to -6.28 %), sugar (3, down to -4.06 %) and Asat (5,
    down to -0.29) have negative values, which a concentration or a light-saturated assimilation rate
    cannot have; the paper takes their square root.
- kind: metadata_error
  statement: 'Growth_length (''growing season length'') never equals onset of senescence minus bud swelling
    (Senes_10 - Flush_S1), the Methods'' definition: it is a median 55 days longer, and 2 to 33 days longer
    than the end of senescence (Senes_10 + Senes_time) minus bud swelling. Its definition is not given.'
- kind: metadata_error
  statement: Diameter_growth is labelled cm, but its values (median 0.42, up to 4.46 a year) on stems
    of 5.2 to 6.1 mm at planting (Table S4) are consistent with mm.
- kind: data_missing
  statement: The soil moisture (Mspring, Mfall, Mannual), the chamber climate records (air temperature,
    relative humidity, VPD, soil temperature and water content at 10 min) and the initial heights and
    diameters (Table S4) are not deposited; five claims rest on them.
- kind: metadata_insufficient
  statement: Tspring, Tfall and Tannual are one value per treatment and year (the same in the four chambers
    of a treatment), and the sensor height (50 cm or 2 m) they come from is not stated; GDD and Chill_days
    are given per tree without the records they were computed from, and the GDD description does not say
    whether the excess over 5 C or the daily mean is summed.
- kind: other
  statement: Four compartments (6 in chambers A3, A4, B3 and B4) hold a beech monoculture tree and an
    oak mixture tree, which the design (a compartment holds a monoculture or a mixture) does not allow.
- kind: other
  statement: AGB_growth (estimated AGWB increment) is exactly 0 in 57 of 191 tree-years of 2020 and 2021,
    whose median height increment is 5 cm, and is never negative; how it was bounded is not described.
- kind: other
  statement: Refitting the paper's treatment model on the dataset with marginal F tests gives Supplemental
    Table S1's F values for oak AGWB increment exactly and for beech Asat within 0.25, which links the
    deposited table to the paper's analysis; other traits match less closely.
