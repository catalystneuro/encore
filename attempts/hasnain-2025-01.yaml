- claim: fig4f-medulla-null-not-spanning-alm
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_hasnain_2025.ipynb
  output: claim:fig4f-medulla-null-not-spanning-alm
  notes: Test-set UMAP of 300 ALM and 340 medulla units (reading G1). 25.7% of ALM units have no medulla unit among
    their 10 nearest neighbours, against 0.1% with the region labels shuffled over all units and 0.1% with them
    shuffled within each session (21.3 to 27.3% over the five seeds), and 6 of the 26 grid cells that hold ALM units
    hold no medulla unit, so ALM holds patterns without a medulla counterpart, as the paper reports, and this is
    not clumping by session. The criterion's second part holds only in part. No medulla grid cell (0 of 20) lies
    outside the cells that hold ALM units, but only 59.4% of medulla units have an ALM neighbour (99.7% with labels
    shuffled within session; 58.2 to 62.6% over seeds). The medulla of sub-460436_ses-20200109 has d_null = 1 and
    its units spread along one line; without that session (claim seed plus 1) 21.0% of ALM units have no medulla
    neighbour, 16 of 57 ALM cells hold no medulla unit and 26 of 67 medulla cells lie outside the ALM cells. The
    judgment rests on these counts and the plots. The embedding depends on the last digits of its inputs, which
    differ between processors' linear algebra kernels, and an earlier execution on another runner gave 33.3% (23.3
    to 33.3% over seeds), 3 of 28 ALM cells without a medulla unit, 2 of 27 medulla cells outside the ALM cells,
    57.4% of medulla units with an ALM neighbour (57.4 to 65.9%), and without the session 20.1%, 20 of 62 and 20
    of 62. Both executions give the same judgment.
  deviations:
  - umap-learn with the Methods' parameters stands in for MATLAB's run_umap (claims, M10); the neighbour and grid
    counts are this attempt's description of the embedding, the paper judges by inspection.
  - Units pooled over the 5 G1 sessions (assumed); subspaces from the main reading.
findings:
- kind: other
  about: data
  severity: major
  statement: With the dataset's own CCF labels and `classification`, the paper's selection (at least 30 good units
    in each region) gives 5 ALM and medulla sessions from 4 mice, with 300 ALM and 340 medullary reticular units,
    where the paper reports 16 sessions (or 11 from 7 mice) with 604 and 724 units; and 17 bilateral ALM sessions
    from 9 mice where the paper reports 20 from 10. With `unit_quality` and CCF labels transferred by electrode
    coordinates from the nearest classified unit it gives 19 ALM and medulla sessions from 7 mice with 1501 and
    1745 units, and 31 bilateral sessions. No reading of the files recovers the paper's selection.
- kind: metadata_insufficient
  severity: minor
  statement: The units' CCF annotation (`anno_name`) is filled only for units whose `classification` is good (69453
    of 272227 units); the others have an empty label and only the probe's target region, though the electrodes table
    holds each electrode's CCF coordinates (x, y, z). The column description does not say this.
- kind: metadata_insufficient
  severity: minor
  statement: Units carry two quality labels, `unit_quality` (good or multi, no description) and `classification`
    (good or unlabelled), with no statement of how they differ; 1852 units have no `classification` value.
- kind: metadata_insufficient
  severity: minor
  statement: The jaw, nose and tongue tracking are stored with unit 'a.u.'; the values are pixel positions of the
    side camera (about 294 Hz, one segment per trial) and a likelihood.
- kind: other
  about: data
  severity: none
  statement: The spike, video and trial clocks agree in all 22 selected sessions. The tongue becomes visible a median
    56 to 262 ms after the go cue, lick direction is decoded from spike counts after the go cue well above shuffled
    labels, and jaw and nose speed rises at the go cue. The units of the session compared are the same in versions
    0.230822.0128 and 0.231012.2129.
- kind: paper_inconsistency
  statement: The paper gives two counts for the ALM and medulla sessions of the MAP data (16 sessions in the Results
    and the Figure 4 statistics, 11 sessions from 7 mice in the Methods), two counts for the bilateral ALM units
    (1116 in the Results, 2016 in the Methods), and two decoding windows (the previous 40 ms in the Results, t and
    8 preceding 5 ms bins, 45 ms, in the Methods).
- kind: methods_unavailable
  statement: Cross-region decoding (Figure 4d). With ridge lambda = 0.01 and the source projections at t and 8 preceding
    bins of 20 ms-smoothed rates, the predictors are nearly collinear and held-out R2 is far below zero on these
    data, falling with the number of predictors per training trial. Was lambda applied to standardized predictors,
    was R2 computed on held-out single trials at each bin and over which variance (the across-trial variance at
    each bin or over the whole span), and were trials or bins pooled before the fit?
- kind: methods_unavailable
  statement: Movement and stationary bins in the MAP data (Figure 4c to f). How was the hand-set threshold placed,
    were the keypoints smoothed before taking velocity, and do supra-threshold runs shorter than 100 ms count as
    moving? The medulla null against potent result here holds only when they count as moving.
- kind: methods_unavailable
  statement: MAP trials and units. Were photostimulation, early-lick and ignore trials used, and the trials with
    a 1.8 s or 0.3 s delay? Is the 'good' label of the selection the `classification` or the `unit_quality` column,
    with CCF regions assigned to which units? Here Figure 4c (ALM) is reproduced and Figure 4e is reproduced under
    N2 with `unit_quality`, and neither with `classification`.
- kind: methods_unavailable
  statement: Variance explained and dimensionality (Figure 4c, e). Which covariance and which d normalise the variance
    explained of each subspace (the reported null and potent values add to the total, which the Methods' formula
    does not give), and which measure of dimensionality, at which scale, does Figure 4e use?
- kind: methods_unavailable
  statement: The baseline z-score (Methods, Subspace identification) divides by the baseline s.d. across trials;
    for MAP units with near-silent baselines this gives values up to 278 s.d. among units classified good and above
    50000 among units with `unit_quality` good. Were such units excluded, or was a floor applied?
- kind: metadata_insufficient
  severity: minor
  statement: The trial table has no column for the delay duration. In the ALM and medulla sessions and the 2021
    bilateral sessions used here, 13 to 57 correct and error trials per session (446 over 22 sessions) have a 1.8
    s or 0.3 s delay in place of 1.2 s, which shows only in the sample and delay event times (`sample_start_times`,
    `delay_start_times`).
