- claim: map-session-selection
  outcome: not_reproduced
  notebook: reproduce_hasnain_2025.ipynb
  output: claim:map-session-selection
  measured:
  - 17
  - 858
  - 1001
  - 300
  - 340
  notes: Reading G1 of 'good' (`classification`), units with a CCF label of MOs on a probe described as targeting
    ALM, or of IRN, GRN or PARN, and sessions with at least 30 such units in each region, gives 17 bilateral ALM
    sessions from 9 mice (paper 20 from 10), with 858 right and 1001 left ALM units (paper 961 and 1055; the left
    count is within tolerance, the right is not), and 5 ALM and medulla sessions from 4 mice (paper 16 in the Results,
    11 from 7 mice in the Methods), with 300 ALM and 340 medulla units (paper 604 and 724). Only units classified
    good carry a CCF label, but the electrodes table gives each electrode's CCF coordinates, and among units classified
    good the nearest other such unit on the probe has the same label for 97.3% of units. With labels transferred
    that way (within 20 um), reading G2 (`unit_quality` good) gives 31 bilateral sessions from 12 mice (2767 and
    2830 units) and 19 ALM and medulla sessions from 7 mice (1501 and 1745 units); within 0 um 28 and 13 sessions,
    within 40 um 35 and 22; reading U2 (all units) gives 44 and 28 sessions. No reading gives the session counts
    together with the unit counts, so the claim is not reproduced. With 20 good units (G1) as the threshold there
    are 31 bilateral and 14 ALM and medulla sessions, with 25 there are 26 and 9.
  deviations:
  - The claims file's U1 is applied with `classification` as the 'good' label (G1), the only label whose units carry
    a CCF annotation. G2 (`unit_quality` good) and U2 (all units) are formed by giving each unit the CCF label of
    the nearest unit classified good on the same probe, by electrode coordinates, within 20 um (assumed; 0 and 40
    um shown).
  - G1 is the main reading for every Figure 4 claim (assumed). Its bilateral unit counts are near the paper's, where
    G2's are 2.7 to 2.9 times them, and the paper's 'classified as good' names the `classification` column.
  assumed: true
- claim: fig4b-medulla-selectivity
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_hasnain_2025.ipynb
  output: claim:fig4b-medulla-selectivity
  measured:
  - 32.4
  - 49.1
  - 85.9
  notes: 340 medulla units of the 5 G1 ALM and medulla sessions, correct trials, 54 to 136 trials per side per session.
    Under E1 with the Bonferroni threshold (p < 0.01) 32.4% are selective in the sample epoch, 49.1% in the delay
    epoch and 85.9% in the response epoch (paper 7, 21 and 49%). Under E1 the order holds (response highest, sample
    lowest) for every seed and both thresholds, so the claim is partially reproduced; under E2 the early delay sub-epoch
    (30.3%) falls below the sample epoch (32.4%). No reading puts a value within tolerance (E2 sub-epochs 30.3 to
    66.8%; uncorrected p < 0.05 higher still). Over the five seeds E1 Bonferroni gives 30.9 to 32.9%, 47.9 to 51.5%
    and 85.0 to 85.9%. By session the sample value runs from 1.7 to 54.8%. The share of right trials changes over
    the session (0.13 to 0.73 by fifth in one session), but with labels shuffled only within blocks of 30 trials
    the values are 30.3, 47.9 and 85.9%, so slow drift does not explain them. Under reading G2 (1745 units, 19 sessions)
    the values are 16.7, 28.3 and 63.4% (16.6 to 17.6, 27.7 to 28.7 and 63.4 to 63.9 over the seeds), also partially
    reproduced.
  deviations:
  - Ignore, photostimulation and early-lick trials are left out, and so are trials whose sample cue does not start
    1.85 s before the go cue (a 1.8 s or 0.3 s delay; 446 correct and error trials over the 22 sessions), as the
    epochs assume the paper's 1.2 s delay (assumed; the paper does not say how MAP's photostimulation, early-lick
    and other-delay trials were treated).
  - Epoch rates are the means of the smoothed 5 ms rates (Methods, "Identifying selective neurons"), not z-scored.
  - Units of reading G1 (map-session-selection); G2 is shown in the second notebook.
- claim: fig4c-alm-null-potent-similar
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_hasnain_2025.ipynb
  output: claim:fig4c-alm-null-potent-similar
  measured:
  - 51.3
  - 79.6
  notes: 5 G1 sessions, 40 to 85 ALM units each. Under the main reading (W1, B1, D1, baseline z-score) the paired
    t test of null against potent variance finds no difference (V1 51.3 against 79.6%, p = 0.086; V2 23.2 against
    36.9%, p = 0.125; V3 70.5 against 87.7%, p = 0.194), nor under W2 or D2, but no reading of M3 to M6 puts both
    means within tolerance, so the absence holds and the values do not, a partial reproduction. Under B2 the test
    finds potent above null (V1 p = 0.040, V2 p = 0.029), with means out of tolerance, which the criterion does
    not count against the claim. The z-score of example.m, a variant in the claims file, puts both V2 means within
    tolerance (30.2 against 29.0%) and there the test finds a difference (p = 0.028); were the variant a reading,
    the claim would be not reproduced. With 5 sessions the test has little power; the main-reading V1 difference
    is 28.3 points. Over the five seeds the main-reading V1 p is 0.079 to 0.086, the B2 V1 p 0.040. Under reading
    G2 (19 sessions) the main reading with V2 gives 33.9 against 42.7%, p = 0.251 (0.249 to 0.261 over the seeds),
    which the criterion counts as reproduced; the outcome rests on G1. G1 is held fixed for every outcome while the
    readings of M3 to M6 and the seeds are searched for one under which a claim holds; read the same way under G2,
    this claim would be reproduced. An earlier execution on a runner with other linear algebra kernels gave, under
    G2, 34.1 against 42.9%, p = 0.251 (0.251 to 0.266 over the seeds). Movement-null dimensions are 5 to 10, potent
    4 to 9; 30 to 50% of bins are moving, mostly in the response epoch (51 to 82% of its bins, 1 to 25% of baseline
    bins).
  deviations:
  - 5 sessions where the paper has 16 (map-session-selection, reading G1, assumed); reading G2 shown in the second
    notebook. The selection is held at G1 while the other readings are searched, an asymmetry between the
    selection and the readings of M3 to M6, and under G2 this claim holds.
  - The movement threshold is Otsu's threshold on log10 speed, a standard choice for the value between the two modes
    that the paper set by hand; the keypoint positions are first smoothed with a Gaussian of 3 frames, as unsmoothed
    tracking jitter makes the speed histogram unimodal.
  - Ignore, photostimulation, early-lick and other-delay trials are left out (assumed).
  - The dimensions come from 100 shuffles of every 4th 5 ms bin, where the paper uses 1000 shuffles, to fit the
    time limit.
  - The readings W2, B2, D2 and the example.m z-score were each run with the others at the main reading, not in
    every combination.
  - The total covariance C of the variance explained is taken over the bins with tracking (no more than 0.1% of
    bins lack it).
