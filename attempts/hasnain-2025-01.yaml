- claim: map-session-selection
  outcome: not_reproduced
  notebook: reproduce_hasnain_2025.ipynb
  output: claim:map-session-selection
  measured:
  - 17
  - 858
  - 1001
  - 300
  - 340
  notes: Units classified good (`classification`) with a CCF label of MOs on a probe described as
    targeting ALM, or of IRN, GRN or PARN; sessions with at least 30 such units in each region. This
    gives 17 bilateral ALM sessions from 9 mice (paper 20 from 10), with 858 right and 1001 left ALM
    units (paper 961 and 1055; the left count is within tolerance, the right is not), and 5 ALM and
    medulla sessions from 4 mice (paper 16 in the Results, 11 from 7 mice in the Methods), with 300
    ALM and 340 medulla units (paper 604 and 724). The session counts match neither reading, so the
    claim is not reproduced. Reading U2 (all units of a region) cannot be formed, as only good units
    carry a CCF label; all units on the region's probes give 3668 medulla-probe units in the 5
    sessions and 18784 ALM-probe units in the 17 bilateral sessions, far above the paper's counts.
    With 20 good units as the threshold there are 31 bilateral and 14 ALM and medulla sessions, with
    25 there are 26 and 9. The dataset holds 60 sessions with probes in both ALMs (18 mice) and 36
    with an ALM and a medulla probe (8 mice).
  deviations:
  - The claims file's U1 is applied with `classification` as the 'good' label, the only label whose
    units carry a CCF annotation; `unit_quality` also has a value 'good' but its units have no CCF
    label unless `classification` is good.
- claim: fig4b-medulla-selectivity
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_hasnain_2025.ipynb
  output: claim:fig4b-medulla-selectivity
  measured:
  - 34.1
  - 52.9
  - 86.5
  notes: 340 medulla units of the 5 ALM and medulla sessions, correct trials, 60 to 157 trials per side
    per session. Under E1 with the Bonferroni threshold (p < 0.01) 34.1% are selective in the sample
    epoch, 52.9% in the delay epoch and 86.5% in the response epoch (paper 7, 21 and 49%). The order
    holds (response highest, sample lowest) under every reading and seed, so the claim is partially
    reproduced; no reading puts a value within tolerance (E2 sub-epochs 31.2 to 67.4%; uncorrected
    p < 0.05 higher still). Over the five seeds E1 Bonferroni gives 31.8 to 34.7%, 51.5 to 52.9% and
    85.9 to 87.1%. By session the sample value runs from 1.7% to 48.4%. The selection holds fewer
    sessions and units than the paper's (map-session-selection), so the units differ from the paper's.
  deviations:
  - Ignore, photostimulation and early-lick trials are left out (assumed; the paper does not say how
    MAP's photostimulation and early-lick trials were treated).
  - Epoch rates are the means of the smoothed 5 ms rates (Methods, "Identifying selective neurons"),
    not z-scored.
- claim: fig4c-alm-null-potent-similar
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_hasnain_2025.ipynb
  output: claim:fig4c-alm-null-potent-similar
  measured:
  - 54.5
  - 77.3
  notes: 5 sessions, 40 to 85 ALM units each. Under the main reading (W1, B1, D1, baseline z-score) the
    paired t test of null against potent variance finds no difference (V1 54.5 against 77.3%,
    p = 0.126; V2 24.0 against 34.1%, p = 0.181; V3 73.8 against 86.0%, p = 0.245), nor under W2 or D2,
    but no reading of M3 to M6 puts both means within tolerance, so the absence holds and the values do
    not, a partial reproduction. Under B2 the test finds potent above null (V1 43.9 against 84.9%,
    p = 0.024; V2 p = 0.023), with means out of tolerance, which the criterion does not count against
    the claim. The z-score of example.m, a variant in the claims file, matches in full under V2 (30.7
    against 29.1%, p = 0.119). With 5 sessions the test has little power; the main-reading V1
    difference is 22.8 points. Over the five seeds the main-reading V1 p is 0.099 to 0.126, the B2 V1
    p 0.023 to 0.027. Movement-null dimensions are 4 to 11, potent 4 to 9; 30 to 50% of bins are
    moving.
  deviations:
  - 5 sessions where the paper has 16 (map-session-selection).
  - The movement threshold is Otsu's threshold on log10 speed, a standard choice for the value between
    the two modes that the paper set by hand; the keypoint positions are first smoothed with a Gaussian
    of 3 frames, as unsmoothed tracking jitter makes the speed histogram unimodal.
  - Ignore, photostimulation and early-lick trials are left out (assumed).
  - The dimensions come from 100 shuffles of every 4th 5 ms bin, where the paper uses 1000 shuffles, to
    fit the time limit.
  - The readings W2, B2, D2 and the example.m z-score were each run with the others at the main
    reading, not in every combination.
- claim: fig4c-medulla-null-smaller
  outcome: reproduced
  assumed: true
  notebook: reproduce_hasnain_2025.ipynb
  output: claim:fig4c-medulla-null-smaller
  measured:
  - 28.5
  - 51.2
  notes: Reproduced under reading B2 (supra-threshold runs shorter than 100 ms counted as moving) with
    V2, as the criterion accepts any one reading. There the medulla null subspace explains 28.5% and the
    potent 51.2% (tolerances 26.4 +- 3.9 and 44.8 +- 7.12), paired t p = 0.0097 over 5 sessions, the same
    under the five seeds; V1 gives p = 0.0025 with the potent mean (85.3%) out of tolerance. Under the
    main reading B1 the difference is not significant (V1 54.6 against 66.9%, p = 0.445; V2 34.0
    against 41.6%, p = 0.380), nor under W2 or D2; the example.m z-score gives V2 p = 0.042 with the
    null mean (31.5%) out of tolerance. The outcome therefore rests on B2, which the paper does not
    settle; under B2 the ALM difference is also significant (fig4c-alm-null-potent-similar). 31 to 128
    medulla units per session.
  deviations:
  - The outcome rests on reading B2 of M4 and V2 of M6, which the paper leaves open (asked of the
    authors under findings).
  - 5 sessions where the paper has 16; the threshold, trial and shuffle deviations of
    fig4c-alm-null-potent-similar apply.
- claim: fig4d-alm-predicts-medulla-null
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_hasnain_2025.ipynb
  output: claim:fig4d-alm-predicts-medulla-null
  measured:
  - -228.5
  - -4585.2
  notes: With lambda = 0.01, as the Methods give it, held-out R2 is far below zero under every reading
    (T1 or T2, R1 or R2, standardized or not), from -228.5 to -149.8% for ALM to medulla (5 sessions)
    and from -7333 to -2712% for ALM to ALM (A1, 17 sessions), against 40 and 54%; the values given as
    measured are T1, unstandardized, R1. It stays negative under the five seeds. The nine lagged copies
    of the smoothed projections are nearly collinear (condition number 1e6 in one bin), so the fit
    barely regularized overfits the training trials. As variants with larger penalties, standardized
    and pooled, R2 is at most 21.3% (ALM to medulla, lambda 100), with ALM to ALM at 5.8%, below ALM
    to medulla, the reverse of the paper.
  deviations:
  - Subspaces from the main reading only; the bilateral sessions are 17, not 20.
  - Larger penalties are shown as variants only; the claim's lambda decides the outcome.
