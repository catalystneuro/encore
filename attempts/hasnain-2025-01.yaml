- claim: fig4d-alm-predicts-medulla-null
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_hasnain_2025.ipynb
  output: claim:fig4d-alm-predicts-medulla-null
  measured:
  - -497.1
  - -4271.6
  notes: 'With lambda = 0.01, as the Methods give it, held-out R2 is far below zero under every reading (T1 or T2,
    R1 or R2, standardized or not), from -611.5 to -249.1% for ALM to medulla (5 sessions) and from -6098.6 to -2191.3%
    for ALM to ALM (A1, 17 sessions), against 40 and 54%; the values given as measured are T1, unstandardized, R1.
    It stays negative under the five seeds. The negative values are not due to the averaging or the denominator:
    the median over bins is -364.9 to -178.8% (ALM to medulla) and the R2 over the whole span, which keeps the time-locked
    variance, -320.8 to -120.3%. Nor do they come mainly from the heavy tails of the baseline z-score: with the
    example.m z-score (largest |z| 24 to 124 in the bilateral sessions, against 37 to 278) ALM to medulla falls
    to -1828.9 to -1512.9%. Over the 44 session and direction pairs the R2 falls with the number of predictors per
    training trial (Spearman correlation -0.61) more than with the source''s largest |z| (-0.24), and it is above
    zero in 3 of 44 pairs, all with 0.24 predictors per trial or fewer: with up to 1.24 predictors per training
    trial (T1), a nearly unpenalized per-bin fit overfits. As variants with larger penalties, standardized and pooled,
    R2 is at most 16.6% (ALM to medulla, lambda 100), with ALM to ALM at 6.9%, below ALM to medulla, the reverse
    of the paper. The decoder amplifies differences in the last digits of the subspaces, which depend on the processor''s
    linear algebra kernels: an earlier execution on another runner gave ALM to ALM -6039.6 to -2188.1%, the median
    over bins -364.1 to -178.8% and the span R2 -320.5 to -120.3% (ALM to medulla), and example.m -1829.2 to -1512.9%,
    with the same outcome.'
  deviations:
  - Subspaces from the main reading and reading G1; the bilateral sessions are 17, not 20.
  - Larger penalties, the R2 over the whole span, the median over bins and the example.m z-score are shown as variants;
    the claim's lambda and the per-bin R2 of M8 decide the outcome.
