- claim: fig4e-medulla-null-lower-dimension
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_hasnain_2025.ipynb
  output: claim:fig4e-medulla-null-lower-dimension
  notes: N1 (shuffle dimension of the stationary activity) is 6.8 in the medulla and 7.4 in ALM, p = 0.646,
    lower in 2 of 5 sessions; 0.577 to 0.646 over the five seeds, and p = 0.077 to 0.646 under the other
    readings of M3 to M5 (under B2 the medulla is higher, 10.0 against 8.0). N2 (participation ratio of
