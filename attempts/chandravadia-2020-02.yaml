    files' diagnosis text equals the table's for 40 of 59 subjects; the others use coarser terms.
- claim: task-structure
  outcome: partially_reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:task-structure
  notes: All 87 sessions have 100 recognition trials with 50 of each label and 5 categories. 79 have
    100 encoding trials with 100 distinct image files (and 100 distinct stored images); 7 Huntington
    sessions (18, 20, 21, 23, 26, 27, 44) have 50 encoding trials and session 123 has 97. Each file
    stores one image per trial.
- claim: new-old-label-coding
  outcome: not_reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:new-old-label-coding
  notes: Under the stated coding test 1 holds in 0 of 87 sessions and test 2 in 1 of 87. No label-0
    recognition image (compared by stored pixels and by file name, which agree) is in the session's
    encoding block, while label-1 images are, all of them in 79 sessions, 49 of 50 in session 123 and
    26 to 29 of 50 in the seven sessions with 50 encoding trials. Label-1 trials draw "old" responses
    in 69% of trials on average against 27% for label 0, more in 86 of 87 sessions; the exception is
    session 2005 (T98, AUC 0.445). Both tests hold with the labels reversed in 86 of 87 sessions, so
    the labels are 1 for old and 0 for new, as the paper's code reads them. With the stated coding the
    mean behavioural AUC would be 0.247.
- claim: ttl-codes
  outcome: partially_reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:ttl-codes
  notes: In all 87 files events and experiment_ids have the same length and the same timestamps. 78
    files hold only the codes of Table 1; 9 also hold 0, 4, 22, 23, 98 or 99. Over all files 17019 of
    17047 trials follow 1, 2, 3, response, 6; the 28 that do not are in 7 of the 9 files with extra
    codes. All parts hold in 78 of 87 files. Seven files have no start marker (55); every file has 66.
- claim: experiment-ids
  outcome: partially_reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:experiment-ids
  notes: In 83 of 87 files the learning id is in {80, 83, 88} and the recognition id in {81, 84, 89},
    as one of Table 2's pairs. Four files use 82 (CS33_77 81/82, CS39_100 and H51_105 82/83, H42_55
    80/82); their data_collection field states the same ids. The learning block is the id whose events
    hold the encoding answers 20 and 21.
- claim: session-dates
  outcome: partially_reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:session-dates
  notes: 86 of 87 session_start_time values fall on the first of a month; H28_48 is 2010-03-13. H44_68
    is dated 2000-01-01, six years before any other session (the Huntington sessions run from 2006 to
    2016 and its neighbours H43 and H47 are 2013 and 2014), so the year looks like a placeholder.
- claim: units-table
  outcome: partially_reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:units-table
  measured: 98400
  notes: Every file holds spike_times, the two waveform columns, origClusterID, SNR, electrodes and the
    isolation distance, the last under the name IsolationDist (its description is "IsolDist"). All 1864
    units link to exactly one electrode, the waveforms (256 samples, finite for every unit) are stated
    as sampled at 98.4 kHz, within tolerance of 100 kHz. SNR is not finite for 86 units (75 NaN, 11
    infinite, all infinite ones in H28_48) and isolation distance is NaN for 493 units in 82 files, with
    two values above 1e27.
  deviations:
  - The column the paper calls IsolDist is named IsolationDist in the files and was counted as present.
- claim: electrodes-table
  outcome: not_reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:electrodes-table
  notes: Every file has the columns location, x, y, z, imp, filtering, group and origChannel. Location,
    filtering ("300-3000Hz") and origChannel have a value for all 887 electrodes and the MNI coordinates
    for 788 (missing in 8 files), but the impedance is NaN for all 887 electrodes, which the criterion
    calls not reproduced.
- claim: isi-criterion
  outcome: partially_reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:isi-criterion
  measured: 99.7
  notes: With spike times sorted, 1858 of 1864 units (99.7%) have fewer than 3% of interspike intervals
    below 3 ms (median 0.19%). Of the six others, two (H27_58 units 35 and 37) hold every spike time
    twice, stored as two copies one after the other, which gives 50% short intervals once sorted; with
    each spike time once they are at 0%, and four units remain at 3.0% to 9.0% (CS54_126 units 6 and 7,
    CS26_66 unit 2, CS54_124 unit 2). With the spike times as stored, 1860 units are below 3%. 13 units
    store spike times out of time order.
  deviations:
  - The value given as measured is the percentage of units below 3%, the quantity the criterion
    thresholds.
- claim: fig5a-mtl-locations
  outcome: reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:fig5a-mtl-locations
  notes: The electrode of every unit is in the right amygdala (594 units), left amygdala (498), right
    hippocampus (407) or left hippocampus (365).
