- claim: isi-criterion
  outcome: partially_reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:isi-criterion
  measured: 99.7
  notes: With spike times sorted, 1858 of 1864 units (99.7%) have fewer than 3% of interspike intervals
    below 3 ms (median 0.19%). Of the six others, two (H27_58 units 35 and 37) hold every spike time
    twice, stored as two copies one after the other, which gives 50% short intervals once sorted; with
    each spike time once they are at 0%, and four units remain at 3.0% to 9.0% (CS54_126 units 6 and 7,
    CS26_66 unit 2, CS54_124 unit 2). With the spike times as stored, 1860 units are below 3%. 13 units
    store spike times out of time order.
  deviations:
  - The value given as measured is the percentage of units below 3%, the quantity the criterion
    thresholds.
