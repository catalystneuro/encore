- claim: fig3-example-vs-neuron
  outcome: blocked
  blocked_by: other
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:fig3-example-vs-neuron
  notes: The figure's neuron cannot be identified. No file and no row of Online-only Table 1 has a
    session 144. The only units on a channel 140 in the dandiset are units 1 and 2 of session 2009
    (T103, 3 units), in the right hippocampus; unit 2, the third unit of the session, is category
    selective (ANOVA p = 1.3e-09) with its highest rate for phones (9.1 Hz against 1.7 to 2.7 Hz). It fits
    the figure's channel, area, cell number counted from 1 and preferred category, but not its session
    id, so it is shown and does not decide the claim. Whether neuron 144-140-3-RH is this unit is a
    question for the paper's authors.
findings:
- kind: metadata_error
  statement: The new_old_labels_recog column is coded 1 for old (seen during encoding) and 0 for new, the
    reverse of its description in every file ("0 == Old Stimuli") and of the paper's Data Records. In
    all 87 sessions no label-0 recognition image is among the session's encoding images while label-1
    images are, and label-1 trials draw more "old" responses in 86 of 87 sessions. The paper's analysis
    code reads 1 as old, so its results are unaffected; a user who follows the description inverts the
    behaviour (mean AUC 0.25 instead of 0.75).
- kind: data_missing
  statement: Eight sessions lack encoding trials. Seven Huntington sessions (18, 20, 21, 23, 26, 27 and
    44) hold 50 encoding trials and session 123 holds 97, against 100 in the paper. In the seven, 21 to
    24 of the 50 images labelled old in the recognition block are not among the file's encoding images
    (they are in the encoding blocks of other sessions of the same variant), so the encoding trials that
    showed them are not in the file.
- kind: other
  about: data
  statement: 66 spike trains are deposited in two files each, sessions 38 and 39 (11 units), 43 and 44
    (23) and 54 and 55 (32), with nothing marking them as the same units. Each pair was recorded on one
    day, and each file holds spike trains spanning both sessions. Sessions 54 and 55 also share their
    encoding trials (one learning block followed by two recognition blocks). Counting units per file
    gives 1864, counting them once 1798.
- kind: format_error
  statement: Spike times are not in increasing order in 13 units. Two units of session 58 (H27_58 units
    35 and 37) hold every spike time twice, as two copies one after the other, which doubles their spike
    counts and makes half their sorted interspike intervals zero.
- kind: metadata_error
  statement: Subject age or sex differ from Online-only Table 1, and from Faraut et al. 2018 Table 1,
    for three subjects. C24 (P24CS) is 57 in the files and 47 in both tables, H33 (P33HMH) 30 and 29, and
    H48 (P48HMH) is a 32-year-old female in the files and a 54-year-old male in both tables. The
    diagnosis is coded more coarsely than in the paper for 19 subjects.
- kind: metadata_error
  statement: session_start_time is not on the first of the month for session 48 (H28, 2010-03-13), and
    session 68 (H44) is dated 2000-01-01, six years before any other session of the archive's files and
    out of order with the subjects recorded before and after it (2013 and 2014). In 38 files the trial,
    event and spike times are Unix seconds, while timestamps_reference_time is set to the session's
    start date, so the stated reference does not apply to them.
- kind: data_missing
  statement: The electrode impedance (imp) is NaN for all 887 electrodes in all 87 files, and the MNI
    coordinates (x, y, z) are NaN for 99 electrodes in 8 files, although the paper says the electrodes
    table gives each electrode's coordinates and impedance.
- kind: metadata_error
  statement: Spike sorting quality metrics are missing or invalid for many units. SNR is NaN for 75 units
    and infinite for 11 (session 48), and the isolation distance is NaN for 493 of 1864 units in 82
    files, with two values above 1e27. The isolation distance column is named IsolationDist, not IsolDist
    as in the paper.
- kind: metadata_insufficient
  statement: Nine files hold event codes that Table 1 of the paper and the events description do not
    define (0, 4, 22, 23, 98, 99), and in 7 of them 28 trials break the documented order 1, 2, 3,
    response, 6; in 4 of these files the response read three events after stimulus onset, as the
    paper's code does, differs from response_value for 1 to 6 trials. Seven files have no start marker
    (55). In the encoding phase response_value holds 0 or 1, not the event codes 20 and 21 the paper
    refers to.
- kind: metadata_error
  statement: Four files label a block with experiment id 82 (CS33_77 81/82, CS39_100 82/83, H51_105
    82/83, H42_55 80/82), which Table 2 of the paper does not list; the paper says each session has one
    of the pairs (80, 81), (83, 84) or (88, 89). The institution field misspells Huntington Memorial
    Hospital in two ways ("Hunigton" in 28 files, "Hunington" in 6).
- kind: code_mismatch
  statement: The paper's Methods select VS and MS cells in a 1 s window starting 200 ms after stimulus
    onset and compare the 50 novel with the 50 familiar trials. The published code (single_neuron.py,
    NWB_singleCellAnalysis_release.m) uses 0.2 to 1.7 s and, for MS cells, correct trials only. On the
    dandiset the code's choices give the paper's 343 VS, 146 MS and 25 dual cells (26 in the paper), and
    the Methods' choices give 332, 118 and 13. The reported MS and dual counts rest on the code's
    procedure.
- kind: paper_inconsistency
  statement: The Methods say patients were recorded across 89 sessions, while Online-only Table 1 and the
    dandiset hold 87.
- kind: paper_inconsistency
  statement: The neuron of Figure 3, 144-140-3-RH, names a session 144 that is not in Online-only Table
    1 nor in the dandiset. The only channel-140 units in the dandiset are in session 2009 (T103, right
    hippocampus), whose third unit is phone selective (ANOVA p = 1.3e-09). The authors could say whether
    the figure shows this unit.
