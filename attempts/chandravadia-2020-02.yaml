- claim: fig5c-auc-all
  outcome: reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:fig5c-auc-all
  measured:
  - 0.753
  - 0.094
  notes: Mean AUC over 87 sessions 0.753, standard deviation 0.094 (range 0.445 to 0.919). The confidence response
    (response_value minus 30) equals the TTL 31 to 36 codes in every file. With label 0 taken as old, as the paper's
    text states, the mean AUC would be 0.247. Leaving out the two sessions whose every unit repeats another file
    gives 0.752 and 0.094.
- claim: fig5c-auc-sites
  outcome: reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:fig5c-auc-sites
  measured:
  - 0.76
  - 0.688
  - 0.085
  - 0.138
  notes: CS (78 sessions) 0.760 with SD 0.085; TWH (9 sessions) 0.688 with SD 0.138. All four values are within
    tolerance. Welch's t-test between sites t = 1.53, p = 0.161, difference 0.072.
- claim: fig5b-roc-asymmetric
  outcome: reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:fig5b-roc-asymmetric
  notes: Mean z-ROC slope over 82 sessions 0.782 (SD 0.300, median 0.791), below 1 in 65 of 82; one-sample t-test
    against 1 t = -6.58, p = 4.3e-09. Wilcoxon signed-rank p = 2e-08; the pooled ROC has slope 0.816. By site, CS
    0.773 (74 sessions, p = 1.6e-08) and TWH 0.861 (8 sessions, p = 0.14).
  deviations:
  - Five sessions (CS24_60, CS39_93, H48_99, CS51_119, T100_2008) whose five interior false alarm rates are all
    equal have no regression slope and were left out; the claims file does not say how such sessions are treated.
    This is a standard choice that cannot change the outcome at p = 4e-09.
- claim: fig5d-confidence-accuracy
  outcome: reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:fig5d-confidence-accuracy
  notes: 'Reading (a), the fixed split, 84 sessions (3 left out for an empty group; CS39_93, H48_99, T100_2008):
    high 80.1% against low 60.9%, high above low in 73, paired t = 10.16, p = 3.2e-16. Reading (b), the Python dynamic
    split, 82 sessions: 78.2% against 60.8%, p = 1.3e-11. The unpaired Welch tests (p = 4.4e-17 and 8.3e-14), the
    code''s inclusion rule (73 sessions, p = 1.3e-20 and 2.4e-13) and the MATLAB dynamic split (p = 1.2e-13) also
    give p below 0.001. By site under (a), CS 81.1% against 61.0% (p = 7e-16) and TWH 70.7% against 60.3% (8 sessions,
    p = 0.14).'
