- claim: fig5b-roc-asymmetric
  outcome: reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:fig5b-roc-asymmetric
  measured: 0.782
  notes: Mean z-ROC slope over 82 sessions 0.782 (SD 0.300, median 0.791), below 1 with t = -6.58,
    p = 4.3e-09; 65 of 82 slopes are below 1. Wilcoxon signed-rank against 1 p = 2e-08; the slope of the
    pooled ROC is 0.816.
  deviations:
  - Five sessions (CS24_60, CS39_93, H48_99, CS51_119, T100_2008) have fewer than two distinct false
    alarm rates among the five interior points, so no regression slope, and are left out; the paper's
    code would regress on a constant predictor there.
- claim: fig5d-confidence-accuracy
  outcome: reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:fig5d-confidence-accuracy
  notes: (a) Fixed split, 84 sessions (3 without responses in one group left out), high 80.1% and low
    60.9% correct, paired t = 10.16, p = 3.2e-16, high above low in 73 sessions. (b) Dynamic split of
    the Python code, 82 sessions (5 left out), 78.2% and 60.8%, p = 1.3e-11. The unpaired test and the
    inclusion rule of plotFigure5.ipynb (73 sessions) give the same. In the 8 TWH sessions alone the
    difference has the same sign without significance (p = 0.14 and 0.26).
  deviations:
  - The dynamic split is the Python helper.dynamic_split as written, which in its split mode 1 counts
    low-confidence hits as response 4 only (the MATLAB NO_dynamic_lowHighSplit.m counts 4 and 5).
- claim: vs-cells-proportion
  outcome: reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:vs-cells-proportion
  measured:
  - 332
  - 17.8
  notes: In the Methods' window (0.2 to 1.2 s), 332 of 1864 units (17.8%) are VS; 6 units with all rates
    equal have no ANOVA p and are counted as not selected. Variants, the code's window 343 (18.4%), the
    paper's numbers; duplicated spike trains once 321 of 1798 (17.9%); categories shuffled within
    session 76 (4.1%). By session the VS share has median 15.4%; 5 of 59 subjects have no VS unit.
- claim: ms-cells-proportion
  outcome: not_reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:ms-cells-proportion
  measured:
  - 118
  - 6.3
  notes: With all 50 new and 50 old trials in the Methods' window, 118 of 1864 units (6.3%) are MS, below
    146 ± 14.6 (7.8 ± 0.78%); five other seeds give 108 to 115, and labels shuffled within session give
    92 (4.9%). The code's choices (correct trials only, 0.2 to 1.7 s, as in single_neuron.py ms_test and
