  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:ms-cells-proportion
  measured:
  - 110
  - 5.9
  notes: 'Under the criterion''s method (Methods'' window, all 50 and 50 trials, bootstrap of bootstrapMeanEqualTest.m)
    110 of 1864 units (5.90%) are MS cells, below the tolerance of 146 +/- 14.6; four other seeds give 109 to 111,
