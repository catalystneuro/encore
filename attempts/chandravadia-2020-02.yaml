findings:
- kind: metadata_error
  statement: new_old_labels_recog is described in the files, and in the paper, as 0 for old and 1 for new stimuli,
    but the data use the reverse. In all 87 sessions the label 1 recognition trials show images from the session's
    encoding block and the label 0 trials never do, and in 86 of 87 sessions label 1 trials receive more old responses.
    The paper's analysis code treats 1 as old; a user following the description would obtain a mean behavioural
    AUC of 0.25 in place of 0.75.
- kind: data_missing
  statement: The impedance column (imp) of the electrodes table is NaN for all 887 electrodes in all 87 files, although
    the paper lists impedance among the electrode information. The MNI coordinates (x, y, z) are missing for 99
    electrodes in 8 files.
- kind: data_missing
  statement: Eight sessions hold fewer than the 100 encoding trials the paper describes. The trial tables of H14_18,
    H15_20, H15_21, H16_23, H18_26, H19_27 and H23_44 hold 50 encoding trials (150 trials, and 150 stimulus images),
    and only about half of their old recognition images are among them; CS53_123 holds 97, and its event stream
    starts in the middle of a trial.
- kind: other
  about: data
  statement: Units are deposited in two files without saying so. Sessions 54 and 55 (H42) hold the same 32 spike
    trains, sessions 43 and 44 (H23) the same 23, and sessions 38 and 39 (H21) share 11 of their 20 and 18 units.
    In each pair the shared spike trains span the trials of both sessions, so they are the same neurons recorded
    continuously through two consecutive sessions; sessions 54 and 55 also share their encoding block (identical
    trials) and differ in the recognition block. 66 unit rows repeat another file's spike train; counted once, the
    dataset holds 1798 distinct spike trains. Nothing in the files marks these units as the same.
- kind: format_error
  statement: The spike times of 13 units are not stored in increasing order (H15_21 unit 9, H27_58 units 35 to 38,
    CS29_70 units 18, 25 and 27, CS31_73 unit 3, CS33_77 units 3 and 21, H44_68 unit 9, CS56_128 unit 2).
- kind: metadata_error
  statement: The unit quality metrics are incomplete or implausible. IsolationDist (the paper's IsolDist) is NaN
    for 493 of 1864 units and SNR for 75, SNR is infinite for 11 units, and two isolation distances exceed 1e6 (up
    to 8.1e32). Two units of H27_58 have half of their interspike intervals below 3 ms, and 6 units in all break
    the paper's 3% refractory criterion.
- kind: metadata_error
  statement: The event streams of 9 files hold TTL codes that Table 1 and the events description do not define (0,
    4, 22, 23, 98, 99), and in T88_2001, T88_2002 and T90_2003 some trials have a second question-screen code (3)
    before the stimulus offset (2). Seven files have no start-of-experiment marker (55) and T88_2001 has three end
    markers (66).
- kind: metadata_error
  statement: Four files use experiment ids outside Table 2 of the paper (CS33_77 81 and 82; CS39_100 and H51_105
    82 and 83; H42_55 80 and 82), so an id of 81, 82 or 83 can mark either block. The ids do not follow the task
    variant as the paper's Table 2 pairs suggest (most variant 3 sessions use 80 and 81).
- kind: metadata_error
  statement: Two session dates break the paper's rule of the first of the month and the recording span. H28_48 is
    dated 2010-03-13, and H44_68 is dated 2000-01-01, six years before any other session.
- kind: metadata_error
  statement: Subject metadata disagree with the paper's Online-only Table 1 and with Faraut et al. (2018). H48 is
    a 32-year-old female in the file and a 54-year-old male in both papers (32 F is C48's entry), C24 is 57 against
    47, and H33 is 30 against 29.
- kind: data_missing
  statement: Session 98 of subject H48, listed in the earlier release (Faraut et al. 2018, Table 1), is not in the
    dandiset, and session 144, whose neuron 144-140-3-RH is the example of Figure 3, is not in the dandiset either.
- kind: other
  about: data
  statement: The 23 sessions added since the earlier release hold 325 unit rows, where the paper states 288 added
    neurons, and the 64 sessions shared with that release hold 1539, where it stated 1576. The files hold 1864 unit
    rows against the paper's 1863.
- kind: code_mismatch
  statement: The paper's Methods select MS cells by comparing all 50 novel and 50 familiar trials in a 1 s window
    from 200 ms after onset, and VS cells in the same window; the paper's code (single_neuron.py and NWB_singleCellAnalysis_release.m
    at commit 1d95162) uses 200 to 1700 ms and, for MS cells, correctly answered trials only. On the dandiset the
    code's choices give the paper's numbers (343 VS, 147 MS, 26 dual cells, and every percentage of Figure 5f),
    while the Methods' give 332 VS, 110 MS and 12 dual cells.
- kind: paper_inconsistency
  statement: The Methods state that patients were recorded across 89 sessions, while Online-only Table 1 lists 87,
    as the dandiset holds.
