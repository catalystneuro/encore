outcomes:
- claim: counts-neurons-subjects
  outcome: reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:counts-neurons-subjects
  measured:
  - 1864
  - 59
  notes: Reading (a), every unit row of every file, gives 1864 neurons, one more than 1863, and the files hold 59
    distinct subject_id values. Reading (b), with the 66 spike trains deposited in two files counted once, gives
    1798, also within tolerance. Units per subject range from 1 to 123.
- claim: counts-sessions
  outcome: reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:counts-sessions
  measured: 87
  notes: The 87 (subject, session id) pairs of the file identifiers are exactly the 87 pairs of Online-only Table
    1, read from the Europe PMC full text. The Methods' 89 is 2 more than either.
  deviations:
  - The identifiers label Cedars-Sinai subjects CS24 and so on, where the table writes C24; the labels were mapped
    by this spelling difference.
- claim: table1-demographics
  outcome: partially_reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:table1-demographics
  measured:
  - 26
  - 33
  notes: 56 of 59 subjects match the table in both age and sex. C24 is 57 in the files against 47 in the table,
    H33 30 against 29, and H48 is 32 and female in the files against 54 and male in the table (32 F is the table's
    entry for C48). The files count 26 female and 33 male subjects, the table 25 and 34; both counts are within
    tolerance. The diagnosis text differs in wording for 19 of 59 subjects, as the files use a coarser coding.
- claim: task-structure
  outcome: partially_reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:task-structure
  notes: 79 of 87 sessions meet every part. All 87 have 100 recognition trials with 50 of each label and 5 categories.
    The encoding part fails in 8 sessions, whose trial tables hold 50 encoding trials (H14_18, H15_20, H15_21, H16_23,
    H18_26, H19_27, H23_44) or 97 (CS53_123); no image file repeats within any encoding block. Each part holds in
    more than half of the sessions.
- claim: new-old-label-coding
  outcome: not_reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:new-old-label-coding
  notes: The coding is the reverse of the statement. Under the stated coding (0 = old) both tests hold in 0 of 87
    sessions. With the labels reversed, label 1 images are in the encoding block in all 87 sessions (all of them
    in 79; 52 to 58% in the 7 sessions whose table holds 50 encoding trials, 98% in CS53_123) and label 0 images
    in none, and label 1 trials receive more old responses in 86 of 87 (median 0.70 against 0.24; T98_2005 is the
    exception, 0.68 against 0.72, AUC 0.445). Both tests hold reversed in 86 of 87 sessions. The paper's code also
    treats 1 as old.
- claim: ttl-codes
  outcome: partially_reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:ttl-codes
  notes: In all 87 files events and experiment_ids have the same length and timestamps, and every file has one stimulus
    onset per trial. 78 files meet the whole criterion. Nine files (H23_43, H27_58, CS39_93, CS53_123, CS55_127,
    CS56_128, T88_2001, T88_2002, T90_2003) hold codes outside Table 1 (99 three times, 23 six times, 0 twice, 98,
    22 and 4 once each), and 30 of 17047 trials, all in those files, break the sequence; in T88_2001, T88_2002 and
    T90_2003 a second 3 comes before the 2, and CS53_123 starts in the middle of a trial (its first events are 21
    and 6). Seven files have no 55 marker and T88_2001 has three 66 markers, which the criterion does not test.
  deviations:
  - A trial's events were taken as those from its stimulus onset (1) to the next onset, with the experiment markers
    55 and 66 set aside; the claims file does not say how trials are cut from the stream. Cutting at the trial table's
    start and end times gives more failures, from 55 and 66 markers and next-trial onsets that share a timestamp
    with a trial's end; this was seen while preparing and is not in the notebook.
- claim: experiment-ids
  outcome: partially_reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:experiment-ids
  notes: In 83 of 87 files the learning and recognition ids fall in the stated sets, and all 83 use one of Table
    2's pairs (80 and 81 in 65 files, 83 and 84 in 14, 88 and 89 in 4). CS33_77 uses 81 and 82, CS39_100 and H51_105
    82 and 83, and H42_55 80 and 82; their data_collection fields state these ids. The ids do not follow the task
    variant; 7 of 20 variant 2 and 18 of 25 variant 3 sessions use 80 and 81.
  deviations:
  - Each block's id was read at the TTL-1 events of its trials (learning or recognition by stim_phase), a standard
    choice; every file has exactly two ids.
- claim: session-dates
  outcome: partially_reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:session-dates
  notes: 86 of 87 files have a session_start_time on the first of a month; H28_48 is dated 2010-03-13. H44_68 is
    dated 2000-01-01, six years before any other file (the others span 2006 to 2019), so its year looks like a default.
- claim: units-table
  outcome: partially_reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:units-table
  measured: 98400
  notes: Every file holds the columns, with IsolDist named IsolationDist (described as 'IsolDist'); every one of
    the 1864 units links to exactly one electrode; the stated waveform sampling rate is 98400 Hz, within tolerance.
    The quality metrics are not finite for every unit. IsolationDist is NaN for 493 units and SNR for 75, SNR is
    infinite for 11, and 2 isolation distances exceed 1e6 (up to 8.1e32); 568 units in 84 files have a non-finite
    metric. The waveforms are finite.
  deviations:
  - The column named IsolationDist is taken as the paper's IsolDist; the names differ only in spelling.
- claim: electrodes-table
  outcome: not_reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:electrodes-table
  notes: The impedance column (imp) is NaN for all 887 electrodes of all 87 files, so one column is empty for every
    electrode. Location, filtering (300-3000Hz) and origChannel are filled for every electrode; the MNI coordinates
    are missing for 99 electrodes in 8 files.
- claim: isi-criterion
  outcome: partially_reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:isi-criterion
  notes: With spike times sorted, 1858 of 1864 units (99.68%) have fewer than 3% of interspike intervals below 3
    ms; 6 do not (CS26_66 unit 2 at 6.5%, CS54_126 units 6 and 7 at 9.0% and 3.8%, CS54_124 unit 2 at 3.0%, and
    H27_58 units 35 and 37 at 50%). This is at least 95%. The median fraction is 0.19%. As stored, 1860 units fall
    below 3%; the spike times of 13 units are not in time order.
- claim: fig5a-mtl-locations
  outcome: reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:fig5a-mtl-locations
