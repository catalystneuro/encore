    the 87 of Online-only Table 1 (Cedars-Sinai labels are written CS24 in the identifiers and C24 in
    the table). The Methods' 89 differs from the file count by 2.
- claim: table1-demographics
  outcome: partially_reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:table1-demographics
  measured:
  - 26
  - 33
  notes: Age and sex match Online-only Table 1 for 56 of 59 subjects. C24 is 57 in the files and 47 in
    the table, H33 is 30 and 29, and H48 is female and 32 in the files, male and 54 in the table. So the
    files hold 26 female and 33 male subjects, against the table's 25 and 34 (both within tolerance).
