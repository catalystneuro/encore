inputs:
- what: Procedures and parameters, no data. The behaviour variables (FicTrac dRotLabY and dRotLabZ,
    Savitzky-Golay 25 frames order 3, clipping into forward, left and right, the 4.5 mm ball radius),
    the walking state, the pooled Pearson correlation and its Bonferroni threshold, the ridge alpha
    grid and its selection, the time shifts of the cross-correlation filters, and the GCaMP6f kernel
    and deconvolution. From the paper's analysis code (correlation_analysis.py, linear_filters.py,
    pca.py, pca_fit_behavior_models.py, deconvolution.py, neural_histograms.py).
  source: https://github.com/ClandininLab/brezovec_volition_2023 at commit
    8e2b275f1a95947212eacd3e511915039ffc5df4
- what: How the files were made (FicTrac given uniform timestamps from 0 because synchronisation data
    were missing; the processed file brain_zscored_green_high_pass_masked_warped_to_FDA.nii). Read, not
    used in the analysis. The draft of the dandiset links this repository.
  source: https://github.com/catalystneuro/clandinin-lab-to-nwb at commit
    f083b0900f9acb154ca6c3e9f5de65f305a97df0
outcomes:
- claim: dataset-structure
  outcome: reproduced
  notebook: reproduce_brezovec_2022.ipynb
  output: claim:dataset-structure
  measured:
  - 9
  - 30456
  - 1.8797
  - 1605632
  - 50
  notes: Nine flies, one session each, 3384 volumes per fly (30,456 in all) at 1.8797 Hz, 1,605,632
    voxels of 2.61 x 2.61 x 5 um per raw volume, 30.0 minutes per session, FicTrac 90,000 frames at
    50 Hz. The subject ids match the nine flies of the paper's code.
- claim: fig2c-fraction-correlated
  outcome: partially_reproduced
  notebook: reproduce_brezovec_2022.ipynb
  output: claim:fig2c-fraction-correlated
  measured: 31.1
  notes: Reading (a), single voxels at p < 1e-4, gives 31.1% of the 191,119 in-brain voxels of the 12
    planes, below 35.1 to 42.9% and above 19.5%. Reading (b), 6 x 6 blocks at p < 1e-8, gives 54.9%,
    above the band. With behaviour sampled at the start of each volume in place of its midpoint,
    reading (a) gives 39.2%, so the value depends on the neural times, which the dandiset does not
    hold. The fraction is 0.0 to 7.5% in the outermost planes and 21.0 to 39.1% in the others.
    Within single flies 2.4 to 19.7% of voxels pass the threshold for 3384 points. Almost no voxel
    is negatively correlated (at most 0.01% per component).
  deviations:
  - Processed volumes in the Functional Drosophila Atlas, not the paper's mean brain; 12 of 91 planes.
  - Behaviour sampled at the midpoint of each volume, as the dandiset has no per-plane times; the
    paper used each plane's acquisition time.
  - Blocks of 6 x 6 voxels in place of the paper's Ward supervoxels for reading (b).
  - In-brain voxels are those inside the brain in all nine flies; with voxels inside in any fly the
    fraction is 20.3%.
- claim: fig2c-venn-categories
  outcome: partially_reproduced
  notebook: reproduce_brezovec_2022.ipynb
  output: claim:fig2c-venn-categories
  measured:
  - 11.9
  - 15.9
  - 3.2
  - 11.5
  notes: Under reading (a), VF only 11.9% (expected 15), VF and turning 15.9% (20), turning only 3.2%
    (4), and 11.5% of correlated voxels correlated with all three (10). None is within its
    tolerance; the ranking holds and fewer than 20% of correlated voxels correlate with all three,
    so most show a tuning preference, as the statement says. Under reading (b) VF and turning is
    40.4% and all three 32.2%. With behaviour at the start of each volume, reading (a) gives 11.6,
    24.1, 3.5 and 25.7%.
  deviations:
  - As for fig2c-fraction-correlated.
- claim: fig2-symmetry
  outcome: reproduced
  notebook: reproduce_brezovec_2022.ipynb
  output: claim:fig2-symmetry
  notes: The VF map correlates with its mirror image at r = 0.823. The VL map correlates with the
    mirrored VR map at 0.672 and with its own mirror at 0.449. Voxels significant for VL are 2.38
    times as many in image half A (x < 157) as in half B, and voxels significant for VR 3.2 times as
    many in half B. Per fly, the VF mirror correlation is 0.166 to 0.580, summed VL correlation is
    larger in half A in 8 of 9 flies, and summed VR correlation larger in half B in 7 of 9. The
    ipsilateral part of the statement is not tested; it holds if half A is the fly's left, which the
    dandiset does not state.
  deviations:
  - Mirror about the centre of the FDA's left-right axis (156.5), chosen from the symmetry of the
    brain mask; the 0.7 threshold for symmetry is a choice of this attempt.
- claim: fig2e-region-fractions
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: Needs the neuropil of each voxel. The dandiset holds no neuropil labels, atlas or mean brain
