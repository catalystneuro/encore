inputs:
- what: Procedures and parameters, no data. The behaviour variables (FicTrac dRotLabY and dRotLabZ, Savitzky-Golay
    25 frames order 3, clipping into forward, left and right, the 4.5 mm ball radius), the walking state,
    the pooled Pearson correlation and its Bonferroni threshold, the ridge alpha grid and its selection,
    the time shifts of the cross-correlation filters, and the GCaMP6f kernel and deconvolution. From the
    paper's analysis code (correlation_analysis.py, linear_filters.py, pca.py, pca_fit_behavior_models.py,
    deconvolution.py, neural_histograms.py).
  source: https://github.com/ClandininLab/brezovec_volition_2023 at commit 8e2b275f1a95947212eacd3e511915039ffc5df4
- what: How the files were made (FicTrac given uniform timestamps from 0 because synchronisation data
    were missing; the processed file brain_zscored_green_high_pass_masked_warped_to_FDA.nii). Read, not
    used in the analysis. The draft of the dandiset links this repository.
  source: https://github.com/catalystneuro/clandinin-lab-to-nwb at commit f083b0900f9acb154ca6c3e9f5de65f305a97df0
outcomes:
- claim: dataset-structure
  outcome: reproduced
  notebook: reproduce_brezovec_2022.ipynb
  output: claim:dataset-structure
  measured:
  - 9
  - 30456
  - 1.8797
  - 1605632
  - 50
  notes: Nine flies, one session each, 3384 volumes per fly (30,456 in all) at 1.8797 Hz, 1,605,632 voxels
    of 2.61 x 2.61 x 5 um per raw volume, 30.0 minutes per session, FicTrac 90,000 frames at 50 Hz. The
    subject ids match the nine flies of the paper's code.
- claim: fig2c-fraction-correlated
  outcome: partially_reproduced
  notebook: reproduce_brezovec_2022.ipynb
  output: claim:fig2c-fraction-correlated
  measured: 31.1
  notes: Reading (a), single voxels at p < 1e-4, gives 31.1% of the 191,119 in-brain voxels of the 12
    planes, below 35.1 to 42.9% and above 19.5%. Reading (b), 6 x 6 blocks at p < 1e-8, gives 53.5% of
    the same in-brain voxels, above the band. With each fly's behaviour rolled in time, 0.0% pass under
    either reading. With behaviour sampled at the start of each volume in place of its midpoint, reading
    (a) gives 39.2%, so the value depends on the neural times, which the dandiset does not hold. The fraction
    is 0.0 to 7.5% in the outermost planes and 21.0 to 39.1% in the others. Within single flies 2.4 to
    19.7% of voxels pass the threshold for 3384 points. Almost no voxel is negatively correlated (at most
    0.01% per component).
  deviations:
  - Processed volumes in the Functional Drosophila Atlas, not the paper's mean brain; 12 of 91 planes.
  - Behaviour sampled at the midpoint of each volume, as the dandiset has no per-plane times; the paper
    used each plane's acquisition time.
  - Blocks of 6 x 6 voxels in place of the paper's Ward supervoxels for reading (b).
  - In-brain voxels are those inside the brain in all nine flies; with voxels inside in any fly the fraction
    is 20.3%.
- claim: fig2c-venn-categories
  outcome: partially_reproduced
  notebook: reproduce_brezovec_2022.ipynb
  output: claim:fig2c-venn-categories
  measured:
  - 11.9
  - 15.9
  - 3.2
  - 11.5
  notes: Under reading (a), VF only 11.9% (expected 15), VF and turning 15.9% (20), turning only 3.2%
    (4), and 11.5% of correlated voxels correlated with all three (10). None is within its tolerance;
    the ranking holds and fewer than 20% of correlated voxels correlate with all three, so most show a
    tuning preference, as the statement says. Under reading (b) VF and turning is 39.4% and all three
    32.2%. With behaviour at the start of each volume, reading (a) gives 11.6, 24.1, 3.5 and 25.7%.
  deviations:
  - As for fig2c-fraction-correlated.
- claim: fig2-symmetry
  outcome: reproduced
  notebook: reproduce_brezovec_2022.ipynb
  output: claim:fig2-symmetry
  notes: The VF map correlates with its mirror image at r = 0.823. The VL map correlates with the mirrored
    VR map at 0.672 and with its own mirror at 0.449. Voxels significant for VL are 2.38 times as many
    in image half A (x < 157) as in half B, and voxels significant for VR 3.2 times as many in half B.
    Per fly, the VF mirror correlation is 0.166 to 0.580, summed VL correlation is larger in half A in
    8 of 9 flies, summed VR correlation larger in half B in 7 of 9, and both in 6 of 9; fly_098 and fly_105
    have VR on the same side as VL and fly_099 has VL on the other side. Against the pooled maps of the
    other eight flies, no fly matches better mirrored for both VL and VR, as a left-right flip would
    give; 7 of 9 match better unflipped for both. fly_099's VL map matches the mirrored map slightly
    better (0.158 against 0.190), its VR map clearly does not (0.439 against 0.199). For fly_105 the check
    does not decide (VL 0.274 against 0.234, VR 0.212 against 0.214), so a flip of that fly is not excluded;
    it would lower the pooled asymmetry. The ipsilateral part of the statement is not tested; it holds
    if half A is the fly's left, which the dandiset does not state.
  deviations:
  - Mirror about the centre of the FDA's left-right axis (156.5), chosen from the symmetry of the brain
    mask; the 0.7 threshold for symmetry is a choice of this attempt, made after the prototype run had
    shown r = 0.82.
- claim: fig2e-region-fractions
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: Needs the neuropil of each voxel. The dandiset holds no neuropil labels, atlas or mean brain
    for the FDA space of its processed volumes, nor the paper's own mean brain and its registered atlas.
    The FDA and its labels come from a later paper (BIFROST, Dryad doi:10.5061/dryad.8pk0p2nx1) that the
    preprint does not use, so they cannot be brought in under the protocol. Dryad holds no deposit of
    this paper's data.
- claim: fig3-topographic-maps
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: Needs neuropil boundaries; see fig2e-region-fractions.
- claim: fig4bcd-pc-structure
  outcome: reproduced
  notebook: reproduce_brezovec_2022.ipynb
  output: claim:fig4bcd-pc-structure
  notes: All three parts hold under both readings of the threshold. Reading (a); PC1's below-threshold
    correlation with VF is 0.202 against 0.065 (PC2) and -0.045 (PC3); above the threshold PC2 has the
    largest correlation with VF (0.272, PC1 0.162, PC3 0.086) and 0.091 and 0.087 with VL and VR; PC3's
    above-threshold correlations are 0.114 with VL and -0.259 with VR (p = 3.5e-14 and 5.6e-72). Within
    each fly over all time points, PC1 correlates positively with VF (0.22 to 0.57) and PC3 more with
    VL than VR, in 9 of 9 flies. PC1 explains 2.22% of block variance.
  deviations:
  - PCA of 5363 blocks from 12 planes, not of 98,000 supervoxels from 49 planes.
- claim: fig4fg-ridge-r2
  outcome: partially_reproduced
  notebook: reproduce_brezovec_2022.ipynb
  output: claim:fig4fg-ridge-r2
  measured:
  - 0.155
  - 0.196
  - 0.212
  notes: With 100 superfly PCs the median R2 over flies is 0.155 (VF), 0.196 (VL) and 0.212 (VR); the
    means are 0.038, 0.155 and 0.178. None is within 0.27 to 0.33; all medians are at least 0.15. Mean
    R2 rises to 100 PCs and declines after for each component, as stated. Three flies have negative VF
    R2 (-0.307, -0.306, -0.503). Variants; interleaved folds give medians 0.318, 0.252 and 0.271; alpha
    chosen within the training folds 0.134, 0.180, 0.212; each fly's own PCs 0.151, 0.210, 0.217. With
    behaviour rolled in time R2 is at most -0.002. With interleaved folds two of the three medians fall
    in the band (VF 0.318, VR 0.271; VL 0.252), so the folds, which the paper does not state, account
    for much of the gap; the outcome would stay partial.
  deviations:
  - Five contiguous folds within each fly, a choice; the code does not show its folds.
  - Alpha is chosen by the best held-out score, as the code does, which selects on the test folds.
  - The 1000 and 2000 PC models were not run (at most 500 PCs).
  - PCs of 5363 blocks from 12 planes.
- claim: fig4h-r2-vs-movement
  outcome: partially_reproduced
  notebook: reproduce_brezovec_2022.ipynb
  output: claim:fig4h-r2-vs-movement
  measured: 0.534
  notes: The Spearman correlation of a fly's mean amount of a component with its R2 is positive for all
    three components (VF 0.017, VL 0.383, VR 0.683, p = 0.042 for VR only); the pooled within-component
    rank correlation is 0.361 with p = 0.064. The largest R2 is 0.534 (fly_094, VF), just below 0.54 to
    0.66, and the smallest -0.503. Partially reproduced under the clause that the correlation is positive
    for at least two components.
  deviations:
  - Rests on the R2 of fig4fg-ridge-r2, with its contiguous folds.
- claim: fig4i-weights-stereotyped
  outcome: reproduced
  notebook: reproduce_brezovec_2022.ipynb
  output: claim:fig4i-weights-stereotyped
  notes: Median correlation of the weights on PCs 1 to 20 between pairs of flies is 0.646 (VF), 0.732
    (VL) and 0.761 (VR). PC3's weight is positive for VL and negative for VR in 9 of 9 flies, PC2's weight
    is largest for VF in 7 of 9, and PC1's weights have one sign for all three components in 9 of 9. With
    each fly's behaviour rolled in time (20 rolls), the median pair correlation is at most 0.151, PC3
    has opposite signs in 3 to 8 of 9 flies and PC1 one sign in 0 to 6 of 9. Part (iv) follows in part
    from PC1's orientation, signed to correlate positively with VF, with which it also correlates positively
    with VL and VR (0.222 and 0.188).
  deviations:
  - Weights from a ridge fit to all of each fly's time points at the alpha chosen in fig4fg-ridge-r2,
    with each component scaled to unit s.d.
- claim: fig5a-unique-variance
  outcome: partially_reproduced
  notebook: reproduce_brezovec_2022.ipynb
  output: claim:fig5a-unique-variance
  notes: At the 0.01 threshold, 5 blocks (0.09%) encode walking state uniquely and 40 (0.75%) encode VF
    uniquely, 8 times as many, but fewer than the 5% the criterion requires. Unique contributions are
    small everywhere (largest 0.032 for VF, 0.012 for walking state) and the full model's median held-out
    R2 is 0.0019. The single-variable maps of VF and walking state correlate at 0.882 over blocks, as
    the statement says. At a threshold of 0.005 walking state is unique in 1.88% of blocks and VF in 2.24%;
    with the walking state the code intended, in 0.97% and 0.91%, so the VF advantage depends on the 0.01
    threshold, which lies far above the median full-model R2, and on the definition of walking state.
    Within single flies walking state is unique in up to 8.35% of blocks (fly_094).
  deviations:
  - Ridge alpha 1 on behaviour scaled to unit s.d., folds as fifths of every fly, and the 0.01 threshold
    are choices; the Methods give none of them.
  - Walking state as the code computes it, which uses forward velocity alone.
  - Blocks in place of supervoxels.
- claim: fig5c-global-below-threshold
  outcome: reproduced
  notebook: reproduce_brezovec_2022.ipynb
  output: claim:fig5c-global-below-threshold
  notes: Under reading (b) of the threshold all nine below-threshold correlations of the forward, left
    and right regions (40, 4 and 8 blocks) with the three components are positive with p < 0.05 (0.013
    to 0.221), and above the threshold each region correlates most with its own component (0.377, 0.170,
    0.266). Under reading (a) the left region with VR is -0.008 (p = 0.2), so only reading (b) satisfies
    the criterion. The Pearson p-values treat time points as independent; against 200 rolls of each fly's
    behaviour in time, which keep the autocorrelation, all nine are above chance under reading (b), the
    weakest (left region with VR, r = 0.013) with p = 0.025 against a null 95th percentile of 0.010. The
    left region holds only 4 blocks.
  deviations:
  - Regions are the few blocks with a unique contribution of at least 0.01 in fig5a-unique-variance.
  - The threshold readings are two interpretations of the 0.75 s.d. of Figure 4E.
- claim: fig5f-ipsi-contra
  outcome: not_reproduced
  notebook: reproduce_brezovec_2022.ipynb
  output: claim:fig5f-ipsi-contra
  notes: Turning raises activity mostly on one side, opposite for the two directions (82% of the top 10%
    of blocks in half A for left turns, 25% for right turns), but the mirror blocks rise as well; their
    median change against slow walking is +0.0064 for left turns and +0.0022 for right turns, and 36%
    and 42% of them fall. The same holds with turning thresholds of 50 and 150 deg/s, and in 8 of 9 flies
    for left turns and 9 of 9 for right turns. With the change predicted by the demixing model of fig5a-unique-variance,
    as the paper derives Figure 5F, the mirror blocks rise as well (medians 0.0254 and 0.0111; 6.5% and
    18.8% fall), as do the model's VL and VR coefficients of the mirror blocks (median 0.0064). The ipsilateral
    increase holds; the contralateral decrease does not.
  deviations:
  - The bounds for slow walking (1 to 3 mm/s, below 30 deg/s) and turning (beyond 100 deg/s) are choices;
    the paper does not state its own.
  - Neural activity and behaviour at the same volume time, without a lag.
  - The main test compares mean activity in turns and slow walking; the paper uses the demixing model,
    shown as a variant.
- claim: fig6-peak-time-range
  outcome: reproduced
  notebook: reproduce_brezovec_2022.ipynb
  output: claim:fig6-peak-time-range
  measured: 0.32
  notes: Reading (b); the 99th percentile of VF lead over the 2145 top blocks is 0.32 s, within 0.27 to
    0.33 s, and the 1st percentile a lag of 1.23 s. Reading (a) gives an earliest lead of 0.44 s (outside
    tolerance) and a latest lag of 1.44 s. VL and VR give 99th percentiles of 0.30 and 0.22 s and 1st
    percentiles of lags of 1.24 and 1.22 s. With volume-start times the VF 99th percentile is 0.58 s.
    The median VF lead changes steadily with FDA plane from 0.36 s (plane 17) to -0.30 s (plane 80), a
    spread of 0.66 s against a volume period of 0.532 s, the pattern unknown plane acquisition times would
    produce; the dandiset gives neither the times nor the order of the planes. With each plane's median
    removed the 99th percentile is 0.50 s and the 1st -1.02 s, so the match within 0.03 s is not robust
    to the neural times; the lag of more than 1 s holds in both (1st percentile at least 0.84 s of lag
    in every plane from 38 to 80, more than 1 s in planes 59 to 73). Only the lag of more than 1 s is
    robust; the earliest lead cannot be tested with the timing the dandiset gives, and the outcome follows
    the criterion fixed in advance. Fitted per fly, the 99th percentile is 0.36 to 4.55 s.
  deviations:
  - Neural times at the volume midpoint, an error of up to 0.27 s per block.
  - Notch filter Q = 2 is a choice; the code's notch coefficients are not in the repository.
  - Top 40% by peak value of the deconvolved filter.
- claim: fig6h-peak-vs-width
  outcome: reproduced
  notebook: reproduce_brezovec_2022.ipynb
  output: claim:fig6h-peak-vs-width
  notes: Over the 2145 top VF blocks, lag and FWHM correlate at r = 0.672 (p = 2.2e-281, Spearman 0.703);
    mean FWHM is 1.38 s for blocks leading by up to 0.5 s and 2.62 s for blocks lagging by more than 1
    s. VL and VR give r = 0.442 and 0.449; volume-start times 0.673. The plane means of lag and FWHM correlate
    at 0.979 over 10 planes, so plane accounts for part of the relation; with plane means removed r =
    0.623 (p = 6.3e-231), and within single planes r is positive in all 10 planes with at least 10 blocks
    (0.222 to 0.751), with p < 0.05 in 8.
  deviations:
  - As for fig6-peak-time-range; FWHM measured from 0, around the peak.
- claim: fig6fg-ipsi-leads-contra
  outcome: reproduced
  notebook: reproduce_brezovec_2022.ipynb
  output: claim:fig6fg-ipsi-leads-contra
  notes: For VL, over 868 mirror pairs, the block in half A leads its partner by a median 0.16 s and is
    earlier in 67% of pairs; for VR, over 849 pairs, the block in half B leads by 0.14 s and is earlier
    in 72%; both Wilcoxon p-values print as 0. The median difference is 0.26 to 0.33 s in planes 17
    to 38 for VL and 0.19 to 0.29 s in planes 17 to 59 for VR, and -0.03 to 0.03 s in planes 73 and 80. Both blocks of a pair lie in one FDA plane; whether the two halves
    of a plane were acquired at the same time is not known.
  deviations:
  - The ipsilateral half is the image half with more significant correlations for that turn, from fig2-symmetry,
    since the dandiset does not say which half is left.
- claim: fig6eg-region-sequence
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: Needs the neuropil of each supervoxel; see fig2e-region-fractions. The timing would also need
    the per-plane acquisition times and the paper's z-depth maps, which are not in the dandiset.
- claim: fig7-within-region-gradients
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: Needs neuropil boundaries (see fig2e-region-fractions) and per-plane acquisition times, neither
    of which is in the dandiset.
- claim: figs2-tdtomato-control
  outcome: blocked
  blocked_by: data_missing
  notes: The dandiset holds the tdTomato channel only raw, without motion correction or registration.
    Repeating the paper's per-volume ANTs SyN motion correction for 30,456 volumes, and the warps to a
    common space, is also out of reach here (not_runnable). A check on the raw, uncorrected channels (raw
    planes 18 and 30, high-pass filtered as the code does, within each fly) does not decide the outcome;
    the median share of voxels correlated with VF, VL or VR at p < 1e-4 is 0.23% for tdTomato and 0.60%
    for GCaMP6f, tdTomato exceeds GCaMP6f in 5 of 18 fly-planes, and it reaches 3.53% in fly_089, against
    0.83% for GCaMP6f.
- claim: figs4a-supervoxel-number
  outcome: blocked
  blocked_by: too_large
  notes: Needs Ward clustering of every plane of the nine flies pooled at seven cluster numbers, so every
    voxel of all 91 planes. The 12 planes streamed here are 22.1 GB compressed and took 306 s in the
    latest run (214 s in the run before), including about 40 s for metadata; all 91 planes are several
    times that, which leaves no room within the 30 minute limit for the clustering
    itself. The files total 610 GB. A partial sweep on the 12 streamed planes was not attempted. It would
    need each plane's voxel time series held in memory (about 27,000 in-brain voxels x 30,456 points,
    some 3 GB per plane) for Ward clustering at seven sizes, followed by the PCA and ridge models at each
    size, while the streaming here keeps only block means and per-voxel sums.
findings:
- kind: metadata_insufficient
  statement: The processed volumes are registered into the Functional Drosophila Atlas, but the dandiset
    holds no neuropil labels, atlas or template for that space, nor the paper's own mean brain and registered
    atlas. None of the paper's region-level results (Figures 2E to I, 3, 6E to G, 7) can be tested.
- kind: other
  statement: The processed series is in the Functional Drosophila Atlas, a space from a later paper of
    the lab, while the preprint analyses its data in its own mean brain. The dandiset does not say how
    the FDA series relates to the preprint's analysis space or which preprocessing it shares.
- kind: data_missing
  statement: The per-plane acquisition times of the Bruker recordings are not in the files, which give
    only a volume rate. The paper aligns behaviour to each plane's time. Sampling behaviour at the start
    in place of the middle of each volume changes the correlated share of the brain from 31.1% to 39.2%
    and the 99th percentile of forward-velocity lead from 0.32 to 0.58 s.
- kind: data_missing
  statement: The supervoxel labels, the z-depth maps used to give each supervoxel its acquisition time,
    and the motion-corrected tdTomato channel used as the paper's motion control are not deposited.
- kind: metadata_insufficient
  statement: The processed series has grid spacing 1, 1, 1 in unit "unknown", so its voxel size is not
    given, and nothing states which half of the volume is the fly's left.
- kind: metadata_insufficient
  statement: Imaging and FicTrac both start at 0 s; the conversion code set FicTrac timestamps to a uniform
    50 Hz from 0 because synchronisation data were missing, and the dandiset does not say so. The data
    are consistent with a shared start (brain-wide activity follows walking speed by 0.4 to 0.8 s in every
    fly), to within a few hundred milliseconds.
- kind: metadata_error
  statement: Every FicTrac SpatialSeries has unit "meters" and conversion 0.0045 (the ball radius), while
    most hold angles in radians, as their descriptions say (heading, orientations, positions in radians,
    speed in radians per frame). SpatialSeriesRotationDeltaError, described as an error in radians, has
    medians of 6067 to 10,435.
- kind: code_mismatch
  statement: The paper's code computes the walking state with np.sqrt(a, b), where b is taken as the output
    array, so the state reduces to absolute forward velocity over its s.d. above 0.2; the line was written
    to combine forward and rotational velocity. The two versions mark 47.2% and 57.3% of time points as
    walking.
- kind: paper_inconsistency
  statement: The Methods cite Figure 3F and 3G for the PCA model sweep and the per-fly PCs, which are
    in Figure 4F and 4G. The Results describe Figure 3G as the Nodulus, while the Figure 3 legend calls
    panel G the Ellipsoid Body.
- kind: other
  statement: The preprint says the microscopy and behavioural data were deposited at Dryad and the code
    at GitHub, with DOIs in a key resources table that the preprint does not include. No Dryad record
    of these data was found, and the dandiset links neither the analysis code nor Dryad. The analysis
    code was found as ClandininLab/brezovec_volition_2023, whose README gives a different title.
verifications:
- date: '2026-10-18'
  kind: agent
  by: Independent agent run by CatalystNeuro (same harness, separate context, did not write the notebook)
  reviewed: Round 1. The executed notebook of the first run with the conclusion cells and the summary
    removed, the helper module and the claims file. It also checked the blocked claims against the archive's
    asset list and metadata.
  results:
  - claim: dataset-structure
    agrees: true
    outcome: reproduced
    reason: 'Cells 3, 5 and 14: 9 flies, 30,456 volumes, 1.880 Hz, 1,605,632 voxels of 2.61 x 2.61 x 5
      um, FicTrac at 50 Hz, 1800 s per session. Its point B7: in the clock check the observed statistic
      is the maximum |r| over 101 lags, but the null is |r| at a single random shift, so the null is not
      comparable and the margins are overstated, though the lag peaks still look sensible.'
    response: No change of outcome. The clock-check null now takes the largest |r| over the same 101 lags
      (B7). As asked (its points B11 and C), the data check now lists the nine
      AVI behaviour videos and prints every array of each file with its shape, type and chunks, the same
      in all nine, including the raw tdTomato series.
  - claim: fig2c-fraction-correlated
    agrees: true
    outcome: partially_reproduced
    reason: 'Reading (a) gives 31.1%, below the 35.1 to 42.9 band but above 19.5. Reading (b) gives 54.9%,
      above the band. The paper''s Results quote 39% at the Bonferroni supervoxel threshold, i.e. reading
      (b), and that reading misses by 16 points. Its point B10: the denominator of reading (b) is brain_blocks.sum()
      (186,298) where it should be brain.sum() (191,119), so 54.9% would become about 53.5%. It asked
      for a circular-shift null for the fraction of correlated voxels.'
    response: Fixed the denominator of reading (b), now 53.5%. Added a null with each fly's behaviour
      rolled in time, under which 0.0% of voxels and blocks pass. Outcome unchanged.
  - claim: fig2c-venn-categories
    agrees: true
    outcome: partially_reproduced
    reason: Under (a) the values are 11.9, 15.9, 3.2 and 11.5%, all outside tolerance. The ranking holds
      and all three is below 20%.
    response: No change of outcome. Reading (b) values moved with the corrected denominator (VF and turning
      39.4%).
  - claim: fig2-symmetry
    agrees: true
    outcome: reproduced
    reason: 'VF mirror r = 0.823; VL vs mirrored VR 0.672 against 0.449 for VL vs its own mirror; VL A/B
      = 2.38 and VR A/B = 0.31. Per fly the pattern is inconsistent: the expected sign pattern holds clearly
      in only 5 of 9 flies, fly_098 and fly_105 have VR on the same side as VL, fly_099 has VL reversed,
      and a possible left-right flip in fly_105''s registration is never checked. In the clock check fly_105''s
      half-difference correlates negatively with rotation, and its VF R2 is -0.50. The criteria were written
      after the prototype results were seen, and the symmetry threshold of 0.7 is a choice made after
      seeing r = 0.82. The colour range of the plot is +-0.3 while the largest voxel r is 0.12.'
    response: 'No change of outcome. Added per-fly counts (both signs hold in 6 of 9 flies by the summed
