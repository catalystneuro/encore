    correlation is positive for at least two components.
  deviations:
  - Rests on the R2 of fig4fg-ridge-r2, with its contiguous folds.
- claim: fig4i-weights-stereotyped
  outcome: reproduced
  notebook: reproduce_brezovec_2022.ipynb
  output: claim:fig4i-weights-stereotyped
  notes: Median correlation of the weights on PCs 1 to 20 between pairs of flies is 0.646 (VF), 0.732
    (VL) and 0.761 (VR). PC3's weight is positive for VL and negative for VR in 9 of 9 flies, PC2's
    weight is largest for VF in 7 of 9, and PC1's weights have one sign for all three components in 9
    of 9.
  deviations:
  - Weights from a ridge fit to all of each fly's time points at the alpha chosen in fig4fg-ridge-r2,
    with each component scaled to unit s.d.
- claim: fig5a-unique-variance
  outcome: partially_reproduced
  notebook: reproduce_brezovec_2022.ipynb
  output: claim:fig5a-unique-variance
  notes: At the 0.01 threshold, 5 blocks (0.09%) encode walking state uniquely and 40 (0.75%) encode
    VF uniquely, 8 times as many, but fewer than the 5% the criterion requires. Unique contributions
    are small everywhere (largest 0.032 for VF, 0.012 for walking state) and the full model's median
    held-out R2 is 0.0019. The single-variable maps of VF and walking state correlate at 0.882 over
    blocks, as the statement says. At a threshold of 0.005 walking state is unique in 1.88% of blocks
    and VF in 2.24%; with the walking state the code intended, in 0.97% and 0.91%. Within single
    flies walking state is unique in up to 8.35% of blocks (fly_094).
  deviations:
  - Ridge alpha 1 on behaviour scaled to unit s.d., folds as fifths of every fly, and the 0.01
    threshold are choices; the Methods give none of them.
  - Walking state as the code computes it, which uses forward velocity alone.
  - Blocks in place of supervoxels.
- claim: fig5c-global-below-threshold
  outcome: reproduced
  notebook: reproduce_brezovec_2022.ipynb
  output: claim:fig5c-global-below-threshold
  notes: Under reading (b) of the threshold all nine below-threshold correlations of the forward, left
    and right regions (40, 4 and 8 blocks) with the three components are positive with p < 0.05
    (0.013 to 0.221), and above the threshold each region correlates most with its own component
    (0.377, 0.170, 0.266). Under reading (a) the left region with VR is -0.008 (p = 0.2), so only
    reading (b) satisfies the criterion.
  deviations:
  - Regions are the few blocks with a unique contribution of at least 0.01 in fig5a-unique-variance.
  - The threshold readings are two interpretations of the 0.75 s.d. of Figure 4E.
- claim: fig5f-ipsi-contra
  outcome: not_reproduced
  notebook: reproduce_brezovec_2022.ipynb
  output: claim:fig5f-ipsi-contra
  notes: Turning raises activity mostly on one side, opposite for the two directions (82% of the top
    10% of blocks in half A for left turns, 25% for right turns), but the mirror blocks rise as well;
    their median change against slow walking is +0.0064 for left turns and +0.0022 for right turns,
    and 36% and 42% of them fall. The same holds with turning thresholds of 50 and 150 deg/s, and in
    8 of 9 flies for left turns and 9 of 9 for right turns. The ipsilateral increase holds; the
    contralateral decrease does not.
  deviations:
  - The bounds for slow walking (1 to 3 mm/s, below 30 deg/s) and turning (beyond 100 deg/s) are
    choices; the paper does not state its own.
  - Neural activity and behaviour at the same volume time, without a lag.
- claim: fig6-peak-time-range
  outcome: reproduced
  notebook: reproduce_brezovec_2022.ipynb
  output: claim:fig6-peak-time-range
  measured: 0.32
  notes: Reading (b); the 99th percentile of VF lead over the 2145 top blocks is 0.32 s, within 0.27 to
    0.33 s, and the 1st percentile a lag of 1.23 s. Reading (a) gives an earliest lead of 0.44 s
    (outside tolerance) and a latest lag of 1.44 s. VL and VR give 99th percentiles of 0.30 and 0.22 s
    and 1st percentiles of lags of 1.24 and 1.22 s. With volume-start times the VF 99th percentile is
    0.58 s. The median VF lead changes with FDA plane from 0.36 s (plane 17) to -0.30 s (plane 80);
    the missing plane acquisition order can shift a plane by up to one volume (0.532 s), so the two
    cannot be separated. Fitted per fly, the 99th percentile is 0.36 to 4.55 s.
  deviations:
  - Neural times at the volume midpoint, an error of up to 0.27 s per block.
  - Notch filter Q = 2 is a choice; the code's notch coefficients are not in the repository.
  - Top 40% by peak value of the deconvolved filter.
- claim: fig6h-peak-vs-width
  outcome: reproduced
  notebook: reproduce_brezovec_2022.ipynb
  output: claim:fig6h-peak-vs-width
  notes: Over the 2145 top VF blocks, lag and FWHM correlate at r = 0.672 (p = 2.2e-281, Spearman
    0.703); mean FWHM is 1.38 s for blocks leading by up to 0.5 s and 2.62 s for blocks lagging by
