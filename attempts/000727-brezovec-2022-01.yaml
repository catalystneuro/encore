    deposit of this paper's data.
- claim: fig3-topographic-maps
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: Needs neuropil boundaries; see fig2e-region-fractions.
- claim: fig4bcd-pc-structure
  outcome: reproduced
  notebook: reproduce_brezovec_2022.ipynb
  output: claim:fig4bcd-pc-structure
  notes: All three parts hold under both readings of the threshold. Reading (a); PC1's below-threshold
    correlation with VF is 0.202 against 0.065 (PC2) and -0.045 (PC3); above the threshold PC2 has
    the largest correlation with VF (0.272, PC1 0.162, PC3 0.086) and 0.091 and 0.087 with VL and VR;
    PC3's above-threshold correlations are 0.114 with VL and -0.259 with VR (p = 3.5e-14 and
    5.6e-72). Within each fly over all time points, PC1 correlates positively with VF (0.22 to 0.57)
    and PC3 more with VL than VR, in 9 of 9 flies. PC1 explains 2.22% of block variance.
  deviations:
  - PCA of 5363 blocks from 12 planes, not of 98,000 supervoxels from 49 planes.
- claim: fig4fg-ridge-r2
  outcome: partially_reproduced
  notebook: reproduce_brezovec_2022.ipynb
  output: claim:fig4fg-ridge-r2
  measured:
  - 0.155
  - 0.196
  - 0.212
  notes: With 100 superfly PCs the median R2 over flies is 0.155 (VF), 0.196 (VL) and 0.212 (VR);
    the means are 0.038, 0.155 and 0.178. None is within 0.27 to 0.33; all medians are at least
    0.15. Mean R2 rises to 100 PCs and declines after for each component, as stated. Three flies
    have negative VF R2 (-0.307, -0.306, -0.503). Variants; interleaved folds give medians 0.318,
    0.252 and 0.271; alpha chosen within the training folds 0.134, 0.180, 0.212; each fly's own PCs
    0.151, 0.210, 0.217. With behaviour rolled in time R2 is at most -0.002. With interleaved folds
    two of the three medians fall in the band (VF 0.318, VR 0.271; VL 0.252), so the folds, which the
    paper does not state, account for much of the gap; the outcome would stay partial.
  deviations:
  - Five contiguous folds within each fly, a choice; the code does not show its folds.
  - Alpha is chosen by the best held-out score, as the code does, which selects on the test folds.
  - The 1000 and 2000 PC models were not run (at most 500 PCs).
  - PCs of 5363 blocks from 12 planes.
- claim: fig4h-r2-vs-movement
  outcome: partially_reproduced
  notebook: reproduce_brezovec_2022.ipynb
  output: claim:fig4h-r2-vs-movement
  measured: 0.534
  notes: The Spearman correlation of a fly's mean amount of a component with its R2 is positive for
    all three components (VF 0.017, VL 0.383, VR 0.683, p = 0.042 for VR only); the pooled
    within-component rank correlation is 0.361 with p = 0.064. The largest R2 is 0.534 (fly_094, VF),
