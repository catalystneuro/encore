    the end gives row 6 Ci with raw baselines median -0.018, p = 0.12, not significant, so the code's
    match on this cell (p = 0.023) rests on evoked rates that are likely biased low. Code-rule trials whose
    beep falls after the end of the trial enter no table, since they have no evoked pupil.
