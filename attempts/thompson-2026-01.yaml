    use the evoked pupil, and it fails under both mixtures (code trials with E1, p = 0.131; Methods trials
    with the code's evoked pupil, p = 0.136), so the code's 12 of 12 comes from its trial set, not its
    pupil window. The code's rule keeps 85 beep rows (20 Oz, 65 Ci) that the Methods' rule drops; on each
