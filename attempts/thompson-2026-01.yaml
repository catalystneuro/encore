- claim: data-units-sessions
  outcome: reproduced
  assumed: true
  notebook: reproduce_thompson_2026.ipynb
  output: claim:data-units-sessions
  measured:
  - 42
  - 32
  - 63
  - 51
  notes: Oz 42 units in 32 sessions, Ci 63 units in 51 sessions, each with beep trials, spikes and pupil,
    under the Methods' and the code's trial rules (7 to 109 beep trials per unit under the Methods' rule,
    7 to 111 under the code's). The code's second removal of two units gives 61 units in 50 sessions
    for Ci, the counts its printed output shows.
  deviations:
  - Assumption. The trial start is taken as fixation onset for every window, as the paper's code does;
    the files hold no fixation marker and do not say what event the trial start marks, the beep falls
