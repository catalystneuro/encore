  notes: The animal count matches (6). LS neurons number 2448 labelled `ls`, and 2046 with more
    than 50 spikes in high-power epochs, within 10% of 1989. Files with LS and `hpc` units number 37,
    as in the paper; files with LS electrodes 94 (paper 89). Files with LS and CA3 units number 10
