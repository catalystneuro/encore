  outcome: reproduced
  notebook: reproduce_tingley_2019.ipynb
  output: claim:fig1c-event-count
  measured: 31984
  notes: Under reading (b), recordings with LS units, 31,984 events are detected, within 10% of
    29,955. Reading (a), all 94 recordings with LS electrodes, gives 67,186, of which 38,008 come
    from DT7. More events fall in WAKE (27,676) than in NREM (20,019). The count matching does not
