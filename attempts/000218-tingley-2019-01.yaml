- claim: fig1d-phase-locking
  outcome: partially_reproduced
  notebook: reproduce_tingley_2019.ipynb
  output: claim:fig1d-phase-locking
  measured: 0.563
  notes: 1151 of 2046 tested LS neurons (56.3%) are significantly locked (47.0% of all 2448), against
    92.5%. The trough preference holds, with preferred phases centred on 189 degrees (resultant
    0.755). By animal the fraction is 5.7% (DT7) to 70.4% (DT5). Median resultant 0.124 against
