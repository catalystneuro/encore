- claim: fig1c-hfo-each-animal
  outcome: not_reproduced
  notebook: reproduce_tingley_2019.ipynb
  output: claim:fig1c-hfo-each-animal
  notes: Median event frequency is 152 to 158 Hz in every animal. LS firing within 10 ms of the
    events exceeds firing at random times by more than 3 SEM only in DT1 (6.0 SEM); DT2 and DT5 are
    higher by 1.3 and 1.4 SEM, and DT7, DT8 and DT9 are lower (-3.4, -4.6, -1.4 SEM). In variants,
    NREM events pass in DT2 (3.3) and DT9 (3.9), and ripple-coupled events in DT9 (4.2). On the LS
    channel re-referenced within its shank no animal passes (largest 1.5 SEM, DT2). Random times
    mix states; against each neuron's firing 50 to 100 ms before and after the same events, firing
    at the events is higher in DT1, DT2, DT5 and DT9 and lower in DT7 and DT8, and exceeds 3 SEM
    only in DT1 (5.2 SEM; DT2 1.6, DT5 1.7, DT9 0.5). In DT2 and DT5 the differences are large
    (0.024 and 0.037 spikes) but vary widely across neurons. The test does not show raised LS
    firing at the events outside DT1, and does not show that the events lack it.
  deviations:
  - Events are detected here on one LS channel per recording chosen by a fixed rule (highest
    120-200 Hz SD in a 300 s NREM sample); the paper does not say which channels it used.
  - The paper's noise channel is replaced by the EMG estimated from the LFP, which the Methods
    allow when no noise channel exists.
