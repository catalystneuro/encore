findings:
- kind: data_missing
  statement: The files hold no detected LS HFOs or hippocampal ripples, nor the detection channels
    and parameters, which the Methods say are stored with each event structure. Every analysis of
    events has to detect them anew, and the detection channels cannot be matched to the paper's.
- kind: metadata_insufficient
  statement: Nine files (DT5 2016-10-07, DT7 2017-03-14, -16, -17, -19, 2017-04-07, -10, DT9
    2017-04-28, 2017-05-26) store units without a location column, so their 268 units cannot be
    assigned to LS or hippocampus.
- kind: metadata_insufficient
  statement: Hippocampal electrodes and units are labelled `hpc` or `ca3`; `hpc` does not say
    whether a site is in CA1, which the paper's analyses distinguish. Four DT7 files label all
    electrodes `unknown`.
- kind: data_missing
  statement: The paper's CA3 recordings used a CA1 reference electrode to detect ripples. The 10
    files with `ca3` electrodes hold 64 `ca3` and 32 `ls` channels and no CA1 channel, and the paper
    reports 25 CA3 and LS recordings against 10 here.
- kind: metadata_insufficient
  statement: Electrode x, y and z are NaN in every file. The probe geometry and its orientation in
    the brain, needed for the travelling-wave analysis of Figure 3, are not given, and the relative
    depth of each recording within LS (Figure 2) is not given.
- kind: data_missing
  statement: The units carry no waveforms, no channel and no quality metric (the Methods compute
    isolation distance), so the CA1 depth of each neuron (Figure 7) cannot be estimated and single
    units cannot be told from multi-unit clusters; 11 units fire above 50 Hz on average. Wide-band
    data, from which waveforms could be re-extracted, are in 27 of the 98 files (DT1, DT2 and two
    DT9 files); 1579 of 2778 hippocampal units have none.
- kind: data_missing
  statement: The two rats of the optogenetic experiments (Figure 6) are not in the dandiset.
- kind: format_error
  statement: 25 units in 10 files have spike times out of order (1 to 2782 inversions each), against
    the NWB rule that spike times are sorted.
- kind: methods_unavailable
  statement: The paper's Key Resources point to github.com/DavidTingley/papers for scripts that
    recreate each main figure, but the repository holds only the network model of Figure 8 and the
    code of the 2018 paper; the analyses of Figures 1 to 7 are not published.
- kind: paper_inconsistency
  statement: The HFO band is given as 120-180 Hz in the Summary and the legends of Figures 1, 2 and 5
    and as 120-200 Hz in the Results and Methods. The Methods call the 62-recording dataset that of Figure
    6, which shows optogenetics, where Figure 7 is meant, and cite Figure 3A and 3B (travelling
    waves) for the jitter control and the state of phase-locking epochs, which appear to be Figure
    S3A and Figure 5.
