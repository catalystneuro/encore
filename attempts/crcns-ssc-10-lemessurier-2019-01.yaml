findings:
- kind: data_missing
  statement: The cell-attached recordings with simultaneous GCaMP6s imaging (Figure 1F, 10 L2/3 cells in 5 C57BL/6
    mice) are not in the data set.
- kind: metadata_insufficient
  statement: No barrel areas or radii are stored. ROI_pos_barrel_norm divides each position by a radius along the
    ROI's direction (the ratio to ROI_pos_barrel varies by a median 37% within a barrel), and the radii used are
    not given.
- kind: selection_undocumented
  statement: processed_data.mat holds more ROIs than reduced_data.mat in 21 of 36 fields (1044 against 998 NH L2/3,
    1276 against 1147 EN L2/3, 464 against 362 NH L4, 782 against 615 EN L4), with no list of the excluded ROIs
    or the reason. The paper reports 1257 EN L2/3, 322 NH L4 and 586 EN L4 cells, which match neither count.
- kind: selection_undocumented
  statement: sponTrace keeps fewer blank trials than Stimuli marks blank (for example 51 of 61 in DNH15b/20170502/f1),
    with no stated rule.
- kind: metadata_insufficient
  statement: 'The code of Stimuli.Label is not described: label k is whisk{k+1} of settings.mat for k = 0 to 8 and
    9 is a blank trial, which agrees with the per-whisker frame lists in every field.'
- kind: other
  statement: Field DNH13b/20161208/f2 has no trials for whiskers E1, E2 and E3 (absent from traceByStim, Stimuli
    frame lists and permTestResults), which the descriptor does not mention; it also lacks positions for three barrels.
- kind: format_error
  statement: Movie names carry a leading m in Stimuli and not in deltaF in some fields, and the other way in others;
    three fields (DENR2b/20160408, DNH15a/20170505/f1, DENR15b/20170513/f1) have one dF/F movie with no Stimuli
    entry.
- kind: code_mismatch
  statement: The stored dF/F is reproduced (within 0.02) by a 5-frame moving median and F0 the 5th percentile of
    each movie, as the pipeline code does, not by the Methods' 4-frame median and 20th percentile.
- kind: code_mismatch
  statement: The stored permTestResults come from a two-sided permutation test on medians (permTestType 'median'
    in every field), not the Methods' one-sided test on means. The two give the same responsive/unresponsive call
    for 85% of ROIs, and several EN effects reach significance only with the stored p-values.
- kind: other
  statement: For L4 fields (npSub = 1), subtracting 0.3 of the neuropil trace from the raw trace before the 5-frame
    median and 5th percentile F0 does not reproduce the stored dF/F exactly (per-trial responses correlate 0.983
    to 0.996, differing by up to 0.33), so the order of the L4 steps is not documented.
- kind: methods_unavailable
  statement: Question for the authors. How were equivalent best whiskers tested? Neither the Methods nor the linked
    code give it (whiskPref is loaded precomputed). Permutation tests of the difference in means against the BW
    at p >= 0.05, with or without BH correction, or of medians, put the CW among the eBWs for 90-96% of NH L2/3
    cells within 75 um of a column centre (paper 67%) and 85-88% of NH L2/3 cells within columns (paper 65%), while
    the NH L4 value matches (73.7%, paper 73%).
- kind: methods_unavailable
  statement: 'Question for the authors. Which responsiveness test gave the cells analysed: the Methods'' one-sided
    test on means, or the stored two-sided test on medians? The cell counts match either, but the L2/3 point representation
    (Figure 2A), the CW response (Figure 4D) and the correlation gradient (Figure 5E-H) are significant only with
    the stored p-values.'
- kind: methods_unavailable
  statement: Question for the authors. Is the spontaneous activity of Figure 4C the median dF/F on blank trials
    with or without subtracting the 0.5 s baseline? With it, EN L2/3 activity is higher than NH; without it, lower,
    as the paper reports.
