findings:
- kind: metadata_insufficient
  statement: No file records the condition of its cell (DCZ alone or DCZ plus mCherry) or the time DCZ
    was applied. The intervals, notes and pharmacology fields are empty and the session description is
    the same generic sentence in all 50 files; the conditions are named only in the dandiset's description.
    The paper's slice comparisons (Fig. 4i,j, Extended Data Fig. 12b) cannot be made from the files.
- kind: data_missing
  statement: The mEGFP intensity of each recorded cell (or the widefield images and soma ROIs it was measured
    from) and the mCherry preincubation time of each cell are not in the dandiset. Extended Data Fig.
    12c-h and the preincubation figures of the Methods rest on them.
- kind: other
  about: data
  statement: The files hold 50 cells from 8 mice; the paper analysed 41 cells (15 with DCZ, 26 with DCZ
    plus mCherry) from 7 and 6 mice. The paper's initial Rin exclusion (above 500 megaohms) removes one
    cell, leaving 49. Nothing in the files marks the cells the paper analysed or why the others were left
    out.
- kind: metadata_error
  statement: Channel 1 of every sweep (current_clamp-response-NN-ch-1) is a CurrentClampSeries with unit
    volts, but its values (-99.8 pA during the -100 pA step, -149.9 pA before the ramp, then the ramp)
    are the injected current in amperes.
- kind: metadata_error
  statement: The stimulus series (stimulus-NN-ch-0) gives the ramp as a step to +500 pA from 1.1 to 3.1
    s in every sweep of every file. The current actually delivered, in channel 1, is a ramp from -150
    pA, and its duration differs between cells.
- kind: other
  about: data
  statement: In 10 of 50 cells (eight of the nine recorded on 2024-08-07, and 2024_07_24_0011 and 2024_07_26_0003)
    the delivered ramp reaches +500 pA at 2.7 s (407.5 pA/s) or 2.5 s (465.7 pA/s); the Methods state
    -150 to +500 pA across 2 s, which the other 40 cells receive (326 pA/s). Rheobase depends on the ramp's
    slope, so these cells are not comparable with the others on absolute rheobase. Every sweep also holds
    -150 pA for 100 ms before the ramp, which the Methods do not describe.
- kind: other
  about: data
  statement: The files are sampled at 20 kHz; the Methods state digitization at 10 kHz. Neighbouring samples
    are equal no more often within pairs than across them, so the 20 kHz samples are not repeated 10 kHz
    samples.
- kind: metadata_error
  statement: By their dates of birth, mice PK-109 and PK-110 were 101 and 107 days old at recording; the
    Methods (injection at 4 to 8 weeks, recording 3 to 6 weeks later) allow at most 98 days. Either the
    dates of birth or the Methods' timeline is off for these two mice.
- kind: metadata_insufficient
  statement: Experimenter, lab and institution are "_" in every file, the electrodes and the device have
    no description, and the series have no stimulus description ("N/A") or comments.
- kind: methods_unavailable
  statement: The paper's analysis scripts are available only on request, and the Methods do not define
    the windows that give a change "upon 2-min DCZ addition", the unit of the mixed linear model (one
    change per cell or every sweep), the action potential detection rule, or the steady-state window for
    input resistance. The question for the authors is which windows, unit, detection rule and Rin window
    were used, and which 41 of the 50 deposited cells were analysed, in which group?
