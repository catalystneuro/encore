- claim: methods-slice-sample
  outcome: blocked
  blocked_by: metadata_insufficient
  notebook: reproduce_kalogriopoulos_2024.ipynb
  output: claim:methods-slice-sample
  notes: Under reading (a) the dataset holds 50 cells from 8 mice (PK-109, 110, 113, 114, 115, 116, 119,
    120), each cell in its own file with its own slice id; under reading (b), with either Rin window,
    the initial Rin exclusion removes one cell (PK-113, first-sweep Rin 525 megaohms) and keeps 49 cells
    from 8 mice. The paper's 15 plus 26 cells total 41; its 7 and 6 mice fit in 8 only if at least 5 mice
    gave cells to both groups, which the Methods allow. The per-condition counts the claim states cannot
    be formed. No file records which condition a cell was in (DCZ alone or DCZ plus mCherry) or when DCZ
    was applied. No file has an intervals group (no epochs, trials or time intervals), the analysis and
    processing groups are empty, and the session description is the same generic sentence in all 50 files.
    A scan of every attribute of every object, all sweeps included, and of every string dataset of any
    length, the text columns of the intracellular recording tables included, finds no drug, condition,
    timing or expression term; every sweep's series has the same description of a ramp stimulus, the stimulus
    description N/A and the comment no comments (notebook, Data check). The dandiset metadata names the
    two conditions only in its description. Each file is one continuous run of 5-s sweeps (15.5 to 26
    min), so a change upon DCZ addition has no onset to be measured from, and the two groups cannot be
    formed. The totals alone rule out 'reproduced' under both readings, as no split of 50 or 49 cells
    gives 15 and 26; had the conditions been recorded, the outcome could only have been partially or not
    reproduced, depending on the mouse counts. The 8 or 9 extra cells are not explained by any exclusion
    the paper states.
  deviations:
  - Rheobase, used only for the sweep exclusion here, is read from channel 1 (the current monitor), as
    the stored stimulus gives the ramp as a step to +500 pA; this is the criterion's "recorded stimulus"
    read from the channel that records it.
