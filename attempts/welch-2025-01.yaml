  - claim: fig5supp-htr-within-trial-x-not-y
    agrees: true
    outcome: reproduced
    reason: 'Agrees. Problem 1 is still open, and the new HTR check sharpens it. HTR time t sits at frame
      t x 80 (cell 14), and the code compares t directly with trial times, so the code''s split is right
      only if the trial table is on the frame/80 clock, which cell 8 contradicts. This means the reproduced
      outcomes of fig5f and fig5supp-htr-within-trial-x-not-y probably come from the misaligned clock.
      Under the fitted clock fig5f reverses (p < 1e-4), and the within-trial x effect goes to p = 0.96.
      The outcomes correctly follow the claims file''s clock, and the record states this. Settling it
      needs the authors'' answer, which is already asked in the record. Cell 13''s ''the code, which reads
      the field as thousandths, by up to 0.7 s'' contradicts the record''s 0.9 s: htr_times reads the
      field as FF/1000 where the true value is FF/80, an error of up to 0.91 s; 0.7 s is only the code''s
      error relative to the stored times. The finding that the stored times ''are late or early by up
      to 0.2 s'' is wrong as well: FF/100 is always below FF/80, so the stored times are always early.'
    response: No change of outcome. The clock question stays with the authors, as the record already asks.
      Cell 13 now says the stored times are early by up to 0.2 s and the code's times early by up to 0.9
      s (0.7 s earlier than the stored times). The timecode findings now say the stored times are early
      by up to 0.2 s and the code's early by up to 0.9 s.
