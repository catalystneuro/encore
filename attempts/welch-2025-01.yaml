inputs:
- what: The paper's analysis and conversion code, for method details the claims file cites (session list,
    sex list, 40-trial filter, tracking cleaning, 80 frames/s and 0.0237 cm/px, bin sizes, faulty sniff
    sessions, test calls) and for the name of the HTR series (nwb_conversion/convert_session_to_nwb.py
    and analysis/fig5_cleaned.Rmd).
