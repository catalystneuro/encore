- claim: fig4abc-sniff-frequency-higher
  outcome: reproduced
  notebook: reproduce_welch_2025.ipynb
  output: claim:fig4abc-sniff-frequency-higher
  measured:
  - 14
  - 13
  notes: Sessions with a usable signal 14 DOI and 13 saline, the expected counts, after the code's four
    faulty sessions are dropped. Pooled sniff frequency higher on DOI under every reading. Reading (a),
    per-session 5th to 95th percentile and 10 to 1000 ms, 190947 and 153863 sniffs, mean 7.78 against
    7.55 Hz, Z = 25.2; reading (b), per condition, Z = 28.4; the code's computation without further exclusion
    Z = 19.5 (paper Z = 24.9). No permutation of 10000 as extreme under any reading (p < 0.0001).
  deviations:
  - The file's sniff cycles are the detections the code reads (sniff_params.mat, rows without exhalation
    already dropped); whether the Methods' percentile exclusion was applied before export is not known,
    so readings (a) and (b) of the criterion and the code's computation were all run, and all match.
  - The Fisher-Pitman test is computed here (standardised sum of the DOI group, 10000 random permutations)
    in place of coin::oneway_test; its random permutations differ from R's.
- claim: fig4supp-ks-every-mouse
  outcome: partially_reproduced
  notebook: reproduce_welch_2025.ipynb
  output: claim:fig4supp-ks-every-mouse
  measured: 11
  notes: 13 mice have matched usable sessions, the expected 13. One-sided KS (DOI stochastically larger),
    reading (a) 11 of 13 at p < 0.001, with 2209 and 2211 at p = 0.0031 and 0.0063; the code's computation
    also 11 of 13 (p = 0.0059 and 0.011); reading (b) 13 of 13. All 13 have p < 0.05 under every reading.
    11 of 13 is at least two thirds, so partially reproduced under the adopted reading (a). Per-mouse
    medians are higher on DOI in only 8 of the 13 mice (reading a; lower in 2202, 2204, 2208, 2209 and
    2211), so a significant one-sided KS test here does not by itself show the higher-shifted distribution
    the statement describes.
  deviations:
  - Assumed, the 5th to 95th percentile exclusion is applied per session (reading a). The readings give
    different outcomes (reproduced under b, partially reproduced under a and under the code's computation
    from the deposited cycles), and the percentile exclusion is a method detail, so the reading the paper
    best supports is adopted. The Methods place it in the initial MATLAB pre-processing of each recording,
    before the signals were exported ("Initial pre-processing of sniff was performed in MATLAB ... Sniffs
    with duration less than the 5 th percentile and greater than the 95 th percentile were excluded from
    analysis. Exported sniff signals ... were imported into R"; Methods, Figure 4), which is a per-session
    exclusion.
  assumed: true
