outcomes:
- claim: fig1b-accuracy-lower-doi
  outcome: reproduced
  notebook: reproduce_welch_2025.ipynb
  output: claim:fig1b-accuracy-lower-doi
  measured: 22
  notes: 22 mice with paired sessions, the expected 22. Odor-trial accuracy is lower on DOI in 14 of 22
    mice (median DOI 90.7 against saline 92.4 percent, median difference -3.2 points), signed-rank V =
    57, p = 0.023 (paper 0.024). Omission-trial accuracy, the variant, median difference -5.2 points,
    p = 0.37. By sex neither group alone is significant (females p = 0.11, males p = 0.13).
  deviations:
  - Statistics are computed in Python with R's defaults reproduced (exact signed-rank and rank-sum tests
    below 50 values without ties, otherwise the normal approximation with continuity correction).
- claim: fig1c-accuracy-time-bins
  outcome: reproduced
  notebook: reproduce_welch_2025.ipynb
  output: claim:fig1c-accuracy-time-bins
  notes: Mean rolling accuracy per mouse and 5 min bin, rank-sum tests per bin. Saline is higher in every
    bin. p = 0.0076, 0.0037 and 0.0070 in the 10-15, 15-20 and 20-25 min bins, p = 0.039 in 35-40 (paper
    0.039), p = 0.052 in 30-35 (not significant, as stated). The bins the text does not state, 0-5 p =
    0.51, 5-10 p = 0.073, 25-30 p = 0.018. 21 or 22 mice per bin and condition. The per-bin fraction correct
    variant is significant only in 5-10 and 10-15 min. Whether the criterion should also require the
    25-30 min bin, which the paper's sentence covers, is asked of a reader in questions/001863.yaml; the
    bin is higher on saline at p = 0.018, so the outcome would not change.
  deviations:
  - Statistics are computed in Python with R's defaults reproduced (exact signed-rank and rank-sum tests
    below 50 values without ties, otherwise the normal approximation with continuity correction).
- claim: fig1d-fewer-trials
  outcome: reproduced
  notebook: reproduce_welch_2025.ipynb
  output: claim:fig1d-fewer-trials
  notes: Reading (a), odor trials (the code), DOI lower in 16 of 22 mice, median difference -9.5 trials,
    p = 0.011 (paper 0.011). Reading (b), all trials (the Methods), median difference -8, p = 0.018. Both
    readings match.
  deviations:
