  outcome: not_reproduced
  notebook: reproduce_welch_2025.ipynb
  output: claim:fig3d-speed-iti-lower
  notes: ITI speed lower on DOI in 15 of 22 mice, median 5.57 against 5.76 cm/s, median difference -0.60
    cm/s, p = 0.079 with the claims file's method (paper 0.036); the criterion's p < 0.05 is not met,
    and it names no partial outcome. Fitted clock p = 0.054 (10 mice with good fits p = 0.084). Rank-sum
    variant p = 0.57. The direction is as stated. The signed-rank p is the same under an exact null
    distribution counted directly (0.0794). With the Methods' cleaning thresholds replaced, likelihood
    cutoff 0.90 gives p = 0.043 and 0.99 p = 0.13; jump limits of 6 to 16 px give 0.079 to 0.092.
  deviations:
  - The claims file fixes the code's frame clock (frame i at i / 80 s); the data check shows it does not
    align the tracking with the trial table (median nose displacement over a trial about 0 px), while
    a per-session linear clock fitted here (about 80.5 frames/s in the later cohort, 72 to 75 in the first)
    does. The claim is tested with the code's clock and the fitted clock is shown as a variant, a check
    made here and not the paper's method.
  - Under the fitted clock speed is scaled by the fitted rate, the frames being that far apart under it.
