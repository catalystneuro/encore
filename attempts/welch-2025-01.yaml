- kind: metadata_error
  statement: 'The pose series carry no frame times; their stated rate is an estimate made at conversion
    (frames over the last trial''s end time, 72.7 to 85.3 frames/s), and with it the tracking does not
    line up with the trial table. A linear clock fitted per session to the nose''s movement over trials
    does (median 80.47 frames/s in the later cohort and 73.71 in the first, offsets of -10.5 to 14.0 s);
    30 of 44 sessions have a good fit (the nose moves 100 px or more over a trial, offsets in the two
    halves of the session within 1 s of each other, and the implied video covers the trials and ends at
    most 2 min after the last one). The fit is weakest in the two sessions of mouse 2197 (27 and 79 px),
    and the 71.0 frames/s fit of 2204 DOI would end the video 311 s after the last trial. The HTR times
    are on the video''s frame clock at 80 frames/s (frame t x 80): the nose moves most within 1 s of them
    in all 22 DOI sessions, against 8 when they are placed by the fitted trial clock.'
- kind: code_mismatch
  statement: The paper's code (fig3_cleaned.Rmd and fig5_cleaned.Rmd) places tracking frame i at i / 80
    s and compares HTR video times directly with trial times. On these data that clock does not align
    frames with trials (median nose displacement over a trial about 0 px against hundreds with a fitted
    clock). With the fitted clock the within-trial speed difference (Figure 3C) and the within-trial HTR
    preference for x vanish, and HTRs are about a third as frequent within trials as in the ITI, against
    the paper's Figure 5F.
- kind: metadata_insufficient
  statement: The series processing/behavior/task_event_timestamps is the head-twitch times (by the conversion
    script's source folders and the paper's code), but the files call it only "Event times (s) from Time
    Stamps Task" with data all 1.
- kind: metadata_error
  statement: In the 27 later-cohort sessions the HTR timestamps came as HH:MM:SS:FF video timecodes whose
    last field is a frame count at 80 frames/s (never above 79); the conversion stored it as hundredths
    of a second (FF / 100 against FF / 80), so the stored times are early by up to 0.2 s.
- kind: code_mismatch
  statement: fig5_cleaned.Rmd reads the last field of the later cohort's HTR timecodes as thousandths
    of a second, while it is a frame count at 80 frames/s, making the HTR times early by up to 0.9 s; the
    outcomes here do not change with the reading.
- kind: metadata_error
  statement: The subject sex of the saline session of mouse 2182 (sub-2182_ses-2182-31) is female, while
    its DOI session and the paper's code give male.
- kind: metadata_insufficient
  statement: The trial columns are described only by their names (odor_control, side, outcome, iti_time,
    false_alarm, repoke); the codes are not explained. The session notes show side 2 is left and side
    1 right in all 34 later-cohort sessions, and the code gives odor_control 0 as an odor trial and 3
    as an omission trial.
- kind: other
  statement: In the five first-cohort mice 347 trials have a set ITI of 16 to 25 s, while the Methods
    give a variable ITI of 1 to 15 s.
- kind: selection_undocumented
  statement: The paper's code drops four sniff sessions as faulty (2195 DOI, 2198 DOI, 2198 saline, 2213
    saline), without a stated reason; the dandiset keeps them without a flag, though their descriptions
    show many rows dropped for a missing exhalation (34772 of 35633 in 2198 DOI, 33144 of 34034 in 2198
    saline, 2405 of 7577 in 2213 saline). Among the sessions the code keeps, 2200 saline lost 7933 of
    14626 rows the same way.
- kind: paper_inconsistency
  statement: The Results name the Wilcoxon rank-sum test for the speed comparisons of Figure 3C, 3D and
    its supplement, while the Methods and the code use the paired signed-rank test; the two give different
    p-values here (for example 0.51 against 0.063 for Figure 3C).
- kind: methods_unavailable
  statement: Question for the authors, on fig5ab-occupancy-similar. The paper tests no difference in occupancy
    and gives no arena coordinates, so the corners of its prediction are not defined. This attempt took
    the 0.5th to 99.5th percentile box of all nose positions and corner squares of 5 and 10 cm; which
    region of the arena did the authors mean by its corners?
- kind: methods_unavailable
  statement: Question for the authors, on the speed and HTR claims split by trial period. Were the tracking
    frames of DLC_tracked_task aligned with the trial summary times by any record of frame times, or only
    by the 80 frames/s of fig3_cleaned.Rmd? The data here align only with a per-session rate near 80.5
    frames/s (72 to 75 in the first cohort) and an offset of a few seconds.
- kind: methods_unavailable
  statement: Question for the authors, on fig4supp-ks-every-mouse. Was the exclusion of sniffs below the
    5th and above the 95th percentile of duration computed per recording, or over all recordings of a
    condition, and is it already applied in the deposited sniff cycles? The per-mouse KS test gives p
    < 0.001 in 13 of 13 mice with percentiles over a condition, and in 11 of 13 with percentiles per session
    or with the deposited cycles as they are (2209 and 2211 at p = 0.003 to 0.011). This attempt assumed
    per session.
