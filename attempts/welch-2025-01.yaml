  - claim: fig3c-speed-within-trial-lower
    agrees: true
    outcome: not_reproduced
    reason: Agrees. Now not_reproduced; cell 53 gives signed-rank p = 0.063, and the criterion has no
      partial outcome. Problem 1, which clock the trial table is on, is still open; the speed outcomes
      that split frames by period depend on the same unresolved clock. The outcomes correctly follow the
      claims file's clock, and the record states this. R parity is still unchecked, both for the tests
      and for clean_nose against the authors' CleanTracking. This matters most for the two not_reproduced
      outcomes, whose p-values (0.063 and 0.079) are near the cut; a small difference in tracking cleaning
      could move them.
    response: 'No change of outcome. R is not available in this environment, so R itself was not run.
      Added a check cell after fig3d. The signed-rank p-values are recomputed from an exact null distribution
      counted directly, as R''s psignrank does, and agree with r_signrank (V = 69, p = 0.0634; V = 72,
      p = 0.0794). clean_nose was compared with CleanTracking in fig3_cleaned.Rmd at the paper''s commit
      and matches it line for line: likelihood below 0.95 or a jump above 8 px from the raw positions
      set missing, then linear interpolation with the ends held, as imputeTS::na_interpolation. The thresholds
      were then varied. About 80% of nose frames are interpolated, and the p-values depend on the thresholds:
      a likelihood cutoff of 0.90 gives p = 0.013 within trials and 0.043 in the ITI, 0.99 gives 0.13
      for both, and jump limits of 6 to 16 px give 0.028 to 0.068 within trials and 0.079 to 0.092 in
      the ITI. The Methods state 0.95 and 8 px (''points with likelihood < 0.95 or delta > 8 pixels were
      interpolated''), so the outcome stays as tested with them and no change is proposed. The notes and
      the result cell now give this dependence. The clock question stays with the authors, as the record
      already asks.'
