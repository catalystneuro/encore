- claim: fig5ab-occupancy-similar
  outcome: reproduced
  notebook: reproduce_welch_2025.ipynb
  output: claim:fig5ab-occupancy-similar
  notes: 22 mice. Occupancy entropy (48 px bins) median DOI 7.20 against saline 7.13 bits, p = 0.063;
    fraction of frames in 5 cm corner squares 0.267 against 0.245, p = 0.25; in 10 cm corner squares 0.850
    against 0.862, p = 0.70. No measure differs at p < 0.05. The grand-mean maps correlate with r = 0.919.
    At the code's 0.0237 cm/px the arena box is 27.5 by 15.6 cm, so 10 cm corners hold 85% of frames and
    that reading says little; the corners also hold the reward ports.
  deviations:
  - The paper reports no test; the measures and corner sizes are the claims file's readings of the paper's
    prediction.
  - Assumed, the arena box for the corners is the 0.5th to 99.5th percentile of all nose positions pooled
    over sessions (x 22 to 1181, y 14 to 674 px), as the paper gives no arena coordinates; with entropy
    far from significance in either direction and corner fractions at p = 0.25 and 0.70, a box a few cm
    larger or smaller is unlikely to change the outcome, but this was not run.
  assumed: true
