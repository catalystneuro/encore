- claim: fig3c-speed-within-trial-lower
  outcome: not_reproduced
  notebook: reproduce_welch_2025.ipynb
  output: claim:fig3c-speed-within-trial-lower
  notes: With the claims file's method (code clock, signed-rank test) within-trial speed is lower on DOI
    in 16 of 22 mice, median 6.34 against 6.62 cm/s, median difference -0.63 cm/s, p = 0.063 (paper 0.011);
    the criterion's p < 0.05 is not met, and it names no partial outcome. The rank-sum test the Results
    name gives p = 0.51. With the fitted clock, which aligns frames with trials, median difference -0.49
    cm/s, p = 0.75 (10 mice with good fits in both sessions p = 0.92). By sex (code clock), males p =
    0.027, females p = 0.52. 1125 of 8.3 million frames are above 160 cm/s. The signed-rank p is the
    same under an exact null distribution counted directly (0.0634). The cleaning follows CleanTracking
    in fig3_cleaned.Rmd and the Methods' thresholds (likelihood < 0.95 or delta > 8 px interpolated),
    which interpolate a median 80% of nose frames; the p-value depends on them (likelihood cutoff 0.90
    p = 0.013, 0.99 p = 0.13; jump limit 10 px p = 0.043, 6 px p = 0.068).
  deviations:
  - The claims file fixes the code's frame clock (frame i at i / 80 s); the data check shows it does not
    align the tracking with the trial table (median nose displacement over a trial about 0 px), while
    a per-session linear clock fitted here (about 80.5 frames/s in the later cohort, 72 to 75 in the first)
    does. The claim is tested with the code's clock and the fitted clock is shown as a variant, a check
    made here and not the paper's method.
  - Under the fitted clock speed is scaled by the fitted rate, the frames being that far apart under it.
