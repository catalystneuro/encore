- claim: join-link
  outcome: reproduced
  notebook: reproduce_yang_2026.ipynb
  output: claim:join-link
  notes: All 4,430 join rows match a file by stem (100%), and all 4,430 matched files agree with their row
    on session id, subject id and full genotype. Five files have no row, the four of subject 636828314 that
    IPFX cannot open and sub-650125704_ses-653191386. The regime membership computed here equals the join's
    in_long_pulse, in_ramp and in_brief_pulse for every cell (4,344, 4,139 and 4,422 in both, 0 on one side
    only). The join also gives two files with identical recordings different Cre lines and t-types (finding
    1).
