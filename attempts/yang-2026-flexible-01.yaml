findings:
- kind: metadata_error
  severity: critical
  statement: Two files hold the same recording. sub-673135474_ses-680563483 and sub-673135516_ses-680897463
    are from different mice, and the paper's join (Allen metadata) gives them different Cre lines (Vip-IRES-Cre
    and Ndnf-IRES2-dgCre), t-types (Vip Lmo1 Myl1 and Lamp5 Lsp1), layers and transcriptomic samples, yet
    the voltage traces of all their usable long squares are identical (SHA-1) and so are all 93 of their IPFX
    features. At most one of the two cells' recordings is in the dandiset, and one file carries another cell's
    data. No other two files share a trace or a feature vector.
- kind: format_error
  severity: minor
  statement: The four files of subject 636828314 (sessions 637823738, 637824890, 637833126, 637838825) list
    two response series for sweep number 1 in their sweep table, so IPFX cannot open them. The paper's join
    has no row for them either.
- kind: metadata_insufficient
  severity: minor
  statement: The files hold no transcriptomic label or sample identifier; the t-types, subclasses and RNA
    sample ids of these Patch-seq cells come only from the Allen metadata, joined by session or file name.
    The Cre line can be read from the subject genotype, which agrees with the Allen metadata for every cell.
- kind: other
  about: data
  severity: none
  statement: Every count the paper reports for the dataset is in the files; 4,435 files, 4,430 joined to the
    paper's metadata, and IPFX features that give the paper's 4,344, 4,139 and 4,422 cells per regime, its
    42, 20 and 21 retained features and its k80. Sessions and subjects in the files equal the paths, and the
    voltage response of every cell's most hyperpolarizing long square begins at the stimulus onset (median
    change 0.01 mV in the 10 ms before onset, -15.3 mV 15 to 25 ms after), so stimulus and response share
    a clock.
- kind: methods_unavailable
  about: paper
  statement: 'Question for the paper''s author. The code does not hold the script that ran IPFX on all cells:
    which IPFX version and call made results/features/ipfx_cell_features.csv, and what sets extract_ok = 1?
    This attempt used IPFX 2.1.2 through its per-regime functions and took extract_ok = 1 for a file that
    opened and ran; the resulting cells and features equal the paper''s, so the choice made no difference
    here, but the paper should state it. The script that wrote results/q3b/q3b_primary_null_1000.csv (Table
    2 rows m and n) is also missing.'
- kind: other
  about: paper
  statement: The A_t values of Table 2 (rows d to i) depend on an arbitrary order. The code ranks the binary
    t-type mismatch with np.argsort(np.argsort(x)), so the tied 0s and 1s are ordered as the sort leaves them,
    and the coefficient carries an offset, shared with its null, that moves with the pair sample and with
    the sort implementation. Run with the code's own draws and seed 0 on the paper's published PCA scores,
    it gives A_t 0.0368, 0.0318 and 0.0105 against the printed 0.0214, 0.0250 and 0.0213, while A_t minus
    the null mean (0.0264, 0.0261, 0.0161) equals the printed difference (0.0264, 0.0266, 0.0166). The significance
    against shuffles holds; the printed values have less precision than their three decimals suggest, and
    A_t minus the null mean, or the tie-corrected Spearman, would be reproducible.
- kind: other
  about: paper
  statement: In the split-half analysis the random fallback split draws its permutation from a generator made
    afresh with seed 0 for each cell, so every cell with the same number of sweeps gets the same permutation,
    and the seed decides which cells form the pool. With seed 0 this attempt gets the paper's 3,598 cells
    exactly (358 random splits); with the seeds 1000 to 4000 the pool has 3,582 to 4,100 cells, and with another
    seed 3,256. The paper reports the pool without saying that it depends on the seed.
