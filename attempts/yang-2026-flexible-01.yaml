  - 5
  - 4054
  - 4336
  - 4134
  - 4049
  notes: The paper's rule (at most 30% missing, nonzero variance) on the features extracted here keeps exactly
    the paper's lists of 42, 20 and 21 features under both readings of the denominator (2a and 2b). Cells
    4,344, 4,139 and 4,422; k80 11, 3 and 5 (cumulative variance 0.822, 0.883, 0.824); overlaps 4,054, 4,336,
    4,134 and 4,049. Every value equals the paper's, and the cells are the ones the paper's join lists for
    each regime. Of 4,431 files opened, IPFX's long-square extraction failed in 87, the short-square in 9
    and the ramp in 2.
  deviations:
  - Features from IPFX 2.1.2 (the current release) through its per-regime functions extract_cell_long_square_features,
    extract_cell_short_square_features and extract_cell_ramp_features, with the code's epoch repair and sweep
    filter; the paper's IPFX driver script and IPFX version are not in its code (claims file, table1-phenotype-spaces,
    reading 1a).
  - extract_ok is not defined in the paper or its code. Assumed here to be 1 when the file opened as an IPFX
    data set and the three regime extractions ran, each regime allowed to fail on its own, as IPFX's own cell
    state counts a cell failed only when every part failed. The cell sets this gives equal the paper's own
    regime membership (join-link), so the claims built on these spaces do not depend on the choice.
  - Sweeps are read from the HDF5 file with h5py in place of pynwb, for speed (patchseq._fast_reader); the
    notebook shows that the features, split halves and clock values equal those of IPFX's own reader on eight
    files across the dandiset.
