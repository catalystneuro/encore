findings:
- kind: selection_undocumented
  about: paper
  statement: The paper analyses 102 sessions and 1437 populations without saying how the sessions were chosen. The dandiset
    holds 153 ecephys sessions of 81 mice, every one with populations that pass the paper's rule (at least 30 units, subregion
    in at least eight sessions) and with the gray-screen epoch, and no grouping by genotype (59, 49, 45), image set and novelty
    (68, 10, 10, 65) or probe count (142 with six probes) gives 102, so the paper's selection cannot be rebuilt; population
    and window counts here are about 1.5 times the paper's. Which 102 sessions were used?
- kind: methods_unavailable
  statement: No unit selection is stated. Scaled to 102 sessions, all units give 1.28 to 1.43 times Table I's area neuron
    counts, and the Allen quality filters (ISI violations < 0.5, amplitude cutoff < 0.1, presence ratio > 0.9) 0.34 to 0.55
    times, dropping NOT. The filter of the Allen Institute's Visual Behavior Neuropixels tutorial (snr > 1, ISI violations
    < 1, firing rate > 0.1 spikes/s) gives 0.93 to 1.02 times, with neurons per population within 5% of Table I's, and is
    adopted here; ten outcomes differ under one of the other two. Which units form a population?
- kind: methods_unavailable
  statement: The ISI-shuffled surrogate is defined per analyzed window (Methods II.E). Shuffled within each 100-s window,
    surrogate CV series stay correlated across regions (up to |r| 0.90, 143 to 241 of 325 pairs above 0.2), because each window
    keeps its spike count; the paper says shuffling abolishes these correlations. Were the 10-s CV series of Fig. 1d computed
    from surrogates shuffled over a longer span, and where does the shuffled train start?
- kind: methods_unavailable
  statement: The JS divergences of Figs. 2b and 4e to 4h do not give their histogram bins or log base, the 'main diagonal
    of each submatrix' that is summed is zero for a region-pair matrix, and the percentage difference is not defined. The
    results here depend on these choices (for example active against blanks 3.1% to 11.2% in visual cortex under the adopted
    unit filter, 0.3% to 9.5% with all units). What were they?
- kind: methods_unavailable
  statement: The test of 'significant modulation across conditions' (Results III.D, paragraph 3) and of 'all pairwise comparisons'
    (paragraph 2) is not named, nor whether it is run on windows or on populations. For four of the seven 'unmodulated' thalamic
    nuclei (MGd, SGN, MGm, MGv) a Kruskal-Wallis test on windows gives p < 0.001, and Mann-Whitney tests of each visually
    driven condition against spontaneous activity find three of them (MGd, SGN, MGv); tests on one median per population find
    the same four. Only a pairwise reading that needs all three conditions to differ from spontaneous activity finds none.
    Which test was used?
- kind: methods_unavailable
  statement: The Fig. 5 trajectories give no CV bin width or minimum count per bin, and the Fig. 3a reference systems give
    no series length, transient or sine sampling (the sine's position depends on its sampling). Their parameter values are
    not in the text but are labelled in the figure; at those values the series here match 16 of the figure's 18 markers within
    0.03. What were the lengths and the sampling?
- kind: methods_unavailable
  statement: Methods II.A gives the blank series as about 240 s per image, which needs about 480 flashes per image. The flash
    tables show each image 320 to 1056 times per session (median 572.5), so the series is about 286 s (median; 271 s without
    change flashes, 275 s when only gray screens followed by another flash are kept). How were the blank intervals chosen
    (change flashes, omitted flashes, licks)?
- kind: other
  about: data
  severity: none
  statement: Checks that passed. The 153 sessions each have an active block of 3599 to 3611 s, a 289-s gray screen after it,
    eight images and 1103 to 3388 units; no two sessions share a spike-time fingerprint, total spike count, or subject and
    start time. Visual cortex spikes rise after flash onsets in all 153 sessions (30 to 130 ms window minus the 100 ms before,
    69 to 434 spikes per flash) and not after onsets shifted by 375 ms (-371 to 1.6); the true-onset response also exceeds
    the one after omitted flashes in all 153, so the spike times share the stimulus table's clock.
- kind: other
  about: data
  severity: none
  statement: Some units carry generic location labels (TH, MB, HPF) or labels outside the paper's list (Eth, LGv, ZI); the
    paper's 26 subregions are all present as labels, and the generic labels are left out here as in Table I.
- kind: methods_unavailable
  statement: Fig. 1d and 1e do not say how the CV correlations of a region pair are combined over the sessions that record
    both. Concatenating the series gives a top-10% range of 0.469 to 0.798 and CA3 and NB tied as the leading anticorrelation
    hubs (8 pairs each; NB alone with all units); averaging the per-session correlations gives 0.478 to 0.680 with DG and
    CA3 as the hubs, which matches the paper and is adopted here. Which was used?
- kind: paper_inconsistency
  statement: Results III.C places exponentially correlated processes at C 0.3 to 0.5 for H 0.3 to 0.6 and the sine at H near
    0, but Fig. 3a shows the correlated Brownian motion at C 0.22 to 0.35 (alpha 0.89, 0.47 and 0.16, the middle one at H
    0.35, C 0.27) and the sine at H about 0.11, which is close to the least H a sine can have at D = 6 (ln 2 / ln 720 = 0.105).
    Series made here at the figure's parameters match its markers, so the figure and not the text gives the positions of these
    systems.
