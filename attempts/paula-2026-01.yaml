    The ''qc'' reading is shown as a variant where it bears on the claim.'
  - All 153 ecephys sessions are used, against the paper's 102; the paper does not say how its sessions were chosen,
    and every session meets both session readings of the claims file.
  assumed: true
findings:
- kind: selection_undocumented
  about: paper
  statement: The paper analyses 102 sessions and 1437 populations without saying how the sessions were chosen. The
    dandiset holds 153 ecephys sessions of 81 mice, every one with populations that pass the paper's rule (at least
    30 units, subregion in at least eight sessions) and with the gray-screen epoch, so the paper's selection cannot
    be rebuilt; population and window counts here are about 1.5 times the paper's. Which 102 sessions were used?
- kind: methods_unavailable
  statement: No unit selection is stated. With all units, Table I's neuron counts are 1.5 to 3.0 times smaller than
    here per subregion; with the Allen quality filters (ISI violations < 0.5, amplitude cutoff < 0.1, presence ratio
    > 0.9) they are 1.1 to 4.4 times larger, and NOT drops out. Which units form a population? Almost every outcome
    here rests on the choice of all units.
- kind: methods_unavailable
  statement: The ISI-shuffled surrogate is defined per analyzed window (Methods II.E). Shuffled within each 100-s
    window, surrogate CV series stay correlated across regions (up to |r| 0.80, 115 to 213 of 325 pairs above 0.2),
    because each window keeps its spike count; the paper says shuffling abolishes these correlations. Were the 10-s
    CV series of Fig. 1d computed from surrogates shuffled over a longer span, and where does the shuffled train
    start?
- kind: methods_unavailable
  statement: The JS divergences of Figs. 2b and 4e to 4h do not give their histogram bins or log base, the 'main
    diagonal of each submatrix' that is summed is zero for a region-pair matrix, and the percentage difference is
    not defined. The results here depend on these choices (for example active against blanks 0.3% to 9.5% in visual
    cortex). What were they?
- kind: methods_unavailable
  statement: The test of 'significant modulation across conditions' (Results III.D, paragraph 3) and of 'all pairwise
    comparisons' (paragraph 2) is not named. For four of the seven 'unmodulated' thalamic nuclei a Kruskal-Wallis
    test gives p < 0.001 and pairwise Mann-Whitney tests do not, so the outcome of the claim depends on the test.
    Which test was used?
- kind: methods_unavailable
  statement: The Fig. 5 trajectories give no CV bin width or minimum count per bin, and the Fig. 3a reference systems
    give no series length, sampling or parameter values in the text (the sine's position depends on its sampling;
    the Ikeda map with u = 0.9 and p in [5, 17] gives H 0.11 to 0.38 here, not near maximum complexity). What were
    they?
- kind: methods_unavailable
  statement: Methods II.A gives the blank series as about 240 s per image; the flash tables give about 287 s (median;
    273 s when only gray screens followed by another flash are kept), from about 4600 shown flashes per session.
    How were the blank intervals chosen (change flashes, omitted flashes, licks)?
- kind: other
  about: data
  severity: none
  statement: Checks that passed. The 153 sessions each have an active block of 3599 to 3611 s, a 289-s gray screen
    after it, eight images and 1103 to 3388 units; no two sessions share a spike-time fingerprint, total spike count,
    or subject and start time. Visual cortex spikes rise after flash onsets in all 153 sessions (30 to 130 ms window
    minus the 100 ms before, 69 to 434 spikes per flash) and not after onsets shifted by 375 ms (-371 to 1.6); the
    true-onset response also exceeds the one after omitted flashes in all 153, so the spike times share the stimulus
    table's clock.
- kind: other
  about: data
  severity: none
  statement: Some units carry generic location labels (TH, MB, HPF) or labels outside the paper's list (Eth, LGv,
    ZI); the paper's 26 subregions are all present as labels, and the generic labels are left out here as in Table
    I.
