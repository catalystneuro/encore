findings:
- kind: metadata_insufficient
  statement: The imaged region is recorded for 864 of the 12394 images (7.0%), and for 561 of the 7048
    200X Abeta42 images, only where an original follow-up subfolder named it; 38 of the 62 mice have no
    region on any image, and the nucleus of the lateral lemniscus is never named. None of 20 sampled image
    headers and sidecars holds a stage position, section number or atlas coordinate. The images of the
    main imaging pass cannot be assigned to a region, an A1 layer or a subdivision, so none of the paper's
    per-region values can be formed from the dandiset.
- kind: data_missing
  statement: 'The dandiset holds the raw images only: none of the cell and plaque markings, region and
    laminar boundaries, CCFv3 alignments, region areas or DAPI counts on which every figure and table
    of the paper rests.'
- kind: data_missing
  statement: The 25 wild-type control mice of the paper are not in the dandiset; its README says they
    showed no detectable label and were not imaged. The paper's control claim cannot be tested.
- kind: other
  statement: 'The dandiset has 62 5XFAD mice, against the paper''s 61: p120 has 9 mice (5 females, 4 males)
    and p45 has 3 females and 5 males, where the paper gives 4 males and 4 females at every age from p21
    to p150. In all 30 females and 32 males. Sex, age and subject label agree with the original folder
    names for every mouse.'
- kind: paper_inconsistency
  statement: The Methods (Mice) give 61 5XFAD mice as '31 females and 30 males', but the per-age numbers
    they give (4 and 4 from p21 to p150, 2 females and 3 males at p14) add up to 30 females and 31 males.
- kind: other
  statement: Magnification is not recorded reliably by the acquisition software; the dandiset infers it
    from image content, and assigns 7125 Abeta42 and red-channel images to 200X by rule. On a seeded sample,
    DAPI nuclei measure about the same median diameter in the 100X and 200X classes (4.2 and 5.1 um from
    .czi files) and a 100X field holds 3.6 times as many, consistent with the stated scales; the images
    classed by rule were not checked.
