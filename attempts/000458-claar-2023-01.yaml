- claim: fig1e-erp-duration
  outcome: reproduced
  notebook: claar_eeg.ipynb
  output: claim:fig1e-erp-duration
  measured:
  - 0.44
  - 0.53
  notes: High current, all awake trials, duration as total time above z = 3; superficial 0.44 +/- 0.14 s
    (n = 12), deep 0.53 +/- 0.06 s (n = 18), t-test p = 0.51. Quiet trials give 0.42 and 0.55 s,
    p = 0.37. Reading (b), onset to the last sample above z = 3, gives 0.85 and 0.93 s, out of
    tolerance. At the medium current the means are 0.24 and 0.44 s and the difference is significant
    (p = 0.027 all awake, 0.031 quiet), so the absence of a depth effect holds at the high current only.
    The n of 12 superficial sites matches the paper once the site whose pulses are all marked invalid is
    left out.
  deviations:
  - The current the paper analysed is not given; the highest and the middle current of each site were
    both run (claims file, header).
  - Zero-phase filtering (sosfiltfilt) is a standard choice; the Methods do not say.
- claim: fig1f-erp-magnitude
  outcome: reproduced
  assumed: true
  notebook: claar_eeg.ipynb
  output: claim:fig1f-erp-magnitude
  measured:
  - 2.90
  - 5.33
  notes: Reading (b), the area above z = 3 divided by the area under |z| in the baseline, quiet trials,
    high current; superficial 2.90 +/- 0.94, deep 5.33 +/- 0.71, p = 0.044. With all awake trials the same
    reading gives 3.35 and 5.52, p = 0.076. Reading (a), the area above z = 3, gives means within
    tolerance at the high current (3.49 and 6.59 all awake, p = 0.089; 3.26 and 6.69 quiet, p = 0.053) and
    a significant difference at the medium current with means below tolerance (1.79 and 4.44, p = 0.022).
  deviations:
  - The Methods divide by "the area under the baseline window", which for a z-scored GFP is zero (largest
