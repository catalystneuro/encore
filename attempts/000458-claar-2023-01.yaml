findings:
- kind: data_missing
  statement: The depth of the stimulating electrode in mm and its position are not in the files; the trial
    table gives only the target area and the label "superficial" or "deep". The paper's stimulation depths
    and the spatial analysis of the first ERP peak cannot be tested.
- kind: metadata_insufficient
  statement: Probe channels and units carry CCF area acronyms without cortical layers (MOs, SSp-ll, ...), so
    the layer-resolved CSD analyses of Figure 6 (a sink at the border of layers 2/3 and 5, CSD by layer)
    cannot be run from the files, and the exclusion of layer 1 in Figure 3 can only be approximated (here by
    the top 100 um of each area).
- kind: metadata_error
  statement: The units' waveform_duration is described as the mean duration in seconds, but its values (0.10
    to 2.07, median 0.58) are in milliseconds.
- kind: metadata_insufficient
  statement: The units are described as those that passed the authors' quality threshold, which is not
    stated. All meet ISI violations < 0.5 and amplitude cutoff < 0.1, but presence ratios go down to 0.02,
    so the threshold is not the three metrics of Siegle et al. (2021) that the paper cites.
- kind: other
  statement: The RS unit counts in the Figure 4 legend (870, 4110, 2559 and 9363) are three times the
    counts of the corresponding units in the files (290, 1370, 853 and 3162; exactly three times for the
    first three). Every site with units has three currents, and counting each unit once per current
    gives 870, 4110, 2559 and 9486, so the legend most likely counts unit x current; the paper does not
    say.
- kind: selection_undocumented
  statement: is_valid marks all 720 pulses of the superficial SSp site of subject 586468, and 747 of 1440
    pulses of subject 569070, as invalid, for "large electrical artifacts" or "off target" stimulation,
    without saying which. Leaving out the 586468 superficial site gives the paper's N of 12 superficial
    sites in Figure 1E and 7 in Figure 4.
- kind: methods_unavailable
  statement: Question for the authors. Each stage delivered pulses at three currents; which current, or
    which pulses, do the ERP, PCIst and spiking analyses use? The middle current with all awake trials
    gives the example ERP of Figure 1, figure supplement 1 (1.011 s and 11.133 SD.s against 1.01 and
    11.13) and the p-values of Figures 1E and 1F (0.081 and 0.035 against 0.0843 and 0.0354), which points
    to it; the highest current gives different outcomes, for example ERP durations and magnitudes above
    the paper's and an anesthetized PCIst of 23.5 against 16.5.
- kind: methods_unavailable
  statement: Question for the authors. The ERP magnitude is "divided by the area under the baseline window",
    which is zero for a z-scored GFP. What was the divisor? The figure supplement's undivided area above
    z = 3, in SD.s, reproduces the example and Figure 1F at the middle current, which suggests no division.
- kind: methods_unavailable
  statement: Question for the authors. For the state latencies of Figures 7F and 7G, were responsive units
    selected once (for example from all awake trials) or separately in each state? Selected per state, only
    3 animals keep units in every state and region.
- kind: methods_unavailable
  statement: Question for the authors. For the modulated-unit test, is the pre-stimulus window the one ending
    at onset or the mirror of the post window, and is the Benjamini-Hochberg correction applied per session
    or over all sessions? Both readings were run; neither reproduces Figure 4's fractions.
- kind: other
  statement: The EEG stimulus artifact is largest at the sample before the first EEG sample at or after the
    trial table's start_time in 24 of 30 sites, and at that sample in the other 6, so the start times lag the
    artifact by up to one EEG sample (0.4 ms). A mask that starts at the onset sample leaves the artifact in.
- kind: methods_unavailable
  statement: Question for the authors. The population spiking magnitude of Figure 3 is described as the area
    under the z-scored average spike density, in which a fall below baseline cancels a rise, while the Results
    say the metric "accounts for both reductions as well as increases". Was |z| integrated? In the example
    session the signed integral gives 2.95 in MO and the integral of |z| 28.75 (paper 30.9), and only |z|
    gives the deep medians and the significance pattern of Figure 3D.
