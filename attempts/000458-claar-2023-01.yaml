- claim: eeg-good-electrodes
  outcome: reproduced
  notebook: claar_eeg.ipynb
  output: claim:eeg-good-electrodes
  measured: 23.07
  notes: The EEG electrode table marks good electrodes (is_data_valid). Per subject (the two sessions of
    569073 averaged) the mean is 23.07, SD 4.01, range 17 to 30; per session 23.04, SD 4.14.
  deviations:
