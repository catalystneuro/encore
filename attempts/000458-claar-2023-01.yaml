- claim: fig1d-two-erp-peaks
  outcome: not_reproduced
  notebook: claar_eeg.ipynb
  output: claim:fig1d-two-erp-peaks
  notes: Deep sites show z-scored GFP peaks above 3 in both windows in 18 of 18 under every reading
    (current high or medium, all awake or quiet trials, windows (a) or (b)). Superficial sites without a
    late peak number 0 to 2 of 12 under every reading, so the second half of the criterion fails. The
    late GFP peaks of superficial sites are smaller than those of deep sites (per-site table) but above
    z = 3.
  deviations:
  - The paper gives no peak detection method; the two readings of the criterion were run.
- claim: fig1-supp1-example
  outcome: reproduced
  notebook: claar_eeg.ipynb
  output: claim:fig1-supp1-example
  measured:
  - 1.011
  - 11.133
  notes: The example is subject 571619, deep MOs; it is the only subject with both superficial and deep
    MOs stimulation, which the Figure 1D legend says the example has. All awake trials at the medium
    current (40 uA) give 1.011 s and 11.133 SD.s, with duration and magnitude read as the total time and
    the area above z = 3 (readings a); this is the only reading with both values within tolerance. The
    high current gives 1.169 s and 12.556 SD.s, quiet trials at the medium current 1.040 s and 9.056 SD.s.
  deviations:
  - The current the paper analysed is not given; the highest and the middle current of each site were
    both run (claims file, header).
  - The stimulus artifact peaks at the EEG sample before the first sample at or after the trial onset in 24 of
    30 sites (at that sample in the other 6), so the 2 ms mask of the Methods (-2 to 0 ms copied, reversed,
    into 0 to 2 ms) starts one sample earlier, covering -0.4 to +1.6 ms (claar.MASK_START; verifier, round 1).
- claim: fig1e-erp-duration
  outcome: partially_reproduced
  notebook: claar_eeg.ipynb
  output: claim:fig1e-erp-duration
  measured:
  - 0.33
  - 0.49
  notes: Superficial ERPs are shorter than deep ERPs and the difference is not significant in every reading
    of duration (a), the total time above z = 3. Medium current, all awake trials (the reading that gives
    the example of fig1-supp1-example); superficial 0.33 +/- 0.04 s (n = 12), deep 0.49 +/- 0.06 s (n = 18),
    t-test p = 0.081 (paper p = 0.0843). The deep mean is within tolerance and the superficial mean is 0.02 s
    below 0.4 +/- 0.05. Quiet trials give 0.33 and 0.52 s, p = 0.052. At the high current both means are
    above tolerance (0.56 and 0.65 s, p = 0.53), and reading (b) gives 1.23 to 1.69 s. No reading puts both
    means within tolerance. The n of 12 superficial sites matches the paper once the site whose pulses are
    all marked invalid is left out.
    The result turns on the artifact residue that the zero-phase filter spreads into the last 20 ms of the
    baseline. With the z-score baseline ending 20 ms before the pulse (a variant outside the criterion,
    which fixes -2 to 0 s), the medium current gives 0.37 +/- 0.04 and 0.50 +/- 0.06 s, p = 0.151 (quiet
    trials 0.37 and 0.53 s, p = 0.092), both within tolerance. The outcome stays on the criterion's
    baseline; a causal filter, which would keep the residue out of the baseline within the criterion, was
    not run.
  deviations:
  - The current the paper analysed is not given; the highest and the middle current of each site were
    both run (claims file, header).
  - The stimulus artifact peaks at the EEG sample before the first sample at or after the trial onset in 24 of
    30 sites (at that sample in the other 6), so the 2 ms mask of the Methods (-2 to 0 ms copied, reversed,
    into 0 to 2 ms) starts one sample earlier, covering -0.4 to +1.6 ms (claar.MASK_START; verifier, round 1).
  - Zero-phase filtering (sosfiltfilt) is a standard choice; the Methods do not say.
