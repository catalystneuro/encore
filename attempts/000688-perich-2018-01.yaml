findings:
  - kind: data_missing
    statement: The dandiset holds about 200 reward trials per dual-array center-out session of Monkeys C and M, the size
      of the paper's Baseline epoch, with steady reach errors. The Force, Rotation and Washout epochs that 23 of the
      paper's 28 findings rest on are not in it.
  - kind: metadata_insufficient
    statement: No file or metadata field says which sessions were curl field or visuomotor rotation sessions, which epoch
      the trials belong to, or which 16 sessions the paper analysed. Monkey C has 14 candidate sessions for the paper's
      9.
  - kind: metadata_error
    statement: In seven Monkey C sessions (2016-09-09 to 2016-09-23) the cursor ends rewarded reaches about 4.2 cm from
      the center, with peak speeds near 14 cm/s, while target_corners places every target at 8 cm and the later sessions
      end at about 7.9 cm with peak speeds near 25 cm/s. The paper says Monkey C's first three sessions used 6 cm targets,
      which fits neither.
  - kind: metadata_error
    statement: 'The session description of the seven Monkey C sessions from 2016-09-09 to 2016-09-23 ends in a cut-off
      warning ("Warning: This session with Monkey"), in the files and in the archive''s metadata, so what it warns of
      is lost. These are the sessions whose cursor positions do not match the stored targets.'
  - kind: metadata_error
    statement: In all seven early Monkey C sessions the cursor never enters the square given by target_corners on rewarded
      trials, and in Monkey M 2014-02-03 and 2014-02-18 it enters it on 1% of them.
  - kind: format_error
    statement: The cursor timestamps repeat 8531 times in C 2016-09-23 and 5014 times in C 2016-10-11, so velocities
      computed from them are undefined on many samples.
  - kind: other
    statement: Units above 5 Hz are far fewer than the paper reports, at most 634 M1 and 1224 PMd for any choice of 16
      candidate sessions, against 918 and 2221. Monkey M has 6 to 21 PMd units above 5 Hz per session.
  - kind: methods_unavailable
    statement: Question for the authors. How was the noise scaled in the dimensionality estimate adapted from Machens
      et al. (2010)? The Methods subtract random pairs of trials; taken as it is, that noise exceeds every component
      of the trial-averaged rates and gives 0 dimensions. This attempt assumed the noise of the trial average (difference
      over the square root of 2K) and the 95% rule, which gives medians of 9 and 13.
