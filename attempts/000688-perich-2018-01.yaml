    assumed: true
    notes: Under rule (b) the mean PMd dimensionality exceeds the mean M1 at 40, 50, 60, 70 and all neurons under both
      kernels, both windows and both session sets, by 1.30 to 4.63 (full-width kernel, window a, 1.88 at 40 and 4.52
      with all neurons; standard-deviation kernel, window a, 1.62 and 3.48). Paired by session, PMd is higher in every
      session at every size except one session with all neurons in window (b) under both kernels (20 of 21) and one at
      40 neurons with the full-width kernel in window (b) (16 of 17). Rule (a) gives PMd above M1 at every size except
      40 neurons with the full-width kernel in window (b) (-0.13 and -0.30). The PMd mean falls at small sizes (window
      a, full-width kernel, 13.05 with all neurons and 9.90 at 40). The M1 mean does not fall consistently (window a,
      full-width kernel, 8.52 with all, 8.53 and 8.65 at 60 and 70, 8.03 at 40; window b, full-width kernel, 6.52 with
      all and 6.74 at 40), so the statement's fall is shown for PMd only, outside the criterion. The M1 means at 40
      neurons cover 17 sessions, against 21 for all neurons. M1 sizes of 50 to 70 rest on 11 to 15 sessions, as Monkey M has
      26 to 52 M1 units.
    deviations:
      - The paper's 16 sessions cannot be identified. All 21 dual-array center-out sessions of Monkeys C (2016-09-09
        to 2016-10-21) and M (2014-02-03 to 2014-03-07) are used, and the 19 whose reward counts fit the paper's Baseline
        range (154 to 225) are shown as a second set. All reward trials of each file are taken as Baseline.
      - Assumed that the noise eigenvalues are scaled to the noise of a trial average (the difference of two trials divided
        by the square root of 2K, K the mean number of trials per target). STAR Methods, Dimensionality reduction, says
        only that the activity of random pairs of trials was subtracted; taken as it is, or divided by the square root
        of two, the noise exceeds every component of the trial-averaged data and every estimate is 0, which cannot give
        the paper's medians. All three scalings are shown.
      - 100 subsamples per size (the claims file's standard choice) with 100 noise repetitions per subsample, to fit
        the time limit; the paper's 1000 noise repetitions are kept for all neurons.
      - Run with both kernel readings (standard deviation and full width at half maximum of 100 ms) in windows (a) and
        (b).
  - claim: figs4c-null-potent-index-centered
    outcome: reproduced
    notebook: reproduce_perich_2018.ipynb
    output: claim:figs4c-null-potent-index-centered
    assumed: true
    notes: Over 3263 PMd units of 21 sessions, with absolute values, the mean index is 0.017 to 0.056 across the window
      and kernel readings and no unit exceeds 0.9 in absolute value (range -0.701 to 0.741). With sums of squares three
      of four readings meet the criterion; window (a) with the full-width kernel gives a mean of 0.100085, just above
