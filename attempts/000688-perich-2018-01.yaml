  - claim: methods-neuron-counts
    outcome: partially_reproduced
    notebook: reproduce_perich_2018.ipynb
    output: claim:methods-neuron-counts
    assumed: true
    measured:
      - 114
      - 258
      - 55
      - 95
      - 66
      - 121
      - 26
      - 52
      - 835
      - 1565
    notes: Measured values are over all 21 candidate sessions. Monkey M's 7 sessions give 66 to 121 PMd and 26 to 52
      M1 units, inside the widened ranges. 13 of 14 Monkey C candidates are inside (PMd 137 to 258, M1 55 to 95); C 2016-09-29
      has 114 PMd units, below the lower bound of 123.3. The ranges hold for 715 of the 2002 choices of 9 Monkey C sessions,
      those without C 2016-09-29, which is the assumption the outcome rests on. The pooled counts above 5 Hz hold under
      no choice of 9 Monkey C sessions with the 7 Monkey M sessions (at most 634 M1 and 1224 PMd against 918 and 2221);
      all 21 sessions give 835 M1 (within 10%) and 1565 PMd (outside). Rates over all trials of a file change the counts
      by at most 10. Monkey M has 6 to 21 PMd units above 5 Hz per session. The pooled verdicts of the first table in
      the notebook are for each whole set (21 or 19 sessions); the test on 16 sessions is the second cell.
    deviations:
      - The paper's 16 sessions cannot be identified. All 21 dual-array center-out sessions of Monkeys C (2016-09-09
        to 2016-10-21) and M (2014-02-03 to 2014-03-07) are used, and the 19 whose reward counts fit the paper's Baseline
        range (154 to 225) are shown as a second set. All reward trials of each file are taken as Baseline.
      - The 5 Hz rule uses the trials in the file (Baseline only), from start to stop of each reward trial; all trials
        are shown as a variant. The paper's rate is over the whole session (claims file criterion).
      - The paper excluded cells with high coincidence across channels; the units are counted as deposited.
  - claim: fig3b-pmd-higher-dimensional
    outcome: reproduced
    notebook: reproduce_perich_2018.ipynb
    output: claim:fig3b-pmd-higher-dimensional
    assumed: true
    proposed:
      outcome: partially_reproduced
      reason: The verified outcome uses a kernel of 100 ms full width at half maximum, while fig6c-null-leads-potent uses
        a standard deviation of 100 ms; no one reading gives both verified outcomes (verifier, round 2). One reading is
        adopted for every claim, the standard deviation, as it is the usual way a Gaussian smoothing kernel's width is
        stated and the same group's later paper on Monkey C recordings (Gallego, Perich et al. 2020, Nat. Neurosci.)
        gives its kernel as "s.d. 50 ms". Under it, with rule (b), the noise of the trial average and window (a), the
        medians are 7 (M1) and 10 (PMd) over 21 sessions, outside the tolerance of 8.5 and 14, and outside it in all
        2002 sets of 16 sessions, with PMd above M1 in every session (21 of 21, and in all 2002 sets). The criterion
        counts this as partially reproduced. The notebook shows it in "One kernel reading for every claim" and the fig3b
        cells.
    measured:
      - 9
      - 13
    notes: Over all 21 sessions, under rule (b), window (a) and a kernel of 100 ms full width at half maximum, the medians
      are 9 (M1) and 13 (PMd), within tolerance of 8.5 and 14, and PMd exceeds M1 in 21 of 21 sessions (19 of 19 in the
      second set). Over the 2002 choices of 16 sessions (9 of the 14 Monkey C candidates with the 7 Monkey M sessions)
      this reading gives medians of 8 to 9 and 12 to 13, within tolerance in 910 choices, with PMd above M1 in every
      session in all 2002. With a 100 ms standard-deviation kernel the medians are 7 and 10 over 21 sessions and outside
      tolerance in all 2002 choices, with PMd above M1 in 21 of 21, which would be partially reproduced. Window (b) gives
      medians of 6 to 8 with PMd above M1 in 20 of 21. Rule (a) gives medians of 26 to 47 (M1) and 46 to 78 (PMd); on
      synthetic rank-5 data rule (b) with the adopted noise scale returns 5 in 9 of 9 runs and rule (a) 16 to 45. Raw
      or root-two noise gives 0 dimensions in every session. By monkey (window a, standard-deviation kernel) C has medians
      7 and 10, M 7 and 11, PMd above M1 in every session of both.
    deviations:
      - The paper's 16 sessions cannot be identified. All 21 dual-array center-out sessions of Monkeys C (2016-09-09
        to 2016-10-21) and M (2014-02-03 to 2014-03-07) are used, and the 19 whose reward counts fit the paper's Baseline
        range (154 to 225) are shown as a second set. All reward trials of each file are taken as Baseline.
      - Target acquisition (window a, the claims file's O3) is the trial's stop time minus the 0.5 s target hold, from
        STAR Methods, Behavioral task ("required to hold there for 0.5 s"); the cursor cannot be used, as in several
        sessions it never enters the stored target square.
      - Assumed that the noise eigenvalues are scaled to the noise of a trial average (the difference of two trials divided
        by the square root of 2K, K the mean number of trials per target). STAR Methods, Dimensionality reduction, says
        only that the activity of random pairs of trials was subtracted; taken as it is, or divided by the square root
        of two, the noise exceeds every component of the trial-averaged data and every estimate is 0, which cannot give
        the paper's medians. All three scalings are shown. The choice was made after the raw and root-two scales gave
        0; a synthetic check of known rank (notebook) shows rule (b) with this scale recovers the rank, but the raw
        and root-two scales also recover it there, so the check does not choose between the scales; the choice rests
        on the other scales giving 0 on the real data.
      - The outcome depends on the kernel width, which the claims file expected not to matter (O4). The medians are within
        tolerance with a full width at half maximum of 100 ms and outside it with a standard deviation of 100 ms; the
        criterion accepts one reading, and the full-width reading is the one that meets it. O4 is not among the readings
        the criterion names, and the claims file's header says a claim whose open-detail readings disagree is blocked
        as methods_underspecified; the protocol (author, step 1.6) instead lets the author adopt the best-supported reading
        as an assumption, and that rule is followed. No single kernel reading gives the verified outcomes of both this
        claim and fig6c-null-leads-potent (full width, this claim reproduced and fig6c not reproduced; standard deviation,
        both partially reproduced). The standard deviation is adopted for every claim (proposed change below).
      - The outcome rests on all 21 candidate sessions. Over the 2002 possible sets of 16 sessions the full-width medians
        are within tolerance in 910; the others would give partially reproduced.
      - Trials of unequal length are aligned on the window start and cut to the session's shortest window before averaging
        per target; the paper does not say how they were averaged (a standard choice).
      - All units of each area are used; the paper does not say whether a rate threshold applies here.
  - claim: figs4d-dimensionality-robust-to-size
    outcome: reproduced
