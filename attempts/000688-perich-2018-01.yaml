      and 3.2% of units above 0.9. The index leans positive in Monkey M, whose 599 units have a mean of 0.109 under the
      main reading (above 0.1 if judged alone; session means 0.081 to 0.143), against 0.028 for the 2664 Monkey C units
      (session means -0.007 to 0.081).
    deviations:
      - The paper's 16 sessions cannot be identified. All 21 dual-array center-out sessions of Monkeys C (2016-09-09
        to 2016-10-21) and M (2014-02-03 to 2014-03-07) are used, and the 19 whose reward counts fit the paper's Baseline
        range (154 to 225) are shown as a second set. All reward trials of each file are taken as Baseline.
      - Target acquisition (window a, the claims file's O3) is the trial's stop time minus the 0.5 s target hold, from
        STAR Methods, Behavioral task ("required to hold there for 0.5 s"); the cursor cannot be used, as in several
        sessions it never enters the stored target square.
      - The readings of magnitude disagree in one of eight cases; the sum of absolute values, the claims file's first
        reading of "the magnitude ... summed across all dimensions" (STAR Methods, Output-potent and output-null subspaces),
        is adopted.
      - The one failing reading (sums of squares, window a) uses the full-width kernel. Under the standard-deviation kernel,
        the reading adopted for every claim, all four window and magnitude readings meet the criterion.
  - claim: fig6c-null-leads-potent
    outcome: partially_reproduced
    notebook: reproduce_perich_2018.ipynb
    output: claim:fig6c-null-leads-potent
    assumed: true
    measured: -18.1
    notes: Over the 21 candidate sessions the mean Baseline lag is negative under all 8 readings (-2.4 to -51.4 ms).
      It is significantly negative only with window (a) and the 100 ms standard-deviation kernel, at -18.1 ms (t = -2.29,
      p = 0.033, 10 ms resolution) and -51.4 ms (p = 0.035, interpolated 50 ms activity); in the latter two sessions
      peak within one step of the edge of the search (C 2016-10-06 at -350 ms, C 2016-10-11 at -340 ms), and without
      them the mean is -20.5 ms over 19 sessions (p = 0.034). The full-width kernel and window (b) readings give p from
      0.18 to 0.82. No reading over 21 sessions is within 3.5 ms of -35 ms. Over the 2002 choices of 16 sessions (9 of
      the 14 Monkey C candidates with the 7 Monkey M sessions) the main reading is significantly negative in 763 (38%),
      the 50 ms reading in 478 (816 with edge maxima dropped), and at least one of the 8 readings in 1013 (51%; 1052
      with edge maxima dropped); 12 choices, all with edge maxima dropped at 50 ms resolution, give a significant mean
      within tolerance of -35 ms. The 19-session set gives p = 0.040 for the main reading. By monkey, -22.9 ms (C) and
      -8.6 ms (M). The end-of-Force part of the statement cannot be tested, as no Force trials are in the dandiset; the
      outcome follows the criterion's partial rule on the 21 candidates (significantly negative under one reading, outside
      tolerance) and holds for about half of the possible 16-session sets.
    deviations:
      - The paper's 16 sessions cannot be identified. All 21 dual-array center-out sessions of Monkeys C (2016-09-09
        to 2016-10-21) and M (2014-02-03 to 2014-03-07) are used, and the 19 whose reward counts fit the paper's Baseline
        range (154 to 225) are shown as a second set. All reward trials of each file are taken as Baseline.
      - The t-test is run over all 21 candidate sessions, a superset of the paper's 16, which the outcome rests on; the
        same test on every choice of 16 sessions is shown.
      - Target acquisition (window a, the claims file's O3) is the trial's stop time minus the 0.5 s target hold, from
        STAR Methods, Behavioral task ("required to hold there for 0.5 s"); the cursor cannot be used, as in several
        sessions it never enters the stored target square.
      - The outcome depends on the kernel width, which the claims file expected not to matter (O4). Significance holds
        with a standard deviation of 100 ms and not with a full width at half maximum of 100 ms (p 0.18 to 0.38), which
        would make it not reproduced. The claims file's header says a claim whose open-detail readings disagree is blocked
        as methods_underspecified; the protocol (author, step 1.6) lets the author adopt the best-supported reading as
        an assumption, and that rule is followed. The standard deviation is adopted for every claim, as the usual way
        a Gaussian kernel's width is stated and the form the same group used later on Monkey C recordings ("s.d. 50 ms",
        Gallego, Perich et al. 2020). The verified fig3b outcome used the other reading; its change is proposed on that
        claim.
      - The lag sign follows the Figure 6B legend (a peak left of zero means output-null leads).
      - A maximum within one step of the edge of the lag search (340 or 350 ms) is flagged and the test is shown with
        such sessions kept and dropped; the paper does not say how edge maxima were treated.
