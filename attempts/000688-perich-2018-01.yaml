    statement: Question for the authors. Is the 100 ms width of the Gaussian kernel its standard deviation or its full
      width at half maximum, and how were trials of unequal length averaged? With the full width the dimensionality medians
      are 9 and 13 (paper 8.5 and 14) and the Baseline lag is not significant; with the standard deviation the medians
      are 7 and 10 and the lag is significantly negative over 21 sessions. This attempt assumed the standard deviation
      for every claim.
  - kind: selection_undocumented
    statement: The dandiset holds 14 dual-array Monkey C sessions where the paper used 9, and does not say how they relate
      to the paper's sessions or why the perturbation epochs were left out.
