outcomes:
  - claim: methods-neuron-counts
    outcome: partially_reproduced
    notebook: reproduce_perich_2018.ipynb
    output: claim:methods-neuron-counts
    assumed: true
    measured:
      - 114
      - 258
      - 55
      - 95
      - 66
      - 121
      - 26
      - 52
      - 835
      - 1565
    notes: Measured values are over all 21 candidate sessions. Monkey M's 7 sessions give 66 to 121 PMd and 26 to
      52 M1 units, inside the widened ranges. 13 of 14 Monkey C candidates are inside (PMd 137 to 258, M1 55 to
      95); C 2016-09-29 has 114 PMd units, below the lower bound of 123.3. The ranges hold for 715 of the 2002 choices
      of 9 Monkey C sessions, those without C 2016-09-29, which is the assumption the outcome rests on. The pooled
      counts above 5 Hz hold under no choice of 9 Monkey C sessions with the 7 Monkey M sessions (at most 634 M1
      and 1224 PMd against 918 and 2221); all 21 sessions give 835 M1 (within 10%) and 1565 PMd (outside). Rates
      over all trials of a file change the counts by at most 10. Monkey M has 6 to 21 PMd units above 5 Hz per session.
    deviations:
      - The paper's 16 sessions cannot be identified. All 21 dual-array center-out sessions of Monkeys C (2016-09-09
        to 2016-10-21) and M (2014-02-03 to 2014-03-07) are used, and the 19 whose reward counts fit the paper's
        Baseline range (154 to 225) are shown as a second set. All reward trials of each file are taken as Baseline.
      - The 5 Hz rule uses the trials in the file (Baseline only), from start to stop of each reward trial; all
        trials are shown as a variant. The paper's rate is over the whole session (claims file criterion).
      - The paper excluded cells with high coincidence across channels; the units are counted as deposited.
  - claim: fig3b-pmd-higher-dimensional
    outcome: reproduced
    notebook: reproduce_perich_2018.ipynb
    output: claim:fig3b-pmd-higher-dimensional
    assumed: true
    measured:
      - 9
      - 13
    notes: Under rule (b), window (a) and a kernel of 100 ms full width at half maximum, the medians are 9 (M1)
      and 13 (PMd), within tolerance of 8.5 and 14, and PMd exceeds M1 in 21 of 21 sessions (19 of 19 in the second
      set). With a 100 ms standard-deviation kernel the medians are 7 and 10, outside tolerance, with PMd above
      M1 in 21 of 21. Window (b) gives medians of 6 to 8 with PMd above M1 in 20 of 21. Rule (a) gives medians of
      26 to 47 (M1) and 46 to 78 (PMd). Raw or root-two noise gives 0 dimensions in every session. By monkey (window
      a, standard-deviation kernel) C has medians 7 and 10, M 7 and 11, PMd above M1 in every session of both.
    deviations:
      - The paper's 16 sessions cannot be identified. All 21 dual-array center-out sessions of Monkeys C (2016-09-09
        to 2016-10-21) and M (2014-02-03 to 2014-03-07) are used, and the 19 whose reward counts fit the paper's
        Baseline range (154 to 225) are shown as a second set. All reward trials of each file are taken as Baseline.
      - Target acquisition (window a, the claims file's O3) is the trial's stop time minus the 0.5 s target hold,
        from STAR Methods, Behavioral task ("required to hold there for 0.5 s"); the cursor cannot be used, as in
        several sessions it never enters the stored target square.
      - Assumed that the noise eigenvalues are scaled to the noise of a trial average (the difference of two trials
        divided by the square root of 2K, K the mean number of trials per target). STAR Methods, Dimensionality
        reduction, says only that the activity of random pairs of trials was subtracted; taken as it is, or divided
        by the square root of two, the noise exceeds every component of the trial-averaged data and every estimate
        is 0, which cannot give the paper's medians. All three scalings are shown.
      - Trials of unequal length are aligned on the window start and cut to the session's shortest window before
        averaging per target; the paper does not say how they were averaged (a standard choice).
      - All units of each area are used; the paper does not say whether a rate threshold applies here.
  - claim: figs4d-dimensionality-robust-to-size
    outcome: reproduced
    notebook: reproduce_perich_2018.ipynb
    output: claim:figs4d-dimensionality-robust-to-size
    assumed: true
    notes: Under rule (b) the mean PMd dimensionality exceeds the mean M1 at 40, 50, 60, 70 and all neurons in both
      windows and both session sets (window a, difference 1.60 at 40 and 3.48 with all neurons). Paired by session,
      PMd is higher in every session at every size except one session at all neurons in window (b) (20 of 21). Rule
      (a) also gives PMd above M1 at every size. Under window (a) both areas fall at small sizes (PMd 10.57 to 8.35,
      M1 7.10 to 6.76); in window (b) the M1 mean does not fall (5.90 with all, 5.86 at 40). M1 sizes of 50 to 70
      rest on 11 to 15 sessions, as Monkey M has 26 to 52 M1 units.
    deviations:
      - The paper's 16 sessions cannot be identified. All 21 dual-array center-out sessions of Monkeys C (2016-09-09
        to 2016-10-21) and M (2014-02-03 to 2014-03-07) are used, and the 19 whose reward counts fit the paper's
        Baseline range (154 to 225) are shown as a second set. All reward trials of each file are taken as Baseline.
      - Assumed that the noise eigenvalues are scaled to the noise of a trial average (the difference of two trials
        divided by the square root of 2K, K the mean number of trials per target). STAR Methods, Dimensionality
        reduction, says only that the activity of random pairs of trials was subtracted; taken as it is, or divided
        by the square root of two, the noise exceeds every component of the trial-averaged data and every estimate
        is 0, which cannot give the paper's medians. All three scalings are shown.
      - 25 subsamples per size and 100 noise repetitions per subsample, to fit the time limit (the claims file's
        standard choice is 100 subsamples; the paper's 1000 noise repetitions are kept for all neurons).
      - Run with the 100 ms standard-deviation kernel only, in windows (a) and (b).
  - claim: figs4c-null-potent-index-centered
    outcome: reproduced
    notebook: reproduce_perich_2018.ipynb
    output: claim:figs4c-null-potent-index-centered
    assumed: true
    notes: Over 3263 PMd units of 21 sessions, with absolute values, the mean index is 0.017 to 0.056 across the
      window and kernel readings and no unit exceeds 0.9 in absolute value (range -0.701 to 0.741). With sums of
      squares three of four readings meet the criterion; window (a) with the full-width kernel gives a mean of 0.100,
      just above 0.1, with 0.09% of units above 0.9. The shuffled control has mean 0.036, standard deviation 0.483
      (data 0.217) and 3.2% of units above 0.9. Monkey C session means are -0.007 to 0.081, Monkey M 0.081 to 0.143.
    deviations:
      - The paper's 16 sessions cannot be identified. All 21 dual-array center-out sessions of Monkeys C (2016-09-09
        to 2016-10-21) and M (2014-02-03 to 2014-03-07) are used, and the 19 whose reward counts fit the paper's
        Baseline range (154 to 225) are shown as a second set. All reward trials of each file are taken as Baseline.
      - Target acquisition (window a, the claims file's O3) is the trial's stop time minus the 0.5 s target hold,
        from STAR Methods, Behavioral task ("required to hold there for 0.5 s"); the cursor cannot be used, as in
        several sessions it never enters the stored target square.
      - The readings of magnitude disagree in one of eight cases; the sum of absolute values, the claims file's
        first reading of "the magnitude ... summed across all dimensions" (STAR Methods, Output-potent and output-null
        subspaces), is adopted.
  - claim: fig6c-null-leads-potent
    outcome: partially_reproduced
    notebook: reproduce_perich_2018.ipynb
    output: claim:fig6c-null-leads-potent
    assumed: true
    measured: -18.1
    notes: The mean Baseline lag over 21 sessions is negative under all 8 readings (-2.4 to -51.4 ms). It is significantly
      negative only with window (a) and the 100 ms standard-deviation kernel, at -18.1 ms (t = -2.29, p = 0.033,
      10 ms resolution) and -51.4 ms (p = 0.035, interpolated 50 ms activity, with two sessions at the edge of the
      search, -350 and -340 ms); the full-width kernel and window (b) give p from 0.18 to 0.82. No reading is within
      3.5 ms of -35 ms. The 19-session set gives the same pattern (p = 0.040 and 0.042). By monkey, -22.9 ms (C)
      and -8.6 ms (M). The end-of-Force part of the statement cannot be tested, as no Force trials are in the dandiset;
      the outcome follows the criterion's partial rule (significantly negative under one reading, outside tolerance).
    deviations:
      - The paper's 16 sessions cannot be identified. All 21 dual-array center-out sessions of Monkeys C (2016-09-09
        to 2016-10-21) and M (2014-02-03 to 2014-03-07) are used, and the 19 whose reward counts fit the paper's
        Baseline range (154 to 225) are shown as a second set. All reward trials of each file are taken as Baseline.
      - Target acquisition (window a, the claims file's O3) is the trial's stop time minus the 0.5 s target hold,
        from STAR Methods, Behavioral task ("required to hold there for 0.5 s"); the cursor cannot be used, as in
        several sessions it never enters the stored target square.
      - The outcome depends on the kernel width, which the claims file expected not to matter (O4). Significance
        holds with a standard deviation of 100 ms and not with a full width at half maximum of 100 ms.
      - The lag sign follows the Figure 6B legend (a peak left of zero means output-null leads).
