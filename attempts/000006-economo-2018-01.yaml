inputs:
- what: The paper's MATLAB analysis code (defineDataset.m, loadAndProcessData.m, simplePlots.m,
    Projections.m, CDCorrelation.m), read for the epochs, the trial and unit selection, the
    selectivity test and the coding direction measures; and the processed data file
    data_structure_anm372906_WR40_psth.mat, read in the data check only, to show how the spike
    times of the files were built. Both from Ephys.zip. After the first verification round, all
    14 processed data files were read, in the data check (how the spike times of every session were
    built, and which of the paper's units the dandiset holds) and in variants that rerun each test on
    the paper's 61 PTupper and 69 PTlower units. No outcome rests on them.
  source: Figshare doi:10.25378/janelia.7007846, version 1 (file 13292708)
outcomes:
- claim: pt-types-transcriptomic
  outcome: blocked
  blocked_by: data_missing
  notes: The dandiset holds electrophysiology only. The single-cell RNA-seq was described in an
    earlier paper, the bulk RNA-seq is at GEO (GSE119182), and Seq.zip and Axons.zip of the
    Figshare record hold sequencing and axon data; none is in the dandiset.
- claim: pt-types-shared-targets
  outcome: blocked
  blocked_by: data_missing
  notes: No anatomy or axonal reconstructions are in the dandiset; Anatomy.zip and Axons.zip of the
    Figshare record hold them.
- claim: pt-upper-thalamus-projection
  outcome: blocked
  blocked_by: data_missing
  notes: No anatomy is in the dandiset. The files label tagged units PTupper without naming a
    projection target; the link to thalamus-projecting neurons comes from the paper's code.
- claim: pt-lower-medulla-projection
  outcome: blocked
  blocked_by: data_missing
  notes: No anatomy is in the dandiset. The files label tagged units PTlower without naming a
    projection target; the link to medulla-projecting neurons comes from the paper's code.
- claim: pt-preparatory-activity
  outcome: reproduced
  notebook: reproduce_economo_2018.ipynb
  output: claim:pt-preparatory-activity
  notes: 72 of 100 included tagged units are selective for lick direction in the delay epoch
    (rank-sum p < 0.01); the label-shuffle null has a 99th percentile of 0.040 (p = 0.001). PTupper
    29 of 44, PTlower 43 of 56; every animal 25% to 85%. 76 units at p < 0.05 and 67 at
    p < 0.001. The selective units lie at nominal depths of 430 to 1600 um; the files give no layer
    per unit, so the statement's "layer 5" is not checked. With one session per animal 26 of 36
    units are selective (p = 0.001), and among the paper's 130 units from its processed data 89 are
    (p = 0.001).
  deviations:
  - Claims written from the abstract only; the criterion and the shuffle test of chance are this attempt's.
  - Epoch rates are spike counts on the file's clock; the paper's code averaged a causally smoothed
    PSTH of spikes already assigned to trials. Leaving out the spikes that overlap the next trial,
    as far as the stored order shows them, gives 73 of 100.
  - Units recorded on different days in one animal are counted separately, as in the code; they
    may be the same neurons (44 of 100 lie within 20 um of a unit of the same animal on another
    day, and the files hold no waveforms). A variant keeps one session per animal.
  - The dandiset holds 44 of the paper's 61 PTupper and 56 of its 69 PTlower units; the code's
    inclusion rule gives the paper's counts on its processed data and the same decision for every
    unit the dandiset holds.
- claim: pt-upper-early-preparatory
  outcome: reproduced
  notebook: reproduce_economo_2018.ipynb
  output: claim:pt-upper-early-preparatory
  notes: 27 of 44 included PTupper units (0.614) are selective in the sample epoch (-2.5 to
    -2.1 s), against a null 99th percentile of 0.045 (p = 0.001); in the baseline epoch 2 of 44
    (p = 0.079). All 8 PTupper animals have sample-selective units (25% to 100%). 0.795 at
    p < 0.05, 0.432 at p < 0.001; 26 of 44 without flagged spikes. One session per animal gives 8
    of 20 (null 99th percentile 0.100, p = 0.001); the paper's 61 PTupper units give 40 of 61
    (p = 0.001).
  deviations:
  - Claims written from the abstract only; "early" is read as the code's sample epoch, the first 400 ms after the pole
    comes in.
- claim: pt-upper-persistent
  outcome: reproduced
  notebook: reproduce_economo_2018.ipynb
  output: claim:pt-upper-persistent
  notes: (a) 27 of 44 PTupper units are selective in the late delay (null 99th percentile 0.046,
    p = 0.001). (b) The cosine similarity of sample and late delay d' is 0.495, against a shuffle
    null median of 0.182 and 95th percentile of 0.433 (p = 0.016). The code's Pearson correlation
    gives r = 0.496 (p = 0.0006). 17 of the 27 sample-selective units keep the sign of their d' in
    the late delay. Both parts hold without flagged spikes, without the trials marked not good,
    with one session per animal ((a) 12 of 20, p = 0.001; (b) cosine 0.670, p = 0.006) and on the
    paper's 61 PTupper units ((a) 38 of 61, p = 0.001; (b) cosine 0.514, p = 0.002).
  deviations:
  - The code compares coding directions with bootstraps and plots the correlation; the shuffle
    test of the similarity is this attempt's.
- claim: pt-lower-late-and-motor
  outcome: partially_reproduced
  notebook: reproduce_economo_2018.ipynb
  output: claim:pt-lower-late-and-motor
  notes: Among 56 PTlower units, 0.714 are selective in the late delay and 0.482 in the sample
    epoch (one-sided McNemar p = 0.0096), and 0.643 in the response epoch (p = 0.088 against the
    sample epoch), so part (a) holds and part (b) does not. The rise rests mostly on anm369962
    (0.30 in the sample epoch, 0.90 in the late delay); the other three animals stay between 0.44
    and 0.77 in all three epochs. At p < 0.001 both parts hold (p = 0.0033 and 0.018), at p < 0.05
    neither (0.054 and 0.14). The response epoch rate differs from baseline in 53 of 56 PTlower
    units and 37 of 44 PTupper units (one-sided Fisher p = 0.080). The variants give the same split. With one session per
    animal (16 units) part (a) holds (p = 0.016) and part (b) does not (p = 0.23). On the paper's
    69 PTlower units from its processed data, (a) holds (0.507 against 0.652, p = 0.049) and (b)
    does not (0.551, p = 0.37); there both parts hold at p < 0.001 and neither at p < 0.05.
  deviations:
  - Claims written from the abstract only; "mainly late" is read as more units selective late than in the sample epoch,
    and "motor commands" as selectivity in the first 400 ms after the go cue (a change from
    baseline is shown as a variant).
  - The outcome depends on the test threshold, which the code sets at p < 0.01 for counting
    selective units.
- claim: pt-types-differ-in-timing
  outcome: not_reproduced
  notebook: reproduce_economo_2018.ipynb
  output: claim:pt-types-differ-in-timing
  notes: (a) Sample epoch selectivity is 0.614 for PTupper and 0.482 for PTlower (one-sided Fisher
    p = 0.134). (b) Response epoch selectivity is 0.643 for PTlower and 0.841 for PTupper, the
    reverse of the claim (p = 0.99; p = 0.022 for the reverse). Over animals neither holds
    (Mann-Whitney p = 0.30 and 0.93). The code's coding-direction variant points the abstract's
    way but is not significant. The sample to late delay similarity is 0.473 +/- 0.214 for PTupper
    and 0.216 +/- 0.204 for PTlower, with PTupper higher in only 83 of 100 bootstraps. Without the bootstrap, PTupper's
    similarity is above its shuffle null (p = 0.007) and PTlower's is not (0.177, p = 0.43). On
    the paper's 130 units from its processed data, (a) is 0.656 against 0.507 (p = 0.062) and (b)
    is reversed (0.551 against 0.770, p = 0.007 for the reverse); with one session per animal, (a)
    p = 0.28 and (b) is reversed (0.438 against 0.800). The paper's measure of early information
    (Extended Data Fig. 9, single-unit decoding accuracy in the sample epoch, at least 70%) goes the
    abstract's way, with 7 of 44 PTupper against 1 of 56 PTlower units here (Fisher p = 0.012) and
    12 of 61 against 1 of 69 on the paper's units (p = 0.0005), where the legend gives 15 of 61
    against 3 of 69; the means match the legend (0.638 and 0.586 against 0.644 and 0.589), and the
    smaller counts are not explained. Part (a) is thus supported under the paper's measure but not
    under the criterion's. Part (b), selectivity for lick direction in the response epoch, is
    reversed in every variant. Under the variant reading of "motor commands" as a response epoch
    rate that differs from baseline, PTlower is ahead, 53 of 56 against 37 of 44, without reaching
    significance (one-sided Fisher p = 0.080). The reversal thus shows that PTlower units are less
    often direction-selective in the response epoch, not that they lack movement-related
    activity.
  deviations:
  - Claims written from the abstract only; the comparison of fractions between types is this attempt's reading of the
    contrast in the abstract, and the paper may compare the types differently.
  - Each animal holds one type (8 PTupper and 4 PTlower animals), so type and animal are
    confounded; the PTlower recordings include sessions in both hemispheres.
  - The dandiset lacks 17 of the paper's 61 PTupper and 13 of its 69 PTlower units; the variant on
    the paper's units gives the same outcome.
findings:
- kind: data_missing
  statement: 11 sessions of the paper's processed data (Figshare doi:10.25378/janelia.7007846) that
    hold tagged units are not in the dandiset. They hold 17 of the 61 PTupper and 13 of the 69
    PTlower units the paper analysed, so the dandiset holds 44 and 56. Every tagged unit the
    dandiset does hold is in the processed data with the same label and the same inclusion
    decision under the paper's code. The dandiset's description says some files were found to be
    broken and were left out, without naming them.
- kind: data_missing
  statement: The dandiset holds the electrophysiology only. The transcriptomic and anatomical data
    behind four of the abstract's findings (the two PT types and their projection targets) are not
    in it; they are at GEO (GSE119182) and on Figshare (doi:10.25378/janelia.7007846).
- kind: format_error
  statement: Spike times are not sorted in 1120 of 1149 units. They were written trial by trial as
    trial start + go cue time + the spike time from the go cue. Each trial's spikes cover 6.4 s from
    about 0.97 s before the pole comes in, and trial starts are a median 6.4 s apart (5.4 to 7.9 s
    from the 1st to the 99th percentile), so consecutive trials
    overlap on the file's clock and some spikes of one trial lie in the next trial's early epochs
    (11.7% of the spikes counted in the baseline epoch, under 2% in later epochs, are detectably
    out of order). Trial membership of a spike cannot be recovered in full from the files.
- kind: format_error
  statement: The trial table's stop_time is NaN in every file, and pole_in_time, pole_out_time and
    cue_start_time are relative to the trial start without saying so. On the file's clock the go
    cue of a trial often falls after the next trial's start_time.
- kind: metadata_insufficient
  statement: The tagged unit labels PTupper and PTlower are not described in the files or the
    dandiset metadata, and the projection targets (thalamus and medulla) that the paper uses to
    name the types are stated only in the paper's code.
- kind: metadata_insufficient
  statement: Unit quality mixes two vocabularies (single, and Excellent, Good, Fair, Poor) and has
    undescribed empty values ([], 0, blank). Sex is U and genotype empty for every mouse, the
    electrode positions are all zero, and every electrode group gives layer 5 whatever the depth.
- kind: other
  statement: In the paper's processed data, in every one of the 53 sessions the dandiset holds, the
    spike windows of the first ten trials start later relative to the pole than those of the other
    trials (by about 2.7 s in the session examined in detail); the paper's code leaves out the first
    ten trials of each unit, which hides this. The files carry the same shift, as their spike times
    equal the processed ones in every unit.
