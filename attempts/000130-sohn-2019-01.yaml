- claim: monkey-g
  outcome: blocked
  blocked_by: data_missing
  notes: The dandiset holds one session of monkey H. A search of the DANDI archive for Jazayeri, Sohn,
    DMFC and Ready-Set-Go finds no other dandiset with these recordings (only 000620, 000897 and
    001275 of the same lab, on other tasks). The paper says the data are in the article and the code
    is available on request.
findings:
- kind: data_missing
  statement: The dandiset holds one recording session (2016-12-11) of monkey H, with 54 units, where
    the paper analyses 17 sessions of H and 12 of monkey G (617 and 741 units). The dandiset's
    description does not say that it holds one session of the paper's 29 or which one. The 48 units
    that pass the paper's rate rule match its count for the single session of H used for GPFA.
- kind: data_missing
  statement: Following the Neural Latents Benchmark design, 283 trials of the session are in the test
    file without ts, tp, prior, effector or direction and without 14 of the 54 units, on a separate
    clock. These trials cannot be used for any analysis of the paper.
- kind: metadata_error
  statement: The description of the `iti` column says 500 ms after Short prior trials and 1220 ms after
    Long ones; the values are the reverse (Short 1220, Long 500), as the paper states.
- kind: metadata_insufficient
  statement: '`tp` is described as the time between Set and Go, but is a median 17.9 ms longer than
    go_time minus set_time (5th to 95th percentile 1.1 to 29.8 ms, up to 200.6 ms in used trials).
    `ts` is the nominal interval, within 23.5 ms of ready_time minus set_time. Neither difference is
    documented.'
- kind: selection_undocumented
  statement: The `is_outlier` flag is described only as a probabilistic mixture model. It flags 46
    completed trials (4.47%); a refit of the Methods' Gaussian and uniform mixture per prior, ts,
    effector and direction flags 10 of these and no others, and the other 36 have tp from 0.53 to 1.60
    times ts.
- kind: metadata_insufficient
  statement: Units carry no single-unit or multi-unit label and no electrode or probe; the electrode
    table has no positions or impedances and gives the filtering as unknown. The paper distinguishes
    456 single units from 902 multi-units.
- kind: methods_unavailable
  statement: The paper's analysis code is available only on request. The code the dandiset links
    (nlb_tools) loads the data and scores benchmark models, and holds none of the paper's analyses.
- kind: paper_inconsistency
  statement: The Results give the GPFA sessions as N = 48 for monkey H and N = 107 for monkey G, the
    Methods as N = 48 in H and 96 in G.
