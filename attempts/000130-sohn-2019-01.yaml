outcomes:
- claim: beh-slopes
  outcome: not_reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:beh-slopes
  notes: Six of 8 weighted slopes of tp on ts lie between 0 and 1 (0.50 to 0.90) and 5 of 8 have 95%
    intervals excluding 0 and 1. The Short prior slopes with the eye are 1.11 (Eye Right, interval
    1.01 to 1.21) and 1.01 (Eye Left). All 8 are positive, so the animal estimated ts; the part of the
    statement about bias toward the mean fails in the two eye Short conditions.
  deviations:
  - One session of monkey H; the paper's slopes come from 17 sessions of H and 12 of G.
  - Outliers removed with the file's `is_outlier` flag, which a refit of the Methods' mixture model
    does not reproduce (see findings).
- claim: beh-overlap-prior
  outcome: not_reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:beh-overlap-prior
  notes: At ts = 800 ms the median bias is +28.3 ms for Short (93 trials) and +47.6 ms for Long (107
    trials), both positive; rank-sum p = 0.073. The Long tp is the longer in 2 of 4 datasets (Hand
    Right p = 0.00099, Hand Left p = 0.069, where the Short bias is -61.6 ms); in the eye datasets the
    Short tp is the longer (Eye Left +79.1 against +18.6 ms, p = 0.051).
  deviations:
  - One session; the paper's p < 1e-43 pools 17 sessions of monkey H.
- claim: beh-sigmoid-increments
  outcome: reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:beh-sigmoid-increments
  notes: The middle increment of mean tp exceeds the extreme one in 7 of 8 conditions (median
    difference 31.3 ms), two-sided signed-rank p = 0.0156. Hand Left, Short is the exception (-10.7
    ms).
  deviations:
  - The test is over the 8 conditions of one session; the paper's is over sessions and conditions of
    both animals.
- claim: beh-long-more-bias
  outcome: reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:beh-long-more-bias
  notes: The Long slope is below the Short slope in all 4 datasets (mean 0.716 against 0.898),
    weighted or unweighted.
  deviations:
  - One session.
- claim: beh-bayes-model
  outcome: partially_reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:beh-bayes-model
  notes: The predicted SD of tp correlates positively with the observed one in all 4 datasets (r =
    0.28 to 0.91), but the bias R2 reaches 0.8 in 2 of 4 (0.12, 0.67, 0.87, 0.98). The poorly fit
    datasets are the eye ones, whose Short slopes exceed 1, with wm = 0.013 and 0.025. All fits
    converged. Table S3 was not available, so wm and wp (0.09 to 0.11) are not compared.
  deviations:
  - Fit to one session per effector and direction; the paper pools sessions.
  - The prior is taken as continuous uniform over each range, as the Results describe; the task used
    5 discrete values.
  - The bias R2 threshold of 0.8 is a choice made here; the paper shows the fit graphically.
- claim: glm-prior-ts
  outcome: not_reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:glm-prior-ts
  measured:
  - 75.0
  - 45.8
  notes: 36 of 48 units are prior-dependent (75.0%, 95% interval 61.2 to 85.1%) and 22 of 48 are
    ts-dependent (45.8%, interval 32.6 to 59.7%), against 65% and 27% for monkey H. Both are outside
    tolerance and higher; the interval of the prior fraction includes 65%, that of the ts fraction
    excludes 27%. A likelihood-ratio test gives higher fractions still (prior 77.1 to 87.5%, ts 66.7
    to 77.1% at p < 0.01 and 0.05).
  deviations:
  - 48 units from one session, where the paper's fractions use 536 units of monkey H over 17
    sessions.
  - The GLM design with attrition (rows for every trial whose Set comes after each time point) is
    read from the Methods; the paper's code was not available.
- claim: dfr-overlap-support
  outcome: reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:dfr-overlap-support
  notes: The mean RMS rate difference at ts = 800 ms is largest at 480 to 640 ms after Ready (6.86
    spikes/s), above the 95th percentile of the shuffled maximum (3.11). Before Ready it is at the
    shuffle level. Per dataset the largest bin is 480-640 (2 datasets), 640-800 and 800-960 ms, and the
    mean is also high just after Set (6.07 at 800 to 960 ms).
  deviations:
  - The time range (320 ms before Ready to 640 ms after Set) and the shuffle reference are chosen
    here.
- claim: pca-dimensionality
  outcome: not_reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:pca-dimensionality
  notes: Two components reach 75% of the variance in the estimation epoch in all 4 datasets (3 explain
    86 to 90%), and 2, 2, 5 and 4 in the production epoch; 1 of 8 values is in range. The activity is
    lower dimensional than reported.
  deviations:
  - 48 simultaneously recorded units, where the paper's trial-averaged PCA pools units over 17
    sessions; more units can add dimensions.
  - Rates not normalised before PCA; the Methods do not say.
- claim: encoding-r2
  outcome: reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:encoding-r2
  measured:
  - 0.998
  - 0.996
  notes: Both readings match. (a) Hand Left R2 = 0.998 (Short) and 0.996 (Long), given as measured; (b)
    the mean of 4 datasets 0.959 and 0.989. With only 2 PCs in the estimation epoch, random unit axes
    also fit te well (median R2 0.73 to 0.98); the R2 on u exceeds 95% of random axes in 3 of 8
    dataset-priors (Hand Right Long and both Hand Left), so the paper's statement that the match is
    specific to u (Figure S5) holds only for those.
  deviations:
  - te comes from the observer model fitted to this session.
  - The encoding axis averages difference vectors up to the middle of the support, a choice made
    here.
- claim: encoding-bayes-beats-linear
  outcome: partially_reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:encoding-bayes-beats-linear
  notes: The Bayesian RMSE is lower in 4 of 4 datasets for Long and 3 of 4 for Short (Hand Right Short
    0.99 against 0.80). Differences are 0.045 to 0.573 spikes/s.
  deviations:
  - 4 datasets, where the paper had 8; a signed-rank test over 4 cannot reach p < 0.05, so the
    criterion counts datasets.
- claim: short-in-long-control
  outcome: reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:short-in-long-control
  notes: Judged on the paper's test as the claims file fixes; signed-rank p = 0.25 over 4 datasets,
    where the smallest attainable p is 0.125, so the test could not have found an effect. The effect
    sizes do not show the control's contrast; the Bayesian model is better in 3 of 4 datasets with a
    median relative RMSE difference of -0.089, at least as large as in the Short prior (-0.060). This
    outcome carries no evidence for the absence the paper reports.
  deviations:
  - 4 datasets, where the paper had 8.
- claim: neural-long-more-bias
  outcome: reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:neural-long-more-bias
  notes: The Long slope of Xu on ts is below the Short slope in 4 of 4 datasets (ratios 0.55, 0.63,
    0.34, 0.97).
  deviations:
  - 4 datasets, where the paper had 8.
- claim: speed-vs-projection
  outcome: partially_reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:speed-vs-projection
  measured:
  - -0.941
  - -0.878
  notes: Both correlations are negative and significant (Short p = 6.2e-10, Long p = 3.7e-07) and
    stronger than reported, outside tolerance. Within datasets -0.75 to -1.00; with Xu z-scored per
    dataset -0.759 and -0.779, and the speed divided by mean tp gives -0.917 and -0.923.
  deviations:
  - 20 points per prior (4 datasets), where the paper had 40.
  - Speed is the mean step between 20 ms states up to the shortest tp; the Methods' division by the
    Set to Go duration is shown as a variant.
- claim: initial-speed-biased
  outcome: reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:initial-speed-biased
  notes: The initial speed falls with ts in 8 of 8 dataset-priors and is shallower than the 1/ts
    profile in 7 of 8 (Eye Right Long is the exception), two-sided signed-rank p = 0.039. No trial had
    tp below 400 ms.
  deviations:
  - 8 dataset-priors of one animal, where the paper's test combines 16 over two animals.
- claim: speed-predicts-tp
  outcome: partially_reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:speed-predicts-tp
  measured:
  - -0.733
  - -0.744
  notes: Faster trajectories go with shorter mean tp in both priors (Short p = 0.00024, Long p =
    0.00017), more strongly than reported and outside tolerance. Within datasets -0.80 to -0.99. The
    Neural Latents Benchmark's trial-by-trial variant gives r = -0.195 to -0.740 (mean -0.519), 7 of 8
    conditions with p < 0.05.
  deviations:
  - 20 points per prior, where the paper had 40.
- claim: alt-speed-unmodulated
  outcome: reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:alt-speed-unmodulated
  notes: Judged on the paper's test as the claims file fixes; signed-rank p = 0.125 for each prior,
    the smallest a test over 4 datasets can give. The data show modulation; all 8 slopes are positive
    (speed rising 13 to 24% of its mean per 100 ms of the support) and all 8 bootstrap intervals over
    trials exclude zero. The outcome reflects the test's lack of power at this sample size, not an
    absence of modulation in this session.
  deviations:
  - 4 datasets, where the paper had 8.
  - Speed from smoothed trial-averaged rates with attrition in 20 ms bins of 48 units; the paper's
    smoothing for this measure is not stated.
- claim: alt-transient-parallel
  outcome: not_reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:alt-transient-parallel
  notes: For the longest ts the distance to the middle trajectory falls in the first 200 ms after Set
    in 6 of 8 dataset-priors (median -15.3% of the mean distance per 100 ms), signed-rank p = 0.039;
    for the shortest ts p = 0.078 (6 of 8 rising, median +26.7%). The PCA kept 1 to 4 components, one
    in Eye Left.
  deviations:
  - 8 dataset-priors of one animal, where the paper's test used 16.
  - Rates smoothed over 100 ms before to 300 ms after Set and cut to the first 200 ms, a choice made
    here.
- claim: alt-threshold-monotonic
  outcome: not_reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:alt-threshold-monotonic
  notes: With the components reaching 60% of the variance (1 to 3), the median time of the minimum
    distance is 210 ms before Go; 6 of 32 curves have their minimum in the last 40 ms and 14 in the
    last 200 ms. Distances do fall overall (the distance at Go is below that 800 ms earlier in 26 of
    32). With 75% of the variance the median minimum is 80 ms before Go and in the full space 40 ms,
    which would meet the criterion, so the outcome depends on the number of components; with one
    component (eye datasets) the distance reaches zero where trajectories cross.
  deviations:
  - The paper's test (one-tailed signed-rank, p = 1.5e-4) cannot be read unambiguously; the criterion
    on the median time of the minimum was fixed before the analysis.
  - The 60% of variance follows the figure legend; the 75% of the Methods is shown as a variant.
- claim: gpfa-variance-inverted-u
  outcome: not_reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:gpfa-variance-inverted-u
  notes: The quadratic coefficient is negative in 5 of 8 dataset-priors; one-tailed signed-rank p =
    0.125 (paper 0.0273). Cross-validation chose 8 latent dimensions in all 4 datasets, the larger
    candidate. GPFA values vary in the third significant digit between runs; the counts and p values
    did not change over four runs.
  deviations:
  - Latent dimensionality chosen only from 4 and 8, with 100 EM iterations, to keep the run short;
    the paper's cross-validation range is not stated.
  - One GPFA per effector and direction with both priors; the paper does not say how trials were
    grouped.
- claim: gpfa-mean-sigmoid
  outcome: reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:gpfa-mean-sigmoid
  notes: Middle increments of the mean projection exceed the extreme ones in 8 of 8 (two-sided
    signed-rank p = 0.0078) and the Short slope is the higher in 4 of 4 datasets (one-tailed p =
    0.0625), the paper's values; the mean rises with ts in 8 of 8.
  deviations:
  - As for gpfa-variance-inverted-u.
