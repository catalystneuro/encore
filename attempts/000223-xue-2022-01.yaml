findings:
- kind: other
  statement: Two of the 20 files are the same recording. sub-3112/sub-3112_ecephys+ophys.nwb and
    sub-3112/sub-3112_ses-20210227T190233_ecephys+ophys.nwb share one blob, so the dandiset holds 19
    recordings, as the paper reports, and its file count of 20 overstates them.
- kind: identifier_missing
  statement: Nothing in the files or the dandiset metadata links a file to its row (spine ID) or
    culture ID in the paper's Table 1. Subjects can be matched to cultures and files to rows by unit
    count, except two pairs that have equal counts (the two sub-3112 recordings, rows 14 and 15; the
    sub-2748 and sub-2765 recordings, rows 16 and 20), and the file with two spines does not say which
    ROI pair is spine 9 and which spine 10.
- kind: data_missing
  statement: The background ROIs the paper used to estimate the recording noise for its surrogates
    (Methods 2.7) are not in the files, which hold only the spine and shaft ROIs. The noise estimate,
    and with it the acceptance thresholds and F-scores, cannot be repeated exactly.
- kind: metadata_insufficient
  statement: The ROIs of the plane segmentation are not labelled as spine or dendritic shaft, nor paired;
    their roles are inferred from the order the paper's code uses and from their sizes. The stored
    `Dff` series has no description and is not the dF/F the paper describes (25th percentile over 100
    frames); recomputed from the ROI traces, the two differ by up to 0.23.
- kind: metadata_error
  statement: The imaging plane gives the indicator as "unknown"; the paper used jGCaMP7b. The image
    series has no description and its unit is "n.a.".
- kind: other
  statement: Two files (sub-2748 and sub-3278) each hold one unit with no spikes. Table 1 counts 58 and
    100 units for these recordings, the files 59 and 101; without the empty units the counts agree.
- kind: methods_unavailable
  statement: Question for the paper's authors. Which p_thresh and which hyperactive-unit strategy were
    used for each recording (Methods 2.6 says p_thresh "was visually chosen for each data set")? This
    attempt took, per recording, the pair whose best-R is nearest to Table 1, by the claims file's rule;
    the code's default pair (97, percentile) gives 14 of 20 best-R values within 10% of Table 1.
- kind: methods_unavailable
  statement: Question for the paper's authors. Where was the background ROI of each spine (Methods 2.7,
    "a background ROI close to the spine"), and was one noise estimate used per recording (Table 1
    gives spines 9 and 10 identical thresholds)? This attempt placed three dim squares near each spine;
    the regions agree on every outcome except the OUT/IN correlation of Figure 5(d), where region 0
    gives R = 0.592 and region 1 gives 0.615 against 0.672.
- kind: methods_unavailable
  statement: Question for the paper's authors. How was the OUT/IN ratio of Table 1 computed (which units,
    which burst periods, which time span)? With the burst detection of Methods 2.6 and any p_thresh
    from 96 to 99, OUT/IN matches Table 1 for 10 of 19 recordings at best, and for row 8 it is at least
    0.139 against 0.060.
- kind: methods_unavailable
  statement: Question for the paper's authors. What share of the simulated ground-truth surrogates had
    a best unit other than their own (Methods 2.8, "in rare cases")? Here it is 6% to 44% per
    recording, and it decides how far the Methods' and the code's classifications of those surrogates
    differ (maximum F within 10% of Table 1 for 15 against 17 of 19 recordings).
- kind: code_mismatch
  statement: Methods 2.6 says bursts closer than t_ibi "were merged into a single larger burst". The
    code's single merging pass (notebook 1) merges the first two bursts of a chain of three or more
    and drops the rest, so those periods are no longer bursts. With this attempt's burst readings it
    drops bursts in 7 of 19 recordings, 18 in one of them.
verifications:
