    motor and parietal labels (claims, open detail 6), read from channels.tsv, not from the brain images.
- claim: fig8-mtf-matches-filter
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_holdgraf_2016.ipynb
  output: claim:fig8-mtf-matches-filter
  notes: On 9 electrodes, temporal minus spectral MTF has a significant positive cluster in the region
    the temporal filter keeps in BEFORE (centre 2.1 Hz and 0.30 cycles per band, P = 0.0078) and in AFTER
    (2.0 Hz, P = 0.043, both rules; 1.6 Hz, P = 0.031, cutoff rule only). Most significant clusters lie
    at 16 to 19 Hz (P = 0.0039 to 0.027), outside both regions. For the shift, the MTF of the difference
    has one significant cluster, at 15.3 Hz (P = 0.0039), outside the regions under both rules, and the
    difference of MTFs none. The criterion asks for an in-region cluster in each of BEFORE, AFTER and
    the shift; the shift, which carries the claim's conclusion, has none. With 9 electrodes the smallest
    possible P is 0.0039.
  deviations:
  - Every eSTRF claim rests on the 9 included electrodes found here (S01 4, S02 1, S04 4), against the
    paper's 41 (see strf-r-count and included-electrode-count).
  - The ridge parameter is the mode of the per-split best values over Speech-R electrodes and the three
    conditions, leaving out values at the top of the grid (1e8). Assumed. The Methods take the mode of
    the selected values, but 2751 of 11860 values sit at the top of any grid, where no alpha predicts
    the held-out trial better than the null model, so the plain mode is the grid edge; the claims file
    asks for a grid whose mode is not at an edge. Both this mode and the mode of each electrode's best
    alpha give 1e5.
  - Auditory spectrogram compression (cube root) and spectral sharpening (rectified difference with the
    next lower band, as in the NSL model of the Methods' ref. 3) are standard choices; the gammatone filters
    are applied in the frequency domain.
  - 'Assumed (from the criterion, and made concrete here). Two rules: (1) low and high modulation are
    below and above the median of the plane''s absolute temporal (11.9 Hz) and spectral (0.234 cycles
    per band) modulations, measured at the cluster''s mean position; (2) from the filter cutoffs (Methods,
    Filtered speech sound creation), temporal modulation at most 3 Hz and spectral modulation at most
    0.5 cycles/kHz, converted at the mean band spacing to 0.11 cycles per band, a cluster being in region
    when more than half its bins are.'
  - The cluster test runs on the half plane of non-negative spectral modulation, as the amplitude spectrum
    of a real eSTRF is symmetric.
- claim: fig9-rms-increase
  outcome: partially_reproduced
  notebook: reproduce_holdgraf_2016.ipynb
  output: claim:fig9-rms-increase
  measured: 12.03
  notes: 'On 9 electrodes, the AFTER eSTRF gives a larger RMS output to the MIDDLE spectrograms under
    every reading: mean increase 12.0 (P = 0.034) and 11.8 (P = 0.031) with mean coefficients, 11.5 (P
    = 0.077) and 11.4 (P = 0.073) with z-scored coefficients; 8 of 9 electrodes are positive with mean
    coefficients. The output RMS is about 105 here against about 4 on the paper''s Figure 9c axis, so
    the paper''s 0.12 is on a different scale the paper does not define; as a fraction of the BEFORE RMS
    the increase is 0.12 to 0.13. The direction and significance hold under two readings; the stated value
    does not. The relative increase is not in the criterion and is reported only. Whether the claims file''s
    absolute tolerance can apply to a quantity whose unit the paper does not give is asked of a reader
    (questions/crcns-ac-4.yaml).'
  deviations:
  - Every eSTRF claim rests on the 9 included electrodes found here (S01 4, S02 1, S04 4), against the
    paper's 41 (see strf-r-count and included-electrode-count).
  - The ridge parameter is the mode of the per-split best values over Speech-R electrodes and the three
    conditions, leaving out values at the top of the grid (1e8). Assumed. The Methods take the mode of
    the selected values, but 2751 of 11860 values sit at the top of any grid, where no alpha predicts
    the held-out trial better than the null model, so the plain mode is the grid edge; the claims file
    asks for a grid whose mode is not at an edge. Both this mode and the mode of each electrode's best
    alpha give 1e5.
  - Auditory spectrogram compression (cube root) and spectral sharpening (rectified difference with the
    next lower band, as in the NSL model of the Methods' ref. 3) are standard choices; the gammatone filters
    are applied in the frequency domain.
  - The MIDDLE spectrograms are z-scored as model inputs (with the MIDDLE statistics) before the convolution;
    the Methods do not give their scale, which sets the scale of the RMS.
