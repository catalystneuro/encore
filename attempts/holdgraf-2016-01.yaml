- claim: speech-r-count
  outcome: reproduced
  notebook: reproduce_holdgraf_2016.ipynb
  output: claim:speech-r-count
  measured:
  - 101
  - 377
  notes: Three of twelve readings (open details 1, 2 and 3) give a count within 92 +/- 9.2, all with the
    z-score by non-event times (the code's zscore_by_non_events). Onset to sound end with all speech trials
    gives 96, 0 to 2.5 s with MIDDLE trials 101 (recorded as measured, the first matching reading in the
    criterion's order), 0 to 2.5 s with all trials 99. The per-trial baseline z-score gives 141 to 185
    and the pooled baseline 131 to 150. The data set holds 377 good electrodes of 416, against the paper's
    468, so 101 is 26.8% of electrodes against 19.6%; the criterion reports the total and does not judge
    it. Speech-R electrodes are mostly temporal (66) and perisylvian (18), as the statement says.
  deviations:
  - HFB band edges and filter orders are not given (claims, open detail 4); 21 log-spaced centres 70 to
    140 Hz, each band 10% of its centre wide, 2nd-order Butterworth applied forwards and backwards, as
    a standard choice.
  - The z-score, window and trials are open details the claims file lists; the result matches under 3
    of 12 combinations, all with the non-event z-score.
  - Electrodes are those marked good in channels.tsv (377); the paper's 468 come from channels the data
    set does not hold.
  - Pink noise triplets and the six unfiltered sentences outside any triplet in S01 to S04 are left out.
- claim: fig3b-hfb-increase-after
  outcome: reproduced
  notebook: reproduce_holdgraf_2016.ipynb
  output: claim:fig3b-hfb-increase-after
  notes: Over 101 Speech-R electrodes, AFTER exceeds BEFORE in a cluster from 0.36 to 1.28 s (P = 0.0001)
    and from 1.72 to 2.02 s (P = 0.0072). The 84 Speech-R electrodes on temporal or perisylvian cortex
    give 0.40 to 1.42 s (P = 0.0001); the per-trial baseline z-score gives P = 0.0002 for both sets. Mean
    difference 0.084 z over 0 to 1 s. S02 and S13 have a slightly negative mean difference over 0 to 3
    s.
  deviations:
  - Speech-R carried into this claim is the reading z-score by non-event times, 0 to 2.5 s, MIDDLE trials
    (101 electrodes), the first reading within the paper's count in the claims file's order (see speech-r-count).
  - HFB band edges and filter orders are not given (claims, open detail 4); 21 log-spaced centres 70 to
    140 Hz, each band 10% of its centre wide, 2nd-order Butterworth applied forwards and backwards, as
    a standard choice.
  - Cluster test with MNE defaults (two-tailed t threshold for p = 0.05) and 10,000 permutations, -0.5
    to 3 s (claims, open detail 11).
- claim: supp3a-pink-noise-no-hfb-change
  outcome: reproduced
  notebook: reproduce_holdgraf_2016.ipynb
  output: claim:supp3a-pink-noise-no-hfb-change
  notes: On the pink noise triplets of S07, S08 and S13, no AFTER minus BEFORE cluster reaches P < 0.05
    over their 36 Speech-R electrodes (smallest P = 0.0895). Set (a), the included electrodes of these
    subjects, is empty here. The mean AFTER minus BEFORE over 0 to 3 s is 0.040913 z for pink noise and
    0.041035 z for speech triplets of these electrodes (s.e. 0.019 and 0.017), from different time courses
    (largest difference 1.54 z). The speech triplets of these electrodes, with about as many triplets
    per subject (29 against 28), give a significant cluster at 0.50 to 0.74 s (P = 0.0013), so the two
    differ in the time course of the effect, not in the amount of data or the mean.
  deviations:
  - Speech-R carried into this claim is the reading z-score by non-event times, 0 to 2.5 s, MIDDLE trials
    (101 electrodes), the first reading within the paper's count in the claims file's order (see speech-r-count).
  - Judged on electrode set (b) alone, as set (a) is empty.
- claim: supp5b-hfb-stable-over-session
  outcome: not_reproduced
  notebook: reproduce_holdgraf_2016.ipynb
  output: claim:supp5b-hfb-stable-over-session
  notes: The slope of mean post-stimulus HFB on triplet number is negative under every z-score and unit,
    about -0.1 to -0.18 z over 57 triplets. Under the adopted z-score by non-event times the 95% bootstrap
    interval excludes 0 for unit (a) with pairs resampled (-0.0028 to -0.0017) and with whole sounds resampled
    (-0.0032 to -0.0012), and for unit (b) (-0.0029 to -0.0008); resampling whole subjects in unit (b)
    gives -0.0039 to 0.00001. The pooled baseline z-score excludes 0 under all four bootstraps. The per-trial
    baseline z-score includes 0 under three of four (unit (a) with sounds resampled -0.0056 to 0.0010,
    unit (b) -0.0063 to 0.0001) and excludes it with unit (a) pairs resampled (-0.0037 to -0.0005); with
    it 1 of 7 subjects has an interval below 0, against 6 of 7 with the other two z-scores. Not reproduced
    under the adopted z-score; under the per-trial baseline the claim of absence holds with the grouped
    bootstraps and not with pairs resampled, so the outcome rests on the z-score.
  deviations:
  - Speech-R carried into this claim is the reading z-score by non-event times, 0 to 2.5 s, MIDDLE trials
    (101 electrodes), the first reading within the paper's count in the claims file's order (see speech-r-count).
  - The value is the mean HFB of every speech sound (BEFORE, MIDDLE and AFTER) and trial number the triplet
    number; the legend does not say which sounds are used.
  - Assumed. The z-score is open (claims, open detail 3). The z-score by non-event times is the one adopted
    for Speech-R and every HFB claim, and it is kept here; the per-trial and pooled baseline z-scores
    are shown, and the per-trial one gives the opposite outcome.
  - Unit (a) is bootstrapped by resampling whole sounds, as the electrode values of one sound are not
    independent; unit (b) also by resampling whole subjects. The pair-resampled interval of the first
    revision is shown.
  assumed: true
- claim: fig4a-coherence-after-higher
  outcome: reproduced
  assumed: true
  notebook: reproduce_holdgraf_2016.ipynb
  output: claim:fig4a-coherence-after-higher
  notes: With NW = 4, on the 84 Speech-R electrodes on temporal or perisylvian cortex (set a), AFTER/MIDDLE
    minus BEFORE/MIDDLE coherence is +0.80 bits/s over 0 to 1 s (P = 0.0003) and +0.49 over 1 to 2.5 s
    (P = 0.0004); before the sound +0.31 (P = 0.14, one window). Windows assigned by centre give P = 0.0002
    and 0.0003, and 0.82 before the sound. On all 251 temporal or perisylvian electrodes (set b) only
    1 to 2.5 s differs (P = 0.0003; 0 to 1 s P = 0.44). With NW = 2, set (a) gives P = 0.0012 and 0.013,
    and the pre-stimulus window also differs (P = 0.013), against the paper's 0.924. Five of seven subjects
    have a positive mean difference (S02 -0.13, S03 -0.05 bits/s). Set (a) is adopted, as the Results
    compute it on speech-responsive electrodes and its 84 is close to the paper's 78. The integrated coherence
    is about 15 bits/s in both conditions (14.5 before the sound); how much of it is estimator bias is
    not measured here. Integrated from W = 10 Hz, the lowest frequency the NW = 4 tapers resolve apart
    from 0 Hz, set (a) still gives P = 0.013 and 0.0019 after the sound and 0.21 before it; NW = 2 integrated
    from 5 Hz gives 0.028 and 0.038, and 0.014 before the sound.
  deviations:
  - Speech-R carried into this claim is the reading z-score by non-event times, 0 to 2.5 s, MIDDLE trials
    (101 electrodes), the first reading within the paper's count in the claims file's order (see speech-r-count).
  - Assumed. The multitaper bandwidth is not given (claims, open detail 10, whose standard choice is MNE's
    multitaper default). MNE's default normalized half-bandwidth is 4 (mne.time_frequency.multitaper._compute_mt_params
    with bandwidth None), which for a 20-sample window gives seven tapers with concentration above 0.9;
    NW = 4 with seven tapers and a jackknife over tapers is used, integrated from 2.5 to 25 Hz. NW = 2
    (three tapers), the first revision's choice, is shown as a variant.
  - Assumed. The claims file integrates from the lowest resolved frequency. 2.5 Hz (1 / 400 ms, the
    lowest nonzero frequency of the window) is used; integrating from the tapers' half-bandwidth W =
    NW / 0.4 s (10 Hz at NW = 4, 5 Hz at NW = 2) is shown as a variant.
  - A window belongs to a range of Figure 4 when it lies wholly inside it, so the -1 to 0 s range holds
    one window (-0.5 to -0.1 s), 0 to 1 s three and 1 to 2.5 s six; assignment by window centre is shown
    as a variant.
