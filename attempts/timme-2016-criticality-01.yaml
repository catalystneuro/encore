inputs:
- what: The NCC MATLAB toolbox the paper cites (Marshall et al., 2016), NCC Toolbox Version 1 of June
    14th, 2016, read and ported to Python in hc8.py and models.py (power-law fitting, avalanches,
    shape collapse, complexity, randomizations, branching ratio, Bethe lattice and cortical
    branching model). It is code, not data; the claims file names the same file.
  source: http://www.nicholastimme.com/software.html, zip with sha256
    b7c912f8154f70fc82b13ab1725ed191935ed2877256cadd7e39f66737be294b
- what: Avalanche size and duration exponents of hippocampal and leech networks (Results, burst
    statistics, Figure 9), reference values for fig8-exponents-match-literature.
  source: Mazzoni et al. (2007), PLoS ONE 2:e439, doi:10.1371/journal.pone.0000439 (full text read
    at Europe PMC, PMC1857824)
- what: Critical exponents tau, alpha and 1/sigma nu z of the critical data sets (main text after Eqs.
    1 to 3, and the Figure 2 legend), reference values for fig8-exponents-match-literature.
  source: Friedman et al. (2012), Phys. Rev. Lett. 108:208102, doi:10.1103/PhysRevLett.108.208102
    (accepted manuscript at link.aps.org/accepted/10.1103/PhysRevLett.108.208102)
outcomes:
- claim: culture-counts
  outcome: reproduced
  notebook: culture_criticality.ipynb
  output: claim:culture-counts
  measured:
  - 435
  - 39529
  - 91
  notes: The data set holds 435 recordings and 39529 neurons (data.nNeurons, equal to the number of
    spike trains in every file), as the paper states. The median number of neurons per recording is
    91 and the Terrell-Scott histogram mode 93.3. Firing rates over the first 59 min have 5th and
    95th percentiles of 0.04548 Hz and 7.70 Hz, inside the criterion's range of 0.045 to 22 Hz,
    close to its lower bound; the minimum is 0.0155 Hz and the maximum 64.20 Hz, and non-zero rates
    span 3.62 orders of magnitude.
- claim: fig2d-network-isi
  outcome: reproduced
  notebook: culture_criticality.ipynb
  output: claim:fig2d-network-isi
  measured: 6.67
  notes: Reading (a), the median mean network ISI over the 435 recordings, is 6.67 ms, within 7 +/-
    0.7 ms; reading (b), the Terrell-Scott mode, is 8.50 ms and outside. The ISI ranges from 0.91 to
    152.78 ms (5th to 95th percentile 2.65 to 19.81 ms).
  deviations:
  - The ISI is rounded to a whole number of 0.05 ms bins for rebinning, as rebin.m requires (claims
    file, common detail 1).
- claim: fig2e-avalanche-count
  outcome: not_reproduced
  notebook: culture_criticality.ipynb
  output: claim:fig2e-avalanche-count
  measured: 83289
  notes: After rebinning the first 59 min to the mean network ISI, the median number of avalanches
    per recording is 83289 (reading a) and the histogram mode 81707 (reading b), against 10000 +/-
    1000; the range is 2250 to 531966 and only 2 of 435 recordings have 9000 to 11000. On a log scale
    the median is 10^4.92 and 43 of 435 recordings lie within half a decade of 10^4, so the count
    does not hold as an order of magnitude either. How the paper counted avalanches for Figure 2E is
    asked of the authors (findings).
- claim: fig8-subsampling-exponents
  outcome: reproduced
  notebook: culture_criticality.ipynb
  output: claim:fig8-subsampling-exponents
  notes: Over 435 recordings, the full-system search gives tau 2.491 +/- 0.623 and alpha 2.928 +/-
    0.648; sub-sampling with each sub-sample rebinned to its own ISI gives tau 2.106 +/- 0.407 and
    alpha 2.730 +/- 0.579, lower means and lower SDs. 1/sigma nu z changes by 3.6% (size given
    duration, 1.411 to 1.360) and 1.6% (shape collapse, 1.467 to 1.490). Keeping the full system's
    bin for the sub-samples gives tau 1.745 +/- 0.465, alpha 2.356 +/- 0.504 and changes of 1.9% and
    3.4%, the same conclusion. On one recording run with layout (b), the extrapolated values differ
    from layout (a) by at most 0.044. One recording has no accepted duration fit.
  deviations:
  - Methods 2.10 do not say whether a sub-sample is rebinned to its own network ISI; the main
    reading rebins it ("These analyses were identical to those performed in the whole recorded
    system", Methods 2.10), and keeping the full system's bin is shown. Both give the same outcome.
  - Layout reading (b) of the sub-sampling (30 sub-samples at every integer size) was run on one
    recording only, as it costs about 55 times layout (a).
  - No recording is excluded under reading (a) of the exclusion rule (all 435 keep values after the
    cuts and at least two shape collapse durations), while Figure 2B marks some as excluded.
- claim: fig8-exponents-match-literature
  outcome: blocked
  blocked_by: other
  notebook: culture_criticality.ipynb
  output: claim:fig8-exponents-match-literature
  notes: The test needs the exponents reported by Mazzoni et al. (2007), Pasquale et al. (2008) and
    Friedman et al. (2012). They were not retrieved before round 2, which verified the outcome as
    blocked. In the round-2 revision two of the three were read (inputs). For tau the sub-sampled
    mean 2.106 is closer than the full-system mean 2.491 to Mazzoni et al. (1.55, hippocampal
    networks, definition 1) and to Friedman et al. (1.6); for alpha 2.730 is closer than 2.928 to 2.1
    and 1.7. Every variant of the reference values (Mazzoni et al.'s other definitions and the leech
    networks, Friedman et al.'s Figure 2 sample) and the full system's bin for the sub-samples give
    the same. 1/sigma nu z from size given duration is 1.411 (full) and 1.360 (sub-sampled) against
    1.3 in Friedman et al. Both means remain 0.51 to 1.03 above the cited values. No open full text of
    Pasquale et al. (2008) was found (Europe PMC, Unpaywall, ScienceDirect, the University of Genoa
    repository), and its abstract gives no exponents.
  deviations:
  - Pasquale et al. (2008) is left out; with two of the three papers, most of the cited papers means
    both, and the third could not reverse a two-of-two result.
  - Which value of each paper is meant is not stated; the main reading takes Mazzoni et al.'s
    hippocampal networks with definition 1, which that paper "used for later analysis", and Friedman
    et al.'s main-text values; the others are variants.
  proposed:
    outcome: reproduced
    reason: The reference values of two of the three cited papers were read after round 2. For both
      exponents and both papers, under every variant of the values and of the rebinning, the
      sub-sampled mean is closer to the cited value than the full-system mean, so the sub-sampled
      exponents agree better with the literature for most of the cited papers, as the criterion
      asks (culture_criticality.ipynb, fig8-exponents-match-literature).
- claim: fig8-sigmanuz-methods-agree
  outcome: reproduced
  notebook: culture_criticality.ipynb
  output: claim:fig8-sigmanuz-methods-agree
  notes: Full system, size given duration 1.411 +/- 0.157 and shape collapse 1.467 +/- 0.204,
    difference 0.056; sub-sampling (own bin) 1.360 +/- 0.226 and 1.490 +/- 0.337, difference 0.130;
    sub-sampling (full-system bin) 1.383 and 1.517, difference 0.133 against SD 0.297. Every
    difference is below the larger SD. Per recording the two differ by less than 0.1 in 0.67 of
    recordings.
- claim: eq4-exponent-relation
  outcome: reproduced
  notebook: culture_criticality.ipynb
  output: claim:eq4-exponent-relation
  notes: From the mean exponents, (alpha - 1)/(tau - 1) is 1.293 +/- 0.694 (search algorithm) and
    1.565 +/- 0.778 (sub-sampling), within one propagated SD of both estimates of 1/sigma nu z. The
    propagated SDs are about half the value, so the test accepts a wide range; per recording the
    ratio is within 0.1 of the size given duration exponent in 0.21 of recordings and within 0.2 in
    0.47 (medians 1.226 and 1.389).
- claim: eq4-relation-randomized
  outcome: reproduced
  notebook: culture_criticality.ipynb
  output: claim:eq4-relation-randomized
  notes: The relation holds within one SD for all five randomizations that change the avalanches.
    For wrap and Poisson, tau (3.262, 4.287) and alpha (3.659, 4.294) each differ from the real data
    (2.491 +/- 0.623, 2.928 +/- 0.648) by more than one SD; for the jitters they do not. Swap and
    shuffling keep A(t) and so the exponents.
- claim: fig9-branching-ratio
  outcome: reproduced
  notebook: culture_criticality.ipynb
  output: claim:fig9-branching-ratio
  notes: B_new (delays 1 to 8, A(t) <= 10) has median 0.973, SD 0.064 and range 0.484 to 1.030; 0.736
    of recordings lie in [0.95, 1) and 0.874 in [0.9, 1); 16 recordings are at 1 or above. B_basic
    (Eq. 11) has median 0.798 and SD 0.088, below 0.95 in 0.947 of recordings and below 0.9 in 0.846.
    Both band readings satisfy the criterion. Variants, brsimple median 0.586 and the per-avalanche
    ratio of avprops median 0.404.
- claim: fig10b-susceptibility-randomization
  outcome: reproduced
  notebook: culture_criticality.ipynb
  output: claim:fig10b-susceptibility-randomization
  notes: Under reading (b) of the susceptibility (N var(A/N)) with Benjamini-Hochberg, all five
    randomizations that change A(t) lower the median (relative changes -9.0% to -71.9%) with
    corrected p from 0.0227 (1-bin jitter) to 3e-138, and Poisson and wrap give the largest
    decreases. Under Eq. 14 as printed (reading a), 1-bin jitter is not significant (corrected p
    0.091 BH, 0.236 BY), and under Benjamini-Yekutieli with reading (b) its corrected p is 0.0588.
    Swap and shuffling leave the susceptibility unchanged, as the legend says. The jitter moves
    one spike at a time, as randomizeasdf2.m does (round-2 revision); 0.449, 0.135 and 0.054 of the
    spikes stay in place under 1-, 10- and 100-bin jitter.
- claim: fig10c-curvature-randomization
  outcome: partially_reproduced
  notebook: culture_criticality.ipynb
  output: claim:fig10c-curvature-randomization
  notes: The median absolute curvature of the real data is 2.29; it falls to 0.855 (10-bin jitter),
    0.0527 (100-bin jitter), 0.266 (wrap) and 0.0746 (Poisson), each with corrected p below 1e-36
    under both corrections, and rises to 2.45 under 1-bin jitter (corrected p 0.313). The criterion
    needs all five, so the claim holds for four. The criterion defines no partial outcome; partially
    reproduced follows the rule of fig11bd-exponents-randomization, and a question asks a reader
    about it. The toolbox's signed curvature is negative (arched) in 0.94 of real recordings.
- claim: fig11ac-fit-range-randomization
  outcome: reproduced
  notebook: culture_criticality.ipynb
  output: claim:fig11ac-fit-range-randomization
  notes: Poisson randomization shortens the median size fit range from 0.694 to 0.248 decades and
    the duration range from 0.663 to 0.211 (corrected p about 4e-141). 10-bin jitter lengthens them
    to 0.750 and 0.732 (corrected p 3.13e-05 and 2.24e-06, significant). 100-bin jitter and wrap
    shorten both significantly, and 1-bin jitter changes neither (corrected p 0.318 and 0.502), so
    the legend's wider statement holds for three of the four other randomizations.
- claim: fig11bd-exponents-randomization
  outcome: partially_reproduced
  notebook: culture_criticality.ipynb
  output: claim:fig11bd-exponents-randomization
  notes: Tau rises significantly under 10-bin jitter, 100-bin jitter, wrap and Poisson (median 2.50
    to 4.53 under Poisson) and falls under 1-bin jitter (2.37, corrected p 0.00648). Alpha rises
    significantly under 100-bin jitter, wrap and Poisson; 1-bin and 10-bin jitter do not change it
    significantly (corrected p 0.143 and 0.526). Under Poisson the median largest fitted size falls
    from 44 to 21, consistent with the paper's explanation.
- claim: fig10a-complexity-randomization
  outcome: not_reproduced
  notebook: complexity_culture.ipynb
  output: claim:fig10a-complexity-randomization
  notes: Over 40 recordings with 100 subsets per size, the toolbox's complexity (correction and cut)
    has median 0.00223 bits/neuron in the real data. 100-bin jitter, wrap and Poisson lower it with
    Benjamini-Hochberg corrected p from 0.000473 to 1.16e-06, and Poisson and wrap give the two
    largest decreases. 1-bin and 10-bin jitter lower the median to 0.00149 and 0.000886 without
    significance (corrected p 0.539 and 0.0955), and shuffling raises it to 0.176 (corrected p
    2.85e-13, a relative change of 77.7, or 78.7 times the real median), against the claim;
    Benjamini-Yekutieli gives the same three. The cut keeps a median of 10 of 90 subset sizes for
    the real data and 74 for shuffled data. Without the cut shuffling lowers complexity too, but
    1-bin and 10-bin jitter are not significant (corrected p 0.442 and 0.293); without the
    correction shuffling raises it. With the jitter moving one spike at a time, as randomizeasdf2.m
    does (round-2 revision), 10-bin jitter is no longer significant (it was, at corrected p 0.0372,
    when all moves were proposed at once). The first version, with 10 subsets on 180 recordings,
    gave five of six lower and shuffling 74-fold higher, and was recorded as partially reproduced;
    the rise under shuffling contradicts the claim, so the outcome is not reproduced, as the
    verifier gave it.
  deviations:
  - 40 of the 435 recordings, drawn with a fixed seed. With the 100 subsets per size of Methods 2.9
    the 40 recordings took 28.1 min with 4 processes (complexity_culture.ipynb, first code cell), so
    all 435 would exceed the 60 min limit of a notebook. The first version used 10 subsets on 180
    recordings.
- claim: figs8-complexity-susceptibility-correlation
  outcome: not_reproduced
  notebook: complexity_culture.ipynb
  output: claim:figs8-complexity-susceptibility-correlation
  measured: 0.902
  notes: Pearson r between the toolbox's complexity and the susceptibility over 40 recordings is
    0.902 with Eq. 14 as printed and 0.905 with N var(A/N) (Spearman 0.724 and 0.745), against 0.23
    +/- 0.023; the correlation is positive, as stated, but much larger. Without the cut it is -0.605
    and -0.592, without the correction 0.267 and 0.446.
  deviations:
  - As for fig10a-complexity-randomization, 40 recordings.
- claim: figs9-complexity-fit-range-correlation
  outcome: not_reproduced
  notebook: complexity_culture.ipynb
  output: claim:figs9-complexity-fit-range-correlation
  measured:
  - 0.06
  - -0.107
  notes: Over 40 recordings, Pearson r of the toolbox's complexity with the size fit range is 0.060
    (p 0.72) and with the duration fit range -0.107 (p 0.51), against 0.296 and 0.197. Without the
    cut they are 0.052 and 0.276, without the correction 0.369 and 0.038; no variant matches both.
  deviations:
  - As for fig10a-complexity-randomization, 40 recordings.
- claim: fig12a-swap-preserves-complexity
  outcome: reproduced
  notebook: complexity_culture.ipynb
  output: claim:fig12a-swap-preserves-complexity
  notes: By the paper's rank sum test, spike swapping does not change the toolbox's complexity
    significantly over 40 recordings (median 0.00223 against 0.00265, relative +0.189; corrected p
    0.836 BH, 1 BY), and real and swapped complexity correlate with Pearson r 0.775, above the 0.7
    reading of strong (Spearman 0.533, below it). The median per-recording relative change is
    -0.089 and the signed-rank p 0.858. Both variants agree; without the cut p 0.927 and r 0.989,
    without the correction p 0.958 and r 0.998. With 10 subsets on 180 recordings the first version
    found a 65% decrease (corrected p 3.2e-08) and r 0.502; with 100 subsets the cut complexity of
    one recording still has a median coefficient of variation of 0.78 over repeated draws, so r
    passes the 0.7 reading by a small margin, and the rank sum test on 40 recordings has less power
    than on 180. On 200 recordings (complexity_swap.ipynb, the real and swapped data alone, the 40
    included with the same values) the rank sum test still finds no change (medians 0.00184 and
    0.00188, uncorrected p 0.933, so the corrected p is at least that), which keeps the claim
    reproduced under the criterion's rule; Pearson r falls to 0.658, below the 0.7 reading of
    strong correlation (Spearman 0.539, 0.598 on the 160 recordings not in the 40), so the
    statement's strong correlation does not hold on the larger set. Without the cut r is 0.971 and
    without the correction 0.997.
  deviations:
  - As for fig10a-complexity-randomization, 40 recordings; 200 in complexity_swap.ipynb.
- claim: fig12b-shuffle-lowers-complexity
  outcome: not_reproduced
  notebook: complexity_culture.ipynb
  output: claim:fig12b-shuffle-lowers-complexity
  notes: With the toolbox's complexity, real complexity exceeds shuffled complexity in none of 40
    recordings, the median rises by 0.174 (corrected p 2.85e-13) and Pearson r is 0.431. Without the
    cut the claim holds (real greater in all 40 recordings, corrected p 2.97e-07, r 0.902); without
    the correction real is never greater. Shuffling as Methods 2.5 describe is the toolbox's swap2,
    so the claims file's variant is the same procedure.
  deviations:
  - As for fig10a-complexity-randomization, 40 recordings.
- claim: fig3-chain-model-complexity
  outcome: reproduced
  notebook: models.ipynb
  output: claim:fig3-chain-model-complexity
  notes: With the exact joint distribution, the whole-system integration is 0 bits for c = 0, 5.84
    for c = 0.8 and 11 for c = 1; the complexity is 0 to eight decimals for c = 0 and c = 1 and 0.431
    bits for c = 0.8.
- claim: fig5d-bethe-small-avalanches
  outcome: reproduced
  notebook: models.ipynb
  output: claim:fig5d-bethe-small-avalanches
  notes: Of 10000 runs, 7018 end by layer 8. Their sizes after the cuts of Methods 2.7 are accepted
    as a truncated power law (tau 1.593, sizes 4 to 12, p 0.338) and their complexity, with the
