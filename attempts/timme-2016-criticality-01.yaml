    is 1, B_basic is 0.9676 there, and the mean avalanche size rises from 16.1 at 0.25 to 110.9 at
    0.28 and 2276.6 at 0.30.
findings:
- kind: metadata_error
  statement: In 47 of the 435 files, 64 spike times are later than data.nbins, which the data
    description defines as the length of the recording in bins.
- kind: format_error
  statement: Six files hold 21 repeated spike times within one neuron (the same 0.05 ms bin listed
    twice in a spike train).
- kind: other
  statement: data.wave_ClusParams.ref is 30 in every file (1.5 ms at the stored sr of 20000 Hz), the
    detector dead time, while Methods 2.2 say the dead time was removed; within-neuron intervals as
    short as 0.05 ms occur, so the stored parameter does not describe the sorting that produced
    the spikes.
- kind: methods_unavailable
  statement: Question for the authors. Figure 2E and Methods 2.3 say most recordings contain around
    10,000 avalanches after rebinning to the mean network ISI. Rebinning the first 59 min of each file
    to its mean network ISI and counting runs of active bins gives a median of 83,289 avalanches per
    recording. Were avalanches counted differently for Figure 2E (a different window, bin, or a
    minimum size or duration)?
- kind: methods_unavailable
  statement: Question for the authors. Which recordings were excluded for too few avalanches (red
    squares of Figure 2B), and with what threshold? Every recording here keeps size and duration
    values after the cuts of Methods 2.7 and at least two durations for the shape collapse.
- kind: methods_unavailable
  statement: Question for the authors. With the complexity function of the NCC toolbox (sub-sampling
    correction and cut at the first peak of I(k)/(k-1)) and 100 subsets per size, as Methods 2.9
    give, the cut keeps a median of 10 of 90 subset sizes in the real culture data and 74 in
    shuffled data, the cut complexity of one recording varies with a median coefficient of variation
