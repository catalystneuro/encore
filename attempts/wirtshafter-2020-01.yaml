findings:
- kind: data_missing
  statement: The data set holds no position, speed or direction data, and no trial, lap or epoch markers.
    The paper's Methods describe position tracked at about 30 Hz by overhead cameras, and every finding
    from Figure 2 on (rate maps, spatial information, place fields, direction of travel, maze location,
    laps, and the matching of CA1 and LS fields for the cross-correlations) uses it, so none of the paper's
    31 findings can be tested on the data set. The data description names only spikes and time files,
    and the paper's Data availability names only this data set.
- kind: metadata_error
  statement: 'In rat 7, two spike trains, of 1033 and 1441 spikes, are deposited byte for byte under 18
    and 25 cluster names, across 16 of the 19 rat 7 recordings with clusters and three tetrodes (18, 27
    and 32). The copies cannot all be the recordings they are filed under, as 27 of them hold spikes after
    the end of their recording''s timestamps (5403 spikes in all), and these
    are the only spikes in the data set outside their recording. The 452 LS clusters, the paper''s count,
    include these 41 copies.'
- kind: other
  about: data
  statement: Several clusters hold the spikes of others. On rat 6's tetrode 26, in all 14 recordings with
    clusters there, a large cluster holds at least 99% of the spikes of the tetrode's other clusters,
    as if a cluster of all spikes were deposited beside the units; two of these clusters (2017-05-01,
    cl_7 and cl_9) are identical. Over the data set 89 pairs of clusters on one recording share at least
    99% of the smaller train's spikes within 0.5 ms. A further 24 pairs on neighbouring tetrodes (LS 29
    and 30, 21 and 22; CA1 1 and 6, in rats 7, 9, 10 and 12) share 71.5 to 98.5% of their spikes, against a median of 0.8% (at most 12%) for the same pairs with one train shifted by 1 s, so the same unit or the same noise was
    probably sorted twice. The data set does not say which clusters are single units, and of its 630 clusters
    588 are distinct trains.
- kind: metadata_insufficient
  statement: Times.mat is described only as "time files for all sessions". It holds 57 continuous time
    bases of the six rats, most at 0.512 ms intervals, six of rat 6 at 3.2 ms and one of rat 7 at 0.0512
    ms, lasting from 2.5 min to 31 h, while the paper analyses one 30 min maze session a day. Nothing
    marks which part of a recording is the maze session; in rats 10 and 12 the clusters' spikes span the
    whole 3.8 to 6.4 h recording. Eleven recordings have no cluster. The sampling intervals are not stated,
    and the last samples of rat 6's 2017-04-26 recording repeat timestamps.
- kind: metadata_insufficient
  statement: The cluster names follow the pattern the description gives (session date, tetrode, cluster)
    with the rat and a session suffix, but ten names of rat 7 (2017-07-21, tetrode 28) write cl1 for cl_1,
    and one LS cluster of rat 9 is labelled MUA9, a multi-unit label, with no description of what it holds.
    The CA1 clusters come from two of the six rats (10 and 12), which neither the description nor the
    paper states. Tetrodes 1 to 16 are CA1 and 17 to 32 LS, which the files show but the description does
    not say.
