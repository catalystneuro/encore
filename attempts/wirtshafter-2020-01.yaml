outcomes:
- claim: units-recorded
  outcome: blocked
  blocked_by: data_missing
  notebook: reproduce_wirtshafter_2020.ipynb
  output: claim:units-recorded
  notes: The data set holds 452 LS and 178 CA1 clusters, the paper's two counts of units recorded exactly,
    from six rats (LS from rats 6, 7, 8, 9, 10 and 12; CA1 from rats 10 and 12 only). Of the 452 LS clusters
    42 are byte for byte copies of other clusters (two rat 7 trains deposited 18 and 25 times, one rat
    6 pair), leaving 410 distinct trains, still within the tolerance of 45; all 178 CA1 trains are distinct.
    The other two counts, 165 CA1 and 378 LS cells meeting the rate and track coverage criteria, need
    the rate above 12 cm/s and the coverage of the track under either reading the criterion names, and
    so the animal's position and speed, which the data set does not hold. The criterion needs all four
    counts, so the claim is blocked. Over whole recordings 423 LS and 166 CA1 clusters reach 0.05 Hz,
    a variant that decides nothing, as the paper's rule counts only time above 12 cm/s.
  deviations:
  - Units are counted as the cluster fields deposited, copies included; the count of distinct spike trains
    is shown beside it.
