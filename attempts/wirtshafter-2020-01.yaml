findings:
- kind: data_missing
  statement: The data set holds no position, speed or direction data, and no trial, lap or epoch markers.
    The paper's Methods describe position tracked at about 30 Hz by overhead cameras, and every finding
    from Figure 2 on (rate maps, spatial information, place fields, direction of travel, maze location,
    laps, and the matching of CA1 and LS fields for the cross-correlations) uses it, so none of the paper's
    findings beyond the counts of units recorded can be tested on the data set. The data description names only spikes and time files,
    and the paper's Data availability names only this data set.
- kind: metadata_error
  statement: 'In rat 7, two spike trains, of 1033 and 1441 spikes, are deposited byte for byte under 18
    and 25 cluster names, across 16 of the 19 rat 7 recordings with clusters and three tetrodes (18, 27
    and 32). The copies cannot all be the recordings they are filed under, as 27 of them hold spikes after
    the end of their recording''s timestamps (5403 spikes in all), and these
    are the only spikes in the data set outside their recording. The 452 LS clusters, the paper''s count,
    include these 41 copies.'
- kind: other
  about: data
  statement: Several clusters hold the spikes of others. On rat 6's tetrode 26, in all 14 recordings with
    clusters there, a large cluster holds at least 99% of the spikes of the tetrode's other clusters,
    as if a cluster of all spikes were deposited beside the units; two of these clusters (2017-05-01,
    cl_7 and cl_9) are identical. Over the data set 89 pairs of clusters on one recording share at least
    99% of the smaller train's spikes within 0.5 ms. A further 24 pairs on neighbouring tetrodes (LS 29
    and 30, 21 and 22; CA1 1 and 6, in rats 7, 9, 10 and 12) share 71.5 to 98.5% of their spikes, against a median of 0.8% (at most 12%) for the same pairs with one train shifted by 1 s, so the same unit or the same noise was
    probably sorted twice. The data set does not say which clusters are single units, and of its 630 clusters
    588 are distinct trains.
- kind: metadata_insufficient
  statement: Times.mat is described only as "time files for all sessions". It holds 57 continuous time
    bases of the six rats, most at 0.512 ms intervals, six of rat 6 at 3.2 ms and one of rat 7 at 0.0512
    ms, lasting from 2.5 min to 31 h, while the paper analyses one 30 min maze session a day. Nothing
    marks which part of a recording is the maze session. Read whole, no recording changes its sampling
    interval or has a gap of 0.1 s, and no recording has a stretch of 60 s without a spike from any of
    its clusters, so neither the time bases nor the spikes mark the session; in rats 10 and 12 the clusters'
    spikes span the whole 3.8 to 6.4 h recording. Eleven recordings have no cluster. The sampling intervals
    are not stated. The six rat 6 recordings at 3.2 ms have 25 brief gaps of 8.7 to 93 ms, and two of them
    repeat timestamps (1121 in 3 s of 2017-04-21, 3280 at the end of 2017-04-26).
- kind: metadata_insufficient
  statement: The cluster names follow the pattern the description gives (session date, tetrode, cluster)
    with the rat and a session suffix, but ten names of rat 7 (2017-07-21, tetrode 28) write cl1 for cl_1,
    and one LS cluster of rat 9 is labelled MUA9, a multi-unit label, with no description of what it holds.
    The CA1 clusters come from two of the six rats (10 and 12), which neither the description nor the
    paper states. Tetrodes 1 to 16 are CA1 and 17 to 32 LS, which the files show but the description does
    not say.
verifications:
- date: '2026-11-13'
  kind: agent
  by: Independent agent run by CatalystNeuro (same harness, separate context, did not write the notebook)
  reviewed: The first executed notebook with the conclusion cells and the summary removed, the helper module hc29.py
    and the claims file, with the paper's full text. The verifier listed the S3 bucket itself and tested the name-parsing
    regexes on synthetic and real-form names; it could not run the numerical helpers, having no numpy, and had no
    access to the paper's code repository.
  results:
  - claim: units-recorded
    agrees: false
    outcome: partially_reproduced
    reason: Cell 16 counts 452 LS and 178 HPC clusters from 6 rats, which equals the paper's numbers exactly; 410
      LS trains are distinct, still within ±45. The other two counts (165 CA1 and 378 LS cells meeting the rate
      and coverage criteria) need speed and track coverage, and neither reading in the criterion can be computed
      without position. The whole claim is labelled blocked, although half of it was tested and matches exactly;
      a label of partially_reproduced, with the inclusion counts blocked, would describe the result more accurately
      (problem 1). The 452 is a count of deposited LS entries, not units, with 42 extra copies of identical trains
      and a MUA9 multi-unit cluster, and 410 distinct trains is still within tolerance (problem 2). rate_hz is computed
      over the whole recording, labelled a variant that decides nothing, which is correct (problem 3).
    response: 'Changed the outcome to partially_reproduced, as the verifier gives it: the two counts of units recorded
      are tested and match, and the two counts of cells meeting the criteria stay untested (data_missing); the notes,
      the notebook''s header, result and summary, the README and the dependent claims'' notes now say so, with the
      sentence on failures to reproduce. Problems 2 and 3 need no change. For the other points of the report: the
      check of the table of needs (problem 4) now gives units-recorded its own entry, has no default, and prints
      the claims without an entry and the entries for no claim (both empty); the notebook now says that CA1 clusters
      come from rats 10 and 12, which give 184 of the 452 LS clusters, so a CA1 against LS comparison over all units
      would set two rats against six (problem 5); the duplicate search (coincident_fraction, identical_groups, duplicate_pairs)
      is run on synthetic trains with known answers and gives them (problem 6 and section C). Outputs added for
      section C: the paper''s code repository at 5c6320a9 listed with sizes (4890 files, 35.4 MB, the largest library
      sample data under 1 MB, no tracking file); every sample interval of all 57 recordings in Times.mat read whole
      (no change of sampling rate in any recording, no gap of 0.1 s, 25 gaps of 8.7 to 93 ms and repeated timestamps
      only in the rat 6 recordings at 3.2 ms); and the spike-free stretches of each recording (none of 60 s or more,
      the longest 38 s), so no maze session window can be found in the data.'
