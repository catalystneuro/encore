- claim: fig4j-eye-encoding-cells
  outcome: reproduced
  notebook: reproduce_mallory_2021.ipynb
  output: claim:fig4j-eye-encoding-cells
  measured:
  - 718
  - 341
  - 243
  - 238
  - 137
  notes: 'Main readings (folds in turn, out-of-range bins dropped): 718 of 2861 units encode an eye variable; Eh
    341, Ev 243, Eh dot 238, Ev dot 137, all within tolerance. The code''s final test on the last model tried gives
    720, 340, 245, 238, 139. With 10-s sections assigned to folds at random (readings_folds_mallory_2021.ipynb)
    614 units encode an eye variable (Eh 282, Ev 177, Eh dot 231, Ev dot 99), outside tolerance for the total. The
    fraction varies by mouse from 0.144 to 0.521. 3 units have no spike in the kept bins. Round 2, reading (1b)
    random folds (readings notebook, every downstream analysis): 614 eye cells, Eh 282, Ev 177, Eh dot 231, Ev dot
    99, one of four within tolerance, as in round 1. Reading (2b) clip was not run, for time (each reading takes
    about 45 min).'
  deviations:
  - The LN pipeline is reimplemented in Python (mec_ln.py) from the Methods and the spline code the claims file
    cites; fits use Newton's method to the same penalized Poisson objective, stopped when the predicted fall of
    the objective is below 1e-6 (fminunc's default function tolerance), in place of fminunc.
  - 'Open detail (2b), clipping each variable to its inner range, was not run: the full run was stopped by the time
    limit while executing that notebook. Detail (1) was run under both readings.'
  - Reading (2b), each variable clipped to its inner range, was not run (round 2, for time); reading (1b) is run
    on every downstream analysis in readings_folds_mallory_2021.ipynb.
