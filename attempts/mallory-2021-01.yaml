inputs:
- what: The freely moving cells of Cohort 1 with head pitch and roll (spike times, body position and speed, azimuthal
    head direction and velocity, pitch, roll), the data of the `elsewhere` Cohort 1 claims; figshare Dataset 1 of
    the paper, version 1, streamed into memory.
  source: doi:10.6084/m9.figshare.13425392.v1
- what: The freely moving cells of Cohort 2 (no inertial sensor); figshare Dataset 2 of the paper, version 1, read
    in place. Only its cell index and the azimuthal head velocity of each session were read, for fig1b.
  source: doi:10.6084/m9.figshare.13425017.v1
- what: Which dandiset files are the paper's 11 head-fixed recordings (session names, unit and frame counts), and
    the first unit's spikes and the behaviour of each, used only to match and check the files; figshare Dataset
    3 of the paper, read in place.
  source: doi:10.6084/m9.figshare.13426103.v1
- what: The spline LN code the claims file cites (spline_1d.m, glm_model.m, fit_model_kfold.m, compute_test_train_ind.m,
    forward_search_kfold.m, compute_llh.m, compute_llh_increase.m), read to follow its method, and the lines that
    fix the log 2 factor, the -5 baseline, the final test and the fold assignment are fetched and printed in the
    main notebook; no code or data from it is run.
  source: https://github.com/khardcastle/spline-lnp-model at commit 34b470f
outcomes:
- claim: headfixed-session-link
  outcome: reproduced
  notebook: reproduce_mallory_2021.ipynb
  output: claim:headfixed-session-link
  notes: All 11 figshare session files match exactly one dandiset ecephys file each by subject, unit count and frame
    count; together 2861 units from 8 mice, as the Methods state. In every pair the body position, body speed and
    both eye positions are equal, and the first unit's spike times are equal after the repair of a wrapped index
    entry in two files (npI3 0420 and npI4 0421 obj-1h2xem6); as stored, unit 0 of those two files has 65536 spikes
    too few.
  deviations:
  - The match uses the paper's figshare deposit, read in place, only to choose the files; no measurement comes from
    it.
