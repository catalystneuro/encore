findings:
- kind: data_missing
  statement: The open field files hold no head pitch, roll or their angular velocities (the IMU data of
    Cohort 1), on which 19 of the paper's freely moving findings rest. The paper deposited them on figshare
    (Dataset 1, doi:10.6084/m9.figshare.13425392.v1).
- kind: identifier_missing
  statement: The dandiset holds 20 head-fixed ecephys files from 9 mice (5120 units) and does not say
    which are the paper's 11 recordings (2861 units, 8 mice). They can be found only by matching subject,
    unit and frame counts to the paper's figshare deposit; the other 9 are gain and contrast sessions
    that the dandiset does not describe.
- kind: format_error
  statement: In sub-npI3_ses-20190420_behavior+ecephys.nwb and sub-npI4_ses-20190421_obj-1h2xem6_behavior+ecephys.nwb
    the first entry of units/spike_times_index has wrapped at 2**16 (5852 for 71388, and 12175 for 77711),
    so unit 0 lacks its later spikes and unit 1 begins with them, out of time order. The paper's figshare
    deposit has the right trains.
- kind: metadata_error
  statement: Eye position is stated in metres and eye velocity in 'unknown'; the values are in % of the
    eye width (the unit of the paper's Results and Figure 4), the same as in the paper's deposit.
- kind: metadata_insufficient
  statement: The hemisphere of each head-fixed recording is not recorded (every electrode location is
    'unknown'), so the paper's left and right comparisons cannot be made. No subject has sex or age, and
    the open field cohorts are not identified (the six mice recorded in 50 and 70 cm arenas hold 179 units,
    consistent with Cohort 1).
- kind: other
  statement: Ten behaviour-only head-fixed files repeat the behaviour of ten ecephys files, and two probe
    insertions (npI4 2019-04-21, npJ5 2019-05-05) are each converted twice, with the same trial table
    and unit count over spans of different length.
- kind: other
  statement: Two head-fixed sessions have gaps in the behaviour timestamps (npI1 0413, up to 82 s; npI3
    0420, 217 and 308 s), and in npI3 0420 66% of the eye samples are missing.
- kind: other
  statement: The open field files hold 1200 units from 25 subjects, against 26 mice in the paper, and
    include arenas of 75 and 91.4 cm that the Methods do not list.
- kind: methods_unavailable
  statement: Questions for the paper's authors. (1) How were the 10-s sections assigned to folds? In turn,
    as compute_test_train_ind.m does, the eye-cell count is 718 (paper 711); at random it is 614. (2)
    Was the contribution normalized as (full - reduced) / full? The literal wording of the Methods ('subtracted
    from 1') inverts the paper's order of variables; a single held-out section, as compute_llh_increase.m,
    matches the medians best. (3) What rule separated symmetric from asymmetric velocity cells? Neither
    the slope-sign rule nor the shuffle rule gives the paper's 147 asymmetric Eh dot cells (39 and 78
    here).
