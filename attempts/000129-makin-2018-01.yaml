inputs:
- what: The paper's list of monkey I sessions (NeuralAnalysis/Indy_HC_Sessions.csv), read only to
    check whether the dandiset's session is one of the paper's. The decoders follow the same
    repository's code where the Methods are silent (cited in makin.py), but no file of it is
    loaded.
  source: https://github.com/jgmakin/rbmish at commit 700062f5118b0910411cf9a8f73498e22203731d
outcomes:
- claim: units-monkey-i
  outcome: not_reproduced
  notebook: reproduce_makin_2018.ipynb
  output: claim:units-monkey-i
  measured: [111, 111]
  notes: 111 of the 130 units in the file fire above 0.5 Hz over the 649.1 s session, below the
    criterion's range of 153.9 to 454.3. The file holds sorted units only (unit ids end in 1 to
    4, none in 00), on 82 channels; the paper's counts include one unsorted hash unit per channel
    (Methods, Data acquisition), up to 96 more on this array, so the shortfall is consistent with
    the missing hash units. With thresholds of 0.25 and 1 Hz the count is 117 and 94. No unit is a
    duplicate of another.
  deviations:
  - One session, the only one in the dataset (dated 2017-02-02, not in the paper's session list),
    for a range over 37 sessions.
  - The rate is taken over the training file (649.1 s); the test file holds 190.3 s more of 98 of
    the units.
- claim: fig2-refh-kf-best
  outcome: blocked
  blocked_by: too_large
  notes: The criterion needs the bootstrap of the session-weighted mean SNR difference over the
    paper's 49 sessions. The dandiset holds one session, which is not in the paper's list; the
    paper's 47 Sabes-lab sessions are public on Zenodo (doi:10.5281/zenodo.583331, 10.5281/zenodo.3854034)
    and monkey C's two sessions come from Dyer et al. without an archive identifier. Here the
    eight decoders at 64 ms take 124 s on one session of 111 units. The rEFH's cost grows with the
    square of the number of units and the EM of KFlatent with its cube, and the paper's sessions
    have 171 to 523 units, so the 64 ms decoders on the 47 sessions are estimated at several
    hours, beyond the 30 min notebook limit and the time of this run; they were not run. On the
    one session the rEFH (+KF) has the highest mean SNR for position, velocity and acceleration
    (5.91, 5.06 and 2.36 dB), which does not decide the outcome.
- claim: intro-gain-over-nearest
  outcome: blocked
  blocked_by: too_large
  notes: The criterion needs the bootstrap over the 49 sessions for the position gain (p >= 0.01);
    see fig2-refh-kf-best for the data and the estimate. On the one session the gains of the rEFH
    (+KF) over the UKF are 0.28, 1.24 and 1.25 dB for position, velocity and acceleration (reading
    b), which does not decide the outcome.
- claim: fig2-velocity-boost
  outcome: not_reproduced
  notebook: reproduce_makin_2018.ipynb
  output: claim:fig2-velocity-boost
  assumed: true
  notes: Velocity SNR gains over linear regression are 3.67 dB for the rEFH (+KF), 1.91 for KFobs
    and 2.42 for the UKF. The rEFH's gain is 1.92 times KFobs's (the criterion needs more than 2)
    and 1.51 times the UKF's (inside 1.5 to 2.2), so only the UKF part holds, which the criterion
    does not grade as partial. With the code's kinematics (cursor, no filter, bin means) the
    ratios are 2.05 and 1.70 and the claim is reproduced. With rEFH seeds 1 and 2 the KFobs ratio is
    1.93 and 1.95. The outcome rests on the kinematics reading. Question for the paper's authors
    (finding below) was the decoded kinematic state the fingertip position filtered at 10 Hz and
    subsampled, as the Methods say, or the unfiltered cursor position averaged over each bin, as
    getLatentsBMI.m and binSpikeCounts.m do?
  deviations:
  - One session in place of 49; the session-weighted means are this session's values.
  - The kinematics follow the Methods (fingertip, 4th-order Butterworth at 10 Hz, last sample of
    each bin), as the claims file makes its main reading; the code's reading changes the outcome,
    and this reading is adopted as the one the paper's text states.
  - Sorted units only (111), without the hash units the paper used.
  - The UKF is a re-implementation of Li's UKF2; its fitting code is not in the paper's repository.
- claim: fig2-kflatent-dynamic-little-effect
  outcome: reproduced
  notebook: reproduce_makin_2018.ipynb
  output: claim:fig2-kflatent-dynamic-little-effect
  notes: KFlatent (+KF) minus static KFlatent is 0.18, 0.21 and 0.09 dB for position, velocity and
