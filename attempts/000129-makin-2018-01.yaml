- claim: fig5-advantage-with-binwidth
  outcome: reproduced
  notebook: binwidth_training_neurons.ipynb
  output: claim:fig5-advantage-with-binwidth
  notes: The rEFH (+KF) SNR rises from 3.01 to 5.46 dB (velocity) and 0.96 to 2.39 dB
