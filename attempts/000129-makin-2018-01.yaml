inputs:
- what: The paper's list of monkey I sessions (NeuralAnalysis/Indy_HC_Sessions.csv), read only to
    check whether the dandiset's session is one of the paper's. The decoders follow the same
    repository's code where the Methods are silent (cited in makin.py), but no file of it is
    loaded.
  source: https://github.com/jgmakin/rbmish at commit 700062f5118b0910411cf9a8f73498e22203731d
outcomes:
- claim: units-monkey-i
  outcome: not_reproduced
  notebook: reproduce_makin_2018.ipynb
  output: claim:units-monkey-i
  measured: [111, 111]
  notes: 111 of the 130 units in the file fire above 0.5 Hz over the 649.1 s session, below the
    criterion's range of 153.9 to 454.3. The file holds sorted units only (unit ids end in 1 to
    4, none in 00), on 82 channels; the paper's counts include one unsorted hash unit per channel
    (Methods, Data acquisition), up to 96 more on this array, so the shortfall is consistent with
    the missing hash units and does not contradict the paper. With thresholds of 0.25 and 1 Hz the
    count is 117 and 94. No unit is a duplicate of another.
  deviations:
  - One session, the only one in the dataset (dated 2017-02-02, not in the paper's session list),
    for a range over 37 sessions.
  - The rate is taken over the training file (649.1 s); the test file holds 190.3 s more of 98 of
    the units.
- claim: fig2-refh-kf-best
  outcome: blocked
  blocked_by: data_missing
  notebook: reproduce_makin_2018.ipynb
  output: claim:fig2-refh-kf-best
  notes: The criterion needs the bootstrap of the session-weighted mean SNR difference over the
    paper's 49 sessions. The dandiset holds one session, which is not in the paper's list. The
    paper's 47 Sabes-lab sessions are public on Zenodo (doi:10.5281/zenodo.583331), but the claim
    is on the dataset (`data` is not `elsewhere`), so a reader is asked whether it should be
    (questions/000129.yaml). On the one session the mean part holds. The rEFH (+KF) has the
    highest SNR for position, velocity and acceleration (5.91, 5.06 and 2.36 dB), ahead of the
    next decoder by 0.28 dB (UKF), 1.19 and 0.45 dB (static rEFH), and it is highest with the
    other seeds and the code's kinematics (position margin 0.11 to 0.51 dB). This does not decide
    the outcome.
- claim: intro-gain-over-nearest
  outcome: blocked
  blocked_by: data_missing
  notebook: reproduce_makin_2018.ipynb
  output: claim:intro-gain-over-nearest
  notes: The criterion needs the bootstrap over the 49 sessions for the position gain (p >= 0.01);
    see fig2-refh-kf-best. On the one session the gains of the rEFH (+KF) are 0.28, 1.24 and 1.02 dB
    over the nearest decoder other than the two rEFH decoders (reading a; UKF, UKF and WF) and
    0.28, 1.24 and 1.25 dB over the UKF (reading b). Position and velocity are outside tolerance
    under both readings and with every seed (position 0.11 to 0.28 dB, velocity 1.24 to 1.31 dB);
    with the code's kinematics velocity is inside (1.45 and 1.55 dB) and position is 0.51 dB. No
    reading gets all three gains within tolerance on this session. This does not decide the
    outcome.
- claim: fig2-velocity-boost
  outcome: not_reproduced
  notebook: reproduce_makin_2018.ipynb
  output: claim:fig2-velocity-boost
  assumed: true
  notes: Velocity SNR gains over linear regression are 3.67 dB for the rEFH (+KF), 1.91 for KFobs
    and 2.42 for the UKF. The rEFH's gain is 1.92 times KFobs's (the criterion needs more than 2)
    and 1.51 times the UKF's (inside 1.5 to 2.2), so only the UKF part holds, which the criterion
    does not grade as partial. The result is borderline. With the code's kinematics (cursor, no
    filter, bin means) the ratios are 2.05 and 1.70 and the claim is reproduced; with rEFH seeds 1
    and 2 the KFobs ratio is 1.93 and 1.95. The copy the verifier reviewed, from an earlier run of
    the same notebook, gave 1.97 with seeds 1.92 to 1.99, so the ratio also moves by a few
    hundredths between runs; every run under the Methods kinematics has been below 2. The outcome rests on the kinematics reading. Question for the paper's authors
    (finding below) was the decoded kinematic state the fingertip position filtered at 10 Hz and
    subsampled, as the Methods say, or the unfiltered cursor position averaged over each bin, as
    getLatentsBMI.m and binSpikeCounts.m do?
  deviations:
  - One session in place of 49; the session-weighted means are this session's values, so a margin
    this small carries one session's noise.
  - The kinematics follow the Methods (fingertip, 4th-order Butterworth at 10 Hz, last sample of
    each bin), as the claims file makes its main reading; the code's reading changes the outcome,
    and this reading is adopted as the one the paper's text states.
  - Sorted units only (111), without the hash units the paper used.
  - The UKF is a re-implementation of Li's UKF2; its fitting code is not in the paper's repository.
- claim: fig2-kflatent-dynamic-little-effect
  outcome: reproduced
  notebook: reproduce_makin_2018.ipynb
  output: claim:fig2-kflatent-dynamic-little-effect
  notes: KFlatent (+KF) minus static KFlatent is 0.18, 0.21 and 0.09 dB for position, velocity and
    acceleration, all below 0.5 dB. With the two other EM seeds it is 0.18 to 0.19, 0.17 to 0.21 and
    0.10 to 0.11 dB, and with the code's kinematics 0.29, 0.45 and 0.22 dB. EM ran the full 100
    epochs in every run; the last epoch's gain was 4.3e-4 to 6.6e-4 of the total in the six runs of
    the first notebook (the code-kinematics run 4.3e-4), and 4.3e-4 to 9.4e-4 over every
    configuration of the second, above the Methods' criterion of 1e-4.
  deviations:
  - One session in place of 49.
  - Sorted units only (111); EM convergence judged on the log-likelihood, which the Methods'
    cross-entropy criterion is equivalent to up to a constant.
- claim: fig2-refh-static-vel-acc
  outcome: reproduced
  notebook: reproduce_makin_2018.ipynb
  output: claim:fig2-refh-static-vel-acc
  notes: The static rEFH has 3.87 dB velocity SNR against the best other decoder's 3.82 (UKF), and
    1.90 dB acceleration SNR against 1.34 (WF). The velocity margin is small, 0.05 dB here, 0.08 and
    0.17 dB with rEFH seeds 1 and 2, and 0.09 dB over KFlatent (+KF) with the code's kinematics;
    the claim holds in all six runs, the EM seeds included.
  deviations:
  - One session in place of 49, so the small velocity margin carries one session's noise.
  - Sorted units only (111); the UKF is a re-implementation of Li's UKF2.
- claim: fig2-position-dynamic-gain
  outcome: not_reproduced
  notebook: reproduce_makin_2018.ipynb
  output: claim:fig2-position-dynamic-gain
  measured: 4.45
  notes: The dynamic mapping raises the rEFH's position SNR from 1.46 to 5.91 dB, a gain of 4.45
    dB (4.32 for x, 4.58 for y), outside 3 +- 0.5 dB. The effect is present and larger than the
    paper's; it is 4.22 to 4.52 dB with the other seeds and the code's kinematics. The static map
    has position R2 0.39 and 0.51 (x, y) on the training bins it was fitted on and 0.19 and 0.37 on
    the test bins, so the second KF, fitted on the training outputs as the paper's dynamic map is,
    sees outputs less noisy than those it filters at test. Whether this makes the gain larger than
    the paper's is not tested here.
  deviations:
  - One session in place of 49.
  - Sorted units only (111).
- claim: fig2-sagittal-better
  outcome: partially_reproduced
  notebook: reproduce_makin_2018.ipynb
  output: claim:fig2-sagittal-better
  notes: y has the higher SNR in 23 of 24 decoder and variable pairs; the exception is the static
    rEFH's velocity (y minus x -0.06 dB). Linear regression's velocity margin is 0.01 dB. With rEFH
    seed 2 all 24 hold; with rEFH seed 1, the two other EM seeds and the code's kinematics 23, with
    the same exception. The copy the verifier reviewed, from an earlier run of the same notebook,
    gave 24 of 24, so the outcome depends on the training run of the rEFH.
  deviations:
  - One session in place of 49; the per-session comparison is this session's.
  - Sorted units only (111).
- claim: fig2-linear-worst
  outcome: reproduced
  notebook: reproduce_makin_2018.ipynb
  output: claim:fig2-linear-worst
  notes: Every other decoder exceeds linear regression for each of the six variables; the smallest
    margin is 0.45 dB (static rEFH, x position). It holds in every variant (smallest 0.20 dB, KFobs
    x acceleration, code kinematics).
  deviations:
  - One session in place of 49.
  - Sorted units only (111).
- claim: fig2-gross-failures
  outcome: reproduced
  notebook: reproduce_makin_2018.ipynb
  output: claim:fig2-gross-failures
  notes: No decoder has a negative R2 at 64 ms in this session (the lowest is 0.055, linear
    regression), so the criterion holds trivially; the claim's "in a few sessions" cannot be tested
    on one session. Outside the criterion's 64 ms with all units and 320 s of training, the second
    notebook prints negative R2 for linear regression (16 ms, 80 and 160 s, f = 1/8 and 1/4),
    static KFlatent, KFlatent (+KF) and the static rEFH (f = 1/8 and 1/4), KFobs (f = 1/4, x
    position), the UKF (f = 1/8, ay, and f = 1/4, x position), and KFlatent (+KF) at 16 ms; most are within 0.05 of zero, and at f = 1/8
    KFlatent (+KF) diverges (position SNR -76.63 dB). Under a reading of "in our experiments" that
    covers every configuration the claim would fail; a reader is asked (questions/000129.yaml).
  deviations:
  - One session in place of 49.
  - Sorted units only (111).
- claim: fig4-vel-acc-every-session
  outcome: reproduced
  notebook: reproduce_makin_2018.ipynb
  output: claim:fig4-vel-acc-every-session
  notes: In this session the rEFH (+KF) beats KFobs and the UKF in all 8 velocity and acceleration
    comparisons, by 1.04 to 1.81 dB, and in every variant (smallest margin 1.04 dB). The criterion's
    second part, the bootstrap across sessions at p < 0.01, cannot be run on one session; the
    outcome rests on the per-session part, which the claims file names as testable on one
    session. The verifier graded it partially reproduced in round 1 and agreed in round 2.
  deviations:
  - One session in place of 49; the bootstrap part of the criterion is not tested.
  - Sorted units only (111); the UKF is a re-implementation of Li's UKF2.
- claim: fig4-advantage-grows
  outcome: blocked
  blocked_by: data_missing
  notes: The regression of rEFH (+KF) SNR on KFobs SNR runs over all sessions and both axes; one
