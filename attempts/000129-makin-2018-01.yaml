- claim: fig7-kinematic-model-saturates
  outcome: reproduced
  notebook: binwidth_training_neurons.ipynb
  output: claim:fig7-kinematic-model-saturates
  notes: Under reading b (1/8 to 1/2) the position SNR of KFobs, KFlatent (+KF), the UKF and the
    rEFH (+KF) rises 6.67, 207.33, 6.93 and 6.22 dB per unit f, faster than from 1/2 to 1 (3.79,
