  - Sorted units only (111).
- claim: fig6-training-time
  outcome: blocked
  blocked_by: data_missing
  notebook: binwidth_training_neurons.ipynb
  output: claim:fig6-training-time
  notes: Part (ii) needs the bootstrap over the 49 sessions, and part (iii) its p-values; see
