    session; see fig2-refh-kf-best.
- claim: fig4-position
  outcome: blocked
  blocked_by: data_missing
  notebook: reproduce_makin_2018.ipynb
  output: claim:fig4-position
  notes: Needs the bootstrap over the 49 sessions; see fig2-refh-kf-best. On the one session the
