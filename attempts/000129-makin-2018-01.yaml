- claim: fig5-vel-acc-all-bins
  outcome: blocked
  blocked_by: data_missing
  notebook: binwidth_training_neurons.ipynb
  output: claim:fig5-vel-acc-all-bins
  notes: Needs the bootstrap over the 49 sessions at four bin widths; see fig2-refh-kf-best. On the
