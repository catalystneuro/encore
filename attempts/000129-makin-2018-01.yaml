  deviations:
  - One session in place of 49.
  - Sorted units only (111).
- claim: fig4-task-similar
  outcome: blocked
  blocked_by: other
  notes: The comparison is of monkey C's two sessions with the range of monkey I's 37 sessions. The
    dandiset holds one monkey I session, not among the 37. Monkey C's data are named only by the
    preprint (Dyer et al., biorxiv 080861), with no archive identifier to pin, so they cannot be
