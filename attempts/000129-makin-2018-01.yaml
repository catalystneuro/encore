- claim: fig7-affine-position
  outcome: not_reproduced
  notebook: binwidth_training_neurons.ipynb
  output: claim:fig7-affine-position
  measured: [0.995, 0.995, 0.986, 0.991]
  notes: Correlations of position SNR with f are 0.995 (linear regression), 0.995 (static KFlatent),
