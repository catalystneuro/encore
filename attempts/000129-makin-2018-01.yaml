- claim: fig4-best-variable
  outcome: not_reproduced
  notebook: reproduce_makin_2018.ipynb
  output: claim:fig4-best-variable
  notes: Position is the best-decoded variable for all three decoders. The rEFH (+KF) has 5.91 dB
