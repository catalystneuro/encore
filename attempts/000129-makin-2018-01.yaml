  - Sorted units only (111); the UKF is a re-implementation of Li's UKF2.
- claim: fig5-derivative-order
  outcome: partially_reproduced
  notebook: binwidth_training_neurons.ipynb
  output: claim:fig5-derivative-order
  notes: The mean SNR of the six non-rEFH decoders falls from position to velocity to acceleration
    at all four widths (64 ms, 3.79, 3.06 and 0.99 dB). The percent advantage of the rEFH (+KF)
