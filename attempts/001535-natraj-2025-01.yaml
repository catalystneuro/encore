- claim: rnn-training-data-amount
  outcome: reproduced
  assumed: true
  notebook: reproduce_natraj_2025.ipynb
  output: claim:rnn-training-data-amount
  measured: 837.4
  notes: Under reading (a), the whole stored trial, the 9737 trials last 837.4 min (13 h 57.4 min), within
    888 +/- 88.8 min; without target ids 8 and 9 they last 814.3 min, also within. The 7851 virtual trials
    last 540.0 min and the 1886 robot trials 297.3 min; without the robot trials the total is outside
    the tolerance. Trials last 1.80 to 11.09 s (virtual median 3.41 s, robot median 9.01 s). Reading (b),
    the active portion, cannot be run as the file has no task states; it is at most reading (a). Whether
    the robot trials are the real-world practice with the MLP that the paper counts, or the later RNN
    fine-tuning data, is a question for the paper's authors.
  deviations:
  - Assumed that the dandiset's 9737 trials are the RNN training data the paper counts, including the
    1886 robot trials as the real-world practice with the Kinova Jaco (Methods, RNN decoders based on
    spatiotemporal activity patterns, paragraph 2, "in the virtual 3D environment and with practice with
    the Kinova Jaco in the real-world using the MLP"). The dandiset description calls them training trials
    for decoders and points to the paper's biLSTM, but does not say they are exactly its training set,
    and the robot flag does not say which robot data they are.
  - Duration is the number of samples divided by 100 Hz; the last minus first timestamp gives 835.7 min,
    also within the tolerance.
  - Reading (b) of the criterion (active portion only) could not be run; the file has no task states.
- claim: figs3-spatial-pooling
  outcome: blocked
  blocked_by: data_missing
  notes: The claim needs the 200 ms binned high-gamma band power of the MLP pipeline in one session's
    right thumb trials, and the online pilot blocks. The dandiset's high gamma is the biLSTM input at
    100 Hz, L2 normalized per trial, with no session labels and no names for the target ids; there is
    no electrodes table, so the 2x2 pooling over the 8x16 grid cannot be formed (metadata_insufficient).
findings:
- kind: data_missing
  statement: The dandiset holds only participant B1's biLSTM training trials (high-gamma and low-frequency
    features at 100 Hz). Participant B3, the Figure 1 imagined-movement task, the delta, beta and high-gamma
    band-power features of the MLP decoders, the online decoder outputs, the ReFit-KF and IBID velocities
    and the robot task outcomes behind Figures 1 to 7 are not in it; 51 of the paper's 52 findings cannot
    be tested.
- kind: metadata_insufficient
  statement: No trial carries a day, session, block, or open-loop or closed-loop label; the trial table's
    start_time and stop_time are placeholders (the trial id and id plus one, described as DUMMY), and
    session_start_time is one date for all trials. Trials collected over many days cannot be grouped by
    day or context.
- kind: metadata_insufficient
  statement: The target ids 1 to 9 carry no names or directions in the file or the dandiset metadata.
    The paper's Methods name seven actions and directions, and its OSF code numbers them in two different
    orders.
- kind: metadata_error
  statement: The dandiset description speaks of 7 directional targets; the trial table has 9 target ids,
    with ids 8 and 9 (132 trials each) only in virtual-environment trials.
- kind: metadata_insufficient
  statement: The 256 features are not described column by column. The data show columns 0 to 127 almost
    always positive and 128 to 255 signed, which fits high gamma then low frequency, and each block has
    an L2 norm of 1 per trial, which the units ("arbitrary") do not state. There is no electrodes table,
    so the channels cannot be placed on the 8x16 grid.
- kind: metadata_insufficient
  statement: The is_robot flag does not say whether a robot trial is the real-world practice with the
    MLP decoder or the later fine-tuning data of the RNN. The paper's 14 h 48 min of training data matches
    the stored total (837.4 min) only if the 1886 robot trials are counted (540.0 min without them).
- kind: methods_unavailable
  statement: Question for the paper's authors. Are the 9737 trials of the dandiset the data the biLSTM
    was trained on (the 14 h 48 min of the Methods), and are its robot trials the real-world practice
    with the MLP counted there, or the later fine-tuning of the RNN? Is each stored trial the whole trial
    or only its active portion?
- kind: other
  statement: The subject's age is P38Y, where the paper (STAR Methods, Participants) gives B1 as 41 years
    old; neither says at what date the age applies, so the two may refer to different dates.
