- claim: fig7f-mua-electrodes
  outcome: not_reproduced
  notebook: reproduce_prakash_2022.ipynb
  output: claim:fig7f-mua-electrodes
  measured:
  - 56.73
  - 53.71
  - 19.43
  - 22.66
  notes: The two-tailed Mann-Whitney test finds no group difference under any of the 16 readings
    (p 0.67 to 0.97), although the KS test on the pooled 1 s bins does (p printed as 0). Opsin (+)
    mean change 39.4 to 56.7% and Opsin (-) 42.3 to 53.7%; the Opsin (-) medians (20.2 to 22.7%) are
