- claim: fig7c-gamma-emerges-opsin-plus
  outcome: reproduced
  notebook: reproduce_prakash_2022.ipynb
  output: claim:fig7c-gamma-emerges-opsin-plus
  notes: The Opsin (+) mean gamma power (30 to 100 Hz, 0 to 1200 s after onset) is 0.08 to 0.11 dB
    against -0.09 dB for Opsin (-), under both alignments of interlum_6 and both kept sets. The effect
    is small and rests mostly on interlum_8 (0.31 to 0.35 dB); interlum_6 is at 0.00 to 0.04,
    interlum_4 at -0.05 to -0.07 and interlum_ctrl_5 at 0.06 to 0.08 dB, above two of the three
    Opsin (+) mice. P against the mean baseline power, as the Methods define it, is biased below 0 dB
    (-0.43 dB on white noise, and a baseline mean of -0.43 dB in every mouse). Measured against each
    mouse's own baseline mean, all six mice rise, Opsin (+) by 0.39 to 0.80 dB (mean 0.54) and Opsin
    (-) by 0.20 to 0.51 dB (mean 0.34), so the statement's "not observed in Opsin (-)" holds only as the
    group comparison the criterion tests. The paper's own per-mouse means (Supplementary Data 7, Fig.
    7e) also include negative values (cntrl 2, -0.230 dB). The rule holds under the alternative onsets
    too (Opsin (+) 0.09 to 0.13 dB, Opsin (-) -0.11 to -0.10).
  deviations:
  - Onsets from the whole-frame bioluminescence (o2b); the dandiset records no ROI.
  - The paper's errant-contact rule flags 4 contacts over all mice here (1 to 3 per mouse), where the
    paper excludes 7; both the union (28 contacts per mouse) and each animal's own set (29 to 31)
    are run, as the claims file asks.
  - The files are at 10 kHz; the 1 kHz LFP is resampled with a polyphase anti-aliasing filter, a
    standard choice for the paper's "down sampled".
- claim: fig7d-contacts-exceeding-baseline
  outcome: not_reproduced
  notebook: reproduce_prakash_2022.ipynb
  output: claim:fig7d-contacts-exceeding-baseline
  measured:
  - 27.0
  - 27.67
  notes: Under all 16 readings (band, bound, alignment, kept set) nearly every contact exceeds
    baseline in both groups, Opsin (+) 24.7 to 29.3 contacts per mouse and Opsin (-) 25.3 to 29.3;
    the Opsin (-) mean is never within 2.5 of 2.7, and the Opsin (+) mean is higher under 2 of 16.
    The baseline mean of P is about -0.43 dB in every mouse while the post means are -0.23 to 0.35
    dB, and the bootstrap interval of a mean of 180 overlapping windows is narrow, so the rule counts
    small rises in both groups. As a variant, a moving-block bootstrap with 10 s blocks widens the
    interval; the counts fall (Opsin (+) 19.3 to 28.7, Opsin (-) 20.3 to 29.3 contacts per mouse) and
    the claim holds under none of its 8 readings. Under the alternative onsets the Opsin (-) mean is
    27.3 to 29.3. The same rule on the paper's own Fig. 7d series (Supplementary Data 7, each
    contact's group mean over mice in 1 s steps) counts 25 of 25 contacts above baseline in Opsin (+)
    and 20 of 25 in Opsin (-), 19 with 10 s blocks; the paper's Opsin (-) group mean rises by up to
    0.34 dB after onset. These are group means, not single mice, but they suggest that the paper's 2.7
    contacts per mouse came from a rule other than the one the Methods describe. Measured values are
    for the union set, (o1a), 30 to 100 Hz and the two-sided bound.
  proposed:
    outcome: blocked
    blocked_by: methods_underspecified
    reason: Applied to the paper's own Fig. 7d series of Supplementary Data 7, the criterion's rule
      counts 20 of 25 Opsin (-) contacts above baseline (19 with a 10 s block bootstrap), where the
      paper reports 2.7 +/- 2.5 per mouse. The group-mean series cannot give per-mouse counts, but a
      per-mouse mean of 2.7 is hard to reconcile with 20 of 25 contacts rising in the group mean. As
      with a selection whose false-positive rate differs from the paper's, the rule as described
      cannot give the paper's numbers on the paper's data, so the procedure differs and the result
      here says more about the rule than about the recordings.
  deviations:
  - Onsets from the whole-frame bioluminescence; kept sets as for fig7c-gamma-emerges-opsin-plus.
  - The bootstrap resamples the 180 baseline steps as independent values, as the claims file says,
    although consecutive 10 s windows in 1 s steps overlap; a 10 s block bootstrap is shown as a
    variant and gives the same outcome.
- claim: fig7d-superficial-layers
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: The depth order of the contacts cannot be established. The files' Position column runs z
    from 775 (channel 0) to 0 (channel 31) in 25 um steps, with an autogenerated description that does
    not say whether z is depth or height above the deepest contact. Nothing else in the files settles
    it, as printed in the notebook; every column of the electrode table has an autogenerated
    description, the electrode group says "electrode group for shank1" in barrel cortex, and the probe
    device says "A1x32-Poly2-5mm-50s-177". The paper's Fig. 7d source data number its 25 contacts 1 to
    25 with no depth or channel, so they cannot settle it either. Read with z = 775 as the most
    superficial contact, the upper part has the higher Opsin (+) gamma power under all 16 readings
    (for example 0.34 against -0.12 dB, halves, 30 to 100 Hz); read the other way, under none. With
    the union set and (o1a), Opsin (+) gamma power is 0.26 to 0.95 dB on the eight contacts from
    z = 600 to 775 and below 0 dB on all others. The MUA rate profile, a possible independent check,
    is flat at the noise level and cannot decide it. Set against the paper's per-contact Fig. 7d
    profiles (Supplementary Data 7, contacts 1 to 25), the rise over each contact's baseline mean here
    is largest at shank1-electrode1 (z = 775) and falls along the labels in both groups (Spearman rho
    -0.59 to -0.84), and the paper's falls from contact 1 to 25 in both panels (rho -0.56 Opsin (+),
    -0.92 Opsin (-)). The paper's contact 1 is therefore most likely the files' electrode1 end, but
    neither source says whether that end is superficial; the published figure's depth axis would be
    needed.
