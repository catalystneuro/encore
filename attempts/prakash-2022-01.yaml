findings:
- kind: data_missing
  about: data
  statement: The dandiset holds only the in vivo experiment of Fig. 7. The culture MEA recordings
    behind Figs. 2 to 6 and Supplementary Figs. 2 to 4, and the IVIS and confocal images of
    Supplementary Figs. 5 and 6, are not in it; the article publishes only the per-electrode counts of
    the ladder plots, and the paper offers raw data on request.
- kind: metadata_insufficient
  statement: The electrode table's Position column (x 0 or 50, z 0 to 775 um) has an autogenerated
    description and does not say whether z is depth below the surface or height above the deepest
    contact, so the laminar depth of each channel cannot be established.
- kind: metadata_insufficient
  statement: The position of the 50-pixel ROI the paper averages next to the electrode shank is not
    recorded, so the paper's bioluminescence series and onsets cannot be recomputed; the whole-frame
    mean was used.
- kind: other
  about: data
  statement: The ElectricalSeries description says the data were acquired at 20 kHz and downsampled
    to 10 kHz; the Methods say the data were acquired at 30 kHz. The images of interlum_4 are 1024 x
    1024 pixels and those of interlum_ctrl_2 684 x 697, where the Methods give 512 x 512.
- kind: other
  about: data
  statement: The image series of interlum_4 has 1111 frames, 58 of them entirely zero (between 810 and
    891 s), and ends 866 s after the bioluminescence onset, where the paper's Fig. 7b series cover
    1200 s after onset for all five imaged mice.
- kind: other
  about: data
  statement: In interlum_ctrl_4 the bioluminescence onset (206 s) comes 8 s before the recorded start
    of CTZ infusion (214 s); in the other four imaged mice
    the onset follows the infusion start by 16 to 103 s. The infusion interval or the image timing of
    this file may be offset.
- kind: other
  about: data
  statement: The whole-frame bioluminescence series of the three Opsin (-) mice match the paper's
    Supplementary Data 7 series cntrl 1 to 3 (r = 0.975 to 0.990, as interlum_ctrl_2, ctrl_4 and
    ctrl_5). Those of the two imaged Opsin (+) mice match exp 3 at most at r = 0.906, and no file
    matches exp 1 (r at most 0.68), so the dandiset's imaged Opsin (+) recordings may not be the
    ones shown in Fig. 7b. Which dandiset mouse is which animal of the paper is not documented.
- kind: other
  about: data
  statement: The recordings are small for unfiltered cortical signals stored in volts, a median contact
    RMS of 1.9 to 6.7 uV per file, and the MUA band crosses -3 SD at baseline at 11 to 14 per s on
    every contact, no more than band-limited Gaussian noise. This is consistent with a missing scale
    factor or with recordings dominated by noise in the spike band; relative measures are unaffected
    by scale.
- kind: methods_unavailable
  statement: The Methods' rule for errant contacts (RMS beyond 3 IQR of the quartiles) flags 1 to 3
    contacts per mouse and 4 over all mice in these files, where the paper excludes 7 and keeps 25 in
    every animal. Which 7 contacts were excluded, and over which span the RMS was taken? The number
    kept changes the mouse-level U of the gamma-event and MUA claims (8 or 9, and 6 to 8).
- kind: methods_unavailable
  statement: How were the 85th percentiles of each mouse computed (MATLAB prctile or another rule)?
    With 3 against 3 mice the rule decides whether U is 8 or 9 for the gamma events and 6 to 8 for MUA,
    so fig7e-gamma-events-mice and fig7f-mua-mice-not-significant are blocked until it is known.
- kind: methods_unavailable
  statement: How were gamma events detected in detail (the sampling rate, the jackknife of the 99%
    confidence interval of the baseline mean amplitude, and whether the 1200 s window starts at the
    bioluminescence onset or the infusion)? Every reading tried gives about 29 to 34 events per contact
    in Opsin (+) mice, against the paper's 213.6, and 10 to 13 in Opsin (-) against 139.3.
- kind: methods_unavailable
  statement: Which baseline values does the test for a contact exceeding baseline bootstrap? With the
    180 one-second spectrogram steps before onset, nearly every contact in both groups exceeds
    baseline (25 to 29 per mouse), against the paper's 15.7 and 2.7.
- kind: paper_inconsistency
  statement: In Supplementary Data 6, the Fig. 6f column "Synaptic blockers (After)" has 18 values,
    identical to the first "Synaptic blockers (After)" column of Fig. 4e in Supplementary Data 4,
    where the Fig. 6f legend gives n = 21. On these columns the Mann-Whitney test gives p = 3.6e-10,
    against the legend's p = 0.7870.
