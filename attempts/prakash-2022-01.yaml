- claim: fig2d-chr2-ctz-excites
  outcome: reproduced
  notebook: reproduce_prakash_2022.ipynb
  output: claim:fig2d-chr2-ctz-excites
  notes: On Supplementary Data 1, blue light and CTZ raise the 5 s counts on all 62 electrodes
    (medians 1.5 to 114.5 and 0 to 82.5, Wilcoxon p = 7.6e-12 each); vehicle gives p = 0.637 on 24
    electrodes (the paper 0.6498).
  deviations:
  - Tested on the article's per-electrode source data, as the dandiset holds no culture
    recordings. The test is scipy's Wilcoxon signed-rank test (normal approximation with ties),
    which gives p within 0.02 of the paper's Prism values.
