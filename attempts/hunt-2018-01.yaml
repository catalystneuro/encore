- claim: fig5gj-cross-correlation-dynamics
  outcome: reproduced
  notebook: reproduce_hunt_2018.ipynb
  output: claim:fig5gj-cross-correlation-dynamics
  notes: With each pair of cue epochs as its own 61 x 61 map and null, as the script computes them,
    the clusters through the 250 ms point have 884, 1839, 1105 and 817 bins against
    99.9th-percentile thresholds of 442, 444, 453 and 487, with the signs of Figure 5c-f; EV 6 at
    cue 2 against EV 5 at cue 1 forms a positive cluster of 1622 bins (threshold 640, r = 0.755).
    With one 183 x 183 map over the cue 1, 2 and 3 epochs and a single null, the criterion also
    holds (1943, 6827, 1105 and 817 bins against 1414, 1056, 1083 and 810; EV 6 at cue 2 with EV 5
    at cue 1, 5741 bins), with narrow margins for the two cue 3 option maps. That pass depends on
    the seed. With 10 other seeds the EV 3 with EV 2 cluster passes in 0 of 10 (thresholds 853 to
    1262) and with 10000 permutations it fails (threshold 990); EV 3 with EV 1 passes in 7 of 10 and
    with 10000 permutations (984). So the single-map reading does not hold, and the outcome rests on
    the script's separate maps, which pass by wide margins.
  deviations:
  - The map pairs are those of Fig5_OFCcrosscorrelation.m (EV 6/5, 2/1, 3/1, 3/2); its correlation
    divides a population covariance by sample standard deviations, a factor of 181/182 on r, which
    is not reproduced here.
  - Each pair of epochs is its own map with its own null, as Fig5_OFCcrosscorrelation.m (lines
    145-153 and 167) computes them; clusters are 8-connected, as bwconncomp in cross_corr_tstats.m.
    The single 183 x 183 map is shown as a variant.
