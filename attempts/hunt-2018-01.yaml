- claim: figs5c-latency-order
  outcome: not_reproduced
  notebook: reproduce_hunt_2018.ipynb
  output: claim:figs5c-latency-order
  notes: The criterion's test fails under every reading. The t75 point estimates of the nine claimed
    curves follow the paper's order; with all the significant templates, in DLPFC accept/reject (491
    ms) comes after left/right value (369 ms), while ACC (spatial attention 24, accept/reject 238,
    stimulus identity 262, left/right value 457 ms) and OFC (spatial attention 67, accept/reject 224,
    attended value 241, stimulus identity 269 ms) keep it. The 100 simulated t75 values overlap under both readings and with
    either set of variables (the criterion's significant templates, or the set Fig4_RSA.m stacks for
    the panel, peak CPD above 10%). In OFC the attended value range reaches -10 ms (reading a) and
    -13 ms (reading b), below the top of the spatial attention range (93 and 99 ms). In ACC
    left/right value (252 to 492 ms, reading a; 246 to 528 ms, reading b) overlaps accept/reject (229
    to 272 ms; 227 to 291 ms). With the script's set, spatial attention lies below the other
    variables in ACC and DLPFC and left/right value above them in DLPFC, under both readings. The
    first run recorded partially_reproduced; it was changed after the first verification round, as
    its one test fails in at least two of the three regions under every reading. In
    figs1ab-cue-weights, which stays partially_reproduced, one component fails in one monkey and the
    rest holds.
  deviations:
  - Fig4_RSA.m draws one permutation of the residuals shared over time points (reading b) and
    computes t75 over -199 to 600 ms at 1 ms, as done here; it keeps the variables with peak CPD
    above 10% (Supplementary Figure 5B legend, "Regressors explaining little variance have been
    removed"), shown beside the criterion's significance rule.
