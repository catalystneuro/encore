- claim: sessions-and-trials
  outcome: reproduced
  notebook: reproduce_hunt_2018.ipynb
  output: claim:sessions-and-trials
  measured: [25, 32, 14251, 9863]
  notes: The behavioural files hold 25 sessions of Frank (F) and 32 of Miles (M), with 9863 and
    14251 completed option and attribute trials (trial errors 0 and 6 only), the paper's counts
    under reading (a). Without trials of equal expected value (reading c) there are 9479 and 13691.
    Aborted trials (reading b) can be counted only from the unit files, for the 24 and 29 sessions
    with units (10688 and 14391 trials there).
  deviations:
  - Reading (b) could be counted only for sessions with units, as the behavioural files hold
    completed trials only.
- claim: neuron-counts
  outcome: reproduced
  notebook: reproduce_hunt_2018.ipynb
  output: claim:neuron-counts
  measured: [189, 135, 183, 9, 21, 12]
  notes: With the average_firing_rate of other_data/all_units_info.mat, the rate every figure script
    of the paper uses to select units (Fig4_RSA.m and others), 189 ACC, 135 DLPFC and 183 OFC units
    are at or above 1 Hz, with 9, 21 and 12 excluded, the paper's numbers. The claims file's readings
    do not give them; the whole-session rate (from OverallSpikeCodes, equal to the stored session
    mean within 0.004 Hz) gives 190, 136 and 182, the rate from trial start to response 186, 137 and
    179. The data set holds 198 ACC, 156 DLPFC and 195 OFC units over 24 F and 29 M sessions, the
    totals and session counts of Supplementary Table 1 as the claims file gives them. Session by
    session the table agrees with the data in all 53 sessions and three areas when every unit is
    counted, and in 26 of 53 when units below 1 Hz are left out, so it counts all units although
    its caption says units above 1 Hz. The scripts also drop unit 87 (DLPFC, 4.8 Hz) as a bad
    cell, so the paper's DLPFC analyses, and these, use 134 units.
  deviations:
  - The rate is the stored average_firing_rate that the paper's scripts use, a third reading
    besides the claims file's two; how it was computed is not documented in the data set.
- claim: choice-accuracy-ev
  outcome: reproduced
  notebook: reproduce_hunt_2018.ipynb
  output: claim:choice-accuracy-ev
  measured: [75.71, 79.01]
  notes: Reading (a), ties left out, gives 75.71% (F) and 79.01% (M); reading (b) 72.77% and 75.90%.
    InfoGathering_Behaviour.m counts the 384 and 560 tied trials as correct, which gives 76.66% and
    79.83%, the paper's numbers.
- claim: chose-on-partial-information
  outcome: reproduced
  notebook: reproduce_hunt_2018.ipynb
  output: claim:chose-on-partial-information
  measured: [85.52, 71.43]
  assumed: true
  notes: With the count of pictures corrected for a joystick movement made before the last picture
    was fixated (num_pics_viewedprezero of InfoGathering_Behaviour.m), F chose before all four cues on
    85.52% and M on 71.43% of trials. The raw count of fixated pictures gives 54.23% and 42.56%, and
    pictures fixated for more than 250 ms 95.59% and 92.25%, both outside the tolerance, so the
    outcome rests on the definition of a cue "evaluated", which the paper does not give. The claim
    has no criterion; a question asks a reader whether the claims file should name the readings
    (questions/hunt-2018.yaml).
  deviations:
  - Assumed, as the claims file gives no method and the paper does not define "evaluated" (Results,
    paragraph 2, "subjects chose before all four cues had been evaluated"). The count is the
    script's (InfoGathering_Behaviour.m, out.earlychoices), with its joystick threshold and
    smoothing, the only one of the three counts that the paper's own code computes for this number.
