  outcome: reproduced
  notebook: reproduce_hunt_2018.ipynb
  output: claim:choice-accuracy-observed
  measured: [86.0, 87.75]
  notes: Reading (a) gives 86.00% (F) and 87.75% (M), reading (b) 79.88% and 82.26%, reading (c)
    89.17% and 89.20%, the script's own measure (unseen at 0.5, ties counted correct) 87.80% and
