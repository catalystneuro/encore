findings:
- kind: selection_undocumented
  about: data
  statement: Units are selected by the average_firing_rate field of other_data/all_units_info.mat,
    which the paper's scripts use for the 1 Hz exclusion. How it was computed is not documented, and
    it is neither the whole-session rate (the stored men) nor the rate over the analysed trials;
    those select 190, 136 and 182 or 186, 137 and 179 units in ACC, DLPFC and OFC, where the field
    gives the paper's 189, 135 and 183.
- kind: metadata_error
  statement: The unit files 681 to 724 (sessions 5, 11, 23 and 27 of Miles) store the subject letter
    sb as lower case "m", while all other units of Miles store "M".
- kind: metadata_error
  statement: The data descriptor, the README and the scripts' flowchart name the preprocessed units
    neuronal_data/LTH_preprocessed_data, but the archive holds them as
    neuronal_data/LTH_processed_data.zip, the folder name the scripts read.
- kind: code_mismatch
  statement: Every figure script drops unit 87 (DLPFC, 4.8 Hz) as a bad cell, and the Figure 5 and 7
    scripts also drop unit 653 (OFC, whose cue 2 T-statistics are not finite), so the DLPFC analyses
    use 134 units and the OFC analyses of Figures 5 and 7 use 182, where the paper reports 135 and 183
    (for example n = 135 DLPFC units in the Supplementary Figure 5 legend). The paper does not
    mention these exclusions.
- kind: paper_inconsistency
  statement: For Figure 7a the Results say the cue 3 tests were made "at cue 3 of attribute trials"
    while citing Figure 5d/e, which are option trials; the script (Fig7_single_neurons_cue2and3.m)
    tests EV 3 against EVs 1 and 2, the option-trial regressors.
- kind: code_mismatch
  statement: The Methods for Figure 6 describe a neurons x 2 projection matrix from odd and even
    trials, with weights for action 200 ms before the response. The published script
    (Fig6_ACCmultiplesignals_R3_version.m) averages 100 random half splits, adds a constant and the
    mean option/attribute response to the projection design, takes the action weights at the bin
    centred 210 ms before the response, and uses fixed reaction-time bins (below 1.2 s, 1.2-1.4,
    1.4-1.6, 1.6-1.8, from 1.8 s) that the Methods do not give.
- kind: methods_unavailable
  statement: Two thresholds of the single-neuron analyses are not in the text. Figure 7 counts a
    neuron as encoding value difference when each of three T-statistics exceeds 1.64 in absolute
    value (Fig7_single_neurons_cue2and3.m), and belief confirmation at 1.96, and Supplementary Figure
    1c judges accuracy on the pictures seen, averaged over sessions (InfoGathering_Behaviour.m); the
    results here depend on both choices (fig7a, figs1cd). The authors could confirm that these are
    the choices behind the figures.
