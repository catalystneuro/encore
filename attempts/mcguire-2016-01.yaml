- claim: fig2d-fixed-panel-impairs
  outcome: reproduced
  notebook: reproduce_mcguire_2016.ipynb
  output: claim:fig2d-fixed-panel-impairs
  notes: Tested on S2 Data after a reader's answer to this attempt's question. The first run had the claim
    as data from the data set and recorded it as blocked (data_missing), since the data set holds only
    the four normal sequences and no fixed-panel session; the reader changed the claim to data elsewhere,
    on the per-rat S2B Fig values in S2 Data, and to a lower fixed-panel value in at least five of six
    rats. On those values fixed-panel discrimination (FFF minus SSS right-choice fraction) is lower than
    moving-panel discrimination in all six rats, by 0.067 (18Ri) to 0.374 (107SI). The paired t test gives
    p = 0.0120 with the rat at 0 kept (reading ii, the paper's 0.012), mean change -0.169 (95% CI -0.282
    to -0.056), and p = 0.0308 without it (reading i), mean change -0.174 (-0.322 to -0.026), so the criterion
    holds under both readings. The Figure 2D d-prime from S1 Data is lower in all six rats too (p = 0.0051
    and 0.0176). The moving-panel values of S2B differ from the Figure 2B means and from the data set's
    mean and last session for the six rats with the control, so they summarise sessions the data set does
    not hold. The statement's "all but one" (one rat not significantly impaired) cannot be tested from
    per-rat summaries; the lowest change is 18Ri's (0.067, d-prime 1.02 to 0.78).
  deviations:
  - The per-rat values of S2B Fig are taken from S2 Data as deposited; the single trials are not public,
    so the paper's computation of each value is not repeated.
