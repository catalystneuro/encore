findings:
- kind: metadata_error
  statement: The data descriptor gives the column of each electrode as AllRats(expt).MapPosition and says
    units in columns A1 and B2 must not be used in stimulus analyses, but AllRats.mat has no MapPosition
    field. No field gives the recorded column.
- kind: selection_undocumented
  statement: AllRats.mat holds 506 units (330 single, 176 multi-unit) where the paper reports 473 (306
    single, 167 multi-unit). The extra units are probably those in columns A1 and B2, but without the
    column map they cannot be identified, so every unit analysis here uses all 506. Against the unit counts
    per layer and type of the paper's S1 Table, the extra units are in L2/3 (4), L4 (8), L5a (15) and
    L5b (6), none in L6.
- kind: data_missing
  statement: The data set holds only the five recorded rats. The fixed-panel control sessions and the
    behaviour of rats 62SC, 107Si and 62SS (Figure 2) are not deposited; the paper's S1 and S2 Data give
    only per-rat and per-session summaries.
- kind: methods_unavailable
  statement: Question for the authors. The stored temporal-modulation p-values (TempSig) were computed
    over -50 to 300 ms in 10-ms bins (TempSig.Params), while the Methods give 0 to 180 ms after nose poke
    entry, and the Methods do not name the statistic compared with permuted spikes. Permuting spikes uniformly
    and comparing the PSTH variance gives 310 modulated units over the Methods' window, the same count
    as the stored values, but the two agree for only 73% of units (82% with the stored window, and 82%
    with the stored window and a null that shuffles each trial's 10-ms bins). Which window and statistic
    were used for the paper's 305?
- kind: methods_unavailable
  statement: Question for the authors. Which test selected the 61 Fast RS single units with significant
    response to F impulses? A paired t test across trials of the 5 to 35 ms rate against the 0 to 10 ms
    rate selects 29 to 37 of the 62 Fast RS single units of the data set's classes (one-sided, two-sided,
    or first impulses only); the paper's 61 is close to all of them.
- kind: methods_unavailable
  statement: Question for the authors. How was the choice decoder's 65% obtained? With per-unit logistic
    functions summed over a pseudo-population, as the Methods describe, Slow units give 81 to 93% when
    the two choices are weighted equally in training and about 54% when they are not, and Fast/Medium
    units 71 to 82%. Accuracy grows with the number of units (about 66 to 74% with 20 Slow units). Were
    the choices balanced, how many units entered each prediction, and were test trials drawn within each
    rat?
- kind: methods_unavailable
  statement: Question for the authors. How were the peak latency and the evoked modulation of Figure 4D
    computed (placement of the 10-ms smoothing window, pooling of impulses and sequences)? From the centred
    10-ms smoothed 1-ms PSTH the latencies are 15 to 22 ms in every layer, against 9.8 to 16.1 ms in the
    paper; a forward window shortens them by about 5 ms but still puts at most 2 or 3 of 5 layers within
    10%.
- kind: other
  statement: The stored regression inputs (StimReg Yval) equal the spike counts summed over completed
    trials (Complete equal to 1) for all 506 units, while the descriptor says the paper used trials with
    nose poke duration over 250 ms, a set that also holds 129 trials without a choice. The stored regression
    results are reproduced exactly from the spikes and the stored regressor.
- kind: paper_inconsistency
  statement: In S1 Data the Figure 2A sheet is labelled "Rat 107ST", but its values are those of 107Si
    in the same file and in S2 Data. Its mean FFF fraction over 13 days is 0.7485, the Figure 2B mean
    of 107Si (0.7485, 107ST 0.5856), and its fixed-panel FFF minus SSS (0.0991, d-prime 0.277) equals
    107SI in S2B Fig and 107Si in Figure 2D. The example rat of Figure 2A appears to be 107Si.
- kind: other
  statement: For rat 18FB the per-rat right-choice fractions computed from the data set's sessions differ
    by up to 0.026 from the S1 Data values of Figure 2B, while for the other four rats they are equal,
    so S1 Data and the data set hold different sessions for 18FB.
