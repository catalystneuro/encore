- claim: fig2c-choice-follows-mean-speed
  outcome: reproduced
  notebook: reproduce_mcguire_2016.ipynb
  output: claim:fig2c-choice-follows-mean-speed
  notes: For each of the five rats relative right choice orders FFF above FMS and SMF above SSS (reading
    a), and the Pearson correlation with Table 1 mean speed is 0.967 to 0.998 (reading b), under both
    trial readings. The S1 Data means of all eight rats give the same (r 0.967 to 0.995).
