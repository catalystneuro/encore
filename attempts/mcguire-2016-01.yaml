- claim: temporal-modulation-count
  outcome: reproduced
  notebook: reproduce_mcguire_2016.ipynb
  output: claim:temporal-modulation-count
  measured:
  - 310
  - 61.3
  notes: With 0 to 180 ms after nose poke entry (reading a) 310 of 506 units (61.3%) are modulated; with
    0 to 180 ms after onset (reading b) 261 (51.6%). The two statistics the criterion names give the same
    p-value under uniform permutation, so they are one reading. The data set's stored p-values also mark
    310 units, but they agree with reading a unit by unit for 73.1% (Spearman r of the p-values 0.60).
    They were computed over -50 to 300 ms (TempSig.Params); that window gives 363 units here (81.6% agreement),
    and a null that shuffles each trial's 10-ms bins gives 365 on that window (82.0%) and 321 on the Methods'
    window (73.7%), so the authors' test is not repeated exactly. The claims that depend on this one use
    the stored set, which the descriptor names as the paper's units, with reading a as a variant.
  deviations:
  - 506 units in the denominator, not 473.
  - Spikes are permuted uniformly within the window on each trial (the criterion's standard choice), drawn
    as a multinomial over the pooled bins, which is the same null.
  - A second null, shuffling each trial's 10-ms bins (1000 permutations), is shown as a variant at the
    verifier's request.
- claim: modulated-higher-baseline
  outcome: reproduced
  notebook: reproduce_mcguire_2016.ipynb
  output: claim:modulated-higher-baseline
  notes: On the stored modulated set, modulated RS single units have the higher baseline in 5 of 5 layers
    (for example L4 10.14 against 6.55 Hz, L6 10.54 against 2.51 Hz; L5a 11.46 against 11.35 Hz). The
    fraction modulated is 0.49 to 0.73 across layers, chi-square p = 0.002, so on this variant layers
    are not uniform (p = 0.105 on the recomputed set, where the baseline is also higher in 5 of 5 layers).
    Columns cannot be tested, as the column map is missing.
  deviations:
  - Temporally modulated units are the data set's own (TempSig.TemporalPval < 0.05), which the data descriptor
    names as the units of the paper's analyses; the set recomputed with the Methods' test has the same
