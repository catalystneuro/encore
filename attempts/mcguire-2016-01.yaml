    to 30.9% for longer windows; 17 of the 21 top-ranked units have 5 or 10 ms windows.
- claim: fig9b-stimulus-decoder-slow-chance
  outcome: reproduced
  notebook: decoders.ipynb
  output: claim:fig9b-stimulus-decoder-slow-chance
  measured: 30.1
  notes: 102 Slow units decode the sequence at 30.1% (C = 1, 300 repeats), within tolerance of 32%,
    and not above chance by the fraction of repeats (p = 0.213, reading a). The binomial test of
    120,000 pooled pseudo-trials (reading b) is significant, as any excess is with that many draws.
    With C by cross-validation, 28.9%, significant by both tests over 5 repeats. The data set's
    labels give 33.1% (p = 0.020 by reading a).
- claim: fig9d-single-bin-decoder
  outcome: reproduced
  notebook: decoders.ipynb
  output: claim:fig9d-single-bin-decoder
  measured: 39.4
  notes: With one 0 to 150 ms bin the Fast/Medium decoder is 39.4% (within tolerance of 43%) and the
    Slow decoder 26.5%, 3.6 points below its 10-ms accuracy. With C by cross-validation, 28.9% and
    24.9%.
- claim: fig9e-temporal-pattern-decoding
  outcome: reproduced
  notebook: decoders.ipynb
  output: claim:fig9e-temporal-pattern-decoding
  measured: 79.4
  notes: Rate-normalized trains give 79.4%; time-scrambled trains 28.9%, not above chance by the
    fraction of repeats (p = 0.367) and below 32%. With C by cross-validation, 72.1% and 28.3%.
  deviations:
  - Scrambling redistributes each trial's spikes uniformly over 0 to 150 ms, once per run, a
    standard choice.
- claim: fig9f-choice-decoder
  outcome: not_reproduced
  notebook: decoders.ipynb
  output: claim:fig9f-choice-decoder
  measured:
  - 80.1
  - 91.7
  notes: The Slow choice decoder predicts choice at 80.1% from the 150-ms bin and 91.7% from the
    100 ms before withdrawal (equal draws, mean over sequences; 80.1 to 92.0% under the other
    readings), and at 74.6% and 79.2% with C by cross-validation, all above 71.5%. The Fast/Medium
    decoder predicts choice at 67.1% and 79.0% (63.8% and 66.9% with cross-validation), not within
    45 to 55%. Trained without balancing the two choices, both decoders fall to 50 to 54%, Slow
    included. No reading gives Slow at 65% with Fast/Medium near chance. The pseudo-population sums
    about 100 independent units, which can raise accuracy well above that of single units
    (L5b Slow Positive units average 59.8% alone).
  deviations:
  - Training weights the two choices equally (an assumption, as the Methods give chance as 50%
    and an unweighted fit predicts one side for every trial); the unweighted fit is shown and does
    not give the claim either.
  - Cross-validated C (reading b) run with 10 repeats.
- claim: fig9g-l5b-slow-positive-best-choice
  outcome: reproduced
  notebook: decoders.ipynb
  output: claim:fig9g-l5b-slow-positive-best-choice
  notes: L5b Slow Positive units have the highest mean single-unit choice accuracy, 59.8% balanced
    accuracy over 15 units (next L5a Slow Positive 56.4%, L5b Slow Negative 55.4%), and 5 of the 11
    top-ranked Slow units are L5b Slow Positive, the largest group but not more than half.
  deviations:
  - Single-unit accuracy is balanced accuracy on the unit's own test trials, a standard choice so
    that chance is 50%.
findings:
- kind: metadata_error
  statement: The data descriptor gives the column of each electrode as AllRats(expt).MapPosition
    and says units in columns A1 and B2 must not be used in stimulus analyses, but AllRats.mat has
    no MapPosition field. No field gives the recorded column.
- kind: selection_undocumented
  statement: AllRats.mat holds 506 units (330 single, 176 multi-unit) where the paper reports 473
    (306 single, 167 multi-unit). The extra units are probably those in columns A1 and B2, but
    without the column map they cannot be identified, so every unit analysis here uses all 506.
- kind: data_missing
  statement: The data set holds only the five recorded rats. The fixed-panel control sessions and
    the behaviour of rats 62SC, 107Si and 62SS (Figure 2) are not deposited; the paper's S1 and S2
    Data give only per-rat and per-session summaries.
- kind: methods_unavailable
  statement: Question for the authors. The stored temporal-modulation p-values (TempSig) were
    computed over -50 to 300 ms in 10-ms bins (TempSig.Params), while the Methods give 0 to 180 ms
    after nose poke entry, and the Methods do not name the statistic compared with permuted
    spikes. Permuting spikes uniformly and comparing the PSTH variance gives 310 modulated units
    over the Methods' window, the same count as the stored values, but the two agree for only 73%
    of units (82% with the stored window). Which window and statistic were used for the paper's 305?
- kind: methods_unavailable
  statement: Question for the authors. Which test selected the 61 Fast RS single units "with
    significant response to F impulses"? A paired t test across trials of the 5 to 35 ms rate
    against the 0 to 10 ms rate selects 34 of 63 Fast RS units; the paper's 61 is close to all of
    them.
- kind: methods_unavailable
  statement: Question for the authors. How was the choice decoder's 65% obtained? With per-unit
    logistic functions summed over a pseudo-population, as the Methods describe, Slow units give 80
    to 92% when the two choices are weighted equally in training and about 51% when they are not,
    and Fast/Medium units 67 to 79%. Were the choices balanced, how many units entered each
    prediction, and were test trials drawn within each rat?
- kind: methods_unavailable
  statement: Question for the authors. How were the peak latency and the evoked modulation of
    Figure 4D computed (smoothing window placement, pooling of impulses and sequences)? From the
    10-ms smoothed 1-ms PSTH the latencies are 14 to 20 ms in every layer, against 9.8 to 16.1 ms
    in the paper.
- kind: other
  statement: The stored regression inputs (StimReg Yval) equal the spike counts summed over
    completed trials (Complete equal to 1) for all 506 units, while the descriptor says the paper
    used trials with nose poke duration over 250 ms, a set that also holds 129 trials without a
    choice. The stored regression results are reproduced exactly from the spikes and the stored
    regressor.
- kind: paper_inconsistency
  statement: In S1 Data the Figure 2A sheet is labelled "Rat 107ST", but its values are those of 107Si
    in the same file and in S2 Data. Its mean FFF fraction over 13 days is 0.7485, the Figure 2B mean
    of 107Si (0.7485, 107ST 0.5856), and its fixed-panel FFF minus SSS (0.0991, d-prime 0.277) equals
    107SI in S2B Fig and 107Si in Figure 2D. The example rat of Figure 2A appears to be 107Si.
- kind: other
  statement: For rat 18FB the per-rat right-choice fractions computed from the data set's sessions
    differ by up to 0.026 from the S1 Data values of Figure 2B, while for the other four rats they
    are equal, so S1 Data and the data set hold different sessions for 18FB.
