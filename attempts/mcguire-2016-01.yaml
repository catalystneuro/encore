- claim: latency-by-layer
  outcome: partially_reproduced
  notebook: reproduce_mcguire_2016.ipynb
  output: claim:latency-by-layer
  measured:
  - 15.0
  - 19.0
  - 15.0
  - 17.0
  - 21.0
  notes: With the centred 10-ms boxcar, latencies of impulse-responsive units on the stored modulated
    set are 15 to 22 ms in every layer, longer than the paper's 9.8 to 16.1 ms, and no layer is within
    tolerance. The ordering (L4, L5a and L5b below L2/3 and L6) holds for the mean and the median with
    the two-sided test and not with the one-sided test, where L5a is among the latest. Measured gives
    the one-sided medians in the claim's order (L4, L5a, L5b, L2/3, L6). 21 to 48 impulse-responsive units
    per layer. Placing the boxcar forward (t to t+9 ms) shortens latencies by about 5 ms and puts at most
    2 of 5 layers within tolerance (3 on the recomputed set); the trailing boxcar puts none and the unsmoothed
    PSTH at most 2 (3 on the recomputed set). No reading puts all five within tolerance. Latency is now
    the mean of the times sharing the maximum, so that a plateau is not read at its first sample.
  deviations:
  - Temporally modulated units are the data set's own (TempSig.TemporalPval < 0.05), which the data descriptor
    names as the units of the paper's analyses; the set recomputed with the Methods' test has the same
    count but agrees for 73% of units and is shown as a variant. Classes are recomputed from the regression
    (reading a, 55 ms Medium) and equal the data set's labels. Changed from the recomputed set after the
    verifier's first report.
  - The impulse t test compares, per trial, the 5 to 35 ms rate with the 0 to 10 ms rate, averaged over
    the trial's three impulses, across trials (Methods, Stimulus-evoked responses, by t test).
  - The Methods say only 10 ms smoothing; the boxcar is centred (Matlab's smooth), a standard choice,
    with trailing, forward and no smoothing shown. The outcome is the same under all four.
