- claim: fig2ab-fms-smf-not-discriminated
  outcome: partially_reproduced
  notebook: reproduce_mcguire_2016.ipynb
  output: claim:fig2ab-fms-smf-not-discriminated
  notes: The data set holds five of the eight rats (18FB, 18Ri, 18Ro, 62BS, 107St). In all five, FFF draws
    more right choices than SSS (0.537 to 0.698 against 0.234 to 0.390) and FMS and SMF lie between, and
    FMS against SMF is not significant at 0.00625 (smallest p 0.10 by the z test and 0.11 by the continuity-corrected
    chi-square, 62BS). Both trial readings select the same 14186 trials. Rat 62SC, the one the paper finds
    discriminating, is not in the data set, so that part cannot be tested; the criterion caps the outcome
    at partial for fewer than eight rats. The data set's per-rat means over sessions equal the S1 Data
    values for four rats and differ by up to 0.026 for 18FB.
  deviations:
  - Five of eight rats; the three behaviour-only rats are not deposited.
