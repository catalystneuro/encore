- claim: temporal-modulation-count
  outcome: reproduced
  notebook: reproduce_mcguire_2016.ipynb
  output: claim:temporal-modulation-count
  measured:
  - 310
  - 61.3
  notes: With 0 to 180 ms after nose poke entry (reading a) 310 of 506 units (61.3%) are modulated;
    with 0 to 180 ms after onset (reading b) 261 (51.6%). The two statistics the criterion names
    give the same p-value under uniform permutation, so they are one reading. The data set's
    stored p-values also mark 310 units, but they agree with reading a unit by unit for 73.1%,
    and they were computed over -50 to 300 ms (TempSig.Params); that window gives 363 units here,
