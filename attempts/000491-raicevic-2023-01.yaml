findings:
- kind: data_missing
  statement: The single-plane time-averaged 2D images and their segmentations, which the Methods use to
    validate the 3D segmentation (at least 70% overlap for PVS and vessel), are not in the dandiset, so
    the validation cannot be checked.
- kind: other
  statement: The deposited vessel and PVS masks overlap in 11 of the 14 files (from 24 voxels at C to
    344565 at E and 177417 at J), though the Methods say overlapping pixels were removed from one segmentation.
    The dandiset does not say which mask should take them.
- kind: other
  statement: At E and F the PVS mask fills 98 to 99% of the deepest plane and 50 to 60% of the whole volume,
    so it includes far more than the space beside the vessel; with G, these segments have median PVS-to-vessel
    area ratios of 7.8 to 9.6, against 0.7 to 2.2 elsewhere. The dandiset does not describe this, and
    it bears on every pooled distribution.
- kind: metadata_error
  statement: For L, M and N the reference_frame gives a depth step of 0.648 um, while the session descriptions
    say the planes are 1 micron apart. Vessel cross sections at the stated step are close to round (median
    height over width 0.93 to 1.12), which is consistent with the reference_frame; the session descriptions
    appear to be wrong for these files.
- kind: metadata_error
  statement: The vessel channel (ChanA, described as FITC-dextran) has an emission wavelength of 698 nm
    and the PVS channel (ChanC) 525 nm, while the Methods say the green 525 nm channel holds the FITC-dextran.
    Every imaging plane names GFP as its indicator.
- kind: metadata_insufficient
  statement: ChanB is described as injected fluorescent microspheres and its mask only as 'Segmentation
    masks for ChanB'; the paper mentions no microspheres, and L, M and N have no ChanB.
- kind: metadata_error
  statement: The subjects of locations A to D (BPN-OLD-M2 and BPN-OLD-M3) are 573 to 603 days old in the
    files, and most other subjects 76 to 113 days, while the Methods say all mice were 8 to 12 weeks old.
- kind: other
  statement: The first published version, 0.230427.1809, holds no PVS mask for L, M and N; version 0.230602.1307
    adds them. The dandiset's description does not record the change.
- kind: methods_unavailable
  statement: Question for the authors (left-right-no-difference), which test found no difference between
    the left and right PVS widths? Paired tests over all cross sections find one here (Wilcoxon p below
    1e-15, KS below 1e-31), a test on the 14 per-segment medians does not (p 0.67 to 0.72).
- kind: methods_unavailable
  statement: Question for the authors (cross-section-counts and every pooled claim), how is the median
    PVS width of the edge exclusion measured? Taken as the horizontal extent of the PVS, it excludes every
    cross section in 5 of the 14 segments; taken as the polynomial-fit width, the segments keep 390 to
    669 cross sections at 0.648 um, more than the paper's 54 to 451. This attempt adopts the polynomial
    width.
- kind: methods_unavailable
  statement: The paper's MATLAB code (segmentation, normal slices, fits, resistance) is not public, and
    the Methods leave open which centerline points were removed by hand, how the polynomial region is
    closed across the vessel and how each fit's edge points are chosen; the readings run here do not recover
    the paper's counts or most of its peaks.
