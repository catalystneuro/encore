- claim: cross-section-counts
  outcome: not_reproduced
  notebook: reproduce_raicevic_2023.ipynb
  output: claim:cross-section-counts
  measured:
  - 390
  - 669
  - 0.875
  notes: No combination of P1, P2 and P4 holds. With P2 a and P4 b the segments give 390 to 669 cross
    sections at 0.648 um (mean spacing 0.875 um, within tolerance) and 248 to 415 at 1 um (within the
    widened range, but spacing 1.347 um). With P4 a, 5 segments keep none. P2 b gives up to 76393 points
    per segment. Reference combination for measured values, P1 a (0.648 um), P2 a (longest path), P4 b
    (polynomial width), P5 a, P6 erosion 3, P7 b (outliers left out), unless stated.
  deviations:
  - Starts from the deposited final segmentations, as the claims file says; the vessel centerline is skimage's
    3D thinning in place of MATLAB bwskel, and the longest path through the skeleton (P2 a) stands in
    for the manual removal of erroneous points.
  - Cross sections are sampled by linear interpolation of the masks, thresholded at 0.5, on planes normal
    to the fitted centerline, one per path point, with pixels of the P1 voxel size, in place of MATLAB
    obliqueslice (a standard choice).
  - Pixels in both the vessel and the PVS mask are counted as vessel. The Methods say overlaps were resolved
    by hand, case by case, but the deposited masks still overlap; the overlap exceeds 5% of the PVS in
    258 of 7568 cross sections (P1 a, P4 b), 239 of them at J, so the choice is unlikely to change an
    outcome. The other assignment was not run.
  - All PVS pixels in a cross section are used, and the vessel is the connected region at or nearest the
    slice center; the paper describes no selection within a slice (its selection of regions is in 3D and
    already in the deposited masks). Cross sections with fewer than 20 vessel or PVS pixels have no fits
    (shown per location in the data check).
  - P4 reading (a), the horizontal extent of the PVS, keeps no cross section in 5 of the 14 segments (A,
    B, E, F, G), while the paper analysed all 14; its results are shown but it is the less supported reading.
  - For P2 b the median widths of P4 are taken from 150 evenly spaced points per segment (a standard choice),
    and the spacing is between consecutive points sorted along the main axis.
