findings:
- kind: data_missing
  statement: The single-plane time-averaged 2D images and their segmentations, which the Methods use to validate
    the 3D segmentation (at least 70% overlap for PVS and vessel), are not in the dandiset, so the validation cannot
    be checked.
- kind: other
  statement: The deposited vessel and PVS masks overlap in 11 of the 14 files (from 24 voxels at C to 344565 at
    E and 177417 at J), though the Methods say overlapping pixels were removed from one segmentation. The dandiset
    does not say which mask should take them.
- kind: other
  statement: At E and F the PVS mask fills every plane below a depth (87 and 58 planes, 98 to 99% of the field)
    and 50 to 60% of the whole volume, so it holds far more than the space beside the vessel. The dandiset does
    not describe this; this attempt clears those planes.
- kind: other
  statement: The vessel mask of E holds a network of branching vessels in one connected region, though the Methods
    say the vessels branching off the main vessel were removed by hand. The longest path through its skeleton runs
    through branches; after the cleaning of this attempt 361 of its 939 points (0.648 um) are kept, along a side
    branch, while the points removed run along the vessel with PVS beside it.
- kind: metadata_error
  statement: For L, M and N the reference_frame gives a depth step of 0.648 um, while the session descriptions say
    the planes are 1 micron apart. Vessel cross sections at the stated step are close to round (median height over
    width 0.91, 1.08 and 1.13), which is consistent with the reference_frame; the session descriptions appear to be wrong
    for these files.
- kind: metadata_error
  statement: The vessel channel (ChanA, described as FITC-dextran) has an emission wavelength of 698 nm and the
    PVS channel (ChanC) 525 nm, while the Methods say the green 525 nm channel holds the FITC-dextran. Every imaging
    plane names GFP as its indicator.
- kind: metadata_insufficient
  statement: ChanB is described as injected fluorescent microspheres and its mask only as 'Segmentation masks for
    ChanB'; the paper mentions no microspheres, and L, M and N have no ChanB.
- kind: metadata_error
  statement: The subjects of locations A to D (BPN-OLD-M2 and BPN-OLD-M3) are 573 to 603 days old in the files,
    and most other subjects 76 to 113 days, while the Methods say all mice were 8 to 12 weeks old.
- kind: other
  statement: The first published version, 0.230427.1809, holds no PVS mask for L, M and N; version 0.230602.1307
    adds them. The dandiset's description does not record the change.
- kind: methods_unavailable
  statement: Question for the authors (left-right-no-difference), which test found no difference between the left
    and right PVS widths? Paired tests over all cross sections find one here (Wilcoxon p below 1e-29, KS below 1e-30),
    a test on the 14 per-segment medians does not (p 0.54 to 0.72 with all 14 segments).
- kind: methods_unavailable
  statement: Question for the authors (cross-section-counts and every pooled claim), how is the median PVS width
    of the edge exclusion measured? Taken as the horizontal extent of the PVS, it excludes every cross section in
    4 of the 14 segments; taken as the polynomial-fit width, the segments keep 202 to 604 cross sections at 0.648
    um, more than the paper's 54 to 451.
- kind: methods_unavailable
  statement: The paper's MATLAB code (segmentation, normal slices, fits, resistance) is not public, and the Methods
    leave open which centerline points were removed by hand, which PVS regions of a slice form its PVS, how the
    polynomial region is closed across the vessel and how each fit's edge points are chosen; the readings run here
    do not recover the paper's counts or most of its peaks.
- kind: methods_unavailable
  statement: Question for the authors (fig5bc-area-intersegment-variation), what shows that PVS area varies much
    more between segments than along each? The IQR of the 14 segment medians exceeds the median within-segment IQR
    (3260.3 against 1621.5 um^2), but the range of the medians (8461.9) is below the largest within-segment IQR
    (9476.5, H).
