findings:
- kind: data_missing
  about: data
  statement: Sessions e13_1f1_200305 and e13_1f1_200307 have only wake in their SleepStates table, with no non-REM or REM
    sleep, while the paper says every recording included a homecage period of sleep and wake. A third session has no REM.
    Either the sleep scoring of these sessions is missing from the files or they held no sleep.
- kind: metadata_error
  about: data
  statement: In e16_3m2_211211 the position series named for the linear_manu subsession (LinearizedSpatialSeries3_linear_manu
    and SpatialSeries3_linear_manu) has timestamps from 9,575 to 11,203 s, inside the openField_thomas epoch (9,559 to 12,002
    s), and none inside the linear_manu epoch (15,124 to 16,771 s). The series or its epoch is mislabelled or mistimed; the
    attempt leaves both subsessions out.
- kind: metadata_insufficient
  about: data
  statement: 'Positions outside the familiar figure-eight are in the lab''s units with no spatial scale, as the files'' own
    descriptions say, and the units differ between environments: five novel figure-eight and linear-track series span 0 to
    1, while three others give 0.85 to 0.93 cm per unit when their speeds are set against the simultaneous linearized position
    in cm. Linearized positions of the novel figure-eight and linear tracks are in cm, but the open fields (7 of the 16 novel
    explorations) have only the 2D position, so their 1 cm bins rest on an assumed scale, and one novel ratemap outcome (Fig.
    6c) depends on it.'
- kind: data_missing
  about: data
  statement: The units table has no cluster isolation metric. The paper uses each unit's L-ratio (Extended Data Figs 2h and
    5), so its L-ratio controls cannot be repeated on the dataset.
- kind: other
  about: data
  statement: The paper leaves out two E13.5 mice from the per-animal comparison because only a single light-responsive neuron
    per session was recorded in them (Extended Data Fig. 4 legend). In the files these mice, e13_1f1 and e13_1m1, have sessions
    with two light-responsive cells, giving 1 and 2 same-birthdate pairs.
- kind: other
  about: data
  statement: The Methods say animals ran at least ten trials along each arm in every session. In the trials table, 27 of the
    57 familiar figure-eight sessions hold fewer than ten trials of one visited arm, and 6 hold fewer than 20 trials in all
    (fewest 7 left and 5 right, e16_2m1_201116). Trials may be missing from the table, or the paper's rule may describe training.
- kind: paper_inconsistency
  about: paper
  statement: The Methods give 92 sessions lasting 113.7 to 475.6 min (median 309.1), while Supplementary Table 1, Figure 1e
    and Figure 7f give 96 sessions for the 15 homecage mice. The files hold 96 sessions for those mice, and their durations
    run from exactly 113.7 to 475.6 min (median 309.9), so the 92 appears to be a miscount of the same 96 sessions.
- kind: methods_unavailable
  about: paper
  statement: How the theta channel was chosen among channels with a positive sharp wave above the centre of the pyramidal
    layer is not given, nor how the sharp wave was measured. With the sharp wave against a pre-ripple baseline, 32 of 104
    sessions in this attempt have no channel above a layer centre with a positive sharp wave, and theta cofiring (Fig. 2c)
    moves in and out of tolerance with the channel. Which channel per session, or the rule, would settle it.
- kind: methods_unavailable
  about: paper
  statement: The monosynaptic connection test is described as identical to the reliability test with reference to English
    et al. (2017), without the lags tested, the hollow fraction, the number of comparisons corrected for, or a minimum count.
    With the choices of this attempt, and with each varied in turn, it finds 38,402 to 50,756 connections against the paper's
    31,932, which changes the convergence values and the transmission peak (Fig. 7). The detector's parameters, or the list
    of detected connections, would settle it.
- kind: methods_unavailable
  about: paper
  statement: The burst index (Fig. 1h legend, ACG count at 2-5 ms over 200-300 ms) computed on the homecage spikes gives medians
    about 25% below the paper's, with the same shape; the code's 3-5 ms gives lower values still. The ACG used (bins, spike
    set, normalisation) is not fully given.
- kind: metadata_insufficient
  about: data
  statement: In 25 files (9 mice) the electrodes table gives probe_side Front or Back with shank numbers 1 to 4 on each, without
    saying whether these are two probes or two faces of one probe. Both faces have the same x positions, and the paper's pair
    counts by shank (2,561 SBD pairs within 500 um, 1,205 SBD and 13,494 DBD on the same shank in the maze, 1,743 and 15,996
    in the homecage, 347 and 3,588 of them more than 60 um apart) are found only when both faces count as one shank, so they
    are read here as faces of the same shanks.
- kind: paper_inconsistency
  about: paper
  statement: The Figure 1f legend gives n = 123, 106, 143 and 76 modulated neurons for the REM-shift fractions, cells locked
    in both wake and REM, but these exceed the REM-locked counts the paper gives for Figure 2d, and Figure 1f (top) gives
    n = 95 for E13.5. This attempt finds 90, 75, 75 and 60 cells locked in both states.
