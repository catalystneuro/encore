- claim: fig2c-theta-cofiring
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_huszar_2022.ipynb
  output: claim:fig2c-theta-cofiring
  measured:
  - 0.017
  - 0.007
  - 3751
  - 50461
  notes: SBD median 0.0170 and DBD 0.0070 over 3,727 and 50,392 pairs with a correlation (3,751 and 50,461 pairs, the paper's
    counts; 24 and 69 pairs without spikes in the cycles dropped); rank-sum p = 1.3e-42. Both medians lie just below tolerance
    (0.0170 to 0.0208 and 0.0078 to 0.0096; the SBD median rounds to the lower bound, and the notebook's check puts it below),
    so the outcome is partially reproduced. On the 72 sessions whose channel follows the rule the medians are 0.0164 and 0.0069
    (p = 1.7e-30); on the layer centre channel 0.0178 and 0.0079, both within tolerance (p = 4.3e-42). Theta cycles in homecage
    wake per session median 2,994 (63 to 15,512). As a clock check, 558 of 664 light-responsive cells are phase locked in
    wake against 29 when their spikes are set against the phase 10.3 s later.
  deviations:
  - 'Assumption: the theta channel. The Methods require "a channel with a positive sharp wave (that is, above the center of
    the pyramidal layer)" and do not say how one is chosen among those that qualify. The sharp wave of a channel is its mean
    LFP (uV) 0 to 50 ms after the ripple peaks minus its mean 100 to 50 ms before them, in a 52 s stretch of homecage non-REM
    sleep; in the 6 sessions with 20 or fewer ripples in homecage non-REM (among them e13_1f1_200305 and e13_1f1_200307, which
    have no non-REM sleep) all ripples are used. The theta channel is the channel of the pyramidal layer centre''s shank face
    with a positive sharp wave and larger rel_y than the centre, the one with the largest ripple power; on another face when
    that one has none (6 sessions); and the channel next to the centre with larger rel_y when no face has one (32 of 104 sessions,
    which depart from the Methods). 320 of the 327 positive channels on the centre''s face lie at larger rel_y than the centre,
    so larger rel_y is above the layer. In the first revision a positive channel below the centre also qualified, which 6
    sessions used; both halves of the Methods'' phrase are now required (verifier, round 2), and 72 of 104 sessions follow
    the rule. Variants: the layer centre channel, and the 72 sessions whose channel follows the rule.'
  - The theta filter is a fourth-order Chebyshev type II band-pass (20 dB, buzcode's default), applied forward and backward;
    the amplitude threshold (mean + 1 SD) is taken over the whole session.
