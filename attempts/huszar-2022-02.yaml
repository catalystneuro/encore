- claim: fig3c-assembly-cofiring
  outcome: blocked
  blocked_by: too_large
  notes: 'Not run. The first run reached its time limit before the assembly analysis was built, and the claim was recorded
    as too_large under the protocol''s time rule. The estimate given then, about 9 GB for a median session and over 12 GB
    for the largest, is for the dense double-precision matrix of homecage spikes in 1 ms bins (about 14 million bins by a
    median of 77 pyramidal cells), held whole. It is not a limit of the analysis: the covariance can be accumulated over chunks
    of bins, or computed from the spike times, and the projections and expression strengths need only a few signals of that
    length. Such an implementation was not attempted (verifier, round 2: not attempted, not too large); building it is a new
    analysis, which waits for a new attempt.'
