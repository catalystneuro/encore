- claim: ed3-depth-control
  outcome: not_reproduced
  notes: 'Depth differs across birthdates before matching (bootstrap Kruskal-Wallis H = 23.5, p < 0.0002; paper H = 26.3),
    and every kept depth-matched resampling has 0.4 < p < 0.6 on depth, so the matching holds. Fractions of 500 matched resamplings
    with p < 0.05: burst index 0.980 (paper 0.712), SPW-R rate 0.990 (0.988), SPW-R participation 0.992 (0.938), wake theta
    depth 1.000 (1.0), spatial information 0.980 (0.726), coverage 0.992 (0.738). Three are within tolerance; burst index,
    spatial information and coverage lie above it, and the criterion''s partial outcome needs the burst fraction within tolerance,
    so the outcome is not reproduced, although the birthdate differences survive depth matching more often than in the paper,
    which is what the statement says. The four extra seeds (20 resamplings each) give 0.90 to 1.0 for every measure, the burst
    fraction outside tolerance under each; with depth from the ripple-power centre on every shank face the homecage fractions
    are 0.92 to 1.0, burst 0.92, still outside. 376 of the 664 homecage cells (318 of 466 maze cells) lie on shank faces without
    a sharp-wave reversal. The fractions moved slightly from the previous run (burst 0.976) because the resampling shares
    its generator with the theta depth, whose cells changed with the theta channel.'
  assumed: true
  notebook: reproduce_huszar_2022.ipynb
  output: claim:ed3-depth-control
  measured:
  - 0.98
  - 0.99
  - 0.992
  - 1.0
  - 0.98
  - 0.992
  deviations:
  - 'Assumption: the depth reference. Depth is the maximum-waveform channel''s rel_y minus the SPW reversal of its shank face,
    the reversal taken where the sharp wave (as for the theta channel) steps from positive to negative between neighbouring
    channels, interpolated to zero; on a face without such a step the ripple-power centre stands in. The variant takes the
    ripple-power centre on every face.'
  - subsample1D is not in the repository; depth is matched in 20 um bins (the electrode pitch), a standard choice, per birthdate
    with replacement and n preserved, against the depths of all 664 homecage light-responsive cells; the maze measures are
    resampled over the 466 maze cells against the same reference.
  - To fit the run's time the inner bootstrap tests use 200 resamplings for the depth test and 300 for each measure, a draw
    is retried at most 100 times, and the four extra seeds run 20 resamplings each.
