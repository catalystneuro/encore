- claim: fig2e-f-dspike-maps
  outcome: not_reproduced
  notebook: reproduce_park_2025.ipynb
  output: claim:fig2e-f-dspike-maps
  notes: The criterion's two thresholds are never met together. With dF/F_ref the -dSpike distal value is 0.72 of
    the soma's beyond 300 µm, not below half; between 300 and 400 µm it is 0.50 to 0.51, but the +dSpike value is then 0.81
    to 0.86 of the soma's, below it; beyond 300 µm the +dSpike threshold alone is met (1.01 to 1.06). With raw -dF/F the -dSpike ratio is 0.27 to 0.44 and the
    +dSpike ratio 0.38 to 0.74. bAPs with a dSpike are larger in the distal region than bAPs without (dF/F_ref 3.3 against
    2.1 beyond 300 µm, 2.6 to 2.8 against 1.5 between 300 and 400 µm).
  deviations:
  - The distal region is the traced line beyond 300 µm (claims file). The line was traced on the mean image as the brightest
    ridge, where the paper drew it by hand on a structural image; beyond about 400 µm it runs off the trunk (the mean image
    along it falls to 0.73 to 0.89 of the image median in the Fig. 2 and 3 files, notebook section "Where the regions lie"),
    so 300 to 400 µm is shown as a variant.
  - dF_ref is the mean -dF from 10 to 20 ms after each spike relative to the trial's pre-stimulus baseline (Fig. 1d legend),
    averaged over all bAPs of the file for each segment. With bAPs in bursts and a 20 ms stimulus this window holds the stimulus-driven
    depolarization, which is largest near the stimulated branch; raw -dF/F is shown as a variant. The paper does not say how
    F_ref was taken for bursts.
  - The distal value treats the distal segments as one region (mean peak over mean reference); the paper shows maps and gives
    no number, and the criterion's half and equal are the claims file's readings.
- claim: fig2h-length-constant
  outcome: not_reproduced
  notebook: reproduce_park_2025.ipynb
  output: claim:fig2h-length-constant
  measured: 1457.0
  notes: No reading gives 255 ± 10 µm. Per-spike fits of dF/F_ref over the traced trunk (to 400 µm) fail or exceed 5000 µm
    for 23 to 42% of the -dSpike bAPs, and give a mean λ of 1407 to 1488 µm for A exp(-x/λ) and 54 to 58 µm for A exp(-x/λ)
    + c, for the Fig. 2 file and for all six files. Fits of raw -dF/F give 356 ± 4 µm (Fig. 2 file, 106 to 110 spikes) and
    402 to 404 ± 4 µm (all six files, about 600 spikes) without an offset; with an offset they mostly fail. The amplitude
    profile rises near the stimulated branch before it falls, which an exponential from the soma does not describe. The sample
    is 106 to 110 -dSpike bAPs in the Fig. 2 file and 590 to 646 in all six, against the paper's 93.
  deviations:
  - The fit runs over the traced trunk to 400 µm; beyond it the line leaves the dendrite. The paper does not give the fit
    range.
  - Amplitude is the peak -dF/F in the somatic peak frame and the next 3 frames, relative to the trial's pre-stimulus baseline.
