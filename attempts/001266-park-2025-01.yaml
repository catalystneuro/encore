outcomes:
- claim: source-data-index
  outcome: reproduced
  notebook: reproduce_park_2025.ipynb
  output: claim:source-data-index
  notes: 'All 83 rows of the Source Data index name a file in the dandiset; they hold 81 distinct names, the 81
    subject folders (two files are listed for two panels each). The experiment label in every file opened matches
    the index''s Experiment column. Counts identify the Fig. 3 files: the legend''s D2 (49 + 35 = 84 bAPs) is the
    file named D4 (84 bAPs with the claims file''s settings, 85 to 88 with 4 s.d.); the file named D2 has 105 to
    110. The Fig. 2 entry (file D3, the legend''s "D1 stim") gives the legend''s 8 dSpikes. The soma and D4+soma
    files have 139 to 167 bAPs against the legend''s 167 and 170. The Fig. S8 legends'' counts (92 and 96 bAPs)
    do not single out a file: D1 and D2 have 105 to 113. Three recordings are deposited twice.'
  deviations:
  - Names are matched after the index's spelling (underscores, spaces, stray quotes) is put into DANDI's (hyphens).
- claim: fig2a-dspike-dichotomy
  outcome: reproduced
  notebook: reproduce_park_2025.ipynb
  output: claim:fig2a-dspike-dichotomy
  measured: 8
  notes: '8 of 54 trials carry a dSpike under both filter readings, with the claims file''s 5 s.d. threshold and
    with 4 s.d., distal region beyond 300 µm; no dSpike follows the first somatic spike of a trial. The statement
    says more than the criterion tests, and that part does not hold: 7 to 10 trials have three somatic spikes, not
    two, and 5 to 7 of the 8 dSpikes ride on the third spike; each dSpike is on the last spike of its trial. With
    the region cut at 400 µm the Butterworth reading gives 6.'
  deviations:
  - The distal region is the traced line beyond 300 µm (claims file). The line was traced on the mean image as the
    brightest ridge, where the paper drew it by hand on a structural image; beyond about 400 µm it runs off the
    trunk, so 300 to 400 µm is shown as a variant.
  - dSpike threshold at the first minimum of a Gaussian kernel density (Scott bandwidth) of the distal amplitudes
    above its main mode, with interpolated FWHM < 5 ms. The claims file places it at the histogram's trough; the
    trough between the two highest modes (tried while preparing, not in the notebook) falls between two small clusters
    of dSpikes and was not used.
  - File D3, the index's Fig. 2 entry (the legend calls the stimulus D1).
- claim: fig2b-bimodal-distal-amplitudes
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_park_2025.ipynb
  output: claim:fig2b-bimodal-distal-amplitudes
  notes: The two readings the criterion names disagree, so the criterion makes the claim methods_underspecified.
    A two-component Gaussian mixture is preferred for the distal amplitudes (BIC lower by 55 to 125) and not at
    the soma (BIC higher by 11 to 12), as the claim says. Hartigan's dip test finds no bimodality at either site
    (distal p 0.63 to 0.99, soma p 0.70 to 0.93); 8 large events among about 115 are too few for it. The question
    for the paper's authors is which test, if any, supports "clearly bimodal".
  deviations:
  - dSpike threshold at the first minimum of a Gaussian kernel density (Scott bandwidth) of the distal amplitudes
    above its main mode, with interpolated FWHM < 5 ms. The claims file places it at the histogram's trough; the
    trough between the two highest modes (tried while preparing, not in the notebook) falls between two small clusters
    of dSpikes and was not used.
- claim: fig2e-f-dspike-maps
  outcome: partially_reproduced
  notebook: reproduce_park_2025.ipynb
  output: claim:fig2e-f-dspike-maps
  notes: 'bAPs with a dSpike are larger in the distal region than bAPs without (dF/F_ref 3.3 against 2.1 beyond
    300 µm, 2.6 to 2.8 against 1.5 between 300 and 400 µm), so the dSpike amplifies the distal response. Neither
    of the criterion''s thresholds is met by the claims file''s measure: with dF/F_ref the -dSpike distal value
    is 0.72 of the soma''s beyond 300 µm (0.50 to 0.51 to 400 µm), not below half, while the +dSpike value is 1.01
    to 1.06 of the soma''s beyond 300 µm (0.81 to 0.86 to 400 µm). With raw -dF/F the -dSpike ratio is 0.27 to 0.44
    (confined) and the +dSpike ratio 0.38 to 0.74 (below the soma).'
  deviations:
  - The distal region is the traced line beyond 300 µm (claims file). The line was traced on the mean image as the
    brightest ridge, where the paper drew it by hand on a structural image; beyond about 400 µm it runs off the
    trunk, so 300 to 400 µm is shown as a variant.
  - dF_ref is the mean -dF from 10 to 20 ms after each spike relative to the trial's pre-stimulus baseline (Fig.
    1d legend), averaged over all bAPs of the file for each segment. With bAPs in bursts and a 20 ms stimulus this
    window holds the stimulus-driven depolarization, which is largest near the stimulated branch; raw -dF/F is shown
    as a variant. The paper does not say how F_ref was taken for bursts.
  - The distal value treats the distal segments as one region (mean peak over mean reference); the paper shows maps
    and gives no number, and the criterion's half and equal are the claims file's readings.
- claim: fig2h-length-constant
  outcome: not_reproduced
  notebook: reproduce_park_2025.ipynb
  output: claim:fig2h-length-constant
  measured: 1488.2
  notes: No reading gives 255 ± 10 µm. Per-spike fits of dF/F_ref over the traced trunk (to 400 µm) fail or exceed
    5000 µm for 23 to 42% of the -dSpike bAPs, and give a mean λ of 1407 to 1488 µm for A exp(-x/λ) and 54 to 58
    µm for A exp(-x/λ) + c, for the Fig. 2 file and for all six files. Fits of raw -dF/F give 356 ± 4 µm (Fig. 2
    file, 109 to 110 spikes) and 402 to 404 ± 4 µm (all six files, about 600 spikes) without an offset; with an
    offset they mostly fail. The amplitude profile rises near the stimulated branch before it falls, which an exponential
    from the soma does not describe. The sample is 109 to 110 -dSpike bAPs in the Fig. 2 file and 590 to 646 in
    all six, against the paper's 93.
  deviations:
  - The fit runs over the traced trunk to 400 µm; beyond it the line leaves the dendrite. The paper does not give
    the fit range.
  - Amplitude is the peak -dF/F in the somatic peak frame and the next 3 frames, relative to the trial's pre-stimulus
    baseline.
- claim: fig3-subthreshold-no-dendritic-initiation
  outcome: partially_reproduced
  notebook: reproduce_park_2025.ipynb
