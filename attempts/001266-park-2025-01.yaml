findings:
- kind: code_mismatch
  statement: 'The paper''s Supplementary Software 1 does not run as published: run_morphology.py calls FullCA1Model(channel_params,
    morphology_file), while FullCA1Model requires a third argument, ka_cutoff (run_simulation.py passes 100). Its
    cheriff.mod carries non-ASCII characters that NEURON 9 rejects. With these fixed, its step simulation at the
    soma gives success, success, success, success, failure at 500 µm, not the failure, success, success, failures
    of Fig. 4f.'
- kind: data_missing
  statement: 'The dandiset holds the example recordings of the figures (the 83 rows of the Source Data index, 84
    files), not the pooled samples behind the paper''s statistics: the 17 neurons of Fig. 3, the 43 branches of
    Fig. 4b, the 28 cells of Fig. 5b, the drug series of Figs. 6 and S16 to S18, the temperature series, the patch
    recordings of Fig. S1 and the calibration series of Figs. S3 to S5. 29 of the 55 claims cannot be tested for
    this reason.'
- kind: metadata_insufficient
  statement: The files hold only raw camera movies and DAQ channels. They carry no pixel size, no structural (2P
    or HiLo) or eYFP images, no stimulus masks, and no regions of interest, so distances from the soma, stimulus
    positions and the user-drawn regions of the paper cannot be recovered from the files. The pixel size used here
    (0.65 µm) is from the Methods.
- kind: metadata_error
  statement: 'Every file is its own subject: subject_id is the file name (81 subjects for 84 files), date_of_birth
    is 1900-01-01 and sex is U. Animals and cells can be told apart only through the file names (for example PP070-P16-Cell2).'
- kind: other
  statement: 'Three recordings are deposited twice with identical sizes and first frames: sub-153924PP070-P27-Cell1-soma-step-5ms
    (one copy named without a session), sub-000919PP070-P17-V2-11-freq-opto and sub-000820PP070-P17-V2-11-freq-opto-2khz
    (two copies each, with different obj- suffixes).'
- kind: metadata_error
  statement: Camera frames are 1.03 ms apart (971 Hz; 1.04 ms in one file) where the paper states 1 kHz, and 0.52
    ms (1923 Hz) where it states 2 kHz. The movie and the DAQ record span the same time, so the timestamps are consistent;
    the stated rates are rounded.
- kind: metadata_insufficient
  statement: The camera series has "no description", and the DAQ channels are named only by short labels that differ
    between files for the same signal (the EFS trigger is stim1, stim1 (distal), EC, EC_elec or EC_stim). The amplifier
    gains are given only in the dandiset description, not in the files.
- kind: other
  statement: 'File names and figure legends name stimulus sites differently: the Fig. 2 legend''s "D1 stim" is the
    file named D3, and the Fig. 3 legend''s D2 is the file named D4 (its bAP count, 84, matches the legend''s 49
    + 35). The Source Data index resolves the first; counts resolve the second.'
- kind: other
  statement: In the Fig. 2 recording 7 to 10 of the 54 trials have three somatic spikes, where the paper says each
    stimulus evoked two, and most dSpikes ride on the third spike, where the paper says they always emerged from
    the second.
- kind: methods_unavailable
  statement: 'Question for the paper''s authors: what somatic spike threshold, dSpike threshold and distal region
    (its far end along the dendrite) were used for the bAP and dSpike counts of Figs. 2 to 4 and S8 to S18? The
    Methods say the thresholds were set by hand and the region was typically beyond 300 µm. Here a somatic threshold
    of 5 robust s.d. misses spikes in bursts (150 against the legend''s 167 and 170 bAPs), and the counts for Fig.
    3f move from 46 to 51 of 54 when the region stops at 400 µm.'
- kind: methods_unavailable
  statement: 'Question for the paper''s authors: how was dF_ref taken when bAPs come in bursts during a 20 ms stimulus,
    and over what range and with what amplitude measure was the length constant of Fig. 2h fitted? With the reference
    10 to 20 ms after each spike (Fig. 1d legend) the normalized profiles rise near the stimulated branch and per-spike
    exponential fits fail or give 54 or about 1400 µm; raw amplitudes give 356 µm.'
- kind: methods_unavailable
  statement: 'Question for the paper''s authors: over what window were the AUCs of Figs. 5 and 6 integrated? Up
    to the end of the cumulative rise, a single bAP with EFS gives ratios above 2 at two timings in the one cell
    available; to the end of the epoch, the single-stimulus areas are near zero and no ratio exceeds 2.'
- kind: methods_unavailable
  statement: 'Question for the paper''s authors: how was the noise-equivalent voltage of Fig. S2 defined, and on
    which pixels (weighted or not)? With the unweighted cell region it is 3.3 to 3.5 mV at 1 kHz here, against 1.2
    ± 0.5 mV.'
- kind: methods_unavailable
  statement: 'Question for the paper''s authors: which pixels and what preprocessing went into the PCA of Fig. S7b?
    On raw stimulus-triggered pixel waveforms of the Fig. 3a recording the first five components hold 22 to 30%
    of the variance, not more than 96%.'
