- claim: fig5-sham-no-response
  outcome: blocked
  blocked_by: data_missing
  notebook: reproduce_gao_2025.ipynb
  notes: The dandiset's Units tables hold spike times only, with no waveforms, waveform features, electrodes
    or cell-type labels (data check), so units cannot be classified as RSUs or FSUs by the initial phase
    and afterhyperpolarization of their waveforms (Methods, Neuronal type classification). The waveforms
    of these units are not public anywhere else that the attempt could find; the paper's data statement
    names dandiset 000946, whose rats (BH494 to BH594, 20 rats) are not those of 000637 (BH401 to BH477). No recording
    holds POm units (each file has one 32-channel probe with electrode locations 'unknown', and the description
    names only S1). No recording is labelled sham. Three recordings are named BASELINE (BH458, BH460,
    BH461; 500 trials each) with no description of whether tFUS was off or how their trial times were
    made. Pooled over all their units (119 units), the rate rises over the pre-trial window at 134 to
    201 and 201 to 268 ms under the signed-rank test (corrected p 6.0e-09 and 1.2e-05) and not under the
    rank-sum test, with mean N1 of 106%; this decides nothing (variant:baseline). If these were the paper's
    sham sessions this W2 result would weigh against the claim, which tests 201 to 268 ms in both tails.
    Their 119 units do not match the paper's 84 S1 units in sham (31 RSUs, 53 FSUs), and no field in any
    file describes them (full HDF5 tree listed in the data check).
