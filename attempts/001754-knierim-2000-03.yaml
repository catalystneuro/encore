- claim: flight-spatial-code
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_knierim_2000.ipynb
  output: claim:flight-spatial-code
  notes: The criterion judges this claim from its three dependencies. si-comparable-to-preflight is
    partially reproduced, si-rat3-fd4-vs-preflight reproduced and si-rat1-fd9-vs-preflight blocked as
    methods_underspecified. The others do not decide it, as the rule gives partially reproduced if
    the rat 1 comparison is reproduced or partially reproduced and not reproduced if it is not
    reproduced; the rat 1 preflight ES reading (p = 0.50) would give the first and the preflight MC
    reading (p = 0.0055, flight higher) the second. The outcome differs from 001754-knierim-2000-02
    (not reproduced) because the claim is now judged as the paper judges it, by spatial information
    against preflight, and not by a shuffle test the paper does not use; that test is not run.
    The answers of 2026-10-20 leave the rat 1 comparison blocked, as its criterion now says when the
    two preflight epochs disagree, so this claim is blocked before and after.
  deviations:
  - Inherits the deviations of its three dependencies.
- claim: si-comparable-to-preflight
  outcome: partially_reproduced
  notebook: reproduce_knierim_2000.ipynb
  output: claim:si-comparable-to-preflight
  measured: [1.377, 1.320, 17, 21]
  notes: Under both readings with preflight values the Mann-Whitney test finds no difference. Rat 2's
    17 active FD9 ES maps have 1.377 +/- 0.120 bits per spike, against 1.320 +/- 0.112 for its 21
    preflight ES maps (p = 0.88, difference 0.057) and 1.284 +/- 0.116 for its 25 preflight MC maps
    (p = 0.66, difference 0.092). No reading puts both means within tolerance (1.377 above 1.22; 1.320
    and 1.284 above 1.20), so the rule gives partially reproduced. The FD9 count (17) is within 16 +/-
    1.6 and the preflight counts (21, 25) are not within 19 +/- 1.9. Reading M-b gives 2.965 +/- 0.224
    over 25 active FD9 units but cannot be computed preflight; tested against the M-a preflight
    values it differs (p below 1e-6), a variant, not judged. The FD9 ES window is one in
    which the trace behaves as Rat 2's position (data check). In 001754-knierim-2000-02 this claim,
    then from the dandiset's description and judged on Rats 1 and 2 pooled by medians, was reproduced
    (later removed from that record); the outcome differs because the claim is now rat 2's, with the
    paper's means as expected values, which the deposited maps exceed. What the answers of
    2026-10-20 changed. The criterion now has both sides of a comparison use one map reading and
    judges on M-a where M-b cannot be computed preflight, which is what this attempt had done; and
    under S-b each epoch of the preflight day is run on its own, so S-b gives the same two readings
    (ES and MC) as S-a, where the attempt had read S-b as MC alone. Neither changes a number or the
    outcome (partially reproduced before and after).
  deviations:
  - Reading M-a uses the deposited maps, each identical copy once, and counts a map as active by its
    own occupancy-weighted mean rate, as the pinned version cannot link maps to units.
  - Which preflight epoch was the rectangular track of Fig. 2b is not stated in the files.
- claim: si-rat1-fd9-vs-preflight
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_knierim_2000.ipynb
  output: claim:si-rat1-fd9-vs-preflight
  measured: [1.588, 1.804, 24, 25]
  notes: The readings disagree on the test. Rat 1's 24 active FD9 ES maps (1.588 +/- 0.143 bits per
    spike) do not differ from its 25 preflight ES maps (1.804 +/- 0.149, p = 0.50, difference
    -0.216) and are higher than its 24 preflight MC maps (1.127 +/- 0.114, p = 0.0055, difference
    0.461); the paper does not say on which track or in which epoch rat 1's preflight cells were
    recorded. No mean is within tolerance (1.19 +/- 0.09, 1.37 +/- 0.10) and no count within 10% (24
    against 21; 25 and 24 against 28). Reading M-b gives 3.331 +/- 0.268 over 24 units, flight only,
    and is not judged. What the answers of 2026-10-20 changed. The criterion now runs each preflight
    epoch on its own under S-a and S-b, prefers neither, and keeps the claim blocked when they
    disagree, so the block that the attempt had applied pending the answer is now the criterion's
    own; the outcome is blocked before and after. New claim; 001754-knierim-2000-02 had none like it.
  deviations:
  - As for si-comparable-to-preflight (M-a activity by map rate).
- claim: si-rat3-fd4-vs-preflight
  outcome: reproduced
  notebook: reproduce_knierim_2000.ipynb
  output: claim:si-rat3-fd4-vs-preflight
  measured: [1.231, 1.518, 11, 38]
  notes: Under both readings the test finds no difference. Rat 3's 11 active session 2 (ES1) maps
    have 1.231 +/- 0.206 bits per spike, against 1.518 +/- 0.125 for its 38 preflight ES maps (p =
    0.28, difference -0.287) and 1.337 +/- 0.121 for its 33 preflight MC maps (p = 0.77, difference
    -0.106). Under the ES reading both means are within tolerance (1.12 +/- 0.27 and 1.48 +/- 0.11),
    which the rule requires of one reading. The counts are not (11 against 7; 38 and 33 against 24),
    so the cells are not the paper's set; the criterion's rule does not use them. Session 3 (ES2, 19
    maps, 1.384 +/- 0.177) does not differ from either preflight epoch (p = 0.28 and 0.86). Reading
    M-b gives 3.038 +/- 0.334 over 16 units, flight only, and is not judged. The answers of
    2026-10-20 (one map reading on both sides; each preflight epoch a candidate under S-a and S-b)
    confirm the readings the attempt judged on and change no number; reproduced before and after.
    New claim.
  deviations:
  - As for si-comparable-to-preflight. Session 2 is read as the file's first ES epoch (ES1), as the
    paper says the first session was lost.
- claim: fd4-abnormal-selectivity
  outcome: partially_reproduced
  notebook: reproduce_knierim_2000.ipynb
  output: claim:fd4-abnormal-selectivity
  notes: Lower spatial information than preflight holds for rat 2 under both readings and for rat 1
    under neither. Rat 2's 14 active FD4 ES maps (0.708 +/- 0.112 bits per spike) are lower than its
    preflight ES (1.320, p = 0.00063) and MC maps (1.284, p = 0.0015). Rat 1's 20 FD4 ES maps (1.409
    +/- 0.192) are lower than its preflight ES maps without significance (1.804, p = 0.077) and
    higher than its MC maps (1.127, p = 0.36). Rat 2's FD4 maps are also lower than its FD9 maps
    (1.377, p = 0.00033); Rat 1's are not (1.588, p = 0.38). In Rat 2's FD4 ES window the trace could
    not be shown to be Rat 2's position (data check), and that file holds five identical copies of
    maps, counted once. That the patterns differed between the rats is not judged. In
    001754-knierim-2000-02 this claim, then from the dandiset's description and judged on Rats 1 to
    3 pooled by a one-sided test, was reproduced (later removed from that record); it now requires
    each of rats 1 and 2 with a two-sided test, and holds for one. The answers of 2026-10-20 (one map
    reading on both sides, so M-b is not run as it has no preflight values; each preflight epoch a
    candidate) are what the attempt had done and change no number; partially reproduced before and
    after.
  deviations:
  - As for si-comparable-to-preflight.
- claim: fig3-stability-across-sessions
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_knierim_2000.ipynb
  output: claim:fig3-stability-across-sessions
  measured: 16
  notes: The readings disagree. Session 2 has 16 active units under reading M-b (the number
    recorded) and 11 deposited maps under M-a, not 7. The pairing of deposited maps to units by best
    match is one to one (11 maps tied to 11 distinct units, and 11 distinct session 3 maps), so M-a
    is judged. Under M-a, 6 of 11 cells keep their field by reading (a), more than half, and 5 of 11
    by reading (b), not more than half (95th percentile of 110 different-cell pairs 0.253). Under
    M-b, 6 of 16 by (a) (same-cell correlations -0.024 to 0.366, 95th percentile of 240 pairs 0.094)
    and 1 of 16 by (b), neither more than half. One reading of four passes, so the rule blocks the
    claim. Reading (b) under M-b gives 2, 1, 0 and 0 cells at field thresholds of 0.1, 0.2, 0.3 and
    0.5. Four units below 0.05 Hz in session 2 are active in session 3. What the answers of
    2026-10-20 changed. "Most" is now more than half of the active cells of session 2, not a count
    of 4, so M-b fails under both (a) and (b), where before (a) passed as a count; and the
    best-match pairing is now allowed for M-a when one to one, so M-a, a variant before, is judged
    and its reading (a) keeps the claim blocked. Blocked before and after, for a different reason;
    without M-a it would be not reproduced. The outcome differs from
    001754-knierim-2000-02 (reproduced), which used a median correlation of smoothed maps that the
    paper does not give; the claims file now gives a per-cell rule for 7 cells.
  deviations:
  - Session 2 and session 3 are read as the file's ES1 and ES2.
  - Reading M-a pairs each deposited map with the unit whose spike-count map it best matches, as the
    criterion allows when the pairing is one to one; the dandiset gives no link.
  - Takes the same tetrode and cluster id in both epochs to be the same cell.
