findings:
- kind: metadata_error
  statement: Still present (partly fixed in the unpublished draft). The Rat1 and Rat2 files of each
    flight day hold one tracker's trace over the whole session (98.6 to 98.8% of positions at shared
    timestamps within 2 pixels), each presented as that rat's position, and nothing names the
    animal tracked. With real against time-shifted spikes, the trace behaves as Rat2's position in
    Rat2's flight day 9 ES window (12 of 28 Rat2 units, 0 of 36 Rat1 units), and in Rat2's flight
    day 4 ES window neither rat's units are selective (0 of 17 and 1 of 17), so whose position it
    is there is not established.
- kind: data_missing
  statement: Still present. Position is given only at spike times, so occupancy time cannot be
    computed from it, and the preflight files have no position at all.
- kind: metadata_error
  statement: Still present in this version (the draft's description drops it). The dandiset
    description says the preflight recordings were made on a flat rectangular track, but the
    preflight files label their epochs ES (Escher staircase) and MC (Magic Carpet) and hold ES and
    MC rate maps. The paper states the rectangular track for rat 2 only.
- kind: metadata_error
  statement: New. The files' experiment description says baseline sessions were on a rectangular
    track, interleaved with task sessions; the paper says the baseline sessions were in the sleeping
    pouch, and the rectangular track was rat 2's preflight task. The preflight files have no
    baseline epoch.
- kind: identifier_missing
  statement: Still present (fixed in the draft). The rate-map table says cell_number matches the
    cluster id on the same tetrode, but the stated link exists for 98 of 211 flight unit-epochs and
    names the best-matching map for 84. Every one of Rat3's 42 flight day 4 ES maps has cell_number
    -1 ("not a per-cell map") though their names are per-cell short names, so Rat3's session 2 and
    session 3 maps cannot be paired by cell.
- kind: metadata_insufficient
  statement: Still present (partly fixed in the draft). The rate maps are smoothed (91% of the
    positive-rate bins of a well-matched map hold no spike of the unit), and neither that nor the
    kernel is stated.
- kind: metadata_insufficient
  statement: Still present (fixed in the draft). Rate maps use -999 for unvisited bins, which the
    column description (rate in Hz) does not state, and the occupancy counts the lost position
    (0, 255) in bin [63, 0], up to 19% of a flight occupancy map.
- kind: other
  statement: Still present (fixed in the draft). Six groups of identical rate maps are stored in three
    files, some under different tetrodes (Rat1 FD4 TT1 and TT11; Rat2 FD4 TT13, TT19 and TT22; Rat2
    FD9 TT13 and TT14).
- kind: data_missing
  statement: Still present (partly fixed in the draft's description). The dandiset description
    reports normal theta and sharp waves and ripples in the hippocampal EEG, but no file holds EEG,
    and no file name in the NASA record OSD-968 suggests it.
- kind: metadata_insufficient
  statement: Still present (fixed in the draft). Spike times are resolved to 1 ms or finer below 1000 s, 10 ms
    to 10000 s and 0.1 s beyond, with zero intervals that follow, and this is not stated; Rat1's
    flight day 4 file has two overlapping baseline epochs (2525 to 3390 s and 2720 to 3390 s), and
    1 to 14 spikes per file lie outside every epoch.
- kind: metadata_insufficient
  statement: Still present (partly fixed in the draft). The age is "/" for every subject, and the
    position's pixel scale and camera view are not described.
- kind: metadata_insufficient
  statement: Still present. Rat2's preflight units are on tetrodes TT0 to TT10 and its flight units on
    TT12 to TT22, with no tetrode in common, while Rat1 and Rat3 share 4 to 6 tetrodes between
    preflight and flight; nothing in the files confirms the preflight files are assigned to the right
    rats.
- kind: data_missing
  statement: New. The position ends before the end of two MC epochs, at 6308 s in Rat3's flight day 4
    file (41 s before the epoch ends, 5.3% of its MC spikes without a position) and at 10144 s in
    Rat2's flight day 9 file (7 s before).
- kind: selection_undocumented
  statement: New. The dandiset holds more active cells than the paper counts in most comparisons
    (Rat3 preflight 38 active ES maps against the paper's 24; Rat3 flight day 4 session 2, 11 maps
    and 16 units against 7; Rat1 flight day 9, 24 against 21), and the selection behind the
    paper's counts is not recorded.
