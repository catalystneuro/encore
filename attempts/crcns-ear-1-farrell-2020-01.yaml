findings:
- kind: metadata_insufficient
  statement: The data set stores CL, QTm, V0.5 and alphaB per cell, but not the lateral wall capacitance
    CLW, the stereocilia bundle capacitance CSB or the non-lateral-wall capacitance CNLW that the paper's
    Eq. 8a uses, so the paper's CLW and charge density cannot be taken from it. Computed here with the
    CSB rule of Corbitt et al. (2012) on the stored area, CLW reproduces the Fig. S1 legend's value (18.30
    against 18.56 pF), but several results (the XE991 fits, the band of Fig. 1, the lower C_Leq limit)
    turn on the CLW of the smallest cells, which this rule makes as small as 0.48 pF.
- kind: metadata_insufficient
  statement: The linear capacitance at negative voltages, CLn, and the rule for when it could be estimated
    are not stored; neither are the linear-region indices in the HDF5 files (the MATLAB files keep them
    as indposit_ramplin).
- kind: format_error
  statement: In every HDF5 file with DC steps (19 cells), `transformed data set/.../I_mean` has shape
    (N, 2) but stores its values in MATLAB column order (the N means, then the N SDs). Read as given,
    the mean and SD columns are interleaved; reshaped to (2, N) it equals the (mean, SD) columns of the
    original MATLAB files.
- kind: metadata_error
  statement: File sensory_cell_#52.h5 holds the membrane at +0.06 V before and after the ramp, where the
    stimulus description in every file says -0.06 V.
- kind: metadata_insufficient
  statement: '`cell_surface_area` follows two formulas, 2 pi r l for the 34 cells with a cell length and
    2 pi r LW + 2 pi r^2 (with the lateral wall length) for 50 others, and the description does not say
    so or which length is which measurement; `cochlear_outer_hair_cell_length` is stored for 35 cells
    and `cochlear_outer_hair_cell_lateral_wall_length` for 83.'
- kind: selection_undocumented
  statement: The cells behind the paper's tables are not marked. The data set gives 27 pigmented cells
    without XE991 with 144 mM chloride (paper 28), 17 pigmented XE991 cells with 144 mM chloride split
    5 and 12 by region (Table 1 row a, 4 and 11), 69 Fig. 2 cells (legend 70), 46 cells for Fig. 3b by
    the rule used here (legend 44).
- kind: metadata_insufficient
  statement: The original MATLAB field `toxins` labels 15 of the 20 XE991 cells `XE991` and 5 `yes`; the
    HDF5 files store 60 uM for all 20, while the Methods give 30 to 60 uM.
- kind: identifier_missing
  statement: 'The `original cell number` is not unique: 13 numbers are used by two cells each, from different
    dates and mostly different researchers and colonies. The file number is the only unique identifier,
    and the paper names cells by original number (Fig. S1, cell 99).'
- kind: methods_unavailable
  statement: Question for the paper's authors. How was CLn taken (which voltages, and what counted as
    having reached the hyperpolarized plateau, so that 62 cells qualify), and how was the per-cell CSB
    of Eq. 8 computed? The CLn rule assumed here (mean of the two most negative ramp points, plateau when
    the negative-end slope is below 0.4 of the steepest slope of the flank) gives 62 cells and the Fig.
    S1 legend's 25.94 pF, but the basal share of dC is 36.1%, not 21%. The CSB assumed here is the rule
    of Corbitt et al. (2012), bundle area min(0.07 AM, 140 um2) at 0.0075 pF/um2 with AM the stored cell
    surface area; it gives a root of 5.10 pF and the Fig. S1 cell CLW 18.30 pF (legend 18.56 pF). Was
    this the rule, and which area was AM?
- kind: other
  statement: The largest conductance at V0.5 among XE991 cells is 8.5 nS from the DC steps and 7.0 nS
    from the admittance, about 25 times the 335 pS the paper reports; the unit or the measure in the paper
    may differ from the data set's.
