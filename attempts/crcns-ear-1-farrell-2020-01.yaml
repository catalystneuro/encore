inputs:
- what: The rule for the stereocilia bundle capacitance CSB in Corbitt et al. (2012), Methods (bundle
    area 0.07 um2 per um2 of membrane area up to about 140 um2, at 0.0075 pF/um2), the method the paper
    cites for CSB; a method only, no data were taken from it
  source: doi:10.1016/j.bpj.2012.04.054
outcomes:
- claim: cohort
  outcome: reproduced
  notebook: reproduce_farrell_2020.ipynb
  output: claim:cohort
  measured:
  - 89
  - 42
  - 47
  notes: All eight group counts match the paper (17 and 22 adult males, 15 and 6 prepubertal males, 10
    and 18 prepubertal females, 1 pigmented adult female); 42 albino and 47 pigmented cells. 3 cells have
    10 mM chloride, 20 have XE991 (all stored as 60 uM), 81 have Rs < 10 MOhm (all 89 below 12 MOhm),
    and recordings were made 47 to 182 min after death.
  deviations:
  - The HDF5 maturity `juvenile` (10 males) is read as prepubertal, as the original MATLAB files put these
    cells in the prepubertal-male file.
- claim: figs1-example-cell
  outcome: reproduced
  notebook: reproduce_farrell_2020.ipynb
  output: claim:figs1-example-cell
  measured:
  - 24.58
  - 25.94
  - 18.43
  - -0.0216
  - 2.92
  - 36.04
  notes: File 79 is the one cell with original number 99 that is pigmented, prepubertal, female and in
    60 uM XE991. Recomputed from its trace, CL 24.58 pF, CLn 25.94 pF, CLW 18.43 pF, V0.5 -0.0216 V, QTm
    2.92 pC and alphaB 36.04 V-1, all within tolerance. The stored CL 24.45 pF, V0.5 -0.0218 V, QTm 3.02
    pC and alphaB 34.99 V-1 equal the legend. The cell's stored area is 2223 um2, so CSB is 1.05 pF and
    CNLW 6.154 pF (the legend implies 5.89 pF); the stored CL gives CLW 18.30 pF. The answer in questions/crcns-ear-1.yaml
    amended the shared method to a per-cell CNLW (reading L-b used here, see deviations). Before it, with
    CLW = CL - 4.82 pF, CLW was 19.76 pF, within tolerance only on its wide bound; the outcome (reproduced)
    is unchanged.
  deviations:
  - CL is recomputed as the mean C over 0.09 to 0.15 V, the range the Methods give for Rm and Rs where
    there is no measurable voltage-dependent capacitance (Methods, Whole-cell patch-clamp, paragraph 2);
    the paper's own linear region was picked by hand.
  - V0.5 is the voltage of the largest C (reading p-a) times Rm/(Rm+Rs) over 0.09 to 0.15 V; the Boltzmann
    reading (p-b) gives -0.0234 V.
  - 'CLn is not stored and the paper gives no rule beyond the plateau (Results, Asymmetry of C versus
    V function, paragraph 1). Assumed: CLn is the mean C of the two most negative ramp points (this gives
    the Fig. S1 legend''s 25.94 pF for its cell), and a cell has a plateau when the slope of C at or below
    -0.15 V is less than 0.4 of the steepest 5-point slope of the hyperpolarized flank, the fraction whose
    count is nearest the paper''s 62 cells.'
  - CLW is CL - CNLW with CNLW = CSB + root per cell, reading L-b of the claims file's shared method as
    amended after the question in questions/crcns-ear-1.yaml; the data set stores no CLW, CNLW or CSB,
    so reading L-a cannot be used. CSB follows the method the paper cites ("We determined C N L W by calculating
    the capacitance of the stereocilia bundle and plotting ... Q T m ... as a function of C L - C S B
    to find the root", Expressions used to determine the experimental parameters, paragraph 2; Corbitt
    et al. 2012, doi:10.1016/j.bpj.2012.04.054, Methods), bundle area min(0.07 AM, 140 um2) times 0.0075
    pF/um2 with AM the stored cell surface area. This rule is assumed, as the paper does not state it;
    it gives the Fig. S1 cell CLW 18.30 pF, within the claims file's admissibility bound (18.56 +/- 1.856
    pF). The 6 cells without an area take the median CSB of their turn (assumed). The root, 5.104 pF,
    is that of QTm on ln(CL - CSB) over all 89 cells. CL - 4.82 pF (reading L-c) is shown for comparison
    and decides nothing.
- claim: nlw-capacitance
  outcome: reproduced
  notebook: reproduce_farrell_2020.ipynb
  output: claim:nlw-capacitance
  measured: 5.1
  notes: With the CSB of Corbitt et al. (2012) on the stored area, the root of QTm = gamma + beta ln(CL
    - CSB) (reading n-ii) is 5.104 pF (95% bootstrap interval 4.53 to 5.66, 89 cells) and 5.125 pF (86
    cells with 144 mM chloride), within 4.82 +/- 0.482 pF; the area recomputed as 2 pi r (L + r) gives
    5.100 and 5.120 pF. The mean per-cell CNLW (n-i) is 5.98 pF, outside. The group intervals overlap
    (pigmented 4.76 against albino 5.72 pF; adult 5.26 against juvenile 4.96 pF), so the second part of
    the statement holds. The answer in questions/crcns-ear-1.yaml kept the expected 4.82 pF and amended
    the criterion to read it as the mean per-cell CNLW (n-i) or the root alone (n-ii), with a per-cell
    CSB. Before the answer only CSB = 0 (n-c) was run, giving 5.44 pF, and the outcome was not_reproduced;
    n-c still gives 5.44 pF.
  deviations:
  - Readings n-a and n-b (CSB, or CNLW and CLW, as stored per cell) cannot be run as written; the data
    set does not store them. The CSB of Corbitt et al. (2012), doi:10.1016/j.bpj.2012.04.054, Methods,
    the method the paper cites for the stereocilia bundle (Expressions used to determine the experimental
    parameters, paragraph 2), is computed per cell from the stored cell surface area and stands in for
    n-a. Assumed, as the paper does not state the rule; the 6 cells without an area take the median CSB
    of their turn. Reading n-c (CSB = 0) is also shown.
  - Intervals are 95% bootstrap intervals over cells (2000 resamples, fixed seed), a standard choice.
  assumed: true
