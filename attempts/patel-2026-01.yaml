findings:
- kind: data_missing
  statement: The dandiset holds the current clamp recordings, the cued-2BC imaging sessions and the resident-intruder
    imaging sessions only. The home-cage 2BC licks, the tube-test ranks of the drinking and imaged mice,
    the blood alcohol values, the unimplanted control mice, the optogenetic behaviour sessions (ChR2,
    ChrimsonR, NpHR), the stability imaging of Extended Data Fig. 7 and the pose tracking and interaction
    annotation of the resident-intruder sessions are not in it, although the description lists pose tracking.
    28 of the 61 claims cannot be tested for this reason.
- kind: data_missing
  statement: 13 of the 205 current clamp files hold no recording. Each holds a single voltage series and
    a single stimulus series named with the amplifier's secondary channel (VmSec, where every recorded
    file has VmPrime, ImPrime or ImPrime2), both flat (about 0.2, 0 or -209 mV, no step); their size,
    31 or 62 MB, comes from histology images. They are 11 isolated female BLA-mPFC neurons (subjects M3.1,
    M3.3, M4.1, M4.2, M4.3, September 2024) and 2 group-housed ones (M2.2, August 2024), so only 3 isolated
    female neurons from one mouse remain. One isolated male file (M6.3, 2022-07-27) holds only the -120
    pA sweep.
- kind: metadata_error
  statement: Three pairs of cued-2BC files hold identical fluorescence traces with different licks. Cohort16-M2-1
    and Cohort16-M1-4, Cohort16-M3-4 and Cohort16-M3-3, and the isolation sucrose sessions of Cohort13b-M3-2
    and Cohort13b-M2-2. In each pair the traces respond to the licks of the second file, so the first
    file carries another mouse's imaging.
- kind: metadata_error
  statement: All 53 cued-2BC files carry the same 30 cue timestamps and one of two trial-type sequences.
    In 24 sessions (every session of 5 of the 9 mPFC mice, Cohort13b M2-1, M2-2, M2-3, M3-2 and M3-3,
    and 7 cohort-16 sessions) the licks show the forced types swapped, alcohol or sucrose licks only on
    type-1 trials and water licks only on type-2 trials, against the stored coding (1 forced water, 2
    forced alcohol or sucrose); 3 cohort-16 sessions are mixed. The licks do not contradict the choice
    types (3 and 4), but whether light was delivered on type-4 trials cannot be checked.
- kind: selection_undocumented
  about: data
  statement: The imaging files hold every CNMF-E ROI (1113 in the nonspecific BLA mice against the paper's
    540 neurons, 347 against 196 in the BLA-mPFC mice, 748 and 439 against 240 and 281 in the mPFC alcohol
    sessions). The visual curation the Methods describe is not recorded, so the paper's neurons cannot
    be selected.
- kind: selection_undocumented
  about: data
  statement: The dandiset holds 37 group-housed male BLA-mPFC neurons from 12 mice; Figure 2c uses 21
    from 7. The 2022 cohort holds exactly 21 from 7, but nothing in the files marks the neurons of Figure
    2c or Supplementary Table 1.
- kind: metadata_insufficient
  statement: The BLA imaging files do not say whether GCaMP was expressed in all BLA neurons or only in
    BLA-mPFC projectors; the virus and experiment description fields are empty in the cued-2BC files.
    Cohorts 9 and 10 (10 mice) and cohort 16 (11 mice) match the paper's N for the two populations, which
    is the only basis for telling them apart.
- kind: metadata_insufficient
  statement: The ranks of the imaged mice are not given (subject descriptions say only cage and mouse
    number), and 29 nonspecific current clamp neurons from the four 2021 mice carry no rank. The subject
    name M3.1 is used for two group-housed males recorded on 2024-07-18 (rank 1) and 2024-07-19 (rank
    3).
- kind: format_error
  statement: The lick times are stored as the data of TimeSeries that also declare a starting time of
    0 and a rate of 100 Hz, so a reader that takes the series at face value gets lick indices, not times.
    The values are times in seconds on the imaging clock.
- kind: other
  about: data
  statement: Cohort 9 fluorescence traces are nonnegative (minimum exactly 0, up to 7% of samples at 0)
    and smooth between transients, while the other cohorts' traces take negative values, and the Methods
    say CNMF-E was run without nonnegativity constraints. On these traces the Methods' z-score against
    a 3-s baseline is undefined or unbounded for most bouts (62% of bout-neuron pairs have a baseline
    s.d. under 5% of the session s.d.). Four mPFC sessions hold 44791 to 65535 frames at 10 Hz (75 to
    109 min) for 1-h sessions whose last lick is before 3900 s, two of them exactly 65535, the largest
    16-bit count.
- kind: other
  about: data
  statement: The alignment of fluorescence and licks could be shown (population response peaking within
    -2 to 5 s of the bout onsets and above the response at shifted onsets) for 40 of 53 cued-2BC sessions;
    for the other 13, listed in the imaging notebook's summary, there are few bouts or no peak near lag
    0.
- kind: other
  about: data
  statement: Neuron counts per group differ from the paper's in places. Isolated nonspecific neurons 56
    from 11 mice (paper 54 from 12), isolated female BLA-mPFC files 14 from 6 (paper 15 from 7), group-housed
    male BLA-mPFC rank 2 and 3 hold 7 and 17 neurons (paper 9 and 14). The BLA imaging N (10 and 11) includes
    two mice under the 50-lick exclusion rule of the Methods (44 and 49 alcohol licks).
- kind: methods_unavailable
  statement: Questions for the authors. (1) How was the matched number of bouts per condition chosen (Methods,
    Population-level mean response calculation), at random or the first bouts? The housing comparison
    of Fig. 5b and the proportions of Fig. 6l,m and Extended Data Fig. 8n reach p < 0.05 here only when
    the first bouts are taken. (2) Which group-housed male neurons form Figure 2c and Supplementary Table
    1? Fig. 2c and the male input resistance pass with all 37 deposited neurons and fail with the 21 of
    the 2022 cohort. (3) How were five decoding folds per animal formed when most mice have fewer than
    five water bouts longer than 1 s and 2 s apart? (4) Which BLA imaging cohort is projection-specific?
    (5) Are the deposited cohort 9 traces the ones analysed, and how were z-scores treated where the 3-s
    baseline is flat? Cohort 9 is left out of the z-scores here, and the clustering result of Fig. 3f
    holds only when it is kept with a floor on the baseline s.d. (6) How were spikes counted in Clampfit
    on plateaus near the threshold? Whether females fire more at most steps at -20 mV (Fig. 2e) depends
    on it.
