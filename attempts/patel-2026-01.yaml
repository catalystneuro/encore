- claim: ed5d-cue-response-modest
  outcome: not_reproduced
  notebook: imaging_patel_2026.ipynb
  output: claim:ed5d-cue-response-modest
  notes: 'Mean z over all 30 cues. Under the adopted reading (cohort 9 left out) neither population''s
    trace is transient: nonspecific BLA (cohort 10, 4 mice, 328 ROIs) peaks at 0.031 at 2.7 s and is at
    85% of its peak at 3 s (5-s baseline 0.045, 92%); BLA-mPFC (347 ROIs, 9 mice) peaks at 0.106 at 2.9
    s and is at 98% at 3 s (5-s baseline 0.118, 99%). Both peaks lie between 0 and 0.5, but the traces
    rise through the cue. With all mice the nonspecific trace is negative after the cue (-0.520 and -0.412),
    from the six cohort-9 mice (-0.87 to -0.29). With z against the session s.d. the BLA-mPFC trace falls
    back (-3% of its peak at 3 s) but the nonspecific trace does not (87%). No reading gives a transient
    increase in both populations. Under the first version''s reading of "falls back" (the trace at 3 s
    below its peak) the adopted z would pass both populations (0.026 < 0.031 and 0.103 < 0.106); the
    stricter reading is kept as both peaks fall at 2.7 to 2.9 s, at the end of the cue.'
  deviations:
  - The files do not say which BLA cohort expressed GCaMP in all BLA neurons and which only in BLA-mPFC
    projectors (the virus field is empty). Cohorts 9 and 10 (10 mice) are taken as nonspecific BLA and
    cohort 16 (11 mice) as BLA-mPFC, from the paper's N of 10 and 11 and the fewer ROIs per mouse in cohort
    16. This is an assumption.
  - Every CNMF-E ROI in the files is used (1113 nonspecific, 347 BLA-mPFC ROIs, against the paper's 540
    and 196 curated neurons), as the curation (Methods, Calcium imaging data acquisition and calcium signal
    extraction) is not in the dandiset.
  - Cohort 16 M2-1 and M3-4 hold the traces of M1-4 and M3-3 (identical arrays; the traces follow the
    licks of M1-4 and M3-3), so they are left out and BLA-mPFC has 9 mice, not 11.
  - The Methods' z-score (baseline s.d.) is used with cohort 9 left out, so nonspecific BLA is the 4 cohort-10
    mice. Cohort 9 traces are nonnegative and smooth between transients, so this z is undefined for 62%
    of their bout-neuron pairs under a floor of 5% of the session s.d., unbounded without the floor, and
    biased downward where defined (mean z after onset -0.86 against about 0 in the other cohorts). This
    is an assumption; the same z on all mice (the first version of this attempt) and a z against the session
    s.d. are shown as variants.
  - All 30 cues are used; the claim names no trial subset.
  - '''Falls back toward 0'' is read as the trace at 3 s being at most half its peak (a choice of this
    attempt; the first version read it as below the peak).'
  assumed: true
- claim: fig3f-blampfc-distinct-clusters
  outcome: not_reproduced
  notebook: imaging_patel_2026.ipynb
  output: claim:fig3f-blampfc-distinct-clusters
  notes: Under the adopted reading (cohort 9 left out, 675 ROIs) Ward clustering cut at the highest linkage
    giving a nonresponsive cluster yields 2 clusters under both spans, and population by cluster is not
    significant (chi-square(1) = 0.02, p = 0.88, for -3 to 5 s; 1.26, p = 0.26, for 0 to 3 s; enrichments
    at most 5.3% in size). Both clusters of that cut are nonresponsive (mean traces after onset -0.54
    to -0.18 and 0.14 to 1.42; -0.71 to -0.27 and 0.16 to 0.76), so the rule stops at the first cut and
    the test compares two nonresponsive clusters; it follows the Methods and the criterion but says little
    about the paper's functional clusters. With z against the session s.d. (1460 ROIs) p = 0.083 and 0.15. Only the same z on all
    mice (the first version) gives p = 1.9e-05 and 0.00082, and there 63 of the 66 nonspecific ROIs of
    the responsive cluster (41 of 43) are from cohort 9, whose z the floor biases. Under every reading
    the cut gives 2 clusters, not several.
  deviations:
  - The files do not say which BLA cohort expressed GCaMP in all BLA neurons and which only in BLA-mPFC
    projectors (the virus field is empty). Cohorts 9 and 10 (10 mice) are taken as nonspecific BLA and
    cohort 16 (11 mice) as BLA-mPFC, from the paper's N of 10 and 11 and the fewer ROIs per mouse in cohort
    16. This is an assumption.
  - Every CNMF-E ROI in the files is used (1113 nonspecific, 347 BLA-mPFC ROIs, against the paper's 540
    and 196 curated neurons), as the curation (Methods, Calcium imaging data acquisition and calcium signal
    extraction) is not in the dandiset.
  - Cohort 16 M2-1 and M3-4 hold the traces of M1-4 and M3-3 (identical arrays; the traces follow the
    licks of M1-4 and M3-3), so they are left out and BLA-mPFC has 9 mice, not 11.
  - The Methods' z-score (baseline s.d.) is used with cohort 9 left out, so nonspecific BLA is the 4 cohort-10
    mice. Cohort 9 traces are nonnegative and smooth between transients, so this z is undefined for 62%
    of their bout-neuron pairs under a floor of 5% of the session s.d., unbounded without the floor, and
    biased downward where defined (mean z after onset -0.86 against about 0 in the other cohorts). This
    is an assumption; the same z on all mice (the first version of this attempt) and a z against the session
    s.d. are shown as variants.
  - Mean alcohol traces use alcohol and water bouts matched per session at random (M3 reading a); ROIs
    with no isolated alcohol bout are left out.
  - The chi-square treats the ROIs of 19 mice as independent units, as the criterion gives.
  assumed: true
