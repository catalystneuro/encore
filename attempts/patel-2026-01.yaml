- claim: ed2e-nonspecific-bla-excitability
  outcome: reproduced
  notebook: ephys_patel_2026.ipynb
  output: claim:ed2e-nonspecific-bla-excitability
  notes: 50 group-housed (11 mice) against 56 isolated nonspecific neurons (11 mice), as in the paper
    (50 and 54). Current by housing interaction F(25, 2600) = 1.66, p = 0.021 (0 mV) and 1.99, p = 0.0024
    (-20 mV); isolated neurons fire more at 17 and 19 of 26 steps, by 0.42 spikes on average and at most
    1.27 and 1.31 (240 pA); no step is Sidak significant. Beside fig2c the F is smaller (4.70 and 4.83)
    and the largest difference smaller (2.63 spikes). With the 5 mV re-arm the -20 mV interaction has
    p = 0.0057; without a re-arm p = 0.07, a count that includes noise on plateaus at -20 mV.
  deviations:
