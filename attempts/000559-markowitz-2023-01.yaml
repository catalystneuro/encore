- claim: fig3f-cumulative-counts
  outcome: reproduced
  notebook: reproduce_markowitz_2023.ipynb
  output: claim:fig3f-cumulative-counts
  measured: 182
  notes: Change in target counts, Opto-DA median 27.6, control -2.3; U = 182, one-sided P = 0.0083,
