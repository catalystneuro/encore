findings:
- kind: metadata_insufficient
  statement: The closed-loop files mark stimulation onsets but not catch trials (target detections on
    which stimulation was withheld); the conversion kept only the stimulated detections. Comparisons
    of stimulation with catch trials (Fig. 3i, 3l, 3m, 4f) cannot be made, and a substitute selection
    shows stimulation-catch differences in 9 of 12 no-opsin controls.
- kind: metadata_insufficient
  statement: No file states the genotype or opsin of a mouse. Opto-DA (Ai32) and no-opsin control mice
    are told apart only by the stimulation site ("snc (axon)" or "ctrl"), and the dLight+ChrimsonR
    mice only by their subject names.
- kind: metadata_insufficient
  statement: Session type (baseline, stimulation, post) and session number are not stored; they must be
    inferred from free-text descriptions, dates and stimulation pulses. Five files with stimulation
    are described as recording sessions.
- kind: metadata_error
  statement: Every closed-loop file states a 635-nm stimulator (Opto Engine MRL-III-635), including the
    Ai32 (ChR2) mice, which the Methods say were stimulated with 470-nm light.
- kind: metadata_error
  statement: The dLight-only mice (C57BL/6J in the Methods) carry the subject description "wild-type
    DAT-IRES-Cre and Ai32 mice", the same as the optogenetic mice.
- kind: format_error
  statement: In 28 photometry and 547 closed-loop files the syllable timestamps are not ascending; the
    rows are rotated, with one backward jump of about a session length. Sorting by timestamp restores
    a regular 30-Hz clock.
- kind: data_missing
  statement: 14 files of dLight+ChrimsonR mice hold empty syllable series; all list two target
    syllables.
- kind: data_missing
  statement: For the dLight+ChrimsonR mice only the 250-ms closed-loop sessions are present; the 2-s and
    pulsed sessions the Methods describe are not. The dandiset holds 224 DLS photometry files without
    stimulation (194 passing the quality criteria), where the Methods give 379 experiments.
- kind: data_missing
  statement: The food-reward sessions and the consumption times of Fig. 2a are not in the dandiset.
- kind: selection_undocumented
  statement: The dandiset includes behaviour-only files for photometry sessions without a dLight series
    (111 files, among them all files of dls-dlight-6, dls-dlight-8, dms-dlight-7 and dms-dlight-9) and
    sessions that fail the paper's quality criteria (16 DLS and 11 DMS), with no flag saying which
    were excluded from the paper.
- kind: other
  statement: The re-referenced, z-scored dLight trace used by every photometry analysis is not stored;
    it must be recomputed from the stored dF/F and smoothed reference, whose regression fit is not
    stored either.
