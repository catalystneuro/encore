entry: 000004-chandravadia-2020
provenance:
  kind: agent
  accountable:
    name: CatalystNeuro
  agent:
    harness: Claude Code (GitHub Actions)
    model: claude-opus-5-5
    protocol: pilot-6
inputs:
- what: Online-only Table 1 of the paper (subject, sessions, variants, age, sex, diagnosis), copied
    into the helper module as text and used only to compare with the files' subject metadata.
  source: doi:10.1038/s41597-020-0415-9
- what: The per-site percentages of Figure 5f as written into plotFigure5.ipynb, used as expected
    values of fig5f-site-proportions; and the analysis choices of the paper's code (windows, trial
    selection, bootstrap, ROC measures, confidence split), followed where the Methods leave them open.
  source: https://github.com/rutishauserlab/recogmem-release-NWB at commit
    1d95162d2672e71dd234a31e4b8d70017a289ee3
outcomes:
- claim: counts-neurons-subjects
  outcome: reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:counts-neurons-subjects
  measured:
  - 1864
  - 59
  notes: 1864 unit rows over 87 files (paper 1863, one more) and 59 subjects. With the 55 units of
    sessions 44 and 55 counted once, as their spike trains repeat those of sessions 43 and 54, 1809.
    Both readings are within tolerance. CS sessions hold 1787 units and TWH sessions 77.
  deviations:
  - The exact count differs from the paper's by one unit; the tolerance is the protocol's 10%.
- claim: counts-sessions
  outcome: reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:counts-sessions
  measured: 87
  notes: The 87 (subject, session) pairs of the files equal those of Online-only Table 1, none
    missing and none extra. The Methods' 89 sessions disagree with the table and the files. Every
    task variant of the table corresponds to one stimulus set in the files.
- claim: table1-demographics
  outcome: partially_reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:table1-demographics
  measured:
  - 26
  - 33
  notes: Age and sex match for 56 of 59 subjects. C24 is 57 in the files and 47 in the table, H33 is
    30 and 29, and H48 is female aged 32 in the files and male aged 54 in the table. The files have
    26 female and 33 male subjects (table 25 and 34), within tolerance. Each subject has one age and
    one sex across its files. The files code the diagnosis more coarsely; for C61 it differs in
    substance (Left Lateral Frontal in the files, Left Mesial Temporal in the table). The files agree
    with the session list of the paper's code, defineNOsessions_release.ini (read, not shown in the
    notebook).
- claim: task-structure
  outcome: partially_reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:task-structure
  notes: All 87 sessions have 100 recognition trials with 50 per label, 5 categories (ids and names)
    and one stored image per trial timestamped at its onset. 79 sessions have 100 encoding trials
    with 100 distinct images; sessions 18, 20, 21, 23, 26, 27 and 44 have 50 and session 123 has 97.
    The images are stored as one ImageSeries per file, not as stimuli_learn_x and stimuli_recog_x.
- claim: new-old-label-coding
  outcome: not_reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:new-old-label-coding
  notes: The labels are coded the other way. In 79 of 87 sessions every label-1 image and no label-0
    image was shown during encoding; in no session do label-0 images match the encoding block.
    Label 1 draws "old" responses (4 to 6) more often than label 0 in 86 of 87 sessions (medians 0.70
    and 0.24, sign test p = 1.1e-24). In the 8 sessions with short encoding blocks, 52% to 98% of the
    label-1 images are among the stored encoding trials and no label-0 image is. The paper's code
    reads 1 as old, and every analysis here does the same; with the stated coding the mean AUC is
    0.247.
- claim: ttl-codes
  outcome: partially_reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:ttl-codes
  notes: Events and experiment_ids have the same length and timestamps in all 87 files, and 17019 of
    17047 trials show the codes 1, 2, 3, a response and 6 in order. 78 files meet every condition.
    Codes not in Table 1 occur in sessions 43 (98, 99), 58 (23), 93 (99), 123 (0), 127 (0), 128 (4),
    2001 (22, 23), 2002 (23) and 2003 (23). Seven files have no start code 55 and one has a third
    end code 66. In 6 files 1 to 18 trials have a response event that differs from the trials
    table's response_value; the analysis uses response_value.
  deviations:
  - The criterion did not give a number for most files in a partial result; 78 of 87 was taken as
    most.
- claim: experiment-ids
  outcome: partially_reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:experiment-ids
  notes: 83 of 87 files use the ids of Table 2. Session 55 uses 80 and 82, session 77 uses 81 and 82,
    and sessions 100 and 105 use 82 and 83 (learning and recognition, identified by their
    responses). The files' data_collection field states the same ids.
- claim: session-dates
  outcome: partially_reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:session-dates
  notes: 86 of 87 files start on the first of a month; session 48 starts on 2010-03-13. Session 68 is
    dated 2000-01-01, outside the 2006 to 2019 span of the others.
- claim: units-table
  outcome: partially_reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:units-table
  measured: 98400
  notes: All 87 files hold every column (IsolDist is named IsolationDist) and link each unit to one
    electrode. The stated waveform sampling rate is 98400 Hz, within tolerance of 100 kHz, with 256
    samples. SNR is finite for 1778 of 1864 units (11 infinite, 75 NaN); the isolation distance is
    NaN for 493 units and above 1e4 for 4 (up to 8.08e+32). Spike times are not in increasing order
    for 13 units in sessions 21, 58, 68, 70, 73, 77 and 128, and units 35 and 37 of session 58 hold
    every spike time twice.
- claim: electrodes-table
  outcome: not_reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:electrodes-table
  notes: Location, filtering (300-3000Hz for all) and origChannel are filled for all 887 electrodes.
    The impedance column is empty for all 887. Coordinates are missing for 99 electrodes in sessions
    7, 20, 21, 23, 24, 50, 52 and 2004; where given, the sign of x matches the hemisphere of the
    location for all 788.
- claim: isi-criterion
  outcome: partially_reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:isi-criterion
  notes: 1858 of 1864 units (99.7%) have fewer than 3% of interspike intervals below 3 ms (median
    0.19%). Six units are at or above 3%, four at or above 5% and two above 20% (maximum 50.1%); the
    two above 20% are the session 58 units whose spike times repeat. With the spike times as stored,
    1860 units pass. All 77 TWH units pass.
- claim: fig5a-mtl-locations
  outcome: reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:fig5a-mtl-locations
  notes: All 1864 units are on electrodes in the right amygdala (594), left amygdala (498), right
    hippocampus (407) or left hippocampus (365).
- claim: fig5c-auc-all
  outcome: reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:fig5c-auc-all
  measured:
  - 0.753
  - 0.094
  notes: Mean AUC 0.753, SD 0.094 over 87 sessions (range 0.445 to 0.919; 6 sessions below 0.6, one at
    or below 0.5). Against chance (0.5), t = 25.1, p = 2.2e-41. With sessions 44 and 55 dropped, 0.754
    and 0.095.
  deviations:
  - The tolerance of the mean is the stated spread (0.10), as the protocol prescribes; the spread
    itself was held to 10%.
- claim: fig5c-auc-sites
  outcome: reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:fig5c-auc-sites
  measured:
  - 0.760
  - 0.688
  - 0.085
  - 0.138
  notes: CS 0.760 ± 0.085 over 78 sessions and TWH 0.688 ± 0.138 over 9, all within tolerance. Welch's
    t-test between sites p = 0.161 (difference 0.072).
- claim: fig5b-roc-asymmetric
  outcome: reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:fig5b-roc-asymmetric
  notes: z-ROC slope mean 0.726, median 0.775, SD 0.379 over 87 sessions; below 1 in 70. One-sample
    t-test against 1, t = -6.75, p = 1.6e-09; Wilcoxon p = 1.6e-09. The pooled ROC has slope 0.816.
  deviations:
  - The paper names no measure or test for asymmetry; the z-ROC slope of the paper's code and a
    t-test against 1 were fixed in the criterion.
- claim: fig5d-confidence-accuracy
  outcome: reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:fig5d-confidence-accuracy
  notes: Fixed split, high 80.1% against low 60.9% over 84 sessions, high above low in 73, paired
    t-test p = 3.2e-16. Dynamic split, 78.3% against 60.4%, paired p = 1.2e-13. Sessions 93, 99 and
    2008 have no responses in one group and are left out. The unpaired test of the code gives p =
    3.4e-17 and 1.3e-15.
  deviations:
  - Three sessions without responses in one confidence group are left out; the paper says all
    sessions.
- claim: vs-cells-proportion
  outcome: reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:vs-cells-proportion
  measured:
  - 332
  - 17.8
  notes: Methods' window (200 to 1200 ms), 332 of 1864 units (17.8%), within tolerance. The code's
    window (200 to 1700 ms) gives 343 of 1864 (18.4%), the paper's count. Counting duplicated spike
    trains once, 326 of 1809 (18.0%). Shuffled categories give 4.5%. At p < 0.01, 8.6%; at p < 0.1,
    25.6%. Among sessions with at least 20 units, 0.0% to 35.7%.
  deviations:
  - The main result uses the Methods' 1 s window; the paper's code uses 1.5 s, shown as a variant.
- claim: ms-cells-proportion
  outcome: not_reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:ms-cells-proportion
  measured:
  - 110
  - 5.9
  notes: The Methods' test (all 50 new and 50 old trials, 200 to 1200 ms) selects 110 of 1864 units
    (5.9%), against 5.3% with shuffled labels and the paper's 146 (7.8%). Correct trials only in the
    Methods' window give 143 (7.7%), and the code's choices (correct trials only, 200 to 1700 ms)
    147 (7.9%), both within tolerance. All trials in the code's window give 108 (5.8%). The paper's
    number therefore follows its code's restriction to correct trials, which the Methods do not
    mention. The outcome is judged on the Methods' procedure, as the protocol requires.
  deviations:
  - The paper's code restricts the test to correct trials and uses a 1.5 s window; the Methods
    describe all 50 and 50 trials and a 1 s window. The Methods give the main result.
  - The bootstrap uses the code's algorithm with a fixed seed.
- claim: dual-cells-proportion
  outcome: not_reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:dual-cells-proportion
  measured:
  - 12
  - 0.6
  notes: Under the Methods' tests 12 of 1864 units (0.6%) are both VS and MS, against 19.6 expected if
    the two were independent and the paper's 26 (1.4%). The code's choices give 26 (1.4%). Counting
    duplicated spike trains once, 11 of 1809.
  deviations:
  - Depends on ms-cells-proportion, whose main test follows the Methods and not the code.
- claim: fig5f-site-proportions
  outcome: partially_reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:fig5f-site-proportions
  measured:
  - 17.6
  - 5.8
  - 0.7
  - 22.1
  - 9.1
  - 0.0
  notes: Fisher's exact test finds no difference between sites (VS p = 0.360, MS p = 0.215, dual p =
    1.000). Under the Methods' tests CS has 17.6%, 5.8% and 0.7% and TWH 22.1%, 9.1% and 0.0%; only CS
    VS is within tolerance. The code's choices give CS 18.4%, 7.8% and 1.4% (328, 139 and 25 of 1787)
    and TWH 19.5%, 10.4% and 1.3% (15, 8 and 1 of 77), matching Figure 5f to within 0.1 point.
  deviations:
  - The paper names no test for "comparable"; Fisher's exact test was fixed in the criterion.
  - The expected values come from plotFigure5.ipynb, which writes them into the plot as constants.
- claim: twh-sessions
  outcome: reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:twh-sessions
  measured: 9
  notes: Sessions 2001, 2002, 2003, 2004, 2005, 2007, 2008, 2009 and 2011, from 8 subjects, with 77
    units; all name Toronto Western Hospital as institution.
- claim: fig4-example-vs-neuron
  outcome: reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:fig4-example-vs-neuron
  notes: Session 132 has one unit on channel 177, at electrode row 4 in the right amygdala, which
    matches the label 132-177-4-RA (the code's cell number is the electrode row). ANOVA across
    categories p = 1.2e-22 (Methods' window) and 7.9e-19 (code's window); mean rate 6.75 Hz for
    animals against 0.25 to 0.85 Hz for the other four categories.
- claim: previous-release-additions
  outcome: blocked
  blocked_by: other
  notes: Testing needs to know which sessions were in the earlier release (Faraut et al. 2018, Dryad
    doi:10.5061/dryad.46st5). The dandiset does not mark them, and the Dryad archive, which is public,
    refuses automated download (HTTP 403 on the file stream, and its API asks for a bearer token), so
    a notebook cannot fetch its session list. The 9 TWH sessions of the 23 new ones are tested under
    twh-sessions.
- claim: fig3-example-vs-neuron
  outcome: blocked
  blocked_by: data_missing
  notes: The neuron's session id, 144, is not among the dandiset's 87 sessions, nor in Online-only
    Table 1 or in the session list of the paper's code (read, not shown in the notebook). Whether the label is a typo or the session was left out
    cannot be told from the paper or the archive.
findings:
- kind: metadata_error
  statement: The new_old_labels_recog column is described in every file, and in the paper, as 0 for
    old and 1 for new stimuli. The data have 1 for old; label-1 images are those shown during
    encoding and draw most "old" responses. The paper's code reads it correctly, but a user
    following the description gets an AUC of 0.25.
- kind: other
  statement: Sessions 43 and 44 (subject H23) and sessions 54 and 55 (subject H42) hold identical
    spike trains for every unit, 23 and 32 units. In each pair the units are the same neurons, so 55
    of the 1864 units are repeats and the paper's neuron count includes them twice. Session 55 also
    repeats session 54's learning block trial for trial and differs only in its recognition block.
- kind: data_missing
  statement: Seven sessions (18, 20, 21, 23, 26, 27, 44) have 50 encoding trials and session 123 has
    97, where the paper describes 100. Only 52% to 98% of the images later shown as old are in the
    stored encoding blocks of these sessions.
- kind: metadata_insufficient
  statement: Electrode impedance is empty for all 887 electrodes, though the paper lists it in the
    electrodes table. MNI coordinates are missing for 99 electrodes in 8 sessions.
- kind: metadata_insufficient
  statement: The isolation distance is NaN for 493 of 1864 units and implausibly large for 4 (up to
    8.08e+32), and SNR is NaN for 75 units and infinite for 11.
- kind: format_error
  statement: The spike times of 13 units in 7 sessions (21, 58, 68, 70, 73, 77, 128) are not in
    increasing order, and units 35 and 37 of session 58 hold every spike time twice, which doubles
    their firing rates and puts half their interspike intervals at zero.
- kind: metadata_error
  statement: Age or sex differ from the paper's Online-only Table 1 for three subjects (C24 57 against
    47, H33 30 against 29, H48 female 32 against male 54). The files follow the code's session list,
    so the table or the files are wrong for these subjects.
- kind: metadata_error
  statement: Session 48 keeps the day of the experiment (2010-03-13) in session_start_time, where the
    paper says every day was set to the first of the month to protect patient information. Session
    68 is dated 2000-01-01.
- kind: metadata_error
  statement: Experiment ids outside Table 2 are used in four files (sessions 55, 77, 100, 105), and
    event codes outside Table 1 (0, 4, 22, 23, 98, 99) occur in nine files. In six files 1 to 18
    trials have a response event that differs from the trials table's response_value.
- kind: paper_inconsistency
  statement: The Methods state 89 sessions; Online-only Table 1 and the dandiset have 87. The paper
    gives 1863 neurons; the dandiset has 1864 unit rows.
- kind: code_mismatch
  statement: The Methods select memory selective cells by comparing all 50 novel and 50 familiar
    trials in a 1 s window. The paper's code uses correct trials only and a 200 to 1700 ms window for
    both selections. The paper's counts (343 VS, 146 MS, 26 dual) and Figure 5f follow the code; the
    Methods' procedure gives 332, 110 and 12.
- kind: code_mismatch
  statement: plotFigure5.ipynb, the notebook the code provides to reproduce Figure 5, writes the
    per-site percentages of Figure 5f into the plot as constants and does not compute them.
- kind: data_missing
  statement: The example neuron of Figure 3 is labelled as from session 144, which is not in the
    dandiset or in the paper's session list.
- kind: other
  statement: The institution is written "Hunigton Memorial Hospital" in 28 files and "Hunington
    Memorial Hospital" in 6, and the device as "Neuralynx-cheetah" and "Neuralynx-Cheetah".
