- claim: fig5b-roc-asymmetric
  outcome: reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:fig5b-roc-asymmetric
  measured: 0.792
  notes: Six sessions (59, 60, 93, 99, 119, 2008) have all five interior z(FA) or z(H) points equal,
    so their fitted slope is not an estimate (negative in four, 0 in one); they are left out. Over
    the other 81 sessions the z-ROC slope has mean 0.792, median 0.795, SD 0.289, and is below 1 in
    64. One-sample t-test against 1, t = -6.49, p = 6.6e-09; Wilcoxon W = 487, p = 3.3e-08. With all
    87 sessions, mean 0.726, below 1 in 70, t-test p = 1.631e-09, Wilcoxon p = 1.586e-09. The pooled
    ROC has slope 0.816. Per-session AUC and slopes are printed.
  deviations:
  - The paper names no measure or test for asymmetry; the z-ROC slope of the paper's code and a
    t-test against 1 were fixed in the criterion.
  - Sessions whose interior z-ROC points do not allow a fit are left out of the mean and the tests,
    after the second verification round; all 87 sessions are a variant.
- claim: fig5d-confidence-accuracy
  outcome: reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:fig5d-confidence-accuracy
  notes: Fixed split, high 80.1% against low 60.9% over 84 sessions, high above low in 73, paired
    t-test p = 3.2e-16. Dynamic split, 78.3% against 60.4%, paired p = 1.2e-13. Sessions 93, 99 and
    2008 have no responses in one group and are left out. The unpaired test of the code gives p =
    3.4e-17 and 1.3e-15.
  deviations:
  - Three sessions without responses in one confidence group are left out; the paper says all
    sessions.
- claim: vs-cells-proportion
  outcome: reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:vs-cells-proportion
  measured:
  - 332
  - 17.8
  notes: Methods' window (200 to 1200 ms), 332 of 1864 units (17.8%), within tolerance. The code's
    window (200 to 1700 ms) gives 343 of 1864 (18.4%), the paper's count. Counting duplicated spike
    trains once, 326 of 1809 (18.0%). Shuffled categories give 4.7% (10 shuffles per unit). At p < 0.01, 8.6%; at p < 0.1,
    25.6%. Among sessions with at least 20 units, 0.0% to 35.7%.
  deviations:
  - The main result uses the Methods' 1 s window; the paper's code uses 1.5 s, shown as a variant.
- claim: ms-cells-proportion
  outcome: not_reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:ms-cells-proportion
  measured:
  - 110
  - 5.9
  notes: The Methods' test (all 50 new and 50 old trials, 200 to 1200 ms) selects 110 of 1864 units
    (5.9%), against the paper's 146 (7.8%). With labels shuffled (10 per unit, 18640 tests) 5.39% are
    selected (95% CI 5.07% to 5.73%); 110 is not distinguishable from this null (one-sided binomial
    p = 0.18) and only just above 5% (p = 0.044). A second bootstrap seed gives 118 (6.3%), also
    outside tolerance; 22 units are selected under one seed only. Correct trials only in the
    Methods' window give 143 and 140 under the two seeds, and the code's choices (correct trials
    only, 200 to 1700 ms) 147 and 149, all within tolerance (147 against 5%, p = 7.1e-08). With
    labels shuffled among the correct trials in the code's window the null is 5.58% (95% CI 5.26%
    to 5.92%), and 147 exceeds it (104.1 expected, one-sided binomial p = 2.5e-05). All
    trials in the code's window give 108 and 109. The paper's number therefore follows its code's
    restriction to correct trials, which the Methods do not mention, and the outcome comes from that
    disagreement, not from the data. It is judged on the Methods' procedure, as the protocol
    requires. Per-unit p-values of the 288 units selected under some reading or seed are printed.
  deviations:
  - The paper's code restricts the test to correct trials and uses a 1.5 s window; the Methods
    describe all 50 and 50 trials and a 1 s window. The Methods give the main result.
  - The bootstrap uses the code's algorithm with a fixed seed.
- claim: dual-cells-proportion
  outcome: not_reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:dual-cells-proportion
  measured:
  - 12
  - 0.6
  notes: Under the Methods' tests 12 of 1864 units (0.6%) are both VS and MS, against 19.6 expected if
    the two were independent and the paper's 26 (1.4%); 14 with the second bootstrap seed. The
    code's choices give 26 (1.4%) under both seeds. Counting duplicated spike trains once, 11 of
    1809. As for ms-cells-proportion, the outcome comes from the Methods disagreeing with the code.
  deviations:
  - Depends on ms-cells-proportion, whose main test follows the Methods and not the code.
- claim: fig5f-site-proportions
  outcome: partially_reproduced
  notebook: reproduce_chandravadia_2020.ipynb
  output: claim:fig5f-site-proportions
  measured:
  - 17.6
  - 5.8
  - 0.7
  - 22.1
  - 9.1
  - 0.0
  notes: Fisher's exact test finds no difference between sites (VS p = 0.360, MS p = 0.215, dual p =
    1.000). Under the Methods' tests CS has 17.6%, 5.8% and 0.7% and TWH 22.1%, 9.1% and 0.0%; only CS
    VS is within tolerance. The code's choices give CS 18.4%, 7.8% and 1.4% (328, 139 and 25 of 1787)
    and TWH 19.5%, 10.4% and 1.3% (15, 8 and 1 of 77), matching Figure 5f to within 0.1 point, so the
    partial outcome comes from the Methods disagreeing with the code. With 77 TWH units the 95%
    intervals of the TWH percentages are 13.4% to 33.0% (VS), 3.7% to 17.8% (MS) and 0.0% to 4.7%
    (dual), so the Fisher tests have little power.
  deviations:
  - The paper names no test for "comparable"; Fisher's exact test was fixed in the criterion.
  - The expected values come from plotFigure5.ipynb, which writes them into the plot as constants.
