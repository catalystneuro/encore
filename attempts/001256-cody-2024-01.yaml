- claim: fig1f-tone-response-inverse-u
  outcome: reproduced
  notebook: reproduce_cody_2024.ipynb
  output: claim:fig1f-tone-response-inverse-u
  measured: 318
  notes: Under the main reading (SD over time, responsive in both contrasts, peak window 2-2.8 s, maximum
    of the averaged trace) 318 cells are tone-responsive, within 295 plus or minus 29.5; the other inclusion
    readings give 339, 215 and 241. Peak responses differ across the seven bins (Kruskal-Wallis H = 35.69,
    p = 3.2e-06), largest in the 32-43% bin (15.15% dF/F) against 8.12 in the lowest and 13.08 in the
    highest. All 32 readings give p from 2.2e-07 to 1.4e-04 and the same top bin. The bins are not independent
    of mouse; the lowest bin holds cells of three mice. No trial is below 10% of animal max, so the two
    bin-1 readings are the same.
  deviations:
  - Group A is the ten mice the files label pupilPTinContrast (four F, six M, one ZnT3-WT), where the
    paper gives eight C57BL6/J mice (four F, four M); CTRL trials of the CGC assay are used.
  - Pupil cleaning (assumption). The files hold the pupil radius with dropped frames and tracking failures
    (up to 1.5e6 pixels); the Methods' single pass (6 SD outliers of the first derivative) leaves these
    in, so a Hampel spike filter was added, the derivative step repeated, and trials with more than half
    their frames missing dropped. This sets each animal's maximum PD, hence baseline PD in % of maximum
    and the 50% selection. The single pass is shown as a variant in the notebook.
  - The FRA-mapping reading of cell inclusion cannot be run; mapping trials are in 5 of 30 files and one
    group A mouse.
  - Peak and response windows are half-open frame windows at 5 Hz, frames timed from the trial's first
    frame minus stimDelay (Methods, 2PCI processing and analysis).
  assumed: true
