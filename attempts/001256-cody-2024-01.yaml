- claim: fig3b-lme-coefficients
  outcome: reproduced
  notebook: reproduce_cody_2024.ipynb
  output: claim:fig3b-lme-coefficients
  notes: In all eight fits (cells responsive in both contrasts or all tone-responsive; all trials or below
    50%; two peak windows) the baseline PD coefficient is significant (b = -0.102 to -0.179% dF/F per
    % of max, p = 9.7e-05 to 0.0074), while evoked PD at 1-2 s (p = 0.13 to 0.29) and its interaction
    with contrast (p = 0.55 to 0.98) are not. The paper does not give the sign of the baseline coefficient.
  deviations:
  - Group A is the ten mice the files label pupilPTinContrast (four F, six M, one ZnT3-WT), where the
    paper gives eight C57BL6/J mice (four F, four M); CTRL trials of the CGC assay are used.
  - Pupil cleaning (assumption). The files hold the pupil radius with dropped frames and tracking failures
    (up to 1.5e6 pixels); the Methods' single pass (6 SD outliers of the first derivative) leaves these
    in, so a Hampel spike filter was added, the derivative step repeated, and trials with more than half
    their frames missing dropped. This sets each animal's maximum PD, hence baseline PD in % of maximum
    and the 50% selection. The single pass is shown as a variant in the notebook.
  - Fixed effects tested with Wald z tests from statsmodels MixedLM (REML), not Satterthwaite F tests
    from fitlme or lmer; with thousands of denominator df the p-values agree closely.
  - The random intercepts (1 | baseline_PD) and (1 | pupil_at_1-2s) group rows by per-trial values, so
    both are one random intercept per trial; they are fitted as a single trial intercept nested in subject,
    by maximum likelihood.
  assumed: true
