- claim: fig1f-tone-response-inverse-u
  outcome: reproduced
  notebook: reproduce_cody_2024.ipynb
  output: claim:fig1f-tone-response-inverse-u
  measured: 318
  notes: Under the main reading (SD over time, responsive in both contrasts, peak window 2-2.8 s, maximum
    of the averaged trace) 318 cells are tone-responsive, within 295 plus or minus 29.5; the other inclusion
    readings give 339, 215 and 241. Peak responses differ across the seven bins (Kruskal-Wallis H = 51.83,
    p = 2.0e-09), largest in the 21-32% bin (15.88% dF/F) against 8.12 in the lowest and 13.08 in the
    highest. All 32 readings give p from 1.0e-10 to 7.3e-08 and the same top bin. Under the other cleanings
    and without the ZnT3-WT mouse AA0335 the main reading gives p = 2.8e-10 to 3.2e-06 with an interior
    top bin. The bins are not independent of mouse; the lowest bin holds cells of three mice. No trial
    is below 10% of animal max, so the two bin-1 readings are the same.
  deviations:
  - Group A is the ten mice the files label pupilPTinContrast (four F, six M, one ZnT3-WT), where the
    paper gives eight C57BL6/J mice (four F, four M); CTRL trials of the CGC assay are used. Keeping the
    ZnT3-WT mouse AA0335, as the label does, is an assumption; the fig2b-evoked-pd-whole-drc and fig3b-lme-coefficients
    outcomes rest on it, and group A without AA0335 is a variant in the notebook.
  - Pupil cleaning (assumption). The files hold the pupil radius with dropped frames and tracking failures
    (up to 1.5e6 pixels); the Methods' single pass (6 SD outliers of the first derivative) leaves these
    in, so a Hampel spike filter was added, the derivative step repeated, trials with more than half their
    frames missing dropped, and trials whose raw trace steps by more than a factor 2 between tracked frames
    dropped (118 of 2113 trials; a pupil does not double or halve its radius in 100 ms). The last step
    was added after the first verification round, because runs of tracking failures in AA0319 and AA0334
    set their maxima. This sets each animal's maximum PD, hence baseline PD in % of maximum and the 50%
    selection. The rule reads the raw trace, before the spike filter, so it drops trials in 15 mice, not
    only AA0319 and AA0334, including trials whose only fault is a spike the filter removes; counted after
    the spike filter it drops 39 trials in 6 mice and gives the same animal maxima. The round-1 cleaning,
    the single pass and the narrower step rule are shown as variants in the notebook.
  - The FRA-mapping reading of cell inclusion cannot be run; mapping trials are in 7 of 30 files and one
    group A mouse.
  - Peak and response windows are half-open frame windows at 5 Hz, frames timed from the trial's first
    frame minus stimDelay (Methods, 2PCI processing and analysis).
  assumed: true
