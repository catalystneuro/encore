- kind: data_missing
  statement: The widefield imaging of Figure 5 (three mice with a cannula in the left auditory cortex,
    before and after contralateral and ipsilateral ZX1, with red-channel images) is not in the dandiset,
    so the three Figure 5 claims cannot be tested.
- kind: other
  statement: The pupil radius series hold tracking failures, single frames and runs at 3 to 1e6 times
    the pupil size, often next to dropped frames (68 trials have a maximum above three times their median;
    118 trials step by more than a factor 2 between consecutive tracked frames). In AA0319 and AA0334
    the failures also come as runs at a second level (130 to 160 against a pupil of about 25) that a spike
    filter does not remove. The DeepLabCut points and likelihoods that the Methods use to drop frames
    are not deposited, and the Methods' single derivative pass does not remove these failures, so each
    animal's maximum PD, and every baseline in % of maximum, depends on how they are cleaned.
- kind: metadata_error
  statement: Every pupil_radius series's description names one TwoPhotonSeries (the file's last, for example
    TwoPhotonSeries_036), not its own; the series can be matched to its trial only through the .tif file
    named in its comments.
- kind: metadata_error
  statement: 25 pupil series attached to DRC trials have the length of a mapping trial (1430 samples)
    or an LED trial (300 samples) in place of twice the trial's 170 frames, in seven files.
- kind: format_error
  statement: In the stimulus table, starting_time is wrong by 24 h for 84 trials in seven files (AA0318,
    AA0319, AA0320, AA0322, AA0327, AA0330, AA0333). Trials recorded before the reference .tif have starting
    times near 86400 s, where the .tif creation times show they came minutes earlier. The pupil and fluorescence
    series take the same starting times.
- kind: other
  statement: The DRCs without a tone in the files (pulseSets PC_contrastChange) are 10 s of one contrast
    followed by 10 s of the other. The paper describes the sound-evoked pupil stimuli as low- or high-contrast
    DRCs and does not mention the switch.
- kind: selection_undocumented
