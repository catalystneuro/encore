- claim: fig4c-wt-contrast-zx1-effects
  outcome: not_reproduced
  notebook: reproduce_cody_2024.ipynb
  output: claim:fig4c-wt-contrast-zx1-effects
  notes: 361 ZnT3-WT trials below 50% (7581 rows; the paper's denominator df are about 7920). Across the
    four model and coding readings, the contrast intercept is significant under reference coding only
    (p = 0.017; sum coding p = 0.057), the contrast slope under one reading (p = 0.036), the ZX1 intercept
    under none (p >= 0.47), the ZX1 slope under all (p <= 0.0033), and the contrast by ZX1 interaction
    under none (z = -1.15, p = 0.25). At most three of five terms, never the interaction, so no reading
    meets the full or partial criterion. Mean traces at 2 s, CTRL HIGH 111.9 against LOW 109.1%; ZX1 HIGH
    107.5 against LOW 108.4%.
  deviations:
  - Pupil cleaning (assumption). The files hold the pupil radius with dropped frames and tracking failures
    (up to 1.5e6 pixels); the Methods' single pass (6 SD outliers of the first derivative) leaves these
    in, so a Hampel spike filter was added, the derivative step repeated, and trials with more than half
    their frames missing dropped. This sets each animal's maximum PD, hence baseline PD in % of maximum
    and the 50% selection. The single pass is shown as a variant in the notebook.
  - Contrast of a DRC trial without the tone is that of its first 10 s; the files' DRCs switch contrast
    after 10 s (50-60 to 40-70 dB or the reverse), which the paper does not describe. The analysed 0 to
    2 s lie in the first block.
  - Fixed effects tested with Wald z tests from statsmodels MixedLM (REML), not Satterthwaite F tests
    from fitlme or lmer; with thousands of denominator df the p-values agree closely.
  - Group C is the ten mice labelled pupil_contrast_ZnT3WT (five F, five M); the paper gives six F and
    four M.
  - Orthogonal polynomials with unit-norm columns over the 21 samples from 0 to 2 s (R poly()), as the
    claims file says.
  assumed: true
