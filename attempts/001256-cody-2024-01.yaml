findings:
- kind: data_missing
  statement: The widefield imaging of Figure 5 (three mice with a cannula in the left auditory cortex,
    before and after contralateral and ipsilateral ZX1, with red-channel images) is not in the dandiset,
    so the three Figure 5 claims cannot be tested.
- kind: other
  statement: The pupil radius series hold tracking failures, single frames and runs at 3 to 1e6 times
    the pupil size, often next to dropped frames (68 trials have a maximum above three times their median).
    The DeepLabCut points and likelihoods that the Methods use to drop frames are not deposited, and the
    Methods' single derivative pass does not remove these failures, so each animal's maximum PD, and every
    baseline in % of maximum, depends on how they are cleaned.
- kind: metadata_error
  statement: Every pupil_radius series's description names one TwoPhotonSeries (the file's last, for example
    TwoPhotonSeries_036), not its own; the series can be matched to its trial only through the .tif file
    named in its comments.
- kind: metadata_error
  statement: 25 pupil series attached to DRC trials have the length of a mapping trial (1430 samples)
    or an LED trial (300 samples) in place of twice the trial's 170 frames, in seven files.
- kind: format_error
  statement: In the stimulus table, starting_time is wrong by 24 h for 84 trials in seven files (AA0318,
    AA0319, AA0320, AA0322, AA0327, AA0330, AA0333). Trials recorded before the reference .tif have starting
    times near 86400 s, where the .tif creation times show they came minutes earlier. The pupil and fluorescence
    series take the same starting times.
- kind: other
  statement: The DRCs without a tone in the files (pulseSets PC_contrastChange) are 10 s of one contrast
    followed by 10 s of the other. The paper describes the sound-evoked pupil stimuli as low- or high-contrast
    DRCs and does not mention the switch.
- kind: selection_undocumented
  statement: Group sizes in the files differ from the paper. The files label ten mice pupilPTinContrast
    (four F, six M, one ZnT3-WT), where the paper gives eight C57BL6/J mice (four F, four M) for Figures
    1 to 3. The pupil_contrast_ZnT3WT label holds five F and five M, where the paper gives six F and four
    M. Twelve mice have CGC-assay trials before and after ZX1 (two of them ZnT3-KO), where the paper gives
    fourteen C57BL6/J mice for Fig. 2d, e.
- kind: metadata_insufficient
  statement: No label identifies the mice of Fig. 2d, e, and the FRA mapping trials used to select cells
    are in only 5 of 30 files. Whether the RoiResponseSeries are neuropil-corrected is not stated (unit
    lumens, description 'motion corrected ROIs'). The pupil radius has unit 'na' and no spatial scale.
- kind: methods_unavailable
  statement: Question for the authors on Fig. 2c. Which mice (the eight of Figs. 1-3, the fourteen of
    Fig. 2d, e, or both) and which unit (trials or per-mouse means) does the Wilcoxon rank sum test use?
    Pooled trials of both groups give p = 0.0098, each group alone p = 0.12 and 0.16.
- kind: methods_unavailable
  statement: Question for the authors on Fig. 4c, d, f. What is the exact fixed-effect formula (the written
    formula has no contrast by treatment term, which the Results report), and is the coding reference
    or effects? In ZnT3-KO mice the contrast slope term is significant under three of four readings and
    not under the fourth.
- kind: methods_unavailable
  statement: Question for the authors on the GCA weights. How are the time polynomials scaled? With unit-norm
    orthogonal polynomials over the 21 samples from 0 to 2 s the ZnT3-WT ZX1 slope weight is -3.8 to -7.7,
    against the reported -1.41.
- kind: methods_unavailable
  statement: Question for the authors on the pupil cleaning. How were frames with tracking failures handled
    beyond the 6 SD derivative step? This sets each animal's maximum PD and the 50% selection.
- kind: methods_unavailable
  statement: Question for the authors on the Methods' correlation (r(624) = -0.35). Which trials does
    it use? Only the mice labelled pupilBaseline_vs_evoked, DRC trials before and after ZX1, match both
    counts (598 and 379), and there r = -0.218.
