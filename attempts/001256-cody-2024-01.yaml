- claim: fig1i-contrast-effect-intermediate-only
  outcome: not_reproduced
  notebook: reproduce_cody_2024.ipynb
  output: claim:fig1i-contrast-effect-intermediate-only
  notes: On the ANOVAs whose count is within tolerance (cell-bins with both contrasts), the 43-54% bin
    is not significant under either Bonferroni family (corrected p = 0.095 to 0.22 for 7 comparisons,
    1 for 91) and the 54-65% bin is the only significant one under both. With every cell-bin-contrast
    (2204 values, outside the count tolerance) the 43-54% bin is significant (LOW 15.54 against HIGH 10.43%
    dF/F; corrected p = 0.00017 for 7 and 0.0022 for 91) and is the only one under the 91-comparison family
    in 13 of 16 readings, as the paper reports, while the 7-comparison family also flags 54-65%.
  deviations:
  - Group A is the ten mice the files label pupilPTinContrast (four F, six M, one ZnT3-WT), where the
    paper gives eight C57BL6/J mice (four F, four M); CTRL trials of the CGC assay are used.
