- claim: tone-discrimination-errors
  outcome: not_reproduced
  notebook: reproduce_ito_2009.ipynb
  output: claim:tone-discrimination-errors
  measured: [0.809, 1.015]
  notes: Counted from the event series, 317 tone-A trials in which the rat held the cue and made no L or R
    entry within 60 s (0.81% of choice trials, 0.80% with the errors in the denominator) and 129 tone-B
    trials with an L or R entry within 1 s of center exit (1.02% and 1.01%). Counted from the rare result
