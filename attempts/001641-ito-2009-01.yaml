findings:
- kind: metadata_insufficient
  statement: The trial table's `result` column says "Refer to the Discription in 'Result' column", but no such description
    is in the files. Codes 1 to 5 occur (33,243, 8084, 18,639, 141 and 104 trials). Codes 1 and 3 can be read from
    the other columns (rewarded or successful, and unrewarded choice); the error codes 2, 4 and 5 cannot be told
    apart with certainty, so the paper's error rates (0.39% and 0.73%) could not be recounted.
- kind: metadata_error
  statement: The no-reward tone of choice trials (500 Hz, 250 ms) is stored in the `SpTone Err` and `ViTone Err`
    series, named as the error tone, together with the error tone; the two are told apart only by their duration
    (about 0.3 s and 2 s).
- kind: other
  statement: The error tone lasts about 2 s in the event series (8299 tones over 1.5 s), where the paper's Behavioral
    task gives 1000 ms.
- kind: metadata_insufficient
  statement: Units carry only `Area` (NAc or VP) and an electrode number. The NAc core and shell assignment the
    paper uses (Fig. 6, supplemental Data 3), the bundle positions and the per-session depth are not in the dataset.
- kind: other
  statement: 18 of the 70 files have no units table (11 of the 12 sessions of rat 44, and seven others); the files
    do not say whether no unit was recorded or none was accepted in these sessions. Units in the other 52 sessions
    match the paper's counts (148 NAc, 66 VP).
- kind: other
  statement: Three choice trials have an L or R entry time before the center-hole exit (reaction times of -19,829,
    -11,554 and -5.2 s), and one error trial has no `state`.
- kind: paper_inconsistency
  statement: The paper reports 60,221 trials, but its parts (39,175 choice, 12,707 no-choice and 8329 error trials)
    sum to 60,211, the number of trials in the dataset; the parts match the dataset exactly.
- kind: paper_inconsistency
  statement: The Results say the constant-parameter Q models predict worse than the first- or second-order Markov
    models, but the reported F-Q and DF-Q (constant) values (0.531) exceed the first-order Markov model (0.528);
    the dataset agrees with the numbers (0.5306 and 0.5295 against 0.5283).
- kind: methods_unavailable
  statement: Question for the paper's authors. The Q update (Methods, equation 3) is an image missing from the text.
    Is the chosen action's value updated as (1 - alpha1) Q + alpha1 kappa1 after reward and (1 - alpha1) Q - alpha1
    kappa2 after no reward (assumed here, as it reproduces Table 2 and Table 3), or with kappa1 and -kappa2 added
    without the factor alpha1? Table 1 to 3 and the model comparison depend on it.
- kind: methods_unavailable
  statement: Question for the paper's authors. How were the 70 sessions divided into training and test sets? Alternate
    sessions in the order of the files (sorted by rat and session) gives exactly 19,986 training choice trials,
    as reported, and was assumed; the test set then has 19,189 trials, not 19,186. The paired tests of Fig. 5 (fig5-fq-dfq-beat-all-models,
    fig5-fq-dfq-no-difference) change outcome with the split.
- kind: methods_unavailable
  statement: Question for the paper's authors. With Qi(1) = 0, the local matching law P(L) = QL / (QL + QR) is undefined
    at the first trial and predicts one side with probability 1 after the first reward. What initial value, or what
    rule, gave its normalized likelihood of 0.508? A non-zero initial value (0.1 to 1.0) was assumed and gives 0.504
    to 0.508.
- kind: methods_unavailable
  statement: Question for the paper's authors. What do the Mann-Whitney tests of Fig. 2B and 2C rank, the 0/1 choices
    of all trials following each history (assumed; it gives p = 0.92 to 0.94 for the Fig. 2C test the paper reports
    as 0.94) or per-session probabilities? Under the latter, P(L|R0 L1) against P(L|L1 L1) gives p = 0.01 to 0.03,
    not p < 0.0001.
- kind: methods_unavailable
  statement: Question for the paper's authors. How were sigma_alpha and sigma_kappa searched, and was the random
    walk of alpha bounded? With 5000 particles the training likelihood varies by under 0.003 over sigma_alpha 0.0025
    to 0.04 and sigma_kappa 0.025 to 0.15, and with alpha clipped the best sigma_alpha lies at the top of that grid,
    so the fitted sigmas (Table 2) depend on the search.
- kind: methods_unavailable
  statement: Question for the paper's authors. In the state-coding test (Fig. 8B), were error trials with a cue
    tone included? Excluding them (assumed) gives exactly 80 and 33 state-coding units; including them gives 83
    and 37.
- kind: other
  statement: 'The cue tone stops when the rat leaves the center hole early: some tone-A tones in the event series
    last under 1 s (1st percentile 0.46 s), against the task''s 1000 to 2000 ms, and 96 of the 317 tone-A error
    trials with no L or R entry have a cue under 1 s (1st percentile 0.12 s), while the trials with result codes
    5 and 4 have full-length cues (1st percentile 1.05 and 1.03 s). The trial table''s tone offset then equals the
    exit, so early exits cannot be told from held cues by the exit time; the files do not describe this.'
