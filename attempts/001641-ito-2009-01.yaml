- claim: fig5-constant-models
  outcome: reproduced
  assumed: true
  notebook: reproduce_ito_2009.ipynb
  output: claim:fig5-constant-models
  measured: [0.5266, 0.5306, 0.5295, 0.5064]
  notes: In every reading standard Q, F-Q and DF-Q (constant) score 0.5240 to 0.5267, 0.5280 to 0.5308 and
    0.5283 to 0.5306, within tolerance, above the local matching law. The local matching law scores 0.504 to
    0.508 under O1 (a) with Qi(1) of 0.1, 0.5 or 1.0 (alpha 0.01), in tolerance; with Qi(1) = 0 it is
    undefined (0.500 with alpha 0), and under O1 (b) it scores 0.491 to 0.502. F-Q and DF-Q (constant)
    exceed the first-order Markov model, as the paper's numbers do (not part of the outcome).
  deviations:
  - The local matching law with Qi(1) = 0 (Methods) predicts 0/0 at the first trial and probability 1 after
    the first reward on one side, so its likelihood is 0 after one choice of the other side. Assumed a
    non-zero initial value (0.1, 0.5 and 1.0 shown, 0.5 reported) for this model only.
  - Assumed the Q update of O1 (a); under O1 (b) the local matching law falls outside tolerance.
  - Constant fits use L-BFGS-B (O4 b) and the best point of a 0.05 grid within 3 steps of it in every
    parameter (O4 a); a full four-parameter grid was not run.
- claim: fig5-variable-models-best
  outcome: reproduced
  assumed: true
  notebook: reproduce_ito_2009.ipynb
  output: claim:fig5-variable-models-best
  measured: [0.5304, 0.5374, 0.5369]
  notes: In all 48 readings the three time-varying models are in tolerance and each beats its constant
    version; the main reading gives 0.5304, 0.5374 and 0.5369 (paper 0.5304, 0.5375, 0.5368). F-Q
    (variable) is the best model in 40 readings; in the 8 with O1 (b) and clipped drift (O5 b) DF-Q
    (variable) leads it by at most 0.0002. Under O1 (a), adopted, F-Q is first in every reading.
  deviations:
  - The sigma search ran with 1000 particles on a 4 x 4 grid holding the Table 2 values; the chosen sigmas
    were then run with 5000 particles. The training likelihood surface is flat (within 0.003 over the grid).
  - Systematic resampling in the particle filter (a standard choice for the offspring numbers the supplement
    describes).
  - Assumed the Q update of O1 (a), whose constant fits match Table 2.
