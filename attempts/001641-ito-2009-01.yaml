- claim: trial-counts
  outcome: reproduced
  notebook: reproduce_ito_2009.ipynb
  output: claim:trial-counts
  measured: [60211, 70, 6, 39175, 12707, 8329]
  notes: Both readings of the total give 60,211 trials, as every trial has a cue tone. Choice, no-choice and error
    trials are 39,175, 12,707 and 8329, exactly as reported, in 70 sessions from 6 rats. The paper's own parts sum
    to 60,211, 10 fewer than its stated total of 60,221.
  deviations:
  - Choice trials are tone-A trials with result 1 or 3 and an L or R choice, no-choice trials tone-B trials with
    result 1, and all others errors; the result codes are not described in the files and were read from the other
    columns.
- claim: block-structure
  outcome: reproduced
  notebook: reproduce_ito_2009.ipynb
  output: claim:block-structure
  measured: [104.9, 8.2, 5, 12]
  notes: Under reading (a), all trials and every block, 104.9 trials per block and 8.2 blocks per session, 5 to
    12. Counting completed blocks only gives 7.44 blocks and a fewest of 4; counting choice trials only gives 68
    to 70 trials per block. Blocks are those of the BlockDesign table (574, of which 521 finished).
- claim: reaction-time
  outcome: reproduced
  notebook: reproduce_ito_2009.ipynb
  output: claim:reaction-time
  measured: [72.1, 0.754]
  notes: 72.1% of choice-trial reaction times are under 1 s, median 0.754 s, over 39,172 trials. Three choice trials
    have a negative reaction time (L or R entry recorded before the center exit) and are left out; keeping them
    changes neither value. The rats range from 35.0% to 91.3% under 1 s.
  deviations:
  - Three trials with a negative reaction time were left out as timing errors.
- claim: tone-discrimination-errors
  outcome: not_reproduced
  notebook: reproduce_ito_2009.ipynb
  output: claim:tone-discrimination-errors
  measured: [0.809, 1.015]
  notes: Counted from the event series, 317 tone-A trials in which the rat held the cue and made no L or R entry
    within 60 s (0.81% of choice trials, 0.80% with the errors in the denominator) and 129 tone-B trials with an
    L or R entry within 1 s of center exit (1.02% and 1.01%). 96 of the 317 tone-A trials had a cue tone under 1
    s (1st percentile 0.12 s), shorter than any cue of the task (1000 to 2000 ms), so the tone probably stopped
    when the rat left early and the hold test let these through; keeping tones of at least 1 s gives 221 and 125
    trials (0.56% and 0.98%). Counted from the rare result codes 5 (tone A) and 4 (tone B), whose tones last over
    1 s (1st percentile 1.05 and 1.03 s), 0.27% and 1.11%. No numerator gives both of the paper's 0.39% and 0.73%
    under either denominator. The result codes are undocumented, so the paper's counting may differ from all three.
  deviations:
  - The numerators are not in the claims file; they were counted from the definitions in the Results (Reaction time
    and tone discrimination, paragraph 2), from the L and R sensor series, with a recount keeping cue tones of at
    least 1 s (Behavioral task, cue 1000 to 2000 ms) and the result codes as variants.
