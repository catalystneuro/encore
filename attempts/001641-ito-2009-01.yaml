- claim: fig3-lsq-switching
  outcome: partially_reproduced
  notebook: reproduce_ito_2009.ipynb
  output: claim:fig3-lsq-switching
  measured: [0.01018, 0.0072, 0.00094, 0.00027]
  notes: Under all eight readings (O7, O1, residual) the residuals are in the order local matching (0.0099 to 0.0102)
    > standard Q (0.0071 to 0.0073) > F-Q (0.00079 to 0.00102) > DF-Q (0.00011 to 0.00027), and switching is represented
    by F-Q and DF-Q but not by the local matching law or standard Q. The DF-Q residual is outside its tolerance
    (0.0002 +- 0.00002) under every reading and F-Q is outside under the 12-point reading, so the order and switching
    hold and some values do not. The local matching law's optimum is alpha 0, a constant 0.5.
  deviations:
  - Fitted with L-BFGS-B from a grid of starting points under the bounds alpha in [0, 1], kappa1 in [0, 10], kappa2
    in [-10, 10] and Q0 in [0, 10]; the paper names no optimizer or bounds (a standard choice).
- claim: table1-lsq-parameters
  outcome: not_reproduced
  notebook: reproduce_ito_2009.ipynb
  output: claim:table1-lsq-parameters
  measured: [0.32, 2.707, 1.242, 0.974, 0.972, 0.629, 1.0, 0.54, 0.883, 1.145, 1.375, 0.704, 0.0, 0.0]
  notes: 'Under O1 (a) 8 of 14 values are within tolerance (6 under O1 b), fewer than the 10 needed for partial
    reproduction. F-Q alpha, kappa1 and kappa2 and all five DF-Q values match; standard Q (alpha 0.30 to 0.32, kappa1
    2.71 to 2.85, Q0 1.24 to 1.29), F-Q Q0 and the local matching law (alpha 0 and Q0 0, against 0.05 and 0.07)
    do not. With alpha1 = alpha2 the initial value cancels from QL - QR, so the F-Q Q0 is not determined by the
    fit (0.05 to 1.0 here); the paper''s 0.00 is one of many equal optima. Under O1 (a) the paper''s own Table 1
    values give nearly the fitted residual (mean over 24 points, O7 a: local matching law 0.0103 against 0.0102
    at alpha 0.05 and Q0 0.07, standard Q 0.00722 against 0.00720, F-Q equal, DF-Q 0.00028 against 0.00027), so
    the surface is flat and the paper''s values lie near the optimum; under O1 (b) they are far worse (0.018 to
    0.044 for all but F-Q).'
