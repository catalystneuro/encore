- claim: fig5-constant-models
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_ito_2009.ipynb
  output: claim:fig5-constant-models
  measured: [0.5266, 0.5306, 0.5295, 0.5064]
  notes: In every reading standard Q, F-Q and DF-Q (constant) score 0.5240 to 0.5267, 0.5280 to 0.5308 and 0.5283
    to 0.5306, within tolerance, above the local matching law. The local matching law with Qi(1) = 0, as the Methods
    and the criterion give it, predicts 0/0 at the first trial and probability 1 after the first reward on one side;
    fitted, its optimum is alpha 0, a constant 0.5, and it scores 0.500 under O1 (a) and less under O1 (b), out
    of tolerance. With an initial value the paper does not give (0.1, 0.5 or 1.0) it scores 0.504 to 0.508 under
    O1 (a), in tolerance, and 0.491 to 0.502 under O1 (b). The paper's 0.508 cannot come from the model as specified,
    so its procedure is not fixed. F-Q and DF-Q (constant) exceed the first-order Markov model, as the paper's numbers
    do (not part of the outcome). Asked of the paper's authors (findings).
  deviations:
  - Constant fits use L-BFGS-B (O4 b) and the best point of a 0.05 grid within 3 steps of it in every parameter
    (O4 a); a full four-parameter grid was not run.
- claim: fig5-variable-models-best
  outcome: partially_reproduced
  notebook: reproduce_ito_2009.ipynb
  output: claim:fig5-variable-models-best
  measured: [0.5304, 0.5374, 0.5369]
  notes: In all 48 readings the three time-varying models are in tolerance and each beats its constant version;
    the main reading gives 0.5304, 0.5374 and 0.5369 (paper 0.5304, 0.5375, 0.5368). F-Q (variable) is the best
    model in 40 readings; in the 8 with O1 (b) and clipped drift (O5 b) DF-Q (variable) leads it by at most 0.0002,
    so the criterion's partial rule (F-Q or DF-Q highest, values in tolerance, F-Q not always first) holds under
    every reading. On split (a) the average of six filter seeds keeps the order (F-Q 0.53752 against DF-Q 0.53710
    under O1 a, O5 a; DF-Q 0.53481 against 0.53468 under O1 b, O5 b). A 5000-particle sigma search on a wider grid
    (split a, O1 a) gives F-Q 0.5372 and DF-Q 0.5372 under O5 (a), 0.5374 and 0.5373 under O5 (b); the paper's Table
    2 sigmas give 0.5376 and 0.5369 in the main reading. The claim depends on fig5-markov-accuracy and fig5-constant-models,
    which are blocked for details this claim does not use (the Markov order 3 against 4 under one split, the local
    matching law's initial value); F-Q and DF-Q (variable) exceed every Markov and local-matching score under every
    reading, so the claim is tested.
  deviations:
  - The sigma search ran with 1000 particles on a 4 x 4 grid holding the Table 2 values; the chosen sigmas were
    then run with 5000 particles. A 5000-particle search on a 6 x 5 grid (sigma_alpha 0.0025 to 0.08, sigma_kappa
    0.025 to 0.15) was run for split (a) and O1 (a) as a check.
  - Systematic resampling in the particle filter (a standard choice for the offspring numbers the supplement describes).
- claim: fig5-fq-dfq-beat-all-models
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_ito_2009.ipynb
