- claim: fig3-lsq-switching
  outcome: partially_reproduced
  notebook: reproduce_ito_2009.ipynb
  output: claim:fig3-lsq-switching
  measured: [0.01018, 0.0072, 0.00094, 0.00027]
  notes: Under all eight readings (O7, O1, residual) the residuals are in the order local matching (0.0099
    to 0.0102) > standard Q (0.0071 to 0.0073) > F-Q (0.00079 to 0.00102) > DF-Q (0.00011 to 0.00027), and
    switching is represented by F-Q and DF-Q but not by the local matching law or standard Q. The DF-Q
    residual is outside its tolerance (0.0002 +- 0.00002) under every reading and F-Q is outside under the
    12-point reading, so the order and switching hold and some values do not. The local matching law's
    optimum is alpha 0, a constant 0.5.
  deviations:
  - Fitted with L-BFGS-B from a grid of starting points under the bounds alpha in [0, 1], kappa1 in [0, 10],
    kappa2 in [-10, 10] and Q0 in [0, 10]; the paper names no optimizer or bounds (a standard choice).
