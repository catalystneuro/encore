- claim: leave-higher-stay-lower
  outcome: reproduced
  notebook: reproduce_vijayan_2022.ipynb
  output: claim:leave-higher-stay-lower
  measured:
  - 1205
  - 0.805
  - 2773
  - 0.331
  notes: Searches by M3 without the 30-s minimum in the CS 0/200, 0/500 and 200/500 chambers. 1205 start
    on the higher sucrose substrate and 970 (0.805) leave it; 2773 start on the lower and 917 (0.331)
    leave it; rank sum on 0/1 trials p = 8.8e-167. All four values are within tolerance. By chamber the
    fractions leaving higher are 0.814, 0.832 and 0.780 and leaving lower 0.353, 0.358 and 0.283; 87 of
    88 flies with searches of both kinds leave the higher more often. The 1205 + 2773 = 3978 searches
    are all the eggs of the three chambers.
  deviations:
  - 'Search start (M3), taken from Methods, Automated determination of egg-laying search: the scan for
    the first frame below 0.1 mm/s of the 18.5-s centred boxcar of speed starts 9 s before the egg, so
    that the minimum search is 9 s as the passage says. This reading gives 1205 searches started on higher
    sucrose, the paper''s number; the scan from the frame before the egg (shown) gives 1202.'
  - The rank sum test is computed with a tie correction (scipy mannwhitneyu, asymptotic, continuity corrected),
    as MATLAB's ranksum does; the paper used MATLAB (Data analysis software). Without the correction p-values
    on 0/1 trials are far too large.
