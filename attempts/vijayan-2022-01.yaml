findings:
- kind: other
  about: data
  severity: none
  statement: The four agarose groups carry an Agarose_Percentage series, the agarose under the fly in every
    frame, which the other groups lack; its label changes only with the island. The 0.8 against 1.4% chambers
    were loaded both ways round (island 0 is 0.8% for 18 of 24 flies without sucrose and 12 of 24 with
    200 mM on both sides), so the island number alone does not give the hardness, but the series does.
    The first version of this attempt read only the island and sucrose series, missed it, and reported
    the hardness as unrecorded (metadata_insufficient, major); that was wrong, and this finding replaces
    it.
- kind: data_missing
  about: data
  severity: major
  statement: The paper says all fly tracking data it used are on DANDI 000212, but the dandiset lacks
    the movable-boundary chambers (Fig. 1D, E), the glued flies (Fig. 1F), the 115-line Gal4 screen (Fig.
    7A), the Gal80 rescues (Fig. 7L to N), nine of the 13 receptor genotypes of Fig. 8A, the 200/500 mM
    and agarose chambers of the mutants and DDC>Kir flies (Fig. 8J, K), four of the six agarose conditions
    of Fig. 6B and the BDSC 84714 mutant. Some of these may have been scored by egg counts without tracking;
    the paper does not say. The feeding-latency videos (Figs. 7B, 8B) are not tracking data and are also
    absent.
- kind: metadata_insufficient
  about: data
  severity: minor
  statement: The two Dop1R2 groups are named 'Dop1R2-mutant-1' and '-2', with genotypes that name only
    the paper each mutant came from (Keleman et al. 2012, Deng et al. 2019). The paper's allele names
    (Dop1R2 attP, Dop1R2-) follow from its references and the egg counts, not from the files.
- kind: metadata_insufficient
  about: data
  severity: minor
  statement: Every file has the same placeholder session start time (2021-01-01 01:01:01 -05:00), so the
    files hold no recording dates and experiments cannot be ordered or matched to batches.
- kind: other
  about: data
  severity: minor
  statement: 48 of 29531 intervals between successive eggs of a fly are under 10 s (12 are a single frame),
    against the paper's statement that eggs are at least 1 min apart; in 47 both eggs are on one island
    and in 34 the fly moves no faster than 0.3 mm/s between them, so they may be double annotations. They
    are listed in the data check and kept.
- kind: other
  about: data
  severity: minor
  statement: 'The dandiset has never been published: only the draft exists, so it has no fixed version
    or DOI, and an attempt on it can only record the draft''s modification time (2023-06-20T00:56:15Z).'
- kind: other
  about: data
  severity: none
  statement: Egg counts per group agree with the paper's legends within a few eggs (for example 1863 against
    1862 for CS 0/200, 533 for DDC>Kir 31 C, 831 and 795 for the same-agarose chambers), the ref. 16 chambers
    hold 95 flies and 3978 eggs (paper 95, 3979), no recording appears twice, the islands follow the y
    position and the sucrose label changes only with the island, and flies speed up before an annotated
    egg and pause at it while shifted times show no such contrast, so the egg annotations share the position
    clock.
