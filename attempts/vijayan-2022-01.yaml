  notes: Fast eggs (on 0 mM within 10 s of entering it from 200 mM) number 36, 44 and 22 in the 4-mm,
    2-mm and bounce chambers, within tolerance of 36, 44 and 23, and the median duration of the preceding
    200 mM visit increases, 45.5, 57.0 and 379.5 s, but all three medians are below the tolerances around
    54, 96 and 576 s. Bounce differs from both others (p = 0.003); 4 mm and 2 mm do not (p = 0.54). Other
