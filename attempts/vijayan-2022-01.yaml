findings:
- kind: metadata_insufficient
  about: data
  severity: major
  statement: The agarose chambers (0.8 against 1.4%, and the same with 200 mM sucrose on both sides) do
    not record which island held which agarose. The sucrose series is the same on both sides, there is
    no hardness series, and per-fly egg fractions on island 0 are bimodal, as when chambers are loaded
    both ways round. The paper's Fig. 6B, 6C, 6D and 6G cannot be tested.
- kind: data_missing
  about: data
  severity: major
  statement: The paper says all fly tracking data it used are on DANDI 000212, but the dandiset lacks
    the movable-boundary chambers (Fig. 1D, E), the glued flies (Fig. 1F), the 115-line Gal4 screen (Fig.
    7A), the Gal80 rescues (Fig. 7L to N), nine of the 13 receptor genotypes of Fig. 8A, the 200/500 mM
    and agarose chambers of the mutants and DDC>Kir flies (Fig. 8J, K), four of the six agarose conditions
    of Fig. 6B and the BDSC 84714 mutant. Some of these may have been scored by egg counts without tracking;
    the paper does not say. The feeding-latency videos (Figs. 7B, 8B) are not tracking data and are also
    absent.
- kind: metadata_insufficient
  about: data
  severity: minor
  statement: The two Dop1R2 groups are named 'Dop1R2-mutant-1' and '-2', with genotypes that name only
    the paper each mutant came from (Keleman et al. 2012, Deng et al. 2019). The paper's allele names
    (Dop1R2 attP, Dop1R2-) follow from its references and the egg counts, not from the files.
- kind: metadata_insufficient
  about: data
  severity: minor
  statement: Every file has the same placeholder session start time (2021-01-01 01:01:01 -05:00), so the
    files hold no recording dates and experiments cannot be ordered or matched to batches.
- kind: other
  about: data
  severity: minor
  statement: 48 of 29531 intervals between successive eggs of a fly are under 10 s (12 are a single frame),
    against the paper's statement that eggs are at least 1 min apart; they may be double annotations.
    They are kept.
- kind: other
  about: data
  severity: minor
  statement: 'The dandiset has never been published: only the draft exists, so it has no fixed version
    or DOI, and an attempt on it can only record the draft''s modification time (2023-06-20T00:56:15Z).'
- kind: other
  about: data
  severity: none
  statement: Egg counts per group agree with the paper's legends within a few eggs (for example 1863 against
    1862 for CS 0/200, 533 for DDC>Kir 31 C, 831 and 795 for the same-agarose chambers), the ref. 16 chambers
    hold 95 flies and 3978 eggs (paper 95, 3979), no recording appears twice, the islands follow the y
    position and the sucrose label changes only with the island, and flies speed up before an annotated
    egg and pause at it while shifted times show no such contrast, so the egg annotations share the position
    clock.
- kind: methods_unavailable
  about: paper
  statement: 'Question for the authors: the merge point is ''the first bin past 5 s for which P > 0.05''
    (Fig. 5A legend). Does the 5 to 10 s bin count as past 5 s? This attempt assumed it does; with the
    10 to 15 s bin first, the DDC>Kir 31 C curves merge at the first bin and fig7cf would be reproduced
    in full.'
- kind: methods_unavailable
  about: paper
  statement: 'Question for the authors: what is a trial in the bin test (Methods, Statistics), one visit
    to a time bin or one search that enters it? Most results agree; the TUT merge point is 20 s with visits
    and 90 s with searches.'
- kind: methods_unavailable
  about: paper
  statement: 'Question for the authors: how was the dwell time of Fig. 3D measured? The duration of the
    200 mM visit before a fast egg gives medians of 45.5, 57 and 379.5 s against the legend''s 54, 96
    and 576 s, with the same egg counts.'
- kind: methods_unavailable
  about: paper
  statement: 'Question for the authors: the pause time of Methods, Statistics (from the 1-s smoothed speed
    rising above 0.1 mm/s before the egg) has medians of 0.5 to 2.5 s on these files. Was the speed computed
    or smoothed differently, or the threshold applied to another signal? The comparisons of pause medians
    (fig3f, fig7ik) depend on it.'
- kind: methods_unavailable
  about: paper
  statement: 'Question for the authors: the search start scans back from 9 s before the egg in this attempt,
    which gives the paper''s 1205 searches on higher sucrose; was that the procedure? And how were the
    fig. S4 kernel (ref. 82) and the constants k1, k2 of model 2 fit? The analysis code is not public.'
