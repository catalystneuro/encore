      fit was added (log link, Poisson likelihood, same zero-area kernel): it follows the 0/200 curves inside
      the 90% CI in 4 of 7 bins on each curve (0 mM mean 1.27 against 1.21 eggs/min) and overestimates the
      0/500 rate on 0 mM after 500 mM in 7 of 7 bins, so the result does not rest on the negative rates. Linearity
      in concentration is model 1 as the paper defines it, and the paper gives it as the cause of the failure.
      Model 2 cannot be fit, as the paper gives neither its equations nor its constants; the criterion tests
      model 1 only, and the notes say the statement''s model 2 part is untested.'
