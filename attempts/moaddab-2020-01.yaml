  outcome: reproduced
  notebook: reproduce_moaddab_2020.ipynb
  output: claim:fig5efg-inhibited-fear-output
  notes: Under the adopted reading the group by regressor by interval interaction is F(9,1170) =
    2.15, p = 0.023, the last-5 s fear output beta is -0.386 in EAA against -0.220 in Control (t =
