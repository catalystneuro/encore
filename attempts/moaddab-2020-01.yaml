findings:
- kind: other
  statement: The units come from 182 recording sessions (74 Control, 108 EAA), each with its own
    trial table, where the paper and the data description state 72 Control and 107 EAA sessions.
    The unit counts (151 and 203) and rat counts (8 and 12) match. No session holds more than one
    behaviour program and no two sessions share a trial table, so the extra sessions are not
    duplicates.
- kind: metadata_insufficient
  statement: The group of each rat (Control or EAA) is given only by lists in the authors' script
    vlpagAnalysis.m (lines 99 to 122), not by the data description or the files.
- kind: metadata_insufficient
  statement: The event codes EVT01 to EVT14 of the unit files are not described. EVT09, EVT11 and
    EVT12 are the cue onsets, but which is danger, uncertainty or safety depends on the behaviour
    program in the file name (epr38a, b, c); EVT08 holds the shocks, EVT13 the nose pokes, EVT14 a
    marker about 31.5 s after each onset, and EVT02 could not be identified.
- kind: metadata_error
  statement: The data description says poke.base is the baseline nose poke rate 2 s prior to cue
    presentation. It is the rate in the 20 s before cue onset (99.8% of trials; 4.2% match a 2 s
    window), in pokes per minute, a unit the description does not give.
- kind: metadata_error
  statement: The data description gives the uncertainty shock rows a shock probability of 0.25;
    the paper and the description's own summary give 0.375.
- kind: metadata_insufficient
  statement: No bregma recording level per rat is given; the description gives only how many rats
    were at each of four levels, so the paper's ANOVAs with bregma level cannot be repeated.
- kind: data_missing
  statement: The body weights (Fig. 1B, C) and the eight pre-surgery discrimination sessions (Fig.
    1E, F) are not in the data set.
- kind: other
  statement: The cube stores raw firing rates as unsigned integers truncated towards zero, so units
    firing below 1 Hz have stored rates of 0 (775 trials with spikes have a stored 10 s baseline of
    0). The paper's counts of cue-excited and cue-inhibited neurons follow exactly from these
    truncated rates; with exact rates from the spike times the Control cue-inhibited count is 54,
    not 48.
- kind: other
  statement: Spikes and nose pokes are stored only around the trials, from about 20 s before to
    about 33.5 s after each cue onset (99.98% of spikes and 99.99% of nose pokes fall within 20.5 s
    before to 33.5 s after an onset), not over the whole session, which the data description does
    not say.
- kind: other
  statement: The cube stores a suppression ratio of 1 for the 255 unit-trials (143 session-trials)
    with no nose poke in the baseline or the cue, where the ratio is 0/0; the paper does not say how
    such trials are treated.
- kind: code_mismatch
  statement: The Methods describe the normalized firing as the trial-averaged differential firing Z
    scored over all bins and trial types of a neuron. The authors' script instead averages the
    cube's trial-wise Z scores (each trial's own 2 s baseline subtracted, Z scored over all trials
    and bins). With the script's version the statistics of Figs. 4C, 4F and 6 are the paper's to
    the second digit (for example group F(1,79) = 4.96 and F(1,130) = 10.81 against 4.96 and 10.82;
    Fig. 6 Control danger R2 = 0.566 against 0.56); with the Methods' version they differ, and the
    uncertainty part of Fig. 6 fails.
- kind: methods_unavailable
  statement: Question for the paper's authors. Which trial-wise normalized firing entered the
    single-unit regressions (Figs. 5 to 7), and how were trials with no nose poke in baseline and
    cue treated? This attempt assumed the cube's fire.z.s1 regressed on cer.cue (0/0 stored as 1),
    as vlpagAnalysis.m does; the claims file's readings (trial firing minus the cue's mean or the
    trial's own 2 s baseline Z scored with the neuron's normalization, or raw firing Z scored over
    all trials) give a non-significant group effect for Fig. 5D (p = 0.07 to 0.24) where the
    adopted reading gives p = 0.045.
- kind: methods_unavailable
  statement: Question for the paper's authors. Several reported error degrees of freedom are
    smaller than the selected neurons give (Fig. 5A to C t(66) and F(1,65) for 81 cue-excited
    neurons; Fig. 4A, B F(110,8360); Fig. 2E, F F(2,346) for 354 neurons). Which neurons were left
    out of these tests, and why? Trials without pokes, missing betas and rank-deficient designs do
    not account for it, and the script has no exclusion step.
- kind: code_mismatch
  statement: The legend of Fig. 7 and the Results say cue-inhibited firing was taken over the last
    5 s of the cue. The authors' script computes per-neuron cue-inhibited firing only over the first
    5 s and the whole cue (vlpagAnalysis.m lines 2796 to 2817), and the paper's Fig. 7 statistics
    follow from the first 5 s (with the script's normalization and regression, Control uncertainty R2 = 0.042, p = 0.16 against 0.04, 0.16;
    safety Z = 0.60 against 0.60). With last-5 s firing, Control uncertainty firing correlates with
    the fear output beta at R2 = 0.49 (p = 2.8e-8).
- kind: methods_unavailable
  statement: Question for the paper's authors. Was the firing in Fig. 7 taken over
    the first 5 s of the cue, as the statistics this attempt obtains suggest, and not the last 5 s
    the legend gives?
