- claim: fig5abc-excited-reduced-threat-probability
  outcome: partially_reproduced
  notebook: reproduce_moaddab_2020.ipynb
  output: claim:fig5abc-excited-reduced-threat-probability
  notes: Under the adopted reading (the cube's trial-wise Z score, 0/0 trials set to 1, as the
    authors' script regresses them) the whole-cue threat probability beta is higher in Control
    (0.953 against 0.558, t(79) = 2.12, p = 0.037), the fear output betas do not differ (p = 0.87),
    but the group by regressor interaction is F(1,79) = 3.79, p = 0.055. Of the claims file's six
    readings none meets all three parts; (b) with 0/0 trials dropped gives the same partial
    pattern (interaction p = 0.055, threat p = 0.047). The cube's Z score with 0/0 trials set to 0
    meets all three (interaction p = 0.031, threat p = 0.044), but it is not the adopted combination
    and is further from the paper's statistics. The claims file's own rule (one of its six
    readings) gives the same outcome, partial, so the outcome does not rest on the adopted reading. Control threat betas are positive
    from the first interval and rise (0.72 to 1.22). With the exact-rate selection no reading
    meets the threat probability part (smallest p = 0.060). The paper's F(1,65) and t(66) imply
    about 67 of the 81 neurons. The question of which trial-wise firing and which 0/0 treatment the
    paper used is for its authors (see findings).
  deviations:
  - Reading adopted for every regression claim. The trial-wise normalized firing and the
    treatment of trials without pokes are open in the paper (Results, Diminished threat probability signaling, paragraph 1, says only
    "normalized firing rate for each trial ... in 1 s bins"). The authors' script in the data set
    regresses vlPAGcube.fire.z.s1.interval (each trial's own 2 s baseline subtracted, Z scored over
    all trials and bins) on vlPAGcube.cer.cue (which stores 1 for 0/0 trials) (vlpagAnalysis.m,
    lines 2162 to 2171, printed in the notebook's data check). That combination is adopted for every
    regression claim (Figs. 5, S4, 6, S5, 7, S6), the same for each, and the twelve combinations of
    the claims file's readings and the script's are all shown. Here the claims file's readings give
    the same outcome. Of the twelve it gives the paper's
    printed statistics for Figs. 5A to G and 6 most closely (mean relative deviation 0.076, next
    0.167, the claims file's six readings 0.236 to 0.724).
  - The tests use all 81 cue-excited neurons (df 79); the paper's df implies about 67. Trials
    without pokes, missing betas and rank-deficient designs do not explain the difference (24 of
    the 81 come from sessions with a 0/0 trial, no beta is missing, every design is of full rank),
    and the script has no exclusion step.
