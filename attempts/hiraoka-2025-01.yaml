- claim: fig2-other-neurons-similar
  outcome: reproduced
  notebook: other_neurons.ipynb
  output: claim:fig2-other-neurons-similar
  notes: 'Reproduced under the continuous fit from xmin = 1 alone, which meets the criterion''s "under
    one reading": with the exponent unbounded, 502 of 554 (grid a) and 502 of 562 (grid b) pyramidal units
    of all sessions show the pattern (0.906 and 0.893), and 107 and 106 of 120 in Achilles-10252013 (0.892
    and 0.883). No other reading meets it: in set (b) the continuous KS fit gives 0.449 and 0.454, the
    discrete KS fit 0.233 and 0.240, the discrete fit from xmin = 1 0.211 and 0.215; in set (a) 0.342
    and 0.292, 0.117 and 0.083, and 0.017. The pass is fragile: the continuous fit from xmin = 1 treats
    integer sizes as continuous down to 1, where Clauset et al. (ref. 36) find the continuous approximation
    poor, and its exponents (median over units of the median beta 1.744 to 1.778) are far from the paper''s
    2.35. Capped at 3 (other_neurons_cap3.ipynb, grid a) the continuous KS fit passes in set (b) (0.547)
    and the continuous fit from xmin = 1 gives 0.906, so the outcome does not depend on the cap. The inhibitory
    units, the class the files give the paper''s representative unit, show the pattern far more often
    under the KS fits: 92 and 87 of 128 (0.719 and 0.680, discrete) and 95 of 128 (0.742, continuous);
    over all 690 units the continuous KS fit gives 0.504 and 0.507. Under the discrete KS fit the median
    over pyramidal units of each unit''s median beta is 2.471 and 2.459 (interquartile range 2.216 to
    2.789, grid a), and 2.284 to 2.600 by session; the burst-size part holds in 0.744 and 0.770 of the
    units and the merging-number part in 0.251 and 0.249. 32 pyramidal units have fewer than three points
    on grid (a) and are not used there. Whether the set should hold the inhibitory units is asked of a
    reader (questions).'
  deviations:
  - Pyramidal units are read as those with cell_type excitatory, the only label for principal cells in
    this version (562 of 690 units). The paper's own representative unit is labelled inhibitory, so the
    inhibitory units (128) and all units (690) are run as variants.
  - Two of the 562 pyramidal units have unsorted spike times (data finding); the trains are sorted before
    the IETs are taken, and leaving them out changes no fraction by more than 0.003.
  - 'The exponent of every fit is unbounded (alpha in [1, inf)), an assumption: the locked powerlaw 2.0.0
    caps the power-law alpha at 3 by default (Power_Law.DEFAULT_PARAMETER_RANGES) and its find_xmin discards
    every candidate xmin whose fit reaches the cap, while the estimator the paper cites (Clauset et al.,
    ref. 36, Section 3) has no upper bound and neither had the package as its paper describes it (Alstott
    et al., ref. 37; releases 1.x require only alpha > 1). The paper gives no version. The capped fits
    are run beside the unbounded ones (readings with suffix _cap3). The capped variant is run on grid
    (a) alone, for run time.'
- claim: fig2-wikipedia-beta
  outcome: blocked
  blocked_by: too_large
  notes: The paper's preprocessed edit histories were provided privately and are not deposited. The English
    Wikipedia dump of October 2, 2015 is no longer on dumps.wikimedia.org (the directory answers 404)
    but is kept on the Internet Archive (item enwiki-20151002), where the smallest file holding every
    revision's editor and time, the stub-meta-history, is 47.4 GB compressed. Streaming and parsing it
    to rebuild the editors' sequences, with a preprocessing and a definition of frequent editors the paper
    does not give, does not fit the run's time. The verifier would give data_missing, as the preprocessed
    edit histories were never deposited; the code stays too_large, as the claims file has this claim as
    data elsewhere, for which the protocol does not use data_missing, and the public dump it would be
    rebuilt from is what does not fit the run.
- claim: fig2-earthquake-beta
  outcome: blocked
  blocked_by: other
  notes: The Southern California Seismic Network catalog is public (the SCEDC event service answered a
    query for 1993) but it is revised continuously and has no versioned release, and the paper gives no
    retrieval date or event identifiers, so it cannot be pinned as the protocol requires for outside data
    (author, step 1.4). Not tested. The verifier finds this reason weak, since the 10% tolerance on n
    would allow an approximate test on the current catalog; such a test would rest on unpinned data and
    was not run.
- claim: fig4-model-heavy-tails
  outcome: partially_reproduced
  assumed: true
  seed_sensitive: true
  notebook: model.ipynb
  output: claim:fig4-model-heavy-tails
  notes: Sequences generated here by Algorithm 2 with the set-up of Section IV. With the exponent unbounded,
    no single reading of the fit holds for all three series under the claim's seed, on either grid. Under
    the discrete KS fit the linear and quadratic series hold on grid (a); the exponential series has heavy
    tails (supported at 8 of 11 timescales and 17 of 20 pairs on grid a, 42 of 52 and 79 of 94 on grid
    b) but its gamma has an interquartile range of 0.544 and 0.508, above the 0.5 of the criterion, and
    on grid (b) the linear series also fails (0.511). The fits from xmin = 1 hold for the exponential
    series but not the quadratic one (beta interquartile range 0.508 to 0.953). Capped at 3 (grid a),
    the discrete KS fit gives 0.522 for the exponential gamma. Under the four further seeds the discrete
    KS fit holds for all three series under seeds + 1000, + 2000 and + 3000 and not under + 4000 (the
    linear series fails); the exponential gamma interquartile range runs from 0.203 to 0.544 over the
    five seeds. Each series holds under some reading under every seed on grid (a).
  deviations:
  - One reading of the fit is applied to all three series alike, the adopted discrete KS fit; taking for
    each series whichever reading holds would give reproduced.
  - Under the four further seeds only grid (a) was run, with the exponent unbounded, for run time.
  - No code is linked for Algorithm 2; it is implemented from the pseudocode and Section IV (Eqs. 10,
    12 to 14 and 16).
  - 'The exponent of every fit is unbounded (alpha in [1, inf)), an assumption: the locked powerlaw 2.0.0
    caps the power-law alpha at 3 by default (Power_Law.DEFAULT_PARAMETER_RANGES) and its find_xmin discards
    every candidate xmin whose fit reaches the cap, while the estimator the paper cites (Clauset et al.,
    ref. 36, Section 3) has no upper bound and neither had the package as its paper describes it (Alstott
    et al., ref. 37; releases 1.x require only alpha > 1). The paper gives no version. The capped fits
    are run beside the unbounded ones (readings with suffix _cap3). The capped fits are run under the
    claim''s seed on grid (a).'
- claim: fig4-model-iet-shapes
  outcome: partially_reproduced
  seed_sensitive: true
  notebook: model.ipynb
  output: claim:fig4-model-iet-shapes
  measured:
  - 1711.4
  - 21390.9
  - 61320.3
  notes: Under the claim's seed tau_max is 1711.4 (linear, 0.127 below 1960), 21 390.9 (quadratic, within
    10% of 20 800) and 61 320.3 (exponential, 0.249 below 81 600), so one of three is within tolerance.
    tau_max is an IET of the highest level the sequence reaches, which varies with the seed (levels 14
