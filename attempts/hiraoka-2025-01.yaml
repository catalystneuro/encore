- claim: model-decremental-equivalent
  outcome: not_reproduced
  seed_sensitive: true
  notebook: model.ipynb
  output: claim:model-decremental-equivalent
  notes: 'Under the literal set-up of Section IV (Algorithm 1 with the zeta distribution of Eq. 15, Algorithm
    2 with the memory function of Eq. 16) the burst sizes differ at every relevant timescale of the three
    series under the claim''s seed (23 of 23 on grid a, 113 of 113 on grid b; 22 to 25 and 105 to 114
    over the five seeds), with KS D up to 0.4487, and the decremental sequence has more bursts at the
    lowest timescale (566 721 against 414 726, linear). Eq. 16 is not the memory function Eq. 9 gives
    for the zeta distribution (q(1) is 0.354 against 0.255; mean merging number 2.59 against 1.93). With
    both algorithms on one distribution (readings Z and Q) the differences are small (D at most 0.1874),
    but the criterion still rejects at 3 and 11 (Z) and 4 and 11 (Q) timescales under the claim''s seed,
    as it does for two runs of the same algorithm (reference N, 4 and 11), so the KS criterion rejects
    even identical algorithms on these correlated sequences. Every reading is not reproduced under the
    claim''s seed; reading Z passes under seed + 4000 (0 and 0 rejections), hence seed_sensitive. The
    literal reading is not reproduced under all five seeds. As a variant the verifier asked for, a test
    calibrated across runs takes the five runs of each algorithm as the units (mean KS distance between
    algorithms less within, averaged over grid (a), exact permutation over the 126 splits): L differs
    in all three series (p = 0.0079, the smallest possible, 0.024 after Bonferroni), two runs of one algorithm
    (N) differ in none (p 0.373 to 0.913), Z in none (p 0.429 to 0.857), and Q in the linear series only
    (p = 0.0079). It agrees with the criterion on L and finds the algorithms equivalent under Z; it does
    not decide the outcome.'
  deviations:
  - The paper's "statistically equivalent" holds by construction when the decremental algorithm draws
    from the distribution whose memory function the incremental one uses. The three readings of the set-up
    (L literal, Z both zeta, Q both from Eq. 16) are all run, with two runs of Algorithm 2 as the reference
    of the test.
  - The relevant timescales of each comparison are those of the incremental sequence.
findings:
- kind: format_error
  severity: major
  datasets:
  - '000044'
  statement: In Buddy-06272013, Cicero-09012014 and Gatsby-08022013 the spike train of unit id 2 is not
    sorted in time. Each is two sorted runs, the first of exactly 65 536 spikes (131 072 in Gatsby-08022013)
    starting in mid-session and running to the end of the recording, the second starting near the session's
    start. The power-of-two length suggests a fault in the conversion; whether the train holds one unit's
    spikes could not be told.
- kind: other
  about: data
  severity: minor
  datasets:
  - '000044'
  statement: In Gatsby-08022013, 263 976 spikes (4.7%) fall after the end of the last epoch (30 413.6
    s), up to 32 002.4 s, in no epoch.
- kind: metadata_error
  severity: minor
  datasets:
  - '000044'
  statement: The position series of the maze stores its sampling interval (0.0256 s) in the attribute
    rate of starting_time, which NWB defines in Hz. Read as a rate the series would last 3 154 777 s;
    read as an interval it lasts the 2067.5 s of the maze epoch.
- kind: identifier_missing
  severity: minor
  datasets:
  - '000044'
  statement: The units table ids of the cited version (id 18 for the paper's "unit 9") differ from those
    of the latest version (id 119 for the same row, with a cluster_id of 19), and neither holds the number
    the paper uses. The paper's unit can be found only as a row position, and only because its spike count
    and IETs match the paper's figure.
- kind: other
  about: data
  severity: none
  datasets:
  - '000044'
  statement: No spike train is deposited twice (no two units share their spike count and first and last
    spike, within or across the eight sessions), and the spikes and the maze position share a clock (the
    excitatory population rate correlates with running speed at r = 0.618 at zero shift and at a median
    absolute r of 0.043 beyond 60 s). The epochs differ from the paper's description of 45 minutes of
    maze and four hours of rest each, with maze epochs of 0.57 to 1.54 h and first rest periods of 2.98
    to 5.37 h.
- kind: other
  about: paper
  statement: The paper describes its neuronal data as recordings of pyramidal cells, but its representative
    unit (row 9 of Achilles-10252013) is labelled inhibitory in the cited version and interneuron in the
    latest. Which units the paper analysed, and whether it used the cell types, is not said. Under the
    KS fits the inhibitory units show the paper's pattern far more often than the pyramidal ones (0.68
    to 0.74 of 128 against 0.08 to 0.45 of 562).
- kind: paper_inconsistency
  statement: Section IV gives the zeta distribution (Eq. 15) as P(k) and calls Eq. 16 the memory function
    that Eq. 9 gives for it, but Eq. 9 applied to the zeta distribution gives q(1) = 0.255, not the 0.354
    of Eq. 16. The incremental algorithm with Eq. 16 therefore draws merging numbers with P(K >= k) =
    k^-(gamma-1) (mean 2.59), and the decremental one with Eq. 15 draws zeta numbers (mean 1.93), so the
    two are not statistically equivalent as set up.
- kind: methods_unavailable
  statement: Question for the authors. Which power-law fit was used for burst sizes and merging numbers,
    discrete or continuous, and with xmin chosen by the KS distance or fixed? The paper cites Clauset
    et al. and the powerlaw package without its options or version. On this dataset the discrete fit with
    xmin by the KS distance gives the paper's beta of 2.35 for unit 9, and the choice decides whether
    other neurons show the pattern (23% of pyramidal units under it, 45% under the package's continuous
    default with xmin by the KS distance, 89% to 91% with the continuous fit from xmin = 1).
- kind: methods_unavailable
  statement: Question for the authors. Which grid of timescales was used, and which units were meant by
    "other sequences in the datasets"? The Figure 2 labels fit 41 log-spaced points over the relevant
    range, which this attempt used; whether all units or the pyramidal ones were analysed is not said.
    Which merging-number distribution did the decremental algorithm draw from, given that Eq. 16 is not
    the memory function of the zeta distribution?
- kind: methods_unavailable
  statement: Question for the authors. Which release of powerlaw was used, and was the exponent bounded?
    Release 2.0.0 caps the power-law exponent at 3 by default and lets the cap move the KS choice of xmin;
    the method of Clauset et al. that the paper cites has no cap. On the representative unit the cap decides
    the collapse of the merging-number exponents (largest deviation from the median 0.490 capped, 0.538
    unbounded, against a band of 0.5) and narrows the spread of beta at the smallest timescales (2.907
    capped, 3.349 unbounded at 55 ms). This attempt assumed an unbounded exponent.
