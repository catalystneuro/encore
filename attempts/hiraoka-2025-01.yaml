- claim: fig2-neuron-burst-size-heavy-tail
  outcome: reproduced
  notebook: reproduce_hiraoka_2025.ipynb
  output: claim:fig2-neuron-burst-size-heavy-tail
  notes: With xmin chosen by the KS distance, discrete or continuous, the power law is supported (R >
    0, p < 0.05) at 8 of 8 timescales of grid (a) and 40 of 40 of grid (b), all of those below 3000 ms
    included, with the exponent unbounded or capped at 3. The claim holds under one reading of O3, as
    the claims file's rule asks. With xmin = 1 the discrete fit is supported at 5 of 8 and 29 of 40, not
    all below 3000 ms; the continuous fit at 7 of 8 with all 7 below 3000 ms (grid a) and 32 of 40 with
    32 of 34 below 3000 ms (grid b). On the IETs shuffled in time, a renewal reference, no timescale is
    supported under any of the five seeds (0 of 5 or 6, grid (a)).
  deviations:
  - 'The exponent of every fit is unbounded (alpha in [1, inf)), an assumption: the locked powerlaw 2.0.0
    caps the power-law alpha at 3 by default (Power_Law.DEFAULT_PARAMETER_RANGES) and its find_xmin discards
    every candidate xmin whose fit reaches the cap, while the estimator the paper cites (Clauset et al.,
    ref. 36, Section 3) has no upper bound and neither had the package as its paper describes it (Alstott
    et al., ref. 37; releases 1.x require only alpha > 1). The paper gives no version. The capped fits
    are run beside the unbounded ones (readings with suffix _cap3).'
  - The grid of delta is open (O4). Grid (b) fits a whole number of log10 steps near 0.052 between the
    ends of the relevant range (40 steps of 0.0514 for this unit), as the Figure 2 legend says the values
    shown span the entire range of relevant timescales; every 5th point then gives the delta' labels of
    Figure 2 and every 8th the delta labels.
- claim: fig2-neuron-beta-stable
  outcome: not_reproduced
  notebook: reproduce_hiraoka_2025.ipynb
  output: claim:fig2-neuron-beta-stable
  measured: 2.354
  notes: Neither reading of the criterion holds under any fit or grid. Under the discrete KS fit on grid
    (b) the median beta below 3000 ms is 2.354, inside the band, and 27 of 34 estimates are within 2.35
    +/- 0.235, every one from 126.5 ms to 3000 ms (1.4 decades); at 55 ms beta is 3.349, so the range
    is 1.079 against the 0.47 of reading (b). With the exponent unbounded the ranges are 0.679 to 1.360
    over the fits and grids (medians 2.316 to 2.433 under the KS fits, 1.521 to 1.750 with xmin = 1);
    capped at 3 the KS ranges are 0.552 to 0.705 and also fail. The standard errors are at most 0.088.
    The paper's value holds from about 130 to 3000 ms but not at the lower end of the relevant range.
  deviations:
  - Measured is the median under the discrete KS fit on grid (b); the other readings are in the notebook.
  - 'The exponent of every fit is unbounded (alpha in [1, inf)), an assumption: the locked powerlaw 2.0.0
    caps the power-law alpha at 3 by default (Power_Law.DEFAULT_PARAMETER_RANGES) and its find_xmin discards
    every candidate xmin whose fit reaches the cap, while the estimator the paper cites (Clauset et al.,
    ref. 36, Section 3) has no upper bound and neither had the package as its paper describes it (Alstott
    et al., ref. 37; releases 1.x require only alpha > 1). The paper gives no version. The capped fits
    are run beside the unbounded ones (readings with suffix _cap3).'
- claim: fig2-neuron-beta-decrease-follows-gamma
  outcome: reproduced
  notebook: reproduce_hiraoka_2025.ipynb
  output: claim:fig2-neuron-beta-decrease-follows-gamma
  notes: On grid (b), under both KS fits with the exponent unbounded, beta at delta' is below gamma for
    40 of 57 pairs with delta < 3000 ms (38 for the capped continuous fit); above 3000 ms the 6 grid points
    give a Spearman rho of -0.829 (p = 0.042) for beta, which falls from 2.064 to 1.867 (discrete), and
    gamma falls with delta for each ratio (rho -0.714, -0.964 and -0.943). Part (2) rests on 6 points
    at p = 0.042. Grid (a) has one point above 3000 ms, so parts (2) and (3) are not judged on it; its
    part (1) holds (7 of 12). Under xmin = 1 part (1) fails (24 of 57), so the outcome rests on the KS
    fits, as O3 allows for a claim on exponents. The paper names no test; the claim's "seems to be driven"
    is not tested beyond these correlations.
