- claim: fig2-exponents-above-two
  outcome: reproduced
  notebook: reproduce_hiraoka_2025.ipynb
  output: claim:fig2-exponents-above-two
  notes: Under the KS fits with the exponent unbounded both gamma and beta at delta' exceed 2 in 15 of
