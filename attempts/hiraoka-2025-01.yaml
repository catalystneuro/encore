- claim: fig2-iet-broad
  outcome: reproduced
  notebook: reproduce_hiraoka_2025.ipynb
  output: claim:fig2-iet-broad
  measured: 17362
  notes: tau_max over tau_min is 17 362, 4.24 decades, against the three decades of the criterion; the
