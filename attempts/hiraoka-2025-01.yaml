outcomes:
- claim: fig2-neuron-representative-sequence
  outcome: reproduced
  notebook: reproduce_hiraoka_2025.ipynb
  output: claim:fig2-neuron-representative-sequence
  measured:
  - 228356
  - 1.05
  - 18229.7
  notes: Under reading (b) of O1, row 9 of the units table of Achilles-10252013 counted from 0 (unit id
    18), the unit has 228 356 spikes, tau_min 1.050 ms and tau_max 18 229.7 ms. It is the only unit of
