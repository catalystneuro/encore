- claim: expert-sessions
  outcome: not_reproduced
  notebook: reproduce_bech_2026.ipynb
  output: claim:expert-sessions
  measured:
  - 49
  - 318
  - 24.73
  notes: The Methods' rule (lower bound of the 95% bootstrap interval of the mean block contrast above
    0.375), applied to the 1434 behavioural sessions with context epochs, selects 318 sessions in 49 mice
    with 24.7 blocks per session, outside 201 ± 20.1 and 41 ± 4.1 (blocks within 23 ± 2.3). With 20-trial
    blocks (the code's variant) 316 sessions in 48 mice. Restricted to the code's pool list, 293 sessions
    in 42 mice. The rule keeps 189 of the 201 sessions of the code's expert list; 12 list sessions have
    a lower bound below 0.375 (lowest 0.299). The code's list itself has 41 mice, 201 sessions and 23.9
    blocks per session, as the paper says, so the paper's set is not the rule applied to all sessions.
  deviations:
  - Blocks are the context runs of the trial table, which equal the context epochs in 99.6% of sessions;
    three files have no epochs and are left out.
