- claim: fig2c-catch-little-effect
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_bech_2026.ipynb
  output: claim:fig2c-catch-little-effect
  notes: Sites with an effect in catch trials (of 41), W- and W+, null (i) 2 and 2 at d' 0.5, 0 at 0.8
    and 2; null (ii) 7 and 11 at 0.5, 0 and 3 at 0.8, 0 at 2. Five readings give at most 3, null (ii)
    at 0.5 does not. Largest mean |dP| 0.118. The readings give different outcomes, so the claim is blocked
    as its criterion says. Open for the authors (methods_unavailable finding). The block-label null of
    the Methods keeps the laser effect inside the null (laser trials keep their outcomes, only their context
    labels move), so under it no site reaches d' 0.5 in whisker or auditory trials; the legend's trial
    shuffle gives the map the paper describes. The d' at which a site counts as affected is not stated.
  deviations: &id001
