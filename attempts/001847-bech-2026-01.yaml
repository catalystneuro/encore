findings:
- kind: metadata_insufficient
  statement: The files do not record the mouse lines. The subject genotype is "WT" for every mouse but
    one ("Ai148"), and strain is C57BL/6 for all, so no file says which mice carry VGAT-ChR2, jRGECO1a,
    GCaMP6f, tdTomato or GFP, or which received no opsin. The optogenetic, control and widefield groups
    can only be formed from the session lists of the paper's code.
- kind: metadata_insufficient
  statement: Session groups are not recorded in a usable form. Muscimol and Ringer days, the injected
    area, baseline and injection days, and Context Off days have no field; the pharmacology, surgery and
    virus fields are "na" in every file, and most muscimol and Ringer sessions are typed behaviour_only_session.
    The Context Off trials still name pink and brown noise in context_background.
- kind: metadata_error
  statement: The DeepLabCut series (processing/behavior/BehavioralTimeSeries) carry the unit "seconds"
    and a conversion of 1/28 (side camera) or 1/24 (top camera) for every series, likelihoods and angles
    included. The positions are in pixels, the whisker_angle series is in degrees (it reproduces the paper's
    97.3 and 98.6 degrees unconverted), and pupil_area is in square pixels, for which the conversion would
    have to be 1/28 squared.
- kind: metadata_insufficient
  statement: No trial table column has a description (all "None"), and the perf codes 0 to 6 are not explained
    in the files; they were read from their cross-tabulation with trial type and lick (6 is an early lick).
- kind: other
  statement: lick_time minus the stimulus time is about 100 ms longer than the paper's spout-contact times
    (470 against 370 ms for auditory W+), while the context differences and the tests match; the response
    window opens 100 ms after the stimulus. What lick_time measures is not described.
- kind: format_error
  statement: Three files (PB185_20240801_095038, PB186_20240801_110359, PB189_20240902_155436) have no
    BehavioralEpochs, and in some files the DLC timestamps and data differ in length (PB177_20240529_121819,
    PB192_20241121_122848).
- kind: selection_undocumented
  statement: The Methods' expert rule (block contrasts significantly above 0.375) applied to the dandiset
    selects 318 sessions in 49 mice; the paper's 201 sessions in 41 mice are the code's fixed list, which
    includes 12 sessions the rule rejects. How the list was chosen is not stated.
- kind: methods_unavailable
  statement: Question for the authors on Figure 2C-F. The Methods build the opto-map null by shuffling
    block labels; the legends and the code shuffle all trials. The block-label shuffle keeps the laser
    effect inside the null and finds no affected site at d' 0.5; the trial shuffle gives the published
    map. Which null was used, and at what d' is a site counted as affected (the colour scale starts at
    0.5)? Seven claims are blocked on this.
- kind: methods_unavailable
  statement: Question for the authors on Figure 3C. Which trials are pooled for the jaw-opening onset
    of 108 ± 24 ms? Correct whisker trials (Figure 3B) give 135 ms, W+ whisker hits 82 ms, and the code's
    auditory and whisker hits 86 ms; the attempt assumed the code's set.
- kind: data_missing
  statement: The light-sheet images of RSC axons (Figure 3, figure supplement 1C) are not in the dandiset
    and no other deposit is named.
