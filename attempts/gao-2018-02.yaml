findings:
- kind: data_missing
  statement: >-
    Both datasets hold only the ALM recordings during CN photo-activation (34 sessions, 9 mice)
    and CN photo-inhibition (20 sessions, 4 mice). The lesion experiments, the behavior-only
    sessions (including response-epoch and 1.3 s photostimulation), the 878 CN units, lick times,
    video, the VGAT-ChR2-EYFP experiments, the anatomy, and the tenth mouse of the Fig. 2 ALM
    recordings are not deposited; 24 of the 46 claims in the claims file cannot be tested.
  datasets:
  - "000007"
  - crcns-alm-4
- kind: data_missing
  statement: >-
    DANDI:000007 lacks trials that CRCNS:alm-4 holds with GoodTrials = 1 and a valid
    photostimulation code; ANM314746 2015-10-22 has 258 of 284 (the last 26 missing) and ANM314757
