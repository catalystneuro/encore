  deviations:
  - >-
    The 4 recorded L7-cre x Ai32 mice (CD8, CD12, CD13, CD14) from recording sessions, in place of
    the 3 (CD12, CD13, CD16) and 7 behavior mice of Extended Data Fig. 2g and 2h; late-delay
    photo-inhibition is not deposited.
  - >-
    The files put the fastigial fiber on the same side as the recorded ALM for CD12, CD13 and CD14,
    against the paper's contralateral design; both side assignments were run and both reproduce.
