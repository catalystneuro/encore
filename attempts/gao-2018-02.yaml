- claim: fig1g-fastigial-activation-early-sample-no-effect
  outcome: reproduced
  notebook: reproduce_gao_2018.ipynb
  output: claim:fig1g-fastigial-activation-early-sample-no-effect
  notes: >-
    Early sample photo-activation (code 1) against control in the 6 fastigial mice: contralateral
    trials 0.857 to 0.826 (change -0.031, one-sided bootstrap p = 0.36), ipsilateral 0.887 to 0.899
    (+0.012, p = 0.37; one-sided p for a drop 0.64); pooled 0.870 to 0.861 (p = 0.42). Both p >
    0.05. Without the four sessions whose laser traces disagree with their codes (MISMATCH in the
    notebook) p = 0.29 and 0.81. Trial-level checks, less conservative than the bootstrap, also find
    no drop (one-sided z-test p = 0.28, session-stratified Cochran-Mantel-Haenszel p = 0.35).
  deviations:
  - >-
    Tested on the behavior of the ALM recording sessions (21 sessions, 6 mice), where
    photostimulation was on about a third of trials; the paper's Fig. 1g uses behavior sessions,
    which are not deposited. Supplemental Table 1 gives the same 6 mice for both.
  - >-
    Trials with GoodTrials = 0 or a NaN photostimulation code are left out, as in the deposited
    analysis scripts; the Methods do not mention them.
- claim: fig1g-fastigial-activation-delay-errors
  outcome: reproduced
  notebook: reproduce_gao_2018.ipynb
  output: claim:fig1g-fastigial-activation-delay-errors
  notes: >-
    Early delay photo-activation (code 2, light for 0.455 s from delay onset, ending 0.845 s before
    the go cue by the laser traces) lowers pooled performance from 0.870 to 0.630 (change -0.240; no
    resample of 10,000 without a drop, p < 0.0001). Every mouse drops, by 0.083 to 0.450. Without
    the MISMATCH sessions 0.871 to 0.619 (p = 0.0004).
  deviations:
  - Behavior from the ALM recording sessions, not the behavior sessions of Fig. 1g.
- claim: fig1h-fastigial-activation-delay-bias
  outcome: reproduced
  notebook: reproduce_gao_2018.ipynb
  output: claim:fig1h-fastigial-activation-delay-bias
  notes: >-
    Reading (a), early delay photo-activation. ANM314760 and BAYLORNL15 drop on contralateral trials
    (by 0.726 and 0.719, p < 0.0001) with no ipsilateral drop; ANM314746 and ANM314757 drop on
    ipsilateral trials (by 0.391, p = 0.003, and 0.221, p = 0.03), more than on contralateral
    trials. ANM314758 and BAYLORCD6 show neither significantly. Without the MISMATCH sessions the same
    four mice are biased (ipsilateral p = 0.018 and 0.005). Reading (b), the 1.255 s whole-delay
    experiment, is not in the datasets.
  deviations:
  - Recording-session behavior; reading (b) not testable.
  - >-
    Contra and ipsi are relative to the manipulated fastigial nucleus; for these mice the files'
    fiber side and the recorded ALM are on opposite sides, as the paper states.
