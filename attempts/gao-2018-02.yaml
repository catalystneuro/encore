- kind: code_mismatch
  statement: >-
    The analysis scripts deposited with CRCNS:alm-4 differ from the Methods in places. The
    photostimulation selectivity scripts fix each neuron's preferred trial type from 5 trials of
    each type, where the Methods say 10 for ALM; the coding direction script averages cd_t over
    windows starting from 3.0 s to 0.4 s before the go cue (pre-sample, sample and delay), where the
    Methods say the delay epoch; the selectivity test uses correct trials in the Fig. 2 script and
    correct and error trials in the photostimulation scripts.
- kind: methods_unavailable
  statement: >-
    For the response latencies (4.5, 8.3 and 7.1 ms), how is a 10 ms bin placed in time (start,
    centre or end) and which window decides that a neuron is significantly modulated? Labelling by
    start gives 3.6 ms for fastigial and 3.3 ms for dentate photo-activation, by centre 8.6 and 8.3
    ms, so no single choice here matches both reported values; for CN photo-inhibition every choice
    gives 15 ms or more.
- kind: methods_unavailable
  statement: >-
    For the fractions captured by the coding direction (64.1% of selectivity, 27.0% of variance),
    are they ratios of RMS or of squared RMS, is selectivity measured on the trials that estimated
    the cd or on independent ones, and is activity variance over single trials or condition means?
    Only squared ratios on independent trials with single-trial variance give both values here (66.3%
    and 28.4%); other combinations give 73% to 85% and 36% to 59%.
- kind: methods_unavailable
  statement: >-
    Which neurons were tested for photostimulation effects (the minimum numbers of control and
    photostimulation trials) and which sessions entered the coding direction analysis? With the
    deposited scripts' rules 177 to 190 ALM neurons are modulated by fastigial photo-activation
    (paper 227) and 20 of 34 sessions enter the coding direction analysis (paper 28 of 39).
