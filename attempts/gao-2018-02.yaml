- claim: fig1d-fastigial-lesion-contra-choice
  outcome: blocked
  blocked_by: data_missing
  notes: >-
    Neither dataset holds the lesion experiments. DANDI:000007 holds 54 ALM recording sessions and
    CRCNS:alm-4 the same 54 sessions (34 during CN photo-activation, 20 during CN photo-inhibition);
    the CRCNS descriptor lists no lesion data, and no other deposit is named by the paper.
- claim: fig1e-fastigial-lesion-slow-initiation
  outcome: blocked
  blocked_by: data_missing
  notes: >-
    No lesion sessions and no lick times in either dataset (the trial tables give the outcome and an
    early-lick flag only; the CRCNS time series hold the laser command and power, not the lick
    contacts).
- claim: fig1d-dentate-lesion-no-effect
  outcome: blocked
  blocked_by: data_missing
