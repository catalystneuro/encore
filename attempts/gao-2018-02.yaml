- claim: fig1k-inhibition-delay-bias
  outcome: reproduced
  notebook: reproduce_gao_2018.ipynb
  output: claim:fig1k-inhibition-delay-bias
  notes: >-
    Reading (b), 1.3 s delay photo-inhibition (code 6): with contra and ipsi from the paper's rule
    (CN contralateral to the recorded ALM), BAYLORCD12 and BAYLORCD13 drop on contralateral trials
    (by 0.464, p = 0.002, and 0.385, p = 0.009) and BAYLORCD14 on ipsilateral trials (0.234,
    p = 0.008); with the files' CN side the labels of CD12, CD13 and CD14 swap, giving 1 contra-
    and 2 ipsi-biased mice. Both give mice biased each way. Reading (a), 0.5 s early delay (code 5),
