- claim: tuning-tiles-track
  outcome: reproduced
  notebook: reproduce_prince_2025.ipynb
  output: claim:tuning-tiles-track
  notes: 'Peaks of encoder tuning curves over all units with spikes in included sessions (CA1 2854, PFC
    1790): every track bin is some unit''s peak in both regions, and the only bins that are no unit''s
    peak are the four bins lying wholly in the gaps between track segments (34, 35, 42, 43). Peaks fall
    about equally on the central arm and the goal arms (CA1 1422 and 1432, PFC 881 and 909). Reading (b)
    holds with no empty track bin.'
  deviations:
  - Reading (a) asks that every one of the 50 bins be a peak. Four bins lie wholly in the artificial gaps
    between track segments (Methods, Behavioral analysis), where the animal never is, so no tuning curve
    can peak there; reading (a) is judged on the 46 track bins.
  - Decoding is a numpy implementation of pynapple decode_1d with a uniform prior, on tuning curves from
    within-trial locomotion samples (|rot| + |trans| of the acquisition series above 1000, S3) of 80%
    of delay only trials (train_test_split, random_state 21).
  - Sessions are included with at least 20 units in the region and at least 50 encoder training trials
    (S1). The paper's trial counts are higher (for CA1 1295 switch and 926 delay only correct trials against
    1158 and 825 here), partly because the units of five sessions carry no region (finding). The Methods'
    reading of the 50-trial rule (final-task trials) is shown for every test.
