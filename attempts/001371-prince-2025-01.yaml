- claim: fig6b-hpc-new-lower-incorrect
  outcome: reproduced
  notebook: reproduce_prince_2025.ipynb
  output: claim:fig6b-hpc-new-lower-incorrect
  measured:
  - 0.063
  - 0.0077
  notes: 'Switch trials (1241 correct, 395 incorrect), Methods GLM residuals over 0 to 1.5 s: ANOVA p
    = 6.5e-5; correct minus incorrect, new arm +0.077 (z = 3.72, Tukey p = 0.0011). Trial means 0.063
    (correct) and 0.008 (incorrect), within tolerance. The code''s per-session GLM gives p = 0.0014. The
    reader''s answer of 2026-11-02 (questions/001371.yaml) changed S1 to count the final-task trials of
    the session for the 50-trial rule, so this claim was re-run on 55 CA1 and 46 PFC sessions in place
    of 47 and 37. The code''s count gives p = 0.0016; the outcome is unchanged.'
  deviations:
  - The ANOVA is a Wald test of the combined predictor in a statsmodels MixedLM (random intercepts for
    animal and session within animal); lme4 with Kenward-Roger degrees of freedom is not used. Tukey p
    values use the studentized range over all levels with large degrees of freedom, as emmeans pairs()
    does for large samples.
  - Decoding is a numpy implementation of pynapple decode_1d with a uniform prior, on tuning curves from
    within-trial locomotion samples (|rot| + |trans| of the acquisition series above 1000, S3) of 80%
    of delay only trials (train_test_split, random_state 21).
  - Sessions are included with at least 20 units in the region and at least 50 final-task trials of the
    session, warm-up trials left out (S1 as a reader amended it on 2026-11-02; Methods, Decoding analyses,
    "less than 50 trials for the behavioral session"), giving 55 CA1 and 46 PFC sessions against the paper's
    56 and 47. The paper's trial counts are higher (for CA1 1295 switch and 926 delay only correct trials
    against 1241 and 871 here), partly because the units of five sessions carry no region (finding). The
    code's count of encoder training trials (47 CA1 and 37 PFC sessions), the variant S1 names, is shown
    for every test.
  - The GLM is fitted on all decoded trials of all types and animals together (Methods, Generalized linear
    model analysis), Poisson family as in the code, with rotational velocity mirrored like the decoding
    (S5) so its sign is relative to the initial side; the code's per-session GLM on the trials of the
    comparison is shown as a variant.
