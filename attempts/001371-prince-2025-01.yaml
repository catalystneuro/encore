findings:
- kind: metadata_insufficient
  statement: The units tables of five sessions (S20-210517, S28-211114, S29-211104, S29-211105, S34-220617;
    633 units) hold only the phy columns, with no region, cell type or electrode group. Their ch values
    (0 to 63) do not say which of the two 64-channel probes a unit is on, so they cannot be assigned to
    CA1 or PFC. With them, the unit count equals the paper's 6449; without them, CA1 has 3545 units and
    PFC 2271 against 3892 and 2557.
- kind: metadata_error
  statement: Position (processing/behavior/position) is labelled meters, but its values are in virtual
    track units (y from -117 to 286, the code's track ends at 285).
- kind: metadata_error
  statement: View angle is labelled degrees, but its values run from -1.047 to 1.047, radians (plus or
    minus 60 degrees).
- kind: metadata_error
  statement: The theta phase in processing/ecephys/decomposition_phase is labelled degrees, but its values
    run from -pi to pi, radians.
- kind: metadata_error
  statement: 'The trials column turn_type is described as {''right'': 1, ''left'': 2}. In the data, correct
    delay only trials with turn_type 1 all end at negative x (2521 of 2521) and have choice 1, and the
    paper''s code maps turn_type 1 to left and puts the left arm at negative x; the description has the
    two labels the other way round, or names sides by a convention the files do not state.'
- kind: paper_inconsistency
  statement: The Methods and the Figure 1b legend give rolling windows of 40 trials, but the reported
    window counts (6252 delay only, 1002 switch, 117 stay) are those of 15-trial windows, the code's default;
    40-trial windows give 4636, 239 and none.
- kind: paper_inconsistency
  statement: Supplementary Table 1 lists 8104 delay trials; the final-task delay only trials number 7172,
    the Results' count, and the 932 warm-up trials (maze_id 3) make up the difference. The trial-type
    fractions of the Results (65, 25 and 10%) are not those of the trials (0.737, 0.189, 0.074).
- kind: code_mismatch
  statement: The paper's code counts the encoder training trials (80% of delay only trials) for the 50-trial
    session rule, where the Methods count the trials of the session; on this dataset the Methods' count
    gives 55 CA1 and 46 PFC sessions, close to the 56 and 47 of Supplementary Table 2, and the code's
    count 47 and 37. A reader amended S1 to follow the Methods (answer of 2026-11-02), and the code's
    count changes one outcome here (fig5d-stay-hpc-like-delay).
- kind: code_mismatch
  statement: The paper's code reads the theta phase stored in the file (general/lfp.py), where the Methods
    describe a phase from peaks and troughs of the filtered LFP; the two agree closely at the decoding
    bins (mean cosine of their difference, median 0.975 over 59 sessions, lowest -0.49), and every theta
    outcome is the same with either.
