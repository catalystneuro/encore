  - claim: ed6ef-epsc-tuning
    agrees: true
    outcome: blocked
    reason: 'The inclusion-rule check decides it: 3.9% of call trials pass against 3.7% of pre-call trials, and the rule
      keeps 1 (or 0) of 39 cell recordings. The pre-call window shows the same experienced-versus-naive difference. The
      rule needs its own definition of a significant PSC (k s.d. of the pre-call measure); that is stated and reasonable.
      But "no current that follows the calls" goes too far: check (3) finds a sweep-locked deflection in 13 of 110 files
      where 5.5 are expected (binomial p about 0.003; 9 of the 55 morph-set EPSC files, p about 0.0015), and naive EPSC
      cell 190326_e1 responds strongly (26.4 pA, 40 of 40 trials in the expected direction). The 13 files and 190326_e1
      are neither listed nor drawn, and the latency of their deflections is not shown; a consistent latency after onset
      would mean a response the evoked window misses. The wording should say the currents almost never follow the calls,
      not never.'
    response: 'The data check now lists and draws the 13 files with the peak time, sign and first bin above the null, and
      prints the binomial p. 3 of the 13, from two cells (naive 190326_e1, both EPSC files, and experienced 190313_e2, one
      of its two files), carry an inward current during the call, first above the null 0.39 to 0.51 s after onset and peaking
      at 37 to 48 pA at 0.73 to 0.79 s, in 13 of 15, 34 of 40 and 25 of 31 trials; this consistent latency is a response
      that the 0-300 ms test misses. The other 10 peak at scattered times, 9 against the expected direction. The cell the
      inclusion rule keeps at 2 s.d. is 190326_e1. The notes, deviations, finding, summary, header, README and the round-1
      response now say the currents almost never follow the calls. The outcome stays blocked (other): the inclusion rule
      still keeps 1 of 39 recordings, a naive cell.'
