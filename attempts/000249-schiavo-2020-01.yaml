  - claim: ed3e-prototype-responsive-fraction
    agrees: true
    outcome: blocked
    reason: 'Agreed; no misreading of the paper by the claims file found. All 20 imaging notes say "The movies show no peak
      at the 0.1 Hz call rate from which onsets could be recovered", but cells 10-11 now say the 10.24 s trial period is
      found and the phase of the trials could be recovered. The "metadata_error" finding on the call rate is not an error:
      40 frames (10.24 s) is 0.098 Hz, the Methods'' "0.1 Hz" rounded, and it is measured on two call files and one tone
      file. "No clear cycle" in cell 11 is a judgement, not a result: in the three-prototype file folding at 3 x 40 frames
      beats the nearby periods by 0.050, against 0.033 at 1x, 0.024 at 2x and 0.026 at 6x, the largest excess seen. Only
      one three-call file and one morph file were folded, and the 3 x 40 excess was not checked on other files; with no
      ROIs this is unlikely to change the 20 imaging outcomes, but the "cannot be recovered" statement rests on two files.'
    response: 'The 20 notes now say that folding recovers the trial period and, in most three-call movies, a cycle of three
      trials, but not which call is at which position. One three-call movie of each of 38 subjects is now folded: the excess
      at 3 x 40 frames is above those at 2x and 4x in 31 of 38 (median 0.016 against 0.007 and 0.006) and the largest of
      six multiples in 18, so the trials appear to recur in a fixed cycle of three, where the Methods say pseudorandom.
      "No clear cycle" is withdrawn. The call-rate finding is now kind other and records the 0.098 Hz period as the Methods''
      0.1 Hz rounded, with the cycle of three. The outcome stays blocked (metadata insufficient): no file says which call
      is played at which position of the cycle or on the first trial, and there are no ROIs.'
