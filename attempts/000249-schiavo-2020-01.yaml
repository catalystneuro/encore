- claim: ed9b-oxytocin-enhances-spiking
  outcome: reproduced
  assumed: true
  notebook: reproduce_schiavo_2020.ipynb
  output: claim:ed9b-oxytocin-enhances-spiking
  notes: In 9 oxytocin cells spike probability rises from 0.035-0.051 to 0.48-0.56 15 to 30 minutes after wash onset
    (Friedman chi2 = 51.35, p = 6e-08). Dunn's comparisons, Bonferroni over the five stimuli, give stimuli 2 to
    5 adjusted p 0.022, 0.014, 0.0011, 0.020 and stimulus 1 p = 0.071 (paper 0.009, 0.008, 0.001, 0.04 and 0.34),
    although stimulus 1 also rises (0.044 to 0.48). 5 ACSF controls show no change (Friedman p = 0.56, adjusted
    p >= 0.79); counting the control window from the first baseline sweep brings in all 7, again with no change
    (Friedman p = 0.39, adjusted p >= 0.47). Over all 45 pairs only stimulus 4 is significant (p = 0.0098), and
    Wilcoxon tests find stimulus 1 significant as well (p = 0.0078), so the outcome rests on the comparison family.
  deviations:
  - 'Assumed: the Friedman test runs over ten columns (baseline and post for each of five stimuli), with Dunn''s
    comparisons of baseline against post for each stimulus, Bonferroni over five; the legend gives one p per stimulus,
    which fits five planned comparisons. All 45 pairs and Wilcoxon tests are variants and change the outcome.'
  - A spike is a crossing of 0 mV between a pulse and the next, a standard choice.
  - Baseline is the files the spreadsheet labels baseline or PRE (the first file for one control cell with no such
    label; the notebook prints each file's label and role); for controls the 15 to 30 minute window starts at the
    first sweep after the baseline files, a reading of "following baseline acquisition", and from the first baseline
    sweep as a variant.
  - 'Under the main reading two of the 7 controls (191202B, 191202C) have no sweeps in the window: each has one
    60-sweep baseline file (0 to 11.8 min) and one later file ending 19.3 and 24.8 min after the first baseline sweep.'
findings:
- kind: data_missing
  statement: The NWB files hold only raw, unaligned two-photon movies. There are no ROIs or fluorescence traces,
    no stimulus times, no trial tables and no record of which call each trial played (pseudorandom order, Methods),
    so none of the paper's 20 imaging findings can be tested from the dandiset. The figshare imaging items
    hold the same movies.
- kind: data_missing
  statement: The behavioural data of Figs. 1c, 4c-e and Extended Data Figs. 2 and 8-9 (pup retrieval, latencies,
    y-maze) and the vocalization recordings of Fig. 1a are in neither the dandiset nor the figshare collection it
    links. The paper's figshare DOI 10.35092/yhjc.c.5037737 does not resolve.
- kind: metadata_insufficient
  statement: Groups (experienced or naive, dam, CH+575, opto-OT, cell type, hemisphere) are given only in free-text
    experiment descriptions; the indicator and location fields are "unknown" in every file, and the start of cohousing,
    needed for retrieval onset, is not recorded.
- kind: metadata_error
  statement: Three recordings (sessions of 2018-03-08 named plus24hrs_postexp1) are deposited under both sub-NV58
    and sub-NV63, with the same start times and frames; nothing says to which mouse they belong.
- kind: metadata_error
  statement: Subjects EV56 and EV62 are described as NV56 and NV62 in their own experiment descriptions, and the
    five tones-only mice carry no experience group in theirs; the figshare item titles give it (EV56_Experienced_Exc
    and so on).
- kind: metadata_insufficient
  statement: The in vivo whole-cell spreadsheet of experienced females does not say which cells come from dams,
    so the dams-against-EVs comparison of Extended Data Fig. 6g,h cannot be made.
- kind: metadata_error
  statement: In the in vivo whole-cell article of experienced females, file 19424013 is listed at -70 mV but carries
    about +560 pA throughout, as at a depolarized holding potential.
- kind: data_missing
  statement: Files listed in the figshare spreadsheets but not deposited, 193260007 (naive in vivo, listed number
    with an extra digit) and 19o11005 (slice, Cell 20 at 575 ms).
- kind: format_error
  statement: The operant touch-time csv files print times with five significant digits, so after 1000 s of a session
    they step by 0.1 s and 99% of samples repeat the previous value; press durations can be resolved only to that
    step.
- kind: paper_inconsistency
  statement: The Methods give the in vivo morph set as ISIs of 125, 225 and 575 ms; the microphone channel of the
    recordings shows 125, 275 and 575 ms with the prototype, as the figure legends say, played in a fixed order,
    not pseudorandom.
- kind: other
  statement: 'In the in vivo whole-cell recordings the current almost never follows the played calls: the evoked
    measure is in the expected direction at p < 0.05 in 2 of 39 cell recordings (3 of 39 before the call), no cell
    responds 0-300 ms after onset, 13 of 110 files have a sweep-locked deflection (5.5 expected by chance) of which
    3, from two cells (190326_e1 and 190313_e2), carry an inward current during the call from about 0.4 s after
    onset, and the Methods'' inclusion rule keeps at most 1 of 39. The experienced recordings are about twice as noisy as the naive ones
    (baseline s.d. 11.4 against 5.3 pA), and the largest-trial measure gives the same experienced-naive difference
    before the call as during it.'
- kind: methods_unavailable
  statement: For the paper's authors (fig1i-operant-prototypes, ed5b-press-count-unchanged), which gap between touch
    samples ends a lever press, and whether session 1 was compared with session 8 or the first with the last sessions.
    The readings give different outcomes for the fast and slow groups.
- kind: methods_unavailable
  statement: For the paper's authors (the in vivo claims and ed9b-oxytocin-enhances-spiking), how a significant
    PSC was defined for the inclusion rule, how many of the "largest 5-10 evoked trials" were averaged per cell
    and whether they were ranked by absolute value, and the Dunn comparison family of Extended Data Fig. 9b.
- kind: other
  statement: The imaging Methods say the calls were played in a pseudorandom order at 0.1 Hz. The movies recur every
    40 frames (10.24 s, 0.098 Hz) and the tone files every 20 frames (5.12 s); in 31 of 38 three-call movies (one
    per subject) folding at three trial periods stands above two and four, as a fixed cycle of three calls would.
    No file says which call is played at which position of the cycle.
- kind: other
  statement: The first syllable of many played calls is much quieter than the rest on the microphone channel of
    the in vivo recordings; an onset taken at the first loud syllable comes a median 193 ms late.
