outcomes:
- claim: subject-group-link
  outcome: partially_reproduced
  notebook: reproduce_schiavo_2020.ipynb
  output: claim:subject-group-link
  notes: 'Every subject has a figshare item titled with its mouse id (54 of 54), and the titles agree with the NWB
    experiment descriptions on experience group (49 of 49 where the description gives one), cell class (54 of 54)
    and right hemisphere (54 of 54). The five tones-only mice take their group from the titles, which the criterion
    allows: EV56 and EV62 experienced (their descriptions call them NV56 and NV62), NV64, NV66 and NV140 naive.
    Counts match the paper for EV excitatory left (9), EV interneurons (5), EV right cortex (4), dam (1), CH+575
    (6), CH+575 opto-OT (4) and NV interneurons (6). 14 subjects have a first retrieval session against the paper''s
    13 chronic virgins, and 23 naive excitatory mice of several kinds (9 chronic, 5 non-cohoused controls, 6 CH+575,
    3 tones only) stand against the 12 of Fig. 1f, which the paper does not name. No file has a stimulus series
    or trial table, so no presentation can be assigned its call or ISI, which makes the result partial under the
    criterion. Folding the movies finds the trial period (40 frames, 10.24 s), and in 31 of 38 three-call movies a
    cycle of three trials, but not which call each trial played.'
  deviations:
  - Groups are read from the NWB experiment descriptions and, where these give none, from the figshare item titles
    of the same mouse id (collection doi:10.6084/m9.figshare.c.5043830.v6), as the criterion allows.
