- claim: ed9b-oxytocin-enhances-spiking
  outcome: reproduced
  assumed: true
  notebook: reproduce_schiavo_2020.ipynb
  output: claim:ed9b-oxytocin-enhances-spiking
  notes: In 9 oxytocin cells spike probability rises from 0.035-0.051 to 0.48-0.56 15 to 30 minutes after
    wash onset (Friedman chi2 = 51.35, p = 6e-08). Dunn's comparisons, Bonferroni over the five stimuli,
    give stimuli 2 to 5 adjusted p 0.022, 0.014, 0.0011, 0.020 and stimulus 1 p = 0.071 (paper 0.009,
    0.008, 0.001, 0.04 and 0.34). 5 ACSF controls show no change (Friedman p = 0.56, adjusted p >= 0.79).
    Over all 45 pairs only stimulus 4 is significant (p = 0.0098), and Wilcoxon tests find stimulus 1
    significant as well (p = 0.0078).
  deviations:
  - 'Assumed: the Friedman test runs over ten columns (baseline and post for each of five stimuli), with
    Dunn''s comparisons of baseline against post for each stimulus, Bonferroni over five; the legend gives
    one p per stimulus, which fits five planned comparisons. All 45 pairs and Wilcoxon tests are variants
    and change the outcome.'
  - A spike is a crossing of 0 mV between a pulse and the next, a standard choice.
  - Baseline is the files the spreadsheet labels baseline or PRE (the first file for one control cell
    with no such label); for controls the 15 to 30 minute window starts at the first sweep after the baseline
    files, a reading of "following baseline acquisition".
  - Two of the 7 controls (191202B, 191202C) have no sweeps in the window and are left out.
findings:
- kind: data_missing
  statement: The NWB files hold only raw, unaligned two-photon movies. There are no ROIs or fluorescence
    traces, no stimulus times, no trial tables and no order of the calls within a recording (played in
    pseudorandom order, Methods), so none of the paper's 20 imaging findings can be tested from the dandiset.
    The figshare imaging items hold the same movies.
- kind: data_missing
  statement: The behavioural data of Figs. 1c, 4c-e and Extended Data Figs. 2 and 8-9 (pup retrieval,
    latencies, y-maze) and the vocalization recordings of Fig. 1a are in neither the dandiset nor the
    figshare collection it links. The paper's figshare DOI 10.35092/yhjc.c.5037737 does not resolve.
- kind: metadata_insufficient
  statement: Groups (experienced or naive, dam, CH+575, opto-OT, cell type, hemisphere) are given only
    in free-text experiment descriptions; the indicator and location fields are "unknown" in every file,
    and the start of cohousing, needed for retrieval onset, is not recorded.
- kind: metadata_error
  statement: Three recordings (sessions of 2018-03-08 named plus24hrs_postexp1) are deposited under both
    sub-NV58 and sub-NV63, with the same start times and frames; nothing says to which mouse they belong.
- kind: metadata_error
  statement: Subjects EV56 and EV62 are described as NV56 and NV62 in their own experiment descriptions,
    so their experience group is unclear.
- kind: metadata_insufficient
  statement: The in vivo whole-cell spreadsheet of experienced females does not say which cells come from
    dams, so the dams-against-EVs comparison of Extended Data Fig. 6g,h cannot be made.
- kind: metadata_error
  statement: In the in vivo whole-cell article of experienced females, file 19424013 is listed at -70
    mV but carries about +560 pA throughout, as at a depolarized holding potential.
- kind: data_missing
  statement: Files listed in the figshare spreadsheets but not deposited, 193260007 (naive in vivo, listed
    number with an extra digit) and 19o11005 (slice, Cell 20 at 575 ms).
- kind: format_error
  statement: The operant touch-time csv files print times with five significant digits, so after 1000
    s of a session they step by 0.1 s and 99% of samples repeat the previous value; press durations can
    be resolved only to that step.
- kind: paper_inconsistency
  statement: The Methods give the in vivo morph set as ISIs of 125, 225 and 575 ms; the microphone channel
    of the recordings shows 125, 275 and 575 ms with the prototype, as the figure legends say, played
    in a fixed order, not pseudorandom.
- kind: other
  statement: In the in vivo whole-cell recordings the trial-averaged current follows the call at p < 0.05
    in only 3 of 26 EPSC cells and 1 of 13 IPSC cells, and the experienced recordings are about twice
    as noisy as the naive ones (baseline s.d. 11.3 against 5.2 pA). The Methods' measure, the largest
    5 to 10 absolute trial magnitudes, gives the same experienced-naive difference before the call as
    during it.
- kind: methods_unavailable
  statement: For the paper's authors (fig1i-operant-prototypes, ed5b-press-count-unchanged), which gap
    between touch samples ends a lever press, and whether session 1 was compared with session 8 or the
    first with the last sessions. The readings give different outcomes for the fast and slow groups.
- kind: methods_unavailable
  statement: For the paper's authors (fig2i-ipsc-weaker-nv and the other in vivo claims), how many of
    the "largest 5-10 evoked trials" were averaged per cell, how a significant PSC was defined for the
    inclusion rule, and the Dunn comparison family of Extended Data Fig. 9b.
