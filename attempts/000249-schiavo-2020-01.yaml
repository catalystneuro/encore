- claim: ed3e-prototype-responsive-fraction
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: The dandiset's NWB files hold only raw, unaligned two-photon movies. They have no ROIs or fluorescence
    traces (the paper drew ROIs by hand), no stimulus series, no trial table and no times of the calls; the session
    description names the three to five calls or morphs of a recording but not the order in which they were played
    (pseudorandom, Methods). Folding the movies recovers the trial period (40 frames, 10.24 s), and in 31 of 38
    three-call movies a cycle of three trials, but nothing says which call is played at which position of the cycle
    (data check). Responses cannot be assigned to named calls, so the claim cannot be tested. The figshare imaging items
    hold the same movies as TIFF files with the same descriptions.
