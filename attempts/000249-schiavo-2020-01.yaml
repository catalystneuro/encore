- claim: fig3-retrieval-onset-range
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: The start of cohousing is not recorded in the files or the metadata, so the hours to retrieval
    onset cannot be measured. 14 subjects have a session named first retrieval (the paper has 13). The
    hours from the last baseline session to the first retrieval session are 23.9 to 144.9 for 13 of them
    (NV50 has no baseline session), but they bound onset only if cohousing began after the baseline imaging,
    which nothing states; they decide nothing.
  notebook: reproduce_schiavo_2020.ipynb
- claim: fig1g-ipsc-depress-faster
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_schiavo_2020.ipynb
  output: claim:fig1g-ipsc-depress-faster
  notes: At 175 ms (14 EPSC and 13 IPSC cells) IPSCs do not depress more than EPSCs. Per trial, mean Sn/S1
    over pulses 2 to 5 is 0.90 (IPSC) against 0.68 (EPSC), p = 0.33, and no pulse differs after Bonferroni
    (adjusted p 1.0). On per-file mean traces, 0.57 against 0.65, p = 0.39; pulses 2 and 3 adjusted p
    0.15 and 0.06. 75 ms does not differ (p 0.52 and 0.72). At 575 ms the unpaired tests do not differ
    (p 0.82 and 0.08), but on mean traces a paired test finds IPSCs lower (0.55 against 0.66, p = 0.022).
    Per-trial IPSC ratios are noisy; 35 trials with no first response above baseline were dropped and
    17 cell means fall outside 0 to 2.
  deviations:
  - 'Assumed: the peak is the largest inward (EPSC) or outward (IPSC) current 2 to 30 ms after each pulse
    (to 2 ms before the next pulse at 50 ms periods) against the mean of the 5 ms before it. The Methods
    say only "peak amplitude ... normalized to the event evoked by the first stimulation on each trial";
    local baselines are the usual choice for trains.'
  - Trials with a first response not above baseline give no ratio and are dropped; the mean trace per
    file is shown as a variant.
  - One-way ANOVA with two groups is run as the equivalent unpaired t-test; a paired test is shown as
    a variant.
  - 12 of the 13 cells at 575 ms; file 19o11005 (Cell 20) is listed but not on figshare.
  - The 75 ms bin includes trains at 50 ms periods, at the edge of the Methods' 75 plus or minus 25 ms.
- claim: fig1i-operant-prototypes
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_schiavo_2020.ipynb
  output: claim:fig1i-operant-prototypes
  notes: The readings disagree, and the criterion blocks the claim then. Prototypes increase mean press
    duration under all four (session 1 against 8, p = 0.025 with the median-interval gap and 0.0076 with
    the 100 ms gap; sessions 1-2 against 7-8, p = 0.032 and 0.021). Fast and slow are not significant
    under three readings (p 0.081 to 0.73), but with the 100 ms gap and session 1 against 8 slow increases
    (p = 0.040) and fast reaches p = 0.050. The reading closest to the paper's p-values (0.03, 0.24, 0.13)
    is the median-interval gap with session 1 against 8 (0.025, 0.081, 0.17). For the paper's authors,
    which gap ends a press and which sessions were compared.
  deviations: &id001
  - Touch times are printed with five significant digits, so a press can be resolved only to 1 ms below
    100 s, 10 ms to 1000 s and 100 ms after; a gap must exceed one and a half local steps to end a press,
    under both gap readings.
  - The median inter-sample interval (reading a) is taken from the part of each session printed at 1 ms
    (below 100 s), over steps of at most 5 ms; it is about 0.7 ms.
  - Two mice miss one session each (NV24 session 5, NV38 session 3); neither is a compared session.
- claim: ed5b-press-count-unchanged
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_schiavo_2020.ipynb
  output: claim:ed5b-press-count-unchanged
  notes: The readings disagree. No group increases under three readings (all p >= 0.09). With the median-interval
    gap and sessions 1-2 against 7-8 the fast group increases from 68.5 to 107.4 presses (p = 0.049).
  deviations: *id001
- claim: ed6ef-epsc-tuning
  outcome: not_reproduced
  notebook: reproduce_schiavo_2020.ipynb
  output: claim:ed6ef-epsc-tuning
  notes: Naive prototype-evoked EPSCs are not larger than morph-evoked ones after Bonferroni (largest
    5 trials, 20.9 against 17.4, 17.2 and 18.3 pA, adjusted p 0.057, 0.20, 0.83; RM ANOVA p = 0.21); no
    reading gives p < 0.05 for all three. Experienced EPSCs are not correlated with ISI (r = -0.16, p
    = 0.28; -0.12 to -0.16 under every reading). No experienced pair differs (smallest adjusted p 0.086
    to 0.52) and the naive correlation is not significant (r = -0.01, p = 0.92), as in the paper. The
    trial-averaged EPSC follows the call at p < 0.05 in only 3 of 26 cells, so the Methods' measure mostly
