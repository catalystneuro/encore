- claim: fig3-retrieval-onset-range
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: The start of cohousing is not recorded in the files or the metadata, so the hours to retrieval onset cannot
    be measured. 14 subjects have a session named first retrieval (the paper has 13). The hours from the last session
    imaged before it (base, 24hrsPRE or 48HrsPRE) are 23.9 to 52.1, and from the last session named base 23.9 to
    144.9 (NV50 has only a 24hrsPRE session), but either bounds onset only if cohousing began after that session,
    which nothing states; they decide nothing.
  notebook: reproduce_schiavo_2020.ipynb
- claim: fig1g-ipsc-depress-faster
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_schiavo_2020.ipynb
  output: claim:fig1g-ipsc-depress-faster
  notes: At 175 ms (14 EPSC and 13 IPSC cells) IPSCs do not depress more than EPSCs. Per trial, mean Sn/S1 over
    pulses 2 to 5 is 0.90 (IPSC) against 0.68 (EPSC), p = 0.33, and no pulse differs after Bonferroni (adjusted
    p 1.0). On per-file mean traces, 0.57 against 0.65, p = 0.39; pulses 2 and 3 adjusted p 0.15 and 0.06. 75 ms
    does not differ (p 0.52 and 0.72). At 575 ms the unpaired tests do not differ (p 0.82 and 0.08), but on mean
    traces a paired test finds IPSCs lower (0.55 against 0.66, p = 0.022). Per-trial IPSC ratios are noisy; 35 trials
    with no first response above baseline were dropped and 17 cell means fall outside 0 to 2. The pulse times read
    from the protocol fall on the stimulus artefacts (steepest current change a median 0.5 ms after the computed
    time, within 1 ms for 91.8% of 740 pulses). At 175 ms the per-trial and mean-trace IPSC ratios move in opposite
    directions (0.90 and 0.57 against 0.68 and 0.65), neither significantly.
  deviations:
  - 'Assumed: the peak is the largest inward (EPSC) or outward (IPSC) current 2 to 30 ms after each pulse (to 2
    ms before the next pulse at 50 ms periods) against the mean of the 5 ms before it. The Methods say only "peak
    amplitude ... normalized to the event evoked by the first stimulation on each trial"; local baselines are the
    usual choice for trains.'
  - Trials with a first response not above baseline give no ratio and are dropped; the mean trace per file is shown
    as a variant.
  - One-way ANOVA with two groups is run as the equivalent unpaired t-test; a paired test is shown as a variant.
  - 12 of the 13 cells at 575 ms; file 19o11005 (Cell 20) is listed but not on figshare.
  - The 75 ms bin includes trains at 50 ms periods, at the edge of the Methods' 75 plus or minus 25 ms.
