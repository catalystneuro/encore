outcomes:
- claim: subject-group-link
  outcome: partially_reproduced
  notebook: reproduce_schiavo_2020.ipynb
  output: claim:subject-group-link
  notes: The experiment description of each NWB file places 49 of 54 subjects. Counts match the paper
    for EV excitatory left (9), EV interneurons (5), EV right cortex (4), dam (1), CH+575 (6), CH+575
    opto-OT (4) and NV interneurons (6). 14 subjects have a first retrieval session against the paper's
    13 chronic virgins, and 20 naive excitatory mice of several kinds (9 chronic, 5 non-cohoused controls,
    6 CH+575) stand against the 12 of Fig. 1f, which the paper does not name. The five mice imaged only
    with tones (EV56, EV62, NV64, NV66, NV140) carry no experience group; EV56 and EV62 are named NV56
    and NV62 in their own descriptions. No file has a stimulus series or trial table, so no presentation
    can be assigned its call or ISI, which makes the result partial under the criterion. The figshare
    item titles add nothing beyond the descriptions, which are the same text.
  deviations:
  - Groups are read from the NWB experiment descriptions, which repeat the figshare item descriptions;
    the figshare titles were compared only by name.
