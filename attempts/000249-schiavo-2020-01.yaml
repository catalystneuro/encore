- claim: ed3e-prototype-responsive-fraction
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: The dandiset's NWB files hold only raw, unaligned two-photon movies. They have no ROIs or fluorescence
    traces (the paper drew ROIs by hand), no stimulus series, no trial table and no times of the calls;
    the session description names the three to five calls or morphs of a recording but not the order in
