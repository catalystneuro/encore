  notebook: reproduce_schiavo_2020.ipynb
  output: claim:fig1i-operant-prototypes
  notes: The readings disagree, and the criterion blocks the claim then. Prototypes increase mean press duration
    under all four (session 1 against 8, p = 0.025 with the median-interval gap and 0.0076 with the 100 ms gap;
    sessions 1-2 against 7-8, p = 0.032 and 0.021). Fast and slow are not significant under three readings (p 0.081
    to 0.73), but with the 100 ms gap and session 1 against 8 slow increases (p = 0.040) and fast reaches p = 0.050.
    The reading closest to the paper's p-values (0.03, 0.24, 0.13) is the median-interval gap with session 1 against
    8 (0.025, 0.081, 0.17). For the paper's authors, which gap ends a press and which sessions were compared. The
    gap that ends a press under the median-interval rule grows with time in the session (1.5 ms before 100 s, 15
    ms to 1000 s, 150 ms after), because a gap must exceed one and a half printed steps.
  deviations:
  - Touch times are printed with five significant digits, so a press can be resolved only to 0.1 ms below 10 s,
    1 ms below 100 s, 10 ms to 1000 s and 100 ms after; a gap must exceed one and a half local steps (1 ms taken
    as the step below 100 s) to end a press, under both gap readings, so the median-interval rule ends a press at
    1.5, 15 or 150 ms depending on when it falls.
  - The median inter-sample interval (reading a) is the polling period of the task code, taken once, pooled over
    sessions, from the times printed at 0.1 ms (below 10 s), 0.70 ms; above 10 s the printed intervals are quantized
    at 1 ms or more. Before revision a mean over the 1 ms part was used (about 0.7 ms); the outcome is unchanged.
  - Two mice miss one session each (NV24 session 5, NV38 session 3); neither is a compared session.
