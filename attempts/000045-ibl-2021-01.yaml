inputs:
- what: The code's lab numbers (Lab 1 to 7) by institution and the labs' time zones (Europe 0,
    New York -5, Los Angeles -7 hours), as the claims file header gives them from the paper's code.
    The lab numbers serve every lab comparison and the time zones fig3f-positive-control.
