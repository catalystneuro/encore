- claim: cohort-counts
  outcome: not_reproduced
  notebook: reproduce_ibl_2021.ipynb
  output: claim:cohort-counts
  measured: [136, 75, 60]
  notes: The dataset holds 177 mice of the paper's project; 136 have their whole training in it
    (first session a first-stage session), against 206 that started training. 75 (1a/each), 84
    (1a/pooled), 52 (1a1b/each) and 58 (1a1b/pooled) reach basic task proficiency, against 140, and
    60 reach full task proficiency, against 98. No count is within tolerance. The dataset holds
    sessions from 2019-06-11 to 2020-03-23; the Methods say training of these mice began in January
    2019.
  deviations:
  - Proficiency is recomputed from the trials (Appendix 1, table 1d), as the files carry no
    training status.
  - Mice whose first session in the dataset is not a first-stage session (41) are left out, as
    their training began before the dataset does.
- claim: fig2g-days-to-proficiency
  outcome: partially_reproduced
  notebook: reproduce_ibl_2021.ipynb
  output: claim:fig2g-days-to-proficiency
  measured: [18.99, 10.47, 5, 54]
  notes: Mean days to P1 is 17.3 to 18.99 under the 1a readings (within 18.4 +- 1.84) and 20.4 to
    21.73 under 1a/1b. The s.d. is 10.47 to 10.48 (1a) and 14.56 to 14.60 (1a/1b), outside 13.0 +-
    1.3. The fastest mouse takes 3 to 5 days and the slowest 53 to 58. At most two of the four
    values are within tolerance under any reading. Measured is 1a/each, counting the P1 day.
  deviations:
  - 75 to 84 mice (1a) and 52 to 58 (1a/1b), against 140.
