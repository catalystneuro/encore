findings:
- kind: data_missing
  statement: The dandiset holds 178 mice and 6,615 sessions from 2019-06-11 to 2020-03-23. The
    paper's mice began training in January 2019 (206 mice, 10,903 sessions), so 41 mice of the
    project begin mid-training in the dandiset and the mice trained before June 2019 are missing.
- kind: data_missing
  statement: The training status of each session (in_training, trained_1a, trained_1b,
    ready4ephysrig and so on), on which every analysis of the paper selects sessions, is not in the
    files. It has to be recomputed from the trials, which leaves open details of the criteria.
- kind: other
  statement: One recording is deposited twice, under two mice (CSHL_013 and CSHL_015, 2019-07-15,
    identical trials and start time).
- kind: metadata_error
  statement: probabilityLeft is described as the probability of a left stimulus for the current
    block, but in every basic-task session it varies from trial to trial between 0 and 1 (24% of
    basic-task trials are not 0.5), with the stimulus side following it.
- kind: metadata_error
  statement: session_start_time is stated in UTC (+00:00) but holds local clock times; all seven
    labs, from London to Berkeley, have median start hours between 11.0 and 14.4 h.
- kind: format_error
  statement: In 807 files the wheel position data and its timestamps differ in length (for example
    181,623 samples against 340,799 timestamps); 16 files have
    no wheel series. In one session checked (ibl_witten_07), the wheel moves the opposite way to the
    choice on every trial.
- kind: other
  statement: 257,021 trials (6%) have no stimulus onset time, and 185 sessions have none; 1,541
    trials in 220 sessions have a response time before the stimulus onset (down to -5,638 s). No
    proficiency window of this attempt fails for the missing onsets alone.
- kind: other
  statement: One session (ZM_1367, 2019-06-11) uses contrasts of 4% and 8%, which the paper does
    not describe.
- kind: paper_inconsistency
  statement: The Methods give the 1a/1b performance criterion on easy trials and the Results give
    the lapse criterion as a maximum of 0.2 for the sum of the lapses, while Appendix 1, table 1d
    gives performance on 100% contrast and a bound on each lapse rate. After the answers of
    2026-10-22 the claims file follows the pipeline's code for performance (easy trials) and the
    table for the lapses; with performance on 100% contrast only, 84 mice reach P1 against 83.
- kind: metadata_insufficient
  statement: The dandiset's metadata do not say which of its 178 mice are the paper's; one mouse
    (SWC_029) belongs to another project by its subject record.
