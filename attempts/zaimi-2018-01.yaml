schema_version: 3
id: zaimi-2018-01
datasets:
- archive: dandi
  id: "001436"
  version: 0.250512.1625
  doi: 10.48324/dandi.001436/0.250512.1625
  relation: primary
paper: doi:10.1038/s41598-018-22181-4
