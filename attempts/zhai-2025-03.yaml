    paper''s (sweeps 1 to 10 for 2023-02-22 cell 1, 106 events against the paper''s 101; sweeps 2 to 11
    for 2023-04-06 cell 1, 89 against 73), P = 0.064; first 10, P = 0.049, which would find a difference.
