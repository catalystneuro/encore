outcomes:
- claim: link-somatic-cells
  outcome: partially_reproduced
  notebook: reproduce_zhai_2025.ipynb
  output: claim:link-somatic-cells
  notes: 'Groups are matched by condition label to the paper''s sheets (Figures 1E, 3C, 6C, 7C, 9D). All
    12 groups hold the paper''s n (123 cells). 90 of 123 cells (73.2%) have an exact match over the steps
    from 20 to 300 pA, and 105 (85.4%) a best match within 3 spikes, below the 80% and 95% for reproduced
    and above the 50% exact for partially reproduced. 18 cells differ by more than 3 spikes; 6 of them
    are on-state dSPNs (6 of 15 exact) and 3 sulpiride iSPNs (4 of 7 exact). Rheobase equals that of the best-matching
    row in 105 cells. Best matches are not one to one: 9 paper rows are the best match of more than one
    cell (20 cells), and 6 cells tie between rows. The rheobase sheets (1F, 3D) are read by row number;
    in 115 of 124 rows their rheobase equals the first step with a spike in the same row of the F-I sheet.
    The last sweep of a repeated step gives the same counts (90 exact, 105 within 3). The dandiset''s
    description says spike counts match the paper''s table exactly in 90 of 123 cells, which this attempt
    finds too.'
  deviations:
  - Spike counts and rheobase follow the paper's script (Zenodo 14145776, count_events with threshold
    0 and rheobaseCal), as the claims file fixes. When a cell holds a step twice the first sweep is used,
    a choice the script does not make. 14 of 123 cells have a repeated step; taking the last sweep changes
    no cell's rheobase and one cell's summed spikes, by 1 (2020-02-17 cell 1, vehicle control, 170 to
    171); all 14 somatic tests, rheobase and summed spikes, give the same U and P under it (output somatic-last-sweep).
  - Figures 6C, 7C and 9D have no rheobase sheet; there the rheobase of the best row is read from its
    spike counts.
- claim: link-dendritic-cells
  outcome: reproduced
  notebook: reproduce_zhai_2025.ipynb
  output: claim:link-dendritic-cells
  notes: All 10 groups hold the paper's n (92 cells). The index differs from the matched paper value by
    a median of 2.7% (1.7% to the nearest value of the group); 12 cells differ by more than 10%. 2019-04-11
    cell 1 (on-state with SCH) is 0.584 against the paper's 0.228, as only its second pair is in the file.
    Two off-state iSPNs (2016-05-23 cell 4, 2016-05-24 cell 2) look swapped against the assumed row order
    (0.763 and 0.962 against rows of 0.947 and 0.527). In Figure 6D all 16 cells find their identifier
    when the letter is the file's cell number (median difference 5.3%), and 14 of 16 when it is the cell's
    place among the group's analysed cells of the day (median 4.3%); the outcome is the same either way.
    Two points of the criterion are asked of a reader (questions/zhai-2025.yaml), the meaning of the
    Figure 6D letter and its premise that the somatic link checks the row order, which it does not (the
    somatic link uses best matches, and 9 paper rows are reused there).
  deviations:
  - 'The index follows the paper''s dendritic script (Zenodo 14163502): backgrounds of 55 (red) and 161
    (green), with the claims file''s basal-ratio window, pairing and averaging. The files'' ROI profiles
    (Prairie View''s mean along the scan line) are used as the script''s Prof 1 and Prof 2. No pair falls
    outside the basal-ratio window (ratios 0.672 to 1.749).'
  - Outside Figure 6D the paper's rows are taken in the dandiset's order by date and cell, as the criterion
    says.
  - 'Figure 6D: the criterion takes the letter as the cell''s place in the day (a, b, c for the first,
    second and third cell). The letter is read as the file''s cell number, which counts every cell recorded
    that day; the paper''s identifiers 02182020_b, 02182020_c and 02202020_c have no _a in the group,
    so the letters count cells outside the group too. The place among the group''s analysed cells is shown
    as a variant (14 of 16 identifiers found).'
- claim: link-sr-cells
  outcome: partially_reproduced
  notebook: reproduce_zhai_2025.ipynb
  output: claim:link-sr-cells
  notes: All 33 dandiset cells match a paper identifier (date and letter, the letter being the file's
    cell number) and all 33 paper cells are in the dandiset. Mean amplitude and event count are both within
    25% for 21 of 33 cells (64%), below the 75% for reproduced; amplitude alone for 25, count alone for
    26; median differences +11% in amplitude and -2% in count. With the noise SD of the smoothed trace
    only 8 of 33 are within 25%; with the first 10 sweeps 21 of 33, with the last 10 sweeps 22 of 33.
    The criterion names lid.detect_events, which is not a helper of this attempt; zhai.detect_events
    is used, and the naming is asked of a reader (questions/zhai-2025.yaml).
  deviations:
  - Events come from a stand-in detector (zhai.detect_events), an assumption. The paper (Methods, Data
    acquisition and statistical analysis) used TaroTools in Igor Pro, 40 to 400 ms after the flash, threshold
    five SD above the noise, followed by visual verification, which cannot be run here. Noise is the MAD-based
    SD of the recorded trace from 500 to 900 ms after the flash; the SD of the smoothed trace is shown
    as a variant.
  - Two off-state iSPNs hold 12 and 11 sweeps (2023-02-22 cell 1, 2023-04-06 cell 1) where the paper's
    frequencies imply 10. The main result uses every sweep; the first 10, the last 10, and the run of
    10 consecutive sweeps whose event count is nearest the paper's for the cell (sweeps 1 to 10 and 2
    to 11) are shown as variants.
  assumed: true
- claim: link-grab-rois
  outcome: not_reproduced
  notebook: reproduce_zhai_2025.ipynb
  output: claim:link-grab-rois
  notes: The dandiset holds the paper's number of regions per group (13 unlesioned, 10 6-OHDA, 11 off-state).
    Only 16 of 34 regions have a paper region within 0.05 for every treatment (47%, under half), and 11
    paper regions are the best match of more than one dandiset region; a one-to-one assignment gives 15
    of 34. Counted per mouse (recording day), a mouse matching when every region does, 1 of 11 mice match.
    Variants give 10 to 16 of 34 regions (whole-frame brightness 16, Fmin from tetrodotoxin only 10 of
    33, from the quinpirole baseline 16, first two trials 16). The frame interval is the same within every
    single-pulse condition (0.1996 s). The differences may come from the ROI and calibration choices of
    this attempt as much as from the files; the group-level claims of Figure 5F hold.
  deviations:
  - Areas follow the paper's script (Zenodo 14163731) and Methods. The ROI is the 50 um circle in the
    centre of each movie, computed from the frames, as the files' ROI series is whole-frame brightness.
    The PMT background, not shared, cancels in (F - F0)/(Fmax - Fmin). All single-pulse trials of a condition
    are averaged where the Methods give two (some regions hold three or four); the first two are a variant
    with the same results. Calibration trials whose 2 to 4 s window holds no frames are skipped.
  - The criterion speaks of each mouse's vector; the files hold several regions per mouse and the paper's
    n counts regions, so each region is matched, and the per-mouse count is shown too. Both are under
    half. Whether the criterion means regions is asked of a reader (questions/zhai-2025.yaml).
- claim: link-aim-mice
  outcome: not_reproduced
  notebook: reproduce_zhai_2025.ipynb
  output: claim:link-aim-mice
  notes: 'Figure 10 links fully: all 21 mice match by number, group labels agree, and 103 of 105 session
    totals equal the paper''s (the two others differ by 1 and 3). Figure 8 does not: of the 21 dandiset
    mice 18 are in the paper (4123, 4124 and 5871 are not), 5 paper mice are absent (2346, 2347, 7741,
    7742, 7744), labels agree for the 18, but only 12 of 90 matched session totals are equal (median absolute
    difference 2.5, largest 19.5). The dandiset''s description says these are the lab''s scoring sheets,
    which match the preprint and not the published figure.'
  deviations:
  - A session's total sums every time point the file holds; 54 sessions hold 6 time points and 37 fewer
    than 5.
