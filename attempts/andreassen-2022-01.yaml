- claim: figs1a-swim-speed-no-treatment-difference
  outcome: reproduced
  notebook: reproduce_andreassen_2022.ipynb
  output: claim:figs1a-swim-speed-no-treatment-difference
  measured:
  - 2.9
  - 1.72
  notes: In the model including treatment (26 fish, 130 observations) the heat-ramp effect is 0.76
    mm/s (SE 0.62, t = 1.22, p = 0.233 with Satterthwaite degrees of freedom, 0.22 with the normal
    approximation), as in Table S1. The swim speed model gives 2.90 mm/s at interval 1 and 1.72 at
    interval 5 (time 5 term -1.18, t(100) = -2.44, p = 0.017). In the variant with a time by
    treatment interaction no interaction term has p < 0.05 (smallest 0.39).
  deviations:
  - Mixed models are fitted in Python by REML (thermal.LMM), and p-values use Satterthwaite degrees
    of freedom, the claims file's main reading. The paper's R script takes its table p-values with
    sjPlot's p.val = "kr" (Kenward-Roger). The normal approximation is printed as well; no outcome
    changes between the two.
