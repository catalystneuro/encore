- claim: fig6c-light-responsiveness-by-oxygen
  outcome: partially_reproduced
  notebook: reproduce_andreassen_2022.ipynb
  output: claim:fig6c-light-responsiveness-by-oxygen
  measured:
  - 33.0
  - 36.1
  - 36.5
  - 31
  - 29
  notes: Measured values are those of the pooled reading, in the order of the expected values.
    Percentages pooled over flashes (per-fish mean in brackets) are normoxia 33.0% (31.7%) over 28
    to 31 °C, hypoxia 36.1% (33.4%) in the first bin, falling to 19.7% (20.1%) in the next, and
    hyperoxia 36.5% (36.2%) over 28 to 36 °C, all within tolerance. Normoxic responsiveness is kept
    to 31 °C (it falls to 27.3% at 32 °C). In hyperoxia the 30 °C bin (31.6%, per fish 28.2%) is
    already below the initial level minus its tolerance (32.9%), so by the criterion's rule the
    level is kept only to 29 °C under both readings, and to 30 °C with bins named by their upper
    bound; the 5 °C gain is not met as the criterion defines it. As a variant outside the
    criterion, the hyperoxic percentage stays below the threshold from 37 °C on.
  deviations:
  - The R script (section Fig 6D, which draws Fig. 6C) drops the first bin (Temperature > 28) and
    names bins by their lower bound (Temperature - 1); both are followed. The script plots the mean
    of per-fish percentages, the claims file's variant; both readings are shown and give the same
    outcome.
- claim: tables10-light-response-model
  outcome: reproduced
  notebook: reproduce_andreassen_2022.ipynb
  output: claim:tables10-light-response-model
  measured:
  - 26.2
  - 36.6
  - 13.2
  notes: 411 rows with counts (2763 flashes, 38 fish). Hypoxia -0.85 (SE 0.22, p < 0.001),
    hyperoxia 0.49 (SE 0.18, p = 0.0075), temperature -0.126 per °C (p < 0.001), hyperoxia by
    temperature 0.065 (SE 0.030, p = 0.030), as in Table S10. At the script's mean temperature (34.49
    °C over the 440 rows) the probabilities are 26.2%, 36.6% and 13.2%; centering over flashes gives
    26.1%, 36.5% and 13.2%. Predicting at each treatment's own mean temperature puts hypoxia at
    14.5%, outside 13 ± 1.3; the script centers over all rows, which settles the reading. Estimates
    change by at most 0.0002 with 9 quadrature nodes in place of the Laplace approximation.
  deviations:
  - The model is fitted in Python (thermal.BinomialGLMM) by maximum likelihood with the Laplace
    approximation, glmer's default, on the R script's formula (modelLightResponse1) and centering
    (scale(Temperature, scale = F) over rows with Temperature above 28).
