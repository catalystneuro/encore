findings:
- kind: data_missing
  severity: major
  versions:
  - '3'
  - '4'
  notebook: reproduce_andreassen_2022.ipynb
  output: finding-missing-measures
  statement: The item holds part of the paper's data. Not deposited are the experiment-2 temperatures
    and onset temperatures (CalciumPeaksLong.csv gives frequencies against time to depolarization
    only), the experiment-4 medulla counts, the spiral-swimming and loss-of-response scores of Fig.
    S1B, C and E (the R script types the spiral-swimming counts into a matrix), the amplitudes of
    the light responses, the medulla peak amplitudes, and any imaging time series. Nine of the 28
    claims cannot be tested.
- kind: metadata_error
  severity: minor
  versions:
  - '3'
  - '4'
  notebook: reproduce_andreassen_2022.ipynb
  output: finding-fish-ids
  statement: The Readme says FishID corresponds across DepolarizationPeakandRecovery.csv,
    CalciumPeakExperiment.csv and LightResponse.csv, but LightResponse.csv names three fish Fish3,
    Fish4 and Fish5 where the depolarization table has Fish03, Fish04 and Fish05. Fish33 has medulla
    and light values but no row in the depolarization table.
- kind: other
  about: data
  severity: minor
  versions:
  - '3'
  - '4'
  notebook: reproduce_andreassen_2022.ipynb
  output: finding-fish-ids
  statement: In 30 of 32 embedded fish of experiment 5 the medulla series ends in the 1 °C bin that
    holds the onset temperature; in Fish03 it ends one bin earlier (last bin 39 to 40 °C, onset 40.4
    °C) and in Fish35 two bins earlier (39 to 40 °C, onset 41.1 °C). The light recordings of Fish27
    and Fish29 end about 10 °C below their onsets. Neither the Readme nor the paper says why.
    CTmaxData_Total.csv has 90 rows, 2 without a treatment or temperature and 12 more without a
    temperature, also without explanation (the paper reports 6 of 92 larvae that died and were excluded).
- kind: methods_unavailable
  statement: Question for the authors. The paper says medulla activity "sharply decreased in the
    minutes prior to the brain-wide depolarization" in all oxygen treatments (Fig. S3D) but gives no
    window or measure, and the deposited frequencies of experiment 5 are in 1 °C bins, not in time.
    Over what window was the drop judged, and are the time-resolved frequencies of Fig. S3D
    available? Is the frequency of the 1 °C bin that holds the onset a rate over the part of the
    bin recorded before the onset, or over the whole bin? This attempt converts bins to time with
    the 0.3 °C/min ramp; the drop is below half the maximum over the last 2 min in every treatment
    but not over the last 5 min, and in normoxia and hypoxia it lies in the partial onset bin.
- kind: metadata_error
  severity: minor
  versions:
  - '3'
  - '4'
  notebook: reproduce_andreassen_2022.ipynb
  output: finding-recovery-unit
  statement: The Readme gives Recovery in DepolarizationPeakandRecovery.csv in minutes, but its 39
    values run from 60 to 464 and are seconds; the R script divides them by 60 to get minutes.
- kind: methods_unavailable
  statement: Question for the authors. How were the Q10 values of medulla activity in Fig. 5D
    computed (bins, endpoints, group means or a fitted curve)? The R script computes none. Group
    means of the deposited 1 °C bins give 0.88 for hypoxia from 28 to 34 °C where the paper reports
    0.8, and no other reading tried gives 0.8.
verifications:
