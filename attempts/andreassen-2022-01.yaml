- claim: figs3d-medulla-drops-before-depolarization
  outcome: reproduced
  assumed: true
  notebook: reproduce_andreassen_2022.ipynb
  output: claim:figs3d-medulla-drops-before-depolarization
  notes: On 32 fish with both medulla bins and an onset (10 normoxia, 11 hyperoxia, 11 hypoxia), the
    mean over the last 2 min before onset is 0.96, 0.93 and 0.87 peaks/min, 0.42, 0.29 and 0.49 of
    each group's maximum in the 30 min window, all below one half. Over the last 5 min the ratios
    are 0.50, 0.36 and 0.64, so that reading fails in normoxia and hypoxia. With a threshold of 0.4
    the 2 min reading fails too (hypoxia 0.49, normoxia 0.42). The result is fragile. The last
    complete bin before the onset bin is 0.58, 0.40 and 0.72 of the maximum, so in normoxia and
    hypoxia the drop below half lies in the partial bin that holds the onset; in hyperoxia the last
    complete bin is already below half. The onset-bin frequency hardly depends on the part of the
    bin before the onset (Spearman rho = 0.23, p = 0.22, 30 fish), as frequencies over the recorded
    part would; rescaled as if over the whole bin, the normoxic 2 min ratio is 0.69 and the claim
    would fail. The question of how the drop was judged and how the onset bin was normalised is
    recorded for the paper's authors (finding 4).
  deviations:
  - The item holds the experiment-5 medulla frequencies only in 1 °C bins, not in time. Assumed
    that a bin's time before onset is (onset temperature - bin temperature) / 0.3 min, from the
    heating rate of 0.3 °C/min (Methods, CTmax assay; Results, experiment 5 uses the same ramp),
    and that a window's mean is the mean of the bins weighted by their overlap with it. The 30 min
    profile uses the 10 bins counted back from the bin that holds the onset. The 0.3 °C/min is
    stated for experiments 1 and 2 (Methods; Fig. 2 legend), and experiment 5 uses the setup of
    experiment 2 (Methods). Across the fish of the second period of experiment 5 the onset
    temperature rises 0.225 °C per minute of recording (r = 0.98), and 0.222 in the first period
    without Fish03, Fish04 and Fish05, whose onsets come after 60 min (r = 0.89; 0.086 and r = 0.56
    with them); with that ramp the ratios are 0.42, 0.28 and 0.46 and the outcome is the same. The
    0.3 °C/min ramp puts the start of the recordings at a median of 27.0 °C, which fits the first
    medulla bins (27 or 28 °C); 0.225 °C/min puts it near 30 °C.
  - The frequency of the bin that holds the onset is taken as deposited, as a rate over the part
    of the bin before the onset; neither the Readme nor the R script says how it was normalised.
  - The threshold of half the window maximum is the claims file's, set by the reader for "sharply",
    which the paper does not quantify.
