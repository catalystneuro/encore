- claim: fig5d-medulla-hypoxia
  outcome: partially_reproduced
  notebook: reproduce_andreassen_2022.ipynb
  output: claim:fig5d-medulla-hypoxia
  measured:
  - 0.883
  - 0.027
  notes: Hypoxic means are 1.950 peaks/min at 28 °C (12 fish), 1.809 at 34 °C (12) and 0.426 at 38
    °C (5). The Q10 from 34 to 38 °C is 0.027, below 0.1, and the hypoxia by temperature term of the
