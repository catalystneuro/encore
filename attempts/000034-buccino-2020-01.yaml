- claim: fig4a-curators-agree
  outcome: blocked
  blocked_by: not_runnable
  notebook: reproduce_buccino_2020.ipynb
  output: claim:fig4a-curators-agree
  notes: Blocked because the claim depends on fig1b-unit-counts (the Kilosort2 run), which is blocked; its count
    of 174 Kilosort2 units discarded by both curators needs that run, and the paper's own Kilosort2 output, which
    the curators worked on, is not in the dandiset. The rest was computed from the two curated files under the criterion's
    second reading (compare_two_sorters of spikecomparison 0.2.6, defaults). Curated 1 has 258 units and curated
    2 has 319; 226 are matched and 351 belong to either, 64.39%, so 226 and 351 equal the paper's and 64.39% is
    within 6.42 of its 64.2%. With a minimum score from 0.3 to 0.8 the matched count goes from 231 to 208, inside
    the tolerance. The first reading (compare_multiple_sorters with the Kilosort2 run) could not be run.
  deviations:
  - spikecomparison 0.2.6 and spikeextractors 0.8.4 were run on NumPy 2 with the removed aliases np.float, np.int,
    np.Inf, np.product and np.in1d restored as the builtins and functions they stood for.
  - The curated files carry no sampling rate; their spike times were turned into frames at the mouse recording's
    30 kHz, as the paper's loader (NwbSortingExtractor) does with the rate it is given.
