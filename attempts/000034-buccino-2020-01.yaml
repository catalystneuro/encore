findings:
- kind: data_missing
  statement: The dandiset holds no output of the six spike sorters the paper compares, including the Kilosort2 run
    that the two experts curated. Every comparison of sorters in the paper, and the comparison of the curations
    with Kilosort2, can be repeated only by running the sorters again, three of them in MATLAB, and a new Kilosort2
    run will not give the units the curators worked on.
- kind: metadata_insufficient
  statement: The two curated files hold spike times only, with no sampling rate, no unit labels, no curator name
    and no link to the Kilosort2 clusters they were curated from; which file is curator 1 and which curator 2 is
    not stated (the files differ only by session time, 15:55:42 and 15:55:43). Their spike times fall on whole frames
    at 30 kHz and match the mouse recording's clock.
- kind: metadata_error
  statement: The retina recording is stored as unsigned 16-bit values centred near 2048 and reaching 4096, consistent
    with raw counts of a 12-bit converter, while the file states a conversion of 1e-6 V per unit and no offset,
    which would put every channel near +2 mV. The converter's gain and offset are not in the file.
- kind: metadata_insufficient
  statement: The electrode tables give location 'unknown' and filtering 'none' for every channel and placeholder
    group descriptions; the mouse recording has 248 channels where the paper says 246 are active, without marking
    which; the simulated file does not say which ground-truth cells are excitatory or inhibitory or what noise was
    added; the archive's species summary lists only house mouse though one recording is from a rat (its file gives
    'rattus rattus').
- kind: other
  statement: Every raw series is stored in chunks of one channel by 7911 to 26368 frames, so reading a stretch of
    all channels fetches one chunk per channel. Streamed from the archive at about 0.1 to 0.2 s per chunk, reading
    a whole recording would take 6.7 to 20 h.
- kind: paper_inconsistency
  statement: The paper gives 226 of 351 curated units as 64.2%; 226/351 is 64.39%.
