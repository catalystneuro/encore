- claim: fig4a-curators-agree
  outcome: partially_reproduced
  notebook: reproduce_buccino_2020.ipynb
  output: claim:fig4a-curators-agree
  notes: Computed from the two curated files under the criterion's second reading (compare_two_sorters of spikecomparison
    0.2.6, defaults). Curated 1 has 258 units and curated 2 has 319; 226 are matched and 351 belong to either, 64.39%, so
    226 and 351 equal the paper's and 64.39% is within 6.42 of its 64.2%. With a minimum score from 0.3 to 0.8 the matched
    count goes from 231 to 209, inside its tolerance; the ratio stays inside its tolerance up to 0.7 (59.83%) and falls below
    it at 0.8 (56.79%, lower bound 57.78%). The criterion fixes the default score of 0.5, so this does not decide the outcome.
    The count of 174 Kilosort2 units discarded by both curators needs the paper's Kilosort2 run (fig1b-unit-counts, blocked);
    the curated files hold unit ids and spike times only, with no link to the Kilosort2 clusters (HDF5 tree printed), so it
    is untested. The criterion gives reproduced when all four values hold under one reading and partially reproduced when
    226, 351 and 64.2% hold and 174 does not; with 174 untested the claim is partially reproduced at least, and reproduced
    only if a Kilosort2 run confirmed the 174. The first reading (compare_multiple_sorters with the Kilosort2 run) could not
    be run. measured is not given, as the fourth expected value has no measurement.
  deviations:
  - spikecomparison 0.2.6 and spikeextractors 0.8.4 were run on NumPy 2 with the removed aliases np.float, np.int, np.Inf,
    np.product and np.in1d restored as the builtins and functions they stood for.
  - The curated files carry no sampling rate; their spike times were turned into frames at the mouse recording's 30 kHz, as
    the paper's loader (NwbSortingExtractor) does with the rate it is given.
