findings:
- kind: metadata_insufficient
  statement: The units table holds only spike times and electrodes. It does not say which units are
    boundary, event or clip-onset cells, although Zheng et al. 2022 classified them and the paper
    analysed by that classification; the supplement of Zheng et al. gives only counts per subject.
- kind: format_error
  statement: The spike times of TWH138 (sub-19) run from about -7020208942450 s to 2967 s after that,
    while its trial tables run from 1 to 2892 s, so its spikes cannot be aligned with its trials. Some
    of its acquisition event timestamps are also near -7.02e12 s. The same holds in version
    0.230530.1822.
- kind: other
  statement: In only 7 of the other 18 sessions (P61CS, TWH117, TWH120, TWH125, TWH126, TWH127,
    TWH129) does the summed population count rise after clip onset (paired t at least 3; at most 2.5
    with onsets shifted by 30 s, and at most 3.8 over shifts of -12 to 12 s in the others). Three
    sessions (TWH101, TWH110, TWH113) respond at recognition image onsets but not at clip onsets, and
    Zheng et al. list 3 to 7 onset cells in sessions with no population response here, while TWH125,
    with no onset cell in their table, has one of the strongest responses. Whether the encoding table
    and the spikes share a clock in those 11 sessions could not be shown.
- kind: selection_undocumented
  statement: The dandiset holds 565 units, all in the medial temporal lobe; Zheng et al. report 985
    neurons, 580 of them in the MTL. The dandiset does not say that units outside the MTL were left out,
    nor which 15 MTL units are missing.
- kind: other
  statement: Version 0.230530.1822 renames the files and changes the spike times of TWH120 (sub-14),
    whose spike count rises from 323033 to 328693, with 28 of 30 units changed and first spikes moved
    by 0.26 to 9.76 ms, and codes missing boundaries as NaN; the version has no release notes.
- kind: methods_unavailable
  statement: Question for the paper's authors. Which units of DANDI:000207 were the boundary
    (soft and hard) and onset neurons of Figure 3, and were they taken from the classification of Zheng
    et al. or re-selected? Re-selecting them by the Methods of Zheng et al. finds 8 to 10 boundary and
    event cells where they count 76, so the selection could not be repeated. The bin width, smoothing,
    plotted window, z-score reference and which cuts (all SB and HB cuts, or one per clip) are also not
    given; the results under each reading are in the notebook.
- kind: methods_unavailable
  statement: The cell selection of Zheng et al. 2022, applied as its Methods describe to these files,
    gives 1 to 3 boundary and 7 event cells and a chance rate near 0.02% and 0.25% where they report
    42 and 36 cells and 2.11% and 2.26%; the dataset's example code has no selection code, and the
    Methods do not say whether the post-against-baseline test is paired.
- kind: paper_inconsistency
  statement: Methods E says four of "eighteen" subjects in Zheng et al. were excluded; Zheng et al.
    analyse neurons from 19 subjects, and the dataset holds 19. The four excluded subjects are the four
    with no clip-onset cell in their table, so the count of 18 likely leaves out TWH138, whose spike
    times cannot be aligned, without saying so.
- kind: methods_unavailable
  statement: The simulation code is not public ("will be made available in a Github repository at a
    later stage"), so the simulation claims cannot be rerun, and the parameters of Table I are not in
    the text.
