inputs:
- what: The Methods of Zheng et al. 2022 (ref. [41]), sections "Boundary cell", "Event cell",
    "Chance level for cell response analyses" and the Statistics paragraph, and the legend of its
    Extended Data Fig. 5 (clip onset cells), for reading (1b) of the selection of boundary, event and
    onset neurons. Read in the PubMed Central author manuscript.
  source: Zheng et al. 2022, Nat Neurosci 25 358, doi:10.1038/s41593-022-01020-w, PMC8966433
- what: Supplementary Table 2 of Zheng et al. 2022 (per-subject patient ID, subject ID, age, sex and
    counts of all, boundary, event and clip-onset cells), transcribed by hand into the helper
    (ZHENG_S2), as the table is an image. Used as reference values for the link claim and for
    reading (a) of the subject exclusion.
  source: doi:10.1038/s41593-022-01020-w, Supplementary Information PDF 41593_2022_1020_MOESM1_ESM.pdf,
    page 16
- what: The dataset's example code, for the meaning of boundary1_time to boundary3_time per clip
    category (B01_raster_psth_encoding_BAligned_BSep_NWB.m).
  source: https://github.com/rutishauserlab/cogboundary-zheng at commit 60f7ece3c51fb424aaca57b9daa41d19a9ef768c
outcomes:
- claim: link-zheng-table-s2
  outcome: reproduced
  notebook: reproduce_zhong_2026.ipynb
  output: claim:link-zheng-table-s2
  notes: All 19 subjects with neurons in Supplementary Table 2 of [41] are in the dataset under the
    same patient ID (the NWB identifier before "_CBID") and CBID, and agree on age and sex; every file
    holds no more units than the table's count of all cells. The files hold 565 units, all in the
    amygdala, hippocampus and parahippocampal gyrus; [41] reports 580 MTL neurons, so the per-subject
    MTL counts cannot be compared, the table giving only all cells. The table's boundary, event and
    onset columns sum to 42, 36 and 76 as its header says, its all-cells column to 943 against 985 in
    its header. TWH138 (sub-19) matches the table but its spike times are not on its trial clock.
  deviations:
  - The table is an image in the supplementary PDF and is transcribed by hand into the helper; a
    transcription error would show in the column sums, which match the header except for all cells.
- claim: methods-subjects-included
  outcome: partially_reproduced
  notebook: reproduce_zhong_2026.ipynb
  output: claim:methods-subjects-included
  measured:
  - 19
  - 14
  notes: Under reading (a), the classification of [41] through the counts of its Supplementary Table
    2, the rule of Methods E excludes exactly four subjects, TWH103, TWH109, TWH111 and TWH125, the
    four with no clip-onset cell (every subject has at least one boundary or event cell in the MTL).
    This keeps 14 of the 18 subjects whose spike times are on the trial clock, and 15 of all 19. P64CS
    and TWH120 are kept. The dataset holds 19 subjects with encoding sessions, as does [41] ("the
    neural results were analyzed across 19 subjects"); the paper's eighteen matches only once TWH138
    is set aside, whose spike times (about -7.0e12 s) cannot be aligned with its trial table, which
    would explain the paper's count but is not stated in it. So the kept count and the reason for the
    four exclusions reproduce, and the count of 18 subjects does not. Under reading (b), the
    re-selection by the Methods of [41], 5 to 9 of 18 subjects are kept, P64CS never among them, and
    the excluded sets differ from the paper's.
  deviations:
  - Reading (a) uses the per-subject counts of [41]'s Supplementary Table 2 as the classification;
    the dataset classifies no unit, so the claim is tested with outside labels (data with_labels)
    and depends on the added link claim.
  - TWH138 is left out of every analysis, its spike times not sharing the clock of its trial tables.
- claim: fig3a-dip-after-boundary
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_zhong_2026.ipynb
  output: claim:fig3a-dip-after-boundary
  notes: The paper takes its boundary neurons from [41] (Methods E). Reading (1a), the classification
    of [41], cannot be run on units; the dataset has no unit classification and [41] publishes only
    per-subject counts. Reading (1b) re-selects by the Methods of [41], run with a paired and an
    unpaired post-against-baseline test and with SB and HB compared with NB each or pooled. It finds
    1 to 3 boundary and 7 event cells (8 to 10 in all) in the 18 usable subjects, where [41]'s table
    counts 42 and 34 for them (76), with a per-subject correlation of 0.27 to 0.57. With the boundary
    labels shuffled (20 shuffles) the selection's chance rate is 0.02% for boundary and 0.25% for event
    cells, against 2.11% and 2.26% in [41]. Following the protocol on chance levels, this selection is
    not the paper's, and the claim is blocked even though the analysis ran. Under it, over the 5 to 9
    included subjects, a dip and a ramp are present in all 64 readings (selection 4, cuts 2, bins 2,
    smoothing 2, z-score reference 2), with the boundary peak at 155 to 338 ms and lags of 75 to 490 ms,
    within 130 plus or minus 13 ms (or one bin) in 5 readings; at NB virtual boundaries, with the same
    groups, none of 32 readings shows both. Over the 3 or 4 included subjects whose encoding clock is
    shown, dip and ramp appear in 50 of 64 readings with lags of 220 to 490 ms. A variant that is not a
    reading of the paper, giving each of the 14 subjects of reading (a) as many boundary neurons as
    [41]'s table counts, ranked by their response to cuts, shows dip and ramp in 16 of 16 readings with
    lags of 190 to 430 ms, but also in 4 of 8 readings at NB virtual boundaries, so the dip and ramp
    tests of the criterion do not separate a cut from no cut there. Question for the paper's authors
    (see findings) on which units were the boundary and onset neurons.
  deviations:
  - Which cuts form the trials is open (every SB and HB cut, as [41] aligns to boundaries, or the first
    cut of each SB and HB clip); both are run.
  - The permutation t-test of [41] is not said to be paired or unpaired for post against baseline, nor
    whether SB and HB are each compared with NB; all four combinations are run, 1000 permutations each
    ([41], Statistics paragraph).
  - The clip onset cells of [41] are taken as a one-tailed increase from the 1 s before to the 1 s
    after clip onset ([41], Extended Data Fig. 5 legend, "one-tailed permutation t-test").
  - The encoding clock could be shown in only 7 of 18 sessions; results are also given over those
    sessions.
- claim: fig3b-individual-subjects
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_zhong_2026.ipynb
  output: claim:fig3b-individual-subjects
  notes: Depends on fig3a-dip-after-boundary, which is blocked. For reference, under the re-selection
    at most 9 subjects are included and up to 9 show both a dip and a ramp, but P64CS is never included
    and TWH120 shows a dip in every reading. Under the rank-matched variant 9 to 13 of 14 subjects show
    both, and P64CS has a ramp and TWH120 a dip in every reading, so neither named exception appears.
- claim: fig3c-onset-control
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_zhong_2026.ipynb
  output: claim:fig3c-onset-control
  notes: Depends on fig3a-dip-after-boundary, which is blocked. The onset re-selection finds 100 to 101
    onset cells against 70 in [41]'s table for these subjects (per-subject correlation 0.15 to 0.17);
    TWH125, with no onset cell in [41], has 12 to 13 here. For reference, over the included subjects
    the non-onset trace passes the criterion's dip-and-ramp test in 6 of 8 readings for each
    re-selection and in 4 of 8 for the rank-matched variant; over the subjects whose encoding clock is
    shown, in 6 of 8 (paired) or 0 of 8 (unpaired), and 0 of 8 for the variant. The onset trace peaks
    635 to 1995 ms after clip onset, so the dip window from the peak often runs past the 1 s end of the
    ramp fit.
