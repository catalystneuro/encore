outcomes:
- claim: fig1e-pv-tdtomato-colocalization
  outcome: blocked
  blocked_by: data_missing
  notes: The post hoc anti-PV immunostaining (Experimental Procedures, Immunohistochemical
    Analysis) is not in the data set, whose published folder holds only two-photon movies,
    stimulus tables, plane shifts and 50 example masks. The paper names no other deposit.
- claim: cell-counts-responsive
  outcome: blocked
  blocked_by: data_missing
  notes: The counts are of the paper's cells, which "were identified by hand from structure images
    based on size, shape, and brightness", with PV+ cells chosen by co-localized tdTomato
    (Experimental Procedures, Data Imaging Analysis). The published folder (pvc-10/live/) holds no
    cell masks for its 58 planes, no PV+/PV- labels and no per-cell responses; its only masks are 50
    unlabelled examples for mouse5 depth 260. Places looked, besides live/; the paper links no code
    or other deposit; the bucket's folder original/to_remove/, outside the published file list and
    checksums and marked for removal, holds processed per-cell structs (masks, peaks, DSI, positions)
    but only for mice 7 to 10, with the three mouse 7 files without the PV suffix truncated, and cannot be pinned, so it
    was not used. Identifying cells anew would be a method the paper does not give beyond hand
    selection, and streaming the 252 GB of movies once takes an estimated 6 h at the rate of about
    11 MB/s measured in the notebook, against the 1 h notebook limit (too_large as a second reason).
