findings:
- kind: data_missing
  statement: The published data set (pvc-10/live/) holds the raw green and red two-photon movies of 58
    planes in 6 mice, their stimulus tables and plane shifts, and 50 unlabelled example cell masks for
    one plane (mouse5, depth 260). It holds no masks for the cells the paper analysed (identified by hand,
    338 PV+ and 3,982 PV-), no PV+/PV- labels and no per-cell responses or positions. Processed per-cell
    data for part of the animals exist only in an unpublished folder of the bucket (next findings).
- kind: metadata_error
  statement: The data descriptor says the data set "contains information about the fluorescence traces,
    peak responses per condition, the measured binocular characteristics for each cell like its disparity
    selectivity index, preferred relative disparity, the position of the cell in the imaging volume".
    None of these per-cell data are among the published files; they are in pvc-10/original/to_remove/,
    which the file list and checksums do not include, for mice 7 to 10 only.
- kind: other
  about: data
  statement: 'The bucket folder pvc-10/original/to_remove/, outside the data set''s file list and checksums,
    holds MATLAB structs ce (PV-) and cePV (PV+), one entry per cell, with fields Ftrace, cyc, peaks,
    standard, dsi, disparitypref, peakfit, peakfitparams, masks, xy, xyshft, depth, sampleG, sampleR,
    neuropilcyc, neuropilpeaks, dsineuropil, date, filename and windowlength. They are made from the published
    movies: for 9 cells of mouse 8 at depth 205 um the stored Ftrace equals the mask mean of the published
    green movie in every frame, and for all 578 cells the trials per condition equal the stim file''s repeats
    or one fewer.
    Readable structs cover mice 8, 9 and 10 (PV+ and PV-) and mouse 7 (PV+ only); the three mouse 7 PV-
    files (binoc7.mat, binoc7new.mat, 1452382802_binoc7.mat) are truncated and cannot be opened, and mice
    5 and 6 have index lists only. Publishing complete structs for all six mice, with a description of
    their fields, would make the data set usable for the paper''s analyses.'
- kind: metadata_insufficient
  statement: Nothing documents the structs or the binocmonocinds<mouse>[PV].mat index lists. The lists
    (109 PV+ and 769 PV- cells over 6 mice) look like the paper's visually responsive cells but cannot
    be confirmed. The field standard matches the responsiveness index of the Methods recomputed from peaks
    for 279 of 578 cells only; windowlength is 300 with no unit; neuropilpeaks is one region per plane;
    and the mouse 7 plane shift is stored in xyshft as (-70, 157) where stats.mat gives (157, -70) um.
- kind: selection_undocumented
  about: data
  statement: 'The structs hold a selection of the paper''s cells, not all identified cells: every PV+
    cell in them passes the binocular responsiveness index (157 of 157), and 400 of 421 PV- cells of mice
    8 to 10 do. Mice 8 to 10 hold 58 PV+ and 421 PV- cells against the paper''s 338 PV+ and 3,982 PV-
    in 6 mice. The selection rule is not stated, so the paper''s counts of identified cells cannot be
    checked.'
- kind: methods_unavailable
  statement: Question for the authors. The Methods require responses above "neuropil activity (> 95% confidence
    interval)" without defining the neuropil region or the interval, and do not say how Fo and the 0.5
    s window are placed for each trial. Read as the cell's mean above the plane neuropil's mean + 1.96
    SE, the test keeps far fewer cells (41 PV+, 92 PV- passing the joint criterion where the binocmonocinds
    lists hold 81 and 189), and per-trial responses computed from the stored Ftrace with Fo the 10 frames
    before onset correlate with the stored peaks at r = 0.39 only. This attempt took the binocmonocinds
    lists as the paper's responsive cells. Which cells do those lists hold, and how were the neuropil
    test, Fo and the window computed?
- kind: data_missing
  statement: The two rAAV CaMKIIa-nls-tdTomato mice of Figure 5, the neuropil patches of Supplementary
    Figures 3 and 5, and the anti-PV histology of Figure 1E are not in the data set (the structs hold
    one neuropil region per plane), and the descriptor does not say they were left out.
- kind: metadata_error
  statement: The descriptor gives frames of 255 by 456 pixels and converts positions with 300/456 and
    300/255 um per pixel. Every frame in the files is 256 by 455 pixels, as the paper states.
- kind: metadata_insufficient
  statement: The data set gives no frame rate. At the paper's 30 Hz, the median stimulus onset intervals
    give cycles of 3.93 s in mouse 5 and 4.37 to 4.43 s in mice 7 to 10, against the 4.5 s and 5 s that
    the stimulus durations in the stats files plus the Methods' 3 s blank give; only mouse 6 fits. Either
    the frame rate or the blank differs from the Methods in five of six mice.
- kind: other
  about: data
  statement: Eight planes have fewer than the 6 to 7 repeats per condition the paper states (all six planes
    of mouse 10 have 4 or 5), and in four planes (mouse6 240 and 300, mouse8 250, mouse10 200) the last
    stimulus cycle runs past the last frame. Mouse 10 includes a plane at 125 um, above the 150 um the
    Methods give as the start. The structs hold the same numbers of trials per condition, so these planes
    were analysed with them.
