findings:
- kind: data_missing
  statement: The published data set (pvc-10/live/) holds the raw green and red two-photon movies
    of 58 planes in 6 mice, their stimulus tables and plane shifts, and 50 unlabelled example cell
    masks for one plane (mouse5, depth 260). It holds no masks for the cells the paper analysed
    (identified by hand, 338 PV+ and 3,982 PV-), no PV+/PV- labels and no per-cell responses or
    positions, so none of the paper's findings can be tested from it without identifying and
    classifying the cells anew.
- kind: metadata_error
  statement: The data descriptor says the data set "contains information about the fluorescence
    traces, peak responses per condition, the measured binocular characteristics for each cell like
    its disparity selectivity index, preferred relative disparity, the position of the cell in the
    imaging volume". None of these per-cell data are among the published files.
- kind: other
  about: data
  statement: The bucket holds a folder pvc-10/original/to_remove/, not in the data set's file list
    or checksums, with MATLAB structs from November 2014 that look like the paper's processed
    per-cell data (fields masks, peaks, dsi, disparitypref, xy, neuropilcyc and others). They cover
    mice 7 to 10 only (mice 5 and 6 have index files alone), and the three mouse 7 files without the PV suffix
    are truncated and cannot be opened. If these are the paper's cells, publishing a complete set would
    make the data set usable for the paper's analyses.
- kind: data_missing
  statement: The two rAAV CaMKIIa-nls-tdTomato mice of Figure 5, the neuropil patches of
    Supplementary Figures 3 and 5, and the anti-PV histology of Figure 1E are not in the data set,
    and the descriptor does not say they were left out.
- kind: metadata_error
  statement: The descriptor gives frames of 255 by 456 pixels and converts positions with 300/456
    and 300/255 um per pixel. Every frame in the files is 256 by 455 pixels, as the paper states.
- kind: metadata_insufficient
  statement: The data set gives no frame rate. At the paper's 30 Hz, the median stimulus onset
    intervals give cycles of 3.93 s in mouse 5 and 4.37 to 4.43 s in mice 7 to 10, against the 4.5 s
    and 5 s that the stimulus durations in the stats files plus the Methods' 3 s blank give; only
    mouse 6 fits. Either the frame rate or the blank differs from the Methods in five of six mice.
- kind: other
  about: data
  statement: Eight planes have fewer than the 6 to 7 repeats per condition the paper states (all six
    planes of mouse 10 have 4 or 5), and in four planes (mouse6 240 and 300, mouse8 250, mouse10 200)
    the last stimulus cycle runs past the last frame. Mouse 10 includes a plane at 125 um, above the
    150 um the Methods give as the start.
