- claim: fig1e-pv-tdtomato-colocalization
  outcome: blocked
  blocked_by: data_missing
  notes: The post hoc anti-PV immunostaining (Experimental Procedures, Immunohistochemical Analysis) is
    not in the data set, whose published folder holds only two-photon movies, stimulus tables, plane shifts
    and 50 example masks. The paper names no other deposit.
- claim: cell-counts-responsive
  outcome: blocked
  blocked_by: data_missing
  notes: 'The counts are of all cells the paper identified by hand in 6 mice (338 PV+, 3,982 PV-) and
    of those responsive. The published folder (live/) holds no cell masks, labels or responses. The structs
    in original/to_remove/ hold only cells already selected: every PV+ cell in them passes the binocular
    index (58 of 58 in mice 8 to 10, 99 of 99 in mouse 7), and they cover mice 7 to 10 only, so the totals
    of identified cells cannot be counted. The binocmonocinds lists, which cover all 6 mice, total 109
    PV+ and 769 PV- cells, against the paper''s 115 and 944 monocular-responsive cells (data check); what
    they select is not documented. The dependent claims are tested on the responsive cells the structs
    and lists give: what blocks this claim is the missing record of the non-responsive identified cells,
    which those claims do not use.'
- claim: fig3abc-pv-more-binocular-fraction
  outcome: reproduced
  notebook: reproduce_scholl_2015.ipynb
  output: claim:fig3abc-pv-more-binocular-fraction
  measured:
  - 60.5
  - 45.5
  assumed: true
  notes: 'Main reading (binocmonocinds cells, PV+ of mice 7 to 10, PV- of mice 8 to 10, blank-subtracted
    responses with negatives set to zero): 60.5% of 81 PV+ and 45.5% of 189 PV- cells have -0.5 < ODI
    < 0.5, within 57.6 to 70.4% and 40.5 to 49.5%. Mice 8 to 10 only, 57.7% of 26 and 45.5%. N gives 58.5%
    and 44.6% (joint) and 61.7% and 42.7% (mono), within; W gives a PV- fraction of 51.3% or 50.6%, outside,
    and responses without the blank subtracted give PV+ fractions of 35.8% to 50.0%, outside. PV+ cells
    per animal in mice 8 to 10 are 3 to 13. Depends on cell-counts-responsive, blocked for the identified-cell
    totals only (see its notes).'
  deviations:
  - The per-cell data come from the MATLAB structs in pvc-10/original/to_remove/ (binoc8, binoc8PV, binoc9,
    binoc9PV, binoc10, binoc10PV, binoc7PV and the binocmonocinds lists), which are in the data set's
    bucket but not in its published file list or checksums; each is identified by its S3 ETag in the notebook.
    The stored Ftrace equals the mask mean of the published movie for the 9 cells checked (mouse 8, depth
    205).
  - Mice 8, 9 and 10 only (PV+ and PV- structs), against the paper's 6; mice 5 and 6 have no struct and
    the mouse 7 PV- files are truncated.
  - Population comparisons pool PV+ cells of mice 7 to 10 with PV- cells of mice 8 to 10 (every cell the
    structs hold, as the paper pools cells across animals); mice 8 to 10 alone is shown as a variant.
  - 'Assumption: the visually responsive cells are the cells in the binocmonocinds lists (L). The lists
    are undocumented; their name reads as cells responsive to binocular and monocular stimuli (the Methods''
    joint criterion), 235 of their 270 cells in the structs (77 of 81 PV+, 158 of 189 PV-) pass the joint
    criterion on the stored index, they hold fewer cells than that criterion alone gives (as the Methods''
    further neuropil test and check by eye would remove), and their totals over 6 mice, 109 PV+ and 769
    PV-, are 5% and 19% below the paper''s monocular-responsive counts (115, 944). The Methods'' criterion
    applied here with a neuropil test (N, cell mean above the plane''s neuropil mean + 1.96 SE) and without
    it (W) is shown for every claim. L decides every outcome, and "under one reading" in a criterion ranges
    over the claims file''s readings within L, so the cell set is not chosen claim by claim. N keeps about
    half the cells of L (41 PV+ and 92 PV- joint, 47 and 103 monocular, against 81 and 189 in the Figure
    3 pool) with a neuropil test the Methods do not define. Under L the claims file''s cell readings (joint,
    and monocular-responsive) give the same cells.'
  - ODI uses the mean dF/F minus the blank mean with negatives set to zero, the form of the structs' stored
    DSI (shown to match it for all 578 cells); responses as measured and blank subtracted without clipping
    are shown.
