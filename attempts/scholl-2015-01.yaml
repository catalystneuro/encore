- claim: figs3-pv-distinct-from-neuropil
  outcome: blocked
  blocked_by: data_missing
  notes: 'The 28% is of PV+ cells with no evoked activity next to active neuropil patches. The structs
    hold one neuropil region per plane (neuropilpeaks identical for all cells of a plane), not the patches
    near each cell, and hold no non-responsive PV+ cells: every struct PV+ cell passes the binocular index
    (data check), so the fraction would be 0 by selection. The published folder holds neither. Figures
    S3A and S3B are single examples, not tested.'
