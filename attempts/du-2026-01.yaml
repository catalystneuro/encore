findings:
- kind: metadata_insufficient
  about: data
  severity: minor
  datasets:
  - "001201"
  statement: The LINK velocity series (index_velocity, mrs_velocity, described as "Velocity of index
    flexion" in "flexion units per time bin") are exactly the forward first difference of the released
    position, velocity[t] = position[t+1] - position[t] (correlation 1.000 in all 18 development
    sessions), so each velocity bin uses the position of the next bin. The files do not say so, and the
    paper states the differentiation recipe could not be verified.
- kind: metadata_error
  about: data
  severity: minor
  datasets:
  - "001201"
  statement: ThresholdCrossings is stored with unit volts but holds integer counts per 20 ms bin (0 to
    11), and SpikingBandPower, also in volts, holds values of about 0.04 to 341, which are not plausible
    as volts.
- kind: format_error
  about: data
  severity: minor
  datasets:
  - "001201"
  statement: The 20 ms timestamps of session 2021-10-15 CO contain one gap of 1094 ms; the other 17
    development sessions have steps of 19 to 21 ms only. All 375 trials of that session are still
    usable.
- kind: metadata_insufficient
  about: data
  severity: minor
  datasets:
  - "000129"
  statement: The MC_RTT training file's behaviour series hold 15 missing (NaN) 20 ms bins, which no
    description mentions; none falls inside the 1,080 analysis blocks.
- kind: other
  about: data
  severity: none
  datasets:
  - "001201"
  - "000129"
  statement: Checks that passed. LINK holds nine dates with a CO and an RD session, 375 trials each, one
    subject, no session deposited twice, and SBP, TCR, position, velocity and trials on one clock
    (velocity decoding from SBP peaks at lag 0 in 16 of 18 sessions and 2 bins in 2). The paper's
    confirmation rule re-run on the archive's metadata gives its 20 sessions, each with 375 usable
    trials. MC_RTT holds 1,080 blocks, 130 units and the 810/270 split, and its finger velocity follows
    the derivative of cursor position at lag 0.
- kind: other
  about: paper
  statement: The paper says the NLB velocity unit fields and descriptions disagree (Limitations, Table 2
    legend). In MC_RTT and in MC_Maze (hand_vel, cursor_pos) the series carry unit m/s or meters with
    conversion 0.001, so the stored values are mm/s and mm, as the descriptions say; the fields agree
    once the conversion is applied.
- kind: other
  about: paper
  statement: The paper's released code, ported here, reproduces its reported values at their printed
    precision for every claim tested; run next to the ports on MC_Maze and on one LINK session, the
    release's estimator functions give identical values. The confirmation-set values are those of one
    outer split (seed 20260726); under four other split seeds the combined geometry-by-phase mean is
    0.0148 to 0.0207 and the history mean 0.0034 to 0.0082, so the exact values reported rest on that
    split, while the qualitative pattern holds in each. The MC_Maze gain (0.00051) and replacement gain
    (-0.00004) likewise rest on the estimator seed, and under four others the gain is -0.00014 to 0.00053
    and the replacement gain -0.0027 to 0.00003.
