- claim: fig2-psp-histogram-modality
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_kim_2020.ipynb
  output: claim:fig2-psp-histogram-modality
  measured:
  - 17
  - 23
  notes: Main reading (noise s.d., KDE maxima, the code's amplitudes) 17 bimodal and 23 unimodal; rest-referenced
    amplitudes 21 and 19; the dip test 0 to 9 bimodal; the pre-stimulus s.d. leaves a median of 0 or 1
    non-spiking events per neuron, as the pre-stimulus segment (12.5 to 18.7 s) holds 11 to 115 spontaneous
    peaks and an s.d. about five times the event-free noise during the DMR (medians 6.32 and 1.28 mV).
    No reading reaches 24 +- 2.4. Open for the paper's authors - which baseline segments set the 4 x s.d.
    cut for "very small events" (Results, Spectrotemporal receptive fields, paragraph 3) and how bimodality
    was judged. The claims file's D2 (b) wording is asked of a reader (questions/kim-2020.yaml); the amplitude
    run as D2 (b) here is the peak value peakfinder returns.
  deviations:
  - Events are the code's peakfinder peaks (selectivity 3 mV, read_data.m) on the data set's processed
    traces; amplitude is the processed value at the peak (the code's Amp_dist, "the same absolute baseline",
    Methods).
  - The baseline s.d. is the within-segment noise of event-free 50-ms segments during the DMR (D3 reading
    (b) as implemented here), an assumption; D3 (a) and a variant of (b) that keeps slow drifts are shown.
  - Bimodality by two KDE maxima separated by a trough (D4 (a)), the smaller at least 10% of the larger,
    a threshold of this attempt; the dip test (D4 (b)) is shown.
- claim: fig2-strf-significance-groups
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_kim_2020.ipynb
  output: claim:fig2-strf-significance-groups
  measured:
  - 37
  - 3
  notes: D7 (a), any significant positive pixel, and D7 (b), a contiguous significant positive region
    of at least 2 pixels, select the same neurons, 37 with all three STRFs and 3 with PSP but not spike
    STRFs. Variants - the code's analytic significance (p = 0.005) gives 35 and 5 (any pixel) or 29 and
    6 (regions); subfields kept by a cluster test give 15 and 11, with 13 in other patterns and 1 with
    none; spikes by rate of rise change the counts by at most two. None gives 30 and 10. Open for the
    paper's authors - what made an STRF subfield significant; at p < 0.05 per pixel about 5% of the 2560
    pixels pass by chance.
  deviations:
  - STRFs on the downsampled DMR envelope (5 ms, 64 channels 0.1 octave apart, 0 to 195 ms before the
    event), as the paper's wcr_strf.m names it and rtwstrfdb.m computes it.
  - Pixel significance per the Methods, p < 0.05 two-tailed against the pooled pixels of 100 circularly
    shifted event trains (claims file, D6); the shipped code uses an analytic threshold (significant_strf.m,
    p = 0.005 in plot_strf_single.m), shown as a variant.
  - Non-spiking events are kept above 4 x the s.d. of event-free 50-ms segments during the DMR (D3 (b));
    the pre-stimulus trace (D3 (a)) holds 11 to 115 spontaneous peaks and an s.d. of 6.32 mV (median)
    against 1.28 mV, and removes nearly every PSP, so (b) is adopted (assumption).
