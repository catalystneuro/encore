- claim: fig5a-cf-bf-correlation
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_kim_2020.ipynb
  output: claim:fig5a-cf-bf-correlation
  measured: 0.04
  notes: 35 of 40 all-event STRFs have a subfield; CF against BF r = 0.04 (kHz) and -0.01 (log2); the
    median BF lies 0.51 octaves from the CF. With the code's analytic significance (39 neurons) r = 0.23
    on log2. Diagnosis - the CF is set at the threshold level (0 dB SPL in 64 of 66 neurons), where a
    median of 5 of 45 tones per neuron pass the response criterion on a single presentation, and it does
    not correlate with the TRF's best frequency at 40 to 70 dB SPL (r = -0.02); the example TRF printed
    shows scattered single responses. Against the TRF best frequency over all levels the STRF BF gives
    r = 0.37 (p = 0.027). The STRF BFs fall on 9 envelope channels, 11 at 20.0 kHz, 8 at 18.6 kHz and
    7 at 12.3 kHz. Whether the tone order's frequency column is right cannot be checked beyond its 45
    values; the level column is validated by the loud against quiet contrast.
  deviations:
  - BF is the peak of the strongest band, or of the band closest to CF for two bands (Results, Frequency
    selectivity, paragraph 1); CF is the frequency with the largest response at the lowest responsive
    level, a choice where several tones respond at that level.
  - Bands within an STRF (for BF, bandwidth, latency, duration, double peaks) are subfields whose summed
    value exceeds the 95th percentile of the largest subfield of the shifted STRFs, a cluster test this
    attempt adds (assumption); without it 36 to 40 of the 40 STRFs of each type are double-peaked.
