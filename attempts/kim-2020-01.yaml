findings:
- kind: data_missing
  statement: The Supplementary folders hold one neuron each, a representative example in the data description's
    words; Supplementary Fig. 2 rests on 13 STRF pairs from 2 neurons and Supplementary Fig. 3 on 5 neurons,
    so neither can be tested.
- kind: identifier_missing
  statement: No file or table gives an animal identifier, so the paper's counts of 41 and 24 mice cannot
    be checked; the current-clamp recordings fall on 39 dates and the voltage-clamp ones on 22.
- kind: metadata_error
  statement: The data description says each processed file is raw - smooth(raw, 100000) (data analysis
    instructions, step 1). This holds to rounding for 16 of the 84 DMR recordings; 67 differ from it over
    most samples (largest differences 0.3 to 24 mV, or pA, per recording) and one at 39 samples. Triggers
    are identical in the raw and processed files.
- kind: other
  statement: Two Supplementary recordings are byte-identical copies of main DMR recordings (17726007 in
    the 54 dB SPL intensity folder, 17921007 in the reliability folder).
- kind: other
  statement: Five of the 27 excitatory recordings were held at -70 mV, where the data description says
    approximately -80 mV; the data set's table gives the holding potential of each.
- kind: code_mismatch
  statement: The Methods state that STRF pixels are significant at p < 0.05 against STRFs from circularly
    shifted event trains. The shipped code uses an analytic threshold (significant_strf.m) with p = 0.005
    for the plotted STRF, p = 0.01 for the nonlinearity and p = 0.001 (wstrfstat) for the FSI. Group counts
    differ between the two (37 neurons with all three STRFs by the Methods' null under either of the claims
    file's readings, 15 with a cluster test; 35 or 29 by the code's).
- kind: methods_unavailable
  statement: The shipped code covers event detection, STRF, nonlinearity fit and FSI, but not the split
    of events into spikes, large and small PSPs, the baseline s.d. that removes very small events, the
    bimodality test, what makes an STRF subfield significant, how bands, bandwidths, double peaks, BF,
    latency and duration are measured, the RTF best modulation, the voltage-clamp event sign and selectivity,
    or the TRF analysis (done in IgorPro). Questions for the authors - which baseline segments set the
    4 x s.d. and 3 x s.d. cuts; how bimodality was judged; how a significant subfield and a second peak
    were told from chance pixels at p < 0.05; how bandwidth was measured on the STRF; whether EPSC peaks
    were found on the inverted current, with which selectivity, and which baseline s.d. set the 3 x s.d.
    cut for currents (three Table 2 claims reproduce only with the pre-stimulus s.d. at 20 pA). The outcomes
    of most STRF claims here depend on these choices.
