    at least 2 pixels, on the circular-shift null at p < 0.05), where the paper has 30; the code's analytic
    significance (29 neurons) and a cluster test on the shift null (15 neurons, the first round's group)
    are shown as variants.
  - RTF on the native FFT grid of the 40 x 64 STRF (5 Hz, 0.156 cyc/oct), restricted to the DMR's 40 Hz
    and 4 cyc/oct, the 3 dB cutoff interpolated; the paper's code for this is not in the data set.
