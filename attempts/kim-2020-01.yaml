- claim: cc-cohort-counts
  outcome: reproduced
  notebook: reproduce_kim_2020.ipynb
  output: claim:cc-cohort-counts
  notes: The data set holds 66 current-clamp tone recordings and 40 DMR recordings, and its table (docs/data_file_information.xlsx)
    pairs each DMR recording with a tone recording of the same neuron. The number of mice (41) cannot
    be counted, as no file or table gives an animal identifier; the 66 recordings fall on 39 dates. The
    criterion reports mice only where the data identify animals.
- claim: vc-cohort-counts
  outcome: reproduced
  notebook: reproduce_kim_2020.ipynb
  output: claim:vc-cohort-counts
  notes: 27 excitatory and 12 inhibitory recordings from 31 neurons, 8 with both, as the table lists them.
    The number of mice (24) cannot be checked, as no animal identifier is given; the recordings fall on
    22 dates. Five excitatory recordings were held at -70 mV and 22 at -80 mV.
  deviations:
  - The mouse count, one of the expected values, cannot be tested; it is treated as the current-clamp
    criterion treats it.
- claim: fig1-psp-amplitude-kinetics
  outcome: reproduced
  assumed: true
  notebook: reproduce_kim_2020.ipynb
  output: claim:fig1-psp-amplitude-kinetics
  measured:
  - 14.0
  - 30.3
  - 91.5
  notes: With the mean PSP per neuron (D16 (b)) and a baseline s.d. pooled over the 50-ms pre-tone segments,
    amplitude 14.0 +- 6.3 mV, rise 30.3 +- 9.5 ms and decay 91.5 +- 16.8 ms, all within tolerance (n =
    66). Taking the amplitude from the median potential (D14 (a)) gives 13.0 mV, also within. The largest
    PSP per neuron (D16 (a)) is 25.2 +- 11.6 mV (23.8 from the median), outside. With a per-tone s.d.
    the mean amplitude is 10.3 mV and no reading matches.
  deviations:
  - Responses are tones whose trace first exceeds the 50-ms pre-tone mean by 4 x the baseline s.d. 5 to
    50 ms after onset (Methods, Data analysis); the baseline s.d. is pooled over all pre-tone segments,
    an assumption the Methods' plural "baseline segments" supports; a per-tone s.d. is shown as a variant
    and gives a different outcome.
  - The PSP peak is taken in the 100 ms after onset and the decay followed to 250 ms, choices the paper
    does not state; tones with a spike 5 to 100 ms after onset are left out of amplitude and kinetics
    (claims file, D16), and tones with a spike within 250 ms out of the decay (307 tones); 919 tones whose
    decay does not reach 10% in 250 ms give no decay value.
