- claim: fig1d-ndr-distribution
  outcome: reproduced
  assumed: true
  notebook: reproduce_kim_2020.ipynb
  output: claim:fig1d-ndr-distribution
  measured: 31
  notes: Under region (a), the responsive tones, bins of 0.1 hold 19, 10, 6, 5, 7, 8, 5, 1, 1, 4 neurons;
    6 of 66 (9%) lie above 0.7, and 31 have NDR of at least 0.3. Region (b), the outline, which also counts
    spikes at tones inside it with no PSP onset detected, gives 33 at 0.3 or more but 11 of 66 (17%) above
    0.7, failing the criterion. With a per-tone baseline s.d. 18 (a) or 21 (b) neurons reach 0.3.
  deviations:
  - Spikes are peakfinder events (the paper's code) above the per-neuron gap of the amplitude histogram
    (claims file D1 (a)); a spike counts for a tone when it falls 5 to 100 ms after onset, a window the
    paper does not state.
  - Baseline s.d. pooled over the pre-tone segments, as for fig1-psp-amplitude-kinetics.
  - The TRF region readings (D15) give different outcomes; region (a) is adopted, as it counts spikes
    and PSPs over the same tones (assumption).
- claim: fig1e-ndr-vs-rest-weak
  outcome: reproduced
  assumed: true
  notebook: reproduce_kim_2020.ipynb
  output: claim:fig1e-ndr-vs-rest-weak
  measured: 0.182
  notes: With the pre-tone mean as resting potential (D14 (b)) and region (a), r = 0.182, p = 0.144 (n
    = 66); with the median (D14 (a)) and region (b), r = 0.187, p = 0.134. The median with region (a)
    gives r = 0.116, p = 0.355 (outside tolerance), and the pre-tone mean with region (b) r = 0.244, p
    = 0.0483 (significant). With a per-tone baseline s.d., r = 0.035 to 0.098.
  deviations:
  - Baseline s.d. pooled over the pre-tone segments, as for fig1-psp-amplitude-kinetics.
- claim: fig1fgh-trf-bandwidth-narrowing
  outcome: partially_reproduced
  notebook: reproduce_kim_2020.ipynb
  output: claim:fig1fgh-trf-bandwidth-narrowing
  measured:
  - 1.94
  - 1.49
  - 0.9
  notes: In the 31 neurons with NDR of at least 0.3 under region (a) (28 with both bandwidths), PSP bandwidth30
    1.94 +- 0.76 and spike bandwidth30 1.49 +- 0.94 octaves, median ratio 0.90, paired t p = 0.00037 with
