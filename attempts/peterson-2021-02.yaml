- claim: fig6d-upward-reaches-enhance-pattern
  outcome: reproduced
  assumed: true
  notebook: reproduce_peterson_2021.ipynb
  output: claim:fig6d-upward-reaches-enhance-pattern
  notes: Over models with R2 above 0.05, the median reach angle coefficient is -0.702 for LFB (13 of 14
    negative) and +0.536 for HFB (13 of 14 positive). With the code's selection by LFB R2 the HFB median
    is +0.237. Positive angles are upward because the stored image-coordinate angle is negated before
