inputs:
- what: The paper's projection matrices from electrodes to AAL regions and the region centroids
    (aal_XX_elecs2ROI.csv and aal_XX_ROIcentroids_Lside.csv for the 12 subjects), read at run time.
    Used for every claim on regions and for the link claim roi-projection-link.
  source: doi:10.6084/m9.figshare.12114408.v1
outcomes:
- claim: subject-days
  outcome: reproduced
  notebook: reproduce_peterson_2021.ipynb
  output: claim:subject-days
  notes: The dataset's subjects 01 to 12 have exactly the days of Table 2 (S01 days 3, 4, 5 and 7;
    S02 and S03 days 3 to 6; S05 days 3, 4 and 7; the others days 3 to 7), 55 subject-days. The
    subjects are taken as S01 to S12 in order.
- claim: roi-projection-link
  outcome: reproduced
  notebook: reproduce_peterson_2021.ipynb
  output: claim:roi-projection-link
  notes: The paper's code rule (keep the rows that are not all zero and drop the first of them,
    tfr_utils.load_project_spectral_power) leaves exactly as many rows as electrodes with a
    position in all 12 subjects. The dropped first row is the electrode density of each region (the
    other rows sum to 1 per region), and the regions with mean density above 3 are exactly the eight
    of the claims file. The largest-weight region is the region whose centroid is nearest the
    mirrored electrode position for 36 to 55% of electrodes per subject, against at most 14
    electrodes in 200 shuffles of the electrode order; all 12 subjects beat every shuffle under all
    five seeds.
  deviations:
  - The criterion's rule as worded (drop all-zero rows) leaves one row too many in every subject and
    drops the zero rows of the 24 electrodes without a position in S03 and S12. The code's rule
    (tfr_utils.load_project_spectral_power, commit 04c6faf, `np.nonzero(df.transpose().mean().values
    != 0)[0][1:]`) also drops the first non-zero row; it is used, and the rows are applied in order
    to the electrodes with a position. Electrodes without a position get no weight.
- claim: cohort
  outcome: partially_reproduced
  notebook: reproduce_peterson_2021.ipynb
  output: claim:cohort
  measured:
  - 12
  - 8
  - 29.42
  - 84.83
  - 7
  - 23.71
  - 5
  notes: Twelve subjects, 8 male, mean age 29.42 years (SD 7.94), 84.83 surface electrodes on average
    (SD 11.61) and 5 right-hemisphere implants match. Electrode groups described in the files as
    depth are in 7 subjects (S01 8, S02 16, S03 16, S09 28, S10 48, S11 18, S12 32), not 5; their mean
    of 23.71 (SD 13.39) is within the stated 23.2 +- 12.1. The ages are the files' ages, which may
    not be the ages at recording.
  deviations:
  - Surface and depth electrodes are told apart by the description of each electrode group (depth
    when it says depth). The hemisphere is the side of the mean MNI x of the subject's electrodes.
- claim: fig2-event-counts
  outcome: not_reproduced
  notebook: reproduce_peterson_2021.ipynb
  output: claim:fig2-event-counts
  measured:
  - 211
  - 996
  - 770.5
  notes: Under reading (a), all events in the files, the counts per subject are 211 to 996 with median
    770.5. Under reading (b), after the segment rejection, they are 210 to 976 with median 691. With
    only the events that have ECoG without missing samples, 211 to 986, median 700.5. Under reading
    (b) the median and the largest count are within tolerance, but in every reading the fewest events
    (210 or 211, in S09) are outside 151 +- 15.1. The dataset has no false-positive flag, so reading
    (b) cannot drop those events.
  deviations:
  - The dataset has no flag for the events the paper removed as false positives; none are dropped
    for it.
  - Reading (b) uses the assumed pooling of the segment rejection (see the deviation of
    fig3-group-lfb-decrease-hfb-increase); 125 events with NaN ECoG samples and 237 without ECoG
    count as missing data.
- claim: fig2-features-differ-across-subjects
  outcome: reproduced
  notebook: reproduce_peterson_2021.ipynb
  output: claim:fig2-features-differ-across-subjects
  notes: One-way Kruskal-Wallis across the 12 subjects on the 7650 events of reading (b) gives
    p < 0.001 for all ten features; the largest p is 1.1e-32 (reach duration). Reading (a), all 8088
    events, gives the same.
  deviations:
  - Time of day is the event time in hours after the file's midnight (the files' session
    description); reach duration is stop_time minus start_time; reach angle is the stored angle
    negated and folded to -90..90, as the code does, because the stored angle is in image
    coordinates (checked against the pose).
- claim: fig2-reach-shape
  outcome: partially_reproduced
  notebook: reproduce_peterson_2021.ipynb
  output: claim:fig2-reach-shape
  notes: Most reaches last under 2 s (88 to 95% per subject, 91.8% pooled) and cover under 200 pixels
    (59 to 100% per subject, 91.3% pooled), in 12 of 12 subjects. The angle part fails in 0 of 12
    subjects and pooled. Pooled, the two highest maxima of the folded-angle density are at -71.5 and
    +75 degrees, and the density at 0 degrees (0.00407) is above the lower maximum (0.004). The
    kernel density smooths the mass at the +-90 boundary inward, so the maxima fall inside the 15
    degree window only rarely. Reading (a) gives the same outcome.
  deviations:
  - The density is evaluated on a 0.5 degree grid, and the end points of the grid count as maxima
    when they exceed their neighbour (standard choices, stated in the notebook).
- claim: fig2-bimanual-skew
  outcome: reproduced
  notebook: reproduce_peterson_2021.ipynb
  output: claim:fig2-bimanual-skew
  notes: The median bimanual ratio is below 0.5 in 12 of 12 subjects (0.14 pooled) and the overlap
    skewness positive in 12 of 12 (1.11 pooled); more than half the events are bimanual in 12 of 12
    (73% pooled). The five highest median ratios are S04, S07, S05, S02 and S03, and the five lowest
    overlap skewnesses S07, S05, S02, S03 and S04, so S02, S04 and S05 are among both.
  deviations:
  - The files hold no missing bimanual ratios, so the code's fill value of 0.5 is never used.
- claim: extfig2-1c-contralateral-larger
  outcome: reproduced
  notebook: reproduce_peterson_2021.ipynb
  output: claim:extfig2-1c-contralateral-larger
  notes: In all 12 subjects and under both readings of the rest position, the peak over 0 to 1.5 s of
    the median contralateral displacement exceeds that of the ipsilateral wrist. The ratio is 1.06 to
    42.0 under reading (b) and 1.12 to 38.1 under reading (a); it is smallest for S05 and S04. The
    contralateral wrist is the one the ReachEvents description of each file names. 58 of 7650 events
    have missing pose in the window and are left out of the medians.
- claim: extfig2-2-feature-correlations
  outcome: partially_reproduced
  notebook: reproduce_peterson_2021.ipynb
  output: claim:extfig2-2-feature-correlations
  measured:
  - 0.229
  - 0.61
  - 0.508
  - 0.5
  - 0.494
  - 0.596
  notes: Five of the six Pearson correlations over the pooled events of reading (b) are within 10% of
    the paper's; reach magnitude and duration correlate at 0.229, below 0.234. Reading (a) gives 0.231
    for that pair and the same five matches.
- claim: fig2-days-and-waking
  outcome: partially_reproduced
  notebook: reproduce_peterson_2021.ipynb
  output: claim:fig2-days-and-waking
  notes: The waking part holds; 64 to 95% of each subject's events fall between 08:00 and 24:00. The
    busiest day holds more than half of the events for S05 (0.606, day 7) and S09 (0.519, day 5) and
    for none of the other subjects; for S04 it holds 0.400 (day 7), so the day part does not hold.
    Reading (a) gives the same two subjects.
- claim: fig3-group-lfb-decrease-hfb-increase
  outcome: reproduced
  assumed: true
  notebook: reproduce_peterson_2021.ipynb
  output: claim:fig3-group-lfb-decrease-hfb-increase
  notes: Over 0 to 0.5 s the masked group power over 4-30 Hz and 50-120 Hz is -0.758 and +0.445 dB in
    precentral, -0.773 and +0.467 in postcentral, and -0.589 and +0.262 in inferior parietal; at the
    bin of 0 s the signs are the same. All three hold under both readings and all five seeds. Middle
    frontal and supramarginal show the pattern too; superior and inferior temporal do not.
  deviations:
  - Spectral power is computed from the dataset's continuous ECoG, not from the paper's curated
    Figshare epochs, with the Methods' and the code's parameters (helper docstring).
  - Assumed, as the Methods do not say how power is pooled for the segment rejection; Welch power of
    the 10 s segment averaged over the file's good electrodes, 10*log10 of its mean over 1-200 Hz
    (below 0 dB drops) and over 115-125 Hz (above the subject's mean + 3 SD drops). Segments with
    NaN samples or without ECoG count as missing data. 75 events drop for high-frequency power and 1
    for low power; the rest of the 438 dropped events have no ECoG or NaN samples.
  - Assumed, as the good-electrode flags differ between a subject's files; each event is projected
    with the weights of its own file's good electrodes, renormalised to sum 1 per region (code).
  - The bootstrap mask's Benjamini-Hochberg correction runs over the bins computed here (-1.5 to +1.0
    s in 0.1 s steps, 25 frequencies); the paper's time range is not stated.
- claim: fig3-sensorimotor-largest
  outcome: reproduced
  assumed: true
  notebook: reproduce_peterson_2021.ipynb
  output: claim:fig3-sensorimotor-largest
  notes: Under readings (a), (b) and (c) and all five seeds, the three largest regions are postcentral,
    precentral and inferior parietal, and each temporal region is below all three. Reading (a) gives
    0.462, 0.447 and 0.296 dB for the three, 0.193 for middle frontal, and at most 0.032 for the
    temporal regions.
  deviations:
  - The same spectral method and assumptions as fig3-group-lfb-decrease-hfb-increase.
- claim: fig3-lfb-more-widespread
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_peterson_2021.ipynb
  output: claim:fig3-lfb-more-widespread
  notes: The two readings the criterion names disagree, so the claim is blocked as the criterion
    says. Reading (b), significant bins per frequency bin over 0 to 0.5 s summed over the eight
    regions, gives 34.2 for low-frequency decreases against 23.9 for high-frequency increases, and
    holds under all five seeds. Reading (a), regions with any significant bin, gives 7 against 7 under
    the claim's seed, and 6 or 8 against 8 under the others, so the low count is never larger.
    Supramarginal (30 bins) and superior temporal (23 bins) have significant low-frequency decreases.
    The question of which measure the paper meant is recorded for its authors.
  deviations:
  - The same spectral method and assumptions as fig3-group-lfb-decrease-hfb-increase.
- claim: fig4-precentral-subject-variability
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_peterson_2021.ipynb
  output: claim:fig4-precentral-subject-variability
  notes: Three of four parts hold. Part 2, S03, S06, S07, S08 and S11 have positive power at 116 and
    121 Hz. Part 3, S09 and S12 peak among 56-121 Hz at 66 and 71 Hz, with means over 101-121 Hz below
    half the peak. Part 4, S04 and S08 are among the three subjects with the narrowest low-frequency
    decrease (2 bins, with S07). Part 1 fails in one subject; S09 has a mean of -0.03 dB over 76-100 Hz
    (its 8-32 Hz mean is -0.25). The other 11 subjects show the pattern.
  deviations:
  - The same spectral method and assumptions as fig3-group-lfb-decrease-hfb-increase.
- claim: fig5-band-power-differs-across-subjects
  outcome: reproduced
  assumed: true
  notebook: reproduce_peterson_2021.ipynb
  output: claim:fig5-band-power-differs-across-subjects
  notes: Kruskal-Wallis across the 12 subjects on 7650 events gives H = 750 (LFB) and 1048 (HFB) for
    band means, and 776 and 1012 for band medians, with p printed as 0 (below the smallest double).
  deviations:
  - The same spectral method and assumptions as fig3-group-lfb-decrease-hfb-increase.
- claim: table1-subject-band-power-ci
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_peterson_2021.ipynb
  output: claim:table1-subject-band-power-ci
  notes: Under the best of the four readings (the mean over events of the band mean), 21 of 24 subject
    and band values lie inside Table 1's intervals; the other readings give 18, 17 and 18. Outside
    are S03 HFB (1.235 against 1.39 to 1.67), S06 LFB (-1.036 against -1.63 to -1.11) and S06 HFB
    (1.596 against 2.02 to 2.37). The median band mean is below 0 for LFB and above 0 for HFB in all
    12 subjects. The attempt's own 5000-replicate bootstrap intervals are printed beside them.
  deviations:
  - The same spectral method and assumptions as fig3-group-lfb-decrease-hfb-increase.
- claim: fig5-recording-day-effects
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_peterson_2021.ipynb
  output: claim:fig5-recording-day-effects
  notes: With band means 20 of 24 subject and band pairs agree with the paper (19 with band medians).
    A day effect is found where the paper has none for S01 LFB (p = 0.044), S01 HFB (p = 0.029) and S06
    HFB (p = 8.5e-11), and is not found for S10 HFB (p = 0.10), where the paper reports p = 0.006. The
    other ten significant pairs of the paper are significant here (largest p 0.019). S01 lost 132
    events of day 7, where its ECoG ends early.
  deviations:
  - The same spectral method and assumptions as fig3-group-lfb-decrease-hfb-increase.
- claim: extfig5-1-baseline-reduces-day-variability
  outcome: reproduced
  assumed: true
  notebook: reproduce_peterson_2021.ipynb
  output: claim:extfig5-1-baseline-reduces-day-variability
  notes: Reading (a), baseline subtraction lowers the SD of the precentral day means in 10 of 12
    subjects for LFB and 11 of 12 for HFB. Reading (b), it lowers it at 91.3% of good electrodes for
    LFB and 90.4% for HFB. Variability remains; 13 subject and band pairs have a significant day effect
    (fig5-recording-day-effects), and the SDs after subtraction are 0.03 to 0.85 dB.
  deviations:
  - The same spectral method and assumptions as fig3-group-lfb-decrease-hfb-increase. Reading (b)
    uses the electrodes good in every file of the subject (assumed, see fig6b-best-models-sensorimotor).
- claim: discussion-day-changes-small
  outcome: reproduced
  assumed: true
  notebook: reproduce_peterson_2021.ipynb
  output: claim:discussion-day-changes-small
  notes: The largest deviation of a day mean from the subject's mean is 1.48 dB (S06 HFB), and every
    subject and band is at most 2.2 dB; the largest range of day means is 2.04 dB (S06 LFB). Without
    baseline subtraction the precentral band power is 12.2 to 36.5 dB in microvolts squared (the
    files' stored unit), inside 9 to 55 dB; in volts squared it would be -108 to -84 dB.
  deviations:
  - The same spectral method and assumptions as fig3-group-lfb-decrease-hfb-increase.
- claim: fig6b-best-models-sensorimotor
  outcome: reproduced
  assumed: true
  notebook: reproduce_peterson_2021.ipynb
  output: claim:fig6b-best-models-sensorimotor
  notes: 14 LFB and 14 HFB models have withheld R2 above 0.05, of 976 per band. Reading (a), all 14 LFB
    and 13 of 14 HFB electrodes are in the five frontoparietal regions (the other in superior
    temporal), and the median R2 of sensorimotor electrodes exceeds that of temporal ones (LFB -0.0102
    against -0.0158, HFB -0.0117 against -0.0154). Reading (b), the three regions with the highest
    projected R2 are precentral, postcentral and middle frontal in both bands.
  deviations:
  - Assumed, as the good-electrode flags differ between a subject's files; the models use the
    electrodes good in every file of the subject (976 electrodes), on the 7650 events of reading (b).
    The paper reports 4.9 +- 4.9 surface electrodes removed per subject; the files mark 1 to 17 bad in
    every file and 3 to 32 in at least one.
  - Forward selection over single design columns starting from an adjusted R2 of 0, on all of the
    subject's events, as the code does (_forward_selected_new); 200 day-balanced splits with 10% test
    events (Methods). The splits use the seed of this claim, and the other Figure 6 claims use the same
    fits.
  - The seed check refits the full-model R2 of the models with R2 above 0.03 under the four other
    seeds (12 to 14 models per band pass 0.05); Delta R2, coefficients and retention were not refit
    under them, for time.
  - The code's fits at bad electrodes were not run as a variant.
- claim: fig6-r2-at-most-025
  outcome: reproduced
  assumed: true
  notebook: reproduce_peterson_2021.ipynb
  output: claim:fig6-r2-at-most-025
  measured: 0.1773
  notes: The largest split-averaged withheld R2 is 0.1773 (S07, HFB), at most 0.275. It is 0.1837 with
    the code's 80/20 splits and 0.1578 with band medians, and 0.165 to 0.184 under the four other
    seeds. No Huber fit failed to converge.
  deviations:
  - As for fig6b-best-models-sensorimotor.
- claim: fig6c-angle-and-day-most-informative
  outcome: reproduced
  assumed: true
  notebook: reproduce_peterson_2021.ipynb
  output: claim:fig6c-angle-and-day-most-informative
  notes: Over the 14 LFB models with R2 above 0.05, recording day (median Delta R2 0.0383) and reach
    angle (0.0325) rank first and second; the eight other features have medians of 0. In HFB the same
    two lead (0.0603 and 0.0232). The code's Delta R2 (80/20, test events shuffled) and the code's
    selection by LFB R2 give the same two in both bands (with selection by LFB R2 the HFB order is
    angle, then day).
  deviations:
  - As for fig6b-best-models-sensorimotor. The code's Delta R2 variant is run with the code's 80/20
    splits, combining two of the criterion's variants.
- claim: extfig6-2-angle-most-retained
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_peterson_2021.ipynb
  output: claim:extfig6-2-angle-most-retained
  notes: Reach angle has the highest retention probability in precentral, postcentral and inferior
    parietal regions for both bands (0.517 averaged over these). The order of the next four does not
    hold under either reading; over the three sensorimotor regions it is speech ratio (0.360),
