  output: claim:fig6j-reaching-accuracy
  notes: The outcome depends on which mice are the paper's, which the dandiset does not say (question
    asked). With every mouse scored on test1 and test4 (15 controls, 4 TeTx, 7 Arch) and 0.2 cm, the criterion
    holds; interaction F(2, 23) = 7.55, p = 0.0030; controls 0.388 to 0.610 (Sidak p = 0.0015); day 4
    controls above TeTx (p = 0.0002) and Arch (p = 0.016); day 1 TeTx not different (p = 0.9995); also
