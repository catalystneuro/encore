- claim: fig3d-anxa1-ramp-to-touch
  outcome: not_reproduced
  notebook: reproduce_mantas_2024.ipynb
  output: claim:fig3d-anxa1-ramp-to-touch
  notes: The two parts never hold under the same reading. DAT GCaMP-dCP (8 recordings, 5 mice) has ANOVA p
    = 0.050 to 0.145 and window 1 against 2 Sidak p = 0.35 to 0.9985. Anxa1 GCaMP-dCP (15 recordings, 6 mice)
    holds only with every contact as the touch, 1 s windows and the session z-score (ANOVA p = 0.048, window
    2 above 3 at Sidak p = 0.045); with drop retrievals alone its ANOVA p = 0.0139 to 0.109 and window 2 against
    3 Sidak p = 0.107 to 0.211. The mean Anxa1 trace peaks at +0.03 s from the drop retrieval (z 0.25), the
    DAT trace at +2.88 s. The answers (2026-10-21) named the two event readings already run, (i) drop retrievals
    and (ii) every contact with a drop, empty-spout events excluded, and every recording with at least one
    event, so the numbers and the outcome are unchanged. The n used is 15 Anxa1 recordings of 6 mice and 8
    DAT of 5 under every reading, against the legend's 10 of 7 and 4 of 3. Per mouse, reported and not judged,
    the DAT ANOVA has p = 0.10 to 0.25, the Anxa1 ANOVA p = 0.027 to 0.15 and its window 2 against 3 Sidak
    p = 0.032 to 0.16. Mouse 687662 is anxa1-flp in its open field file and Dat_cre here; without it the DAT
    part still fails in every reading (ANOVA p = 0.055 to 0.143, window 1 against 2 Sidak p = 0.46 to 0.99).
  deviations:
  - The legend counts 10 Anxa1 and 4 DAT recordings; the dandiset holds 15 and 8, all used, as the criterion
    now says.
  - The dandiset holds dF/F; both z-score readings of the claims file are run, the baseline one against the
    first window.
  - Sidak's test after the Geisser-Greenhouse corrected ANOVA is a paired t-test per pair, Sidak-adjusted over
    three pairs.
