- claim: fig6j-reaching-accuracy
  outcome: partially_reproduced
  notebook: reproduce_mantas_2024.ipynb
  output: claim:fig6j-reaching-accuracy
  notes: The answers (2026-10-21) fixed the readings. Day 1 and day 4 are the first and fourth training
    sessions (the files' test1 and test4, test4 falling 2 to 4 days after test1), the controls of both
    cohorts are one group, and the main run is the 17 mice recorded before the preprint (8 controls, 4
    TeTx, 5 Arch; 8 + 4 + 5 fits the legend's F(2,14)), all mice being a variant. Before the answers
    the claim was blocked because the outcome turned on which mice were used. In the main run the
    control and TeTx parts hold and the Arch part fails. With every labelled reach, the preferred limb
    per mouse and 0.2 cm, interaction F(2, 13) = 4.42, p = 0.034; controls improve from 0.338 to 0.650
    (Sidak p = 0.010); on day 4 controls exceed TeTx (0.239, p = 0.0014) but not Arch (0.428, p = 0.22);
    on day 1 TeTx do not differ (p = 0.994). One Arch mouse (842433) has no reach with its preferred
    limb on one day there. Without empty and unknown reaches, interaction p = 0.046, control improvement
    p = 0.020, TeTx below controls p = 0.016, Arch p = 0.34. With the preferred limb per session all 17
    mice enter with the legend's df (2, 14), but the interaction misses (p = 0.060 and 0.085). Arch
    on day 4 fails in all eight readings of the main run (Sidak p = 0.044 to 0.34; the one below 0.05,
    at 0.1 cm, has an interaction p of 0.12), and at 0.1 cm the interaction misses in every reading
    (p = 0.069 to 0.27). Single exclusions make the criterion hold in 0 of 16 with the limb per mouse
    and 1 of 17 with the limb per session (Arch mouse 828027 left out, interaction p = 0.016, Arch day 4
    p = 0.035). The variant with all mice holds at 0.2 cm under all four event and limb readings
    (interaction p = 0.0030 to 0.028).
  deviations:
  - The Arch cohort's day 1 sessions are all labelled with the laser switched on after the first reach,
    where the Methods have it off on day 1; they are used as day 1.
  - Sessions of one mouse on one day (two mice) are pooled.
  - Sidak's tests after the RM two-way ANOVA are t-tests with Sidak adjustment (paired over the three
    groups for day 1 against day 4, unpaired over four comparisons between groups).
inputs:
- what: The MitoPark RNA-seq count table of GEO GSE282753 (GSE282753_counts_mitopark.txt.gz, 92 libraries
    of 5 MitoPark and 7 control mice; series last updated 2026-10-20; md5 3198ec978a3b44c5a2069a832569188c,
    printed in the notebook), read at run time for fig1b only.
  source: GEO GSE282753, https://ftp.ncbi.nlm.nih.gov/geo/series/GSE282nnn/GSE282753/suppl/
findings:
- kind: data_missing
  statement: The dandiset holds only behaviour and fiber photometry. The histology, RNA-scope and tracing
    images or counts, the qPCR of iPSC-derived neurons and the nosepoke counts of the self-stimulation
    and ratio tasks are not in it, so 16 claims of Figures 1 to 3 cannot be tested. GEO GSE282753 holds
    the MitoPark RNA-seq counts but not the cMfn2KO ones.
- kind: data_missing
  statement: The arrow maze files hold DeepLabCut pose only. The Bonsai end-zone entries, reward deliveries
    and arena geometry behind Figure 6D are not in them.
- kind: metadata_error
  statement: 86 open field sessions have session_id tmaze-..., 84 of them in files named ses-tmaze-...,
    although their descriptions, contents (VAME labels, kinematics, the open field DeepLabCut model) and
    frame counts are those of open field sessions.
- kind: metadata_insufficient
  statement: Experimental groups, cohorts, days, test phases and light conditions are given only in free
    text inside session_description, with names that differ between experiments (ctrl, asc_acid, Ctrl
    10-11 wks, Littermate control); the subject metadata carry no group.
- kind: metadata_error
  statement: Subject genotypes conflict across files. Mice with dLight (776769, 776770, 796284, 796287,
    802369, 802372, 821709, 821710, 829248, 842388, 842395) are WT in their open field files and Anxa1-flp
    or Dat_cre in their other files, and 687662 is anxa1-flp in the open field and Dat_cre in reaching.
    Mouse 779575 is a control in the open field TeTx experiment and a TeTx mouse in the reaching cohort.
- kind: metadata_insufficient
  statement: The VAME labelling has 42 labels (0 to 41) and no names or action categories, while the paper
    reports 37 motifs numbered up to 42 and grouped into categories. The labels cannot be mapped to the
    paper's motif numbers, which four claims need.
- kind: metadata_insufficient
  statement: The 30 Hz z-scored open field photometry (FiberPhotometrySeriesZScored) is smoothed (its
    first and last 7 or 8 samples are held constant) and best matches the dF/F 0.1 s earlier; neither
    the smoothing nor the lag is documented.
- kind: selection_undocumented
  statement: The dandiset holds more photometry recordings and mice than the legends count (water drop,
    Anxa1 15 against 10, DAT 8 against 4, dLight-dCP 21 against 13, dLight-cCP 15 against 11; open field
    Anxa1 10 against 9) and fewer in some (open field DAT 6 against 7, arrow maze controls 17 against
    18), without saying which recordings the paper used.
- kind: other
  statement: The dandiset holds experiments that are not in the preprint version read (6-OHDA in the tail
    striatum in open field, reaching and arrow maze; anti-Anxa1 open field; a 2025 Arch reaching cohort),
    labelled only in free text.
- kind: metadata_error
  statement: All 17 Arch-cohort reaching files of the first training day, the 2024 mice included, say
    the laser was switched on after the mouse's first reach, while the Methods say it was off during
    the first day of reaching and on during the last three; either the label or the protocol differs
    from the paper.
- kind: metadata_error
  statement: The 20 evoked release sessions are described as nosepoke self-stimulation, but their 1 s
    trains come at fixed 4 s intervals in every session; the reaching photometry sessions' descriptions
    call the GCaMP signals SN cell-body recordings, while the fiber table and the indicator descriptions
    place the fiber in dCP.
- kind: metadata_error
  statement: The archive's variableMeasured lists only ProcessingModule and BehavioralTimeSeries, though
    110 files hold fiber photometry; the photometry sessions of the water drop task are stored as reaching
    sessions.
- kind: other
  statement: Seven open field photometry recordings hold under 13 minutes of photometry (2.9 to 11.9 min)
    where the Methods describe 20 minute sessions.
