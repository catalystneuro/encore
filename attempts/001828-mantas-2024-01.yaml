  outcome: partially_reproduced
  notebook: reproduce_mantas_2024.ipynb
  output: claim:fig6j-reaching-accuracy
  notes: The answers (2026-10-21) fixed the readings. Day 1 and day 4 are the first and fourth training sessions
    (the files' test1 and test4, test4 falling 2 to 4 days after test1), the controls of both cohorts are one
    group, and the main run is the 17 mice recorded before the preprint (8 controls, 4 TeTx, 5 Arch; 8 + 4
    + 5 fits the legend's F(2,14)), all mice being a variant. Before the answers the claim was blocked because
    the outcome turned on which mice were used. In the main run the control and TeTx parts hold and the Arch
    part fails. With every labelled reach, the preferred limb per mouse and 0.2 cm, interaction F(2, 13) =
    4.42, p = 0.034; controls improve from 0.338 to 0.650 (Sidak p = 0.010); on day 4 controls exceed TeTx
    (0.239, p = 0.0014) but not Arch (0.428, p = 0.22); on day 1 TeTx do not differ (p = 0.994). One Arch mouse
    (842433) has no reach with its preferred limb on one day there. Without empty and unknown reaches, interaction
    p = 0.046, control improvement p = 0.020, TeTx below controls p = 0.016, Arch p = 0.34. With the preferred
    limb per session all 17 mice enter with the legend's df (2, 14), but the interaction misses (p = 0.060
    and 0.085). Arch on day 4 fails in all eight readings of the main run (Sidak p = 0.044 to 0.34; the one
    below 0.05, at 0.1 cm, has an interaction p of 0.12), and at 0.1 cm the interaction misses in every reading
    (p = 0.069 to 0.27). Single exclusions make the criterion hold in 0 of 16 with the limb per mouse and 1
    of 17 with the limb per session (Arch mouse 828027 left out, interaction p = 0.016, Arch day 4 p = 0.035).
    The variant with all mice holds at 0.2 cm under all four event and limb readings (interaction p = 0.0030
    to 0.028). The Arch effect is present but weaker. On day 4 Arch accuracy is below the controls' in all
    eight readings of the main run (0.099 to 0.428 against 0.264 to 0.650), but never at Sidak p < 0.05 together
    with an interaction at p < 0.05, so the outcome is partial; the verifier judged it not reproduced, and
    the disagreement is recorded. The Arch day 1 sessions are labelled with the laser on after the first reach,
    a departure from the paper's protocol, and are used as day 1.
  deviations:
