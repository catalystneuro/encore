- claim: fig3d-anxa1-ramp-to-touch
  outcome: not_reproduced
  notebook: reproduce_mantas_2024.ipynb
  output: claim:fig3d-anxa1-ramp-to-touch
  notes: Neither part holds under any combination of events, windows and z-scoring. DAT GCaMP-dCP (8 recordings,
    5 mice) has ANOVA p = 0.050 to 0.145 and window 1 against 2 Sidak p = 0.35 to 0.9985. Anxa1 GCaMP-dCP
    (15 recordings, 6 mice) holds only with every contact as the touch, 1 s windows and the session z-score
    (ANOVA p = 0.048, window 2 above 3 at Sidak p = 0.045); with drop retrievals alone its ANOVA p = 0.0139
    to 0.109 and window 2 against 3 Sidak p = 0.107 to 0.211. The mean Anxa1 trace peaks at +0.03 s from
    the drop retrieval (z 0.25), the DAT trace at +2.88 s. Both event readings, which come from a question,
    give the same outcome.
  deviations:
  - The legend counts 10 Anxa1 and 4 DAT recordings; the dandiset holds 15 and 8, all used.
  - The water drop touch is read from the annotated event labels in two ways (drop retrievals, or every
    contact with a drop); question asked.
  - The dandiset holds dF/F; both z-score readings of the claims file are run, the baseline one against
    the first window.
  - Sidak's test after the Geisser-Greenhouse corrected ANOVA is a paired t-test per pair, Sidak-adjusted
    over three pairs.
