- claim: fig3fg-auc-change-from-baseline
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_mantas_2024.ipynb
  output: claim:fig3fg-auc-change-from-baseline
  notes: The claims file's two z-scorings give different outcomes. With the baseline z-score the dLight-cCP
    second-window change is positive and significant after Bonferroni over four tests in all four event
    and window combinations (p = 0.020 to 0.049) and over eight with 2 s windows (p = 0.040 and 0.047),
    and the DAT second (0.13 to 0.28) and cCP third (1.43 to 1.77) changes are positive, so the claim
    holds. With the session z-score the cCP second-window change (0.29 to 0.36) is not significant under
    either correction (four tests p = 0.055 to 0.31). Under the baseline z-score the first window is the
    baseline by construction.
  deviations:
  - The z-scoring of the photometry is not given; the claims file's readings disagree.
