- claim: fig4b-speed-correlation-dcp
  outcome: not_reproduced
  notebook: reproduce_mantas_2024.ipynb
  output: claim:fig4b-speed-correlation-dcp
  notes: dLight-dCP correlates with speed above both shuffles (mean r = 0.067, 7 of 8 recordings positive,
    paired t-test p = 0.010 against permutation and 0.008 against circular shifts, Wilcoxon 0.023 and 0.016).
    Anxa1 GCaMP-dCP is positive in 9 of 10 recordings but not significantly (mean r = 0.066, p = 0.080 and
    0.071, Wilcoxon 0.064); one recording (842430) is at r = -0.17. Without the seven recordings holding under
    13 min of photometry, Anxa1 p = 0.097 and 0.089, and dLight-dCP p = 0.059 against permutation and 0.0499
    against circular shifts. DAT GCaMP-dCP mean r = 0.032 (p = 0.22). Without mouse 687662, whose water drop
    file says Dat_cre, Anxa1 has mean r = 0.057, 7 of 8 positive, p = 0.21 and 0.18. Of the 19 open field
    files whose kinematics are not at lag 0 to the pose, five hold photometry (two Anxa1, two dLight-dCP,
    one dLight-cCP); with their speed moved by that lag, Anxa1 p = 0.082 and 0.073 and dLight-dCP p = 0.028
    and 0.023 (dLight-dCP 6 of 8 positive, Wilcoxon p = 0.0547 against permutation). The Anxa1 speed-signal
    correlation peaks within 0.5 s of zero lag in 5 of 10 recordings and at -2.3 to 2.1 s in the others; the
    photometry and the speed are consistent with one clock where the files allow a check, not shown to share
    it in every recording. The criterion needs both groups above the shuffle at p < 0.05 under one reading,
    and Anxa1, the subject of the claim, misses it in every reading (p = 0.064 to 0.21). As for fig3e, a failed
    main part is a failure of the claim and not a partial result. This was partially reproduced before the
    first verification; the verifier judged it not reproduced in rounds 1 and 2, the change was proposed after
    round 2, and the third round agreed with it.
  deviations:
  - The legend counts 9 Anxa1 recordings of 9 mice and 8 dLight-dCP of 6; the dandiset holds 10 of 8 and 8
    of 5, all used.
  - The dandiset's 30 Hz z-scored trace and linear_velocity are used; the trace is smoothed and lags the dF/F
    by about 0.1 s, which the dandiset does not document.
  - The shuffled value is the mean over 100 shuffles per recording.
