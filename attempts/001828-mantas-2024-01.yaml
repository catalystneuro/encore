- claim: figs2-evoked-da-dcp-ccp
  outcome: reproduced
  notebook: reproduce_mantas_2024.ipynb
  output: claim:figs2-evoked-da-dcp-ccp
  notes: 20 sessions, two Anxa1-Flp mice with the fiber in dCP and two in cCP, five powers each (0.1 to
    2 mW). Under both z-scorings the dCP peak exceeds the pre-train baseline in 10 of 10 recordings and
    the cCP peak is lower; session z-score, 0 to 1 s, 1.21 against 0.61 (t = 3.94, p = 0.0010, Cohen's
    d 1.76); baseline z-score 2.30 against 1.19 (p = 0.0042), 1.93 against 1.03 with a 2 s baseline (p
    = 0.0043). The 0 to 2 s window gives the same peaks. dCP is above cCP at every power in both mice
    (per-power 2 against 2 tests p = 0.0039 to 0.16); peaks rise with power (Spearman rho 0.81 dCP, 0.985
    cCP). The test is over sessions, five per mouse, as the claims file says per recording.
  deviations:
  - The dandiset holds dF/F, not the paper's z-scores; both z-score readings of the claims file are run.
  - The pre-train baseline window (1 s, 2 s as a variant) is not given in the text read; question asked.
  - All powers are pooled per site, 10 sessions against 10; Figure S2's selection is not known.
