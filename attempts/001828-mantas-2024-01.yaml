- claim: figs2-evoked-da-dcp-ccp
  outcome: reproduced
  notebook: reproduce_mantas_2024.ipynb
  output: claim:figs2-evoked-da-dcp-ccp
  notes: 20 sessions, two Anxa1-Flp mice with the fiber in dCP and two in cCP, five powers each (0.1 to 2 mW).
    The answer (2026-10-21) named two readings, (a) all powers pooled per session and (b) each power alone,
    the session as unit in both, with baselines of 1 s and 2 s before train onset. Reading (a) was the one
    run before; (b) as a judged reading and the 2 s baseline for the session z-score are new. Under (a) the
    criterion holds with both z-scorings, both baselines and both windows; the dCP peak exceeds the baseline
    in 10 of 10 sessions and the cCP peak is lower, session z-score 1.21 against 0.61 (t = 3.94, p = 0.0010,
    Cohen's d 1.76), baseline z-score 2.30 against 1.19 (p = 0.0041) with 1 s and 1.93 against 1.03 (p = 0.0043)
    with 2 s. The 0 to 2 s window gives the same peaks. Under (b), 2 sessions against 2, it holds at 3 or 4
    of 5 powers (p = 0.0039 to 0.037); it fails at 2 mW under every combination (p = 0.16 to 0.31) and at 0.1
    mW except with the baseline z-score over 1 s (p = 0.056 and 0.11). dCP is above cCP in both mice at every
    power, and peaks rise with power (Spearman rho 0.81 dCP, 0.985 cCP). Per mouse, reported and not judged,
    the mean peak over powers is 1.23 and 1.20 in dCP and 0.56 and 0.66 in cCP. The first reading the criterion
    lists holds in full, so the outcome stays reproduced.
  deviations:
  - The dandiset holds dF/F, not the paper's z-scores; both z-score readings of the claims file are run.
  - The z-score against the baseline uses the same 1 s or 2 s window before each train as the baseline.
