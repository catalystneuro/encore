- claim: fig1b-anxa1-downregulated-rnaseq
  outcome: blocked
  blocked_by: other
  notebook: reproduce_mantas_2024.ipynb
  output: claim:fig1b-anxa1-downregulated-rnaseq
  notes: GEO GSE282753, public since 2026-10-20 and the paper's only RNA-seq deposit, holds one count table,
    MitoPark and control DANs at 10 weeks (5 MitoPark mice, as in the legend, and 7 controls, each with 3 to
    12 technical libraries), and no cMfn2KO-early counts, so that half of the claim cannot be tested and the
    claim stays blocked. The answer (2026-10-21) found no other place for the cMfn2KO counts, and made the
    mouse the unit, with libraries summed per mouse, and the MitoPark half to be run and reported. Before the
    answer the MitoPark counts were not analysed (the earlier note counted 6 MitoPark mice; the table has 5).
    The MitoPark half holds under both readings, as the criterion judges them, where DESeq2 and edgeR agree.
    Summed per mouse, Anxa1 log2 fold change -1.02 at FDR 2.9e-05 (DESeq2) and -0.99 at FDR 7.5e-04 (edgeR
    exact test); with each library as a sample, -0.93 at FDR 5.0e-08 and 6.2e-08. Anxa1 counts per million
    are 90 to 222 in MitoPark mice and 258 to 446 in controls. GEO's supplementary files are this count table
    and an RPKM table of the same MitoPark libraries, and the series' design and its 92 samples describe MitoPark
    and control mice only (printed in the notebook).
  deviations:
  - DESeq2 is pydeseq2 0.5.4 and edgeR is edgepy (inmoose 0.9.1), a Python port, with TMM written out in the
    helper and the GLM common and tagwise dispersions (estimateGLMCommonDisp, estimateGLMTagwiseDisp) in place
    of estimateDisp, which the port lacks, so the edgeR reading is not edgeR's default route; R is not in the
    entry's environment.
  - All 7 control and 5 MitoPark mice are used; which the paper used is not given.
