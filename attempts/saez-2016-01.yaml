- claim: dataset-size
  outcome: reproduced
  notebook: reproduce_saez_2016.ipynb
  output: claim:dataset-size
  measured:
  - 14
  - 14
  - 26
  notes: The Summary sheets of the data set mark exactly 14 VC, 14 IC and 26 bicuculline recordings as included
    and 11, 9 and 12 as excluded, the paper's numbers, and give a row and per-sweep amplitudes for each included
    cell. Every bicuculline test file is in voltage clamp (pA), as the Methods and Figure 2 say. The deposit holds
    complete recordings (baseline, pairing and post-pairing) for all 26 bicuculline cells but for only 10 of the
    14 VC and 10 of the 14 IC control cells (a data_missing finding); this limits the control claims, not the count
    of cells the paper analysed. Changed from partially reproduced after round 1 of verification.
  deviations:
  - 'The counts of included cells come from the fill of the Summary sheets: every excluded row is red, as the data
    descriptor documents, and the included rows are unfilled (IC, VCB) or green (VC). Completeness is judged from
    the files.'
- claim: fig1c-control-outcomes
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_saez_2016.ipynb
  output: claim:fig1c-control-outcomes
  measured:
  - 3
  - 3
  - 22
  notes: 'No reading of (P) and (T) gives 1 LTP, 3 LTD and 24 NC. On the 20 complete control cells the readings
    give 1 to 3 LTP and 3 to 4 LTD, 5 to 7 plastic cells (25 to 35%, against 14% in the paper); the plastic VC cells
    are 3 LTD and 1 or 2 LTP of 10. Counting the seven missing cells whose sheet change is below 15% as NC, the
    counts out of 28 meet the partial criterion (plastic 2 to 6, NC within 2.4 of 24) under (a,a), (a,b), (c,a)
    and (c,b) if IC23 (sheet change -24.6%) is NC, giving 3 LTP, 3 LTD, 22 NC under (a,a), and under (c,b) if IC23
    is LTD. The partial outcome exists only through this bound, and the bound is loose: of the 16 measured cells
    whose sheet change is below 15%, five (IC8, IC14, IC16, IC19, VC15) are plastic in some reading, two under (a,a).
    The sheets store no p values. With the first 120 baseline sweeps 8 to 11 of the 20 cells are plastic, mostly
    LTD. The 30 ms window, the alignment variants and a one-sided t-test give 5 to 7 plastic cells. IC13, LTP in
    some readings in the first version, now changes by -10.9% (sheet -12.8%) and is NC in every reading.'
  deviations:
  - Eight of the 28 control cells have no complete recording in the data set; they are not measured. To judge counts
    out of 28, seven whose sheet change is below 15% in size are counted as NC (the paper's rule cannot make them
    plastic on the sheet's change) and IC23 is shown both ways.
  - The pre-pairing epoch is the last 120 baseline sweeps where a cell has more (assumed; see fig1-control-no-net-plasticity).
    Methods, Plasticity induction, "After the pre-pairing epoch was complete (120 stimuli at 0.2 Hz)".
  - Cells with two pairings (IC2, IC4, IC5, IC6, IC14) use the first pairing and the recording after it; the paper
    describes one pairing per cell (Methods, Plasticity induction).
  - 'Each sweep is aligned on the onset of the stimulus artifact (the first step at least a quarter of the largest
    step, within the 0.5 ms before it) and sweeps without a stimulus artifact are dropped (5 of 17319: four post-pairing
    sweeps of IC13 and one VCB19 sweep pinned at -2000 pA); both are corrections made after round 1 of verification.
    Aligning on the largest step, as the first version did, is shown as a variant.'
  - The end of the stimulus artifact, which the claims file's measure (M) starts from, is found per file as the
    trough between artifact and response 0.5 to 3 ms after the stimulus (a standard choice); the stimulus is found
    per sweep because it moves to 87 to 99 ms in some sweeps of 12 files.
  - Every sweep with a stimulus is used; the paper's analysis used sweeps selected in its spreadsheets (green),
    by a rule the paper does not give.
- claim: fig1-control-no-net-plasticity
  outcome: reproduced
  assumed: true
  notebook: reproduce_saez_2016.ipynb
  output: claim:fig1-control-no-net-plasticity
  notes: On the 20 complete control cells the mean change is -2.6% to -3.4% and the one-sample t-test against 0
    gives p = 0.27 to 0.44 in readings (P)(a), (b) and (c). With the first 120 baseline sweeps the mean is -12.3%
    to -13.3% and every reading reaches p < 0.05 (0.013 to 0.036), so the outcome rests on the choice of the last
    120. Open question for the authors (see findings) on which baseline sweeps form the pre-pairing epoch.
  deviations:
  - 'Assumption: the pre-pairing epoch is the 120 sweeps before pairing where a cell has more (36 of 46 cells have
    more than 130). The Methods say pairing began "after the pre-pairing epoch was complete (120 stimuli at 0.2
    Hz)", and the data set''s sheets give pre-pairing means that match the last 120 sweeps (median difference 4.5%
    over 36 cells) and not the first 120 (24.3%). The first 120 are shown as a variant.'
  - 20 of the paper's 28 control cells.
  - 'Each sweep is aligned on the onset of the stimulus artifact (the first step at least a quarter of the largest
    step, within the 0.5 ms before it) and sweeps without a stimulus artifact are dropped (5 of 17319: four post-pairing
    sweeps of IC13 and one VCB19 sweep pinned at -2000 pA); both are corrections made after round 1 of verification.
    Aligning on the largest step, as the first version did, is shown as a variant.'
