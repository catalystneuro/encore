findings:
- kind: data_missing
  statement: Eight of the 28 control recordings that the Summary sheets mark as included are missing or incomplete.
    IC22, IC23, VC21 and VC25 have no folder (the archive has IC1 to IC21 and VC1 to VC17, while the sheets list
    IC1 to IC23 and VC1 to VC25). VC10 and VC17 end with the pairing file and hold no post-pairing recording. IC11's
    folder holds no post-pairing recording. IC7's listed post-pairing file 07305017 has no protocol name, no recording
    date and no evoked response at the usual time.
- kind: metadata_error
  statement: The IC6 folder is empty; the IC6 recording (files 07305007 to 07305011, as the IC6 sheet lists them)
    is in the IC7 folder, together with IC7's own files.
- kind: metadata_error
  statement: The IC11 sheet lists 07315003 (a single sweep) as the pairing and 07315004 as the post-pairing recording,
    but 07315004 is the 60-trial pairing file (protocol Extracellular pairing, 0.1 Hz).
- kind: metadata_error
  statement: The data descriptor says each recording is "triggered once every 10 seconds"; the test sweeps are every
    5 s (0.2 Hz, as the paper's Methods say), and only the pairing trials are every 10 s.
- kind: metadata_error
  statement: Four derived files (VCB12_POST, VCB13_PRE, VCB13_Post, VCB15_PRE) state 10 kHz and 1 s sweeps in their
    headers; they hold the same 10000 samples per sweep as the 20 kHz, 0.5 s originals they copy.
- kind: other
  about: data
  statement: The recording folders also hold derived copies of the recordings (Concatenate*, *_PRE, *_POST), whose
    sweeps are found one for one in the original files, and Clampfit .sta, .tmp and .bak files; the data descriptor
    mentions none of them. A user counting files would count recordings twice.
- kind: other
  about: data
  statement: In seven files (of cells VCB7, VCB27, VCB30, VCB33 and VCB34) 26 to 89% of the sweeps have the stimulus
    at 87 to 99 ms, not at 107.9 ms as in nearly all other sweeps; the descriptor gives only "typically around 100
    ms". A fixed analysis window misses these responses.
- kind: metadata_insufficient
  statement: The sheets mark the sweeps used per cell (green) and give PRE and POST ranges such as 1-120 and 182-421,
    but nothing says which rule chose the sweeps or which files the ranges refer to; the VC and VCB sheets name
    no files. The VC and VCB sheets have a "p (one-tail)" label with no value, and the IC sheets none, so no per-cell
    p is stored. The amplitudes in the VCB17 sheet include the holding current, which the descriptor does not say.
- kind: other
  about: data
  statement: The Summary sheets' per-cell changes reproduce the paper's bicuculline mean and SD (-3.76 +/- 34.25%,
    n = 26) but not its control values; the IC sheet gives -5.79 +/- 9.51% and the VC sheet -3.14 +/- 13.40% (n
    = 14 each), against the paper's I-clamp -1.41 +/- 10.92% and V-clamp -5.67 +/- 9.47%.
- kind: methods_unavailable
  statement: Question for the authors. Most cells have more than 120 baseline sweeps (up to 400). Which 120 form
    the pre-pairing epoch? This attempt used the 120 just before pairing, which the Methods' wording and the sheets'
    pre-pairing means support; the first 120 change several outcomes (for control, 8 to 11 of 20 cells plastic and
    a mean change near -13% that differs from 0 at p < 0.05).
- kind: methods_unavailable
  statement: Question for the authors. The paper does not give the post-pairing window used for the change and the
    t-test (all post-pairing sweeps, the first 10 min, or the last 10 min), the form of the t-test (on sweeps or
    on 1-min bins; the sheets say one-tailed), the peak search window and baseline, or the rule by which sweeps
    were selected (the sheets mark selected sweeps in green). Each was run under every reading the claims file names;
    the classification counts change by up to 3 cells between readings. Where the readings of the window disagree
    on a claim of absence (fig1-vc-ic-same), this attempt adopted the last 10 min, as the sheets compare 120 traces
    and their changes are closest to that window.
- kind: other
  about: data
  statement: The VCB17 sheet computes the cell's change, +62.9%, from amplitudes that include the holding current
    (pre-pairing -579 pA, post-pairing -943 pA, on a holding current near -485 pA). Less the holding current they
    give -94 and -459 pA, a change of +390%, which the recording confirms (median traces 93 and 473 pA). The Summary
    sheet's +62.9% enters the bicuculline mean and SD that the sheets share with the paper (-3.76 +/- 34.25%).
verifications:
- date: '2026-11-13'
  kind: agent
  by: Independent agent run by CatalystNeuro (same harness, separate context, did not write the notebook)
  reviewed: 'Round 1: the first executed notebook with the conclusion cells and the summary removed, the helper
    module pvc9.py and the claims file, with the paper''s full text. The verifier listed the CRCNS bucket for pvc-9
    itself and tested peak_amplitudes and stimulus_indices on synthetic inputs. It had no attempt record.'
  results:
  - claim: dataset-size
    agrees: false
    outcome: reproduced
    reason: The Summary sheets mark exactly 14 IC, 14 VC and 26 VCB cells as included, and 9, 11 and 12 as excluded,
      which matches the paper and the Methods. The VCB test files are in pA, so the bicuculline cells are voltage
      clamp. The archive holds complete recordings for only 10 IC and 10 VC of the 28 control cells; that limits
      the claims below, not this count. Inclusion is read from red fill only, green fill is never checked; the counts
      match the paper exactly, so this is low risk (point 5).
    response: 'Outcome changed to reproduced, measured 14, 14 and 26: the sheets give a row and per-sweep amplitudes
      for every one of the 28 control cells, and the missing recordings are a data_missing finding that the control
      claims carry. The claim now prints the fill of every Summary row: excluded rows are all red, included rows
      unfilled (IC, VCB) or green (VC).'
  - claim: fig1c-control-outcomes
    agrees: true
    outcome: partially_reproduced
    reason: 'Only 20 control cells could be measured: 2 to 4 LTP, 3 to 4 LTD and 12 to 14 NC depending on reading.
      The counts out of 28 meet the partial clause (6 plastic, 22 NC) only under (a,a), (c,a) and (c,b), and only
      if the 8 missing cells are filled in from the authors'' sheet values. Measured on its own, the plastic fraction
      is 6 to 8 of 20, about twice the paper''s 4 of 28. The partial outcome exists only because of this fill-in
      (point 2); IC13 is +20.8% measured against -12.8% in the sheet, with only 77 post-pairing sweeps, and no trace
      inspection was done (point 6).'
    response: 'Outcome unchanged. IC13 is explained: its last four post-pairing sweeps hold no stimulus (one) or
      a spike (three) and were measured as 43 to 51 mV responses; the helper now drops sweeps without a stimulus
      artifact, and IC13 changes by -10.9% (its sheet''s 73 post-pairing values match the first 73 measured sweeps,
      r = 0.995). The notebook adds a per-cell table of all 28 control cells: the sheets store no p values (the
      VC sheets'' p cells are empty), and five measured cells whose sheet change is below 15% are plastic in some
      reading, so the fill-in is loose; the notes say the partial outcome rests on it. Counts are now 5 to 7 plastic
      of 20; partial under (a,a), (a,b), (c,a) and (c,b).'
  - claim: fig1-control-no-net-plasticity
    agrees: true
    outcome: reproduced
    reason: 'One-sample t-test on n = 20: p = 0.65, 0.75 and 0.54 under (P) a, b and c, so no reading finds an effect.
      This rests on using the last 120 baseline sweeps; with the first 120, p = 0.0496 and 0.035 in (a) and (c).
      The Methods wording and the sheets (3.8% against 23.8% median difference) support the last 120, so the assumption
      is reasonable, but readers should know the control outcomes depend on it (point 3).'
    response: Outcome unchanged; after the alignment fix p = 0.27 to 0.44, and with the first 120 every reading
      reaches p < 0.05. The notes, the summary and the README say the control outcomes depend on the choice of the
      last 120, which stays an assumption with a question to the authors.
  - claim: fig1-control-mean-change
    agrees: true
    outcome: partially_reproduced
    reason: Under (c), VC -4.36, IC +0.46 and combined -1.95 are all within tolerance, but the SD of 14.13 is outside
      10.26 +/- 1.03. Computed on 20 of 28 cells. The sheets' own IC values (-5.79 +/- 9.51, n = 14) match the paper's
      "V-clamp" figure (-5.67 +/- 9.47) more closely than its "I-clamp" one; the claims file does not raise this,
      and under (c) the outcome is unchanged either way (point 7).
    response: 'Outcome unchanged; after the alignment fix the three means are within tolerance under (a) and (c)
      and the SD (13.2) is not. The possible label exchange is asked of a reader in questions/saez-2016.yaml, and
      the notebook shows it as a variant: with the labels exchanged the IC mean is outside tolerance in every reading,
      so it would change the outcome.'
  - claim: fig1-vc-ic-same
    agrees: true
    outcome: reproduced
    reason: No reading has any of the four tests below 0.05; the smallest p is Shapiro-Wilk on IC, 0.15. n = 10
      + 10.
    response: Outcome kept, now resting on an assumption. After the alignment fix and the dropped IC13 sweeps, reading
      (P)(a) gives Shapiro-Wilk p = 0.0497 on IC, so the readings differ; the adopted reading (P)(c), supported
      by the sheets' "Traces compared" of 120 and their closeness to (c), has no test below 0.05. Marked assumed.
  - claim: fig1fh-control-no-dependence-on-initial
    agrees: true
    outcome: reproduced
    reason: Pearson p ranges from 0.099 to 0.285 across modes and readings.
    response: Outcome unchanged; Pearson p is now 0.11 to 0.69.
  - claim: fig1d-example-nc
    agrees: true
    outcome: reproduced
    reason: IC6 gives -0.94% (p = 0.47) under (a) and -1.07% (p = 0.41) under (c), both within -1 +/- 0.1%. With
