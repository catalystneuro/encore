- claim: dataset-size
  outcome: partially_reproduced
  notebook: reproduce_saez_2016.ipynb
  output: claim:dataset-size
  measured:
  - 10
  - 10
  - 26
  notes: The Summary sheets of the data set mark exactly 14 IC, 14 VC and 26 bicuculline recordings as
    included and 9, 11 and 12 as excluded, the paper's numbers. Every bicuculline test file is in voltage
    clamp (pA), as the Methods and Figure 2 say. The deposit holds complete recordings (baseline, pairing
    and post-pairing) for all 26 bicuculline cells but for only 10 of the 14 VC and 10 of the 14 IC control
    cells; measured values are these deposited counts, in the claim's order (VC, IC, bicuculline).
  deviations:
  - The counts of included cells come from the red and green fill of the Summary sheets, as the data
    descriptor documents; completeness is judged from the files.
- claim: fig1c-control-outcomes
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_saez_2016.ipynb
  output: claim:fig1c-control-outcomes
  measured:
  - 3
  - 3
  - 22
  notes: No reading of (P) and (T) gives 1 LTP, 3 LTD and 24 NC. On the 20 complete control cells the readings
    give 2 to 4 LTP and 3 to 4 LTD, 6 to 8 plastic cells (30 to 40%, against 14% in the paper); the plastic VC
    cells are 3 LTD and 1 or 2 LTP of 10. Counting the seven missing cells whose sheet change is below 15% as NC,
    the counts out of 28 meet the partial criterion (plastic 2 to 6, NC within 2.4 of 24) under (a,a), (c,a)
    and (c,b) if IC23 (sheet change -24.6%) is NC, giving 3 LTP, 3 LTD, 22 NC under (a,a), and under no
    reading if IC23 is LTD. With the first 120 baseline sweeps 8 to 11 of the 20 cells are plastic, mostly
    LTD. The 30 ms window and a one-sided t-test give 5 to 8 plastic cells.
  deviations:
  - Eight of the 28 control cells have no complete recording in the data set; they are not measured. To judge
    counts out of 28, seven whose sheet change is below 15% in size are counted as NC (the paper's rule cannot
    make them plastic) and IC23 is shown both ways.
  - The pre-pairing epoch is the last 120 baseline sweeps where a cell has more (assumed; see
    fig1-control-no-net-plasticity). Methods, Plasticity induction, "After the pre-pairing epoch was complete
    (120 stimuli at 0.2 Hz)".
  - Cells with two pairings (IC2, IC4, IC5, IC6, IC14) use the first pairing and the recording after it; the
    paper describes one pairing per cell (Methods, Plasticity induction).
  - The end of the stimulus artifact, which the claims file's measure (M) starts from, is found per file as
    the trough between artifact and response 0.5 to 3 ms after the stimulus (a standard choice); the stimulus
    is found per sweep because it moves to 87 to 99 ms in some sweeps of 12 files.
  - Every sweep is used; the paper's analysis used sweeps selected in its spreadsheets (green), by a rule the
    paper does not give.
- claim: fig1-control-no-net-plasticity
  outcome: reproduced
  assumed: true
  notebook: reproduce_saez_2016.ipynb
  output: claim:fig1-control-no-net-plasticity
  notes: On the 20 complete control cells the mean change is -1.1% to -1.9% and the one-sample t-test against
    0 gives p = 0.54 to 0.75 in readings (P)(a), (b) and (c). With the first 120 baseline sweeps the mean is
    near -11% and readings (a) and (c) reach p = 0.050 and 0.035, so the outcome rests on the choice of the
    last 120. Open question for the authors (see findings) on which baseline sweeps form the pre-pairing epoch.
  deviations:
  - 'Assumption: the pre-pairing epoch is the 120 sweeps before pairing where a cell has more (36 of 46 cells
    have more than 130). The Methods say pairing began "after the pre-pairing epoch was complete (120 stimuli
    at 0.2 Hz)", and the data set''s sheets give pre-pairing means that match the last 120 sweeps (median
    difference 3.8% over 36 cells) and not the first 120 (23.8%). The first 120 are shown as a variant.'
  - 20 of the paper's 28 control cells.
