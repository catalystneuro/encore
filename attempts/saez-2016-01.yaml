findings:
- kind: data_missing
  statement: Eight of the 28 control recordings that the Summary sheets mark as included are missing or
    incomplete. IC22, IC23, VC21 and VC25 have no folder (the archive has IC1 to IC21 and VC1 to VC17, while
    the sheets list IC1 to IC23 and VC1 to VC25). VC10 and VC17 end with the pairing file and hold no
    post-pairing recording. IC11's folder holds no post-pairing recording. IC7's listed post-pairing file
    07305017 has no protocol name, no recording date and no evoked response at the usual time.
- kind: metadata_error
  statement: The IC6 folder is empty; the IC6 recording (files 07305007 to 07305011, as the IC6 sheet lists
    them) is in the IC7 folder, together with IC7's own files.
- kind: metadata_error
  statement: The IC11 sheet lists 07315003 (a single sweep) as the pairing and 07315004 as the post-pairing
    recording, but 07315004 is the 60-trial pairing file (protocol Extracellular pairing, 0.1 Hz).
- kind: metadata_error
  statement: The data descriptor says each recording is "triggered once every 10 seconds"; the test sweeps
    are every 5 s (0.2 Hz, as the paper's Methods say), and only the pairing trials are every 10 s.
- kind: metadata_error
  statement: Four derived files (VCB12_POST, VCB13_PRE, VCB13_Post, VCB15_PRE) state 10 kHz and 1 s sweeps in
    their headers; they hold the same 10000 samples per sweep as the 20 kHz, 0.5 s originals they copy.
- kind: other
  about: data
  statement: The recording folders also hold derived copies of the recordings (Concatenate*, *_PRE, *_POST),
    whose sweeps are found one for one in the original files, and Clampfit .sta, .tmp and .bak files; the data
    descriptor mentions none of them. A user counting files would count recordings twice.
- kind: other
  about: data
  statement: In seven files (of cells VCB7, VCB27, VCB30, VCB33 and VCB34) 26 to 89% of the sweeps have the
    stimulus at 87 to 99 ms, not at 107.9 ms as in nearly all other sweeps; the descriptor gives only
    "typically around 100 ms". A fixed analysis window misses these responses.
- kind: metadata_insufficient
  statement: The sheets mark the sweeps used per cell (green) and give PRE and POST ranges such as 1-120 and
    182-421, but nothing says which rule chose the sweeps or which files the ranges refer to; the VC and VCB
    sheets name no files. The amplitudes in some sheets (VCB17, near -579 pA on a holding current near -470
    pA) appear to include the holding current, which the descriptor does not say.
- kind: other
  about: data
  statement: The Summary sheets' per-cell changes reproduce the paper's bicuculline mean and SD (-3.76 +/-
    34.25%, n = 26) but not its control values; the IC sheet gives -5.79 +/- 9.51% and the VC sheet -3.14 +/-
    13.40% (n = 14 each), against the paper's I-clamp -1.41 +/- 10.92% and V-clamp -5.67 +/- 9.47%.
- kind: methods_unavailable
  statement: Question for the authors. Most cells have more than 120 baseline sweeps (up to 400). Which 120
    form the pre-pairing epoch? This attempt used the 120 just before pairing, which the Methods' wording and
    the sheets' pre-pairing means support; the first 120 change several outcomes (for control, 8 to 11 of 20
    cells plastic and a mean change near -11%).
- kind: methods_unavailable
  statement: Question for the authors. The paper does not give the post-pairing window used for the change
    and the t-test (all post-pairing sweeps, the first 10 min, or the last 10 min), the form of the t-test
    (on sweeps or on 1-min bins; the sheets say one-tailed), the peak search window and baseline, or the rule
    by which sweeps were selected (the sheets mark selected sweeps in green). Each was run under every
    reading the claims file names; the classification counts change by up to 3 cells between readings.
