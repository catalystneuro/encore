- claim: passive-no-movement
  outcome: not_reproduced
  notebook: reproduce_steinmetz_2019.ipynb
  output: claim:passive-no-movement
  measured: 84.63
  notes: Of 3,410 passive presentations with contrast 1.0 on either side, 84.63% (mean over 39
    sessions, s.e. 1.08) have no detected movement overlapping -0.05 to 0.4 s, and 84.96% for 0 to
