- claim: ed9i-engagement-beyond-arousal
  outcome: reproduced
  notebook: reproduce_steinmetz_2019.ipynb
  output: claim:ed9i-engagement-beyond-arousal
  notes: Adding the index lowers the deviance by 63.1 (1 d.f., p = 2.0e-15) in window a and 64.0 (p =
