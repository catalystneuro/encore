findings:
- kind: metadata_error
  statement: The `rate` attribute of the `starting_time` of `wheel_position`, `lickPiezo` and `face_motion_energy`
    holds the sampling interval in seconds (0.0004, 0.002 and 0.0253), not a rate in Hz. Sample counts
    times these values give the recording lengths (2,609 to 4,103 s), so a reader that takes the attribute
    as a rate in Hz gets every sample time wrong.
- kind: metadata_insufficient
  statement: '`units/peak_channel` is 1-based: the electrodes row peak_channel - 1 matches the unit''s
    cluster depth (median difference 8.0 um, against 13.4 um for row peak_channel). The description does
    not say so, and a unit''s region depends on it.'
- kind: format_error
  statement: '`wheel_moves` is an IntervalSeries whose `data` (the movement type) has half the length
    of its `timestamps`, which hold each movement''s onset and offset in turn; an IntervalSeries should
    have one data value per timestamp.'
- kind: metadata_insufficient
  statement: Channel locations mix levels of the Allen hierarchy. 2,262 curated units carry finer labels
    (SCig, LSr, COA, TT, SCsg, ORBm, LSc, PIR, DP) whose parents are among the paper's 42 regions, and
    others carry broad labels (TH, MB, CA). The paper's counts per region are recovered only after mapping
    the finer labels to their parents, which the dandiset does not document.
- kind: other
  statement: Genotypes are written differently from Supplementary Table 1 (Ai95 x VGlut1-Cre for RCL-GCaMP6f
    x VGlut-Cre, Vglut1-Cre for Vglut1-IRES2-Cre-D); sexes, ages and the 39 sessions match the paper.
- kind: selection_undocumented
  statement: The Methods exclude 5 of 39 sessions from the pupil analyses for unusable video, but the
    dandiset does not say which; eye_area is present in all 39 files, with missing values in two.
- kind: metadata_insufficient
  statement: '`spike_amps` and `waveform_mean` give no unit, and the trial table''s `included` flag (engaged
    trials) differs from the Methods'' disengagement rule on 1.7% of trials, although it gives the paper''s
    9,538 trials exactly.'
- kind: data_missing
  statement: The dandiset holds no histology (DiI spot coordinates, slice images) or electrophysiological
    landmarks, so the probe localization of the Methods cannot be checked.
- kind: methods_unavailable
  statement: Question for the authors. Definition R (Methods, Data analysis) z-scores the mean rate 0
    to 0.25 s against the trial baselines -0.1 to 0 s. For about 21% of neurons on matched single-stimulus
    trials no baseline window has a spike, so the z is infinite. Were such neurons counted as significant,
    left out, or was a variance floor used? Counting them, 17% to 23% of neurons are significant on contralateral
    Miss trials; leaving them out, 2% to 5% (Z1; fig2fg, fig5b).
- kind: methods_unavailable
  statement: Question for the authors. The matched-contrast selection (Methods, Training protocol) excludes
    sessions "When fewer than 10 such trials could be found", leaving 34 of 39. Here 36 sessions have
    at least 10 matched trials per group (Lederberg 2017-12-05, 2017-12-06 and 2017-12-07 are dropped)
    and 38 have 10 over the three groups; the next fewest are 10 and 14 trials. Which count was meant,
    and which further two sessions were removed?
- kind: methods_unavailable
  statement: 'Question for the authors. "94.1% ± 0.6% of trials with high contrast stimuli had no movement"
    in the passive replay: which window and which movements count? With the dataset''s detected movements
    of any kind, 84.6% of high-contrast passive presentations have none in -0.05 to 0.4 s.'
- kind: methods_unavailable
  statement: Question for the authors. Fig. 3d and 3e give the fraction of neurons in each region requiring
    a kernel and leave empty the regions where "the number of neurons passing analysis criteria was <
    5". Is the denominator the neurons that entered the nested tests (full-model VE of at least 2%), or
    every neuron of the region in the analysis? Here the first reading reproduces fig3d-vision-localized
    (the five highest fractions all in visual areas) and the second does not (CP enters the five highest);
    no region has fewer than 5 neurons under the second.
- kind: other
  statement: 'The kernel model of the paper''s code runs on the dandiset: with the basis of CanonCor2all.m
    and the elastic net of the Methods, 2,886 of 13,852 task-responsive neurons pass the 2% cross-validated
    VE of the nested tests, against about 4,240 in the paper, so counts of kernel-requiring neurons come
    out lower than the paper''s.'
