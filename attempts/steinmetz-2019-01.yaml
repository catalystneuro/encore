- claim: fig5e-engagement-predicts-go
  outcome: reproduced
  notebook: reproduce_steinmetz_2019.ipynb
  output: claim:fig5e-engagement-predicts-go
  notes: On 2,434 matched trials the logistic slope of Go on the index is 0.44 (95% interval 0.35 to
