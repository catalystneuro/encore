- claim: fig2fg-miss-restricted
  outcome: not_reproduced
  notebook: reproduce_steinmetz_2019.ipynb
  output: claim:fig2fg-miss-restricted
  notes: 'No reading meets all three conditions, and the criterion gives no partial outcome; the first
    run recorded partially_reproduced. With Z1 and finite z only, (i) holds (3.39% of visual-pathway neurons
    activated on contralateral Miss trials against 1.29% elsewhere) and (ii) holds (6.75% against 1.29%
    outside the pathway on Go and Miss), but (iii) fails: ipsilateral Miss 1.1868% (all sessions) against
    contralateral Miss 2.3658%, half being 1.1829%. With the two Miss sets matched to each other in contrast
    and count on the same 8,598 neurons of the 19 sessions (219 trials a side), ipsilateral 1.117% against
    contralateral 2.082% (half 1.041%), so (iii) fails by more; in the 14 sessions with at least 10 matched
    pairs, 1.281% against 2.378%. With Z2 and finite z, (ii) and (iii) hold and (i) fails (0.047% against
    0.060%). The readings counting an infinite z (21.6% of neurons on Go trials have no baseline spikes)
    mark those neurons significant whatever they do and carry no information. Only 19 of 39 sessions have
    10 matched single-stimulus trials per group.'
  deviations:
  - The z of definition R is infinite for a neuron with no spikes in any baseline window. The paper does
    not say how such neurons are treated; both treatments (counted significant, or not) are run. The question
    is recorded for the authors (findings).
  - Matched trials are single-stimulus trials, as for fig2de; sessions with fewer than 10 matched trials
    per group are left out of the matched conditions.
  - Condition (iii) is also tested with contralateral and ipsilateral Miss trials matched to each other
    in contrast and count, on the same neurons of the same sessions; the criterion does not say whether
    the ipsilateral Miss trials are matched.
- claim: fig5b-miss-more-than-passive
  outcome: not_reproduced
  notebook: reproduce_steinmetz_2019.ipynb
  output: claim:fig5b-miss-more-than-passive
  measured: 36
  notes: More neurons are activated on matched Miss than passive trials under Z1 with finite z, pooled
    4.82% against 3.24% (Figs. 3 to 5 set) and 3.30% against 2.51% (neurons N), with Miss above passive
    in 30 and 29 of 42 regions. Under Z2 with finite z both fractions are near zero (0.05% and 0.04%)
    and the excess is positive in 3 regions. The infinite-z readings carry no information (21% of neurons
    counted without baseline spikes). The matched-contrast selection keeps 36 sessions with at least 10
    trials per group (38 if counted over the three groups), not the 34 the criterion requires, and the
    criterion gives no partial outcome; the first run recorded partially_reproduced. The dropped sessions
    are Lederberg 2017-12-05, 2017-12-06 and 2017-12-07, with 0 to 4 NoGo trials at each contralateral
    contrast (0, 5 and 6 matched trials per group). Among the kept sessions the fewest matched trials
    are 10 (Lederberg 2017-12-10) and 14 (Lederberg 2017-12-11, Tatum 2017-12-06), so no threshold from
    10 to 14 gives 34 either. All 39 sessions have at least 12 Left, Right and NoGo trials of definition
    T.
  deviations:
  - The infinite z of neurons without baseline spikes is treated both ways, as in fig2fg.
  - The Methods say "When fewer than 10 such trials could be found, the session was excluded" without
    saying whether per group or in all; both are run, and neither gives 34.
- claim: fig5c-prestimulus-task-vs-passive
  outcome: reproduced
  notebook: reproduce_steinmetz_2019.ipynb
  output: claim:fig5c-prestimulus-task-vs-passive
  notes: Under factor reading a (the Methods' nested ANOVA) with all passive events, 23 regions differ
    at p < 0.0012; all 9 differing neocortical regions (ACA, MOp, ORB, SSp, VISa, VISam, VISl, VISp, VISrl)
    are lower in the task, the visual thalamus (LD, LGd, LP) is lower too, and all 11 other differing
    regions (ACB, CA1, CA3, CP, DG, GPe, LS, MRN, SNr, VPM, ZI) are higher. VISp is lower on matched Miss
    than passive trials (1.64 against 2.39 Hz) and CP higher (3.10 against 2.77 Hz) in window a, likewise
    in window b. Factor reading b gives 14 differing regions with the same pattern. With passive visual
    presentations and factors a, ILA is higher in the task, so that reading fails.
  deviations:
  - Under factor reading a, the condition F of a model with condition and neuron nested in session, with
    one observation per neuron and condition, equals the square of the paired t across neurons, which
    is how it is computed.
  - The VISp and CP comparison uses the sessions kept for definition M (36).
