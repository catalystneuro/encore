- claim: ed9cf-engagement-controls
  outcome: reproduced
  notebook: reproduce_steinmetz_2019.ipynb
  output: claim:ed9cf-engagement-controls
  notes: The index (z-scored within session) is higher on Go than Miss trials after rewards (0.37,
