- claim: supptable2-sessions
  outcome: reproduced
  notebook: reproduce_steinmetz_2019.ipynb
  output: claim:supptable2-sessions
  assumed: true
  notes: All 39 sessions of the table are in the dataset, matched by subject and date, with matching
    ages (39 of 39) and sexes (10 of 10). Genotypes are the same lines named differently (Ai95 x
    VGlut1-Cre for RCL-GCaMP6f x VGlut-Cre, Vglut1-Cre for Vglut1-IRES2-Cre-D). The regions of each
    session's neurons (curated, at least 0.1 Hz) match the table's areas in 38 of 39 sessions
    (Muller 2017-01-08 lacks MOs); with neurons N, which drop regions with fewer than 13 neurons, 24
    of 39. With region labels as given (no parent mapping) 25 of 39 match, so the outcome rests on the
    mapping.
  deviations:
  - The areas of a session are those of its neurons as the Methods define a neuron ("Units passing
    these criteria were considered to reflect the spiking activity of a neuron", Methods, Data
    analysis); the claims file says only "areas with neurons". Neurons N are shown as a variant.
  - Assumption. A unit labelled with a finer Allen division (SCig, SCsg, LSr, LSc, ORBm, COA, TT, PIR,
    DP; 2,262 units) lies in its parent region among the 42 (Allen CCF hierarchy). The paper does not
    say how labels were grouped.
- claim: task-modulated-fraction
  outcome: reproduced
  notebook: reproduce_steinmetz_2019.ipynb
  output: claim:task-modulated-fraction
  measured:
  - 13439
  - 60.34
  - 74.95
  - 20.89
  notes: 13,439 of 22,273 neurons N (60.34%) have a test below 0.05/6. Under reading a 74.95%
    consistently increase and 20.89% decrease; under reading b 71.60% and 19.44%. All four values are
    within tolerance under both readings. The active fraction by subject ranges from 50.3% to 73.2%.
    With labels as given, 12,263 of 20,418 (60.06%) are active.
  deviations:
  - Rates are spike counts in each window divided by its length; the code (kernelFitBasic.m)
    interpolates binned rates. Tests that return no p-value because all values are equal (0 to 874
    neurons per test) count as not significant, where the code keeps the neuron as included (its
    "BUG" comment).
  - Test 6 compares post-reward rates of correct NoGo trials (no stimulus, NoGo, positive feedback)
    with the baseline rates of all trials T, as kernelFitBasic.m does (ranksum of rewRates against
    bslRates).
