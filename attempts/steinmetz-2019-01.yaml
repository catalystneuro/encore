- claim: fig5f-engagement-index
  outcome: reproduced
  notebook: reproduce_steinmetz_2019.ipynb
  output: claim:fig5f-engagement-index
  measured:
  - 7.85
  - 344.3
  - 36
  notes: With trials T and contralateral contrast above zero (readings a, a), Go exceeds Miss by 7.85
    a.u. on average (s.e. 1.54; positive in 29 of 36 sessions), paired t = 5.09, p = 1.2e-5, with
    344 ± 34 neurons per session (mean ± s.e.); expected 8.42 ± 0.84 and 319 ± 32.5. All task trials
