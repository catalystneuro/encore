- claim: fig2de-activity-order
  outcome: reproduced
  notebook: reproduce_steinmetz_2019.ipynb
  output: claim:fig2de-activity-order
  notes: With the half-maximum latency (L1) and each responsive reading, VISp is the first region on
    correct contralateral trials (77.5 ms; rank percentile 0.024), SCs at percentile 0.061 to 0.083
    (82.5 to 87.5 ms) and the VIS mean at 0.195 to 0.214; on ipsilateral trials VISp is at 0.73 to
    0.95 and SCs at 0.70 to 0.78, in the latest third. With the time of the maximum (L2) SCs falls at
    0.42 to 0.56 on contralateral trials, so the claim holds under L1 only. Regions need 5 responsive
    neurons (41 or 42 regions).
  deviations:
  - Contralateral correct trials are Right choices (T) on a right stimulus alone, matched in contrast
    with contralateral Miss and passive trials of the same single-stimulus type (definition M applied
    to these three groups). Sessions without matched trials contribute nothing.
  - The sliding-window display selection (reading a) uses windows starting 0 to 0.3 s after stimulus
    onset; the Methods do not give the range.
- claim: fig2fg-miss-restricted
  outcome: partially_reproduced
  notebook: reproduce_steinmetz_2019.ipynb
  output: claim:fig2fg-miss-restricted
  notes: No reading meets all three conditions. With Z1 and finite z only, (i) holds (3.39% of
    visual-pathway neurons activated on contralateral Miss trials against 1.29% elsewhere) and (ii)
    holds (6.75% against 1.29% outside the pathway on Go and Miss), but (iii) fails narrowly
    (ipsilateral Miss 1.19% against contralateral Miss 2.37%, half being 1.185%). With Z2 and finite
    z, (ii) and (iii) hold and (i) fails (0.05% against 0.06%). Counting infinite z (21.6% of neurons
    on Go trials have no baseline spikes), (ii) fails. Only 19 of 39 sessions have 10 matched
    single-stimulus trials per group.
  deviations:
  - The z of definition R is infinite for a neuron with no spikes in any baseline window. The paper
    does not say how such neurons are treated; both treatments (counted significant, or not) are run.
    The question is recorded for the authors (findings).
  - Matched trials are single-stimulus trials, as for fig2de; sessions with fewer than 10 matched
    trials per group are left out of the matched conditions.
- claim: fig5b-miss-more-than-passive
  outcome: partially_reproduced
  notebook: reproduce_steinmetz_2019.ipynb
  output: claim:fig5b-miss-more-than-passive
  measured: 36
  notes: More neurons are activated on matched Miss than passive trials under Z1, pooled 18.14%
    against 14.71% (Figs. 3 to 5 set, infinite z counted) and 4.82% against 3.24% (finite z), with
    Miss above passive in 26 to 30 of 42 regions. Under Z2 with finite z both fractions are near zero
    (0.05% and 0.04%) and the excess is positive in 3 regions. The matched-contrast selection keeps 36
    sessions with at least 10 trials per group (38 if counted over the three groups), not the 34 the
    criterion requires; the effect holds and the session count does not.
  deviations:
  - The infinite z of neurons without baseline spikes is treated both ways, as in fig2fg.
  - The Methods say "When fewer than 10 such trials could be found, the session was excluded" without
    saying whether per group or in all; both are run, and neither gives 34.
- claim: fig5c-prestimulus-task-vs-passive
  outcome: reproduced
  notebook: reproduce_steinmetz_2019.ipynb
  output: claim:fig5c-prestimulus-task-vs-passive
  notes: Under factor reading a (the Methods' nested ANOVA) with all passive events, 23 regions differ
    at p < 0.0012; all 9 differing neocortical regions (ACA, MOp, ORB, SSp, VISa, VISam, VISl, VISp,
    VISrl) are lower in the task, the visual thalamus (LD, LGd, LP) is lower too, and all 11 other
    differing regions (ACB, CA1, CA3, CP, DG, GPe, LS, MRN, SNr, VPM, ZI) are higher. VISp is lower on
    matched Miss than passive trials (1.64 against 2.39 Hz) and CP higher (3.10 against 2.77 Hz) in
    window a, likewise in window b. Factor reading b gives 14 differing regions with the same pattern.
    With passive visual presentations and factors a, ILA is higher in the task, so that reading fails.
  deviations:
  - Under factor reading a, the condition F of a model with condition and neuron nested in session,
    with one observation per neuron and condition, equals the square of the paired t across neurons,
    which is how it is computed.
  - The VISp and CP comparison uses the sessions kept for definition M (36).
