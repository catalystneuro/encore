- claim: fig1d-reaction-time-difficulty
  outcome: reproduced
  notebook: reproduce_steinmetz_2019.ipynb
  output: claim:fig1d-reaction-time-difficulty
  notes: On the Left and Right trials of definition T (trial reading b) the mean reaction times are
    0.206 s (high-contrast single), 0.226 s (low-contrast single) and 0.221 s (competing); the
    condition factor has p = 2.9e-10 (F1, with session), 8.7e-09 (F2, with subject), and the
    contrast factor p = 9.6e-10 under F3 (competing-stimulus factor p = 0.017). The high-contrast
    class is fastest in every subject (medians). Under trial reading a (first detected movement
    after the stimulus, all trials with a Left or Right response) the condition p is 0.006 to 0.02
    and the competing class is slightly faster than the high-contrast class (0.410 against 0.413 s),
    so the claim holds under reading b only.
  deviations:
  - The multi-way ANOVA is a type II ANOVA on an ordinary least squares fit (statsmodels); the
    paper names neither the software nor the sums of squares.
- claim: ed1q-wheel-choice-decoding
  outcome: reproduced
  notebook: reproduce_steinmetz_2019.ipynb
  output: claim:ed1q-wheel-choice-decoding
  measured:
  - 48.9
  - 94.8
  notes: With the sign of the velocity (reading a), the mean accuracy over 39 sessions is 48.9% (s.d.
    1.9) 50 ms before movement onset and 94.8% (s.d. 3.5) 50 ms after, against 47.7 and 94.6. 92.0% of
    trials have zero velocity at -50 ms. The logistic decoder (reading b) gives 59.0% before onset,
    outside tolerance, as it predicts the more frequent choice when velocity is zero; after onset it
    gives 94.7%.
  deviations:
  - Velocities are taken at the nearest wheel sample (2.5 kHz) to each time; the logistic regression
    uses scikit-learn defaults, a standard choice.
