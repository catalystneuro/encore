- claim: fig2de-activity-order
  outcome: reproduced
  notebook: reproduce_steinmetz_2019.ipynb
  output: claim:fig2de-activity-order
  notes: With the half-maximum latency (L1) and each responsive reading, VISp is the first region on correct
    contralateral trials (77.5 ms; rank percentile 0.024), SCs at percentile 0.061 to 0.083 (82.5 to 87.5
