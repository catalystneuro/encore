- claim: fig4d-jpecc-vis-leads
  outcome: partially_reproduced
  notebook: reproduce_steinmetz_2019.ipynb
  output: claim:fig4d-jpecc-vis-leads
  notes: Over 17 recordings VIS leads Frontal before movement, with 3 to 5 of 16 time points from -0.2
    to -0.05 s positive at p < 0.05, and after the stimulus, with 2 to 4 points from 0.08 to 0.12 s.
    Over 11 recordings VIS does not lead Midbrain near 0.1 s in any reading (no significant point;
    mean asymmetry 0.005 to 0.055). The VIS-Frontal parts hold and the VIS-Midbrain part does not. The
    Methods' PCA across time points gives the same result.
  deviations:
  - The asymmetry index follows the Methods' diagonal slice, from (t-50, t+50) ms to (t+50, t-50) ms
    (Methods, jPECC analysis); the claims file's wording ("from (t, t) to 50 ms of lead") can be read
    as a slice along one axis.
  - The criterion's open counts are read as at least one significant positive time point in -0.2 to
    -0.05 s, and in 0.08 to 0.12 s for each pair.
  - The Methods do the PCA "across time points and trials"; the criterion and jPECC.m do it per time
    bin. The criterion is followed and the Methods' PCA is a variant; asked of a reader.
  - Windows are -0.05 to 0.3 s from stimulus onset and -0.3 to 0.05 s from movement onset; a region
    group is the regions of the group with at least 13 neurons in the session.
