- claim: fig1c-easy-performance
  outcome: reproduced
  notebook: reproduce_steinmetz_2019.ipynb
  output: claim:fig1c-easy-performance
  measured:
  - 1.71
  - 10.12
  notes: On engaged trials (reading b, the dataset's `included` flag) the means over 39 sessions are
    1.71% incorrect choices (s.d. 2.47) and 10.12% Misses (s.d. 8.32), against 1.7 ± 2.5 and 10.1 ±
    8.3. With all trials (reading a) Misses are 23.24%, outside tolerance; incorrect choices are
    1.47%. Measured values are those of reading b, the reading that matches.
  deviations:
  - High contrast is 1.0, the highest of the dataset's four contrasts (0, 0.25, 0.5, 1); the dataset
    does not name the levels.
