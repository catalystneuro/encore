- claim: edtable1-region-counts
  outcome: reproduced
  notebook: reproduce_steinmetz_2019.ipynb
  output: claim:edtable1-region-counts
  measured: 38
  notes: Re-run after the reader's answer (questions/steinmetz-2019.yaml), which found that the claims
    file misread the table and amended the criterion to count every neuron of the 42 regions (curated,
    at least 0.1 Hz), with recordings read as (a) sessions with any neuron of the region or (b) sessions
    with at least 13, and definition N as a variant. The first run tested definition N and found 26 of
    42 regions matching, not reproduced. Under reading a, recordings, mice and neurons all match in 38
    of 42 regions (recordings exact in 41, mice in 42, neurons within 10% in 38), the number needed for
    reproduced; the regions that differ are ACA, MOs, VPL and ZI (MOs has 18 recordings against 19 and
    1,352 neurons against 1,534). The neurons number 22,434 and the active ones 13,532, against 22,458
    and 13,467; active counts are within 10% in 36 regions. Reading b matches in 26 regions (recordings
    exact in 28), as does definition N. The measured value is the number of matching regions under reading
    a. With region labels as given (no parent mapping) 33 of 42 regions match (ACA, LS, MOs, OLF, ORB,
    SCm, SCs, VPL and ZI differ), partially reproduced under the criterion, so the outcome rests on the
    mapping of finer labels to their parent.
  deviations:
  - Assumption. Finer region labels (SCig, SCsg, LSr, LSc, ORBm, COA, TT, PIR, DP) are mapped to their
    parent among the 42 regions (Allen CCF hierarchy), as for recording-counts and supptable2-sessions;
    the paper does not say how labels were grouped, and the labels as given are run as a variant.
  - Mice are counted over every neuron of the region under both readings of the recordings; counted over
    the sessions of reading b they match in 38 regions.
  assumed: true
