- claim: task-modulated-fraction
  outcome: reproduced
  notebook: reproduce_steinmetz_2019.ipynb
  output: claim:task-modulated-fraction
  measured:
  - 13532
  - 60.32
  - 74.87
  - 20.95
  notes: On the criterion's neurons, every neuron (curated, at least 0.1 Hz) of the 42 regions (22,434),
    13,532 have a test below 0.05/6 (60.32%). Under reading a 74.87% consistently increase and 20.95%
    decrease; under reading b 71.53% and 19.49%. All four values are within tolerance under both readings.
    The first run used neurons N (22,273), now a variant, with 13,439 active (60.34%), 74.95% and 20.89%.
    The active fraction by subject ranges from 50.4% to 73.2%. With labels as given, 12,263 of 20,418
    neurons N_raw (60.06%) are active.
  deviations:
  - Rates are spike counts in each window divided by its length; the code (kernelFitBasic.m) interpolates
    binned rates. Tests that return no p-value because all values are equal (0 to 874 neurons per test)
    count as not significant, where the code keeps the neuron as included (its "BUG" comment).
  - Test 6 compares post-reward rates of correct NoGo trials (no stimulus, NoGo, positive feedback) with
    the baseline rates of all trials T, as kernelFitBasic.m does (ranksum of rewRates against bslRates).
  - Neurons are those of the criterion (all neurons of the 42 regions with a rate of at least 0.1 Hz);
    the first run used neurons N, now a variant.
