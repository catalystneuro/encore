- claim: fig3b-mean-prediction
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_nishimoto_2011.ipynb
  output: claim:fig3b-mean-prediction
  measured: 0.448
  notes: The compressive and divisive model predicts the 45 neurons with a mean correlation of
    0.448 (median 0.454, range 0.221 to 0.730), below the band of 0.468 to 0.572. For the 14
    neurons with both validation sets the two correlations are averaged, as the paper does; with
    the motion-enhanced set only the mean is 0.443. No reading reaches the band (delays 1 to 10
    give 0.449, random-partition folds 0.446, sigma chosen on held-out data 0.451, no delay offset
    0.448, the 12 ms Gaussian as a full width 0.380). Monkey f 0.458 (34 neurons), monkey v 0.417
    (11). All 45 neurons lie between 0.2 and 0.8, as in Figure 3B. The model is a spatially pooled
    version of the paper's, which may explain part of the gap.
  deviations:
  - The regression weights are constrained to be pooled over space onto 763 regressors (545
    complex, 218 simple) at 11 delays, where the paper fits a weight for each of 5956 filters. The
    filter bank behind them follows the paper's rules (Materials and Methods, The V1 filter bank),
    with 7025 complex and 1082 simple channels on grids spaced 2.2 sigma, one carrier cycle per two
    sigma, and simple cells up to 2 cycles per cRF in the divisive pool. This was forced by the time
    limit (12 models for 45 neurons).
  - Simple cells enter the regression only at 0.75 cycles per cRF and SF 0, below the paper's limit
    of 2 cycles per cRF, for the same reason.
  - Assumed, the temporal envelope of the Gabor filters (Eq. 1), which the paper does not give. It
    spans 11 frames with SD 2 frames and is centred on the frame (c_t = 0), so that the delays set
    the latency. With an envelope ending at the frame (causal), the fitted weights of the first
    neurons tried piled up at delay 0, so the response comes earlier than such a filter allows
    (preparation, not in the notebook).
  - Assumed, an offset of the 11-frame delay window of 0, 3 or 6 frames earlier, chosen per neuron
    by the held-out error on the training data alone (0 for 31 neurons, 3 for 9, 6 for 5). The
    data descriptor does not say how response bins are aligned to frames. Offset 0 for every
    neuron gives the same mean (0.448).
  - Assumed, spatial frequencies 0, 0.75, 1.5, 3 and 6 cycles per cRF and temporal frequencies 0,
    3.75, 7.5, 15 and 30 Hz; the paper gives "log distributed from zero to six" and "from 0 to 30
    Hz" with six velocities, without the values.
  - The cRF is half the stored patch (claims file, reading (a)); the descriptor says the patch
    covers about two receptive fields, so readings (a) and (b) coincide. Frames are block-averaged
    to 32 x 32 pixels.
  - Sigma of divisive normalization is 1% of the mean pooled response (claims file, reading (b));
    reading (a), chosen on held-out data between 0.01 and 1 times, was run for this model only.
    Boosting step 1% of the response SD; stopping after 50 steps without a lower held-out error,
    keeping the weights at the minimum (the paper says only that boosting stopped when the error
    began to increase).
  - The random-partition reading of the folds uses the Gram matrix built from lag cross-products,
    which is approximate for random rows.
  - 45 neurons, where the paper has 52.
- claim: fig3b-explainable-variance
  outcome: blocked
  blocked_by: data_missing
  notes: The files hold only the response averaged over repeats (psths), so the noise ceiling of
    David and Gallant (2005), which needs the single repeats, cannot be estimated. The repeat
    counts can be inferred from the denominators of the averaged values, but not the responses of
    single repeats.
