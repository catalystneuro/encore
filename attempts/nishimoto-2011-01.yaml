- claim: fig6a-null-on-plane
  outcome: reproduced
  assumed: true
  notebook: reproduce_nishimoto_2011.ipynb
  output: claim:fig6a-null-on-plane
  measured: 0.396
  notes: The mean excitatory on-plane ratio of 150 null neurons is within 0.324 to 0.396 in 12 of
