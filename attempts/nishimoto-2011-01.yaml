findings:
- kind: data_missing
  statement: The data set holds 45 of the paper's 52 MT neurons (34 from monkey f, 11 from monkey
    v), as its descriptor says. No recording appears twice.
- kind: data_missing
  statement: The files hold only the response averaged over repeats (psths), not the single
    repeats, so the explainable variance the paper reports cannot be computed.
- kind: metadata_insufficient
  statement: Fourteen files hold a field `ranges.nrange`, the first 2000 frames of a 4000-frame
    `ranges.vrange`, and every file holds an empty `ranges.trange`; the data descriptor describes
    neither. Its frames carry less motion than the rest of `vrange` (median frame difference over
    contrast 0.225 against 0.325, lower in all 14), consistent with the natural movies without
    motion enhancement of the paper's control.
- kind: data_missing
  statement: The paper's natural-movie control used 15 neurons; the files hold a natural-movie
    validation set (`nrange`) for 14.
- kind: other
  about: data
  statement: The denominators of the averaged validation responses imply 10 to 33 repeats per
    neuron (the largest per-frame denominator), where the paper reports 5 to 20; training frames
    carry denominators up to 5, so some training frames were shown more than once, which neither
    the paper nor the descriptor mentions.
- kind: other
  about: data
  statement: Training frames (`crange`) number 17,908 to 40,000 per neuron (mean 26,894), where the
    paper gives 20,000 to 40,000 (mean 27,120). In ct0133 (v0395), 12,729 of 19,842 training
    frames have no response (NaN), leaving 7,093.
- kind: metadata_insufficient
  statement: The descriptor does not say how the response bins are aligned to the frames, which
    sets the delays of a receptive field model. With a temporal filter centred on each frame, a
    delay window moved 3 or 6 frames earlier fits the held-out training data better for 14 of 45
    neurons.
- kind: methods_unavailable
  statement: Question for the authors. The paper does not give the temporal envelope (c_t and w_t
    of Eq. 1), the exact spatial and temporal frequencies or velocities, or the filter count per
    scale of its 5956-filter bank. This attempt used an 11-frame envelope with SD 2 frames
    centred on the frame, spatial frequencies 0 to 6 cycles per cRF and temporal frequencies 0 to
    30 Hz an octave apart; were these close to the paper's?
- kind: methods_unavailable
  statement: Question for the authors. The paper does not give the boosting step size, the exact
    stopping rule, the semisaturation constant sigma of Eq. 14, or how the 20% held-out parts were
    formed. This attempt used 1% of the response SD, 50 steps without improvement, sigma at 1% of
    the mean pooled response, and five contiguous blocks; what did the paper use?
- kind: methods_unavailable
  statement: Question for the authors. The grating and plaid parameters of the pattern-index
    simulation (spatial and temporal frequency, contrast, plaid separation, directions) and how
    the two constraints of the optimal plane were balanced are not given. Here the indices came
    out strongly component-like (medians -8.6 to -10.7), unlike Figure 7B; which parameters did the
    paper use?
- kind: paper_inconsistency
  statement: The delays are given as "up to 10 frames or 130 ms", but 10 frames at 83 Hz are 120
    ms; and the Methods give 20,000 to 40,000 training frames while the Results give 22,000 to
    42,000 frames, which matches the training plus validation frames of the files.
