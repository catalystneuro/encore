- claim: distance-error-and-plane-projection
  outcome: reproduced
  notebook: reproduce_even_chen_2019.ipynb
  output: claim:distance-error-and-plane-projection
  measured:
  - 2.505
  - 2.801
  - 2.503
  - 3.026
  notes: Under reading (a) all four values are within tolerance and projection raises the error (Welch
    J p = 2.7e-07, R p = 4.3e-41; paired over trials J p = 4.9e-12, R p = 1.2e-62). R's full value is inside its bound (2.502 cm) by 0.001 cm, so the match is
