findings:
- kind: metadata_error
  statement: In every file the units' electrode_group labels are swapped. Units 0 to 95 are labelled
    PMd but their electrodes column points to electrode rows of group 1 (M1), and units 96 to 191 are
    labelled M1 but point to rows of group 2 (PMd), the rows the PMd LFP uses. The data agree with the
    electrodes column; in R the array labelled PMd has 29 silent channels and carries almost no target
    information, as expected of the M1 array the paper calls unusable. The conversion code assigns
    electrode_group by the order of a dictionary of groups.
- kind: format_error
  statement: In every J file the boundary between units 0 and 1 in units/spike_times_index is
    misplaced. Unit 0 stops 1323 to 3120 s into sessions of 3083 to 8106 s, and unit 1 holds two to
    five times the median number of spikes, with spike times that run to the session's end and restart
    near 0.
- kind: metadata_error
  statement: Hand, cursor, eye and decoded positions are stated in meters with conversion NaN; the
    values are in mm (targets at up to 120, hand reaching them at about the same values).
- kind: metadata_insufficient
  statement: task_id is 2 in every trial and version_id is one value per monkey, so the files do not say
    which target configuration a session used; it must be inferred from target_pos, which has no unit.
    Electrode positions are NaN and impedances -1.
- kind: metadata_error
  statement: The trials column is_successful is described as "if monkey started before the mandatory
    delay period after target shown"; it holds the rig's trial success flag.
- kind: metadata_error
  statement: The dandiset description says the files hold sorted spikes; the units are threshold
    crossings of each electrode (one unit per electrode, built from the rig's spike rasters).
- kind: metadata_error
  statement: The archive's assetsSummary for version 0.220124.2156 gives 15 files and 187.5 GB; the
    version holds 12 files and 39.5 GB.
- kind: data_missing
  statement: The dandiset holds 5 of the 16 sessions the paper uses for monkey J. All four horizontal
    sessions, three of four ring sessions and two of four in each other configuration are missing; the
    paper's own data link returns HTTP 403.
- kind: other
  statement: The files place R's horizontal targets on 2017-01-15 and 16 and vertical targets on
    2017-01-17 and 18; the Methods give these dates the other way round. Grouped by the files'
    geometry, R's trial counts match the Methods' counts for horizontal and vertical better (within 4%
    and 3%) than grouped by date (12% and 5%).
- kind: other
  statement: R's horizontal targets lie at 5.2 + 10.4 k mm from the center, not 1 cm apart as stated,
    and R's 2017-01-17 session holds 69 successful trials to six ring targets outside its layout.
- kind: other
  statement: R's delays run from 400 to 1000 ms, against 400 to 900 ms in the Methods, and R has only 26
    trials without a delay (all on 2017-01-19), against 10% in the Methods; J has 19.8%.
- kind: selection_undocumented
  statement: R's 3-rings session holds 1340 successful delayed center-out trials where the paper used
    912; neither the paper nor the dandiset says how the trials were selected.
- kind: other
  statement: In R's 2017-01-19 the cursor differs from the hand by more than 1 m in over 1% of samples;
    in the other sessions they agree to within 3 mm in 99% of samples.
- kind: paper_inconsistency
  statement: The Results give J's distance errors as "3.03 cm v.s. 2.64 cm" (projected, then full) and
    R's as "2.78 cm v.s. 3.27 cm", while stating that projection raises the error in both; the R values
    are printed in the reverse order or contradict the text.
- kind: methods_unavailable
  statement: The paper names no analysis code, does not report its SVM hyperparameters or the nulls of
    its p-values, and its data link returns HTTP 403.
