- claim: session-configurations
  outcome: partially_reproduced
  notebook: reproduce_even_chen_2019.ipynb
  output: claim:session-configurations
  notes: 8 of 12 sessions have the configuration the Methods give for their date. R's 2017-01-15 and 16
    hold horizontal targets (Methods vertical) and 2017-01-17 and 18 vertical targets (Methods
    horizontal); all four mismatches are horizontal and vertical exchanged. 2017-01-17 also holds 69
    successful trials to six ring targets outside its layout. The dandiset holds all 7 of R's sessions
    and 5 of J's 16.
  deviations:
  - The configuration is inferred from the target positions, as the files' task_id is 2 in every trial.
- claim: r-trial-counts
  outcome: partially_reproduced
  notebook: reproduce_even_chen_2019.ipynb
  output: claim:r-trial-counts
  measured:
  - 3584
  - 4156
  - 3842
  - 1340
  notes: Grouped by the Methods' dates, ring 3584 (paper 3577) and vertical 3842 (4040) are within 10%
    under all three readings, horizontal 4156 (3699) and 3-rings 1340 (912) are not. Measured values
    are reading (a), successful delayed center-out trials; readings (b) and (c) differ by at most 26
    trials per configuration. Grouped by the file geometry, three of four are within 10% (horizontal
    3842 against 3699, vertical 4156 against 4040), which fits the exchange of dates found in
    session-configurations. The 3-rings session holds 47% more successful delayed trials than the
    paper used, and no reading explains the difference.
  deviations:
  - Which trials the paper counted is not stated; three readings were tested.
- claim: j-sessions-complete
  outcome: blocked
  blocked_by: data_missing
  notes: The dandiset holds 5 of the 16 sessions the Methods list for J (2015-10-01, 10-02, 10-15,
    2016-01-27, 01-28). The 11 missing include all four horizontal sessions, three of four ring
    sessions and two of four in each of vertical and 3-rings. The data link in the paper
    (stanford.edu/~shenoy/Data/Even-ChenEtAlPLoSCompBio2019.zip) returns HTTP 403, and no other
    dandiset of this paper was found.
- claim: delays-and-times
  outcome: partially_reproduced
  notebook: reproduce_even_chen_2019.ipynb
  output: claim:delays-and-times
  measured:
  - 332
  - 305
  - 587
  - 486
  notes: Reaction times (J 332, R 305 ms) and reach times read as acquisition minus go cue (J 587, R
    486 ms) are within tolerance; read as acquisition minus movement onset they are 255 and 181 ms. J's
    delays span 300 to 700 ms as stated; R's span 400 to 1000 ms, beyond the widened bound of 990 ms.
    No-delay trials are 19.8% of J's and 0.2% of R's successful center-out trials (26, all on
    2017-01-19), not 10%. Reaction time falls with delay in R (r = -0.264, p = 1.8e-205) but not in J
    (r = -0.013, p = 0.21; with onset at 5% of peak speed r = -0.034, p = 1.5e-03). J is 5 of its 16
    sessions.
  deviations:
  - Movement onset (10% of peak speed) and maximum speed are defined here; the paper does not define
    them. Onsets at 5% and 20% are shown.
  - Reach time is undefined in the paper; two readings were tested and (b) matches.
