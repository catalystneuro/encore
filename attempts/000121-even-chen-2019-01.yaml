- claim: delays-and-times
  outcome: partially_reproduced
  notebook: reproduce_even_chen_2019.ipynb
  output: claim:delays-and-times
  measured:
  - 332
  - 305
  - 587
  - 486
  notes: Reaction times (J 332, R 305 ms) and reach times read as acquisition minus go cue (J 587, R
    486 ms) are within tolerance; read as acquisition minus movement onset they are 255 and 181 ms. R's
    mean reaction time includes the 5.9% of its trials whose onset precedes the go cue; its median (361
    ms) and its mean over 100 to 800 ms (362 ms) are outside tolerance, and with onset searched only
    after the go cue the means are 342 ms (J, within tolerance) and 340 ms (R, just inside its bound of
    342 ms). J's delays span 300 to 700 ms as stated; R's span 400 to 1000 ms, beyond the widened bound of 990 ms.
    No-delay trials are 19.8% of J's and 0.2% of R's successful center-out trials (26, all on
    2017-01-19), not 10%. Reaction time falls with delay in R (r = -0.264, p = 1.8e-205) but not in J
    (r = -0.013, p = 0.21; with onset at 5% of peak speed r = -0.034, p = 1.5e-03; with onset after the
    go cue r = -0.029, p = 7.9e-03). J is 5 of its 16 sessions.
  deviations:
  - Movement onset (10% of peak speed) and maximum speed are defined here; the paper does not define
    them. Onsets at 5% and 20%, and onset searched only after the go cue, are shown.
  - Reach time is undefined in the paper; two readings were tested and (b) matches.
