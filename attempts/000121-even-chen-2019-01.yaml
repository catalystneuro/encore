- claim: spatial-plane-variance
  outcome: not_reproduced
  notebook: reproduce_even_chen_2019.ipynb
  output: claim:spatial-plane-variance
  measured:
  - 29.9
  - 36.9
  - 29.5
  - 32.4
  - 54.4
  - 40.2
  - 44.3
  notes: Measured values are reading (a) with tasks by the Methods' dates (R ring, horizontal, vertical,
    3-rings; J ring, vertical, 3-rings). No pairing of readings puts more than three of the seven
    values within tolerance. R's shares (29.5 to 36.9%) lie near the paper's (30.1 to 33.7%); J's are
    lower (40.2 to 54.4% against 47.7 to 68.2%) on 5 of 16 sessions without the horizontal task. The
    shares exceed those of planes fit to targets shuffled across conditions with p = 0.005 to 0.16
    (shuffle medians 11.5 to 24.8%), so the stated p < 1e-4 does not hold against this null; the
    paper's null is not stated.
  deviations:
  - J's plane is fit on 96 of its 120 conditions and its horizontal task is absent.
  - Two definitions of the share and two namings of R's horizontal and vertical tasks were tested.
- claim: plane-timecourse
  outcome: reproduced
  notebook: reproduce_even_chen_2019.ipynb
  output: claim:plane-timecourse
  measured:
  - 70
  - 90
  - 270
  - 350
  notes: Divergence (D below 0.9) at 70 ms (J) and 90 ms (R) after target onset; convergence (D below
    0.1) at 270 ms (J) and 350 ms (R). Other thresholds move divergence between 10 and 150 ms and
    convergence between 230 and 390 ms. The pre-target state sits at x -2.1, y -30.4 mm (J) and 17.6,
    -13.1 mm (R) in the plane's target coordinates, so "starts at the center" holds only roughly.
  deviations:
  - The thresholds, bins and smoothing are chosen here; the paper reads the times from a figure.
