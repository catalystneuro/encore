inputs:
- what: The paper's analysis code (FigureS4.ipynb and Figures/sled_glutamate_functions.py), read for the coupling,
    pair and bootstrap procedure. The notebook reads the printed outputs of FigureS4.ipynb at this commit (neurons
    per session, same-range and different-range pair counts and mean differences per bin) and prints them beside
    its own; they are compared with each reading and support the assumed reading, and no expected value or data
    are taken from them.
  source: https://github.com/kerlin-lab/Gable_2026 at commit 688e662767ed32b6ea60a2827c3483408edf6deb
outcomes:
- claim: figs4-session-selection
  outcome: not_reproduced
  notebook: reproduce_gable_2026.ipynb
  output: claim:figs4-session-selection
  measured:
  - 10
  - 17
  - 575
  - 5686
  notes: No reading of O1 to O3 matches, with units stored twice counted once or with every stored row. With units
    counted once every reading gives 9 mice (7 Sim1, 2 Tlx) and 15 or 16 sessions; with every stored row, 10 mice
    (7 Sim1, 3 Tlx) and 17 or 18 sessions, against 8 Sim1 and 3 Tlx mice and 20 sessions. The third Tlx mouse (sub-218453)
    enters only with every stored row, its session of 18 stored rows holding 16 distinct units. Nine of the ten
    KJ18 mice have a session of at least 18 stored units, but only seven have one with 18 units above 0.5 Hz under
    either rate, so no reading reaches eight Sim1 mice. Measured values are under the reading adopted for the other
    claims (baa-r), 10 mice, 17 sessions of 18 to 25 neurons (348 neurons), 575 same-range and 5,686 different-range
    pairs (paper 753 and 6,586). The output printed by FigureS4.ipynb (commit 688e662) shows 20 sessions of 18 to
    25 neurons, 411 neurons in all, and 771 same-range and 6,586 different-range pairs; 14 of the 17 baa-r sessions
    have a neuron count that appears in the code's list. Over all sixteen readings the pair counts run from 452
    to 893 and from 4,650 to 8,860. Without the Ai32 crosses the count is 7 mice under every reading. The outcome
    is the same under every reading, so it does not rest on an assumption.
  deviations:
  - The selection is run under the eight combinations of O1 to O3, as the criterion directs, each with units stored
    twice counted once and with every stored row.
  - Mice are counted by the strain in the subject record; the KJ18 and PL56 mice crossed with Ai32 are counted with
    their Cre line, and the count without them is shown. The selected sessions of these mice hold no laser trace,
    photostimulation onsets or optogenetics metadata, so any photostimulation in them could not be excluded.
  - Common window (O5) of 4.6 s from sample onset, the window of a trial with the task's 1.3 s sample and delay
    epochs and the shortest among the trials of the four types; trials whose GO + 2 s comes earlier, or whose window
    runs past the end of the trial's observation interval, are dropped. The paper does not say how a common length
    was set.
- claim: figs4-lowest-couplers-correlated
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_gable_2026.ipynb
  output: claim:figs4-lowest-couplers-correlated
  measured: 0.0405
  notes: Under baa-r the lowest bin's mean difference is 0.041 (same 0.022, different -0.019; 74 same-range and
    852 different-range pairs), Holm-corrected one-tailed p = 0.0007, positive and significant but below the tolerance
    of 0.054 to 0.066. Over the five seeds it is 0.0402 to 0.0405 with p = 0.0007. It is significant under all sixteen
    readings (0.032 to 0.055) and within tolerance only under bba (0.0548), with units counted once; every reading
    with every stored row gives partially reproduced, so the outcome rests on the assumed treatment of units stored
    twice. The paper's code printed 0.0575. The difference is positive in each of the 8 mice with same-range pairs
    in the bin. The session selection did not match the paper's (figs4-session-selection), so the population differs
    from the paper's 20 sessions.
  deviations:
  - Assumed reading baa-r where the readings give different outcomes. Units stored twice in a file (a repeated id
    with an identical spike train), a detail the claims file does not name, are kept as stored, each row a unit.
    The files give each such unit as two rows of the units table, so a pipeline that reads the table as stored keeps
    both, and only then does the selection include a third Tlx mouse (the paper has three) and come closer to the
    code's printed 20 sessions and 411 neurons (17 sessions and 348 neurons under baa-r, against 16 and 318 under
    baa). O1 (b), only units above 0.5 Hz enter a selected session, because the output printed by the paper's FigureS4.ipynb
    (commit 688e662) gives 18 to 25 neurons per session, which the O1 (b) readings give and the O1 (a) readings
    do not (up to 34). O2 and O3 are not assumed. The Methods' 'session-wide firing rate' can be the rate over the
    recording, but the same paragraph says the coupling was 'estimated session-wide from activity recorded between
    the tactile stimulus onset and 2 s after the GO signal'; the code's output does not tell the O3 readings apart.
    A claim whose outcome turns on O2 or O3 is blocked. Results under all sixteen readings are in the notebook.
  - Common window (O5) of 4.6 s from sample onset, the window of a trial with the task's 1.3 s sample and delay
