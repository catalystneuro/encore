findings:
- kind: format_error
  severity: critical
  statement: In 50 of the 99 ecephys files the units table repeats a unit id (72 extra rows, for example
    ids 3, 4, 4, 5, 5), and in every case the repeated rows hold the identical spike train. A unit is
    stored twice, so an analysis that takes each row as a unit counts it twice; in this attempt the duplicates
    change which sessions reach the paper's 18-unit filter (9 or 10 mice and 15 to 18 sessions depending
    on whether they are counted once). Whether another unit was lost in place of the copy cannot be told
    from the files.
- kind: other
  about: data
  severity: major
  statement: The paper's selection (KJ18 and PL56 mice, sessions with at least 18 good units above 0.5
    Hz, photostimulation trials excluded) gives 9 or 10 mice (7 Sim1, 2 or 3 Tlx) and 15 to 18 sessions
    under every reading tried, against the paper's 11 mice (8 Sim1, 3 Tlx) and 20 sessions. The dataset
    holds 10 KJ18 and 6 PL56 mice, so the difference lies in the units or rates, not in missing mice.
- kind: metadata_error
  severity: minor
  statement: Every trial's task is labelled 'audio delay', while the files' experiment description ('object
    location discrimination task') and the paper describe a tactile sample cue.
- kind: metadata_insufficient
  severity: minor
  statement: The units' quality column holds the single value 'good' for all 1,441 units, so it does not
    separate high-quality units from others as the paper's selection expects.
- kind: format_error
  severity: minor
  statement: 558 BehavioralEvents timestamps are NaN (126 sample, 121 delay, 130 GO, 181 photostimulation
    onsets), so these events cannot be placed in a trial; in the 16 sessions analysed one photostimulation
    onset is NaN, and the stored laser trace shows no included trial with laser power.
- kind: metadata_insufficient
  severity: minor
  statement: The units' observation intervals start at a trial start and last 5.5 s, while the trials'
    stop times differ from their ends by up to 13 s, and 574 trials with a sample time (in 65 files) have
    no observation interval, so no spikes are stored for them. Neither is described in the files.
- kind: format_error
  severity: minor
  statement: Ten units in four files store spike times out of order, and two files hold spikes outside
    their units' observation intervals (10,895 in sub-214429 ses-20130806, 4,665 in sub-219031 ses-20131024).
- kind: other
  about: data
  severity: none
  statement: Spikes and trial events share a clock as far as decoding shows; the instructed side of correct
    trials is decoded at a median balanced accuracy of 0.52 before sample onset and 0.88 after GO, and
    near 0.5 with labels shifted by one trial. Photostimulation onsets agree with the stored laser power
    trace in the 13 selected sessions checked. The published version and the draft hold the same 158 assets.
- kind: methods_unavailable
  statement: For the authors. The step that builds the Figure S4 input arrays (ephys_secondaryAna.PKL)
    from DANDI:000010 is not in the code at commit 688e662. Which units enter a selected session (all
    high-quality units, or only those above 0.5 Hz), how the session-wide rate is measured (over the recording,
    or within the analysis windows), which trials enter (only CL, CR, IL, IR, or also early-lick and no-response
    trials), how trial windows of different length were made common, and whether units stored twice in
    the files were counted once all change which sessions pass and whether the 57.14 to 71.43% and middle
    bins are significant. This attempt assumed only units above 0.5 Hz (the code's printed 18 to 25 neurons
    per session support it), the rate over the recording, and the four trial types. Could you confirm
    or correct these choices?
- kind: other
  about: paper
  statement: The paper's Code and data availability says that code and data are available at github.com/kerlin-lab/Gable_2026,
    but the repository at commit 688e662 holds code only, its notebooks loading pickled data from the lab's
    servers. The two-photon imaging behind 30 of the 34 claims is not public in any archive found, so those
    claims cannot be tested.
