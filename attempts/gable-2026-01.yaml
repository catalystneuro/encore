- claim: figs4-session-selection
  outcome: not_reproduced
  notebook: reproduce_gable_2026.ipynb
  output: claim:figs4-session-selection
  measured:
  - 9
  - 16
  - 501
  - 5060
  notes: No reading of O1 to O3 matches. With units counted once every reading gives 9 mice (7 Sim1, 2
    Tlx) and 15 or 16 sessions; with every stored row, 10 mice (7 Sim1, 3 Tlx) and 17 or 18 sessions,
    against 8 Sim1 and 3 Tlx mice and 20 sessions. Measured values are under the reading adopted for the
    other claims (baa, units counted once), 9 mice, 16 sessions, 501 same-range and 5,060 different-range
    pairs (paper 753 and 6,586). The output printed by FigureS4.ipynb (commit 688e662) shows 20 sessions
    of 18 to 25 neurons, 411 neurons in all, and 771 same-range pairs; reading baa selects 16 sessions
    of 18 to 25 neurons, 318 in all. Over all sixteen variants the pair counts run from 452 to 893 and
    from 4,650 to 8,860, and abb with every stored row comes closest on sessions (18). Without the Ai32
    crosses the count is 7 mice under every reading. The dataset holds 10 KJ18 and 6 PL56 mice; 7 of these
    16 have no session with 18 units above 0.5 Hz under any reading. The outcome is the same under every
    reading, so it does not rest on an assumption.
  deviations:
  - The selection is run under the eight combinations of O1 to O3, as the criterion directs.
  - Mice are counted by the strain in the subject record; the KJ18 and PL56 mice crossed with Ai32 are
    counted with their Cre line, and the count without them is shown.
  - Units stored twice in a file (a repeated id with an identical spike train) are counted once; the paper
    may have counted every stored row, which the selection claim shows as a variant.
  - Common window (O5) of 4.6 s from sample onset, the window of a trial with the task's 1.3 s sample
    and delay epochs and the shortest among the trials of the four types; trials whose GO + 2 s comes
    earlier, or whose window runs past the end of the trial's observation interval, are dropped. The paper
    does not say how a common length was set.
- claim: figs4-lowest-couplers-correlated
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_gable_2026.ipynb
  output: claim:figs4-lowest-couplers-correlated
  measured: 0.0479
  notes: Under baa the lowest bin's mean difference is 0.048 (same 0.028, different -0.020; 60 same-range
    and 768 different-range pairs), Holm-corrected one-tailed p = 0.0007, positive and significant but
    below the tolerance of 0.054 to 0.066. Over the five seeds it is 0.0478 to 0.0479 with p = 0.0007.
    It is significant under all eight readings (0.040 to 0.055) and within tolerance only under bba, so
    the outcome rests on the reading. The difference is positive in each of the 8 mice with same-range
    pairs in the bin. The session selection did not match the paper's (figs4-session-selection), so the
    population differs from the paper's 20 sessions.
  deviations:
