- claim: fig3f-backtracking-svm
  outcome: partially_reproduced
  notebook: reproduce_xu_2022.ipynb
  output: claim:fig3f-backtracking-svm
  notes: Sessions with backtracking in both directions are 6 ALM (as in the paper), 9 M1TJ, 8 S1TJ
    and 5 S1BF. Mean accuracy in 0.2 to 0.4 s after the trigger is 0.740 (ALM), 0.734 (M1TJ), 0.595
    (S1TJ) and 0.556 (S1BF), against null 95th percentiles of 0.526, 0.523, 0.516 and 0.515; before
    0.1 s all are 0.487 to 0.519. ALM and M1TJ decode as stated; S1TJ and S1BF also exceed the
    null, which the paper reports as an insignificant trend and no prediction. In this window the
    classes differ in behaviour (1.854 against 0.113 missed licks, ed2e-missed-licks), which S1TJ
    and S1BF activity may reflect.
  deviations:
  - The paper's null and confidence intervals come from a hierarchical bootstrap; here the null is
    20 label shuffles per session, averaged over sessions.
  - Trials are balanced across directions by random subsampling.
  - The PCA before the SVM is fitted on all trials of a session, without labels, before the
