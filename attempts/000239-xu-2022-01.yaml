- claim: fig3c-length
  outcome: reproduced
  notebook: reproduce_xu_2022.ipynb
  output: claim:fig3c-length
  measured:
  - 0.568
  - 0.423
  - 0.117
  - 0.032
  notes: Mean R2 by area (S1TJ, M1TJ, ALM, S1BF) are each within the SD the figure prints, and S1TJ
    and M1TJ exceed ALM and S1BF. With folds that keep each trial in one fold, 0.551, 0.392, 0.087
    and 0.016, same order. Decoding L with spikes shifted by 25 to 100 ms lowers R2 in S1TJ.
  deviations:
  - The inter-lick-interval standardisation of the Methods is not applied before the fits.
  - Fits use scikit-learn's elastic net path (l1 ratio 0.1, 30 penalties, standardised
    predictors, one-SE rule), not MATLAB's lasso; samples are assigned to folds at random, as
    MATLAB does by default. Random folds let the autocorrelation within a trial into the test
    folds; R2 values are higher than with folds that keep trials together, the orderings the same.
  - The fitting window is -0.5 to 0.5 s from the middle touch, read from the Methods' remark that
    0.5 to 0.8 s of the decoding was new data; the paper does not state it.
  - The expected values were read from the figure image, as the text does not give them.
