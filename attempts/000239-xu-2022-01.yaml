findings:
- kind: metadata_insufficient
  statement: The opto sessions do not name the inhibited region; 35 sessions at 4 mW and 25 at 2 mW,
    five per mouse, carry only the light times and LED drive. Figure 2 and Extended Data Fig. 3j-m
    cannot be tested.
- kind: metadata_insufficient
  statement: The control sessions do not mark the condition; which earplug session had earplugs,
    which half of each air session had the air flow on, and which numbing session was lidocaine
    are not stated.
- kind: metadata_insufficient
  statement: The recorded area and the kind of session are given only by the session description
    (the name of the lab's data folder); there is no electrodes table, unit location, depth or
    quality label, and the area of the zigzag (ZZ) and "ephys others" sessions is not given.
- kind: data_missing
  statement: Spike waveforms are not included, so units cannot be classified as putative pyramidal
    or FS cells (Extended Data Fig. 3c-f), and the fibre distance of the efficiency recordings is
    not given.
- kind: format_error
  statement: 1446 spike times in 35 files are duplicated within a unit, away from trial boundaries
    (median 2.9 s). The Methods say these Phy duplicates were removed before analysis; the
    deposited spike times keep them.
- kind: other
  statement: One training recording is deposited twice; the MX181003 learning file of 2018-10-02
    15:30:57 repeats all 4028 touches of the MX181002 file with the same start time and then
    continues, so it is unclear which mouse it belongs to.
- kind: format_error
  statement: In the 574 learning files start_time and stop_time count from 0 while cue, touch,
    port and water times are on another clock (around 10^6 s), so trial intervals and events do
    not line up.
- kind: format_error
  statement: The seqId column of the learning files holds the text of an unconverted MATLAB
    categorical object, not a sequence identity.
- kind: metadata_insufficient
  statement: Force sensor and lick port series are in volts without a calibration, tongue landmarks
    are in pixels without a scale (the Methods give 32 um per pixel), and every trial column is
    described as "no description".
- kind: selection_undocumented
  statement: The Methods leave out 8 sessions whose touch offsets were not registered; the files
    do not mark them. Eight sessions with backtracking have touches of a few ms (5th percentile 3
    to 7 ms), and leaving them out gives the paper's 47 sessions.
- kind: methods_unavailable
  statement: The paper says its MATLAB analysis code is available at GitHub but gives no address,
    and no repository was found under the authors' accounts.
