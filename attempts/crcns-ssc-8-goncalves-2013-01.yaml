- claim: fig2b-peak-frequency
  outcome: reproduced
  notebook: reproduce_goncalves_2013.ipynb
  output: claim:fig2b-peak-frequency
  measured: [0.060, 0.054]
  notes: P14-16, 10 KO and 8 WT mice. No reading finds a difference (p = 0.13 to 0.64). Under R-a
    (active when the rate is above 0) both means are within the paper's s.e.m. with either shuffle;
    with S-a (given as measured) KO 0.060 +/- 0.006 and WT 0.054 +/- 0.007 peaks per s, p = 0.52; with
    S-b 0.061 and 0.057, p = 0.64. Under R-b (at least one estimated spike in the frame) events are
    rarer, 0.016 to 0.027 per s, outside the tolerances. Thresholds under R-a are 23 to 37.5% of
    cells active. At 4 Hz the frequencies rise by 2.6% and the tests do not change.
  deviations:
  - 8 WT mice, against 10 in the text (and 9 in Fig. 1e).
  - The definition of an active cell and the shuffle are not given in the paper; all four readings of
    the claims file were run and give the same outcome. The shuffle seeds are a standard choice.
