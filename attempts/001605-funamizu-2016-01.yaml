findings:
- kind: data_missing
  statement: >-
    The dandiset holds only the 94 imaging sessions. The muscimol experiment (three further mice, muscimol and PBS
    sessions, Fig. 1d-g and Supplementary Fig. 2) and the sound-mapping trials recorded before each imaging session
    (Supplementary Fig. 4) are not in it, and the paper's data page names no other deposit. Six claims cannot be
    tested.
- kind: metadata_error
  statement: >-
    The description says the files hold "sound on/off indicators", and sound_on_off is described as "any speaker
    on". In every file sound_on_off and speaker_on_matrix are on only in the first frame of each trial (150 frames),
    and every speaker_presentations row lasts one frame at a trial start (6 to 26 rows per trial start, one per
    speaker listed). The task sound of the continuous and intermittent conditions is not recorded, so sound and
    no-sound zones must be computed from the condition and distance.
- kind: metadata_insufficient
  statement: >-
    Licking is stored as lick_rate, "Lick frequency (0-10 Hz)", a held 1/inter-lick-interval value capped at 10
    Hz, without lick times or a description of how it was derived. Lick counts and first licks can only be approximated
    from it.
- kind: other
  statement: >-
    Each trial record runs from one start tone to the next, so it holds the reward and the inter-trial interval;
    the goal time and the first reward edge are not stored per trial and must be derived from the position and reward
    series. The mean time from the start tone to the reward is 9.30 s (s.e.m. 0.11 s over sessions), against 7.4
    +- 0.1 s in the Methods, and 0.48% of trials take over 20 s, against 2.71%.
- kind: other
  statement: >-
    The files hold exactly the paper's counts (94 sessions, 8 mice, sessions per area and layer, 41,031 ROIs per
    area and layer equal to the active-neuron counts) and dF_over_F equals (R - mean R)/mean R of RawFluorescence
    to 3e-5, as the Methods define dR/R. No recording is deposited twice (94 distinct trial sequences).
- kind: methods_unavailable
  statement: >-
    For the paper's authors. The baseline of the task-relevance t-test is not given. Zero (the session mean of R)
    and the mean dR/R of the inter-trial intervals give different neuron classes (PPC layer 2 goal-distance neurons
    1,353 against 1,650) and different outcomes for fig2d-after-vs-before, fig2d-layer-distance-preference, supp8a,
    supp8b and supp8c, which are blocked. Under zero, 91 of 94 sessions have goal-distance neurons, as the paper
    reports; under the inter-trial baseline, 94. Which baseline was used, and was k-means run per session or pooled?
- kind: methods_unavailable
  statement: >-
    For the paper's authors. The chance level of Fig. 4b, the bin width of the per-trial values of Fig. 4c-e, and
    the borders of the before-reaching groups of Supplementary Fig. 9 are not given. The two chance readings and
    the two bin widths give different outcomes for fig4-above-chance and fig4d-map-near-goal, which are blocked.
    For Supplementary Fig. 9, equal quarters of 67 to 0 cm give two comparisons where PM is better preserved and
    the zone borders give none. Which coefficient of the distance fit is compared in "fitted coefficients ... were
    similar between PPC and PM", and over which frames were the regressions fitted (to the goal or past it)? The
    readings disagree on that claim, which is blocked.
- kind: other
  statement: >-
    With the decoder as described, a Gaussian likelihood gives lower RMSE than the log-normal one in 15 to 18 of
    18 settings, contrary to the Methods' statement, and PPC layer 3 MAP slopes in intermittent 1 near the goal
    are not steeper than layer 2. These may come from details of the decoder the Methods leave open (the positive
    shift, the decoded range).
