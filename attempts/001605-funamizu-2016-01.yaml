- claim: supp6-distance-not-sound
  outcome: partially_reproduced
  notebook: reproduce_funamizu_2016.ipynb
  output: claim:supp6-distance-not-sound
  notes: >-
    Distance has the lower RMSE with P < 0.05 in 23 of 24 comparisons under every reading (frames O6 a and b, sound
    readings a and b, all four classification readings). The exception is PM layer 5 after-reaching neurons against
    Step (P = 0.11, n = 76 under O1 a). The criterion's partial threshold is 20. Differences of median RMSE are
    below 0.002 dR/R.
  deviations:
  - >-
    The free width is profiled over a grid of 25 log-spaced values from 0.5 to 200 (cm or dB), with the linear coefficients
    fitted by least squares at each, and refined by a bounded scalar optimizer of the log width between the neighbouring
    grid values, in place of an optimizer from four initial values (Online Methods, Regression analysis). The basis
    centre is the value of the variable at the peak of the neuron's activity averaged in 0.42 cm (1 dB for Sound)
    bins and smoothed over 20 bins (3 for Sound).
  - >-
    Sound intensity follows the Methods (100 dB SPL at 25 cm, 6 dB lower per doubling); Step holds the goal distance
    on entering each no-sound zone. Zones are computed from the condition and distance, as the files hold no task
    sound.
