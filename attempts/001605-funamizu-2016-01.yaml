- claim: behaviour-timing
  outcome: not_reproduced
  notebook: reproduce_funamizu_2016.ipynb
  output: claim:behaviour-timing
  measured:
  - 9.299
  - 1.009
  notes: >-
    Start tone (first frame of the trial record) to the first reward edge, 9.30 s, s.e.m. 0.11 s over 94 sessions
    (session means 7.39 to 12.66 s), against 7.4 +- 0.1 s. To reaching the goal 9.18 s; from the end of the 970
    ms start tone 8.33 s. Time per no-sound zone 1.009 +- 0.020 s under reading (a) and 0.896 +- 0.016 s under reading
    (b), against 0.86 +- 0.01 s. Both parts fail under every reading. Over all analysed trials the median is 8.83
    s and 22.1% of trials are under 7.4 s; every frame series in every file stores a rate of 30.9 Hz, the rate used,
    and trial start times step by the trial's frames at that rate. Trials over 20 s to reward are 0.48% per session,
    against 2.71% in the paper; with longer times to reward the data still have fewer slow trials, so the difference
    does not come from the exclusion.
  deviations:
  - >-
    The trial start is taken as the first frame of each trial record, where sound_on_off marks the start tone; the
    paper does not say from which event its 7.4 s is measured.
- claim: lick-goal-correlation
  outcome: not_reproduced
  notebook: reproduce_funamizu_2016.ipynb
  output: claim:lick-goal-correlation
  measured:
  - 0.218
  - 0.822
  notes: >-
    Pearson r (reading a) is positive with P < 0.01 in all 94 sessions (largest P 0.0079) and spans 0.218 to 0.822;
    the upper value matches the paper's 0.822, but two sessions (0.218 and 0.227) fall below the criterion's lower
    bound of 0.232. Spearman (reading b) gives 5 sessions with P >= 0.01 and r from 0.151. The criterion is not
    met under either reading. The onset variants do worse, the first non-zero frame ('any') r from 0.003 and the
    first rise from 0 Hz ('bout') 6 sessions with P >= 0.01. The lick frequency is non-zero at the frame passing
    33 cm in a median 22% of trials per session (2 to 90%), and a value below the cap is held for a median of 4
    frames, so only a change of the value marks a new lick; the 'change' onset is the reading the data support.
  deviations:
  - >-
    The files hold a lick frequency (1/inter-lick interval, capped at 10 Hz, held between licks), not lick times.
    The first lick is the first frame beyond 33 cm from the start where this frequency changes to a non-zero value
    or stays at the cap. Two variants are shown, the first frame of non-zero frequency beyond 33 cm and the first
    rise from 0 Hz beyond 33 cm.
- claim: fig1c-licking-without-sound
  outcome: reproduced
  notebook: reproduce_funamizu_2016.ipynb
  output: claim:fig1c-licking-without-sound
  notes: >-
    One-sided signed-rank tests over 94 sessions; the four no-sound comparisons rise with z = 7.37 and 5.79 (intermittent
    1, 29.4-25.2 and 4.2-0 cm) and 6.32 and 5.41 (intermittent 2, 21.0-16.8 and 12.6-8.4 cm), all P < 1e-7; the
    four continuous comparisons z = 7.42 to 8.42. All other comparisons also rise with P < 0.01 (intermittent 2
    at 29.4-25.2 cm, P = 0.0007). Five of eight mice rise in all four no-sound comparisons by their session medians.
  deviations:
  - >-
    Lick counts per bin are the integral of the lick frequency over the frames in the bin (the files hold no lick
    times). Bin edges are multiples of 4.2 cm from the goal, as the criterion says; the bins are labelled 29.4-25.2
    cm where the claims file writes 29.3-25.1.
