- claim: fig4-above-chance
  outcome: reproduced
  assumed: true
  notebook: reproduce_funamizu_2016.ipynb
  output: claim:fig4-above-chance
  notes: >-
    Decoder RMSE is below the flat prior's in all 18 settings under all eight classification and
    shift readings (z -88 to -366, P = 0). Against decoders trained on distances permuted across
    trials (chance reading b), 17 of 18 settings are lower in six readings and 18 of 18 in two;
    under O1 a and shift 0.01 the exception is PPC layer 3 in intermittent 1 (z = +13.6).
  deviations:
  - >-
    Assumption. Chance is not defined and the readings disagree. Reading (a), the flat prior's
    RMSE, is adopted, since the decoder's prior is flat; reading (b) keeps the fall of distance
    within every trial, so its decoder still decodes distance (median RMSE within 1 cm of the
    real decoder in every setting of the main reading) and does not measure chance.
  - >-
    Decoder details from the claims file and Methods; the positive shift (O7) is run at 0.01 and
    0.1. Frames are those from the start to the goal with goal distance 67.2 to 0 cm.
