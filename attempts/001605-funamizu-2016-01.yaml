- claim: neuron-classes
  outcome: not_reproduced
  notebook: reproduce_funamizu_2016.ipynb
  output: claim:neuron-classes
  measured: [1353, 1292, 555, 659, 512, 158, 942, 1061, 431, 225, 228, 76]
  notes: >-
    Under O1 a (baseline zero) and either O3 reading, 2 of 12 counts are within 10% (PM layer 2
    and 3 goal-distance neurons, 659 and 512); the others are 12 to 41% above the paper's. Under
    O1 b none is within 10% (goal-distance 1,650, 1,402, 775, 961, 738, 304). O3 changes no count
    by more than 3. Values recorded are O1 a, O3 a. The order of the groups is the paper's (PPC
    above PM, layer 5 lowest). Per session the goal-distance neurons average 79.6, 86.1, 39.6,
    41.2, 34.1 and 9.3 (paper 65.6, 70.3, 34.5, 37.6, 31.9, 7.59). By mouse the share of
    goal-distance neurons ranges from 1.4% (mouse2) to 25.6% (mouse3).
  deviations:
  - >-
    k-means (two clusters) is run once on the after-reaching group pooled over all sessions, with
    seed 0 and 20 starts; the paper does not say whether it clustered per session.
  - >-
    The inter-trial interval of baseline O1 b is the last 7 s of each trial record, from the
    Methods' "The inter-trial interval (ITI) was 7 s"; the records run 7.9 to 8.2 s past the
    reward.
  - >-
    Distance-aligned activity is interpolated at 0.42 cm bin centres between the frames from the
    start to the goal (a standard choice; most 0.42 cm bins hold no frame at the mice's speeds).
    Moving averages are 15 frames (500 ms) and 20 bins (8.4 cm).
