- claim: supp9-preserved-representation
  outcome: reproduced
  assumed: true
  notebook: reproduce_funamizu_2016.ipynb
  output: claim:supp9-preserved-representation
  notes: >-
    Under O1 a and groups (a), in intermittent 1 PPC after-reaching neurons have the smaller
    absolute change of distance preference than PM in all three layers (P < 0.05) and PM is
    significantly smaller in none of 30 comparisons. With groups (b) one comparison of 30 favours
