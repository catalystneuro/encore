- claim: supp9-preserved-representation
  outcome: not_reproduced
  notebook: reproduce_funamizu_2016.ipynb
  output: claim:supp9-preserved-representation
  notes: >-
    Changed by the reader's answer (questions/001605.yaml). The first run tested absolute differences and was reproduced
    under the assumptions O1 a and groups (a). The amended criterion tests the signed difference, continuous minus
    intermittent, judges the area whose median is nearer zero, and needs both group readings. In intermittent 1
    after-reaching neurons differ with P < 0.05 in layers 2 and 3 (P = 0.0066 and P < 1e-5) with the PPC median
    nearer zero (-2.10 against -5.04 cm and -2.52 against -6.30 cm); layer 5 does not differ (P = 0.20). With groups
    (b) none of 9 significant comparisons has the PM median nearer zero; with groups (a) 2 of 10 do, the layer 3
    before-reaching groups of intermittent 1 at 67-50.25 cm (PPC 2.52, PM 0.00 cm, P = 0.013) and 50.25-33.5 cm
    (-9.24 and -1.89 cm, P = 0.037). The criterion fails under groups (a), and so under every O1 and O3 reading;
    the after-reaching part holds under all, and in the groups nearest the goal every significant comparison has
    PPC nearer zero; the criterion has no partial outcome. The absolute-difference variant, not judged, has PPC
    after-reaching smaller in all three layers and PM significantly smaller in 0 of 30 comparisons (groups a) and
    1 of 30 (groups b) under O1 a. No assumption decides the outcome now, since the criterion takes both group readings
    and the O1 readings agree.
  deviations:
  - >-
    Distance preference per condition is the peak of the condition's trial-averaged 0.42 cm trace after the 8.4
    cm moving average.
