- claim: fig2d-after-vs-before
  outcome: reproduced
  assumed: true
  notebook: reproduce_funamizu_2016.ipynb
  output: claim:fig2d-after-vs-before
  notes: >-
    Under O1 a (adopted), PPC has more after- than before-reaching neurons in layers 2, 3 and 5
    (counts P = 0.0086, 0.0038, 0.011; proportions 0.0086, 0.0038, 0.0060), PM layer 2 has more
    before-reaching neurons (P = 0.0038 counts, 0.0045 proportions) and PM layers 3 and 5 do not
    differ (P 0.39 to 0.64). Under O1 b, PPC does not differ in any layer (P 0.07 to 0.52) and
    PM has more before-reaching neurons in all three layers (P <= 0.0013), so the claim fails
    there.
  deviations:
  - >-
    Assumption. The baseline of the task-relevance t-test (O1) is open and the readings disagree.
    Reading (a), zero, is adopted for every claim that uses the classification. dR/R is defined
    against the session mean of R, so zero is its reference, and under (a) 91 of 94 sessions have
    goal-distance neurons, the paper's count ("sessions with 0 goal-distance neurons (3 sessions
    of 94) were excluded", Online Methods, Probabilistic decoding), while (b) gives 94 of 94. The
    counts of neuron-classes are also nearer the paper's under (a). Both readings are shown.
- claim: fig2d-layer-distance-preference
  outcome: reproduced
  assumed: true
  notebook: reproduce_funamizu_2016.ipynb
  output: claim:fig2d-layer-distance-preference
  notes: >-
    Under O1 a, layer 3 and layer 5 goal-distance neurons prefer distances nearer the goal than
    layer 2 in PPC (z = 7.93 and 4.59, P < 1e-5) and PM (z = 4.19, P = 2e-5; z = 2.61,
    P = 0.0083). Layer 3 against 5 does not differ (PPC P = 0.13, PM P = 0.85). Under O1 b PM
    layer 5 does not differ from layer 2 (P = 0.38), so the claim fails there.
  deviations:
  - Assumption O1 a, as in fig2d-after-vs-before.
  - >-
    Distance preference is the goal distance of the peak of the smoothed distance-aligned
    average over 67.2 to 0 cm (O4).
- claim: fig3b-distance-over-time
  outcome: blocked
  blocked_by: too_large
  notes: >-
    The regression fits up to three Gaussian bases with free widths, for 11 variable sets and four
    initial values, to every frame of 150 trials. A nonlinear least-squares fit of this form on
    45,000 frames took 0.23 s (timed outside the notebook, on synthetic data of the same size),
    so 44 fits per neuron for about 5,000 goal-distance neurons need about 14 h, and 56 h over the
    four readings of O6. Not run.
- claim: supp6-distance-not-sound
  outcome: partially_reproduced
  notebook: reproduce_funamizu_2016.ipynb
  output: claim:supp6-distance-not-sound
  notes: >-
    Distance has the lower RMSE with P < 0.05 in 23 of 24 comparisons under every reading (frames
    O6 a and b, sound readings a and b, all four classification readings). The exception is PM
    layer 5 after-reaching neurons against Step (P = 0.10, n = 76 under O1 a). The criterion's
    partial threshold is 20. Differences of median RMSE are below 0.002 dR/R.
  deviations:
  - >-
    The free width is profiled over a grid of 25 log-spaced values from 0.5 to 200 (cm or dB),
    with the linear coefficients fitted by least squares at each, in place of an optimizer from
    four initial values (Online Methods, Regression analysis). The basis centre is the value of
    the variable at the peak of the neuron's activity averaged in 0.42 cm (1 dB for Sound) bins
    and smoothed over 20 bins (3 for Sound).
  - >-
    Sound intensity follows the Methods (100 dB SPL at 25 cm, 6 dB lower per doubling); Step holds
    the goal distance on entering each no-sound zone. Zones are computed from the condition and
    distance, as the files hold no task sound.
- claim: tuning-similar-ppc-pm
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_funamizu_2016.ipynb
  output: claim:tuning-similar-ppc-pm
  notes: >-
    The readings disagree, and the criterion directs a block. With frames O6 a, PPC and PM differ
    in the width s in all three layers (P 2e-12 to 0.03) and in b1 in layers 3 and 5 under every
    classification reading. With frames O6 b and O1 a the widths do not differ (P 0.095 to 0.22),
    while b1 differs in all three layers (P 5e-10 to 0.008). Open for the authors which coefficient
    the comparison used and over which frames the fits ran (finding below).
  deviations:
  - >-
    The fit is the distance-only set of equation (2), y = b0 + b1 phi(distance), with the width
    profiled over a grid as in supp6-distance-not-sound.
