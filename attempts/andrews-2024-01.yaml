outcomes:
- claim: table1-cohort
  outcome: partially_reproduced
  notebook: reproduce_andrews_2024.ipynb
  output: claim:table1-cohort
  notes: The 69 files resolve, by their names, to 12 slices named as in Table 1 (1A to 12G) from 7
    patients (A to G), 5 female and 2 male, aged 20 to 52, each patient's age and sex as in Table 1.
    The 8 HcKCR1 slices of Table 2 are present by name. The opsin of a slice is recorded neither in
    the files nor in the dandiset metadata, so the third expected value (8 HcKCR1 slices) cannot be
    measured from the dandiset; it follows only from reading the slice names against the paper's
    Table 1. Every object under general/ of every file was read; it holds the devices, the electrode
    table, experiment_description (the paper's title), institution, lab, source_script and the
    subject's age, sex, species and subject_id, with no virus, pharmacology, protocol, notes,
    optogenetics or genotype field and no opsin or virus word. Of the criterion's conditions,
    slices, patients, ages and sexes hold (checked against Table 1 in the notebook) and the opsins
    cannot be resolved, which is read here as partial.
  assumed: true
  deviations:
  - Assumed reading of the criterion's partial clause. "Present and identifiable" is read as present
    and identifiable by name, the slice names of the files matching those of Table 1 and Table 2, as
    no file or metadata field names a slice's opsin. Under a reading that requires each HcKCR1 slice
    to be identified as HcKCR1 from the dandiset itself, neither clause of the criterion holds.
  - Slices and patients are taken from the file and subject names (`3C-7` is recording 7 of slice
    3C of patient C); `subject_id` itself names the recording, not the patient or slice.
