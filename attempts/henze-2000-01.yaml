- claim: notch-and-ahp-landmarks
  outcome: not_reproduced
  notebook: reproduce_henze_2000.ipynb
  output: claim:notch-and-ahp-landmarks
  notes: Of 20 pyramidal tetrode cells, a notch (local minimum of the extracellular first derivative between
    the negative and the late positive peak) is found in 9 at 5% prominence (4 to 11 at 2% to 10%), and
    agrees with the intracellular peak within 0.2 ms in at most 4, under every reading. A slope change
    after the late positive peak (the first local maximum or minimum of the second derivative) is found
    in all 20 cells but lies within 0.2 ms of the AHP peak as the criterion defines it in at most 1. That
    AHP peak (the minimum within 5 ms of the return to threshold) is at the end of its window in 5 of
    20 cells; with the first fast AHP trough as a variant, 0 or 1 of 12 or 13 cells agree.
  deviations:
  - The prominence for a local extreme to count (5%, shown at 2% and 10%) is a choice made here; the paper
    gives no detection rule.
