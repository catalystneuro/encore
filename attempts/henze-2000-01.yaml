- claim: fig7-vertical-spread
  outcome: not_reproduced
  notebook: reproduce_henze_2000.ipynb
  output: claim:fig7-vertical-spread
  notes: Of 10 silicon-probe pyramidal cells with a site order, the spike is present (above 2 SD)
    100 um or more from the soma site in 3; of the 4 whose order the spreadsheet lists, in 1.
    Amplitude, maximal rise slope and maximal decay slope fall with distance from the soma site
    (Spearman below 0) in 9 of 10 (4 of 4), so that part of the claim holds. Six-site shanks span
    125 um, and the soma site is at an end of the shank in 4 of the 10 cells.
  deviations:
  - The files hold 1 Hz to 5 kHz, where the Fig. 7 legend gives 1 Hz to 10 kHz; the band as
    recorded is used.
  - For the files with six extracellular channels (D172 to D189) the spreadsheet's site order
    names channels up to 10; the order used is the listed channel divided by two, an assumption
    supported by the smooth amplitude profiles it gives. The outcome is the same without these
    cells.
  - The second shank of the 12-channel files is the listed shank shifted by one channel where that
    gives exactly the remaining channels (descriptor, "in a similar way"); for D157 it does not,
    and only the listed shank is used.
- claim: propagation-velocity-range
  outcome: blocked
  blocked_by: data_missing
  notebook: reproduce_henze_2000.ipynb
  output: claim:propagation-velocity-range
