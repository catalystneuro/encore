- claim: sample-cells
  outcome: not_reproduced
  notebook: reproduce_henze_2000.ipynb
  output: claim:sample-cells
  measured:
  - 21
  - 21
  - 21
  - 0
  notes: The data set holds 39 cell folders, 21 recorded with a wire tetrode (D53 to D151) and 18
    with the two-shank silicon probe (D156 to D189). The 21 tetrode cells are outside 33 +/- 3.3.
    All 21 have a resting potential below -55 mV (kept count 21, within 22 +/- 2.2). No tetrode
    cell has a cell type label, so the interneuron count from the data set's labels is 0 where 1
    is expected, and the 21 pyramidal cells are simply the kept cells without a label. No folder
    has a single extracellular channel, so no single-wire case was found. Whether these 21 are the
    paper's analysed cells the data set does not say.
  deviations:
  - Resting potential is the median membrane potential outside current steps, the median over a
    cell's files, with the intracellular scale of the descriptor's typical gain of 50; labelling
    cannot be checked from recordings.
- claim: fig1c-start-end-timing
  outcome: not_reproduced
  notebook: reproduce_henze_2000.ipynb
  output: claim:fig1c-start-end-timing
  measured:
  - -0.074
  - 0.192
  notes: Eight somatic tetrode cells qualify (the paper has 11). Over the 16 readings (O2 x O4) the
    mean start lead ranges from -0.174 to +0.161 ms and is never within 0.01 +/- 0.02 ms; the end
    lead is within 0.02 +/- 0.14 ms under 6 readings. Measured values are those of the first
    reading (all spikes, dV/dt start, 2 SD start, return to threshold). The files are sampled at
    10 or 20 kHz, a step of 0.1 or 0.05 ms, so a start difference of 0.01 +/- 0.02 ms cannot be
    resolved from single samples; the averaged waveforms were interpolated to a 5 us grid.
  deviations:
  - 8 somatic cells, where the paper has 11. Somatic and dendritic are classified by the paper's
    rule (Results, "lack of a fast afterhyperpolarization and/or an action potential peak value
    <0 mV") applied to each cell's averaged AP, as the data set records no site for these cells.
  - The intracellular channel of each file is chosen from the data (the non-extracellular channel
    with a membrane potential below -30 mV and the most APs), following the descriptor's advice to
    find the channel with intracellular spikes; only 5 folders name it.
  - AP detection follows the Methods (peaks of the first derivative, the peak where it crosses
    zero); the threshold (10 V/s and 8 robust SD) is a standard choice (claims file, O1).
  - Extracellular channels are low-pass filtered at 3 kHz (zero-phase Butterworth), as the files
    hold 1 Hz to 5 kHz (descriptor) and the paper reports 1 Hz to 3 kHz (Results, Fig. 1C legend).
- claim: ap-duration-match
  outcome: reproduced
  notebook: reproduce_henze_2000.ipynb
  output: claim:ap-duration-match
  measured:
  - 1.382
  - 1.281
  notes: Both mean durations are within tolerance under 6 of 16 readings; the first in the
    criterion's order (all spikes, intracellular start at the maximal second derivative,
    extracellular start within 2 SD of baseline noise, intracellular end at return to the pre-start
    baseline) gives 1.382 ms and 1.281 ms over 8 somatic cells. With the dV/dt start and the end at
    return to threshold the intracellular duration is 1.547 ms (all spikes) and 1.453 ms
    (spontaneous spikes); the extracellular duration is within tolerance under every reading
    (1.197 to 1.281 ms).
  deviations:
  - The same cells, readings and methods as fig1c-start-end-timing.
- claim: duration-correlation
  outcome: partially_reproduced
  notebook: reproduce_henze_2000.ipynb
  output: claim:duration-correlation
  measured: 0.759
  notes: With all spikes, intracellular and extracellular durations are positively related with
    P < 0.03 under 4 of 8 readings (R 0.759 to 0.945, n = 8), but no reading gives R within 0.594
    to 0.726 with P < 0.03; the one reading with R in tolerance (0.644) has P = 0.085. With
    spontaneous spikes no reading reaches P < 0.03 (R 0.27 to 0.51). The measured value is the
    first reading with P < 0.03 in the criterion's order.
  deviations:
  - 8 cells, where the paper has 11.
- claim: neg-peak-precedes-intra-peak
  outcome: reproduced
  notebook: reproduce_henze_2000.ipynb
  output: claim:neg-peak-precedes-intra-peak
  measured: 0.207
  notes: Over 8 somatic tetrode cells the extracellular negative peak (largest channel) precedes the
    intracellular AP peak by 0.207 +/- 0.094 ms with all spikes and 0.208 +/- 0.101 ms with
    spontaneous spikes (0.005 to 0.33 ms per cell). Per-channel values of each cell are close to its
    largest channel's.
  deviations:
  - The negative peak is the most prominent trough of the averaged extracellular trace between
    -1 and +0.6 ms from the AP peak, a window chosen here.
- claim: fig1c-derivative-mismatch
  outcome: reproduced
  notebook: reproduce_henze_2000.ipynb
  output: claim:fig1c-derivative-mismatch
  notes: Reading (b), the negative derivative going from its negative to its positive peak faster
    than the extracellular spike, holds in 7 of 8 somatic cells with all spikes and with
    spontaneous spikes. Reading (a), a higher correlation with the scaled derivative over the
    rising than the falling phase, holds in 6 of 8 (all spikes) and 5 of 8 (spontaneous).
- claim: notch-and-ahp-landmarks
  outcome: not_reproduced
  notebook: reproduce_henze_2000.ipynb
  output: claim:notch-and-ahp-landmarks
  notes: Of 20 pyramidal tetrode cells, a notch (local minimum of the extracellular first
    derivative between the negative and the late positive peak) is found in 9 at 5% prominence (4
    to 11 at 2% to 10%), and agrees with the intracellular peak within 0.2 ms in at most 4, under
    every reading. A slope change after the late positive peak is found in all 20 cells but lies
    within 0.2 ms of the AHP peak as the criterion defines it in at most 1. That AHP peak (the
    minimum within 5 ms of the return to threshold) is often at the end of its window (the slow
    AHP); with the first fast AHP trough as a variant, 0 or 1 of 12 or 13 cells agree.
  deviations:
  - The prominence for a local extreme to count (5%, shown at 2% and 10%) is a choice made here;
    the paper gives no detection rule.
- claim: fig2-interneuron-narrow
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: The basket cell of Fig. 2 is a tetrode recording. None of the 21 tetrode folders has a cell
    type; the spreadsheet covers only 2 of them and labels neither an interneuron. Its only
    interneuron, D17212, is a silicon-probe recording. Choosing the interneuron by its narrow
    spike would assume the finding.
- claim: fig3b-latency-vs-amplitude
  outcome: reproduced
  notebook: reproduce_henze_2000.ipynb
  output: claim:fig3b-latency-vs-amplitude
  notes: Over 20 pyramidal tetrode cells (8 somatic, 12 dendritic by the paper's rule) latency falls
    with AP amplitude under all 8 readings (Pearson r -0.698 to -0.712, P 0.0004 to 0.0006;
    Spearman -0.529 to -0.592, P 0.006 to 0.016), and the dendritic median latency exceeds the
    somatic one (0.295 against 0.2025 ms, all spikes; 0.280 against 0.1975 ms, spontaneous).
  deviations:
  - 20 cells, as in the Fig. 3B legend, but 8 somatic and 12 dendritic where the paper has 11 and 9;
    the site is classified from the averaged AP by the paper's rule.
- claim: fig3a-example-pair
  outcome: blocked
  blocked_by: metadata_insufficient
  notebook: reproduce_henze_2000.ipynb
  output: claim:fig3a-example-pair
  notes: The data set records no depth or track for the tetrode cells, so the pair cannot be
    identified. Reading the folder names as animal, track and cell (an inference; the descriptor
    does not explain them), two candidates have a somatic cell followed by a dendritic one, D11221
    then D11222 (latencies 0.250 and 0.975 ms) and D13521 then D13522 (0.210 and 0.245 ms).
    Neither matches 0.28 and 0.55 ms within tolerance.
- claim: fig3c-backprop-velocity
  outcome: not_reproduced
  notebook: reproduce_henze_2000.ipynb
  output: claim:fig3c-backprop-velocity
  measured: 0.474
  notes: No reading gives a velocity within 1.61 +/- 0.161 m/s (0 of 24 combinations of spikes,
