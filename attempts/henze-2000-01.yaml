    files, with the intracellular scale of the descriptor's typical gain of 50; labelling cannot be checked
    from recordings.
- claim: fig1c-start-end-timing
  outcome: not_reproduced
  notebook: reproduce_henze_2000.ipynb
  output: claim:fig1c-start-end-timing
  measured:
  - -0.023
  - 0.64
  notes: Thirteen somatic tetrode cells qualify under rule S3 (the paper has 11). Over the 16 readings
    (O2 x O4) the mean start lead ranges from -0.190 to +0.270 ms and is never within 0.01 +/- 0.02 ms;
    the end lead is within 0.02 +/- 0.14 ms under 4 readings. Under rules S1, S2 and S4 (8, 14 and 9 cells)
    no reading puts the start lead in tolerance either, so the outcome does not depend on the rule. Measured
    values are those of the first reading (all spikes, dV/dt start, 2 SD start, return to threshold).
    The files are sampled at 10 or 20 kHz, a step of 0.1 or 0.05 ms, so a start difference of 0.01 +/-
    0.02 ms cannot be resolved from single samples; the averaged waveforms were interpolated to a 5 us
    grid.
  deviations:
  - 13 somatic cells, where the paper has 11. Somatic and dendritic are classified from each cell's averaged
    AP by the paper's rule (Results, "lack of a fast afterhyperpolarization and/or an action potential
    peak value <0 mV") with a 10 mV allowance for the electrode offset (rule S3), an assumption. The data
    set gives the offset for 2 of the 21 tetrode cells, and the rule applied to uncorrected potentials
    (S1) calls D53, the somatic cell of the Fig. 1 legend, dendritic. S3 gives 13 somatic and 7 dendritic
    of the 20 tetrode cells with a spike (paper 11 and 9). Every timing claim is also shown under S1 (8
    somatic), S2 (fast AHP only, 14) and S4 (peak only, 9).
  - The intracellular channel of each file is chosen from the data (the non-extracellular channel with
    a membrane potential below -30 mV and the most APs), following the descriptor's advice to find the
    channel with intracellular spikes; only 5 folders name it.
  - AP detection follows the Methods (peaks of the first derivative, the peak where it crosses zero);
    the threshold (10 V/s and 8 robust SD) is a standard choice (claims file, O1).
  - Extracellular channels are low-pass filtered at 3 kHz (zero-phase Butterworth), as the files hold
    1 Hz to 5 kHz (descriptor) and the paper reports 1 Hz to 3 kHz (Results, Fig. 1C legend).
  - The extracellular negative peak is the most prominent trough from -2 to +0.6 ms around the AP peak,
    and the baseline ends 1 ms before it (hc1.NEG_WIN, hc1.base_window), windows chosen here; the -1 ms
    start of the first round cut off the troughs of some dendritic recordings and changes no tetrode cell's
    latency.
