  notes: The data set holds 39 cell folders, 21 recorded with a wire tetrode (D53 to D151) and 18 with
    the two-shank silicon probe (D156 to D189). The 21 tetrode cells are outside 33 +/- 3.3. All 21 have
    a resting potential below -55 mV (kept count 21, within 22 +/- 2.2). No tetrode cell has a cell type
    label, so the interneuron count from the data set's labels is 0 where 1 is expected, and the 21 pyramidal
    cells are simply the kept cells without a label. No folder has a single extracellular channel, so
    no single-wire case was found. Every tetrode folder passes the -55 mV rule and Fig. 6A labels a cell
    D107 that has no folder, so the deposit looks like a selection of the paper's cells that the data
    set does not describe.
  deviations:
