findings:
- kind: data_missing
  statement: The data set holds only the anesthetized recordings. The behaving-animal recordings the paper
    re-examines (Figures 5 and 8 and, by its counts, the propagation velocities) and the histological
    tetrode-to-soma distances (Figure 6) are not in it, and the paper names no other archive for them.
    Seven of the paper's 21 claims are blocked for this reason.
- kind: metadata_insufficient
  statement: The per-cell spreadsheet IntraExtra.xls covers 18 of the 39 cells and only 2 of the 21 tetrode
    cells (D14521, D14921). For the other 19 there is no cell type, no somatic or dendritic impalement
    site, no resting potential, no electrode offset and no depth, so the paper's interneuron, its somatic
    and dendritic groups and its Fig. 3A pair cannot be identified from the data set. Without the offsets
    the paper's rule for dendritic recordings (AP peak below 0 mV) cannot be applied as stated; on uncorrected
    potentials it calls D53, the somatic cell of the Fig. 1 legend, dendritic.
- kind: metadata_insufficient
  statement: Only 5 of 39 folders have a README naming the extracellular and intracellular channels. The
    intracellular channel moves between files of one cell (channel 5 or 6 in the D112 files), and two
    binary formats are mixed without a note, 12-bit values centred on 2048 and signed 16-bit values. The
    xml files give an amplification of 1000 for every channel, while the intracellular channel matches
    the spreadsheet's resting potentials only with the descriptor's typical gain of 50; at that gain the
    16-bit files of D128 give a resting potential near -108 mV, so their scale is uncertain.
- kind: other
  statement: The files d813101.dat and d813102.dat of D81 repeat parts of d081fre.001.dat; all 187 and
    74% of 715 of their APs fall within 1 ms of an AP of that file at a fixed offset.
- kind: format_error
  statement: d15611.001.dat and d16811.001.dat have no xml (their size fits 14 channels at 20 kHz), and
    no channel of d15611.001.dat holds intracellular APs. 19 of 169 files have no channel with a membrane
    potential and APs.
- kind: metadata_error
  statement: For the cells D172 to D189, whose files hold six extracellular channels, the spreadsheet
    column "hextrode chans" gives the site order with channel numbers up to 10, which do not exist in
    those files. The amplitude profiles are smooth if the listed channel is halved.
- kind: metadata_error
  statement: The spreadsheet's file counts and recording times disagree with the zips for several cells
    (D14921 lists 1 file where its zip holds 6), as the data set's README of April 2021 warns.
- kind: methods_unavailable
  statement: Question for the authors. Which cells and trains form the Fig. 4B and C analysis of current-evoked
    trains? The Results show one cell and give no selection. With every kept tetrode cell that has at
    least 10 steps reaching a 5th AP, 9 of 17 show all the changes the Results describe, a bare majority;
    with 20 or 50 trains 6 of 13 and 5 of 8, and with accommodating trains whose first interval is 5 to
    15 ms, 6 of 11, but 3 of 6 when the steps must also last 100 ms or more. How long were the steps?
- kind: methods_unavailable
  statement: Question for the authors. Which of the tetrode cells were somatic and which dendritic impalements,
    and what electrode offset was removed from each before the AP peak was compared with 0 mV? Applied
    to the potentials as deposited, the rule gives 8 somatic cells and calls D53 dendritic; allowing 10
    mV for the offset gives 13 and calls D53 somatic. Whether the intracellular and extracellular durations
    correlate within tolerance (R = 0.66) depends on this choice, and on D12821, a cell the 10 mV allowance
    adds, whose intracellular duration (5.7 ms) is far above the paper's 1.28 +/- 0.18 ms. Are D11221 and D11222 the two cells
    of Fig. 3A?
- kind: selection_undocumented
  statement: Every one of the 21 tetrode folders has a resting potential below -55 mV, and Fig. 6A labels
    a cell D107 for which there is no folder, so the deposit appears to be a selection of the 33 cells
    the paper recorded with a tetrode. The data set does not say which cells were deposited or why.
- kind: metadata_error
  statement: The README of D13521 gives a sampling rate of 10 kHz where its xml gives 20 kHz. At 20 kHz
    the cell's averaged AP lasts 1.350 ms from start to return to threshold, within the range of the other
    tetrode cells (median 1.653 ms), so the xml is right and the README is wrong.
- kind: metadata_insufficient
  statement: The extracellular gain is not documented per file. With the xml's amplification of 1000 the
    largest averaged spikes of D53, D11221 and D11222 are 4.3 to 6.0 times the amplitudes Fig. 6A shows
    for them (about 85, 72 and 48 uV, read from the figure), and that of D81 1.2 times; the spreadsheet's
    "gains" column ("4@5k", "6@5k") does not say which. The paper amplified 1,000 to 8,000 times.
verifications:
- date: '2026-11-09'
  kind: agent
  by: Independent agent run by CatalystNeuro (same harness, separate context, did not write the notebook)
  reviewed: Round 1. The executed notebook of the author-answers revision with the conclusion cells and
    the summary removed, the helper module and the claims file, with the paper. The verifier tested helper
    functions on synthetic inputs and checked the archive listing for the blocked claims. Of 21 claims
