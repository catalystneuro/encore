- claim: fig4bc-burst-attenuation
  outcome: reproduced
  assumed: true
  notebook: reproduce_henze_2000.ipynb
  output: claim:fig4bc-burst-attenuation
  notes: Among 17 tetrode cells (kept, extracellular spike present) with at least 10 depolarizing
    steps reaching a 5th AP, all parts of the criterion hold in 9 under reading (a) with the
    extracellular amplitude from baseline to negative peak (O7 b), with either intracellular
    amplitude; with the negative-to-positive amplitude (O7 a) in 6, and under reading (b) in at
    most 2. The amplitude parts alone hold in 12 of 17 (O7 b). The majority depends on the
    selection threshold - with at least 20 trains 6 of 13 cells, with at least 50 trains 5 of 8. In
    the silicon-probe cells all parts hold in 1 of 7. The notch was not scored.
  deviations:
  - The paper does not say which cells or trains form this analysis; a cell enters with at least 10
    steps reaching a 5th AP, a threshold chosen here (assumption; the result at 20 and 50 is shown).
  - Steps are found on the current channel (deviation from its most common value, 5 robust SD),
    and their depolarizing sign from the membrane potential during them; the descriptor gives no
    step timing.
- claim: fig4d-amplitude-correlation
  outcome: reproduced
  notebook: reproduce_henze_2000.ipynb
  output: claim:fig4d-amplitude-correlation
  measured: 0.367
  notes: Two cells give R within 0.36 to 0.44 with P < 0.0001 - D15121 (peak minus threshold
    against negative-to-positive amplitude, R = 0.367, n = 514) and D12821 (peak minus threshold
    against baseline-to-negative amplitude, R = 0.431, n = 95). Over 16 candidate cells and four
    readings, 10 of 54 rows are positive with P < 0.0001, and D11222, D13522 and D17111 give
    negative correlations with P < 0.0001 under some readings.
  deviations:
  - Burst spikes are those inside depolarizing steps with an interspike interval below 5 ms to a
    neighbour (Results, "< 5-ms inter-spike intervals"); cells need at least 30 such spikes, a
    choice made here.
