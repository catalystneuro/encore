findings:
- kind: data_missing
  statement: The data set holds only the anesthetized recordings. The behaving-animal recordings
    the paper re-examines (Figures 5 and 8 and, by its counts, the propagation velocities) and the
    histological tetrode-to-soma distances (Figure 6) are not in it, and the paper names no other
    archive for them. Six of the paper's 21 findings cannot be tested for this reason.
- kind: metadata_insufficient
  statement: The per-cell spreadsheet IntraExtra.xls covers 18 of the 39 cells and only 2 of the 21
    tetrode cells (D14521, D14921). For the other 19 there is no cell type, no somatic or dendritic
    impalement site, no resting potential and no depth, so the paper's interneuron, its somatic
    and dendritic groups and its Fig. 3A pair cannot be identified.
- kind: metadata_insufficient
  statement: Only 5 of 39 folders have a README naming the extracellular and intracellular
    channels. The intracellular channel moves between files of one cell (channel 5 or 6 in the D112
    files), and two binary formats are mixed without a note, 12-bit values centred on 2048 and
    signed 16-bit values. The xml files give an amplification of 1000 for every channel, while the
    intracellular channel matches the spreadsheet's resting potentials only with the descriptor's
    typical gain of 50; at that gain the 16-bit files of D128 give a resting potential near -108 mV,
    so their scale is uncertain.
- kind: other
  statement: The files d813101.dat and d813102.dat of D81 repeat parts of d081fre.001.dat; all 187
    and 74% of 715 of their APs fall within 1 ms of an AP of that file at a fixed offset.
- kind: format_error
  statement: d15611.001.dat and d16811.001.dat have no xml (their size fits 14 channels at 20 kHz),
    and no channel of d15611.001.dat holds intracellular APs. 19 of 169 files have no channel with
    a membrane potential and APs.
- kind: metadata_error
  statement: For the cells D172 to D189, whose files hold six extracellular channels, the
    spreadsheet column "hextrode chans" gives the site order with channel numbers up to 10, which do
    not exist in those files. The amplitude profiles are smooth if the listed channel is halved.
- kind: metadata_error
  statement: The spreadsheet's file counts and recording times disagree with the zips for several
    cells (D14921 lists 1 file where its zip holds 6), as the data set's README of April 2021 warns.
- kind: methods_unavailable
  statement: Question for the authors. Which cells and trains form the Fig. 4B and C analysis of
    current-evoked trains? The Results show one cell and give no selection. This attempt took
    every kept cell with at least 10 steps reaching a 5th AP; with 10, 9 of 17 tetrode cells show
    all the changes the Results describe, a bare majority, and with 20 or 50 trains 6 of 13 and 5 of
    8.
