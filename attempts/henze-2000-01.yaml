- claim: fig7-vertical-spread
  outcome: not_reproduced
  notebook: reproduce_henze_2000.ipynb
  output: claim:fig7-vertical-spread
  notes: Of 10 silicon-probe pyramidal cells with a site order, the spike is present (above 2 SD) 100
    um or more from the soma site in 4; of the 4 whose order the spreadsheet lists, in 2. Amplitude, maximal
    rise slope and maximal decay slope fall with distance from the soma site (Spearman below 0) in 9 of
