- claim: fig4bc-burst-attenuation
  outcome: partially_reproduced
  assumed: true
  proposed:
    outcome: not_reproduced
    reason: The selection verified in round 2 ignores the length of the depolarizing steps, whose median
      per cell runs from 0.1 ms (D8131) to 500 ms against the 350 ms steps of Fig. 4A. Applying every feature
      of Fig. 4A the criterion names (accommodating trains, first interval 5 to 15 ms, median step of 100
      ms or more) leaves 6 tetrode cells; the full set and the amplitude parts each hold in at most 3 of
      6 (2 of 5 with steps of 200 or 300 ms), not a majority, so neither the reproduced nor the partial
      rule is met. With step length alone (50 to 300 ms) the amplitude parts hold in a majority (5 of 8
      at 100 ms) and the full set in none.
  notebook: reproduce_henze_2000.ipynb
  output: claim:fig4bc-burst-attenuation
  notes: Among 17 tetrode cells (kept, extracellular spike present) with at least 10 depolarizing steps
    reaching a 5th AP, all parts of the criterion hold in 9 under reading (a) with the extracellular amplitude
    from baseline to negative peak (O7 b), with either intracellular amplitude; with the negative-to-positive
    amplitude (O7 a) in 5, and under reading (b) in at most 2. The full set holds in a majority under
    some selections and not others - 6 of 13 cells with at least 20 trains, 5 of 8 with at least 50, 6
    of 11 with the criterion's selection (accommodating trains, median first interval 5 to 15 ms) and
    0 of 1 with 7.5 to 12.5 ms. The amplitude parts hold in a majority under every selection with more
    than one cell (12 of 17, 9 of 13, 7 of 8, 7 of 11; O7 b). In the silicon-probe cells all parts hold
    in 1 of 7. The notch was not scored. The median step per cell runs from 0.1 ms (D8131) to 500 ms;
    without D8131 the criterion's selection gives the full set in 5 of 10. With a median step of at least
    50, 100, 200 or 300 ms added as a condition, no selection gives the full set in a majority; the amplitude
    parts hold in a majority with step length alone (7 of 10, 5 of 8, 4 of 7, 4 of 7) and with the criterion's
    selection at 50 ms (5 of 8), and not with the criterion's selection at 100 ms (3 of 6), 200 or 300
    ms (2 of 5). Not reproduced is proposed for a third round.
  deviations:
  - The paper does not say which cells or trains form this analysis. The main selection takes cells with
    at least 10 steps reaching a 5th AP, an assumption; the result is shown at 20 and 50 trains and with
    the criterion's selection (accommodating trains, median first interspike interval of 5 to 15 ms or
    7.5 to 12.5 ms, "about 10 ms" read two ways). Cells are selected on their median first interval; single
    trains are not. The step length of Fig. 4A (350 ms) is shown as a further condition (median step at
    least 50 to 300 ms).
  - Steps are found on the current channel (deviation from its most common value, 5 robust SD), and their
    depolarizing sign from the membrane potential during them; the descriptor gives no step timing, and
    the current channel has no calibration, so step sizes are in raw units.
- claim: fig4d-amplitude-correlation
  outcome: reproduced
  notebook: reproduce_henze_2000.ipynb
  output: claim:fig4d-amplitude-correlation
  measured: 0.408
  notes: D15121 gives R within 0.36 to 0.44 with P < 0.0001 under both intracellular amplitude readings
    with the baseline-to-negative extracellular amplitude (O6 a, R = 0.408; O6 b, R = 0.376; n = 958);
    its trains start at a median first interval of 3.6 ms, bursts of high frequency as in Fig. 4D. The
    relationship is not general - over 16 candidate cells and four readings, 16 of 64 rows are positive
    with P < 0.0001 (R 0.142 to 0.869), and D11222, D13522, D17111 and D17211 give negative correlations
    with P < 0.0001 under some readings. The per-spike threshold of the first round was set only for spikes
    whose last pre-peak sample rose faster than 10 V/s (95 of 438 spikes of D12821); it is now the start
    of the run of dV/dt > 10 V/s that holds the maximal rate of rise, checked on synthetic APs, and it
    is found for 958 of 973 spikes of D15121.
  deviations:
  - Intracellular amplitude O6 b of each spike is the peak minus the mean of the 2 ms before its threshold
    point, as the claims file defines it; until round 2 it used the mean of -3 to -1.5 ms from the peak.
  - Burst spikes are those inside depolarizing steps with an interspike interval below 5 ms to a neighbour
    (Results, "< 5-ms inter-spike intervals"); cells need at least 30 such spikes, a choice made here.
  - The extracellular negative peak of each spike is the minimum within 0.25 ms of the trough of the file's
    averaged trace on that channel, a standard choice.
