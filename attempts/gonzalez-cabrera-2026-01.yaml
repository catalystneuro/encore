- claim: fig3b-photometry-continuous-only
  outcome: reproduced
  assumed: true
  notebook: reproduce_gonzalez_cabrera_2026.ipynb
  output: claim:fig3b-photometry-continuous-only
  notes: Over 5 opsin mice, 4 conditions, 23 trials per file (13 for photometry-exp-5). With the post
    hoc comparisons on the ANOVA's pooled error, continuous light raises the z-scored signal with BH-corrected
    p from 3.8e-06 to 2.9e-04 over 64 readings, and 5, 10 and 20 Hz are not significant in any (20 Hz
    p at least 0.44). The criterion's p < 0.0001 holds in 52 of the 64, all 32 with the ordinary two-way
    ANOVA and 20 of 32 with the repeated-measures error; the 12 that miss it use the code's -3.0 s z baseline
    (p 9.3e-05 to 2.9e-04 there). Under the main reading (Methods baseline, mean and SD z, epoch means,
    100 Hz) Stim minus Pre is 7.10 z for continuous light (1.92 to 15.00 per mouse, positive in 5 of 5)
    and 0.18, 0.55 and 1.40 z at 5, 10 and 20 Hz; repeated-measures pooled p 9.4e-05 and ordinary pooled
    p 6.3e-06. With a separate paired t-test per frequency, the continuous effect has BH p 0.048 to 0.11
    (uncorrected 0.04 under the main reading), and in 12 of those 64 readings 10 or 20 Hz also reaches
    p < 0.05, so under that form the claim would be at most partially reproduced. The epoch by frequency
    interaction p is 0.00063 to 0.0093 over readings. The stimulation table shares the signal's clock
    in the opsin continuous files (mean change 0.0410 dF/F at the onsets against -0.0010 and -0.0015 with
    onsets shifted by 6.5 s, and larger than both shifts in each of the 5 opsin mice). The question of
    which post hoc error the paper used is for the authors (findings, methods_unavailable).
  deviations:
  - Assumption. The claims file's criteria give the post hoc test as paired (Figure 3b) or unpaired (Figure
    3c) comparisons per frequency with Benjamini-Hochberg correction, and the legends say "two-way ANOVA
    with FDR-corrected post hoc comparisons", without saying whether each comparison has its own error
    or uses the ANOVA's. The Methods (Quantification and statistical analysis) name GraphPad Prism v10,
    whose post hoc comparisons after a two-way ANOVA use the ANOVA's pooled error by default, and that
    is assumed. Both forms are run and shown; the outcome rests on the pooled form.
  - The photometry preprocessing follows the paper's code (Fiber_Photometry_PSTH.ipynb at commit 1ff5196),
    as the claims file's criterion says; the Methods' "downsampled" gives no rate, and 100 Hz block means
    are a standard choice, with the native 12-kHz rate run as a variant (same outcomes).
  - The code's guard that drops trials with under 1 s of baseline would drop every trial under the Methods'
    0.9-s baseline, so it is applied only with the code's -3.0 s baseline, where it drops none.
  - All stimulation intervals are used, as the code uses every event; photometry-exp-5 at 5 Hz has two
    extra 3.0-s intervals before its regular train, and the result without them is shown (same outcomes).
- claim: fig3c-photometry-opsin-vs-control
  outcome: reproduced
  assumed: true
  notebook: reproduce_gonzalez_cabrera_2026.ipynb
  output: claim:fig3c-photometry-opsin-vs-control
  notes: 5 opsin and 3 control mice. With the pooled within-cell error, the opsin change is larger than
    the control change for continuous light in all 64 pooled readings (BH p 0.00074 to 0.0028, the paper
    reports 0.002), and 5, 10 and 20 Hz are not significant in any (20 Hz p at least 0.66). Under the
    main reading the continuous change is 7.10 z in opsin mice and 0.12 in controls, and at 5, 10 and
    20 Hz the opsin minus control differences are 0.14, 0.27 and 1.52 z. With a separate unpaired t-test
    per frequency the continuous difference is not significant in any reading (BH p 0.098 to 0.19), so
    under that form the claim is not reproduced. The group by frequency interaction p is 0.016 to 0.042
    over readings.
  deviations:
  - Assumption. The claims file's criteria give the post hoc test as paired (Figure 3b) or unpaired (Figure
    3c) comparisons per frequency with Benjamini-Hochberg correction, and the legends say "two-way ANOVA
    with FDR-corrected post hoc comparisons", without saying whether each comparison has its own error
    or uses the ANOVA's. The Methods (Quantification and statistical analysis) name GraphPad Prism v10,
    whose post hoc comparisons after a two-way ANOVA use the ANOVA's pooled error by default, and that
    is assumed, as for fig3b-photometry-continuous-only. Both forms are run and shown; the outcome rests
    on the pooled form.
  - The photometry preprocessing follows the paper's code (Fiber_Photometry_PSTH.ipynb at commit 1ff5196),
    as the claims file's criterion says; the Methods' "downsampled" gives no rate, and 100 Hz block means
    are a standard choice, with the native 12-kHz rate run as a variant (same outcomes).
  - The code's guard that drops trials with under 1 s of baseline would drop every trial under the Methods'
