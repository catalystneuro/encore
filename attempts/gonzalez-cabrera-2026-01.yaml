  - claim: fig3b-photometry-continuous-only
    agrees: true
    outcome: reproduced
    reason: 'Cell 18: with the repeated-measures ANOVA, post hoc errors pooled across frequencies and
      the Methods baseline, continuous gives BH p = 6.6e-5 to 9.5e-5 with Stim higher; the three train
      frequencies give p >= 0.46. With separate paired t-tests per frequency, continuous gives only p
      = 0.048 to 0.11 (cell 19: uncorrected p = 0.04, n = 5), so the result depends on the error term.
      The pooled form averages the variances of the four frequencies (opsin continuous SD 5.28, trains
      0.38 to 0.96), which pushes both halves of the claim in the claimed direction, and nothing confirms
      Prism''s default for a design with both factors repeated; the pooled p-values match the paper''s
      magnitudes and the separate tests do not. I accept the pooled reading, but the result is fragile.
      Problem 1: regular_onsets drops valid 10-Hz trials (9 to 11 of 23 on synthetic onsets), and the
      12 readings with 10-Hz p < 0.05 and the 8 with 20-Hz p < 0.05 all come from the corrupted "regular"
      rows. Problem 3: the plain two-way ANOVA with pooled errors is not paired, as the claims file asks,
      and its MSE includes the Pre cells, which have zero variance under the Methods baseline, halving
      the MSE. Problem 6: 12 of 32 files have isosbestic R2 < 0.30 and no variant tests the outcome without
      the 405-nm correction. Problem 7: cell 15 asserts a shared clock for control and train files without
      showing it.'
    response: 'regular_onsets now compares unrounded interval lengths with the median (within 20 ms) and
      keeps every interval of 31 files and drops only the two stray intervals of photometry-exp-5 at 5
      Hz; trial counts per file are printed for both sets. With it, no train frequency reaches p < 0.05
      in any reading or form. The post hoc forms were checked against GraphPad''s document on how Prism
      computes them: with both factors repeated and sphericity assumed, Prism uses the epoch x frequency
      x subject mean square (df 12), which the round-1 "pooled" form was not, and without sphericity each
      comparison is a paired t-test; after an ordinary two-way ANOVA it uses the residual mean square.
      All are now run, with p_raw, SE and df per frequency printed for the main reading. With Prism''s
      repeated-measures error continuous p is 2.0e-04 to 5.3e-04, which misses the criterion''s 0.0001,
      so the outcome now rests on the ordinary two-way ANOVA (p 3.8e-06 to 3.8e-05 in all 32 readings),
      taken from the legend, which names no repeated measures where the Figure 2f,i legends do; that reading
      also holds with the code''s -3.0 s baseline, where Pre is not zero-variance (p 9.9e-06 to 3.8e-05).
      Its comparison is unpaired, against the criterion''s "paired", so a reader is asked (questions file).
      A variant on the 470-nm signal without the 405-nm fit gives the same outcome. The clock text now
      says the shared clock is shown only for the opsin continuous files and assumed for the others, with
      the per-file counts printed. Outcome unchanged; its assumption and notes rewritten.'
  - claim: fig3c-photometry-opsin-vs-control
    agrees: true
    outcome: reproduced
    reason: 'Cell 21: with pooled errors, continuous gives BH p = 0.00074 to 0.0028 with opsin larger
      (paper p = 0.002), and 5 to 20 Hz give p >= 0.66. Holds in 64 of 128 readings. With separate Student
      t-tests, continuous gives p = 0.098 to 0.19 and the claim fails. Problem 4: for the pooled form
      the "rm" variant uses dfe = 24, which treats each mouse''s four frequencies as independent; a mixed-ANOVA
      simple effect would use a combined error with Satterthwaite df. The continuous margin (raw p about
      2e-4) is large enough that a smaller df would not change the outcome.'
    response: GraphPad's document on how Prism computes post hoc tests gives, for the mixed design with
      sphericity assumed, MS(Error) = (SS(Subjects) + SS(Residuals)) / (DF(Subjects) + DF(Residuals))
      with df DF(Subjects) + DF(Residuals), 6 + 18 = 24 here, which is the within-cell error the notebook
      used; Prism does not use a Satterthwaite df, so df 24 is kept and cited. After the regular_onsets
      fix the separate t-tests give BH p 0.13 to 0.19; the pooled form is unchanged (0.00074 to 0.0028).
      SE and df per frequency are printed for both forms, and a variant without the 405-nm fit gives the
      same outcome. Outcome unchanged.
