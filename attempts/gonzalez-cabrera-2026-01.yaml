- claim: fig3b-photometry-continuous-only
  outcome: reproduced
  assumed: true
  notebook: reproduce_gonzalez_cabrera_2026.ipynb
  output: claim:fig3b-photometry-continuous-only
  notes: Over 5 opsin mice, 4 conditions, 23 trials per file (13 for photometry-exp-5). With the ordinary
    two-way ANOVA epoch by frequency and the post hoc comparisons on its residual mean square, as Prism
    computes them, continuous light raises the z-scored signal with BH-corrected p from 3.8e-06 to 3.8e-05
    in all 32 readings, below the criterion's 0.0001 in each, and 5, 10 and 20 Hz are not significant
    in any (20 Hz p at least 0.44). Under the main reading (Methods baseline, mean and SD z, epoch means,
    100 Hz) Stim minus Pre is 7.10 z for continuous light (SE 1.209, df 32, BH p 6.3e-06; 1.92 to 15.00
    per mouse, positive in 5 of 5) and 0.18, 0.55 and 1.40 z at 5, 10 and 20 Hz. The Pre values have zero
    variance under the Methods baseline with mean and SD z, which lowers this error, but the readings
    with the code's -3.0 s baseline, where Pre varies, give p 9.9e-06 to 3.8e-05. The other forms give
    other outcomes. With the repeated-measures ANOVA and Prism's error with sphericity assumed (epoch
    x frequency x subject mean square, df 12), continuous light gives BH p 2.0e-04 to 5.3e-04 in all 32
    readings with the trains not significant, which the criterion counts as partially reproduced. With
    a separate paired t-test per frequency (Prism without sphericity), continuous light gives BH p 0.072
    to 0.11 (uncorrected 0.04 under the main reading), so the claim would not be reproduced. No train
    frequency reaches p < 0.05 in any form or reading (smallest 0.072). The 470-nm signal without the
    405-nm fit gives the same pattern (ordinary form p 7.5e-06 to 4.1e-05 in 16 of 16 readings). The epoch
    by frequency interaction p is 0.0006 to 0.0078 over readings. The claims file's criterion asks for
    a paired post hoc comparison, which the ordinary ANOVA's comparison is not; this is asked of a reader
    (questions/gonzalez-cabrera-2026.yaml). Which ANOVA and post hoc error the paper used is for the authors
    (findings, methods_unavailable). The stimulation table shares the signal's clock in the opsin continuous
    files (mean change 0.0410 dF/F at the onsets against -0.0010 and -0.0015 with onsets shifted by 6.5
    s, and larger than both shifts in each of the 5 opsin mice).
  deviations:
  - Assumption. The legend says "two-way ANOVA with FDR-corrected post hoc comparisons" and the Methods
    (Quantification and statistical analysis) name GraphPad Prism v10; neither says whether the ANOVA
    had repeated measures or how the comparisons were computed. The ordinary two-way ANOVA (a reading
    the claims file names) is assumed, since this legend does not name repeated measures where the Figure
    2f and 2i legends do ("one-way ANOVA with repeated measures"), and it is the only one of Prism's forms
    that gives the legend's p < 0.0001. Its post hoc comparisons use the model's residual mean square,
    as Prism computes them after an ordinary two-way ANOVA (GraphPad, "How Prism 8.0 computes multiple
    comparisons tests following ANOVA" (cdn.graphpad.com/faq/1688/file/MulitpleComparisonAlgorithmsPrism8.pdf)).
    This comparison is not paired, as the criterion's "post hoc paired" asks; a reader is asked. The repeated-measures
    forms (Prism with and without sphericity) and a pooled-difference form are run and shown.
  - The photometry preprocessing follows the paper's code (Fiber_Photometry_PSTH.ipynb at commit 1ff5196),
    as the claims file's criterion says; the Methods' "downsampled" gives no rate, and 100 Hz block means
    are a standard choice, with the native 12-kHz rate run as a variant (same outcomes).
  - The code's guard that drops trials with under 1 s of baseline would drop every trial under the Methods'
    0.9-s baseline, so it is applied only with the code's -3.0 s baseline, where it drops none.
  - All stimulation intervals are used, as the code uses every event; photometry-exp-5 at 5 Hz has two
    extra 3.0-s intervals before its regular train, and the result without them (the intervals within
    20 ms of the file's median length, which keeps every interval of the other 31 files) is shown (same
    outcomes).
  - The clock shared by the stimulation table and the signal is shown only for the opsin continuous files;
    for the train and control files, where the response is too small to show it, it is assumed from the
    same table format and 13-s cycle.
- claim: fig3c-photometry-opsin-vs-control
  outcome: reproduced
  assumed: true
  notebook: reproduce_gonzalez_cabrera_2026.ipynb
  output: claim:fig3c-photometry-opsin-vs-control
  notes: 5 opsin and 3 control mice. With Prism's error, the within-cell mean square of the group by frequency
    cells (df 24), which Prism uses after the ordinary two-way ANOVA and, with sphericity assumed, after
    the mixed design, the opsin change is larger than the control change for continuous light in all 64
    rows of that form (32 readings, each with either ANOVA; BH p 0.00074 to 0.0028, the legend reports
    0.002), and 5, 10 and 20 Hz are not significant in any (20 Hz p at least 0.66). Under the main reading
    the continuous change is 7.10 z in opsin mice and 0.12 in controls, a difference of 6.98 z (SE 1.614,
    df 24, BH p 0.00092), and at 5, 10 and 20 Hz the opsin minus control differences are 0.14, 0.27 and
    1.52 z. With a separate unpaired t-test per frequency (Prism without sphericity) the continuous difference
    is not significant in any reading (BH p 0.13 to 0.19), so under that form the claim is not reproduced.
    The 470-nm signal without the 405-nm fit gives the same result with Prism's error in 16 of 16 readings
    (BH p 0.00071 to 0.0022). The group by frequency interaction p is 0.016 to 0.038 over readings.
  deviations:
  - 'Assumption. The legend gives "two-way ANOVA with FDR-corrected post hoc comparisons" and the Methods
    name GraphPad Prism v10, without saying how the comparisons were computed. Prism''s error is assumed
    (GraphPad, "How Prism 8.0 computes multiple comparisons tests following ANOVA" (cdn.graphpad.com/faq/1688/file/MulitpleComparisonAlgorithmsPrism8.pdf)):
    after an ordinary two-way ANOVA every comparison uses MS(Residual); after the mixed design with sphericity
    assumed, a comparison of the unmatched groups at one level of the repeated factor uses (SS(Subjects)
    + SS(Residuals)) / (DF(Subjects) + DF(Residuals)); both equal the within-cell mean square with df
    24, so both designs give the same p. Under the ordinary ANOVA adopted for fig3b-photometry-continuous-only
    this needs no assumption about sphericity. Separate unpaired t-tests (Prism without sphericity) are
    run and shown.'
  - The photometry preprocessing follows the paper's code (Fiber_Photometry_PSTH.ipynb at commit 1ff5196),
    as the claims file's criterion says; the Methods' "downsampled" gives no rate, and 100 Hz block means
    are a standard choice, with the native 12-kHz rate run as a variant (same outcomes).
  - The code's guard that drops trials with under 1 s of baseline would drop every trial under the Methods'
    0.9-s baseline, so it is applied only with the code's -3.0 s baseline, where it drops none.
  - All stimulation intervals are used, as the code uses every event; photometry-exp-5 at 5 Hz has two
    extra 3.0-s intervals before its regular train, and the result without them (the intervals within
    20 ms of the file's median length, which keeps every interval of the other 31 files) is shown (same
    outcomes).
  - The clock shared by the stimulation table and the signal is shown only for the opsin continuous files;
    for the train and control files, where the response is too small to show it, it is assumed from the
    same table format and 13-s cycle.
- claim: fig3-optotag-counts
  outcome: blocked
  blocked_by: methods_underspecified
  notes: 'Blocked as methods underspecified, after verification (it was data_missing). The dandiset''s
    34 ecephys files hold the raw 30-kHz voltage and eight unnamed ADC channels per recording, with no
    units table, spike times, tagging result, intervals table or processing module (notebook, Data check).
    The raw data and the light timing are there, so the claim could in principle be tested from a new
    spike sort, but the paper''s units come from Kilosort, version not given, followed by manual curation
    in Phy 2 with no stated criteria (Methods, Electrophysiology acquisition and spike sorting), which
    no rerun can repeat. Reading the 191 GB of raw data alone would take about 1.5 h at the measured rate
    of about 35 MB/s, before any sorting. The metadata are also insufficient: a scan of every ADC channel
    finds 133 tagging trains of 210 1-ms pulses, on ADC1 (69), ADC2 (45) or ADC3 (19), all of the same
    amplitude, mostly on two channels per file in a fixed order, but nothing says which is the 470-nm
    (DA) and which the 635-nm (VTA-PnO) light.'
