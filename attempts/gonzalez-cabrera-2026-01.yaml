findings:
- kind: data_missing
  statement: The 34 ecephys files (25 acute, 9 chronic, 161 GB) hold only raw broadband voltage and unnamed
    ADC series. They have no units table or spike times, no opto-tagging result, no intervals or event
    tables, and no processing module, so none of the paper's 15 silicon-probe findings (Figure 3d-k, Figure
    4, Supplementary Figures 3b-d and 4) can be tested without redoing the spike sorting and its manual
    curation in Phy 2. The dandiset description's "synchronized information describing rotation onset,
    direction, timing, and experimental condition" is not in the files as labelled data.
- kind: metadata_insufficient
  statement: The ADC series are named only by number (ADC1 to ADC8). In the tagging recordings checked,
    one channel carries 210 pulses of 1 ms at 5 Hz, ADC1 in some recordings and ADC2 in others, but nothing
    says which is the 470-nm and which the 635-nm laser, which recording is the baseline, tagging, 1-s
    light or rotarod block, or which rotarod block is reverse or forward.
- kind: metadata_insufficient
  statement: The electrode location is "unknown" for every channel of every ecephys file.
- kind: other
  statement: The chronic files come from 4 subjects (DAT-2598-H8 with 6 sessions, DAT-2677-H10, DAT-2680
    and DAT-2749 with one each); the paper reports chronic recordings from 3 mice. Which subjects and
    sessions the paper's 40 units and 17 bidirectional units come from is not stated.
- kind: data_missing
  statement: The juxtacellular, tracing, ex vivo slice and open-field experiments (24 of the paper's 41
    findings) are not in the dandiset. The Zenodo record it cites (doi 10.5281/zenodo.21390830) holds
    figure-level source tables, histology images of Figure 1a and eight open-field videos without DeepLabCut
    tracking.
- kind: metadata_error
  statement: In the photometry files, session_start_time is often earlier than the end of the previous
    file of the same mouse (for example photometry-control-1 at 20 Hz starts at 11:02:36 and lasts 462
    s, and its continuous file starts at 11:04:16), so it is not the time recording started; it looks
    like a file export time.
- kind: other
  statement: photometry-exp-5 at 5 Hz has two 3.0-s stimulation intervals, 8 s apart, at 3.8 s and 11.8
    s, before its regular train of 2.8-s intervals every 13 s; they are not described. All other files
    have only intervals of their condition's length. photometry-exp-5 has 13 trials per condition, the
    others 23.
- kind: other
  statement: In many photometry files the isosbestic fit explains little of the GCaMP signal (R squared
    under 0.30, the level at which the paper's own code warns, in 12 of 32 files, from -0.01 to 0.99 over
    files, computed over whole recordings), which the code reports but does not act on.
- kind: methods_unavailable
  statement: Question for the paper's authors. Figure 3b,c report "two-way ANOVA with FDR-corrected post
    hoc comparisons". Were the post hoc comparisons computed on the ANOVA's pooled error (GraphPad Prism's
    default), or as separate paired (Figure 3b) and unpaired (Figure 3c) t-tests, and which FDR procedure
    was used? On these data the pooled form gives continuous p 3.8e-06 to 2.9e-04 (Figure 3b) and 0.00074
    to 0.0028 (Figure 3c), as the paper reports, while separate t-tests give BH p 0.048 to 0.11 and 0.098
    to 0.19. Which recordings and downsampling rate were used for the z-scores (the Methods baseline of
    -1.0 to -0.1 s or the code's -3.0 to -0.1 s) is also open.
