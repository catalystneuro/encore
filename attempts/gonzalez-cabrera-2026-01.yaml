- claim: fig3-optotag-counts
  outcome: blocked
  blocked_by: data_missing
  notes: The dandiset's 34 ecephys files hold only raw 30-kHz voltage and eight unnamed ADC series per
    recording, with no units table, spike times, tagging result, intervals table or processing module
    (notebook, Data check). The claim needs the paper's spike-sorted units (Kilosort, version not given,
    then manual curation in Phy 2; Methods, Electrophysiology acquisition and spike sorting), which are
    not in the dandiset and not public elsewhere; the Zenodo records doi 10.5281/zenodo.21390830 and 10.5281/zenodo.18661700
    hold figure-level tables and figure PDFs. Re-sorting is not a substitute here, since the manual curation
    that defines the units cannot be repeated, and reading the 191 GB of raw data alone would take about
    1.4 h at the measured streaming rate of about 39 MB/s, before any sorting. The ADC channels also do
    not say which carries the 470-nm and which the 635-nm laser (one carries 210 pulses of 1 ms at 5 Hz
    in each tagging recording checked, ADC1 in some and ADC2 in others).
