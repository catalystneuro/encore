outcomes:
- claim: link-authors-deposit
  outcome: reproduced
  notebook: reproduce_wang_2025.ipynb
  output: claim:link-authors-deposit
  notes: All 16 areas of area2anno.json have annotation names found among the dataset's anno_name values
    once commas are removed; 162 of the dataset's 294 distinct annotations fall in the map, the others
    being structures outside its 16 areas. All 106 session names of cal4cat-delay.pickle match a dataset
    session by mouse and date; the five SC038 days with two named sessions each have two dataset files.
    The 106 sessions come from 21 of the 28 mice; SC011, SC013, SC015, SC016, SC017, SC022 and SC023 have
    none.
  deviations:
  - The link claim was added by this attempt (protocol, author step 1.4); its criterion was written before
    the full run.
- claim: data-scale
  outcome: reproduced
  notebook: reproduce_wang_2025.ipynb
  output: claim:data-scale
  measured:
  - 154948
  - 17
  notes: Over the 174 sessions, all with video markers, 272,227 units; unit_quality good 154,948 and classification
    good 69,453. With the 2 Hz filter on avg_firing_rate, 88,647 and 46,658, so after the filter the count
    is above 50,000 under unit_quality and below it under classification; the criterion holds when either
    count exceeds 50,000 and the count before the filter does under both. Units fall in all 17 areas (the
    16 of the authors' grouping and ALM by probe target). Only units with classification good carry a
    CCF annotation. Over the authors' 106 sessions, 90,324 unit_quality good and 42,259 classification
    good units. measured gives the unit_quality good count and the number of areas.
  deviations:
  - The 2 Hz filter uses the dataset's whole-session avg_firing_rate, not the rate over the included trials
    (Methods, Prediction of neural activity, 'Neurons with low firing rates (below 2 Hz) were excluded');
    the count before the filter already decides the claim.
  - The paper names no quality label; both of the dataset's (unit_quality and classification) are reported,
    as the criterion allows.
  - Areas are the 16 of the authors' area2anno.json (Zenodo deposit) and ALM by probe target (code, get_single_area_inds);
    they overlap (for example Thalamus contains VM), as the paper's own list of structures does.
- claim: fig2b-medulla-vs-midbrain
  outcome: blocked
  blocked_by: too_large
  notes: The paper's 16-dimensional embedding comes from a convolutional autoencoder trained on each session's
    side-view video (Methods, Convolutional autoencoder). The version the paper cites, 0.230822.0128,
    has no video; the later version 0.231012.2129 has it, in 71 files named +image (28.9 TB of its 65.7
    TB). The notebook reads 300 frames of one session at 190 frames per second; that session has 680,502
    side-view frames, so reading the video alone takes about 1 h per session and about 100 h for the paper's
    106 sessions, before training about 100 autoencoders on four CPUs. The authors' per-frame embeddings
    are not in their Zenodo deposit (session_latents.pkl holds 16 images of 120 by 112 pixels per session)
    and the Google Drive folder the code's README links is not pinned, so it cannot be used (protocol,
    author step 1.4). The end-to-end networks (Methods, End-to-end learning) are trained on the frames
    themselves and would cost more still. The criterion's filter needs explained variance under all three
    methods.
