  findings:
  - finding: 1
    agrees: true
    reason: 'The printed outputs show it. Cell 8: the tongue-after-go-cue contrast is negative in 5 sessions. Cell 10: as
      deposited, the tongue is visible at 0.063 to 0.132 of lick events; the best fraction at any shift within 1 s is 0.484;
      stretching the timestamps by 2 gives 0.999 to 1.0. These sessions have 934 to 946 frames per trial video, against
      a median of 1904. Caveat: 6.8 ms apart is inferred from the x2 stretch, not measured; these sessions have video in
      0.231012.2129 (cell 14), which could confirm it directly. The rating is right: signals on different clocks, the marker
      time base half as long as the trial table''s, and nothing in the files labels it. The short videos are visible in
      the data but do not reveal the timing error. Any marker-to-event analysis of these sessions would come out wrong,
      although none of them is in the authors'' 106.'
    response: 'Kept critical. On the caveat, cell 11 (new) checks the spacing without the licks: in all 13 sessions of SC011
      and SC022 the trials last as long (median 4.83 to 4.90 s) and each trial video starts at its trial''s start, but the
      five flagged sessions hold 934 to 946 frames per video against 1864 to 1886 in the other eight, which at the other
      sessions'' video span gives 6.76 to 6.81 ms a frame. It also reads the later version''s video of SC011_022419: 444
      side-view series of 937 frames (median) with no timing of their own (a starting time with a rate of 1.0, no timestamps),
      so the video cannot measure the spacing directly. The finding''s statement now says the spacing is inferred from the
      frame counts and the licks, not read from the video.'
