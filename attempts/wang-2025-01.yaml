    division for data-scale.
  source: doi:10.5281/zenodo.16740783 (MapVideoAnalysisProcessedData.zip)
outcomes:
- claim: link-authors-deposit
  outcome: reproduced
  notebook: reproduce_wang_2025.ipynb
  output: claim:link-authors-deposit
  notes: All 16 areas of area2anno.json have annotation names found among the dataset's anno_name values once commas
    are removed; 162 of the dataset's 294 distinct annotations fall in the map, the others being structures outside
    its 16 areas. All 106 session names of cal4cat-delay.pickle match a dataset session by mouse and date; the five
    SC038 days with two named sessions each have two dataset files. The 106 sessions come from 21 of the 28 mice;
    SC011, SC013, SC015, SC016, SC017, SC022 and SC023 have none.
  deviations:
  - The link claim was written into the claims file by this attempt (protocol, author step 1.4), with its criterion,
    before the full run; it is the registry's check, not a finding of the paper.
- claim: data-scale
  outcome: reproduced
  notebook: reproduce_wang_2025.ipynb
  output: claim:data-scale
  measured:
  - 154948
  - 13
  notes: 'Over the 174 sessions, all with video markers, 272,227 units; unit_quality good 154,948 and classification
    good 69,453. With the 2 Hz filter on avg_firing_rate, 88,647 and 46,658, so after the filter the count is above
    50,000 under unit_quality and below it under classification; the criterion holds when either count exceeds 50,000,
    and the count before the filter does under both. Only units with classification good carry a CCF annotation:
    the 200,922 units with an empty anno_name are exactly the classification unlabelled ones, so 92,769 of the 154,948
    unit_quality good units have no CCF location and 62,179 have one. Counted without nesting, each annotated unit
    once in its major Allen division with isocortex split into ALM and other isocortex, the units fall in 13 structures
    (ALM, other isocortex, olfactory areas, hippocampal formation, cortical subplate, striatum, pallidum, thalamus,
    hypothalamus, midbrain, pons, medulla, cerebellum), each with at least 100 units, under both labels, with or
    without the 2 Hz filter, and over the 174 sessions or the authors'' 106. That is more than 12 by one, and it
    rests on counting ALM and other isocortex apart, as the criterion''s list of areas does; without the split it
    would be 12. ALM here is the isocortex units on probes targeted to ALM, so it may include neighbouring motor
    cortex; the margin is narrow. About 40 units are in names the structure tree lacks (parts of the dorsal lateral geniculate complex,
    in the thalamus), which adds no structure. The 16 areas of area2anno.json nest (Thalamus holds VM, VAL and MD;
    Midbrain holds SC, MRN, SNr and PPN); their top-level areas with ALM give 10, so they are not the count. Over
    the authors'' 106 sessions, 90,324 unit_quality good and 42,259 classification good units (28,606 above 2 Hz).
    measured gives the unit_quality good count and the number of structures.'
  deviations:
  - The 2 Hz filter uses the dataset's whole-session avg_firing_rate, not the rate over the included trials (Methods,
    Prediction of neural activity, 'Neurons with low firing rates (below 2 Hz) were excluded'); the count before
    the filter already decides the claim.
  - The paper names no quality label; both of the dataset's (unit_quality and classification) are reported, as the
    criterion allows. Units with unit_quality good but no CCF annotation count towards the neuron count and not
    towards any structure.
  - Structures are the twelve major divisions of the Allen CCF, read from the authors' structure tree in their deposit
    (mousebrainontology_2.csv and mousebrainontology_heirarchy_cortexMaskExclusions21_sc.xlsx), with isocortex split
    into ALM (units on probes targeted to ALM, as the code's get_single_area_inds) and other isocortex, the level
    of the areas the criterion lists; each unit is counted once. A layer name missing from the tree takes the path
    of its area.
- claim: fig2b-medulla-vs-midbrain
  outcome: blocked
  blocked_by: data_missing
  notes: The paper's 16-dimensional embedding comes from a convolutional autoencoder trained on each session's side-view
    video (Methods, Convolutional autoencoder), and the end-to-end networks are trained on the frames (Methods,
    End-to-end learning). The version the paper cites, 0.230822.0128, has no video. The later version 0.231012.2129
    has it in 71 files (those named +image, 28.9 TB), from 16 of the 28 mice; 34 of the authors' 106 sessions (8
    of their 21 mice) have video and 72 have none in any version, so the input is missing for most of the paper's
    sessions. For the 34 that have it, reading the side view alone takes more than an hour a session (1.4 h at the
    rate of the final run, 47 h for the 34; the timed rate varies from run to run) before any network is trained on four CPUs, so they are also too large
    to compute here. The authors' per-frame embeddings are not in their Zenodo deposit (session_latents.pkl holds
    16 images of 120 by 112 pixels for each of the 106 sessions), and the Google Drive folder the code's README
    links has no DOI or fixed version, so the protocol does not allow its use (author step 1.4). The deposit's per-neuron
    explained variances and choice AUCs are the paper's own results, not data, and are not used. The criterion's
    filter needs explained variance under all three methods.
