- claim: fig6e-marker-clustering
  outcome: partially_reproduced
  notebook: reproduce_wang_2025.ipynb
  output: claim:fig6e-marker-clustering
  measured:
  - 5.92
  - 1.02
  seed_sensitive: false
  notes: Main set, the 167 sessions that pass the clock check (166 decoded). 55 sessions of 15 mice pass
    the filter (jaw or nose AUC of at least 0.65, mice with two or more such sessions). Calinski-Harabasz
    score 5.92 against a null of 1.02 +/- 0.33 s.d. (paper 12.57 against 1.05 +/- 0.54); no shuffled score
    reaches it (p < 0.001). 3 mice have the nose above the jaw in most of their kept sessions and 11 the
    jaw above the nose, so both kinds occur. The score is outside the tolerance (11.31 to 13.83); the
    null mean is within it. Over the authors' 106 sessions the score is 7.63 (36 sessions, 11 mice). Over
    every variant printed (decoder reading a or b, full or trimmed delay epoch, three session sets, thresholds
    0.6, 0.65 and 0.7) the score is 3.61 to 7.90 with p at most 0.003. Under the five seeds the score
    is 5.92, 6.09, 6.53, 6.16 and 6.10 (authors' 106, 7.63 to 9.22), p < 0.001 under all; the outcome
    is the same under each. The criterion gives no partial rule; the outcome is partially reproduced because
    the clustering and both kinds of mice are there and significant but the score is about half the paper's.
    Mean session AUCs in the main set are 0.614 for the jaw and 0.584 for the nose.
  deviations:
  - The marker decoder is not described in the paper and its code is not public; the claims file's readings
    (a) five-frame window, 10 features, and (b) single frame, 2 features, were run with L2 logistic regression,
    the penalty chosen by inner fivefold cross-validation from C in 0.01 to 100 (the grid of the paper's
    code, functions_for_r2.calculate_auc). Both give the same outcome.
  - Correct trials only with 20-fold stratified cross-validation (Methods, Trial selection and cross-validation).
    The AUC is computed once per time bin over the pooled out-of-fold predictions, every 20th frame (68
    ms) from -1.2 s to the go cue, and averaged over the 17 bins; the paper does not say how the delay-epoch
    AUC is formed. The trimmed epoch (-1.05 to -0.15 s) is a variant.
  - Marker outliers above five standard deviations of the frame-to-frame velocity are replaced by linear
    interpolation (Methods, 'We identified outliers by a five-sigma threshold on velocity across frames
    and imputed outliers from nearby frames').
  - The main set is every session that passes the clock check, not the paper's 106 sessions, which the
    paper does not name; the authors' 106 (from their deposit) and all decoded sessions are variants and
    give the same outcome. Seven sessions fail the clock check (see findings).
  - Two sessions are not decoded, SC032_121719 (8 correct left trials) and SC066_041321 (markers for 7
    trial videos only; the notebook's label for this list says fewer than 20 correct trials of a side,
    which is the case only after the trials without marker frames are dropped).
