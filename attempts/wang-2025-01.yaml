  reviewed: Round 2. The full executed notebook of the run after round 1, with its conclusions and summary, the helper module,
    the attempt record and the claims file, with the paper. It agreed with all 30 outcomes and found the assumptions they
    rest on stated and reasonable (session AUC as the mean of the test-fold AUCs, 68 ms bins, ALM split from other isocortex
    by probe target, the 2 Hz filter on avg_firing_rate). It reported no place where the claims file misreads the paper,
    so no question was added for a reader. Of the sentences it found the numbers do not support, the read rate in the blocked
    notes and the 167 sessions of the fig6e variant are corrected (see those claims), and finding 7, which said the Methods
    give 105 and 106 sessions where the 105 is in the Results (Fig. 2c to e), now says so. It found round-1 points 1 to
    10 and C resolved. On finding 2 (SC026_080719, major) it would consider critical if the misassignment of videos to trials
    were confirmed, and called major defensible since the cause is not established and the count mismatch is visible in
    the files; it stays major, as testing the misassignment is a new analysis that would not fit in the notebook's 60-minute
    limit (the re-run took 59.8 minutes). After the round the entry was re-run with one added cell (cell 11, the frame spacing
    of the flagged sessions without the licks) and six workers in place of four for reading the sessions; every printed
    number other than the timed video read rate is unchanged. Report in transcripts/wang-2025/verifier-2-report.md.
