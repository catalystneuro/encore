    the helper module and the claims file, with the paper. The verifier queried the archive''s asset lists and metadata
    for both versions, and tested decode_auc_fast, marker_epoch and clean_marker on synthetic inputs (its points
    9: decode_auc_fast agrees with sklearn to within 0.015 AUC, marker_epoch aligns bins, no train/test leakage;
    no change needed). It found no misreading of the paper in the claims file for the tested claims, so no question
    was added for a reader. Point 7 (the docstring said every 10th frame where STRIDE is 20): corrected, and the
    subsampling is now stated as an assumption. Point 8 (velocity across trial videos, a bad frame flagging the
    next): velocity is no longer taken across the gap between trial videos; the second flag is kept and stated.
    Point 10: the link claim is described as written into the claims file by this attempt, and the later version''s
    growth is attributed to the raw electrophysiology in 169 files and the video in 71. Its request to list the
    Zenodo deposit is met: the notebook prints every member and its size and what session_latents.pkl holds. Report
    in transcripts/wang-2025/verifier-1-report.md.'
