findings:
- kind: other
  about: data
  severity: critical
  statement: In five sessions, sub-440959 (SC011) on 2019-02-24, 2019-02-25 and 2019-02-26 and sub-442571 (SC022)
    on 2019-02-27 and 2019-02-28, the DeepLabCut marker timestamps advance 3.4 ms per frame but the video frames
    are 6.8 ms apart. As deposited, the tongue is visible at 6 to 13% of the lick events, and no shift of the lick
    times within 1 s brings this above 0.49; stretching each trial's marker timestamps by 2 from its first frame
    puts the tongue at 99.9 to 100% of the licks. Their trial videos hold 934 to 946 frames (median per session),
    against 1864 to 1886 in the other eight sessions of the same two mice, although the trials last as long (median
    4.83 to 4.90 s in all 13) and each video starts at its trial's start; the median over all sessions is 1904. The
    video in the later version holds the same frame counts and carries no timing (a starting time with a rate of
    1.0, no timestamps), so the 6.8 ms spacing is inferred from the frame counts and the licks, not read from the
    video. The markers of these sessions are on a time base half as long as the trial table's, and nothing in the
    files shows it; any analysis of movement around task events in them comes out wrong.
- kind: other
  about: data
  severity: major
  statement: 'In sub-455219 on 2019-08-07 (SC026_080719) the tongue is visible at 60% of lick events: 214 trial
    videos match the licks and 117 do not, and the session has 539 trial videos for 630 trials, so some videos are
    probably attached to the wrong trials. The cause was not established.'
- kind: data_missing
  severity: major
  statement: 'Marker frames are missing for whole trials in two sessions: sub-484676 on 2021-04-13 (SC066_041321)
    has markers for 7 trial videos (49 s) of 550 trials, and sub-484674 on 2021-05-05 (SC065_050521) lacks them
    for 140 of its 354 correct trials. The files do not say so.'
- kind: other
  about: data
  severity: major
  statement: The version the paper cites (0.230822.0128) holds no video and no autoencoder embedding, the input
    of most of the paper's analyses. The later version 0.231012.2129 (65.7 TB) adds the raw electrophysiology to
    169 files and the raw video to 71 of them (renamed +image, 28.9 TB), from 16 of the 28 mice; 34 of the 106 sessions
    the paper used for Figs. 6 and 7 have video and 72 have none in any version. Units, trials and markers of four
    sessions drawn at random are identical in both versions. The authors' per-frame embeddings are in no pinned
    deposit.
- kind: metadata_error
  severity: minor
  statement: The marker timestamps step by exactly 3.4 ms within a trial (99.9% of intervals to the microsecond),
    a frame rate of 294 Hz, where the paper states 300 Hz; they look written from a nominal rate, not measured.
- kind: metadata_insufficient
  severity: minor
  statement: Units carry two quality labels, unit_quality (good or multi, no description) and classification (good
    or unlabelled, 1,852 NaN), and only units with classification good have a CCF annotation (anno_name is empty
    for all 200,922 unlabelled units), so 92,769 of the 154,948 unit_quality good units have no location. Which
    label the paper's 50,000 neurons use is not said.
- kind: selection_undocumented
  about: paper
  statement: The dataset holds 174 sessions of 28 mice; the authors' Fig. 6 and 7 file names 106 sessions of 21
    mice, and seven mice (SC011, SC013, SC015, SC016, SC017, SC022, SC023) have none. The Methods say 28 mice, and
    the Results give 105 sessions for Fig. 2c-e and 106 for Fig. 6, without saying which sessions were used or why the others were left
    out.
- kind: methods_unavailable
  statement: Question for the authors. The choice decoder of Fig. 6 (from the embedding and from single markers)
    is not described in the Methods and its code is in neither public repository. Which classifier, features (single
    frame or the five-frame window), penalty selection and time resolution were used, and was the AUC of a time
    bin averaged over test folds or computed over pooled out-of-fold predictions? This attempt used L2 logistic
    regression with a nested choice of penalty on one or five frames of one marker, an AUC per 68 ms bin averaged
    over the delay epoch; on the authors' 106 sessions the Calinski-Harabasz score of Fig. 6e is 6.4 to 6.8 with
    test-fold AUCs averaged and 7.6 to 7.9 with pooled AUCs, against the paper's 12.57, and the best single marker
    gives a response-epoch AUC of 0.75 against the paper's 0.88.
