- claim: fig6e-marker-clustering
  outcome: partially_reproduced
  notebook: reproduce_wang_2025.ipynb
  output: claim:fig6e-marker-clustering
  measured:
  - 6.83
  - 1.03
  seed_sensitive: false
  notes: Main set, the authors' 106 sessions (106 dataset files, none flagged by the clock check), session AUC as
    the mean of the test-fold AUCs. 37 sessions of 11 mice pass the filter (jaw or nose AUC of at least 0.65, mice
    with two or more such sessions). Calinski-Harabasz score 6.83 against a null of 1.03 +/- 0.42 s.d. (paper 12.57
    against 1.05 +/- 0.54); no shuffled score reaches it (p < 0.001). 4 mice have the nose above the jaw in most
    of their kept sessions and 5 the jaw above the nose (2 are even), so both kinds occur. The score is outside
    the tolerance (11.31 to 13.83); the null mean is within it. With one AUC over the pooled out-of-fold predictions
    the score is 7.63 (36 sessions, 11 mice; 35 sessions kept under both readings). On the 167 sessions that pass
    the clock check (166 of them decoded) it is 5.64 (56 sessions, 15 mice). Over all 72 variants printed (AUC reading, decoder reading
    a or b, full or trimmed delay epoch, three session sets, thresholds 0.6, 0.65 and 0.7) the score is 3.52 to
    7.91 with p at most 0.003. Under the five seeds the score is 6.83, 7.82, 6.68, 7.80 and 7.07 (clock-checked
    sessions, 5.63 to 6.72), p < 0.001 under all; the outcome is the same under each. The criterion gives no partial
    rule; the outcome is partially reproduced because the clustering and both kinds of mice are there and significant
    but the score is about half the paper's. Mean session AUCs in the main set are 0.614 for the jaw and 0.590 for
    the nose, and the same decoder gives a response-epoch AUC of 0.754 for the better of the two markers against
    the paper's 0.88 (fig6-marker-vs-embedding-decoding); this decoder is weaker than the paper's, so the lower
    score may come from the decoder and not from the data, and the effect is weaker under this decoder.
  deviations:
  - The marker decoder is not described in the paper and its code is not public; the claims file's readings (a)
    five-frame window, 10 features, and (b) single frame, 2 features, were run with L2 logistic regression, the
    penalty chosen by inner fivefold cross-validation from C in 0.01 to 100 (the grid of the paper's code, functions_for_r2.calculate_auc).
    Both give the same outcome.
  - Correct trials only with 20-fold stratified cross-validation (Methods, Trial selection and cross-validation).
    The paper does not say how the AUC at a time bin is formed from the folds. The main reading averages the test-fold
    AUCs, as the Methods do for the other cross-validated measures (Methods, 'Defining choice- and uninstructed
    movement-modulated neurons using video-based choice decoder', 'The final AUC for each neuron is the average
    of the test AUC across all test-folds'; 'Epoch-averaged explained variance', 'After this, the folds were averaged');
    one AUC over the pooled out-of-fold decision values is a variant. Both give the same outcome.
  - The AUC is computed every 20th frame (68 ms) from -1.2 s to the go cue and averaged over the 17 bins, an assumption
    made to keep the run within time (the paper decodes each time bin); a mean over bins changes by noise only.
    The trimmed epoch (-1.05 to -0.15 s) is a variant.
  - Marker outliers above five standard deviations of the frame-to-frame velocity are replaced by linear interpolation
    (Methods, 'We identified outliers by a five-sigma threshold on velocity across frames and imputed outliers from
    nearby frames'). No velocity is taken across the gap between two trial videos; a frame is flagged when the velocity
    into it is an outlier, so a single bad frame also flags the next one (median 8.7 frames per 10,000 imputed).
  - The main set is the 106 sessions the paper used, named in the authors' Fig. 6 and 7 file and matched by link-authors-deposit;
    the sessions that pass the clock check and all decoded sessions are variants and give the same outcome. Seven
    sessions fail the clock check (see findings), none of them among the 106. Since the main set comes from the
    authors' deposit, the claim's data field is set to with_labels in the claims file and it depends on link-authors-deposit.
  - Two sessions are not decoded, SC032_121719 (8 correct left trials) and SC066_041321 (4 correct trials with marker
    frames over the delay epoch, as markers exist for 7 trial videos only); neither is among the authors' 106.
