outcomes:
- claim: fig4c-broad-ccg-peaks
  outcome: reproduced
  notebook: reproduce_zandvakili_2015.ipynb
  output: claim:fig4c-broad-ccg-peaks
  notes: >-
    All 31 site-average shuffle-corrected V1-V2 CCGs have a broad peak under both readings (mean over
    -50 to 50 ms above the flank mean, and above zero), 16 of 16 sites with a narrow peak and 15 of
    15 without. The across-site average peaks at 2 ms and is 68 ms wide at half its height above
    the flank mean; it stays above half its height above zero over the whole +-125 ms.
  deviations:
  - >-
    A site is a V2 tetrode in one session; the files hold no depth, so "all laminar locations" is
    tested as sites with and without a narrow peak, as the criterion says.
  - Spike times are in 1 ms bins in the files; the paper used 0.1 ms.
- claim: fig4c-narrow-peak-sites
  outcome: not_reproduced
  notebook: reproduce_zandvakili_2015.ipynb
  output: claim:fig4c-narrow-peak-sites
  measured: 0.516
  notes: >-
    16 of 31 V2 sites have a significant narrow peak in the site-average jitter-corrected CCG with
    the 10 ms jitter window (reading j-a), 0.516 against 0.206 +/- 0.021; 22 of 31 (0.710) with a
    25 ms window. Per animal 3 of 6, 5 of 11 and 8 of 14. With a 4 or 6 SD threshold, 22 and 13
    sites. The excess is in every session (2 of 5 to 5 of 7 sites), so no single session accounts
    for it. The data set holds 31 sites of the paper's 223 and 5 of its sessions; the paper says
    some penetrations targeted middle-layer sites, so the fraction may depend on which sessions
    were deposited, which the documentation does not say. It may also come from this attempt's
    method (1 ms bins, no SNR criterion, the jitter implementation). An excess in every session
    fits either cause, and without depths the two cannot be separated.
  deviations:
  - >-
    CCGs at 1 ms resolution (the files' resolution) against the paper's 0.1 ms. Equation 1 is
    combined over the eight stimuli by summing coincidences and the normaliser, which weights each
    stimulus by its V1 spike count (a standard choice).
  - >-
    The jitter correction subtracts the expected CCG under the jitter the claims file describes
    for the divergence analysis (each spike redrawn from the neuron's spikes in the same window on
    trials of the same stimulus), computed analytically for both neurons, with windows tiling the
    trial from 0 ms (Pairwise V1-V2 Analysis cites Smith and Kohn 2008 for the jitter). The 25 ms
    window is this attempt's choice for reading j-b, which the claims file leaves unnamed.
  - The SNR >= 2 unit criterion cannot be applied (no waveforms); units below 0.5 sp/s are removed.
- claim: fig4-narrow-peak-depth
  outcome: blocked
  blocked_by: data_missing
  notes: >-
    The files hold no recording depth for any V2 site and no layer 6/white matter reference; the
    descriptor lists spike rasters, stimulus codes, trial ids, unit codes and RF fits only.
- claim: fig5a-rf-alignment
  outcome: blocked
  blocked_by: metadata_insufficient
  notebook: reproduce_zandvakili_2015.ipynb
  output: claim:fig5a-rf-alignment
  notes: >-
    RF centres are in pixels and the data set gives no pixel-to-degree scale and no fixation
    point; the paper gives 1024 x 768 pixels at 110 cm without the screen size, so the 0.5 deg bins
    of the criterion cannot be formed. Shown for information only, in pixels and the first eye,
    the probability of a significant pair falls with RF offset (0.0165 at 0 to 25 px, 0.0136 at 25
    to 50, 0.0106 at 50 to 75, 0.0034 at 75 to 100, 0 beyond 100 px; 15,463 pairs with both RFs
    fitted). The V1 rfInfo row of a unit is taken as its electrode code minus 1, and sessions with
    two eyes mapped use the first; 2 of 564 V1 units fall on a row with no fit, and the difference
    in probability between offsets below 50 px and 75 px or more (0.0121) is larger than under any
    of 200 random permutations of the V1 rows (median 0.0050, largest 0.0119), consistent with the
    mapping.
- claim: fig5-narrow-pairs-rare
  outcome: not_reproduced
  notebook: reproduce_zandvakili_2015.ipynb
  output: claim:fig5-narrow-pairs-rare
  measured:
  - 0.0105
  - 0.0105
  notes: >-
    171 of 16,308 V1-V2 pairs (0.0105) pass the 5 SD rule with 10 ms jitter, 185 (0.0113) with 25
    ms, against 0.003 or 0.00355. Per session 0.0028 to 0.018; only 106r002p70 (6 of 2112, 0.0028)
    is within tolerance. Narrow peaks remain rare (about 1% of pairs). The site fraction of
    fig4c-narrow-peak-sites is 2.5 times the paper's, consistent with deposited sessions richer
    in coupled sites than the paper's sample or with a difference in method.
  deviations:
  - 1 ms bins against the paper's 0.1 ms; jitter as in fig4c-narrow-peak-sites.
- claim: fig5b-v1v2-latency
  outcome: not_reproduced
  notebook: reproduce_zandvakili_2015.ipynb
  output: claim:fig5b-v1v2-latency
  measured:
  - 2.0
  - 3.89
  notes: >-
    Of 171 significant V1-V2 pairs, 151 peak after zero lag, 5 at zero and 15 before; the offset
    differs from zero with p < 0.001 under both readings (Wilcoxon p = 7.1e-20, sign test p =
    1.9e-29). The median offset is 2.0 ms, outside 2.8 +/- 0.28 (per animal 3, 2 and 2 ms). The
    peaks fall on whole milliseconds (23 at 1 ms, 55 at 2, 49 at 3, 18 at 4); a parabola through
    the peak bins, a variant not in the paper, gives a median of 2.30 ms, also outside. The mean
    width at half height is 3.89 +/- 0.07 ms on the smoothed CCG (reading a) and 3.09 +/- 0.09 ms
    unsmoothed (reading b), both outside 3.71 +/- 0.1. The criterion needs the test at p < 0.001
    and the median within tolerance; the direction and significance of the offset hold, its size
    does not, so the outcome is not reproduced (changed from partially reproduced after the first
    verification round, as the criterion defines no partial outcome).
  deviations:
  - >-
    The files hold spike times in 1 ms bins, so offsets are whole milliseconds where the paper's
    were at 0.1 ms resolution; this limits both the median and the width. Smoothing a single 1 ms
    bin with the Gaussian of SD 1.5 ms alone gives a width at half height of 3.54 ms, so reading
    (a) has little room below that, and the unsmoothed width of reading (b) is limited by the bin.
- claim: fig5b-intra-areal-zero-lag
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_zandvakili_2015.ipynb
  output: claim:fig5b-intra-areal-zero-lag
  notes: >-
    Both medians are 0.0 ms. V2-V2 (249 significant pairs of 2113) shows no difference from zero
    under either reading (Wilcoxon p = 0.861, sign test p = 0.703). V1-V1 (2620 of 32,770) differs
    under the Wilcoxon signed-rank test (p = 0.016 with zeros dropped, 0.027 Pratt, 0.028 zeros
    split) and not under the sign test (p = 0.076); mean offset 0.104 ms, 978 positive, 900
    negative, 742 zero. The readings give different outcomes, and the outcome takes the Wilcoxon
    signed-rank test (see deviations), under which V1-V1 pairs differ from zero, so the criterion
    gives not reproduced. The outcome was not reproduced before the first verification round and
    partially reproduced after it, the outcome the verifier gave, on the ground that the two
    readings disagree. The second verifier pointed out that this does not follow from the
    assumed test; the change back to not reproduced was proposed and the third verification
    round agreed with it. The V1-V1 shift follows the order of the unit lists
    (the claims file's pair order), so it is an ordering asymmetry, not a lead of one population.
    Without pairs on the same electrode, V1-V1 gives Wilcoxon p = 0.009 and sign test p = 0.063,
    and V2-V2 (108 pairs; 141 of the 249 share a tetrode) Wilcoxon p = 0.030 and sign test p =
    0.033; the claims file uses all pairs. Question for the authors, recorded as a finding; which
    test gave p = 0.45 and 0.42.
  deviations:
  - >-
    Assumed that the paper's test of a median offset against zero is the Wilcoxon signed-rank test
    (MATLAB signrank, documented as a test of zero median, the routine choice in a MATLAB-based
    analysis such as the data set's own scripts). The paper names no test; the sign test gives the
    opposite outcome for V1-V1 pairs.
  - The lag sign within an area follows the order of the unit lists, as the criterion says; 1 ms bins.
