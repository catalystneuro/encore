- claim: fig7a-above-shuffle
  outcome: reproduced
  notebook: reproduce_zandvakili_2015.ipynb
  output: claim:fig7a-above-shuffle
  notes: >-
    Under all four readings (trials shuffled within orientation or across all trials; spike or
    control epochs) and at every window from 5 to 80 ms, the shuffled divergence (1.82e-4 to
    4.62e-4 bits) is below the lower 95% bootstrap bound of both the spike divergence (3.30e-4 to
    1.36e-3) and the control divergence (2.01e-4 to 6.81e-4). The narrowest margin is at 5 ms,
    control epochs, shuffle within orientation, 2.006e-4 against 2.013e-4, within the spread of a
    single shuffle realization.
  deviations:
  - >-
    One shuffle realization per reading, compared as a point value with the bootstrap bounds, as
    the criterion says; the shuffled data are jittered with the same rule as the data.
