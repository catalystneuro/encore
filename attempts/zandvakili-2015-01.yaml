findings:
- kind: data_missing
  statement: >-
    The data set holds no V2 recording depth, penetration identity, unit SNR or waveforms. The
    paper's layer groups (middle, superficial and deep V2), its depth of the narrow-peak sites,
    its offset-RF group and its single-unit analyses cannot be repeated; 7 of the paper's claims
    on the recordings are blocked for this.
- kind: metadata_insufficient
  statement: >-
    Receptive field centres and variances (rfInfo) are in pixels, and neither the data set nor the
    paper gives the pixel-to-degree scale or the fixation point (the paper gives 1024 x 768 pixels
    at 110 cm without the screen size). In four sessions each channel has fits for two eyes, with V1
    RF centres a median of 244 to 266 pixels apart horizontally. RF sizes and offsets in degrees,
    which the paper reports, cannot be computed.
- kind: selection_undocumented
  about: data
  statement: >-
    The data set holds 5 sessions in 3 animals of the paper's recordings in 7 animals (31 V2
    sites of 223). Its documentation does not say how they were chosen. This attempt finds a
    significant narrow V1-V2 peak at 16 of 31 sites (0.52, against 46 of 223 in the paper) and in
    1.05% of V1-V2 pairs (against 0.3%), in every session. The difference may come from which
    sessions were deposited or from this attempt's method (1 ms bins, no SNR criterion, the jitter
    implementation); the data cannot separate the two.
- kind: metadata_error
  statement: >-
    The data description gives an average of 112.2 V1 units per session; the five files hold 159,
    109, 88, 97 and 111 V1 units, an average of 112.8. The V2 average (29.4) matches.
- kind: metadata_insufficient
  statement: >-
    The data description lists stimulus code 7 as a 135 deg grating, but the sessions description
    gives 180 deg for session 105l001p16. The population responses agree with the sessions
    description (code 7 correlates 0.911 with code 1, against 0.637 and 0.845 with codes 6 and 8).
    The spike rasters are at 1 ms resolution, where the paper's CCGs used 0.1 ms; the description
    does not say that the spike times were binned.
- kind: methods_unavailable
  statement: >-
    Question for the authors. Which test gave the p-values for the median CCG peak offsets against
    zero (p < 0.001 for V1-V2; p = 0.45 and 0.42 for V1-V1 and V2-V2)? On this data set the
    Wilcoxon signed-rank test finds the V1-V1 offsets different from zero (p = 0.016, mean 0.10
    ms) and the sign test does not (p = 0.076); the attempt assumed the signed-rank test.
- kind: methods_unavailable
  statement: >-
    Question for the authors. How were the bootstrap p-values comparing divergence in spike and
    control epochs computed, with the same resampled neurons for both (paired) or from the two
    bootstrap distributions taken as independent? The paired reading finds after-spike epochs and
    epochs far from the spike above control at many offsets (Figure 7D) where the independent one
    finds them at the 80 ms window (and 40 ms in one reading). Comparing two independent control
    sets on this data set, the paired reading runs somewhat above its nominal rate (13 of 150
