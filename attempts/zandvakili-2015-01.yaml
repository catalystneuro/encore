- claim: fig7d-time-course
  outcome: partially_reproduced
  notebook: reproduce_zandvakili_2015.ipynb
  output: claim:fig7d-time-course
  notes: >-
    Under the main, s-b, r-b and d-b readings of the method and both offset readings, the largest
    spike minus control difference at each of the five windows is 2.5 to 3.5 ms before the V2
    spike (main: the epoch centred 2.5 ms before in reading a, 2 ms epochs; the bin 3 ms before in
    reading b). Epochs wholly after the spike or more than 8 ms before it are also significant
    after Bonferroni correction over the 31 offsets. With the paired bootstrap (p-a) this holds at
    every window in every reading (main reading a, 10 to 19 epochs per window). With the
    independent bootstrap (p-b) it holds at 80 ms in the main, s-b and r-b readings (4 to 6 epochs;
    main reading a, 1.5, 6.5, 7.5, 8.5 and 9.5 ms after) and at 40 and 80 ms in d-b. A null check
    of two independent control sets finds no Bonferroni-significant epoch under either p reading
    and p < 0.05 at 13 of 150 epochs under p-a (about 7.5 expected; 5 of 30 at the 5 ms window) and
    0 under p-b, so p-a runs somewhat above its nominal rate at 0.05 but not at the Bonferroni
    threshold. At 80 ms the difference is 8.3e-4 bits 2.5 ms before the spike and 2.7e-4
    bits 2.5 ms after.
  deviations:
  - >-
    2000 bootstrap draws per offset, a standard choice: the smallest p they give, 1/2000, is below
    the Bonferroni threshold 0.05/31, and 5000 draws for the 1240 comparisons of each reading would
    not fit the notebook's time. Offsets beyond 15 ms are not run; epochs falling before 50 ms are
    dropped.
  - >-
    An epoch counts as after the spike when it lies wholly after it (centre -1 ms or less); the
    epochs that hold the bin simultaneous with the spike (centre -0.5 ms for 2 ms epochs, 0 for 1
    ms bins) are counted apart. Before the first verification round the 2 ms epoch at -0.5 ms
    counted as after; the outcome does not change.
