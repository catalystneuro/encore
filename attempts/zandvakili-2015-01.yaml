  outcome: not_reproduced
  notebook: reproduce_zandvakili_2015.ipynb
  output: claim:fig6b-not-after-v2
  notes: >-
    In epochs 1.5 to 3.5 ms after V2 spikes the divergence is above control at 80 ms under both
