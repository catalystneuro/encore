- claim: figs4-partner-not-needed
  outcome: reproduced
  notebook: reproduce_zandvakili_2015.ipynb
  output: claim:figs4-partner-not-needed
  notes: >-
    39 middle-layer V2 neurons have a significant pair with a recorded V1 unit and 49 have none (73
    and 153 in the paper). Under the main reading both subsets have spike divergence above control
    at 5 of 5 windows from 5 to 80 ms under p-a, and under p-b at 5 of 5 with a partner and 4 of 5
