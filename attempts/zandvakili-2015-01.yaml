  outcome: blocked
  blocked_by: metadata_insufficient
  notebook: reproduce_zandvakili_2015.ipynb
  output: claim:fig5a-rf-alignment
  notes: >-
    RF centres are in pixels and the data set gives no pixel-to-degree scale and no fixation
    point; the paper gives 1024 x 768 pixels at 110 cm without the screen size, so the 0.5 deg bins
