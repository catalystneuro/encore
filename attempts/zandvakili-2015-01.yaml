- claim: rf-sizes
  outcome: blocked
  blocked_by: metadata_insufficient
  notebook: reproduce_zandvakili_2015.ipynb
  output: claim:rf-sizes
  notes: >-
    RF variances are in pixels with no pixel-to-degree scale in the data set or the paper. In
    pixels, the mean diameter (4 SD) is 60.9 px for 431 V1 channels and 119.9 px for 77 V2 channels
