outcomes:
- claim: fig4c-broad-ccg-peaks
  outcome: reproduced
  notebook: reproduce_zandvakili_2015.ipynb
  output: claim:fig4c-broad-ccg-peaks
  notes: >-
    All 31 site-average shuffle-corrected V1-V2 CCGs have a broad peak under both readings (mean over
    -50 to 50 ms above the flank mean, and above zero), 16 of 16 sites with a narrow peak and 15 of
    15 without. The across-site average peaks at 2 ms and is 68 ms wide at half its height above
    the flank mean; it stays above half its height above zero over the whole +-125 ms.
  deviations:
  - >-
    A site is a V2 tetrode in one session; the files hold no depth, so "all laminar locations" is
    tested as sites with and without a narrow peak, as the criterion says.
  - Spike times are in 1 ms bins in the files; the paper used 0.1 ms.
- claim: fig4c-narrow-peak-sites
  outcome: not_reproduced
  notebook: reproduce_zandvakili_2015.ipynb
  output: claim:fig4c-narrow-peak-sites
  measured: 0.516
  notes: >-
    16 of 31 V2 sites have a significant narrow peak in the site-average jitter-corrected CCG with
    the 10 ms jitter window (reading j-a), 0.516 against 0.206 +/- 0.021; 22 of 31 (0.710) with a
    25 ms window. Per animal 3 of 6, 5 of 11 and 8 of 14. With a 4 or 6 SD threshold, 22 and 13
    sites. The data set holds 31 sites of the paper's 223 and 5 of its sessions; the paper says
    some penetrations targeted middle-layer sites, so the fraction depends on which sessions were
    deposited, which the documentation does not say.
  deviations:
  - >-
    CCGs at 1 ms resolution (the files' resolution) against the paper's 0.1 ms. Equation 1 is
    combined over the eight stimuli by summing coincidences and the normaliser, which weights each
    stimulus by its V1 spike count (a standard choice).
  - >-
    The jitter correction subtracts the expected CCG under the jitter the claims file describes
    for the divergence analysis (each spike redrawn from the neuron's spikes in the same window on
    trials of the same stimulus), computed analytically for both neurons, with windows tiling the
    trial from 0 ms (Pairwise V1-V2 Analysis cites Smith and Kohn 2008 for the jitter). The 25 ms
    window is this attempt's choice for reading j-b, which the claims file leaves unnamed.
  - The SNR >= 2 unit criterion cannot be applied (no waveforms); units below 0.5 sp/s are removed.
- claim: fig4-narrow-peak-depth
  outcome: blocked
  blocked_by: data_missing
  notes: >-
    The files hold no recording depth for any V2 site and no layer 6/white matter reference; the
    descriptor lists spike rasters, stimulus codes, trial ids, unit codes and RF fits only.
