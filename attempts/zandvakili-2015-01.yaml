    of the effect, which fig6a-coordination-before-v2 tests the presence of, and the criterion
    defines no partial outcome).
  deviations:
  - Reading e-b approximated by single bins 2 and 3 ms before the spike, as in fig6a-coordination-before-v2.
  - >-
    The 1 ms binning widens the spike epoch to about 1 to 4 ms before the spike (see
    fig6a-coordination-before-v2), which may lower the ratio.
- claim: fig7a-above-shuffle
  outcome: reproduced
  notebook: reproduce_zandvakili_2015.ipynb
  output: claim:fig7a-above-shuffle
  notes: >-
    Under all four readings (trials shuffled within orientation or across all trials; spike or
    control epochs) and at every window from 5 to 80 ms, the shuffled divergence (1.82e-4 to
    4.62e-4 bits) is below the lower 95% bootstrap bound of both the spike divergence (3.30e-4 to
    1.36e-3) and the control divergence (2.01e-4 to 6.81e-4). The margin is thin at 5 ms with
    trials shuffled within orientation. Over five shuffle realizations the shuffled value there
    has mean 1.935e-4 (spike epochs) and 1.928e-4 (control epochs), SD about 1e-5, against a control
    bound of 2.013e-4, and in each of these two readings one realization of five is above the bound
    (2.073e-4 and 2.038e-4), which would leave 4 of 5 windows. At every other window and reading all
    five realizations are below both bounds. The outcome rests on the first realization, as the
    criterion compares one shuffled value; the mean of the five also gives 5 of 5 windows.
  deviations:
  - >-
    The shuffled value is one realization per reading, compared as a point value with the
    bootstrap bounds, as the criterion says; four more realizations show its spread. The shuffled
    data are jittered with the same rule as the data.
- claim: fig6b-not-after-v2
  outcome: not_reproduced
  notebook: reproduce_zandvakili_2015.ipynb
  output: claim:fig6b-not-after-v2
  notes: >-
    In epochs 1.5 to 3.5 ms after V2 spikes the divergence is above control at 80 ms under both
    bootstrap readings in every reading of the method (main ratio 1.37, p-a no draw of 5000, p-b
    0.0038; p-b 0.046 or less in the others), and at 40 ms under p-a (main ratio 1.20, p-b 0.099).
    Under the main reading the ratios at 5 to 20 ms are 1.03 to 1.08 (p-a 0.10 to 0.48). The elevation after the spike is
    smaller than before it (1.20 and 1.37 at 40 and 80 ms, against 1.96 and 2.07 before). In the
    other readings the ratios at 5 to 20 ms range from 0.959 (s-b, 10 ms) to 1.12 (d-b, 20 ms, p-a
    = 0.024). A null check compares two independent sets of control epochs. p-a gives p < 0.05 at
    1 of 12 window and epoch combinations and at 13 of 150 time-course epochs (about 7.5 expected,
    binomial tail P = 0.039 if the epochs were independent, which they are not), so it runs
    somewhat above its nominal rate at 0.05; it gives no Bonferroni-significant epoch. p-b gives
    p < 0.05 at none and is conservative. The main after-spike differences at 40 and 80 ms (1.2e-4
    and 2.7e-4 bits) are well above the largest control-against-control difference (4.5e-5 and
    5.2e-5 bits), so they are not an artefact of the test. p-b alone decides the outcome at 80 ms.
- claim: fig6-slow-both-sides
  outcome: reproduced
  notebook: reproduce_zandvakili_2015.ipynb
  output: claim:fig6-slow-both-sides
  notes: >-
    At 1280 ms the divergence is above control before V2 spikes (5.16e-3 against 2.12e-3 bits,
