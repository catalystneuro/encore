    fitted).
- claim: fig5-narrow-pairs-rare
  outcome: not_reproduced
  notebook: reproduce_zandvakili_2015.ipynb
  output: claim:fig5-narrow-pairs-rare
  measured:
  - 0.0105
  - 0.0105
  notes: >-
    171 of 16,308 V1-V2 pairs (0.0105) pass the 5 SD rule with 10 ms jitter, 185 (0.0113) with 25
    ms, against 0.003 or 0.00355. Per session 0.0028 to 0.018; only 106r002p70 (6 of 2112, 0.0028)
    is within tolerance. Narrow peaks remain rare (about 1% of pairs). The site fraction of
    fig4c-narrow-peak-sites is 2.5 times the paper's, consistent with deposited sessions richer
    in coupled sites than the paper's sample.
  deviations:
  - 1 ms bins against the paper's 0.1 ms; jitter as in fig4c-narrow-peak-sites.
- claim: fig5b-v1v2-latency
  outcome: partially_reproduced
  notebook: reproduce_zandvakili_2015.ipynb
  output: claim:fig5b-v1v2-latency
  measured:
  - 2.0
  - 3.89
  notes: >-
    Of 171 significant V1-V2 pairs, 151 peak after zero lag, 5 at zero and 15 before; the offset
    differs from zero with p < 0.001 under both readings (Wilcoxon p = 7.1e-20, sign test p =
    1.9e-29). The median offset is 2.0 ms, outside 2.8 +/- 0.28 (per animal 3, 2 and 2 ms). The
    peaks fall on whole milliseconds (23 at 1 ms, 55 at 2, 49 at 3, 18 at 4); a parabola through
    the peak bins, a variant not in the paper, gives a median of 2.30 ms, also outside. The mean
    width at half height is 3.89 +/- 0.07 ms on the smoothed CCG (reading a) and 3.09 +/- 0.09 ms
    unsmoothed (reading b), both outside 3.71 +/- 0.1. The direction and significance of the
    offset hold; its size and the width do not match.
  deviations:
  - >-
    The files hold spike times in 1 ms bins, so offsets are whole milliseconds where the paper's
    were at 0.1 ms resolution; this limits both the median and the width.
- claim: fig5b-intra-areal-zero-lag
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_zandvakili_2015.ipynb
  output: claim:fig5b-intra-areal-zero-lag
  notes: >-
    Both medians are 0.0 ms. V2-V2 (249 significant pairs of 2113) shows no difference from zero
    under either reading (Wilcoxon p = 0.861, sign test p = 0.703). V1-V1 (2620 of 32,770) differs
    under the Wilcoxon signed-rank test (p = 0.016 with zeros dropped, 0.027 Pratt, 0.028 zeros
    split) and not under the sign test (p = 0.076); mean offset 0.104 ms, 978 positive, 900
    negative, 742 zero. The readings give different outcomes, and the outcome takes the Wilcoxon
    signed-rank test (see deviations). Without pairs on the same electrode, V1-V1 gives Wilcoxon p
    = 0.009 and sign test p = 0.063, and V2-V2 (108 pairs) Wilcoxon p = 0.030 and sign test p =
    0.033. Question for the authors, recorded as a finding; which test gave p = 0.45 and 0.42.
  deviations:
  - >-
    Assumed that the paper's test of a median offset against zero is the Wilcoxon signed-rank test
    (MATLAB signrank, documented as a test of zero median, the routine choice in a MATLAB-based
    analysis such as the data set's own scripts). The paper names no test; the sign test gives the
    opposite outcome for V1-V1 pairs.
  - The lag sign within an area follows the order of the unit lists, as the criterion says; 1 ms bins.
- claim: figs3-efficacy
  outcome: not_reproduced
  notebook: reproduce_zandvakili_2015.ipynb
  output: claim:figs3-efficacy
  measured:
  - 0.324
  - 0.496
  notes: >-
    128 of 171 significant pairs have an offset above 1 ms (255 in the paper). Reading a,
    jitter-corrected CCG, median 0.324% and mean 0.496 +/- 0.046%, below 0.39 +/- 0.039 and 0.69
    +/- 0.12. Reading b, the raw CCG, gives median 6.494% and mean 9.479% uncorrected and median
    0.820% and mean 1.268% shuffle-corrected, far above. Reading a per animal, median 0.334%,
