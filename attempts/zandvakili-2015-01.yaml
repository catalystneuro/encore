- claim: fig6a-coordination-before-v2
  outcome: reproduced
  notebook: reproduce_zandvakili_2015.ipynb
  output: claim:fig6a-coordination-before-v2
  notes: >-
    88 V2 neurons at the 16 middle-layer sites (1,985,591 spikes from 50 ms; the paper 226 neurons).
    Main reading (e-a, s-a, r-a, d-a) at 5, 10, 20, 40, 80 and 1280 ms, spike against control
    divergence 4.05e-4 against 2.36e-4 bits at 5 ms up to 5.16e-3 against 2.12e-3 at 1280 ms, ratios
    1.72 to 2.43, p < 0.001 at every window under p-a (no draw of 5000) and p-b (at most 0.00037).
    All other readings (s-b, r-b with three realizations, d-b, and single bins at 2 or 3 ms for
    e-b) give 6 of 6 windows. Per animal the ratio is 1.50 to 2.66.
  deviations:
  - >-
    Reading e-b, one 1 ms bin centred 2.5 ms before the spike, cannot be formed from 1 ms data; it
    is run as the bins centred 2 ms and 3 ms before, which bracket it.
  - >-
    The jitter pool includes the spike's own trial (the claims file says other trials), a
    standard choice; one trial in 400 changes the pool little. Epochs falling before 50 ms are
    dropped.
  - Middle-layer sites are those of fig4c-narrow-peak-sites, 16 of 31, a larger share than the paper's.
- claim: fig7a-threefold
  outcome: partially_reproduced
