- claim: fig7d-time-course
  outcome: partially_reproduced
  notebook: reproduce_zandvakili_2015.ipynb
  output: claim:fig7d-time-course
  notes: >-
    At all five windows the largest spike minus control difference is at the epoch centred 2.5 ms
    before the V2 spike (reading a, 2 ms epochs) or the bin 3 ms before (reading b). Epochs after
    the spike or more than 8 ms before it are also significant after Bonferroni correction over
