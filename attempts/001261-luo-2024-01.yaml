- claim: fig2d-mouse-passive
  outcome: not_reproduced
  notebook: reproduce_luo_2024.ipynb
  output: claim:fig2d-mouse-passive
  measured:
  - -54.72
  - -58.53
  - 39.92
  - 28.59
  notes: >-
    The resting potential (F1) is not in the data, as every sweep is recorded with the holding
    current, so the claim is judged on tau. Tau on the -20 pA step is longer in cholinergic neurons
    (39.92 against 28.59 ms), but p = 3.2e-3, not below the paper's 0.0001, and both means are
    above their tolerance (31.14 to 38.06 and 20.07 to 24.53 ms), so tau does not hold. The code's
    step (the most negative unsaturated step from -50 to 0 pA) gives 34.88 against 22.04 ms, both
    within tolerance, p = 2.7e-6, a variant that does not decide. The -20 pA fits explain a median
    84% (cholinergic) and 91% (noncholinergic) of the variance of the trace, and 33 cholinergic
    and 21 noncholinergic fits explain less than 90%. Keeping only the fits with R^2 of 0.9 or more
    (14 and 24 neurons), tau is 47.02 against 33.97 ms, p = 5.1e-3, which does not hold either.
    The outcome follows the criterion, but it may reflect noisy fits on a small step more than the
    neurons. The first two measured
    values are the resting potentials written in 8 cholinergic and 27 noncholinergic file names, a
    subset that does not decide; they are close to the paper's -54.4 and -58.7 mV but do not differ
    (p = 0.36).
  deviations: *common
- claim: figs2-2-mouse-amplitude-cv-sag
  outcome: reproduced
  assumed: true
  notebook: reproduce_luo_2024.ipynb
  output: claim:figs2-2-mouse-amplitude-cv-sag
  notes: >-
    Spike amplitude is larger in cholinergic neurons (59.65 against 53.35 mV, p = 5.4e-5, within p
    <= 0.001). The CV of the intervals is lower in cholinergic neurons on the step with the most
    spikes (0.190 against 0.317, p = 1.3e-3, within p <= 0.01); on the 200 pA step p = 0.011. Sag is
    smaller in cholinergic neurons (1.86 against 3.19 mV, p = 1.8e-3, within p <= 0.01). The sag
    rests on the claims file's rule for a saturated -60 pA response, which applies to two
    cholinergic and five noncholinergic mouse neurons whose -60 pA response is clipped at -100 or
    -105.5 mV for 1144 to 4793 samples. On the -60 pA step whatever its response the sag is 1.80
    against 3.01 mV, p = 0.011, which misses the figure's 0.01, so the outcome rests on the reading
    of saturation (assumption below). Question for the paper's authors (finding below).
  deviations:
  - Assumed, as the code's test for a saturated response cannot fire as written (sagpotential.m,
    the mode of the indices of zero differences is at most 1), that a saturated response is one with
    1000 or more consecutive identical samples, after the code's comment ("no more than 1000 points
    will be the same if no saturation"). The 7 mouse responses it catches are clipped at -100 or
    -105.5 mV for 1144 to 4793 samples. Without the rule sag gives p = 0.011, so the outcome rests
    on this reading.
  - The features are re-implemented in Python from the claims file's definitions F1 to F18; steps
    above 200 pA and short test pulses are left out (Methods 2.4); the step onset is the start of
    each sweep's longest run of current; duplicated recordings are counted once and the macaque
    file with a wrong scale is left out; the rank-sum test has MATLAB's tie and continuity
    corrections.
