- claim: fig2d-mouse-ahp
  outcome: partially_reproduced
  notebook: reproduce_luo_2024.ipynb
  output: claim:fig2d-mouse-ahp
  measured:
  - 30.87
  - 16.35
  - 158.9
  - 226.3
  notes: With the Methods' window (rheobase step, minimum within 100 ms of threshold), the AHP
    amplitude is larger in cholinergic neurons (p = 3.7e-12), the cholinergic mean within tolerance
    and the noncholinergic mean (16.35 mV) outside it. The AHP width is longer in noncholinergic
    neurons (226.3 against 158.9 ms, p = 0.020), the opposite of the paper, and also with the
    crossings searched only within the 100 ms window (298.9 against 179.2 ms, p = 2.6e-5). The
    criterion names no outcome for one test holding and the other reversed; the claim holds in part
    (the amplitude), the protocol's definition of partially reproduced. The code's window (first
    step with two spikes, afterhyperpolarization.m) gives 29.71 and 12.14 mV and 180.8 and 77.4 ms,
    all four within tolerance, with p = 5.5e-13 and 2.1e-7. The paper's values thus match the
    code's window, not the Methods'. Question for the paper's authors, which window produced the
    reported AHP values (finding below).
  deviations:
  - The AHP width with the Methods' window is the time below threshold minus half the AHP
    amplitude, from the first downward crossing after threshold to the next upward crossing,
    searched to the end of the step (Methods 2.5 (14) gives no window). The other reading, with the
    crossings searched within the 100 ms window only, is shown and gives the same direction.
  - The features are re-implemented in Python from the claims file's definitions F1 to F18; steps
    above 200 pA and short test pulses are left out (Methods 2.4); duplicated recordings are counted
    once and the macaque file with a wrong scale is left out.
