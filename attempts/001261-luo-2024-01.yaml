  notes: The dandiset has 48 mouse cholinergic, 46 mouse noncholinergic and 46 macaque cholinergic
    files, from 27 mice and 9 macaques, with the sexes of Table 1 (mice 18 M and 9 F, macaques 7 M
    and 2 F). One mouse noncholinergic file repeats, sample for sample, a recording also filed as
    cholinergic (CG608_FL_S4C7_B+G+_-63mV.mat); counted once, the dandiset holds 45 distinct
    noncholinergic recordings, one fewer than the paper's 46. The dandiset has no ChAT-unknown
    category, so the code's wider reading of the noncholinergic group gives the same count. Four of
    five counts match. The macaque cholinergic neurons come from 6 of the 9 macaques. Slices are not
    recorded and the morphology is not in the dandiset, so the slice counts and the morphology
    counts of the statement cannot be checked.
  deviations:
