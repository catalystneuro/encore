- claim: fig2d-mouse-ahp
  outcome: not_reproduced
  notebook: reproduce_luo_2024.ipynb
  output: claim:fig2d-mouse-ahp
  measured:
  - 31.26
  - 16.35
  - 183.1
  - 298.9
  notes: >-
    With the Methods' window (rheobase step, minimum within 100 ms of threshold), the AHP amplitude
    is larger in cholinergic neurons (p = 2.5e-13), the cholinergic mean within tolerance and the
    noncholinergic mean (16.35 mV) outside it. The AHP width, with its crossings searched within
    the 100 ms window as the claims file's F14 says, is longer in noncholinergic neurons (298.9
    against 183.1 ms, p = 4.1e-5), the opposite of the paper; with the crossings searched to the end
    of the step it is 226.3 against 160.0 ms (p = 0.017), the same way. The width test does not
    hold, so the criterion's tests do not both hold and the claim is not reproduced. The code's
    window (first step with two spikes, afterhyperpolarization.m) gives 30.06 and 12.14 mV and 184.3
    and 77.4 ms, all four within tolerance, with p = 4.1e-14 and 5.2e-8; the paper's values match
    the code's window, not the Methods'. Whether the claims file should judge the AHP on the code's
    window is asked of a reader (questions/001261.yaml), and which window was used is asked of the
    paper's authors (finding below).
  deviations:
  - The AHP width with the Methods' window is the time below threshold minus half the AHP
    amplitude, between the first two crossings within the 100 ms window of F12 (claims file F14,
    "Window as in F12"), and to the end of the step when the potential does not recross there. The
    crossings searched to the end of the step are shown as a variant and give the same direction.
  - The features are re-implemented in Python from the claims file's definitions F1 to F18; steps
    above 200 pA and short test pulses are left out (Methods 2.4); the step onset is the start of
    each sweep's longest run of current; duplicated recordings are counted once and the macaque
    file with a wrong scale is left out.
