findings:
- kind: metadata_error
  statement: The recording CG608_FL_S4C7_B+G+_-63mV.mat is deposited twice with identical traces,
    once as a mouse cholinergic neuron (sub-CG608 obj-1ukhfn8) and once as a mouse noncholinergic
    neuron (sub-CG608 obj-17liqyi). Its name says G+ (GFP-positive, cholinergic). Counted once, the
    dandiset holds 45 distinct mouse noncholinergic recordings, not the paper's 46.
- kind: metadata_error
  statement: The macaque noncholinergic recording NHP_20220420-03 of M#12 Shahruk is deposited twice
    with identical traces, under two session names (one of them with spaces in place of hyphens).
    Counted once, the dandiset holds 11 macaque noncholinergic neurons, as the paper says.
- kind: format_error
  statement: In the macaque file "2023_03_06_0002 R+B+A2C1 RMP -78.abf" (sub-M#19-29511 obj-1nl2qam)
    the voltage is 20 times too large (baseline -1557 "mV"; divided by 20 it is -77.9 mV, the value
    in its name), while its conversion factor is 1.
- kind: metadata_error
  statement: The stimulus series are labelled amperes but hold pA (values -100 to 1200).
- kind: metadata_error
  statement: The amplifier fields of every sweep of every file hold one value each (bias current
    1e-11 A, bridge balance 2e7 Ohm, capacitance compensation 1e-12 F, gain 1), although the neurons
    were held at -65 mV by a bias current set per neuron (Methods 2.4); they are placeholders.
- kind: other
  statement: Eight neurons do not depolarise with positive current steps (the potential on the
    largest step differs from that on the most negative step by -5.1 to 8.1 mV, against 17 mV or
    more in the others) and fire no spike, six mouse cholinergic neurons recorded November 2021 to
    February 2022 (CG250, CG268, CG269, CG337) and two macaque neurons of M#11. They respond to
    negative steps. The paper reports spike features for all its neurons.
- kind: data_missing
  statement: The resting potential (feature 1 of Methods 2.5, "measured in the absence of a current
    injection") is not recorded; every sweep carries the holding current. Some original file names,
    kept as the NWB identifier, carry a value (63 of 152 files).
- kind: data_missing
  statement: The morphology of the paper (13 features, Sholl counts, reconstructions of 31 and 44
    mouse and 52 macaque neurons) is not in the dandiset, whose description says it holds the
    physiology data, and the paper names no other archive.
- kind: metadata_insufficient
  statement: The files record neither the quality-control measures (access resistance, offset
    current) nor the slice of each neuron. The original file names carry labels such as R+, B+, G+
    and B+R- that are not documented and do not follow session_description consistently (a macaque
    file named R+B+G+ is filed as noncholinergic, and of three named B+R- two are filed as
    cholinergic and one as noncholinergic).
- kind: metadata_error
  statement: Two files in the folder of mouse CG608 (subject_id CG608) are named for mouse CG609
    (CG609_FL_S7LC4_B+G+_-62mV.mat, CG609_FL_S6RC1_B+G+_-67mV.mat).
- kind: other
  statement: The current steps differ between files and from the paper's description. The increments
    up to 200 pA are 10 to 50 pA in most files and 100 pA in one, not the 10 pA of the Fig. S2-1
    legend; 23 files go above 200 pA (one to 1200 pA); the steps last 500 to 1100 ms, not 500 ms.
- kind: other
  statement: The 46 macaque cholinergic files come from 6 of the 9 macaques, while the paper reports
    46 cholinergic neurons from nine macaques.
- kind: code_mismatch
  statement: The paper's code (afterhyperpolarization.m, commit 17a3265) measures the AHP on the
    first step with two spikes, between 0.75 ms before the first and the second peak, while Methods
    2.5 (12 to 14) measure it after the first spike within 100 ms. On this dandiset the code's window
    gives all four mouse AHP means of the Results within 10% (29.7, 12.1 mV, 180.8, 77.4 ms against
    28.9, 12.4, 177.9, 85.0) and the Methods' window does not (noncholinergic AHP width 226 ms).
- kind: methods_unavailable
  statement: Question for the paper's authors. Which window produced the AHP amplitude, latency and
    width reported in Results 3.1 and 3.3, the Methods' (rheobase step, 100 ms after threshold) or
    the code's (first step with two spikes)? And for the Methods' window, over what span is the AHP
    width at half maximum measured?
- kind: methods_unavailable
  statement: Question for the paper's authors. Methods 2.5 (17, 18) measure the adaptation index and
    the CV "for the maximal current step"; is that the 200 pA step or the step with the most spikes,
    as in spikefrequencyadaptation.m? The mouse adaptation difference holds only with the latter.
- kind: methods_unavailable
  statement: Question for the paper's authors. How was the separation of the UMAP plots judged (the
    "wrong side of the boundary" of Fig. 2C and the "strong separation" of Fig. 7C)? A linear
    boundary in the UMAP plane misclassifies 6 to 10 neurons here in either comparison.
- kind: methods_unavailable
  statement: Question for the paper's authors. Where was the resting potential (feature 1) recorded,
    and for how many neurons? The deposited sweeps all carry the holding current.
