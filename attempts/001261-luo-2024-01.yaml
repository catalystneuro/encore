findings:
- kind: metadata_error
  statement: >-
    The recording CG608_FL_S4C7_B+G+_-63mV.mat is deposited twice with identical traces, once as a
    mouse cholinergic neuron (sub-CG608 obj-1ukhfn8) and once as a mouse noncholinergic neuron
    (sub-CG608 obj-17liqyi). Its name says G+ (GFP-positive, cholinergic). Counted once, the
    dandiset holds 45 distinct mouse noncholinergic recordings, not the paper's 46.
- kind: metadata_error
  statement: >-
    The macaque noncholinergic recording NHP_20220420-03 of M#12 Shahruk is deposited twice with
    identical traces, under two session names (one of them with spaces in place of hyphens).
    Counted once, the dandiset holds 11 macaque noncholinergic neurons, as the paper says.
- kind: format_error
  statement: >-
    In the macaque file "2023_03_06_0002 R+B+A2C1 RMP -78.abf" (sub-M#19-29511 obj-1nl2qam) the
    voltage is 20 times too large (baseline -1557 "mV"; divided by 20 it is -77.9 mV, the value in
    its name), while its conversion factor is 1.
- kind: metadata_error
  statement: The stimulus series are labelled amperes but hold pA (values -100 to 1200).
- kind: metadata_error
  statement: >-
    The amplifier fields of every sweep of every file hold one value each (bias current 1e-11 A,
    bridge balance 2e7 Ohm, capacitance compensation 1e-12 F, gain 1), although the neurons were
    held at -65 mV by a bias current set per neuron (Methods 2.4); they are placeholders.
- kind: metadata_insufficient
  statement: >-
    Most sweeps hold a short -20 pA test pulse besides the step, and nothing in the files marks
    which part of the stimulus is the step. In 8 files (six mouse cholinergic neurons of November
    2021 to February 2022 and two macaque neurons of M#11) the pulse starts 0.7 s before the step in
    every sweep that holds a step; in the others it starts 1.3 s or more after the step onset. An analysis that takes
    the first non-zero stimulus sample as the step onset misses the step in those 8 files.
- kind: other
  statement: >-
    The -60 pA responses of 8 neurons (seven mouse, one macaque) are clipped at -100 or -105.5 mV
    for 1144 to 4793 samples, the limit of the recording; their sag is measured on the next step up,
    as the paper's code intends.
- kind: data_missing
  statement: >-
    The resting potential (feature 1 of Methods 2.5, "measured in the absence of a current
    injection") is not recorded; every sweep carries the holding current. Some original file names,
    kept as the NWB identifier, carry a value (63 of 152 files).
- kind: data_missing
  statement: >-
    The morphology of the paper (13 features, Sholl counts, reconstructions of 31 and 44 mouse and
    52 macaque neurons) is not in the dandiset, whose description says it holds the physiology
    data, and the paper names no other archive.
- kind: metadata_insufficient
  statement: >-
    The files record neither the quality-control measures (access resistance, offset current) nor
    the slice of each neuron; general/notes holds only a bregma position. The original file names
    carry labels such as R+, B+, G+ and B+R- that are not documented and do not follow
    session_description consistently (a macaque file named R+B+G+ is filed as noncholinergic, and
    of three named B+R- two are filed as cholinergic and one as noncholinergic).
- kind: metadata_error
  statement: >-
    Two files in the folder of mouse CG608 (subject_id CG608) are named for mouse CG609
    (CG609_FL_S7LC4_B+G+_-62mV.mat, CG609_FL_S6RC1_B+G+_-67mV.mat).
- kind: other
  statement: >-
    The current steps differ between files and from the paper's description. The increments up to
    200 pA are 10 to 50 pA in most files, include 5 pA in 24 files and are 100 pA in one, not the 10 pA of the Fig. S2-1 legend;
    23 files go above 200 pA (one to 1200 pA); the steps last 500 or 1000 ms, not 500 ms.
- kind: other
  statement: >-
    The 46 macaque cholinergic files come from 6 of the 9 macaques, while the paper reports 46
    cholinergic neurons from nine macaques.
- kind: code_mismatch
  statement: >-
    The paper's code (afterhyperpolarization.m, commit 17a3265) measures the AHP on the first step
    with two spikes, between 0.75 ms before the first and the second peak, while Methods 2.5 (12 to
    14) measure it after the first spike within 100 ms. On this dandiset the code's window gives all
    four mouse AHP means of the Results within 10% (30.1 and 12.1 mV, 184.3 and 77.4 ms against
    28.9, 12.4, 177.9 and 85.0) and the Methods' window does not (noncholinergic AHP width 298.9
    ms, longer than the cholinergic 183.1 ms).
- kind: code_mismatch
  statement: >-
    The paper's code (inputresistance.m, commit 17a3265) fits the membrane time constant on the most
    negative unsaturated step between -50 and 0 pA, while Methods 2.5 (4) use the -20 pA step. On
    this dandiset the code's step gives the paper's mouse values (34.9 and 22.0 ms against 34.6 and
    22.3) and the -20 pA step does not (39.9 and 28.6 ms).
- kind: methods_unavailable
  statement: >-
    Question for the paper's authors. Which window produced the AHP amplitude, latency and width
    reported in Results 3.1 and 3.3, the Methods' (rheobase step, 100 ms after threshold) or the
    code's (first step with two spikes)? And for the Methods' window, over what span is the AHP
    width at half maximum measured?
- kind: methods_unavailable
  statement: >-
    Question for the paper's authors. How is a saturated -60 pA response recognised for the sag?
    The test in sagpotential.m (the mode of the indices of zero differences above 1000) cannot be
    met as written; this attempt reads it as 1000 or more consecutive identical samples, which moves
    the sag of 7 mouse neurons to the next step up and decides whether the mouse sag difference
    reaches p < 0.01.
- kind: methods_unavailable
  statement: >-
    Question for the paper's authors. Methods 2.5 (17, 18) measure the adaptation index and the CV
    "for the maximal current step"; is that the 200 pA step or the step with the most spikes, as in
    spikefrequencyadaptation.m? The mouse adaptation difference holds only with the latter.
- kind: methods_unavailable
  statement: >-
    Question for the paper's authors. How was the separation of the UMAP plots judged (the "wrong
    side of the boundary" of Fig. 2C and the "strong separation" of Fig. 7C)? A linear boundary in
    the UMAP plane misclassifies 4 to 10 neurons here in either comparison.
- kind: methods_unavailable
  statement: >-
    Question for the paper's authors. Where was the resting potential (feature 1) recorded, and for
    how many neurons? The deposited sweeps all carry the holding current.
