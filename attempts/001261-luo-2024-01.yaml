    recording filed under both groups is counted as cholinergic, as its name says G+ (GFP-positive).
- claim: fig2-mouse-c-nc-15-of-18
  outcome: not_reproduced
  notebook: reproduce_luo_2024.ipynb
  output: claim:fig2-mouse-c-nc-15-of-18
  measured: 11
  notes: F1 (resting potential) is not in the data, so the count is out of 17 and the criterion's
    range is 13 to 15. Under the four sets of readings (F11 a or b, F17 and F18 a or b) 11 or 12 of
    the 17 features differ at p < 0.05 (48 cholinergic and 45 noncholinergic neurons, NaN values
    dropped per feature). Spike width (p = 0.92), upstroke (0.38) and downstroke (0.40) do not
    differ, as in Fig. S2-2C, but neither do sag (0.21) and AHP latency (0.50), and adaptation on the
    200 pA step does not (0.68). The last sweep of a repeated amplitude gives the same counts.
    Variants that do not decide give 12 or 13 (the code's choices for input resistance, tau,
    latency and the AHP) and 12 or 13 (without the eight neurons that do not depolarise). The
    resting potential written in 8 cholinergic and 27 noncholinergic file names does not differ
    (p = 0.35).
  deviations: &common
  - The features are re-implemented in Python (scipy.signal.find_peaks in place of MATLAB
    findpeaks, scipy curve_fit in place of fit) from the claims file's definitions F1 to F18.
  - Steps above 200 pA are left out, after Methods 2.4 ("a family of current steps (500 ms
    duration, -60 to 200 pA amplitude)") and Methods 2.5 (16) ("a current step between 0 and 200
    pA"); 23 files also hold steps to 250 pA or more. The steps last 500 to 1100 ms and only their
    first 500 ms are analysed, as the code does (analysisDuration = 500).
  - Short -20 pA pulses of 50 or 100 ms in 126 files are left out as not part of the family of
    steps (Methods 2.4).
  - Where an amplitude was recorded more than once, a one-step feature uses the first sweep; the
    last sweep is shown as a variant and changes no outcome.
  - The paper's quality control (access resistance, offset current, resting potential) cannot be
    repeated, as the files do not record these measures; the groups are taken from
    session_description as deposited.
  - One macaque cholinergic file (2023_03_06_0002 R+B+A2C1 RMP -78.abf) is left out, as its
    voltage is 20 times too large; one copy of each duplicated recording is left out.
- claim: fig2d-mouse-max-firing-rate
  outcome: partially_reproduced
  notebook: reproduce_luo_2024.ipynb
  output: claim:fig2d-mouse-max-firing-rate
  measured:
  - 6.33
  - 4.69
  - 34.8
  - 23.1
  notes: Noncholinergic neurons fire faster, rank-sum p = 1.1e-12 (48 and 45 neurons). Both SDs are
    within tolerance; both means are just below it (6.33 against 6.57 to 8.03 Hz, 34.8 against 35.1
    to 42.9 Hz). The 200 pA reading gives 7.17 and 34.47 Hz. Seven cholinergic neurons fire no
    spike up to 200 pA, six of them neurons that do not depolarise with positive steps; without
    the eight such neurons the means are 7.24 and 35.23 Hz, both within tolerance, a variant that
    does not decide.
  deviations: *common
- claim: fig2d-mouse-threshold-rheobase
  outcome: partially_reproduced
  notebook: reproduce_luo_2024.ipynb
  output: claim:fig2d-mouse-threshold-rheobase
  measured:
  - -33.22
  - -36.77
  - 59.63
  - 42.05
  notes: All four means are within tolerance. The threshold test holds (p = 6.4e-4, cholinergic more
    depolarized). Rheobase is larger in cholinergic neurons but p = 2.3e-3, not below the paper's
    0.001 (41 and 44 neurons with a spike). SDs are 4.45 and 6.02 mV (paper 4.6 and 6.3) and 31.9
