  notes: >-
    The dandiset has 48 mouse cholinergic, 46 mouse noncholinergic and 46 macaque cholinergic
    files, from 27 mice and 9 macaques, with the sexes of Table 1 (mice 18 M and 9 F, macaques 7 M
    and 2 F). One mouse noncholinergic file repeats, sample for sample, a recording also filed as
    cholinergic (CG608_FL_S4C7_B+G+_-63mV.mat); counted once, the dandiset holds 45 distinct
    noncholinergic recordings, one fewer than the paper's 46. The four group labels in
    session_description include none for neurons of unknown ChAT status, so the code's wider
    reading of the noncholinergic group gives the same count. Four of five counts match. The
    macaque cholinergic neurons come from 6 of the 9 macaques. Slices are not recorded and the
    morphology is not in the dandiset, so the slice counts and the morphology counts of the
    statement cannot be checked.
  deviations:
  - Each recording deposited twice is counted once (protocol, Author, step 1.2); the mouse
    recording filed under both groups is counted as cholinergic, as its name says G+ (GFP-positive).
- claim: fig2-mouse-c-nc-15-of-18
  outcome: reproduced
  notebook: reproduce_luo_2024.ipynb
  output: claim:fig2-mouse-c-nc-15-of-18
  measured: 13
  notes: >-
    F1 (resting potential) is not in the data, so the count is out of 17 and the criterion's range
    is 13 to 15. With the adaptation index and the CV on the step with the most spikes (F17 and F18
    reading b), 13 of 17 features differ at p < 0.05 under either downstroke reading (48
    cholinergic and 45 noncholinergic neurons, NaN values dropped per feature); with the 200 pA
    step (reading a), 12. Spike width (p = 0.74), upstroke (0.28) and downstroke (0.26) are among
    the features that do not differ, as the criterion requires, together with AHP latency (0.62).
    One of the 13, the AHP width, differs in the direction opposite to the paper's (see
    fig2d-mouse-ahp); counting only differences in the paper's direction would give 12, below the
    range. The last sweep of a repeated amplitude gives the same counts; the code's variants for
    input resistance, tau, latency and the AHP give 12 or 13, none against the paper's direction.
    The resting potential written in 8 cholinergic and 27 noncholinergic file names does not
    differ (p = 0.36).
  deviations: &common
  - The features are re-implemented in Python (scipy.signal.find_peaks in place of MATLAB
    findpeaks, scipy curve_fit in place of fit) from the claims file's definitions F1 to F18.
  - Steps above 200 pA are left out, after Methods 2.4 ("a family of current steps (500 ms
    duration, -60 to 200 pA amplitude)") and Methods 2.5 (16) ("a current step between 0 and 200
    pA"); 23 files also hold steps to 250 pA or more. The steps last 500 or 1000 ms and only their
    first 500 ms are analysed, as the code does (analysisDuration = 500).
  - The step onset of each sweep is the first sample of its longest run of non-zero current. Short
    -20 pA pulses of 50 or 100 ms, alone in a sweep or in the same sweep as a step (0.7 s before it
    in 8 files, 1.3 s or more after it in the others), are left out as not part of the family of
    steps (Methods 2.4).
  - Sag uses the -60 pA step, the closest step below it when there is none, and the next step up
    when the response is saturated (claims file F2, sagpotential.m). The code's test for saturation
    cannot fire as written (the mode of the indices of zero differences is at most 1); saturated is
    read as 1000 or more consecutive identical samples, after the code's comment ("no more than
    1000 points will be the same if no saturation"). The -60 pA step whatever its response is shown
    as a variant.
  - The rank-sum test is computed as MATLAB ranksum does for these sample sizes (normal
    approximation with tie and continuity corrections), with scipy's Mann-Whitney U test.
  - Where an amplitude was recorded more than once, a one-step feature uses the first sweep; the
    last sweep is shown as a variant and changes no outcome.
  - The paper's quality control (access resistance, offset current, resting potential) cannot be
    repeated, as the files do not record these measures; the groups are taken from
    session_description as deposited.
  - One macaque cholinergic file (2023_03_06_0002 R+B+A2C1 RMP -78.abf) is left out, as its
    voltage is 20 times too large; with its voltage divided by 20 it is shown as a variant, which
    changes no outcome. One copy of each duplicated recording is left out.
