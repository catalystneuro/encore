findings:
- kind: format_error
  statement: The MUA spike times are not on the clock of the LFP. CA1 MUA peaks around the SWRs detected on the
    LFP in 261 of 311 analysed home cage sessions, but displaced from the SWR midpoint by a session-specific lag
    (median -0.145 s, quartiles -0.395 to -0.055 s, range about -2 to +1 s, the MUA earlier in most sessions); only
    26 sessions have the peak within 20 ms. With the deposited times the mean normalised CA1 MUA during SWRs is
    0.39 SD (median -0.2); with each session shifted by its lag, 1.73 SD.
- kind: metadata_error
  statement: Four 4-shank mice (Beverly and Worf, PV-Cre; Picard and Riker, SST-Cre) have only home cage sessions
    labelled CNO, numbered 8 to 17, so they have no vehicle sessions as deposited; the paper analyses 16 PV-Cre
    and 16 SST-Cre mice with vehicle and CNO.
- kind: metadata_error
  statement: In cohort 3 every mouse has its vehicle sessions before its CNO sessions, on the track and in the home
    cage, where the Methods say the treatments alternated; cohort 2 alternates. Either the labels or the description
    is wrong. As deposited, treatment is confounded with session order, and the empty vector mice change with CNO
    in 4 rest and 9 run features, and run faster on CNO days.
- kind: other
  statement: The scale of the LFP values is unclear. The unit attribute says microvolts, and the ripple-band envelope
    over rest (mean 68.8 file units over 311 home cage sessions) is close to Table S2's 72.39 uV. But the SW amplitude
    in vehicle sessions is about 3000 file units against Table S4's 375 and 385 uV, the rest SG power matches Table
    S2 neither in file units nor scaled by 0.195, and values reach the int16 limits in 123 of 311 home cage sessions.
- kind: metadata_error
  statement: The session start times of the linear track files put all sessions of a mouse within minutes of each
    other (shortest gap 0.9 to 4.6 min in all 30 mice), which cannot be right for 25 min sessions.
- kind: other
  statement: Session Chakotay01 (home cage) is deposited twice, as sub-Chakotay_ses-Chakotay01-HomeCage and sub-Chakotay_ses-Chakotay01_HomeCage,
    with the same LFP length, spike count and start time.
- kind: other
  statement: Home cage sessions of cohort 3 last about 25 min and track sessions about 25 min, where the Methods
    give 60 and 30 min; many cohort 2 mice have 7 home cage sessions where the Methods give 6.
- kind: format_error
  statement: Every unit's spike train begins with a spike at exactly 0.0 s (about 31 per session, one per site),
    which is not a recorded spike.
- kind: metadata_insufficient
  statement: The electrode location labels carry undocumented tokens ("ca1-pyr 1", "mua", "dg-val gc"). They were
    read as the SWR detection site, the highest-MUA site of a region, and DG sites with confirmed dentate spikes,
    from the Methods' wording; the dandiset does not say so. The session description says "1 hour after CNO injection"
    for vehicle sessions too.
- kind: methods_unavailable
  statement: Question for the authors. The dentate spike detection as the Methods describe it (peaks of the z-scored
    5-100 Hz trace, amplitude to the nearest minimum, z-scored log amplitude above 0.75, length 5 to 25 ms) finds
    8.58 events per second of rest, close to Table S4's rates of 9.18 and 8.45 Hz. Table S4 gives the dentate spike
    amplitude in uV, where the Methods z-score the trace. On which trace and in which units was the amplitude measured?
- kind: methods_unavailable
  statement: Question for the authors. The Methods log-transform features "when errors were not Gaussian" and the
    figure code logs every feature. Which features were logged for the published LMMs, and how were SWR start and
    end defined (the Methods give only the 3 SD, 15 ms rule)?
- kind: methods_unavailable
  statement: Question for the authors. The deposited spike times are offset from the LFP (see the format_error finding).
    Which clock alignment did the analysis use, and can the aligned times be deposited?
- kind: other
  statement: 'On the linear track, position and LFP agree to within about 2 s: the log theta/delta power ratio correlates
    with speed at zero lag (mean r 0.134, positive in 141 of 170 sessions) and not with speed shifted by 30 s or
    more (mean 0.009). The sub-second spike offset found in the home cage could be checked on the track in only
    24 of 170 sessions, those with a clear CA1 MUA peak around SWRs in still periods (median lag -0.245 s).'
- kind: methods_unavailable
  statement: Question for the authors. Which tapers did the SWR-triggered spectrogram and coherence use (the Methods
    give the 100 ms window), and were vehicle epochs z-scored by their own statistics? Was instantaneous frequency
    during run pooled over the sites of a region, or taken at one site?
