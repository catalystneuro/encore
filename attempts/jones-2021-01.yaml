- claim: fig2ef-csd-sr
  outcome: not_reproduced
  notebook: csd_cohort1.ipynb
  output: claim:fig2ef-csd-sr
  notes: Cohort 1, 5 PV-Cre and 4 SST-Cre mice, 62 sessions. With PV+ suppression the peak CA1-sr source (+6540
    file units per mm2, p = 4.4e-11) and sink (+16200, p = 0.0014) increase; with SST+ suppression both rise in
    every mouse but not significantly (source p = 0.0078, sink p = 0.015). The genotype tests are not significant
    (p = 0.65 and 0.23), as claimed. Two of four treatment effects hold; the partial rule needs three. With the
    code's 5 SD SWRs and the log transform (reading b) the SST-Cre source is significant (p = 0.0012), three of
    four.
  deviations:
  - CSD as minus the second difference across depth of the (a + 2b + c)/4 smoothed LFP, spacing 50 um from the probe
    name (A1x32-6mm-50), in file units per mm2; peak source and sink over the CA1-sr sites in the 100 ms after SWR
    onset (criterion; Methods, Analysis of neural data, paragraph 4).
  - SWRs as in the rest notebook (3 SD, boundaries where the envelope crosses its mean, edge and artifact rules).
  - Holm decided with the rest notebook's SST-Cre p-values (the family stops at its second rank, 0.05/23); the two
    CSD comparisons are not recomputed with the others.
- claim: fig3b-mua-during-swr
  outcome: not_reproduced
  assumed: true
  notebook: rest_home_cage.ipynb
  output: claim:fig3b-mua-during-swr
  notes: With spike times shifted per session to the SWRs, CA1 MUA recruitment does not change (PV-Cre p = 0.12,
    SST-Cre p = 0.30), as claimed, but CA3 (p = 0.80 and 0.59) and DG (p = 0.094 and 0.094, PV-Cre coefficient negative)
    do not increase. With the deposited spike times no CA3 or DG increase is significant either. 14 PV-Cre and 14
    SST-Cre mice.
  deviations:
  - The deposited spike times are offset from the LFP by a session-specific lag (see findings). The main reading
    shifts each session's spike times by the lag of the CA1 MUA peak around SWR midpoints (sessions whose peak is
    under 3 times the median are left out, 50 of 311); this is an assumption.
  - MUA at the site labelled "mua" in each region (Methods, Analysis of neural data, paragraph 5, the site with
    the highest MUA).
- claim: fig3c-swr-rate-bidirectional
  outcome: not_reproduced
  notebook: rest_home_cage.ipynb
  output: claim:fig3c-swr-rate-bidirectional
  notes: Reading (b) of the log transform gives a significant PV-Cre increase (0.33 log units, p = 1.0e-08); reading
    (a), untransformed, gives +4.2 SWRs/min with p = 0.014, not significant after Holm. The SST-Cre effect is not
    a decrease (p = 0.37 and 0.84) and the genotype test is not significant (p = 0.67 and 0.093). The 5 SD variant
    agrees. Empty vector mice also have a higher rate on CNO days (23.8 against 28.9 per min; LMM p = 0.0017), which
    points to session order (see findings).
  deviations:
  - SWR boundaries where the smoothed envelope crosses its mean (Frank lab convention, Cheng and Frank 2008, which
    the Methods cite); the Methods give only the 3 SD, 15 ms threshold.
  - 14 PV-Cre and 14 SST-Cre mice, not 16 each; four mice have only CNO-labelled sessions.
