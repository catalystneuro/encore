- claim: fig4d-swr-sg-power-pv
  outcome: not_reproduced
  assumed: true
  notebook: rest_home_cage.ipynb
  output: claim:fig4d-swr-sg-power-pv
  notes: CNO sessions z-scored by the mouse's previous vehicle session. PV-Cre SWR-coincident SG power rises in
    CA1 (p = 1.3e-11, 13 of 13 mice) and CA3 (p = 0.00046), not significantly in DG (p = 0.19). No SST-Cre effect
    is significant (CA1 p = 0.0095, CA3 0.23, DG 0.14). The CA1 genotype test is not significant (p = 0.11; 0.013
    with 5 degrees of freedom), so the partial rule fails. Empty vector mice also rise in CA1 (p = 1.6e-05), which
    may come from z-scoring a CNO session by another session's statistics or from session order; no output separates
    the two. With every session z-scored by its own statistics (code) no PV-Cre effect is significant (CA1 coefficient
    -0.06, p = 0.044).
  deviations:
  - Multitaper power over 30-50 Hz in the 100 ms after SWR onset with 3 tapers, time-bandwidth 2; the paper gives
    the 100 ms window but not the tapers. This is an assumption.
  - Z-scoring by the mean and SD of the same measure over the non-overlapping 100 ms windows of rest; a CNO session
    by the mouse's latest earlier vehicle session (Methods; in cohort 3 the vehicle sessions all come first, so
    this is the third vehicle session), a vehicle session by its own (claims file).
  - A region's value per SWR is the mean of its sites' z values (CA1-sr, CA3, DG).
