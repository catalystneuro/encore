findings_review:
  date: 2026-11-19
  basis: Each finding about the data was rated from its statement alone, against the definitions of docs/protocol.md
    (the attempt record), and every critical rating was then read a second time. The attempt did not rate
    them.
  findings:
  - finding: 1
    severity: critical
    confirmed: true
    checked: 2026-11-19
    note: "rest_home_cage.ipynb cell 8 prints 261 of 311 sessions with a clear CA1 MUA peak, lag median -0.145 s (quartiles -0.395 to -0.055, min -1.985, max 0.945), 26 sessions within 20 ms, and mean SWR MUA 0.389 SD (median -0.2) as deposited against 1.729 after the shift. The shifted value is raised partly by construction, since each lag is chosen at the peak, and the lag code itself is in a helper module that is not printed."
  - finding: 2
    severity: major
    confirmed: false
    checked: 2026-11-19
    note: "rest_home_cage.ipynb cell 3 prints Beverly, Worf (PV), Picard and Riker (SST) with sequence CCCCCCC and sessions 8,9,10,12,15,16,17, and cell 5 excludes them, leaving 14 PV and 14 SST mice. The outputs show missing vehicle sessions that a user would see at once, and do not show that any label is wrong."
  - finding: 3
    severity: major
    confirmed: false
    checked: 2026-11-19
    note: "rest_home_cage.ipynb cell 3 and run_linear_track.ipynb cell 3 print vvvCCC for every cohort 3 mouse and vCvCvC for cohort 2; rest cell 70 shows 4 significant EV rest features and run cell 60 shows 9 EV run features and EV run speed rising from 4.28 to 6.07 cm/s across session ranks. The Methods wording is only quoted in markdown, and nothing printed shows the labels are wrong, so this is an order confound or a description mismatch visible from the session numbers."
  - finding: 4
    severity: major
  - finding: 5
    severity: minor
  - finding: 6
    severity: critical
    confirmed: true
    checked: 2026-11-19
    note: "rest_home_cage.ipynb cell 3 prints the two Chakotay01 home cage files (ses-Chakotay01-HomeCage and ses-Chakotay01_HomeCage) with the same 3701569 LFP samples, 174198 spikes and start time 2017-07-03T15:06:45. The sample values themselves were not compared, but the match of all three is one session deposited under two session ids."
