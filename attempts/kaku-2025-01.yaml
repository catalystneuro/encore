- claim: ed1-unidirectional-models-fail
  outcome: reproduced
  notebook: reproduce_kaku_2025.ipynb
  output: claim:ed1-unidirectional-models-fail
  notes: 'Inter-breath intervals from fig1d reading (a), inter-lick intervals from reading (b) (within one bout),
    the readings closest to the paper for each rhythm; ranges 0.150 to 0.476 s and 0.119 to 0.265 s (2.5th to 97.5th
    percentiles); latencies 112 ms (last lick to inspiration) and 119 ms (inspiration to next lick). Breathing-driven
    model: Fig 1i difference 0.0 ms in all 162 of 172 simulated sessions with a value (no variance, so no test).
    Licking-driven model: a Fig 1g value in 1 of 172 sessions; 145 have at least 40 two-lick cycles per half, but
    the lick PSTH has a peak above threshold in the fast window in 18 and in the slow window in 12, since simulated
    licks do not lock to inspiration. So the licking-driven result holds because the measure is missing, not because
    a test found no effect. Data: 22.0 and 10.5 ms, both p < 0.001. The breathing-driven model gives a Fig 1g effect
    (59.3 ms, 141 sessions) and the licking-driven model a Fig 1i effect (35.9 ms, 169 sessions).'
  deviations:
  - Simulated sessions match the data sessions in the number of in-bout inspirations (breathing model) or licks
    (licking model); sessions with fewer than 50 in-bout inspirations are skipped.
  - Licks are added evenly inside inter-lick intervals longer than the 97.5th percentile (breathing model), and
    an inspiration is omitted when it would follow the previous one by less than the 2.5th percentile inter-breath
    interval (licking model); the Methods describe both steps without numbers.
