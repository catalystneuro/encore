  outcome: reproduced
  notebook: reproduce_kaku_2025.ipynb
  output: claim:ed8bc-prebotc-inspiration-phase
  notes: With the preBotzinger complex of fig2f (CCF annotation, AMB's whole extent), 18 or 19 breathing units with
    MI > 0.9 lie near it under every reading of tuning and distance, and 14 prefer the inspiration half (74% to
    78%), Rayleigh p < 0.0001. With AMB's extent per AP step (variant) 2 units remain, both in the inspiration half,
    too few for the Rayleigh test (it cannot reach p < 0.05 with 2). Over all 265 breathing units with MI > 0.9
