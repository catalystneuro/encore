      adjacent bouts are counted as one interval, and adjacent bouts are often split by a 1 to 2 frame likelihood
      flicker; dropping between-bout pairs could bring the mean within tolerance.'
    response: 'Fixed B2: reading (b) now takes only onset pairs inside one bout (13,498 between-bout pairs had been
      counted). Licking is 6.07 Hz (3.77 to 8.40) and breathing 4.19 Hz under (b), both means and the licking bounds
      within tolerance, the breathing bounds not; outcome changed to partially reproduced. The notebook prints the
