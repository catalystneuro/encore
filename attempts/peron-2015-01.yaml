findings:
  - kind: data_missing
    statement: The data set holds 5 imaging sessions from 3 of the paper's 8 volume-imaging mice (an197522,
      an229717, an229719), with 20% to 72% of their Table S1 ROIs (26,761 of 108,374 for all eight mice).
      The other five mice, including the Gad2 mouse with labelled GABAergic neurons, the imaging during
      learning, the L4 axon mice, the anesthetized mice, the L5 soma and dendrite pairs, the training
      sessions and the high-resolution reference stacks are not in it, although the paper says the data
      set includes the imaging data of Table S1.
  - kind: metadata_error
    statement: The data description lists raw fluorescence and algorithmically extracted calcium events
      for each ROI, and files named vol_xxx holding multi-session data. The session files hold only dF/F
      (dffTSA) and whisker variables as time series, and no vol_xxx file exists; the imaging archives
      hold registered TIFFs.
  - kind: metadata_insufficient
    statement: No ROI carries a layer (L1, L2/3, L5 apical dendrite), cell-class or barrel-column label,
      and no imaging plane carries a depth or position relative to the others. The description says laminar
      boundaries were drawn in the reference stack, but neither the boundaries nor the stack are deposited,
      so the paper's comparisons between layers, classes and principal and surround columns cannot be
      made from the data set.
  - kind: metadata_error
    statement: One subvolume (an197522, 2013-03-08, dffTSA 10, raw folder fov_04001, 202 ROIs) is a single
      plane imaged at 29 Hz, not three planes at 7 Hz as the description says of every subvolume; and
      many 7 Hz subvolumes have ROIs on only one or two of their three planes. Neither is described.
  - kind: metadata_error
    statement: The event series structure is named eventSeriesArrayHash in the files, not eventSeriesHash
      as described; the file an229717_2013_12_01/an229717_2013_12_01_sesssion.mat has a misspelt name;
      the description's citation of the paper is a placeholder ("Article title. Journal Name xxx").
  - kind: other
    statement: In an197522 on 2013-03-10 the dF/F response to the first touch is not larger with the true
      touch times than with the times shifted by 3 s (3 of 9 subvolumes; median 0.0009 against 0.0083
      dF/F), so that session's imaging could not be shown to share the trial clock. In the other four
      sessions the true alignment gives the largest response in 21 of 25 subvolumes.
  - kind: other
    statement: The whisker angle holds tracking errors that the description does not mention. Samples
      jump to the tracker's +/-90 degree limit for one or two samples (for example 87.3, 37.8, -89.2, 41.7 degrees
      on successive 2 ms samples in an229717), jump briefly to a distant value (-24.1, 72.8, 72.8, 72.1,
      -23.1 in an229719), and protractions past 90 degrees wrap to the other sign (84.6, 89.2, -87.5, -88.7,
      89.3 in an197522). Samples above 85 degrees occur in 26 of 764, 52 of 183 and 2 of 496 valid whisker trials
      of an197522, an229717 and an229719. The largest per-trial angle range, 179.8 degrees, spans these limits.
  - kind: methods_unavailable
    statement: Question for the paper's authors. How was the whisker movement amplitude of 55.5 +/- 13.3
      degrees (Results, paragraph 2) measured? On the three mice in the data set the per-trial angle range
      is 74.7 degrees (72.4 without tracking errors), its range over the sample epoch 29.0, and the peak
      Hilbert amplitude 26.9 (6 to 30 Hz band, also not given), while twice the peak Hilbert amplitude
      is 53.7. Which measure, epoch and band were used, and how were tracking errors handled?
  - kind: methods_unavailable
    statement: Question for the paper's authors. For the event detector's validation (54% of single action
      potentials at 0.01 Hz false positives, n = 7), which recordings of Chen et al. (2013) were used,
      how were they degraded to this study's dwell time and frame rate, and what were the Savitzky-Golay
      window and the matching window?
verifications:
  - date: '2026-11-09'
    kind: agent
    by: Independent agent run by CatalystNeuro (same harness, separate context, did not write the notebook)
