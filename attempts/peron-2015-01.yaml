          rests on only 5 sessions from 3 mice, far fewer than the paper's imaging sessions, so the
          agreement is weak evidence. The 5 deposited sessions may not be a representative sample of the
          paper's imaging sessions, which the notebook does not discuss (problem 7). Whether the trial
          list covers the whole behavioral session or only the imaged part was not checked (C4).
        response: Outcome unchanged. A data-check cell now prints each session's trial ids (1 to 184 up to 1 to
          398, without gaps), the range of imaged trial ids, which lie inside them, and the intervals
          between trials; the tables are consistent with whole behavioural sessions, and trial 1 is
          followed by a pause of 12.5 min to 2.4 h in every session. The conclusion and notes now say that
          the five sessions are the only ones deposited, that how they were chosen is not documented, and
          that the agreement is weak evidence.
      - claim: results-whisking-amplitude
        agrees: false
        outcome: partially_reproduced
        reason: None of the three listed readings lands in [42.2, 68.8]. They give (a) 74.7, (b) 29.0 and (c)
          26.9. Two unlisted variants do. The 1-99 percentile range gives 49.2 and 2 x the Hilbert peak
          gives 53.7. Reading (a) is inflated by +/-90 degree tracking errors; one +/-90 pair turns a 40
          degree range into 180, the per-trial maximum is 179.8, and fixing this needs a reading (a) that
          drops only the artefact samples (problem 1). The per-trial maximum of the Hilbert amplitude over
          the whole trial is inflated by filter and Hilbert edge effects, about 10% on a clean sinusoid,
          and by artefact spikes, so the passing 2 x Hilbert variant is biased upward (problem 2). The
          qualitative part, well above about 20 degrees, holds for every full-sweep measure. Under the
          strict criterion the outcome would be not_reproduced (problem 3). n = 3 of 8 mice.
        response: Outcome kept as not_reproduced, and the disagreement is recorded. A new cell runs what the
          verifier asked for (C2, C3). Without samples above 85 degrees reading (a) is 72.4, without one-
          or two-sample spikes 71.9, and 71.7 to 74.1 with other thresholds; unwrapping protractions that
          pass 90 degrees gives 77.0; only cutting every sample above 70 degrees, which removes real
          protractions, gives 67.4. The artefacts touch 26 of 764, 52 of 183 and 2 of 496 trials, and most
          of the range is real whisking (an229717 median 87.2). The edge effect is confirmed on a sinusoid
          (22.0 against 20.1 without 0.2 s at each end), but on the data leaving out the ends moves
          reading (c) only from 26.9 to 26.6, and twice it, with artefacts interpolated, is 53.2.
          Per-mouse medians of reading (a) average 68.6, inside by 0.2, but the criterion averages per
          mouse. So every listed reading stays outside the tolerance with the artefacts removed, and the
          criterion decides the outcome (protocol, Record the attempt); the unlisted measures that fall
          inside, and the qualitative part that holds, are in the notes. The tracking errors are a new
          finding.
