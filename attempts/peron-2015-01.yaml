  - claim: fig1e-days-to-criterion
    outcome: blocked
    blocked_by: data_missing
    notes: The data set holds no training sessions, only five imaging sessions of trained mice.
  - claim: results-trials-per-session
    outcome: reproduced
    notebook: reproduce_peron_2015.ipynb
    output: claim:results-trials-per-session
    measured: 290.2
    notes: The five sessions hold 398, 370, 184, 231 and 268 behavioural trials. Pooled over sessions
      the mean is 290.2 (SD 91.2), and the mean of the three per-mouse means (384.0, 184.0, 249.5) is
      272.5; both are within 245 +/- 71. Counting only trials with imaging gives 238.6 pooled and 225.2
      over mice.
    deviations:
      - Five sessions of 3 of the paper's 8 mice; the paper's number covers every imaging session of 8
        mice.
  - claim: results-whisking-amplitude
    outcome: not_reproduced
    notebook: reproduce_peron_2015.ipynb
    output: claim:results-whisking-amplitude
    measured: 74.7
    notes: Means over the three mice (per mouse 70.6, 99.2, 54.2 for a) are (a) 74.7 degrees for the per-trial
      angle range over the trial, (b) 29.0 over the sample epoch and (c) 26.9 for the peak Hilbert amplitude
      (6 to 30 Hz; 22.2 to 30.4 with the other bands shown); none is within 55.5 +/- 13.3 (42.2 to 68.8).
      Two measures the criterion does not list fall inside it, the 1st to 99th percentile range of angle
      per trial (49.2) and twice the peak Hilbert amplitude, a peak-to-peak measure (53.7 +/- 15.7). The
      paper does not define the measure; the question is recorded as a finding for its authors. 1,443
      trials (764, 183, 496 per mouse).
    deviations:
      - Three of the paper's eight mice, five sessions.
      - The sample epoch is the pole-in-reach interval of the data set's poleInReach series (the paper's
        "1 s sample epoch (pole in reach)", Results, Imaging Large Neuronal Populations, paragraph 1).
      - The band used to isolate whisking before the Hilbert transform (reading c) is not given in the
        paper or in the Supplemental Experimental Procedures, which cite Huber et al. (2012); 6 to 30
        Hz is used, with 4 to 30 and 8 to 25 Hz shown. Every band gives the same outcome, so the outcome
        does not rest on it.
      - Only trials the data set lists as valid whisker trials are used; rare angle samples at +/-90 degrees
        (at most 0.06% of samples), which look like tracking errors, are kept, as the criterion's maximum
        minus minimum includes them; the 1st to 99th percentile range is shown as a variant.
