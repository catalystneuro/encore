  - claim: table-s1-roi-counts
    outcome: blocked
    blocked_by: data_missing
    notes: The data set holds 3 of the 8 mice (an197522, an229717, an229719), with one or two sessions
      each where the paper imaged about four sessions per subvolume. Distinct ROIs per mouse are 11,649,
      3,771 and 11,341 against 16,200, 19,012 and 18,125 in Table S1 (72%, 20%, 63%), 26,761 in all against
      108,374. The spared whiskers named in the files (D2, D3, D2) match Table S1. The count the claim
      tests rests on sessions that are not deposited, so it cannot be compared.
  - claim: fig2-core-counts
    outcome: blocked
    blocked_by: metadata_insufficient
    notes: The data set's ROIs carry no layer, cell-class or column label, and its planes no depth or
      position relative to one another (data check). The claims file's shared method M6 says the claims
