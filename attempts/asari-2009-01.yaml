    within tolerance of 204 and 0.669. With the proportion at time t over all 305 probes, one minus the noise-corrected
    cumulative probability at 1 s is 0.252 (tolerance 0.213 to 0.261) and the cumulative curve peaks at 4.78 s (paper
    4.72 s); over the probes still running it is 0.267, outside tolerance. Without silence as a context, 165 probes
    are significant (0.541) and the late fraction is 0.17 to 0.18, outside tolerance. 35 of 39 cells have a significant
    probe; over the 34 animals the fraction of significant probes has median 0.66 (range 0 to 1). The mean noise
    floor is 2.2e-3 (all probes) or 2.8e-3 (running).
  deviations:
  - Probe responses are formed as the paper's analysis script asari/Tools/CxtDep.m (in the data set) forms them,
    a detail the Methods leave open. Each sequence presentation is cut at its trigger, fragments at the sum of the
    rounded durations before them, the first 'Effective repeats' presentations are used, silence is a context (the
    last 4 s before a sequence) and a probe (the first 2.5 s after it), and each context is cut to the smallest
    number of trials.
  - 'The significance measure follows the Methods (Kruskal-Wallis at every 0.1-ms point, P < 0.01 for at least 5
    ms, noise floor from 1000 shuffles of trials across contexts) with the details of KWtest in CxtDep.m: ordinal
    ranks with ties broken by trial order, no tie correction, a run kept when its last and first points are at least
    50 samples apart, and whole trials shuffled. A variant with average ranks gives the same count.'
  - Probes differ in length (1.98 to 6.06 s). The paper does not say how the population curves treat times after
    a probe has ended; both readings the claims file names (over all probes, an ended probe counting as zero; over
    the probes still running) are shown.
- claim: fig3a-significance-decay
  outcome: partially_reproduced
  notebook: reproduce_asari_2009.ipynb
  output: claim:fig3a-significance-decay
  measured:
  - 0.149
  - 0.252
  - 0.079
  - 0.968
  - 0.0025
  notes: Eq. 44 with the constant fixed at the mean noise floor of the fit range. Two exponentials are selected
    by the paper's rule under every reading with silence counted. Over all probes, fitted to 4.72 s, the values
    are 0.149, 0.252 s, 0.079, 0.968 s with a noise floor of 2.5e-3; only the slow constant is within tolerance.
    Over the running probes they are 0.159, 0.265 s, 0.068, 1.075 s with 2.8e-3; the fast size and the noise floor
    are within tolerance. The fast constant is 0.25 to 0.27 s in every reading, against 0.20 s. Without silence
    as a context one exponential is selected. The slow constant is between 0.5 and 2 s, which meets the rule for
    partial.
  deviations:
  - Probe responses are formed as the paper's analysis script asari/Tools/CxtDep.m (in the data set) forms them,
    a detail the Methods leave open. Each sequence presentation is cut at its trigger, fragments at the sum of the
    rounded durations before them, the first 'Effective repeats' presentations are used, silence is a context (the
    last 4 s before a sequence) and a probe (the first 2.5 s after it), and each context is cut to the smallest
    number of trials.
  - 'The significance measure follows the Methods (Kruskal-Wallis at every 0.1-ms point, P < 0.01 for at least 5
    ms, noise floor from 1000 shuffles of trials across contexts) with the details of KWtest in CxtDep.m: ordinal
    ranks with ties broken by trial order, no tie correction, a run kept when its last and first points are at least
    50 samples apart, and whole trials shuffled. A variant with average ranks gives the same count.'
  - Probes differ in length (1.98 to 6.06 s). The paper does not say how the population curves treat times after
    a probe has ended; both readings the claims file names (over all probes, an ended probe counting as zero; over
    the probes still running) are shown.
  - Fractional powers follow FracPow in CxtDep.m, where each trial is centred on its mean over the probe period
    before Eqs. 17 and 18 (the Methods centre the trace over time). Curves are averaged in 1-ms bins before the
    exponential fits, and the fits start from a grid of time constants (standard choices).
  - The fits bound the sizes at zero; without the bound the two-exponential fit degenerated into two large opposite
    terms in development.
