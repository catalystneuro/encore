- claim: timescale-longer-than-membrane
  outcome: reproduced
  notebook: reproduce_asari_2009.ipynb
  output: claim:timescale-longer-than-membrane
  notes: The mean normalized autocorrelation of the trial-to-trial noise (Eq. 14 residuals, 305 probes) falls below
    1/e at 73 ms and below 0.1 at 116 ms; per probe the 1/e lag has median 72 ms and maximum 152 ms. Over the intersequence
    silences of 46 recordings the spontaneous autocorrelation falls below 1/e at 78 ms (77 ms without the first
    1 s) and below 0.1 at 124 ms. Both 1/e lags are under 150 ms and under a third of 1.04 s.
  deviations:
  - Probe responses are formed as the paper's analysis script asari/Tools/CxtDep.m (in the data set) forms them,
    a detail the Methods leave open. Each sequence presentation is cut at its trigger, fragments at the sum of the
    rounded durations before them, the first 'Effective repeats' presentations are used, silence is a context (the
    last 4 s before a sequence) and a probe (the first 2.5 s after it), and each context is cut to the smallest
    number of trials.
  - Each trace is mean-removed before its autocorrelation, and per-probe autocorrelations are normalized at lag
    0 before averaging (Eq. 45 normalizes by the noise variance).
