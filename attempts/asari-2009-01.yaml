- claim: fig8a-proportion-by-property
  outcome: partially_reproduced
  notebook: reproduce_asari_2009.ipynb
  output: claim:fig8a-proportion-by-property
  measured:
  - 56
  - 57
  - 17
  - 10
  - 45
  notes: Significant probes are 56 of 95 (0.589) for amplitude, 57 of 105 (0.543) for frequency, 17 of 39 (0.436)
    for AM, 10 of 25 (0.400) for FM and 45 of 137 (0.328) for higher-order, in 30, 29, 26, 24 and 27 cells. Every
    count is outside tolerance of 77, 73, 62, 47 and 59. The proportions keep the order amplitude > frequency and
    AM > FM > higher-order, which meets the rule for partial. The AM and FM counts rest on far fewer probes than
    the paper's.
  deviations:
  - Probe responses are formed as the paper's analysis script asari/Tools/CxtDep.m (in the data set) forms them,
    a detail the Methods leave open. Each sequence presentation is cut at its trigger, fragments at the sum of the
    rounded durations before them, the first 'Effective repeats' presentations are used, silence is a context (the
    last 4 s before a sequence) and a probe (the first 2.5 s after it), and each context is cut to the smallest
    number of trials.
  - 'The significance measure follows the Methods (Kruskal-Wallis at every 0.1-ms point, P < 0.01 for at least 5
    ms, noise floor from 1000 shuffles of trials across contexts) with the details of KWtest in CxtDep.m: ordinal
    ranks with ties broken by trial order, no tie correction, a run kept when its last and first points are at least
    50 samples apart, and whole trials shuffled. A variant with average ranks gives the same count.'
  - Assumption. The paper tests each property with only the conditioning stimuli that differ in it (Methods, Stimulus
    design, paragraph 2) and gives the probe counts per ensemble and property (Table 1), but not which stimuli of
    each recording form a set. The sets are rebuilt from each recording's stimulus metadata (asari.property_families).
    The sets listed in the notes of the 19-stimulus MHT recordings are used as listed; elsewhere, amplitude (attenuation)
    and bandwidth or frequency variants of TORCs, DMRs and natural sounds, MHTs that share every parameter but one,
    and each natural sound with its modulated colored noise. For each probe and property the largest set it was
    tested with is used. This gives 95 amplitude and 137 higher-order probes as in Table 1, 105 frequency probes
    against 110, and only 39 AM and 25 FM probes against 96 and 82, so the AM and FM sets of the paper are not recovered.
  assumed: true
