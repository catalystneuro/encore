    before Eqs. 17 and 18 (the Methods centre the trace over time). Curves are averaged in 1-ms bins before the
    exponential fits, and the fits start from a grid of time constants (standard choices).
  - Assumption. The paper tests each property with only the conditioning stimuli that differ in it (Methods, Stimulus
    design, paragraph 2) and gives the probe counts per ensemble and property (Table 1), but not which stimuli of
    each recording form a set. The sets are rebuilt from each recording's stimulus metadata (asari.property_families).
    The sets listed in the notes of the 19-stimulus MHT recordings are used as listed; elsewhere, amplitude (attenuation)
    and bandwidth or frequency variants of TORCs, DMRs and natural sounds, MHTs that share every parameter but one,
    and each natural sound with its modulated colored noise. For each probe and property the largest set it was
    tested with is used. This gives 95 amplitude and 137 higher-order probes as in Table 1, 105 frequency probes
    against 110, and only 39 AM and 25 FM probes against 96 and 82, so the AM and FM sets of the paper are not recovered.
  - Only the probe reading of a resampled 'sample' is run; resampling trials within probes needs the single trials,
    which the pass does not keep. The interval of each ratio resamples the property and the natural sounds independently.
  assumed: true
