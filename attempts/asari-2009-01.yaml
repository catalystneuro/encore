- claim: methods-recording-counts
  outcome: partially_reproduced
  notebook: reproduce_asari_2009.ipynb
  output: claim:methods-recording-counts
  measured:
  - 133
  - 39
  - 305
  - 0
  - 0
  - 93
  - 14
  notes: Under the paper's rule (at least two conditioning stimuli, at least 4 trials in A1 and 10 in MGB), the
    natural sound group of Summary.mat gives 305 probes in 39 cells and the MGB group 93 probes in 14 cells, with
    silence counted as a context or not; these match. All A1 whole-cell recordings with sequences give 133 cells
    (644 probes) against the paper's 123. By ensemble, TORC (14 cells) and MCN (27) match, DMR gives 15 cells against
    6 and MHT 26 against 39, and 14 cells were tested with SoundTrans variants of natural sounds, which the paper's
    list does not name. The data set holds no voltage-clamp recording (every file is whole-cell current clamp in
    mV or cell-attached), so the 29 voltage-clamp probes in 14 cells are recorded as 0; that part of the claim cannot
    be tested here. The data set holds 145 A1 whole-cell cells and 14 MGB cells in all, against 194 and 16 recorded.
  deviations: &id001
  - Probe responses are formed as the paper's analysis script asari/Tools/CxtDep.m (in the data set) forms them,
    a detail the Methods leave open. Each sequence presentation is cut at its trigger, fragments at the sum of the
    rounded durations before them, the first 'Effective repeats' presentations are used, silence is a context (the
    last 4 s before a sequence) and a probe (the first 2.5 s after it), and each context is cut to the smallest
    number of trials.
- claim: a1-mgb-firing-rates
  outcome: partially_reproduced
  notebook: reproduce_asari_2009.ipynb
  output: claim:a1-mgb-firing-rates
  measured:
  - 0.474
  - 0.695
  - 0.618
  - 5.072
  notes: Mean over cells, each cell pooling its files. A1 with a 10 mV/ms upstroke detector over all files is 0.474
    Hz spontaneous (SD 0.603) and 0.695 Hz evoked (SD 0.893), against 0.47 (0.61) and 0.57 (0.77); over the context
    files only it is 0.637 and 0.705 Hz. The starting values of the code's manual detector give 0.17 to 0.20 and
    0.21 Hz. MGB with the code's automatic detector is 0.618 Hz spontaneous (SD 1.134) and 5.07 Hz evoked (SD 11.46)
    over all files, 0.551 and 4.99 Hz over the context files, against 0.78 (1.25) and 11.4 (16.9). Only the A1 spontaneous
    mean of one reading is within tolerance. A1 means are below 1 Hz under every reading and the MGB evoked mean
    is above 5 Hz over all files, which meets the criterion's rule for partial. The data set has 145 A1 and 14 MGB
    cells, not 194 and 16.
  deviations:
  - The paper does not say how A1 spikes were detected; its code (ViewResp.m, GetSpikes.m) detects them by hand
    for whole-cell data. Two detectors are run, the starting values of the code's manual detector (threshold 1 on
    its high-passed trace) and a 10 mV/ms upstroke with a 2-ms dead time (a standard choice). MGB spikes use the
    code's automatic detector (high-pass filter, threshold two thirds of the largest filtered value), which ViewResp.m
    applies to cell-attached data; the Methods say only 'a high-pass filter and thresholding'.
  - Spontaneous periods are the silences between stimuli and evoked periods the stimuli, split as GetEvoked.m does;
    the readings are all of a cell's files (with tuning curves) or its sequence files only.
