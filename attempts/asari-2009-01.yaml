- claim: figs1-silence-probe
  outcome: reproduced
  notebook: reproduce_asari_2009.ipynb
  output: claim:figs1-silence-probe
  notes: 44 silence probes (2.39 or 2.5 s) in 38 cells, 26 of them significant; 19 cells have a significant period
    starting within 0.5 s of the silence onset. The stimulus-related power (Eq. 17) averaged over the silence probes
    is 5.60 mV^2 in the first 10 ms and first falls below 10% of that at 0.55 s; from 1.0 to 1.1 s it averages -0.09
    mV^2. Some later bins exceed 10% again (mean 0.45 mV^2 from 2 to 2.5 s). The context-dependent power (Eq. 19)
    falls below 10% at 0.47 s.
  deviations:
  - Probe responses are formed as the paper's analysis script asari/Tools/CxtDep.m (in the data set) forms them,
    a detail the Methods leave open. Each sequence presentation is cut at its trigger, fragments at the sum of the
    rounded durations before them, the first 'Effective repeats' presentations are used, silence is a context (the
    last 4 s before a sequence) and a probe (the first 2.5 s after it), and each context is cut to the smallest
    number of trials.
  - 'The significance measure follows the Methods (Kruskal-Wallis at every 0.1-ms point, P < 0.01 for at least 5
    ms, noise floor from 1000 shuffles of trials across contexts) with the details of KWtest in CxtDep.m: ordinal
    ranks with ties broken by trial order, no tie correction, a run kept when its last and first points are at least
    50 samples apart, and whole trials shuffled. A variant with average ranks gives the same count.'
  - The onset value is the mean over the first 10 ms, and the power is compared in 10-ms bins (standard choices).
findings:
- kind: data_missing
  statement: The data set holds no voltage-clamp recording. The paper analyses 29 probes in 14 of 42 voltage-clamped
    A1 cells (Figures 5 and 6), but every one of Asari's 346 files is a whole-cell current-clamp recording in mV
    or a cell-attached recording, and Summary.mat lists only current-clamp, cell-attached and unpublished groups.
    The conductance findings cannot be tested.
- kind: data_missing
  statement: The example recording of Figure 7 (a natural sound probe after DMRs in 0.625-2.5, 2.5-10 and 10-40
    kHz) is not in the data set; no recording has DMR conditioning stimuli in those bands.
- kind: other
  about: data
  statement: The data set holds 145 A1 whole-cell cells and 14 MGB cells, against the 194 current-clamp and 16 MGB
    cells the paper recorded. Its natural sound and MGB groups hold exactly the 39 cells with 305 probes and the
    14 cells with 93 probes the paper analysed. The synthetic sound group holds 96 cells; with the natural sound
    group, 133 cells meet the paper's rule for analysis against its 123, and the ensembles split differently from
    the paper's list (DMR 15 cells against 6, MHT 26 against 39, and 14 cells with SoundTrans variants of natural
    sounds).
- kind: metadata_insufficient
  statement: Which conditioning stimuli of a synthetic sound recording vary which sound property (the sets behind
    Table 1 and Figure 8) is listed in the notes of only the 19-stimulus MHT recordings. For the others it has to
    be rebuilt from the stimulus parameters and descriptions, and the rebuilt sets give the paper's counts for amplitude
    and higher-order probes but far fewer AM and FM probes (39 and 25 against 96 and 82).
- kind: metadata_error
  statement: Summary.mat lists two cells, 20060314-ha1-001 and 20060320-ha3-003, in both the natural sound and the
    synthetic sound group, so their tuning-curve files are named twice. The recordings are the same files; no two
    files hold identical traces.
- kind: methods_unavailable
  statement: 'Question for the authors. Probes last 2 to 6 s. How do the population curves of Figures 3, 4, 8 and
    9D treat times after a probe has ended: is the average at time t over all probes, an ended probe counting as
    zero (or not significant), or over the probes still running? The late fraction of Figure 3A matches the paper
    (0.252 against 0.237) only with the first reading.'
- kind: methods_unavailable
  statement: Question for the authors. Which conditioning stimuli of each recording form the sets for amplitude,
    frequency, AM, FM and higher-order changes in Table 1 and Figure 8? In particular, how do the MHT recordings
    give 71 AM and 57 FM probes with MHT probes, when in most of them an MHT probe follows only the natural sound
    or silence?
- kind: methods_unavailable
  statement: Question for the authors. How were A1 spikes detected for the firing rates (0.47 and 0.57 Hz), and
    which periods count as spontaneous and evoked, in A1 and in MGB? The analysis code in the data set detects whole-cell
    spikes by hand, and its automatic detector for cell-attached data gives MGB rates of 0.62 and 5.1 Hz against
    0.78 and 11.4 Hz.
- kind: paper_inconsistency
  statement: The Results give 73 of 110 probes as 64.6% for frequency changes; 73/110 is 66.4%, and 64.6% is the
    AM proportion of the next sentence (62/96).
- kind: code_mismatch
  statement: The paper's analysis script CxtDep.m centres each trial on its own mean over the probe period before
    computing the fractional powers, where the Methods centre the whole trace over time. It also counts silence
    as a context of every probe, which the Methods do not say. The attempt follows the script.
