- claim: fig9-cell-counts
  outcome: not_reproduced
  notebook: reproduce_lefebvre_2008.ipynb
  output: claim:fig9-cell-counts
  measured:
  - 200
  - 122
  notes: The data set's labels give 200 mutant units (87 Chx10-Cre in 6 retinas, 113 Pax6-Cre in 4)
    and 122 control units (95 labelled "WT (chx10 het)" in 3 retinas, 27 "WT (pax6 het)" in 2),
    against 115 (103.5 to 126.5) and 143 (128.7 to 157.3). Every unit fired during the bar
    stimulus. Units whose STA peak exceeds 1.5 times the null's number 138 mutant and 113 control;
    above 2 times, 103 and 107. Neither mutant count shown is inside its tolerance (103 is just below
    103.5), but the mutant count falls from 138 to 103 between the two thresholds, so a threshold
    between them could put it inside, and with the 20080702 frames as deposited the count above 1.5
    is 126, inside it. No count of control units can exceed 122, so the counts miss under any reading
    of a flicker response because of the control count. Without the second unit of each duplicate pair, 189 and 118. The Bax -/- retina (3
    units) is in neither group. The notebook tabulates the units per retina and label; the files do
    not give the region recorded in the Pax6-Cre retinas, so the paper's peripheral subset cannot
    be formed.
  deviations:
  - The claims file asks also for the count of units with a flicker response without defining
    one; the counts above two thresholds of the STA peak over a null STA are shown as a standard
    choice, and none can change the outcome.
  - The control retinas are as the data set labels them; 95 of the 122 control units carry a label
    ("WT (chx10 het)") that the paper's description of its controls does not include.
