- claim: fig9d-rf-size-similar
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_lefebvre_2008.ipynb
  output: claim:fig9d-rf-size-similar
  notes: The outcome rests on one borderline combination and on the frame correction of the 20080702
    bar recordings. The readings disagree. In 17 of 18 combinations (3 recording readings, 2 separations, 3
    bands) the 95% bands separate with mutant centres smaller; under reading B with the svd
    separation the DKW bands overlap (median 134 against 156 um, KS p = 0.004). Reading A, svd,
    median 122 against 156 um (KS p below 1e-4). This follows the correction of the frame of the
    20080702 bar recordings; with the frames as deposited the reading B DKW bands separate too and
    all 18 separate, which was the outcome (not_reproduced) of the first run. Much of the
    difference comes from mutant units with weak STAs (97 of 200 mutant and 15 of 122 control units
    have an STA peak less than twice the null's). Among units above that, the medians are 145 and
    158 um (reading A, KS p = 0.19), the binomial and bootstrap bands separate only between 82 and
    101 um, and the DKW bands overlap; over the three readings 13 of 18 combinations separate in that
    subset, and 1 of the 6 DKW ones, so the outcome there is blocked too. With the 16.6 um bars alone
    16 of 18 separate (the svd DKW bands overlap under readings A and B), and with Pax6-Cre mutants
    alone the svd DKW bands overlap under reading A. Under shuffled group labels the binomial and bootstrap bands of this measure
    separate in 38 and 45% of shuffles and the DKW band in none. The answer to the question in
    questions/crcns-ret-1.yaml (which bar recording) found that the paper does not say, and the
    criterion requires the outcome under the three recording readings A, B and C, which are run
    here.
  deviations:
  - All 5 retinas recorded with 8.3 um bars are mutant; every control retina was recorded with
    16.6 um bars.
  - The mutant group cannot be restricted to the peripheral region of the Pax6-Cre retinas, as the
    data set does not say where they were recorded.
  - The vertical bars of 20080702_R1 and 20080702_R4 are rebuilt with a frame of 16.6718 ms, the
    frame of the other bar recordings, not the stated 16.6691 and 16.6653 ms (see findings).
- claim: s3-receptive-field-surrounds
  outcome: reproduced
  notebook: reproduce_lefebvre_2008.ipynb
  output: claim:s3-receptive-field-surrounds
  notes: Under all 12 readings (3 recording readings, 2 separations, depths of 10% and 20%) at
    least one mutant and one control unit have a lobe of opposite sign on both flanks of b(x);
    reading A, svd, 20%, 90 of 200 mutant and 16 of 122 control units. The same rule applied to
    null STAs (spike counts shifted by half the recording) is met by 194 to 198 of 200 mutant and
    119 to 121 of 122 control units, so the rule is met by noise. Among units with an STA peak above
    twice the null's, at least 7 mutant and 4 control units meet it at 20% in every reading. The
    outcome follows the criterion, but the result is no evidence for or against surrounds.
  deviations:
  - The vertical bars of 20080702_R1 and 20080702_R4 are rebuilt with a frame of 16.6718 ms, as for
    fig9d-rf-size-similar.
- claim: fig9e-slower-time-course
  outcome: reproduced
  notebook: reproduce_lefebvre_2008.ipynb
  output: claim:fig9e-slower-time-course
  notes: In all 36 combinations (3 recording readings, 2 separations, 2 peak readings, 3 bands)
    the bands separate with the mutant curve at longer times, and in none do they separate the
    other way; mutant medians exceed control ones by 16.7 to 33.3 ms (reading A, svd, frame, 125
    against 108 ms), KS p at most 6e-10. The DKW band, which never separated under shuffled labels,
    separates in every combination. The result holds in every variant, including units with clear
    STAs (103 mutant, 107 control), each Cre line alone and the Pax6-Cre heterozygous controls alone
    under reading A, and among units with clear STAs, with 16.6 um bars alone and with the 20080702
    frames as deposited under all three readings (36 of 36 separate in each). With the frames as
    deposited, 8 binomial and bootstrap combinations (peak separation, readings A and C) also hold 1
    or 2 values where the bands separate the other way; with the frames corrected none do. The
    statement's "significantly" has no named test in the
    paper; the KS test is shown.
  deviations:
  - Lag j is placed at (j + 0.5) frames, the data set's example script's convention; the offset
    is the same for every unit.
  - The vertical bars of 20080702_R1 and 20080702_R4 are rebuilt with a frame of 16.6718 ms, as for
    fig9d-rf-size-similar.
- claim: fig9f-lower-firing-rate
  outcome: reproduced
  notebook: reproduce_lefebvre_2008.ipynb
  output: claim:fig9f-lower-firing-rate
  notes: In all 9 combinations (3 recording readings, 3 bands) the bands separate with the mutant
    curve at lower rates, DKW included; reading A, median 3.82 against 9.02 Hz (ratio 0.42; 0.38 to
    0.45 over readings). By retina, mutant medians 1.9 to 15.9 Hz, control 3.8 to 23.6 Hz. Every
    variant gives a lower mutant median; with Pax6-Cre mutants alone (ratio 0.68) and among units
    with clear STAs (0.66), the DKW bands overlap while the binomial and bootstrap bands separate
    (those two separate in 38 and 39% of label shuffles for this measure). With the Pax6-Cre
    heterozygous controls alone (ratio 0.41) the DKW bands separate. The outcome depends on using all
    units, as the claims file's header reads the groups (all units of each group, the paper naming no
    exclusion). Among units with clear STAs, over the three readings, 6 of 9 combinations separate
    and no DKW one, which the criterion would call blocked. With the frames as deposited and with
    16.6 um bars alone all 9 separate. The answer to the question in
    questions/crcns-ret-1.yaml (which bar recording) found that the paper does not say; the
    criterion requires the three recording readings A, B and C, with the pooled spike count and
    duration under B, as run here.
- claim: fig9g-threshold-unaltered
  outcome: not_reproduced
  notebook: reproduce_lefebvre_2008.ipynb
  output: claim:fig9g-threshold-unaltered
  notes: In all 36 combinations (3 recording readings, 2 fits, 2 forms, 3 bands) the bands
    separate, with mutant thresholds higher, DKW included; reading A, frame fit, median 1.12 against
    0.44 SD of the generator (continuous form) and 1.69 against 0.01 (printed form). Part of this
    comes from mutant units with weak STAs, whose generator predicts little of the rate; among units
    with clear STAs the medians are 0.86 against 0.41 (reading A, frame fit, continuous form), and
    over the three readings 24 of 36 combinations separate and no DKW one, which the criterion would
    call blocked. The outcome depends on using all units, as the claims file's header reads the
    groups. With the frames as deposited and with 16.6 um bars alone all 36 separate. The binned fit
    in the printed form stops at a grid edge in 107 of 200 mutant fits, all at the top, and 39 of 122
    control fits, 33 at the top and 6 at the bottom (reading A); why they reach the top is not shown.
    Without the edge fits its medians are -0.03 and -0.03 (KS p = 0.21) and its DKW and bootstrap
    bands overlap, but that comparison drops most high mutant fits by construction and is no
    evidence that the threshold is unaltered. The frame fit in the continuous form has 1 fit per
    group at a grid edge, at the top, and separates under every band. With the Pax6-Cre heterozygous controls alone the DKW bands still separate.
  deviations:
  - Theta is searched on 99 quantiles of y for the frame fit and at every split between the 20 bin
    centres for the binned fit, a standard choice of resolution; the binned grid cannot place theta
    above the last split, which many printed-form fits reach.
  - The vertical bars of 20080702_R1 and 20080702_R4 are rebuilt with a frame of 16.6718 ms, as for
    fig9d-rf-size-similar.
- claim: fig9h-gain-reduced
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_lefebvre_2008.ipynb
  output: claim:fig9h-gain-reduced
  notes: The readings of the nonlinearity's form disagree. With the printed form (B + G y above
    theta), mutant gains are lower and the bands separate in all 18 combinations (reading A, frame
    fit, median 18.4 against 23.1 Hz per SD, ratio 0.80). With the continuous form (B + G (y -
    theta)), the bands overlap in 9 of 18, separate with mutant gains lower in 4 (reading B,
    binomial and bootstrap) and the other way in 5 (readings A and C); the DKW bands overlap in all
    6 continuous-form combinations (reading A, frame fit, median 30.4 against 30.8, KS p = 0.76).
    Under reading B the continuous-form separations rest mostly on the 4 to 13 mutant gains below the
    lowest control gain, and under reading A, frame fit, bootstrap, on 1 mutant against 6 control
    cells; the others lie inside the distributions (reading A, binned fit, 165 of 200 mutant and 113
    of 122 control cells at or below 41.46; reading C, frame fit, 16 to 19 mutant against 23 to 25
    control cells near 21.2). Among units with clear STAs neither form gives lower mutant gains under
    reading A (printed 23.1 against 23.4, continuous 33.1 against 31.0); over the three readings in
    that subset the printed form separates with mutant gains lower in 6 of 18 combinations and the
    continuous form in 4, with 6 the other way and no DKW separation, so the outcome there is blocked
    too. With the frames as deposited the continuous form separates in 4 of 18, all with mutant gains
    lower, and the outcome is the same. On synthetic cells that follow
    the continuous form (theta 0.5, G 20), the printed-form frame fit returns theta 0.75 and G 13.4,
    so part of the printed-form gain reduction may mirror the higher mutant thresholds.
  deviations:
  - The vertical bars of 20080702_R1 and 20080702_R4 are rebuilt with a frame of 16.6718 ms, as for
    fig9d-rf-size-similar.
findings:
- kind: data_missing
  statement: The data set holds only the white-noise recordings behind Figure 9D to 9H. The
    histology of Figures 1 to 8 and Supplementary Figure 1, and the flashing-spot, flash, moving-bar
    and grating recordings of Figure 9A to 9C, are not in it, and the paper names no other deposit.
    Of the 26 claims, 19 cannot be tested.
- kind: selection_undocumented
  statement: The data set holds 200 mutant and 122 control units (and 3 from a Bax -/- mutant),
    where the paper's Figure 9 has 115 mutant and 143 control cells. The data set does not say how
    its units relate to the paper's, which were kept, or why the counts differ.
- kind: paper_inconsistency
  statement: The data set labels 95 of its 122 control units "WT (chx10 het)", while the paper's
    Figure 9 legend gives the controls as Pax6-Cre;Pcdh-gamma +/f-del or Pcdh-gamma f-del/f-del
    without Cre. The labels and the paper disagree on what the controls were.
- kind: format_error
  statement: In the 8 recordings of 20080628_R4, 20080628_R6, 20080702_R1 and 20080702_R4, 82 of 86
    spike trains are not in time order. Each runs to 1440 s and then holds a second segment between
    720 and 780 s, though the stimulus runs to 1500 s. The 4 trains in order have spikes between 1440
    and 1500 s, about as many as between 720 and 780 s, and moving the segments by 720 s raises their
    STA peaks over the null in most units. This is consistent with the last minute stored with a 720 s
    offset in place of 1440 s. One checkerboard recording (20080628_R5) has 1 or 2 spikes near 2 s out
    of order in 15 units.
- kind: metadata_error
  statement: The frame lengths stated for the vertical-bar recordings of 20080702_R1 and 20080702_R4
    (16.6691 and 16.6653 ms) are not those of the stimulus. Rebuilt with the stated frame, the bars
    of 20080702_R4 give no STA above the null in any of its 12 units (median ratio 0.96), though all
    12 respond to the checkerboard of the same retina. A scan of the frame peaks at 16.671 to 16.672
    ms in both recordings; with 16.6718 ms, the frame of every other bar recording and half the
    checkerboard frame of the same two retinas, the median ratio is 2.57 and 10 of the 12 units have
    peaks above twice the null's.
- kind: other
  statement: 16 pairs of units share 70 to 100% of their spikes within 0.5 ms in every recording of
    their retina (12 pairs in mutant retinas, 4 in a control retina), most likely single neurons
    sorted twice. The data set does not mark them.
- kind: metadata_insufficient
  statement: The files do not give the age of the mice, the Pcdh-gamma allele (the paper's Results
    say fcon3 and its Figure 9 legend f-del), the region recorded in the Pax6-Cre retinas (the paper
    used their periphery only), or the cell type of the units.
