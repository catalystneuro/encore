- claim: ed2e-no-rebound
  outcome: partially_reproduced
  notebook: reproduce_li_2016.ipynb
  output: claim:ed2e-no-rebound
  notes: 'Experiment 2, lick right trials, ipsilateral photoinhibition, 306 pyramidal neurons above 1
    spike/s. 0 to 400 ms after offset, photoinhibition minus control -0.14 spikes/s (paired t = -0.58,
    p = 0.565); 400 to 800 ms +0.10 (p = 0.617): no rebound on average. In the first window 24 neurons
