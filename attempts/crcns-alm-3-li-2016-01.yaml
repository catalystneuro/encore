    with RMS error near 0) end 25% to 87% away. All draws of all three exceed the 20% criterion. Not simulated:
    the integrator with corrective feedback (ED Fig. 1g), whose weights the paper does not give, and the
    tamed-chaos network (ED Fig. 1i), whose pruning threshold and retuning it does not give.'
  deviations:
  - The simple integrator's matrix is taken as 0.99 u u^T with random u, the FORCE target as a linear
    ramp, with output feedback and an RLS update every 2 ms (standard choices; see models.py).
  - Two of the five model classes could not be simulated for lack of parameters.
  assumed: true
- claim: fig6-modular-models-robust
  outcome: partially_reproduced
  notebook: reproduce_li_2016.ipynb
  output: claim:fig6-modular-models-robust
  notes: 'Modular attractor, noise drawn each step: recovery after unilateral silencing in 100% and 98%
