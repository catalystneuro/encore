- claim: units-and-sessions
  outcome: not_reproduced
  notebook: reproduce_li_2016.ipynb
  output: claim:units-and-sessions
  measured:
  - 1012
  - 20
  - 38
  - 890
  - 89
  - 12
  notes: The 58 non-callosotomy sessions (20 unilateral, 38 bilateral) from 12 mice hold 1012 single units,
    890 labelled pyramidal, all as the paper reports. 89 units are labelled FS and 33 carry no cell-type
    label, against 72 FS and 50 intermediate in the paper. By the trough-to-peak width of the deposited
    mean waveform (29 samples at 19.53 kHz, steps of 0.051 ms) there are 890 pyramidal, 98 FS and 24 intermediate
    units, and 889, 104 and 19 after tenfold spline upsampling. 15 units labelled FS have a width of 0.358
    ms, inside the excluded range. Five of six counts match exactly; the FS count is 24% above the paper's,
    so neither the criterion's full nor its partial rule holds.
  deviations:
  - Cell classes are read from the data set's cellType labels, with the width of the deposited mean waveform
    as a second reading; the paper's width measurement (interpolation, filtering) is not described beyond
    trough to peak.
- claim: ed1-selective-fraction
  outcome: reproduced
  notebook: reproduce_li_2016.ipynb
  output: claim:ed1-selective-fraction
  measured:
  - 633
  - 176
  - 336
  - 493
  notes: 'Correct control trials, lick-early trials excluded, 1.3 s response epoch (reading a of M3 and
    M1, the code''s response window): 633 of 890 pyramidal neurons selective in some epoch, 176 in the
    sample, 336 in the delay and 493 in the response epoch (paper 634, 176, 337, 493). The 1.5 s response
    epoch also matches (635 and 490). With correct and error trials, the trials the deposited script selects,
    the counts are 571, 152, 287 and 404; with lick-early trials included 596, 161, 315 and 433. The first
    400 ms after the cue gives 411 response-selective neurons. 1 neuron could not be tested.'
  deviations:
  - Response epoch taken as the 1.3 s after the cue, from the deposited script (analysis_compile_all_data_unilateral.m,
    significant selectivity); the 0.4 s and 1.5 s readings of M2 are shown. The authors' MATLAB scripts
    deposited in the data set (alm-3/live/analyses_scripts/), which the data description says reproduce
    the paper's figures, are used as the paper's analysis code for details the claims file and the Methods
    leave open; the paper itself links no code.
- claim: fig1d-late-delay-ipsilateral-bias
  outcome: blocked
  blocked_by: data_missing
  notes: The recording sessions hold photoinhibition in the sample, early delay and middle delay windows
    (types 1 to 3, ending 1.6, 0.8 and 0.3 s before the cue by the laser trace); none ends at the go cue.
    The behaviour-only sessions of Fig. 1d are not in the data set; its FAQ says the published data cover
    only the electrophysiology sessions. No other public copy was found.
- claim: fig1d-earlier-photoinhibition-minimal
  outcome: reproduced
  notebook: reproduce_li_2016.ipynb
  output: claim:fig1d-earlier-photoinhibition-minimal
  notes: 'Recording sessions of Experiment 1, 4 mice (paper 5, behaviour sessions). Performance pooled
    per mouse: control 79.5%, early delay 74.5% (drop 5.0 points, paired t-test p = 0.23), middle delay
    74.9% (drop 4.6, p = 0.22). Unpaired tests and per-session means give p from 0.18 to 0.41. No condition
    reaches p < 0.05, and all p-values are above the paper''s 0.1. Sample photoinhibition +0.6 points
    (p = 0.81). With four mice the test has little power; the drops are about five points.'
  deviations:
  - Tested on the recording sessions of Experiment 1 (4 mice, 0.5 s photoinhibition with 100 ms ramp),
    as the behaviour-only sessions of Fig. 1d are not in the data set; the three sessions with the no-ramp
    types -1 to -3 are left out, as the data set says not to analyse them.
  - Performance is hits over hits and errors on performing trials, no-lick and lick-early trials excluded,
    as the data set's Demo_get_performance.m computes it.
- claim: ed3-recovery-interval
  outcome: blocked
  blocked_by: data_missing
  notes: Behaviour-only experiments (ED Fig. 3); the data set's FAQ says they are not included, and only
