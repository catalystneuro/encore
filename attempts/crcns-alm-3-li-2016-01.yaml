- claim: ed4-return-to-trajectory
  outcome: not_reproduced
  notebook: reproduce_li_2016.ipynb
  output: claim:ed4-return-to-trajectory
  measured:
  - 55
  notes: 55 Experiment 1 pyramidal neurons from 4 mice have a significantly lower rate in the last than
    in the first 400 ms of the delay (paper 27 from 6 mice). For the 47 tested, RMS (in units of the neuron's
    mean rate, offset to 0.1 s before the cue) to the time-matched control is 0.526 and to the end point
    0.463 after early-delay photoinhibition (paired t = 2.43, p = 0.019, larger to the time-matched control),
    and 0.551 against 0.526 with the three conditions pooled (p = 0.18). In Experiment 2 (111 neurons,
