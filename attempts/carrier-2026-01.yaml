- claim: fig2f-cb-mixed-model
  outcome: reproduced
  notebook: reproduce_carrier_2026.ipynb
  output: claim:fig2f-cb-mixed-model
  notes: 'Under S-c (all 21 preparations) with frequency as the response and salinity as a number (one
    df), temperature P = 1.5e-19 and the interaction P = 0.0004 are significant and salinity is not, P
    = 0.16 (paper 0.17), the paper''s pattern. The other seven readings give two of the three parts, except
    S-a with log frequency (one). S-b (0.75x set, n = 11, the paper''s n) with frequency: temperature
    P = 1.5e-15, interaction P = 0.0006, salinity P = 0.022. S-a (1.25x set) with frequency: temperature
    P = 3.7e-05, salinity P = 0.30, interaction P = 0.28 (paper 0.025). The reading that gives the pattern
    is not the one whose n matches the paper''s. Wald P values are smaller than Satterthwaite F tests
    would give; salinity (0.16) would stay above 0.05, and temperature and the interaction (0.0004 or
    less) would stay below.'
  deviations:
  - Tested on the authors' per-preparation values in the deposited tables (Crab Metadata.xlsx, Lobster
    Pyloric Frequencies.xlsx, the Prism files), not on burst detection repeated on the raw recordings
    (Spike2 for lobster, ABF for crab), whose burst criteria the paper does not give (Methods, Data Analysis
    and Statistics, custom Spike2 or MATLAB scripts).
  - Mixed model fitted with statsmodels MixedLM (REML, random intercept per preparation, random slopes
    chosen by AIC then BIC among temperature, salinity and both) with Wald tests, in place of lme4 and
    lmerTest's Satterthwaite F tests (R is not in the environment); the Bayes factor comparison is not
    repeated. Temperature and salinity enter uncentered, as numbers or salinity as a factor.
  - Readings run, from the criterion. S-a, S-b, S-c for which ramps enter; F-a and F-b for the response;
    salinity as a number, or as a factor under S-c (2 df there, where the criterion asks for one).
- claim: fig2i-cb-neuron-crash-counts
  outcome: reproduced
  notebook: reproduce_carrier_2026.ipynb
  output: claim:fig2i-cb-neuron-crash-counts
  measured:
  - 9
  - 14
  - 15
  - 4
  - 5
  - 6
  - 20
  - 11
  - 11
  - 9
  notes: All ten counts match (1x all three within one step 9 of 20, PY 14 of 20, PD 15 of 20, LP 20 of
    20; 0.75x PD 4, LP 11 and PY 11 of 11; 1.25x PY 5, PD 6 and LP 9 of 9). The first count depends on
    the reading of "all three neurons crashed at the same temperature". All three crashed in 9 of the
    20 ramps, each with its three crash temperatures within 1.0 C, less than the 2 C ramp step. Reading
    ii (all three crashed, within one step) and reading iii (all three crashed, the same step reached)
    give 9; reading i (exactly equal recorded temperatures) gives 4.
  deviations:
  - Tested on the authors' per-preparation values in the deposited tables (Crab Metadata.xlsx, Lobster
    Pyloric Frequencies.xlsx, the Prism files), not on burst detection repeated on the raw recordings
    (Spike2 for lobster, ABF for crab), whose burst criteria the paper does not give (Methods, Data Analysis
    and Statistics, custom Spike2 or MATLAB scripts).
  - 'Assumed reading ii of "all three neurons crashed at the same temperature" (Results, Changes in Salinity
    Affect the Temperature Dependence of the Pyloric Cycle Period, paragraph 7): all three crashed, with
    crash temperatures less than one ramp step (2 C) apart. The Methods raise the temperature "by 2 C
    every 2 min", and the criterion defines a neuron''s crash as the step at which its bursts stop, so
    crashes within one step are at the same step. Under exactly equal temperatures (reading i) the count
    is 4 and the claim is not reproduced.'
  assumed: true
