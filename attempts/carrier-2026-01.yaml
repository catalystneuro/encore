- claim: fig2f-cb-mixed-model
  outcome: partially_reproduced
  notebook: reproduce_carrier_2026.ipynb
  output: claim:fig2f-cb-mixed-model
  notes: 'No reading gives the paper''s pattern (temperature and interaction significant, salinity not).
    Two of the three parts hold under six of the eight readings run. S-b (0.75x set, n = 11, the paper''s
    n) with frequency: temperature P = 1.5e-15, interaction P = 0.0006, but salinity P = 0.015 (paper
    0.17). S-a (1.25x set) with frequency: temperature P = 3.7e-05, salinity P = 0.30, interaction P =
    0.28 (paper 0.025). Wald P values are smaller than Satterthwaite F tests would give with about 20
    denominator df, which would not change the significance of salinity under S-b at P = 0.015.'
  deviations:
  - Tested on the authors' per-preparation values in the deposited tables (Crab Metadata.xlsx, Lobster
    Pyloric Frequencies.xlsx, the Prism files), not on burst detection repeated on the raw Spike2 recordings,
    whose burst criteria the paper does not give (Methods, Data Analysis and Statistics, custom Spike2
    or MATLAB scripts).
  - Mixed model fitted with statsmodels MixedLM (REML, random intercept per preparation, random slopes
    chosen by AIC then BIC among temperature, salinity and both) with Wald tests, in place of lme4 and
    lmerTest's Satterthwaite F tests (R is not in the environment); the Bayes factor comparison is not
    repeated. Temperature and salinity enter uncentered, as numbers or salinity as a factor.
  - Readings run, from the criterion. S-a, S-b, S-c for which ramps enter; F-a and F-b for the response;
    salinity as a number, or as a factor under S-c.
