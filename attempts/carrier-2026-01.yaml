    and PY 11 of 11; 1.25x PY 5, PD 6 and LP 9 of 9). The first count depends on the reading of "all three
    neurons crashed at the same temperature". Reading i, LP, PY and PD all crashed at one temperature,
    gives 4 of 20; reading ii, every neuron that crashed did so at one temperature (a neuron that kept
    bursting left out), gives 9 of 20, the paper's count, and with it all ten counts match. Reading i,
    the paper's words, is adopted; it misses by five, outside the criterion's band of one. The question
    is put to the authors (findings).
  deviations:
  - Tested on the authors' per-preparation values in the deposited tables (Crab Metadata.xlsx, Lobster
    Pyloric Frequencies.xlsx, the Prism files), not on burst detection repeated on the raw Spike2 recordings,
    whose burst criteria the paper does not give (Methods, Data Analysis and Statistics, custom Spike2
    or MATLAB scripts).
  - 'Assumed reading i of "all three neurons crashed at the same temperature" (Results, Changes in Salinity
    Affect the Temperature Dependence of the Pyloric Cycle Period, paragraph 7): all three neurons crashed,
    at one temperature, as the sentence says. The paper does not define the count further; under reading
    ii the claim is reproduced.'
  assumed: true
- claim: fig2i-cb-neuron-crash-temps-similar
  outcome: reproduced
  notebook: reproduce_carrier_2026.ipynb
  output: claim:fig2i-cb-neuron-crash-temps-similar
  notes: Wald test of the neuron effect P = 0.322 (1x, n = 20 LP, 14 PY, 15 PD), 0.069 (0.75x, 11, 11,
    4) and 0.202 (1.25x, 9, 5, 6) on the chi-square scale, 0.336, 0.106 and 0.254 on the F scale (paper
    0.27, 0.12, 0.27). Friedman variant 0.449 (1x) and 0.368 (0.75x). Neuron means differ by at most 3
    C. The counts of fig2i-cb-neuron-crash-counts that this test uses (crashed neurons per salinity) all
    match the paper.
  deviations:
  - Tested on the authors' per-preparation values in the deposited tables (Crab Metadata.xlsx, Lobster
    Pyloric Frequencies.xlsx, the Prism files), not on burst detection repeated on the raw Spike2 recordings,
    whose burst criteria the paper does not give (Methods, Data Analysis and Statistics, custom Spike2
    or MATLAB scripts).
  - Prism's REML mixed-effects model with neuron as the repeated factor replaced by a linear mixed model
    with a random intercept per preparation (statsmodels, REML) and a Wald test, without the Geisser-Greenhouse
    correction the claims file infers.
