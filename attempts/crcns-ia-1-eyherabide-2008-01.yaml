- claim: method-correlation-error
  outcome: reproduced
  assumed: true
  notebook: reproduce_eyherabide_2008.ipynb
  output: claim:method-correlation-error
  measured: 2.69
  notes: With sigma the SD of the product terms and N their number (reading a), over the whole lag range
    (reading b) and without tau = 0, the error averages 2.69% (SD 1.37%) of the span of C_s over the 115
    kept sessions; reading c gives 2.67%. With tau = 0 in the span all readings give 0.06 to 0.16% or,
    with N the number of trials, 6.5 to 7.9%; over 0 to 1.25 / cutoff without tau = 0 the mean is unstable
    (30 to 4000%).
  deviations:
  - The span of C_s leaves out tau = 0, where C_s holds the self term (two orders of magnitude above the
    rest); the paper does not say. Assumed because the claims file's own detail (1) excludes the zero-lag
    self term from the peak.
  - A third reading of sigma and N (sigma the SD over trials of each trial's C_s, N the number of trials),
    from paragraph 6 ("C_s can be interpreted as an average"), is shown beside the claims file's two.
