- claim: model-reproduces-coding-trends
  outcome: blocked
  blocked_by: data_missing
  notes: Depends on model-matches-classification, blocked because Data1 holds no thresholds s_TH.
findings:
- kind: selection_undocumented
  statement: The paper keeps 86 of 132 sessions by a trial-to-trial rate SD below 35 Hz and a rate near
    100 Hz. In Data1 the SD rule keeps 115 of the 116 sessions of the paper's seven protocols (and all
    116 with whole-trial rates), and nothing marks which sessions the paper kept. Leaving out also the
    9 sessions with fewer than 98 trials and the off-line sorted sessions keeps 89, with 47, 6, 7, 7,
    8, 7 and 7 per protocol against Table 1's 43, 6, 7, 7, 8, 7 and 8, and bursting sessions per protocol
    equal to Table 1's in six of seven, which suggests the paper used only on-line sorted sessions; the
    paper does not say so.
- kind: data_missing
  statement: Data1 holds no threshold, best frequency or f-I measurement for its cells, though the paper's
    model (Eq. 2) uses the measured threshold s_TH and the descriptor says the best frequency was determined
    from f-I curves.
- kind: identifier_missing
  statement: Data1 does not record the animal; the paper's 23 animals can only be matched to the 23 recording
    dates of the seven-protocol sessions by assuming one animal per date. Two experiments (03-01-15-aa,
    03-06-27-ae) are missing from singlecells.txt.
- kind: metadata_insufficient
  statement: 28 sessions use the stimuli gaussModality_co200 and lmd_co200 and 6 use cutoffs of 50 and
    1600 Hz; the descriptor does not describe these stimuli and the paper does not use them. 28 sessions
    sorted off-line have no header, so their target rate and pause are not recorded, and in 25 of them
    each trial block runs on into the pause (spikes up to 2.76 s), which the descriptor does not mention.
    The file Data1/firing_rates is not described; it gives each spike file's trial count and a rate with
    a +/- value of 57 to 189 Hz that is not the trial-to-trial SD of the rate.
- kind: metadata_error
  statement: The descriptor says the 1 s trials number 98 to 533; the files hold 69 to 503. The intensity
    in three trial headers differs from cell.dat by more than 1 dB (03-04-11-aa sig2, 03-04-16-ae sig2,
    03-04-23-ae sig1, up to 6.6 dB), and six sessions of 03-01-30-ad, 03-02-25-ac and 03-02-25-aj had
    450 ms pauses where the paper states 700 ms.
- kind: methods_unavailable
  statement: Questions for the paper's authors. (1) Burst identification; which maximum is the first peak
    of C_s (the first local maximum falls on edge effects of the refractory plateau and leaves 11 of 89
    sessions bursting, 61 when the search starts after the plateau, the largest value below 5 ms 64),
    and what sigma and N are in Delta = sigma / sqrt(N) (the product terms and their number give 2.6%
    of the span when tau = 0 is left out of the span; N the number of trials gives no bursting session).
    (2) Which rule, besides the rate SD, removed the sessions not among the 86; whether the sessions with
    spikes detected off-line and those with fewer than 98 trials were left out. (3) How events were formed
    for the jitter (Rokem et al., 2006). (4) Whether the mean stimulus was subtracted before summing 1BTAs
    in Eq. 15. (5) What separates a peak of C_s for the multi-modal and single-peaked shapes of Figure
    3. (6) Whether the maximum of the nBTA that gives tau_n was searched before burst onset, and how many
    bursts of each n a session needed. (7) Whether I_n(1) was corrected for the bias of the plug-in estimate,
    which here accounts for its rise with n.
- kind: paper_inconsistency
  statement: The paper counts bursting sessions three ways, 63 with n > 1 in Table 1, 59 bursting cells
    for Figure 7B and 58 bursting sessions for Figure 8, without saying why.
