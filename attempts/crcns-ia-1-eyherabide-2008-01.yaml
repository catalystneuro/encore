  notes: Under the main reading the kept sessions with bursts of n > 1 are 52/60, 2/9, 8/8, 9/10, 10/11,
    3/8 and 0/9 against 40/43, 0/6, 7/7, 6/7, 7/8, 3/7 and 0/8; 2 of 7 counts within tolerance, and no
    combination of readings (12) or kept reading does better. The fractions follow the paper's pattern
    except at 3 dB, where 2 of 9 sessions burst.
  deviations:
  - The kept sessions are the 115 of the 116 seven-protocol sessions with a trial-to-trial rate SD below
    35 Hz (reading a of data-sessions-and-trials), not the paper's 86, whose selection is not stated.
