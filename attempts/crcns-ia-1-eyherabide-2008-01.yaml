- claim: data-sessions-and-trials
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_eyherabide_2008.ipynb
  output: claim:data-sessions-and-trials
  measured:
  - 37
  - 23
  - 122
  - 115
  - 69
  - 503
  - 160.3
  - 6.48
  notes: 'The 116 sessions of the seven protocols come from 37 cells (rows of singlecells.txt) recorded
    on 23 dates; the 122 Gaussian AM sessions of any cutoff are within 10% of the paper''s 132 (all 150
    Data1 sessions are not). Under the criterion''s readings the SD < 35 Hz condition keeps 115 of the
    116 (113 with a 100 Hz target, reading b; 116 with whole-trial rates), against 86; over the 115 trials
    range from 69 (outside 98 +/- 9.8) to 503 and average 160.3, and the mean trial-to-trial SD of the
    rate is 6.48 Hz (within 6 +/- 0.6). Selection (c), which also leaves out the 9 sessions under 98 trials
    and the off-line sorted sessions, keeps 89 sessions with 98 to 503 trials (mean 168.7) and a mean
    SD of 6.00 Hz, every value within tolerance; it is not a reading of the criterion, which defines the
    selection by the rate conditions, and its fewest trials are 98 by construction, so it does not decide
    this outcome. The trial blocks were checked: late spikes (up to 2.76 s) occur only in off-line sorted
    sessions, in the pause, no block restarts its times or holds twice the usual spike count, and the
    data set''s firing_rates file gives the same trial counts in 136 of 138 files.'
  deviations:
  - Data1 does not record the animal; the 23 recording dates stand in for the 23 animals, assuming one
    animal per date.
  - Sessions recorded are read as the 122 Gaussian AM sessions; the paper's 132 is not otherwise identifiable.
