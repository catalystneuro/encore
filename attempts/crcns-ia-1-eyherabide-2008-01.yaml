  outcome: reproduced
  notebook: reproduce_eyherabide_2008.ipynb
  output: claim:firing-rate-uniform
  measured:
  - 110.2
  - 16.7
  notes: Over the 115 kept sessions the mean rate is 110.2 Hz (SD 16.7 Hz); one-way ANOVA across the seven
    protocols F = 0.49, p = 0.818. With whole-trial rates 114.7 Hz (SD 16.9), p = 0.471; over all seven-protocol
    sessions p = 0.809.
