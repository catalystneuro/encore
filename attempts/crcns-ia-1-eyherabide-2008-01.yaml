- claim: data-sessions-and-trials
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_eyherabide_2008.ipynb
  output: claim:data-sessions-and-trials
  measured:
  - 37
  - 23
  - 122
  - 115
  - 69
  - 503
  - 160.3
  - 6.48
  notes: The 116 sessions of the seven protocols come from 37 cells (rows of singlecells.txt) recorded
    on 23 dates; the 122 Gaussian AM sessions of any cutoff are within 10% of the paper's 132 (all 150
    Data1 sessions are not). The SD < 35 Hz condition keeps 115 of the 116 (113 with a 100 Hz target,
    reading b; 116 with whole-trial rates), against 86. Over the 115 kept sessions trials range from 69
    (outside 98 +/- 9.8) to 503 and average 160.3, and the mean trial-to-trial SD of the rate is 6.48
    Hz (within 6 +/- 0.6). The kept count and the fewest trials are outside tolerance under every reading,
    the other values within.
  deviations:
  - Data1 does not record the animal; the 23 recording dates stand in for the 23 animals, assuming one
    animal per date.
  - Sessions recorded are read as the 122 Gaussian AM sessions; the paper's 132 is not otherwise identifiable.
