- claim: fig3f-ih-gradient
  outcome: blocked
  blocked_by: not_runnable
  notes: As fig3-other-gradients-fail; Model/Figure3.m and FigureS3f.m are MATLAB.
- claim: fig4d-sag-gradient
  outcome: blocked
  blocked_by: data_missing
  notes: The ex vivo whole-cell recordings are not in dandiset 000987, which holds only extracellular
