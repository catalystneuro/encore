- claim: figs4-no-other-gradients
  outcome: blocked
  blocked_by: data_missing
  notes: As fig4d-sag-gradient; the ex vivo recordings are not deposited.
findings:
- kind: metadata_error
  statement: The dandiset description says the 14 recordings hold 570 isolated units, as the paper's
    Methods do, but the files hold 638 units (31 to 71 per session). 570 is the number of units whose
    DOWN-to-UP PETH crosses half the mean rate within 155 ms, the units entering the paper's Figure 5F.
- kind: data_missing
  statement: The dandiset description lists LFP in each file, but no file holds LFP or any other
    electrical series; only spike times, epochs, sleep scoring, DOWN and UP states and tracking.
- kind: metadata_insufficient
  statement: Units carry no waveform, cell type, channel or depth, and the electrode table gives x, y and
    z as 0 for every channel, so the putative excitatory rule of the Methods (trough-to-peak and rate)
    cannot be applied and units cannot be placed on the probe.
- kind: metadata_error
  statement: session_start_time is 2024-05-09 (the upload day) in every file, while the identifiers carry
    the recording dates (A7801-210225 and so on, 2021).
- kind: metadata_error
  statement: In 9 of 14 sessions part of the SWS (NREM) epochs lies outside the sleep epochs; in
    A7803-210730 one SWS interval, 7,680 to 9,565 s, covers two whole wake (arena) epochs.
- kind: methods_unavailable
  statement: Question for the paper's authors on Figure 5F. Which units enter the RSC test? All 638
    sorted units give the legend's n of 570 entering units and tau = -0.275; the Methods say only EX units
    were analysed, which the deposited files cannot reproduce (no waveforms). This attempt assumed all
    units.
- kind: code_mismatch
  statement: In the paper's code (commit 4ee34f3), the DOWN and UP event file of PoSub session
    A3708-200317b does not fit the spikes of that session in DANDI:000939 (version 0.261016.2310); the
    population rate inside its DOWN states (454.7 Hz) equals that of shifted intervals (455.8 Hz), and no
    shift within 6,000 s fits. The other 15 event files fit (0.0 to 136.7 Hz inside DOWN states).
- kind: metadata_error
  statement: In DANDI:000939 (version 0.261016.2310) the NREM epochs of sleep_states lie partly outside
    the home cage epochs in the paper's sessions, and in A3711-200810b, A3717-201021 and A3723-201115 they
    run 3,508 to 5,092 s past the last spike of the recording.
- kind: other
  statement: In DANDI:000939 the LFP of A3705-200306 covers 11,168 s and that of A3711-200810b 9,499 s,
    while their spikes run to 16,199 s and 12,177 s. In these two sessions and A3708-200317b high gamma
    power does not rise after the DOWN-to-UP transitions of the spikes, which suggests that their LFP and
    spikes do not share a clock.
- kind: metadata_insufficient
  statement: In DANDI:000939 the electrode table gives x, y and z as NaN and does not say in which
    direction rel_y runs along the probe, so the dorsoventral position of units is inferred.
- kind: selection_undocumented
  statement: DANDI:000939 holds 31 mice; the paper used 16 sessions, and which ones is recorded only by
    the event files in the paper's code repository.
- kind: metadata_insufficient
  statement: DANDI:000056, which holds 8 of the 9 ADN sessions the paper's code names, gives no location,
    shank or electrode for its units, so ADN units cannot be selected.
- kind: methods_unavailable
  statement: Question for the paper's authors on Figure 1B. Is HD information in bits per spike or bits
    per second? The formula printed in the Methods gives bits per second, which correlates with depth
    here (tau = 0.082, p = 5.1e-5); bits per spike, the unit used for the Isomap cell selection, does not
    (p = 0.099). This attempt assumed bits per spike.
- kind: methods_unavailable
  statement: Question for the paper's authors on Figure S1I. How is a session halved (first and second
    half, or alternating DOWN states), and which correlation is used? Three of four readings find DU more
    stable than UD; first and second half with Pearson's R does not (p = 0.40).
- kind: methods_unavailable
  statement: Question for the paper's authors on Figure S1L. Were the predictors (DV position and NREM
    firing rate) standardized, and are the coefficients compared signed or in absolute value? Only
    standardized predictors with signed coefficients reproduce both tests.
- kind: methods_unavailable
  statement: Question for the paper's authors on Figure 2 and S2D. How is high gamma power taken from the
    filtered LFP, is the UP onset delay measured from DU or from the delta peak, in which window is the
    maximal slope searched, and how is the UD timing measured on the LFP? Aligned to DU the rise travels
