- claim: pop-within-vs-across-sessions
  outcome: partially_reproduced
  notebook: reproduce_namima_2025.ipynb
  output: claim:pop-within-vs-across-sessions
  measured:
  - 0.0025
  - 0.0295
  - 0.0732
  - 0.0191
  notes: Under all 12 readings same-session pairs are more similar than different-session pairs and pairs within
    200 um more than pairs further apart (Welch p below 1e-4). No reading matches all four means. Pearson's r of
    mean rates gives 0.0021 to 0.0036 across sessions, 0.0295 to 0.0317 within (0.0582), 0.073 to 0.074 within 200
    um (0.0918) and 0.019 to 0.022 beyond (0.0435); the noise-corrected values are 0.006 to 0.009, 0.083 to 0.090,
    0.195 and 0.056 to 0.066. All means are weak.
  deviations:
  - The noise-corrected correlation was written from the Methods' description and Pospisil and Bair (2021) (Materials
    and Methods, Tuning similarity and contrast invariance); its bias terms are written for unequal repeats per
    stimulus (3 to 10 here), which reduce to the published terms with equal repeats. The paper's code is not public.
  - The noise-corrected reading uses point estimates for all pairs so that same- and different-session pairs are
    treated alike; reliable same-session pairs are a variant.
