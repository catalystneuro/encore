findings:
- kind: data_missing
  statement: The dandiset holds spike times of good units only. The LF signal behind the CSD analysis, the RF-mapping
    experiment, the stimulus images and the penetrations' grid coordinates are not in it, so the CSD, feature-model
    and gyral-penetration findings cannot be tested.
- kind: metadata_insufficient
  statement: Shapes are coded by stim_ID 0 to 14 and the position test's positions 0 to 4 without saying which shape
    each code is or which position is the aggregate RF center. The position with the largest population response
    is position 1 in 12 files, 2 in 11, 4 in 5, 0 in 3 and 3 in 3, so the center cannot be read from the data either.
- kind: metadata_error
  statement: The trial tables of all 34 position-test files give the session as '...SL' (the shape test's code),
    while their units tables and file names give '...SP'.
- kind: other
  statement: The shape files hold a third luminance level, 8 cd/m2 (the background luminance), presented as often
    as the dark and bright shapes in 73 of 74 files; the paper and the dandiset description mention only dark and
    bright shapes. The texture files hold the spectral-noise version the description mentions and the paper does
    not use.
- kind: other
  statement: Unit depth is the best channel's distance from the tip in 20 um steps, not the template center of mass
    the Methods use; it gives the paper's distances for the example pairs (260 and 80 um) and spans (2,340 and 2,580
    um).
- kind: paper_inconsistency
  statement: The Methods say shape and texture tests were run in 34 M2 sessions; the dandiset has 34 M2 texture
    files of which 29 share a day and penetration label with a shape file, and 5 (p07, p17, p40, p42, p53) are texture-only
    days. The 2021-05-30 texture file is labelled p40, as is the 2021-05-29 shape file.
- kind: other
  statement: The position test has 34 files, where the paper reports 33 sessions; one (2021-05-29, p40) holds a
    single unit. The shape test of the same day is the penetration with one responsive neuron, where the paper reports
    at least 6 per penetration.
- kind: other
  statement: The texture files do not store the rotation of each presentation, which the Methods say was chosen
    at random from 8.
- kind: other
  statement: Spikes and presentations share a clock in 152 of 159 files (units are tuned to the stimuli at the photodiode
    onsets and not at onsets moved by -1.3 s). It could not be established in five M1 texture files (2020-07-15,
    07-19, 07-29, 07-30, 08-04), where 0% to 12% of units are tuned at the true onsets, nor in the two single-unit
    files of 2021-05-29. In the five texture files 9% to 47% of units fire more on stimuli than on blanks (median
    41% across texture files), so the units respond to stimulus onset but not selectively among the textures, which
    points to stimulus labels that do not match the presentations.
- kind: methods_unavailable
  statement: For the paper's authors. Is a noise-corrected similarity unreliable when the width of its 95% bootstrap
    interval exceeds 0.5, or its half-width, and what interval level is used? Under the width reading, 1,729 neurons
    have a regression line with dark shapes and 681 texture neurons with original textures; under the half-width
    reading 1,805 and 923; the paper has 1,848 and 931. The significant-Isimilarity counts change by 10% to 60%
    between them. How are unequal repeats per stimulus handled in the bias correction? And what does the estimator
    give when a neuron's bias-corrected variance is not positive? Here its similarities are undefined, and 62 of
    the 64 shape neurons without a line under the half-width reading lack one for that reason (the paper has 2).
- kind: methods_unavailable
  statement: For the paper's authors. Does the noise-corrected similarity between two simultaneously recorded neurons
    correct for their noise correlation? Here noise correlations are small but positive and largest for near pairs
    (mean 0.072 within 100 um, 0.023 beyond 800 um); subtracting them lowers the number of neurons with significant
    positive Isimilarity from 400 to 274 (dark shapes, width reading) against the paper's 344.
