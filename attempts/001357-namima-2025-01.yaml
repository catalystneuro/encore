- claim: orientation-sf-isimilarity
  outcome: blocked
  blocked_by: data_missing
  notes: Needs the 120 shape images to compute Gabor filter outputs. The dandiset holds none (`stimulus/templates`
    is empty) and does not say which shape each stim_ID is. A search for a public, pinned copy of the Pasupathy
    and Connor (2001) shapes (the shape lab's publication pages, Pospisil et al. 2018 eLife, github.com/deanpospisil/er_est,
    the SparseShape OSF project) found none; other groups report obtaining them from the lab. A second search, in
    the final revision, found the outlines of the 370 shapes of the Pasupathy and Connor set at a pinned commit
    (github.com/deanpospisil/v4cnn, commit b0532e9083eb023c2247e5b53833229e7e6eb740, img_gen/PC3702001ShapeVerts.mat,
    401 vertices per shape). The dataset still does not say which 15 of them the shape test used or which stim_ID
    each is, so the claim stays blocked here; using them needs the 15 shapes of Figure 1B identified in that set
    and a mapping of stim_ID to them, an analysis left to a new attempt.
