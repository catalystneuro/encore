  notes: The files hold 30 and 44 shape sessions (M1, M2), 17 and 34 texture sessions, and 34 position-test sessions
    (expected 33 within 3.3; one holds a single unit). 1,869 shape neurons are responsive and 427 excluded, 985
    texture neurons responsive and 360 excluded, all within tolerance. The texture files' good units sum to the
    paper's 1,345 exactly; the shape files hold 2,296 against 2,311.
  deviations:
  - Texture responsiveness uses the original and contrast-reversed textures; the spectral-noise version in the files
    is left out, as the paper does not use it.
  - Shape responsiveness uses the dark (4 cd/m2) and bright (12 cd/m2) shapes; the files' third luminance level
    (8 cd/m2) is left out.
- claim: ex-m2p6-cluster
  outcome: partially_reproduced
  notebook: reproduce_namima_2025.ipynb
  output: claim:ex-m2p6-cluster
  measured:
  - 24
  - 2340
  - 13
  notes: The files' p06 of M2 (2021-04-14) has 24 responsive neurons spanning 2,340 um; neurons 1 to 9 lie over
    540 um and are similarly tuned at both contrasts (mean similarity 0.70 dark, 0.86 bright, against -0.02 with
    deeper neurons). With dark shapes 13 neurons have a significant positive Isimilarity under both reliability
    readings, all with negative slopes; neurons 1 to 9 and 14 as in the paper, plus 12, 21 and 22, without 17. Count
    and set are outside the margin of one neuron. None has a significant negative intercept, so the two-sided count
    is also 13. With shared noise subtracted the count is 12, within tolerance, but the set lacks 17 and adds 12
    and 21.
  deviations:
  - Penetrations are found by the files' `pen_ID` label (reading c of the claims file); readings a and b give other
    sessions whose counts do not match.
  - Depth is the unit's best-channel position from the files (20 um steps, `depth`, distance from the tip), measured
    from the most superficial good unit; the template center of mass of the Methods is not in the files.
  - The noise-corrected correlation was written from the Methods' description and Pospisil and Bair (2021) (Materials
    and Methods, Tuning similarity and contrast invariance); its bias terms are written for unequal repeats per
    stimulus (3 to 10 here), which reduce to the published terms with equal repeats. The paper's code is not public.
  - The bootstrap resamples each stimulus's repeats (500 times), with the same indices for all neurons of a session.
    Its distribution sits below the point estimate, since resampling with replacement inflates the noise the estimator
    corrects for, so the percentile interval is not a confidence interval of the corrected r; only its width decides
    reliability. Both readings of the reliability rule (width or half-width above 0.5) are run.
  - The noise of two simultaneously recorded neurons is taken as independent, as in Pospisil and Bair (2021). Their
    noise correlations are small but positive, largest within 100 um (mean 0.072); a variant subtracts each pair's
    noise covariance (`nc_corr_shared`).
