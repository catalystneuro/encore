    orientation of the jPC plane), from the Python port of the lab's MATLAB jPCA codepack. Code
    read for method choices only; no data.
  source: https://github.com/bantin/jPCA at commit 3f8be9fa32a43a7b3090695c9e671f52f02878ac
- what: The dandiset's conversion code, read for how units, trials, positions and session dates
    were written (one unit per entry of the lab's unitLookup, spikes and positions stored trial by
    trial, one clock offset applied, the year 2009 set in every session date of the first
    conversion). Code read only; no data.
