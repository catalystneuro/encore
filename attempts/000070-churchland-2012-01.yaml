findings:
- kind: data_missing
  statement: The dandiset holds the paper's two array datasets but not the sorted isolations the
    paper analysed (146 for J-array, 218 for N-array). Its Units table has 192 units per file, one
    per electrode. The seven single-electrode datasets, the EMG, the leech and the walking-monkey
    data are not in it either, so six of the paper's main findings cannot be tested.
- kind: format_error
  statement: In nine of the ten files (all written by the first conversion) the first entry of
    units/spike_times_index is the true end of unit 0 modulo 65536. Unit 0 is cut short (in J-array
    61030 of its 257638 spikes) and its remaining spikes open unit 1,
    whose times then jump from the end of the session back to its start.
- kind: format_error
  statement: In five Nitschke files (ses-20090812, 20090819, 20090910, 20090920 and 20100923) the
    clock restarts at recording segments after the first, as the conversion offsets only one
    segment. Trials overlap in time (2094 overlapping pairs in N-array), and every unit's spike
    times go backwards at each restart, so spikes cannot be placed in trials by time; they can be
    placed by their storage order, which the notebook shows decodes reach direction in every
    segment.
- kind: metadata_error
  statement: Hand position is stated in metres (with conversion NaN); its values span about -220 to
    +165 on the scale of the target positions (up to 145) and the median speed peaks at 600 to 730
    per second during a reach, so they are in mm.
- kind: metadata_insufficient
  statement: The hand position ends a median 35 mm (Jenkins) and 52 to 53 mm (Nitschke) below the
    reached target in y, while the cursor lands on the target; the offset between hand and screen
    coordinates is not described in the files.
- kind: metadata_insufficient
  statement: The Units table carries only the default description ("Autogenerated by NWBFile") and
    does not say whether its units are sorted neurons, multi-unit activity or threshold crossings.
    Their number (one per electrode) and rates (8.8 to 300 spikes/s over trial time in the three
    sessions analysed) are consistent with channel-level activity.
- kind: metadata_insufficient
  statement: The dandiset does not say which of its ten sessions are the paper's datasets. Two match
    the J-array and N-array dates; the other eight (27-condition and two-condition maze sessions,
    and one 108-condition session) are not described.
- kind: other
  statement: The first conversion's code sets the year of every session date to 2009. The file
    sub-Nitschke ses-20090910 has 108 conditions with the same reached target as N-array (2010) for
    all of them, and is consistent with the N-9-10-2010 dataset of Supplementary Figure 5; if so,
    its date is a year early. The other 2009 Nitschke dates may be affected in the same way.
