- claim: suppfig4-planes-range
  outcome: partially_reproduced
  notebook: reproduce_churchland_2012.ipynb
  output: claim:suppfig4-planes-range
  notes: The three planes capture 50.1% in N-array (within 45 to 77%) and 40.0% in J-array (below
    it). The first two planes have 0.954 or more of conditions rotating in their direction in both
    datasets. ses-20090910 gives 40.9%.
  deviations:
  - Two datasets in place of the paper's nine; per-electrode units.
- claim: fig6a-angle-peak
  outcome: reproduced
  notebook: reproduce_churchland_2012.ipynb
  output: claim:fig6a-angle-peak
  notes: The angle between the state and its derivative peaks at 0.528 pi (J-array) and 0.639 pi
    (N-array), medians 0.511 and 0.603 pi. Under the variants the peak lies between 0.528 and 0.639
    pi, and with 24 or 48 bins between 0.542 and 0.646 pi.
  deviations:
  - The thresholds come from reading Figure 6a; the paper gives no number.
- claim: fig6b-skew-fit
  outcome: reproduced
  notebook: reproduce_churchland_2012.ipynb
  output: claim:fig6b-skew-fit
  notes: R2(M_skew)/R2(M) is 0.905 and 0.845 in 6-D and 0.957 and 0.881 in the first plane (J-array,
    N-array). Under the variants the 6-D ratio is 0.819 or more and the plane ratio 0.879 or more.
    Absolute R2 of M_skew is 0.343 and 0.517.
  deviations:
  - The thresholds come from reading Figure 6b; the paper gives no number.
  - M_skew is solved in closed form as in the Supplementary Derivation, where the codepack uses a
    gradient method for the same unique optimum.
- claim: rotation-frequency
  outcome: partially_reproduced
  notebook: reproduce_churchland_2012.ipynb
  output: claim:rotation-frequency
  measured: 1.38
  notes: The first plane rotates at 1.38 Hz (8.65 radians/s) in N-array, within 1.26 to 2.75 Hz,
    and 1.03 Hz (6.49 radians/s) in J-array, below it; the larger value is given as measured. No
    variant exceeds 1.68 Hz, so the upper bound holds. J-array reaches the range with the -100 to
    +100 ms window (1.45 Hz) or 10 PCs (1.68 Hz), variants that do not decide the outcome. The low J-array value is not the effect of a window
    starting before the rotation does (a synthetic 2 Hz rotation starting at movement onset reads
    1.49 Hz from -50 ms), since windows starting at 0 and +50 ms give 1.04 and 1.13 Hz. The J-array
    plane's mean angular speed is about 1.3 Hz from -60 to +20 ms and 0.7 to 0.9 Hz by +100 ms, and
    windows starting at -150 or -100 ms give 1.31 and 1.45 Hz, so J-array rotates faster before
    movement onset than over the window used, which the paper chose per dataset.
  deviations:
  - The lower bound of the range comes from the eigenvalues the paper reports for monkeys A and B,
    whose data are not in the dandiset.
- claim: suppfig3-shuffle-controls
  outcome: not_reproduced
  notebook: reproduce_churchland_2012.ipynb
  output: claim:suppfig3-shuffle-controls
  notes: Shuffle 1 removes the rotations (median R2(M_skew) 1.0% and 0.8% of the original;
    fraction counter-clockwise 0.565 and 0.602). Shuffle 2 leaves 71% (J-array) and 94% (N-array)
    of the original R2(M_skew), shuffle 3 leaves 81% and 94%, and one shuffle 3 run in N-array
    exceeds the original; after both the median fraction rotating counter-clockwise is 0.963 to
    0.991. Only shuffle 1 meets the criterion in N-array, and shuffles 1 and 2 in J-array. The
    paper expected shuffles 2 and 3 to leave part of the rotational structure and to disrupt its
    relation to the preparatory state, which R2(M_skew) does not measure; the criterion's choice
    of measure, fixed before the analysis, may not capture what the paper judged by eye.
  deviations:
  - The dividing point is one time per dataset (median go cue plus 50 ms, -301 and -320 ms from
    movement onset) on movement-aligned rates; the paper split each condition 50 ms after its go
    cue on rates aligned separately to target, go cue and movement.
  - The paper judged the shuffles from projections (Supplementary Figure 3); R2(M_skew) and its
    thresholds were fixed here.
- claim: suppfig5-areas-variance
  outcome: partially_reproduced
  notebook: reproduce_churchland_2012.ipynb
  output: claim:suppfig5-areas-variance
  measured:
  - 23.7
  - 22.8
  - 18.1
  - 25.0
  notes: PMd and M1 capture 23.7% and 22.8% (J-array) and 18.1% and 25.0% (N-array) against 29,
    29, 32 and 28%; none within 10% (N-array M1 misses 25.2% by 0.2 points). All lie within 18 to
    38.5%, with 0.917 to 0.991 of conditions rotating counter-clockwise. ses-20090910 gives 15.4%
    (PMd) and 21.6% (M1) against 26% and 24% for N-9-10-2010.
  deviations:
  - 96 per-electrode units per array in place of the paper's isolations.
- claim: suppfig5-m1-faster
  outcome: reproduced
  notebook: reproduce_churchland_2012.ipynb
  output: claim:suppfig5-m1-faster
  notes: M1 rotates faster than PMd in J-array (1.82 against 0.83 Hz) and N-array (1.54 against
    1.02 Hz), and in ses-20090910 (1.70 against 0.89 Hz), under every variant shown. The paper
    calls the difference slight; here M1 is 1.5 to 2.4 times faster across the sessions and
    variants.
- claim: fig6-velocity-model
  outcome: not_reproduced
  notebook: reproduce_churchland_2012.ipynb
  output: claim:fig6-velocity-model
  notes: The velocity model's 6-D R2 ratio is 0.361 (J-array) and 0.255 (N-array), against 0.905
    and 0.845 for the data, and 0.630 and 0.778 of its conditions rotate counter-clockwise. Its
    angle distribution peaks at 0.806 pi and 0.361 pi, not below pi/4, so the criterion fails in
    both datasets. With no lead the peaks are 0.194 pi and 0.417 pi and the ratios 0.362 and 0.337.
    The part of the claim about the poor fit of M_skew holds under every variant (6-D ratio 0.08 to
    0.55). The angle peak depends on the model's open choices. A decay toward the origin peaks near
    pi (0.972 pi on a synthetic decay), and the preparatory tuning decays from movement onset. With
    the 100 ms lead the peak lies at 0.36 to 0.86 pi over five seeds and with the preparatory tuning
    decaying, held or absent; with no lead and preparatory tuning it lies at 0.19 to 0.42 pi; with
    no lead and no preparatory tuning it is 0.028 pi in both datasets, near zero as the paper
    reports. The outcome follows the model fixed in the criterion.
  deviations:
  - The model is simulated here from the dandiset's condition-mean hand kinematics; its lead of
    100 ms, the time course of preparatory tuning and the modulation depths are choices made here,
    as the Methods do not give them.
- claim: fig6-complex-kinematic-model
  outcome: not_reproduced
  notebook: reproduce_churchland_2012.ipynb
  output: claim:fig6-complex-kinematic-model
  notes: The complex kinematic model's 6-D R2 ratio is 0.082 (J-array) and 0.132 (N-array), 0.289
    and 0.207 with no lead, and 0.565 and 0.528 of its conditions rotate counter-clockwise. Its
    angle peaks are 0.861 pi and 0.750 pi (0.806 and 0.917 pi with no lead), not below pi/4, so
    the criterion fails in both datasets. The poor fit of M_skew holds as the paper reports (6-D
    ratio 0.06 to 0.61 across variants). With the preparatory tuning held or absent, no lead, and
    four more seeds, the peak lies within pi/4 of zero only in J-array with no preparatory tuning
    and no lead (-0.083 pi) and in one N-array seed with no lead (0.194 pi); elsewhere it lies at
    0.19 to 0.97 pi or near -pi.
  deviations:
  - Simulated here with the Methods' sensitivities; the lead, the preparatory time course and
    hand positions read as mm are choices made here.
- claim: fig1-leech-and-walking
  outcome: blocked
  blocked_by: data_missing
  notes: The leech imaging and the walking-monkey recording are not in the dandiset, whose ten
