- claim: fig6a-angle-peak
  outcome: reproduced
  notebook: reproduce_churchland_2012.ipynb
  output: claim:fig6a-angle-peak
  notes: The angle between the state and its derivative peaks at 0.528 pi (J-array) and 0.639 pi
