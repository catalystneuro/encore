outcomes:
- claim: array-dataset-composition
  outcome: partially_reproduced
  notebook: reproduce_churchland_2012.ipynb
  output: claim:array-dataset-composition
  measured:
  - 108
  - 108
  - 192
  - 192
  notes: Both sessions are in the dandiset (sub-Jenkins ses-20090918 and sub-Nitschke
    ses-20100923) with 108 conditions each among the selected trials. Each holds 192 units, one per
    electrode of the two arrays, with rates over trial time of 13.5 to 178 spikes/s, against the
    paper's 146 and 218 isolations. The sorted isolations are not in the dandiset.
- claim: fig3ef-same-direction
  outcome: reproduced
  notebook: reproduce_churchland_2012.ipynb
  output: claim:fig3ef-same-direction
  notes: 102 of 108 conditions (0.944) rotate counter-clockwise in J-array and 108 of 108 in
    N-array; median net rotation 70.2 and 114.6 degrees over the 200 ms. Under the variants (24 ms
    smoothing, two other windows, 10 PCs, all successful trials) the fraction is 0.944 to 0.981 and
    0.972 to 1.000. jPCA orients the plane so that the net rotation is counter-clockwise, so the
    fraction is also 0.963 to 0.991 after shuffles 2 and 3 and 0.926 and 0.972 for the velocity
    model with no lead; it shows that the conditions turn the same way, not on its own that the
    rotation is specific to the data.
  deviations:
  - Tested on the 192 per-electrode units, not the paper's sorted isolations.
  - No PC smoothing of single-unit rates; the supplement reports it has essentially no effect.
  - The analysis window is -50 to +150 ms from movement onset for both datasets, from the
    codepack's example; the paper chose a start per dataset, just before the rapid change in
    activity.
- claim: fig3-independent-of-curvature
  outcome: partially_reproduced
  notebook: reproduce_churchland_2012.ipynb
  output: claim:fig3-independent-of-curvature
  notes: In N-array all conditions rotate counter-clockwise in each class (44 clockwise, 53
    counter-clockwise, 11 straight reaches). In J-array 0.984 of 63 counter-clockwise and 7 of 7
    straight reaches do, but 0.868 (33 of 38) of clockwise reaches, under the 0.9 of the criterion
    and above 0.75. Spearman correlation of heading change with net neural rotation is 0.227
    (p 0.018) in J-array and -0.214 (p 0.026) in N-array; the J-array logistic slope is 0.0101 per
    degree. The hand paths drawn by class match the classes; the five clockwise-class conditions of
    J-array that turn clockwise in the plane are loops of 162 to 180 degrees. With the heading taken
    over the unbroken run around peak speed, or thresholds of 10 or 30 degrees, the J-array clockwise
    class has 38 or 41 conditions, of which 0.868 to 0.878 rotate counter-clockwise.
  deviations:
  - The paper shows this by eye in Figure 3; the classes of curvature and the thresholds were
    fixed here before the analysis.
- claim: fig3-phase-from-prep-state
  outcome: partially_reproduced
  notebook: reproduce_churchland_2012.ipynb
  output: claim:fig3-phase-from-prep-state
  notes: Leave-one-condition-out R2 of the +150 ms state from the -50 ms state is 0.632 in J-array
    and 0.748 in N-array, both above 0.5. Shuffle 3 gives 0.633 to 0.718 (median 0.671) in J-array
    and 0.611 to 0.689 (median 0.656) in N-array, so the data exceed the control in N-array only.
    Shuffle 1, which has no rotation, scores 0.82 to 0.91 in every run, so this R2 rewards any
    consistent map from the first state to the last and is a weak test of the claim. With jPCA
    refitted leaving each condition out, the R2 is 0.615 and 0.727 against shuffle 3 medians of
    0.628 and 0.649, reached by 8 of 10 shuffle 3 runs in J-array and none in N-array; several runs
    lie within 0.02 of the J-array value, and the round-2 verifier's copy printed 0.614 and 6 of 10,
    so this count moves with small numerical differences between runs. A phase score (the last phase predicted as the first plus
    the other conditions' mean advance) is 0.763 and 0.894 for the data, against 0.236 and -0.356
    for no advance; shuffle 1 scores the same with and without an advance, and shuffle 3 keeps an
    advance of 65 and 99 degrees and scores a median 0.811 and 0.797, so this score also separates
    the data from shuffle 3 in N-array only (9 of 10 shuffle 3 runs reach the data's phase score in
    J-array, none in N-array).
  deviations:
  - The paper gives no measure of predictability; the complex-gain prediction and its thresholds
    were fixed here before the analysis.
- claim: var-captured-jpc-plane
  outcome: reproduced
  notebook: reproduce_churchland_2012.ipynb
  output: claim:var-captured-jpc-plane
  measured: 21.6
  notes: The first jPCA plane captures 20.0% (J-array) and 23.1% (N-array), both within 18 to
    38.5% (reading b, which matches). The mean, 21.6%, is outside 28 +- 2.8% (reading a). The
    sub-Nitschke ses-20090910 session gives 18.8%.
  deviations:
  - The paper's 28% averages nine datasets, of which the dandiset holds two; the reading of the
    typical range was used, as listed in the criterion.
  - Tested on per-electrode units, not sorted isolations.
- claim: pc23-variance
  outcome: partially_reproduced
  notebook: reproduce_churchland_2012.ipynb
  output: claim:pc23-variance
  measured: 24.3
  notes: PC2 and PC3 capture 21.6% (J-array) and 27.0% (N-array), mean 24.3%, outside 29 +- 2.9%
    under reading (a) and under reading (b) for J-array. The jPCA plane captures 0.93 and 0.86 times
    the variance of PC2 and PC3, so the comparison the claim makes holds.
  deviations:
  - Two datasets in place of the paper's nine.
  - Tested on per-electrode units, not sorted isolations.
- claim: suppfig4-j-array-planes
  outcome: not_reproduced
  notebook: reproduce_churchland_2012.ipynb
  output: claim:suppfig4-j-array-planes
  measured:
  - 12.3
  - 14.8
  - 12.8
  - 40.0
  - 60.5
  notes: In J-array the three jPCA planes from the top 10 PCs capture 12.3%, 14.8% and 12.8% (40.0%
    together) against 22%, 19% and 12% (54%); only plane 3 is within tolerance. The top six PCs
    capture 60.5%, within 64 +- 6.4%. The planes rotate consistently (0.926 to 0.991 of conditions
