- claim: fig3abcd-single-electrode-datasets
  outcome: blocked
  blocked_by: data_missing
  notes: The seven single-electrode datasets (A, B, J1 to J4, N) are not in the dandiset.
- claim: fig4-emg-no-rotation
  outcome: blocked
