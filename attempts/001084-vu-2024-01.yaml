findings:
- kind: data_missing
  statement: The optogenetic sessions (Opto2, Opto4, Opto9, UG21) hold no stimulation times and no record
    of which fiber was stimulated; the trigger line the paper's code uses is not in the files. Both can
    be recovered only from the laser artefact in the DF/F, which is unambiguous in Opto2 and UG21 but
    spreads over many fibers in the tdTomato mice.
- kind: metadata_insufficient
  statement: The event table gives tone presentations without their frequency. DL18 has 44 tones, of which
    the paper analysed the 14 at 12 kHz; the frequency is stored only in a MATLAB object of the
    behaviour file on Zenodo. The tone start times are the trigger times, 11 frames before the sound
    according to the paper's code, which the dandiset does not say.
- kind: data_missing
  statement: DL15's sessions from 2021-09-10 (44 to 70 rewards) were run in a ViRMEn task; the paper keeps
    only rewards of one task phase, but the task variables are not in the files, so unpredicted rewards
    cannot be separated and Figure 1D can be tested only to week 8.
- kind: metadata_error
  statement: The FiberPhotometryTable column `included` is described as "whether this fiber has been
    successfully implanted", but it marks fibers within the striatum (the paper's in_striatum); in Opto2
    two fibers labelled Caudoputamen are not included, and with them the counts match the paper's "within
    or on the border of the striatum" (24 locations).
- kind: metadata_error
  statement: UG21's indicator is given as tdTomato. Its 3 sessions, 22 included fibers and stimulated fibers
    12, 18 and 24 match the paper's rDAm3.0 mouse without opsin (Figure S7A), so the indicator is
    consistent with being a mislabel; the files cannot show which indicator was expressed.
- kind: metadata_error
  statement: In DL31 and DL32 (18 Hz, interleaved 470 and 415 nm) the fiber photometry series store a
    regular rate, but the frame timestamps of the behaviour drift from it by up to 0.43 and 0.54 s over
    the session, so times computed from the stored rate are wrong by up to half a second.
- kind: data_missing
  statement: The data of Figures 2, 3, 7, S1 and S5A-D are not in the dandiset (the CT scans, the freely
    moving recordings, the D1-cre jaw experiments, histology and the 470 and 405 nm sessions of the
    salient-stimulus mice); they are on Zenodo. Opto9 has 12 sessions, so one of
    the paper's 26 tdTomato stimulations is missing.
- kind: data_missing
  statement: The planned fiber targets behind Figure S3 are neither in the dandiset, whose fiber table
    gives only the localized tips, nor on Zenodo, where the code reads them from calibration files that
    were not deposited.
- kind: other
  statement: The paper gives p < 1e-6 for its test of a significant response (3 consecutive frames outside
    the 99% band of the null), the value for independent frames. With the same test the chance rate of a
    significant increase is 0.024 per fiber and stimulus, and three given consecutive frames are all
    outside the band at a rate of 0.0037.
- kind: code_mismatch
  statement: The paper's latency code (sal_stim_lat_plots.m) divides the 1-based index of the half-maximum
    frame by the frame rate, so its latencies are one frame (33 ms) longer than the Methods' definition.
    With that count the dandiset gives the paper's means within 2 ms.
- kind: code_mismatch
  statement: In the paper's cross-correlation of DF/F with locomotion (sal_stim_iti_acc_cc.m), negative
    lags are not shifted; they correlate the two signals at zero lag over a truncated range. The Methods
    describe a cross-correlation over +-500 ms.
- kind: code_mismatch
  statement: The Figure 1C legend describes 23 example fibers of a 93-fiber array; the paper's code for the
    figure plots 33 fibers of mouse 842, whose recording has 82 fibers.
- kind: metadata_insufficient
  statement: The archive's summary gives the approach as "cell population imaging" and lists only NWB
    container types as variables measured; the files hold multi-fiber photometry, treadmill velocity and
    behavioural events.
verifications:
- date: '2026-10-18'
  kind: agent
  by: Independent agent run by CatalystNeuro (same harness, separate context, did not write the notebook)
  reviewed: Round 1. The first executed notebook with the conclusion cells and the summary removed, the helper
    module and the claims file, with the paper (PMC author manuscript). The verifier tested the helper functions
    on synthetic inputs and checked the archive's asset list for the blocked claims. Its report had no attempt
    record and gave its own outcome for each claim; all 26 outcomes agree with the record, and for the five
    blocked claims it gave data_missing as the reason.
  results:
  - claim: fig1c-isosbestic-control
    agrees: true
    outcome: reproduced
    reason: Session 2022-11-23, the 470/405 SD ratio is above 1 in 61/61 fibers, with median 3.01. The variant
      session gives 2.84.
    response: No change needed.
  - claim: figs2d-correlation-distance
    agrees: true
    outcome: reproduced
    reason: Median pairwise r is 0.163 (below 0.3). r with tip distance is -0.190, p = 2.8e-16.
    response: No change needed.
  - claim: figs2ef-no-bundle-crosstalk
    agrees: true
    outcome: reproduced
    reason: The bundle-distance coefficient is -3.4e-5 per pixel, 95% CI -2.7e-4 to 2.0e-4, p = 0.77. The variant
      session gives p = 0.41. The CI still allows a change in r of about +-0.1 across the bundle.
    response: No change needed; the confidence interval is in the notes.
  - claim: fig1d-chronic-reward-stability
    agrees: true
    outcome: partially_reproduced
    reason: The weekly medians are 1.00, 0.90, 0.93 and 1.20, all inside 0.7 to 1.3. Only weeks 5 to 8 can
      be tested because sessions with 25 or fewer rewards end on 2021-09-21, so week 12 is never reached. With
      all rewards included, the median falls to 0.39 to 0.63 from week 9.
    response: No change needed.
  - claim: fig4-link-published-results
    agrees: true
    outcome: reproduced
    reason: Raw light averages match exactly in all mice; raw tone averages match exactly in all mice but DL18,
      and DL18's 14 matched tones also match exactly. Pooled spline r is 0.9957 (light) and 0.9922 (tone),
      and significance agrees on 0.936 of fiber and stimulus pairs. Per-mouse r falls below 0.99 for DL29 light
      (0.979) and DL27/DL29 tone. The DL18 tone spline r and significance agreement are computed against a
      44-tone fit, while the paper's fit uses 14 tones, and are not recomputed with the matched 14 (problem
      10, not affecting a conclusion).
    response: Added the DL18 fit with the 14 matched tones and its null to the claim's cell (moved there from
      fig4f, same seed). DL18 tone r rises from 0.9578 to 0.9977 and significance agreement from 0.684 to 0.947;
      over all pairs agreement is 94.5% and pooled tone r 0.9974. The per-mouse r below 0.99 is now stated
      in the conclusion and notes. Outcome kept.
  - claim: fig4e-light-increases-widespread
    agrees: true
    outcome: reproduced
    reason: 240/280 fibers (86%) increase and 38 decrease. The notebook's chance rate is 0.024 per fiber, about
      7 expected false positives. The paper states p < 1e-6 for the 3-consecutive-frame test, so the paper's
      figure does not describe the test as run; it does not change fig4e (problem 7, not affecting a conclusion).
    response: Added the two-sided chance rate (0.043), the rate at which a frame falls outside the band (0.0104)
      and the rate for three given consecutive frames (0.0037), against the paper's 0.01 cubed. The deviation
      explains why the protocol's rule for a chance level far from the paper's (blocked, methods_underspecified)
      is not applied, since fig4-link shows the procedure is the paper's; the stated rate is recorded as a
      finding. Outcome kept.
  - claim: fig4e-light-anterior-posterior-gradient
    agrees: true
    outcome: partially_reproduced
    reason: (a) rho = 0.168, p = 0.0047 holds and (c) Mann-Whitney p = 0.0013 holds. (b) fails, 0.83 of tail
      fibers increase against 0.86 elsewhere, Fisher p = 0.38, at all three tail boundaries. The Spearman tests
      pool fibers across mice and ignore which mouse each fiber came from; per mouse the light correlations
      have mixed signs, so the pooled p-values are optimistic and a between-mouse confound was never ruled
      out (problem 2, affecting a conclusion).
    response: Added a variant that ranks AP and the light value within each mouse and tests by permutation
      within mice; r = 0.152, p = 0.013, so (a) holds without differences between mice. The criterion's pooled
      test still decides. Outcome kept.
  - claim: fig4f-tone-tail-increase-anterior-decrease
    agrees: true
    outcome: reproduced
    reason: Tail median 0.0092 against -0.0026 anterior, p = 5.5e-13, and 10/10 of the top fibers are in the
      tail. Anterior decreases outnumber increases 103 to 60, binomial p = 4.7e-4. The result holds with the
      code's lags and with DL18's 14 tones.
    response: No change needed; the DL18 14-tone fit now comes from fig4-link-published-results with the same
      numbers.
  - claim: fig4f-decreases-lateral-ventral
    agrees: true
    outcome: partially_reproduced
    reason: DV holds (p = 0.003) but ML fails (p = 0.43). 79/245 anterior fibers (32%) show both a light increase
      and a tone decrease, which meets the many threshold.
    response: No change needed.
  - claim: figs4ac-patterns-consistent-across-mice
    agrees: true
    outcome: partially_reproduced
    reason: The tone correlation is negative in 7/7 mice. The light correlation is positive in only 4/7; the
      criterion needs 5.
    response: No change needed.
  - claim: figs4eh-patterns-not-movement
    agrees: true
    outcome: partially_reproduced
    reason: Light holds (r = 0.873). Tone has r = 0.784, but in the deceleration split the anterior median
      is +0.0042, so the tone pattern fails. The split values are the signed extreme of raw DF/F over 0 to
      1 s with no pre-onset baseline subtracted, which inflates r(acc, dec) and lets a baseline shift flip
      the sign of the anterior tone median; this follows the criterion, but the tone failure may come from
      baseline level, not the response (problem 1, affecting a conclusion).
    response: Confirmed from the paper's code (SuppFig04/EFGH/sal_stim_bubbles_loco.m) that it uses raw DF/F
      with no baseline, as the criterion fixed. Added the variant with each split's pre-onset mean subtracted;
      light r = 0.755, tone r = 0.823, and the tone pattern holds in both splits (anterior median -0.0043 and
      -0.0024). The variant does not decide the outcome, which stays partial under the criterion; the notes
      and conclusion say the failure follows from the pre-onset level.
  - claim: figs5-isosbestic-no-pattern
    agrees: true
    outcome: partially_reproduced
    reason: Light holds (415/470 median ratio 0.49; 2 significant fibers against 45). Tone fails on amplitude
      (ratio 0.68) even though significance drops from 18 fibers to 1. spline_basis at 18 Hz gives 9 basis
      functions, not the 13 in the Methods, so the GLM is not the 13-df model; the amplitude criterion compares
      medians of the absolute signed peak, which has a positive noise floor, so the ratio cannot get close
      to 0 when the 470 signal is small (problem 8, not affecting a conclusion).
    response: Read the paper's 18 Hz code (SuppFig05/EFGH/analysis_code/run_sal_stim_glm_470_415.m), which
      also gives 9 functions (knots every 3 frames); stated in the helper and recorded as a deviation. Added
      a variant with 13 functions (ratios 0.55 light, 0.70 tone; 36 and 15 significant fibers at 470 nm against
      1 and 0) and the noise floor from the null refits (median 0.0025 at 470 nm, 0.0019 at 415 nm; tone at
      470 nm is 0.0002 above it). Outcome kept.
  - claim: fig5ab-response-latencies
    agrees: true
    outcome: partially_reproduced
    reason: Methods indexing gives means of 187.5 ms (outside 221.6 +- 22.2), 271.7 ms (just outside 305.4
      +- 30.5) and 393.2 ms (inside 428.3 +- 42.8); the order holds. The code's +1-frame variant gives 220.8,
      305.0 and 426.5 ms, within 2 ms of the paper. The claim is decided only by the indexing convention; the
      paper's means match the code's indexing almost exactly, which suggests that is what the paper used (problem
      3, affecting a conclusion).
    response: No change. The criterion follows the Methods for the main result and shows the code's choice
      as a variant, as protocol step 1.5 requires when they disagree; the match under the code's count is in
      the notes and recorded as a code_mismatch finding. Outcome kept.
  - claim: fig5g-light-latency-gradient
    agrees: true
    outcome: reproduced
    reason: rho(AP, relative latency) = -0.285, p = 7e-6, n = 240. The pooled Spearman ignores which mouse
      each fiber came from; per mouse the light latency correlations are negative in 4/7, and relative latency
      is measured against the fastest fiber in each mouse, so its spread grows with the number of fibers (problem
      2, affecting a conclusion).
    response: Added the within-mouse rank variant with a permutation test within mice, which removes differences
      between mice and the dependence on fiber count; r = -0.223, p = 0.0014. Outcome kept.
  - claim: fig5h-tone-latency-gradient
    agrees: true
    outcome: reproduced
    reason: rho = +0.254, p = 3.3e-4, n = 196. The pooled test has the same problem of ignoring the mouse (problem
      2, affecting a conclusion).
    response: Added the within-mouse rank variant; r = 0.214, p = 0.003. Outcome kept.
  - claim: figs6cd-gradients-individual-mice
    agrees: true
    outcome: partially_reproduced
    reason: The tone correlation is positive in 6/7 mice. The light correlation is negative in 4/7; the criterion
      needs 5.
    response: No change needed.
  - claim: fig6-inclusion-counts
    agrees: true
    outcome: partially_reproduced
    reason: 22 locations (inside 24 +- 2.4) and 20 responders (inside 22 +- 2.2). Only 14 of 19 stimulated
      sites respond elsewhere, outside 18 +- 1.8. The striatal-label variant gives 24, 16 and 22, so it is
      still partial. Responders include the stimulated fiber's own significance, which can be photoswitching
      (problem 4); only 19 of 29 single-site sessions stimulate an included fiber against the paper's 24, so
      the 18 cannot be compared directly (problem 5); the null pool keeps the post-offset response windows,
      slightly conservative (problem 6). None affects a conclusion.
    response: Added the count with only responses to another fiber's stimulation; it is still 20 (none dropped).
      Added the fraction, 14 of 19 (0.74) against the paper's 18 of 24 (0.75), with the note that the denominators
      differ. Checked the null pool against the paper's getNullDist_stim.m, which excludes the same frames
      (laser trace above 0.5, the windows ending at each onset, the end of the recording); stated in the helper.
      Corrected the data check text, which said 15 fibers carry the artefact in session 2023-03-20f, to the
      13 its table shows. Outcome kept.
  - claim: fig6gh-release-decays-with-distance
    agrees: true
    outcome: reproduced
    reason: b = -1.096 per mm, bootstrap 95% interval -1.325 to -0.890. Spearman rho on the absolute ML, AP
      and DV distances is negative with p <= 1e-5 on each axis.
    response: No change needed.
  - claim: fig6g-dorsal-spread
    agrees: true
    outcome: partially_reproduced
    reason: b is -0.971 dorsal against -1.403 ventral, in the claimed order. The difference has a 95% interval
      of -0.094 to 0.969, which includes 0.
    response: No change needed.
  - claim: fig6-tdtomato-control-no-response
    agrees: true
    outcome: reproduced
    reason: 0/304 (Opto4) and 0/203 (Opto9) significant increases, against 142/619 in Opto2 with the same test.
      The archive has 25 sessions; the paper reports 26 stimulations.
    response: No change needed.
  - claim: figs7a-photoswitch-confined
    agrees: true
    outcome: reproduced
    reason: The stimulated fiber increases significantly in 3/3 sessions, and 0 of 21 other fibers respond
      in each. The files label UG21's indicator as tdTomato, and it is treated as rDAm3.0 on circumstantial
      evidence; the paper's reward-response inclusion for that control cannot be applied because UG21 has no
      reward events (problem 9, not affecting a conclusion).
    response: Added both points as deviations and the missing reward inclusion to the conclusion; the mislabel
      was already a finding. Outcome kept.
  - claim: figs1-no-tissue-damage
    agrees: true
    outcome: blocked
    reason: data_missing. The archive's 180 assets are only .nwb and .avi files, with no histology.
    response: Outcome kept. blocked_by kept as other (not attempted). The images and densities are public on
      Zenodo (SuppFig01.zip), and the protocol does not allow data_missing for data deposited in another public
      archive; the claim is data elsewhere and was not tested in this attempt.
  - claim: figs3-targeting-errors
    agrees: true
    outcome: blocked
    reason: data_missing. No CT or planned-target files. The fiber table holds the localized tips; whether
      it also holds planned targets is not shown, and printing the FiberPhotometryTable column names would
      settle it.
    response: Added a data check printing the fiber table columns of all 116 files with their descriptions;
      none holds a planned target. The paper's code reads the planned targets from calibration files that are
      in none of the Zenodo archives, so the claim is now data dandiset, blocked with data_missing as the verifier
      gave, and a finding records it.
  - claim: fig3-freely-moving-signals
    agrees: true
    outcome: blocked
    reason: data_missing. None of the 16 subjects is a freely moving miniscope mouse.
    response: Outcome kept. blocked_by kept as other (not attempted); the recordings are public on Zenodo (Fig03.zip),
      so data_missing does not apply under the protocol.
  - claim: fig7d-ventral-not-dorsal-jaw
    agrees: true
    outcome: blocked
    reason: data_missing. No OptoD1 subjects in the asset list.
    response: Outcome kept. blocked_by kept as other (not attempted); the D1-cre data are public on Zenodo
      (Fig07.zip), so data_missing does not apply under the protocol.
  - claim: fig7ef-single-ventral-fiber
    agrees: true
    outcome: blocked
    reason: data_missing. Same as fig7d.
    response: Outcome kept, as fig7d-ventral-not-dorsal-jaw.
