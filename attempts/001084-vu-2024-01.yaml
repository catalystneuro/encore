- claim: fig6-inclusion-counts
  outcome: partially_reproduced
  notebook: reproduce_vu_2024.ipynb
  output: claim:fig6-inclusion-counts
  measured:
  - 22
  - 14
  - 20
  notes: In Opto2, 22 fibers are flagged included and 20 of them respond to at least one stimulation, both
    within tolerance; 14 of the 19 stimulated included fibers evoke a significant response at another
    included fiber, below 18. Adding the two fibers labelled Caudoputamen but not flagged (16 and 34)
