inputs:
- what: The paper's per-fiber results of the salient-stimulus GLM (glm_spline_results.mat, folder
    Fig04/general_functions of Fig04.zip), used only by fig4-link-published-results to check that the
    dandiset holds the data behind them, and to identify DL18's 12 kHz tones for a variant.
  source: Zenodo doi:10.5281/zenodo.10272874 (record 10272874)
outcomes:
- claim: fig1c-isosbestic-control
  outcome: reproduced
  notebook: reproduce_vu_2024.ipynb
  output: claim:fig1c-isosbestic-control
  notes: Mouse 842, session 2022-11-23, 61 included fibers. The SD of DF/F under 470 nm exceeds that
    under 405 nm in 61 of 61 fibers (median ratio 3.01, range 1.56 to 19.41). Frames above 5 times the
    median 405 nm SD make up a median 6.7% of each 470 nm trace and none of the 405 nm traces. The
    session of 2022-11-18 gives a median ratio of 2.84.
  deviations:
  - The paper shows example traces; the SD ratio and its thresholds were chosen here before the
    analysis.
  - Figure 1C describes a 93-fiber array; the mouse its code reads (842) has 82 fibers per channel, 61
    included.
- claim: figs2d-correlation-distance
  outcome: reproduced
  notebook: reproduce_vu_2024.ipynb
  output: claim:figs2d-correlation-distance
  notes: Over 1830 pairs of the 61 included fibers (470 nm, 2022-11-23), the median pairwise correlation
    is 0.163 (IQR -0.025 to 0.361, range -0.678 to 0.904), and correlations fall with tip distance
    (r = -0.190, p = 2.8e-16; mean 0.293 in the closest quarter of pairs against 0.133 in the farthest).
    The session of 2022-11-18 gives r = -0.238. The p-value treats pairs as independent, as the paper's
    code does.
  deviations:
  - The code's set of fibers (goodROIs.mat) is not published; the included fibers are used.
  - The threshold of 0.3 for "generally low" was chosen here.
- claim: figs2ef-no-bundle-crosstalk
  outcome: reproduced
  notebook: reproduce_vu_2024.ipynb
  output: claim:figs2ef-no-bundle-crosstalk
  notes: In the code's linear model of pairwise correlation on Euclidean, AP, ML and DV tip distances and
    bundle-surface distance (ROI centroids), the surface coefficient is -3.4e-05 per pixel (95% CI -2.7e-04
    to 2.0e-04, p = 0.77), while Euclidean tip distance has -0.278 (p < 1e-5). The other session gives
    p = 0.41. Pairs adjacent on the bundle correlate at 0.222 against 0.156 for others, which the model
    attributes to their tips also being closer (tip and surface distances correlate at r = 0.437).
  deviations:
  - Surface distance is in pixels of the bundle image; the code converts it to mm, which does not change
    the p-value.
- claim: fig1d-chronic-reward-stability
  outcome: partially_reproduced
  notebook: reproduce_vu_2024.ipynb
  output: claim:fig1d-chronic-reward-stability
  notes: In the 17 sessions with rewards and 25 rewards or fewer (2021-08-19 to 2021-09-13), the median
    over the 44 fibers of the weekly peak reward response, relative to week 5, is 0.903, 0.932 and 1.196
    in weeks 6 to 8, within the band of 0.7 to 1.3. These sessions end at week 8; from 2021-09-10 the
    sessions have 44 to 70 rewards, of which the paper keeps only those of one task phase, which the
    files do not record, so weeks 9 to 12 cannot be tested. With all rewards of all sessions the median
    falls to 0.767 in week 8, 0.609 in week 10 and 0.392 in week 13, as expected if predicted rewards are
    included; this variant does not test the claim.
  deviations:
  - Weeks are counted from the first session, labelled week 5, because the files give no implantation
    date; the paper's code puts the first session on day 35, which gives the same weeks.
  - Only weeks 5 to 8 can be tested.
- claim: fig4-link-published-results
  outcome: reproduced
  notebook: reproduce_vu_2024.ipynb
  output: claim:fig4-link-published-results
  notes: Fibers matched by order within each mouse. The raw triggered averages from the dandiset equal
    the published cue1_roi_mu for light in all 7 mice and cue2_roi_mu for tone in the 6 mice other than
    DL18 (largest difference 0.0). The GLM spline estimates correlate with the published ones at r =
    0.9957 for light and 0.9922 for tone over all fibers, and significance agrees for 93.6% of fiber and
    stimulus pairs (lowest DL18 tone 0.684, where 44 tones are used in place of 14; DL29 light 0.822).
    DL18's 14 published tone trials match 14 distinct tones of the file (r at least 0.952, best
    competitor at most 0.693), whose raw average equals the published one. Refitted with these 14 tones,
    DL18's tone spline estimates correlate with the published ones at r = 0.9977 and significance agrees
    for 0.947 of its fibers; with them, agreement over all pairs is 94.5% and the pooled tone r is 0.9974.
    Per mouse, r is below 0.99 for DL29 light (0.979) and DL27 and DL29 tone (0.989, 0.986).
  deviations:
  - The GLM is a re-implementation in Python; filtering and lag selection differ in detail (see the
    salient-stimulus claims), which explains the significance disagreements.
- claim: fig4e-light-increases-widespread
  outcome: reproduced
  notebook: reproduce_vu_2024.ipynb
  output: claim:fig4e-light-increases-widespread
  notes: 240 of 280 fibers (86%) have a significant increase to light and 38 a significant decrease; by
    the signed largest value 237 are increases and 11 decreases. Each mouse has increases in most fibers
    (34 of 51 in DL21 to 50 of 53 in DL20). The chance rate of a significant increase per fiber, from 200
    null refits per mouse, is 0.024 (about 7 of 280 fibers), and 0.043 for an increase or a decrease.
  deviations:
  - The paper gives p < 1e-6 for its test (3 consecutive frames outside the 99% band), which is 0.01 cubed
    and assumes independent frames. With the same test, three given consecutive frames are all outside
    the band at a rate of 0.0037 in the null refits, and the per-fiber chance rate is 0.024. The protocol
    blocks a claim when the chance rate of a selection is far from the paper's, as a sign that the
    procedures differ; here the procedure is shown to be the paper's (raw averages identical, significance
    agreeing with the published calls for 93.6 to 94.5% of pairs, fig4-link-published-results), so the
    gap is in how the paper states the rate, and the outcome is kept. 240 increases against about 7
    expected by chance.
  - The low-pass filter of overall velocity is a zero-phase Butterworth filter in place of MATLAB's
    lowpass; locomotion lags come from a cross-correlation that shifts negative lags, where the paper's
    code does not (its version correlates at r = 0.997 with the light values used).
  - DL18's tone regressors include all 44 tones (the files do not give tone frequency).
- claim: fig4e-light-anterior-posterior-gradient
  outcome: partially_reproduced
  notebook: reproduce_vu_2024.ipynb
  output: claim:fig4e-light-anterior-posterior-gradient
  notes: The light value is larger anteriorly (Spearman rho(AP, value) = 0.168, p = 0.0047) and smaller in
    the tail (median 0.0055 against 0.0117 DF/F, p = 0.0013), but increases are as prevalent there (83%
    of 35 tail fibers against 86% elsewhere, p = 0.38). The result is the same with the tail at -0.8 or
    -1.3 mm and with the code's lags (rho = 0.162). Per mouse the gradient is positive in DL18, DL20 and
    DL27 (rho 0.45 to 0.69) and negative in DL23 (-0.43), DL29 and DL30. With AP and the light value ranked
    within each mouse and a permutation test within mice, so that differences between mice cannot drive
    it, the correlation is r = 0.152 (p = 0.013); (a) holds this way too.
  deviations:
  - The tail boundary (AP at most -1.0 mm) was fixed here; the paper gives none.
- claim: fig4f-tone-tail-increase-anterior-decrease
  outcome: reproduced
  notebook: reproduce_vu_2024.ipynb
  output: claim:fig4f-tone-tail-increase-anterior-decrease
  notes: Tail fibers have larger tone values than anterior fibers (median 0.0092 against -0.0026 DF/F,
    p = 5.5e-13), all 10 of the largest values are in the tail, and 32 of 35 tail fibers have a
    significant increase (none a decrease). Anterior to the tail 103 significant responses are decreases
    and 60 increases (binomial p = 0.00047). Both comparisons hold at every tail boundary, with the code's
    lags, and with DL18 restricted to its 14 tones of 12 kHz
    identified from the paper's results (108 against 60), though at -1.3 mm only 5 of the 10 largest
    values are in the tail. The anterior decrease dominates in DL21 (36
    against 3) and DL23 (17 against 6) but not in DL18, DL20, DL27 or DL30.
  deviations:
  - DL18 uses all 44 tones in the main analysis.
- claim: fig4f-decreases-lateral-ventral
  outcome: partially_reproduced
  notebook: reproduce_vu_2024.ipynb
  output: claim:fig4f-decreases-lateral-ventral
  notes: Of 245 anterior fibers, the 103 with a significant tone decrease are more ventral than the others
    (median DV 3.66 against 3.30 mm, p = 0.0031) but not more lateral (median ML 2.07 against 1.97 mm,
    p = 0.43); the same at the other tail boundaries. They are also more anterior (p = 1e-06). 79 anterior
    fibers (32%) have both a significant light increase and a significant tone decrease, so "many sites"
    holds by the 20% reading.
- claim: figs4ac-patterns-consistent-across-mice
  outcome: partially_reproduced
  notebook: reproduce_vu_2024.ipynb
  output: claim:figs4ac-patterns-consistent-across-mice
  notes: The tone correlation with AP is negative in all 7 mice (rho -0.44 to -0.70, each p < 0.03). The
    light correlation is positive in 4 of 7 mice (significant in DL18, DL20 and DL27) and negative in
    DL23 (rho -0.43, p = 0.026), DL29 and DL30, below the 5 required.
  deviations:
  - The supplementary legend of Figure S4 was not available; the test per mouse was chosen here.
- claim: figs4eh-patterns-not-movement
  outcome: partially_reproduced
  notebook: reproduce_vu_2024.ipynb
  output: claim:figs4eh-patterns-not-movement
  notes: Locomotion after the stimuli varies between mice and presentations (acceleration and deceleration
    splits from 0 and 21 in DL29 light to 21 and 23 in DL18 tone; mean velocity change of either sign for
    both stimuli). The fiber maps of the two splits correlate (light r = 0.873 over 235 fibers, tone r =
    0.784 over 229). The tone pattern holds after acceleration (tail median 0.0073, anterior -0.0031 DF/F)
    but not after deceleration, where the anterior median is positive (0.0042; tail 0.0098). The test uses
    raw DF/F, as the paper's code for Figure S4E-H (sal_stim_bubbles_loco.m) does, with no baseline and
    without the GLM's locomotion regressors. With each split's mean over the 1 s before onset subtracted
    (a variant, which does not decide the outcome), the maps correlate at r = 0.755 (light) and 0.823
    (tone) and the tone pattern holds in both splits (anterior median -0.0043 after acceleration and
    -0.0024 after deceleration, tail 0.0069 and 0.0101), so the failure under the code's measure follows
    from the level before onset in the deceleration trials.
  deviations:
  - The supplementary legend was not available; the correlation threshold and the tone-pattern test were
    chosen here.
- claim: figs5-isosbestic-no-pattern
  outcome: partially_reproduced
  notebook: reproduce_vu_2024.ipynb
  output: claim:figs5-isosbestic-no-pattern
  notes: In DL31 and DL32 (96 fibers), 2 fibers respond significantly to light and 1 to tone at 415 nm,
    against 45 and 18 at 470 nm, and the AP correlations of the tone values at 470 nm (-0.49, -0.43) are
    absent at 415 nm (-0.19, 0.16). The median absolute value at 415 nm is 0.49 of that at 470 nm for
    light but 0.68 for tone, above the criterion's half; for tone most 470 nm fibers are not significant
    either, and both medians (0.0027 and 0.0018 DF/F) are near the noise level. With random onsets the
    median absolute value is 0.0025 at 470 nm and 0.0019 at 415 nm, so the tone median at 470 nm is only
    0.0002 above this floor and the ratio cannot fall to half; for light the 470 nm median is 0.0017
    above the floor and the 415 nm one 0.0001. With 13 spline functions (the Methods' number for the main
    GLM) in place of the code's 9 at 18 Hz, the ratios are 0.55 (light) and 0.70 (tone), with 36 and 15
    significant fibers at 470 nm against 1 and 0 at 415 nm.
  deviations:
  - The spline basis has 9 functions at 18 Hz, as the paper's code (run_sal_stim_glm_470_415.m, knots every
    3 frames) has; the Methods give 13 for the GLM at 30 Hz. The 13-function basis is shown as a variant.
  - Events are placed by behaviour sample index for both channels, because the stored regular frame rate
    drifts from the frame timestamps by up to half a second; the clock check for these two sessions is
    weak (decoding 0.90 and 0.80 with true onsets against 0.40 to 0.65 with shifted ones, 20
    presentations each).
  - The 470 and 405 nm sessions of Figure S5A-D are not in the dandiset.
- claim: fig5ab-response-latencies
  outcome: partially_reproduced
  notebook: reproduce_vu_2024.ipynb
  output: claim:fig5ab-response-latencies
  measured:
  - 187.5
  - 271.7
  - 393.2
  notes: Counted from the onset frame as the Methods define latency, the means are 187.5 ms (240 light
    increases), 271.7 ms (94 tone increases) and 393.2 ms (108 tone decreases); the order holds and the
    tone decrease is within tolerance, the other two are below it. Counted as the paper's code counts
    (its 1-based index divided by the frame rate, one frame later), they are 220.8, 305.0 and 426.5 ms,
    within 2 ms of the paper's values, with SDs of 38.1, 98.7 and 196.5 ms against 42.5, 100.0 and 197.1.
    One tone increase has no half-maximum crossing before its peak.
  deviations:
  - Latency follows the Methods (from the onset frame); the code's count, one frame later, is shown as a
    variant and matches the paper.
  - Tone onsets are shifted by 11 frames, the speaker delay in the paper's code, which the Methods do not
    mention.
- claim: fig5g-light-latency-gradient
  outcome: reproduced
  notebook: reproduce_vu_2024.ipynb
  output: claim:fig5g-light-latency-gradient
  notes: Over 240 fibers with a light latency (median 18 presentations each), relative latency is shorter
    anteriorly (Spearman rho(AP, latency) = -0.285, p = 7e-06); it also increases laterally (rho = 0.263,
    p = 3.8e-05) and not with depth (p = 0.93). Ranked within each mouse and tested by permuting within
    mice, which removes differences between mice and the dependence of relative latency on the number of
    fibers in a mouse, the gradient remains (r = -0.223, p = 0.0014).
  deviations:
  - Relative latencies do not depend on the code's one-frame offset, which cancels in the difference.
- claim: fig5h-tone-latency-gradient
  outcome: reproduced
  notebook: reproduce_vu_2024.ipynb
  output: claim:fig5h-tone-latency-gradient
  notes: Over 196 fibers with a tone latency (earlier of increase and decrease), relative latency is
    shorter posteriorly (rho(AP, latency) = 0.254, p = 0.00033; tail median 308 ms against 368 ms
    anterior). Increases alone (rho = -0.07, p = 0.5) and decreases alone (rho = -0.21, p = 0.028) do not
    show it, so the gradient comes from the tail's fast increases and the slower anterior decreases, as
    the paper says of Figure S6A-B. Ranked within each mouse and tested by permuting within mice, the
    gradient remains (r = 0.214, p = 0.003).
- claim: figs6cd-gradients-individual-mice
  outcome: partially_reproduced
  notebook: reproduce_vu_2024.ipynb
  output: claim:figs6cd-gradients-individual-mice
  notes: The tone gradient is positive in 6 of 7 mice (significant in DL20 and DL23); the light gradient is
