- claim: fig6g-dorsal-spread
  outcome: partially_reproduced
  notebook: reproduce_vu_2024.ipynb
  output: claim:fig6g-dorsal-spread
  notes: The decay rate is -0.971 per mm for 156 dorsal pairs and -1.403 for 109 ventral pairs, in the
