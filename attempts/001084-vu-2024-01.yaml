- claim: figs7a-photoswitch-confined
  outcome: reproduced
  notebook: reproduce_vu_2024.ipynb
  output: claim:figs7a-photoswitch-confined
  notes: In each of UG21's 3 sessions the stimulated fiber (12, 18 and 24, the numbers of the paper's code
