findings:
- kind: data_missing
  statement: The optogenetic sessions (Opto2, Opto4, Opto9, UG21) hold no stimulation times and no record
    of which fiber was stimulated; the trigger line the paper's code uses is not in the files. Both can
    be recovered only from the laser artefact in the DF/F, which is unambiguous in Opto2 and UG21 but
    spreads over many fibers in the tdTomato mice.
- kind: metadata_insufficient
  statement: The event table gives tone presentations without their frequency. DL18 has 44 tones, of which
    the paper analysed the 14 at 12 kHz; the frequency is stored only in a MATLAB object of the
    behaviour file on Zenodo. The tone start times are the trigger times, 11 frames before the sound
    according to the paper's code, which the dandiset does not say.
- kind: data_missing
  statement: DL15's sessions from 2021-09-10 (44 to 70 rewards) were run in a ViRMEn task; the paper keeps
    only rewards of one task phase, but the task variables are not in the files, so unpredicted rewards
    cannot be separated and Figure 1D can be tested only to week 8.
- kind: metadata_error
  statement: The FiberPhotometryTable column `included` is described as "whether this fiber has been
    successfully implanted", but it marks fibers within the striatum (the paper's in_striatum); in Opto2
    two fibers labelled Caudoputamen are not included, and with them the counts match the paper's "within
    or on the border of the striatum" (24 locations).
- kind: metadata_error
  statement: UG21's indicator is given as tdTomato. Its 3 sessions, 22 included fibers and stimulated fibers
    12, 18 and 24 match the paper's rDAm3.0 mouse without opsin (Figure S7A), so the indicator is
    consistent with being a mislabel; the files cannot show which indicator was expressed.
- kind: metadata_error
  statement: In DL31 and DL32 (18 Hz, interleaved 470 and 415 nm) the fiber photometry series store a
    regular rate, but the frame timestamps of the behaviour drift from it by up to 0.43 and 0.54 s over
    the session, so times computed from the stored rate are wrong by up to half a second.
- kind: data_missing
  statement: The data of Figures 2, 3, 7, S1, S3 and S5A-D are not in the dandiset (the CT scans, the
    freely moving recordings, the D1-cre jaw experiments, histology, planned fiber targets and the 470 and
    405 nm sessions of the salient-stimulus mice); they are on Zenodo. Opto9 has 12 sessions, so one of
    the paper's 26 tdTomato stimulations is missing.
- kind: code_mismatch
  statement: The paper's latency code (sal_stim_lat_plots.m) divides the 1-based index of the half-maximum
    frame by the frame rate, so its latencies are one frame (33 ms) longer than the Methods' definition.
    With that count the dandiset gives the paper's means within 2 ms.
- kind: code_mismatch
  statement: In the paper's cross-correlation of DF/F with locomotion (sal_stim_iti_acc_cc.m), negative
    lags are not shifted; they correlate the two signals at zero lag over a truncated range. The Methods
    describe a cross-correlation over +-500 ms.
- kind: code_mismatch
  statement: The Figure 1C legend describes 23 example fibers of a 93-fiber array; the paper's code for the
    figure plots 33 fibers of mouse 842, whose recording has 82 fibers.
- kind: metadata_insufficient
  statement: The archive's summary gives the approach as "cell population imaging" and lists only NWB
    container types as variables measured; the files hold multi-fiber photometry, treadmill velocity and
    behavioural events.
