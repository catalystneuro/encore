- claim: fig6-tdtomato-control-no-response
  outcome: reproduced
  notebook: reproduce_vu_2024.ipynb
  output: claim:fig6-tdtomato-control-no-response
  notes: No included non-stimulated fiber has a significant increase after stimulation in 304 fiber and
    session pairs of Opto4 (13 sessions) or 203 of Opto9 (12 sessions); median responses are -0.0002 and
    0.0003 DF/F, and one Opto9 pair has a significant decrease. The same test finds increases in 142 of
    619 pairs (20 distinct fibers) in Opto2. The files hold 25 tdTomato stimulations against the paper's
    26.
  deviations:
  - In these mice the laser artefact spreads to many fibers, and the stimulated fiber is taken as the one
    with the largest artefact, which can be wrong; the true stimulated fiber is then among the fibers
