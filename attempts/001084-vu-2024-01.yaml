- claim: fig6gh-release-decays-with-distance
  outcome: reproduced
  notebook: reproduce_vu_2024.ipynb
  output: claim:fig6gh-release-decays-with-distance
  notes: Over 266 pairs of 14 stimulated and 20 recording fibers (378 pairs, 18 by 21, in the paper), the
