outcomes:
- claim: link-code-tables
  outcome: partially_reproduced
  notebook: reproduce_bennett_2024.ipynb
  output: claim:link-code-tables
  notes: All 87 listed sessions are dandiset sessions (by the NWB identifier), and session type, mouse and genotype
    agree for all 99 sessions. In 81 of 87 sessions the code's units table and the dandiset agree unit by unit (no
    matched unit differs in max_drift, firing_rate or quality). In 6 sessions (1176989662, 1178460518, 1178693650,
    1179911454, 1180266229, 1181096406) 55 to 99.8% of matched units differ in max_drift and firing_rate and 14
    to 38% in quality, and the RF p values recomputed here are uncorrelated with the code's there (r = -0.02 over
    234 units, against 0.9989 over 6790 units in the other sessions), so the same unit ids name other units. In
    5 of them the code's table has 328 units (133 CP) on probes the dandiset does not hold; the dandiset has no
    unit missing from the code's table. Recomputed RF significance agrees with the code's for 98.8% of units where
    the units agree. The dependent claims are tested on all 87 sessions; leaving out the 6 changes their numbers
    little (shown for the unit counts, drift, QC fraction and yield).
  deviations:
  - A link claim added by the author; the code's notebook and tables are matched to the dandiset by session and
    unit identifiers.
