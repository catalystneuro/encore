findings:
- kind: metadata_error
  statement: In 6 of the 87 sessions the paper analysed (1176989662, 1178460518, 1178693650, 1179911454, 1180266229,
    1181096406) the units under each unit id differ from the paper's units table at the cited code commit (max_drift
    and firing_rate differ for 55 to 99.8% of units, quality for 14 to 38%, and receptive-field p values recomputed
    from the files are uncorrelated with the table's; the files' spike counts fit the files' firing rates but not
    the table's). The dandiset seems to hold a different spike sorting or unit assignment for these sessions than
    the one the paper used.
- kind: data_missing
  statement: In 5 of those sessions (1176989662, 1178693650, 1179911454, 1180266229, 1181096406) the paper's units
    table has 328 units, 133 of them in CP, that the session files do not hold. Each session's are on one probe of
    the table (probe_id 88, 46, 121, 133 and 139, with 38 to 114 of these units) whose probe_id is not among the
    file's and on which the file has no unit; none of their peak channels is a peak channel of a file's unit.
- kind: selection_undocumented
  statement: The 87 sessions passing ephys QC are listed only in the paper's code; the files and the dandiset metadata
    do not mark them, and the 12 other sessions are not explained. In the 87 sessions the files also hold 40 probe
    recordings (2004 units, 1873 on unannotated channels) that the paper's tables leave out, and nothing marks them.
- kind: metadata_insufficient
  statement: No file records the implant hole or probe orientation of an insertion, which probes were sharpened,
    which sessions had probes retracted 100 um, Dura-Gel use, or failed insertion attempts, so Figures 4B (trajectories),
    S4B, S4D to S4H and S3D cannot be tested.
- kind: data_missing
  statement: The dandiset holds none of the Figure 3 material (surgery records, ISI images, histology, MRI, training
    histories), the dual-hemisphere sessions of Figure 5, or the VGAT-ChR2 and Vglut2-Cre mice of Figure 6; its
    27 mice are all single-hemisphere change-detection mice.
- kind: data_missing
  statement: Sessions 1187475832 and 1202438738 have no eye tracking. In the others the running and pupil streams
    follow the stimulus and trial clock (running slows after hits from a median 0.225 s after the change, the pupil
    constricts after white flashes from a median 0.35 s), but in 5 sessions for running and 3 for the pupil the
    contrasts are too weak to show it, and 2 sessions (1173189336, 1230732154) have no running contrast, as they
    have no hit or no miss trials; in all, alignment of at least one stream is not shown in 12 of the 99 sessions.
- kind: paper_inconsistency
  statement: The Methods describe 8 natural images in the change detection task; every session holds four image
    stimuli (three natural images and im115_r at 0.7 contrast) besides omitted flashes.
- kind: methods_unavailable
  statement: For the alpha-event analyses (Figures 7, 8E, 8F and S6), please confirm (1) how the random-time coherence
    was formed, both areas at the random time (as the Methods read) or the reference area at the event against the
    other area at the random time (as the code does); (2) whether area membership used the ISI labels and exact
    CCF labels or the code's substring match (which puts POST units into PO and VISpm into VISp); (3) the event
    rule, four maxima (Methods) or three in a window with more than three (code). The outcomes of fig7cd-visp-coupling,
    fig7f-visp-network, fig7f-mop-network and fig8f-cp-rf-higher-coherence depend on these choices; the code's choices
    reproduce the 439 events of Figure 8F.
- kind: methods_unavailable
  statement: Please state the latency measure of Figure 8D (half-peak time and time of peak give different lags, so the
    claim is blocked here), the fit, its window and the normalisation behind the 25 to 30 min recovery time constant of Figure
    S4I (fits here give 35 to 36 min over 77 min and longer time constants over shorter windows), and the windows
    and row normalisation of Figure S6F.
