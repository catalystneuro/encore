- claim: fig7a-mop-higher-frequency
  outcome: reproduced
  notebook: reproduce_bennett_2024.ipynb
  output: claim:fig7a-mop-higher-frequency
  measured:
  - 4.0
  - 4.5
  notes: Under frequency reading (b), the autocorrelogram spectrum peak, VISp events at 4.0 Hz and MOp at 4.5 Hz
    (medians), MOp higher by the one-sided rank-sum test (p 5.3e-7 to 0.0016) in all 8 L, E and set combinations,
    which the criterion accepts. The 2 s autocorrelogram gives a 0.5 Hz grid on which the MOp median sits on the
    lower edge of the widened 4.5 to 7.7 Hz range (22.7% of L2 E2 MOp values are exactly 4.5 Hz); with the spectrum
    zero-padded to 0.049 Hz steps the medians are 4.05 to 4.10 Hz (VISp) and 4.64 to 4.74 Hz (MOp), inside the ranges,
    with MOp higher at p 7.1e-7 to 0.0038 in all 8. Under reading (a), the inverse of the median interval between
    maxima, VISp 4.17 to 4.21 Hz and MOp 4.35 to 4.55 Hz, and MOp is not significantly higher (p 0.078 to 0.76).
    1469 to 1704 qualifying VISp events and 80 to 122 MOp events. The detector finds synthetic sinusoidal rates
    of 3 to 5 Hz only (none at 2.5 Hz or below or 5.5 Hz or above), so a 5 to 7 Hz MOp band cannot appear under
    either reading; this follows from the event rule of the claims file.
  deviations:
  - Run under the claims file's 16 combinations of area membership (L1, L2), event rule (E1, E2), random-time coherence
    (R1, R2) and session set (a, b); population windows are cut from one 10 ms grid per session. Events are detected
    on the smoothed rate, and the autocorrelogram threshold, CCGs and coherence use the unsmoothed rate, a detail
    taken from the code's printed counts quoted in the claims file's header (1653 VISp and 113 MOp qualifying events,
    code cell 12), which the unsmoothed autocorrelogram matches (1643 to 1704 and 119 to 122 under E2) and the smoothed
    one does not (3035 to 3426 and 152 to 170). The Benjamini-Hochberg family of the pair test holds brain areas
    only (not CP-RF, CP-noRF, VIS or unannotated labels); this changes significance for 4 of 734 pair results.
  - Reading (b) restricts the spectrum peak to 1 to 20 Hz, a standard choice; the zero-padded spectrum (2048 points)
    is a standard interpolation shown as a variant.
