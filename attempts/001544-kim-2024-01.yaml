findings:
- kind: data_missing
  statement: >-
    The dandiset holds only the current-clamp step recordings of Figure 6 and Figure S12. The behaviour,
    immunohistochemistry counts, fiber photometry, chirp recordings and neuronal reconstructions are not
    in it, and the paper's data statement says all data will be shared by the lead contact on request.
    24 of the 31 claims in the claims file cannot be tested.
- kind: metadata_error
  statement: >-
    Every CurrentClampStimulusSeries is stated in amperes with conversion 1, but holds values from -60
    to 500, the step amplitudes in picoamperes.
- kind: metadata_insufficient
  statement: >-
    The DC current that holds each cell near -65 mV is not recorded; `bias_current` (1e-11 A) and `bridge_balance`
    (2e7 Ohm) hold the same value in all 44 files, which a holding current set per cell cannot. No segment
    of any sweep is free of the holding current, so the resting potential the Methods define ("measured
    in the absence of a current injection") cannot be obtained.
- kind: selection_undocumented
  statement: >-
    The home-cage (ALL) group holds 24 cells from 11 mice, where the Figure 6 legend reports 21 cells
    from 8 mice; the dandiset does not say which cells the paper left out or why. The APP (12 cells, 6
    mice) and AV (8 cells, 4 mice) groups match the legend.
- kind: metadata_error
  statement: >-
    The six APP mice are 4 male and 2 female in the files, where the Figure 6 legend says 3 male and 3
    female.
- kind: other
  statement: >-
    Five ALL mice (CG354, CG355, CG382, CG538, CG539; 9 cells) are 5.7 to 6.6 weeks old in the files,
    younger than the 8 to 12 weeks the STAR Methods give for all mice.
- kind: metadata_insufficient
  statement: >-
    Every sweep's starting_time is 0, so the order in time and the 10 s between steps are not recorded;
    series resistance is not recorded, so that exclusion rule cannot be checked. Three files carry suffixes
    `_NSD` and `_FL` on their identifiers, with no description; the two CG538 files sharing recording
    number 003 are different cells (input resistance 192 and 802 MOhm), and the `_FL` files use 5 s sweeps
    where all others use 2 s.
- kind: other
  statement: >-
    Five recordings (four APP, one ALL) reach -105.6 mV and stay there for 10 ms or more during the -60
    pA step, a recording floor that truncates the response; sag measured on these sweeps is underestimated.
    Three sweeps hold NaN for their last 0.1 to 0.6 s, after the step.
- kind: code_mismatch
  statement: >-
    The paper's code (v1.0.0) differs from the Methods in the spike threshold (10 against 20 mV/ms), spike
    latency (to the peak, not the threshold), AHP amplitude (minimum to the next spike on the first step
    with two spikes, not within 100 ms at rheobase) and tau (the -40 pA step, not -20 pA). Its downstroke
    window runs to the end of the step, and its test for a saturated sag response never fires.
- kind: paper_inconsistency
  statement: >-
    The STAR Methods say a nested ANOVA was run for the electrophysiology to account for cells from the
    same mouse, but the reported degrees of freedom (F(2, 38), t(31), t(27), t(18)) are those of cell-level
    tests on 41 cells.
- kind: methods_unavailable
  statement: >-
    Question for the paper's authors. Which 21 of the 24 home-cage cells (and which 8 of the 11 mice)
    were analysed, and how was the rule on a 20% change of series resistance, input resistance or resting
    potential applied? The sag and shared-feature outcomes here change with the cell set (sag of AV against
    ALL p = 0.087 on all 24 cells, 0.0072 without the three `_FL` cells). And how was the membrane potential
    of Figure 6G measured "in the absence of a current injection", when the files hold only sweeps under
    the DC holding current?
