  assumed: true
  notebook: reproduce_kim_2024.ipynb
  output: claim:figs12a-sag-higher
  notes: >-
    Sag ALL 3.22, APP 6.68, AV 4.90 mV. APP exceeds ALL under both readings (t = 2.71, p = 0.011; mixed
    model p = 0.0041); AV does not (t = 1.77, p = 0.087; mixed model p = 0.24). The outcome depends on
    the cells. Without the `_FL` cells reading (a) gives both pairs (p = 0.0036 and 0.0072) and reading
    (b) misses AV (p = 0.12); without the cells that changed by more than 20% neither pair holds (p =
    0.18 and 0.086). Five cells (four APP, one ALL) saturate at -105.6 mV during the -60 pA step. Using
    the next unsaturated step for them, neither pair holds on all cells (p = 0.053 and 0.085), and both
    hold on the cells without `_FL` (reading (a) p = 0.0082 and 0.0067, reading (b) p = 0.0051 and 0.028).
    Question for the paper's authors (see findings) on which 21 ALL cells were analysed.
  deviations:
