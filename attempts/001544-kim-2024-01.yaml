    and 10 ALL cells, which does not fit the dandiset's APP and AV counts already equalling the paper's,
    so it is a variant, not the main set.
  - >-
    Sag uses the -60 pA step as the code computes it (sagpotential.m, 20 ms median filter, maximum of
