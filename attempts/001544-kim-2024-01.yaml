- claim: fig6f-max-firing-rate
  outcome: reproduced
  notebook: reproduce_kim_2024.ipynb
  output: claim:fig6f-max-firing-rate
  notes: >-
    Max firing rate ALL 12.5, APP 50.5, AV 49.25 Hz over 24, 12 and 8 cells. Reading (a) F(2, 41) = 10.83
    (paper 10.71); ALL against APP t(34) = 5.07, p = 1.4e-05 (paper t(31) = 5.36); ALL against AV t(30)
    = 3.91, p = 0.00049 (paper t(27) = 2.80). Reading (b), mixed model, p = 0.00085 and 0.0098. Both pairs
    stay below 0.05 without the `_FL` cells (21 ALL, F(2, 38) = 9.80), without the cells whose test-pulse
    resistance changed by more than 20% (p 0.0011 to 0.024) and with all steps in the file as the code
    takes them (p 6.6e-05 to 0.025). Per mouse, APP means 4 to 87 Hz, AV 13 to 90, ALL 4 to 29. The Methods'
    switch to non-parametric tests would apply (Shapiro-Wilk p 0.00023); Kruskal-Wallis p = 0.003.
  deviations:
  - >-
    The dandiset holds 24 ALL cells from 11 mice where the paper analysed 21 from 8, and does not say
    which were left out. All 24 are used (assumed, as the dataset labels them), with the 21 cells left
    when the three `_FL` files are set aside, and the cells passing the 20% change rule, shown as variants.
  - >-
    Reading (b), the nested ANOVA of the STAR Methods (Quantification and statistical analysis, "a nested
    ANOVA was run to account for replicate values obtained from the same mouse"), is fitted as a linear
    mixed model with a random intercept per mouse (REML) and Wald tests, with the classical nested F beside
    it; the paper does not give its software's model beyond Prism or SigmaPlot.
  - >-
    Exclusion rules (STAR Methods, Electrophysiology). Input resistance under 50 MOhm and resting potential
    above -50 mV exclude no cell. Series resistance is not in the files. The 20% change rule was read
    through the -20 pA test pulse of each sweep, first sweep against last; it would remove 2 APP, 2 AV
    and 10 ALL cells, which does not fit the dandiset's APP and AV counts already equalling the paper's,
    so it is a variant, not the main set.
  - >-
    Spike detection, the step window and the f-I slope follow the paper's code, nsdesai/patch_clamp_analysis
    v1.0.0 (commit 4ee1125), as the claims file says.
  - >-
    Only steps from -60 to 200 pA are used (STAR Methods, Electrophysiology, "-60 to 200 pA amplitude",
    and item 16, "a current step between 0 and 200 pA"); the code's use of every step in the file is a
    variant.
