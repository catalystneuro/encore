- claim: fig2a-weak-sensory-silenced
  outcome: not_reproduced
  notebook: reproduce_jarzebowski_2026.ipynb
  output: claim:fig2a-weak-sensory-silenced
  notes: 'With L5 IT 12 nS, ChC 25 nS and L4 from 2 to 11.9 nS (basket 1.2 times L4, simultaneous onset),
    the expected count is 0.90 to 0.975 per run, against 0.975 for the prediction alone; the five seeds
    give 0.89 to 0.99. The neuron is quietest near L4 40 nS (0.15 spikes per run), where L4 conductance
    exceeds L5 IT''s, so the paper''s "weaker than the predictive input" may compare the inputs on another
    scale. Without noise the failure is the same: a release spike fires at 18.7 ms for every L4 from 0
    to 10 nS and none from 12 nS. At L4 10 nS the basket conductance (1.2 times L4) peaks at 12 nS and
    has fallen to 6.4 nS at 18 ms while L5 IT is still 7.7 nS and ChC 4.5 nS, so the AIS reaches threshold
    as the clamp decays. In this model the release spike is vetoed only when L4 is at least as strong
    as L5 IT in conductance; a question to a reader asks how the paper compares the two inputs.'
  deviations:
  - The model is integrated in NumPy with the Euler-Maruyama method at dt 0.1 ms from the Methods' equations
    and parameters (Methods, Computational model of L2/3 neuron; Synaptic connectivity and kinetics),
    not in Brian 2, as the paper's code was not public; 50 ms of rest before the inputs and a 100 ms counting
    window are standard choices.
