- claim: model-positive-error-short-latency
  outcome: partially_reproduced
  notebook: reproduce_jarzebowski_2026.ipynb
  output: claim:model-positive-error-short-latency
  notes: 'With L4 at 60 nS and no prediction all 80 runs spike, first spike a median 3.75 ms after L4
    onset; half the runs fire doublets from 90 nS and all from 115 nS. Under the claim''s seed 1 of 81
    spikes at 60 nS (0.012) falls after the basket conductance peak (8.5 ms after L4 onset), so the strict
    "no spike after the basket peak" fails; seeds plus 1000 to 4000 give latencies 3.7 to 3.8 ms and 0
    or 0.012 late spikes (criterion met under 3 of 5). Over every L4 from 0 to 150 nS, 0.009 of first
    spikes and 0.046 of all spikes fall after the basket peak under the claim''s seed: single spikes at
    weak L4 (15 to 30 nS, 18 spikes), second spikes of doublets (75 to 120 nS, 119 spikes) and 1 each
    at 60, 65 and 70 nS.'
  deviations:
  - The model is integrated in NumPy with the Euler-Maruyama method at dt 0.1 ms from the Methods' equations
    and parameters (Methods, Computational model of L2/3 neuron; Synaptic connectivity and kinetics),
    not in Brian 2, as the paper's code was not public; 50 ms of rest before the inputs and a 100 ms counting
    window are standard choices.
  - The criterion's first few ms is read as before the basket conductance peak (8.5 ms), a choice made
    here.
  seed_sensitive: true
