- claim: fig4b-chc-reduction-shortens-latency
  outcome: reproduced
  notebook: reproduce_jarzebowski_2026.ipynb
  output: claim:fig4b-chc-reduction-shortens-latency
  notes: L5 IT 12 nS, ChC 0 to 50 nS, L4 0 to 150 nS, 10 runs. At all 16 L4 conductances where every ChC
    level has spiking runs, latency rises with ChC (rho 0.46 to 0.99, median 0.95). The breakthrough threshold
    rises with ChC from 0 to 115 nS (rho 0.97). Taken literally, the lowest L4 > 0 with expected count
    >= 0.5 is 5 nS at every ChC level, because the release spike fires at weak L4, so that part of the
    criterion cannot fall; the outcome rests on reading it as the breakthrough threshold. All five seeds
    agree. Question for the authors in the findings.
  deviations:
  - The model is integrated in NumPy with the Euler-Maruyama method at dt 0.1 ms from the Methods' equations
    and parameters (Methods, Computational model of L2/3 neuron; Synaptic connectivity and kinetics),
    not in Brian 2, as the paper's code was not public; 50 ms of rest before the inputs and a 100 ms counting
    window are standard choices.
  - ChC 0 to 50 nS in steps of 5 is a plotting choice.
  - Assumption. The lowest L4 that drives a spike is taken as the breakthrough threshold, the lowest L4
    above the conductance of least firing where the expected count reaches 0.5, after the paper's 'L4
    threshold required for generating a positive error' (Results, L5 IT excitatory drive / chandelier
    cell inhibitory balance, paragraph 1). The plain reading is printed and cannot decide the claim.
  assumed: true
