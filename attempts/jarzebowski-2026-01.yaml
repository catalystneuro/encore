findings:
- kind: metadata_error
  severity: minor
  statement: In 7 sessions, 351 VISp units that pass the quality criteria have peak-channel CCF coordinates
    x, y and z all 0, while the electrodes table names their location VISp. The zeros stand for missing
    coordinates, so these units cannot be given a layer.
- kind: metadata_insufficient
  severity: minor
  statement: The units and electrodes tables have no column descriptions (firing_rate, waveform_duration,
    snr, isi_violations, presence_ratio, amplitude_cutoff, x, y, z among them). Units (Hz, ms, um in the
    CCF) can be read from the values and the Allen documentation, but not from the files.
- kind: other
  about: data
  severity: minor
  statement: In session 20211111T220915 the 10 s spontaneous block that elsewhere follows the active task
    by 18 to 29 s starts 3277 s after the last task presentation, and the passive replay follows correspondingly
    later. The files do not say what happened in the gap.
- kind: other
  about: data
  severity: none
  statement: Checks that passed. 153 sessions from 81 mice, no two sharing a spike-train signature; 4795
    to 4811 active-task presentation rows (with omissions) per session at 750 ms onset intervals; spontaneous
    blocks of 10.0 and 289.0 s; running speed in cm/s. The VISp population count separates images from
    omissions 30 to 100 ms after onset (median AUC 0.95) and not before onset (0.44 to 0.56), consistent
    with spikes and stimulus tables sharing a clock. In 10 sessions the AUC is below 0.8 (lowest 0.55,
    20201203T231053), and 2 sessions have no VISp unit passing the criteria (20210616T205318, 20210819T204407);
    there the shared clock is not established here. 7996 of 7997 VISp units with coordinates fall in VISp
    in the CCFv3 annotation.
- kind: methods_unavailable
  statement: The Methods do not say which sessions enter the analysis. Over all 153 sessions the selection
    gives about 35% more cells and 45% more recordings than the paper's 266 L2/3 cells from 78 recordings
    and 1075 L5 cells from 98; over the 104 sessions of the Sst-Cre and Vip-Cre Ai32 mice, whose units
    can be optotagged, every reading matches. Did the analysis use only those sessions?
- kind: methods_unavailable
  statement: The Methods take spontaneous activity from 'the period of mouse inactivity immediately following
    the task'. The dataset has a 10 s grey screen right after the task and a 289 s spontaneous block after
    the receptive-field mapping. Against the 10 s block L2/3 omission firing does not differ from spontaneous
    and L5 omission FSB is higher; against the 289 s block both are lower. Which block, and which windows
    within it (all, or stationary only), did Figure 6 use?
- kind: methods_unavailable
  statement: How FSB is formed for a cell (spikes in bursts summed over windows, or a mean of per-window
    fractions), whether burst spikes must fall within the 250 ms window, and how cells without spikes
    in a condition are treated are not stated; the readings change the Figure 5C intercepts by a factor
    of about 1.7 and decide whether Figure 7A's L5 effect is significant. Which was used?
- kind: methods_unavailable
  statement: The selection of the 47 L2/3 and 658 L5 cells of Figures 7C and 7D is not stated. Requiring
    omission windows in both running states gives 365 and 1407 cells; requiring an omission spike in each
    state gives 210 and 1108. Under the first, L2/3 omission FSB is higher when running (p = 0.005) and
    both omission rate indices are positive. What rule gave 47 and 658 cells?
- kind: methods_unavailable
  statement: The model's code is not public, and the Methods do not give the L4 and L5 IT onsets relative
    to each other in Figures 2A and 2B, the conductance ranges of Figures 2 to 4, or the threshold that
    defines a burst or a positive error. With simultaneous onsets and the Methods' parameters, L4 below
    12 nS with the prediction does not silence the neuron (0.9 spikes per run), and at Low and Mid gain
    release spikes almost never occur, so Figure 2A and 3C are not reproduced. Which onsets and ranges
    were used, and how is 'weaker than the predictive input' measured?
- kind: paper_inconsistency
  statement: The Figure 5C legend prints the L5 slope as t(7523) = 8.1 with CI [-0.0011, -0.0007], a positive
    t with a negative interval, and the L2/3 slope as t(1860) = -0.59 with CI [-0.001, 0.004], whose centre
    is positive. The data here give a negative L5 slope (t = -2.91), as the Results and the CI have it.
- kind: other
  about: paper
  statement: The text of the preprint has a heading for Supplemental Figures with nothing under it, so
    the legends of Figures S1 and S2, which hold the tests of four findings, could not be read.
