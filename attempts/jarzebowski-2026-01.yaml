- claim: fig2d-latency-grows-as-sensation-weakens
  outcome: reproduced
  notebook: reproduce_jarzebowski_2026.ipynb
  output: claim:fig2d-latency-grows-as-sensation-weakens
  notes: Over 31 L4 conductances (0 to 150 nS) where runs spike, the mean first-spike latency falls from
    18.4 ms to 2.36 ms, Spearman rho -0.999. The largest 5 nS step, 3.25 ms between 35 and 40 nS, resampled
    at 1 nS with 4000 runs per conductance, changes latency by 3.03 ms in five steps of which the largest
    is 1.30 ms (0.43 of the change), and 0.40 of first spikes in that interval fall between 8 and 12 ms,
    between the release and breakthrough latencies. Seeds give rho -0.989 to -0.999 and a largest 1 nS
    share of 0.23 to 0.43. The coarse test against a quarter of the latency range fails under 3 of 5 seeds
    (steps of 5.25, 6.28 and 6.06 ms); the resampling shows these steps are sampling noise of the 80-run
    means.
  deviations:
  - The model is integrated in NumPy with the Euler-Maruyama method at dt 0.1 ms from the Methods' equations
    and parameters (Methods, Computational model of L2/3 neuron; Synaptic connectivity and kinetics),
    not in Brian 2, as the paper's code was not public; 50 ms of rest before the inputs and a 100 ms counting
    window are standard choices.
  - Assumption. "Without a single jump" is tested as continuity, a choice made here as the criterion gives
    no number. The interval of the largest 5 nS step is resampled at 1 nS with 4000 runs; a jump is one
    1 nS step that carries more than half the latency change across that interval. The earlier test (largest
    5 nS step below half the latency range) and a stricter one (below a quarter) are printed.
  assumed: true
