outcomes:
- claim: quiescent-window-link
  outcome: partially_reproduced
  notebook: reproduce_huang_2025.ipynb
  output: claim:quiescent-window-link
  notes: 399 of 455 developmental rows (87.7%) and 56 of 96 DREADD rows (58.3%) match a file; the unmatched
    rows are mostly those of three subjects with no file (C57-C4-3-ALBR, -AR, -BL; 40 developmental and
    28 DREADD rows) and the P13 and P15 rows of C57-C6-2-AL, which has only P11 files; one file (C57-C2-1-ALAR
    session 12, P15 before CNO) matches no DREADD row. On matched records the age agrees in 397 of 399
    (the P190D file is matched to a P11 row) and the sex in 387 (the others are the 12 files with sex
    U). The Pearson correlation recomputed equals the table's (r = 1.000, 99.7% within 0.001); event frequency
    r = 0.93, tCC 0.95, silhouette 0.93. With the window shifted by 30 s the event frequency agreement
    falls to r = 0.82 and 0.79 and the share within 5% from 0.71 to 0.15 and 0.12. The partial link means
    the dependent claims are tested on 387 of the paper's 453 developmental datasets (30 of 35 subjects)
    and 56 of 96 DREADD datasets (7 of 10 mice).
  deviations:
  - Rows with no file are left out; ties of two candidate files are broken by age (2 cases).
- claim: fig1d-event-frequency-decline
  outcome: reproduced
  notebook: reproduce_huang_2025.ipynb
  output: claim:fig1d-event-frequency-decline
  notes: P11 minus P21 is 0.617 events/s (95% interval 0.418 to 0.813, p < 0.0001) under O6 a and 0.621
    under O6 b; the selected model has main effects only, so the contrast is the same in all four sex
    and layer groups. The repository printed 0.605.
  deviations:
  - The quiescent windows are the repository tables' Time_start and Time_end (O1 reading a); the dandiset
    holds no behavioural video, so reading b could not be run.
  - Test T1 or T2 re-implemented in Python; likelihood-ratio tests replace the Kenward-Roger comparisons
    of model_select, and bootstrap replicates refit the fixed effects by generalized least squares with
    the variance components of the original fit, where the R code refits lmer. On the paper's own table
    the implementation gives the repository's printed contrasts to within a few hundredths (data check).
  - 387 developmental datasets of 30 subjects (the tables have 453 after dropping Location 4), after leaving
    out 12 files of two subjects with sex U; three subjects of litter C57-C4-3 and some fields are not
    in the dandiset.
