- claim: fig2e-subnetworks-present-same-number
  outcome: reproduced
  notebook: reproduce_huang_2025.ipynb
  output: claim:fig2e-subnetworks-present-same-number
  notes: All 86 P11 datasets have at least one subnetwork under all four readings. With the code's participation
    test P11 minus P21 has p >= 0.05 in every group (10 runs -0.075, p = 0.88; 100 runs 0.41 and 0.35,
    p = 0.45 and 0.64). With the Methods' 95th percentile, P21 has more subnetworks in some groups (100
    runs 2 of 4 groups with p < 0.05, e.g. F L2/3 -2.79, p = 0.040; 10 runs 3 of 4), which would not reproduce.
    Mean subnetworks at P11 and P21 3.86 and 4.12 (10 runs, code test).
  assumed: true
  deviations:
  - Assumed that the paper's results used the code's readings of the open details (O2 Step7 synchrony
    threshold, O3 10 k-means runs per cluster number as Modol_script.m calls kmeansopt, O4 the 1 - 0.05/NCl
    participation quantile, O5 a all ROIs as denominator, O6 a cells with events), where the claims file
    names the Methods' as main; the paper's own per-dataset tables agree with the code's readings (non-cluster
    ROIs 25.7% with the code's test, 9.1% with the Methods', 25.0% in the table; synchrony 1.60 with Step7
    and 0.91 with the Methods' threshold, 1.45 in the table), and the readings give different outcomes
    for this claim. Every reading is shown in the notebook.
  - The quiescent windows are the repository tables' Time_start and Time_end (O1 reading a); the dandiset
    holds no behavioural video, so reading b could not be run.
  - Test T1 or T2 re-implemented in Python; likelihood-ratio tests replace the Kenward-Roger comparisons
    of model_select, and bootstrap replicates refit the fixed effects by generalized least squares with
    the variance components of the original fit, where the R code refits lmer. On the paper's own table
    the implementation gives the repository's printed contrasts to within a few hundredths (data check).
  - 387 developmental datasets of 30 subjects (the tables have 453 after dropping Location 4), after leaving
    out 12 files of two subjects with sex U; three subjects of litter C57-C4-3 and some fields are not
    in the dandiset.
  - k-means is scikit-learn's (k-means++, one start per run) on the coordinates Q times lambda of the
    covariance matrix's eigendecomposition, which keep the distances between its rows; participation thresholds
    are exact hypergeometric quantiles in place of 5,000 shuffles; the cluster significance test of Modol_script.m,
    which the later steps do not use, is not run.
