- claim: figs2g-mi-decline
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_huang_2025.ipynb
  output: claim:figs2g-mi-decline
  notes: Run under the claims file's MI (calculate_mi_matrix_trace.m, 256 bins, Z-scored traces); P11
    minus P21 is -0.160 (p = 0.22), the same in all groups (linear model). The paper's MI cannot be recomputed.
    The repository's calculate_mi_matrix_trace.m (256 bins) applied to the dataset's Z-scored traces in
    the paper's windows gives values about ten times the MI in Kmean_CovM_MI_Corr.xlsx (ZF_R_allpair_mean;
    median ratio 10.2, range 3.9 to 23.4), uncorrelated with them over 387 datasets (r = 0.09) and strongly
    dependent on the window length (r = -0.84, against -0.17 for the table's MI). The Methods (Data analysis
    for calcium imaging) say only that MI was computed on Z-score normalized traces during quiescence.
    The question for the authors is which traces, bins and normalization produced the table's MI.
  deviations:
  - The quiescent windows are the repository tables' Time_start and Time_end (O1 reading a); the dandiset
    holds no behavioural video, so reading b could not be run.
  - 387 developmental datasets of 30 subjects (the tables have 453 after dropping Location 4), after leaving
    out 12 files of two subjects with sex U; three subjects of litter C57-C4-3 and some fields are not
    in the dandiset.
