findings:
- kind: data_missing
  statement: The dandiset holds no behavioural video, limb or face tracking, or the quiescent windows
    the paper selected from them, although its keywords list behavior and pose estimation and its description
    mentions synchronized behavioral video. Every imaging measure of the paper is computed in those windows;
    here they are taken from the code repository's tables.
- kind: data_missing
  statement: Three mice of the paper's tables (C57-C4-3-ALBR, C57-C4-3-AR, C57-C4-3-BL; 40 of 455 developmental
    and 28 of 96 DREADD rows) and the P13 and P15 fields of C57-C6-2-AL (12 developmental and 12 DREADD
    rows) have no file. The dandiset has 32 subjects; the paper reports 34 mice at P11 and 10 DREADD mice.
- kind: metadata_error
  statement: sub-C57-C2-1-AL_ses-0 gives the age as P190D, with session date 2022-03-12 and birth date
    2021-09-03; the subject's other sessions are at P11 to P21 in September 2021, and the file matches
    the paper's P11 row P11_C2-1_AL_L1_140.
- kind: metadata_error
  statement: The 12 files of C57-C6-2-AL and C57-C6-2-AR give sex as U; the paper's tables give M. The
    subject description gives the line as Cre Chrm3q for every subject, including the C57BL/6J, FGF9 and
    hM4Di animals, and the genotype field is empty.
- kind: metadata_insufficient
  statement: The ca_events series is described only as Ca_Events with unit a.u. Its non-zero frames are
    the events of the paper's Step2 detection (99.8% of frames agree with Step2 run on the file's own
    Z score), but its values (of order 0.001) are not the Z-score amplitudes Step2 stores and are not
    explained. The CNO condition is coded only in the session description (CNOInjection and P15CNO), and
    the imaging plane's indicator is unknown, not jRGECO1a.
- kind: methods_unavailable
  statement: The paper's MI cannot be recomputed. The repository's calculate_mi_matrix_trace.m (256 bins)
    applied to the dataset's Z-scored traces in the paper's windows gives values about ten times the MI
    in Kmean_CovM_MI_Corr.xlsx (ZF_R_allpair_mean; median ratio 10.2, range 3.9 to 23.4), uncorrelated
    with them over 387 datasets (r = 0.09) and strongly dependent on the window length (r = -0.84, against
    -0.17 for the table's MI). The Methods (Data analysis for calcium imaging) say only that MI was computed
    on Z-score normalized traces during quiescence. The question for the authors is which traces, bins
    and normalization produced the table's MI.
- kind: methods_unavailable
  statement: The Methods and the code disagree on three details that change outcomes here, and the paper's
    tables show that the code's were used. The Methods describe a synchrony threshold from the peaks of
    100 rate-preserving shuffles, 100 k-means runs per cluster number and a 95th-percentile participation
    test; Step7 uses pooled circular shifts, Modol_script.m calls kmeansopt with 10 runs and tests participation
    at the 1 - 0.05/NCl quantile. With the Methods' readings the per-dataset values differ from the paper's
    tables (median non-cluster ROIs 9.1% against 25.0%; synchrony 0.91 against 1.45 events/s) and 13 of
    the tested claims change outcome. The authors could confirm which were used.
- kind: paper_inconsistency
  statement: The Discussion says k-means grouped about 25% of events, 1% in multiple clusters and about
    30% at P11 (Figure S7 legend); the repository's own table (No_assemblies, M_assemblies) gives 13.5%,
    0.35% and 21.6% over the datasets in the dandiset, which this attempt reproduces (13.6%, 0.31% and
    21.6%).
