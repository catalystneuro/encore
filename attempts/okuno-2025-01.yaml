- claim: fig4b-ppssi-distribution
  outcome: partially_reproduced
  notebook: connectome_okuno_2025.ipynb
  output: claim:fig4b-ppssi-distribution
  measured: 138144
  notes: The paper's per-neuron PPSSI table (Zenodo 15532272, data/flywire783_neuron_sepidx0sr140_3000mi1.mat) lists 139,255
    neurons, the paper's count, but 1,111 carry no PPSSI, so 138,144 have one (the code's README prints 6154/138144 for the
    fully segregated ones, the same denominator). The mean PPSSI is 0.471 (median 0.451, SD 0.235), within 0.4 to 0.6; the
    histogram is unimodal with a peak at 0.40 to 0.45 and a second peak of 7,262 neurons at 0.95 to 1. The mean holds; the
    count of neurons with a PPSSI is 0.8% below the stated number, outside the tolerance of 0. The claims file's quantity,
    neurons with a PPSSI = 139,255, may misread the paper, whose 139,255 is the number of neurons the index was applied to;
    this is asked in questions/okuno-2025.yaml.
  deviations:
  - The PPSSI is the paper's own per-neuron value from its Zenodo record, not recomputed by DBSCAN from the FlyWire synapse
    table (Zenodo 10676866).
- claim: fig4a-unsegregated-ranking
  outcome: blocked
  blocked_by: other
  notebook: connectome_okuno_2025.ipynb
  output: claim:fig4a-unsegregated-ranking
  notes: 'The FlyEM half needs a per-neuron DBSCAN of the hemibrain v1.2 synapses (public in DVID), which neither the code
    repository nor Zenodo 15532272 holds and which was not run in this revision for lack of time. The FlyWire half was tested:
    the ranking score recomputed from the deposited DBSCAN counts (makeNeuralSC.m, W the neuron''s clustered synapse count)
    gives a PPSSI matching the deposited table to 1e-4, and ranks 1 to 4 are APL left, CT1 left, APL right and CT1 right,
    as the claim says (cell types from the FlyWire annotation table, Schlegel et al. 2024, at commit a83b277).'
