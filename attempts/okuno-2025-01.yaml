  outcome: reproduced
  notebook: reproduce_okuno_2025.ipynb
  output: claim:fig3c-regional-detection
  notes: From the same table, FlyEM cf0.8 against FlyWire sc140. FlyEM is higher in aL and bL (left and right) and in every
    mushroom body ROI among the primary ROIs (aL, a'L, bL, b'L, gL, CA, PED), and in EB, FB, NO and PB; FlyWire is higher
