- claim: fig3a-postsynapse-counts
  outcome: partially_reproduced
  notebook: reproduce_okuno_2025.ipynb
  output: claim:fig3a-postsynapse-counts
  notes: From the paper's table of post-synapse counts per ROI (Zenodo, results/sc/hemiroi_postsyncount.mat), summed over
    the 63 primary ROIs as plotStructConnectivity.m does. FlyWire has 18.83 million at cleft score 50 (expected 18.8) and
    11.24 million at 140 (expected 11.4); FlyEM has 11.57 million at confidence 0.8. The deposited table holds FlyEM at confidence
    thresholds 50 to 90 only (18.12 million at 0.5), so the 21.4 million at confidence 0 is untested; the notebook now says
    so. Two of the three values hold; the third is untested.
  deviations:
  - Counts are the paper's per-ROI table in its Zenodo record, not recounted from the DVID and FlyWire synapse tables, which
    would need the transforms to the template.
- claim: fig3c-regional-detection
  outcome: reproduced
  notebook: reproduce_okuno_2025.ipynb
  output: claim:fig3c-regional-detection
  notes: From the same table, FlyEM cf0.8 against FlyWire sc140. FlyEM is higher in aL and bL (left and right) and in every
    mushroom body ROI among the primary ROIs (aL, a'L, bL, b'L, gL, CA, PED), and in EB, FB, NO and PB; FlyWire is higher
    in LO(R), ME(R), CAN(R) and FLA(R). Both readings of the mushroom bodies hold.
  deviations:
  - Counts are the paper's per-ROI table in its Zenodo record, not recounted from the raw connectomes.
