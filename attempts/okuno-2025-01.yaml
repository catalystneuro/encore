    the per-volume speed and walking regressors it computed (data/behavior.mat), used to check the subject order.
  source: https://github.com/takuto-okuno-riken/flywalk at commit 4b92add4a44f641ab6add809ff6b0e0d6110b50c
- what: The paper's demo data, version of 2025-05-28; FlyWire sc140 SC of the hemibrain ROIs, the selected-synapse SC matrices
    (sp10db3000mi1_only1, sp90db3000mi1, rc20_only1), the 99 null SC matrices of each permutation test, per-ROI transmitter
    counts and post-synapse counts, and the paper's own FC-SC output for the hemibrain FlyWire setting (used as a reference
    only).
  source: doi:10.5281/zenodo.15532272
- what: FlyWire cell-type annotations (Schlegel et al. 2024), used only to name the neurons in the FlyWire rankings and the
    WAGN partners.
  source: https://github.com/flyconnectome/flywire_annotations at commit a83b277
outcomes:
- claim: fig1-poltcomp-optimal
  outcome: blocked
  blocked_by: data_missing
  notes: The claim rests on the SCKm or DistKm ROI atlases (k-means parcellations of the hemibrain voxels), which are in neither
    the code repository at 4b92add nor Zenodo 15532272 (both versions were listed; the later code commits hold no atlas either).
    Zenodo holds the SC connect lists of these atlases but not the voxel-to-ROI assignment, so the dataset's FC cannot be
    put in the same ROIs. makeVoxelROIatlas.m rebuilds them by k-means, which would not reproduce the published ROIs, and
    a new SC would need the FlyEM synapse positions in the template, which are not published. The hemibrain 52-ROI part could
    be run, but readings (a) and (b) both need the SCKm and DistKm types, and 23 of the 37 nuisance combinations use the SPM12
    head-motion parameters, which were not computed here; it was not run.
