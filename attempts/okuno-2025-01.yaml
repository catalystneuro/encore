- claim: fig3d-flyem-vs-flywire
  outcome: partially_reproduced
  notebook: reproduce_okuno_2025.ipynb
  output: claim:fig3d-flyem-vs-flywire
  measured:
  - 0.6159
  - 0.5753
  assumed: true
  notes: '63 primary ROIs, no smoothing, Poly-tCompCor, code''s eight flies, SC neuron layer 2. FlyEM
    r = 0.616 and FlyWire r = 0.575, so FlyEM is higher but both are below the tolerances (0.657 to 0.803
    and 0.612 to 0.748). FlyEM is higher in every variant: no nuisance removal 0.638 against 0.606, nine
    flies 0.608 against 0.568, signed FC (O3) 0.616 against 0.575, left and right swapped 0.531 against
    0.520. Synapse SC gives 0.561 against 0.530. The paper''s own output file for the FlyWire setting
    (Zenodo, results/auc/poltcomparhemiroi_fw0sr140-fcauc.mat) gives R(7) = 0.684 with the same SC, so
    the shortfall is in the FC computed here, not in the SC.'
  deviations:
  - Registration (claims file O2). The paper gives no SPM12 or ANTs settings. Here no SPM12 motion or
    slice-timing correction was run; the mean of three blocks of 152 green volumes was registered to the
    resized FDA template with antspy (affine start, the better of mean squares and Mattes mutual information,
    then SyN with defaults), and the ROI means were computed through the registration's linear interpolation
    map, which equals warping each volume and averaging (extractROItimeseries.m). The outcome rests on
    this choice. The registration is not exactly repeatable between runs, so values can move in the second
    or third decimal.
  - tCompCor (claims file M3). The 1000 highest-SD voxels are taken among native voxels inside the template's
    field of view, not among template voxels after warping, an assumption made to avoid warping every
    volume. Their SD is taken on the mean-centred series before detrending, as lib/getNuisancetCompCor.m
    does (the claims file's M3 says after detrending; the code it cites is followed).
  - Native voxel size from the NWB grid_spacing (2.55 to 2.61 by 2.61 to 2.68 by 5 um); the paper's NWB-to-NIfTI
    script is not published, so the voxel size its NIfTI headers carried is not known.
  - Subjects. The code's subject list [1 2 3 4 5 6 8 9] is applied to the flies in name order, which the
    notebook confirms by reproducing the code's per-volume speed and walking regressor (data/behavior.mat)
    fly by fly to 1e-5; the seventh fly is fly-100. Nine flies are shown as a variant.
  - Left-right orientation. The files do not state it, and a symmetric brain cannot fix it. No flip is
    assumed; with left and right swapped the matrix-level FC-SC correlations are lower (FlyEM 0.531 against
    0.616), which supports the choice. The swapped result is shown for every claim.
  - The FlyEM SC is the 114-ROI cf0.8 connect list of the code repository indexed by the 63 primary ROIs
    of the FlyWire file; the paper's hemiroi_hb0sr80 file is not published but is computed by the same
    function over all 114 ROIs (makeStructConnectivity.m).
