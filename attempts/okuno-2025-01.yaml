outcomes:
- claim: fig1-poltcomp-optimal
  outcome: blocked
  blocked_by: data_missing
  notes: The claim rests on the SCKm or DistKm ROI atlases (k-means parcellations of the hemibrain voxels),
    which are in neither the code repository at 4b92add nor Zenodo 15532272 (both versions were listed;
    the later code commits hold no atlas either). Zenodo holds the SC connect lists of these atlases but
    not the voxel-to-ROI assignment, so the dataset's FC cannot be put in the same ROIs. makeVoxelROIatlas.m
    rebuilds them by k-means, which would not reproduce the published ROIs, and a new SC would need the
    FlyEM synapse positions in the template, which are not published. The hemibrain 52-ROI part could
    be run, but readings (a) and (b) both need the SCKm and DistKm types, and 23 of the 37 nuisance combinations
    use the SPM12 head-motion parameters, which were not computed here; it was not run.
