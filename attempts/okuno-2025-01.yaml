- claim: fig3d-flyem-vs-flywire
  outcome: partially_reproduced
  notebook: reproduce_okuno_2025.ipynb
  output: claim:fig3d-flyem-vs-flywire
  measured:
  - 0.6058
  - 0.5664
  assumed: true
  notes: >-
    63 primary ROIs, no smoothing, Poly-tCompCor, code's eight flies, SC neuron layer 2. FlyEM r = 0.606 and FlyWire r
    = 0.566, so FlyEM is higher but both are below the tolerances (0.657 to 0.803 and 0.612 to 0.748). FlyEM is higher
    in every variant: no nuisance removal 0.636 against 0.597, nine flies 0.601 against 0.562, signed FC (O3) the same
    as the main values, a second registration with seed 11 0.592 against 0.554, left and right swapped 0.518 against
    0.508, and the two tdTomato in-plane shift series added to the nuisance regressors 0.611 against 0.571. Synapse SC
    gives 0.553 against 0.524. The paper's own output file for the FlyWire setting (Zenodo,
    results/auc/poltcomparhemiroi_fw0sr140-fcauc.mat) gives R(7) = 0.684 with the same SC, so the shortfall is in the
    FC computed here, most likely its missing motion and slice-timing correction (claims file M1; the raw series moves
    by about one voxel in plane) and the registration, not in the SC.
  deviations:
  - >-
    Registration (claims file O2). The paper gives no SPM12 or ANTs settings. No SPM12 motion or slice-timing
    correction was applied (claims file M1 requires it), so the data are uncorrected. The raw series moves: a rigid
    in-plane shift estimated per volume from the tdTomato channel has a median of 0.6 to 3.2 um and a 95th percentile
    of 2.8 to 6.1 um per fly, against an in-plane voxel of about 2.6 um (motion cell). Regressing the two shift series
    out moves the fig3d values by 0.005; that check does not stand in for a realignment and was not applied to the
    other claims. The mean of three blocks of 152 green volumes was registered to the resized FDA template with antspy
    (affine start, the better of mean squares and Mattes mutual information, then SyN with defaults), and the ROI
    means were computed through the registration's linear interpolation map, which equals warping each volume and
    averaging (extractROItimeseries.m). The registration is seeded through ants.config (antspy 0.6.3 ignores the
    random_seed argument that the earlier runs passed, so they were unseeded) with ITK on one thread, and it now
    repeats exactly; two runs of the notebook gave identical output. It is unstable across seeds: a registration with
    seed 11 moved native voxels by a median of 2.5 to 44 um per fly, and its ROI series correlate with the first at a
    median of 0.18 to 0.98 (data check). The notes give the results under it.
  - tCompCor (claims file M3). The 1000 highest-SD voxels are taken among native voxels inside the template's field of view,
    not among template voxels after warping, an assumption made to avoid warping every volume. Their SD is taken on the mean-centred
    series before detrending, as lib/getNuisancetCompCor.m does (the claims file's M3 says after detrending; the code it cites
    is followed).
  - >-
    Native voxel size from each fly's NWB grid_spacing (2.55 to 2.61 by 2.61 to 2.68 by 5 um); the earlier runs used
    fly-087's spacing for every fly. The paper's NWB-to-NIfTI script is not published, so the voxel size its NIfTI
    headers carried is not known.
  - Subjects. The code's subject list [1 2 3 4 5 6 8 9] is applied to the flies in name order, which the notebook confirms
    by reproducing the code's per-volume speed and walking regressor (data/behavior.mat) fly by fly to 1e-5; the seventh fly
    is fly-100. Nine flies are shown as a variant.
  - >-
    Left-right orientation. The files do not state it, and a symmetric brain cannot fix it. No flip is assumed. With
    left and right swapped the matrix-level FC-SC correlations are lower (FlyEM 0.518 against 0.606), and the paper's
    own per-region FlyWire FC-SC values correlate with this attempt's at r = 0.661 as registered and 0.407 swapped,
    which supports the choice. The GLM points the other way, more weakly: this attempt's walking t map correlates with
    the paper's deposited map at r = 0.359 as registered and 0.394 mirrored, and per neuropil at 0.41 as registered
    and 0.463 with left and right ROIs swapped. No flip is kept, as the stronger evidence and the one computed on the
    quantity the FC claims use. The swapped result is shown for every claim.
  - The FlyEM SC is the 114-ROI cf0.8 connect list of the code repository indexed by the 63 primary ROIs of the FlyWire file;
    the paper's hemiroi_hb0sr80 file is not published but is computed by the same function over all 114 ROIs (makeStructConnectivity.m).
