findings:
- kind: data_missing
  statement: The ROI atlases of the paper's main FC-SC analyses (SCKm and DistKm, 20 to 20,000 ROIs) are not published. The
    code repository and both versions of the Zenodo record hold their SC connect lists but not the voxel-to-ROI assignment,
    so nine claims (Figures 1 and 2) cannot be tested on the dandiset. The FlyEM SC at confidence thresholds other than 0.8,
    the FlyEM permutation SC matrices and the FlyEM synapses in the template are not published either.
- kind: methods_unavailable
  statement: Question for the paper's authors. The paper does not give the SPM12 realignment and slice-timing settings, the
    ANTs registration settings, or the voxel size written into the NIfTI files by its NWB-to-NIfTI script, which is not published.
    This attempt registered the mean green image with antspy SyN without motion or slice-timing correction and obtains a FlyWire
    FC-SC correlation of 0.581 on the 63 primary ROIs where the paper's own output file gives 0.684, and finds no negative
    GLM cluster where the paper's deposited map has two. Which settings were used?
- kind: metadata_insufficient
  statement: The NWB files do not state the orientation of the functional volumes relative to the brain (which end of each
    axis is left, dorsal or anterior). Dorsoventral and anteroposterior can be read from the images against the template;
    left and right cannot, and one claim's outcome (fig3e) changes with it.
- kind: metadata_error
  statement: TwoPhotonSeriesFunctionalGreen and Red store data as (time, 256, 128, 49) while their `dimension` attribute is
    [128, 256, 49]. The processed FDA-space series has an imaging plane with grid_spacing [1, 1, 1] in unit 'unknown', so
    its voxel size is not given.
- kind: other
  statement: The dandiset's FicTrac speed, in the files' name order, reproduces the per-volume speed and the walking regressor
    stored in the paper's code (data/behavior.mat) to within 1e-5 for all nine flies, with the code's 104.654892 ms offset,
    which confirms the subject order and the alignment of behaviour to imaging. The seventh fly in that order (fly-100), the
    one the code leaves out, has the lowest coverage of any fly after registration (in the run of 2026-11-16, 8 hemibrain
    ROIs partly outside the field of view, AL(L) 59% inside; the coverage moves between runs with the registration), consistent
    with the paper's stated reason.
- kind: other
  statement: The paper's deposited second-level GLM (Zenodo 15532272, s80poltcomparfly-all-Tukey8full.mat) reproduces the
    code README's printed result exactly (maximum t 14.71, one positive cluster of 416,801 voxels, negative clusters of 406
    and 260 voxels with peaks -6.14 and -5.65 at the README's voxels), so the paper's GLM output can be checked against its
    deposit.
