    and the vesamicol pair of sub-6; SPARC:75 holds six confocal LSM images.
- claim: fig2e-page-bands
  outcome: reproduced
  notebook: reproduce_xia_2021.ipynb
  output: claim:fig2e-page-bands
  notes: Ethidium image, lane 3 (main peak) has two bands (rows 511 and 593) between the well and the scaffold band
    of lane 1 (row 878). In the registered pHAb and AF647 images lane 3 has pHAb bands at rows 783 and 861, above
