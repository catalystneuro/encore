- claim: fig7-rostral-caudal
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_xia_2021.ipynb
  output: claim:fig7-rostral-caudal
  measured:
  - 16.5
  - 18.7
  - 20.35
  - 23.1
  - 30.8
  - 35.75
  notes: 'sub-3, the 8 V recording of Figure 7, with block onsets in place of AQuA. The signal starts rostrally
    and spreads caudally and then laterally: in all 18 variants the median onset of the rostral third precedes those
    of the middle and caudal thirds, which precede the lateral region (frames 30, 34, 37 and 42 in the main variant),
    and block onset rises with the rostro-caudal position (Spearman rho 0.62 to 0.68, p 0.00011 or less). The times
    do not match. On the paper''s clock the region onsets are 15.95 to 16.50, 17.60 to 19.25, 19.80 to 20.90 and
    22.00 to 23.65 s, against 13.20, 13.75, 15.40 and 15.95 s; the rostral peak is 30.25 to 34.10 s against 22.0
    s and the caudal peak 35.75 to 36.30 s against 44.55 s; none of the six times is within tolerance in any of
    the 36 variant and clock pairs. The direction rests on the orientation of the frame, which the files do not
    record: with the frame flipped top to bottom, flipped left to right or turned 180 degrees, the order holds in
    0 of 18 variants (flipped left to right the rostral region still starts first in all 18, but the lateral region
    is no longer last). Part of the delay may come from the drop of both channels right after stimulation, which
    a threshold has to clear. Partially reproduced, as the criterion says when the order holds but the times do
    not, on the frame as deposited. Measured are the main variant''s region 1 to 4 onsets, rostral peak and caudal
    peak (16 px blocks, 3 SD, fit a, 0.55 s clock).'
  deviations:
  - 'AQuA (Wang et al. 2019, the paper''s ref. 32; Methods, AQuA Analysis) is MATLAB software that cannot be installed
    in the entry''s locked Python environment, and its parameters are not given. Assumed in its place: the onset
    and peak of 16 x 16 pixel blocks of the pHAb tissue mask (`block_onsets`; onset the first frame from frame 19
    that begins 3 frames above the pre-onset mean + 3 SD of the photobleaching-corrected dF/F, peak the largest
    3-frame mean), with 32 pixel blocks, 2 and 5 SD and three photobleaching fits as variants. Block onsets measure
    where and when the signal rises, as AQuA''s events do, but AQuA''s events and times may differ.'
  - The paper's four AQuA areas cannot be located from its text. Regions drawn here from the axis of Figure 7B (rostral
    up, caudal down, lateral to the left, as the criterion says; the files carry no orientation, and the frame is
    taken as shown in Fig. 7A) are the rostral, middle and caudal thirds of the tissue's extent along the rows and,
