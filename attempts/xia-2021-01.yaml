- claim: fig5b-in-vivo-response
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_xia_2021.ipynb
  output: claim:fig5b-in-vivo-response
  measured:
  - 21.91
  - 1.794
  notes: Two 3 V, 100-pulse recordings of the ACh nanosensor are deposited, sub-2 and sub-6 after washout; which
    recordings form the three mice of Figure 5B is not stated. Under 144 readings (frame interval, three bleaching
    fits, baseline, four ROIs including the tissue less the camera's dark level, recording or their mean) the dF/F
    15 s after onset is 17.1 to 40.1%, none within 3.33 to 4.07%; the rate to the peak is 1.54 to 3.33 %/s, and
    the rates over 2 to 5 frames from the frame where each trace leaves baseline (frames 25 to 29) -0.81 to 4.20
    %/s, none within 0.294 +- 0.116 %/s. Rates over 2 to 5 frames from frame 19 fall within it in 54 readings, but
    they cover baseline frames before the response and are not counted. Cell-sized 40 x 40 pixel blocks give 11.3
    to 53.6% (sub-2) and 0.3 to 28.4% (sub-6); one of the 13 sub-6 blocks is within tolerance in both. At 120 s
    sub-2 is still 9.4 to 16.4% above baseline. Subtracting the dark level raises dF/F slightly (mean of both, tissue,
    20.8 to 23.2% without and 21.9 to 24.4% with). Measured values are the mean of the two recordings under the
    first reading (0.50 s, bleaching fit outside the response, mean baseline, tissue ROI).
  deviations:
  - Assumed that the deposited 3 V recordings stand for the three mice of Figure 5B; the deposit does not identify
    them, and sub-2 is the 3 V recording of the AQuA mouse.
  - The ROI is a hand-drawn ganglion cell in the paper (Fig. 5B legend) with no coordinates; tissue, whole frame,
    tissue without saturating pixels, tissue less the camera's dark level and 40 x 40 pixel blocks were run.
  - Stimulation onset taken as 10.45 s, frame 19 on the paper's 0.55 s clock, from Fig. 6A ("Sti starts 10.45 s")
    and Fig. 7A ("Stim starts 10.45 s"); the files do not record it. The responses start 4 to 13 frames after it
    in sub-2, sub-3 and sub-6.
  - Frame interval run at 0.55 s (Results, Ex vivo calibration, "0.55 s, the minimum sampling time") and at 0.50
    s, the interval the per-frame timestamps of sub-2 and sub-3 record.
  - Photobleaching correction by a monoexponential curve, each value divided by the curve (Methods, Animal Preparation
    and Imaging); the frames it is fit to are open, and the frames before onset with those from 120 s or from 180
    s after it, and the whole trace, were run.
  - Initial rate over k frames counted from the last frame before the trace leaves baseline (|z| > 5), as the responses
    start 6 to 10 frames after the assumed stimulation onset; the rates from frame 19 are shown and not counted.
  - Channel taken as pHAb is the right half in sub-2 (the half that rises), the single channel in sub-6.
