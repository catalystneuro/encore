- claim: figs5-btx-staining
  outcome: reproduced
  notebook: reproduce_xia_2021.ipynb
  output: claim:figs5-btx-staining
  notes: Judged by eye on the maximum projections and brightest planes of the two BTX stacks of SPARC:75 (GFP and
    AF647 by the dye names in the LSM metadata). AF647 puncta cover every tile over the GFP mask in all four images
    (13/13 to 38/38), at 18 to 64 puncta per 100 um^2, and lie along the borders of the somata. Nearness to GFP
    beyond chance holds in the low-magnification projection (0.77 of puncta within 1 um of the background-rule GFP
    mask against 0.51 of the field; 0.53 against 0.37 with Otsu) and not in the high-magnification projection (0.30
    against 0.38). The high-magnification stack holds data in 12 of its 62 planes.
  deviations:
  - Puncta defined as components above the mean plus 3 SD of the below-median pixels, 0.1 to 25 um^2, and the GFP
    mask by Otsu's threshold or the same background rule; the paper gives no quantification and these support, not
    replace, the judgement by eye the criterion asks for.
- claim: fig3d-sensor-on-soma
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_xia_2021.ipynb
  output: claim:fig3d-sensor-on-soma
  notes: SPARC:108 sub-5 (CZI; AF647, pHAb as AF532, EGFP; 27 planes, 17.41 um, as the Methods state) and the three
    nanosensor images of SPARC:75. By eye, puncta appear in both channels with yellow spots where they coincide,
    but much AF647 lines cell borders and the ganglion capsule, and most pHAb puncta lie inside somata without AF647.
    Reading (b) fails in every image, as the share of AF647 puncta that overlap pHAb and lie in the soma mask is
    0.16 to 0.38 (0.20 to 0.47 with a top-hat pHAb and a 1 um margin). The overlap itself, 84 to 98%, is at the
    level of chance, 78 to 98% when the pHAb mask is shifted by 5 um, because the threshold marks 32 to 48% of the
    field; 17 to 42% of AF647 puncta lie in an Otsu soma mask covering 23 to 42% of the field. In sub-5 the pHAb
    channel correlates with GFP (r 0.43 and 0.53), a sign of GFP bleed-through at 514 nm. Partially reproduced,
    as puncta and coinciding spots are there but the overlap and the soma localisation are not shown beyond chance.
  deviations:
  - Assumed that the by-eye reading (a) is judged together with chance references, a 5 um shift of the pHAb mask
    and the share of the field covered by the soma mask, as the paper gives no colocalisation measure; the shift,
    the punctum size limits (0.1 to 25 um^2) and the soma masks (Otsu, background rule, 1 um margin) are choices
    made here.
  - SPARC:75's nanosensor images are single planes and are used with the sub-5 stack.
