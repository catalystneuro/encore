- claim: fig2d-hplc-yield
  outcome: partially_reproduced
  notebook: reproduce_xia_2021.ipynb
  output: claim:fig2d-hplc-yield
  measured: 79.1
  notes: The pHAb chromatogram (HPLC_PHAB.csv) has two detectable peaks, at 15.16 and 18.05 min. The share of the
    first peak depends on the reading. With a flat baseline (reading a) it is 65.8 to 68.2% under every end of the
    second peak, below the tolerance of 69.3 to 84.7%, and with a common line under both peaks and a drop at the
    valley 66.2 to 69.1%. With a line under each peak (reading b, as the criterion writes it) it is 77.5 to 83.1%,
    within tolerance, when the second peak ends where its own descent ends (20.53 min) or where it falls below 2%
    of its height (20.94 min); when it ends where the signal returns to the pre-injection level (29.76 min) the
    second area is negative and no share can be read. 4 of 18 readings are within tolerance. The valley between
    the peaks is 5.19 high (main peak 13.62), so the line under each peak cuts through both peaks; it keeps 54%
    of the main peak's area above the flat baseline and 30% (end ii) or 23% (end iii) of the second peak's. Every
    reading that splits the overlap the usual way (flat baseline, or a common line with a drop at the valley) gives
    65.8 to 69.1%, just below tolerance, so the share holds by the letter of reading (b) only. The retention volumes
    are not tested, as the paper gives no flow rate; the ratio of the retention times, 1.191, is 1.8% below the
    paper's 1.213 to 1.227. Partially reproduced, as the share holds under one reading of the criterion and the
    volume part cannot be tested. Measured is the share under reading (b), the second peak ending at the end of
    its descent, 1% detection rule.
  deviations:
  - The paper gives no flow rate (Methods name the Superdex 200 increase 10/300 GL column and the Agilent Infinity
    1260 HPLC only), and the files give time, so the main and second peak volumes are not tested. The first version
    assumed 0.5 mL/min, chosen because it put the peaks at the paper's volumes, which made that test circular.
  - '"Detectable" peaks taken as those with a prominence of at least 1% of the largest (0.5% as a variant), a choice
    made here.'
  - Assumed that the second peak ends where its own descent ends (slope below 1% of the steepest, 20.53 min), the
    usual limit of a peak; ends where it falls below 2% of its height and where the signal returns to the pre-injection
    level + 3 SD (29.76 min, the first version) are shown. The share under reading (b) depends on it.
  assumed: true
