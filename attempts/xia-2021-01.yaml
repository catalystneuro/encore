- claim: fig4b-michaelis-menten
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_xia_2021.ipynb
  output: claim:fig4b-michaelis-menten
  measured:
  - 0.2618
  - 8.65
  - 0.373
  - 1.92
  notes: One mouse (sub-1) of the paper's three, 8 concentrations from 0.000714 to 714 uM. Over 80 readings (ROI
    tissue or whole frame, 0.55 or 0.50 s frames, two photobleaching fits, two baselines, five rate windows) Km
    is 0.031 to 0.73 uM and Vmax 8.3 to 49.7 %/s, none within tolerance (49.24 +- 5.84 uM, 281.00 +- 7.14 %/s);
    R2 0.01 to 0.73. The first reading gives rates of 0.3 to 16.3 %/s with no steady rise in concentration (Spearman
    rho 0.54, p 0.168), with one-frame steps of 23.1% at 0.000714 uM, 19.8% at 0.714 uM, 41.9% at 7.14 uM and 38.4%
    at 714 uM, none at 0.00714 and 0.0714 uM. Upper limit of detection of that fit 1.92 uM (88% of Vmax) or 0.96
    uM (tangent within 5%); the paper's constants give 361.1 and 181.3 uM by the same rules. Measured values are
    the first reading's Km, Vmax, R2 and reading (a) of the upper limit.
  deviations:
  - One of three mice and 8 of the paper's concentrations (to 714 uM, not 7.14 mM) are deposited; means over mice
    and all points are the same here.
  - Assumed that ACh was added just before the largest one-frame rise of each recording, as the addition time is
    not recorded; at 0.00714 and 0.0714 uM there is no clear step, so this onset is noise there.
  - The ROI is not given; the stained tissue (Otsu mask of the first frame) and the whole frame were run.
  - Frame interval run at 0.55 s (Results, Ex vivo calibration, "0.55 s, the minimum sampling time") and at 0.50
    s, the interval the per-frame timestamps of sub-2 and sub-3 record.
  - Photobleaching correction by a monoexponential curve, each value divided by the curve (Methods, Animal Preparation
    and Imaging); the frames it is fit to are open, and both readings of the claims file (frames outside the response,
    whole trace) were run.
  - Rate reading (a) fits from the last frame before the response to the peak, so that a rise within one frame is
    included; reading (b) over the first 2 to 5 frames.
