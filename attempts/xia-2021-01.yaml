- claim: fig2d-hplc-yield
  outcome: not_reproduced
  notebook: reproduce_xia_2021.ipynb
  output: claim:fig2d-hplc-yield
  measured:
  - 66.6
  - 7.58
  notes: The pHAb chromatogram (HPLC_PHAB.csv) has two detectable peaks, at 15.16 and 18.05 min. With a flat baseline
    at the pre-injection level and the limit at the minimum between the peaks (reading a), the first peak is 66.6%
    of the area, below the tolerance of 69.3 to 84.7% (65.8% when a small peak at 37.27 min is also counted). Reading
    (b), a linear baseline under each peak, gives a negative area for the overlapping second peak and no usable
    share. At 0.5 mL/min the peaks are at 7.58 and 9.03 mL, within tolerance; the ratio of the retention times,
    1.191, does not depend on the flow and is close to the paper's 1.213 to 1.227. The share fails under every reading,
    so the outcome does not rest on the flow rate.
  deviations:
  - The HPLC files give time in minutes; the paper reports volumes and no flow rate. 0.5 mL/min is assumed to convert
    them (0.75 mL/min shown); it affects only the retention volumes.
  - '"Detectable" peaks taken as those with a prominence of at least 1% of the largest (0.5% as a variant), and
    the outer peak limits where the signal returns to the pre-injection level plus 3 SD; neither is in the paper.'
- claim: fig2g-conjugation-ratios
  outcome: blocked
  blocked_by: data_missing
  notes: The criterion needs the absorbance spectra of pure DNA scaffold, AChE and BTX to estimate the extinction
