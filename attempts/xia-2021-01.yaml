findings:
- kind: data_missing
  datasets:
  - sparc-108
  statement: SPARC:108 holds only part of the data the paper reports. Deposited are one of three ex vivo calibration
    mice (8 concentrations, none above 714 uM), one of four vesamicol experiments, the 3 V and 8 V recordings of
    the AQuA mouse, one 10 V recording, the nanosensor HPLC, UV-Vis and gel files and one confocal stack. Not deposited
    are every control nanosensor recording (Fig. 4C, 5B, S8, S10), the pH calibrations (Fig. 4C, S7A), the 5 V,
    pulse-number and repeated stimulations (Fig. 5C to E), the AF647 concentration calibration (Fig. S6B), the AFM
    images (Fig. S3), the spectra of pure AChE and BTX (Fig. 2G), the retention, stability, fiber and two-photon
    images (Fig. 3B-C, S4, S7B, S13) and two of the three 3 V AQuA mice (Fig. S12). Fifteen of the 29 claims are
    blocked for missing data and one for missing metadata.
- kind: metadata_insufficient
  datasets:
  - sparc-108
  statement: The imaging recordings lack what is needed to analyse them. No file says which half of the W-VIEW GEMINI
    frame is pHAb and which AF647; no file gives a spatial scale (the camera calibration is in pixels); the stimulation
    onset and the time of ACh addition are not recorded; and the files resaved in ImageJ (sub-1, sub-4, sub-6) keep
    only the first frame's timestamp, so their frame interval is unknown. The paper gives the onset only as 10.45
    s in two figures, and sub-4 does not follow it (its response starts near frame 55 or later).
- kind: metadata_error
  datasets:
  - sparc-108
  statement: The primary manifest.xlsx of SPARC:108 describes its files under names that are not in the dataset
    (40 of 50 differ, for example sub-1/0.000714_uM.tif for sub-1/sub-1_0.000714 uM); seven of the eight calibration
    files lack the .tif extension; and the sheet describes the sub-1 calibration recordings, made with added ACh,
    as "ACh release by electrical stimulation".
- kind: metadata_error
  datasets:
  - sparc-108
  statement: subjects.xlsx lists sub-2 (3 V) and sub-3 (8 V) as two mice, but their recordings were made 14 minutes
    apart on one day and show the same field (mean images r = 0.93 with no shift, against 0.06 to 0.47 between other
    recordings), as the paper's one mouse stimulated at 3 and 8 V (Methods, AQuA Analysis).
- kind: other
  about: data
  datasets:
  - sparc-108
  statement: The per-frame timestamps of the in vivo recordings that keep them (sub-2, sub-3) give an interval of
    0.50 s, while the paper states 0.55 s as its sampling interval and its Figure 7 times are multiples of 0.55
    s. Rates in %/s differ by 10% between the two.
- kind: other
  about: data
  datasets:
  - sparc-108
  statement: Many pixels saturate at 65535 in the sub-6 vesamicol recordings (19.6% of tissue pixels at some frame
    with the drug, 69.0% after washout) and in the pHAb half of sub-2 and sub-3 (11.5% and 16.4%), which clips the
    responses the paper's Figure 6 ratio is computed from.
- kind: other
  about: data
  datasets:
  - sparc-75
  statement: In SPARC:75 the high-magnification BTX z-stack is described by its metadata as 62 planes of 0.1 um,
    but 50 of the 62 planes are all zero; the stack holds about 1.2 um of tissue.
- kind: metadata_insufficient
  datasets:
  - sparc-108
  - sparc-75
  statement: Neither dataset names the PNAS paper. SPARC:108's dataset_description gives the bioRxiv preprint (10.1101/2020.07.06.189696)
    as its originating article, and SPARC:75 gives none, so its link to the paper (Figure S5 and the nanosensor
    staining) rests on its content.
- kind: paper_inconsistency
  statement: Figure S2C calls itself the same gel as Figure 2E but labels lane 1 as unpurified ACh nanosensor, where
    Figure 2E has the DNA scaffold. In the deposited gel, lane 1 has a single pHAb band and no AF647 band, as a
    scaffold without BTX would, so Figure S2C's label looks wrong.
- kind: methods_unavailable
  statement: Questions for the authors. (1) Over which frames is the initial rate (Vsensor) taken, from which onset,
    and against which baseline; and when was ACh added in each calibration recording and the stimulation started
    in each in vivo recording? Assumed here, onset at the largest one-frame rise (ex vivo) and at 10.45 s (in vivo,
    from Fig. 6A and 7A), with every rate window the claims file names. (2) Which ROI was used in Figures 5B and
    6B, and which deposited recordings are the three mice of Figure 5B? Here the tissue, the whole frame and cell-sized
    blocks were run, giving 17 to 37% against 3.7%. (3) Which frame interval applies, the 0.55 s of the paper or
    the 0.50 s the files record? (4) Which flow rate was used for the HPLC (0.5 mL/min assumed), and how were the
    peaks of Figure 2D integrated, given that the main peak and the second peak overlap? (5) Which frames was the
    photobleaching curve fit to? (6) Which AQuA version and parameters were used for Figure 7 and Figures S9 to
    S12?
