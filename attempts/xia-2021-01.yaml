- claim: figs5-btx-staining
  outcome: reproduced
  notebook: reproduce_xia_2021.ipynb
  output: claim:figs5-btx-staining
  notes: Judged by eye on the maximum projections and brightest planes of the two BTX stacks of SPARC:75 (GFP and
    AF647 by the dye names in the LSM metadata). AF647 puncta cover every tile over the GFP mask in all four images
    (5/5 to 29/29 with the Otsu mask), at 4.4 to 15.8 puncta per 100 um^2 with the background rule used since round
    1 (17.8 to 64.4 with the first rule, which passed much of the noise), and lie along the borders of the somata.
    Nearness to GFP beyond chance holds in three of the four images by at least one mask (low-magnification projection
    0.82 of puncta within 1 um of the Otsu GFP mask against 0.37 of the field; its brightest plane 0.61 against
    0.24 with the background-rule mask; high-magnification projection 0.18 against 0.15), and not in the brightest
    high-magnification plane (0.10 against 0.11). The high-magnification stack holds data in 12 of its 62 planes.
  deviations:
  - Puncta defined as components above the median + 3 SD of the lower half of the pixels reflected about the median,
    0.1 to 25 um^2, and the GFP mask by Otsu's threshold or the same background rule; the first rule (mean + 3 SD
    of the below-median pixels) is shown as a variant. The paper gives no quantification, and these support, not
    replace, the judgement by eye the criterion asks for.
- claim: fig3d-sensor-on-soma
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_xia_2021.ipynb
  output: claim:fig3d-sensor-on-soma
  notes: SPARC:108 sub-5 (CZI; AF647, pHAb as AF532, EGFP; 27 planes, 17.41 um, as the Methods state) and the three
    nanosensor images of SPARC:75. By eye (merges and a full-resolution crop with each channel alone), puncta appear
    in both channels with yellow spots where they coincide, but much AF647 lines cell borders and the ganglion capsule,
    and the coinciding spots lie mostly between or at the edges of the somata. With the background rule used since
    round 1, which marks 7 to 12% of the field as pHAb in four of five images (35% in sub-5 plane 13), 59 to 85%
    of AF647 puncta overlap pHAb in those four, against 39 to 53% with the pHAb mask shifted by 5 um (top-hat pHAb
    68 to 79% against 40 to 64%); in plane 13, 98% against 95%. The first rule marked 32 to 48% of the field and
    gave 84 to 98% against 78 to 98%. 9 to 47% of AF647 puncta lie in an Otsu soma mask covering 23 to 42% of the
    field, and 15 to 52% of the coinciding puncta lie within 1 um of it, against 27 to 48% of the field. Reading
    (b) fails in every image (0.09 to 0.35; 0.13 to 0.40 with a top-hat pHAb and a 1 um margin). In sub-5 the pHAb
    channel correlates with GFP (r 0.43 and 0.53), a sign of GFP bleed-through at 514 nm. Partially reproduced,
    as the puncta coincide beyond chance but their place on the somata is not shown.
  deviations:
  - Assumed that the by-eye reading (a) is judged together with chance references, a 5 um shift of the pHAb mask
    and the share of the field covered by the soma mask, as the paper gives no colocalisation measure; the shift,
    the punctum size limits (0.1 to 25 um^2) and the soma masks (Otsu, background rule, 1 um margin) are choices
    made here.
  - The background of the claims file's mean + 3 SD threshold is not defined in the paper. Since round 1 it is the
    lower half of the pixels reflected about the median (threshold median + 3 SD), the usual half-Gaussian estimate;
    the first rule, mean + 3 SD of the below-median pixels, sets the threshold about 1 SD above the centre of a
    Gaussian and marked a third or more of the field, and is shown as a variant.
  - SPARC:75's nanosensor images are single planes and are used with the sub-5 stack.
