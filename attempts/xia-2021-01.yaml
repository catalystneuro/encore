    and water, 2019-08-09_sensor.xml) and of the DNA scaffold (2019-08-09_dna_scaffold.xml) only; there are no spectra
    of AChE or BTX. The SPARC:108 version 1 manifest holds HPLC, UV-Vis and gel files, eight ex vivo calibration
