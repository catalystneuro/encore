findings:
- kind: metadata_error
  statement: Rat_3_Type_HCage_Session_2.mat is not a separate recording. 287 of its 291 segments are segments
    of Rat_3_Type_HCage_Session_1.mat with the same LFP and movement values, 100 s later on that file's
    clock (they cover 106 to 750 s of it). The data set presents it as a second home-cage session.
- kind: data_missing
  statement: The data set holds only the BF LFP of six rats in home cage and arena. The ACC and VC recordings,
    single units, object sessions, bipolar recordings, video and behaviour scoring of the paper are not
    in it, and the paper names no other deposit; 16 of the 28 claims need data that are not in it.
- kind: metadata_insufficient
  statement: The sessions carry no day and no time of recording, and each file has its own clock starting
    at 0, so the paper's day factor, the order of home-cage and arena sessions and the transfer between
    them cannot be reconstructed. Which electrodes were bipolar is not stated.
- kind: metadata_insufficient
  statement: The LFP has no stated unit (its range is consistent with microvolts), and the movement value
    is dimensionless; its scale in rats 4 and 5 is about a quarter of that in the other rats, which is
    not explained.
- kind: selection_undocumented
  statement: Artifact segments were removed without a stated rule. Removed segments make up 2.6% to 23.5%
    of each file's span, more than the 1-4% the SI reports for its rule, and the SI's rule applied to
    the delivered segments removes a further 16.8%.
- kind: metadata_error
  statement: The descriptor names the home-cage condition 'Hcage' while the files use 'HCage', and describes
    basal_forebrain_lfp.tar.gz as a file of .mat files without saying it is a gzipped tar.
- kind: other
  statement: In 13 of 24 files the movement value of a segment correlates best with the 100-200 Hz LFP
    power of the next segment, and in 10 with the same segment, so the movement stream may lead the LFP
    by up to one 2-s segment. Rat 2's home-cage session 1 has a line at 50 Hz, 26 times its neighbours,
    inside the gamma band.
- kind: methods_unavailable
  statement: Question for the paper's authors. What were the observations of the one-way ANOVAs over movement
    quartiles (Fig. 3B), per-hemisphere quartile means or epochs, and was gamma normalized per animal?
    On this data set per-rat means give p = 0.82 for the home-cage rise and p = 0.07 for the movement-matched
    comparison, while repeated-measures and paired tests give p < 0.01.
- kind: methods_unavailable
  statement: Question for the paper's authors. How was the 35% reduction of gamma power computed (spectral
    estimate, scaling, averaging)? A periodogram mean over 30-80 Hz gives 48% on this data set, under
    every epoch, artifact and averaging reading.
- kind: methods_unavailable
  statement: Question for the paper's authors. Are the data set's sessions 1 and 2 the first and second
    arena trials of one day (Fig. 3C)? Here session 2 has 15.9% lower gamma than session 1, where the
    paper reports 5.62% higher in the second session.
- kind: methods_unavailable
  statement: Question for the paper's authors. For the excursions of Figs. S4 and S5, what was the power
    scale (the threshold of 2.6), how were histogram bins set, and was there a minimum excursion length?
    Without one, the readings tried give 10 to 14 excursions per 20 min lasting 5 s on average, against
    8 lasting 8 to 44 s.
- kind: methods_unavailable
  statement: Question for the paper's authors. What was correlated with time in Fig. 3D (r = 0.72, n =
    22), binned group means, per-session correlations or epochs? The readings give r = 0.86 (1-min bins),
    0.13 (per recording) and 0.045 (pooled epochs).
