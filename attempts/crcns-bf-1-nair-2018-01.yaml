- claim: fig3a-bf-gamma-reduction
  outcome: partially_reproduced
  notebook: reproduce_nair_2018.ipynb
  output: claim:fig3a-bf-gamma-reduction
  measured: 48.0
  notes: Home-cage gamma (mean periodogram power, 30-80 Hz) exceeds arena gamma in 6 of 6 rats; the reduction
    is 48.0% under reading (a) and 48.0% under reading (b), paired t test t = 3.84, p = 0.012 over 6 rats
    (11 session pairs, 47.7%, p = 0.00047). Every epoch (2 s, 10 s), artifact and pairing reading gives
    46.8% to 48.1%, outside 35 +/- 3%, with p from 0.0002 to 0.014. Per rat the reduction is 37.3% to
    63.9%. Leaving out 49-51 Hz (a line at 50 Hz in one file) gives 44.7%; the amplitude spectrum, which
    the data descriptor's example uses and the paper does not, gives 24.0%. The paper's p < 1e-5 rests
    on 22 hemispheres and is not reached with six rats (reported, not required by the criterion).
  deviations:
  - The data set gives one BF signal per rat for six rats, so tests run over rats (n = 6), or session
    pairs as a variant, where the paper used 22 hemispheres (claims file header). The two sessions of
    a condition are averaged per rat (n = 6); rat 3's home-cage session 2 is left out as a second deposit
    of its session 1, so rat 3's home cage is session 1 alone.
  - The segments come already down-sampled to 400 Hz and cleaned by the depositors. The SI's peak-to-peak
    rule applied again (claims file header, reading b) drops 16.8% of segments, against the SI's 1-4%;
    both readings are run.
  - The paper does not say how the spectrum is scaled or windowed; a plain periodogram is used (claims
    file header, a standard choice that cannot change a ratio).
