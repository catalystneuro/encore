  output: claim:table3-autumn-ahy-prior-breeding-temperature
  measured: [-0.094, -0.012]
  notes: PrevTempBreedBase in the autumn AHY Stan model has an intercept effect of -0.094 (pd 99.59%) and a
    slope effect of -0.012 (pd 71.30%) under reading (a); -0.091 (99.39%) and -0.026 (76.51%) under (c)
    (autumn_ahy_main_c.ipynb); -0.099 (99.59%) and -0.009 (75.80%) under (d) (autumn_ahy_main_d.ipynb).
    All within tolerance, and each pd is at least 11.6 Monte Carlo errors from 90% under (a) and (c), and under (d) on chains 1 to 3. The fits do not
    converge well (1107, 1530 and 2683 of 8000 draws divergent; largest R-hat 1.083, 1.188 and 1.596).
    Under (d) chain 4 is stuck, every kept draw divergent, and the fit fails the R-hat check; chains 1
    to 3 pooled give -0.094 (pd 99.45%) and -0.010 (pd 67.73%), each chain 99.15% to 99.65% and 67.40%
    to 68.30%, the same call. The draws can depend on the CPU, since the model is compiled with -march=native as Script01 does; the run reviewed in round 1 gave other values with the same seed. The re-run of this revision, on an AMD EPYC 7763, gave the same draws as the run reviewed in round 2 (AMD EPYC 9V74).
