findings:
- kind: metadata_error
  statement: The README says some specimens in morphdata.csv were filtered out before analysis and that
    the filtering steps are in the code. The code applies no filter, and the deposited file gives every
    sample size of the paper exactly without one; the Methods' 5-MAD filter, applied to the file, would
    remove 0 to 70 more specimens depending on how it is read. The file appears to be the filtered data.
- kind: other
  statement: The paper's 27 366 specimens are the birds in the three main models; morphdata.csv holds
    27 486, the other 120 being in species-years without climate data. Neither the README nor the paper
    says so.
- kind: identifier_missing
  statement: morphdata.csv has no catalogue number or other specimen identifier, so its measurements
    cannot be linked to catnodata.csv. catnodata.csv has 26 436 rows, 1050 fewer than morphdata.csv,
    5061 rows without a catalogue number and 945 repeated catalogue numbers; for 44 catalogue numbers the
    repeated rows differ in species, sex, age, year or season.
- kind: other
  statement: ed_FHY.csv and ed_AHYfall.csv are identical files, and ed_AHYspring.csv is the same table
    shifted by one year; this fits the README's description of their use, but the README does not say
    so.
- kind: methods_unavailable
  statement: The code selects climate columns by number from R's merged table and drops species-years by
    hand-coded row numbers; the notebook shows these match the deposited files. The Table S8 code reads an
    object (envdata3) that no script defines.
- kind: other
  statement: The hierarchical Stan model as published converges poorly on the autumn AHY data with the
    code's seed and settings (13.8% to 33.5% of draws divergent, largest R-hat 1.083 to 1.596; under one
    filtering reading a chain is stuck with every draw divergent). The Methods say convergence was
    confirmed with R-hat and trace plots, but no diagnostic values are reported. Script01 compiles the
    model with -march=native, so with the same seed the draws differ between machines, and pd values
    near 90% can fall on either side.
