  output: claim:group-sizes
  measured: [13, 8, 7, 9, 10, 6]
  notes: The MAT file and the TIFF archive agree on 13, 8 and 7 WT and 9, 10 and 6 KO mice at P9-11,
    P14-16 and P30-40 (28 WT and 25 KO), against 12, 9, 8 and 9, 10, 8 in Fig. 1e (29 and 27). Two of
    six groups match (KO P9-11 and KO P14-16). The P14-16 counts (8 WT, 10 KO) match neither the Fig. 1e
