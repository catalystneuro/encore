findings:
- kind: selection_undocumented
  statement: The data set holds 13, 8 and 7 WT mice and 9, 10 and 6 Fmr1 -/- mice at P9-11, P14-16 and
    P30-40 (53), while the paper analysed 12, 9 and 8 and 9, 10 and 8 (56). Neither the descriptor nor
    the files say which mice differ from the paper's sample or why.
- kind: metadata_error
  statement: The descriptor gives 40 to 149 neurons per animal; two WT P9-11 recordings have 164 and 198.
    It gives about 7 to 8 min per recording; at the stated 3.9 Hz the recordings last 3.8 to 15.4 min,
    and 27 of 53 are 2160 frames (9.2 min).
- kind: metadata_insufficient
  statement: The descriptor gives no unit for the estimated firing rates; their means fit Hz, and the
    values, which are continuous, do not show the unit. It does
    not say that the k-th matrix of each group belongs to Movie_k.tif, which the frame counts and the
    correlation of the population rate with each movie's brightness show.
- kind: other
  statement: The movie folders are named "4Hz" where the paper and the descriptor give 3.9 Hz, and most
    recordings are 2160 frames, three 3-min movies at 4 Hz. Frames are 128 x 256 pixels in 50 movies
    (and 357, 404 and 512 wide in one each), where the Methods give 512 x 128. The TIFFs carry no time
    stamps, so the frame rate cannot be checked.
- kind: data_missing
  statement: No cell contours or dF/F traces are deposited, so the paper's correlations cannot be
    computed from the filtered dF/F if that is what the paper used; only the estimated firing rates
    are given. The whole-cell recordings, the EEG, the isoflurane imaging and the 15.6 Hz imaging are
    not deposited, and 17 of the paper's 28 claims cannot be tested.
- kind: format_error
  statement: The TIFF archive holds five macOS resource-fork files (._.DS_Store and ._Movie_1.tif) beside
    the 53 movies.
- kind: methods_unavailable
  statement: Question for the authors. Which trace and which measure give the pairwise correlation of
    Fig. 1 (the Methods refer to ref. 15 for "continuous-trace cross-correlations")? Was it the
    deconvolved trace deposited here or the filtered dF/F, was the mean subtracted, and at which lag?
    The zero-lag normalised cross-correlation of the deposited rates gives the paper's P14-16 values
    (WT 0.169, KO 0.204) but pooled means that differ from the paper's.
- kind: methods_unavailable
  statement: Question for the authors. For peaks of synchrony, when is a cell active in a frame, how was
    each trace shuffled, and how is the proportion of neurons participating in an event formed? With
    an active cell as any non-zero rate the frequencies match the paper's, but no reading gives
    proportions within the paper's s.e.m. (0.300 and 0.380). Q-a with R-b and the rates in Hz gives
    proportions below them (0.13 to 0.17), and every other reading gives proportions above them.
- kind: methods_unavailable
  statement: Question for the authors. How was the pooled average correlation (0.230 and 0.265) formed,
    and how was the unequal-variance 2 x 3 ANOVA fitted? The paper's s.e.m. fit an average of the
    three age means, not the mean over mice.
