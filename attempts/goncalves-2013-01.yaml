    deposited twice (no identical movie or cell trace).
- claim: fig1d-distance-dependent-decorrelation
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_goncalves_2013.ipynb
  output: claim:fig1d-distance-dependent-decorrelation
  measured: [0.191, 0.105, 0.025]
  notes: WT mice, 13 at P9-11 and 8 at P14-16. Under the main reading (C-b, zero-lag normalised
    cross-correlation of the estimated rates) the P9-11 minus P14-16 difference is 0.191 under 100 um,
    0.105 at 100 to 200 um and 0.025 over 200 um, against 0.223, 0.159 and 0.067. The Bonferroni
    corrected p are 6.6e-08, 0.0019 and 1.0 under A-a and 2.4e-05, 0.0066 and 1.0 under A-b, so the
    significance pattern holds, and the difference falls with distance; none of the three
    differences is within the 10% tolerance. The Spearman variant gives 0.175, 0.108 and 0.051. Only
    4 of 8 P14-16 mice and 12 of 13 P9-11 mice have pairs over 200 um; on the mice with all three
    bins the differences are 0.188, 0.102 and 0.025, with within-bin Bonferroni p of 0.0012, 0.022
    and 1. The four P14-16 mice with pairs over 200 um have 28, 108, 72 and 1 such pairs, so the
    third bin rests partly on four mice.
  deviations:
  - The data set holds 13 and 8 WT mice at these ages, not 12 and 9.
  - The trace is the deposited estimated firing rate (reading T-a). Reading T-b, the low-pass filtered
    dF/F, cannot be run, as the data set holds no cell contours or dF/F traces; the outcome is
    assumed to hold for the trace the paper used. The Methods say only "pair-wise continuous-trace
    cross-correlations as previously described 15".
  - The post hoc test of A-a uses the two-way ANOVA's pooled residual mean square; that of A-b is a
    t-test within each bin, both with Bonferroni over three bins. The text does not give the form.
    The A-b post hoc uses every mouse with pairs in a bin, while the split-plot ANOVA uses the 16
    mice with all three bins; on those 16 mice the post hoc gives the same pattern.
- claim: fig1e-age-decrease
  outcome: reproduced
  notebook: reproduce_goncalves_2013.ipynb
  output: claim:fig1e-age-decrease
  notes: Pairs under 100 um, reading C-b. WT 0.360, 0.169 and 0.119 at the three ages (13, 8, 7 mice),
    KO 0.421, 0.204 and 0.134 (9, 10, 6 mice). The 2-df age contrast within genotype of the
    unequal-variance model gives F = 52.5 (df2 14.9, p = 1.8e-07) for WT and F = 64.3 (df2 14.1,
    p = 8.1e-08) for KO. Welch's one-way ANOVA gives the same numbers, as the Welch-James test reduces
    to it for a one-way design, so readings E-a and E-b agree. The Spearman variant agrees.
  deviations:
  - Group sizes differ from the paper's (see group-sizes).
- claim: genotype-pooled-ages
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_goncalves_2013.ipynb
  output: claim:genotype-pooled-ages
  measured: [0.245, 0.265]
  notes: The genotype main effect of the unequal-variance 2 x 3 model is significant with KO higher,
    p = 0.0064 (F = 8.48, df2 33.5) for pairs under 100 um and p = 0.0028 for all pairs (paper
    0.0057). No reading puts both means within the paper's s.e.m. Under 100 um over all mice (P-a,
    M-a, given as measured) WT 0.245 and KO 0.265, KO within and WT not; all pairs over mice (P-b,
    M-a) WT 0.223 and KO 0.251, WT within and KO not; mean of the age means (M-b) WT 0.216 and KO
    0.253 under 100 um, 0.198 and 0.240 for all pairs. The s.e.m. under M-b (0.0088 and 0.0093) is
    close to the paper's (0.008 and 0.009), while that over mice is 0.024 and 0.026, which points to
    M-b, the equal-weight average of the age means, as the paper's form; under M-b both means are
    about 0.013 below the paper's, outside tolerance, which supports the partial outcome.
  deviations:
