  - The trace is the estimated firing rate (T-a); T-b cannot be run (see
    fig1d-distance-dependent-decorrelation). The outcome is assumed to hold for the paper's trace.
  - The unequal-variance ANOVA is fitted on the six cell means with their variances of the mean,
    and the genotype contrast tested with the Welch-James statistic and Satterthwaite degrees of
    freedom; the claims file names this standard choice.
