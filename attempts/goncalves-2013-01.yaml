  output: claim:fig2c-participation
  measured: [0.444, 0.411]
  notes: No reading gives a significant genotype difference (p = 0.052 to 0.76 over twelve readings).
    Under R-a, S-a and Q-a
    (given as measured) KO 0.444 +/- 0.020 and WT 0.411 +/- 0.019, p = 0.25; both are above the paper's
    0.380 and 0.300. Under R-a nearly every cell joins at least one event (Q-b 0.998 to 1.0). Under R-b
    Q-a is 0.17 against 0.13 to 0.14 and Q-b 0.66 against 0.49 to 0.54, KO higher, p = 0.15 to 0.37.
    Under R-b with the rates per frame (rate >= 1) Q-a is KO 0.437 against WT 0.391 with S-a (p =
    0.052) and 0.429 against 0.385 with S-b (p = 0.053), KO higher and near significance, both
    outside tolerance; Q-b is 0.998 in both (p = 0.76). No mouse lacks events. As that p sits at 0.05
    and the threshold comes from 100 seeded shuffles, the reading was run with 20 further seeds per
    shuffle. With S-a p is 0.056 to 0.116 (median 0.069), below 0.05 in none of 20; with S-b p is
    0.044 to 0.116 (median 0.060), below 0.05 with KO higher in 3 of 20. With 1000 shuffles per
    threshold p is 0.056 (S-a) and 0.051 to 0.054 (S-b, three seeds). The typical draw and the limit
    of the Methods' procedure do not reach p < 0.05; the outcome is close to the boundary. In every
    draw both means are outside tolerance (KO 0.426 to 0.436, WT 0.383 to 0.397), so where the test
    holds the outcome would be partially reproduced.
  deviations:
