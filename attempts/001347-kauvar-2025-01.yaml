findings:
- kind: metadata_insufficient
  statement: >-
    The non-iEEG files (sub-h009, h011, h012, h013, ses-P50) call their two series pre_trials_data and
    post_trials_data and do not say which is the saline and which the ketamine visit; the visits were
    a blinded crossover, so the names are not a visit order either. Only the paper's code (analyze_airpuff_p50.py)
    reads pre as saline.
- kind: data_missing
  statement: >-
    The CADSS dissociation scores of both human cohorts (Figs. 1, 2D, figs. S1D, S14G, S27) and the non-iEEG
    participants' verbal reports (Fig. 1F, fig. S1F) are not in the dataset; the scores are in the paper's
    code record (data/cadss_across_pts.csv and constants in analyze_airpuff_p50.py).
- kind: metadata_insufficient
  statement: >-
    The iEEG behaviour and LFP files name sessions baseline, preinfusion, infusion, postinfusion, postinfusionfast
    and control without saying when each was recorded; the code's DATASETS.py says baseline is the day
    before infusion. For SD168, SD172, SD242 and SD245 the behaviour file holds a baseline session and
    no preinfusion session, and the paper treats that baseline as preinfusion.
- kind: metadata_insufficient
  statement: >-
    The 142 head-fixed mouse behaviour files (sub-mouse/sub-mouse_ses-<id>_behavior.nwb) carry no label
    of drug, dose, mouse, sex, day, puff pressure or skipped puff; subject_id equals the session id, sex
    is "O" and age "P8W/" in every file, and the trials have no timestamps. The labels exist only as experiment-id
    lists in the paper's scripts (Zenodo 14920570, mouse_eyepuff/scripts/fig1_*.py), so no analysis can
    be run from the dataset alone, sessions of the same mouse cannot be paired from the data, and the
    Methods' rule for post-infusion trials (at least 3 min after injection) cannot be applied.
- kind: data_missing
  statement: >-
    The Neuropixels-rig behaviour (eye closure) of 3 of the 13 recorded sessions of Fig. 4B (Table S3)
    is not in 001347: the 001326 sessions of 2023-02-25 (sub-3) and 2023-07-06 and 2023-08-22 (sub-5)
    have no sub-m* behaviour file; the paper's converter lists only the 10 deposited sessions (its commented
    "extra" list names m11210-961, m11217-1104, m11217-1107).
- kind: data_missing
  statement: >-
    The lick data of the liquid-reward eyepuff assay (fig. S4, 6 mice) are not in the dataset or in 001326,
    and the code record has no script for them.
- kind: paper_inconsistency
  statement: >-
    Table S3, fig. S2 C, gives saline affective eye closure on the first puff as 0.34 +/- 0.07, while
    the per-mouse values that reproduce its paired test exactly (t = 4.951) have mean 0.203 (s.e.m. 0.047).
- kind: code_mismatch
  statement: >-
    Table S3, fig. S2 E, reports the Kaplan-Meier persistence of 15.16 s for 20 preinfusion trials per
    mouse (100 trials); fig1_persistence.py uses all 40 trials of each saline session (200 trials, pre
    and post injection), which gives 15.16 s exactly; the 100 preinfusion trials give 13.05 s from the
    code's start frame. The code's start frame is also 3.3 s after the eighth puff while the figure axis
    reads time from the final puff.
- kind: code_mismatch
  statement: >-
    Table S3, fig. S6 F, calls the fast early (0-40 ms) comparison a paired t-test; fig1_muscimol.py runs
    independent t-tests (get_drug_comparison_pvals without do_paired), whose values (t = 0.37, p = 0.8898)
    are those reported.
- kind: methods_unavailable
  statement: >-
    Open I: the Methods count as post infusion only trials at least 3 min after the injection, the code
    uses trials 23 to 37, and the fig. S2B/S2C legends give 18 trials. The sub-mouse files hold no trial
    times. Which trials did the paper use, and how long after the injection did trial 21 start? (Here
    the code's trials are used, trials 23 to 40 as a variant; all conclusions agree.)
- kind: methods_unavailable
  statement: >-
    The Methods scale each mouse trial by 1/(1 - baseline), the baseline averaged over the first two trials;
    the code computes the baseline after subtracting each trial's own first 2 s, so the factor is one.
    Which was used for the absolute values of figs. S2B, S2C, S5D and S5E? (The code's reproduces Table
    S3's t values exactly; the Methods' changes fig. S2B's saline early value to 0.72.)
- kind: other
  statement: >-
    No recording is deposited twice among the 142 sub-mouse files (no identical file, first 20 trials
    or single 81-s trial; highest correlation between sessions 0.91, 1023 and 1026) or the 10 Neuropixels-rig
    files. Ids 282-286 are reused by the scripts for saline, female and the converter's sal_skip; ids
    1020-1027 for ketamine 35 mg/kg and 28 PSI.
- kind: data_missing
  statement: >-
    The per-participant LFP files are 20-min windows around each eyepuff session with no infusion start
    time, no epochs and no sleep or seizure annotations, so the 25-min pre-infusion baseline and peak-ketamine
    windows of fig. S15, fig. S27 and the phase-locking analysis are not in the dataset. No CADSS scores
    are in the behaviour files.
- kind: data_missing
  statement: >-
    Spontaneous blink onsets for fig. S12 are not in the dataset; they are a hand-made list in the code
    record (for_reference/analyze_airpuff_ieeg_natural_blinks.py lines 42 to 79).
- kind: methods_unavailable
  statement: >-
    For authors - how was the elbow of fig. S17A at six components chosen? The code hard-codes k_elbow
    = 3. On the dataset the test curve's largest fall in gain is at six components, but the point farthest
    from the chord over the plotted range (2 to 28 components) is at eight.
- kind: paper_inconsistency
  statement: >-
    Table S3 (Fig. 2I) gives 5 participants for factor 3 and 6 for factor 4, but the deposited loadings,
    which reproduce every coefficient and channel count of Table S3, have kept channels from all 7 participants
    for every factor (factor 3 - SD168 19, SD172 28, SD181 22, SD185 23, SD186 13, SD211 19, SD245 34).
- kind: other
  statement: >-
    The deposited Fig. 2H matrix (yeo_loading_mtx_pre) does not fully match the Results text - factors
    3 to 5 carry 0.495 of the limbic row and 0.463 of the frontoparietal row, while the text says these
    networks load heavily on factors 3 to 5.
- kind: other
  statement: >-
    The time bins of the per-network and per-region files (-0.531 to 1.444 s) are offset by 0.6 ms from
    the corresponding bins of the per-channel per-trial file (-0.532 to 1.443 s); immaterial for the analyses
    here.
- kind: metadata_insufficient
  statement: >-
    The iEEG files do not mark bad channels, although the paper removes them; the list exists only in
    the paper's code (ketman/analyze/utils.py, bad_ch, 10 to 33 contacts per participant). With and without
    it the CD results differ in the second decimal and decide two readings of fig6e.
- kind: metadata_insufficient
  statement: >-
    The electrode tables hold a region label per contact but no Yeo7 or Yeo17 network label, and x, y,
    z and impedance are NaN for every contact; the network labels used by figs. S19 to S25 and S35 are
    only in the code record (anat/pts_ch_labels.pkl).
- kind: metadata_error
  statement: >-
    The LFP ElectricalSeries (processing/ecephys/LFP/v_trace) declares unit 'volts' with conversion 1.0,
    but the values are digitiser units (1st to 99th percentiles of order 300 to 3000); the scale (0.390625
    or 0.09765625 microvolts per unit) is only in the series comment and the device description.
- kind: metadata_insufficient
  statement: >-
    The puff TTL is DC channel index 2, named 'CCEP' in four participants' files and 'DC03' in three (SD168,
    SD172, SD245); no description identifies it as the puff sync channel.
- kind: code_mismatch
  statement: >-
    For SD245 the code's coding-dimension path loads both the Baseline and Preinfusion files and renames
    'baseline' to 'preinfusion', so the Baseline file (day before) replaces the Preinfusion file, while
    the timescale path keeps the Preinfusion file. The behaviour file of SD245 holds only 'baseline' events.
    The paper's numbers for Fig. 6C and 6G are recovered only with this mixture (fig6g means with the
    Baseline file are outside tolerance).
- kind: paper_inconsistency
  statement: >-
    Table S3 gives two statistics for the same postinfusion against ketamine test of the beta fast projection,
    t = 0.576, p = 0.585 (Fig. 6E) and t = 1.063, p = 0.657 (fig. S37B beta); the data give t = 1.072,
    BH p = 0.650, matching the fig. S37B row.
- kind: methods_unavailable
  statement: >-
    Question for the authors, Open C. Is the human projection z-scored over -1.0 to 1.5 s with the -1.0
    to 0 s mean subtracted and summarised on a time axis shifted by 0.05 s (code), or over -0.5 to 1.5
    s with the -0.5 to 0 s baseline (Methods)? The code's reading reproduces Table S3 to the third decimal;
    the Methods' reading gives a preinfusion persistent mean of about 1.63 and makes the low-gamma fast
    test significant.
- kind: methods_unavailable
  statement: >-
    Question for the authors, fig. S38H. Were the single-trial persistent projections baseline-subtracted
    over 0.5 to 0 s before each puff? The code comments this out, but the paper's coefficient (12.12)
    is recovered only with it (12.38 here; about 2.5 to 6 without).
- kind: methods_unavailable
  statement: >-
    Question for the authors, Fig. 6I and fig. S38. Which channels, windows (stride, exclusion of epileptic
    and sleep periods) and sessions enter the phase-locking analysis, and how were the 716 edges of fig.
    S38 selected? Selections here give 368 to 896 edges, a ketamine ratio of 0.926 to 0.963 against 0.979,
    and baseline differences between high and low edges in theta and alpha.
- kind: methods_unavailable
  statement: >-
    Question for the authors, fig. S37A. Which mouse sessions, mouse projection (first puff or all puffs
    of a series) and time range enter the cross-species correlation? Beta and broadband differ by less
    than 0.03 in r, and the order changes with these choices.
- kind: format_error
  statement: >-
    In all 13 NWB files of DANDI:001326 (0.250528.1957) the spike times of every unit (9554 of 9554) are
    stored out of order; they must be sorted before use.
- kind: identifier_missing
  statement: >-
    DANDI:001326 numbers its subjects 0 to 9 and gives recording dates, with no link to the paper's mouse
    or experiment identifiers or to the Neuropixels-rig behaviour files of DANDI:001347 (sub-m<mouse>-<experiment>).
    Matching inter-series intervals links 10 of the 13 sessions to a behaviour file (all intervals equal
    within 0.02 s); sub-3 ses-20230225 and both sub-5 sessions have no behaviour file in DANDI:001347.
- kind: selection_undocumented
  statement: >-
    The Methods exclude one animal "that exhibited notable stress response" from the cross-puff and population
    analyses (11 sessions from 9 mice), but neither the paper, the code nor the dataset says which. Mouse
    5 is the only exclusion that also gives the tone analysis its 7 sessions from 7 mice; with it the
    Fig. 6D statistics come out as in Table S3. Which animal was excluded?
- kind: code_mismatch
  statement: >-
    The mouse code (Zenodo 14876694, analysis.py) differs from the Methods in several mouse analyses:
    coding-dimension weights are divided by a pooled scalar variance (compute_cd_cov), not per-neuron
    variances; the emotion-like dimension's target window is bins 400:500 of the post-series window, which
    the plotting offsets place 3 to 4 s after the last puff, not 5 s; the fast dimension's reference is
    the 70 ms before the puff, not the 1 s; coupling selects signed weights above the 90th percentile
    of |w| and takes the median |r| over concatenated windows; tone coupling uses windows before puff
    series. The pooled variance decides the mouse coupling result (Fig. 6J, fig. S34H) and the 3 to 4
    s window the Fig. 5E test.
- kind: paper_inconsistency
  statement: >-
    The Methods (Comparison of rates) define the Ketamine and Post epochs as trials 22 to 32 and 34 to
    40 (11 and 7 trials), while Table S3 gives 10 and 6 trials for Figs. 5D, 5E, 6D and 6F, as the code's
    slices (23 to 32, 35 to 40) do. The recovery test of Fig. 6D is significant with the code's trials
    (corrected p = 0.029) and not with the Methods' (0.17).
- kind: methods_unavailable
  statement: >-
    The mouse code record holds no driver script: the z-scoring that makes all_zfr, the session filter
    (filter_session), the shifted windows used for the timescale (shift_psth_pre/post), the start of the
    post-series window used for the emotion-like dimension, and the dose conditions and trace processing
    of the Fig. 5H and 5I fits are not given. Which window (3 to 4 s or 5 to 6 s after the last puff)
    and which variance (per neuron or pooled) did the published Figs. 5E and 6J use?
- kind: other
  statement: >-
    sub-5 ses-20230706 has 2 Neuropixels probes and 154 units, where the Methods state 3 to 4 probes per
    session; it belongs to the mouse taken as excluded.
- kind: methods_unavailable
  statement: >-
    Question for the authors, Fig. 4B and 5B. Were the across-session eye-closure traces of the Neuropixels
    mice divided by each condition's maximum, as make_puffseries_behavior_plot in analysis.py (Zenodo
    14876694) does? With that normalisation late eye closure separates between preinfusion and ketamine
    (0.630 against 0.322); without it the 95% intervals overlap (0.174 against 0.148).
- kind: methods_unavailable
  statement: >-
    Question for the authors, human coding dimension. Are white-matter contacts excluded from the coding
    dimension, as the code does (use_all_channels = False), while the Methods say so only for the phase-locking
    analysis? Both readings reproduce Fig. 6C, but with white matter kept the theta reduction and the
    delta recovery of fig. S37C lose significance and broadband becomes significant.
