- claim: fig2g-nmf-six-factors
  outcome: reproduced
  assumed: true
  notebook: 03_ieeg_spectral.ipynb
  output: claim:fig2g-nmf-six-factors
  measured:
  - 0.466
  notes: >-
    458 channels from 7 participants (SD168 86, SD172 97, SD181 58, SD185 43, SD186 47, SD211 44, SD245
    83) in the 21 regions. Refitting NMF (3 positive, 3 negative components) on the mean of the preinfusion
    and postinfusion training halves reproduces the deposited factors to within 3e-13 and the deposited
    loadings exactly, so the dataset's per-channel file is the input the paper factored. Held-out explained
    variance with six components is 0.466 under the code's reading (training reconstruction against test
    data, decode_utils.nmf_k_determination with do_refit_W_for_test = False) and 0.535 with loadings refitted
    on the test data. The test curve gains 0.081 (2 to 4 components) and 0.056 (4 to 6), then 0.014 or
    less per step. Elbow at 6 by the largest fall in gain (both readings), at 8 by the largest distance
    from the chord over 2 to 28 components, and at 6 by the chord rule when the range ends at 16, 20 or
    24 components. The criterion holds under the largest-fall rule, which is assumed. Per participant
    the test explained variance is 0.292 (SD186) to 0.654 (SD211). Both Open G readings give the code's
    numbering [0, 2, 4, 5, 1, 3]. 12 of the 28 fits stop at scikit-learn's default 200 iterations, as
    in the paper's code.
  deviations:
  - >-
    The fit starts from the dataset's per-channel train and test means (sub-H_ses-sgramPerChannel.nwb),
    not from the LFP; these were shown to equal the means of odd and even trials of the per-trial file
    (code split 1 and 0) for one channel per participant and session.
  - >-
    Held-out explained variance follows decode_utils.nmf_k_determination (lines 136 to 291), which compares
    the training reconstruction with the test data; the refit reading is shown as a variant.
  - >-
    Assumed elbow rule: the largest fall in the gain of test explained variance between successive steps.
    The paper and code give none (the code hard-codes k_elbow = 3); the chord-distance rule gives 8 over
    the full range of fig. S17A.
