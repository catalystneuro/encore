- claim: encoding-r2
  outcome: reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:encoding-r2
  measured:
  - 0.9957
  - 0.9774
  notes: Reading (a), Hand Left, gives R2 of Xu by te of 0.9957 for Short and 0.9774 for Long; reading (b), the
    mean of the 4 datasets, 0.9587 and 0.9822. All are within tolerance. Per dataset R2 is 0.909 to 0.996. The comparison
    with random axes is weak in the 2-component estimation space; random unit vectors give median R2 of 0.69 to
    0.99, 1.2% to 44.2% of them reach the R2 of u, and a linear function of ts gives R2 of 0.898 to 0.990.
  deviations:
  - Population tests run over the 4 effector and direction datasets of one session, where the paper has 8 (two animals);
    a signed-rank test over 4 values cannot fall below p = 0.125.
  - te(t) uses the dataset's own fitted wm from beh-bayes-model, where the paper fits per animal, effector and direction
    over sessions.
