- claim: alt-speed-unmodulated
  outcome: reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:alt-speed-unmodulated
  notes: The two-sided signed-rank test of the 4 slopes against zero gives p = 0.25 (Short) and 0.125
    (Long); with 4 slopes it cannot reach 0.05. The slopes are positive in 3 of 4 (Short) and 4 of
    4 (Long), and their bootstrap intervals over trials exclude zero in 2 and 3 of 4; the mean
    slope is 0.65 and 0.71 of the mean step per second. The number of trials averaged falls about
    five-fold across the support, which adds noise to the later states and can lengthen their
    steps.
  deviations:
  - Four datasets of one session, where the paper's test has 8.
- claim: alt-transient-parallel
  outcome: reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:alt-transient-parallel
  notes: The signed-rank tests of the 8 slopes against zero give p = 0.195 (shortest ts) and 1.0
    (longest ts). The distance of the shortest ts trajectory to the middle one grows in 6 of 8
    (median change +49% of its mean over 200 ms); that of the longest does not (median -5%). The
    PC spaces have 1 to 4 components.
- claim: alt-threshold-monotonic
  outcome: not_reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:alt-threshold-monotonic
  notes: With 60% of the variance (1 to 3 components) the median time of the minimum distance over
    the 32 curves is 250 ms before Go; 4 of 32 are in the last 40 ms and 12 in the last 200 ms.
    With 75% (2 to 5 components) the median is 160 ms before Go, which would be partially
    reproduced. 57% of 20 ms steps decrease the distance. With one component (Eye datasets at 60%)
    the distance is the absolute difference on one axis.
  deviations:
  - The PC spaces have 1 to 3 components at 60%; the paper's legend gives about 60% of the
    variance of a larger population.
- claim: gpfa-variance-inverted-u
  outcome: not_reproduced
  notebook: gpfa_sohn_2019.ipynb
  output: claim:gpfa-variance-inverted-u
  notes: The quadratic coefficient of variance on ts is negative in 5 of 8 dataset-priors; the
    one-tailed signed-rank test gives p = 0.0742. The mean variance at the extreme ts is below that
    of the middle three in 5 of 8. Cross-validation chose 8 latent dimensions in all 4 datasets.
  deviations:
  - GPFA is Elephant's implementation (elephant.gpfa, 500 EM iterations), not the paper's MATLAB
    code, which is not public.
  - The paper ran GPFA on high-yield sessions (N = 48 units for H); this session has 48 selected
    units, which suggests it is that session, but the files do not say so.
- claim: gpfa-mean-sigmoid
  outcome: reproduced
  notebook: gpfa_sohn_2019.ipynb
  output: claim:gpfa-mean-sigmoid
  notes: The middle increment of the mean projection exceeds the extreme one in 7 of 8
    dataset-priors (two-sided signed-rank p = 0.0156), and the slope of the mean projection on ts is
    higher for Short in 4 of 4 datasets (one-tailed signed-rank p = 0.0625, the smallest possible
    with 4, as the paper's).
  deviations:
  - GPFA is Elephant's implementation, as for gpfa-variance-inverted-u.
- claim: rnn-curved-manifold
  outcome: blocked
  blocked_by: data_missing
  notes: The recurrent networks are the paper's simulations. The dandiset holds no network, weights
    or training code, and the paper names none as public (its code is "available on request").
- claim: rnn-perturbation
  outcome: blocked
  blocked_by: data_missing
  notes: As for rnn-curved-manifold; the trained networks are not public.
- claim: monkey-g
  outcome: blocked
  blocked_by: data_missing
  notes: The dandiset holds one session of monkey H (Haydn); no session of monkey G is in it or in
    another dandiset that names the paper.
findings:
- kind: metadata_error
  statement: The description of the trials column `iti` says it is 500 ms for Short-prior trials and
    1220 ms for Long-prior trials. The data hold 1220 ms for every Short trial and 500 ms for every
    Long trial, as the paper's Methods state.
- kind: metadata_insufficient
  statement: The `tp` column is longer than go_time - set_time in every completed trial, by 0.1 to
    153.3 ms (median 17.9 ms; more than 60 ms in 13 trials). The files do not say how tp was measured
    or which of the two is the produced interval. set_time - ready_time differs from `ts` by up to
    23.5 ms in either direction.
- kind: data_missing
  statement: The dandiset holds one session of monkey H (2016-12-11, 54 units, 1160 trials), one of
    the paper's 17 sessions of H and 29 of both monkeys. Monkey G is not in it. The paper's
    population analyses pool units over sessions, so its PCA dimensionality and GLM fractions
    cannot be repeated on the same population.
- kind: other
  about: data
  statement: The test file holds 283 segments of 1.7 s from the same session with only start, stop and
    Go times, and 40 of the 54 units; their Ready, Set, ts, tp, prior, effector and direction are
    withheld for the Neural Latents Benchmark. These trials cannot be used for any analysis by
    condition, so the dandiset has fewer trials of the session than the recording.
- kind: metadata_insufficient
  statement: The units carry no single- or multi-unit label (the paper reports both) and no electrode
    or probe; the electrodes table has no positions or impedances (x, y, z and imp are NaN for all
    72). Nothing in the files says which of the paper's sessions this is; its 48 units that pass the
    paper's unit rule match the GPFA session of H the Results describe (N = 48).
- kind: methods_unavailable
  statement: Question for the authors. Was the weighted regression of tp on ts (Table S1, Figures 1E
    and 2H) fitted with an intercept? The Methods write "tp = β ts + ε". In this session the Long
    slope is below the Short slope in 4 of 4 conditions with an intercept and 3 of 4 through the
    origin, and through the origin 6 of 8 slopes exceed 1.
- kind: methods_unavailable
  about: paper
  statement: The paper's analysis code is "available on request" and not public, and the
    supplementary tables S1 to S3 were not available to this attempt, so the per-session slopes,
    model parameters and the GPFA settings could not be compared.
