    hypothesis predicts.
  deviations:
  - Population tests run over the 4 effector and direction datasets of one session, where the paper has 8 (two animals);
    the signed-rank test here runs over the 8 dataset-priors and can reach p = 0.0078.
- claim: alt-threshold-monotonic
  outcome: not_reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:alt-threshold-monotonic
  notes: With 60% of the variance (1 to 3 components) the median time of the minimum distance to the middle-ts trajectory
    is 230 ms before Go; the minimum is in the last 40 ms in 4 of 32 curves and in the last 200 ms in 13. The two
    Eye datasets keep one component, where the distance is an absolute difference, and 12 of their 16 minima fall
