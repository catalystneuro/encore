outcomes:
- claim: beh-slopes
  outcome: not_reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:beh-slopes
  notes: With an intercept, 6 of 8 slopes lie between 0 and 1 and 5 of 8 95% intervals exclude 0
    and 1. The two Eye Short slopes are 1.011 (0.896 to 1.126) and 1.107 (1.009 to 1.204). The
    Hand slopes are 0.502 to 0.861 and the Eye Long slopes 0.845 and 0.903. Through the origin, 2
    of 8 slopes lie between 0 and 1. Both readings give not reproduced. Table S1 tests the median
    slope over sessions and conditions (W = 2346 for monkey H, 68 slopes per prior) with signed-rank
    tests, where the criterion asks every condition of one session to have a slope and interval
    between 0 and 1; whether the criterion reads the paper rightly is asked of a reader in
    questions/sohn-2019.yaml. Here the median slope is below 1 for both priors (with an intercept).
  deviations:
  - One session of monkey H (4 conditions per prior), where the paper reports slopes over 17
    sessions of H and 12 of G.
  - The Methods write the regression as "tp = β ts + ε" (STAR Methods, Model free analysis of
    behavior). The fit with an intercept is the main reading, as a slope below 1 shows a bias
    toward the mean only with an intercept; the fit through the origin is shown and gives the
    same outcome.
- claim: beh-overlap-prior
  outcome: not_reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:beh-overlap-prior
  notes: At ts = 800 ms, pooled over effector and direction (92 Short, 107 Long trials), the median
    of tp - 800 is +27.8 ms for Short and +47.6 ms for Long, both positive; the two-sided rank-sum
    test gives p = 0.068. Long tp is longer than Short tp by the mean in 3 of 4 datasets; per
    dataset p is 0.0515 (Eye Left), 0.778 (Eye Right), 0.0718 (Hand Left) and 0.0010 (Hand
    Right). Only Hand Left has a negative Short median (-61.6 ms), and its Long median is also
    negative (-2.8 ms). The paper's p < 1e-43 pools 17 sessions.
  deviations:
  - One session, where the paper pools 17 sessions of H.
- claim: beh-sigmoid-increments
  outcome: reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:beh-sigmoid-increments
  notes: The middle increment exceeds the extreme one in 7 of 8 conditions (median difference 31.3
    ms); two-sided signed-rank p = 0.0156 over the 8 conditions. Hand Left Short is the exception
    (middle 45.3, extreme 56.1 ms).
  deviations:
  - Tested over the 8 conditions of one session; the paper's p < 1e-11 is over the sessions and
    conditions of H.
- claim: beh-long-more-bias
  outcome: reproduced
  assumed: true
  notebook: reproduce_sohn_2019.ipynb
  output: claim:beh-long-more-bias
  notes: With an intercept the Long slope is below the Short slope in 4 of 4 datasets (0.845 against
    1.011, 0.903 against 1.107, 0.502 against 0.612, 0.612 against 0.861). Through the origin it
    is below in 3 of 4 (Eye Right is the exception), which would be partially reproduced. Question
    for the authors, in the findings - was the regression of Table S1 and Figure 2H fitted with an
    intercept?
  deviations:
  - Assumed that the regression of tp on ts has an intercept. The Methods write "tp = β ts + ε"
    (STAR Methods, Model free analysis of behavior), and the Results read slopes below 1 as a bias
    toward the mean of the prior (Results, Task and behavior, paragraph 3), which holds only for a
    line with an intercept. The two readings give different outcomes here (4 of 4 against 3 of 4).
- claim: beh-bayes-model
  outcome: partially_reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:beh-bayes-model
  notes: The predicted SD of tp correlates positively with the observed SD in all 4 datasets (r =
    0.807, 0.911, 0.749, 0.277). The bias R2 (1 - SSres/SStot of observed against predicted bias)
    is 0.671 (Eye Left), 0.128 (Eye Right), 0.978 (Hand Left) and 0.865 (Hand Right), so at least
    0.8 in 2 of 4; the squared correlation gives the same split. Fitted wm are 0.025, 0.014, 0.117
    and 0.074, and wp 0.103, 0.106, 0.090 and 0.104; all fits converged. In the Eye datasets the
    behaviour is nearly unbiased and the model fits a small wm. Against Table S3 (monkey H, mean and
    SD over sessions), every fitted parameter lies within 1.7 SD of the mean (largest |z| 1.68, bLong
    of Hand Right); wm is below the mean in both Eye datasets (z = -1.11 and -1.46) and above it in
    both Hand datasets (1.26 and 0.45), and wp is 0.2 to 1.0 SD above it.
  deviations:
  - The model is fit per dataset on one session. Table S3 gives fits made "to each session
    separately" (supplement, Table S3 legend), so this is the paper's procedure for one of its 17
    sessions of H.
  - Numerical integration on fixed grids (241 points of tm, 201 of the prior) and Nelder-Mead from 8
    starting points; standard numerical choices.
- claim: glm-prior-ts
  outcome: not_reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:glm-prior-ts
  measured:
  - 79.2
  - 45.8
  notes: Of 48 selected units, 38 are prior-dependent (79.2%, binomial 95% interval 65.0 to 89.5%)
    and 22 ts-dependent (45.8%, 31.4 to 60.8%; 16 in the Short model and 16 in the Long model);
    expected 65 ± 6.5% and 27 ± 2.7%. No fit failed. With the Short prior's windows for the Long
    model the fractions are 79.2% and 50.0%; with all 54 units 75.9% and 44.4%; without attrition
    60.4% and 31.2%, where the prior fraction is within tolerance and the ts fraction is not.
  deviations:
  - 48 units of one session, where the paper's fractions are over 536 units of 17 sessions of H.
  - The window that ends at Set (ts = t) is included in the attrition rule, as the Methods' "80-ms
    window immediately before Set" (STAR Methods, Generalized linear model).
  - The ts model of the Long prior uses windows ending at the Long prior's ts values (800 to 1200 ms
    after Ready), the criterion's "that prior's 5 time indicators", as the Methods use "two distinct
    GLMs, one for data in the Short prior and one for the Long prior" since "values of ts were
    different between the priors" (STAR Methods, Generalized linear model).
- claim: dfr-overlap-support
  outcome: reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:dfr-overlap-support
  notes: The mean RMS of the prior difference over the 4 datasets is largest in the 480 to 640 ms
    bin (6.88 spikes/s), above the 95th percentile of the shuffled maximum (3.13 spikes/s, 200
    shuffles). Seven of 11 bins (160 to 1280 ms after Ready) exceed that threshold; the second
    largest is 800 to 960 ms (6.04), after Set, and the other bin of the support (640 to 800 ms) is
    4th (4.87).
  deviations:
  - Four datasets of one session, where the paper's figure averages 8 datasets of two animals.
- claim: pca-dimensionality
  outcome: not_reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:pca-dimensionality
  notes: 1 of 8 values in range. 2 components reach 75% of the variance in the estimation epoch of
    every dataset (expected 3 or 4) and 2, 2, 4 and 5 in the production epoch (expected 5 to 11),
    with one production trajectory per prior and ts (10 per dataset). The first 2 estimation
    components explain 0.799 to 0.857 of the variance. As variants not used by the claim, z-scored
    rates need 3 to 4 and 6 to 9 components (8 of 8 in range) and soft-normalised rates 3 and 4 to 7
    (6 of 8). The claims file fixes unnormalised rates; the paper does not say whether rates were
    normalised.
  deviations:
  - The population is 48 units of one session; the paper's PCA is on each of 8 data matrices, one
    per animal, effector and direction (STAR Methods, Principal component analysis), which pool the
    units of an animal's sessions. A smaller population can need fewer components.
- claim: encoding-r2
  outcome: reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:encoding-r2
  measured:
  - 0.9957
  - 0.9774
  notes: Reading (a), Hand Left, gives R2 = 0.9957 (Short) and 0.9774 (Long); reading (b), the mean of
    4 datasets, 0.9583 and 0.9823. Both are within tolerance. The PC space has 2 dimensions in
    every dataset, and 1000 random unit vectors in it give median R2 of 0.716 to 0.987 per dataset
    and prior; the fraction of random axes at least as good as u is 0.018 to 0.419, so the fit is
    not specific to u here. In the PC spaces of soft-normalised rates (3 components) and z-scored
    rates (3 to 4), shown as variants, both readings are also within tolerance (Hand Left 0.9746 and
    0.9809 soft, 0.9830 and 0.9693 z-scored), with random-axis medians of 0.872 to 0.944 and 0.736
    to 0.907.
  deviations:
  - te comes from the Bayesian model fitted to the same dataset of this session, where the paper's
    model is fitted to pooled sessions.
- claim: encoding-bayes-beats-linear
  outcome: partially_reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:encoding-bayes-beats-linear
  notes: The Bayesian RMSE is lower in 4 of 4 datasets for Short (differences -0.037 to -0.470) and 3
    of 4 for Long; in Hand Left Long it is higher (0.583 against 0.481). The weighted RMSE gives the
    same counts. As variants, the Bayesian RMSE is lower in 4 and 4 of 4 in the soft-normalised PC
    space (which would be reproduced) and 4 and 3 in the z-scored one.
  deviations:
  - RMSE is read as the root mean squared residual of the weighted fit (STAR Methods, Analysis of
    neural projection, "RMSE between the actual and predicted Xu"); the weighted RMSE is shown and
    gives the same outcome.
- claim: short-in-long-control
  outcome: reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:short-in-long-control
  notes: The two-sided signed-rank test of the RMSE difference over the 4 datasets gives p = 0.125
    with the axis from the state at 480 to that at 800 ms and p = 0.25 with averaged difference
    vectors; with 4 datasets p cannot fall below 0.125. With the single axis the Bayesian RMSE is
    lower in 4 of 4 datasets (mean difference -0.096, against -0.260 for the Short prior); with the
    averaged axis in 3 of 4. The test does not find the effect, but the data show a smaller version
    of the Short-prior effect in this period. In the soft-normalised and z-scored PC spaces
    (variants) p = 0.875 and 0.25, with the Bayesian RMSE lower in 2 and 1 of 4 datasets.
  deviations:
  - The Methods' "same projection analysis" (STAR Methods, Analysis of neural projection) would
    average the difference vectors; that axis is shown and gives the same outcome.
- claim: neural-long-more-bias
  outcome: partially_reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:neural-long-more-bias
  notes: The Long slope is below the Short slope in 3 of 4 datasets (Long/Short ratios 0.54, 0.62,
    0.36); in Hand Right the slopes are 0.0486 (Long) and 0.0470 (Short). In the soft-normalised and
    z-scored PC spaces (variants) the Long slope is below the Short slope in 4 of 4 datasets.
- claim: speed-vs-projection
  outcome: partially_reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:speed-vs-projection
  measured:
  - -0.9314
  - -0.874
  notes: Pooled over 4 datasets (20 points per prior), r = -0.931 for Short and -0.874 for Long, both
    p < 1e-4; both are more negative than -0.74 ± 0.074 and -0.51 ± 0.051. Within datasets r is
    -0.92 to -0.99 except Hand Left Long (-0.67, p = 0.22). With speed divided by the mean tp (the
    Methods' wording) r = -0.916 and -0.925; z-scored within dataset, -0.973 and -0.876.
  deviations:
  - The production PC space has 2 to 5 dimensions, where the paper's has 5 to 10.
  - The production trajectories are one per prior and ts (10 per dataset), the Methods' 16 matrices
