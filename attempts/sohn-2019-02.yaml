- claim: short-in-long-control
  outcome: reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:short-in-long-control
  notes: By the paper's test, the two-sided signed-rank test of the RMSE difference (Bayesian - linear) over the
    4 datasets gives p = 0.25 with the axis built as u is (mean of difference vectors) and 0.125 with the single
    difference X(800) - X(480); with 4 datasets the test cannot reach p < 0.05. The effect does not look absent.
    The Bayesian model fits better in 3 of 4 datasets (-0.21, -0.12, +0.05, -0.11 spikes/s), of a size like the
    Short prior's own differences (-0.04 to -0.47). The paper's ANOVA interaction was not run.
  deviations:
  - Population tests run over the 4 effector and direction datasets of one session, where the paper has 8 (two animals);
    a signed-rank test over 4 values cannot fall below p = 0.125.
  - The axis is built from the mean of difference vectors between 480 and 800 ms, as for u (Methods, Analysis of
    neural projection, 'we applied the same projection analysis'); the single difference the criterion names is
    shown and gives the same outcome.
