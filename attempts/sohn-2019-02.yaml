- claim: beh-long-more-bias
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_sohn_2019.ipynb
  output: claim:beh-long-more-bias
  notes: Through the origin, the regression of the Methods and Table S1, the Long slope is below the Short slope
    in 3 of 4 datasets (Eye Left 0.996 and 1.072, Hand Left 0.923 and 1.013, Hand Right 1.032 and 1.057, Long then
    Short); in Eye Right it is above (1.027 against 1.016). With an intercept it is below in all 4 (Eye Left 0.845
    and 1.011, Eye Right 0.903 and 1.110, Hand Left 0.502 and 0.612, Hand Right 0.612 and 0.861), which would be
    reproduced. With go_time - set_time in place of tp the counts are the same, 3 of 4 and 4 of 4. Through the origin
    the slope absorbs a constant offset; the intercepts of the regression with one are -60 to +435 ms, and the slopes
    through the origin are within 0.010 of mean tp / mean ts in every condition. The outcome rests on the reading
    without an intercept, which is asked of a reader.
  deviations:
  - One session of monkey H (2016-12-11), where the paper pools 17 sessions of H and 12 of G; the 283 test-file
    trials of the session have no task variables and are not used.
  - Assumed. The criterion does not say whether the regression has an intercept, and the two readings give different
    outcomes. The regression has no intercept, as the Methods (Model free analysis of behavior) and the Table S1
    legend write it, tp = beta ts + epsilon; the regression with an intercept, the usual way to measure a bias toward
    the mean, is shown as a variant and gives 4 of 4.
- claim: beh-bayes-model
  outcome: partially_reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:beh-bayes-model
  notes: The correlation of observed and predicted SD of tp over the 10 conditions is positive in all 4 datasets
    (Eye Left 0.807, Eye Right 0.909, Hand Left 0.749, Hand Right 0.277 with p = 0.44). The bias R2 (1 - SS_res/SS_tot)
    reaches 0.8 in 2 of 4 (Hand Left 0.978, Hand Right 0.865; Eye Left 0.670, Eye Right 0.122); the squared correlation
    gives the same count. Fitted wm are 0.025, 0.013, 0.116 and 0.073 (Eye Left, Eye Right, Hand Left, Hand Right),
    1.1 and 1.5 SD below and 1.3 and 0.4 SD above the session means of Table S3 (0.043, 0.027, 0.085, 0.062); fitted
    wp 0.103, 0.106, 0.090 and 0.104 are 0.2 to 1.0 SD above Table S3. The fits are interior; relaxing the lower
    bound on the noise weights from 0.01 to 1e-4 does not move them. With wm held at Table S3 means the bias R2
    is 0.581, 0.126, 0.929 and 0.830, again 2 of 4. For Eye Right the profile log-likelihood is within 0.46 of its
    best for wm 0.003 to 0.02, and the bias R2 is at most 0.146 over the profile. The Eye biases span only 108 and
    80 ms over the 10 conditions, against 265 and 166 ms for Hand. Whether the criterion should compare the fit
    with Table S3, which it calls unavailable, is asked of a reader.
  deviations:
  - One session of monkey H (2016-12-11), where the paper pools 17 sessions of H and 12 of G; the 283 test-file
    trials of the session have no task variables and are not used.
  - The prior is continuous uniform over each range (claims file), where the Methods describe 5 discrete values;
    production noise is wp times te and the offset b is added to te (Methods, Analysis of behavior with a Bayesian
    model).
  - Fit per effector and direction of one session, where the paper pools sessions per animal, effector and direction.
  - R2 is read as 1 - SS_res/SS_tot of the observed biases around the predicted ones; the squared Pearson correlation
    is shown as a second reading and gives the same outcome.
- claim: glm-prior-ts
  outcome: not_reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:glm-prior-ts
  measured:
  - 79.2
  - 45.8
  notes: 38 of 48 units (79.2%, binomial 95% CI 65.0 to 89.5) are prior-dependent, against 65 +- 6.5%. Under reading
    (a), Long-prior windows ending at the Long ts values (800 to 1200 ms), 22 of 48 (45.8%, 31.4 to 60.8) are ts-dependent;
    under reading (b), the same 480 to 800 ms windows in both priors, 24 of 48 (50.0%), against 27 +- 2.7%. Both
    fractions are higher than the paper's for monkey H under both readings. 19 units are both and 7 neither. The
    tolerances are narrower than the binomial interval of a fraction of 48 units; the prior fraction's interval
    reaches 65, while both ts fractions' intervals (31.4 to 60.8 and 35.2 to 64.8) exclude 27.
  deviations:
  - One session of monkey H (2016-12-11), where the paper pools 17 sessions of H and 12 of G; the 283 test-file
    trials of the session have no task variables and are not used. The paper's 65% and 27% are over 536 units of
    monkey H; here 48 units.
  - For ts dependence the criterion gives each prior that prior's 5 time indicators. Reading (a) places the Long-prior
    windows before the Long ts values, following the Methods' sentence that two GLMs were used since values of ts
    were different between the priors (Generalized linear model); reading (b) keeps the 480 to 800 ms windows. Both
    run; both give the same outcome.
  - BIC is -2 log-likelihood + k ln n of statsmodels' Poisson GLM, with the observations of all windows (3921 per
    unit for the prior test).
