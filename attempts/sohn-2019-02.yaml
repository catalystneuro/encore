- claim: alt-speed-unmodulated
  outcome: reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:alt-speed-unmodulated
  notes: By the paper's test, the two-sided signed-rank tests of the 4 slopes against zero give p = 0.25 (Short)
    and 0.125 (Long); with 4 datasets the test cannot reach p < 0.05, so the criterion cannot fail. With attrition
    the slope of step distance on time is positive in 7 of 8 dataset-priors (changes of -13% to +56% over the support),
    but later bins average fewer trials, which adds noise to their steps. From the longest-ts trials alone, so that
    every bin averages the same 18 to 31 trials, the slopes are negative in 7 of 8 (changes of -42% to +11%; p =
    0.625 and 0.125), consistent with attrition, though this control also uses fewer trials and only the longest-ts
    ones. The percentile bootstrap intervals over trials exclude zero in 6 of 8, but only 3.5% to 27.0%
    (median 6.2%) of the bootstrap slopes fall below the point estimate, so they are biased upward; the basic bootstrap
    intervals exclude zero in 1 of 8; neither interval removes the attrition bias of the point estimate.
  deviations:
  - Population tests run over the 4 effector and direction datasets of one session, where the paper has 8 (two animals);
    a signed-rank test over 4 values cannot fall below p = 0.125.
  - Bootstrap of trials within each ts, 200 resamples (a standard choice); percentile and basic intervals are both
    shown. The slopes from the longest-ts trials alone are shown as a variant without attrition.
- claim: alt-transient-parallel
  outcome: reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:alt-transient-parallel
  notes: PCA on Set to Set + 200 ms keeps 1 to 4 components. The two-sided signed-rank tests of the 8 slopes against
    zero give p = 0.195 for the shortest ts and 1.0 for the longest. For the longest ts the median change over 200
    ms is 0.07 spikes/s against a median distance of 22.3. For the shortest ts the distance grows in 6 of 8 dataset-priors
