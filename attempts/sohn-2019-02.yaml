- claim: gpfa-variance-inverted-u
  outcome: not_reproduced
  notebook: gpfa_sohn_2019.ipynb
  output: claim:gpfa-variance-inverted-u
  notes: Cross-validation chose 8 latent dimensions in all 4 datasets. The quadratic coefficient of variance on
    ts is negative in 6 of 8 dataset-priors and the one-tailed signed-rank test gives p = 0.0547. The result sits
    at the threshold; refits with three other seeds give p = 0.055, 0.039 and 0.055, and 4 latent dimensions p =
    0.098, with 6 of 8 negative each time. The mean variance profile by ts rank (0.78, 0.91, 0.85, 0.51, 0.45) falls
    toward the long end. Variances rest on 14 to 38 trials per ts.
  deviations:
  - Population tests run over the 4 effector and direction datasets of one session, where the paper has 8 (two animals);
    a signed-rank test over 4 values cannot fall below p = 0.125. The paper used one high-yield session of 48 units
    for H; this session has 48 selected units, but whether it is that session is not stated.
  - GPFA is elephant 1.2.1's port of Yu et al. (2009), not the paper's MATLAB code; it fits on 20-bin segments with
    random overlaps (elephant's default), seeded here.
