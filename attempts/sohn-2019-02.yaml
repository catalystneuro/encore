- kind: data_missing
  statement: The test file's 283 trials (about 20% of the session's 1443) hold only a go_time per 1.7 s segment,
    for 40 of the 54 units. Their prior, ts, effector, direction and Ready and Set times are withheld for the Neural
    Latents Benchmark, so they cannot be used for any of the paper's analyses. Their spikes are not repeated in
    the train file.
- kind: metadata_error
  statement: The description of the trial column iti says it is 500 ms for Short-prior trials and 1220 ms for Long-prior
    trials. The values are the reverse (1220 ms in all 577 Short trials, 500 ms in all 583 Long trials), as the
    paper's Methods give.
- kind: metadata_insufficient
  statement: tp is longer than go_time - set_time in every analysed trial, by a median of 17.9 ms (0.1 to 200.6
    ms), and set_time - ready_time differs from ts by up to 23.5 ms. The files do not say between which events tp
    is measured or how the event times were registered. Windows of neural data that end at the shortest tp of a
    condition run past the earliest Go in 36 of 40 conditions, by up to 121.5 ms.
- kind: metadata_insufficient
  statement: Units have no electrode or probe assignment (the unit table has no electrodes column and the 72 electrodes
    have no positions), and no label says which units are single units and which multi-units, a distinction the
    paper reports (196 single and 421 multi-units in monkey H).
- kind: methods_unavailable
  statement: Question for the authors. The Methods write the weighted regression of tp on ts as tp = beta ts + epsilon.
    Did the regressions of Figure 1E, Figure 2H and Table S1 have no intercept, as written, or an intercept? In this
    session the Long slope is below the Short slope in 3 of 4 effector and direction datasets through the origin and
    in 4 of 4 with an intercept.
