- claim: beh-slopes
  outcome: not_reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:beh-slopes
  notes: Through the origin (the regression the Methods and the Table S1 legend write, tp = beta ts + epsilon) 2
    of 8 weighted slopes lie between 0 and 1 (Eye Left Long 0.996, Hand Left Long 0.923) and 1 of 8 intervals excludes
    both 0 and 1; the other six slopes are 1.013 to 1.072. With an intercept 6 of 8 lie between 0 and 1; Eye Left
    Short (1.011, 95% CI 0.896 to 1.126) and Eye Right Short (1.110, 1.014 to 1.206) do not. With go_time - set_time
    in place of tp, 4 of 8 (through the origin) and 7 of 8 (with an intercept) lie between 0 and 1. No reading gives
    all 8 below 1.
  deviations:
  - One session of monkey H (2016-12-11), where the paper pools 17 sessions of H and 12 of G; the 283 test-file
    trials of the session have no task variables and are not used.
  - The criterion does not say whether the regression has an intercept. Taken from the paper, the Methods (Analysis
    of behavior, Model free analysis) and the Table S1 legend both write tp = beta ts + epsilon, so the main reading
    has no intercept. The regression with an intercept, and both with go_time - set_time in place of tp, are shown;
    all give the same outcome.
  - Trials are the completed trials not flagged by the file's is_outlier column (claims file); the mixture model
    is the file's, not refit here.
- claim: beh-overlap-prior
  outcome: not_reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:beh-overlap-prior
  notes: At ts = 800 ms the median of tp - 800 is +28.3 ms for Short (n 93) and +47.6 ms for Long (n 107); the Short
    median is not negative, and the two-sided rank-sum test between priors gives p = 0.073. Per dataset only Hand
    Left has a negative Short median (-61.6 ms), the Long median is the larger in 2 of 4, and only Hand Right differs
    at p < 0.05 (p = 0.00099). The Eye Short medians are +79.1 and +40.9 ms.
  deviations:
  - One session of monkey H (2016-12-11), where the paper pools 17 sessions of H and 12 of G; the 283 test-file
    trials of the session have no task variables and are not used. The paper's p < 1e-43 pools 17 sessions.
