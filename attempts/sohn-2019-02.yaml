- claim: speed-vs-projection
  outcome: partially_reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:speed-vs-projection
  measured:
  - -0.932
  - -0.874
  notes: Pooled over the 4 datasets (20 points per prior), Xu at Set correlates negatively with the speed of the
    production trajectory, r = -0.932 (p = 2.3e-09) for Short and -0.874 (p = 4.8e-07) for Long, both stronger than
    the paper's -0.74 and -0.51 and outside tolerance. Within datasets r is -0.919 to -0.995 (Short) and -0.669
    to -0.956 (Long). Dividing the mean step by the mean Set to Go duration (the Methods' wording) gives -0.922
    and -0.924, and dividing the path length by it -0.933 and -0.875. With windows ending at the shortest go_time
    - set_time, so that none runs past Go, r is -0.921 and -0.838; with a kernel SD of 20 ms -0.663 and -0.618,
    and with SD 17 ms -0.554 and -0.465 (Long within tolerance), all partially reproduced. With the outlier-flagged
    trials included r is -0.922 and -0.673 (p = 0.0011), also partial. Without smoothing r is +0.255 (p = 0.28) and
    -0.036 (p = 0.88), which would be not reproduced; the claims file fixes the smoothing.
  deviations:
  - Population tests run over the 4 effector and direction datasets of one session, where the paper has 8 (two animals). Xu scales differ between datasets and are pooled
    as they are, as the criterion says.
  - Production windows end at the shortest tp of each condition, as the claims file says; tp exceeds go_time - set_time,
    so 36 of 40 windows run past the earliest Go of their condition, by up to 121.5 ms (median 11.5). Windows ending
    at the shortest go_time - set_time are shown and give the same outcome.
