- claim: pca-dimensionality
  outcome: not_reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:pca-dimensionality
  notes: In the estimation epoch 2 components reach 75% of the variance in all 4 datasets (0.80 to 0.86 with 2,
    0.87 to 0.91 with 3), so none is in 3 to 4. In the production epoch 2, 2, 4 and 5 components do (Eye Left, Eye
    Right, Hand Left, Hand Right), so 1 of 4 is in 5 to 11. 1 of 8 values is in range. The counts depend on the
    smoothing. With a kernel SD of 20 ms 2 of 8 are in range, and with SD 17 ms (a full width at half maximum of
    40 ms) 3 of 8, both not reproduced; without smoothing (3 to 6 and 6 to 15 components) 5 of 8, which would be
    partially reproduced. Two questions are open to a reader, whether the Methods' kernel width of 40 ms is its
    SD, and how the paper's PCA population of 536 units pooled over 17 sessions bears on the ranges, where this
    session has 48 units.
  deviations:
  - One session of monkey H (2016-12-11), where the paper pools 17 sessions of H and 12 of G; the 283 test-file
    trials of the session have no task variables and are not used. 48 units, where the paper's datasets pool the
    units of all sessions of an animal (536 for H).
  - The Gaussian kernel is renormalised over the bins of each epoch so that no bin outside it enters (a standard
    choice the Methods do not fix). The kernel SD of 40 ms is the claims file's; SD 20 ms and 17 ms are shown as
    other readings of the Methods' kernel width of 40 ms.
- claim: encoding-r2
  outcome: reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:encoding-r2
  measured:
  - 0.9957
  - 0.9774
  notes: Reading (a), Hand Left, gives R2 of Xu by te of 0.9957 for Short and 0.9774 for Long; reading (b), the
    mean of the 4 datasets, 0.9587 and 0.9822. All are within tolerance. Per dataset R2 is 0.909 to 0.996. The comparison
    with random axes is weak in the 2-component estimation space; random unit vectors give median R2 of 0.69 to
    0.99, 1.2% to 44.2% of them reach the R2 of u, and a linear function of ts gives R2 of 0.898 to 0.990. With
    narrower kernels (SD 20 and 17 ms) Hand Left gives 0.982 and 0.916, and 0.994 and 0.937, still within tolerance.
    Without smoothing Hand Left gives 0.909 and 0.581 and the 4-dataset mean 0.847 and 0.813, which would be partially
    reproduced; the claims file fixes the smoothing.
  deviations:
  - Population tests run over the 4 effector and direction datasets of one session, where the paper has 8 (two animals).
  - te(t) uses the dataset's own fitted wm from beh-bayes-model, where the paper fits per animal, effector and direction
    over sessions.
