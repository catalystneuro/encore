- claim: alt-speed-unmodulated
  outcome: reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:alt-speed-unmodulated
  notes: By the paper's test, the two-sided signed-rank tests of the 4 slopes against zero give p = 0.25 (Short)
    and 0.125 (Long); with 4 datasets the test cannot reach p < 0.05. The effect sizes lean toward modulation. The
    slope of step distance on time is positive in 7 of 8 dataset-priors, the step distance changes by -13% to +56%
    over the support, and percentile bootstrap intervals over trials exclude zero in 6 of 8. These intervals sit
    mostly above the point estimates, so they are biased upward. Attrition reduces the trials averaged about five-fold
    across the support, which adds noise to the later steps; this may contribute to the positive slopes and was
    not tested.
  deviations:
  - Population tests run over the 4 effector and direction datasets of one session, where the paper has 8 (two animals);
    a signed-rank test over 4 values cannot fall below p = 0.125.
  - Bootstrap of trials within each ts, 200 resamples (a standard choice).
- claim: alt-transient-parallel
  outcome: reproduced
  notebook: reproduce_sohn_2019.ipynb
  output: claim:alt-transient-parallel
  notes: PCA on Set to Set + 200 ms keeps 1 to 4 components. The two-sided signed-rank tests of the 8 slopes against
    zero give p = 0.195 for the shortest ts and 1.0 for the longest. For the longest ts the median change over 200
    ms is 0.07 spikes/s against a median distance of 22.3. For the shortest ts the distance grows in 6 of 8 dataset-priors
    (median change 14.5 against a median starting distance of 18.2), a divergence, not the convergence the transient
    hypothesis predicts.
  deviations:
  - Population tests run over the 4 effector and direction datasets of one session, where the paper has 8 (two animals);
    a signed-rank test over 4 values cannot fall below p = 0.125.
