outcomes:
- claim: fig1-ttype-coverage
  outcome: blocked
  blocked_by: data_missing
  notes: The finding rests on the 1,329 cells of the main data set and their sequencing. The
    dandiset holds only the 185 cells of the follow-up at 34 degrees, with their t-type labels
    but no gene counts. The main data set's recordings are in dandiset 000008, its sequencing data
    at NeMO (dat-kq04hua) and GEO (GSE163764), and its processed tables in the paper's repository.
