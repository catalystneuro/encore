  source: https://github.com/berenslab/mini-atlas at commit 3bf98a524b8e48aa8647e1b9ae8f2351d9c712c9
- what: The paper's published electrophysiological features of the 34 degree cohort,
    data/m1_patchseq_phys_temp_ephys_features.csv, used for link-features and as a variant in
    ed6-sst-temperature.
  source: https://github.com/berenslab/mini-atlas at commit 3bf98a524b8e48aa8647e1b9ae8f2351d9c712c9
- what: The paper's per-cell table and published electrophysiological features of the main
    room-temperature data set, data/m1_patchseq_meta_data.csv and
    data/m1_patchseq_ephys_features.csv, used for the 25 degree side of ed6-sst-temperature.
  source: https://github.com/berenslab/mini-atlas at commit 3bf98a524b8e48aa8647e1b9ae8f2351d9c712c9
outcomes:
- claim: fig1-ttype-coverage
  outcome: blocked
  blocked_by: data_missing
  notes: The finding rests on the 1,329 cells of the main data set and their sequencing. The
    dandiset holds only the 185 cells of the follow-up at 34 degrees, with their t-type labels
    but no gene counts. The main data set's recordings are in dandiset 000008, its sequencing data
    at NeMO (dat-kq04hua) and GEO (GSE163764), and its processed tables in the paper's repository.
- claim: fig2-rrr-prediction
  outcome: blocked
  blocked_by: data_missing
  notes: Needs gene expression and features of the main data set. The dandiset holds no gene
    counts and none of the main data set's cells; they are in dandiset 000008 and at NeMO and GEO.
- claim: ed5-rrr-ion-channels
  outcome: blocked
  blocked_by: data_missing
  notes: As fig2-rrr-prediction.
- claim: fig3d-families-separate
  outcome: blocked
  blocked_by: data_missing
  notes: Needs the main data set's cells, which are in dandiset 000008. The same classifier was run
    on the 34 degree cells for ed6-it-et-overlap, where Lamp5, Vip and CT cells are absent.
- claim: fig3d-morphology-combined
  outcome: blocked
  blocked_by: data_missing
  notes: Needs morphological reconstructions, which are not in the dandiset (none were recovered in
    the 34 degree experiments). They are in the Brain Image Library, with features in the paper's
    repository.
- claim: fig4c-distance-correlation
  outcome: blocked
  blocked_by: data_missing
  notes: Needs the main data set's cells (dandiset 000008) and the reference 10x expression data.
- claim: fig4d-it-depth
  outcome: blocked
  blocked_by: data_missing
  notes: Needs the main data set's IT cells (their soma depths are in the paper's repository and
    dandiset 000008) and the reference 10x expression data.
- claim: fig5a-ttypes-between-families
  outcome: blocked
  blocked_by: data_missing
  notes: Needs the main data set's cells, in dandiset 000008. The t-types named in the claim are
    not among the 34 degree cells except Sst Pvalb Calb2.
- claim: fig5b-ttype-variability
  outcome: blocked
  blocked_by: data_missing
  notes: Needs the main data set's cells, in dandiset 000008.
- claim: ed6-cohort
  outcome: reproduced
  notebook: reproduce_scala_2021.ipynb
  output: claim:ed6-cohort
  measured: [185, 8, 7, 1, 177, 110, 43, 12, 10, 2, 175, 185]
  notes: Every count matches the Methods. All 17 features are defined for 185 cells against 184 in
    the paper, within the 10% tolerance. Families are read from the t-type names in the files; the
    12 ET cells are named L5 PT_1 to L5 PT_4 there.
  deviations:
  - The number of cells with features comes from the re-implemented extraction here; the paper's
    table has no row for 20200406_sample_4.
- claim: ed6-stimulus-protocol
  outcome: partially_reproduced
  notebook: reproduce_scala_2021.ipynb
  output: claim:ed6-stimulus-protocol
  notes: In all 185 cells every step lasts 600 ms (0.1 to 0.7 s) and consecutive steps differ by
    20 pA, and 139 cells end at 1,380 pA. 174 of 185 (94.1%) conform to the whole ladder. Nine
    cells of mouse_UEQOU end at 1,400 to 1,580 pA, and two cells of other mice start at -180 pA
    and -100 pA and end above 1,380 pA. The intervals of 1.3 or 1.4 s between pulses cannot be
    checked because every series has an undefined starting time.
- claim: ed6-it-et-overlap
  outcome: reproduced
  notebook: reproduce_scala_2021.ipynb
  output: claim:ed6-it-et-overlap
  notes: With the paper's kNN classifier (k = 10, leave-one-out, 17-feature representation, all
    185 cells), 58.3% of ET cells (7 of 12) are classified as IT and no IT cell as ET; Sst cells
    are classified as Sst 100% of the time and Pvalb cells 60%. ET cells go to IT in both mice
    with ET cells (1 of 3 and 6 of 9). The overlap is one-sided and partly reflects that IT cells
    are 78% of IT and ET cells. With IT subsampled to 12 cells, 4.1% of ET cells go to IT and
    47.5% of IT cells to ET; a class-balanced logistic regression separates layer 5 IT from ET
    with a balanced accuracy of 0.83 against a shuffled-label null of 0.50 (p = 0.005). The
    result on layer 5 cells alone is the same as on all cells (58.3% and 0%).
  deviations:
  - The paper shows the 34 degree comparison as feature distributions and two-feature scatter
    plots (Extended Data Fig. 6a-g); it reports no classifier at 34 degrees. The test applies the
    room-temperature classifier of Fig. 3d to the 34 degree cells, with four families present
    instead of seven.
  - Features are computed by the re-implementation here; link-features shows they agree with the
    paper's.
- claim: ed6-it-et-ap-threshold
  outcome: reproduced
  notebook: reproduce_scala_2021.ipynb
  output: claim:ed6-it-et-ap-threshold
  notes: Layer 5 IT median -27.0 mV (43 cells) against ET -33.1 mV (12 cells), Mann-Whitney
    p = 0.00035, area under the curve 0.84; second of 17 features after input resistance
    (p = 0.0001). Same sign in both mice with both subclasses. The ranking of the first two features
    is the one the paper's code prints for 34 degrees.
  deviations:
  - The ranking covers the 17 features used here, not all 29 the paper's code ranks.
- claim: link-cells
  outcome: partially_reproduced
  notebook: reproduce_scala_2021.ipynb
  output: claim:link-cells
  notes: All 185 files match a row of the paper's table by cell id and no row lacks a file. Family,
    layer, soma depth and mouse agree for every cell; the files' inferred layer equals the layer
    the paper's code computes from soma depth and cortical thickness. The t-type name agrees for
    93.5% of cells, below the criterion's 95%, only because the 12 ET cells are named L5 PT_1 to
    L5 PT_4 in the files and L5 ET_1 to L5 ET_4 in the table, one to one; with that renaming the
    agreement is 100%. The partial outcome reflects the names, not a mismatch of cells.
  deviations:
  - The criterion did not anticipate renamed t-types and was applied as written, to the names.
- claim: link-features
  outcome: reproduced
  notebook: reproduce_scala_2021.ipynb
  output: claim:link-features
  notes: 184 of the 185 cells are in the paper's feature table. The Spearman correlation between
    the features computed here and the published ones is at least 0.9 for 16 of 17 features
    and 0.877 for the lowest, the AP coefficient of variation. The median absolute difference is
    zero to three decimals for all features but the AHP (0.011 mV). By mouse, 0.895
    (mouse_UEQOU) to 0.995 of values are within 10% of the paper's. The maximum number of APs
    differs between the Methods' and the code's definitions for 3 cells.
  deviations:
  - The extraction is a re-implementation of the paper's methods and code (scala34.py), not the
    paper's code, which is under the Allen Institute's license.
  - The maximum number of APs follows the Methods (sweeps with spikes in the 100 ms before or the
    200 ms after the step are excluded before taking the maximum); the code's version is shown.
- claim: ed6-sst-temperature
  outcome: reproduced
  notebook: reproduce_scala_2021.ipynb
  output: claim:ed6-sst-temperature
  notes: 147 layer 5 Sst cells at 25 degrees (published features) and 101 at 34 degrees (computed
    here); seven t-types have at least 5 cells in both. Shifts in units of the 25 degree SD are AP
    width -1.78, AP amplitude -1.66, input resistance -0.61, rebound -0.33, AHP -0.25 and sag
    ratio -0.02, so AP width and amplitude change most. Spearman correlations of t-type medians
    between temperatures are 0.75 (AP amplitude), 0.88 (AP width), 0.93 (AHP, input resistance,
    rebound) and 0.96 (sag ratio), median 0.93. The same holds with the paper's published 34
    degree features and with t-type means. In each of the 7 mice with such cells, the 34 degree
    medians of AP amplitude and width lie below the room-temperature medians.
  deviations:
  - The room-temperature side uses the paper's published features of dandiset 000008's cells, not
    features recomputed from that dandiset.
  - The legend says the relative differences "stayed roughly the same"; the criterion turns this
    into Spearman correlations of t-type medians and a shift measured in standard deviations.
- claim: ed6-sst-transcriptomic-distance
  outcome: blocked
  blocked_by: not_runnable
  notes: The transcriptomic distance between Sst t-types needs the average expression of each
    t-type in the single-cell 10x v2 reference data (Yao et al. 2021). The paper's code reads it
    from reduced-allen-data.zip on Zenodo (doi:10.5281/zenodo.5118962), member
    10X_cells_v2_AIBS.pickle, 88 MB compressed and 517 MB uncompressed. While preparing, it was
    streamed with HTTP range requests at 72 to 165 KB/s (about 9 minutes for the member, and 4.6
    minutes for a 20 MB range in a second attempt), so the notebook could not fetch it reliably
    within the time limit; the original reference data at NeMO are much larger. These
    preparation runs supply no number to the record. The electrophysiological side is in the
    dandiset, and the t-type labels are in the files. The paper reports the correlation and its
    p-value only inside the figure, for 9 t-types at 34 degrees in its code.
findings:
- kind: metadata_error
  statement: Every voltage series states the unit volts and every stimulus series amperes, with a
    conversion of 1, but the values are in millivolts (-150 to 67) and picoamperes (-200 to
    1,580).
- kind: metadata_insufficient
  statement: Every series has an undefined (NaN) starting time, so the timing of sweeps relative
    to each other is not recorded. Within a sweep the response and the stimulus share a clock
    (onset at 0.1 s, offset at 0.7 s).
- kind: metadata_insufficient
  statement: The t-type of the 12 ET cells is stored under the older names L5 PT_1 to L5 PT_4,
    which differ from the paper's and its tables' L5 ET_1 to L5 ET_4; no mapping is given. All
    other t-type names match the paper's table.
- kind: metadata_error
  statement: The dandiset's description repeats the main data set's "over 1300 neurons"; the
    dandiset holds 185 neurons of the follow-up at 34 degrees.
- kind: metadata_error
  statement: In the published version the contributor list has a placeholder "Last, First" with
    Zizhen Yao's ORCID, the brain region is typed as a disorder, and the assets summary gives no
    approach or measurement technique. The unpublished draft corrects these.
- kind: other
  statement: Eleven cells were stimulated beyond the 1,380 pA the Methods give (up to 1,580 pA),
    and two of them started at -180 pA and -100 pA, not -200 pA. Nine of the eleven are from one
    mouse (mouse_UEQOU).
- kind: code_mismatch
  statement: The paper's code takes the maximum number of APs before excluding sweeps with spikes
    outside the step, and looks for those spikes over the whole trace before and after the step;
    the Methods exclude such sweeps first and look 100 ms before and 200 ms after. The two
    definitions differ for 3 of the 185 cells.
- kind: paper_inconsistency
  statement: The Methods build the electrophysiological representation from 17 principal
    components of 17 features and later call it "the 16-dimensional electrophysiological
    representation"; the paper's code uses all 17.
- kind: paper_inconsistency
  statement: The legend of Extended Data Fig. 6j describes it as "the same analysis as in (c)",
    but in the paper's code panel j is the 34 degree version of panel i (the Sst overlay and the
    transcriptomic-distance correlation), not of panel c.
