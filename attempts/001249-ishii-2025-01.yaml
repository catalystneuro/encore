  outcome: reproduced
  notebook: reproduce_ishii_2025.ipynb
  output: claim:fig4h-response-magnitude
  notes: Vgat against Vglut2, Bonferroni over six; ejaculation 2.11 against 0.85, t(791) = 3.998, p =
