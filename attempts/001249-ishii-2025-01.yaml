inputs:
- what: The authors' Figshare deposit, version 1, which holds the data of Figures 1, 3 to 7 and their
    supplements (behavior tables, HCR per-cell table, calcium imaging traces and per-cell table, clustering
    labels, chemogenetics tables). Every claim marked data elsewhere is tested on it; the MD5 of each
    zip read is checked in the notebook.
  source: doi:10.6084/m9.figshare.27642768.v1
- what: The paper's analysis notebooks, read for method details the claims file and the Methods leave
    open (columns tested, how per-animal values are formed, the clustering grid and elbow rule, the parameter
    values).
  source: https://github.com/stuberlab/Ishii-MPOA-Ejaculation-2023 at commit 4e98c4369ea0f6dcfc2648c561d43a4a235e5f15
outcomes:
- claim: fig2-density-link
  outcome: blocked
  blocked_by: too_large
  notes: 'The dandiset holds only the raw light-sheet volumes (TRAP and background channel per brain,
    uint16, uncompressed and unchunked), with no registration, segmentation, cell counts, atlas labels
    or region volumes. The data check read one middle plane of every brain and measured streaming at 67.4
    MB/s in the executed notebook (35.5 to 65.2 MB/s in earlier runs; the rate varies), so reading the
    TRAP channels once (691 GB) takes 171 min and both channels (1382 GB, the background channel being
    the one registered to the atlas) 342 min, over the 60 min a notebook may run (docs/protocol.md,
    Author,
    step 3; CI fails a notebook over sixty minutes) and over the time left in the run. Cheaper reads were
    timed: full-width bands of rows stream at 20.4 MB/s and crops at 2.5 MB/s, and every 25th (or 10th)
    background plane of all 14 brains, enough for a registration, takes 7 (17) min; but every Figure
    2 claim corrects over a family of atlas regions that covers the brain (Benjamini-Hochberg over the
    level-4 or level-6 regions, or the rank of the MPN among all regions), so each needs every region
    of every brain segmented at full resolution, and reading only the regions named does not test them.
    No registration (ClearMap), segmentation or density was computed. The segmentation would also need
    the ilastik classifier, which is not deposited and which the Methods trained on manually labelled
    chunks from four brains; this alone would block the claims as methods_underspecified, a second reason.
    The grouping part of the link holds: the 14 brains match the 14 rows of the subject table in the Figure
    2 zip on Figshare (meta/metainfo.csv) by name (Sniff_n, Mount_n and Ejaculation_n against sub-Sniff-n
    and so on), and the dandiset''s groups (4 Sniff, 5 Mount, 5 Ejaculation) equal the Stim labels of
    tdTomato_summary.csv (4 Appetitive, 5 Consummatory, 5 Post_ejaculatory). The density part, which decides
    the outcome, was not run, as there are no densities from the dandiset to compare with the table''s.'
