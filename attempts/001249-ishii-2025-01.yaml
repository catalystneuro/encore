- claim: fig5c-class-selectivity
  outcome: reproduced
  notebook: reproduce_ishii_2025.ipynb
  output: claim:fig5c-class-selectivity
  notes: F(2,235) = 73.35 (sniff), 68.32 (mount), 15.72 (intromission), 12.34 (anogenital sniffing), 49.59
    (ejaculation), the legend's values. Sniff cells exceed both other classes for sniff and ejaculation
    cells for ejaculation (Tukey p at most 0.0001); mount cells exceed both for mount and exceed ejaculation
    cells for intromission and anogenital sniffing (p < 0.0001); mount cells are below sniff cells for
    sniff (0.459 against 2.504) and below ejaculation cells for ejaculation (-0.517 against 5.902).
- claim: fig6c-decay-length
  outcome: reproduced
  assumed: true
  notebook: reproduce_ishii_2025.ipynb
  output: claim:fig6c-decay-length
  notes: Re-run on the reader's answer of 2026-11-01 (questions/001249.yaml), which added reading (c),
    the time from the peak after onset to the first sample below 0 after it, to the criterion; the first
    run of this attempt, on readings (a) and (b) only, gave not_reproduced. Under (c) Vgat responders
    take 45.2 s against 20.9 s in Vglut2, t = 3.037, p = 0.0027 (paper t(217) = 3.040, p = 0.00266), and
    (c) equals the deposited decay lengths for 207 of 219 cells (r = 1.000). The result rests on giving
    the 44 cells that never fall below 0 after the peak (43 Vgat, 1 Vglut2; 31 in mouse Vgat_2) the full
    120 s, as the deposited table does for all 44. Counting them as the time from the peak to the end
    of the window gives 28.9 against 20.6 s (p = 0.111); leaving them out gives 22.4 against 18.0 s (p
    = 0.299). Under (c) the rank-sum test gives p = 0.187 and the animal means 40.9 against 20.2 s (6
    and 4 mice, p = 0.149). Reading (a), onset to the first sample below 0, gives 18.7 against 22.2 s,
    t = -0.608, p = 0.544, and reading (b), total time below 0, 53.9 against 75.3 s, t = -2.641, p = 0.0089
    (Vgat shorter). The authors are asked how the decay length is defined (finding). Reading (c) and the
    table differ for 12 of the 219 responders (11 in Vgat_4, 1 in Vglut2_3); none is a cell that never
    returns below 0, and the table is longer by 0.3 to 5.2 s in each. The outputs do not show which convention
    gives these 12 values.
  deviations:
  - Decay length computed from the deposited -5 to +120 s ejaculation traces under the claims file's three
    readings; the deposited precomputed values are shown as well.
  - Assumed, the paper not saying it, that a trace that never falls below 0 after the peak has a decay
    length of 120 s, the full window, because the deposited table (male_analysis_magnitude.csv, Ejaculation_decay_length_seconds)
    holds 120 for each of the 44 such cells. The outcome depends on it; the time to the end of the window
    and leaving the cells out are shown and give p = 0.111 and 0.299.
