- claim: fig1gh-transitions-isolation
  outcome: reproduced
  notebook: reproduce_ishii_2025.ipynb
  output: claim:fig1gh-transitions-isolation
  notes: Isolation zone entries per 10 min 6.40 (control), 5.33 (pre), 1.79 (post); RM ANOVA F(2,16) =
    10.888, p = 0.00104; Tukey post against pre p = 0.0142, control against post p = 0.0015. Average isolation
    visit 47.1, 128.6 and 389.1 s; F(2,16) = 14.344, p = 0.00027; Tukey 0.0057 and 0.0004. All equal the
    legend. Visits to either zone per 10 min give the same pattern (F = 6.714, p = 0.0076; 0.0210 and
    0.0114). The total time in the isolation zone per 10 min, not the legend's quantity, does not differ
    between pre and post (Tukey p = 0.777).
  deviations:
  - Transitions are the code's isolation zone entries per 10 min (Figure 1.ipynb); the legend's "transitions
    between the zones" read as visits to either zone, counted from merge_df, is shown as a variant, since
    the table's Number_of_Entry_per_10min is empty for the control trial.
  - Average time in the isolation zone is the mean visit duration per animal and epoch from merge_df,
    as Figure 1.ipynb computes it; the column Time_in_Isolation_zone_per_10min holds the same values.
- claim: fig1i-latency-return
  outcome: reproduced
  notebook: reproduce_ishii_2025.ipynb
  output: claim:fig1i-latency-return
  notes: Mean latency 438.3 s after ejaculation, 105.2 s after sniff, 159.5 s after mount; RM ANOVA F(2,16)
    = 11.870, p = 0.000691; Tukey ejaculation against sniff p = 0.0016 and against mount p = 0.0077, as
    in the legend. Four of nine ejaculation latencies and one mount latency are at the 600 s cap.
- claim: fig1jm-behaviors-after-ejaculation
  outcome: reproduced
  notebook: reproduce_ishii_2025.ipynb
  output: claim:fig1jm-behaviors-after-ejaculation
  notes: Mounting and intromission fall to 0 in all 9 mice (Wilcoxon p = 0.0039 exact, the legend's value);
    grooming rises in 7 of 9 (3.50 to 13.54 per 10 min; p = 0.0234 exact, 0.0251 with the normal approximation
    that gives the legend's 0.025061844); sniffing does not change (p = 0.652 exact, 0.594 approximate).
    Pairing by row order, as the code does, gives the same p-values.
  deviations:
  - Pairs are matched by animal id, where the code pairs by row order; scipy 1.18 chooses exact or approximate
    p-values itself, so both are shown.
- claim: fig1nt-natural-estrus
  outcome: reproduced
  notebook: reproduce_ishii_2025.ipynb
  output: claim:fig1nt-natural-estrus
  notes: Transitions F(2,10) = 7.542, p = 0.0101 (Tukey post against pre p = 0.0038); average isolation
    time F(2,10) = 15.714, p = 0.00082; latency F(2,10) = 38.364, p = 2.04e-05. Sniffing, mounting and
    intromission are lower after ejaculation in all 6 mice (p = 0.03125 exact, 0.0277 approximate); grooming
    p = 0.4375 exact and 0.3452 approximate (the legend's value), not significant.
- claim: fig1s1-experience
  outcome: reproduced
  notebook: reproduce_ishii_2025.ipynb
  output: claim:fig1s1-experience
  notes: Pre-ejaculation epoch, 6 virgin and 6 experienced females. Isolation zone entries 2.42 against
    6.36 per 10 min, Mann-Whitney p = 0.0411, so virgin females make fewer entries. Average isolation
    visit 545.8 against 72.0 s from the visit table (p = 0.0411), and 582.4 against 72.0 s in the column
    Figure S1.ipynb tests (p = 0.0260, the legend's value).
  deviations:
  - The legend's "average time spent in the isolation zone" is computed from the visit table (merge_df_virgin_SE.csv);
