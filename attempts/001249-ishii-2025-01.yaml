- claim: fig1gh-transitions-isolation
  outcome: reproduced
  notebook: reproduce_ishii_2025.ipynb
  output: claim:fig1gh-transitions-isolation
  notes: Isolation zone entries per 10 min 6.40 (control), 5.33 (pre), 1.79 (post); RM ANOVA F(2,16) =
    10.888, p = 0.00104; Tukey post against pre p = 0.0142, control against post p = 0.0015. Average isolation
    visit 47.1, 128.6 and 389.1 s; F(2,16) = 14.344, p = 0.00027; Tukey 0.0057 and 0.0004. All equal the
    legend. Visits to either zone per 10 min give the same pattern (F = 6.714, p = 0.0076; 0.0210 and
    0.0114). The total time in the isolation zone per 10 min, not the legend's quantity, does not differ
    between pre and post (Tukey p = 0.777).
  deviations:
  - Transitions are the code's isolation zone entries per 10 min (Figure 1.ipynb); the legend's "transitions
    between the zones" read as visits to either zone, counted from merge_df, is shown as a variant, since
    the table's Number_of_Entry_per_10min is empty for the control trial.
  - Average time in the isolation zone is the mean visit duration per animal and epoch from merge_df,
    as Figure 1.ipynb computes it; the column Time_in_Isolation_zone_per_10min holds the same values.
- claim: fig1i-latency-return
  outcome: reproduced
  notebook: reproduce_ishii_2025.ipynb
  output: claim:fig1i-latency-return
  notes: Mean latency 438.3 s after ejaculation, 105.2 s after sniff, 159.5 s after mount; RM ANOVA F(2,16)
    = 11.870, p = 0.000691; Tukey ejaculation against sniff p = 0.0016 and against mount p = 0.0077, as
    in the legend. Four of nine ejaculation latencies and one mount latency are at the 600 s cap.
- claim: fig1jm-behaviors-after-ejaculation
  outcome: reproduced
  notebook: reproduce_ishii_2025.ipynb
  output: claim:fig1jm-behaviors-after-ejaculation
  notes: Mounting and intromission fall to 0 in all 9 mice (Wilcoxon p = 0.0039 exact, the legend's value);
    grooming rises in 7 of 9 (3.50 to 13.54 per 10 min; p = 0.0234 exact, 0.0251 with the normal approximation
    that gives the legend's 0.025061844); sniffing does not change (p = 0.652 exact, 0.594 approximate).
    Pairing by row order, as the code does, gives the same p-values.
  deviations:
  - Pairs are matched by animal id, where the code pairs by row order; scipy 1.18 chooses exact or approximate
    p-values itself, so both are shown.
- claim: fig1nt-natural-estrus
  outcome: reproduced
  notebook: reproduce_ishii_2025.ipynb
  output: claim:fig1nt-natural-estrus
  notes: Transitions F(2,10) = 7.542, p = 0.0101 (Tukey post against pre p = 0.0038); average isolation
    time F(2,10) = 15.714, p = 0.00082; latency F(2,10) = 38.364, p = 2.04e-05. Sniffing, mounting and
    intromission are lower after ejaculation in all 6 mice (p = 0.03125 exact, 0.0277 approximate); grooming
    p = 0.4375 exact and 0.3452 approximate (the legend's value), not significant.
- claim: fig1s1-experience
  outcome: reproduced
  notebook: reproduce_ishii_2025.ipynb
  output: claim:fig1s1-experience
  notes: Pre-ejaculation epoch, 6 virgin and 6 experienced females. Isolation zone entries 2.42 against
    6.36 per 10 min, Mann-Whitney p = 0.0411, so virgin females make fewer entries. Average isolation
    visit 545.8 against 72.0 s from the visit table (p = 0.0411), and 582.4 against 72.0 s in the column
    Figure S1.ipynb tests (p = 0.0260, the legend's value).
  deviations:
  - The legend's "average time spent in the isolation zone" is computed from the visit table (merge_df_virgin_SE.csv);
    Figure S1.ipynb tests the column Time_in_Isolation_zone_per_10min, shown as the second reading. Both
    are significant with virgin females higher.
- claim: fig1s2-novel-male
  outcome: reproduced
  notebook: reproduce_ishii_2025.ipynb
  output: claim:fig1s2-novel-male
  notes: Isolation zone entries fall from 2.33 to 0.43 per 10 min (6 of 7 lower, none higher), Wilcoxon
    p = 0.0312 exact and 0.0273 approximate (the legend's 0.027281171). Average isolation visit 595.7
    to 1627.8 s (6 of 7 higher), p = 0.0312 exact and 0.0277 approximate. The code's column, interaction
    zone entries, gives the same p-values.
  deviations:
  - The legend (panel B) names entries into the isolation zone; Figure S2.ipynb tests Interaction_zone_entry.
    The legend's column is the main reading and the code's a variant; they agree.
- claim: fig3d-mpn-fos
  outcome: reproduced
  notebook: reproduce_ishii_2025.ipynb
  output: claim:fig3d-mpn-fos
  notes: Recomputed from the per-cell HCR table (365002 cells, 10 mice). MPN Fos+ share 0.170 against
    0.090, t(8) = -4.2709, Bonferroni p = 0.0136; MPA t(8) = -1.8413, p = 0.514; BNST, LPO, VLPO p = 1.
    These equal the legend. The per-mouse means equal the deposited per-section table to 4e-10.
- claim: fig3i-vgat-vglut2-fos
  outcome: reproduced
  notebook: reproduce_ishii_2025.ipynb
  output: claim:fig3i-vgat-vglut2-fos
  notes: Exclusive populations (the code's table). Vgat Fos+ share 0.132 to 0.235, t(8) = -3.5361, Bonferroni
    p = 0.0153; Vglut2 0.095 to 0.160, t(8) = -3.3885, p = 0.0190, the legend's values. After ejaculation
    Vgat 0.235 against Vglut2 0.160 (no test, as in the paper). With inclusive populations both are significant
    (0.0131, 0.0091) and Vgat stays higher (0.251 against 0.209).
  deviations:
  - The paper does not say whether a cell called both Vgat+ and Vglut2+ (5013 of 68807 MPN cells) belongs
    to either population. The table Figure S5.ipynb reads counts only cells with one of the two, which
    the per-cell data reproduce to 4e-10; this is followed, as the code settles what the Methods leave
    open (protocol, reader step 2), and the inclusive populations are shown. The outcome is the same under
    both.
- claim: fig3jm-cell-types
  outcome: reproduced
  notebook: reproduce_ishii_2025.ipynb
  output: claim:fig3jm-cell-types
  notes: Vgat subsets with Calcr (Bonferroni p = 0.0318), Gal (0.0174) and Prlr (0.0212) and the Vglut2
    Calcr subset (0.0146) rise after ejaculation; the other Vglut2 subsets do not (0.104 to 0.822), so
    the "only Calcr" part holds. Clusters Vglut2+ 0.0189, Vgat+ 0.0022, Gal+ 0.0265, Nts+ 0.377. All equal
    the legend. Inclusive populations give the same pattern (Vglut2 Calcr 0.0044, other Vglut2 subsets
    0.0706 to 0.413). The Calcr+ cluster has 4 post-ejaculatory mice, as one has no cell in it.
  deviations:
  - Exclusive Vgat and Vglut2 populations as in fig3i-vgat-vglut2-fos, with the inclusive ones shown.
  - The cluster names come from the deposited Seurat table; the step that names the clusters is not in
    the paper's code, so the clustering was not run again.
- claim: fig4h-response-magnitude
  outcome: reproduced
  notebook: reproduce_ishii_2025.ipynb
  output: claim:fig4h-response-magnitude
  notes: Vgat against Vglut2, Bonferroni over six; ejaculation 2.11 against 0.85, t(791) = 3.998, p =
    0.00042; sniff t = 6.463, p = 1.08e-09; anogenital sniffing t = 6.644, p = 3.4e-10; mount t = 0.337
    and intromission t = -0.320, p = 1. All equal the legend. Grooming t = -7.252, Vgat lower, against
    the Results sentence, as the claims file notes; it is left out of the outcome. With the rescaled 200-frame
    arrays the same three differ and mount does not (p = 0.106). The cells come from 6 Vgat and 4 Vglut2
    mice; with animal means as units no behavior differs after Bonferroni correction (ejaculation 2.23
    against 0.88, t = 1.483, p = 0.176; sniff p = 0.440; anogenital sniffing p = 0.141; grooming p = 0.019,
    corrected 0.114), so the outcome rests on cells as units, as in the paper and the criterion. For the
    five behaviors other than ejaculation the test checks the authors' deposited magnitudes, not a computation
    from traces.
  deviations:
  - The ejaculation magnitude is recomputed from the -5 to +120 s trace (it equals the table to 5e-9).
    For the other five behaviors the magnitudes come from the deposited table, because the traces the
    Methods compute them from are not deposited; the deposited 200-frame arrays are rescaled and do not
    give the table's magnitudes (r = 0.53 to 0.89).
  - The Methods' exclusion of sniffs after the first mount could not be checked, as it happens before
    the deposited table and the code that does it is not in the repository.
- claim: fig4i-ejaculation-responders
  outcome: reproduced
  notebook: reproduce_ishii_2025.ipynb
  output: claim:fig4i-ejaculation-responders
  measured:
  - 184
  - 35
  - 29
  - 1
  notes: Ejaculation 184/522 Vgat against 35/271 Vglut2 (Bonferroni p = 1.5e-10), sniff 29/522 against
    1/271 (p = 0.0017), the legend's counts and p-values. Every animal has ejaculation responders (5 to
    55); 26 of the 29 Vgat sniff responders come from one animal (Vgat_4). With a threshold of 1.5 or
    2.5 the Vgat proportion stays higher for both behaviors. With animals as units the ejaculation responder
    fraction is 0.373 (Vgat) against 0.146 (Vglut2), t-test p = 0.104 and Mann-Whitney p = 0.038, and
    the sniff fraction 0.050 against 0.007 (p = 0.46 and 0.694).
  deviations:
  - Magnitudes as in fig4h-response-magnitude.
