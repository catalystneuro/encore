- claim: fig6k-late-cluster-vgat
  outcome: reproduced
  notebook: reproduce_ishii_2025.ipynb
  output: claim:fig6k-late-cluster-vgat
  measured:
  - 0
  - 37
  notes: 4 components at the scree elbow; the silhouette is largest at 5 clusters and 30 neighbours (0.474)
    for seeds 0 to 4, with labels equal to the deposited ones (adjusted Rand 1.0). The late cluster (mean
    peak at 48.5 s, longest decay under readings a and c) holds 37 of 184 Vgat and 0 of 35 Vglut2 cells,
