    c) holds 37 of 184 Vgat and 0 of 35 Vglut2 cells, Bonferroni p = 0.0181; the fast cluster holds 16
    of 35 Vglut2 against 26 of 184 Vgat cells, p = 6.8e-05, the legend's values. At the paper's stated
    55 neighbours (silhouette 0.461, not 0.405) the late cluster holds 33 Vgat and 0 Vglut2 cells (p =
    0.0328). The late cluster's 37 Vgat cells come from 5 of 6 Vgat mice, 27 from Vgat_2. The cluster
    whose mean trace peaks earliest (1.9 s, against 5.8 s for type 1) holds 41/184 Vgat and 5/35 Vglut2
    cells (Bonferroni p = 1); it is the paper's Type 5, the negative response type (46 cells, 41 Vgat and
    5 Vglut2, in the Figure 6 legend), not a candidate fast type, while type 1 has the legend's 42 cells
    (26 Vgat, 16 Vglut2) of the type the Results call fast response. At 55 neighbours
    the late cluster's 33 Vgat cells are outside the tolerance of 37 +/- 3.7.
  deviations:
  - The clustering selects 30 neighbours, as the paper's code printed, where the Methods state 55; both
    are shown.
  - The code fixes no seed; seed 0 is a standard choice and seeds 1 to 4 give the same labels.
  - The late cluster is identified as the one whose mean trace peaks latest. The fast cluster is type
    1, the cluster with the largest mean 0 to 5 s response, because the code numbers the clusters that
    way (reorder_clusters in Figure 5 Spectral clustering.ipynb, which averages frames before_frames to
    2 x before_frames) and the paper's type numbers are the code's; the cluster whose mean peaks earliest
    is shown as a variant. The paper's labels support the choice, as the Results call type 1 the fast
    response type and type 5 the negative response type, and the Figure 6 legend's counts (Type 1, 42
    cells, 26 Vgat and 16 Vglut2; Type 5, 46 cells, 41 and 5) are those of type 1 and of the
    earliest-peak cluster.
  - The number of components follows the code's elbow rule, np.argmin of the rotated scree plot used as
    a count (transformed_data[:, :num_retained_pcs]), which keeps the components before the elbow; it
    gives 4, the code's printed value and the Methods' number.
