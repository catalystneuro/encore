findings:
- kind: metadata_error
  statement: Each NWB file stores the z planes of a brain as the frames of an ImageSeries (acquisition/TRAP
    and acquisition/background) with starting_time rate 4.0, the z step in micrometres given as a sampling
    rate, resolution 3.6 and unit "lumen". No voxel size, orientation, channel wavelength or description
    is given; the descriptions are "no description".
- kind: data_missing
  statement: The dandiset holds only the raw volumes of Figure 2. The registration to the atlas, the cell
    segmentation, the per-region counts and densities, and the trained ilastik classifier are not in it,
    so none of the Figure 2 results can be computed without rerunning the whole pipeline, and the classifier,
    trained on manual labels, cannot be rebuilt as it was. The per-region densities are only on Figshare
    (tdTomato_summary.csv), with no link to the volumes.
- kind: other
  statement: The volumes are stored uncompressed and unchunked, 1.38 TB for 14 brains. At the 35.5 to
    67.4 MB/s measured in runs of this notebook, streaming the TRAP channels once takes 2.8 to 5.4 h and
    both channels 5.7 to 10.8 h, which puts any analysis of Figure 2 out of reach of a streamed notebook. A
    full-width band of rows can be read in one range request (20.4 MB/s in the executed notebook), a crop
    only row by row (2.5 MB/s).
- kind: other
  statement: The five consummatory (Mount) brains have session start dates of 2024-02-07, a year after
    the appetitive and post-ejaculatory brains (2022-12 to 2023-06), and their middle-plane TRAP intensities
    are lower (means 20 to 35 against 47 to 143). The dandiset does not say whether this is a separate
    imaging batch; it bears on the group comparisons of Figure 2.
- kind: metadata_error
  statement: In the Figure 1 tables on Figshare (group_df.csv, group_df_virgin_SE.csv) the column Time_in_Isolation_zone_per_10min
    holds the mean duration of an isolation zone visit in seconds (equal to the mean of merge_df to 4e-8),
    not a time per 10 min.
- kind: metadata_error
  statement: In the Figure 7 table (Figure 6 zip, group_df.csv) Average_Isolation_zone_duration is in
    frames (15 times Duration_second, up to 107887 in a 7200 s session) for three groups and in seconds
    for the consummatory hM3Dq group.
- kind: metadata_insufficient
  statement: The calcium imaging arrays named *_all_norm_zscore_snip_array.npy are not the traces the
    Methods compute magnitudes from; for ejaculation each cell's trace is divided by its SD over -5 to
    0 s, and their 0 to 5 s means do not give the deposited magnitudes (r = 0.53 to 0.89). Only the ejaculation
    trace from -5 to +120 s matches the Methods. The magnitudes of the other five behaviors can be taken
    only from the deposited table, and nothing describes the arrays.
- kind: methods_unavailable
  statement: The decay length of Figure 6C is defined in the Methods as "the time the z-scored signal
    was smaller than 0", and the code reads it precomputed. The deposited values equal the time from the
    peak after onset to the first sample below 0 for 207 of 219 cells, which gives the paper's result,
    while the time from onset to the first sample below 0, or the total time below 0, give Vgat no longer
    than Vglut2. The deposited table gives 120 s to each of the 44 responders whose trace never falls
    below 0 after the peak; with the time to the end of the window, or with these cells left out, Vgat
    is not longer at p < 0.05. The questions for the authors are whether the decay length is measured
    from the peak, what value a trace that never returns below 0 takes and why, and how the other 12 cells
    are computed.
- kind: paper_inconsistency
  statement: The Methods state that the spectral clustering chose 55 nearest neighbours with an average
    silhouette of 0.405; the paper's code printed 30 neighbours and 0.474, the deposited labels are those
    of 30 neighbours, and no setting with 5 clusters scores 0.405 (0.461 at 55).
- kind: paper_inconsistency
  statement: The Results give 177 ejaculation-specific and 46 mount-specific cells; the Figure 5 legend
    and the deposited data give 178 and 48.
- kind: code_mismatch
  statement: The Figure 7 and Figure 7-figure supplement 3 legends name a Wilcoxon rank sum test for the
    saline against CNO trials; the code runs the paired signed-rank test, and the reported p-values (0.03125
    for 8 mice) are those of the signed-rank test. With the rank-sum test the consummatory hM3Dq group
    also has fewer transitions (Bonferroni p = 0.0157).
- kind: code_mismatch
  statement: Figure 7-figure supplement 1G reports t(10) = 6.6154 and t(12) = 13.9477; these are the t
    values of a paired test with the degrees of freedom of an unpaired one, and the reported p-values
    are the paired p doubled.
- kind: paper_inconsistency
  statement: Figure 7-figure supplement 1B and C give 14 post-ejaculatory mice; the deposited table holds
    15 (7 eYFP, 7 hM3Dq_Ejaculated, 1 hM3Dq_Post_ejaculatory), as F(2,24) requires. The legend of panel
    D says the appetitive-hM3Dq and post-ejaculatory-hM3Dq groups were used, while the post-ejaculatory
    group of panel G holds 4 eYFP and 3 hM3Dq mice.
- kind: selection_undocumented
  statement: In the HCR analysis of Figure 3, the Vgat and Vglut2 populations count only cells with one
    of the two calls; 5013 of 68807 MPN cells with both are left out. The paper does not say so; the per-cell
    table shows it.
- kind: code_mismatch
  statement: Figure 1-figure supplement 2B is the number of entries in the isolation zone per the legend;
    Figure S2.ipynb tests Interaction_zone_entry. The two give the same p-value.
- kind: metadata_insufficient
  statement: The NWB files do not give each brain's orientation in the stack. The Figure 2 subject table
    on Figshare (meta/metainfo.csv) does (Anterior_top, Ventral_first; the two differ between brains),
    and links each brain to the mouse ID and group of the density table through experiment_id, which matches
    the dandiset's subject names.
- kind: paper_inconsistency
  statement: In the Figure 7-figure supplement 2H to 2J legend, the place-preference p-values for post-ejaculatory-hM3Dq
    against appetitive-hM3Dq (1, 1 and 0.8472) are not those the Mann-Whitney test with Bonferroni over
    three comparisons gives on the deposited table (0.162, 0.696 and 0.0615), which are the values Figure
    S10.ipynb prints; the comparisons with eYFP match. None is significant either way.
