- claim: tables1-dg-ca-similar
  outcome: partially_reproduced
  notebook: reproduce_dijk_2018.ipynb
  output: claim:tables1-dg-ca-similar
  measured:
  - 0.95
  - 0.85
  - 0.83
  - 0.79
  - 0.54
  - 0.63
  notes: No property differs between DG and CA by ANOVA, Welch's ANOVA or Kruskal-Wallis (smallest p 0.19).
    Firing rates (DG 0.95, CA 0.85 AP/s) are within tolerance. Information content matches as bits per
    spike (1.32 and 1.34, against 1.31 and 1.30 labelled bits/s) but not as bits per second (0.83 and
    0.79). Coherence (0.54 and 0.63) is above the tolerance of 0.46 and 0.51. The mean ISI of the table
    (5.77 ms) is not what the files give for a mean ISI (3858 ms), so that row measures something else.
    Waveform width and theta phase cannot be computed, as the data set holds no waveforms or LFP.
  deviations:
  - Rate maps use 32 x 32 bins of 8 tracker pixels, the grid of the data set's own maps (data/TIME, data/SPIKE,
    1024 values; '_4' files with SCALE 8). The paper's 1.5 cm/pixel (STAR Methods, Recording set up) is
    about 1.4 cm in the arena and 2 cm in the environment boxes on this grid.
  - Information content is Skaggs information on visited bins; coherence is Muller and Kubie's neighbour
    correlation, Fisher z, on unsmoothed maps (standard measures, as the paper names but does not define
    them).
  - Table S1 labels information content bits/s, but its values match bits per spike in these data; both
    are shown.
