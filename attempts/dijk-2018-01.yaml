- claim: fig1-single-field-proportion
  outcome: not_reproduced
  notebook: reproduce_dijk_2018.ipynb
  output: claim:fig1-single-field-proportion
  measured:
  - 57.8
  - 45.0
  notes: Under every reading of the rate map (unsmoothed M2 a and b, the data set's smoothed maps, adopted,
    and our smoothing) and of the field rule (M5), the share of place cells with one field in the first standard
    session is 44 to 67% in DG and 35 to 55% in CA, against 64 and 75%; no reading puts both within tolerance,
    as CA stays below 67.5%. On the data set's smoothed maps few cells have no field (2 of 45 DG and 1 of 20
    CA under M5 a); DG is 57.8% (M5 a) or 66.7% (M5 b), within tolerance, and CA 45.0 or 55.0%. The regions
    do not differ (p 0.34 to 0.68) except with our smoothing and M5 a (p = 0.042). Measured values are for
    the adopted smoothed maps with M5 a, the first M5 reading.
  deviations:
  - Rate maps use 32 x 32 bins of 8 tracker pixels, the grid of the data set's own maps (data/TIME, data/SPIKE,
    1024 values; '_4' files with SCALE 8). The paper's 1.5 cm/pixel (STAR Methods, Recording set up) is about
    1.4 cm in the arena and 2 cm in the environment boxes on this grid.
  - Place fields follow the claims file's M5 readings (at least 9 edge-contiguous bins above 20% of the peak,
    or above 1 AP/s), found on smoothed maps. M2 leaves smoothing open; the data set's own smoothed maps (RmSm),
    made by the authors and on the common grid for every environment session, are adopted, as the closest record
    of the maps the paper's fields were counted on. Unsmoothed maps (M2 a, b) and our 3 x 3 smoothing are shown.
    This replaces the unsmoothed maps of round 1, on which one-spike bins set the 20%-of-peak threshold (verifier,
    B1).
  - The first standard session of a day is its lowest-numbered circleintestbox session.
  assumed: true
- claim: fig1-field-number-scaling
  outcome: not_reproduced
  notebook: reproduce_dijk_2018.ipynb
  output: claim:fig1-field-number-scaling
  measured:
  - 1.51
  - 2.09
  - 1.45
  - 1.68
  notes: On the data set's smoothed maps with M5 a, the adopted reading, mean fields per cell are 1.51 (DG
    circular), 2.09 (DG removed), 1.45 and 1.68 (CA), against 1.48, 2.70, 1.19 and 2.0. Three are within tolerance;
    removed DG is below 2.70 ± 0.39 under every reading (at most 2.09). Under the adopted reading the condition
    effect is p = 0.026 (cell as random term). Fisher's LSD with the mixed model's pooled error puts removed
    DG above circular DG (p = 0.0042) and above circular CA (p = 0.036), and circular and removed CA do not
    differ (p = 0.45), the paper's pattern; paired and unpaired t tests, the earlier post hoc test, put removed
    DG above circular DG (p = 0.011) but not above circular CA (p = 0.071). Across readings the pooled-error
    LSD puts removed DG above circular CA only with M5 a on smoothed maps (p = 0.036 and 0.024; elsewhere p
    0.14 to 0.86). The outcome fails on the removed DG mean. Without the two sessions that fail the clock check
    the means are 1.50, 2.00, 1.45 and 1.61, condition p = 0.067.
  deviations:
  - Rate maps use 32 x 32 bins of 8 tracker pixels, the grid of the data set's own maps (data/TIME, data/SPIKE,
    1024 values; '_4' files with SCALE 8). The paper's 1.5 cm/pixel (STAR Methods, Recording set up) is about
    1.4 cm in the arena and 2 cm in the environment boxes on this grid.
  - Place fields follow the claims file's M5 readings (at least 9 edge-contiguous bins above 20% of the peak,
    or above 1 AP/s), found on smoothed maps. M2 leaves smoothing open; the data set's own smoothed maps (RmSm),
    made by the authors and on the common grid for every environment session, are adopted, as the closest record
    of the maps the paper's fields were counted on. Unsmoothed maps (M2 a, b) and our 3 x 3 smoothing are shown.
    This replaces the unsmoothed maps of round 1, on which one-spike bins set the 20%-of-peak threshold (verifier,
    B1).
  - Mixed models are statsmodels' REML linear mixed models with Wald F tests; their denominator df are not
    JMP's Kenward-Roger df (M12).
  - Fisher's LSD uses the pooled error of the mixed model with cell as random term (level means of the four
    region and condition groups and their covariance, residual df). Paired t tests within region and an unpaired
    t test across regions are shown beside it.
  assumed: true
