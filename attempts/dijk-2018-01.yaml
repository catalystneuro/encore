    1024 values; '_4' files with SCALE 8). The paper's 1.5 cm/pixel (STAR Methods, Recording set up) is about
    1.4 cm in the arena and 2 cm in the environment boxes on this grid.
  - Place fields follow the claims file's M5 readings on smoothed maps. Our 3 x 3 smoothing (weights 1, 0.5
    and 0.25, the centred kernel closest to the authors' smoothed maps) is adopted in the place avoidance task,
