findings:
- kind: data_missing
  statement: The data set holds wild-type mice only. The optogenetic experiments of Figure 2 (29 POMC-Halorhodopsin
    Cre+ and Cre- mice, behaviour and cFos counts) are not in it, and the paper names no other deposit.
- kind: data_missing
  statement: Sessions the paper describes are missing. WT15, WT16 and WT19 have one pretraining session where
    the paper gives two, and WT16 has no training 1 recording. The paper's df (H2,117 and H2,435) imply values
    that need these sessions; the data give 115 place cell values and 428 place cell-interneuron changes.
- kind: other
  about: data
  statement: The environment sessions 140731_WT15_testbox1 and 140731_WT15_testbox2 have the same position
    series, and three of the four listed units' spike trains begin with the same 20 spike times; two of the
    four listed units have identical trains, the other two differ in count (4371 against 4308 and 2615 against
    2745 spikes), and the headers give different FIRST_TIMESTAMP values (11095 and 15235). They appear to be
    two sortings of one recording, and only one is counted. testbox1, the copy kept, fails the clock check
    (split-half map correlation no higher than with positions shifted by 60 s).
- kind: metadata_error
  statement: The Tracker files of the recordings of WT15 (after training 1 and 2) and WT16 (after training
    2 and conflict) log a shock zone and 1 to 33 shocks with nonzero current, where the paper says recordings
    were made with the shock off. The WT15 training 2 recording is also deposited among the shock-on files
    (identical CRC), and WT16's conflict recording is named Conf1_1 in the TS files and Conf1_2 in its Tracker
    file. WT15's only training 2 Tracker file is 20 min long, where training 2 lasted 10 min, and holds one
    entrance.
- kind: other
  about: data
  statement: For WT15, WT16 and WT19 the conflict shock zone (centre 305 degrees) is 170 degrees from the training
    zone (135 degrees), where the paper says the zone was relocated 180 degrees; for WT20, WT26 and WT27 it
    is 180.
- kind: metadata_error
  statement: The data descriptor says the Spike and Time maps hold 256 x 256 pixels written as one column;
    most hold 1024 values, a 32 x 32 grid of 8 tracker pixels, and the place avoidance maps of WT15Hab1, WT16Hab1,
    150720_WT19Ini1_2 and 150720_WT19Conf1_2 hold 1681 values, a 41 x 41 grid whose mapping to tracker pixels
    is not stated and could not be recovered exactly. On the 32 x 32 grid a bin is about 1.4 cm in the arena
    and 2 cm in the environment boxes, where the paper gives 1.5 cm/pixel. The plain spike-count maps are close
    to, but not the same as, maps made from the TS files (median r 0.988 and 0.985).
- kind: metadata_insufficient
  statement: The data set holds smoothed maps (files ending RmSm and ArSm) without a description of the smoothing
    (a least-squares fit shows it acts like a sum over about 2 x 2 bins, shifted by half a bin; the smoothed
    dwell time totals 4.5 times the plain one), and the TS file variants (Rm, Ar, _4, .times, 0spks, test-fix,
    and a misnamed file 151215_WT26Ini2_2_spikes_cl-fix.P1C1Rm151215_WT26Ini2_2_spikes_cl-fix.P1C1Rm) are not
    described; the meaning of each was inferred from the headers and by comparing files.
- kind: other
  about: data
  statement: The WT19 pretraining session lasts 30 min, where the paper gives 20-min pretraining sessions.
    Environment sessions last 10, 20 or 30 min, which the paper does not state.
- kind: metadata_insufficient
  statement: The files do not say how clusters were matched across the sessions of a day; the class lists give
    one entry per cell for the day, and this attempt assumes that a tetrode and cluster name is the same unit
    in every session.
- kind: paper_inconsistency
  statement: Table S1 and Table S2 label information content in bits/s, but their values match Skaggs information
    in bits per spike computed from the files (DG 1.32 against 1.31; pretraining 1.59 against 1.6), not bits
    per second (0.83 and 1.15). The mean ISI of the tables (5 to 6 ms) is not the mean interspike interval
    of these cells (seconds).
- kind: methods_unavailable
  statement: The paper does not define a place field or say whether its rate maps were smoothed. On unsmoothed
    maps with the claims file's field rules many cells have no field. On the authors' deposited smoothed maps
    few have none and three of the four field means of Figure 1 are within tolerance, but the single-field
    share of CA cells (45 to 55% against 75%) and the field count of removed DG cells (2.09 against 2.70) stay
    below the paper's. Question for the authors, which smoothing and which field rule (threshold, minimum size,
    contiguity) were used, and were the deposited RmSm and ArSm maps the ones analysed?
- kind: methods_unavailable
  statement: The paper does not say which session pairs form the shock addition and shock relocation comparisons.
    This attempt adopts every pretraining-training pair for addition and both training sessions against conflict
    for relocation; several outcomes (fig3d whole-cell, fig5d2, figs2bc at 20 ms, fig5d3, the Figure 6 rate change
    insets) hold under this reading
    and not under the adjacent-session reading. Question for the authors, which pairs were used?
- kind: methods_unavailable
  statement: The size of location x in Ipos is not stated; Figure 4B and the Figure 4D map correlation hold
    with 8-pixel bins and not with 16-pixel blocks. The 5-s episodes of overdispersion and network consistency,
    the meaning of overlapping firing fields, and the statistical criteria classing place cell-interneuron
    pairs as positive, negative or independent are not stated either. Questions for the authors, the location
    size, whether episodes tile the session or follow field entries, and the test used to class pairs (the
    Kruskal-Wallis df for the classes imply more values than pairs times manipulations).
