- claim: fig1-single-field-proportion
  outcome: not_reproduced
  notebook: reproduce_dijk_2018.ipynb
  output: claim:fig1-single-field-proportion
  measured:
  - 44.4
  - 50.0
  notes: Under every reading of the field rule (M5) and of the rate map (M2), the share of place cells
    with one field in the first standard session is 44 to 62% in DG and 45 to 55% in CA, against 64 and
    75%; no reading puts both within tolerance. The regions do not differ (p 0.34 to 0.68), as in the
    paper. Many cells have no field under the claims file's rules (7 to 19 of 45 DG cells), so the result
    rests on the M5 assumption, which does not fit these unsmoothed maps. Values are 44.4% (DG) and 50.0%
    (CA) under M2 (a) and M5 (a), the first readings.
  deviations:
  - Rate maps use 32 x 32 bins of 8 tracker pixels, the grid of the data set's own maps (data/TIME, data/SPIKE,
    1024 values; '_4' files with SCALE 8). The paper's 1.5 cm/pixel (STAR Methods, Recording set up) is
    about 1.4 cm in the arena and 2 cm in the environment boxes on this grid.
  - Place fields follow the claims file's M5 readings (at least 9 edge-contiguous bins above 20% of the
    peak, or above 1 AP/s) on unsmoothed maps (M2); the paper gives no field definition, and on these
    maps many cells have no field.
  - The first standard session of a day is its lowest-numbered circleintestbox session.
  assumed: true
- claim: fig1-field-number-scaling
  outcome: not_reproduced
  notebook: reproduce_dijk_2018.ipynb
  output: claim:fig1-field-number-scaling
  measured:
  - 0.71
  - 0.74
  - 0.77
  - 1.24
  notes: Mean fields per cell are 0.71 to 1.20 (DG, circular) and 0.74 to 1.47 (DG, removed) against 1.48
    and 2.70, and no reading of M5 and M2 puts the four means within tolerance. Field numbers do rise
    after removal under some readings (condition p 0.001 to 0.18 with cell as random term), but the post
    hoc pattern of the paper (removed DG above circular DG and CA) is not found in any reading (p 0.10
    to 0.99). Measured values are for M2 (a) and M5 (a).
  deviations:
  - Rate maps use 32 x 32 bins of 8 tracker pixels, the grid of the data set's own maps (data/TIME, data/SPIKE,
    1024 values; '_4' files with SCALE 8). The paper's 1.5 cm/pixel (STAR Methods, Recording set up) is
    about 1.4 cm in the arena and 2 cm in the environment boxes on this grid.
  - Place fields follow the claims file's M5 readings (at least 9 edge-contiguous bins above 20% of the
    peak, or above 1 AP/s) on unsmoothed maps (M2); the paper gives no field definition, and on these
    maps many cells have no field.
  - Mixed models are statsmodels' REML linear mixed models with Wald F tests; their denominator df are
    not JMP's Kenward-Roger df (M12).
  - Post hoc comparisons are paired t tests within region and an unpaired t test across regions (Fisher's
    LSD without the pooled error of the mixed model).
  assumed: true
- claim: fig1b-stability-dg-below-ca-removal
  outcome: reproduced
  notebook: reproduce_dijk_2018.ipynb
  output: claim:fig1b-stability-dg-below-ca-removal
  notes: With one value per cell and manipulation (174 values), stability is higher in CA than in DG (mean
    z 0.42 against 0.31; region F = 8.73, p = 0.0036), differs by manipulation (F = 9.98, p = 0.0001),
    and Fisher's LSD puts removal below replication (p = 0.0001) and relocation (p = 0.0002); the interaction
    is p = 0.76 (paper 0.77). Reading (b) of M2 gives the same (region p = 0.0011, manipulation p = 0.0004).
    The data set gives 174 cell and manipulation values against the 178 the paper's df imply.
  deviations:
  - Rate maps use 32 x 32 bins of 8 tracker pixels, the grid of the data set's own maps (data/TIME, data/SPIKE,
    1024 values; '_4' files with SCALE 8). The paper's 1.5 cm/pixel (STAR Methods, Recording set up) is
    about 1.4 cm in the arena and 2 cm in the environment boxes on this grid.
  - Every pair of sessions of a day of the paper's three conditions enters; diffcircle and transferbin
    sessions are left out, being none of the three versions. Stability is the maximum Pearson r over shifts
    of up to 2 bins, Fisher z (STAR Methods, Firing rate stability).
  - The environment session 140731_WT15_testbox2 duplicates testbox1 and is counted once.
