- claim: fig3b-avoidance-learning
  outcome: not_reproduced
  notebook: reproduce_dijk_2018.ipynb
  output: claim:fig3b-avoidance-learning
  notes: Errors fall from training 1 (mean 14.0) to training 2 (4.33) and rise in conflict (19.0), and paired
    comparisons put training 2 below training 1 (p = 0.028) and conflict (p = 0.042), but the criterion's test
    fails. The multivariate repeated-measures test whose df match the paper's (2, 4) gives F = 5.70, p = 0.067,
    against F = 18.2, p = 0.01. It also fails with WT15's 20-min training 2 file counted over its first 10
    min (p = 0.067) and with WT15 left out (F(2, 3) = 3.37, p = 0.17). The univariate test, whose df do not
    fit six mice, gives F(2, 10) = 4.62, p = 0.038.
  deviations:
  - Errors are the Tracker's entrances in the shock-on files (avoidance state from 0 to 1). WT15 has no separate
    10-min training 2 shock-on file; its 20-min file deposited among the shock-on files is used.
  - The criterion's reading (a), the multivariate test whose df (2, 4) match the paper's, decides; reading
    (b) is shown.
  - 'Variants for WT15, whose only training 2 file is 20 min long: its errors in the first 10 min, and the
    analysis without WT15.'
- claim: fig3b-shock-off-avoidance
  outcome: not_reproduced
  notebook: reproduce_dijk_2018.ipynb
  output: claim:fig3b-shock-off-avoidance
  notes: Errors in the shock-off recordings (means 31.6, 21.5 and 62.4) are higher than in the shock-on sessions
    (14.0, 4.33 and 19.0); with mouse as random term the shock status effect is F = 22.3, p = 0.0001 for errors
    and F = 9.79, p = 0.004 for errors per meter, which also has an interaction (p = 0.024). The effect stays
    without the four shock-off recordings whose Tracker files log shocks (errors p < 0.0001, errors per meter
    p = 0.0005), with shock-off errors counted by the 100-ms rule that matches the Tracker's count on shock-on
    files (median ratio 1.00; p = 0.0002 and 0.0095), and with both (p < 0.0001 and 0.0015).
  deviations:
  - Shock-off errors are entrances of the room-frame position into the zone of the preceding shock-on session,
    as the shock-off Tracker files hold no zone; this geometric count gives 1.18 times the Tracker's count
    on shock-on files. A variant counts an entrance only after at least 100 ms outside the zone, which gives
    a median ratio of 1.00 to the Tracker's count on the shock-on files.
  - The Tracker files of four shock-off recordings (WT15 training 1 and 2, WT16 training 2 and conflict) log
    shocks; a variant leaves them out, which also removes WT15's training 2 file from the shock-off level,
    where it duplicated the shock-on file.
  - Mixed models are statsmodels' REML linear mixed models with Wald F tests; their denominator df are not
    JMP's Kenward-Roger df (M12).
  - The data set lacks a second pretraining session for WT15, WT16 and WT19 and the training 1 recording of
    WT16, so manipulations with those sessions have fewer values than the paper's df imply.
- claim: speed-no-difference
  outcome: reproduced
  notebook: reproduce_dijk_2018.ipynb
  output: claim:speed-no-difference
  notes: Over training 1, training 2 and conflict in the shock-off recordings (5, 6 and 5 mice) the one-way
    ANOVA gives F(2, 13) = 1.94, p = 0.18, the paper's df and values. The shock-on sessions give p = 0.89.
    The readings with pretraining as a level differ (p = 0.0016 and 0.021), as mice run faster in pretraining
    (4.96 cm/s against 2.4 to 3.5).
  deviations:
  - The criterion leaves the sessions open. The reading of training 1, training 2 and conflict in the shock-off
    recordings is adopted, as its design (5, 6 and 5 mice) gives the paper's df (2, 13); every reading is shown.
  - Speed is the path length of positions sampled each second over the session's duration; it gives 0.81 to
    0.91 times the Tracker's ElapsedPath.
  assumed: true
