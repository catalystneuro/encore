findings:
- kind: data_missing
  statement: The data set holds wild-type mice only. The optogenetic experiments of Figure 2 (29 POMC-Halorhodopsin
    Cre+ and Cre- mice, behaviour and cFos counts) are not in it, and the paper names no other deposit.
- kind: data_missing
  statement: Sessions the paper describes are missing. WT15, WT16 and WT19 have one pretraining session
    where the paper gives two, and WT16 has no training 1 recording. The paper's df (H2,117 and H2,435)
    imply values that need these sessions; the data give 115 place cell values and 428 place cell-interneuron
    changes.
- kind: other
  about: data
  statement: The environment session 140731_WT15_testbox2 has the same position series as 140731_WT15_testbox1,
    and two of its four listed units have the same spike trains; it appears to be deposited twice. It
    is counted once.
- kind: metadata_error
  statement: The Tracker files of the recordings of WT15 (after training 1 and 2) and WT16 (after training
    2 and conflict) log a shock zone and 1 to 33 shocks with nonzero current, where the paper says recordings
    were made with the shock off. The WT15 training 2 recording is also deposited among the shock-on files
    (identical CRC), and WT16's conflict recording is named Conf1_1 in the TS files and Conf1_2 in its
    Tracker file.
- kind: other
  about: data
  statement: For WT15, WT16 and WT19 the conflict shock zone (centre 305 degrees) is 170 degrees from
    the training zone (135 degrees), where the paper says the zone was relocated 180 degrees; for WT20,
    WT26 and WT27 it is 180.
- kind: metadata_error
  statement: The data descriptor says the Spike and Time maps hold 256 x 256 pixels written as one column;
    they hold 1024 values, a 32 x 32 grid of 8 tracker pixels. On that grid a bin is about 1.4 cm in the
    arena and 2 cm in the environment boxes, where the paper gives 1.5 cm/pixel.
- kind: metadata_insufficient
  statement: The data set holds smoothed maps (files ending RmSm and ArSm) without a description of the
    smoothing, and the TS file variants (Rm, Ar, _4, .times, 0spks, test-fix, and a misnamed file 151215_WT26Ini2_2_spikes_cl-fix.P1C1Rm151215_WT26Ini2_2_spikes_cl-fix.P1C1Rm)
    are not described; the meaning of each was inferred from the headers and by comparing files.
- kind: other
  about: data
  statement: The WT19 pretraining session lasts 30 min, where the paper gives 20-min pretraining sessions.
    Environment sessions last 10, 20 or 30 min, which the paper does not state.
- kind: metadata_insufficient
  statement: The files do not say how clusters were matched across the sessions of a day; the class lists
    give one entry per cell for the day, and this attempt assumes that a tetrode and cluster name is the
    same unit in every session.
- kind: paper_inconsistency
  statement: Table S1 and Table S2 label information content in bits/s, but their values match Skaggs
    information in bits per spike computed from the files (DG 1.32 against 1.31; pretraining 1.59 against
    1.6), not bits per second (0.83 and 1.15). The mean ISI of the tables (5 to 6 ms) is not the mean
    interspike interval of these cells (seconds).
- kind: methods_unavailable
  statement: The paper does not define a place field or say whether its rate maps were smoothed. On unsmoothed
    maps with the claims file's field rules many cells have no field, and field counts (Figure 1) and
    field rate changes (Figure 3D) do not reproduce. Question for the authors, which smoothing and which
    field rule (threshold, minimum size, contiguity) were used?
- kind: methods_unavailable
  statement: The paper does not say which session pairs form the shock addition and shock relocation comparisons.
    This attempt adopts every pretraining-training pair for addition and both training sessions against
    conflict for relocation; several outcomes (fig3d whole-cell, fig5d2, figs2bc at 20 ms, fig5d3) hold
    under this reading and not under the adjacent-session reading. Question for the authors, which pairs
    were used?
- kind: methods_unavailable
  statement: The size of location x in Ipos is not stated; Figure 4B and the Figure 4D map correlation
    hold with 8-pixel bins and not with 16-pixel blocks. The 5-s episodes of overdispersion and network
    consistency, the meaning of overlapping firing fields, and the statistical criteria classing place
    cell-interneuron pairs as positive, negative or independent are not stated either. Questions for the
    authors, the location size, whether episodes tile the session or follow field entries, and the test
    used to class pairs (the Kruskal-Wallis df for the classes imply more values than pairs times manipulations).
