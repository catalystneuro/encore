- claim: fig3b-avoidance-learning
  outcome: partially_reproduced
  notebook: reproduce_dijk_2018.ipynb
  output: claim:fig3b-avoidance-learning
  notes: Errors fall from training 1 (mean 14.0) to training 2 (4.33) and rise in conflict (19.0), and
    paired comparisons put training 2 below training 1 (p = 0.028) and conflict (p = 0.042). The multivariate
    repeated-measures test whose df match the paper's (2, 4) gives F = 5.70, p = 0.067, against F = 18.2,
    p = 0.01; the univariate test gives F(2, 10) = 4.62, p = 0.038.
  deviations:
  - Errors are the Tracker's entrances in the shock-on files (avoidance state from 0 to 1). WT15 has no
    separate 10-min training 2 shock-on file; its 20-min file deposited among the shock-on files is used.
  - The criterion's reading (a), the multivariate test whose df (2, 4) match the paper's, decides; reading
    (b) is shown.
- claim: fig3b-shock-off-avoidance
  outcome: not_reproduced
  notebook: reproduce_dijk_2018.ipynb
  output: claim:fig3b-shock-off-avoidance
  notes: Errors in the shock-off recordings (means 31.6, 21.5 and 62.4) are higher than in the shock-on
    sessions (14.0, 4.33 and 19.0); with mouse as random term the shock status effect is F = 22.3, p =
    0.0001 for errors and F = 9.79, p = 0.004 for errors per meter. Shock-off errors are counted geometrically,
    which gives 1.18 times the Tracker's count on shock-on files; that does not account for a two- to
    three-fold difference.
  deviations:
  - Shock-off errors are entrances of the room-frame position into the zone of the preceding shock-on
    session, as the shock-off Tracker files hold no zone; this geometric count gives 1.18 times the Tracker's
    count on shock-on files.
  - The Tracker files of the WT15 and WT16 recordings log shocks, so their shock-off values may not be
    shock-off.
  - Mixed models are statsmodels' REML linear mixed models with Wald F tests; their denominator df are
    not JMP's Kenward-Roger df (M12).
  - The data set lacks a second pretraining session for WT15, WT16 and WT19 and the training 1 recording
    of WT16, so manipulations with those sessions have fewer values than the paper's df imply.
- claim: speed-no-difference
  outcome: reproduced
  notebook: reproduce_dijk_2018.ipynb
  output: claim:speed-no-difference
  notes: Over training 1, training 2 and conflict in the shock-off recordings (5, 6 and 5 mice) the one-way
    ANOVA gives F(2, 13) = 1.94, p = 0.18, the paper's df and values. The shock-on sessions give p = 0.89.
    The readings with pretraining as a level differ (p = 0.0016 and 0.021), as mice run faster in pretraining
    (4.96 cm/s against 2.4 to 3.5).
  deviations:
  - The criterion leaves the sessions open. The reading of training 1, training 2 and conflict in the
    shock-off recordings is adopted, as its design (5, 6 and 5 mice) gives the paper's df (2, 13); every
    reading is shown.
  - Speed is the path length of positions sampled each second over the session's duration; it gives 0.81
    to 0.91 times the Tracker's ElapsedPath.
  assumed: true
