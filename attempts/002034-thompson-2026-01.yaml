findings:
- kind: code_mismatch
  statement: The code's include list already lacks units 43 and 65 of the legacy numbering (its unit_id
    runs 1 to 107 without them), and prepare_figure_analysis_tables.m (build_stats) then removes rows
    43 and 65 of its own 105-row table again, which drops CiCM101019d unit 1 and Ci_LC_d14_6mm_SC_123107
    unit 2. This is why the code's printed output has 61 Ci units and 50 Ci sessions for some analyses
    against the paper's 63 and 51.
- kind: code_mismatch
  statement: zscore_tables.m z-scores firing rates per value of the within-session unit index (unit 1,
    2 or 3) pooled across all sessions and both monkeys, not per unit as the Figure 3 legend says (z-scored
    separately for each session/unit). The code's printed Figure 3 values are reproduced only this way;
    per unit the conclusions are the same.
- kind: code_mismatch
  statement: 'The code measures the evoked pupil over 0 to 800 ms after the beep with a centred 50 sample
    moving mean, where the Methods give 50 ms windows in 10 ms steps from the beep to 20 ms before the
    end of fixation; it keeps beep trials more than 400 ms after the trial start and 800 ms before the
    end of the NaN-padded pupil record, where the Methods ask for 100 ms of baseline, so it keeps trials
    whose beep falls near or after the end of the trial; and it counts fixation-only baseline spikes to
    the end of the trial, not 20 ms before it. Under the Methods'' measures two claims do not reproduce
    (the Oz range effect of rho = -0.33 and the cross-epoch LLR counts) and a third only in part, while
    the code reproduces the paper''s numbers. Question for the authors: which window and trial rule produced
    the reported numbers?'
- kind: metadata_insufficient
  statement: The pupil series (acquisition pupil_value_channel4, unit a.u.) is not described beyond its
    source variable. Its values are consistent with the Methods' preprocessing having been applied before
    deposit (per session mean near 0 and SD 0.80 to 0.99, the mean trace across trials within 0.19 of
    0, smooth at 1 ms), but the file does not say so. The trial table's trial_time_index has no unit (milliseconds
    by its range, 4 to 61 min per session), the files do not say what event the trial start marks, spike
    times are given against artificial trial anchors 100 s apart (spike_time_policy), and every trial
    is marked correct, so the files appear to hold correct trials only without saying so.
- kind: other
  statement: Beep times run from about 1.0 to 2.8 s after the trial start (5th to 95th percentile; 8.8%
    of Oz and 4.4% of Ci beeps fall within 1 to 1.5 s), against the Methods' beep after 1 to 1.5 s of
    fixation; 8 beeps fall before the trial start and 83 after its end. 26% of Oz and 7% of Ci fixation-only
    trials last under 1 s (shortest 206 ms), against the Methods' fixation of 1 to 5 s.
- kind: metadata_insufficient
  statement: The session Cicero_022714_d18_402_FixnStim is named for stimulation, but no file has a stimulation
    marker column, so whether any of its trials carried microstimulation cannot be told; the code's rule
    for fixation-only trials (no beep and no stimulation marker) then keeps all of its non-beep trials.
- kind: paper_inconsistency
  statement: The Results name a Wilcoxon rank-sum test for the one-sample hypothesis that the median coefficient
    is 0; the code runs the signed-rank test (signrank), whose p-values equal the printed ones. The Results
    also relate the coefficients to the range in each session, while the code takes the range per unit.
