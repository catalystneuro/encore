- claim: fig4b-task2-label-fractions
  outcome: reproduced
  notebook: reproduce_sun_2021.ipynb
  output: claim:fig4b-task2-label-fractions
  measured: [59.98, 20.58, 16.20, 3.25, 65.51, 25.82, 3.40, 5.27, 68.91, 13.49, 9.50, 8.09, 75.23, 11.62,
    4.46, 8.69, 69.53, 26.42, 1.03, 3.03]
  notes: Under the training split with the class order of the Task 1 pie (other, investigation, mount,
