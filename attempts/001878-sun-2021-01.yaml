findings:
- kind: data_missing
  statement: The MARS confidence scores, which CalMS21 distributes with every keypoint, are missing from
    the dandiset's CalMS21 file; the confidence field of all 14 pose series is present but all 333,340
    values are NaN. CaltechDATA's copy of the same sequence has them (0.03 to 0.98).
- kind: selection_undocumented
  statement: For CalMS21 the dandiset holds one sequence, the Task 1 test sequence mouse071, out of 574
    sequences on CaltechDATA. Its description presents a collection of datasets and does not say that
    only one CalMS21 sequence is included or why this one was chosen.
- kind: metadata_insufficient
  statement: The behavior catalogue (CalMS21_ethogram) has an empty definition for attack,
    investigation, mount and other, though the paper defines the three behaviors (Appendix D.2) and
    states that annotations refer to behaviors initiated by the resident.
- kind: metadata_insufficient
  statement: The two mice are stored as one subject with strain C57BL/6, sex unknown and age P0D/; the
    intruder's strain (BALB/c) and the residents' sex (male) are known from the paper but not
    recorded, and which series belongs to the black or white mouse is given only by the series names.
- kind: metadata_error
  statement: The session start time is 2024-01-01T00:00, a placeholder; CalMS21 gives no recording
    dates.
- kind: metadata_insufficient
  statement: The `centroid_speed` series, and the bout columns mean_speed, peak_speed and
    immobility_fraction that reduce it, are the speed of the mean of all 14 keypoints, which is the
    midpoint of the two mice, not the speed of either animal. The description ("the pose centroid,
    mean over keypoints") does not make this clear.
- kind: other
  statement: The dandiset's mouse071 video (184 MB) is a re-encoding of CaltechDATA's (964 MB). It has
    the same frame count, size and rate, and its motion follows the pose at lag 0, but the dandiset does
    not say it was re-encoded.
- kind: metadata_insufficient
  statement: The dandiset links the CalMS21 dataset DOI (10.22002/D1.1991) as IsDerivedFrom, but not the
    paper that describes the dataset and its benchmarks (arXiv 2104.02710, NeurIPS 2021 Datasets and
    Benchmarks).
- kind: other
  statement: On CaltechDATA, 574 CalMS21 sequences hold 450 distinct recordings (identical keypoints over
    the whole sequence). 93 of the 109 Task 3 test sequences are Task 1 training recordings, six Task 1
    test recordings (mouse071 among them) are Task 3 training sequences, and four Task 2 recordings are
    in the training set of one of annotators 3 and 4 and the test set of the other. The paper describes
    each sequence as an independent observation and does not mention the overlap.
- kind: paper_inconsistency
  statement: The paper's datasheet says the dataset does not include the raw videos, while Section 3.1
    says all source videos of Task 1 are released, and the deposit holds them. The datasheet also gives
    the licence as CC-BY-NC-SA, while the CaltechDATA record and the dandiset give CC-BY 4.0.
- kind: other
  statement: Table 5 gives 139,112 training frames for Task 2 annotator 1; the deposited file holds
    139,122. The other 47 counts of Table 5 match.
- kind: methods_unavailable
  statement: The baseline code the paper links (gitlab.aicrowd.com/aicrowd/research/mab-e/mab-e-baselines)
    is not reachable and no archived copy of the repository was found; the code of the challenge's top
    entries is not linked. The paper leaves the architectures' settings to that code, so none of the
    benchmark results can be repeated.
