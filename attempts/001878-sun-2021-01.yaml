inputs:
- what: The CalMS21 dataset as deposited by the paper's authors (version 1.0), streamed from its zips
    with range requests. The pose, confidence scores and annotations of every sequence of Tasks 1 to 3
    and the unlabeled set, used for the link claim, the confidence-based pose-error claim and all
    claims with data elsewhere; the directory of task1_videos_mp4.zip, used to compare the size of the
    mouse071 video.
  source: doi:10.22002/D1.1991 (CaltechDATA record s0vdx-0k302, version 1.0)
outcomes:
- claim: format-keypoints
  outcome: partially_reproduced
  notebook: reproduce_sun_2021.ipynb
  output: claim:format-keypoints
  notes: The file holds 14 keypoint series named for the seven parts of the resident and the intruder,
    in pixels, at 30 Hz, with every coordinate inside the 1024 x 570 image (x 5.0 to 991.2, y 9.0 to
    563.3). The confidence field is present for every keypoint but all 333,340 values are NaN, so the
    confidence part of the claim fails.
  deviations:
  - Judged on the one CalMS21 sequence in the dandiset.
- claim: resident-is-black
  outcome: reproduced
  notebook: reproduce_sun_2021.ipynb
  output: claim:resident-is-black
  notes: In 746 of 794 sampled frames (every 30th) the body centres are at least 60 px apart; in all of
    them the 12 px patch on the resident is darker than the one on the intruder (median grey level
    46.4 against 250.9). With 8 and 24 px patches the fractions are 0.997 and 1.000, with separations
    of 30 and 120 px 0.999 and 1.000, and 1.0 in every minute.
  deviations:
  - The coat colour test (grey level of the video at the body centre) was chosen here; the paper states
    the identities without a test.
- claim: task1-vocab
  outcome: reproduced
  notebook: reproduce_sun_2021.ipynb
  output: claim:task1-vocab
  notes: The catalogue holds attack 0, investigation 1, mount 2 and other 3; the bouts give the
    annotator as "CalMS21 annotator 0"; the 170 bouts tile the session from 0 to 793.67 s with no gaps,
    so all 23,810 frames have exactly one label. The session has no attack bouts.
- claim: task1-video
  outcome: reproduced
  notebook: reproduce_sun_2021.ipynb
  output: claim:task1-video
  notes: The video is 1024 x 570, h264, at 30 frames per second with 23,810 frames, equal to the pose.
    Its motion energy correlates best with the pose speed at lag 0 (r = 0.754, falling to 0.19 and 0.26
    at 15 frames either way). It is 184,059,454 bytes against 964,451,532 for CaltechDATA's
    mouse071_task1_annotator1.mp4, so it was re-encoded; the two were not compared frame by frame.
- claim: contact-during-social-behaviors
  outcome: reproduced
  notebook: reproduce_sun_2021.ipynb
  output: claim:contact-during-social-behaviors
  notes: Median distance from the resident's nose to the nearest intruder keypoint is 21.4 px in 4,679
    investigation frames and 15.0 px in 2,894 mount frames, against 376.0 px in 16,237 other frames
    (differences -354.6 and -361.0 px, 95% block bootstrap intervals -408.9 to -295.2 and -413.6 to
    -303.8, with blocks of contiguous session time). The centroid distance gives -307.2 and -355.5 px, with intervals excluding 0, and each half
    of the session gives the same order. Attack is absent from the session, so the attack part of the
    statement is untested.
  deviations:
  - The paper defines the behaviors in words; the distance measure, the comparison with other frames
    and the bootstrap were chosen here.
  - One session, with no attack frames.
- claim: pose-errors-close-fast
  outcome: partially_reproduced
  notebook: reproduce_sun_2021.ipynb
  output: claim:pose-errors-close-fast
  notes: 657 of 23,810 frames (2.8%) have a body length outside the session's quartiles widened by 3
    IQR. In the closest 10% of frames (centroid distance at most 66.4 px) the fraction is 0.131 against
    0.016 elsewhere (difference 0.115, 95% interval 0.064 to 0.179). In the fastest 10% (at least 389
    px/s) it is 0.010 against 0.030 (difference -0.020, interval -0.033 to -0.008), the reverse of the
    claim. Both directions hold at 5% and 20% and with a factor of 1.5. With the speed taken as the
    running median of the larger speed per frame, the fast difference is -0.020 (interval -0.033 to
    -0.008) at 10% and -0.011 (interval -0.025 to 0.001) at 20%. Error fractions by label are 0.045
    (investigation), 0.105 (mount) and 0.009 (other), so a hunched posture in mount could give real
    outliers. Checked against the MARS confidence of the same frames, flagged close frames have a lower
    confidence than unflagged close frames (median 0.574 against 0.657, difference -0.082, interval
    -0.107 to -0.050), and in each of eight flagged close frames drawn at random and shown with the
    video, at least one segment visibly runs across the other mouse or the background (judged by eye).
    The flags in close frames therefore mark mostly tracking errors, though the share of real postures
    among them is not measured.
  deviations:
  - The dandiset has no confidence values, so pose errors are counted with an anatomical proxy chosen
    here; the paper gives no measure of pose error.
  - The thresholds for close and fast frames were chosen here.
- claim: link-mouse071
  outcome: reproduced
  notebook: reproduce_sun_2021.ipynb
  output: claim:link-mouse071
  notes: Matched by name to task1/test/mouse071_task1_annotator1 on CaltechDATA. Both have 23,810 frames;
    every keypoint coordinate is identical (largest difference 0 px), while swapping the mice or the
    axes gives differences of about 895 px. The frame labels from the bouts agree with the CaltechDATA
    annotations on all 23,810 frames (4,679 investigation, 2,894 mount, 16,237 other). CaltechDATA's
    confidence scores (0.030 to 0.980, all finite) are NaN in the dandiset. The same recording is also
    deposited on CaltechDATA as the Task 3 training sequence task3/groom/train/mouse002_task3_groom.
- claim: pose-errors-close-fast-confidence
  outcome: partially_reproduced
  notebook: reproduce_sun_2021.ipynb
  output: claim:pose-errors-close-fast-confidence
  notes: The mean confidence per frame (CaltechDATA scores, matched frame by frame) is lower in the
    closest 10% of frames (median 0.649 against 0.740, difference -0.091, 95% interval -0.107 to
    -0.074), most of all for the intruder (-0.149 against -0.031 for the resident). In the fastest 10%
    of frames it is higher (0.751 against 0.732, difference 0.018, interval 0.012 to 0.025), the reverse
    of the claim. Both hold at 5% and 20%. The confidence correlates with the body-length error flags of
    pose-errors-close-fast (point-biserial r = -0.366). With the speed taken as the running median of
    the larger speed per frame, the fast difference is 0.018 (interval 0.012 to 0.025). The link holds
    in full, so the match of scores to frames is exact.
  deviations:
  - Confidence is a proxy for pose error; the paper gives no measure.
  - The confidence scores come from CaltechDATA, as the dandiset's are missing.
