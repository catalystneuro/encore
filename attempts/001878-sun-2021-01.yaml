- claim: table6-task1-label-fractions
  outcome: partially_reproduced
  notebook: reproduce_sun_2021.ipynb
  output: claim:table6-task1-label-fractions
  measured:
  - 2.765
  - 28.876
  - 5.636
  - 62.723
  notes: Under reading (a), the training split, investigation, mount and other are within half a unit
    of the last reported digit; attack is 14,039 of 507,738 frames, 2.765009%, 0.005009 from 2.76
    against a tolerance of 0.005. It rounds to 2.77 and truncates to the reported 2.76. All four are
