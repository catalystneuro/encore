- claim: dataset-size
  outcome: reproduced
  notebook: reproduce_sun_2021.ipynb
  output: claim:dataset-size
  measured:
  - 282
  - 5952058
  notes: The unlabeled set has 282 sequences and 5,952,058 frames (55.1 h). Annotated frames are 769,845
    (7.1 h) in Task 1, 3,243,734 (30.0 h) over all labelled sets, and 2,273,674 (21.1 h) with each
    recording counted once; tracked pose including the unlabeled set is 62.2, 85.2 and 76.2 h. So the
    three "over" statements (1 million annotated frames, 10 hours of annotation, 70 hours of pose) hold
    under readings (b) and (c) and none holds under reading (a).
  deviations:
  - The paper does not say which sets its totals cover; three readings were listed before the analysis.
- claim: table10-task3-difficulty
  outcome: partially_reproduced
  notebook: reproduce_sun_2021.ipynb
  output: claim:table10-task3-difficulty
  notes: Across the seven behaviors the baseline F1 of Table 10 rises with the percentage of labelled
    frames (Spearman 0.786, exact one-sided p = 0.024 on the training split; 0.929, p = 0.003 on the
    test split) and with mean bout length, but the latter is not significant (0.321, p = 0.249; 0.607,
    p = 0.083). With the task programming model's F1 the bout-length correlations are 0.536 (p = 0.118)
    and 0.679 (p = 0.055). The direction of both parts of the statement holds; only the frequency part
    is significant with seven behaviors.
  deviations:
  - The paper states the dependence without a test; the correlation and the permutation test were
    chosen here, using the paper's published F1 scores with frequencies and bout lengths computed from
    the data.
- claim: table1-architectures
  outcome: blocked
  blocked_by: methods_underspecified
  notes: Needs the four baseline networks trained on Task 1. The paper gives some settings (input
    window, skip factor, the ranges searched) and refers to the project code for the rest, but the code
    at gitlab.aicrowd.com/aicrowd/research/mab-e/mab-e-baselines did not answer, with or without the
    sandbox, and no copy was found in Software Heritage or on GitHub; the web archive holds its landing
