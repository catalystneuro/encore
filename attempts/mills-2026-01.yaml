- claim: figs15-no-context-encoding
  outcome: not_reproduced
  notebook: reproduce_mills_2026.ipynb
  output: claim:figs15-no-context-encoding
  notes: Per mouse, Context A against B, paired t-tests. Drd1a+ (6 mice) shows no change in raw fluorescence (p
    = 0.81), peak rate (p = 0.56) or deconvolved event rate (p = 0.56). Drd2+ (5 mice) shows none in raw fluorescence
    (p = 0.29) or deconvolved event rate (p = 0.81), but its peak rate is higher in Context A, 0.179 against 0.170
    per s, t(4) = 2.95, p = 0.042. Freezing is higher in Context A for Drd1a-Cre mice (0.186 against 0.072, t(5)
    = 3.92, p = 0.011) but not for Drd2-Cre mice (0.094 against 0.075, p = 0.63). The deconvolved mean, a variant,
    shows no change for either type (p 0.45, 0.69). Freezing counts frames whose pose repeats the previous one within
    0.5 px (at most 0.1% of frames fall between 0.5 and 1.6 px), which is why the scale does not change it; the
    median-displacement variant gives the same pattern (Drd1a-Cre p = 0.017, Drd2-Cre p = 0.33). The Drd2+ peak-rate
    test fails the activity part whatever freezing measures.
  deviations:
  - Assumed the pixel scale from the extent of the body points against a 30 x 40 cm floor; the context chambers
    are in other rooms and the scale ranges from 7.5 to 32.8 px/cm. A fixed 14 px/cm (the median) gives the same
    freezing results.
  - All CNMF-E ROIs; the paper had 157 to 165 Drd1a+ and 136 to 137 Drd2+ neurons per context.
  - Peaks are local maxima above the trace's mean plus 2 SD; spike rate is frames with a nonzero deconvolved value
    per second (readings named by the criterion).
  assumed: true
