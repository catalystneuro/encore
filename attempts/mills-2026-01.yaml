- claim: fig5m-drd2-rich-clusters-cs-shock
  outcome: not_reproduced
  notebook: reproduce_mills_2026.ipynb
  output: claim:fig5m-drd2-rich-clusters-cs-shock
  notes: 2036 paired ROIs (1189 Drd2, 847 Drd1a), nine clusters. Under none of the eight readings (average or Ward
    linkage; the 10 s cue or the imaged window; soft normalization as z/(max|z|+10) or as clipping at 10) is the
