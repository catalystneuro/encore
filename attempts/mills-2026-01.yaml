- claim: fig2-recorded-neurons
  outcome: not_reproduced
  notebook: reproduce_mills_2026.ipynb
  output: claim:fig2-recorded-neurons
  measured:
  - 1515
  - 0
  - 885
  - 633
  notes: Units below 50 Hz by the region and group the files give. Paired ASt 1515 units in 15 mice (paper
    193 in 15), paired TS 0 (paper 212 in 7), paired CeA 885 in 6 mice (paper 145 in 8), unpaired ASt
    633 in 4 mice (paper 71 in 4). The Neuropixels units carry no region, and each probe's units span
    the structures it passes through, so the paper's per-region counts cannot be formed. Only the Open
    Ephys sessions have trial events, giving 112 paired ASt units in 10 mice and 22 CeA units in 2 mice.
    The link holds in part for paired ASt units with events, and the claims that need only them are tested
    on that part.
  deviations:
  - The Open Ephys files do not state the group; their 12 mice are taken as paired because the paper's
    4 unpaired ASt mice match the 4 Neuropixels files marked unpaired.
  - Open Ephys rates are spike counts over the recording span; Neuropixels rates are the files' firing_rate
    column. The paper's code (discall.py) computes rate as count over duration.
- claim: figs9-sustained-only-cs-shock
  outcome: partially_reproduced
  notebook: reproduce_mills_2026.ipynb
  output: claim:figs9-sustained-only-cs-shock
  measured:
  - 10
  - 112
  notes: Under both bin sizes (100 and 10 ms) and both readings of the 1 s and 2 s timepoints, the phasic
    ANOVA is not significant (F(2,333) = 1.42 and 1.49, p 0.24 and 0.23), every sustained ANOVA gives
    p < 0.001 (100 ms bin at 1 s F = 18.79, p = 1.9e-8; at 2 s F = 15.42, p = 4.0e-7), and Tukey's test
    puts CS-shock above CS-reward and above the slow CS-reward trials (p < 0.006) with the two CS-reward
    groups equal (p > 0.95). The slow-trial group does not match the paper's. All 10 mice have CS-reward
    trials with port latency over 2 s (22 to 85 per mouse), giving 112 neurons against the paper's 96
    from only 10 of its 15 mice, so the paper selected these trials or neurons in a way it does not state.
    By mouse, CS-shock sustained z exceeds both CS-reward groups in 7 of 10 mice. The paired ASt units
    are those of the 10 Open Ephys mice (112 units below 50 Hz); the 5 paired Neuropixels ASt mice have
    no trial events. The link claim fig2-recorded-neurons fails on its counts but holds in part (10 of
    the 15 paired ASt mice can be used), so this claim is tested on that part, as the protocol says for
    a partial link.
  deviations:
  - 10 of the paper's 15 paired ASt mice (Open Ephys only); df 333 against the paper's 479.
  - Port latency is the first port entry of the trial table at or after CS-reward onset (STAR Methods,
    port latency is the time from tone onset to port entry); a trial is slow when it is over 2 s.
  - Units are the files' curated units below 50 Hz (code, discall.py).
- claim: fig2q-trajectories-diverge
  outcome: reproduced
  notebook: reproduce_mills_2026.ipynb
  output: claim:fig2q-trajectories-diverge
  notes: The mean CS-shock to CS-reward distance over 0 to 18 s is 7.36 in the complete PC space against
    a largest baseline distance of 2.87 (mean 2.05), and 7.16 against 1.94 in the 41 components that explain
    90% of the variance. Within single mice the cue mean exceeds the baseline maximum in 3 of 10 (the
    mice with the most units responding to CS-shock). The paired ASt units are those of the 10 Open Ephys
    mice (112 units below 50 Hz); the 5 paired Neuropixels ASt mice have no trial events. The link claim
    fig2-recorded-neurons fails on its counts but holds in part (10 of the 15 paired ASt mice can be used),
    so this claim is tested on that part, as the protocol says for a partial link.
  deviations:
  - The PCA is fitted on paired animals only, the code's variant; the Methods' single PCA over paired
    and unpaired animals cannot be run, as no unpaired animal has trial events. With all components kept
    the PCA is a rotation of the centred neuron space, so the complete-space distance between the paired
    trajectories does not depend on which rows the PCA is fitted on; the 90% variant does.
  - 112 neurons from 10 of the paper's 15 paired ASt mice.
- claim: figs8-single-trial-divergence
  outcome: partially_reproduced
  notebook: reproduce_mills_2026.ipynb
  output: claim:figs8-single-trial-divergence
  notes: Five paired animals meet the code's selection (at least 10 units and 30 trials per CS; 3024 has
    29 CS-shock trials). Shock-reward cosine similarity over 0 to 18 s (pooled mean -0.009) is below shock-shock
    (0.074) and reward-reward (0.066). Reading (c), iterations pooled, gives p = 8.0e-53 (W = 13181, n
    = 500) under the claim's seed and p 1.4e-54 to 1.9e-48 under the four others. Readings (a) and (b)
    cannot reach p < 0.01 with five animals (p 0.0625 to 0.125). The unpaired half of the claim cannot
    be tested. The Neuropixels files (all 4 unpaired ASt mice, 5 paired ASt mice, 4 CeA mice) hold spikes
    but no trial events and no behavior, and their units carry no region, so no TS unit can be found.
  deviations:
  - Paired part only; 5 Open Ephys animals against the 8 paired animals of the code's printout.
  - 100 ms bins, as the code that plots the example pairs (standard choice; the Methods give none).
- claim: fig3h-cs-decoded-paired-only
  outcome: not_reproduced
  notebook: reproduce_mills_2026.ipynb
  output: claim:fig3h-cs-decoded-paired-only
  notes: Six paired mice have more than 10 units. Accuracy over 0 to 18 s under the claim's seed is 0.825,
    0.892, 0.494, 0.531, 0.677 and 0.702 against shuffled chance 0.48 to 0.51; two mice (3026, 6197) are
    at chance. The Mann-Whitney U test of accuracies against chance gives U = 32, p = 0.026 two-sided
    (one-sided 0.013), above the criterion's 0.01; under the four other seeds p is 0.015 to 0.065 two-sided.
    The code's Wilcoxon variant gives W = 1, p = 0.0625. The unpaired half cannot be tested. The Neuropixels
    files (all 4 unpaired ASt mice, 5 paired ASt mice, 4 CeA mice) hold spikes but no trial events and
    no behavior, and their units carry no region, so no TS unit can be found.
  deviations:
  - Paired part only; 6 Open Ephys mice against the code's 9 paired mice.
  - The two-sided Mann-Whitney U test is used as the main reading as the legend does not say one-sided;
    the one-sided p (0.0076 to 0.033) is below 0.01 under one of five seeds only.
- claim: figs13-imaging-mice-discriminate
  outcome: reproduced
  notebook: reproduce_mills_2026.ipynb
  output: claim:figs13-imaging-mice-discriminate
  notes: Defensive behavior (share of the 10 s tone freezing plus share darting, all 60 cues per session).
    Paired Drd1a-Cre, 10 mice, CS-shock 0.191 against CS-reward 0.153, t(9) = 3.61, p = 0.0057; paired
    Drd2-Cre, 9 mice, 0.183 against 0.133, t(8) = 2.37, p = 0.046; unpaired Drd1a-Cre, 8 mice, p = 0.80;
    unpaired Drd2-Cre, 6 mice, p = 0.51. The summed-displacement rule gives the same (p 0.0054, 0.045,
    0.80, 0.52). Mouse counts match the paper's (10, 9, 8, 6).
  deviations:
  - Assumed the pixel scale from the extent of the body points (0.5th to 99.5th percentile) against the
    30 x 40 cm chamber the Methods give, as the poses are in pixels with no scale; 18.8 to 20.7 px/cm.
  - Assumed the haunch as the rear body centre for darting; the skeleton has no node of that name.
  - The freezing rule ('total displacement of ALL mouse body points less than 0.08 cm per frame') is run
    as every point below 0.08 cm and as the sum below 0.08 cm; both give the outcome.
  assumed: true
- claim: fig5j-drd2-cs-shock-responses
  outcome: partially_reproduced
  notebook: reproduce_mills_2026.ipynb
  output: claim:fig5j-drd2-cs-shock-responses
  measured:
  - 1189
  - 625
  notes: Drd2+ paired ROIs respond more to CS-shock than unpaired ones, short window mean z 0.275 against
    -0.425, t(1812) = 6.23, p = 5.6e-10; long -0.241 against -0.819, t(1812) = 5.03, p = 5.3e-7. The deconvolved
    variant agrees (p 4.9e-8 and 1.0e-6). The counts are outside tolerance, 1189 paired and 625 unpaired
    ROIs against 296 and 257, because the files hold every CNMF-E ROI and the paper's manual curation
    is not recorded. Across mice (9 and 6) the difference is not significant (p 0.17 and 0.16). Mouse
    counts match.
  deviations:
  - All CNMF-E ROIs in the files; the paper used manually curated neurons, about a quarter of them.
  - Imaged trials only (15 per CS per session), the cue onsets of processing/behavior/stimulus_events
    that fall in an imaged trial.
- claim: fig5h-drd1-no-difference
  outcome: not_reproduced
  notebook: reproduce_mills_2026.ipynb
  output: claim:fig5h-drd1-no-difference
  measured:
  - 847
  - 608
  notes: All four of the paper's t-tests find a difference on the deposited ROIs (847 paired, 608 unpaired).
    CS-shock short, paired -0.078 against unpaired -0.336, t(1453) = 3.16, p = 0.0016; long -0.347 against
    -0.727, p = 3.5e-5; CS-reward short -0.147 against -0.347, p = 0.0018; long -0.238 against -0.449,
    p = 0.0032. The effects are small (mean z differences 0.20 to 0.38). With the deconvolved trace three
    of four differ. Across mice (10 and 8) no difference (p 0.89 and 0.90 for CS-shock).
  deviations:
  - All CNMF-E ROIs in the files; the paper used 320 and 237 curated neurons.
