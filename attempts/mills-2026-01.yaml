  blocked_by: not_runnable
  notes: The snRNA-seq data are public at GEO GSE211437 as 12 raw 10x count matrices (GSE211437_RAW.tar,
    2.7 GB). The claim rests on the paper's R pipeline (Seurat SCTransform v2 with 25 PCs and graph clustering
    into Drd1a+ and Drd2+ MSN clusters; Libra and edgeR for figs2), which the entry's locked Python environment
    cannot install; a Python substitute would form different clusters, on which the proportions and DEG
    counts rest. The matrices were listed, not fetched.
