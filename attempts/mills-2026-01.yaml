- claim: fig5m-drd2-rich-clusters-cs-shock
  outcome: not_reproduced
  notebook: reproduce_mills_2026.ipynb
  output: claim:fig5m-drd2-rich-clusters-cs-shock
  notes: 2036 paired ROIs (1189 Drd2, 847 Drd1a), nine clusters. Under none of the eight readings (average
    or Ward linkage; the 10 s cue or the imaged window; soft normalization as z/(max|z|+10) or as clipping
    at 10) is the Spearman correlation across clusters between the normalized Drd2 share and the mean
    CS-shock z positive at p < 0.05; rho -0.12 to 0.47, p 0.20 to 0.97. Average linkage puts most ROIs
    in one or two clusters. While preparing, a version of the window reading that dropped the 233 ROIs
    whose clips start late gave rho 0.76, p = 0.017; it was not run here and does not decide the outcome.
  deviations:
  - All CNMF-E ROIs in the files; the paper used 616 curated neurons of paired mice.
  - The imaged window starts at -8.67 s, the latest clip start over sessions, and bins before it are dropped
    so that every ROI is kept.
  - Soft normalization 'to a maximum z-score of 10' (STAR Methods) is run under two readings, as the paper
    does not define it.
- claim: figs15-no-context-encoding
  outcome: not_reproduced
  notebook: reproduce_mills_2026.ipynb
  output: claim:figs15-no-context-encoding
  notes: Per mouse, Context A against B, paired t-tests. Drd1a+ (6 mice) shows no change in raw fluorescence
    (p = 0.81), peak rate (p = 0.56) or deconvolved event rate (p = 0.56). Drd2+ (5 mice) shows none in
    raw fluorescence (p = 0.29) or deconvolved event rate (p = 0.81), but its peak rate is higher in Context
    A, 0.179 against 0.170 per s, t(4) = 2.95, p = 0.042. Freezing is higher in Context A for Drd1a-Cre
    mice (0.186 against 0.072, t(5) = 3.92, p = 0.011) but not for Drd2-Cre mice (0.094 against 0.075,
    p = 0.63). The deconvolved mean, a variant, shows no change for either type (p 0.45, 0.69).
  deviations:
  - Assumed the pixel scale from the extent of the body points against a 30 x 40 cm floor; the context
    chambers are in other rooms and the scale ranges from 7.5 to 32.8 px/cm. A fixed 14 px/cm (the median)
    gives the same freezing results.
  - All CNMF-E ROIs; the paper had 157 to 165 Drd1a+ and 136 to 137 Drd2+ neurons per context.
  - Peaks are local maxima above the trace's mean plus 2 SD; spike rate is frames with a nonzero deconvolved
    value per second (readings named by the criterion).
  assumed: true
