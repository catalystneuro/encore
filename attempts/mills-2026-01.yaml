- claim: figs9-sustained-only-cs-shock
  outcome: partially_reproduced
  notebook: reproduce_mills_2026.ipynb
  output: claim:figs9-sustained-only-cs-shock
  measured:
  - 10
  - 112
  notes: Port latency is taken as the tone duration, since collecting the reward ends the tone; the first port entry
    after onset is the other reading. With the tone duration, under both bin sizes (100 and 10 ms) the phasic ANOVA
    is not significant (F(2,333) = 0.98 and 1.09, p 0.38 and 0.34). Under reading (b) of the 1 s and 2 s timepoints
    every sustained ANOVA gives p < 0.001 (100 ms at 1 s F = 17.04, p = 9.0e-8; at 2 s F = 18.10, p = 3.5e-8; 10
    ms p 2.3e-7 and 1.1e-7), and Tukey's test puts CS-shock above CS-reward and above the slow CS-reward trials
    (p < 2e-5) with the two CS-reward groups equal (p > 0.89). Under reading (a) the 10 ms bin at 2 s gives p =
    0.0013. The first-entry latency gives the same outcome (phasic p 0.24 and 0.23, all eight sustained ANOVAs p
    < 0.001). The slow-trial group does not match the paper's. All 10 mice have CS-reward trials with latency over
    2 s (26 to 86 per mouse), giving 112 neurons against the paper's 96 from only 10 of its 15 mice, so the paper
    selected these trials or neurons in a way it does not state. By mouse, CS-shock sustained z exceeds both CS-reward
    groups in 7 of 10 mice. The paired ASt units are those of the 10 Open Ephys mice (112 units below 50 Hz); the
    5 paired Neuropixels ASt mice have no trial events. The link claim fig2-recorded-neurons fails on its counts
    but holds in part (10 of the 15 paired ASt mice can be used), so this claim is tested on that part, as the protocol
    says for a partial link.
  deviations:
  - 10 of the paper's 15 paired ASt mice (Open Ephys only); df 333 against the paper's 479.
  - 'Port latency is the tone duration (STAR Methods, Two-tone discrimination tasks: ''Collection of the reward
    prior to the end of the tone resulted in termination of the tone''); the first port entry at or after onset
    is run as the other reading and gives the same outcome. A trial is slow when it is over 2 s.'
  - Units are the files' curated units below 50 Hz (code, discall.py).
