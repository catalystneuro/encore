findings:
- kind: other
  about: data
  severity: critical
  statement: In the Open Ephys files the SLEAP poses are not on the clock of the spikes and the trial
    table, and nothing in the files says so. The nose position at the trial table's port entries clusters
    at a lag of -10.6 to +6.6 s in five of the six 2018 sessions and at +287 s in the sixth (the shock-evoked
    speed peak agrees within 0.6 s in three of them), and at no lag in the six 2019 sessions (spread at
    best 81 to 117 px), whose poses are at 15 frames/s and span 150 to 190 s less than the recording.
    In the imaging files the same check finds lags of 0.2 to 4 s (spread 2.5 to 14 px) in 32 of 34 files.
    An analysis that takes the pose timestamps as given places freezing and darting in the wrong trials
    and against the wrong spikes.
- kind: data_missing
  severity: major
  statement: The 13 Neuropixels files (5 paired and 4 unpaired ASt mice, 4 CeA mice) hold spikes but no
    trial events and no behavior; the Methods say events were recorded by TTL at 10 kHz. No cue response
    can be computed for them, so all unpaired ephys mice, all TS neurons and most CeA neurons of the paper
    cannot be analysed.
- kind: metadata_insufficient
  severity: major
  statement: Neuropixels units have no region, channel or electrode column, and every electrode of a probe
    carries one label (ASt or CeA) although the probes span 3.8 mm. The paper's TS units cannot be found,
    and the files give 1515 paired ASt units, 885 CeA and 633 unpaired against the paper's 193, 145 and
    71.
- kind: selection_undocumented
  about: data
  severity: major
  statement: The imaging files hold every CNMF-E ROI (2036 in paired and 1233 in unpaired discrimination
    sessions) with no column marking the manually curated neurons the paper analysed (1110 in total),
    so counts are 2.4 to 4.0 times the paper's and results on the files can differ from the paper's (three
    claims of no difference fail here).
- kind: data_missing
  severity: major
  statement: The paper says raw and processed data are at this dandiset, but it holds no RNAscope data,
    no optogenetic activation or inhibition behavior, and no unpredicted-US imaging session. Fifteen claims
    cannot be tested for this reason.
- kind: other
  about: data
  severity: critical
  statement: Two recordings are deposited twice. sub-6197 has two Open Ephys files with identical spikes
    and events. sub-J933 has two imaging files with identical traces, and in the one named sub-J933-Disc4_ses-J933-Disc4
    the port entries are 55 in place of 193 and sit 236 s off the video's clock. The duplication shows
    in the shared subject names; the wrong port entries do not.
- kind: metadata_insufficient
  severity: minor
  statement: The Open Ephys files do not say whether a mouse was in the paired or unpaired group (the
    Neuropixels and imaging files do); they are taken as paired from the paper's mouse counts.
- kind: metadata_insufficient
  severity: minor
  statement: Poses are in pixels with no scale; the paper's freezing and darting thresholds are in cm.
    The scale was inferred from the chamber size (about 20 px/cm in discrimination sessions, 7.5 to 33
    in context sessions).
- kind: other
  about: data
  severity: minor
  statement: Imaging frames are 1/15 s apart in every file, where the Methods say 15 frames/s downsampled
    by two, and each discrimination session has 15 imaged CS-reward trials, where the Methods say every
    other reward trial of 45. Imaged clips begin about 9.6 s before the cue, so the 10 s baseline is not
    complete.
- kind: other
  about: data
  severity: none
  statement: Open Ephys spikes respond at the trial table's CS onsets and not at onsets shifted 45 s,
    CS-shock tones last 20 s, and CS-reward tones end 0.4 s after the first port entry (median), as the
    Methods describe. Imaging mouse counts per genotype and group match the paper's.
- kind: methods_unavailable
  statement: Questions for the authors. (1) Figure S9, how were the CS-reward trials with port latency
    over 2 s and their 96 neurons in 9 mice selected? Here all 10 Open Ephys mice have 22 to 85 such trials.
    (2) Figure 5L-M, what is the soft normalization 'to a maximum z-score of 10', and which linkage and
    trace span were used? (3) How is 'total displacement of ALL mouse body points' computed (sum or each
    point), with what pixel scale, and which node is the rear body centre for darting? (4) Is there a
    record of the curated imaging neurons and of the Neuropixels units' regions and trial events?
