findings:
- kind: other
  about: data
  severity: critical
  statement: In the Open Ephys files the SLEAP poses are not on the clock of the spikes and the trial table, and
    nothing in the files says so. The nose position at the trial table's port entries clusters (spread 7 to 15
    px) at a lag of -9.8 to +6.6 s in four of the six 2018 sessions (the shock-evoked speed peak agrees within 0.6
    s in three of them), less tightly in the other two (best spread 39 and 60 px), and at no lag in the six 2019
    sessions (spread at best 81 to 117 px), whose poses are at 15 frames/s and span 150 to 190 s less than the recording.
    Fitted per quarter of the session, the lag is constant within 0.8 s in the four 2018 sessions and changes by
    22 to 529 s in the other eight. In the imaging files the same
    check finds lags of 0.2 to 4 s (spread 2.5 to 14 px) in 32 of 34 files. An analysis that takes the pose timestamps
    as given places freezing and darting in the wrong trials and against the wrong spikes.
- kind: data_missing
  severity: major
  statement: The 13 Neuropixels files (5 paired and 4 unpaired ASt mice, 4 CeA mice) hold spikes but no trial events
    and no behavior; the Methods say events were recorded by TTL at 10 kHz. No cue response can be computed for
    them, so all unpaired ephys mice, all TS neurons and most CeA neurons of the paper cannot be analysed.
- kind: metadata_insufficient
  severity: major
  statement: Neuropixels units have no region or electrode column, and every electrode of a probe carries one label
    (ASt or CeA) although the probes span 3.8 mm. The units do carry probe_depth (micrometers from the tip) and
    a good or mua label, and the files hold histology images of the probe track, but nothing maps depth to region.
    The paper's TS units cannot be found, and the files give 1515 paired ASt units, 885 CeA and 633 unpaired against
    the paper's 193, 145 and 71 (574, 155 and 410 Neuropixels units labeled good, with 112 and 22 more from Open
    Ephys).
- kind: selection_undocumented
  about: data
  severity: major
  statement: The imaging files hold every CNMF-E ROI (2036 in paired and 1233 in unpaired discrimination sessions)
    with no column marking the manually curated neurons the paper analysed (1110 in total), so counts are 2.4 to
    4.0 times the paper's and results on the files can differ from the paper's (three claims of no difference fail
    here).
- kind: data_missing
  severity: major
  statement: The paper says raw and processed data are at this dandiset, but it holds no RNAscope data, no optogenetic
    activation or inhibition behavior, and no unpredicted-US imaging session. Fifteen claims cannot be tested for
    this reason.
- kind: other
  about: data
  severity: critical
  statement: Two recordings are deposited twice. sub-6197 has two Open Ephys files with identical spikes and events.
    sub-J933 has two imaging files with identical traces, and in the one named sub-J933-Disc4_ses-J933-Disc4 the
    port entries are 55 in place of 193 and sit 236 s off the video's clock.
- kind: metadata_insufficient
  severity: minor
  statement: The Open Ephys files do not say whether a mouse was in the paired or unpaired group (the Neuropixels
    and imaging files do); they are taken as paired from the paper's mouse counts.
- kind: metadata_insufficient
  severity: minor
  statement: Poses are in pixels with no scale; the paper's freezing and darting thresholds are in cm. The scale
    was inferred from the chamber size (about 20 px/cm in discrimination sessions, 7.5 to 33 in context sessions).
- kind: other
  about: data
  severity: minor
  statement: Imaging frames are 1/15 s apart in every file, where the Methods say 15 frames/s downsampled by two,
    and each discrimination session has 15 imaged CS-reward trials (17 to 19 in seven sessions), where the Methods say every other reward trial
    of 45. Imaged clips begin about 9.6 s before the cue, so the 10 s baseline is not complete.
- kind: other
  about: data
  severity: none
  statement: Open Ephys spikes respond at the trial table's CS onsets and not at onsets shifted 45 s, CS-shock tones
    last 20 s, and CS-reward tones end 0.4 s after the first port entry (median), as the Methods describe. Imaging
    mouse counts per genotype and group match the paper's.
- kind: methods_unavailable
  statement: Questions for the authors. (1) Figure S9, how were the CS-reward trials with port latency over 2 s
    and their 96 neurons in 9 mice selected? Here all 10 Open Ephys mice have 26 to 86 such trials (latency as tone
    duration). (2) Figure 5L-M, what is the soft normalization 'to a maximum z-score of 10', and which linkage and
    trace span were used? (3) How is 'total displacement of ALL mouse body points' computed (sum or each point),
    with what pixel scale, and which node is the rear body centre for darting? (4) Is there a record of the curated
    imaging neurons and of the Neuropixels units' regions and trial events?
- kind: other
  about: data
  severity: minor
  statement: In the imaging poses the largest frame-to-frame displacement over the 14 body points is below 0.5 px
    in 19.6% of the discrimination-session frames and above 1.6 px in the rest, with none in between, and the same
    holds in the context sessions. These frames repeat the previous pose almost exactly. The paper's freezing rule
    (all points below 0.08 cm per frame, about 1.6 px) counts only them, whatever the pixel scale, and the files
    do not say whether they are still frames or repeated video frames. Freezing so measured does not differ between
    the cues in paired mice; the defensive difference comes from darting.
verifications:
- date: '2026-11-20'
  kind: agent
  by: Independent agent run by CatalystNeuro (same harness, separate context, did not write the notebook)
  reviewed: 'Round 1. The executed notebook of the first run with the conclusion cells and the summary removed,
    the helper module and the claims file, with the paper. The verifier checked the archive''s asset list (706 assets)
    and the API metadata of the 13 Neuropixels files, streamed the structure of sub-Ast-NPX-10, and tested the helper
    functions on synthetic inputs. It gave its own outcome for each of the 11 tested claims, all agreeing with the
    record as it then stood, and found 10 problems, 4 affecting a conclusion. It reported no place where the claims
    file misreads the paper, so no question was added for a reader. Its note that pixels_per_cm underestimates the
    scale by about 18% if body points stay 3 cm from the walls is answered by the frame structure now shown: freezing
    does not depend on the scale, and darting keeps the assumption, stated on the outcome. Report in transcripts/mills-2026/verifier-1-report.md.'
  results:
  - claim: fig2-recorded-neurons
    agrees: true
    outcome: not_reproduced
    reason: 'Cell 12: units below 50 Hz are 1515 paired ASt, 0 TS, 885 CeA and 633 unpaired ASt, against the paper''s
      193, 212, 145 and 71. Mouse counts are 15, 0, 6 and 4 against 15, 7, 8 and 4. The Neuropixels units have no
      region label, so the paper''s ASt subset can''t be counted. Problem 7: in NPX-10 the units have probe_depth,
      a label column (good or mua), and acquisition/NeuropixelsHistologyImages; that could support region assignment,
      but with no events nothing becomes testable.'
    response: Outcome kept. The inventory now lists probe_depth, the label column and the histology images, the
      data check and finding 3 no longer say the units lack a channel column, and the fig2 cell prints the counts
      of units labeled good (574 paired ASt, 155 CeA, 410 unpaired, still above the paper's).
  - claim: figs9-sustained-only-cs-shock
    agrees: true
    outcome: partially_reproduced
    reason: 'Cell 14: the phasic ANOVA is not significant (p 0.24 and 0.23). All four sustained ANOVAs give p <
      0.001, and Tukey puts CS-shock above both CS-reward groups, under both bin sizes and both timepoint readings.
      But the run covers 10 of the paper''s 15 mice: the slow group has 112 neurons (expected 96 ± 10) and df is
      333, not 479. Problem 5: latency is the first port entry at or after onset, while the tone ending more than
      8 s before that entry in at least 5% of trials means the mouse was already in the port; the Methods say collection
      ends the tone, so the tone duration is the collection latency, and the slow group is contaminated. It asked
      for figs9 rerun with tone duration as the latency.'
    response: Outcome kept. Port latency is now the tone duration, citing the Methods, with the first entry as the
      other reading; the data check prints the trials with the mouse in the port at onset (0 to 28 per session)
      and slow-trial counts under both readings. With the tone duration the phasic ANOVA gives p 0.38 and 0.34 and
      the sustained ANOVAs under reading (b) p < 1e-6; all 10 mice still have slow trials (26 to 86), so the neuron
      count stays 112.
  - claim: fig2q-trajectories-diverge
    agrees: true
    outcome: reproduced
    reason: 'Cell 16: mean distance over 0 to 18 s is 7.36, against a baseline maximum of 2.87 in the complete PC
      space (7.16 against 1.94 with 41 PCs). This uses 112 neurons from 10 of 15 mice. Problem 8: in the complete
      PC space the distance equals the neuron-space distance whatever the PCA is fitted on, so the printed value
      is also the Methods'' main reading, not only the code''s variant.'
    response: Outcome kept. The header, the section text, the conclusion and the deviation now say that the complete-space
      distance is the Methods' reading, and that only the 90% variant depends on fitting the PCA on paired mice.
  - claim: figs8-single-trial-divergence
    agrees: true
    outcome: partially_reproduced
    reason: 'Cell 18: with the iterations pooled (reading c), shock-reward similarity is lower at p ≈ 1e-50 for
      all five seeds. The per-animal readings (a, b) give p 0.0625 to 0.125, and with 5 animals they cannot reach
      p < 0.01. The unpaired part can''t be tested. Problem 6: the notebook doesn''t say that (a) and (b) cannot
      reach p < 0.01, and reading (c) treats 100 resamples of the same trials as independent, so its p is inflated.'
    response: Outcome kept. The cell prints the smallest attainable two-sided Wilcoxon p for five animals (0.0625),
      and the conclusion and notes say so and that reading (c) overstates the evidence.
  - claim: fig3h-cs-decoded-paired-only
    agrees: true
    outcome: not_reproduced
    reason: 'Cell 20: the paired part misses the claim''s p < 0.01. Two-sided Mann-Whitney p is 0.015 to 0.065 across
      five seeds; one-sided p is below 0.01 in only 1 of 5 seeds. Accuracy is above chance in 4 of 6 mice, from
      6 of the code''s 9 paired mice. The unpaired part can''t be tested. Chance is 0.476 to 0.528, which agrees
      with the shuffle chance the paper describes.'
    response: Outcome kept; nothing changed.
  - claim: figs13-imaging-mice-discriminate
    agrees: true
    outcome: reproduced
    reason: 'Cell 22: both paired groups show more defensive behavior to CS-shock (Drd1a t(9) = 3.61, p 0.006; Drd2
      t(8) = 2.37, p 0.046) and neither unpaired group does, under both freezing rules. Mouse counts are 10, 9,
      8 and 6, matching the paper. The Drd2 result is near the threshold and rests on an assumed pixel scale. Problem
      4: freezing hardly changes with a fixed scale or with the max or sum rule, which points to many frames with
      near-zero displacement (possibly duplicated pose frames), not checked; it asked for the per-frame displacement
      distribution and freezing and darting reported separately.'
    response: 'Outcome kept, still marked assumed. The cell now prints the displacement distribution: the largest
      point displacement is below 0.5 px in 19.6% of frames and above 1.6 px in the rest, none between, so the paper''s
      rule counts only frames that repeat the previous pose, whatever the scale. Freezing alone does not differ
      between the cues (p 0.14 and 0.37); darting does (p < 0.0001 and 0.0016). A median-displacement variant finds
      no difference. The notes say this, and a new finding (12) records the frame structure.'
  - claim: fig5j-drd2-cs-shock-responses
    agrees: true
    outcome: partially_reproduced
    reason: 'Cell 25: paired is higher in both windows (t 6.23 and 5.03, p < 1e-6). But the neuron counts are 1189
      and 625, far outside 296 ± 30 and 257 ± 26, because every CNMF-E ROI is used. Mouse-level tests give p 0.17
      and 0.16. Problem 3: the long-window mean z is negative in every group, suggesting fluorescence decays within
      each clip, which could differ between cohorts, and it was not examined.'
    response: 'Outcome kept. The notebook now prints mean z by window for each genotype, group and CS: the baseline
      falls from about +0.3 to -0.2 in every group alike, so a decay is present but does not differ between groups.
      A variant with a linear baseline trend removed keeps the difference (p = 4.9e-9 and 0.0044).'
  - claim: fig5h-drd1-no-difference
    agrees: true
    outcome: not_reproduced
    reason: 'Cell 26: all four tests are significant with paired higher (p 0.0016 to 3.5e-5), and 3 of 4 with the
      deconvolved trace. The paper''s t-values for CS-shock are negative. Scaled to the paper''s n, the long-window
      effect (d ≈ 0.22) would still give p ≈ 0.01. The ROI set is uncurated (847 and 608 against 320 and 237). Problem
      3: the significance is mainly due to the larger n, and mouse-level tests are not significant. Problem 10:
      the Drd1a unpaired group includes G4B2-C8-6860 (1 imaged CS-shock trial, 4 CS-reward, truncated session) and
      G2B1-C4-6886 (1 ROI). It asked for mouse-level results for the Drd1a CS-reward windows.'
    response: 'Outcome kept: the claim of absence is judged on the paper''s neuron-level test. Added the mouse-level
      CS-reward test (p 0.73 and 0.50), a variant without 6860 and 6886 (all four still differ, p 0.0015 to 3.8e-6),
      the detrended variant (three of four differ) and the decay table.'
  - claim: fig5k-drd2-cs-reward-no-difference
    agrees: true
    outcome: not_reproduced
    reason: 'Cell 27: the short-window test on raw fluorescence gives p = 0.034, and the criterion needs neither
      test to be significant. The effect is small (d ≈ 0.1, same direction as the paper''s t = 1.85) and would not
      be significant at the paper''s n. The deconvolved variant has neither test significant. It asked for mouse-level
      results for fig5k, and how many CS-reward events are imaged to 3 s but not 10 s, as cs_imaged needs 10 s and
      only 15 of an expected ~22 reward trials are kept.'
    response: 'Outcome kept. Added the mouse-level test (p 0.36 and 0.33) and the detrended variant (short p = 0.0023).
      The data check now prints clip coverage: each session has 30 clips (15 CS-shock, 15 CS-reward; 17 to 19 CS-reward
      in the DISC6+TONES sessions), and every event covered to 1 s is covered to 10 s except one CS-reward event
      of G4B2-C8-6860, so the 10 s rule drops no trial elsewhere; the files hold 15 reward clips, not about 22 (finding
      9).'
  - claim: fig5m-drd2-rich-clusters-cs-shock
    agrees: true
    outcome: not_reproduced
    reason: 'Cell 29: none of the 8 readings gives a positive Spearman correlation at p < 0.05 (lowest p is 0.197).
      Average linkage gives one giant cluster (1864 to 1968 of 2036 ROIs).'
    response: Outcome kept; nothing changed.
