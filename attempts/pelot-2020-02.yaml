- claim: literature-comparison-human-pig
  outcome: partially_reproduced
  notebook: reproduce_pelot_2020.ipynb
  output: claim:literature-comparison-human-pig
  notes: 'Of 12 parts under the criterion''s rules, 9 hold: human cervical fascicle numbers (all 7 literature means
    within 6.7 +/- 4.5), human cervical nerve area and diameter below all 7 studies (3.05 mm2, 1.92 mm), diameter
    below 3.0 mm, larger endoneurial proportion (32.2% against 10.8 and 12.9%), fewer human subdiaphragmatic fascicles
    than Stakenborg et al. (4.9 against 16), pig fascicle numbers (46 and 43 within 46.9 +/- 10.3 and 38.2 +/- 7.1)
    and smaller pig diameters (2.20 and 1.64 against 2.93 and 2.09 mm). Three fail: human cervical endoneurial area
    (0.92 +/- 0.34 mm2; the Seki et al. means 1.32 and 1.84 lie outside), overlapping ranges (six literature diameters
    without SD lie above our largest, 2.55 mm, though 6 of 7 areas overlap), and human subdiaphragmatic sizes, where
    the posterior-branch values of Tailai et al. and Gravgaard lie outside our mean +/- SD; the anterior-branch
    values, which the paper singles out, lie inside.'
  deviations: &id001
  - Literature means and SDs read from files/code/DataPlotting_v4.m of sparc-65 (the values Figure 7 plots, "see
    Supplementary Excel spreadsheet"), matched to the studies by the order of the Figure 7 legend; Supplement 4
    itself was not available.
  assumed: true
