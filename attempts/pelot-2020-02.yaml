inputs:
- what: Sunderland and Bradley (1952) fascicle diameters and perineurium thicknesses, 777 fascicles, used
    for sunderland-reanalysis (deposited by the paper's authors in sparc-65, files/code/Sunderland1984.mat)
  source: SPARC dataset 65 version 8, doi:10.26275/qgja-q7zd
- what: Rat traces (PeriMask, NerveMask, ScaleMask) of sparc-60 version 1, read through Pennsieve Discover's
    file browser at their object versions, for the variants that show how the version differs
  source: SPARC dataset 60 version 1, doi:10.26275/naiu-etls
- what: Pig fascicle masks of four samples in sparc-64 version 1, for the data check
  source: SPARC dataset 64 version 1, doi:10.26275/1ihj-7ufh
outcomes:
- claim: rat-sample-set
  outcome: reproduced
  notebook: reproduce_pelot_2020.ipynb
  output: claim:rat-sample-set
  notes: sparc-60 holds 9 cervical (R16-3, R17-3, R18-1, R20-3 to R25-3) and 9 subdiaphragmatic samples
    (R16-1, R17-1, R20-1 to R26-1), 4F/5M at each level, from 10 Sprague-Dawley rats (5M/5F), 75 to 268
    days, 381.1 +/- 118.4 g. Levels in samples.xlsx agree with the code's sample lists. No extra samples
    are deposited.
- claim: human-sample-set
  outcome: reproduced
  notebook: reproduce_pelot_2020.ipynb
  output: claim:human-sample-set
  notes: sparc-65 holds anti-claudin-1 micrographs (nd2) and nerve, outer and inner perineurium masks
    of 9 cervical and 9 subdiaphragmatic samples, 4F/5M at each level, from 14 subjects; C47-2, C54-3,
    C55-3, C56-3, C63-1 and C57-3 are present. Sexes in subjects.xlsx agree with the code's lists.
- claim: pig-mt-sample-set
  outcome: reproduced
  notebook: reproduce_pelot_2020.ipynb
  output: claim:pig-mt-sample-set
  notes: sparc-64 holds nerve and fascicle masks of 9 cervical and 9 subdiaphragmatic pig samples, 6F/3M
    at each level, from 11 pigs, including P11-1 and P13-1, and no outer perineurium masks.
- claim: pig-if-sample-set
  outcome: reproduced
  notebook: reproduce_pelot_2020.ipynb
  output: claim:pig-if-sample-set
  notes: sparc-89 holds nerve, outer and inner perineurium masks of P9-3, P11-1, P12-1, P14-2 (cervical)
    and P12-3, P13-3, P14-3, P15-3 (subdiaphragmatic), 2F/2M at each level, each one of the MT samples
    at the same level, including P12-1.
- claim: mt-micrograph-collections
  outcome: reproduced
  notebook: reproduce_pelot_2020.ipynb
  output: claim:mt-micrograph-collections
  notes: samples.xlsx gives 37 cervical and 32 subdiaphragmatic human samples from 30 subjects (15F/15M)
    in sparc-61, 21 and 24 pig samples from 12 pigs in sparc-82, and 18 and 9 rat samples from 10 rats
    in sparc-16, with 69, 45 and 36 nd2 micrographs. In sparc-61 the right cervical row sub-48/sam-1 has
    no folder and the micrograph named C48-2 is in sub-48/sam-2, which has no row; it is counted once.
    All 18 analysed samples of each species are in their collection.
- claim: nerve-diameter-anova
  outcome: reproduced
  notebook: reproduce_pelot_2020.ipynb
  output: claim:nerve-diameter-anova
  notes: Reading (a), variance unbounded (JMP's default; subject variance estimate negative), species
    F = 599.6 (p < 0.0001), level F = 11.05 (p = 0.0029), interaction F = 2.45 (p = 0.108), against 577.1,
    11.01 (p = 0.0030) and 2.445 (p = 0.1085). Reading (b), bounded, puts the subject variance at zero
    and gives species F = 264.9, level F = 20.4 and a significant interaction (F = 3.60, p = 0.035). The
    rat traces of version 1 give the same reading (a) result (species F = 598.4).
  deviations:
  - Denominator degrees of freedom by Satterthwaite's approximation, computed from the numerical Hessian
    of the REML likelihood, in place of JMP's Kenward-Roger, which no available Python package implements
    (assumption; mixed.py).
  - Rat nerve diameter is the outer perineurium of the largest fascicle (Methods, Imaging and Image Analysis,
    paragraph 3; DataPlotting_v4.m).
  assumed: true
