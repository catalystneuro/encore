- claim: nerve-diameter-anova
  outcome: reproduced
  notebook: reproduce_pelot_2020.ipynb
  output: claim:nerve-diameter-anova
  notes: 'Reading (a), variance unbounded (JMP''s default; subject variance estimate negative), Kenward-Roger df:
    species F = 587.3 (p < 0.0001), level F = 11.03 (p = 0.0023), interaction F = 2.45 (p = 0.103), against 577.1,
    11.01 (p = 0.0030) and 2.445 (p = 0.1085). Satterthwaite df give 599.6, 11.05 (p = 0.0029) and 2.45 (p = 0.108).
    Reading (b), bounded, puts the subject variance at zero and gives species F = 264.9, level F = 20.4 and a significant
    interaction (F = 3.60, p = 0.035); one reading is enough under the criterion. The rat traces of version 1 give
    the same reading (a) result (species F = 586.1).'
  deviations:
  - Denominator degrees of freedom by Kenward-Roger, the claims file's (JMP's) method, implemented in mixed.py (no
    Python package has it) and checked on balanced synthetic designs, where it gives the classical split-plot tests;
    not checked against JMP. Satterthwaite df shown as a variant.
  - Rat nerve diameter is the outer perineurium of the largest fascicle (Methods, Imaging and Image Analysis, paragraph
    3; DataPlotting_v4.m).
